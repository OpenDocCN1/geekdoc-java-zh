    我喜欢科拉克利（Coakley）的文章，但我讨厌冥想。冥想一直让我感到焦虑，总是触发那种我似乎要错过什么的感觉。它让我想起在挤满福音派或五旬节徒的房间里（我的家人与这一群体有严重的神学分歧，但在小镇上，各种风格的基要派往往混在一起），听到有人大喊：“你感受不到耶稣的灵性吗？”而其他人都在大喊：“是的”，我心里想：“不，我主要是饿了，而且有点紧张”，并想为什么耶稣比我更喜欢所有人。这又是另一个话题，别人对此说：“你快接近了！你快接近了！”而我自己的体温却保持不变或下降。上帝为什么要给我一个嘈杂的大脑，然后又让我安静它？我嘈杂的大脑在大多数时候感觉是我能给世界的全部。


    于是我们阅读了科拉克利并进行了讨论，我说这多么讽刺：我喜欢这篇文章，接着又用我惯常的强度去抨击冥想和正念，概述了我对泛神秘主义的挫败感，并以我喜爱的口号结尾，“我想我是宗教的，但不灵性。”然后一个从未参加过该小组的年轻人说：“这太迷人了，因为冥想是唯一让我对上帝的存在产生稍微开放的事情。”我请他多说，一方面是因为我希望有人为了小组的好处挑战我的观点，另一方面，正如我想当这个话题出现时总是那样，我私下里希望他能解释其中的秘诀。那个年轻人说了许多很有帮助且智慧的话。他没有揭露秘诀。我不认为那个秘诀是可以揭露的。


    他说，其他事包括，冥想让人更完全地临场。我一直在好奇完全临场是否真的具有任何灵性价值。难道重点不在于你想要更多的上帝，而不是更糟糕的你自己吗？


    然后，几天后的几个早晨，我醒来想着《烦恼》（Bothered），那是来自辛那提的小乐队“越莱河”（Over the Rhine）的一首歌。和同一乐队的《后世》（Latter
    Days），那首歌是我经历过的或许两个或三个神秘体验之一。在《后世》中，幻象在我第一次听到它时就瞬间降临了。我当时是一个极其感性的年轻人，处于一段对我很重要的关系中，那首歌安慰了我，这件事将以一种极其痛苦的方式结束，正如我怀疑它会那样，而那种剧烈的悲伤——连续几周的沮丧到我无法睡眠，几乎无法呼吸，就像腿上的一道口——是一个美丽且重大且快乐的织锦的一部分，无法从中移除。（现在回想起来，这被证明是真的。）


    另一方面，通过《烦恼》，这种经历似乎在我生命中逐渐展开，因为在那段关系之后，我的身体似乎在没有征求我的情况下将抑郁换成了焦虑，我变成了一个极其紧张易怒的年轻人，而不是一个极其忧郁的青年。在每天的每一刻，我都觉得自己错过了某些点，在某种本质的精神层面上我已经失败了，我无法停止拆解生活的衣物，试图弄清楚我在哪里搞错了。我一直以控诉般的强度质问自己，我“到底”在感受什么，或者为什么我没有感受别的东西，这就像用力摇晃雪球，然后试图看清里面有什么。你的感受变得太混乱、太堆积，看起来不像任何特定的东西，这让你觉得里面根本什么都没有，你是一个世界可以除之快的邪恶空壳。你试图震惊自己来产生某种感觉。你一遍又一遍告诉自己，用一种最终的、“这次我是真的要离开你了”的语气，“你什么也感觉不到，你这个混蛋，”希望这种说辞能像皂剧角色身上引发的那样突然崩溃，因为那样你就知道自己终究是有感觉的，你是人类。


    我这样度过了大约七。我的核心部分似乎丢失了；我只经历了发生在我身上事情的10%，而我的其他部分像投递错的邮件一样环绕世界，我必须去寻找它们却不知道该从何开始。《烦恼》在所有嘈杂中一直是一个灯塔；它聚集并象征着某种东西。（越莱河至少录制了三次；只有1997年的钢琴引领版对我具有那种强度。）或许，为了让上帝的体验开始，你必须把更多的自己聚在一起，无论这项任务是多么不受欢迎。你必须像收麦束一样收集你的自我并将奉上。


    3 不是所有的基要派都是加尔文主义者，也不是加尔文主义者都是基要派。（在一方，考虑“自由意志”浸水教徒。在另一，考虑玛丽莲·罗宾逊或卡尔·巴特。）然而，无误性的想法产生于加尔文主义的背景下，这两个群体的历史涉及大量的重叠。


    ## 如何关怀：关于马克·费舍


    马克·费舍（Mark Fisher）于2017年1月13日星期五自杀，那是诅咒年里的一个诅咒日。然而，他的学生下周一如常出现在教室，加入了费舍的一些前学生和许多朋友。“二十人的班级翻了一倍，也许三倍，”马特·科库恩（Matt
    Colquhoun）在《后资本主义欲望》（Postcapitalist Desire）介绍中写道，这是九月出版的费舍最后的讲义。“熟悉与陌生的……在一个极其悲惨的周一早晨聚集在一起，等待费舍本人走进门来揭穿他的骗局。”他们怀念、哀悼，并在下周一和之后的周一再次聚集。他们读完了费舍剩下的剩下的以及之外。这个小组被称为“无变为有”（Nothings
    Into Somethings）。科库恩在今年出版的《出口：哀悼、忧郁与马克·费舍》中更详细介绍了他们的故事。）


    巧的是，费舍早已写下了描述这些学生和朋友所事的完美短语，并将其投入了一篇关于他人书籍的博文中。他是在2005年写下的，当时大多数了解的人只知道他是一个大学教学工作的冷门博主，一个浸淫90年代文化理论术语以及80年代早期英国评论家如伊恩·克斯（Ian
    Cox）和保罗·莫利（Paul Morley）那种流光溢彩的互文风格中的作家。（这些人物的美国对应可能是格雷尔·马库斯。）在博客的一篇文章中，他写道：“我写或参与过的几乎一切，在某种意义上都是试图对后朋克事件保持忠诚。后朋克：不是那种过去被称为朋克摇滚的响亮、多彩、简单、虚无主义的音乐，而是紧随其后的那种奇异且带有预兆的音乐，那些占据了朋克所创造可能的艺术家们——Joy
    Division、Mekons、The Fall、Raincoats、Wire——将朋克的‘无’变成了‘有’。”

