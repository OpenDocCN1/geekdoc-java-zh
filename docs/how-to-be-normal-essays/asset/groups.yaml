    good but not too challenging,” while for Angelica Jade Bastién, it’s a show that


    prioritizes “visceral experience and pleasure” over “the intellectual.” (Like


    several other critics, Bastién mentions the violent, visceral, and easy-to-follow


    crime drama The Sopranos as an example of a highbrow show.)


    As for books, Beth Driscoll summarizes middlebrow literary culture in terms


    of “eight key features”:


    Every aspect of the literary middlebrow has most of these attributes: the


    middlebrow is middle class, reverential and commercial, feminized,


    mediated, recreational, emotional and earnest.


    For Driscoll, these attributes lead to what she calls “a therapy-centered ethics


    of reading” and what I would call a poetics of moral uplift. The reader


    identifies with the characters; the reader learns from the characters’ choices.


    This is more or less the argument John Gardner made in On Moral Fiction


    (1978), a book that some have labeled middlebrow, but that—given Gardner’s


    aggressive argumentative and personal style, among other traits—few have


    attempted to feminize. (It might be interesting to try.)


    My point is not to mock any of these examples. Those of us who write


    cultural criticism must use fuzzy concepts. And the same intellectual inertia


    that leads people to say, with no guilt and no expectation of judgment, “James'
