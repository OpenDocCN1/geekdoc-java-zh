    ## HOW TO BE CULTURED (II): MIDDLEBROW


    - lordly fashion: The earliest usage I could find of any of the three brow-words,
    in the English Dictionary, was George Eliot’s reference to “gentle maidens and
    brave men,” and that, recently found a Harvard anthropologist assuring his readers
    that “compared with the other Nordics, the forehead is relatively straight and
    the ridges are greater.” See Carleton Smith, The Races of Europe (New York: Macmillan,
    1939). This is not to deny that artistic reputations are shaped by social structures,
    as they are by many things. For a helpfully nuanced account of artistic reputation
    and the idea of canons, see Samuel Delany, About Writing (Middletown, CT: Wesleyan
    University Press, 2005), 337–374.

