    sense, often is. For that reason, I am not that interested in trash as such, though
    I admire some films thus labeled. Nor do I care, except sociologically, about
    the values assigned to varying brow placements. A lowbrow good movie is just a
    good movie. (Dawn of the Dead, the 1979 version, is a good movie.) The particular
    kind of badness I like is the film that is childish or incompetent—what it does,
    it does inadvertently.


    Some bad movies, for example, reveal through sheer lack of self-awareness the
    incoherencies and solecisms of the culture that produces them. These sorts of
    movies fascinate me in the way a too-honest idiot does after he’s had three or
    four drinks. Red Dawn (1984) is notoriously enjoyable in this way. More recently,
    Ava DuVernay’s adaptation of A Wrinkle in Time exemplifies this sort of badness.
