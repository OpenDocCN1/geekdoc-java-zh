    Indeed, even during Bacon’s Rebellion, this dynamic was already partially in place;
    the battle was part of a power struggle between two colonial lordlings, one that
    involved, among other issues, the euphemism known as “Indian policy.”


    This strategem is also not new. Perhaps it is as old as authority itself. But
    it soon found scientific justification in the work of all those European skull-fanc-fanciers.
    It lost, at least for its perpetrators, the stench of sheer opportunism, and became
    an “objective” fact about the world. With modifications and—thanks to technological
    development—far more lavish inducements, in both directions, this strategy continues
    to work today.


    There is your whiteness: a vast, flimsy thing. With a few dozen reading hours,
    a smart teenager could debunk it. Millions have seen through it without being
    able to read at all. And yet how much of American democracy—which truly is a great
    and unique historical achievement, the destruction of intra-European class and
    race distinctions that must have seemed as immovable in their time as white supremacy
    does now—rests on it? Perhaps Europeans, stepping off their different boats, could
    have learned to see each other as human beings even without positing a second
    category of person onto which they could project their hatreds and fears. We can’t
    know; that is another, sweeter history. This is ours.


    Our literature contains little memories of how contingent it all is: a dream is
    only convincing while you’re in it. In George Schuyler’s novel *Black No More*
    (1934), a crank scientist invents a process by which Black people can be turned
    white. This trope, which also appears in Stephen Wright’s *The Amalgamation Polka*
    (2006), both literalizes and reverses the actual history in which pseudoscience
    and opportunism worked together to whiten billions, many of them after the fact.
    (Was Homer “white”? Was Augustine?) Processes can be reversed. During the Trump
    era, Latinx people lost several degrees of whiteness more or less overnight. Among
    committed white supremacists, there is always the danger that old intra-European
    racial divisions will resurface and the lordly Anglo-Saxon will once again seek
    to rise above the scheming Spaniard, the passionate Italian, the potato-headed
    Celt.


    Whitening is a process without an obvious endpoint. “Whiteness” is always somewhere
    out a bit ahead of you—even white supremacists lament the somewhat desiccated
    state of today’s whites. The concept is impossible to define in terms of traits
    because describing anything was never its function. And yet everybody tries. Sometimes
    this means taking the white supremacistist’s definition of whiteness—rational,
    brave, scientific, humanity’s future—and simply asserting that these things are
    bad: for example, antiracist museum exhibits that list “rugged individualism”
    and “emphasis on scientific method” among the sins of whiteness. (The museum in
    question later apologized.) It takes boldness to position whitened people as particular
    valuers of rationality and individualism in a historical period when millions
    of them are turning their minds over to an emerging cult based literally on internet
    forum posts, or flinging themselves and their families at the COVID-19 virus as
    though it will be cowed by their bravery and walk off. This behavior was not transmitted
    genetically; it’s the product of the specific toxic individualism of the suburbs.
    Few people who aren’t whitened would be allowed the level of privilege where they
    could learn to think like this; this doesn’t make it a “white trait.” Millions
    of white people, again, can’t identify with it at all. In other cases, one attempts
    to describe “white people” by fastening onto characteristics that have to do with
    class or region or ethnicity, or with the necessary blandness of mass culture
    products. When people talk about “white people food,” they talk about what Norwegians
    eat or what the Irish were forced to eat or what McDonald’s produces, not what
    Italians or Spaniards eat.


    On the fringes of Black radical thought, one finds the clearest and closest-to-coherent
    articulations of the white man’s special qualities. These stories, at their falsest,
    retain a certain crude power—the power of the sharp and specific pain behind them.
    I find, for example, the theory that I am the product of an ancient scientist’s
    breeding experiments deeply insulting, as I am surely intended to, but after spending
    enough time observing the impersonal cruelty and stupidity of the bureaucracies
    that maintain, among other things, the illusion that whiteness exists, even I
    have appreciated the explanatory value of old Dr. Yakub. Similarly, I can see
    how a person whose most frequent encounters with whitened people involve cops,
    prison officials, or other contemptuous functionaries might find an intuitive
    plausibility in the idea that lack of melanin makes people weak, cruel, and resentful.
    (Something sure as hell did.) One afternoon, as I left a courtroom where I had
    watched a Black friend get railroaded, I found myself thinking the words, I hate
    white people.


    It’s revealing as well how often these theories both dovetail with and resemble
    anti-Semitic mythology. Theologian J. Kameron Carter argues that Western Christianity’s
    rift with Judaism, and the anti-Semitism that resulted, was an intellectual and
    spiritual precondition for modern racism. In a deep historical irony, however,
    one of the most consequential uses of anti-Semitism was as a scapegoat onto which
    the European perpetrators of capitalism could deflect the blame for their own
    depredations. The story of the rise of international banking owes much to the
    Fuggers and Medicis, but you rarely hear of the former, and we mostly know the
    latter as a family of titillatingly debauched art enjoyers. When it comes to financial
    speculation, its invisible powers and corrupting effects, the name everyone knows
    is “Rothschild.” When you need a racial explanation for the specific horrors of
    international capitalism, you tell a story of secretive, powerful, cunning, and,
    in some essential way, soulless men. You call them the white man, or you call
    them the Jew. Sometimes you do both.


    In more mainstream forms, such attempts to define whiteness as pathology often
    focus on the character traits that accrue to “unearned” privilege. (As soon as
    we say “unearned,” we have baked in the idea of meritocracy—which is some white
    bullshit.) The white person, especially the white man, is inescapably mediocre,
    as if by hereditary taint. She or he or they are entitled, neurotic, fragile,
    narcissistic, vain. He is named Bryce or Heath or Connor and wears shorts in the
    winter—so severed is he, at a basic level, from the truth of things. (Perhaps
    he just doesn’t care if his knees are cold.) She is named Karen unless her hair
    is good.


    This approach, too, has a crude descriptive power. Stereotypes often do. In an
    extension of this process, “white” becomes a name for certain varieties of bad
    politics: the conservative, the nationalist, the NIMBY progressive, the can’t-we-talk-about-this-later
    socialist, the you-looked-at-me-so-I’m-calling-the-cops feminist. In all these
    cases, “white” functions as a name for a kind of secular American freedom: freedom-from
    that has become freedom-over. It’s the freedom of the minor aristocrat—this being
    the type of person who gave us far too much of the Enlightenment political thought
    that permeates our institutions—or the freedom of the children of the southern
    rich, the group that disproportionately, has given us that bizarre and misnamed
    American political tendency known as “libertarianism.” (The word has a far nobler
    meaning in European contexts.) The libertarian is, spiritually speaking, a plantation
    owner’s son. He wants his taxes lowered, his employees free to work for free,
    and—with an eye toward those employees’ daughters—his age of consent abolished.
    His freedom requires that no one else be free of him. Given that the forms and
    shapes of exploitation are likely to shift in a world that America no longer dominates,
    this is important to keep in mind.

