    “Bond movies are my guilty pleasure,” tends to lead American cultural critics
    (though not all my examples are American) to define their own preferences by defending
    them, to construct whatever we like against a snobby, dominant enemy. We are Americans;
    our national myth is Footloose. None of us can enjoy our pleasures till we think
    someone wants us not to have them.


    What does intrigue me about the use of the concept of middlebrow, in these and
    other writers, is that they write of it with a warmth and respect that one can
    barely imagine anyone bringing to the concept of the highbrow as such (though
    people do write lovingly about particular highbrow works). It is hard to coax
    a single definition of middlebrow out of all these essays, but there are a few
    threads we can pull together. Middlebrow unifies; it mediates; it educates. It
    addresses both heart and mind. (So do opera, ballet, epic poetry—but once we’ve
    called something “highbrow,” we no longer need to look at it.)


    Middlebrow is good for you. All of these writers frame middlebrow as a thing in
    need of defense, even though the specific works they want to defend are quite
    safe—safer than the opera, the ballet, or the long, allusive, heady, postmodern
    novel. They talk about middlebrow in the way we talk about things we feel in danger
    of losing through a failure to appreciate them. How did a word that sounds like
    an insult come to acquire such emotional coloring? To answer that question, we
    must look to its history.


    Most authorities credit a writer for the magazine Punch with first using it in
    print, in 1925, but an author of advice literature named Margaret Slattery gave
    a speech titled “High-Brow, Low-Brow, and Middle-Brow” in 1922, just beating Punch
    to the punch. A word that marks distinctions of pedigree, middlebrow is itself
    of uncertain parentage. In “Middlebrow,” an unsent 1932 letter to the New Statesman,
    which Leonard Woolf included in the posthumous collection *The Death of the Moth
    and Other Essays* (1942), Virginia Woolf depicts an idealized relationship of
    mutual dependence between high- and lowbrows, menaced only by the “busy-bodies”
    in the middle. A Woolfian highbrow, who “rides his mind at a gallop across country
    in pursuit of an idea,” needs the lowbrow, who “rides his body in pursuit of a
    living at a gallop across life.” Who else will press the highbrow’s suits, drive
    his car, fight his wars? And the lowbrows in turn need the highbrows, for without
    highbrows they will not have movies to go to. “It is one of the prime necessities
    of life to [lowbrows],” Woolf writes, “to be shown what life looks like” via art.
    She treats this arrangement as one of mutual satisfaction, even love. “I love
    lowbrows,” she writes. (To a reader of Woolf’s journals, which endlessly record
    her exasperation with various servants, this announcement comes as a surprise.)


    Woolf blames middlebrow people—“the man, or woman, of middle intelligence who
    ambles and saunters now on this side of the hedge, now on that, in pursuit of
    no single object, neither art itself nor life itself”—for introducing disharmony
    to this once cozy relationship. She condemns them in terms that any student of
    social movements will recognize:


    “Have I then made my point clear, sir, that the true battle in my opinion lies
    not between highbrow and lowbrow, but between highbrows and lowbrows joined together
    in blood brotherhood against the bloodless and pernicious pest who comes between?
    If the B.B.C. stood for anything but the Betwixt and Between Company they would
    use their control of the air not to stir strife between brothers, but to broadcast
    the fact that highbrows and lowbrows must band together to exterminate a pest
    which is the bane of all thinking and living.”


    This is how factory owners talk about labor organizers, how southern gentlemen
    talk about “outside agitators.” It has that unmistakable note of a person who
    mistakes an exploitative stalemate for an ecological balance. What does Woolf
    find so objectionable about these people in the middle? She writes with such an
    aristocratic high-handedness—that air of “If you have to ask what I mean, you’ll
    never understand” that defines the truly pernicious sort of highbrow—that it’s
    hard to tell. She mentions that middlebrows live in South Kensington. She says
    they are “betwixt and between” several times. She comes closest to landing a solid
    blow when she argues that their interest in cultural matters is “mixed indistinguishably,
    and rather nastily, with money, fame, power, or prestige.” In making the argument,
    she commits the same fault. “I like culture purely,” she says, but I must object
    to these South Kensington interlopers who like it less purely than I do. If she
    did not share some of their interest in “money, fame, power, or prestige,” she
    would not care so much about the diluted quality of their devotion. As a person
    must already be a little cynical to detect the cynicism of others, we we possess
    at least a bit of cultural status-consciousness to label someone else “middlebrow”
    in Woolf’s sense.


    In any case, the strong distinction Woolf posits—between people who love art and
    learning for their own sake and people who just want to be sure they’re doing
    it right—is psychologically untenable. I like learning, and I prefer to do things
    well rather than badly, insofar as I can, determine what “well” means. (In this
    domain, no one finally.) At some point in my pursuit of learning, I will turn
    to others’ judgments. These are terrible solutions to the problem of self-education,
