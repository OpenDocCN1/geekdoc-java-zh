    whiteness is to put the cart before the horse. “Convening power” is precisely


    what “whiteness,” as compared to “Blackness,” lacks. The concept “Black” has


    called people together to be exploited, stolen from, and abused, but by that


    same token, it has called them together to survive. “Whiteness” is something


    you call people, but you don’t use it to call them together, except to do crimes


    and bury the evidence. And it can easily function, has often functioned, by


    calling together a minority, even of the people who it names “white” for this


    purpose. (The percentage of the American population that genuinely loves


    Donald Trump is a rump. Out of a hundred white people, it only takes ten

    Klansmen and seventy bystanders and thirty troubled but distracted and

    disorganized dissenters to keep the entire system going.) Whiteness has not laid


    a common burden on people’s shoulders. The myth of whiteness is simply that

    one is human, and that this fact is more interesting than any particulars. But


    this myth is also a truth, made untrue only when I fail to acknowledge that it’s

    also true about everybody else. “Whiteness” designates only a common absence


    of oppression. Into that absence, every human thing, everything that makes me

    both a member of a species and a particular being, falls. It’s too much to make


    a people.


    The one universally binding experience of whiteness might be this: that racism


    exists as a possibility for you, even if it’s one you work not to express. It’s
    like a


    Chomskyan Language Acquisition Device for evil. I’ll give an example,


    although it is a humiliating one. I grew up in an extremely small, mostly white


    town—I explained the near-absense of Black people, when I thought about it,

    by the theory that I wouldn’t live there if I could help it either. Because my

    consumption of pop culture was somewhat limited by my circumstances as a

    fundamentalist, and because my homosocial bonding was limited by my late-

    developing social skills, I never learned that I am supposed to feel threatened

    by sexual competition from Black men, nor that I am supposed to take it as

    axiomatic that I am sexually ill-equipped compared to them. I learned that I

    am supposed to feel this way—I swear before God that this is true—from

    reading, as a college student, in the Nation, a review of a book that debunked

    this and other harmful myths. Of course, the minute that I learned that this

    was a way that I should somehow both feel (as an American) and not feel

    (because it’s a myth), suddenly the paranoia was there, fully fledged. I had been

    absorbing various other mythemes about Black people—good at athletics;

    good at fighting, therefore highly physical; et cetera—from the culture, and

    this detail slid in amongst them; my mind didn’t have to stretch to fit it. I’m
    a

    capitalist subject; I’m a sucker for a new insecurity. From then on, this dumb

    idea existed in my mind the way an optical illusion does after you’ve seen

    through it: still there to be ignored.


