    CREDITS AND ACKNOWLEDGMENTS


    Part of the essay of “How to Be Normal” appeared in the November 2020


    edition of the Christian Courier, where it was edited by Brian Bork and Mike


    Buma, with whom I wish I were drinking a beer this very instant.


    “How to Be White” first appeared in Breaking Ground, April 9, 2021, where


    it was edited by the crack team of Susannah Black, Anne Snyder, and Heidi


    Deddens. It also includes trace elements of reviews that I wrote of Ta-Nehisi


    Coates and J. Kameron Carter for the Christian Courier in the mid-2010s for


    the absolute queen Angela Reitsma Bick.


    The essays on masculinity, bad movies, and middlebrow were first published


    in Hedgehog Review in the issues for Summer 2018, Fall 2019, and Summer


    2021, respectively. They were commissioned and edited by B. D. McClay, the


    finest essayist of her generation.


    “Faith” was first published in The Outline, August 8, 2018, where it was


    edited by the incomparable Brandy Jensen.


    “Fundamentalism” includes part of a review that first appeared in the


    Christian Century, August 4, 2020, where it was edited by the nonpareil


    Elizabeth Palmer.


    “How to Be Married” cannibalizes part of a review that I also wrote for my


    pals at the Christian Courier, but I can no longer figure out when. Oh well.


    “How to Care” was first published as “Mark Fisher” in Commonweal,


    December 3, 2020, where it was edited by my beloved brother in Christ, Matt


    Sitman.


    “How to Be Midwestern” was first presented at “Finding the Lost Region


    IV,” the fourth annual conference of the Midwestern History Association, at


    the kind invitation of the very smart Jon Lauck, June 6, 2018.


    Thanks most of all to Ashley. Thanks to my dedicatees; to the family and


    friends I thanked in my last book; to the Galarza-Sepulveda squad; to the'
