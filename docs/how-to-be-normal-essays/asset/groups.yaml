    “白人身份”是本末倒置的。“号召力”正是“白人身份”相比于“黑人身份”所缺乏的。“黑人”这一概念曾召唤人们聚在一起遭受剥削、被掠夺和虐待，但同样，它也召唤他们聚在一起为了生存。“白人身份”是一种你召唤别人的东西，但你不会用它来召集他们，除非是为了犯罪和掩埋证据。而且它可以很容易发挥作用，也经常通过召集少数族来发挥作用，即使这种为了包含了被它命名为“白人”的人。（真心爱唐纳德·特朗普的美国人口比例极少数。在一百个白人中，只需要十名三K党分子、十个旁观者和三十个不安但心神不定且缺乏组织的异议人士，就能维持整个系统的运转。）白人身份没有在人们肩上承担过共同的负担。白人身份的神话仅仅是人性的，而这一事实比任何细节更有趣。但这个神话也是真理，只有当我未能承认这一事实对其他人同样真实时，它才变得不再真实。“白人身份”仅指了一种压迫的共同缺失。进入这种缺失中，每一个人类的事、每一个使我既是物种的成员又是特定个体的事物都落入了其中。这还不足以构成一个民族。


    白人身份唯一的普世约束性经验可能是这样的：种族主义对你来说是一个可能，即使你努力不去表现它。它就像一个针对邪恶的乔姆斯基式的“语言习得设备”。我举个例子，尽管这令人羞愧。我在一个极小的、大部分是白人的小镇长大——每当我思考这个问题时，我将黑人的几乎不存在解释为一种理论：即如果可以的话，我也不会住在那里。因为我作为一个教条主义者，对流行文化的消费受到环境的限制，而且因为我晚发展的社交技能限制了我的同性纽结，我从未学过应该应该对黑男的性竞争感到威胁，也没有学过应该理所当然地认为与他们相比，我在性上力不从心。我学到我应该这样感受——我向上帝发誓这是真的——是因为我作为大学生，在《国家》（The
    Nation）杂志上读到的一篇揭穿这一及其他有害神话的书评。当然，当我意识到这是一种我应该既（作为一个美国人）感到又不（因为这是一个神话）感受的方式时，那种偏执症突然完全爆发了。我此前一直在从文化中吸收关于黑人的各种其他神话母题——擅长运动；擅长打斗，因此极具肉体；等等——而这个细节就滑入了这些母题之中；我的大脑不需要费力去契合它。我是一个资本主义主体；我是一个对新的不安全感极易受骗的人。从那时起，这个愚蠢的想法在我脑海中存在的方式，就像你看穿错觉后的错觉一样：它依然在那里，任其被忽视。


    这并不是说白人不对我们的观点负责。我认为每个人的脑海都像一个杂货店，装满了美丽和糟糕的想法、图像、可能性、幻象以及它们的所有对立面，这些都是我们从世界中吸收的。（心理学家可以谈论“不安的”、“侵入的”或“不想要的”想法，正是因为我们并不想要在大脑中发现的每一个东西。）你必须从你的杂货店里尽可能做出最好的东西。同样，政治运动和组织者作为道德和精神领袖，有责任通过最好的思想来磁化人们，将特定的思想带到一群人脑海的前沿，让他们那些不高尚的思想落灰。绝大多数白人脑子里某处可能都藏着一个反黑人偏见者的雏形——即使黑人也在与内化的反黑主义作斗争。偏见机器的各个也存在于他们的脑子里。同样，任何异性恋男性如果不小心，都可能变成一个暴虐的施虐者。以此类推，甚至包括那些被压迫得如此程度，以至于下面没有阶梯可爬的人。他们踢狗。


    但即使是种族主义也无法成为让“白人身份”成为有用概念的统一特征。反黑人主义意义上的种族主义，正如我之前提到的，是一件连黑人也必须斗争的事情。“认为种族是真实的并按等级排列的信念”意义上的种族主义，正如我们所看到的，也是包括黑人在内的许多群体中存在的特征。针对其他群体的种族主义以及其他偏见也可以出现在每个社区中，包括黑人社区，尽管当黑人整体仍然明显处于美国阶梯的底端时，特意强调特定的黑人偏见在道德上是迟钝的。（这就是为什么讨论黑人恐同症等问题是令人反感的。我们可以承认它的存在，但将其与一般的恐同症区分开来，就像是在谈论“黑人的犯罪”：暗示如果是那些人做会更糟。）学者诺尔·伊格纳蒂夫（Noel
    Ignatiev）对白人身份的问题有一个非常简单的解决方案。白人必须仅仅拒绝被收买，即使这意味着，例如，与管理层达成一种“先入后出”的交易。白人必须回应对黑人的攻击，就像回应对自身的攻击一样。（如果你不断提醒自己，正如白人盟友应该做的那样，你永远无法理解这种痛苦。）白人通过这样做失去的，很快就能赢回来，当整个工人阶级不再分裂并变得足够强大时，还会更多。在这种颠覆产生的世界里，种族类别将消失，民族差异将恢复真实的比例，或者至少是不同的比例。微侵犯，由于它们不再携带那种可能杀死你的巨大系统的提醒，在最坏的情况下将变成被误解的常态痛苦。居住隔离在一方失去刺痛，在另一方失去意义。


