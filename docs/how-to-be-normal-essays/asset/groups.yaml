    town to see a revival screening of King Kong Lives (1986), a film so ridiculous
    that the distributors refused to allow Siskel and Ebert to show clips of it on
    their television program. I stayed up late, finding and downloading the bits and
    pieces of a torrent file of the 1982 Turkish fantasy film Dünyayı Kurtaran Adam
    (The Man Who Saved the World), known in Anglophone countries as “Turkish Star
    Wars” because of its unauthorized and awkward splicing-in of actual Star Wars
    footage. I lost my wallet, not inappropriately, at a showing of The Dragon Lives
    Again (1979), a surreal festival of copyright infringement in which an actor playing
    (though not resembling) a resurrected Bruce Lee fights characters named the Godfather,
    the Exorcist, Popeye, James Bond, and Dracula, among others. I came to love Twilight
    (2008), with its hermetic vision of human psychology and conversation, its endearingly
    transparent wish-fulfillment aspects, its inexplicable baseball game. After it
    left theaters, I marveled at Batman v. Superman: Dawn of Justice (2016), that
    filmic analogue of a moody teenager hilariously incapable of remembering why he’s
    moody.


