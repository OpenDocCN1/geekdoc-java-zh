    ## HOW TO BE RELIGIOUS (I) FAITH


    I am certain of a few things. I am certain that the climate is warming, that my

    neighbor’s cute dog is wasted on my neighbor, that Donald Trump has never

    extended genuine kindness to a child. I am not certain of the words I say every

    Sunday in church. I try to believe them, to act as though I reside in a world

    where they are true. Amid doubt and weariness, I live my way into them.


    I don’t relate at all to the motive that is most commonly assigned to religious

    belief and practice: that faith cultivates a sense of certainty in a complex world.

    Some people are crude enough to say this to your face; every religious person

    will recognize Dorothy Fortenberry’s description of the “kind, patronizing”

    people who say to believers, “I wish I could have that certainty.” More often,

    though, the assumption is simply baked into the way we talk about religion in

    public life. Think, for example, of the journalistic commonplace that people

    turn to religion during times of social instability. (Are there times of social

    stability?)


    The problem with the statement “Religion offers people certainty” begins

    with the subject. The word “religion” is like America’s power grid: buggy,

    incoherent, unavoidable. If we look at the textbook “world religions”—

    Christianity, Islam, Judaism, Hinduism, Buddhism, Sikhism—we find them

    doing different jobs, posing different questions. Some stress ritual and practice;

    some require assent to creeds. Some transcend place; others name a long

    loyalty to a place or culture. They conceive time and history differently.

    Buddhism is a beautiful transcendence of human misery, Christianity a

    beautiful rupture in it.


    Nor can we define religion—as so many peddlers of this platitude do—in

    Whig history style, as the vague bit of territory not yet fallen to science’s

    explanatory empire. Science, at its most useful, is a set of methods, not a

    worldview. It can tell us that a particular section of an MRI lights up when we

    watch a video of people being nice, but not whether Jesus was right when he

    said that it’s better to give than to receive. When scientists address

    philosophical and metaphysical questions, they become pundits, often bad

    ones. One need only look to poor, doddering Richard Dawkins, everywhere

    beset by Muslims, women who prefer not to be harassed at conferences, and

    nefarious agents of the state out to confiscate his honey, to concede that

    the scientific method hasn’t cracked the question of how to live.


    One of the foremost contemporary thinkers on comparative whatever-all-

    this-stuff-is, the anthropologist Talal Asad, suggests that the very category

    “religion,” when treated as an essential thing that shows up in different places

    and times under different guises, is implicitly imperialist because that category

    originally arose as a way to talk about the proliferation of sects within a rapidly

    secularizing Europe. It doesn’t apply equally well everywhere. During the

    Enlightenment, according to Asad, you start to see arguments—unintelligible

    in other parts of the world, or in Europe a century earlier—that take for

    granted a separate, private, optional sphere of meaning and belief. That sphere

    is “religion,” which exists outside of, or has little relationship to, politics
    or

    the economy or sociability. But this category doesn’t work in other times and

    places or for every way of believing. Given Asad’s argument, perhaps it’s no

    surprise that the “religion” we tend to mean when we say that religion confers

    certainty is one of the monotheisms with which Europeans were already

    familiar. Nobody looks at their Buddhist friends and says, “I wish I had their

    certainty”—though Buddhists, like all of us, take some things as axiomatic for

    the purposes of thinking. They don’t tell you why you should want to bore

    yourself silly becoming “mindful”; their discourse just assumes it.


    Indeed, a long philosophical tradition links believing in a single God with

    violent fanaticism. This idea goes back at least to those Roman aristocrats who

    didn’t understand why the Israelites didn’t love being conquered and extends

    through Enlightenment philosophes to contemporary intellectuals like

    Egyptologist Jan Assmann and biblical scholar Mark Smith. The argument

    usually boils down to this: Polytheism leaves room for the universe to be messy

    and multiple, monotheists insist on enforcing a single truth; ergo, violence.

    History’s verdict on this thesis is mixed. The ancient world was rough enough

    before anyone heard of Moses, and the scariest people in modern America get

    weirdly excited about Norse gods. The Enlightenment philosophes who

    adopted these ideas in recoil from the so-called “Wars of Religion” were

    themselves complicit in the violence of empire. Nor is the logical link obvious:

    a universe of personified forces locked or “balanced” in eternal contention

    sounds like a perfectly good pretext for war, mostly because it is war. In my

    experience, fanaticism can happen anywhere, about anything.


    “Ah,” I can hear you saying, “but what about fundamentalists? They seem

    pretty damn certain.” Indeed, they do. But the things that unite the huge,

    loose, often mutually opposed groups we call fundamentalists aren’t always

    religious doctrine. When it comes to Hindu fundamentalism, for instance,

    we’re really talking about a political movement. As for Christian

    evangelicals, fundamentalists, and Pentecostals (not the same categories,

    though they overlap), they can look like hypnotized mass. But if

    you’ve been inside—I was raised in, and my teens was quite devoted to,

    General Association of Baptist Churches—you know that sense of confidence

    is embattled and must be continually renewed. When well-meaning atheists

    express a wistful envy about the certainty of faith, what they are

    imagining is that imparts some comfort or peace. But the loudest fundamentalists

    are also among the least comfortable and most aggrieved people. And the less loud
    ones people I still remember fondly, who came

    through, more than once, when my dad was out of work—have all had that

    moment in which they asked the pastor earnestly why


    As a religious person, I’m assumed by some of my acquaintances to be in

    denial of that inevitability. It’s the thing I’m supposedly wielding my little

    switchblade of certainty against. Even I once worried this was true. When I

    was in college, with death a speck on my horizon, I’d earnestly ask myself

    whether it was okay to grant myself the comfort of belief in a resurrection. If

    Christianity is true, I’ll someday learn that my ability to persist past that

    ambivalence was divinely willed. If not, I’ll just be dead.

