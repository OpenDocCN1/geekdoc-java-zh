    坏电影


    如何成为文化人 (II) 中产阶级


    如何变得宗教 (I) 信仰


    如何变得宗教 (II) 基础主义


    如何去关怀：关于马克·费舍尔 (Mark Fisher)


    如何进入婚姻


    如何成为中西部人


    正常阅读清单


    版权与致谢


    注释


    关于作者


    ## 作者自序


    我在2018年到2021年间写了这些散文。在某些情况下，我重新利用了一些旧文章的素材。它们都属于“文化评论”或“个人随笔”这一大类——我现在这么说，是为了委婉地告知那些拿起这本书并希望找到一本建议手册的读者。它们以这种或那种方式审视了带有平庸、正常或寻常气息的事物。


    ## 如何变得正常


    在新冠肺炎-19疫情之后，我们与“正常”一词之间有着最奇异的关系。2020年春天，我们会彼此打字承诺，说在“一切恢复正常后”一起去吃晚饭或喝杯啤酒。在“一切恢复正常后”之后，我们以这种或那种方式审视了带有平庸、正常或寻常气息的事物。在“一切恢复正常后”之后，我们以这种或那种方式审视了……的读者。


