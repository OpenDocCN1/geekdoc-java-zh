    workers. In the latter case, it will often enough be true that she is just finishing


    a job that a firm’s white workers started long ago.) Regarding activism, it’s
    a


    utopian pursuit with generally dystopian interpersonal dynamics. As for civics,


    the whole promise of the endeavor—at least under Enlightenment liberalism


    —is that it doesn’t require love. Part of what a secular antiracism necessarily


    aims at is a world where Black people could, if they wanted to, ignore white


    people safely, as millions of white people lead reasonably contented lives


    without reading, dating, or seriously befriending any Black people. Antiracism


    must also secure for Black people the right to be, without punishment, as


    irritating, mediocre, or dysfunctional as, say, a reasonably prosperous suburban


    white man may be. These are legitimate goals which, as far as they go, any fair-


    minded white person must try to help bring about. My point is only that such


    a world—in one way radically transformed, and in another way depressingly


    the same as ours—makes for an odd conclusion to a ritual modeled on the


    supposedly universe-changing rituals of evangelical salvation. The critique I


    make by pointing out the religious character of the ritual is simply that of a


    mismatch between ends and means. But white people who respond like newly


    evangelized subjects to an evangelical ritual are not “centering themselves”;


    they are following the instructions buried in the situation.


    The people who will inflict this kind of psychological self-harm upon


    themselves fall, in my experience, into two camps, which sometimes overlap.


    On the one hand, there are kindhearted people with pathologically low self-


    esteem, often, and not accidentally, women. They are used to taking the blame;


    DiAngelo’s voice imitates the voice in their own heads. On the other, there are


    people so prosperous that they can afford, in effect, a daily three-minute self-


    hate. The great mass of white people, whose “wages of whiteness” still leave


    them unable to afford their rent, will look at these exemplary flagellants and


    say more or less what working-class city whites used to say about school'
