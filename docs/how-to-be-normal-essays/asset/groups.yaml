    I remember a speaker at our church who, in order to provide evidence for


    his claim that Catholicism was not a branch of Christianity but an ingenious


    occultist’s forgery of same, cited Athanasius’s famous statement, “God became


    man that men might become gods.” He capitalized the second g and removed


    the s, placed it on a slide, and said, “This is official Catholic doctrine.”


    Athanasius, of course, is one of the four or five theologians most central to


    Christian history; for a Christian to thus represent him is to saw his own leg


    off. (The response of church leadership, when I complained, was essentially to


    point out that not everything could be subtle and careful, the way you


    intellectuals like it.)


    I have come to suspect that the people promulgating these sorts of lies


    believe themselves in a spiritual war where words carry a power independent of


    the meanings that readers find in them, or their material effect on history, or


    anything they say. Among the more erudite fundamentalists, one still hears


    about the theories of Alexander Hislop, who in his 1853 pamphlet, The Two


    Babylons, argued that that the Catholic Church was, by the ingenious use of


    various symbols, secretly worshipping ancient Babylonian gods. Again, the


    polysemy of language gives rise to conspiracy theories: the verbal resemblance


    between “Easter” and “Ishtar,” the adventitious reuse of some symbol or icon.


    As with the claims that Led Zeppelin albums contain secret backward messages


    or that Bob Dylan says a blasphemous thing that, with a little adding and


    retouching of syllables, he can be forced into saying, the assumption seems to


    be that language has a hidden layer, which is active despite the conscious


    intentions—or even the actual words—of the person using it. For a person


    who believes that the Bible—the most important book of all time—was


    divinely inspired, that the language poured out of disparate writers at disparate


    time periods in a kind of overturning of their particular personalities and wills,


    such a view of language doesn’t seem like much of a stretch.'
