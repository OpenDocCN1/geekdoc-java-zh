    Confederacy won the peace. Du Mez, in turn, helps us understand how it is that
    many self-described Christians came to not only tolerate, but to like, the kind
    of masculinity that Donald Trump performs. (Trump hates losers; Jesus, we claim,
    broke metaphysics in order to become one.) First, fundamentalists helped themselves
    to the somewhat more inclusive label of “evangelical,” forming the National Association
    of Evangelicals in 1942. (This is a bit like if a bunch of Marxists rebranded
    as a rival campus chapter of the Young Democrats—which isn’t a bad idea at all.)
    But the fused evangelicalism that resulted was, in any case, born into a newly
    ascendant American empire; to win converts, it had to make room for militarism
    and nationalism. The government needed Christian boys to be cannon fodder in Korea
    and Vietnam, so aggression itself was redefined as Christian. By the final chapters
    of Du Mez’s book, this tendency has been carried very far indeed; we find fundamentalist
    masculinity gurus singing hymns to their own testicles and running MMA (Mixed
    Martial Arts)-based outreach ministries. Several of them follow the abstinence
    crusader Elisabeth Elliot into a heretical Christology that eternally subordinates
    the second person of the Trinity to the first—because even Jesus needs a commanding
    officer. Many of them are open grifters. To a person, they support the Iraq War,
    and one of the most influential of them (William Boykin) is complicit in the torture
    of Iraqi prisoners. Also, as Du Mez documents in a thoroughly depressing coda,
    a huge number of them have raped women and children. This is grimly funny when
    you consider how often people within this movement will cite child molesters as
    the argument-ending reason why prison reform can never happen.


    This history, I suspect, leads us to one of those tensions I mentioned earlier,
    the ones that constitute fundamentalism, that cause it to fall into incoherence
    and that then shock it back to life. Fundamentalists are lonely in a crowd that
    consists largely of themselves. They believe themselves under siege in a country
    that exhausts itself deferring to them. They live in a manufactured isolation.
    (Is it accidental that there are so many of them in the suburbs?) So much am I
    still a creature of my childhood that whenever I meet a person who works in an
    even slightly prestigious institution who, on further acquaintance, strikes me
    as a sincere and devout Christian, I am a little surprised—this in a country that
    I know to be hegemonically Christian. It’s because my parents presented our position
    as a rare and besieged one, though our town was so full of people who thought
    more or less as we did that the handful of open atheists in my high school were
    relentlessly bullied. On the evangelical side of their family tree, fundamentalists
    have a memory of those nineteenth-century Christians who died as John Brown did,
    heroes; but they have also inherited the southern, post-Civil War resentment,
    the terror that one is about to be reconstructed out of existence. And like the
    Jim Crow South, they cannot leave their defense crouch long enough to realize
    that they have, as much as any group in a large and complex country ever can do
    so, won. Thus, my father was forced to view with suspicion an artistic form that,
    in many of its forms, would have reinforced many or all of the beliefs he wished
    me to share. (Light rock was, then, already in the process of conquering the low-church
    Christian world and has since become the hegemonic form of music in the precise
    sort of church he favored—much to his chagrin. Meanwhile, the demographic that
    worships “classic rock,” in particular, is ideologically identical to him.)


    Like the nineteenth-century evangelical revivalists who served on the Underground
    Railroad, today’s fundamentalists still occasionally break laws they consider
    unjust. For example, in December of 2016, a man named Edgar Welch rose early one
    morning, packed his AR-15 in his truck, and drove several hours from his home
    in North Carolina to a pizza joint in Washington, DC. There, among other doings,
    he shot a closet door. He was inspired by an online conspiracy theory known as
    Pizzagate, a theory that, like all the most successful such theories, combines
    the impossibly opaque with the sensationally vulgar. Its originators, many of
    whom frequent the message board 4Chan, had been studying the leaked emails of
    various Democratic Party functionaries when they came across references to a restaurant
    called Comet Ping Pong, the site of several Democratic fundraisers. Quite gratuitously,
    these theorists decided that various prosaic phrases within these emails, and
    various mundane images on the social media feeds of people who had “liked” the
    restaurant on Facebook, somehow signified the existence of a murderous child-sex
    ring, in which Hillary Clinton, the founder of the Center for American Progress,
    the performance artist Marina Abramovic, and various other luminaries were all
    involved. After Welch shot open the closet door—he thought it led to the building’s
    basement, which plays a prominent role in the Pizzagate narrative even though
    it does not, strictly speaking, exist—he surrendered to police without further
    incident. “The intel on this was not 100 percent,” he later told the New York
    Times. Friends told reporters that his right-wing turn had begun at church.


    My friends who did not grow up fundamentalist are often surprised and alarmed
    by these sorts of stories. I am saddened by them but never surprised. And here
    we touch on another strange tension that runs through fundamentalism. It is founded
    on an impossibly strict information regime, and yet I have rarely encountered
    a community so incontinent in its transmission of rumors. I first noticed this
    tendency, precisely, as it manifested in the anti-rock polemic to which my father
    subscribed. That the rock group name Kiss was an acronym for “Knights in the Service
    of Satan” was repeated to me more than once by adults as a known fact. Why would
    a conservative Christian, or really anyone, need to invent reasons to hate Kiss?
    We regularly applied, to all sorts of cultural production but especially music,
