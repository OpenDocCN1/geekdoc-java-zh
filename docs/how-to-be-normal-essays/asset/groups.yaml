    irritating,” wrote Simone de Beauvoir of womanhood, but The Second Sex is

    more interesting than any book about masculinity. Manhood resists

    straightforward discussion even as men stand accused—correctly, insofar as any

    accusation directed at such a broad target cannot fail to hit—of sucking the air

    from every other conversation. We do have plenty of talk about masculinity,

    but talk is all it is—aimless and nonconsecutive, never the sense of anything

    developing. Sophisticated opinion rarely gets beyond the elementary

    observation that masculinity is a social construct, or rather a set of many such

    constructs. As for unsophisticated opinion, it is a dank cellar most impressively

    represented by the Canadian academic Jordan Peterson, who bangs the table

    for logic and reason while basing much of his thought on the ideas of a

    discredited occultist. Peterson’s reliance on the work of Carl Jung is revealing:


