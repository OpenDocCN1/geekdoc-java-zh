    and Deleuze, yet the books don’t feel heavy or difficult; perhaps Fisher’s greatest
    talent was his ability to talk about these thinkers in a way that made their ideas
    practical and useful. These writers generally strike me as obscurantist to the
    point of dishonesty; I have never trusted them, and yet there is something in
    Fisher’s authorial voice that makes me trust him. Reading him is like taking a
    brisk walk with your smartest friend.


    All these books grew out of k-punk, Fisher’s blog, and you can experience the
    whole messy history of his thought by reading K-Punk (2018), an omnibus collection
    of select blog posts, music and film reviews, and essays. In Deleuze’s ontology,
    as I understand it, being contains an infinity of possible differences—here Deleuze
    follows Spinoza, who believed that the universe was a single substance that cradles
    infinite diversity. An “intensity,” for Deleuze, was a sort of wisp of difference
    whose effects we can feel but not fully perceive, a difference that we have not
    yet domesticated via own own strategies of seeing.


    Reading Fisher’s shorter books, you feel something ambiguous and undefined in
    his thought; to go from them to k-punk, or to K-Punk (the two are very different
    reading experiences), is to see some possible Fishers that those books leave unexpressed.
    Some of those intensities are more appealing than others.


    During the 1990s, Fisher was affiliated with Ccru, the Cybernetic Culture Research
    Unit, an informal academic subdepartment initially led by Sadie Plant and, after
    she left the University of Warwick, by her ex-boyfriend. That ex-boyfriend was
    Nick Land, who adumbrated, in a series of strange texts that blend the style of
    horror fiction with high theory, a view that became known as accelerationism.
    Land theorized that capitalism was, as Marx once said, a kind of vampire sucking
    on human life and labor, making us alien to ourselves, but that this was good,
    actually, because human consciousness and subjectivity as we know them were also
    vampiric infestations. Once capitalism cleansed us of our humanity, we would then
    be ready for . . . something. Land later grew obsessed with the occult and spent
    a period of time believing himself to be inhabited by three separate beings. Some
    time after that, he emerged as the intellectual star—if only for the softness
    of the competition—of the neoreactionary movement, a precursor to the alt-right.
    This man may need an exorcist; what he definitely doesn’t need is disciples.


    Fisher, needless to say, did not follow Land down his left-hand-and-right-wing
    path. But some of his early posts are burdened by teenage misanthropy and Gen
    X edgelordism. “The prospect of yet more exploitative taxes to support reproducer
    indulgence means that a questioning of the bio-political privileging of natality
    is long overdue,” he writes during his mid-2000s antinatalist phase, sounding
    like an Ayn Rand libertarian who has just discovered queer theory. He says, again
    and again, truly stupid things about antidepressants, the effects of which he
    seems unable to distinguish from those of heroin. He is sometimes too easily thrilled
    by other people’s nihilism. Years later, Fisher would write the controversial
    essay “Exiting the Vampire Castle,” arguing that the online Left, with its competitive
    moralism and addiction to mutual shaming, had begun to “do capital’s work for
    it.” Leftists were draining each other of the energy needed for larger and nobler
    projects because they disbelieved that such projects were possible. They were
    each other’s vampires. Early Fisher is sometimes trapped in another kind of vampire
    castle, the kind constituted by an equally draining, equally destructive competition
    to appear, in every sense of the word, cool.


    You can still read around in the k-punk archives, and I recommend doing so to
    anyone who admires Fisher’s work—he first came to general notice as a blogger,
    and the medium is the message. But it can be a melancholy exercise. In part that’s
    because of the intensities you encounter—the Fishers, good and bad, that ultimately
    weren’t—and in part that’s because the blog form itself, with its long-dead links,
    the between-text trails that someone paved over, becomes an unwitting illustration
    of the split between Fisher and Land, the left humanist Fisher became and the
    post-humanist that Land already was. He raves about an essay, you click on the
    link—and Fisher always links, because he wants you to read all his friends and
    influences as much as he wants you to read him—and you wind up on another blog
    that hasn’t been updated in a decade or on one of those zombie websites that cannibalizes
    old URLs, reading a computer-generated text about “what employers should never
    do.” Or you follow the link embedded in a description of his friend Nina Power’s
    flat—“a space,” Fisher writes, “in which impersonal production is always happening”—and
    you find yourself at another zombie website, this one reading that business casual
    attire is “one of the best styles any gentleman can wear.” Impersonal production,
    indeed. The colonization of old web pages by the sort of search-engine-optimized
    advertisements that robots can and do write does suggest what a Landian, post-humanist
    world might sound like. Does the future belong to Fisher’s nervously excited human
    voice or to these chittering algorithms?


    The post of his quoted earlier, about maintaining fidelity to the post-punk event,
    illustrates why you have to have some patience with Fisher, and also why you’ll
    be glad you did. First, there’s the lucid analysis: “Punk and post-punk, however,
    were profoundly suspicious of the Dionysian triumvirate of leisure, pleasure and
    intoxication, so that the required attitude was one of vigilant hyperrationalism.”
    (Where hiies smoked weed and related, punks took speed and argued.) Then there’s
    the surprising but suggestive connection: “The stance such a perception demanded—and
    this was a culture that was deliberately and unashamedly demanding—was one of
    ‘proletarian discipline’ rather than slack indulgence, its Puritanism recalling
    the egalitarian social ambitions of the original Puritans.” Then there’s the understated
    compassion, the trait that most clearly distinguishes him from Land and yet can’t
    be neatly separated from Fisher’s silly hobbyhorses: “Go into a roomful of teenagers
    and look at their self-scarred arms, the antidepressants that sedate them, the
    quiet desperation in their eyes. They literally do not know what it is they are
    missing. What they don’t have is what post-punk provided . . . A way out . . .
    and a reason to get out. . .”


    And then there’s the paragraph so vertiginously hopeful that it makes you catch
    your breath. This aging man barely hanging on to his academic job, beset by lifelong
    mental-health issues, threatened both at work and at the doctor’s by cuts, cuts,
    cuts, finds it in himself to write thus of blogging:


    So is this a counsel of despair? Not at all. There are new means for producing
    counter-consensual collectivity. Like this. The web has a distributional reach,
    a global instantaneity, whose unprecedented scale is easy to take for granted.
    But its vast potential far outstrips anything that fanzines or records could have
    achieved in the Seventies. What needs to happen is a kind of “existential reframing”:
    to see what happens here not as Kapital wants us to see it, as “failed” writers
    resentfully carving out some insignificant niche because they can’t “make it”
    in the overlit interior. The logic of Kapital insists that anything that is not
    reproducing it, or serving such a reproduction, is a waste of time. But to reframe
    what is happening would be to radically reverse those idiotic priorities. And
    the continuing relevance of post-punk is to remind us that such reversals are
    possible, to provide the impetus for the development of a (punk) will to retake
    the present.


    The “overlit interior” of social media has largely killed blogging. But the punk
    will to retake the present and to reopen the future—you still feel it, when you
    read this passage, written by a dead man on a dead blog, itself part of an entire
    dead city of blogs, parts of which were once beautiful and parts of which were
    always going to be uninhabitable.

