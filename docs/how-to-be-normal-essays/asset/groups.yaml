    Nothing has informed my understanding of my own maleness—or my fears


    about what it might allow me to get away with—than chancing to look

    through the sociologist Arlie Russell Hochschild’s The Second Shift when I was

    in my twenties and seeing clearly laid out the total combined hours of precious

    life the average woman loses to home and office. Judging by time-use studies

    from the 1960s and ’70s, Hochschild concludes, “women worked roughly

    fifteen hours longer each week than men.” Reading this sentence made me feel

    tinier than losing a fistfight ever did. If these numbers were true, then even

    midcentury men, the so-called greatest generation and their younger brothers,

    already understood by that point to have attained a height of manly stoicism to

    which my generation could hardly aspire, were shirkers and slackers who had

    failed to stand between their own wives and life-destroying overwork. What

    had these men been doing the whole time? Shooting, perhaps; hunting deer;

    puttering with engines: “guy stuff,” in its commonly accepted sense—the

    useful arts done specifically in such a way as to be drained of immediate

    usefulness. A more recent study—albeit one commissioned by a grape juice

    company, so caveat lector—confirms that contemporary men are, in at least one

    sense, lazy snowflakes: We allow women with jobs outside the home to work

    an average of ninety-eight hours a week. Even if you factor out women with

    whom no man is obligated to split chores—women who live with women, for

    example—that’s presumably a lot of work men are not doing.


    The other inescapable problem with the idea of Man as Protector, even more

    fundamental than its propensity toward hierarchical violence or its empirical

    falseness, is this: Protectors always fail. Stare far enough down the corridors
    of

    time—as men do in the watches of the night, in the interstices of the day,

    while driving, praying, holding a baby—and all you’ll see are threats.

    Every car is a murder weapon, every bruise a malignancy. The world is the sort
    of place

    in which statistical probability reaches down like a giant and swats us and our

    loved ones away. You cannot be a protector any more than you can be a

    changeling or a fairy princess.


    By this I obviously don’t mean that we should give up. Men will not stop

    worrying about their wives, or their husbands, or their children, or their

    friends and coworkers and dogs, or the little patches of civilization to which

    they may feel they’ve contributed. Nor will women, or the nonbinary (a

    category that I sometimes think includes most of us). Love itself commands us

    to do whatever we can. But there is nothing specifically masculine about this

    responsibility. (An enraged mom is a proverbial terror.) It also imposes on men

    a burden that would drive anyone insane; it ties impossibility to our very

    identity. Despite what’s been communicated in every action movie ever made,

    nobody is wisely enough to stave off mortality in every instance. Do everything

    you can about the dangers that are clear and present, but anything beyond this

    is folly. Simply being a good person is hard enough without the additional

    burden of being a mythical creature.


    But given an acceptance of mortality as the alternative, it is no wonder that

    old ideas of the masculine persist in a kind of camp afterlife, transmitted

    largely via jokes we really mean and ironies that aren’t fully ironic. (Think
    of

    the way “beta male” has become a category we all half-believe in, even those of

    us who rightly reject the notion of “alpha males.”) Men know, in many cases,

    that “manhood” doesn’t have a fixed meaning, yet we still feel we have failed

    ourselves—or, if we take McAllister’s view, perhaps we have outlived ourselves.

    Clearly, we have failed women. (Again, these are accusations that are true

    perforce because they are lobbed at such a statistically massive target; still,
    they

    also apply to many of us personally to some degree.) We react to this

    knowledge in various ways. Many of my male friends cannot disclose even a

    fairly serious personal problem to another man, even in a private conversation,

    without first offering up a short litany of the categories of human beings whose

    oppression is undoubtedly worse. It is as though they feel they must apologize

    for claiming the human prerogative to hurt—for admitting that they are

    people, and not flesh bags containing mostly privilege and water. Other men,

    especially white and cis men, long, or tell themselves they long, for the dignity

    of having something real to worry about. In Leonard Michaels’s The Men’s Club

    (1981), a group of men come together in an imitation of women’s

    consciousness-raising groups to tell their stories. (They end up having a food

    fight.) Since everybody—even heiresses and Habsburg princelings—has at least

    one real thing to worry about, such talk is fatuous, but it tells us how far

    these men have lost sight of their own lives.


    Most of all, we feel like a bad joke. When we’re two or three drinks in, we’ll

    tell you that we feel like impostors—not merely in our jobs, but in our skins.

