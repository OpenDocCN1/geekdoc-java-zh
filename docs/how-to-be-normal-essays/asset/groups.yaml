    Strange Creatures Who Stopped Living and Became Up Zombies）的亲切文中，采用了“愤怒的收回”，认为电影对品味的无知赋予了它一种“月亮的纯洁”。


    其他电影令人们着迷是因为它们定义了一个英雄式的痴迷领域，英雄主义和误用是不可分割的。任何人都可以全身心地投入到一个具有明显重要性或质量的项目，但要把你的最后一个美元、你一点精力投入到从一开始就设计不当且荒谬的东西中——需要一个人类。喜剧演员帕顿·奥斯沃尔特（Patton
