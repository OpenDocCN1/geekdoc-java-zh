    对我对自己男性特质的理解——或者对这种特质可能允许我为之所为的恐惧——没有什么能比得上我在二十多岁时偶然读到社会学家阿莉·鲁塞尔·霍克希尔德（Arlie Russell
    Hochschild）的《第二班次》（*The Second Shift*），并清晰地列出普通女性在家庭和办公室失去的珍贵生命总小时。根据 20 世纪 60
    年代 70 年代的时间研究，霍克希尔德得出，“女性每周的工作时间比男性大约多出十五小时。”看到这句话让我觉得比输掉一场拳斗还要渺小得多。如果这些数字是真实的，那么即使是世纪中叶的男性——那些所谓的“伟大一代”及其弟弟们，在当时就已经认为达到了我们这一代难以企及的男子汉斯多主义高度——他们也是逃避者和懒惰之，没能站在自己的妻子和毁灭生活的过度工作之间筑起防线。这些男人一直都在做什么？也许是射击；猎鹿；摆弄引擎：即在通常认同的意义上的“哥们儿玩意儿”——这种以特定方式完成、剥离了即时实用性的实用艺术。最近的一项研究——尽管是由一家葡萄汁公司委托的，所以读者请留心留意——证实了在至少一个意义上，当代男性是懒惰的“雪花人”：我们允许有场外工作的女性平均每周工作九十八
    小时。即使你考虑到那些男性没有义务与其分担家务的女性（例如，与女性住在一起的女性），那可能也是许多男性没有做的大量工作。


    “男性作为保护者”这一观念中另一个不可避免的问题，比其对阶级化暴力的倾向或其在经验上的错误更为根本，这一点是：保护者总是会失败。向时间的走廊望得足够远——正如男性在深夜的守望、白天的间隙、开车、祈祷、抱孩子时那样——你看到的只有威胁。每一辆车都是杀人武器，每一处淤青都是恶性肿瘤。世界就是这样一个统计概率像巨手一样伸过来我们将我们爱的人拍开的地方。你无法成为保护者，就像你无法变成变形童或仙女公主一样。


    显然，我并不是说我们应该放弃。男性不会停止担心他们的妻子、丈夫、孩子、朋友同事和狗，或者他们可能认为自己对此做过贡献的小片文明领地。女性也不会，非二元性别者也不会（我有时认为这个类别包含了我们的大多数人）。爱本身命令我们去竭尽所能。但这种责任并没有什么特别的男性气质。（一个愤怒的妈妈是众所周知的恐怖源。）它也给男性施加了足以让任何人疯狂的负担；它将“不可能”与我们的身份认同系在一起。尽管制作过的每一部动作电影都传达了信息，没有人足够聪明到能在每一种情况下回避死亡。对于那些明显且迫的危险，要竭尽所为，但除此之外的任何尝试都是愚蠢。仅仅做一个好人已经足够难了，不需要再背负成为一个神话生物的额外负担。


    但鉴于接受了死亡作为替代方案，旧的男性化观念在一种“营地后世”中持续存在并不奇怪，它们主要通过我们真正发自内心的笑话和并非完全讽刺的反讽刺来传递。（想想“Beta
    男”如何变成一个我们所有人半信半疑的范畴，甚至是我们这些正确拒绝“Alpha 男”观念的人也是。）男性在很多情况下知道，“男子气”并没有固定的含义，但我们仍然觉得自己辜负了自己——或者，如果采取麦卡利斯特（McAllister）的观点，也许我们已经活过了自己。显然，我们辜负了女性。（再次，这些指控是必然真实的，因为它们针对的是一个统计学上如此巨大的目标；尽管如此，它们在某种程度上也适用于我们中的许多个人。）我们以各种方式应对这种认知。我的许多男性朋友即使在私下交谈中，无法向另一个男性透露一个相当严肃的个人问题，除非先列出一串受压迫程度无疑更糟的人类类别。好像他们觉得必须为声称拥有伤害的人类特权而道歉——为承认自己是人，而不是装满大部分特权和水的肉袋。其他男性，特别是白人顺顺性别男性，长期渴望（或告诉自己正渴望）拥有一种某种真实事宜可以担忧的尊严。在莱纳德·迈克尔斯（Leonard
