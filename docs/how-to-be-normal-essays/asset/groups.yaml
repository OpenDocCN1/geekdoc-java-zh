    specialists would wince. I make reading lists, which always leave somebody


    important out—whether I cut Thoreau to make room for Harriet Jacobs (a


    stunningly vivid and economical writer) or the other way around. I find the


    right level of oversimplification for my audience, I go directly to it, and then,


    by degrees, I retreat from it, inviting students to follow me into greater


    complexity. I never stop worrying that I have replaced my subject with a


    slightly stupider changeling. It just goes with the territory.


    After Woolf, writers on the subject of middlebrow tended to emphasize one of


    these two qualities—its falsity or its pedagogical usefulness. On the side of


    falsity, we have art critic Clement Greenberg, who in his influential essay,


    “Avant-Garde and Kitsch” (1939), separates true art from “kitsch” by centering


    the artists’ narrowness of purpose, their intentness on a particular idea.


    Greenberg’s avant-gardists pursue “an absolute in which all relativities and


    contradictions would be either resolved or beside the point.” (One might


    indeed call this “riding their mind at a gallop in pursuit of an idea.”) For him,


    this means an ever stricter formalism, an art that breaks itself down into


    narrower and narrower analysis of its own building blocks, as though in search


    of the fundamental aesthetic particle. Meanwhile, for the “urban masses,”


    whose removal from their grandparents’ peasant settings has alienated them


    from folk culture, a new category of “ersatz culture” arises to fill that need,


    which Greenberg calls “kitsch.” Kitsch he considers not only silly but'
