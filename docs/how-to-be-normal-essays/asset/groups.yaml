    Bond movies are my guilty pleasure,” tends to lead American cultural critics


    (though not all my examples are American) to define their own preferences by


    defending them, to construct whatever we like against a snobby, dominant


    enemy. We are Americans; our national myth is Footloose. None of us can enjoy


    our pleasures till we think someone wants us not to have them.


    What does intrigue me about the use of the concept of middlebrow, in these


    and other writers, is that they write of it with a warmth and respect that one


    can barely imagine anyone bringing to the concept of the highbrow as such


    (though people do write lovingly about particular highbrow works). It is hard


    to coax a single definition of middlebrow out of all these essays, but there are
    a


    few threads we can pull together. Middlebrow unifies; it mediates; it educates.


    It addresses both heart and mind. (So do opera, ballet, epic poetry—but once


    we’ve called something “highbrow,” we no longer need to look at it.)


    Middlebrow is good for you. All of these writers frame middlebrow as a thing


    in need of defense, even though the specific works they want to defend are


    quite safe—safer than the opera, the ballet, or the long, allusive, heady,


    postmodern novel. They talk about middlebrow in the way we talk about


    things we feel in danger of losing through a failure to appreciate them. How


    did a word that sounds like an insult come to acquire such emotional coloring?


    To answer that question, we must look to its history.


    Most authorities credit a writer for the magazine Punch with first using it in


    print, in 1925, but an author of advice literature named Margaret Slattery gave


    a speech titled “High-Brow, Low-Brow, and Middle-Brow” in 1922, just


    beating Punch to the punch. A word that marks distinctions of pedigree,


    middlebrow is itself of uncertain parentage. In “Middlebrow,” an unsent 1932


    letter to the New Statesman, which Leonard Woolf included in the posthumous


    collection The Death of the Moth and Other Essays (1942), Virginia Woolf


    depicts an idealized relationship of mutual dependence between high- and'
