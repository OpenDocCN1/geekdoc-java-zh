    integration: If we’re going to do this, you rich guys should go first. It is the

    kind of task that people who can afford to do it are far too prone to accepting

    on behalf of others who cannot. And no one can afford to truly hate

    themselves or to see themselves as inherently deviant or ontologically inferior

    to other people. Black people have written a number of classic novels on this

    theme, which one might read with profit and enjoyment.


    I have taken to using the term “shit-eating allyism” to describe these sorts of

    emotional display. Shit-eating allyism has two main manifestations. On one

    hand, it consists of simpering declarations of deference, testaments to the

    oppressed groups’ superior and hitherto historically unexampled virtue, or

    laments about one’s own privileges, even when these have barely been enough

    to keep one alive. In its other form, shit-eating allyism names those occasions

    when a person of privilege suspends, at least rhetorically—most of the time it

    is only rhetorical—their own, or their family’s and community’s, claim to basic

    self-respect or human rights. (Consider, for example, a woman who regrets that

    she is bringing a white baby into the world and is willing to be quoted in Vogue

    to that effect.) Shit-eating allyism is often but not always associated with the

    more extreme forms of what Matt Bruenig calls “identitarian deference” and

    Olúfémi O. Táíwò calls “epistemic deference”: the idea that whiteness,

    maleness, or some other form of privilege has so corroded one’s ability to assess

    reality that any judgment marked as coming from the oppressed community in

    question, however outlandish, unsupported, or unrepresentative, would

    automatically be better than whatever judgment this person reaches after

    research and careful consideration.


    When a white professor named Jessica Krug, who had spent decades

    pretending to be a Black woman, was at last caught doing so, she wrote, in

    (inevitably) a long Medium post, the following hilarious sentence: “You should

    absolutely cancel me, and I absolutely cancel myself.” Many onlookers were

    quick to point out that Krug failed to specify the nature of the punishment she

    was asking for—“cancellation” means a lot of things, none of them fun but

    many of them survivable. Yet Krug was also practicing the sort of deference

    that belongs to this political world. It is not for her to say what her

    punishment is because it is not for her to say what anything is. White people

    are epistemological children in this way of thinking. This person could not

    conceive of a righteous version of herself except in blackface. She had canceled

    herself a long time ago.


    In light of this dilemma of whiteness—the way it “toggles,” as Nell Irvin

    Painter puts it, between monstrosity and banality—some of our era’s most

    thoughtful critics, including Painter herself, have proposed the construction
    of

    a nonracist white identity. Jessica Krug needs a safe place to locate herself,

    where she is a danger neither to herself nor to others; antiracists must build
    her

    one.


    The attempts at this that I’ve seen are notable most of all for the way they try

    to ennoble blandness. The best a white person can do is to serve as a sort of

    human tofu. Take, for instance, Ta-Nehisi Coates in his run on Captain

    America. These comics have attracted little commentary in the literary-critical

    precincts that received his earlier work with ecstatic warmth, which is odd,

    because Coates has been open about the way these comics, as well as his

    (somewhat better-known) work on Black Panther, function as extensions of the

    arguments he made in Between the World and Me. Captain America, he has

    said, represents “the Dream” of whiteness—“the Dream” being the term used

    in that (brilliant) book for the combination of white supremacy and American

    exceptionalism. Coates’s treatment of the character is his attempt to imagine

    what a good man living the Dream might look like. In one early issue, for

    example, Cap observes to T’Challa, the Black Panther, that he “shouldn’t be

    shocked” by some new depredation that their shared fascist enemy has

    performed. T’Challa very kindly rebukes him; innocence is part of Captain

    America’s greatness. What strikes one about Captain America, both in general

    and in Coates’s telling, is that he’s barely there. The arc of Coates’s story
    largely

    involves Cap, defeated by various plot machinations, learning to trust a group
    of

    women superheroes whom he neither leads nor follows. He is a mascot,

    seemingly without motives.


    Another fascinating instance is Young Jean Lee’s play Straight White Men

    (2014). She has described the work’s genesis as follows:


    When I was at Brown doing the first workshop, there was a room full of

    students, people of color and queer people, a very diverse room. And they

    started talking very harshly about straight white men. I said, “Okay. Now I

    know all the things you don’t like about straight white men. Why don’t

    you give me a list of the things you wished straight white men would do

    that would make you hate them less?”


    So they told me all these things, and I wrote down the whole list, and

    then I wrote that character. And they all hated him. They hated him. . . .

    They hated him because he was a loser.


    Lee expresses this conflict by creating a white man who is the perfect ally: he

    sabotages his own career prospects and downplays his own skills in order to

    help others. His family members, whom Lee is careful not to depict as mere

    villains, take it that he is enacting a kind of masochistic penance. (We might

    call him a shit-eating ally.) Lee leaves open the possibility that he is self-

    actualizing and healthy: he wants this life. Admire him or hate him, though,

    he is certainly not a dynamic character.


    When I consider Painter’s suggestion of an antiracist white identity, what I

    perceived first of all is a great kindness in Painter’s intentions. She wants

    something better for me than for me to be either Rachel Dolezal or Dylann

    Roof. I recognize, too, a weary pragmatism in her gesture: the lie of race isn’t

    going away just because I show you, in great, scholarly detail using my many

    decades of research, that it is a lie. (Before she turned to writing about

    white people, Painter first devoted many years to understanding how Black people

    came to be as a people—how they were, as the title of one of her earlier books

    insists, created. She has the right to be weary and pragmatic.) We could say that

    Blackness is an oppressive fiction, and yet Black people rarely wish to have the

    designation itself lifted off them. It gives them a sense of commonality with

    other people, which is a useful thing to have in this world. The sense of

    surviving together the designation of Blackness makes a people where there was

    none before. Theologically, some have even said of Blackness—and the

    theological is an appropriate register in which to speak of it, given both the

    disproportionate religiosity of that community and the metaphysical weight of

    the crimes against it—what Joseph said of his brothers’ crime against him:

    What you meant for evil, God meant for good.


    All of that may be true. And it might be that “Blackness” would go on

    a useful, living concept—not just a sort of anthropological phlogiston—even

    in a world where it has ceased to convoke a people by oppressing them. There

    is a very real sense in which that question is none of my business. But the well-

    known incongruity that sometimes arises when one tries to compare the

    “white” situation to the “Black” one imposes itself here as much as anywhere.

    older, recalcitrant one: White people, more than any other,

    have been the people who get to live in the illusion that they build themselves.

    To consciously “choose” and “build” an identity, in this case, is already to

    confess to an older, more recalcitrant one.


    The theologian Willie James Jennings writes eloquently of the “convening”

    power of the concept of whiteness. It is revealing that the white group’s

    accomplishments he then goes on to describe—imperialism, colonialism,

    conquest—are simply the operations of capitalism.

