    and they see their mission clearly and pursue it with determination.


    Middlebrow, here, is aspirational; it’s good for you. Middlebrow is mass


    education, good museums, the Book of the Month Club, the Britannica Great


    Books set, ’70s public television. It’s Kenneth Clark in his TV series,


    Civilisation, telling us what to notice about old paintings, and John Berger,
    in


    his four-segment documentary, Ways of Seeing, telling us what Clark left out.


    (Both series can be found on YouTube and remain well worth watching.) This


    version of middlebrow is a category about which Americans must be


    ambivalent, for we both love and resent the idea of education.


    Every few years, someone writes an article expressing nostalgia for this


    educational sort of middlebrow culture. Early in this century, Terry Teachout


    attributed its death to the same ongoing development of communications


