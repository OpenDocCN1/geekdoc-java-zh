    事实上，即使在 Bacon 的起义期间，这种动态已经部分成型；这场战斗是两个殖民地领主之间权力斗争的一部分，其中涉及的问题之一就包括被称为“印第安政策”的委婉说法。


    这种策略并不新鲜。也许它和权威本身一样古老。但它很快在那些欧洲颅骨崇拜者的著作中找到了科学依据。至少对于这些로实施者来说，它丧失了纯粹机会主义的臭味，变成了一个关于世界的“客观”事实。通过修正以及——得益于技术发展——在两个方向上都更加丰厚的诱惑，这种策略在今天依然奏效。


    这就是你的“白人肤质”：一个庞大而脆弱的东西。只需几十小时的阅读时间，一个聪明的青少年就能拆穿它。数万人看穿了它，却根本不识字。然而，美国民主制度又有很大一部分是建立在此基础上的——美国民主确实是一项伟大且独特的历史成就，它毁灭了欧洲内部的阶级和种族区别，这些区别在当时看来就像现在的白人至上主义一样不可动摇——也许欧洲人在从不同的船上走下来时，即使不设定第二类人作为他们投射仇恨和恐惧的对象，也能学会将彼此视为人类。我们无法得知；那是另一个更美好的历史。而这是我们的。


    我们的文学中很少有关于这一切是多么偶然的记忆：梦只有在你身处其中时才是令人信服的。在乔治·舒莱勒的小说《不再黑色》（*Black No More*, 1934）中，一个古怪的科学家发明了一种让黑人变成白人的方法。这种隐喻也出现在斯蒂芬·莱特的《合并波尔卡》（*The
    Amalgamation Polka*, 2006）中，它既具体化又反转了真实历史——即伪科学和机会主义合作使数十人白人化，其中许多是事后发生的。（荷马是“白人”的吗？奥古斯丁呢？）过程是可以逆转的。在特朗普时代，拉丁裔在某种一夜之间失去了几程度的白人身份。在坚定的白人至上主义者中，总是存在着旧的欧洲内部种族分裂重新抬头之危险，高傲的盎格森人将再次试图凌驾于机机多变的西班牙人、热情的意大利人和土豆头的凯尔特人之上。


    白人化是一个没有明显终点的过程。“白人身份”总在你前方稍一点——即使是白人至上主义者也哀叹今日白人处于某种枯竭状态。这个概念无法通过特质来定义，因为描述任何东西从未是它的功能。然而，每个人都在尝试。有时这意味着接受白人至上主义者对白人身份的定义——理性的、勇敢的、科学的、人类的未来——并简单地认为这些是糟糕的：例如，反种族主义博物馆展览将“坚韧的个人主义”和“强调科学方法”列为白人身份的罪状。（涉博物馆后来道了歉。）将被白人化的人定位为理性和个人主义的特定价值者是需要气的，因为在一个历史时期，数百万他们正转向一种从字面上基于网络论坛帖子的新兴崇拜，或者将自己和家人投向
    COVID-19 病毒，仿佛病毒会被他们的勇气所震慑并走开。这种行为并不是通过基因遗传的；它是郊区特定的毒性个人主义的产物。很少有被白人化的人被允许获得可以像这样思考的特权；这并不意味着它是一种“白人特质”。数百万白人再次完全无法认同这一点。在其他情况下，人们试图通过抓住与阶级、地区或种族相关的特征，或大众文化产品必要的平淡特征来描述“白人”。当人们谈论“白人食物”时，他们说的是挪威人吃什么、爱尔兰人被迫吃什么或麦当劳生产什么，而不是意大利人或西班牙人吃什么。


    在黑人激进思想的边缘，可以发现对白人特殊特质最清晰、最接近连贯的表述。这些故事在最虚假时，也保留了某种原始的力量——那种背后的尖锐而具体的痛苦的力量。例如，我发现“我是一个古代科学家育种实验的产物”这种理论是深度的侮辱，正如他们意图的那样，但在花足够的时间观察了维持“白人身份存在”等幻象的官僚机构那种非人性的冷酷和愚蠢后，我甚至欣赏了老雅库布（Dr.
    Yakub）理论的解释价值。同样，我理解如果一个人与白人化者最频繁的接触是警察、监狱官员或其他蔑视他的职员，他可能会对“缺乏黑色素使人变得软弱、残忍和愤恨”这一想法产生直觉上的合理性。（事实确实如此。）一个下午，当我离开目睹了一位黑人朋友被陷害的法庭时，我发现自己在想：我恨死白人。


    这些理论频繁地与反犹太主义神话契合且相似，这同样说明了某些问题。神学家J·卡梅隆·卡特（J. Kameron Carter）认为，西方基督教与犹太教的分裂以及由此产生的反犹太主义是现代种族主义的智和精神前提。然而，在深层历史讽刺中，反犹太主义最有影响用途之一是作为一个替罪羊，欧洲资本主义实施者可以将他们自身掠夺行为的责任推卸其。国际银行的崛起很大程度上归于富格尔家族（Fuggers）和美第奇家族（Medicis），但你很少听到前者，我们大多把后者知为一个令人垂迷的放乱艺术鉴赏者家族。涉及到金融投机、其无形的力量和腐蚀的影响，每个人都知道的名字是“罗斯柴德”。当你需要为国际资本主义的具体恐怖提供种族解释时，你讲述了一个关于秘密、强大、狡猾且在某种本质上没有灵魂的人的故事。你称他们白人，或者称他们犹太人。有时你两个都称。


    在更主流的形式中，此类将白人身份定义为病态尝试往往关注获得“非应得”特权的性格特质。（当我们说“非应得”，我们就植入了精英治的思想——这又是某些白人的鬼话。）白人，尤其是白人男性，不可避免地平庸，就像带有遗传缺陷一样。她或他们是傲慢、神经质、脆弱、自恋、虚荣的。他叫布莱斯或希斯或康纳，在冬天穿短裤——在基础层，他与真相是如此脱节。（也许他只是不在乎膝盖冷不冷。）除非她的头发很好，否则她叫凯伦。


    这种方法也有某种原始的描述力。刻板印象往往如此。在这个过程的延伸中，“白人”变成了某些糟糕政治的名称：保守派的、民族主义的、避邻主义（NIMBY）进步主义的、“我们不能以后再谈这个吗”的社会主义者、“你看着我所以我去报警”的女性主义者。在所有这些案例中，“白人”作为一种世俗美国自由的名称：从“免于的自由”变成了“凌驾的自由”。它是小贵族的自由——这种人带给了我们渗透在制度中的过多的启蒙运动政治思想——或者是南方富豪后代的自由，这个群体在不成比例地带给了我们那种怪异且命名的错误的美国政治倾向，即“自由意志主义”。（这个词在欧洲语境下含义要高尚得多。）自由意志主义者在精神上是一个种植园主之子。他希望降低税收，让他的员工免费工作，并且——打着那些员工女儿的主意——废除成年年龄。他的自由要求其他人是不自由的。


