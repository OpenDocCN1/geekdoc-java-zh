    （多年前他就把他的副本扔掉了。）这位演讲者仔细研究了流行歌曲歌词，揭示了在几十位60 年代和 70 年代艺术家的新词、多变的兴趣和随意的引用之下，隐藏着一个单一、统一且一如既邪恶的世界观。通过纯粹的戏法，他将鲍勃·迪伦的“The
    sun isn’t yellow/ It’s chicken”（太阳不是黄色的/它是鸡肉）变成了“The Son isn’t yellow/ He’s chicken”。大学期间的某个时候，当我听《公路61号重访》并听到真实的歌词时，我仍然天真到感到愤怒。尽管当时已以一种青少年晚期的典型方式混乱地抛弃了基础主义，读过多斯妥耶夫斯基尼采，甚至参加过一个按授女性牧师的教会（这显然违反了《新约圣经》几处经文，因此被排除），但我诚实地说，并没有准备好面对“我们的人有时仅仅会撒谎”这一事实。


    在成年后的相当大部分时间里，我都在思考这种谎言背后的心理。从表面上看，在道德、智力或策略上，这种强加证据的方式都是毫无意义的——通过为自己的主张提供文本引用的形式化操作（暗示它就在那儿，尽管查就行）——然后像那些过去通过标记月球卫星照片来证明月球上有巨大雕像的人那样去篡改文本。如果你非要那样不理性，为什么不完全放弃对书本知识的诉求和对学术证据标准的追求呢？为什么不直接说上帝在幻象中向你展示了一切？然而，这并不是我第一次看到这种完全相同的谎言。策略性的误引、对原始素材进行巧妙修饰后使用，在教会里经常发生。我童年的大部分宗教教育，除此之外，还包括一种寻找“恐怖隐藏含义”的艺术学艺——这些含义涉及药物、魔鬼学、启示录、政府的秘密控制等话题——而这些文本的字面意义在某些情况下完全平庸的，在另一些情况下则已经以常规的方式具有冒犯性。


    我记得我们教会的一位演讲者，为了支持他“天主教不是基督教的一个分支，而是一个巧妙的神秘主义者伪造物”的主张，他引用了亚他那西的名言：“上帝化为人，是为了使人得成神。”他把第二个字母
    g 大写并去掉了 s，将其放在幻灯片上，说：“这是官方的天主教教义。”当然，亚他那西是基督教历史上最核心的四到五位神学家之一；一个基督徒这样代表他，无异于自断肢臂。（当我提出意见时，教会领导层的反应基本上是指出，并不是所有事情都能像你们这些知识分子所喜欢的那样微妙和谨慎。）


    我开始怀疑，传播这类谎言的人相信自己正处于一场精神战争中，在这种战争中，文字具有独立于读者从中发现的含义、独立于对历史的物质影响或独立于其所说的任何内容的力量。在那些较博学的基础主义者中，仍然能听到关于亚历山·希斯洛普（Alexander
    Hislop）的理论，他在1853年的小册《两个巴比伦》（*The Two Babylons*）中主张，天主教通过巧妙地使用各种符号，秘密地崇拜古巴比伦之神。再次，语言的多义性产生了阴谋论：“复活节”（Easter）与“伊什塔尔”（Ishtar）之间语言上的相似性，某些符号或图标的偶然重复使用。正如声称齐飞伦敦（Led
    Zeppelin）专辑包含秘密倒放信息，或者说鲍勃·迪伦说了一些亵渎的话，通过对音节稍加添加和修饰就能强迫他说出来一样，这种假设似乎是语言有一个隐藏的层，这个层在使用者有意识的意图（甚至是实际词汇）之外仍然处于活跃。对于一个相信《圣经》——世界上最重要的书——是神圣启示的人来说，如果这种语言是从不同时期的不同作者手中倾泻而出，并在某种程度上颠覆了他们特定的个性和意愿，那么这种对语言的观点似乎并不算牵谱。


    基础主义对摇滚乐的抨击（正如对许多其他事物的攻击），根于对语言拥有可怕力量的信念，以及对这些力量可能造成的道德污染的恐惧。只要带一点技巧，那种恐惧就会变成巴洛克式的规模。也许，与其祖辈相比，对基础主义道德衰落最好的解释是，它并非频繁地从“污染已经存在于内部”这一前提开始。。正如许多被夸大的恐惧一样，这种恐惧有一种向内转的倾向。在“你仅仅是在保护自己”的理论上，你沉溺于你声称反对的事物。“披萨门”（Pizzagate）以及最近的
    QAnon 显然源于基础主义基督教，但他们进行神秘主义“过经解释法”（eisegesis）时的那种决绝对我来说是新的。特别是 QAnon 与所有这些早期现象（甚至是披萨门）的区别在于，它先产生文本，然后在文本中寻找奥秘含义。这表明这种实践中了一种自我主张的新水平：通过这种方式，QAnon
    故事的荒谬和自相矛盾正是其论点的一部分。（披萨门至少有这种尊严：你可以将其视为对杰弗里·爱普斯坦（Jeffrey Epstein）存在的、无法想象的恐怖以及他在权力中心或中心附近明确地位的一种扭曲同化。）


    这些知识背景使得我有必要通过书面向父亲申请购买一张忧伤乐队（Tears for Fears）的磁带。回望那一刻，最令我惊讶的是我赢了。我的父亲接受了我的论点，尽管他认为这样做是在冒风险我的灵魂。这一定令他付出了代价。我所使用的推理性质提醒了我们，基础主义者一直得与一个由他们之外的其他前提构成的的世界谈判，而这些前提在许多情况下也可以声称具有基督教的认可。我的论点属于许多人所谓的“启蒙自由主义”类型，但它最终建立在公认源自基督教的道德词汇和假设之上：道德选择的重要性；人类作为道德行为者的尊严；自由进食果实的重要性。我们的竞争不是理性与理性。我必须努力才能赢，因为他也有论点，无论其质量多么不均。基础主义者会思考；与现代性相矛盾的人如果想保持格格不入，就必须这样做。这一事实应该让世俗主义者感到恐惧——不是因为基础主义者可能希望的原因，而是因为这对于“思考”意味着什么。因为对于我们世俗主义者来说，我们也相信思考，相信“聪明”。我们制作图表、数据以及那种在背景中使用环境音乐的播客。我们进行
    Vox 式的解读（Vox-splain）。当“披萨门”出现时，我们进行讽刺且彻底的事实核查。在基础主义环境中成长帮助我很早学到的是，当你非常努力思考时，你可以错得多么离谱。基础主义者投入记录摇滚乐之恶的能量（这种现象无论是他们还是其他人从未被精确定义过）代表了对脑力的极度误用。它在愚蠢上是克林顿式的；它就像雇佣天才横溢的人为你输掉一场世界级的选举。


