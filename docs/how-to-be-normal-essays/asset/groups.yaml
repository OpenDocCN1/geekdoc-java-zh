    It’s a moment of startling cruelty. It outraged me—by which I mean that I


    yelled “Fuck you!” at the screen. Reflecting on it later, I remembered an


    anecdote my wife often tells. She was, by some cosmic accident, eating dinner


    with the owner of a prominent health-food company, who asked her what she


    studied. She answered that her father was in prison and that her scholarship


    therefore focused on prison art, particularly theater. He drew back and said


    something to the effect of: “You can’t let that kind of negativity into your life.


    You have to make your own universe—you have the power.” This is where the


    idea of “manifesting” a desired outcome leads: to a denial of vulnerability that


    has direct and ugly moral and political implications. No social critic has ever


    indicted such Southern California touchy-feelyism as acutely as this scene from


    A Wrinkle in Time does, simply by exemplifying it: a bearded fool, moist with


    benignity, telling a child it’s her fault her father is trapped in space.


    I do not believe that we manifest our own reality. The older I get, the less


    control I feel anyone has over anything, including the quality of one’s work.


    Outright fatalism tempts me, though I don’t succumb. In the realm of the arts,


    the realization that we can have deeply memorable experiences with bad works


    —and dull experiences with well-made ones—can lead us to a free-floating


    aesthetic relativism, analogous in some ways to apolitical liberalism of the West


    Wing variety. Everyone has preferences, but the important thing to remember


    is that we’re all just people. De gustibus non est disputandum. The more


    sophisticated version of this argument is the common belief that “good taste”


    reduces to the desire to accrue cultural capital—a claim that removes taste


    from the black box that relativism puts it in but does so by reducing it to a


    wispy epiphenomenon at best.


    But given the ubiquity of aesthetic experiences—sublime, ridiculous, weird,


    disgusting—and the fact that they are shared often enough to stand, in some'
  - '[PAGE 58]


    sense, external to the self, this relativistic stance becomes hard to sustain.


    Nobody sticks to relativism, in aesthetics as in politics, for very long. We reach


    for the normative languages of “good” and “bad” art, of “genius” and “talent,”


    as we reach for the language of “good” and “evil,” because the experiences we


    label with such language are ubiquitous and often shared. (No sooner had


    some theorists declared the term genius off-limits than a generation realized


    that we needed a word for whatever Kate Bush is.) And we distrust these same


    normative languages because we (rightly) fear participating in an unjust


    hegemony, or because we (wrongly) conflate subjective with private,


    indeterminate with unreal.


    The blending of “high” and “low,” and the temptation of aesthetic relativism


    that comes with it, has been with us at least since the beginning of the


    twentieth century—when Henri Rousseau was acclaimed a genius for his


    ostentatiously naive paintings and the Surrealists found unexpected inspiration


    in the careless, breathless style of the Fantômas novels. Cave art and African


    masks, made by people then presumed to be “primitive” in some inescapable


    sense, made Pablo Picasso and Henri Gaudier-Brzeska who they were. It never


    went away in literary studies, where first, the author’s intention, and then,
    just


    the author, were declared off-limits to criticism. The films and paintings of


    Andy Warhol, the music of Sun Ra and John Cage and Brian Eno and then of


    the more committedly amateur post-punk artists, and the creative plagiarism


    of hip-hop DJs and writers like Kathy Acker all raised the question: Is it still
    art


    if you don’t know or control what you’re doing? Knowledge of tradition didn’t


    necessarily matter; training didn’t necessarily matter; meaning didn’t necessarily


    matter; vision didn’t necessarily matter. This process of aesthetic reassessment


    resembled the way Christian theology every so often rediscovers the frankly


    antinomian possibilities of a salvation initiated and completed by God. If our


    hard work doesn’t matter, why bother?'
