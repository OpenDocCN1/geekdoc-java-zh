    ……以及德勒兹（Deleuze），但这些书读起来并不重或困难；或许费舍（Fisher）最大的天赋在于，他能够以一种让这些思想家的观点变得实用且有效的方式来谈论他们。这些作家在我看来，通常是晦涩到近乎不诚实的弄者；我从未信任过他们，但费舍的作者口吻中确实有某些东西让我信任他。阅读他的书就像是和你最聪明的朋友一起散快散步。


    所有这些书都源于费舍的博客 k-punk，你可以通过阅读《K-Punk》(2018)——这是一部包含精选博客文章、音乐和电影评论以及随笔的合集——来体验他思想中那段混乱的历史。在德勒兹的本体论中，正如我所理解的，“存在”包含了无限可能的差异——在这里，德勒兹遵循了斯宾莎（Spinoza），后者认为宇宙是一个孕育着无限多样性的单一实体。对于德勒兹来说，“强度”是一种差异的丝丝缕，我们可以感受到它的影响但无法完全感知，那是一种我们尚未通过自己的视觉策略去驯化的差异。


    阅读费舍较短的书籍，你会感到他的思想中存在某种模糊且未定义的东西；从这些书转向 k-punk，或者《K-Punk》（两者的阅读体验非常不同），就是为了看到那些书中未曾表达出来的某些可能的“费舍”。在这些强度中，有些ر比其他的更具吸引力。


    在 20 世纪 90 年代，费舍隶属于赛博文化研究小组（Ccru），这是一个非正式的学术子部门，最初由萨迪·普兰特（Sadie Plant）领导，在她离开华威奇大学后，由她的前男友接手。那个前男友是
    尼克·兰德（Nick Land），他在一系列将恐怖小说风格与高深理论融合的奇特文本中勾勒出了一种观点，这种观点后来被称为“加速主义”（accelerationism）。兰德理论化地指出，资本主义正如马克思曾说过的那样，是一种吸食人类生命和劳动的血鬼，使我们与自我变得异化，但实际上这是件好事，因为我们所知的人类意识和主体性也是血鬼式的寄生。一旦资本主义清洗了我们的人性，我们就会准备好迎接……某种东西。兰德后来痴迷于神秘学，并有一段时间认为自己被三个独立的实体占据。在那之后一段时间，他成为了新反动运动（neoreactionary
    movement）的知识明星——仅仅是因为竞争对手太弱了——该运动是另右翼的前身。这个人可能需要一个驱魔师；而他绝对不需要信徒。


    不用说，费舍没有跟随兰德走上那条左倾右权的道路。但他早期的一些帖子承载着青少年式的厌世情绪和 X 世代的边缘人愤青（edgelordism）。“为了支持生育者的放纵而增加更多剥削性税收的前景，意味着对出生（natality）的生物政治特权的质疑早已迟已至，”他在
    2000 年代中期的反出生主义阶段这样写道，听起来像一个刚刚发现酷儿理论的安··兰德（Ayn Rand）式自由主义者。他一遍又一遍地对抗抑郁药物说一些真正愚蠢的话，他似乎无法区分这些药物的作用与海洛因的区别。他有时太容易被他人的虚无主义所触动。多年后，费舍写了备受争议的文章《走出血鬼城堡》（Exiting
    the Vampire Castle），认为网络左翼由于其竞争性的道德主义和对相互羞辱的成瘾，已经开始“为资本效力”。左翼人士正在耗尽彼此进行更大、更高尚项目所需的能量，因为他们认为此类项目是不可能的。他们是彼此的血鬼。早期的费舍有时被困在另一种血鬼城堡中，那种由一种同样耗能、同样破坏性的竞争所构成的城堡——为了在任何意义上显得“酷”。


    你仍然可以翻阅 k-punk 的存档，我向任何佩慕费舍作品的人推荐这样做——他最初作为一名博主引起大众关注，而媒介即信息。但这可能是一项忧郁的练习。在某种程度上，是因为你遇到的那些强度——那些最终并不存在的、好坏不一的费舍们；在某种程度上是因为你遇到的那些强度……

