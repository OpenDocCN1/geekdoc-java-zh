    ## 如何成为文化人 (I)


    ## 烂片


    我喜欢看烂片，这是我和父亲分享已久的消遣，也是一种爱好。


    当我还是孩子时候，我们会坐在系列从跳蚤市场或路边捡来的沙发上，一边吃着微波爆米花，一边看电影，比如《外星少年》（Teenagers from Outer Space,
    1959）或《金星怪物索恩塔尔》（Zontar, the Thing from Venus, 1962）。我的父亲会在深夜设定录像机，录制那些播放这些电影的电视节目，带着显而易见的绝望感，在《惊形浩客》（The
    Incredible Hulk）的重播和当地床垫店连锁店录像机拍摄的广告之间录制。就像沙发一样，乐趣必须随缘而遇，随遇而得。


    我们的爱好既不是完全独特，也并不常见。几年后，电视节目《神秘科学剧场300》（Mystery Science Theater 3000）将这种潜台之词文字化：它的框架由一个男人两个机器人组成，他们在屏幕上播放烂片时对背景音进行吐槽。重要的是，这个男人不是孤单的，同时他又又是某种孤立的：一个像鲁鲁索式的人物独自在卫星上，被迫为自己建立一个由会说话的机器人组成的微社会。看烂片是一种社交性又边缘化的活动；它是一种围绕着正常电影欣赏的观看方式。


    在烂片经典作中，埃德·伍德的《外星九号计划》（Plan 9 from Outer Space, 1959）是反经典之作。在看烂片的人聚集的“卫星”上，它是我们的《公民凯恩》，我们的《七武士》，在亚马逊时代之前，你必须费力搜寻它。它的无能是传奇性的。那些飞碟显然是燃烧着火焰的纸盘；演员们不断地将道具武器指向自己或别人，忘记了假装手中的塑料物体是枪。一段垂死临终的贝拉·卢戈西（Bela
    Lugosi）的片段——遗憾的是，这是他最后一部电影的头衔演员——与卢戈西去世后拍摄的其他镜头混合在一起，镜头中是一个高得多的男人（伍德妻子的脊椎医生）扮演同一个角色，蹲着并捂住脸。


    对孩子来说，成人世界之所以令人压抑，部分是因为它显而出的能力，那种知道该做什么、何时做以及该如何称呼一切的气质。《外星九号计划》那种无休止的、固执的、甚至是精细的失败——它它失败的方式——对想象力来说是一种补剂，是一种狂欢式的反转。我需要看到成人的疏忽并将其命名；我需要观察它在世界上留下的那个小洞。


    随着时间推移，我也变成了一个成人，热心地投入写作（对于一个二十多岁的人来说，这也意味着“热心地无所事事”）。我读了关于美学的论文；我思考伟大。对我来说，拥有自己的权威并知道自己在做什么变得非常重要。我试图成为那种能够对许多读者想要提出的问题提供稳定连贯答案的人：我所谓的“烂”片是指？谁说它们是烂的？根据什么标准？我如何知道那些是可靠的标准？我想要的“烂”是指什么含义？


    关于“好”与“坏”的区别，我们并没有真正越过大卫·休谟的《趣味标准》（Of the Standard of Taste），这篇文章在两个半世纪前告诉我们，“好”艺术是深思熟虑者的共识。你通过深思熟虑地比较作品来培养这种能力。对于这一论点，二十世纪的读者会强调休谟认为显而易见的事实：参与他所描述的那种对话首先需要识字和空闲时间，但还需要看起来“权威”的能力（无论在那个时刻看起来有多权威），或者是额外的聪明、运气和坚持，这让你在不看方式的情况下混过去。


    出于这个原因，休谟给人的印象——是正确的——是一个守旧派。但他阐明的过程在任何人类活动的粉丝中某种程度上都在运作。给运动员排名——并为他们的排名争论的人也参与其中。休谟无法认可的艺术形式也是如此。读一百本浪漫小说，你对谁写的最好以及你所谓的“最好”有一些观点。与他人讨论这些观点，你会反复听到某些名字（乔格特·海耶
    Georgette Heyer；詹妮弗·库西 Jennifer Crusie）。在科幻变得体面之前，任何粉丝都可以告诉你罗伯特·海因（Robert Heinlein）、西奥多·斯图根（Theodore
    Sturgeon），以及在他们之前的斯坦利·温因鲍（Stanley Weinbaum）写得最好。


    这就是任何人类活动的运作方式。我们参与，我们比较，我们开始注意到自己的喜爱，我们开始阐述是什么让它们成为喜爱。因为我们每个人都不是某种物种的成员，某些标准存在重叠。排斥性和压抑的社会结构扭曲了这个过程，但它们并不构成它。


    我们看烂片的人有自己的反标准，即我们喜欢的各种口味的“烂”。我们一些人使用“烂片”一词仅仅是指那些来自所谓的低俗流派的电影，或者是以我们倾向于风格化的夸化的方式（1989年的《亡命金槽》Road
    House 就是这种烂片）。我们一些人喜欢那些剥削且俗气但以尼采式比体面电影更有力的电影。雷纳塔（Renata）将电影崇拜者称为“愤怒的宣张者”（the angry
    claimers），这个词可能是想指责保琳·凯尔（Pauline Kael），她的文章《垃圾、艺术与电影》（Trash, Art, and the Movies）可以作为这种批评的宣言。摇滚评论家莱斯特·班克斯（Lester
