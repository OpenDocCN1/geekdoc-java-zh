    to go find it and couldn’t figure out how to begin. “Bothered” was always a


    kind of beacon in all that noise; it gathered and symbolized something. (Over


    the Rhine recorded the song at least three times; only the 1997 piano-led


    version has that intensity for me.) Perhaps, for the experience of God to begin,


    you have to pull a little more of yourself together, unappealing as that task
    is.


    You have to gather your selves like sheaves and offer them.


