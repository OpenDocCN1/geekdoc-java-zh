    术语完全混乱了。与此同时，我继续在看烂片。我横跨整个城市去看《金刚刚复生》（1986）的重映，那部电影极其荒谬到发行商都拒绝让西斯凯尔和艾伯特（Siskel
    and Ebert）在电视节目中播放它的片段。我熬到深夜，寻找并下载了1982年土耳其奇幻电影《拯救世界的人》（Dünyayı Kurtaran Adam）的种子文件碎片，这部电影因为未经授权且笨拙地剪辑了真实的《星球大战》片段，在英语国家被称为“土耳其版星球大战”。在《龙之再次复生》（1979）的放映期间，我丢了钱包，这并不不妥——那是一场超现实的版权侵权盛宴，一位扮演复活李龙（尽管长得不像）的演员与名为“教父”、“驱魔人”、“大力水”、“詹姆斯·邦”和德拉库等角色战斗。我开始爱上《暮光之城》（2008），它对人类心理和对话那种封闭式的视角，它那令人喜爱且透明的愿望达成方式，以及那场无法解释的棒球赛。在它下映后，我对比《蝙蝠侠大战超人：黎明之》（2016）感到惊叹，这部电影就像一个忧郁的青少年，滑稽地完全不记得自己为什么郁闷。


    “坏”也可以意味着“道德上的粗俗”——这在班克斯/凯尔（Bangs/Kael）的意义上，“垃圾电影”往往如此。出于这个，我对垃圾本身并不感兴趣，尽管我欣赏一些被贴此类标签的电影。除了社会学角度外，我不在意赋予不同审美高低位置的价值。一部低俗的好片仅仅是一部好片。（1979年版的《亡灵之日》就是是一部好片。）我喜欢的特定类型的“坏”，是那种幼稚或无能的电影——它所做的一切，都是无意为之。


    例如，某些烂片通过纯粹的缺乏自知，揭示了产生它们的文化的逻辑不通和语法错误。这类电影令我着迷，就像一个过于诚实的傻瓜在喝了三四杯酒后的样子。《红色黎明》（1984）在这方面是有名地令人享受。最近，艾娃·杜瓦奈（Ava
    DuVernay）改编的《奇幻星空》就诠释了这种坏感。（杜瓦奈在这部电影的前后都做过优秀的工作，特别是她对监狱工业复合体的的研究，所以我将《奇幻星空》中那种丰富而奢华的烂，归于它的编剧以及传闻中极短的制作周期。）像很多烂片一样，《奇幻星空》充满了这样的时刻，如果以自知的精神来呈现，将构成不可反驳的讽刺。通过这一测试的场景是：奥普拉·温妮瑞（Oprah
    Winfrey）饰演魔法维奇夫人（Mrs. Which），身高两楼高，像全息投影一样闪烁，对英雄的小梅格·马里（Meg Murray）露出和蔼的微笑。这几乎是对奥普拉在美国生活中奇特地位的极其狡猾的评论，她从她亿富翁的高度俯瞰我们，却又被困在一个不被感激、去人性化的角色中——即白人女性气质中智慧、无形、从未真正真实的宇宙级黑人朋友。（我不确定当莉丝·卫斯斯隆（Reese
    Witherspoon）在电影早期变成一个巨大的飞行生菜时，这对我们的文化说明了什么。）


    然而，这部电影贡献最大的地方——也是它提供了一个观察美国文化的视角，这种视角如此黑暗、如此彻底，以至于它的坏感像伟大一样留存在脑海中——在于它凸显了美国人对自尊崇拜中下意识的虚无主义。在某一点，维奇夫人对梅格说：“你意识到从宇宙诞生到你被创造出来，有多少事件和选择必须发生吗？恰恰就是你现在的样子。”她对查尔斯·曼森（Charles
    Manson）或亨利·基辛格（Henry Kissinger）或一台吹风机说同样的话，也同样正确。（曼森会歪着他那奇怪的小脑袋表示同意：宇宙在产生他那独特正确的自道路上走了多么不可思议的路。）不久后，维奇夫人向梅格介绍了由扎克·加菲菲纳基（Zach
    Galifianakis）扮演的牧羊。他的工作是帮助梅格（我必须强调这是一个孩子）拯救她的父亲（我必须强调他是一个天体物理学家，被一个几乎全能的邪恶智能困在宇宙的另一端）。加菲菲纳基告诉她，她已经可以做到了：她只是选择了不去做。


    这是一个令人惊惊的残酷时刻。它让我愤怒了……

