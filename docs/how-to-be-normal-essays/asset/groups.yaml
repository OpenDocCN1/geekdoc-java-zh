    bagged leaves and begging letters to relatives and church acquaintances, I went.


    So did she. (How she got there is far more interesting but not my story to tell.)


    In my family, jobs were not—except for a few fortunate years when my father worked
    with the developmentally disabled—a source of joy. I had half-formed notions of
    becoming a writer, but I did not really look to my future career for happiness.
    Unfortunately, this very lack of interest in my own future meant that I had no
    more idea how to talk to my peers in Washington, DC, than I did my peers back
    home. I spent a mostly miserable week wordlessly sitting through my seminars and
    doing my homework; my lone friend was a kind young man who wanted me to come to
    his room so that we could listen to Depeche Mode together, an invitation the possible
    overtones of which missed me. (God bless him.) The formal dinner and dance with
    which this conference was to end loomed for me as another marker of my apparently
    absolute inability to ingratiate myself to other human beings.


    On the last day of the conference, a girl talked to me. This in itself was not
    too shocking, but she kept doing so after the initial pleasantries were over.
    Then later, when I ran into her in the atrium where I waited in gloom for the
    dinner/dance to begin, she talked to me some more. I found this confusing, though
    it made me deeply happy. As the overwhelming anxiety of talking to a girl at all
    receded, I noticed—and then confirmed multiple times because it didn’t make sense—that
    she was pretty. She laughed at my jokes in a way that wasn’t politesse. I laughed
    at her jokes. Every detail she told me about herself was the strangest thing I’d
    ever heard. She was from El Paso, Texas, for example, and I thought that that
    was such an interesting way to be from somewhere; I had never tried it. She had
    a mom, to whom she was close—think of it, a mom! To whom she was close! (A lucky
    woman, that mom.) She kept, of all things, pets. She enjoyed theater, she told
    me with her mouth—the exact right shape for a mouth, I suddenly realized. Her
    nose had very light freckles. She eventually used the word “existentialism,” which
    made the connections between us altogether eerie, for I, too, knew what that was.


    Reader, we talked all night. We danced—though this is as impossible as she herself
    was as I do not dance. (She knew the Macarena approximately six weeks earlier
    than did the rest of America, a fact in which I found further evidence of her
    sophistication.) I kept waiting for the moment when she would explain that I found
    me very nice, that she would enjoy telling her boyfriend back home about the great
    new friend she’d made. This moment did not come until, with almost no premeditation,
    I kissed her. (It was a fast, soft kiss, more an opening statement than a pleasure
    stolen. There was simply something I needed her to know about her own greatness
    that could not be conveyed otherwise. The medium is the message.) She was not
    upset.


    We hung out the next day at the airport and then flew home to places that did
    not have each other in them, and we wrote to each other for months. But I was
    a coward. I could not risk that happiness again, so I went back to my life and
    despaired. The next year, I went to college and dated my partner, and Ashley went
    back home and worked with the singlemindedness that a deeply wounded person works
    with—a few weeks into our correspondence, she told me about the specific shape
    of her woundedness, which I already knew was there—and she got into Yale and dated
    another guy, whom she almost married, who cheated on her. For years, we barely
    spoke. An interesting fact about life: a person can be wrong for years, about
    what they can get by without. When we began to talk again, I made a self-deprecating
    joke about that kiss on the bus. She informed me that it had been “the most romantic
    moment of my life.” Then we started to talk every day, and within weeks the carrier
    was slow to bring a reply we were together. That is the story! Who could live
    up to it? Not me, certainly. In the years between meeting and dating her, I had
    lost my heart a few times, and had learned the miraculous powers of irony, of
    laughing at your old selves so you could take the current one seriously. Every
    months, like a computer emptying a cache, I trashed my old selves. It undid me.
    A man who is undone is not always fun to be around. So many of our entanglements,
    in our twenties, are about the joy of being intimate, being intense, without having
    to be known; was I ready to be done with that delightful form of self-harm? It’s
    a miracle I didn’t break up with her in that first year—not because she was wrong
    but because she was so right that if I stayed with her, I would have to care what
    happened to me, and then I lived.


    She was brave, compassionate to the point where we once spent most of a day walking
    in the snow, looking for a place where she could wire money (which, as a grad
    student, she didn’t have) to an activist friend. The friend, later learned, had
    relapsed on heroin. (She knew the signs, and she was not oblivious—she just refused
    to assume.) She had all these small, middle-class social graces that I wasn’t
