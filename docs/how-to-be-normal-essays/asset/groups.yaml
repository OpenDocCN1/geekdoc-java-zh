    white supremacy does now—rests on it? Perhaps Europeans, stepping off their


    different boats, could have learned to see each other as human beings even


    without positing a second category of person onto which they could project


    their hatreds and fears. We can’t know; that is another, sweeter history. This
    is


    ours.


    Our literature contains little memories of how contingent it all is: a dream is


    only convincing while you’re in it. In George Schuyler’s novel Black No More


    (1934), a crank scientist invents a process by which Black people can be turned


    white. This trope, which also appears in Stephen Wright’s The Amalgamation


    Polka (2006), both literalizes and reverses the actual history in which


    pseudoscience and opportunism worked together to whiten billions, many of


    them after the fact. (Was Homer “white”? Was Augustine?) Processes can be


    reversed. During the Trump era, Latinx people lost several degrees of whiteness'
  - '[PAGE 30]


    more or less overnight. Among committed white supremacists, there is always


    the danger that old intra-European racial divisions will resurface and the lordly


    Anglo-Saxon will once again seek to rise above the scheming Spaniard, the


    passionate Italian, the potato-headed Celt.


    Whitening is a process without an obvious endpoint. “Whiteness” is always


    somewhere out a bit ahead of you—even white supremacists lament the


    somewhat desiccated state of today’s whites. The concept is impossible to


    define in terms of traits because describing anything was never its function.


    And yet everybody tries. Sometimes this means taking the white


    supremacist’s definition of whiteness—rational, brave, scientific, humanity’s


    future—and simply asserting that these things are bad: for example, antiracist


    museum exhibits that list “rugged individualism” and “emphasis on scientific


    method” among the sins of whiteness. (The museum in question later


    apologized.) It takes boldness to position whitened people as particular valuers


    of rationality and individualism in a historical period when millions of them


    are turning their minds over to an emerging cult based literally on internet


    forum posts, or flinging themselves and their families at the COVID-19 virus


    as though it will be cowed by their bravery and walk off. This behavior was not


    transmitted genetically; it’s the product of the specific toxic individualism
    of


    the suburbs. Few people who aren’t whitened would be allowed the level of


    privilege where they could learn to think like this; this doesn’t make it a “white


    trait.” Millions of white people, again, can’t identify with it at all. In other


    cases, one attempts to describe “white people” by fastening onto characteristics


    that have to do with class or region or ethnicity, or with the necessary


    blandness of mass culture products. When people talk about “white people


    food,” they talk about what Norwegians eat or what the Irish were forced to eat


    or what McDonald’s produces, not what Italians or Spaniards eat.


    On the fringes of Black radical thought, one finds the clearest and closest-to-'
  - '[PAGE 31]


    coherent articulations of the white man’s special qualities. These stories, at
    their


    falsest, retain a certain crude power—the power of the sharp and specific pain


    behind them. I find, for example, the theory that I am the product of an


    ancient scientist’s breeding experiments deeply insulting, as I am surely


    intended to, but after spending enough time observing the impersonal cruelty


    and stupidity of the bureaucracies that maintain, among other things, the


    illusion that whiteness exists, even I have appreciated the explanatory value
    of


    old Dr. Yakub. Similarly, I can see how a person whose most frequent


    encounters with whitened people involve cops, prison officials, or other


    contemptuous functionaries might find an intuitive plausibility in the idea that


    lack of melanin makes people weak, cruel, and resentful. (Something sure as


    hell did.) One afternoon, as I left a courtroom where I had watched a Black


    friend get railroaded, I found myself thinking the words, I hate white people.


    It’s revealing as well how often these theories both dovetail with and


    resemble anti-Semitic mythology. Theologian J. Kameron Carter argues that


    Western Christianity’s rift with Judaism, and the anti-Semitism that resulted,


    was an intellectual and spiritual precondition for modern racism. In a deep


    historical irony, however, one of the most consequential uses of anti-Semitism


    was as a scapegoat onto which the European perpetrators of capitalism could


    deflect the blame for their own depredations. The story of the rise of


    international banking owes much to the Fuggers and Medicis, but you rarely


    hear of the former, and we mostly know the latter as a family of titillatingly


    debauched art enjoyers. When it comes to financial speculation, its invisible


    powers and corrupting effects, the name everyone knows is “Rothschild.”


    When you need a racial explanation for the specific horrors of international


    capitalism, you tell a story of secretive, powerful, cunning, and, in some


    essential way, soulless men. You call them the white man, or you call them the


    Jew. Sometimes you do both.'
  - '[PAGE 32]


    In more mainstream forms, such attempts to define whiteness as pathology


    often focus on the character traits that accrue to “unearned” privilege. (As soon


    as we say “unearned,” we have baked in the idea of meritocracy—which is


    some white bullshit.) The white person, especially the white man, is


    inescapably mediocre, as if by hereditary taint. She or he or they are entitled,


    neurotic, fragile, narcissistic, vain. He is named Bryce or Heath or Connor and


    wears shorts in the winter—so severed is he, at a basic level, from the truth
    of


    things. (Perhaps he just doesn’t care if his knees are cold.) She is named Karen


    unless her hair is good.


    This approach, too, has a crude descriptive power. Stereotypes often do. In


    an extension of this process, “white” becomes a name for certain varieties of


    bad politics: the conservative, the nationalist, the NIMBY progressive, the


    can’t-we-talk-about-this-later socialist, the you-looked-at-me-so-I’m-calling-


    the-cops feminist. In all these cases, “white” functions as a name for a kind
    of


    secular American freedom: freedom-from that has become freedom-over. It’s


    the freedom of the minor aristocrat—this being the type of person who gave us


    far too much of the Enlightenment political thought that permeates our


    institutions—or the freedom of the children of the southern rich, the group


    that disproportionately, has given us that bizarre and misnamed American


    political tendency known as “libertarianism.” (The word has a far nobler


    meaning in European contexts.) The libertarian is, spiritually speaking, a


    plantation owner’s son. He wants his taxes lowered, his employees free to work


    for free, and—with an eye toward those employees’ daughters—his age of


    consent abolished. His freedom requires that no one else be free of him. But all


    of these are positions, not traits. Many whitened people reject them, and many


    people of color buy into one or another of them. Given that the forms and


    shapes of exploitation are likely to shift in a world that America no longer


    dominates, this is important to keep in mind.'
- md: '

    There are two other intellectual problems with this approach. One is the term
    “privilege,” as it is often used in these sorts of conversations. As we’ve seen—as
    has been endlessly pointed out, to no avail—the “privileges” that whiten a person’s
    life may simply be created by conjuring new forms of suffering and applying them
    only to some people. As a result, “privilege” as used in this conversation “conflates
    ‘everyone should have this’ with ‘no one should have this,’” as David Kaib has
    said. It can mean on the one hand that the cops did not shoot you in the back
    and plant a gun on your still-warm body—or that, if they did, it was for some
    other reason than Blackness. Or “white privilege,” added to the advantages of
    wealth, may mean the easy freedom and contented stupidity of the plantation heir.
    (A powerful portrait of this sort of privilege asserting its power to warp character
    can be seen in the character of Rufus in Octavia Butler’s Kindred.) Even in these
    cases, the effects are unpredictable: a well-off white boy might become Eric Trump,
    or he might become Mr. Rogers, and whatever “white privilege” is, it certainly
    formed both men.


    This means that the psychological effects of “privilege” are hard to generalize
    about. We can say that a millionaire’s son will, in most cases, move through the
    world with an assumption of invulnerability and an air of command, such that he
    will be morally lucky if he can merely grow up into an amiable dunce in the Bertie
    Wooster mold. But millionaire’s sons are bad perforce. A black millionaire’s son
    might talk more about “uplifting the community” than a white man’s does, but he
    will be tempted to do it while making many of the same exploitative decisions.
    The psychological effects of privilege here are mostly those of wealth. To ask,
    on the other hand, what psychological deformities or bad habits may result from
    someone’s mere failure to get murdered by the police is ghoulish and, in its effects,
    reactionary. (In a country where the police think of themselves as an occupying
    army, it doesn’t make the situation better when millions of people lament the
    hamburger that was served to Dylann Roof.) And many of the effects of “privilege”—in
    the sense that “no one should have this”—are as likely to accrue to elite Black
    people as to whitened ones and do not accrue to millions of the people we call
    “white.” People often point this out because they wish to derail discussions of
    racism tout court; this is not because it is false but because true statements
    make good derailers.


    The third most common response, among the people designated “white,” to the radical
    critique of whiteness—the most common is to dismiss the whole issue or to fly
    to the defense of the assailed white man—is a wholesale adoption of this way of
    defining it: as a kind of shared sin. Because the concept of whiteness both excuses
    and inspires some of the worst and longest-running crimes in human history, every
    person we call “white” has a terrible, Faulknerian secret, which they must publicly
    acknowledge, describe, and lament in classes, trainings, book clubs, personal
    essays, and inappropriately anguished conversations with the nearest Black acquaintance.
    It’s as though we developed an excellent structural account of society just so
    that we could turn that, too, to the task of enumerating personal flaws while
    the boss takes notes. Whitened people who resist this little ritual are called
    “fragile.” When they participate in it, when they respond to these often moralizing
    and personalizing claims in exactly the way a person is supposed to respond to
    accusations—with some combination of personal guilt, apology, embarrassment, shame,
    or special pleading—they are called narcissists. “There you go again, making it
    about you. White people always center themselves,” they are told, by the (often
    white) facilitator. A metaphorical or actual microphone is dropped.


    The most obvious fact about this ritual is its uselessness. It may fix hearts
    (although this is doubtful). It doesn’t fix houses, lives, or water pipes. It
    doesn’t redraw school districts or defund the cops. At its conclusion, nobody
    gets forty acres and a mule. The ritual’s uselessness in addressing root issues
    probably helps explain its ubiquity; it is acceptable to enough powerful people
    that it can be widely adopted. (Robin DiAngelo, currently the most successful
    proponent of this approach, more or less concedes as much.) But if social stasis
    is the outcome of the ritual, I am not so sure that that is its sole purpose.
    I think many white people submit to the ritual because it feels bad. Many Americans
    have been trained to believe that feeling is a form of labor, perhaps the most
    meaningful, while practical help only fixes symptoms. When a child feels the natural
    impulse to give a panhandler money, we tell them, if we’re stupid, that he only
    wants it for drugs, or, if we’re slightly less stupid, we recite a certain platitude
    about men and fish. (It’s hard to pay attention to a fishing lesson if you’re
    starving, just as it’s hard to ace the ACT if you haven’t eaten or slept.) Our
    pundits talk of money as a “Band-Aid”; they talk of “throwing money at a problem”
    as though money were not, very often, precisely the thing that needs to be thrown.
    All this acculturation certainly helps somebody. But it does the least for the
    people who believe in it most. (The rich don’t believe it; they leave their money
    to their children.)


    The form of Christianity most widely practiced on these shores stresses faith
    over works to the point where good works are sometimes treated as suspect. It
    then talks about faith as a set of feelings. It’s obvious—and many people have
    pointed out as much—that the ritual resembles this type of Christianity, where,
    classically speaking, the subject must be brought to an exquisite pitch of self-recrimination
    before they can be said to be saved. The newly converted frontier evangelical,
    however, had the love of Jesus to look forward to, while the white person who
    has Done the Work can only anticipate the rigorously impersonal, loveless worlds
    of civics, activism, or—if we’re thinking of DiAngelo’s antiracism specifically—the
    workplace. (DiAngelo’s main function, I suspect, is to protect corporations from
    liability in the case of a discrimination lawsuit and to reduce solidarity between
    white and Black workers. In the latter case, it will often enough be true that
    she is just finishing a job that firm’s white workers started long ago.) Regarding
    activism, it’s a utopian pursuit with generally dystopian interpersonal dynamics.
    As for civics, the whole promise of the endeavor—at least under liberalism—is
    that it doesn’t require love. Part of what a secular antiracism necessarily aims
    at is a world where Black people could, if they wanted to, ignore white people
    safely. Antiracism must also secure for Black people the right to be, without
    punishment, as irritating, mediocre, or dysfunctional as, say, reasonably prosperous
    white man may be. These are legitimate goals which, as far as they go, any fair-minded
    white person must try to bring about. My point is only that such a world—in one
    way radically transformed, and in another way depressingly the same as ours—makes
    for an odd conclusion to a ritual modeled on the supposedly universe-changing
    rituals of evangelical salvation. The critique I make by pointing out the religious
    character of the ritual is simply that of a mismatch between ends and means. But
    white people who respond like newly evangelized subjects to an evangelical ritual
    are not “centering themselves”; they are following the instructions buried in
    the situation. The people who will inflict this kind of psychological self-harm
    upon themselves fall, in my experience, into two camps, which sometimes overlap.
    On the one hand, there are kindhearted people with pathologically low-esteem,
    often, and not accidentally, women. They are used to taking the blame; DiAngelo’s
    voice imitates the voice in their own heads. On the other, there are people so
    prosperous that they can afford, in effect, a daily three-minute self-hate. The
    great mass of white people, whose “wages of whiteness” still leave them unable
    to afford their rent, will look at these exemplary flagellants and say more or
    less what working-class city whites used to say about school.

