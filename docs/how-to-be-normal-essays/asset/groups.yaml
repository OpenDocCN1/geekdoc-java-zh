    threw his copy away years ago.) The speaker scrutinized popular song lyrics to
    reveal, underneath the nonce words and varying interests and haphazard references
    of several dozen ’60s and ’70s artists, a single, unified, and unvaryingly diabolical
    worldview. By sheer legerdemain, he transformed Bob Dylan’s “The sun isn’t yellow/
    It’s chicken” into “The Son isn’t yellow/ He’s chicken.” When, sometime in college,
    I listened to Highway 61 Revisited and heard the actual lyric, I was still naive
    enough to be angry. Though I had, in late-teenage fashion, messily renounced fundamentalism,
    had read Dostoevsky and Nietzsche and even attended a church in a denomination
    that ordained women (a clear violation of several New Testament passages and thus
    ruled out), I honestly wasn’t prepared for the knowledge that my people might
    sometimes just lie.


    I have spent a good portion of my adulthood wondering about the psychology behind
    a lie like that. On the surface, it does not make sense morally, intellectually,
    or strategically to force the evidence in this way, to go through the motions
    of providing a textual citation for one’s claim—an implied it’s right there, just
    look it up—and then doctoring the text in the manner of those people who used
    to mark up satellite photos of the moon in order to prove that there were giant
    statues on it. If you’re going to be that irrational, why not abandon the appeal
    to book learning, to scholarly standards of evidence, entirely? Why not just say
    that God showed it all to you in a vision? And yet it’s not the first lie of this
    precise kind that I’d seen. Strategic misquotations, ingeniously touched-up uses
    of original sources cropped up regularly in church. Much of my childhood religious
    education was, among other things, an apprenticeship in the art of finding terrifying
    hidden meanings—having to do with drugs, demonology, the Rapture, secret control
    of the government, and other topics—in texts the outward meaning of which was,
    in some cases, perfectly banal or, in others, already offensive but in routine
    ways.


    I remember a speaker at our church who, in order to provide evidence for his claim
    that Catholicism was not a branch of Christianity but an ingenious occultist’s
    forgery of same, cited Athanasius’s famous statement, “God became man that men
    might become gods.” He capitalized the second g and removed the s, placed it on
    a slide, and said, “This is official Catholic doctrine.” Athanasius, of course,
    is one of the four or five theologians most central to Christian history; for
    a Christian to thus represent him is to saw his own leg off. (The response of
    church leadership, when I complained, was essentially to point out that not everything
    could be subtle and careful, the way you intellectuals like it.)


    I have come to suspect that the people promulgating these sorts of lies believe
    themselves in a spiritual war where words carry a power independent of the meanings
    that readers find in them, or their material effect on history, or anything they
    say. Among the more erudite fundamentalists, one still hears about the theories
    of Alexander Hislop, who in his 1853 pamphlet, *The Two Babylons*, argued that
    that the Catholic Church was, by the ingenious use of various symbols, secretly
    worshipping ancient Babylonian gods. Again, the polysemy of language gives rise
    to conspiracy theories: the verbal resemblance between “Easter” and “Ishtar,”
    the adventitious reuse of some symbol or icon. As with the claims that Led Zeppelin
    albums contain secret backward messages or that Bob Dylan says a blasphemous thing
    that, with a little adding and retouching of syllables, he can be forced into
    saying, the assumption seems to be that language has a hidden layer, which is
    active despite the conscious intentions—or even the actual words—of the person
    using it. For a person who believes that the Bible—the most important book of
    all time—was divinely inspired, that the language poured out of disparate writers
    at disparate time periods in a kind of overturning of their particular personalities
    and wills, such a view of language doesn’t seem like much of a stretch.


    The fundamentalist polemic against rock, as against many other things, was rooted
    in a belief that language had frightful powers, and a fear of the moral contagion
    that those powers might exact. With a little ingenuity, that kind of fear can
    take on baroque proportions. Perhaps the best explanation for fundamentalism’s
    moral decline, when measured against its grandparents, is that it didn’t start
    often enough from the premise that the contagion was already within. And like
    many exaggerated fears, this one has a tendency to turn inside out. On the theory
    that you are merely defending yourself, you revel in the thing you claim to oppose.
    Pizzagate, and more recently QAnon, clearly grow from fundamentalist Christianity,
    but the willfulness with which they practice mystical eisegesis seems new to me.
    QAnon, in particular, is distinct from all these earlier phenomena, even Pizzagate,
    in that it produces the texts that it then proceeds to find arcane meanings in.
    This suggests a new level of self-assertion in the practice: I will live in a
    patently constructed fantasy universe and you can’t stop me. In this way, the
    ridiculousness and self-contradiction of the QAnon story is part of the point.
    (Pizzagate has at least this much dignity: you can read it as a warped way of
    assimilating the impossible horror of Jeffrey Epstein’s existence and his clear
    place at or near the center of power.)


    This is some of the intellectual background that made it necessary for me to apply,
    in writing, to my father, for permission to buy a Tears for Fears tape. The thing
    that most surprises me, in looking back on that moment, is that I won. My father
    accepted my argument, even though he believed he was risking my soul in doing
    so. This had to cost him. And the nature of the reasoning I used reminds us that
    fundamentalists have always had to negotiate with a world constituted on other
    premises than theirs, premises that can also, in many cases, claim a Christian
    sanction. My argument was of a type that many might call “Enlightenment liberalism,”
    but it rested ultimately on a moral vocabulary and set of assumptions that are
    recognably Christian in origin: the importance of moral choice; the dignity of
    human beings as moral actors; the importance of being free to eat the fruit. The
    author of Areopagitica read the Bible too.


    Our contest was not one between intellect and irrational fideism. I had to work
    hard to win because he had arguments, however uneven in quality. Fundamentalists
    think; people at odds with modernity have to do so if they wish to stay at odds
    with it. This fact should terrify secularists—not for the reasons that fundamentalists
    might hope but because of what it implies about thinking. For we secularists,
    too, believe in thinking, in being “smart.” We make tables and graphs and the
    sort of podcasts that use ambient music in the background. We Vox-splain. When
    a Pizzagate emerges, we fact-check it, sardonically and thoroughly. What growing
    up fundamentalist helped me learn early on, is how terribly wrong you can be while
    thinking very hard. The energy that fundamentalists have thrown into documenting
    the evil of rock music (a phenomenon that neither they nor anyone else have ever
    even precisely defined) represents a terrible misuse of brainpower. It is Clintonian
    in its folly; it is like hiring brilliant people to lose a world-historical election
    for you.


    Stupidity and intelligence, I have come to believe, are symbiotic. We might say
    that this is the final tension that keeps fundamentalism in its state of continuing
    unlife. Unfortunately, we could say that it does the same thing for secularism,
