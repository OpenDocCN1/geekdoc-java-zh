    - Dwight Macdonald: “Mass and Midcult,” in Mass and Midcult: Essays against the
    American Grain (New York, NY: New York Books Classics, 2011), 51. First published
    in 1960.

    - Samuel Delany: About Writing: Seven Essays, Four Letters, and Five Interviews
