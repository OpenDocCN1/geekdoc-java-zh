    In the early 1960s, two now-famous arguments emerged that seemed to

    offer the promise of stabilizing things somewhat. The philosopher Arthur

    Danto begins his 1964 essay “The Artworld” by acknowledging that the word

    art now names too many disparate things for someone to be simply good at it,

    as you might be good, say, at changing tires. One could argue, until around the

    time of the post-Impressionists, that art (Danto means Western art) meant

    some kind of imitation: Praxiteles gets a slab of marble and cuts away

    everything that doesn’t look like a resting nymph. Monet paints until he only

    has things that look like light on water. And then—on or about December

    1910, to borrow a phrase from Virginia Woolf—the nature of art changed:

    In terms of the prevailing artistic theory . . . it was impossible to accept

    [post-Impressionist works] as art unless inept art: otherwise they could be

    discounted as hoaxes, self-advertisements, or the visual counterparts of a

    madman’s ravings. So to get them accepted as art, on a footing with the

    Transfiguration (not to speak of a Landseer stag), required not so much a

    revolution in taste as a theoretical revision of rather considerable

    proportions, involving not only the artistic enfranchisement of these

    objects, but an emphasis upon newly significant features of accepted

    artworks, so that quite different accounts of their status as artworks would

    now have to be given.


    Danto captures something important and true about our experience of art:

    Once part of the game involves proposing new kinds of activity as art, it changes

    the way we read everything that came before. When, for example, Kathy Acker

    steals from older texts, both to say certain things that she wishes to say and
    to

    dramatize the way her intentions and meanings get tripped up by the

    recalcitrance of language itself, she adds another layer of meaning to every

    previous novelist, a layer consisting precisely of the fact that they could have

    done this and did not. Incompetent movies, in a similar way, can increase our

    appreciation of competence while relieving our boredom with it.


    But Danto’s argument, with its implication that anything can be art, also

    points toward chaos. The problem with chaos is not that it is dangerous but

    that it is not that interesting; as far as the human, perceiving subject is

    concerned, it is not anything. We apprehend it, perhaps are stimulated by it,

    only when there is some order or form or tendency that it contrasts with.

    Among other reasons, Plan 9 from Outer Space is funny because it’s not the first

    movie you’ve ever seen. You have several ideas of what “acting” should look

    like, so that whatever Tor Johnson and Vampira are doing in the film, you

    know it isn’t good acting. (Indeed, they help you like good acting even more.)


    So Danto provides a kind of backstop: For an activity to be art, it has to

    emerge from within “the artworld,” from someone who has some amount of

    training or background in art. Andy Warhol’s chauffeur, whistling off-key,

    is not yet an artist, in Danto’s argument, but if Warhol, seeking to amuse Lou

    Reed and Paul Morrissey, imitates his chauffeur’s off-key whistling, that is art.

    So what if the chauffeur, overhearing Warhol, imitates him in return? Danto’s

    argument implies that the only sustainable basis on which to maintain the

    separation between art and nonart is institutional and biographical: who knew

    whom, who got money from where, how someone secured an artistic

    apprenticeship, whether they know they’re “doing art.” This feels like a

    demystifying assertion, but it makes the split between artists and everyone else

    permanent. We know now that there is nothing separating us from Jeff Koons

    or Damien Hirst—not skill, not intelligence, not vision, not moral purpose,

    for neither man has any of these things. There is nothing to them besides

    money. But who the hell has money?


    The same year Danto published “The Artworld,” Susan Sontag responded to

    the evident fact that bad art could be meaningful with her classic essay “Notes

    on Camp.” The essay has been discussed to death elsewhere, and as an

    examination of the psychology of a person who enjoys, say, overblown and

    formulaic B movies, it is still hard to surpass. What interests me about “Notes

    on Camp,” at this remove, is how firmly Sontag positions “the good taste of

    bad taste” (her capsule definition of camp) more or less as Mystery Science

    Theater 3000 positioned its captive audience—off on a satellite:

    Ordinarily we value a work of art because of the seriousness and dignity of

    what it achieves. We value it because it succeeds—in being what it is and,

    presumably, in fulfilling the intention that lies behind it. We assume a

    proper, that is to say, straightforward relation between intention and

    performance. By such standards, we appraise the Iliad, Aristophanes’ plays,

    The Art of the Fugue, Middlemarch, the paintings of Rembrandt, Chartres,

    the poetry of Donne, The Divine Comedy, Beethoven’s quartets, and—

    among people—Socrates, Jesus, St. Francis, Napoleon, Savonarola.

    In short, the pantheon of high culture: truth, beauty, and seriousness.

    With one hand, Sontag offers a way of reading that could make anything—a

    child’s painting, a candy-bar wrapper, the deposition of a stupid government

    official, Danto’s “hoaxes” and “self-advertisements,” de-man

    Danto’s “hoaxes” and “self-advertisements”—at least

    somewhat revelatory. With the other hand, she relegates that way of reading to

    the sidelines. The possibility of camp, once admitted, effects a similar change
    in our relationship to “good” art, to art

    that has what Sag calls a “straightforward . . . relation between intention

    and performance.”


    Raiders of the Lost Ark: The Adaptation (1989–2014)—a shot-for-shot remake

    of Steven Spielberg and George Lucas’ classic adventure film Raiders of the Lost

    Ark, filmed during summer vacation by a group of undersupervised

    children in the years 1982–88, with two sequences added in 2014—tests both

    Danto’s and Sontag’s theories to hilarious, destabilizing effect. It is an art
    object

    made by nonartists; it is a piece of bad art that commandeers and reorients our

    reading of an agreed-upon classic. It breaches the boundaries between bad and

    good from within. It is a satellite that changes its planet’s orbit.

    When I first read about this film many years ago, I knew simultaneously that

    I had to see it and that I never would. Imagine the rights issues involved!

    Surely George Lucas, that zealous hunter of Star Wars Christmas Special VHS

    dubs, and Steven Spielberg, his name famously misspelled in The Adaptation’s

    credits as “Spielburg,” would never allow this film to see the light of day.

