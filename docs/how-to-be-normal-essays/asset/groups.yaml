    take it that every person’s mind is a sort of junk shop full of beautiful and

    terrible ideas and images and possibilities and phantasms and all of their

    opposites, which we have absorbed from our world. (Psychologists can speak of

    “upsetting” or “invasive” or “unwanted” thoughts precisely because we don’t

    want everything we find in our brains.) You have to make the best thing you

    can from your junk shop. Equally, it’s the responsibility of political movements

