    helps explain its ubiquity; it is acceptable to enough powerful people that it


    can be widely adopted. (Robin DiAngelo, currently the most successful


    proponent of this approach, more or less concedes as much.) But if social stasis


    is the outcome of the ritual, I am not so sure that that is its sole purpose.
    I think


    many white people submit to the ritual because it feels bad. Many Americans


    have been trained to believe that feeling is a form of labor, perhaps the most


    meaningful, while practical help only fixes symptoms. When a child feels the


    natural impulse to give a panhandler money, we tell them, if we’re stupid, that


    he only wants it for drugs, or, if we’re slightly less stupid, we recite a certain


    platitude about men and fish. (It’s hard to pay attention to a fishing lesson
    if


    you’re starving, just as it’s hard to ace the ACT if you haven’t eaten or slept.)


    Our pundits talk of money as a “Band-Aid”; they talk of “throwing money at a


    problem” as though money were not, very often, precisely the thing that needs


    to be thrown. All this acculturation certainly helps somebody. But it does the


    least for the people who believe in it most. (The rich don’t believe it; they
    leave


    their money to their children.)


    The form of Christianity most widely practiced on these shores stresses faith


    over works to the point where good works are sometimes treated as suspect. It


    then talks about faith as a set of feelings. It’s obvious—and many people have


    pointed out as much—that the ritual resembles this type of Christianity,


    where, classically speaking, the subject must be brought to an exquisite pitch
    of


    self-recrimination before they can be said to be saved. The newly converted


    frontier evangelical, however, had the love of Jesus to look forward to, while


    the white person who has Done the Work can only anticipate the rigorously


    impersonal, loveless worlds of civics, activism, or—if we’re thinking of


    DiAngelo’s antiracism specifically—the workplace. (DiAngelo’s main function,


    I suspect, is to protect corporations from liability in the case of a


    discrimination lawsuit and to reduce solidarity between white and Black'
