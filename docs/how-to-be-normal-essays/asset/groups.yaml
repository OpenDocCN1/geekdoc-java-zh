    我该如何具有建设性？


    那么经常与你最亲近的人谈论你的答案。


    ## 致谢与感谢


    《如何变得正常》一文曾出现在《基督教信使报》（Christian Courier）2020 年 11 月版上，该文由 Brian Bork 和 Mike Buma
    编辑，我真希望此时此刻能和他们一起喝杯啤酒。


    《如何成为白人》首次登于 2021 年 4 月 9 日的《突破之路》（Breaking Ground），该文由 Susannah Black、Anne Snyder
    和 Heidi Deddens 组成的精英团队编辑。译文中还包含了我在 21 世纪 10 年代中期为《基督教信使报》为 Ta-Nehisi Coates 和
    J. Kameron Carter 撰写的评论的细微元素，这些评论是献给“绝对女王”Angela Reitsma Bick 的。


    关于男性气概、烂电影和中产阶级品味的文章最初分别发表在《刺猬棱评》（Hedgehog Review）的 2018 年夏季、2019 年秋季和 2021 年夏季刊上。这些文章是由该时代最优秀的散文作家
    B. D. McClay 委托并编辑的。


    《信仰》首次发表于 2018 年 8 月 8 日的《大纲》（The Outline），由无与伦比的 Brandy Jensen 编辑。


    《基本主义》包含了部分首次发表在 2020 年 8 月 4 日《基督教世纪报》（Christian Century）上的评论，该文由无与伦比的 Elizabeth
    Palmer 编辑。


    《如何结婚》“挪用”了我部分也曾为《基督教信使报》的朋友们们撰写的评论，但我已经记不清楚是什么时候写的。算了。


    《如何关怀》首次以《马克·费舍》为名发表在 2020 年 12 月 3 日的《公社》（Commonweal）上，该文由我亲爱的基督里的里的弟兄 Matt Sitman
    编辑。


    《如何成为中西部人》首次在 2018 年 6 月 6 日的中西部历史协会第四届年度会议“寻找迷失的第四区”上发表，当时是受了极度聪明的 Jon Lauck
    的诚挚邀请。


    最感谢 Ashley。感谢我的致谢对象；感谢我在上一本书中感谢过的家人和朋友；感谢 Galarza-Sepulveda 小队；感谢 Crank Book Folk
    和“偷面包帮派”；感谢 Dargs 和 Dan Walden；感谢 Belt 团队；以及我的学生们。


