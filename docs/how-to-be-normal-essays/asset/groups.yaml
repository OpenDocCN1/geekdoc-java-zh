    传统男性气概支持者蔑视现代男人的许多特质——我们体力劳动做得不够、忍住泪水、握紧东西、挺直腰板向后挺肩，以及许多其他缺陷。但最重要的是，他们哀叹我们未能接受这种保护角色，这进一步暗示了该角色在整个构想中的核心地位。政治理论家兼评论员哈维·曼斯菲德（Harvey
    Mansfield）给出了一个总结，在我们关于男性气概的文化对话低标准下，这相当直接：“男人保护他所照顾的人，免受他们没有他就无法面对或处理的危险。他将某件事提升到高度，投入自己的荣誉，并无论作为常态还是紧急情况下接管局面。……承担风险的意愿是包裹所有其他照顾他人方式的首要保护。”


    承担风险的价值是显而易见的——这听起来再次像是纯粹的成年责任，或纯粹的善良。然而，文化向我们耳语：过分狭隘地关注为家庭或爱人确保未来可能会导致糟糕的恶果。我们有两部《教父》电影（仅存在的两部），迈克尔·柯里昂利昂在一种噩梦般的必然性驱动下，杀了自己的兄弟——那个最需要保护的兄弟——并摧毁了他的婚姻，恰恰是因为他“爱家人”。我们有剧集《坏事发生》，它将《教父》的见解又进了一步。这本意是一个关于一名老师变成冰毒毒贩的故事，但在布莱恩·克兰斯顿（Bryan
    Cranston）试图让主角在心理上可信的压力下，变成了一个男人迷恋毒枭角色的故事。“我是为了我自己做的。我很擅长这个，”他告诉妻子，然后离开。这类故事构成了一个跨代的家族，其谱系从《奥赛罗》到《我知道我是对的》，再到《多·卡斯穆罗》、《黑镜》，最后到——愿上帝保佑我们——基于阿奇漫画改编的剧集《河镇》最新季，在剧中，男人为了拯救家庭而毁灭了家庭。确保你家庭的未来：正如我在写这一段话时发现的，你甚至谈论这种冲动，都会不安地接近定义新纳粹分子信条的“十四字格”。只需加上“白人”。”。或者仅仅承认，也许它早已在那里。


    哈维·曼斯菲德在无意间也提供了一个有用的解释，说明了仅仅是为爱人承担风险的愿望，往往会让一个人不由自主地陷入一种丑陋的统治政治。“荣誉是对保护某人的断言主张，”他写道，“而保护的主张就是统治的主张。如果我不能告诉你该做什么，我该如何妥善地保护你？”他判了“现代性的整个事业”——其强调马基雅维式的狡诈而非狮子般的古典勇气——认为其为“一个让男子气概失业的项目”，并认为反恐战争中存在复兴的有限希望（在他写下这些话时反恐战争还相当新，而我们现在带着一种宿命论的幽默称之为“永恒战争”）。谈什么统治权吧！但曼斯菲德在这里识别出的破坏性逻辑，往往发生在比伊拉克或阿富汗更贴近的地方。它发生在那些在舞台中心沉默地生活了如此久的男人身上，他们为一个已经分崩或未能实现的家庭提供物质（或相信其存在），随后他们便拿起枪，为整场戏拉上帷幕。如果你不让他们知道做什么，他们又如何能妥善地保护你？与此同时，对于人类学家彼得·麦卡利斯特（Peter
