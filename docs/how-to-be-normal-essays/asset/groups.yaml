    spiritually corrupting; he associates it with totalitarian regimes.


    Greenberg’s friend Dwight Macdonald, in “Masscult and Midcult,” warned in 1960
    that a “tepid ooze of Midcult is spreading everywhere.” (“Midcult” is Macdonald’s
    coinage, but the distinction between it and middlebrow is, so far as I can see,
    one without a difference.) Macdonald is more specific than his predecessors; his
    irritation with midcult consists in its adaptation of avant-garde stylistic flourishes
    in works that ultimately, don’t challenge or offend the audience. Greenberg and
    Macdonald agree that an ersatz culture, aimed at the half-educated, is crowding
    out the real thing. It’s not clear, in either writer, why this hypothesis explains
    our situation any better than would the truism that mediocre work, being easier
    to do than good work, tends to be easier to find as well. Nor do they make clear
    why the embattled relationship they posit between excellence and kitsch makes
    any more sense than does the mutualistic motto that Samuel Delany attributes to
    the San Francisco Renaissance poets: “Good art makes great art look better.” Why
    not simply say that some work is good, enlivening, memorable, and some leaves
    you cold?


    The argument advanced by Greenberg and Macdonald leaves few options to artists
    who wish to avoid being middlebrow. They can follow Greenberg deeper into formalism—difficult
    to do when painting has already been reduced to its barest elements. And the revelation
    that Greenberg and his favored painter, Jackson Pollock, were partly funded—though
    they likely didn’t know it—by CIA money didn’t do much for Greenberg’s claim that
    avant-gardism was somehow inherently resistant, as kitsch wasn’t, to authoritarian
    designs. (This is the same CIA that dosed unwitting subjects with LSD and overthrew
    democratically elected governments.)


    Another option, for the artist seeking to avoid middlebrow, is to embrace the
    lowbrow. The problem then is that one may end up adding little to the cultural
    store. Roy Lichtenstein’s comic book paintings are fun but not that much fun than
    actual comic books. The artist can also choose to pursue difficulty and danger
    or adopt a hostile relationship to the audience. This style of art tends to overrate
    the value of pain and offense in themselves, as though, even at these outer fringes
    of Bohemia, there still lurks the old lie that pain is always character-building.
    In any case, transgressive art will always be outflanked by reality. That, say,
    Henry Kissinger possesses a Nobel Peace Prize is a greater offense than anything
    ever done by a confrontational European arthouse director or self-harming performance
    artist. Art can never keep up.


    While one set of cultural critics crited the falsity of middlebrow, others emphasized,
    and sometimes praised, its educational component. In 1949, Russell Lynes defined
    middlebrow people as follows:


    These are the men and women who devote themselves professionally to the dissemination
    of ideas and cultural artifacts and, not in the least incidentally, make a living
    along the way. They are the cultural do-gooders, and they see their mission clearly
    and pursue it with determination. Middlebrow, here, is aspirational; it’s good
    for you. Middlebrow is mass education, good museums, the Book of the Month Club,
    the Britannica Great Books set, ’70s public television. It’s Kenneth Clark in
    his TV series, Civilisation, telling us what to notice about old paintings, and
    John Berger, in his four-segment documentary, Ways of Seeing, telling us what
    Clark left out. (Both series can be found on YouTube and remain well worth watching.)
    This version of middlebrow is a category about which Americans must be ambivalent,
    for we both love and resent the idea of education.


    Every few years, someone writes an article expressing nostalgia for this educational
    sort of middlebrow culture. Early in this century, Terry Teachout attributed its
    death to the same ongoing development of communications technology that had once
    made it possible:


    The rise of digital information technology, with its unique capacity for niche
    marketing, has replaced such demographically broad-based instruments of middlebrow
    self-education as The Ed Sullivan Show with a new regime of seemingly infinite
    cultural choice. Instead of three TV networks, we have a hundred channels, each
    “narrowcasting” to a separate sliver of the viewing public, just as today’s corporations
    market new products not to the American people as a whole but to carefully balanced
    combinations of “lifestyle clusters” whose members are known to prefer gourmet
    coffee to Coca-Cola, or BMWs to Dodge pickups. The information age offers something
    for anybody: Survivor for simpletons, The Sopranos for sophisticates. The problem
    is that it offers nothing for everybody. (Here again, for some reason, The Sopranos
    is brandished as though it were a difficult text.)


    Like many defenders of educational middlebrow, Teachout adopts a half-apologetic
    tone in talking about it. “It wasn’t perfect,” he writes, “and sometimes it wasn’t
    even very good, but it beat hell out of nothing.” Earlier in the essay, he writes
    with winsome self-mockery of the “earnest, self-improving fellow” he was in his
    youth, reading Life, catching Maria Callas on The Ed Sullivan Show.


    Born in the 1970s, I caught the very end of the culture Teachout mourns. My father
    spent years paying off a set of Britannica’s Great Books of the Western World
    on the installment plan. He read from it when he could, and eventually so did
    I. The set left me with the unfortunate impression that Homer wrote prose, that
    there was a single thing known as “the World,” that human thought culminated in
    Sigmund (volume 54, right at the end), that all geniuses were male. With effort
    and luck, I was able to overcome these prejudices. But the presence of these books
    in my home gave me an early awareness that Dostoevsky and Tolstoy were things
    a person might read after coming from a shift at Walmart. I have since learned
    that this is a hard thing for many putatively well-educated people to imagine,
    and so I look back on those volumes with warmth as well as skepticism.


    Teachout’s admiration for the civilizing, unifying powers of educational middlebrow
    links him to its more recent defenders. All of them are drawn to the idea of a
    widely shared culture. The argument is a confusing one because we have a common
    culture, though it changes rapidly. Boomers speak to each

