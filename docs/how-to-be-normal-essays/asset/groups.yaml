    Imagine my joy, then, when a screening of a documentary about the film that

    shown in my town a few summers ago turned out—with no advance

    notice—to include a screening of the movie itself as well.


    Set in the 1930s, the original Raiders of the Lost Ark concerns the exploits of

    European and American archaeologists notorious for their single-minded

    pursuit of other cultures’ treasures. Archaeology itself, however ethically or

    unethically done, requires attention to kinds and degrees of detail that, under

    any gaze less intent than that of the obsessive, don’t show up at all—a faint

    trace seen or overlooked can change our understanding of the object itself or
    of

    the whole world that made it. Adding another layer, the film is itself a kind
    of

    nostalgic excavation of the feelings aroused in Lucas and Spielberg by 1930s

    adventure serials they watched on television in the 1950s. And just as Indiana

    Jones nearly perishes in, alternately, a jungle, a lost temple, and a desert,

    Spielberg and Lucas, and their cast and crew, endured nightmarish sweat,

    illness, accident, and dehydration while shooting in Tunisia. The famous scene

    in which an exasperated Indy shoots a glowering swordsman was inspired not

    by genius but by Harrison Ford’s diarrhea—he couldn’t stay on his feet long

    enough to film the scripted swordfight.


    The makers of The Adaptation mimicked this devotion in their turn by

    risking, at various points, arrest, asphyxiation, immolation, unemployment,

    and sundered friendships. In the accompanying documentary, Raiders! (2015),

    you watch in horror as they set fire to someone’s mom’s basement. You watch

    with deeper horror, tinged with embarrassment, as one of the former kids, now

    a family man in his forties, makes one call after another to an increasingly

    exasperated boss, trying to negotiate enough time off to finish the one scene
    he

    didn’t manage to nail in his teens. Here is a person who follows our culture’s

    advice to artists—never give up, see your vision through—in a case where he

    should stop.


    Yet it was only while watching The Adaptation, wishing not so much for the

    discovery of the Ark of the Covenant but for the intervention of Child

    Protective Services, that I realized how much Lucas and Spielberg’s story

    functions as a critique of such devotion. Indiana Jones, handsome and

    unflappable, is at heart no less a sweaty monomaniac than his rival Belloq or

    Toht, the doughfaced Nazi who is both men’s dark doppelgänger. Indy and

    Belloq seek hidden knowledge; so, via torture and threats, does Toht. At a key

    moment, Indy discovers that he can’t destroy the Ark, even though his failure

    submits him and, for all he knows, the world, to Nazi domination. Only by

    curbing his insatiable curiosity does he survive to the end of the movie. So as

