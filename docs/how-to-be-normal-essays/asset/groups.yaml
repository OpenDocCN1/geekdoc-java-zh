    If Fisher’s other work asks the question, Can we retake the present?, the lectures


    captured in Postcapitalist Desire ask a more troubling one: Do we want to? In


    this question, you can detect some traces of the old Ccru ambivalence about


    capitalism (which in Land eventually became open enthusiasm), a sense that


    capital’s invasion of our desires has been too successful for us to retreat from
    or


    will our way around. Fisher begins the class by showing his students the


    famous 1984 Apple Super Bowl commercial, presented as a short science-fiction
    film that effectively fuses the countercultural demand that life give us


    more—more adventure, more fulfillment—with the desire to buy things. From


    the viewpoint of the late 1980s, he argues, the capitalist world did serve human


    libido better than did the great gray Soviet Union. The following week, the


    students are reading Freud and Marcuse and asking what “desire” is in the first
    place, whether it has any “natural form” at all, and what this might mean for


    the project of reshaping it. Is desire just anything that we choose to make it?


    The group works through texts on the concept of identity, the formation of


    class consciousness, family abolition, and the neoliberal turn of the late 1970s.


    As always, Fisher wears his learning lightly, and he’s frequently hilarious, as


    when he summarizes the pronouncements of “high-achieving” CEOs:


    - They lead by example, the capitalist class. They’re just this weird form of
    addict—a work addict. [Mark puts on a pompous voice] Yeah, yeah, I get up 4:30am,
    check 200 emails before going to the gym for half an hour, see my kid for fifteen
    minutes, go to work, work there until about 8:00pm, grab a quick dinner, work
    some more, go to bed, repeat. That’s not even a caricature, really! That’s more
    or less what they say.


    This is a characteristic passage. The reader who knows what’s coming—the sudden
    end of the seminar and Fisher’s death—cannot help combing through the text for
    traces of that future, too, but you won’t find many. He is sharp, funny, quick
    on his feet. He is as alive as any thinker ever has been.


    What you do find is evidence that Fisher’s project, even had he lived to continue
    it, would always have had an incomplete quality about it. This struck me most
    forcefully in the lecture/discussion on family abolition, during which Fisher
    and the students take the worthiness of such a project for granted while listing
    reason after reason why not to. (From another writer, I would shudder at the moment
    when Fisher remarks that it’s surprisingly uncommon for people to hate their own
    families. By all accounts he loved his.) In part I object to the sheer airiness
    of the discussion. When you can talk for the length of an entire chapter about
    family abolition, throwing around as you do so words as notoriously hard to define,
    as imbricated with the subjective, as family and desire, and yet—I checked—no
    one uses the word love, you are, again, back in the vampire castle of coolness.
    But more than that, what the discussion reveals is Fisher’s unexamined preference
    not even for what does not yet exist—everybody loves that—but for what has not
    yet even been described, what has not yet been imagined. It is not at all clear
    what anyone in this conversation is discussing.


    This trait also shows up in the book’s frequent recourse to terms like “postcapitalism,”
    an empty conceptual basket that starts to disappoint as soon as you put things
    in it. In the final lecture, the students grapple with Lyotard’s Libidinal Economy—the
    urtext for Land’s accelerationism—and Fisher remarks approvingly that “the writing
    is this swirl of intensities that has no deeper referent.” At such moments, you
    feel that Fisher’s imagination—perhaps Deleuze’s as well—is essentially Gnostic:
    a thing is ruined when it starts to exist. The music that Fisher wrote so beautifully
    about, punk and post-punk, thrills us when we’re young because every young person
    is a Gnostic Christian, a spark of alienated self-awareness trapped inside layers
    of matter, navigating a social world made all the more powerful by the fact that
    no one believes in it. Punk responds to that world with apocalyptic fire, post-punk
    with apocalyptic cold and stasis. And after a few years, you want to say to that
    younger self, to the punks, and sometimes to Fisher, that loving this world, compromised
    as it is, does not have to be conservative, that love is also an opening-up of
    possibilities.


    And that’s Fisher’s final paradox. In the same chapter on family abolition that
    had me grinding my teeth—as always with Fisher, whatever it is that annoys you
    is soon supplanted by something beguiling—he says this:


    “I have a lot of problems with the word ‘community,’ largely because of the way
    it’s been easily appropriated by the right. But also, because it implies an in
    and an out. Some are in the community and some are out of it. I had a slogan once:
    ‘care without community.’ Isn’t that what we want? Where you can give people the
    care regardless of whether they belong to the community.”


    I can’t think of a better description for the quality that is everywhere in Fisher
    than “impersonal care.” He talks about his own problems, his own life in a distanced
    Ballardian way, and he avoids sentimentality perhaps too carefully. But he cares.
    He cares about books, he cares about records, he cares about friends, he cares
    about students, he cares about ideas, he cares about everything. Even when his
    care manifested as hate, he couldn’t stop caring. There is an older name for this
    sort of love. It is a quality that manifests poignantly in Postcapitalist Desire,
    in the way Fisher speaks to his students, and in the way they responded to his
    death. Christians call it caritas.


    ## HOW TO BE MARRIED


    For some of us, there’s a season on the cusp of young adulthood—around sixteen
    or seventeen—when all the deepest failings and yearnings of your nature announce
    themselves one after other, like symphonic themes that the rest of your life will
    restate with greater complexity, perhaps but never again so pristinely. Adults
    view the struggles of teenagers as they pass through such times with pity, amusement,
    and contempt, reactions that preserve our distance from our own memories of being
    so young, so susceptible to the characteristic pain of this period, pain constituted,
    in large part, precisely by the absence of perspective. Every breakup, every lost
    fight, every death, every friendship lost to gossip or to moving trucks seems
    unsurvivable, precisely because you haven’t survived many such losses yet. You
    wonder, rightly, how it can possibly be done. (Really—how do we do it?)


    If adolescence lasted even six months longer than it did, it would certainly kill
    us all. And yet there is something admirable, even beautiful, about these storms
    of rage and sadness and fear, which recall the goddesses and gods of classical
    mythology, who also live outside the dulling and comforting repetitions of time.
    I had the weird good fortune of meeting my wife during this period, then more
    or less meeting her again in the compromised time of adulthood. I’ll tell the
    story here. Ashley and I were both invited—she was in eleventh grade, and I was
    a senior—to apply to attend a conference in Washington, DC, for young future journalists.
    Neither of us have ever found out what caused us to be invited, what signals we
    sent to what body that we would make good neoliberal meritocrats. I knew my family
    absolutely could not afford this program and had to be talked by my parents into
    even applying.

