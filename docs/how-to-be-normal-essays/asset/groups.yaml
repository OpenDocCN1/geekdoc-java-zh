    \ by the (often white) facilitator. A metaphorical or actual\n\nmicrophone is\
    \ dropped.\n\nThe most obvious fact about this ritual is its uselessness. It may\
    \ fix hearts\n\n(although this is doubtful). It doesn’t fix houses, lives, or\
