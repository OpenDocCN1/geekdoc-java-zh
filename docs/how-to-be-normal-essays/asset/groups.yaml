  mdcn: '


    整合：如果我们要这么做的话，你们这些富人应该先来。这种

    任务，那些负担得起的人往往太倾向于代表那些负担不起的人去接受。而且没有人能负担得起真正恨

    自己，或者把自己看作是天生异常的，或在本体论上逊于

    他人。黑人曾就这一主题写过许多部经典小说，人们可以从中获益并享受阅读之乐趣。


    我开始习惯用“狗腿式同友主义”（shit-eating allyism）这一术语来描述这类情感表现。狗腿式同友主义主要有两种表现形式。一方面，它由谄媚的顺从宣言、对被压迫群体高尚且迄今历史上前所未有的美德的见证，或对自身特权的哀叹（即便这些特权仅仅够维持生存）组成。在另一种形式中，狗腿式同友主义指的是那些拥有特权的人在至少在修辞上——大多数时候只是修辞上——放弃了他们

    自己、或其家庭和社区对基本自尊或人权的诉求。（例如，一个女性后悔自己生下了一个白人婴儿，并愿意在《时尚》杂志上被引用她那样的话。）狗腿式同友主义往往但并非总是与马特·布鲁尼格（Matt
    Bruenig）所谓的“认同论顺从”以及奥卢费米·O·塔瓦（Olúfémi O. Táíwò）所谓的“认识论顺从”更极端的形式相关：即认为白人身份、男性或其他形式的特权已经腐蚀了一个人评估现实的能力，以至于任何标记为来自受压迫社区的判断，无论多么荒谬、缺乏依据或缺乏代表性，都会自动优于这个人经过研究和仔细考虑后得出的任何判断。


    当一位名叫杰西卡·克鲁格（Jessica Krug）的白人教授在假装成黑人女性数十年终于被揭穿时，她在（不可避免的）长篇 Medium 文章中写下了下面这句搞笑的话：“你们绝对应该取消我，而我绝对会取消我自己。”许多旁观者很快指出克鲁格没有指明她所请求的惩罚性质——“取消”意味着很多事情，其中没有一个是好玩的，但有很多是可以生存的。然而，克鲁格也实践着这种属于这个政治世界的顺从。她的惩罚是什么不由她来决定，因为她无权决定任何事情。在这种思维方式下，白人是认识论上的孩子。这个人除了通过化黑脸，根本无法想象出一个正义版本的自己。她早在很久以前就取消了自己。


    鉴于白人身份的这种困境——正如内尔·艾尔文·潘特（Nell Irvin Painter）所说，它在怪诞与平庸之间“切换”的方式——我们这个时代一些思想最深的批评家，包括潘特本人在内，已经提议构建一种非种族主义的白人身份。杰西卡·克鲁格需要一个安全的地方来定位自己，在那里她既对自己也不对他人构成危险；反种族主义者必须为她建立一个。


    我看到的这些尝试最引人注目的是它们试图升华平庸的方式。白人能做的最好的就是当一种“人类豆腐”。例如，塔·内希西·科茨斯（Ta-Nehisi Coates）他创作的《美国队长》系列。这些漫画在文学评论界收到的评论很少，而那里对他早期的作品曾给予过狂热的赞誉，这很奇怪，因为科茨斯已经公开过，这些漫画以及他（稍为人知的）关于《黑豹》的作品，是如何他在《我与世界》（Between
    the World and Me）中提出的论点的延伸。科茨斯说，美国队长代表了白人身份的“梦想”——“梦想”是那本（天才的）书中用来指代白人至上主义和美国例外主义结合的术语。科茨斯对这个角色的处理是他试图想象拥有“梦想”的人会是什么样。在其中一期中，美国队长对黑查拉（T''Challa）观察到，他由于某种黑查拉所执行的混乱，“他不应该”对此事感到震惊。黑查拉非常温和地责备了他；这种无辜是美国队长伟大的一部分。在科茨斯的叙述中，关于美国队长的特别之处在于，他几乎是不存在的。这种一方面，在科茨斯的叙述中，他几乎是不存在的


    另一个引人入胜的例子是杨·李（Young Jean Lee）的作品《白人男性》（Straight White Men，2014）。她通过创造一个完美同友的白人男性表达了这种冲突：


    当我在布朗大学做第一次工作坊时，房间里坐满了有色人种和酷儿群体，非常多元。他们开始非常刻薄地谈论白人男性。我说：“好的，现在我知道你们不喜欢白男性的哪些地方。你们希望白人男性做些什么让你们不那么讨厌？”他们告诉我所有这些，我记录了下来，然后我写下了那个角色。他们都恨他。他们恨他，因为他是个失败者。


    李通过创造一个完美同友来表达了这种冲突：他破坏了自己的职业前景，并降低了自己的技能来帮助他人。他的家庭成员——李并没有将他们描绘成反派——认为他在进行一种受虐的忏悔。（我们可能会称他为狗腿式同友。）他是自我实现的且健康的：他想要这种生活。尽管欣赏他或恨他，但他不是一个动态的角色。当我考虑到潘特对反种族主义身份的建议时，我首先感知到她意图中的巨大善意。她希望我好过瑞切尔·多尔泽（Rachel
    Dolezal）或迪兰·罗夫（Dylann Roof）。我也从她的姿态中认出一种疲态的务实主义：种族的谎言并不会因为我用数十年的研究详细地证明它是一个谎言而消失。（在转向写作白人之前，潘特首先投入了多年时间研究黑人是如何成为一个群体的——正如她早期的一本书标题所强调的，是被创造出来的。她有权感到疲态和务实。）我们可以说黑人身份是一种压迫性的虚构，然而黑人很少希望这个标签从他们身上摘掉。它给了他们与其他人的共性，这在世界上是有用的。共同度过黑人身份的这种感觉在之前不存在的地方创造了一个群体。在神学上，有些人甚至对黑人身份这样说——考虑到该群体不成比例的宗教性以及对其遭受的罪行的形而上重量，神学是一个合适的语境——正如约瑟对他兄弟们对他所犯的行为所说：“你们本来存坏我，神却旨向于善。”


    这些可能都是正确的。也许“黑人身份”将继续作为一个实用的活的概念——而不仅仅是一种人类学上的燃素——即便在一个它不再通过压迫他们来召集一个群体的世界里。从一个非常真实的意义上，这个问题与我无关。但当人们试图将“白人”的情况与“黑人”的情况进行比较时，那种常见的不协调感在这里和任何地方一样都显现了出来。

    更老、更顽固的一个：白人比其他任何人都更容易活在一种他们构建自己的幻觉中。在这种情况下，有意识地“选择”并“构建”一种身份，已经是在承认一个更老、更顽固的问题。


    神学家威利·詹姆斯·詹廷斯（Willie James Jennings）华辞华丽地描述了白人概念的“召集”力量。令人发现的是，他随后描述的白人群体的成就——帝国主义、殖民主义、征服——仅仅是资本主义的运作。


