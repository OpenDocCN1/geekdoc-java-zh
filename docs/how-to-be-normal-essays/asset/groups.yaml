    my time as a single person over; all the obvious narrative peaks in my life were
    scaled. I saw only a long corridor, then death.


    Marriage means having a reminder of your limits, the limits of your life, in the
    room with you when you sleep. We conquer death, if at all, through faith: perhaps
    the sort of religious faith that involves an afterlife, which is never, by the
    way, the consolation you’d expect it to be; or perhaps just a faith that things
    can both die and also matter.


    ## So Sad Today


    Melissa Broder describes general anxiety disorder with breathtaking accuracy,
    and she’s also good at describing the self-consciousness that (at least for me)
    goes along with it, the way you can register others’ possible disapproval of you
    like a smell in the air. But what struck me most was a passage near the end:


    I walk into the kitchen and I kiss [my husband] with an open mouth. I kiss him
    with an open mouth, as if he is not my husband. Or I kiss him as though he is
    my husband, but that the words husband and wife mean something else—not what I
    have perceived them to mean through my own fears. In this moment I resolve to
    kiss my husband with an open mouth forever. . . I know that I will kiss my husband
    with a closed mouth again, at some point. I know that I will even kiss him with
    a closed heart. I pray for our love. I pray that even if I kiss my husband with
    a closed heart, my heart opens again to him. When I desire my husband, I am grateful
    to desire my husband. What can we hope for in a marriage but to keep seeing things
    anew? With the people we love, it is so easy to stop seeing them at all.


    This passage is what I mean by “faith.” (If Broder’s marriage does not involve
    “faith” in another conventional sense of the term—she’s poly—that merely underscores
    the point.) If you’re going to have any kind of a distinctive life at all, you
    sometimes have to ignore your internal weather, the evidence not necessarily of
    your senses (though sometimes those too) but of your emotions. You have to be
    kind when you’re irritated because you know the person in front of you doesn’t
    really deserve your irritation. You have to enjoy people and things when you’re
    hurting because you know that those people and things merit the attention that
    in your woundedness you want to withhold from them. You have to work when you’re
    lazy or when you’ve despaired of the value of your work. It’s a kind of perception:
    notice how she keeps talking about “seeing.” (Cf. Paul’s “The substance of things
    not seen.”) For those of us with mental health issues, “faith” in this sense is
    especially necessary. It’s a kind of faking-it-till-you-realize-you’ve-already-made-it.


    In this sense, Broder, who spends much of the book (intentionally, and for comic
    purposes) making herself sound like a person with no discipline or capacity for
    self-denial whatsoever, has built a marriage worth admiring. Her chronically ill
    husband is bedridden more and more of the time. She shows considerable character
    and love—character may just be love that has temporarily lost its vision—in sticking
    with him. My wife and I don’t face these challenges, but between my depression
    and anxiety and her overwork and overwhelmedness, we’ve had to kiss each other
    with closed hearts before, and we’ll do it again. Very young people think of this
    as a kind of treason to the self, but actually it’s the opposite. It’s refusing
    to let today’s mood be the final vote on what you are to each other. It’s losing
    the vision but caring enough about it to give it time to come back.


    But you have to have had the vision in the first place. In the time between meeting
    and dating Ashley, I had dated, among a few others, another woman who developed
    brain cancer early in our relationship, when we would normally be figuring out
    what we were to each other. After her diagnosis, I decided that I was obviously
    living in the story where I would devote myself to my poor, brave girlfriend because
    the alternate story, where she got sick and we broke up, was too sordid to contemplate.
    (I had also absorbed some odd scholarly notions about the newness and nonnecessity
    of companionate love between life partners.)


    Of course, we broke up. For months I maintained the facade, to myself and to her,
    that ours was a great love affair, till one afternoon I couldn’t—I folded up like
    a tent. The effect of my attempt to be generous was mostly that she had to spend
    her last romantic relationship on an undiagnosed anxiety patient who was engaging
    in an attempt to be good. I denied her the chance to be fallen in love with. It
    may be the worst thing I’ve ever done. This may have been too eccentric of a mistake
    to be worth enjoining other people not to make it, but just in case: Don’t do
    this. It’s one of several reasons, too, that I’m depressed at how often single
    people, particularly women, are told to settle. Most straight men I know could
    stand to question their own physical preferences, learn to notice how often these
    are not indigenous to ourselves but overwritten on our sexuality by mass media
    and boy training. (“You like her? She’s a six at best.”) You like her? She’s a
