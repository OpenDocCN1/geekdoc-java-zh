    heard the actual lyric, I was still naive enough to be angry. Though I had, in


    late-teenage fashion, messily renounced fundamentalism, had read Dostoevsky


    and Nietzsche and even attended a church in a denomination that ordained


    women (a clear violation of several New Testament passages and thus ruled


    out), I honestly wasn’t prepared for the knowledge that my people might


    sometimes just lie.


    I have spent a good portion of my adulthood wondering about the


    psychology behind a lie like that. On the surface, it does not make sense


    morally, intellectually, or strategically to force the evidence in this way, to
    go


    through the motions of providing a textual citation for one’s claim—an


    implied it’s right there, just look it up—and then doctoring the text in the


    manner of those people who used to mark up satellite photos of the moon in


    order to prove that there were giant statues on it. If you’re going to be that


    irrational, why not abandon the appeal to book learning, to scholarly standards


    of evidence, entirely? Why not just say that God showed it all to you in a


    vision? And yet it’s not the first lie of this precise kind that I’d seen. Strategic


    misquotations, ingeniously touched-up uses of original sources cropped up


    regularly in church. Much of my childhood religious education was, among


    other things, an apprenticeship in the art of finding terrifying hidden meanings


    —having to do with drugs, demonology, the Rapture, secret control of the


    government, and other topics—in texts the outward meaning of which was, in


    some cases, perfectly banal or, in others, already offensive but in routine ways.'
