    thrust limiting assumptions on other people; I try to let people surprise me.
    I


    mostly fail at these things, and sometimes they feel irrelevant in a historical


    moment when so much of the evil around us is unsubtle and simple. But by


    that same token, if there is any hope for those who live in such a moment, it
    is


    precisely where, to my mind, literature and beauty have always resided: in the


    part that isn’t obvious, in the part you can’t see though it is right in front
    of


    you, in the calm mystery of what is.'
