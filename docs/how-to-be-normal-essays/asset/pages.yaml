  md: 'AUTHOR’S NOTE


    I wrote these essays between 2018 and 2021. In some cases, I’ve recycled


    material from older pieces. They all fall under the general heading of “cultural


    criticism” or “personal essay”—I say this now in order to gently let down any


    reader who has picked up the book in the hope of finding an advice manual.


    They all, in one way or another, examine things that have an air of banality,


    normativity, or averageness about them.'
