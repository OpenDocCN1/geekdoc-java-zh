  md: 'HOW TO BE NORMAL


    In the wake of the COVID-19 pandemic, we have the oddest relationship with


    the word “normal.” In the spring of 2020, we’d type promises to each other,


    say, to have dinner or a beer “when things are back to normal.” At some point,


    everyone started adding scare quotes to “normal.” We invoke the word only to


    place it immediately under erasure, as though we were still, in spite of


    ourselves, hoping it will return anyway, as though normalcy were a cat that we


    pointedly ignore in the hope that it will allow us to pet it again.


    Our longing for normalcy expresses itself in every area of culture. The US


    presidency was finally won by a man whose attraction rests mainly on the


    unspoken and impossible promise that he will restore the world of, say, 2014


    or so. (That world was wretched and doomed—it led directly to Trump—but


    some people didn’t know it yet, I suppose, and they miss not knowing.) The


    university where I work spent the first part of the fall 2020 semester


    pretending that things were back to normal. The dorms were open—which is


    to say, the dorms were mostly closed, but they actually had some people in


    them. A student told me one day—we had met for office hours, outdoors, at


    six feet distance, both masked—that she hadn’t sat on a couch in two months:


    the only places she could go were her tiny dorm room, various campus lawns,


    and (if she had wanted to take her life into her own hands) a restaurant. All
    the


    common areas and study rooms were blocked off. Rightly, of course. The


    students were simultaneously dangerously concentrated together and horribly


    alone. Most of their classes took place online.


    The proximate cause for this grim parody of normalcy was, most likely, the


    fact that one of our regents and major donors does double duty as a major


    owner of rental property in the city. That, at least, is my cynical reading of
    the


    situation, and it’s hard to go wrong banking on the venality of the American'
