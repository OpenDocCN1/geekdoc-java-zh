    kind of carnivalesque reversal. I needed to see adult inadvertence and name it


    as such; I needed to observe the little hole it made in the world.


    In time, I too became an adult, passionately devoted to writing (which, for a


    person in his twenties, can also mean “passionately not doing any”). I read


    treatises on aesthetics; I pondered greatness. It became important to me to


    assume an authority of my own, to know what I was doing. I tried to become


    the kind of person who could provide stable, coherent answers to the sorts of


    questions that many readers will already, four paragraphs in, want to pose


    about this essay: What do I mean, “bad” movies? Who says they’re bad? By


    what criteria? How do I know those are sound criteria? And what meaning of


    “bad” do I intend?


    Regarding distinctions of “good” and “bad,” we have not moved much past


    David Hume’s essay “Of the Standard of Taste,” which two and a half centuries


    ago told us that “good” art was what a consensus of the thoughtful and


    experienced said it was. You developed the ability to discern it by thoughtfully


    comparing one work with another. To this argument, his twenty-first-century


    readers would add emphasis to a fact Hume thought too obvious to dwell


    upon: It takes some amount of privilege to take part in the conversation that


    he describes. A person needs literacy and free time for starters, but also the


