  md: 'A NORMAL READING LIST


    This was, again, not a how-to book, but I don’t want to leave the reader


    entirely without help. Most of the good general life advice that I know of can


    be found in the following places: the books of Proverbs and Colossians; the


    novel A Far Cry from Kensington by Muriel Spark; C. S. Lewis’s essays “The


    Inner Ring” and “The Trouble With X”; Mutual Aid by Dean Spade; and the


    final chapter of the book Four Thousand Weeks by Oliver Burkeman. Most of


    the good advice I know that is specific to activism can be found in the opening


    section of Sarah Schulman’s Let the Record Show: A Political History of ACT UP


    New York, 1987–1993. The rest—regarding means, not ends—can be found in


    Robert Heinlein’s The Moon is a Harsh Mistress, a book that is far too good to


    leave to the libertarians. If you want advice about writing, start with Natalie


    Goldberg’s gooily new age but fundamentally very helpful books. Then when


    you’re ready for the equivalent of grad school, read Samuel Delany’s About


    Writing.


    Regarding practical matters of brute survival, I own copies of the books The


    SAS Surival Manual and Where There Is No Doctor, and I am assured they will


    tell me everything I need to know once I work up the motivation to read


    them. But if, like me, you’re in the habit of worrying at night about how to


    protect yourself and your loved ones in the event of ongoing or sudden


    emergency, your best first step is to do the writing exercise described by the


    journalist and activist Kelly Hayes. Boiled down—though I highly recommend


    reading Hayes’s full explanation—it consists of answering these prompts:


    List your most immediate concerns.


    List what your first responses shall be.


    What resources exist so I can better educate myself?


    Who’s already doing work around these injustices?


    Do I have the capacity to offer concrete support and help them?'
