    For some of us, there’s a season on the cusp of young adulthood—around


    sixteen or seventeen—when all the deepest failings and yearnings of your


    nature announce themselves one after the other, like symphonic themes that


    the rest of your life will restate with greater complexity, perhaps, but never


    again so pristinely. Adults view the struggles of teenagers as they pass through


    such times with pity, amusement, and contempt, reactions that preserve our


    distance from our own memories of being so young, so susceptible to the


    characteristic pain of this period, pain constituted, in large part, precisely
