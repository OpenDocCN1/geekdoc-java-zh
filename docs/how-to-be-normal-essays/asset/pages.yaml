  md: 'assistants. I was proud of all of them, and hopeful for them, and I marched


    and picketed alongside them, and I canceled my own classes in solidarity and


    told other people to do so. And I hated every second. I wanted my routine


    back. I wanted to stop needing news all the time. I wanted to grade papers. In


