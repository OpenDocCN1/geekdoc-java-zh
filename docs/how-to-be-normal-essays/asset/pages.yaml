    The proponents of traditional masculinity scorn many traits in modern men—


    our failure to do enough manual labor, hold back tears, grip things, stand up


    straight with our shoulders back, and any number of other failings. But most


    of all, they lament our failure to embrace this protective role, which further


    suggests its centrality to the whole construct. Political theorist and pundit


    Harvey Mansfield gives us a summation that is, by the low standards of our


    cultural conversation on masculinity, relatively straightforward: “A man


    protects those whom he has taken in his care against dangers they cannot face


    or handle without him. He makes an issue of some matter, engages his honor,


    and takes charge of the situation either as a routine or in an emergency. . .
    .


    The willingness to take on risk is the primary protection enveloping all other


    ways of providing for someone.”


    The merit of taking on risk is self-evident—it sounds, again, like mere


    adulthood, or mere goodness. Yet culture whispers to us that a too-narrow


