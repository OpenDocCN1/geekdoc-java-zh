    abnormal normal.


    In the larger scheme of things, of course, there is no normal to get back to


    anymore—at least not one that most of us would recognize as such. The 2020


    hurricane season was unprecedented, like the last several hurricane seasons. A


    million acres of the state of California have burned, and we are assured that


    such megafires will be common events over the next century. In February of


    2021, my sister-in-law and her family, who live in Houston, lost power and


    water for most of a week, thanks to a record cold snap. (The governor of their


    state blamed this on the “Green New Deal,” a package of legislation that has


    yet to be enacted, or fully drafted.) We are ruled, locally and nationally and


    internationally, by greedy and silly people, to such an extent that the planet


    itself is altered, on a massive scale, from year to year, in accordance with their


    whims. The order of our world is disrupted down to the level of molecules and


    sperm cells. My father, when I talk to him on the weekends, cannot remember


    what day it is. We are all in exile.


    There is no future in normalcy, in our little attempts that we make at


    building a home in this world from statistics and routines and habits. Our only


    home is each other.'
