  md: 'ironic or sardonic or merely neutral title. This is a description of the titular


    character running into a well-known acquaintance:


    On a downtown street just outside a department store a man said


    something to her. She ignored him. But at that moment the crowd closed


    them in together.


    “How do you do?” he said, smiling and touching his hat.


    She saw that he was a man of about fifty with silvery hair and rather


    satanic ears.


    His face became red and he laughed awkwardly. “I’m Gladys Schmidt’s


    husband.”


    “Oh, for Heaven’s sake!” Mrs. Bridge exclaimed. “I didn’t recognize you.”


    The title tells us why this is funny: NEVER SPEAK TO STRANGE MEN.


    The point, of course, is that all men are strange; only context makes us think


    otherwise.


    Now, this is a comic passage in a book that is frequently very funny, but the


    comedy is in unknowing: the fact that Mrs. Bridge can’t recognize someone she


    has known for decades. That is the joke at the heart of the novel as well: that


    everybody is strange to Mrs. Bridge, and she, in turn, is a stranger to


    everybody. Nobody, not her children, not her husband, nor even herself,


    knows her. As the book’s first sentence tells us, she is “never able to get used
    to”


    the sound of her own first name. The comedy of the book is precisely not


    satirical in the sense of reducing Mrs. Bridge or Mr. Bridge or the other


    characters to types at whom we are invited to laugh. The comedy is in the gap


    between their characters on the one hand and the strategies they use to


    understand each other on the other. Mrs. Bridge is often described as a middle-


    class housewife, and when you put down the book, you want never again to


    hear the words “middle-class” or “housewife.” You want words that open up


    rather than words that settle.'
