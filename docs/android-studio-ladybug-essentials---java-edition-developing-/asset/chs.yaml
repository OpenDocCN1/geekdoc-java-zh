  \n图 33-9\n\n在继续下一步之前，选择布局中的 `TextFragment` 实例，并在 `Attributes` 工具窗口中将 fragment 的\
  \ `ID` 更改为 `text_fragment`。\n\n### 33.7 让 Toolbar Fragment 与 Activity 通信\n\n当用户触摸工具栏\
  \ fragment 中的按钮时，fragment 类需要从 `EditText` 视图中提取文本以及 `SeekBar` 的当前值，并将它们发送到文本 fragment。正如“Android\
  \ Fragments 简介”中所述，fragment 之间不应直接通信，而应该使用嵌入它们的 activity 作为中介。\n\n此过程的第一步是确保工具栏\
  \ fragment 对被点击的按钮做出响应。我们还需要实现一些代码来跟踪 `SeekBar` 视图的值。在本例中，我们将在 `ToolbarFragment`\
  \ 类中实现这些监听器。选择 `ToolbarFragment.java` 文件并修改如下：\n\n```java\npackage com.ebookfrenzy.fragmentexample;\n\
  \n.\n\n.\n\nimport androidx.annotation.NonNull;\nimport androidx.annotation.Nullable;\n\
  import android.content.Context;\nimport android.widget.SeekBar;\n\npublic class\
  \ ToolbarFragment extends Fragment\n\nimplements SeekBar.OnSeekBarChangeListener\
  \ {\n\nprivate int seekvalue = 10;\n\nprivate FragmentToolbarBinding binding;\n\n\
  @Override\npublic void onViewCreated(@NonNull View view,\n\n@Nullable Bundle savedInstanceState)\
  \ {\n\nsuper.onViewCreated(view, savedInstanceState);\n\nbinding.seekBar1.setOnSeekBarChangeListener(this);\n\
  \nbinding.button1.setOnClickListener(new View.OnClickListener() {\n\npublic void\
  \ onClick(View v) {\n\nbuttonClicked(v);\n\n}\n\n});\n\n}\n\npublic void buttonClicked\
  \ (View view) {\n\n}\n\n@Override\npublic void onProgressChanged(SeekBar seekBar,\
  \ int progress,\n\nboolean fromUser) {\n\nseekvalue = progress;\n\n}\n\n@Override\n\
  public void onStartTrackingTouch(SeekBar arg0) {\n\n}\n\n@Override\npublic void\
  \ onStopTrackingTouch(SeekBar arg0) {\n\n}\n\n}\n```\n\n在继续之前，我们需要花时间解释上述代码。首先，该类声明实现了\
  \ `SeekBarChangeListener`。这是因为用户界面包含一个 `SeekBar` 实例，且 fragment 需要在用户滑动线条时接收通知以更改字体大小。实现\
  \ `SeekBarChangeListener` 接口要求实现 `onProgressChanged()`、`onStartTrackingTouch()`\
  \ 和 `onStopTrackingTouch()` 方法。这些方法已经实现，但只有 `onProgressChanged()` 方法需要执行任务，在本例是将新值存储在名为\
  \ `seekvalue` 的变量中，该变量在类开头已声明。还声明了一个用于存储 `EditText` 对象的引用。\n\n添加了 `onViewCreated()`\
  \ 方法来为按钮设置 `OnClickListener`，其配置为检测到点击事件时调用名为 `buttonClicked()` 的方法。该方法也实现了，尽管目前没有执行任何操作。\n\
  \n此过程的下一阶段是设置监听器，允许 fragment 在按钮被点击时调用 activity。这遵循上一节中概述的机制：\n\n```java\npublic\
  \ class ToolbarFragment extends Fragment\n\nimplements SeekBar.OnSeekBarChangeListener\
  \ {\n\nprivate static int seekvalue = 10;\n\nprivate FragmentToolbarBinding binding;\n\
  \nToolbarListener activityCallback;\n\npublic interface ToolbarListener {\n\npublic\
  \ void onButtonClick(int position, String text);\n\n}\n\n@Override\npublic void\
  \ onAttach(Context context) {\n\nsuper.onAttach(context);\n\ntry {\n\nactivityCallback\
  \ = (ToolbarListener) context;\n\n} catch (ClassCastException e) {\n\nthrow new\
  \ ClassCastException(context.toString()\n```\n\n\n\n\n\n```java\n+ \" must implement\
  \ ToolbarListener\");\n\n}\n\n}\n\npublic void buttonClicked (View view) {\n   \
  \ activityCallback.onButtonClick(seekvalue,\n    binding.editText1.getText().toString());\n\
  }\n\n}\n```\n\n上述实现将导致当用户点击按钮时，会调用属于 activity 类的名为 `onButtonClick()` 方法。因此，剩下的工作就是声明该\
  \ activity 类实现了新创建的 `ToolbarListener` 接口，并实现 `onButtonClick()` 方法。\n\n由于在较旧 Android\
  \ 版本中使用了 Android Support Library 来支持片段（fragment），因此 activity 也需要更改为继承自 `FragmentActivity`\
  \ 而不是 `AppCompatActivity`。将这些要求结合起来，得到了如下修改后的 `MainActivity.java` 文件：\n\n```java\n\
  package com.ebookfrenzy.fragmentexample;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  import androidx.fragment.app.FragmentActivity;\nimport android.os.Bundle;\n\npublic\
  \ class MainActivity extends FragmentActivity implements ToolbarFragment.ToolbarListener\
  \ {\n\npublic void onButtonClick(int fontsize, String text) {\n\n}\n\n}\n```\n\n\
  按照目前的代码更改，toolbar fragment 将检测用户何时点击按钮，并调用 activity 上的方法，传递 `EditText` 字段的内容和 `SeekBar`\
  \ 视图的当前设置。现在的任务是让 activity 与 `Text Fragment` 通信，并传递这些值，以便片段能够相应地更新 `TextView` 对象。\n\
  \n### 33.8 让 Activity 与 Text Fragment 通信\n\n正如《Android 片段简介》中所概述的，activity 可以通过获取片段类实例的引用并调用该对象上的公共方法与片段进行通信。因此，在\
  \ `TextFragment` 类中，我们现在将实现一个名为 `changeTextProperties()` 的公共方法，该方法接收一个整数作为字体大小，以及一个字符串作为要显示的新文本。然后该方法将使用这些值来修改\
  \ `TextView` 对象。在 Android Studio 编辑面板中，找到并修改 `TextFragment.java` 文件以添加此新方法：\n\n\
  ```java\npackage com.ebookfrenzy.fragmentexample;\n\npublic class TextFragment extends\
  \ Fragment {\n\npublic void changeTextProperties(int fontsize, String text)\n{\n\
  \    binding.textView2.setTextSize(fontsize);\n    binding.textView2.setText(text);\n\
  }\n\n}\n```\n\n当 `TextFragment` 片段被放置在 activity 的布局中时，它被赋予了一个 ID `text_fragment`。使用此\
  \ ID，activity 现在可以获取片段实例的引用并调用该对象上的 `changeTextProperties()` 方法。编辑 `MainActivity.java`\
  \ 文件并按如下修改 `onButtonClick()` 方法：\n\n```java\npublic void onButtonClick(int fontsize,\
  \ String text) {\n    TextFragment textFragment =\n    (TextFragment)\n    getSupportFragmentManager().findFragmentById(R.id.text_fragment);\n\
  \    textFragment.changeTextProperties(fontsize, text);\n}\n```\n\n### 33.9 测试应用程序\n\
  \n该项目的代码工作已经完成，最后一个剩下的任务是运行应用程序。当应用程序启动时，主 activity 将启动，并创建创建显示两个片段。当用户触摸 toolbar\
  \ fragment 中的按钮时，toolbar fragment 将调用 activity 的 `onButtonClick()` 方法，并传递来自 `EditText`\
  \ 视图的文本和 `SeekBar` 的当前值。随后 activity 将调用第二个片段的 `changeTextProperties()` 方法，该方法将修改\
  \ `TextView` 以反映新的文本和字体大小：\n\n![image-H2QSSIAC.jpg](img/image-H2QSSIAC.jpeg)\n\n\
  图 33-10\n\n### 33.10 总结\n\n本章的目标是通过创建一个示例项目，演示在 Android 应用程序中使用片段涉及的步骤。涵盖的主题包括使用\
  \ Android Support Library 以兼容在引入片段之前的 Android 版本、在 activity 布局中包含片段，以及实现片段间的通信。\n\
  \n## 34. 使用 Jetpack 构建现代 Android 应用架构\n\n多年来，Google 并没有推荐构建 Android 应用的特定方法，而是提供工具和开发工具包，让开发者决定哪种方法对于特定项目或个人编程风格最有效。这种情况在\
  \ 2017 年随着 Android 架构组件的引入而改变，这些组件随后在 2018 年发布时成为了 Android Jetpack 的一部分。\n\n本章将提供\
  \ Jetpack 概念、Android 应用架构建议以及一些关键架构组件的概述。在涵盖基础知识后，这些主题将在后续章节中进行详细介绍，并通过实际示例进行演示。\n\
  \n## 34.1 什么是 Android Jetpack？\n\nAndroid Jetpack 由 Android Studio、Android 架构组件、Android\
  \ Support Library 以及一组建议 Android App 应该如何结构的准则组成。Android 架构组件旨在让开发 Android 应用时能够更快、更容易地执行常见任务，同时符合架构准则的核心原则。\n\
  \n虽然本书将涵盖所有的 Android 架构组件，但本章将重点关注关键架构准则以及 `ViewModel`、`LiveData` 和 `Lifecycle`\
  \ 组件，同时引入数据绑定（Data Binding）和仓库（Repositories）。\n\n在继续之前，理解 Jetpack 的应用开发方法是可选的非常重要的。尽管强调了一些多年年来流行的其他技巧的某些缺点，但\
  \ Google 并没有完全谴责那些应用开发方法。Google 的立场是，虽然开发应用没有对错之分，但有一种推荐的方法。\n\n## 34.2 “旧”架构\n\n\
  在名为《在 Android Studio 中创建示例 Android 应用》的章节中，创建了一个 Android 项目，它由单个 activity 组成，包含了用于呈现和管理用户界面的所有代码以及应用的后端逻辑。在\
  \ Jetpack 引入之前，最常见的架构遵循这种范式，应用由多个 activity（每个应用内的每个屏幕一个）组成，每个 activity 类在某种程度上都混合了用户界面和后端代码。\n\
  \n这种方法导致了与应用生命周期相关的问题（例如，当用户旋转设备时，activity 会被销毁并重建，导致未保存到某种持久化存储形式的应用数据丢失），以及诸如导航效率低下的问题（为用户访问的每个应用屏幕启动一个新的\
  \ activity）。\n\n## 34.3 现代 Android 架构\n\n在最基础的层，Google 现在提倡单 activity 应用，并将不同的屏幕作为内容加载到同一个\
  \ activity 中。\n\n现代架构准则还建议将应用内部不同的职责划分到完全独立的模块中（这被称为“关注点分离”）。这种方法的关键之一是 `ViewModel`\
  \ 组件。\n\n## 34.4 ViewModel 组件\n\n`ViewModel` 的目的是将应用中用户界面相关的数据模型和逻辑与负责显示、管理用户界面以及与操作系统交互的代码分开。通过这种设计，应用将由一个或多个\
  \ UI 控制器（如 activity）以及负责处理控制器所需数据的 `ViewModel` 实例组成。\n\n\n\n\n\n`ViewModel` 只负责数据模型和相应的逻辑。它对用户界面一无所知，也不会尝试直接访问或响应与用户界面内视图相关的事件。当\
  \ UI 控制器需要数据进行显示时，它会请求 `ViewModel` 提供这些数据。同样，当用户在用户界面的视图中输入数据时，UI 控制器会将其传递给 `ViewModel`\
  \ 进行处理。\n\n这种职责分离解决了与 UI 控制器生命周期相关的问题。无论 UI 控制器在应用的生命周期内被重建得多频繁，`ViewModel` 实例都会保留在内存中，从而保持数据的一致性。例如，`activity`\
  \ 使用的 `ViewModel` 将一直保留在内存中，直到 `activity` 结束；在单 Activity 应用中，这意味着直到应用退出才会结束。\n\n\
  ![image-UZUAACX7.jpg](img/image-UZUAACX7.jpeg)\n\n图 34-1\n\n## 34.5 LiveData 组件\n\
  \n考虑一个显示实时数据的应用，例如金融股票的当前价格。该应用可以使用股票价格 Web 服务，用最新信息持续更新 `ViewModel` 中的数据模型。这种实时数据只有在及时显示给用户时才有用。UI\
  \ 控制器只有两种方式可以确保在用户界面中显示最新数据。一种方案是让控制器持续检查 `ViewModel`，以确定数据自上次显示以来是否发生了变化。然而，这种方法的问题在于它的效率可能不够。为了保持数据流的实时性，UI\
  \ 控制器必须在循环中运行，持续检查数据发生变化。\n\n更好的解决方案是让 UI 控制器在 `ViewModel` 中的某个特定数据项发生变化时接收到通知。这通过使用\
  \ `LiveData` 组件得以实现。`LiveData` 是一个数据持有者，它允许一个值变为可观察的。简单来说，可观察对象可以在其数据发生变化时通知其他对象，从而解决了确保用户界面始终与\
  \ `ViewModel` 中的数据匹配的问题。\n\n这意味着，例如，对 `ViewModel` 值感兴趣的 UI 控制器可以设置一个观察者，当该值发生变化时，观察者反会收到通知。在我们假设的应用中，例如，股票价格将被封装在\
  \ `ViewModel` 中的一个 `LiveData` 对象中，UI 控制器将为该值分配一个观察者，声明一个在值变化时调用的方法。当由数据变化触发时，该方法将从\
  \ `ViewModel` 读取更新后的值并用其来更新用户界面。\n\n![image-KCI4OCN9.jpg](img/image-KCI4OCN9.jpeg)\n\
  \n图 34-2\n\n`LiveData` 实例也可以被声明为可变的（mutable），允许观察实体更新 `LiveData` 对象持有的底层值。例如，用户可能会在用户界面中输入一个需要覆盖存储在\
  \ `ViewModel` 中的值的值。\n\n使用 `LiveData` 的另一个关键优势是它可以感知观察者的生命周期状态。例如，如果一个 `activity`\
  \ 包含一个 `LiveData` 观察者，相应的 `LiveData` 对象将知道 `activity` 生命周期状态何时何时变化并做出相应响应。如果 `activity`\
  \ 暂停（可能是应用被置于后台），`LiveData` 对象将停止向观察者发送事件。假设 `activity` 刚刚启动或在暂停后恢复。在这种情况下，`LiveData`\
  \ 对象将向观察者发送一个 `LiveData` 事件，以便 `activity` 拥有最新的值。同样，`LiveData` 实例将知道 `activity`\
  \ 何时销并移除观察者以释放资源。\n\n到目前为止，我们只讨论了 UI 控制器使用观察者。在实践中，观察者可以用于任何符合 Jetpack 生命周期管理方法的对象中。\n\
  \n## 34.6 ViewModel 状态的保存\n\nAndroid 允许用户将活跃的应用置于后台，并在设备上执行其他任务（包括运行其他应用）后返回它。当设备资源不足时，操作系统将通过终止后台应用进程来纠正此问题，从最久未使用的应用开始。然而，当用户返回被终止的后台应用时，无论它是否被终止，它都应该以其被置于后台时的相同状态出现。对于与\
  \ `ViewModel` 关联的数据，可以使用 `ViewModel Saved State` 模块来实现。该模块允许将值存储在应用的保存状态中，并在系统启动的进程终止时进行恢复。这个主题将在稍后的“Android\
  \ ViewModel 状态保存教程”章节中介绍。\n\n## 34.7 LiveData 和数据绑定\n\nAndroid Jetpack 包含了数据绑定库（Data\
  \ Binding Library），它允许将 `ViewModel` 中的数据直接映射到 XML 用户界面布局文件中的特定视图。在之前创建的 `AndroidSample`\
  \ 项目中，必须编写代码来获取 `EditText` 和 `TextView` 视图的引用，并设置和获取文本属性以反映数据变化。数据绑定允许在 XML 布局文件中直接引用存储在\
  \ `ViewModel` 中的 `LiveData` 值，避免了编写代码来保持布局视图更新的需求。\n\n![image-DL1954WN.jpg](img/image-DL1954WN.jpeg)\n\
  \n图 34-3\n\n数据绑定将更详细地介绍，从“Android Jetpack 数据绑定概览”章节开始。\n\n## 34.8 Android 生命周期\n\
  \n从 Android 组件被创建到它被销毁的时间持续被称为生命周期。在这个生命周期期间，组件将在不同的生命周期状态之间切换，通常受操作系统的控制并响应用户操作。例如，一个\
  \ `activity` 将从初始化状态开始，过渡到创建状态。一旦 `activity` 运行，它将切换到启动状态，从那里它将在创建、启动、恢复和销毁等状态之间循环。\n\
  \n许多 Android 框架类和组件允许其他对象访问其当前状态。也可以使用生命周期观察者，以便在另一个生命状态变化时接收通知。`ViewModel` 组件在后台使用这种技术来识别观察者何时重启或销毁。这种功能不仅限于\
  \ Android 框架和架构组件。它也可以构建在架构组件包含的一系列生命周期的任何其他类中。\n\n能够检测并响应其他对象生命周期变化的对象被称为生命周期感知（lifecycle-aware）。相反，提供生命周期状态的对象被称为生命周期所有者（lifecycle\
  \ owners）。“使用 Android 生命周期周期感知组件”章节将更详细地介绍生命周期。\n\n## 34.9 仓库模块\n\n如果 `ViewModel`\
  \ 从一个或多个外部源（如数据库或 Web 服务）获取数据，那么将处理这些数据源的代码与 `ViewModel` 类分离是非常重要的。毕竟，这样做将违反关注点分离原则。为了避免将此功能与\
  \ `ViewModel` 混合，Google 的架构指南建议将此代码放在独立的仓库（Repository）模块中。\n\n仓库不是 Android 架构组件，而是应用开发者创建的\
  \ Java 类，负责与各种数据源进行交互。该类随后为 `ViewModel` 提供接口，允许将这些数据存储在模型中。\n\n## 34.10 总结\n\n\n\
  \n\n\n直到最近，Google 往往不会推荐任何特定的 Android 应用结构构建方法。随着 Android Jetpack 的引入，这种情况已经发生了变化。Android\
  \ Jetpack 由工具、组件、库和架构指南组成。Google 现在建议将应用项目划分为单独模块，每个模块负责特定的功能区域，即“关注点分离”。\n\n特别是，指南建议将应用的视图数据模型（view\
  \ data model）与处理用户界面的代码分离。此外，负责从网络服务或数据库等数据源收集代码应该构建在独立的仓库模块（repository module）中，而不是与视图模型（view\
  \ model）打包。\n\nAndroid Jetpack 包含了 Android 架构组件（Android Architecture Components），旨在开发符合推荐指南的应用更加容易。本章介绍了\
  \ `ViewModel`、`LiveData` 和 `Lifecycle` 组件。将从下一章开始详细介绍这些组件。本章未提到的其他架构组件将在本书后后部分介绍。\n\
  \n## 35. Android ViewModel 教程\n\n上一章介绍了 Android Jetpack 的基本概念，并概述了现代 Android 应用架构的基础。Jetpack\
  \ 定义了一系列建议，描述了 Android 应用项目应该如何构建，同时提供了一系列库和组件，使用户更容易遵循这些指南，用更少的代码和更少的错误开发出可靠的应用。\n\
  \n为了帮助强化和澄清上一章提供的信息，本章将逐步创建一个使用 `ViewModel` 组件的示例应用项目。下一章将通过包含 `LiveData` 和数据绑定支持来进一步增强此示例。\n\
  \n## 35.1 关于项目\n\n在“在 Android Studio 中创建示例 Android 应用”章节中，创建了一个名为 `AndroidSample`\
  \ 的项目，其中应用的所有代码都封装在主 `Activity` 类文件中。在接下来的章节中，创建并使用了 `AVD` 模拟器来运行该应用。在应用运行时，我们亲身经历了以这种方式开发应用时出现的问题：当\
  \ `TextView` 小部件上显示的数据在设备旋转期间会丢失。\n\n本章将实现同一个货币转换器应用，将使用 `ViewModel` 组件并遵循 Google\
  \ 应用架构指南，以避免 `Activity` 生命周期的复杂性。\n\n## 35.2 创建 ViewModel 示例项目\n\n在创建 `AndroidSample`\
  \ 项目时，选择了 `Empty Views Activity` 模板作为项目基础。然而，本项目将使用 `Basic Views Template` 模板。\n\
  \n从欢迎屏幕选择 `New Project` 选项，在弹出的新项目对话框中，点击 `Next` 按钮之前选择 `Basic Views Activity` 模板。\n\
  \n在 `Name` 字段中输入 `ViewModelDemo`，并指定 `com.ebookfrenzy.viewmodeldemo` 为包名。在点击 `Finish`\
  \ 按钮之前，将 `Minimum API level` 设置更改为 `API 26: Android 8.0 (Oreo)`，并将 `Language` 菜单改为\
  \ `Java`。\n\n## 35.3 移除不需要的项目元素\n\n正如“Android Studio 布局编辑器工具指南”概述，`Basic Views Activity`\
  \ 模板包含了并非所有项目需要的特性。在将 `ViewModel` 添加到项目之前，我们首先需要按照所示移除导航功能、第二个内容片段（fragment）和浮动操作按钮：\n\
  \n1. 在 Project 工具窗口中双击 `activity_main.xml` 布局文件，选择浮动操作按钮，并按键盘删除 键从布局中移除该对象。\n2.\
  \ 编辑 `MainActivity.java` 文件，从 `onCreate` 方法中移除浮动操作按钮代码，如下所示：\n\n```java\n@Override\n\
  protected void onCreate(Bundle savedInstanceState) {\n. ...\n.\nbinding.fab.setOnClickListener(new\
  \ View.OnClickListener() {\n    @Override\n    public void onClick(View view) {\n\
  \        Snackbar.make(view, \"Replace with your own action\", Snackbar.LENGTH_LONG)\n\
  \            .setAnchorView(R.id.fab)\n            .setAction(\"Action\", null).show();\n\
  \    }\n});\n}\n```\n\n3. 在 Project 工具窗口中，导航并双击 `app -> res -> navigation -> nav_graph.xml`\
  \ 文件，将其加载到导航编辑器中。\n4. 在编辑器中，选择图面板中的 `SecondFragment` 条目，并按键盘删除 键将其从图中移除。\n5. 找到并删除\
  \ `SecondFragment.java` 和 `fragment_second.xml` 文件。\n6. 最后一项任务是从 `FirstFragment`\
  \ 类中移除一些代码，以便 `Button` 视图在点击时不再导航到已不存在的第二个片段。编辑 `FirstFragment.java` 文件并移除 `onViewCreated()`\
  \ 方法中的代码，使其内容如下：\n\n```java\npublic void onViewCreated(@NonNull View view, Bundle\
  \ savedInstanceState) {\n    super.onViewCreated(view, savedInstanceState);\n  \
  \  binding.buttonFirst.setOnClickListener(new View.OnClickListener() {\n       \
  \ @Override\n        public void onClick(View view) {\n            NavHostFragment.findNavController(FirstFragment.this)\n\
  \                .navigate(R.id.action_FirstFragment_to_SecondFragment);\n     \
  \   }\n    });\n}\n```\n\n## 35.4 设计 Fragment 布局\n\n下一步是设计片段的布局。首先，在 Project 工具窗口中找到\
  \ `fragment_first.xml` 文件并双击将其加载到布局编辑器中。布局加载后，选择并删除现有的 `Button`、`TextView` 和 `ConstraintLayout`\
  \ 组件。接下来，在 Component Tree 面板中右键点击 `NestedScrollView` 实例，选择 `Convert NestedScrollView\
  \ to ConstraintLayout` 菜单选项（如图 31 所示），并在结果对话框中接受默认设置：\n\n![image-FYU2NU.jpg](img/images-FYU2NU.jpeg)\n\
  Figure 31\n\n选择转换后的 `ConstraintLayout` 组件并使用属性窗口将 `id` 更改为 `constraintLayout`。\n\
  \n添加一个新的 `TextView`，将其放置在布局中心，并将其 `id` 更改为 `resultText`。接下来，从调色板中拖入 `Number (Decimal)`\
  \ 视图并将其放置在 `TextView` 之上。在布局中选中该视图，参考属性窗口并将 `id` 更改为 `dollarText`。\n\n将一个 `Button`\
  \ 拖到布局中，位于 `TextView` 下方，并将文本属性更改为“Convert”。此时，布局类似于图 32 所示（注意三个视图使用了垂直链）：\n\n![image-OJHMD4Y.jpg](img/images-OJHMD4Y.jpeg)\n\
  Figure 32\n\n## 35.5 实现 ViewModel\n\n用户界面布局完成后，需要在视图模型中创建应用的数据模型。首先在 Project 工具窗口中找到\
  \ `com.ebookfrenzy.viewmodeldemo` 条目，右键点击并选择 `New -> Java Class` 菜单选项。将新类命名为 `MainViewModel`\
  \ 并按回车。编辑新类文件使其内容如下：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\
  \nimport androidx.lifecycle.ViewModel;\n\npublic class MainViewModel extends ViewModel\
  \ {\n    private static final Float rate = 0.74F;\n    private String dollarText\
  \ = \"\";\n    private Float result = 0F;\n\n    public void setAmount(String value)\
  \ {\n        this.dollarText = value;\n        result = Float.parseFloat(dollarText)*rate;\n\
  \    }\n\n    public Float getResult()\n\n    {\n        return result;\n    }\n\
  }\n```\n\n\n\n\n该类声明了变量用于存储当前的美元字符串值以及转换后的金额，并提供了获取（getter）和设置（setter）方法以访问这些数据值。调用\
  \ `setAmount()` 方法时，它会将当前美元金额作为参数并将其存储在局部变量 `dollarText` 中。美元字符串值将被转换为浮点数，乘以一个虚拟的汇率，并将生成的欧元数值存储在\
  \ `result` 变量中。另一方面，`getResult()` 方法返回赋值给 `result` 变量的当前值。\n\n## 35.6 将 Fragment\
  \ 与 ViewModel 关联\n\nFragment 需要某种方式来获取 `ViewModel` 的引用，以便访问模型并观察数据变化。`Fragment`\
  \ 或 `Activity` 使用 `ViewModelProvider` 类的实例来维护其所依赖赖以获取数据的 `ViewModels` 引用。\n\n在 `Fragment`\
  \ 内部使用 `ViewModelProvider` 类创建 `ViewModelProvider` 实例。当调用时，会向类初始化器传递当前 `Fragment`\
  \ 或 `Activity` 的引用，并如下所示返回一个 `ViewModelProvider` 实例：\n\n```java\nViewModelProvider\
  \ viewModelProvider = new ViewModelProvider(this);\n```\n\n一旦创建了 `ViewModelProvider`\
  \ 实例，就可以使用索引值来请求特定的 `ViewModel` 类。提供程序随后将创建该 `ViewModel` 类的新实例，或返回一个现有实例，例如：\n\n\
  ```java\nViewModel viewModel = viewModelProvider.get(MainViewModel.class);\n```\n\
  \n编辑 `FirstFragment.java` 文件并重写 `onCreate()` 方法来设置 `ViewModelProvider`：\n\n```java\n\
  import androidx.lifecycle.ViewModelProvider;\nimport androidx.annotation.Nullable;\n\
  \npublic class FirstFragment extends Fragment {\n    private MainViewModel viewModel;\n\
  \n    @Override\n    public void onCreate(@Nullable Bundle savedInstanceState) {\n\
  \        super.onCreate(savedInstanceState);\n        viewModel = new ViewModelProvider(this).get(MainViewModel.class);\n\
  \    }\n}\n```\n\n获得模型视图的访问权限后，现在可以向 `Fragment` 添加代码以开始处理数据模型。\n\n## 35.7 修改 Fragment\n\
  \n需要更新 Fragment 类以响应按钮点击并与存储在 `ViewModel` 中的数据值进行交互。该类还需要用户界面布局中三个视图的引用，以便响应按钮点击、提取当前美元值并显示转换后的货币金额。\n\
  \n在题为“在 Android Studio 中创建一个 Android 示例应用”的章节中，使用了 `Button` 组件的 `onClick` 属性来指定用户点击按钮时调用的方法。遗憾的是，此属性只能调用\
  \ `Activity` 中的方法，不能用于调用 `Fragment` 中的方法。为了克服这一限制，我们必须向 `Fragment` 类添加一些代码，以在按钮上设置\
  \ `onClick` 监听器。如下所示，可以在 `FirstFragment.java` 文件的 `onViewCreated()` 生命周期方法中实现这一点：\n\
  \n```java\npublic class MainFragment extends Fragment {\n    private MainViewModel\
  \ viewModel;\n\n    @Override\n    public void onViewCreated(@NonNull View view,\
  \ @Nullable Bundle savedInstanceState) {\n        super.onViewCreated(view, savedInstanceState);\n\
  \        binding.convertButton.setOnClickListener(v -> {\n\n        });\n    }\n\
  }\n```\n\n添加监听器后，每当用户点击按钮时，位于 `onClick()` 方法中的任何代码都将被调用。\n\n## 35.8 访问 ViewModel\
  \ 数据\n\n点击按钮时，`onClick()` 方法需要从 `EditText` 视图读取当前值，确认字段为空，然后调用 `ViewModel` 实例的 `setAmount()`\
  \ 方法。随后，该方法需要调用 `ViewModel` 的 `getResult()` 方法并在 `TextView` 组件上显示转换后的值。\n\n由于项目尚未未使用\
  \ `LiveData`，因此在每次创建 `Fragment` 时，也有必要从 `ViewModel` 获取最新的结果值。\n\n在 `FirstFragment.java`\
  \ 文件中，在 `onViewCreated()` 方法中如下实现这些需求：\n\n```java\nimport java.util.Locale;\n\n\
  @Override\npublic void onViewCreated(@NonNull View view, @Nullable Bundle savedInstanceState)\
  \ {\n    super.onViewCreated(view, savedInstanceState);\n    binding.resultText.setText(String.format(Locale.ENGLISH,\"\
  %.2f\",\n    viewModel.getResult()));\n    binding.convertButton.setOnClickListener(v\
  \ -> {\n        if (!binding.dollarText.getText().toString().equals(\"\")) {\n \
  \           viewModel.setAmount(String.format(Locale.ENGLISH,\"%s\",\n         \
  \   binding.dollarText.getText()));\n            binding.resultText.setText(String.format(Locale.ENGLISH,\"\
  %.2f\",\n            viewModel.getResult()));\n        } else {\n            binding.resultText.setText(\"\
  No Value\");\n        }\n    });\n}\n```\n\n## 35.9 测试项目\n\n完成此项目开发阶段后，在模拟器或物理设备上构建并运行应用，输入美元值并点击转换按钮。转换后的金额应出现在\
  \ `TextView` 上，表明 UI 控制器和 `ViewModel` 的重构符合预期。\n\n当运行原始的 `AndroidSample` 应用时，旋转设备会导致\
  \ `resultText` `TextView` 组件上显示的值丢失。现在对 `ViewModelDemo` 应用重复此测试，并注意在旋转后当前的欧元值被保留。这是因为当\
  \ `Fragment` 被销毁和重建时，`ViewModel` 仍然留在内存中，并且在 `onViewCreated()` 方法中添加了代码以用结果数据值更新\
  \ `TextView`。\n\n## 35.10 总结\n\n在本章节中，我们回顾了书中之前创建的 `AndroidSample` 项目，并创建了符合 Android\
  \ Jetpack 指南的新版本项目。示例项目还展示了使用 `ViewModels` 来分离数据处理与界面。\n\n## 36. Android Jetpack\
  \ LiveData 教程\n\n上一章节开始按照推荐的 Jetpack 指南构建应用。这些初始步骤在 `ViewModel` 实例中实现了应用界面的数据模型。\n\
  \n本章节将使用 `LiveData` 进一步增强应用设计。在本章为项目添加 `LiveData` 支持后，后续章节（从“Android Jetpack Data\
  \ Binding 概述”开始）将使用 Jetpack Data Binding 库进一步减少代码。\n\n## 36.1 LiveData - 回顾\n\n\
  `LiveData` 之前在“带有 Jetpack 的现代 Android 应用架构”章节中介绍过。如前所述，`LiveData` 组件可以作为视图内部数据的封装。一旦包含在\
  \ `LiveData` 实例中，这些变量就可以被应用内的其他对象（通常是 `Activity` 和 `Fragment`）观察到。这允许 UI 控制器在底层\
  \ `LiveData` 值变化时接收通知。通过创建 `Observer` 类的实例并定义在 `LiveData` 值变化时调用的 `onChange()` 方法，可以设置观察者。一旦创建了\
  \ `Observer` 实例，就可以调用 `LiveData` 对象的 `observe()` 方法将其附加到 `LiveData` 对象上。\n\n`LiveData`\
  \ 实例可以使用 `MutableLiveData` 类声明为可变，从而允许 `ViewModel` 和 UI 控制器更改底层数据值。\n\n## 36.2 向\
  \ ViewModel 中添加 LiveData\n\n启动 Android Studio，打开上一章创建的 `ViewModelDemo` 项目，并打开 `MainViewModel.java`\
  \ 文件，其目前的内容如下：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo;\n```\n\n\n\n\n\
  ```java\nimport androidx.lifecycle.ViewModel;\n\npublic class MainViewModel extends\
  \ ViewModel {\n    private static final Float rate = 0.74F;\n    private String\
  \ dollarText = \"\";\n    private Float result = 0F;\n\n    public void setAmount(String\
  \ value) {\n        this.dollarText = value;\n        result = Float.parseFloat(dollarText)*rate;\n\
  \    }\n\n    public Float getResult() {\n        return result;\n    }\n}\n```\n\
  \n本章的这一阶段是将 `result` 变量封装在一个 `MutableLiveData` 实例中（该对象需要是可变的，以便在用户每次请求货币转换时都能更改值）。首先修改该类，使其现在的内容所示，请注意在使用\
  \ `LiveData` 时需要导入一个额外的包：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo;\n\n\
  import androidx.lifecycle.MutableLiveData;\nimport androidx.lifecycle.ViewModel;\n\
  \npublic class MainViewModel extends ViewModel {\n    private static final Float\
  \ rate = 0.74F;\n    private String dollarText = \"\";\n    private Float result\
  \ = 0F;\n    final private MutableLiveData result = new MutableLiveData<>();\n\n\
  \    public void setAmount(String value) {\n        this.dollarText = value;\n \
  \       result = Float.parseFloat(dollarText)*rate;\n    }\n\n    public Float getResult()\
  \ {\n        return result;\n    }\n}\n```\n\n既然 `result` 变量已包含在可变的 `LiveData` 实例中，则必须修改\
  \ `setAmount()` 和 `getResult()` 方法。在 `setAmount()` 方法中，不能再使用赋值运算符（`=`）为 `result`\
  \ 变量赋值。相反，必须调用 `LiveData.setValue()` 方法，并将新值作为参数传递。按照目前的实现，`getResult()` 方法声明为返回\
  \ `Float` 值，必须更改为返回 `MutableLiveData` 对象。完成这些剩余更改后将得到以下类文件：\n\n```java\npackage\
  \ com.ebookfrenzy.viewmodeldemo;\n\nimport androidx.lifecycle.MutableLiveData;\n\
  import androidx.lifecycle.ViewModel;\n\npublic class MainViewModel extends ViewModel\
  \ {\n    private static final Float rate = 0.74F;\n    private String dollarText\
  \ = \"\";\n    final private MutableLiveData result = new MutableLiveData<>();\n\
  \n    public void setAmount(String value) {\n        this.dollarText = value;\n\
  \        result = Float.parseFloat(dollarText)*rate;\n        result.setValue(Float.parseFloat(dollarText)*rate);\n\
  \    }\n\n    public MutableLiveData getResult() {\n        return result;\n   \
  \ }\n}\n```\n\n## 36.3 实现观察者\n\n现在转换结果已包含在 `LiveData` 实例中，下一步是在 UI 控制器中配置一个观察者，在例中，该控制器是\
  \ `FirstFragment` 类。找到 `FirstFragment.java` 类（`app -> java -> -> FirstFragment`），双击将其加载到编辑器，并修改\
  \ `onViewCreated()` 方法以创建一个名为 `resultObserver` 的新 `Observer` 实例：\n\n```java\npackage\
  \ com.ebookfrenzy.viewmodeldemo;\n\nimport androidx.lifecycle.Observer;\n// ...\n\
  @Override\npublic void onViewCreated(@NonNull View view, @Nullable Bundle savedInstanceState)\
  \ {\n    super.onViewCreated(view, savedInstanceState);\n    binding.resultText.setText(String.format(Locale.ENGLISH,\"\
  %.2f\",\n    viewModel.getResult()));\n    final Observer resultObserver = new Observer()\
  \ {\n        @Override\n        public void onChanged(@Nullable final Float result)\
  \ {\n            binding.resultText.setText(String.format(Locale.ENGLISH,\n    \
  \        \"%.2f\", result));\n        }\n    };\n// ...\n}\n```\n\n`resultObserver`\
  \ 实例声明了 `onChanged()` 方法，该方法在调用时会传入当前结果值，然后将其转换为字符串并显示在 `resultText` TextView 对象上。下一步是将观察者添加到\
  \ `result` `LiveData` 对象中，该引用可以通过调用 `ViewModel` 对象的 `getResult()` 方法获取。由于更新 `result`\
  \ TextView 现在是 `onChanged()` 回调方法的职责，现在可以删除执行此任务的现有代码行：\n\n```java\n@Override\n\
  public void onViewCreated(@NonNull View view, @Nullable Bundle savedInstanceState)\
  \ {\n    super.onViewCreated(view, savedInstanceState);\n    binding.resultText.setText(String.format(Locale.ENGLISH,\"\
  %.2f\",\n    viewModel.getResult()));\n    final Observer resultObserver = new Observer()\
  \ {\n        @Override\n        public void onChanged(@Nullable final Float result)\
  \ {\n            binding.resultText.setText(String.format(Locale.ENGLISH,\n    \
  \        \"%.2f\", result));\n        }\n    };\n    viewModel.getResult().observe(getViewLifecycleOwner(),\
  \ resultObserver);\n    binding.convertButton.setOnClickListener(v -> {\n      \
  \  if (!binding.dollarText.getText().toString().equals(\"\")) {\n            viewModel.setAmount(String.format(Locale.ENGLISH,\"\
  %s\",\n            binding.dollarText.getText()));\n            binding.resultText.setText(String.format(Locale.ENGLISH,\"\
  %.2f\",\n            viewModel.getResult()));\n        } else {\n            binding.resultText.setText(\"\
  No Value\");\n        }\n    });\n}\n```\n\n编译并运行应用，在美元字段中输入一个值，点击转换（Convert）按钮，并验证转换后的欧元金额是否显示在\
  \ TextView 上。这证实了观察者收到了结果值变化的通知。\n\n在上述 `onViewCreated()` 方法中，原本用于每次调用时显示当前值的代码行已被删除。这原本是为了在\
  \ Fragment 重建时能够恢复显示值。由于 `LiveData` 监控观察者的生命周期，现在不再需要这样做。当 `LiveData` 检测到 UI 控制器被重建时，它会自动触发相关的观察者并提供最新数据。你可以通过在\
  \ TextView 上显示值时旋转设备来验证这一点。\n\n在进入下一章之前，关闭项目，复制 `ViewModelDemo` 文件夹并将其保存为 `ViewModelDemo_LiveData`\
  \ 以备后用。\n\n## 36.4 总结\n\n本章演示了如何使用 `LiveData` 组件确保显示的数据与存储在 `ViewModel` 中的数据一致。这一简单过程是将\
  \ `ViewModel` 值封装在 `LiveData` 对象中，并在 UI 控制器中设置订阅该值的观察者。每当 `LiveData` 值变化时，观察者就会收到通知并调用\
  \ `onChanged()` 方法。\n\n为项目添加 `LiveData` 支持在某种程度上简化了设计。使用 Data Binding Library 还可以带来重大的改进，细节将在下一章中讨论。\n\
  \n## 37. Android Jetpack Data Binding 概览\n\n在标题为“使用 Jetpack 构建现代 Android 应用架构”的章节中，我们引入了\
  \ Android Data Binding。我们解释了如何使用它直接将 UI 布局中的视图连接到其他对象中的方法和数据，无需编写代码。本章将提供更多关于数据绑定的细节，重点介绍其实现实现的方式。下一章的教程（Android\
  \ Jetpack Data Binding 教程）将提供一个实用的示例。\n\n## 37.1 Data Binding 概览\n\nAndroid Jetpack\
  \ Data Binding Library 提供了绑定支持，主要提供了一种简单的方法，将 UI 布局中的视图与应用代码中存储的数据（通常在 ViewModel\
  \ 实例中）连接起来。\n\n\n\n\n当数据绑定与 `LiveData` 组件结合使用时，其功能变得异常强大。例如，考虑使用数据绑定将 `EditText`\
  \ 视图绑定到 `ViewModel` 中的 `LiveData` 变量。通过这种方式连接后，`ViewModel` 中数据值的任何更改将自动显示在 `EditText`\
  \ 视图中；当使用双向绑定时，输入到 `EditText` 中的任何数据都将自动用于更新 `LiveData` 的值。最令人印象深刻的是，这可以在初始化绑定所需的代码之外，无需编写任何额外代码即可实现。\n\
  \n传统上，将交互式视图（如 `Button` 控件）连接到 UI 控制器中的方法，需要开发者编写代码来实现一个监听器方法，以便在点击按钮时调用该方法。数据绑定使得这一切变得非常简单，只需在布局\
  \ XML 文件的 `Button` 元素中引用要被调用的方法即可。\n\n## 37.2 数据绑定的核心组件\n\nAndroid Studio 项目默认并没有配置数据绑定的支持。在应用开始使用数据绑定之前，必须组合几个元素。这些元素涉及项目构建配置、布局\
  \ XML 文件、数据绑定类以及数据绑定表达式语言的使用。虽然初看起来之下这可能很复杂，但分离开来看，这些都是非常简单的步骤，一旦完成，在节省编码工作方面是非常值得的。本章剩余部分将详细介绍每个元素。在介绍这些基础之后，下一章将通过详细的教程演示这些步骤。\n\
  \n### 37.2.1 项目构建配置\n\n在项目可以使用数据绑定之前，必须将其配置为使用 Android Data Binding Library，并启用对数据绑定类和绑定语法的支持。幸运的是，只需在模块级\
  \ `build.gradle.kts` 文件中添加几行代码即可实现（即项目工具窗口 Gradle Scripts 下列出的 `build.gradle.kts\
  \ (Module: app)` 的文件）。以下列出了启用了数据绑定的部分构建文件：\n\n```\nandroid {\n    buildFeatures\
  \ {\n        dataBinding = true\n    }\n}\n```\n\n### 37.2.2 数据绑定布局文件\n\n正如我们在之前的章节中所看到的，应用的用户界面通常包含在\
  \ XML 布局文件中。在这些布局文件中的视图利用数据绑定优势之前，必须将布局文件转换为数据绑定布局文件。\n\n正如书前面所述的，XML 布局文件定义了布局中组件的层次结构，从顶层或根视图开始。无论如何，这个根视图都是布局容器的形式，例如\
  \ `ConstraintLayout`、`FrameLayout` 或 `LinearLayout` 实例，就像 `ViewModelDemo` 项目中的 `fragment_main.xml`\
  \ 文件所示：\n\n```xml\nxmlns:android=\"http://schemas.android.com/apk/res/android\"\n\
  xmlns:app=\"http://schemas.android.com/apk/res-auto\"\nxmlns:tools=\"http://schemas.android.com/tools\"\
  \nandroid:id=\"@+id/main\"\nandroid:layout_width=\"match_parent\"\nandroid:layout_height=\"\
  match_parent\"\ntools:context=\".ui.main.MainFragment\">\n```\n\n要使用数据绑定，布局层次结构必须有一个布局组件作为根视图，该组件反过来成为当前根视图的父视图。\n\
  \n在上述示例的情况下，这将需要对现有布局文件进行以下更改：\n\n```xml\nxmlns:tools=\"http://schemas.android.com/tools\"\
  \nxmlns:android=\"http://schemas.android.com/apk/res/android\"\nxmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\nxmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \nxmlns:tools=\"http://schemas.android.com/tools\"\nandroid:id=\"@+id/main\"\nandroid:layout_width=\"\
  match_parent\"\nandroid:layout_height=\"match_parent\"\ntools:context=\".ui.main.MainFragment\"\
  >\n```\n\n### 37.2.3 布局文件数据元素\n\n数据绑定布局文件需要某种方式来声明项目中的类，布局中的视图将绑定到这些类（例如 `ViewModel`\
  \ 或 UI 控制器）。声明这些类后，布局文件需要一个变量在绑定表达式中引用这些实例。\n\n这是通过 `data` 元素实现的，示例所示：\n\n```xml\n\
  xmlns:tools=\"http://schemas.android.com/tools\"\nxmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \nname=\"myViewModel\"\ntype=\"com.ebookfrenzy.myapp.ui.main.MainViewModel\" />\n\
  android:id=\"@+id/main\"\nandroid:layout_width=\"match_parent\"\nandroid:layout_height=\"\
  match_parent\"\ntools:context=\".ui.main.MainFragment\">\n```\n\n上述数据元素声明了一个名为 `myViewModel`\
  \ 类型为 `MainViewModel` 的新变量（注意，在声明变量时必须声明 `MyViewModel` 类的完整包名）。\n\n`data` 元素可以导入其他类，这些类可以在布局文件的其他地方绑定表达式中引用。例如，如果你有一个类，在显示给用户之前需要对某个值调用其中的方法，可以如下所示导入该类：\n\
  \n```xml\nname=\"viewModel\"\ntype=\"com.ebookfrenzy.myapp.ui.main.MainViewModel\"\
  \ />\n```\n\n### 37.2.4 绑定类\n\n对于绑定布局文件中 `data` 元素中引用的每个类，Android Studio 将自动生成一个对应的绑定类。此\
  \ `AndroidDataBinding` 类的类将根据布局文件名使用 `Binding` 后缀命名。因此，对于名为 `fragment_main` 的布局，绑定类将是\
  \ `FragmentMainBinding`。绑定类包含布局文件中指定的绑定，并映射到变量。\n\n虽然绑定类是自动生成的，但必须编写代码创建该实例。幸运的是，可以通过\
  \ `DataBindingUtil` 类来实现。\n\n`Activity` 或 `Fragment` 的初始化代码通常会设置内容视图或“填充”用户界面布局。这意味着代码打开布局文件，解析\
  \ XML 并在内存中创建并配置视图对象。对于现有的 `Activity` 类，实现此目的的代码位于 `onCreate()` 方法中，如下：\n\n```java\n\
  setContentView(R.layout.activity_main);\n```\n\n在 `Fragment` 的情况下，这发生在 `onCreateView()`\
  \ 方法中：\n\n```java\nreturn inflater.inflate(R.layout.fragment_main, container, false);\n\
  ```\n\n在 `Activity` 类中创建绑定实例只需要如下所示修改初始化代码：\n\n```java\nActivityMainBinding binding;\n\
  binding = DataBindingUtil.setContentView(this, R.layout.activity_main, false);\n\
  ```\n\n在 `Fragment` 的情况下，代码如下：\n\n```java\nFragmentMainBinding binding;\nbinding\
  \ = DataBindingUtil.inflate(inflater, R.layout.fragment_main, container, false);\n\
  binding.setLifecycleOwner(this);\nView view = binding.getRoot();\nreturn view;\n\
  ```\n\n### 37.2.5 数据绑定变量配置\n\n如上述，数据绑定布局文件包含 `data` 元素，该元素包含 `variable` 元素，由变量名和要建立绑定的类类型组成。例如：\n\
  \n```xml\nname=\"viewModel\"\ntype=\"com.ebookfrenzy.viewmodeldemo.ui.main.MainViewModel\"\
  \ />\nname=\"uiController\"\ntype=\"com.ebookfrenzy.viewmodeldemo_databinding.ui.main.MainFragment\"\
  \ />\n```\n\n在上述示例中，第一个变量知道它将绑定类型为 `MainViewModel` 的 `ViewModel` 类实例，但尚未连接到实际的 `MainViewModel`\
  \ 对象实例。这需要额外的步骤，将应用内部使用的 `MainViewModel` 实例赋值给布局文件中声明的变量。通过调用数据绑定实例的 `setVariable()`\
  \ 方法来实现，该引用在上一章中获取。\n\n\n\n\n```java\nMainViewModel mViewModel = new ViewModelProvider(this).get(MainViewModel.class);\n\
  \nbinding.setVariable(viewModel, mViewModel);\n```\n\n上述数据元素中的第二个变量以 `名为` `Fragment`\
  \ 的形式引用了一个 UI 控制器类。在这种情况下，UI 控制器（无论是 `Activity` 还是 `Fragment`）中的代码需要按照如下方式将自己赋值给该变量：\n\
  \n```java\nbinding.setVariable(uiController, this);\n```\n\n### 37.2.6 绑定表达式（单向）\n\
  \n绑定表达式定义了特定视图如何与绑定对象进行交互。例如，`Button` 上的绑定表达式可以声明在响应点击事件时调用对象上的哪个方法。或者，绑定表达式可以定义存储在\
  \ `ViewModel` 中的哪个数据值将显示在 `TextView` 中，以及如何对其进行展示和格式化。\n\n绑定表达式使用声明式语言，该语言允许通过逻辑以及对其他类和方法的访问来决定如何使用绑定数据。例如，表达式可以包含数学表达式、方法调用、字符串拼接、对数组元素的访问以及比较操作。此外，所有标准的\
  \ Java 语言库都会默认导入，因此在 Java 中可以实现的许多功能也可以在绑定表达式中执行。正如讨论过的，数据元素还可以用于导入自定义类，以为表达式添加更多功能。\n\
  \n绑定表达式以 `@` 符号开头，随后是包含在大括号 (`{}`) 中的表达式。\n\n例如，考虑一个包含名为 `result` 变量的 `ViewModel`\
  \ 实例。假设该类已分配给数据绑定布局文件中名为 `viewModel` 的变量，并需要绑定到 `TextView` 对象，以便该视图始终显示最新的结果值。如果此值被存储为\
  \ `String` 对象，则在布局文件中声明如下：\n\n```xml\nandroid:id=\"@+id/resultText\"\nandroid:layout_width=\"\
  wrap_content\"\nandroid:layout_height=\"wrap_content\"\nandroid:text=\"@{viewModel.result}\"\
  \napp:layout_constraintBottom_toBottomOf=\"parent\"\napp:layout_constraintEnd_toEndOf=\"\
  parent\"\napp:layout_constraintStart_toStartOf=\"parent\"\napp:layout_constraintTop_toTopOf=\"\
  parent\" />\n```\n\n在上述 XML 中，`text` 属性被设置为存储在 `viewModel` 中 `result` `LiveData`\
  \ 属性中的值。\n\n然而，考虑到 `result` 在模型中存储为 `Float` 值而不是 `String`。如果是这样，上述表达式将导致编译错误。显然，在\
  \ `TextView` 显示它之前，必须将 `Float` 值转换为字符串。为了解决此类问题，绑定表达式可以包含使用标准 Java 语言类完成转换所需的步骤：\n\
  \n```xml\nandroid:text=\"@{String.valueOf(viewModel.result)}\"\n```\n\n在进行此更改后运行应用时，由于\
  \ Android Studio 控制台可能会出现以下警告：\n\n`warning: myViewModel.result.getValue() is a boxed\
  \ field but needs to be un-boxed to execute String.valueOf(viewModel.result.getValue()).`\n\
  \nJava 中的值可以以原始值的形式存在（例如 `boolean` 类型，称为拆箱），也可以封装在 Java 对象中（如 `Boolean` 类型）并通过对该对象的引用进行访问（即装箱）。拆箱过程涉及从对象中拆出原始值。\n\
  \n为了避免此消息，请按照如下所示，将违规的操作封装在 `safeUnbox()` 调用中：\n\n```xml\nandroid:text=\"@{String.valueOf(safeUnbox(myViewModel.result))}\"\
  \n```\n\n也可以使用字符串拼接。例如，为了在结果字符串值后包含“dollars”单词，将以下表达式：\n\n```xml\nandroid:text='@{String.valueOf(safeUnbox(myViewModel.result))\
  \ + \" dollars\"}'\n```\n\n注意，由于附加的结果字符串被封装在双引号中，因此该表达式现在用单引号进行封装，以避免语法错误。\n\n表达式语法还允许声明三元语句。在以下表达式中，视图将根据\
  \ `result` 值是否大于 10 显示不同的文本：\n\n```xml\n@{myViewModel.result > 10 ? \"Out of range\"\
  \ : \"In range\"}\n```\n\n表达式还可以构造为以访问数据数组中的特定元素：\n\n```xml\n@{myViewModel.resultsArray[3]}\n\
  ```\n\n### 37.2.7 绑定表达式（双向）\n\n到目前为止涵盖的表达式类型被称为单向绑定。换句话说，随着相应值的发生变化，布局会不断更新，但从布局内部对值的更改不会更新存储的值。\n\
  \n另一方面，双向绑定允许数据模型响应布局的变化而进行更新。例如，`EditText` 视图可以配置为双向绑定，这样当用户输入不同的值时，该值将用于更新相应的数据模型值。在声明双向表达式时，语法与单向表达式类似，但它以\
  \ `@=` 开头：\n\n```xml\nandroid:text=\"@={myViewModel.result}\"\n```\n\n### 37.2.8\
  \ 事件和监听器绑定\n\n绑定表达式还可以响应视图上的事件触发方法调用。例如，`Button` 视图可以配置为点击时调用一个方法。在标题为“在 Android\
  \ Studio 中创建 Android 应用”的章节中，例如，按钮的 `onClick` 属性被配置为调用应用主 Activity 中名为 `convertCurrency`\
  \ 的方法。\n\n\n\n\n\n在 `ViewModelDemo` 应用中实现数据绑定之前，我们将通过删除项目中在本文章结束时不再需要的所有代码来演示数据绑定的威力。\n\
  \n启动 Android Studio，打开 `ViewModelDemo` 项目，编辑 `FirstFragment.java` 文件，并按如下修改代码：\n\
  \n```java\npackage com.ebookfrenzy.viewmodeldemo;\n\n.\n\n.\n\nimport android.arch.lifecycle.Observer;\n\
  \n.\n\n.\n\npublic class MainFragment extends Fragment {\n    private MainViewModel\
  \ viewModel;\n\n.\n\n.\n\n    @Override\n    public void onViewCreated(@NonNull\
  \ View view,\n    @Nullable Bundle savedInstanceState) {\n        super.onViewCreated(view,\
  \ savedInstanceState);\n        final Observer resultObserver = new Observer() {\n\
  \            @Override\n            public void onChanged(@Nullable final Float\
  \ result) {\n                binding.resultText.setText(String.format(Locale.ENGLISH,\n\
  \                \"%.2f\", result));\n            }\n        };\n        viewModel.getResult().observe(getViewLifecycleOwner(),\
  \ resultObserver);\n        binding.convertButton.setOnClickListener(v -> {\n  \
  \          if (!binding.dollarText.getText().toString().equals(\"\")) {\n      \
  \          viewModel.setAmount(String.format(Locale.ENGLISH,\"%s\",\n          \
  \      binding.dollarText.getText()));\n            } else {\n                binding.resultText.setText(\"\
  No Value\");\n            }\n        });\n    }\n}..\n```\n\n接下来，编辑 `MainViewModel.java`\
  \ 文件并继续按如下删除代码（同时注意 `dollarText` 变量到 `LiveData` 的转换）：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo;\n\
  \nimport android.arch.lifecycle.MutableLiveData;\nimport android.arch.lifecycle.ViewModel;\n\
  \npublic class MainViewModel extends ViewModel {\n    private static final Float\
  \ rate = 0.74F;\n    final public MutableLiveData dollarValue = new MutableLiveData<>();\n\
  \    private String dollarText = \"\";\n    final private public MutableLiveData\
  \ result = new MutableLiveData<>();\n\n    public void setAmount(String value) {\n\
  \        this.dollarText = value;\n        result.setValue(Float.valueOf(dollarText)*rate);\n\
  \    }\n\n    public MutableLiveData getResult()\n    {\n        return result;\n\
  \    }\n}\n```\n\n虽然我们在实现数据绑定时会添加几行额外的代码，但数据绑定显著减少了需要编写的代码量。\n\n## 38.2 启用数据绑定\n\
  \n使用数据绑定的第一步是在 Android Studio 项目中启用它。这涉及向 `Gradle Scripts -> build.gradle.kts (Module\
  \ :app)` 文件添加一个新属性。\n\n在 `build.gradle.kts` 文件中，添加以下元素以在项目中启用数据绑定：\n\n```kotlin\n\
  plugins {\n    alias(libs.plugins.android.application)\n}\n\nandroid {\n    .\n\n\
  .\n\n    buildFeatures {\n        viewBinding = true\n        dataBinding = true\n\
  \    }\n.\n\n.\n}\n```\n\n一旦添加了该项，编辑器顶部将出现一个包含 `Sync Now` 链接的栏。点击此链接以新的构建配置设置重新同步项目。\n\
  \n## 38.3 添加布局元素\n\n正如“Android Jetpack Data Binding 概述”中所述，布局层次结构必须有一个布局组件作为根视图才能使用数据绑定。这需要对\
  \ `fragment_first.xml` 布局文件（`app -> res -> layout -> fragment_first.xml`）进行以下更改。在布局编辑器工具中打开此文件，切换到\
  \ Code 模式，并进行这些更改：\n\n```xml\nxmlns:tools=\"http://schemas.android.com/tools\"\n\
  xmlns:android=\"http://schemas.android.com/apk/res/android\">\nxmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \nxmlns:tools=\"http://schemas.android.com/tools\"\nandroid:id=\"@+id/main\"\nandroid:layout_width=\"\
  match_parent\"\nandroid:layout_height=\"match_parent\"\ntools:context=\".FirstFragment\"\
  >\n.\n\n.\n```\n\n一旦完成这些更改，切换回 Design 模式并注意新的根视图虽然在布局画布上不可见，但现在已列在组件树中，如图 38-1 所示：\n\
  \n![image-XWDOTQ5X.jpg](img/image-XWDOTQ5X.jpeg)\n\n图 38-1\n\n构建并运行应用以验证添加布局元素没有更改用户界面外观。\n\
  \n## 38.4 在布局文件中添加数据元素\n\n将布局文件转换为数据绑定布局文件的下一步是添加数据元素。对于此示例，布局将绑定到 `MainViewModel`，因此编辑\
  \ `fragment_first.xml` 文件按如下添加数据元素：\n\n```xml\nxmlns:tools=\"http://schemas.android.com/tools\"\
  \nxmlns:android=\"http://schemas.android.com/apk/res/android\">\nname=\"myViewModel\"\
  \ntype=\"com.ebookfrenzy.viewmodeldemo.MainViewModel\" />\nandroid:id=\"@+id/main\"\
  \nandroid:layout_width=\"match_parent\"\nandroid:layout_height=\"match_parent\"\n\
  tools:context=\".FirstFragment\">\n.\n\n.\n```\n\n构建并重新运行应用以确保这些更改生效。\n\n## 38.5\
  \ 绑定类工作\n\n下一步是修改 `FirstFragment.java` 文件代码以展开数据绑定。实现此点的最佳方法是重写 `onCreateView()`\
  \ 方法：\n\n```java\n.\n\n.\n\nimport androidx.databinding.DataBindingUtil;\nimport\
  \ com.ebookfrenzy.viewmodeldemo.R;\n\n.\n\n.\n\npublic class MainFragment extends\
  \ Fragment {\n.\n\n.\n\n    public View onCreateView(@NonNull LayoutInflater inflater,\
  \ @Nullable ViewGroup container,\n    @Nullable Bundle savedInstanceState) {\n \
  \       binding = DataBindingUtil.inflate(inflater, R.layout.fragment_first, container,\
  \ false);\n        binding.setLifecycleOwner(this);\n        return binding.getRoot();\n\
  \    }\n}\n```\n\n旧代码展开了 `fragment_first.xml` 布局文件（也就是说创建了包含所有视图的布局）并返回了根视图。数据绑定库包含一个特殊的展开方法，它除了构建\
  \ UI 还返回实例。新代码调用此方法并将绑定类存储在变量中：`binding = DataBindingUtil.inflate(inflater, R.layout.fragment_first,\
  \ container, false);` 绑定对象必须在碎片存在期间保留在内存中。为了确保在碎片消失时销毁，将当前碎片声明为绑定的生命周期所有者：`binding.setLifecycleOwner(this);`\n\
  \n## 38.6 将 ViewModel 实例分配数据绑定\n\n此时，数据绑定知道它将绑定到 `MainViewModel` 类型的实例，但尚未连接到实际的\
  \ `MainViewModel` 对象。这需要将应用程序中的 `MainViewModel` 实例分配给布局文件中声明的 `viewModel` 。在 `FirstFragment.java`\
  \ 文件的 `onViewCreated()` 方法中按如下添加此代码：\n\n```java\n.\n\n.\n\nimport static com.ebookfrenzy.viewmodeldemo.BR.myViewModel;\n\
  \n.\n\n.\n\n    @Override\n    public void onViewCreated(@NonNull View view, @Nullable\
  \ Bundle savedInstanceState) {\n        super.onViewCreated(view, savedInstanceState);\n\
  \        binding.setVariable(myViewModel, viewModel);\n    }\n```\n\n如果 Android\
  \ Studio 报告 `myViewModel` 未定义，请使用 `Build -> Make Project` 选项重建项目以强制生成类。完成这些更改后，下一步是在数据绑定布局文件的视图元素中插入绑定表达式。\n\
  \n## 38.7 添加绑定表达式\n\n第一个绑定表达式将 `resultText` TextView 绑定到模型视图中的 `result` 值。编辑 `fragment_first.xml`\
  \ 文件，找到 `resultText` 元素并修改 `text` 属性，使元素如下：\n\n```xml\nandroid:id=\"@+id/resultText\"\
  \nandroid:layout_width=\"wrap_content\"\nandroid:layout_height=\"wrap_content\"\n\
  android:text=\"TextView\"\nandroid:text='@{safeUnbox(myViewModel.result) == 0.0\
  \ ? \"Enter value\" : String.valueOf(safeUnbox(myViewModel.result)) + \" euros\"\
  }'\napp:layout_constraintBottom_toBottomOf=\"parent\"\napp:layout_constraintEnd_toEndOf=\"\
  parent\"\napp:layout_constraintStart_toStartOf=\"parent\"\napp:layout_constraintTop_toTopOf=\"\
  parent\" />\n```\n\n\n\n\n\n该表达式首先检查结果值当前是否为零，如果是，则显示一条消息指示用户输入一个值。然而，如果结果不为零，则会将该值转换为字符串，并与“euros”一词拼接，然后显示给用户。\n\
  \n结果值仅需要单向绑定，因为布局永远不需要更新存储在 `ViewModel` 中的值。相比之下，`dollarValue` `EditText` 视图需要使用双向绑定，以便数据模型可以根据用户输入的最新值进行更新，并允许在发生设备旋转等生命周期事件时，将当前值重新显示在视图中。`dollarText`\
  \ 元素现在应该声明如下：\n\n```xml\nandroid:id=\"@+id/dollarText\"\nandroid:layout_width=\"\
  wrap_content\"\nandroid:layout_height=\"wrap_content\"\nandroid:layout_marginTop=\"\
  96dp\"\nandroid:ems=\"10\"\nandroid:importantForAutofill=\"no\"\nandroid:inputType=\"\
  numberDecimal\"\nandroid:text=\"@={myViewModel.dollarValue}\"\napp:layout_constraintEnd_toEndOf=\"\
  parent\"\napp:layout_constraintHorizontal_bias=\"0.502\"\napp:layout_constraintStart_toStartOf=\"\
  parent\"\napp:layout_constraintTop_toTopOf=\"parent\" />\n```\n\n现在已经添加了这些初始绑定表达式，必须编写一个方法，在用户点击\
  \ `Button` 组件时执行转换。\n\n## 38.8 添加转换方法\n\n当点击 Convert 按钮时，它将调用 `ViewModel` 上的方法来执行转换计算，并将欧元值存入\
  \ `result` `LiveData` 变量中。现在在 `MainViewModel.java` 文件添加此方法：\n\n```java\npublic class\
  \ MainViewModel extends ViewModel {\n    private static final Float usd_to_eu_rate\
  \ = 0.74F;\n    final public MutableLiveData dollarValue = new MutableLiveData<>();\n\
  \    final public MutableLiveData result = new MutableLiveData<>();\n\n    public\
  \ void convertValue() {\n        if ((dollarValue.getValue() != null) &&\n     \
  \       (!dollarValue.getValue().isEmpty())) {\n            result.setValue(Float.parseFloat(dollarValue.getValue())\n\
  \                * rate);\n        } else {\n            result.setValue(0F);\n\
  \        }\n    }\n}\n```\n\n注意，在没有有效的美元值的情况下，`result` `LiveData` 变量将被赋值为零。这确保了分配给\
  \ `resultText` `TextView` 的绑定表达式在用户未输入任何值时会显示“Enter value”消息。\n\n## 38.9 添加监听器绑定\n\
  \n在测试项目之前的最后一步是在布局文件中的 `Button` 元素添加监听器绑定表达式，以便在点击按钮时调用 `convertValue()` 方法。再次以\
  \ Code 模式编辑 `fragment_first.xml` 文件，找到 `convertButton` 元素，并如下添加 `onClick` 条目：\n\n\
  ```xml\nandroid:id=\"@+id/convertButton\"\nandroid:layout_width=\"wrap_content\"\
  \nandroid:layout_height=\"wrap_content\"\nandroid:onClick=\"@{() -> myViewModel.convertValue()}\"\
  \nandroid:text=\"@string/convert_text\"\napp:layout_constraintBottom_toBottomOf=\"\
  parent\"\napp:layout_constraintEnd_toEndOf=\"parent\"\napp:layout_constraintHorizontal_bias=\"\
  0.5\"\napp:layout_constraintStart_toStartOf=\"parent\"\napp:layout_constraintTop_toBottomOf=\"\
  @+id/resultText\" />\n```\n\n## 38.10 测试应用\n\n编译并运行应用，测试在美元字段中输入一个值并点击 Convert 按钮是否会在\
  \ `TextView` 上显示正确的结果（连同“euros”后缀），以及在美元字段为空时尝试转换时是否会出现“Enter value”提示。此外，验证用户界面中显示的信息在经过设备旋转后是否仍然得到保留。\n\
  \n## 38.11 总结\n\n本章的主要目标是完成设置项目使用数据绑定的步骤，并演示单向、双向绑定和监听器绑定表达式的使用。本章还提供了一个实用示例，说明了通过结合\
  \ `LiveData` 将用户界面视图与应用的后端数据和逻辑连接起来，可以节省多少代码编写。\n\n## 39. Android ViewModel 状态保存教程\n\
  \n应用状态的保存与恢复关于在应用被置于后台后，为用户提供外观和行为的连续性。用户期望能够从一个应用切换到另一个应用，并在返回原始应用时，发现它正处于切换发生前的完全相同的状态。\n\
  \n正如“理解 Android 应用和 Activity 生命周期”章节所概述的，当用户将应用程序置于后台时，如果资源受限，该应用程序将可能被操作系统终止。当用户尝试返回已终止的应用程序到前台时，Android\
  \ 会在新进程中重新启动该应用。由于这一切对用户是不可见的，因此应用程序有责任将自己恢复到最初被置于后台时的相同状态，而不是以其“初始启动”状态呈现。对于基于\
  \ `ViewModel` 的应用，这许多行为可以通过使用 `ViewModel` Saved State 模块来实现。\n\n## 39.1 理解 ViewModel\
  \ 状态保存\n\n如前几章所述，`ViewModel` 为应用开发带来了许多益处，包括在发生设备旋转等配置更改时恢复 UI 状态。为了看到这一点，运行 `ViewModelDemo`\
  \ 应用（如果你仍需要创建项目，请加载书中附带的 `ViewModelDemo_LiveData` 项目）。\n\n运行时输入一个美元值并将其转换为欧元。旋转设备或模拟器，注意配置更改后两个值仍然可见。\n\
  \n遗憾的是，这种行为并不适用于后台进程的终止。在应用运行时，点击设备主页将 `ViewModelDemo` 应用放入后台，然后通过打开终端窗口并运行以下命令（创建项目时使用的名称，例如\
  \ `com.ebookfrenzy.viewdemo`）：\n\n```\nadb shell kill\n```\n\n如果找不到 `adb` 命令，请参考“设置\
  \ Android 开发环境”章节来设置你的 Android Studio 环境。\n\n应用终止后，返回设备或模拟器从启动器选择应用（不要在 Android\
  \ Studio 内部重新运行应用）。应用出现后，将是刚启动的状态，丢失了最后的美元和欧元值。然而从用户的角度来看，应用是从后台恢复的，并且应该包含原始数据。在这种情况下，应用未能提供用户预期的连续性。\n\
  \n## 39.2 实现 ViewModel 状态保存\n\n基本的 `ViewModel` 状态保存通过引入 `ViewModel` Saved State\
  \ 库实现。该库扩展了 `ViewModel` 类，增加了在后台进程终止并在重新启动后维护状态的支持。\n\n保存的关键在于 `SavedStateHandle`\
  \ 类，它用于保存和恢复视图实例的状态。`SavedStateHandle` 对象包含一个键值映射，允许通过引用相应的键来保存和恢复数据值。\n\n为了支持状态保存，需要声明不同的\
  \ `ViewModel` 子类，此处包含一个可以接收 `SavedStateHandle` 实例的构造函数。一旦声明，可以通过在创建时包含 `SavedStateViewModelFactory`\
  \ 对象来创建此类 `ViewModel` 实例。考虑以下来自标准 `ViewModel` 声明的代码片段：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\
  \nimport androidx.lifecycle.ViewModel;\n\nimport androidx.lifecycle.MutableLiveData;\n\
  \npublic class MainViewModel extends ViewModel {\n\n}\n```\n\n\n\n创建此类实例的代码可能如下所示：\n\
  \n```java\nprivate MainViewModel mViewModel;\n\nmViewModel = new ViewModelProvider(this).get(MainViewModel.class);\n\
  ```\n\n另一方面，设计用于支持保存状态（saved state）的 `ViewModel` 子类需要如下声明：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\
  \nimport android.util.Log;\n\nimport androidx.lifecycle.ViewModel;\nimport androidx.lifecycle.MutableLiveData;\n\
  import androidx.lifecycle.SavedStateHandle;\n\npublic class MainViewModel extends\
  \ ViewModel {\n\n    private SavedStateHandle savedStateHandle;\n\n    public MainViewModel(SavedStateHandle\
  \ savedStateHandle) {\n        this.savedStateHandle = savedStateHandle;\n    }\n\
  \n...\n}\n```\n\n在创建上述 `ViewModel` 实例时，必须按照所示向 `ViewModelProvider` 类的初始化器传递 `SavedStateViewModelFactory`\
  \ 实例：\n\n```java\nSavedStateViewModelFactory factory =\nnew SavedStateViewModelFactory(getActivity().getApplication(),this);\n\
  \nmViewModel = new ViewModelProvider(this).get(MainViewModel.class);\n```\n\n##\
  \ 39.3 保存和恢复状态\n\n可以在 `ViewModel` 内部通过将对象或值传递给 `SavedStateHandle` 实例的 `set()` 方法进行保存，并提供一个在执行检索时引用的键字符串：\n\
  \n```java\nprivate static final String NAME_KEY = \"Customer Name\";\n\nsavedStateHandle.set(NAME_KEY,\
  \ customerName);\n```\n\n当与 `LiveData` 对象一起使用，可以使用 `SavedStateHandle` 实例的 `getLiveData()`\
  \ 方法恢复之前保存的值，再次按照所示引用相应的键：\n\n```java\nMutableLiveData restoredName = savedStateHandle.getLiveData(NAME_KEY);\n\
  ```\n\n要恢复普通（非 `LiveData`）对象，请使用 `SavedStateHandle` 的 `get()` 方法：\n\n```java\nString\
  \ restoredName = savedStateHandle.get(NAME_KEY);\n```\n\n其他有用的 `SavedStateHandle`\
  \ 方法包括：\n\n- `contains(String key)` - 返回一个布尔值，表示保存的状态是否包含指定键的值。\n- `remove(String\
  \ key)` - 从保存的状态中移除该值和键。返回返回被移除的值。\n- `keys()` - 返回一个包含保存状态中所有键的字符串集合。\n\n## 39.4\
  \ 为 ViewModelDemo 项目添加保存状态支持\n\n在涵盖了 `ViewModel` 保存状态的基础后，可以扩展 `ViewModelDemo` 应用以包含此支持。首先，将“一个\
  \ Android Jetpack LiveData 教程”中创建的 `ViewModelDemo_LiveData` 项目加载到 Android Studio（示例代码下载中也有该项目的副本）。\n\
  \n接下来，修改 `MainViewModel.java` 文件，使构造函数接受并存储 `SavedStateHandle` 实例。此外，导入 `androidx.lifecycle.SavedStateHandle`，声明一个键字符串常量，并修改结果\
  \ `LiveData` 变量，以便值现在从构造函数中的保存状态中获取：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\
  \nimport androidx.lifecycle.ViewModel;\nimport androidx.lifecycle.MutableLiveData;\n\
  import androidx.lifecycle.SavedStateHandle;\n\npublic class MainViewModel extends\
  \ ViewModel {\n\n    private static final String RESULT_KEY = \"Euro Value\";\n\n\
  \    private static final Float rate = 0.74F;\n\n    private String dollarText =\
  \ \"\";\n\n    final private SavedStateHandle savedStateHandle;\n\n    final private\
  \ MutableLiveData result = new MutableLiveData<>();\n\n    public MainViewModel(SavedStateHandle\
  \ savedStateHandle) {\n        this.savedStateHandle = savedStateHandle;\n     \
  \   result = savedStateHandle.getLiveData(RESULT_KEY);\n    }\n\n...\n}\n```\n\n\
  继续留在 `MainViewModel.java` 文件中，修改 `setAmount()` 方法，包含在每次计算新的欧元金额时保存结果值的代码：\n\n```java\n\
  public void setAmount(String value) {\n    this.dollarText = value;\n    result.setValue(Float.valueOf(dollarText)*\
  \ rate);\n    Float convertedValue = Float.parseFloat(dollarText)* rate;\n    result.setValue(convertedValue);\n\
  \    savedStateHandle.set(RESULT_KEY, convertedValue);\n}\n```\n\n完成对 `ViewModel`\
  \ 的更改后，打开 `FirstFragment.java` 文件进行以下更改，以便在 `ViewModel` 创建过程中包含一个 Saved State 工厂实例：\n\
  \n```java\n..\n\nimport androidx.lifecycle.SavedStateViewModelFactory;\n\n..\n\n\
  @Override\npublic void onCreate(@Nullable Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    SavedStateViewModelFactory factory =\n    new SavedStateViewModelFactory(\n\
  \    getActivity().getApplication(),this);\n    mViewModel = new ViewModelProvider(this,\
  \ factory).get(MainViewModel.class);\n    // TODO: Use the ViewModel\n}\n```\n\n\
  当屏幕 UI 显示了美元和欧元值后，将应用置于后台，使用 `adb` 工具终止它，然后从设备或模拟器屏幕重新启动它。重启后，之前的货币金额仍然显示在 `TextView`\
  \ 和 `EditText` 组件中，这证实了状态已成功保存并恢复。\n\n## 39.5 总结\n\n一个良好的应用程序在从后台返回前台时，应该始终向用户呈现相同的状态，无论操作系统在此期间是否终止了包含应用的进程。在处理\
  \ `ViewModels` 时，可以通过利用 `ViewModel` 保存状态模块来实现这一点。这涉及修改 `ViewModel` 构造函数以接受 `SavedStateHandle`\
  \ 实例，该实例反过来可以通过一系列方法调用来保存和恢复数据。当 `ViewModel` 实例创建时，必须向其传递 `SavedStateViewModelFactory`\
  \ 实例。一旦实现了这些步骤，应用程序在终止期间会自动保存和恢复状态。\n\n## 40. 与 Android 生命周期感知组件协作\n\n早期的章节“理解 Android\
  \ 应用和 Activity 生命周期”描述了使用生命周期方法跟踪 UI 控制器（如 Activity 或 Fragment）内部生命状态的变化。这些方法的主要问题之一是将处理生命变化的负担放在了\
  \ UI 控制器上。从表面上看，这似乎是逻辑方法，因为 UI 控制器毕竟是经历状态变化的对象。然而，事实是受状态变化影响的代码通常位于应用中的其他类中。这导致\
  \ UI 控制器中出现了需要根据响应管理其他对象的复杂代码。\n\n一种更清晰、更有逻辑的方法是应用中的对象能够观察其他对象的生命状态，并负责根据变化采取任何行动。例如，负责跟踪用户位置的类可以观察\
  \ UI 控制器的生命状态，并在控制器进入暂停状态时挂起位置更新。当控制器进入恢复状态时，重新开始跟踪。这可以通过 Android 架构组件自带的 Lifecycle\
  \ 包提供的类和接口实现。\n\n本章将介绍构建生命周期感知到 Android 应用中的术语和关键组件。\n\n## 40.1 生命周期感知\n\n## 40.2\
  \ 生命周期所有者\n\n\n\n\n\n生命感知组件只能观察生命周期所有者的对象状态。生命周期所有者实现了 `LifecycleOwner` 接口，并分配了一个关联的\
  \ `Lifecycle` 对象，负责存储组件的当前状态并向生命周期观察者提供状态信息。大多数 Android 框架组件（如 activity 和 fragment\
  \ 类）都是生命周期所有者。自定义类也可以使用 `LifecycleRegistry` 类并实现 `LifecycleObserver` 接口来配置为生命周期所有者。例如：\n\
  \n```java\npublic class SampleOwner implements LifecycleOwner {\n\n    private LifecycleRegistry\
  \ lifecycleRegistry;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        .\n        .\n       \
  \ lifecycleRegistry = new LifecycleRegistry(this);\n    }\n\n    @NonNull\n    @Override\n\
  \    public Lifecycle getLifecycle() {\n        return lifecycleRegistry;\n    }\n\
  }\n```\n\n除非生命周期所有者是生命感知组件的子类，否则该类需要通过调用 `LifecycleRegistry` 类的方法来触发生命周期状态变化。可以使用\
  \ `markState()` 方法通过传递新的状态值来触发生命周期状态变化：\n\n```java\npublic void resuming() {\n \
  \   lifecycleRegistry.markState(Lifecycle.State.RESUMED);\n}\n```\n\n上面的调用将导致对相应的事件处理程序的调用。或者，可以调用\
  \ `LifecycleRegistry.handleLifecycleEvent()` 方法并传递要触发的生命周期事件（这将导致生命周期状态改变）。例如：\n\
  \n```java\nlifecycleRegistry.handleLifecycleEvent(Lifecycle.Event.ON_START);\n```\n\
  \n## 40.3 生命周期周期观察者 (Lifecycle Observers)\n\n为了观察生命周期所有者的状态，生命感知组件必须实现 `DefaultLifecycleObserver`\
  \ 接口，并覆盖它需要观察的任何生命周期变化事件的方法。\n\n```java\npublic class SampleObserver implements\
  \ DefaultLifecycleObserver {\n    // 生命周期事件方法重写写在这里\n}\n```\n\n然后创建此观察者类的实例并将其添加到由\
  \ `Lifecycle` 对象维护的观察者列表中。\n\n```java\ngetLifecycle().addObserver(new SampleObserver());\n\
  ```\n\n如果观察者不再需要跟踪生命周期状态，可以随时从 `Lifecycle` 对象中移除。\n\n图 40-1 展示了提供生命感知能力的关键元素之间的关系。\n\
  \n![image-OQ2GYDWO.jpg](img/image-OQ2GYDWO.jpeg)\n\n图 40-1\n\n## 40.4 生命周期状态与事件\
  \ (Lifecycle States and Events)\n\n当生命周期所有者的状态发生时，分配的 `Lifecycle` 对象将更新为新状态。在任何时刻，生命周期所有者都处于以下五个状态之一：\n\
  \n- `Lifecycle.State.INITIALIZED`\n- `Lifecycle.State.CREATED`\n- `Lifecycle.State.STARTED`\n\
  - `Lifecycle.State.RESUMED`\n- `Lifecycle.State.DESTROYED`\n\n当组件通过不同的状态转换时，`Lifecycle`\
  \ 对象将会在添加到列表的任何观察者上触发事件。在生命周期观察者内部，可以重写以下事件方法：\n\n- `onCreate()`\n- `onResume()`\n\
  - `onPause()`\n- `onStop()`\n- `onStart()`\n- `onDestroy()`\n\n例如，以下代码重写了 `DefaultLifecycleObserver.onResume()`\
  \ 方法：\n\n```java\n@Override\npublic void onResume(@NonNull LifecycleOwner owner)\
  \ {\n    // 执行响应 Resume 状态事件的任务\n}\n```\n\n图 40-2 中的流程图说明了生命周期所有者的状态变化序列，以及每次状态转换之间触发观察者上的生命周期事件：\n\
  \n![image-B4LU1I2T.jpg](img/image-B4LU1I2T.jpeg)\n\n图 40-2\n\n## 40.5 总结 (Summary)\n\
  \n本章介绍了生命感知的基础知识以及 Android Jetpack 中包含的 Android Lifecycle 包类和接口。该包包含了用于创建生命周期所有者、观察者和生命感知组件的多个类和接口。生命周期所有者分配了一个\
  \ `Lifecycle` 对象，该对象维护所有者的状态记录和订阅观察者列表。当所有者的状态变化时，通过生命周期事件方法通知观察者以响应变化。\n\n下一章将创建一个\
  \ Android Studio 项目，演示如何使用和创建生命感知组件，包括创建生命周期观察者和所有者，以及处理生命周期状态变化和事件。\n\n## 41. Android\
  \ Jetpack 生命周期感知教程\n\n上一章概述了生命感知知识，并列出了使在 Android 应用项目中实现此特点的关键类和接口。本章将在此知识的基础上，通过构建一个\
  \ Android Studio 项目来突出生命感知实际应用。\n\n## 41.1 创建示例生命周期项目\n\n从欢迎界面选择“New Project”快速启动选项，在出现的新项目对话框中，在点击“Next”按钮之前选择“Empty\
  \ Views Activity”模板。\n\n在 `Name` 字段中输入 `LifecycleDemo`，并指定 `com.ebookfrenzy.lifecycledemo`\
  \ 为包名。在点击“Finish”按钮之前，将最小 API 级别设置更改为 `API 26: Android 8.0 (Oreo)`，并将语言菜单设置为 Java。\n\
  \n## 41.2 创建生命周期观察者\n\n正如之前讨论的，activity 和 fragment 实现了 `LifecycleOwner` 接口，并准备好被其他对象观察。为了在实践中看到这一点，本教程的下一步是在项目中添加一个新类，该类能够观察\
  \ `MainActivity` 实例。\n\n要添加新类，右键点击 `app` -> `java` -> `com.ebookfrenzy.lifecycledemo`，选择\
  \ `New -> Java Class`。在 New Class 对话框中，将类命名为 `DemoObserver` 并按回车键创建 `DemoObserver.java`\
  \ 文件。该文件应会在编辑器中打开，内容如下：\n\n```java\npackage com.ebookfrenzy.lifecycledemo\npublic\
  \ class DemoObserver {\n}\n```\n\n留在编辑器中，修改类文件声明它实现 `DefaultLifecycleObserver` 接口：\n\
  \n```java\npackage com.ebookfrenzy.lifecycledemo;\nimport androidx.lifecycle.DefaultLifecycleObserver;\n\
  public class DemoObserver {\n}\n```\n\n下一步是重写 `DefaultLifecycleObserver` 类的方法。在本示例中，所有事件将被处理，并向\
  \ Logcat 面板输出消息。按照以下列表更新观察者类：\n\n```java\npackage com.ebookfrenzy.lifecycledemo;\n\
  \nimport android.util.Log;\nimport androidx.annotation.NonNull;\nimport androidx.lifecycle.LifecycleOwner;\n\
  .\n\npublic class DemoObserver implements DefaultLifecycleObserver {\n\n    private\
  \ String LOG_TAG = \"DemoObserver\";\n\n    @Override\n    public void onCreate(@NonNull\
  \ LifecycleOwner owner) {\n        Log.i(LOG_TAG, \"onCreate\");\n    }\n\n    @Override\n\
  \    public void onResume(@NonNull LifecycleOwner owner) {\n        Log.i(LOG_TAG,\
  \ \"onResume\");\n    }\n\n    @Override\n    public void onPause(@NonNull LifecycleOwner\
  \ owner) {\n        Log.i(LOG_TAG, \"onPause\");\n    }\n\n    @Override\n    public\
  \ void onStart(@NonNull LifecycleOwner owner) {\n        Log.i(LOG_TAG, \"onStart\"\
  );\n    }\n\n    @Override\n    public void onStop(@NonNull LifecycleOwner owner)\
  \ {\n        Log.i(LOG_TAG, \"onStop\");\n    }\n\n    @Override\n    public void\
  \ onDestroy(@NonNull LifecycleOwner owner) {\n        Log.i(LOG_TAG, \"onDestroy\"\
  );\n    }\n}\n```\n\n完成 `DemoObserver` 类后，下一步是将其作为观察者添加到 `MainActivity` 类中。\n\n\
  ## 41.3 添加观察者\n\n观察者通过调用所有者 `Lifecycle` 对象的 `addObserver()` 方法添加到生命周期所有者中，该对象的引用通过调用\
  \ `getLifecycle()` 方法获取。编辑 `MainActivity.java` 类文件并编辑 `onCreate()` 方法以添加观察者：\n\n\
  ```java\n@Override\nprotected void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    .\n    .\n}\n```\n\n\n\n\n\n```\ngetLifecycle().addObserver(new DemoObserver());\n\
  \n}\n```\n\n一旦创建了观察者类并将其添加到生命周期所有者的 `Lifecycle` 对象中，App 就可以测试了。\n\n## 41.4 测试观察者\n\
  \n由于 `DemoObserver` 类向 Logcat 控制台输出诊断信息，因此如果配置了过滤器仅显示 `DemoObserver` 消息，将更容易看到输出。按照前文在“通过示例说明\
  \ Android Activity 状态更改”中列出的步骤，显示 Logcat 面板并在过滤器字段中输入以下内容：\n\n`package:mine tag:DemoObserver`\n\
  \n当 App 成功启动后，Logcat 输出应指示以下生命周期状态变化和事件：\n\n- `onCreate`\n- `onStart`\n- `onResume`\n\
  \n在 App 仍在运行时，执行设备旋转以触发 Activity 的销毁和重建，这将生成以下额外的输出：\n\n- `onPause`\n- `onStop`\n\
  - `onDestroy`\n- `onCreate`\n- `onStart`\n- `onResume`\n\n在进入本章的下一节之前，请花些时间将 App\
  \ 的输出与上一章图 40-2 中的流程图进行对比。\n\n## 41.5 创建生命周期所有者\n\n本章的最后一个任务是创建一个自定义的生命周期所有者类，并演示如何在类内部触发事件并修改生命周期状态。\n\
  \n在 Project 工具窗口中右键点击 app -> `java` -> `com.ebookfrenzy.lifecycledemo` 项，并选择 `New`\
  \ -> `Java Class...` 菜单选项添加新类。在 `Create Class` 对话框中按回车键之前将类命名为 `DemoOwner`。加载新的\
  \ `DemoOwner.java` 文件到代码编辑器后，对其进行如下修改：\n\n```java\npackage com.ebookfrenzy.lifecycledemo;\n\
  \nimport androidx.lifecycle.Lifecycle;\nimport androidx.lifecycle.LifecycleOwner;\n\
  import androidx.lifecycle.LifecycleRegistry;\nimport androidx.annotation.NonNull;\n\
  \npublic class DemoOwner implements LifecycleOwner {\n\n}\n```\n\n该类需要一个 `LifecycleRegistry`\
  \ 实例，该实例通过引用自身初始化，并配置 `getLifecycle()` 方法返回该 `LifecycleRegistry` 实例。声明一个变量来存储 `LifecycleRegistry`\
  \ 引用，并编写一个构造函数来初始化 `LifecycleRegistry` 实例：\n\n```java\npublic class DemoOwner implements\
  \ LifecycleOwner {\n\n    private final LifecycleRegistry lifecycleRegistry;\n\n\
  \    public DemoOwner() {\n        lifecycleRegistry = new LifecycleRegistry(this);\n\
  \    }\n\n    @NonNull\n    @Override\n    public Lifecycle getLifecycle() {\n \
  \       return lifecycleRegistry;\n    }\n}\n```\n\n接下来，该类必须通知注册表生命周期状态的变化。这可以通过\
  \ `LifecycleRegistry` 对象的 `markState()` 方法标记状态，或者通过 `handleLifecycleEvent()` 方法触发生命周期事件来实现。自定义类中什么构成状态更改取决于类的用途。对于此示例，我们将添加一些在调用时会触发生命周期事件的方法：\n\
  \n```\n.\n.\nprivate final LifecycleRegistry lifecycleRegistry;\n.\n.\npublic void\
  \ startOwner() {\n    lifecycleRegistry.handleLifecycleEvent(Lifecycle.Event.ON_START);\n\
  }\n\npublic void stopOwner() {\n    lifecycleRegistry.handleLifecycleEvent(Lifecycle.Event.ON_STOP);\n\
  }\n\n@NonNull\n@Override\npublic Lifecycle getLifecycle() {\n    return lifecycleRegistry;\n\
  }\n.\n.\n```\n\n`DemoOwner` 类中的最后一个更改是将 `DemoObserver` 类作为观察者添加。此调用通过向类构造函数添加以下内容来实现：\n\
  \n```java\npublic DemoOwner() {\n    lifecycleRegistry = new LifecycleRegistry(this);\n\
  \    getLifecycle().addObserver(new DemoObserver());\n}\n```\n\n将 `MainActivity.java`\
  \ 文件加载到代码编辑器，找到 `onCreate()` 方法，并添加代码创建 `DemoOwner` 类的实例并调用 `startOwner()` 和 `stopOwner()`\
  \ 方法。请注意，添加 `DemoObserver` 作为观察者的调用已被移除。虽然单个观察者可以与多个所有者一起使用，在本情况下移除它是为了避免在 Logcat\
  \ 工具窗口中产生重复且混淆的输出：\n\n```\n.\n.\nprivate DemoOwner demoOwner;\n\n@Override\nprotected\
  \ void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    getLifecycle().addObserver(new DemoObserver());\n    demoOwner = new DemoOwner();\n\
  \    demoOwner.startOwner();\n    demoOwner.stopOwner();\n}\n```\n\n## 41.6 测试自定义生命周期所有者\n\
  \n最后一次构建并运行 App，参考 Logcat 工具窗口，并确认观察者按以下顺序检测到创建、启动和停止生命周期事件：\n\n- `onCreate`\n-\
  \ `onStart`\n- `onStop`\n\n注意，尽管没有在 `DemoOwner` 类中添加代码来手动执行此操作，“创建”状态更改仍被触发了。这些是在所有者实例首次创建以及处理\
  \ `ON_STOP` 事件时自动触发的。\n\n## 41.7 总结\n\n本章提供了在 Android App 中实现生命周期感知的实际演示，包括创建生命周期观察者以及设计和实现基础的生命周期所有者类。\n\
  \n## 42. 导航架构组件（Navigation Architecture Component）概述\n\n如今很少有 Android App 仅由单个屏幕组成。事实上，大多数\
  \ App 包含多个屏幕，用户通过屏幕手势、按钮点击和菜单选择在这些屏幕之间进行导航。在引入 Android Jetpack 之前，在 App 中实现导航在很大程度上是一个手动编码过程，没有简单的方法来查看和组织可能复杂的导航路径。然而，随着导航架构组件的引入以及对导航图的支持，这种情况已经得到了极大改善。\n\
  \n## 42.1 理解导航\n\n每个 App 都有一个主屏幕，它在 App 启动以及任何启动页（splash screen，即 App 加载时临时显示的品牌屏幕）之后出现。用户通常从此主屏幕执行任务，导致出现其他屏幕。这些屏幕通常以\
  \ App 内其他 Activity 和 Fragment 的形式存在。例如，一个消息 App 可能有一个列出消息的主屏幕，用户可以那里导航到联系人列表或设置屏幕。联系人列表屏幕可能允许用户导航到添加新用户或更新现有联系人的屏幕。从图上上看，App\
  \ 的导航图如图 42-1 所示：\n\n![image-B9NMCX99.jpg](img/image-B9NMCX99.jpeg)\n\n此 组成 App\
  \ 的每个屏幕（包括主屏幕）被称为目的地，通常是一个 Fragment 或 Activity。Android 导航架构使用导航栈跟踪用户在 App 内目的地之间的路径。当\
  \ App 首次启动时，主屏幕是第一个放入栈的目的地并成为当前目的地。当用户导航到另一个目的地时，该屏幕成为当前目的地并推入栈中。当用户导航到其他屏幕时，它们也会被推入栈。图\
  \ 42-2 显示了假设性消息 App 在用户启动 App 并导航到“添加联系人”屏幕时导航栈的当前状态：\n\n![image-29ZHPEBU.jpg](img/image-29ZHPEBU.jpeg)\n\
  \n图 42-2\n\n当用户使用系统返回键导航回屏幕时，每个目的地都会从栈中弹出，直到主屏幕再次成为栈上的唯一目的地。在图 42-3 中，用户从添加联系人屏幕返回，将其从栈中弹出并使联系人列表屏幕成为当前目的地：\n\
  \n![image-BTHNXIXQ.jpg](img/image-BTHNXIXQ.jpeg)\n\n图 42-3\n\n在目的地之间导航和管理导航栈的所有工作都由导航控制器处理，由\
  \ `NavController` 类表示。\n\n\n\n\n使用 Navigation 架构组件为 Android 项目添加导航是一个直观的过程，涉及导航宿主（navigation\
  \ host）、导航图（navigation graph）、导航动作（navigation actions）以及少量的代码编写，以获取并交互导航控制器（navigation\
  \ controller）实例。\n\n## 42.2 声明导航主机\n\n导航主机是一个嵌入到 Activity 用户界面布局中的特殊片段（`NavHostFragment`），作为用户进行导航的目标地的占位符。例如，图\
  \ 42-4 显示了一个典型的 Activity 屏幕，并突出了由导航主机片段表示的区域：\n\n![image-X5SHPY0F.jpg](img/image-X5SHPY0F.jpeg)\n\
  \n图 42-4\n\n可以在 Android Studio 布局编辑器中通过从调面板的容器（Containers）部分拖放实例，或者通过如下方式手动编辑 XML，将\
  \ `NavHostFragment` 放置在 Activity 布局中：\n\n```xml\nxmlnsmx:app=\"http://schemas.android.com/apk/res-auto\"\
  \nxmlns:tools=\"http://schemas.android.com/tools\"\nandroid:id=\"@+id/container\"\
  \nandroid:layout_width=\"match_parent\"\nandroid:layout_height=\"match_parent\"\n\
  tools:context=\".MainActivity\" >\n\n<fragment\nandroid:id=\"@+id/demo_nav_host_fragment\"\
  \nandroid:name=\"androidx.navigation.fragment.NavHostFragment\"\nandroid:layout_width=\"\
  match_parent\"\nandroid:layout_height=\"match_parent\"\napp:defaultNavHost=\"true\"\
  \napp:navGraph=\"@navigation/navigation_graph\" />\n```\n\n上述导航主机片段元素中注意的点是：`name`\
  \ 属性中对 `NavHostFragment` 的引用、将 `defaultNavHost` 设置为 true，以及将包含包含导航图的文件分配给 `navGraph`\
  \ 属性。\n\n当 Activity 启动时，此导航主机片段将被导航图中指定的首页目的地所替换。当用户在应用屏幕之间进行导航时，宿主片段将被对应目的地的片段所替换。\n\
  \n## 42.3 导航图\n\n导航图是一个 XML 文件，包含了包含在应用导航中的目的地。除了这些目的地外，文件还包含定义目的地之间导航的导航动作，以及用于从一个目的地传递数据到另一个目的地的可选参数。Android\
  \ Studio 包含一个导航图编辑器，可以使用可视化方式或手动编辑 XML 来设计图表并实现动作。\n\n图 42-5 显示了设计模式下的 Android Studio\
  \ 导航图编辑器：\n\n![image-YN42QV8E.jpg](img/image-YN42QV8E.jpeg)\n\n图 42-5\n\n目的地列表 (A)\
  \ 列出了图表中的所有目的地。从列表中选择一个目的地将定位并选中图中的相应目的地（这对于在大型图中定位特定目的地特别有用）。导航图面板 (B) 包含每个目的地的对话框，代表代表用户界面布局。在例例中，此图表包含两个名为\
  \ `mainFragment` 和 `secondFragment` 的目的地。目的地之间的箭头 (C) 代表导航动作连接。可以通过将鼠标指针悬停在源地的边缘直到出现圆圈，然后从圆圈点击并拖动到目的地来添加动作。属性面板\
  \ (D) 允许查看和修改当前所选目的地或动作连接的属性。在上面的图中，显示了动作的属性。通过点击标记为 E 的按钮并从菜单中选择选项来添加新目的地。可以选择将现有的片段或\
  \ Activity 作为目的地，或创建新的空白片段目的地。组件树面板 (F) 提供了导航图的分级概述。\n\n可以通过将编辑器切换到代码模式来查看和修改导航图的底层\
  \ XML。接下来的 XML 列表代表了上图 42-5 所示目的地和动作连接的导航图：\n\n```xml\nxmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \nxmlns:tools=\"http://schemas.android.com/tools\"\nandroid:id=\"@+id/navigation_graph\"\
  \napp:startDestination=\"@id/mainFragment\">\n\n<fragment\nandroid:id=\"@+id/mainFragment\"\
  \nandroid:name=\"com.ebookfrenzy.navigationdemo.ui.main.MainFragment\"\nandroid:label=\"\
  fragment_main\"\ntools:layout=\"@layout/fragment_main\" >\n    <action\n    android:id=\"\
  @+id/mainToSecond\"\n    app:destination=\"@id/secondFragment\" />\n</fragment>\n\
  \n<fragment\nandroid:id=\"@+id/secondFragment\"\nandroid:name=\"com.ebookfrenzy.navigationdemo.SecondFragment\"\
  \nandroid:label=\"fragment_second\"\ntools:layout=\"@layout/fragment_second\" >\n\
  ```\n\n导航图也可以拆分到多个文件中以改进组织结构并促进重用。当这样结构化时，嵌套图会被嵌入到根图中。要创建嵌套图，按住 Shift 点击要嵌套的目的，右键点击第一个目的地并选择“移动到嵌套图\
  \ -> 新图”（Move to Nested Graph -> New Graph）菜单选项。嵌套图将作为图中的新节点出现。双击嵌套图节点将图文件加载到编辑器中访问嵌套图。\n\
  \n## 42.4 访问导航控制器\n\n从一个目的地导航到另一个目的地通常是响应应用内的事件的，例如按钮点击或菜单选择。在触发导航动作之前，代码必须先获取导航控制器实例的引用。这需要调用\
  \ `Navigation` 或 `NavHostFragment` 类的 `findNavController()` 方法。例如，下面的代码可以访问 Activity\
  \ 的导航控制器。注意，为了使代码工作，Activity 必须包含一个导航主机片段：\n\n```java\nNavController controller\
  \ = Navigation.findNavController(activity, R.id.nav_host_fragment);\n```\n\n在这种情况下，方法调用传递了\
  \ Activity 的引用和嵌入 Activity 布局中的导航主机 ID。\n\n或者，可以通过将任何视图传递给方法来标识与视图关联的导航控制器：\n\n\
  ```java\nNavController controller = Navigation.findNavController(binding.button);\n\
  ```\n\n最后一种选项通过调用 `NavHostFragment` 类的 `findNavController()` 方法查找片段的导航控制器：\n\n```java\n\
  NavController controller = NavHostFragment.findNavController(fragment);\n```\n\n\
  ## 42.5 触发导航动作\n\n找到导航控制器后，通过调用控制器的 `navigate()` 方法并传递要执行动作的资源 ID 来触发导航动作。例如：\n\n\
  ```java\ncontroller.navigate(R.id.goToContactsList);\n```\n\n动作的 ID 在选择动作连接时定义在导航图编辑器的属性面板中。\n\
  \n### 42.6 传递参数\n\n可以使用导航图文件中定义的参数从一个目的地传递到另一个目的地。参数由名称、类型和可选默认值组成，可以在 XML 中手动添加，也可以在图中选择动作箭头或目的地时使用属性面板添加。在图\
  \ 42-6 中，声明了一个名为 `contactsCount` 的整数参数，其默认值为 0：\n\n![image-CUWAM5CQ.jpg](img/image-CUWAM5CQ.jpeg)\n\
  \n图 42-6\n\n一旦添加，参数将放置在接收目的地的 XML 元素元素，例如：\n\n```xml\n<fragment\nandroid:id=\"@+id/secondFragment\"\
  \nandroid:name=\"com.ebookfrenzy.navigationdemo.SecondFragment\"\nandroid:label=\"\
  fragment_second\"\ntools:layout=\"@layout/fragment_second\" >\n    <argument\n \
  \       android:name=\"contactsCount\"\n        android:defaultValue=\"0\"\n   \
  \     app:type=\"integer\" />\n</fragment>\n```\n\n\n\n\n导航架构组件（Navigation Architecture\
  \ Component）提供了两种在目的地之间传递数据的技术。一种方法是将数据放入 `Bundle` 对象中，并在操作（action）期间将其传递给目的地，然后在那里对其进行解包并提取参数。\n\
  \n这种特定方法的主要缺点是它不是“类型安全的”。换句话说，如果接收端目的地对参数的处理类型与其声明的类型不同（例如，将字符串视为整数），编译器将不会捕获此错误，并且很可能在运行时引发问题。\n\
  \n更好的选择（也是本书所采用的方法）是 `safeargs`。`safeargs` 是适用于 Android Studio Gradle 构建系统的插件，它能够自动生成特殊类，允许以类型安全的方式传递参数。`safeargs`\
  \ 的参数传递方法将在下一章（《Android Jetpack 导航组件实教程》）中进行描述和演示。\n\n## 42.7 总结\n\nAndroid 应用程序用户界面中的导航是指用户在不同屏幕之间来回移动的能力。过去这种实现方式非常耗时且难以组织，而现在\
  \ Android Studio 和导航架构组件使得在 Android 应用项目中实现和管理导航变得更加简单。\n\n应用中的不同屏幕被称为 `destinations`（目的地），通常由片段（fragments）或活动（activities）表示。所有应用都有一个首页目的地，包括应用首次加载时显示的屏幕。该布局的内容区域被导航主机片段（navigation\
  \ host fragment）取代，当用户导航应用时，它会被其他目的地片段片段。导航路径由导航图文件定义，该文件由目的地以及连接它们的操作组成，以及需要在目的地之间传递的任何参数。导航由导航控制器（navigation\
  \ controllers）处理，它们除了管理导航栈外，还提供了从应用代码内部启动导航操作的方法。\n\n## 43. Android Jetpack 导航组件实教程\n\
  \n上一章描述了 Android Jetpack 导航组件以及它如何与 Android Studio 的导航图表功能集成，为在 Android 应用的屏幕之间实现导航提供简单的方法。在本章中，将创建一个新的\
  \ Android Studio 项目，使用这些导航功能实现一个包含多个屏幕的示例应用。除了演示 Android Studio 导航图编辑器的用法外，示例项目还将实现使用类型安全参数在源屏幕和目的地屏幕之间传递数据。\n\
  \n## 43.1 创建 NavigationDemo 项目\n\n从欢迎界面选择“New Project”（新建项目）选项，在弹出的新项目对话框中，点击“Next”（下一步）按钮之前选择“Empty\
  \ Views Activity”模板。\n\n在 `Name`（名称）字段中输入 `NavigationDemo` 并指定 `com.ebookfrenzy.navigationdemo`\
  \ 为包名。在点击“Finish”（完成）按钮之前，将“Minimum API level”（最低 API 级别）设置改为 `API 26`：Android 8.0\
  \ (Oreo)，并将语言菜单设置为 `Java`。\n\n## 43.2 向构建配置中添加导航\n\n新的 Empty Views Activity 项目默认不会在构建配置文件中包含导航组件库。接一步是将导航库添加到构建配置中。首先从编辑\
  \ `Gradle Scripts -> libs.version.toml` 文件开始，并按如下方式对其修改（请注意，现在可能有更新版本的库）：\n\n```toml\n\
  [versions]\n.\n.\nnavigationFragment = \"2.8.3\"\n\n[libraries]\n.\n.\nandroidx-navigation-fragment\
  \ = { group = \"androidx.navigation\", name = \"navigation-fragment\", version.ref\
  \ = \"navigationFragment\" }\n```\n\n接下来，打开 `Gradle Scripts -> build.gradle.kts\
  \ (Module: app)` 文件，并在 `dependencies` 部分添加以下指令。此外，借此机会为此模块启用视图绑定（view binding）：\n\
  \n```kotlin\nandroid {\n    buildFeatures {\n        viewBinding = true\n    }\n\
  }\n.\n.\ndependencies {\n    implementation(libs.androidx.navigation.fragment)\n\
  }\n```\n\n在文件中添加导航依赖后，点击“Sync Now”（立即同步）链接以重新同步项目的构建配置。\n\n## 43.3 创建导航图资源文件\n\n\
  在构建配置中添加了导航库后，现在可以将导航图资源文件添加到项目中了。正如“导航架构组件概述”所述，这是一个 XML 文件，包含了用户将能够在其中导航的片段和活动，以及执行切换的操作以及在在之间之间传递的任何数据。\n\
  \n在 Project（项目）工具窗口中，找到 `res` 文件夹（`app -> res`），右键点击它，并选择 `New -> Android Resource\
  \ File` 菜单选项：\n\n![image-S3L978IS.jpg](img/image-S3L978IS.jpeg)\n\n图 43-1\n\n在选择了该菜单项后，将出现\
  \ New Resource File 对话框。在此对话框中，将文件命名为 `navigation_graph`，并在点击 OK 按钮创建文件之前，如图 43-2\
  \ 所示将 Resource type（资源类型）菜单更改为 `Navigation`。\n\n![image-TJLZKUS5.jpg](img/image-TJLZKUS5.jpeg)\n\
  \n图 43-2\n\n导航图资源文件添加到项目后，它将出现在主面板中，准备好添加新的目的地。在添加任何目的地之前，将编辑器切换到 Code 模式并检查图表的\
  \ XML：\n\n```xml\nxmlns:app=\"http://schemas.android.com/apk/res-auto\"\nandroid:id=\"\
  @+id/navigation_graph\">\n```\n\n将编辑器切换回 Design（设计）模式，并注意 Destinations（目的地）面板的 Host（主机）部分指示项目内未检测到导航主机片段：\n\
  \n![image-KFSDUFYK.jpg](img/image-KFSDUFYK.jpeg)\n\n图 43-3\n\n在向导航图添加任何目的地之前，下一步是向项目添加导航主机片段。\n\
  \n## 43.4 声明导航主机\n\n对于本项目，导航主机片段将包含在主活动的用户界面布局中。首先，在 Project 工具窗口中找到主布局文件（`app ->\
  \ res -> layout -> activity_main.xml`），将其加载到布局编辑器并删除默认的 `TextView` 组件。\n\n在 Design\
  \ 模式下，从 Palette（调色板）的 Containers 部分拖入 `NavHostFragment` 元素，并放置在活动布局的容器区域，如图 43-4\
  \ 中的箭头所示：\n\n![image-39S7IJXH.jpg](img/image-39S7IJXH.jpeg)\n\n图 43-4\n\n从弹出的 Navigation\
  \ Graphs 对话框中选择之前创建的 `navigation_graph` 文件并点击 OK 按钮。\n\n在布局中选中新添加的 NavHostFragment\
  \ 实例，使用 Attributes 工具窗口将元素的 ID 更改为 `demo_nav_host_fragment`，然后点击 Infer constraints\
  \ 按钮。\n\n将布局编辑器切换到 Code 模式并查看 XML 文件。注意编辑器正确配置了 `navigation graph` 属性以引用 `navigation_graph.xml`\
  \ 文件，并且 `defaultNavHost` 属性已设置为 true：\n\n```xml\nxmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \nxmlns:app=\"http://schemas.android.com/apk/res-auto\"\nxmlns:tools=\"http://schemas.android.com/tools\"\
  \nandroid:layout_width=\"match_parent\"\nandroid:layout_height=\"match_parent\"\n\
  tools:context=\".MainActivity\">\n\nandroid:id=\"@+id/demo_nav_host_fragment\"\n\
  android:name=\"androidx.navigation.fragment.NavHostFragment\"\nandroid:layout_width=\"\
  409dp\"\nandroid:layout_height=\"729dp\"\napp:defaultNavHost=\"true\"\napp:layout_constraintBottom_toBottomOf=\"\
  parent\"\napp:layout_constraintEnd_toEndOf=\"parent\"\napp:layout_constraintStart_toStartOf=\"\
  parent\"\napp:layout_constraintTop_toTopOf=\"parent\"\napp:navGraph=\"@navigation/navigation_graph\"\
  \ />\n```\n\n\n\n返回 `navigation_graph.xml` 文件并确认 `NavHostFragment` 实例已检测到（在更改生效之前，可能需要关闭并重新打开文件）：\n\
  \n![image-RUB0C0KQ.jpg](img/image-RUB0C0KQ.jpeg)\n图 43-5\n\n## 43.5 添加导航目的地\n\n\
  继续停留在导航图中，现在是时候添加第一个目的地了。点击图 43-6 所示的新目的地按钮来选择或创建目的地：\n\n![image-VG5T7CV8.jpg](img/image-VG5T7CV8.jpeg)\n\
  图 43-6\n\n接下来，从菜单中选择 `Create new destination`（创建新目的地）选项。在弹出的对话框中，选择 `Fragment (Blank)`\
  \ 模板，将新 fragment 命名为 `FirstFragment`，并将布局命名为 `fragment_first`，然后点击 `Finish` 按钮。在项目重新构建的短暂等待后，新\
  \ fragment 将作为目的地出现在图中，如图 43-7 所示：\n\n![image-JOMEIUPG.jpg](img/image-JOMEIUPG.jpeg)\n\
  图 43-7\n\n目的地节点上方的房屋图标表示这是起始目的地。这意味着当 `NavHostFragment` activity 创建时，该目的地将是第一个显示的内容。要将起始目的地更改为另一个，请在图中选择该节点并点击工具栏上的主按钮。\n\
  \n通过将编辑器切换到 Code 模式查看导航图的 XML 内容：\n\n```xml\nxmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \nxmlns:tools=\"http://schemas.android.com/tools\"\nandroid:id=\"@+id/navigation_graph\"\
  \napp:startDestination=\"@id/firstFragment\">\n\nandroid:id=\"@+id/firstFragment\"\
  \nandroid:name=\"com.ebookfrenzy.navigationdemo.FirstFragment\"\nandroid:label=\"\
  fragment_first\"\ntools:layout=\"@layout/fragment_first\" />\n```\n\n在执行任何导航之前，图至少还需要一个目的地。重复上述步骤，添加一个名为\
  \ `SecondFragment` 的 fragment，布局文件命名为 `fragment_second`。新 fragment 将作为另一个目的地出现在图中，如图\
  \ 43-8 所示：\n\n![image-NZ4CONWN.jpg](img/image-NZ4CONWN.jpeg)\n图 43-8\n\n## 43.6\
  \ 设计目的地 Fragment 布局\n\n在添加用于目的地间跳转的 action（动作）之前，现在是为图中两个目的地 fragment 添加一些用户界面组件的好时机。首先，双击\
  \ `firstFragment` 目的地，使 `fragment_first.xml` 文件加载到布局编辑器中，然后选择并删除默认的 `TextView` 实例。在\
  \ Component Tree（组件树）面板中，右键点击 `FrameLayout` 条目并选择 `Convert from FrameLayout to ConstraintLayout`（从\
  \ FrameLayout 转换为 ConstraintLayout）菜单选项，在生成的转换对话框中接受默认设置：\n\n![image-Z93X6HK8.jpg](img/image-Z93X6HK8.jpeg)\n\
  图 43-9\n\n使用 Attributes（属性）工具窗口将 `ConstraintLayout` 的 ID 改为 `constraintLayout`，然后将\
  \ `Button` 和 `Plain Text EditText` 控件拖放到布局中，使其看起来像下面的图 43-10 所示：\n\n![image-J27KU0VQ.jpg](img/image-J27KU0VQ.jpeg)\n\
  图 43-10\n\n一旦视图位置正确，点击工具栏上的 `Infer constraints`（推断约束）按钮以为布局添加任何缺失的约束。选择 `EditText`\
  \ 视图并使用 Attributes 工具窗口删除默认的“Name”文本，并将控件的 ID 更改为 `userText`。接下来，将按钮的文本属性更改为“Navigate”，并将其提取为字符串资源。\n\
  \n返回 `navigation_graph.xml` 文件并双击 `secondFragment` 目的地，将 `fragment_second.xml` 文件加载到布局编辑器中。选择并删除默认的\
  \ `TextView` 实例，重复上述步骤将 `FrameLayout` 转换为 ConstraintLayout，并将 id 更改为 `constraintLayout2`。接下来，拖入一个新的\
  \ `TextView` 控件将其置在布局中心，并点击 `Infer constraints` 按钮以添加任何缺失的约束。选中新的 `TextView` 后，使用\
  \ Attributes 面将 ID 更改为 `argText`。\n\n## 43.7 为导航图添加 Action\n\n现在图中已经添加了两个目的地并设计了相应的用户界面布局，项目需要一种让用户从第一个\
  \ fragment 导航到第二个 fragment 方法。这将通过向图中添加一个 action 来实现，然后可以在应用代码中引用它。\n\n要建立以第一个 fragment\
  \ 为起点、第二个 fragment 为目的地的 action 连接，请打开导航图并将鼠标指针悬停在 `firstFragment` 目的地右侧边缘的垂直中心，直到出现一个高亮的圆圈，如图\
  \ 43-11 所示：\n\n![image-QY0W258P.jpg](img/image-QY0W258P.jpeg)\n图 43-11\n\n点击圆圈内部并将生成的连线拖到\
  \ `secondFragment` 目的地：\n\n![image-UGON49A7.jpg](img/image-UGON49A7.jpeg)\n图 43-12\n\
  \n释放连线以建立起点和目的地之间的 action 连接，此时连线将变为箭头，所示：\n\n![image-AL2IUPG.jpg](img/image-AL2IUPG.jpeg)\n\
  图 43-13 (注：此处对应原文描述的逻辑位置)\n\n你可以可以通过选中 action 并按下 Delete 键随时删除该连接。选中 action 后，在\
  \ Attributes 窗口查看属性并将 ID 更改为 `mainToSecond`。切换编辑器到 Code 模式查看 action 已包含在 XML 中：\n\
  \n```xml\nxmlns:app=\"http://schemas.android.com/apk/res-auto\"\nxmlns:tools=\"\
  http://schemas.android.com/tools\"\nandroid:id=\"@+id/navigation_graph\"\napp:startDestination=\"\
  @id/firstFragment\">\n\nandroid:id=\"@+id/firstFragment\"\nandroid:name=\"com.ebookfrenzy.navigationdemo.FirstFragment\"\
  \nandroid:label=\"fragment_first\"\ntools:layout=\"@layout/fragment_first\" />\n\
  \n<action\n    android:id=\"@+id/mainToSecond\"\n    app:destination=\"@id/secondFragment\"\
  \ />\n\nandroid:id=\"@+id/secondFragment\"\nandroid:name=\"com.ebookfrenzy.navigationdemo.SecondFragment\"\
  \nandroid:label=\"fragment_second\"\ntools:layout=\"@layout/fragment_second\" />\n\
  ```\n\n## 43.8 实现 OnInteractionListener\n\n在添加触发 action 的代码之前，`MainActivity` 类需要实现\
  \ `OnInteractionListener` 接口。该接口是在导航图编辑器创建空白 fragments 时在 Fragment 类中生成的。为了符合接口，activity\
  \ 需要一个名为 `onInteraction()` 的方法来实现 fragment 与 activity 之间的通信。\n\n编辑 `MainActivity.java`\
  \ 文件使其内容如下：\n\n```java\npublic class MainActivity extends AppCompatActivity implements\
  \ SecondFragment.OnInteractionListener {\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \    }\n\n    @Override\n    public void onInteraction(Uri uri) {\n    }\n}\n```\n\
  \n如果 Android Studio 报告 `OnInteractionListener` 未定义（某些 Android Studio 版本会自动添加，而某些版本不会），请编辑\
  \ `SecondFragment.java` 文件并添加以下内容：\n\n```java\nimport android.net.Uri;\n\npublic\
  \ interface OnInteractionListener {\n    // TODO: 更新参数类型和名称\n    void onInteraction(Uri\
  \ uri);\n}\n```\n\n## 43.9 为目的地 Fragment 添加 View Binding 支持\n\n由于我们将在 fragment 布局中某些视图，必须修改当前代码启用\
  \ view binding 支持。首先编辑 `FirstFragment.java` 文件并进行以下更改：\n\n```java\nimport com.ebookfrenzy.navigationdemo.databinding.FragmentFirstBinding;\n\
  \npublic class FirstFragment extends Fragment {\n    private FragmentFirstBinding\
  \ binding;\n\n    @Nullable\n    @Override\n    public View onCreateView(@NonNull\
  \ LayoutInflater inflater, @Nullable ViewGroup container,\n                    \
  \         @Nullable Bundle savedInstanceState) {\n        return inflater.inflate(R.layout.fragment_first,\
  \ container, false);\n    }\n}\n```\n\n\n\n\n```java\nbinding = FragmentFirstBinding.inflate(inflater,\
  \ container, false);\n\nreturn binding.getRoot();\n\n}\n\n@Override\npublic void\
  \ onDestroyView() {\n    super.onDestroyView();\n    binding = null;\n}\n```\n\n\
  对 `SecondFragment.java` 文件重复上述步骤，并引用 `FragmentSecondBinding`。\n\n## 43.10 触发动作\n\
  \n现在动作已添加到导航图（navigation graph）中，下一步是在第一个片段（fragment）中添加一些代码，在点击 `Button` 组件时触发该动作。找到\
  \ `FirstFragment.java` 文件，将其加载到代码编辑器，并重写 `onViewCreated()` 方法以获取按钮实例的引用，并配置 `OnClickListener`\
  \ 实例以便在用户点击按钮时调用它：\n\n```java\nimport androidx.annotation.NonNull;\nimport androidx.annotation.Nullable;\n\
  import android.widget.Button;\nimport androidx.navigation.Navigation;\n\npublic\
  \ class FirstFragment extends Fragment {\n\n    @Override\n    public void onViewCreated(@NonNull\
  \ View view,\n    @Nullable Bundle savedInstanceState) {\n        super.onViewCreated(view,\
  \ savedInstanceState);\n        binding.button.setOnClickListener(new View.OnClickListener()\
  \ {\n            @Override\n            public void onClick(View view) {\n     \
  \           Navigation.findNavController(view).navigate(\n                R.id.mainToSecond);\n\
  \            }\n        });\n    }\n}\n```\n\n上述代码获取了导航控制器（navigation controller）的引用，并在该实例上调用\
  \ `navigate()` 方法，将导航动作的资源 ID 作为参数传递。\n\n编译并运行应用，验证点击第一个片段中的按钮跳转到第二个片段。\n\n作为这种设置监听器方法的替代方案，`Navigation`\
  \ 类还包含一个名为 `createNavigateOnClickListener()` 的方法，它提供了一种更高效的方法来设置监听器并导航到目的地。因此，可以使用以下单行代码来实现相同的跳转效果：\n\
  \n```java\nbinding.button.setOnClickListener(Navigation.createNavigateOnClickListener(\n\
  R.id.mainToSecond, null));\n```\n\n## 43.11 使用 Safeargs 传递数据\n\n下一个目标是将第一个片段中 `EditText`\
  \ 视图中输入的文本传递给第二个片段，并在该片段中显示在 `TextView` 组件上。正如上一章所述，Android Navigation 组件支持两种传递数据的方法。本章将使用类型安全的参数传递（type-safe\
  \ argument passing）。\n\n使用 `safeargs` 的第一步是将 `safeargs` 插件添加到 Gradle 构建配置中。使用 Project\
  \ 工具窗口，找到并编辑 `Gradle Scripts -> libs.versions.toml` 文件，如下：\n\n```toml\n[libraries]\n\
  androidx-navigation-safe-args-gradle-plugin = { module = \"androidx.navigation:navigation-safe-args-gradle-plugin\"\
  , version.ref = \"navigationFragment\" }\n```\n\n接下来，编辑项目级别的 `build.gradle.kts`\
  \ 文件（`Gradle Scripts -> build.gradle.kts (Project: NavigationDemo)`），如下所示添加插件依赖：\n\
  \n```kotlin\n// 顶层构建文件，可以在此处添加所有子项目/模块的通用配置选项\nbuildscript {\n    dependencies {\n\
  \        classpath(libs.androidx.navigation.safe.args.gradle.plugin)\n    }\n}\n\
  ```\n\n接着，编辑模块级别的 `build.gradle.kts` 文件（`Gradle Scripts -> build.gradle.kts (Module\
  \ :app)`），按如下所示应用插件并重新同步项目：\n\n```kotlin\nplugins {\n    alias(libs.plugins.android.application)\n\
  \    id (\"androidx.navigation.safeargs\")\n}\n```\n\n下一步是定义目的地将接收的任何参数，在本例中即为第二个片段。编辑导航图，选择\
  \ `secondFragment` 目的地，并在 Attributes（属性）工具窗口中找到 `Arguments` 部分。点击 `+` 按钮（如图 43-14\
  \ 所示）为目的地添加一个新参数：\n\n![image-R830LDD8.jpg](img/image-R830LDD8.jpeg)\n图 43-14\n\n\
  点击 `+` 按钮后，会弹出一个框，需要在其中输入参数名称、类型和默认值。将参数命名为 `message`，类型设置为 `String`，在默认值字段输入 `No\
  \ Message`，并点击 `Add` 按钮：\n\n![image-92HC2MYY.jpg](img/image-92HC2MYY.jpeg)\n图 43-15\n\
  \n新配置的参数将如下出现在 `navigation_graph.xml` 文件的 `secondFragment` 元素中：\n\n```xml\nandroid:id=\"\
  @+id/secondFragment\"\nandroid:name=\"com.ebookfrenzy.navigationdemo.SecondFragment\"\
  \nandroid:label=\"fragment_second\"\ntools:layout=\"@layout/fragment_second\" >\n\
  android:name=\"message\"\napp:argType=\"string\"\nandroid:defaultValue=\"No Message\"\
  \ />\n```\n\n下一步是在 `FirstFragment.java` 文件中添加代码，从 `EditText` 视图中提取文本并在导航动作期间将其传递给第二个片段。这将涉及到使用由\
  \ `safeargs` 插件自动生成的某些特殊导航类。目前，导航涉及 `FirstFragment` 类、`SecondFragment` 类、名为 `mainToSecond`\
  \ 的导航动作以及名为 `message` 的参数。\n\n当项目构建时，`safeargs` 插件将生成以下额外的类，用于在导航期间传递和接收参数：\n\n\
  - `FirstFragmentDirections`：代表导航动作的起点（在类名后加上“Directions”），并提供动作对象的访问。\n- `ActionMainToSecond`：代表执行跳转的动作（根据导航文件中命名并加上“Action”）。该类包含目的地配置的每个参数的\
  \ setter 方法。例如，由于第二个片段包含名为 `message` 的参数，该类包含名为 `setMessage()` 方法。配置完成后，将该类的实例传递给导航控制器的\
  \ `navigate()` 方法以导航到目的地。\n- `SecondFragmentArgs`：目的地用于访问从起点传递的参数的类（在类名后加上“Args”）。该类包含每个参数的\
  \ getter 方法（即 `getMessage()`）。\n\n使用这些类，可以修改 `FirstFragment.java` 文件中 `onViewCreated()`\
  \ 方法内的 `OnClickListener` 代码，以提取 `EditText` 组件的当前文本，将其应用于动作并启动到第二个片段的跳转：\n\n```java\n\
  binding.button.setOnClickListener(view1 -> {\n    FirstFragmentDirections.MainToSecond\
  \ action = FirstFragmentDirections.mainToSecond();\n    action.setMessage(binding.userText.getText().toString());\n\
  \    Navigation.findNavController(view1).navigate(action);\n});\n```\n\n如果 Android\
  \ Studio 报告 `FirstFragmentDirections` 未定义，请使用 `Build -> Make Project` 菜单重新构建项目。\n\
  \n\n\n\n上述方法中的代码首先获取 `TextView` 小部件的引用。接下来，调用 `SecondFragmentArgs` 类的 `fromBundle()`\
  \ 方法来提取从源接收到的 `SecondFragmentArgs` 对象。由于此示例中的参数在 `navigation_graph.xml` 文件中被命名为\
  \ `message`，因此在 `args` 对象上调用相应的 `getMessage()` 方法来获取字符串值。然后，将该字符串显示在 `TextView`\
  \ 小部件上。\n\n编译并运行应用，在点击 `Button` 小部件之前输入一些文本。当第二个片段目标出现时，`TextView` 应该显示在第一个片段中输入的文本，这表明数据已成功在导航目的地之间传递。\n\
  \n## 43.12 总结\n\n本章提供了一个使用 `Navigation Architecture Component`（导航架构组件）和 `Android\
  \ Studio navigation graph editor`（导航图编辑器）实现 Android 应用导航的实用示例。涵盖的话包括包含现有和新目标片段的导航图、在\
  \ Activity 布局中嵌入导航宿主片段（navigation host fragment）、编写触发导航事件的代码，以及使用 `safeargs` 插件在目的地之间传递参数。\n\
  \n## 44. MotionLayout 简介\n\n`MotionLayout` 类提供了一种为用户界面布局中的视图添加动画效果的简单方法。本章将首先对 `MotionLayout`\
  \ 进行概述并介绍 `MotionScenes`（运动场景）、`Transitions`（过渡）和 `Keyframes`（关键帧）的概念。在涵盖这些基础之后，接下来的两章（标题为“Android\
  \ MotionLayout 编辑教程”和“MotionLayout 循环教程”）将通过创建示例项目提供 `MotionLayout` 动画的更多细节和示例。\n\
  \n## 44.1 MotionLayout 概述\n\n`MotionLayout` 是一种布局容器，其主要目的是为布局内视图从一个状态到另一个状态的转换制作动画。例如，`MotionLayout`\
  \ 可以使 `ImageView` 实例在指定时间内从屏幕左上角移动到右下角。除了视图的位置，其他属性的变化也可以制作动画，例如颜色、大小或旋转角度。这些状态更改还可以进行插值（使得视图在整个动画过程中移动、旋转并改变大小）。\n\
  \n使用 `MotionLayout` 的视图运动可以在两点之间沿直线执行，也可以实现为遵循起点和终点之间不同位置的中间点的路径。`MotionLayout`\
  \ 还支持使用触摸和滑动来启动和控制动画。\n\n`MotionLayout` 动画完全在 XML 中声明，通常不需要编写代码。这些 XML 声明可以在 Android\
  \ Studio 代码编辑器中手动实现、使用 `MotionLayout` 编辑器进行视觉化实现，或结合两种方法。\n\n## 44.2 MotionLayout\n\
  \n在实现动画时，通常用于用户界面的 `ConstraintLayout` 容器必须先转换为 `MotionLayout` 实例（可以通过在布局编辑器中右键点击\
  \ `ConstraintLayout` 并选择 `Convert to MotionLayout` 菜单项完成）。`MotionLayout` 至少需要 `2.0.0`\
  \ 版本的 `ConstraintLayout` 库。\n\n由于由于它是 `ConstraintLayout` 的子类，它支持 `ConstraintLayout`\
  \ 的所有布局功能。因此，在使用 `MotionLayout` 设计不需要动画的视图时，可以使用类似的设计。\n\n对于需要动画的视图，会声明两个 `ConstraintSets`，定义视图在动画开始和结束时的外观和位置。`transition`\
  \ 声明定义了关键帧，用于在这些始终状态之间对目标视图应用额外效果，以及用于启动和控制动画的点击和滑动处理程序。\n\n开始和结束的 `ConstraintSets`\
  \ 以及 `transitions` 声明在一个 `MotionScene` XML 文件中。\n\n## 44.3 MotionScene\n\n正如我们在前面的章节中所看到的，XML\
  \ 布局文件包含配置呈现给用户的静态视图的外观和布局行为所需的信息，在使用 `MotionLayout` 时也是如此。对于非静态视图（换句话说，即要制作动画的视图），这些视图仍然声明在布局文件中，但与这些视图相关的开始、结束和过渡声明存储在一个名为\
  \ `MotionScene` 的独立 XML 文件中（之所以这样做是因为所有声明都定义在一个 `MotionScene` 元素内）。该文件被导入到布局 XML\
  \ 文件中，包含开始和结束的 `ConstraintSets` 以及 `Transition` 声明（单个文件可以包含多个 `ConstraintSet` 对和\
  \ `Transition` 声明，允许将不同的动画针对用户界面布局中的特定视图）。\n\n接下来的代码列表显示了一个 `MotionScene` 文件的模板：\n\
  \n```xml\nxmlns:android=\"http://schemas.android.com/apk/res/android\"\nxmlns:motion=\"\
  http://schemas.android.com/apk/res-auto\">\nmotion:constraintSetEnd=\"@+id/end\"\
  \nmotion:constraintSetStart=\"@id/start\"\nmotion:duration=\"1000\">\n```\n\n在上述\
  \ XML 中，声明了名为 `start` 和 `end`（尽管可以使用任何名称）的 `ConstraintSets`，它们目前尚未包含任何约束元素。`Transition`\
  \ 元素定义了这些 `ConstraintSets` 代表动画的起点终点，并包含一个空的 `KeyFrameSet` 元素，准备填充额外的动画关键帧。`Transition`\
  \ 元素还包含一个毫秒持续时间属性，用于控制动画的运行时间。\n\n`ConstraintSets` 并不意味着视图的运动。可以让开始和结束集声明屏幕上的相同位置，然后使用过渡来制作其他属性的变化，例如缩放和旋转。\n\
  \n## 44.4 配置 ConstraintSets\n\n`MotionScene` 文件中的 `ConstraintSets` 允许将全套 `ConstraintLayout`\
  \ 设置应用于视图的位置、大小以及与父容器或其他视图的关系。此外，在 `ConstraintSet` 声明中还可以包含以下属性：\n\n- `alpha`\n\
  - `visibility`\n- `elevation`\n- `rotation`\n- `rotationX`\n- `rotationY`\n- `translationX`\n\
  - `translationY`\n- `translationZ`\n- `scaleX`\n- `scaleY`\n\n例如，为了让视图在动画期间旋转 180\
  \ 度，可以在开始和结束约束中声明以下内容：\n\n```xml\n.\nmotion:layout_constraintStart_toStartOf=\"\
  parent\"\nandroid:rotation=\"0\">\n.\nmotion:layout_constraintBottom_toBottomOf=\"\
  parent\"\nandroid:rotation=\"180\">\n```\n\n上述更改告诉 `MotionLayout` 视图从 0 度开始，然后在动画期间旋转完整的\
  \ 180 度，最后处于倒置状态。\n\n## 44.5 自定义属性\n\n除了上述列出的标准属性外，还可以指定一系列自定义属性（使用 `CustomAttribute`\
  \ 声明）。事实上，视图类型上可用的几乎任何属性都可以作为自定义属性包含在动画中。要标识属性名称，请从目标视图类的文档中找到 getter/setter 名称，删除\
  \ `get/set` 前缀，并将第一个字符转换为小写。例如，在代码中更改 `Button` 视图的背景颜色时，我们可能会如下调用 `setBackground()`\
  \ 设置方法：\n\n```java\nmyButton.setBackgroundColor(Color.RED)\n```\n\n\n\n在约束集（constraint\
  \ set）或关键帧中设置此属性时，属性名称将为 `backgroundColor`。除了属性名称外，还必须使用以下选项列表中的相应类型声明值：\n\n- `motion:customBoolean`\
  \ - 布尔型属性值。\n- `motion:customColorValue` - 颜色属性值。\n- `motion:customDimension` -\
  \ 维度属性值。\n- `motion:customFloatValue` - 浮点数属性值。\n- `motion:customIntegerValue` -\
  \ 整数属性值。\n- `motion:customStringValue` - 字符串属性值。\n\n例如，颜色设置需要使用 `customColorValue`\
  \ 类型进行赋值：\n\n```xml\nmotion:attributeName=\"backgroundColor\"\nmotion:customColorValue=\"\
  #43CC76\" />\n```\n\n例如，以下来自 `MotionScene` 文件的片段除了将背景颜色从绿色改为红色外，还为一个视图声明了起始和结束约束：\n\
  \n```xml\nandroid:layout_width=\"wrap_content\"\nandroid:layout_height=\"wrap_content\"\
  \nmotion:layout_editor_absoluteX=\"21dp\"\nandroid:id=\"@+id/button\"\nmotion:layout_constraintTop_toTopOf=\"\
  parent\"\nmotion:layout_constraintStart_toStartOf=\"parent\" >\nmotion:attributeName=\"\
  backgroundColor\"\nmotion:customColorValue=\"#33CC33\" />\n\nandroid:layout_width=\"\
  wrap_content\"\nandroid:layout_height=\"wrap_content\"\nmotion:layout_editor_absoluteY=\"\
  21dp\"\nandroid:id=\"@+id/button\"\nmotion:layout_constraintEnd_toEndOf=\"parent\"\
  \nmotion:layout_constraintBottom_toBottomOf=\"parent\" >\nmotion:attributeName=\"\
  backgroundColor\"\nmotion:customColorValue=\"#F80A1F\" />\n```\n\n## 44.6 触发动画\n\
  \n如果没有某些事件告诉 `MotionLayout` 开始动画，`MotionScene` 文件中的任何设置都将不会影响布局（视图将根据起始 `ConstraintSet`\
  \ 中的设置进行定位除外）。\n\n动画可以配置为响应屏幕点击（`OnClick`）或滑动动作（`OnSwipe`）手势来启动。`OnClick` 处理器会使动画开始并运行直到完成，而\
  \ `OnSwipe` 则将同步动画，沿时间轴往回移动以匹配触摸动作。`OnSwipe` 处理器还会响应屏幕上的“飞掷”动作。`OnSwipe` 处理器还提供了选项，用于配置动画如何响应不同方向的拖拽，以及滑动锚定的目标视图的哪侧。这允许例如，向左的拖拽动作可以使视图向相应方向移动，同时防止向上运动导致视图向侧移动（除非这确实是需要的行为）。\n\
  \n`OnSwipe` 和 `OnClick` 声明包含在 `MotionScene` 文件的 `Transition` 元素中。在这两种情况下，都必须指定视图\
  \ ID。例如，要实现一个响应锚定在名为 `button` 的视图底的向下拖拽动作的 `OnSwipe` 处理器，应将以下 XML 放在 `Transition`\
  \ 元素中：\n\n```xml\nmotion:constraintSetEnd=\"@+id/end\"\nmotion:constraintSetStart=\"\
  @id/start\"\nmotion:duration=\"1000\"\nmotion:touchAnchorId=\"@+id/button\"\nmotion:dragDirection=\"\
  dragDown\"\nmotion:touchAnchorSide=\"bottom\" />\n```\n\n或者，为同一个按钮添加 `OnClick` 处理器：\n\
  \n```xml\nmotion:clickAction=\"toggle\" />\n```\n\n在上面的示例中，动作已设置为切换（toggle）模式。这种模式和其他可用选项可以总结如下：\n\
  \n- `toggle` - 动画到相反状态。例如，如果视图当前处于过渡起点，它将过渡到终点，反之亦然。\n- `jumpToStart` - 立即切换到起始状态，不进行动画。\n\
  - `jumpToEnd` - 立即切换到结束状态，不进行动画。\n- `transitionToStart` - 带动画过渡到起始状态。\n- `transitionToEnd`\
  \ - 带动画过渡到结束状态。\n\n## 44.7 弧形运动\n\n默认情况下，视图位置的移动将在起点和终点之间沿沿直线移动。要将运动更改为弧形路径，请在起始约束中使用如下所示的\
  \ `pathMotionArc` 属性，并配置 `startHorizontal` 或 `startVertical` 设置来定义弧形是凹形还是凸形：\n\n\
  ```xml\nandroid:layout_width=\"wrap_content\"\nandroid:layout_height=\"wrap_content\"\
  \nmotion:layout_editor_absoluteX=\"21dp\"\nandroid:id=\"@+id/button\"\nmotion:layout_constraintTop_toTopOf=\"\
  parent\"\nmotion:layout_constraintStart_toStartOf=\"parent\"\nmotion:pathMotionArc=\"\
  startVertical\" >\n```\n\n图 44-1 展示了 `startVertical` 和 `startHorizontal` 弧形与默认直线运动的对比：\n\
  \n![image-HSR4H77F.jpg](img/image-HSR4H77F.jpeg)\n\n图 44-1\n\n## 44.8 关键帧\n\n到为止概述的所有\
  \ `ConstraintSet` 属性仅适用于动画的起点和终点。也就是说，如果旋转属性在终点被设置为 180°，那么旋转将在动画开始时开始，并在到达终点时完成。因此，无法配置旋转在动画进行到\
  \ 50% 处达到 180°，然后在终点回到原始方向。\n\n关键帧（Keyframes）用于定义动画期间发生状态变化的中间点。例如，可以声明关键帧，使视图的背景颜色在动画进行到\
  \ 50% 处变为蓝色，在 75% 处变为绿色，然后在终点恢复原始颜色。关键帧实现在 `MotionScene` 文件的 `Transition` 元素内部，嵌入\
  \ `KeyFrameSet` 元素中。\n\n`MotionLayout` 支持多种类型的关键帧，总结如下：\n\n### 44.8.1 属性关键帧\n\n\
  属性关键帧（使用 `KeyAttribute` 声明）允许在动画的中间点更改视图属性。`KeyAttribute` 支持上述 `ConstraintSets`\
  \ 中的属性，并能够指定更改在时间轴何时生效。例如，以下关键帧声明将按钮在水平（`scaleX`）和垂直（`scaleY`）方向逐渐增大，在时间轴的 50% 处达到全尺寸。在剩余的时间时间内，视图将缩小到原始尺寸：\n\
  \n```xml\nmotion:constraintSetEnd=\"@+id/end\"\nmotion:constraintSetStart=\"@id/start\"\
  \nmotion:duration=\"1000\"\nmotion:motionTarget=\"@+id/button\"\nmotion:framePosition=\"\
  50\"\nandroid:scaleX=\"2.0\" />\n\nmotion:motionTarget=\"@+id/button\"\nmotion:framePosition=\"\
  50\"\nandroid:scaleY=\"2.0\" />\n```\n\n### 44.8.2 位置关键帧\n\n位置关键帧（`KeyPosition`）修改视图在起点和终点之间移动时遵循的路径。通过在时间轴上的不同点放置关键位置，可以对动画应用任何复杂的路径。位置使用\
  \ `x` 和 `y` 坐标结合时间轴中的对应点进行声明。这些坐标必须相对于以下坐标系之一声明：\n\n- `parentRelative` - `x` 和 `y`\
  \ 坐标相对于父容器，坐标以百分比（表示为 0.0 到 1.0 之间的值）指定：\n\n![image-FDCS3SLT.jpg](img/image-FDCS3SLT.jpeg)\n\
  \n图 44-2\n\n- `deltaRelative` - 并不是相对于父，`x` 和 `y` 坐标相对于起始和结束位置。例如，起点为 (0, 0)，终点为\
  \ (1, 1)。请记住 `x` 和 `y` 坐标可以是负值：\n\n![image-2S31SXBP.jpg](img/image-2S31SXBP.jpeg)\n\
  \n图 44-3\n\n\n\n\n- `pathRelative` - x 和 y 坐标相对于路径，其中起点和终点之间的直线作为图表的 X 轴。再次强调，坐标以百分比（0.0\
  \ 到 1.0）的形式表示。这与 `deltaRelative` 坐标空间相似，但它考虑了路径的角度。再次强调，坐标可能为负值：\n\n![image-2XZNDA75.jpg](img/image-2XZNDA75.jpeg)\n\
  \n图 44-4\n\n例如，下方的 `ConstraintSets` 在设备屏幕的侧边声明了起点和终点。默认情况下，使用这些点的视图过渡将沿横跨屏幕的直线移动，如图\
  \ 44-5 所示：\n\n![image-5T1BGL60.jpg](img/image-5T1BGL60.jpeg)\n\n图 44-5\n\n但是，如果要求视图遵循类似于图\
  \ 44-6 所示的路径，那么：\n\n![image-3JIN9NVT.jpg](img/image-3JIN9NVT.jpeg)\n\n图 44-6\n\n\
  为了实现这一点，可以在过渡中按如下方式声明关键帧位置点：\n\n```xml\nmotion:motionTarget=\"@+id/button\"\nmotion:framePosition=\"\
  25\"\nmotion:keyPositionType=\"pathRelative\"\nmotion:percentY=\"0.3\"\nmotion:percentX=\"\
  0.25\"/>\n\nmotion:motionTarget=\"@+id/button\"\nmotion:framePosition=\"75\"\nmotion:keyPositionType=\"\
  pathRelative\"\nmotion:percentY=\"-0.3\"\nmotion:percentX=\"0.75\"/>\n```\n\n上述元素使用\
  \ `pathRelative` 坐标系在路径的 25% 和 75% 处创建关键帧位置点。第一个位置位于坐标 (0.25, 0.3)，第二个位于 (0.75,\
  \ -0.3)。这些位置关键帧可以像下方图 44-7 所示进行可视化：\n\n![image-IOWMZP6D.jpg](img/image-IOWMZP6D.jpeg)\n\
  \n图 44-7\n\n## 44.9 时间线性\n\n在没有额外设置的情况下，上述概述动画将以恒定速度执行。要改变动画速度（例如，使其加速后减速），可以在 `ConstraintSet`\
  \ 或 `Keyframe` 中使用过渡缓动属性 (`transitionEasing`）。\n\n对于复杂的缓动需求，可以通过在三次贝塞尔曲线上绘制数据点来定义线性度，例如：\n\
  \n```xml\nmotion:layout_constraintBottom_toBottomOf=\"parent\"\nmotion:transitionEasing=\"\
  cubic(0.2, 0.7, 0.3, 1)\"\nandroid:rotation=\"360\">\n```\n\n如果你不熟悉贝塞尔曲线，可以考虑使用以下\
  \ URL 上的在线曲线生成器：\n\n[`cubic-bezier.com/`](https://cubic-bezier.com/)\n\n然而，对于大多数需求，可以使用内置的标准值\
  \ `accelerate`加速）和 `decelerate`减速）来指定缓动：\n\n```xml\nmotion:layout_constraintBottom_toBottomOf=\"\
  parent\"\nmotion:transitionEasing=\"decelerate\"\nandroid:rotation=\"360\">\n```\n\
  \n## 44.10 KeyTrigger\n\n触发关键帧 (`KeyTrigger`）允许在动画到达时间轴内指定的帧位置时调用视图上的方法。这同样考虑了动画的方向。例如，可以根据动画正向运行还是反向运行调用不同的方法。考虑一个当动画移动超过时间轴的\
  \ 20% 时变得可见的按钮。在 `Transition` 元素的 `KeyFrameSet` 中按如下使用 `onPositiveCross` 属性实现 `KeyTrigger`：\n\
  \n```xml\nmotion:framePosition=\"20\"\nmotion:onPositiveCross=\"show\"\nmotion:motionTarget=\"\
  @id/button\"/>\n```\n\n同样，如果当动画反转并降至 10% 以下时隐藏同一个按钮，可以使用 `onNegativeCross` 属性添加第二个键触发器：\n\
  \n```xml\nmotion:framePosition=\"10\"\nmotion:onNegativeCross=\"show\"\nmotion:motionTarget=\"\
  @id/button2\"/>\n```\n\n如果动画使用切换操作（toggle action），请使用 `onCross` 属性：\n\n```xml\n\
  motion:framePosition=\"10\"\nmotion:onCross=\"show\"\nmotion:motionTarget=\"@id/button2\"\
  />\n```\n\n## 44.11 Cycle 和 Time Cycle Keyframes\n\n虽然位置关键帧可以用于向动画添加中间状态变化，但如果需要实现大量的重复位置和变化，这将很快变得繁琐。对于需要以预测的变化重复执行状态变化的情况，`MotionLayout`\
  \ 包含了 `Cycle` 和 `Time Cycle` 关键帧。名为“A MotionLayout KeyCycle Tutorial”的章节将详细介绍这一主题。\n\
  \n## 44.12 从代码启动动画\n\n在本章到为止，我们只查看了如何使用 `OnSwipe` 和 `OnClick` 处理程序来控制动画。也可以通过调用\
  \ `MotionLayout` 实例上的方法从代码内部启动动画。例如，下面的代码为名为 `motionLayout` 的布局运行持续时间为 2000ms 的过渡：\n\
  \n```java\nmotionLayout.setTransitionDuration(2000);\nmotionLayout.transitionToEnd();\n\
  ```\n\n\n\n\n\n完成选择后，点击确认框中的 `Convert` 按钮。一旦转换完成，`MotionLayout` 编辑器将出现在 Android\
  \ Studio 主窗口中，如图 45-2 所示：\n\n![image-JZPP52MG.jpg](img/image-JZPP52MG.jpeg)\n\n\
  图 45-2\n\n作为转换过程的一部分，Android Studio 将创建一个名为 `res -> xml` 的新文件夹，并在其中放置名为 `activity_main_scene.xml`\
  \ 的 MotionLayout 场景文件：\n\n![image-RERYKZQH.jpg](img/image-RERYKZQH.jpeg)\n\n图 45-3\n\
  \n该文件包含一个顶层 `MotionScene` 元素，其中包含 `ConstraintSet` 和 `Transition` 条目，这些项将定义主布局中的动画。默认情况下，该文件将包含起始和结束约束集的空元素以及初始过渡：\n\
  \n```xml\nxmlns:android=\"http://schemas.android.com/apk/res/android\"\nxmlns:motion=\"\
  http://schemas.android.com/apk/res-auto\">\nmotion:constraintSetEnd=\"@+id/end\"\
  \nmotion:constraintSetStart=\"@id/start\"\nmotion:duration=\"1000\">\n```\n\n在 `MotionLayout`\
  \ 编辑器中进行的任何更改都将存储在此文件中。同样，也可以直接编辑此文件以便在 `MotionLayout` 编辑器之外实现和修改动画设置。\n\n在本教程中，动画主要通过\
  \ `MotionLayout` 编辑器界面来实现。然而，我们将在每个阶段回顾这些更改是如何反映在底层 `MotionScene` 文件中的。随着章节的进行，你会发现\
  \ `MotionScene` 的 XML 语法简单且易于学习。\n\n本教程的第一阶段将演示如何使用 `MotionLayout` 为 `Button` 对象制作动画，包括运动（包括遵循路径）、旋转和尺寸缩放。\n\
  \n## 45.3 配置起始和结束约束\n\n将 `activity_main.xml` 文件加载到 `MotionLayout` 编辑器后，确保已选中 Motion\
  \ Layout 框（在下方图 45-5 中标记为 E），然后在从调色板将 `Button` 视图拖到布局画布的左上角之前，删除默认的 `TextView`，如图\
  \ 45-4 所示：\n\n![image-LO6L0LXF.jpg](img/image-LO6L0LXF.jpeg)\n\n图 45-4\n\n选中按钮后，使用属性（Attributes）工具窗口将\
  \ `id` 改为 `myButton`。\n\n如上一章所述，`MotionLayout` 动画主要是指定视图如何在两个状态之间转换的。因此，实现动画的第一步是指定定义这些状态的约束。\n\
  \n对于此示例，起点将是布局视图的顶部。要配置这些约束，请选择编辑器窗口中的起始约束集条目（在图 45-5 中标记为 A）：\n\n![image-1F53HJ0W.jpg](img/image-1F53HJ0W.jpeg)\n\
  \n图 45-5\n\n当选中起始框时，所有的约束和布局更改都将应用于起始点约束集。要返回整个布局的标准约束和属性，请点击 Motion Layout 框 (E)。\n\
  \n接下来，在 `ConstraintSet` 列表中选择 `myButton` 条目 (B)。注意，源（Source）列显示按钮是根据布局文件中的约束定位的。相反，我们希望按钮根据起始约束集进行定位。在仍选中\
  \ `myButton` 条目的情况下，点击 `Edit` 按钮 (C) 并从菜单中选择 `Create Constraint`，之后按钮条目将指示视图将根据起始约束集进行定位：\n\
  \n![image-CXF3BI1W.jpg](img/image-CXF3BI1W.jpeg)\n\n图 45-6\n\n起始约束集必须将按钮放置在布局的顶部，具有\
  \ `8dp` 的偏移量并水平居中。在 `myButton` 仍被选的情况下，使用属性工具窗口对视图的顶部、左侧和右侧设置约束，如下：\n\n![image-8BTM5TV6.jpg](img/image-8BTM5TV6.jpeg)\n\
  \n图 45-7\n\n选择结束约束集条目（在图 45-5 中标记为 D），并重复步骤以创建新约束，这次将按钮放置在布局的水平中心，但距离布局底部有 `8p`\
  \ 的偏移量：\n\n![image-18LH7GBK.jpg](img/image-18LH7GBK.jpeg)\n\n图 45-8\n\n配置好起始和结束约束后，打开\
  \ `activity_main_scene.xml` 文件，并注意约束已添加到到文件中：\n\n```xml\nxmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \nxmlns:motion=\"http://schemas.android.com/apk/res-auto\">\n\nandroid:id=\"@+id/myButton\"\
  \nandroid:layout_width=\"wrap_content\"\nandroid:layout_height=\"wrap_content\"\n\
  motion:layout_constraintTop_toTopOf=\"parent\"\nandroid:layout_marginTop=\"8dp\"\
  \nmotion:layout_constraintStart_toStartOf=\"parent\"\nmotion:layout_constraintEnd_toEndOf=\"\
  parent\" />\n\nandroid:id=\"@+id/myButton\"\nandroid:layout_width=\"wrap_content\"\
  \nandroid:layout_height=\"wrap_content\"\nmotion:layout_constraintStart_toStartOf=\"\
  parent\"\nmotion:layout_constraintEnd_toEndOf=\"parent\"\nmotion:layout_toBottomOf=\"\
  parent\"\nandroid:marginBottom=\"8dp\" />\n```\n\n此外注意，`Transition` 元素已配置为在起始和结束点之间进行动画。\n\
  \n## 45.4 预览 MotionLayout 动画\n\n要在不构建和运行应用程序的情况下预览动画，请在 MotionLayout 编辑器中选择过渡。这将显示动画时间面板：\n\
  \n![image-2L5WR6.jpg](img/image-2L5WR6.jpeg)\n\n图 45-9\n\n要测试动画，点击滑块 (C) 并沿着时间轴移动它。随着滑块移动，布局中的按钮将沿着虚线\
  \ (D) 移动。使用工具栏按钮 (E) 执行完整动画。\n\n## 45.5 添加点击手势\n\n虽然创建了简单的 MotionLayout 动画过渡，但我们仍然需要在运行的应用程序内部启动动画。这可以通过分配点击或滑动处理程序来实现。对于此示例，我们将配置在用户点击按钮时启动动画。在\
  \ MotionLayout 编辑器中，暂停循环运行动画。接下来，选择过渡箭头（在图 45-9 中标记为 A），在属性工具窗口中找到 OnClick 部分，并点击图\
  \ 45-10 所示的 `+` 按钮：\n\n![image-D8Y4QSX.jpg](img/image-D8Y4QSX.jpeg)\n\n图 45-10\n\
  \nOnClick 面板将为第一个属性出现一个空行。对于属性名，输入 `targetId`；对于值字段，输入按钮的 id (`@id/myButton`)。在下一个空行中，在属性名字段输入\
  \ `app:clickAction`。在值字段中，点击向下箭头显示有效选项：\n\n![image-U4CVL405.jpg](img/image-U4CVL405.jpeg)\n\
  \n图 45-11\n\n对于此示例，选择切换 操作。这将导致视图在点击时动画到相反的位置。输入这些设置后，它们应与图 45-12 所示的：\n\n![image-VLH360EE.jpg](img/image-VLH360EE.jpeg)\n\
  \n图 45-12\n\n再次打开 `activity_main_scene.xml` 文件并检查 Transition 条目中定义的 `OnClick` 属性：\n\
  \n```xml\nmotion:constraintSetEnd=\"@+id/end\"\nmotion:constraintSetStart=\"@id/start\"\
  \nmotion:duration=\"1000\">\nmotion:clickAction=\"toggle\" />\n```\n\n编译并在设备或模拟器上运行应用程序，并确认点击按钮会导致其在\
  \ MotionScene 文件定义的起始和结束点之间来回切换。\n\n\n\n\n到目前为止，示例项目仅实现了按钮视图从屏幕上一个位置到另一个位置的动画。属性关键帧（`KeyAttribute`）提供了一种方法，用于指定过渡时间轴内其他属性变化生效的点。例如，可以定义\
  \ `KeyAttribute` 为：当视图移动到时间轴的 30% 时，其尺寸必须增加 50%。在本示例中，我们将在动画的中点添加一个旋转效果。\n\n首先，在\
  \ MotionLayout 编辑器中打开 `activity_main.xml` 文件，选择过渡连接器箭头以显示时间轴，然后点击图 45-13 中高亮显示的按钮：\n\
  \n![image-6VG3FBRW.jpg](img/image-6VG3FBRW.jpeg)\n\n图 45-13\n\n从菜单中选择 `KeyAttribute`\
  \ 选项：\n\n![image-HMTTHTUS.jpg](img/image-HMTTHTUS.jpeg)\n\n图 45-14\n\n一旦选中，将出现图\
  \ 45-15 所示的对话框。在对话框中，确保选中了 `ID` 选项并引用了 `myButton`。在位置字段中输入 `50`（此处以百分比指定，`0` 是起点，`100`\
  \ 是终点）。最后，在点击 `Add` 按钮之前，从属性下拉菜单选择旋转（rotation）项：\n\n![image-P5DA9GI5.jpg](img/image-P5DA9GI5.jpeg)\n\
  \n图 45-15\n\n一旦添加了 `KeyAttribute`，时间轴中会出现一个该属性的一行。点击该行将其高亮，然后点击行最左侧边缘的展开箭头以展开属性过渡图。注意，时间轴上出现了一个小小的菱形标记（如下方的图\
  \ 45-16 所示），它表示关键帧的位置。图表表示效果的线性程度。在这种情况下，按钮将稳定地旋转到指定的度数，并在关键帧位置达到最大旋转。随后，按钮将在到达终点时旋转回\
  \ `0` 度：\n\n![image-P2NY2UA7.jpg](img/image-P2NY2UA7.jpeg)\n\n图 45-16\n\n要更改 `KeyAttribute`\
  \ 的属性，请在时间轴中选中它，然后参考 Attributes 工具窗口。在 `KeyAttribute` 面板中，将旋转属性更改为 `360` 度：\n\n\
  ![image-ONDZ98RD.jpg](img/image-ONDZ98RD.jpeg)\n\n图 45-17\n\n通过来移动滑动块并观察按钮在布局画布中穿过动画路径时的旋转情况，检查该属性是否正常工作。参考\
  \ `activity_main_scene.xml` 文件，其内容应如下：\n\n```xml\nmotion:constraintSetEnd=\"@+id/end\"\
  \nmotion:constraintSetStart=\"@id/start\"\nmotion:duration=\"1000\">\nmotion:motionTarget=\"\
  @+id/myButton\"\nmotion:framePosition=\"50\"\nandroid:rotation=\"360\" />\nmotion:clickAction=\"\
  toggle\" />\n```\n\n使用过渡滑动块或通过编译运行应用来测试动画，并验证按钮现在在动画期间会旋转。\n\n## 45.7 在过渡中添加 CustomAttribute\n\
  \n`KeyAttribute` 属性限于内置效果，如缩放和旋转。通过声明 `CustomAttributes` 也可以实现额外的更改。与存储在 `Transition`\
  \ 元素中的 `KeyAttributes` 不同，`CustomAttributes` 位于起始和结束约束集中。因此，这些属性只能声明在起点和终点生效（换句话说，你无法在过渡时间轴的中间指定属性关键帧）。\n\
  \n在本示例中，我们将配置按钮颜色从红色逐渐变为绿色。首先选择图 45-18 中标记为 A 的起始框，然后是 `myButton` 视图约束集（`B`）：\n\n\
  ![image-RURG1ELT.jpg](img/image-RURG1ELT.jpeg)\n\n图 45-18\n\n参考 Attributes 工具窗口，点击下方所示的\
  \ `CustomAttributes` 部分的 `+` 按钮：\n\n![image-YJOO0HUF.jpg](img/image-YJOO0HUF.jpeg)\n\
  \n图 45-19\n\n在结果对话框（图 45-20）中，将属性类型更改为 `Color`，并在 `Attribute Name` 字段中输入 `backgroundColor`。最后，将值设置为\
  \ `#F80A1F`：\n\n![image-IDCX0M57.jpg](img/image-IDCX0M57.jpeg)\n\n图 45-20\n\n点击\
  \ `OK` 提交更改，然后选择结束约束集（上述图 45-18 中标记为 `C`），并重复步骤添加自定义属性，这次指定 `#33CC33` 为颜色的 RGB 值。\n\
  \n使用时间轴滑动块或运行应用，确保按钮在动画期间更改了颜色。\n\n这些 `CustomAttributes` 的添加将反映在 `activity_main_scene.xml`\
  \ 文件中：\n\n```xml\nmotion:attributeName=\"backgroundColor\"\nmotion:customColorValue=\"\
  #F80A1F\" />\nmotion:attributeName=\"backgroundColor\"\nmotion:customColorValue=\"\
  #33CC33\" />\n```\n\n## 45.8 添加位置关键帧\n\n本教程的最后一个任务是添加两个位置关键帧（`KeyPosition`），为动画引入一些横向移动。在\
  \ MotionLayout 显示时间轴的情况下，点击按钮创建一个如图 21 所示高亮的关键帧：\n\n![image-T5Y4WH.jpg](img/image-T5Y4WH.jpeg)\n\
  \n图 45-21\n\n在结果对话框中，按照图 45-22 所示设置属性：\n\n![image-P9BV80P.jpg](img/image-P9BV80P.jpeg)\n\
