  \ Independent Pixels to Pixels)\n\n此练习的下一个任务是将 `EditText` 的宽度设置为 200dp。正如“Android\
  \ Studio 布局器教程”章节所述，在设置用户界面的大小和位置时，最好在运行时将 dp 值转换为像素 (px)。因此，为了将 `EditText` 的宽度设置为\
  \ 200dp，需要向类中添加以下代码：\n\n```java\npackage com.ebookfrenzy.javalayout;\n\nimport android.content.res.Resources;\n\
  import android.util.TypedValue;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private int convertToPx(int value) {\n        Resources r = getResources();\n\
  \        return (int) TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, value,\
  \ r.getDisplayMetrics());\n    }\n\n    private void configureLayout() {\n     \
  \   Button myButton = new Button(this);\n        myButton.setText(getString(R.string.press_me));\n\
  \        myButton.setBackgroundColor(Color.YELLOW);\n        myButton.setId(R.id.myButton);\n\
  \        EditText myEditText = new EditText(this);\n        myEditText.setId(R.id.myEditText);\n\
  \        int px = convertToPx(200);\n        myEditText.setWidth(px);\n    }\n}\n\
  ```\n\n编译并再次运行应用，注意 `EditText` 视图的宽度已经发生了变化，如图 25-3 所示：\n\n![image-VLMPPHUC.jpg](img/image-VLMPPHUC.jpeg)\n\
  \n图 25-3\n\n## 25.8 总结 (Summary)\n\n在本章节中创建的示例 Activity 创建了与之前“Android Studio 中的手动\
  \ XML 布局设计”章节创建的类似的界面（尽管如此）。本章至少让人们意识到 Android Studio 布局编辑器工具和 XML 资源在很大程度上保护开发者免受创建\
  \ Android 用户界面布局的复杂性影响。\n\n然而，在某些情况下，使用 Java 创建用户界面是合理的。\n\n26\\. Android Studio\
  \ 中使用 Apply Changes 的指南 (A Guide to Using Apply Changes in Android Studio)\n\n\n\
  \n\n\n既然已经涵盖了使用 Android Studio 进行 Android 开发的一些基本概念，现在是介绍 Android Studio 的“应用更改”（Apply\
  \ Changes）功能的好时了。正如所有经验开发者所知，等待应用编译和运行的每一秒都不如用于编写和完善代码。\n\n## 26.1 引入应用更改\n\n在 Android\
  \ Studio 的早期版本中，每次需要测试项目更改时，Android Studio 都会重新编译代码、转换为 Dex 格式、生成 APK 包文件，并安装到设备或模拟器上。完成这些步骤后，应用才会启动并准备好测试。即使在快速的开发系统上，这个过程也需要大量时间完成。对于大型应用程序，此过程花费一分钟或更长时间并不常见。\n\
  \n相比之下，“应用更改”允许在设备或模拟器会话运行的同时，将项目中的许多代码和资源更改几乎瞬间反映到应用中。\n\n例如，考虑一个在 Android Studio\
  \ 中开发已在设备或模拟器上启动的应用。如果对资源设置或方法内的代码进行了更改，“应用更改”将更新后的代码和资源推送到运行的应用中，并动态地“交换”更改。随后，更改将反映在运行的应用中，而无需构建、部署和重新启动整个应用。这通常允许在没有“应用更改”所需的时间内测试更改。\n\
  \n## 26.2 理解应用更改选项\n\nAndroid Studio 提供了三种对运行的应用应用更改的选项，形式分别为运行应用（Run App）、应用更改并重启活动（Apply\
  \ Changes and Restart Activity）以及应用代码更改（Apply Code Changes）*。这些选项可以总结如下：\n\n- `Run\
  \ App` - 停止当前运行的应用并重启它。如果自上次启动以来项目未发生更改，此选项将重启应用。反，如果项目已发生更改，Android Studio 将启动应用之前重新构建并将应用重新安装到设备或模拟器上。\n\
  \n- `Apply Code Changes` - 当项目的更改仅涉及修改现有方法体，或者添加了新类或新方法时，可以使用此选项。选中后，更改将应用于运行的应用，而无需重启应用或当前正在运行的活动。然而，当对任何项目资源（如布局文件）进行更改时，无法使用此模式。其他限制还包括删除方法、更改方法签名、重命名类以及其他结构性代码更改。如果项目清单（Manifest）发生了更改，也无法使用此选项。\n\
  \n- `Apply Changes and Restart Activity` - 选中后，此模式将动态应用项目内的任何代码或资源更改，并在不重新安装或重启应用的情况下重启活动。与“应用代码更改”选项不同，当项目代码和资源发生更改时可以使用此选项。但是，涉及某些结构性代码更改和清单修改的限制仍然适用。\n\
  \n## 26.3 使用应用更改\n\n当项目已加载 Android Studio 但尚未在设备或模拟器上运行时，可以使用工具栏上的运行按钮（图 26-1 中标记为\
  \ A）或调试按钮（B）照常启动启动它：\n\n![image-VA5Z2YGQ.jpg](img/image-VA5Z2YGQ.jpeg)\n图 26-1\n\
  \n应用启动并运行后，将出现停止按钮（图 26-2 中标记为 A），并且“应用更改并重启活动”（B）和“应用代码更改”（C）按钮将变为可用：\n\n![image-BFA65VL2.jpg](img/image-BFA65VL2.jpeg)\n\
  图 26-2\n\n如果在选择其中一个“应用更改”按钮时无法应用更改，Android Studio 将显示一条指示失败及其说明的消息。例如，图 26-3 显示了对资源文件进行更改后，选择“应用代码更改”选项时\
  \ Android Studio 显示的消息：\n\n![image-ISKOTRWX.jpg](img/image-ISKOTRWX.jpeg)\n图 26-3\n\
  \n在这种情况下，解决方案是使用“应用更改并重启活动”选项（此处提供了相关链接）。同样，当尝试应用涉及删除方法的更改时，将出现以下消息：\n\n![image-GDTXWO0Z.jpg](img/image-GDTXWO0Z.jpeg)\n\
  图 26-4\n\n在这种情况下，唯一的选项是点击“运行应用”按钮以重新安装并重启应用。作为手动手动选择正确选项的替代方案，Android Studio 可以配置为自动回退到执行“运行应用”操作。\n\
  \n## 26.4 配置应用更改回退设置\n\n应用更改的回退设置位于 Android Studio 的设置（Settings）对话框中。在设置对话框中，在左侧面板选择\
  \ `Build, Execution, Deployment` 项，然后选择 `Deployment`，如图 26-5 所示：\n\n![image-NAAE8670.jpg](img/image-NAAE8670.jpeg)\n\
  图 26-5\n\n一旦启所需的选项，点击 `Apply`，然后点击 `OK` 按钮提交更改并关闭对话框。启用这些默认设置后，Android Studio 将必要时自动重新安装并重启应用。\n\
  \n## 26.5 应用更改教程\n\n启动 Android Studio，从欢迎屏幕上选择新项目（New Project）选项，并在点击下一步按钮之前，在生成的新项目对话框中选择\
  \ Basic Views Activity 模板。\n\n在 `Name` 字段中输入 `ApplyChanges` 并指定 `com.ebookfrenzy.applychanges`\
  \ 为包名。在点击完成按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将 `Language`\
  \ 菜单更改为 `Java`。\n\n## 26.6 使用应用代码更改\n\n从点击运行按钮开始并选择模拟器或物理设备作为运行目标。点击运行按钮后，跟踪示例应用出现的时间。\n\
  \n运行后，点击操作按钮（屏幕右下角显示信封图标的按钮）。注意出现了一个 Snackbar 实例，显示文本为“Replace with your own action”，如图\
  \ 26-6 所示：\n\n![image-8M1V48.jpg](img/image-8M1V48.jpeg)\n图 26-6\n\n一旦应用运行，“应用更改”按钮应该已变为可用，表明某些项目更改可以在无需重新安装和重启应用的情况下应用。要查看此效果，编辑\
  \ `MainActivity.java` 文件，找到 `onCreate` 方法，并修改操作代码，以便在选择操作按钮时显示不同的消息：\n\n```java\n\
  binding.fab.setOnClickListener(new View.OnClickListener() {\n    @Override\n   \
  \ public void onClick(View view) {\n        Snackbar.make(view, \"Apply Changes\
  \ is Amazing!\", Snackbar.LENGTH_LONG)\n        .setAnchorView(R.id.fab)\n     \
  \   .setAction(\"Action\", null).show();\n    }\n});\n```\n\n实现代码更改后，点击“应用代码更改”按钮，注意几秒内出现一条消息指示应用已更新。点击操作按钮，注意新消息现在显示在\
  \ Snackbar 中。\n\n## 26.7 使用应用更改并重启活动\n\n任何资源更改都将需要使用“应用更改并重启活动”选项。在 Android Studio\
  \ 中，选择 `app -> res -> layout -> fragment_first.xml` 布局文件。在布局编辑器工具的设计模式下，选择默认的 TextView\
  \ 组件，并在属性工具中将 `text` 属性更改为“Hello Android”。\n\n\n\n\n\n在点击 `Apply Code Changes` 按钮之前，请确保上述“配置应用更改回退设置”中概述的回退选项已关闭。请注意，请求失败是因为此更改涉及项目资源。点击\
  \ `Apply Changes and Restart Activity` 按钮，并验证活动已重启并在 `TextView` 小部件上显示了新文本。\n\n\
  ## 26.8 使用 Run App\n\n正如之前描述的，删除方法需要完全重新安装并重启正在运行的应用。要体验这一点，请编辑 `MainActivity.java`\
  \ 文件，并在 `onCreate` 方法之后添加一个新方法，如下：\n\n```java\npublic void demoMethod() {\n\n}\n\
  ```\n\n使用 `Apply Code Changes` 按钮，并确认更改在不重新安装应用的情况下已应用。\n\n接下来，删除新方法并验证点击两个 `Apply\
  \ Changes` 按钮中的任意一个都会导致请求失败。进行此类更改后，运行应用程序的唯一方法是点击 `Run App` 按钮。\n\n## 26.9 总结\n\
  \nApply Changes 是 Android Studio 的一项功能，旨在显著加速开发应用时的代码、构建和运行周期。`Apply Changes` 功能可以将更新推送到运行中的应用程序，在许多情况下，无需重新安装或重启应用。Apply\
  \ Changes 根据应用到项目中的修改性质提供了几个不同层次的支持。\n\n## 27. Gradle 版本目录目录指南\n\n新创建的 Android Studio\
  \ 项目将由由 Android Studio 自动生成的约 80 个文件组成。当你点击 `Run` 按钮时，Android Studio 使用一个名为 `Gradle`\
  \ 的构建系统来生成额外文件、编译源代码、解析库依赖项并创建可安装的应用程序包。构建完成后，项目文件夹将包含约 700 个文件。\n\n本章将解释 `Gradle`\
  \ 构建系统如何确定在构建过程中要包含哪些库，以及你如何使用该系统为你的项目添加库依赖项。\n\n## 27.1 库和插件依赖\n\n在之前题为“Android\
  \ 架构概述”的章节中，我们简要讨论了 Java API 框架及其包含的库。当 `Gradle` 构建项目时，它需要知道完成构建需要哪些库及其各自的版本号。例如，一个项目可能依赖于版本\
  \ 2.6.0 的 Room 数据库运行时库 (`androidx.room:room-runtime`)。遗憾的是，当我们在项目中编写 Room 数据库代码时，`Gradle`\
  \ 不会自动向构建配置中添加相应的库依赖项。相反，我们必须通过 `Gradle` 构建文件和版本目录手动添加这些。\n\n## 27.2 项目 Gradle 构建文件\n\
  \n每个 Android Studio 都有一个项目级的 `Gradle` 文件，你可以通过在项目工具窗口导航到 `Gradle Scripts` -> `build.gradle.kts()`\
  \ 来找到它。该文件的主要目的是定义执行整个项目构建工作的插件，其内容通常读取如下：\n\n```kotlin\nplugins {\n    alias(libs.plugins.android.application)\
  \ apply false\n}\n```\n\n在实践中，只有在少数情况下才需要对此文件进行更改。\n\n## 27.3 模块 Gradle 构建文件\n\n\
  Android Studio 项目由一个或多个模块组成，每个模块都有自己的构建配置和库依赖项。新项目将包含一个模块，其 `gradle` 构建文件将列在 `Gradle\
  \ Scripts` 文件夹中，显示为 `build.gradle.kts (Module: app)`，部分内容如下：\n\n```kotlin\nplugins\
  \ {\n    alias(libs.plugins.android.application) apply false\n}\n\nandroid {\n \
  \   .\n    .\n}\n\ndependencies {\n    implementation(libs.androidx.appcompat)\n\
  \    implementation(libs.material)\n    implementation(libs.androidx.activity)\n\
  \    implementation(libs.androidx.constraintlayout)\n    testImplementation(libs.junit)\n\
  \    androidTestImplementation(libs.androidx.junit)\n    androidTestImplementation(libs.androidx.espresso.core)\n\
  }\n```\n\n`plugins` 部分再次包含了构建项目所需的插件，在大多数情况下，它们将与项目级构建文件中声明的插件保持镜像。当某个模块需要其他模块不需要的插件时，会在这里进行声明。\n\
  \n`dependencies` 部分包含了模块所依赖的库列表，这些库在成功完成构建时必须被解析。\n\n## 27.4 版本目录文件\n\n早些时候我们提到除了库名称外，依赖项还必须包含库的版本号。然而，你可能已经注意到，到为止检查过的任何配置文件都不包含版本信息。这就是版本目录文件大显身的地方。版本目录可以在项目工具窗口\
  \ `Gradle Scripts` 文件夹中名为 `libs.versions.toml` 的文件中找到。下面列出了版本目录示例：\n\n```toml\n\
  [versions]\nagp = \"8.7.2\"\njunit = \"4.13.2\"\njunitVersion = \"1.2.1\"\nespressoCore\
  \ = \"3.6.1\"\nappcompat = \"1.6.1\"\nmaterial = \"1.12.0\"\nactivity = \"1.9.3\"\
  \nconstraintlayout = \"2.2.0\"\n\n[libraries]\nmaterial = { group = \"com.google.android.material\"\
  , name = \"material\", version.ref = \"material\" }\nactivity = { group = \"androidx.activity\"\
  , name = \"activity\", version.ref = \"activity\" }\n\n[plugins]\nandroid-application\
  \ = { id = \"com.android.application\", version.ref = \"agp\" }\n.\n.\n```\n\n目录被分为标记为\
  \ `[versions]`、`[libraries]` 和 `[plugins]` 的部分。为了帮助理解，我们将使用 `material` 库作为示例。版本目录可以在一个名为\
  \ `libs.versions.toml` 的文件中找到位于项目工具窗口的 `Gradle Scripts` 文件夹中。在 `[libraries]` 部分，`material`\
  \ 库被声明如下：\n\n`material = { group = \"com.google.android.material\", name = \"material\"\
  , version.ref = \"material\" }`\n\n`activity = { group = \"androidx.activity\",\
  \ name = \"activity\", version.ref = \"activity\" }`\n\n`[plugins]`\n`android-application\
  \ = { id = \"com.android.application\", version.ref = \"agp\" }`\n.\n.\n\n目录被分为标记为\
  \ `[versions]`、`[libraries]` 和 `[plugins]` 的部分。为了帮助理解版本目录如何工作，我们将使用 `material` 库作为示例。在\
  \ `[libraries]` 部分，`material` 库被声明如下：\n\n`material = { group = \"com.google.android.material\"\
  , name = \"material\", version.ref = \"material\" }`\n\n`group` 条目告诉我们库的实际名称是 `com.google.android.material`，而\
  \ `versions.ref` 赋值说明了库如何在 `[versions]` 部分中被引用。在 `[versions]` 部分，我们发现库被分配了版本 1.12.0：\n\
  \n`material = \"1.12.0\"`\n\n最后，该库在模块级构建文件中声明如下：\n\n```kotlin\ndependencies {\n\
  \    .\n    .\n    implementation(libs.material)\n}\n```\n\n注意在构建文件中引用库的语法是在 `[libraries]`\
  \ 目录使用的名称前加上 `libs.`。\n\n虽然我们在示例中关注的是库，但插件的语法是相同的。\n\n## 27.5 添加依赖项\n\n你将在多个项目中添加依赖项，在每个情况下，我们都会引导你完成这一过程。作为一个示例，将在之前的虚拟项目中演示\
  \ Room 数据库运行时依赖项。首先，我们必须在 `libs.versions.toml` 版本目录文件的 `[libraries]` 部分添加以下条目：\n\
  \n```toml\n[libraries]\n.\n.\nandroidx-roomruntime = { group = \"androidx.room\"\
  , name = \"room-runtime\", version.ref = \"roomRuntime\" }\n```\n\n接下来，将版本号添加到 `[versions]`\
  \ 目录部分：\n\n```toml\n[versions]\n.\n.\nroomRuntime = \"2.6.1\"\n```\n\n最后，将该库添加到模块级\
  \ gradle 构建文件的 `dependencies` 部分：\n\n```kotlin\ndependencies {\n    .\n    .\n \
  \   implementation(libs.androidx.room.runtime)\n}\n```\n\n另一个例子是 `androidx.navigation:navigation-fragment`\
  \ 库。在这种情况下，库的组是 `androidx.navigation`，名称是 `navigation-fragment`。该库在版本目录中的声明如下：\n\
  \n```toml\n[versions]\n.\n.\nnavigationFragment = \"2.8.3\"\n\n[libraries]\n.\n\
  .\nnavigation-fragment = { group = \"androidx.navigation\", name = \"navigation-fragment\"\
  , version.ref = \"navigationFragment\" }\n```\n\n一旦库已添加到目录，gradle 构建文件的依赖项将所示：\n\
  \n```kotlin\ndependencies {\n    .\n    .\n    implementation(libs.navigation.fragment)\n\
  }\n```\n\n\n\n\n\n## 27.6 库的更新\n\n虽然声明库和插件依赖主要是一项手动任务，但 Android Studio 会为你做的一件事是在有更新版本的库可用时通知你。它通过在你编辑目录文件时高亮版本号来实现这一点。将鼠标指针悬停在高亮的数字上将显示如图\
  \ 27-1 所示的面板，提供切换到最新版本的选项：\n\n![image-012JMLYE.jpg](img/image-012JMLYE.jpeg)\n\n\
  图 27-1\n\n## 27.7 总结\n\nAndroid Studio 项目使用 `Gradle` 构建系统进行构建，该过程涉及多个步骤。其中一个步骤是解析并包含项目成功编译所需的任何库。虽然新创建的项目将包含简单应用所必需的基础库和插件，但更复杂的项目将具有额外的依赖项。这些依赖在模块级的\
  \ `Gradle` 构建文件中声明。为了提供跨项目模块的版本一致性，并提供一个添加新库或更新版本号的单一位置，`Gradle` 使用了版本目录文件（version\
  \ catalog file）。随着你的代码使用的库和插件越来越多，你必须编辑构建文件和目录文件来添加这些依赖项。\n\n## 28. Android 事件处理概述与示例\n\
  \n在之前的章节中已经涵盖了许多关于 Android 应用用户界面设计的内容。然而，一个尚未涵盖的领域涉及用户与用户界面的交互如何触发底层 Activity 执行任务。换句话说，从之前的章节中，我们知道如何创建一个包含按钮视图的界面界面，但不知道当用户触摸它时如何让应用程序内部发生什么。\n\
  \n因此，本章的主要目标是提供 Android 应用中事件处理的概述，并结合一个基于 Android Studio 的示例项目。\n\n### 28.1 理解\
  \ Android 事件\n\nAndroid 事件可以采取多种形式，但通常是响应外部动作而生成的。常见的事件形式（特别是对于平板电脑和智能手机等设备）涉及与触摸屏的某种交互。此类事件属于输入事件类别。\n\
  \n`Android` 框架维护了一个事件队列，事件在发生时会被放入队列中。然后事件根据先进先出（FIFO）的原则从队列中移除。在发生输入事件（例如触摸屏幕）的情况下，事件将传递给位于触摸发生屏幕位置的视图。除了事件通知外，视图还会接收到关于事件性质的一系列信息（取决于事件类型），例如用户手指与屏幕接触点的坐标。\n\
  \n为了处理已传递的事件，视图必须备有一个事件监听器。源自所有用户界面组件的 `View` 类包含了一系列事件监听器接口，每个接口都包含一个回调方法的抽象声明。为了能够响应特定类型的事件，视图必须注册相应的事件监听器并实现相应的回调。例如，如果按钮要响应点击事件（等同于用户触摸并释放按钮视图，就像点击物理按钮一样），它必须同时注册\
  \ `View.onClickListener` 事件监听器（通过调用目标视图的 `setOnClickListener()` 方法）并实现相应的 `onClick()`\
  \ 回调方法。如果在按钮视图位置的屏幕上检测到“点击”事件，`Android` 框架将在该事件从事件队列中移除时调用该视图的 `onClick()` 方法。当然，任何在响应按钮点击时应执行的任务或其他方法都应该在\
  \ `onClick()` 回调方法的实现内部完成。\n\n### 28.2 使用 `android:onClick` 资源\n\n在更详细探索事件监听器之前，值得注意的是，当仅需在用户在界面上“点击”按钮视图时调用回调方法时，提供了一个快捷方法。考虑一个包含名为\
  \ `button1` 的按钮视图的用户界面布局，其要求是当用户触摸按钮时，调用 Activity 类中声明的名为 `buttonClick()` 方法。实现此行为仅需编写\
  \ `buttonClick()` 方法（其接收触发点击事件的视图引用作为参数）并在 XML 文件中按钮视图的声明中添加一行即可。例如：\n\n```xml\n\
  android:id=\"@+id/button1\"\nandroid:layout_width=\"wrap_content\"\nandroid:layout_height=\"\
  wrap_content\"\nandroid:onClick=\"buttonClick\"\nandroid:text=\"Click me\" />\n\
  ```\n\n这提供了一种捕捉点击事件的简单方法。然而，它没有提供事件处理程序所提供的范围选项，而这是本章其余部分的主题。正如后续章节概述，`onClick`\
  \ 属性在涉及 Fragment 的布局中也有局限性。在 Android Studio 布局编辑器中工作时，当设备屏幕布局中选择合适的视图类型时，可以在属性（Attributes）面板中找到并配置\
  \ `onClick` 属性。\n\n### 28.3 事件监听器和回调方法\n\n在本章稍后概述的示例 Activity 中，将详细介绍注册事件监听器和实现回调方法的步骤。但在在此之前，值得花些时间概述\
  \ `Android` 框架中可用的事件监听器以及每个监听器相关的回调方法。\n\n- `onClickListener` – 用于检测点击样式事件，即用户触摸并释放被视图占据的设备显示区域。对应\
  \ `onClick()` 回调方法，该方法将接收事件的视图引用作为参数传递。\n\n- `onLongClickListener` – 用于检测用户长时间在视图上保持触摸。对应\
  \ `onLongClick()` 回调方法，该方法将接收事件的视图作为参数传递。\n\n- `onTouchListener` – 用于检测与触摸屏的任何接触，包括单次或多点触摸和手势动作。相应的\
  \ `onTouch()` 回调将在“Android 触摸和多点事件处理”章节中详细介绍。回调方法将接收事件的视图和一个 `MotionEvent` 对象作为参数传递。\n\
  \n- `onCreateContextMenuListener` – 监听由于长按产生的上下文菜单创建。对应 `onCreateContextMenu()`\
  \ 回调方法。回调接收菜单、接收事件的视图和一个菜单上下文对象。\n\n- `onFocusChangeListener` – 检测由于与滚轮或导航键的交互导致焦点离开当前视图。对应\
  \ `onFocusChange()` 回调方法，该方法将接收事件的视图和一个指示是否获得或丢失焦点的布尔值。\n\n- `onKeyListener` – 用于检测当视图拥有焦点时按了设备上的键。对应\
  \ `onKey()` 回调方法。它将接收事件的视图、按按物理键的 `KeyCode` 和一个 `KeyEvent` 对象作为参数。\n\n### 28.4 事件处理示例\n\
  \n在本章的剩余部分中，我们将创建一个 Android Studio 项目，旨在演示如何实现事件监听器和相应的回调方法，以检测用户何时点击了按钮。回调方法中的代码将更新文本视图以指示事件已处理。\n\
  \n\n\n\n\n从欢迎界面选择 `New Project` 选项，在弹出的新项目对话框中，在点击 `Next` 按钮之前选择 `Empty Views Activity`\
  \ 模板。\n\n在 `Name` 字段中输入 `EventExample`，并指定 `com.ebookfrenzy.eventexample` 为包名。在点击\
  \ `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将 `Language`\
  \ 菜单设置为 `Java`。按照第 12.8 节“迁移项目以使用 View Binding”中列出的步骤，将项目转换为使用 view binding。\n\n\
  ### 28.5 设计用户界面\n\n本示例中 `MainActivity` 类的界面布局将包含一个 `ConstraintLayout`、一个 `Button`\
  \ 和一个 `TextView`，如图 28-1 所示。\n\n![image-C7XMRVAI.jpg](img/image-C7XMRVAI.jpeg)\n\
  \n图 28-1\n\n找到并选择 Android Studio 创建的 `activity_main.xml` 文件（位于 Project 工具窗口的 `app\
  \ -> res -> layouts` 下），并双击它将其加载到 Layout Editor 工具中。\n\n确保已启用 `Autoconnect`，然后从调色板拖入一个\
  \ `Button` 控件并移动它，使其位于布局的水平居中并在现有 `TextView` 控件下方。当位置正确时，将控件释放到目标位置，以便 autoconnect\
  \ 系统添加相应的约束条件。\n\n选择“Hello World!” `TextView` 控件，并使用 Attributes（属性）面板将 `ID` 设置为\
  \ `statusText`。重复此步骤将 `Button` 控件的 `ID` 改为 `myButton`。\n\n点击布局编辑器工具栏上的 `Infer Constraints`\
  \ 按钮以添加任何缺失的约束条件。\n\n选中 `Button` 控件的情况下，使用 Attributes 面板将 `text` 属性设置为 `Press Me`。将按钮上的文本字符串提取到名为\
  \ `press_me` 的资源中。\n\n完成用户界面布局后，下一步是注册事件监听器和回调方法。\n\n### 28.6 事件监听器和回调方法\n\n对于本示例，需要为\
  \ `myButton` 视图注册一个 `onClickListener`。这是通过调用按钮视图的 `setOnClickListener()` 方法，并将一个新的\
  \ `onClickListener` 对象作为参数传递，同时实现 `onClick()` 回调方法来实现。由于此任务只需要在创建 创建时执行，因此良好的位置是\
  \ `MainActivity` 类的 `onCreate()` 方法。\n\n如果 `MainActivity.java` 文件已在编辑器会话中打开，点击编辑器面板中的标签页选择它。或者，在\
  \ Project 工具窗口中导航到 `(app -> kotlin+java -> com.ebookfrenzy.eventexample -> MainActivity)`\
  \ 找到它，并双击将其加载到代码编辑器中。加载后，找到模板 `onCreate()` 方法并修改它以获取按钮视图的引用、注册事件监听器并实现 `onClick()`\
  \ 回调方法：\n\n```java\npackage com.ebookfrenzy.eventexample;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  \nimport android.os.Bundle;\n\nimport android.view.View;\n\nimport android.widget.Button;\n\
  \npublic class MainActivity extends AppCompatActivity {\n\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \n        .\n        .\n\n        setContentView(view);\n        binding.myButton.setOnClickListener(\n\
  \            new Button.OnClickListener() {\n                public void onClick(View\
  \ v) {\n\n                }\n            }\n        );\n    }\n\n    .\n    .\n\
  }\n```\n\n上述代码已经在按钮上注册了事件监听器并实现了 `onClick()` 方法。然而，如果此时运行应用程序，将没有任何迹象表明安装在按钮上的事件监听器正在工作，因为目前\
  \ `onClick()` 回调方法的体内尚未实现任何代码。本示例的目标是在点击按钮时在 `TextView` 上显示消息，因此需要进行进一步的代码更改：\n\n\
  ```java\n@Override\nprotected void onCreate(Bundle savedInstanceState) {\n    .\n\
  \    .\n    binding.myButton.setOnClickListener(\n        new Button.OnClickListener()\
  \ {\n            public void onClick(View v) {\n                binding.statusText.setText(\"\
  Button clicked\");\n            }\n        }\n    );\n}\n```\n\n在 AVD 模拟器或物理 Android\
  \ 设备上编译并运行应用程序以完成此教程阶段。在触摸并释放按钮视图（即“点击”）时，文本视图应该更改为显示“Button clicked”文本。\n\n## 28.7get\
  \ 事件\n\n对视图上标准点击（区别于长按）的检测是事件处理的一个简单案例。现在示例将扩展以包含对长按事件的检测，长按事件发生在用户点击并按住屏幕上的视图时，通过这涵盖了事件消费的主题。\n\
  \n考虑本章上述部分 `onClick()` 方法的代码。该回调被声明为 `void`，因此在执行完毕后它不会向 Android 框架返回任何值。\n\n另一方面，分配给\
  \ `onLongClickListener` 的代码需要向 Android 框架返回一个 `Boolean` 值。此返回值的目的是向 Android 运行时指示回调是否已消费该事件。如果回调返回\
  \ `true` 值，框架将丢弃该事件。相反，如果回调返回 `false` 值，则 Android 框架将认为事件仍然有效。\n\n正如许多编程概念一样，这通过一个示例进行演示。第一步是在\
  \ activity 中为按钮添加长按事件监听器和回调方法：\n\n```java\n@Override\nprotected void onCreate(Bundle\
  \ savedInstanceState) {\n    .\n    .\n    binding.myButton.setOnLongClickListener(\n\
  \        new Button.OnLongClickListener() {\n            public boolean onLongClick(View\
  \ v) {\n                binding.statusText.setText(\"Long click\");\n          \
  \      return true;\n            }\n        }\n    );\n}\n}\n```\n\n当检测到长按时，`onLongClick()`\
  \ 回调将在文本视图上显示“Long click”。然而，注意回调返回了 `true` 值以指示它已消费该事件。运行应用程序并按住按钮视图直到出现“Long click”文本。释放按钮时，文本视图显示“Long\
  \ click”文本，表明 onClick 监听器未调用。\n\n接下来，修改代码使 `onLongClickListener` 现在返回 `false` 值：\n\
  \n```java\nbutton.setOnLongClickListener(\n    new Button.OnLongClickListener()\
  \ {\n        public boolean onLongClick(View v) {\n            TextView myTextView\
  \ = findViewById(R.id.myTextView);\n            myTextView.setText(\"Long click\"\
  );\n            return false;\n        }\n    }\n);\n```\n\n再次编译并运行应用程序，执行长按操作直到长按消息出现。然而，这次释放按钮时，注意\
  \ `onClick` 监听器也被触发了，且文本变为“Button clicked”。这是因为 `onLongClickListener` 代码返回的 `false`\
  \ 值指示 Android 框架事件未被消费，可以传递给下一个监听器。\n\n### 28.8 总结\n\n如果界面包含的视图不对用户交互做出任何反应，那么用户界面就没有任何实际用途。Android\
  \ 通过事件监听器和回调方法的概念桥起了用户界面与应用程序后端代码之间的差距。Android `View` 类定义了一组注册在视图对象上的事件监听器。每个事件监听器都关联了一个回调方法。\n\
  \n\n\n\n当用户界面中的视图（view）上发生事件时，该事件会被放入事件队列，并由 Android 运行时按照先进先出（FIFO）原则进行处理。如果发生事件的视图注册了与事件类型匹配的监听器，就会调用相应的回调方法。该代码在返回之前会执行活动（activity）所需的任何任务。某些回调方法被要求返回一个\
  \ `Boolean` 值，以指示该事件是需要传递给注册在视图上的其他事件监听器，还是被系统丢弃。\n\n现在已经涵盖了事件处理的基础知识，下一章将探索触摸事件，并特别强调多点触摸的处理。\n\
  \n# 29. Android 触摸与多点触摸事件处理\n\n大多数基于 Android 设备使用触摸屏作为用户与设备之间的主要界面。上一章介绍了屏幕上的触摸操作如何转换为运行中的\
  \ Android 应用程序中的动作。然而，触摸事件的处理远比对视图对象上的单指点击做出响应复杂得多。例如，大多数 Android 设备可以同时检测到多个触摸点。触摸操作也不局限于设备显示器上的一点。当用户在屏幕表面滑动一个或多个接触点时，触摸操作可以是动态的。\n\
  \n应用程序还可以将触摸解释为手势。例如，水平滑动通常用于翻页电子书的页面，或者捏合动作（pinching motion）如何可以放大或缩小屏幕上显示的图像。\n\
  \n本章将解释涉及运动的触摸处理，并探索拦截多个并发触摸的概念。识别不同手势的主题将在下一章介绍。\n\n## 29.1 拦截触摸事件\n\n视图对象可以通过注册\
  \ `onTouchListener` 事件监听器并实现相应的 `onTouch()` 回调方法来拦截触摸事件。例如，以下代码确保了任何在名为 `myLayout`\
  \ 的 `ConstraintLayout` 视图实例上的触摸都会导致调用 `onTouch()` 方法：\n\n```java\nbinding.myLayout.setOnTouchListener(\n\
  \    new ConstraintLayout.OnTouchListener() {\n        public boolean onTouch(View\
  \ v, MotionEvent m) {\n            // 在此处执行任务\n            return true;\n      \
  \  }\n    }\n);\n```\n\n如代码示例所示，`onTouch()` 回调要求返回一个 `Boolean` 值，告知 Android 运行时系统是否应该将事件传递给注册在同一视图上的其他事件监听器或将其丢弃。该方法传递了触发事件的视图引用以及一个类型为\
  \ `MotionEvent` 的对象。\n\n## 29.2 MotionEvent 对象\n\n传递给 `onTouch()` 回调方法的 `MotionEvent`\
  \ 对象是获取事件信息的关键。对象中的信息包括触摸在视图中的位置以及执行的动作类型。`MotionEvent` 对象也是处理多点触摸的关键。\n\n## 29.3\
  \ 理解触摸动作\n\n触摸事件处理的一个重要方面是识别用户执行的动作类型。可以通过调用传递给 `onTouch()` 回调方法的 `MotionEvent`\
  \ 对象的 `getActionMasked()` 方法获取与事件关联的动作类型。当视图上发生第一次触摸时，`MotionEvent` 对象将包含动作类型 `ACTION_DOWN`\
  \ 以及以及触摸的坐标。当该触摸从屏幕上抬起时，会产生一个 `ACTION_UP` 事件。在 `ACTION_DOWN` 和 `ACTION_UP` 事件之间的任何触摸运动都将由\
  \ `ACTION_MOVE` 事件表示。\n\n当在视图上同时进行多次触摸时，这些触摸被称为指针（pointers）。在多点触摸的场景下，指针分别以 `ACTION_POINTER_DOWN`\
  \ 和 `ACTION_POINTER_UP` 类型的事件动作开始和结束。要识别触发事件的指针索引，必须调用 `MotionEvent` 对象的 `getActionIndex()`\
  \ 回调方法。\n\n## 29.4 处理多点触摸\n\n标题为“Android 事件处理概述与示例”的章节开始在单点触摸事件的狭窄范围内探索了事件处理。在实践中，大多数\
  \ Android 设备可以响应多个连续的触摸（尽管需要注意的是，可以检测到的同时触摸次数取决于设备）。\n\n如前所述，在多点触摸的情况下，每次触摸都被 Android\
  \ 框架视为一个指针。每个指针反过来通过一个索引值被引用并被分配一个 ID。当前的指针数量可以通过调用当前 `MotionEvent` 对象的 `getPointerCount()`\
  \ 方法获取。当前指针列表中特定索引处的指针 ID 可以通过调用 `MotionEvent.getPointerId()` 方法获取。例如，以下代码段获取了指针计数以及索引为\
  \ 0 的指针的 ID：\n\n```java\npublic boolean onTouch(View v, MotionEvent m) {\n    int\
  \ pointerCount = m.getPointerCount();\n    int pointerId = m.getPointerId(0);\n\
  \    return true;\n}\n```\n\n注意，当 `onTouch` 监听器被触发时，指针计数将始终大于或等于 1（因为回调的触发意味着至少发生了一次触摸）。\n\
  \n视图上的触摸，特别是涉及跨屏幕运动的触摸，会在接触点从屏幕抬起之前产生一系列事件。应用程序可能需要在多个触摸事件期间跟踪单个触摸。虽然特定触摸手势的 ID\
  \ 不会从一个事件变到另一个事件，但重要的是要记住，随着其他触摸事件的到来和离开，索引值会发生变化。在跨多个事件处理触摸手势时，必须使用 ID 值作为触摸引用。当调用需要索引值的方法时，应该通过调用\
  \ `MotionEvent` 对象的 `findPointerIndex()` 方法将 ID 转换为相应的索引值。\n\n## 29.5 多点触摸应用程序示例\n\
  \n在本章剩余部分创建的示例应用程序将跟踪跨布局视图移动的两个触摸手势。当每个触摸的事件触发时，每个触摸的坐标、索引和 ID 将显示在屏幕上。\n\n\n\n\n\
  拖入第二个 `TextView` 小控件，并对其进行定位和约束，使其与第一个小控件之间保持 32dp 的间距：\n\n![image-U9E4AE8D.jpg](img/image-U9E4AE8D.jpeg)\n\
  \n图 29-2\n\n使用 `Attributes` 属性窗口，将 `TextView` 小控件的 ID 分别更改为 `textView1` 和 `textView2`。将控件上显示的文本更改为“Touch\
  \ One Status”和“Touch Two Status”，并使用 `Layout Editor` 右角的警告按钮将字符串提取到资源文件中。\n\n##\
  \ 29.7 实现触摸事件监听器\n\n为了接收触摸事件通知，有必要在 `MainActivity` 类的 `onCreate()` 方法中对布局视图注册触摸监听器。从\
  \ Android Studio 编辑器面板中选择 `MainActivity.java` 标签页以显示源代码。在 `onCreate()` 方法中，添加代码来注册触摸监听器并实现代码，在此情况下，该代码将调用一个名为\
  \ `handleTouch()` 的第二个方法，并向其传递 `MotionEvent` 对象：\n\n```java\npackage com.ebookfrenzy.motionevent;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\nimport androidx.constraintlayout.widget.ConstraintLayout;\n\
  import android.os.Bundle;\nimport android.view.MotionEvent;\nimport android.view.View;\n\
  import com.ebookfrenzy.motionevent.databinding.ActivityMainBinding;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n\n    private ActivityMainBinding binding;\n\
  \n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n    \
  \    .\n        .\n        setContentView(view);\n        binding.main.setOnTouchListener(\n\
  \            new ConstraintLayout.OnTouchListener() {\n                public boolean\
  \ onTouch(View v, MotionEvent m) {\n                    handleTouch(m);\n      \
  \              return true;\n                }\n            }\n        );\n    }\n\
  }\n```\n\n当我们在设计用户界面时，父布局 `ConstraintLayout` 没有分配允许我们通过视图绑定机制访问它的 ID。由于此布局组件是 UI\
  \ 布局层次结构中的最顶层组件，我们能够使用上述代码中的根绑定属性来引用它。\n\n在测试应用程序之前，最后一个任务是实现由监听器调用的 `handleTouch()`\
  \ 方法。该方法的代码如下：\n\n```java\nvoid handleTouch(MotionEvent m) {\n    int pointerCount\
  \ = m.getPointerCount();\n    for (int i = 0; i < pointerCount; i++)\n    {\n  \
  \      int x = (int) m.getX(i);\n        int y = (int) m.getY(i);\n        int id\
  \ = m.getPointerId(i);\n        int action = m.getActionMasked();\n        int actionIndex\
  \ = m.getActionIndex();\n        String actionString;\n        switch (action)\n\
  \        {\n            case MotionEvent.ACTION_DOWN:\n                actionString\
  \ = \"DOWN\";\n                break;\n            case MotionEvent.ACTION_UP:\n\
  \                actionString = \"UP\";\n                break;\n            case\
  \ MotionEvent.ACTION_POINTER_DOWN:\n                actionString = \"PNTR DOWN\"\
  ;\n                break;\n            case MotionEvent.ACTION_POINTER_UP:\n   \
  \             actionString = \"PNTR UP\";\n                break;\n            case\
  \ MotionEvent.ACTION_MOVE:\n                actionString = \"MOVE\";\n         \
  \       break;\n            default:\n                actionString = \"\";\n   \
  \     }\n        String touchStatus = \"Action: \" + actionString + \" Index: \"\
  \ + actionIndex + \" ID: \" + id + \" X: \" + x + \" Y: \" + y;\n        if (id\
  \ == 0)\n            binding.textView1.setText(touchStatus);\n        else\n   \
  \         binding.textView2.setText(touchStatus);\n    }\n}\n```\n\n在编译和运行应用程序之前，值得花时间系统地梳理这段代码，以突出所执行的任务。\n\
  \n代码首先获取用户界面中两个 `TextView` 对象的引用，并识别当前视图上有多少个活动指针：\n\n```java\nTextView textView1\
  \ = findViewById(R.id.textView1);\nTextView textView2 = findViewById(R.id.textView2);\n\
  int pointerCount = m.getPointerCount();\n```\n\n接下来，变量 `pointerCount` 启动了一个 `for`\
  \ 循环，每个活动指针执行任务。循环的前几行获取了触摸的 `X` 和 `Y` 坐标，以及相应的事件 ID、动作类型和动作索引。最后，声明了一个字符串变量：\n\n\
  ```java\nfor (int i = 0; i < pointerCount; i++)\n{\n    int x = (int) m.getX(i);\n\
  \    int y = (int) m.getY(i);\n    int id = m.getPointerId(i);\n    int action =\
  \ m.getActionMasked();\n    int actionIndex = m.getActionIndex();\n    String actionString;\n\
  ```\n\n由于动作类型等于整数值，因此使用 `switch` 语句将动作类型转换为更有意义的字符串值，并存储在之前声明的 `actionString` 变量中：\n\
  \n```java\nswitch (action)\n{\n    case MotionEvent.ACTION_DOWN:\n        actionString\
  \ = \"DOWN\";\n        break;\n    case MotionEvent.ACTION_UP:\n        actionString\
  \ = \"UP\";\n        break;\n    case MotionEvent.ACTION_POINTER_DOWN:\n       \
  \ actionString = \"PNTR DOWN\";\n        break;\n    case MotionEvent.ACTION_POINTER_UP:\n\
  \        actionString = \"PNTR UP\";\n        break;\n    case MotionEvent.ACTION_MOVE:\n\
  \        actionString = \"MOVE\";\n        break;\n    default:\n        actionString\
  \ = \"\";\n}\n```\n\n最后，通过 `actionString`、索引、ID、X 和 Y 构造了一个触摸状态字符串。如果 `id` 等于 0，则设置\
  \ `textView1`，否则设置 `textView2`：\n\n```java\nString touchStatus = \"Action: \" +\
  \ actionString + \" Index: \" + actionIndex + \" ID: \" + id + \" X: \" + x + \"\
  \ Y: \" + y;\nif (id == 0)\n    binding.textView1.setText(touchStatus);\nelse\n\
  \    binding.textView2.setText(touchStatus);\n```\n\n## 29.8 运行应用程序\n\n在编译和运行应用程序之前，值得花时间系统地梳理这段代码，以突出所执行的任务。代码首先获取用户界面中两个\
  \ `TextView` 对象的引用，并识别当前视图上有多少个活动指针：\n\n```java\nTextView textView1 = findViewById(R.id.textView1);\n\
  TextView textView2 = findViewById(R.id.textView2);\nint pointerCount = m.getPointerCount();\n\
  ```\n\n接下来，变量 `pointerCount` 启动了一个 `for` 循环，每个活动指针执行任务。循环的前几行获取了触摸的 `X` 和 `Y` 坐标，以及相应的事件\
  \ ID、动作类型和动作索引。最后，声明了一个字符串变量：\n\n```java\nfor (int i = 0; i < pointerCount; i++)\n\
  {\n    int x = (int) m.getX(i);\n    int y = (int) m.getY(i);\n    int id = m.getPointerId(i);\n\
  \    int action = m.getActionMasked();\n    int actionIndex = m.getActionIndex();\n\
  \    String actionString;\n```\n\n由于动作类型等于整数值，因此使用 `switch` 语句将动作类型转换为更有意义的字符串值，并存储在之前声明的\
  \ `actionString` 变量中：\n\n```java\nswitch (action)\n{\n    case MotionEvent.ACTION_DOWN:\n\
  \        actionString = \"DOWN\";\n        break;\n    case MotionEvent.ACTION_UP:\n\
  \        actionString = \"UP\";\n        break;\n    case MotionEvent.ACTION_POINTER_DOWN:\n\
  \        actionString = \"PNTR DOWN\";\n        break;\n    case MotionEvent.ACTION_POINTER_UP:\n\
  \        actionString = \"PNTR UP\";\n        break;\n    case MotionEvent.ACTION_MOVE:\n\
  \        actionString = \"MOVE\";\n        break;\n    default:\n        actionString\
  \ = \"\";\n}\n```\n\n最后，通过 `actionString`、索引、ID、X 和 Y 构造了一个触摸状态字符串。`ID` 值随后用于判断字符串应该显示在第一个还是第二个\
  \ `TextView` 上：\n\n```java\nString touchStatus = \"Action: \" + actionString + \"\
  \ Index: \" + actionIndex + \" ID: \" + id + \" X: \" + x + \" Y: \" + y;\nif (id\
  \ == 0)\n    binding.textView1.setText(touchStatus);\nelse\n    binding.textView2.setText(touchStatus);\n\
  ```\n\n## 29.9 总结\n\nActivity 通过注册触摸监听器并实现 `onTouch()` 回调方法来接收触摸事件通知，该方法在调用时会传递\
  \ `MotionEvent` 对象。该对象包含了有关触摸的信息，例如事件类型、坐标以及当前接触点的数量。当涉及多个触摸时，每个接触点被称为一个指针，每个指针都被分配了一个索引和一个\
  \ ID。虽然指针的索引可能会随事件发生变化，但 ID 在触摸结束之前将保持不变。\n\n\n\n\n\n当用户与 Android 设备的屏幕进行交互时，系统会调用当前活跃应用程序的\
  \ `onTouchEvent()` 方法，并传递包含用户接触屏幕数据的 `MotionEvent` 对象。这些数据可以被解析，用以识别屏幕上的动作是否匹配常见的手势（如点击或滑动）。通过使用\
  \ `GestureDetector` 类，可以用极少的编程工作实现这一目标。该类设计用于接收应用程序的运动事件信息，并根据检测到的（如果有的话）常见手势类型触发方法调用。\n\
  \n检测常见手势的基本步骤如下：\n\n1. 声明一个实现 `GestureDetector.OnGestureListener` 接口的类，包括所需的 `onFling()`、`onDown()`、`onScroll()`、`onShowPress()`、`onSingleTapUp()`\
  \ 和 `onLongPress()` 回调方法。注意，这可以是一个全新的类，也可以是一个嵌套的 Activity 类。如果需要检测双击手势，该类还必须实现 `GestureDetector.OnDoubleTapListener`\
  \ 接口并包含相应的 `onDoubleTap()` 方法。\n2. 创建 Android `GestureDetector` 类的实例，并将步骤 1 中创建的类实例作为参数传递。\n\
  3. 可选调用 `GestureDetector` 实例的 `setOnDoubleTapListener()` 方法，如果需要则启用双击检测。\n4. 在嵌套的\
  \ Activity 中实现 `onTouchEvent()` 回调方法，该方法反过来必须调用 `GestureDetector` 实例的 `onTouchEvent()`\
  \ 方法并将并将运动事件对象作为参数传递给该方法。\n\n一旦实现，应用程序代码中的一组方法，当检测到特定类型的手势时就会调用这些方法。这些方法内部的代码可以被用于执行响应相应手势需要执行的任何任务。\n\
  \n在本章的剩余部分中，我们将创建一个示例项目，旨在将上述步骤付诸实践。\n\n## 30.2 创建示例手势检测项目\n\n此项目旨在检测 `GestureDetector`\
  \ 类目前支持的所有常见手势，并向用户显示状态信息，以指示检测到的手势类型。\n\n从欢迎界面选择“New Project”（新建项目）选项，在出现的新项目对话框中，点击“Next”（下一步）按钮之前选择“Empty\
  \ Views Activity”模板。\n\n在 `Name` 字段中输入 `CommonGestures`，并指定 `com.ebookfrenzy.commongestures`\
  \ 为包名。在点击“Finish”（完成）按钮之前，将 Minimum API level 设置更改为 `API 26: Android 8.0 (Oreo)`，并将\
  \ Language 菜单改为 `Java`。\n\n按照第 12.8 节“Migrating a Project to View Binding”中的概述，调整项目以使用\
  \ view binding。\n\n一旦创建新项目，在 Project 工具窗口中导航到 `app -> res -> layout -> activity_main.xml`\
  \ 文件并双击它，将其加载到 Layout Editor 工具中。\n\n在 Layout Editor 工具中，选择“Hello, World!” `TextView`\
  \ 组件，并在 Attributes 工具窗口中输入 `gestureStatusText` 作为 ID。最后，将 `textSize` 设置为 `20sp`\
  \ 并启用粗体 `textStyle`：\n\n![image-LU2GODXX.jpg](img/image-LU2GODXX.jpeg)\n\n图 30-1\n\
  \n## 30.3 实现监听器类\n\n如前所述，有必要创建一个实现 `GestureDetector.OnGestureListener` 接口的类，如果需要双击检测，则还需要实现\
  \ `GestureDetector.OnDoubleTapListener` 接口。虽然这可以是一个全新的类，但在当前 Activity 类中实现也是完全有效的。因此，我们将修改\
  \ `MainActivity` 类以便在此示例实现这些监听器接口。编辑 `MainActivity.java` 文件，使其内容如下：\n\n```java\n\
  package com.ebookfrenzy.commongestures;\n\nimport android.view.GestureDetector;\n\
  \n.\n.\n\npublic class MainActivity extends AppCompatActivity\nimplements GestureDetector.OnGestureListener,\n\
  GestureDetector.OnDoubleTapListener\n{\n.\n.\n}\n```\n\n声明类实现了监听器接口意味着类中也必须实现相应的方法：\n\
  \n```java\npackage com.ebookfrenzy.commongestures;\n\n.\n.\nimport android.view.MotionEvent;\n\
  \npublic class MainActivity extends AppCompatActivity\nimplements GestureDetector.OnGestureListener,\n\
  GestureDetector.OnDoubleTapListener {\n\n.\n.\n\n@Override\npublic boolean onDown(MotionEvent\
  \ event) {\n    binding.gestureStatusText.setText (\"onDown\");\n    return true;\n\
  }\n\n@Override\npublic boolean onFling(MotionEvent event1, MotionEvent event2,\n\
  \    float velocityX, float velocityY) {\n    binding.gestureStatusText.setText(\"\
  onFling\");\n    return true;\n}\n\n@Override\npublic void onLongPress(MotionEvent\
  \ event) {\n    binding.gestureStatusText.setText(\"onLongPress\");\n}\n\n@Override\n\
  public boolean onScroll(MotionEvent e1, MotionEvent e2,\n    float distanceX, float\
  \ distanceY) {\n    binding.gestureStatusText.setText(\"onScroll\");\n    return\
  \ true;\n}\n\n@Override\npublic void onShowPress(MotionEvent event) {\n    binding.gestureStatusText.setText(\"\
  onShowPress\");\n}\n\n@Override\npublic boolean onSingleTapUp(MotionEvent event)\
  \ {\n    binding.gestureStatusText.setText(\"onSingleTapUp\");\n    return true;\n\
  }\n\n@Override\npublic boolean onDoubleTap(MotionEvent event) {\n    binding.gestureStatusText.setText(\"\
  onDoubleTap\");\n    return true;\n}\n\n@Override\npublic boolean onTapEvent(MotionEvent\
  \ event) {\n    binding.gestureStatusText.setText(\"onTapEvent\");\n    return true;\n\
  }\n\n@Override\npublic boolean onSingleTapConfirmed(MotionEvent event) {\n    binding.gestureStatusText.setText(\"\
  onSingleTapConfirmed\");\n    return true;\n}\n\n.\n.\n}\n```\n\n注意这些许多方法返回了 `true`。这告诉\
  \ Android 框架该方法已处理了事件，不需要传递给下一个事件处理器。\n\n## 30.4 创建 GestureDetector 实例\n\n在 Activity\
  \ 类实现了监听器接口后，下一步是创建 `GestureDetector` 实例。由于这只需要在创建时执行一次，最佳位置是 `onCreate()` 方法。由于我们还想检测双击，代码还需要调用\
  \ `GestureDetector` 实例的 `setOnDoubleTapListener()` 方法：\n\n```java\n.\n.\npublic\
  \ class MainActivity extends AppCompatActivity\nimplements GestureDetector.OnGestureListener,\n\
  GestureDetector.OnDoubleTapListener {\n\n    private ActivityMainBinding binding;\n\
  \    private GestureDetector gDetector;\n\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        .\n\
  .\n        this.gDetector = new GestureDetector(this,this);\n        gDetector.setOnDoubleTapListener(this);\n\
  \    }\n\n.\n.\n}\n```\n\n## 30.5 实现 onTouchEvent() 方法\n\n如果此时编译并运行应用程序，在设备上执行手势都不会发生任何事情。这是因为还没有添加代码来拦截事件并将其传递给\
  \ `GestureDetector` 实例。为了实现这一点，有必要在 Activity 类中重写 `onTouchEvent()` 方法，并使其调用 `GestureDetector`\
  \ 实例的 `onTouchEvent()` 方法。在 `MainActivity.java` 文件中，因此实现该方法如下：\n\n```java\n@Override\n\
  public boolean onTouchEvent(MotionEvent event) {\n    this.gDetector.onTouchEvent(event);\n\
  \    // 确保调用类的实现\n    return super.onTouchEvent(event);\n}\n```\n\n## 30.6 测试应用程序\n\
  \n在物理 Android 设备或 AVD 模拟器上编译并运行应用程序。启动后，尝试滑动、按下、滚动动作以及双击和单击。注意文本视图会更新以反映事件，如图 30-2\
  \ 所示：\n\n![image-DFIKRI2Y.jpg](img/image-DFIKRI2Y.jpeg)\n\n图 30-2\n\n\n\n\n\n##\
  \ 30.7 总结\n\n用户与设备触摸屏器之间的任何物理接触都可以视为一种“手势”。由于缺乏传统计算机系统的物理键盘和鼠标指针，手势被广泛用作用户与应用程序之间交互的方法。虽然一个手势可以包含任何序列的动作，但有一套广泛使用的手势集，触摸屏设备的用户对它们已经非常熟悉。这些所谓的“常用手势”中的一些，可以通过\
  \ `Android Gesture Detector` 类在应用程序中轻松检测到。在本章中，我们已经从理论和通过示例项目实现两个方面概述了该技术的使用。\n\n\
  在本章涵盖了常用手势之后，下一章将介绍检测更广泛的手势类型，包括设计和检测您自定义手势的能力。\n\n# 31. 在 Android 上实现自定义手势和双缩放识别\n\
  \n上一章涵盖了在 Android 应用程序内部检测所谓的“常用手势”。然而，在实践中，一个手势在理论上可能涉及 Android 设备屏幕上几乎任何序列的触摸动作。为此此，`Android\
  \ SDK` 允许应用程序开发者定义几乎任何性质的自定义手势，并在用户执行时触发事件。这是一个多阶段的过程，其细节是本章的主题。\n\n## 31.1 Android\
  \ Gesture Builder 应用程序\n\n`Android SDK` 允许开发者设计自定义手势，这些手势存储在与 Android 应用程序包捆绑的手势文件中。这些自定义手势文件可以通过\
  \ `Gesture Builder` 应用程序最地创建。创建手势文件涉及在物理设备或模拟器上启动 `Gesture Builder` 应用程序，并在灰色画布上“绘制”应用程序需要检测的手势。一旦设计好手势，就可以下载包含手势数据的文件并添加到应用程序项目中。在应用程序代码中，该文件被加载到\
  \ `GestureLibrary` 类的实例中，该实例可用于搜索用户在设备屏幕上执行的任何手势的匹配。\n\n## 31.2 GestureOverlayView\
  \ 类\n\n为了方便在应用程序内检测手势，`Android SDK` 提供了 `GestureOverlayView` 类。这个透明视图可以放在用户界面的其他视图之上以检测手势。\n\
  \n## 31.3 检测手势\n\n手势的检测是通过加载使用 `Gesture Builder` 应用创建的手势文件，然后在 `GestureOverlayView`\
  \ 类的实例上注册 `GesturePerformedListener` 事件监听器来实现的。然后声明封装类实现 `OnGesturePerformedListener`\
  \ 接口以及该接口所需的 `onGesturePerformed` 回调方法。如果监听器检测到手势，Android 运行时系统将触发调用 `onGesturePerformed`\
  \ 回调。\n\n## 31.4 识别特定手势\n\n当检测到手势时，会调用 `onGesturePerformed` 回调方法，并将检测到手势的 `GestureOverlayView`\
  \ 对象的引用以及包含手势信息的 `Gesture` 对象作为参数。\n\n通过访问 `Gesture` 对象，`GestureLibrary`可以将检测到的手势与之前加载到应用程序的手势文件中所包含的手势进行比较。`GestureLibrary`\
  \ 通过计算每个手势的预测分，报告用户执行的手势与手势文件中的条目匹配的概率。预测分为 `1.0` 或更高通常被接受为文件中存储的手势与用户在设备屏幕上执行的手势之间的良好匹配。\n\
  \n## 31.5 安装并运行 Gesture Builder 应用程序\n\n创建手势文件最简单的方法是使用允许捕和保存手势动作的应用程序。虽然 Google\
  \ 最初提供了一个用于此目的的应用程序，但它在较新版本的 Android 上已没有得到充分维护。幸运的是，可以通过 `Gesture Builder Tool`\
  \ 应用程序提供替代方案，该程序可以在 Google Play 商店的以下 URL 获取：\n\n`https://play.google.com/store/apps/details?id=migueldp.runeforge`\n\
  \n## 31.6 创建手势文件\n\n一旦 `Gesture Builder Tool` 加载，点击设备屏幕底部的 `Create New Gesture`\
  \ 按钮，并在灰色画布上使用圆周运动“绘制”手势，如图 31-1 所示。假设手势显示正确（由设备屏幕上的黄色线条表示），点击保存按钮将手势添加到手势文件中，在提示输入名称时输入“Circle\
  \ Gesture”：\n\n![image-26K07KT6.jpg](img/image-26K07KT6.jpeg)\n\n图 31-1\n\n手势保存后，`Gesture\
  \ Builder Tool` 将显示当前定义的手势列表，该列表将仅包含新的 Circle Gesture。\n\n## 31.7 创建示例项目\n\n从欢迎界面选择\
  \ `New Project` 选项，在生成的新项目对话框中，在点击 `Next` 按钮之前选择 `Empty Views Activity` 模板。\n\n\
  在 `Name` 字段中输入 `CustomGestures`，并指定 `com.ebookfrenzy.customgestures` 为包名。在点击 `Finish`\
  \ 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将 `Language` 菜单改为\
  \ `Java`。按照第 12.8 节迁移项目到 View Binding 的所述调整项目使用 view binding。\n\n## 31.8 从 SD 卡中提取手势文件\n\
  \n由于每个手势都是在 `Gesture Builder` 应用程序中创建的，它们被添加到名为 `gesture.txt` 的文件中，该文件位于运行应用程序的模拟器或设备的存储中。然而，在此文件添加到\
  \ Android Studio 项目之前，必须将其从设备存储中拷贝出来。这通过 Android Studio 的 `Device File Explorer`\
  \ 工具窗口最容易实现。使用 `View -> Tool Windows -> Device File Explorer` 显示该工具。显示后，从下拉菜单中选择创建手势文件的设备或模拟器，然后导航到以下文件夹：\n\
  \n`/storage/emulated/0/Android/data/migueldp.runeforge/files/gestures.txt`\n\n在此文件夹中找到\
  \ `gesture.txt` 文件，右键点击它，选择 `Save As…` 选项，将其保存到临时位置并命名为 `gestures`。\n\n![image-9E6FPECS.jpg](img/image-9E6FPECS.jpeg)\n\
  \n图 31-2\n\n一旦手势文件创建并从设备存储提取，就可以作为资源文件添加到 Android Studio 项目。\n\n## 31.9 将手势文件添加到项目\n\
  \n在 Android Studio 项目窗口中，找到并右键点击 `res` 文件夹（位于 `app` 下），从生成的菜单中选择 `New -> Directory`。在\
  \ `New Directory` 对话框中输入 `raw` 作为文件夹名并按回车键。使用适用于您操作系统的文件管理器，找到之前从设备存储提取的手势文件，将其复制并粘贴到项目窗口中新的\
  \ `raw` 文件夹中。\n\n## 31.10 设计用户界面\n\n此示例应用程序需要由 `ConstraintLayout` 视图组成，在其上方叠加 `GestureOverlayView`\
  \ 以拦截用户执行的任何手势。找到 `app -> res -> layout -> activity_main.xml` 文件，双击它将其加载到 Layout\
  \ Editor 工具中，选择并删除默认的 `TextView` 小部件。\n\n切换布局编辑器的 Code 模式并修改 XML 使其如下：\n\n```xml\n\
  xmlns:android=\"http://schemas.android.com/apk/res/android\"\n```\n\n\n\n\n\n```xml\n\
  xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    tools:context=\".MainActivity\" >\n    android:id=\"@+id/gOverlay\"\n    android:layout_width=\"\
  0dp\"\n    android:layout_height=\"0dp\"\n    app:layout_constraintBottom_toBottomOf=\"\
  parent\"\n    app:layout_constraintEnd_toEndOf=\"parent\"\n    app:layout_constraintStart_toStartOf=\"\
  parent\"\n    app:layout_constraintTop_toTopOf=\"parent\" />\n```\n\n## 31.11 加载手势文件\n\
  \n既然手势文件已经添加到项目中，下一步是编写一些代码在 Activity 启动时加载该文件。对于本项目，实现此目的的代码将如下所示添加到到 `MainActivity`\
  \ 类中：\n\n```java\npackage com.ebookfrenzy.customgestures;\n\nimport android.gesture.GestureLibraries;\n\
  import android.gesture.GestureLibrary;\nimport android.gesture.GestureOverlayView;\n\
  import android.gesture.GestureOverlayView.OnGesturePerformedListener;\n\npublic\
  \ class MainActivity extends AppCompatActivity\n    implements OnGesturePerformedListener\
  \ {\n\n    private ActivityMainBinding binding;\n    private GestureLibrary gLibrary;\n\
  \n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n    \
  \    super.onCreate(savedInstanceState);\n        gestureSetup();\n    }\n\n   \
  \ private void gestureSetup() {\n        gLibrary = GestureLibraries.fromRawResource(this,\
  \ R.raw.gestures);\n        if (!gLibrary.load()) {\n            finish();\n   \
  \     }\n    }\n}\n```\n\n除了一些必要的导入指令外，上述代码还创建了一个名为 `gLibrary` 的 `GestureLibrary`\
  \ 实例，然后将位于 raw 资源文件夹的手势文件内容加载到其中。Activity 类也经过修改以实现 `OnGesturePerformedListener`\
  \ 接口，这需要添加 `onGesturePerformed` 回调方法（该方法将在本章节之后创建）。\n\n## 31.12 注册事件监听器\n\n为了让 Activity\
  \ 接收到用户在屏幕上执行手势的通知，必须按照如下代码段所示，在 `gLayout` 视图上注册 `OnGesturePerformedListener` 事件监听器：\n\
  \n```java\nprivate void gestureSetup() {\n    gLibrary = GestureLibraries.fromRawResource(this,\
  \ R.raw.gestures);\n    if (!gLibrary.load()) {\n        finish();\n    }\n    binding.gOverlay.addOnGesturePerformedListener(this);\n\
  }\n```\n\n## 31.13 实现 onGesturePerformed 方法\n\n在应用程序进行首次测试之前，剩下的工作就是实现 `onGesturePerformed`\
  \ 回调方法。当在 `GestureOverlayView` 实例上执行手势时，就会调用此方法：\n\n```java\npackage com.ebookfrenzy.customgestures;\n\
  \nimport android.gesture.Prediction;\nimport android.widget.Toast;\nimport android.gesture.Gesture;\n\
  import java.util.ArrayList;\n\npublic class MainActivity extends AppCompatActivity\
  \ implements OnGesturePerformedListener {\n    private GestureLibrary gLibrary;\n\
  \n    public void onGesturePerformed(GestureOverlayView overlay, Gesture gesture)\
  \ {\n        ArrayList predictions = gLibrary.recognize(gesture);\n        if (!predictions.isEmpty()\
  \ && predictions.get(0).score > 1.0) {\n            String action = predictions.get(0).name;\n\
  \            Toast.makeText(this, action, Toast.LENGTH_SHORT).show();\n        }\n\
  \    }\n}\n```\n\n当 Android 运行时在手势覆盖层视图对象检测到手势时，就会调用 `onGesturePerformed` 方法。作为参数传递的是检测到手势的\
  \ `GestureOverlayView` 对象的引用，以及一个 `Gesture` 类型的对象。`Gesture` 类用于持有定义特定手势的信息（本质上是屏幕上描述组成手势的笔触路径的一系列定时点）。\n\
  \n`Gesture` 对象被传递给 `gLibrary` 实例的 `recognize()` 方法，以便将当前手势与从手势文件中加载的每个手势进行比较。一旦任务完成，`recognize()`\
  \ 方法将返回一个 `ArrayList` 对象，其中包含每次比较执行对应的 `Prediction` 对象。列表按照从最佳匹配（数组位置 0）到最差匹配的顺序排序。每个预测对象中包含了手势文件中对应手势的名称，以及一个指示其与当前手势匹配密切程度的预测评分。\n\
  \n因此，上述方法中的代码获取位置 0 处的预测（最接近的匹配），确保其评分大于 1.0，然后显示一个 `Toast` 消息（一种设计用于向用户显示弹出通知的\
  \ Android 类），显示匹配手势的名称。\n\n## 31.14 测试应用程序\n\n在模拟器或物理 Android 设备上构建并运行应用程序，然后在显示器上执行圆圈手势。执行时，应该出现包含检测到的手势名称的\
  \ toast 通知。请注意，当手势被识别时，会在显示器上用亮黄色线条勾勒，而覆盖层不确定的手势则显示为浅黄色线条。虽然这在开发期间有用，但对于实际应用来说可能并不理想。因此，仍然有一些更多的配置工作需要完成。\n\
  \n## 31.15 配置 GestureOverlayView\n\n默认情况下，`GestureOverlayView` 配置为在手势期间显示黄色线条。绘制识别和未识别手势的颜色可以通过\
  \ `android:gestureColor` 和 `android:uncertainGestureColor` 属性来定义。例如，为了隐藏手势线条，按如下修改项目中的\
  \ `activity_main.xml` 文件：\n\n```xml\nandroid:id=\"@+id/gOverlay\"\n    android:layout_width=\"\
  0dp\"\n    android:layout_height=\"0dp\"\n    app:layout_constraintBottom_toBottomOf=\"\
  parent\"\n    app:layout_constraintEnd_toEndOf=\"parent\"\n    app:layout_constraintStart_toStartOf=\"\
  parent\"\n    app:layout_constraintTop_toTopOf=\"parent\"\n    android:gestureColor=\"\
  #000000\"\n    android:uncertainGestureColor=\"#000000\"\n```\n\n重新运行应用程序时，手势应该是不可见的（因为它们绘制在\
  \ `ConstraintLayout` 的白色背景上）。\n\n## 31.16 拦截手势\n\n如前所述，`GestureOverlayView` 是位于其他视图之上的透明覆盖层。这产生了一个问题：当手势被识别时，覆盖层拦截的事件是否应该传递给底层视图。这通过\
  \ `GestureOverlayView` 实例的 `android:eventsInterceptionEnabled` 属性来控制。设置为 true 时，手势事件将不会传递给底层视图。当手势在配置为响应特定手势的视图上执行时，这是一个特别有用的设置。将此属性设置为\
  \ true 可以避免手势同时被解释为底层视图向特定方向滚动的指令。\n\n- 在离开通用的触摸处理和特定的手势识别之前，本章的最后一个主题是处理缩放手势。虽然可以使用本章之前章节概述的步骤创建并检测各种手势，但实际上，使用目前讨论的技术无法检测缩放手势（使用手指进行拉伸和收缩动作，通常用于放大或缩小视图或图像）。\n\
  \n检测缩放手势的最简单方法是使用 Android `ScaleGestureDetector` 类。通常来说，检测缩放手势涉及以下三个步骤：\n\n1. 定义实现\
  \ `SimpleOnScaleGestureListener` 接口的新类，包括所需的 `onScale()`、`onScaleBegin()` 和 `onScaleEnd()`\
  \ 回调方法。\n2. 创建 `ScaleGestureDetector` 类的实例，并将步骤 1 创建的类实例作为参数传递。\n\n\n\n\n\n## 3.\
  \ 在所属 Activity 中实现 `onTouchEvent()` 回调方法，该方法将调用 `ScaleGestureDetector` 类的 `onTouchEvent()`\
  \ 方法。\n\n在本章的剩余部分，我们将创建一个示例，用于演示缩放手势识别的实现。\n\n## 31.18 缩放手势示例项目\n\n从欢迎屏幕选择 New Project\
  \ 选项，在弹出的新项目对话框中选择 `Empty Views Activity` 模板，然后点击 `Next` 按钮。\n\n在 `Name` 字段中输入 `PinchExample`\
  \ 并指定 `com.ebookfrenzy.pinchexample` 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level`\
  \ 设置为 `API 26: Android 8.0 (Oreo)`，并将 `Language` 菜单设置为 `Java`。按照 `12.8 Migrating\
  \ a Project to View Binding` 中的步骤将项目转换为使用 view binding。\n\n在 `activity_main.xml`\
  \ 文件中，选择默认的 `TextView` 对象并使用 `Attributes` 工具窗口将 `ID` 设置为 `myTextView`。\n\n找到并将 `MainActivity.java`\
  \ 文件加载到 Android Studio 编辑器中，并按所示修改文件：\n\n```java\npackage com.ebookfrenzy.pinchexample;\n\
  \n.\n\n.\n\nimport android.view.MotionEvent;\n\nimport android.view.ScaleGestureDetector;\n\
  \nimport android.view.ScaleGestureDetector.SimpleOnScaleGestureListener;\n\npublic\
  \ class MainActivity extends AppCompatActivity {\n    private ActivityMainBinding\
  \ binding;\n\n    ScaleGestureDetector scaleGestureDetector;\n\n    @Override\n\
  \    protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  .\n        .\n\n        scaleGestureDetector =\n        new ScaleGestureDetector(this,\n\
  \        new MyOnScaleGestureListener());\n    }\n\n    @Override\n    public boolean\
  \ onTouchEvent(MotionEvent event) {\n        scaleGestureDetector.onTouchEvent(event);\n\
  \        return true;\n    }\n\n    public class MyOnScaleGestureListener extends\n\
  \    SimpleOnScaleGestureListener {\n\n        @Override\n        public boolean\
  \ onScale(ScaleGestureDetector detector) {\n            float scaleFactor = detector.getScaleFactor();\n\
  \            if (scaleFactor > 1) {\n                binding.myTextView.setText(\"\
  Zooming In\");\n            } else {\n                binding.myTextView.setText(\"\
  Zooming Out\");\n            }\n            return true;\n        }\n\n        @Override\n\
  \        public boolean onScaleBegin(ScaleGestureDetector detector) {\n        \
  \    return true;\n        }\n\n        @Override\n        public void onScaleEnd(ScaleGestureDetector\
  \ detector) {\n        }\n    }\n.\n.\n}\n```\n\n该代码声明了一个名为 `MyOnScaleGestureListener`\
  \ 的新类，它扩展了 Android 的 `SimpleOnScaleGestureListener` 类。此接口要求实现三个方法（`onScale()`、`onScaleBegin()`\
  \ 和 `onScaleEnd()`）。在此实例中，`onScale()` 方法识别比例因子并在文本视图上显示消息，以指示检测到的缩放手势类型。\n\n在 `onCreate()`\
  \ 方法中，创建了一个新的 `ScaleGestureDetector` 实例，并将所属 Activity 的引用以及我们新类 `MyOnScaleGestureListener`\
  \ 的实例作为参数传递。最后，为 Activity 实现了 `onTouchEvent()` 回调方法，该方法调用 `ScaleGestureDetector`\
  \ 对象对应的 `onTouchEvent()` 方法，并将 `MotionEvent` 对象作为参数传递。\n\n在模拟器或物理 Android 设备上编译并运行应用程序，并在屏幕上执行缩放手势，注意文本视图会根据缩放动作显示“放大”或“缩小”的消息。在模拟器的独立模式下，可以通过按住\
  \ `Ctrl`（或 macOS 的 `Cmd`）键并点击且拖动鼠标指针来模拟缩放手势，如图 31-3 所示：\n\n![image-852JXTPA.jpg](img/image-852JXTPA.jpeg)\n\
  \n图 31-3\n\n## 31.19 总结\n\n手势是触摸屏幕上接触点的运动，涉及一次或多次触摸，可以作为用户与应用程序之间通信的方法。Android 允许使用\
  \ `Gesture Builder` 设计手势。一旦创建，手势就可以保存到手势文件中，并在应用程序运行时使用 `GestureLibrary` 加载到 Activity\
  \ 中。\n\n通过将透明 `GestureOverlayView` 类的实例覆盖在现有视图上，并实现 `OnGesturePerformedListener`\
  \ 事件监听器，可以在显示区域上检测手势。使用 `GestureLibrary` 可以生成用户执行的手势与存储在手势文件中的势之间的匹配排序列表，并使用预测分数来判断手势是否足够匹配。\n\
  \n通过实现 `ScaleGestureDetector` 类可以检测缩放手势，本章也提供了该类的示例。\n\n## 32. Android Fragments\
  \ 简介\n\n随着你对本书章节的不断学习，你会越来越发现，Android 系统背后的许多设计概念的构想是为了促进构成应用程序的不同元素之间的复用和交互。本章将探索的此类领域涉及使用\
  \ `Fragments`。\n\n本章将提供 Fragment 基础的概述，包括它们是什么以及如何在应用程序中创建和使用它们。下一章将通过教程展示在 Android\
  \ Studio 中开发应用程序时 Fragment 的运行情况，包括 Fragment 之间通信的实现。\n\n## 32.1 什么是 Fragment？\n\
  \nFragment 是应用程序用户界面及其相应行为的自包含、模块化部分，可以嵌入到 Activity 中。可以在应用程序设计阶段组合 Fragment 以创建一个\
  \ Activity，并在应用程序运行时将其添加到或从 Activity 中移除，以创建动态变化的用户界面。\n\nFragment 仅只能作为 Activity\
  \ 的一部分使用，不能实例化为独立的应用程序元素。然而，Fragment 可以被视为一个功能性的“子 Activity”，其生命周期与完整的 Activity\
  \ 相似。\n\nFragment 以 XML 布局文件的形式存储。可以通过在 Activity 的布局文件中放置适当的元素，或者通过 Activity 类中的代码将其添加到\
  \ Activity 中。\n\n## 32.2 创建 Fragment\n\n构成 Fragment 的两个组件是一个 XML 布局文件和一个对应的 Java\
  \ 类。Fragment 的 XML 布局文件格式与任何其他 Activity 的布局相同，可以包含布局管理器和视图的任何组合和复杂度。例如，下面的 XML 布局用于一个由\
  \ `ConstraintLayout` 组成的 Fragment，其背景为红色，包含一个白色前景的 `TextView`：\n\n```xml\n<ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:id=\"@+id/constraintLayout\"\n    android:layout_width=\"match_parent\"\
  \n    android:layout_height=\"match_parent\"\n    android:background=\"@android:color/holo_red_dark\"\
  \n    tools:context=\".FragmentOne\">\n\n    <TextView\n        android:id=\"@+id/textView1\"\
  \n        android:layout_width=\"wrap_content\"\n        android:layout_height=\"\
  wrap_content\"\n        android:text=\"My First Fragment\"\n        android:textAppearance=\"\
  @style/TextAppearance.Large\"\n        android:textColor=\"@color/white\"\n    \
  \    app:layout_constraintBottom_toBottomOf=\"parent\"\n        app:layout_constraintEnd_toEndOf=\"\
  parent\"\n        app:layout_constraintStart_toStartOf=\"parent\"\n        app:layout_constraintTop_toTopOf=\"\
  parent\" />\n\n</ConstraintLayout>\n```\n\n与布局对应的类必须是 Android `Fragment` 类的子类。该类至少应该重写\
  \ `onCreateView()` 方法，该方法负责加载 Fragment 布局。例如：\n\n```java\npackage com.example.myfragmentdemo;\n\
  \nimport android.os.Bundle;\nimport android.view.LayoutInflater;\nimport android.view.View;\n\
  import android.view.ViewGroup;\nimport androidx.fragment.app.Fragment;\n\npublic\
  \ class FragmentOne extends Fragment {\n    @Override\n    public View onCreateView(LayoutInflater\
  \ inflater,\n    ViewGroup container,\n    Bundle savedInstanceState) {\n      \
  \  // 加载此 fragment 的布局\n    }\n}\n```\n\n\n\n\n\n```java\nbinding = FragmentTextBinding.inflate(inflater,\
  \ container, false);\n\nreturn binding.getRoot();\n\n}\n\n}\n```除了 `onCreate()`\
  \ 方法外，该类还可以重写标准的生命周期方法。一旦 fragment 布局和类创建完成，fragment 就可以在应用程序活动 中使用了。\n\n## 32.3\
  \ 使用布局 XML 文件向 Activity 添加 Fragment\n\n可以通过编写 Java 代码或将 fragment 嵌入 activity 的 XML\
  \ 布局文件中将其纳入活动。无论使用哪种方法，需要注意的关键点是：当使用支持库来兼容旧版本的 Android 发布时，任何使用 fragment 的 activity\
  \ 必须实现为 `FragmentActivity` 的子类，而不是 `AppCompatActivity` 类：\n\n```java\npackage com.example.myfragmentdemo;\n\
  \nimport android.os.Bundle;\n\nimport androidx.fragment.app.FragmentActivity;\n\n\
  import android.view.Menu;\n\npublic class MainActivity extends FragmentActivity\
  \ {\n\n.\n\n.\n```\n\nFragment 使用 `FragmentContainerView` 类嵌入到 activity 布局文件中。下面的示例布局将本章上一节创建的\
  \ fragment 嵌入到 activity 布局中：\n\n```xml\nxmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \nxmlns:app=\"http://schemas.android.com/apk/res-auto\"\nxmlns:tools=\"http://schemas.android.com/tools\"\
  \nandroid:layout_width=\"match_parent\"\nandroid:layout_height=\"match_parent\"\n\
  tools:context=\".MainActivity\"\nandroid:id=\"@+id/fragment2\"\nandroid:name=\"\
  com.ebookfrenzy.myfragmentdemo.FragmentOne\"\nandroid:layout_width=\"0dp\"\nandroid:layout_height=\"\
  wrap_content\"\nandroid:layout_marginStart=\"32dp\"\nandroid:layout_marginEnd=\"\
  32dp\"\napp:layout_constraintBottom_toBottomOf=\"parent\"\napp:layout_constraintEnd_toEndOf=\"\
  parent\"\napp:layout_constraintStart_toStartOf=\"parent\"\napp:layout_constraintTop_toTopOf=\"\
  parent\"\ntools:layout=\"@layout/fragment_one\" />\n```\n\n该元素中的关键属性是 `android:name`（必须引用与\
  \ fragment 关联类）以及 `tools:layout`（必须引用包含 fragment 布局的 XML 资源文件）。一旦添加到 activity 的布局中，就可以在\
  \ Android Studio 布局编辑器工具中查看并操作 fragment。例如，图 32-1 显示了 Android Studio 布局编辑器中上述 fragment\
  \ 的布局：\n\n![image-73HPJB8X.jpg](img/image-73HPJB8X.jpeg)\n\n图 32-1\n\n## 32.4 在代码中添加和管理\
  \ Fragment\n\n通过 activity 的 XML 布局文件向其添加 fragment 的便利是以无法在运行时移除 fragment 为代价的。为了在运行时对\
  \ fragment 进行完全动态控制，必须通过代码添加这些 activity。这样做的优点是，可以在应用程序运行时动态地添加、删除 fragment，甚至让它们相互替换。\n\
  \n当使用代码管理 fragment 时，fragment 仍然由一个 XML 布局文件和一个相应的类组成。区别在于宿主 activity 在操作 fragment\
  \ 时。使用代码向 activity 添加 fragment 时有一套标准的步骤序列：\n\n1. 创建 fragment 类的实例。\n2. 将任何额外的 intent\
  \ 参数传递给该类实例。\n3. 获取 fragment manager 实例的引用。\n4. 在 fragment manager 实例上调用 `beginTransaction()`\
  \ 方法。这将返回一个 fragment 事务实例。\n5. 调用 fragment 事务实例的 `add()` 方法，将要包含 fragment 的视图资源\
  \ ID 和 fragment 类实例作为参数传递。\n6. 调用 fragment 事务的 `commit()` 方法。\n\n例如，下面的代码添加了由 `FragmentOne`\
  \ 类定义的 fragment，使其显示在 ID 为 `LinearLayout1` 的容器视图中：\n\n```java\nFragmentOne firstFragment\
  \ = new FragmentOne();\nfirstFragment.setArguments(getIntent().getExtras());\nFragmentManager\
  \ fragManager = getSupportFragmentManager();\nFragmentTransaction transaction =\
  \ fragManager.beginTransaction();\ntransaction.add(R.id.LinearLayout1, firstFragment);\n\
  transaction.commit();\n```\n\n上面的代码为了清晰起见，将每个步骤拆分为单独语句。然而，最后四行可以简写为单行代码，如下：\n\n\
  ```java\ngetSupportFragmentManager().beginTransaction()\n    .add(R.id.LinearLayout1,\
  \ firstFragment).commit();\n```\n\n一旦添加到容器，随后可以通过调用 fragment 事务实例的 `remove()` 方法来移除\
  \ fragment，并传递要移除的 fragment 实例引用：\n\n```java\ntransaction.remove(firstFragment);\n\
  ```\n\n同样，可以通过调用 fragment 事务实例的 `replace()` 方法用另一个 fragment 替换一个。该方法接受包含 fragment\
  \ 的视图 ID 和新 fragment 实例作为参数。被替换的 fragment 也可以放入所谓的回栈（back stack）中，以便当用户导航返回时可以快速恢复。这通过在调用\
  \ `commit()` 方法之前，调用 fragment 事务对象的 `addToBackStack()` 方法来实现：\n\n```java\nFragmentTwo\
  \ secondFragment = new FragmentTwo();\ntransaction.replace(R.id.LinearLayout1, secondFragment);\n\
  transaction.addToBackStack(null);\ntransaction.commit();\n```\n\n## 32.5 处理 Fragment\
  \ 事件\n\n如前所述，fragment 就像一个拥有自己的布局、类和生命周期的子活动。fragment 内部的视图（如按钮和文本视图）可以产生事件。这产生了一个问题：接收\
  \ fragment 中事件的是 fragment 本身，还是嵌入它的 activity？答案取决于事件处理程序的声明。\n\n在“事件处理概述与示例”章节中，讨论了两种处理事件的方法。第一种是在\
  \ activity 代码中配置事件监听器和回调方法。例如：\n\n```java\nbinding.button.setOnClickListener(new\
  \ Button.OnClickListener() {\n    public void onClick(View v) {\n        // 按钮点击时执行的代码\n\
  \    }\n});\n```\n\n在拦截点击事件时，第二种方法是在 XML 布局文件中设置 `android:onClick` 属性：\n\n```xml\n\
  android:id=\"@+id/button1\"\nandroid:layout_width=\"wrap_content\"\nandroid:layout_height=\"\
  wrap_content\"\nandroid:onClick=\"onClick\"\nandroid:text=\"点击我\" />\n```\n\nfragment\
  \ 视图产生事件的通用规则是：如果使用监听器和回调方法在 fragment 类中声明监听器，则事件首先由 fragment 处理。但如果使用了 `android:onClick`\
  \ 资源，事件将直接传递给所在的 activity。\n\n## 32.6 实现 Fragment 通信\n\n一旦一个或 fragment 被嵌入 activity\
  \ 中，fragment 与 activity 以及 fragment 之间可能需要某种形式的通信。良好的实践要求 fragment 之间不直接通信。所有通信应通过封装活动进行。\n\
  \n要与 fragment 通信，activity 需要通过分配的 ID 标识 fragment 对象。一旦获取该引用，activity 就可以调用 fragment\
  \ 的公共方法。\n\n反方向（从 fragment 到 activity）的通信要复杂一些。首先，fragment 必须定义一个监听器接口，然后在 activity\
  \ 类中实现该接口。例如，下面的代码在名为 `ToolbarFragment` 的 fragment 上定义了一个 `ToolbarListener` 接口。代码还声明了一个变量，用于稍后存储\
  \ activity 的引用。\n\n\n\n\n\n```java\npublic class ToolbarFragment extends Fragment\
  \ {\n\n  ToolbarListener activityCallback;\n\n  public interface ToolbarListener\
  \ {\n\n    public void onButtonClick(int position, String text);\n\n  }\n\n  .\n\
  \n  .\n\n}\n```\n\n上面的代码规定，任何实现 `ToolbarListener` 接口的类必须实现一个名为 `onButtonClick` 的回调方法，该方法反过来接受一个整数和一个\
  \ `String` 作为参数。\n\n接下来，需要重写并实现 fragment 类的 `onAttach()` 方法。当 fragment 初始化并与 activity\
  \ 关联时，Android 系统会自动调用此方法。该方法会接收一个包含该 fragment 的 activity 引用。该方法必须存储一个指向该 activity\
  \ 的本地引用，并验证它是否实现了 `ToolbarListener` 接口：\n\n```java\n@Override\npublic void onAttach(Context\
  \ context) {\n  super.onAttach(context);\n  try {\n    activityCallback = (ToolbarListener)\
  \ activity;\n  } catch (ClassCastException e) {\n    throw new ClassCastException(activity.toString()\n\
  \    + \" must implement ToolbarListener\");\n  }\n}\n```\n\n执行此示例后，activity 的引用将存储在本地\
  \ `activityCallback` 变量中，如果该 activity 没有实现 `ToolbarListener` 接口，则会抛出异常。\n\n下一步是从\
  \ fragment 内部调用 activity 的回调方法。这在何时以及如何发生，完全取决于 fragment 需要联系 activity 的情况。例如，下面的代码在点击按钮时调用\
  \ activity 上的回调方法：\n\n```java\npublic void buttonClicked (View view) {\n  activityCallback.onButtonClick(arg1,\
  \ arg2);\n}\n```\n\n剩下的工作是修改 activity 类以实现 `ToolbarListener` 接口。例如：\n\n```java\n\
  public class MainActivity extends FragmentActivity\n  implements ToolbarFragment.ToolbarListener\
  \ {\n\n  public void onButtonClick(String arg1, int arg2) {\n    // 实现回调方法的代码\n\
  \  }\n\n  .\n\n  .\n\n}\n```\n\n从上述代码中我们可以，activity 声明了它实现了 `ToolbarFragment` 类的\
  \ `ToolbarListener` 接口，然后按照接口的要求实现了 `onButtonClick()` 方法。\n\n## 32.7 总结\n\nFragments\
  \ 为创建可重用的用户界面布局和应用行为模块提供了一种强大的机制，这些模块一旦创建，就可以嵌入到 activity 中。一个 fragment 由一个用户界面布局文件和一个类组成。可以通过将\
  \ fragment 添加到 activity 的布局文件或编写代码在运行时管理 fragment 来在 activity 中利用 fragment。在代码中添加到\
  \ activity 的 fragment 可以在运行时动态地删除和替换。fragment 之间的所有通信都应该通过嵌入这些 fragment 的 activity\
  \ 进行。\n\n在本章涵盖了 fragment 的基础知识后，下一章将通过一个教程来完成，该教程旨在强化本章概述的技术。\n\n## 33. 在 Android\
  \ Studio 中使用 Fragments - 示例\n\n如上一章所述，fragments 为创建可重用的应用功能模块提供了一种方便的机制，这些模块由用户界面部分和相应的行为组成。一旦创建，fragments\
  \ 就可以嵌入到 activity 中。\n\n在上一章探索了 fragment 的通用理论后，本章旨在使用 Android Studio 创建一个 Android\
  \ 应用程序，用于演示创建和使用 fragment 的实际步骤，以及在 activity 内部实现一个 fragment 与另一个 之间的通信。\n\n###\
  \ 33.1 关于示例 Fragment 应用\n\n在本章创建的应用程序将包含一个 activity 和两个 fragment。第一个 fragment 的用户界面将包含一个由\
  \ `EditText` 视图、一个 `SeekBar` 和一个 `Button` 组成的工具栏，所有内容都包含在一个 `ConstraintLayout` 视图中。第二个\
  \ fragment 将仅由 `ConstraintLayout` 视图中的一个 `TextView` 对象组成。\n\n这两个 fragment 将嵌入应用程序的主\
  \ activity 中，并实现如下通信：当第一个 fragment 中的按钮被按下时，输入到 `EditText` 视图中的文本将出现在第二个 fragment\
  \ 的 `TextView` 上，其字体大小由第一个 fragment 中 `SeekBar` 的位置决定。\n\n由于此应用程序旨在运行在旧版本的 Android\
  \ 上，我们变使用适当的 Android 支持库。\n\n### 33.2 创建示例项目\n\n从欢迎屏幕上选择 `New Project` 选项，在生成的新项目对话框中，点击\
  \ `Next` 按钮之前选择 `Empty Views Activity` 模板。\n\n在 `Name` 字段中输入 `FragmentExample` 并指定\
  \ `com.ebookfrenzy.fragmentexample` 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level`\
  \ 设置更改为 `API 26: Android 8.0 (Oreo)`，并将 `Language` 菜单更改为 `Java`。按照 `12.8 Migrating\
  \ a Project to View Binding` 中列出的步骤修改项目以使用 view binding。\n\n### 33.3 创建第一个 Fragment\
  \ 布局\n\n下一步是为我们 activity 中使用的第一个 fragment 创建用户界面。\n\n此用户界面将由一个 XML 布局文件和一个 fragment\
  \ 类组成。虽然可以手动添加它们，但让 Android Studio 为我们创建会更快。在项目工具窗口中，找到 `app -> java -> com.ebookfrenzy.fragmentexample`\
  \ 条目并右键点击它。从生成的菜单中，选择 `New -> Fragment -> Gallery...` 选项显示图 33-1 所示的对话框：\n\n![image-M73I41TF.jpg](img/image-M73I41TF.jpeg)\n\
  \n图 33-1\n\n在点击 `Next` 按钮之前选择 `Fragment (Blank)` 模板。在随后的屏幕上，将 fragment 命名为 `ToolbarFragment`，布局文件命名为\
  \ `fragment_toolbar`：\n\n![image-7U34XVC.jpg](img/image-7U34XVC.jpeg)\n\n图 33-2\n\
  \n使用 `Design` 模式将布局编辑器加载 `fragment_toolbar.xml` 文件。接下来，在组件树面板中右键点击 `FrameLayout`\
  \ 条目并选择 `Convert FrameLayout to ConstraintLayout` 选项，接受确认对话框中的默认设置。更改 `id` 为 `constraintLayout`。确保启用\
  \ `Autoconnect` 模式，然后选择并删除默认的 `TextView`，添加 `Plain Text`、`SeekBar` 和 `Button` 控件，使其位置与图\
  \ 33-3 所示。最后，分别将视图 id 更改为 `editText1`、`seekBar1` 和 `button1`。\n\n将按钮上的文本更改为“Change\
  \ Text”，将其提取为名为 `change_text` 的字符串资源，并移除 `EditText` 视图中的 `Name` 文本。最后，将 `SeekBar`\
  \ 的 `layout_width` 属性设置为 `match_constraint`，左右设置为 `16dp`。\n\n使用 `Infer constraints`\
  \ 工具栏按钮添加任何缺失的约束，此时布局应与下图 33-3 所示：\n\n![image-BGSFYI43.jpg](img/image-BGSFYI43.jpeg)\n\
  \n图 33-3\n\n### 33.4 将 Fragment 迁移到 View Binding\n\n与 `Empty Views Activity` 模板一样，Android\
  \ Studio 在向项目添加新 fragment 时不会启用 view binding 支持。因此，在继续此教程的下一步之前，我们需要进行此迁移。首先编辑 `ToolbarFragment.java`\
  \ 文件并如下导入 fragment 的绑定：\n\n```java\nimport com.ebookfrenzy.fragmentexample.databinding.FragmentToolbarBinding;\n\
  ```\n\n接下来，找到 `onCreateView()` 方法并进行以下声明和更改（包括添加 `onDestroyView()` 方法以确保在 fragment\
  \ 销毁时移除绑定引用）：\n\n```java\n.\n\n.\n\nprivate FragmentToolbarBinding binding;\n\n\
  @Override\npublic View onCreateView(LayoutInflater inflater, ViewGroup container,\n\
  Bundle savedInstanceState) {\n  // 充入此 fragment 的布局\n```\n\n\n\n\n\n```java\nreturn\
  \ inflater.inflate(R.layout.fragment_toolbar, container, false);\n\nbinding = FragmentToolbarBinding.inflate(inflater,\
  \ container, false);\n\nreturn binding.getRoot();\n\n}\n\n@Override\n\npublic void\
  \ onDestroyView() {\n\nsuper.onDestroyView();\n\nbinding = null;\n\n}\n```\n\n完成这些更改后，该\
  \ fragment 就可以使用视图绑定（view binding）。\n\n### 33.5 添加第二个 Fragment\n\n重复创建工具栏 fragment\
  \ 的步骤，添加另一个名为 `TextFragment` 的空白 fragment，其布局文件命名为 `fragment_text`。再次将 `FrameLayout`\
  \ 容器转换为 `ConstraintLayout`（将 `id` 更改为 `constraintLayout2`）并移除默认的 `TextView`。\n\n\
  从调色板拖入一个 `TextView` 组件并将其放置在布局中心，使用 `Infer`（推断）约束按钮添加任何的约束。将 `TextView` 的 `id` 更改为\
  \ `textView2`，将 `text` 设置为“Fragment Two”，并修改 `textSize` 属性为 `24sp`。\n\n完成后，布局应与图\
  \ 33-4 所示：\n\n![image-UN73GVDG.jpg](img/image-UN73GVDG.jpeg)\n\n图 33-4\n\n重复上一节执行的步骤，将\
