  \ APK 文件。一旦 APK 文件生成完毕，滚动到屏幕底部并点击“保存”按钮。保存设置后，点击“查看版本”按钮。\n\n## 73.12 发布应用进行测试\n\
  \n应用已准备好进行测试，但只有在控制台中设置了某些测试人员后才能进行发布。在审核屏幕上，点击已上传 bundle 右侧的箭头，如图 73-11 所示：\n\n\
  ![image-3HW9T1OR.jpg](img/image-3HW9T1OR.jpeg)\n\n图 73-11\n\n在生成的面板中，点击“探索 bundle”（Explore\
  \ bundle）链接以加载应用 bundle 探路器。这提供了与应用 bundle 支持的 API 级别、屏幕布局和平台相关的摘要信息：\n\n![image-FA03L815.jpg](img/image-FA03L815.jpeg)\n\
