  \ 设置 onPreparedListener\n\n作为处理视频媒体的最后一个示例，将进一步扩展 Activity 以演示配置监听器。在这种情况下，将实现一个监听器，用于在\
  \ Android Studio Logcat 中输出视频时长。该监听器还将配置视频循环播放：\n\n```java\npackage com.ebookfrenzy.videoplayer;\n\
