  \n## 87.6 设计用户界面\n\n将 `content_main.xml` 布局资源文件加载到 `Layout Editor` 中（如果尚未加载），并在设计模式下选择\
  \ `content_main` 对象。从调色板的 `Widgets` 部分拖放一个 `WebView` 对象到屏幕中心。点击 `Infer constraints`（推断约束）按钮，并在\
  \ `Attributes` 工具窗口将 `WebView` 的 `layout_width` 和 `layout_height` 属性匹配，如图 87-2 所示。\n\
  \n选择新添加的 `WebView` 实例并将视图 ID 改为 `myWebView`。\n\n在继续教程下一步之前，必须向项目添加额外的权限，以便 `WebView`\
  \ 对象能够访问互联网下载打印网页。通过在 `Project` 工具窗口中找到 `AndroidManifest.xml` 文件并双击将其加载。加载后，按照如下所示修改\
  \ XML 内容添加权限行：\n\n```xml\npackage=\"com.ebookfrenzy.webprint\" >\nandroid:allowBackup=\"\
  true\"\n\n![image-3SQSRYO.jpg](img/image-3SQSRYO.jpeg)\n\n图 87-2\n\n## 87.7 从主 Activity\
  \ 访问 WebView\n\n正如“RecyclerView 和 CardView 教程”中的项目一样，我们需要能够使用视图绑定（view binding）从\
  \ `MainActivity` 类中访问 `content_main.xml` 文件中的组件（此处为 `myWebView`）。为了访问 `content_main.xml`\
  \ 文件中的视图，我们再次需要在包含处分配一个 ID。编辑 `activity_main.xml` 文件并修改 `include` 元素如下：\n\n```xml\n\
  android:id=\"@+id/contentMain\"\nlayout=\"@layout/content_main\" />\n```\n\n## 87.8\
  \ 将网页加载到 WebView\n\n在打印网页之前，必须将其加载到 `WebView` 实例。在本教程中，这将通过调用 `WebView` 实例的 `loadUrl()`\
  \ 方法来实现，该调用将放置在 `configureWebView()` 方法中，并在 `MainActivity` 类的 `onStart()` 方法中调用。因此，编辑\
  \ `MainActivity.java` 文件并修改如下：\n\n```java\npackage com.ebookfrenzy.webprint;\n\n\
  import android.view.Menu;\nimport android.view.MenuItem;\nimport android.webkit.WebView;\n\
  import android.webkit.WebViewClient;\nimport android.webkit.WebResourceRequest;\n\
  \npublic class MainActivity extends AppCompatActivity {\n```\n\n\n\n\n\n```java\n\
  private WebView myWebView;\n\n@Override\nprotected void onStart() {\n    super.onStart();\n\
  \    configureWebView();\n}\n\nprivate void configureWebView() {\n    myWebView\
  \ = findViewById(R.id.myWebView);\n    myWebView.setWebViewClient(new WebViewClient(){\n\
  \        @Override\n        public boolean shouldOverrideUrlLoading(\n         \
  \       WebView view, WebResourceRequest request) {\n            return super.shouldOverrideUrlLoading(\n\
  \                view, request);\n        }\n    });\n    myWebView.loadUrl(\"https://www.payloadbooks.com\"\
  );\n}\n```\n\n## 87.9 添加打印菜单选项\n\n现在将使用“在 Android 上创建和管理溢出菜单”章节中概述的技术，将打印网页的选项添加到溢出菜单中。第一个要求是用于用于菜单选项标签的字符串资源。在\
  \ Project 工具窗口中，找到 `app -> res -> values -> strings.xml` 文件，双击它将其加载到编辑器中，并修改它以添加新的字符串资源：\n\
  \n- WebPrint\n- Settings\n- Print\n\n接下来，将 `app -> res -> menu -> menu_main.xml`\
  \ 文件加载到菜单编辑器，切换到 Code ，并将 Settings 菜单选项替换为打印选项：\n\n```xml\nxmlns:tools=\"http://schemas.android.com/tools\"\
  \ntools:context=\"com.ebookfrenzy.webprint.MainActivity\" >\nandroid:id=\"@+id/action_settings\"\
  \nandroid:title=\"@string/action_settings\"\nandroid:orderInCategory=\"100\"\napp:showAsAction=\"\
  never\" />\nandroid:id=\"@+id/action_print\"\nandroid:orderInCategory=\"100\"\n\
  app:showAsAction=\"never\"\nandroid:title=\"@string/print_string\"/>\n```\n\n配置菜单选项剩下的工作是修改\
  \ `MainActivity.java` 文件中的 `onOptionsItemSelected()` 处理器方法：\n\n```java\n@Override\n\
  public boolean onOptionsItemSelected(MenuItem item) {\n    int id = item.getItemId();\n\
  \    if (id == R.id.action_print) {\n        createWebPrintJob(myWebView);\n   \
  \     return true;\n    }\n    return super.onOptionsItemSelected(item);\n}\n```\n\
  \n实现 `onOptionsItemSelected()` 方法后，当从溢出菜单中选择打印菜单选项时，活动将调用名为 `createWebPrintJob()`\
  \ 的方法。该方法的实现与之前的 HTMLPrint 项目中使用的相同，现在可以将其添加到 `MainActivity.java` 文件中，其内容如下：\n\n\
  ```java\npackage com.ebookfrenzy.webprint;\n\nimport android.print.PrintAttributes;\n\
  import android.print.PrintDocumentAdapter;\nimport android.print.PrintManager;\n\
  import android.content.Context;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private WebView myWebView;\n\n    private void createWebPrintJob(WebView\
  \ webView) {\n        PrintManager printManager = (PrintManager) this\n        \
  \    .getSystemService(Context.PRINT_SERVICE);\n        PrintDocumentAdapter printAdapter\
  \ =\n            webView.createPrintDocumentAdapter(\"MyDocument\");\n        String\
  \ jobName = getString(R.string.app_name) + \" Print Test\";\n        printManager.print(jobName,\
  \ printAdapter,\n            new PrintAttributes.Builder().build());\n    }\n}\n\
  ```\n\n代码更改完成后，在物理 Android 设备或模拟器上运行应用程序。成功启动后，WebView 应该显示并加载指定的网页。页面加载后，从溢出菜单中选择\
  \ Print 选项，并使用生成的打印面板将网页打印到合适的目的地。\n\n![image-7AAUCGG7.jpg](img/image-7AAUCGG7.jpeg)\n\
  \n图 87-3\n\n## 87.10 总结\n\nAndroid 打印框架包含了 `WebView` 类的扩展，允许从 Android 应用程序内部打印基于\
  \ HTML 的内容。这些内容可以是应用程序在运行时动态创建的 HTML，也可以是加载到 `WebView` 实例的现有网页。对于动态创建的 HTML，使用 `WebViewClient`\
  \ 实例至关重要，以确保在 HTML 完全加载到 `WebView` 之前不会开始打印。\n\n## 88. Android 自定义文档打印指南\n\n正如前面的章节中所看到的，如果内容以图像或\
  \ HTML 标记的形式存在，Android 打印框架为应用程序构建打印支持变得相对。更高级的打印需求可以通过打印框架的自定义文档打印功能来满足。\n\n##\
  \ 88.1 Android 自定义文档打印概述\n\n简单来说，自定义文档打印使用画布（canvases）来表示要打印的文档页面。应用程序将要打印的内容作为形状、颜色、文本和图像绘制在这些画布上。画布由\
  \ `Android Canvas` 类的实例表示，提供了丰富的绘制选项访问。一旦所有页面都绘制完成，文档就会被打印。\n\n虽然这听起来足够简单，但需要执行一些步骤来实现，这些步骤可以总结如下：\n\
  \n- 实现一个继承自 `PrintDocumentAdapter` 类的自定义打印适配器。\n- 获取 `Print Manager Service` 的引用。\n\
  - 创建 `PdfDocument` 类的实例以存储文档页面。\n- 以 `PdfDocument.Page` 实例的形式将页面添加到 `PdfDocument`\
  \ 中。\n- 获取与文档页面相关的 `Canvas` 对象的引用。\n- 在画布上绘制内容。\n- 将 `PDF` 文档写入到打印框架提供的目标输出流。\n\
  - 通知打印框架文档已准备好打印。\n\n本章将提供这些步骤的概述，随后是一个旨在在 Android 应用程序中实现自定义文档打印的详细教程。\n\n## 88.1.1\
  \ 自定义打印适配器\n\n打印适配器的作用是为打印框架提供要打印的内容，并确保根据用户的偏好（如纸张大小）进行格式化。\n\n许多工作是由框架提供的打印适配器完成的，这些适配器专为打印\
  \ HTML 和图像的任务设计。例如，在打印网页时，当调用 `WebView` 实例的 `createDocumentAdapter()` 方法时，就会创建一个打印适配器。\n\
  \n然而，在自定义文档打印的情况下，由应用程序开发者设计打印适配器并实现为打印做准备的代码。\n\n自定义打印适配器通过子类 `PrintDocumentAdapter`\
  \ 类并重写该类中的一组回调方法来创建，这些方法将在打印过程的不同阶段由打印框架调用。这些回调方法总结如下：\n\n- `onStart()`：此方法在打印过程开始时调用，以便应用程序代码可以执行创建打印作业的必要任务。在\
  \ `PrintDocumentAdapter` 子类中实现此方法是可选的。\n- `onLayout()`：此回调方法在调用 `onStart()` 方法后以及随后用户每次更改打印设置（如更改方向、纸张大小或颜色设置）时调用。该方法应调整内容和布局以适应这些更改。更改完成后，方法必须返回要打印的页面数。在\
  \ `PrintDocumentAdapter` 子类中实现 `onLayout()` 方法是强制的。\n- `onWrite()`：此方法在每次调用 `onLayout()`\
  \ 之后调用，负责在要打印页面的画布上渲染内容。除了其他参数外，此方法还传递了一个文件描述符，一旦渲染完成，必须将生成的 `PDF` 文档写入其中。然后会调用\
  \ `onWriteFinished()` 回调方法，传递一个包含要打印页面范围信息的参数。在 `PrintDocumentAdapter` 子类中实现 `onWrite()`\
  \ 方法是强制的。\n\n\n\n\n\n`onFinish()` – 一个可选方法。如果实现了该方法，打印框架将在打印过程完成后由其调用一次，从而为应用程序提供执行任何必要的清理操作的机会。\n\
  \n## 88.2 准备自定义文档打印项目\n\n从欢迎屏幕上选择 `New Project` 选项，在生成的新项目对话框中，点击 `Next` 按钮之前选择\
  \ `Empty Views Activity` 模板。\n\n在 `Name` 字段中输入 `CustomPrint`，并指定 `com.ebookfrenzy.customprint`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level`（最小 API 级别）设置为 `API 26`: Android 8.0\
  \ (Oreo)，并将 `Language` 菜单设置为 `Java`。\n\n## 88.3 设计 UI\n\n将 `activity_main.xml` 布局文件加载到\
  \ `Layout Editor` 工具中，并在 `Design` 模式下，选择并删除“Hello World!” `TextView` 对象。从调色板的 `Common`\
  \ 部分拖入一个 `Button` 视图并将其放置在布局视图的中心。选中 `Button` 视图后，将 `text` 属性更改为“Print Document”并将字符串提取到新资源中。完成后，用户界面布局应与图\
  \ 88-1 所示。\n\n当在应用程序中选中按钮时，需要调用一个方法来启动文档打印过程。继续留在 `Attributes` 工具窗口中，设置 `onClick`\
  \ 属性以调用名为 `printDocument` 的方法。\n\n![image-U3OP134W.jpg](img/image-U3OP134W.jpeg)\n\
  \n图 88-1\n\n## 88.4 创建自定义打印适配器\n\n在 Android 应用程序内部打印自定义文档的大部分工作涉及自定义打印适配器的实现。此示例将需要一个实现了\
  \ `onLayout()` 和 `onWrite()` 回调方法的打印适配器。在 `MainActivity.java` 文件中，添加此新类的模板，使其读取内容如下：\n\
  \n```java\npackage com.ebookfrenzy.customprint;\n\n.\n\n.\n\nimport android.os.CancellationSignal;\n\
  \nimport android.os.ParcelFileDescriptor;\n\nimport android.print.PageRange;\n\n\
  import android.print.PrintAttributes;\n\nimport android.print.PrintDocumentAdapter;\n\
  \nimport android.content.Context;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n\n    public static class MyPrintDocumentAdapter extends PrintDocumentAdapter\n\
  \    {\n        Context context;\n\n        MyPrintDocumentAdapter(Context context)\n\
  \        {\n            this.context = context;\n        }\n\n        @Override\n\
  \        public void onLayout(PrintAttributes oldAttributes,\n                PrintAttributes\
  \ newAttributes,\n                CancellationSignal cancellationSignal,\n     \
  \           LayoutResultCallback callback,\n                Bundle metadata) {\n\
  \        }\n\n        @Override\n        public void onWrite(final PageRange[] pageRanges,\n\
  \                final ParcelFileDescriptor destination,\n                final\
  \ CancellationSignal\n                cancellationSignal,\n                final\
  \ WriteResultCallback callback) {\n        }\n    }\n.\n\n.\n\n}\n```\n\n目前这个新类类了一个包含一个在创建新类实例时调用的构造方法。构造方法接收调用活动的\
  \ `context` 作为参数，然后将其存储，以便稍后在两个回调方法中引用。\n\n建立好类框架后，下一步是实现两个回调方法，从 `onLayout()` 开始。\n\
  \n## 88.5 实现 onLayout() 回调方法\n\n继续留在 `MainActivity.java` 文件中，首先添加 `onLayout()` 方法代码将所需的某些导入指令：\n\
  \n```java\npackage com.ebookfrenzy.customprint;\n\n.\n\n.\n\nimport android.print.PrintDocumentInfo;\n\
  \nimport android.print.pdf.PrintedPdfDocument;\n\nimport android.graphics.pdf.PdfDocument;\n\
  \npublic class MainActivity extends AppCompatActivity {\n\n.\n\n.\n\n}\n```\n\n\
  接下来，修改 `MyPrintDocumentAdapter` 类，声明在 `onLayout()` 方法中使用的变量：\n\n```java\npublic\
  \ static class MyPrintDocumentAdapter extends PrintDocumentAdapter\n{\n    Context\
  \ context;\n    int pageHeight;\n    int pageWidth;\n    PdfDocument myPdfDocument;\n\
  \    int totalpages = 4;\n\n.\n\n.\n\n}\n```\n\n注意，对于此示例，将打印一个四页文档。在更复杂的情况下，应用程序可能需要根据内容的数量和布局相对于用户纸张尺寸和页面方向的选择，动态计算要打印的页数。\n\
  \n声明变量后，按照以下代码列表实现 `onLayout()` 方法：\n\n```java\n@Override\npublic void onLayout(PrintAttributes\
  \ oldAttributes,\n        PrintAttributes newAttributes,\n        CancellationSignal\
  \ cancellationSignal,\n        LayoutResultCallback callback,\n        Bundle metadata)\
  \ {\n    myPdfDocument = new PrintedPdfDocument(context, newAttributes);\n    pageHeight\
  \ =\n        Objects.requireNonNull(\n            newAttributes.getMediaSize()).getHeightMils()/1000\
  \ * 72;\n    pageWidth =\n        newAttributes.getMediaSize().getWidthMils()/1000\
  \ * 72;\n    if (cancellationSignal.isCanceled() ) {\n        callback.onLayoutCancelled();\n\
  \        return;\n    }\n    if (totalpages > 0) {\n        PrintDocumentInfo.Builder\
  \ builder = new PrintDocumentInfo\n        .Builder(\"print_output.pdf\").setContentType(\n\
  \            PrintDocumentInfo.CONTENT_TYPE_DOCUMENT)\n            .setPageCount(totalpages);\n\
  \        PrintDocumentInfo info = builder.build();\n        callback.onLayoutFinished(info,\
  \ true);\n    } else {\n        callback.onLayoutFailed(\"Page count is zero.\"\
  );\n    }\n}\n```\n\n该方法执行了许多任务，每个都需要详细说明。首先，创建一个 `PdfDocument` 类实例。当打印框架调用 `onLayout()`\
  \ 方法时，传入的一个参数是 `PrintAttributes` 对象，包含了纸张尺寸、分辨率和颜色设置。\n\n该方法随后使用 `PrintAttributes`\
  \ 对象提取文档页面的高度和宽度。这些维度以英寸分之一为单位存储在对象中。由于示例中使用这些值的方法是以 1/72 英寸为单位，因此在存储之前进行了转换：`pageHeight\
  \ = newAttributes.getMediaSize().getHeightMils()/1000 * 72;` `pageWidth = newAttributes.getMediaSize().getWidthMils()/1000\
  \ * 72;`\n\n尽管此示例没有使用用户的颜色选择，但该属性可以通过调用 `PrintAttributes` 对象的 `getColorMode()` 方法获取，它将返回彩色或黑白值。\n\
  \n当 `onLayout()` 方法被调用时，它接收一个类型 `LayoutResultCallback` 类型的对象。该对象提供了一种通过一组方法向打印框架反馈状态的方法。例如，如果用户取消打印过程，`onLayout()`\
  \ 方法将被调用。过程已取消的事实通过 `CancellationSignal` 参数中的设置指示。如果检测到取消，`onLayout()` 方法必须调用 `LayoutResultCallback`\
  \ 对象的 `onLayoutCancelled()` 方法，以通知打印框架已收到取消请求且布局任务已取消：`if (cancellationSignal.isCanceled()\
  \ ) { callback.onLayoutCancelled(); return; }`\n\n当布局工作完成后，该方法需要调用 `LayoutResultCallback`\
  \ 对象的 `onLayoutFinished()` 方法并传递两个参数。第一个参数是 `PrintDocumentInfo` 对象，包含了要打印文档的信息。这些信息包括\
  \ PDF 文档、内容类型（在此情况下是文档而非图像）以及页数。第二个参数是一个布尔值，表示自上次调用 `onLayout()` 方法以来布局是否发生了变化。\n\
  \n\n\n\n\n```java\nPrintDocumentInfo.CONTENT_TYPE_DOCUMENT)\n.setPageCount(totalpages);\n\
  \nPrintDocumentInfo info = builder.build();\n\ncallback.onLayoutFinished(info, true);\n\
  \n} else {\n    callback.onLayoutFailed(\"Page count is zero.\");\n}\n```\n\n如果页数为\
  \ 0，代码将通过调用 `LayoutResultCallback` 对象的 `onLayoutFailed()` 方法向打印框架报告此失败。\n\n调用 `onLayoutFinished()`\
  \ 方法会通知打印框架布局工作已完成，从而触发对 `onWrite()` 方法的调用。\n\n## 88.6 实现 onWrite() 回调方法\n\n`onWrite()`\
  \ 回调方法负责渲染文档的页面，然后通知打印框架文档已准备好打印。完成后，`onWrite()` 方法的实现如下：\n\n```java\npackage com.ebookfrenzy.customprint;\n\
  \nimport java.io.FileOutputStream;\nimport java.io.IOException;\nimport android.graphics.pdf.PdfDocument.PageInfo;\n\
  \n@Override\npublic void onWrite(final PageRange[] pageRanges,\n               \
  \     final ParcelFileDescriptor destination,\n                    final CancellationSignal\
  \ cancellationSignal,\n                    final WriteResultCallback callback) {\n\
  \    for (int i = 0; i < totalpages; i++) {\n        if (pageInRange(pageRanges,\
  \ i)) {\n            PageInfo newPage = new PageInfo.Builder(pageWidth, lineHeight,\
  \ i).create();\n            PdfDocument.Page page = myPdfDocument.startPage(newPage);\n\
  \            if (cancellationSignal.isCanceled()) {\n                callback.onWriteCancelled();\n\
  \                myPdfDocument.close();\n                myPdfDocument = null;\n\
  \                return;\n            }\n            drawPage(page, i);\n      \
  \      myPdfDocument.finishPage(page);\n        }\n    }\n    try {\n        myPdfDocument.writeTo(new\
  \ FileOutputStream(destination.getFileDescriptor()));\n    } catch (IOException\
  \ e) {\n        callback.onWriteFailed(e.toString());\n        return;\n    } finally\
  \ {\n        myPdfDocument.close();\n        myPdfDocument = null;\n    }\n    callback.onWriteFinished(pageRanges);\n\
  }\n```\n\n`onWrite()` 方法首先循环遍历文档中的每一页。然而，重要的是考虑到用户可能请求只打印组成文档的某些页面。打印框架的用户界面面板提供了指定要打印特定页面或页面范围的选项。例如，图\
  \ 88-2 显示了配置为打印文档的第 1-4 页、第 9 页和第 11-13 页的打印面板。\n\n![image-WN7HE8CX.jpg](img/image-WN7HE8CX.jpeg)\n\
  \n图 88-2\n\n在将页面写入 PDF 文档时，`onWrite()` 方法必须采取步骤确保打印用户指定的页面。为了实现，打印框架通过参数传递一个 `PageRange`\
  \ 对象数组，指示要打印的页面范围。在上述 `onWrite()` 实现中，对每个页都会调用一次 `pageInRange()` 方法，以验证该页是否在指定的范围内。`pageInRange()`\
  \ 方法的代码将在本章稍后实现。\n\n```java\nfor (int i = 0; i < totalpages; i++) {\n    if (pageInRange(pageRanges,\
  \ i)) {\n        // ...\n    }\n}\n```\n\n对于位于任何指定范围内的每一页，都会创建一个新的 `PdfDocument.Page`\
  \ 对象。在创建新页面时，之前由 `onLayout()` 方法存储的高度和宽度值将作为参数传递，以便页面大小与用户选择的打印选项匹配：\n\n```java\n\
  PageInfo newPage = new PageInfo.Builder(pageWidth, lineHeight, i).create();\nPdfDocument.Page\
  \ page = myPdfDocument.startPage(newPage);\n```\n\n与 `onLayout()` 方法一样，`onWrite()`\
  \ 方法需要响应取消请求。在这种情况下，代码在关闭并取消引用 `myPdfDocument` 变量之前，会通知打印框架取消已执行：\n\n```java\nif\
  \ (cancellationSignal.isCanceled()) {\n    callback.onWriteCancelled();\n    myPdfDocument.close();\n\
  \    myPdfDocument = null;\n    return;\n}\n```\n\n只要打印过程没有取消，该方法在调用 `myPdfDocument`\
  \ 对象的 `finishPage()` 方法之前，会调用一个方法在当前页面上绘制内容：\n\n```java\ndrawPage(page, i);\nmyPdfDocument.finishPage(page);\n\
  ```\n\n`drawPage()` 方法负责在页面上绘制内容，将在 `onWrite()` 方法完成后实现。\n\n当所需的页面数已添加到 PDF 文档后，文档将使用文件描述符写入目标流，该文件描述符作为参数传递给\
  \ `onWrite()` 方法。如果由于任何原因写入操作失败，该方法将通过调用 `WriteResultCallback` 对象的 `onWriteFailed()`\
  \ 方法（同样作为参数传递给 `onWrite()` 方法）通知框架。\n\n```java\ntry {\n    myPdfDocument.writeTo(new\
  \ FileOutputStream(destination.getFileDescriptor()));\n} catch (IOException e) {\n\
  \    callback.onWriteFailed(e.toString());\n    return;\n} finally {\n    myPdfDocument.close();\n\
  \    myPdfDocument = null;\n}\n```\n\n最后，调用 `WriteResultCallback` 对象的 `onWriteFinished()`\
  \ 方法通知打印框架文档就绪。\n\n## 88.7 检查页面是否在范围内\n\n正如概述，当 `onWrite()` 方法被调用时，它接收一个 `PageRange`\
  \ 对象数组，指示要打印的页面范围。`PageRange` 类用于存储页的起始和结束位置，这些位置可以通过 `getStart()` 和 `getEnd()`\
  \ 方法访问。在上一节中，`onWrite()` 方法调用了一个名为 `pageInRange()` 的方法，其参数为 `PageRange` 对象数组和页码。`pageInRange()`\
  \ 方法的作用是识别指定的页码是否在范围内，并在 `MainActivity.java` 中的 `MyPrintAdapter` 类中实现如下：\n\n```java\n\
  public class MyPrintAdapter {\n    private boolean pageInRange(PageRange[] pageRanges,\
  \ int page) {\n        for (PageRange pageRange : pageRanges) {\n            if\
  \ ((page >= pageRange.getStart()) && (page <= pageRange.getEnd())) {\n         \
  \       return true;\n            }\n        }\n        return false;\n    }\n}\n\
  ```\n\n## 88.8 绘制内容\n\n现在到了需要编写代码在页面上绘制内容以准备打印的阶段。绘制的内容完全取决于应用程序，仅限于使用 `Canvas`\
  \ 类可以实现。在本示例中，将在画布上绘制一些文本和图形。\n\n`onWrite()` 方法被设计为调用名为 `drawPage()` 的方法，其参数为代表当前页的\
  \ `PdfDocument.Page` 对象代表页码的整数。在 `MainActivity.java` 文件中，该方法现在应该实现如下：\n\n\n\n\n\
  代码中的页码计数从 `0` 开始。由于文档传统上从第 1 页开始，该方法首先对存储的页码进行增。然后获取与页面相关的 `Canvas` 对象的引用，并声明了一些边距和基线值：\n\
  \n```\nCanvas canvas = page.getCanvas();\npagenumber++;\nint titleBaseLine = 72;\n\
  int leftMargin = 54;\n```\n\n接下来，代码创建了用于绘制的 `Paint` 和 `Color` 对象，设置字体大小并绘制页面标题文本，包括当前的页码：\n\
  \n```\nPaint paint = new Paint();\npaint.setColor(Color.BLACK);\npaint.setTextSize(40);\n\
  canvas.drawText(\"Test Print Document Page \" + pagenumber,\nleftMargin,\ntitleBaseLine,\n\
  paint);\n```\n\n随后减小字体大小，并在标题下方绘制了一些正文内容：\n\n```java\npaint.setTextSize(14);\ncanvas.drawText(\"\
  This is some test content to verify that custom document printing works\", leftMargin,\
  \ titleBaseLine + 35, paint);\n```\n\n该方法执行的最后一个任务是绘制一个圆（偶数页为红色，奇数页为绿色）。在确定页面是奇是偶后，方法获取页面的高度和宽度，然后利用这些信息将圆置于页面中心：\n\
  \n```java\nif (pagenumber % 2 == 0)\n    paint.setColor(Color.RED);\nelse\n    paint.setColor(Color.GREEN);\n\
  \nPageInfo pageInfo = page.getInfo();\ncanvas.drawCircle(pageInfo.getPageWidth()/2,\n\
  pageInfo.getPageHeight()/2,\n150, paint);\n```\n\n在画布上绘制完成后，该方法将控制权返回给 `onWrite()`\
  \ 方法。\n\n随着 `drawPage()` 方法完成，`MyPrintDocumentAdapter` 类编写完毕。\n\n## 88.9 启动打印任务\n\
  \n当用户点击“打印文档”按钮时，将调用 `printDocument()` `onClick` 事件处理方法。因此，测试开始前剩下的工作是将此方法添加到 `MainActivity.java`\
  \ 文件中，并特别注意确保将其放置在 `MyPrintDocumentAdapter` 类之外：\n\n```java\npackage com.ebookfrenzy.customprint;\n\
  \n.\n.\n\nimport android.print.PrintManager;\nimport android.view.View;\n\npublic\
  \ class MainActivity extends AppCompatActivity {\n    public void printDocument(View\
  \ view)\n    {\n        PrintManager printManager = (PrintManager) this\n      \
  \      .getSystemService(Context.PRINT_SERVICE);\n        String jobName = this.getString(R.string.app_name)\
  \ + \" Document\";\n        printManager.print(jobName, new MyPrintDocumentAdapter(this),\n\
  \            null);\n    }\n.\n.\n}\n```\n\n该方法在创建作为打印任务名称的新 `String` 对象之前，获取设备上运行的\
  \ `Print Manager` 服务的引用。最后，调用 `Print Manager` 的 `print()` 方法来启动打印任务，传递任务名称和我们自定义打印文档适配器类的实例。\n\
  \n## 88.10 测试应用程序\n\n在 Android 设备或模拟器上编译并运行应用程序。当应用程序加载后，点击“打印文档”按钮启动打印任务，并选择一个合适的输出目标（“保存为\
  \ PDF”选项有助于避免浪费纸和打印机墨水）。\n\n检查打印输出，应包含 4 页，包括文本和图形。例如，图 88-3 显示了作为 PDF 文件查看的四页文档，准备保存到设备上。\n\
  \n尝试其他打印配置选项，例如在打印面板中更改纸张大小、方向和页面设置。打印输出应反映每项设置的变化，表明自定义打印文档适配器功能正常。\n\n![image-GR45T9EG.jpg](img/image-GR45T9EG.jpeg)\n\
  \n图 88-3\n\n## 88.11 总结\n\n虽然比 Android 打印框架的 HTML 和图像打印选项实现复杂，但自定义文档打印为在 Android\
  \ 应用中打印复杂内容提供了极大的活性。实现自定义文档打印的大部分工作涉及创建一个自定义 `Print Adapter` 类，该类不仅在文档页面上绘制内容，还能在用户更改打印设置（如页面大小和打印页面范围）时做出正确响应。\n\
  \n## 89. Android App Links 简介\n\n随着技术的演进，Web 和移动内容之间的传统区别开始模糊。这一点特别 true 的一个领域是渐进式\
  \ Web 应用（PWA）的日益普及，Web 应用的外观和行为与传统的移动应用非常相似。\n\n另一个趋势是通过网络搜索和 URL 链接使移动应用中的内容可发现。在\
  \ Android 应用开发的背景下，`App Links` 功能旨在让用户更容易地发现和访问存储在 Android 应用中的内容，即使用户没有安装该应用。\n\
  \n## 89.1 Android App Links 概述\n\nApp link 是一种标准的 HTTP URL，是从网站或应用等外部源直接链接到你应用中特定位置的简单方法。App\
  \ links（也称为深度链接 deep links）主要用于鼓励用户与应用交互，并允许用户分享应用内容。\n\nApp link 实现是一个多步骤过程，涉及向项目清单（manifest）中添加意图过滤器（intent\
  \ filters）、在关联的应用 Activity 中实现链接处理代码以及使用数字资产链接文件（digital asset links）将应用与基于 Web\
  \ 的内容关联。\n\n这些步骤可以手动完成，也可以通过 Android Studio 助手自动完成。\n\n本章剩余部分将概述 app links 的实现方法。章节（“App\
  \ Links 教程”）将进行演示。\n\n## 89.2 App Link 图过滤器\n\nApp link URL 需要映射到应用内的特定 Activity。这通过向\
  \ `AndroidManifest.xml` 文件添加意图过滤器来实现，旨在响应 `intent.action.VIEW` 启动 Activity。意图过滤器声明在要启动的\
  \ Activity 元素内部，并且包含 app link 的方案（scheme）、主机（host）和路径（path）。例如，下面的清单片段在检测到匹配 `http://www.example.com/welcome`\
  \ 的 app link 时启动名为 `MyActivity` 的 Activity：\n\n```xml\nandroid:scheme=\"http\"\n\
  android:host=\"www.example.com\"\nandroid:pathPrefix=\"/welcome\" />\n```\n\n可以使用意图过滤器标签的\
  \ `order` 属性来指定处理歧义意图过滤器的顺序：\n\n意图过滤器会启动正确的 Activity，但仍需要在目标 Activity 中添加代码以适当处理意图。\n\
  \n## 89.3 处理 App Link 意图\n\n大多数情况下，启动的 Activity 需要访问 app link URL，并根据 URL 的结构采取特定行动。继续上面的示例，Activity\
  \ 通过包含 `/newuser` 路径的 URL 启动时可能会通过路径设置为 `/existinguser` 的 URL 显示不同的内容。\n\n当链接启动\
  \ Activity 时，会传递一个包含启动 Activity 操作数据的 intent 对象，其中包含包含 app link URL 的 `Uri` 对象。在\
  \ Activity 的初始化阶段，可以添加代码来提取这些数据：\n\n```java\nIntent appLinkIntent = getIntent();\n\
  String appLinkAction = appLinkIntent.getAction();\nUri appLinkData = appLinkIntent.getData();\n\
  ```\n\n获取 app link 的 `Uri` 后，可以使用 URL 路径的各个部分来决定在 Activity 中执行的操作。在下面的代码示例中，使用 URL\
  \ 的最后部分来识别应为新用户还是现有用户显示内容：\n\n```java\nString userType = appLinkData.getLastPathSegment();\n\
  ```\n\n\n\n\n```\nif (userType.equals(\"newuser\")) {\n  // 显示新用户内容\n} else {\n\
  \  // 显示现有用户内容\n}\n```\n\n[content]\n\n## 89.4 将应用与网站关联\n\n在应用链接（app link）生效之前，必须将应用链接\
  \ URL 与该链接所属的网站进行关联。这通过创建一个名为 `assetlinks.json` 的数字资产链接文件并将其安装在网站的 `.well-known`\
  \ 文件夹中。请注意，数字资产链接仅基于 HTTPS 的网站。\n\n数字资产链接文件由一个关系声明（relation statement）组成，该声明允许目标应用使用网站的链接\
  \ URL 启动；以及一个目标声明（target statement），该声明用于宣布该项目的配套应用包名和 SHA-256 证书指纹。一个典型的资产链接文件内容可能如下：\n\
  \n```json\n[{\n  \"relation\": [\"delegate_permission/common.handle_all_urls\"],\n\
  \  \"target\" : { \"namespace\": \"android_app\",\n  \"package_name\": \"\",\n \
  \ \"sha256_cert_fingerprints\": [\"\"] }\n}]\n```\n\n`assetlinks.json` 文件可以包含多个数字资产链接，允许单个网站与多个配套应用关联。\n\
  \n## 89.5 总结\n\nAndroid App Links 允许通过来自外部网站和其他应用的 URL 链接启动应用活动（activity）。应用链接是通过项目清单文件（manifest）中的意图过滤器（intent\
  \ filters）以及启动活动中的意图处理代码实现的。通过使用数字资产链接文件，可以将应用链接中使用的域名与相应的网站关联起来。一旦建立关联，当使用应用链接时，Android\
  \ 不再需要用户选择目标应用。\n\n## 90. Android Studio App Links 教程\n\n本章将对 Android 应用链接和 Android\
  \ Studio App Link 助手（Assistant）进行实际演示。\n\n本章将为现有的 Android 应用添加应用链接支持，允许通过应用链接 URL\
  \ 启动活动。除了启动活动外，显示的内容将在 URL 的路径中指定。\n\n## 90.1 关于示例应用\n\n本章使用的项目名为 `AppLinking`，是一个基础应用，允许用户查找有关伦敦地标的信息。该应用使用通过标准\
  \ Android 内容提供者类访问的 `SQLite` 数据库。该应用有一个现有的数据库，其中包含了伦敦热门旅游景点的记录。除了现有的数据库条目外，该应用允许用户添加和删除地标描述。\n\
  \n目前，该应用允许搜索现有记录并添加和删除新记录。\n\n该项目由两个名为 `AppLinkingActivity` 和 `LandmarkActivity`\
  \ 的活动组成。`AppLinkingActivity` 是应用启动时启动的主活动。该活动允许用户输入搜索标准并向数据库添加记录。当搜索找到匹配的记录时，`LandmarkActivity`\
  \ 会启动并显示相关地标的信息。\n\n本章将增强该应用以支持应用链接，以便可以使用 URL 在应用内显示特定的地标记录。\n\n## 90.2 数据库架构\n\
  \n示例应用的数据包含在名为 `landmarks.db` 的文件中，位于项目层级的 `app -> assets ->> databases` 文件夹中。数据库包含一个名为\
  \ `locations` 的表，其结构如表 90-1 所示：\n\n| 列 | 类型 | 描述 |\n| :--- | :--- | :--- |\n| `_id`\
  \ | String | 主索引，此列包含唯一标识数据库中地标的字符串值。 |\n| `title` | String | 地标的名称（例如，伦敦桥）。 |\n\
  | `description` | String | 地标的描述。 |\n| `personal` | Boolean | 表明记录是私人的还是公共的。对于用户添加的所有记录，此值被设置为\
  \ true。数据库提供的现有记录被设置为 false。 |\n\n表 90-1\n\n## 90.3 加载并运行项目\n\n该项目位于以下 URL 示例源码下载包的\
  \ `AppLinking` 文件夹中：\n\nhttps://www.payloadbooks.com/product/ladybugjava\n\n找到文件夹后，在\
  \ Android Studio 中打开它，并在设备或模拟器上运行该应用。一旦应用启动，将出现下方图 90-1 所示的屏幕：\n\n![image-6KGN07RA.jpg](img/image-6KGN07RA.jpeg)\n\
  \n图 90-1\n\n按照目前的实现方式，地标是使用位置 ID 定位的。默认数据库配置目前包含两个由 ID “londonbridge”和“toweroflondon”引用的记录。通过在\
  \ ID 字段中输入 `londonbridge` 并并点击 Find（查找）按钮来测试搜索功能。当找到匹配的记录时，会启动第二个活动（`LandmarkActivity`）并传递有关记录的信息以进行显示。这些信息以添加到\
  \ `Intent` 对象的额外数据形式存在。`LandmarkActivity` 使用这些信息从数据库中提取记录并使用图 90-2 所示的屏幕显示给用户：\n\
  \n![image-QJ5L3A6M.jpg](img/image-QJ5L3A6M.jpeg)\n\n图 90-2\n\n## 90.4 添加 URL 映射\n\
  \n现在应用已加载到 Android Studio 并通过了测试，我们可以添加应用链接支持。目标是让 `LandmarkActivity` 屏幕响应应用链接点击的启动并显示信息。这是通过将\
  \ URL 映射到 `LandmarkActivity` 实现的。对于此示例，URL 的格式如下：\n\n`http:///landmarks/`\n\n当完成所有步骤后，对应的\
  \ URL 将导致应用显示关于伦敦塔的信息：\n\n`http://yourdomain.com/tower/london`\n\n要向项目添加 URL 映射，首先通过\
  \ `Tools -> App Links` 打开 App Links 助手。打开后，助手将如图 90-3 所示：\n\n![image-ZVL2932I.jpg](img/image-ZVL2932I.jpeg)\n\
  \n图 90-3\n\n接下来，点击 `Create Applink` 按钮显示下方所示的面板：\n\n![image-85BYKM3.jpg](img/image-85BYKM3.jpeg)\n\
  \n图 90-4\n\n点击 `Open URL Mapping` 按钮将 URL 映射到活动。在映射屏幕中，点击 `+` 按钮（如图 90-5 中高亮所示）来添加新的\
  \ URL：\n\n![image-Z8SK25B.jpg](img/image-Z8SK25B.jpeg)\n\n图 90-5\n\n在 `Add URL Mapping`\
  \ 对话框的 `Host` 字段中，输入你自己的网站 URL。如果你没有网站供教程使用，仍然可以使用 `http://www.example.com` 完成本章的大部分内容，但无法测试需要数字资产链接文件的功能。\n\
  \n`Path` 字段（如图 90-6 中的 B 所示）是声明 URL 路径的地方。路径必须以 `/` 开头，因此在此字段中输入 `/landmarks`。\n\
  \n`Path` 菜单（B）提供以下三种路径匹配选项：\n\n- `path`：URL 必须精确匹配路径部分才能启动活动。例如，如果路径设置为 `/landmarks`，则\
  \ `http://www.example.com/landmarks` 被视为匹配。然而，`http://www.example.com/landmarks/londonbridge`\
  \ 将不会被视为匹配。\n- `pathPrefix`：指定的路径仅被视为前缀。在 `/landmarks` 组件之后可以包含额外的路径组件（例如，`http://www.example.com/landmarks/londonbridge`\
  \ 仍被视为匹配）。\n- `pathPattern`：允许使用基本正则表达式和通配符的形式指定路径，例如 `landmarks/*/[l-L]ondon/*`。\n\
  \n由于示例中的路径是地标 ID 组件的前缀，请选择 `pathPrefix` 菜单选项。\n\n最后，使用 `Activity` 菜单（C）选择 `LandmarkActivity`\
  \ 作为响应应用链接启动的活动：\n\n![image-Y4YAM6WD.jpg](img/image-Y4YAM6WD.jpeg)\n\n图 90-6\n\n\
  \n\n\n\n在对话框中完成设置后，点击 `OK` 按钮提交更改。通过将以下 URL 输入到映射屏幕的 `Check URL Mapping` 字段中（此处已设置为上方\
  \ `Host` 字段中指定的域名），检查 `URL` 格式是否正确以及是否分配给相应的活动：\n\nhttp:///landmarks/toweroflondon\n\
  \n如果配置正确，`LandmarkActivity` 将作为映射的活动列出：\n\n![image-2QCJZCSB.jpg](img/image-2QCJZCSB.jpeg)\n\
  \n图 90-7\n\n最新版本的 Android 要求为 `HTTP` 和 `HTTPS` 协议声明 `App Links`（应用链接），即使只使用了其中一种，也需要如此操作。因此，在继续下一步之前，请重复上述步骤将\
  \ `URL` 的 `HTTPS` 版本添加到列表中。\n\n下一步也将在 `App Links Assistant` 的 `URL` 映射屏幕中进行，因此请保持该屏幕处于选中状态。\n\
  \n## 90.5 添加 Intent Filter\n\n如上一章所述，需要一个意图过滤器（intent filter）来响应应用链接点击并启动目标活动。事实上，当添加\
  \ `URL` 映射时，意图过滤器已自动添加到项目清单文件中。在 `App Links Assistant` 的 `URL` 映射列表中选中 `URL` 映射，向下滚动屏幕直到意图过滤器的\
  \ `Preview`（预览）部分可见。预览应包含修改后的 `AndroidManifest.xml` 文件，其中包含了新添加的意图过滤器：\n\n![image-24J98DCR.jpg](img/image-24J98DCR.jpeg)\n\
  \n图 90-8\n\n尽管 `App Links Assistant` 为我们添加了意图过滤器，但它可能没有包含处理应用链接时所需的 `autoVerify`\
  \ 设置。打开 `manifests ->AndroidManifest.xml` 文件，并按照如下所示将此设置添加到两个意图过滤器中：\n\n```\n.\n\
  .\n.\n.\n```\n\n## 90.6 添加 Intent 处理代码\n\n到目前为止采取的步骤确保了在响应格式正确的应用链接 `URL` 时会启动正确的活动。下一步是在\
  \ `LandmarkActivity` 类中处理意图（intent），以便从数据库中提取正确的记录并将其显示给用户。在对 `LandmarkActivity.java`\
  \ 文件中的代码进行任何更改之前，值得查看现有代码的某些区域。在代码编辑器中打开 `LandmarkActivity.java` 文件，并找到 `onCreate()`\
  \ 和 `handleIntent()` 方法，它们目前的读取如下：\n\n```java\n@Override\nprotected void onCreate(Bundle\
  \ savedInstanceState) {\n    super.onCreate(savedInstanceState);\n    binding =\
  \ ActivityLandmarkBinding.inflate(getLayoutInflater());\n    View view = binding.getRoot();\n\
  \    setContentView(view);\n    handleIntent(getIntent());\n}\n\nprivate void handleIntent(Intent\
  \ intent) {\n    String landmarkId =\n    intent.getStringExtra(AppLinkingActivity.LANDMARK_ID);\n\
  \    displayLandmark(landmarkId);\n}\n```\n\n在当前形式下，代码期望在 `Intent` 数据包的额外数据中找到地标\
  \ ID。由于现在活动可以通过应用链接启动，因此必须更改代码以同时处理这两种情况。首先，删除 `onCreate()` 方法中的 `handleIntent()`\
  \ 的调用：\n\n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState)\
  \ {\n    super.onCreate(savedInstanceState);\n    binding = ActivityLandmarkBinding.inflate(getLayoutInflater());\n\
  \    View view = binding.getRoot();\n    setContentView(view);\n    handleIntent(getIntent());\n\
  }\n```\n\n要添加初始的应用链接意图处理代码，返回 `App Links Assistant` 面板，并点击步骤 2 下列出的 `Select Activity`\
  \ 按钮。在活动选择对话框中，点击 `Insert Code` 按钮之前，选择 `LandmarkActivity` 条目：\n\n![image-8QX88BP7.jpg](img/image-8QX88BP7.jpeg)\n\
  \n图 90-9\n\n返回 `LandmarkActivity.java` 文件，注意以下代码已插入到 `onCreate()` 方法中（注意，如果 Android\
  \ Studio 无法完成请求，您可以手动添加此代码）：\n\n```java\n// ATTENTION: This was auto-generated to\
  \ handle app links.\nIntent appLinkIntent = getIntent();\nString appLinkAction =\
  \ appLinkIntent.getAction();\nUri appLinkData = appLinkIntent.getData();\n```\n\n\
  这段代码访问 `Intent` 对象并提取 `Action` 字符串和 `Uri`。如果活动启动由于应用链接，则 action 字符串将设置为 `android.intent.action.VIEW`，这与添加到清单文件的意图过滤器中声明的\
  \ action 相匹配。反，如果活动是由主活动 `findLandmark()` 方法中的标准意图启动代码启动的，则 action 字符串将为 null。通过检查分配给\
  \ action 字符串的值，可以编写代码来识别活动是如何启动的并采取适当操作：\n\n```java\n.\nimport android.net.Uri;\n\
  .\n@Override\nprotected void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    .\n    // ATTENTION: This was auto-generated to handle app links.\n    Intent\
  \ appLinkIntent = getIntent();\n    String appLinkAction = appLinkIntent.getAction();\n\
  \    Uri appLinkData = appLinkIntent.getData();\n    String landmarkId = appLinkData.getLastPathSegment();\n\
  \    if (landmarkId != null) {\n        displayLandmark(landmarkId);\n    }\n}\n\
  ```\n\n剩下的是在方法中添加一些额外的代码，以识别启动活动的方式并采取适当操作：\n\n```java\n@Override\nprotected void\
  \ onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    .\n    // ATTENTION: This was auto-generated to handle app links.\n    Intent\
  \ appLinkIntent = getIntent();\n    String appLinkAction = appLinkIntent.getAction();\n\
