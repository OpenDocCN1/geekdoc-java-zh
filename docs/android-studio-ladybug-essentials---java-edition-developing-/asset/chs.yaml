  \n## 46.7 向 MotionScene 添加 KeyFrameSet\n\n在 `Cycle Editor` 中，从 `XML` 文件 `activity_main_scene.xml`\
  \ 高亮并复制 `KeyFrameSet` 元素，将其粘贴到 `activity_main_scene.xml` 的 `Transition` 部分，使其位于\
  \ `constraintSetEnd=\"@+id/end\"` 和 `constraintStart=\"@id/start\"` 之间。注意 `duration`\
  \ 属性需要改为 `7000`。\n\n```xml\nmotion:framePosition=\"0\"\nmotion:motionTarget=\"@+id/button\"\
  \nmotion:wavePeriod=\"1\"\nmotion:waveOffset=\"0dp\"\nmotion:waveShape=\"sin\"\n\
  android:translationY=\"60dp\"/>\n\nmotion:framePosition=\"25\"\nmotion:motionTarget=\"\
  @+id/button\"\nmotion:wavePeriod=\"2\"\nmotion:waveOffset=\"0dp\"\nmotion:waveShape=\"\
  sin\"\nandroid:translationY=\"60dp\"/>\n\nmotion:framePosition=\"50\"\nmotion:motionTarget=\"\
  @+id/button\"\nmotion:wavePeriod=\"3\"\nmotion:waveOffset=\"0dp\"\nmotion:waveShape=\"\
  sin\"\nandroid:translationY=\"150dp\"/>\n\nmotion:framePosition=\"75\"\nmotion:motionTarget=\"\
  @+id/button\"\nmotion:wavePeriod=\"2\"\nmotion:waveOffset=\"0dp\"\nmotion:waveShape=\"\
  sin\"\nandroid:translationY=\"60dp\"/>\n\nmotion:framePosition=\"100\"\nmotion:motionTarget=\"\
  @+id/button\"\nmotion:wavePeriod=\"1\"\nmotion:waveOffset=\"0dp\"\nmotion:waveShape=\"\
  sin\"\nandroid:translationY=\"60dp\"/>\n```\n\n## 46.8 总结\n\n循环关键帧为构建涉及大量匹配波形状态变化的帧动画提供了一种有用的方法。正如本章概述，使用\
  \ `Cycle Editor` 应用可以显著简化这些循环关键帧的生成。\n\n## 47. 使用浮动操作按钮和 Snackbar\n\n本章的一个目标是提供材料设计（material\
  \ design）概念的概述。材料设计最初作为 Android 5.0 的一部分引入，是一套设计指南，规定了 Android 用户界面以及在 Android 上运行应用的外观和行为。\n\
  \n\n\n\n作为实现材料设计（Material Design）概念的一部分，Google 还引入了 Android 设计支持库（Android Design\
  \ Support Library）。该库包含多个组件，允许将材料设计的许多关键功能构建到 Android 应用中。其中两个组件——悬浮操作按钮（floating\
  \ action button）和 `Snackbar` 将在后续章节介绍其他组件之前在本章中进行介绍。\n\n## 47.1 材料设计\n\n材料设计的原则定义了\
  \ Android 环境的整体外观。材料设计由 Google 的 Android 团队创建，它规定构成 Android 用户界面以及运行在其上的应用的元素在行为、阴影、动画和样式方面应以特定的方式显示和运行。材料设计的原则之一是用户界面的元素看起来具有物理深度，并且感觉项目是由物理材料分层构建的。例如，按钮通过阴影效果看起来像是悬浮在其所处布局表面之上的。按下按钮时，按钮会弯曲并抬起，就像是由薄材料制成的，在松开时会产生涟漪。\n\
  \n材料设计还规定了许多标准用户界面元素的布局和行为。一个关键示例是位于屏幕顶部的应用栏（app bar）应该长什么样，以及它相对于活动主内容区域发生的滚动活动应该如何表现。\n\
  \n材料设计涵盖了广泛的领域，从推荐的颜色样式到对象的动画处理。关于材料设计概念和指南的完整描述可以在以下链接中在线找到，它是所有 Android 开发者的推荐读物：\n\
  \n[`material.io/design/introduction`](https://material.io/design/introduction)\n\
  \n## 47.2 设计库\n\n实现采用材料设计原则的 Android 应用所需的许多构建块包含在 Android 设计支持库中。该库包含了一组用户界面组件，可以包含在\
  \ Android 应用中以实现材料设计的大部分外观、感觉和行为。该库中的两个组件——悬浮操作按钮和 `Snackbar` 将在本章中介绍，其他将在后续章节中介绍。\n\
  \n## 47.3 悬浮操作按钮 (FAB)\n\n悬浮操作按钮看起来悬浮在应用用户界面的上方。它通常用于促进用户界面中最常见的操作。悬浮操作按钮可以放置在屏幕上，允许用户向联系人列表添加条目或从应用内发送电子邮件。例如，图\
  \ 47-1 显示了标准 Android 联系人应用中允许用户添加新联系人的悬浮操作按钮：\n\n![image-PZW9NE0L.jpg](img/image-PZW9NE0L.jpeg)\n\
  \n图 47-1\n\n使用悬浮操作按钮时应遵循材料材料设计指南。悬浮操作按钮必须是圆形的，尺寸可以是 56 x 56dp（默认）或 40 x 40dp（微型）。按钮位置距离手机边缘至少为\
  \ 16dp，距离桌面设备和平板设备边缘至少为 24dp。无论大小如何，按钮必须包含一个大小为 24x24dp 的内部图标，并且建议每个用户界面屏幕只有一个悬浮操作按钮。\n\
  \n悬浮操作按钮可以进行动画处理，或设计成在触摸时变形为其他项目。例如，悬浮操作按钮可以在被点击时旋转，或变形为另一个元素，例如工具栏或列出相关操作的面板。\n\
  \n## 47.4 Snackbar\n\n`Snackbar` 组件提供了一种以屏幕底部面板的形式向用户展示信息，如图 47-2 所示。`Snackbar`\
  \ 实例包含一条短的文本消息和一个可选的操作按钮，当用户点击时，该按钮将执行任务。一旦显示，`Snackbar` 将自动超时，或者可以由用户通过滑动动作手动移除。在\
  \ `Snackbar` 显示期间，应用将继续正常运行并响应用户交互。\n\n![image-08GT7JTJ.jpg](img/image-08GT7JTJ.jpeg)\n\
  \n图 47-2\n\n在本章的剩余部分，将创建一个示例应用程序，该程序使用悬浮操作按钮和 `Snackbar` 的基本功能向项目列表添加条目。\n\n## 47.5\
  \ 创建示例项目\n\n从欢迎界面选择 New Project（新项目）选项，在生成的新项目对话框中，点击“Next”（下一步）按钮之前选择 Basic Views\
  \ Activity 模板。\n\n在“Name”字段中输入 `FabExample`，并指定 `com.ebookfrenzy.fabexample` 为包名。在点击“Finish”（完成）按钮之前，将\
  \ Minimum API level 设置更改为 API 26: Android 8.0 (Oreo)，并将 Language 菜单更改为 Java。\n\n\
  ## 47.6 审查项目\n\n由于选择了 Basic Views Activity 模板，该活动包含四个布局文件。`activity_main.xml` 文件由一个\
  \ `CoordinatorLayout` 组成，其中包含应用栏、Material 工具栏和悬浮操作按钮的项。\n\n`content_main.xml` 文件代表活动内容区域的布局，包含一个\
  \ `NavHostFragment` 实例。该文件通过以下 include 指令嵌入 `activity_main.xml` 文件中：\n\n`activity_main.xml`\
  \ 文件中的悬浮操作按钮元素如下：\n\n```xml\nandroid:id=\"@+id/fab\"\nandroid:layout_width=\"wrap_content\"\
  \nandroid:layout_height=\"wrap_content\"\nandroid:layout_gravity=\"bottom|end\"\n\
  android:layout_marginEnd=\"@dimen/fab_margin\"\nandroid:layout_marginBottom=\"16dp\"\
  \napp:srcCompat=\"@android:drawable/ic_dialog\" />\n```\n\n这声明按钮将出现在屏幕右下角，边距由 `values/dimens.xml`\
  \ 文件中的 `fab_margin` 标识符表示（在本例中为 16dp）。XML 进一步声明按钮内部图标将采用内置图标的形式。\n\n空白模板还配置了悬浮操作按钮，在用户点击时显示\
  \ `Snackbar`。实现此功能的代码可以在 `MainActivity.java` 文件的 `onCreate()` 方法中找到，如下所示：\n\n```java\n\
  binding.fab.setOnClickListener(new View.OnClickListener() {\n    @Override\n   \
  \ public void onClick(View view) {\n        Snackbar.make(view, \"Replace with your\
  \ own action\", Snackbar.LENGTH_LONG)\n            .setAction(\"Action\", null).show();\n\
  \    }\n});\n```\n\n代码通过视图绑定访问悬浮操作按钮，并添加了点击按钮时调用的 `OnClickListener`set。该方法显示了一个配置了消息但没有操作的\
  \ `Snackbar` 实例。\n\n当项目编译并运行时，悬浮操作按钮将出现在屏幕底部，如图 47-3 所示：\n\n![image-0DYRIVSV.jpg](img/image-0DYRIVSV.jpeg)\n\
  \n图 47-3\n\n点击悬浮操作按钮将触发 `OnClickListener` 处理方法，导致 `Snackbar` 显示在屏幕底部：\n\n![image-UJ3BBKI.jpg](img/image-UJ3BBKI.jpeg)\n\
  \n图 47-4\n\n## 47.7 移除导航功能\n\n正如《Android Studio 布局编辑器指南》所述，Basic Views Activity\
  \ 模板包含了多个片段以及在片段之间导航的按钮。这些功能对于本教程来说是不必要的，如果不移除，稍后会导致问题。在继续教程之前，请按照以下步骤修改项目：\n\n\
  1. 在 Project 工具窗口中，导航并双击 app -> res -> navigation -> nav_graph.xml 文件，将其加载到导航编辑器中。\n\
  \n2. 在编辑器内的 Component Tree 面板中选择 `SecondFragment` 项，然后按下键盘上的删除 键将其从图中移除。\n\n\n\n\
  \n\n3. 找到并删除 `SecondFragment.java` (`app -> java -> -> SecondFragment`) 和 `fragment_second.xml`\
  \ (`app -> res -> layout -> fragment_second.xml`) 文件。\n\n4. 找到 `FirstFragment.java`\
  \ 文件，双击将其加载到编辑器中，并移除 `onViewCreated()` 方法中的代码，使其内容如下：\n\n```java\nbinding.buttonFirst.setOnClickListener(new\
  \ View.OnClickListener() {\n    @Override\n    public void onClick(View view) {\n\
  \        NavHostFragment.findNavController(FirstFragment.this)\n            .navigate(R.id.action_FirstFragment_to_SecondFragment);\n\
  \    }\n});\n```\n\n## 47.8 修改悬浮操作按钮 (Floating Action Button)\n\n由于本示例的目标是配置悬浮操作按钮向列表添加条目，因此目前按钮上显示的邮件图标需要更改为更能指示所执行操作的内容。按钮将使用的图标名为\
  \ `ic_add_entry.png`，它可以在以下 URL 下载的示例代码的 `project_icons` 文件夹中找到：\n\n[`www.payloadbooks.com/product/ladybugjava`](https://www.payloadbooks.com/product/ladybugjava)\n\
  \n在操作系统的文件导航器中找到此图像并复制该文件。在 Project 工具窗口中右键点击 `app -> res -> drawable` 项，并从菜单中选择\
  \ `Paste`（粘贴）将文件添加到文件夹：\n\n![image-E1HP2WNE.jpg](img/image-E1HP2WNE.jpeg)\n\n图 47-5\n\
  \n接下来，编辑 `activity_main.xml` 文件，将图标的图像源从 `@android:drawable/ic_dialog_email` 更改为\
  \ `@drawable/ic_add_entry`如下：\n\n```xml\nandroid:id=\"@+id/fab\"\nandroid:layout_width=\"\
  wrap_content\"\nandroid:layout_height=\"wrap_content\"\nandroid:layout_gravity=\"\
  bottom|end\"\nandroid:layout_margin=\"@dimen/fab_margin\"\nandroid:layout_marginBottom=\"\
  16dp\"\napp:srcCompat=\"@drawable/ic_add_entry\" />\n```\n\n在布局预览中，按钮内部的图标将更改为加号。\n\
  \n我们还可以通过向 `OnClickListener` 添加代码，让悬浮操作按钮在点击时执行几乎任何操作。例如，对 `MainActivity.java` 文件进行以下更改，每次点击按钮时都会调用名为\
  \ `displayMessage()` 的方法来显示吐消息（toast message）：\n\n```java\nimport android.widget.Toast;\n\
  \nbinding.fab.setOnClickListener(new View.OnClickListener() {\n    @Override\n \
  \   public void onClick(View view) {\n        displayMessage(\"Fab clicked\");\n\
  \        Snackbar.make(view, \"Replace with your own action\", Snackbar.LENGTH_LONG)\n\
  \            .setAction(\"Action\", null).show();\n    }\n});\n\npublic void displayMessage(String\
  \ message) {\n    Toast.makeText(this,message,Toast.LENGTH_SHORT).show();\n}\n```\n\
  \n## 47.9 为 Snackbar 添加操作\n\n也可以为 `Snackbar` 添加一个操作，该操作在用户点击时执行某项任务。编辑 `MainActivity.java`\
  \ 文件并修改 `Snackbar` 的创建代码，添加一个标题为“My Action”的操作，并配置一个名为 `actionOnClickListener` 的\
  \ `OnClickListener`，该监听反过来会显示一条吐消息：\n\n```java\nbinding.fab.setOnClickListener(new\
  \ View.OnClickListener() {\n    @Override\n    public void onClick(View view) {\n\
  \        Snackbar.make(view, \"Replace with your own action\", Snackbar.LENGTH_LONG)\n\
  \            .setAction(\"My Action\", actionOnClickListener).show();\n    }\n});\n\
  ```\n\n在 `MainActivity.java` 文件中，添加监听器处理器：\n\n```java\nView.OnClickListener actionOnClickListener\
  \ = new View.OnClickListener() {\n    @Override\n    public void onClick(View view)\
  \ {\n        displayMessage(\"Action clicked\");\n        Snackbar.make(view, \"\
  Action Complete\", Snackbar.LENGTH_LONG)\n            .setAction(\"Action\", null).show();\n\
  \    }\n};\n```\n\n运行应用并点击悬浮操作按钮，此时吐消息和 `Snackbar` 应该都会出现。当 `Snackbar` 可见时，点击 `Snackbar`\
  \ 中的 My Action 按钮，验证 `Snackbar` 上的文本更改为“Action Complete”：\n\n![image-6JS27DRH.jpg](img/image-6JS27DRH.jpeg)\n\
  \n图 47-6\n\n## 47.10 总结\n\n在学习使用这些功能的示例项目之前，本章提供了 Material 设计（Material Design）、悬浮操作按钮和\
  \ `Snackbar` 的概览。\n\n悬浮操作按钮和 `Snackbar` 是 Android Material 设计用户界面实现方法的一部分。悬浮操作按钮提供了一种突出\
  \ Android 应用特定屏幕内最常用操作的方式。`Snackbar` 则提供了一种应用程序向用户展示信息并允许用户对其采取操作的方法。\n\n## 48.\
  \ 使用 TabLayout 组件创建标签页界面\n\n上一章概述了 Android 中 Material 设计的概念。它引入了设计支持库提供的两个组件，形式为悬浮操作按钮和\
  \ `Snackbar`。本章将演示如何使用设计支持库的另一个组件——`TabLayout`，它可以与 `ViewPager` 类结合使用，在 Android\
  \ 活动（Activity）中创建一个基于标签页的界面。\n\n## 48.1 ViewPager2 简介\n\n虽然 `ViewPager2` 不是设计支持库的一部分，但在与\
  \ `TabLayout` 组件配合实现标签页用户界面时，它是非常有用的辅助类。`ViewPager2` 的主要作用是允许用户翻阅不同的信息页，通常每个页由一个布局片段（fragment）。与\
  \ `ViewPager2` 关联的片段由 `FragmentStateAdapter` 类的实例管理。分配给 `ViewPager2` 的分页器至少必须实现两个方法。第一个是\
  \ `getItemCount()`，必须返回要显示的页面总数。第二个是 `createFragment()`，它接收一个页码并必须返回准备好呈现给用户的相应片段。\n\
  \n## 48.2 TabLayout 组件概述\n\n如前所述，`TabLayout` 是 Material 设计中引入的组件之一，并包含在设计支持库中。`TabLayout`\
  \ 的目的是为用户提供一行标签，可以通过选择这些标签来显示不同的页面。标签可以是固定的，也可以是滚动的，此时用户可以向左或向右滑动以查看比当前屏幕显示容量更多的标签。标签上显示的信息可以是文本、图像或两者的结合。例如，图\
  \ 48-1 显示了一个包含四个图像标签的应用程序标签栏：\n\n![image-E1HP2WNE.jpg](img/image-E1HP2WNE.jpeg)\n\
  \n图 48-1\n\n相反，图 48-2 显示了一个包含四个文本标签的滚动配置 `TabLayout`：\n\n![image-0OH8BX.jpg](img/image-0OH8BX.jpeg)\n\
  \n图 48-2\n\n本章的剩余部分将通过创建一个演示 `TabLayout` 组件结合 `ViewPager2` 和四个片段的示例项目来完成。\n\n##\
  \ 48.3 创建 TabLayoutDemo 项目\n\n在欢迎界面选择 New Project，在出现的新项目对话框中选择 Basic Views Activity\
  \ 模板，然后点击 Next 按钮。\n\n在 Name 字段输入 TabLayoutDemo，并指定 com.ebookrenzy.tablayoutdemo\
  \ 为包名。在点击 Finish 按钮之前，将 Minimum API level 设置为 API 26: Android 8.0 (Oreo)，并将 Language\
  \ 菜单设置为 Java。\n\n项目创建后，在 Layout Editor 加载 `content_main.xml` 文件，选择 `NavHostFragment`\
  \ 对象并将其删除。由于我们不会使用 Basic Views Activity 模板的导航功能，请编辑 `MainActivity.java` 文件并修改 `onCreate()`\
  \ 方法以移除导航代码：\n\n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState)\
  \ {\n    super.onCreate(savedInstanceState);\n    binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \    setContentView(binding.getRoot());\n    setSupportActionBar(binding.toolbar);\n\
  \    NavController navController =\n    Navigation.findNavController(this, R.id.nav_host_fragment_content_main);\n\
  }\n```\n\n\n\n\n\n```java\nappBarConfiguration =\nnew AppBarConfiguration.Builder(navController.getGraph()).build();\n\
  \nNavigationUI.setupActionBarWithNavController(this, navController, appBarConfiguration);\n\
  \nbinding.fab.setOnClickListener(new View.OnClickListener() {\n    @Override\n \
  \   public void onClick(View view) {\n        Snackbar.make(view, \"Replace with\
  \ your own action\", Snackbar.LENGTH_LONG)\n        .setAction(\"Action\", null).show();\n\
  \    }\n});\n}\n```\n\n最后，删除 `onSupportNavigateUp()` 方法：\n\n```java\n@Override\n\
  public boolean onSupportNavigateUp() {\n    NavController navController = Navigation.findNavController(this,\
  \ R.id.nav_host_fragment_content_main);\n    return NavigationUI.navigateUp(navController,\
  \ appBarConfiguration)\n    || super.onSupportNavigateUp();\n}\n```\n\n## 48.4 创建第一个\
  \ Fragment\n\n`TabLayout` 上的每个标签在选中时将显示不同的 fragment。在 Project 工具窗口中，右键点击应用 -> `java`\
  \ -> `com.ebookfrenzy.tablayoutdemo` 条目，选择 New -> Fragment -> Fragment (Blank) 即可创建第一个\
  \ fragment。在弹出的对话框中，在 Fragment Name: 字段中输入 `Tab1Fragment`，在 Fragment Layout Name:\
  \ 字段中输入 `fragment_tab1`。点击 Finish 按钮创建新 fragment：\n\n![image-WSJTKBLJ.jpg](img/image-WSJTKBLJ.jpeg)\n\
  \n图 48-3\n\n编辑 `Tab1Fragment.java` 文件，如果 Android Studio 没有自动添加，请按照如下所示添加 `OnFragmentInteractionListener`\
  \ 接口声明：\n\n```java\n.\n.\nimport android.net.Uri;\n.\n.\npublic interface OnFragmentInteractionListener\
  \ {\n    // TODO: Update argument type and name\n    void onFragmentInteraction(Uri\
  \ uri);\n}\n.\n.\n```\n\n将新创建的 `fragment_tab1.xml` 文件（位于 `app` -> `res` -> `layout`）加载到\
  \ Layout Editor 工具中，在 Component Tree 面板中右键点击 `FrameLayout` 条目，选择 `Convert FrameLayout\
  \ to ConstraintLayout` 选项。在弹出的对话框中，点击 OK 之前确保选中了所有转换选项。将布局的 ID 更改为 `constraintLayout`。\n\
  \n一旦布局转换为 `ConstraintLayout`，请从布局中删除 `TextView`。从 Palette 中找到 `TextView` 控件，并将其拖动到布局的中心。编辑对象的\
  \ text 属性使其显示为“Tab 1 Fragment”，将字符串提取为命名为 `tab_1_fragment` 的资源，并点击 Infer Constraints\
  \ 工具栏按钮。此时，该布局应与图 48-4 一致：\n\n![image-HH14A1A2.jpg](img/image-HH14A1A2.jpeg)\n\n\
  图 48-4\n\n## 48.5 复制 Fragments\n\n到目前为止，项目包含了四个所需 fragment 中的一个。与其使用之前的步骤创建剩余的三个\
  \ fragment，直接复制第一个 fragment 会更快。每个 fragment 都由一个布局 XML 文件和一个 Java 类文件组成，每个文件都需要被复制。\n\
  \n在 Project 工具窗口中右键点击 `fragment_tab1.xml` 文件，并在弹出的菜单中选择 Copy 选项。再次右键点击布局条目，这次选择\
  \ Paste 选项。在弹出的对话框中点击 OK 按钮之前，将新布局文件命名为 `fragment_tab2.xml`。编辑新的 `fragment_tab2.xml`\
  \ 文件，并将 Text View 上的文本改为“Tab 2 Fragment”，按照通常步骤将字符串提取为命名为 `tab_2_fragment` 的资源。\n\
  \n要复制 `Tab1Fragment` 类文件，右键点击 `app` -> `java` -> `com.ebookfrenzy.tablayoutdemo`\
  \ 下列出的类并选择 Copy。右键点击 `com.ebookfrenzy.tablayoutdemo` 条目并选择 Paste。在 Copy Class 对话框中，在\
  \ New name: 字段中输入 `Tab2Fragment` 并点击 OK。\n\n新的 `Tab2Fragment.java` 文件并修改 `onCreateView()`\
  \ 方法以加载 `fragment_tab2` 布局文件：\n\n```java\n@Override\npublic View onCreateView(LayoutInflater\
  \ inflater, ViewGroup container, Bundle savedInstanceState) {\n    // Inflate the\
  \ layout for this fragment\n    return inflater.inflate(R.layout.fragment_tab2,\
  \ container, false);\n}\n```\n\n执行上述复制步骤两次，为剩余的两个 fragment 创建布局和类文件。完成这些步骤后，项目结构应与图\
  \ 48-5 一致：\n\n![image-MRWSRKW8.jpg](img/image-MRWSRKW8.jpeg)\n\n图 48-5\n\n## 48.6\
  \ 添加 TabLayout 和 ViewPager2\n\n现在 fragment 创建过程已经完成，下一步是向主活动布局文件添加 `TabLayout` 和\
  \ `ViewPager2`。编辑 `activity_main.xml` 文件，并按照下面的 XML 列表添加这些元素。注意 `TabLayout` 组件嵌入在\
  \ `AppBarLayout` 元素中，而 `ViewPager2` 放置在 `AppBarLayout` 之后：\n\n```xml\nxmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\nxmlns:tools=\"http://schemas.android.com/tools\"\
  \nandroid:layout_width=\"match_parent\"\nandroid:layout_height=\"match_parent\"\n\
  tools:context=\".MainActivity\">\n\n<AppBarLayout\n    android:layout_width=\"match_parent\"\
  \n    android:layout_height=\"wrap_content\"\n    android:theme=\"@style/Theme.TabLayoutDemo.AppBarOverlay\"\
  >\n\n    <Toolbar\n        android:id=\"@+id/toolbar\"\n        android:layout_width=\"\
  match_parent\"\n        android:layout_height=\"?attr/actionBarSize\"\n        android:background=\"\
  ?attr/colorPrimary\"\n        app:popupTheme=\"@style/Theme.TabLayoutDemo.PopupOverlay\"\
  \ />\n\n</AppBarLayout>\n\n<TabLayout\n    android:id=\"@+id/tabLayout\"\n    android:layout_width=\"\
  match_parent\"\n    android:layout_height=\"wrap_content\"\n    app:tabMode=\"fixed\"\
  \n    app:tabGravity=\"fill\" />\n\n<ViewPager2\n    android:id=\"@+id/view_pager\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    app:layout_behavior=\"@string/appbar_scrolling_view_behavior\" />\n\n<FloatingActionButton\n\
  \    android:id=\"@+id/fab\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:layout_gravity=\"bottom|end\"\n    android:layout_marginEnd=\"\
  @dimen/fab_margin\"\n    android:layout_marginBottom=\"16dp\"\n    app:srcCompat=\"\
  @android:drawable/ic_email\" />\n```\n\n## 48.7 创建 Pager Adapter\n\n本示例使用 `ViewPager2`\
  \ 方法处理分配给 `TabLayout` 的 fragment，需要添加一个子类 `FragmentStateAdapter` 的类来管理用户选择标签时显示的\
  \ fragment。\n\n在 Project 工具窗口中右键点击 `com.ebookfrenzy.tablayoutdemo` 条目，选择 New ->\
  \ Java Class 为项目添加新类。在新类对话框中，在 Name: 字段中输入 `TabPagerAdapter`，选择列表中的 Class 项并按回车键。\n\
  \n编辑 `TabPagerAdapter.java` 文件使其如下：\n\n```java\npackage com.ebookfrenzy.tablayoutdemo;\n\
  \nimport androidx.annotation.NonNull;\nimport androidx.fragment.app.*;\nimport androidx.viewpager2.adapter.FragmentStateAdapter;\n\
  \npublic class TabPagerAdapter extends FragmentStateAdapter {\n    int tabCount;\n\
  \n    public TabPagerAdapter(@NonNull FragmentActivity fragmentActivity, int numberOfTabs)\
  \ {\n        super(fragmentActivity);\n        this.tabCount = numberOfTabs;\n \
  \   }\n\n    @NonNull\n    @Override\n    public Fragment createFragment(int position)\
  \ {\n        switch (position) {\n            case 0:\n                return new\
  \ Tab1Fragment();\n            case 1:\n                return new Tab2Fragment();\n\
  \            case 2:\n                return new Tab3Fragment();\n            case\
  \ 3:\n                return new Tab4Fragment();\n            default:\n       \
  \         return null;\n        }\n    }\n\n    @Override\n    public int getItemCount()\
  \ {\n        return tabCount;\n    }\n}\n```\n\n## 48.8 执行初始化任务\n\n\n\n\n\n剩余的任务涉及初始化\
  \ `TabLayout`、`ViewPager2` 和 `TabPagerAdapter` 实例，并声明主 Activity 类实现针对四个标签页碎片（fragment）的片段交互监听器。编辑\
  \ `MainActivity.java` 文件，使其内容如下：\n\n```java\npackage com.ebookfrenzy.tablayoutdemo;\n\
  \n.\n\n.\n\nimport android.net.Uri;\n\nimport com.google.android.material.tabs.TabLayoutMediator;\n\
  \n.\n\n.\n\npublic class MainActivity extends AppCompatActivity implements\n   \
  \ Tab1Fragment.OnFragmentInteractionListener,\n    Tab2Fragment.OnFragmentInteractionListener,\n\
  \    Tab3Fragment.OnFragmentInteractionListener,\n    Tab4Fragment.OnFragmentInteractionListener\
  \ {\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n\
  .\n.\n        configureTabLayout();\n    }\n\n    protected void configureTabLayout()\
  \ {\n        for (int i = 0; i < 4; i++) {\n            binding.tabLayout.addTab(binding.tabLayout.newTab());\n\
  \        }\n        final TabPagerAdapter adapter = new TabPagerAdapter\n      \
  \      (this, binding.tabLayout.getTabCount());\n        binding.viewPager.setAdapter(adapter);\n\
  \        new TabLayoutMediator(binding.tabLayout, binding.viewPager,\n         \
  \   (tab, position) -> tab.setText(\"Tab \" + (position + 1) + \" Item\")).attach();\n\
  \    }\n\n    @Override\n    public void onFragmentInteraction(Uri uri) {\n    }\n\
  \n.\n.\n}\n```\n\n代码首先通过以下方式创建四个标签并将它们添加到 `TabLayout` 实例中：\n\n```java\nfor (int\
  \ i = 0; i < 4; i++) {\n    binding.tabLayout.addTab(binding.tabLayout.newTab());\n\
  }\n```\n\n接下来，创建一个 `TabPagerAdapter` 类的实例。请注意，创建 `TabPagerAdapter` 实例的代码传递了分配给 `TabLayout`\
  \ 组件的标签数量。然后，将 `TabPagerAdapter` 实例赋值为 `ViewPager2` 实例的适配器：\n\n```java\nfinal TabPagerAdapter\
  \ adapter = new TabPagerAdapter\n    (this, binding.tabLayout.getTabCount());\n\
  binding.viewPager.setAdapter(adapter);\n```\n\n最后，使用 `TabLayoutMediator` 类的实例将 `TabLayout`\
  \ 与 `ViewPager2` 对象连接：\n\n```java\nnew TabLayoutMediator(binding.tabLayout, binding.viewPager,\n\
  \    (tab, position) -> tab.setText(\"Tab \" + (position + 1) + \" Item\")).attach();\n\
  ```\n\n该类确保 `TabLayout` 标签与当前选中的碎片保持同步。此过程涉及确保每个标签上显示正确的文本。在这种情况下，文本被配置为“Tab Item”，其中\
  \ Item 被当前选中标签的数字替换。\n\n## 48.9 测试应用程序\n\n在设备或模拟器上编译并运行应用，确保选择某个标签会导致相应的碎片出现在屏幕的内容区域中：\n\
  \n![image-5M4FM02I.jpg](img/image-5M4FM02I.jpeg)\n\n图 48-6\n\n## 48.10 定制 TabLayout\n\
  \n此示例项目中的 `TabLayout` 使用固定模式（fixed mode）配置。这种模式适用于数量较少且标题较短的标签。在使用固定模式时，标签数量过多或标题较长可能会迅速成为问题，如图\
  \ 48-7 所示：\n\n![image-OR4V3FYD.jpg](img/image-OR4V3FYD.jpeg)\n\n图 48-7\n\n为了使标签适应可用显示宽度，`TabLayout`\
  \ 使用了多行文本。尽管如此，第二行仍被裁剪，导致无法看到完整标题。解决此问题的解决方案是将 `TabLayout` 切换到可滚动模式（scrollable mode）。在这种模式下，标题以全长度、单行格式出现，允许用户通过滑动水平滚动查看可用项目，如图\
  \ 48-8 所示：\n\n![image-SPASLAIC.jpg](img/image-SPASLAIC.jpeg)\n\n图 48-8\n\n要将 `TabLayout`\
  \ 切换到可滚动模式，将 `activity_main.xml` 布局资源文件中的 `app:tabMode` 属性从“fixed”更改为“scrollable”：\n\
  \n```xml\nandroid:id=\"@+id/tabLayout\"\nandroid:layout_width=\"match_parent\"\n\
  android:layout_height=\"wrap_content\"\napp:tabMode=\"scrollable\"\napp:tabGravity=\"\
  fill\"/>\n```\n\n在固定模式下，可以配置 `TabLayout` 来控制标签项目的显示方式，以占据屏幕上的可用空间。这是通过 `app:tabGravity`\
  \ 属性控制的，其结果在较宽的显示（如横屏模式下的平板电脑）上更为明显。例如，设置为“fill”时，项目将均匀分布在 `TabLayout` 的宽度上，如图 48-9\
  \ 所示：\n\n![image-ZQBURE0W.jpg](img/image-ZQBURE0W.jpeg)\n\n图 48-9\n\n将属性值更改为“center”会导致项目相对于标签栏中心定位：\n\
  \n![image-ISJELU9X.jpg](img/image-ISJELU9X.jpeg)\n\n图 48-10\n\n## 48.11 总结\n\n`TabLayout`\
  \ 是 Android Material 设计实现引入的组件之一。`TabLayout` 组件的目的是展示一系列显示不同内容的标签项目。当 `TabLayout`\
  \ 与 `ViewPager2` 类结合时，可以轻松创建显示文本、图像或组合的标签布局。\n\n## 49. 使用 RecyclerView 和 CardView\n\
  \n`RecyclerView` 和 `CardView` 控件共同工作，为用户提供可滚动列表。本章将涵盖这两个类的详细信息。\n\n### 49.1 RecyclerView\
  \ 概述\n\n与“Floating Action Button and Snackbar”章节中的 `ListView` 类似，`RecyclerView`\
  \ 的目的是允许呈现可滚动列表。然而，`RecyclerView` 相比 `ListView` 具有若干优势。特别是，`RecyclerView` 在复用滚动出屏幕视图而不是创建新视图方面高效得多（这也是其名称的来源），这在向用户展示大量数据时提高了性能。\n\
  \n与 `ListView` 不同，`RecyclerView` 还提供了三种内置布局管理器来控制标签项目的呈现方式：\n\n- `LinearLayoutManager`\
  \ —— 标签以水平或垂直列表的形式呈现。\n\n![image-EZ4I49JA.jpg](img/image-EZ4I49JA.jpeg)\n\n图 49-1\n\
  \n- `GridLayoutManager` —— 标签以网格格式呈现。这种管理器最适用于标签大小一致的情况。\n\n![image-T9TSCU41.jpg](img/image-T9TSCU41.jpeg)\n\
  \n图 49-2\n\n- `StaggeredGridLayoutManager` - 标签以交错网格格式呈现。这种管理器最适用于标签大小不一的情况。\n\n\
  ![image-7CCCZQ6O.jpg](img/image-7CCCZQ6O.jpeg)\n\n图 49-3\n\n对于三种内置管理器都无法提供所需布局的情况，可以通过子类化\
  \ `RecyclerView.LayoutManager` 类来实现自定义布局管理器。\n\n`RecyclerView` 中的每个列表项都创建为 `ViewHolder`\
  \ 类的实例。`ViewHolder` 实例包含了 `RecyclerView` 显示列表项所需的所有内容，包括要显示的信息和用于显示的视图布局。\n\n与 `ListView`\
  \ 一，`RecyclerView` 依赖适配器（adapter）作为 `RecyclerView` 实例与要显示的数据之间的中介。适配器被创建为 `RecyclerView.Adapter`\
  \ 类的子类，并至少实现以下方法，这些方法会被分配给它的 `RecyclerView` 对象在不同点调用：\n\n- `getItemCount()` —— 该方法必须返回列表中显示的项目数量。\n\
  - `onCreateViewHolder()` —— 该方法创建并返回一个用视图初始化的 `ViewHolder` 对象。该视图通常通过加载 XML 布局文件创建。\n\
  \n\n\n\n\n- `onBindViewHolder()` – 此方法接收由 `onCreateViewHolder()` 方法创建的 `ViewHolder`\
  \ 对象，以及一个指示即将显示的列表项的整数值。`ViewHolder` 对象包含了由 `onCreateViewHolder()` 方法分配的布局。`onBindViewHolder()`\
  \ 方法负责为布局中的视图填充与指定项目相对应的文本和图形，并将该对象返回给 `RecyclerView`，由其将其展示给用户。\n\n在布局中添加 `RecyclerView`\
  \ 只需要在要显示该组件的 Activity XML 内容布局文件中添加相应的元素即可。例如：\n\n```xml\nxmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \nxmlns:app=\"http://schemas.android.com/apk/res-auto\"\nxmlns:tools=\"http://schemas.android.com/tools\"\
  \nandroid:layout_width=\"match_parent\"\nandroid:layout_height=\"match_parent\"\n\
  app:layout_behavior=\"@string/appbar_scrolling_view_behavior\"\ntools:context=\"\
  .MainActivity\"\ntools:showIn=\"@layout/activity_card_demo\"\nandroid:id=\"@+id/recycler_view\"\
  \nandroid:layout_width=\"0dp\"\nandroid:layout_height=\"0dp\"\napp:layout_constraintBottom_toBottomOf=\"\
  parent\"\napp:layout_constraintEnd_toEndOf=\"parent\"\napp:layout_constraintStart_toStartOf=\"\
  parent\"\napp:layout_constraintTop_toTopOf=\"parent\"\ntools:listItem=\"@layout/card_layout\"\
  \ />\n```\n\n在上面的示例中，`RecyclerView` 已嵌入到主 Activity 布局文件的 `CoordinatorLayout` 中，并带有\
  \ `AppBar` 和 `Toolbar`。这提供了额外的功能，例如当用户在 `RecyclerView` 中向上滑动时，配置 `Toolbar` 和 `AppBar`\
  \ 滑出屏幕（该主题在“使用 AppBar 和 Collapsing Toolbar Layouts”章节中有更详细介绍）。\n\n## 49.2 CardView\
  \ 概述\n\n`CardView` 类是一种用户界面视图，允许使用卡片比喻分组展示信息。卡片通常通过 `RecyclerView` 实例以列表形式呈现，并可以配置为带有阴影效果和圆角。例如，图\
  \ 49-4 显示了三个配置好的 `CardView` 实例，它们显示一个由 `ImageView` 和两个 `TextView` 组成的布局：\n\n![image-NAO2G9FK.jpg](img/image-NAO2G9FK.jpeg)\n\
  \n图 49-4\n\n随 `CardView` 实例一同呈现的用户界面布局在 XML 布局资源文件中定义，并在运行时加载到 `CardView` 中。`CardView`\
  \ 布局可以包含任何复杂的布局，可以使用标准的布局管理器如 `RelativeLayout` 和 `LinearLayout`。以下 XML 布局文件表示一个由\
  \ `RelativeLayout` 和单个 `ImageView` 组成的卡片视图布局。该卡片被配置为提升以创建阴影效果，并带有圆角显示：\n\n```xml\n\
  xmlns:card_view=\"http://schemas.android.com/apk/res-auto\"\nxmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \nandroid:id=\"@+id/card_view\"\nandroid:layout_width=\"match_parent\"\nandroid:layout_height=\"\
  wrap_content\"\nandroid:layout_margin=\"5dp\"\ncard_view:cardCornerRadius=\"12dp\"\
  \ncard_view:cardElevation=\"3dp\"\ncard_view:contentPadding=\"4dp\"\nandroid:layout_width=\"\
  match_parent\"\nandroid:layout_height=\"wrap_content\"\nandroid:padding=\"16dp\"\
  \ >\nandroid:layout_width=\"100dp\"\nandroid:layout_height=\"100dp\"\nandroid:id=\"\
  @+id/item_image\"\nandroid:layout_alignParentLeft=\"true\"\nandroid:layout_alignParentTop=\"\
  true\"\nandroid:layout_marginRight=\"16dp\" />\n```\n\n当结合 `RecyclerView` 创建可滚动卡片列表时，适配列表的\
  \ `onCreateViewHolder()` 方法会充气卡片的布局资源文件，将其分配给 `ViewHolder` 实例并返回给 `RecyclerView`\
  \ 实例。\n\n## 49.3 总结\n\n本章介绍了 Android `RecyclerView` 和 `CardView` 组件。`RecyclerView`\
  \ 提供了一种资源高效的方式，用于 Android 应用中显示可滚动视图列表。当以卡片形式呈现数据组（例如名称和地址列表）时，`CardView` 非常有用。正如在下一章教程中所概述和演示的那样，`RecyclerView`\
  \ 和 `CardView` 结合使用时特别有用。\n\n## 50. Android RecyclerView 和 CardView 教程\n\n本章将创建一个示例项目，同时使用\
  \ `CardView` 和 `RecyclerView` 组件来创建一个可滚动卡片列表。完成后的应用将显示一个包含图像和文本的卡片列表。除了显示卡片列表外，项目还将实现为：选择卡片将向用户显示消息，指示点击了哪张卡片。\n\
  \n## 50.1 创建 CardDemo 项目\n\n从欢迎界面选择 New Project（新建项目），在弹出的新项目对话框中，点击 Next（下一步）按钮之前选择\
  \ Basic Views Activity 模板。\n\n在 Name（名称）字段中输入 `CardDemo`，并指定 `com.ebookfrenzy.carddemo`\
  \ 为包名。在点击 Finish（完成）按钮之前，将 Minimum API level 设置为 `API 26: Android 8.0 (Oreo)`，并将语言菜单设置为\
  \ `Java`。\n\n## 50.2 修改 Basic Views Activity 项目\n\n由于选择了 Basic Views Activity，布局中包含了一个该项目所需的悬浮按钮。在布局编辑器中加载\
  \ `activity_main.xml` 布局文件，选择悬浮按钮并按删除键将其从布局中移除。编辑 `MainActivity.java` 文件，在 `onCreate`\
  \ 方法中移除悬浮按钮代码并如下：\n\n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState)\
  \ {\n    super.onCreate(savedInstanceState);\n    binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \    setContentView(binding.getRoot());\n    setSupportActionBar(binding.toolbar);\n\
  \    NavController navController = Navigation.findNavController(this, R.id.nav_host_fragment);\n\
  \    appBarConfiguration = new AppBarConfiguration.Builder(navController.getGraph()).build();\n\
  \    NavigationUI.setupActionBarWithNavController(this, navController, appBarConfiguration);\n\
  \    binding.fab.setOnClickListener(new View.OnClickListener() {\n        @Override\n\
  \        public void onClick(View view) {\n            Snackbar.make(view, \"Replace\
  \ with action\", Snackbar.LENGTH_LONG)\n                .setAction(\"Action\", null).show();\n\
  \        }\n    });\n}\n```\n\n此外，移除 `onSupportNavigateUp()` 方法，然后打开 `content_main.xml`\
  \ 文件并从布局中删除 `nav_host_fragment` 对象，保留 `ConstraintLayout`。\n\n## 50.3 设计 CardView\
  \ 布局\n\n卡片内部包含的视图布局将在单独的 XML 文件中定义。在项目工具中，右键点击 `app -> layout` 条目并选择 `New -> Layout\
  \ Resource File`。在 New Resource 对话框中，在 `File name:` 字段输入 `card_layout`，并在点击 OK 按钮之前根元素字段输入\
  \ `androidx.cardview.widget.CardView`。\n\n将 `card_layout.xml` 文件加载到布局编辑器，切换到 Code\
  \ 模式并修改布局如下：\n\n```xml\nxmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \nxmlns:app=\"http://schemas.android.com/apk/res-auto\"\nandroid:layout_width=\"\
  match_parent\"\nandroid:layout_height=\"wrap_content\"\nandroid:id=\"@+id/card_view\"\
  \nandroid:layout_margin=\"5dp\"\napp:cardBackgroundColor=\"#80B3EF\"\napp:cardCornerRadius=\"\
  12dp\"\napp:cardElevation=\"3dp\"\napp:contentPadding=\"4dp\" >\n\nandroid:id=\"\
  @+id/relativeLayout\"\nandroid:layout_width=\"match_parent\"\nandroid:layout_height=\"\
  wrap_content\"\nandroid:padding=\"16dp\">\n\nandroid:id=\"@+id/itemImage\"\nandroid:layout_width=\"\
  100dp\"\nandroid:layout_height=\"100dp\"\napp:layout_constraintLeft_toLeftOf=\"\
  parent\"\napp:layout_constraintStart_toStartOf=\"parent\"\napp:layout_constraintTop_toTopOf=\"\
  parent\" />\n\nandroid:id=\"@+id/itemTitle\"\nandroid:layout_width=\"236dp\"\nandroid:layout_height=\"\
  39dp\"\nandroid:layout_marginStart=\"16dp\" />\n```\n\n\n\n\n\n```xml\nandroid:textSize=\"\
  30sp\"\napp:layout_constraintLeft_toRightOf=\"@+id/itemImage\"\napp:layout_constraintStart_toEndOf=\"\
  @+id/itemImage\"\napp:layout_constraintTop_toTopOf=\"parent\" />\nandroid:id=\"\
  @+id/itemDetail\"\nandroid:layout_width=\"236dp\"\nandroid:layout_height=\"16dp\"\
  \nandroid:layout_marginStart=\"16dp\"\nandroid:layout_marginTop=\"8dp\"\napp:layout_constraintLeft_toRightOf=\"\
  @+id/itemImage\"\napp:layout_constraintStart_toEndOf=\"@+id/itemImage\"\napp:layout_constraintTop_toBottomOf=\"\
  @+id/itemTitle\" />\n```\n\n## 50.4 添加 RecyclerView\n\n选择 `content_main.xml` 布局文件，从调色板的\
  \ `Containers` 部分将 `RecyclerView` 对象拖到布局中，使其位于屏幕中心，它本应自动调整大小以填充整个屏幕。使用 `Infer` 约束工具栏按钮为视图添加任何缺失的布局约束。使用\
  \ `Attributes` 工具窗口，将 `RecyclerView` 实例的 `ID` 更改为 `recyclerView`，并将 `layout_width`\
  \ 和 `layout_height` 属性更改为 `match_constraint`。\n\n## 50.5 添加图片文件除了两个 `TextView` 之外，卡片布局还包含一个\
  \ `ImageView`，该视图已配置 `Recycler adapter` 以显示图像。在项目测试之前，必须添加这些图像。项目将使用的图像命名为 `android_image_.jpg`，可以在从以下\
  \ URL 下载的示例代码 `project_icons` 文件夹中找到：\n\n[`www.payloadbooks.com/product/ladybugjava`](https://www.payloadbooks.com/product/ladybugjava)\n\
  \n在你操作系统的文件系统导航器中找到这些图片，选择并复制这八张图片。在 `Project` 工具窗口中右键点击 `app` -> `res` -> `drawable`\
  \ 项，并选择 `Paste` 将文件添加到文件夹中：\n\n![image-28VJ7YLS.jpg](img/image-28VJ7YLS.jpeg)\n\n\
  图 50-1\n\n## 50.6 创建 RecyclerView Adapter\n\n如上一节所述，`RecyclerView` 需要适配器来处理列表项的创建。在\
  \ `Project` 工具窗口中右键点击 `app` -> `java` -> `com.ebookfrenzy.carddemo` 项，并选择 `New`\
  \ -> `Java Class` 菜单选项将此新类添加到项目中。在新类对话框中，在 `Name` 字段输入 `RecyclerAdapter`，并在列表中选择\
  \ `Class`，然后按 `Return` 键创建新的 Java 类文件。\n\n编辑 `RecyclerAdapter.java` 文件以添加一些导入指令，并声明该类现在扩展\
  \ `RecyclerView.Adapter`。与其创建一个单独的类来提供要显示的数据，不如向适配器添加一些基础数组作为应用的数据：\n\n```java\n\
  package com.ebookfrenzy.carddemo;\n\nimport android.view.LayoutInflater;\nimport\
  \ android.view.View;\nimport android.view.ViewGroup;\nimport android.widget.ImageView;\n\
  import android.widget.TextView;\nimport androidx.annotation.NonNull;\nimport androidx.recyclerview.widget.RecyclerView;\n\
  \npublic class RecyclerAdapter extends RecyclerView.Adapter {\n    final private\
  \ String[] titles = {\n        \"Chapter One\",\n        \"Chapter Two\",\n    \
  \    \"Chapter Three\",\n        \"Chapter Four\",\n        \"Chapter Five\",\n\
  \        \"Chapter Six\",\n        \"Chapter Seven\",\n        \"Chapter Eight\"\
  \n    };\n    final private String[] details = {\n        \"Item one details\",\n\
  \        \"Item two details\", \"Item three details\",\n        \"Item four details\"\
  , \"Item five details\",\n        \"Item six details\", \"Item seven details\",\n\
  \        \"Item eight details\"\n    };\n    final private int[] images = { \n \
  \       R.drawable.android_image_1,\n        R.drawable.android_image_2,\n     \
  \   R.drawable.android_image_3,\n        R.drawable.android_image_4,\n        R.drawable.android_image_5,\n\
  \        R.drawable.android_image_6,\n        R.drawable.android_image_7,\n    \
  \    R.drawable.android_image_8 \n    };\n}\n```\n\n在 `RecyclerAdapter` 类中，我们现在需要自己的\
  \ `ViewHolder` 类实现，并配置以引用 `card_layout.xml` 文件中的视图元素。留在 `RecyclerAdapter.java` 中，如下如下实现此类：\n\
  \n```java\npublic class RecyclerAdapter extends RecyclerView.Adapter {\n    // ...\n\
  \    static class ViewHolder extends RecyclerView.ViewHolder {\n        ImageView\
  \ itemImage;\n        TextView itemTitle;\n        TextView itemDetail;\n      \
  \  ViewHolder(View itemView) {\n            super(itemView);\n            itemImage\
  \ = itemView.findViewById(R.id.itemImage);\n            itemTitle = itemView.findViewById(R.id.itemTitle);\n\
  \            itemDetail = itemView.findViewById(R.id.itemDetail);\n        }\n \
  \   }\n}\n```\n\n`ViewHolder` 类包含一个 `ImageView` 和两个 `TextView` 变量，以及一个构造方法，该方法通过对\
  \ `card_layout.xml` 文件中三个视图项的引用初始化这些变量。\n\n下一个添加到 `RecyclerAdapter.java` 文件的项是 `onCreateViewHolder`\
  \ 的实现：\n\n```java\n@NonNull\n@Override\npublic ViewHolder onCreateViewHolder(ViewGroup\
  \ viewGroup, int i) {\n    View v = LayoutInflater.from(viewGroup.getContext())\n\
  \        .inflate(R.layout.card_layout, viewGroup, false);\n    return new ViewHolder(v);\n\
  }\n```\n\n此方法将被 `RecyclerView` 调用以获取 `ViewHolder` 实例。\n\n要添加到 `RecyclerAdapter.java`\
  \ 的下一个项是 `onBindViewHolder` 方法，它使用索引填充视图数据：\n\n```java\n@Override\npublic void onBindViewHolder(ViewHolder\
  \ viewHolder, int i) {\n    viewHolder.itemTitle.setText(titles[i]);\n    viewHolder.itemDetail.setText(details[i]);\n\
  \    viewHolder.itemImage.setImageResource(images[i]);\n}\n```\n\n适配器的最后一个要求是实现\
  \ `getItemCount()` 方法，在此情况下它返回 `titles` 数组的数量：\n\n```java\n@Override\npublic int\
  \ getItemCount() {\n    return titles.length;\n}\n```\n\n## 50.7 初始化 RecyclerView\
  \ 组件\n\n此时，项目包含一个 `RecyclerView` 实例、一个 XML 布局文件和一个 `RecyclerView` 适配器。在测试之前的最后一步是使用布局管理器初始化\
  \ `RecyclerView`，创建适配器实例并将其分配给 `RecyclerView` 对象。对于本示例，`RecyclerView` 将配置为使用 `LinearLayoutManager`。\n\
  \n这里有一点复杂性，因为我们需要在 `MainActivity` 类内部使用视图绑定。问题是 `recyclerView` 包含在 `content_main.xml`\
  \ 中，而该文件又包含在 `activity_main.xml` 中。为了进入 `content_main.xml` 文件，我们需要在包含处为其分配一个 ID。为此，编辑\
  \ `activity_main.xml` 文件并修改 `include` 元素如下：\n\n```xml\n<include\n    android:id=\"\
  @+id/contentMain\"\n    layout=\"@layout/content_main\" />\n```\n\n为包含的文件分配 ID 后，可以使用以下绑定访问\
  \ `recyclerView` 组件：\n\n`binding.contentMain.recyclerView`\n\n现在编辑 `MainActivity.java`\
  \ 文件并修改 `onCreate()` 方法以实现初始化代码：\n\n```java\npackage com.ebookfrenzy.carddemo;\n\
  \n// ...\nimport androidx.recyclerview.widget.LinearLayoutManager;importimport androidx.recyclerview.widget.RecyclerView;\n\
  // ...\n\npublic class MainActivity extends AppCompatActivity {\n    private RecyclerView\
  \ recyclerView;\n    private RecyclerView.LayoutManager layoutManager;\n    private\
  \ RecyclerView.Adapter adapter;\n\n    // ...\n    @Override\n    protected void\
  \ onCreate(Bundle savedInstanceState) {\n        // ...\n        setSupportActionBar(toolbar);\n\
  \        layoutManager = new LinearLayoutManager(this);\n        binding.contentMain.recyclerView.setLayoutManager(layoutManager);\n\
  \        adapter = new RecyclerAdapter();\n    }\n}\n```\n\n\n\n\n```java\nbinding.contentMain.recyclerView.setAdapter(adapter);\n\
  \n}\n\n```\n\n## 50.8 测试应用程序\n\n在物理设备或模拟器会话上编译并运行应用，然后滚动列表中的不同卡片项：\n\n![image-HT05V78J.jpg](img/image-HT05V78J.jpeg)\n\
  \n图 50-2\n\n## 50.9 响应卡片选择\n\n此项目的最后一个阶段是使列表中的卡片变为可选择，这样点击卡片就能触发应用内部的事件。在本示例中，卡片将被配置为在用户点击时在显示器上显示消息。为了响应点击操作，需要修改\
  \ `ViewHolder` 类，在每个项目视图上分配一个 `OnClickListener`。编辑 `RecyclerAdapter.java` 文件并修改\
  \ `ViewHolder` 类的声明，使其如下：\n\n```java\nimport com.google.android.material.snackbar.Snackbar;\n\
  \nclass ViewHolder extends RecyclerView.ViewHolder{\n    ImageView itemImage;\n\
  \    TextView itemTitle;\n    TextView itemDetail;\n\n    ViewHolder(View itemView)\
  \ {\n        super(itemView);\n        itemImage = itemView.findViewById(R.id.item_image);\n\
  \        itemTitle = itemView.findViewById(R.id.item_title);\n        itemDetail\
  \ = itemView.findViewById(R.id.item_detail);\n        itemView.setOnClickListener(new\
  \ View.OnClickListener() {\n            @Override public void onClick(View v) {\n\
  \n            }\n        });\n    }\n}\n```\n\n在 `onClick` 处理程序的体部中，现在可以添加代码来显示一条消息，指示卡片已被点击。由于点击后执行的操作可能取决于点击了哪张卡片，因此识别选定的卡片也很重要。此信息可以通过调用\
  \ `RecyclerView.ViewHolder` 类的 `getAdapterPosition()` 方法获取。在留在 `RecyclerAdapter.java`\
  \ 文件中，为 `onClick` 处理程序添加代码，使其如下：\n\n```java\n@override\npublic void onClick(View\
  \ v) {\n    int position = getAdapterPosition();\n    Snackbar.make(v, \"Click detected\
  \ on item \" + (position + 1),\n            Snackbar.LENGTH_LONG)\n            .setAction(\"\
  Action\", null).show();\n}\n```\n\n最后一个任务是启用 Android 应用中点击项目时出现的材质设计波纹效果。这涉及在 `card_layout.xml`\
  \ 文件中为 `CardView` 实例声明添加一些属性，如下：\n\n```xml\nxmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \nxmlns:card_view=\"http://schemas.android.com/apk/res-auto\"\nandroid:layout_width=\"\
  match_parent\"\nandroid:layout_height=\"match_parent\"\nandroid:id=\"@+id/card_view\"\
  \nandroid:layout_margin=\"5dp\"\napp:cardBackgroundColor=\"#80B3EF\"\napp:cardCornerRadius=\"\
  12dp\"\napp:cardElevation=\"3dp\"\nandroid:contentPadding=\"4dp\"\nandroid:foreground=\"\
  ?selectableItemBackground\"\nandroid:clickable=\"true\" >\n```\n\n再次运行应用，并验证点击列表中的卡片是否会同时触发接触点的标准波纹效果，以及显示报告所选项目编号的\
  \ `Snackbar`。\n\n## 50.10 总结\n\n本章介绍了了结合 `CardView` 和 `RecyclerView` 组件以显示可滚动卡片式项目列表的步骤。示例还涵盖了对列表项点击的检测，包括识别选中的项目以及在被点击的\
  \ `CardView` 实例上启用波纹效果视觉反馈。\n\n## 51. 布局编辑器示例数据教程\n\n在前一章中创建的 `CardDemo` 项目提供了一个很好的示例，说明了在完成应用测试之前，从布局编辑器内部准确评估用户界面将如何呈现是多么困难的。当用户界面中要显示的内容只有在用户安装并运行应用后才生成或获取时，这是一个经常发生的问题。\n\
  \n一段时间以来，Android Studio 布局编辑器一直提供了指定简单属性的功能，这些属性仅在设计布局时有效。例如，可以将一个仅限设计时的字符串资源分配给布局编辑器中的\
  \ `TextView`，该资源在应用运行时不会显示。随着 Android Studio 布局编辑器中引入示例数据支持，这一功能得到了显著扩展，并在本章中使用它来改进\
  \ `CardDemo` 项目中布局编辑器的体验。\n\n## 51.1 为项目添加示例数据\n\n在用户界面布局的设计阶段，`RecyclerView` 实例（图\
  \ 51-1）与上一章末尾测试的运行应用几乎没有相似之处：\n\n![image-O0KNJGHA.jpg](img/image-O0KNJGHA.jpeg)\n\
  \n图 51-1\n\n在书中早前的“使用 Jetpack 构建现代 Android 应用架构”章节中引入了示例数据的概念。为了演示示例数据的使用，现在将修改项目，以便在\
  \ `RecyclerView` 中显示填充好的卡片。在此之前，值得注意的是布局编辑器有一系列预配置示例数据模板可以在设计用户界面时使用。为了查看这些效果，加载\
  \ `content_main.xml` 布局文件并选择 `RecyclerView` 实例。右键点击 `RecyclerView` 并选择 `Set Sample\
  \ Data` 选项以显示工具属性面板：\n\n![image-KXT0S7C.jpg](img/KXT0S7C.jpeg)\n\n图 51-2\n\n将模板更改为\
  \ `Email` 项目计数更改为 12，注意 `RecyclerView` 的变化如下：\n\n![image-CFY4CM.jpg](img/CFY4CM.jpeg)\n\
  \n图 51-3\n\n这些模板在无需额外工作的情况下显示数据非常有用，且通常足以完成布局。然而，在本示例中，将使用示例数据来显示卡片在应用中的预期样式。当布局编辑器中仍加载\
  \ `content_main.xml` 文件时，切换到代码模式并找到 `RecyclerView` 元素，其内容如下：\n\n```xml\nandroid:id=\"\
  @+id/recyclerView\"\nandroid:layout_width=\"0dp\"\nandroid:layout_height=\"0dp\"\
