  \n图 45-23\n\n位置关键帧由预览画布中表示路径的虚线上的菱形标记表示，如图 45-24 所示（如果标记可见，请确保在预览中选中了 `Button` 视图）：\n\
  \n![image-LKPRPGN.jpg](img/image-LKPRPGN.jpeg)\n\n图 45-24\n\n要视觉调整关键帧的位置，点击标记并将其拖到新位置。随着标记移动，Motion\
  \ Layout 编辑器将显示当前的 x 和 y 坐标：\n\n![image-6NOJ5K1.jpg](img/image-6NOJ5K1.jpeg)\n\n\
  图 45-25\n\n## 45.9 总结\n\n本章介绍了 Android Studio 内的 MotionLayout 编辑器，并探索了如何使用它在无需手动编写\
  \ XML 的情况下为 Android 应用界面添加动画。本章涵盖的示例包括将 `ConstraintLayout` 容器转换为 `MotionLayout`、在\
  \ `MotionScene` 文件中创建起始和结束集及过渡，以及添加 `OnClick` 处理程序。动画预览、自定义属性和位置关键帧也涵盖在内。\n\n##\
  \ 46. MotionLayout KeyCycle Tutorial\n\n之前的章节介绍并演示了使用 `MotionLayout` 容器将动画集成到 Android\
  \ 应用界面的概念。标题为“Introduction to MotionLayout”的章节简要提到了循环（`KeyCycle`）和时间循环关键帧（`KeyCycle`），并解释了如何使用这些来实现涉及大量重复状态变化的动画。\n\
  \n\n\n本章将详细介绍循环关键帧（cycle keyframes），并在演示如何使用 `Android Studio` 和 `Cycle Editor`（循环编辑器）在示例项目创建创建它们。\n\
  \n## 46.1 循环关键帧概述\n\n位置关键帧（Position keyframes）可以为动画时间轴添加中间状态变化。虽然这对于少量的状态变化效果良好，但在数量较多时实现起来会非常繁琐。例如，为了让按钮在被点击时抖动\
  \ 50 次以表示发生错误，将涉及手动创建 100 个位置关键帧来执行微小的顺时针和逆时针旋转。同样，在视图跨越屏幕时实现跳动效果也同样耗时。\n\n对于需要重复执行状态变化的情况，`MotionLayout`\
  \ 包含了 `Cycle`（循环）和 `Time Cycle`（时间循环）关键帧。两者执行相同的任务，区别在于 `KeyCycle` 帧基于动画路径中的帧位置，而\
  \ `KeyTimeCycles` 是基于每秒循环次数（`Hz`）的时间。\n\n使用这些 `KeyCycle` 帧，时间轴本质上被划分为若干子集（称为循环），每个子集包含一个或多个波形，定义了视图属性在整个时间轴上的修改方式。创建\
  \ `KeyCycle` 循环时需要以下信息：\n\n* `target view` - 目标视图 - 执行更改的视图 ID。\n* `frame position`\
  \ - 帧位置 - 循环开始的时间轴位置。\n* `wave period` - 波周期 - 循环中包含的波形数量。\n* `attribute` - 属性 -\
  \ 被波形修改的视图属性。\n* `wave offset` - 波偏移 - 根据指定量从关键帧基线偏移循环。\n* `wave shape` - 波形 - 波的形状（`sin`\
  \ 正弦、`cos` 余弦、`sawtooth` 锯齿、`square` 方形、`triangle` 三角形、`bounce` 弹跳或 `reverse sawtooth`\
  \ 反锯齿)。\n\n考虑以下循环关键帧集：\n\n```\nmotion:framePosition=\"0\"\nmotion:motionTarget=\"\
  @+id/button\"\nmotion:wavePeriod=\"1\"\nmotion:waveOffset=\"0dp\"\nmotion:waveShape=\"\
  sin\"\nandroid:translationY=\"50dp\"/>\nmotion:framePosition=\"25\"\nmotion:motionTarget=\"\
  @+id/button\"\nmotion:wavePeriod=\"1\"\nmotion:waveOffset=\"0dp\"\nmotion:waveShape=\"\
  sin\"\nandroid:translationY=\"50dp\"/>\nmotion:framePosition=\"50\"\nmotion:motionTarget=\"\
  @+id/button\"\nmotion:wavePeriod=\"1\"\nmotion:waveOffset=\"0dp\"\nmotion:waveShape=\"\
  sin\"\nandroid:translationY=\"50dp\"/>\nmotion:framePosition=\"75\"\nmotion:motionTarget=\"\
  @+id/button\"\nmotion:wavePeriod=\"1\"\nmotion:waveOffset=\"0dp\"\nmotion:waveShape=\"\
  sin\"\nandroid:translationY=\"50dp\"/>\nmotion:framePosition=\"100\"\nmotion:motionTarget=\"\
  @+id/button\"\nmotion:wavePeriod=\"1\"\nmotion:waveOffset=\"0dp\"\nmotion:waveShape=\"\
  sin\"\nandroid:translationY=\"50dp\"/>\n```\n\n上述关键帧集将时间轴划分为四个相等的循环。每个循环都配置为包含一个\
  \ `sin` 波形，该波形将按钮的 `translationY` 属性调整 50dp。此动画在执行时将导致按钮在指定范围内多次发生垂直振荡。此关键帧集可以可视化为如图\
  \ 46-1 所示，其中五个点代表关键帧位置：\n\n![image-ZP8OOFU4.jpg](img/image-ZP8OOFU4.jpeg)\n\n图 46-1\n\
  \n按照目前的实现方式，每个循环包含单个波形。假设我们需要在最后一个循环中包含四个波，而不是这些均匀分布的波。这可以通过增加最后一个 `KeyCycle` 元素的\
  \ `wavePeriod` 属性来轻松实现，如下所示：\n\n```\n...\nmotion:framePosition=\"75\"\nmotion:motionTarget=\"\
  @+id/button\"\nmotion:wavePeriod=\"4\"\nmotion:waveOffset=\"0dp\"\nmotion:waveShape=\"\
  sin\"\nandroid:translationY=\"50dp\"/>\n```\n\n进行此更改后，帧集可以以波形形式渲染如下：\n\n![image-ILYPB3RH.jpg](img/image-ILYPB3RH.jpeg)\n\
  \n图 46-2\n\n到为止，本章的示例一直使用 `sin` 波。在 `MotionLayout` 中处理循环关键帧时，还有其他几种波形可用。例如，图 46-3\
  \ 展示了将所有循环关键帧的 `waveShape` 属性更改为锯齿波的效果：\n\n![image-9C4J50GP.jpg](img/image-9C4J50GP.jpeg)\n\
  \n图 46-3\n\n除了 `sin` 和 `sawtooth`，`MotionLayout` 还支持 `triangle`、`square`、`bounce`\
  \ 和 `reverse sawtooth` 波形。\n\n在上面的示例中，每个循环都沿 Y 轴在相同范围内移动按钮。然而，假设我们需要第二个循环沿正 Y 轴移动按钮的距离更远。这涉及按如下所示调整第二个循环的\
  \ `waveOffset` 属性：\n\n```\nmotion:framePosition=\"25\"\nmotion:target=\"@+id/button\"\
  \nmotion:wavePeriod=\"1\"\nmotion:waveOffset=\"100dp\"\nmotion:waveShape=\"sin\"\
  \nandroid:translationY=\"50dp\"/>\n```\n\n通过此更改，我们得到了一个类似于图 46-4 的时间轴：\n\n![image-CZ93KNP3.jpg](img/image-CZ93KNP3.jpeg)\n\
  \n图 46-4\n\n按钮在第二个循环中沿 Y 轴的移动范围是 0 到 150dp，这取决于 `translationY` 的值：\n\n```\nmotion:framePosition=\"\
  25\"\nmotion:target=\"@+id/button\"\nmotion:wavePeriod=\"1\"\nmotion:waveOffset=\"\
  100dp\"\nmotion:waveShape=\"sin\"\n```\n\n图 46-5\n\n## 46.2 使用 Cycle Editor\n\n\
  虽然实现并不复杂，但通过直接编辑 `Scene` 文件来获取所需的循环配置可能需要一些时间。为了此，Android 工程师开发了 `Cycle Editor`。在\
  \ `MotionLayout` 中处理循环关键帧时非常有用。\n\n`Cycle Editor` 工具是一个 Java 归档文件（jar），需要安装 Java\
  \ 运行时。它尚未成为 Android Studio 的一部分。`Cycle Editor` 允许你可视化地设计和测试关键帧集。你可以从以下 URL 下载 `CycleEditor.jar`\
  \ 文件：\n\n`https://github.com/googlesamples/ConstraintLayoutExamples/releases/1.0/CycleEditor.jar`\n\
  \n下载后，打开命令行提示符或终端窗口，进入 jar 文件所在目录，并运行以下命令：\n\n`java -jar CycleEditor.jar`\n\n一旦工具加载，将出现图\
  \ 46-6 所示的屏幕：\n\n![image-TWMS5QA.jpg](img/TWMS5QA.jpeg)\n\n图 46-6\n\n标记 A 的面板显示关键帧集的\
  \ XML，可以直接编辑或使用 B 面板中的控件。面板 C 以波形显示渲染。遗憾的是，在更改时不会实时重绘。相反，必须通过选择 `File -> parse xml`\
  \ 来刷新。点击 B 面板中的播放按钮时，标记 D 的面板将显示循环的实时渲染。`Examples` 菜单提供了示例关键帧集，这些集合既可以用于学习，也可以作为你自己动画的基础。\n\
  \n## 46.3 创建 KeyCycleDemo 项目\n\n本章剩余部分将创建一个基于 `KeyCycle` 的示例项目，以演示循环关键帧和 `Cycle\
  \ Editor` 的用法。\n\n在欢迎屏幕上选择 `New Project`，并在随出的新项目对话框中选择 `Empty Views Activity` 模板，然后点击\
  \ `Next` 按钮。\n\n在 `Name` 字段中输入 `KeyCycleDemo`，并在 `package name` 中指定 `com.ebookfrenzy.keycycledemo`。在点击\
  \ `Finish` 按钮之前，将 `Minimum API` 级别设置为 `API 26: Android 8.0 (Oreo)`并将 `Language`\
  \ 菜单改为 `Java`。\n\n当布局编辑器处于 Design 模式并打开 `activity_main.xml` 文件时，右键点击 `ConstraintLayout`\
  \ 并选择 `Convert to MotionLayout` 选项：\n\n![image-KLT5DURM.jpg](img/KLT5DURM.jpeg)\n\
  \n图 46-7\n\n\n\n完成选择后，点击确认对话框中的 `Convert` 。\n\n## 46.4 配置起始和结束约束\n\n本教程旨在演示按钮从设备屏幕一侧移动到另一侧的动画，包括导致视图也沿\
  \ `Y-axis` 上下移动的 `KeyCycle` 效果。第一步是配置起始和结束约束。\n\n将 `activity_main.xml` 文件加载到 `MotionLayout`\
  \ 编辑器中，选择并删除默认的 `TextView` 小部件。在从调色板拖放 `Button` 视图之前，确保已选中 `Motion Layout` 框（见图\
  \ 46-9 中标记为 `E`），以便该视图在垂直方向上居中并位于布局画布的左边缘：\n\n![image-KJIPN5WE.jpg](img/image-KJIPN5WE.jpeg)\n\
  \n图 46-8\n\n要配置起始点的约束，请在编辑器窗口中选择起始约束集项（见图 46-9 中标记为 `A`）：\n\n![image-8HSMQ6AW.jpg](img/image-8HSMQ6AW.jpeg)\n\
  \n图 46-9\n\n接下来，选择 `ConstraintSet` 列表中的按钮项（`B`）。在按钮仍被选中的情况下，点击编辑按钮（`C`）并从菜单中选择 `Create\
  \ Constraint`。\n\n在仍被选中的情况下，使用 `Attributes` 工具窗口按照如下所示设置视图顶部、左侧和底部的约束：\n\n![image-TUE5B71F.jpg](img/image-TUE5B71F.jpeg)\n\
  \n图 46-10\n\n选择结束约束集项（见上方图 46-9 中标记为 `D`），并重复步骤创建新约束，这次对按钮的顶部、底部和右边缘设置约束：\n\n![image-TOH537QD.jpg](img/image-TOH537QD.jpeg)\n\
  \n图 46-11\n\n## 46.5 创建循环\n\n下一步是使用 `Cycle Editor` 生成动画的循环关键帧。在 `Cycle Editor` 运行时，请参考下图\
  \ 46-12 所示的控制面板：\n\n![image-5155DCJY.jpg](img/image-5155DCJY.jpeg)\n\n图 46-12\n\n\
  使用标记为 `A` 的菜单，将要修改的属性从 `rotation` 改为 `translationY`。\n\n接下来，使用 `KeyCycle` 控制（`B`）选择\
  \ `cycle 0`，以便面板中其他处的更改将应用于第一个循环。将 `Period` 滑块移动到 `1`，并将 `translationY` 滑块移动到 `60`，如图\
  \ 46-13 所示（在移动滑块时，参考 `XML` 面板查看 `translationY` 值的精确设置）：\n\n![image-0Y8A02P3.jpg](img/image-0Y8A02P3.jpeg)\n\
  \n图 46-13\n\n选择 `File -> Parse XML` 菜单选项查看图表的变化。使用表 46-1 中列出的值配置 `KeyFrames` 1 到\
  \ 4 的设置（记住你已经配置了 `KeyCycle 0` 列中的设置）：\n\n|  | ^(KeyCycle 0) | ^(KeyCycle 1) | ^(KeyCycle\
  \ 2) | ^(KeyCycle 3) | ^(KeyCycle 4) |\n| :--- | :--- | :--- | :--- | :--- | :---\
  \ |\n| ^(Position) | ⁰ | ²⁵ | ⁵⁰ | ⁷⁵ | ¹⁰⁰ |\n| ^(Period) | ¹ | ² | ³ | ² | ¹ |\n\
  | ^(translationY) | ⁶⁰ | ⁶⁰ | ¹⁵⁰ | ⁶⁰ | ⁶⁰ |\n\n表 46-1\n\n完成这些更改后，关键帧集的 `XML` 读取内容如下：\n\
  \n```xml\nmotion:framePosition=\"0\"\nmotion:motionTarget=\"@+id/button\"\nmotion:wavePeriod=\"\
  1\"\nmotion:waveOffset=\"0dp\"\nmotion:waveShape=\"sin\"\nandroid:translationY=\"\
  60dp\"/>\n\nmotion:framePosition=\"25\"\nmotion:motionTarget=\"@+id/button\"\nmotion:wavePeriod=\"\
