  \n图 73-12\n\n点击“转到设备目录”（Go to device catalog）链接将显示 APK 文件支持的设备：\n\n![image-GYMWNLAG.jpg](img/image-GYMWNLAG.jpeg)\n\
  \n图 73-13\n\n目前，应用已准备好进行测试，但只有在控制台中设置了某些测试人员后才能进行发布。\n\n## 73.11 管理测试人员\n\n如果应用仍处于内部、Alpha\
