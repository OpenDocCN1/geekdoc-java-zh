  @+id/itemImage\"\napp:layout_constraintTop_toBottomOf=\"@+id/itemTitle\"\ntools:text=\"\
  @sample/items\" />\n```\n\n重建应用并返回到 `content_main.xml` 文件中的布局设计，此时自定义示例数据和图像应该显示在\
