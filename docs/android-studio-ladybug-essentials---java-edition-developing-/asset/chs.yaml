  在 `MainActivity.java` 的重写方法中添加代码的是将日志信息输出到 `Logcat` 工具窗口，该窗口通过图 15-4 所示的按钮显示：\n\n\
  ![image-LR8I7L64.jpg](img/image-LR8I7L64.jpeg)\n图 15-4\n\n`Logcat` 工具窗口可以配置为显示与设备或模拟器会话的所有事件，或限制为与当前选择的应用程序相关的事件。输出也可以限制为仅匹配特定过滤器的日志事件。\n\
  \n当在当前应用运行时显示时，`Logcat` 工具窗口将如图 15-5 所示：\n\n![image-SDF7PAYZ.jpg](img/image-SDF7PAYZ.jpeg)\n\
  图 15-5\n\n标记为 A 的菜单允许您选择显示输出的设备或模拟器。标记为 C 的面板显示输出。可以通过标记为 B 的字段中输入选项进行过滤。默认设置 `package:mine`\
  \ 将输出限制为当前应用（在本例中为.ebookfrenzy.statechange）。留空此字段将显示来自操作系统的日志。键也可以组合以进一步过滤。例如，我们可以通过在键前加减号\
  \ (-)来排除输出。除了 `StateChange` 标签外，我们可能还有另一个标签的诊断消息。为了过滤掉第二个标签的输出，我们可以输入以下键：`package:mine\
  \ tag:StateChange -tag:OtherTag`\n\n除了自定义标签值，还可以从 Android 内置标签范围内进行选择。当您在过滤器中输入时，`Logcat`\
  \ 将显示匹配的标签，如图 15-6 所示：\n\n![image-H95JBM7S.jpg](img/image-H95JBM7S.jpeg)\n图 15-6\n\
  \n或者，使用 `Ctrl-Space` 获取完整的过滤建议。\n\n`level` 密钥可以根据严重性控制显示的消息。要过滤掉错误消息以外的所有消息，可以使用以下密钥：`level:error`\n\
  \n除了 `error` 之外，`Logcat` 面板支持 `verbose`、`info`、`warn` 和 `assert` 级别设置。\n\n`Logcat`\
  \ 还支持多个日志面板，每个面板都有自己的过滤设置。要添加另一个面板，点击图 15-5 中标记为 D 的 `+` 按钮。使用相应的标签切换不同的面板，或通过右键点击当前显示的面板并选择\
  \ `Split-Right` 或 `Split-Down` 选项水平或垂直排列面板。要重命名面板，右键点击标签并选择 `Rename Tab` 选项。在继续之前，关闭除一个以外的所有\
  \ `Logcat` 面板并按如下配置：`package:mine tag:StateChange`\n\n## 15.5 运行应用程序为了获得最佳，应在物理\
  \ Android 设备或模拟器上运行应用程序。在设备配置并连接到开发计算机后，点击 Android Studio 工具栏上的运行按钮，如下图 15-7 所示：\n\
  \n![image-DW8O46WS.jpg](img/image-DW8O46WS.jpeg)\n图 15-7\n\n\n\n如果出现了“选择设备”对话框，请从中选择物理\
  \ Android 设备或手机模拟器（假设你尚未将其配置为默认目标）。在 Android Studio 构建应用程序并将其安装到设备上后，程序将会启动并在前台运行。\n\
  \n查看 Logcat 面板可以指示出目前为止已经触发了哪些方法：\n\n![image-049ONSNQ.jpg](img/image-049ONSNQ.jpeg)\n\
  \n图 15-8\n\n## 15.6 对 Activity 进行实验\n\n既然诊断功能已正常工作，现在是时候运行应用程序以理解 Activity 的生命周期状态变化了。首先，考虑\
  \ Logcat 面板中初始的日志事件序列：\n\n```\nonCreate\nonStart\nonResume\n```\n\n显然，初始状态更改与“理解\
  \ Android 应用程序和 Activity 生命周期”中所概述的完全一致。但请注意，此时并没有调用 `onRestoreInstanceState()`，因为\
  \ Android 运行时检测到在这种情况下没有需要恢复的状态。\n\n点击设备显示屏底部状态栏上的主页图标，并注意日志中报告的方法调用序列如下所示：\n\n\
  ```\nonPause\nonStop\nonSaveInstanceState\n```\n\n在这种情况下，运行时注意到 Activity 不再处于前台，对用户不可见，并已停止该\
  \ Activity，但它并没有给 Activity 提供保存动态状态的机会。取决于运行时最终销毁了 Activity 还是重启了它，Activity 将会通过调用\
  \ `onRestart()` 被通知其已重启，或者当用户返回 Activity 时将再次经历创建序列。\n\n正如“理解 Android 应用程序和 Activity\
  \ 生命周期”概述的，Activity 的销毁和重建可以通过对设备进行配置更改来触发，例如从竖屏旋转到横屏。要看到这一操作过程，请在 `StateChange`\
  \ 应用程序处于前台时旋转设备。使用模拟器时，可以使用模拟器工具栏上的旋转按钮模拟设备旋转。为了完成旋转，可能还需要点击旋转按钮。该按钮出现在设备或模拟器屏幕的底部，如图\
  \ 15-9 所示：\n\n![image-MZNW8BVQ.jpg](img/image-MZNW8BVQ.jpeg)\n\n图 15-9\n\n日志中生成的方法调用序列应如下：\n\
  \n```\nonPause\nonStop\nonSaveInstanceState\nonDestroy\nonCreate\nonStart\nonRestoreInstanceState\n\
  onResume\n```\n\n显然，运行时系统允许 Activity 在被销毁和重启之前保存了状态。\n\n## 15.7 总结\n\n俗语“一画胜千千言”在学习新编程范式的示例中也同样适用。在本章中，我们创建了一个\
  \ Android 示例应用程序，以演示 Activity 可能会经历的不同生命周期状态。在在本章开发项目期间，我们还查看了从 Activity 内部生成诊断日志信息的机制。\n\
  \n在下一章中，我们将扩展 `StateChange` 示例项目，演示如何保存和恢复 Activity 的动态状态。\n\n## 16. 保存和恢复 Android\
  \ Activity 的状态\n\n如果前面的几章已经实现了目标，那么现在对于在 Activity 生命周期内的特定点保存和恢复用户界面状态的重要性应该变得更加清晰了。\n\
  \n在本章中，我们将扩展在“通过示例 Android Activity 状态更改”中创建的示例应用程序，以演示运行时系统销毁和重建 Activity 时涉及保存和恢复状态的步骤。\n\
  \n保存和恢复动态状态的关键组件涉及使用 Android SDK 中的 `Bundle` 类，该主题在本章中也会涵盖。\n\n## 16.1 保存动态状态\n\n\
  正如我们所学到的，Activity 可以通过运行时调用 Activity 对 `onSaveInstanceState()` 方法的实现来保存动态状态信息。传递给方法的参数是一个\
  \ `Bundle` 对象的引用，该方法必须将任何需要保存的动态数据存储其中。随后，`Bundle` 对象由运行时代表 Activity 进行存储，并在后续调用\
  \ Activity 的 `onCreate()` 和 `onRestoreInstanceState()` 方法时作为参数传递给这些方法。然后可以在这些方法内部从\
  \ `Bundle` 对象中检索数据，并用于恢复 Activity 的状态。\n\n## 16.2 用户界面状态的默认保存\n\n在上一章中，`StateChange`\
  \ 示例应用程序的诊断输出显示，当运行它的设备旋转足够大以触发方向更改时，Activity 会经历几次状态变化。\n\n再次启动 `StateChange` 应用程序，并在执行设备旋转之前向\
  \ `EditText` 字段输入一些文本（在运行 Android 9 或更高版本的设备或模拟器上，可能需要点击状态栏中的旋转按钮来完成旋转）。旋转设备后，Logcat\
  \ 窗口中应出现的状态变化序列：\n\n```\nonPause\nonStop\nonSaveInstanceState\nonDestroy\nonCreate\n\
  onStart\nonRestoreInstanceState\nonResume\n```\n\n显然，这导致了 Activity 的销毁和重建。然而，查看运行中应用程序的用户界面应该显示输入到\
  \ `EditText` 字段中的文本已被保留。鉴于 Activity 已被销毁并重建，且我们没有添加任何特定代码来确保文本被保存和恢复，这种行为需要一些解释。\n\
  \n事实上，Android SDK 包含的大多数视图控件已经实现了当 Activity 自动重启时保存和恢复状态所需的行为。启用此种行为的唯一要求是 Activity\
  \ 中的重写方法 `onSaveInstanceState()` 和 `onRestoreInstanceState()` 必须包含对父类等效方法的调用：\n\n\
  ```java\n@Override\nprotected void onSaveInstanceState(@NonNull outState) {\n  \
  \  super.onSaveInstanceState(outState);\n}\n\n@Override\nprotected void onRestoreInstanceState(@NonNull\
  \ savedInstanceState) {\n    super.onRestoreInstanceState(savedInstanceState);\n\
  }\n```\n\n可以通过在 XML 布局文件中将 `saveEnabled` 属性设置为 false 来禁用用户界面视图的自动保存。在本示例中，我们将在用户界面布局中禁用\
  \ `EditText` 视图的自动保存机制，然后在应用程序中添加代码手动保存和恢复视图的状态。\n\n更改后，运行应用程序，输入文本并旋转设备，以验证文本不再被保存和恢复。\n\
  \n要配置 `EditText` 视图以使得……编辑 `activity_main.xml` 文件使该视图的条目如下（注意正如“在 Android Studio\
  \ 中创建示例 Android 应用”中所概述，可以通过将布局编辑器切换到代码视图来编辑 XML）：\n\n```xml\nandroid:id=\"@+id/editText\"\
  \nandroid:layout_width=\"wrap_content\"\nandroid:layout_height=\"wrap_content\"\n\
  android:ems=\"10\"\nandroid:inputType=\"text\"\nandroid:saveEnabled=\"false\"\n\
  app:layout_constraintBottom_toBottomOf=\"parent\"\napp:layout_constraintEnd_toEndOf=\"\
  parent\"\napp:layout_constraintStart_toStartOf=\"parent\"\napp:layout_constraintTop_toTopOf=\"\
  parent\" />\n```\n\n\n\n\n对于需要在用户界面视图组件提供的默认功能之外保存状态的情况，`Bundle` 类提供了一个使用键值对机制来存储数据的容器。键的形式为字符串值，而与这些键关联的值可以是原始值，也可以是实现了\
  \ Android `Parcelable` 接口的任何对象。许多类已经实现了 `Parcelable` 接口。通过实现 `Parcelable` 接口中定义的\
  \ set 方法，可以将自定义类转变为“可序列化的（parcelable）”，具体细节可以在 Android 文档中找到：https://developer.android.com/reference/android/os/Parcelable.html\n\
  \n`Bundle` 类还包含一组方法，可用于获取和设置各种数据类型的键值对，包括原始类型（包括 `Boolean`、`char`、`double` 和 `float`\
  \ 值）和对象（如 `Strings` 和 `CharSequenceences`）。\n\n在本例中，由于已经禁用了 `EditText` 视图的文本自动保存功能，我们需要确保用户输入\
  \ `EditText` 字段的文本被保存到 `Bundle` 对象中并在随后恢复。这将展示如何在 Android 应用程序中手动保存保存和恢复状态，并将分别使用\
  \ `Bundle` 类的 `putCharSequence()` 和 `getCharSequence()` 方法实现。\n\n## 16.4 保存状态\n\n\
  扩展 StateChange 应用程序的第一步是确保用户输入的文本在 `MainActivity` 类的 `onSaveInstanceState()` 方法中从\
  \ `EditText` 组件中提取出来，然后以键值对的形式保存到 `Bundle` 对象中。\n\n要从 `EditText` 对象中提取文本，我们必须首先在用户界面中标识该对象。显然，这涉及在\
  \ Activity 的 Java 代码（包含在 `MainActivity.java` 源代码文件中）与用户界面的 XML 表示（包含在 `activity_main.xml`\
  \ 资源文件中）之间建立桥梁。为了提取输入 `EditText` 组件的文本，我们需要获取该用户界面对象的访问权限。\n\n用户界面中的每个组件都关联有一个唯一的标识符。默认情况下，布局编辑器（Layout\
  \ Editor）工具根据对象类型为新添加的组件构建 `id`。如果布局中包含多个相同类型的视图，则在类型名称后面会跟上一个顺序数字（尽管开发者也可以也应该将其更改更具意义的内容）。通过在\
  \ Android Studio 主窗口中选择 `activity_main.xml` 文件并显示布局编辑器工具时，检查组件树（Component Tree）面板可以看到，`EditText`\
  \ 组件已被分配了 `id` editText：\n\n![image-BBAGX0S7.jpg](img/image-BBAGX0S7.jpeg)\n\n图\
  \ 16-1\n\n我们现在可以通过对象的 `getText()` 方法获取 `editText` 视图包含的文本，该方法反过来返回当前文本：\n\n```\n\
  CharSequence userText = binding.editText.getText();\n```\n\n最后，我们可以使用 `Bundle` 对象的\
  \ `putCharSequence()` 方法保存文本，将键（这可以是任何字符串值，在本例中，我们将它声明为“savedText”）和 `userText`\
  \ 对象作为参数传递：\n\n```\noutState.putCharSequence(\"savedText\", userText);\n```\n\n\
  将这一切整合在一起，我们在 `MainActivity.java` 文件中得到了一个修改后的 `onSaveInstanceState()` 方法，内容如下：\n\
  \n```\npackage com.ebookfrenzy.statechange;\n\n.\n.\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n\n.\n.\n.\n\nprotected void onSaveInstanceState(@NonNull\
  \ Bundle outState) {\n    super.onSaveInstanceState(outState);\n    Log.i(TAG, \"\
  onSaveInstanceState\");\n    CharSequence userText = binding.editText.getText();\n\
  \    outState.putCharSequence(\"savedText\", userText);\n}\n\n.\n.\n.\n```\n\n现在已经采取了保存状态的步骤，下一阶段是在需要时恢复它。\n\
  \n## 16.5 恢复状态\n\n保存的动态状态可以在那些将 `Bundle` 对象作为参数传递的周期方法方法恢复。这让开发者可以选择 `onCreate()`\
  \ 或 `onRestoreInstanceState()`。使用哪种方法取决于 Activity 的性质。在 Activity 初始化任务完成后最适合恢复状态的情况下，通常\
  \ `onRestoreInstanceState()` 方法更合适。在本例中，我们将向 `onRestoreInstanceState()` 方法中添加代码，使用“savedText”键从\
  \ `Bundle` 中提取保存的状态。然后，我们可以使用对象的 `setText()` 方法在 `editText` 组件上显示文本：\n\n```\n@Override\n\
  protected void onRestoreInstanceState(@NonNull Bundle savedInstanceState) {\n  \
  \  super.onRestoreInstanceState(savedInstanceState);\n    Log.i(TAG, \"onRestoreInstanceState\"\
  );\n    CharSequence userText = savedInstanceState.getCharSequence(\"savedText\"\
  );\n    binding.editText.setText(userText);\n}\n```\n\n## 16.6 测试应用程序\n\n剩下的工作只是再次构建并运行\
  \ StateChange 应用程序。一旦运行并处于前台，触摸 `EditText` 组件并在旋转设备到另一个方向之前输入一些文本。以前文本更改会丢失，但得益于我们在本章中为\
  \ Activity 添加的代码，新文本保留在 `editText` 组件中。\n\n在验证代码执行符合预期后，注释掉这两个方法中的 `super.onSaveInstanceState()`\
  \ 和 `super.onRestoreInstanceState()` 调用，重新启动应用并注意在设备旋转后文本仍然被保留。默认的保存和恢复系统已通过自定义实现所取代，从而提供了在\
  \ Activity 中动态和选择性保存状态的方法。\n\n## 16.7 总结\n\nAndroid 应用程序中状态的保存和恢复需要在适当的方法中实现。对于大多数用户界面，这由\
  \ Activity 基类处理。在其他情况下，这通常包括在 `onSaveInstanceState()` 方法中提取值并以键值对的形式保存到传递给 Activity\
  \ 的 `Bundle` 对象中。可以通过 `onCreate()` 或 `onRestoreInstanceState()` 方法从 `Bundle` 对象中提取值来恢复状态。\n\
  \n在本章中，我们使用这些技术更新了 StateChange 项目，使 Activity 能够在销毁和随后的重建后保留更改。\n\n## 17. 理解 Android\
  \ 用户界面结构\n\n除了听流媒体外，用户与 Android 设备的交互主要是视觉和触觉的。所有这些交互都发生在安装在设备上的应用程序界面中，包括内置应用程序和用户安装的任何第三方应用程序。因此，开发\
  \ Android 应用的关键要素涉及设计和创建用户界面这并不意外。\n\n本章涵盖了 Android 用户界面结构，包括组成用户界面的元素概述：视图（Views）、视图组（View\
  \ Groups）和布局（Layouts）。\n\n## 17.1 为不同的 Android 设备设计\n\n“Android 设备”涵盖了许多具有不同屏幕尺寸和分辨率的平板电脑和平手机。因此，应用程序用户界面现在必须仔细设计，以确保在尽可能广泛的尺寸上正确显示。其中的关键部分是确保用户界面布局在不同设备上运行时能够正确调整大小。这在很大程度上可以通过仔细规划和使用本章概述的布局管理器来实现。\n\
  \n\n\n\n\n同样重要的是，大多数基于 Android 的智能手机和平电脑都可以由用户以竖屏或横屏模式持有。良好的用户界面应该能够适应这些变化，并进行合理的布局调整，以利用每个方向下的可用屏幕空间。\n\
  \n## 17.2 视图（Views）与视图组（View Groups）\n\n用户界面中的每个项目都是 Android `View` 子类（准确来说是 `android.view.View`）。Android\
  \ SDK 提供了一组预定义的视图，用于构建用户界面。典型示例包括标准项，如 `Button`、`CheckBox`、`ProgressBar` 和 `TextView`\
  \ 类。这些视图也被称为控件（widgets）或组件（components）。对于 SDK 提供的控件无法满足的需求，可以通过子类和扩展现有类来创建新视图，或者通过直接在\
  \ `View` 类之上构建创建一个全新的组件。\n\n视图还可以包含多个其他视图（也称为复合视图，composite view）。此类视图派自 Android\
  \ `ViewGroup` 类（`android.view.ViewGroup`），而 `ViewGroup` 本身又是 `View` 的子类。这种视图的一个示例是\
  \ `RadioGroup`，它旨在包含多个 `RadioButton` 对象，使得在任何时刻只有一个对象处于“开启”状态。在结构方面，复合视图由单个父视图（派生自\
  \ `ViewGroup` 类，其他称为容器视图或根元素）组成，该父视图能够包含其他视图（称为子视图）。\n\n另一类基于 `ViewGroup` 的容器视图是布局管理器（layout\
  \ manager）。\n\n## 17.3 Android 布局管理器\n\n除了上一节讨论的控件式视图外，SDK 还包含一组被称为布局（layouts）的视图。布局是容器视图（因此派自\
  \ `ViewGroup`），设计用于控制子视图在屏幕上的对齐方式。\n\nAndroid SDK 包含了以下布局视图，它们可以用于 Android 用户界面的设计中：\n\
  \n- `ConstraintLayout` – 在 Android 7 中引入，该布局管理器被推荐用于大多数布局需求。`ConstraintLayout` 允许通过分配给每个子视图的简单约束设置，定义布局中视图的位置和行为。这种布局的灵活性允许快速、方便地创建复杂布局，而无需在内部嵌套其他布局类型，从而提升了布局性能。`ConstraintLayout`\
  \ 也紧密集成到 Android Studio 布局编辑器工具中。除非另有说明，它是书中大多数示例的首选布局。\n- `LinearLayout` – 根据所选的方向将子视图放置在单行或单列中。可以在每个子视图上设置权重（weight）值，以指定该视图相对于其他子视图占据布局空间的比例。\n\
  - `TableLayout` – 将子视图以行列的网格格式排列。表格中的每一行由一个 `TableRow` 对象子表示，而该对象又包含每个单元格的视图对象。\n\
  - `FrameLayout` – `FrameLayout` 的作用是分配屏幕区域，通常用于显示单个视图。如果添加了多个子视图，它们默认将相互堆叠，并定位在布局区域的左上角。通过为每个子视图设置重力（gravity）值，可以实现单个子视图的定位。例如，在子视图上设置\
  \ `center_vertical` 重力值将使其位于包含容器 `FrameLayout` 视图的垂直中心。\n- `RelativeLayout` – `RelativeLayout`\
  \ 允许通过指定子视图的对齐和边距，将子视图相对于彼此以及容器布局视图进行定位。例如，子视图 A 可以被配置为位于容器 `RelativeLayout` 视图的水平垂直中心。而视图\
  \ B 可能也可以被配置为在布局中水平居中，但位于视图 A 顶部边缘上方 30 像素处，从而产生相对于视图 A 的垂直位置。在设计必须在各种屏幕尺寸和方向上运行的用户界面时，`RelativeLayout`\
  \ 管理器非常有帮助。\n- `AbsoluteLayout` – 允许将子视图位于容器布局视图内特定的 `X` 和 `Y` 坐标上。不建议使用这种布局，因为它缺乏响应屏幕尺寸和方向变化的灵活性。\n\
  - `GridLayout` – `GridLayout` 实例由不可见的线划分，形成一个包含行和列单元格的网格。子视图被放置在单元格中，并可以配置为水平和垂直跨越多个单元格，允许快速方便地实现广泛的布局选项。`GridLayout`\
  \ 中组件之间的间隙可以通过在相邻单元格中放置一种称为 `Space` 的特殊类型视图或设置边距参数来实现。\n- `CoordinatorLayout` –\
  \ 作为 Android Design Support Library 随 Android 5.0 引入`CoordinatorLayout` 专门用于协调应用程序屏幕顶部标题栏（app\
  \ bar）与其他视图元素的显示效果和行为。当使用 Basic Views Activity 模板创建新活动时，主布局中的父视图将使用 `CoordinatorLayout`\
  \ 实例实现。该布局管理器将在“使用悬操作按钮和 Snackbar”章节中进行更详细的介绍。\n\n在考虑 Android 应用程序的用户界面布局时，值得记住，正如下一节所述，这些布局可以相互嵌套，以创建几乎任何所需复杂程度的用户界面设计。\n\
  \n## 17.4 视图层次结构（View Hierarchy）\n\n用户界面中的每个视图都代表显示器上的矩形区域。视图负责在该矩形内绘制内容，并响应屏幕该部分的事件（例如触摸事件）。\n\
  \n用户界面屏幕由一个视图层次结构组成，根视图位于树的顶部，子视图位于下方的分支上。容器视图的子视图显示在其父视图之上，并限制在父视图显示区域的边界内。例如，考虑图\
  \ 17-1 所示的用户界面：\n\n\n\n\n\n随着对视图（views）、布局（layouts）和视图层次结构（view hierarchy）概念的进一步理解，接下来的几章将重点介绍为\
  \ Android Activity 创建用户界面的步骤。事实上，用户界面设计有不同的方法：使用 Android Studio 布局编辑器工具、手动编写 XML\
  \ 布局资源文件或编写 Java 代码，这三种方法都将涵盖涵盖。\n\n## 17.6 总结\n\nAndroid 应用用户界面屏幕中的每个元素都是 `view`，它们最终派自\
  \ `android.view.View` 类。每个视图代表设备显示器上的矩形区域，负责显示该矩形区域内的内容并处理发生在视图边界范围内的事件。多个视图可以组合成单个的复合视图（composite\
  \ view）。复合视图中的视图是容器视图的子视图，容器视图通常是 `android.view.ViewGroup` 的子类（`ViewGroup` 又是 `android.view.View`\
  \ 的子类）。用户界面是由视图层次结构形式构建的视图组成的。\n\nAndroid SDK 包含了一系列预构建视图，可用于创建用户界面。这些包括文本字段和按钮等基本组件，以及一系列可用于控制子视图定位的布局管理器。如果提供的视图不能满足特定需求，可以通过扩展或组合现有视图来创建自定义视图，或者通过派生\
  \ `android.view.View` 并创建一个全新的视图类来创建。\n\n用户界面可以使用 Android Studio 布局编辑器工具、手动编写 XML\
  \ 布局资源文件或编写 Java 代码来创建。这些方法中的每一种将在后续章节中介绍。\n\n## 18. Android Studio 布局编辑器工具指南\n\n\
  要想出一个不需要某种形式用户界面的 Android 应用概念是挑战性的。大多数 Android 设备都配备了触摸屏和键盘（虚拟或物理键盘），点击和滑动是用户与应用程序之间主要的交互方式。这些交互不可避免地通过应用程序的用户界面进行。\n\
  \n设计良好且实现的用户界面是创建一个成功且流行的 Android 应用的关键因素，根据单个应用程序的设计需求，其复杂度从简单到非常复杂不等。无论复杂程度如何，Android\
  \ Studio 布局编辑器工具都显著简化了设计和实现 Android 用户界面的任务。\n\n## 18.1 基础视图 Activity 与 空视图 Activity\
  \ 模板\n\n正如名为“Android 应用剖析”的章节中所概述的那样，Android 应用包含一个或多个 Activity。Activity 是应用程序功能的独立模块，通常直接对应于单个用户界面屏幕。因此，在使用\
  \ Android Studio 布局编辑器时，我们始终在为 Activity 编写布局。\n\n在创建新的 Android Studio 项目时，有多个模板可以作为主\
  \ Activity 用户界面的起点。最基础的模板是 `Basic Views Activity` 模板和 `Empty Views Activity` 模板。尽管它们乍看起来相似，但这两个选项之间存在显著差异。要在布局编辑器中查看这些差异，请使用视图选项（View\
  \ Options）菜单启用显示系统 UI（Show System UI），如下图 18-1 所示：\n\n![image-1CELKKI5.jpg](img/image-1CELKKI5.jpeg)\n\
  图 18-1\n\n`Empty Views Activity` 模板创建一个单一布局文件，该文件由包含一个 `TextView` 对象的 `ConstraintLayout`\
  \ 管理器实例组成，如图 18-2 所示：\n\n![image-W29IKLZC.jpg](img/image-W29IKLZC.jpeg)\n图 18-2\n\
  \n另一方面，`Basic Views Activity` 包含多个布局文件。顶层布局文件具有 `CoordinatorLayout` 作为根视图，一个可配置的标题栏（包含一个\
  \ `toolbar`）显示在设备屏幕顶部（图 18-3 中的标记 A 所示），以及一个浮动操作按钮（标记 B 的电子邮件按钮）。除了这些项目，`activity_main.xml`\
  \ 布局文件还包含名为 `content_main.xml` 的第二个文件的引用，该文件包含内容布局（标记 C）：\n\n![image-WQ432AD8.jpg](img/image-WQ432AD8.jpeg)\n\
  图 18-3\n\n`Basic Views Activity` 包含两个屏幕的布局，包含一个按钮和一个文本视图。此模板旨在演示如何在应用中的多个屏幕之间实现导航。如果运行使用\
  \ `Basic Views Activity` 模板的未修改应用，将出现这两个屏幕中的第一个（如图 18-4 中的标记 A 所示）。点击 Next（下一步）按钮将导航到第二个屏幕\
  \ (B)，该屏幕又包含一个返回第一个屏幕的按钮：\n\n![image-HRR3YZ15.jpg](img/image-HRR3YZ15.jpeg)\n图 18-4\n\
  \n此应用行为使用了称为片段（fragments）和导航（navigation）的 Android 功能，将分别从名为“Android Fragment 简介”和“导航架构组件概览”的章节开始介绍。\n\
  \n`content_main.xml` 文件包含一个特殊的片段，称为“导航主机片段”（Navigation Host Fragment），它允许根据 `res\
  \ -> layout -> nav_graph.xml` 文件中的设置在视图中切换不同的内容。在 `Basic Views Activity` 模板的情况下，`nav_graph.xml`\
  \ 文件配置为根据用户选择 Next 和 Previous 按钮，在 `fragment_first.xml` 和 `fragment_second.xml`\
  \ 文件中定义的用户界面布局之间进行切换。\n\n如果你在 Activity 中既不需要浮动操作按钮也不需要菜单，不需要 `CoordinatorLayout`\
  \ 提供的特殊标题栏行为（例如在某些滚动操作期间使标题栏和工具栏折，该主题将在“使用标题栏和折叠工具栏”章节介绍），那么 `Empty Views Activity`\
  \ 模板非常有帮助。然而，`Basic Views Activity` 因为默认提供了这些元素非常有帮助。事实上，使用 `Basic Views Activity`\
  \ 模板创建一个新 Activity 并删除不需要的元素，比使用 `Empty Views Activity` 模板并手动实现行为要快得多。\n\n由于书中并非所有示例都需要\
  \ `Basic Views Activity` 模板的功能，因此本章的大多数示例将使用 `Empty Views Activity` 模板，除非示例需要 `Basic\
  \ Views Activity` 模板提供的一个或其他功能。\n\n为了以后参考，如果你需要菜单但不需要浮动操作按钮，请使用 `Basic Activity`\
  \ 并按照以下步骤删除浮动操作按钮：\n\n1. 在项目窗口的 `app -> res -> layout` 下双击 `activity_main.xml` 布局文件，将其加载到布局编辑器。将布局加载到布局编辑器后，选择浮动操作按钮并按键盘\
  \ Delete 键从布局中删除对象。\n\n2. 找到并编辑 Activity 的 Java 代码（位于 `app -> java ->`），如下所示从 `onCreate`\
  \ 方法中删除浮动操作按钮代码：\n\n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState)\
