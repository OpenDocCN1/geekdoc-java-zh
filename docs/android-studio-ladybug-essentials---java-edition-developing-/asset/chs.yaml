  \n图 73-13\n\n## 73.13 上传新 App Bundle\n\n如果应用仍处于内部、Alpha 或 Beta 测试阶段，可以通过在 Google\
  \ Play 控制台中选择应用、点击导航面板中的“内部测试”并如图 73-14 所示选择“测试人员”选项卡来指定授权测试人员列表：\n\n![image-MHIWZOP0.jpg](img/image-MHIWZOP0.jpeg)\n\
