  图 33-6\n\n从列表中选择 `ToolbarFragment` 条目并点击 OK 关闭 Fragments 对话框。一旦添加，点击布局编辑器右上角的红色警告按钮显示\
  \ `Problems` 工具窗口。“unknown fragments”消息将指示布局编辑器需要知道在预览会话期间显示哪个 fragment。选择 `Unknown`\
