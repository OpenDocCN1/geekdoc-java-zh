  \n![image-QYR6CGK1.jpg](img/image-QYR6CGK1.jpeg)\n\n图 85-5\n\n点击`Create`（创建）按钮，稍等片刻您将返回仪表板，那里将列出您的新项目。\n\
  \n## 85.5 启用 Google Maps SDK\n\n现在我们已经创建了新的 Google Cloud 项目，下一步是允许项目使用 Google Maps\
  \ SDK。要启用 Google Maps 支持，请在 Google Cloud 控制台中选择您的项目，点击左上角的菜单按钮，并选择`Google Maps Platform`\
  \ 项。然后，从生成的菜单中如图 85-6 所示选择`APIs` 选项：\n\n![image-4NVWWFEC.jpg](img/image-4NVWWFEC.jpeg)\n\
  \n图 85-6\n\n在 API 页面上，选择`Maps SDK for Android` 项目，并在生成的屏幕上点击`Enable`（启用）按钮：\n\n\
  ![image-NGY67L5.jpg](img/image-NGY67L5.jpeg)\n\n图 85-7\n\n重复上述步骤启用 Geocoding API，这稍后需要我们的应用程序显示用户的当前位置。\n\
  \n## 85.6 生成 Google API 密钥\n\n在应用程序可以使用 Google Maps SDK 之前，必须配置 API 密钥以关联 Google\
  \ Cloud 项目。要生成 API 密钥，选择`Credentials` 项（如图 85-8 中的 A），然后点击`Create Credentials` 按钮（B）：\n\
  \n![image-1WLECS.jpg](img/image-1WLECS.jpeg)\n\n图 85-8\n\n凭据创建后，将显示 API 密钥的对话框：\n\
  \n![image-PD8R2SR.jpg](img/image-PD8R2SR.jpeg)\n\n图 85-9\n\n## 85.7 将 API 密钥添加到\
  \ Android\n\n现在我们已经生成了允许应用程序使用 Google Maps SDK 的 API 密钥，我们需要将其添加到项目中。返回 Android，编辑\
  \ `manifests` -> `AndroidManifest.xml` 文件，并找到以下密钥项：\n\n```xml\nandroid:name=\"com.google.android.geo.API_KEY\"\
  \ android:value=\"YOUR_KEY\"\n```\n\n删除文本 `YOUR_KEY` 并将其替换为在 Google Play Console\
  \ 创建的密钥。\n\n接下来，编辑 `Gradle Scripts` -> `local.properties` 文件并添加如下新行（用项目的 API 密钥替换\
  \ `YOUR_KEY`）：\n\n```MAPS_API_KEY=YOUR_KEY\n```\n\n## 85.8 测试应用程序\n\n运行应用程序示例以验证配置是否正确。如果配置正确，应用程序将运行并在屏幕上显示地图。\n\
  \n如果没有显示地图，请检查以下区域：\n\n- 如果应用程序在模拟器上运行，请确保模拟器运行的是包含 Google APIs 的 Android 版本。可以通过选择\
  \ `Tools` -> `Android` -> `AVD Manager` 菜单选项更改 AVD 配置的操作系统，点击 Actions 列中的铅笔图标，然后点击当前\
  \ Android 版本旁`Change…` 按钮。在系统映像对话框中选择包含 Google APIs 的目标。\n- 检查 `Logcat` 输出是否有与 Google\
  \ Maps API 身份验证问题相关的区域。这通常意味着 API 密钥输入错误。确保 `AndroidManifest.xml` 和 `local.properties`\
  \ 文件中的 API 密钥相匹配。\n\n\n\n\n\n在谈论地图和地理位置之前，如果不介绍地理编码（Geocoding）主题是不可能可能的。地理编码是将基于文本的地理位置（如街道地址）转换为以经纬度表示地理坐标。\n\
  \n可以使用 Android 的 `Geocoder` 类来实现地理编码。例如，可以向 `Geocoder` 类的实例传递一个代表位置的字符串，例如城市名称、街道地址或机场代码。`Geocoder`\
  \ 将尝试查找该位置的匹配项，并返回一个可能与该位置字符串匹配的 `Address` 对象列表，这些对象按匹配程度排序，最匹配的位于列表的第 0 位。随后，可以从\
  \ `Address` 对象中提取各种信息，包括潜在匹配项的经纬度。\n\n例如，以下代码请求位于华盛顿特区的国家航空航天博物馆的位置：\n\n```java\n\
  import java.io.IOException;\nimport java.util.List;\nimport android.location.Address;\n\
  import android.location.Geocoder;\n\n.\n.\n\ndouble latitude;\ndouble longitude;\n\
  List<Address> geocodeMatches = null;\n\ntry {\n    geocodeMatches = new Geocoder(this).getFromLocationName(\n\
  \        \"600 Independence Ave SW, Washington, DC 20560\", 1);\n} catch (IOException\
  \ e) {\n    // TODO Auto-generated catch block\n    e.printStackTrace();\n}\n\n\
  if (!geocodeMatches.isEmpty()) {\n    latitude = geocodeMatches.get(0).getLatitude();\n\
  \    longitude = geocodeMatches.get(0).getLongitude();\n}\n```\n\n注意，值 `1` 被作为第二个参数传递给\
  \ `getFromLocationName()` 方法。这告诉 `Geocoder` 在数组中只返回一个结果。由于所提供的地址具有特定性，应该只有一个潜在的匹配项。然而，对于更模糊的位置名称，可能需要请求更多的潜在匹配项并允许用户选择正确的那个。\n\
  \n上面的代码是正向编码的示例，即坐标是基于文本位置描述计算的。反向编码（Reverse-geocoding）顾顾义是将地理坐标转换为人类可读的地址字符串。例如，考虑以下代码：\n\
  \n```java\nimport java.io.IOException;\nimport java.util.List;\nimport android.location.Address;\n\
  import android.location.Geocoder;\n\n.\n.\n\nList<Address> geocodeMatches = null;\n\
  String Address1;\nString Address2;\nString State;\nString Zipcode;\nString Country;\n\
  \ntry {\n    geocodeMatches = new Geocoder(this).getFromLocation(38.8874245, -77.0200729,\
  \ 1);\n} catch (IOException e) {\n    // TODO Auto-generated catch block\n    e.printStackTrace();\n\
  }\n\nif (!geocodeMatches.isEmpty()) {\n    Address1 = geocodeMatches.get(0).getAddressLine(0);\n\
  \    Address2 = geocodeMatches.get(0).getAddressLine(1);\n    State = geocodeMatches.get(0).getAdminArea();\n\
  \    Zipcode = geocodeMatches.get(0).getPostalCode();\n    Country = geocodeMatches.get(0).getCountryName();\n\
  }\n```\n\n通过 `getFromLocation()` 方法使用经度和纬度值初始化 `Geocoder` 对象。再次，只请求了单个匹配结果。然后从生成的\
  \ `Address` 对象中提取基于文本的地址信息。\n\n地理编码并不是在 Android 设备上执行的，而是在需要翻译时设备连接的服务器上执行的，翻译完成后返回结果。只有当设备具有活跃的互联网连接时才能进行地理编码。\n\
  \n## 85.10 为应用程序添加地图\n\n向应用程序添加地图最简单的方法是在 activity 的用户界面布局 XML 文件中指定它。以下示例布局文件显示为\
  \ Android Studio 创建的 `activity_maps.xml` 文件添加了 `SupportMapFragment` 实例：\n\n```xml\n\
  xmlns:tools=\"http://schemas.android.com/tools\"\n    android:layout_width=\"match_parent\"\
  \n    android:layout_height=\"match_parent\"\n    android:id=\"@+id/map\"\n    tools:context=\"\
  .MapsActivity\"\n    android:name=\"com.google.android.gms.maps.SupportMapFragment\"\
  />\n```\n\n## 85.11 请求当前位置权限\n\n正如“在 Android 中进行运行时权限请求”章节概述的那样，某些权限被认为是危险的，对于 Android\
  \ 6.0 或更高版本需要特殊处理。一组权限允许应用程序识别用户的当前位置。编辑位于项目工具窗口 `app -> manifests` 下的 `AndroidManifest.xml`\
  \ 文件，并添加以下权限行：\n\n```xml\nandroid:name=\"android.permission.ACCESS_FINE_LOCATION\"\
  \ />\nandroid:name=\"android.permission.ACCESS_COARSE_LOCATION\" />\n```\n\n这些设置将确保应用在安装在旧版本\
  \ Android 上时提供获取位置信息的权限。然而，为了支持 Android 6.0 或更高版本，我们需要在 `MapsActivity.java` 文件中添加一些代码在运行时请求此权限。\n\
  \n首先添加一些导入指令和一个作为权限请求代码的常量：\n\n```java\npackage com.ebookfrenzy.mapdemo;\n\n.\n\
  .\n\nimport androidx.annotation.NonNull;\nimport androidx.core.content.ContextCompat;\n\
  import androidx.core.app.ActivityCompat;\nimport android.Manifest;\nimport android.widget.Toast;\n\
  import android.content.pm.PackageManager;\n\n.\n.\n\npublic class MapsActivity extends\
  \ FragmentActivity implements OnReadyCallback {\n    private static final int LOCATION_REQUEST_CODE\
  \ = 101;\n    private GoogleMap mMap;\n\n.\n.\n}\n```\n\n接下来，必须在类中添加一个方法来请求此权限。在\
  \ `MapsActivity.java` 文件中实现该方法：\n\n```java\nprotected void requestPermission(String\
  \ permissionType, int requestCode) {\n    ActivityCompat.requestPermissions(this,\
  \ new String[]{permissionType}, requestCode);\n}\n```\n\n当用户响应权限请求后，`onRequestResult()`\
  \ 方法将被调用。在 `MapsActivity.java` 文件中实现该方法，如下如下：\n\n```java\n@Override\npublic void\
  \ onRequestResult(int requestCode, @NonNull String[] permissions, @NonNull int[]\
  \ grantResults) {\n    super.onRequestPermissionsResult(requestCode, permissions,\
  \ grantResults);\n    if (requestCode == LOCATION_REQUEST_CODE) {\n        if (grantResults.length\
  \ == 0 || grantResults[0] != PackageManager.PERMISSION_GRANTED) {\n            Toast.makeText(this,\
  \ \"Unable to show location - permission required\", Toast.LENGTH_LONG).show();\n\
  \        } else {\n            SupportMapFragment mapFragment = (SupportMapFragment)\
  \ getSupportFragmentManager().findFragmentById(R.id.map);\n            mapFragment.getMapAsync(this);\n\
  \        }\n    }\n}\n```\n\n如果用户没有授予权限，应用程序将显示一条消息。相反，地图将刷新以为显示标记提供机会。\n\n## 85.12\
  \ 显示用户的当前位置\n\n一旦获得了适当的权限，就可以通过获取与显示地图相关的 `GoogleMap` 对象并调用该实例的 `setMyLocationEnabled()`\
  \ 方法传递 `true` 值在地图上显示用户的当前位置。\n\n当地图准备就同时，activity 的 `onMapReady()` 方法将被调用。此方法在上述\
  \ `onRequestResult()` 方法中刷新地图时再次调用。默认情况下，Android Studio 实现了此方法并添加了一些代码，将地图面向澳大利亚并在悉尼放置标记。定位并编辑\
  \ `MapsActivity.java` 文件中的 `onMapReady()` 方法，删除这些模板代码并添加代码检查已授予位置权限以启用显示用户的位置。如果尚未授予权限，将通过调用之前添加的\
  \ `requestPermission()` 方法向用户请求：\n\n```java\n@Override\npublic void onMapReady(GoogleMap\
  \ googleMap) {\n    mMap = googleMap;\n    // 在悉尼添加标记并移动相机\n    LatLng sydney =\
  \ new LatLng(-34, 151);\n}\n```\n\n\n\n\n```java\nmMap.addMarker(new MarkerOptions().position(sydney).title(\"\
  Marker in Sydney\"));\n\nmMap.moveCamera(CameraUpdateFactory.newLatLng(sydney));\n\
  \nif (mMap != null) {\n    int permission = ContextCompat.checkSelfPermission(this,\n\
  \            Manifest.permission.ACCESS_FINE_LOCATION);\n    if (permission == PackageManager.PERMISSION_GRANTED)\
  \ {\n        mMap.setMyLocationEnabled(true);\n    } else {\n        requestPermission(\n\
  \                Manifest.permission.ACCESS_FINE_LOCATION,\n                LOCATION_REQUEST_CODE);\n\
  \    }\n}\n```\n\n当现在运行应用程序时，将显示图 85-10 所示对话框，请求位置权限。如果授予权限，地图上将出现一个蓝点，表示设备的位置。\n\
  \n![image-E7J7648R.jpg](img/image-E7J7648R.jpeg)\n\n图 85-10\n\n## 85.13 修改地图类型\n\
  \n可以通过调用相应 `GoogleMap` 对象的 `setMapType()` 方法来动态修改显示的的地图类型，并传递以下值之一：\n\n- `GoogleMap.MAP_TYPE_NONE`\
  \ – 一个不显示任何地图瓦片的空网格。\n- `GoogleMap.MAP_TYPE_NORMAL` – 由经典道路地图组成的标准视图。\n- `GoogleMap.MAP_TYPE_SATELLITE`\
  \ – 显示地图区域的卫星图像。\n- `GoogleMap.MAP_TYPE_HYBRID` – 显示叠加了道路地图的卫星图像。\n- `GoogleMap.MAP_TYPE_TERRAIN`\
  \ – 显示等高线和颜色等地形地形信息。\n\n例如，对 `onMapReady()` 方法进行以下代码更改可以将地图切换到卫星模式：\n\n```java\n\
  .\n.\nif (mMap != null) {\n    int permission = ContextCompat.checkSelfPermission(\n\
  \            this, Manifest.permission.ACCESS_FINE_LOCATION);\n    if (permission\
  \ == PackageManager.PERMISSION_GRANTED) {\n        mMap.setMyLocationEnabled(true);\n\
  \    } else {\n        requestPermission(Manifest.permission.ACCESS_FINE_LOCATION,\n\
  \                LOCATION_REQUEST_CODE);\n    }\n    mMap.setMapType(GoogleMap.MAP_TYPE_SATELLITE);\n\
  }\n.\n.\n```\n\n或者，可以在嵌入地图的 XML 布局文件中指定地图类型，使用 `map:mapType` 属性结合 none、normal、hybrid、satellite\
  \ 或 terrain 之一的值。例如：\n\n```xml\nxmlns:map=\"http://schemas.android.com/apk/res-auto\"\
  \n    android:id=\"@+id/map\"\n    android:layout_width=\"match_parent\"\n    android:layout_height=\"\
  match_parent\"\n    map:mapType=\"hybrid\"\n    android:name=\"com.google.android.gms.maps.SupportMapFragment\"\
  />\n```\n\n## 85.14 向用户显示地图控件\n\nGoogle Maps Android API 提供了若干可以可选显示给用户的控件，包括缩放放大缩小按钮、“我的位置”按钮和指南针。\n\
  \n缩放和指南针控件的显示可以通过编程控制，也可以在 XML 布局资源文件的地图元素中控制。要通过编程配置控件，必须获取与 `GoogleMap` 对象关联的\
  \ `UiSettings` 对象的引用：\n\n```java\nimport com.google.android.gms.maps.UiSettings;\n\
  .\n.\nUiSettings mapSettings;\nmapSettings = mMap.getUiSettings();\n```\n\n缩放控件通过调用\
  \ `UiSettings` 对象的 `setZoomControlsEnabled()` 方法来开启或关闭。例如：\n\n```java\nmapSettings.setZoomControlsEnabled(true);\n\
  ```\n\n或者，可以在 XML 资源文件的地图元素中设置 `map:uiZoomControls` 属性：\n\n```xml\nmap:uiZoomControls=\"\
  false\"\n```\n\n指南针可以通过调用 `UiSettings` 实例的 `setCompassEnabled()` 方法或通过 XML 资源使用\
  \ `map:uiCompass` 属性来显示。请注意，指南针图标仅在地图相机倾斜或偏离默认方向时才会出现。\n\n正如本章前面提到的，“我的位置”按钮只有在启用“我的位置”模式时才会出现。即使在这种模式下，也可以通过调用\
  \ `UiSettings` 实例的 `setMyLocationButtonEnabled()` 方法防止按钮显示。\n\n## 85.15 处理地图手势交互\n\
  \nGoogle Maps Android API 可以响应各种用户交互。这些交互可以用于更改显示的地图区域、缩放级别，甚至是视角（例如为某些城市显示地图区域的\
  \ 3D 表示）。\n\n### 85.15.1 地图缩放手势\n\n可以使用与 `GoogleMap` 实例关联的 `UiSettings` 对象的 `setZoomGesturesEnabled()`\
  \ 方法开启或关闭地图缩放手势的支持。例如，以下代码关闭了示例地图的缩放手势：\n\n```java\nUiSettings mapSettings;\nmapSettings\
  \ = map.getUiSettings();\nmapSettings.setZoomGesturesEnabled(false);\n```\n\n在 XML\
  \ 资源文件中将 `map:uiZoomGestures` 属性设置为 true 或 false 可以实现相同的结果。\n\n启用后，当用户在屏幕上进行捏合手势时，将发生缩放。同样，双击会放大，而双指轻击会缩小。相反，单指缩放手势是通过双击但不松开第二次轻击，然后在屏幕上上下滑动手指分别进行放大和缩小来实现的。\n\
  \n### 85.15.2 地图滚动/平移手势\n\n滚动或平移手势允许用户通过单指动作在屏幕上拖动地图来移动。可以通过 `UiSettings` 实例的 `setScrollGesturesEnabled()`\
  \ 方法在代码中启用滚动手势：\n\n```java\nUiSettings mapSettings;\nmapSettings = mMap.getUiSettings();\n\
  mapSettings.setScrollGesturesEnabled(true);\n```\n\n或者，可以在 XML 资源文件中启用 `map:uiGestures`\
  \ 属性。\n\n### 85.15.3 地图倾斜手势\n\n倾斜手势允许用户通过在屏幕上放置两个手指并上下移动它们来调整倾斜角度，改变地图投影的角度。可以通过\
  \ `UiSettings` 实例的 `setTiltGesturesEnabled()` 方法开启或关闭倾斜手势，例如：\n\n```java\nUiSettings\
  \ mapSettings;\nmapSettings = mMap.getUiSettings();\nmapSettings.setTiltGesturesEnabled(true);\n\
  ```\n\n倾斜手势也可以通过 XML 布局文件中的 `map:uiTilt` 属性开启或关闭。\n\n### 85.15.4 旋转手势\n\n在启用旋转手势的情况下，用户可以通过在屏幕上放置两个手指并旋转它们来旋转地图的方向。这种手势的支持通过调用\
  \ `UiSettings` 实例的 `setRotateGesturesEnabled()` 方法在代码中开启或关闭，例如：\n\n```java\nUiSettings\
  \ mapSettings;\nmapSettings = mMap.getUiSettings();\nmapSettings.setRotateGesturesEnabled(true);\n\
  ```\n\n旋转手势也可以通过 XML 布局文件中的 `map:uiRotate` 属性开启或关闭。\n\n## 85.16 创建地图标记\n\n标记向用户通知地图上的位置，形式可以是标准图标或自定义图标。标记还可以包含标题和可选文本（称为\
  \ snippet），并可以配置为允许用户拖动到地图的不同位置。当用户点击标记时，将出现信息窗口，显示有关标记位置的附加。\n\n标记由 `Marker` 类实例表示，并通过调用相应\
  \ `GoogleMap` 对象的 `addMarker()` 方法添加到地图中。将包含标记所需的各种选项（如标题和 snippet）的 `MarkerOptions`\
  \ 实例作为参数传递给方法。例如，以下代码在地图上的特定位置添加了一个包含标题、snippet 的标记：\n\n```java\nimport com.google.android.gms.maps.model.Marker;\n\
  import com.google.android.gms.maps.model.LatLng;\nimport com.google.android.gms.maps.model.MarkerOptions;\n\
  .\n.\n.\nLatLng position = new LatLng(38.8874245, -77.0200729);\n\nMarker museum\
  \ = mMap.addMarker(new MarkerOptions()\n        .position(position)\n        .title(\"\
  Museum\")\n        .snippet(\"National Air and Space Museum\"));\n```\n\n\n\n\n\
  执行上述代码后，将标记指定的的位置，点击该位置时将显示一个包含标题和代码片段的 info 窗口，如图 85-11 所示：\n\n![image-GIT2GATE.jpg](img/image-GIT2GATE.jpeg)\n\
  \n图 85-11\n\n## 85.17 控制地图相机\n\n由于 Android 设备的屏幕是平面的，而地球是球体，因此 Google Maps Android\
  \ API 使用墨卡托投影在平面上表示地球。地图的默认视图呈现给用户，就像通过一个悬挂在地图上方并直接指向地图的相机一样。Google Maps Android\
  \ API 允许在应用程序内部更改此相机的目标、缩放、方位角和倾角：\n\n- Target（目标）——设备显示屏地图中心的位置，通过经度和纬度指定。\n- Zoom（缩放）——以级别指定的相机缩放级别。缩放级别增加\
  \ 1.0 将显示地图内容的宽度增加一倍。\n- Tilt（倾角）——相机的视角角度，指定为跨越可视地图区域正上方的弧线位置，以从弧顶开始的度数测量（弧顶为相机直接指向地图的底点）。\n\
  - Bearing（方位角）——地图的方向，以北为基准顺时针方向测量的数。\n\n通过创建一个具有适当设置的 `CameraUpdate` 类实例来完成相机更改。`CameraUpdate`\
  \ 实例是通过对 `CameraUpdateFactory` 类的方法调用来创建的。一旦创建了 `CameraUpdate` 实例，就可以通过调用 `GoogleMap`\
  \ 实例的 `moveCamera()` 方法将其应用到地图。为了在相机更改时获得平滑的动画效果，可以调用 `animateCamera()` 方法代替 `moveCamera()`。\n\
  \n`CameraUpdateFactory` 方法的摘要如下：\n\n- `CameraUpdateFactory.zoomIn()` – 提供一个缩放一层级的\
  \ `CameraUpdate` 实例。\n- `CameraUpdateFactory.zoomOut()` - 提供一个缩小一层级的 `CameraUpdate`\
  \ 实例。\n- `CameraUpdateFactory.zoomTo(float)` - 生成一个将缩放级别更改为指定值的 `CameraUpdate` 实例。\n\
  - `CameraUpdateFactory.zoomBy(float)` – 提供一个缩放级别增加或减少指定量的 `CameraUpdate` 实例。\n-\
  \ `CameraUpdateFactory.zoomBy(float, Point)` - 创建一个按指定值增加或减少缩放级别的 `CameraUpdate`\
  \ 实例。\n- `CameraUpdateFactory.newLatLng(LatLng)` - 创建一个更改相机目标经度和纬度的 `CameraUpdate`\
  \ 实例。\n- `CameraUpdateFactory.newLatLngZoom(LatLng, float)` - 生成一个更改相机纬度、经度和缩放的\
  \ `CameraUpdate` 实例。\n- `CameraUpdateFactory.newCameraPosition(CameraPosition)`\
  \ - 返回一个将相机移动到指定位置的 `CameraUpdate` 实例。可以使用 `CameraPosition.Builder()` 获取 `CameraPosition`\
  \ 实例。\n\n例如，以下代码使用动画将相机缩放大了一级：\n\n```java\nmMap.animateCamera(CameraUpdateFactory.zoomIn());\n\
  ```\n\n另一方面，以下代码将相机移动到新位置并将缩放级别调整为 10，且没有动画：\n\n```java\nprivate static final LatLng\
  \ position =\nnew LatLng(38.8874245, -77.0200729);\n\nmMap.moveCamera(CameraUpdateFactory.newLatLngZoom(position,\
  \ 10));\n```\n\n最后，下一个代码示例使用 `CameraPosition.Builder()` 创建一个具有目标、缩放、方位角和倾角变化的 `CameraPosition`\
  \ 对象。然后使用动画将此更改应用到相机：\n\n```java\nimport com.google.android.gms.maps.model.CameraPosition;\n\
  import com.google.android.gms.maps.CameraUpdateFactory;\n\nCameraPosition cameraPosition\
  \ = new CameraPosition.Builder()\n    .target(position)\n    .zoom(50)\n    .bearing(70)\n\
  \    .tilt(25)\n    .build();\n\nmMap.animateCamera(CameraUpdateFactory.newCameraPosition(cameraPosition));\n\
  ```\n\n## 85.18 总结\n\n本章提供了构成 Google Maps Android API 的关键类和方法，并概述了如何准备开发环境和应用程序项目以使用该\
  \ API。\n\n## 86. 使用 Android 打印框架打印\n\nAndroid Printing Framework 用于从 Android 应用程序内部打印内容。随后的章节将更详细地探讨为应用程序添加打印支持的选项，但本章将关注目前\
  \ Android 中提供的各种打印选项以及启用这些选项的步骤。\n\n该章节将提供 Android 开发者可用于在应用程序中构建打印支持的各种打印功能的概述。\n\
  \n## 86.1 Android 打印架构\n\n打印框架为 Android 提供了打印功能。从根本上说，该框架由打印管理器（Print Manager）和若干打印服务插件（print\
  \ service plugins）组成。\n\n打印管理器负责处理设备上应用程序的打印请求，并与安装在设备上的打印服务插件交互，从而确保打印请求。。默认情况下，许多\
  \ Android 设备安装了打印服务插件，以便使用 Google Cloud Print 和 Google Drive 服务进行打印。其他类型打印机的打印服务插件如果没有安装，也可以从\
  \ Google Play 商店获取。\n\n打印服务插件目前适用于 HP、爱普生、三星和佳能打印机，其他打印机制造商的插件极可能在未来发布。然而，Google\
  \ Cloud Print 服务插件可以从几乎任何类型的打印机打印。\n\n本书将使用 HP 打印服务插件作为示例。\n\n## 86.2 打印服务插件\n\n\
  打印服务插件的目的是允许应用程序打印到通过本地网络或蓝牙可见的兼容打印机。\n\n可以通过加载 Google Play 应用并搜索 `Print Service\
  \ Plugin` 来验证 Android 设备上是否存在打印服务插件。\n\n一旦插件出现在商店列表中，且尚未安装，即可点击“安装”按钮进行安装。图 86-1\
  \ 显示了 Google Play 中的 HP 服务插件。\n\n打印服务插件会自动检测 Android 设备当前连接的网络上的兼容打印机，并将它们列为应用程序打印的选项。\n\
  \n![image-8Q500M.jpg](images/8Q5XT0M.jpeg\n\n\n\n86-1\n\n## 86.3 Google Cloud Print\n\
  \nGoogle Cloud Print 是 Google 提供的一种服务，允许您从任何具有互联网连接的地方通过网络将内容打印到打印机上。Google Cloud\
  \ Print 支持云端和经典的许多设备和模型。云端打印机内置了通过网络打印的技术。提供云端打印机的制造商包括博世、佳能、戴尔、爱普生、HP、柯达和三星。要识别您的打印机是否支持云端且受\
  \ Google Cloud Print 支持，请查看以下 URL 中的打印机列表：\n\n`https://www.google.com/cloudprint/learn/printers.html`\n\
  \n对于经典的非云端打印机，Google Cloud Print 通过在连接到经典打印机的计算机系统上（直接连接或通过家庭或办公室网络）安装软件来提供云打印支持。\n\
  \n要设置 Google Cloud Print，请访问以下网页并使用与您登录 Android 设备时相同的 Google 账户 登录：\n\n`https://www.google.com/cloudprint/learn/index.html`\n\
  \n一旦打印机添加到您的 Google Cloud Print 账户，当您从 Android 应用程序内部打印时，它们将列为打印目标选项。\n\n## 86.4\
  \ 打印到 Google Drive\n\n\n\n\n除了支持实体打印机外，还可以将打印输出保存到您的 Google Drive 账户。从设备打印时，请在打印面板中选择`Save\
  \ to Google Drive`选项。待打印内容将被转换为 PDF 文件，并保存到与设备上当前激活的 `Google Account ID` 相关的 Google\
  \ Drive 云存储中。\n\n## 86.5 保存为 PDF\n\nAndroid 提供的最终打印选项允许将打印内容作为 PDF 文件本地保存到 Android\
  \ 设备上。一旦选择此选项，系统将要求为 PDF 文件指定名称以及在设备上保存文档的存储位置。\n\n在测试自己的 Android 应用程序的打印功能时，`Save\
  \ as PDF` 和 `Google Drive`选项在节省纸张方面可能极具价值。\n\n## 86.6 从 Android 设备上打印\n\nGoogle\
  \ 建议可以打印内容的应用程序通过将打印选项放置在溢出菜单（Overflow menu）中。许多与 Android 绑定的应用程序现在都包含了“打印…””菜单选项。例如，图\
  \ 86-2 显示了通过选择 Chrome 浏览器应用程序溢出菜单中的“共享…””选项来访问打印选项：\n\n![image-ZLM0IG6U.jpg](img/image-ZLM0IG6U.jpeg)\n\
  \n图 86-2\n\n一旦在应用程序内选择了打印选项，将出现标准的 Android 打印屏幕，显示待打印内容的预览，如图 86-3 所示：\n\n![image-A1EVFE6E.jpg](img/image-A1EVFE6E.jpeg)\n\
  \n图 86-3\n\n点击屏幕顶部的面板将显示完整的打印选项：\n\n![image-KROWSLOZ.jpg](img/image-KROWSLOZ.jpeg)\n\
  \n图 86-4\n\nAndroid 打印面板提供了标准的打印选项，如纸张大小、颜色、方向和打印份数。通过点击当前打印机或 PDF 输出选择，可以访问其他打印目标选项。\n\
  \n## 86.7 在 Android 应用中构建打印支持的选项\n\n打印框架（Printing framework）为在 Android 应用程序中整合打印支持提供了多种选项。这些选项可以分类如下：\n\
  \n### 86.7.1 图像打印\n\n如所示，此选项允许将图像打印集成到 Android 应用程序中。在应用程序中添加此功能时，第一步是创建一个 `PrintHelper`\
  \ 类的新实例：\n\n```\nPrintHelper imagePrinter = new PrintHelper(context);\n```\n\n接下来，可以通过调用\
  \ `PrintHelper` 实例的 `setScaleMode()` 方法指定打印图像的缩放模式。选项如下：\n\n- `SCALE_MODE_FIT` –\
  \ 图像将缩放以适应纸张大小，而不进行裁剪或更改纵横比。这通常会导致在某个维度上出现空白区域。\n- `SCALE_MODE_FILL` – 图像将缩放以填充纸张大小，并在必要时进行裁剪，以避免打印输出中出现空白区域。\n\
  \n如果不设置缩放模式，系统将默认使用`SCALE_MODE_FILL`。例如，以下代码在之前声明的 `PrintHelper` 实例上将缩放设置为适应模式：\n\
  \n```java\nimagePrinter.setScaleMode(PrintHelper.SCALE_MODE_FIT);\n```\n\n同样，也可以配置颜色模式，以指示打印输出是彩色还是黑白。这是通过向\
  \ `PrintHelper` 实例的 `setColorMode()` 方法传递以下选项之一来完成的：\n\n- `COLOR_MODE_COLOR` – 表示图像将以彩色打印。\n\
  - `COLOR_MODE_MONOCHROME` – 表示图像将以黑白打印。\n\n除非按如下指定单色选项，否则打印框架将默认彩色打印：\n\n```java\n\
  imagePrinter.setColorMode(PrintHelper.COLOR_MODE_MONOCHROME);\n```\n\n完成打印操作所需的只是一个待打印的图像以及调用\
  \ `PrintHelper` 实例的 `printBitmap()` 方法，该方法需要传递一个代表分配给打印任务名称的字符串以及图像的引用（以 `Bitmap`\
  \ 对象或 `Uri` 引用的形式）：\n\n```java\nBitmap bitmap = BitmapFactory.decodeResource(getResources(),\n\
  R.drawable.oceanscene);\n\nimagePrinter.printBitmap(\"My Test Print Job\", bitmap);\n\
  ```\n\n一旦启动打印任务，打印框架将显示打印对话框，并处理后续与用户的交互以及在用户选择的打印目标上打印图像。\n\n### 86.7.2 创建并打印 HTML\
  \ 内容\n\nAndroid 打印框架还提供了一种在应用程序内打印基于 HTML 内容的简单方法。这些内容可以是由托管在网站上的页面 URL 引用的 HTML\
  \ 内容，也可以是在应用程序内部动态创建的 HTML 内容。\n\n为了启用 HTML 打印，`WebView` 类已经过扩展，以以最少的代码要求支持打印。\n\
  \n在动态创建 HTML 内容（与加载和打印现有网页相比）时，该过程涉及创建一个 `WebView` 对象并与其关联一个 `WebViewClient` 实例。然后配置\
  \ web 客户端，在 HTML 加载到 `WebView` 之后启动打印任务。配置好 web 客户端后，HTML 被加载到 `WebView` 中，并触发打印过程。\n\
  \n例如，考虑以下代码：\n\n```java\npublic void printContent()\n{\n    WebView webView = new\
  \ WebView(this);\n    webView.setWebViewClient(new WebViewClient() {\n        public\
  \ boolean shouldOverrideUrlLoading(WebView view,\n        String url)\n        {\n\
  \            return false;\n        }\n        @Override\n        public void onPageFinished(WebView\
  \ view, String url) {\n            createPrintJob(view);\n            myWebView\
  \ = null;\n        }\n    });\n    String htmlDocument =\n    \"# Android Print\
  \ Test\"\n    + \"This is sample content.\";\n    webView.loadDataWithURL(null,\
  \ htmlDocument,\n    \"text/HTML\", \"UTF-8\", null);\n    myWebView = webView;\n\
  }\n```\n\n该方法的代码首先声明一个变量 `myWebView`，其中将存储方法中创建的 `WebView` 实例。在 `printContent()`\
  \ 方法中，创建一个 `WebView` 类实例，并为其分配一个 `WebViewClient` 实例。\n\n分配给 web 对象的 `WebViewClient`\
  \ 被配置为指示 HTML 内容的加载由 `WebView` 实例处理（通过从 `shouldOverrideUrlLoading()` 方法返回 `false`）。更重要的是，声明并实现\
  \ `onPageFinished()` 处理方法来调用 `createPrintJob()` 方法。当所有 HTML 内容加载到 web view 时，会自动调用\
  \ `onPageFinished()` 回调方法。这确保了在准备就绪之前不会启动打印任务，确保所有内容都被打印。\n\n接下来，创建一个包含某些 HTML 的字符串作为内容。然后将其加载到\
  \ web view 中。一旦 HTML 加载，将触发 `onPageFinished()` 方法。最后，该方法存储 web view 对象的引用。如果没有这一至关重要的步骤，Java\
  \ 运行时系统可能会认为应用程序不再需要该 web view 对象并丢弃它以释放内存（Java 术语中称为垃圾回收），从而导致打印任务在完成之前就终止。\n\n\
  此示例中剩下的工作是按所示实现 `createPrintJob()` 方法：\n\n```java\nprivate void createPrintJob(WebView\
  \ webView) {\n    PrintManager printManager = (PrintManager) this\n    .getSystemService(Context.PRINT_SERVICE);\n\
  \    PrintDocumentAdapter printAdapter =\n    webView.createPrintDocumentAdapter(\"\
  MyDocument\");\n    String jobName = getString(R.string.app_name) + \" Document\"\
  ;\n    PrintJob printJob = printManager.print(jobName, printAdapter,\n    new PrintAttributes.Builder().build());\n\
  }\n```\n\n\n\n\n该方法获取 `PrintManager` 服务的引用，并指令 web 视图实例创建一个打印适配器。将创建一个新的字符串来存储打印任务的名称（在这种情况下，该名称基于应用程序名称和“Document”一词）。\n\
  \n最后，通过调用打印管理器的 `print()` 方法来启动打印任务，并传递任务名称、打印适配器以及一组默认打印属性。如果需要的话，可以对打印属性进行自定义，以指定分辨率（每英寸点数）、页边距和颜色选项。\n\
  \n## 86.7.3 打印网页\n\n打印网页涉及的步骤与上述概述的步骤相似，不同之处在于传递 web 视图的是要打印网页的 URL，而不是动态创建的 HTML，例如：\n\
  \n```\nmyWebView.loadUrl(\"https://developer.android.com/google/index.html\");\n\
  ```\n\n同样重要的是，只有当需要网页在加载加载后立即自动打印时，才需要配置 `WebViewClient`。如果打印操作是由用户在页面加载后通过选择菜单选项来启动的，则只需要在应用代码中包含上述概述的\
  \ `createWebPrintJob()` 方法中的代码。下一章“Android HTML 和 Web 内容打印示例”将演示此类场景。\n\n## 86.7.4\
  \ 打印自定义文档\n\n虽然打印框架引入的 HTML 和 Web 打印功能为从 Android 应用内部打印内容提供了方便路径，但显而易见，对于更高级的打印需求，这些选项过于简单。打印框架还为更复杂的打印任务提供了自定义文档打印支持。这允许将文本和图形形式的内容绘制到画布上然后打印。\n\
  \n与可以相对容易实现的 HTML 和图像打印不同，自定义文档打印是一个更复杂、多阶段的过程，该过程将在本书的“Android 自定义文档打印指南”章节中概述。这些步骤可以总结如下：\n\
  \n- 连接到 Android 打印管理器\n- 创建一个子类自 `PrintDocumentAdapter` 类的自定义打印适配器\n- 创建一个 `PdfDocument`\
  \ 实例来表示文档页面\n- 获取 `PdfDocument` 实例页面的引用，每个页面都关联着一个 `Canvas` 实例\n- 在页面画布上绘制内容\n-\
  \ 通知打印框架文档已准备好打印\n\n上述步骤中概述的自定义打印适配器必须实现几个方法，Android 系统将在打印期间调用这些方法来执行特定任务。其中最重要的是\
  \ `onLayout()` 方法，它负责响应用户更改纸张大小或页面方向等设置重新排列文档布局，以及 `onWrite()` 方法，它负责渲染要打印的页面。题为“Android\
  \ 自定义文档打印指南”章节将详细介绍此主题。\n\n## 86.8 总结\n\nAndroid SDK 可以从运行应用内部打印内容。打印输出可以重定向到配置适当的打印机、本地\
  \ PDF 文件或通过 Google Drive 传输到云端。从 Android 应用开发者的角度来看，通过使用打印框架，可以在应用程序中使用这些功能。到目前为止，最简单的打印选项是涉及图像和\
  \ HTML 形式的内容。然而，更高级的打印可以使用框架的自定义文档打印功能实现。\n\n## 87. 一个 Android HTML 和 Web 内容打印示例\n\
  \n正如上一章“使用 Android 打印框架打印”概述的那样，Android 打印框架可以同时打印网页和动态创建的 HTML 内容。虽然这两种打印方法有许多相似之处，但也存在一些需要考虑的微妙差异。本章将通过创建两个示例应用程序来使这两种打印选项更加清晰。\n\
  \n## 87.1 创建 HTML 打印示例应用\n\n从欢迎屏幕上选择“New Project”（新建项目）选项，并在弹出的新项目对话框中，点击“Next”（下一步）按钮之前选择“Empty\
  \ Views Activity”模板。\n\n在 Name 字段中输入 `HTMLPrint` 并指定 `com.ebookfrenzy.htmlprint`\
  \ 为包名。在点击“Finish”（完成）按钮之前，将 Minimum API level 设置为 API 26: Android 8.0 (Oreo)，并将\
  \ Language 语言菜单设置为 Java。\n\n## 87.2 打印动态 HTML 内容\n\n本教程的第一阶段是向项目添加代码以创建一些 HTML 内容并将其作为打印任务发送到打印框架。\n\
  \n首先找到 `MainActivity.java` 文件（位于 Project 工具窗口的 `app -> java -> com.ebookfrenzy.htmlprint`\
  \ 下），并将其加载到编辑面板。加载后，修改代码使其读取如下列表所示：\n\n```java\npackage com.ebookfrenzy.htmlprint;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\n\nimport android.os.Bundle;\n\
  import android.webkit.WebView;\nimport android.webkit.WebViewClient;\nimport android.webkit.WebResourceRequest;\n\
  import android.print.PrintAttributes;\nimport android.print.PrintDocumentAdapter;\n\
  import android.print.PrintManager;\nimport android.content.Context;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n\n    private WebView myWebView;\n\n\
  \    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n     \
  \   super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_htmlprint);\n\
  \        printWebView();\n    }\n\n    private void printWebView() {\n        WebView\
  \ webView = new WebView(this);\n        webView.setWebViewClient(new WebViewClient()\
  \ {\n            public boolean shouldOverrideUrlLoading(WebView view,\n       \
  \     WebResourceRequest request)\n            {\n                return false;\n\
  \            }\n            @Override\n            public void onPageFinished(WebView\
  \ view, String url)\n            {\n                createWebPrintJob(view);\n \
  \               myWebView = null;\n            }\n        });\n\n        String\
  \ htmlDocument = \"# Android Print Test\"\n        + \" This is sample content.\"\
  ;\n\n        webView.loadDataWithBaseURL(null, htmlDocument,\n        \"text/HTML\"\
  , \"UTF-8\", null);\n        myWebView = webView;\n    }\n}\n```\n\n代码更改从声明变量 `myWebView`\
  \ 开始，该变量将存储用于打印操作的 `WebView` 实例。在 `printWebView()` 方法中，创建 `WebView` 类的实例，并为其分配一个\
  \ `WebViewClient` 实例。\n\n分配给 web 对象的 `WebViewClient` 配置为由 WebView 实例处理 HTML 内容（通过从\
  \ `shouldOverrideUrlLoading()` 方法返回 `false`）。更重要的是，声明并实现了一个 `onPageFinished()` 处理方法以调用\
  \ `createWebPrintJob()` 方法。当所有 HTML 内容加载到 web 中时，会自动调用 `onPageFinished()` 方法。正如上一章概述，当打印动态\
  \ HTML 内容时此步骤是必要的，以确保在内容完全加载到 `WebView` 之后才启动打印任务。\n\n接下来，创建一个包含某些内容的 String 对象并随后加载到\
  \ web 中。一旦 HTML 加载，`onPageFinished()` 回调方法就会触发。最后，该方法将 web 对象的引用存储在先定义的 `myWebView`\
  \ 变量中。没有这个关键步骤，Java 运行时系统可能会认为应用程序不再需要该 web 对象并将其丢弃以释放内存，导致打印任务在完成之前就终止。\n\n此示例中剩下的只需实现\
  \ `createWebPrintJob()` 方法，该方法目前配置为由 `onPageFinished()` 回调方法调用。因此，留在 `MainActivity.java`\
  \ 文件中，实现此方法使其读取如下：\n\n\n\n\n\n```java\nprivate void createWebPrintJob(WebView webView)\
  \ {\n    PrintManager printManager = (PrintManager) this\n        .getSystemService(Context.PRINT_SERVICE);\n\
  \    PrintDocumentAdapter printAdapter =\n        webView.createPrintDocumentAdapter(\"\
  MyDocument\");\n    String jobName = getString(R.string.app_name) + \" Print Test\"\
  ;\n    printManager.print(jobName, printAdapter,\n        new PrintAttributes.Builder().build());\n\
  }\n```\n\n此方法获取了 `PrintManager` 服务的引用，并指示 web view 实例创建一个打印适配器。会创建一个新字符串来存储打印任务的名称（在本例中，基于应用程序名称和“Print\
  \ Test”字样）。\n\n最后，通过调用打印管理器的 `print()` 方法启动打印任务，并传递任务名称、打印适配器以及一组默认打印属性。\n\n在运行\
  \ Android 5.0 或更高版本的设备或模拟器上编译并运行应用程序。启动后，将出现如图 87-1 所示的标准 Android 打印页面。\n\n![image-ORJ6ODIB.jpg](img/image-ORJ6ODIB.jpeg)\n\
  \n图 87-1\n\n如果你配置了物理打印机，请打印到该打印机；保存到 Google Drive；或选择保存为 PDF 文件。一旦启动打印任务，请在所选目标位置检查生成的输出。请注意，当使用“保存为\
  \ PDF”选项时，系统会要求指定 PDF 文件的名称和位置。下载文件夹是一个很好的选择，可以通过点击设备上其他应用图标之间的 Downloads 图标（在 Android\
  \ 8 中重命名为 Files）来查看其内容。\n\n## 87.3 创建网页打印示例\n\n在本章创建的第二个示例应用程序将为用户提供一个溢出菜单（Overflow\
  \ menu）选项，用于打印当前在 `WebView` 实例中显示的网页。\n\n从欢迎界面界面选择 `New Project`（新建项目）选项，在弹出的新项目对话框中，点击\
