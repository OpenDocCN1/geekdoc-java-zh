  \n应用 bundle 文件上传后，Google Play 将生成所有用于测试的必要 APK 文件。一旦 APK 文件生成完毕，滚动到屏幕底部并点击“保存”按钮。保存设置后，点击“查看版本”按钮。\n\
  \n## 73.14 分析 App Bundle\n\nAndroid Studio 提供了分析应用 bundle 内容。要分析 bundle 文件，选择 Android\
  \ Studio Build -> Analyze APK… 菜单，导航并选择要审核的 bundle 文件。一旦加载，工具将显示有关包原始大小和下载大小的信息，以及包结构列表，如图\
  \ 73-17 所示：\n\n![image-QINKL58D.jpg](img/image-QINKL58D.jpeg)\n\n图 73-17\n\n选择 `classes.dex`\
  \ 文件将在下方面板中显示文件的类结构。在此面板中，可以深入到类方法级别探索单个类的详细信息：\n\n![image-Y0M4BPHY.jpg](img/image-Y0M4BPHY.jpeg)\n\
  \n图 73-18\n\n## 73.15 总结\n\n当应用项目完成或准备好测试时，可以将其上传到 Google Play 控制台并发布生产、内部、Alpha\
  \ 或 Beta 测试。在上传应用之前，必须在控制台中创建一个应用条目，包括有关应用的信息和用于商店的截图。生成发布 Android App Bundle 文件并使用上传密钥进行签名。一旦\
  \ bundle 文件上传，Google Play 将移除上传密钥并替换为安全存储的应用签名密钥，应用即可准备好发布。\n\n在 Android 和 iOS 等操作系统的早期，最常见的盈利方法是在下载和安装应用时收取预付费。很快另一种盈利机会是通过在应用中嵌入广告。\n\
  \n\n\n\n\nGoogle 支持通过 Google Play In-App Billing API 和 Play Console 集成应用内购买。本章将提供应用内购买的概述，并介绍如何将应用内购买集成到你的\
  \ Android 项目中。在探索这些主题之后，下一章将引导你创建一个包含应用内购买功能的示例应用。\n\n## 74.1 为应用内购买准备项目\n\n在应用中构建应用内购买功能需要\
  \ Google Play 开发者控制台账号，该账号详情在之前的“创建、测试和上传 Android App Bundle”章节中介绍过。你还必须注册一个 Google\
  \ 商户账户。可以通过在 Play Console 中导航到 `Setup`（设置）-> `Payments profile`（付款资料）找到这些设置。请注意，商户注册并非所有国家都可用。详情信息，请参考以下页面：\n\
  \n[`support.google.com/googleplay/android-developer/answer/9306917`](https://support.google.com/googleplay/android-developer/answer/9306917)\n\
  \n随后必须将应用上传到控制台并启用应用内购买。然而，除非已将模块级 `build.gradle.kts` 文件添加 Google Play Billing Library，否则控制台不会为应用激活应用内购买支持：\n\
  \n```kotlin\ndependencies {\n    implementation(libs.billingclient)\n}\n```\n\n\
  一旦修改了构建文件并将应用包上传到控制台，下一步是添加供用户购买的应用内产品或订阅。\n\n## 74.2 创建应用内产品和订阅\n\n产品和订阅是使用 Play\
  \ Console 导航面板中 `Monetize`（变现）部分列出的选项创建和管理的，如下图 74-1 所示：\n\n![image-8WAIIQPM.jpg](img/image-8WAIIQPM.jpeg)\n\
  \n图 74-1\n\n每个产品或订阅都需要 `ID`、`title`（标题）、`description`（描述）和 `pricing`（定价）信息。购买分为消耗型（用户每次需要时都必须购买，例如游戏中的虚拟货币）、非消耗型（用户只需购买一次，例如内容访问）和基于订阅的。消耗型和非消耗型产品统称为托管产品。\n\
  \n订阅适用于销售需要定期续订的项目，例如访问新闻内容或应用的高级功能。在创建订阅时，基础方案指定了价格、续订周期（每月、每年等）以及订阅是否自动续订。还可以为用户提供优惠和预购订阅的选项。\n\
  \n## 74.3 Billing Client 初始化\n\n你的应用与 Google Play Billing Library 之间的通信由 `BillingClient`\
  \ 实例处理。此外，`BillingClient` 包含一组可以调用以执行同步和异步结算相关活动的方法。当初始化结算客户端时，需要为它提供一个 `PurchasesUpdatedListener`\
  \ 回调处理程序的引用。客户端将调用此处理程序来通知你的应用任何购买活动的结果。为了避免重复通知，建议每个应用只保留一个 `BillingClient` 实例。可以使用\
  \ `newBuilder()` 方法创建 `BillingClient` 实例，传递当前的 activity 或 fragment 上。\n\n```java\n\
  private final PurchasesUpdatedListener purchasesUpdatedListener =\n    new PurchasesUpdatedListener()\
  \ {\n        @Override\n        public void onPurchasesUpdated(BillingResult billingResult,\
  \ List purchases) {\n            if (billingResult.getResponseCode() ==\n      \
  \              BillingClient.BillingResponseCode.OK\n                    && purchases\
  \ != null) {\n                // 购买成功\n                for (Purchase purchase :\
  \ purchases) {\n                    // 处理购买\n                }\n            } else\
  \ if (billingResult.getResponseCode() ==\n                    BillingClient.BillingResponseCode.USER_CANCELED)\
  \ {\n                // 用户取消购买\n            } else {\n                //在此处处理错误\n\
  \            }\n        }\n    };\n\nprivate BillingClient billingClient = BillingClient.newBuilder(context)\n\
  \        .setListener(purchasesUpdatedListener)\n        .enablePendingPurchases(\n\
  \            PendingPurchasesParams.newBuilder()\n                .enableOneTimeProducts().build()\n\
  \        )\n        .build();\n```\n\n## 74.4 连接到 Google Play Billing Library\n\n\
  成功创建 Billing Client 后，下一步是初始化与 Google Play Billing Library 的连接。必须调用结算客户端实例的 `startConnection()`\
  \ 方法来建立此连接。由于连接是异步执行的，必须实现 `BillingClientStateListener` 以接收指示连接是否成功的回调。还应该添加代码来重写\
  \ `onBillingServiceDisconnected()` 方法。当与 Billing Library 的连接丢失时会调用此方法，用于向用户报告问题并重试连接。\n\
  \n一旦设置和连接任务完成，`BillingClient` 实例将调用 `onBillingSetupFinished()` 方法，可用它来检查客户端是否就绪：\n\
  \n```java\nbillingClient.startConnection(new BillingClientStateListener() {\n  \
  \  @Override\n    public void onBillingSetupFinished(@NonNull BillingResult billingResult)\
  \ {\n        if (billingResult.getResponseCode() == BillingClient.BillingResponseCode.OK)\
  \ {\n            // 连接成功\n        } else {\n            // 连接失败\n        }\n   \
  \ }\n\n    @Override\n    public void onBillingServiceDisconnected() {\n       \
  \ // 现有连接丢失\n    }\n});\n```\n\n## 74.5 查询可用产品\n\n一旦结算环境初始化并准备就绪，下一步是请求可购买的产品或订阅的详情。这通过调用\
  \ `BillingClient` 的 `queryProductDetailsAsync()` 方法并传递一个经过配置的 `QueryProductDetailsParams`\
  \ 实例来实现，该实例包含产品 ID 和类型（订阅使用 `ProductType.SUBS`，托管产品使用 `ProductType.INAPP`）：\n\n\
  ```java\nQueryProductDetailsParams queryProductDetailsParams =\n    QueryProductDetailsParams.newBuilder()\n\
  \        .setProductList(ImmutableList.of(\n            QueryProductDetailsParams.Product.newBuilder()\n\
  \                .setProductId(\"one_button_click\")\n                .setProductType(BillingClient.ProductType.INAPP)\n\
  \                .build()))\n        .build();\n\nbillingClient.queryProductDetailsAsync(queryProductDetailsParams,\n\
  \    new ProductDetailsResponseListener() {\n        public void onProductDetailsResponse(@NonNull\
  \ BillingResult billingResult, @NonNull List productDetailsList) {\n           \
  \ if (!productDetailsList.isEmpty()) {\n                // 处理匹配的产品列表\n         \
  \   } else {\n                // 未找到匹配的产品\n            }\n        }\n    });\n```\n\
  \n`queryProductDetailsAsync()` 方法传递一个 `ProductDetailsResponseListener` 处理程序，该处理器随后会被调用并传递包含匹配产品信息的\
  \ `ProductDetail` 对象列表。例如，我们可以调用这些对象的方法获取产品名称、标题、描述、价格和优惠详情。\n\n## 74.6 启动购买流程\n\
  \n一旦用户查询并选择了产品或订阅，购买流程就可以启动了。我们通过调用 `BillingClient` 的 `launchBillingFlow()` 方法来实现，传递当前\
  \ activity 以及一个配置了所购项目 `ProductDetail` 对象的 `BillingFlowParams` 实例。\n\n```java\n\
  BillingFlowParams billingFlowParams =\n    BillingFlowParams.newBuilder()\n    \
  \    .setProductDetailsParamsList(ImmutableList.of(\n            BillingFlowParams.ProductDetailsParams.newBuilder()\n\
  \                .setProductDetails(productDetails)\n                .build()\n\
  \        ))\n        .build();\n\nbillingClient.launchBillingFlow(this, billingFlowParams);\n\
  ```\n\n购买操作的成功否将通过本章之前概述的 `PurchasesUpdatedListener` 回调处理程序报告。\n\n## 74.7 完成购买\n\
  \n\n\n\n当购买成功时，`PurchasesUpdatedListener` 处理器将接收一个包含每个项目 `Purchase` 对象的列表。你可以按照如下方式调用\
  \ `Purchase` 实例的 `getPurchaseState()` 方法来验证项目是否已购买：\n\n```java\nif (purchase.getPurchaseState()\
  \ == Purchase.PurchaseState.PURCHASED) {\n    // 购买完成。\n} else if (purchase.getPurchaseState()\
  \ == Purchase.PurchaseState.PENDING) {\n    // 支付仍在处理中\n}\n```\n\n请注意，只有在初始化期间调用了\
  \ `enablePendingPurchases()` 方法，你的应用才会支持待处理购买。待处理购买将一直保持状态，直到用户完成付款流程。\n\n当非消耗性项目的购买完成后，必须对其进行确认，以防止向用户退款。这需要项目的购买令牌（purchase\
  \ token），令牌可以通过调用 `Purchase` 对象的 `getPurchaseToken()` 方法获取。该令牌用于创建 `AcknowledgePurchaseParams`\
  \ 实例和 `AcknowledgePurchaseResponseListener` 处理器。托管商品购买和订阅通过如下调用 `BillingClient`\
  \ 的 `acknowledgePurchase()` 方法进行确认：\n\n```java\nAcknowledgePurchaseParams acknowledgePurchaseParams\
  \ =\n    AcknowledgePurchaseParams.newBuilder()\n        .setPurchaseToken(purchase.getPurchaseToken())\n\
  \        .build();\n\nAcknowledgePurchaseResponseListener acknowledgePurchaseResponseListener\
  \ =\n    new AcknowledgePurchaseResponseListener() {\n        @Override\n      \
  \  public void onAcknowledgePurchaseResponse(\n                @NonNull BillingResult\
  \ billingResult) {\n            billingClient.acknowledgePurchase(\n           \
  \     acknowledgePurchaseParams,\n                acknowledgePurchaseResponseListener);\n\
  \        }\n    };\n```\n\n对于消耗性购买，你需要在项目被消耗后通知 Google Play，以便用户可以再次购买。这需要一个包含购买令牌的配置\
  \ `ConsumeParams` 实例、一个 `ConsumeResponseListener` 以及调用结算客户端的 `consumeAsync()` 方法：\n\
  \n```java\nConsumeParams consumeParams =\n    ConsumeParams.newBuilder()\n     \
  \   .setPurchaseToken(purchase.getPurchaseToken())\n        .build();\n\nConsumeResponseListener\
  \ listener = new ConsumeResponseListener() {\n    @Override\n    public void onConsumeResponse(BillingResult\
  \ billingResult,\n            @NonNull String purchaseToken) {\n        if (billingResult.getResponseCode()\
  \ ==\n                BillingClient.BillingResponseCode.OK) {\n            // 购买消耗成功\n\
  \        }\n    }\n};\n\nbillingClient.consumeAsync(consumeParams, listener);\n\
  ```\n\n## 74.8 查询之前的购买\n\n在处理内应用计费时，检查用户是否已经购买了某个产品或订阅是一项常见需求。通过调用 `BillingClient`\
  \ 实例的 `queryPurchasesAsync()` 方法并实现 `PurchaseResponseListener`，可以生成用户之前购买特定类型项目的列表。例如，以下代码获取了所有尚未消耗的之前购买的项目列表：\n\
  \n```java\nQueryPurchasesParams queryPurchasesParams =\n    QueryPurchasesParams.newBuilder()\n\
  \        .setProductType(BillingClient.ProductType.INAPP)\n        .build();\n\n\
  billingClient.queryPurchasesAsync(queryPurchasesParams,\n    new PurchasesResponseListener()\
  \ {\n        @Override\n        public void onQueryPurchasesResponse(@NonNull BillingResult\
  \ billingResult,\n                @NonNull List list) {\n            // 处理购买列表\n\
  \        }\n    });\n```\n\n要获取活跃订阅的列表，请将 `ProductType` 值从 `INAPP` 更改为 `SUBS`。\n\
  \n或者，要获取每个产品最近的购买列表，请调用 `BillingClient` 的 `queryPurchaseHistoryAsync()` 方法：\n\n\
  ```java\nQueryPurchaseHistoryParams queryPurchaseHistoryParams =\n    QueryPurchaseHistoryParams.newBuilder()\n\
  \        .setProductType(BillingClient.ProductType.INAPP)\n        .build();\n\n\
  billingClient.queryPurchaseHistoryAsync(queryPurchaseHistoryParams,\n    new PurchaseHistoryResponseListener()\
  \ {\n        @Override\n        public void onPurchaseHistoryResponse(@NonNull BillingResult\
  \ billingResult,\n                @NonNull List list) {\n            // 处理购买历史\n\
  \        }\n    });\n```\n\n## 74.9 总结\n\n内应用购买通过向用户出售虚拟产品和订阅，提供了一种从 Android 应用内部产生收入的方式。本章探讨了托管商品和订阅，并解释了消耗性产品和非消耗性产品之间的区别。使用\
  \ Google Play 内应用计费库为应用添加内应用购买支持。这涉及创建和初始化结算客户端，并调用其方法来执行诸如购买、列出可用产品和消耗现有购买等任务。下一章将包含一个教程，演示如何在\
  \ Android Studio 项目中添加内应用购买。\n\n## 75. Android 内应用购买教程\n\n在上一章中，我们探索了如何将内应用购买集成到\
  \ Android 项目中，并查看了一些在开发自己的项目时可以使用代码示例。本章将通过创建一个示例项目将这些理论付诸实践，演示如何向 Android 应用添加消耗性内应用产品。该教程还将展示如何在\
  \ Google Play 控制台中添加和管理内应用产品，并解释如何启用测试支付，以便在测试期间可以在无需花费真实资金的情况下进行购买。\n\n## 75.1\
  \ 关于内应用购买示例项目\n\n该项目的简单概念是：在一个应用中，点击按钮之前必须购买内应用产品。该内应用产品在每次点击按钮时都会被消耗，要求用户每次想要点击按钮时都重新购买该产品。初始化时，应用将连接到应用商店，获取产品详情并显示产品名称。一旦应用确认产品可用，购买按钮将启用，点击后将执行购买流程。购买完成后，第二个按钮将启用，用户可以点击它并消耗购买。\n\
  \n## 75.2 创建 InAppPurchase 项目\n\n此练习的第一步是创建一个新项目。启动 Android Studio 并在欢迎界面上选择“New\
  \ Project”（新建项目）。在新项目对话框中，点击“Next”（下一步）之前选择“Empty Activity”模板。\n\n在“Name”（名称）字段中输入\
  \ `InAppPurchase`，并指定在 Google Play 生态系统中唯一标识你的应用的包名（例如 `com.InAppPurchase`）。在点击“Finish”（完成）按钮之前，将“Minimum\
  \ API level”（最低 API 级别）设置为 API 26: Android 8.0 (Oreo)，并将“Language”（语言）菜单设置为 Java。项目创建后，使用第\
  \ 12.8 节“Migrating a Project to View Binding”中概述的步骤将项目转换为 view binding。\n\n## 75.3\
  \ 向项目添加库\n\n在编写代码之前，必须在项目构建配置中添加一些库，包括标准的 Android 结算库。在项目的后续部分，我们还需要使用 `ImmutableList`\
  \ 类，它是 Google Guava Core Java 库的一部分。编辑版本目录（Gradle Scripts -> libs.versions.toml）并添加以下内容：\n\
  \n```toml\n[versions]\nbilling = \"7.0.0\"\ngauvaJre = \"32.0.1-jre\"\ngauvaAndroid\
  \ = \"32.0.1-android\"\n\n[libraries]\nbillingclient = { group = \"com.android.billingclient\"\
  , name = \"billing\", version.ref = \"billing\" }\nguava-jre = { group = \"com.google.guava\"\
  , name=\"guava\", version.ref = \"gauvaJre\"}\nguava-android = { group = \"com.google.guava\"\
  , name=\"guava\", version.ref = \"gauvaAndroid\"}\n```\n\n进行更改后，点击编辑器顶部的“Sync Now”（立即同步）链接，然后如下修改\
  \ Gradle Scripts -> `build.gradle.kts (Module: app)` 文件：\n\n```kotlin\ndependencies\
  \ {\n    implementation(libs.billingclient)\n    implementation(libs.guava.jre)\n\
  \    implementation(libs.guava.android)\n}\n```\n\n再次点击编辑器顶部的“Sync Now”链接以提交这些更改。\n\
  \n\n\n\n用户界面将由现有的 `TextView` 和两个 `Buttons` 组成。将 `activity_main.xml` 文件加载到编辑器中，将两个\
  \ `Button` 视图拖放到布局中，使其中一个位于 `TextView` 上方，另一个位于下方。选择 `TextView`并将 `id` 属性更改为 `statusText`。\n\
  \n点击工具栏上的 `Clear all Constraints`（清除所有约束）按钮，并按住 Shift 点击所有三个视图。右键点击最顶部的 `Button`\
  \ 视图，选择 `Center -> Horizontally in Parent`（居中 -> 水父水平）菜单选项。再次重复此步骤，选择 `Chains ->\
  \ Create Vertical Chain`（链 -> 创建垂直链）。更改顶部按钮的 `text` 属性显示为“Consume Purchase”，并将 `id`\
  \ 更改为 `consumeButton`。此外，配置 `onClick` 属性调用名为 `consumePurchase` 的方法。\n\n选择底部的按钮并重复上述步骤，将\
  \ `text` 设置为“Buy Product”，`id` 设置为 `buyButton`，并将 `onClick` 回调设置为 `makePurchase`。完成后，布局应与图\
  \ 75-1 所示一致：\n\n![image-4CSTHC6W.jpg](img/image-4CSTHC6W.jpeg)\n\n图 75-1\n\n## 75.5\
  \ 将应用添加到 Google Play 商店\n\n使用“创建、测试和上传 Android App Bundle”（Creating, Testing, and\
  \ Uploading an Android App Bundle）章节概述的步骤，登录 `Play Console`，创建一个应用并设置一个新的内部测试轨道，包括指定测试人员的电子邮件地址。返回\
  \ Android Studio 并为项目生成签名的发布版 app bundle。一旦生成包文件，将其上传到内部测试轨道并发布进行测试。\n\n现在应用已经在\
  \ Google Play 商店中，我们准备好为项目创建一个应用内商品了。\n\n## 75.6 创建应用内商品\n\n在 `Play Console` 中选中应用，向下滚动左侧面板中的列表直到出现\
  \ `Monetize`（变现）部分。在该部分中，选择 `Products` 下的 `In-app products`（应用内商品）选项，如图 75-2 所示：\n\
  \n![image-4FX361YR.jpg](img/image-4FX361YR.jpeg)\n\n图 75-2\n\n在 `In-app products`\
  \ 页面，点击 `Create product`（创建商品）按钮：\n\n![image-TV7TN6IZ.jpg](img/image-TV7TN6IZ.jpeg)\n\
  \n图 75-3\n\n在新商品屏幕上，在保存新商品之前输入以下信息：\n\n• `Product ID`: `one_button_click`\n• `Name`:\
  \ A Button Click\n• `Description`: 这是一个测试应用内商品，允许按钮被点击一次。\n• `Default price`: 设置为您偏好货币的最低价格。\n\
  \n## 75.7 启用许可测试人员\n\n在对应用内计费进行测试时，在不花费任何资金的情况下进行测试购买是有用的。这可以通过为内部轨道的测试人员启用许可测试来实现。许可测试人员在购买时可以使用测试付款卡，这样他们就不会被收费。\n\
  \n在 `Play Console` 中，返回主界面并选择 `Setup -> License testing`（设置 -> 许可测试）选项：\n\n![image-QI6GZHE1.jpg](img/image-QI6GZHE1.jpeg)\n\
  \n图 75-4\n\n在许可测试测试中，添加为内部测试轨道添加的测试人员，将 `License response` 设置为 `RESPOND_NORMALLY`\
  \ 并保存更改：\n\n![image-QMXK040B.jpg](img/image-QMXK040B.jpeg)\n\n图 75-5\n\n现在应用和应用内商品已经在\
  \ `Play Console` 中设置好，我们可以向项目添加代码了。\n\n## 75.8 初始化计费客户端\n\n编辑 `MainActivity.java`\
  \ 文件并进行以下更改以开始实现应用内购买功能：\n\n```java\n.\n.\nimport androidx.annotation.NonNull;\n\
  import android.util.Log;\nimport com.android.billingclient.api.*;\n.\n.\npublic\
  \ class MainActivity extends AppCompatActivity {\n    private ActivityMainBinding\
  \ binding;\n    private BillingClient billingClient;\n    private ProductDetails\
  \ productDetails;\n    private Purchase purchase;\n    static final String TAG =\
  \ \"InAppPurchaseTag\";\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n       \
  \ billingSetup();\n    }\n\n    private void billingSetup() {\n        billingClient\
  \ = BillingClient.newBuilder(this)\n            .setListener(purchasesUpdatedListener)\n\
  \            .enablePendingPurchases(\n                PendingPurchasesParams.newBuilder()\n\
  \                .enableOneTimeProducts().build()\n            )\n            .build();\n\
  \        billingClient.startConnection(new BillingClientStateListener() {\n    \
  \        @Override\n            public void onBillingSetupFinished(@NonNull BillingResult\
  \ billingResult) {\n                if (billingResult.getResponseCode() == BillingClient.BillingResponseCode.OK)\
  \ {\n                    Log.i(TAG, \"OnBillingSetupFinish connected\");\n     \
  \               queryProduct();\n                } else {\n                    Log.i(TAG,\
  \ \"OnBillingSetupFinish failed\");\n                }\n            }\n        \
  \    @Override\n            public void onBillingServiceDisconnected() {\n     \
  \           Log.i(TAG, \"OnBillingSetupFinish connection lost\");\n            }\n\
  \        });\n    }\n}\n```\n\n当应用启动时，`onCreate()` 方法现在将调用 `billingSetup()`，它反过来创建一个新的计费客户端实例并尝试连接到\
  \ Google Play 计费库。连接尝试完成后将调用 `onBillingSetupFinished()` 监听器并并指示连接尝试成功或失败的 Logcat\
  \ 消息。最后，我们还实现了 `onBillingServiceDisconnected()` 回调，如果 Google Play 计费库连接丢失，该回调将被调用。\n\
  \n如果连接成功，将调用 `queryProduct()`。必须添加此方法以及分配给计费客户端的 `purchasesUpdatedListener`。\n\n\
  ## 75.9 查询商品\n\n为了确保商品可以购买，我们需要创建一个 `ProductDetailsParams` 实例，并配置在 Play Console\
  \ 中指定的商品 ID，然后将其传递给客户端的 `queryDetailsAsync()` 方法。这要求我们添加 `ProductDetailsResponse()`\
  \ 回调，在其中我们将检查商品是否存在、名称，并将其显示在状态 `TextView` 上。现在我们获取了商品详情，也可以也可以安全地启用购买按钮。在 `MainActivity.`\
  \ 文件中，添加 `queryProduct()` 方法，其内容如下：\n\n```java\n.\n.\nimport com.google.common.collect.ImmutableList;\n\
  import java.util.List;\n\nprivate void queryProduct() {\n    QueryProductDetailsParams\
  \ queryDetailsParams = QueryProductDetailsParams.newBuilder()\n        .setProductList(ImmutableList.of(\n\
  \            ProductDetailsParams.newBuilder()\n            .setProductId(\"one_button_click\"\
  )\n            .setProductType(BillingClient.ProductType.INAPP)\n            .build()))\n\
  \        .build();\n    billingClient.queryProductDetailsAsync(\n        queryDetailsParams,\n\
  \        new ProductDetailsResponseListener() {\n            public void onProductDetailsResponse(@NonNull\
  \ BillingResult billingResult, @NonNull List productDetailsList) {\n           \
  \     if (!productDetailsList.isEmpty()) {\n                    productDetails =\
  \ productDetailsList.get(0);\n                    runOnUiThread(() -> {\n      \
  \                  binding.buyButton.setEnabled(true);\n                       \
  \ binding.statusText.setText(productDetails.getName());\n                    });\n\
  \                } else {\n                    Log.i(TAG, \"onProductDetailsResponse:\
  \ No products\");\n                }\n            }\n        }\n    );\n}\n```\n\
  \n这里的很多代码非常熟悉。监听器代码检查至少有一个商品符合查询条件。然后从第一个匹配的商品中提取 `ProductDetails` 对象，将其存储在 `productDetails`\
  \ 变量中，并将名称属性显示在 `TextView` 上。\n\n需要注意的是，当我们将商品名称显示在状态 `TextView` 上时，是通过调用 `runOnUiThread()`\
  \ 实现的。这是必要的，因为监听器不在主线程上运行，所以它无法安全地直接更改用户界面。`runOnUiThread()` 方法提供了一种无需使用协程在主线程执行代码的方法。\n\
  \n## 75.10 启动购买流程\n\n当用户点击购买按钮时，将调用 `makePurchase()` 来启动购买流程。现在我们可以按如下方式添加此方法：\n\
  \n```java\npublic void makePurchase(View view) {\n    BillingFlowParams billingFlowParams\
  \ = BillingFlowParams.newBuilder()\n        .setProductDetailsParamsList(\n```\n\
  \n\n\n\n```java\nImmutableList.of(\n    BillingFlowParams.ProductDetailsParams.newBuilder()\n\
  \        .setProductDetails(productDetails)\n        .build()\n)\n.build();\n\n\
  billingClient.launchBillingFlow(this, billingFlowParams);\n}\n```\n\n## 75.11 处理购买更新\n\
  \n购买过程的结果将通过初始化阶段分配给 `billingClient` 的 `PurchaseUpdatedListener` 报告给应用。现在按照以下方式添加此处理器：\n\
  \n```java\nprivate final PurchasesUpdatedListener purchasesUpdatedListener = new\
  \ PurchasesUpdatedListener() {\n    @Override\n    public void onPurchasesUpdated(BillingResult\
  \ billingResult, List purchases) {\n        if (billingResult.getResponseCode()\
  \ == BillingClient.BillingResponseCode.OK && purchases != null) {\n            for\
  \ (Purchase purchase : purchases) {\n                completePurchase(purchase);\n\
  \            }\n        } else if (billingResult.getResponseCode() == BillingClient.BillingResponseCode.USER_CANCELED)\
  \ {\n            Log.i(TAG, \"onPurchasesUpdated: Purchase Canceled\");\n      \
  \  } else {\n            Log.i(TAG, \"onPurchasesUpdated: Error\");\n        }\n\
  \    }\n};\n```\n\n如果用户取消购买或发生其他错误，处理器将输出日志消息。然而，成功的购买将导致调用 `completePurchase()`\
  \ 方法，并向其传递当前的 `Purchase` 对象。按照下文添加此方法：\n\n```java\nprivate void completePurchase(Purchase\
  \ item) {\n    purchase = item;\n    if (purchase.getPurchaseState() == Purchase.PurchaseState.PURCHASED)\
  \ {\n        runOnUiThread(() -> {\n            binding.consumeButton.setEnabled(true);\n\
  \            binding.statusText.setText(\"Purchase Complete\");\n        });\n \
  \   }\n}\n```\n\n该方法在验证产品确实已购买且支付仍处于挂起状态之前存储了该购买。此时，“消耗”按钮被启用，并通知用户购买成功。同时，购买按钮也被禁用，以防止用户在消耗购买之前重复购买。\n\
  \n## 75.12 消耗产品\n\n现在用户可以点击“消耗”按钮了，下一步是确保产品已被消耗，这样在购买另一个按钮点击之前，只能执行一次点击。这需要我们现在编写\
  \ `consumePurchase()` 方法：\n\n```java\npublic void consumePurchase(View view) {\n\
  \    ConsumeParams consumeParams = ConsumeParams.newBuilder()\n        .setPurchaseToken(purchase.getPurchaseToken())\n\
  \        .build();\n    ConsumeResponseListener listener = new ConsumeResponseListener()\
  \ {\n        @Override\n        public void onConsumeResponse(BillingResult billingResult,\
  \ @NonNull String purchaseToken) {\n            if (billingResult.getResponseCode()\
  \ == BillingClient.BillingResponseCode.OK) {\n                runOnUiThread(() ->\
  \ {\n                    binding.consumeButton.setEnabled(false);\n            \
  \        binding.statusText.setText(\"Purchase consumed\");\n                });\n\
  \            }\n        }\n    };\n    billingClient.consumeAsync(consumeParams,\
  \ listener);\n}\n```\n\n此方法创建了一个 `ConsumeParams` 实例，并配置当前购买的购买令牌（从之前在 `completePurchase()`\
  \ 方法中保存的 `Purchase` 对象获取）。它被传递给 `consumePurchase()` 方法，该方法在带有 `IO` 调度器的协程中启动。如果成功成功消耗，将在主线程执行代码以禁用消耗按钮、启用购买按钮并更新状态文本。\n\
  \n## 75.13 恢复之前的购买\n\n通过目前为止添加的代码，我们可以在单个会话中购买并消耗产品。如果我们在购买后并在消耗之前退出应用，那么购买记录在应用重启时将会丢失。我们可以通过配置\
  \ `QueryPurchasesParams` 实例来搜索未消耗的应用内产品，并将其传递给 `billingClient` 的 `queryPurchasesAsync()`\
  \ 方法，同时带上一个将在结果时调用的监听器引用。按照以下方式在 `MainActivity.java` 文件中添加新函数和监听器：\n\n```java\n\
  private void reloadPurchase() {\n    QueryPurchasesParams queryPurchasesParams =\
  \ QueryPurchasesParams.newBuilder()\n        .setProductType(BillingClient.ProductType.INAPP)\n\
  \        .build();\n    billingClient.queryPurchasesAsync(queryPurchasesParams,\
  \ purchasesListener);\n}\n\nprivate final PurchasesResponseListener purchasesListener\
  \ = new PurchasesResponseListener() {\n    @Override\n    public void onQueryPurchasesResponse(@NonNull\
  \ BillingResult billingResult, @NonNull List list) {\n        if (!list.isEmpty())\
  \ {\n            purchase = list.get(0);\n            binding.consumeButton.setEnabled(true);\n\
  \        } else {\n            binding.consumeButton.setEnabled(false);\n      \
  \  }\n    }\n};\n```\n\n如果传递给监听器的购买列表不为空，则将列表中的第一个购买赋值给 `purchase` 变量并启用消耗按钮（在更完整的实现中，应该添加代码通过比较产品\
  \ ID 来检查这是正确的产品，并处理多个购买的返回）。如果没有找到购买，则消耗按钮将被禁用，直到再次进行购买。剩下的工作是在计费设置过程中按如下调用我们新的\
  \ `reloadPurchase()` 方法：\n\n```java\nprivate void billingSetup() {\n    // ...\n\
  \    if (billingResult.getResponseCode() == BillingClient.BillingResponseCode.OK)\
  \ {\n        Log.i(TAG, \"OnBillingSetupFinish connected\");\n        queryProduct();\n\
  \        reloadPurchase();\n    } else {\n        Log.i(TAG, \"OnBillingSetupFinish\
  \ failed\");\n    }\n    // ...\n}\n```\n\n## 75.14 测试应用\n\n在测试应用之前，我们需要将此最新版本上传到\
  \ Play Console。由于我们已经上传了版本 1，因此需要在 `build.gradle.kts` (Module: app) 文件中增加版本号：\n\n\
  ```kotlin\n// ...\ndefaultConfig {\n    applicationId \"com.ebookfrenzy.inapppurchase\"\
  \n    minSdk 26\n    targetSdk 32\n    versionCode 2\n    versionName \"2.0\"\n\
  }\n// ...\n```\n\n\n\n\n\n请注意，只要你保持模块级 `build.gradle.kts` 文件中的应用版本号不变，你现在应该能够直接在设备或模拟器上运行修改后的应用，而无需重新打包并上传到控制台。\n\
  \n如果没有列出测试付款卡，请确保设备用户账户已添加到许可测试人员列表中。如果应用正在实实体设备上运行，请尝试在模拟器上运行。如果其他所有方法都失败了，你可以输入有效的支付方式进行测试购买，然后通过从\
  \ Play 控制台主页访问的订单管理界面来为自己退款。\n\n## 75.16 总结\n\n在本章中，我们创建了一个项目，演示了如何在 Android 应用中添加应用内产品。这包括在\
  \ Google Play 控制台中创建该产品，以及编写代码来初始化并连接到计费客户端、查询可用产品、以及购买和消耗产品。我们还解释了如何使用 Play 控制台添加许可测试人员，以便在测试期间无需付费即可进行购买。\n\
  \n## 76. 在 Android 上创建和管理溢出菜单\n\n用户界面设计中一个书中尚未涵盖的领域是 Android 应用程序中的菜单概念。菜单提供了一种机制，用于在界面布局中的视图组件之外为用户提供额外的选择。虽然\
  \ Android 开发者可以使用几种不同的菜单系统，但本章将重点关注更常用的溢出菜单（Overflow menu）。本章将涵盖如何通过 XML 手动创建菜单，以及如何使用\
  \ Android Studio 布局编辑器工具可视化创建。\n\n## 76.1 溢出菜单\n\n溢出菜单（也称为选项菜单）是用户可以从设备屏幕访问的菜单，它允许开发者在应用程序用户界面之外包含其他应用程序选项。溢出菜单的位置取决于设备上运行的\
  \ Android 版本。从 Android 4.0 及更高版本开始，溢出菜单按钮位于右上角（图 76-1），由三个正方形堆叠的图标表示的操作工具栏中：\n\n\
  ![image-8M2ZG21O.jpg](img/image-8M2ZG21O.jpeg)\n\n图 76-1\n\n## 76.2 创建溢出菜单\n\n菜单中的项可以在\
  \ XML 文件中声明，然后根据需要将其填充（inflate）并显示给用户。这涉及使用 `menu` 元素，该元素包含每个每个菜单项的子元素。例如，下面的 XML\
  \ 定义了一个包含两个与颜色选择相关的菜单项的菜单：\n\n```xml\nxmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \nxmlns:tools=\"http://schemas.android.com/tools\"\ntools:context=\".MainActivity\"\
  \ >\n    <item\n        android:id=\"@+id/menu_red\"\n        android:orderInCategory=\"\
  1\"\n        app:showAsAction=\"never\"\n        android:title=\"@string/red_string\"\
  />\n    <item\n        android:id=\"@+id/menu_green\"\n        android:orderInCategory=\"\
  2\"\n        app:showAsAction=\"never\"\n        android:title=\"@string/green_string\"\
  />\n</menu>\n```\n\n在上面的 XML 中，`android:orderInCategory` 属性决定了菜单项显示时在菜单中出现的顺序。另一方面，`app:showAsAction`\
  \ 属性控制了相应的项作为操作栏本身中的项出现的条件。例如，如果设置为 `ifRoom`，当空间足够时，该项将出现在操作栏中。图 76-2 显示了对两个菜单项都将此属性设置为\
  \ `ifRoom` 的效果：\n\n![image-1YHLACJ2.jpg](img/image-1YHLACJ2.jpeg)\n\n图 76-2\n\n\
  应节慎使用此属性，以避免操作栏过于拥挤。\n\n默认情况下，当创建新的 Android 应用项目时，Android Studio 会创建一个菜单 XML 文件。该文件位于\
  \ `app -> res -> menu` 项目文件夹，并包含一个名为“Settings”的单个菜单项：\n\n```xml\nxmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \nxmlns:tools=\"http://schemas.android.com/tools\"\ntools:context=\".MainActivity\"\
  >\n    <item\n        android:title=\"@string/action_settings\"\n        android:orderInCategory=\"\
  100\"\n        app:showAsAction=\"never\" />\n</menu>\n```\n\n此菜单已配置为在当应用运行时，用户在用户界面上选择溢出菜单时显示，因此只需修改这一个项以满足你的需求即可。\n\
  \n## 76.3 显示溢出菜单\n\n溢出菜单是通过重写对应 Activity 的 `onCreateOptionsMenu()` 方法然后填充菜单的 XML\
  \ 文件创建的。例如，以下代码创建了名为 `menu_main` 的菜单 XML 文件中包含的菜单：\n\n```java\n@Override\npublic\
  \ boolean onCreateOptionsMenu(Menu menu) {\n    getMenuInflater().inflate(R.menu.menu_main,\
  \ menu);\n    return true;\n}\n```\n\n与菜单 XML 文件一样，Android Studio 在新创建的 Android\
  \ 应用项目的主 Activity 中已经重写了此方法。如果你的 Activity 不需要溢出菜单，请删除或注释掉此方法。\n\n## 76.4 响应菜单项选择\n\
  \n一旦实现了菜单，问题就随之而来：当用户选择菜单项时，应用程序如何接收通知。Activity 接收菜单选择通知需要做的一切就是重写 `onOptionsItemSelected()`\
  \ 方法。作为此方法的参数传递的是选中菜单项的引用。然后可以调用项的 `getItemId()` 方法来获取 ID，并用于识别选中了哪个项。例如：\n\n```java\n\
  @Override\npublic boolean onOptionsItemSelected(MenuItem item) {\n    if (id ==\
  \ R.id.menu_red) {\n        // 红色项被选中\n    } else if (id == R.id.menu_green) {\n\
  \        // 绿色项被选中\n    } else {\n        return super.onOptionsItemSelected(item);\n\
  \    }\n    return true;\n}\n```\n\n## 76.5 创建可检查项组\n\n除了配置独立的菜单项外，还可以创建菜单项组。这在创建可检查菜单项时特别有用，可以在任何时候选择一组项中的一个。通过使用\
  \ `group` 标签将菜单项分配给组。使用 `android:checkableBehavior` 将组声明为可检查，将其设置为 `single`、`all`\
  \ 或 `none`。下面的 XML 声明了两个菜单项组成一个组，其中可以选择一个：\n\n```xml\nxmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \nandroid:checkableBehavior=\"single\">\n    <item\n        android:id=\"@+id/menu_red\"\
  \n        android:title=\"@string/red_string\"/>\n    <item\n        android:id=\"\
  @+id/menu_green\"\n        android:title=\"@string/green_string\"/>\n</group>\n\
  ```\n\n当菜单组配置为可检查时，菜单项旁边会出现一个小圆圈，如图 76-3 所示。需要注意的是，该指示器的设置和取消不会自动发生。因此，检查和取消菜单项是应用程序的责任。继续本章之前使用的颜色示例，其实现如下：\n\
  \n```java\n@Override\npublic boolean onOptionsItemSelected(MenuItem item) {\n  \
  \  if (id == R.id.menu_red) {\n        item.setChecked(!item.isChecked());\n   \
  \     mainLayout.setBackgroundColor(android.graphics.Color.RED);\n    } else if\
  \ (id == R.id.menu_green) {\n        item.setChecked(!item.isChecked());\n     \
  \   mainLayout.setBackgroundColor(android.graphics.Color.GREEN);\n    } else {\n\
  \        return super.onOptionsItemSelected(item);\n    }\n    return true;\n}\n\
  ```\n\n## 76.6 菜单与 Android Studio 菜单编辑器\n\nAndroid Studio 允许通过简单将菜单资源文件加载到菜单编辑器工具中、从调板板拖放菜单元素并设置属性来可视化地设计菜单。这极大地减轻了菜单设计过程，但重要的是，仍然需要在\
  \ `onOptionsItemSelected()` 方法中编写代码来实现菜单行为。\n\n\n\n\n\n要视觉可视化设计菜单，请找到菜单资源文件并双击它将其加载到\
  \ `Menu Editor` 工具中。例如，图 76-4 显示了在设计模式下加载到 `Menu Editor` 的基础 Activity 默认菜单资源文件：\n\
  \n![image-3GGKWCQV.jpg](img/image-3GGKWCQV.jpeg)\n\n图 76-4\n\n调色板（`A`）包含可以添加到设计区域（`C`）菜单中的项目。`Component\
  \ Tree`（组件树）（`B`）是识别菜单层级结构的有用工具。`Attributes`（属性）面板（`D`）包含了当前选中项目的常用属性子集。\n\n可以通过将对象拖放到布局画布上或\
  \ `Component Tree`（组件树）上向菜单中添加新元素。在 `Layout Editor`（布局编辑器）工具中处理菜单时，有时将项目丢弃到 `Component\
  \ Tree`（组件树）上会更简单，因为这可以对项目在树中的放置位置提供更大的控制。这在向组组添加项目等情况下特别有用。\n\n尽管 `Menu Editor`\
  \ 提供了一种可视化的菜单构建方法，但底层的菜单仍然以 XML 格式存储，可以通过上方图中标记为 `F` 的标签页从 `Design`（设计）模式切换到 `Code`（代码）模式手动查看和编辑。\n\
  \n## 76.7 创建示例项目\n\n要查看溢出菜单的用法，点击欢迎屏幕上的 `New Project`（新建项目）按钮，并在生成的新项目对话框中，点击 `Next`（下一步）按钮之前选择\
  \ `Basic Views Activity` 模板。\n\n在 `Name` 字段中输入 `MenuExample` 并指定 `com.ebookfrenzy.menuexample`\
  \ 为包名。在点击 `Finish`（完成）按钮之前，将 `Minimum API level`（最低 API 级别）设置为 `API 26`：Android\
  \ 8.0 (Oreo)，并将 `Language`（语言）菜单设置为 `Java`。\n\n项目创建完成后，在 `Project` 工具窗口中导航到 `app\
  \ -> res -> layout` 文件夹，双击 `content_main.xml` 文件将其加载到 `Android Studio Menu Editor`\
  \ 工具中。将工具切换到 `Design`（设计）模式，从 `Component Tree`（组件树）面板中选择 `ConstraintLayout`，并在 `Attributes`（属性）面板的\
  \ `ID` 字段中输入 `layoutView`。\n\n## 76.8 设计菜单\n\n在 `Project` 工具窗口中，找到项目的 `app -> res\
  \ -> menu -> menu_main.xml` 文件并双击将其加载到 `Layout Editor` 工具中。必要时切换到 `Design`（设计）模式，并选择删除\
  \ Android Studio 添加的默认 `Settings` 菜单项，使菜单当前为空。\n\n从调色板中，点击并拖动菜单组对象到布局画布的标题栏上，如图\
  \ 76-5 所示：\n\n![image-WOEXJJV3.jpg](img/image-WOEXJJV3.jpeg)\n\n图 76-5\n\n虽然组项已添加，但它在布局中是不可见的。要验证该元素是否存在，请参考\
  \ `Component Tree`（组件树）面板，该组将列为菜单的子项：\n\n![image-4L46EP13.jpg](img/image-4L46EP13.jpeg)\n\
  \n图 76-6\n\n在 `Component Tree`（组件树）中选择组项，并参考 `Attributes`（属性）面板，将 `checkableBehavior`\
  \ 属性设置为 `single`，这样在任何时候只能选择一个组菜单项：\n\n![image-KAITK2WP.jpg](img/image-KAITK2WP.jpeg)\n\
  \n图 76-7\n\n接下来，从调色板中拖四个 `Menu Item`（菜单项）元素并将其丢到 `Component Tree`（组件树）中的组元素上。选择第一个项目并使用\
  \ `Attributes`（属性）面板将标题更改为“Red”，并将 `ID` 改为 `menu_red`：\n\n![image-VC2748N6.jpg](img/image-VC2748N6.jpeg)\n\
  \n图 76-8\n\n对剩余三个菜单项重复这些步骤，将标题分别设置为“Green”、“Yellow”和“Blue”，并设置相应的 ID `menu_green`、`menu_yellow`\
  \ 和 `menu_blue`。使用 `Component Tree`（组件树）面板中菜单项右侧的警告按钮将字符串提取到资源中：\n\n![image-EPC1JRFX.jpg](img/image-EPC1JRFX.jpeg)\n\
  \n图 76-9\n\n完成这些步骤后，菜单布局应与下方图 76-10 所示：\n\n![image-8ROIH4A2.jpg](img/image-8ROIH4A2.jpeg)\n\
  \n图 76-10\n\n将 `Layout Editor`（布局编辑器）工具切换到 `Code`（代码）模式并检查菜单的 XML 表示，它应该与以下列表匹配：\n\
  \n```xml\nxmlns:app=\"http://schemas.android.com/apk/res-auto\"\nxmlns:tools=\"\
  http://schemas.android.com/tools\"\ntools:context=\"com.ebookfrenzy.menuexample.MainActivity\"\
  >\nandroid:id=\"@+id/menu_red\" />\nandroid:id=\"@+id/menu_green\" />\nandroid:id=\"\
  @+id/menu_yellow\" />\nandroid:id=\"@+id/menu_blue\" />\n```\n\n## 76.9 修改 onOptionsItemSelected()\
  \ 方法\n\n当从菜单选择项目时，应用程序 Activity 中重写的 `onOptionsItemSelected()` 方法将被调用。该方法的作用是识别选择了哪个项目并更改布局。找到\
  \ `app -> java -> com.ebookfrenzy.menuexample -> MainActivity` 文件并进行如下修改：\n\n```java\n\
  package com.ebookfrenzy.menuexample;\n\n.\n\nimport androidx.constraintlayout.widget.ConstraintLayout;\n\
  \npublic class MainActivity extends AppCompatActivity {\n.\n.\npublic boolean onOptionsItemSelected(MenuItem\
  \ item) {\n    int id = item.getItemId();\n    ConstraintLayout mainLayout = findViewById(R.id.layoutView);\n\
  \    if (id == R.id.menu_red) {\n        item.setChecked(!item.isChecked());\n \
  \       mainLayout.setBackgroundColor(android.graphics.Color.RED);\n    } else if\
  \ (id == R.id.menu_green) {\n        item.setChecked(!item.isChecked());\n     \
  \   mainLayout.setBackgroundColor(android.graphics.Color.GREEN);\n    } else if\
  \ (id == R.id.menu_yellow) {\n        item.setChecked(!item.isChecked());\n    \
  \    mainLayout.setBackgroundColor(android.graphics.Color.YELLOW);\n    } else if\
  \ (id == R.id.menu_blue) {\n        item.setChecked(!item.isChecked());\n      \
  \  mainLayout.setBackgroundColor(android.graphics.Color.BLUE);\n    } else {\n \
  \       return super.onOptionsItemSelected(item);\n    }\n    return true;\n}\n\
  .\n.\n```\n\n## 76.10 测试应用程序\n\n在模拟器或物理设备上构建并运行应用程序。使用溢出菜单选择菜单项，并验证布局颜色发生变化。注意当前选中的颜色会在菜单中显示：\n\
  \n![image-HFASBMHU.jpg](img/image-HFASBMHU.jpeg)\n\n图 76-11\n\n## 76.11 总结\n\n溢出菜单通过运行应用程序时顶部操作栏的最右侧访问。该菜单为应用程序提供了额外的选项位置。\n\
  \n菜单结构最易在 XML 文件中定义，应用程序通过重写和实现 `onOptionsItemSelected()` 方法来接收菜单项选择的通知。\n\n## 77.\
  \ Android Studio 主/详情教程\n\n本章将先解释主/详情用户界面设计概念，然后详细探讨 Android Studio 包含的主/详情流程模板的元素。随后，将创建一个示例应用程序，演示修改模板以满足应用程序开发者特定需求的步骤。\n\
  \n## 77.1 主/详情流程\n\n主/详情流程是一种界面设计概念，其中向用户显示项目列表（称为主列表）。当选择列表中的某项时，与该项目相关的额外信息将在详情格中呈现给用户。例如，电子邮件应用程序可能包含一个接收消息的主列表，其中包含发送者地址和消息主题。当从主列表中选择某条消息时，电子邮件正文将出现在详情格中。\n\
  \n\n\n\n在平板板尺寸的 Android 设备屏幕横屏模式下，主列表显示在屏幕左侧的狭窄垂直面板中。显示器的其余部分用于详情窗格，这种布局被称为“双窗格模式”（two-pane\
  \ mode）。例如，图 77-1 显示了主列表/详情的双窗格布局，其中列出了主项目，并在详情窗格中显示了第一个项目的内容：\n\n![image-P4GBQ0YR.jpg](img/image-P4GBQ0YR.jpeg)\n\
  \n图 77-1\n\n在较小的手机尺寸 Android 设备上，主列表占据整个屏幕，而详情窗格显示在独立的屏幕上，当用户从主列表中进行选择时该屏幕就会出现。在这种模式下，详情界面包含一个用于返回主列表的操作栏（action\
  \ bar）条目。例如，图 77-2 展示了在 4 英寸手机屏幕上同一项目列表的主界面和详情界面：\n\n![image-QAWSJC73.jpg](img/image-QAWSJC73.jpeg)\n\
  \n图 77-2\n\n## 77.2 创建主列表/详情流 Activity\n\n在本章的下一节中，将详细介绍组成主列表/详情流（Primary/Detail\
  \ Flow）模板的不同元素。实现此点的最佳方法是使用 Primary/Detail Views Flow 模板创建一个项目并在学习信息时使用它。该项目随后将作为章节末尾教程的基础。\n\
  \n从欢迎界面选择 `New Project`（新建项目）选项，在出现的新项目对话框中，点击 `Next`（下一步）按钮之前选择 `No Activity` 模板。\n\
  \n在 `Name` 字段输入 `PrimaryDetailFlow`，并指定 `com.ebookfrenzy.primarydetailflow` 为包名。在点击\
  \ `Finish`（完成）按钮之前，将 `Minimum API level`（最低 API ）设置为 `API 26`：Android 8.0 (Oreo)，并将\
  \ `Language`（语言）菜单设置为 `Java`。\n\n## 77.3 添加主列表/详情流 Activity\n\n在 Project 工具窗口，右键点击\
  \ `app` -> `java` -> `com.ebookfrenzy.primarydetailflow` 项，选择 `New` -> `Activity`\
  \ -> `Primary/Detail Views Flow` 选项。在新 Activity 对话框（图 77-3）中，点击 `Finish` 按钮之前，确保\
  \ `Launcher Activity`（启动 Activity）复选框已启用：\n\n![image-C9OZ5Z3R.jpg](img/image-C9OZ5Z3R.jpeg)\n\
  \n图 77-3\n\n## 77.4 修改主列表/详情流模板\n\n虽然主列表/详情流模板的结构初看起来可能令人困惑，但事实证明，对于许多主列表/详情实现需求，模板提供的大部分功能可以保持不变。\n\
  \n在本章的剩余部分，将修改 `PrimaryDetailFlow` 项目，使主列表显示网站名称列表，并将详情窗格更改为包含一个 `WebView` 对象而不是当前的\
  \ `TextView`。当用户选择某个网站时，相应的网页随后将在详情窗格中加载并显示。\n\n## 77.5 更改内容模型\n\n目前示例的内由 `PlaceholderContent`\
  \ 类文件定义。因此，首先选择 `PlaceholderContent.java` 文件（位于 Project 工具窗口的 `app` -> `java` ->\
  \ `com.ebookfrenzy.primarydetailflow` -> `placeholder` 文件夹中）并查看代码。文件底部是一个名为 `PlaceholderItem`\
  \ 的类的声明，它目前能够存储三个 `String` 对象，分别代表内容、详情字符串和 ID。另一方面，更新后的项目需要每个项目对象包含一个 `ID` 字符串、一个网站名称的字符串以及一个对应网站\
  \ URL 的字符串。为了添加这些功能，请修改 `PlaceholderItem` 类，使其内容如下：\n\n```java\npublic static class\
  \ PlaceholderItem {\n\n    public String id;\n\n    public String website_name;\n\
  \n    public String website_url;\n\n    public PlaceholderItem(String id, String\
  \ website_name,\n    String website_url)\n    {\n        this.id = id;\n       \
  \ this.website_name = website_name;\n        this.website_url = website_url;\n \
  \   }\n\n    @Override\n    public String toString() {\n        return website_name;\n\
  \    }\n}\n```\n\n注意，封装类 `PlaceholderContent` 目前包含一个 `for` 循环，通过通过多次调用名为 `createPlaceholderItem()`\
  \ 和 `makeDetails()` 的方法来添加 25 个项目。这些代码大部分将不再需要，并应如下所示从类中删除：\n\n```java\npublic static\
  \ final Map ITEM_MAP = new HashMap();\n\nprivate static final int COUNT = 25;\n\n\
  static {\n    // 添加一些示例项目。\n    for (int i = 1; i <= COUNT; i++) {\n        addItem(createPlaceholderItem(i));\n\
  \    }\n}\n\nprivate static void addItem(PlaceholderItem item) {\n    ITEMS.add(item);\n\
  \    ITEM_MAP.put(item.id, item);\n}\n\nprivate static PlaceholderItem createPlaceholderItem(int\
  \ position) {\n    return new PlaceholderItem(String.valueOf(position), \"Item \"\
  \ + position, makeDetails(position));\n}\n\nprivate static String makeDetails(int\
  \ position) {\n    StringBuilder builder = new StringBuilder();\n    builder.append(\"\
  Details about Item: \").append(position);\n    for (int i = 0; i < position; i++)\
  \ {\n        builder.append(\"\\nMore details information here.\");\n    }\n   \
  \ return builder.toString();\n}\n```\n\n此代码需要修改以初始化数据：\n\n```java\npublic static\
  \ final Map ITEM_MAP =\nnew HashMap();\n\nstatic {\n    // 添加一些示例项目。\n    addItem(new\
  \ PlaceholderItem(\"1\", \"Payload\",\n    \"https://www.payloadbooks.com\"));\n\
  \    addItem(new PlaceholderItem(\"2\", \"Amazon\",\n    \"https://www.amazon.com\"\
  ));\n    addItem(new PlaceholderItem(\"3\", \"New York Times\",\n    \"https://www.nytimes.com\"\
  ));\n}\n```\n代码现在利用修改后的 `PlaceholderItem` 类来存储 ID、网站名称和 URL。\n\n## 77.6 更改详情界面\n\
  \n详情界面的布局（用户从主列表中选择项目时显示的屏幕）包含在 `activity_detail.xml` 文件中，该文件反过来包含用于显示详情内容的 `FrameContainer`\
  \ 实例。如果应用显示的是单窗格模式，框架容器将显示 `fragment_detail.xml` 中的布局，而多窗格模式将显示 `fragment_detail.xml\
  \ (sw600dp)` 布局。\n\nAndroid Studio 为 `fragment_detail.xml` 提供的模板布局包含一个带有 `app bar`、`toolbar`、`floating\
  \ action button` 和 `text view` 的 `Coordinator` 布局。对于此示例，我们需要的是 `WebView`，因此打开此文件并删除\
  \ `item_detail_container` 视图以外的所有视图。最简单的方法是在 `Component Tree` 中选择所有不需要的视图如下所示，然后按下键盘删除键：\n\
  \n![image-QAWSJC73.jpg](img/image-QAWSJC73.jpeg)\n\n从面板板的 Widgets 部分拖入 `WebView`\
  \ 对象并将其拖到布局画布中心，将 `id` 更改为 `website_detail`。\n\n接下来，编辑 `fragment_detail.xml (sw600dp)`\
  \ 文件并删除默认的 `TextView` 实例，然后将 `WebView` 拖到布局中，再次将 `id` 更改为 `website_detail`。这两个文件的布局现在应该像图\
  \ 77-5：\n\n![image-NVSLATZ8.jpg](img/image-NVSLATZ8.jpeg)\n\n图 77-5\n\n## 77.7 修改\
  \ ItemDetailFragment 类\n\n此时，用户界面详情部分已经过修改，但相应的 Java 类仍然是为操作 `TextView` 对象而不是 `WebView`\
  \ 设计。通过双击 Project 工具窗口中的 `ItemDetailFragment.java` 文件来加载该类的源代码。\n\n为了加载当前选择的项目的网页\
  \ URL，只需要更改几行代码。一旦完成此更改，代码应如下：\n\n```java\n.\n.\nimport android.webkit.WebResourceRequest;\n\
  import android.webkit.WebView;\nimport android.webkit.WebViewClient;\n\n.\n.\npublic\
  \ class ItemDetailFragment extends Fragment {\n\n.\n.\n@Override\npublic View onCreateView(LayoutInflater\
  \ inflater, ViewGroup container,\nBundle savedInstanceState) {\n```\n\n\n\n\n```java\n\
  binding = FragmentItemDetailBinding.inflate(inflater, container, false);\n\nView\
  \ rootView = binding.getRoot();\n\nmToolbarLayout = rootView.findViewById(R.id.toolbar_layout);\n\
  \nmTextView = binding.ItemDetail;\n\nupdateContent();\n\nrootView.setOnDragListener(dragListener);\n\
  \nreturn rootView;\n\n}\n\nprivate void updateContent() {\n    if (mItem != null)\
  \ {\n        binding.websiteDetail.setWebViewClient(new WebViewClient(){\n     \
  \       @Override\n            public boolean shouldOverrideUrlLoading(\n      \
  \          WebView view, WebResourceRequest request) {\n                return super.shouldOverrideUrlLoading(\n\
  \                    view, request);\n            }\n        });\n        binding.websiteDetail.loadUrl(mItem.website_url);\n\
  \    }\n}\n```\n\n在上述代码中，删除了对工具栏布局（toolbar layout）和项目详情文本元素的引用，这些元素之前从 `fragment_item_detail.xml`\
  \ 文件中移除了。\n\n接下来，修改 `updateContent()` 以访问 `website_detail` 视图（它之前是 `TextView`，现在是\
  \ `WebView`），并从所选项目中提取网站 URL。创建了 `WebViewClient` 类的实例并为其分配了 `shouldOverrideUrlLoading()`\
  \ 回调方法。实现该方法是为了强制系统使用 `WebView` 实例加载页面，而不是使用 Chrome 浏览器。\n\n## 77.8 修改 ItemListFragment\
  \ 类\n\n还需要对 `ItemListFragment.java` 文件进行细小的更改，以确保网站名称出现在主列表中。编辑此文件，找到 `onBindViewHolder()`\
  \ 方法，并修改 `setText()` 方法调用，以如下方式引用网站名称：\n\n```java\n@Override\npublic void onBindViewHolder(final\
  \ ViewHolder holder, int position) {\n    holder.mIdView.setText(mValues.get(position).id);\n\
  \    holder.mContentView.setText(mValues.get(position).website_name);\n}\n\n// 识别内容的\
  \ id\nClipData.Item clipItem = new ClipData.Item(mValues.get(position).id);\nClipData\
  \ dragData = new ClipData(\n    ((PlaceholderContent.PlaceholderItem) v.getTag()).website_name,\n\
  \    new String[]{ClipDescription.MIMETYPE_TEXT_PLAIN},\n    clipItem\n);\n```\n\
  \n## 77.9 添加 Manifest 权限\n\n最后一步是通过 manifest 文件为应用程序添加互联网权限。这将允许 `WebView` 对象访问互联网并下载网页。导航到\
  \ Project 工具窗口中的（app -> manifests）并加载 `AndroidManifest.xml` 文件，然后双击它将其加载到编辑器中。加载后，向文件中添加适当的权限行：\n\
  \n```xml\npackage=\"com.ebookfrenzy.PrimaryDetailflow\"\nandroid:allowBackup=\"\
  true\"\n```\n\n## 77.10 运行应用程序\n\n在配置适当的模拟器或已连接的 Android 设备上编译并运行应用程序。根据显示器的大小，应用程序将以小屏或双窗格模式显示。无论如何，主列表都应该预先加载内容模型中定义的三个网站的名称。选择一个项目将导致相应的网站出现在详情窗格中，如图\
  \ 77-6 所示的双窗格模式插图：\n\n![image-QPEQ9ZS5.jpg](img/image-QPEQ9ZS5.jpeg)\n\n图 77-6\n\
  \n## 77.11 总结\n\n主/详情用户界面由主项目列表组成，当选择某项时，会在详情窗格内显示关于该选择的额外信息。主/详情流（Primary/Detail\
  \ Flow）是 Android Studio 提供的模板，允许快速且轻松地创建主/详情布局。正如本章所示，通过对默认模板文件进行微调，就可以以极少的代码和设计工作实现广泛基于主/详情的功能。\n\
  \n## 78. Android 生物识别认证教程\n\n触摸传感器现在已内置在许多 Android 设备中，用于识别用户并提供设备和应用功能的访问权限，例如使用指纹识别的应用内支付选项。指纹识别只是多种认证方法之一，还包括密码、PIN\
  \ 码以及最近的脸部识别。\n\n尽管目前市场上只有少数 Android 设备提供面部识别，但这在未来可能会变得更加常见。考虑到这一点，Google 已经开始从以指纹为核心的添加应用认证的方法转向一种不那么具体的针对性的方法，称为生物识别认证。\n\
  \n本章提供了生物识别认证的概述，并提供了一个详细的、分步演示的教程，展示了在 Android 应用项目中实现生物识别认证的实用方法。\n\n## 78.1 生物识别认证概述\n\
  \n关键生物识别认证组件是 `BiometricPrompt` 类。该类执行了许多在早期 Android 版本中必须通过编写代码才能完成的工作，包括显示标准对话框以引导用户通过认证过程、执行认证并将结果报告给应用。该类还处理了多次失败的认证尝试，并在用户再次尝试之前强制执行超时。\n\
  \n`BiometricPrompt` 类包含一个伴侣 `Builder` 类，可用于配置和创建 `BiometricPrompt` 实例，包括定义要显示在生物识别认证对话框中的文本，以及对对话框中取消按钮（也称为负向按钮）进行自定义。\n\
  \n`BiometricPrompt` 实例还分配了一组认证回调，这些回调将被调用以向应用提供认证操作的结果。还使用了 `CancellationSignal`\
  \ 实例，以允许应用程序在认证进行期间取消认证。\n\n在涵盖这些基础知识后，本章的剩余部分将在示例项目中实现基于指纹的生物识别。\n\n## 78.2 创建生物识别认证项目\n\
  \n从欢迎界面选择 New Project 选项，并在出现的新项目对话框中选择 Empty Views 模板，然后点击 Next 按钮。\n\n在 Name 字段中输入\
  \ `BiometricDemo`，并指定 `com.ebookfrenzy.biometricdemo` 为包名。在点击 Finish 按钮之前，将 Minimum\
  \ API level 设置为 `API 29: Android (Q)` 并 Language 菜单设置为 `Java`。\n\n## 78.3 配置设备指纹认证\n\
  \n指纹认证仅适用于带有触摸传感器的设备，且已采取相应的配置步骤来保护设备并录入指纹。有关配置模拟器测试指纹认证的步骤，请参考“使用和配置 Android Studio\
  \ AVD Emulator”章节。\n\n在物理设备上配置指纹认证：打开 Settings 应用并选择 Security。在 Security 设置屏幕上，选择\
  \ Fingerprint。在启用指纹安全之前，必须配置一种备份屏幕解锁方法（如 PIN）。如果锁屏未加密，请按照步骤配置 PIN、图案或密码安全。\n\n锁屏加密后，继续进入指纹检测屏幕，并在提示时触摸传感器（图\
  \ 78-1），重复此过程以添加更多指纹。\n\n![image-BXX6DY8M.jpg](img/image-BXX6DY8M.jpeg)\n\n图 78-1\n\
  \n78.4 在 Manifest 文件中添加生物识别权限\n\n生物识别认证需要应用程序在项目清单文件中请求 `USE_BIOMETRIC` 权限。在 Android\
  \ Studio Project 工具窗口中，找到并编辑 `app -> manifests -> AndroidManifest.xml` 文件，按如下所示添加权限请求：\n\
  \n```xml\npackage=\"com.ebookfrenzy.biometricdemo\">\n```\n\n\n\n\n\n`android:name=\"\
  android.permission.USE_BIOMETRIC\" />\n\n## 78.5 设计用户界面\n\n为了保持示例尽可能简单，用户界面中唯一的视觉元素将是一个\
  \ `Button` 视图。找到并选择 `activity_main.xml` 布局资源文件，将其加载到 `Layout Editor` 工具中。\n\n删除示例\
  \ `TextView` 对象，从调色板（palette）的 Common（常用）类别拖拖并释放一个 `Button` 对象，将其放置在布局画布的中心。使用 `Attributes`\
  \ 工具窗口，将按钮的 `text` 属性更改为“Authenticate”，并将该字符串提取到资源。最后，配置 `onClick` 属性以调用名为 `authenticateUser`\
  \ 的方法。\n\n完成上述步骤后，布局应与图 78-2 所示：\n\n ![image-7CPFH8V0.jpg](img/image-7CPFH8V0.jpeg)\n\
  \n图 78-2\n\n## 78.6 添加 Toast 便利方法\n\n在本示例的代码各个处，应用程序都将设计为通过 `Toast` 消息向用户显示信息。为了避免多次重复相同的\
  \ `Toast` 代码，将在主活动中添加一个名为 `notifyUser()` 的便利方法。该方法将接受单个 `String` 值并将其作为 `Toast`\
  \ 消息显示给用户。现在编辑 `MainActivity.java` 文件并添加此方法：\n\n```java\nimport android.widget.Toast;\n\
  \nprivate void notifyUser(String message) {\n    Toast.makeText(this, message, Toast.LENGTH_LONG).show();\n\
  }\n```\n\n## 78.7 检查安全设置\n\n在本章前面的部分，已经采取了步骤在测试应用程序的设备或模拟器上配置锁屏并注册了指纹。然而，在应用程序中包含防御性代码以确保在尝试请求指纹识别之前已满足这些要求是非常关重要的。这些步骤将在\
  \ `MainActivity.java` 文件中的 `onCreate` 方法中执行，并使用 `Keyguard` 和 `PackageManager` 管理服务。注意，还添加了代码来验证是否已为应用程序配置了\
  \ `USE_BIOMETRIC` 权限：\n\n```java\npackage com.ebookfrenzy.biometricdemo;\n\nimport\
  \ androidx.appcompat.app.AppCompatActivity;\nimport androidx.core.app.ActivityCompat;\n\
  import android.widget.Toast;\nimport android.Manifest;\nimport android.content.pm.PackageManager;\n\
  import android.app.KeyguardManager;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n \
  \       checkBiometricSupport();\n    }\n\n    private void checkBiometricSupport()\
  \ {\n        KeyguardManager keyguardManager = (KeyguardManager) getSystemService(KEYGUARD_SERVICE);\n\
  \        if (!keyguardManager.isKeyguardSecure()) {\n            notifyUser(\"Lock\
  \ screen security not enabled in Settings\");\n        }\n        if (ActivityCompat.checkSelfPermission(this,\
  \ Manifest.permission.USE_BIOMETRIC) != PackageManager.PERMISSION_GRANTED) {\n \
  \           notifyUser(\"Fingerprint authentication permission not enabled\");\n\
  \        }\n    }\n}\n```\n\n上述代码更改首先使用 `Keyguard` 管理器来验证已配置了备用屏幕解锁方法（也就是说，可以使用\
  \ PIN 或其他身份验证方法作为指纹识别的替代方案来解锁屏幕）。如果锁屏未加密，代码将向用户报告该问题并从方法返回。\n\n然后，该方法会检查用户是否已为应用程序启用了生物识别权限，然后在使用包管理器验证设备上是否存在指纹识别之前进行检查。\n\
  \n## 78.8 配置身份验证回调\n\n当配置生物识别提示对话框时，需要分配一组身份验证回调方法，可以通过这些方法来通知应用程序身份验证过程的成功或失败。这些方法需要封装在\
  \ `BiometricPrompt.AuthenticationCallback` 类实例中。在 `MainActivity.java` 文件中，添加一个方法来创建并返回该类的实例，实现相应的方法：\n\
  \n```java\nimport android.hardware.biometrics.BiometricPrompt;\n\nprivate BiometricPrompt.AuthenticationCallback\
  \ getAuthenticationCallback() {\n    return new BiometricPrompt.AuthenticationCallback()\
  \ {\n        @Override\n        public void onAuthenticationError(int errorCode,\
  \ CharSequence errString) {\n            notifyUser(\"Authentication error: \" +\
  \ errString);\n            super.onAuthenticationError(errorCode, errString);\n\
  \        }\n        @Override\n        public void onAuthenticationHelp(int helpCode,\
  \ CharSequence helpString) {\n            super.onAuthenticationHelp(helpCode, helpString);\n\
  \        }\n        @Override\n        public void onAuthenticationFailed() {\n\
  \            super.onAuthenticationFailed();\n        }\n        @Override\n   \
  \     public void onAuthenticationSucceeded(BiometricPrompt.AuthenticationResult\
  \ result) {\n            notifyUser(\"Authentication Succeeded\");\n           \
  \ super.onAuthenticationSucceeded(result);\n        }\n    };\n}\n```\n\n## 78.9\
  \ 添加取消信号\n\n一旦启动，生物识别认证过程将独立于应用程序执行。为了给应用程序提供取消操作的方法，将创建一个 `CancellationSignal`\
  \ 类实例并将其传递给生物识别认证过程。然后可以使用此 `CancellationSignal` 实例在需要时取消过程。取消信号实例可以配置一个监听器，监听器将在取消完成后被调用。在活动类中添加一个新方法来配置并返回\
  \ `CancellationSignal` 对象：\n\n```java\nimport android.os.CancellationSignal;\n\n\
  private CancellationSignal cancellationSignal;\n\nprivate CancellationSignal getCancellationSignal()\
  \ {\n    cancellationSignal = new CancellationSignal();\n    cancellationSignal.setOnCancelListener(()\
  \ ->\n        notifyUser(\"Cancelled via signal\"));\n    return cancellationSignal;\n\
  }\n```\n\n## 78.10 启动生物识别提示\n\n剩下的只需在 `authenticateUser()` 方法中添加代码，以创建并配置 `BiometricPrompt`\
  \ 实例并启动身份验证。按如下方式添加 `authenticateUser()` 方法：\n\n```java\nimport android.view.View;\n\
  \npublic void authenticateUser(View view) {\n    BiometricPrompt biometricPrompt\
  \ = new BiometricPrompt.Builder(this)\n        .setTitle(\"Biometric Demo\")\n \
  \       .setSubtitle(\"Authentication is required to continue\")\n        .setDescription(\"\
  This app uses biometric authentication to protect your data.\")\n        .setNegativeButton(\"\
  Cancel\", this.getMainExecutor(),\n            (dialogInterface, i) ->\n       \
  \     notifyUser(\"Authentication cancelled\"))\n        .build();\n    biometricPrompt.authenticate(getCancellationSignal(),\
  \ getMainExecutor(),\n            getAuthenticationCallback());\n}\n```\n\n`BiometricPrompt.Builder`\
  \ 类创建了一个新的 `BiometricPrompt` 实例，并配置了标题、副标题和描述文本以显示在提示对话框中。负按钮配置为显示“Cancel”文本，并在点击此按钮时配置显示消息。最后，调用\
  \ `BiometricPrompt` 实例的 `authenticate()` 方法并传递 `AuthenticationCallback` 和 `CancellationSignal`\
  \ 实例。生物识别提示还需要知道在哪个线程上执行身份验证。这通过传递一个配置为所需线程的 `Executor` 对象来定义。在这种情况下，使用 `getMainExecutor()`\
  \ 方法将主 `Executor` 对象传递给 `BiometricPrompt` 实例，以便身份验证过程在应用程序的主线程上进行。\n\n## 78.11 测试项目\n\
  \n现在项目已完成，在物理 Android 设备或模拟器会话上运行应用程序并点击 Authenticate 按钮以显示 `BiometricPrompt` 对话框，如图\
  \ 78-3 所示：\n\n ![image-QV6A2PQD.jpeg](img/image-QV6A2PQD.jpeg)\n\n图 78-3\n\n\n\n\
  \n一旦运行，请触摸指纹传感器，或使用模拟器中的扩展控制面板来模拟指纹触摸，如在“使用和配置 Android Studio AVD 模拟器”章节中所述。假设检测到已注册的指纹，提示对话框将返回主活动（activity），此时将显示来自身份验证成功回调方法的\
  \ toast 消息。\n\n再次点击身份验证（Authenticate）按钮，并使用未注册的指纹尝试身份验证。这一次，生物识别提示对话框将指示指纹未识别：\n\
  \n![image-5ENEY8ER.jpg](img/image-5ENEY8ER.jpeg)\n\n图 78-4\n\n点击生物识别提示对话框之外的区域，以验证错误处理回调是否正常。提示对话框将消失，并显示带有以下内容的\
  \ toast 消息：\n\n身份验证错误：用户取消了指纹操作。\n\n检查使用取消（Cancel）按钮取消提示对话框是否会触发“身份验证取消”的 toast\
  \ 消息。最后，尝试使用未注册的指纹多次身份验证，并注意在多次尝试后，提示对话框将显示失败次数过多，在此之前无法进行后续尝试。\n\n## 78.12 总结\n\
  \n本章概述了如何将生物识别身份验证集成到 Android 应用项目中。这涉及使用 `BiometricPrompt` 类，一旦配置了适当的消息文本和回调，该类会自动处理大部分身份验证过程。\n\
  \n## 79. 使用 Android 存储访问框架访问云存储\n\n近年来，远程存储服务（称为“云存储”）被广泛用于存储用户文件和数据。驱动这一增长因素有两个关键因素。之一是大多数移动设备现在提供了持续、高速的互联网连接，从而使得数据传输快速且廉价。第二个因素是，与传统的计算机系统（如台式机和笔记本电脑）相比，这些移动设备的内部存储资源受到限制。例如，今天的高规格\
  \ Android 平板通常具有 256 GB 的存储容量。与具有 1 TB 硬盘的中端笔记本系统相比，对文件进行无缝远程存储是今天许多移动应用的关键需求。\n\
  \n由于这一事实，Google 在 Android 4.4 SDK 中引入了 `Storage Access Framework`（存储访问框架）。本章将提供存储访问框架的高级概述，为下一章名为“Android\
  \ 存储访问框架示例”的更详细的教程做准备。\n\n## 79.1 存储访问框架\n\n从用户的角度来看，`Storage Access Framework`\
  \ 提供了一个直观的用户界面，允许用户在 Android 内部浏览、选择、删除和创建由存储服务（也称为文档提供者）托管的文件。通过此浏览界面（也称为选择器，picker），用户可以浏览所选文档提供者托管的文件（如文档、音频、图像和视频）。例如，图\
  \ 79-1 显示了选择器界面展示了由文档提供者服务托管的文件集合：\n\n![image-BID0FM1D.jpg](img/image-BID0FM1D.jpeg)\n\
  \n图 79-1\n\n文档提供者可以从云端服务到运行在与客户端应用同一设备上的本地文档提供者不等。在编写本文时，与 `Storage Access Framework`\
  \ 兼容的最著名的文档提供者是 Box 以及意料之中的 Google Drive。很有可能其他云存储提供者和应用程序开发者很快也会提供符合 Android 存储访问框架的服务。\n\
  \n除了云端文档提供者外，选择器还提供了对设备内部存储，为应用用户提供了一系列文件存储选项。\n\n通过一组 `Intents`，Android 开发者只需几行代码即可将这些存储能力集成到应用程序中。从开发者的角度来看，`Storage\
  \ Access Framework` 特别吸引人的方面是，用户选择的底层文档提供者对应用程序是完全透明的。一旦在应用程序中使用框架实现了存储功能，它将在无需修改代码的情况下与所有文档提供者协作。\n\
  \n## 79.2 使用存储访问框架\n\nAndroid 包含一组设计用于将 `Storage Access Framework` 功能集成到 Android\
  \ 应用程序中的 `Intents`。这些 intent 向用户显示 `Storage Access Framework` 选择器用户界面，并通过调用启动 intent\
  \ 的活动的 `onActivityResult()` 方法将交互结果返回给应用程序。当 `onActivityResult()` 方法被调用时，它将传递所选文件的\
  \ `Uri` 以及一个指示操作成功与否的值。\n\n`Storage Access Framework` intent 可总结如下：\n\n- `ACTION_OPEN_DOCUMENT`\
  \ – 为用户提供选择器用户界面的访问，以便从设备上配置的文档提供者选择文件。选择的文件以 `Uri` 对象的格式返回应用程序。\n- `ACTION_CREATE_DOCUMENT`\
  \ – 允许用户选择文档提供者、该提供者存储上的某个位置以及新文件的文件名。一旦选择，文件将由 `Storage Access Framework` 创建，并将该文件的\
  \ `Uri` 返回应用程序以便进一步处理。\n\n## 79.3 过滤选择器文件列表\n\n在启动 intent 时，选择器用户界面中列出的文件可以使用各种选项进行过滤。例如，考虑以下配置\
  \ `ACTION_OPEN_DOCUMENT` intent 的代码：\n\n```\nIntent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);\n\
  ```\n\n启动时，上述 intent 将显示选择器用户界面，允许用户浏览并选择由可用文档提供者托管的任何文件。一旦用户选择了文件，应用程序将以 `Uri`\
  \ 对象的形式获得该文件的引用。然后应用程序可以使用 `openFileDescriptor(Uri, String)` 方法打开文件。然而，存在某些风险，并非文档提供者列出的所有文件都能通过这种方式打开。可以使用\
  \ `CATEGORY_OPENABLE` 选项修改 intent 在选择器中排除此类文件。例如：\n\n```\nIntent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);\n\
  intent.addCategory(Intent.CATEGORY_OPENABLE);\n```\n\n现在显示 intent 时，无法通过 `openFileDescriptor()`\
  \ 方法打开的文件将被列出但供用户选择。\n\n另一种有效的过滤方法允许根据文件类型限制可选择的文件。这涉及指定应用程序能够处理的文件类型。例如，图像编辑应用程序可能只想为用户提供从文档提供者选择图像文件的选项。这是通过为\
  \ intent 对象配置供用户选择文件的 MIME 类型来实现的。例如，以下代码指定了只有图像文件适用于选择器中的选择：\n\n```\nintent.addCategory(Intent.CATEGORY_OPENABLE);\n\
  intent.setType(\"image/*\");\n```\n\n### 这可以进一步精化，以限制仅选择 JPEG 图像：\n\n```\nintent.setType(\"\
  image/jpeg\");\n```\n\n或者，音频播放器应用可能只能处理音频文件：\n\n```\nintent.setType(\"audio/*\"\
  );\n```\n\n该音频应用可能被进一步限制为仅支持播放 MP4 格式的音频文件：\n\n\n\n\n\n`intent.setType(\"audio/mp4\"\
  );`\n\n在使用存储访问框架（Storage Access Framework）时，可以使用广泛的 MIME 类型设置，其中更常见的可以在网上找到如下列举：\n\
  \nhttps://en.wikipedia.org/wiki/Internet_media_type#List_of_common_media_types\n\
  \n## 79.4 处理 Intent 结果\n\n由于我们启动的 Intent 会返回结果，因此需要使用 `registerForActivityResult()`\
  \ 方法（在“Android 显式 Intent – 实例示例”章节中介绍）来创建一个启动器并声明一个处理返回数据的 lambda 表达式，例如：\n\n```java\n\
  ActivityResultLauncher startOpenForResult = registerForActivityResult(\n    new\
  \ ActivityResultContracts.StartActivityForResult(),\n    new ActivityResultCallback()\
  \ {\n        @Override\n        public void onActivityResult(ActivityResult result)\
  \ {\n            if (result.getResultCode() == Activity.RESULT_OK) {\n         \
  \       Intent data = result.getData();\n                // 在此处从 Uri 读取文件内容\n  \
  \          }\n        }\n    }\n);\n```\n\n声明完成后，可以按照以下方式配置并启动 intent：\n\n```java\n\
  Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);\nintent.addCategory(Intent.CATEGORY_OPENABLE);\n\
  intent.setType(\"text/plain\");\nstartOpenForResult.launch(intent);\n```\n\n## 79.5\
  \ 读取文件内容\n\n读取由文档提供者托管的文件内容的具体步骤在很大程度上取决于文件的类型。例如，从文本文件中读取行的步骤与图像或音频文件的步骤不同。\n\n\
  通过从 `Uri` 对象中提取文件描述符，然后将图像解码为 `BitmapFactory` 实例，可以将图像文件分配给 `Bitmap` 对象。例如：\n\n\
  ```java\nParcelFileDescriptor pFileDescriptor = getContentResolver().openFileDescriptor(uri,\
  \ \"r\");\nFileDescriptor fileDescriptor = pFileDescriptor.getFileDescriptor();\n\
  Bitmap image = BitmapFactory.decodeFileDescriptor(fileDescriptor);\npFileDescriptor.close();\n\
  myImageView.setImageBitmap(image);\n```\n\n注意，文件描述符是以 `\"r\"` 模式打开的。这表示文件将用于读取。其他选项包括用于写入访问的\
  \ `\"w\"` 以及用于读写访问的 `\"rwt\"`，其中文件的现有内容将被新内容覆盖。\n\n读取文本文件的内容需要稍多的工作并使用 `InputStream`\
  \ 对象。例如，以下代码从文本文件中读取行：\n\n```java\nInputStream inputStream = getContentResolver().openInputStream(uri);\n\
  BufferedReader reader = new BufferedReader(new InputStreamReader(inputStream));\n\
  String readline;\nwhile ((readline = reader.readLine()) != null) {\n    // 对文件中的每一行进行操作\n\
  }\ninputStream.close();\n```\n\n## 79.6 向文件写入内容\n\n向由文档提供者托管的打开文件写入内容与读取相似，但使用的是输出流而不是输入流。例如，以下代码将文本写入指定的\
  \ `Uri` 所引的存储文件的输出流中：\n\n```java\ntry {\n    ParcelFileDescriptor pFileDescriptor\
  \ = this.getContentResolver().openFileDescriptor(uri, \"w\");\n    FileOutputStream\
  \ fileOutputStream = new FileOutputStream(pFileDescriptor.getFileDescriptor());\n\
  \    String textContent = \"Some sample text\";\n    fileOutputStream.write(textContent.getBytes());\n\
  \    fileOutputStream.close();\n    pFileDescriptor.close();\n} catch (FileNotFoundException\
  \ e) {\n    e.printStackTrace();\n} catch (IOException e) {\n    e.printStackTrace();\n\
  }\n```\n\n首先，从 `Uri` 中提取文件描述符，这次请求对目标文件具有写入权限。随后使用该文件描述符获取文件输出流的引用。在关闭文件描述符和输出流之前，将内容（在本例中为某些文本）写入输出流。\n\
  \n## 79.7 删除文件\n\n是否可以从存储器中删除文件取决于该文件的文档提供者是否支持删除该文件。假设允许删除，可以如下所示对指定的 `Uri` 执行删除操作：\n\
  \n```java\nif (DocumentsContract.deleteDocument(getContentResolver(), uri))\n  \
  \  // 删除成功\nelse\n    // 删除失败\n```\n\n## 79.8 获取对文件的持久访问权限\n\n当应用程序通过存储访问框架获取文件的访问时，该访问将保持有效，直到运行该应用程序的\
  \ Android 设备重启。通过“获取” `Uri` 的必要权限，可以获得对特定文件的持久访问。例如，以下代码为 `fileUri` `Uri` 实例引用的文件持久化读写权限：\n\
  \n```java\nfinal int takeFlags = intent.getFlags()\n    & (Intent.FLAG_GRANT_READ_URI_PERMISSION\
  \ | Intent.FLAG_GRANT_WRITE_URI_PERMISSION);\ngetContentResolver().takePersistableUriPermission(fileUri,\
  \ takeFlags);\n```\n\n一旦应用程序获取了文件的权限，并且假设应用程序保存了 `Uri`，则用户应该能够在设备重启后继续访问该文件，而无需用户从选择器界面重新选择文件。\n\
  \n如果在任何时候不再需要这些持久化权限，可以通过调用内容解析器的 `releasePersistableUriPermission()` 方法来释放它们：\n\
  \n```java\nfinal int releaseFlags = intent.getFlags()\n    & (Intent.FLAG_GRANT_READ_URI_PERMISSION\
  \ | Intent.FLAG_GRANT_WRITE_URI_PERMISSION);\ngetContentResolver().releasePersistableUriPermission(fileUri,\
  \ releaseFlags);\n```\n\n## 79.9 总结\n\n考虑过去几年人们对“存储”的感知变化是非常有趣的。“存储”一词曾与大容量内置硬盘等同，但现在它它同样可能指的是通过互联网连接访问的托管在远程云端的存储空间。\n\
  \n## 80 Android 存储访问框架示例\n\n如前所述，存储访问框架极大简化了将云存储访问集成到 Android 应用程序的过程中。通过一个选择器用户界面和一组新的\
  \ Intent，现在可以在应用程序中构建对在提供者上存储的文件的访问。\n\n## 80.1 关于存储访问框架示例\n\n在本章创建的 Android 应用程序将采用原始文本编辑器的形式，旨在创建并将文本文件远程存储到云存储服务中。在实践中，该示例适用于任何兼容存储访问框架的云端文档提供者，但本示例假设使用了\
  \ Google Drive。\n\n## 80.2 创建存储访问框架示例\n\n在欢迎界面上选择 New Project 选项，在出现的新项目对话框中选择 Empty\
  \ Views Activity 模板，然后点击 Next 按钮。\n\n\n\n\n\n在 `Name` 字段中输入 `StorageDemo`，并指定 `com.ebookfrenzy.storagedemo`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置更改为 `API 26`：Android 8.0 (Oreo)，并将\
  \ `Language` 菜单更改为 `Java`。\n\n按照第 12.8 节“将项目迁移到 View Binding”中的常规步骤操作，为项目添加 View\
  \ Binding 支持。\n\n## 80.3 设计用户界面\n\n用户界面将由三个 `Button` 视图和一个 `EditText` 视图组成。在 `Project`\
  \ 工具窗口中，导航到 `app -> res -> layout` 下的 `activity_main.xml` 布局文件，并双击将其加载到 `Layout\
  \ Editor` 工具中。在工具的 Design（设计）模式下，选择并删除 `Hello World!` 的 `TextView` 对象。\n\n在布局的左上角拖动并放置\
  \ `Button` 控件，以便在释放控件之前之前同时出现左侧和顶部的虚线边距指南。放置第二个 `Button`，使其中心和顶部边距指南出现。第三个 `Button`\
  \ 控件应放置在顶部和右侧边距指南出现的位置。\n\n将三个按钮的文本属性分别更改为“New”、“Open”和“Save”。接下来，放置一个 `Plain Text`\
  \ 控件，使其水平居中并位于中心 `Button` 下方，使用户界面布局与图 80-1 所示。使用 `Layout Editor` 工具栏中的 `Infer Constraints`（推断约束）按钮添加任何缺失的约束。\n\
  \n选择布局中的 `Plain Text` 控件，删除当前的文本属性设置（使字段初始为空），并将 `ID` 设置为 `fileText`。接下来，将字符串属性提取为命名为\
  \ `string`、`open_string` 和 `save_string` 的资源值。\n\n![image-UPGAFK3U.jpg](img/image-UPGAFK3U.jpeg)\n\
  \n图 80-1\n\n使用 `Attributes` 工具窗口配置 `Button` 控件上的 `onClick` 属性，分别调用名为 `newFile`、`openFile`\
  \ 和 `saveFile` 的方法。\n\n## 80.4 添加 Activity 启动器\n\n按照名为“Android 显式意图——实例示例”章节中概述的步骤，我们需要开始注册\
  \ Activity 启动器以处理文件内容的创建、打开和保存。\n\n在 `MainActivity.java` 文件中，如下所示为三个操作中的每一个添加一个启动器：\n\
  \n```\n.\n.\n\nimport androidx.activity.result.ActivityResult;\nimport androidx.activity.result.ActivityResultCallback;\n\
  import androidx.activity.result.ActivityResultLauncher;\nimport androidx.activity.result.contract.ActivityResultContracts;\n\
  import android.app.Activity;\nimport android.content.Intent;\nimport android.net.Uri;\n\
  import java.io.IOException;\n\n.\n.\n\nActivityResultLauncher startOpenForResult\
  \ =\nregisterForActivityResult(\n    new ActivityResultContracts.StartActivityForResult(),\n\
  \    new ActivityResultCallback() {\n        @Override\n        public void onActivityResult(ActivityResult\
  \ result) {\n            if (result.getResultCode() == Activity.RESULT_OK) {\n \
  \               Intent data = result.getData();\n                if (data != null)\
  \ {\n                    Uri currentUri = data.getData();\n                    try\
  \ {\n                        String content =\n                            readFileContent(currentUri);\n\
  \                        binding.fileText.setText(content);\n                  \
  \  } catch (IOException e) {\n                        // Handle error here\n   \
  \                 }\n                }\n            }\n        }\n    }\n);\n\n\
  ActivityResultLauncher startSaveForResult =\nregisterForActivityResult(\n    new\
  \ ActivityResultContracts.StartActivityForResult(),\n    result -> {\n        if\
  \ (result.getResultCode() == Activity.RESULT_OK) {\n            Intent data = result.getData();\n\
  \            if (data != null) {\n                Uri currentUri = data.getData();\n\
  \                try {\n                    writeFileContent(currentUri);\n    \
  \            } catch (IOException e) {\n                    // Handle error here\n\
  \                }\n            }\n        }\n    }\n);\n\nActivityResultLauncher\
  \ startCreateForResult =\nregisterForActivityResult(\n    new ActivityResultContracts.StartActivityForResult(),\n\
  \    new ActivityResultCallback() {\n        @Override\n        public void onActivityResult(ActivityResult\
  \ result) {\n            if (result.getResultCode() == Activity.RESULT_OK) {\n \
  \               Intent data = result.getData();\n                if (data != null)\
  \ {\n                    binding.fileText.setText(\"\");\n                }\n  \
  \          }\n        }\n    }\n);\n```\n\n## 80.5 创建新的存储文件\n\n当选择 `New` 按钮时，应用程序需要触发一个\
  \ `ACTION_CREATE_DOCUMENT` 意图，配置为创建一个纯文本 MIME 类型的文件。在设计用户界面时，`New` 按钮被配置为调用名为 `newFile()`\
  \ 的方法。在该方法内部需要启动相应的意图。\n\n继续留在 `MainActivity.java` 文件中，如下实现该方法：\n\n```java\npackage\
  \ com.ebookfrenzy.storagedemo;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n.\n.\n\n    public void newFile(View view)\n    {\n        Intent intent =\
  \ new Intent(Intent.ACTION_CREATE_DOCUMENT);\n        intent.addCategory(Intent.CATEGORY_OPENABLE);\n\
  \        intent.setType(\"text/plain\");\n        intent.putExtra(Intent.EXTRA_TITLE,\
  \ \"newfile.txt\");\n        startCreateForResult.launch(intent);\n    }\n\n.\n\
  .\n}\n```\n\n此代码创建了一个新的 `ACTION_CREATE_INTENT` `Intent` 对象。该意图随后配置为仅返回可以打开的文件（通过\
  \ `Intent.CATEGORY_OPENABLE` 设置）。\n\n接下来，代码指定要打开的文件具有纯文本 MIME 类型，并提供了一个占位文件名（用户可以在选择器界面更改它）。\n\
  \n当此方法执行且意图完成任务时，将调用 `startCreateForResult()` 并传递新创建文档的 `Uri`。\n\n## 80.6 保存到存储文件\n\
  \n现在应用程序能够创建新的存储文件，下一步是添加将用户输入的任何文本保存到文件中。用户界面配置为在选择 Save 按钮时调用 `saveFile()` 方法。\n\
  \n```java\npublic void saveFile(View view)\n{\n    Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);\n\
  \    intent.addCategory(Intent.CATEGORY_OPENABLE);\n    intent.setType(\"text/plain\"\
  );\n    startSaveForResult.launch(intent);\n}\n```\n\n分配给 `startSaveForResult()`\
  \ 的 lambda 调用名为 `writeFileContent()` 的方法，传递要写入文件的 `Uri`。继续留在 `MainActivity.java`\
  \ 文件中，现在如下实现该方法：\n\n```java\npackage com.ebookfrenzy.storagedemo;\n\nimport java.io.FileOutputStream;\n\
  import android.os.ParcelFileDescriptor;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n.\n.\n\n    private void writeFileContent(Uri uri) throws IOException\n   \
  \ {\n        try{\n            ParcelFileDescriptor pfd =\n                this.getContentResolver().\n\
  \                openFileDescriptor(uri, \"w\");\n            FileOutputStream fileOutputStream\
  \ =\n                new FileOutputStream(\n                pfd.getFileDescriptor());\n\
  \            String textContent =\n                binding.fileText.getText().toString();\n\
  \            fileOutputStream.write(textContent.getBytes());\n            fileOutputStream.close();\n\
  \            pfd.close();\n        } catch (IOException e) {\n            e.printStackTrace();\n\
  \        }\n    }\n\n.\n.\n}\n```\n\n\n\n\n\n在编写了创建和保存文本文件的代码后，最后一个任务是添加从存储器中打开和读取文件的功能。这将涉及编写\
  \ `openFile()` 点击事件处理方法并实现它，使其启动 `ACTION_OPEN_DOCUMENT` 意图：\n\n```java\npublic void\
  \ openFile(View view)\n{\n    Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);\n\
  \    intent.addCategory(Intent.CATEGORY_OPENABLE);\n    intent.setType(\"text/plain\"\
  );\n    startOpenForResult.launch(intent);\n}\n```\n\n下一个任务是实现由 `startOpenForResult()`\
  \ 表达式调用的 `readFileContent()` 方法：\n\n```java\npackage com.ebookfrenzy.storagedemo;\n\
  \nimport java.io.BufferedReader;\nimport java.io.InputStream;\nimport java.io.InputStreamReader;\n\
  \npublic class MainActivity extends AppCompatActivity {\n\n    private String readFileContent(Uri\
  \ uri) throws IOException {\n        InputStream inputStream =\n            getContentResolver().openInputStream(uri);\n\
  \        BufferedReader reader =\n            new BufferedReader(new InputStreamReader(\n\
  \                inputStream));\n        StringBuilder stringBuilder = new StringBuilder();\n\
  \        String currentline;\n        while ((currentline = reader.readLine()) !=\
  \ null) {\n            stringBuilder.append(currentline).append(\"\\n\");\n    \
  \    }\n        inputStream.close();\n        return stringBuilder.toString();\n\
  \    }\n}\n```\n\n该方法首先提取所选文本文件的文件描述符并将其打开读取。随后打开与 `Uri` 关联的输入流，并将其作为 `BufferedReader`\
  \ 实例的输入源。\n\n文件的每一行都被读取并存储在 `StringBuilder` 对象中。一旦读取完所有行，输入流和文件描述符都将被关闭，文件内容将作为\
  \ `String` 对象返回。\n\n## 80.8 测试存储访问应用程序\n\n编码阶段完成后，应用已准备好进行测试。编译并运行应用程序，点击 New 按钮。随后，Storage\
  \ Access Framework 将显示如图 80-2 所示的下载界面：\n\n![image-2875DUPH.jpg](img/image-2875DUPH.jpeg)\n\
  \n图 80-2\n\n点击上方高亮的菜单按钮并选择 Drive 选项，然后选择 My Drive，并导航到 Google Drive 存储器上的合适位置以保存文件。在选择器界面底部的文本框中，在选择\
  \ Save 选项之前，将名称从“newfile.txt”更改为合适的名称（但保留 .txt 扩展名）。\n\n![image-H8UNQBYQ.jpg](img/image-H8UNQBYQ.jpeg)\n\
  \n图 80-3\n\n一旦文件文件，应用程序应返回主活动，通知面板中可能会出现显示为“1 file uploaded”（已上传一个文件）的通知。\n\n![image-414HATTE.jpg](img/image-414HATTE.jpeg)\n\
  \n图 80-4\n\n此时，应该可以在浏览器窗口中登录您的 Google Drive 账户，并在请求的位置找到新的文件。如果文件丢失，请确保运行应用程序的 Android\
  \ 设备已连接到活跃的网络。还可以通过运行 Google Drive 应用（许多 Android 设备默认安装，并可从 Google Play 商店下载）来验证设备对\
  \ Google Drive 的访问。\n\n现在我们已经创建了一个文件，在点击“Save”按钮之前，在文本区域输入一些文本。从选择器中选择之前创建的文本文件将内容保存到文件中。返回应用程序后，删除文本并选择“Open”按钮，再次选择您保存的文件。当控制权返回应用程序时，文本视图应该已填充文本文件的内容。\n\
  \n需要注意的是，如果 Android 设备缺少活跃的网络连接，Storage Access Framework 将在本地缓存存储文件。然而，一旦重新连接，任何缓存数据都将与远程存储服务同步。因此，作为应用程序的最终测试，请在浏览器窗口中登录您的\
  \ Google Drive 账户，导航到保存的文件并点击它查看内容，如果一切顺利，它应该包含应用程序保存的文本。\n\n## 80.9 总结\n\n本章详细介绍了如何创建一个\
  \ Android Studio 应用程序示例，该示例程序是一个非常基础的文本编辑器，旨在使用 Android Storage Access Framework\
  \ 利用云端存储来创建、保存和打开文件。\n\n## 81. 使用 VideoView 和 MediaController 类在 Android 上进行视频播放\n\
  \n智能手机和平板电脑的主要用途之一是提供在线内容的访问。视频是一种广泛使用的内容形式，尤其是在平板设备上。\n\nAndroid SDK 包含了两个类，它们使得在开发应用程序时，在\
  \ Android 设备上实现视频播放变得极其简单。本章将提供这两个类——`VideoView` 和 `MediaController` 的概述，并创建一个视频播放应用程序。\n\
  \n## 81.1 介绍 Android VideoView 类\n\n在 Android 中显示视频最简单的方法是使用 `VideoView` 类。当此视觉组件被添加到\
  \ Activity 的布局时，它提供了一个可以播放视频的表面。Android 目前支持以下视频格式：\n\n* H.263\n* H.264 AVC\n* H.265\
  \ HEVC\n* MPEG-4 SP\n* VP8\n* VP9\n\n`VideoView` 类具有许多可以调用的方法来管理视频播放。一些较常用的方法如下：\n\
  \n* `setVideoPath(String path)` – 指定要播放的视频媒体路径（字符串格式）。这可以是远程视频 URL，也可以是设备本地视频文件。\n\
  * `setVideoUri(Uri uri)` – 执行与 `setVideoPath()` 方法的任务，但接收的是 `Uri` 对象而不是字符串。\n* `start()`\
  \ – 开始视频播放。\n* `stopPlayback()` – 停止视频播放。\n* `pause()` – 暂停视频播放。\n* `isPlaying()`\
  \ – 返回布尔值，指示视频是否正在播放。\n* `setOnPreparedListener(MediaPlayer.OnPreparedListener)`\
  \ – 在视频准备就绪时调用回调方法。\n* `setOnErrorListener(MediaPlayer.OnErrorListener)` – 在视频播放期间发生错误时调用回调方法。\n\
  * `setOnCompletionListener(MediaPlayer.OnCompletionListener)` – 在视频结束时调用回调方法。\n\
  * `getDuration()` – 返回视频持续时间。除非从 `OnPreparedListener()` 回调方法调用，否则通常返回 -1。\n* `getCurrentPosition()`\
  \ – 返回指示当前播放位置的整数。\n* `setMediaController(MediaController)` – 指定允许显示播放控件的 `MediaController`\
  \ 实例。\n\n## 81.2 介绍 Android MediaController 类\n\n如果使用 `VideoView` 类播放视频，用户将无法控制播放，播放将一直运行到视频结束。通过为\
  \ `VideoView` 实例附加 `MediaController` 类的实例可以解决这个问题。`MediaController` 将提供一组控件，允许用户管理播放（例如暂停并在视频时间轴上向前/后移动）。\n\
  \n控件的位置通过将实例锚定用户界面布局中的特定视图来指定。一旦附加并锚定，控件在播放开始时会短暂出现，随后用户可以通过点击锚定实例的视图来随时恢复控件。\n\n\
  该类的一些关键方法如下：\n\n* `setAnchorView(View view)` – 指定将将控制器锚定的视图。这决定了控件在屏幕上的位置。\n* `show()`\
  \ – 显示控件。\n* `show(int timeout)` – 控件在指定的时长（毫秒）内显示。\n* `hide()` – 向用户隐藏控制器。\n\n\n\
  \n\n- `isShowing()` – 返回一个布尔值，表示控件当前是否对用户可见。\n\n## 81.3 创建视频回放示例\n\n本章的剩余部分将创建一个应用程序，该程序使用\
  \ `VideoView` 和 `MediaController` 类来播放 MPEG-4 视频文件。\n\n从欢迎界面选择 `New Project`（新建项目）选项，在出现的新项目对话框中，点击\
  \ `Next` 按钮之前选择 `Empty Views Activity` 模板。\n\n在 `Name` 字段中输入 `VideoPlayer`，并指定 `com.ebookfrenzy.videoplayer`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 33: Android 13 (Tiramisu)`，并将\
  \ `Language` 菜单更改为 `Java`。参考第 12.8 节 `Migrating a Project to View Binding` 中的步骤为该项目启用视图绑定。\n\
  \n## 81.4 设计 VideoPlayer 布局\n\n主 Activity 的用户界面将仅由 `VideoView` 类的实例组成。使用 `Project`\
  \ 工具窗口找到 `app -> res -> layout -> activity_main.xml` 文件，双击它，将 `Layout Editor` 工具切换到\
  \ `Design` 模式，并删除默认的 `TextView` 小部件。\n\n从 `Palette` 面板的 `Widgets` 类别中，将 `VideoView`\
  \ 实例拖放到布局中以填充可用画布区域，如图 81-1 所示。使用 `Attributes` 面板，将 `layout_width` 和 `layout_height`\
  \ 属性分别更改为 `match_constraint` 和 `wrap_content`。此外，移除连接 `VideoView` 底部与父 `ConstraintLayout`\
  \ 底部的约束。最后，将组件的 `ID` 改为 `videoView1`。\n\n![image-MT1V4MV2.jpg](img/image-MT1V4MV2.jpeg)\n\
  \n图 81-1\n\n## 81.5 下载视频文件\n\n`VideoPlayer` 应用将播放的视频是用 MPEG-4 格式编码的短动画电影片段。使用网络浏览器导航到以下\
  \ URL 播放视频：\n\n[`www.ebookfrenzy.com/android_book/demo.mp4`](https://www.ebookfrenzy.com/android_book/demo.mp4)\n\
  \n在浏览器窗口中，右键点击视频播放，选择保存或下载视频到本地文件的选项，并选择一个合适的临时文件系统位置，将文件命名为 `demo.mp4`。\n\n在 Android\
  \ Studio 中，在 `Project` 工具窗口中找到 `res` 文件夹，右键点击它，选择 `New -> Directory` 菜单选项，并在 `name`\
  \ 字段中输入 `raw` 然后按 `Return` 键。使用操作系统的文件导航器找到上述下载的 `demo.mp4` 文件并复制。返回 Android Studio，右键点击新创建的\
  \ `raw` 目录并选择 `Paste` 将视频文件复制到项目中。添加完成后，`raw` 文件夹在 `Project` 工具窗口中应与图 81-2 一致：\n\
  \n![image-F2YLKAS9.jpg](img/image-F2YLKAS9.jpeg)\n\n图 81-2\n\n## 81.6 配置 VideoView\n\
  \n下一步是为 `VideoView` 配置要播放的视频路径然后启动播放。这将在主 Activity 初始化时执行，因此将 `MainActivity.java`\
  \ 文件加载到编辑器中，并按照以下列表概述进行修改：\n\n```java\npackage com.ebookfrenzy.videoplayer;\n\n\
