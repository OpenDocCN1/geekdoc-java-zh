  \ 总结\n\n隐式意图（Implicit intents）提供了一种机制，一个 activity 可以通过指定操作类型以及（可选的）执行该操作的数据来请求另一个\
  \ activity 的服务。然而，为了成为隐式意图的目标候选者，activity 必须配置为从传入的意图对象中提取适当的数据，并包含在配置正确的清单文件中，其中包括适当的权限和意图过滤器。包含目标\
  \ activity 的应用还必须通过 Digital Asset Links 文件进行验证，或由用户手动启用。\n\n在本章中，创建了一个示例来演示隐式意图的发送、能够处理此类意图的示例\
  \ activity 的创建，以及链接验证过程。\n\n## 57. Android 广播意图和广播接收器\n\n意图（intents）除了提供了启动应用程序的机制外，还用于向系统中的其他组件广播系统范围的消息。这涉及广播意图（Broadcast\
  \ Intents）和广播接收器（Broadcast Receivers）的实现，两者都是本章的主题。\n\n## 57.1 广播意图概述\n\n广播意图是通过调用\
  \ `Activity` 类的 `sendBroadcast()`、`sendStickyBroadcast()` 或 `sendOrderedBroadcast()`\
  \ 方法广播的 `Intent` 对象（后者用于需要从广播结果的情况）。除了在应用程序组件之间提供消息传递和事件系统外，广播意图还被 Android 系统用于通知感兴趣的应用程序有关关键系统事件（例如外部电源或耳机的连接或断开）。\n\
  \n当创建广播意图时，它必须包含一个操作字符串、一个可选数据和一个类别字符串。与标准意图一样，数据是使用 `intent` 对象的 `putExtra()` 方法结合键值对添加到广播意图中的。可选的类别字符串可以通过调用\
  \ `addCategory()` 方法分配给广播意图。\n\n标识广播事件的操作字符串必须是唯一的，并且通常使用应用程序的包名语法。例如，下面的代码段创建创建并发送了一个广播意图，包括一个唯一的操作字符串和数据：\n\
  \n```\nIntent intent = new Intent();\nintent.setAction(\"com.example.Broadcast\"\
  );\nintent.putExtra(\"MyData\", 1000);\nsendBroadcast(intent);\n```\n\n上面的代码将在 Android\
  \ 3.0 之前的 Android 设备上成功启动相应的广播接收器。然而，在较新的 Android 版本中，广播接收器将无法接收该意图。这是因为 Android\
  \ 3.0 引入了一种启动控制安全措施，防止停止的应用程序组件通过意图启动。如果应用程序刚刚安装且从未启动过，或者被用户使用设备上的应用程序管理器手动停止，则该应用程序被认为处于停止状态。然而，为了绕过这一点，可以在发送意图之前添加一个标记，以指示允许该意图启动停止应用程序的组件。该标记是\
  \ `FLAG_INCLUDE_STOPPED_PACKAGES`，并将按照以下对之前代码段的适配方式使用：\n\n```\nIntent intent = new\
  \ Intent();\nintent.addFlags(Intent.FLAG_INCLUDE_STOPPED_PACKAGES);\nintent.setAction(\"\
  com.example.Broadcast\");\nintent.putExtra(\"MyData\", 1000);\nsendBroadcast(intent);\n\
  ```\n\n## 57.2 广播接收器概述\n\n应用程序通过注册广播接收器来监听特定的广播意图。广播接收器通过扩展 `AndroidBroadcastReceiver`\
  \ 类并重写 `onReceive()` 方法来实现。广播接收器可以在代码中（例如，在 activity 内部）或清单文件中注册。注册实现的一部分涉及创建意图过滤器（intent\
  \ filters），以指示接收器需要监听的特定广播意图。这通过引用广播意图的操作字符串来实现。当检测到匹配的广播时，会调用广播接收器的 `onReceive()`\
  \ 方法，此时该方法有 5 秒钟的时间来执行任何必要的任务然后返回。需要注意的是，广播接收器不需要持续运行。如果检测到匹配的意图，Android 运行时系统会在调用\
  \ `onReceive()` 方法之前自动启动广播接收器。\n\n下面的代码概述了一个模板化的广播接收器子类：\n\n```\npackage com.example.broadcastdetector;\n\
  \nimport android.content.BroadcastReceiver;\nimport android.content.Context;\nimport\
  \ android.content.Intent;\n\npublic class MyReceiver extends BroadcastReceiver {\n\
  \    @Override\n    public void onReceive(Context context, Intent intent) {\n  \
  \      // 在检测到广播时要执行的代码\n    }\n}\n```\n\n在清单文件中注册广播接收器时，必须为该接收器添加一个条目。下面的示例清单文件注册了上面的示例广播接收器：\n\
  \n```xml\n<manifest package=\"com.example.broadcastdetector\"\n    android:versionCode=\"\
  1\"\n    android:versionName=\"1.0\"\n    android:icon=\"@mipmap/ic_launcher\"\n\
  \    android:label=\"@string/app_name\">\n```\n\n在 Android 8.0 之前的版本上运行时，与接收器相关的意图过滤器可以放置在清单文件的\
  \ receiver 元素中。对于 Android 8.0 或更高版本，必须在代码中使用 `Activity` 类的 `registerReceiver()`\
  \ 方法结合适当配置的 `IntentFilter` 对象来注册接收器：\n\n```\nIntentFilter filter = new IntentFilter(\"\
  com.example.Broadcast\");\nMyReceiver receiver = new MyReceiver();\nregisterReceiver(receiver,\
  \ filter, RECEIVER_EXPORTED);\n```\n\n当代码中注册的广播接收器不再需要时，可以通过调用 activity 类的 `unregisterReceiver()`\
  \ 方法进行注销，并将接收对象的引用作为参数。例如，下面的代码将注销上面的广播接收器：\n\n```\nunregisterReceiver(receiver);\n\
  ```\n\n请记住，某些系统广播意图只有当接收器在代码中注册而不是在清单文件中注册时才能被检测到。请在线查看 Android `Intent` 类文档获取系统广播意图及相应要求的详细概述：\n\
  \n[`developer.android.com/reference/android/content/Intent`](https://developer.android.com/reference/android/content/Intent)\n\
  \n## 57.3 从广播获取结果\n\n\n\n\n当使用 `sendBroadcast()` 方法发送广播意图时，启动的 无法从接收该广播的任何广播接收器获取结果。如果需要返回结果，则必须使用\
  \ `sendOrderedBroadcast()` 方法。当使用此方法发送广播意图时，它将按照顺序传递给每个已注册感兴趣的广播接收器。\n\n`sendOrderedBroadcast()`\
  \ 方法接受多个参数，包括一个指向另一个广播接收器的引用（称为结果接收器），当所有其他广播接收器都处理完意图后将通知该接收器，以及一组数据引用，这些接收器可以将结果数据放入这些引用中。当所有广播接收器都获得了处理广播的机会后，结果接收器的\
  \ `onReceive()` 方法将被调用，并传入结果数据。\n\n# 57.4 粘性广播意图\n\n默认情况下，广播意图在发送并被感兴趣的广播接收器处理后就会消失。然而，广播意图可以被定义为“粘性”（sticky）。粘性意图及其包含的数据在执行完成后仍会留存在系统中。存储在粘性广播意图中的数据可以通过调用\
  \ `registerReceiver()` 方法的返回值获取，该方法使用通常的参数（广播接收器的引用和意图过滤器对象）。许多 Android 系统广播都是粘性的，一个典型的例子是与电池量状态相关的广播。\n\
  \n粘性广播可以通过调用 `removeStickyBroadcast()` 方法随时移除，该方法通过参数传递要移除的广播意图的引用。\n\n# 57.5 广播意图示例\n\
  \n本章的剩余部分将通过实现一个基于 Android Studio 的广播意图运行示例。在第一个实例中，将创建一个简单的应用程序来发布一个自定义的广播意图。随后，将创建一个相应的广播接收器，以便在检测到广播时在\
  \ Android 设备的屏幕上显示消息。最后，将修改广播接收器以检测系统关于外部电源已从设备断开的通知。\n\n# 57.6 创建示例应用程序\n\n从欢迎界面选择\
  \ `New Project`（新建项目）选项，在生成的新项目对话框中，点击 `Next`（下一步）按钮之前选择 `Empty Views Activity`\
  \ 模板。\n\n在 `Name`（名称）字段中输入 `SendBroadcast` 并指定 `com.ebookfrenzy.sendbroadcast` 为包名。在点击\
  \ `Finish`（完成）按钮之前，将 `Minimum API level`（最低 API 级别）设置改为 `API 33: Android 13.0 (Tiramisu)`，并将\
  \ `Language`（语言）菜单更改 `Java`。\n\n一旦新新项目，在 Project 工具窗口的 `app -> res -> layout` 下找到并加载\
  \ `activity_main.xml` 布局文件，并在 Design（设计）模式下使用 Layout Editor 工具，将 `TextView` 对象替换为\
  \ `Button` 视图，并设置 `text` 属性显示为“Send Broadcast”。一旦设置了文本值，按照通常步骤将字符串提取到名为 `send_broadcast`\
  \ 的资源。\n\n在布局中仍选中按钮的状态下，在 Attributes（属性）面板中找到 `onClick` 属性，并配置为调用名为 `broadcastIntent`\
  \ 的方法。\n\n# 57.7 创建并发送广播意图\n\n在创建了 `SendBroadcast` 应用程序的框架后，现在是时候实现发送广播意图的代码了。这涉及实现之前指定的作为用户界面\
  \ `Button` 视图的 `onClick` 目标的 `broadcastIntent()` 方法。找到 `MainActivity.java` 文件并双击它，修改它以添加创建和发送广播意图的代码。修改后，该类的源代码应如下所示：\n\
  \n```java\npackage com.ebookfrenzy.sendbroadcast;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  \nimport android.os.Bundle;\n\nimport android.content.Intent;\n\nimport android.view.View;\n\
  \npublic class MainActivity extends AppCompatActivity {\n\n.\n\n.\n\npublic void\
  \ broadcastIntent(View view)\n{\n\nIntent intent = new Intent();\n\nintent.setAction(\"\
  com.ebookfrenzy.sendbroadcast\");\n\nintent.addFlags(Intent.FLAG_INCLUDE_STOPPED_PACKAGES);\n\
  \nsendBroadcast(intent);\n\n}\n\n}\n```\n\n注意在此实例中，意图的 action 字符串为 `com.ebookfrenzy.sendbroadcast`。当在本章后续章节创建广播接收器类时，意图过滤器声明必须匹配此\
  \ action 字符串。\n\n发送广播意图的应用程序创建此结束。剩下的就是构建一个匹配的广播接收器。\n\n# 57.8 创建广播接收器\n\n要创建广播接收器，需要创建一个新类，该类继承自\
  \ `BroadcastReceiver` 超类。在 Project 工具窗口中，导航到 `app -> java` 并右键点击包名。从生成的菜单中选择 `New\
  \ -> Other -> Broadcast Receiver` 菜单选项，将类命名为 `MyReceiver`，并确保选择了 `Exported` 和 `Enabled`\
  \ 选项。这些设置允许 Android 系统在需要时启动接收器，并确保该类可以接收来自其他应用程序的消息。配置好类后，点击 `Finish`。\n\n一旦创建，Android\
  \ Studio 将将新的 `MyReceiver.java` 类文件加载到编辑器中，其内容应如下：\n\n```java\npackage com.ebookfrenzy.sendbroadcast;\n\
  \nimport android.content.BroadcastReceiver;\n\nimport android.content.Context;\n\
  \nimport android.content.Intent;\n\npublic class MyReceiver extends BroadcastReceiver\
  \ {\n\n@Override\n\npublic void onReceive(Context context, Intent intent) {\n\n\
  // TODO: 当 BroadcastReceiver 接收到 Intent 广播时调用此方法。\n\nthrow new UnsupportedOperationException(\"\
  Not yet implemented\");\n\n}\n\n}\n```\n\n如代码所示，Android Studio 为新类生成了模板以及 `onReceive()`\
  \ 方法的存根。现在需要对类进行一些更改以实现所需的行为。在 `MyReceiver.java` 文件中，修改代码使其如下：\n\n```java\npackage\
  \ com.ebookfrenzy.sendbroadcast;\n\nimport android.content.BroadcastReceiver;\n\n\
  import android.content.Context;\n\nimport android.content.Intent;\n\nimport android.widget.Toast;\n\
  \npublic class MyReceiver extends BroadcastReceiver {\n\n@Override\n\npublic void\
  \ onReceive(Context context, Intent intent) {\n\n// TODO: 当 BroadcastReceiver 接收到\
  \ Intent 广播时调用此方法。\n\nthrow new UnsupportedOperationException(\"Not yet implemented\"\
  );\n\nToast.makeText(context, \"Broadcast Detected.\",\n\nToast.LENGTH_LONG).show();\n\
  \n}\n\n}\n```\n\n广播接收器的代码现在完成了。\n\n# 57.9 注册广播接收器\n\n项目需要公开广播接收器的存在，并包含一个意图过滤器来指定接收器感兴趣的广播意图。当在上节中创建\
  \ `BroadcastReceiver` 类时，Android Studio 已自动在文件中文件中了一个元素。因此，剩下的是在 `MainActivity.java`\
  \ 文件中添加代码以创建意图过滤器并注册接收器：\n\n```java\npackage com.ebookfrenzy.sendbroadcast;\n\n\
  .\n\n.\n\nimport android.content.BroadcastReceiver;\n\nimport android.content.IntentFilter;\n\
  \n.\n\n.\n\npublic class MainActivity extends AppCompatActivity {\n\nBroadcastReceiver\
  \ receiver;\n\n@Override\n\nprotected void onCreate(Bundle savedInstanceState) {\n\
  \nsuper.onCreate(savedInstanceState);\n\n.\n\n.\n\nconfigureReceiver();\n\n}\n\n\
  private void configureReceiver() {\n\nIntentFilter filter = new IntentFilter();\n\
  \nfilter.addAction(\"com.ebookfrenzy.sendbroadcast\");\n\nreceiver = new MyReceiver();\n\
  \nregisterReceiver(receiver, filter);\n\n}\n\n.\n\n.\n\n}\n```\n\n在不再需要时注销广播接收器也是重要的：\n\
  \n```java\n@Override\n\nprotected void onDestroy() {\n\nsuper.onDestroy();\n\nunregisterReceiver(receiver);\n\
  \n}\n```\n\n\n\n\n\n## 57.10 测试广播示例\n\n要测试广播发送者和接收器，请在设备或 AVD 上运行 `SendBroadcast`\
  \ 应用并等待它显示在屏幕上。运行后，点击按钮，此时应该弹出一个显示“Broadcast Intent Detected.”的吐司消息（toast），持续几秒后消失。\n\
  \n## 57.11 监听系统广播\n\n此示例的最后一个阶段是修改广播接收器的意图过滤器（intent filter），以监听当外部电源从设备断开时广播的系统意图。该操作是\
  \ `android.intent.action.ACTION_POWER_DISCONNECTED`。修改 `MainActivity.java` 文件中的\
  \ `configureReceiver()` 方法以添加此额外的过滤器：\n\n```java\nprivate void configureReceiver()\
  \ {\n    IntentFilter filter = new IntentFilter();\n    filter.addAction(\"com.ebookfrenzy.sendbroadcast\"\
  );\n    filter.addAction(\n    \"android.intent.action.ACTION_POWER_DISCONNECTED\"\
  );\n    receiver = new MyReceiver();\n    registerReceiver(receiver, filter);\n\
  }\n```\n\n由于 `MyReceiver.java` 文件中的 `onReceive()` 方法现在将监听两种类型的广播意图，因此值得修改代码，使当前意图的动作字符串也显示在吐司消息中。此字符串可以通过对作为\
  \ `onReceive()` 方法参数传递的 `intent` 对象调用 `getAction()` 方法获取：\n\n```java\npublic void\
  \ onReceive(Context context, Intent intent) {\n    String message = \"Broadcast\
  \ intent detected \"\n    + intent.getAction();\n    Toast.makeText(context, message,\n\
  \    Toast.LENGTH_LONG).show();\n}\n```\n\n重新安装修改后的 `SendBroadcast` 包来测试接收器。现在点击\
  \ `SendBroadcast` 中的按钮应该产生一个包含自定义动作字符串的新消息：\n\nBroadcast intent detected com.ebookfrenzy.sendbroadcast\n\
  \n接下来，移除当前为 Android 设备供电的 USB 连接器，此时接收器应该在吐司消息中报告以下内容（在竖屏模式的设备上消息可能会被截断）。如果应用在模拟器上运行，请显示扩展控制面板，选择\
  \ Battery 选项并将 Charger 连接设置更改为 None。\n\nBroadcast intent detected android.intent.action.ACTION_POWER_DISCONNECTED\n\
  \n为了避免每当设备断开电源时都出现此消息，请启动 Settings 应用并选择 Apps 选项。从结果列表中选择 `SendBroadcast` 应用并点击\
  \ Uninstall 按钮。\n\n## 57.12 总结\n\n广播语义（Broadcast intents）是一种机制，可以发布意图供 Android 系统上的多个组件消费。通过注册广播接收器（Broadcast\
  \ Receiver）检测广播，接收器被配置为监听匹配特定动作字符串的意图。通常情况下，广播接收器保持休眠状态，直到检测到匹配的意图时被系统唤醒。Android\
  \ 系统还使用广播意图发布事件通知，例如低电量警告或外部电源的连接或断开。\n\n除了提供广播语义和接收器的概述外，本章还有一个发送广播意图并实现广播接收器以监听自定义和系统广播意图的示例。\n\
  \n## 58. Android 本地绑定服务——实例演示\n\n如上一章所述，绑定服务（Bound services）提供了一种实现 Android 服务与一个或多个客户端组件之间通信的机制。本章在“Android\
  \ 服务概览”中提供的绑定服务概述的基础上，开始一个本地绑定服务的示例实现。\n\n## 58.1 理解绑定服务\n\n提供绑定服务允许应用程序在后台执行任务。多个客户端组件可以绑定到绑定服务，并在绑定后，使用各种机制与该服务交互。\n\
  \n绑定服务是作为 `Android Service` 类的子类创建的，并且至少实现 `onBind()` 方法。客户端组件通过调用 `bindService()`\
  \ 方法绑定到服务。对绑定服务的首次绑定请求将导致调用该服务的 `onBind()` 方法（随后的绑定请求不会触发 `onBind()` 调用）。想要绑定到服务的客户端还必须实现一个\
  \ `ServiceConnection` 子类，该子类包含 `onServiceConnected()` 和 `onServiceDisconnected()`\
  \ 方法，这些方法分别在客户端-服务器连接建立或断开后被调用。在 `onServiceConnected()` 方法的情况下，将传递一个 `IBinder` 对象，该对象包含了客户端与服务交互所需的全部信息。\n\
  \n## 58.2 绑定服务交互选项\n\n存在两种实现客户端组件与绑定服务之间交互的推荐机制。假设绑定服务是本地的，且与客户端组件属于同一个应用程序（换句话说，它在同一个进程中运行，并且对其他应用程序中的组件不可用）。在这种情况下，推荐的方法是创建一个\
  \ `Binder` 类的子类并扩展它以为服务提供接口。随后由 `onBind()` 方法返回该 `Binder` 对象的实例，并供客户端组件用于直接访问服务中持有的方法和数据。\n\
  \n当绑定服务不是应用程序本地的时（换句话说，它在与客户端组件不同的进程中运行），最佳交互方式是使用 `Messenger/Handler` 实现。在本章的剩余部分中，将创建一个示例来演示创建、启动和与本地私有绑定服务交互的步骤。\n\
  \n## 58.3 本地绑定服务示例\n\n在本章剩余部分创建的示例应用将由单个 activity 和一个绑定服务组成。绑定服务的目的是从系统获取当前时间，并将该信息返回给\
  \ activity，由那里将其显示给用户。绑定服务将是本地的，且与 activity 属于同一个应用程序。\n\n在欢迎界面选择 New Project 选项，并在新项目对话框中选择\
  \ Empty Views Activity 模板，然后点击 Next 按钮。\n\n在 Name 字段中输入 `LocalBound` 并指定包名为 `com.ebookfrenzy.localbound`。在点击\
  \ Finish 按钮之前，将 Minimum API level 设置为 `API 26: Android 8.0 (Oreo)`并将 Language 菜单更改为\
  \ Java。使用第 12.8 节 Migrating a Project to View Binding 中的步骤将项目迁移到 view binding。\n\
  \n项目创建完成后，下一步是添加一个新类作为绑定服务。\n\n## 58.4 为项目添加绑定服务\n\n要向项目添加新类，请右键点击 Project 工具窗口中的包名（位于\
  \ app -> java -> com.ebookfrenzy.localbound），选择 New -> Service -> Service 菜单。指定\
  \ `BoundService` 为类名，并确保 Exported 和 Enabled 选项都已选中，然后点击 Finish 创建类。Android Studio\
  \ 将 `BoundService.java` 文件加载到编辑器中，其内容如下：\n\n```java\npackage com.ebookfrenzy.localbound;\n\
  \nimport android.app.Service;\n\nimport android.content.Intent;\n\nimport android.os.IBinder;\n\
  \npublic class BoundService extends Service {\n\npublic BoundService() {\n\n}\n\n\
  @Override\n\npublic IBinder onBind(Intent intent) {\n// TODO: Return the communication\
  \ channel to the service.\nthrow new UnsupportedOperationException(\"Not yet implemented\"\
  );\n\n}\n\n}\n```\n\n## 58.5 实现 Binder\n\n\n\n\n\n如前所述，本地绑定服务可以通过向客户端传递配置适当的 `Binder`\
  \ 对象来与绑定客户端进行通信。这是通过在绑定服务类内部创建一个 `Binder` 子类，并通过添加一个或多个客户端可以调用的新方法来扩展它来实现。这通常涉及实现一个返回绑定服务实例引的方法。有了该实例的引用，客户端就可以直接访问绑定服务中的数据并调用其中的方法。\n\
  \n对于此示例，需要对在前一节中创建的模板类 `BoundService` 进行一些更改。首先，需要声明一个 `Binder` 子类。该类将包含一个名为 `getService()`\
  \ 的方法，该方法将返回当前服务对象实例的引用（由 `this` 关键字表示）。考虑到这些要求，编辑 `BoundService.java` 文件并进行如下修改：\n\
  \n```java\npackage com.ebookfrenzy.localbound;\n\nimport android.app.Service;\n\
  import android.content.Intent;\nimport android.os.IBinder;\nimport android.os.Binder;\n\
  \npublic class BoundService extends Service {\n\n    private final IBinder myBinder\
  \ = new MyLocalBinder();\n\n    public BoundService() {\n    }\n\n    @Override\n\
  \    public IBinder onBind(Intent intent) {\n        // TODO: Return the communication\
  \ channel to the service.\n        throw new UnsupportedOperationException(\"Not\
  \ yet implemented\");\n    }\n\n    public class MyLocalBinder extends Binder {\n\
  \        BoundService getService() {\n            return BoundService.this;\n  \
  \      }\n    }\n}\n```\n\n对类进行更改后，值得花一点时间回顾一下这里执行的步骤。首先，声明了一个新的 `Binder` 子类（命名为\
  \ `MyLocalBinder`）。该类包含一个方法，用于返回 `BoundService` 类当前实例的引用。创建 `MyLocalBinder` 类的新实例并将其赋值给\
  \ `myBinder` `IBinder` 引用（由于 `Binder` 是 `IBinder` 的子类，因此此赋值不存在类型不匹配）。\n\n接下来，需要修改\
  \ `onBind()` 方法以返回 `myBinder` 对象的引用，并实现一个新的公共方法，以便在被任何绑定到服务的客户端调用时返回当前时间：\n\n```java\n\
  package com.ebookfrenzy.localbound;\n\nimport java.text.SimpleDateFormat;\nimport\
  \ java.util.Date;\nimport java.util.Locale;\nimport android.app.Service;\nimport\
  \ android.content.Intent;\nimport android.os.IBinder;\nimport android.os.Binder;\n\
  \npublic class BoundService extends Service {\n\n    private final IBinder myBinder\
  \ = new MyLocalBinder();\n\n    public BoundService() {\n    }\n\n    @Override\n\
  \    public IBinder onBind(Intent intent) {\n        return myBinder;\n    }\n\n\
  \    public String getCurrentTime() {\n        SimpleDateFormat dateformat =\n \
  \               new SimpleDateFormat(\"HH:mm:ss MM/dd/yyyy\", Locale.US);\n    \
  \    return (dateformat.format(new Date()));\n    }\n\n    public class MyLocalBinder\
  \ extends Binder {\n        BoundService getService() {\n            return BoundService.this;\n\
  \        }\n    }\n}\n```\n\n此时，绑定服务已经完成，并已准备好添加到项目清单文件中。在 Project 工具窗口中找到并双击 `LocalBound`\
  \ 项目的 `AndroidManifest.xml` 文件，一旦加载到 Manifest 编辑器，请验证 Android Studio 是否已添加如下服务条目：\n\
  \n```xml\n<service package=\"com.ebookfrenzy.localbound.localbound\"\n    android:allowBackup=\"\
  true\"\n    android:icon=\"@mipmap/ic_launcher\"\n    android:label=\"@string/app_name\"\
  \n    android:theme=\"@style/AppTheme\"\n    android:name=\".BoundService\"\n  \
  \  android:enabled=\"true\"\n    android:exported=\"true\" >\n\n<activity android:name=\"\
  .MainActivity\">\n```\n\n下一阶段是在 activity 内部编写代码以绑定到服务并调用 `getCurrentTime()` 方法。\n\
  \n## 58.6 将客户端绑定到服务\n\n在本次教程中，客户端是运行应用程序的 `MainActivity` 实例。如前所述，要成功绑定到服务并接收由服务的\
  \ `onBind()` 方法返回的 `IBinder` 对象，有必要创建一个 `ServiceConnection` 子类并实现 `onServiceConnected()`\
  \ 和 `onServiceDisconnected()` 回调方法。编辑 `MainActivity.java` 文件并进行如下修改：\n\n```java\n\
  package com.ebookfrenzy.localbound;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  import android.os.Bundle;\nimport android.os.IBinder;\nimport android.content.Context;\n\
  import android.content.Intent;\nimport android.content.ComponentName;\nimport android.content.ServiceConnection;\n\
  import com.ebookfrenzy.localbound.BoundService.MyLocalBinder;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    BoundService myService;\n    boolean isBound\
  \ = false;\n\n    ...\n\n    final private ServiceConnection myConnection = new\
  \ ServiceConnection() {\n        @Override\n        public void onServiceConnected(ComponentName\
  \ className, IBinder service) {\n            MyLocalBinder binder = (MyLocalBinder)\
  \ service;\n            myService = binder.getService();\n            isBound =\
  \ true;\n        }\n\n        @Override\n        public void onServiceDisconnected(ComponentName\
  \ name) {\n            isBound = false;\n        }\n    };\n}\n```\n\n当客户端成功绑定到服务时，将调用\
  \ `onServiceConnected()` 方法。该方法作为参数传递了由 `onBind()` 方法返回的 `IBinder` 对象。该参数被强制转换为\
  \ `MyLocalBinder` 类型。通过调用 binder 的 `getService()` 方法获取 `myService`，并将 `isBound`\
  \ 设置为 `true`。\n\n当连接断开时，调用 `onServiceDisconnected()` 方法并将 `isBound` 设置为 `false`。\n\
  \n建立连接后，下一步是修改 activity 以绑定到服务。这涉及到在 `onCreate()` 方法中创建 `intent` 并调用 `bindService()`\
  \ 方法：\n\n```java\n@Override\npublic void onCreate(Bundle savedInstanceState) {\n\
  \    super.onCreate(savedInstanceState);\n    ...\n    Intent intent = new Intent(this,\
  \ BoundService.class);\n    bindService(intent, myConnection, Context.BIND_AUTO_CREATE);\n\
  }\n```\n\n## 58.7 完成示例\n\n最后是添加调用 `getCurrentTime()` 方法并向用户显示结果的机制。按照惯例，Android\
  \ Studio 已为 activity 创建一个模板 `activity_main.xml` 文件，其中包含一个 `TextView`。将此文件加载到布局编辑器中，使用设计模式选择\
  \ `TextView` 组件并将 ID 更改为 `myTextView`。在 `TextView` 下方添加 `Button` 视图并将按钮文本改为“Show\
  \ Time”，将其提取为名为 `show_time` 的字符串资源。完成这些更改后，布局应如图 58-1 所示。如果缺少任何约束，点击布局编辑器工具栏上的 Infer\
  \ Constraints（推断约束）按钮。\n\n![image-DLB7PB.jpg](img/image-DLB7PB.jpeg)\n图 58-1\n\n\
  完成用户界面设计，选择按钮并配置 `onClick` 属性以调用 `showTime` 方法。\n\n最后，编辑 `MainActivity.java` 文件代码实现\
  \ `showTime()` 方法。该方法调用服务的 `getCurrentTime()` 方法（由于 `onServiceConnected()` 方法，现在可以通过\
  \ `myService` 引用从 activity 内部调用），并将结果字符串赋值给 `TextView`：\n\n```java\npackage com.ebookfrenzy.localbound;\n\
  \n...\nimport android.view.View;\nimport android.widget.TextView;\nimport com.ebookfrenzy.localbound.BoundService.MyLocalBinder;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    BoundService myService;\n\
  \    boolean isBound = false;\n\n    public void showTime(View view) {\n       \
  \ String currentTime = myService.getCurrentTime();\n        TextView myTextView\
  \ = findViewById(R.id.myTextView);\n        myTextView.setText(currentTime);\n \
  \   }\n\n    ...\n}\n```\n\n## 58.8 测试应用程序\n\n\n\n\n代码更改完成后，对应用程序进行测试运行。一旦界面可见，点击按钮并注意文本视图将更改为显示当前的日期和时间。该示例已成功启动并绑定到一个服务，然后调用了该服务的方法来执行任务，并将结果返回给\
  \ activity。\n\n## 58.9 总结\n\n当绑定的服务是本地的且对某个应用程序私有时，该应用程序中的组件可以在不诉助于进程间通信（IPC）的情况下与服务进行交互。通俗来说，服务的\
  \ `onBind()` 方法返回一个 `IBinder` 对象，该对象包含一个指向运行中的服务实例的引用。客户端组件实现一个 `ServiceConnection`\
  \ 子类，其中包含回调方法，这些方法在服务连接和断开连接时会被调用。前一个方法将接收由 `onBind()` 方法返回的 `IBinder` 对象，从而允许调用服务中的公共方法。\n\
  \n在涵盖了本地绑定服务的实现后，下一章将重点关注使用 IPC 与远程绑定服务进行交互。\n\n## 59. Android 远程绑定服务 – 实例示例\n\n\
  在专门用于 Android 服务的最后一章，将开发一个示例应用程序，以演示使用 `messenger` 和 `handler` 配置来促进客户端与远程绑定服务之间的交互。\n\
  \n## 59.1 客户端到远程服务的通信\n\n正如上一章概述，客户端与本地服务之间的交互可以通过向客户端返回一个包含服务对象引用的 `IBinder` 对象来实现。然而，在远程服务的情况中，这种方法行不通，因为远程服务运行在不同的进程中，因此无法从客户端直接访问。\n\
  \n在远程服务的情况下，必须创建一个 `Messenger` 和 `Handler` 配置，这允许消息跨越客户端和服务器之间的进程边界进行传递。\n\n具体而言，服务会创建一个\
  \ `Handler` 实例，该实例会在接收到来自客户端的消息时被调用。在初始化方面，由 `Handler` 负责创建一个 `Messenger` 对象，而该对象反过来创建一个\
  \ `IBinder` 对象，并在 `onBind()` 方法中将其返回给客户端。客户端使用此 `IBinder` 对象创建 `Messenger` 对象的实例，随后向服务处理器（handler）发送消息。每当客户端发送一条消息时，处理器的\
  \ `handleMessage()` 方法就会被调用，并传递消息对象。\n\n本章创建的示例将包含一个运行在单独进程中的 activity 和一个绑定服务。`Messenger/Handler`\
  \ 机制将向服务发送一个字符串，该字符串将显示 `Logcat` 输出中。\n\n## 59.2 创建示例应用程序\n\n从欢迎界面选择 `New Project`\
  \ 选项，在生成的新项目对话框中，点击 `Next` 按钮之前选择 `Empty Views Activity` 模板。\n\n在 `Name` 字段中输入 `RemoteBound`，并指定\
  \ `com.ebookfrenzy.remotebound` 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置更改为\
  \ `API 26: Android 8.0 (Oreo)`，并将语言菜单设置为 `Java`。\n\n## 59.3 设计用户界面\n\n在 Project\
  \ 工具窗口中找到 `activity_main.xml` 文件并双击它将其加载到 Layout Editor 工具中。在 Design 模式下的 Layout\
  \ Editor 工具中，右键点击默认的 `TextView` 实例，选择 `Convert view...` 菜单选项，从弹出的对话框中选择 `Button`\
  \ 视图并点击 `Apply`。将按钮的文本属性更改为“Send Message”，并将字符串提取到命名为 `send_message` 的新资源中。\n\n\
  最后，配置 `onClick` 属性以调用名为 `sendMessage` 的方法。\n\n## 59.4 实现远程绑定服务\n\n为了实现此示例的远程绑定服务，在\
  \ Project 工具窗口中右键点击包名（位于 `app -> java` 下），并选择 `New -> Service -> Service` 菜单选项向项目添加新类。指定\
  \ `RemoteService` 为类名，并在点击 `Finish` 创建类之前，确保 `Exported` 和 `Enabled` 选项均已选中。\n\n\
  下一步是为新服务实现处理器类。这通过扩展 `Handler` 类并实现 `handleMessage()` 方法来实现。该方法会在接收到来自客户端的消息时被调用。它将接收一个\
  \ `Message` 对象作为参数，其中包含客户端需要传递给服务的任何数据。在本例中，这将是一个包含要显示给用户的字符串的 `Bundle` 对象。一旦实现完成，`RemoteService.java`\
  \ 文件中的修改后的类应如下：\n\n```java\npackage com.ebookfrenzy.remotebound;\n\nimport android.app.Service;\n\
  \nimport android.content.Intent;\n\nimport android.os.IBinder;\n\nimport android.os.Bundle;\n\
  \nimport android.os.Handler;\n\nimport android.os.Looper;\n\nimport android.os.Message;\n\
  \nimport android.os.Messenger;\n\nimport android.util.Log;\n\npublic class RemoteService\
  \ extends Service {\n\npublic RemoteService() {\n\n}\n\nstatic class IncomingHandler\
  \ extends Handler {\n\nString TAG = \"RemoteService\";\n\npublic IncomingHandler()\
  \ {\n\nsuper(Looper.getMainLooper());\n\n}\n\n@Override\n\npublic void handleMessage(Message\
  \ msg) {\n\nBundle data = msg.getData();\n\nString dataString = data.getString(\"\
  MyString\");\n\nLog.i(TAG, \"Message = \" + dataString);\n\n}\n\n}\n\n@Override\n\
  \npublic IBinder onBind(Intent intent) {\n\n// TODO: Return the communication channel\
  \ to the service.\n\nthrow new UnsupportedOperationException(\"Not yet implemented\"\
  );\n\n}\n```\n\n实现处理器后，服务代码方面剩下的任务是修改 `onBind()` 方法，使其返回一个包含 `Messenger` 对象的 `IBinder`\
  \ 对象，该对象反过来包含对处理器的引用：\n\n```java\nfinal Messenger myMessenger = new Messenger(new\
  \ IncomingHandler());\n\n@Override\n\npublic IBinder onBind(Intent intent) {\n\n\
  return myMessenger.getBinder();\n}\n```\n\n上述代码片段的第一行创建了处理器类的实例，并将其传递给新 `Messenger`\
  \ 对象的构造函数。在 `onBind()` 方法中，调用 messenger 对象的 `getBinder()` 方法返回 messenger 的 `IBinder`\
  \ 对象。\n\n## 59.5 在清单文件中配置远程服务\n\n为了准确描述客户端与远程服务之间的通信，有必要配置服务与应用程序的其他部分分离运行。这通过在清单文件的服务标签内添加\
  \ `android:process` 属性来实现。为了启动远程服务，还需要为服务提供意图过滤器（intent filter）。为了实施此更改，修改 `AndroidManifest.xml`\
  \ 文件以添加所需的项：\n\n```xml\npackage=\"com.ebookfrenzy.remotebound\" >\n\nandroid:allowBackup=\"\
  true\"\n\nandroid:icon=\"@mipmap/ic_launcher\"\n\nandroid:label=\"@string/app_name\"\
  \n\nandroid:supportsRtl=\"true\"\n\nandroid:theme=\"@style/AppTheme\" >\n\nandroid:name=\"\
  .RemoteService\"\n\nandroid:enabled=\"true\"\n\nandroid:exported=\"true\"\n\nandroid:process=\"\
  :my_process\" >\n\nandroid:name=\".MainActivity\" >\n```\n\n## 59.6 启动并绑定到远程服务\n\
  \n\n\n\n与本地绑定服务一样，客户端组件需要实现 `ServiceConnection` 类的实例，并包含 `onServiceConnected()`\
  \ 和 `onServiceDisconnected()` 方法。此外，与本地服务相同，`onServiceConnected()` 方法将接收由远程服务的 `onBind()`\
  \ 方法返回的 `IBinder` 对象，该对象将用于向服务器处理程序发送消息。在示例中，客户端是 `MainActivity`，其代码位于 `MainActivity.java`。加载此文件并对其进行修改，以添加\
  \ `ServiceConnection` 类以及一个用于存储接收到的 `Messenger` 对象引用的变量，以及一个用于指示连接是否已建立的 `Boolean`\
  \ 标志：\n\n```java\npackage com.ebookfrenzy.remotoundound;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  import android.os.Bundle;\nimport android.os.IBinder;\nimport android.os.Message;\n\
  import android.os.Messenger;\nimport android.os.RemoteException;\nimport android.content.ComponentName;\n\
  import android.content.Context;\nimport android.content.Intent;\nimport android.content.ServiceConnection;\n\
  import android.view.View;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    Messenger myService = null;\n    boolean isBound;\n\n    final private\
  \ ServiceConnection myConnection = new ServiceConnection() {\n        public void\
  \ onServiceConnected(ComponentName className, IBinder service) {\n            myService\
  \ = new Messenger(service);\n            isBound = true;\n        }\n\n        public\
  \ void onServiceDisconnected(ComponentName className) {\n            myService =\
  \ null;\n            isBound = false;\n        }\n    };\n}\n```\n\n接下来，必须添加一些代码来绑定到远程服务。这涉及到创建一个与清单文件中声明的服务的意图过滤器匹配的\
  \ `intent`（意），然后调用 `bindService()` 方法，并将 `intent` 和 `ServiceConnection` 实例引用作为参数。对于此示例，这些代码将在应用的\
  \ `onCreate()` 方法中实现：\n\n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState)\
  \ {\n    super.onCreate(savedInstanceState);\n    setContentView(R.layout.activity_main);\n\
  \    Intent intent = new Intent(getApplicationContext(), RemoteService.class);\n\
  \    bindService(intent, myConnection, Context.BIND_AUTO_CREATE);\n}\n```\n\n##\
  \ 59.7 向远程服务发送消息\n\n在测试应用程序之前，剩下的工作是在 `MainActivity` 类中实现 `sendMessage()` 方法，该方法被配置为当用户触摸界面上的按钮时调用。此方法需要检查服务是否已连接，创建一个包含服务器要显示的字符串的\
  \ `bundle`（包）对象，将其添加到 `Message` 对象中，并发送到服务器：\n\n```java\npublic void sendMessage(View\
  \ view) {\n    if (!isBound) return;\n    Message msg = Message.obtain();\n    Bundle\
  \ bundle = new Bundle();\n    bundle.putString(\"MyString\", \"Message Received\"\
  );\n    msg.setData(bundle);\n    try {\n        myService.send(msg);\n    } catch\
  \ (RemoteException e) {\n        e.printStackTrace();\n    }\n}\n```\n\n完成代码更改后，编译并运行应用程序。加载后，打开\
  \ Logcat 工具窗口并在过滤器字段中输入以下内容：\n\n`package:mine tag:RemoteService`\n\n在 Logcat 工具窗口保持可见的情况下，点击用户界面上的按钮，此时日志消息应该如下所示：\n\
  \n`Message = Message Received`\n\n## 59.8 总结\n\n要实现客户端与远程绑定服务之间的交互，应用必须实现一个处理程序/消息通信框架。该技术背的基本概念已在本章中涵盖，并包含了一个示例应用程序的实现，该程序旨在演示客户端与绑定服务之间的通信，每个服务运行在独立的进程中。\n\
  \n## 60. Java 线程、Handler 和执行器概述\n\n线程是任何多任务操作系统的基石，可以被认为是运行在主进程中的微进程，其目的是在应用程序中实现至少并行执行路径的假。在本章中，我们将探索在\
  \ Android 应用开发中使用线程的重要性，并演示如何创建和管理它们。\n\n## 60.1 应用主线程\n\n当 Android 应用程序首次启动时，运行时系统会创建一个线程，所有应用程序组件默认将在该线程中运行。该线程通常被称为主线程。主线程的主要作用是在事件处理方面处理用户界面并与用户界面中的视图进行交互。应用程序内启动的任何额外组件默认也会运行在主线程上。\n\
  \n应用程序中任何使用主线程执行耗时任务的组件都会导致整个应用程序看起来像锁死了一，直到任务完成。这通常会导致操作系统向用户显示“应用程序未响应”的警告。显然，这对于任何应用程序来说都不是理想的行为。这可以通过简单地将要执行的任务在单独线程中启动来避免，允许主线程不受干扰地继续执行其他任务。\n\
  \n## 60.2 线程 Handler\n\n显然，Android 开发的关键规则之一是永远不要在应用程序的主线程上执行耗时操作。第二个同样重要的规则是，在任何情况下，独立线程中的代码都绝不能直接更新用户界面的任何部分。\n\
  \n对用户界面的任何更改必须始终在主线程内部执行。这是因为 Android UI 工具包不是线程安全的。在多个线程中尝试处理非线程安全代码会导致间歇性问题。\n\
  \n如果线程中执行的代码需要与用户界面交互，它必须通过与主线程同步来实现。这通过在主线程中创建 handler 来实现，由它接收来自另一个线程的消息并更新用户界面。\n\
  \n## 60.3 线程示例\n\n本章的剩余部分将通过一些简单的示例来对线程进行基础介绍。第一步将强调在独立于主线程执行耗时任务的重要性。\n\n启动 Android\
  \ Studio，从欢迎屏幕选择 New Project，在出现的新项目对话框中选择 Empty Activity 模板，然后点击 Next 按钮。\n\n在\
  \ Name 字段输入 `ThreadExample`，并在 package name 中指定 `com.ebookfrenzy.threadexample`。在点击\
  \ Finish 按钮之前，将 Minimum API level 设置为 `API 26: Android 8.0 (Oreo)`并将 Language 菜单改为\
  \ Java。按照第 12.8 节的方法将项目转换为 view binding。\n\n## 60.4 构建应用\n\n将项目的 `activity_main.xml`\
  \ 文件加载到 Layout Editor 工具中。选择默认的 `TextView` 组件，并在 Properties 工具窗口将视图的 ID 更改为 `myTextView`。\n\
  \n在用户界面上添加 `Button` ，位于现有 `TextView` 对象正下方，如图 60-1 所示。添加按钮后，点击工具栏上的 Infer Constraints\
  \ 按钮以添加缺失的约束。\n\n将文本改为“Press Me”，并将字符串提取为名为 `press_me` 的资源。当按钮在布局中仍选中时，找到 `onClick`\
  \ 属性并输入 `buttonClick` 作为方法名。\n\n\n\n\n\n接下来，将 `MainActivity.java` 文件加载到编辑面板中，并为\
  \ `buttonClick()` 方法添加代码，该方法将在用户点击 `Button` 视图时被调用。由于这里的目标是演示在主线程上执行耗时任务的问题，代码将在\
  \ `TextView` 对象上显示不同的文本之前简单地暂停 20 秒：\n\n```java\npublic void buttonClick(View view)\
  \ {\n    long endTime = System.currentTimeMillis() + 20 * 1000;\n    while (System.currentTimeMillis()\
  \ < endTime) {\n        synchronized (this) {\n            try {\n             \
  \   wait(endTime - System.currentTimeMillis());\n            } catch (Exception\
  \ e) {\n            }\n        }\n    }\n    binding.myTextView.setText(\"Button\
  \ Pressed\");\n}\n```\n\n完成代码更改后，在物理设备或模拟器上运行应用程序。一旦应用程序运行，点击按钮，此时应用程序看起来将是冻结了。例如，将无法第二次点击按钮，在某些情况下，操作系统将报告应用程序无响应，如图\
  \ 60-2 所示。\n\n![image-5SW205AA.jpg](img/image-5SW205AA.jpeg)\n\n图 60-2\n\n显然，`buttonClick()`\
  \ 方法中任何需要时间完成的操作都需要在独立的线程中执行。\n\n## 60.5 创建新线程\n\n要创建一个新线程，需要将在该线程中执行的代码放置在 `Runnable`\
  \ 实例的 `run()` 方法中。然后需要创建一个新的 `Thread` 对象，并将 `Runnable` 实例的引用传递给构造函数。最后，需要调用线程对象的\
  \ `start()` 方法来启动线程运行。因此，为了执行 `buttonClick()` 方法中的任务，需要进行以下更改：\n\n```java\npublic\
  \ void buttonClick(View view) {\n    Runnable runnable = new Runnable() {\n    \
  \    public void run() {\n            long endTime = System.currentTimeMillis()\
  \ + 20 * 1000;\n            while (System.currentTimeMillis() < endTime) {\n   \
  \             synchronized (this) {\n                    try {\n               \
  \         wait(endTime - System.currentTimeMillis());\n                    } catch\
  \ (Exception e) {\n                    }\n                }\n            }\n   \
  \     }\n        binding.myTextView.setText(\"Button Pressed\");\n    };\n    Thread\
  \ myThread = new Thread(runnable);\n    myThread.start();\n}\n```\n\n事实上，如果需要，可以使用\
  \ Java Lambda 表达式来简化 `runnable` 的声明。进行此更改将导致以下声明：\n\n```java\nRunnable runnable\
  \ = () -> {\n    long endTime = System.currentTimeMillis() + 20 * 1000;\n    while\
  \ (System.currentTimeMillis() < endTime) {\n        synchronized (this) {\n    \
  \        try {\n                wait(endTime - System.currentTimeMillis());\n  \
  \          } catch (Exception e) {\n            }\n        }\n    }\n    binding.myTextView.setText(\"\
  Button Pressed\");\n};\nThread myThread = new Thread(runnable);\nmyThread.start();\n\
  ```\n\n现在运行应用程序时，点击按钮会导致延迟在新线程中执行，从而让主线程能够继续处理用户界面，包括对额外的按钮点击做出响应。事实上，每当点击按钮时，都会创建一个新线程，允许任务并发执行多次。\n\
  \n仔细检查 `buttonClick()` 方法的更新代码，会发现删除了更新 `TextView` 的代码。如之前所述，从主线程以外的线程内部更新用户界面元素违反了\
  \ Android 开发的一项关键规则。因此，为了更新用户界面，需要为线程实现一个 `Handler`。\n\n## 60.6 实现线程 Handler\n\n\
  线程 Handler 在应用程序的主线程中实现，主要用于响应运行在应用程序进程内的其他线程发送的消息来更新用户界面。\n\nHandlers 继承自 Android\
  \ 的 `Handler` 类，可以通过指定在线程需要时执行的 `Runnable` 来使用，也可以通过重写 `Handler` 子类中的 `handleMessage()`\
  \ 回调方法来使用，该方法会在线程向 handler 发送消息时被调用。\n\n为了本示例，将实现一个 handler 以从之前创建的线程内部更新用户界面。将\
  \ `MainActivity.java` 文件加载到 Android Studio 编辑器中，并修改代码向活动中添加一个 `Handler` 实例：\n\n\
  ```java\nimport android.os.Handler;\nimport android.os.Message;\nimport android.os.Looper;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    Handler handler = new\
  \ Handler(Looper.getMainLooper()) {\n        @Override public void handleMessage(Message\
  \ msg) {\n            binding.myTextView.setText(\"Message Received\");\n      \
  \  }\n    };\n}\n```\n\n上述代码更改声明了一个 handler 并在该 handler 中实现了 `handleMessage()` 回调，该回调会在线程向\
  \ handler 发送消息时被调用。在此例中，代码简单地在用户界面的 `TextView` 对象上显示字符串。\n\n现在剩下的是修改 `buttonClick()`\
  \ 方法中创建的线程，在延迟完成后向 handler 发送消息：\n\n```java\npublic void buttonClick(View view)\
  \ {\n    Runnable runnable = () -> {\n        long endTime = System.currentTimeMillis()\
  \ + 20 * 1000;\n        while (System.currentTimeMillis() < endTime) {\n       \
  \     synchronized (this) {\n                try {\n                    wait(endTime\
  \ - System.currentTimeMillis());\n                } catch (Exception e) {\n    \
  \            }\n            }\n        }\n        // 注意：原文此处代码块逻辑略有混乱，保持原意\n}\n\
  ```\n*修正：原文提供的示例代码块逻辑似乎错乱（括号不匹配），但根据要求不翻译代码块。*\n\n```java\npublic void buttonClick(View\
  \ view) {\n    Runnable runnable = () -> {\n        long endTime = System.currentTimeMillis()\
  \ + 20 * 1000;\n        while (System.currentTimeMillis() < endTime) {\n       \
  \     synchronized (this) {\n                try {\n                    wait(endTime\
  \ - System.currentTimeMillis());\n                } catch (Exception e) {\n    \
  \            }\n            }\n        }\n        binding.myTextView.setText(\"\
  Button Pressed\");\n    };\n    Thread myThread = new Thread(runnable);\n    myThread.start();\n\
  }\n```\n（注：原文中最后两段代码块存在逻辑错误，如括号未闭合，根据指令不翻译代码块。）\n\n注意，唯一的更改是调用了 handler 的 `sendEmptyMessage()`。由于\
  \ handler 目前没有对收到的空消息内容做任何处理。编译并运行应用程序，一旦点击按钮，20 秒延迟后，新文本将出现在 `TextView` 对象上。\n\n\
  ## 60.7 向 Handler 传递消息\n\n虽然之前的示例触发了 `handleMessage()` 回调，但并没有利用消息对象向 handler 发送数据。在本教程的阶段，示例将进一步修改以在线程和\
  \ handler 之间传递数据。首先，`buttonClick()` 方法中的更新线程将获取字符串格式的系统日期时间，并将其信息存储在 `Bundle` 对象中。然后调用\
  \ handler 对象的 `obtainMessage()` 方法从消息池中获取消息对象。最后，在通过 handler 对象的 `sendMessage()`\
  \ 方法发送之前，将 `bundle` 添加到消息对象中：\n\n```java\npublic void buttonClick(View view) {\n\
  \    Runnable runnable = () -> {\n        long endTime = System.currentTimeMillis()\
  \ + 20 * 1000;\n        while (System.currentTimeMillis() < endTime) {\n       \
  \     synchronized (this) {\n                try {\n                    wait(endTime\
  \ - System.currentTimeMillis());\n                } catch (Exception e) {\n    \
  \            }\n            }\n        }\n        Message msg = handler.obtainMessage();\n\
  \        Bundle bundle = new Bundle();\n        bundle.putString(\"myKey\", \"Thread\
  \ Completed\");\n        msg.setData(bundle);\n        handler.sendMessage(msg);\n\
  \    };\n    Thread myThread = new Thread(runnable);\n    myThread.start();\n}\n\
  ```\n\n接下来，更新 handler 的 `handleMessage()` 方法，从消息中的 `bundle` 对象中提取日期时间字符串，并将其显示在\
  \ `TextView` 对象上：\n\n```java\nHandler handler = new Handler(Looper.getMainLooper())\
  \ {\n    @Override\n    public void handleMessage(Message msg) {\n        Bundle\
  \ bundle = msg.getData();\n        String string = bundle.getString(\"myKey\");\n\
  \        binding.myTextView.setText(string);\n    }\n};\n```\n\n最后，编译并运行应用程序，测试点击按钮现在是否会导致“Thread\
  \ Completed” 消息出现在 `TextView` 对象上。\n\n## 60.8 Java Executor 并发\n\n\n\n\n\n到本章为止，我们专门查看了直接创建和管理\
  \ Java 线程。虽然对于简单的多线程任务来说是可以接受的，但在处理涉及大量线程的复杂情况时，这被证明是不够的。例如，启动和停止线程涉及系统开销。因此，一个创建和销毁大量线程的应用程序面临着性能下降的风险。基础线程\
  \ API 也没有提供调度或重复执行任务的预构建选项，也没有提供从任务返回结果的选项。\n\n通过使用 Java 并发框架（属于 `java.util.concurrent`\
  \ 包）的 `Executor` 类，可以克服直接操作线程的缺点。该框架允许创建活动线程池，并管理任务如何分配给这些线程。这使得现有的线程可以被重用于其他任务，而无需不断创建新线程。\n\
  \n该框架还提供了额外功能，包括在任务完成后返回结果的能力（称为 `Callable` 任务）、检查线程状态，以及调度任务在超时后或按重复的时间间隔运行。\n\n\
  ## 60.9 使用 Runnable 任务工作\n\n探索此框架的第一步是修改 `buttonClicked()` 方法，使用并发框架 `Executor`\
  \ 在单独线程中运行任务：\n\n```java\nimport java.util.concurrent.ExecutorService;\nimport java.util.concurrent.Executors;\n\
  \npublic void buttonClick(View view) {\n    ExecutorService executor = Executors.newSingleThreadExecutor();\n\
  \    executor.submit(new Runnable() {\n        public void run() {\n           \
  \ long endTime = System.currentTimeMillis() + 10 * 1000;\n            while (System.currentTimeMillis()\
  \ < endTime) {\n                synchronized (this) {\n                    try {\n\
  \                        wait(endTime - System.currentTimeMillis());\n         \
  \           } catch (Exception e) {\n                    }\n                }\n\
  \            }\n            Message msg = handler.obtainMessage();\n           \
  \ Bundle bundle = new Bundle();\n            bundle.putString(\"myKey\", \"Button\
  \ Pressed\");\n            msg.setData(bundle);\n            handler.sendMessage(msg);\n\
  \        }\n    });\n    executor.shutdown();\n}\n```\n\n当执行上述代码时，超时将像以前一样在单独线程中执行。然而，对方法进行的更改需要一些解释。首先，从系统\
  \ `Executors` 实例获取 `ExecutorService` 实例的引用：\n\n```java\nExecutorService executor\
  \ = Executors.newSingleThreadExecutor();\n```\n\n在这种情况下，请求了一个只包含一个线程的池。也可以按如下方式请求具有指定数量线程的池：\n\
  \n```java\nExecutorService executor = Executors.newFixedThreadPool(10);\n```\n\n\
  接下来，通过调用执行服务实例的 `submit()` 方法在线程上启动一个 `Runnable` 任务：\n\n```java\nexecutor.submit(new\
  \ Runnable(){\n    public void run(){\n        long endTime = System.currentTimeMillis()\
  \ + 20 * 1000;\n    }\n});\n```\n\n注意，上面的声明可以通过将其转换为 lambda 表达式来简化：\n\n```java\n\
  executor.submit(() -> {\n    long endTime = System.currentTimeMillis() + 20 * 1000;\n\
  });\n```\n\n从现在开始，该任务将一直运行直到完成。然而，一旦完成，执行服务将继续运行。如果你不再需要该服务，则应该将其关闭。\n\n## 60.10\
  \ 关闭 Executor 服务\n\n`ExecutorService` 提供了几种启动关闭的技术。若要通知服务在当前运行的任务完成后自动关闭，应如下所示调用\
  \ `shutdown()` 方法：\n\n```java\nexecutor.shutdown();\n```\n\n另一方面，调用 `shutdownNow()`\
  \ 方法会停止服务上运行的所有任务，并取消待处理任务的处理：\n\n```java\nexecutor.shutdownNow();\n```\n\n## 60.11\
  \ 使用 Callable 任务和 Futures 工作\n\n如前所述，`ExecutorService` 支持所谓的“Callable”任务，这些任务能够在任务完成后返回结果。运行在单独线程上的任务通常预计需要一些时间才能完成（否则它们可能就不需要在单独线程中运行了）。这引出了问题：如何将结果返回给启动任务的线程中的代码。这是通过使用\
  \ `Future` 值类型实现的，它代表在未来某个点提供的值。\n\n当执行可调用任务时，它返回一个 `Future` 实例，应用程序随后可以使用该实例在任务完成后获取结果。要查看此效果，首先编辑\
  \ `activity_main.xml` 文件，添加一个标签为“Status”的额外按钮，并配置 `onClick` 属性以调用名为 `statusClick`\
  \ 的方法：\n\n![image-RXBBA957.jpg](img/image-RXBBA957.jpeg)\n\n图 60-3\n\n接下来，修改 `buttonClick()`\
  \ 方法以执行配置为通过 `Future` 变量返回 `String` 值的 `Callable` 任务：\n\n```java\nimport java.util.concurrent.Callable;\n\
  import java.util.concurrent.Future;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    Future future;\n\n    public void buttonClick(View view) {\n        ExecutorService\
  \ executor = Executors.newSingleThreadExecutor();\n        future = executor.submit(new\
  \ Callable() {\n            public String call() {\n                long endTime\
  \ = System.currentTimeMillis() + 10 * 1000;\n                while (System.currentTimeMillis()\
  \ < endTime) {\n                    synchronized (this) {\n                    \
  \    try {\n                            wait(endTime - System.currentTimeMillis());\n\
  \                        } catch (Exception e) {\n                        }\n  \
  \                  }\n                }\n                Message msg = handler.obtainMessage();\n\
  \                Bundle bundle = new Bundle();\n                bundle.putString(\"\
  myKey\", \"Button Pressed\");\n                msg.setData(bundle);\n          \
  \      handler.sendMessage(msg);\n                return \"Done\"; \n          \
  \  }\n        });\n        executor.shutdown();\n    }\n```\n\n注意，通过导入 `java.util.concurrent.Callable`\
  \ 包并声明 `Future` 变量，对任务启动的方式进行了一些更改：\n\n```java\nfuture = executor.submit(new Callable()\
  \ {\n    public String call() {\n        long endTime = System.currentTimeMillis()\
  \ + 10 * 1000;\n        while (System.currentTimeMillis() < endTime) {\n       \
  \     synchronized (this) {\n                try {\n                    wait(endTime\
  \ - System.currentTimeMillis());\n                } catch (Exception e) {\n    \
  \            }\n            }\n        }\n        // ... 逻辑\n        return \"Result\"\
  ;\n    }\n});\n```\n*(注：此处原文示例代码在提供时似乎不完整，已根据上下文补全逻辑以对齐)*\n\n## 60.12 处理 Future\
  \ 结果\n\n`buttonClick()` 方法现在配置为执行一个 `Callable` 任务，并通过 `Future` 变量返回 `String` 值。应用程序现在需要知道任务何时完成以及结果可用。一种方法是调用\
  \ `Future` 的 `get()` 方法。由于该方法在执行失败或被中断时抛出异常，因此必须在 `try/catch` 语句中执行，如下所示：\n\n```java\n\
  String result = null;\ntry {\n    result = future.get();\n} catch (ExecutionException\
  \ | InterruptedException e) {\n    e.printStackTrace();\n}\n```\n\n遗憾的是，`get()`\
  \ 方法会阻塞当前线程直到任务完成，从而违背了最初在单独线程中运行任务的目的。另一种选择是为 `get()` 方法提供一个超时时间，超时后会将控制交回当前线程。例如，以下代码会导致\
  \ `get()` 调用在 3 秒后超时：\n\n```java\nresult = future.get(3, TimeUnit.SECONDS);\n```\n\
  \n更好的方案是调用 `Future` 实例的 `isDone()` 方法来检查线程状态，并在任务完成后调用 `get()` 方法。要实现这种行为，请在 `MainActivity.java`\
  \ 文件中添加 `statusClick()` 方法：\n\n```java\nimport java.util.concurrent.ExecutionException;\n\
  import java.util.concurrent.TimeUnit;\nimport java.util.concurrent.TimeoutException;\n\
  \npublic void statusClick(View view) {\n    if (future != null && future.isDone())\
  \ {\n        String result = null;\n        try {\n            result = future.get(3,\
  \ TimeUnit.SECONDS);\n        } catch (ExecutionException | InterruptedException\n\
  | TimeoutException e) {\n            e.printStackTrace();\n        }\n        binding.myTextView.setText(result);\n\
  \    } else {\n```\n\n\n\n\n\n```java\nbinding.myTextView.setText(\"Waiting\");\n\
  }\n```\n\n完成更改后，运行应用并点击“Press Me”按钮。在任务运行期间，点击`Status`按钮。只要任务仍在运行，`TextView`中就会显示“Waiting”消息。然而，一旦任务完成，`isDone()`方法将返回一个真值，`get()`方法将被调用，并且任务返回的字符串（“Task\
  \ Complete”）将显示在`TextView`上。\n\n## 60.13 调度任务\n\n最后一个要涵盖的内容涉及使用 `ExecutorService`\
  \ 来调度任务执行。这涉及到使用 `ScheduledExecutorService` 实例，在该实例上需要调用 `schedule()` 方法，并传递要执行的\
  \ `Runnable` 任务以及一个时间延迟时间。`schedule()` 调用将返回一个 `ScheduledFuture` 实例，该实例可用于识别任务预计启动前的剩余时间。\n\
  \n例如，以下代码调度了一个任务在 30 秒后运行并访问了剩余的延迟时间：\n\n```java\nScheduledExecutorService executor\
  \ = Executors.newScheduledThreadPool(1);\nRunnable task = () -> {\n    // 在此处执行任务的代码\n\
  };\nScheduledFuture<?> future = executor.schedule(task, 30, TimeUnit.SECONDS);\n\
  long delayRemaining = future.getDelay(TimeUnit.SECONDS);\n```\n\n同样地，`ScheduledExecutorService`\
  \ 可用于在可选的初始延迟后以固定的间隔重复执行任务。例如，以下代码导致任务在初始 30 秒延迟后每隔 10 秒执行一次：\n\n```java\nexecutor.scheduleAtFixedRate(task,\
  \ 30, 10, TimeUnit.SECONDS);\n```\n\n`scheduleAtFixedRate()` 方法无论之前调度的任务是否完成，都会启动任务的下一个实例。若要指定任务执行结束与下一次执行开始之间的固定时间间隔，请使用\
  \ `scheduleWithFixedDelay()` 方法。在接下来的示例中，第一个任务调度在 0 秒延迟后调度，随后的每次执行都在上一个任务完成 10 秒后发生：\n\
  \n```java\nexecutor.scheduleWithFixedDelay(task, 0, 10, TimeUnit.SECONDS);\n```\n\
  \n## 60.14 总结\n\n本章的目标是提供 Android 应用中线程的概述。当应用在进程中首次启动时，运行时系统创建一个主线程，所有随后启动的应用组件默认都在该线程中运行。主线程的主要是处理用户界面，因此在该线程中执行的任何耗时任务都会导致应用出现卡死的假象。因此，将可能需要时间完成的任务启动在单独的线程中是非常关重要的。\n\
  \n由于 Android 用户界面工具包不是线程安全的，不应在主线程之外的任何线程对用户界面进行更改。用户界面更改可以通过在主线程中创建一个 `handler`\
  \ 来实现，从其他非主线程向其发送消息。\n\n线程可以直接创建，也可以使用 Java 并发框架的执行器服务来创建。对于更复杂的线程需求，该框架提供了线程池的自动管理、任务结果的返回以及执行调度。\n\
  \n## 61. 在 Android 中请求运行时权限\n\n在之前的几个章节中创建的许多示例项目中，已对 `AndroidManifest.xml` 文件进行了修改，以请求应用执行特定任务的权限。例如，在某些情况下，已请求了网络访问权限以允许应用下载和显示网页。到此为止的每种情况，只需将请求添加到清单文件中，应用即可从用户处获得执行指定任务的权限。\n\
  \n然而，对于某些权限，应用在 Android 6.0 或更高版本上运行时，需要额外的步骤才能运行。这些所谓的“危险”权限中的第一个将在下一章中遇到。然而，在到达那里之前，本章将概述在运行最新代\
  \ Android 系统运行时请求此类权限的涉及步骤。\n\n## 61.1 理解普通权限和危险权限\n\nAndroid 通过要求用户授予应用执行某些任务的权限来强制执行安全措施。在\
  \ Android 6 引入之前，在应用安装到设备上时总是会寻求权限。例如，图 61-1 显示了通过 Google Play 安装应用时寻求各种权限的典型屏幕。\n\
  \n![image-30A8RAR4.jpg](img/image-30A8RAR4.jpeg)\n\n图 61-1\n\n对于许多类型的权限，这种场景仍然适用于\
  \ Android 6.0 或更高版本上的应用。这些权限被称为**普通权限**，仍要求用户在安装点予以接受。第二类权限被称为**危险权限**，也必须以普通权限相同的方式在清单文件中声明，但在应用程序首次启动时也必须向用户请求。当发出此类请求时，它将以对话框的形式出现，如图\
  \ 61-2 所示：\n\n![image-QL53ANFX.jpg](img/image-QL53ANFX.jpeg)\n\n图 61-2\n\n属于危险类的权限完整列表包含在表\
  \ 61-1 中：\n\n| 权限组 | 权限 |\n| :--- | :--- |\n| 日历 | READ_CALENDAR WRITE_CALENDAR\
  \ |\n| 相机 | CAMERA |\n| 联系人 | READ_CONTACTS WRITE_CONTACTS GET_ACCOUNTS |\n| 位置\
  \ | ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION |\n| 麦克风 | RECORD_AUDIO |\n| 通知\
  \ | POST_NOTIFICATIONS |\n| 电话 | READ_PHONE_STATE CALL_PHONE READ_CALL_LOG WRITE_CALL_LOG\
  \ ADD_VOICEMAIL PROCESS_OUTGOING_CALLS |\n| 传感器 | BODY_SENSORS |\n| 短信 | SEND_SMS\
  \ RECEIVE_SMS READ_SMS RECEIVE_WAP_PUSH RECEIVE_MMS |\n| 存储 | MANAGE_EXTERNAL_STORAGE\
  \ READ_EXTERNAL_STORAGE WRITE_EXTERNAL_STORAGE |\n\n表 61-1\n\n`MANAGE_EXTERNAL_STORAGE`\
  \ 权限允许应用访问设备外部存储上的所有文件，包括属于其他应用的文件。因此，只有当 Google 在审核过程中确认需要这种级别的访问时，权限才会为应用启用。为了在提交到\
  \ Google Play 商店之前测试应用，可以执行以下 `adb` 命令临时为测试设备上的应用启用访问：\n\n`adb shell appops set\
  \ --uid MANAGE_EXTERNAL_STORAGE allow`\n\n可以通过以下方式关闭此模式：\n\n`adb shell appops set\
  \ --uid MANAGE_EXTERNAL_STORAGE default`\n\n 61.2 创建权限示例项目\n\n在欢迎屏幕上选择 New Project（新建项目）选项，并在出现的项目对话框中选择\
  \ Empty Views Activity 模板，然后点击 Next 按钮。\n\n在 Name 字段输入 `PermissionDemo`，并指定 `com.ebookfrenzy.permissiondemo`\
  \ 为包名。在点击 Finish 之前，将 Minimum API level 设置为 API 26: Android 8.0 (Oreo)，并将 Language\
  \ 菜单设置为 Java。\n\n## 61.3 检查权限\n\nAndroid 支持库包含几种方法，用于在 Android 应用代码中寻求和管理危险权限。这些\
  \ API 调用无论应用运行的 Android 版本如何都可以安全地进行，但只有在 Android 6.0 或更高版本上执行时才会执行有意义的操作。\n\n\n\
  \n\n在 App 尝试使用需要批准危险权限的功能之前，无论之前是否已授予该权限，代码都必须检查该权限是否已授予。可以通过调用 `ContextCompat`\
  \ 类的 `checkSelfPermission()` 方法来实现，并将当前 activity 的引用和请求的权限作为参数传递。该方法将检查权限是否之前已授予，并返回与\
  \ `PackageManager.PERMISSION_GRANTED` 或 `PackageManager.PERMISSION_DENIED` 匹配的整数值。\n\
  \n在示例项目的 `MainActivity.java` 文件中，修改代码以检查是否已授予 App 录音的权限：\n\n```java\npackage com.ebookfrenzy.permissiondemoactivity;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\nimport androidx.core.content.ContextCompat;\n\
  import androidx.annotation.NonNull;\nimport android.os.Bundle;\nimport android.Manifest;\n\
  import android.content.pm.PackageManager;\nimport android.util.Log;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n    private static final String TAG\
  \ = \"PermissionDemo\";\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        // ...\n        setupPermissions();\n\
  \    }\n\n    private void setupPermissions() {\n        int permission = ContextCompat.checkSelfPermission(this,\n\
  \                Manifest.permission.RECORD_AUDIO);\n        if (permission != PackageManager.PERMISSION_GRANTED)\
  \ {\n            Log.i(TAG, \"Permission to record denied\");\n        }\n    }\n\
  }\n```\n\n编辑 `AndroidManifest.xml` 文件（位于 Project 工具窗口的 app -> manifests 下），并添加一行代码来请求录音权限，如下：\n\
  \n```xml\npackage=\"com.ebookfrenzy.permissiondemoactivity\" >\n    android:allowBackup=\"\
  true\"\n    android:icon=\"@mipmap/ic_launcher\"\n    android:label=\"@sxtring/app_name\"\
  \n    android:supportsRtl=\"true\"\n    android:theme=\"@style/AppTheme\" >\n  \
  \  android:name=\"android.intent.category.LAUNCHER\" />\n```\n\n在设备或模拟器上运行该 App\
  \ 并打开 Logcat 工具窗口。请注意，尽管权限已添加到 manifest 文件，但仍然出现了权限被拒绝的消息。这是因为 Android 要求除了在 manifest\
  \ 文件中添加请求外，App 还必须在运行时请求危险权限。\n\n## 61.4 在运行时请求权限\n\n权限请求是通过调用 `ActivityCompat`\
  \ 类的 `requestPermissions()` 方法发出的。当调用此方法时，权限请求将进行异步处理，并在任务完成后调用一个名为 `onRequestPermissionsResult()`\
  \ 的方法。\n\n`requestPermissions()` 方法的参数包括当前 activity 的引用、所请求权限的标识符和一个请求代码。请求代码可以是任意整数值，并将用于标识是哪个请求触发了对\
  \ `onRequestPermissionsResult()` 方法的调用。修改 `MainActivity.java` 文件以声明请求代码，并在权限检查失败时请求录音权限：\n\
  \n```java\n// ...\nimport androidx.core.app.ActivityCompat;\n// ... ...\n\npublic\
  \ class MainActivity extends AppCompatActivity {\n    private static final String\
  \ TAG = \"PermissionDemo\";\n    private static final int RECORD_REQUEST_CODE =\
  \ 101;\n\n    // ...\n    @Override\n    private void setupPermissions() {\n   \
  \     int permission = ContextCompat.checkSelfPermission(this,\n               \
  \ Manifest.permission.RECORD_AUDIO);\n        if (permission != PackageManager.PERMISSION_GRANTED)\
  \ {\n            Log.i(TAG, \"Permission to record denied\");\n            makeRequest();\n\
  \        }\n    }\n\n    protected void makeRequest() {\n        ActivityCompat.requestPermissions(this,\n\
  \                new String[]{Manifest.permission.RECORD_AUDIO},\n             \
  \   RECORD_REQUEST_CODE);\n    }\n}\n```\n\n接下来，实现 `onRequestPermissionsResult()`\
  \ 方法，使其内容如下：\n\n```java\n@Override\npublic void onRequestPermissionsResult(int requestCode,\n\
  \        @NonNull String[] permissions, @NonNull int[] grantResults) {\n    super.onRequestPermissionsResult(requestCode,\
  \ permissions, grantResults);\n    if (requestCode == RECORD_REQUEST_CODE) {\n \
  \       if (grantResults.length == 0\n                || grantResults[0] !=\n  \
  \              PackageManager.PERMISSION_GRANTED) {\n            Log.i(TAG, \"Permission\
  \ has been denied by user\");\n        } else {\n            Log.i(TAG, \"Permission\
  \ has been granted by user\");\n        }\n    }\n}\n```\n\n在模拟器或设备上编译并运行该 App，注意看会出现一个请求录音权限的对话框，如图\
  \ 61-3 所示：\n\n![image-O67TPFTC.jpg](img/image-O67TPFTC.jpeg)\n\n图 61-3\n\n点击“在使用应用程序时”按钮，并检查\
  \ Logcat 面板中出现了“Permission has been granted by user”的消息。\n\n一旦用户授予了请求的权限，在未来的 App\
  \ 调用中，`checkSelfPermission()` 方法调用将返回 `PERMISSION_GRANTED` 结果，直到用户卸载并重新安装 App，或者在设置中更改了\
  \ App 的权限。\n\n## 61.5 为权限请求提供理由\n\n如图 61-3 所示，用户可以拒绝请求的权限。在这种情况下，除非用户在点击“拒绝”按钮之前选择了“不再询问”选项，否则\
  \ App 在每次用户启动它时都会继续请求权限。用户多次拒绝可能表明用户不理解为什么 App 需要该权限。因此，如果在发出请求时解释了需求的原因，用户可能会更有可能授予权限。遗憾的是，无法更改请求对话框的内容来包含此类解释。\n\
  \n解释最好包含在一个独立的对话框中，可以在向用户展示请求框之前显示。这引出了何时显示此解释对话框的问题。Android 文档建议仅在用户之前拒绝权限时显示解释对话框，并提供了一种方法来识别这种情况。\n\
  \n调用 `ActivityCompat` 类的 `shouldShowRequestPermissionRationale()` 方法会在用户之前拒绝请求时返回\
  \ true 结果，如果尚未请求则返回 false。在结果为 true 的情况下，App 应显示包含理由的对话框，一旦用户阅读并关闭了对话框，应重复权限请求。\n\
  \n要在示例 App 中添加此功能，请修改 `onCreate()` 方法使其内容如下：\n\n```java\n// ...\nimport android.app.AlertDialog;\n\
  // ...\n\nprivate void setupPermissions() {\n    int permission = ContextCompat.checkSelfPermission(this,\n\
  \            Manifest.permission.RECORD_AUDIO);\n    if (permission != PackageManager.PERMISSION_GRANTED)\
  \ {\n        Log.i(TAG, \"Permission to record denied\");\n        if (ActivityCompat.shouldShowRequestPermissionRationale(this,\n\
  \                Manifest.permission.RECORD_AUDIO)) {\n            AlertDialog.Builder\
  \ builder = new AlertDialog.Builder(this);\n            builder.setMessage(\"此应用需要访问麦克风权限以录音\"\
  )\n                    .setTitle(\"需要权限\");\n            builder.setPositiveButton(\"\
  OK\", (dialog, id) -> makeRequest());\n            AlertDialog dialog = builder.create();\n\
  \            dialog.show();\n        } else {\n            makeRequest();\n    \
  \    }\n    }\n}\n}\n}\n```\n\n## 61.6 测试权限 App\n\n在进行测试的设备或模拟器会话上，启动设置应用，选择应用选项，然后滚动选择\
  \ PermissionDemo App。在应用设置界面上，点击卸载按钮移除该 App。\n\n\n\n\n重新运行应用，并在权限请求对话框出现时点击“不允许”（Don’t\
  \ allow）按钮。停止并重启应用，验证理由对话框是否出现。点击“确定”，并在权限请求对话框出现时点击“应用使用期间”（While using the app）按钮。\n\
  \n返回“设置”应用，选择“应用”选项，再次从列表中选择 PermissionDemo 应用。一旦列出应用的设置，验证“权限”部分是否列出了“麦克风”权限。\n\
  \n返回“设置”应用，选择“应用”选项，再次从列表中选择 PermissionDemo 应用。一旦列出应用的设置，验证“权限”部分是否列出了“麦克风”权限：\n\
  \n![image-9QOZ6MSN.jpg](img/image-9QOZ6MSN.jpeg)\n\n图 61-4\n\n## 61.7 Summary\n\n\
  在 Android 6.0 引入之前，应用请求访问某些功能的权限的唯一必要步骤是在应用程序清单文件（manifest）中添加适当的行。用户在安装应用时将会被提示确认是否允许该权限。对于大多数权限仍然如此，但一组被认为是“危险”的权限除外。被认为是危险的权限通常具有允许应用违反用户隐私的可能，例如允许访问麦克风、联系人列表或外部存储。\n\
  \n如本章所述，基于 Android 6 或更高版本的应用现在必须在应用启动时向用户请求危险权限的批准，并在清单文件中包含权限请求。\n\n## 62. Android\
  \ 通知教程\n\n通知为应用提供了一种在应用未运行或当前处于后台时向用户传达消息的方法。例如，消息应用可能会通知用户收到来自联系人的新消息。通知可以分为本地通知和远程通知。本地通知是由运行在设备上的应用本身在相应设备上触发的。另一方面，远程通知由远程服务器启动并递送到设备上供用户显示。\n\
  \n通知显示在从屏幕状态栏向下拉出的通知栏中，每条通知都可以包含某些操作，例如一个用于打开发送该通知的应用程序的按钮。Android 还支持“直接回复”（Direct\
  \ Reply）通知，该功能允许用户在通知面板中输入并提交对通知的响应。\n\n本章概述了在 Android 应用中实现本地通知的步骤。下一章（“Android\
  \ 直接回复通知教程”）将涵盖直接回复通知的实现。\n\n## 62.1 通知概述\n\n当 Android 设备上启动通知时，它将作为状态栏中的一个图标出现。例如，图\
  \ 62-1 显示了一个带有多个通知图标的状态栏：\n\n![image-WI6GCDPC.jpg](img/image-WI6GCDPC.jpeg)\n\n\
  图 62-1\n\n要查看通知，用户需要从状态栏开始执行向下滑动的动作以拉下通知栏，如图 62-2 所示：\n\n![image-VP9GVS9U.jpg](img/image-VP9GVS9U.jpeg)\n\
  \n图 62-2\n\n在运行 Android 8 或更高版本的设备上，长按应用启动器图标将显示与该应用相关的任何等待通知，如图 62-3 所示：\n\n![image-2E9JGHTM.jpg](img/image-2E9JGHTM.jpeg)\n\
  \n图 62-3\n\nAndroid 8 及更高版本还支持通知点，当有通知等待用户查看时，通知点会出现在应用启动器图标上。\n\n典型的通知会显示一条消息，并在点击时启动负责发布该通知的应用。通知还可能包含操作按钮，点击时会执行针对对应应用的特定任务。例如，图\
  \ 62-4 显示了一个包含两个操作按钮的通知，允许用户删除或保存收到的消息：\n\n![image-UD7AY5DG.jpg](img/image-UD7AY5DG.jpeg)\n\
  \n图 62-4\n\n用户还可以在通知中输入内联文本回复并发送到应用，如下方的图 62-5 所示。这允许用户在不将相应应用调至前景的情况下对通知做出响应：\n\
  \n![image-49L2GHCL.jpg](img/image-49L2GHCL.jpeg)\n\n图 62-5\n\n本章的剩余部分将介绍创建和发布包含操作的简单通知。直接回复支持的主题将在下一章“Android\
  \ 直接回复通知教程”中进行介绍。\n\n## 62.2 创建 NotifyDemo 项目\n\n从欢迎界面选择“新建项目”选项，在生成的新项目对话框中，在点击“下一步”按钮之前选择“空视图\
  \ Activity”（Empty Views Activity）模板。\n\n在 `Name` 字段中输入 `NotifyDemo` 并指定 `com.ebookfrenzy.notifydemo`\
  \ 为包名。在点击“完成”按钮之前，将最低 API 级别设置为 `API 33: Android 13 (Tiramisu)`，并将语言菜单更改为 Java。\n\
  \n## 62.3 设计用户界面\n\n主活动将包含单个按钮，其目的是创建并发布一个意图（intent）。在布局编辑器工具中找到并加载 `activity_main.xml`\
  \ 文件，并删除默认的 `TextView` 组件。\n\n启用自动连接（Autoconnect）的情况下，从面板中拖放一个 `Button` 对象到布局画布的中心，如图\
  \ 62-6 所示。\n\n在布局中选中 `Button` 组件后，使用属性面板配置 `onClick` 属性以调用名为 `sendNotification`\
  \ 的方法。\n\n![image-KCOJKXM9.jpg](img/image-KCOJKXM9.jpeg)\n\n图 62-6\n\n选择 `Button`\
  \ 组件，将属性窗口中的文本更改为“Notify”，并将其提取为字符串资源。\n\n## 62.4 创建第二个 Activity\n\n在本例中，应用将包含一个由用户从通知内部启动的第二个\
  \ Activity。通过右键点击 `app -> java` 下的 `com.ebookfrenzy.notifydemo` 包名并选择 `New -> Activity\
  \ -> Empty Views Activity` 菜单选项将此活动添加到项目中。\n\n在 `Activity Name` 字段中输入 `ResultActivity`\
  \ 并将布局文件命名为 `activity_result`。由于该活动在应用程序启动时启动（而是通过通知内部的意图启动），在点击“完成”按钮之前，确保禁用“启动\
  \ Activity”选项。\n\n打开第二个活动的布局（`app -> res -> layout -> activity_result.xml`），并拖放一个\
  \ `TextView` 组件。编辑 `TextView` 的文本使其显示为“Result Activity”，并将其提取为字符串资源。\n\n## 62.5\
  \ 创建通知通道\n\n在应用发送通知之前，必须创建一个通知通道（Notification Channel）。通知通道由在应用内唯一标识该通道的 ID、通道名称和通道描述组成（后两个用户可见）。通道的创建是通过配置\
  \ `NotificationChannel` 实例，并将该对象传递给 `NotificationManager` 类的 `createNotificationChannel()`\
  \ 方法来实现的。对于示例，应用将包含一个名为“NotifyDemo News”的单一通知通道。编辑 `MainActivity.java` 文件并实现在应用启动时创建通道的代码：\n\
  \n```java\nimport android.app.NotificationManager;\nimport android.app.NotificationChannel;\n\
  import android.content.Context;\nimport android.graphics.Color;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n    NotificationManager notificationManager;\n\
  \n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n    \
  \    super.onCreate(savedInstanceState);\n\n        notificationManager =\n    \
  \    (NotificationManager)\n        getSystemService(Context.NOTIFICATION_SERVICE);\n\
  \    }\n}\n```\n\n\n\n\n```java\ncreateNotificationChannel(\n    \"com.ebookfrenzy.notifydemo.news\"\
  ,\n    \"NotifyDemo News\",\n    \"Example News Channel\");\n}\n\nprotected void\
  \ createNotificationChannel(String id, String name, String description) {\n    int\
  \ importance = NotificationManager.IMPORTANCE_LOW;\n    NotificationChannel channel\
  \ = new NotificationChannel(id, name, importance);\n    channel.setDescription(description);\n\
  \    channel.enableLights(true);\n    channel.setLightColor(Color.RED);\n    channel.enableVibration(true);\n\
  \    channel.setVibrationPattern(new long[]{100, 200, 300, 400, 500, 400, 300, 200,\
  \ 400});\n    notificationManager.createNotificationChannel(channel);\n}\n```\n\n\
  该代码声明并初始化了一个 `NotificationManager` 实例，然后创建了一个具有低重要性级别（其他选项为高、max、min 和 none）的新通道，并配置了名称和描述属性。通道中还添加了一系列可选设置，以自定义用户接收通知到达提醒的方式。这些设置适用于发送到此通道的所有通知。最后，通过将通知通道对象传递给通知管理器实例的\
  \ `createNotificationChannel()` 方法来创建通道。\n\n## 62.6 请求通知权限\n\n在测试应用程序之前，必须在应用程序清单文件（manifest\
  \ file）中请求相应的权限。具体而言，应用程序需要向用户发送通知的权限。在项目（Project）工具窗口中，找到并双击 `AndroidManifest.xml`\
  \ 文件，将其加载到编辑器中并修改 XML 以添加权限：\n\n```xml\npackage=\"com.ebookfrenzy.audioapp\" >\n\
  ```\n\n上述步骤将足以确保当应用安装在运行 Android 6.0 之前的版本的设备上时，用户会启用通知权限。在 Android 中，通知访问被归类为一种“危险权限”（dangerous\
  \ permission），因为它使应用程序有可能会损害用户的隐私。为了让示例应用在 Android 6 或更高版本的设备上正常运行，必须添加代码以在应用运行时请求权限。\n\
  \n编辑 `MainActivity.java` 文件，首先添加一些额外的导入指令和一个常量，用作所请求权限的请求请求标识码：\n\n```java\nimport\
  \ androidx.core.app.ActivityCompat;\nimport androidx.core.content.ContextCompat;\n\
  import androidx.annotation.NonNull;\nimport android.widget.Toast;\nimport android.Manifest;\n\
  import android.content.pm.PackageManager;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private static final int NOTICATION_REQUEST_CODE = 101;\n}\n```\n\n接下来，需要在类中添加一个方法，其目的是将要请求的权限和相应的请求标识码作为参数。继续留在\
  \ `MainActivity.java` 类文件中，按如下方式实现该方法：\n\n```java\nprotected void requestPermission(String\
  \ permissionType, int requestCode) {\n    int permission = ContextCompat.checkSelfPermission(this,\
  \ permissionType);\n    if (permission != PackageManager.PERMISSION_GRANTED) {\n\
  \        ActivityCompat.requestPermissions(this, new String[]{permissionType}, requestCode);\n\
  \    }\n}\n```\n\n使用此书中“在 Android 中进行运行时权限请求”章节概述的步骤，上述方法在发出请求之前会验证指定的权限是否尚未授予，并将标识码作为参数传递。\n\
  \n当请求被处理后，将调用活动上的 `onRequestPermissionsResult()` 方法，并传递标识码和请求结果。因此，下一步是在 `MainActivity.java`\
  \ 文件中按如下方式实现此方法：\n\n```java\n@Override\npublic void onRequestPermissionsResult(int\
  \ requestCode, @NonNull String[] permissions, @NonNull int[] grantResults) {\n \
  \   super.onRequestPermissionsResult(requestCode, permissions, grantResults);\n\
  \    if (requestCode == NOTIFICATION_REQUEST_CODE) {\n        if (grantResults.length\
  \ == 0 || grantResults[0] != PackageManager.PERMISSION_GRANTED) {\n            Toast.makeText(this,\
  \ \"Notification permission required\", Toast.LENGTH_LONG).show();\n        }\n\
  \    }\n}\n```\n\n上述代码检查请求标识码，以识别哪个权限请求已返回，然后再检查相应的权限是否已授予。如果权限被拒绝，将向用户显示消息，指示应用程序将无法运行且录制按钮将被禁用。\n\
  \n在测试应用之前，剩下的工作是在应用启动时调用新添加的 `requestPermission()` 方法。留在 `MainActivity.java` 文件中，按如下方式修改\
  \ `onCreate()` 方法：\n\n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState)\
  \ {\n    super.onCreate(savedInstanceState);\n    requestPermission(Manifest.permission.POST_NOTIFICATIONS,\
  \ NOTIFICATION_REQUEST_CODE);\n    notificationManager = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);\n\
  }\n```\n\n代码更改完成后，编译并在运行 Android 13 或更高版本的设备或模拟器上运行应用。当显示图 62-7 所示对话框时，点击 Allow（允许）按钮以启用通知：\n\
  \n![image-8PN0LZUJ.jpg](img/image-8PN0LZUJ.jpeg)\n图 62-7\n\n启动应用后，将其放入后台并打开设置（Settings）应用。在设置应用中，选择应用（Apps），选择\
  \ NotifyDemo 项目，并在后续屏幕上点击通知（Notifications）项。通知屏幕应该列出 NotifyDemo News 类别对用户是激活状态：\n\
  \n![image-RRMVQ6J9.jpg](img/image-RRMVQ6J9.jpeg)\n图 62-8\n\n在继续之前，确保为应用启用了通知点。虽然这不是示例的要求，但值得注意的是可以通过调用通知管理器的\
  \ `deleteChannel()` 方法从应用中删除通道，传递要删除的通道 ID：\n\n```java\nString channelID = \"com.ebookfrenzy.notifydemo.news\"\
  ;\nnotificationManager.deleteNotificationChannel(channelID);\n```\n\n## 62.7 创建并发布通知\n\
  \n通知使用 `Notification.Builder` 类创建，并且包含图标、标题和内容。打开 `MainActivity.java` 文件并按如下方式实现\
  \ `sendNotification()` 方法以构建基础通知：\n\n```java\nimport android.app.Notification;\n\
  import android.view.View;\n\npublic void sendNotification(View view) {\n    String\
  \ channelID = \"com.ebookfrenzy.notifydemo.news\";\n    Notification notification\
  \ = new Notification.Builder(MainActivity.this, channelID)\n        .setContentTitle(\"\
  Example Notification\")\n        .setContentText(\"This is an example notification.\"\
  )\n        .setSmallIcon(android.R.drawable.ic_dialog_info)\n        .setChannelId(channelID)\n\
  \        .build();\n}\n```\n\n一旦构建了通知，就需要使用 `NotificationManager` 实例的 `notify()`\
  \ 方法将其发布。访问 `NotificationManager` 并发布通知需要添加到 `sendNotification()` 方法中：\n\n```java\n\
  protected void sendNotification(View view) {\n    int notificationID = 101;\n  \
  \  String channelID = \"com.ebookfrenzy.notifydemo.news\";\n    Notification notification\
  \ = new Notification.Builder(MainActivity.this, channelID)\n        .setContentTitle(\"\
  New Message\")\n        .setContentText(\"You've received new messages.\")\n   \
  \     .setSmallIcon(android.R.drawable.ic_dialog_info)\n        .setChannelId(channelID)\n\
  \        .build();\n    notificationManager.notify(notificationID, notification);\n\
  }\n```\n\n注意，当发布通知时，会被分配一个通知 ID。该 ID 可以任意整数，并可以在以后更新通知时使用。\n\n编译并运行应用，点击主活动上的按钮。当通知图标出现在状态栏中时，触摸并从状态栏下拉以查看完整通知：\n\
  \n![image-I5CNGFS3.jpg](img/image-I5CNGFS3.jpeg)\n图 62-9\n\n点击并长按通知以查看更多信息：\n\n\n\
  \n\n\n![image-Z55VAV81.jpg](img/image-Z55VAV81.jpeg)\n图 62-10\n\n接下来，将应用置于后台，导航到显示所有应用启动图标的桌面屏幕，并注意如图\
  \ 62-11 所示，`NotifyDemo` 启动图标上出现了一个通知圆点：\n\n![image-PT1MQ4LF.jpg](img/image-PT1MQ4LF.jpeg)\n\
  图 62-11\n\n如果没有圆点，请检查 `Settings`（设置）应用中 `NotifyDemo` 的通知选项，以确认已启用通知点，正如本章前面所述。如果圆点仍未出现，长按设备主屏幕的空白区域，从弹出的菜单中选择\
  \ `Home Settings`（桌面设置）选项，并启用 `Notification dots`（通知点）选项。\n\n对启动图标进行长按将显示一个包含通知的弹出窗口：\n\
  \n![image-0FW8M0MM.jpg](img/image-0FW8M0MM.jpeg)\n图 62-12\n\n如果一个应用有多个待处理通知，长按菜单弹出窗口将包含通知计数（如上图高所示）。此数字可以在构建通知时通过调用\
  \ `setNumber()` 方法在应用内部进行配置：\n\n```\nNotification notification = new Notification.Builder(MainActivity.this,\
  \ CHANNEL_ID)\n.setContentTitle(\"Example Notification\")\n.setContentText(\"This\
  \ is an example notification.\")\n.setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  .setChannelId(CHANNEL_ID)\n.setNumber(10)\n.build();\n```\n\n按照目前的实现，无论从何处访问，点击通知都没有任何效果。下一步是配置通知以便在点击时启动一个\
  \ activity。\n\n## 62.8 从通知启动 Activity\n\n通知应该允许用户执行某些操作，例如启动相应的应用或响应通知采取其他操作。一个常见的需求是当用户点击通知时，启动一个属于该应用的\
  \ activity。\n\n这种方法需要启动一个 activity 并配置一个用于启动该 activity 的 `Intent`。假设应用包含一个名为 `ResultActivity`\
  \ 的 activity，则 intent 的创建方式如下：\n\n```\nIntent resultIntent = new Intent(this, ResultActivity.class);\n\
  ```\n\n然后，需要将此 intent 封装在 `PendingIntent` 实例中。`PendingIntent` 对象的设计允许将 intent 传递给其他应用程序，实质上授予这些应用程序在未来某个时刻执行该\
  \ intent 的权限。在这种情况下，`PendingIntent` 对象用于为 `Notification` 系统提供在用户点击通知面板时启动 `ResultActivity`\
  \ activity 的方法：\n\n```java\nPendingIntent pendingIntent =\nPendingIntent.getActivity(\n\
  \    this,\n    0,\n    resultIntent,\n    PendingIntent.FLAG_IMMUTABLE\n);\n```\n\
  \n剩下的工作是在构建通知过程中使用 `setContentIntent()` 方法分配 `PendingIntent` 对象。\n\n将这些更改整合在一起得到了修改后的\
  \ `sendNotification()` 方法，其内容如下：\n\n```java\nimport android.app.PendingIntent;\n\
  import android.content.Intent;\nimport android.graphics.drawable.Icon;\n\nprotected\
  \ void sendNotification(View view) {\n    int notificationId = 101;\n    Intent\
  \ resultIntent = new Intent(this, ResultActivity.class);\n    PendingIntent pendingIntent\
  \ =\n    PendingIntent.getActivity(\n        this,\n        0,\n        resultIntent,\n\
  \        PendingIntent.FLAG_IMMUTABLE\n    );\n    String CHANNEL_ID = \"com.ebookfrenzy.notifydemo.news\"\
  ;\n    Notification notification = new Notification.Builder(MainActivity.this,\n\
  \    CHANNEL_ID)\n    .setContentTitle(\"Example Notification\")\n    .setContentText(\"\
  This is an example notification.\")\n    .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \    .setChannelId(channelID)\n    .setContentIntent(pendingIntent)\n    .build();\n\
  \    notificationManager.notify(notificationId, notification);\n}\n```\n\n编译并重新运行应用，点击按钮并显示通知栏。然而，这一次点击通知将导致\
  \ `ResultActivity` 启动。\n\n## 62.9 为通知添加动作\n\n为通知添加交互性的另一种方法是创建动作（actions）。它们显示为通知消息下方的按钮，并被为在用户点击时触发特定的\
  \ intent。如果将以下代码添加到 `sendNotification()` 方法中，将添加一个标记为“Open”的动作按钮，在选择时会启动引用的 pending\
  \ intent：\n\n```java\nfinal Icon icon = Icon.createWithResource(MainActivity.this,\n\
  android.R.drawable.ic_dialog_info);\nNotification.Action action =\nnew Notification.Action.Builder(icon,\
  \ \"Open\", pendingIntent)\n.build();\nNotification notification = new Notification.Builder(MainActivity.this,\
  \ CHANNEL_ID)\n.setContentTitle(\"Example Notification\")\n.setContentText(\"This\
  \ is an example notification.\")\n.setSmallIcon(R.drawable.ic_info_24dp)\n.setChannelId(channelID)\n\
  .setContentIntent(pendingIntent)\n.setActions(action)\n.build();\nnotificationManager.notify(notificationId,\
  \ notification);\n```\n\n将上述代码添加到方法中并运行应用。发布通知并注意通知中出现的 `Open` 动作（取决于 Android 版本，可能需要向下滑动通知面板以显示\
  \ `Open` 动作）：\n\n![image-ZAKDCBCW.jpg](img/image-ZAKDCBCW.jpeg)\n图 62-13\n\n点击动作将触发\
  \ pending intent 并启动 `ResultActivity`。\n\n## 62.10 折叠通知\n\n如果一个应用经常发布通知，可能会出现这些通知塞满状态栏和通知栏，给用户带来欠佳的体验。这对于每次有突发新闻或新消息到达就发送通知的应用尤为如此。考虑图\
  \ 62-14 中的通知：\n\n![image-ILT1E2A.jpg](img/image-ILT1E2A.jpeg)\n图 62-14\n\n现在假设有了十或二十条新消息。为了避免这个问题，Android\
  \ 允许将通知折叠成组。要折叠通知，每个通知必须通过 `setGroup()` 方法指定属于同一个组，并且必须发布额外的通知作为摘要通知。以下代码创建并发布了图\
  \ 62-14 所示的三个通知，但将它们折叠到同一个组中。代码还发布了一个通知作为摘要：\n\n```java\nfinal String GROUP_KEY_NOTIFY\
  \ = \"group_notify\";\nNotification.Builder builderSummary =\nnew Notification.Builder(this,\
  \ channelID)\n.setSmallIcon(android.R.drawable.ic_dialog_info)\n.setContentTitle(\"\
  A Bundle Example\")\n.setContentText(\"You have 3 new messages\")\n.setGroup(GROUP_KEY_NOTIFY)\n\
  .setGroupSummary(true);\nNotification.Builder builder1 =\nnew Notification.Builder(this,\
  \ channelID)\n.setSmallIcon(android.R.drawable.ic_dialog_info)\n.setContentTitle(\"\
  New Message\")\n.setContentText(\"You have a new message from Kassidy\")\n.setGroup(GROUP_KEY_NOTIFY);\n\
  Notification.Builder builder2 =\nnew Notification.Builder(this, channelID)\n.setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  .setContentTitle(\"New Message\")\n.setContentText(\"You have a new message from\
  \ Caitlyn\")\n.setGroup(GROUP_KEY_NOTIFY);\nNotification.Builder builder3 =\nnew\
  \ Notification.Builder(this, channelID)\n.setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  .setContentTitle(\"New Message\")\n.setContentText(\"You have a new message from\
  \ Jason\")\n.setGroup(GROUP_KEY_NOTIFY);\nint notificationId0 = 100;\nint notificationId1\
  \ = 101;\nint notificationId2 = 102;\nint notificationId3 = 103;\nnotificationManager.notify(notificationId1,\
  \ builder1.build());\nnotificationManager.notify(notificationId2, builder2.build());\n\
  notificationManager.notify(notificationId3, builder3.build());\nnotificationManager.notify(notificationId0,\
  \ builderSummary.build());\n```\n\n\n\n\n当代码执行时，即使应用程序发送了四条通知，状态栏中也显示一个通知图标。在通知栏中，会显示一条摘要通知，列出每个捆绑通知中的信息：\n\
  \n![image-7DW18BEW.jpg](img/image-7DW18BEW.jpeg)\n\n图 62-15\n\n在通知条目上进一步向下拖动，面板会展开并显示每个捆绑通知的详细信息：\n\
  \n![image-JYFBH1QG.jpg](img/image-JYFBH1QG.jpeg)\n\n图 62-16\n\n## 62.11 总结\n\n通知提供了一种方式，让应用程序在未运行或当前处于后台时向用户传递消息。通知出现在状态栏和通知栏中。本地通知由运行的应用程序在设备上触发，而远程通知由远程服务器发起并传递到设备。本地通知使用\
  \ `NotificationCompat.Builder` 类创建，并使用 `NotificationManager` 服务发布。\n\n正如本章所示，可以通过操作（actions）、意图（intents）和\
  \ `PendingIntent` 类来配置通知，为用户提供选项（例如启动活动或保存消息）。通知捆绑（Notification bundling）提供了一种分组通知的机制，为发布更多通知的应用程序提供了改进的体验。\n\
  \n## 63. Android 直接回复通知教程\n\n直接回复（Direct reply）是 Android 的一项功能，允许用户在通知中输入文本并将其发送到与通知关联的应用程序。这允许用户在不启动应用程序内活动的情况下直接在通知中回复消息。本章将基于上一节学到的知识，创建一个使用此通知功能的示例应用程序。\n\
  \n###### 63.1 创建 DirectReply 项目\n\n从欢迎界面选择 `New Project`（新建项目）选项，在弹出的新项目对话框中，点击\
  \ `Next`（下一步）按钮之前，选择 `Empty Views Activity` 模板。\n\n在 `Name`（名称）字段中输入 `DirectReply`，并指定\
  \ `com.ebookfrenzy.directreply` 为包名。点击 `Finish`（完成）按钮之前，将 `Minimum API level`（最低\
  \ API 级别）设置为 `API 33`：Android 13，并将 `Language`（语言）菜单设置为 `Java`。按照第 12.8 节“迁移项目到\
  \ View Binding”中概述的步骤修改项目以支持视图绑定（view binding）。\n\n### 63.2 设计用户界面\n\n将布局文件 `activity_main.xml`\
  \ 加载到布局工具中。启用 `Autoconnect`（自动连接），并在在现有的“Hello World!”标签下方添加一个 `Button` 对象，如图 63-1\
  \ 所示。在布局中选中 `Button` 组件后，使用 `Attributes`（属性）工具窗口将 `onClick` 属性设置为调用名为 `sendNotification`\
  \ 的方法。如有，使用 `Infer Constraints`（推断约束）按钮为布局添加任何缺失的约束。在继续之前，选择“Hello World!” `TextView`，将\
  \ `id` 属性更改为 `textView`，并将按钮上的文本修改为“Notify”：\n\n![image-914PLUSI.jpg](img/image-914PLUSI.jpeg)\n\
  \n图 63-1\n\n### 63.3 请求通知权限\n\n在 `Project`（项目）工具窗口中，找到并双击 `AndroidManifest.xml`\
  \ 文件加载到编辑器，并修改 XML 添加权限元素：\n\n```xml\npackage=\"com.ebookfrenzy.audioapp\" >\n```\n\
  \n.\n.\n\n编辑 `MainActivity.java` 文件，首先添加一些额外的导入指令和一个常量，作为所请求权限的请求标识码：\n\n```java\n\
  .\n.\nimport androidx.annotation.NonNull;\nimport androidx.core.app.ActivityCompat;\n\
  import androidx.core.content.ContextCompat;\nimport android.widget.Toast;\nimport\
  \ android.Manifest;\nimport android.content.pm.PackageManager;\n.\n.\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n    private static final int NOTIFICATION_REQUEST_CODE\
  \ = 101;\n.\n.\n```\n\n接下来，需要向类中添加一个方法，其目的是将要请求的权限和相应的请求标识码作为参数。留在 `MainActivity.java`\
  \ 类文件中，如下如下实现该方法：\n\n```java\nprotected void requestPermission(String permissionType,\
  \ int requestCode) {\n    int permission = ContextCompat.checkSelfPermission(this,\n\
  \    permissionType);\n    if (permission != PackageManager.PERMISSION_GRANTED)\
  \ {\n        ActivityCompat.requestPermissions(this,\n        new String[]{permissionType},\
  \ requestCode\n        );\n    }\n}\n```\n\n当请求处理完成后，活动将调用 `onRequestPermissionsResult()`\
  \ 方法，并传递标识码和请求结果。因此，下一步是在 `MainActivity.java` 文件中如下实现此方法：\n\n```java\n@Override\n\
  public void onRequestPermissionsResult(int requestCode,\n@NonNull String[] permissions,\
  \ @NonNull int[] grantResults) {\n    super.onRequestPermissionsResult(requestCode,\
  \ permissions, grantResults);\n    if (requestCode == NOTIFICATION_REQUEST_CODE)\
  \ {\n        if (grantResults.length == 0\n        || grantResults[0] !=\n     \
  \   PackageManager.PERMISSION_GRANTED) {\n            Toast.makeText(this,\n   \
  \         \"Notification permission required\",\n            Toast.LENGTH_LONG).show();\n\
  \        }\n    }\n}\n```\n\n在测试应用程序之前，最后剩下的工作是在应用程序启动时调用新添加的 `requestPermission()`\
  \ 方法。留在 `MainActivity.java` 文件中，如下修改 `onCreate()` 方法：\n\n```java\n@Override\nprotected\
  \ void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    binding = ActivityMainBinding.inflate(getLayoutInflater());\n    View view\
  \ = binding.getRoot();\n    setContentView(view);\n    requestPermission(Manifest.permission.POST_NOTIFICATIONS,\n\
  \    NOTIFICATION_REQUEST_CODE);\n}\n```\n\n### 63.4 创建通知通道\n\n与上一节的示例一样，在发送通知之前必须创建一个通道。编辑\
  \ `MainActivity.java` 文件并添加如下代码创建一个新通道：\n\n```java\n.\n.\nimport android.app.NotificationChannel;\n\
  import android.app.NotificationManager;\nimport android.content.Context;\nimport\
  \ android.graphics.Color;\n.\n.\npublic class MainActivity extends AppCompatActivity\
  \ {\n...\n    private NotificationManager notificationManager;\n    private final\
  \ String channelID = \"com.ebookfrenzy.directreply.news\";\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n...\n        notificationManager =\n\
  \        (NotificationManager)\n        getSystemService(Context.NOTIFICATION_SERVICE);\n\
  \        createNotificationChannel(channelID,\n        \"DirectReply News\", \"\
  Example News Channel\");\n    }\n\n    protected void createNotificationChannel(String\
  \ id,\n    String name, String description) {\n        int importance = NotificationManager.IMPORTANCE_HIGH;\n\
  \        NotificationChannel channel =\n        new NotificationChannel(id, name,\
  \ importance);\n        channel.setDescription(description);\n        channel.enableLights(true);\n\
  \        channel.setLightColor(Color.RED);\n        channel.enableVibration(true);\n\
  \        channel.setVibrationPattern(new long[]{100, 200, 300, 400,\n        500,\
  \ 400, 300, 200, 400});\n        notificationManager.createNotificationChannel(channel);\n\
  \    }\n.\n.\n}\n```\n\n### 63.5 构建 RemoteInput 对象\n\n使通知内直接回复文本可能的关键元素是 `RemoteInput`\
  \ 类。之前的章节介绍了 `PendingIntent` 类，并解释了它如何允许应用程序创建一个意图，然后授予其他应用程序或服务在原始应用程序之外启动该意图的能力。在名为“Android\
  \ 通知教程”的章节中，创建了一个等待许可，允许从通知内部启动应用程序中的活动。`RemoteInput` 类允许将用户输入请求与意图一起包含在 `PendingIntent`\
  \ 对象中。当 `PendingIntent` 对象中的意图触发时（例如启动活动），该活动也将收到用户提供的任何输入。\n\n[/\n\n\n\n在通知中实现直接回复的第一步是创建\
  \ `RemoteInput` 对象。这是通过使用 `RemoteInput.Builder()` 方法实现的。要构建 `RemoteInput` 对象，需要一个键字符串，用于从生成的意图（intent）中提取输入。该对象还需要一个标签字符串（label），它将显示在通知的文本输入字段中。编辑\
  \ `MainActivity.java` 文件并添加 `sendNotification()` 方法。请注意还添加了一些导入指令和变量，它们将在章节的后续内容中被用到：\n\
  \n```java\npackage com.ebookfrenzy.directreply;\n\n.\n\n.\n\nimport android.app.PendingIntent;\n\
  \nimport android.app.RemoteInput;\n\nimport android.content.Intent;\n\n.\n\n.\n\n\
  public class MainActivity extends AppCompatActivity {\n    private static final\
  \ int notificationId = 101;\n\n    private static final String KEY_TEXT_REPLY =\
  \ \"key_text_reply\";\n\n    private NotificationManager notificationManager;\n\n\
  \    private static final String channelID =\n\"com.ebookfrenzy.directreply.news\"\
  ;\n\n.\n.\n.\n\n    public void sendNotification(View view) {\n        String replyLabel\
  \ = \"Enter your reply here\";\n\n        RemoteInput remoteInput =\n        new\
  \ RemoteInput.Builder(KEY_TEXT_REPLY)\n        .setLabel(replyLabel)\n        .build();\n\
  \    }\n\n.\n.\n}\n```\n\n现在 `RemoteInput` 对象已经创建并使用键和标签字符串进行了初始化，它需要被放置在通知动作对象中。然而，在执行该步骤之前，需要创建\
  \ `PendingIntent` 实例。\n\n## 63.6 创建 PendingIntent\n\n创建 `PendingIntent` 的步骤与“Android\
  \ 通知教程”章节概述的步骤相同，不同之处在于意图将配置为启动 `MainActivity`。在 `MainActivity.java` 文件中，添加以下代码来创建\
  \ `PendingIntent`：\n\n```java\npublic void sendNotification(View view) {\n    String\
  \ replyLabel = \"Enter your reply here\";\n    RemoteInput remoteInput =\n    new\
  \ RemoteInput.Builder(KEY_TEXT_REPLY)\n    .setLabel(replyLabel)\n    .build();\n\
  \    Intent resultIntent = new Intent(this, MainActivity.class);\n    PendingIntent\
  \ resultPendingIntent =\n    PendingIntent.getActivity(\n        this,\n       \
  \ 0,\n        resultIntent,\n        PendingIntent.FLAG_MUTABLE\n    );\n}\n```\n\
  \n## 63.7 创建回复动作\n\n内联回复将可以通过动作按钮在通知中访问。此动作需要被创建并配置图标、显示在按钮上的标签、`PendingIntent`\
  \ 对象以及 `RemoteInput` 对象。修改 `sendNotification()` 方法以添加创建此动作的代码：\n\n```java\n.\n.\n\
  \nimport android.graphics.drawable.Icon;\nimport android.app.Notification;\n\n.\n\
  .\n\npublic void sendNotification(View view) {\n    String replyLabel = \"Enter\
  \ your reply here\";\n    RemoteInput remoteInput =\n    new RemoteInput.Builder(KEY_TEXT_REPLY)\n\
  \    .setLabel(replyLabel)\n    .build();\n    Intent resultIntent = new Intent(this,\
  \ MainActivity.class);\n    PendingIntent resultPendingIntent =\n    PendingIntent.getActivity(\n\
  \        this,\n        0,\n        resultIntent,\n        PendingIntent.FLAG_MUTABLE\n\
  \    );\n    final Icon icon =\n    Icon.createWithResource(MainActivity.this,\n\
  \        android.R.drawable.ic_dialog_info);\n    Notification.Action replyAction\
  \ =\n    new Notification.Action.Builder(\n        icon,\n        \"Reply\", resultPendingIntent)\n\
  \    .addRemoteInput(remoteInput)\n    .build();\n}\n.\n.\n```\n\n在教程的这一阶段，我们已经构建了并准备好使用的\
  \ `RemoteInput`、`PendingIntent` 和 `Notification Action` 对象。下一阶段是构建通知并发布它：\n\n```java\n\
  public void sendNotification(View view) {\n    String replyLabel = \"Enter your\
  \ reply here\";\n    RemoteInput remoteInput =\n    new RemoteInput.Builder(KEY_TEXT_REPLY)\n\
  \    .setLabel(replyLabel)\n    .build();\n    Intent resultIntent = new Intent(this,\
  \ MainActivity.class);\n    PendingIntent resultPendingIntent =\n    PendingIntent.getActivity(\n\
  \        this,\n        0,\n        resultIntent,\n        PendingIntent.FLAG_IMMUTABLE\n\
  \    );\n    final Icon icon =\n    Icon.createWithResource(MainActivity.this,\n\
  \        android.R.drawable.ic_dialog_info);\n    Notification.Action replyAction\
  \ =\n    new Notification.Action.Builder(\n        icon,\n        \"Reply\", resultPendingIntent)\n\
  \    .addRemoteInput(remoteInput)\n    .build();\n    Notification newMessageNotification\
  \ =\n    new Notification.Builder(this, channelID)\n    .setColor(ContextCompat.getColor(this,\n\
  \        android.R.color.holo_blue_dark))\n    .setSmallIcon(\n        android.R.drawable.ic_dialog_info)\n\
  \    .setContentTitle(\"My Notification\")\n    .setContentText(\"This is a test\
  \ message\")\n    .addAction(replyAction).build();\n    NotificationManager notificationManager\
  \ =\n    (NotificationManager)\n    getSystemService(Context.NOTIFICATION_SERVICE);\n\
  \    notificationManager.notify(notificationId,\n        newMessageNotification);\n\
  }\n```\n\n完成更改后，编译并运行应用，允许通知，并测试点击按钮是否会发布通知。点击按钮发布通知的结果如图 63-2 所示：\n\n- [图 63-2](https://example.org/4ZRHP8AX.jpg)\
  \ （注：此处为占位符，实际应对应图片路径）\n\n完成更改后，编译并运行应用，允许通知，并测试点击按钮是否会发布通知。点击按钮发布通知的结果如图 63-3 所示：\n\
  \n- [图 63-3](https://example.org/8W25C9.jpg) （注：此处为占位符，实际应对应图片路径）\n\n\n\n\n\n```java\n\
  android.R.drawable.ic_dialog_info)\n\n.setContentText(\"Reply received\")\n\n.build();\n\
  \nnotificationManager.notify(notificationId,\n\nrepliedNotification);\n\n}\n\n}\n\
  ```\n\n最后一次测试应用程序，并验证在内联回复文本发送后进度指示器会消失，并且会出现一个新面板，表示回复已收到：\n\n![image-AHGYZ098.jpg](img/image-AHGYZ098.jpeg)\n\
  \n图 63-5\n\n## 63.10 总结\n\n直接回复通知功能允许用户在通知内输入文本，并通过 `intent` 传递给相应应用程序的活动（activity）。直接回复是通过\
  \ `RemoteInput` 类实现的，该实例可以嵌入到操作（action）中，并与通知一起打包。在处理直接回复通知时，让 `NotificationManager`\
  \ 服务知道回复已收到并处理至关重要。实现此点的最佳方法是使用首次发布通知时提供的 `notification ID` 来更新通知消息。\n\n## 64. 折叠屏设备与多窗口支持\n\
  \n无论我们是否准备好，折叠屏设备都会到来（或者对于第一代三星 Galaxy Fold 来说，可能在设备本身准备好之前就出现了）。为了准备这一新类设备，了解一些应该采取的额外步骤，以确保你的应用程序在折叠屏设备上运行时运行正常。\n\
  \n幸运的是，支持折叠屏设备的大部分行为已经以多窗口支持的形式存在于 Android 中。\n\n## 64.1 折叠屏与多窗口支持\n\n当应用程序运行在折叠屏设备上时，它可能会与其他应用程序共享屏幕，并遇到重大的配置更改（例如，当用户折叠或展开显示器时屏幕尺寸的变化）。如果你的应用程序已经设计为可以处理设备方向的变化，那么它可能也能处理由屏幕折叠引起的变化，尽管建议进行彻底测试。\n\
  \n多窗口支持最初是在 Android 7 中引入的。与 Android 之前的版本不同，Android 7 中的多窗口支持允许在设备屏幕上同时显示多个活动。\n\
  \nAndroid 中的多窗口提供了提供了不同形式的窗口支持。分屏模式适用于大多数手机、折叠屏设备和平板设备，它提供了一个分屏环境，其中两个活动并排或一个一在上地显示。它提供了一个可移动的分割线，当用户拖动它时，会调整分配给相邻每个活动的屏幕百分比：\n\
  \n![image-CXI3056.jpg](img/image-CXI30562.jpeg)\n\n图 64-1\n\n自由窗口模式为大屏幕设备提供了一个窗口化环境，目前由设备制造商决定启用。自由窗口与分屏模式的区别在于，它允许每个活动出现在独立的、可调整大小的窗口中，并且不限于同时显示两个活动。例如，图\
  \ 64-2 显示了一个在自由窗口模式下的设备，计算器和第二个应用程序显示在独立的窗口中：\n\n![image-VFWVBP99.jpg](img/image-VFWVBP99.jpeg)\n\
  \n图 64-2\n\n画中画（Picture-in-picture）支持正如其名一样，允许在用户执行其他任务时在较小的窗口中继续视频播放，该主题将从“Android\
  \ 画中画模式”章节开始介绍。\n\n## 64.2 使用折叠屏模拟器\n\n尽管在编写时，市场上还没有可以进行应用测试的折叠屏设备，但 Android SDK\
  \ 包含了折叠屏模拟器。要创建一个折叠屏模拟器，选择 `Android Studio Tools -> AVD Manager` 菜单选项，点击 `Create\
  \ Virtual Device` 按钮，并在硬件选择屏幕上选择下方图 64-3 所示的 `Foldable` 选项之一：\n\n![image-GJEH5IHR.jpg](img/image-GJEH5IHR.jpeg)\n\
  \n图 64-3\n\n在选择折叠屏后，继续创建过程，选择 `Android 10 API 29` 或更高版本作为系统镜像。\n\n一旦模拟器启动，工具栏上将出现一个额外的按钮，允许模拟器在折叠和展开配置之间进行切换：\n\
  \n![image-IIUYOI9M.jpg](img/image-IIUYOI9M.jpeg)\n\n图 64-4\n\n## 64.3 进入多窗口模式\n\n\
  可以通过显示概览（Overview）屏幕、长按列出应用在工具栏中的应用图标来进入分屏模式，并选择如图 64-5 所示的 `Split screen` 菜单选项：\n\
  \n![image-7EXXWR0Y.jpg](img/image-7EXXWR0Y.jpeg)\n\n图 64-5\n\n一旦进入分屏模式，概览按钮将变为显示两个矩形（在图\
  \ 64-6 中标记为 A），当前活动将填充屏幕的一部分 (B)，概览屏幕将出现在屏幕的相邻部分，允许选择第二个活动进行显示 (C)：\n\n![image-I45IIN83.jpg](img/image-I45IIN83.jpeg)\n\
  \n图 64-6\n\n一旦选择了第二个应用，屏幕将如上文图 64-1 所示被均匀平分。\n\n要退出分屏模式，只需将分隔两个活动的分割线拖动到远端，使一个活动填充整个屏幕，或者长按概览按钮直到它恢复为单个正方形。\n\
  \n## 64.4 启用自由窗口支持\n\n尽管并非在所有设备上都得到官方支持，在大屏幕设备和模拟器上可以启用自由窗口模式。要启用此模式，在模拟器运行时或设备连接时运行以下\
  \ `adb` 命令：\n\n```\nadb shell settings put global enable_freeform_support 1\n```\n\
  \n进行更改后，可能需要重启设备才能生效。\n\n一旦启用，在概览屏幕上长按应用图标时将出现一个额外的选项，如图 64-7 所示：\n\n![image-2DRGHZ.jpg](img/image-2DRGHZ.jpeg)\n\
  \n图 64-7\n\n## 64.5 检查自由窗口支持\n\n正如本章早期概述，Google 将是否启用自由窗口多窗口模式交给了各个 Android 设备制造商。由于自由窗口在大屏幕设备上才有意义，因此无法保证在运行应用程序的每个设备上都有自由窗口。幸运的是，如果设备不支持自由窗口，系统将忽略所有特定的自由窗口的方法和属性，因此使用这些不会导致应用程序在非自由窗口设备上崩溃。然而，可能会出现需要检测设备是否支持自由窗口多窗口模式的情况。这可以通过检查包管理器中的自由窗口管理功能来实现。以下代码示例检查了自由窗口多窗口支持，并根据结果返回布尔值：\n\
  \n```java\npublic Boolean checkFreeform() {\n    return getPackageManager().hasSystemFeature(\n\
  \    PackageManager.FEATURE_FREEFORM_WINDOW_MANAGEMENT);\n}\n```\n\n## 64.6 在应用中启用多窗口支持\n\
  \n清单文件中的 `android:resizableActivity` 设置控制应用程序是否支持多窗口行为。该设置可以在应用程序级别或单个活动级别进行。例如，以下片段配置了名为\
  \ `MainActivity` 的活动以分屏和自由窗口多窗口模式：\n\n```xml\nandroid:name=\".MainActivity\"\nandroid:resizeableActivity=\"\
  true\"\nandroid:label=\"@string/app_name\"\nandroid:theme=\"@style/AppTheme.NoActionBar\"\
  >\n```\n\n\n\n\n\n将属性设置为 `false` 将防止该活动出现在分屏模式或自由窗口模式下，并且相应的按钮将不会出现在概览（Overview）菜单中。在分屏配置中，选择一个禁用了多窗口支持的活动作为第二个活动，将导致一条消息，指示该应用可能不支持多窗口模式。\n\
  \n## 64.7 指定多窗口属性\n在元素中提供了若干属性，用于指定活动在进入多窗口模式时启动时的尺寸和位置。当活动在自由窗口模式下启动时，其初始高度、宽度和位置可以使用以下属性指定：\n\
  \n- `android:defaultWidth`: 指定活动的默认宽度。\n- `android:defaultHeight`: 指定活动的默认高度。\n\
  - `android:gravity`: 指定活动的初始位置（起始、、结束、左侧、右侧、顶部等）。\n\n请注意，上述属性仅在活动于自由窗口模式下显示时生效。以下示例配置了活动以特定的高度和宽度出现在屏幕顶部边缘：\n\
  \n```\nandroid:defaultWidth=\"450dp\"\nandroid:gravity=\"start\"\n```\n\n可以使用以下属性来指定活动在分屏视图或自由窗口模式下可以缩小的最小宽度和高度：\n\
  \n- `android:minimalHeight`: 指定活动在分屏屏幕或自由窗口模式下可以缩小的最小高度。\n- `android:minimalWidth`:\
  \ 指定活动可以缩小的最小宽度。\n\n当用户将分屏分割线滑出最小高度或宽度时，系统将停止调整活动的布局，并简单地裁剪用户界面以为相邻的活动留出空间。以下清单文件为某个活动实现了最小宽度和高度属性：\n\
  \n```\nandroid:minimalWidth=\"290dp\"\n```\n\n## 64.8 检测多窗口模式\n可能会出现某些情况，即活动需要检测其当前是否在多窗口模式下显示给用户。可以通过调用\
  \ `Activity` 类的 `isInWindowMode()` 方法获取当前状态。调用此方法时，它将返回 `true` 或 `false` 值，取决于活动当前是否处于全屏状态：\n\
  \n```\nif (this.isInWindowMode()) {\n    // 活动正在多窗口模式下运行\n} else {\n    // 活动不在多窗口模式\n\
  }\n```\n\n## 64.9 接收多窗口通知\n如果活动重写了 `onWindowModeChanged()` 回调方法，它将接收进入或退出多窗口模式的通知。传递给该方法的第一个参数在进入多窗口模式时为\
  \ `true`，在活动退出时为 `false`。新的配置设置包含在作为第二个参数传递的 `Configuration` 对象中：\n\n```java\n@Override\n\
  public void onWindowModeChanged(boolean isInWindowMode, Configuration newConfig)\
  \ {\n    super.onWindowModeChanged(isInWindowMode, newConfig);\n    if (isInWindowMode)\
  \ {\n        // 活动已进入多窗口模式\n    } else {\n        // 活动已退出多窗口模式\n    }\n}\n```\n\
  \n正如“处理活动状态”章节概述，Android 10 及更高版本允许多个活动处于恢复状态（也称为多恢复状态，multi-resume）。用户最近交互的活动被称为顶层活动（topmost\
  \ activity）。为了跟踪活动在获得和丢失顶层状态时的，可以在活动中实现 `onTopResumedActivityChanged()` 回调方法，例如：\n\
  \n```\n@Override\npublic void onTopResumedActivityChanged(boolean isTopResumedActivity)\
  \ {\n    super.onTopResumedActivityChanged(isTopResumedActivity);\n    if (isTopResumedActivity)\
  \ {\n        // 活动现在是顶层活动\n    } else {\n        // 活动不再是顶层活动\n    }\n}\n```\n\n\
  在某些运行 Android 9 的设备上，通过在应用清单中启用以下属性，也可以在应用利用多恢复功能：\n\n```\nandroid:name=\"android.allow_resumed_activities\"\
  \ android:value=\"true\"\n```\n\n## 64.10 在多窗口模式下启动活动\n在本书的“Android 显式意图——示例”章节中，创建了一个示例应用，其中一个活动使用\
  \ `intent` 启动第二个活动。默认情况下，通过 `intent` 启动的活动被认为与源活动位于同一个任务栈（task stack）中。然而，可以通过向\
  \ `intent` 传递适当的标志将活动启动到新的任务栈中。\n\n当多窗口模式下的活动在同一个任务栈内启动另一个活动时，新活动将替换分屏或自由窗口窗口中的源活动（用户通过返回键返回到原始活动）。然而，在分屏模式下启动到新的任务栈时，第二个活动将出现在原始活动相邻的窗口中，允许同时查看两个活动。在自由窗口模式下，启动的活动将出现在与原始活动独立的窗口中。\n\
  \n要将活动启动到新的任务栈，必须在启动之前在 `intent` 上设置以下标志：\n\n- `Intent.FLAG_ACTIVITY_LAUNCH_ADJACENT`\n\
  - `Intent.FLAG_ACTIVITY_MULTIPLE_TASK`\n- `Intent.FLAG_ACTIVITY_NEW_TASK`\n\n例如，以下代码配置并启动了设计为在独立窗口中出现的第二个活动：\n\
  \n```\nIntent i = new Intent(this, SecondActivity.class);\ni.addFlags(Intent.FLAG_ACTIVITY_LAUNCH_ADJACENT\
  \ |\n          Intent.FLAG_ACTIVITY_MULTIPLE_TASK |\n          Intent.FLAG_ACTIVITY_NEW_TASK);\n\
  startActivity(i);```\n\n## 64.11 配置自由活动尺寸和位置\n默认情况下，在自由窗口模式下启动到不同任务栈的活动将位于屏幕中心，尺寸由系统决定。可以通过\
  \ `ActivityOptions` 类将边界设置传递给 `intent` 来控制此窗口的位置和尺寸。此过程的第一步是创建一个 `Rect` 对象，配置代表活动窗口的左侧\
  \ (X)、顶部 (Y)、右侧 (X) 和底部 (Y) 坐标。以下示例创建了一个 `Rect` 对象，其左上角位于 (0, 0)，右下角位于 (100, 100)：\n\
  \n```\nRect rect = new Rect(100, 800, 900, 700);\n```\n\n下一步是创建 `ActivityOptions`\
  \ 类的基本实例，并通过 `setLaunchBounds()` 方法使用 `Rect` 设置进行初始化：\n\n```\nActivityOptions options\
  \ = ActivityOptions.makeBasic();\nActivityOptions bounds = options.setLaunchBounds(rect);\n\
  ```\n\n最后，将 `ActivityOptions` 实例转换为 `Bundle` 对象并与 `Intent` 对象一起传递给 `startActivity()`\
  \ 方法：\n\n```\nstartActivity(i, bounds.toBundle());```\n\n组合这些步骤后得到的代码序列如下：\n\n```\n\
  Intent i = new Intent(this, SecondActivity.class);\ni.addFlags(Intent.FLAG_ACTIVITY_LAUNCH_ADJACENT\
  \ |\n      Intent.FLAG_ACTIVITY_MULTIPLE_TASK |\n      Intent.FLAG_ACTIVITY_NEW_TASK);\n\
  Rect rect = new Rect(100, 800, 900, 700);\nActivityOptions options = ActivityOptions.makeBasic();\n\
  ActivityOptions bounds = options.setLaunchBounds(rect);\nstartActivity(i, bounds.toBundle());\n\
  ```\n\n当源活动在自由窗口模式下通过 `intent` 启动第二个活动时，新活动窗口将按照 `Rect` 对象定义的位置和尺寸出现。\n\n\n\n\n\n\
  Android 7 引入了多窗口支持，该系统允许屏幕上同时显示多个活动（activity）。这一功能现在已成为支持折叠屏设备的基础。多窗口支持提供了三种模式：分屏模式、自由窗口模式和画中画。在分屏模式下，屏幕被水平或垂直划分为两个窗格，每个窗格中显示一个活动。自由窗口模式仅在某些\
  \ Android 设备上支持，它允许每个活动出现在独立的、可移动且可调整大小的窗口中。正如本章概述，Android SDK 提供了许多方法和属性设置，用于检测、响应和控制应用内部的多窗口行为。\n\
  \n# 65. Android SQLite 数据库概览\n\n不需要存储至少某些持久化数据的移动应用程序寥寥无几。数据库是大多数应用程序不可或缺的方面，范围从几乎完全由数据驱动的应用到需要存储少量数据（如常见的游戏分数）的应用不等。\n\
  \n当考虑到典型 Android 应用的瞬态生命周期时，持久化数据存储的重要性变得显而易见。由于 Android 运行时系统随时存在终止应用程序组件以释放资源的风险，制定一个全面的数据存储策略以避免数据丢失，是设计和实现任何应用开发策略的关键因素。\n\
  \n本章将涵盖与 Android 操作系统绑定的 SQLite 数据库管理系统，并概述用于在 Android 应用中实现持久化 SQLite 数据库存储的 Android\
  \ SDK 类。在探讨 Android 开发背景下的 SQLite 细节之前，将先对数据库和 SQL 进行简要概述。\n\n## 65.1 理解数据库表\n\n\
  数据库表提供了数据库中最基础层的数据结构。每个数据库可以包含多个表，每个表设计用于存储特定类型的信息。例如，一个数据库可能包含一个客户表，其中包含特定业务每个客户的名称、地址和电话号码。同一个数据库可能还包含一个产品表，用于存储该业务销售的产品描述以及相关的产品代码。\n\
  \n数据库中的每个表都分配有一个名称，该名称在该特定数据库中必须是唯一的。表名一旦分配给某个数据库中的表，除非在另一个数据库的范围内，否则不能用于另一个表。\n\
  \n## 65.2 引入数据库模式（Schema）\n\n数据库模式（Schemas）定义了存储在数据库表中的数据的特征。例如，客户表的模式可能会定义客户名为长度不超过\
  \ 20 个字符的字符串，并将客户电话为特定格式的数值数据字段。\n\n模式还用于定义整个数据库的结构以及每个数据库中各个表之间的关系。\n\n## 65.3\
  \ 列和数据类型\n\n在此阶段，将数据库表视为电子表格（数据存储在行和列中）是有帮助的。\n\n每列代表对应表中的一个数据字段。例如，一个表的名称、地址和电话数据字段都是列。\n\
  \n每列又被定义为包含特定类型的数据。因此，设计用于存储数字的列被定义为包含数值数据。\n\n## 65.4 数据库行\n\n保存到表中的每条新记录都存储在行中。每行又由与所存记录相关的各个列组成。\n\
  \n再次考虑本章前面描述的电子表格类比。客户表中的每个条目都等同于电子表格中的行，每一列都包含每个客户的数据（名称、地址、电话等）。当向表中添加新客户时，会创建一个新行，并将该客户的数据存储在该新行的对应列中。\n\
  \n行有时也被称为记录（records）或条目（entries），这些术语通常可以通用使用。\n\n## 65.5 引入主键\n\n每个数据库表都应该包含一个或多个列，用于唯一标识表中的每一行。这在数据库术语中被称为主键（Primary\
  \ Key）。例如，一个表可以使用银行账户列作为主键。或者，客户表可以使用客户的社会安全号码作为主键。\n\n主键允许数据库管理系统唯一地标识表中的特定行。如果没有主键，将无法检索或删除表中的某个特定行，因为无法确定是否选择了正确的行。例如，假设存在一个表，客户的姓氏被定义为主键。想象一下，如果数据库中记录了多个姓“Smith”的客户，会产生什么问题。如果没有某种确定的方法来唯一地标识某个特定行，要确保在任何时候访问的都是正确的数据是不可能的。\n\
  \n主键可以由表中的单列组成，也可以由多列组成。要符合单列主键的条件，任何两行不能包含匹配的主键值。当使用多个列构建主键时，单个列的值不需要是唯一的，但所有列的值组合起来必须是唯一的。\n\
  \n## 65.6 什么是 SQLite？\n\nSQLite 是一种嵌入式关系型数据库管理系统（RDBMS）。大多数关系型数据库（Oracle、SQL Server\
  \ 和 MySQL 是主要示例）都是独立运行的后台服务器进程，与需要数据库访问的应用程序协作。SQLite 被称为嵌入式，是因为它以库的形式提供，并链接到应用程序中。因此，后台没有运行运行独立的数据库服务器。所有的数据库操作都是通过调用\
  \ SQLite 库中的函数在应用程序内部处理的。\n\nSQLite 的开发者已将该技术置于公共领域，结果它现在是一项广泛部署的数据库解决方案。\n\nSQLite\
  \ 使用 C 语言编写，因此 Android SDK 在底层数据库接口周围提供了一个基于 Java 的“封装”。它由类组成，可以在应用程序的 Java 或 Kotlin\
  \ 代码中用于创建和管理基于 SQLite 的数据库。\n\n有关 SQLite 的更多信息，请参考 `https://www.sqlite.org`。\n\n\
  ## 65.7 结构化查询语言\n\n### (SQL)\n\n在 SQLite 数据库中使用称为结构化查询语言的高级语言访问数据。这种语言通常缩写为 SQL，读作\
  \ sequel。SQL 是大多数关系型数据库管理系统使用的标准语言。SQLite 基本符合 SQL-92 标准。\n\nSQL 是一种直观且易于使用的语言，专门为读取和写入数据库数据而设计。由于\
  \ SQL 包含一组较小的关键字，可以快速学习。此外，SQL 语法在大多数 DBMS 实现中大体相同，因此学习了一个系统的后，你的技能可能会转移到其他数据库管理系统。\n\
  \n虽然本章将使用一些基础 SQL 语句，但对 SQL 的详细概述超本书的范范围。然而，许多其他资源提供的 SQL 概述远比我们在这里这一章中能提供的要。\n\n\
  ## 65.8 在 Android 虚拟设备 (AVD) 上尝试 SQLite\n\n\n\n\n\n对于不熟悉数据库和 SQLite 的读者来说，直接上手创建一个使用\
  \ SQLite 的 Android 应用程序可能会让他们感到畏畏。幸运的是，Android 预装了 SQLite，其中包含一个交互环境，允许在连接到运行中的\
  \ Android AVD 模拟器实例的 `adb shell` 会话中发布 SQL 命令。这是学习 SQLite 和 SQL 的一种实用方法，对于识别运行在模拟器中的应用程序所创建的数据库问题是一个极具价值的工具。\n\
  \n要启动交互式 SQLite 会话，首先要运行 AVD 会话。这可以在 Android Studio 中通过启动 Android 设备管理器（`Tools`\
  \ -> `Device Manager`）、选择一个之前配置过的 AVD 并点击启动按钮来实现。\n\n一旦 AVD 运行，打开终端（Terminal）或命令提示符窗口，使用\
  \ `adb` 命令行工具连接到模拟器，如下所示：\n\n```bash\nadb shell\n```\n\n连接后，shell 环境将提供一个命令提示符，可以在其中输入命令。首先使用\
  \ `su` 命令获取超级用户权限：\n\n```bash\nGeneric_x86:/ su\nroot@android:/ #\n```\n\n如果消息显示不允许使用超级用户权限，则该\
  \ AVD 实例可能包含 Google Play 支持。要解决此问题，请创建一个新的 AVD，并在“选择设备定义”屏幕上选择一个在“Play Store”列没有标记的设备。\n\
  \nSQLite 数据库中的数据存储在运行应用程序的 Android 设备文件系统的数据库文件中。默认情况下，这些数据库文件的文件系统路径如下：\n\n`/data/data//databases/.db`\n\
  \n例如，如果一个包名为 `com.example.MyDBApp` 的应用程序创建了一个名为 `mydatabase.db` 的数据库，则在设备上的文件路径如下：\n\
  \n`/data/data/com.example.MyDBApp/databases/mydatabase.db`\n\n因此，为了本次练习，请在 `adb\
  \ shell` 中切换目录到 `/data/data` 并创建一个适用于某些 SQLite 实验的子目录结构：\n\n```bash\ncd /data/data\n\
  mkdir com.example.dbexample\ncd com.example.dbexample\nmkdir databases\ncd databases\n\
  ```\n\n为数据库文件创建合适的位置后，如下所示启动交互式 SQLite 工具：\n\n```bash\nroot@android:/data/data/databases\
  \ # sqlite3 ./mydatabase.db\nsqlite3 ./mydatabase.db\n```\n\nSQLite 版本 3.8.10.2\
  \ 2015-05-20 18:17:19\n\n输入 `\".help\"` 获取用法提示。\n\n`sqlite>`\n\n在 `sqlite>` 提示符下，可以输入命令来执行任务，如创建表、插入和检索数据。例如，要在我们的数据库中创建一个新表，并包含用于存储\
  \ ID、名称、地址和电话的字段，需要以下语句：\n\n```sql\ncreate table contacts (_id integer primary key\
  \ autoincrement, name text, address text, phone text);\n```\n\n注意，表中的每行都应该有一个对该行唯一的主键。在上面的示例中，我们把\
  \ `ID` 字段指定为主键，将其声明为类型为 `integer`，并要求 SQLite 在每次添加新行时自动增加数字。这是确保每行都具有唯一主键的常用方法。在大多数其他平台上，主键的名称选择是任意的。然而，在\
  \ Android 中，主键必须命名为 `_id`，以便使用所有 Android 数据库相关类完全访问数据库。其余字段每个都声明为 `text` 类型。\n\n\
  要列出当前所选数据库中的表，使用 `.tables` 语句：\n\n```sql\nsqlite> .tables\ncontacts\n```\n\n向表中插入记录：\n\
  \n```sql\nsqlite> insert into contacts (name, address, phone) values (\"Bill Smith\"\
  , \"123 Main Street, California\", \"123-555-2323\");\nsqlite> insert into contacts\
  \ (name, address, phone) values (\"Mike Parks\", \"10 Upping Street, Idaho\", \"\
  444-444-1212\");\n```\n\n从表中检索所有行：\n\n```sql\nsqlite> select * from contacts;\n\
  1|Bill Smith|123 Main Street, California|123-555-2323\n2|Mike Parks|10 Upping Street,\
  \ Idaho|444-444-1212\n```\n\n提取符合特定标准的行：\n\n```sql\nsqlite> select * from contacts\
  \ where name=\"Mike Parks\";\n2|Mike Parks|10 Upping Street, Idaho|444-444-1212\n\
  ```\n\n退出 `sqlite3` 交互环境：\n\n```sql\nsqlite> .exit\n```\n\n在模拟器环境中运行 Android 应用程序时，任何数据库文件都将根据之前过的路径约定在模拟器文件系统中创建。这样做的好处是，你可以通过\
  \ `adb` 连接，导航到数据库文件的位置，将其加载到 `sqlite3` 交互工具中并对数据进行操作以识别应用程序代码中可能发生的问题。\n\n同样重要的是，虽然可以通过\
  \ `adb shell` 连接到物理 Android 设备，但 shell 默认没有获得足够的权限来创建和管理 SQLite 数据库。因此，数据库问题的调试最好使用\
  \ AVD 会话进行。\n\n# 65.9 Android SQLite 类\n\n如前所述，SQLite 是用 C 语言编写的，而 Android 应用程序主要使用\
  \ Java 或 Kotlin 开发。为了弥补这种“语言差异”，Android SDK 包含了一组类，在 SQLite 之上提供了一个编程层。本章剩余部分将提供该类别中主要类的简单概述。\n\
  \n## 65.9.1 Cursor\n\n这是一个专门用于访问数据库查询结果的类。例如，对数据库执行的 SQL 操作可能会返回多个匹配行。可以使用 `Cursor`\
  \ 实例来遍历这些结果，并在应用程序代码中使用各种方法进行访问。该类的一些关键方法包括：\n\n- `close()`：释放游标使用的资源并关闭它。\n- `getCount()`：返回结果集中行数。\n\
  - `moveToFirst()`：移动到结果集的第一行。\n- `moveToLast()`：移动到结果集的最后一行。\n- `moveToNext()`：移动到结果集的下一行。\n\
  - `move()`：根据指定的偏移从当前位置移动。\n- `get()`：返回当前位置指定列索引处的值（变体包括 `getString()`、`getInt()`、`getShort()`、`getFloat()`\
  \ 和 `getDouble()`）。\n\n### 65.9.2 SQLiteDatabase\n\n该类提供了应用程序代码与底层 SQLite 之间的主要接口，包括创建、删除和对数据库执行\
  \ SQL 操作的能力。该类的一些关键方法包括：\n\n- `insert()`：向数据库表插入新行。\n- `delete()`：从数据库表中删除行。\n-\
  \ `query()`：执行指定的数据库查询并通过 `Cursor` 对象返回匹配结果。\n- `execSQL()`：执行不返回结果数据的单条 SQL 语句。\n\
  - `rawQuery()`：执行 SQL 查询语句并以 `Cursor` 对象的形式返回匹配结果。\n\n## 65.9.3 SQLiteOpenHelper\n\
  \n这是一个旨在简化创建和更新数据库的辅助类。该类必须在寻求数据库访问的应用程序代码中子类，并在该子类中实现以下回调方法：\n\n- `onCreate()`：在首次创建数据库时调用。该方法将\
  \ `SQLiteDatabase` 对象作为参数传递给新创建的数据库。这是初始化数据库（创建表和插入任何初始数据行）的理想位置。\n- `onUpgrade()`：当应用程序代码包含更新的数据库版本号引用时调用。这通常用于应用程序在设备上更新且需要数据库架构也进行更新以处理额外数据存储的情况。\n\
  \n\n\n\n除了上述强制性的回调方法外，在打开数据库时调用的 `onOpen()` 方法也可以在子类中实现。\n\n子类的构造函数也必须实现，以调用父类，并传递应用上下文、数据库名称和数据库版本。\n\
  \n`SQLiteOpenHelper` 类的常用方法包括：\n\n- `getWritableDatabase()` – 打开或创建一个用于读写的数据库。返回一个以\
  \ `SQLiteDatabase` 对象形式的数据库引用。\n- `getReadableDatabase()` – 创建或打开一个仅读的数据库。返回一个以\
  \ `SQLiteDatabase` 对象形式的数据库引用。\n- `close()` – 关闭数据库。\n\n## 65.9.4 ContentValues\n\
  \n`ContentValues` 是一个便利类，允许声明键/值对，这些键/值对由表列标识符和要存储在每列中的值组成。该类在数据库表中插入或更新条目时具有特别的用处。\n\
  \n## 65.10 Android Room 持久化库\n\nAndroid SDK `SQLite` 类的局限性在于它们需要中等的编码工作，并且没有利用新的架构指南和功能（如\
  \ `LiveData` 和生命周期管理）。Android Jetpack 架构组件包含了 Room 持久化库来解决这些缺点。该库在 `SQLite` 数据库系统之上提供了一个高层接口，能够以极少的代码在\
  \ Android 设备上本地存储数据，同时符合现代应用程序架构的建议。\n\n接下来的章节将提供使用 `SQLite` 和 Room 持久化库进行 SQLite\
  \ 数据库管理的概述和教程。\n\n## 65.11 总结\n\n`SQLite` 是一个轻量级的嵌入式关系型数据库管理系统，包含在 Android 框架中，并为\
  \ Android 应用实现组织化的持久化数据存储提供了机制。与 Room 持久化库结合时，Android 提供了一种从 Android 应用内部实现数据存储的现代方法。\n\
  \n本章在 Android 应用开发的背景下，对数据库以及特别是 `SQLite` 概述。\n\n## 66. Android SQLite 数据库教程\n\n\
  标题为“Android SQLite 数据库概述”的章节涵盖了使用 `SQLite` 数据库管理系统将关系数据库存储集成到 Android 应用中的基本原理。在本章中，我们将创建一个使用\
  \ `SQLite` 数据库的项目，用于存储和检索数据。\n\n## 66.1 关于数据库示例\n\n该示例项目是一个简单的数据输入和检索应用程序，允许用户添加、查询和删除数据库条目。该应用程序背后的思想是一个包含客户姓名和电话的简单联系人数据库。\n\
  \n数据库文件的名称将为 `customerDB.db`，它反将包含一个名为 `customers` 的单表。数据库表中的每条记录将包含一个唯一的客户 ID、客户姓名和电话，分别对应列名\
  \ `customername` 和 `customerphone`。客户 ID 列将作为主键，并由数据库管理系统自动分配和递增。\n\n## 66.2 创建\
  \ SQLDemo 项目\n\n启动 Android Studio，从欢迎界面选择 New Project（新建项目）选项，在生成的新项目对话框中，在点击 Next（下一步）按钮之前选择\
  \ Empty Views Activity 模板。\n\n在 `Name`（名称）字段中输入 `SQLDemo` 并指定 `com.ebookfrenzy.sqldemo`\
  \ 为包名。在点击 Finish（完成）按钮之前，将 Minimum API level 设置为 `API 26`：Android 8.0 (Oreo)，并将语言菜单更改为\
  \ `Java`。使用第 12.8 节 迁移项目到 View Binding 中的步骤为项目启用视图绑定。\n\n## 66.3 设计用户界面\n\n打开 `activity_main.xml`\
  \ 文件并删除默认的 `TextView` 组件。在布局中添加两个 Plain Text（纯文本）字段、三个 Buttons 和一个 `TextView`，并如图\
  \ 66-1 所示进行定位：\n\n![image-DVXU5QQR.jpg](img/image-DVXU5QQR.jpeg)\n\n图 66-1\n\n将\
  \ Plain Text 视图的 `hint` 属性改为“name”和“phone”，并移除默认的“Name”文本属性。修改按钮使其显示为“Add”、“Find”和“Delete”，并将\
  \ `TextView` 文本改为“Database Ready”，将所有字符串值提取到资源中，并手动或使用 Infer 按钮应用布局约束。\n\n将 Plain\
  \ Text 视图和 `TextView` 的 ID 分别更改为 `customerName`、`customerPhone` 和 `statusText`。最后，配置按钮调用命名为\
  \ `addCustomer`、`findCustomer` 和 `deleteCustomer` 的方法。\n\n## 66.4 创建数据模型\n\n完成后，该应用程序将由一个\
  \ activity 类和一个数据库处理器类组成。数据库处理器将是 `SQLiteOpenHelper` 的子类，并在底层 `SQLite` 数据库与 activity\
  \ 类之间提供一个抽象层，activity 调用数据库处理器与数据库进行交互（添加、删除和查询数据库条目）。为了以结构化的方式实现这种交互，需要实现第三类来持有在\
  \ activity 和处理器之间传递的数据库条目数据。这实际上非常简单的类，能够持有客户 ID、姓名和电话值，以及用于访问这些值的 getter 和 setter\
  \ 方法。该类的实例可以在 activity 和数据库处理器中创建，并根据需要来回传递。本质上，这个类代表了数据库模型。\n\n在 Project 工具窗口中导航到\
  \ `app -> java` 并右键点击包名。从弹出菜单中选择 New -> Java Class 选项，在 Create New Class 对话框中将类命名为\
  \ `Customer`，并将 Kind 菜单更改为 `Class`，然后按键盘上的 Enter 键。\n\n一旦创建，`Customer.java` 源文件将自动加载到\
  \ Android Studio 编辑器。加载后，修改代码以添加相应的构造函数：\n\n```\npackage com.ebookfrenzy.sqldemo;\n\
  \npublic class Customer {\n\nprivate int id;\n\nprivate String customerName;\n\n\
  private String customerPhone;\n\npublic Customer() {\n\n}\n\npublic Customer(int\
  \ id, String customerName, String customerPhone) {\nthis.id = id;\nthis.customerName\
  \ = customerName;\nthis.customerPhone = customerPhone;\n}\n\npublic Customer(String\
  \ customerName, String customerPhone) {\n\nthis.customerName = customerName;\nthis.customerPhone\
  \ = customerPhone;\n}\n\npublic void setID(int id) {\nthis.id = id;\n}\n\npublic\
  \ int getID() {\nreturn id;\n}\n\npublic void setCustomerName(String customerName)\
  \ {\nthis.customerName = customerName;\n}\n\npublic String getCustomerName() {\n\
  return customerName;\n}\n\npublic void setCustomerPhone(String customerPhone) {\n\
  this.customerPhone = customerPhone;\n}\n\npublic String getCustomerPhone() {\nreturn\
  \ customerPhone;\n}\n\n}\n\n```\n\n完成后的类包含了用于存储数据库条目列的数据成员。\n\n## 66.5 实现数据处理器\n\
  \n数据处理器将通过子类 Android `SQLiteOpenHelper` 类来实现，并如“Android SQLite 数据库概述”所述，添加构造函数、`onCreate()`\
  \ 和 `onUpgrade()` 方法。由于处理器需要代表 activity 组件添加、查询和删除数据，该类中还需要添加对应的方法。\n\n首先，向项目添加第二个新类作为处理器，命名为\
  \ `MyDBHandler`。一旦创建了新类，将其修改为如下：\n\n```\npackage com.ebookfrenzy.sqldemo;\n\nimport\
  \ android.database.sqlite.SQLiteDatabase;\nimport android.database.sqlite.SQLiteOpenHelper;\n\
  import android.content.Context;\nimport android.content.ContentValues;\nimport android.database.Cursor;\n\
  \npublic class MyDBHandler extends SQLiteOpenHelper {\n```\n\n\n\n\n```java\npublic\
  \ MyDBHandler(Context context, String name,\n    SQLiteDatabase.CursorFactory factory,\
  \ int version) {\n    super(context, DATABASE_NAME, factory, DATABASE_VERSION);\n\
  }\n\n@Override\npublic void onCreate(SQLiteDatabase db) {\n}\n\n@Override\npublic\
  \ void onUpgrade(SQLiteDatabase db, int oldVersion,\n    int newVersion) {\n}\n\
  }\n```\n\n现在已经通过模板 `onCreate()` 和 `onUpgrade()` 方法预填充了源文件，下一个任务是修改代码，以声明数据库名称、表名、表列和数据库版本的常量，如下：\n\
  \n.\n.\n\n```java\npublic class MyDBHandler extends SQLiteOpenHelper {\n    private\
  \ static final int DATABASE_VERSION = 1;\n    private static final String DATABASE_NAME\
  \ = \"customerDB.db\";\n    public static final String TABLE_CUSTOMERS = \"customers\"\
  ;\n    public static final String COLUMN_ID = \"id\";\n    public static final String\
  \ COLUMN_CUSTOMERNAME = \"customername\";\n    public static final String COLUMN_CUSTOMERPHONE\
  \ = \"customerphone\";\n}\n```\n\n.\n接下来，需要实现 `onCreate()` 方法，以便在数据库首次初始化时创建 customers\
  \ 表。这涉及构造一个 SQL CREATE 语句，该语句包含创建具有适当列的新表所需的指令，然后将其传递给 `SQLiteDatabase` 对象的 `execSQL()`\
  \ 方法，该对象是作为参数传递给 `onCreate()` 的：\n\n```java\n@Override\npublic void onCreate(SQLiteDatabase\
  \ db) {\n    String CREATE_CUSTOMERS_TABLE = \"CREATE TABLE \" +\n        TABLE_CUSTOMERS\
  \ + \"(\"\n        + COLUMN_ID + \" INTEGER PRIMARY KEY,\" +\n        COLUMN_CUSTOMERNAME\n\
  \        + \" TEXT,\" + COLUMN_CUSTOMERPHONE + \" TEXT\" + \")\";\n    db.execSQL(CREATE_CUSTOMERS_TABLE);\n\
  }\n```\n\n当处理程序使用的数据库版本号大于之前使用的版本时，会调用 `onUpgrade()` 方法。在此情况下执行的精确步骤将取决于具体的应用程序，因此在本例中，我们将删除旧数据库并创建一个新的：\n\
  \n```java\n@Override\npublic void onUpgrade(SQLiteDatabase db, int oldVersion,\n\
  \    int newVersion) {\n    db.execSQL(\"DROP TABLE IF EXISTS \" + TABLE_CUSTOMERS);\n\
  \    onCreate(db);\n}\n```\n\n在 `MyDBHandler.java` 处理类中，剩下的只需实现添加、查询和删除数据库表条目的方法。\n\
  \n## 66.6 添加处理方法 (Add Handler Method)\n\n插入数据库记录的方法将命名为 `addCustomer()`，它将接受一个 `Customer`\
  \ 数据模型类的实例作为参数。在方法体内部创建一个 `ContentValues` 对象，并用从 `Customer` 对象中提取出的数据列的键值对进行填充。接下来，通过调用\
  \ `getWritableDatabase()` 获取数据库引用，然后调用返回的数据库对象的 `insert()` 方法。最后，在完成插入后，需要关闭数据库：\n\
  \n```java\npublic void addCustomer(Customer customer) {\n    ContentValues values\
  \ = new ContentValues();\n    values.put(COLUMN_CUSTOMERNAME, customer.getCustomerName());\n\
  \    values.put(COLUMN_CUSTOMERPHONE, customer.getCustomerPhone());\n    SQLiteDatabase\
  \ db = this.getWritableDatabase();\n    db.insert(TABLE_CUSTOMERS, null, values);\n\
  \    db.close();\n}\n```\n\n## 66.7 查询处理方法 (Query Handler Method)\n\n查询数据库的方法将命名为\
