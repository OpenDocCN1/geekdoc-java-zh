  \    NavigationUI.setupActionBarWithNavController(this, navController, appBarConfiguration);\n\
  \    binding.fab.setOnClickListener(new View.OnClickListener() {\n\n        @Override\n\
  ```\n\n\n\n\n\n```java\npublic void onClick(View view) {\n    Snackbar.make(view,\
  \ \"Replace with your own action\", Snackbar.LENGTH_LONG)\n    .setAction(\"Action\"\
  , null).show();\n}\n});\n```\n\n如果你需要悬浮操作按钮但不需要菜单，请使用 Basic Views Activity 模板并按照以下步骤操作：\n\
  \n1. 编辑主类文件并删除 `onCreateOptionsMenu` 和 `onOptionsItemSelected` 方法。\n2. 在 Project\
  \ 工具窗口中选择 `res -> menu` 项，并按键盘 `Delete` 键从项目中删除该文件夹和相应的菜单资源文件。\n\n如果你需要使用 Basic\
  \ Views Activity 模板，但既不需要导航功能也不需要第二个内容碎片，请以下步骤操作：\n\n1. 在 Project 工具窗口中，导航并双击 `app\
  \ -> res -> navigation -> nav_graph.xml` 文件，将其加载到导航编辑器中。\n2. 在编辑器中，选择图面板中的 `SecondFragment`\
  \ 条目，并按键盘删除键将其从图中移除。\n3. 找到并删除 `SecondFragment.java`（`app -> java -> -> SecondFragment`）和\
  \ `fragment_second.xml`（`app -> res -> layout -> fragment_second.xml`）文件。\n4. 最后的任务是从\
  \ `FirstFragment` 类中删除一些代码，以便 `Button` 视图在点击时不再导航到已不存在的第二个碎片。找到 `FirstFragment.java`\
  \ 文件，双击将其加载到编辑器中，并移除 `onViewCreated()` 方法中的代码，使其如下：\n\n```java\npublic void onViewCreated(@NonNull\
  \ View view, Bundle savedInstanceState) {\n    super.onViewCreated(view, savedInstanceState);\n\
  \    binding.buttonFirst.setOnClickListener(new View.OnClickListener() {\n     \
  \   @Override\n        public void onClick(View view) {\n            NavHostFragment.findNavController(FirstFragment.this)\n\
  \            .navigate(R.id.action_FirstFragment_to_SecondFragment);\n        }\n\
  \    });\n}\n```\n\n## 18.2 Android Studio 布局编辑器\n\n如前面的章节所示，布局编辑器工具提供了一个“所见即所得”（WYSIWYG）的环境，在该环境中，可以从调板中选择视图，然后将其放置在代表\
  \ Android 设备显示的画布上。视图一旦放置在画布上，就可以对其进行移动、删除和调整大小（受父视图限制限制）。此外，可以使用属性（Attributes）工具窗口修改与所选视图相关的属性。\n\
  \n在底层，布局编辑器工具构建一个包含正在设计的用户界面定义的 XML 资源文件。因此，布局编辑器工具以三种不同的模式运行：设计（Design）、代码（Code）和拆（Split）。\n\
  \n## 18.3 设计模式\n\n在设计模式下，可以直接操作视图调板和布局的图形表示来视觉化操作用户界面。图 18-5 显示了 Android Studio\
  \ 布局编辑器在设计模式下的关键区域：\n\n![image-HBW4D9NN.jpg](img/image-HBW4D9NN.jpeg)\n\n图 18-5\n\
  \n- **A – 调板 (Palette)** – 调板提供了 Android SDK 提供的系列视图组件的访问。这些组件被分为类别，以便导航。可以通过从调板中拖拽视图组件并将其放置到布局所需的区域来向布局中添加项。\n\
  - **B – 设备屏幕 (Device Screen)** – 设备屏幕提供了设计中用户界面布局的视觉“所见即所得”表示。该布局允许通过选择、删除、移动和调整视图的大小来实现直接的设计操作。可以使用工具栏中的菜单随时更改布局代表的设备模型。\n\
  - **C – 组件树 (Component Tree)** – 如上一章（“理解 Android 视图、视图组和布局”）所述，用户界面是使用层次结构构建的。组件树提供了用户界面设计层次结构的视觉概述。从组件树中选择元素将导致布局中相应的视图被选中。同样，从设备屏幕布局中选择视图将选中组件树层次结构中的该视图。\n\
  - **D – 属性 (Attributes)** – 调板中列出的所有组件视图都有一组关联属性，用于调整该视图的行为和外观。布局编辑器的属性面板提供了布局中当前选中视图属性的访问，以便进行更改。\n\
  - **E – 工具栏 (Toolbar)** – 布局编辑器工具栏提供了各种选项的快速访问，包括但不限于缩放设备屏幕布局、更改当前显示的设备模型、在竖屏和横屏之间旋转布局，以及切换到不同的\
  \ Android SDK API 级别。工具栏还有一组上下文敏感按钮，当在设备屏幕布局中选择相关的视图类型时，这些按钮将会出现。\n- **F – 模式切换控制\
  \ (Mode Switching Controls)** – 这三个按钮提供了在布局编辑器工具的设计、代码和拆分模式之间来回切换。\n- **G - 缩放和平移动控制\
  \ (Zoom and Pan Controls)** – 此控制面板允许你对设计画布进行缩放、抓取并在放大时移动以寻找被遮挡的区域。\n\n## 18.4 调板\n\
  \n布局编辑器调板组织为两个面板，旨在方便查找和预览用于添加到布局设计中的视图组件。类别面板（在图 18-6 中标记为 A）列出了由 Android SDK 支持的不同类别的视图组件。当从列表中选择一个类别时，第二个面板\
  \ (B) 将更新以显示属于该类的组件列表：\n\n![image-Z9APWIMG.jpg](img/image-Z9APWIMG.jpeg)\n\n图 18-6\n\
  \n要将组件从调板添加到到布局画布上，请从组件列表或预览面板中选择该项，将其拖动到所需位置并放置到位。在所选类别内搜索特定组件，可以通过点击调板工具栏上的搜索按钮（在图\
  \ 18-6 中标记为 C）并输入组件名称来启动。随着字符的输入，匹配的结果将出现在组件列表中。如果你不确定组件的类别，在搜索之前或搜索期间选择“所有结果”（All\
  \ Results）类别。\n\n## 18.5 设计模式和布局视图\n\n布局编辑器默认以设计模式出现，如图 18-5 所示。此模式提供了用户界面的视觉表示。可以通过点击图\
  \ 18-7 中标记为 C 的按钮来选择设计模式：\n\n![image-MGUBENV6.jpg](img/image-MGUBENV6.jpeg)\n\n\
  图 18-7\n\n当布局编辑器工具处于设计模式时，可以用两种方式查看布局。图 18-5 所示的视图是设计视图，显示了布局和控件在运行程序中的外观。另一种模式是蓝图视图（Blueprint\
  \ view），它可以替代或同时设计视图显示。图 18-8 中的工具栏菜单提供了显示设计视图、蓝图视图或两者的选项。还有针对色盲的设置。第五种选项“强制刷新布局”（Force\
  \ Refresh Layout）会导致布局重新构建并重绘。当布局进入意外状态或未准确反映当前设计设置时，这非常有用。\n\n显示布局视图、设计视图还是两者取决于个人喜好。一种很好的方法是像图\
  \ 18-9 所示同时显示两者：\n\n![image-VL05N59F.jpg](img/image-VL05N59F.jpeg)\n\n图 18-9\n\n\
  ## 18.6 夜间模式\n\n要在设计期间以夜间模式查看布局，请选择下方图 18-10 所示的菜单并将设置为 Night：\n\n![image-9TCV1KEJ.jpg](img/image-9TCV1KEJ.jpeg)\n\
  \n图 18-10\n\n模式菜单还包括测试动态颜色的选项，该主题在“Material Design 3 主题和动态颜色教程”章节中有所介绍。\n\n\n\n\n\
  \n# 18.7 代码模式 (Code Mode)\n\n在使用 Android Studio 布局编辑器工具时，请记住它所做的只是提供了一种易于操作的方法来创建\
  \ XML 布局资源文件。在设计过程中，可以通过选择图 18-7 中标记为 A 的按钮来查看并直接编辑底层的 XML。\n\n图 18-11 显示了代码模式下的\
  \ Android Studio 布局编辑器，允许通过修改 XML 来更改用户界面声明：\n\n![image-PERE2GM0.jpg](img/image-PERE2GM0.jpeg)\n\
  \n图 18-11\n\n## 18.8 分屏模式 (Split Mode)\n\n在分屏模式下，编辑器并排显示设计（Design）和代码（Code）视图，允许用户使用设计画布视觉化地修改用户界面，并直接对\
  \ XML 声明进行更改。使用图 18-7 中标记为 B 的按钮选择分屏模式。\n\n对 XML 的任何更改都会反映在设计画布上，反之亦然。图 18-12 显示了分屏模式下的编辑器：\n\
  \n![image-OCID92TD.jpg](img/image-OCID92TD.jpeg)\n\n图 18-12\n\n## 18.9 设置属性 (Setting\
  \ Attributes)\n\n属性（Attributes）面板提供了当前选中组件的所有可用设置。例如，图 18-13 显示了 `TextView` 小部件的一些属性：\n\
  \n![image-JTN8JDE7.jpg](img/image-JTN8JDE7.jpeg)\n\n图 18-13\n\n属性工具窗口分为以下不同部分：\n\
  \n- `id`：包含 `id` 属性，定义了在应用源码中引用当前所选对象的名称。\n- `已声明属性 (Declared Attributes)`：包含所有已赋值值的属性。\n\
  - `布局 (Layout)`：定义当前所选视图对象相对于屏幕及布局其他对象的定位和大小的设置。\n- `变换 (Transforms)`：包含允许当前所选对象进行旋转、缩放和偏移的控件。\n\
  - `常用属性 (Common Attributes)`：当前选中视图对象类通常需要更改的属性列表。\n- `所有属性 (All Attributes)`：当前所选对象所有可用属性的完整列表。\n\
  \n也可以通过选择属性窗口工具栏中的搜索按钮并输入属性名称来搜索特定属性。\n\n某些属性在值字段右侧有一个窄按钮。这表示可以使用资源（Resources）对话框来帮助选择合适的属性值。点击该按钮可显示对话框。该按钮的外观会变化，以反映相应的属性值是存储在资源文件中还是硬编码的。如果值存储在资源文件中，`text`\
  \ 属性字段右侧的按钮将填充，表示该值不是硬编码的，如下方的图 18-14 所示：\n\n![image-LA1MYPVT.jpg](img/image-LA1MYPVT.jpeg)\n\
  \n图 18-14\n\n具有有限数量有效选项的属性将显示下拉菜单（图 18-15），可以从中进行选择。\n\n![image-16D49XT7.jpg](img/image-16D49XT7.jpeg)\n\
  \n图 18-15\n\n点击下拉图标可以显示颜色选择调板。同样，当旗帜图标出现时，点击它可以显示该属性可用的选项列表；而图像图标会打开资源管理器面板，允许为属性选择图像和其他资源类型。\n\
  \n## 18.10 变换 (Transforms)\n\n属性工具窗口内的变换面板（图 18-16）提供了一系列控件和属性，用于控制当前所选对象在视觉方面的方面，包括旋转、Alpha（alpha，用于视图淡入淡出）、缩放（大小）和平移（相对于当前位置的偏移）：\n\
  \n![image-89S5396X.jpg](img/image-89S5396X.jpeg)\n\n图 18-16\n\n面板包含视图的视觉表示，它会随着属性的更改而更新。这些更改也会反映在布局画布中的视图中。\n\
  \n## 18.11 工具可见性切换 (Tools Visibility Toggles)\n\n在代码模式下查看 Android Studio XML 布局文件的内容时，你会发现许多定义视图外观和行为的属性都以\
  \ `android:` 前缀开头。这表示属性是在 `android` 命名空间内设置的，并在应用运行时生效。例如，下面这段布局文件的摘录在 `Button`\
  \ 视图上设置了多种属性：\n\n```xml\nandroid:id=\"@+id/button\"\nandroid:layout_width=\"wrap_content\"\
  \nandroid:layout_height=\"wrap_content\"\nandroid:text=\"Button\"\n```\n\n除了 `android`\
  \ 命名空间外，Android Studio 还提供了 `tools` 命名空间。当属性在此命名空间内设置时，它们仅在布局编辑器的预览中生效。在设计布局时，你可能会发现希望\
  \ `EditText` 视图显示某些文本但在应用运行时需要视图为空。为了实现这一点，你将使用 `tools` 命名空间如下所示设置视图的 `text` 属性：\n\
  \n```xml\nandroid:id=\"@+id/editTextTextPersonName\"\nandroid:layout_width=\"wrap_content\"\
  \nandroid:layout_height=\"wrap_content\"\nandroid:ems=\"10\"\nandroid:inputType=\"\
  textPersonName\"\ntools:text=\"Sample Text\"\n```\n\n这种类型的工具属性通过扳手图标在属性窗口中设置，如图\
  \ 18-17 所示：\n\n![image-UYXMH7.jpg](img/image-UYXMH7.jpeg)\n\n图 18-17\n\n具有有限数量有效选项的属性将呈现下拉菜单（图\
  \ 18-15），可以从中进行选择。\n\n点击下拉图标可以显示颜色选择调板。同样，当旗帜图标出现时，点击它可以显示该属性可用的选项列表；而图像图标会打开资源管理器面板，允许为属性选择图像和其他资源类型。\n\
  \n工具属性在设计过程中更改视图的可见性非常有用。布局可能包含一个在应用运行时根据用户操作显示或隐藏的视图。为了实现隐藏视图，你可以在视图上添加如下工具属性：\n\
  \n```xml\ntools:visibility=\"invisible\"\n```\n\n虽然在使用 `invisible` 设置时视图不再可见，但它仍然存在于布局中并占据原来的空间。为了让布局表现得该视图不存在，应将可见性属性设置为\
  \ `gone`：\n\n```xml\ntools:visibility=\"gone\"\n```\n\n在上述示例中，可见性设置仅适用于布局编辑器，在运行的应用中不起影响。若要在布局编辑器和运行应用中控制可见性，将使用\
  \ `android` 命名空间设置相同的属性：\n\n```xml\nandroid:visibility=\"gone\"\n```\n\n\n\n\n此按钮用于切换当前工具的可见性设置。例如，如果上方显示的\
  \ `Button` 视图当前的工具可见性属性设置为 `gone`，则切换此按钮将使其变为可见。这使得在视图添加到布局和从布局中移除时，能够快速检查其布局行为。该切换按钮也有助于检查布局中的视图是否正确进行了约束，该主题在题为“Android\
  \ Studio 中使用 ConstraintLayout 指南”的章节中有介绍。\n\n## 18.12 转换视图\n\n在布局中将视图从一种类型更改另一种类型（例如将\
  \ `TextView` 转换为 `EditText`），可以在 Android Studio 布局编辑器中轻松实现。只需在屏幕布局或“组件树”窗口中右键点击该视图，然后选择\
  \ `Convert view...` 菜单选项（图 18-20）：\n\n![image-3SNTFXKT.jpg](img/image-3SNTFXKT.jpeg)\n\
  \n图 18-20\n\n选中后，将弹出一个对话框，其中列出了所选对象可以转换的兼容视图类型列表。例如，图 18-21 显示了现有 `TextView` 视图可以转换的类型：\n\
  \n![image-Z5ES9P35.jpg](img/image-Z5ES9P35.jpeg)\n\n图 18-21\n\n此技术也有助于将布局从一种类型转换为另一种类型（例如，将\
  \ `ConstraintLayout` 转换为 `LinearLayout`）。\n\n## 18.13 显示示例数据\n\n在 Android Studio\
  \ 中设计布局时，会出现这样一种情况：用户界面中要显示的内容在 App 完成并运行之前是不可用的。这有时可能导致我们很难从布局编辑器内部评估布局在 App 运行时的外观。为了解决这个问题，布局编辑器允许指定示例数据，这将用示例图像和数据填充布局编辑器中的视图。这些示例数据仅在布局编辑器中显示，在\
  \ App 运行时不会显示。可以直接编辑布局的 XML 或通过视觉化方式使用设计时助手（在设计区域右键点击小部件并选择 `Set Sample Data` 菜单选项）来配置示例数据。设计时助手面板将为所选的视图项显示一系列预配置的示例数据选项，包括各种配置下的文本和图像的组合。例如，图\
  \ 18-22 显示了在 `RecyclerView` 列表中选择显示示例数据时显示的示例数据选项：\n\n![image-6NEIGGP4.jpg](img/image-6NEIGGP4.jpeg)\n\
  \n图 18-22\n\n或者，可以在布局设计过程中提供自定义的文本和图像进行显示。在布局编辑器中使用示例数据的示例包含在后文题为“布局编辑器示例数据教程”的章节中。由于示例数据是作为\
  \ `tools` 属性实现的，预览中数据的可见性可以使用上方图 18-19 中高亮显示的切换按钮进行控制。\n\n## 18.14 创建自定义设备定义\n\n\
  布局编辑器工具栏中的设备菜单（图 18-23）提供了一个预配置的设备类型列表，选中后，它们将作为设备屏幕画布出现。除了预配置的设备类型外，之前在 Android\
  \ Studio 环境中配置的任何 `AVD` 实例也将列在菜单中。要添加额外的设备配置，显示设备菜单，选择 `Add Device Definition` 选项，并按照“在\
  \ Android Studio 中创建 Android 虚拟设备 (AVD)”章节中概述的步骤进行。\n\n![image-V7NTKRCY.jpg](img/image-V7NTKRCY.jpeg)\n\
  \n图 18-23\n\n## 18.15 当前设备\n\n作为设备选择菜单的替代方案，可以通过从设备菜单选择 `Custom` 选项，点击位于设备屏幕右下角的缩放句柄（图\
  \ 18-24），并拖动以选择备设备显示格式。随着屏幕大小的调整，将出现标记，指示可选择的各种尺寸选项和方向：\n\n![image-1XM94171.jpg](img/image-1XM94171.jpeg)\
  \ \n\n图 18-24\n\n## 18.16 布局验证\n\n布局验证选项允许在系列 Pixel 尺寸的屏幕上同时预览用户界面布局。要访问布局验证工具窗口，选择\
  \ `View -> Tool Windows -> Layout Validation` 菜单选项。加载后，面板将如图 18-25 所示显示，在多个设备屏幕配置上渲染布局：\n\
  \n![image-4CXYUV9J.jpg](img/image-4CXYUV9J.jpeg)\n\n图 18-25\n\n## 18.17 总结\n\n开发\
  \ Android 应用的关键部分涉及用户界面的创建。这是在 Android Studio 环境中使用布局编辑器工具完成的，该工具以三种模式运行。在设计（Design）模式下，从调色板选择视图组件，将其放置在代表\
  \ Android 设备屏幕的布局上，并使用属性列表进行配置。代表用户界面布局的底层 XML 可以在代码（Code）模式下直接编辑。另一方面，拆（Split）模式允许通过视觉化和直接编辑\
  \ XML 同时创建和修改布局。这些模式结合在一起提供了一个详尽且直观的用户界面设计环境。\n\n布局验证面板允许在各种设备屏幕尺寸上快速预览用户界面布局。\n\
  \n## 19. Android ConstraintLayout 指南\n\n正如在“理解 Android 视图、视图组布局”章节中所讨论的，Android\
  \ 提供了几种布局管理器来设计用户界面。从 Android 7 开始，Google 引入了一种解决了旧布局许多缺陷的布局。这种名为 `ConstraintLayout`\
  \ 的布局将简单、灵活且灵活的布局系统与 Android Studio 编辑器中的强大功能相结合，以便创建能够适应不同屏幕尺寸和方向变化的响应式用户界面布局。\n\
  \n本章将概述 `ConstraintLayout` 的基本概念，而下一章将详细概述如何在 Android 编辑器中使用 `ConstraintLayout`\
  \ 创建基于约束的布局。\n\n## 19.1 ConstraintLayout 如何工作\n\n与其他所有布局一样，`ConstraintLayout` 管理它包含的视觉组件（也称为小部件）的定位和尺寸行为。它是根据每个小部件设置的约束连接来实现的。\n\
  \n要充分并使用 `ConstraintLayout`，理解以下核心概念至关重要：\n\n• 约束（Constraints）\n• 外边距（Margins）\n\
  • 反约束（Opposing Constraints）\n• 约束偏移（Constraint Bias）\n• 链（Chains）\n• 链样式（Chain Styles）\n\
  • 引导线（Guidelines）\n• 组（Groups）\n• 障（Barriers）\n• 流（Flow）\n\n### 19.1.1 约束\n\n约束是定义小部件相对于其他部件、容器\
  \ `ConstraintLayout` 边缘以及特殊元素对齐和距离的规则集。约束还决定了 Activity 用户界面布局在设备方向变化或在不同屏幕尺寸设备上显示时如何响应。为了正确配置，小部件必须具有足够的约束连接，以便\
  \ `ConstraintLayout` 布局引擎能够在水平和垂直平面上解析其位置。\n\n### 19.1.2 外边距\n\n外边距是指定固定距离的约束形式。考虑一个需要放置在设备屏幕右上角的\
  \ `Button` 对象。这可以通过实现从 `Button` 的顶部右边缘连接到父 `ConstraintLayout` 对应侧边的外边距约束来实现，如图 19-1\
  \ 所示（注：此处原文未提供图 19-1 实际图片，但文中提及，此处保留描述翻译逻辑）。\n\n\n\n\n如上图所示，这些约束连接中的每一个都关联有一个边界值（margin\
  \ value），该值决定了控件距离父布局两侧的固定距离。在这种配置下，无论屏幕大小或设备方向如何，`Button` 对象将始终根据两个约束连接的指定，分别距离父级\
  \ `ConstraintLayout` 的顶部和右侧边缘 20 和 15 个设备无关像素（dp）。\n\n虽然上述的配置在某些情况下是可以接受的，但它并没有在允许\
  \ `ConstraintLayout` 布局引擎通过调整控件位置来响应设备旋转以及支持不同尺寸的屏幕方面提供任何灵活性。为了在此布局中添加这种响应性，有必要实现对立约束。\n\
  \n### 19.1.3 对立约束 (Opposing Constraints)\n\n在单个控件上沿同一轴运行的两个约束被视为对立约束。换句话说，左侧和右侧均有约束的控件被认为具有水平对立约束。例如，图\
  \ 19-2 展示了在之前的布局中同时添加了水平和垂直对立约束：\n\n![image-E4DSZT6M.jpg](img/image-E4DSZT6M.jpeg)\n\
  \n图 19-2\n\n这里理解的关键点是，一旦在特定轴上实现了对立约束，控件的定位将变为基于百分比而非基于坐标。例如，控件不再固定在距离布局顶部的 20dp\
  \ 处，而是位于距离顶部 30% 的位置。在不同的方向以及在较大或较小的屏幕上运行时，`Button` 将始终位于相对于父级布局尺寸的相同位置。\n\n现在需要理解的是，图\
  \ 19-2 中概述的布局不仅是使用对立约束实现的，还通过应用了约束偏置（constraint bias）来实现的。\n\n### 19.1.4 约束偏置 (Constraint\
  \ Bias)\n\n现在已经确定，`ConstraintLayout` 中的控件可能会受到对立约束连接的影响。默认情况下，对立约束是相等的，导致相应的控件在对立轴上居中。例如，图\
  \ 19-3 显示了一个控件在对立水平和垂直约束的情况下，在包含它的 `ConstraintLayout` 中居中：\n\n![image-CKNTP2D9.jpg](img/image-CKNTP2D9.jpeg)\n\
  \n图 19-3\n\n为了允许在对立约束的情况下调整控件位置，`ConstraintLayout` 实现了一种名为“约束偏置”的功能。约束偏置允许控件沿对立轴的定位根据指定的百分比向某一个约束倾斜。例如，图\
  \ 19-4 显示了具有 75% 水平偏置和 10% 垂直偏置的之前的约束布局：\n\n![image-O0OYTQ47.jpg](img/image-O0OYTQ47.jpeg)\n\
  \n图 19-4\n\n下一章标题为“在 Android Studio 中使用 ConstraintLayout 的指南”，它将更详细地阐述这些概念，并解释这些功能是如何集成到\
  \ Android Studio 布局编辑器工具中的。然而，在此期间，还需要涵盖 `ConstraintLayout` 类的另外几个领域。\n\n### 19.1.5\
  \ 链 (Chains)\n\n`ConstraintLayout` 链（chains）提供了一种将两个或多个控件的布局行为定义为一组的方法。链可以在垂直或水平轴上声明，并进行配置以定义链中控件的间距和尺寸。\n\
  \n当控件通过双向约束连接起来时，它们就构成了链。例如，图 19-5 展示了三个以此方式连接的控件：\n\n![image-UUXZJ6RS.jpg](img/image-UUXZJ6RS.jpeg)\n\
  \n图 19-5\n\n链中的第一个元素是链头（chain head），它在垂直链中翻译为顶部的控件，在水平链的情况下翻译为最左侧的控件。整个链的布局行为主要通过在链头上设置属性来配置。\n\
  \n### 19.1.6 链样式 (Chain Styles)\n\n`ConstraintLayout` 链的布局行为是通过应用到链头的样式决定的。`ConstraintLayout`\
  \ 支持以下链样式：\n\n- **散布 (Spread)** —— 链中的控件在可用空间内均匀分布。这是链的默认行为。\n\n![image-TWWY2L.jpg](img/image-TWWY2L.jpeg)\n\
  \n图 19-6\n\n- **内部散布 (Spread Inside)** —— 链中的控件在链头最后一个控件之间均匀分布。\n\n![image-N9RP75C.jpg](img/image-N9RP75C.jpeg)\n\
  \n图 19-7\n\n- **权重链 (Weighted Chain)** —— 通过权重属性允许链中每个控件占据的空间。\n\n![image-Y46HA73.jpg](img/image-Y46HA73.jpeg)\n\
  \n图 19-8\n\n- **打包 (Packed)** —— 构成链的控件聚集在一起。可以通过应用偏置来控制链相对于父容器的位置。\n\n![image-PAD1FAX.jpg](img/image-PAD1FAX.jpeg)\n\
  \n图 19-9\n\n### 19.2 基线对齐 (Baseline Alignment)\n\n到目前为止，本章仅提到相对于控件侧边的约束（通常称为侧边约束）。然而，一种常见的需求是控件相对于其显示的内容进行对齐的。为了满足这一需求，`ConstraintLayout`\
  \ 提供了基线对齐支持。\n\n例如，假设 19-1 中的布局需要 `TextView` 控件位于 `Button` 左侧 40dp 处。在这种情况下，`TextView`\
  \ 需要与 `Button` 基线对齐。这意味着 `Button` 内的文本需要与 `TextView` 内的文本在垂直方向对齐。该布局的额外约束需要如图 19-0\
  \ 所示连接：\n\n![image-PGEWHSDF.jpg](img/image-PGEWHSDF.jpeg)\n\n图 19-10\n\n`TextView`\
  \ 现在沿 `Button` 的基线垂直对齐，并在水平方向上距离 `Button` 边缘 40dp。\n\n### 19.3 配置控件尺寸 (Configuring\
  \ Widget Dimensions)\n\n控制控件的尺寸是界面设计过程的一个关键要素。`ConstraintLayout` 提供了可以设置在控件上的选项来管理尺寸行为。这些设置针对高度和宽度单独配置：\n\
  \n- **固定 (Fixed)** —— 控件固定为指定的尺寸。\n- **匹配约束 (Match Constraint)** —— 允许布局引擎调整大小以满足现行的约束。也称为\
  \ `AnySize` 或 `MATCH_CONSTRAINT` 。\n- **自适应内容 (Wrap Content)** —— 控件的大小由其内容决定（即文本或图形）。\n\
  \n## 19.4 辅助线 (Guideline Helper)\n\n辅助线是 `ConstraintLayout` 中提供的特殊元素，为可以连接的约束提供了额外的目标。可以向\
  \ `ConstraintLayout` 实例中添加多个辅助线，这些辅助线反过来可以配置为水平或垂直方向。一旦添加，就可以建立布局中控件到辅助线的约束连接。这在多个控件必须沿某一轴对齐时特别有用。例如，图\
  \ 19-11 所示，包含 `ConstraintLayout` 中的三个 `Button` 对象沿一条垂直辅助线约束：\n\n![image-TQVP4ZOC.jpg](img/image-TQVP4ZOC.jpeg)\n\
  \n图 19-11\n\n## 19.5 组辅助线 (Group Helper)\n\n\n\n\n\n`ConstraintLayout` 的此功能允许将组件置于逻辑组中，并将这些组件的可见性作为一个单一实体进行控制。`Group`\
  \ 是布局中其他组件的引用列表。一旦定义，更改 `group` 实例的可见性属性（`visible`、`invisible` 或 `gone`）将此更改应用到所有组内成员。这使得通过更改单个属性就能轻松地隐藏和显示多个组件。一个布局中可以包含多个\
  \ `groups`，且一个组件可以属于多个 `group`。如果组之间发生冲突，则在 XML 文件中最后声明的组具有优先级。\n\n## 19.6 屏障助手\
  \ (Barrier Helper)\n\n与辅助线（guidelines）类似，`barriers` 是用于约束布局内视图的虚拟视图。与辅助线一样，`barrier`\
  \ 可以是垂直或水平的，并且一个或多个视图可以被约束在其上（为了避免混淆，这些视图被称为受约束视图）。但与辅助线在布局中保持固定位置不同，`barrier` 的位置是由一组所谓的参考视图（reference\
  \ views）定义的。引入 `Barriers` 是为了解决经常发生的视图重叠问题。例如，考虑下方图 19-12 所示的布局：\n\n ![image-29LAT7YO.jpg](img/image-29LAT7YO.jpeg)\n\
  \n图 19-12\n\n上述布局需要注意的关键点是：`View 3` 的宽度设置为匹配 `constraint mode`，且该视图的左边缘连接到 `View\
  \ 1` 的右边缘。按照目前的实现方式，增加 `View 1` 的宽度将产生预期效果，即缩小 `View 3` 的宽度：\n\n ![image-161EOC84.jpg](img/image-161EOC84.jpeg)\n\
  \n图 19-13\n\n然而，如果增加的是 `View 2` 的宽度而不是 `View 1`，就会出现问题：\n\n ![image-KYC2DWCI.jpg](img/image-KYC2DWCI.jpeg)\n\
  \n图 19-14\n\n由于 `View 3` 只受到 `View 1` 的约束，它不会调整大小以适应 `View 2` 宽度的增加，导致视图重叠。\n\n\
  解决此问题的办法是添加一个垂直 `barrier`，并将 `Views 1` 和 `View 2` 分配为屏障的参考视图，以便它们控制屏障的位置。这样 `View\
  \ 3` 的左边缘将相对于 `barrier` 进行约束，使其成为受约束视图。\n\n现在，当 `View 1` 或 `View 2` 的任一宽度增加时，`barrier`\
  \ 将移动以适应其中较宽的视图，从而导致 `View 3` 的宽度相对于新的屏障位置发生变化：\n\n ![image-OCB192Z5.jpg](img/image-OCB192Z5.jpeg)\n\
  \n图 19-15\n\n在使用 `barriers` 时，单个 `barrier` 关联的参考视图和受约束视图的数量没有限制。\n\n## 19.7 流助手\
  \ (Flow Helper)\n\n`ConstraintLayout Flow` 助手允许视图组以流式网格样式布局显示。与 `Group` 助手一样，`Flow`\
  \ 包含了对其负责定位的视图的引用，并提供了各种配置选项，包括垂直和水平方向、换行行为（包括换行前的最大组件数量）、间距和对齐属性。链行为（Chain behavior）也可以应用于\
  \ `Flow` 布局，包括 `spread`、`spread inside` 和 `packed` 选项。\n\n图 19-16 代表了使用 `Flow` 助手实例在水平模式且无换行设置下定位的五个等大小按钮的布局：\n\
  \n ![image-EYOMVF0G.jpg](img/image-EYOMVF0G.jpeg)\n\n图 19-16\n\n图 19-17 显示了相同的按钮在水平流配置下的情况，并将换行设置为每第三个组件后进行换行：\n\
  \n ![image-U5O1X731.jpg](img/image-U5O1X731.jpeg)\n\n图 19-17\n\n相比之下，图 19-18 显示了按钮将换行模式设置为使用\
  \ `spread inside` 链模式的按钮（其效果仅在第二行可见，因为第一行是满的）。该配置还设置了 `gap` 属性以在按钮之间添加间距：\n\n ![image-L4G0JZUF.jpg](img/image-L4G0JZUF.jpeg)\n\
  \n图 19-18\n\n作为 `Flow` 助手灵活性的最终演示，图 19-19 显示了五个大小各异的按钮，配置为水平压缩链模式，并在每第三个组件后换行。此外，通过设置\
  \ `horizontal-bias` 值为 `1.0`，网格内容已右对齐（值为 `0.0` 将导致左对齐，而 `0.5` 将使网格内容居中对齐）：\n\n ![image-D1I3I1OU.jpg](img/image-D1I3I1OU.jpeg)\n\
  \n图 19-19\n\n## 19.8 比例 (Ratios)\n\n组件的可以使用比例设置来定义。例如，可以使用比例设置约束一个组件，使得无论如何调整，宽度始终是高度的两倍。\n\
  \n## 19.9 ConstraintLayout 的优势\n\n`ConstraintLayout` 提供了灵活性，允许使用单个布局实现旧布局的功能。通过允许设计所谓的“扁平”或“浅层”布局层次，避免了嵌套布局的问题，从而提高了运行时的性能。ConstraintLayout\
  \ 的实现也是为了适应各种 Android 设备尺寸。`ConstraintLayout` 的灵活性使得更容易设计响应运行设备的用户界面。Android Studio\
  \ 布局工具已针对 `ConstraintLayout` 设计进行了增强。\n\n## 19.10 ConstraintLayout 的可用性\n\n尽管 `ConstraintLayout`\
  \ 是在 Android 7 中引入的，但它是作为支持库提供的，并支持到 API 9。这使得使用该布局的应用程序可以在旧的 Android 版本上运行。\n\n\
  ## 19.11 总结\n\n`ConstraintLayout` 是 Android 7 引入的布局管理器。它旨在创建适应各种 Android 设备的灵活布局。`ConstraintLayout`\
  \ 使用约束来控制相对于 `ConstraintLayout` 实例、辅助线、屏障以及布局中其他组件的对齐和定位。`ConstraintLayout` 是新创建的\
  \ Android Studio 项目的默认布局，并在设计用户界面布局时推荐使用。这种简单而灵活的布局管理方法使得实现复杂的响应式用户界面变得简单。\n\n##\
  \ 20. Android Studio 中使用 ConstraintLayout 的指南\n\n正如前面的章节多次提到的，Google 对 Android Studio\
  \ 布局工具进行了重大更改，其中许多更改完全是为了支持使用 `ConstraintLayout` 进行用户界面设计。现在我们在上一章中概述了 `ConstraintLayout`\
  \ 的基本概念，本章将更深入地探讨这些概念，同时概述布局工具如何允许设计和实现基于 `ConstraintLayout` 的用户界面。\n\n## 20.1 设计和布局视图\n\
  \n“Android Studio 布局工具指南”的章节解释了 Android Studio 布局工具提供了两种方式来查看活动的用户界面布局，即设计（Design）和布局（Layout，也称为蓝图）视图。这些布局视图可以单独显示，也可以如图\
  \ 20-1 所示并排显示：\n\n ![image-YX0IXOPM.jpg](img/image-YX0IXOPM.jpeg) \n\n图 20-1\n\n\
  \n\n\n\n设计视图（Design view，位于上图左侧）呈现了布局的“所见即所得”表示，其中布局的外观与其在运行的应用程序中的显示完全一致。相反，`Layout`\
  \ 视图显示了一种蓝图风格视图，其中阴影轮廓表示组件。如上图 20-1 所示，`Layout` 视图还显示了约束连接（在本例中，用于将按钮在布局中居中的对等约束）。当选择布局中的特定组件或鼠标指针悬停在设计区域上时，这些约束也会叠加到\
  \ `Design` 视图上，如图 20-2 所示：\n\n![image-A8CNDWC7.jpg](img/image-A8CNDWC7.jpeg)\n\n\
  图 20-2\n\n两种视图中约束连接的显示方式可以通过图 20-3 所示的 `View Options`（视图选项）菜单更改：\n\n![image-MA9Y03AO.jpg](img/image-MA9Y03AO.jpeg)\n\
  \n图 20-3\n\n除了显示用户界面布局的两种模式外，`Layout Editor`（布局编辑器）工具提供了三种为特定布局设计建立约束的方法。\n\n##\
  \ 20.2 自动连接模式（Autoconnect Mode）\n\n自动连接（Autoconnect）顾名义会在项添加到布局时自动建立约束连接。`Autoconnect`\
  \ 模式可以使用图 20-4 所示的工具栏按钮来开启或关闭：\n\n![image-7HUGDP1Y.jpg](img/image-7HUGDP1Y.jpeg)\n\
  \n图 20-4\n\n`Autoconnect` 模式使用算法根据组件的位置以及组件与父布局侧边和其他元素的接近程度来决定建立的最佳约束。如果任何自动约束连接未能提供预期的行为，可以像本章稍后概述那样进行手动修改。\n\
  \n## 20.3 推断模式（Inference Mode）\n\n推断模式使用一种涉及算法和概率的启发式方法，在组件已添加到布局后自动实现约束连接。这种模式通常在关闭\
  \ `Autoconnect` 功能且在没有任何约束连接的情况下对象添加到布局时使用。这允许通过从调色板将对象拖放到布局画布上来设计布局，并更改尺寸和位置，直到布局符合要求。本质上，这涉及在不担心约束的情况下“绘制”布局。推断模式也可以在设计过程中用于填充布局中缺失的约束。\n\
  \n点击 `Infer constraints`（推断约束）按钮（图 20-5）时，约束会自动添加到布局中：\n\n![image-5HDFX36S.jpg](img/image-5HDFX36S.jpeg)\n\
  \n图 20-5\n\n与 `oconnect` 模式一样，`Layout Editor` 工具始终存在推断错误约束的可能性，尽管这些可以手动修改和更正。\n\n\
  ## 20.4 手动操作约束\n\n实现约束连接的第三种方法是手动。在这样做时，理解 `Layout Editor` 工具中组件周围出现的各种句柄将很有帮助。例如，考虑图\
  \ 20-6 所示的组件：\n\n![image-DH765OH5.jpg](img/image-DH765OH5.jpeg)\n\n图 20-6\n\n像弹簧一样的线条\
  \ (A) 代表了从组件侧边到目标已建立的约束连接。对象每个角上的小正方形标记 (B) 是缩放句柄，点击并拖动时用于缩放组件尺寸。位于组件每侧的小圆圈句柄 (C)\
  \ 是侧约束锚点。要创建约束连接，点击句柄并将生成的线条拖到要连接约束的元素（例如引导线或父布局的侧边或其他组件的侧边），如图 20-7 所示。当连接到另一个组件的侧边时，将线条拖到该组件的侧约束句柄，并在组件和句柄被高亮时释放线条：\n\
  \n![image-63R860Z6.jpg](img/image-63R860Z6.jpeg)\n\n图 20-7\n\n如果将约束线拖动到组件并释放但未附加到约束句柄，布局编辑器将显示一个菜单，其中列出了约束可以附加的侧边列表。例如图\
  \ 20-8，约束可以附加到目标按钮组件的顶部或底部边缘：\n\n![image-DDM5UJ26.jpg](img/image-DDM5UJ26.jpeg)\n\
  \n图 20-8\n\n额外的标记指示了基线约束（baseline constraints）的锚点，其中组件内部的内容（而非外部边缘）用作对齐点。要显示此标记，右键点击组件并选择\
  \ `Show Baseline`（显示基线）菜单选项。要从基线句句建立约束连接，将鼠标指针悬停在句柄上直到其高亮，然后点击并拖到目标（例如另一个组件的基线锚点，如图\
  \ 20-9 所示）。\n\n![image-K2AFJFLP.jpg](img/image-K2AFJFLP.jpeg)\n\n图 20-9\n\n要隐藏基线锚点，再次右键点击组件并选择\
  \ `Hide Baseline`（隐藏基线）菜单选项。\n\n## 20.5 在 Inspector 中添加约束\n\n也可以使用 `Android Studio\
  \ Layout Editor` 工具中 `Attributes`（属性）工具窗口的 `Inspector`（检查器）面板向视图添加约束，如图 20-10 所示。\n\
  \n![image-RBBCZC.jpg](img/image-RBBCZC.jpeg)\n\n图 20-10\n\n中间的正方形表示选中的视图，周围的区域表示应用于相应侧边的约束。视图侧边没有约束的情况由虚线表示（如图中视图的底部所示）。要添加约束，点击此蓝圈，布局编辑器将向它认为合适的目标添加约束。\n\
  \n## 20.6 在 Attributes 窗口查看约束\n\n通过显示 `Attributes` 工具窗口的 `Constraints` 部分可以查看当前选中组件配置的约束列表，如图\
  \ 20-11 所示：\n\n![image-REF4O74M.jpg](img/image-REF4O74M.jpeg)\n\n图 20-11\n\n点击列表中的约束将在布局选中该约束。\n\
  \n## 20.7 删除约束\n\n要删除单个约束，在布局或 `Attributes` 工具窗口中选择约束使其高亮（例如图 20-12 中选择了最右侧的约束），然后按键盘删除键。该约束将从布局中移除。\n\
  \n![image-YCS86QJF.jpg](img/image-YCS86QJF.jpeg)\n\n图 20-12\n\n另一种方法是在按住 `Ctrl`\
  \ 键（macOS 上为 Command）的同时将鼠标指针悬停在约束锚点在其变为红色后点击。\n\n或者，通过右键点击组件并选择 `Clear Constraints\
  \ of Selection`（清除选择约束）菜单选项来移除组件上的所有约束。\n\n要从布局中的每个组件中移除所有约束，使用图 20-14 所示的高亮工具栏按钮：\n\
  \n![image-UZCMOGFV.jpg](img/image-UZCMOGFV.jpeg)\n\n图 20-14\n\n\n\n\n\n边距（margins）可以配合约束（constraints）使用，用于组件与其他元素（如另一个组件、引导线或父布局的边缘）之间的固定间隙。例如，考虑图\
  \ 20-16 中应用于 `Button` 对象的水平约束：\n\n![image-5312484H.jpg](img/image-5312484H.jpeg)\n\
  \n图 20-16\n\n按照目前的配置，水平约束延伸到父级 `ConstraintLayout` 的左右边缘。因此，该组件具有相互对的水平约束，这表明 `ConstraintLayout`\
  \ 布局引擎在运行时对组件的实际位置具有一定的裁量权。这使得布局具有灵活性，以适应不同的屏幕尺寸和设备方向。水平偏移（horizontal bias）设置也可以控制组件的位置，一直到布局的右侧。例如，图\
  \ 20-17 显示了应用了 100% 水平偏移的相同按钮：\n\n![image-2IOWY1NE.jpg](img/image-2IOWY1NE.jpeg)\n\
  \n图 20-17\n\n`ConstraintLayout` 边距可以出现在约束连接的末端，代表一个固定间隙，即使在调整偏移或响应 Activity 中其他地方的布局变化时，组件也无法移动此处。在图\
  \ 20-18 中，右侧约束现在包含一个 50dp 的边距，即使偏移仍设为 100%，组件也无法移动该间隙。\n\n![image-AY4EYK6P.jpg](img/image-AY4EYK6P.jpeg)\n\
  \n图 20-18\n\n组件上现有的边距值可以在检查器（Inspector）中进行修改。如图 20-19 所示，正在使用下拉菜单将当前选中组件的右侧边距更改为\
  \ 16dp。或者，点击当前值也可以在字段中输入数字。\n\n![image-IJKHKESS.jpg](img/image-IJKHKESS.jpeg)\n\n\
  图 20-19\n\n新约束的默认边距可以随时使用图 20-20 中高亮工具栏中的选项进行更改：\n\n![image-WVHZZJDJ.jpg](img/image-WVHZZJDJ.jpeg)\n\
  \n图 20-20\n\n## 20.10 对立约束和偏移的重要性\n\n正如上一章讨论过的，在使用 `ConstraintLayout` 时，对立约束、边距和偏移是\
  \ Android 响应式布局设计的基石。当组件在没有对立约束连接的情况下被约束时，这些约束本质上是边距约束。这在布局编辑器工具中通过带有边距测量值的实线直线在视觉上被表示出来，如图\
  \ 20-21 所示。\n\n![image-L0XZHD4T.jpg](img/image-L0XZHD4T.jpeg)\n\n图 20-21\n\n上述约束将组件固定在该位置。结果是，如果设备旋转到横屏模式，组件将不再可见，因为垂直约束会将其推到设备屏幕顶端之外（如图\
  \ 20-22 所示）。如果应用程序在比设计过程中屏幕更小的设备上运行，也会出现类似的问题。\n\n![image-F27J220I.jpg](img/image-F27J220I.jpeg)\n\
  \n图 20-22\n\n当实现对立约束时，约束连接由锯齿状弹簧线表示（弹簧比喻旨在表示组件的位置没有固定在绝对 X 和 Y 坐标上）：\n\n![image-E6H1JBOP.jpg](img/image-E6H1JBOP.jpeg)\n\
  \n图 20-23\n\n在上述布局中，垂直和水平偏移设置已配置为组件将始终位于距离父布局底部 90% 处和距离左侧边缘 35% 处。因此，当旋转时，组件仍然可见，并且相对于屏幕尺寸保持在相同的位置：\n\
  \n![image-M51H9JNA.jpg](img/image-M51H9JNA.jpeg)\n\n图 20-24\n\n在设计响应式且自适应的用户界面布局时，手动设计用户界面布局和修正自动创建的约束时，考虑偏移和对立约束是非常重要的。\n\
  \n## 20.11 配置组件尺寸\n\n`ConstraintLayout` 中组件的内部尺寸也可以使用检查器进行配置。正如上一章概述的，组件尺寸可以设置为环绕内容（wrap\
  \ content）、固定（fixed）或匹配约束（match constraint）模式。当前选中组件上每个尺寸的常用设置显示在检查器中代表组件的正方形内，如图\
  \ 20-25 所示：\n\n![image-TL1OK9WY.jpg](img/image-TL1OK9WY.jpeg)\n\n图 20-25\n\n上述图形将水平和垂直尺寸设置为环绕内容模式（由向内的\
  \ V 形符号表示）。检查器使用以下视觉指示器来表示三种尺寸模式：\n\n| ^(固定大小) |  |\n| ^(匹配约束) |  |\n| ^(环绕内容) |\
  \  |\n\n表 20-1\n\n要更改当前设置，点击指示器可以在三个设置之间循环切换。\n\n此外，可以使用“水平扩展”（Expand Horizontally）和“垂直扩展”（Expand\
  \ Vertically）选项将组件的大小水平或垂直方向扩展到布局中约束和其他组件允许的最大值。可以通过右键点击布局中的组件并从生成的菜单中选择“组织”（Organize）选项来访问。使用时，当前选中的组件将在水平或垂直方向上增加尺寸以填充可用空间。\n\
  \n![image-QJP1B5.jpg](img/image-QJP1B5.jpeg)\n\n图 20-26\n\n## 20.12 设计时工具定位\n\n\
  名为“Android Studio 布局工具指南”的章节引入了 tools 命名命名空间的概念，并解释了如何使用它来设置仅在布局编辑器中生效的属性。在后台，Android\
  \ Studio 还使用 `tools` 属性在没有约束的情况下放置在布局上时将组件固定在位置。例如，想象在禁用自动连接模式时将 `Button` 放置到布局中。虽然组件在预览中看起来处于正确位置，但当应用程序运行时，它将出现在左上角。这是因为组件没有约束来告诉\
  \ `ConstraintLayout` 父容器应该将其放在何处。\n\n组件在布局编辑器中看起来位于正确位置，是因为 Android Studio 设置了绝对\
  \ X 和 Y 定位工具，以便在添加约束之前将其保持在正确位置。在 XML 布局文件中，其内容可能如下：\n\n```xml\n<Button\n    android:id=\"\
  @+id/button4\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:text=\"Button\"\n    tools:layout_editor_absoluteX=\"\
  111dp\"\n    tools:layout_editor_absoluteY=\"88dp\" />\n```\n\n一旦为组件添加足够的约束，布局编辑器将移除这些\
  \ `tools` 属性。一种无需运行应用程序即可快速识别哪些组件缺少约束的实用技巧是点击图 20-27 中高亮的按钮以切换工具位置可见性。任何跳转到左上角的组件都是未完全约束的，是由时的\
  \ `tools` 绝对 X 和 Y 属性保持的。\n\n![image-OZKIFM6E.jpg](img/image-OZKIFM6E.jpeg)\n\n\
  图 20-27\n\n## 20.13 添加引导线\n\n引导线提供了额外的锚元素。可以通过右键点击布局并选择“垂直引导线”（Vertical Guideline）或“水平引导线”（Horizontal\
  \ Guideline）菜单选项，或使用工具栏选项来添加引导线，如图 20-28 所示：\n\n![image-8Z653NZ7.jpg](img/image-8Z653NZ7.jpeg)\n\
  \n图 20-28\n\n或者，可以从调色板（Palette）中的 Helper 部分拖动水平和垂直引导线，并将其丢到布局画布或组件树面板上，如图 20-29\
  \ 中的箭头所示：\n\n![image-6DES33CJ.jpg](img/image-6DES33CJ.jpeg)\n\n图 20-29\n\n\n\n\n\
  \n一旦添加，指南线将以虚线的形式显示在布局中，并可以通过点击和拖动-`the line` 来移动。若要与指南线建立约束连接，请点击小部件的约束句柄，并在释放之前将其拖动到指南线上。在图\
  \ 20-30 中，两个 `Buttons` 的左侧通过约束连接到一条垂直指南线。\n\n垂直指南线的位置可以指定为距离父布局左侧或右侧的绝对距离（对于水平指南线，则为顶部或底部）。例如，下图中的垂直指南线位于距离父布局左边缘\
  \ 97dp 处：\n\n ![image-WGSURLFQ.jpg](img/image-WGSURLFQ.jpeg)\n\nFigure 20-30\n\n\
  或者，指南线也可以根据父布局的整体宽度或高度的百分比进行定位。要在这这三种模式之间切换，请选择指南线，并点击指南线底部或末端的圆圈（取决于指南线是垂直的还是水平的）。例如，图\
  \ 20-31 显示了基于百分比定位的指南线：\n\n ![image-NO9AYJ8L.jpg](img/image-NO9AYJ8L.jpeg)\n\nFigure\
  \ 20-31\n\n## 20.14 添加屏障 (Barriers)\n\n可以通过右键点击布局并从 `Add helpers` 菜单中选择 `Vertical`\
  \ 或 `Horizontal Barrier` 选项，或使用工具栏菜单选项来添加屏障，如图 20-28 所示。或者，在 `Palette` 的 `Helpers`\
  \ 部分找到 `Barrier` 类型，并将其拖放到布局画布或 `Component Tree` 面板中。\n\n一旦向布局中添加了屏障，它将作为 `Component\
  \ Tree` 面板中的一个项出现：\n\n ![image-OQQN1K90.jpg](img/image-OQQN1K90.jpeg)\n\nFigure\
  \ 20-32\n\n若要将视图作为引用视图（换句话说，即控制屏障位置的视图），请将部件从 `Component Tree` 内部拖到屏障项上。例如，在图 20-33\
  \ 中，命名为 `textView2` 和 `textView3` 的部件被分配为屏障的引用小部件：\n\n ![image-W56366BO.jpg](img/image-W56366BO.jpeg)\n\
  \nFigure 20-33\n\n添加引用视图后，需要配置屏障以指定屏障相对于这些视图的方向。这是屏障方向设置，当 `Component Tree` 面板中选择屏障时，在\
  \ `Attributes` 工具窗口中定义：\n\n ![image-HLDEY97F.jpg](img/image-HLDEY97F.jpeg)\n\nFigure\
  \ 20-34\n\n接下来的图显示了一个包含屏障的布局，该屏障声明 `textView1` 和 `textView2` 作为引用视图，并将 `textview3`\
  \ 作为受约束视图。由于屏障从引用视图的末端向受约束视图推送，屏障方向被设置为 `end`：\n\n ![image-I8T3E9OJ.jpg](img/image-I8T3E9OJ.jpeg)\n\
  \nFigure 20-35\n\n## 20.15 添加分组 (Group)\n\n若要向布局中添加 `Group`，请右键点击布局并从 `Add helpers`\
  \ 菜单中选择 `Group` 选项，或使用图 20-28 所示的工具栏菜单选项。或者，在 `Palette` 的 `Helpers` 部分找到 `Group`\
  \ 项，并将其拖放到布局画布或 `Component Tree` 面板中。\n\n若要向组添加部件，请在 `Component Tree` 中选择它们并拖放到\
  \ `Group` 项。例如，图 20-36 显示将三个选中的部件添加到一个组中：\n\n ![image-5EU0PIYJ.jpg](img/image-5EU0PIYJ.jpeg)\n\
  \nFigure 20-36\n\n任何被组引用的部件都将以斜体显示在 `Component Tree` 中组项下方，如图 20-37 所示。若要从组中移除部件，请选择它并按下键盘上的删除键：\n\
  \n ![image-0FV6VUO4.jpg](img/image-0FV6VUO4.jpeg)\n\nFigure 20-37\n\n一旦部件被分配给组，使用\
  \ `Attributes` 工具窗口的 `Constraints` 部分来修改可见性设置：\n\n ![image-G42RNTTI.jpg](img/image-G42RNTTI.jpeg)\n\
  \nFigure 20-38\n\n## 20.16 使用流布局助手 (Flow Helper)\n\n正如前文概述其他助手所示，可以使用菜单或 `Palette`\
  \ 添加流布局助手。与 `Group` 助手（图 20-36）一样，通过在 `Component Tree` 中将部件拖动到 `Flow` 项可以将其添加到 `Flow`\
  \ 实例中。添加 `Flow` 助手并为其分配部件后，在 `Component Tree` 中选择它并使用 `Attribute` 工具窗口的 `Common\
  \ Attributes` 部分来配置流布局行为：\n\n ![image-ISKAXP6O.jpg](img/image-ISKAXP6O.jpeg)\n\n\
  Figure 20-39\n\n## 20.17 部件组的对齐与分布\n\n当布局中选择两个或多个部件时，Android Studio 布局编辑器工具提供了一系列对齐和分布操作。按住\
  \ Shift 点击每个部件以将其包含在操作内。\n\n\n\n\n要表示这种布局，XML 资源布局文件可能包含以下按钮控件的条目：\n\n```xml\nandroid:id=\"\
  @+id/button1\"\nandroid:layout_width=\"wrap_content\"\nandroid:layout_height=\"\
  wrap_content\"\nandroid:layout_marginStart=\"8dp\"\nandroid:layout_marginTop=\"\
  16dp\"\nandroid:text=\"Button\"\napp:layout_constraintHorizontal_bias=\"0.5\"\n\
  app:layout_constraintStart_toStartOf=\"parent\"\napp:layout_constraintTop_toTopOf=\"\
  parent\" />\n\nandroid:id=\"@+id/button2\"\nandroid:layout_width=\"wrap_content\"\
  \nandroid:layout_height=\"wrap_content\"\nandroid:layout_marginEnd=\"8dp\"\nandroid:layout_marginStart=\"\
  8dp\"\nandroid:layout_marginTop=\"16dp\"\nandroid:text=\"Button\"\napp:layout_constraintHorizontal_bias=\"\
  0.5\"\napp:layout_constraintEnd_toStartOf=\"@+id/button3\"\napp:layout_constraintStart_toEndOf=\"\
  @+id/button1\"\napp:layout_constraintTop_toTopOf=\"parent\" />\n\nandroid:id=\"\
  @+id/button3\"\nandroid:layout_width=\"wrap_content\"\nandroid:layout_height=\"\
  wrap_content\"\nandroid:layout_marginEnd=\"8dp\"\nandroid:layout_marginTop=\"16dp\"\
  \nandroid:text=\"Button\"\napp:layout_constraintHorizontal_bias=\"0.5\"\napp:layout_constraintEnd_toEndOf=\"\
  parent\"\napp:layout_constraintTop_toTopOf=\"parent\" />\n```\n\n按照目前的配置，没有双向约束来将这些控件分组成一个链（chain）。为了解决这个问题，需要从\
  \ `button1` 的右侧到 `button2` 的左侧，以及从 `button3` 的左侧到 `button2` 的右侧添加额外的约束，如下：\n\n```xml\n\
  android:id=\"@+id/button1\"\nandroid:layout_width=\"wrap_content\"\nandroid:layout_height=\"\
  wrap_content\"\nandroid:layout_marginStart=\"8dp\"\nandroid:layout_marginTop=\"\
  16dp\"\nandroid:text=\"Button\"\napp:layout_constraintHorizontal_bias=\"0.5\"\n\
  app:layout_constraintStart_toStartOf=\"parent\"\napp:layout_constraintTop_toTopOf=\"\
  parent\"\napp:layout_constraintEnd_toStartOf=\"@+id/button2\" />\n\nandroid:id=\"\
  @+id/button2\"\nandroid:layout_width=\"wrap_content\"\nandroid:layout_height=\"\
  wrap_content\"\nandroid:layout_marginEnd=\"8dp\"\nandroid:layout_marginStart=\"\
  8dp\"\nandroid:layout_marginTop=\"16dp\"\nandroid:text=\"Button\"\napp:layout_constraintHorizontal_bias=\"\
  0.5\"\napp:layout_constraintEnd_toStartOf=\"@+id/button3\"\napp:layout_constraintStart_toEndOf=\"\
  @+id/button1\"\napp:layout_constraintTop_toTopOf=\"parent\" />\n\nandroid:id=\"\
  @+id/button3\"\nandroid:layout_width=\"wrap_content\"\nandroid:layout_height=\"\
  wrap_content\"\nandroid:layout_marginEnd=\"8dp\"\nandroid:layout_marginTop=\"16dp\"\
  \nandroid:text=\"Button\"\napp:layout_constraintHorizontal_bias=\"0.5\"\napp:layout_constraintEnd_toEndOf=\"\
  parent\"\napp:layout_constraintTop_toTopOf=\"parent\"\napp:layout_constraintStart_toEndOf=\"\
  @+id/button2\" />\n```\n\n通过这些更改，控件现在配置了双向水平约束。这构成了在布局编辑器中通过链连接视觉表示的 `ConstraintLayout`\
  \ 链，下图 21-2 所示。注意，在此配置下，链默认设置为散开链（spread chain）样式。\n\n![image-PZ09J7IA.jpg](img/image-PZ09J7IA.jpeg)\n\
  \n图 21-2\n\n也可以通过右键点击一个视图并选择 `Chains -> Create Horizontal Chain` 或 `Chains -> Create\
  \ Vertical Chain` 菜单选项创建链。\n\n## 21.2 更改链样式\n\n如果没有配置链样式，`ConstraintLayout` 将默认使用散开链样式。可以通过右键点击链中的任何控件并选择\
  \ `Cycle Chain Mode` 菜单选项来更改链样式。每点击一次菜单选项，样式将按照散开（spread）、内部散开（spread inside）和聚集（packed）的顺序切换到另一个设置。\n\
  \n或者，也可以在属性工具窗口中展开 `layout_constraints` 属性，并根据链的方向更改 `horizontal_chainStyle` 或 `vertical_chainStyle`\
  \ 属性来指定样式：\n\n![image-Q8593OEX.jpg](img/image-Q8593OEX.jpeg)\n\n图 21-3\n\n## 21.3\
  \ 内部散开链样式\n\n图 21-4 展示了使用上述技术将链样式更改为内部散开链样式的效果：\n\n![image-8U4OCKBW.jpg](img/image-8U4OCKBW.jpeg)\n\
  \n图 21-4\n\n## 21.4 聚集链样式\n\n使用相同的技术，将链样式属性更改为聚集（packed）会导致布局发生，如图 21-5 所示：\n\n\
  ![image-J5OJHLEO.jpg](img/image-J5OJHLEO.jpeg)\n\n图 21-5\n\n## 21.5 带偏置的聚集链样式\n\n\
  聚集链的位置可能会受到偏置（bias）的影响。偏置值可以在 `0.0` 到 `1.0` 之间。\n\n![image-DX3OUVZ.jpg](img/image-DX3OUVZ.jpeg)\n\
  \n图 21-6\n\n## 21.6 权重链\n\n每个控件相对于其他控件所占据的空间可以通过添加权重属性来控制。图 21-9 显示了将 `button1`\
  \ 的 `layout_constraintHorizontal_weight` 设置为 `4`，并将 `button2` 和 `button3` 设置为 `2`\
  \ 的效果：\n\n![image-C2H9ZSXV.jpg](img/image-C2H9ZSXV.jpeg)\n\n图 21-9\n\n## 21.7 使用比例\n\
  \nConstraintLayout 比例允许一个控件的维度相对于控件的另一个维度进行调整（也称为宽高比）。例如，可以将宽高比应用到 `ImageView` 上，以确保其宽度始终是高度的两倍。\n\
  \n维度比例约束通过将受限维度设置为匹配约束模式并在控件上配置 `layout_constraintDimensionRatio` 属性来配置的。该比例值可以指定为浮点值或宽高比例设置。\n\
  \n```xml\nandroid:layout_width=\"0dp\"\nandroid:layout_height=\"100dp\"\nandroid:id=\"\
  @+id/imageView\"\napp:layout_constraintDimensionRatio=\"2:1\" />\n```\n\n\n\n\n\
  ```xml\napp:layout_constraintBottom_toBottomOf=\"parent\"\napp:layout_constraintRight_toRightOf=\"\
  parent\"\napp:layout_constraintLeft_toLeftOf=\"parent\"\napp:layout_constraintTop_toTopOf=\"\
  parent\"\napp:layout_constraintDimensionRatio=\"W,1:3\" />\n```\n\n在上面的示例中，高度将取决于应用于它的约束条件。在这种情况下，约束已配置为，使它附加到父视图的顶部和底部，实质上是将小部件拉伸以填充整个父视图的高度。另一方面，宽度维度被限制为\
  \ `ImageView` 高度的三分分之一。因此，无论布局在什么尺寸的屏幕或方向上显示，`ImageView` 的高度将始终与父视图相同，宽度为该高度的三分之一。\n\
  \n不通过手动编辑 XML 资源文件也可以获得相同的结果。每当组件尺寸设置为“匹配约束”（match constraint）模式时，属性面板的检查器（Inspector）区域就会出现一个比例控制开关。例如，图\
  \ 21-10 显示了分别设置为匹配约束模式和 `100dp` 的按钮组件的布局宽度和高度属性，并突出显示了组件尺寸预览中的比例控制开关：\n\n ![image-NDR1OEEN.jpg](img/image-NDR1OEEN.jpeg)\n\
  \n图 21-10\n\n默认情况下，比例尺寸控制是关闭的。点击该控制控件可以启用比例约束，并显示一个可以在其中更改比例的额外字段：\n\n ![image-8JXLY918.jpg](img/image-8JXLY918.jpeg)\n\
  \n图 21-11\n\n## 21.8 总结\n\n链（chains）和比例（ratios）都是 `ConstraintLayout` 类的强大功能，旨在为\
  \ Android 应用程序中设计灵活且响应式的用户界面布局提供额外的选项。正如本章概述，Android Studio 布局编辑器已经过增强，以便在用户界面设计过程中更容易地使用这些功能。\n\
  \n## 22. Android Studio 布局编辑器 ConstraintLayout 教程\n\n为 Android 应用程序设计用户界面最简单且高效的方法是使用\
  \ Android Studio 布局编辑器工具。本章将概述如何使用这种方法创建基于 `ConstraintLayout` 的用户界面。本章包含的练习也将作为一个机会，概述从一个“空壳”级\
  \ Android Studio 项目开始创建一个 activity 的过程。\n\n在介绍了 Android Studio 布局编辑器用法之后，本章还将介绍布局检查器（Layout\
  \ Inspector）工具。\n\n## 22.1 Android Studio 布局编辑器工具示例\n\n此示例阶段的第一步是创建一个新的 Android\
  \ Studio 项目。启动 Android Studio 并通过选择 `File` -> `Close Project` 菜单关闭任何之前打开的项目。\n\n\
  从欢迎界面选择 `New Project` 选项，选择 `Empty Views Activity` 模板并点击 `Next`。在 `Name` 字段中输入 `LayoutSample`，并指定\
  \ `com.ebookfrenzy.layoutsample` 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为\
  \ `API 26`：Android 8.0 (Oreo)，并将 `Language` 菜单设置为 `Java`。\n\n## 22.2 准备布局编辑器环境\n\
  \n在 `app` -> `res` -> `layout` 文件夹中找到并双击 `activity_main.xml` 布局文件将其加载到布局编辑器工具中。由于本教程旨在获得使用约束的经验，请使用布局编辑器工具栏上的按钮关闭自动连接（Autoconnect）功能。一旦禁用，该按钮将会出现一条斜线，如图\
  \ 22-1 所示：\n\n ![image-S8KMRLMQ.jpg](img/image-S8KMRLMQ.jpeg)\n\n图 22-1\n\n如果 `Autoconnect`\
  \ 按钮右侧的默认边距值未设置为 `8dp`，请点击它并在生成的面板中选择 `8dp`。\n\n用户界面设计还将使用 `ImageView` 对象来显示图像。在继续之前，应将此图像添加到项目中，以便在章节后续部分使用。该文件名为\
  \ `GalaxyS23.webp`，可以在以下 URL 下载的示例代码 `project_icons` 文件夹中找到：\n\nhttps://www.payloadbooks.com/product/ladybugjava\n\
  \n在 Android Studio 中，显示资源管理器（Resource Manager）工具窗口（`View` -> `Tool Windows` -> `Resource\
  \ Manager`）。在操作系统的文件导航器中找到 `GalaxyS23.webp` 图片，并将其拖到资源管理器工具窗口上。在生成的对话框中，点击 `Next`，然后点击\
  \ `Import` 按钮将图像添加到项目中。图像现在应该出现在资源管理器中，如下方的图 22-2 所示：\n\n ![image-I63FHRA6.jpg](img/image-I63FHRA6.jpeg)\n\
  \n图 22-2\n\n图像也将出现在项目工具窗口的 `res` -> `drawables` 部分：\n\n ![image-UWIVFZYV.jpg](img/image-UWIVFZYV.jpeg)\n\
  \n图 22-3\n\n## 22.3 将组件添加到用户界面\n\n从 `Common` 调色板类别内部，将 `ImageView` 对象拖到显示视图的中心。注意，会出现水平和垂直虚线，表示显示的中心轴。当居中时，释放鼠标按钮将视图放置在目标位置。一旦放置在布局中，将出现资源（`Resources`）对话框，请求在视图中显示的图像。在对话框顶部的搜索栏中输入“galaxy”来查找资源，如图\
  \ 22-4 所示：\n\n ![image-8WX99N5.jpg](img/image-8WX99N5.jpeg)\n\n图 22-4\n\n选择图像并点击\
  \ `OK` 将分配给 `ImageView`。如有必要，使用缩放句柄调整 `ImageView` 的大小并将其重新定位在布局中心。此时，布局应匹配图 22-5：\n\
  \n ![image-WN2HH9P.jpg](img/image-WN2HH9P.jpeg)\n\n图 22-5\n\n从调色板的 `Common` 部分点击并拖入\
  \ `TextView` 对象，并将其放置在 `ImageView` 上，如图 22-6 所示。\n\n使用属性面板，展开 `Common Attributes`\
  \ 部分中的 `textAppearance` 项，将 `textSize` 属性更改为 `24sp`，`textAlignment` 设置为 `center`，并将文本更改为“Samsung\
  \ Galaxy S23”。 ![image-HJA1WHKK.jpg](img/image-HJA1WHKK.jpeg)\n\n图 22-6\n\n接下来，在布局底部添加三个\
  \ `Button` 组件，并将这些视图的属性设置为“Buy Now”、“Pricing”和“Details”。完成后的布局现在应该匹配图 22-7：\n\n\
  \ ![image-N9NSW63Y.jpg](img/image-N9NSW63Y.jpeg)\n\n图 22-7\n\n此时，组件的约束尚不充分，以便布局引擎能够在运行时定位并调整组件大小。如果现在运行程序，所有组件将位于显示器的左上角。\n\
  \n缺少约束会导致布局无法适应设备方向的变化，导致内容偏离中心，并且图像以及所有三个按钮位于屏幕可视区域之外。使用布局编辑器工具栏上的设备旋转菜单（如图 22-8\
  \ 中的箭头所示）在横屏模式下查看用户界面：\n\n ![image-GCJLV5NV.jpg](img/image-GCJLV5NV.jpeg) \n\n图\
  \ 22-8\n\n仍需一些工作来使其成为响应式用户界面。\n\n## 22.4 添加约束\n\n约束是创建适应设备方向变化和不同屏幕尺寸布局的关键。首先将布局旋转回竖屏方向，并选择\
  \ `ImageView` 上方的 `TextView` 组件。选中组件后，从 `TextView` 的左侧、右侧和顶部建立 `ConstraintLayout`\
  \ 对应边的约束，如图 22-9 所示。将顶部约束的间距设置为 `16`：\n\n ![image-YGMIU094.jpg](img/image-YGMIU094.jpeg)\n\
  \n图 22-9\n\n\n\n\n在约束 `TextView` 小部件后，选择 `ImageView` 实例并在左、右两侧建立相反的约束，每个约束都连接到父布局的对应侧。接下来，建立从\
  \ `ImageView` 顶部到 `TextView` 底部的约束连接，以及从 `ImageView` 底部到中心 `Button` 组件顶部的约束连接。如有必要，点击并拖动\
  \ `ImageView` 以使其保持在布局的垂直中心位置。\n\n在 `ImageView` 仍处于选中状态时，使用属性面板中的 `Inspector`（检查器）将\
  \ `ImageView` 的顶部和底部边距分别更改为 24 和 8，并将组件的高度和宽度维度属性均更改为 `match_constraint`，以便组件调整大小以匹配约束。这些设置将允许布局引擎在需要时放大或缩小\
  \ `ImageView` 的尺寸以适应布局的变化：\n\n![image-MJQATNSM.jpg](img/image-MJQATNSM.jpeg)\n\n\
  图 22-10\n\n图 22-11 显示了 `ImageView` 相对于布局中其他元素的当前实现约束：\n\n![image-3PM4N5IA.jpg](img/image-3PM4N5IA.jpeg)\n\
  \n图 22-11\n\n最后一个任务是为三个 `Button` 组件添加约束。在本示例中，按钮将以链（chain）的形式放置。首先，通过点击图 22-1 中突出显示的工具栏按钮，在\
  \ `Layout Editor` 中开启 `Autoconnect`（自动连接）。\n\n接下来，点击 `Buy Now` 按钮，然后按住 Shift 点击另外两个按钮以选中全部三个。右键点击\
  \ `Buy Now` 按钮，并在弹出菜单中选择 `Chains`（链） -> `Create Horizontal Chain`（创建水平链）菜单选项。默认情况下，链将使用散开（spread）样式显示，这是本示例的正确行为。\n\
  \n最后，在 `Buy Now` 按钮底部和布局底部之间建立边距为 8 的约束。对剩余按钮重复此步骤。\n\n完成这些步骤后，按钮应按图 22-12 所示的轮进行约束：\n\
  \n![image-4FXM30WC.jpg](img/image-4FXM30WC.jpeg)\n\n图 22-12\n\n## 22.5 测试布局\n\n\
  在布局中添加约束后，将屏幕旋转到横屏模式，并验证布局是否适应了新的屏幕尺寸。\n\n虽然 `Layout Editor` 工具提供了一个设计用户界面布局的良好视觉环境，但在测试时，运行中的\
  \ App 测试是不可替代的。在物理 Android 设备或模拟器会话上启动 App，并验证用户界面是否反映了在 `Layout Editor` 中创建的布局。例如，图\
  \ 22-13 显示了横屏模式下的运行 App：\n\n![image-KCBK131Q.jpg](img/image-KCBK131Q.jpeg)\n\n图\
  \ 22-13\n\n用户界面设计现在已完成。设计更复杂的用户界面布局是上述步骤的延续。将视图拖放到显示器上，根据需要进行定位、约束并设置属性。\n\n## 22.6\
  \ 使用 Layout Inspector\n\n可以使用 `Layout Inspector` 工具查看组成用户界面布局的组件层级。App 必须在运行 Android\
  \ API 29 或更高版本的设备或模拟器上才能访问此信息。App 运行后，选择 `Tools` -> `Layout Inspector` 菜单选项，然后按照下方图\
  \ 22-14 中标记为 A 的菜单选择要检查的进程。\n\n一旦检查器加载，最左侧的面板 (A) 显示组成用户界面布局的组件层级。中间面板 (B) 视觉化地表示布局设计。点击视觉布局中的组件会导致该项在层级列表中突出显示，从而易于找到视觉组件相对于整体布局层级的位置。\n\
  \n最右侧的面板（图 22-14 中标记为 C）包含当前选中组件的所有属性设置，允许对组件的内部配置进行深入分析。在适当的情况下，值单元格将包含指向项目源代码中属性设置位置的链接。\n\
  \n![image-1C1FSJE1.jpg](img/image-1C1FSJE1.jpeg)\n\n图 22-14\n\n要以 3D 视图查看布局，点击标记为\
  \ D 的按钮。这将显示层级的“爆炸式”表示，以便进行旋转和检查。这对于识别被遮挡的视图等任务非常有用：\n\n![image-YKTB67T3.jpg](img/image-YKTB67T3.jpeg)\n\
  \n图 22-15\n\n点击并拖动渲染图以进行三维空间旋转，使用上方箭头指示的滑块增加层之间的间距。再次点击标记为 D 的按钮返回 2D 视图。\n\n##\
  \ 22.7 总结\n\nAndroid Studio 中的 `Layout Editor` 工具与 `ConstraintLayout` 类紧密集成。本章通过创建一个示例用户界面，概述了如何使用\
  \ `Layout Editor` 工具添加小部件并设置约束，来实现基于 `ConstraintLayout` 的用户界面。本章还引入了 `Live Layout\
  \ Inspector` 工具，该工具对于分析用户界面布局的结构组成非常有用。\n\n## 23. 在 Android Studio 中手动设计 XML 布局\n\
  \n虽然使用 Android Studio `Layout Editor` 工具设计布局极大地提高了效率，但仍然可以通过手动编辑 XML 来创建布局。本章将介绍\
  \ XML 布局文件的基础。\n\n## 23.1 手动创建 XML 布局\n\nXML 布局文件的结构非常直观，遵循视图的分级方法。XML 资源的第一行应包含以下声明：\n\
  \n该声明之后是布局的根元素，通常是一个容器视图。这由开启和闭合标签以及任何需要在视图上设置的属性表示。以下 XML 声明了一个 `ConstraintLayout`\
  \ 视图作为根元素，并设置了 `match_parent` 属性以填充设备的所有空间：\n\n```xml\nxmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \nxmlns:app=\"http://schemas.android.com/apk/res/auto\"\nxmlns:tools=\"http://schemas.android.com/tools\"\
  \nandroid:layout_width=\"match_parent\"\nandroid:layout_height=\"match_parent\"\n\
  android:paddingLeft=\"16dp\"\nandroid:paddingRight=\"16dp\"\nandroid:paddingTop=\"\
  16dp\"\nandroid:paddingBottom=\"16dp\"\ntools:context=\".MainActivity\"\n```\n\n\
  在上述示例中，布局元素还配置了各边的内边距。Android 布局中的任何间距规范都必须使用以下单位之一：\n\n- `in` - 英制\n- `mm` - 毫米\n\
  - `pt` - 磅（1/72 英寸）\n- `dp` - 密度无关像素。一种根据设备显示物理密度相对于 160dpi 显示基准的抽象测量单位。\n- `sp`\
  \ - 比例无关像素。与 `dp` ，但会根据用户的字体偏好进行缩放。\n- `px` - 实际像素。不建议使用，因为不同的屏幕具有不同的像素密度。优先使用 `dp`。\n\
  \n任何需要添加到 `ConstraintLayout` 父容器的子元素必须嵌套在开启和闭合标签之间。在以下示例中，已添加了一个 `Button` 组件作为 `ConstraintLayout`\
  \ 的子元素：\n\n```xml\n<Button\n    android:id=\"@+id/button\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:text=\"\
  My Button\" />\n```\n\n\n\n按照目前的实现，该按钮没有任何约束连接。因此，在运行时，按钮将出现在屏幕的左上角（尽管由于父布局分配的内边距缩进了\
  \ 16dp）。然而，如果在按钮两侧添加了相反的约束，它将居中显示在布局中\n\n```xml\nandroid:text=\"My Button\"\nandroid:layout_width=\"\
  wrap_content\"\nandroid:layout_height=\"wrap_content\"\nandroid:id=\"@+id/button\"\
  \napp:layout_constraintBottom_toBottomOf=\"parent\"\napp:layout_constraintEnd_toEndOf=\"\
  parent\"\napp:layout_constraintStart_toStartOf=\"parent\"\napp:layout_constraintTop_toTopOf=\"\
  parent\" />\n```\n\n若要在布局中添加第二个控件，请将其嵌入 `ConstraintLayout` 元素的正体内。例如，下面的修改为布局中添加了一个\
  \ `TextView` 控件：\n\n```xml\nxmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \nxmlns:app=\"http://schemas.android.com/apk/res-auto\"\nxmlns:tools=\"http://schemas.android.com/tools\"\
  \nandroid:layout_width=\"match_parent\"\nandroid:layout_height=\"match_parent\"\n\
  android:paddingLeft=\"16dp\"\nandroid:paddingTop=\"16dp\"\nandroid:paddingRight=\"\
  16dp\"\nandroid:paddingBottom=\"16dp\"\ntools:context=\".MainActivity\"\nandroid:text=\"\
  @string/button_string\"\nandroid:layout_width=\"wrap_content\"\nandroid:layout_height=\"\
  wrap_content\"\nandroid:id=\"@+id/button\"\napp:layout_constraintBottom_toBottomOf=\"\
  parent\"\napp:layout_constraintEnd_toEndOf=\"parent\"\napp:layout_constraintStart_toStartOf=\"\
  parent\"\napp:layout_constraintTop_toTopOf=\"parent\" />\nandroid:text=\"My Text\"\
  \nandroid:layout_width=\"wrap_content\"\nandroid:layout_height=\"wrap_content\"\n\
  android:id=\"@+id/textView\" />\n```\n\n同样，新添加的 `TextView` 缺少约束会导致它在运行时出现在布局的左上角。下面的修改添加了与父布局连接的相反约束，以使控件水平居中，同时添加了一个将\
  \ `TextView` 底部连接到 `button` 顶部的约束：\n\n```xml\nandroid:text=\"My Text\"\nandroid:layout_width=\"\
  wrap_content\"\nandroid:layout_height=\"wrap_content\"\nandroid:id=\"@+id/textView\"\
  \nandroid:layout_marginTop=\"8dp\"\nandroid:layout_marginBottom=\"8dp\"\napp:layout_constraintBottom_toTopOf=\"\
  @+id/button\"\napp:layout_constraintEnd_toEndOf=\"parent\"\napp:layout_constraintStart_toStartOf=\"\
  parent\"\napp:layout_constraintTop_toTopOf=\"parent\" />\n```\n\n此外，请注意 `Button`\
  \ 和 `TextView` 视图声明了多个属性。这两个视图都被分配了 ID，并配置为显示由名为 `button_string` 和 `text_string`\
  \ 的字符串资源表示的字符串。此外，两个对象都声明了 `wrap_content` 高和宽属性，以便其尺寸能够适应内容（在本例中，即字符串资源值引用的文本）。\n\
  \n在设计模式下的布局编辑器器的预览面板中查看，上述布局的渲染结果如如图 23-1 所示：\n\n![image-PDWVAL7G.jpg](img/image-PDWVAL7G.jpeg)\n\
  \n图 23-1\n\n## 23.2 手动编写 XML 与 视觉布局设计\n\n是手动编写 XML 还是使用设计模式下的布局编辑器工具，这取决于个人喜好。然而，使用设计模式有其优势。\n\
  \n首先，设计模式通常会更快，因为它避免了输入 XML 代码的需要。此外，设计模式避免了学习 Android SDK 视图类各种属性值复杂性的需要。与其不断参考\
  \ Android 文档来查找正确的关键字和值，大多数属性可以通过参考属性面板（Attributes panel）找到。\n\n抛开设计模式的所有优势不谈，重要的是，用户界面设计的两种方法完全不是互斥的。作为应用程序开发者，你可能会在设计模式下创建用户界面，同时通过直接编辑生成的\
  \ XML 资源对设计进行微调和布局调整。界面设计的这两种视图在 Android Studio 环境中并排显示，使得在 XML 和视觉布局之间无缝工作变得简单。\n\
  \n## 23.3 总结\n\nAndroid Studio 布局编辑器工具提供了一种视觉直观的用户界面设计方法。通过使用拖放范式结合一系列属性编辑器，该工具为应用程序开发者带来了显著的生产力效益。\n\
  \n用户界面设计也可以通过手动编写 XML 布局资源文件来实现，其格式结构良好且易于理解。\n\n布局编辑器工具生成 XML 资源文件的事实意味着，这两种界面设计方法可以结合起来，为用户界面开发提供一种“兼顾两者”的方法。\n\
  \n## 24. 使用约束集管理约束\n\n在到本书为止，所有的用户界面设计任务都是使用 Android Studio 布局编辑器工具完成的，无论是文本模式还是设计模式。编写\
  \ XML 资源文件或使用 Android Studio 布局编辑器的替代方案是编写 Java 代码来直接创建、配置和操作组成 Android Activity\
  \ 用户界面的视图对象。本章将在描述视图属性以及布局约束的创建和管理等关键概念之前，将探索编写 Java 代码创建用户界面的某些优缺点。\n\n在下一章中，将创建一个示例项目，并用于演示这种创建方法中涉及的典型步骤。\n\
  \n## 24.1 Java 代码与 XML 布局文件\n\n与使用设计模式下的布局编辑器工具相比，何时手动编写 XML 取决于个人喜好。使用 XML 资源文件设计界面有许多优势。事实上，Google\
  \ 在 Android 文档中极力推崇 XML 资源优于 Java 代码的优点。正如上一节所述，使用 XML 方法的一个关键优势是可以使用 Android Studio\
  \ 布局编辑器工具，它可以生成 XML。另一个优势是一旦创建应用程序，就可以通过修改 XML 来更改界面，从而避免重新编译应用程序。此外，即使在编写 XML 布局，也可以通过布局编辑器的预览功能获得界面的实时反馈。\n\
  \n关于 Java 代码布局的优势，Java 相比 XML 资源文件最重要的优势体现在处理动态用户界面时。XML 资源文件本质上对于定义静态布局最有用，这些布局在每次调用\
  \ Activity 之间不太发生显著变化。另一方面，Java 代码非常适用于运行时动态创建用户界面。这在用户界面每次执行时都可能不同时尤为有用。\n\n在 Java\
  \ 代码中处理用户界面组件的知识，在必须在应用程序运行时对静态 XML 资源布局进行动态更改时也同样有用。\n\n最后，某些开发者倾向于编写 Java 代码而不是使用布局工具和\
  \ XML，无论后者提供哪些优势。\n\n\n\n\n第一个视图（通常是一个可以添加额外子视图的容器视图）通过调用 activity 的 `setContentView()`\
  \ 方法显示给用户。可以通过调用该对象的 `addView()` 方法向根视图添加额外的视图。\n\n当使用 `Java` 代码操作在 XML 布局资源文件中包含的视图时，有必要获取视图的\
  \ ID。对于在 `Java` 中创建的视图也遵循相同的规则。因此，对于后续在 `Java` 代码中需要进行某些类型访问的任何视图，必须为其分配一个 ID。这可以通过调用相关视图对象的\
  \ `setId()` 方法来实现。在随后的代码中，可以通过对象的 `getId()` 方法获取视图的 ID。\n\n## 24.3 视图属性 (View Attributes)\n\
  \n每个视图类都关联有一系列属性。这些属性设置直接作用在视图实例上，通常定义了视图对象的外观或行为。属性的示例包括显示在 `Button` 对象上的文本，或 `ConstraintLayout`\
  \ 视图的背景颜色。Android SDK 中的每个视图类都有一组预定义的方法，允许用户设置和获取这些属性值。例如，`Button` 类有一个 `setText()`\
  \ 方法，可以在 `Java` 代码中调用该方法将按钮上显示的文本设置为特定的字符串值。另一方面，可以通过调用对象的 `setBackgroundColor()`\
  \ 方法来设置 `ConstraintLayout` 对象的背景颜色。\n\n## 24.4 约束集 (Constraint Sets)\n\n虽然属性设置是视图内部的，并决定了视图的外观和行为，但约束集控制了视图相对于其父视图和其他兄弟视图的显示。每个\
  \ `ConstraintLayout` 实例都关联有一组约束，定义了其子视图是如何定位和约束的。\n\n在 `Java` 代码中处理约束集的关键是 `ConstraintSet`\
  \ 类。该类包含一系列方法，允许执行创建、配置和将约束应用于 `ConstraintLayout` 实例等任务。此外，`ConstraintLayout` 实例的当前约束可以复制到\
  \ `ConstraintSet` 对象中，并应用于其他布局（可以或可以带有修改）。\n\n`ConstraintSet` 实例的创建就像其他 `Java` 对象一样：\n\
  \n```\nConstraintSet set = new ConstraintSet();\n```\n\n一旦创建了约束集，就可以在该实例上调用方法来执行广泛的任务。\n\
  \n### 24.4.1 建立连接 (Establishing Connections)\n\n`ConstraintSet` 类的 `connect()` 方法用于建立视图之间的约束连接。以下代码配置了一个约束集，其中\
  \ `Button` 视图的左侧连接到 `EditText` 视图的右侧，间距为 70dp：\n\n```\nset.connect(button1.getId(),\
  \ ConstraintSet.LEFT,\neditText1.getId(), ConstraintSet.RIGHT, 70);\n```\n\n###\
  \ 24.4.2 将约束应用于布局 (Applying Constraints to a Layout)\n\n一旦配置了约束集，必须将其应用于 `ConstraintLayout`\
  \ 实例才能生效。约束集的应用是通过调用 `applyTo()` 方法实现的，并传递要应用设置的布局对象的引用：\n\n```\nset.applyTo(myLayout);\n\
  ```\n\n### 24.4.3 父级约束连接 (Parent Constraint Connections)\n\n子视图与其父 `ConstraintLayout`\
  \ 之间的连接也可以通过引用 `ConstraintSet.PARENT_ID` 常来建立。在以下示例中，约束集被配置为将 `Button` 视图的顶部连接到父布局的顶部，间距为\
  \ 100dp：\n\n```\nset.connect(button1.getId(), ConstraintSet.TOP,\nConstraintSet.PARENT_ID,\
  \ ConstraintSet.TOP, 100);\n```\n\n### 24.4.4 尺寸约束 (Sizing Constraints)\n\n提供了多种方法来控制视图的尺寸行为。例如，以下代码将\
  \ `Button` 视图的水平尺寸设置为 `wrap_content`，并将 `ImageView` 实例的垂直尺寸设置为最大 250dp：\n\n```\n\
  set.constrainWidth(button1.getId(), ConstraintSet.WRAP_CONTENT);\nset.constrainMaxHeight(imageView1.getId(),\
  \ 250);\n```\n\n### 24.4.5 约束偏置 (Constraint Bias)\n\n正如“在 Android Studio 中使用 ConstraintLayout\
  \ 的指南”章节概述的那样，当视图具有相反的约束时，它将沿约束轴居中（即水平方向或垂直方向）。这种居中可以通过在特定的约束轴上应用偏置来调整。在使用 Android\
  \ Studio 布局编辑器时，这是通过属性（Attributes）工具窗口中的控件实现的。然而，在处理约束集时，可以使用 `setHorizontalBias()`\
  \ 和 `setVerticalBias()` 方法添加偏置，引用视图 ID 和作为 0 到 1 之间的浮点值的偏置值。\n\n例如，以下代码在应用 25% 的水平偏置之前，将\
  \ `Button` 的左侧和右侧约束到父布局相应的侧边：\n\n```\nset.connect(button1.getId(), ConstraintSet.LEFT,\n\
  ConstraintSet.PARENT_ID, ConstraintSet.LEFT, 0);\nset.connect(button1.getId(), ConstraintSet.RIGHT,\n\
  ConstraintSet.PARENT_ID, ConstraintSet.RIGHT, 0);\nset.setHorizontalBias(button1.getId(),\
  \ 0.25f);\n```\n\n### 24.4.6 对齐约束 (Alignment Constraints)\n\n也可以使用约束集应用对齐。Android\
  \ Studio 布局编辑器提供的全套对齐选项也可以通过约束集进行配置，通过 `centerVertically()` 和 `centerHorizontally()`\
  \ 方法，这两个方法根据配置的对齐方式接受不同的参数。此外，`center()` 方法用于在两个视图之间居中视图。\n\n在下面的代码中，`button2` 的位置使其与\
  \ `button1` 水平对齐：\n\n```\nset.centerHorizontally(button2.getId(), button1.getId());\n\
  ```\n\n### 24.4.7 复制与应用约束集 (Copying and Applying Constraint Sets)\n\n可以使用 `clone()`\
  \ 方法将 `ConstraintLayout` 实例的当前约束复制到 `ConstraintSet` 对象中。例如，以下代码将名为 `myLayout` 的\
  \ `ConstraintLayout` 实例的设置复制到约束集对象：\n\n```\nset.clone(myLayout);\n```\n\n一旦复制，可以将约束集直接应用于布局，或者如下例所示在应用之前进行修改：\n\
  \n```\nConstraintSet set = new ConstraintSet();\nset.clone(myLayout);\nset.constrainWidth(button1.getId(),\
  \ ConstraintSet.WRAP_CONTENT);\nset.applyTo(mySecondLayout);\n```\n\n### 24.4.8\
  \ ConstraintLayout 链 (ConstraintLayout Chains)\n\n可以使用 `createHorizontalChain()`\
  \ 和 `createVerticalChain()` 方法在约束集中创建垂直和水平链。方法的语法如下：\n\n`createHorizontalChain(int\
  \ leftId, int leftSide, int rightId, int rightSide, int[] chainIds, float[] weights,\
  \ int style);`\n\n根据上述语法，以下示例创建从 `button1` 开始到 `button4` 结束的水平分布链。在这些视图之间是 `button2`\
  \ 和 `button3`，它们的权重均设置为零：\n\n```\nint[] chainViews = {button2.getId(), button3.getId()};\n\
  float[] chainWeights = {0, 0};\nset.createHorizontalChain(button1.getId(), ConstraintSet.LEFT,\n\
  button4.getId(), ConstraintSet.RIGHT,\nchainViews, chainWeights,\nConstraintSet.CHAIN_SPREAD);\n\
  ```\n\n可以通过向 `removeFromHorizontalChain()` 或 `removeFromVerticalChain()` 方法传递要移除的视图\
  \ ID 从链中移除。可以使用 `addToHorizontalChain()` 或 `addToVerticalChain()` 方法将视图添加到现有链。在两种情况下，方法都以要插入新视图的两个视图\
  \ ID 作为参数：\n\n```\nset.addToHorizontalChain(newViewId, leftViewId, rightViewId);\n\
  ```\n\n\n\n可以使用 `create()` 方法将指南线添加到约束集中，然后使用 `setGuidelineBegin()`、`setGuidelineEnd()`\
  \ 或 `setGuidelinePercent()` 方法进行定位。在接下来的代码中，创建了一个垂直指南线，并将其定位在父布局宽度的 50% 处。然后将按钮视图的左侧连接到该指南线，且没有边距：\n\
  \n```\nset.create(R.id.myGuideline, ConstraintSet.VERTICAL_GUIDELINE);\nset.setGuidelinePercent(R.id.myGuideline,\
  \ 0.5f);\nset.connect(button.getId(), ConstraintSet.LEFT,\nR.id.myGuideline, ConstraintSet.RIGHT,\
  \ 0);\nset.applyTo(layout);\n```\n\n### 24.4.10 移除约束\n\n可以使用 `clear()` 方法从约束集中的视图移除约束，并通过参数传递视图\
  \ ID 和要移除约束的锚点点：\n\n```\nset.clear(button.getId(), ConstraintSet.LEFT);\n```\n\n\
  同样，通过在 `clear()` 方法调用中仅引用视图，即可一次性移除该视图上的所有约束：\n\n```\nset.clear(button.getId());\n\
  ```\n\n### 24.4.11 缩放\n\n可以使用 `ConstraintSet` 的 `setScaleX()` 和 `setScaleY()` 方法调整布局内视图的比例，这些方法接收执行操作的视图以及表示比例的浮点值作为参数。在接下来的代码中，一个按钮对象被缩放到原始宽度的两倍和高度的一半：\n\
  \n```\nset.setScaleX(myButton.getId(), 2f);\nset.setScaleY(myButton.getId(), 0.5f);\n\
  ```\n\n### 24.4.12 旋转\n\n分别可以使用 `setRotationX()` 和 `setRotationY()` 方法沿 X 轴或 Y 轴旋转视图，这两个方法都必须传递要旋转视图的\
  \ ID 和表示旋转角度的浮点值。旋转发生的中心点可以通过调用 `setTransformPivot()`、`setTransformPivotX()` 和 `setTransformPivotY()`\
  \ 方法来定义。接下来的代码使用位于点 (500, 500) 的中心点将按钮视图在 Y 轴上旋转 30 度：\n\n```\nset.setTransformPivot(button.getId(),\
  \ 500, 500);\nset.setRotationY(button.getId(), 30);\nset.applyTo(layout);\n```\n\
  \n在涵盖了约束集的理论以及从 Java 代码创建用户界面的方法后，下一章将通过创建一个示例应用程序来将这些理论付诸实践。关于 `ConstraintSet`\
  \ 类的更多细节，请参考以下 URL 中的参考指南：\n\n`https://developer.android.com/reference/androidx/constraintlayout/widget/ConstraintSet`\n\
  \n## 24.5 总结\n\n作为编写 XML 布局资源文件或使用 Android Studio 布局编辑器工具的替代方案，也可以在 Java 代码中动态创建\
  \ Android 用户界面。\n\n在 Java 代码中创建布局包括创建视图类的实例，并在这些对象上设置属性以定义所需的外和行为。\n\n视图相对于其 `ConstraintLayout`\
  \ 父视图以及任何兄弟视图的定位和大小是通过约束集（constraint sets）定义的。约束集由 `ConstraintSet` 类的实例表示，一旦创建，就可以使用广泛的方法调用进行配置，以执行诸如建立约束连接、控制视图缩放行为和创建链等任务。\n\
  \n在本章涵盖了 `ConstraintSet` 类的基础知识后，下一章将通过一个教程将这些功能应用到实践中。\n\n## 25. Android ConstraintSet\
  \ 教程\n\n上一章介绍了使用 `ConstraintLayout` 和 `ConstraintSet` 类在 Java 代码中创建和修改用户界面布局的基本概念。本章将通过创建一个创建一个完全使用\
  \ Java 代码创建且不使用 Android Studio 布局编辑器工具的示例布局，将这些概念付诸实践。\n\n### 25.1 在 Android Studio\
  \ 中创建示例项目\n\n启动 Android Studio，从欢迎屏幕上选择 New Project（新建项目）选项，在弹出的新项目对话框中，点击 Next（下一步）按钮之前选择\
  \ Empty Views Activity 模板。\n\n在 Name（名称）字段中输入 `JavaLayout`，并指定 `com.ebookfrenzy.javalayout`\
  \ 为包名。在点击 Finish（完成）按钮之前，将 Minimum API level 设置为 API 26: Android 8.0 (Oreo)，并将 Language（语言）菜单设置为\
  \ Java。\n\n项目创建完成后，`MainActivity.java` 文件将自动加载到编辑面板。正如我们预期的那样，Android Studio 创建了一个模板活动并重写了\
  \ `onCreate()` 方法，为添加 Java 代码以创建用户界面提供了一个理想的位置。\n\n### 25.2 向 Activity 添加视图\n\n\
  `onCreate()` 方法目前设计为使用资源布局文件创建用户界面。因此，首先从该方法中删除以下几行：\n\n```java\n@Override\nprotected\
  \ void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    EdgeToEdge.enable(this);\n    setContentView(R.layout.activity_main);\n   \
  \ ViewCompat.setOnApplyWindowInsetsListener(findViewById(R.id.main),\n    (v, insets)\
  \ -> {\n        Insets systemBars =\n        insets.getInsets(WindowInsetsCompat.Type.systemBars());\n\
  \        v.setPadding(systemBars.left, systemBars.top,\n        systemBars.right,\
  \ systemBars.bottom);\n        return insets;\n    });\n}\n```\n\n下一个修改是向活动添加一个带有单个\
  \ `Button` 视图子元素的 `ConstraintLayout` 对象。这涉及创建 `ConstraintLayout` 和 `Button` 类的新实例。然后需要将\
  \ `Button` 视图作为子视图添加到 `ConstraintLayout` 中，而后者通过通过的 `setContentView()` 方法显示：\n\n\
  ```java\npackage com.ebookfrenzy.javalayout;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  import android.os.Bundle;\nimport androidx.constraintlayout.widget.ConstraintLayout;\n\
  import android.widget.Button;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n \
  \       super.onCreate(savedInstanceState);\n        configureLayout();\n    }\n\
  \n    private void configureLayout() {\n        Button myButton = new Button(this);\n\
  \        ConstraintLayout myLayout = new ConstraintLayout(this);\n        myLayout.addView(myButton);\n\
  \        setContentView(myLayout);\n    }\n}\n```\n\n当以此方式创建用户界面对象的新实例时，构造方法必须传递创建对象所在的上下文，在本例中，上下文是当前活动。由于上述代码位于活动内部，因此通过标准的\
  \ `this` 关键字引用上下文：`Button myButton = new Button(this);`\n\n完成上述添加后，编译并运行应用程序（在物理设备或模拟器上）。启动后，可见结果将是一个没有任何文本的按钮出现在\
  \ `ConstraintLayout` 视图的左上角，如图 25-1 所示：\n\n![image-74GCK5.jpg](img/image-74GCK5.jpeg)\n\
  \n图 25-1\n\n### 25.3 设置视图属性\n\n对于本次练习，我们需要将 `ConstraintLayout` 视图的背景设置为蓝色，并让 `Button`\
  \ 视图显示文本为“Press Me”，背景为黄色。这些任务可以通过如下代码片段所示，在 Java 代码中设置视图属性来实现。为了让按钮上的文本轻松翻译成其他语言，将其作为字符串资源添加。在\
  \ Project 工具窗口中，找到 `app -> res -> values -> strings.xml` 文件并对其进行修改，为“Press Me”字符串添加资源值：\n\
  \n```xml\nJavaLayout\nPress Me\n```\n\n虽然这是处理代码中直接引用字符串的推荐方法，但在后续的许多示例中将直接在代码中输入字符串，以避免在书中重复此步骤。\n\
  \n一旦字符串存储为资源，就可以按照如下方式从代码内部访问：\n\n`getString(R.string.press_me);`\n\n\n\n\n创建字符串资源后，在\
  \ `configureLayout()` 方法中添加代码以设置按钮文本和颜色属性：\n\n```java\nimport android.graphics.Color;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private void configureLayout()\
  \ {\n        Button myButton = new Button(this);\n        myButton.setText(getString(R.string.press_me));\n\
  \        myButton.setBackgroundColor(Color.YELLOW);\n        ConstraintLayout myLayout\
  \ = new ConstraintLayout(this);\n        myLayout.setBackgroundColor(Color.BLUE);\n\
  \        myLayout.addView(myButton);\n        setContentView(myLayout);\n    }\n\
  }\n```\n\n当应用编译并运行后，布局将反映属性设置，使得布局将以蓝色背景显示，按钮将在黄色背景上显示指定的文本。\n\n## 25.4 创建视图 ID\
  \ (Creating View IDs)\n\n当布局完成后，它将包含一个 `Button` 和一个 `EditText` 视图。在 `ConstraintSet`\
  \ 类的方法中引用这些视图之前，必须为它们分配唯一的视图 ID。此过程的第一步是创建一个包含这些 ID 值的新资源文件。\n\n右键点击 `app` -> `res`\
  \ -> `values` 文件夹，选择 `New` -> `Values Resource File` 菜单选项并将新资源文件命名为 `id.xml`。创建资源文件后，编辑它使其内容如下：\n\
  \n在教程的此阶段，仅创建了 `Button`，因此编辑 `configureLayout()` 方法为对象分配相应的 ID：\n\n```java\nprivate\
  \ void configureLayout() {\n    Button myButton = new Button(this);\n    myButton.setText(getString(R.string.press_me));\n\
  \    myButton.setBackgroundColor(Color.YELLOW);\n    myButton.setId(R.id.myButton);\n\
  }\n```\n\n## 25.5 配置约束集 (Configuring the Constraint Set)\n\n在没有约束的情况下，`ConstraintLayout`\
  \ 视图将 `Button` 视图放置在屏幕的左上角。为了指示布局视图将按钮放在不同的位置（在本例中为水平和垂直居中），有必要创建一个 `ConstraintSet`\
  \ 实例，用适当设置对其进行初始化并将其应用于父布局。\n\n对于此示例，需要配置按钮，使其宽度和高度限制为其显示文本的大小，并使视图在父布局中居中。再次编辑\
  \ `configureLayout()` 方法以进行这些更改：\n\n```java\nimport androidx.constraintlayout.widget.ConstraintSet;\n\
  \nprivate void configureLayout() {\n    Button myButton = new Button(this);\n  \
  \  myButton.setText(getString(R.string.press_me));\n    myButton.setBackgroundColor(Color.YELLOW);\n\
  \    myButton.setId(R.id.myButton);\n    ConstraintLayout myLayout = new ConstraintLayout(this);\n\
  \    myLayout.setBackgroundColor(Color.BLUE);\n    myLayout.addView(myButton);\n\
  \    setContentView(myLayout);\n    ConstraintSet set = new ConstraintSet();\n \
  \   set.constrainHeight(myButton.getId(), ConstraintSet.WRAP_CONTENT);\n    set.constrainWidth(myButton.getId(),\
  \ ConstraintSet.WRAP_CONTENT);\n    set.connect(myButton.getId(), ConstraintSet.START,\
  \ ConstraintSet.PARENT_ID, ConstraintSet.START, 0);\n    set.connect(myButton.getId(),\
  \ ConstraintSet.END, ConstraintSet.PARENT_ID, ConstraintSet.END, 0);\n    set.connect(myButton.getId(),\
  \ ConstraintSet.TOP, ConstraintSet.PARENT_ID, ConstraintSet.TOP, 0);\n    set.connect(myButton.getId(),\
  \ ConstraintSet.BOTTOM, ConstraintSet.PARENT_ID, ConstraintSet.BOTTOM, 0);\n   \
  \ set.applyTo(myLayout);\n}\n```\n\n配置好初始约束后，编译并运行应用，并验证 `Button` 视图现在出现在布局的中心：\n\
  \n![image-PCCH3OZ2.jpg](img/image-PCCH3OZ2.jpeg)\n\n图 25-2\n\n## 25.6 添加 EditText\
  \ 视图 (Adding the EditText View)\n\n要添加到布局的下一个项是 `EditText` 视图。第一步是创建 `EditText`\
  \ 对象，按照 `id.xml` 资源文件中的声明分配 ID，并将其添加到布局中。实现这些步骤的代码更改现在需要对 `configureLayout()` 方法进行如下修改：\n\
