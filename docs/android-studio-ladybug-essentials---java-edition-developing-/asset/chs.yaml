  \            Log.i(TAG, \"Duration = \" +\n            binding.videoView1.getDuration());\n\
  \        });\n    }\n}\n```\n\n现在在视频开始播放之前，Android Studio Logcat 面板将出现一条如下所示的消息，并且视频在结束后将重启：\n\
  \n`2023-06-27 09:25:41.313 3050-3050 VideoPlayer com.ebookfrenzy.videoplayer I Duration\
  \ = 25365`\n\n## 81.9 总结\n\nAndroid 设备是交付内容的极佳平台，特别是视频媒体形式。如本章所述，Android SDK 提供了两个类，即\
  \ `VideoView` 和 `MediaController`，它们结合使得将视频回放集成到 Android 应用中变得快速简单，通常只需要几行 Java\
  \ 代码。\n\n\n\n\n\n在之前的章节介绍 Android 多任务处理时，曾简要提到了画中画（Picture-in-picture，PiP）模式，但没有进行详细介绍。画中画模式主要为视频播放设计，允许\
  \ activity 屏幕缩小并放置在屏幕的任何位置。在此状态下，activity 继续运行，且无论设备上运行着任何其他活动，窗口都保持可见。这允许用户在执行检查电子邮件或处理电子表格等任务的同时，继续观看视频播放。\n\
  \n本章将对画中画模式进行概述，并在下一章中为 `VideoPlayer` 项目添加对画中画的支持。\n\n## 82.1 画中画功能\n\n正如本章稍后部分解释以及下一章演示的那样，activity\
  \ 是通过运行中的应用内部调用 API 进入 PiP 模式的。进入 PiP 模式后，可以指定配置选项来控制 PiP 窗口的宽高比，并定义包含在内的 activity\
  \ 屏幕区域。例如，图 82-1 显示了画中画模式下的视频播放 activity：\n\n![image-70YPWPEJ.jpg](img/image-70YPWPEJ.jpeg)\n\
  \n图 82-1\n\n图 82-2 显示了用户点击窗口后的 PiP 模式窗口。在此模式下，窗口看起来更大，并在中心包含一个全屏操作，点击该操作会将窗口恢复到全屏模式，且右上角有一个退出按钮，用于关闭窗口并将应用置于后台。当在此种模式下显示时，添加到\
  \ PiP 窗口的任何自定义操作将出现在屏幕上。在图 82-2 的例中，PiP 窗口包含了自定义的播放和暂停操作按钮：\n\n![image-CRF7IU2R.jpg](img/image-CRF7IU2R.jpeg)\n\
  \n图 82-2\n\n本章剩余部分将概述如何从 Android 应用内部启用和管理 PiP 模式。\n\n## 82.2 启用画中画模式\n\nPiP 模式目前仅支持运行\
  \ `API 26`：即 Android 8.0（Oreo）或更高版本的设备。实现 PiP 模式的第一步是在项目的清单文件（manifest file）中启用它。通过在每个需要\
  \ PiP 支持的 activity 元素中添加以下行，可以按 activity 配置 PiP 模式：\n\n```\nandroid:supportsPictureInPicture=\"\
  true\"\nandroid:configChanges=\"screenSize|smallestScreenSize|screenLayout|orientation\"\
  \n```\n\n`android:supportsPictureInPicture` 启用了 activity 的 PiP 功能，而 `android:configChanges`\
  \ 属性通知 Android 该 activity 可以处理布局配置更改。如果没有此设置，每次 activity 进出 PiP 模式时，activity 都会重启，导致在转换期间从视频开始重新播放。\n\
  \n## 82.3 配置画中画参数\n\nPiP 行为通过使用 `PictureInPictureParams` 类定义，可以使用 `Builder` 类创建如下实例：\n\
  \n```\nPictureInPictureParams params = new PictureInPictureParams.Builder().build();\n\
  ```\n\n上述代码创建了一个定义了特殊参数的默认 `PictureInPictureParams` 实例。也可以使用以下可选方法调用来自定义参数：\n\n\
  - `setActions()` – 用于定义 activity 处于 PiP 模式时可以在 PiP 窗口内执行的操作。本章稍后将详细介绍操作。\n- `setAspectRatio()`\
  \ – 声明 PiP 窗口外观的首选宽高比。该方法接收一个包含高与宽之比例的 `Rational` 对象作为参数。\n- `setSourceRectHint()`\
  \ – 接收一个 `Rect` 对象作为参数，定义在 PiP 窗口内显示的 activity 屏幕区域。\n\n例如，以下代码在 `PictureInPictureParams`\
  \ 对象中配置了宽高比和操作参数。在宽高比方面，它是使用 `VideoView` 实例的宽度和高度维度定义的：\n\n```\nRational rational\
  \ = new Rational(videoView.getWidth(), videoView.getHeight());\nPictureInPictureParams\
  \ params = new PictureInPictureParams.Builder()\n    .setAspectRatio(rational)\n\
  \    .setActions(actions)\n    .build();\n```\n\n一旦定义，可以使用如下 `setPictureInPictureParams()`\
  \ 方法随时设置 PiP 参数：\n\n```\nsetPictureInPictureParams(params);\n```\n\n在进入 PiP 模式时也可以指定参数。\n\
  \n## 82.4 进入画中画模式\n\n通过调用 `enterPictureInPictureMode()` 方法并传递 `PictureInPictureParams`\
  \ 对象，可以将 activity 进入画中画模式：\n\n```\nenterPictureInPictureMode(params);\n```\n\n如果不需要参数，请按照上一节所述创建一个默认的\
  \ `PictureInPictureParams` 实例。如果之前已使用 `setPictureInPictureParams()` 方法设置了参数，则这些参数将与\
  \ `enterPictureInPictureMode()` 方法调用时指定的参数合并使用。\n\n## 82.5 检测画中画模式变化\n\n当 activity\
  \ 进入 PiP 模式时，隐藏不必要的视图非常重要，这样 PiP 窗口内只显示视频播放。当 activity 重新进入全屏模式时，必须恢复隐藏的用户界面组件。可以通过重写\
  \ `onPictureInPictureModeChanged()` 方法来执行这些以及其他应用特定的任务。当将此方法添加到 activity 时，每次 activity\
  \ 在 PiP 和全屏模式之间切换时都会调用该方法，并传递一个指示是否处于 PiP 模式的布尔值：\n\n```java\n@Override\npublic\
  \ void onPictureInPictureModeChanged(boolean isInPictureMode) {\n    super.onPictureInPictureModeChanged(isInPictureMode);\n\
  \    if (isInPictureMode) {\n        // 进入画中画模式\n    } else {\n        // 进入全屏模式\n\
  \    }\n}\n```\n\n## 82.6 添加画中画操作\n\n画中画操作在用户点击 PiP 窗口时会以图标形式显示。实现画中画操作是一个多步过程，起步是实现一种让\
  \ PiP 窗口通知应用已选择操作的方法。这通过在应用内部设置广播接收器（broadcast receiver），然后在 PiP 操作中创建一个等待意图（pending\
  \ intent），该意图被配置为广播接收器正在监听。当意图触发广播接收器时，意图中存储的数据可用于识别执行的操作并在应用内采取相应行动。\n\n画中画操作使用\
  \ `RemoteAction` 实例声明，并使用图标、标题、描述和 `PendingIntent` 对象进行初始化。一旦创建了一个或多个操作，将它们添加到 `ArrayList`\
  \ 中并在构建 `PictureInPictureParams` 对象时通过 `setActions()` 方法传递。\n\n以下代码片段演示了 `Intent`、`PendingIntent`\
  \ 和 `RemoteAction` 对象的创建，并将其应用于应用的 PiP 设置中：\n\n```java\nfinal ArrayList actions\
  \ = new ArrayList<>();\nIntent actionIntent = new Intent(\"MY_PIP_ACTION\");\nfinal\
  \ PendingIntent pendingIntent = PendingIntent.getBroadcast(MyActivity.this, REQUEST_CODE,\
  \ actionIntent, FLAG_IMMUTABLE);\nfinal Icon icon = Icon.createWithResource(MyActivity.this,\
  \ R.drawable.action_icon);\nRemoteAction remoteAction = new RemoteAction(icon, \"\
  My Action Title\", \"My Action Description\", pendingIntent);\n\nactions.add(remoteAction);\n\
  PictureInPictureParams params = new PictureInPictureParams.Builder()\n    .setActions(actions)\n\
  \    .build();\n\nsetPictureInPictureParams(params);\n```\n\n## 82.7 总结\n\n\n\n\n\
  \n画中画（Picture-in-Picture mode）是 Android 8.0 引入的一项多任务功能，专门用于允许用户在执行其他应用任务和活动的同时，在小窗口继续播放视频。在使用\
  \ PiP 模式之前，必须先在清单文件中为需要 PiP 支持的 activity 启用它。\n\nPiP 模式的行为通过 `PictureInPictureParams`\
  \ 类的实例进行配置，并在 activity 内部通过调用 `enterPictureInPictureMode()` 方法启动。在 PiP 模式下，应仅显示视频播放，这要求在选择全屏模式之前隐藏任何其他用户界面元素。这些以及其他与模式切换相关的任务可以通过重写\
  \ `onPictureInPictureModeChanged()` 方法来完成。\n\n当用户点击 PiP 窗口时，PiP 操作将以叠加在 PiP 窗口上的图标形式出现。选中这些操作后会触发\
  \ activity 内部的行为。PiP 窗口使用广播接收器和等待意图（pending intents）来通知 activity。\n\n# 83. Android\
  \ 画中画教程\n\n延续前面的章节，本章将对现有的 `VideoPlayer` 项目进行增强，以添加画中画支持，包括检测 PiP 模式变化以及添加一个用于显示当前正在运行视频信息的\
  \ PiP 操作。\n\n## 83.1 在清单文件中添加画中画支持\n\n在 Android 应用项目中添加 PiP 支持的第一步是在项目的 Manifest\
  \ 文件中启用它。打开 `manifests -> AndroidManifest.xml` 文件并修改 `activity` 元素以启用 PiP 支持：\n\n\
  ```xml\nandroid:name=\".MainActivity\"\nandroid:supportsPictureInPicture=\"true\"\
  \nandroid:configChanges=\"screenSize|smallestScreenSize|screenLayout|orientation\"\
  \nandroid:exported=\"true\">\n```\n\n## 83.2 添加画中画按钮\n\n按照目前的设计，`VideoPlayer` activity\
  \ 的布局仅包含一个 `VideoView` 实例。现在将向布局中添加一个按钮以切换到 PiP 模式。将 `activity_main.xml` 文件加载到布局编辑器中，从调色板拖入一个\
  \ `Button` 对象到布局中，使其位置如图 83-1 所示：\n\n![image-NOEZJJC3.jpg](img/image-NOEZJJC3.jpeg)\n\
  \n图 83-1\n\n将按钮上的文本更改为“Enter PiP Mode”，并将字符串提取到名为 `enter_pip_mode` 的资源中。在继续下一步之前，将按钮的\
  \ ID 更改为 `pipButton` 并配置 `onClick` 属性以调用名为 `enterPipMode` 的方法。\n\n## 83.3 进入画中画模式\n\
  \n现在必须将 `enterPipMode` onClick 回调方法添加到 `MainActivity.java` 类文件中。找到该文件，在代码编辑器中打开它，并如下如下添加此方法：\n\
  \n```java\nimport android.app.PictureInPictureParams;\nimport android.util.Rational;\n\
  \npublic void enterPipMode(View view) {\n    Rational rational = new Rational(binding.videoView1.getWidth(),\n\
  \    binding.videoView1.getHeight());\n    PictureInPictureParams params =\n   \
  \     new PictureInPictureParams.Builder()\n            .setAspectRatio(rational)\n\
  \            .build();\n    binding.pipButton.setVisibility(View.INVISIBLE);\n \
  \   binding.videoView1.setMediaController(null);\n    enterPictureInPictureMode(params);\n\
  }\n```\n\n该方法首先获取 `Button` 视图的引用，然后创建一个包含 `VideoView` 宽度和高度的 `Rational` 对象。接着，使用\
  \ `PictureInPictureParams.Builder` 创建一组画中画参数，并将 `Rational` 对象作为视频播放的宽高比例传递。由于由于在视频处于\
  \ PiP 模式时不需要显示按钮，因此将其设置为不可见。视频播放控制控件也被隐藏了，因此视频视图在 PiP 模式下将不会受到任何遮挡。\n\n在运行 Android\
  \ 版本 8 或更高版本的设备或模拟器上编译并运行应用，在点击 PiP 模式按钮之前等待视频开始播放。视频播放将最小化并显示在 PiP 窗口中，如图 83-2\
  \ 所示：\n\n![image-V9CD9TAI.jpg](img/image-V9CD9TAI.jpeg)\n\n图 83-2\n\n点击 PiP 窗口，然后点击窗口中心出现的全屏模式标记。尽管\
  \ activity 回到了全屏模式，但按钮和媒体播放控制控件仍保持隐藏状态。\n\n显然，必须向项目中添加一些代码来检测 activity 内部何时发生 PiP\
  \ 模式的切换。\n\n## 83.4 检测画中画模式变化\n\n如在前一节所述，PiP 模式的变化是通过重写受影响 activity 的 `onPictureInPictureModeChanged()`\
  \ 方法检测的。在这种情况下，必须编写该方法来检测 activity 是正在进入还是退出 PiP 模式，并采取适当行动重新激活 PiP 按钮和播放控件。留在 `MainActivity.java`\
  \ 文件中，现在添加此方法：\n\n```java\n@Override\npublic void onPictureInPictureModeChanged(boolean\
  \ isInPictureInPictureMode) {\n    super.onPictureInPictureModeChanged(isInPictureInPictureMode);\n\
  \    if (isInPictureInPictureMode) {\n    } else {\n        binding.pipButton.setVisibility(View.VISIBLE);\n\
  \        binding.videoView1.setMediaController(mediaController);\n    }\n}\n```\n\
  \n当调用该方法时，会传递一个 `Boolean` 值，表示 activity 现在是否处于 PiP 模式。上述方法中的代码检查此值，以决定是否显示 PiP 按钮并恢复播放控件。\n\
  \n## 83.5 添加广播接收器\n\n项目的最后一步是为 PiP 窗口添加一个操作。该操作目的是显示包含当前播放视频名称 `Toast` 消息。这需要 PiP\
  \ 窗口与 activity 之间的某些通信。实现此目标的最简单方法是在 activity 内部实现广播接收器，并使用等待意图（pending intent）从\
  \ PiP 窗口通知 activity。每次 activity 进入 PiP 模式时都要执行这些步骤，因此必须在 `onPictureInPictureModeChanged()`\
  \ 方法中添加代码。现在找到该方法并开始添加代码创建意图过滤器并初始化广播接收器：\n\n```java\nimport android.content.BroadcastReceiver;\n\
  import android.content.Context;\nimport android.content.Intent;\nimport android.content.IntentFilter;\n\
  import android.widget.Toast;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private BroadcastReceiver receiver;\n\n    @Override\n    public void onPictureInPictureModeChanged(boolean\
  \ isInPictureInPictureMode) {\n        super.onPictureInPictureModeChanged(isInPictureInPictureMode);\n\
  \        if (isInPictureInPictureMode) {\n            IntentFilter filter = new\
  \ IntentFilter();\n            filter.addAction(\"com.ebookrenzy.videoplayer.VIDEO_INFO\"\
  );\n            receiver = new BroadcastReceiver() {\n                @Override\n\
  \                public void onReceive(Context context, Intent intent) {\n     \
  \               Toast.makeText(context, \"Favorite Movie Clips\", Toast.LENGTH_LONG).show();\n\
  \                }\n            };\n            registerReceiver(receiver, filter,\
  \ Context.RECEIVER_EXPORTED);\n        } else {\n            binding.pipButton.setVisibility(View.VISIBLE);\n\
  \            binding.videoView1.setMediaController(mediaController);\n         \
  \   if (receiver != null) {\n                unregisterReceiver(receiver);\n   \
  \         }\n        }\n    }\n}\n```\n\n## 83.6 添加 PiP 操作\n\n实现广播接收器后，下一步是创建一个\
  \ `RemoteAction` 对象，并配置图像以表示 PiP 窗口中的操作。\n\n对于本示例，将使用名为 `ic_info_24dp.xml` 的图像图标文件。该文件可以在从以下\
  \ URL 下载的源码包的 `project_icons` 文件夹找到：\n\n`https://www.payloadbooks.com/product/ladybugjava`\n\
  \n找到此图标文件，将其复制并粘贴到项目工具窗口 `app -> res -> drawables` 文件夹中：\n\n![image-5JM5MPM9.jpg](img/image-5JM5MPM9.jpeg)\n\
  \n图 83-3\n\n\n\n\n下一步是创建一个将发送到广播接收器（broadcast receiver）的 `Intent`。该 intent 然后需要封装在一个\
  \ `PendingIntent` 对象中，以便在用户点击画中画（PiP）窗口中的操作按钮时触发该 intent。\n\n编辑 `MainActivity.java`\
  \ 文件，添加如下所示的方法来创建 `Intent` 和 `PendingIntent` 对象：\n\n```java\nimport android.app.PendingIntent;\n\
  import static android.app.PendingIntent.FLAG_IMMUTABLE;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private static final int REQUEST_CODE = 101;\n\
  \n    private void createPipAction() {\n        Intent actionIntent = new Intent(\"\
  com.ebookfrenzy.videoplayer.VIDEO_INFO\");\n        final PendingIntent pendingIntent\
  \ = PendingIntent.getBroadcast(\n            MainActivity.this,\n            REQUEST_CODE,\
  \ actionIntent, FLAG_IMMUTABLE);\n    }\n}\n```\n\n### 现在 `Intent` 对象和包含它的 `PendingIntent`\
  \ 实例都已创建，需要创建一个 `RemoteAction` 对象，其中包含显示在 PiP 窗口中的图标。在 `createPipAction()` 方法中，按照如下代码添加内容：\n\
  \n```java\nimport android.app.RemoteAction;\nimport android.graphics.drawable.Icon;\n\
  import java.util.ArrayList;\n\nprivate void createPipAction() {\n    final ArrayList\
  \ actions = new ArrayList<>();\n    Intent actionIntent = new Intent(\"com.ebookfrenzy.videoplayer.VIDEO_INFO\"\
  );\n    final PendingIntent pendingIntent = PendingIntent.getBroadcast(\n      \
  \  MainActivity.this,\n        REQUEST_CODE, actionIntent, FLAG_IMMUTABLE);\n  \
  \  final Icon icon = Icon.createWithResource(\n        MainActivity.this,\n    \
  \    R.drawable.ic_info_24dp);\n    RemoteAction remoteAction = new RemoteAction(icon,\
  \ \"Info\",\n        \"Video Info\", pendingIntent);\n    actions.add(remoteAction);\n\
  }\n```\n\n现在需要创建一个包含操作的 `PictureInPictureParams` 对象并应用参数，以便该操作显示在 PiP 窗口中：\n\n```java\n\
  private void createPipAction() {\n    final ArrayList actions = new ArrayList<>();\n\
  \    Intent actionIntent = new Intent(\"com.ebookfrenzy.videoplayer.VIDEO_INFO\"\
  );\n    final PendingIntent pendingIntent = PendingIntent.getBroadcast(\n      \
  \  MainActivity.this,\n        REQUEST_CODE, actionIntent, FLAG_IMMUTABLE);\n  \
  \  final Icon icon = Icon.createWithResource(\n        MainActivity.this,\n    \
  \    R.drawable.ic_info_24dp);\n    RemoteAction remoteAction = new RemoteAction(icon,\
  \ \"Info\",\n        \"Video Info\", pendingIntent);\n    actions.add(remoteAction);\n\
  \    PictureInPictureParams params = new PictureInPictureParams.Builder()\n    \
  \    .setActions(actions)\n        .build();\n    setPictureInPictureParams(params);\n\
  }\n```\n\n在测试操作之前的最后一个任务是在 activity 进入 PiP 模式时调用 `createPipAction()` 方法：\n\n```java\n\
  @Override\npublic void onPictureInPictureModeChanged(boolean isInPictureInPictureMode)\
  \ {\n    super.onPictureInPictureModeChanged(isInPictureInPictureMode);\n    if\
  \ (isInPictureInPictureMode) {\n        registerReceiver(receiver, filter);\n  \
  \      createPipAction();\n    } else {\n        binding.pipButton.setVisibility(View.VISIBLE);\n\
  \        binding.videoView1.setMediaController(mediaController);\n    }\n}\n```\n\
  \n## 83.7 测试画中画操作\n\n重新运行应用并将 activity 置于 PiP 模式。点击 PiP 窗口，使新的操作按钮出现，如图 83-4 所示：\n\
  \n![image-FN88GGQ0.jpg](img/image-FN88GGQ0.jpeg)\n图 83-4\n\n点击操作按钮并等待 `Toast` 消息出现，显示视频名称：\n\
  \n![image-UN72Y66H.jpg](img/image-UN72Y66H.jpeg)\n图 83-5\n\n## 83.8 总结\n\n本章演示了如何在\
  \ Android Studio 应用项目中添加画中画支持，包括启用和进入 PiP 模式以及实现 PiP 操作。这包含了使用广播接收器和等待意图（pending\
  \ intents）来实现 PiP 窗口与 activity 之间的通信。\n\n## 84. 使用 MediaPlayer 和 MediaRecorder 进行\
  \ Android 音频录制和播放\n\n本章将提供 `MediaRecorder` 类的概述并解释如何使用该类录制音频或视频。还将涵盖使用 `MediaPlayer`\
  \ 类播放音频的内容。在介绍基础知识后，将创建一个示例应用程序来演示这些技术。除了处理音频和视频外，本章还将涉及将文件保存到 SD 卡。\n\n## 84.1\
  \ 播放音频\n\n在音频播放方面，大多数 Android 实现支持 AAC LC/LTP, HE-AACv1 (AAC+), HE-AACv2 (enhanced\
  \ AAC+), AMR-NB, AMR-WB, MP3, MIDI, Ogg Vorbis 和 PCM/WAVE 格式。\n\n可以使用 `MediaPlayer`\
  \ 或 `AudioTrack` 类执行音频播放。`AudioTrack` 是更高级的选项，它使用流媒体缓冲区并对音频提供更大的控制。相反，`MediaPlayer`\
  \ 类提供了一个更简单的编程接口来实现音频播放，能够满足大多数音频需求。\n\n`MediaPlayer` 类关联有一系列可供应用程序调用以执行任务的方法。该类的一些关键方法如下：\n\
  \n- `create()` – 创建类的新实例，传递要播放的音频 Uri。\n- `setDataSource()` – 设置音频的源。\n- `prepare()`\
  \ – 通知播放器准备开始播放。\n- `start()` – 开始播放。\n- `pause()` – 暂停播放。播放可以通过调用 `resume()` 恢复。\n\
  - `stop()` – 停止播放。\n- `setVolume()` – 指定左右通道音量的浮点参数。\n- `resume()` – 恢复之前暂停的会话。\n\
  - `reset()` – 重置媒体播放器。本质上是将实例置回初始化状态。至少，重置的播放器需要设置数据源并调用 `prepare()` 方法。\n- `release()`\
  \ – 当播放器不再需要时调用。此方法确保释放播放器持资源。\n\n在典型的实现中，应用程序将实例化 `MediaPlayer` 类，设置音频源，然后调用 `prepare()`\
  \ 和 `start()`。例如：\n\n```java\nMediaPlayer mediaPlayer = new MediaPlayer();\nmediaPlayer.setDataSource(\"\
  https://www.yourcompany.com/yaudio.mp3\");\nmediaPlayer.prepare();\nmediaPlayer.start();\n\
  ```\n\n## 84.2 使用 MediaRecorder 类录制音频和视频\n\n与音频播放一样，录制可以使用不同的技术。一种选择是使用 `MediaRecorder`\
  \ 类，它与 `MediaPlayer` 类的方法如下：\n\n- `setAudioSource()` – 指定要录制的音频源（通常将是 `MediaRecorder.AudioSource.MIC`）。\n\
  - `setVideoSource()` – 指定要录制的视频的源（例如 `MediaRecorder.VideoSource.CAMERA`）。\n- `setOutputFormat()`\
  \ – 指定录制的音频或视频要存储的格式（例如 `MediaRecorder.OutputFormat.AAC_ADTS`）。\n- `setAudioEncoder()`\
  \ – 指定录制音频的音频编码器（例如 `MediaRecorder.AudioEncoder.AAC`）。\n- `setOutputFile()` – 配置存储录制的音频或视频的文件路径。\n\
  - `prepare()` – 准备 `MediaRecorder` 实例以开始录制。\n- `start()` – 开始录制过程。\n- `stop()` –\
  \ 停止录制过程。一旦录制机停止，在重新启动之前必须重新配置并准备。\n- `reset()` – 重置录制机。实例在重启之前需要完全重新配置并准备。\n- `release()`\
  \ – 在录制机实例不再需要时调用。此方法确保释放实例持有的所有资源。\n\n\n\n使用此类的典型实现将设置源、输出、编码格式和输出文件。随后将调用 `prepare()`\
  \ 和 `start()` 方法。录制结束时将调用 `stop()` 方法，然后调用 `reset()` 方法。当应用程序不再需要该录制器实例时，建议调用 `release()`\
  \ 方法：\n\n```java\nMediaRecorder mediaRecorder = new MediaRecorder();\nmediaRecorder.setAudioSource(MediaRecorder.AudioSource.MIC);\n\
  mediaRecorder.setOutputFormat(MediaRecorder.OutputFormat.AAC_ADTS);\nmediaRecorder.setAudioEncoder(MediaRecorder.AudioEncoder.AAC);\n\
  mediaRecorder.setOutputFile(audioFilePath);\nmediaRecorder.prepare();\nmediaRecorder.start();\n\
  \nmediaRecorder.stop();\nmediaRecorder.reset();\nmediaRecorder.release();\n```\n\
  \n要录制音频，应用程序清单文件（manifest）必须包含 `android.permission.RECORD_AUDIO` 权限：\n\n正如名为“在 Android\
  \ 中请求运行时权限”的章节所述，访问麦克风属于危险权限类别。因此，为了支持 Android 6，在应用程序启动时必须对麦克风访问进行特定请求，相关步骤将在本章稍后介绍。\n\
  \n## 84.3 关于示例项目\n\n本章的剩余部分将创建一个示例应用程序，用于演示使用 `MediaPlayer` 和 `MediaRecorder` 类在\
  \ Android 设备上实现音频的录制和播放。\n\n在开发使用特定硬件功能的应用程序时（麦克风就是一个例子），在尝试代码尝试访问该功能之前检查该功能的可用性至关重要。因此，本章创建的应用程序还将包含检测设备是否存在麦克风的代码。\n\
  \n完成后，该应用程序将提供一个简单的界面，允许用户录制和播放音频。录制的音频将存储在设备上的一个音频文件内。既然如此，本教程还将简要探索使用 SD 卡存储的机制。\n\
  \n## 84.4 创建 AudioApp 项目\n\n从欢迎屏幕选择 New Project（新建项目），在弹出的新项目对话框中，选择 Empty Views\
  \ Activity 模板，然后点击 Next（下一步）按钮。\n\n在 `Name` 字段中输入 `AudioApp`，并指定 `com.ebookfrenzy.audioapp`\
  \ 为包名。在点击 Finish（完成）按钮之前，将 Minimum API level 设置为 `API 31`: Android 12.0，并将 Language（语言）菜单设置为\
  \ Java。使用第 12.8 节 Migrating a Project to View Binding 中概述步骤为项目添加 view binding 支持。\n\
  \n## 84.5 设计用户界面\n\n创建新项目后，从 Project 工具窗口选择 `activity_main.xml` 文件，并在 Design（设计）模式下的\
  \ Layout Editor 工具中，选择“Hello World!” `TextView` 并将其从布局中删除。\n\n将三个 `Button` 视图拖放到布局中。按钮的位置对于本示例来说并不至关重要，但图\
  \ 84-1 显示了使用垂直链（vertical chain）的建议布局。\n\n配置按钮以显示读取 Play（播放）、Record（录制）和 Stop（停止）的字符串资源，并分别为它们赋予视图\
  \ ID：`playButton`、`recordButton` 和 `stopButton`。\n\n选择 Play 按钮，并在 Attributes（属性）面板中，配置\
  \ `onClick` 属性以便在用户选择时调用名为 `playAudio` 的方法。重复这些步骤配置其余按钮分别调用名为 `recordAudio` 和 `stopAudio`\
  \ 的方法。\n\n![image-1JF09E5B.jpg](img/image-1JF09E5B.jpeg)\n\n图 84-1\n\n## 84.6 检查麦克风可用性\n\
  \n在没有麦克风的设备上尝试录制音频会导致 Android 系统抛出异常。因此，在进行此类尝试之前检查麦克风的存在至关重要。有几种方法可以实现，包括检查设备的物理是否存在。另一种简单且可能在不同\
  \ Android 设备上生效的方法是询问 Android 系统是否安装了针对特定功能的包。这涉及创建一个 `PackageManager` 类的实例，然后调用对象的\
  \ `hasSystemFeature()` 方法。在本例中，`PackageManager.FEATURE_MICROPHONE` 是我们关注的功能。\n\n\
  对于此示例，我们将创建一个名为 `hasMicrophone()` 的方法，可以调用它来检查麦克风的存在。在 Project 工具窗口中，找到并双击 `MainActivity.java`\
  \ 文件，并修改以添加此方法：\n\n```java\npackage com.ebookfrenzy.audioapp;\n\nimport android.content.pm.PackageManager;\n\
  \npublic class MainActivity extends AppCompatActivity {\n\n    protected boolean\
  \ hasMicrophone() {\n        PackageManager pmanager = this.getPackageManager();\n\
  \        return pmanager.hasSystemFeature(\n            PackageManager.FEATURE_MICROPHONE);\n\
  \    }\n}\n```\n\n## 84.7 初始化 Activity\n\n下一步是修改 activity 以执行几项初始化任务。留在 `MainActivity.java`\
  \ 文件中，修改代码如下：\n\n```java\npackage com.ebookfrenzy.audioapp;\n\nimport java.io.File;\n\
  import java.io.IOException;\nimport androidx.annotation.NonNull;\nimport android.media.MediaRecorder;\n\
  import android.os.Environment;\nimport android.media.MediaPlayer;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n    private ActivityMainBinding binding;\n\
  \    private static MediaRecorder mediaRecorder;\n    private static MediaPlayer\
  \ mediaPlayer;\n    private static String audioFilePath;\n    private boolean isRecording\
  \ = false;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        audioSetup();\n    }\n\
  \n    private void audioSetup()\n    {\n        if (!hasMicrophone()) {\n      \
  \      binding.stopButton.setEnabled(false);\n            binding.playButton.setEnabled(false);\n\
  \            binding.recordButton.setEnabled(false);\n        } else {\n       \
  \     binding.playButton.setEnabled(false);\n            binding.stopButton.setEnabled(false);\n\
  \        }\n        File audioFile = new File(this.getFilesDir(), \"myaudio.3gp\"\
  );\n        audioFilePath = audioFile.getAbsolutePath();\n    }\n}\n```\n\n添加的代码调用\
  \ `hasMicrophone()` 方法来确定设备是否包含麦克风。如果没有，则禁用所有按钮；否则，仅禁用停止和播放按钮。\n\n下一行代码需要一点解释：\n\
  \n`File audioFile = new File(this.getFilesDir(), \"myaudio.3gp\");`\n`audioFilePath\
  \ = audioFile.getAbsolutePath();`\n\n此代码在应用程序的内部存储中创建一个名为 `myaudio.3gp` 的新文件以存储录音。\n\
  \n## 84.8 实现 recordAudio() 方法\n\n当用户触摸录制按钮时将调用 `recordAudio()` 方法。该方法需要开启相应的按钮并配置\
  \ `MediaRecorder` 实例所需的音频源、输出格式编码以及存储音频的位置。最后，需要调用 `MediaRecorder` 对象的 `prepare()`\
  \ 和 `start()` 方法。这些需求共同在 `MainActivity.java` 文件中形成了以下方法实现：\n\n```java\npublic void\
  \ recordAudio (View view) {\n    isRecording = true;\n    binding.stopButton.setEnabled(true);\n\
  \    binding.playButton.setEnabled(false);\n    binding.recordButton.setEnabled(false);\n\
  \    try {\n        mediaRecorder = new MediaRecorder(this);\n        mediaRecorder.setAudioSource(MediaRecorder.AudioSource.MIC);\n\
  \        mediaRecorder.setOutputFormat(MediaRecorder.OutputFormat.THREE_GPP);\n\
  \        mediaRecorder.setOutputFile(audioFilePath);\n        mediaRecorder.setAudioEncoder(MediaRecorder.AudioEncoder.AMR_NB);\n\
  \        mediaRecorder.prepare();\n    } catch (Exception e) {\n        e.printStackTrace();\n\
  \    }\n    mediaRecorder.start();\n}\n```\n\n## 84.9 实现 stopAudio() 方法\n\n\n\n\n\
  \n`stopAudio()` 方法会启用 `Play` 按钮，关闭 `Stop` 按钮，然后停止并重置 `MediaRecorder` 实例。实现此功能的代码如下列表所示，并应将其添加到\
  \ `MainActivity.java` 文件中：\n\n```java\npublic void stopAudio (View view)\n{\n  \
  \  binding.stopButton.setEnabled(false);\n    binding.playButton.setEnabled(true);\n\
  \n    if (isRecording)\n    {\n        binding.recordButton.setEnabled(false);\n\
  \        mediaRecorder.stop();\n        mediaRecorder.release();\n        mediaRecorder\
  \ = null;\n        isRecording = false;\n    } else {\n        mediaPlayer.release();\n\
  \        mediaPlayer = null;\n        binding.recordButton.setEnabled(true);\n \
  \   }\n}\n```\n\n## 84.10 实现 `playAudio()` 方法\n\n`playAudio()` 方法将创建一个新的 `MediaPlayer`\
  \ 实例，将位于 SD 卡上的音频文件指定为数据源，然后准备并开始播放：\n\n```java\npublic void playAudio (View view)\
  \ throws IOException\n{\n    binding.playButton.setEnabled(false);\n    binding.recordButton.setEnabled(false);\n\
  \    binding.stopButton.setEnabled(true);\n    mediaPlayer = new MediaPlayer();\n\
  \    mediaPlayer.setDataSource(audioFilePath);\n    mediaPlayer.prepare();\n   \
  \ mediaPlayer.start();\n}\n```\n\n## 84.11 配置和请求权限\n\n在测试应用程序之前，必须在清单文件中为应用程序请求适当的权限。具体而言，应用程序将需要访问麦克风的权限。在\
  \ `Project` 工具窗口中，找到并双击 `AndroidManifest.xml` 文件以将其加载到编辑器中，并修改 XML 以添加权限标签：\n\n\
  ```xml\nxmlns:tools=\"http://schemas.android.com/tools\">\n.\n.\n```\n\n上述步骤足以确保当应用安装在运行\
  \ Android 6.0 之前的版本的设备上时，用户能够启用麦克风访问权限。在 Android 中，麦克风访问被归类为“危险权限”，因为它允许应用程序可能损害用户的隐私。为了让示例应用在\
  \ Android 6 或更高版本的设备上运行，需要添加代码以在应用运行时请求权限。\n\n编辑 `MainActivity.java` 文件，首先添加一些额外的导入指令和一个常量，作为所请求权限的请求标识代码：\n\
  \n```java\n.\n.\nimport androidx.core.app.ActivityCompat;\nimport androidx.core.content.ContextCompat;\n\
  import android.widget.Toast;\nimport android.Manifest;\n.\n.\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private static final int RECORD_REQUEST_CODE\
  \ = 101;\n.\n.\n```\n\n接下来，需要向类中添加一个方法，其目的是接收要请求的权限和相应的请求标识代码作为参数。在 `MainActivity.java`\
  \ 类文件中，按照 own 实现此方法：\n\n```java\nprotected void requestPermission(String permissionType,\
  \ int requestCode) {\n    int permission = ContextCompat.checkSelfPermission(this,\n\
  \    permissionType);\n    if (permission != PackageManager.PERMISSION_GRANTED)\
  \ {\n        ActivityCompat.requestPermissions(this,\n        new String[]{permissionType},\
  \ requestCode\n        );\n    }\n}\n```\n\n使用此书中“在 Android 中进行运行时权限请求”章节中概述的步骤，上述方法会在发出请求之前验证指定的权限是否已经授予，并将标识代码作为参数传递。\n\
  \n当请求被处理后，活动将调用 `onRequestPermissionsResult()` 方法，并传递标识代码和请求结果。因此，下一步是在 `MainActivity.java`\
  \ 文件中按所示实现此方法：\n\n```java\n@Override\npublic void onRequestPermissionsResult(int\
  \ requestCode,\n@NonNull String[] permissions, @NonNull int[] grantResults) {\n\
  \    super.onRequestPermissionsResult(requestCode, permissions, grantResults);\n\
  \    if (requestCode == RECORD_REQUEST_CODE) {\n        if (grantResults.length\
  \ == 0\n        || grantResults[0] !=\n        PackageManager.PERMISSION_GRANTED)\
  \ {\n            binding.recordButton.setEnabled(false);\n            Toast.makeText(this,\n\
  \            \"Record permission required\",\n            Toast.LENGTH_LONG).show();\n\
  \        }\n    }\n}\n```\n\n上述代码通过检查请求标识代码来识别是哪个权限请求返回的，然后再检查相应的权限是否已授予。如果权限被拒绝，将向用户显示一条消息，指示应用将无法运行且录音按钮将被禁用。\n\
  \n在测试应用之前，剩下的工作是在应用启动时调用新添加的 `requestPermission()` 方法来请求麦克风访问。在 `MainActivity.java`\
  \ 文件中，按所示修改 `audioSetup()` 方法：\n\n```java\nprivate void audioSetup(){\n    binding.recordButton\
  \ = findViewById(R.id.recordButton);\n    binding.playButton = findViewById(R.id.playButton);\n\
  \    binding.stopButton = findViewById(R.id.stopButton);\n    if (!hasMicrophone())\n\
  \    {\n        stopButton.setEnabled(false);\n        playButton.setEnabled(false);\n\
  \        recordButton.setEnabled(false);\n    } else {\n        playButton.setEnabled(false);\n\
  \        stopButton.setEnabled(false);\n    }\n    File audioFile = new File(this.getFilesDir(),\
  \ \"myaudio.3gp\");\n    audioFilePath = audioFile.getAbsolutePath();\n    requestPermission(Manifest.permission.RECORD_AUDIO,\n\
  \    RECORD_REQUEST_CODE);\n}\n```\n\n## 84.12 测试应用程序\n\n在带有麦克风的 Android 设备上编译并运行应用，允许麦克风访问，并点击\
  \ Record 按钮。录音完成后，点击 Stop 然后 Play。此时，音频应通过设备扬声器播放。\n\n## 84.13 总结\n\nAndroid SDK\
  \ 提供了实现音频录制和播放的机制。本章介绍了其中的两种：`MediaPlayer` 和 `MediaRecorder` 类。在涵盖了这些技术的理论后，本章通过创建一个用于录制和播放的示例应用程序。在\
  \ Android 中处理音频时，本章还查看了确保设备具有麦克风的步骤。\n\n## 85. 在 Android Studio 中使用 Google Maps\
  \ API\n\n当 Google 多年前推出地图服务时，很难判断他们是否曾预见到会有可以集成到应用程序中的版本。当后来 Google Maps 的第一个网页版本推出时，iPhone\
  \ 尚未引发智能手机革命，Google 在六个月后才收购开发 Android 操作系统的公司。无论 Google 对 Google Maps 的未来有什么愿景，现在可以通过\
  \ Google Maps Android API 直接在 Android 中访问访问。\n\n本章旨在概述 Google Maps 系统和 Google Maps\
  \ Android API。本章将提供组成 API 的元素的概述，详细说明配置 Google Maps 开发环境所需的步骤，然后通过一些代码示例演示 Google\
  \ Maps 集成的基础知识。\n\n## 85.1 Google Maps API 的元素\n\nGoogle Maps Android API 由一组核心类组成，为\
  \ Android 应用程序提供地图功能。地图的关键元素如下：\n\n•GoogleMap – Google Maps Android API 的主类。该类负责下载和显示地图瓦片，并显示和响应地图控件。`GoogleMap`\
  \ 对象不是由应用程序直接创建的，而是在创建 `MapView` 或 `MapFragment` 实例时创建的。可以通过调用 `MapView`、`MapFragment`\
  \ 或 `SupportMapFragment` 实例的 `getMap()` 方法来获取 `GoogleMap` 对象的引用。\n\n\n\n\n\n- `MapView`\
  \ - 这是 `View` 类的子类，该类提供了一个视图画布，`GoogleMap` 对象在其上方绘制地图，允许将地图放置在 activity 的用户界面布局中。\n\
  - `SupportMapFragment` – `Fragment` 类的子类，该类允许将地图放置在 Android 布局中的 `Fragment` 中。\n\
  - `Marker` – `Marker` 类的目的是允许在地图上标记位置。通过获取与地图相关的 `GoogleMap` 对象引用，然后调用该对象实例的 `addMarker()`\
  \ 方法，可以将标记添加到地图上。标记的位置通过 `Longitude`（经度）和 `Latitude`（纬度）定义。标记可以通过多种方式进行配置，包括指定标题、文本和图标。标记还也可以是“可拖拽”的，允许用户将标记移动到地图上的不同位置。\n\
  - `Shapes` – 使用 `Polyline`、`Polygon` 和 `Circle` 类在地图上绘制线条和形状。\n- `UiSettings` –\
  \ `UiSettings` 类用于自定义地图上显示的控制控件。例如，使用 `UiSettings`，应用程序可以控制地图上是否显示缩放、当前位置和罗盘控件。该类还可以配置地图识别哪些触摸屏手势。\n\
  - `My Location Layer` – 启用后，“我的位置层”会在地图上显示一个按钮，当用户选择该按钮时，地图将中心化到用户的当前地理位置。如果用户处于静止状态，蓝色标记将代表地图上的此位置。如果用户正在移动，位置将由一个指示用户行驶方向的箭头（chevron）表示。\n\
  \n熟悉 Google Maps Android API 的最佳方法是运行示例。本章的剩余部分将创建一个基于 Google Maps 的应用程序，同时重点介绍\
  \ API 的关键领域。\n\n## 85.2 创建 Google Maps 项目\n\n从欢迎界面选择`New Project`（新建项目）选项，在生成的新项目对话框中点击`Next`（下一步）按钮之前，选择`No\
  \ Activity` 模板。\n\n在 `Name` 字段中输入 `MapDemo`，并指定 `com.ebookfrenzy.mapdemo` 为包名。在点击`Finish`\
  \ 之前，将`Minimum API level`（最低 API 级别）设置改为 `API 26`：Android 8.0 (Oreo)，并将`Language`（语言）菜单设置为\
  \ `Java`。\n\n接下来，在 Project 工具窗口中右键点击 `app` -> `java` -> `com.ebookfrenzy.mapdemo`\
  \ 项，选择 `New -> Google -> Google Maps Views Activity` 菜单选项。最后，在点击`Finish` 按钮之前，在\
  \ `New Android Activity` 对话框中启用`Launcher Activity` 复选框：\n\n![image-Z0Q7SROX.jpg](img/image-Z0Q7SROX.jpeg)\n\
  \n图 85-1\n\n## 85.3 创建 Google Cloud 结算账户\n\n在使用 Google Map APIs 之前，您必须先创建一个 Google\
  \ Cloud 结算账户（如果您已经有一个，可以跳到下一节）。要执行此操作，打开浏览器并使用以下链接导航到 Google Cloud 控制台：\n\n`https://console.cloud.google.com/`\n\
  \n接下来，点击控制台页面左上角的菜单按钮，如图 85-2 所示选择 `Billing`（结算）项：\n\n![image-UOF32DQC.jpg](img/image-UOF32DQC.jpeg)\n\
  \n图 85-2\n\n在结算页面上，选择添加新结算账户的选项，然后按照步骤开始免费试用。您必须提供信用卡来开设账户，但免费试用结束时，未经您同意，Google\
