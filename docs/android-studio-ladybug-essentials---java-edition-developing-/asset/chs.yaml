  \napp:layout_constraintStart_toStartOf=\"parent\"\napp:layout_constraintTop_topTopOf=\"\
  parent\"\ntools:itemCount=\"12\"\ntools:listitem=\"@layout/recycler_item\" />\n\
  ```\n\n注意用于配置 12 个项目的 `tools` 属性，每个项目都使用包含在某个文件中的布局。布局编辑器提供了一系列可以在布局文件中配置的 `tools`\
  \ 选项。虽然所有这些设置超出了本书的范围，但可以在以下 URL 找到完整描述：\n\nhttps://developer.android.com/studio/write/tool-attributes#toolssamplesources\n\
  \n上述的 `recycler_item` 文件是在选择示例数据模板时自动生成的，可以在项目工具窗口中找到。切换回设计模式，在选中 `RecyclerView`\
