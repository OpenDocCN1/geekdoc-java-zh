  \n通过在模拟器或物理 Android 设备上运行来测试应用程序。应用程序启动后，在视频开始播放之前，视频内容缓冲可能会有短暂延迟（图 81-3）。\n\n![image-AMAKV93D.jpg](img/image-AMAKV93D.jpeg)\n\
