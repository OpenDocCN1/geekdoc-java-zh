  \n## 52. 使用 AppBar 和折叠工具栏\n\n在本章中，我们将探索如何自定义 Activity 中的应用栏并使其对滚动事件做出反应。通过 `CoordinatorLayout`\
  \ 配合 `AppBarLayout` 和 `CollapsingToolbarLayout`，可以配置应用栏进入退出视图。例如，列表的向上滚动可以配置为让应用栏消失并在向下滚动时重新出现。\n\
  \n### 52.1 AppBar 的结构\n\nAppBar 是应用程序运行时显示在屏幕顶部的区域，可以配置为包含状态栏、工具栏和弹性区域。图 52-1 示例展示了一个包含状态栏、工具栏和标签栏的应用栏：\n\
  \n![image-D9MH7WAE.jpg](img/image-D9MH7WAE.jpeg)\n\n图 52-1\n\n空白背景色可以填充弹性区域，或者如图\
  \ 52-2 所示，在 `ImageView` 上显示图像：\n\n![image-I7I122WZ.jpg](img/image-I7I122WZ.jpeg)\n\
  \n图 52-2\n\n正如本章其余部分将演示的，如果 Activity 用户界面布局的主区域包含可滚动内容，应用栏的元素可以根据内容的滚动进行展开和收缩。\n\
  \n### 52.2 示例项目\n\n对于此示例，我们将对早期章节“Android RecyclerView 和 CardView 教程”创建的项目进行修改。首先启动\
  \ Android Studio 并加载该项目。\n\n项目加载后，运行应用并注意当向上滚动列表时工具栏仍然可见，如图 52-3 所示：\n\n![image-IAJX76LJ.jpg](img/image-IAJX76LJ.jpeg)\n\
  \n图 52-3\n\n### 52.3 协调 RecyclerView 和工具栏\n\n第一步是进行配置，使工具栏在向上滚动运动期间收缩，并在向下滚动时展开。\n\
  \n\n\n`CoordinatorLayout` 同样可以用于根据视图层级中某些视图的滚动动作，使应用栏（app bar）的元素滑入或滑出。图 52-4 所示布局层级中的一个元素是\
  \ `ConstraintLayout`。要实现这种协调行为，必须在发生滚动的元素以及与滚动进行协调的元素上设置属性。\n\n在滚动元素上（在此例中为 `RecyclerView`），必须将\
  \ `android:layout_behavior` 属性设置为 `appbar_scrolling_view_behavior`。在 `content_main.xml`\
  \ 文件中，找到顶层 `ConstraintLayout` 元素，并注意该属性已默认设置：\n\n```xml\nxmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \nxmlns:app=\"http://schemas.android.com/apk/res-auto\"\nxmlns:tools=\"http://schemas.android.com/tools\"\
  \nandroid:layout_width=\"match_parent\"\nandroid:layout_height=\"match_parent\"\n\
  app:layout_behavior=\"@string/appbar_scrolling_view_behavior\" >\n```\n\n接下来，在布局编辑器中打开\
  \ `activity_main.xml` 文件，切换到 Code 模式并找到 `AppBarLayout` 元素。注意视图层级中 `AppBarLayout`\
  \ 的唯一子元素是 `Toolbar`。为了让工具栏响应发生于 `RecyclerView` 的滚动事件，必须在该元素上设置 `app:layout_scrollFlags`\
  \ 属性。赋给此属性的值取决于所需的交互性质，必须由以下一个或多个选项组成：\n\n*   `scroll` – 表示视图将滚动到屏幕外。如果不设置此项，在滚动事件期间，视图将固定在屏幕顶部。\n\
  *   `enterAlways` – 当与 `scroll` 选项配合使用时，向上滚动动作将导致视图收回。在此模式下，任何向下的滚动动作都会导致视图重新出现。\n\
  *   `enterAlwaysCollapsed` – 设置在视图上时，在向下滚动动作达到列表限制之前，该视图将不会从折叠状态展开。如果设置了 `minHeight`\
  \ 属性，视图将在初始滚动动作期间出现，但仅持续到达到高度为止。随后，它将保持在该高度，在到达列表顶部之前不会完全展开。请注意，此选项仅在同时使用 `enterAlways`\
  \ 和 `scroll` 选项时有效。例如：\n\n```xml\napp:layout_scrollFlags=\"scroll|enterAlways|enterAlwaysCollapsed\"\
  \nandroid:minHeight=\"20dp\"\n```\n*   `exitUntilCollapsed` – 设置后，视图将在向上滚动动作期间折叠，直到达到\
  \ `minHeight` 阈值。在此时点，它将保持在该高度，直到滚动方向改变。\n\n对于此示例，将如下所示地在 `Toolbar` 上设置 `scroll`\
  \ 和 `enterAlways` 选项：\n\n```xml\nandroid:id=\"@+id/toolbar\"\nandroid:layout_width=\"\
  match_parent\"\nandroid:layout_height=\"?attr/actionBarSize\"\napp:layout_scrollFlags=\"\
  scroll|enterAlways\" />\n```\n\n设置好相应的属性后，重新运行应用并在 `RecyclerView` 列表中执行向上滚动动作。这应该导致工具栏折叠出视图（图\
  \ 52-5）。向下的滚动动作则应导致工具栏重新出现。\n\n![image-J9P1LVP7.jpg](img/image-J9P1LVP7.jpeg)\n\n\
  图 52-5\n\n### 52.4 引入折叠工具栏布局\n\n`CollapsingToolbarLayout` 容器通过提供更多选项，以及对应用栏及其子元素响应协调滚动动作时的折叠行为的控制，增强了标准工具栏。`CollapsingToolbarLayout`\
  \ 类设计用于作为 `AppBarLayout` 的子元素添加。它提供了诸许多功能，例如随着工具栏的折叠和展开自动调整工具栏标题的字体大小。`parallax`\
  \ 模式允许应用栏中的指定内容在折叠时淡出，而 `pin` 模式则允许应用栏的元素在收缩期间保持在固定位置。\n\n还可以使用 `scrim` 选项来指定工具栏在折叠序列期间过渡的颜色。\n\
  \n为了看到这些功能的演示，将修改 `activity_main.xml` 文件中包含的应用栏，使其使用 `CollapsingToolbarLayout` 类，并添加一个\
  \ `ImageView` 以更好地演示 `parallax` 模式的效果。使用 `CollapsingToolbarLayout` 的新视图层级如图 52-6\
  \ 所示所示：\n\n![image-KWL4IQRH.jpg](img/image-KWL4IQRH.jpeg)\n\n图 52-6\n\n在布局编辑器的 Code\
  \ 模式下加载 `activity_main.xml` 文件，并修改布局使其内容如下：\n\n```xml\nxmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \nxmlns:tools=\"http://schemas.android.com/tools\"\nandroid:layout_width=\"match_parent\"\
  \nandroid:layout_height=\"match_parent\"\nandroid:fitsSystemWindows=\"true\"\ntools:context=\"\
  .MainActivity\">\n\nandroid:layout_width=\"match_parent\"\nandroid:layout_height=\"\
  wrap_content\"\nandroid:fitsSystemWindows=\"true\">\n\nandroid:id=\"@+id/collapsing_toolbar\"\
  \nandroid:layout_width=\"match_parent\"\nandroid:layout_height=\"match_parent\"\n\
  app:layout_scrollFlags=\"scroll|enterAlways\"\nandroid:fitsSystemWindows=\"true\"\
  \napp:expandedTitleMarginBottom=\"30dp\"\napp:expandedTitleMarginStart=\"15dp\"\n\
  app:expandedTitleMarginEnd=\"64dp\">\n\nandroid:id=\"@+id/backdrop\"\nandroid:layout_width=\"\
  match_parent\"\nandroid:layout_height=\"200dp\"\nandroid:scaleType=\"centerCrop\"\
  \nandroid:fitsSystemWindows=\"true\"\napp:layout_collapseMode=\"parallax\"\nandroid:src=\"\
  @drawable/appbar_image\" />\n\nandroid:id=\"@+id/toolbar\"\nandroid:layout_width=\"\
  match_parent\"\nandroid:layout_height=\"?attr/actionBarSize\"\napp:layout_scrollFlags=\"\
  scroll|enterAlways\"\napp:layout_collapseMode=\"pin\" />\n\nandroid:id=\"@+id/contentMain\"\
  \nlayout=\"@layout/content_main\" />\n```\n\n使用操作系统的文件导航器找到项目文件夹中的 `appbar_image.jpg`\
  \ 文件并将其复制到项目中。\n\n运行时，应用栏应如图 52-7 所示：\n\n![image-GA36ZCO3.jpg](img/image-GA36ZCO3.jpeg)\n\
  \n图 52-7\n\n向上滚动列表会导致应用栏逐渐折叠。在收缩期间，图像将淡变为 `scrim` 属性定义的颜色，同时标题文本字体大小以相应的速率缩小，直到只剩下工具栏：\n\
  \n![image-V5LG3G0.jpg](img/image-V5LG3G0.jpeg)\n\n图 52-8\n\n在滚动动作的初始阶段，工具栏保持可见（如果继续向上滚动，工具栏也将滑出视图），这是因为\
  \ `activity_main.xml` 文件中的工具栏元素配置为使用 `pin` 模式：\n\n`app:layout_collapseMode=\"pin\"\
  `\n\n如果折叠模式设置为 `parallax`，则工具栏将与图像视图一起收回。\n\n继续向上滚动将导致工具栏也折叠，只留状态栏可见：\n\n![image-5ESQFJSN.jpg](img/image-5ESQFJSN.jpeg)\n\
  \n图 52-9\n\n由于 `CollapsingToolbarLayout` 元素的滚动标志属性包含了 `enterAlways` 选项，向下滚动动作将导致应用栏再次展开。\n\
  \n为了固定工具栏位置使其在向上滚动动作期间不再滑出视图，请将 `activity_main.xml` 文件中 `CollapsingToolbarLayout`\
  \ 元素的 `layout_scrollFlags` 属性中的 `enterAlways` 替换为 `exitUntilCollapsed`：\n\n```xml\n\
  app:layout_scrollFlags=\"scroll|exitUntilCollapsed\"\n```\n\n\n\n\n作为最后一个任务，编辑 `MainActivity.java`\
  \ 文件并在 `onCreate()` 方法中添加一些代码，以更改折叠布局管理器（collapsing layout manager）实例上的标题，并设置不同的遮罩颜色（scrim\
  \ color）（注意遮罩颜色也可以在布局资源文件中设置）：\n\n```java\npackage com.ebookfrenzy.carddemo;\n\n\
  import com.google.android.material.appbar.CollapsingToolbarLayout;\nimport android.graphics.Color;\n\
  \n@Override\nprotected void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    binding = ActivityMainBinding.inflate(getLayoutInflater());\n    setContentView(binding.getRoot());\n\
  \    setSupportActionBar(binding.toolbar);\n    binding.collapsingToolbar.setTitle(\"\
  My Toolbar Title\");\n    binding.collapsingToolbar.setContentScrimColor(Color.GREEN);\n\
  \    layoutManager = new LinearLayoutManager(this);\n    binding.contentMain.recyclerView.setLayoutManager(layoutManager);\n\
  \    adapter = new RecyclerAdapter();\n    binding.contentMain.recyclerView.setAdapter(adapter);\n\
  }\n```\n\n最后运行一次应用，注意新标题出现在应用栏中，并且现在滚动会导致工具栏在收回视图时过渡到绿色。\n\n## 52.6 总结\n\n大多数 Android\
  \ 应用顶部的应用栏可以由几个元素组成，包括 `toolbar`、`tab layout` 和 `image view`。当它嵌入到 `CoordinatorLayout`\
  \ 父布局中时，有多种不同的选项可以控制应用栏响应活动主内容中滚动事件的行为。为了对这种行为进行更细致的控制，`CollapsingToolbarLayout`\
  \ 布局提供了一系列额外的控制级别，用于控制应用栏内容相对于滚动活动的展开和收缩。\n\n## 53. Android 服务概述\n\n`Android Service`\
  \ 类旨在允许应用程序启动并执行后台任务。与广播接收器（broadcast receivers）不同，接收器旨在快速执行任务后退出，而服务旨在执行耗时较长的任务（例如通过互联网连接下载文件或向用户流式音乐），但不需要用户界面。\n\
  \n本章将提供可用服务的概述，包括绑定服务（bound services）和意图服务（intent services）。在涵盖这些基础知识后，后续章节将通过一些示例来演示服务。\n\
  \n### 53.1 Intent Service\n\n如前所述，服务默认在与启动它的组件相同的主线程中运行。因此，服务需要执行的任何 CPU 密集型任务应该在新线程中进行，从而避免影响调用应用程序的性能。\n\
  \n`JobIntentService` 类是一个便利类（继承自 `Service` 类），它为处理后台任务设置了一个工作线程，并异步处理每个请求。一旦服务处理了所有队列中的请求，它就会退出。使用\
  \ `JobIntentService` 类时，只需要实现 `onHandleWork()` 方法，该方法包含为每个请求要执行的代码。\n\n对于不需要同步处理请求的服务，`JobIntentService`\
  \ 是推荐的选项。然而，需要同步处理请求的服务需要继承自 `Service` 类，并手动实现和管理线程，以高效地处理任何 CPU 密集型任务。\n\n### 53.2\
  \ Bound Service\n\n绑定服务（bound service）允许启动组件与服务进行交互并接收其结果。这种交互也可以通过实现进程间通信（IPC）跨越进程边界进行。例如，一个活动\
  \ 可能会启动一个服务来处理音频播放。该活动极可能会包含一个用户界面，为用户提供暂停播放或跳到下一曲的控制。同样，服务可能需要向调用的活动通信信息，以指示当前音频轨道已结束，并提供即将开始播放的下一曲的详情。\n\
  \n组件（在此上下文中称为客户端）通过调用 `bindService()` 方法启动并绑定到绑定服务。此外，多个组件可以同时绑定到一个服务。当客户端不再需要该服务绑定时，应该调用\
  \ `unbindService()` 方法。当最后一个绑定的客户端从服务取消绑定时，Android 运行时系统将终止该服务。需要注意的是，绑定服务也可以通过调用\
  \ `startService()` 启动。一旦启动，组件就可以通过 `bindService()` 调用绑定它。当通过调用 `startService()`\
  \ 启动绑定服务时，即使在最后一个客户端从其取消绑定后，它也会继续运行。\n\n绑定服务必须包含 `onBind()` 方法的实现，该方法在服务最初创建以及其他客户端随后绑定到运行中的服务时都会被调用。该方法的目的是向绑定客户端返回一个\
  \ `IBinder` 类型的对象，其中包含了客户端与服务通信所需的信息。\n\n在实现客户端与绑定服务之间的通信时，推荐的技术取决于客户端和服务端是否位于同一个进程或不同的进程中，以及服务是否对客户端私有。本地通信可以通过扩展\
  \ `Binder` 类并在 `onBind()` 方法中返回实例来实现。另一方面，进程间通信需要 `Messenger` 和 `Handler` 的实现。这两种方法的细节将在后面的章节中介绍。\n\
  \n### 53.3 服务的内部结构\n\n如前所述，服务必须创建为 `Android Service` 类的子类（具体地说是 `android.app.Service`）或其子类（例如\
  \ `android.app.IntentService`）。在子类化的过程中，取决于所创建的服务的确切性质，必须重写以下一个或多个父类回调方法：\n\n- `onStartCommand()`\
  \ – 当另一个组件通过调用 `startService()` 方法启动服务时调用此方法。绑定服务不需要实现此方法。\n- `onBind()` – 当组件通过调用\
  \ `bindService()` 方法绑定到服务时调用。在实现绑定服务时，此方法必须返回一个促进通信的 `IBinder` 对象。\n- `onCreate()`\
  \ – 旨在执行初始化任务的地方，该方法在调用 `onStartCommand()` 或首次调用 `onBind()` 之前立即调用。\n- `onDestroy()`\
  \ – 在服务被销毁时调用。\n- `onHandleWork()` – 仅适用于 `JobIntentService` 子类。该方法被调用以处理服务的逻辑。它在独立于主线程的线程中执行。\n\
  \n注意，`IntentService` 类包含了 `onStartCommand()` 和 `onBind()` 回调方法的实现，因此在子类中不需要实现这些方法。\n\
  \n### 53.4 控制销毁服务的重启选项\n\n`onStartCommand()` 回调方法要求返回一个整数值，以定义当 Android 运行时系统销毁服务时发生什么。这些方法的可能返回值如下：\n\
  \n- `START_NOT_STICKY` – 指示系统如果服务被销毁，除非有等待交付的意图，否则不要重启它。\n- `START_STICKY` – 指示系统如果服务在\
  \ `onStartCommand()` 方法返回后被销毁，则应尽快重启它。如果没有等待交付的意图，调用 `onStartCommand()` 回调方法将传入\
  \ `NULL` 意图值。服务销毁时正在处理的意图将被丢弃。\n\n\n\n\n\n- `START_REDELIVER_INTENT` – 表示如果服务从 `onStartCommand()`\
  \ 回调方法返回后被销毁，则应该重启服务，并将当前的 intent 重新投递到 `onStartCommand()` 方法，随后投递任何待处理的 intent。\n\
  \n## 53.5 在清单文件中声明服务\n\n要使服务（Service）可用，必须首先在清单文件中进行声明。这涉及到在现有条目中嵌入一个配置适当的元素。至少，该元素必须包含一个声明服务类名的属性，如下所示的\
  \ XML 片段所示：\n\n```xml\nandroid:icon=\"@mipmap/ic_launcher\"\nandroid:label=\"@string/app_name\"\
  \nandroid:name=\".MainActivity\" >\n```\n\n默认情况下，服务是公开的，因为它们可以被其所在应用包之外的组件访问。要将服务设为私有，必须在清单文件的元素中将\
  \ `android:exported` 属性声明为 `false`。例如：\n\n```xml\nandroid:exported=\"false\">\n\
  ```\n\n在使用 `JobIntentService` 时，清单中的 `Service` 声明还必须如下所示请求 `BIND_JOB_SERVICE` 权限：\n\
  \n```xml\nandroid:name=\".MyJobIntentService\"\nandroid:permission=\"android.permission.BIND_JOB_SERVICE\"\
  \ />\n```\n\n如前所述，服务默认在与调用组件相同的进程中运行。要强制服务运行在自己的进程中，请向该元素添加 `android:process` 属性，并声明一个以冒号（`:`）开头的进程名称：\n\
  \n```xml\nandroid:exported=\"false\"\nandroid:process=\":myprocess\">\n```\n\n冒号前缀表示新进程对于本地应用程序是私有的。然而，如果进程名是以小写字母而不是冒号开头，该进程将是全局的，可供其他组件使用。\n\
  \n最后，通过与 Activity 相同的 intent 过滤器机制，服务还可以向设备上运行的其他应用程序发布其能力。有关意图过滤器的更多细节，请参考“Android\
  \ Intent 概述”章节。\n\n## 53.6 在系统启动时启动运行的服务\n\n考虑到服务的后台性质，在基于 Android 系统首次启动时需要启动服务并不罕见。这可以通过创建一个广播接收器（Broadcast\
  \ Receiver）来实现，并配置意图过滤器以监听系统 `android.intent.action.BOOT_COMPLETED` 意图。当检测到此类意图时，广播接收器将调用必要的服务然后返回。注意，为了能够运行，此类广播接收器必须请求\
  \ `android.permission.RECEIVE_BOOT_COMPLETED` 权限。\n\n## 53.7 总结\n\nAndroid 服务是一种强大的机制，允许应用程序在后台执行任务。服务一旦启动，无论调用它的应用程序是否是前台任务，即使启动服务的组件被销毁，它都将继续运行。\n\
  \n服务继承自 `Android Service` 类。绑定服务（Bound services）为其他客户端组件提供了通信接口，并且通常一直运行到最后一个客户端从服务取消绑定（unbind）为止。\n\
  \n默认情况下，服务在与调用应用程序相同的进程和主线程中本地运行。因此，应该在服务内部创建一个新线程来处理 CPU 密集型任务。通过对应用程序清单文件中相应条目进行细微配置更改，可以在单独进程中启动远程服务（Remote\
  \ services）。\n\n`IntentService` 类（`Android Service` 类的子类）提供了一种方便的机制，用于在单独的工作线程中处理异步服务请求。\n\
  \n## 54. Android Intent 概述\n\n到本书的这个阶段，读者应该已经清楚 Android 包含一个或多个 Activity 等内容。然而，一个尚未详细介绍的领域是一个\
  \ Activity 触发另一个 Activity 的机制。正如“Android 应用剖析”章节中所简概述的那样，这主要是通过 Intent（意图）实现的。\n\
  \n在后续章节中通过基于 Android Studio 的示例实现 之前，本章旨在以显式意图（explicit intents）和隐式意图（implicit intents）的形式提供\
  \ Intent 的概述，并介绍意图过滤器（intent filters）。\n\n## 54.1 Intent 概述\n\nIntent (`android.content.Intent`)\
  \ 是 Activity 启动另一个 Activity 的消息系统。例如，Activity 可以发出一个 intent 来请求启动同一应用程序中的另一个 Activity。Intent\
  \ 的概念还超出了此范围，它允许 Activity 请求设备上任何其他已适当注册并配置了权限的 Activity 服务。例如，考虑一个应用程序内包含一个需要加载并向用户显示网页的\
  \ Activity。与其让应用程序包含第二个 Activity 来执行此任务，不如代码可以向 Android 运行时发送一个 intent，请求任何注册了显示网页能力的\
  \ Activity 服务。运行时系统会将请求与设备上可用的 Activity 进行匹配，并启动匹配的 Activity，或者在存在多个匹配的情况下，允许用户决定使用哪个\
  \ Activity。\n\nIntent 还允许数据从发送方 Activity 传输到接收方 Activity。在之前描述的场景中，例如，发送方 Activity\
  \ 需要将显示的网页 URL 发送到第二个 Activity。同样，接收方 Activity 可以配置为在所需任务完成后向发送方 Activity 返回数据。\n\
  \n虽然在后面的章节中才会介绍，但值得强调，除了启动 Activity 外，Intent 还用于启动并与服务及广播接收器进行通信。\n\nIntent 分为显式或隐式。\n\
  \n## 54.2 显式意图\n\n显式意图通过引用目标 Activity 的组件名称（即类名）来请求启动特定的 Activity。当启动与发送方 Activity\
  \ 同一应用程序的 Activity 时，这种方法最常见（因为开发者知道类名）。\n\n显式意图是通过创建 `Intent` 类的实例并传递 Activity\
  \ 上和要启动的 Activity 组件名称来实现。然后调用 `startActivity()` 方法并将 intent 对象作为参数。例如，以下代码片段为类名为\
  \ `ActivityB` 的 Activity 发出一个显式意图：\n\n```java\nIntent i = new Intent(this, ActivityB.class);\n\
  startActivity(i);\n```\n\n可以在启动 intent 对象之前，通过调用 `putExtra()` 方法将数据传输到接收方 Activity。数据必须以键值对的形式添加。以下代码扩展了之前的示例，分别向\
  \ intent 添加键为 `\"myString\"` 和 `\"myInt\"` 的字符串和整数值：\n\n```java\nIntent i = new\
  \ Intent(this, ActivityB.class);\ni.putExtra(\"myString\", \"This is a message for\
  \ ActivityB\");\ni.putExtra(\"myInt\", 100);\nstartActivity(i);\n```\n\n目标 Activity\
  \ 通过 `Bundle` 对象接收数据，可以通过调用 `getIntent().getExtras()` 获取。`Activity` 类的 `getIntent()`\
  \ 方法返回启动 Activity 的 intent，而 `getExtras()` 方法（`Intent` 类的）返回包含数据的 `Bundle` 对象。例如，提取传递给\
  \ `ActivityB` 的数据值：\n\n```java\nBundle extras = getIntent().getExtras();\nif (extras\
  \ != null) {\n    String myString = extras.getString(\"myString\");\n    int myInt\
  \ = extras.getInt(\"myInt\");\n}\n```\n\n\n\n\n\n当使用意图（intent）启动应用程序内的其他活动时，这些活动必须在应用程序清单文件（manifest）中列出。以下\
  \ `AndroidManifest.xml` 内容对于包含名为 `ActivityA` 和 `ActivityB` 的活动的应用程序是配置正确的：\n\n```xml\n\
  package=\"com.ebookfrenzy.intent1.intent1\" >\nandroid:icon=\"@mipmap/ic_launcher\"\
  \nandroid:label=\"@string/app_name\" >\nandroid:label=\"@string/app_name\"\nandroid:name=\"\
  com.ebookfrenzy.intent1.intent1.ActivityA\" >\nandroid:name=\"ActivityB\"\nandroid:label=\"\
  ActivityB\" >\n```\n\n## 54.3 从 Activity 返回数据\n\n如上一节的示例所示，虽然数据传输到了 `ActivityB`，但没有方法可以将数据返回给第一个活动（我们将其称为\
  \ `ActivityA`）。然而，这可以通过将 `ActivityB` 启动为 `ActivityA` 的子活动（sub-activity）来实现。通过创建\
  \ `ActivityResultLauncher` 实例可以启动活动作为子活动。`ActivityResultLauncher` 实例是通过调用 `registerForActivityResult()`\
  \ 方法创建的，并以 lambda 表达式的形式传递一个回调处理程序。当子活动返回时，将调用此处理程序并传递返回数据。一旦创建了 `ActivityResultLauncher`\
  \ 实例，就可以带意图参数调用它来启动子活动。创建 `ActivityResultLauncher` 实例的代码通常如下：\n\n```java\nActivityResultLauncher\
  \ startForResult = registerForActivityResult(\n    new ActivityResultContracts.StartActivityForResult(),\n\
  \    new ActivityResultCallback() {\n        @Override\n        public void onActivityResult(ActivityResult\
  \ result) {\n            if (result.getResultCode() == Activity.RESULT_OK) {\n \
  \               Intent data = result.getData();\n                // 处理返回数据的代码\n\
  \            }\n        }\n    }\n);\n```\n\n一旦启动器就绪，可以如下方式调用并传递要启动的意图：\n\n```java\n\
  Intent i = new Intent(this, ActivityB.class);\n.\n.\nstartForResult.launch(i);\n\
  ```\n\n要将数据返回给父活动，子活动必须实现 `finish()` 方法，其目的是创建一个包含要返回数据的新意图对象，然后调用封装的的 `setResult()`\
  \ 方法，传递结果代码和包含返回数据的意图。结果代码通常是 `RESULT_OK` 或 `RESULT_CANCELED`，但也可以根据开发者的需求自定义值。如果子活动崩溃，父活动将接收\
  \ `RESULT_CANCELED` 结果代码。\n\n下面的代码说明了典型的子活动 `finish()` 方法代码：\n\n```java\npublic\
  \ void finish() {\n    Intent data = new Intent();\n    data.putExtra(\"returnString1\"\
  , \"给父活动的消息\");\n    setResult(RESULT_OK, data);\n    super.finish();\n}\n```\n\n\
  ## 54.4 隐式意图\n\n与显式意图（explicit intents）引用要启动的活动的类名不同，隐式意图通过指定要执行的动作（action）和接收活动要处理的数据类型来标识要启动的活动。例如，`ACTION_VIEW`\
  \ 类型的动作配合 `URI` 对象形式的网页 URL，将指示 Android 系统搜索并随后启动能够处理网络浏览器的活动。以下隐式意图在 Android 设备上执行时，将导致指定的网页在网络浏览器活动中显示：\n\
  \n```java\nIntent intent = new Intent(Intent.ACTION_VIEW,\n    Uri.parse(\"https://www.ebookfrenzy.com\"\
  ));\nstartActivity(intent);\n```\n\n当活动发布上述隐式意图时，Android 系统将通过称为意图解析（intent resolution）的过程搜索设备上已注册了处理\
  \ HTTP 方案数据的 `ACTION_VIEW` 请求能力的活动。在系统使用隐式意图启动活动之前，用户必须验证或启用该活动。如果这两个条件都不满足，该活动将不会通过意图启动。在探索这两个选项之前，我们首先需要谈论意图过滤器（intent\
  \ filters）。\n\n## 54.5 使用意图过滤器\n\n意图过滤器是活动向 Android 意图解析过程“宣告”其支持的动作和数据处理能力的机制。这些声明还包括了执行链接验证过程所需的设置。以下\
  \ `AndroidManifest.xml` 文件演示了名为 `MyWebView` 的应用中名为 `WebActivity` 的活动的配置，并配备了恰当的意图过滤器：\n\
  \n```xml\n.\n.\nandroid:allowBackup=\"true\"\nandroid:icon=\"@mipmap/ic_launcher\"\
  \nandroid:label=\"@string/app_name\"\nandroid:roundIcon=\"@mipmap/ic_launcher_round\"\
  \nandroid:supportsRtl=\"true\"\nandroid:theme=\"@style/Theme.MyWebView\">\nandroid:name=\"\
  WebActivity\"\nandroid:exported=\"true\">\n```\n\n...当意图包含 `https://www.ebookfrenzy.com`\
  \ URL 时，响应另一个活动发的隐式意图而启动。例如，下面的代码将启动 `WebActivity` 活动（假设 `MyWebView` 应用已被用户验证或启用作为支持链接）：\n\
  \n```java\nIntent intent = new Intent(Intent.ACTION_VIEW,\n    Uri.parse(\"https://www.ebookfrenzy.com\"\
  ));\nstartActivity(intent);\n```\n\n## 54.6 自动链接验证\n\n使用网页链接启动 Android 设备上的活动被认为存在潜在的安全风险。为了最小化这种风险，所用于启动意图的链接必须经过自动验证或由用户手动添加到支持列表中。要启用自动验证，相应的意图声明必须将\
  \ `autoVerify` 设置为 `true`：\n\n```xml\n.\n.\n```\n\n接下来，链接必须与基础网站关联。这是通过在网站的 `.well-known`\
  \ 文件夹内创建一个名为 `assetlinks.json` 的数字资产文件来实现的。数字资产文件包含一个允许目标应用使用网站链接的关系声明，以及一个声明包名和\
  \ SHA256 指纹的目标语句。一个典型的资产文件可能如下：\n\n```json\n[{\n\"relation\": [\"delegate_permission/handle_all_urls\"\
  ],\n\"target\": {\n\"namespace\": \"android_app\",\n\"package_name\": \"com.ebookfrenzy.mywebview\"\
  ,\n\"sha256_fingerprints\":\n[\"\"]\n}\n}]\n```\n\n工具可用：[`developers.google.com/digital-asset-links/tools/generator`](https://developers.google.com/digital-asset-links/tools/generator)\n\
  \n在使用 Android 时，`namespace` 值始终设置为 `android_app`，而 `package_name` 对应要启动的应用包。最后，证书指纹是构建应用程序的哈希值。当你测试应用程序时，这将\
  \ `debug.keystore` 文件中的调试证书。在 Windows 系统上，Android Studio 将此文件存储在以下位置：\n\n`\\Users\\\
  .android\\debug.keystore`\n\n在 macOS 和 Linux 系统上，可以在此处找到文件：\n\n`HOME/.android/debug.keystore`\n\
  \n找到文件后，可以通过在终端或命令行窗口中运行以下命令获取 SHA 256 指纹：\n\n```bash\nkeytool -list -v -keystore\n\
  ```\n\n当提示密码时，输入 `android`，之后将出现输出，包括 SHA 256 指纹：\n\n```text\nCertificate fingerprints:\n\
  SHA1: 11:E8:66:11:B6:94:3D:AA:7E:50:63:99:77:B8:6A:90:FF:B6:9C:6D\nSHA256: 7F:EE:E3:C8:38:41:C3:EA:11:56:83:94:2A:4C:D2:EA:A0:69:F8:96:D1:17:77:02:46:EC:AD:6E:3C:64:A9:29\n\
  ```\n\n\n\n\n当你准备好构建应用程序的发布版本时，必须确保已将发布版本的 SHA 256 指纹添加到资源文件中。生成发布版密钥库文件的详细信息请参见名为“创建、测试和上传\
  \ Android App Bundle”的章节。一旦你拥有了发布版密钥库文件，运行上述 `keytool` 命令来获取指纹。\n\n一旦你将数字资源文件放置在网站上的正确位置，请在设备或模拟器上安装应用并等待\
  \ 30 秒以验证链接。要检查验证状态，请在命令行或终端提示符运行以下命令：\n\n```\nadb shell pm get-app-links --user\
  \ cur com.example.mywebview\n```\n\n输出结果应包含对链接已验证的确认：\n\n```\ncom.example.mywebview:\n\
  \nID: 0e399bca-bf58-4cfc-8c7b-d1a6c3b065ec\n\nSignatures: [7F:EE:E3:C8:38:41:C3:EA:11:56:83:94:2A:4C:D2:EA:A0:69:F8:96:D1:17:77:02:46:EC:AD:6E:3C:64:A9:29]\n\
  \nDomain verification state:\n\nwww.ebookfrenzy.com: verified\n\nUser 0:\n\nVerification\
  \ link handling allowed: true\n\nSelection state:\n\nDisabled:\n\nwww.ebookfrenzy.com\n\
  ```\n\n你也可以通过以下步骤在设备或模拟器上的 `Settings`（设置）应用中检查状态：\n\n1. 启动 `Settings` 应用。\n2. 从主列表中选择\
  \ `Apps`（应用）。\n3. 从已安装的应用列表中找到并选择你的应用。\n4. 在应用的设置页面上，选择 `Open by Default`（默认打开）选项。\n\
  \n在应用的设置页面上选择 `Open by Default` 选项。\n\n一旦显示，该页面应指示链接已验证，如图 54-1 所示：\n\n![image-0VOTDMY6.jpg](img/image-0VOTDMY6.jpeg)\n\
  \n图 54-1\n\n要查看哪些链接已通过验证，点击上图箭头指示的详情按钮以显示以下面板：\n\n![image-L7LZJWQU.jpg](img/image-L7LZJWQU.jpeg)\n\
  \n图 54-2\n\n`assetlinks.json` 文件可以包含多个数字资源链接，允许单个网站与多个应用关联。如果你无法使用自动链接验证，请在你的应用中添加代码以提示用户手动启用链接。\n\
  \n## 54.7 手动启用链接\n\n在无法使用上述步骤自动验证链接的情况下，唯一的选择是请求用户手动启用应用链接。这涉及启动目标应用 `Settings`\
  \ 应用中的 `Open by Default`（默认打开）屏幕，用户可以在该处启用链接。\n\n由于 `Open by Default` 屏幕突然出现可能会让普通用户感到困惑，建议在启动\
  \ `Settings` 应用之前显示一个说明对话框。\n\n为了给用户提供手动启用链接的选项，在尝试启动 `intent` 之前需要执行以下代码：\n\n```\n\
  // 此处编写代码以显示对话框，解释需要启用链接\n\nIntent intent = new Intent(\n    Settings.ACTION_APP_OPEN_BY_DEFAULT_SETTINGS,\n\
  \    Uri.parse(\"package:com.ebookfrenzy.mywebview\"));\n\nstartActivity(intent);\n\
  ```\n\n上述示例代码将为我们的目标应用 `MyWebView` 显示 `Open by Default` 设置屏幕，用户可以在该处点击 `Add Link`（添加链接）按钮：\n\
  \n![image-OV3CZTUE.jpg](img/image-OV3CZTUE.jpeg)\n\n图 54-3\n\n点击后，将弹出一个对话框，并使用传入\
  \ `intent` 的链接进行初始化。通过勾选如附 54-4 所示的复选框可以启用该链接：\n\n![image-5JJE40QK.jpg](img/image-5JJE40QK.jpeg)\n\
  \n图 54-4\n\n## 54.8 检查 Intent 的可用性\n\n通常认为假设某个 activity 对于特定的 `intent` 可用是不明智的，特别是因为缺少匹配的\
  \ action 通常会导致应用程序崩溃。幸运的是，在将其发送到运行时系统之前，可以识别 activity 对于特定 `intent` 的可用性。可以使用以下方法识别指定\
  \ `intent` action 类型的 activity 的可用性：\n\n```java\npublic static boolean isIntentAvailable(Context\
  \ context, String action) {\n    final PackageManager packageManager = context.getPackageManager();\n\
  \    final Intent intent = new Intent(action);\n    List list = packageManager.queryIntentActivities(intent,\n\
  \            PackageManager.MATCH_DEFAULT_ONLY);\n    return list.size() > 0;\n\
  }\n```\n\n## 54.9 总结\n\nIntent 是一个 Android activity 启动另一个 activity 的消息机制。显式 `intent`\
  \ 通过类名引用接收方 activity 来引用要启动的特定 activity。显式 intent 通常（但并非限于）用于启动同一应用程序内的 activity。隐式\
  \ `intent` 指定了要执行的动作和要处理的数据类型，并让 Android 运行时找到匹配的 activity 来启动。隐式 intent 通常用于启动位于不同应用程序中的\
  \ activity。\n\n在处理隐式 intent 时，安全限制要求用户在启动 `intent` 之前，自动验证或手动启用包含 `intent` 目标 activity\
  \ 的应用。自动验证涉及在与链接 URL 对应的网站上放置数字资产链接文件。\n\nactivity 可以将数据封装在 `intent` 对象中向接收方 传递数据。只有当\
  \ activity 作为发送活动的子活动启动时，才能从其返回数据。\n\n\n\n\n接下来，添加一个 `Plain Text` 对象，使其水平居中并放置在\
  \ `TextView` 顶部的上方。使用 `Attributes` 工具窗口，移除分配给文本属性的“Name”字符串，并将 ID 设置为 `editText1`。布局完成后，点击工具栏上的\
  \ `Infer constraints`（推断约束）按钮以添加适当的约束：\n\n![image-ABIIAL08.jpg](img/image-ABIIAL08.jpeg)\n\
  图 55-1\n\n最后，点击 `Layout Editor` 窗口右上角的红色警告按钮，并使用生成的面板将“Send Text”字符串提取到名为 `send_text`\
  \ 的资源中。布局完成后，用户界面应该类似于图 55-2 所示所示：\n\n![image-D6WNC3DR.jpg](img/image-D6WNC3DR.jpeg)\n\
  图 55-2\n\n## 55.3 创建第二个 Activity 类\n\n当用户触摸“Send Text”按钮时，将发出一个 `intent`，请求启动第二个\
  \ activity，用户可以在其中输入响应。因此，下一步是创建第二个 activity。在 `Project` 工具窗口中，右键点击 `app -> java`\
  \ 下的 `com.ebookfrenzy.explicitintent` 包名，选择 `New -> Activity -> Empty Views Activity`\
  \ 菜单选项，显示如图 55-3 所示的 `New Android Activity` 对话：\n\n![image-JVREGK0P.jpg](img/image-JVREGK0P.jpeg)\n\
  图 55-3\n\n在 `Activity Name` 和 `Title` 字段中输入 `SecondActivity`，将布局文件命名为 `activity_second`，并将\
  \ `Language` 菜单更改 `Java`。由于此 activity 在应用程序启动时不会启动（它将在点击按钮时由 `MainActivity` 通过 `intent`\
  \ 启动），在点击 `Finish` 按钮之前，确保禁用了 `Launcher Activity` 选项。\n\n## 55.4 为 SecondActivity\
  \ 设计用户界面布局\n\n第二个 activity 用户界面所需的元素是 `Plain Text EditText`、`TextView` 和 `Button`\
  \ 视图。考虑到这些要求，将 `activity_second.xml` 布局加载到 `Layout Editor` 工具中并添加视图。\n\n在设计过程中，注意\
  \ `button` 视图上的 `onClick` 属性已配置为调用名为 `returnText` 的方法，并且 `TextView` 和 `EditText`\
  \ 视图分别分配了 ID `textView2` 和 `editText2`。完成后，布局应类似于图 55-4 所示。注意按钮上的文本（“Return Text”）已提取到名为\
  \ `return_text` 的字符串资源中。\n\n布局完成后，点击 `Infer constraints` 工具栏按钮为布局添加必要的约束：\n\n![image-DXI6YJQF.jpg](img/image-DXI6YJQF.jpeg)\n\
  图 55-4\n\n## 55.5 检查应用程序清单文件文件\n\n为了让 `MainActivity` 能够使用 `intent` 启动 `SecondActivity`，`AndroidManifest.xml`\
  \ 文件中需要存在 `SecondActivity` 的条目。在 `Project` 工具窗口中（`app -> manifests`）找到该文件，双击将其加载到编辑器中，并验证\
  \ `Android Studio` 是否已自动添加了该 activity 的条目：\n\n```xml\nxmlns:tools=\"http://schemas.android.com/tools\"\
  >\nandroid:allowBackup=\"true\"\nandroid:dataExtractionRules=\"@xml/data_extraction_rules\"\
  \nandroid:fullBackupContent=\"@xml/backup_rules\"\nandroid:icon=\"@mipmap/ic_launcher\"\
  \nandroid:label=\"@string/app_name\"\nandroid:roundIcon=\"@mipmap/ic_launcher_round\"\
  \nandroid:supportsRtl=\"true\"\nandroid:theme=\"@style/Theme.ExplicitIntent\"\n\
  tools:targetApi=\"31\">\nandroid:name=\".SecondActivity\"\nandroid:exported=\"false\"\
  \ />\nandroid:name=\".MainActivity\"\nandroid:exported=\"true\">\n```\n\n第二个 activity\
  \ 创建并列在清单文件中后现在是可以在 `MainActivity` 类中编写一些代码来发出 `intent` 了。\n\n## 55.6 创建 Intent\n\
  \n`MainActivity` 的目标是在用户触摸“Send Text”按钮时创建并启动一个 `intent`。作为 intent 创建过程的一部分，用户在\
  \ `EditText` 视图中输入的查询字符串将以键值对的形式添加到 `intent` 对象中。当创建 `MainActivity` 的用户界面布局时，`button`\
  \ 对象被配置为在用户“点击”时调用名为 `sendText()` 的方法。现在需要将此方法添加到 `MainActivity` 类 `MainActivity.java`\
  \ 源文件中，如下：\n\n```java\npackage com.ebookfrenzy.explicitintent;\n\n.\n\n.\n\nimport\
  \ android.content.Intent;\n\n.\n\n.\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n\n.\n\n.\n\npublic void sendText(View view) {\nIntent i = new Intent(this,\
  \ SecondActivity.class);\nString myString = binding.editText1.getText().toString();\n\
  i.putExtra(\"qString\", myString);\nstartActivity(i);\n}\n\n}\n```\n\n`sendText()`\
  \ 方法的代码遵循“Android Intent 概述”中概述的技术。首先，创建一个新的 `Intent` 实例，并将当前 activity 和 `SecondActivity`\
  \ 的类名作为参数传递。接下来，输入到 `EditText` 对象的文本以键值对的形式添加到 `intent` 对象中，并通过 `startActivity()`\
  \ 传递 intent。\n\n编译并运行应用程序，触摸“Send Text”按钮从屏幕右下角（位于 toolbar 上的返回按钮）启动 `SecondActivity`。\n\
  \n## 55.7 提取 Intent 数据\n\n现在 `SecondActivity` 正从 `MainActivity` 启动，下一步是提取 `intent`\
  \ 中包含的 `String` 值并将其赋值给 `SecondActivity` 用户界面中的 `TextView` 对象。这涉及在 `SecondActivity.java`\
  \ 源文件的 `onCreate()` 方法中添加代码，并适配使用视图绑定：\n\n```java\npackage com.ebookfrenzy.explicitintent;\n\
  \n.\n\n.\n\nimport android.content.Intent;\n\nimport android.view.View;\n\nimport\
  \ com.ebookfrenzy.explicitintent.databinding.ActivitySecondBinding;\n\npublic class\
  \ SecondActivity extends AppCompatActivity {\nprivate ActivitySecondBinding binding;\n\
  \npublic void onCreate(Bundle savedInstanceState) {\nsuper.onCreate(savedInstanceState);\n\
  EdgeToEdge.enable(this);\nsetContentView(R.layout.SecondActivity);\nbinding = ActivitySecondBinding.inflate(getLayoutInflater());\n\
  View view = binding.getRoot();\nsetContentView(view);\n\nViewCompat.setOnApplyWindowInsetsListener(binding.main,\
  \ (v, insets) -> {\nInsets systemBars = insets.getInsets(WindowInsetsCompat.Type.systemBars());\n\
  v.setPadding(systemBars.left, systemBars.top, systemBars.right,\nsystemBars.bottom);\n\
  return insets;\n});\n\nBundle extras = getIntent().getExtras();\nif (extras == null)\
  \ {\nreturn;\n}\n\nString qString = extras.getString(\"qString\");\nbinding.textView2.setText(qString);\n\
  }\n\n}\n```\n\n在模拟器或物理 Android 设备上编译并运行应用程序。在触摸“Send Text”按钮之前，在 `MainActivity`\
  \ 的文本框中输入一些文本。现在消息应该出现在 `SecondActivity` 用户界面的 `TextView` 组件上。\n\n## 55.8 作为子 Activity\
  \ 启动 SecondActivity\n\n为了让 `SecondActivity` 能够向 `MainActivity` 返回数据，`SecondActivity`\
  \ 必须作为 `MainActivity` 的子 activity 启动。这意味着我们需要调用 `registerForActivityResult()` 并声明在\
  \ `SecondActivity` 返回时调用的回调处理器。此回调将提取 `SecondActivity` 返回的数据并显示在 `textView1` 上。\n\
  \n`registerForActivityResult()` 返回 `ActivityResultLauncher` 实例，可以在 `sendText()`\
  \ 中调用它可以启动 intent。编辑 `MainActivity.java` 文件如下：\n\n```java\n.\n\n.\n\nimport android.app.Activity;\n\
  import androidx.activity.result.ActivityResult;\nimport androidx.activity.result.ActivityResultCallback;\n\
  import androidx.activity.result.ActivityResultLauncher;\nimport androidx.activity.result.contract.ActivityResultContracts;\n\
  \n.\n\n.\n\npublic class MainActivity extends AppCompatActivity {\n\n.\n\n.\n\n\
  ActivityResultLauncher startForResult = registerForActivityResult(\n```\n\n\n\n\n\
  ```java\nnew ActivityResultContracts.StartActivityForResult(),\n\nnew ActivityResultCallback()\
  \ {\n    @Override\n    public void onActivityResult(ActivityResult result) {\n\
  \        if (result.getResultCode() == Activity.RESULT_OK) {\n            Intent\
  \ data = result.getData();\n            String returnString = data.getExtras().getString(\"\
  returnData\");\n            binding.textView1.setText(returnString);\n        }\n\
  \    }\n});\n\npublic void sendText(View view) {\n    Intent i = new Intent(this,\
  \ SecondActivity.class);\n    String myString = binding.editText1.getText().toString();\n\
  \    i.putExtra(\"qString\", myString);\n    startActivity(i);\n    startForResult.launch(i);\n\
  }\n```\n\n## 55.9 从子 Activity 返回数据\n\n`SecondActivity` 现在作为 `MainActivity` 的子 Activity\
  \ ，而 `MainActivity` 也相应地被修改以处理从 `SecondActivity` 返回的数据。现在剩下的的是修改 `SecondActivity.java`\
  \ 以实现 `finish()` 方法并添加一个名为 `returnText()` 的方法。当 Activity 退出时（例如当用户选择设备上的返回键时），会触发\
  \ `finish()` 方法：\n\n```java\npublic void returnText(View view) {\n    finish();\n\
  }\n\n@Override\npublic void finish() {\n    Intent data = new Intent();\n    String\
  \ returnString = binding.editText2.getText().toString();\n    data.putExtra(\"returnData\"\
  , returnString);\n    setResult(RESULT_OK, data);\n    super.finish();\n}\n```\n\
  \n`finish()` 方法创建一个新的 Intent，将返回数据作为键值对添加，然后调用 `setResult()` 方法，传递结果代码和 Intent 对象。`returnText()`\
  \ 方法则调用了 `finish()` 方法。\n\n打开 `activity_second.xml` 文件，选择按钮控件，并配置 `onClick` 属性以调用\
  \ `returnText()` 方法。\n\n## 55.10 测试应用程序\n\n编译并运行应用程序，在 `MainActivity` 上的文本字段中输入问题，然后点击“Send\
  \ Text”按钮。当 `SecondActivity` 出现时，在 `EditText` 视图中输入文本，并使用返回键或“Return Text”按钮返回 `MainActivity`，此时响应应该出现在文本视图对象中。\n\
  \n## 55.11 总结\n\n在上一章涵盖了 Intent 的基础知识后，本章的目标是在 Android Studio 中创建一个应用程序项目，设计用于演示显式\
  \ Intent（explicit intents）的使用，以及父 Activity 与子 Activity 之间数据传输的概念。\n\n下一章将使用一个示例来演示隐式\
  \ Intent（implicit intents）的运行。\n\n## 56. Android 隐式 Intent – 实例演示\n\n本章将在 Android\
  \ Studio 中创建一个示例应用程序，旨在演示隐式 Intent 的实际实现。目标是创建并发送一个 Intent，请求加载并向用户显示特定特定页的内容。由于示例应用程序本身不包含能够执行此项任务的\
  \ Activity，因此将发布一个隐式 Intent，以便调用 Android Intent 解析算法来识别并启动来自另一个应用程序的合适 Activity。这很可能是\
  \ Android 操作系统自带的 Chrome 浏览器的某个 Activity。\n\n在成功启动内置浏览器后，将创建一个能够显示网页的 Activity 新项目。该项目将被安装到设备或模拟器上，以演示隐式\
  \ Intent 和链接验证。\n\n## 56.1 创建 Android Studio 隐式 Intent 示例项目\n\n从欢迎界面选择 New Project（新建项目）选项，在出现的新项目对话框中，在点击\
  \ Next（下一步）按钮之前选择 Empty Views Activity 模板。\n\n在 `Name`（名称）字段中输入 `ImplicitIntent`\
  \ 并指定 `com.ebookfrenzy.implicitintent` 为包名。由于此示例将使用仅适用于最新 Android 版本中的功能，在点击 Finish（完成）按钮之前，将\
  \ Minimum API level 设置更改为 `API 31: Android 12.0 (S)`，并将语言菜单改为 `Java`。\n\n## 56.2\
  \ 设计用户界面\n\n`MainActivity` 类的用户界面非常简单，仅由一个 `ConstraintLayout` 和两个 `Button` 对象组成。在\
  \ Project 工具窗口中，找到 `app -> res -> layout -> activity_main.xml` 文件并双击它将其加载到 Layout\
  \ Editor 工具工具中。\n\n删除默认的 `TextView`，并在启用 Autoconnect（自动连接）模式的情况下，在布局中放置 `Button`\
  \ 控件，使其显示如下所示：\n\n![image-D1A236UH.jpg](img/image-D1A236UH.jpeg)\n\n图 56-1\n\n将按钮上的文本设置为\
  \ Show Web Page（显示网页）和 Enable Links（启用链接），并将文本提取到字符串资源中。\n\n选择每个 `Button` 并使用 Attributes\
  \ 工具窗口配置 `onClick` 属性，分别调用名为 `showWebPage` 和 `enableLink` 方法。\n\n## 56.3 创建隐式 Intent\n\
  \n如上所述，隐式 Intent 将名为 `showWebPage()` 的方法内部创建并发布，该方法反过来需要在 `MainActivity` 类中实现，其代码位于\
  \ `MainActivity.java` 源文件中。在 Project 工具窗口中找到该文件并双击将其加载到编辑面板中。加载后，修改代码添加 `showWebPage()`\
  \ 和 `enableLink()` 方法以及一些必要的导入：\n\n```java\npackage com.ebookfrenzy.implicitintent;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\nimport android.os.Bundle;\n\
  import android.net.Uri;\nimport android.content.Intent;\nimport android.view.View;\n\
  \npublic class MainActivity extends AppCompatActivity {\n\n// ...\n\n    public\
  \ void showWebPage(View view) {\n        Intent intent = new Intent(Intent.ACTION_VIEW,\n\
  \                Uri.parse(\"https://www.ebookfrenzy.com\"));\n        startActivity(intent);\n\
  \    }\n\n    public void enableLink(View view) {\n    }\n}\n```\n\n`showWebPage()`\
  \ 方法执行的任务非常简单。首先，创建一个新的 Intent 对象。然而，代码没有指定 Intent 的类名，而是使用 `ACTION_VIEW` 指定了 Intent\
  \ 的性质（向用户显示内容）。该 Intent 对象还包含一个要显示的 `URI`。这告诉 Android 解析系统该 Activity 请求显示网页。然后，通过调用\
  \ `startActivity()` 发布该 Intent。\n\n在模拟器或 Android 设备上编译并运行应用程序，运行后，点击 Show Web Page\
  \ 按钮。点击后，应该出现浏览器视图并加载指定的网页。隐式 Intent 现在已成功执行。\n\n## 56.4 添加第二个匹配的 Activity\n\n本章的剩余部分将演示设备上安装了多个匹配隐式\
  \ Intent  Activity 的效果。将创建并安装第二个应用程序来实现这一点。首先，在 Android Studio 中创建一个新项目，将应用程序设置为\
  \ `MyWebView`，并使用与本章早些时候创建 `ImplicitIntent` 项目时相同的 SDK 配置选项，再次选择 Empty Views Activity。\n\
  \n如果你有一个托管 Digital Asset Links 文件的网站并想尝试自动验证，在指定包名时使用你的网站 URL。例如，如果你的网站位于 `www.mycompany.com`，则包名需要设置为：\n\
  \n`com.mycompany.mywebview`\n\n如果你没有网站或不计划使用自动验证，请使用以下包名：\n\n`com.ebookfrenzy.mywebview`\n\
  \n点击 Finish 创建项目，然后按照第 12.8 节所述将项目转换为使用 view bindings。\n\n## 56.5 向 UI 添加 Web View\n\
  \n新 MyWebView 项目包含的唯一 Activity 的用户界面将由 Android `WebView` 控件实例组成。在 Project 工具窗口中，找到\
  \ `activity_main.xml` 文件（该文件包含 Activity 的用户界面描述），并双击它将其加载到 Layout Editor 工具中。\n\n\
  \n\n\n\n在设计模式（Design mode）下使用布局编辑器（Layout Editor）工具，选择默认的 `TextView` 小部件并使用键盘删除键将其从布局中移除。\n\
  \n从调色板的小部件（Widgets）部分拖放 `WebView` 对象到现有的 `ConstraintLayout` 视图上，如图 56-2 所示：\n\n\
  ![image-20YLFNFR.jpg](img/image-20YLFNFR.jpeg)\n\n图 56-2\n\n在继续之前，将 `WebView` 实例的\
  \ ID 更改为 `webView1`，并使用“推约束”（Infer constraints）按钮添加任何缺失的约束。\n\n## 56.6 获取 Intent\
  \ URL\n\n当创建隐式 `intent` 对象以显示网络浏览器窗口时，网页 URL 将被封装在 `intent` 对象内部的 `Uri` 对象中。`MainActivity`\
  \ 类中 `onCreate()` 方法的任务是从 `intent` 对象中提取此 `Uri`，将其转换为 URL 字符串并赋值给 `WebView` 对象。要实现此功能，请修改\
  \ `MainActivity.java` 文件，使其读取如下所示：\n\n```java\npackage com.ebookfrenzy.mywebview;\n\
  \n.\n\n.\n\nimport java.net.URL;\nimport android.net.Uri;\nimport android.content.Intent;\n\
  import android.webkit.WebView;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private ActivityMainBinding binding;\n\n    @Override\n    protected void\
  \ onCreate(Bundle savedInstanceState) {\n    .\n    .\n        handleIntent();\n\
  \    }\n\n    private void handleIntent() {\n        Intent intent = getIntent();\n\
  \        Uri data = intent.getData();\n        URL url = null;\n        try {\n\
  \            url = new URL(data.getScheme(),\n            data.getHost(),\n    \
  \        data.getPath());\n        } catch (Exception e) {\n            e.printStackTrace();\n\
  \        }\n        binding.webView1.loadUrl(url.toString());\n    }\n}\n```\n\n\
  添加到 `onCreate()` 方法中的新代码执行了以下任务：\n\n* 获取导致此活动启动的 `intent` 引用\n* 从 `intent` 对象中提取\
  \ `Uri` 数据\n* 将 `Uri` 数据转换为 `URL` 对象\n* 将 `URL` 加载到网络视图中，在此过程中将 `URL` 转换为 `String`\n\
  \n`MyWebView` 项目的代码部分现在已完成。剩下的工作是修改清单（manifest）文件。\n\n## 56.7 修改 MyWebView 项目清单文件\n\
  \n在进行测试之前，必须对 `MyWebView` 的清单文件进行一些更改。首先，该活动需要请求访问互联网的权限（因为将需要加载网页）。这通过向清单文件添加适当的权限行来实现：\n\
  \n此外，检查 `MyWebView` 项目的 `AndroidManifest.xml` 文件中 `intent filter`（意图过滤器）部分的内容，将发现以下设置：\n\
  \n在上面的 XML 中，`android.intent.action.MAIN` 条目表示该活动在没有数据输入的情况下启动时是应用程序的入口点——另一方面，`android.intent.category.LAUNCHER`\
  \ 指令则表示该活动应该列在设备的应用程序启动器屏幕上。\n\n由于由于该活动不需要作为应用程序的入口点启动，在没有数据输入（在此情况下为 `URL`）的情况下无法运行，且不需要在启动器中出现，因此该活动的清单文件中不需要\
  \ `MAIN` 或 `LAUNCHER` 指令。\n\n然而，需要修改 `MainActivity` 活的 `intent filter`，以指示它能够处理\
  \ HTTP 数据方案的 `ACTION_VIEW` 意图动作。\n\nAndroid 还要求处理不包含 `MAIN` 和 `LAUNCHER` 条目的隐式意图的活动必须在\
  \ `intent filter` 中包含所谓的 `browsable` 和 `default`类别。因此，修改后的 `intent filter` 部分应如下所示，其中\
  \ `is` 被替换为您的网站地址或 `www.ebookfrenzy.com`，取决于您创建 `MyWebView` 项目时使用的包名：\n\n将这些要求汇总，得到了完整的\
  \ `AndroidManifest.xml` 文件：\n\n```xml\n<manifest package=\"com.ebookfrenzy.mywebview\"\
  >\n    android:allowBackup=\"true\"\n    android:icon=\"@mipmap/ic_launcher\"\n\
  \    android:label=\"@string/app_name\"\n    android:roundIcon=\"@mipmap/ic_launcher_round\"\
  \n    android:supportsRtl=\"true\"\n    android:theme=\"@style/Theme.MyWebView\"\
  >\n    <activity\n        android:name=\".MainActivity\"\n        android:exported=\"\
  true\">\n```\n\n通过在 `Project` 工具窗口中双击文件名，将 `AndroidManifest.xml` 文件加载到清单编辑器中。一旦加载完成，修改\
  \ XML 以匹配上述更改，记得输入正确的网站 URL。\n\n对清单文件进行适当的修改后，新活动已准备好安装到设备上。\n\n## 56.8 在设备上安装 MyWebView\
