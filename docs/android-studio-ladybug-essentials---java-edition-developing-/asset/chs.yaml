  \ `cities` 文本选项。对 `itemDetail` 视图重复此步骤，这次如图 51-7 所示选择 `full_names` 选项：\n\n![image-9R9D5O0E.jpg](img/image-9R9D5O0E.jpeg)\n\
  \n图 51-7\n\n在设计模式下打开 `content_main.xml` 文件，并注意 `RecyclerView` 现在正在使用内置图像和示例文本数据：\n\
  \n![image-SDWPRIZJ.jpg](img/image-SDWPRIZJ.jpeg)\n\n图 51-8\n\n## 51.2 使用自定义示例数据\n\
  \n本章的最后一步是演示布局编辑器中使用自定义示例数据和图像。这需要创建一个示例数据目录并添加一些文本和图像文件。在 Project（项目）工具窗口中，右键点击\
