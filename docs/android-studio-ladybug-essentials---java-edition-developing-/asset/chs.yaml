  \ AVD 会话或物理 Android 设备上编译并运行应用程序。当应用程序运行后，在用户界面表单中输入客户名称和电话，并点击添加按钮。记录添加后，文本框将清空。重复这些步骤向数据库添加第二个客户。接下来，在客户名称字段中输入新添加客户的名称，并点击查询按钮。表单应更新为所选客户的\
  \ ID 和电话。点击删除按钮删除所选记录。随后按客户名称搜索将显示该记录已不存在。\n\n## 66.11 总结 (Summary)\n\n\n\n\n\n\
  本章通过步进的方式演示了 Android 应用中基于 SQLite 数据库存储的实际应用。为了进一步提升你的数据库开发技能，可以考虑扩展示例，使其包含更新数据库表中现有记录的能力。\n\
  \n## 1. 了解 Android Content Providers（内容提供者）\n\n上一章介绍了如何创建一个示例应用程序，用于使用 SQLite 数据库存储数据。通过这种方式实现时，数据对于该应用程序是私有的，因此在同一台设备上运行的其他应用程序无法访问。虽然对于许多类型的应用程序来说这可能是期望的行为，但不可避免地会出现某些情况，即代表应用程序存储的数据可能让其他应用程序受益。一个典型的例子是\
  \ Android 设备上内置“联系人”（Contacts）应用存储的数据。虽然联系人应用主要负责管理用户的通讯录详情，但这些数据也提供给任何需要访问的应用程序。Android\
  \ 之间的这种数据共享通过实现内容提供者来实现。\n\n## 2. 什么是 Content Provider？\n\n内容提供者在不同的 Android 应用程序之间提供了对结构化数据的访问。这些数据以数据表（与\
  \ SQLite 数据库非常相似）或文件句柄的形式暴露应用程序。这本质上涉及一种客户端/服务器架构的实现，其中请求访问数据的应用程序是客户端，内容提供者是服务器，代表客户端执行操作并返回结果。\n\
  \n一个成功的内容提供者实现涉及多个元素，每个元素将在本章的剩余部分进行详细介绍。\n\n## 3. Content Provider\n\n内容提供者是作为\
  \ `android.content.ContentProvider` 类的子类创建的。通常，负责管理要共享数据的应用程序将实现一个内容提供者，以便与其他应用程序共享这些数据。\n\
  \n创建内容提供者涉及实现一些方法来代表其他客户端应用程序管理数据。这些方法如下：\n\n### 3.1 onCreate()\n\n此方法在内容提供者首次创建时调用，应用于执行内容提供者所需的任何初始化任务。\n\
  \n### 3.2 query()\n\n当客户端请求从内容提供者检索数据时，将调用此方法。该方法识别检索的数据（单行或多行），执行数据提取，并将结果封装在 `Cursor`\
  \ 对象中返回。\n\n### 3.3 insert()\n\n当需要向提供者数据库插入新行时，会调用此方法。此方法必须识别数据的目标，执行插入操作并返回新添加行的完整\
  \ URI。\n\n### 3.4 update()\n\n当需要代表客户端更新现有行时调用的方法。该方法使用传递的参数来更新相应的表行，并返回操作后更新的行数。\n\
  \n### 3.5 delete()\n\n当需要从表中删除行时调用此方法。此方法删除指定的行，并返回被删除的行计数。\n\n### 3.6 getType()\n\
  \n返回由内容提供者存储的数据 MIME 类型。\n\n在内容提供者中实现这些方法时，重要的一点是，除了 `onCreate()` 方法外，它们都可能同时从多个进程中被调用，因此必须是线程安全的。\n\
  \n一旦实现了内容提供者，随之产生的问题就是如何在 Android 系统中识别该提供者。这就是内容 URI（content URI）发挥用场的地方。\n\n##\
  \ 4. Content URI\n\n一个 Android 设备可能包含多个内容提供者。因此，系统必须提供某种方法从一个提供者中识别出另一个。同样，单个内容提供者可能提供对多种形式内容的访问（通常以数据库表的形式）。因此，客户端应用程序需要一种方法来指定所需访问的底层数据。这是通过内容\
  \ URI 实现的。\n\n内容 URI 用于识别特定内容提供者中的特定数据。URI 的 Authority（授权）部分标识内容提供者，通常形式为内容提供者的包名。例如：\n\
  \n```\ncom.example.mydbapp.myprovider\n```\n\n可以通过在 authority 之后附加表名来引用提供者数据结构中的特定数据库表。例如，以下\
  \ URI 引用了内容提供者中名为 `products` 的表：\n\n```\ncom.example.mydbapp.myprovider/products\n\
  ```\n\n同样，可以通过向 URI 附加行 ID 来引用指定表中的特定行。例如，以下 URI 引用了 `products` 表中 `ID` 列存储值等于 3\
  \ 的行：\n\n```\ncom.example.mydbapp.myprovider/products/3\n```\n\n在内容提供者中实现 `insert`、`query`、`update`\
  \ 和 `delete` 方法时，这些方法将负责识别传入的 URI 是指向表中的特定行还是引用了多行，并采取相应的行动。鉴于 URI 可以扩展到多个层级，这可能是一项复杂的任务。然而，使用\
  \ `UriMatcher` 类可以显著简化这一过程，将在书中进行概述。\n\n## 5. Content Resolver（内容解析器）\n\n通过 `ContentResolver`\
  \ 对象访问内容提供者。应用程序可以通过调用应用程序上下文的 `getContentResolver()` 方法获取其内容解析器的引用。\n\n内容解析器对象包含一组与内容提供者镜像的方法（`insert`、`query`、`delete`\
  \ 等）。应用程序只需调用这些方法，并指定要执行操作内容的 URI。然后，内容解析器和内容提供者对象将通信以代表应用程序执行请求的任务。\n\n## 6. Manifest\
  \ 元素\n\n为了让内容提供者在 Android 系统中可见，必须在其所属应用程序的 Android manifest 文件中声明。这是通过 `<provider>`\
  \ 元素实现的，该元素必须包含以下项：\n\n- `android:authority` – 内容提供者的完整授权 URI。例如 `com.example.mydbapp.mydbapp.myprovider`。\n\
  - `android:name` – 实现内容提供者的类名。在大多数情况下，它的值与 authority 相同。\n\n同样，该元素也可以用于定义客户端应用程序为了访问底层数据而必须拥有的权限。如果没有声明权限，默认行为是允许所有应用程序访问。\n\
  \n权限可以设置为涵盖整个内容提供者，也可以限制特定的表和记录。\n\n## 7. 总结\n\n属于应用程序的数据通常对应用程序是私有的，其他应用程序无法访问。当需要共享数据时，就需要设置内容提供者。本章涵盖了组合实现应用程序间共享的基础元素，并概述了内容提供者、内容\
  \ URI 和内容解析器的概念。\n\n在下一章中，我们将扩展之前创建的 `SQLDemo` 项目，以便通过内容提供者提供底层客户数据。\n\n\n\n\n\n\
  如上一章所述，内容提供者（content providers）提供了一种机制，使得一个 Android 应用程序的数据可以被其他应用程序访问。在提供了对内容提供者的理论概述后，本章将通过扩展在“Android\
  \ SQLite 数据库教程”章节中创建的 `SQLDemo` 项目，来实现基于内容提供者的数据库访问。\n\n## 68.1 复制 SQLDemo 项目\n\n\
