  \ 文件中的两个 `tools` 属性行（如果 Android Studio 未能删除这些行，可以从代码视图中手动删除）。\n\n\n\n\n图 51-5\n\n\
  下一步是在卡片布局的视图中显示一些图像和不同的文本。这既可以通过布局编辑器提供的模板示例数据形式实现，也可以专门为此项目添加自定义的示例数据。将 `card_layout.xml`\
  \ 文件加载到布局编辑器中，选择 `ImageView`，并按照本章较早之前概述的方法显示设计时视图属性（Design-time View Attributes）面板。从\
