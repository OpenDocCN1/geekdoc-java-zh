  \ 总结\n\n本章演示了在 Android 应用项目中实现 App Link 支持的步骤，包括在 Android Studio 中使用 App Link 助手、App\
  \ Link URL 映射、意图过滤器、使用 Digital Asset Links 文件条目处理网站关联以及 App Link 测试。\n\n## 91. 使用\
  \ Material Design 3 主题进行工作\n\nAndroid 应用的外观旨在符合 Material Design 定义的一系列指南。Google\
  \ 开发 Material Design 是为了在不同的应用之间提供设计的一致性，同时允许应用开发者在颜色、排版和形状选择方面包含自己的品牌特色（这一概念被称为\
  \ Material 主题）。除了设计指南外，Material Design 还包含了一套用于设计用户界面布局的 UI 组件，我们在整本书中已经使用了其中的许多组件。\n\
  \n本章将概述主题化在 Android Studio 项目中是如何运作的，并探索如何修改为新创建的项目提供的默认设计配置，以满足您的品牌化需求。\n\n## 91.1\
  \ Material Design 2 与 Material Design 3\n\n在开始之前，重要的是注意 Google 正在从 Material Design\
  \ 2 过渡到 Material Design 3，且 Android Studio Ladybug 项目默认使用 Material Design 3。Material\
  \ Design 3 是 Material You 的基础，Material You 是 Android 12 中引入的一项功能，允许应用自动调整主题元素，以适应用户在设备上配置的偏好。例如，Material\
  \ Design 3 提供的动态颜色支持允许应用中使用的颜色自动适应以匹配用户的壁纸选择。\n\n## 91.2 理解 Material Design 主题\n\
  \n我们知道 Android 应用的用户界面是通过组合布局、文本字段和按钮等组件创建的。除非我们专门在 XML 布局资源文件中通过编写代码来重写某个颜色属性，否则这些组件将使用默认颜色显示。项目的主题定义了这些默认颜色。主题由一组颜色槽位（在\
  \ `themes.xml` 文件中声明）组成，并被分配了颜色值（在 `colors.xml` 文件中声明）。每个 UI 组件在内部都被设置为使用主题颜色槽位作为特定属性（例如\
  \ `Text` 组件的前景和背景颜色）的默认颜色。因此，我们可以通过更改分配给特定主题槽位的颜色来更改应用的全局主题。当应用运行时，当渲染用户界面时，所有组件都将使用新的默认颜色。\n\
  \n## 91.3 Material Design 3 主题\n\n在探索 Material Design 3 之前，我们必须考虑它如何在 Android Studio\
  \ 项目中被使用。应用项目使用的主题被声明为 `AndroidManifest.xml` 文件中 `application` 元素的属性，例如：\n\n```\n\
  xmlns:tools=\"http://schemas.android.com/tools\">\n.\n.\nandroid:supportsRtl=\"\
  true\"\nandroid:theme=\"@style/Theme.MyDemoApp\"\ntools:targetApi=\"31\">\n.\n.\n\
  ```\n\n如之前讨论过的，所有与项目主题相关的文件都包含 `res -> values` 文件夹下的 `colors.xml` 和 `themes.xml`\
  \ 文件中，如图 91-1 所示：\n\n![image-ZOIIENJH.jpg](img/image-ZOIIENJH.jpeg)\n\n图 91-1\n\n\
  主题本身声明位于 `themes` 文件夹下的两个 `themes.xml` 文件中。这些资源文件声明了不同的色调，包含 Material 主题颜色槽位，用于设备处于亮色或深色（夜间）模式时。注意，每个文件中的\
  \ `style` 名称属性必须与 `AndroidManifest.xml` 文件中引用的名称匹配，例如：\n\n这些颜色槽位（也称为颜色属性）被 Material\
  \ 组件用于在屏幕上渲染时设置颜色。例如，`colorPrimary` 颜色槽位用作 `Material Button` 组件的背景颜色。\n\nMD3 中的颜色槽位分为\
  \ Primary（主）、Secondary（次要）、Tertiary（三级）、Error（错误）、Background（背景）和 Surface（表面）。这些槽位进一步细分为由基础颜色和“在其之上（on）”基础颜色组成的对。这通常对应\
  \ Material 组件的背景颜色和前景颜色。\n\n用于着色的特定组在不同组件之间会有不同。例如，`Material Button` 组件将使用 `colorPrimary`\
  \ 基础颜色作为背景颜色，使用 `colorOnPrimary` 作为其内容（即它显示的文本或图标）。另一方面，`FloatingActionButton` 组件使用\
  \ `colorPrimaryContainer` 作为背景颜色，使用 `colorOnPrimaryContainer` 作为前景。通常可以通过更改主题文件中的颜色设置并查看布局编辑器中的渲染结果，来快速识别特定组件类型的正确组。\n\
  \n假设我们需要将 `colorPrimary` 改为红色。我们通过在 `colors.xml` 文件中为红色添加一个新条目，然后将其分配给 `themes.xml`\
  \ 文件中的 `colorPrimary` 槽位来实现。因此，MD3 主题夜间模式下的 `colorPrimary` 槽位读取如下：\n\n```\n@color/my_bright_primary\n\
  ```\n\n该颜色在 `colors.xml` 文件中声明：\n\n```\n.\n.\n#FC0505\n.\n.\n```\n\n## 91.4 构建自定义主题\n\
  \n正如我们所见，实现主题的代码工作相对简单。然而，困难的部分通常是选择组成主题的互补颜色。幸运的是，Google 开发了一个工具，可以轻松为应用设计自定义颜色和字体主题。该工具被称为\
  \ Theme Builder，地址如下：\n\nhttps://m3.material.io/theme-builder\n\n图 91-2 显示了 Theme\
  \ Builder 的版本。然而，Google 每几周就会重新设计 Builder，因此您看到的界面可能与当前设计不符。\n\n![image-ZOIIENJH.jpg](img/image-ZOIIENJH.jpeg)\n\
  \n图 91-2\n\n可以通过在上方提供您选择的源颜色（A）、选择标准壁纸（B）、上传图像（C）或进行单独的核心颜色选择（D）来生成自定义 Material\
  \ 颜色主题。标记 E 的按钮预览了亮色和深色模式下的配色方案。\n\n标记 F 的区域显示了示例应用界面、亮/深色配色方案表以及根据您的颜色选择更新的组件。由于面板大于典型的浏览器窗口，你需要向下滚动查看所有信息。\n\
  \n一旦定义了主题颜色，点击“选择字体”（G）按钮将显示图 91-3 所示的屏幕，您可以在那里选择应用使用的字体：\n\n![image-C6G5YZ5B.jpg](img/image-C6G5YZ5B.jpeg)\n\
  \n图 91-3\n\n要将主题整合到您的设计中，点击上面的导出主题按钮（标记为 A）并选择 Android Views (XML) 。下载后，`themes.xml`\
  \ 和 `colors.xml` 文件可以替换项目中的现有文件。注意，导出的 `themes.xml` 文件中的主题名称必须更改为与您的项目匹配。\n\n##\
  \ 91.5 总结\n\n\n\n\n\nMaterial Design 提供了定义 Android 应用程序外观的指南和组件。通过设计指定显示应用时使用的颜色、字体和形状的主题，可以为应用应用个人品牌设计。Google\
  \ 最近引入了 Material Design 3，它取代了 Material Design 2 并支持 Material You 的新功能，包括动态颜色。Google\
  \ 还提供了 Material Theme Builder，用于设计你自己的主题，这降低了选择互补主题颜色的任务难度。一旦使用该工具被用来设计了主题，就可以导出相应的文件并在\
  \ Android Studio 项目中使用它们。\n\n# 92. Material Design 3 主题与动态颜色教程\n\n本章将向你展示如何使用 Material\
  \ Theme Builder 工具创建一个新的 Material Design 3 主题，并将其集成到 Android Studio 项目中。教程还将演示如何为应用添加对动态主题颜色的支持并测试。\n\
  \n## 92.1 创建 ThemeDemo 项目\n\n在欢迎界面选择 `New Project`（新建项目）选项，在弹出的新项目对话框中，点击 `Next`（下一步）按钮之前选择\
  \ `Empty Views Activity` 模板。\n\n在 `Name`（名称）字段中输入 `ThemeDemo`，并指定 `com.ebookfrenzy.themedemo`\
  \ 为包名。在点击 `Finish`（完成）按钮之前，将 `Minimum API level`（最低 API 级别）设置为 `API 26`：`Android\
  \ 8.0 (Oreo)`，并将 `Language`（语言）菜单设置为 `Java`。\n\n## 92.2 设计用户界面\n\n主活动将由一个简单的布局组成，包含一些用户界面组件，这些组件使我们能够看到在本章之后执行的主题工作的效果。关于\
  \ MD3 组件的信息，请参考以下网页：\n\n[`material.io/blog/migrating-material-3`](https://material.io/blog/migrating-material-3)\n\
  \n布局将在 `activity_main.xml` 文件中设计，该文件目前包含一个的 `Text` 视图。在布局编辑器中打开此文件，删除 `Text` 视图，关闭\
  \ `Autoconnect`（自动连接）模式（图 92-1 中标记为 A），并点击按钮清除布局中的所有约束（B）。\n\n![image-0RK7UNDL.jpg](img/image-0RK7UNDL.jpeg)\n\
  \n图 92-1\n\n从 `Palette` 的 `Buttons` 部分将 `Chip`、`CheckBox`、`Switch` 和 `Button` 视图拖到布局画布上。接下来，将一个\
  \ `FloatingActionButton` 拖到布局画布上，将其放置在 `Button` 组件下方。当提示选择显示在 `FloatingActionButton`\
  \ 上的图标时，从资源工具窗口内选择 `ic_lock_power_off` 图标，如图 92-2 所示：\n\n![image-31VUKYAR.jpg](img/image-31VUKYAR.jpeg)\n\
  \n图 92-2\n\n将 `Chip` 组件的文本属性改为“This is my chip”，并将 `chipIcon` 属性设置为 `@android:drawable/ic_btn_speak_now`，以便布局看起来像图\
  \ 92-3 左侧所示的：\n\n![image-3Q7WGERA.jpg](img/image-3Q7WGERA.jpeg)\n\n图 92-3\n\n为了设置约束，选择所有组件，右键点击\
  \ `Chip` 视图，并在弹出的菜单中选择 `Chains -> Create Vertical Chain`（链 -> 创建垂直链）。重复此步骤，这次选择\
  \ `Center -> Horizontally in Parent`（在父布局水平居中）菜单选项。\n\n在设备或模拟器上编译并运行应用，验证用户界面是否与上述图\
  \ 92-3 所示一致。下一步是创建一个自定义主题并将其应用于项目。\n\n## 92.3 构建新主题\n\n项目的主题将使用 `Material Theme\
  \ Builder` 设计和生成。打开浏览器窗口并导航到以下 URL 以访问构建器工具：\n\nhttps://m3.material.io/theme-builder\n\
  \n一旦加载了构建器，选择一张壁纸，然后点击 `Core colors`（核心颜色）部分的 `Primary`（主色）圆形以显示颜色选择器。从颜色选择器中选择任何你认为适合主题主题的颜色，然后点击\
  \ `Apply`（应用）按钮：\n\n![image-LIG6XMLN.jpg](img/image-LIG6XMLN.jpeg)\n\n图 92-4\n\n\
  检查颜色方案并使用 `Core colors` 面板进行任何必要的颜色调整，直到你对颜色槽满意。一旦主题准备绪，点击 `Pick your fonts`（选择你的字体）按钮并进行字体选择。\n\
  \n点击 `Export theme`（导出主题）按钮。在弹出的面板中，点击 `Export`（导出）并选择 `Jetpack Compose (Theme.kt)`\
  \ 选项。根据提示，将文件保存到计算机文件系统的合适位置。主题将被保存为名为 `material-theme.zip` 的压缩文件。\n\n使用适用于你操作系统的工具解压主题文件，它应该包含在名为\
  \ `material-theme` 的文件夹中的以下文件夹和文件：\n\n- `values/colors.xml` - 亮色模式的颜色定义。\n- `values/themes.xml`\
  \ - 亮色模式的主题。\n- `values/colors.xml` - 暗色模式的颜色定义。\n- `values-night/themes.xml` -\
  \ 暗色模式的主题。\n\n现在主题文件已经生成，需要将它们集成到 Android Studio 项目中\n\n## 92.4 将主题添加到项目\n\n在将新主题添加到项目之前，首先需要删除旧的主题文件。如果\
  \ `Project` 工具窗口处于 `Project Files`（项目文件）模式，这更简单。要切换模式，使用 `Project` 工具窗口顶部的菜单如下所示，并选择\
  \ `Project Files` 模式：\n\n![image-HXVEESSH.jpg](img/image-HXVEESSH.jpeg)\n\n图 92-5\n\
  \n在 `Project Files` 模式下，导航到 `app -> src -> main -> res -> values` 文件夹并删除 `colors.xml`\
  \ 和 `themes.xml` 文件。\n\n打开你操作系统的文件系统，找到 `values` 文件夹中的 `colors.xml` 和 `themes.xml`\
  \ 文件，并将它们复制到 `values-night` 文件夹。将项目窗口切换回 Android 模式，此时资源文件应符合图 92-6：\n\n![image-9XOOYKNF.jpg](img/9XOOYKNF.jpeg)\n\
  \n图 92-6\n\n接下来，修改亮色 `themes.xml` 文件以匹配当前项目：\n\n`@color/md_primary`\n\n对 `themes.xml`\
  \ (night) 文件重复这些步骤。\n\n返回 `activity_main.xml` 文件，确认用户界面使用的是自定义主题渲染，使用下方的按钮切换亮暗模式：\n\
  \n![image-BKM4NDY.jpg](img/image-BKM4NDY.jpeg)\n\n图 92-7\n\n## 92.5 启用动态颜色支持\n\n\
  应用需要在运行 Android 12 或更高版本且具有正确壁纸设置的设备或模拟器上运行以测试动态颜色。在设备或模拟器上，启动 `Settings`（设置）应用并在列表中选择\
  \ `Wallpaper & style`（壁纸与样式）。在壁纸设置屏幕上，点击浏览壁纸（图 92-8 中标记为 A），选择一张与主题颜色差异很大的图像。一旦选择，将其设置为桌面。\n\
  \n返回 `Wallpaper & styles` 屏幕并确保选择了 `Wallpaper` 颜色选项（B）。每点击一个选项，壁纸示例都会更改以反映选择：\n\n\
  ![image-K7PXA3C.jpg](img/image-K7PXA3C.jpeg)\n\n由于\n\n要启用动态颜色，我们需要调用 `DynamicColors`\
  \ 类的 `applyToActivitiesIfAvailable()` 方法。为了为整个应用启用动态颜色支持，需要在自定义 `Application` 实例的\
  \ `onCreate()` 方法内部调用它。首先在 `app -> java -> com.ebookfrenzy.themedemo` 下向项目添加一个新的\
  \ Java 类文件，命名为 `ThemeDemoApplication.java`，并修改其内容如下：\n\n\n\n\n\n```java\n@Override\n\
  public void onCreate() {\n    super.onCreate();\n    DynamicColors.applyToActivitiesIfAvailable(this);\n\
  }\n```\n\n创建自定义的 `Application` 类后，我们必须配置项目以使用该类而不是默认的 `Application` 实例。要实现这一点，请编辑\
  \ `AndroidManifest.xml` 文件并添加一个引用新类的 `android:name` 元素：\n\n`package=\"com.ebookfrenzy.themedemo\"\
  `\n`android:name=\".ThemeDemoApplication\"`\n`android:allowBackup=\"true\"`\n\n\
  构建并运行应用，并注意布局使用了与壁纸颜色匹配的主题。将 `ThemeDemo` 应用放入后台，返回到“壁纸与样式”（Wallpaper & styles）设置屏幕，并选择不同的壁纸。再次将\
  \ `ThemeDemo` 应用带回前台。此时，它将已经动态调整以匹配新的壁纸。\n\n## 92.6 总结\n\n在本章中，我们使用 `Material Theme\
  \ Builder` 设计了一个新主题，并解释了将生成的主题文件集成到 `Android Studio` 项目中的步骤。最后，本章演示了如何实现和使用 `Material\
  \ You` 动态色彩功能。\n\n## 93. Android Studio 中的 Gradle 概述\n\n在“Gradle 版本目录指南”章节中，我们引入了库版本目录，并解释了\
  \ `Gradle` 构建系统如何依赖它来确保项目使用正确的库和版本进行构建。除了在中间随后的章节中对版本目录和库依赖进行了一些修改外，人们通常认为 `Android\
  \ Studio` 会采取必要的步骤来编译和运行已创建的应用程序项目。`Android Studio` 一直在后台使用一个名为 `Gradle` 的系统来实现这一点。\n\
  \n现在是时候查看如何使用 `Gradle` 来编译和打包应用项目的各种元素，并开始探索当在 `Android Studio` 中构建项目需要更高级的需求时，如何配置此系统了。\n\
  \n## 93.1 Gradle 概述\n\n`Gradle` 是一个自动化构建工具包，允许通过一组构建配置文件来配置和管理项目的构建方式。这包括定义项目将如何被构建、成功构建需要满足哪些依赖项，以及构建过程的最终结果（或结果）应该是什么。\n\
  \n`Gradle` 的优势在于它为开发者提供的灵活性。`Gradle` 系统是一个自包含的、基于命令行的环境，可以通过插件集成到其他环境中。在 `Android\
  \ Studio` 的情况下，`Gradle` 的集成是通过适当命名的 `Android Studio Plugin` 提供的。\n\n尽管 `Android\
  \ Studio Plugin` 允许在 `Android Studio` 内部启动和管理 `Gradle` 任务，但仍然可以使用 `Gradle` 命令行封装来构建基于\
  \ `Android Studio` 的项目，包括在未安装 `Android Studio` 的系统中。\n\n构建项目的配置规则声明在基于 `Groovy`\
  \ 编程语言的 `Gradle` 构建文件和脚本中。\n\n## 93.2 Gradle 与 Android Studio\n\n`Gradle` 为构建 Android\
  \ 应用项目带来了许多强大的功能。一些关键特性如下：\n\n\n\n### 93.2.1 合理的默认值\n\n`Gradle` 实现了一个“约定优于配置”（convention\
  \ over configuration）的概念。这意味着 `Gradle` 拥有一组预定义的合理默认配置设置，除非构建文件中的设置覆盖了它们，否则将使用这些设置。这意味着可以使用开发者所需的最小配置进行构建。只有当默认配置不能满足你的构建需求时，才需要更改构建文件。\n\
  \n### 93.2.2 依赖项\n\n`Gradle` 功能的另一个关键领域是依赖项。例如，考虑 `Android Studio` 项目中的一个模块，它触发了一个\
  \ `intent` 来加载项目中的另一个模块。第一个模块实际上对第二个模块有依赖关系，因为如果无法在运行时找到并启动第二个模块，应用程序将无法构建成功。这种依赖关系可以在第一个模块的\
  \ `Gradle` 构建文件中声明，以便将第二个模块包含在应用构建中，或者在无法找到或构建第二个模块时标记错误。依赖项的其他示例是项目编译和运行时所依赖的库和\
  \ `JAR` 文件。\n\n`Gradle` 依赖项可以分为本地或远程。本地依赖项引用执行构建的计算机系统本地文件系统上的项。远程依赖项引用存在远程服务器（通常称为仓库）上的项。\n\
  \n`Android Studio` 项目的远程依赖是使用另一个名为 `Maven` 的项目管理工具来处理的。如果在 `Gradle` 构建文件中使用 `Maven`\
  \ 语法声明了远程依赖项，则该依赖项将从指定的仓库自动下载并包含在构建过程中。例如，下面的依赖项声明将导致从 Google 仓库将 `AppCompat` 库添加到项目项目中：\n\
  \n```gradle\nimplementation(libs.androidx.appcompat)\n```\n\n### 93.2.3 构建变体\n\n\
  除了依赖项外，`Gradle` 还为 `Android Studio` 项目提供构建变体支持。这允许从单个项目构建应用程序的多个变体。Android 运行在许多不同的设备上，涵盖各种处理器类型和屏幕尺寸。为了尽可能针对广泛设备类型和尺寸，通常需要构建应用程序的多个变体（例如，一个用于手机的用户界面，另一个用于平板大小的屏幕）。通过使用\
  \ `Gradle`，这在 `Android Studio` 中是可以实现的。\n\n### 93.2.4 Manifest 条目\n\n每个 `Android\
  \ Studio` 项目都关联有一个 `AndroidManifest.xml` 文件，其中包含有关应用程序的配置细节。在 `Gradle` 构建文件中可以指定多个清单条目，这些条目会在项目构建时自动生成到清单文件中。这种功能与构建变体功能相结合，允许为每个构建变体配置不同的应用版本号、应用\
  \ ID 和 SDK 版本信息。\n\n### 93.2.5 APK 签名\n\n“创建、测试和上传 Android App Bundle”章节介绍了如何使用\
  \ `Android Studio` 环境创建签名发布 APK。也可以将通过 `Android Studio` 用户界面输入的签名信息包含在 `Gradle`\
  \ 构建文件中，以便从命令行生成签名 APK。\n\n### 93.2.6 ProGuard 支持\n\n`ProGuard` 是 `Android Studio`\
  \ 自带的一个工具，它可以优化、压缩和混淆 Java 字节码，使其更高效且更难反向工程（通过分析编译后的 Java 字节码来识别应用程序逻辑的方法）。`Gradle`\
  \ 构建文件允许你控制构建应用时是否运行 `ProGuard`。\n\n## 93.3 属性和设置 Gradle 构建文件\n\n用于构建的 gradle 由配置、属性和设置文件组成。例如，`gradle.properties`\
  \ 文件主要包含与 Java 虚拟机 (`JVM`) 命令行标志相关的特殊设置，项目是否使用 `AndroidX` 库以及 Kotlin 代码风格支持。作为典型用户，你可能不需要更改此文件中的任何设置。\n\
  \n相反，`settings.gradle.kts` 文件定义了当构建系统需要下载和安装构建项目所需的额外库和插件时，搜索哪些在线仓库，以及项目名称。典型的 `settings.gradle.kts`\
  \ 文件如下：\n\n```kotlin\npluginManagement {\n    repositories {\n        google()\n\
  \        mavenCentral()\n        gradlePluginPortal()\n    }\n}\n\ndependencyResolutionManagement\
  \ {\n```\n\n\n\n\n\n```\nrepositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n\
  \nrepositories {\n    google()\n    mavenCentral()\n}\n\n}\n\nrootProject.name =\
  \ \"ThemeDemo\"\n\ninclude(\":app\")\n```\n\n与 `gradle.properties` 文件一样，不太可能对此文件进行任何更改。\n\
  \n## 93.4 根级 Gradle 构建文件\n\n一个完整的 Android Studio 项目包含了构建 Android 应用程序所需的所有内容，由模块、库、清单文件和\
  \ Gradle 构建文件组成。\n\n每个项目包含一个根级 Gradle 构建文件。该文件被列为 `build.gradle.kts`（项目: )，并可以在项目工具窗口中找到，如图\
  \ 93-1 所示：\n\n![image-F5TD31IT.jpg](img/image-F5TD31IT.jpeg)\n\n图 93-1\n\n默认情况下，根级\
  \ Gradle 构建文件的内容读取如下：\n\n```kotlin\nplugins {\n    alias(libs.plugins.android.application)\
  \ apply false\n}\n```\n\n在大多数情况下，没有必要对此构建文件进行任何更改。\n\n## 93.5 模块级 Gradle 构建文件\n\n\
  一个 Android Studio 应用项目由一个或多个模块组成。假设有一个名为 `GradleSample` 的假设应用项目，它分别包含名为 `Module1`\
  \ 和 `Module2` 的模块。在这种情况下，每个模块都需要它自己的 Gradle 构建文件。从项目结构来看，这些文件位置如下：\n\n• `Module1/build.gradle.kts`\n\
  • `Module2/build.gradle.kts`\n\n默认情况下，`Module1/build.gradle.kts` 文件将类似于下面的列表：\n\n\
  ```kotlin\nalias(libs.plugins.android.application) apply false\n}\n\nandroid {\n\
  \    namespace = \"com.example.gradlesample\"\n    compileSdk = 35\n    defaultConfig\
  \ {\n        applicationId = \"com.example.gradlesample\"\n        minSdk = 26\n\
  \        targetSdk = 35\n        versionCode = 1\n        versionName = \"1.0\"\n\
  \        testInstrumentationRunner = \"androidx.test.runner.AndroidJUnitRunner\"\
  \n    }\n    buildTypes {\n        release {\n            isMinifyEnabled = false\n\
  \            proguardFiles(\n                getDefaultProguardFile(\"proguard-android-optimize.txt\"\
  ),\n                \"proguard-rules.pro\"\n            )\n        }\n    }\n  \
  \  compileOptions {\n        sourceCompatibility = JavaVersion.VERSION_11\n    \
  \    targetCompatibility = JavaVersion.VERSION_11\n    }\n}\n\ndependencies {\n\
  \    implementation(libs.androidx.appcompat)\n    implementation(libs.material)\n\
  \    implementation(libs.androidx.activity)\n    implementation(libs.androidx.constraintlayout)\n\
  \    testImplementation(libs.junit)\n    androidTestImplementation(libs.androidx.junit)\n\
  \    androidTestImplementation(libs.androidx.espresso.core)\n}\n```\n\n从文件内容可以看出，构建文件首先声明了使用\
  \ Gradle Android 插件：\n\n```kotlin\nalias(libs.plugins.android.application) apply\
  \ false\n}\n```\n\n文件的 `android` 部分声明了项目的命名空间，然后指明了构建 `Module1` 时将使用的 SDK 版本。\n\n\
  ```kotlin\nandroid {\n    namespace = \"com.example.gradlesample\"\n    compileSdk\
  \ = 35\n}\n```\n\n`defaultConfig` 部分中声明的项定义了在构建期间生成到模块 `AndroidManifest.xml` 文件中的元素。这些设置可以在构建文件中修改，它们取自模块首次创建时在\
  \ Android Studio 中入的设置：\n\n```kotlin\ndefaultConfig {\n    applicationId = \"com.example.gradlesample\"\
  \n    minSdk = 26\n    targetSdk = 35\n    versionCode = 1\n    versionName = \"\
  1.0\"\n    testInstrumentationRunner = \"androidx.test.runner.AndroidJUnitRunner\"\
  \n}\n```\n\n`buildTypes` 部分包含了关于在构建应用发布版本时是否以及如何对 APK 文件上运行 ProGuard 的指令：\n\n```kotlin\n\
  buildTypes {\n    release {\n        isMinifyEnabled = false\n        proguardFiles(\n\
  \            getDefaultProguardFile(\"proguard-android-optimize.txt\"),\n      \
  \      \"proguard-rules.pro\"\n        )\n    }\n}\n```\n\n按照目前的配置，构建 `Module1`\
  \ 时不会运行 ProGuard。要启用 ProGuard，必须将 `minify` 项从 `false` 改为 `true`。`proguard-rules.pro`\
  \ 文件可以在项目的模块目录中找到。对此文件进行的更改将覆盖 `proguard-android.txt` 文件中的默认设置，后者位于 Android SDK\
  \ 安装目录下的 `sdk/tools/proguard` 目录。\n\n由于此文件中没有声明调试 `buildType`，将使用默认值（不带 ProGuard\
  \ 构建、使用调试密钥签名、并启用调试符号）。\n\n模块构建文件中还可以包含一个名为 `productFlavors` 的额外部分，以便创建多个构建变体。\n\
  \n接下来，包含了一些指令，用于指定构建项目时使用的 Java 编译器版本：\n\n```kotlin\ncompileOptions {\n    sourceCompatibility\
  \ JavaVersion.VERSION_11\n    targetCompatibility JavaVersion.VERSION_11\n}\n```\n\
  \n最后，`dependencies` 部分列出了模块依赖的任何本地和远程依赖。上述示例文件中的依赖行指定了需要从 Android 仓库包含的 Android\
  \ 库：\n\n```kotlin\ndependencies {\n    implementation(libs.androidx.appcompat)\n\
  \    implementation(libs.material)\n    implementation(libs.androidx.activity)\n\
  \    implementation(libs.androidx.constraintlayout)\n    testImplementation(libs.junit)\n\
  \    androidTestImplementation(libs.androidx.junit)\n    androidTestImplementation(libs.androidx.espresso.core)\n\
  }\n```\n\n## 93.6 在构建文件中配置签名设置\n\n“创建、测试和上传 Android App 包”章节涵盖了使用 Android Studio\
  \ 界面设置密钥的步骤。这些设置可以在 `build.gradle.kts` 的 `signingConfigs` 部分进行配置。例如：\n\n```kotlin\n\
  signingConfigs {\n    release {\n        storeFile = file(\"release.keystore\")\n\
  \        storePassword = \"yourpassword\"\n        keyAlias = \"youralias\"\n  \
  \      keyPassword = \"yourkeypassword\"\n    }\n}\n```\n\n上述示例将密码信息直接嵌入到构建文件中。另一种方法是使用系统环境变量提取这些值：\n\
  \n```kotlin\nsigningConfigs {\n    release {\n        storeFile = file(\"release.keystore\"\
  )\n        storePassword = getenv(\"KEYSTOREPASSWD\")\n        keyAlias = \"youralias\"\
  \n        keyPassword = getenv(\"KEYPASSWD\")\n    }\n}\n```\n\n还有一种方法是配置构建文件，以便在构建过程中提示密码：\n\
  \n```kotlin\nsigningConfigs {\n    release {\n        storeFile = file(\"release.keystore\"\
  )\n        storePassword = console().readLine(\"\\nEnter Keystore password: \")\n\
  \        keyAlias = \"youralias\"\n        keyPassword = console().readLine(\"\\\
  nEnter Key password: \")\n    }\n}\n```\n\n并在 `buildTypes` 中应用该配置：\n\n```kotlin\n\
  buildTypes {\n    release {\n        signingConfig signingConfigs.release\n    }\n\
  }\n```\n\n## 93.7 从命令行运行 Gradle 任务\n\n每个项目都包含一个 Gradle 封装工具，用于从命令行调用 Gradle 任务。该工具位于项目文件夹根目录下。虽然该工具在\
  \ Windows 系统上是可以执行的，但在 Linux 和 macOS 上可能需要启用执行权限才能使用。要启用执行权限，打开终端窗口，进入所需封装的项目目录，并执行以下命令：\n\
  \n```bash\nchmod +x gradlew\n```\n\n一旦文件具有执行权限，将需要将其路径添加到 `$PATH` 环境变量中，或者在运行时名称前加上\
  \ `./`。例如：\n\n```bash\n./gradlew tasks\n```\n\n\n\n\n\n在大多数情况下，Android Studio 会在后台执行应用构建，无需开发者干预。此构建过程由\
  \ `Gradle` 系统处理，`Gradle` 是一个自动化构建工具包，旨在通过一组构建配置文件来配置和管理项目的构建方式。虽然 `Gradle` 的默认行为对于满足许多基础项目的构建需求，但对于更复杂的项目，配置构建过程是不可避免的。本章概述了\
  \ Android Studio 项目背景下的 `Gradle` 构建系统和配置文件。\n\n## 索引\n\n### 符号\n- 428\n- 255\n-\
