  \n.\n\n.\n\nprivate FragmentTextBinding binding;\n\n@Override\npublic View onCreateView(LayoutInflater\
  \ inflater, ViewGroup container,\n\nBundle savedInstanceState) {\n\n// 载入此 fragment\
  \ 的布局\n\nreturn inflater.inflate(R.layout.fragment_text, container, false);\n\n\
  binding = FragmentTextBinding.inflate(inflater, container, false);\n\nreturn binding.getRoot();\n\
  \n}\n\n@Override\npublic void onDestroyView() {\n\nsuper.onDestroyView();\n\nbinding\
  \ = null;\n\n}\n```\n\n### 33.6 将 Fragments 添加到 Activity\n\n应用程序的主 activity 关联了一个名为\
  \ `activity_main.xml` 的 XML 布局文件。在本例中，fragment 将使用该文件中的元素添加到 activity 中。使用 `Project`\
  \ 工具窗口，导航到 `FragmentExample` 项目的 `app -> res -> layout` 部分，并双击 `activity_main.xml`\
  \ 文件将其加载到 Android Studio 布局编辑器工具中。\n\n在设计模式下的布局编辑器工具中，选择并删除布局中的默认 `TextView` 对象，并在调色板中选择\
  \ `Common` 类别。从视图列表中拖出 `FragmentContainerView` 组件并将其释放到布局上，使其水平居中并放置在虚线出现的位置，这表示顶部布局边距：\n\
  \n![image-CHF99CON.jpg](img/image-CHF99CON.jpeg)\n\n图 33-5\n\n将 fragment 释放到布局上时，将出现对话框，显示当前项目中可用的\
