  \n## 68.4 构建 Authority 和内容 URI\n\n如上一章所述，所有内容提供者都必须关联有一个权威（authority）和一个内容 URI。在实践中，权威通常是内容提供者类本身的完整包名，在本例中，即在上一节创建新的内容提供者类时声明的\
  \ `com.ebookfrenzy.sqldemo.provider.MyContentProvider`。\n\n内容 URI 将根据应用程序的要求而异，但对于此示例，它将包含权威并在末尾附加数据库表名。在\
  \ `MyContentProvider.java` 文件中，进行以下修改：\n\n```java\npackage com.ebookfrenzy.sqldemo.provider;\n\
  \n.\n.\n\npublic class MyContentProvider extends ContentProvider {\n\nprivate static\
  \ final String AUTHORITY =\n\"com.ebookfrenzy.sqldemo.provider.MyContentProvider\"\
  ;\n\nprivate static final String CUSTOMERS_TABLE = \"customers\";\n\npublic static\
  \ final Uri CONTENT_URI =\nUri.parse(\"content://\" + AUTHORITY + \"/\" +\nCUSTOMERS_TABLE);\n\
  \n.\n```\n```上述语句首先创建一个名为 `AUTHORITY` 的 `String` 对象并将权威字符串赋值给它。同样，创建一个名为 `CUSTOMERS_TABLE`\
  \ 的第二个 `String` 对象，并用数据库表名初始化。最后，将这两个字符串元素组合，加上前缀 `content://` 并使用 `Uri` 类的 `parse()`\
  \ 方法转换为 `Uri` 对象。结果赋值给变量 `CONTENT_URI`。\n\n## 68.5 在内容提供者中实现 URI 匹配\n\n当内容提供者的方法被调用时，它们将接收一个指示要执行操作的\
  \ `URI` 作为参数。该 `URI` 可能采取特定表中特定行的引用形式。`URI` 也可能更通用，例如仅指定数据库表。每个方法都有责任识别 `Uri` 类型并采取相应的行动。使用\
  \ `UriMatcher` 实例可以极大简化这一任务。一旦创建了 `UriMatcher` 实例，就可以将其配置为在被要求时返回与其检测到的 `URI` 类型对应的特定整数值。在本教程中，我们将配置\
  \ `UriMatcher` 实例，当 `URI` 引用整个 customers 表时返回值 `1`，当 `URI` 引用 customers 表特定行的 ID\
  \ 时返回值 `2`。在开始创建 `UriMatcher` 实例之前，我们首先创建两个整数变量来表示这两种 URI 类型：\n\n```java\npackage\
  \ com.ebookfrenzy.sqldemo.provider;\n\n.\n.\n\nimport android.database.sqlite.SQLiteDatabase;\n\
  import android.database.sqlite.SQLiteQueryBuilder;\nimport android.content.UriMatcher;\n\
  import android.text.TextUtils;\nimport com.ebookfrenzy.sqldemo.MyDBHandler;\n\n\
  public class MyContentProvider extends ContentProvider {\n\nprivate static final\
  \ String AUTHORITY =\n\"com.ebookfrenzy.sqldemo.provider.MyContentProvider\";\n\n\
  private static final String CUSTOMERS_TABLE = \"customers\";\n\npublic static final\
  \ Uri CONTENT_URI =\nUri.parse(\"content://\" + AUTHORITY + \"/\" +\nCUSTOMERS_TABLE);\n\
  \npublic static final int CUSTOMERS = 1;\n```\n\n\n\n\n\n```javapublic static final\
  \ int CUSTOMER_ID = 2;\n```\n\n在声明了 `Uri` 类型变量后，现在是时候添加代码来创建一个 `UriMatcher` 实例并配置它返回相应的变量了：\n\
  \n```java\npublic class MyContentProvider extends ContentProvider {\n\n    private\
  \ MyDBHandler myDB;\n\n    public static final int CUSTOMERS = 1;\n    public static\
  \ final int CUSTOMER_ID = 2;\n    private static final UriMatcher sURIMatcher =\n\
  \            new UriMatcher(UriMatcher.NO_MATCH);\n\n    static {\n        sURIMatcher.addURI(AUTHORITY,\
  \ CUSTOMERS_TABLE, CUSTOMERS);\n        sURIMatcher.addURI(AUTHORITY, CUSTOMERS_TABLE\
  \ + \"/#\", CUSTOMER_ID);\n    }\n}\n```\n\n`UriMatcher` 实例（命名为 `sURIMatcher`）现在已准备好在\
  \ URI 仅引用客户表时返回 `CUSTOMERS` 的值，当 URI 包含表中特定行的 ID 时，返回 `CUSTOMER_ID`。\n\n## 68.6\
  \ 实现 Content Provider 的 `onCreate()` 方法\n\n当内容提供者类被创建并初始化时，将调用该类的 `onCreate()` 方法。在此方法内部，必须执行该类的任何初始化任务。对于此示例，所有需要执行的操作是在在“Android\
  \ SQLite 数据库教程”中实现的 `MyDBHandler` 类的实例。一旦创建了此实例，它将能够被类中的其他方法访问，因此还需要对数据库处理程序进行声明，这导致了\
  \ `MyContentProvider.java` 文件的以下代码更改：\n\n```java\n@Override\npublic boolean onCreate()\
  \ {\n    myDB = new MyDBHandler(getContext(), null, null, 1);\n    return false;\n\
  }\n```\n\n## 68.7 实现 Content Provider 的 `insert()` 方法\n\n当客户端应用程序或活动请求将数据插入到底层数据库时，将调用内容提供者类的\
  \ `insert()` 方法。然而，此时项目中的 `MyContentProvider.kt` 文件中仅存在一个存根方法（stub method），其内容如下：\n\
  \n```java\npublic Uri insert(Uri uri, ContentValues values) {\n    TODO(\"实现此方法以处理插入新行的请求。\"\
  );\n}\n```\n\n传递给方法的参数是指定插入目标位置的 `URI` 以及包含要插入数据的 `ContentValues` 对象。\n\n该方法现在需要修改以执行以下任务：\n\
  \n- 使用 `sUriMatcher` 对象识别 URI 类型。\n- 如果 `URI` 无效，则抛出异常。\n- 获取底层 `SQLite database`\
  \ 可写实例的引用。\n- 执行 SQL 插入操作将数据插入到数据库表中。\n- 通知相应的内容解析器（content resolver）数据库已修改。\n-\
  \ 返回新添加表行的 `URI`。\n\n将这些需求整合后得到了修改的 `insert()` 方法，其内容如下：\n\n```java\n@Override\n\
  public Uri insert(Uri uri, ContentValues values) {\n    int uriType = sURIMatcher.match(uri);\n\
  \    SQLiteDatabase sqlDB = myDB.getWritableDatabase();\n    long id = 0;\n    switch\
  \ (uriType) {\n        case CUSTOMERS:\n            id = sqlDB.insert(MyDBHandler.TABLE_CUSTOMERS,\
  \ null, values);\n            break;\n        default:\n            throw new IllegalArgumentException(\"\
  Unknown URI: \" + uri);\n    }\n    getContext().getContentResolver().notifyChange(uri,\
  \ null);\n    return Uri.parse(CUSTOMERS_TABLE + \"/\" + id);\n}\n```\n\n## 68.8\
  \ 实现 Content Provider 的 `query()` 方法\n\n当调用内容提供者返回数据时，将调用提供者类的 `query()` 方法。当调用时，此方法会接收以下部分或全部参数：\n\
  \n- `URI` – 指定执行查询的数据源的 `URI`。它可以采取带有多个结果的通用查询形式，也可以针对单个表行 ID 的特定查询。\n- `Projection`（投影）——数据库表中的行可以包含多列数据。在本应用程序中，例如这些对应于\
  \ ID、客户姓名和电话号码。`projection` 参数简单的 `String` 数组，包含要在结果数据集中返回每个列的名称。\n- `Selection`（选择）——作为查询一部分执行的选择性“where”元素。该参数控制从指定的数据库选择哪些行。例如，如果要求仅选择名为“John\
  \ Andrews”的客户，则传递给 `query()` 方法的 `selection` 字符串将为 `customername = “John Andrews”`。\n\
  - `Selection Args`（选择参数）——执行 SQL 查询操作以选择所需的任何额外参数。\n- `Sort Order`（排序顺序）——所选行的排序顺序。\n\
  \n当调用时，`query()` 方法需要执行以下操作：\n\n- 使用 `sUriMatcher` 识别 `Uri` 类型。\n- 如果 `URI` 无效，则抛出异常。\n\
  - 根据传递给方法的标准构建 SQL 查询。为了方便起见，可以使用 `SQLiteQueryBuilder` 类来构建查询。\n- 在数据库上执行查询操作。\n\
  - 通知内容解析器该操作。\n- 返回包含查询结果的 `Cursor` 对象。\n\n考虑到这些需求，`MyContentProvider.kt` 文件中 `query()`\
  \ 方法的代码现在应如列表所示：\n\n```java\n@Override\npublic Cursor query(Uri uri, String[] projection,\
  \ String selection, String[] selectionArgs, String sortOrder) {\n    SQLiteQueryBuilder\
  \ queryBuilder = new SQLiteQueryBuilder();\n    queryBuilder.setTables(MyDBHandler.TABLE_CUSTOMERS);\n\
  \    int uriType = sURIMatcher.match(uri);\n    switch (uriType) {\n        case\
  \ CUSTOMER_ID:\n            queryBuilder.appendWhere(MyDBHandler.COLUMN_ID + \"\
  =\" + uri.getLastPathSegment());\n            break;\n        case CUSTOMERS:\n\
  \            break;\n        default:\n            throw new IllegalArgumentException(\"\
  Unknown URI\");\n    }\n    Cursor cursor = queryBuilder.query(myDB.getReadableDatabase(),\
  \ projection, selection, selectionArgs, null, sortOrder);\n    cursor.setNotificationUri(getContext().getContentResolver(),\
  \ uri);\n    return cursor;\n}\n```\n\n## 68.9 实现 Content Provider 的 `update()`\
  \ 方法\n\n当请求对现有数据库行进行更改时，将调用内容提供者的 `update()` 方法。该方法接收带有 `ContentValues` 格式的新值的 `URI`\
  \ 以及常用的 `selection` 字符串。\n\n调用时，`update()` 方法通常执行以下步骤：\n\n- 使用 `sUriMatcher` 识别\
  \ URI 类型。\n- 如果 `URI` 无效，则抛出异常。\n- 获取底层 `SQLite database` 可写实例的引用。\n- 根据选择标准和 URI\
  \ 类型对数据库执行相应的更新操作。\n- 通知内容解析器数据库更改。\n- 返回因更新操作更改的行数。\n\n通用 `update()` 方法以及我们在项目中使用的方法如下：\n\
  \n```java\n@Override\npublic int update(Uri uri, ContentValues values, String selection,\
  \ String[] selectionArgs) {\n    int uriType = sURIMatcher.match(uri);\n    SQLiteDatabase\
  \ sqlDB = myDB.getWritableDatabase();\n    int rowsUpdated = 0;\n    switch (uriType)\
  \ {\n        case CUSTOMERS:\n            rowsUpdated = sqlDB.update(MyDBHandler.TABLE_CUSTOMERS,\
  \ values, selection, selectionArgs);\n            break;\n        case CUSTOMER_ID:\n\
  \            String id = uri.getLastPathSegment();\n            if (TextUtils.isEmpty(selection))\
  \ {\n                rowsUpdated = sqlDB.update(MyDBHandler.TABLE_CUSTOMERS, values,\
  \ MyDBHandler.COLUMN_ID + \"=\" + id, null);\n            } else {\n           \
  \     rowsUpdated = sqlDB.update(MyDBHandler.TABLE_CUSTOMERS, values, MyDBHandler.COLUMN_ID\
  \ + \"=\" + id + \" and \" + selection, selectionArgs);\n            }\n       \
  \     break;\n        default:\n            throw new IllegalArgumentException(\"\
  Unknown URI: \" + uri);\n    }\n    getContext().getContentResolver().notifyChange(uri,\
  \ null);\n    return rowsUpdated;\n}\n```\n\n## 68.10 实现 Content Provider 的 `delete()`\
  \ 方法\n\n\n\n\n\n与其他许多其他内容提供方法一样，`delete()` 方法接收一个 `URI`、一个选择字符串以及一组可选的选择参数。一个典型的\
  \ `delete()` 方法在被调用时还会执行以下任务（这些任务到目前为止已经非常熟悉）：\n\n-   使用 `sUriMatcher` 来识别 `URI`\
  \ 类型。\n-   如果 `URI` 无效，则抛出异常。\n-   获取底层 `SQLite` 数据库写入实例的引用。\n-   根据选择标准和 `Uri`\
  \ 类型在数据库上执行相应的删除操作。\n-   通知内容解析器（content resolver）数据库发生了变化。\n-   返回由于更新操作而更改的行数。\n\
  \n典型的 `delete()` 方法在许多方面与 `update()` 方法相似，其实现方式如下：\n\n```java\n@Override\npublic\
  \ int delete(Uri uri, String selection, String[] selectionArgs) {\n    int uriType\
  \ = sURIMatcher.match(uri);\n    SQLiteDatabase sqlDB = myDB.getWritableDatabase();\n\
  \    int rowsDeleted = 0;\n    switch (uriType) {\n        case CUSTOMERS:\n   \
  \         rowsDeleted = sqlDB.delete(MyDBHandler.TABLE_CUSTOMERS, selection, selectionArgs);\n\
  \            break;\n        case CUSTOMER_ID:\n            String id = uri.getLastPathSegment();\n\
  \            if (TextUtils.isEmpty(selection)) {\n                rowsDeleted =\
  \ sqlDB.delete(MyDBHandler.TABLE_CUSTOMERS, MyDBHandler.COLUMN_ID + \"=\" + id,\
  \ null);\n            } else {\n                rowsDeleted = sqlDB.delete(MyDBHandler.TABLE_CUSTOMERS,\
  \ MyDBHandler.COLUMN_ID + \"=\" + id + \" and \" + selection, selectionArgs);\n\
  \            }\n            break;\n        default:\n            throw new IllegalArgumentException(\"\
  Unknown URI: \" + uri);\n    }\n    getContext().getContentResolver().notifyChange(uri,\
  \ null);\n    return rowsDeleted;\n}\n```\n\n实现了这些方法后，根据本示例的要求，内容提供者类就已经完成了。下一步是确保在项目清单文件中声明了该内容提供者，以便让任何寻求访问的内容解析器都能看到它。\n\
  \n## 68.11 在清单文件中声明内容提供者\n\n除非在内容提供者所属的应用程序清单文件中声明了它，否则内容解析器将无法定位并访问它。如前所述，内容提供者是使用标签声明的，且清单条目必须正确引用内容提供者的权限（authority）和内容\
  \ URI。\n\n因此，在项目工具窗口中找到 `manifests -> AndroidManifest.xml` 文件，并双击它将其加载到编辑面板中。在编辑面板中，确保当\
  \ `MyContentProvider` 类被添加到项目时，Android Studio 已经自动添加了内容提供者的声明：\n\n```xml\nxmlns:tools=\"\
  http://schemas.android.com/tools\"\nandroid:allowBackup=\"true\"\nandroid:dataExtractionRules=\"\
  @xml/data_extraction_rules\"\nandroid:fullBackupContent=\"@xml/backup_rules\"\n\
  android:icon=\"@mipmap/ic_launcher\"\nandroid:label=\"@string/app_name\"\nandroid:roundIcon=\"\
  @mipmap/ic_launcher_round\"\nandroid:supportsRtl=\"true\"\nandroid:theme=\"@style/Theme.SQLDemo\"\
  \ntools:targetApi=\"31\">\nandroid:name=\".provider.MyContentProvider\"\nandroid:authorities=\"\
  com.ebookfrenzy.sqldemo.provider.MyContentProvider\"\nandroid:enabled=\"true\"\n\
  android:exported=\"true\">\nandroid:name=\".MainActivity\"\nandroid:exported=\"\
  true\">\n```\n\n在测试应用程序之前，剩下的工作是修改数据库处理器类，使用内容提供者而不是直接访问数据库。\n\n## 68.12 修改数据库处理器\n\
  \n当起初创建此应用程序时，它的设计是使用数据库处理器直接访问底层数据库的。现在已经实现了内容提供者，需要修改数据库处理器，以便通过内容解析器使用内容提供者来执行所有数据库操作。\n\
  \n第一步是修改 `MyDBHandler.kt` 类，使其获取 `ContentResolver` 实例的引用。这可以在类的构造方法中实现：\n\n```java\n\
  package com.ebookfrenzy.sqldemo;\n\nimport android.content.ContentResolver;\nimport\
  \ com.ebookfrenzy.sqldemo.provider.MyContentProvider;\n\npublic class MyDBHandler\
  \ extends SQLiteOpenHelper {\n    private ContentResolver myCR;\n    public MyDBHandler(Context\
  \ context, String name, SQLiteDatabase.CursorFactory factory, int version) {\n \
  \       super(context, DATABASE_NAME, factory, DATABASE_VERSION);\n        myCR\
  \ = context.getContentResolver();\n    }\n}\n```\n\n接下来，需要重写 `addCustomer()`、`findCustomer()`\
  \ 和 `removeCustomer()` 方法，使用内容解析器和内容提供者进行数据管理：\n\n```java\npublic void addCustomer(Customer\
  \ customer) {\n    ContentValues values = new ContentValues();\n    values.put(COLUMN_CUSTOMERNAME,\
  \ customer.getCustomerName());\n    values.put(COLUMN_CUSTOMERPHONE, customer.getCustomerPhone());\n\
  \    myCR.insert(MyContentProvider.CONTENT_URI, values);\n}\n\npublic Customer findCustomer(String\
  \ customername) {\n    String[] projection = {COLUMN_ID, COLUMN_CUSTOMERNAME, COLUMN_CUSTOMERPHONE\
  \ };\n    String selection = \"customername = \\\"\" + customername + \"\\\"\";\n\
  \    Cursor cursor = myCR.query(MyContentProvider.CONTENT_URI, projection, selection,\
  \ null, null);\n    Customer customer = new Customer();\n    if (cursor.moveToFirst())\
  \ {\n        customer.setID(Integer.parseInt(cursor.getString(0)));\n        customer.setCustomerName(cursor.getString(1));\n\
  \        customer.setCustomerPhone(cursor.getString(2));\n        cursor.close();\n\
  \    } else {\n        customer = null;\n    }\n    return customer;\n}\n\npublic\
  \ boolean deleteCustomer(String customername) {\n    boolean result = false;\n \
  \   String selection = \"customername = \\\"\" + customername + \"\\\"\";\n    int\
  \ rowsDeleted = myCR.delete(MyContentProvider.CONTENT_URI, selection, null);\n \
  \   if (rowsDeleted > 0)\n        result = true;\n    return result;\n}\n```\n\n\
  随着数据库处理器类更新为使用内容解析器和内容提供者，现在可以测试应用程序了。编译并运行应用程序，执行添加、查找和删除条目的操作。在操作和功能方面，应用程序的行为与直接访问数据库时完全相同，它现在使用的是内容提供者。\n\
  \n正如我们在下一章中看到的，一旦内容提供者落实并在清单文件中声明，任何其他应用程序都可能访问这些数据（因为没有声明权限）。其他应用程序访问所需的唯一信息是内容\
  \ URI 和表中的列名。\n\n## 68.13 总结\n\n本章的目标是提供实现 Android 内容提供者的具体步骤的详细概述，特别关注内容提供者类中查询、插入、删除和更新方法的结构和实现。还涵盖了使用内容解析器类访问内容提供数据的实际用法，并对数据库项目进行了修改，以使用内容提供者和内容解析器。\n\
  \n## 69 内容提供者客户端教程\n\n在关于内容提供者的最后一个章节中，我们将构建一个访问 SQLDemo 内容提供者数据并显示联系人列表的应用程序。\n\
  \n## 69.1 创建 SQLDemoClient 项目\n\n启动 Android Studio，从欢迎屏幕选择 New Project，并在出现的新项目对话框中选择\
  \ Empty Views Activity 模板。\n\n在 Name 字段中输入 `SQLDemoClient`，并指定包名为 `com.ebookfrenzy.sqldemoclient`。在点击\
  \ Finish 按钮之前，将 Minimum API level 设置为 `API 26: Android 8.0 (Oreo)`并将 Language 菜单更改为\
  \ `Java`。按照第 12.8 节中迁移项目到 View Binding 的步骤为项目启用视图绑定。\n\n## 69.2 设计用户界面\n\n\n\n\n\
  打开 `activity_main.xml` 文件并移除默认的 `TextView`。在布局中添加一个按钮和一个 `TextView`，将按钮文本更改为“Reload”（重载），并调整视图位置使布局类似于图\
  \ 69-1：\n\n![image-N17ABKO2.jpg](img/image-N17ABKO2.jpeg)\n\n图 69-1\n\n使用 Infer（推断）约束来配置布局约束，将\
  \ `TextView` 的 `textAppearance` 属性更改为 `Display1`并将按钮的 `onClick` 属性设置为名为 `reload()`\
  \ 的方法。\n\n## 69.3 访问 Content Provider\n\n访问内容提供者的代码将包含在 `reload()` 方法中。第一步是通过调用\
  \ `Content Resolver` 实例的 `query()` 方法获取 `Cursor` 对象。调用 `query()` 时，我们需要为由 `SQLDemo`\
  \ 内容提供者管理的 `customers` 表提供内容 URI，其读取如下：\n\n`content://com.ebookfrenzy.sqldemo.provider.MyContentProvider/customers`\n\
  \n一旦我们有了 `Cursor` 对象的引用，就可以遍历数据库记录并使用我们的 `TextView` 组件显示数据。编辑 `MainActivity.java`\
  \ 文件并按如下所示添加 `reload()` 方法：\n\n```java\npackage com.ebookfrenzy.sqldemoclient;\n\
  \n.\n\n.\n\nimport android.database.Cursor;\n\nimport android.net.Uri;\n\n...\n\n\
  public class MainActivity extends AppCompatActivity {\n.\n.\npublic void reload(View\
  \ view) {\n    Cursor cursor = getContentResolver().query(\n        Uri.parse(\n\
  \        \"content://com.ebookfrenzy.sqldemo.provider.MyContentProvider/customers\"\
  ),\n        null, null, null, null);\n    if (cursor != null) {\n        if (cursor.moveToFirst())\
  \ {\n            StringBuilder stringBldr = new StringBuilder();\n            while\
  \ (!cursor.isAfterLast()) {\n                int nameindex = cursor.getColumnIndex(\"\
  customername\");\n                int phoneindex = cursor.getColumnIndex(\"customerphone\"\
  );\n                if ((nameindex != -1) && (phoneindex != -1)) {\n           \
  \         String string = cursor.getString(nameindex) + \"\\n\" +\n            \
  \        cursor.getString(phoneindex);\n                    stringBldr.append(string).append(\"\
  \\n\\n\");\n                    binding.textView.setText(stringBldr);\n        \
  \        }\n                cursor.moveToNext();\n            }\n        }\n   \
  \ }\n    cursor.close();\n}\n}\n}\n```\n\n## 69.4 添加查询权限\n\n在测试应用之前，最后一个任务是请求查询内容提供者的权限。要请求权限，请编辑\
  \ manifests -> `AndroidManifest.xml` 文件并将其修改如下：\n\n`xmlns:tools=\"http://schemas.android.com/tools\"\
  >`\n.\n.\n\n## 69.5 测试项目\n\n在你用于测试 `SQLDemo` 应用的设备或模拟器上构建并运行应用，点击 `Reload` 按钮。应用应该查询\
  \ `customers` 数据库中的记录并在 `TextView` 上显示它们：\n\n![image-R128QYB7.jpg](img/image-R128QYB7.jpeg)\n\
  \n图 69-2\n\n## 69.6 总结\n\n在本章中，我们创建了一个简单的应用来演示从客户端应用访问存储在内容 provider 中的数据。这涉及将提供者的内容\
  \ URI 传递给内容解析器实例的 `query()` 方法，并在项目清单文件中向内容 provider 请求查询权限。`query()` 调用返回了一个 `Cursor`\
  \ 对象，我们用它来遍历数据库记录。\n\n## 70. Android Room 持久化库\n\nRoom 持久库包含在 Android 架构组件中，旨在以一种符合\
  \ Android 架构指南的方式，更容易为 Android 应用添加数据库存储支持。在前面的章节中已经涵盖了 SQLite 数据库的基础知识后，本章将探索基于\
  \ Room 的数据库管理、协同工作并在 Android 应用中实现 Room 支持的关键元素，以及这些元素在架构和编码方面是如何实现的的。在涵盖了这些主题后，接下来的两章将通过示例\
  \ Room 数据库项目将这些理论付诸实践。\n\n## 70.1 重新回顾现代应用架构\n\n标题为“使用 Jetpack 构建现代 Android 应用架构”的章节介绍了现代应用架构的概念，并强调了分离应用内不同责任区域的重要性。图\
  \ 70-1 所示的图概述了典型 Android 应用的推荐架构：\n\n![image-DRRS6FEQ.jpg](img/image-DRRS6FEQ.jpeg)\n\
  \n图 70-1\n\n在本书之前的章节中已经详细介绍了该架构的前三个层级，现在是在 Room 持久化库背景下探索仓库和数据库架构层级了。\n\n## 70.2\
  \ Room 数据库持久化的关键元素\n\n在章节稍后的详细介绍之前，首先值得总结使用 Room 持久化库处理 SQLite 数据库的关键元素：\n\n###\
  \ 70.2.1 仓库 (Repository)\n\n如之前所述，仓库模块包含了直接处理应用所用所有数据源所需的所有。这避免了 UI 控制器和 `ViewModel`\
  \ 包含直接访问数据库或网络服务的代码。\n\n### 70.2.2 Room 数据库\n\n`room database` 对象提供了底层 SQLite 数据库的接口。它还为仓库提供了访问数据访问对象\
  \ (`DAO`) 的权限。应用应该只有一个 `room database` 实例，该实例可以用于访问多个数据库表。\n\n### 70.2.3 数据访问对象\
  \ (DAO)\n\n`DAO` 包含了仓库在 SQLite 数据库中执行操作所需的 SQL 语句。\n\n### 70.2.4 实体 (Entities)\n\
  \n`entity` 是一个定义数据库表结构的类，它定义了表名、列名、数据类型，并标识哪一列为主键。除了声明表结构外，`entity` 类还包含提供这些字段的\
  \ getter 和 setter 方法。`DAO` 响应查询调用返回给仓库的数据以 `entity` 类实例的形式存在。然后调用 getter 方法提取数据。同样，当仓库需要向数据库写入新记录时，它会创建一个\
  \ `entity` 实例，通过 setter 调用配置，然后调用 `DAO` 中定义的插入方法并传递 `entity` 实例。\n\n### 70.2.5 SQLite\
  \ 数据库\n\nSQLite 数据库负责存储和提供数据。应用代码（包括仓库不应直接访问底层数据库。所有的数据库操作都是通过 `room database`、`DAOs`\
  \ 和 `entities` 的组合完成的。\n\n图 70-2 中的架构图说明了这些元素如何交互并在 Android 应用中提供基于 Room 的数据库存储：\n\
  \n![image-N7ECVFS.jpg](img/image-N7ECVFS.jpeg)\n\n图 70-2\n\n上述架构图中的编号连接可以总结如下：\n\
  \n1. 仓库与 `Room Database` 交互以获取实例，该实例反过来用于获取 DAO 实例的引用。\n2. 仓库创建 `entity` 实例并对其进行数据配置，然后将其传递给\
  \ `DAO` 用于搜索和插入操作。\n3. 仓库调用 `DAO` 方法并传递要插入的 `entity`，并在响应查询时接收 `entity` 实例。\n4.\
  \ 当 `DAO` 有结果要返回给仓库时，它将其封装成 `entity` 对象。\n5. `DAO` 与 `Room Database` 交互以启动数据库操作并处理结果。\n\
  6. `Room Database` 处理与底层 SQLite 数据库的所有交互，提交查询并接收结果。\n\n在涵盖了使用 Room 持久库进行数据库访问的关键元素的概述后，现在是时候详细探索实体、DAO、room\
  \ 数据库和仓库了。\n\n\n\n每个数据库表都对应有一个实体类。该类定义了表的结构（schema），并以标准 Java 类的形式存在，其中穿插了一些特殊的\
  \ Room 注解。一个声明要存储在数据库表中数据的 Java 类示例如下：\n\n```java\npublic class Customer {\n\n \
  \   private int id;\n\n    private String name;\n\n    private string address;\n\
  \n    public Customer(String name, String address) {\n        this.id = id;\n  \
  \      this.name = name;\n        this.address = address;\n    }\n\n    public int\
  \ getId() {\n        return this.id;\n    }\n\n    public String getName() {\n \
  \       return this.name;\n    }\n\n    public int getAddress() {\n        return\
  \ this.address;\n    }\n\n    public void setId(int id) {\n        this.id = id;\n\
  \    }\n\n    public void setName(String name) {\n        this.name = name;\n  \
  \  }\n\n    public void setAddress(int quantity) {\n        this.address = address;\n\
  \    }\n\n}\n```\n\n按照目前的实现，上述代码声明了一个基础 Java 类，包含若干个表示数据库表字段的变量以及一组 getter 和 setter\
  \ 方法。然而，该类目前还一个实体。要将此类变为实体并使其能够在 SQL 语句中访问，需要按照所示添加一些 Room 注解：\n\n```java\n@Entity(tableName\
  \ = \"customers\")\npublic class Customer {\n\n    @PrimaryKey(autoGenerate = true)\n\
  \    @NonNull\n    @ColumnInfo(name = \"customerId\")\n    private int id;\n\n \
  \   @ColumnInfo(name = \"customerName\")\n    private String name;\n\n    private\
  \ String address;\n\n    public Customer(String name, String address) {\n      \
  \  this.id = id;\n        this.name = name;\n        this.address = address;\n \
  \   }\n\n    public int getId() {\n        return this.id;\n    }\n\n    public\
  \ String getName() {\n        return this.name;\n    }\n\n    public String getAddress()\
  \ {\n        return this.address;\n    }\n\n    public void setId(@NonNull int id)\
  \ {\n        this.id = id;\n    }\n\n    public void setName(String name) {\n  \
  \      this.name = name;\n    }\n\n    public void setAddress(int quantity) {\n\
  \        this.address = address;\n    }\n}\n```\n\n上述注解首先声明该类代表一个实体，并分配了“customers”作为表名。这是在\
  \ DAO SQL 语句中引用该表的名称：\n\n`@Entity(tableName = \"customers\")`\n\n每个数据库表都需要一列来作为主键。在这种情况下，customer\
  \ id 被声明为主键。同时还添加了注解来分配一个在 SQL 查询中引用的列名，并指示该字段不能用于存储空值（null）。最后，`id` 值被配置为自动生成。这意味着系统会自动为新记录生成\
  \ `id`，以避免主键冲突：\n\n`@PrimaryKey(autoGenerate = true)`\n`@NonNull`\n`@ColumnInfo(name\
  \ = \"customerId\")`\n`private int id;`\n\ncustomer name 字段也分配了一个列名。但请注意，address\
  \ 字段没有分配列名。这意味着 address 数据仍将存储在数据库中，但不需要在 SQL 语句中引用。如果实体中的某个字段不需要存储在数据库中，请使用 `@Ignore`\
  \ 注解：\n\n`@Ignore`\n`private String myString;`\n\n最后，修改了 `id` 变量的 setter 方法以防止尝试分配空值：\n\
  \n```java\npublic void setId(@NonNull int id) {\n    this.id = id;\n}\n```\n\n注解也可以包含在实体类中，以便使用称为外键（foreign\
  \ keys）的关系型数据库概念来与其他实体建立关系。外键允许一个表引用另一个表的主键。例如，可以在名为 `Purchase` 的实体与我们现有的 `Customer`\
  \ 实体之间建立如下关系：\n\n```java\n@Entity(foreignKeys = {@ForeignKey(entity = Customer.class,\n\
  parentColumns = \"customerId\",\nchildColumns = \"buyerId\",\nonDelete = ForeignKey.CASCADE,\n\
  onUpdate = ForeignKey.RESTRICT})\npublic class Purchase {\n\n    @PrimaryKey(autoGenerate\
  \ = true)\n    @ColumnInfo(name = \"purchaseId\")\n    private int purchaseId;\n\
  \n    @ColumnInfo(name = \"buyerId\")\n    private int buyerId;\n\n}\n```\n\n注意，外键声明还指定了当父记录被删除或更新时要采取的操作。可选选项有\
  \ `CASCADE`、`NO_ACTION`、`RESTRICT`、`SET_DEFAULT` 和 `SET_NULL`。\n\n## 70.4 数据访问对象\
  \ (Data Access Objects)\n\n数据访问对象（DAO）允许访问存储在 SQLite 数据库中的数据。DAO 被声明为标准的 Java 接口，并带有额外的注解，将特定的\
  \ SQL 语句映射到仓库随后可以调用的方法。\n\n第一步是创建接口并使用 `@Dao` 注解将其声明为 DAO：\n\n```java\n@Dao\npublic\
  \ interface CustomerDao {\n}\n```\n\n接下来，添加包含 SQL 语句和对应方法名的条。例如，下面的声明允许通过调用名为 `getAllCustomers()`\
  \ 的方法检索 customers 表中的所有行：\n\n```java\n@Dao\npublic interface CustomerDao {\n   \
  \ @Query(\"SELECT * FROM customers\")\n    LiveData<List<Customer>> getAllCustomers();\n\
  }\n```\n\n`getAllCustomers()` 方法返回一个包含 `Customer` 对象的 `List` 对象。该 DAO 使用 `LiveData`，以便能够观察数据库的变化。参数也可以传递给方法并在\
  \ SQL 语句中引用。考虑下面的 DAO 声明，它根据名称搜索数据库记录（注意 WHERE 条件中的是实体类中的列名）：\n\n```java\n@Query(\"\
  SELECT * FROM customers WHERE name = :customerName\")\nList<Customer> findCustomer(String\
  \ customerName);\n```\n\n在此示例中，方法传递一个字符串值，该值通过冒号（`:`）包含在 SQL 语句中。基础插入操作如下所示使用 `@Insert`\
  \ 注解声明：\n\n```java\n@Insert\nvoid addCustomer(Customer customer);\n```\n\n这是一个便利注解，因为\
  \ Room 库可以推断传递 `addCustomer()` 的 `Customer` 实体要插入数据库。也可以如下在事务中插入多个数据库记录：\n\n```java\n\
  @Insert\npublic void insertCustomers(Customer... customers);\n```\n\n下面的 DAO 根据提供的名称删除记录：\n\
  \n```java\n@Query(\"DELETE FROM customers WHERE name = :name\")\nvoid deleteCustomer(String\
  \ name);\n```\n\n作为使用 `@Query` 注解执行删除的替代方案，也可以使用便利注解 `@Delete`。在以下示例中，从数据库中删除所有传递给\
  \ `deleteCustomers()` 的 Customer 实体：\n\n```java\n@Delete\npublic void deleteCustomers(Customer...\
  \ customers);\n```\n\n便利注解在更新记录时提供了类似的行为：\n\n```java\n@Update\npublic void updateCustomers(Customer...\
  \ customers);\n```\n\n这些类型的数据库操作的 DAO 方法也可以声明返回一个 `int` 值，表示受事务影响的行数，例如：\n\n```java\n\
  @Delete\npublic int deleteCustomers(Customer... customers);\n```\n\n## 70.5 Room\
  \ Database\n\nRoom 数据库类通过扩展 `RoomDatabase` 类创建，它是嵌入 Android 操作系统的实际 SQLite 数据库之上的层。该类负责创建并返回新的\
  \ Room 数据库实例，并提供对关联 DAO 实例的访问。\n\nRoom 库提供了数据库构建器来创建数据库实例。每个 Android 应用应该只有一个 Room\
  \ 数据库实例，因此在类内部实现防御性代码以防止创建多个实例是最好的。\n\n用于示例客户表的 Room 数据库实现如下代码列表所示：\n\n```java\n\
  import android.content.Context;\nimport android.arch.persistence.room.Database;\n\
  import android.arch.persistence.room.Room;\n```\n\n\n\n\n```java\nimport android.arch.persistence.room.RoomDatabase;\n\
  \n@Database(entities = {Customer.class}, version = 1)\n\npublic class CustomerRoomDatabase\
  \ extends RoomDatabase {\n\n    public abstract CustomerDao customerDao();\n\n \
  \   private static CustomerRoomDatabase INSTANCE;\n\n    static CustomerRoomDatabase\
  \ getDatabase(final Context context) {\n        if (INSTANCE == null) {\n      \
  \      synchronized (CustomerRoomDatabase.class) {\n                if (INSTANCE\
  \ == null) {\n                    INSTANCE = Room.databaseBuilder(\n           \
  \             context.getApplicationContext(),\n                        CustomerRoomDatabase.class,\
  \ \"customer_database\")\n                    .build();\n                }\n   \
  \         }\n        }\n        return INSTANCE;\n    }\n}\n```\n\n上述示例中需要注意的重要区域包括：类声明上方的注解（声明了数据库要操作的实体）、检查类实例是否已创建的代码，以及为该实例分配的\
  \ `customer_database` 名称。\n\n## 70.6 仓库 (Repository)\n\n仓库负责获取 `Room Database` 实例，使用该实例访问关联的\
  \ `DAOs`，然后调用 `DAO` 方法来执行数据库操作。一个为与 `Room Database` 协作设计的典型构造函数可能如下：\n\n```java\n\
  public class CustomerRepository {\n    private CustomerDao customerDao;\n    private\
  \ CustomerRoomDatabase db;\n\n    public CustomerRepository(Application application)\
  \ {\n        db = CustomerRoomDatabase.getDatabase(application);\n        customerDao\
  \ = db.customerDao();\n    }\n}\n```\n\n一旦仓库可以访问 `DAO`，它就可以调用数据访问方法。例如，下面的代码调用了\
  \ `getAllCustomers()` `DAO` 方法：\n\n```java\nprivate LiveData<Customer> allCustomers;\n\
  allCustomers = customerDao.getAllCustomers();\n```\n\n在调用 `DAO` 方法时，需要注意的是，除非该方法返回\
  \ `LiveData` 实例（该实例会在单独线程上自动运行查询），否则无法在应用的主线程上执行该操作。尝试这样做会导致应用崩溃并输出以下诊断信息：\n\n`Cannot\
  \ access database on the main thread since it may potentially lock the UI for a\
  \ long period of time`\n\n由于某些数据库事务可能需要更长时间才能完成，因此在单独线程上运行操作可以避免应用出现假死。正如在“Android\
  \ Room Database and Repository Tutorial”章节中将演示的那样，这个问题可以通过使用 `Java` 线程轻松解决（有关更多信息或如何使用线程的提醒，请参阅“An\
  \ Overview of Java Threads, Handlers and Executors”章节）。\n\n## 70.7 内存数据库 (In-Memory\
  \ Databases)\n\n本章概述的示例使用了位于 Android 设备持久化存储上的文件的 `SQLite` 数据库。这确保了即使在应用进程终止后数据仍然存在。\n\
  \n`Room` 数据库持久化库也支持内存数据库。这些数据库完全留在内存中，并在应用终止时丢失。使用内存数据库所需的唯一更改是调用 `Room Database`\
  \ 类的 `Room.inMemoryDatabaseBuilder()` 方法，而不是 `Room.databaseBuilder()`。下面的代码显示了方法调用之间的区别（注意，内存数据库不需要数据库名称）：\n\
  \n```java\n// 创建基于文件存储的数据库\nINSTANCE = Room.databaseBuilder(context.getApplicationContext(),\n\
  \    CustomerRoomDatabase.class, \"customer_database\")\n    .build();\n\n// 创建内存数据库\n\
  INSTANCE = Room.inMemoryDatabaseBuilder(context.getApplicationContext(),\n    CustomerRoomDatabase.class)\n\
  \    .build();\n```\n\n## 70.8 数据库检查器 (Database Inspector)\n\nAndroid Studio 包含\
  \ `Database Inspector` 工具窗口，允许查看、搜索和修改与运行应用关联的 `Room` 数据库，如图 70-3 所示：\n\n![image-3M5I2TTM.jpg](img/image-3M5I2TTM.jpeg)\n\
  \n图 70-3\n\n`Database Inspector` 将在“Android Room Database and Repository Tutorial”章节中介绍。\n\
  \n## 70.9 总结\n\n`Android Room` 持久化库包含在 `Android Architecture Components` 中，并作为低级\
  \ `SQLite` 数据库之上的抽象层。该库的设计旨在使与数据库的操作变得更容易，同时符合 Android 架构准则。本章介绍了在 Android 应用项目中构建基于\
  \ `Room` 的数据库存储所需的相互作用的元素，包括实体、仓库、数据访问对象、注解和 `Room Database` 实例。\n\n在涵盖了 `SQLite`\
  \ 基础和 `Room` 架构之后，下一步是创建一个将这些理论付诸实践的示例应用。由于示例应用程序的用户界面需要一个基于表单的布局，下一章名为“An Android\
  \ TableLayout and TableRow Tutorial”，将稍微偏离核心主题，介绍 `TableLayout` 和 `TableRow` 视图的基础。\n\
  \n## 71. Android TableLayout 和 TableRow 教程\n\n在开始编写本书的下一章（“Android Room Database\
  \ and Repository Tutorial”）时，最初的计划是包含为 `Room` 数据库示例应用设计用户界面布局的步骤。然而，很快发现实现用户界面的最佳方法是使用\
  \ Android `TableLayout` 和 `TableRow` 视图，而且这个主题值得作为一个独立的章节。因此，本章将专门专注于下一章要完成的数据库应用程序的用户界面设计，并在此花一些时间介绍\
  \ Android Studio 中表格布局的基本概念。\n\n## 71.1 TableLayout 和 TableRow 布局\n\n`TableLayout`\
  \ 视图允许以行和列的形式在屏幕上组织用户界面元素。`TableLayout` 中的每一行由 `TableRow` 实例占据，而 `TableRow` 又被分为单元格，每个单元格包含一个子视图。\n\
  \n表格的列数由列数最多的行决定，默认情况下每列的宽度由该列中最宽的单元格定义。列可以配置为收缩或扩展（或两者兼有），使其相对于 `TableLayout` 大小。此外，单个单元格可以配置为跨越多个列。\n\
  \n考虑图 71-1 所示的用户界面布局：\n\n![image-T7V3A77.jpg](img/image-T7V3A77.jpeg)\n\n图 71-1\n\
  \n从布局的外观来看，很难识别使用的 `TableLayout` 结构。然而，图 71-2 中的层次结构使其变得更容易理解：\n\n![image-W2DGCUF4.jpg](img/image-W2DGCUF4.jpeg)\n\
  \n图 71-2\n\n该布局由父 `LinearLayout` 以及 `TableLayout`、`LinearLayout` 和 `RecyclerView`\
  \ 组成。`TableLayout` 包含 `TableRow`，代表表格中的三行。`TableRow` 两个子视图，每个代表列单元格的内容。`LinearLayout`\
  \ 子视图包含三个 `Button` 子。\n\n图 71-2 所示的布局是下一章将完成所需的精确布局。因此，本章的剩余部分将使用 Android Studio\
  \ 布局编辑器逐步完成此布局的设计。\n\n## 71.2 创建 Room 数据库项目\n\n在欢迎屏幕上选择 `New Project` 菜单选项，并在弹出的新项目对话框中选择\
  \ `Empty Views Activity` 模板，然后点击 `Next` 按钮。\n\n在 `Name` 字段中输入 `RoomDemo` 并指定 `com.ebookfrenzy.roomdemo`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API` 级别设置为 `API 26: Android 8.0 (Oreo)`并将 `Language`\
  \ 菜单更改为 `Java`。\n\n\n\n\n\n按照第 12.8 节“迁移项目到视图绑定”（Migrating a Project to View Binding）中概述的步骤将项目迁移到视图绑定。\n\
  \n## 71.3 转换为 LinearLayout\n\n在项目（Project）工具窗口中找到 `activity_main.xml` 文件（app ->\
  \ res -> layout），并双击它以将其加载到布局编辑器（Layout Editor）工具窗口中。默认情况下，Android Studio 使用 `ConstraintLayout`\
  \ 作为用户界面的根布局元素。这需要将其转换为垂直方向的 `LinearLayout`。\n\n在设计（Design）模式下使用布局编辑器工具栏，在组件树（Component\
  \ Tree）面板中找到 `ConstraintLayout` 组件，右键点击它显示图 71-3 所示的菜单，并选择`Convert view...`（转换视图）选项：\n\
  \n![image-SL0RX6MN.jpg](img/image-SL0RX6MN.jpeg)\n\n图 71-3\n\n在弹出的对话框（图 71-4）中，在点击应用（Apply）按钮之前，选择转换为\
  \ `LinearLayout` 的选项：\n\n![image-OLUVKMVA.jpg](img/image-OLUVKMVA.jpeg)\n\n图 71-4\n\
  \n默认情况下，布局编辑器会将 `ConstraintLayout` 转换为水平 `LinearLayout`，因此在组件树窗口中选择该布局组件，参考属性（Attributes）工具窗口，并将`orientation`（方向）属性更改为垂直垂直：\n\
  \n![image-HYHVJEUS.jpg](img/image-HYHVJEUS.jpeg)\n\n图 71-5\n\n转换完成后，选择并删除布局中的默认\
  \ `TextView` 部件。\n\n## 71.4 向用户界面添加 TableLayout\n\n留在 `activity_main.xml` 文件中，并参考调色板（Palette）中的布局（Layouts）类别，拖入一个\
  \ `TableLayout` 视图将其放置在 `LinearLayout` 画布区域的顶部。\n\n完成这些初始步骤后，布局的组件树应该类似于图 71-6 所示。\n\
  \n![image-UYOS44Q1.jpg](img/image-UYOS44Q1.jpeg)\n\n图 71-6\n\nAndroid Studio 自动为\
  \ `TableLayout` 添加了四个 `TableRow` 实例。由于此示例只需要三行，请选择并删除第四个 `TableRow` 实例。可以随时从调色板拖入\
  \ `TableRow` 对象并将其置于组件树工具窗口中的 `TableLayout` 条目上，向 `TableLayout` 添加更多行。\n\n选中 `TableLayout`，使用属性工具窗口将`layout_height`\
  \ 属性更改为 `wrap_content`并将`layout_width` 更改为 `match_parent`。\n\n## 71.5 配置 TableRows\n\
  \n从调色板的文本（Text）部分，将两个 `TextView` 对象拖动到组件树中最顶部的 `TableRow` 条目上（图 71-7）：\n\n![image-49FRT5PA.jpg](img/image-49FRT5PA.jpeg)\n\
  \n图 71-7\n\n选择屏幕布局中最左侧的 `TextView`，并在属性工具窗口中将`text` 更改为“Product ID”。对右侧的 `TextView`\
  \ 重复此步骤，将文本更改为“Not assigned”并指定 `ID` 值为 `productID`。\n\n将另一个 `TextView` 部件拖动到组件树中的第二个\
  \ `TableRow` 条目上，并将视图上的文本更改为“Product Name”。在调色板中找到`Plain Text`（纯文本）对象，并将其拖动到图 71-8\
  \ 所示的组件树中 Product Name `TextView` 下方。接下来，从`text` 属性中删除“Name”字符串并将`ID` 设置为 `productName`。\n\
  \n![image-DOXLRSSO.jpg](img/image-DOXLRSSO.jpeg)\n\n图 71-8\n\n将另一个 `TextView` 和一个\
  \ `Number (Decimal)`（数字（小数））文本字段拖到第三个 `TableRow` 上，使 `TextView` 位于层次结构中 `EditText`\
  \ 之上。将 `TextView` 文本更改为“Product Quantity”，并将 `EditText` 对象的 `ID` 设置为 `productQuantity`。\n\
  \n按住 Shift 键以选择布局中的所有部件（如下所示图 71-9 所示），并使用属性工具窗口将所有对象的`textSize` 属性设置为 `18sp`：\n\
  \n![image-6DKRI24O.jpg](img/image-6DKRI24O.jpeg)\n\n图 71-9\n\n## 71.6 为布局添加按钮栏\n\
  \n下一步是向父 `LinearLayout` 视图添加一个 `LinearLayout (Horizontal)`（水平）视图，位置紧邻 `TableLayout`\
  \ 视图下方。首先点击组件树中 `TableLayout` 条目左侧的小展开箭头，使 `TableRows` 折叠隐藏。从布局编辑器调色板的布局（Layouts）部分拖入一个`LinearLayout\
  \ (horizontal)` 实例，将其放在组件树面板中 `TableLayout` 条目的正下方，并将`layout_height`属性更改为 `wrap_content`：\n\
  \n![image-MMOXEU5J.jpg](img/image-MMOXEU5J.jpeg)\n\n图 71-10\n\n将三个 `Button` 对象拖入新的\
  \ `LinearLayout` 中，并为每个按钮分配内容分别为“Add”、“Find”和“Delete”的字符串资源。此类按钮栏布局中的按钮通常应以无边界样式显示。使用每个按钮的属性工具窗口将样式设置设置为\
  \ `Widget.AppCompat.Button.Borderless`，并将`textColor` 属性设置为 `?attr/colorPrimary`。将按钮的\
  \ `IDs` 分别更改为 `addButton`、`findButton`和`deleteButton`。\n\n![image-B7G9MQ6.jpg](img/image-B7G9MQ6.jpeg)\n\
  \n图 71-11\n\n在组件树中选中新的 `LinearLayout` 视图，将`gravity`属性设置为 `center_horizontal`，以便按钮水平居中。在继续之前，将上述步骤添加的所有`text`属性提取到字符串资源中。\n\
  \n## 71.7 添加 RecyclerView\n\n在组件树中，点击新添加的 `LinearLayout` 条目左侧的箭头以折叠所有子项。\n\n从调色板的容器（Containers）部分将一个\
  \ `RecyclerView` 实例拖到组件树中，将其放置在图 71-12 所示的按钮栏下方。确保 `RecyclerView` 是父 `LinearLayout`\
  \ 的直接子级，而不是按钮栏 `LinearLayout` 的子级。\n\n![image-PAZ7PQ7.jpg](img/image-PAZ7PQ7.jpeg)\n\
  \n图 71-12\n\n在布局中选中 `RecyclerView`，将视图的 `ID`更改为 `product_recycler`并将`layout_height`\
  \ 属性更改为 `match_parent`。\n\n## 71.8 调整布局边距\n\n最后只需调整一些布局设置。首先点击组件树面板中的第一个 `TableRow`\
  \ 条目使其被选中。按住键盘上的 Cmd/Ctrl 键并点击第二个、三个 `TableRow`，水平 `LinearLayout`以及 `RecyclerView`，使所有五个项目被选中。在属性面板中，找到`layout_margin`\
  \ 属性类别，一旦找到，如图 71-14 所示将值更改为 `10dp`：\n\n![image-KWCQPPH3.jpg](img/image-KWCQPPH3.jpeg)\n\
  \n图 71-14\n\n设置边距后，用户界面应如图 71-1 所示。\n\n## 71.9 总结\n\n`TableLayout` 容器视图提供了行列配置视图组件的方法。虽然\
  \ `TableLayout` 视图提供了整体容器，但每行及其包含的单元是通过 `TableRow` 实例实现的。在本章中，使用 Android Studio\
  \ 中的 `TableLayout` 和 `TableRow` 设计了用户界面。下一章将为该用户界面添加后台功能，使用仓库（Repository）和 Room\
  \ 持久库来实现 SQLite 数据库功能。\n\n## 72\\. Android Room 数据库与仓库教程\n\n\n\n\n本章将结合“Android\
  \ Room 持久化库”中学到的知识以及上一章创建的初始项目，提供一个详细的教程，演示如何使用 Room 持久化库实现基于 SQLite 的数据库存储。遵循 Android\
  \ 架构指南，项目将使用 ViewModel（视图模型）和 Repository（仓库）。本教程将使用“Android Room 持久化库”中涵盖的所有元素，包括实体（Entity）、数据访问对象（DAO）、Room\
  \ 数据库以及异步数据库查询。\n\n## 72.1 关于 RoomDemo 项目\n\n上一章中创建的用户界面布局是创建一个用于存储产品名称和数量的简易库存应用的第一步。完成后，该应用将提供添加、删除和搜索数据库条目的功能，同时显示当前数据库中存储的所有产品的可滚动列表。当数据库条目添加或删除时，此产品列表将自动更新。\n\
  \n## 72.2 修改构建配置\n\n启动 Android Studio 并打开上一章开始的 `RoomDemo` 项目。在向项目添加任何新类之前，第一步是在构建配置中添加额外的库和插件，包括\
  \ Room 持久化库。\n\n使用 `Project` 工具窗口，找到并编辑 `Gradle Scripts -> libs.versions.toml` 文件，如下：\n\
  \n```toml\n[versions]\nroomRuntime = \"2.6.1\"\nfragment = \"1.8.5\"\n\n[libraries]\n\
  androidx-room-compiler = { module = \"androidx.room:room-compiler\", version.ref\
  \ = \"roomRuntime\" }\nandroidx-room-runtime = { group = \"androidx.room\", name\
  \ = \"room-runtime\", version.ref = \"roomRuntime\" }\nandroidx-fragment = { group\
  \ = \"androidx.fragment\", name = \"fragment\", version.ref = \"fragment\" }\n```\n\
  \n点击 `Sync Now` 链接提交更改。最后，修改模块级 `build.gradle.kts` 文件（`app -> Gradle Scripts ->\
  \ build.gradle.kts (Module :app)`）：\n\n```kotlin\ndependencies {\n    implementation(libs.androidx.room.runtime)\n\
  \    implementation(libs.androidx.fragment)\n    annotationProcessor(libs.androidx.room.compiler)\n\
  }\n```\n\n## 72.3 构建实体\n\n该项目将从创建定义数据库表模式的实体开始。实体将包含一个用于产品 ID 的整数、一个用于存储产品名称的字符串列以及另一个用于存储数量的整数值。\n\
  \nproductid 列将作为主键并自动生成。表 72-1 汇总了实体的结构：\n\n| 列名 | 数据类型 |\n| :--- | :--- |\n| productid\
  \ | Integer / 主键 / 自动递增 |\n| productname | String |\n| productquantity | Integer\
  \ |\n\n表 72-1\n\n在 `Project` 工具窗口中右键点击 `app -> java -> com.ebookfrenzy.roomdemo`\
  \ 项，并选择 `New -> Java Class` 菜单选项，为实体添加一个类文件。在新类对话框中，将类命名为 `Product`，选择列表中的 `Class`\
  \ 项，并按键盘回车键生成文件。\n\n当 `Product.java` 文件在编辑器中打开时，对其进行修改使其内容如下：\n\n```java\npackage\
  \ com.ebookfrenzy.roomdemo;\n\npublic class Product {\n    private int id;\n   \
  \ private String name;\n    private int quantity;\n\n    public Product(String name,\
  \ int quantity) {\n        this.name = name;\n        this.quantity = quantity;\n\
  \    }\n\n    public int getId() {\n        return this.id;\n    }\n\n    public\
  \ String getName() {\n        return this.name;\n    }\n\n    public int getQuantity()\
  \ {\n        return this.quantity;\n    }\n\n    public void setId(int id) {\n \
  \       this.id = id;\n    }\n\n    public void setName(String name) {\n       \
  \ this.name = name;\n    }\n\n    public void setQuantity(int quantity) {\n    \
  \    this.quantity = quantity;\n    }\n}\n```\n\n该类现在有了数据库表列的变量以及对应的 getter 和 setter\
  \ 方法。当然，在类被添加注解之前，它不会成为一个实体。在编辑器中保持打开类文件的情况下，添加注解和相应的导入语句：\n\n```java\npackage com.ebookfrenzy.roomdemo;\n\
  \nimport androidx.room.ColumnInfo;\nimport androidx.room.Entity;\nimport androidx.room.PrimaryKey;\n\
  \n@Entity(tableName = \"products\")\npublic class Product {\n    @PrimaryKey(autoGenerate\
  \ = true)\n    @ColumnInfo(name = \"productId\")\n    private int id;\n    @ColumnInfo(name\
  \ = \"productName\")\n    private String name;\n    private int quantity;\n}\n```\n\
  \n这些注解声明此实体为名为 `products` 的表的实体，并为 `id` 和 `name` 变量分配了列名。`id` 列也被配置为主键并自动生成。由于在\
  \ SQL 查询中不需要引用 `quantity` 列，因此没有为 `quantity` 变量分配列名。\n\n## 72.4 创建数据访问对象 (DAO)\n\
  \n定义产品实体后，下一步是创建 DAO 接口。再次参考 `Project` 工具窗口，右键点击 `app -> java -> com.ebookfrenzy.roomdemo`\
  \ 项，并选择 `New -> Java Class` 菜单选项。在新类对话框中，在 `Name` 字段中输入 `ProductDao`，并如图 72-1 所示从列表中选择\
  \ `Interface`：\n\n![image-ZGQRT7BM](img/image-ZGQRT7BM.jpeg)\n\n图 72-1\n\n按回车键生成新接口，并在编辑器中加载\
  \ `ProductDao.java` 文件后进行以下更改：\n\n```java\npackage com.ebookfrenzy.roomdemo;\n\n\
  import androidx.lifecycle.LiveData;\nimport androidx.room.Dao;\nimport androidx.room.Insert;\n\
  import androidx.room.Query;\nimport java.util.List;\n\n@Dao\npublic interface ProductDao\
  \ {\n    @Insert\n    void insertProduct(Product product);\n\n    @Query(\"SELECT\
  \ * FROM products WHERE productName = :name\")\n    List<Product> findProduct(String\
  \ name);\n\n    @Query(\"DELETE FROM products WHERE productName = :name\")\n   \
  \ void deleteProduct(String name);\n\n    @Query(\"SELECT * FROM products\")\n \
  \   LiveData<List<Product>> getAllProducts();\n}\n```\n\nDAO 实现了从产品数据库中插入、查找和删除记录。插入方法传递一个\
  \ 对象，而查找和删除记录的方法传递字符串。`getAllProducts()` 方法返回包含所有记录的 `LiveData` 对象。此方法将用于保持界面中的\
  \ `RecyclerView` 产品列表与数据库同步。\n\n## 72.5 添加 Room 数据库\n\n在将仓库添加到项目之前的最后一个任务是实现 Room\
  \ 数据库。向项目添加名为 `RoomDatabase` 的新类，这次选择 `Class` 。\n\n文件生成后，按照“Android Room 持久化库”章节概述的步骤对其进行修改：\n\
  \n```java\npackage com.ebookfrenzy.roomdemo;\n\nimport android.content.Context;\n\
  import androidx.room.Database;\nimport androidx.room.Room;\nimport androidx.room.RoomDatabase;\n\
  \n@Database(entities = {Product.class}, version = 1)\npublic abstract class ProductRoomDatabase\
  \ extends RoomDatabase {\n    public abstract ProductDao productDao();\n\n    private\
  \ static ProductRoomDatabase INSTANCE;\n\n    static ProductRoomDatabase getDatabase(final\
  \ Context context) {\n        if (INSTANCE == null) {\n            synchronized\
  \ (ProductRoomDatabase.class) {\n                INSTANCE = Room.databaseBuilder(context.getApplicationContext(),\n\
  \                        ProductRoomDatabase.class,\n                        \"\
  product_database\").build();\n            }\n        }\n        return INSTANCE;\n\
  \    }\n}\n```\n\n## 72.6 添加仓库\n\n向项目添加名为 `ProductRepository` 的新类，选择 `Class` 。\n\
  \n仓库类将代表 ViewModel 与 Room 数据库进行交互。它必须提供使用 `DAO` 插入、删除和查询产品记录的方法。除了 `getAllProducts()`\
  \ DAO 方法（该方法返回 `LiveData` 对象）外，这些数据库操作必须在主线程之外的独立线程中执行。\n\n在 `ProductRepository.java`\
  \ 文件中，添加用于将搜索结果返回给仓库线程的代码：\n\n\n\n\n\n```java\npackage com.ebookfrenzy.roomdemo;\n\
  \nimport android.os.Handler;\nimport android.os.Looper;\nimport android.os.Message;\n\
  import java.util.concurrent.ExecutorService;\nimport java.util.concurrent.Executors;\n\
  import androidx.lifecycle.MutableLiveData;\nimport java.util.List;\n\npublic class\
  \ ProductRepository {\n    private final MutableLiveData<List<Product>> searchResults\
  \ = new MutableLiveData<>();\n    private List results;\n    Handler handler = new\
  \ Handler(Looper.getMainLooper()) {\n        @Override public void handleMessage(Message\
  \ msg) {\n            searchResults.setValue(results);\n        }\n    };\n}\n```\n\
  \n上述代码声明了一个名为 `searchResults` 的 `MutableLiveData` 变量，当异步搜索任务完成时，结果就会存储其中（在稍后的教程中，`ViewModel`\
  \ 内的观察者将监控此活动数据对象）。\n\n仓库类现在必须提供一些 `ViewModel` 可以调用的方法来启动这些操作。然而，仓库需要通过 `ProductRoomDatabase`\
  \ 实例获取 `DAO` 引用才能完成任务。为 `ProductRepository` 类添加一个构造方法来执行这些任务：\n\n```java\nimport\
  \ android.app.Application;\n\npublic class ProductRepository {\n    private final\
  \ MutableLiveData<List<Product>> searchResults = new MutableLiveData<>();\n    private\
  \ List results;\n    private final ProductDao productDao;\n\n    public ProductRepository(Application\
  \ application) {\n        ProductRoomDatabase db;\n        db = ProductRoomDatabase.getDatabase(application);\n\
  \        productDao = db.productDao();\n    }\n}\n```\n\n在存储了 DAO 引用后，就可以按照以下方法添加到\
  \ `ProductRepository` 类文件中：\n\n```java\npublic void insertProduct(Product newproduct)\
  \ {\n    ExecutorService executor = Executors.newSingleThreadExecutor();\n    executor.submit(()\
  \ -> productDao.insertProduct(newproduct));\n    executor.shutdown();\n}\n\npublic\
  \ void deleteProduct(String name) {\n    ExecutorService executor = Executors.newSingleThreadExecutor();\n\
  \    executor.submit(() -> productDao.deleteProduct(name));\n    executor.shutdown();\n\
  }\n\npublic void findProduct(String name) {\n    ExecutorService executor = Executors.newSingleThreadExecutor();\n\
  \    executor.submit(() -> {\n        results = productDao.findProduct(name);\n\
  \        handler.sendEmptyMessage(0);\n    });\n    executor.shutdown();\n}\n```\n\
  \n在插入和删除方法中，创建并使用了适当的新线程来执行相应的数据库操作。在 `findProduct()` 方法中，会向 `handler` 发送消息，指示有新结果可用。\n\
  \n完成仓库类还剩最后一项任务。用户界面布局中的 `RecyclerView` 必须与数据库中存储的当前产品列表同步。`ProductDao` 类已经包含一个名为\
  \ `getAllProducts()` 的方法，该方法使用 SQL 查询选择所有数据库记录并将它们封装在 `LiveData` 对象中返回。仓库需要在初始化时调用一次此方法，并将结果存储在一个可以被\
  \ `ViewModel` 观察、进而被 UI 控制器观察的 `LiveData` 对象中。一旦设置完成，每当数据库表发生变化时，UI 控制器观察者都会收到通知，`RecyclerView`\
  \ 就可以更新最新的产品列表。留在 `ProductRepository.java` 文件中，在构造函数添加 `LiveData` 变量并调用 DAO 的 `getAllProducts()`\
  \ 方法：\n\n```java\nimport androidx.lifecycle.LiveData;\n\npublic class ProductRepository\
  \ {\n    private final MutableLiveData<List<Product>> searchResults = new MutableLiveData<>();\n\
  \    private List results;\n    private final LiveData<List<Product>> allProducts;\n\
  \    private final ProductDao productDao;\n\n    public ProductRepository(Application\
  \ application) {\n        ProductRoomDatabase db;\n        db = ProductRoomDatabase.getDatabase(application);\n\
  \        productDao = db.productDao();\n        allProducts = productDao.getAllProducts();\n\
  \    }\n}\n```\n\n为了完成仓库，添加 `ViewModel` 可以调用的方法以获取 `allProducts` 和 `searchResults`\
  \ 活动数据对象的引用：\n\n```java\npublic LiveData<List<Product>> getAllProducts() {\n   \
  \ return allProducts;\n}\n\npublic MutableLiveData<List<Product>> getSearchResults()\
  \ {\n    return searchResults;\n}\n```\n\n## 72.7 添加 ViewModel\n\n`ViewModel` 负责创建仓库实例，并提供方法以及\
  \ `LiveData` 对象，UI 控制器利用这些对象来保持用户界面与底层数据库同步。正如在 `ProductRepository.java` 中实现的那，仓库构造函数需要访问应用上下文以获取\
  \ Room 数据库实例。为了让应用上下文在 `ViewModel` 中可访问以便传递给仓库，`ViewModel` 需要继承 `AndroidViewModel`\
  \ 而不是 `ViewModel`。\n\n首先，在 Project 工具窗口中找到 `com.ebookfrenzy.viewmodeldemo` 条目，右键点击它并选择\
  \ `New -> Java Class` 选项。接下来，将新类命名为 `MainViewModel` 并按下回车键。最后，编辑新类文件，将类改为扩展 `AndroidViewModel`\
  \ 并实现默认构造函数：\n\n```java\npackage com.ebookfrenzy.roomdemo.ui.main;\n\nimport android.app.Application;\n\
  import androidx.lifecycle.AndroidViewModel;\nimport androidx.lifecycle.LiveData;\n\
  import androidx.lifecycle.MutableLiveData;\nimport com.ebookfrenzy.roomdemo.Product;\n\
  import com.ebookfrenzy.roomdemo.ProductRepository;\nimport java.util.List;\n\npublic\
  \ class MainViewModel extends AndroidViewModel {\n    final private ProductRepository\
  \ repository;\n    final private LiveData<List<Product>> allProducts;\n    final\
  \ private MutableLiveData<List<Product>> searchResults;\n\n    public MainViewModel\
  \ (Application application) {\n        super(application);\n        repository =\
  \ new ProductRepository(application);\n        allProducts = repository.getAllProducts();\n\
  \        searchResults = repository.getSearchResults();\n    }\n}\n```\n\n构造函数创建了一个仓库实例，然后使用它来获取结果和活动数据对象的引用，以便\
  \ UI 控制器可以观察它们。现在 `ViewModel` 中剩下的所有工作是实现在 UI 控制器中响应按钮点击以及在设置 LiveData 对象观察者时将调用的方法：\n\
  \n```java\nMutableLiveData<List<Product>> getSearchResults() {\n    return searchResults;\n\
  }\n\nLiveData<List<Product>> getAllProducts() {\n    return allProducts;\n}\n\n\
  public void insertProduct(Product product) {\n    repository.insertProduct(product);\n\
  }\n\npublic void findProduct(String name) {\n    repository.findProduct(name);\n\
  }\n\npublic void deleteProduct(String name) {\n    repository.deleteProduct(name);\n\
  }\n```\n\n## 72.8 创建产品项布局\n\n数据库中的每个产品名称将显示在主用户界面的 `RecyclerView` 列表中。这需要一个包含列表每行\
  \ `TextView` 的布局资源文件。右键点击 Project 工具窗口中的 `app -> res -> layout` 条目并选择 `New -> Layout\
  \ Resource File` 选项来添加此文件。将文件命名为 `product_list_item`，并在点击确定之前将根元素更改为垂直 `LinearLayout`\
  \ 以创建文件并加载到布局编辑器。在布局编辑器设计模式下，从调色板拖一个 `TextView` 对象到布局中，它默认会出现在布局顶部：\n\n ![image-46X8C0PY.jpg](img/image-46X8C0PY.jpeg)\n\
  \n图 72-2\n\n选中布局中的 `TextView`，使用属性窗口将视图 ID 设置为 `product_row`并将 `layout_height` 设置为\
  \ `30dp`。在 Component Tree 窗口中选择 `LinearLayout` 项并将 `layout_height` 属性设置为 `wrap_content`。\n\
  \n## 72.9 添加 RecyclerView 适配器\n\n\n\n\n\n正如“使用 RecyclerView 和 CardView 组件”章节中详细概述的那样，`RecyclerView`\
  \ 实例需要一个适配器类来提供要显示的数据。在 Project（项目）工具窗口中，右键点击 app -> `java` -> `com.ebookfrenzy.roomdemo`\
  \ 项，选择 `New` -> `Java Class` 菜单来添加此类。在对话框中，将类命名为 `ProductListAdapter`，并在列表中选择 `Class`，然后按下键盘回车键。将生成的\
  \ `ProductListAdapter.java` 类加载到编辑器后，按照如下代码实现该类：\n\n```java\npackage com.ebookfrenzy.roomdemo.ui.main;\n\
  \nimport android.view.LayoutInflater;\nimport android.view.View;\nimport android.view.ViewGroup;\n\
  import android.widget.TextView;\nimport com.ebookfrenzy.roomdemo.R;\nimport androidx.annotation.NonNull;\n\
  import androidx.recyclerview.widget.RecyclerView;\nimport com.ebookfrenzy.roomdemo.Product;\n\
  import java.util.List;\n\npublic class ProductListAdapter\nextends RecyclerView.Adapter\
  \ {\n\n    private final int productItemLayout;\n    private List productList;\n\
  \n    public ProductListAdapter(int layoutId) {\n        productItemLayout = layoutId;\n\
  \    }\n\n    public void setProductList(List products) {\n        productList =\
  \ products;\n        notifyDataSetChanged();\n    }\n\n    @Override\n    public\
  \ int getItemCount() {\n        return productList == null ? 0 : productList.size();\n\
  \    }\n\n    @NonNull\n    @Override\n    public ViewHolder onCreateViewHolder(ViewGroup\
  \ parent, int viewType) {\n        View view = LayoutInflater.from(\n          \
  \      parent.getContext()).inflate(productItemLayout, parent, false);\n       \
  \ return new ViewHolder(view);\n    }\n\n    @Override\n    public void onBindViewHolder(final\
  \ ViewHolder holder, final int listPosition) {\n        TextView item = holder.item;\n\
  \        item.setText(productList.get(listPosition).getName());\n    }\n\n    static\
  \ class ViewHolder extends RecyclerView.ViewHolder {\n        TextView item;\n \
  \       ViewHolder(View iteview) {\n            super(iteview);\n            item\
  \ = iteview.findViewById(R.id.product_row);\n        }\n    }\n}\n```\n\n## 72.10\
  \ 准备主 Activity\n\n最后一个需要修改的组件是 `MainActivity` 类，它需要在 `Button` 视图上配置监听器，并在 `ViewModel`\
  \ 类中的 live 数据对象配置观察者。在添加这些代码之前，必须执行一些准备工作以添加导入项和变量。编辑 `MainActivity.java` 文件并进行如下修改：\n\
  \n```java\n.\n.\nimport androidx.lifecycle.ViewModelProvider;\n.\n.\npublic class\
  \ MainActivity extends AppCompatActivity {\n\n    private ActivityMainBinding binding;\n\
  \    private MainViewModel viewModel;\n    private ProductListAdapter adapter;\n\
  \n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n    \
  \    super.onCreate(savedInstanceState);\n.\n.\n        viewModel = new ViewModelProvider(this).get(MainViewModel.class);\n\
  \        listenerSetup();\n        observerSetup();\n        recyclerSetup();\n\
  \    }\n.\n```\n\n在代码的不同阶段，应用程序需要清除用户界面上 显示的产品信息。为了避免代码重复，请添加以下 `clearFields()`\
  \ 方便函数：\n\n```java\nprivate void clearFields() {\n    binding.productID.setText(\"\
  \");\n    binding.productName.setText(\"\");\n    binding.productQuantity.setText(\"\
  \");\n}\n```\n\n在应用程序可以构建和测试之前，需要将上述 `onCreate()` 方法中调用的三个设置方法添加到类中。\n\n## 72.11\
  \ 添加按钮监听器\n\n主 fragment 的用户界面布局包含三个按钮，每个按钮在用户点击时都需要执行一个特定的任务。编辑 `MainActivity.java`\
  \ 文件并添加 `listenerSetup()` 方法：\n\n```java\n.\n.\nimport com.ebookfrenzy.roomdemo.Product;\n\
  .\n.\nprivate void listenerSetup() {\n    binding.addButton.setOnClickListener(view\
  \ -> {\n        String name = binding.productName.getText().toString();\n      \
  \  String quantity = binding.productQuantity.getText().toString();\n        if (!name.isEmpty()\
  \ && !quantity.isEmpty()) {\n            Product product = new Product(name,\n \
  \                   Integer.parseInt(quantity));\n            viewModel.insertProduct(product);\n\
  \            clearFields();\n        } else {\n            binding.productID.setText(\"\
  Incomplete information\");\n        }\n    });\n\n    binding.findButton.setOnClickListener(view\
  \ ->\n            viewModel.findProduct(binding.productName.getText().toString()\n\
  \    )\n    );\n\n    binding.deleteButton.setOnClickListener(view -> {\n      \
  \  viewModel.deleteProduct(binding.productName.getText().toString());\n        clearFields();\n\
  \    });\n}\n.\n.\n}\n```\n\n`addButton` 监听器执行了一些基础验证，以确保用户输入了产品名称和数量，并使用这些数据创建了一个新的\
  \ `Product` 实体对象（注意，数量字符串被转换为整数以匹配实体数据类型）。在清除字段之前，随后会调用 `ViewModel.insertProduct()`\
  \ 方法并传入该 `Product` 对象。\n\n`findButton` 和 `deleteButton` 监听器将产品名称传递给 `ViewModel.findProduct()`\
  \ 或 `deleteProduct()` 方法。\n\n## 72.12 添加 LiveData 观察者\n\n用户界面现在需要添加观察者，以便与 `ViewModel`\
  \ 内部的 `searchResults` 和 `allProducts` live 数据对象保持同步。留在 `MainActivity.java` 文件中，按照如下代码实现观察者设置方法：\n\
  \n```java\n.\n.\nimport java.util.Locale;\n.\n.\nprivate void observerSetup() {\n\
  \    viewModel.getAllProducts().observe(this,\n            products -> adapter.setList(products));\n\
  \n    viewModel.getSearchResults().observe(this,\n            products -> {\n  \
  \              if (!products.isEmpty()) {\n                    binding.productID.setText(String.format(Locale.US,\
  \ \"%d\",\n                            products.get(0).getId()));\n            \
  \        binding.productName.setText(products.get(0).getName());\n             \
  \       binding.productQuantity.setText(String.format(Locale.US, \"%d\",\n     \
  \                       products.get(0).getQuantity()));\n                } else\
  \ {\n                    binding.productID.setText(\"No Match\");\n            \
  \    }\n            });\n}\n```\n\n`allProducts` 观察者将当前产品列表传递给 `RecyclerView` 的\
  \ `setList` 方法。\n\n`searchResults` 观察者检查数据库是否至少找到了一个匹配结果，从列表中提取第一个匹配的 `Product`\
  \ 对象，在必要时进行转换，并赋值给布局中的 `TextView` 和 `EditText`。如果搜索失败，将通过显示在 `TextView` 上的消息通知用户。\n\
  \n## 72.13 初始化 RecyclerView\n\n按照如下代码添加设置方法，以初始化和配置 `RecyclerView`：\n\n```java\n\
  .\n.\nimport androidx.recyclerview.widget.LinearLayoutManager;\n.\n.\nprivate void\
  \ recyclerSetup() {\n    adapter = new ProductListAdapter(R.layout.product_list_item);\n\
  \    binding.productRecycler.setLayoutManager(\n            new LinearLayoutManager(getContext()));\n\
  \    binding.productRecycler.setAdapter(adapter);\n}\n.\n.\n}\n\n## 72.14 测试 RoomDemo\
  \ 应用\n\n在设备或模拟器上编译并运行应用程序，添加一些产品并确保它们自动显示在 `RecyclerView` 中。对现有产品进行搜索，并验证产品 ID 和数量字段相应更新。最后，输入现有产品的名称，从数据库中删除它，并确认它已从\
  \ `RecyclerView` 产品列表中移除。\n\n## 72.15 使用 Database Inspector\n\n正如在“Android Room\
  \ 持久库”中所概述的，可以使用 `Database Inspector` 工具检查与运行应用程序关联的 Room 数据库并进行细微的数据更改。在使用 RoomDemo\
  \ 应用添加了一些数据库记录后，使用 `View` -> `Tool Windows` -> `App Inspection` 菜单选项显示 Database\
  \ Inspector 工具：\n\n在检查器窗口中，从下方图 72-3 标记为 `A` 的菜单中选择运行的应用：\n\n在 `Databases` 面板 (`B`)\
  \ 中，双击 `products` 表以查看存储在数据库中的表行。启用 `Live updates` 选项 (`C`)，然后运行的应用程序向数据库添加更多记录。注意\
  \ Database Inspector 会实时更新表数据 (`D`) 以反映更改。\n\n\n\n\n关闭实时更新（Live updates）以便使表格不再是只读状态，双击表格行的数量单元格，并在按下键盘\
  \ `Enter` 键之前更改值。返回运行中的应用程序并搜索该产品，以确认在检查器（inspector）中对数量所的更改已保存到数据库表中。\n\n最后，点击表格查询按钮（如下方图\
  \ 72-4 所示的箭头所示）以显示新的查询标签页 (A)，确保选中了 `product_database` (B)，在查询文本字段中输入 SQL 语句 (C)\
  \ 并点击 `Run` 按钮 (D)：\n\n![image-B0DOETXT.jpg](img/image-B0DOETXT.jpeg)\n\n图 72-4\n\
  \n行列表应当更新更新以反映 SQL 查询 (E) 的结果。\n\n## 72.16 总结\n\n本章演示了如何使用 `Room` 持久化库在 `SQLite`\
  \ 数据库中存储数据。完成的项目使用了 `repository`（仓库）将 `ViewModel` 与所有数据库操作分离。它还演示了实体（entities）、`DAO`\
  \ 以及 `room database` 实例的创建，包括在执行某些数据库操作时对异步任务的使用。\n\n## 73. 创建、测试和上传 Android App\
  \ Bundle\n\n一旦 Android 应用程序的开发工作完成并在广泛的 Android 设备上通过测试，下一步就是准备应用程序提交到 `Google Play`。然而，在提交之前，必须对应用程序进行发布打包并使用私钥进行签名。本章将介绍获取私钥、为项目准备\
  \ `Android App Bundle` 以及将其上传到 `Google Play` 的流程。\n\n## 73.1 发布准备流程\n\n在本书的到目前为止，我们一直在以适用于测试和调试的模式构建应用程序项目。另一方面，通过\
  \ `Google Play` 向客户发布应用程序包则需要额外的步骤。第一个要求是在 `release mode`（发布模式）而非 `debug mode`（调试模式）中编译应用程序。其次，应用程序必须使用私钥签名，该私钥用于唯一标识你作为应用程序的开发者。最后，应用程序必须打包成\
  \ `Android App Bundle`。\n\n虽然这些任务可以在 `Android Studio` 环境之外完成，但正如本章其余所述，使用 `Android\
  \ Studio` 的构建机制可以更方便地执行这些操作。不过，了解更多关于 `Android App Bundles` 的信息是关重要的。\n\n## 73.2\
  \ Android App Bundles\n\n当用户从 `Google Play` 安装应用时，该应用是以 `APK` 文件的形式下载的。该文件包含了在用户设备上安装和运行应用所需的所有内容。在\
  \ `Android Studio 3.2` 引入之前，开发者使用 `Android Studio` 生成一个或多个 `APK` 文件并将它们上传到 `Google\
  \ Play`。支持多种设备类型、屏幕尺寸和语言需要为每个目标设备和语言创建并上传多个自定义的 `APK` 文件，或者生成一个包含所有不同配置资源和平台二进制的大型通用\
  \ `APK`。\n\n创建多个 `APK` 文件涉及大量工作，且在每次更新应用时都必须重复，这给应用发布过程带来了相当的时间开销。\n\n通用 `APK` 选项虽然减轻了开发者的负担，但导致了一个完全意外的问题。通过分析应用安装指标，Google\
  \ 发现安装包 `APK` 文件越大（导致下载时间变长和存储占用增加），应用获得的转化就越少。转化率的计算方式为在 `Google Play` 查看该应用后完成安装的用户的用户占百分比。Google\
  \ 估计，`APK` 文件大小每增加 6MB，应用的转化率就会下降 1%。\n\n`Android App Bundles` 解决了这些问题，允许开发者从 `Android\
  \ Studio` 内部创建一个单一包，并让 `Google Play` 为每个单独的支持配置自动生成自定义的 `APK` 文件（这一概念称为“动态交付”，Dynamic\
  \ Delivery）。\n\n`Android App Bundle` 是一个 `ZIP` 文件，包含了为应用项目内已支持的设备和语言构建 `APK` 文件所需的所有文件。例如，项目可能包含不同屏幕尺寸的资源和图像。当用户安装应用时，`Google\
  \ Play` 会接收有关设备的信息，包括显示器、处理器架构和语言。使用这些信息，将相应的预生成 `APK` 文件传输到用户的设备上。\n\n`Dynamic\
  \ Delivery` 的另一个优点是将应用拆分为多个模块，称为“动态功能模块”（dynamic feature modules），每个模块包含应用内特定功能区域的代码和资源。每个动态功能模块都包含在与基础模块独立的\
  \ `APK` 文件中，并且在用户需要该功能时才会下载到设备上。`Dynamic Delivery` 和应用包还允许创建即时动态功能模块，这些模块无需安装整个应用即可在设备上立即运行。\n\
  \n尽管仍然可以从 `Android Studio` 生成 `APK` 文件，但应用包现在是向 `Google Play` 上传应用的推荐方式。\n\n## 73.3\
  \ 注册 Google Play 开发者控制台帐户\n\n应用程序提交过程的第一步是创建一个 `Google Play Developer Console` 帐户。如需，请访问\
  \ `https://play.google.com/apps/publish/signup/` 并按照指示完成注册过程。注意，注册需要支付一次性 25 美元的费用。一旦应用上市，Google\
  \ 将保留与应用相关的所有收入的 30%。创建账户后，可以在 `https://play.google.com/console` 访问开发者控制台。\n\n下一步是收集有关应用程序的信息。为了将应用推向市场，需要以下信息：\n\
  \n- 标题（Title）：应用程序的标题。\n- 短描述（Short Description）：最多 80 字的应用描述。\n- 完整描述（Full Description）：最多\
  \ 4000 字的应用描述。\n- 截图（Screenshots）：应用程序运行的截图（至少需要 2 张）。Google 建议提交 7 英寸或 10 英寸平板电脑的运行截图。\n\
  - 语言（Language）：应用程序的语言（默认是美国英语）。\n- 宣传文字（Promotional Text）：当应用出现在 Google Play 环境内的特殊宣传功能时将使用的文本。\n\
  - 应用类型（Application Type）：您的应用程序被视为游戏还是应用程序。\n- 类别（Category）：最符合您的应用程序的类别（例如：金融、健康与、教育、运动等）。\n\
  - 位置（Locations）：您希望应用购买的地理位置。\n- 联系详情（Contact Details）：用户联系您以获取应用支持的方式。选项包括网站、电子邮件和电话。\n\
  - 价格与分（Pricing & Distribution）：有关应用程序价格及其营销销售地理位置的信息。\n\n收集上述信息后，在 `Google Play\
  \ Console` 中点击 `Create app` 按钮开始创建流程。\n\n## 73.4 在控制台中配置应用程序\n\n首次点击 `Create app`\
  \ 按钮时，将显示如下图 73-1 所示的应用详情和声明屏幕：\n\n![image-89XBZDPY.jpg](img/image-89XBZDPY.jpeg)\n\
  \n图 73-1\n\n\n\n\n一旦应用入口已完全配置完成，点击`Create app`按钮（如上图所示）来添加应用并显示仪表板屏幕。在仪表板中，找到`Set\
  \ up your app`（设置您的应用）部分并展开任务列表以配置应用商店列目：\n\n![image-4DM6QT4J.jpg](img/image-4DM6QT4J.jpeg)\n\
  图 73-2\n\n依次处理链接列表并为应用提供所需信息，确保在每一步中都保存更改。\n\n## 73.5 启用 Google Play 应用签名\n\n直到最近，Google\
  \ Play 的上传仍是在 Android Studio 内部使用发布应用签名密钥进行签名，然后上传到 Google Play 控制台。虽然此选项可用，但推荐的上传方式是使用名为“Google\
  \ Play 应用签名”（Google Play App Signing）的过程。对于新创建的应用，这涉及加入 Google Play 应用签名并生成上传密钥以在\
  \ Android Studio 中对应用包（bundle）进行签名。当上传 Android Studio 生成的应用包文件时，Google Play 控制台会移除上传密钥，并使用安全存储在\
  \ Play 服务器中的应用签名密钥对文件进行签名。对于现有应用，需要一些额外步骤来启用 Google Play 签名，这将在章末尾介绍。\n\n在 Google\
  \ Play 控制台中，从`All Apps`屏幕（通过左侧导航面板顶部访问）选择新添加的应用，展开`Setup`（设置）部分（图 73-3 中标记为 A），并选择`App\
  \ Signing`（应用签名）选项（B）。\n\n![image-7EMUP9.jpg](img/image-7EMUP9.jpeg)\n图 73-3\n\n\
  点击`Create`按钮（C）加入 Google Play 签名。控制台现在准备好创建应用的第一个发布版本。然而，在此之前，下一步是在 Android Studio\
  \ 中生成上传密钥。这是生成签名包过程的一部分。请保持当前 Google Play 屏幕加载状态，因为我们将在本章晚些时候返回此处。\n\n## 73.6 创建密钥库文件\n\
  \n要创建密钥库文件，选择 Android Studio 中的`Build -> Generate Signed Bundle / APK…`选项，显示如图 73-4\
  \ 所示的`Generate Signed Bundle or APK`对话框：\n\n![image-PADF6JDP.jpg](img/image-PADF6JDP.jpeg)\n\
  图 73-4\n\n在点击`Next`按钮之前，确保已选择`App Bundle`（应用包）。如果你有现有的发布密钥库文件，点击下一个屏幕上的`Choose existing…`按钮，并导航到选择该文件。如果你尚未创建密钥库文件，点击`Create\
  \ new…`按钮显示`New Key Store`（新密钥库）对话框（图 73-5）。点击`Key path`字段右侧的按钮，导航到文件系统上的合适位置，为密钥库文件输入名称（例如`release.keystore.jks`）并点击`OK`按钮。\n\
  \n`New Key Store`对话框分为两个部分。顶部部分与密钥库文件有关。在此部分中，在`Password`（密码）和`Confirm`（确认）字段中输入强密码以保护密钥库文件。底部部分与将存储在密钥库文件中上传密钥有关。\n\
  \n![image-AB0NG7TQ.jpg](img/image-AB0NG7TQ.jpeg)\n图 73-5\n\n在`New Key Store`对话框的`Key`部分中，输入以下详细信息：\n\
  - 引用密钥的别名（alias）。可以是任何字符序列，但系统仅使用前八位。\n- 用于保护密钥的足够强密码。\n- 密钥有效的年数（Google 建议时长超过\
  \ 25 年）。\n- 此外，必须为剩余字段中的至少一个提供信息（例如，你的姓、名或组织名称）。\n\n信息输入完成后，点击`OK`按钮创建包。\n\n## 73.7\
  \ 创建 Android 应用包\n\n下一步是指示 Android Studio 在发布模式下构建应用包文件，并使用新创建的私钥对其进行签名。此时，`Generate\
  \ Signed Bundle or APK`对话框应仍显示，且`keystore path`、`passwords`和`key alias`字段已填充信息：\n\
  \n![image-2ABQA3RO.jpg](img/image-2ABQA3RO.jpeg)\n图 73-6\n\n确保已启用`Export Encrypted\
  \ Key`（导出加密密钥）选项，并在假设其他设置正确的情况下，点击`Next`按钮进入应用包生成屏幕（图 73-7）。在此屏幕中，检查`Destination\
  \ Folder`（目标文件夹）设置，以验证生成应用包文件的位置是可接受的。如果偏于其他位置，点击文本字段右侧的按钮并导航到所需的文件系统位置。\n\n![image-OYG1NNFJ.jpg](img/image-OYG1NNFJ.jpeg)\n\
  图 73-7\n\n点击`Create`按钮并等待`Gradle`系统构建应用包。构建完成后，将出现一个对话框，提供在资源管理器窗口中打开包含应用包文件的文件夹或将文件加载到`APK\
  \ Analyzer`的选项：\n\n![image-OGEFL2F2.jpg](img/OGEFL2F2.jpeg)\n图 73-8\n\n此时，应用已准备好提交到\
  \ Google Play。点击`locate`链接打开文件系统浏览器窗口。文件应命名为`bundle.aab`并位于项目指定的`app/release`子目录下。\n\
  \n## 73.8 生成测试 APK 文件\n\n此阶段的一个可选步骤是从应用包生成 APK 文件，并在设备或模拟器上运行它们。Google 提供了一个名为`bundletool`的命令行工具专门用于此，可以从以下\
  \ URL 下载：\n\nhttps://github.com/google/bundletool/releases\n\n在编写时，`bundletool`以`.jar`\
  \ 文件的形式提供，可以如下所示从命令行执行（注意版本号可能已发生变化）：\n\n```\njava -jar bundletool-all-0.9.0.jar\n\
  ```\n\n运行上述命令将列出工具中的所有选项。要从应用包生成 APK 文件，使用`build-apks`选项。文件还需要签名，以生成可在设备上安装的 APK\
  \ 文件。为了实现这一点，包含`--ks`选项指定此处之前创建的密钥库路径，以及`--ks-key-alias`选项指定生成密钥时提供的别名。\n\n最后，必须使用`--output`标志指定生成\
  \ APK 文件的文件（称为 APK Set）路径。该文件不能已存在且必须具有`.apks`文件扩展名。将这些要求结合起来得到如下命令行（允许根据操作系统路径结构进行调整）：\n\
  \n```\njava -jar bundletool-all-0.9.0.jar build-apks --bundle=/tmp/MyApps/app/release/bundle.aab\
  \ --output=/tmp/MyApks.apks --ks=/MyKeys/release.keystore.jks --ks-key-alias=MyReleaseKey\n\
  ```\n\n执行此命令时，在生成 APK 文件到到 APK Set 文件之前，将弹出提示请求密钥库密码。APK Set 文件是一个包含从应用包生成的所有 APK\
  \ 文件的 ZIP 文件。\n\n要在连接的设备或模拟器上安装相应的 APK 文件，请使用类似下方的命令：\n\n```\njava -jar bundletool-all-0.9.0.jar\
  \ install-apks --apks=/tmp/MyApks.apks\n```\n\n\n\n\n也可以在不安装的情况下，从连接设备的 APK Set\
  \ 中提取 APK 文件。此过程的第一步是按照如下方式获取连接设备的规格说明：\n\n```bash\njava -jar bundletool-all-0.9.0.jar\
  \ get-device-spec --output=/tmp/device.json\n```\n\n上述命令将生成一个类似下方的 JSON 文件：\n\n\
  ```json\n{\n  \"supportedAbis\": [\"x86\"],\n  \"supportedLocales\": [\"en-US\"\
  ],\n  \"screenDensity\": 420,\n  \"sdkVersion\": 27\n}\n```\n\n接下来，使用此规格文件从 APK\
  \ Set 中提取匹配的 APK 文件：\n\n```bash\njava -jar bundletool-all-0.9.0.jar extract-apks\
  \ --apks=/tmp/MyApks.apks --output-dir=/tmp/nexus5_apks --device-spec=/tmp/device.json\n\
  ```\n\n执行后，通过 `--output-dir` 标志指定的目录将包含适用于指定设备配置的正确 APK 文件。\n\n将 Android 应用推向市场的下一步是将其提交到\
  \ Google Play 开发者控制台以便进行测试。\n\n## 73.9 上传 App Bundle 到 Google Play 开发者控制台\n\n返回\
  \ Google Play 控制台，在点击“创建新版本”（B）按钮之前，选择导航面板中“测试”部分的“内部测试”选项（如图 73-9 中的 A 所示）：\n\n\
  ![image-AABJA6DW.jpg](img/image-AABJA6DW.jpeg)\n\n图 73-9\n\n在生成的屏幕上，点击“继续”（下方标记为\
  \ A）按钮以确认使用 Google Play 应用签名，然后将 Android Studio 生成的 bundle 文件拖放到上传投放点（B）：\n\n![image-QL61I6YG.jpg](img/image-QL61I6YG.jpeg)\n\
  \n图 73-10\n\n上传完成后，向下滚动屏幕并输入发布名称和可选的发布说明。发布名称可以是任何帮助你识别该发布版本的信息，且对用户不可见。\n\n应用 bundle\
  \ 文件上传后，Google Play 将生成所有用于测试的必要 APK 文件。一旦 APK 文件生成完毕，滚动到屏幕底部并点击“保存”按钮。保存设置后，点击“查看版本”按钮。\n\
  \n## 73.10 探索 App Bundle\n\n在审核屏幕上，点击已上传 bundle 右侧的箭头，如图 73-11 所示：\n\n![image-3HW9T1OR.jpg](img/image-3HW9T1OR.jpeg)\n\
