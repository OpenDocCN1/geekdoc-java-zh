  \n许多结构（例如这种）都是为实体设计的。通常有两种常用的生成方法：第一是手动生成，第二种是使用生成器（spawner）。\n\n#### 实体的生成\n\n\
  可以手动生成实体。\n\n##### 如何手动生成实体\n\n首先，在你的 `WorldGen` 类内部创建你想要生成的实体对象，你可以使用如下代码来实现：\n\
  \n点击此处查看代码图片\n\n```java\nEntityZombie entity = new EntityZombie(world);\n```\n\n\
  在这种情况下，生成的实体将是一个僵尸，但相同的代码可以适用于每种类型的实体。\n\n* * *\n\n### 注意事项：生成位置\n\n正如你可能知道的，大多数实体在墙内存活不了多久。因此，确保生成位置是智能的非常重要；否则它会死亡。此外，确保在将生成区域清空后再生成实体，否则它最终仍然死亡。\n\
  \n在创建实体后，给它一个生成位置，你可以通过添加以下行代码来实现：\n\n点击此处查看代码图片\n\n```java\nentity.setPosition(x\
  \ + 1, y + 2, z + 1);\n```\n\n在这里，参数正如你预期的，是生物的 x、y、z 位置。确保实体生成在空中，这意味着方法中的坐标以及上方高出的一个方格都是空气。\n\
  \n最后，你必须实际生成这个实体，你可以使用以下代码：\n\n点击此处查看代码图片\n\n```java\nworld.spawnEntityInWorld(entity);\n\
  ```\n\n创建并生成实体的完整代码应该像列表 16.4 所示。\n\n**列表 16.4 完整的实体生成代码**\n\n点击此处查看代码图片\n\n* *\
  \ *\n\n#### 使用实体生成器\n\n\n\n\n\n你也可以使用生物刷生成器（mob spawner）在你的结构中生成生物。\n\n使用生物刷生成器的优点如下：\n\
  \n![Image](img/image00525.jpeg) 很容易生成大量的实体。\n\n![Image](img/image00525.jpeg) 你可以创建一个结构（例如地下城），让你在其中进行战斗。\n\
  \n使用生物刷生成器的缺点如下：\n\n![Image](img/image00525.jpeg) 你不能用它一次性只生成少数实体。\n\n![Image](img/image00525.jpeg)\
  \ 你需要放置一个方块。\n\n![Image](img/image00525.jpeg) 你需要知道想要生成的实体的代码名称。\n\n![Image](img/image00525.jpeg)\
  \ 单个生成器只能生成一种类型的实体。\n\n### 如何创建生物刷生成器\n\n要创建一个可以工作的生物刷生成器，你首先需要创建生物刷生成器块。你可以通过以下代码在结构中放置方块来实现：\n\
  \n点击此处查看代码图片\n\n```java\nworld.setBlock(x + 5, y + 1, z + 1, Blocks.mob_spawner);\n\
  ```\n\n这放置了生物刷生成器块。它还放置了负责生物生成逻辑的刷 `TileEntity`。然而，你尚未设置它应该生成的生物类型。要做到这一点，你首先需要在\
  \ `WorldGen` 类中将 `TileEntity` 获取为一个对象。使用此代码：\n\n点击此处查看代码图片\n\n```java\nTileEntityMobSpawner\
  \ spawner = (TileEntityMobSpawner)world.getTileEntity(x + 5, y + 1, z + 1);\n```\n\
  \n#### 注意事项：获取 TileEntity\n\n如果你在代码中移动了生物刷生成器，请尝试在放置方块之前获取 `TileEntity`。或者为方块放置和\
  \ `getTileEntity` 使用不同的坐标。此代码在生成阶段可能无法正常工作，因此请确保它是正确的。\n\n现在，你使用生成器 `TileEntity`\
  \ 来设置它将生成的生物。你可以使用以下代码来实现：\n\n点击此处查看代码图片\n\n```java\nif (spawner != null)\n{\n \
  \   spawner.func_145881_a().setEntityName(\"Skeleton\");\n}\nelse\n{\n    System.err.println(\"\
  Failed to fetch mob spawner entity at (\" + x + \", \" + y + \", \" + z + \")\"\
  );\n}\n```\n\n首先，会进行检查以确保实际上找到了生成器。如果你没有这个检查，这段代码可能会导致崩溃。\n\n`if` 语句中的代码只是设置了它将生成的生物类型。在这种情况下，它生成的是骨骼。\n\
  \n#### 提示：实体名称\n\n你可以通过查看 `EntityList` 类的底部找到游戏中每一个实体的实体名称。\n\n如果由于某种原因没有找到生成器，它将作为错误打印在日志中。这确保了你能够收到警报并修复它。\n\
  \n完整的生物刷生成器代码应该看起来所示 列表 16.5。\n\n**列表 16.5 生物刷生成器代码**\n\n点击此处查看代码图片\n\n```java\n\
  world.setBlock(x + 5, y + 1, z + 1, Blocks.mob_spawner);\nTileEntityMobSpawner spawner\
  \ = (TileEntityMobSpawner)world.getTileEntity(x + 5, y + 1, z + 1);\nif (spawner\
  \ != null)\n{\n    spawner.func_145881_a().setEntityName(\"Skeleton\");\n}\nelse\n\
  {\n    System.err.println(\"Failed to fetch mob spawner entity at (\" + x + \",\
  \ \" + y + \", \" + z + \")\");\n}\n```\n\n### 总结\n\n在本小时中，你完成了这本书的“世界生成”部分。在过去的两个小时里，你学习了如何为矿石、植物和结构添加世界生成。在本小时，你学习了如何安装和使用转换器，以及如何编辑导出文件使其能够无错误地生成到世界。最后，你还学习了实体生成选项以及如何对它们进行编码。\n\
  \n### 问答\n\n**Q。文件大小有限制吗？**\n\n**A。** 没有实际限制，但如果文件变得过长，不仅生成时间更长，在 Eclipse 中加载的时间也会更长。如果文件大小太大，甚至可能导致游戏崩溃。\n\
  \n**Q。可以添加的 `WorldGen` 文件数量有限制吗？**\n\n**A。** 没有实际限制，但如果文件变得过长，不仅生成时间更长，在 Eclipse\
  \ 中加载的时间也会更长。如果文件大小太大，甚至可能导致游戏崩溃。\n\n\n\n\n在处理服务器和客户端时，代理（Proxies）非常重要。有一个 `CommonProxy`，其代码专注于服务器端；而\
  \ `ClientProxy` 则包含了客户端的代码。正如你从早些章节中解释的 `@SideOnly(Side.CLIENT)` 代码所了解的，某些代码只在客户端上运行。如果这些代码在服务器上运行，Minecraft\
  \ 就会崩溃。代理可以被视为上方带有 `@SideOnly` 注解的整个类。\n\n然而，在 Forge 中，你必须对某些客户端或服务器代码使用代理，这些代码只能在\
  \ Minecraft 启动的特定时刻运行。这主要包括渲染的注册，这也是本本书使用代理的地方。\n\n### 在你的 Mod 中添加代理\n\n创建代理的首要要求是向\
  \ mod 文件中添加一些代码。在变量列表中添加以下两行：\n\n点击此处查看代码图片\n\n```java\n@SidedProxy(clientSide =\
  \ \"com.wuppy.samsmod.ClientProxySam\", serverSide = \"com.wuppy.samsmod.CommonProxySam\"\
  )\npublic static CommonProxySam proxy;\n```\n\n这段代码在 `CommonProxySam` 处有一个错误，你稍后通过创建文件来修复它。首先，了解这段代码的作用以及它是如何工作的是重要的。\n\
  \n`@SidedProxy` 注解包含两个参数：`clientSide` 和 `serverSide`。它们都接受一个 `String`，应包含引用客户端和服务器代理的\
  \ `String`。该 `String` 将是包名，后跟类名，中间用点分隔。在这种情况下，两个名为 `ClientProxySam` 和 `CommonProxySam`\
  \ 的类被添加到了 `com.wuppy.samsmod` 包中。\n\n直接在 `@SidedProxy` 注解下方添加 `CommonProxy` 变量。\n\
  \n添加此代码后，在 `preInit` 方法中添加如下单行代码：\n\n```java\nproxy.registerRendering();\n```\n\n\
  将此作为 `preInit` 方法的第一行是一个好主意。`registerRendering` 包含了注册渲染的代码，它并不依赖 `preInit` 之后的任何代码。然而，有些代码是依赖的。如果渲染尚未注册，这些代码可能会崩溃，因此用这一行代码启动\
  \ `preInit` 是重要的。\n\n### 编写 CommonProxy\n\n现在，将鼠标悬停在 `CommonProxySam` 下方的错误上并选择“Create\
  \ Class”（创建类）。Listing 17.1 显示了出现的文件。\n\n**列表 17.1 初始 CommonProxySam**\n\n* *\n\n\
  点击此处查看代码图片\n\n```java\npackage com.wuppy.samsmod;\n\npublic class CommonProxySam\n\
  {\n\n}\n```\n\n* *\n\n`CommonProxySam` 下方的错误现在消失了，但 `registerRendering` 处有一个错误。将鼠标悬停在错误上并选择“Create\
  \ Method”（创建方法）。在稍微清理一下类后，它看起来应该像 Listing 17.2。\n\n**列表 17.2 带有 registerRendering\
  \ 方法的 CommonProxySam**\n\n点击此处查看代码图片\n\n* *\n\n```java\npackage com.wuppy.samsmod;\n\
  \npublic class CommonProxySam\n{\n    public void registerRendering()\n    {\n\n\
  \    }\n}\n```\n\n* *\n\n由于所有的渲染都在客户端完成，此方法在 `CommonProxy` 中是空的。\n\n### 创建 ClientProxy\n\
  \n要创建 `ClientProxySam`，右键点击 `com.wuppy.samsmod` 包并选择 New Class（新建）。类名将为 `ClientProxySam`。Listing\
  \ 17.3 显示了结果类。\n\n**列表 17.3 初始 ClientProxySam**\n\n* *\n\n点击此处查看代码图片\n\n```java\n\
  package com.wuppy.samsmod;\n\npublic class ClientProxySam\n{\n\n}\n```\n\n* *\n\n\
  该类必须扩展 `CommonProxy`。它还必须重写 `CommonProxy` 中的方法。这样做之后，它看起来像 Listing 17.4。\n\n**列表\
  \ 17.4 带有 registerRendering 的 ClientProxy**\n\n点击此处查看代码图片\n\n* *\n\n```java\npackage\
  \ com.wuppy.samsmod;\n\npublic class ClientProxySam extends CommonProxySam\n{\n\
  \    @Override\n    public void registerRendering()\n    {\n\n    }\n}\n```\n\n\
  * *\n\n该类目前将保持为空，但在第 19 小时中是需要的。\n\n### 创建基础实体\n\n在创建生物之前，了解实体所需的基础代码是很重要的。\n\n\
  Minecraft 中的每个实体（`TileEntity` 除外）都必须使用 `EntityRegistry` 进行注册。对于 `EntitySamMob`（将在几小时后创建的生物），`EntityRegistry`\
  \ 将如下：\n\n点击此处查看代码图片\n\n```java\nEntityRegistry.registerModEntity(EntitySamMob.class,\
  \ \"sammob\", 0, this, 80, 3, true);\n```\n\n这段代码包含一个错误，你稍后通过创建 `EntitySamMob` 类来修复它。`registerModEntity`\
  \ 是注册实体所需的方法。其中的第一个参数是你想要注册的 `Entity` 类。\n\n第二个参数是你想要注册的名称。两个不同的 mod 在这里可以使用相同的名称，但在注册表中不能有两个同名的生物。第三个参数是生物的\
  \ ID。第四个参数是 `this`。第五个参数是追踪范围——这是实体距离玩家仍能更新的最大距离。第六个参数是更新频率。最后一个参数表示在更新时是否应随实体发送速度信息。\n\
  \n### 创建 EntitySamMob 类\n\n要创建 `EntitySamMob` 类，只需将鼠标悬停在错误上并选择“Create Class”。Listing\
  \ 17.5 显示了结果类。\n\n**列表 17.5 空的 EntitySamMob 类**\n\n* *\n\n点击此处查看代码图片\n\n```java\n\
  package com.wuppy.samsmod;\n\npublic class EntitySamMob\n{\n\n}\n```\n\n* *\n\n\
  要让 `EntitySamMob` 成为一个实体，你需要扩展 `Entity`，这通过在 `EntitySamMob` 之后添加以下代码来实现。不要忘记导入 `Entity`\
  \ 类。\n\n```java\nextends Entity\n```\n\n在导入 `Entity` 类时，确保你获取的是 `Minecraft` 包中的那一个。一旦这样做，你会在\
  \ `EntitySamMob` 下得到一个错误，你可以通过添加构造函数来修复它。添加构造函数后，`EntitySamMob` 处会出现第二个错误，你可以通过悬停在上方并选择“Add\
  \ Unimplemented Methods”（添加未实现的方法）来修复它。\n\n稍微清理一下类后，它看起来应该像 Listing 17.6。\n\n**列表\
  \ 17.6 带有所需方法的 EntitySamMob**\n\n\n\n```java\npackage com.wuppy.samsmod;\n\nimport\
  \ net.minecraft.entity.Entity;\nimport net.minecraft.nbt.NBTTagCompound;\nimport\
