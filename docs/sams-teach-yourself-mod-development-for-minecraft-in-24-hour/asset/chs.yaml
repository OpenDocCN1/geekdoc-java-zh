  \ 60);\n```\n\n/**\n * 在 Minecraft 中添加矿石生成点。只需在你扩展的 IWorldGeneration 类的生成方法中，使用此方法注册所有要生成的矿石。\n\
  \ *\n * @param block 要生成的方块\n * @param metadata 方块的元数据\n * @param target 要生成的目标区块\n\
  \ * @param world 要生成的世界\n * @param random 一个随机对象，用于在世界内获取随机位置以生成方块\n * @param int\
  \ 用于传递生成方法 X 坐标的整数\n * @param int 用于传递生成方法 Z 坐标的整数\n * @param int 用于设置每个区块（Chunk）在\
  \ X 轴上生成的最大 X 坐标值\n * @param int 用于设置每个区块（Chunk）在 Z 轴上生成的生成的最大 Z 坐标值\n * @param\
  \ int 用于设置矿脉最大尺寸的整数\n * @param int 每个区块方块可生成的次数整数\n * @param int 该方块可能生成的最小 Y 坐标高度整数\n\
  \ * @param int 该方块可能生成的最大 Y 坐标高度整数\n **/\npublic void addOreSpawn(Block block, int\
  \ metadata, Block target, World world, Random random, int blockXPos, int blockZPos,\
  \ int maxX, int maxZ, int maxVeinSize, int chancesToSpawn, int minY, int maxY)\n\
  {\n    int maxPossY = minY + (maxY - 1);\n    assert maxY > minY: \"最大 Y 必须大于最小\
