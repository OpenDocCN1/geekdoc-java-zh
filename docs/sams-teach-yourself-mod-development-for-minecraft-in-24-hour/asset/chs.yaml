  \n```java\nprivate int metadata;\n\n@Override\npublic void updateEntity()\n{\n \
  \   counter++;\n    if(counter == 20)\n    {\n        counter = 0;\n        metadata\
  \ = worldObj.getBlockMetadata(xCoord, yCoord, zCoord);\n    }\n}\n```\n\n注意 `counter`\
  \ 变量和 `metadata` 变量初始化的区别。`counter` 在创建时被初始化为 0，因为无论 tile entity（实体实体）的初始状态如何，它总是从零开始。`metadata`\
  \ 并没有在创建时初始化，而是在 `counter` 达到 20 时才初始化。这是因为在运行第一次更新时，`metadata` 并不总是 0。虽然区块在放置时\
  \ `metadata` 始终为 0，但当游戏停止并重启时，它可能不再是 0。因此，在开始时初始化它并不是明智的，而是在使用 `getBlockMetadata`\
  \ 方法获取值后才进行初始化。\n\n现在 `metadata` 已经存在了，我们应该将其增加 1。只需通过在 `metadata` 行上加上 `+1` 即可实现，代码应该如下所示：\n\
  \n点击此处查看代码图片\n\n```java\nmetadata = worldObj.getBlockMetadata(xCoord, yCoord, zCoord)\
  \ + 1;\n```\n\n然而，因为现在 `metadata` 增加了，所以需要一个检查来确保它不会超过 9，如果是，则将其设置为 0。添加此检查后，`updateEntity`\
  \ 方法应该如下：\n\n点击此处查看代码图片\n\n```java\n@Override\npublic void updateEntity()\n{\n \
  \   counter++;\n    if(counter == 20)\n    {\n        counter = 0;\n        metadata\
  \ = worldObj.getBlockMetadata(xCoord, yCoord, zCoord) + 1;\n        if(metadata\
  \ > 9)\n            metadata = 0;\n    }\n}\n```\n\n只剩一行代码了，这相对简单。这行代码实际上改变了区块的\
  \ `metadata`。对于这一点，可以使用 `World` 中的 `setBlockMetadataWithNotify` 方法。`setBlockMetadataWithNotify`\
  \ 的参数与 `setBlock` 相同，只是缺少了 `Block` 参数。`updateEntity` 方法如下：\n\n点击此处查看代码图片\n\n```java\n\
  @Override\npublic void updateEntity()\n{\n    counter++;\n    if(counter == 20)\n\
  \    {\n        counter = 0;\n        metadata = worldObj.getBlockMetadata(xCoord,\
  \ yCoord, zCoord) + 1;\n        if(metadata > 9)\n            metadata = 0;\n  \
  \      if(!worldObj.isRemote)\n            worldObj.setBlockMetadataWithNotify(xCoord,\
  \ yCoord, zCoord, metadata, 2);\n    }\n    super.updateEntity();\n}\n```\n\n在方法的最后，使用\
  \ `super.updateEntity()`是为了确保扩展类中的任何 `updateEntity` 代码也会运行。此外，在 `setBlockMetadataWithNotify`\
  \ 之上添加了一个检查。在 Minecraft 中，存在客户端和服务器，当你只是在玩游戏时也是如此。大多数逻辑，尤其是可能导致异步问题的逻辑，应该在服务器上处理。因此，`metadata`\
  \ 的更改应该只在服务器上运行，你可以通过在 `if` 语句中添加 `!worldObj.isRemote` 来。\n\n### 服务器同步\n\ntile entity\
  \ 可以做的另一件事与服务器同步，并与玩家交互。此 tile entity 的玩家交互和服务器同步很简单。当区块被右键点击时，计数器切换 metadata。因为这改变了区块的工作方式，它必须在服务器和客户端之间进行同步。此项需要一个\
  \ `Boolean` 来检查计数器是否应该改变。变量应该如下：\n\n点击此处查看代码图片\n\n```java\nprivate boolean counterEnabled\
  \ = true;\n```\n\n该变量也应该在 `updateEntity` 方法中使用，以确保当它为 `true` 时才启用计数器。在那里有该检查，代码如下：\n\
  \n点击此处查看代码图片\n\n```java\n@Override\npublic void updateEntity()\n{\n    if(counterEnabled)\n\
  \    {\n        counter++;\n        if(counter == 20)\n        {\n            counter\
  \ = 0;\n            metadata = worldObj.getBlockMetadata(xCoord, yCoord, zCoord)\
  \ + 1;\n            if(metadata > 9)\n                metadata = 0;\n          \
  \  if(!worldObj.isRemote)\n                worldObj.setBlockMetadataWithNotify(xCoord,\
  \ yCoord, zCoord, metadata, 2);\n        }\n    }\n    super.updateEntity();\n}\n\
  ```\n\n所以 `counterEnabled` 基于右键点击区块。为了确保此工作，需要两点：首先是 `Block` 类中右键点击区块运行时的方法，其次是\
  \ tile entity 中响应该操作的方法。\n\n***\n\n### 注意：Eclipse 代码自动补全\n\n此时，你应该已经知道当输入 `syso`\
  \ 并按下 `Ctrl+Space` 时，它会自动将其替换为 `System.out.println`，这节省了时间。然而，`Ctrl+Space` 组合键也可以用于\
  \ Eclipse 中的几乎所有其他地方。图 12.2\n\n**图 12.2** Eclipse 中的自动补全。\n\n当你输入类名或变量名的一半时，可以按下\
  \ Ctrl+Space，让 Eclipse 尝试自动补全。如果只有一个选项，它会立即像 `syso` 一样生成。如果有多个选项（例如 tile entity\
  \ 中的单词计数），会弹出一个窗口，你可以通过鼠标或方向键进行导航。一旦你找到了所需的条目，点击它或按回车即可自动为你放置。\n\n***\n\n#### 为你的区块添加右键点击功能\n\
  \n`BlockSamTE` 需要的方法名为 `onBlockActivated`。在这里，你应该检查区块上的 tile entity 是否实际上是 `TileEntitySam`。尽管它应该一直在那里且没有其他\
  \ tile entity 可以取代它的位置，但应该进行检查，以防出现错误。例如，假设某个 mod 无意中或故意更改了你的 tile entity。该方法应该如下所示。\n\
  \n点击此处查看代码图片\n\n```java\n@Override public boolean onBlockActivated(World world,\
  \ int x, int y, int z, EntityPlayer player, int side, float hitX, float hitY, float\
  \ hitZ)\n{\n    TileEntity entity = world.getTileEntity(x, y, z);\n    if(entity\
  \ != null)\n    {\n        if(entity instanceof TileEntitySam)\n        {\n    \
  \        TileEntitySam samEntity = (TileEntitySam) entity;\n            if(!world.isRemote)\n\
  \                samEntity.editCounter();\n            return true;\n        }\n\
  \    }\n    return false;\n}\n```\n\n此方法中的所有变量通过其名称都应该是清晰的。最后四个参数可能需要更多解释。`side`\
  \ 参数是击击中的区块侧面。最后三个参数是右键点击区块的精确坐标。\n\n\n\n\n当右键点击方块时，将使用 `getTileEntity` 获取该位置上的实体实体（tile\
  \ entity）。之后，会检查该实体是否为空且是否为 `TileEntitySam`。如果是，则会创建一个变量来存储该 `TileEntitySam`。然后会检查代码是否运行在服务器端，并调用实体实体中的一个新方法，即\
  \ `editCounter`。`editCounter` 包含了更改变量的逻辑。`BlockSamTE` 现在看起来应该像列表 12.4 所示。\n\n###\
