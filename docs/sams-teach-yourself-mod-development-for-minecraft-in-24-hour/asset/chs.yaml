  \ `canPlaceOn`。该方法决定了植物可以在哪些区块上生长。`SamPlant` 能够在 `dirt` 和 `grass` 上生长，所以代码看起来如下：\n\
  \n```java\nprotected boolean canPlaceOn(Block block)\n{\n    if(block == Blocks.dirt\
  \ || block == Blocks.grass)\n        return true;\n    else\n        return false;\n\
  }\n```\n\n在此段代码中，`Block` 参数是植物放置的区块。它简单地检查其是否为 `dirt` 或 `grass` 并返回 `true`，从而允许植物被放置。任何其他区块都会返回\
  \ `false`。\n\n你可能想为植物添加的另一个自定义功能是物品的掉落。你可以通过多种方式向区块添加掉落物。如果只有一个掉落物，可以通过 `getItemDropped`\
  \ 和 `getQuantity` 来实现，这两个方法分别要求你返回一个 `Item` 和一个 `int` 来设置掉落物。\n\n如果你想掉落多个物品，做法会稍有不同。首先，你添加此方法：\n\
  \n```java\npublic void dropBlockAsItemWithChance(World world, int par1, int par2,\
  \ int par3, int par4, float par5, int par6)\n{\n    super.dropBlockAsItemWithChance(world,\
  \ par1, par2, par3, par4, par5, 0);\n}\n```\n\n这确保了调用一个不同的方法。该方法是 `getDrops`，它允许你向被破坏的区块添加多个掉落物。\n\
  \n对于 Sam 的植物，其如下如下：\n\n```java\n@Override\npublic ArrayList<ItemStack> getDrops(World\
  \ world, int x, int y, int z, int metadata, int fortune)\n{\n    ArrayList<ItemStack>\
  \ ret = new ArrayList<ItemStack>();\n    if (metadata >= 2)\n    {\n        for\
  \ (int i = 0; i < 3 + fortune; ++i)\n        {\n            if (world.rand.nextInt(15)\
  \ <= 7)\n            {\n                ret.add(new ItemStack(SamsMod.berry, 1,\
  \ 0));\n            }\n        }\n    }\n    for (int i = 0; i < 1+ fortune; i++)\n\
  \    {\n        ret.add(new ItemStack(SamsMod.seed, 1 + world.rand.nextInt(1 + fortune),\
  \ 0));\n    }\n    return ret;\n}\n```\n\n该方法检查植物是否完全成熟；如果是，它将通过一个 `for` 循环，将浆果添加到掉落的物品中。如果玩家使用带有\
  \ `fortune`（幸运）的物品进行采集，掉落概率会更高。种子也是如此。不过，种子没有随机性。种子总是掉落 1 颗加上幸运等级的数量。整个 `BlockPlant`\
