  ```java\npublic void setBlockBoundsOnState(IBlockAccess world, int x, int y, int\
  \ z)\n{\n    if(world.getBlockMetadata(x, y, z) == 1)\n    {\n        setBlockBounds(0F,\
  \ 0F, 0F, 1F, 0.5F, 1F);\n    }\n}\n```\n\n必须移除构造函数中的 `setBlockBounds` 行。\n\n###\
  \ 创建植物\n\n你可能想要添加到你的 mod 中的下一种独特类型的区块是植物。植物是元数据区块，但它们需要大量的特殊代码。\n\n#### 编写基础代码\n\
  \n要添加植物，你需要结合到目前为止所学的大部分信息。然而，与任何其他区块一样，你使用类似的代码将其添加到你的 mod 类中：\n\n```java\npublic\
  \ static Block samPlant;\n```\n\n在 `preInit` 方法中添加以下代码：\n\n```java\nsamPlant = new\
  \ BlockSamPlant();\nGameRegistry.registerBlock(samPlant, \"SamPlant\");\n```\n\n\
  此外，`BlockSamPlant` 类的开头与标准区块也相似。你需要添加一个构造函数，添加一个带有 `Material` 的 `super`，设置未本地化名称等。添加这些基础代码后，`BlockSamPlant`\
  \ 类应该如列表 11.4 所示。\n\n**列表 11.4 BlockSamPlant 中的基础**\n\n```java\npackage com.wuppy.samsmod;\n\
  \nimport net.minecraft.block.Block;\nimport net.minecraft.block.material.Material;\n\
  import net.minecraft.creativetab.CreativeTabs;\n\npublic class BlockSamPlant extends\
