  \     * @param world 在哪个世界中生成\n     * @param random 一个随机对象，用于在世界内获取随机位置以生成方块\n \
  \    * @param x 传递给生成方法的 X 坐标\n     * @param z 传递给生成方法的 Z 坐标\n     * @param maxX\
  \ 设置每个区块（Chunk）在 X 轴上生成的最大 X 坐标值\n     * @param maxZ 设置每个区块（Chunk）在 Z 轴上生成的最大 Z\
  \ 坐标值\n     * @param maxVeinSize 设置矿脉的最大尺寸\n     * @param chancesToSpawn 每个区块内方块生成的几率\n\
  \     * @param minY 该方块可能生成的最小 Y 坐标高度\n     * @param maxY 该方块可能生成的最大 Y 坐标高度\n  \
  \   **/\n    public void addOreSpawn(Block block, int metadata, Block target, World\
  \ world, Random random, int blockX, int blockZ, int maxX, int maxZ, int maxVeinSize,\
  \ int chancesToSpawn, int minY, int maxY)\n    {\n        int maxPossY = minY +\
  \ (maxY - 1);\n        assert maxPossY > minY:最大最大 Y 必须大于最小 Y\";\n        assert\
  \ maxX > 0 && maxX <= 16: \"addOreSpawn: 最大 X 必须大于 0 且小于 16\";\n        assert minY\
  \ > 0: \"addOreSpawn: 最小 Y 必须大于 0\";\n        assert maxY < 256 && maxY > 0: \"\
  addOreSpawn: 最大 Y 必须小于 256 但大于 0\";\n        assert maxZ > 0 && maxZ <= 16: \"addOreSpawn:\
  \ 最大 Z 必须大于 0 且小于 16\";\n        int diffBtwnMaxY = maxY - minY;\n        for(int\
  \ x = 0; x < chancesToSpawn; x++)\n        {\n            int posX = blockX + random.nextInt(maxX);\n\
  \            int posY = minY + random.nextInt(diffBtwnMaxY);\n            int posZ\
  \ = blockZ + random.nextInt(maxZ);\n            new WorldGenMinable(block, metadata,\
  \ maxVeinSize, target).generate(world, random, posX, posZ);\n        }\n    }\n\
  }\n```\n\n### 使用 OreDictionary\n\n在`第 9 小节`的练习中，你让 `Sam’s Stone` 矿石方块在破碎时掉落 `Sam’s\
  \ Dust`。如果你还没有这样做，请添加一个熔炼配方将粉尘熔炼成 `Sam’s Ingot`。如果你不知道如何操作，请查看`第 3 小节，`处理配方与其他修改`，其中解释了熔炼配方。\n\
  \n`OreDictionary` 是 Forge 中的一个类，可以允许多个 Mod 使用相同的金锭。铜就是一个很好的例子。许多不同的 Mod 都添加了铜，而通过\
  \ `OreDictionary`，它们可以使用不同 Mod 提供的铜，而无需为每一个 Mod 单别编写配方。虽然其他 Mod 不可能会使用 `Sam’s Ingot`，但最大化兼容性总是越好的。\n\
  \n### OreDictionary 注册\n\n要使用 `OreDictionary`，你必须将你的锭注册为一种矿石。你可以在你的 Mod 文件中使用以下代码行来实现。请确保这行代码写在锭的初始化和注册之后：\n\
  \n```java\nOreDictionary.registerOre(\"ingotSam\", new ItemStack(samingot));\n```\n\
  \n第一个参数是你希望注册锭时使用的名称。因为这些方法在多个不同的 Mod 中使用，且为了让 `OreDictionary`get，名称必须完全相同，所以命名有一些严格的规则。对于锭，应该是\
  \ `ingot` 后紧跟材料类型，且首字母大写。例如，`ingotCopper` 是正确的，而 `copperIngot` 和 `ingotcopper` 都是错误的。完整的命名规则列表、原版名称以及其他\
  \ Mod 中的名称可以在 `www.minecraftforge.net/wiki/Common_Oredict_names` 找到。\n\n第二个参数是你添加到\
  \ `OreDictionary` 中的物品或方块的 `ItemStack`。\n\n#### OreDictionary 配方\n\n现在你的锭已注册为 `ingotSam`。然而，这只是工作的一半。如果你想让其他\
  \ Mod 也能使用，可以使用以下代码：\n\n```java\nGameRegistry.addRecipe(new ShapedOreRecipe(SamsMod.sampickaxe),\n\
  \    \"XXX\",\n    \"Y Y\",\n    \"Y Y Y\",\n    new ItemStack(ingotSam));\n```\n\
  \n\n\n\n## 生成时可以添加的矿石数量有上限吗？\n\n**答.** 没有上限，但每当你向生成器中添加一种矿石，生成速度就会变慢。它可能会慢到完全无法生成，或者需要数倍的时间才能完成。因此，不浪费生成资源非常重要。\n\
  \n## 我如何添加多个需要生成的矿石？\n\n**答.** 简单地复制以 `addOreSpawn` 开头的行，并更改你想要生成的矿石即可。\n\n### 工作坊\n\
  \n在这一节课程中，你创建了 `SamEventHandler` 类，它是第四部分中所有内容的核心。因此，准确了解它的功能和工作原理至关重要。\n\n### 测验\n\
  \n**1. 你如何将矿石生成添加到末地维度？**\n\n**2. 下面的代码会让矿石变得非常稀有还是非常常见？**\n\n[点击此处查看代码图片]\n\n```\n\
  addOreSpawn(SamsMod.samStone, 0, Blocks.stone, world, random, x, z, 2, 2, 2, 4,\
  \ 3, 20);\n```\n\n### 答案\n\n**1.** 简单地复制主世界的生成行，并将目标区块从石头（stone）改为下地石（endstone）。\n\
  \n**2.** 这段代码会让区块变得非常稀有。这种矿石仅允许在区块的 2×2 区域生成，即使生成了，也只会生成两个矿石。它还只会在非常特定的高度生成。\n\n\
  ### 练习\n\n在黑曜石尖峰（obsidian spikes）的末地中添加 Sam Stone 矿石生成。\n\n以下代码实现了该功能：\n\n```\n\
  private void generateEnd(World world, Random random, int x, int z)\n{\n    addOreSpawn(SamsMod.samStone,\
  \ 0, Blocks.obsidian, world, random, x, z, 16, 16, 5 + random.nextInt(5), 4, 20,\
  \ 60);\n}\n```\n\n## 第 14 小：生成植物\n\n本节你将学习：\n\n![Image](img/image00525.jpeg) [创建一个自定义的\
  \ `WorldGen` 类]\n![Image](img/image00525.jpeg) [向 `SamEventHandler` 添加代码]\n\n在第\
  \ 11 小“让你的区块独一无二”中，你创建植物。然而，除非你通过某种方式让玩家获得种子，否则植物是无法使用的。在原版 Minecraft 中，植物在世界中生成是非常常见的，例如仙人掌、草和花。为了实现这一点，你需要一个像在第\
  \ 13 小“生成矿石”中使用的 `WorldGen` 类，用来在世界中生成矿石。唯一的区别是，这次你必须自己制作它。你再次使用了上一节的 `SamEventHandler`，因为你不需要为每个事件或世界生成都创建一个新的。\n\
  \n### 创建自定义 WorldGen 类\n\n用于生成 Sam Plant 的自定义 `WorldGen` 类将命名为 `WorldGenSamPlant`。确保每个世界生成文件的名称都以\
  \ `WorldGen` 开头是有用的（但不是要求的），这会让代码更易读。要创建一个新类，只需右键点击你的 mod 所在的包并选择“创建类（Create Class）”。在弹出的窗口中输入名称后点击“完成（Finish）”。这将创建一个看起来类似于列表\
  \ 14.1 的类。\n\n**列表 14.1 初始 WorldGenSamPlant 类**\n\n[点击此处查看代码图片]\n\n```\npackage\
  \ com.wuppy.samsmod;\n\npublic class WorldGenSamPlant\n{\n\n}\n```\n\n为了确保 `WorldGenSamPlant`\
  \ 能够作为一个 `WorldGen` 类实际工作，它必须继承 `WorldGenerator`。一旦添加了 `extends WorldGenerator`\
  \ 代码，`WorldGenerator` 下就会出现错误，你可以通过导入它来修复。接下来，`WorldGenSamPlant` 下会出现错误，你可以通过添加未实现的方法来修复。完成这些操作后，`WorldGenSamPlant`\
  \ 应该看起来像列表 14.2。\n\n**列表 14.2 继承 WorldGenerator 的 WorldGenSamPlant**\n\n[点击此处查看代码图片]\n\
  \n```\npackage com.wuppy.samsmod;\n\nimport java.util.Random;\nimport net.minecraft.world.World;\n\
  import net.minecraft.world.gen.feature.WorldGenerator;\n\npublic class WorldGenSamPlant\
  \ extends WorldGenerator\n{\n    @Override\n    public boolean generate(World world,\
  \ Random rand, int x, int y, int z)\n    {\n        return true;\n    }\n}\n```\n\
  \n现在，在 `generate` 方法中实际添加一些放置区块的代码将会有用。\n\n#### 随机化位置\n\n这个 `generate` 方法将在 `SamEventHandler`\
  \ 中调用。但在 `SamEventHandler` 中调用它之前，在 `WorldGenSamPlant` 中添加一些实际放置区块的代码会很有用。\n\n```\n\
  @Override\npublic boolean generate(World world, Random rand, int x, int y, int z)\n\
  {\n    for (int l = 0; l < 64; l++)\n    {\n        int x1 = x + rand.nextInt(8)\
  \ - 4; // 注意：基于上下文的简化的逻辑\n        int y1 = y; // 示例逻辑\n        int z1 = z + rand.nextInt(8)\
  \ - 4;\n    }\n    return true;\n}\n```\n（注：原文提供的代码块包含了一些碎片化的逻辑，我根据提供的文本片段清理了其结构）。\n\
  \n### 检查与放置\n\n需要的下一段代码是检查区块是否可以放置。它不应该放置在空气或地下。\n\n```java\n@Override\npublic boolean\
  \ generate(World world, Random rand, int x, int y, int z)\n{\n    for (int l = 0;\
  \ l < 64; l++)\n    {\n        int x1 = x + rand.nextInt(8) - 4;\n        int y1\
  \ = y;\n        int z1 = z + rand.nextInt(8) - 4;\n        if (SamsMod.samPlant.canPlaceAt(world,\
  \ x1, y1, z1) && world.getBlock(x1, y1 - 1, z1) == Blocks.grass)\n        {\n  \
  \          world.setBlock(x1, y1, z1, SamsMod.samPlant, 0, 2);\n        }\n    }\n\
  \    return true;\n}\n```\n\n#### 动手尝试：添加随机起始元数据\n\n为植物生成添加随机起始元数据，让植物从一开始就可能带有最高的元数据生成。\n\
  \n```java\nworld.setBlock(x1, y1, z1, SamsMod.samPlant, rand.nextInt(3), 2);\n```\n\
  \n现在 `WorldGenSamPlant` 类就完成了。它应该看起来像列表 14.3。\n\n\n\n\n\n```java\nimport java.util.Random;\n\
  import net.minecraft.init.Blocks;\nimport net.minecraft.world.World;\nimport net.minecraft.world.gen.feature.WorldGenerator;\n\
  \npublic class WorldGenSamPlant extends WorldGenerator\n{\n    @Override\n    public\
  \ boolean generate(World world, Random rand, int x, int y, int z)\n    {\n     \
  \   for (int l = 0; l < 64; ++l)\n        {\n            int x1 = x + rand.nextInt(8)\
  \ - rand.nextInt(8);\n            int y1 = y + rand.nextInt(4) - rand.nextInt(4);\n\
  \            int z1 = z + rand.nextInt(8) - rand.nextInt(8);\n            if (SamsMod.samPlant.canPlaceBlockAt(world,\
  \ x1, y1, z1) && world.getBlock(x1, y1 - 1, z1) == Blocks.grass)\n            {\n\
  \                world.setBlock(x1, y1, z1, SamsMod.samPlant, rand.nextInt(3), 2);\n\
  \            }\n        }\n        return true;\n    }\n}\n```\n\n## 注意：Eclipse\
  \ 代码格式化\n\n有时在编写代码时，你可能会在某些地方漏掉空格、制表符或类似的内容。当你编写代码一段时间并多次访问同一个文件时，这可能会导致代码变得非常混乱。幸运的是，Eclipse\
  \ 有一种简单的方法可以修复这个问题。\n\n要格式化你的代码，只需按下 `Ctrl+Shift+F`，Eclipse 就会为你处理好。然而，如果你现在执行此操作，代码看起来将与你目前制作的完全不同。你可能想对正在使用的代码格式进行一些更改。可以通过点击\
  \ `Window`（窗口）、`Preferences`（首选项）来实现，如图 14.1 所示。\n\n![Image](img/image00610.jpeg)\n\
  \n**图 14.1** 首选项选项。\n\n这会打开首选项窗口，在其中导航到 `Java`、`Code Style`（代码样式）、`Formatter`（格式化器）。当你这样做时，你应该看到类似图\
  \ 14.2 的屏幕。\n\n![Image](img/image00611.jpeg)\n\n**图 14.2** 格式化窗口。\n\n在格式化窗口中，点击\
  \ `New`（新建）。新配置窗口会打开，如图 14.3 所示。为你的格式化配置输入一个自定义名称，然后在新配置窗口中点击 `OK`。\n\n![Image](img/image00612.jpeg)\n\
  \n**图 14.3** 新配置窗口。\n\n会打开一个名为“Custom”的新配置窗口（“Custom”是你刚刚为自定义配置选择的名称），如图 14.4 所示。在这里，你应该配置你的新格式化配置。\n\
  \n![Image](img/image00613.jpeg)\n\n**图 14.4** 格式化选项。\n\n图 14.5 到 14.8 显示了所需的选项，以便你的自动格式化看起来像书中所示代码一样。当然，你可以更改任何你想要的选项，并让自己的代码看起来完全不同。\n\
  \n![Image](img/image00614.jpeg)\n\n**图 14.5** 大括号选项。\n\n![Image](img/image00615.jpeg)\n\
  \n**图 14.6** 控制语句选项。\n\n![Image](img/image00616.jpeg)\n\n**图 14.7** 折行选项。\n\n![Image](img/image00617.jpeg)\n\
  \n**图 14.8** 注释选项。\n\n现在点击 `Apply`（应用）和 `OK`，确保在图 14.2 的窗口中选择了你的配置，并再次点击 `Apply`。现在当你按下\
  \ `Ctrl+Shift+F` 时，代码将按照你想要的方式格式化。\n\n##向 SamEventHandler 添加代码\n\n现在，为了确保这段代码被实际使用，你必须将其添加到\
  \ `SamEventHandler` 类中。这种植物在草地上生成，因此为了让它工作，需要几个要素。首先，它只在主世界（overworld）中生成。其次，它只在地面高度生成，因为那里是唯一有草的地方。为\
  \ `WorldGenPlant` 等类添加生成代码与上文中 `addOreSpawn` 方法内部的内容非常。。有一个随机的 `x`、`y` 和 `z`，以及一行调用\
  \ `WorldGenPlant` 中 `generate` 方法的代码。所有这些代码都可以添加到 `for` 循环中，以使植物更常见。代码看起来像这样：\n\n\
  ```\nint posX = x + random.nextInt(16);\nint posY = 50 + random.nextInt(35);\nint\
  \ posZ = z + random.nextInt(16);\nnew WorldGenPlant().generate(world, random, posX,\
  \ posZ);\n```\n\n这段代码创建了可以在世界中任何位置的 `x` 和 `z` 值。`y` 值只能在 50 到 84 之间。这个高度应该覆盖大部分草的生成。创建位置后，它被用于\
  \ `WorldGenPlant` 中的 `generate` 方法。与 `WorldGenMinable` 不同，`WorldGenPlant` 不需要任何参数，因此更容易使用。\n\
  \n### 注意：自动补全\n\n`WorldGenPlant` 是一个很长的“单词”。如果你想让它变得简单一点，输入类似 `WorldGenS` 的内容然后按下\
  \ `Ctrl+Space`。当你这样做时，如果只有一个可选单词，它会自动补全单词的剩余部分。如果有多个选项，会弹出一个菜单，如图 14.9 所示。你只需要选择你想要的单词，而不需要输入它。\n\
  \n![Image](img/image00618.jpeg)\n\n**图 14.9** 自动补全框。\n\n不需要像 `addOreSpawn` 这样的方法，因为\
  \ `WorldGenPlant` 非常具体，永远不会使用超过一次。整个 `SamEventHandler` 看起来如代码列表 14.4 所示。\n\n###\
  \ 代码列表 14.4 带有 WorldGenPlant 代码的 SamEventHandler\n\n```java\npackage com.wuppy.samsmod;\n\
  \nimport java.util.Random;\nimport net.minecraft.block.Block;\nimport net.minecraft.init.Blocks;\n\
  import net.minecraft.world.World;\nimport net.minecraft.world.chunk.IChunkProvider;\n\
  import net.minecraft.world.gen.feature.WorldGenMinable;\nimport cpw.mods.fml.common.IWorldGenerator;\n\
  \npublic class SamEventHandler implements IWorldGenerator\n{\n    @Override\n  \
  \  public void generate(Random random, int chunkX, int chunkZ, World world, IChunkProvider\
  \ chunkGenerator, IChunkProvider chunkProvider)\n    {\n        switch(world.provider.dimensionId)\n\
  \        {\n            case -1: generateNether(world, random, chunkX * 16, chunkZ\
  \ * 16);\n            case 0: generateSurface(world, random, chunkX * 16, chunkZ\
  \ * 16);\n            case 1: generateEnd(world, random, chunkX * 16, chunkZ * 16);\n\
  \        }\n    }\n\n    public void generateEnd(World world, Random random, int\
  \ x, int z)\n    {\n        addOreSpawn(SamsMod.samStone, 0, Blocks.obsidian, world,\
  \ random, x, z, 16, 16, 5 + random.nextInt(5), 4, 20, 60);\n    }\n\n    public\
  \ void generateSurface(World world, Random random, int x, int z)\n    {\n      \
  \  addOreSpawn(SamsMod.samStone, 0, Blocks.stone, world, random, x, z, 16, 16, 5\
  \ + random.nextInt(5), 4, 20, 60);\n        int posX = x + random.nextInt(16);\n\
  \        int posY = 50 + random.nextInt(35);\n        int posZ = z + random.nextInt(16);\n\
  \        new WorldGenPlant().generate(world, random, posX, posZ);\n    }\n\n   \
  \ public void generateNether(World world, Random random, int x, int z)\n    {\n\
  \        addOreSpawn(SamsMod.samStone, 0, Blocks.netherrack, world, random, x, z,\
  \ 16, 16, 5 + random.nextInt(5), 4, 20, 60);\n    }\n}\n\n/**\n/**\n * 向 Minecraft\
  \ 添加一个矿石生成。只需在你继承 IWorldGeneration 的类的生成方法中使用此方法注册所有要生成的矿石。\n *\n * @param block\
  \ 要生成的方块\n * @param metadata 方块的元数据\n * @param block 在何处生成\n * @param world 在其中生成的世界\n\
  \ * @param random 用于获取世界中随机位置以生成区块的随机对象\n * @param x 用于传递给生成方法的 X 坐标\n * @param\
  \ z 用于传递给生成方法的 Z 坐标\n */\n```\n\n\n\n\n\n* @param 一个整数，用于设置每个区块在 X 轴上生成的最大 X 坐标值\n\
  * @param 一个整数，用于设置每个区块在 Z 轴上生成的最大 Z 坐标值\n* @param 一个整数，用于设置矿脉的最大尺寸\n* @param 一个整数，用于设置每个区块中该区块生成的生成次数\n\
  * @param 一个整数，用于设置该区块可能生成的最小 Y 坐标高度\n* @param 一个整数，用于设置该区块可能生成的最大 Y 坐标高度\n\n```java\n\
  public void addOreSpawn(Block block, int metadata, Block target, World world, Random\
  \ random, int blockXPos, int blockZPos, int maxX, int maxZ, int maxVeinSize, int\
  \ chancesToSpawn, int minY, int maxY)\n{\n    int maxPossY = minY + (maxY - 1);\n\
  \    assert maxY > minY: \"The maximum Y must be greater than the Minimum Y\";\n\
  \    assert maxX > 0 && maxX <= 16: \"addOreSpawn: The Maximum X must be greater\
  \ than 0 and less than 16\";\n    assert minY > 0: \"addOreSpawn: The Minimum Y\
  \ must be greater than 0\";\n    assert maxY < 256 && maxY > 0: \"addOreSpawn: The\
  \ Maximum Y must be less than 256 but greater than 0\";\n    assert maxZ > 0 &&\
  \ maxZ <= 16: \"addOreSpawn: The Maximum Z must be greater than 0 and less than\
  \ 16\";\n    int diffBtwnMinMaxY = maxY - minY;\n    for(int x = 0; x < chancesToSpawn;\
  \ x++)\n    {\n        int posX = blockXPos + random.nextInt(maxX);\n        int\
  \ posY = minY + random.nextInt(diffBtwnMinMaxY);\n        int posZ = blockZPos +\
  \ random.nextInt(maxZ);\n        (new WorldGenMinable(block, metadata, maxVeinSize,\
  \ target)).generate(world, random, posX, posY, posZ);\n    }\n}\n```\n\n就像矿石生成一样，可能需要一点时间才能找到你的植物，但它们看起来应该图\
  \ 14.10 所示。\n\n![Image](img/image00619.jpeg)\n\n**图 14.10** 游戏中生成的植物。\n\n### 总结\n\
  在本小时中，你学习了如何手动创建一个 `WorldGen` 类。对于创建像植物这样的基础生成，知道如何做到这一点是非常重要的。然而，对于较大的结构，有另一种不同的、更快的方法，你将在接下来的两个小时中学习。在本小时中，你还学习了如何在\
  \ `EventHandler` 中使用新的 `WorldGen` 文件。\n\n### 问答\n**问。如果没有 `SamEventHandler` 类中没有\
  \ `for` 循环，这些植物会有多稀有？**\n\n**答。** 当你查看地形时，它们并不总是显示在屏幕上，但它们也不稀有。\n\n**问。让 `WorldGen`\
  \ 文件频繁生成不好吗？**\n\n**答。** 并不完全坏，但如果有大量的生成，它确实会显著减慢游戏。\n\n### 工作坊\n在本小时中，你学习了如何手动创建一个自定义的\
  \ `WorldGen` 类。这是唯一涵盖该内容的课时，所以理解它非常重要。\n\n### 测验\n**1。是否可以将 `generateSurface` 方法中的代码粘贴到\
  \ `generateNether` 中，以便植物在地下界中生成？**\n\n**2。当你有多个植物以相同方式生成时，你应该做什么？**\nA. 为每种植物创建一个自定义的\
  \ `WorldGen` 文件。\nB. 创建一个以植物类型为参数的 `WorldGen` 文件，这样可以使用同一个类生成多个植物。\n\n### 答案\n**1。**\
  \ 这样做会导致崩溃，而且它确实会减慢游戏。因为 `SamPlant` 类包含了使其只放置在泥土或草地上的代码，所以它不会生成。\n\n**2。** B 是最佳选项。拥有更多的类不会让你的\
  \ mod 变慢，只是更难以阅读且没有用处。\n\n### 练习\n通过在生成代码周围添加 `for` 循环，让 Sam's Plant 变得常见。代码如下：\n\
  \n```java\nfor(int i = 0; i < 3; i++)\n{\n    int posX = x + random.nextInt(16);\n\
  \    int posY = 50 + random.nextInt(35);\n    int posZ = z + random.nextInt(16);\n\
  \    new WorldGenPlant().generate(world, random, posX, posY, posZ);\n}\n```\n确保\
  \ `posX`、`posY` 和 `posZ` 代码也包含在 `for` 循环中，否则它每次都会同一个地方生成植物。\n\n## 第 15 小时.使用 MCEdit\n\
  \n在本你将学习：\n* ![Image](img/image00525.jpeg) 为什么使用 MCEdit\n* ![Image](img/image00525.jpeg)\
  \ 获取 MCEdit\n* ![Image](img/image00525.jpeg) 使用 MCEdit\n\n本小时和下一小时是第四部分“世界生成”的最后两个小时。这两个小时将教你如何创建一个结构，以及如何以尽可能的工作让它在\
  \ Minecraft 中生成。在本小时中，你学习了如何安装和使用 MCEdit（这是一个 Minecraft 世界编辑器），而在第 16 小时“生成你的结构”中，你学习了如何将制作的内容转换为\
  \ Java 代码。\n\n### 为什么使用 MCEdit\n你可以通过不同的方式向世界中添加结构。最常用的方法是手动编码方块以及使用 MCEdit 配合导出器。在某些情况下，编写代码非常简单。例如，如果你只需要几堵墙，可以通过编写\
  \ `for` 循环轻松实现。然而，当你的结构变得复杂时，这将是一项巨大的工作，因为为每一面墙或其他特征编写代码需要花费很长时间。在这种情况下，在 Minecraft\
  \ 中构建结构然后使用 MCEdit 导出要简单得多。第二种方案你将在在本和下一小时学习。\n\n### 获取 MCEdit\n要安装 MCEdit，你首先需要下载它。MCEdit\
  \ 的网站可以在 [`www.mcedit.net/`](http://www.mcedit.net/) 找到。在该网站上，点击左上角的按钮，如图 15.1 所示。\n\
  \n![Image](img/image0620.jpeg)\n\n**图 15.1** mcedit.net 下载按钮\n\n当你点击此按钮时，会打开一个新界面，如图\
  \ 15.2 所示。根据你的操作系统下载你需要的版本。\n\n![Image](img/image0621.jpeg)\n\n**图 15.2** mcedit.net\
  \ 下载链接\n\n### 安装 MCEdit\n要使用刚刚下载的程序，将其解压到一个以后可以找到的地方，然后双击 `mcedit.exe` 文件，它应该就能运行。正如网站上提到的，它不能从\
  \ `.zip` 文件运行。你必须先将内容提取到文件夹中才能运行 `mcedit.exe` 文件。如果在启动程序时收到有关配置的错误，你应该你应该下载并安装 VC\
  \ 重新发行包，你也可以在网站上找到它。\n\n一旦运行正常，MCEdit 看起来应该像图 15.3 所示。\n\n![Image](img/image0622.jpeg)\n\
  \n**图 15.3** MCEdit 启动界面\n\n\n\n\n\n在 MCEdit 中制作和导出结构有两种方法。你可以完全在 MCEdit 中创建所有内容，这在你想要创建大型地貌（例如）时会更方便。不过，对于较小的建筑，通常在\
  \ Minecraft 中建造它们，然后在 MCEdit 中打开该世界会更简单。本书仅涵盖了如何在 Minecraft 中构建结构后，使用 MCEdit 导出你的结构。但是，如果你想学习如何使用此工具完成更多，请观看以下一个或两个\
  \ YouTube 视频：SethBling 的 [`www.youtube.com/watch?v=Bpuq2LIUy1E`](https://www.youtube.com/watch?v=Bpuq2LIUy1E)\
  \ 或 Vechs 的 [`www.youtube.com/watch?v=B6di0TCI8LU`](https://www.youtube.com/watch?v=B6di0TCI8LU)。\n\
  \n或者，如果你不想看 YouTube 视频，可以查看 [www.wuppy29.com/minecraft/modding-tutorials/modding-easy-structure-creation-part-2-using-mcedit/](http://www.wuppy29.com/minecraft/modding-tutorials/modding-easy-structure-creation-part-2-using-mcedit/)。\n\
  \n***\n\n## 动手尝试一下：创建结构\n\n在导出结构之前，先创建一个是一个好主意。在这种情况下，你必须制作结构是一个地下城。按照以下步骤创建它：\n\
  \n1. 打开 Minecraft 并进入一个可以在创造模式下建造的世界。\n2. 建造地下城的四面墙。它的宽度应该是 8 个方块，长度 11 个方块，高度 6\
  \ 个方块。\n3. 在墙的底部和顶部建造地板和屋顶。\n4. 在地下城内部添加一些障碍物，例如小墙。\n5. 在顶部添加一个荧光石块。\n\n***\n\n\
  图 15.4 显示了你将使用 MCEdit 导出的结构。为了方便观察，图中没有屋顶，但在游戏中将会有的。\n\n![Image](img/image00623.jpeg)\n\
  \n**图 15.4** 结构。\n\n该结构是在一个平坦世界上建造的。在平坦世界中创建需要使用 MCEdit 导出的结构是明智的，因为这会让在 MCEdit\
  \ 中导出变得简单得多。\n\n### 导入世界\n\n现在，在 MCEdit 中打开建造此结构的世界。启动 MCEdit 并点击 `Open a Level`\
  \ 选项，如图 15.3 所示。这会打开一个文件浏览器，你可以在其中选择 `level.dat` 文件，它位于存档文件夹中。\n\n如果你在 Minecraft\
  \ 的默认安装位置构建结构，请查看以下文件夹结构：`C:\\Users\\[Your Username]\\AppData\\Roaming\\.minecraft`。在这里你会找到一个\
  \ `Saves` 文件夹。里面应该另一个以你的世界命名的文件夹。在该文件夹内你将找到 `level.dat` 文件。如果你在 Eclipse 工作空间中创建的世界，该文件夹看起来会像图\
  \ 15.5。\n\n![Image](img/image00624.jpeg)\n\n**图 15.5** 包含 `level.dat` 文件的文件夹。\n\n\
  选择正确的文件后，点击 `Open`，这将以世界编辑器模式启动 MCEdit。图 15.6 显示了该结构在 MCEdit 中的外观。\n\n![Image](img/image00625.jpeg)\n\
  \n**图 15.6** MCEdit 中的结构。\n\n### 导出你的结构\n\n如你所见，所有的 Sam’s Stone 石都是紫色的。那是因为 MCEdit\
  \ 不知道那个方块。这个问题在下一小时使用的转换器中也存在，但在代码中很容易修复。你将在第 16 小 中修复这个问题。\n\n你可能注意到的另外一点有很多玩家。那是因为你几乎每次在\
  \ Eclipse 中启动 Minecraft 时都会得到不同的玩家。由于由于原因，MCEdit 认为同一地点有多个玩家。然而，在导出结构时你不需要担心玩家。\n\
  \n要导出结构，使用 `Selection` 工具，它是左下角的工具。从左下角拖动 `Selection` 工具到右上角，确保整个结构都包含在选择框内。但要确保不要选择结构之外的任何东西。如果你选了，它也将生成该部分。选择结构后，结构看起来有点不同，左侧出现了一个新菜单，如图\
  \ 15.7 所示。\n\n![Image](img/image00626.jpeg)\n\n**图 15.7** 被选中的结构。\n\n现在只需点击 `Export`\
  \ 按钮并使用智能名称进行保存，例如结构的名称。图 15.8 显示了本小时创建的结构的文件夹和文件名。\n\n![Image](img/image00627.jpeg)\n\
  \n**图 15.8** 结构。\n\n### 总结\n\n在本小时中，你学习了如何使用 MCEdit。你还学习了如何导入世界以及如何导出结构。\n\n###\
  \ 问答\n\n**导出的结构有多大？**\n可以是巨大的，但这取决于你的电脑和 `level.dat` 文件。\n\n**`level.dat` 文件在哪里？**\n\
  它们位于 `Saves` 文件夹内，该文件夹位于你的 Minecraft 安装或 Eclipse 设置中。\n\n**MCEdit 不识别的紫色方块如何修复？**\n\
  它们将使用下一小时的转换器进行修复。\n\n### 工作坊\n\n创建一棵树并使用 MCEdit 导出它。\n\n## 第 16 小。生成你的结构\n\n***\n\
  \n### 本小时将学习：\n\n![Image](img/image00625.jpeg) 安装转换器\n\n![Image](img/image00625.jpeg)\
  \ 使用转换器\n\n![Image](img/image00625.jpeg) 向你的结构添加生物\n\n***\n\n在本小时中，第 15 小创建的 `.schematic`\
  \ 使用转换器转换为代码。转换器是由 Mithion 创建的，它是为 Minecraft 1.3.2 的。由于结构是用于 1.7 的，代码中会出现一些问题，但你可以轻松修复它们，而且这比手动编写所有代码要快得多。\n\
  \n### 安装转换器\n\n在安装转换器之前，你必须下载它。你可以从 [www.minecraftforum.net/topic/133652-132-updated-metadata-support-simple-schematic-to-java-file-converter/](http://www.minecraftforum.net/topic/133652-132-updated-metadata-support-simple-schematic-to-java-file-converter/)\
  \ 下载它。你下载了一个 `.zip` 文件，你应该将其解压到一个以后可以方便找到的地方。在 `.zip` 文件中有几个文件夹以及一个 `.jar` 文件。打开这个\
  \ `.jar` 文件，在它所在的文件夹中按 Shift-右键以打开命令提示符并输入以下命令：\n\n```\njava -jar SchematicConverter.jar\n\
  ```\n\n在你输入前几个字母时，按下 Tab 键可以轻松自动补全 SchematicConverter。\n\n\n\n\n\n图 16.1 显示了如何操作。\n\
  \n![Image](img/image00628.jpeg)\n\n**图 16.1** 文件夹和命令提示符。\n\n当你运行此命令时，结构转换器（Schematic\
  \ Converter）将启动。它看起来就像图 16.2 所示。\n\n![Image](img/image00629.jpeg)\n\n**图 16.2**\
  \ 结构转换器。\n\n### 使用结构转换器\n\n结构转换器并不完美。如果你使用的是较小的屏幕，它的显示可能与图 16.2 所示。虽然还有一些小问题，但它们都是微不足道的。\n\
  \n现在，你需要在结构转换器从 MCEdit 导入你的结构。要此这一点，请点击左侧的“添加文件”（Add File）按钮。这将打开一个文件浏览器，可以在其中选择\
  \ `.schematic` 文件。如果你在用 MCEdit 导出时将其保存在标准位置，那么该位置就是你安装的位置，并且位于 `MCEdit-schematics`\
  \ 文件夹内。这如图 16.3 所示。\n\n![Image](img/image00630.jpeg)\n\n**图 16.3** 打开结构。\n\n一旦你在转换器中打开了结构，界面中的几处就会发生变化，看起来就像图\
  \ 16.4 所示。\n\n![Image](img/image00631.jpeg)\n\n**图 16.4** 带有结构的转换器。\n\n右侧是一个你可以用来浏览方块的屏幕。由于该结构大部分由空气和自定义区块组成，此菜单并不\
  \ Practical 用。该窗口的一个小问题是底部和右侧行没有显示。\n\n在“添加文件”按钮正下方是导出文件的几个设置，你可能想要编辑它们。首先是“输出文件夹”（Output\
  \ folder），这是 `.java` 文件存放的位置。还有一些选项，控制程序是否应该添加放置空气区块的代码，以及是否应该有用于智能生成（smart spawning）的代码。智能生成代码可以决定它在地面上方多高的地方生成。它还可以被用于选择哪些方块被视为可以生成的。\n\
  \n***\n\n### 动手尝试：玩玩转换器设置\n\n确保结构只在草地上方生成。\n\n你可以通过启用智能生成并将滑块设置为 `0` 来实现这一点。你还必须前往“已知方块”（Known\
  \ Blocks）列表，选择“草方块”（Grass block），并按下右箭头按钮。\n\n***\n\n当所有设置都符合你结构应应有的状态时，点击顶部的“生成”（Generate）按钮。它随后应该在结构名称末尾添加\
  \ [success]。图 16.5 显示了生成后的设置。\n\n![Image](img/image00632.jpeg)\n\n**图 16.5** 具有正确设置的转换器。\n\
  \n### 导出后的生成文件\n\n在你的结构代码生成后，你将在输出文件夹中看到一个与 `.schematic` 同名的文件。尽管这是一个 Java 文件，但它不能直接在\
  \ mod 中运行，因为代码有些过时了。将 `.java` 文件从输出文件夹复制到你的 mod 包中以开始处理它。列表 16.1 显示了文件的部分内容。大部分的\
  \ `setBlock` 行已从列表中移除，因为它们都是完全相同的。完整的类可以在书籍网站 `www.informit.com/title/9780672337192`\
  \ 提供的示例代码中（注册后）找到。（如需查看完整的注册/下载说明，请参阅引言。）\n\n**列表 16.1 生成的代码**\n\n点击此处查看代码图像\n\n\
  ***\n\n```java\n/*\n\n*** MADE BY MITHION'S .SCHEMATIC TO JAVA CONVERTING TOOL v1.6\
  \ ***\n*/\n\npackage net.minecraft.src;\n\nimport java.util.Random;\n\npublic class\
  \ SamDungeon extends WorldGenerator\n{\n    public SamDungeon() { }\n    public\
  \ boolean generate(World world, Random rand, int i, int j, int k)\n    {\n     \
  \   world.setBlockAndMetadata(i + 0, j + 0, k + 0, -91, 1);\n        world.setBlockAndMetadata(i\
  \ + 0, j + 0, k + 1, -91, 1);\n        world.setBlockAndMetadata(i + 0, j + 0, k\
  \ + 2, -91, 1);\n        world.setBlock(i + 1, j + 1, k + 1, 0);\n        world.setBlock(i\
  \ + 1, j + 1, k + 2, 0);\n        world.setBlock(i + 1, j + 1, k + 3, 0);\n    \
  \    world.setBlock(i + 1, j + 1, k + 4, 0);\n        return true;\n    }\n}\n```\n\
  \n***\n\n清理此文件需要相当多的工作。所需的更改如下：\n\n![Image](img/image0025.jpeg) 修改类名。现在它被称为 `SamDungeon`，但遵循原版世界生成的命名方式是明智的做法。因此，将其重命名为\
  \ `WorldGenDungeon`。\n\n![Image](img/image0025.jpeg) 移除顶部的注释。这不是强制要求的，但看起来更整洁一些。\n\
  \n![Image](img/image0025.jpeg) `net.minecraft.src` 下有一个错误，你可以通过悬停在上面并选择“更改声明”（Change\
  \ Declaration）来修复它。\n\n![Image](img/image0025.jpeg) 移除构造函数。它是空的，因此不是必需。\n\n![Image](img/image0025.jpeg)\
  \ 为了可读性，将变量 `i`、`j` 和 `k` 重命名为 `x`、`y` 和 `z`。\n\n![Image](img/image0025.jpeg) 使用“查找和替换”（Find\
  \ and Replace）将 `setBlockAndMetadata` 改为 `setBlock`，你可以通过 `Ctrl+F` 访问此功能。\n\n![Image](img/image0025.jpeg)\
  \ 将 `setBlockAndMetadata` 改为 `setBlock`。将 `setBlockAndMetadata` 改为 `setBlock`，使用\
  \ `setBlockAndMetadata` 替换为 `setBlock`。\n\n![Image](img/image0025.jpeg) 将 `-91`\
  \ 或转换器使用的任何数字更改为生成的区块。\n\n![Image](img/image0025.jpeg) 将 `setBlockAndMetadata` 替换为\
  \ `setBlock`。\n\n![Image](img/image0025.jpeg) 如果你的结构包含空气，在所有出现的地方都改为 `0`。\n\n![Image](img/image0025.jpeg)\
  \ 如果你的结构包含任何原版方块，修改所使用的变量。\n\n![Image](img/image0025.jpeg) 使用 `Ctrl+Shift+O` 导入所有使用的文件。\n\
  \n`WorldGenDungeon` 现在看起来像列表 16.2 所示\n\n**列表 16.2 清理后的 WorldGenDungeon**\n\n***\n\
  \n```java\n/*\n\n*** MADE BY MITHION'S .SCHEMATIC TO JAVA CONVERTING TOOL v1.6 ***\n\
  */\n\npackage com.wuppy.samsmod;\n\nimport java.util.Random;\nimport net.minecraft.block.Block;\n\
  import net.minecraft.init.Blocks;\nimport net.minecraft.world.World;\nimport net.minecraft.world.gen.feature.WorldGenerator;\n\
  \npublic class WorldGenDungeon extends WorldGenerator\n{\n    public boolean generate(World\
  \ world, Random rand, int x, int y, int z)\n    {\n        world.setBlock(x + 0,\
  \ y + 0, z + 0, SamsMod.samStone, 1, 2);\n        world.setBlock(x + 0, y + 0, z\
  \ + 1, SamsMod.samStone, 1, 2);\n        world.setBlock(x + 0, y + 0, z + 2, SamsMod.samStone,\
  \ 1, 2);\n        world.setBlock(x + 4, y + 3, z + 1, Blocks.air);\n        world.setBlock(x\
  \ + 4, y + 3, z + 2, Blocks.air);\n        world.setBlock(x + 4, y + 3, z + 3, Blocks.air);\n\
  \        world.setBlock(x + 4, y + 3, z + 4, Blocks.air);\n        return true;\n\
  \    }\n}\n```\n\n***\n\n### 让结构生成\n\n现在必须在 `SamEventHandler` 类中调用此类。此代码与用于生成植物的代码非常相似。它被添加到\
  \ `generateSurface` 中，因为它应该在普通世界中生成。代码如下：\n\n点击此处查看代码图像\n\n```java\nint posX = x\
  \ + random.nextInt(16);\n\nint posY = 10 + random.nextInt(40);\n```\n\n\n\n\n\n\
  ```java\nint posZ = z + random.nextInt(16);\n\nnew WorldGenSamDungeon().generate(world,\
  \ random, posX, posY, posZ);\n```\n\n这段代码确保了它可以在区块的任何位置生成，但仅限于高度 10 到 49 之间。`SamEventHandler`\
  \ 现在看起来应该像列表 16.3 所示。\n\n**列表 16.3 完成后的 SamEventHandler**\n\n点击此处查看代码图片\n\n* * *\n\
  \n```java\npackage com.wuppy.samsmod;\n\nimport java.util.Random;\n\nimport net.minecraft.block.Block;\n\
  import net.minecraft.init.Blocks;\nimport net.minecraft.world.World;\nimport net.minecraft.world.chunk.IChunkProvider;\n\
  import net.minecraft.world.gen.feature.WorldGenMinable;\nimport cpw.mods.fml.common.IWorldGenerator;\n\
  \npublic class SamEventHandler implements IWorldGenerator\n{\n    @Override\n  \
  \  public void generate(Random random, int chunkX, int chunkZ, World world, IChunkProvider\
  \ chunkGenerator, IChunkProvider chunkProvider)\n    {\n        switch (world.provider.dimensionId)\n\
  \        {\n            case -1:\n                generateNether(world, random,\
  \ chunkX * 16, chunkZ * 16);\n            case 0:\n                generateSurface(world,\
  \ random, chunkX * 16, chunkZ * 16);\n            case 1:\n                generateEnd(world,\
  \ random, chunkX * 16, chunkZ * 16);\n        }\n    }\n\n    private void generateEnd(World\
