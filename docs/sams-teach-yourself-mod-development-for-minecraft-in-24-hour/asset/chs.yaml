  \n有时你想在你的区块或物品周围生成粒子以让它们看起来更好看。[列表 A.19] 显示了一个名为 `randomDisplayTick` 的方法，这是一个用于区块生成自定义粒子的方法。实体和物品也有类似的方法。\n\
  \n**列表 A.19 生成粒子**\n\n点击此处查看代码图像\n\n```java\n@SideOnly(Side.CLIENT)\n@Override\n\
  public void randomDisplayTick(World par1World, int par2, int par3, int par4, Random\
  \ par5Random)\n{\n    super.randomDisplayTick(par1World, par2, par3, par4, par5Random);\n\
  \    if (par5Random.nextInt(2) == 0)\n    {\n        double var1 = (double) ((float)\
  \ par2 + par1World.rand.nextFloat());\n        double var2 = (double) ((float) par3\
  \ + par1World.rand.nextFloat());\n    }\n}\n```\n\n\n\n\n\n```java\ndouble var3\
  \ = (double) ((float) par4 + par1World.rand.nextFloat());\n\npar1World.spawnParticle(\"\
  smoke\", var1, var2, var3, 0.0D, 0.0D, 0.0D);\n\npar1World.spawnParticle(\"flame\"\
  , var1, var2, var3, 0.0D, 0.0D, 0.0D);\n}\n```\n\n### 播放声音\n\n为你的物品、方块或实体添加特定的音效果通常是个主意。以下代码将播放声音：\n\
  \n点击此处查看代码图片\n\n```\nworldObj.playSound(x, y, z, \"step.wood\", 1F, 1F, true);\n\
  ```\n\n声音名称的完整列表可以在 [`minecraft.gamepedia.com/Sounds.json`](http://minecraft.gamepedia.com/Sounds.json)\
  \ 找到。\n\n### 为物品使用模型\n\n有时，你希望你的物品看起来比普通的扁平图片更华丽。在这种情况下，你可以尝试为你的物品使用自定义模型。要实现这一点，你需要一个自定义的\
  \ `Render` 类，它在 Listing A.20 中均所示。\n\n**列表 A.20 RenderExampleItem**\n\n点击此处查看代码图片\n\
  \n```java\npackage com.wuppy.samsmod;\n\nimport net.minecraft.client.Minecraft;\n\
  \nimport net.minecraft.item.ItemStack;\nimport net.minecraft.util.ResourceLocation;\n\
  import net.minecraftforge.client.IItemRenderer;\nimport org.lwjgl.opengl.GL11;\n\
  \npublic class RenderExampleItem implements IItemRenderer\n{\n    private ModelExample\
  \ model;\n\n    public RenderExampleItem ()\n    {\n        model = new ModelExample();\n\
  \    }\n\n    @Override\n    public boolean handleRenderType(ItemStack item, ItemRenderType\
  \ type)\n    {\n        return true;\n    }\n\n    @Override\n    public boolean\
  \ shouldUseRenderHelper(ItemRenderType type, ItemStack item, ItemRendererHelper\
  \ helper)\n    {\n        return true;\n    }\n\n    @Override\n    public void\
  \ renderItem(ItemRenderType type, ItemStack item, Object... data)\n    {\n     \
  \   GL11.glPushMatrix();\n        GL11.glScalef(-1F, -1F, 1F);\n        switch (type)\n\
  \        {\n            case INVENTORY:\n                GL11.glTranslatef(0, 0.12F,\
  \ 0);\n                break;\n            case EQUIPPED:\n                GL11.glTranslatef(-0.8F,\
  \ -0.2F, 0.7F);\n                break;\n            case EQUIPPED_FIRST_PERSON:\n\
  \                GL11.glTranslatef(0, -0.7F, 0.7F);\n                break;\n  \
  \          default:\n                Minecraft.getMinecraft().renderEngine.bindTexture(new\
  \ ResourceLocation(\"textures/entity/zombie.png\"));\n        }\n        model.render(null,\
  \ 0.0F, 0.0F, -0.1F, 0.0F, 0.0F, 0.025F);\n        GL11.glPopMatrix();\n    }\n\
  }\n```\n\n此 `Render` 类可以使用任何类型的模型；只需确保在构造函数中设置了它即可。在这种情况下使用的纹理是僵尸纹理，但你可以使用任何需要的纹理。为了让你的模型看起来好看，你可能需要更改\
  \ `render` 方法中的某些值。你需要使用以下代码为你想要以此方式渲染的物品注册此 `Render` 类：点击此处查看代码图片\n\n```\nMinecraftForgeClient.registerItemRenderer(SamsMod.exampleItem,\
  \ new RenderExampleItem());\n```\n\n### 符号\n\n- `{}`（括号），27\n- `//` 注释，27\n- `/*\
