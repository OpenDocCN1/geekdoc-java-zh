  `。接下来，这两个变量都必须被使用。对于 `Block` 变量，这意味着将其设置为构造函数中的 `plant` 参数。对于名称，这意味着设置未本地化名称（unlocalized\
  \ name）和纹理名称（texture name）。带有变量的构造函数应该类似于列表 11.7。\n\n### 列表 11.7 ItemSam 的构造函数\n\
  \n```java\nprivate Block plant;\n\nprivate String name = \"samseed\";\n\npublic\
