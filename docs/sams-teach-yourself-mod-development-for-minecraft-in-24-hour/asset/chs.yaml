  \ int chunkX, int chunkZ, World world, IChunkProvider chunkGenerator, IChunkProvider\
  \ chunkProvider)\n    {\n\n    }\n}\n```\n\n***\n\n在 `generate` 方法中，你必须根据维度 ID 创建一个\
  \ `switch` 语句。对于主世界，维度 ID 为 0；下界（nether）为 −1；末地（end）为 1。可以使用 `world.provider.dimensionId`\
  \ 找到维度 ID。当你创建这个 `switch` 时，你可以检查所有三个维度并为它们添加方法。它看起来像列表 13.3。\n\n**列表 13.3 带有三个生成方法的\
  \ SamEventHandler**\n\n点击此处查看代码图像\n\n***\n\n```java\npackage com.wuppy.samsmod;\n\
  \nimport java.util.Random;\n\nimport net.minecraft.world.World;\nimport net.minecraft.world.chunk.IChunkProvider;\n\
  import cpw.mods.fml.common.IWorldGenerator;\n\npublic class SamEventHandler implements\
