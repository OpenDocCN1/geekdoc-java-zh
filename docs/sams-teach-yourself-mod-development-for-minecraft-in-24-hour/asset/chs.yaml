  \ i++)\n    {\n        icons[i] = par1IconRegister.registerIcon(SamsMod.MODID +\
  \ \":\" + \"samplant\" + i);\n    }\n}\n\n@Override\n@SideOnly(Side.CLIENT)\npublic\
  \ IIcon getIcon(int par1, int par2)\n{\n    if(par2 < 0 || par2 >= 3)\n    {\n \
  \       System.out.println(\"Something is wrong with the metadata for BlockSamPlant!\"\
  );\n        return icons[0];\n    }\n    else\n        return icons[par2];\n}\n\
  ```\n\n`BlockSamPlant` 有三个阶段，这意味着 `IIcon` 数组在索引 0、1、2 处有图像。这些纹理也必须制作，参见图 11.3、11.4\
  \ 和 11.5。\n\n在 `getIcon` 方法中，检查元数据。如果由于某种原因小于 0 或大于或等于 3，则将其设置为第一个图像。如果不是，它将根据元数据返回图像。\n\
  \n尽管作物具有元数据，但通常不需要为它制作 `ItemBlock` 类，因为你不会处理拿起和放置不同的元数据。相反，大多数植物通过种子工作。\n\n####\
  \ 使其成为作物\n\n在 `BlockSamPlant` 完全作为作物工作之前，你需要在类中添加几个方法。\n\n##### 使它看起来像作物\n\n以下方法确保了新区块看起来像作物：\n\
  \n```java\n@Override\npublic int getRenderType()\n{\n    return 6;\n}\n```\n\n还有其他的渲染类型，可以通过查看自定义渲染区块来找到。\n\
  \n##### 确保游戏知道它是植物\n\n现在是时候让 `BlockSamPlant` 被识别并作为作物工作了。要这样做，将扩展类从 `Block` 更改为\
  \ `BlockBush`。该类还需要实现 `IGrowable`，使类行变为：\n\n```java\npublic class BlockSamPlant\
  \ extends BlockBush implements IGrowable\n```\n\n\n\n\n当你添加这段代码时，可能会遇到一些错误。首先，你必须导入\
  \ `BlockBush` 和 `IGrowable` 类。一旦完成这些操作，它会要求你添加几个方法，它们看起来如下：\n\n点击此处查看代码图片\n\n```java\n\
  @Override\npublic boolean func_149851_a(World var1, int var2, int var3, int var4,\
  \ boolean var5) {\n    // TODO Auto-generated method stub\n    return false;\n}\n\
  \n@Override\npublic boolean func_149852_a(World var1, Random var2, int var3, int\
  \ var4, int var5) {\n    // TODO Auto-generated method stub\n    return false;\n\
  }\n\n@Override\npublic void func_149853_b(World var1, Random var2, int var3, int\
  \ var4, int var5) {\n    // TODO Auto-generated method stub\n}\n```\n\n遗憾的是，这些方法尚未被本地化，因此它们具有不清晰的\
  \ `func` 名称。\n\n首先，必须编写 `func_149851_a`。这是一个检查是否可以使用骨粉肥料的方法。对于作物来说，只要元数据（metadata）不在顶层或更高层（即为\
  \ 2），就允许使用骨粉。该方法应该如下：\n\n点击此处查看代码图片\n\n```java\n@Override\npublic boolean func_149851_a(World\
  \ world, int x, int y, int z, boolean var5) {\n    return world.getBlockMetadata(x,\
  \ y, z) != 2;\n}\n```\n\n如果在应用骨粉时通过了此函数的检查，则会检查下一个函数，即 `func_149852_a`。此方法应该包含一个让骨粉成功的随机概率。如果你想让骨粉总是生效，只需始终返回\
  \ `true` 即可。否则，可以使用方法中的 `rand` 变量创建一个简单的随机数。对于这种植物，它看起来如下：\n\n点击此处查看代码图片\n\n```java\n\
  @Override\npublic boolean func_149852_a(World world, Random rand, int x, int y,\
  \ int z) {\n    return true;\n}\n```\n\n在运行完这两个检查后，就是时候实际编写应用骨粉时应该发生的情况了。你在 `func_149853_b`\
  \ 方法中完成操作。对于 `BlockSamPlant` 骨粉，只需将生长阶段增加一。在这种情况下，方法如下：\n\n点击此处查看代码图片\n\n```java\n\
  @Override\npublic void func_149853_b(World world, Random rand, int x, int y, int\
  \ z) {\n    int next = world.getBlockMetadata(x, y, z) + 1;\n    if(next > 2)\n\
  \        next = 2;\n    world.setBlockMetadataWithNotify(x, y, z, next, 2);\n}\n\
  ```\n\n在 `func_149853_b` 方法中，获取了元数据并对其增加。尽管你在之前的方法中检查过元数据，但在这里再次检查是明智的，因为可能有其他 mod\
  \ 使用相同的方法来制作不同的植物生长材料（这是可能发生的），而且它们没有正确使用元数据检查方法。然后，使用 `setBlockMetadataWithNotify`\
  \ 设置元数据。此方法确保现有方块的元数据被更改。在 `setBlockMetadataWithNotify` 行中，使用了位置以及新的元数据。然而，还有一个额外的数字，即\
  \ 2。这个数字基本上一直应该是 2，以确保客户端知道方块确实存在。\n\n***\n\n### 动手尝试：制作随机植物\n\n为骨粉制作一种更随机的植物。让骨粉每三次只生效一次。但是，当它生效时，让它向元数据增加\
  \ 0 到 2 之间的值。\n\n相应的代码应该如下：\n\n点击此处查看代码图片\n\n```java\n@Override\npublic boolean\
  \ func_149852_a(World world, Random rand, int x, int y, int z) {\n    if(rand.nextInt(3)\
  \ == 0)\n        return true;\n    else\n        return false;\n}\n\n@Override\n\
  public void func_149853_b(World world, Random rand, int x, int y, int z) {\n   \
  \ int next = world.getBlockMetadata(x, y, z) + rand.nextInt(3);\n    if(next > 2)\n\
  \        next = 2;\n    world.setBlockMetadataWithNotify(x, y, z, next, 2);\n}\n\
  ```\n\n***\n\n### 自然生长\n\n接下来是一个非常重要的方法。此方法确保植物在没有骨粉的情况下生长。该方法名为 `updateTick`，处理方块的生长。对于\
  \ `BlockSamPlant`，代码应如下：\n\n```java\npublic void updateTick(World world, int x,\
  \ int y, int z, Random rand) {\n    super.updateTick(world, x, y, z);\n    if (world.getValue(x,\
  \ y, z) >= 9) {\n        int l = world.getBlockMetadata(x, y, z);\n        if (l\
  \ < 2) {\n            if (rand.nextInt(5) == 0) {\n                l++;\n      \
  \      }\n            world.setBlockMetadataWithNotify(x, y, z, l, 2);\n       \
  \ }\n    }\n}\n```\n\n简单来说，这确保了它只会生长。如果你跳过此步，Minecraft 可能会崩溃。所有的检查都完成了，元数据增加了。然后调用\
  \ `setBlockMetadataWithNotify`。这同步了服务器和客户端。这里的最后一个数字应该是 2。\n\n现在你有了可以工作的植物，最好能有一种获取它们的方法。这有两种方式实现：首先通过种子，其次通过世界生成。\n\
  \n### 添加种子\n\n要添加种子，你需要在主文件中为每个物品添加基础代码。然而，种子的构造函数必须不同。请注意以下代码存在错误。\n\n在类中添加以下代码：\n\
  \n`public static Item samseed;`\n\n这是 `preInit` 方法所需的代码：\n\n点击此处查看代码图片\n\n```java\n\
  samseed = new ItemSamSeed(samPlant);\nGameRegistry.registerItem(samseed, \"SamSeed\"\
  );\n```\n\n你应该熟悉这里的所有代码。创建了一个 `Item` 对象，随后将其设置为 `ItemSamSeed`（稍后会创建），然后注册该物品。唯一的额外代码是\
