  \ plant`。它看起来像是变量正在被赋值为自身，但实际上是将类中的 plant 设置为参数中的 plant。每当你在一段代码前加上前缀（无论是变量还是方法）时，它都会尝试在类中查找它，而不是在方法本身。在这种情况下，它找到了类的\
  \ `plant` 变量。\n\n额外的一行代码是 `setCreativeTab` 这一行，尽管你现在应该已经理解它了。因为现在设置了未本地化名称和纹理名称，所以需要本地化文件和纹理。`ItemSamSeed`\
  \ 的本地化内容如下：\n\n```\nitem.wuppy29_samsmod_samseed.name=Sam’s Seed\n```\n\n纹理类似于图\
  \ 11.6 并保存为 `samseed.png`。\n\n![图像](img/image0060.jpeg)\n\n**图 11.6** Sam’s Seed\
  \ 的纹理。\n\n现在，Sam’s Seed 物品的基本代码已经完成。接下来，确保它实际上是一个种子非常重要。你通过让它实现 `IPlantable` 接口来实现这一点。当你向类行添加\
  \ `extends IPlantable` 代码时，它首先会在下方显示一个错误，告诉你应该导入它。导入此文件后，类名下方会出现另一个错误。要修复这个错误，请添加未实现的方法。当你这样做时，添加的代码应该类似于此所示：\n\
