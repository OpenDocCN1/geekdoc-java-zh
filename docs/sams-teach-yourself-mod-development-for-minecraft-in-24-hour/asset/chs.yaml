  \ 变得非常有趣且庞大。然而，对于一个维度，你需要编写大量的代码。\n\n自定义维度所需的 Mod 类代码看起来如下：\n\n点击此处查看代码图片\n\n```java\n\
  public static int dimension = 5;\n\nDimensionManager.registerProviderType(dimension,\
  \ WorldProviderExample.class, false);\n\nDimensionManager.registerDimension(dimension,\
  \ dimension);\n```\n\n建议将维度 ID（dimension ID）设置为可配置，以便与其他 Mod 保持兼容性。\n\n## WorldProviderExample（世界提供者示例）\n\
  \n`WorldProvider` 包含了你维度的几个重要设置。它主要设置了 `WorldChunkManager`，这是一个主要处理生物群的类。在这种情况下，使用了\
  \ `WorldChunkManagerHell`，这意味着该维度将只有一个生物群。你可以创建一个自定义的 `WorldChunkManager`，但这非常复杂，而且只有少数人成功运行过它。\n\
  \n###  A.14 WorldProviderExample 类\n\n点击此处查看代码图片\n\n```java\npackage com.wuppy.samsmod.dimension;\n\
  \nimport net.minecraft.util.ChunkCoordinates;\nimport net.minecraft.world.WorldProvider;\n\
  import net.minecraft.world.biome.BiomeGenBase;\nimport net.minecraft.world.biome.WorldChunkManagerHell;\n\
  import net.minecraft.world.chunk.Chunk;\nimport net.minecraft.world.chunk.IChunkProvider;\n\
  \npublic class WorldProviderExample extends WorldProvider\n{\n    public void registerWorldChunkManager()\n\
  \    {\n            this.worldChunkMgr = new WorldChunkManagerHell(BiomeGenBase.beach,\
  \ 0.1F);\n            this.dimensionId = SamsMod.dimension;\n    }\n    @Override\n\
  \    public String getSaveFolder()\n    {\n            return \"DIM-Example\";\n\
  \    }\n    @Override\n    public String getWelcomeMessage()\n    {\n          \
  \  return \"Entering The Example Dimension\";\n    }\n    @Override\n    public\
  \ String getDepartMessage()\n    {\n            return \"Leaving The Example Dimension\"\
  ;\n    }\n    @Override\n    public boolean canRespawnHere()\n    {\n          \
  \  return true;\n    }\n    @Override\n    public IChunkProvider createChunkGenerator()\n\
  \    {\n            return new ChunkProviderExample(worldObj, worldObj.getSeed(),\
  \ true);\n    }\n    @Override\n    public String getDimensionName()\n    {\n  \
  \          return \"Example\";\n    }\n    /**\n     * 获取用于进入此维度的硬编码传送位置。\n    \
  \ */\n    @Override\n    public ChunkCoordinates getEntrancePortal()\n    {\n  \
  \          return null;\n    }\n    @Override\n    public boolean canDoLightning(Chunk\
  \ chunk)\n    {\n            return true;\n    }\n    @Override\n    public boolean\
  \ canDoRain(Chunk chunk)\n    {\n            return false;\n    }\n}\n```\n\n##\
  \ ChunkProvider（区块提供者）\n\n在 `WorldProvider` 中所示的 `ChunkProviderExample` 是一个巨大的类，它为你生成维度。它放置了基岩、石头、泥土、沙子、水以及你在\
  \ Minecraft 世界中看到的几乎所有东西。这是你维度中一个非常重要的类，因为它定义了它的样貌。自定义维度的类可以在 Listing.15 中找到。\n\n\
