  \ \"sammob\", 0, this, 80, 3, true);\nEntityRegistry.registerModEntity(EntitySamThrowable.class,\
  \ \"samthrow\", 1, this, 80, 3, true);\nfor (int i = 0; i < BiomeGenBase.getBiomeGenArray().length;\
  \ i++)\n{\n    if (BiomeGenBase.getBiomeGenArray()[i] != null)\n    {\n        EntityRegistry.addSpawn(EntitySamMob.class,\
  \ 0, 1, 3, EnumCreatureType.monster, BiomeGenBase.getBiomeGenArray()[i]);\n    }\n\
  }\nregisterEgg(EntitySamMob.class, 0xd8bb9d, 0xa63c1a);\nGameRegistry.registerGenerator(handler,\
  \ 0);\nMinecraftForge.EVENT_BUS.register(handler);\n}\n\n@EventHandler\npublic void\
  \ init(FMLInitialization event)\n{\n//Recipes\nGameRegistry.addRecipe(new ItemStack(Items.apple),\
  \ \"XXX\", \"XXX\", \"XXX\", 'X', Blocks.leaves);\nGameRegistry.addRecipe(new ItemStack(Items.arrow),\
  \ \"YZ\", \"X \", 'X', Items.flint, 'Y', Items.stick, 'Z', Blocks.leaves);\nGameRegistry.addShapelessRecipe(new\
  \ ItemStack(Items.dye, 2, 1), Items.redstone, new ItemStack(Items.dye, 1, 1));\n\
  GameRegistry.addSmelting(Blocks.stone, new ItemStack(Blocks.stonebrick), 0.1F);\n\
  ItemStack enchantedSwordItemStack = new ItemStack(Items.stone_sword);\nenchantedSwordItemStack.addEnchantment(Enchantment.sharpness,\
  \ 1);\nGameRegistry.addShapelessRecipe(enchantedSwordItemStack, Items.flint, Items.stone_sword);\n\
  \n//Dungeon changes\nDungeonHooks.removeDungeonMob(\"Spider\");\nDungeonHooks.addDungeonMob(\"\
  Creeper\", 100);\nChestGenHooks.removeItem(ChestGenHooks.DUNGEON_CHEST, new ItemStack(Items.saddle));\n\
  ChestGenHooks.addItem(ChestGenHooks.DUNGEON_CHEST, new WeightedRandomChestContent(new\
  \ ItemStack(Blocks.cobblestone), 25, 50, 10));\n}\n\nstatic int startEntityId =\
  \ 300;\n@SuppressWarnings(\"unchecked\")\npublic static void registerEntityEgg(Class<?\
  \ extends Entity> entity, int primaryColor, int secondaryColor)\n{\n    int id =\
  \ getUniqueEntityId();\n    EntityList.IDToMapping.put(id, entity);\n    EntityList.entityEggs.put(id,\
  \ new EntityEgg(id, primaryColor, secondaryColor));\n}\npublic static int getUniqueEntityId()\n\
  {\n    do\n    {\n        startEntityId++;\n    } while (EntityList.getStringFromID(startEntityId)\
  \ != null);\n    return startEntityId;\n}\n```\n\n清理这个庞大文件的简单方法是将其拆分成若干部分。这通常通过名为\
  \ `ModBlocks`、`ModItems` 等类来实现。对于 `SamsMod`，`ModBlocks` 如列表 22.2 所示。\n\n### 列表 22.2\
  \ SamsMod 的 ModBlocks\n\n```java\npackage com.wuppy.samsmod.blocks;\nimport com.wuppy.samsmod.items.ItemSamStone;\n\
  import cpw.mods.fml.common.registry.GameRegistry;\nimport net.minecraft.block.Block;\n\
  \npublic class ModBlocks\n{\n    public static Block samStone;\n    public static\
  \ Block samPlant;\n    public static Block samTE;\n    public static void loadBlocks()\n\
  \    {\n        samStone = new BlockSamStone();\n        samPlant = new BlockSamPlant();\n\
  \        samTE = new BlockSamTE();\n        GameRegistry.registerBlock(samStone,\
  \ \"SamStone\");\n        GameRegistry.registerBlock(samPlant, \"SamPlant\");\n\
  \        GameRegistry.registerBlock(samTE, \"SamTE\");\n    }\n}\n```\n\n你应该从该类中移除该代码。取而代之，在该类中添加以下行：\n\
  `ModBlocks.loadBlocks();`\n\n当你这样做时，对对象的引用就会失效。例如代码尝试在 `SamsMod` 类中引用 `samStone`，但那里并没有。相反，它在\
  \ `ModBlocks` 中。这意味着在你的模块中引用对象的地方，都应该改为 `ModBlocks`。一个例子是 `ItemSamSeed` 的初始化行：\n\
  \n```java\nsamseed = new ItemSamSeed(samPlant);\n```\n\n这尝试在 `SamsMod` 中访问 `samPlant`，那里已不存在了。将代码改为：\n\
  \n将移动到 `ModBlocks`、`ModItems` 等类中的所有代码后，代码中的某些内容可能需要更改。例如，在 `ModItems` 中，护甲和工具必须是静态的，而\
  \ `ModEntities` 需要传递类来注册实体。具体代码可以在本书的示例文件中找到（有关如何访问文件的信息）。\n\n清理完成后，`SamsMod` 如列表\
  \ 22.3 所示。\n\n### 列表 22.3 清理后的 SamsMod\n\n```java\npackage com.wuppy.samsmod;\n\
  import net.minecraft.init.Blocks;\nimport net.minecraft.init.Items;\nimport net.minecraft.item.ItemStack;\n\
  import net.minecraft.util.WeightedRandomChestContent;\nimport net.minecraftforge.common.ChestGenHooks;\n\
  import net.minecraftforge.common.DungeonHooks;\nimport net.minecraftforge.common.MinecraftForge;\n\
  import com.wuppy.samsmod.blocks.ModBlocks;\nimport com.wuppy.samsmod.entity.ModEntities;\n\
  import com.wuppy.samsmod.handlers.RecipeHandler;\nimport com.wuppy.samsmod.handlers.SamEventHandler;\n\
  import com.wuppy.samsmod.items.ModItems;\nimport com.wuppy.samsmod.proxies.CommonProxy;\n\
  import com.wuppy.samsmod.tileentities.TileEntitySam;\nimport cpw.mods.fml.common.Mod;\n\
  import cpw.mods.fml.common.EventHandler;\nimport cpw.mods.fml.common.SidedProxy;\n\
  import cpw.mods.fml.common.event.FMLInitializationEvent;\nimport cpw.mods.fml.common.event.FMLPreInitializationEvent;\n\
  import cpw.mods.fml.common.registry.GameRegistry;\n\n@Mod(modid = SamsMod.MODID,\
  \ version = SamsMod.VERSION)\npublic class SamsMod\n{\n```\n\n\n\n\n```java\n  \
  \  public static final String MODID = \"wuppy29_samsmod\";\n\n    public static\
  \ final String VERSION = \"1.0\";\n\n    SamEventHandler handler = new SamEventHandler();\n\
  \n    @SidedProxy(clientSide = \"com.wuppy.samsmod.proxies.ClientProxySam\", serverSide\
  \ = \"com.wuppy.samsmod.proxies.CommonProxySam\")\n    public static CommonProxySam\
  \ proxy;\n\n    @EventHandler\n    public void preInit(FMLPreInitializationEvent\
  \ event)\n    {\n        proxy.registerRendering();\n        ModBlocks.loadBlocks();\n\
  \        GameRegistry.registerTileEntity(TileEntitySam.class, \"TE_samTE\");\n \
  \       ModItems.loadItems();\n        proxy.registerItemRenders();\n        ModEntities.loadEntities(this);\n\
  \        GameRegistry.registerWorldGenerator(handler, 0);\n        MinecraftForge.EVENT_BUS.register(handler);\n\
  \    }\n\n    @EventHandler\n    public void init(FMLInitializationEvent event)\n\
  \    {\n        RecipeHandler.registerRecipes();\n        //Dungeon changes\n  \
  \      DungeonHooks.removeDungeonMob(\"Spider\");\n        DungeonHooks.addDungeonMob(\"\
  Creeper\", 100);\n        ChestGenHooks.removeItem(ChestGenHooks.DUNGEON_CHEST,\
  \ new ItemStack(Items.saddle));\n        ChestGenHooks.addItem(ChestGenHooks.DUNGEON_CHEST,\
  \ new WeightedRandomChestContent(new ItemStack(Blocks.cobblestone), 25, 50, 10));\n\
  \    }\n}\n```\n\n正如你所看到的，并不是每一行代码现在都放在不同的类中。这一小时内完成的所有工作都是为了提高代码的可读性；添加许多只有几行代码的类并不能提高可读性。\n\
  \n### 总结\n\n在这一小时中，你学习了为什么清理你的模组很重要。之后，你学到了可以通过为某些类型的类创建子包来来实现这一点。这使得代码更易读，因为你正在寻找的代码被归类在一起了。此外，通过创建多个类来承担目前已经变得庞大的模组主类的工作，你的代码也可以因此变得更易读。\n\
  \n### 问答\n\n**Q. 将模组类的所有内容拆分到不同的 `init` 类中是一个好主意吗？**\n\n**A.** 不会。如果你这样做，初始版本会更易读。\n\
  \n**Q. 模组可以有的子包数量有上限吗？**\n\n**A.** 没有，但如果太多了，会让模组变得更难读。\n\n### 工作坊\n\n在这一小时中，你学习了如何让你的模组更易于读，从而更容易编写代码。这很重要，因为可以提高模组的生产力和准确性。通过测验测试你的理解程度。\n\
  \n### 测验\n\n**1. 一个包中合理的类数量是多少个？**\n\n**2. 为什么创建子包并将模组类拆分到其他类中如此有用？**\n\n### 答案\n\
  \n**1.** 至少两个是一个好主意，但对此没有准确的规则。\n\n**2.** 这让你自己读起来更费力。这直接加快了开发速度并减少了 Bug 的产生。此外，如果你将其开源（在下一小时会涵盖），它也能通过让其他人更容易读懂来帮助他们。\n\
  \n### 练习题\n\n如果你还没有这样做，请遵循这一小时的指令来结构化你的模组。\n\n## 第 23 小时：发布你的模组\n\n你这一小时将学到：\n\n\
  ![Image](img/image00525.jpeg) 导出你的模组\n\n![Image](img/image00525.jpeg) 制作你的模组\n\n\
  你的模组现在准备好发布了，这样其他人就可以使用。然而，在用户可以使用该模组之前，还需要完成几项工作。首先，你必须将 Eclipse 中的代码转换为 Minecraft\
  \ 可以使用的计算机代码，而无需集成开发环境 (IDE) 的帮助。接下来，你必须添加一个 `mcmod.info` 文件为用户提供信息。最后，确保用户能够找到这个模组是一个好主意。\n\
  \n### 导出你的模组\n\n使用 Forge 导出你的模组，请打开安装 Forge 的文件夹。确保你在包含 `gradlew` 文件的文件夹中。现在打开命令提示符或终端并运行以下命令\n\
  \n```\ngradlew build\n```\n\n这将你的人类可读的 `.java` 文件转换为 `.class` 文件。`.class` 文件人类不可读，但电脑可以读取。这些类被用在\
  \ Minecraft 中。该命令大约需要一分钟，此时会生成一个名为 `build` 的新文件夹。在 `build` 内部，有许多不同的文件夹，其中一个叫做 `libs`。打开\
  \ `libs` 文件夹，然后打开 `modid-1.0.jar` 文件。\n\n为了让你的模组能够被识别，你需要修改 `.jar` 文件内部的 `mcmod.info`\
  \ 文件。\n\n为了让你的模组显示正确，你需要修改 `mcmod.info` 文件中的字段。\n\n这是 `mcmod.info` 文件的结构：\n\n```json\n\
  {\n  \"modid\": \"你的 ModID\",\n  \"name\": \"模组名称\",\n  \"description\": \"模组描述\"\
  ,\n  \"version\": \"版本号\",\n  \"mcversion\": \"Minecraft 版本\",\n  \"url\": \"项目网址\"\
  ,\n  \"updateUrl\": \"更新地址\",\n  \"authors\": [\"作者名\"],\n  \"credits\": \"致谢\"\
  ,\n  \"logoFile\": \"图标文件名\",\n  \"screenshots\": [],\n  \"dependencies\": []\n\
  }\n```\n\n每个字段的含义如下：\n\n- `modid`: 模组的唯一标识，必须与代码中的 `MODID` 一致。\n- `name`: 模组在游戏中显示的名称。\n\
  - `description`: 模组的简短描述。\n- `version`: 模组的版本号。\n- `mcversion`: 模组支持的 Minecraft\
  \ 版本。\n- `url`: 模组的项目页面或下载地址（可选）。\n- `updateUrl`: 更新检查地址（可选）。\n- `authors`: 作者姓名列表。\n\
  - `credits`: 致谢信息。\n- `logoFile`: 模组图标的文件名（放在 `assets` 文件夹下）。\n- `screenshots`:\
  \ 截图文件名列表。\n- `dependencies`: 依赖项列表。\n\n### 创建 mcmod.info 文件\n\n最后，有一个 `mcmod.info`\
  \ 文件，它是示例 1 的默认值。你需要将其中的内容替换为你自己的信息。\n\n```json\n{\n  \"modid\": \"examplemod\"\
  ,\n  \"name\": \"Example Mod\",\n  \"description\": \"这是一个示例模组。\",\n  \"version\"\
  : \"1.0\",\n  \"mcversion\": \"1.12.2\",\n  \"url\": \"\",\n  \"updateUrl\": \"\"\
  ,\n  \"authors\": [\"ExampleAuthor\"],\n  \"credits\": \"Example Credits\",\n  \"\
  logoFile\": \"\",\n  \"screenshots\": [],\n  \"dependencies\": []\n}\n```\n\n将此文件保存为\
  \ `mcmod.info` 并放在你的 `.jar` 根目录下。这样，你的模组就会出现在 Minecraft 的模组列表中。\n\n\n\n\n现在你的 mod\
  \ 准备好发布了。唯一需要做的就是更改 `.jar` 文件的名称。最初，它的名称是 `modid-1.0.jar`。推荐的保存此类文件的格式是 `[Mod 名称]-[Minecraft\
  \ 版本]-[Mod 版本]`。对于 Sam’s Mod 的首次发布，文件将命名为 `Sams Mod-1.7.10-1.0.jar`。\n\n到此时，你可以做两件事。第一种也是最快的方法是立即开始将你的\
  \ mod 发布到各种常用的网站上。另一种选择是在发布之前先让别人给你的 mod 提供意见。这对你很有帮助，因为用户可能会发现漏洞，或者对你 mod 中的某些功能提供评论或建议。如果你不认识玩模组版\
  \ Minecraft 的朋友，你也可以互联网中继聊天（IRC）上询问，这是一种在线聊天程序。第 24 小节、“下一步](#part0040.xhtml_ch24)”向你展示了如何连接到它。一些实用的频道有\
  \ `#Direwolf20` 和 `#FTB`。不过，获取第二意见并不是要求的。\n\n### 上传到最常用的网站\n\n你应该发布 mod 的第一个、也是最重要的网站，应该是你在玩\
  \ Minecraft 时很可能已经访问过的网站。这个网站叫做 `minecraftforum.net`。只需创建一个账户并在以下子论坛发布你的 mod 即可：[www.minecraftforum.net/forum/51-minecraft-mods/](http://www.minecraftforum.net/forum/51-minecraft-mods/)。这是很多人寻找新\
  \ Minecraft mod 的地方，也是让你的 mod 传出去起点。\n\n在标题中放入 mod 的名称是一个好主意。在帖子正文中，明智的做法是提到 mod\
  \ 的思路、提供一些外观图片并并出一个下载链接。你可以将你的 mod 上传到几乎任何文件托管服务，例如 [dropbox.com](http://dropbox.com)。许多人喜欢的另外一点是你的\
  \ mod 是开源的。就像本小时的其他所有内容一样，这并不是强制要求的，但仍然建议。提供源代码最常用的方法是在 GitHub 上创建一个仓库。\n\n### 设置\
  \ GitHub 仓库\n\n要设置 GitHub 仓库，你必须首先在电脑上安装 GitHub。你可以使用 Windows 版 GitHub 应用程序 ([`windows.github.com/`](https://windows.github.com/))\
  \ 或 Mac 版 ([`mac.github.com/`](https://mac.github.com/))。或者，你可以安装 `Git`，它可以在每个系统上运行。这是一个类似于命令行程序，可以像\
  \ GitHub 应用程序一样使用，但它要求你手动编写命令，并且没有带有良好的界面。你可以在 [`help.github.com/articles/set-up-git#platform-all`](https://help.github.com/articles/set-up-git#platform-all)\
  \ 找到如何设置 `Git`。\n\n一旦设置好 `Git`，你就必须设置一个仓库，你可以按照 [`help.github.com/articles/create-a-repo`](https://help.github.com/articles/create-a-repo)\
  \ 上的说明轻松完成。（仓库是一个通常所有人都可以访问的在线源码仓库。）\n\n接下来，你需要将代码获取到你的 GitHub 仓库中。你可以直接上传整个 `forge`\
  \ 文件夹，但那是不法的。相反，你应该只上传源代码和资源。你可以通过编写一个详尽的 `gitignore` 文件，或者为你的 GitHub 仓库本地副本创建一个不同的文件夹并将正确的文件夹手动复制进去。你可以在带有\
  \ Minecraft 源码的 GitHub 仓库示例中找到 [`github.com/wuppy29/WuppyMods`](https://github.com/wuppy29/WuppyMods)。\n\
  \n### 其他网站\n\n除了最知名的网站外，还有一些常用的网站，你可能想在那里添加你的 mod。\n\n### 将你的 mod 添加到 modlist.mcf.li\n\
  \n`modlist.mcf.li` 是一个正如其名一样包含 mod 列表的网站。它做的并不多，只是提供一个 mod 列表，并附上获取它们的链接以及一些基础信息（如\
  \ Minecraft 版本、名称和描述），但它是获得更多曝光的一种不错方法。想要获取额外 mod 的人经常访问这个 mod 列表。该网站还有一个包含 Android\
  \ 应用程序，其中包含了网站上的所有内容。\n\n### 使用 planetminecraft\n\n[planetminecraft.com](http://planetminecraft.com)\
  \ 与 Minecraft 论坛非常相似，但它更侧重于展示创作，例如供玩家使用的 mod 和地图，它的它更不像一个论坛。\n\n### 更多网站\n\n显然，有很多不同的网站可以让你发布\
  \ mod。然而，在本小时内涵盖所有这些网站是不可能的，也有点没意义。之前的几个是最常用的，因此它们也是最重要的。你不应该把你的 mod 发布在太多的网站上。\n\
  \n### 总结\n\n在本小时中，你学习了如何导出你的 mod。接下来，你学习了如何编辑 `mod.info` 文件使其准备好发布。你学到了让你的 mod 开源是一个好主意，最后，你了解了你可能放置它的几个网站。\n\
  \n### 问答\n\n**问。有方法可以将 `modid-1.0` 改为更有用的名称吗？**\n\n**答。有的，你可以在 `build.gradle` 文件中这样做。**\n\
  \n```gradle\nbuildscript {\n    dependencies {\n        classpath 'net.minecraftforge:ForgeGradle:1.2-SNAPSHOT'\n\
  \    }\n}\n\napply plugin: 'forge'\n\nversion = \"1.0\"\ngroup=\"com.yourname.modid\"\
  \narchivesBaseName = \"modid\"\n\nminecraft {\n    version = \"1.7.10-152\"\n  \
  \  assetDir = \"eclipse\"\n}\n\nprocessResources {\n    from(sourceSets.main.srcDirs)\
  \ {\n        include 'mcmod.info'\n        expand 'version':project.version, 'mcversion':project.minecraft\n\
  \    }\n    from(sourceSets.main.srcDirs) {\n        exclude 'mcmod.info'\n    }\n\
  }\n```\n\n* *\n\n`version` 和 `archivesBaseName` 是保存你 mod 的 `.jar` 两个变量。\n\n**问。有办法不使用命令行就导出我的\
  \ mod 吗？**\n\n**答。遗憾没有，以后可能也不会有。**\n\n### 工作坊\n\n在本小时中，你学习了如何将你的 mod 从只有你可以在 Eclipse\
  \ 中使用的东西变成所有人都可以下载和享受的东西。虽然你不需要经常这样做，但当你希望别人使用你的 mod 时，这是最重要的部分。与其拥有一个几个功能的 mod，比起拥有一个无法运行的巨大\
  \ mod 要好。测试你的理解情况，以确保你可以导出功能完整的 mod。\n\n### 测验\n\n**1。为什么应该让你的 mod 开源？**\n\n**2。写在\
  \ `mcmod.info` 中的信息会显示在哪里？**\n\n### 答案\n\n**1。这可以帮助你的 mod 开发，因为别人可以帮助你修复漏洞，同时也通过在制作模组时提供一些源码来帮助他人。**\n\
  \n\n\n\n\n## 2. 这些信息将显示在 Minecraft 的 Mods 菜单中。\n\n### 练习\n\n在 minecraftforum.net\
  \ 上为你的模创建一个帖子，包含一些该模的基本信息、几张截图和一个下载链接。\n\n## 第 24 小时。接下来是什么\n\n* * *\n\n在本小时你将学习：\n\
  \n![Image](img/image00525.jpeg) 使用 IRC\n\n![Image](img/image00525.jpeg) 使用开源模\n\n\
  ![Image](img/image00525.jpeg) 学习 Java\n\n* * *\n\n在过去的 23 小时里，你学习了如何设置开始模组开发所需的一切，创建了实际的项目，然后将其导出并发布供他人使用。这就是这本书将教给你的全部，但还剩最后一个小时。在这个小时里，你将学习如何在没有这本书的情况下继续自己创建新内容。\n\
  \n### 使用 IRC\n\n互联网中继聊天（IRC）是一种在线聊天程序，许多 Minecraft 模组开发者用它来互相获取支持。除了很有用之外，与其他 Minecraft\
  \ 模组开发者聊天也非常有趣。\n\n### 安装 IRC\n\n你可以通过网页客户端访问 IRC，但某些频道为了防止垃圾邮件发送者不允许这样做。因此，在你的电脑上下载一个程序是一个好主意。这不仅是连接某些通道的要求，而且简单更好用。你可以使用许多不同的客户端，但本书涵盖了\
  \ `HexChat`。你可以从 [`hexchat.github.io/downloads.html`](http://hexchat.github.io/downloads.html)\
  \ 下载 `HexChat`。然后按照下载文件中的指令安装 `HexChat`。\n\n* * *\n\n提示：其他 IRC 客户端\n\n许多 Minecraft\
  \ 模组开发者使用 `HexChat`，但也有其他替代方案，例如用于 PC 的 `mIRC`、`Mibbit` 或 `KiwiIRC`，以及无数手机客户端。\n\
  \n* * *\n\n##### 添加必要的设置\n\n当你第一次启动 `HexChat` 时，`Network List`（网络列表）窗口会打开。按照以下列表执行所有操作，以确保你可以使用它。\n\
  \n1. 点击 `Network List` 窗口中的 `Add`。这将创建一个名为 `New Network` 的新网络。\n2. 将此名称更改为 `EsperNet`。\n\
  3. 点击 `Edit`。\n4. 当 `HexChat: Edit EsperNet` 对话框打开时，点击 `Add`。\n5. 输入 `irc.esper.net/6667`。这是你将与他人聊天时使用的服务器。\n\
  \n* * *\n\n注意：其他网络\n\n你可以为 IRC 使用许多不同的网络。Minecraft 社区中常用的是 `EsperNet`，因为在上面创建自己的频道非常容易。\n\
  \n另一个常用且稍专业一点的 IRC 网络是 `freenode`，它比 `EsperNet` 更严格。\n\n* * *\n\n6. 关闭 `HexChat:\
  \ Edit EsperNet` 窗口。\n7. 在 `Nick Name`（昵称）、`Second Choice`、`Third Choice` 和 `User\
  \ Name` 框中输入你的用户名。\n8. 点击右下角的 `Connect`。\n9. 当你连接到 `EsperNet` 时，输入以下命令：`/msg NickServ\
  \ register <password> <email>`，其中 `<password>` 和 `<email>` 是你的个人邮箱地址和密码。这将向你发送一封邮件，其中包含另一个你需要粘贴到\
  \ `HexChat` 中的命令。\n10. 检查你的收件箱。你应该收到一封包含命令的邮件。\n11. 回到 `HexChat: Edit EsperNet`\
  \ 窗口，勾选 `Connect to This Network Automatically`（自动连接到此网络）框框。\n12. 从 `Login Method`（登录方法）下拉菜单选择\
  \ `/MSG NickServ + Password`。在 `Password` 框中输入你刚刚注册的密码。这确保你不需要每次登录都注册；下次登录时，它会自动处理。\n\
  13. 最后，点击 `Close`，你的 IRC 程序就设置好了。\n\n### 加入频道\n\n现在必要的设置已完成，你可以开始在有趣的频道中与人聊天。对于使用\
  \ Forge 的 Minecraft 模组开发来说，最重要的频道之一是 `#minecraftforge`。要加入此频道，在屏幕底部用户名右侧的输入区域输入\
  \ `/join #minecraftforge`。这将让你进入频道，你可以在那里与各种人聊天。你可能想右键点击屏幕左侧的 `#minecraftforge`\
  \ 频道并选择 `Autojoin and Settings`、`Hide Join/Part Messages`，但这并非必须。\n\n* * *\n\n警告：小心你的信息\n\
  \n在互联网上聊天时，良好的做法是永远不要泄露个人信息——例如你的家庭地址、电话号码、当前位置——并且永远不要答应与在网上认识的人面谈。你在频道中互动的绝大多数人都是友好的，但最好还是留个心。\n\
  \n* * *\n\n你可能还想加入许多其他有趣的频道。有关于 Minecraft 模组开发的频道，也有关于玩 Minecraft 的频道。建议的频道有 `#Direwolf20`、`#FTB`、`#MinecraftForgeTuts`\
  \ 和 `#ModJam`。你可能还想加入一些关于 Minecraft 模组开发的频道，以及关于玩 Minecraft 的频道。\n\n24.1 图 24.1\
  \ 显示了你想要的功能。\n\n![Image **图 24.1** `HexChat` 的设置。\n\n* * *\n\n注意：其他网络\n\n你可以为 IRC\
  \ 使用许多不同的网络。Minecraft 社区中常用的是 `EsperNet`，因为在上面创建自己的频道非常容易。\n\n另一个常用且稍专业一点的 IRC 网络是\
  \ `freenode`，它比 `EsperNet` 更严格。\n\n通过在屏幕底部用户名右侧的输入区域输入 `/join [channel]` 来访问其他频道。你可能还想查看一下是否有关于你感兴趣的频道。发现新频道最简单的方法是尝试或询问他人。\n\
  \n\n\n当你编写代码时，在代码段之前包含注释是有帮助的，这可以说明接下来的代码的作用或任何可能有助于读者了解代码的其他信息。当你几周后再次回到同一段代码，但不完全记得它是做什么的时，这会对你很有帮助。此外，当其他人阅读你的代码时，这也有帮助。\n\
  \n不过，不要过度注释，否则你可能会降低代码的可读性。\n\n## 使用代码\n\n现在你已经知道如何寻找新代码以及如何理解它。然而，知道如何使用这些代码同样重要。\n\
  \n### 你不能对代码做什么\n\n你不能直接复制别人的代码。如果你这样做，原始模组作者（modder）可能不会喜欢。这可能导致作者将模组改为闭源，而这是没有人会喜欢的。因此，在查看代码时，尊重模组作者的意愿是非常重要的。有些模组在源码中包含许可证，你必须遵守，但即使它们没有，你不应该直接复制代码。那是对原作者的不尊重，也意味着你的模组缺乏原创性，结果就是它是无聊的。\n\
  \n### 你可以对代码做什么\n\n你可以也应该对代码做的是从从中学习。你可以利用代码来发现他人是如何编写代码的。通过这些信息，你可以改进自己的模组。在制作模组时，最好的想法总是从已经有的东西开始，然后根据你的需求进行调整。不过，你应该始终寻找代码中的许可证。有些开源模组允许这样做，但另一些不允许。\n\
  \n### 注意事项：复制代码\n\n虽然复制代码通常不是违法的，但这并不礼貌。如果你确实从另一个模组中复制了代码，请务必给予应有的致谢。当模组作者在制作时互相尊重时，社区就能真正成长。如果这种情况没有发生，就会出现问题，而没有人喜欢喜问题。\n\
  \n在使用开源代码之前，请务必查看它使用的许可证，以确保你想要的操作是被允许的。\n\n## 学习 Java\n\n在完成这本书后，你继续学习可以做的最好的事情之一就是学习\
  \ Java。如果你还没有学习 Java，我强烈建议你现在就开始学习。你可以通过几种不同的资源来学习 Java。一个免费的选项是由 thenewboston 在\
  \ YouTube 上制作的播放列表：`https://www.youtube.com/playlist?list=PLFE2CE09D83EE3E28`。这个资源很好，是因为它是免费的。虽然它并不总是完全准确，但它是目前最好的免费资源之一。\n\
  \n另一个更准确、可能更适合学习的资源是 Rogers Cadenhead 编写的 `Sams Teach Yourself Java in 24 Hours`。\n\
  \n当你遵循任何关于学习 Java 的资源时，你会发现你已经掌握了一些基础知识。然而，如果你想真正精通 Minecraft 模组制作，你需要的不仅仅是 Java\
  \ 的基础知识。\n\n创建 Minecraft 模组并不需要博大的 Java 知识。但是，如果你想创建真正独特且有趣的模组，你确实需要了解 Java——你了解的\
  \ Java 越多，你能创建的模组就越出色。此外，如果你需要自己将模组更新到新版本的 Minecraft，你需要精通 Java。正因如此，学习 Java 是一个非常好的主意——学得越早，对你越有利。\n\
  \n### 总结\n\n在这一小时中，你学习了如何安装 IRC 以及如何加入 Minecraft 模组开发中最重要的频道。然后，你学习了如何使用其他开源模组来获取如何改进你模组的知识。最后，你了解到学习\
  \ Java 是一个好主意，这样你就可以在没有帮助的情况下开发模组了。\n\n### 问答\n\n### Q. 为什么使用 HexChat?\n\n**A.**\
  \ HexChat 是许多不同的 IRC 客户端之一。它们都有自己的优缺点，对于不同的人，最好的客户端可能不同。你需要在电脑上有一个 IRC 程序来连接某些频道，而\
  \ HexChat 通常被认为是最好的。\n\n### Q. 为什么我不能直接从其他模组复制代码?\n\n**A.** 通常，模组作者不会喜欢的。然而，在某些情况下，如果你不遵守模组作者提供的许可证中的规则，这可能被视为抄袭。此外，它会让你的模组缺乏原创性。\n\
  \n### 工作坊\n\n在这一小时中，你学习了在完成这本书后如何继续你的模组开发。请通过完成最后的测验来确保你知道如何这样做。\n\n### 测验\n\n###\
  \ 1. 为什么你需要学习 Java?\n\n### 2. 为什么在加入 #minecraftforge 之前必须向 NickServ 注册?**\n\n###\
  \ 答案\n\n**1.** 你需要擅长 Java 来制作更好的模组。\n\n**2.** 只有注册后才能加入。\n\n### 练习\n\n## 附录 A. 其他代码\n\
