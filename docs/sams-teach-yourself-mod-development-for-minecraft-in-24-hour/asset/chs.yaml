  \n当你更新你的模（mod）时，你可能希望人们知道这件事。以下代码可以帮助你通过控制台打印信息来告诉玩家你的模已更新。列表 A.6 展示了 `UpdateChecker`\
  \ 类。\n\n**列表 A.6 类：UpdateChecker**\n\n点击此处查看代码图片\n\n```java\npackage com.wuppy.samsmod;\n\
  \nimport java.io.BufferedReader;\nimport java.io.IOException;\nimport java.io.InputStream;\n\
  import java.io.InputStreamReader;\nimport java.net.HttpURLConnection;\nimport java.net.URL;\n\
  \npublic class UpdateChecker\n{\n    public static String updates = \"\";\n    public\
  \ static boolean outdated = false;\n    public static void checkForUpdates()\n \
  \   {\n        int currentVersion = SamsMod.modVersion;\n        int nextVersion\
  \ = getNew();\n        if (currentVersion < nextVersion)\n        {\n          \
  \  updates = getUpdate(nextVersion);\n            outdated = true;\n        }\n\
  \        else\n        {\n            outdated = false;\n        }\n    }\n    public\
  \ static int getNew()\n    {\n        try\n        {\n            URL url = new\
  \ URL(\"http://uppy29.com/mods/sm/new.txt\");\n            HttpURLConnection connection\
  \ = (HttpURLConnection) url.openConnection();\n            connection.setRequestMethod(\"\
  POST\");\n            connection.setRequestProperty(\"Content-Type\", \"application/x-www-form-urlencoded\"\
  );\n            connection.setRequestProperty(\"Content-Language\", \"en-US\");\n\
  \            connection.setRequestProperty(\"User-Agent\", \"Mozilla/5.0 (Windows\
  \ NT 5.1) AppleWebKit/35.1 (KHTML, like) Chrome/17.0.963.5 Safari/35.1\");\n   \
  \         connection.setUseaches(false);\n            connection.setDoInput(true);\n\
  \            connection.setDoOutput(true);\n            InputStream is = connection.getInputStream();\n\
  \            BufferedReader br = new BufferedReader(new InputStreamReader(is));\n\
  \            String line;\n            StringBuffer response = new StringBuffer();\n\
  \            while ((line = br.readLine()) != null)\n            {\n           \
  \     response.append(line);\n            }\n            br.close();\n         \
  \   return Integer.parseInt(response.toString());\n        }\n        catch (IOException\
  \ e)\n        {\n            e.printStackTrace();\n        }\n        return -1;\n\
  \    }\n    private static String getUpdate(int version)\n    {\n        try\n \
  \       {\n            URL url = new URL(\"http://uppy29.com/mods/sm/\" + version\
  \ + \".txt\");\n            HttpURLConnection connection = (HttpURLConnection) url.openConnection();\n\
  \            connection.setRequestMethod(\"POST\");\n            connection.setRequestProperty(\"\
  Content-Type\", \"application/x-www-form-urlencoded\");\n            connection.setRequestProperty(\"\
  Content-Language\", \"en-US\");\n            connection.setRequestProperty(\"User-Agent\"\
  , \"Mozilla/5.0 (Windows NT 5.1) AppleWebKit/35.1 (KHTML, like) Chrome/17.0.963.5\
  \ Safari/35.1\");\n            connection.setUseaches(false);\n            connection.setDoInput(true);\n\
  \            connection.setDoOutput(true);\n            InputStream is = connection.getInputStream();\n\
  \            BufferedReader br = new BufferedReader(new InputStreamReader(is));\n\
  \            String line;\n            StringBuffer response = new StringBuffer();\n\
  \            while ((line = br.readLine()) != null)\n            {\n           \
  \     response.append(line);\n            }\n            br.close();\n         \
  \   return response.toString();\n        }\n        catch (IOException e)\n    \
  \    {\n            e.printStackTrace();\n        }\n        return \"Error\";\n\
  \    }\n}\n```\n\n`modVersion` 是一个从 1 开始并在每当新版本发布时增加的数字。该模组有一个名为 `newest.txt` 的文件，其中包含最新的版本号。如果该数字比代码中的\
  \ `modVersion` 高，它将访问 `[versionnumber].txt` 获取更改内容。我将所有这些内容都放在我的网站上，但你也可以把它们放在 Dropbox\
  \ 或类似的地方。\n\n以下事件代码将在聊天框中打印更改：\n\n点击此处查看代码图片\n\n```java\n@SubscribeEvent\npublic\
  \ void check(PlayerEvent event)\n{\n    if (UpdateChecker.outdated)\n    {\n   \
  \     event.player.addChatComponent(new ChatComponent(\"SamsMod is outdated.\"));\n\
  \        event.player.addChatComponent(new ChatComponent(\"Changelog: \"));\n  \
  \      event.player.addChatComponent(new ChatComponent(UpdateChecker.updates));\n\
  \    }\n}\n```\n\n### 自定义标签页\n\n当你有很多物品或方块时，创建 `CreativeTab` 可能很有用，这可以让原版的标签页更容易使用，并让你的东西更容易找到。要实现这一点，模应该调用以下行代码：\n\
