  \    for(int x = 0; x < chancesToSpawn; x++)\n    {\n        int posX = blockXPos\
  \ + random.nextInt(maxX);\n        int posY = minY + random.nextInt(diffBtwnMinMaxY);\n\
  \        int posZ = blockZPos + random.nextInt(maxZ);\n        (new WorldGenMinable(block,\
  \ metadata, maxVeinSize, target)).generate(world, random, posX, posY, posZ);\n \
  \   }\n}\n```\n\n### 编辑方块掉落\n\n添加新的方块掉落的方法与添加新的实体掉落非常相似。所需的事件名为 `HarvestDropsEvent`，它位于\
  \ `BlockEvent` 内部。为 Minecraft 中的红花添加 Sam 浆果（Sam’s Berries）掉落的方法如下：\n\n```java\n\
  @SubscribeEvent\npublic void addBlockDrops(BlockEvent.HarvestDropsEvent event)\n\
  {\n    if(event.block == Blocks.red_flower)\n        event.drops.add(new ItemStack(SamsMod.berry));\n\
  }\n```\n\n与 `LivingDropsEvent` 不同，`HarvestDropsEvent` 拥有一个 `ItemStack` 的掉落 `ArrayList`，这使得比为实体向方块添加掉落容易得多。\n\
  \n### 其他事件\n\n现在你已经看到了代码中使用的两个事件。然而，在 Forge 和 Forge Mod Loader (FML) 的事件包中还可以找到更多事件，它们的工作原理都与此类似。Forge\
  \ 中的每个事件工作方式如下：\n\n-   你需要一个可以使用任意名称的方法。\n-   该方法上方需要有 `@SubscribeEvent` 注解。\n-\
  \   唯一允许的参数是你想要使用的事件。\n-   该方法所在的类必须被注册为 `Event` 类。\n\n如果你正在使用 Forge 事件，必须像之前所示对其进行注册，例如：\n\
  \n```java\nMinecraftForge.EVENT_BUS.register(handler);\n```\n\n如果你想用 FML 事件，请按如下方式注册处理程序：\n\
  \n```java\nFMLCommonHandler.instance().bus().register(handler);\n```\n\n#### 注意：EventHandler\
  \ 注册\n\n同一个 `EventHandler` 可以同时被注册为 FML 和 Forge 事件类。你不需要为它准备两个不同的类。\n\n事件还可以用于改变掉落之外的许多其他事情。可以完全重写某些结构的生成方式，改变\
  \ Minecraft 中食物的运作方式，以及许多其他示例——这一切都无需编辑任何类文件。\n\n### 赋予你的护甲投掷能力\n\n利用事件可以做的另一个有趣事情是：让玩家在穿着全套盔甲时空手右键点击扔蛋。此功能将会添加。要实现这一点，请使用一个名为\
  \ `PlayerInteractEvent` 的事件。该事件位于 fml 文件夹中，这意味着该事件类必须像之前所示使用 FML 的 `EVENT_BUS` 进行注册。\n\
  \n`SamEventHandler` 内部的方法如下：\n\n```java\n@SubscribeEvent\npublic void throwEggs(PlayerInteractEvent\
  \ event)\n{\n}\n```\n\n在该方法内部，你必须在扔蛋之前检查几件事。该方法中的代码逻辑应该如下所示：\n\n1. 玩家正在点击右键吗？\n\
  2. 玩家手空的吗？\n3. 玩家穿了正确的盔甲吗？\n4. 扔蛋。\n\n首先，你可以使用事件内部的 `action` 变量检查右键点击。进入 `PlayerInteractEvent`，你会看到三种可能的动作：`RIGHT_CLICK_AIR`、`RIGHT_CLICK_BLOCK`\
  \ 和 `LEFT_CLICK_BLOCK`。为了确保只有在右键点击时才扔蛋，它必须是右键点击动作之一。你可以通过向方法添加以下 `if` 语句来实现：\n\n\
  ```java\n@SubscribeEvent\npublic void throwEggs(PlayerInteractEvent event)\n{\n\
  \    if (event.action == PlayerInteractEvent.Action.RIGHT_CLICK_AIR || event.action\
  \ == PlayerInteractEvent.Action.RIGHT_CLICK_BLOCK)\n    {\n    }\n}\n```\n\n现在你需要进行第二次检查，确保玩家手中没有物品。要执行这一点，你需要访问\
  \ `EntityPlayer`。幸运的是，事件拥有这个变量。`EntityPlayer` 中有一个名为 `getCurrentEquippedItem` 的方法，它返回玩家持有的物品或\
  \ `null`。因为你不希望玩家在执行此操作时持有任何物品，所以当前装备物品必须为 `null`，你可以使用以下 `if` 语句进行检查：\n\n```java\n\
  @SubscribeEvent\npublic void throwEggs(PlayerInteractEvent event)\n{\n    if (event.action\
  \ == PlayerInteractEvent.Action.RIGHT_CLICK_AIR || event.action == PlayerInteractEvent.Action.RIGHT_CLICK_BLOCK)\n\
  \    {\n        if (event.entityPlayer.getCurrentEquippedItem() == null)\n     \
  \   {\n        }\n    }\n}\n```\n\n\n\n\n现在你必须实际检查从 `getCurrentArmor` 返回的项。你可以通过几种方法来实现。你可以检查返回的项是否与任何盔甲部件相同。然而，你也可以使用\
  \ Java 中现有的名为 `instanceof` 特性让这变得好得多。`instanceof` 是 Java 的一个运算符，用于检查操作符前的对象是否是操作符后类的实例（也就是说，如果它扩展了该类）。由于\
  \ Sam 盔甲套组中的所有物品都是在 `ItemSamArmor` 中制作的，你可以使用以下检查：\n\n点击此处查看代码图片\n\n```java\nif\
  \ (event.entityPlayer.getCurrentArmor(i).getItem() instanceof ItemSamArmor)\n{\n\
  \n}\n```\n\n但是，该项也有可能是 `null`。如果发生这种情况，该方法会导致你的游戏崩溃。这将非常糟糕，因为这段代码会在玩家右键点击时运行——这意味着玩家将无法玩游戏。为了防止这种崩溃，必须在检查当前盔甲不为\
  \ `null` 之后运行这段代码。它看起来应该是这样：\n\n点击此处查看代码图片\n\n```java\nif (event.entityPlayer.getCurrentArmor(i)\
  \ == null)\n{\n    return;\n}\nelse if (event.entityPlayer.getCurrentArmor(i).getItem()\
  \ instanceof ItemSamArmor)\n{\n\n}\n```\n\n现在必须创建一个 `boolean` 变量，用于保存是否穿了全套盔甲的信息。\n\
  \n这可能相当困难，因为如果单件盔甲是 Sam 的盔甲，就不应该将其设置为 `true`。每一件物品都必须是 Sam 盔甲的一部分。否则，不应该生成蛋。有几种方法可以实现这一点，以下代码是可能的解决方案之一：\n\
  \n点击此处查看代码图片\n\n```java\nboolean fullSuit = true;\n\nfor (int i = 0; i < 4; i++)\n\
  {\n    if (event.entityPlayer.getCurrentArmor(i) == null)\n    {\n        fullSuit\
  \ = false;\n        return;\n    }\n    else if (!(event.entityPlayer.getCurrentArmor(i).getItem()\
  \ instanceof ItemSamArmor))\n    {\n        fullSuit = false;\n    }\n}\n```\n\n\
  该 `boolean` 初始化为 `true`。然后它像之前所示，遍历每一件盔甲部件。如果任何一个盔甲部件是空的，它就会变为 `false`。如果任何物品不是\
  \ `ItemSamArmor` 的实例，注意语句周围的感叹号；它也会变为 `false`。\n\n现在，只有当玩家穿着全套盔甲时，`boolean fullSuit`\
  \ 才为 `true`，这意味着可以使用以下代码生成蛋：\n\n点击此处查看代码图片\n\n```java\nif (fullSuit)\n{\n    event.entityPlayer.worldObj.spawnEntityInWorld(new\
  \ EntityEgg(event.entityPlayer.worldObj, event.entityPlayer));\n}\n```\n\n整个 `PlayerInteractEvent`\
  \ 方法现在看起来应该像列表 21.2。\n\n**列表 21.2 全套蛋的投掷代码**\n\n点击此处查看代码图片\n\n* *\n\n```java\n@SubscribeEvent\n\
  public void throwEggs(PlayerInteractEvent event)\n{\n    if (event.action == PlayerInteractEvent.Action.RIGHT_CLICK_AIR\
  \ || event.action == PlayerInteractEvent.Action.RIGHT_CLICK_BLOCK)\n    {\n    \
  \    if (event.entityPlayer.getCurrentEquippedItem() == null)\n        {\n     \
  \       boolean fullSuit = true;\n            for (int i = 0; i < 4; i++)\n    \
  \        {\n                if (event.entityPlayer.getCurrentArmor(i) == null)\n\
  \                {\n                    fullSuit = false;\n                    return;\n\
  \                }\n                else if (!(event.entityPlayer.getCurrentArmor(i).getItem()\
  \ instanceof ItemSamArmor))\n                {\n                    fullSuit = false;\n\
  \                }\n            }\n        }\n        if (fullSuit)\n        {\n\
  \            event.entityPlayer.worldObj.spawnEntityInWorld(new EntityEgg(event.entityPlayer.worldObj,\
  \ event.entityPlayer));\n        }\n    }\n}\n```\n\n* *\n\n现在，当你右键点击并满足所有要求时，玩家会投出一个蛋，如图\
  \ 21.1 所示。\n\n![Image](img/image00648.jpeg)\n\n**图 21.1** 玩家穿着全盔甲投掷蛋。\n\n### 总结\n\
  在这一小时中，你学习了如何间接地修改 Minecraft。你可以通过这些方式实现，例如从游戏中移除实体或使用事件、反射和字节码操作来修改某些功能。你还学习了如何实现前两种。你可以通过移除每个自然生成点来轻松移除实体。你可以在注册在\
  \ `EVENT_BUS` 中的类中使用事件。它们很容易使用，而且通过它们可以做很多事情。\n\n### 问答\n\n**问. 为什么要避免直接修改 Minecraft\
  \ 类？**\n\n**答. 这增加了与其他 mod 的兼容性。当两个 mod 修改同一个类时，很可能会导致崩溃。使用事件，这个问题就完全解决了。**\n\n\
  **问. 订阅的事件数量有限制吗？**\n\n**答. 没有，但如果你添加得太多，游戏会变慢。**\n\n**问. 可以对同一个事件进行多次订阅吗？**\n\n\
  **答. 可以，但如果你在同一个 mod 中有，最好将它们放在同一个方法里。**\n\n### 工作坊\n在这一小时中，你学习了间接修改 Minecraft。这对\
  \ mod 开发非常重要，请通过完成以下测验来确保你理解了它们。\n\n### 测验\n\n**问. `LivingDropsEvent` 和 `HarvestDropEvent`\
  \ 中的 `ArrayList` 有什么区别？**\n\n**问. 如果你不将 `Event` 类注册到 `EVENT_BUS` 会发生什么？**\n\n###\
  \ 答案\n\n**答. `LivingDropsEvent` 需要 `EntityItems`，而 `HarvestDropEvent` 需要 `ItemStack`。**\n\
  \n**答. 什么都不会发生。所有订阅的事件都不会运行。**\n\n### 练习\n使用 `LivingEvent` 中的 `LivingJumpEvent`\
  \ 事件，在实体跳跃时打印出“jump”。\n\n以下代码可以实现这一点：\n\n点击此处查看代码图片\n\n```java\n@SubscribeEvent\n\
  public void printJump(LivingEvent.LivingJumpEvent event)\n{\n    System.out.println(\"\
  jump\");\n}\n```\n\n这个方法看起来可能没用，但如果你检查玩家跳跃，然后检查玩家是否穿着特定类型的靴子，这个方法就可以用于，例如在跳跃时治疗玩家。\n\
  \n\n\n\n构建你的 Mod 并借此清理代码是非常用的。它们能通过让代码更易读来帮助你。当代码更易读时，添加新功能会变得容易得多。当出现 bug 或需要更新时，也能让你更容易找到错误所在的位置。此外，如果你让你的\
  \ Mod 开源（这通常是个好主意），也能帮助他人，因为他们可以轻松理解你的代码，并可能帮助你更新或修复其中的某些部分。\n\n## 如何构建你的 Mod\n\n\
  你已经采取了一些操作来构建你的 Mod，并使其更容易易读和发现 bug。例如，在你的 Mod 文件中对所有的方块和物品变量分组，并为每个方法添加 `@Override`。然而，要让它看起来真正整洁，还需要更多的操作。\n\
  \n### 清理包（Package）\n\n当你查看包中的类时，它看起来应该类似于图 22.1。\n\n![Image](img/image0064.jpeg)\n\
  \n**图 22.1** 包中的类。\n\n这看起来完全没有组织性。为了让它看起来更好，可以创建子包。一些常用的子包有 `blocks`、`items`、`generation`\
  \ 和 `render`。在完全清理之后，包列表看起来类似于图 22.2。\n\n![Image](img/image00650.jpeg)\n\n**图 22.2**\
  \ 在子包中整理的类。\n\n此处的所有内容都是可选的。例如，包的数量、名称以及每个包中的文件对每个人来说都可以不同。这实际上取决于你的个人偏好。然而，建议的这种方法如图图\
  \ 22.2](#part0038.xhtml_ch22fig02)所示。你可以通过将文件从一个包拖到另一个包来移动文件。\n\n通常情况下，一个包中的类数量至少为三个，因为为每个类创建一个子包只会让代码阅读变得更加困难。\n\
  \n**注意：更改代理（Proxies）**\n\n当你更改任一个代理的包名或文件名时，你必须更改 Mod 文件中的 `@SidedProxy` 行，以确保它们仍然能被找到。对于这个\
  \ Mod，该行代码现在应该像这样：\n\n点击此处查看代码图像\n\n```\n@SidedProxy(clientSide = \"com.wuppy.samsmod.proxies.ClientProxySam\"\
  , serverSide = \"com.wuppy.samsmod.proxies.CommonProxySam\")\n```\n\n另一个需要注意的是，有一个名为\
  \ `items.tools` 的包。这意味着子包 `items` 有另一个名为 `tools` 的子包。在这种情况下，这是很有用的，因为有很多不同的工具，这样它们也得到了适当的组织。\n\
  \n**注意：文件夹中的包**\n\n包在你的系统中由文件夹表示。到目前为止，所有编写的代码都位于 `com/wuppy/samsmod` 文件夹（或你的包名）。添加所有这些子包也意味着\
  \ `samsmod` 文件夹中现在会有几个文件夹。\n\n### 清理 Mod 类\n\n在本书中，Mod 类几乎每小时都有新代码。即使你保持该类尽可能整洁，它看起来仍然会非常拥挤，并且变得越来越难以阅读。如果你保持该类合理的整洁，它看起来应该类似于代码列表\
