  \ `AI` 的适配。你也将看到 `AI` 的示例。\n\n####受伤时逃跑\n\n以下 `AI` 代码会让生物在受伤时逃跑，在情况下，设置为心形。\n\n\
  ```java\npackage com.uppy.smod.ai;\nimport net.minecraft.entity.Creature;\nimport\
  \ net.minecraft.entity.ai.EntityIBase;\nimport net.minecraft.entity.ai.RandomPositionGenerator;\n\
  import net.minecraft.util.Vec3;\n\npublic class EntityIFleeOnHurt extends EntityIBase\n\
  {\n    private Creature theEntityCreature;\n    private double speed;\n    private\
  \ double randPosX;\n    private double randPosZ;\n\n    public EntityIFleeOnHurt(Creature\
  \ par1Creature, double par2)\n    {\n        this.theEntityCreature = par1Creature;\n\
  \        this.speed = par2;\n        this.setMutexBits(1);\n    }\n\n    /**\n \
  \    * 返回 EntityIBase 是否开始执行。\n     */\n    @Override\n    public boolean shouldExecute()\n\
  \    {\n        if (this.theEntityCreature.getHealth() > 4F)\n        {\n      \
  \      return false;\n        }\n        else\n        {\n            Vec3 vec3\
  \ = RandomPositionGenerator.findRandomTarget(this.theEntityCreature, 5, 4);\n  \
  \          if (vec3 == null)\n            {\n                return false;\n   \
  \         }\n        }\n    }\n}\n```\n\n\n\n\n\n```java\n            this.randPosX\
  \ = vec3.xCoord;\n            this.randPosY = vec3.yCoord;\n            this.randPosZ\
  \ = vec3.zCoord;\n            return true;\n        }\n    }\n}\n\n    /**\n   \
  \  * 执行单次性任务或开始执行连续任务\n     */\n    @Override\n    public void startExecuting()\n\
  \    {\n        this.theEntityCreature.getNavigator().tryMoveToXYZ(this.randPosX,\
  \ this.randPosY, this.randPosZ, this.speed);\n    }\n    /**\n     * 返回正在执行中的 EntityAIBase\
  \ 是否应该继续执行\n     */\n    @Override\n    public boolean continueExecuting()\n   \
