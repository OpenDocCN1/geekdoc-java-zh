  \n**图 12.3** Sam 在游戏中的瓷实体。\n\n### 总结\n在这一节中，你学习了如何创建一个带有瓷实体的方块。你还准确学习了什么是瓷实体，并制作了一个基础瓷实体，它能够循环切换其所在方块的纹理。之后，你学习了如何将你的瓷实体与服务器同步，以确保在启动或停止服务器时它能正常工作。你还学习了一种可以改变方块右键行为的方法。\n\
  \n### 问答\nQ 注册的瓷实体数量有最大限制吗？\n\nA 没有确切的最大限制，但减少已注册和世界中的瓷实体数量是明智的，因为它们会显著减慢服务器速度。\n\
  \nQ 如何为瓷实体添加 GUI？\n\nA 这极其困难，并且超出了本书的范围。要这样做，你需要注册一个 GUI 处理器、创建一个 GUI 并创建一个容器（container），以及许多其他工作。关于\
  \ GUI 和容器的更多信息可以在 [`www.minecraftforge.net/wiki/Containers_and_GUIs`](http://www.minecraftforge.net/wiki/Containers_and_GUIs)\
  \ 找到。\n\n### 工作坊\n在这一节中，你学习了如何制作 Minecraft 组中最复杂且实用的方面之一。瓷实体可以用于各种功能，从简单的纹理变化到熔炉或合成工作台。由于瓷实体既复杂又实用，因此理解它们至关重要。\n\
  \n### 测验\n1 为什么你不想在计数器的每次更新时都进行同步？\n\n2 重启游戏时 `counter` 和 `counterEnabled` 的值会保持不变吗？\n\
  \n### 答案\n1 这不仅慢，而且没用。\n\n2 会。在游戏结束时，它们会被保存，当你重启游戏时，它们会被再次读取。\n\n### 练习\n通过让玩家只有在按下\
  \ Shift 键蹲下时才关闭，让方块的右键操作更好。这可能看起来并不重要，但很有用，因为有时方块在放置后就会被右键点击。此外，大多数其他 Mod 都是这样做，遵循这种不成文规定通常是一个好主意。\n\
  \n要实现这一点，请编辑 `onBlockActivated` 方法并添加对玩家的额外检查。它看起来如下：\n\n```java\n@Override\npublic\
  \ boolean onBlockActivated(World world, int x, int y, int z, EntityPlayer player,\
  \ int side, float hitX, float hitY, float hitZ)\n{\n    TileEntity entity = world.getBlockEntity(x,\
  \ y, z);\n    if(entity != null)\n    {\n        if(entity instanceof Sam)\n   \
  \     {\n            Sam sam = (Sam) entity;\n            if(player.isSneaking())\n\
  \            {\n                if(!world.isRemote)\n                {\n       \
  \             sam.editCounter();\n                }\n                return true;\n\
  \            }\n        }\n    }\n    return false;\n}\n```\n\n\n\n\n如果你想更改变量、类或包名称——因为你拼写错了或想以不同的方式使用它——可以使用\
  \ Eclipse 中一个非常棒的功能。你只需将光标置于想要重名的变量、类或包上，然后按下 `Alt+Shift+R` 即可访问此功能。它会选中所有使用该变量、类或包的地方并同时更改所有出现。\n\
  \n***\n\n现在创建 `SamEventHandler` 类。它应该像列表 13.1 所示。\n\n**列表 13.1 初始 SamEventHandler**\n\
  \n点击此处查看代码图像\n\n***\n\n```java\npackage com.wuppy.samsmod;\n\npublic class SamEventHandler\n\
  \n{\n\n}\n```\n\n***\n\n### 添加世界生成代码\n\n当你创建了这个类后，你的 mod 文件中 `registerWorldGenerator`\
  \ 方法下方会出现一个错误。要修复这个问题，将鼠标悬停在错误上，并选择 `Let SamEventHandler Implement IWorldGenerator`（让\
  \ SamEventHandler 实现 IWorldGenerator）。\n\n执行此操作后，mod 文件中的错误消失了，但现在 `SamEventHandler`\
  \ 下方出现了一个错误，因为有你需要添加尚未实现的方法。添加这些未实现的方法后，该类应该像列表 13.2 所示。\n\n**列表 13.2 带有 IWorldGenerator\
  \ 的 SamEventHandler**\n\n点击此处查看代码图像\n\n***\n\n```java\npackage com.wuppy.samsmod;\n\
  \nimport java.util.Random;\n\nimport net.minecraft.world.World;\nimport net.minecraft.world.chunk.IChunkProvider;\n\
  import cpw.mods.fml.common.IWorldGenerator;\n\npublic class SamEventHandler implements\
