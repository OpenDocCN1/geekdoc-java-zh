  ### 注意：其他建模软件\n\nTechne 是唯一可以将模型导出为 Minecraft 代码格式的常用建模软件。然而，Forge 也允许你使用 `.obj`\
  \ 文件。大多数现代建模程序（包括 Blender 和 Maya）都支持这种扩展名。如果你使用 `.obj` 文件，则必须使用一个名为 `AdvancedModelLoader`\
  \ 的类来加载该模型。\n\n### 总结\n\n在本节中，你首先学习了 Minecraft 中的模型是什么以及你如何使用它们。接下来，你学习了 Techne，这是一个你可以在其中轻松创建模型的工具。你学习了如何安装\
  \ Techne、界面是如何工作的，以及如何使用它创建自己的模型。此外，你还将模型从 Techne 导出为 `.png` 和 `.java` 文件，你可以使用它们来为你的生物编写代码和制作纹理。\n\
  \n### 问答\n\n**问。模型立方体的数量有上限吗？**\n\n**答。** 没有上限，但当立方体更多时，渲染所需的时间更长，因此请尝试在性能和外观之间平衡。\n\
  \n**问。这种模型可以用于生物以外的其他用途吗？**\n\n**答。是的。它们也可以用于方块和物品。**\n\n### 工作坊\n\n在本节中，你学习了模型以及如何在\
  \ Techne 中创建它们。许多不同的 Mod 都使用模型，因此很好地理解这些非常重要。完成问答来测试你的理解程度。\n\n### 测验\n\n**1。为什么你必须使用\
  \ Techne？**\n\n**2。你需要从 Techne 导出什么？**\n\n### 答案\n\n**1。** 因为这样更简单。你可以手写模型，但那将花费非常长时间。Techne\
  \ 让你的模型可视化变得非常容易。\n\n**2。你需要导出纹理和代码。然而，不要忘记将模型保存为 `.techne` 文件，否则你以后将无法编辑它。**\n\n\
  ### 练习题\n\n编辑 `ModelBiped`，使其在身体中间只有一条腿。\n\n## 第 19 节 编写生物代码\n\n***\n\n你将在本节中学习到：\n\
  \n![Image](img/image00525.jpeg) 渲染生物\n\n![Image](img/image00525.jpeg) 让生物生成\n\n\
  ![Image](img/image00525.jpeg) 让 `EntitySamMob` 成为一个生物\n\n***\n\n在本节中，你将结合你在第 17\
  \ 节和第 18 节中所做的内容，分别是“关于实体”和“使用 Techne 创建实体模型”，来创建一个生物。本节涵盖了合并这些代码并添加更多内容，以使实体像生物一样工作。\n\
  \n要创建一个生物，必须创建很多类。首先，你需要一个 Mod 文件，你已经创建了。你还需要在第 17 节中创建的 `CommonProxy` 和 `ClientProxy`。此外，你还需要\
  \ `Entity`、`Model` 和 `Render` 类。本节涵盖了所有文件，从 `Model` 开始。\n\n### 渲染生物\n\n生物的一个非常重要的方面是它是可见的。为了实现这一点，你创建了\
  \ `Model` 和 `Render` 文件。你还向 `ClientProxy` 添加一行代码。\n\n### 完成模型类\n\n在第 18 节中，你在 Techne\
  \ 中创建了一个模型并从中导出了代码。现在是时候将此模型添加到你的工作区了。要这样做，在 Eclipse 中右键点击你的包并选择 New（新建）、Class（类）。该类名为\
  \ `ModelSamMob`。对于所有与同一生物相关的类使用非常相似的名字是一个好主意。在本节中创建的生物有 `EntitySamMob`、`ModelSamMob`\
  \ 和 `RenderSamMob` 作为它的类，你在整个节中创建了它们。这样，在 Mod 中有多个生物的情况下，很容易看出哪些类属于哪个生物。\n\n***\n\
  \n### 注意：关于 Techne\n\n你不被强制使用 Techne。自己编写模型是完全可以的。如果你这样做，必须编写所有的代码，这可能会花费大量时间。\n\
  \n***\n\n接下来，从导出的 `.java` 文件中复制代码并粘贴到 `ModelSamMob` 中。这段代码有很多问题。要修复所有问题，请按照以下列表操作：\n\
  \n![Image](img/image00525.jpeg) 移除顶部的注释。它没有添加添加，并且可能让你的类难以阅读。\n\n![Image](img/image00525.jpeg)\
  \ 修改包声明。导出的文件包名为 `net.minecraft.src`，你应该将其更改为该类所在的包。当你将鼠标悬停在它上面时，可以选择 Change Declaration（更改声明）将其更改为正确的包。\n\
  \n![Image](img/image00525.jpeg) 将类和构造函数的名称从 `Model` 改为 `ModelSamMob`，或者你的 `Model`\
  \ 文件的名称。你可以通过将鼠标悬停在 `Model` 下方的错误上并选择 Rename Type（重命名类型）来轻松完成这一点。\n\n![Image](img/image00525.jpeg)\
  \ 使用 `Ctrl+Shift+O` 或右键点击选择 Source（源）、Organize Imports（组织导入）导入所有使用的文件。\n\n***\n\n\
  ### 注意：Techne 并非完美\n\n与其他任何事物一样，Techne 并不完美。你的导出代码可能包含某些错误。如果你尝试使用比 Techne 创建的不同版本的导出代码，可能会遇到问题。\n\
  \n你可能想要检查的是 `[bodypart].mirror = true;` 是否在身体部分初始化之前使用。这有时会发生并导致崩溃。\n\n***\n\n该类现在看起来像列表\
  \ 19.1 且不再留有任何错误。\n\n**列表 19.1 完成的 ModelSamMob**\n\n点击此处查看代码\n\n***\n\n```java\n\
  package com.wuppy.samsmod.render;\n\nimport net.minecraft.client.model.ModelBase;\n\
  import net.minecraft.client.model.ModelRenderer;\nimport net.minecraft.entity.Entity;\n\
  \npublic class ModelSamMob extends ModelBase\n{\n    // fields\n    ModelRenderer\
  \ cap;\n    ModelRenderer head;\n    ModelRenderer body;\n    ModelRenderer rightarm;\n\
  \    ModelRenderer leftarm;\n    ModelRenderer rightleg;\n    ModelRenderer leftleg;\n\
