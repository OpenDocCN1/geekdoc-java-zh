  \ = 32;\n        cap = new ModelRenderer(this, 35, 0);\n        cap.addBox(-3F,\
  \ -10F, -3F, 6, 2, 6);\n        cap.setRotationPoint(0F, 0F, 0F);\n        cap.setTextureSize(64,\
  \ 32);\n        cap.mirror = true;\n        setRotation(cap, 0F, 0F, 0F);\n    \
  \    head = new ModelRenderer(this, 0, 0);\n        head.addBox(-4F, -8F, -4F, 8,\
  \ 8, 8);\n        head.setRotationPoint(0F, 0F, 0F);\n        head.setTextureSize(64,\
  \ 32);\n        head.mirror = true;\n    }\n}\n```\n\n\n\n\n***\n\n### 移动身体部位\n\n\
  一旦你完成了这一节，你将拥有一个功能完备的生物（mob）。它会走动并攻击敌人。当原版（vanilla）生物移动时，它们的腿（在某些情况下还有手臂）会移动。如果身体部位没有正确移动，这些生物在移动时看起来会非常奇怪。\n\
  \n因此，为了确保这个生物看起来不奇怪，当玩家移动时，身体部位应该旋转。你可以使用 `setRotationAngles`get 这一点。在这个方法中，你可以使用基础三角函数为每个身体部位设置旋转。\n\
  \n因为这个模型几乎与 `ModelBiped` 完全相同（后者用于玩家等普通实体），所以该类中的旋转逻辑可以很容易地复制到这里。`ModelBiped` 中的代码变量名略有不同，你需要将它们更改为\
  \ `ModelSamMob` 中的名称。你可以删除某些行，例如设置潜行或持弓等动作的旋转行，因为自定义的生物不需要执行这些操作。\n\n你还添加了两行代码。这两行代码确保了帽子（cap）的旋转方式与头部完全一致。这确保了帽子不会穿入头部。由于头部和帽子的旋转点相同，头部的旋转角度可以直接复制到帽子的旋转上。\n\
  \n`ModelSamMob` 中的 `setRotationAngles` 现在看起来应该像列表 19.2。\n\n**列表 19.2 添加到 ModelSamMob\
  \ 的 setRotationAngles**\n\n点击此处查看代码图像\n\n***\n\n\n\n\n\n```java\n        return\
  \ null;\n\n    }\n}\n```\n\n***\n\n将 `getEntityTexture` 中的 `null` 替换为以下代码：\n\n点击此处查看代码图片\n\
  \n```java\nnew ResourceLocation(SamsMod.MODID, \"textures/models/sammob.png\")\n\
  ```\n\n这将获取位于 `SamsMod` textures 文件夹中的纹理。在该文件夹中有一个名为 `textures` 的文件夹。在该文件夹内另一个名为\
  \ `models` 的文件夹——在这个文件夹中，放置上一小时内创建的生物纹理。在这种情况下，文件名为 `sammob.png`。在大多数情况下，最好在代码中为纹理命名与生物相同的名称。纹理看起来所示图\
  \ 19.1。\n\n![Image](img/image00641.jpeg)\n\n**图 19.1** 实体纹理。\n\n### 渲染生物\n\n现在 `Render`\
  \ 和 `Model` 类已经完成，这意味着你现在可以实际渲染该生物了。要做到这一点，请向 `ClientProxy` 中添加以下行代码：\n\n点击此处查看代码图片\n\
  \n```java\nRenderingRegistry.registerEntityRenderingHandler(EntitySamMob.class,\
  \ new RenderSamMob(new ModelSamMob(), 0.5F));\n```\n\n要注册一个生物，你必须访问 `RenderingRegistry`\
  \ 类。对于实体，所需的方法是 `registerEntityRenderingHandler`。该方法接受两个参数。第一个参数是它应该注册渲染的 `Entity`\
  \ 类。\n\n其次，它需要一个用于进行渲染的类。在这种情况下，该类是 `RenderSamMob`。`RenderSamMob` 同样接受两个参数。第一个参数是它应该渲染的模型，在本例中为\
  \ `ModelSamMob`。第二个参数是阴影大小。如果你将其调大，生物下方的阴影圆也会随之变大。`0.5F` 是类似于玩家模型的默认值。\n\n`ClientProxy`\
  \ 现在看起来应该像代码列表 19.5。\n\n**代码列表 19.5 带有 RenderingRegistry 的 ClientProxySam**\n\n\
  点击此处查看代码图片\n\n***\n\n```java\npackage com.wuppy.samsmod;\n\nimport cpw.mods.fml.client.registry.RenderingRegistry;\n\
  \npublic class ClientProxySam extends CommonProxySam\n{\n    @Override\n    public\
  \ void registerRendering()\n    {\n        RenderingRegistry.registerEntityRenderingHandler(EntitySamMob.class,\
  \ new RenderSamMob(new ModelSamMob(), 0.5F));\n    }\n}\n```\n\n尽管你没有向 `CommonProxy`\
  \ 中添加任何代码，但不要将其删除，因为没有它，`ClientProxy` 将无法工作。\n\n### 让生物生成\n\n让生物生成有两种方法。一种是生物蛋，它允许你通过物品生成生物；另一种是自然生成，它能确保（例如）牛会在草地上行走。\n\
  \n### 添加生物蛋\n\n为你的每一个生物都提供一个生物蛋是明智的。这会让测试变得容易得多。在某些情况下它也能帮助用户。然而，生物蛋最好的部分是它只需要很少的代码，而且不会使用任何新物品。新的生物蛋会被添加到原版的生物蛋中。\n\
  \n要将你的生物添加到生物蛋中，请在 mod 类中添加以下代码：\n\n点击此处查看代码图片\n\n```java\nstatic int startEntityId\
  \ = 300;\n\n@SuppressWarnings(\"unchecked\")\npublic static void registerEntityEgg(Class<?\
  \ extends Entity> entity, int primaryColor, int secondaryColor)\n{\n    int id =\
  \ getUniqueEntityId();\n    EntityList.IDtoClassMapping.put(id, entity);\n    EntityList.entityEggs.put(id,\
  \ new EntityEggInfo(id, primaryColor, secondaryColor));\n}\n\npublic static int\
  \ getUniqueEntityId()\n{\n    do\n    {\n        startEntityId++;\n    }\n    while\
  \ (EntityList.getStringFromID(startEntityId) != null);\n}\n```\n\n\n\n\n\n点击此处查看代码图像\n\
  \n```java\npackage com.wuppy.samsmod;\n\nimport net.minecraft.entity.monster.EntityMob;\n\
  \nimport net.minecraft.world.World;\n\npublic class EntitySamMob extends EntityMob\n\
  {\n    public EntitySamMob(World par1World)\n    {\n        super(par1World);\n\
  \    }\n}\n```\n\n你可以使用 `EntityMob` 执行很多事情。虽然要涵盖实体的所有可能是不可能的，但接下来的章节涵盖了一些最重要的部分。\n\
  \n### 为生物添加 AI\n\nMinecraft 包含许多 `EntityAI` 类，你可以使用这些类来让你的生物移动得更加自然。一个生物可以有许多不同的\
  \ `EntityAI` 类供其选择；可以给它分配一个数字，告诉生物在何时使用哪一个。数字越小，它执行某项 AI 的概率就越高。例如，僵尸通常会在周围游荡，但一旦它们有了要攻击的目标玩家，这种行为就不再发生了。在相同的数字下也可能存在两个不同的\
  \ AI——此时，生物可能会根据 `AI` 类中的检查结果执行其中某一个。例如，僵尸通常会环顾四周，但一旦目标玩家靠近，它就会看向玩家。这两个 `EntityAI`\
  \ 选项的数字是相同的，但在任何给定时间只能发生其中一个。列表 19.7 包含了 `EntitySamMob` 的 `AI`。\n\n**代码列表 19.7 EntitySamMob\
  \ AI 代码**\n\n点击此处查看代码图像\n\n```java\npublic EntitySamMob(World par1World)\n{\n  \
  \  super(par1World);\n    this.getNavigator().setBreakDoors(true);\n    this.tasks.addTask(0,\
  \ new EntityAISwimming(this));\n    this.tasks.addTask(2, new EntityAIAttackOnCollide(this,\
  \ EntityPlayer.class, 1.0D, false));\n    this.tasks.addTask(3, new EntityAIWander(this,\
  \ 1.0D));\n    this.tasks.addTask(4, new EntityAIWatchClosest(this, EntityPlayer.class,\
  \ 8.0F));\n    this.tasks.addTask(4, new EntityAILookIdle(this));\n    this.targetTasks.addTask(1,\
  \ new EntityAIHurtByTarget(this, true));\n    this.targetTasks.addTask(2, new EntityAINearestAttackableTarget(this,\
  \ EntityPlayer.class, 0, true));\n}\n```\n\n这段代码包含三个不同的部分。首先，有一行关于破坏门的代码。这仅仅是确保了\
  \ Sam 的生物在追逐玩家时可以像僵尸一样破坏门。\n\n其次，有五个 `AI` 任务。优先级为 0（最高）的是 `EntityAISwimming`。如果这个任务不是优先级\
  \ 0，生物可能会溺死，因为它在水里会执行其他事情。这个 `AI` 只在生物处于水中时运行，所以它不会影响在陆地上的行为。\n\n第三，是 `AttackOnCollide`，它接受四个参数。第一个参数是\
  \ `this`，然后是它应该攻击的实体、攻击速度，最后是 `false`。这个 `AI` 不会让实体朝目标实体移动，而只会在与实体碰撞时伤害玩家。\n\n如果它不需要游泳或在碰撞时伤害玩家，它就会使用\
  \ `EntityAIWander` 随机走动。它还会使用 `EntityAIWatchClosest` 查看最近的目标，或者只是使用 `EntityAILookIdle`\
  \ 环顾四周。\n\n最后的新新点是 `targetTasks`。这些任务实际上告诉实体应该向哪个方向移动。它通常将 `EntityAIHurtByTarget`\
  \ 作为第一个任务。之后，可以多次使用 `EntityAINearestAttackableTarget`。某些生物只攻击玩家，而其他生物会攻击玩家、村民等。在这种情况下，只有当\
  \ `EntityPlayer` 足够近时，它才会追逐。\n\n这里有很多不同的 `EntityAI` 类，你也可以创建自己的。此外，你还可以以不同的方式组合它们，让生物的行为产生不同差异。\n\
