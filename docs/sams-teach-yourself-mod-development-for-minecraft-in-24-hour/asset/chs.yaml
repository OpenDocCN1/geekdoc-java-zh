  ***\n\n## 第 12 小时。创建方实体（Tile Entity）\n\n***\n\n### 本小时你将学习到：\n\n![Image](img/image00525.jpeg)\
  \ 理解方实体\n![Image](img/image00525.jpeg) 创建方实体\n![Image](img/image00525.jpeg) 创建另一个方实体\n\
  ![Image](img/image00525.jpeg) 服务器同步\n\n***\n\n在本小时中，你将学习如何制作方实体。尽管名称中包含“实体（Entity）”，但方实体实际上可以被看作一个区块。首先，你需要了解什么是方实体，因为它非常复杂。在了解什么是方实体之后，就是时候使用并创建一个基础的方实体了。\n\
  \n### 理解什么是方实体\n\nMinecraft 中的方实体可以被视为一种实体，它与所在的区块占据相同的位置。方实体可以存储有关区块的额外信息，还可以打开界面、持有物品以及许多其他功能。\n\
  \n方实体可以被认为是 Minecraft 最难的部分之一。如果不计算世界生成或所有内容在屏幕上的显示方式，方实体是最复杂的。因为它们很复杂，所以也具有极高的自定义性。你基本上可以使用方实体做任何事情。很多\
  \ Mod 都使用它们来实现某些有趣的行为。例如多区块结构（multiblock structure），即多个区块协作完成单项任务。另一个例子可以是制作传输液体或能量的管道。\n\
  \n所有这些示例以及泛指的方实体存在的问题是，它们过于复杂且具体，无法进行恰的解释。由于方实体重要且常见，拥有基础的理解至关重要。虽然方实体的复杂性超出了本书的范围，但本小时涵盖了如何创建方实体的基础代码。\n\
  \n你在本小时中创建的方实体非常简单。该区块有 10 个纹理。所有纹理都是黑色的，上面有一个从 0 到 9 的白色数字。方实体每秒更新一次纹理。尽管这听起来非常简单，但这项任务需要大量的工作。\n\
  \n### 创建方实体区块\n\n要创建一个作为方实体的区块，你首先需要一个基础区块。在本小时中创建的方实体代码如下：\n\n```java\npublic static\
  \ Block samTE;\n```\n\n此外，将此代码添加到 `preInit` 方法中：\n\n```java\nsamTE = new BlockSamTE();\n\
  GameRegistry.registerBlock(samTE, \"SamTE\");\n```\n\n当你添加这些后，`BlockSamTE` 下会出现一个错误，你可以通过创建文件来修复。在添加\
  \ `BlockSamTE` 类后，进行简单的清理并添加最基础的构造函数以移除所有错误，该类看起来应该像列表 12.1。\n\n**列表 12.1 基础 BlockSamTE\
  \ 类**\n\n```java\npackage com.wuppy.samsmod;\n\nimport net.minecraft.block.Block;\n\
