  \ z)\n{\n    return plant;\n}\n\n@Override\npublic int getPlantMetadata(IBlockAccess\
  \ world, int x, int y, int z)\n{\n    return 0;\n}\n```\n\n这些方法中没有是直接用于植物的，但某些模组可能会使用它们，因此添加这段代码是重要的。现在是时候让种子在右键点击时真正生长了。实现该功能的方法如下所示：\n\
