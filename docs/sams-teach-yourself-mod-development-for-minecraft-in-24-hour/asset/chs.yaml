  \n### 总结\n在本节中，你学习了如何结合前几节创建的类和资源来创建一个功能完备的实体。到目前，你应该已经知道如何将模型导入 Minecraft，并对身体部位有了基本的理解。你还学习了如何创建一个基础的\
  \ `Render` 类，以及如何确保 Minecraft 使用 `Model` 和 `Render` 类来渲染你的实体。最后，你学习了如何使用 `AI`、属性和掉落物来自定义你的实体。\n\
  \n### 问答\n\n**Q**: 每次生物死亡时，可以掉落多个一个物品或方块吗？\n**A**: 可以的。但是，要实现这一点，你必须找到调用 `getDropItem`\
  \ 的方法，重写它并添加第二个物品。\n\n**Q**: 还有其他类型的实体吗？\n**A**: 是的。还有投掷物实体（throwables），它们将在下一节中介绍，此外还有像牛之类的实体。它们的工作方式与本节介绍的生物非常相似，但你必须更改\
  \ `EnumCreatureType`，并将扩展类从 `Mob` 改为 `Animal`。\n\n**Q**: 通常情况下，Minecraft 编程需要大量的数学知识，特别是三角函数吗？\n\
  **A**: 不需要，在为 Minecraft 模组时不需要那么多数学。只有在进行旋转和自定义渲染时才需要数学。\n\n### 工作坊\n在本节中，你学习了实体和生物的编码。实体对于大多数模组来说非常重要，因为你可以用它们做很多事情。使用测验确保你完全理解了这些主题。\n\
  \n### 测验\n**Q**: `EntityAI` 之前的数字起什么作用？\n**A**: 它设置 `AI` 的优先级；数字越小，运行的可能性越高。\n**Q**:\
  \ 如果不为实体属性赋值会发生什么？\n**A**: 它将使用默认值。\n\n### 练习题\n通过编辑其中一个实体属性来更改生物的速度。你可以将此代码添加到\
  \ `applyEntityAttributes` 方法中：\n\n```java\nthis.getEntityAttribute(SharedMonsterAttributes.movementSpeed).setBaseValue(1.0D);\n\
  ```\n\n## 第 20 小节：创建一个投掷物\n\n本节你将学习：\n- 注册一个投掷物实体\n- 创建 `Entity` 类\n- 使用该实体\n- 渲染实体\n\
  \n在本节中，你再次创建了一个实体。然而，这一次，这个实体不会没有玩家影响的情况下移动和工作，而是由玩家投掷。这听起来可能相当复杂，但 Minecraft 已经有了投掷物，例如雪球，所以大部分代码已经为你写写了。\n\
  \n### 注册投掷物实体\n在创建新的实体文件之前，你必须像注册生物一样注册它。以下代码在 `EntitySamThrowable` 下方有一个错误，必须被添加到\
  \ `preInit` 方法中：\n\n```java\nEntityRegistry.registerModEntity(EntitySamThrowable.class,\
  \ \"samthrow\", 1, this, 80, 3, true);\n```\n由于投掷物不会正常生成，因此该实体不需要添加 `addSpawn`。\n\
  \n### 注意：实体注册数字\n`registerModEntity` 的第三个参数是你注册的实体的 ID。如你所知，这个 ID 对于每个模组都是唯一的，这意味着不同的模组可以拥有\
  \ ID 为 0 的实体。但是，你不能在同一个模组中使用两次相同的 ID，所以如果你不想遇到问题，请确保每个实体的 ID 都是不同的。\n\n### 创建实体类\n\
  现在将鼠标悬停在 `EntitySamThrowable` 上并选择“创建类”（Create Class）。`列表 20.1` 显示了生成的类。\n\n```java\n\
  package com.wuppy.sams;\npublic class EntitySamThrowable {}\n```\n\n现在让这个类继承 `EntityThrowable`。在完成操作并导入\
  \ `EntityThrowable` 后，它要求你添加构造函数。有三个选择，你必须全部添加。你还必须添加未实现的方法 `onImpact`。在添加这些之后，`EntitySamThrowable`\
  \ 看起来像 `列表 20.2`。\n\n```java\npackage com.wuppy.samsmod;\n\nimport net.minecraft.entity.EntityLivingBase;\n\
  import net.minecraft.entity.projectile.EntityThrowable;\nimport net.minecraft.util.MovingObjectPosition;\n\
  import net.minecraft.world.World;\n\npublic class EntitySamThrowable extends EntityThrowable\
  \ {\n\n    public EntitySamThrowable(World par1World) {\n        super(par1World);\n\
  \    }\n\n    public EntitySamThrowable(World par1World, EntityLivingBase par2EntityLivingBase)\
  \ {\n        super(par1World, par2EntityLivingBase);\n    }\n\n    public EntitySamThrowable(World\
  \ par1World, double par2, double par4, double par6) {\n        super(par1World,\
  \ par2, par4, par6);\n    }\n\n    @Override\n    protected void onImpact(MovingObjectPosition\
  \ position) {\n\n    }\n}\n```\n\n\n\n第一个数字确保实体以合理的速度下落。另外两个数字与实体的旋转有关。\n\n你可以通过重写\
  \ `EntityThrowable` 中的方法来编辑可投掷物的细节，但本书中只使用了 `onImpact`，这在几乎所有情况下都是你需要的。\n\n正如其名所示，`onImpact`\
  \ 是一个在投掷物与方块等物体发生碰撞时运行的方法。你可以添加代码来让投掷物变得独一无二。你在这一小时内创建的投掷物非常简单。当它与方块碰撞时，会发生爆炸。首先，添加基础的\
  \ `onImpact` 代码，该方法看起来如下：\n\n```java\n@Override\nprotected void onImpact(MovingObjectPosition\
  \ position)\n{\n    if (!this.worldObj.isRemote)\n    {\n        this.setDead();\n\
  \    }\n}\n```\n\n首先，有一个检查确保大括号内的代码只在服务器上运行。这是始终要求的，因为 `this.setDead()` 应该只在服务器上调用。\n\
  \n在投掷物被杀死之前，它必须创建一个爆炸。通过在 `this.setDead()` 之前的 `if` 语句中添加以下行来实现：\n\n```java\nworldObj.newExplosion(this,\
  \ position.blockX, position.blockY, position.blockZ, 3F, true, true);\n```\n\n第一个参数是爆炸的实体。接下来的三个是碰撞方块的\
  \ `x`、`y` 和 `z` 位置。`3F` 是爆炸的威力。这个值越大，破坏的方块就越多。最后两个布尔值分别决定爆炸是否包含火焰和烟雾。\n\n***\n\n\
  ### 动手尝试一下：创建一个大型随机爆炸\n\n创建一个带有某种随机性的大型爆炸。确保它的力量在 5 到 7 之间。\n\n以下代码应该实现此功能：\n\n\
  ```java\nworldObj.newExplosion(this, position.blockX, position.blockY, position.blockZ,\
  \ 5 + rand.nextInt(3), true, true);\n```\n\n***\n\n`EntitySamThrowable` 现在看起来应该像\
  \ Listing 20.3 所示。\n\n**列表 20.3 EntitySamThrowable 完成**\n\n***\n\n```java\npackage\
  \ com.wuppy.samsmod;\n\nimport net.minecraft.entity.EntityLivingBase;\nimport net.minecraft.entity.projectile.EntityThrowable;\n\
  import net.minecraft.util.MovingObjectPosition;\nimport net.minecraft.world.World;\n\
  \npublic class EntitySamThrowable extends EntityThrowable\n{\n    public EntitySamThrowable(World\
  \ par1World)\n    {\n        super(par1World);\n    }\n    public EntitySamThrowable(World\
  \ par1World, EntityLivingBase par2EntityLivingBase)\n    {\n        super(par1World,\
  \ par2EntityLivingBase);\n    }\n    public EntitySamThrowable(World par1World,\
  \ double par2, double par4, double par6)\n    {\n        super(par1World, par2,\
  \ par4, par6);\n    }\n    @Override\n    protected void onImpact(MovingObjectPosition\
  \ position)\n    {\n        if (!this.worldObj.isRemote)\n        {\n          \
  \  worldObj.newExplosion(this, position.blockX, position.blockY, position.blockZ,\
  \ 5 + rand.nextInt(3), true, true);\n            this.setDead();\n        }\n  \
  \  }\n    @Override\n    protected float getGravityVelocity()\n    {\n        return\
  \ 0.07F;\n    }\n    @Override\n    protected float func_70182_d()\n    {\n    \
  \    return 0.7F;\n    }\n    @Override\n    protected float func_70183_g()\n  \
  \  {\n        return -20.0F;\n    }\n}\n```\n\n***\n\n### 使用该实体\n\n现在，投掷物已经完成并准备好使用了，但还没有方法可以生成它或以任何方式测试它。这个投掷物将由物品生成。为了实现这一点，必须创建一个新物品。你可以通过向类中添加以下行来实现：\n\
  \n```java\npublic static Item samthrow;\n```\n\n以及 `preInit` 方法：\n\n```java\nsamthrow\
  \ = new Item();\nGameRegistry.registerItem(samthrow, \"Throwable\");\n```\n\n`samthrow`\
  \ 变量已注册。你可以通过创建 `Item` 类来修复这个问题：\n\n```java\npackage com.wuppy.samsmod;\n\nimport\
  \ net.minecraft.creativetab.CreativeTabs;\nimport net.minecraft.item.Item;\n\npublic\
  \ class ItemThrow extends Item\n{\n    public ItemThrow()\n    {\n        setCreativeTab(CreativeTabs.tabSpawn);\n\
  \        setLocalizedName(MODID + \":Throwable\");\n        setTextureName(MODID);\n\
  \    }\n}\n```\n\n`en_US.lang` 文件中的本地化内容如下：\n\n```text\nitem.samthrow=Sam Throwable\n\
  ```\n\n### 让物品可以投掷\n\n在 Minecraft 中，物品在右键点击时会被投出。要实现这一点，你使用 `onItemRightClick` 方法。为了让这个物品正常投掷，当右键点击时，应该移除\
  \ `ItemStack` 中的一个物品，但前提是玩家不在创造模式下。`onItemRightClick` 的代码如下：\n\n```java\n@Override\n\
  public ItemStack onItemRightClick(ItemStack par1ItemStack, World par2World, EntityPlayer\
  \ par3EntityPlayer)\n{\n    if (!par3EntityPlayer.capabilities.isCreative)\n   \
  \ {\n        par1ItemStack.stackSize--;\n    }\n    return par1ItemStack;\n}\n```\n\
  \n除了减少 `ItemStack` 之外，如果能实际生成实体也将很有用。为了添加代码，必须进行检查以确保实体在服务器上生成，这是通过 `World` 中的 `isRemote`\
  \ 变量实现的。在确保方法只在服务器上运行后，需要使用 `spawnEntityInWorld` 生成实体。整个 `onItemRightClick` 应该如下：\n\
  \n```java\n@Override\npublic ItemStack onItemRightClick(ItemStack par1ItemStack,\
  \ World par2World, EntityPlayer par3EntityPlayer)\n{\n    if (!par3EntityPlayer.capabilities.isCreative)\n\
  \    {\n        par1ItemStack.stackSize--;\n    }\n    if (!par2World.isRemote)\n\
  \    {\n        par2World.spawnEntityInWorld(new EntitySamThrowable(par2World, par3EntityPlayer));\n\
  \    }\n    return par1ItemStack;\n}\n```\n\n之前创建的 `EntitySamThrowable` 两个参数确保了它在正确的位置生成。\n\
  \n### 渲染实体\n\n现在当你右键点击物品时，会生成一个白框。为了让它看起来像被投出的物品，需要一个 `Render` 类。\n\n\n\n\n幸运的是，Minecraft\
  \ 有一个名为 `RenderSnowball` 的类，它能够按照雪球应有的方式渲染投掷物。然而，这里有一个小问题：`RenderSnowball` 接收一个物品参数，即投掷物要渲染成的物品。到目前为止，渲染是在\
  \ `registerRendering` 方法中完成的，该方法在 `preInit` 阶段开始时被调用。然而，此时，所需的物品 `samthrow` 尚未初始化，因此为\
  \ `null`，这会导致崩溃。为了修复这个问题，你在 `Common` 和 `Client` 代理中都添加第二个方法。你还必须在 mod 类中调用此方法。在初始化并注册物品之后，在\
  \ `preInit` 方法中添加以下行是非常关重要的：\n\n```\nproxy.registerItemRenders();\n```\n\n带有新方法后，`CommonProxy`\
  \ 看起来类似于 列表 20.6。\n\n**列表 20.6 带有 registerItemRenders 方法的 CommonProxySam**\n\n点击此处查看代码图像\n\
  \n* * *\n\n```java\npackage com.wuppy.samsmod;\n\npublic class CommonProxySam\n\
  {\n    public void registerRendering()\n    {\n    }\n    public void registerItemRenders()\n\
  \    {\n    }\n}\n```\n\n* * *\n\n`ClientProxy` 看起来类似于 列表 20.7。\n\n**列表 20.7 带有新方法的\
  \ ClientProxySam**\n\n点击此处查看代码图像\n\n* * *\n\n```java\npackage com.wuppy.samsmod;\n\
  \nimport net.minecraft.client.renderer.entity.RenderSnowball;\nimport cpw.mods.fml.client.registry.RenderingRegistry;\n\
  \npublic class ClientProxySam extends CommonProxySam\n{\n    @Override\n    public\
  \ void registerRendering()\n    {\n            RenderingRegistry.registerEntityRenderingHandler(EntitySamMob.class,\
  \ new RenderSamMob(new ModelSamMob(), 0.5F));\n    }\n    @Override\n    public\
  \ void registerItemRenders()\n    {\n            RenderingRegistry.registerEntityRenderingHandler(EntitySamThrowable.class,\
  \ new RenderSnowball(SamsMod.samthrow));\n    }\n}\n```\n\n* * *\n\n投掷物的 `RenderingRegistry`\
  \ 已经添加。它接收两个参数：首先是将被渲染的 `Entity` 类，第二个是渲染该实体的 `Render` 类。在这种情况下，`Render` 类是 `RenderSnowball`，它需要一个参数，即它看起来像的物品。现在当你启动游戏并投出其中一个实体时，它将看起来是应有的样子。\n\
  \n投掷物品看起来应该像 图 20.2。\n\n![图像](img/image00645.jpeg)\n\n**图 20.2** 游戏中的投掷物品。\n\n图\
  \ 20.3 显示了右键点击投掷物品时发生的情况，这会生成实体。\n\n![图像](img/image00646.jpeg)\n\n**图 20.3** 游戏中的投掷实体。\n\
  \n一旦 图 20.3 中的实体接触地面，就会发生类似 图 20.4 所示的情况。\n\n![图像](img/image00647.jpeg)\n\n**图 20.4**\
  \ 结果。\n\n### 总结\n\n在本节中，你学习了如何创建投掷物。你学习了 `Entity` 类、如何使用 `onRightClick` 生成实体，最后如何进行渲染。你还学习了在\
  \ Minecraft 中添加物品，因此 `onRightClick` 等方法是非常重要的。\n\n### 问答\n\n**问：为什么使用 `RenderSnowball`\
  \ 而不是自定义的？**\n答：`RenderSnowball` 已经按照它应有的方式渲染了。\n\n**问：`RenderingRegistry` 是如何工作的？**\n\
  答：它在客户端中处理渲染。\n\n**问：如果你在服务器端添加了 `RenderingRegistry` 会发生什么？**\n答：游戏会崩溃。\n\n### 练习\n\
  \n在本节中，你学习了如何处理投掷物。\n\n### 验\n\n**问：为什么在服务器端要检查这一点？**\n答：因为渲染是在客户端处理的。\n\n**问：如果你添加了\
  \ `RenderingRegistry` 会发生什么？**\n答：这会抛出空指针异常。\n\n### 答案\n\n修改 `onRightClick` 以让它不会生成：\n\
  \n```java\n@Override\npublic ItemStack onItemRightClick(ItemStack par1ItemStack,\
  \ World par2World, Entity par3Player)\n{\n    if (par3Player.capabilities.isCreative)\n\
  \    {\n        par1ItemStack.stackSize--;\n    }\n    if (!par2World.isRemote)\n\
  \    {\n        par2World.spawnEntityIn(SamThrowable);\n    }\n    return par1ItemStack;\n\
  }\n```\n\n\n\n\n`removeSpawn` 是 `EntityRegistry` 中的一个方法，接受三个参数。第一个是必须移除的实体。第二个是该实体的类型，第三个是它必须被移除的生物群系（biome）。由于这段代码会遍历所有可能的生物群系，`EntityZombie`\
  \ 将从游戏中完全移除。如果你想修改僵尸的某些特性，这会非常有用。某些特性可以使用 Forge 事件进行编辑，但如果无法实现，你可以使用这段代码移除一个生物实体，然后在原来的位置添加你修改后的实体。\n\
  \n## 在不替换的情况下更改实体\n\n在不需要将其替换为自定义实体的情况下更改实体行为的一个示例，是使用一个名为 `LivingDropsEvent` 的\
  \ Forge 事件，它可以让实体在死亡时掉落新的物品或方块。\n\n在之前的一个小时节中，为世界生成创建了一个 `EventHandler`。要将此类注册为调用此类事件的类，请在\
  \ `preInit` 方法的末尾添加以下行代码：\n\n```\nMinecraftForge.EVENT_BUS.register(handler);\n\
  ```\n\n这使得处理器（一个 `SamEventHandler` 实例）能够与如 `LivingDropsEvent` 等事件进行交互。\n\n在 `SamEventHandler`\
  \ 类中，你可以添加如下所示的方法：\n\n```java\n@SubscribeEvent\npublic void addDrops(LivingDropsEvent\
  \ event)\n{\n\n}\n```\n\n对于任何没有使用如 `IWorldGenerator` 接口实现的事件，上方都必须使用 `@SubscribeEvent`。这些方法可以有任何方法名称，但始终只能有一个参数，即你想要使用的事件。在这种情况下，事件是\
  \ `LivingDropsEvent`，它用于在僵尸死亡时掉落 Sam 的靴子（Sam’s Boots），但也可以用于任何类型的实体、物品或方块。\n\n```java\n\
  @SubscribeEvent\npublic void addDrops(LivingDropsEvent event)\n{\n    if(event.entity\
  \ instanceof EntityZombie)\n        event.drops.add(new EntityItem(event.entity.worldObj,\
  \ event.entity.posX, event.entity.posY, event.entity.posZ, new ItemStack(SamsMod.samboots)));\n\
  }\n```\n\n`LivingDropsEvent` 有几个必须包含在此处的对象。首先，它有一个名为 `entity` 的对象，可以用于检查杀死的是哪种实体以及该实体所在的位置。`LivingDropsEvent`\
  \ 还有一个名为 `drops` 的对象，它是一个 `EntityItem` 数组，包含了实体对象死亡时应该掉落的物品和方块。要添加掉落物，使用 `drops.add`。它需要一个参数：`EntityItem`。\n\
  \n`EntityItem` 是一个接受五个参数的类：首先是世界，可以通过访问实体中的 `worldObj` 来传递。接下来的三个参数是 `EntityItem`\
  \ 应掉落的位置。你可以通过实体对象中的 `posX`、`posY` 和 `posZ` 找到这些位置。最后一个参数是要掉落的物品的 `ItemStack`。在这种情况下，新的\
  \ `ItemStack` 是 Sam 的靴子。\n\n### 尝试一下：随机化掉落\n\n将僵尸死亡时的掉落随机化。让它每 10 次才掉落一次 Sam 的靴子。再添加第二个随机掉落物，使其每\
  \ 15 次掉落一次 Sam 的头盔（Sam’s Helmet）。你需要的 `Random` 对象可以在 `World` 中找到。\n\n首先，在之前显示的代码中创建一个\
  \ `if` 语句。这个 `if` 语句应该包含 `rand.nextInt(10)`，这意味着有 10 种选择。然后，应该检查它是否等于 0，使得该语句内的代码每\
  \ 10 次运行一次。\n\n接下来，在之前显示的 `events.drops.add` 行前添加一个制表符，确保这段代码位于你刚刚编写的 `if` 语句内。\n\
  \n现在，在你创建的那个 `if` 语句下方添加另一个 `if` 语句，但位于 `instanceof EntityZombie` 语句内部。这应该包含一个 `rand.nextInt(15)`，使其发生的概率更低。\n\
  \n最后，复制 `samboots` 掉落的代码，将其粘贴到 `if` 语句中并将其改为 `samhelmet`。\n\n以下代码应为你的结果：\n\n```java\n\
  @SubscribeEvent\npublic void addDrops(LivingDropsEvent event)\n{\n    if(event.entity\
  \ instanceof EntityZombie)\n        if(event.entity.worldObj.rand.nextInt(10) ==\
  \ 0)\n            event.drops.add(new EntityItem(event.entity.worldObj, event.entity.posX,\
  \ event.entity.posY, event.entity.posZ, new ItemStack(SamsMod.samboots)));\n   \
  \     if(event.entity.worldObj.rand.nextInt(15) == 0)\n            event.drops.add(new\
