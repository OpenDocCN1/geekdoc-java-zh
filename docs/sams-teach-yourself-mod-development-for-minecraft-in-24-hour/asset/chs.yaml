  \n### 总结\n\n在本小时中，你学习了许多关于自定义区块的知识。首先，你学习了如何根据区块的侧面显示不同的纹理。之后，你制作了半块和特殊形状的区块。最后，你创建了到目前为止最困难的区块——植物。这种植物只在光照下生长，并且只能放置在土壤或草地上。它被破坏时会掉落浆果和种子。\n\
  \n### 问答\n\n**Q. 游戏中可以添加的植物数量有上限吗？**\n\n**A.** 植物被视为普通区块，因此适用相同的最大数量限制。\n\n**Q.\
  \ 还有其他可能的自定义方式吗？**\n\n**A.** 当然有。了解如何自定义你的区块有两种方法：首先是查看 `Block` 类，可以在其中找到许多有趣的自定义方法。或者，查看一个已存在的原版区块（vanilla\
  \ block）的代码，看看它是如何被编码的。\n\n### 工作坊\n\n在本小时中，你学习了如何为你的区块创建许多特定的内容。了解如何自定义它们非常重要，因为这让你的\
  \ Mod 变得独特且实用。请通过以下工作坊来确保你理解了这些自定义内容。\n\n### 测验\n\n**1. 为什么作物不需要 `ItemBlock` 文件？**\n\
  \n**2. 你将如何增加作物的生长速度？**\n\n### 答案\n\n**1.** 因为作物在放置时元数据始终为 0，所以实际上并不需要 `ItemBlock`\
  \ 文件。\n\n**2.** 你可以通过编辑 `updateTick` 方法来实现。\n\n### 练习题\n\n修改植物的掉落逻辑，使其在掉落所有现有物品的同时，总是也会掉落一个金苹果。\n\
  \n列表 11.10 显示了实现该功能所需的代码。\n\n**列表 11.10 带有金苹果的掉落物**\n\n点击此处查看代码图像\n\n***\n\n```java\n\
