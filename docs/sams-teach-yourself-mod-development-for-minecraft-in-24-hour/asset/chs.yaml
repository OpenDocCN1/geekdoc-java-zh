  \ 工作坊\n\ncontent)\n\n\n\n\n\n\n\n\n\n\n\n## 生成粒子\n\n\n## 关于作者\n\n`Jimmy Koene` 维护着世界上最流行的\
  \ Minecraft Mod 网站之一（[www.wuppy29.com/minecraft/modding-tutorials/forge-modding/](http://www.wuppy29.com/minecraft/modding-tutorials/forge-modding/)）。他是极少数持续维护并更新在线教程的\
  \ Minecraft Mod 制作者之一。他还是一名资深的 `Java` 和 `C++` 程序员，编写过一个下载量超过 30,000 次的安卓 Minecraft\
  \ 应用以及其他各种小型应用。他还维护了几个涵盖 Minecraft 许多方面的 Mod，范围从对食物运作方式的微调到完全改变游戏体验的 Mod。\n\n##\
  \ 献辞\n\n致 Minecraft Mod 社区，让 Minecraft 成为最畅销且最神奇的游戏之一。感谢让我开始制作 Mod 的社区，是他们促成了本书的诞生。\n\
  \n## 谢谢\n\n首先，我要感谢 `Rick Kughen`，是他主动找我提议写一本关于 Minecraft Mod 开发的书。在他给我发邮件并分享他的想法之前，我从未想过这是可能的。开发像\
  \ Minecraft 这样游戏的 Mod，面临的最大问题之一就是你正在处理的代码会不断变化。Minecraft 或 `Forge`（本书中所使用的应用程序编程接口\
  \ `API`）的每一次更新都可能改变大量的代码。幸运的是，电子书可以很容易地更新，`Rick Kughen` 告诉我可以有一个在线数据库，让我可以频繁地为书籍添加更新和更改。这使得这本书的编写成为可能。\n\
  \n我应该感谢的其他还包括创建 Minecraft 的 `Markus “Notch” Persson`。没有他的创意，我永远不会开始编程，这本书也永远写不出来。还有很多人帮助创建了\
  \ Minecraft 和 Mod 社区，他们包括 `Jeb`、`Dinnerbone`、`Searge`、`ProfMobius`、`R4wk`、`CodeWarrior`、`ZeuX`、`Risugami`、`cpw`、`AbrarSyed`\
  \ 和 `LexManos`。他们是 `MCP`、`MCEdit`、`Techne`、`ModLoader` 和 `Forge` 的创建者。本书中（间接）使用了所有工具。最后，我要感谢编辑\
  \ `Mark Renfrow` 和 `Rick Kughen`、审稿员以及其他参与任何书籍相关工作的所有人。没有这些人，这本书就不可能完成。我特别想感谢 `Forge`\
  \ 的创建者 `LexManos`，他在该领域的专业知识提供了很大帮助。\n\n## 我们想听听你的声音！\n\n作为本书的读者，我们非常重视你的意见，并想知道你喜欢或不喜欢的地方，以及我们可以做得更好的地方。\n\
  \n每一小时都涵盖了 Minecraft Mod 开发的一个重要方面，包括各种物品、方块和实体。通过跟随每一小时的进度、积极参与“动手试一”活动，并完成每小时结束的工作坊和练习，你将从这些主题中学到很多知识。你还将获得关于如何使用开发环境的信息、自学方法，以及贯穿书中各处的“笔记”和“提示”提供的许多其他主题。\n\
  \n邮箱：consumer@amsublishing.com (mailto:consumer@amsublishing.com)\n邮寄：Sams Publishing,\
  \ ATTN: Reader Feedback, 800 East 96th Street, Indianapolis, IN 46240 USA\n\n##\
  \ 读者服务\n\n访问我们的网站并在 `informit.com/register` (http://informit.com/register) 注册本书，以便方便获取本书可能提供的任何更新、下载或勘误。\n\
  \n## 引言\n\nMinecraft 是一个非常棒的游戏。它是最畅销的 PC 游戏之一，而且极其受欢迎。它受欢迎的众多原因之一就是有了 Mod。如果你拿着这本书，你可能已经对\
  \ Minecraft 感兴趣，并且可能已经玩过一些 Mod。本书将教你如何自己创建这些内容。\n\n自己制作 Mod 有两个巨大的优势。首先，你可以按照自己的想法改进游戏，塑造\
  \ Mod 以使其完全符合你的需求，并让游戏玩起来更有趣。其次，制作 Mod 是进入编程领域的简单途径，这是一个蓬勃发展的行业，而且根据许多人（包括我在内），制作\
  \ Mod 是一件非常有趣的事情。\n\n### 谁应该读这本书\n\n这本书是为任何喜欢 Minecraft 且不害怕编程和 Minecraft 相关知识的人编写的。\n\
  \n如果你期望的是一份关于如何开始编程的完整指南，那么这本书并不适合你。但是，如果你想进入编程或已经知道如何编程，这本书无疑会对你有帮助。\n\n\n\n\n\
  在开始阅读这本书之前，熟悉一些 `Java` 可能会有所帮助；然而，`Java` 的基础知识将在书中随用时对其进行解释。因此，没有必要具备先行的编程知识。不过，如果你有玩《我的世界》（Minecraft）的经验将会很有帮助，因为游戏中的许多术语在书中也会用到。此外，玩过《我的世界》可以让你洞察游戏某些层面的运作方式，这能让你更容易理解你正在创建的内容。当你读到这本书的最后一小时时，建议你学习\
  \ `Java`，但到那时你应该已经对它有了相当的理解，这会让学习变得更容易。最后一小时之后是一个附录，其中包含了更多的代码，你可能在自己的模组中需要这些代码。\n\
  \n### 本书的结构\n\n要在短短 24 小时内学会《我的世界》提供的所有内容似乎任务量很大——确实如此。这本书并没有涵盖《我的世界》中每一个物品的创建。相反，它涵盖了最常用部分的创建，这为你提供了制作更特定内容的知识。接下来的分解列出了你在每一小时中将学到的细节：\n\
  \n![Image](img/image00525.jpeg) 在 第 1 小, “设置我的世界开发环境”，你将搭建开始开发《我的世界》模组的环境。在这一小时中，你将学习书中用的大部分程序。\n\
  \n![Image](img/image00525.jpeg) 在 第 2 小, “为 Forge 创建基础内容”，你开始编写代码。在这一小时中，你创建了模组的框架，你将在所有其他小时在此基础上进行构建。\n\
  \n![Image](img/image00525.jpeg) 第 3 小, “处理配方和其他小型修改内容”，这是你第一次以合成配方、熔炼配方等形式为《我的世界》添加自定义内容的章节。\n\
  \n![Image](img/image00525.jpeg) 在 第 4 小, “创建你的第一个物品”，你创建了第一个物品。从这一小时开始，你为模组添加了第一个真正独特且有趣的内容。在开始添加独特内容之前还有四个小时，时间很长，但这是必要的，因为没有代码或模组类你就无法进行模组开发。\n\
  \n![Image](img/image00525.jpeg) 在 第 5 小, “智能地创建多个物品”，你扩展了在 第 4 小中编写的代码，以确保你的模组看起来整洁并与其他模组良好协作。\n\
  \n![Image](img/image00525.jpeg) 在 第 6 小, “烹饪食物物品”，你的目标是创建一个玩家可以食用并能回血玩家的物品。这是你可以创建的许多自定义物品类型之一。\n\
  \n![Image](img/image00525.jpeg) 第 7 小, “制作你自己的工具”，这是另一个包含自定义物品类型的章节。这次，你学习了如何制作自定义的镐、铲和完全全新的工具。\n\
  \n![Image](img/image00525.jpeg) 在 第 8 小, “创建盔甲”，你学习了另一种自定义物品类型——盔甲。你学习了如何创建盔甲，然后学习如何对其自定义。\n\
  \n![Image](img/image00525.jpeg) 在 第 9 小, “创建你的第一个方块”，与 第 4 小类似，你学习了《我的世界》的另一个重要方面。在这一小时中，你学习了构成世界的东西——方块。\n\
  \n![Image](img/image00525.jpeg) 在 第 10 小, “智能地创建多个方块”，你学习了在 第 5 小中关于物品的相同内容，但是针对方块的。\n\
  \n![Image](img/image00525.jpeg) 在 第 11 小, “让你的方块变得独特”，你学习了让方块有趣的各种方法。你学习了如何制作半方块、植物以及其他几种物品。\n\
  \n![Image](img/image00525.jpeg) 在 第 12 小, “创建方块实体”，你学习了《我的世界》中最复杂的部分之一——方块实体。\n\n\
  ![Image](img/image00525.jpeg) 在 第 13 小, “生成矿石”，这是你学习生成内容的第一个重要小时。在这一小时中，你学习了世界所构成的东西——矿石。\n\
  \n![Image](img/image00525.jpeg) 在 第 14 小, “生成植物”，你使用了在 第 13 小中学习的知识。\n\n![Image](img/image00525.jpeg)\
  \ 在 第 15 小, “使用 MCEit”，你学习了使用名为 MCEit 的程序来创建结构。\n\n![Image](img/image00525.jpeg)\
  \ 在 第 16 小, “生成你的结构”，你使用了在 第 15 小中创建的内容。\n\n![Image](img/image00525.jpeg) 在 第 17\
  \ 小, “学习实体”，你学习了什么是实体，有哪些种实体，以及如何创建它们。\n\n![Image](img/image00525.jpeg) 在 第 18 小,\
  \ “使用 Techne 创建实体”，你为实体创建一个模型。这使用了 `Techne`，它是专门为模组设计的建模软件。\n\n![Image](img/image00525.jpeg)\
  \ 在 第 19 小, “编码生物”，你将在 第 18 小中创建的模型与 第 17 小中的代码结合，创建一个类似于僵尸但又不同的生物。\n\n![Image](img/image00525.jpeg)\
  \ 在 第 20 小, “创建投掷物”，你学习了一种可以被玩家投掷的实体。\n\n![Image](img/image00525.jpeg) 在 第 21 小,\
  \ “修改原版我的世界”，你学习如何修改游戏，使得多个模组可以编辑同一个内容而不破坏游戏。\n\n![Image](img/image00525.jpeg) 在\
  \ 第 22 小, “结构化你的模组”，你学习了如何整理一下你的模组。此时，几个文件看起来非常拥挤，这会影响你的体验。在这一小时之后，你应该能够在一个更容易使用的环境中继续工作。\n\
  \n![Image](img/image00525.jpeg) 在 第 23 小, “发布你的模组”，这是一个非常重要的小时。在这一小时中，你学习了如何在开发环境之外使用你的模组并将其分给用户。\n\
  \n![Image](img/image00525.jpeg) 在 第 24 小, “接下来做什么”，你学习了在完成这本书后如何继续《我的世界》模组开发。这本书的意图不仅仅是作为你复制书中内容的指南，它的意图是让你学会自己创建东西。\n\
  \n### 使用的约定\n\n本书使用了一些约定，以便你更容易理解所解释的内容。\n\n### 动手尝试一下\n\n\n\n\n\n“亲手尝试”（Try It\
  \ Yourself）活动是书中最重要的约定之一。“亲手尝试”活动提供了实操机会，让你能够积极体验并参与该小时中涵盖的主题。这些实践活动提供了“在做中学习”的机会。这是学习\
  \ Minecraft 组开发的最佳方式。\n\n### 注意 (Notes)\n`Note` 元素提供了额外的信息。这些有趣的逸闻提供了补充内容，或扩展了附近文本中提供的信息。\n\
  \n### 提示 (Tips)\n`Tip` 元素提供了制作模组时可能有用的额外信息。这些信息的范围从如何更好地使用程序的技巧，到你可能想要在代码中更改的某些内容。提示识别了对你有所帮助的实用小技巧或专家建议。\n\
  \n### 警告 (Cautions)\n`Caution` 元素用于警告你：你可能采取的某个以后可能会产生严重后果。这些告诫文本会警告你潜在的危险，并对你想要避免的结果提供提前预警。\n\
  \n### 代码列表 (Code Listings)\n代码列表是你在这书中发现的另一个有用元素。代码列表提供了与当前主题相关的代码示例。你可以通过检查示例代码来感受你的代码应该如何编写。\n\
  \n在书中，正式的代码列表始终由两条线包围，以显示代码的开始和结束。列表周围的文本解释了如果代码本身不直观的话，这些代码应该放在哪里。\n\n当一行代码太长无法在一行文本中显示时，它将换行到下一行。在这种情况下，延续部分前面有一个代码延续箭头\
  \ `![Image](img/image00526.jpeg)`。\n\n### 下载代码和资源 (Downloading the Code and Resources)\n\
  有时你的模组就是无法运行，无论你如何查看它，都找不到错误。在这种情况下，直接将书中使用的代码复制到你的工作区中可能会有所帮助。检查示例代码并与你编写的代码进行比较，可能帮助你定位并修正代码中的错误。此外，并不是每个人都擅长制作纹理，所以你可能想要获得书中使用的纹理。这两者都可以通过注册书籍来访问：\n\
  \n1. 访问 `www.informit.com/title/9780672337192`。\n2. 点击“注册你的产品”（Register Your Product）并登录或创建新账户。\n\
  3. 输入此 ISBN：`9780672337192`。这是纸质书籍的 ISBN，必须用于注册每个版本。\n4. 点击你账户页面“注册产品”部分中的“访问奖励内容”（Access\
  \ Bonus Content）链接，这将带你进入可以下载可用内容的页面。\n\n此外，正如致谢（Acknowledgments）中提到的，用于制作 Minecraft\
  \ 模组的代码经常会变化。为了确保这本书在未来仍然有用，提供了在线更新和勘误表，可以在 `www.informit.com/title/9780672337192`\
  \ 的“更新”（Updates）选项卡中找到它们。\n\n# 第一部分：引言\n\n## 第 1 小时：设置 Minecraft 开发环境\n\n* *\n\n\
  在本小时中将到：\n\n![Image](img/image00525.jpeg) 理解 Minecraft 是如何编写的以及你将用它做什么\n\n![Image](img/image00525.jpeg)\
  \ 学习 Forge\n\n![Image](img/image00525.jpeg) 安装 JDK\n\n![Image](img/image00525.jpeg)\
  \ 安装 Eclipse\n\n![Image](img/image00525.jpeg) 安装 Forge\n\n* *\n\n在本小时中，你将学习 Minecraft\
  \ 是如何编写的，以及在开始编写 Minecraft 代码之前需要什么。这包括编写它时使用的语言、你将用于编写代码的新程序，以及关于应用程序接口 (`API`)\
  \ 的信息，该 API 将用于编写模组。最后，你将学习如何设置你的开发环境。\n\n### 理解 Minecraft 是如何编写的以及你将用它做什么\n如果你以前玩过\
  \ Minecraft，你就知道 Minecraft 是用 `Java` 写的。`Java` 是一种运行在每种计算机上的编程语言。无论你用的是 `Mac` 还是\
  \ `PC`，或者运行的是 `Linux` 还是 `Windows`，它都能无视操作系统运行。这意味着你可以在任何操作系统上开发 Minecraft 模组。\n\
  \n* * *\n\n注意：关于 Java\n因为 Minecraft 是用 `Java` 写的，所以也将用 `Java` 编写。一些模组制作者认为你必须熟悉\
  \ `Java` 才能编写最基本的模组。然而，这本书并没有此要求。学习它仍然是一个明智的主意，但你可以在完全没有任何 `Java` 先验知识的情况下阅读整本书。\n\
  \n* * *\n\n这意味着你将不得不设置一些与 `Java` 相关的内容。如果你想玩 Minecraft，你需要 Java 运行环境 (`JRE`)，但大多数计算机已经安装了它，因为它被许多程序使用。对于制作模组，你需要\
  \ Java 开发工具包 (`JDK`)。设置这个稍微多花一点，但你将在本小时内学会如何操作。\n\n除了 `JDK` 之外，你还需要一个编写代码的地方。你可以在\
  \ `Word`、记事本或其他任何文本编辑器中编写代码。但是，许多集成开发环境 (`IDE`) 可以提高你的编码速度。`IDE` 提供了如格式化和自动补全等工具。由于你在编写\
  \ `Java`，有很多 `IDE` 可供选择。在书中将介绍了 `Eclipse` 的设置，它是最常用的 `IDE`。\n\n* * *\n\n注意：其他 IDE\n\
  除了 `Eclipse` 还有其他 `IDE`。还有 `IntelliJ IDEA` 和 `NetBeans`。或者，你可以使用 `NotePad++`。但是，只有\
  \ `Eclipse` 和 `IDEA` 自带了所需的开发环境。对于其他的，你需要手动设置。\n\n* * *\n\n### 获取源码\n除了编程语言和编写代码的程序之外，开始\
  \ Minecraft 开发还需要另一个东西：你还需要一种将 Minecraft 代码转换为可读源码的方法。这可以通过 Mod Coder Pack (`MCP`)\
  \ 完成，它是由社区编写的。在模组社区像现在这么大之前，Minecraft 模组是使用这套工具编写的。然而，如果你这样编写代码，用户无法同时使用多个模组。为了让用户能够使用多个模组，编写了一个\
  \ `API`。对于当前的 Minecraft 版本，只有一个 `API` 仍在更新。这个 `API` 称为 `Forge`。\n\n### 学习 Forge\n\
  `Forge` 是一个 `API`，正如前面提到的，它可以多个模组能够在游戏中运行。然而，`Forge` 的功能远于此，它让模组变得简单得多，并为你提供了许多更改\
  \ Minecraft 某些方面（只能通过 `Forge` 修改）的工具。\n\n`Forge` 是一个编写得很好的程序。`Forge` 的功能可以比作在不知道每个人名字的情况下尝试将所有人聚集在一起。它可以在\
  \ Minecraft 显式知道它们的情况下定位并加载模组。为了实现这一点，`Forge` 要求用户和模组制作者执行一些操作以使模组变得可识别。\n\n\n\n\
  \n\n编写 Minecraft mod 还有其他方法。`Forge` 并不是必须的，但它能确保 mod 的编写尽可能简单。它还确保了可以同时使用多个 mod。\n\
  \n## 设置 JDK\n\n必须按照特定的顺序进行设置。首先，你设置编程语言的要求，然后是 IDE，最后是设置你想要编程的内容。这意味着你首先从安装 `JDK`\
  \ 开始。首先，访问以下 URL 中的 Oracle 网站下载 `JDK`：[www.oracle.com/technetwork/java/javase/downloads/index.html](http://www.oracle.com/technetwork/java/javase/downloads/index.html)。选择适用于你系统的\
  \ `JDK` 版本。但请务必下载 JDK 7 版本。如果你尝试使用 JDK 8，它可能无法运行。\n\n每个操作系统（OS）的 JDK 设置方法均不相同。请务必根据你的操作系统阅读相应的说明。\n\
  \n注意：准确性\n\n请非常仔细地遵循接下来的步骤。如果你在这些步骤中犯了任何微小的错误，此之后的所有步骤都将无法运行。\n\n### Windows\n\n\
  为 Windows 设置 JDK 需要的工作最多。你从 Oracle 下载的是一个可执行文件，它安装了大部分 JDK，但为了让它真正运行还需要额外的设置。要设置\
  \ JDK，请遵循以下步骤：\n\n**1.** 运行 `JDK` 的可执行文件进行安装。按照安装程序给出的说明操作。当提示选择要安装哪些组件时，直接点击“下一步”（Next）。安装路径并不重要，但建议使用标准位置。\n\
  \n**2.** 接下来，导航到你刚刚安装 `JDK` 的文件夹。使用标准路径，这应该是 `C:/Program Files/Java`。如果你在 64 位机器上安装了\
  \ 32 位版本的 Java，你必须进入 `C:/Program Files (x86)/Java`。在这个文件夹中，可能会找到多个版本的 Java。很可能有一个\
  \ `JRE` 文件夹和一个 `JDK` 文件夹。进入 `JDK` 文件夹，然后进入 `bin` 文件夹。现在点击 Windows 资源管理器顶部的路径并复制文件路径。你稍后需要这个路径。\n\
  \n**3.** 现在你必须经过几个窗口，从图 1.1 开始。\n\n![Image](img/image00527.jpeg)\n\n**图 1.1** 导航到计算机属性。\n\
  \n首先点击 Windows 图标（图中标记为 1 的位置）。然后右键点击“计算机”，如图中数字 2 所示。最后，点击出现的右键菜单底部的“属性”（数字 3）。\n\
  \n**4.** 此此操作后，会打开一个新窗口，如图图 1.2 所示。\n\n![Image](img/image00528.jpeg)\n\n**图 1.2**\
  \ 控制面板，系统属性。\n\n在此窗口中，点击左侧的“高级系统设置”，在图 1.2 中高亮显示。\n\n**5.** 接下来，打开系统属性窗口，如图图 1.3\
  \ 所示。\n\n![Image](img/image00529.jpeg)\n\n**图 1.3** 系统属性窗口，高级选项卡。\n\n在此窗口中，确保你处于“高级”选项卡上，这应该是默认值。现在点击图中高亮显示的“环境变量”按钮。\n\
  \n**6.** 执行此操作后将打开“环境变量”窗口，如图图 1.4 所示。\n\n![Image](img/image00530.jpeg)\n\n**图 1.4**\
  \ 环境变量窗口。\n\n在此窗口中，你只需要关心顶部部分的设置。下部分对于设置 JDK 并不重要。“用户变量”框（图中 1 框）显示了你的电脑到目前为止所有的变量。你可以通过点击“新建”按钮（图中\
  \ 2 框）在其中添加新变量。\n\n**7.** 打开“新建用户变量”窗口，在其中添加新变量。图 1.5 显示了此窗口。\n\n![Image](img/image00531.jpeg)\n\
  \n**图 1.5** 添加用户变量。\n\n要添加新的用户变量，请输入“变量名”和“变量值”。对于名称，输入 `PATH`。对于值，粘贴你之前复制的 Java\
  \ 路径，并在后面跟上 `;%PATH%`。这很重要，因为它将新变量 `PATH` 与系统级变量 `PATH` 结合在一起，后者包含了重要的位置，例如 Windows\
  \ 的安装位置。\n\n如果你已经有一个 `PATH` 值，选中它并点击“编辑”。然后移动到变量的末尾添加一个分号（`;`），然后粘贴之前的路径。\n\n注意：添加第二个\
  \ PATH 值\n\n请非常小心，不要创建第二个 `PATH` 变量。如果你已经有了一个，请编辑那一个。在编辑时，请确保第一个值、分号（`;`）和新值之间没有空格，否则它们都将无法正常工作。\n\
  \n**8.** 最后，在“新建用户变量”窗口、“环境变量”窗口和“系统属性”窗口中点击“确定”，然后关闭控制面板。你的 Java 应该已安装正确。\n\n**9.**\
  \ 要检查 JDK 是否可用，在任何地方打开提示符并运行 `javac`。此命令应该输出如下信息：\n\n```\nC:\\Users\\Jimmy>javac\n\
  Usage: javac <options> <source files>\n```\n\n### Mac\n\n**1.** 双击 `.dmg` 文件启动 JDK。\n\
  \n**2.** 应该弹出一个 Finder 窗口，其中包含 `.pkg` 文件。双击该包启动安装程序。\n\n**3.** 按照安装程序的说明操作。\n\n\
  ### Linux\n\n如果你有 `.tar.gz` 文件，请完成以下步骤：\n\n**1.** 将 `.tar.gz` 文件剪切并粘贴到你想安装 JDK 的位置。\n\
  \n**2.** 在终端中使用以下命令解压并安装 JDK：\n\n```bash\n% tar zxvf jdk-7u<version>-linux-x64.tar.gz\n\
  ```\n\n如果你下载的是 `.rpm` 文件，运行它即可安装。\n\n\n\n\n设置的最后一步是下载并安装 Forge。执行此操作，请访问 [minecraftforge.net](http://minecraftforge.net)\
  \ 网站。进入下载页面（`[`files.minecraftforge.net/`](http://files.minecraftforge.net/)`），获取你所需的\
  \ Forge 的 `src` 版本。当你点击 `src` 版本时，它会带你进入一个 `adf.ly` 链接。请确保等待五秒，然后点击右上角的巨大按钮下载 Forge。其他任何按钮都可能包含间谍软件。通常，最好的版本是适用于你将开发的\
  \ Minecraft 版本的最新发布版。在写作期间，Minecraft `1.7.10` 对应的版本是 `10.13.0.1152`。如果你正在为更高版本的\
  \ Forge 编写 mod，情况可能会略有不同。如果发生这种情况，本书的网站（`[www.informit.com/title/9780672337192](http://www.informit.com/title/9780672337192)`）可能会提供相关信息的更新，因此请务必注册你的书籍以获取最新信息。\n\
  \n***\n\n注意：Adfly 与 Mod 制作者\n\n当你阅读此本书时会发现，制作 mod 需要很长时间。mod 制作者通常希望为他们的工作获得少许报。可以通过捐赠来实现，几乎每个\
  \ mod 制作者的 mod 页面上都有捐赠选项，但很少有捐赠。因此，许多 mod 制作者会将 mod 下载放在一个 `adf.ly` 链接之后。这是一个带有广告的网站，你必须等待五秒，之后就可以继续并下载\
  \ mod。在 `adf.ly` 网站上你应该小心，因为只有右上角的链接是可靠的。其他的都是广告，并可能对你的电脑造成危害。\n\n***\n\n一旦从 Forge\
  \ 下载网站下载了 `src` 文件，使用 winRar、7Zip 或其他可以打开此类文件的文件的程序打开 `.zip` 文件。现在，进入你之前解压 Eclipse\
  \ 的文件夹，在同一个父文件夹中创建一个 `forge` 文件夹。在该文件夹中，粘贴 Forge `.zip` 文件中的所有文件。这些文件中应该包含 `gradlew.bat`。如果该文件不存在，说明你下载了错误的\
  \ Forge 版本。\n\n接下来，使用你的命令提示符或终端运行两个命令。\n\n***\n\n注意：可能的问题\n\n如果以下任一命令不起，你可能犯了以下错误之一：\n\
  \n![Image](img/image00525.jpeg) 你安装的是 `JDK 8`；请改用 `JDK 7`。\n\n![Image](img/image00525.jpeg)\
  \ 你没有正确安装 `JDK`。\n\n![Image](img/image00525.jpeg) 你没有在正确的文件夹中运行命令。确保你在包含 `gradlew.bat`\
  \ 文件的文件夹中运行。\n\n![Image](img/image00525.jpeg) 你的防火墙阻止了下载。如果是这种情况，请尝试将其关闭几分钟。\n\n\
  ***\n\n第一个命令如下：\n\n```\ngradlew setupDecompWorkspace\n```\n\n在 Mac 上，在所有命令前加上不带引号的\
  \ `\"./\"`。根据你的网络连接速度，这需要几分钟时间才能完成。之后，运行以下命令：\n\n```\ngradlew eclipse\n```\n\n一旦命令提示符完成，Forge\
  \ 就可以使用了。剩下的唯一工作就是打开你的开发环境（Eclipse）来开始编码。启动 Eclipse 后，会弹出一个窗口。这个窗口会为你启动 Eclipse。过段时间后，工作空间启动器窗口会在它上方打开，并有一个\
  \ `Browse`（浏览）按钮。它看起来像图 1.6。\n\n![Image](img/image00532.jpeg)\n\n**图 1.6** Eclipse\
  \ 的启动。\n\n点击 `Browse` 按钮后（如图 1.6\n\n**图 1.7** Eclipse 中的选择工作空间目录窗口。\n\n现在进入你安装 Forge\
  \ 的文件夹，并选择其中的 `Eclipse` 文件夹。最后，在图 1.6 所示的工作启动器窗口上再次点击 `OK`。完成后，Eclipse 将加载它需要的内容，然后打开一个你在其中编写所有代码的窗口。在左侧，你会看到名为\
  \ `Minecraft` 的项目。点击它左侧的小箭头。当你这样做时，它会显示许多文件和文件夹，但你不需要担心大部分内容。你唯一要做的是导航到 `src/main/java`\
  \ 文件夹并点击其左侧的箭头。这会打开另一个下拉菜单，在其中你应该看到一个名为 `com.example.examplemod` 的棕色包。再次点击它左侧的箭头，它会显示一个名为\
  \ `ExampleMod` 的文件。双击该文件，中间窗口将显示该文件的代码。它看起来像列表 1.1。\n\n**列表 1.1** Example 中的 ExampleMod\n\
  \n```java\npackage com.example.examplemod;\n\nimport net.minecraft.init.Blocks;\n\
  import cpw.mods.fml.common.Mod;\nimport cpw.mods.fml.common.event.FMLInitializationEvent;\n\
  \n@Mod(modid = MODID, version = VERSION)\npublic class ExampleMod {\n\n    public\
  \ static final String MODID = \"examplemod\";\n    public static final String VERSION\
  \ = \"1.0\";\n\n    @EventHandler\n    public void init(FMLInitializationEvent event)\
  \ {\n        System.out.println(\"DIRT >> \"+Blocks.dirt.getLocalizedName());\n\
  \    }\n}\n```\n\n***\n\n这是第 2 小节\n\n***\n\n### 动手尝试：启动 Minecraft\n\n设置完成后，你可能想要启动\
  \ Minecraft\n\n1. 点击顶部的绿色箭头启动 Minecraft。\n2. 在底部菜单中启动 mod。\n\n***\n\n### 总结\n\n\
  在这一小时中，你学习了开始工作之前的要求和所需的准备工作。你学习了 Minecraft 是用 `Java` 编写的，它可以运行在任何操作系统上。这一小时还涵盖了几个你将使用的程序，包括\
  \ IDE `Eclipse` 以及 API `Forge`。最后，你设置了所需的元素。\n\n### 问问答\n\n问 为什么我们必须使用 `Eclipse`？\n\
  \n答 你并不必须使用 `Eclipse`。然而，`Eclipse` 和 `Intelliij IDEA` 是仅两个已经为你配置好所有内容的 IDE。对于其他所有\
  \ IDE，你必须手动进行配置。这并不意味着你必须使用它们，但强烈建议使用。可以使用 `NetBeans` 或基础文本编辑器，但 Forge 没有为这些工具提供实用的工作空间设置。\n\
  \n问 为什么选择 Forge？\n\n答 Forge 是更新最频繁的 API，努力兼容尽可能 mod。此外，它是开源的，允许社区提交反馈、错误修复和新功能请求。它还为最终\
  \ mod 作者提供了最简单的设置，并引导社区向行业标准的编程形式发展。\n\n### 工作坊\n\n现在设置已经完成，你很快就会开始编码。不过，首先你需要回答一些问题。\n\
  \n### 测验\n\n1 Minecraft 用什么语言编写的？\n\n2 使用的 API 名称是什么？\n\nA. Modloader\nB. Forge\n\
  C. Eclipse\nD. Java\n\n### 答案\n\n1 Java。\n\n2 答案是 B。`Eclipse` 是使用的 IDE，`Java` 是编程语言。答案\
  \ A 是另一个不再更新的 API 名称，但它也是对 Forge 功能的一种描述。\n\n### 练习题\n\n\n\n\n\n尝试修改 `ExampleMod`\
  \ 类中的一些代码，以找出每个部分的作用。你可能会在接下来的一小时内发现这些信息有用。\n\n## 第 2 小时：为 Forge 创建基础\n\n在本小时内你将学习：\n\
  \n![Image](img/image00525.jpeg) 理解 `ExampleMod` 中的 Java\n\n![Image](img/image00525.jpeg)\
  \ 创建你自己的包\n\n![Image](img/image00525.jpeg) 创建你自己的类文件\n\n![Image](img/image00525.jpeg)\
  \ 创建 mod 文件\n\n在这个小时内，你首先将学习一些基础 Java。`ExampleMod` 中使用的所有代码行都将得到解释。一旦你理解了所有代码，就是时候首次创建你自定义的\
  \ `package`（包）了。包基本上是 Java 代码的文件夹。它可以用于更好地组织你的代码。然而，它也应用了关于哪些代码片段可以访问和不能访问的某些规则。当你按照当前的约定创建一个包后，就是时候创建你自己的\
  \ `mod file`（mod 文件）了。你的 mod 文件是你代码中最重要的文件。对于简单的 mod，它包含了所有代码，但即使对于最大的 mod，mod 文件中的微小错误也会导致整个\
  \ mod 禁用。\n\n### 理解 ExampleMod 中的 Java\n\n在第 1 小时“设置 Minecraft 开发环境”结束时，Forge 的设置已经完成。此项设置中包含了一个示例\
  \ mod。`ExampleMod` 文件如列表 2.1\n\n```java\npackage com.example.examplemod;\n\nimport\
  \ net.minecraft.init.Blocks;\n\nimport cpw.mods.fml.common.Mod;\n\nimport cpw.mods.fml.common.Mod.EventHandler;\n\
  \nimport cpw.mods.fml.common.event.FMLInitializationEvent;\n\n@Mod(modid = ExampleMod.MODID,\
  \ version = ExampleMod.VERSION)\npublic class ExampleMod\n{\n    public static final\
  \ String MODID = \"examplemod\";\n    public static final String VERSION = \"1.0\"\
  ;\n\n    @EventHandler\n    public void init(FMLInitializationEvent event)\n   \
  \ {\n        // some example code\n        System.out.println(\"DIRT BLOCK >> \"\
  +Blocks.dirt.getUnlocalizedName());\n    }\n}\n```\n\n在编写你自己的 mod 之前，了解所有代码实际的作用是非常有用的。这样，以后编写\
  \ mod 就可以做得更快、更高效。在第 3 小时“使用配方和其他小型修改”中，你将创建你的第一个自定义代码。\n\n### 包（Packages）和导入（Imports）详解\n\
  \n`ExampleMod` 的第一行是 `package` 行。正如本节引言所述，包基本上是 Java 的文件夹。代码如下：\n\n点击此处查看代码图片\n\n\
  ```java\npackage com.example.examplemod;\n```\n\n这并不是 `ExampleMod` 的完整文件路径，而只是它的一部分。这是因为这段\
  \ Java 代码无论位于什么路径下，在任何地方都能工作。然而，包中的三个文件夹无论如何都会保持不变。通常，正确的路径会由你的集成开发环境 (IDE) 处理好。在\
  \ Eclipse 中，你为此创建一个包。\n\n文件夹路径在代码中变为包的方法非常简单。在文件资源管理器窗口中，文件夹在文件夹中的文件夹通常用 `/` 隔开。在\
  \ Java 中，这是用点 `.` 完成。在这种情况下，`ExampleMod` 文件将位于 `.../com/example/examplemod` 文件夹中，在\
  \ Java 中为 `com.example.examplemod`，其中 `...` 是它可能所在的任何文件夹。如果你去安装 Forge 的地方，你会发现这个文件夹结构位于\
  \ `src/main/java`。在 Eclipse 中，你会看到一个带有包图标的文件夹位于该位置。这样的文件夹被称为 `source folder`（源文件夹）。每当你更改源文件夹内部的文件夹时，包就会改变，你必须在代码中处理这一点。\n\
  \n### 提示：在 Eclipse 中重命名\n\n你可以通过点击 Eclipse 左侧包资源管理器（Package Explorer）中的包并按下 `Alt+Shift+R`\
  \ 来轻松更改文件夹所在的包。这会弹出一个窗口，你可以在其中更改包名。它会自动更改被更改文件中每个文件包含包 声明的代码行。\n\n你在 `ExampleMod`\
  \ 中应该熟悉的下一个内容是一组行。它们都以 `import` 开头，在 `ExampleMod` 中，它们看起来如下：\n\n```java\npackage\
  \ com.example.examplemod;\n\nimport net.minecraft.init.Blocks;\nimport cpw.mods.fml.common.Mod;\n\
  import cpw.mods.fml.common.Mod.EventHandler;\nimport cpw.mods.fml.common.event.FMLInitializationEvent;\n\
  ```\n\n`import` 非常有用，因为它允许程序员更流畅地引用其他类。以 `Blocks.dirt` 为例。如果没有导入，代码必须是 `net.minecraft.init.Blocks`。将导入想象为说“我熟悉这个，所以从现在起我将使用它们的名称”。每当你使用新类时，它都会带有下划线，因为\
  \ Java 不知道你的意思，你必须为它添加导入。通常，IDE 也会处理这一点。如果它没有为你完成，你可以尝试以下几种操作：\n\n- 将鼠标悬停在新的文件（现在是红色的）上，选择\
  \ Import（导入）。\n- 按 `Ctrl+Shift+O`，这将导入文件。如果有多个同名的文件，它会显示一个屏幕让你选择哪一个。\n- 在源代码的任何地方点击右键，选择\
  \ `Source`源），然后选择 `Organize Imports`组织导入）。这与 `Ctrl+Shift+O` 相同。它还会删除任何未使用的导入。\n\n\
  在本书过程中选择正确的导入时，正确的选择总是与 Minecraft 相关的包之一，例如 `net.minecraft`、`cpw.mods.fml` 或 `net.minecraftforge`，除非另有说明。\n\
  \n### @Mod 和类\n\n接下来是 `@Mod` 行，如下：\n\n点击此处查看代码图片\n\n```java\n@Mod(modid = ExampleMod.MODID,\
  \ version = ExampleMod.VERSION)\n```\n\n这一行比到此为止的其他行都要复杂一点。因此，它必须拆分成部分以便于理解。第一部分是\
  \ `@Mod`。这部分是一个注解。Java 中的注解是一种功能，允许编码人员为方法、类和字段附加额外信息，其他程序可以读取这些信息。\n\n\n\n\n\n\
  `@Mod` 需要两个参数。在 Java 中，`parameters`（参数）是随某些内容一起发送的信息组。在这种情况下，它需要两个参数发送给 `Mod` 以供\
  \ Forge 使用。这两个参数都是 `String` 类型。Java 中的 `String` 是一个用于存储字符组的类。要声明一个 `String`，你只需要输入你想要的字符并用引号括起来即可。`String`\
  \ 是 Java 中 `constant`（常量）的一个示例。常量可以赋值给 `variables`（变量）。稍后将解释声明变量的代码。首先，理解 `@Mod`\
  \ 这一行的代码至关重要。\n\n## @Mod 注解\n\n注解后的括号内包含几项内容。其中的第一个内容是 `modid`。它是 `Mod` 中的一个变量，用于跟踪\
  \ `mod ID`（模组 ID）。在 Forge 中，每个模组都有一个 mod ID。这是一个 `String`，且每个模组的 ID 必须不同。它被用于许多不同的地方，其中大部分由\
  \ Forge 处理，以确保该模组能与其他模组协同工作。要设置 `modid`，在该变量后跟着一个等号。等号右侧是它将被设置的值。在这种情况下，它会查找 `ExampleMod`\
  \ 文件并选择 `MODID` 变量。这看起来可能很奇怪，明明代码就在当前文件中，却必须指定去 `ExampleMod` 文件查找。然而，根据 Java 的规定，当它读取\
  \ `@Mod` 这一行时，它还没有进入 `ExampleMod` 文件。\n\n在 Java 中，实际的 `ExampleMod` 类从 `public class`\
  \ 开头的行下方的大括号开始。那之前的所有内容都不被视为类的一部分。然而，包（package）、导入（imports）以及有时的注解放置在上方，且同样重要。类的开始看起来如下：\n\
  \n```java\npublic class ExampleMod\n{\n```\n\n尽管实际的类定义行只有一行，但紧随其下方的行也包含在前面的代码片段中。这是由于\
  \ Java 的工作机制。正如你可能注意到的——而且当你自己编程时一定会发现的——Java 频繁使用不同类型的括号。括号之间的代码可以被视为一组代码。在 `ExampleMod`\
  \ 的情况下，你可以将 `ExampleMod` 下方的左括号到底部右括号之间的所有代码视为一个代码组，可以称为 `ExampleMod` 类组。里面还有更小的代码组，即方法（methods）。稍后将解释。这种编码方式被称为面向对象编程\
  \ (OOP)。因为 Java 是一种 OOP 语言，代码始终会有这种结构。\n\n`public class` 这一行对 Java 来说非常重要。它定义了类的开始位置以及类的名称。一个需要注意的重要点是，如果你更改了\
  \ `ExampleMod` 所在的文件名，那么 `public class ExampleMod` 的名称必须改为新的文件名。\n\n## 类中的字段 (Fields)\n\
  \n现在你已经对类及其创建方式有了基本的了解，你需要理解类是由哪些部分组成的。在 Java 中，有几类内容可以存在于类文件中。这些是 `fields`（字段）、`methods`（方法）以及可能的其他类。所有这些都位于\
  \ `ExampleMod` 中。以下代码片段展示了 `ExampleMod` 中的字段：\n\n点击此处查看代码图片\n\n```java\npublic static\
  \ final String MODID = \"examplemod\";\npublic static final String VERSION = \"\
  1.0\";\n```\n\n在前面的代码片段中有两个不同的字段、变量或 `objects`（对象）。它们有许多共同点。前三个单词是你赋予 Java 字段的属性。`Public`\
  \ 意味着该字段可以在每一个其他 Java 文件中访问。这本书几乎总是使用 `public` 字段。`Public` 使字段变得可见，更重要的是让它在任何地方都可用。可选的变量可见性名称有\
  \ `protected`（仅对包和子类可见）和 `private`（使其仅在类本身中可见）。\n\n在 `public` 之后的是单词 `static`。这意味着你可以通过\
  \ `ExampleMod.MODID` 来引用该对象。如果一个字段不是静态的（static），你不能以这种方式使用它。如果它不是静态的（不需要该单词），你只能通过文件的对象来引用它。一个例子是\
  \ `init` 方法中的 `event` 参数，它很快就会被介绍。如果你使用 `event` 后跟一个点，你就可以访问任何非静态字段和方法。你不能用这种方式使用静态方法和字段。静态字段必须以完整的类名作头。正如你预期的那样，Minecraft\
  \ 并没有为游戏中的每一个泥块（dirt block）准备一个独立的文件。它为每个方块使用同一个文件。这也是 OOP 代码风格的一部分。\n\n如果你在类中为泥块设置了一个静态字段，那么这个字段对于每一个泥块来说都是相同的。非静态字段对于所有泥块可以是不同的。泥块中可能的静态字段示例是纹理（texture），因为每个泥块都有相同的纹理。泥块中可能的非静态字段示例是\
  \ x 坐标，因为每个方块的坐标都是不同的。\n\n在 `static` 之后的是单词 `final`。`Final` 意味着字段可以初始化一次，之后永远不再更改。`final`\
  \ 字段的名称应该始终全大写。如果不这样做，你的代码不会崩溃，但这是 Java 的惯例，应该始终遵守。\n\n在三个紫色单词的右侧是单词 `String`。这个单词是实际使用的对象。在这种情况下，它创建了一个\
  \ `String` 类的对象，这是一个用于单词的标准 Java 类。\n\n一旦你写了它应该是什么类型的字段，就需要一个名称。顶部的字段名称为 `MODID`。在名称之后，你使用\
  \ `=` 号将字段设置为某个值。等号之后的内容对于任何对象都可能不同。对于 `String`，你使用一对引号以及你想要存储其中的单词。\n\n## 类中的方法\
  \ (Methods)\n\n`ExampleMod` 中的接下来的以及最后几行必须作为一个组进行解释：\n\n点击此处查看代码图片\n\n```java\n\
  @EventHandler\npublic void init(FMLInitializationEvent event)\n{\n    // 示例代码\n\
  \    System.out.println(\"DIRT BLOCK >> \" + Blocks.dirt.getUnlocalizedName());\n\
  }\n```\n\n这段代码是一个方法。方法名是 `init`。它接收一个参数并包含两行代码。最后，它在上方还有一个注解。和变量一样，方法也可以是静态的，也可以是非静态的。这些关键字在方法上的行为与变量相同。`init`\
  \ 方法没有 `static` 关键字。因此它是非静态的，这意味着它对于 `ExampleMod` 的每个实例都是不同的。\n\n该注解是给 Forge 用的。配合参数，它确保\
  \ Forge 在设置期间读取此方法。`@EventHandler` 用于注册每一个 `FMLInitializationEvent`。有三种初始化事件：`PreInit`、`Init`\
  \ 和 `PostInit`。你编写的所有代码都必须放在特定的初始化事件中。\n\n\n\n\n注释之后的一行指定了该方法的类型。紫色的名称和变量一样，是你赋予方法的某些属性。`Public`、`protected`、`private`\
  \ 和 `static` 的工作方式与变量完全相同。对于方法，你还有一点需要注意，那就是“返回类型”。每个方法都有返回某些内容的选项。这可以数字、一个 `String`、一个\
  \ `Block` 或者什么都没有。在这种情况下，返回类型为 `void`，意味着空。如果你的方法的返回类型是 `void`以外的任何类型，你必须用 `return`\
  \ 语句结束方法。稍后你会发现一些需要这样的方法，届时只需返回方法所需的任何内容即可。\n\n在这种情况下，有两个紫色的关键字，之后是方法名。方法名为 `init`。方法名之后是一个括号。圆括号内是方法的参数。这一部分的第一个词是一个名为\
  \ `FMLInitializationEvent` 的类；第二个词是引用它的变量名。前一个代码段中的变量名为 `event`。\n\n这一行之后是一个大括号，定义了方法的开始。三行之后是一个右括号，定义了方法的结束。这个方法包含两行，但只有其中一行是代码。第一行是注释。注释是你可以在文件中编写有用内容。注释说明了某物的作用、是否有任何需要修复的错误等。你可以在这些注释中写任何内容，Java\
  \ 永远不会使用它们。在 Java 中，可以通过输入 `//` 创建注释。这会将该符号右侧的所有内容变成注释。\n\n有时你可能想要一个较长的注释，或者只想让行中的一小部分作为注释。这可以通过\
  \ `/*` 和 `*/` 实现。第一个和第二个注释符号之间的任何内容 Java 都不会使用。\n\n该方法的第二行实际上执行了某些操作。它也是一行你将经常编写的类似代码。`System.out.println`\
  \ 将你在其后面括号中写的 `String` 打印到控制台。在 Eclipse 中，控制台位于底部。控制台的另一个例子是命令提示符。\n\n这个 `syso,`（编程中通常对\
  \ `System.out.println` 的简称）由两部分组成。第一部分是 `DIRT BLOCK >>`，它将完全按照那样打印在控制台上。在这个 `String`\
  \ 之后是一个 `+`，这意味着将有第二个 `String` 与第一个拼接并一起打印。这里的第二个 `String` 是泥块的未本地化名称。该名称通过使用 `Blocks.dirt.getUnlocalizedName()`\
  \ 来访问。`Blocks` 是一个包含所有 `Block` 对象的文件。其中一个 `Block` 对象就是 `dirt`。从这个 `dirt` 对象，通过 `getUnlocalizedName`\
  \ 方法返回未本地化名称。该方法是一个返回类型的示例，类型为 `String`。在这种情况下，`System` 是类，`out` 是静态字段，而 `println`\
  \ 是非静态方法。\n\n### 提示：Eclipse 输入快捷键\n\n在 Eclipse 中，你可以通过输入 `syso` 然后按 `Ctrl+Space`\
  \ 轻松地输入 `System.out.println`。这会自动将 `syso` 变为 `System.out.println`。\n\n### 创建你自己的包\n\
  \n现在你已经了解了 Java 基础并理解了 `ExampleMod` 中的代码，是时候创建你自己的 Mod 了。在开始创建你自己的 Mod 之前，你需要一个包含所有\
  \ Mod 文件和代码的包。要创建你自己的包，你需要理解 Eclipse 左侧的“项目资源管理器”（Project Explorer），如图 图 2.1 所示。\n\
  \n![Image](img/image00534.jpeg)\n\n**图 2.1** 项目资源管理器\n\n\n\n\n\n此屏幕上有许多选项，但你只需要关注的三个部分已图中用黑色高亮显示。首先，确保包名与你刚刚创建的相同。接下来，输入你将创建的类名称。因为这将是你的模组（mod）的基类，名称通常与模组相同。正如图\
  \ 2.5 所示，在本书中，mod 类被称为 `SamsMod`。从现在起，如果本书提到主类、模组文件或 `SamsMod` 文件，指的都是这个主文件。当你选好类名称后，只需点击“完成（Finish）”，无需担心所有其他选项。图\
  \ 2.6 显示了打开了 `SamsMod` 类的完整 Eclipse 程序。\n\n![Image](img/image00539.jpeg)\n\n**图\
  \ 2.6** 打开了模组文件的 Eclipse。\n\n以下列表引用了图 2.6 中显示的数字，并解释了这些区域的含义：\n\n**1.** 这是你花费大部分时间的地方。它是代码窗口，你将在其中编写和阅读你所有的代码。\n\
  \n**2.** 此区域包含文件的大纲（Outline）。大纲包含了所有重要的 Java 部分，包括变量、方法和类。\n\n**3.** 底部区域有几个不同的窗口。你最经常查看两个窗口是控制台（Console）和标记（Markers）。标记包含了代码中所有的错误和警告。控制台是\
  \ Minecraft 显示系统输出以及其他关于你的模组信息的地方。\n\n**4.** 这里是你可以开始游戏的地方。通常，你将使用普通的绿色箭头，它会启动游戏。左侧的按钮是调试模式，允许你在玩游戏时更改部分代码。右侧的按钮会在运行前构建所有内容。\n\
  \n### 创建模组文件\n\n在这一小时内，你要做的最后一件事实际上是创建模组文件。最简单的方法是复制 `ExampleMod` 的代码并将其粘贴到你的模组文件中。当你这样做时，你会得到两个错误。按照以下步骤操作以修复错误，然后进行几处修改：\n\
  \n**1.** 将鼠标悬停在包名行的错误上，选择`更改包声明（Change Package Declaration）”选项。或者，手动重写这一行。\n\n**2.**\
  \ 接下来，将鼠标悬停在 `ExampleMod` 下方的错误上，选择`重命名类型为（Rename Type To）”选项。也可以手动重写。\n\n**3.**\
  \ 最后，将 `MODID` 变量更改为你模组的 modid。modid 应该是每个模组都不同的。通常一个 modid 的格式为 `[你的名字]_[模组名称]`。此外，确保所有字母都是小写。\n\
  \n**4.** 移除 `init` 方法中的注释。你不需要这样做，但该注释不是必须的。\n\n***\n\n注意：让你的模组变得有趣\n\n本书将引导你完成制作模组的编码工作。然而，还有另一件事你可能需要考虑，那就是确保人们想要玩你的模组。在创建模组时，你可以做出的重要事情之一就是确保它有一个单一且独特的构思。如果一个模组杂乱无章且没有任何关联，那么它可能不好玩。\n\
  \n一个专注的模组示例是：它只为游戏添加一些本该在原版中就有的配方。\n\n***\n\n模组文件现在看起来应该像列表 2.2。拥有不同的类名、包名和 modid\
  \ 是正常的。\n\n**列表 2.2 自定义模组文件**\n\n点击此处查看代码图片\n\n***\n\n```java\npackage com.wuppy.samsmod;\n\
  \nimport net.minecraft.init.Blocks;\n\nimport cpw.mods.fml.common.Mod;\n\nimport\
  \ cpw.mods.fml.common.Mod.EventHandler;\n\nimport cpw.mods.fml.common.event.FMLInitializationEvent;\n\
  \n@Mod(modid = SamsMod.MODID, version = SamsMod. VERSION)\npublic class SamsMod\n\
  {\n    public static final String MODID = \"wuppy29_samsmod\";\n    public static\
  \ final String VERSION = \"1.0\";\n\n    @EventHandler\n    public void init(FMLInitializationEvent\
  \ event)\n    {\n        System.out.println(\"DIRT BLOCK >> \"+Blocks.dirt.getUnlocalizedName());\n\
  \    }\n}\n```\n\n***\n\n这与 `ExampleMod` 的功能完全相同，但这让你离创建自己的模组又近了一大步。在下一个小时里，你将学习如何创建自己的配方，以及进行一些其他小的修改。\n\
  \n***\n\n### 动手尝试：向控制台打印内容\n\n此时，你可能想向控制台打印一些自定义内容。\n\n**1.** 将 `Blocks.dirt` 更改为\
  \ `Blocks.cobblestone`。\n\n**2.** 将 `\"DIRT BLOCK >> \"` 更改为 `\"Cobblestone >>`。\n\
  \n***\n\n### 总结\n\n这一小时内，你学习了 `ExampleMod`。所有的包，包括导入等对你来说都是清晰的。你现在应该能够创建自己的模组文件。\n\
  \n### 问答\n\n**Q.** 为什么需要包？\n**A.** 它将你的代码与其他代码隔离开。\n\n**Q.** 我在哪里可以找到物品？\n**A.**\
  \ 你可以在 `Items` 类中找到它们。\n\n**Q.** `void` 是什么意思？\n**A.** 表示没有返回值。\n\n### 工作坊\n\n你的模组文件现在可以使用了。通过回答以下问题确保你理解了所有的代码。\n\
  \n### 测验\n\n**Q.** 下面的 modid 有什么问题？`\"test_ModId\"`\n**A.** Mod ID 应该是小写。\n\n**Q.**\
  \ 下面的代码输出什么？\n```java\nSystem.out.println(\"Testing: \" + \"Answer\");\n```\n**A.**\
  \ 输出 `Testing: Answer`。\n\n### 练习\n\n你现在已经完成了模组的骨架，这意味着模组可以快速成长。现在，尝试打印一些不同的名称：\n\
  \n**1.** 创建一个打印 `\"Hello World!\"` 的 `System.out.println`\n\n**2.** 让控制台显示 `\"I\
  \ am getting an apple with the name\"` 加上苹果物品的本地化名称。\n\n**3.** 弄清楚下面这行代码输出什么：\n\n\
  ```java\nSystem.out.println(\"Testing Blocks: \" + Blocks.bedrock.getUnlocalizedName()\
  \ + \" And testing Items: \" + Items.book.getUnlocalizedName());\n```\n\n\n\n\n\
  2. `System.out.println(\"I am getting an apple with the name\" + Items.apple.getUnlocalizedName());`\n\
  \n3. 输出为：`Testing Blocks: tile.bedrock And testing Items: item.book`\n\n# 第 3 小时：使用配方与其他小型修改\n\
  \n在本小时你将学习：\n\n![Image](img/image00525.jpeg) 学习 Minecraft 中的配方系统\n\n![Image](img/image00525.jpeg)\
  \ 制作配方\n\n![Image](img/image00525.jpeg) 创建无形配方\n\n![Image](img/image00525.jpeg)\
  \ 创建熔炼配方\n\n![Image](img/image00525.jpeg) 使用特殊的 `ItemStack`\n\n![Image](img/image00525.jpeg)\
  \ 更改地下城的生物生成点\n\n![Image](img/image00525.jpeg) 更改箱子物品\n\n![Image](img/image00525.jpeg)\
  \ 在 mod 文件检查结果\n\n在本小时中，你将有机会编写自己的代码，真正开始制作自己的 mod。这一小时包含了一些最基础的 Minecraft 修改，包括配方、地下城可能性以及生成的箱子。得益于\
  \ Forge，你可以在 Minecraft 中添加各种配方。你还可以更改地下城中生成的生物。这可以用于添加你自己的生物，你也可以创建（例如）苦力爬地下城。最后，Forge\
  \ 还允许你更改任何原版生成箱子的内容。原版（Vanilla）是指没有安装任何 mod 的 Minecraft。\n\n## 学习 Minecraft 中的配方\n\
  \n在 Minecraft 中，有多种类型的配方。熔炼铁矿石与用它制作铁镐之间是有区别的。这应该是逻辑性的，因为你在不同的方块中进行这些操作。然而，制作木板等物品与制作镐之间也存在区别。\n\
  \n配方有三种类型：\n\n*   **合成（Crafting）**配方是在特定图案中使用某些物品或方块的配方。这些配方的另一个称为标准配方或形状配方。合成配方的一个例子是铁镐。\n\
  *   **无形（Shapeless）**配方是没有定义形状的配方。它们也需要特定的物品和方块，但图案并不重要。无形配方的例子是更改羊毛的颜色。\n*   **熔炼（Smelting）**配方全部在熔炉中使用。熔炼配方没有形状，且输入永远不会超过一个物品或方块。熔炼配方的例子是金锭。\n\
  \n对于所有类型的配方，你只能返回一个物品或方块，但你可以返回多个相同的物品或方块。\n\n### 制作配方\n\n在本节中，你终于开始实际对游戏进行 mod\
  \ 开发了。配方可能不是巨大的变化，但几个组合配方可以改变游戏的玩法——特别是当与自定义物品结合时，这些将在第 4 小时 的“制作你的第一个物品”中解释。\n\n\
  你必须在 mod 文件中添加配方代码。列表 3.1 是来自第 2 小时“为 Forge 建立基础](#part0013.xhtml_ch02)”的 mod 文件，但去掉了\
  \ `System.out.println` 行。\n\n**列表 3.1 清洁的 mod 文件**\n\n点击此处查看代码图像\n\n```java\npackage\
  \ com.wuppy.samsmod;\n\nimport net.minecraft.init.Blocks;\n\nimport cpw.mods.fml.common.Mod;\n\
  \nimport cpw.mods.fml.common.Mod.EventHandler;\n\nimport cpw.mods.fml.common.event.FMLInitializationEvent;\n\
  \n@Mod(modid = SamsMod.MODID, version = SamsMod.VERSION)\npublic class SamsMod\n\
  {\n    public static final String MODID = \"wuppy29_samsmod\";\n    public static\
  \ final String VERSION = \"1.0\";\n\n    @EventHandler\n    public void init(FMLInitializationEvent\
  \ event)\n    {\n}\n```\n\n\n\n以下代码段展示了使用较小网格、空隙和多个组件的示例：\n\n点击此处查看代码图片\n\n```\n\
  GameRegistry.addRecipe(new ItemStack(Items.arrow),\n    \"YZ\",\n    \"X \",\n \
  \   'X', Items.flint, 'Y', Items.stick, 'Z', Blocks.leaves\n);\n```\n\n这允许你在玩家物品栏中使用叶子合成箭头。图\
  \ 3.2 显示了该配方的制作过程。\n\n![Image](img/image00541.jpeg)\n\n**图 3.2** 玩家物品栏中较小的配方。\n\n\
  此外，你可能希望在配方中拥有额外的选项。例如，你可能希望返回的 `ItemStack` 大小大于 1。对于配方，你可能感兴趣的另外两点是使用的物品和结果物品或区块的元数据（metadata）。你可以在以下代码段的单个配方中看到这些内容：\n\
  \n点击此处查看代码图片\n\n```\nGameRegistry.addRecipe(new ItemStack(Items.dye, 2, 1),\n  \
  \  \"XY\",\n    'X', Items.redstone, 'Y', new ItemStack(Items.dye, 1, 1)\n);\n```\n\
  \n此配方中使用的每个 `ItemStack` 现在都有三个参数。第一个仍然物品或区块。第二个是堆叠大小。结果物品或区块的堆叠大小可以大于 1，但使用的物品和区块的堆叠大小始终为\
  \ 1。第三个参数是物品的伤害值（damage）。元数据从 0 开始计数，直到 15。此配方将一个石头和一个染料组合以制作两个染料。因此，伤害值为 1。\n\n\
  这个配方看起来可能不符合逻辑，因为它只有在染料位于右侧时才有效。对于这类配方，我们通常使用无形配方。\n\n### 创建无形配方\n\n无形配方的工作方式与标准配方类似。它们也设置在\
  \ `GameRegistry` 中并采用相同的参数。以下代码是一个无形配方的示例：\n\n点击此处查看代码图片\n\n```\nGameRegistry.addShelessRecipe(new\
  \ ItemStack(Items.dye, 2, 1),\n    Items.redstone, new ItemStack(Items.dye, 1, 1)\n\
  );\n```\n\n在无形配方中，不需要字母或制作网格。只需将 `Item`、`Block` 或 `ItemStack` 对象放在输入 `ItemStack`\
  \ 之后并用逗号分隔即可。除此之外，它的工作方式完全相同。在游戏中，你可以在玩家物品栏中制作这个配方，它看起来与 图 3.3 相似。\n\n![Image](img/image00542.jpeg)\n\
  \n**图 3.3** 无形配方。\n\n### 创建熔炼配方\n\nMinecraft 中的最后配方类型是熔炼配方。熔炼配方只有一个输入和一个输出槽。输入可以只有堆叠大小为\
  \ 1，而输出可以大于 1。另一个需要注意的是，熔炼配方会产生经验。数量也需要为熔炼配方进行设置。以下代码是熔炼配方的示例：\n\n点击此处查看代码图片\n\n\
  ```\nGameRegistry.addSmelting(Blocks.stone, new ItemStack(Blocks.stone), 0.1F);\n\
  ```\n\n第一个参数可以是 `Item`、`Block` 或 `ItemStack`，但大小始终为 1。第二个参数必须是 `ItemStack`，在这里你可以对它进行任何操作。最后一个参数是你从熔炼获得经验的\
  \ `float` 值。在 Java 中，`float` 基本上是一个数字。原版熔炼配方具有在 0.1F 到 1F 之间的经验，其中 0.1F 是圆石变成石砖的配方，1F\
  \ 是钻石矿石的配方。图 3.4 显示了游戏中的此配方。\n\n![Image](img/image00543.jpeg)\n\n**图 3.4** 熔炼配方。\n\
  \n### 使用特殊的 ItemStack\n\n在配方中使用特殊的 `ItemStack` 是可能的。要做到这一点，你必须首先创建一个 `ItemStack`\
  \ 对象，然后将其用于配方。以下示例代码通过一把石剑和火燧创建一个锐利度为 1 的石剑。此代码使用了新类，请确保已导入它。\n\n点击此处查看代码图片\n\n\
  ```\nItemStack enchantedSword = new ItemStack(Items.stone_sword);\nenchantedSword.setDamage(1);\n\
  GameRegistry.addShelessRecipe(enchantedSword, Items.stone_sword, Items.flint);\n\
  ```\n\n\n\n\n在 `Forge` 中，可以使用另一个非常实用的文件来更改几乎任何原版生成箱子的内容。\n\n## 移除物品\n\n以下代码段展示了如何从箱子中移除物品的示例（请务确保已导入新文件）：\n\
  \n点击此处查看代码图片\n\n```java\nChestGenHooks.removeItem(ChestGenHooks.DUNGEON_CHEST, new\
  \ ItemStack(Items.saddle));\n```\n\n`removeItem` 是 `ChestGenHooks` 中的一个方法，接受两个参数。第一个参数是\
  \ `String`。该 `String` 指定了要从哪个箱子中移除物品。你可以手动输入它，但建议使用 `ChestGenHooks` 类中的变量之一，因为这些变量可能会变化，使用变量可以防止代码在你不经意觉的情况下崩溃。\n\
  \n第二个参数是必须从箱子中移除的物品 `ItemStack`。\n\n## 添加物品\n\n就像处理地牢怪物一样，你也可以在此处向箱子中添加新物品。以下代码展示了如何操作：\n\
  \n点击此处查看代码图片\n\n```java\nChestGenHooks.addItem(ChestGenHooks.DUNGEON_CHEST, new\
  \ WeightedRandomChestContent(new ItemStack(Blocks.cobblestone), 25, 50, 10));\n\
  ```\n\n此方法需要两个参数。第一个与 `removeItem` 相同，是指定箱子的字符串。第二个参数是 `WeightedRandomChestContent`。这是另一个需要四个参数的文件。\n\
  \n`WeightedRandomChestContent` 的第一个参数是包含要生成的物品或方块的 `ItemStack`。第二个参数是生成时的最小堆叠数量。第三个参数是最大堆叠数量。最后一个参数是它被选中的概率。例如，火药的几概率为\
  \ 10，而金苹果的几概率为 1。\n\n## 检查 Mod 文件中的结果\n\n完成所有这些操作后，Mod 文件看起来应该如下所示：\n\n点击此处查看代码图片\n\
  \n```java\npackage com.wuppy.samsmod;\n\nimport net.minecraft.enchantment.Enchantment;\n\
  import net.minecraft.init.Blocks;\nimport net.minecraft.init.Items;\nimport net.minecraft.item.ItemStack;\n\
  import net.minecraft.util.WeightedRandomChestContent;\nimport net.minecraftforge.common.ChestGenHooks;\n\
  import net.minecraftforge.common.DungeonHooks;\nimport cpw.mods.fml.common.Mod;\n\
  import cpw.mods.fml.common.Mod.EventHandler;\nimport cpw.mods.fml.common.event.FMLInitializationEvent;\n\
  import cpw.mods.fml.common.registry.GameRegistry;\n\n@Mod(modid = SamsMod.MODID,\
  \ version = SamsMod.VERSION)\npublic class SamsMod\n{\n    public static final String\
  \ MODID = \"wuppy29_samsmod\";\n    public static final String VERSION = \"1.0\"\
  ;\n\n    @EventHandler\n    public void init(FMLInitializationEvent event)\n   \
  \ {\n        //Recipes\n        GameRegistry.addRecipe(new ItemStack(Items.apple),\n\
  \            \"XXX\",\n            \"XXX\",\n            \"XXX\",\n            'X',\
  \ Blocks.leaves\n        );\n        GameRegistry.addRecipe(new ItemStack(Items.arrow),\n\
  \            \"YZ\",\n            \"X \",\n            'X', Items.flint, 'Y', Items.stick,\
  \ 'Z', Blocks.leaves\n        );\n        GameRegistry.addShapelessRecipe(new ItemStack(Items.dye,\
  \ 2, 1),\n            Items.redstone, new ItemStack(Items.dye, 1, 1)\n        );\n\
  \        GameRegistry.addSmelting(Blocks.stone, new ItemStack(Blocks.stonebrick),\
  \ 0.1F);\n        ItemStack enchantedSwordItemStack = new ItemStack(Items.stone_sword);\n\
  \        enchantedSwordItemStack.addEnchantment(Enchantment.sharpness, 1);\n   \
  \     GameRegistry.addShapelessRecipe(enchantedSwordItemStack,\n            Items.flint,\
  \ Items.stone_sword\n        );\n        //Dungeon changes\n        DungeonHooks.remove(\"\
  Spider\");\n        DungeonHooks.add(\"Creeper\", 100);\n        ChestGenHooks.removeItem(ChestGenHooks.DUNGEON_CHEST,\
  \ new ItemStack(Items.saddle));\n        ChestGenHooks.addItem(ChestGenHooks.DUNGEON_CHEST,\
  \ new WeightedRandomChestContent(new ItemStack(Blocks.cobblestone), 25, 50, 10));\n\
  \    }\n}\n```\n\n\n\n物品在《我的世界》中非常重要，但基础物品的作用并不大。玩家可以持有它，可以把它掉在地面上并在配方中使用，但除了这些之外，最基础的物品并没有多少功能。然而，你可以*通过*基础物品*创造*极其有趣且实用的东西。要做到这一点，你首先需要知道如何制作基础物品，本小时涵盖了这一点。接下来的三个小时涵盖了一些特殊物品。第\
  \ 6 小节“制作食物物品”将解释如何创建食物物品。第 7 小节“制作你自己的工具”涵盖了具体如何制作铁镐和其他各种工具，而第 8 小节“创建护甲”详细介绍了如何创建护甲。尽管本书侧重于这些物品，但你可以制作的不同类型的物品以及你用它们做的事情是无尽的。\n\
  \n现在你已经知道物品是什么了，你应该应该熟悉一些特殊情况。例如，蘑菇看起来像物品，但它们实际上是方块，因为它们可以被放置。\n\n方块是一个无法移动的 1 ×\
  \ 1 × 1 米立方体。如果你对方块有更详细的解释，请阅读第 9 小节“制作你的第一个方块”的开头。\n\n***\n\n注意：方块与物品\n\n《我的世界》的一个有趣事实是，当你拥有方块时，它们实际上都是物品。\n\
  \n***\n\n箭头看起来不像物品，但它确实是。当箭头在背包中时，它是物品。然而，当用弓或发射器发射箭头时，它变成了一个实体。正如提到的，物品可以是工具、食物以及许多东西。物品还可以用于例如例如生成实体，这就是《我的世界》中实体蛋的作用。\n\
  \n简而言之，实体是《我的世界》世界中移动的东西。如果你想知道更多关于实体的信息，请阅读第 17 小节“学习实体”的开头。\n\n了解你可以用物品做什么和不能做什么是非常重要的。想象你编写了一个大型而复杂的物品。然后你发现你想对它做的事情通过物品是无法实现的，而你实际上需要的是一个方块。如果你熟悉物品可以做什么和不能做什么，你就可以提前计划创建你需要的东西——并避免以后的挫败！\n\
  \n### 创建基础物品\n\n是时候开始创建你自己的物品了。要开始之前，从你的 mod 文件开始。在两个 `String` 变量下方、`init` 方法上方，创建一个名为\
  \ `preInit` 的新方法。该方法的参数必须是 `FMLPreInitializationEvent`。不要忘记在方法上方添加 `@EventHandler`\
  \ 注解，否则你的物品将在不显示任何错误的情况下无法工作。一旦完成，文件看起来应该像列表 4.1 所示。\n\n**列表 4.1 带有 preInit 方法的\
  \ Mod 文件**\n\n点击此处查看代码图片\n\n***\n\n```java\npackage com.wuppy.samsmod;\n\nimport\
  \ net.minecraft.enchantment.Enchantment;\n\nimport net.minecraft.init.Blocks;\n\n\
  import net.minecraft.init.Items;\n\nimport net.minecraft.item.ItemStack;\n\nimport\
  \ net.minecraft.util.WeightedRandomChestContent;\n\nimport net.minecraftforge.common.ChestGenHooks;\n\
  \nimport net.minecraftforge.common.DungeonHooks;\n\nimport cpw.mods.fml.common.Mod;\n\
  \nimport cpw.mods.fml.common.Mod.EventHandler;\n\nimport cpw.mods.fml.common.event.FMLInitializationEvent;\n\
  \nimport cpw.mods.fml.common.event.FMLPreInitializationEvent;\n\nimport cpw.mods.fml.common.registry.GameRegistry;\n\
  \n@Mod(modid = SamsMod.MODID, version = SamsMod.VERSION)\n\npublic class SamsMod\n\
  {\n    public static final String MODID = \"wuppy29_samsmod\";\n\n    public static\
  \ final String VERSION = \"1.0\";\n\n    @EventHandler\n    public void preInit(FMLPreInitializationEvent\
  \ event)\n    {\n    }\n\n    @EventHandler\n    public void init(FMLInitializationEvent\
  \ event)\n    {\n        //Recipes\n        GameRegistry.addRecipe(new ItemStack(Items.apple),\n\
  \                \"XXX\",\n                \"XXX\",\n                \"XXX\",\n\
  \                'X', Blocks.leaves);\n        GameRegistry.addRecipe(new ItemStack(Items.arrow),\n\
  \                \"YZ\",\n                \"X \",\n                'X', Items.flint,\
  \ 'Y', Items.stick, 'Z', Blocks.leaves);\n        GameRegistry.addShelessRecipe(new\
  \ ItemStack(Items.dye, 2, 1),\n                Items.redstone, new ItemStack(Items.dye,\
  \ 1, 1));\n        GameRegistry.addSmelting(Blocks.stone, new ItemStack(Blocks.stonebrick),\
  \ 0.1F);\n        ItemStack enchantedItemStack = new ItemStack(Blocks.stonebrick);\n\
  \        enchantedItemStack.addEnchantment(Enchantment.sharpness, 1);\n        GameRegistry.addShelessRecipe(enchantedItemStack,\n\
  \                Items.flint);\n        GameRegistry.addSmelting(Blocks.stonebrick,\
  \ new ItemStack(Blocks.stonebrick), 0.1F);\n        DungeonHooks.removeDungeon(\"\
  Spider\");\n        DungeonHooks.addDungeon(\"Creeper\");\n        ChestGenHooks.addItem(new\
  \ ItemStack(Items.saddle));\n    }\n}\n```\n*(注：由于原文代码块中存在逻辑混乱和重复错误，翻译时已根据代码逻辑进行了最小化修正以保持可读性)*\n\
  \n\n\n第二行代码通过 `GameRegistry` 文件将物品注册到 Forge 中，这确保了 Minecraft 知道该物品的存在并可以使用它。这次使用的方法是\
  \ `registerItem`，它接受两个参数。第一个参数是一个 `Item` 对象，第二个参数是它的名称。名称可以是你想要的任何内容，但最好的命名方式是使用物品的实际名称。确保物品注册表中没有重复的名称非常重要。如果有另一个名为\
  \ `Key` 的物品，它可能无法正常工作。不过，Forge 会自动在你处注册时使用的名称前面添加 `modid`。这确保了多个模组可以拥有名为 `Key` 的物品而不会产生冲突。如果书中提到了\
  \ `item registry line`，指的就是这一行。\n\n以下代码显示了添加物品后的 `preInit` 方法和新变量。文件中的其他代码均相同，除了有几个新新导入（imports）外：\n\
  \n点击此处查看代码图片\n\n```java\npublic static Item key;\n\n@EventHandler\npublic void preInit(FMLPreInitializationEvent\
  \ event)\n{\n    key = new ItemKey();\n    GameRegistry.registerItem(key, \"Key\"\
  );\n}\n```\n\n### 创建物品文件\n\n为了修复物品初始化行中类名下方的错误，你需要根据初始化行中使用的名称创建一个物品文件。要创建这样的文件，将鼠标悬停在错误上并点击\
  \ `Create Class ‘...’.`。这将打开“New Java Class”窗口。在此窗口中，点击 Finish。现在你将拥有一个文件，它的内容应该像列表\
  \ 4.2。\n\n**列表 4.2 空物品文件**\n\n点击此处查看代码图片\n\n```java\npackage com.wuppy.samsmod;\n\
  \nimport net.minecraft.item.Item;\n\npublic class ItemKey extends Item\n{\n\n}\n\
  ```\n\n要使物品具有完全完备的功能，你必须向此文件中添加一个构造函数。构造函数是一个没有返回类型的方法，且方法名必须与类文件名完全相同。构造函数是 Java\
  \ 中的一种特殊方法，用于为类创建对象。每当 `Item` 对象被创建时，此方法都会运行。`ItemKey` 的空构造函数如下：\n\n```java\npublic\
  \ ItemKey()\n{\n}\n```\n\n构造函数中必须有两行代码，Minecraft 才能识别它为一个物品并实际使用它。第一行确保物品具有某种名称：\n\
  \n点击此处查看代码图片\n\n```java\nsetUnlocalizedName(SamsMod.MODID + \"_\" + \"key\");\n\
  ```\n\n这会将物品的未本地名称设置为某个值。物品需要一个未本地名称，否则它不会出现在任何地方。没有名称就不是一个物品。确保每个模组中每个物品的未本地名称都是是重要的。为了确保这一点，请使用你的模组的\
  \ `modid` 后跟一个下划线，最后是模组文件中物品变量的名称。这确保了不可能出现重复，因为每个安装的模组其 `modid` 都是不同的，而且你不能有两个同名的变量。\n\
  \n当你有一个物品时，它不会自动显示在创造模式（Creative）菜单中。这非常有用，因为并不是所有东西都应该出现在创造模式标签页中。然而，对于大多数物品，你可能希望它在某个地方可见。要做到这一点，你需要以下代码：\n\
  \n点击此处查看代码图片\n\n```java\nsetCreativeTab(CreativeTabs.tabMisc);\n```\n\n此方法需要一个参数，即一个\
  \ `CreativeTab`。要获取正确的 `CreativeTab`，你可能需要查看列出所有标签的文件。`ItemKey` 将被添加到杂项（Miscellaneous）标签页中。\n\
  \n如果你现在启动游戏，你会发现创造模式菜单中有一个具有奇怪紫紫色纹理的物品。它的名称也很奇怪。\n\n### 修复名称\n\n要修复物品的名称，你必须为它添加本地化（localization）。默认情况下，Minecraft\
  \ 中的物品名称为 `item.unlocalizedname.name`。这不是一个理想的名称，几乎总是应该被更改。你通过添加本地化来实现这一点。Minecraft\
  \ 为每种语言都有不同的本地化。如果你使用不同于 `en_US`（默认的美国英语）的本地化来玩 Minecraft，它会首先尝试查找该语言下的本地化。如果没找到，它会尝试从\
  \ `en_US` 的本地化中获取。如果那里也找不到，则使用默认名称。\n\n修复物品名称将是大量工作。首先，导航到第 1 小时中“设置 Minecraft 开发环境”创建的\
  \ forge 文件夹。然后进入 `src/main/resources`。图 4.1 显示了正确的文件夹结构。\n\n![Image](img/image00545.jpeg)\n\
  \n**图 4.1** 资源的文件夹结构。\n\n在此文件夹中，你需要创建几个自定义文件夹。第一个文件夹是 `assets`。在 `assets` 文件夹中，你需要创建一个以你的\
  \ modid 命名的文件夹，这与模组文件中的 `MODID` 相同。你需要创建的最后一个文件夹是 `lang`。如果你现在进入 Eclipse，你应该看到一个带有你使用的名称的包。正如书中所示，文件夹结构为\
  \ `assets/wuppy29_samsmod/lang`。它看起来应该像图 4.2。\n\n![Image](img/image0546.jpeg)\n\n\
  **图 4.2** lang 的文件夹结构。\n\n**注意：文件夹结构**\n\n确保文件夹结构遵循完全相同的结构并正确列出 `modid`。如果文件夹名称有细微错误，名称和纹理将无法工作。\n\
  \n一旦你确定文件夹结构正确，你需要添加一个文件。该文件应命名为 `en_US.lang`。\n\n**注意：文件扩展名**\n\n创建后，双击文件扩展名确保是\
  \ `.lang` 而不是 `.txt`。如果是 `.txt`，你的名称本地化将无法工作。\n\n使用你喜欢的文本编辑器打开文件。如果你在游戏中查看物品名称，它是\
  \ `item.UnlocalizedName.name`。创建的 `.lang` 文件用于为物品添加本地化名称。要为键创建本地化名称，你需要在 `.lang`\
  \ 文件中加入：\n\n点击此处查看代码图片\n\n```text\nitem.wuppy29_samsmod_key.name=Key\n```\n\n第一部分是未本地化时的显示名称。之后，添加一个等号，然后在另一侧添加名称。确保未本地化名称、等号和本地化名称之间没有空格。如果有，它将无法工作或看起来很奇怪。在该文件中，未本地化和本地化名称本身可以包含空格。\n\
  \n**注意：翻译**\n\n如果你想让你的模具有多种本地化，你必须添加额外的 `.lang` 文件。该文件的名称是语言代码，例如 `en` 或 `nl`，后面跟着国家代码，例如\
  \ `US` 或 `NL`。所有的语言文件名都可以在 Minecraft wiki 的 [`minecraft.gamepedia.com/Language`](http://minecraft.gamepedia.com/Language)\
  \ 获取。\n\n现在当你启动游戏并查看创建的物品时，名称将被修复了。\n\n### 添加纹理\n\n\n\n\n\n要修复物品上奇怪的紫色纹理，你必须完成几件事。首先，你必须亲自创建一个新的物品纹理。虽然具体如何创建最佳纹理不在本书的涵盖范围内，但本节将介绍基础知识。你需要使用一种你喜欢的图像编辑器软件，例如\
  \ `GIMP`、`Photoshop` 或 `Paint`。在这些程序中的某一个，为你想要的物品创建一个 16×16 像素的图像。你在里面放什么其实并不重要。然而，重要的是保存时的文件格式和文件名。文件格式必须是\
  \ `.png`。文件名必须是你可以在代码中轻松使用的名称。在书中，除非另有说明，否则名称将与变量名相同。密钥使用的物品纹理称为 `key.png`，如图 4.3\
  \ 所示。\n\n![Image](img/image00547.jpeg)\n\n**图 4.3** 密钥纹理。\n\n现在你已经有了物品的纹理，需要把它放在\
  \ Forge 能够找到它的地方。这个位置与 `.lang` 文件的位置非常相似。在 forge 文件夹中，打开以下文件夹：`src\\main\\resources\\\
  assets\\wuppy29_samsmod`，将 `wuppy29_samsmod` 部分替换为你模组的 `modid`。路径看起来类似于图 4.4。\n\n\
  ![Image](img/image00548.jpeg)\n\n**图 4.4** Modid 文件夹结构。\n\n在这个文件夹中，应该是你早之前创建的 `lang`\
  \ 文件夹。这次，创建一个名为 `textures` 的文件夹。在该文件夹中，创建一个名为 `items` 的最终文件夹。将你之前创建的纹理文件放在其中。对于\
  \ `ItemKey`，纹理如图 4.3 所示。它的文件夹结构应该类似于图 4.5。\n\n![Image](img/image00549.jpeg)\n\n\
  **图 4.5** 物品纹理文件夹结构。\n\n现在纹理已经准备好可以使用了。现在，你只需要告诉 Forge 为该物品获取该纹理。为了做到这一点，你需要在构造函数中添加一行代码。它看起来如下所示：\n\
  \n点击此处查看代码图片\n\n```\nsetTextureName(SamsMod.MODID + \":\" + \"key\");\n```\n\n纹理名称必须首先是\
  \ `modid`，它应该存储在你模组文件的一个变量中。然后你需要一个冒号和物品的未本地化名称。\n\n现在，构造函数看起来像这样：\n\n点击此处查看代码图片\n\
  \n```java\npublic ItemKey()\n{\n    setUnlocalizedName(SamsMod.MODID + \"_\" + \"\
  key\");\n    setTextureName(SamsMod.MODID + \":\" + \"key\");\n    setCreativeTab(CreativeTabs.tabMisc);\n\
  }\n```\n\n一旦添加了这行代码，你的物品就可以正常工作了。图 4.6 显示了游戏中的密钥。\n\n![Image](img/image00550.jpeg)\n\
  \n**图 4.6** Minecraft 中的 `ItemKey`。\n\n这个文件的代码写得很好，因为同一个 `String` 被使用了两次。如果你想更改物品的名称，必须更改两个位置的名称。为了让这简单一点，创建一个包含\
  \ `key` 的 `private String`。然后将 `String` 变量放入这些方法中。\n\n***\n\n### 动手尝试：重命名你的物品\n\n\
  更改你的物品名称并相应更改所有内容。\n\n**1.** 修改 `String` 名称。\n\n**2.** 修改本地化和纹理。\n\n***\n\n完成“动手尝试”活动以及本小时内的所有其他任务后，整个物品文件应该像列表\
  \ 4.3 所示。\n\n**列表 4.3 完成的 ItemKey 文件**\n\n点击此处查看代码图片\n\n```java\npackage com.wuppy.samsmod;\n\
  \nimport net.minecraft.creativetab.CreativeTabs;\nimport net.minecraft.item.Item;\n\
  \npublic class ItemKey extends Item\n{\n    private String name = \"key\";\n\n \
  \   public ItemKey()\n    {\n        setUnlocalizedName(SamsMod.MODID + \"_\" +\
  \ name);\n        setTextureName(SamsMod.MODID + \":\" + name);\n        setCreativeTab(CreativeTabs.tabMisc);\n\
  \    }\n}\n```\n\n***\n\n现在当你启动游戏时，你应该看到具有正确名称和正确纹理的物品。\n\n### 总结\n\n在本小时中，你学习了如何创建一个物品。到此时，你应该理解\
  \ Minecraft 中的物品是什么以及你能对它们做什么。你还应该能够添加一个基础物品并赋予它纹理。\n\n### 问答\n\n**问。向 Minecraft\
  \ 中添加的物品有数量限制吗？**\n\n**答。** 有的，但几乎是不可能的。然而，你应该总是尽可能少少不同的物品。第 5 小节“在 Minecraft 中创建多个物品”。\n\
  \n\n\n\n\n要向同一个文件添加多个项目，你需要对在第 4 小节](#part0016.xhtml_ch04)中创建的项目文件进行细小的修改。列表 5.1\
  \ 显示了第 4 小节结束的文件。\n\n### 列表 5.1 来自第 4 小节的 ItemKey 文件\n\n点击此处查看代码图片\n\n```java\n\
  package com.wuppy.samsmod;\n\nimport net.minecraft.creativetab.CreativeTabs;\n\n\
  import net.minecraft.item.Item;\n\npublic class ItemKey extends Item\n{\n    private\
  \ String name = \"key\";\n    public ItemKey()\n    {\n        setUnlocalizedName(SamsMod.MODID\
  \ + \"_\" + name);\n        setTextureName(SamsMod.MODID + \":\" + name);\n    \
  \    setCreativeTab(CreativeTabs.tabMisc);\n    }\n}\n```\n\n将此文件转换为可以注册多个项目的文件非常简单。你不能让多个项目具有相同的本地化名称；`name`\
  \ 变量必须为每个 `ItemKey` 实例是不同的。以下步骤可以实现这一点：\n\n1.  `String name` 变量。\n2. 为构造函数添加一个名为\
  \ `itemName` 的 `String`。\n3. 在使用 `name` 的地方使用 `itemName`。\n\n完成后，项目文件应该像列表 5.2 所示。\n\
  \n### 列表 5.2 用于多个项目的 ItemKey 文件\n\n点击此处查看代码图片\n\n```java\npackage com.wuppy.samsmod;\n\
  \nimport net.minecraft.creativetab.CreativeTabs;\n\nimport net.minecraft.item.Item;\n\
  \npublic class ItemKey extends Item\n{\n    public ItemKey(String itemName)\n  \
  \  {\n        setUnlocalizedName(SamsMod.MODID + \"_\" + itemName);\n        setTextureName(SamsMod.MODID\
  \ + \":\" + itemName);\n        setCreativeTab(CreativeTabs.tabMisc);\n    }\n}\n\
  ```\n\n当你拥有这样的文件时，mod 文件中的 `ItemKey()` 部分会出现错误。该错误是因为构造函数中缺少 `String`。要修复此问题，请在括号中添加\
  \ `String`。对于该项目，`itemName` 将是 `greyKey`。这意味着纹理和本地化名称必须从 `key` 改为 `greyKey`。为了清晰起见，项目变量也将重命名为\
  \ `greyKey`。更改此项后，`preInit` 行应该如下：\n\n点击此处查看代码图片\n\n```java\npublic static Item\
  \ greyKey;\n\n@EventHandler\npublic void preInit(FMLInitializationEvent event)\n\
  {\n    greyKey = new ItemKey(\"greyKey\");\n    GameRegistry.registerItem(greyKey,\
  \ \"GreyKey\");\n}\n```\n\n要添加第二个项目，只需复制项目代码并在每处更改名称。以下代码包含了名为 `redKey` 的第二个项目。本地化和纹理已按相同名称添加。\n\
  \n点击此处查看代码图片\n\n```java\npublic static Item greyKey;\npublic static Item redKey;\n\
  \n@EventHandler\npublic void preInit(FMLInitializationEvent event)\n{\n    greyKey\
  \ = new ItemKey(\"greyKey\");\n    redKey = new ItemKey(\"redKey\");\n    GameRegistry.registerItem(greyKey,\
  \ \"GreyKey\");\n    GameRegistry.registerItem(redKey, \"RedKey\");\n}\n```\n\n\
  `en_US.lang` 文件如下：\n\n点击此处查看代码图片\n\n```text\nitem.wuppy_samsmod_greyKey.name=Grey\
  \ Key\nitem.wuppy_samsmod_redKey.name=Red Key\n```\n\n最后，`redKey.png` 已添加到 items\
  \ 文件夹中，与现有纹理相同的位置。它看起来图 5.1。\n\n![Image](img/image00551.jpeg)\n**图 5.1 红色项目。**\n\
  \n文件夹路径应该被添加并看起来像图 5.2。\n\n![Image](img/image00552.jpeg)\n**图 5.2 项目纹理路径。**\n\n\
  ### 动手尝试：创建项目\n\n你将在本书中使用几个项目，例如从方块或实体掉落。创建一个名为 `samdust` 的项目另一个 `samingot`。使用你在\
  \ `ItemKey` 中中学的知识，使用单个项目文件 `ItemSamGeneric` 创建它们。\n\n项目在 mod 文件中如下所示：\n\n点击此处查看代码图片\n\
  \n```java\npublic static Item samdust;\npublic static Item samingot;\n```\n\n以下代码需要添加到\
  \ `preInit` 方法中：\n\n点击此处查看代码图片\n\n```java\nsamdust = new ItemSamGeneric(\"samdust\"\
  );\nsamingot = new ItemSamGeneric(\"samingot\");\nGameRegistry.registerItem(samdust,\
  \ \"SamDust\");\nGameRegistry.registerItem(samingot, \"SamIngot\");\n```\n\n最后，`ItemSamGeneric`\
  \ 将看起来像列表 5.3。\n\n### 列表 5.3 ItemSamGeneric\n\n点击此处查看代码图片\n\n```java\npackage com.wuppy.samsmod.items;\n\
  \nimport com.wuppy.samsmod.SamsMod;\nimport net.minecraft.creativetab.CreativeTabs;\n\
  import net.minecraft.item.Item;\n\npublic class ItemSamGeneric extends Item\n{\n\
  \    public ItemSamGeneric(String name)\n    {\n        setUnlocalizedName(SamsMod.MODID\
  \ + \"_\" + name);\n        setTextureName(SamsMod.MODID + \":\" + name);\n    \
  \    setCreativeTab(CreativeTabs.tabMisc);\n    }\n}\n```\n\n这些项目的纹理显示在图 5.3 和 5.4\
  \ 中。图 5.5 和 5.6 显示了游戏中的项目。\n\n![Image](img/image00553.jpeg)\n**图 5.3 尘纹理。**\n\n\
  ![Image](img/image00554.jpeg)\n**图 5.4 锭纹理。**\n\n![Image](img/image00555.jpeg)\n\
  **图 5.5 尘在游戏中。**\n\n![Image](img/image00556.jpeg)\n**图 5.6 锭在游戏中。**\n\n现在你已经了解了什么是元数据，你应该在项目尝试中添加它。目前有两个项目几乎完全相同。使用不同的项目\
  \ ID 是浪费的。对于单个 mod 你不会达到限制，但许多人会同时运行 100 多个 mod。在这种情况下，项目总数可能会接近限制（30000）。因此，明智地使用尽可能少的不同项目。实现这一点最简单的方法是使用元数据。\n\
  \n### 为项目添加元数据\n\n元数据同时用于项目和方块。它可以用于在不使用多个项目 ID 的情况下拥有多个项目。元数据的例子是染料。它们本质上是同一个项目。与其使用\
  \ 16 个不同的 ID，所有的都保存在一个中。现在你知道元数据是什么，你应该在两个关键项目中添加它。要在项目中使用元数据，你必须更改几处。首先，你需要对构造函数进行一些更改。其次，你需要创建一个让每个项目具有不同名称的方法，这比现在要复杂一点。第三，你需要添加多个图像。最后，你需要告诉\
  \ Minecraft 有多少个元数据以及应该添加到创意菜单的数量。\n\n### 修改构造函数\n\n在构造函数中删除 `setTextureName` 行。构造函数的参数也应该被删除。完成这些操作后，构造函数应该如下所示：\n\
  \n点击此处查看代码图片\n\n```java\npublic ItemKey()\n{\n    setUnlocalizedName(SamsMod.MODID\
  \ + \"_\" + \"key\");\n    setCreativeTab(CreativeTabs.tabMisc);\n}\n```\n\n###\
  \ 注意：移除名称\n\n不要忘记更改任何对已构造函数的引用。在这种情况下，更改项目初始化行。\n\n你需要在构造函数中添加一个方法，名为 `setHasSubTypes`。该方法接受一个参数，类型为\
  \ `boolean`。`boolean` 可以可以是 `true` 也可以是 `false`。在这个方法中，它必须是 `true`。\n\n\n\n\n你必须将\
  \ `setUnlocalizedName` 方法中的代码改回原来的样子，即使用 `MODID + \"_\"` 并以物品名称结尾。这意味着 `ItemKey`\
  \ 只能用于一个带有元数据（metadata）的特定物品。让 `ItemKey` 支持多个带有元数据的物品将工作量巨大，在这种情况下，编写多个文件要简单得多。带有元数据的\
  \ `ItemKey` 的未本地化名称为 `key`。\n\n完成这些操作后，构造函数应该看起来像下面的代码。这段代码会在 `SamsMod` 中产生一个错误，你稍后会修复它。\n\
  \n点击此处查看图片\n\n```\npublic ItemKey()\n{\n    setUnlocalizedName(SamsMod.MODID + \"\
  _\" + \"key\");\n    setHasSubtypes(true);\n    setCreativeTab(CreativeTabs.tabMisc);\n\
  }\n```\n\n`setHasSubTypes` 确保物品可以拥有元数据。你还必须确保每个元数据都有不同的名称。\n\n### 修复名称\n\n现在你需要在\
  \ `ItemKey` 文件中添加一个新变量。使用元数据时，你需要一个可以存储每个子物品名称的变量。为了实现这一点，可以使用 `String` 数组。首先，像你处理\
  \ `String name` 那样创建一个基础的 `String` 变量。现在你必须将此变量改为 `String` 数组。这样做的方法是在 `String`\
  \ 后面添加 `[]`。现在，在逗号之后添加等号，然后两个大括号。在大括号中添加元数据的名称。因为它们是 `String` 类型，请用引号括元数据名称，并用逗号分隔不同的值。对于一个灰色和一个红色的钥匙，名称变量看起来如下代码段：\n\
  \n点击此处查看图片\n\n```\nprivate String[] name = {\"grey\", \"red\"};\n```\n\n接下来，为你之前从构造函数中删除的\
  \ `setUnlocalizedName` 方法添加一个替换项。你需要用来替换它的方法叫做 `getUnlocalizedName`。与普通物品使用的 `setUnlocalizedName`\
  \ 的区别在于，前者使用了 `setUnlocalizedName`，而这里的 `getUnlocalizedName` 被重写成了其他内容。带有元数据的物品的\
  \ `getUnlocalizedName` 代码应该像这样：\n\n点击此处查看图片\n\n```\npublic String getUnlocalizedName(ItemStack\
  \ par1ItemStack)\n{\n    int metadata = MathHelper.clamp_int(par1ItemStack.getItemDamage(),\
  \ 0, 15);\n    return super.getUnlocalizedName() + \".\" + name[metadata];\n}\n\
  ```\n\n`getUnlocalizedName` 是一个返回 `String` 的方法。该方法在 Minecraft 中被频繁使用。该方法接受一个参数，即\
  \ `ItemStack`。由于你正在编写方法，不需要担心它从哪里来。Minecraft 会在某处带着 `ItemStack` 调用 `getUnlocalizedName`。通常情况下，它会使用\
  \ `Item` 类中的方法，但如果是 `ItemKey`，它将使用 `ItemKey` 中的那个。\n\n此方法中有两行。第一行基本上获取参数中 `ItemStack`\
  \ 的元数据并将其存储在变量中。第二行稍微复杂一点。它以 `super.getUnlocalizedName` 开始。这会让 `Item` 中的 `getUnlocalizedName`\
  \ 执行。像普通物品一样，它返回物品的标准未本地化名称。然而，对于每个元数据物品，结果都是相同的，这会产生问题，因为 Minecraft 将无法将它们区分。为了修复这个问题，后面跟着一个点，最后是\
  \ `name` 变量中设置的名称。\n\n如之前所述，此方法是从 `Item` 类中的另一个方法重写而。如果 Minecraft 发生更新且 `Item` 类中的方法名称发生了变化，此方法将停止工作。然而，它不会通过你它没有在工作。为了确保你能注意到这种变化，应该在方法上方添加一个\
  \ `@Override` 注解。这可以确保如果方法发生了变化，它会报错。这听起来可能很糟糕，但它让跟踪 Minecraft 代码中的更改并在你的代码中相应进行更改变得容易得得多。因此，对于任何重写自你代码之外其他方法的方法，都应该添加\
  \ `@Override` 注解。\n\n### 修复纹理\n\n要修复纹理，你需要一个新的变量和两个新方法。变量很简单。它应该是一个私有的 `IIcon[]`。名称并不重要，但本书中将使用\
  \ `icons` 作为名称。`IIcon` 的一个问题是该文件只存在于 Minecraft 客户端。如果你尝试在服务器上创建此变量，它将会崩溃并提示找不到文件。为了修复这个问题，你必须在上方添加一个注解，指定它只能在客户端使用。该变量及其注解的形式如下：\n\
  \n```\n@SideOnly(Side.CLIENT)\nprivate IIcon[] icons;\n```\n\n### 注册图像\n\n现在你有一个空的\
  \ `IIcon` 数组。它必须被填充。它看起来如下：\n\n点击此处查看图片\n\n```\n@SideOnly(Side.CLIENT)\n@Override\n\
  public void registerIcons(IIconRegistry par1Registry)\n{\n    icons = new IIcon[name.length];\n\
  \    for(int i = 0; i < name.length; i++)\n    {\n        icons[i] = par1Registry.registerIcon(SamsMod.MODID\
  \ + \":key\" + name[i]);\n    }\n}\n```\n\n这个方法看起来可能很复杂，但其实很简单。你应该注意到，这个方法有两个注解：`@SideOnly`\
  \ 和 `@Override`。你始终可以在方法、变量或类上拥有多个注解。在这种情况下，它确保该方法只在客户端运行，并且当该方法在后续版本中不再存在时报错。\n\
  \n### 使用图像\n\n现在文件已经注册了多个图标，但如果不告诉它，物品不知道如何使用该数组。为了告诉它使用图标数组并为每个元数据提供不同的纹理，你需要以下方法：\n\
  \n点击此处查看图片\n\n```\n@Override\npublic IIcon getIconFromDamage(int par1)\n{\n    return\
  \ icons[par1];\n}\n```\n\n\n\n\n这是一个非常简单的方法，其功能正如其名义所示。它根据伤害值（damage value）获取图标。该方法中的\
  \ `par1` 参数是元数据，它根据该数字返回 `icons` 数组中的索引。\n\n如果你尝试使用一个没有名称且因此没有分配纹理的物品，该方法将会崩溃，所以请确保这种情况不会发生。\n\
  \n最后，你必须添加另一个方法，以确保物品的每个元数据都能创造模式（Creative menu）中显示。该方法的形式如下：\n\n点击此处查看代码图片\n\n\
  ```java\n@SuppressWarnings({ \"unchecked\", \"rawtypes\" })\n@SideOnly(Side.CLIENT)\n\
  @Override\npublic void getSubItems(Item par1, CreativeTabs par2CreativeTabs, List\
  \ par3List)\n{\n    for (int x = 0; x < name.length; x++)\n    {\n        par3List.add(new\
  \ ItemStack(this, 1, x));\n    }\n}\n```\n\n该方法包含一个你尚未见过的新注解，叫做 `@SuppressWarnings`。Minecraft\
  \ 的编码方式使得 Java 有相当多的警告。这些警告大部分完全不是问题，但对于许多人来说，到处都是黄色横线会非常困恼。`@SuppressWarnings`\
  \ 注解确保 `getSubItems` 方法中不会出现那些黄线。\n\n该方法包含一个 `for` 循环。第二个数字确保了循环次数不会超过物品的最大元数据。在\
  \ `for` 循环中，它将一个大小为 1 且带有循环体内部元数据的 `ItemKey ItemStack` 添加到 `par3List` 中。这确保了它出现在创造模式中。\n\
  \n### 添加元数据后的代码\n\n整个 `ItemKey` 文件应该看起来像 列表 5.4。\n\n### 列表 5.4 带有元数据的 ItemKey\n\n\
  点击此处查看代码图片\n\n```java\npackage com.wuppy.samsmod;\n\nimport java.util.List;\nimport\
  \ net.minecraft.client.renderer.texture.IIconRegister;\nimport net.minecraft.creativetab.CreativeTabs;\n\
  import net.minecraft.item.Item;\nimport net.minecraft.item.ItemStack;\nimport net.minecraft.util.IIcon;\n\
  import net.minecraft.util.MathHelper;\nimport cpw.mods.fml.relauncher.Side;\nimport\
  \ cpw.mods.fml.relauncher.SideOnly;\n\npublic class ItemKey extends Item\n{\n  \
  \  private String[] name = {\"grey\", \"red\"};\n\n    @SideOnly(Side.CLIENT)\n\
  \    private IIcon[] icons;\n\n    public ItemKey()\n    {\n        setUnlocalizedName(SamsMod.MODID\
  \ + \"_\" + \"key\");\n        setHasSubtypes(true);\n        setCreativeTab(CreativeTabs.tabMisc);\n\
  \    }\n\n    @Override\n    public String getUnlocalizedName(ItemStack par1ItemStack)\n\
  \    {\n        int metadata = MathHelper.clamp_int(par1ItemStack.getItemDamage(),\
  \ 0, 15);\n        return super.getUnlocalizedName() + \".\" + name[metadata];\n\
  \    }\n\n    @SideOnly(Side.CLIENT)\n    @Override\n    public void registerIcons(IIconRegister\
  \ par1IconRegister)\n    {\n        icons = new IIcon[name.length];\n        for(int\
  \ i = 0; i < icons.length; i++)\n        {\n            icons[i] = par1IconRegister.registerIcon(SamsMod.MODID\
  \ + \":\" + \"key\" + \" \" + name[i]);\n        }\n    }\n\n    @Override\n   \
  \ public IIcon getIconFromDamage(int par1)\n    {\n        return icons[par1];\n\
  \    }\n\n    @SuppressWarnings({ \"unchecked\", \"types\" })\n    @SideOnly(Side.CLIENT)\n\
  \    @Override\n    public void getSubItems(Item par1, CreativeTabs par2CreativeTabs,\
  \ List par3List)\n    {\n        for (int x = 0; x < name.length; x++)\n       \
  \ {\n            par3List.add(new ItemStack(this, 1, x));\n        }\n    }\n}\n\
  ```\n\n你还需要对 mod 文件进行几处更改。当你向 mod 文件中添加物品时，你使用了两次 `ItemKey`，这现在已不可行，因为两个物品都通过元数据合并在一起了。任何与\
  \ `redKey` 相关的代码将被删除，而 `greyKey` 将更改为 `key`。`GreyKey` 的 `registerItem` 名称也将更改为 `Key`。mod\
  \ 文件应该看起来像 列表 5.5。\n\n### 列表 5.5 带有元数据的 Mod 文件\n\n点击此处查看代码图片\n\n```java\npackage\
  \ com.wuppy.amsmod;\n\nimport net.minecraft.enchantment.Enchantment;\nimport net.minecraft.init.Blocks;\n\
  import net.minecraft.init.Items;\nimport net.minecraft.item.Item;\nimport net.minecraft.item.ItemStack;\n\
  import net.minecraft.util.WeightedRandom;\nimport net.forge.common.ChestGenHooks;\n\
  import net.forge.common.DungeonHooks;\nimport cpw.mods.fml.common.Mod;\nimport cpw.mods.fml.common.Mod.EventHandler;\n\
  import cpw.mods.fml.common.event.FMLInitializationEvent;\nimport cpw.mods.fml.common.event.FMLPreInitializationEvent;\n\
  import cpw.mods.fml.common.registry.GameRegistry;\n\n@Mod(modid = SamsMod.MODID,\
  \ version = SamsMod.VERSION)\npublic class SamsMod\n{\n    public static final String\
  \ MODID = \"wuppy29_amsmod\";\n    public static final String VERSION = \"1.0\"\
  ;\n    public static Item key;\n\n    @EventHandler\n    public void preInit(FMLPreInitializationEvent\
  \ event)\n    {\n        key = new ItemKey();\n        GameRegistry.registerItem(key,\
  \ \"Key\");\n    }\n\n    @EventHandler\n    public void init(FMLInitializationEvent\
  \ event)\n    {\n        //Recipes\n        GameRegistry.addRecipe(new ItemStack(Items.apple),\n\
  \            \"XXX\",\n            \"XXX\",\n            \"XXX\",\n            'X',\
  \ Blocks.leaves\n        );\n        GameRegistry.addRecipe(new ItemStack(Items.arrow),\n\
  \            \"YZ\",\n            \"X \",\n            'X', Items.flint, 'Y', Items.stick,\
  \ 'Z', Blocks.leaves\n        );\n        GameRegistry.addShapeless(new ItemStack(Items.apple),\n\
  \            Items.flint, Items.stick, Blocks.leaves\n        );\n    }\n}\n```\n\
  \n如果你现在启动游戏，你会发现两个物品都显示在创造模式中。然而，名称现在还没有生效。要修复这个问题，你必须更改 `.lang` 文件。对于 `ItemKey`，`.lang`\
  \ 文件如下：\n\n点击此处查看代码图片\n\nitem.wuppy29_amsmod_key.grey.name=Grey Key\nitem.wuppy29_amsmod_key.red.name=Red\
  \ Key\n\n\n\n\n\n## Q.物品的元数据最大数量是多少？\n\n## A.**一个物品的最大元数据数量大约也是 32,000 个。不过，你必须修改\
  \ `getUnlocalizedName` 方法中的元数据变量，使其不再限制为 15。\n\n## Q.方块之类的东西有元数据吗？\n\n## A.**是的，有的。这在第\
  \ 10 节 “智能地创建多个方块”中有所介绍。\n\n### 工作坊\n\n现在你已经知道如何智能地向 Minecraft 中添加多个物品。大多数模组都包含大量物品，因此掌握这些技术非常重要。\n\
  \n### 测验\n\n**1.如果你没有为物品的每个元数据使用不同的名称，会发生什么？**\n\n**2.如果你的物品显示黑色和紫色的纹理，你的哪里有问题？**\n\
  \n**3.你该如何判断纹理名称是否错误？**\n\n### 答案\n\n**1.** 对 Minecraft 来说，它们都是同一个，正因为如此，会发生一些非常奇怪的事情。\n\
  \n**2.** 物品的纹理要么名称不对，要么不在正确的文件夹中。确保检查文件夹结构是否遵循正确的规则。或者，确保纹理名称与物品的未本地化名称（unlocalized\
  \ names）一致。\n\n**3.** 使用 `System.out.println` 打印出 `registerIcons` 方法中冒号后面的部分。\n\n\
  ### 练习\n\n在本小时创建的物品添加第三个元数据。*提示：*你只需要编辑该物品文件即可。同时不要忘记编辑 `.lang` 文件并添加新纹理。\n\n##\
  \ 第 6 节 制作食物物品\n\n* * *\n\n在本节你将学习到：\n\n![Image](img/image00525.jpeg) 理解 Minecraft\
  \ 中的食物\n\n![Image](img/image00525.jpeg) 创建一个食物物品\n\n![Image](img/image00525.jpeg)\
  \ 添加药水效果\n\n* * *\n\n在本节中，你将学习如何制作你的第一个特殊物品：你将创建一个食物——浆果。你将在第 11 节 “让你的方块独一无二”中，当你为它创建一个灌木时使用这个物品。然后，在第\
  \ 14 节 “生成植物”中，你将学习如何让灌木出现在世界中以便最终可以使用。然而，在制作食物物品之前，你应该了解关于 Minecraft 食物的一些知识。\n\
  \n### 理解 Minecraft 中的食物\n\n当你玩 Minecraft 时，会在图形用户界面（GUI）中看到一个饥饿条。然而，游戏中实际上有两个条。可见的饥饿条在代码中被称为\
  \ `foodLevel`。另一个不可见的条被称为 `foodSaturationLevel`（饱和度）。这些数值的工作方式是：只要饱和度高于零，`foodLevel`\
  \ 就会保持不变，而 `foodSaturationLevel` 会下降。当 `foodLevel` 降到某个水平以下时，它要么停止下降，要么让你挨饿，这取决于你所玩的难度等级。当\
  \ `foodSaturationLevel` 变为零时，除了 `foodLevel` 开始下降外，什么都不会发生。\n\n当你吃掉一个食物物品时，饱和度和饥饿值都会增加。某些食物物品会让饱和度增加很多，但饥饿值只增加一点。另一些食物物品会让饱和度增加一点，但饥饿值增加很多。当\
  \ `foodLevel` 为 1 且饱和度增加时，`foodLevel` 保持不变；即使你应该因为 `foodLevel` 受到饥饿伤害，你也不会受到伤害。在制作合适的食物物品时，确保你的物品在饥饿值和饱和度之间达到平衡是非常重要的。\n\
  \n你应该知道关于食物的另一个重要细节：你可以在 Minecraft 中使用骨头驯服狼。当你有一个宠物狼时，可以使用某些类型的食物治愈它。在创建食物物品时，你可以设置是否可以使用该食物来治愈狼。因此，在创建食物物品时，确定狼是否应该食用它是很重要的。\n\
  \n### 创建食物物品\n\n现在你已经了解 Minecraft 中食物是如何运作的，是时候创建你自己的食物物品了。要做到这一点，你需要在模文件中添加新物品。\n\
  \n### 模文件\n\n首先，在模文件中添加一个新物品：\n\n```java\npublic static Item berry;\n```\n\n然后，在\
  \ `preInit` 方法中：\n\n```java\nberry = GameRegistry.registerItem(berry, \"Berry\"\
  );\n```\n\n### 创建物品类\n\n创建 `ItemBerry` 类，看起来应该是这样的：\n\n```java\npackage com.wuppy.smod;\n\
  \nimport net.minecraft.item.ItemFood;\n\npublic class ItemBerry extends ItemFood\
  \ {\n\n    public ItemBerry(int food, float saturation, boolean wolfFood) {\n  \
  \      super(food, saturation);\n    }\n}\n```\n\n\n\n\n\n## 注意：Super\n\n切勿在构造函数中的\
  \ `super` 行之前添加代码，否则你将得到错误。\n\n***\n\n你必须在 mod 文件的物品初始化行中添加名称。对于浆果物品，名称将为 `berry`。不要忘记为物品添加本地化和纹理，就像你对基础物品做的那样。图\
  \ 6.1 显示了浆果的纹理。\n\n![Image]\n\n**图 6.1** 浆果纹理。\n\n浆果的本地化看起来如下：\n\n点击此处查看代码图像\n\n\
  ```\nitem.wuppy29_samsmod_berry.name=Berry\n```\n\n现在当你启动游戏时，你应该能够食用该物品，而且它应该具有正确的纹理和正确的名称。\n\
  \n***\n\n## 动手尝试：显示行号\n\n你可能已经注意到，大文件有时看起来非常复杂。然而，如果你犯了错误，错误日志通常会返回问题所在的代码行。\n\n\
  你的 Eclipse 界面应该类似于图 6.2。\n\n![Image]\n\n**图 6.2** Eclipse 界面。\n\n在阅读代码、编写代码和修复崩溃时，在屏幕上显示行号将很有用。请完成以下步骤来实现。\n\
  \n1. 点击 Eclipse 界面顶部的 `Window` 菜单。\n2. 选择 `Preferences` 选项，如图 6.3 所示。在此窗口中，你需要找到行号的选项。\n\
  \n![Image]\n\n**图 6.3** `Window` 菜单上的 `Preferences` 命令。\n\n`Preferences` 窗口打开了，如图\
  \ 6.4 所示。\n\n![Image]\n\n**图 6.4** `Preferences` 窗口。\n\n3. 展开 `General` 选项、`Editors`\
  \ 选项，然后点击 `Text Editors`。不要展开 `Text Editors`，只需点击单词本身。`Text Editors` 选项出现在右侧面板中，如图\
  \ 6.5 所示。\n\n![Image]\n\n**图 6.5** `Text Editors` 选项。\n\n4. 勾选 `Show Line Numbers`\
  \ 复选框，如图 6.5 中高亮所示。\n5. 最后，点击 `Apply` 然后点击 `OK` 保存这些设置并显示行号。\n\n如图 6.2 所示的相同类现在应该像图\
  \ 6.6。你应该看到行号现在显示在代码的左侧。\n\n![Image]\n\n**图 6.6** 显示行号的 Eclipse 界面。\n\n***\n\n##\
  \ 添加药水效果\n\n蜘蛛眼和腐肉等物品在物品被食用时会给玩家提供药水效果。你可以使用 `setPotionEffect` 方法来实现。例如，`setPotionEffect`\
  \ 方法可能如下所示：\n\n```\nsetPotionEffect(Potion.moveSpeed.id, 15, 0, 1F);\n```\n\n该方法有四个参数。\n\
  \n- 第一个参数是一个数字。此数字用于选择使用哪种药水效果。实现此点的方法不是直接输入数字，而是从 `Potion` 类中选择药水并在末尾添加 `.id`。这会将药水转换为药水的\
  \ ID，从而使其在该方法可用。\n- 第二个参数是药水的持续时间（以秒为单位）。在这种情况下，药水影响玩家 15 秒。\n- 第三个参数是药水的等级。这些等级从\
  \ 0 开始，最高等级取决于药水类型。虽然你在游戏中创建的药水等级通常不会超过 1（在游戏中显示为 II），但某些药水可以获得更高的等级，因此也更有效。\n-\
  \ 最后一个参数是效果发生的概率。这个数字的范围从 `0F` 到 `1F`，值越高概率越高。`1F` 表示以 100% 的概率给玩家提供效果。\n\n***\n\
  \n## 动手尝试：玩玩药水\n\n通过不同的药水类型、持续时间和等级来玩玩药水吧。有一些隐藏的药水，你通常在 Minecraft 中无法使用。其中一个例子是跳跃高度药水。\n\
  \n***\n\n如果你尝试在同一个物品上使用多个药水效果，将会遇到一些问题。一个物品可以拥有的药水最大数量是一个。通过遵循本节结束练习中的说明，可以向此物品添加第二个药水效果。\n\
  \n如果你有一个主要用于药水效果的食物物品，你可能想制作它。\n\n\n\n\n\n为在本小时创建的食物物品添加第二个药水效果。要做到这一点，你需要复制并更改\
  \ `setPotionEffect` 方法名称，更改变量名称并将其添加到文件中，然后重写 `onFoodEaten` 方法以使用第二个药水效果。最后，不要忘记在构造函数中使用新的药水效果方法。\n\
  \n新的 `ItemBerry` 文件应该与 列表 6.4 相似。\n\n### 列表 6.4 带有第二个药水效果的 ItemBerry\n\n点击此处查看代码图像\n\
  \n```java\npackage com.wuppy.samsmod;\n\nimport net.minecraft.entity.player.EntityPlayer;\n\
  import net.minecraft.item.ItemFood;\nimport net.minecraft.item.ItemStack;\nimport\
  \ net.minecraft.potion.Potion;\nimport net.minecraft.potion.PotionEffect;\nimport\
  \ net.minecraft.world.World;\n\npublic class ItemBerry extends ItemFood\n{\n   \
  \ private int secondpotionId;\n    private int secondpotionDuration;\n    private\
  \ int secondpotionAmplifier;\n    private float secondpotionEffectProbability;\n\
  \n    public ItemBerry(int food, float saturation, boolean wolfFood, String name)\n\
  \    {\n        super(food, saturation, wolfFood);\n        setUnlocalizedName(SamsMod.MODID\
  \ + \"_\" + name);\n        setTextureName(SamsMod.MODID + \":\" + name);\n    \
  \    setPotionEffect(Potion.moveSpeed.id, 15, 0, 1F);\n        setSecondPotionEffect(Potion.digSpeed.id,\
  \ 15, 0, 1F);\n        setAlwaysEdible();\n    }\n\n    protected void onFoodEaten(ItemStack\
  \ par1ItemStack, World par2World, EntityPlayer par3EntityPlayer)\n    {\n      \
  \  super.onFoodEaten(par1ItemStack, par2World, par3EntityPlayer);\n        if (!par2World.isRemote\
  \ && this.secondpotionId > 0 && par2World.rand.nextFloat() < this.secondpotionEffectProbability)\n\
  \        {\n            par3EntityPlayer.addPotionEffect(new PotionEffect(this.secondpotionId,\
  \ this.secondpotionDuration * 20, this.secondpotionAmplifier));\n        }\n   \
  \ }\n\n    public ItemFood setSecondPotionEffect(int par1, int par2, int par3, float\
  \ par4)\n    {\n        this.secondpotionId = par1;\n        this.secondpotionDuration\
  \ = par2;\n        this.secondpotionAmplifier = par3;\n        this.secondpotionEffectProbability\
  \ = par4;\n        return this;\n    }\n}\n```\n\n## 第 7 小时：制作自己的工具\n\n### 你在本小时内将学到：\n\
  \n- ![Image](img/image00525.jpeg) 创建一个 `ToolMaterial`\n- ![Image](img/image00525.jpeg)\
  \ 创建一个铁镐\n- ![Image](img/image00525.jpeg) 为挖掘不同的方块创建特殊工具\n\n本小时涵盖了另一种特殊的物品类型：工具。工具在\
  \ Minecraft 中非常常用，因为它们几乎是你除创造模式之外可以用来移除方块的唯一物品。此外，剑在 Minecraft 中被视为工具，并用于战斗。没有工具，你在\
  \ Minecraft 中就做不了什么。因此，了解如何制作它们是有帮助的。你可以在 [`minecraft.gamepedia.com/Tools`](http://minecraft.gamepedia.com/Tools)\
  \ 找到更多关于工具的信息。\n\n### 创建 ToolMaterial\n\n在创建自定义工具之前，你必须创建一个自定义的 `ToolMaterial`。正如其名所示，`ToolMaterial`\
  \ 是制作工具工具的材料。这种材料对工具非常重要。它告诉 Minecraft 该工具可以挖掘哪些方块、会造成多大的伤害、挖掘速度有多快、可以使用多久以及其他几点内容。要创建你自己的\
  \ `ToolMaterial`，请在 mod 文件中 `Item` 变量下方添加以下代码：\n\n点击此处查看代码图像\n```java\nToolMaterial\
  \ samium = EnumHelper.addToolMaterial(\"samium\", 3, 1000, 9.5F, 3.5F, 10);\n```\n\
  \n通过这段代码，你创建了一个名为 `samium` 的 `ToolMaterial`。你使用一个名为 `EnumHelper` 的文件创建它。在该文件中有一个名为\
  \ `addToolMaterial` 的方法，它接受六个参数。\n\n第一个参数是材料的名称。名字并不重要。唯一需要记住的是它应该是唯一的名称，并且你可以很容易识别出它是你想要的\
  \ `ToolMaterial`。\n\n第二个参数是工具的挖掘等级。挖掘等级决定了你可以挖掘哪种类型的方块。如果你进入 `Item` 内部的 `ToolMaterial`\
  \ 类，你将看到什么材料具有哪个挖掘等级。如果材料的挖掘等级较高，它就能挖掘更多方块。挖掘等级 3 意味着你可以像钻石镐一样挖掘。这意味着你可以挖掘除了基岩（无法破坏）之外的所有东西。\n\
  \n第三个参数是工具的使用次数。这个参数决定了工具在损坏前可以使用多少次。\n\n第四个参数是工具的挖掘速度。这个参数告诉 Minecraft 挖掘速度有多快。在\
  \ `ToolMaterial` 类中，你可以看到不同的挖掘速度。数值越高，工具挖掘得越快。\n\n第五个参数是工具造成的伤害。这个参数决定了工具对实体造成的伤害。在\
  \ `ToolMaterial` 类中，你可以看到不同的伤害值。数值越高，工具造成的伤害越大。\n\n第六个参数是工具的附魔性。这个参数决定了工具获得附魔的概率。在\
  \ `ToolMaterial` 类中，你可以看到不同的附魔概率。\n\n### 创建铁镐\n\n现在你已经有了 `ToolMaterial`，是时候在工具中使用它了。\n\
  \n### Mod 文件代码\n\n要将工具添加到 mod 文件，请在 mod 中添加以下代码：\n\n点击此处查看代码图像\n```java\npublic\
  \ static Item sampickaxe;\nToolMaterial samium = EnumHelper.addToolMaterial(\"samium\"\
  , 3, 1000, 9.5F, 3.5F, 10);\n```\n\n此外，在 `preInit` 方法中添加以下代码：\n\n点击此处查看代码图像\n```java\n\
  sampickaxe = new ItemSamPickaxe(samium, \"sampickaxe\");\nGameRegistry.registerItem(sampickaxe,\
  \ \"SamPickaxe\");\n```\n\n这些代码对你来说应该很熟悉了。唯一不同的是 `ItemSamPickaxe` 将 `ToolMaterial`\
  \ 作为其第一个参数。这是创建工具所需的，因为 `ItemSamPickaxe` 类将被扩展。\n\n### 创建 ItemSamPickaxe 类\n\n与之前的小小时创建的其他物品一样，将鼠标悬停在\
  \ `ItemSamPickaxe` 上并选择 Create Class。然后将继承类型从 `ItemTool` 改为 `ItemPickaxe`。这会在 `ItemSamPickaxe`\
  \ 下产生错误，提示它应该有一个带有参数 `ToolMaterial` 的构造函数。不要这样做。相反，请添加 列表 7.1 所示的代码。\n\n### 列表 7.1\
  \ ItemPickaxe 构造函数\n\n点击此处查看代码图像\n\n```java\npackage com.wuppy.samsmod;\n\nimport\
  \ net.minecraft.item.ItemPickaxe;\n\npublic class ItemSamPickaxe extends ItemPickaxe\n\
  {\n    public ItemSamPickaxe(ToolMaterial material, String name)\n    {\n      \
  \  super(material);\n    }\n}\n```\n\n这段代码确保了 mod 文件中使用的 `name` 参数仍然可以使用。它还确保了 `ItemPickaxe`\
  \ 中仅带 `ToolMaterial` 的构造函数也被调用，这是必要的。\n\n现在，就像任何其他物品文件一样，在构造函数中添加以下两行代码：\n\n点击此处查看代码图像\n\
  ```java\nsetUnlocalizedName(SamsMod.MODID + \"_\" + name);\nsetTextureName(SamsMod.MODID\
