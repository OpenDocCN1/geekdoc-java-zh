  \        setBlockName(SamsMod.MODID + \"_\" + \"plant\");\n        setCreativeTab((CreativeTabs)null);\n\
  \        setHardness(0.0F);\n        setBlockBounds(0F, 0F, 0F, 1F, 0.25F, 1F);\n\
  \        setStepSound(soundTypeGrass);\n    }\n}\n```\n\n注意，`BlockSamPlant` 没有 `setBlockTextureName`\
  \ 行。这是因为植物通常有多个纹理，这意味着你必须使用另一种注册纹理的方法。此文件中的另一行有趣的代码是 `setCreativeTab` 方法。这行代码简单地确保\
  \ `BlockSamPlant` 不出现在创造模式菜单中。两行代码旨在让它看起来像植物——硬度（这让这种植物可以立即被破坏）以及形状（它与小麦相同）。此外，在\
  \ `lang` 文件中添加了如下本地化内容：\n\n`tile.samplant.name=Sam’s Plant`\n\n现在，添加与多个图标相关的代码，它应该如列表\
  \ 11.5 所示。\n\n**列表 11.5 BlockSamPlant 的图标代码**\n\n```java\n@SideOnly(Side.CLIENT)\n\
  private IIcon[] icons;\n\n@Override\n@SideOnly(Side.CLIENT)\npublic void registerBlockIcons(IIconRegister\
