  \ 下载并安装 Techne\n\n![Image](img/image00525.jpeg) 使用 Techne\n\n***\n\n在这一节中，你学习了如何在\
  \ Techne 中创建一个基础模型，Techne 是一个专门为 Minecraft 模型设计的建模程序。在第 19 小节“编码生物”中，该模型将用于实体以创建一个生物。在\
  \ Techne 中创建模型之前，首先安装 Techne 并理解 Minecraft 中的模型是什么是重要的。最后，你导出创建的模型。\n\n### 什么是模型？\n\
  Minecraft 中的模型由三部分组成。第一是模型的形状。Minecraft 中的每一个模型都是立方体的集合。第二部分是纹理。第三部分是动画。\n\nMinecraft\
  \ 中的模型由三部分组成。第一是模型的形状。Minecraft 中的每一个模型都是立方体的集合。第二部分是纹理。第三部分是动画。\n\n\n\n\n\n**图\
  \ 18.3** 带有所选立方体的 Techne。\n\n一旦你选择了一个立方体，屏幕上的所有其他部分都将变为激活并可以使用。窗口中除了实际看到模型的部分外，最重要的部分位于左上角。在这里，你可以为每个立方体设置名称、位置、旋转以及其他几个属性。\n\
  \n顶部是名称，每个立方体的名称都必须不同，否则你会遇到问题。此名称不仅在 `Techne` 中使用，也会出现在你之后导出的代码中。\n\n下方是尺寸，即立方体的\
  \ `x`、`y` 和 `z` 尺寸。\n\n接下来是两组 `x`、`y` 和 `z` 值，这看起来可能有点困惑。它们分别是 `position`（位置）和 `offset`（偏移）。编辑正确的其中一个非常重要，否则你的模型可能会表现得异常。`position`\
  \ 是立方体中蓝球所在的位置。蓝球是立方体绕其旋转的点。这个 `position` 非常重要，因为它决定了行走时手臂是绕着移动，还是会一直掉落。蓝球可以看作是立方体的关节。当\
  \ `offset` 正常时，此球位于立方体的中心。为了将关节移动到逻辑位置（例如右臂的左上角），可以使用 `offset`。\n\n`Texture offset`（纹理偏移）用于纹理的位置。整个模型有一个纹理，它被切割成每个立方体的若干部分。由于每个立方体可能有不同的纹理，因此必须使用\
  \ `texture offset` 来确保立方体使用图像中正确部分的纹理。可以在右上看到纹理。选中的立方体颜色透明度略低，你可以轻松地看到立方体是从纹理的哪个部分获取的。\n\
  \n`rotation`（旋转）用于旋转身体部位。它始终围绕蓝球旋转，并可以在每个方向旋转。`ModelBiped` 的每个值旋转均为 0，但当玩家行走时，身体部位确实会移动。你在这里设置的每个值稍后可以在代码中编辑，或者在\
  \ Minecraft 运行时由代码编辑。不过，在 `Techne` 中将旋转值设置为标准值是一个好主意。\n\n你的模型还有两个选项。第一，`mirror texture`（镜像纹理）允许两只手臂使用相同的纹理区域并对其进行镜像。第二，`GlScale`（全局缩放）允许让每个部分看起来比实际大或更小。这通常被设置为\
  \ 1，使其看起来很正常。这只是 `Techne` 中的一个视觉辅助，不会影响你的模型。\n\n### 添加和删除立方体\n\n要添加立方体，可以使用 `GlScale`\
  \ 正下方的蓝色立方体。这会在原点添加一个尺寸为 1, 1, 1 的新立方体。下方还有几个你可以使用的选项来删除、复制和粘贴立方体。\n\n屏幕上的最后一个选项是\
  \ `Load Texture`（加载纹理）。你可以用它将模型纹理加载到模型上。由于在此之前使用的模型与 `ModelBiped` 完全相同，你可以使用像僵尸这样的纹理来显示带有纹理的模型。\n\
  \n***\n\n### 尝试一下：添加僵尸纹理\n\n为模型添加僵尸纹理。请按照以下步骤操作：\n\n1. 进入 Minecraft 的安装位置，默认路径为\
  \ `C:\\Users\\[username]\\AppData\\Roaming\\.minecraft\\versions`。\n2. 选择你想要纹理的\
  \ Minecraft 版本，并用 7zip 或 Winrar 打开 `.jar` 文件。\n3. 所有纹理可以在 `assets/minecraft/textures`\
  \ 中找到。进入这些文件夹。\n4. 对于僵尸纹理，进入 `entity/zombies` 并选择 `zombie.png`。\n5. 现在将其复制到你可以轻松找到的文件夹中。\n\
  6. 在 `Techne` 中选择 `Load Texture` 。\n7. 选择 `zombie.png` 文件，Techne 看起来就像图 18.4。\n\n\
  ![Image](img/image0063.jpeg)\n\n**图 18.4** Techne 中的僵尸。\n\n***\n\n这一小时制作的生物与带有标准玩家纹理的\
  \ `ModelBiped` 非常。。区别是头部有一个帽子。在 `Techne` 中，这个模型看起来像图 18.5。\n\n![Image](img/image00637.jpeg)\n\
  \n**图 18.5** Sam 的生物模型。\n\n### 导出你的模型\n\n创建模型后，如果它能在 Minecraft 中被实际使用就太好了。你可以通过导出来实现。你可以使用右上角的\
