  \            case -1: generateNether(world, random, chunkX * 16, chunkZ * 16);\n\
  \            case 0: generateSurface(world, random, chunkX * 16, chunkZ * 16);\n\
  \            case 1: generateEnd(world, random, chunkX * 16, chunkZ * 16);\n   \
  \     }\n    }\n\n    private void generateEnd(World world, Random random, int x,\
  \ int z)\n    {\n    }\n\n    private void generateSurface(World world, Random random,\
  \ int x, int z)\n    {\n    }\n\n    private void generateNether(World world, Random\
  \ random, int x, int z)\n    {\n    }\n}\n```\n\n***\n\n所有这些代码确保了你可以根据维度生成矿石。接下来，你添加一个标准方法。这个标准方法让你非常容易向世界中添加新矿石。它看起来像：点击此处查看代码图像\n\
  \n```java\n/**\n* 向 Minecraft 添加一个矿石生成点。只需在扩展 IGeneration 的类的生成方法中，使用此方法注册所有要生成的矿石\n\
  * @param 要生成的方块\n* @param 方块的元数据\n* @param 生成的目标方块\n* @param 在其中生成的的世界\n* @param\
  \ 用于获取世界内随机位置以生成方块的随机对象\n* @param 用于向生成方法传递 X 坐标的整数\n* @param 用于向生成方法传递 Z 坐标的整数\n\
  * @param 用于设置每个区块内在 X 轴上生成的最大 X 坐标值的整数\n* @param 用于设置每个区块内在 Z 轴上生成的最大 Z 坐标值的整数\n\
  * @param 用于设置矿脉最大尺寸的整数\n* @param 每个区块内方块可以生成次数的整数\n* @param int 该方块可能生成的最小 Y 坐标高度\n\
  * @param int 该方块可能生成的最大 Y 坐标高度\n*/\npublic void addOreSpawn(Block block, int metadata,\
  \ Block target, World world, Random random, int blockXPos, int blockZPos, int maxX,\
  \ int maxZ, int maxVeinSize, int chancesToSpawn, int minY, int maxY)\n{\n    int\
  \ maxPossY = minY + (maxY - 1);\n    assert maxY > minY: \"The maximum Y must be\
  \ greater than the Minimum Y\";\n    assert maxX > 0 && maxX <= 16: \"addOreSpawn:\
  \ The Maximum X must be greater than 0 and less than 16\";\n    assert minY > 0:\
  \ \"addOreSpawn: The Minimum Y must be greater than 0\";\n    assert maxY < 256\
  \ && maxY > 0: \"addOreSpawn: The Maximum Y must be less than 256 but greater than\
  \ 0\";\n    assert maxZ > 0 && maxZ <= 16: \"addOreSpawn: The Maximum Z must be\
  \ greater than 0 and less than 16\";\n    int diffBtwnMinMaxY = maxY - minY;\n \
  \   for(int x = 0; x < chancesToSpawn; x++)\n    {\n        int posX = blockXPos\
  \ + random.nextInt(maxX);\n        int posY = minY + random.nextInt(diffBtwnMinMaxY);\n\
  \        int posZ = blockZPos + random.nextInt(maxZ);\n        (new WorldMinable(block,\
  \ metadata, maxVeinSize, target)).generate(world, random, posY, posZ);\n    }\n\
  }\n```\n\n所有这些代码确保了你可以根据维度生成矿石。接下来，你添加一个标准方法。这个标准方法让你非常容易向世界中添加新矿石。它看起来像：点击此处查看代码图像\n\
  \n```java\naddOreSpawn(SamsMod.samStone, 0, Blocks.stone, world, random, x, z, 16,\
  \ 16, 5 + random.nextInt(5), 4, 20, 60);\n```\n\n第一个参数是你想要生成的方块，第二个是元数据。之后，你得到想要在其中生成的方块。然后是一些标准值，你需要传递它们，包括\
  \ `world`、`random`、`x`、`z` 和两个 `16`。所有这些值基本上确保了矿石可以在任何区块中生成，区块是 16 块宽、16 块长、256\
  \ 块高。之后是一些矿石特定的数字。`5 + random.nextInt(5)` 部分是单个矿脉中生成的矿石数量。通常最好对其进行随机化。\n\n### 尝试一下：下界矿石生成\n\
