  接下来，你需要告诉 Minecraft 要同步什么内容。为了做到这一点，需要四个新方法。其中一个方法写入所需的数据，一个方法读取数据，另外两个方法仅用于确保数据包（在客户端和服务器之间传输的数据称为数据包）——是可用的。`TileEntitySam`\
  \ 中的四个新方法如下所示：点击此处查看代码图片\n\n```java\n@Override\npublic void readFromNBT(NBTTagCompound\
  \ tag)\n{\n    super.readFromNBT(tag);\n    counter = tag.getInteger(\"counter\"\
  );\n    counterEnabled = tag.getBoolean(\"counterEnabled\");\n}\n\n@Override\npublic\
  \ void writeToNBT(NBTTagCompound tag)\n{\n    super.writeToNBT(tag);\n    tag.setInteger(\"\
  counter\", counter);\n    tag.setBoolean(\"counterEnabled\", counterEnabled);\n\
  }\n\n@Override\npublic void onDataPacket(NetworkManager net, S35PacketUpdateTileEntity\
  \ packet)\n{\n    this.readFromNBT(packet.func_148857_g());\n}\n\n@Override\npublic\
  \ Packet getDescriptionPacket()\n{\n    NBTTagCompound var1 = new NBTTagCompound();\n\
  \    this.writeToNBT(var1);\n    return new S35PacketUpdateTileEntity(xCoord, yCoord,\
  \ zCoord, 1, var1);\n}\n```\n\n在这些方法之前，你需要知道 NBT 是什么。NBT（命名二进制标签）是用于存储方块、实体或实体实体的一种方式。\n\
  \n在 `writeToNBT` 中，还需要将 `counter` 整数和 `counterEnabled` 布尔值写入 NBT。\n\n`onDataPacket`\
  \ 方法是在接收新数据包时运行的方法。某些模组可能有特殊的数据包，这意味着它们需要对其进行处理。然而，这只是一个包含 NBT 的标准包，`packet.func_148857_g`\
  \ 仅仅确保了 NBT 被读取。\n\n`getDescriptionPacket` 方法与 `onDataPacket` 一样，是一个处理数据包的方法。它返回需要发送的数据包。由于这个实体实体除了发送一些基础\
  \ NBT 之外没有更多操作，可以使用 `S35PacketUpdateTileEntity`，但如果你的模组做了更复杂的操作，你可能需要自定义数据包，这可能意味着在这里也需要进行一些自定义。\n\
  \n`TileEntitySam` 现在已经完成了，并且看起来应该像列表 12.5 所示。\n\n### 列表 12.5 已完成的 TileEntitySam\n\
