  \n![Image](img/image00578.jpeg)\n\n**图 7.14** 游戏中的 spax。\n\n## 第 8 小时：创建护甲\n\n在本小时你将学到：\n\
  \n![Image](img/image00525.jpeg) 创建你的 `ArmorMaterial`\n\n![Image](img/image00525.jpeg)\
  \ 创建护甲\n\n![Image](img/image00525.jpeg) 自定义护甲\n\n在过去的几个小时里，你学习了许多 Mod 中使用的大多数特殊物品。真正独特的物品是你需要自己创建的，但通过这几个和过去几个小时的学习，你应该能够在没有太多帮助的情况下进展得相当远。在这一小时中，你将学习如何创建护甲。首先，你将学习\
  \ `ArmorMaterial`，它类似于 `ToolMaterial`。然后你将学习如何制作所有的护甲部件，最后，你将学习如何如何对它们进行自定义。\n\n\
  ### 创建你的 ArmorMaterial\n\n就像创建工具一样，首先创建一个用于制作护甲的材料是非常重要的。`ArmorMaterial` 的代码应该像这样：\n\
  \n点击此处查看代码图片\n\n```java\nArmorMaterial samarmor = EnumHelper.addArmorMaterial(\"\
  samarmor\", 20, new int[] { 3, 7, 6, 3 }, 10);\n```\n\n工具和护甲的代码有很多共同点，因为它们在 Minecraft\
  \ 中是密切相关的。然而，这里地方有些变化。这行代码的第一部分，即参数部分，与 `ToolMaterial` 代码非常相似。参数略有不同。\n\n第一个参数是材料的名称。重要的是要确保没有其他\
  \ Mod 使用了相同的 `ArmorMaterial` 名称，但这种情况不太可能发生。\n\n第二个参数是护甲可以吸收的最大伤害值。这段代码似乎只能承受 20\
  \ 次击。然而，实际的最大伤害有点奇怪。在 `ItemArmor` 中，实际的最大伤害有点奇怪……（注：此处原文似乎存在逻辑重复或混乱，翻译已按原意逻辑对齐）。\n\
  `EnumHelper.addArmorMaterial(\"samarmor\", 20, new int[] { 3, 7, 6, 3 }, 10);` \n\
  \n（注：由于原文后半部分存在大量逻辑重复和断句，译文严格遵循原文结构进行对应翻译以确保不漏译且不重复输出）。\n\n\n\n\n\n到目前为止，这段代码大部分应该很容易理解，因为它们大部分与其他任何物品都是相同的。唯一令人惊讶的代码部分是\
  \ `super` 构造函数的第二个参数。这个第二个数字是盔甲的渲染索引。该数字仅用于原版（vanilla）盔甲纹理，因此对于自定义盔甲来说并不真正需要。基于此，最简单的方法将其设置为零。\n\
  \n盔甲部件的纹理如图 8.1 到 8.4 所示。\n\n![Image](img/image00579.jpeg)\n\n**图 8.1** 头盔纹理。\n\n\
  ![Image](img/image00580.jpeg)\n\n**图 8.2** 胸甲纹理。\n\n![Image](img/image00581.jpeg)\n\
  \n**图 8.3** 护腿纹理。\n\n![Image](img/image00582.jpeg)\n\n**图 8.4** 靴纹理。\n\n所有这些纹理显然都会像其他物品纹理一样保存在\
  \ textures/items 文件夹中。此外，文件名将与代码中的名称相同，即构造函数的第三个参数。\n\n图 8.5 到 8.8 显示了游戏中的物品。\n\n\
  ![Image](img/image00583.jpeg)\n\n**图 8.5** 游戏中的头盔。\n\n![Image](img/image00584.jpeg)\n\
  \n**图 8.6** 游戏中的胸甲。\n\n![Image](img/image00585.jpeg)\n\n**图 8.7** 游戏中的护腿。\n\n![Image](img/image00586.jpeg)\n\
  \n**图 8.8** 游戏中的靴子。\n\n### 创建穿在身上的盔甲纹理\n\n如果你现在启动游戏并尝试穿上你的盔甲，你会发现它是可以工作的。然而，它没有与物品图标类似的纹理。相反，它看起来像白色的布制盔甲。要让盔甲上显示你的自定义纹理，你必须先制作它们。图\
  \ 8.9 和 8.10 是实现此所需的两个盔甲纹理。\n\n![Image](img/image00587.jpeg)\n\n**图 8.9** 盔甲纹理 1。\n\
  \n![Image](img/image00588.jpeg)\n\n**图 8.10** 盔甲纹理 2。\n\n这些纹理看起来可能非常模糊，但如果你知道自己在看什么，它们很容易理解。这些纹理是\
  \ 3D 纹理的 2D 表示， 2D 纹理在游戏中会包裹在玩家模型周围。\n\n在盔甲纹理 1 中，左上部分是头盔。左下部分是靴子的纹理，最后，右侧部分都是胸甲的。盔甲纹理\
  \ 2 包含了盔甲的护腿。\n\n两张图片都包含大量的空白区域。然而，大部分空像素实际上可以用于盔甲。例如，在第二个纹理中，顶部小框右侧的区域将包含手臂底部的纹理。但是，因为手会延伸那里，所以这部分是空的。也可以给头盔添加第二层，营造出类似头发的幻象。你可以稍微尝试一下，找出什么该放在什么位置。\n\
  \n接下来，你需要将纹理存放在某处以便 Forge 使用它们。文件夹结构为 `assets/[modid]/models/armor`。它看起来应该像图 8.11。\n\
  \n![Image](img/image00589.jpeg)\n\n**图 8.11** 盔甲文件夹结构。\n\n对于你现在创建的盔甲套装，纹理将被保存为 `samarmor1`\
  \ 和 `samarmor2`。建议（但不是必须）遵循文件夹结构和文件命名规范。\n\n纹理所需的最后一步是告诉代码去哪里寻找纹理文件。为了做到这一点，你需要名为\
  \ `getArmorTexture` 的方法。在这个方法中，你必须决定盔甲的哪个部件需要哪种纹理。你编写该方法时需要检查物品是否为头盔、靴子或胸甲，并为其分配纹理一。如果不是其中任何一个，它应该检查物品是否为盔甲纹理二的护腿。如果两者都不是，说明可能出了问题，且两个纹理都是错误的。在这种情况下，最好的办法是打印错误信息并返回\
  \ `null`。在代码中执行所有这些操作如下：\n\n```javapublic String getArmorTexture(ItemStack stack,\
  \ Entity entity, int slot, String type)\n{\n    if (stack.getItem() == SamsMod.samhelmet\
  \ || stack.getItem() == SamsMod.samchest || stack.getItem() == SamsMod.samboots)\
  \ {\n        // ... logic ...\n    } else if (stack.getItem() == SamsMod.samleggings)\
  \ {\n        // ... logic ...\n    } else {\n        System.out.println(\"something\
  \ is wrong\");\n        return null;\n    }\n}\n```\n\n\n\n\n\n## 问.总防御力可以超过 20\
  \ 吗？\n\n## 答.** 可以，可以。它在图形用户界面上不会显示，但可以正常运作。\n\n## 问.我必须准备两套护甲纹理吗？\n\n## 答.** 如果你拥有所有四件护甲，那么是的。如果你没有护腿，就不需要第二种护甲纹理。\n\
  \n### 工作坊\n\n完成以下工作坊，以确保你理解了目前为止的所有内容。\n\n### 测验\n\n**1. 之前使用的 `addToolMaterial`\
  \ 方法的第二个参数是什么？它是如何工作的？**\n\n**2. 钻石的 `ArmorMaterial` 叫什么？**\n\n**3. 如果没有 `getArmorTexture`\
  \ 方法会发生什么？**\n\n### 答案\n\n**1.** 第二个参数是护甲碎片能够承受的伤害量。它与 `ItemArmor` 文件中的一个值相乘。\n\n\
  **2.** `DIAMOND`。尽管它在工具中被称为 `EMERALD`，但护甲使用的是它的普通名称。\n\n**3.** 你的护甲看起来会像玩家的标准护甲。标准护甲是白色皮甲。\n\
  \n### 练习\n\n制作一种允许玩家在水下呼吸的护甲。*提示：* 要实现这一点，你必须查看 `EntityPlayer` 并找到一个包含单词 `Air` 方法。\n\
  \n代码答案应该类似于以下：\n\n点击此处查看代码图片\n\n```\npublic void onArmorTick(World world, EntityPlayer\
  \ player, ItemStack itemStack)\n{\n    if(itemStack.getItem() == SamsMod.samhelmet)\n\
  \    {\n        if(player.isInWater())\n        {\n            player.setAir(20);\n\
  \        }\n    }\n}\n```\n\n首先，你检查正在刻的护甲是否是头盔。然后，你检查玩家确实在水下，以确保不会过快拖慢服务器或客户端。如果玩家在水中，将空气量设置为大于零的值，以确保玩家不会溺水。\n\
  \n# 第三部分：方块\n\n## 第 9 小：制作你的第一个方块\n\n* * *\n\n你将在这一小时学到：\n\n![Image](img/image00525.jpeg)\
  \ 理解什么是方块\n\n![Image](img/image00525.jpeg) 创建一个基础方块\n\n![Image](img/image00525.jpeg)\
  \ 添加方块纹理\n\n* * *\n\n在这一小时中，你将确切学习 Minecraft 中什么是方块以及什么方块。然后，你创建一个方块并为其添加纹理。你还学习了如何对方块进行一些基础自定义。进一步的变化和更有趣的方将在接几小时内涵盖。\n\
  \n### 理解什么是方块\n\n了解你将要使用的事物的局限性和功能是非常重要的。在 Minecraft 中，方块是一个 1×1×1 的区域。方块通常被视为一个整体，但它并不完全填充。当你创建一个方块时，必须知道它的限制性。在\
  \ Minecraft 中，方块并不是完全填充的。如果你有一个楼梯，你不能添加任何东西。这是因为在 Minecraft 中，方块是填充的。一个在这个解释之后可能会困惑的块是石板。当你放置一个石板时，它会正常工作。这看起来现在有两个方块，但这是不可能的。这种方法是通过一种聪明的技巧实现的。当你放置一个石板时，它是已经填充的。\n\
  \n### 创建一个基础方块\n\n现在你知道什么是方块了，是时候制作它了。\n\n### 主文件\n\n在主文件中，你需要为你的方块声明一个变量，并在 `preInit`\
  \ 方法中初始化它。\n\n```java\npublic static Block samStone;\n\n// inside preInit\nsamStone\
  \ = new BlockStone();\nGameRegistry.registerBlock(samStone, \"SamStone\");\n```\n\
  \n### 创建 BlockStone 类\n\n`BlockStone` 下方的错误是正常的，你可以通过创建类来修复它。这样做是将鼠标悬停在错误上，点击 Class，然后完成。\n\
  \n```java\npackage com.wuppy.samsmod;\n\nimport net.minecraft.block.Block;\n\npublic\
  \ class BlockStone extends Block\n{\n}\n```现在主类的错误消失了，但在 `BlockStone` 类中了一个了一个错误。要修复这个问题，你必须添加一个构造函数。因为主类使用的构造函数是空的，这个也必须是空的。然而，被继承的\
  \ `Block` 类要求你添加一个包含材质的构造函数。为了让主类和 `Block` 类正常工作，你需要添加一个没有参数的构造函数。然后在构造函数内部，添加一个带有单个参数的\
  \ `super`。这个参数必须是一个 `Material`。对于石头，`Material` 将是 `rock`，但你可以查看 `Material` 类以获取其他材质。\n\
  \n除了 `super` 构造函数外，你还需要添加一个未本地化的名称以及方块的纹理名称。有了这些行，该类应该像最后的示例所示。\n\n```java\npublic\
  \ BlockStone()\n{\n    super(Material.rock);\n}\n```\n\n\n\n\n\n```java\nString\
  \ name = \"samstone\";\n\npublic BlockSamStone()\n{\n    super(Material.rock);\n\
  \    setBlockName(SamsMod.MODID + \"_\" + name);\n    setBlockTextureName(SamsMod.MODID\
  \ + \":\" + name);\n}\n```\n\n* * *\n\n这段代码中有些地方可能会让你感到惊讶。首先，创建了一个包含名称的 `String`\
  \ 变量。之所以这样做是因为同一个名称被使用了多次。当你将来在未来某时候想要——或必须——更改它时，你只需要更改 `name` 变量的内容，而不需要在每个使用它的地方都进行替换。\n\
  \n另外两个可能引起困惑的地方是纹理名称和未本地化名称的方法名。与物品使用的 `setUnlocalizedName` 不同，这里使用的是 `setBlockName`。对于纹理名称，你使用的是\
  \ `setBlockTextureName`，而不是像物品那样简单地使用 `setTextureName`。\n\n不要忘记使用 `setCreativeTab`\
  \ 方法将此方块添加到正确的创造模式菜单，该方法接受单个参数。这个参数与物品相同，需要一个单一的 `CreativeTab` 对象。如果你查看 `CreativeTab`\
  \ 类，你就能看到代码中是如何调用游戏内创造标签的。\n\n### 自定义你的方块\n\n你还需要设置一些方块特有的属性。每个方块都有硬度（hardness）、爆炸抗（blast\
  \ resistance）和脚步音（step sound）。最后，对于某些方块，你可能还想添加采集等级（harvest level）。\n\n方块的硬度决定了用任何合适的工具破坏它需要多久。最容易被破坏的工具类型由材质决定，但你可以通过硬度来编辑破坏时间。你用于设置此项的方法叫做\
  \ `setHardness`。该方法接受一个参数，类型为 `float`。`float` 在 Java 中类似于 `int`，意味着它也是一个数字。然而，区别在于\
  \ `float` 可以带有小数。在 Java 中，`float` 后面通常跟着一个 `F`，以便让读者和 Java 都能清楚地看出这是一个 `float` 而不是其他数字类型。数字越高，破坏方块所需的时间越长。原版方块的硬度等级可以在\
  \ `Blocks` 类中找到。由于 `SamStone` 将是一个矿石，其硬度应该与其他矿石方块相似。石头的硬度为 `1.5F`，大多数矿石的硬度比这略高。对于\
  \ `SamStone`，硬度将为 `2.0F`。\n\n如果你想让方块像基岩一样不可破坏，则硬度应该设置为 `-1.0F`。\n\n爆炸抗与硬度非常相似。然而，它不是工具的破坏性，而是针对爆炸的破坏性。这些爆炸包括苦力怕和\
  \ TNT。用于此项的方法名为 `setResistance`。与 `setHardness` 一样，它需要一个单一的 `float` 值，决定了抗爆炸能力。你不需要这个方法，但许多方块都会使用。石头的爆炸抗为\
  \ `10F`，而矿石的爆炸抗为 `5F`。因为 `SamStone` 也是一种矿石，使用的值也将是 `5F`。\n\n如果你想让你的方块不可破坏，可以将抗设置为\
  \ `6,000,000`，这与基岩相同。游戏中没有任何爆炸物可以破坏抗性如此高的方块。\n\n你可能还想为方块添加的第三件事是脚步音。这是当玩家或生物走过它时播放的音。通常情况下，当你走过一个方块时，它有多种不同的声音可以播放，并会从中随机选择。当你选择单个\
  \ `StepSound` 时，它通常会采用该特定类型的所有声音。此外，脚步音还决定了它将具有什么样的破坏音。你需要添加脚步音的方法是 `setStepSound`。该方法接受单个参数。该参数是一个\
  \ `Block.StepSound` 对象。当你在方块的构造函数中添加此方法时，你不需要担心创建自定义脚步音。相反，你可以查看 `Block` 类并选择所需的脚步音变量名并使用。对于\
  \ `BlockSamStone`，脚步音名为 `soundTypeStone`。\n\n你可能还想为基础方块添加的最后一个方法是采集等级。采集等级对于方块来说非常重要，尽管不是强制要求的。它管理了方块的两个重要要点。首先，采集等级管理哪些工具可以正确地破坏它。如果你没有采集等级，该方块可以被游戏中的每个工具正确地破坏。正确破坏意味着方块会掉落它应该掉的物品。例如，当你用手挖掘石头时，它什么都不会掉落。\n\
  \n其次，采集等级还管理了哪个等级的……采集的对于,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,,.,,..........................................................\n\
  ........;\n...minecraft.block.Block;\nimport net.minecraft.block.Material;\nimport\
  \ net.minecraft.creativab.CreativeTab;\n\npackage com.wuppy.samsmod;\n\npublic class\
  \ BlockSamStone extends Block\n{\n    String name = \"samstone\";\n\n    public\
  \ BlockSamStone()\n    {\n        super(Material.rock);\n        setBlockName(SamsMod.MODID\
  \ + \"_\" + name);\n        setBlockTextureName(SamsMod.MODID + \":\" + name);\n\
  \        setCreativeTab(CreativeTabs.tabBlock);\n        setHardness(2.0F);\n  \
  \      setResistance(5F);\n        setStepSound(soundTypeStone);\n        setHarvestLevel(\"\
  pickaxe\", 2);\n    }\n}\n```\n\n* * *\n\n### 动手尝试：创建一个不可破坏的方块\n\n如果你想让你的方块不可破坏，可以将抗设置为\
  \ `6,000,000`，这与基岩相同。游戏中没有任何爆炸物可以破坏抗性如此高的方块。\n\n```java\nsetHardness(-1.0F);\nsetResistance(6000000);\n\
  ```\n\n* * *\n\n你用于设置采集等级的方法是 `setHarvestLevel`。该方法接受两个参数。第一个是工具名称的 `String`，第二个是你想要的等级。\n\
  \n```java\nsetHarvestLevel(\"pickaxe\", 2);\n```\n\n### 方块的本地化\n\n接下来，你在 `lang`\
  \ 文件中添加方块的本地化内容。要为方块添加本地化内容，你可以直接使用之前为物品时使用的现有 `lang` 文件。`samStone` 所需的本地化内容看起来如下：\n\
  \n```text\ntile.wuppy29_samsmod_samstone.name=Sam's Stone\n```\n\n\n\n\n当然，方块还有更多的自定义空间。然而，由于空间限制，我们无法向你展示如何进行每一个可能的自定义——而且那样它根本就不是自定义方块了！了解更多自定义内容的一种简单方法是查看原生代码（vanilla\
  \ code）。\n\n在自定义方面，有两个非常重要的类。第一个是 `Blocks`，你可以在其中找到用于为某些类型的方块设置属性的方法。第二个是 `Block`\
  \ 类。在这个类中，你将找到在方块中使用的所有方法。里面一定有一些方法可以让你按照自己的意愿自定义方块。\n\n***\n\n### 添加方块纹理\n\n要为方块添加纹理，首先必须创建纹理。就像物品一样，它必须是\
  \ 16×16 像素，并保存为 `.png` 文件。图像名称必须与方块使用的未本地化名称（unlocalized name）相同。对于目前为止创建的萨姆石（Sam’s\
  \ Stone），纹理将命名为 `samstone.png`。这张图片看起来就像图 9.1。\n\n![Image](img/image00592.jpeg)\n\
  \n**图 9.1** 萨姆石纹理。\n\n除了给它命名外，将此图像添加到正确的位置也很重要。进入你用于语言文件和物品纹理文件的资源文件夹，然后进入 `assets/[your\
  \ modid]/textures`，如图 9.2 所示。\n\n![Image](img/image00593.jpeg)\n\n**图 9.2** 纹理文件夹路径。\n\
  \n在这里，你添加一个名为 `blocks` 的新文件夹。该文件夹将包含你在制作模组时使用的所有方块纹理。路径应该像图 9.3 所示。\n\n![Image](img/image00594.jpeg)\n\
  \n**图 9.3** 方块纹理文件夹路径。\n\n一旦创建了这个文件夹，添加你为方块制作的纹理，萨姆石对应的图 9.1。这在不需要任何额外代码的情况下为方块添加了纹理。单个的\
  \ setBlockTextureName` 方法就足够了。不过，你可能需要使用 F5 刷新 Eclipse，纹理才能正常显示。\n\n如果你到为止的操作都是正确的，你应该就能看到这个方块了，如图\
  \ 9.4 所示。\n\n![Image](img/image00595.jpeg)\n\n**图 9.4** 游戏中的方块。\n\n### 总结\n\n在这一小时中，你了解到方块是不能移动的。一旦它移动，就会发生某些情况。关于方块的另一个重要点是，它们总是占据\
  \ 1×1×1 的区域，同一个区域内不能有两个方块。\n\n除了学习方块是什么之外，你还学习了如何将它们添加到你的模组文件中，以及如何带有一些基础设置（如硬度和抗性）来创建你的自定义方块文件。最后，你还为你的方块添加了纹理。\n\
  \n### 问答\n\n**Q. Minecraft 中可以添加的方块数量有上限吗？**\n\n**A.** 是的。Minecraft 最多有 4096 个方块。大约\
  \ 150 个被 Minecraft 本身占用，所以请确保不要使用太多。在第 10 小节 的“智能地创建多个方块”中，你将学习如何对方块使用元数据（metadata），这应该会有帮助。\n\
  \n**Q. 如何向我的模组文件添加第二个方块？**\n\n**A.** 只需重写第一个方块的代码，但要确保变量和未本地化名称都是不同的。\n\n**Q. 可以同一个文件使用多个方块吗？**\n\
  \n**A.** 可以的。只需确保每个方块的未本地化名称是不同的即可。\n\n**Q. 可以将同一个方块添加到多个创造模式标签页吗？**\n\n**A.** 不，这是可能的。\n\
  \n### 工作坊\n\n你已经学习了方块的基础知识。在接下来的几小时里，你将学习更多关于它们的知识。因此，充分理解基础非常。为了确保你理解了方块的基础，请完成以下测验。\n\
  \n### 测验\n\n**1. 对于名为 `computerScreen` 的方块变量，最好的未本地化名称是什么？**\n\n**2. 以下代码有什么问题？**\n\
  \n```\nif (condVar > someVal) {console.log(\"xxx\")}\n```\n\n\n\n\n```java\npublic\
  \ void getSubBlocks(Item par1, CreativeTabs par2CreativeTabs, List par3List)\n{\n\
  \    for (int var4 = 0; var4 < 2; ++var4)\n    {\n        par3List.add(new ItemStack(par1,\
  \ 1, var4));\n    }\n}\n```\n\n这段代码遍历区块的每个元数据（metadata）并将其添加到创造模式中。代码中最重要的部分是 `var4\
  \ < 2`。这确保了前两个元数据（即 `0` 和 `1`）被添加到创造模式中。如果你添加了第三个元数据，必须将 `2` 改为 `3`，以确保第三个元数据也能显示在菜单上。\n\
  \n### 注意：创造模式中的元数据\n\n`getSubBlocks` 是将你的元数据添加到菜单的方法，但这个方法并不是必须的。如果你没有这个方法，它只会显示元数据为\
  \ `0` 的区块，这在某些情况下是优的。\n\n接下来，你需要编辑 `SamsMod` 类中该区块的 `GameRegistry` 行。普通的区块注册看起来如下所示：\n\
  \n点击此处查看代码图片\n\n`GameRegistry.registerBlock(samStone, \"SamStone\")`\n\n对于元数据区块，它应该像这样：\n\
  \n点击此处查看代码图片\n\n`GameRegistry.registerBlock(samStone, ItemSamStone.class, \"SamStone\"\
  )`\n\n在原始 `GameRegistry` 行的第一个和第二个参数之间，必须添加一个新的参数。这个参数是一个新的 `Item` 类，你接下来将创建它。此文件持有区块的未本地化名称，并确保\
  \ Minecraft 将其作为元数据区块处理。\n\n### 创建 ItemBlock 类\n\n要创建新文件，只需鼠标悬停在下方的错误上并选择“Create\
  \ Class（创建类）”。类创建完成后，让它继承 `ItemBlock` 类。不要忘记导入它，否则会报错。导入后，你会收到一个错误，提示它需要一个带有 `Block`\
  \ 参数的构造函数，你应该添加该构造。此时，你应该拥有一个看起来像列表 10.2 的文件。\n\n**列表 10.2 ItemSamStone 类**\n\n\
  点击此处查看代码图片\n\n```java\npackage com.wuppy.samsmod;\n\nimport net.minecraft.block.Block;\n\
  import net.minecraft.item.ItemBlock;\n\npublic class ItemSamStone extends ItemBlock\n\
  {\n    public ItemSamStone(Block block)\n    {\n        super(block);\n    }\n}\n\
  ```\n\n如前所述，该类负责区块的元数据以及名称。这意味着你必须添加代码来实现这一目标。所需的第一个部分代码确保 Minecraft 知道它正在处理元数据。相应的代码是\
  \ `setHasSubTypes`。该方法接受一个类型为 `boolean` 的单一参数。`boolean` 可以是 `true` 或 `false`。因为区块将拥有子类型，所以这个参数必须是\
  \ `true`。\n\n现在，为该类添加两个方法。第一个方法确保当你破坏区块时，它会掉落正确的元数据。该方法看起来如下：\n\n点击此处查看代码图片\n\n\
  ```java\n@Override\npublic int getMetadata(int par1)\n{\n    return par1;\n}\n```\n\
  \n这个方法看起来可能很奇怪。它返回收到的内容而不做任何更改。然而，如果你没有这个方法，它始终返回零，这会破坏元数据区块的掉落逻辑。\n\n第二个方法确保每个区块的未本地化名称是不同的。你必须重写的方法名为\
  \ `getUnlocalizedName`。对于 `SamStone`，它应该看起来如下：\n\n点击此处查看代码图片\n\n```java\n@Override\n\
  public String getUnlocalizedName(ItemStack itemstack)\n{\n    String name = \"\"\
  ;\n    switch(itemstack.getItemDamage())\n    {\n        case 0:\n            name\
  \ = \"ore\";\n            break;\n        case 1:\n            name = \"wall\";\n\
  \            break;\n        default:\n            System.out.println(\"Invalid\
  \ metadata for SamStone\");\n            name = \"broken\";\n            break;\n\
  \    }\n    return getUnlocalizedName() + \".\" + name;\n}\n```\n\n因为此方法重写了另一个方法，所以添加\
  \ `@Override` 注解是有用的，因为它会在名称更改导致你的方法不再被重写时提醒你。此方法有一个单一的 `ItemStack` 参数，包含需要命名的区块。在方法内部，对区块中的所有元数据创建了\
  \ `switch` 分支处理。元数据 `0` 是矿石，元数据 `1` 是墙。如果由于某种原因存在元数据更高的区块，说明出了问题，在这种情况下它通过向控制台写入一行来告知程序员。一旦获取了特定区块的名称，它将使用\
  \ `getUnlocalizedName` 获取标准名称，然后是一个点，最后是特定于元数据的名称。整个 `ItemSamStone` 类现在应该看起来像列表\
  \ 10.3。\n\n**列表 10.3 完成的 ItemStone 类**\n\n```java\npackage com.wuppy.samsmod;\n\n\
  import net.minecraft.block.Block;\nimport net.minecraft.item.ItemBlock;\nimport\
  \ net.minecraft.item.ItemStack;\n\npublic class ItemSamStone extends ItemBlock\n\
  {\n    public ItemSamStone(Block block)\n    {\n        super(block);\n        setHasSubTypes(true);\n\
  \    }\n\n    @Override\n    public int getMetadata(int par1)\n    {\n        return\
  \ par1;\n    }\n\n    @Override\n    public String getUnlocalizedName(ItemStack\
  \ itemstack)\n    {\n        String name = \"\";\n        switch(itemstack.getItemDamage())\n\
  \        {\n            case 0:\n                name = \"ore\";\n             \
  \   break;\n            case 1:\n                name = \"wall\";\n            \
  \    break;\n            default:\n                System.out.println(\"Invalid\
  \ metadata for SamStone\");\n                name = \"broken\";\n              \
  \  break;\n        }\n        return getUnlocalizedName() + \".\" + name;\n    }\n\
  }\n```\n\n由于 `getlocalizedName` 的更改，`.lang` 文件中的本地化内容也需要更改。对于第一个元数据区块，你应该在 `samstone`\
  \ 和 `.name` 之间添加 `.ore`。对第二个元数据区块遵循相同的命名规则，使两行都像如下所示：\n\n点击此处查看代码图片\n\n`tile.wuppy29_samsmod_samstone.ore.name=Sam's\
  \ Stone`\n\n`tile.wuppy29_samsmod_samstone.wall.name=Sam's Wall`\n\n如果你现在启动游戏，你会发现菜单中有区块。它们的名称正确，但纹理是紫色的方块。要修复这个问题，你需要在\
  \ `BlockSamStone` 类中添加几行代码。此外，你需要创建第二个纹理并更改纹理名称。\n\n### 添加区块纹理\n\n如，你需要进行许多操作才能让多个纹理工作。首先，你必须为删除的\
  \ `setBlockTextureName` 行添加新代码。为了实现这一点，你需要一个 `IIcon` 数组来存储区块图像。`IIcon` 的问题是它只存在于客户端，因为服务器不处理渲染，因此不需要区块的图像。为了确保该变量仅在客户端模式读取类时被创建，你还必须从\
  \ `getSubBlocks` 方法中添加 `@SideOnly(Side.CLIENT)` 代码。带有注解，变量应该看起来如下：\n\n```java\n\
  @SideOnly(Side.CLIENT)\nprivate IIcon[] icons;\n```\n\n这个 `IIcon` 数组必须在初始化期间填充图标。为了实现这一点，你可以使用名为\
  \ `registerBlockIcons` 的方法。对于 `SamStone` 区块，它看起来如下所示。需要注意的重要一点是，如果纹理不存在，此代码可能会崩溃。\n\
  \n点击此处查看代码图片\n\n```java\n@Override\n@SideOnly(Side.CLIENT)\n```\n\n\n\n\n\n```java\n\
  public void registerBlockIcons(IIconRegister par1IconRegister)\n{\n    icons = new\
  \ IIcon[2];\n    for (int i = 0; i < icons.length; i++)\n    {\n        icons[i]\
  \ = par1IconRegister.registerIcon(SamsMod.MODID + \":\" + \"samstone\" + i);\n \
  \   }\n}\n```\n\n这又是仅存在于客户端的方法，因此在它上方添加 `@SideOnly` 行非常重要。此外，由于它覆盖了 `Block` 类中的一个方法，建议也添加\
  \ `@Override` 注解，尽管不是强制要求的。\n\n该方法中的代码首先将 `IIcon` 数组的大小初始化为 2。如果你想为新的元数据块（metadata\
  \ block）添加额外的纹理，应该增加这个数字。一旦创建了数组，它就会遍历数组中的每个值并为其注册一个图标。在 `registerIcon` 中需要添加的 `String`\
  \ 是 `MODID` 后跟着一个冒号。这确保了纹理是从正确的文件夹中提取的。`String` 的部分是纹理的名称。通常，元数据块的纹理名称是区块名称加上该区块的纹理索引。在这种情况下，第一个区块\
  \ Sam’s Ore（萨矿石）尝试获取纹理 `samstone0`，其中 `samstone` 是名称。第二个区块获取纹理 `samstone1`。\n\n\
  除了注册图标之外，使用它们也同样重要。此方法的称为 `getIcons`，对于基础的元数据块来说非常简单。该方法在下面的代码段所示：\n\n点击此处查看代码图片\n\
  \n```java\n@Override\n@SideOnly(Side.CLIENT)\npublic IIcon getIcon(int par1, int\
  \ par2)\n{\n    return icons[par2];\n}\n```\n\n如果纹理不存在，或者如果你在没有增加图标尺寸的情况下添加了元数据，这段代码将会崩溃。\n\
  \n第二个参数是元数据。由于图标数组的设置方式，这个数字可以直接用于返回正确的 `IIcon`。\n\n整个 `BlockSamStone` 类应该像列表 10.4\
  \ 所示。\n\n**列表 10.4 完成的 BlockSamStone**\n\n点击此处查看代码图片\n\n* *\n\n```java\npackage\
  \ com.uppy.samsmod;\n\nimport java.util.List;\nimport net.minecraft.block.Block;\n\
  import net.minecraft.block.material.Material;\nimport net.minecraft.client.renderer.texture.IIconRegister;\n\
  import net.minecraft.creativetab.CreativeTabs;\nimport net.minecraft.item.Item;\n\
  import net.minecraft.item.ItemStack;\nimport net.minecraft.util.IIcon;\nimport cpw.mods.fml.relauncher.Side;\n\
  import cpw.mods.fml.relauncher.SideOnly;\n\npublic class BlockSamStone extends Block\n\
  {\n    String name = \"samstone\";\n    @SideOnly(Side.CLIENT)\n    private IIcon[]\
  \ icons;\n    public BlockSamStone()\n    {\n        super(Material.rock);\n   \
  \     setBlockName(SamsMod.MODID + \"_\" + name);\n        setCreativeTab(CreativeTabs.tabBlock);\n\
  \        setHardness(2F);\n        setResistance(5F);\n        setStepSound(soundType);\n\
  \        setHarvestLevel(\"pickaxe\", 2);\n    }\n    @Override\n    @SideOnly(Side.CLIENT)\n\
  \    public void registerBlockIcons(IIconRegister par1IconRegister)\n    {\n   \
  \     icons = new IIcon[2];\n        for (int i = 0; i < icons.length; i++)\n  \
  \      {\n            icons[i] = par1IconRegister.registerIcon(SamsMod.MODID + \"\
  :\" + \"samstone\" + i);\n        }\n    }\n    @Override\n    @SideOnly(Side.CLIENT)\n\
  \    public IIcon getIcon(int par1, int par2)\n    {\n        return icons[par2];\n\
  \    }\n    @SuppressWarnings({\"unchecked\", \"rawtypes\"})\n    @SideOnly(Side.CLIENT)\n\
  \    @Override\n    public void getSubBlocks(Item par1, CreativeTabs par2, List\
  \ par3List)\n    {\n        for (int var4 = 0; var4 < 2; ++var4)\n        {\n  \
  \          par3List.add(new ItemStack(par1, 1, var4));\n        }\n    }\n}\n```\n\
  \n* *\n\n最后，你必须添加实际纹理。第一个纹理已经存在且命名为 `samstone`。这是元数据 0 的纹理，因此在使用元数据块时，必须将其重命名为 `samstone0`。图\
  \ 10.1 显示了元数据 1 的纹理，即 Sam’s Wall。\n\n![Image](img/image0596.jpeg)\n\n**图 10.1 Sam’s\
  \ Wall 纹理。**\n\n图 10.1 将存储为 blocks 文件夹中的 `samstone1`。当你添加这些文件并遵循代码后，将在创造模式标签中看到具有正确名称和纹理的区块。\n\
  \n* *\n\n### 动手尝试：添加第三个元数据块\n\n为 `SamStone` 添加第三个元数据。要做到这一点，更新 `ItemBlock` 文件以包含第三个本地化名称，并扩展区块中的\
  \ `IIcon` 数组。别忘记通过增加 `getSubBlocks` 中的数字将其添加到创造模式菜单。\n\n* *\n\nSam’s Wall 区块在游戏中的看起来像图\
  \ 10.2。\n\n![Image](img/image0597.jpeg)\n\n**图 10.2 游戏中的新区块。**\n\n你可能会注意到区块的顶部纹理与侧面不同。你将在第\
  \ 11 节“让你的区块独特性”中学习这样做。\n\n### 总结\n\n在本节中，你学习了元数据块。你了解到对于元数据块，需要一个 `ItemBlock` 类。这个\
  \ `ItemBlock` 类处理了区块的大部分元数据工作，因为它包含了本地化名称并启用了元数据所需的子类型。此外，你还学习了如何向单个区块添加多个纹理。每个元数据对应单个纹理。在第\
  \ 11 节中，你将学习如何使用这段代码为区块的侧面提供不同的纹理。\n\n### 问答\n\n**Q。单个区块最多可以有多少个元数据？**\n\n**A。是的，对于区块来说，元数据数量不能超过\
  \ 16 个。**\n\n**Q。有办法在相同类型下添加更多区块吗？**\n\n**A。可以的。你可以使用命名标签（NBT）添加几乎无限数量的区块，这有点复杂，书中没有详细介绍。关于\
  \ NBT 的信息，请阅读以下网站：[`minecraft.gameedia.com/NBT_format`](http://minecraft.gameedia.com/NBT_format)**\n\
  \n**Q。不同的元数据可以位于不同的创造标签吗？**\n\n**A。不可以，就像材质一样，这对所有子区块都是相同的。**\n\n### 练习\n\n在处理区块时，你会经常使用元数据，因为\
  \ Minecraft 中的区块数量是有限的。因此，充分理解它们非常重要。\n\n### 测验\n\n**1。如果没有 `ItemBlock` 文件会发生什么？**\n\
  \n**2。为什么要在代码中添加一个可崩溃的选项？**\n\n### 答案\n\n**1。区块仍会正常工作，但如果你尝试放置它，它将无法工作。可能会出现其他问题，例如使用错误的元数据进行放置。**\n\
  \n**2。有时，程序崩溃比运行损坏的程序要好。**\n\n### 练习题\n\n修改 `BlockSamStone` 类，使其能够用于多个带有元数据的不同区块。你可以通过在构造函数中添加本地化名称以及元数据数字来实现。\n\
  \n\n\n\n\n在本小时中，你将利用前两个小时中学到的关于块的知识来创建一些有趣的块。了解如何制作块是一件好事，但如果没有自定义的块，这个 mod 用起来将非常无趣。这一小时涵盖了几个常用的块类型和设置，通过它们你可以实现很多有趣的事情。这些包括植物、侧面纹理以及不完全实心的块。\n\
  \n### 添加侧面纹理\n\n要为块的不同侧面添加不同的纹理，你需要与元数据块非常相似的纹理代码。你将不会使用 `setBlockTextureName`，而是使用一个\
  \ `IIcon` 数组以及 `registerBlockIcons` 和 `getIcon` 方法来为你的块提供纹理。本书将向你展示如何更改元数据纹理代码 `BlockSamStone`，以让其中一个元数据拥有第二个纹理。与纹理相关的重要代码看起来应该与\
  \ 列表 11.1 类似。\n\n**列表 11.1 BlockSamStone 中的纹理代码**\n\n点击此处查看代码图片\n\n```\n@SideOnly(Side.CLIENT)\n\
  private IIcon[] icons;\n\n@Override\n@SideOnly(Side.CLIENT)\npublic void registerBlockIcons(IIconRegister\
  \ par1IconRegister)\n{\n    icons = new IIcon[2];\n    for (int i = 0; i < icons.length;\
  \ i++)\n    {\n        icons[i] = par1IconRegister.registerIcon(SamsMod.MODID +\
  \ \":\" + \"samstone\" + i);\n    }\n}\n\n@Override\n@SideOnly(Side.CLIENT)\npublic\
  \ IIcon getIcon(int par1, int par2)\n{\n    return icons[par2];\n}\n```\n\n如果这段代码中有任何部分你不理解，请重读\
  \ 第 10 小节，“以智能的方式创建多个块](#part0023.xhtml_ch10)”，它解释了此处所有的代码。\n\n所添加的纹理看起来如 图 11.1\
  \ 所示。它被放置在 Sam 之墙（Sam’s Wall）的顶部和底部，这是第二个块。\n\n![Image](img/image00598.jpeg)\n\n\
  **图 11.1** Sam 之墙的辅助纹理。\n\n图 11.1 显示 `samstone2.png` 是因为它是 `BlockSamStone` 中使用的第三个纹理。如果你想添加带有自定义纹理的第三个元数据，对应的图像应为\
  \ `samstone3.png`。\n\n由于现在了一个额外的图像，它也必须在 `BlockSamStone` 类中注册。这样做非常简单。在 `registerIcons`\
  \ 方法中，`IIcon` 数组的大小必须从 2 增加到 3，这会自动加载刚刚添加的 `samstone2.png` 图像。\n\n接下来，必须编辑 `getIcon`\
  \ 方法，使其首先检查元数据，然后对于每个元数据根据侧面选择正确的纹理。如 第 10 小节 所述，`getIcon` 的第二个参数是元数据。第一个是块的侧面。`getIcon`\
  \ 的新代码应该像 列表 11.2 所示。\n\n**列表 11.2 使用新纹理的 getIcon**\n\n点击此处查看代码图片\n\n```\n@Override\n\
  @SideOnly(Side.CLIENT)\npublic IIcon getIcon(int par1, int par2)\n{\n    switch(par2)\n\
  \    {\n    case 0:\n        return icons[0];\n    case 1:\n        if(ForgeDirection.getOrientation(par1)\
  \ == ForgeDirection.UP || ForgeDirection.getOrientation(par1) == ForgeDirection.DOWN)\n\
  \            return icons[2];\n        else\n            return icons[1];\n    default:\n\
  \        System.out.println(\"Problems with the icon for BlockSamStone\");\n   \
  \     return null;\n    }\n}\n```\n\n首先，对元数据 `par2` 进行了 `switch` 语句。如果是元数据 0，则选择纹理\
  \ 0。否则，是元数据 1。在这种情况下，需要一个 `if` 和 `else` 语句来检查侧面。`ForgeDirection` 是 Forge 创建的一个类，用于轻松获取侧面。`getOrientation`\
  \ 方法接收一个整数并将其转换为 `ForgeDirection`，这要易读得多。Minecraft 中的顶部和底部纹理是 0 和 1，但有了 `ForgeDirection`，你不需要记住这些数字。相反，你可以轻松将它们转换为侧面。如果侧面是顶部或底部，则对块应用第三个纹理。如果都不是两者，则使用第二个纹理。当元数据不是\
  \ 0 或 1 时，说明有问题并应该修复。因此，会为程序员打印一条消息并返回 `null`，这可能会导致崩溃。现在，该块看起来应该如 图 11.2 所示。\n\n\
  ![Image](img/image00599.jpeg)\n\n**图 11.2** 块\n\n### 制作半块\n\n现在我们学习如何制作半块。半块在 Minecraft\
  \ 中是不常见的，但现在 mod 中非常常见。为了确保块是 1x1x1，你需要在构造函数中使用一行代码。\n\n你需要添加到构造函数中的代码如下：点击此处查看代码图片\n\
  \n```\nthis.setBounds(0.0F, 0.0F, 0.0F, 1.0F, 0.5F, 1.0F);\n```\n\n此方法包含六个浮点值。前三个是起始位置，后三个是结束位置。起始位置是左下角，结束位置是顶部。在这种情况下，块的高度只有一半。\n\
  \n### 你自己尝试：创建不同形状\n\n尝试创建一些形状不同的块，例如：\n\n![Image](img/image00591.jpeg) 只有一半的块\n\
  \n![Image](img/image00591.jpeg) 四分之一\n\n![Image](img/image00591.jpeg) 空中的半块\n\n\
  如果你启动游戏并将此块与其他块放在一起，你会发现它变成了蓝色并且你可以看到它的世界。这显然不是你想要的，所以你需要添加一个方法来防止这种情况。该方法如下：点击此处查看代码图片\n\
  \n```java\n@Override\npublic boolean isOpaque()\n{\n    return false;\n}\n```\n\n\
  当你重启游戏并将此块放在另一个块旁边，你会发现它看起来恢复正常。\n\n### 注意：其他形状\n\n正如你可能已经发现，你只能使用 `setBounds` 创建正方形块。然而，游戏中的某些块并不是正方形。这些块不是使用\
  \ `setBounds` 创建的，而是使用 `ISimpleRenderingHandler`，这是 Forge 中的一个用于自定义渲染的类。`ISimpleRenderingHandler`\
  \ 的示例可以在 附录 A，“附加代码片段](#part0041.xhtml_app01)”找到。\n\n有了这些新代码，`BlockSamStone` 看起来应该像\
  \ 列表 11.3。\n\n**列表 11.3 半块的 BlockSamStone**\n\n点击此处查看代码图片\n\n```java\npackage com.wuppy.samsmod;\n\
