- - '##'
  - 问.总防御力可以超过 20 吗？
- - '##'
  - 答.可以，可以。它在图形用户界面上不会显示，但可以正常运作。
- - '##'
  - 问.我必须准备两套护甲纹理吗？
- - '##'
  - 答.如果你拥有所有四件护甲，那么是的。如果你没有护腿，就不需要第二种护甲纹理。
