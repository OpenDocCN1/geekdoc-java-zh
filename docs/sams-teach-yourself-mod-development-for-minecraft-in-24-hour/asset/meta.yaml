- - '##'
  - Q.物品的元数据最大数量是多少？
- - '##'
  - A.一个物品的最大元数据数量大约也是 32,000 个。不过，你必须修改 `getUnlocalizedName` 方法中的元数据变量，使其不再限制为 15。
- - '##'
