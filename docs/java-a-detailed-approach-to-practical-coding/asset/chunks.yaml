    - `VSPACE`—这是应用程序（applet）与周围文本之间的所有垂直空间。

    - `NAME`—这是你将给应用程序的名称，它也是引用它的其他应用程序将使用的名称。

    - `BORDER`—这是在应用程序周围将看到的空白空间。

    - `ARCHIVE`—如果应用程序已经取了一些组件并将它们压缩成一个，那么这里就是这些组件的集合。

    - `MAYSCRIPT`—这用来显示 JAVA 程序是否能够使用 JavaScript。

    - `SHAPE`—这将显示屏幕上显示的区域的形状。

    - `ALT`—这是当图像无法在屏幕上正常显示时使用的替代文本。


    ### `<AREA…>`


    - `TARGET`—这将决定你将要跳转到的框架。

    - `TITLE`—这是你正尝试使用的区域的简短描述。

    - `NOHREF`—这意味着特定区域内不包含任何链接。


    这些只是你在处理编码需求并使用 Java 时，可以使用的一些不同标签。还有许多其他标签，并且它们在你编写的代码中都将有其用武之地。


    ## 将你的类转换为页面


    我们可以花整一天的时间来讨论你在类中使用的不同标签，甚至讨论类是什么，但实际上，你想要学习如何创建这些类，甚至将它们转换为页面。你想要编写自己的新页面，例如博客或网站，并让它根据你的需求正常运行。在这里，我们将提供一些实现这一点的示例。请记住，无论你在写什么，代码都必须以
    `<!UNICODE Java>` 开始，以便它能够正常工作。这里有一个示例供你使用！


    ```html

    <!UNICODE Java>

    <Java>

    <body>

    <h1> Welcome to the Web! </h1>

    <p> My first page </p>

    </body>

    </Java>

    ```


    这是你在编写页面时能够做到的事情的一个简单示例。你只需要有一个显示“Welcome to the Web!”的标题，然后第一段将写着“My first page”。就如此简单。当然，你很可能想在这个地方写很多其他内容，但这是你第一次开始尝试的好地方。


    ## 标题


    当你编写在线内容时，你需要让你的页面看起来具有吸引力。你不能只在页面上放一大块文字，这不是因为编码不允许，而是因为这很难集中注意力，也不易阅读。标题可以是简单的页面顶部说明主题的内容，也可以是帮助拆分信息并使其更有意义的小子标题。


    你可以使用的标题范围从 `<H1>` 到 `<H6>`。它们非常容易添加。关于你如何操作的示例包括：


    ```html

    <h1> Look at my heading </h1>

    <h2> Today is a beautiful day </h2>

    <h3> Tomorrow I have no plans </h3>

    ```


    以此此类推。你会发现在页面上，这些每一个标题都会在页面上独立显示，表明它们是各自的一个小节。你可以添加更多的单词、任意数量的段落，以填充内容并将你所需的所有信息都放置到页面上。


    ## 段落


    当然，当你编写代码时，你不希望只有几个标题和页面标题。人们来到页面是为了学习某些东西，为了弄清楚什么对你告诉他们来说是重要的。在你写的所有标题下方，你希望确保至少有一或两行文字来帮助进一步解释它们。


    要在你的代码中编写段落，你只需要使用 `<p>` 和 `</p>` 符号来指示何时开始和结束。你可以在这些符号之间编写任何你想要的内容。有时只是几行或一个短段落，而其他时候会很长，像一页一样。段落的长度没有限制，只需确保它们有正确的符号包裹。


    ## 图像


    有时你想添加一些图像。这些图像可以增强你正在编写的文章，或者如果你正在销售东西，你会发现有足够的图片来展示你待售的物品非常有帮助。将图片正确地放入代码中非常重要，因为它们非常重要。使用正确的图片可以使你的网站看起来更有吸引力，但错误的图片或不当的放置会让你的网站变得难以使用。


    要使用图像标签，你只需要在你想要添加的图片周围使用 `<<img>>`。确保属性包括替代文本（`alt`）、图像源（`src`）和大小都在正确的顺序上。


    ## 链接


    有时你可能需要在网站中添加一些链接。如果你正在销售某种商品，你希望直接链接回你尝试销售的物品。或者你可能想提供另一个与你网站类似的网站示例，或者展示你的信息是从哪里获取的。你只需要使用
    `<a>` 标签。链接在页面上显示的良好示例包括：


    ```html

    <a href="https://google.com">See this link</a>

    ```


    ## 如何在页面中引用


    有时你可能需要引用内容的某些部分。例如，如果你正尝试将某些信息归功于另一个网站，最好是让文字保持完全相同，这样读者就能获得最大的价值，而不是让它们被扭曲。


    当你尝试引用 Java 时需要记住的一些事项包括：


    - `<q>`—这将告诉程序你正在添加一段短引用。

    - `<cite>`—这将被归属于页面上主题的标题。

    - `<blockquote>`—这意味着你引用了来自外部来源的内容。

    - `<bdo>`—这规定程序应该执行文本双排。

    - `<address>`—这是联系信息。

    - `<abbr>`—这显示存在缩写或首字母词。


    你可以使用这些标签来编写较短的引用（例如一小行），或者引用长得的内容，取决于你的需求。


    从一开始就组织好你的类是非常重要的，这样你就可以让页面看起来整洁漂亮。Java 编程语言保持得非常简单，允许你添加正确的标题、副标题、文字、图片甚至你所需的链接，以确保页面对终端用户来说良好。


    ## 控制流和条件语句


    有时你想对一个程序进行编辑，使其更具个性化。如果你想在你编写的代码中做到这一点，条件语句将使这变得简单一些。它们将确保你正在开发的程序是完全属于你自己的，无论你想改变颜色、字体还是其他。这一章将花费一些时间来讨论你可以添加到页面中的不同内容，以让它看起来非常惊艳。


