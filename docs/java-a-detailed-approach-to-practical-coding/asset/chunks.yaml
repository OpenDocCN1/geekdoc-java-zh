    ## User Datagram Protocol


    This is a really important member of the IPS. It is going to provide transmissions
    that are connectionless so that they are reliable and they are not going to cause
    any issues within the protocol of your network in any way. If you have time-sensitive
    applications that need to drop the pockets quickly, this is the type of protocol
    that you should use. Some of the other things that you are able to see with the
    user diagram protocols include:


    - This is able to provide datagrams to the network

    - It is considered transaction oriented, so it will work for the Domain Name Systems
    and the Network Time Protocols

    - It is going to work with unidirectional communication, which is good for broadcast
    information and service discoveries.

    - It works for applications that need to happen in real time, such as Snapchat
    and Twitter, because it will work with transmission delays. It often works for
    some games as well as various VOIP applications, such as Skype.

    - It is good when you are dealing with a lot of different clients and for streaming
    applications.


    ## Transmission Control Protocol


    Another option that you can go with is the transmission control protocol. This
    is a reliable stream of octets that will happen between the IP Network and the
    various networks that it contains. It is orderly and error-checked, so it is good
    for most of the applications that you will use online, but is especially used
    for email. This protocol is also connectionless and latent, and it will work to
    process data that has already been sent through.


    There are a few things that you will need to keep in mind when using this, including
    that it is reserved and that you need to have the urgent pointers, checksum, and
    window size all reserved at the same time. Some of the things that you should
    keep in mind include:


    - 4 bits specify the data header in 32-bit words

    - 16 bits will identify the source port as well as the receiving port.

    - 32 bits identify the acknowledgment of numbers

    - 9 bits will contain the 9-bit flags

    - 3 bits define the data that is reserved for future use.


    ## Address Resolution Protocol


    As you can get from the name, this is a telecommunications protocol that will
    make it easy for websites and apps to communicate. It is used to help map network
    addresses, and it will make video calls and other messages possible. There are
    many great technologies that are going to use this kind of protocol, including
    `IPv4`, Xerox PARC Universal Packet, ChaosNet, and DEC Net. Some of the things
    that you should keep in mind with this include:


    - 0 – Hardware Type (`HTYPE`)

