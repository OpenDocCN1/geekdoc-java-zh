  trans: "\n在 Java 中，你还可以做的另一件与继承相关的操作是**遮蔽**（shadowing）。这种技术涉及两个命名相似且作用范围重叠的变量。它需要一个高层变量和一个低层变量，因为其中一个变量将覆盖另一个变量。低层变量的元素会在过程中被隐藏。\n\
    \n例如，你的低层变量可以命名为 `theta`，而高层变量命名为 `beta`。当 `theta` 能够覆盖高层变量时，它将隐藏 `beta` 中的所有元素。但仅仅因为被遮蔽变量的元素被隐藏了，并不意味着它们无法工作。它们仍然可以正常运行。通常情况下，隐藏它们是为了不需要显示其长度（length）。\n\
    \n你可能出于几个原因想这样做。有些程序员喜欢在将几个元素组合成一个新的子类之前，先将它们结合在一起。这可以节省大量时间，因为你不需要在过程中重写它们中的每一个。两者的元素都将具有完全的功能，因此你可以同时使用它们，但你可以将它们结合并在你正在尝试创建的新子类中进行更改。\n\
    \n有时隐藏高层变量的长度也是一种很好的做法。当你编写计算机语言时，你需要在处理长度方面非常小心，否则可能会减慢整个系统。遮蔽技术将帮助防止这些问题的发生，并让你的整个程序运行得快一点。\n\
    \n正如你所看到的，在编写自己的程序时，你可以做很多事情。虽然我们在本书中讨论了许多不同的内容，但继承可能是最有用的部分之一。它允许你混合组合各种元素，同时仍从原始代码中获得所需的所有功能。你可以进行更改、继续向下继承以及更多操作。尝试一下吧，看看在你的代码中引入继承后你到底能做些什么。\n\
    \n# 你用 Java 还可以做的其他事情\n\n我们花费了相当的时间来讨论开始学习 Java 时可以做的事情，但仍然有许多其他你想要学习的内容，以便你的程序真正良好运行。在本章中我们将讨论的某些内容，如果使用得当，会让你的项目脱颖而出，最后是：**对象、类和方法**。\n\
    \n## 类、对象和方法\n\n当你使用 Java 语言工作时，这些内容通常会被归在一起，因为它们是在该语言内执行操作的语句集合。例如，你可以使用 `System.out.println`\
    \ 方法，它将带出许多显示在屏幕上的有序语句。\n\n如果你想写一个方法，有一个基本的语法可以确保正确的内容出现。该语法包括：\n\n```\nModifier\
    \ returnValueType methodName(list of parameters) {\n  // Method body;\n}\n```\n\
    \n让我们来看所有这些部分的含义，以便你清楚每个部分应该填充什么内容来使代码正常工作。\n\n### 方法名：修饰符 (Modifiers)\n\n这些是可选的修饰符，用于告诉编译器你希望它如何调用方法。方法的访问类型应该通过这种方式定义。\n\
    \n### 返回类型 (Return type)\n\n这将显示方法的某些返回值。`ReturnTypeType` 将定义为方法返回的值的数据类型。如果你选择，某些操作可以在不返回值的情况下执行。如果没有返回值，你需要确保使用\
    \ `void` 关键字。\n\n### 方法名 (Method name)\n\n这将是方法的实际名称。参数列表和方法名构成了方法签的两个项。\n\n##\
    \ 仅操作类和对象\n\n当你在 Java 内部工作时，对象是具有行为和状态的组件。你可以有一个球，并注意到状态是颜色、弹跳方式以及大小，而行为则是诸如滚动和弹跳等。当你与类工作时，你是在与一个描述其所支持的对象的行为和状态的计划或模板工作。类语法的良好示例包括：\n\
    \n```java\npublic class Horse {\n  String color:\n  int age;\n  String breed;\n\
    \  void lame (){\n  }\n  void happy(){\n  }\n  void lazy(){\n  }\n}\n```\n\n你可以在类中放入多种变量类型以使代码产生差异，包括：\n\
    \n### 局部变量 (Local variables)\n\n这些是定义在构造函数、块或方法内部的变量。变量会在方法内部初始化并声明。当首选方法完成后，该变量将被销毁。\n\
    \n### 实例变量 (Instance variables)\n\n这些是在类内部的变量，但它们位于你建立的方法之外。它们在类加载时实例化，可以在该定义类中的任何构造函数、块或方法中访问。\n\
    \n### 类变量 (Class variables)\n\n类变量定义在特定的类内部、方法外部，并使用 `static` 关键字使用。\n\n## 异常处理\
    \ (Exception Handling)\n\n很多时候，你需要在代码中使用异常处理来保持安全。你必须使用 `catch` 和 `try` 关键字来处理代码中发生的异常处理。你可以将这些放置在你想要生成的代码周围，也可以放置在任何想要保护的代码周围。\n\
    \n## Throws/Throw 关键字\n\n每当你有一个方法没有以某种方式处理的受检异常（checked exception）时，你就需要用 `throws`\
    \ 关键字对其进行声明。这将出现在方法签名的末尾。\n\n另一方面，如果你有一个新实例化的、或者你刚刚捕获的异常，你可以使用 `throw` 关键字将其抛出。这将帮助你在代码中做出一些改变。\n\
    \n## Finally 关键字\n\n接下来，我们将查看 `finally` 关键字。当你有一段跟在 `try` 块之后的代码时，你需要使用 `finally`\
    \ 关键字。即使在没有发生异常的情况下也是如此。这是一个非常值得学习的点，因为 `finally` 块允许你的清理语句运行，使代码看起来更好并准时结束，即使你周围有一些保护代码。你可能想要用于\
    \ `finally` 关键字的语法包括：\n\n```\ntry {\n  //Protected code\n}catch(ExceptionType1.ei)\
    \ {\n  //Catch block\n}catch(ExceptionType2.e2) {\n  //Catch block\n}catch(ExceptionType3.e3)\
    \ {\n  //Catch block\n}finally {\n  //The finally block always executes\n}\n```\n\
    \n学习如何在你的代码中使用对象、类和方法，将帮助你在 Java 代码中定义某些行为和功能。尽管如此，有时你会发现自己试图向代码中放入太多的内容。在运行 Java\
    \ 程序时，并不是越多越好，所以多次测试代码并在需要时进行调整是一个好主意。但总的来说，你会发现在 Java 中处理方法、类和对象可以为你的代码增添伟大之处，并开启许多你能够创造的新事物。\n\
    \n# 结论\n\n"
- fmt: '

    Thank for making it through to the end of Java: A Detailed Approach to Practical
    Coding, let’s hope it was informative and able to provide you with all of the
    tools you need to achieve your goals whatever it may be.


    The next step is to get started with your new programming language. We spent a
    lot of time taking a look at this programming language and how you will be able
    to create some of your very own websites and other great programs, whether you
    are brand new to coding or you have used some of the other coding languages and
    want to get started with `Java`.


    While there are a lot of great coding languages that you are able to go with,
    `Java` is one of the best ones that you can go with if you are creating your own
    websites. It is not going to take too long to get it all set up and once you write
    out the information that you want on your page, as well as pick out the connection
    that is going to work the best for you, you are going to find that this is one
    of the easiest languages to use for writing your web page.


    You don’t have to be scared of programming if you are brand new to the whole experience.
    You simply need to know how to make it work and learn some of the syntaxes. `Java`
    is simple enough for even a beginner to master and you are going to enjoy how
    easy it is to get your website and other web content up and running in no time.


    Finally, if you found this book useful in any way, a review on Amazon is always
    appreciated!


    ## About the Author


    Nathan Clark is an expert programmer with nearly 20 years of experience in the
    software industry.


    With a master’s degree from `MIT`, he has worked for some of the leading software
    companies in the United States and built up extensive knowledge of software design
    and development.


    Nathan and his wife, Sarah, started their own development firm in 2009 to be able
    to take on more challenging and creative projects. Today they assist high-caliber
    clients from all over the world.


    Nathan enjoys sharing his programming knowledge through his book series, developing
    innovative software solutions for their clients and watching classic sci-fi movies
    in his free time.


    To learn programming from an expert, look out for more of Nathan’s books in store
    and online.

