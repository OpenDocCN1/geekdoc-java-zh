  trans: "\n\n现在，通过上面的选项，你将只会得到一个真或假的答案。如果根据你输入程序的内容，答案结果为真，你将得到你放在代码内部的语句。但如果根据你输入代码的内容，答案为假，你将什么也得不到。\n\
    \n对于大多数人来说，这种效果并不理想。你不希望你的代码在答案结果为假后直接放弃。在大多数情况下，你可能希望无论某人的回答是否在某个年龄范围内，都能弹出一个消息。\n\
    \n让我们看看我们上面完成的例子。假设某人回答说他们是 16 岁。你仍然希望为回答这个年龄的人在代码中显示一些其他内容。你可以使用 `if…else` 子句来确保当第一个语句结果为假时（此人未满\
    \ 18 岁或以上，因此第一个语句为假），代码将移动到你提供的第二个语句上。你可以选择诸如“抱歉，你目前没有参加资格。请稍后再试。”的消息。\n\n因此，通过\
    \ `if…else` 语句，如果这个人是 18 岁或以上，他们将获得你编写的原始消息。但如果他们输入的数字小于 18，他们将得到我们刚刚讨论的第二条消息。这仍然基于真和假的逻辑运行，但它允许程序无论收到什么答案都能显示相应的示例。\n\
    \n你可以根据心意尽情地使用 `if…else` 语句。你可以编写你想要的任何数量的此类语句。如果你想将人们分为几个不同的组，这会很有。假设你想分三个不同的组：一个喜欢猫的组，一个喜欢狗的组，一个两个都喜欢的组。你可以在屏幕上列出所有这些选择并允许用户进行挑选。你可以根据收到的答案逐一添加你想要展示的语句。\n\
    \n在 `JavaScript` 代码中，你使用的 `if…else` 语句数量是没有限制的。你拥有控制权，所以请根据你的需求选择尽可能多的选项，以实现你对这段特定代码的想法。\n\
    \n## switch 语句\n\n另一个你可以使用的选项是 `switch` 语句。这允许你有机会测试任何变量，以检查它与已知值列表的等等性。在这个选项中，单个值被称为\
    \ `case`（情况），而被切换的变量将对每个现有的 `case` 进行检查。一个在内部包含 `switch` 语句的增强循环示例包括：\n\n```\n\
    switch(expression){\n  case value:\n    //Statements\n    Break; //optional\n\n\
    \  Case value :\n    //Statements\n    Break; //optional\n\n  //你可以有任何数量的 case\
    \ 语句。\n\n  Default : //Optional\n    //Statements\n}\n```\n\n很多时候，你会想要使用 `switch`\
    \ 语句和 `if` 语句来为你的程序添加更多定义。你可以测试几次，以感受它们的工作原理以及你可以使用它们做些什么。\n\n## 处理继承（Working\
    \ with Inheritances）\n\n在编写代码时，继承是非常实用的。它们允许你从一个旧的类中提取特征，并根据需要将其转移到新类中。然后你还可以对其进行更改。你仍然可以保持第一个类的完整性，如果你仍然想使用第一个类，但又想更改某些特征以配合新类，这非常有帮助。\n\
    \n例如，如果你将 `class A` 中的所有元素转移到 `class B`，那么这两个类在程序中都仍然存在。它们中的任何一个都不会消失。在开始时，你将有两个具有相同信息的类，尽管大多数使用继承的人会想要对\
    \ `class B` 进行修改，同时保留 `class A` 的一些原始特征。这使得事情变得更容易，因为你可以在不完全删除第一个类的情况下进行更改。\n\n\
    在处理这类事情时，记住 `class A` 被视为原始类，而 `class B` 被称为子类，以保持条理。一旦执行了继承，第一个类的元素现在可以在另一个类下找到，但你可以追溯回\
    \ `class A`。\n\n## 继承背后的概念（Concepts behind Inheritance）\n\n在大多数情况下，当你阅读编程书籍时，它们只是会谈论继承是元素拥有共同属性的能力。它还将强调这些元素具有某些独特特征，这些特征正是让新类脱颖出的原因。\n\
    \n继承允许第一个类的元素转移到另一个类，使其具有许多相同的特征。但这样做很好，因为你可以对这个第二个类进行一些更改，而完全不会丢失你在第一个类中所做的工作。这非常有用，因为它在编写代码时可以节省大量时间，并允许程序员从不同的程序中“借”元素来获取所需的功能。\n\
    \n## 传递关系意味着什么？（What Does the Transitive Relationship Mean?）\n\n当你讨论类与子类之间的关系时，你讨论的是传递关系。在数学和编程中，这意味着这种关系可以追溯到偏序，以及等价序。如果一个组被引入另一个组，则认为这些组的元素是相互关联的。此外，继承的传递性质将指出它是包容且扩展的。\n\
    \n继承遵循两个两个概念。第一，如果 `class 1` 扩展自 `class 2`，`class 1` 的元素将包含在 `class 2` 中。第二，当\
    \ `class 2` 扩展到 `class 3` 时，`class 1` 和 `class 2` 的元素都包含在 `class 3` 中。\n\n这基本上意味着你可以根据需要在后续创建任意数量的继承。如果你想从\
    \ `class A` 创建一个新代码，你可以这样做，然后你可以在之后创建一个具有了 `Class A` 和 `Class B` 特征的 `Class C`。你不能直接跳过\
    \ `Class B` 直接到 `Class C`，你需要在其中包含发现于 `Class A` 的特征，但你可以根据选择一直进行到 `Class Z` 或更远。\n\
    \n这从几个方面有助于防止浪费。首先，你不需要花费大量时间在代码中反复编写相同的代码特征，即使你想在代码中重用它们。其次，你不会在代码中浪费那么多空间，因为你创建的新子类可以链接回原始代码，而不是在代码中重写很多次。\n\
    \n当然，当你创建了新的子类后，你可以根据需要进行一些更改。如果你希望那部分代码执行的结果与原始代码略有不同，那是可以的。你可以对该子类进行更改，而不会对继承体系中的其他类或子类产生任何更改。\n\
    \n## Java 隐蔽（Java Shadowing）\n\n"
