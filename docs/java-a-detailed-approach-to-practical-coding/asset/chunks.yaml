    - `TARGET`—this is going to determine the frame that you are going to go to.

    - `TITLE`—this is a small description of the area that you are trying to use.

    - `NOHREF`—this means that there are no links that are contained within the specific
    area.


    These are just some of the different tags that you are going to be able to use
