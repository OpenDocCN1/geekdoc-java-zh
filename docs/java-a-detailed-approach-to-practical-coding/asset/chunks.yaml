    ## Introduction


    Congratulations on purchasing Java: A Detailed Approach to Practical Coding and
    thank you for doing so.


    The following chapters will discuss everything that you need to know to get started
    on your journey to using Java as your coding language. There are many different
    languages that you will be able to choose, but Java is one of the best to use
    when you are trying to put together a webpage, no matter what kind of page you
    are putting together. It will help you to make headers, write paragraphs, and
    can be used to add in links and pictures when needed.


    This guidebook is going to show you how to design some of your own pages, as well
    as some of the cool things that you can do when you are using this programming
    language. We assume that you have a bit of experience with Java in the past, perhaps
    just getting to use it to write some basic codes, and then will move into doing
    some of the more complex codes and options inside this program.


    This guidebook will help you to write some of your very own code and can even
    make it possible to write out your own webpage if you choose. While there are
    so many great things that you will be able to add into your coding, this guidebook
    is going to show you how to do some of the best things. Such as writing down the
    information, adding in links to other pages you write or other websites, adding
    in forms, and so much more.


    Whether you are just getting started with writing out some of the code that you
    will need for this, or you have experience with coding but want to get into the
    world of using Java to write out your own websites, this guidebook is going to
    be the tool that you need to get started.


    There are plenty of books on this subject on the market, thanks again for choosing
    this one! Every effort was made to ensure it is full of as much useful information
    as possible, please enjoy!


    ## Getting Started with Java


    While there are so many things that you can do with the Java programming language,
    the first thing that you should understand is that it is an object-oriented programming
    language. This basically means that it is easier to understand; many of the newer
    programming languages switched over to OOP because it is easier to use and can
    prevent mix-ups and other issues that occur when you are working in your coding.
    Java is also general purpose because software developers wanted a programming
    language that they could create once and then run on many different platforms.


    This program uses some of the same features of C++ and C#, but they have been
    changed a bit to make it easier to use without having to compromise on the power
    and speed of your programming language. Java is all about keeping things simple
    and being able to be used.


    ### Some of the Basics of Java


    First, let’s take a look at what Java is all about. Java is a programming language
    that was developed to help create applications on your computer. It is not uncommon
    for a user to download programs that will require them to use Java and you probably
    already have this on your computer. It is also possible to use this as a plug-in
    on the computer so that you can run these apps in the browser.


    It is important to realize that Java and JavaScript are not the same things and
    outside of the names, they aren’t similar. For example, JavaScript is going to
    be used with web pages that will work with HTML documents, rather than for standalone
    apps that can work of the web pages. This is sometimes confusing since Java is
    still able to run inside the browser, but there are some differences. First, you
    will notice that many types of websites are going to use JavaScript while Java
    is a bit more limited, even though it is easy to use on many websites.


    It is free to download the Java program on your computer and it doesn’t take too
    long. In fact, there are a number of systems that already have this on them to
    make things easier. But there are a few simple steps that you should take to get
    Java downloaded to a computer that doesn’t have this coding language on it. Some
    of the things that you will need to do to install this program include:


    - Install the `JDK`—you will need to have this in order to use the tools that
    will develop your application in Java. You will just need to install this at the
    same time as Java, and it is quick and easy.

    - Choose your IDE—this is where you are going to be working with Java. It will
    allow you to build your codes and see how they will show up. There are a few that
    you are able to choose, but for beginners, `NetBeans` is a great option to help
    you out.

