    ## Turning Your Classes into a Page


    We could spend all day talking about the different tags that you can use in your
    classes and even what classes are, but in reality, you want to learn how to make
    these classes and even to turn them into pages. You want to be able to write out
    your new pages, such as a blog or a website, and get it to work properly for your
    needs. Here we will give some examples of how to make this happen. Remember that
    you will need to start out your code, no matter what you are writing, with `<!UNICODE
    Java>` so that it works properly. Here is an example for you to use!


    ```html

    <!UNICODE Java>

    <Java>

    <body>

    <h1> Welcome to the Web! </h1>

    <p> My first page </p>

    </body>

    </Java>

    ```


    This is a simple example of what you would be able to do when writing a page.
    You would simply have a header that says “Welcome to the Web!” and then the first
    paragraph is going to say “My first page.” It is that simple. Of course, you will
    most likely want to write a lot of other things in this place, but this is a good
    place to get started on your first time.


    ## The Headings


    When you are writing online, you will need to make your page look attractive.
    You can’t just have one big block of words on the page, not because the coding
    won’t let you, but because this is hard to concentrate on and is not that easy
    to read. The headings can be something as simple as the top of the page telling
    what it is all about or little subheadings that help to break up the information
    and help it to make more sense.


    The headings that you are able to use will range from `<H1>` to `<H6>`. They are
    really easy to put in. An example of how you would be able to do this includes:


    ```html

    <h1> Look at my heading </h1>

    <h2> Today is a beautiful day </h2>

    <h3> Tomorrow I have no plans </h3>

    ```


    And so on. You will notice on your page that each of these are going to show up
    on their own on the page, showing that these are their own little sections. You
    will be able to add in some more words, as many paragraphs as you would like,
    to make it fill out and to get all the information that you need onto the page.


    ## Paragraphs


    Of course, when you are writing out the code, you do not want to just have a few
    headings and the title of the page. People come to the page in order to learn
    something, to figure out what is so important for you to tell them. Underneath
    all of the headings that you are writing, you will want to make sure to have at
    least one or two lines to help explain them more.


    To write out a paragraph in your coding, you would simply need to use the `<p>`
    and `</p>` symbols to indicate when you are starting and when you are finishing.
    You will be able to write as much in between these symbols as you would like.
    Sometimes it is just going to be a few lines or a short paragraph, and other times
    it is going to be longer, like a page. There are no limitations to how long your
    paragraphs can be, just make sure that they have the right symbols surrounding
    them.


    ## Images


    There are times when you want to add in some images. These can be nice to enhance
    the articles that you are writing or if you are selling something, you will find
    that it is helpful to have quite a few pictures to show what items you have for
    sale. It is important to put the pictures into your code properly because they
    are important. With the right pictures you can make your website look more appealing,
    but the wrong pictures or the wrong placement of pictures can make your website
    hard to use.


    To use the image tag, you will just need to use `<img>` around the pictures that
    you want to add in. Make sure that the attributes, including alternate text (`alt`),
    image source (`src`) and size are all in the right order.


    ## Links


    There are times when you will want to add some links in your website. If you are
    selling an item, you will want to link right back to the item that you are trying
    to sell. Or you might want to give an example of another website that is similar
    to yours or show where you got your information from. You will just need to use
    the `<a>` tag. A good example of how a link would like on your page would include:


    ```html

    <a href="https://google.com">See this link</a>

    ```


    ## How to Quote In Your Page


    There may be some times when you are going to need to quote some parts from the
    page. For example, if you are trying to attribute some information to another
    website, it is sometimes best to get the word exactly the same so that the reader
    is able to get the most value, rather than having them all twisted.


    Some of the things that you will need to remember when you are trying to quote
    Java include:


    - `<q>`—this is going to tell the program that you are adding a short quotation.

    - `<cite>`—this is going to be attributed to the title of the topic that is on
    the page.

    - `<blockquote>`—this means that you have gone and quoted something that is from
    outside sources.

    - `<bdo>`—this states that the program should do a text dictation.

    - `<address>`—this is the contact information

    - `<abbr>`—this shows that there is an abbreviation or acronym.


    You will be able to use these in order to write out a shorter quote, such as one
    small line, or to quote out something that is much longer, depending on what you
    would like.


    It is important to get your classes all organized from the beginning so that you
    can make the page look nice and neat. The Java programming language keeps things
    pretty simple, allowing you to add the right title, heading, words, pictures,
    and even links that you need to ensure that the page looks nice to the end user.


    ## Control Flow and Conditional Statements


    There are times when you want to take a program and edit it to make it a bit more
    personal. If you want to do this with the code that you are writing, the conditional
    statements are going to make this a bit easier. They are going to work to make
    sure that the program you are developing is going to be completely your own, whether
    you want to change the color, the font, or something else. This chapter is going
    to take some time to talk about the different things that you can add to your
    page to make it look amazing.


