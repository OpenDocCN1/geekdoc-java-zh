  trans: "\n\n很多时候，你会发现在 Java 页面中使用表单是非常方便的。你可能想从客户那里获取一些信息，例如通过调查卷或投票。如果你正在建立自己的业务网站，你可能需要一个帮助联系业务的表单，或者一个让客户在下单时填写的表单。Java\
    \ 表单在很多情况下都非常有用。你可以用于创建 Java 表单的使用的元素包括：\n\n*   文本区域元素\n*   按钮元素\n*   select 元素\n\
    *   input 元素\n\n要实现这一点，你想要操作的一个良好示例包括：\n\n```html\n<div ng-app = “myFavoriteApp”\
    \ ng-controller = “formCtrl”>\n  <form novalidate>\n    First Name: <br>\n   \
    \   <input type = “text” ng-model = “user.firstName”><br>\n    Last Name:<br>\n\
    \      <input type =”text” ng-model = “user.lastName”>\n    <br><br>\n      <button\
    \ ng-click=”reset()”>RESET</button>\n  </form>\n  <p>form = {{user}}</p>\n  <p>master={{master}}</p>\n\
    </div\n```\n\n这将允许用户在弹出的表单中输入姓名，然后计算机能够识别它是否为选项之一。你可能想要考虑的另一种表单是选择框（Select Boxes）。当你想要为客户提供几个选项供他们使用并进行选择时即可。对于我们在下面使用的示例，你可以输入一些动物的名称，让客户或用户选择他们喜欢的一个。\n\
    \n```html\n<form>\nSelect an animal\n<select ng-model=”myVar”>\n    <option value-=””>\n\
    \    <option value=”dogs”>Dogs\n    <option value=”cats”>Cats\n    <option value=”horses”>horses\n\
    </select>\n</form>\n```\n\n你可以在表单中放入任意数量的选项，从两个到二十个或更多，尽管大多数此类表单保持很小，以便用户在需要时更容易完成。对于上面的示例，如果你需要比手机姓名更多的信息（例如邮寄地址和账单信息），你也可以将这些添加进去。\n\
    \n## 控制流语句\n\n控制流语句将有助于确保程序运行顺畅。它通过利用 Java 系统中存在的控制器来实现。你需要使用语法 `JavaConnector::connect`\
    \ 来让其工作。你将使用它来获取可用的 IP 地址字符串，以及能够良好协作客户端和服务器。在执行此操作时，请跟踪以下控制器，以知道哪一个适合你。\n\n###\
    \ 控制器 17 到 20\n\n这些被称为 `connect::passing()`，因为它们将用户引导到所需的正确结构。它将帮助你了解结构的长度，使得更容易将你的函数与程序内部以及网络中的其他函数混淆。\n\
    \n### 控制器 16\n\n这是第一个参数 `socket()`，以便你能够在通信网络中选择想要处理的所有细节和协议族。如果你不确定如何开始，应该尝试结合使用\
    \ `PF_INET` 和 `SOCK_STREAM`，因为它们结合使用时效果良好。\n\n### 控制器 13 和 15\n\n这些是被称为 `JavaConnector::resolvehost`\
    \ 的控制器。它们具有将 DNS 主机和名称字符串转换为 IP 地址的能力，以便所有的假设都能转换为不同的网络地址。\n\n### 控制器 5 到 10\n\
    \n这些将用于解析主机，它们将在 `JavaConnector::resolvehostname()` 语法下工作，并通过 `getaddridinfo()`\
    \ 函数转换主机名和 IP 地址。这是完成此过程较安全的方法之一，但也有其他选择。\n\n现在，如果你想连接到其中一个服务器，你需要使用以下代码：\n\n\
    ```c\n#include <string.h>\n#include <netdb.h>\n#include <arpa/inet.h>\n#include\
    \ “Javaconnector.h”\n\nMyJavaStream*( MyJavaConnector::connect(const char* server,\
    \ int port)\n{\n    Struct sockaddr_inaddress;\n    Memset (&address, 0, sizeof(address));\n\
    \    Address.sin_family = AF_INET;\n    Address.sin_port = htons(port);\n    if\
    \ (pton(AF_INET, server, &address.sin_addr)) {\n        int sd = socket(AF_INET,\
    \ SOCK_STREAM, 0);\n        if (sd < 0) return NULL;\n        if (connect(sd,\
    \ (struct sockaddr *)&address, sizeof(address)) == 0) {\n            return new\
    \ MyJavaStream();\n        }\n    }\n    return NULL;\n}\n```\n\n"
- fmt: "\nNow, with the option above, you are only going to have one answer that is\
    \ true or false. If the answer comes out true based on what you wrote into the\
    \ program, you are going to get the statement that you place inside of the code.\
    \ But if the answer is false based on what you put into the code, you are going\
    \ to get nothing.\n\nThis is not going to work that well for most people. You\
    \ don’t want your code just to give up after the answer ends up being false. In\
    \ most cases, you will want to have a message that comes up whether the person\
    \ answers inside a certain age range or not.\n\nLet’s take a look at the example\
    \ that we did above. Let’s say that the person did answer that they were 16. You\
    \ still want to have something else come up in the code for someone who answers\
    \ this age. You will be able to use the `if…else` clause to make sure that when\
    \ the first statement doesn’t end up true (the person isn’t 18 or above that first\
    \ one is false), the code is then going to move on to the second statement that\
    \ you had available. You may choose something like “Sorry, you are not eligible\
    \ at this time to participate. Please try again later.”\n\nSo with the `if…else`\
    \ statement, if the person is 18 or above, they will be able to get the original\
    \ message that you wrote. But if they place in a number that is below 18, they\
    \ will get the second message as we just discussed. This is still going to work\
    \ off the true and false idea, but it is going to allow the program to show up\
    \ examples no matter what answer you are given.\n\nYou are able to use the `if…else`\
    \ statement as much as you would like. It is possible to do as many of these statements\
    \ as you would like. This can be helpful if you want to split the people into\
    \ several different groups. Let’s say that you want to have three different groups,\
    \ one that likes cats, one that likes dogs, and one that likes both. You will\
    \ be able to list all of these choices on the screen and allow the user to pick\
    \ them out. You can go through and add in the statements that you would like to\
    \ show u based on the answer that you are given.\n\nThere are no limits on the\
    \ amount of `if…else` statements that you are able to use when it comes to your\
    \ code in `JavaScript`. You get to be in control so pick as many options as you\
    \ would like to make it work for the ideas that you have with this particular\
    \ code.\n\n## The switch statement\n\nAnother option that you will be able to\
    \ use is the `switch` statement. This is going to allow you the option of testing\
    \ out any variable to see the equality of it against a list of known values. A\
    \ singular value in this option is going to be called a `case`, and the variable\
    \ that is switched on is going to be checked for each of the existing cases. An\
    \ example of doing an enhanced loop that has a `switch` statement inside of it\
    \ will include:\n\n```\nswitch(expression){\n  case value:\n    //Statements\n\
    \    Break; //optional\n\n  Case value :\n    //Statements\n    Break; //optional\n\
    \n  //You can have any number of case statements.\n\n  Default : //Optional\n\
    \    //Statements\n}\n```\n\nThere are many times when you will want to use the\
    \ `switch` statements and the `if` statements in order to add more definition\
    \ to your programs. You will be able to test them out a few times to get a feel\
    \ for how they work and what all you are going to be able to do with them.\n\n\
    ## Working with Inheritances\n\nInheritances can be really useful when you are\
    \ writing your code. They are going to allow you to take the features from one\
    \ of your older classes and transfer it over to a new class as you need. You will\
    \ then be able to make changes as well. You will also be able to keep the first\
    \ class intact, which is helpful if you want to still use the first class, but\
    \ also want to change some of the features to go in with the new class.\n\nFor\
    \ example, if you transfer all of the elements from `class A` over to `class B`,\
    \ you are going to have both of these still in the program. None of them are going\
    \ to disappear. Right at the beginning you will simply have two classes with the\
    \ same information, although most people who use inheritances will want to make\
    \ changes to `class B`, while still maintaining some of the original features\
    \ of `class A`. This makes things easier since you will be able to make those\
    \ changes without completely getting rid of the first class.\n\nWhen working in\
    \ this kind of thing, remember that `class A` is going to be considered the original\
    \ class and that `class B` is going to be known as the subclass, just to keep\
    \ things in order. The elements of that first class may now be found under another\
    \ class once you do the inheritance, but you will be able to trace the origins\
    \ back to `class A`.\n\n## Concepts behind Inheritance\n\nFor the most part, when\
    \ you look at programming books, they are just going to talk about how inheritance\
    \ is the ability of elements to have common qualities. It will also highlight\
    \ the fact that these elements are able to have some unique features, these features\
    \ are going to be what allows the new class to stand out.\n\nThe inheritance is\
    \ going to allow the elements of the first class to be transferred to another\
    \ class, making it have a lot of the same features. But it is nice because you\
    \ will be able to make some changes to this second class, without losing what\
    \ you did in the first class at all. This is really useful because it will save\
    \ a lot of time when trying to write the code and allows the programmer to “borrow”\
    \ elements from different programs in order to get the functions that they desire.\n\
    \n## What Does the Transitive Relationship Mean?\n\nWhen you are talking about\
    \ the relationship between the class and the subclass, you are talking about a\
    \ transitive relationship. In both mathematics and programming, this means that\
    \ the relationship is going to be traced to a partial order, as well as to an\
    \ equivalence order. If the group is introduced within another group, it is said\
    \ that all the elements of those groups are going to be associated with each other.\
    \ In addition, the transitive nature of your inheritance will point out that it\
    \ is inclusive and extensive in characteristics.\n\nThere are two concepts that\
    \ are going to be followed with inheritances. The first is that if `class 1` extends\
    \ `class 2`, the elements of `class 1` are going to be included inside of `class\
    \ 2`. And second, when `class 2` then extends into `class 3`, the elements of\
    \ both `class 1` and `class 2` are then going to be included in `class 3`.\n\n\
    What this basically means is that you are going to be able to make as many inheritances\
    \ down the line as you want. If you want to make a new code from `class A`, you\
    \ can do that and then you can later go down the line and make a `Class C` that\
    \ has the features of both `Class A` and `Class B`. You can’t skip down and just\
    \ go from `Class B` to `Class C`, you will need to have some of the features that\
    \ are found in `Class A` in there as well, but you can keep going all the way\
    \ to `Class Z` or further if you choose in your code.\n\nThis helps to prevent\
    \ waste in several ways. First, you are not wasting your time rewriting the same\
    \ features of code over and over again, even if you want to reuse them within\
    \ the code. Second, you will not waste as much space inside the code because the\
    \ new subclasses that you are making will be able to link back to the original\
    \ code, rather than having it rewritten a whole bunch of times within the code.\n\
    \nAnd of course, once you make the new subclass, you are going to be able to make\
    \ some changes if needed. If you want that part of the code to do something bit\
    \ differently than the original one, that is fine. You will be able to make changes\
    \ to that subclass which will not make any changes to the other classes or subclasses\
    \ within your inheritance.\n\n## Java Shadowing\n"
