  trans: '

    感谢你读完《Java：实战编程详细指南》（Java: A Detailed Approach to Practical Coding），希望这本书能为你提供有益的信息，并为你提供实现目标所需的所有工具。


    下一步是开始学习你的新编程语言。我们花了大量时间研究这门编程语言，以及你将如何利用它创建自己的网站或其他优秀的程序，无论你是编程初学者，还是已经使用过其他编程语言并想开始学习
    `Java`。


    虽然有很多优秀的编程语言供你选择，但如果你想创建自己的网站，`Java` 是最佳选择之一。配置环境并不会花费太长时间，一旦你写出在页面上想要显示的信息，并挑选出最适合你的连接方式，你就会发现它是编写网页最易的语言之一。


    如果你对整个编程体验完全陌生，不必对编程感到恐惧。你只需要知道如何让它运行并学习一些语法即可。`Java` 足够简单，即使是初学者也能掌握，你将享受在短时间内让你的网站和其他网页内容运行起来的这种轻松。


    最后，如果你觉得这本书在任何方面对你有帮助，我们将非常感谢你在 Amazon 上留下的评价！


    ## 关于作者


    Nathan Clark 是一位拥有近 20 年软件行业经验的资深程序员专家。


    他拥有 `MIT` 的硕士学位，曾在几家美国领先的软件公司工作，并在软件设计和开发方面积累了极其丰富的知识。


    Nathan 和他的妻子 Sarah 于 2009 年创立了自己的开发公司，以承担更具挑战性和创造性的项目。如今，他们为来自世界各地的高端客户提供服务。


    Nathan 喜欢通过他的系列书籍分享编程知识，为客户开发创新的软件解决方案，并在空闲时间观看经典的科幻电影。


    如需向专家学习编程，请关注书店或网上 Nathan 的更多书籍。

    '
