    Now let’s take some time to look at the operators that are present with your Java
    Language. Operators are very interesting because they will allow you to manipulate
    the operand values in some way and there are many different categories that come
    along with these. Some of the categories of operators that you may need to use
    within your code include:


    * Arithmetic

    * Identity

    * Assignment

    * Bitwise

    * Membership

    * Comparison or relational

    * Logical


    ### Arithmetic operators


    There are a number of arithmetic operators that you are able to use. These are
    mostly going to be able to help you to do various mathematical equations in your
    coding, so they are good to know if you are making that kind of code, or just
    to have on hand for other uses. Some of the arithmetic operators that you will
    find handy include:


    * `(+)`—this is the addition operator. It is going to add together two or more
    of your operators. For example, `a + b = 10`.

    * `(-)`—this is the subtraction operator and it is going to take the right operand
    and subtract it from the operand that is on the left. For example, `a – b =5`

    * `(/)`—this is the division operator. It is going to divide the operand that
    is on the left from the one that is on the right.

    * `(*)`—this is the multiplication operator and it is going to multiply the two
    or more numbers that you want to.

    * `(//)`—this one is going to be one you want to use when you are looking for
    quotient results, such as when the decimals have been removed.

    * `(**)`—this is the exponent. If you want to use “the power of” or another option
    similar, the exponent is the best choice for you.


    ### Assignment operators


    Next on the list are the assignment operators. These are good when you want to
    make sure that the two values are assigned together. This can be shown within
    your code, or you can use it in order to save the function that you are working
    on. Some examples of the assignment operators that you may want to work with in
    your code include:


    * `(=)`—this is going to give the value of what’s on the right side back to the
    operand on the left. For example, if you have `c = a + b`, the value that you
    get from `a + b`, is going to turn into `c`.

    * `(-=)`—subtract AND—this is going to take the operand that is on the right and
    subtract it from the left operand. It will then assign the results to the left.
    For example, `c- = a` is the same thing as `c = c-a`.

    * `(+=)`—add AND. This is going to work the same as the one above, but it is going
    to add the operand that is on the right to the left, and then gives the left operand
    result.

    * `(/=)`—divide AND. This will divide the left with the right operand and then
    will assign the value over to the left.

    * `(*=)`—Multiple AND. This is going to multiply the right operand with the left
    operand before assigning the results to the left operand.

    * `(**=)`—exponent AND. This is going to derive the exponential notation. `C **
    = a` is going to be the same as `c = c** a`.


    ### Identity operators


    These can be really helpful any times that you want to compare the memory of two
    different objects, especially if they are going to be in different locations.
    Some of the identity operators that you may want to use within your code to make
    it stick together include:


    * `Is`. This is going to determine whether the variables on both sides are going
    to be true. If they are not, the operator is going to point to the same subject.

    * `Is not`-if the variables on either side of your code are false, the operator
    is going to point to the subjects and will say true-wise.


    ### Membership operator


    These are going to be used within the code to check if there is coherence, or
    a membership, within the specific sequence you are working on. To do this, try
    out these options:


    * `Is`. This is going to check if the variables on both sides are true. This is
    going to check if the variables on both sides are true. For example, `id(x)` equals
    `id(y)`.

    * `No in`-this is going to check if the variable is not inside of a specified
    sequence.


    ### Bitwise operators


    The bitwise operators are going to go through the bit. A good example of this
    is:


    ```

    a = 0011 1100

    b = 0000 1101

    a&b = 0000 1100

    a|b = 0011 1101

    a^b = 0011 0001

    a/b = 0000 1101

    ```


    ### Logical operators


    These are pretty basic ones that you can choose to go with. They are going to
    be basically items that will be able to hold 10 to 20 between them.


    ### Comparison operators


    These are going to make different comparisons to figure out if the statements
    are true. Some of the comparison operators that you may use include:


    * `==`-these are where the condition equates to true when the operands are equal.

    * `<>`—if the values are not equal, the condition will become true.

    * `!=`-the condition will become true if the values of two operands are not equal.

    * `<=`—the condition becomes true if the left operand has a value that is less
    than the right operand.

    * `>=`-the condition becomes true if the value on the left side is greater than
    the right operand.

    * `<`-if the left operand is less than the right operand, the condition is true.

    * `>`—if the left operand is greater than the right operand, the condition is
    true.


    As you can see, there are a lot of different things that you are able to do with
    your operators when they are set up properly. You will be able to do basic arithmetic
    equations, figure out if a statement is true or false, and so much more. You should
    take some time to go through and practice doing some of these options to see how
    they work and to get some experience!


    ## Reference versus Primitive Types


    When it comes to working with Java, there are a few different kinds of data types.
    We have talked a bit about the independent or the primitive data types in Java,
    but there are also reference types, and these can go into the different categories
    as well. While they are slightly different, you will also need to have them supported
    by the primitive data.

