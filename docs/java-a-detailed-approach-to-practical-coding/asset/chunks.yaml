    ## 引言


    恭喜购买《Java：实战编程的详细方法》，感谢您的支持。


    接下来的章节将讨论您开启使用 Java 作为编程语言旅程所需需要的所有知识。您有很多不同的语言可以选择，但当您尝试构建网页时，无论您构建什么类型的页面，Java
    都是最好的选择之一。它将帮助您制作标题、编写段落，并在需要时添加链接和图片。


    本指南将向您展示如何设计一些您自己的页面，以及在使用这种编程语言时可以实现的一些酷炫功能。我们假设您过去对 Java 有一点经验，可能只是刚开始用它来编写一些基础代码，然后我们将进入该程序内部更复杂的代码和选项。


    本指南将帮助您编写属于您自己的代码，如果您选择的话，甚至可以让编写您自己的网页成为可能。虽然您可以在代码中添加许多很棒的东西，但本指南将向您展示如何完成一些最棒的事情，例如记录信息、添加指向您编写的其他页面或其他网站的链接、添加表单等。


    无论您是刚开始编写实现此目的所需的代码，还是已经有编程经验但想进入使用 Java 编写自己网站的世界，本指南都将是您所需的工具。


    市场上有很多许多关于这个主题的书，再次感谢您选择本本书！我们已尽力确保它包含尽可能有用的信息，请尽情享受！


    ## 开始学习 Java


    虽然你可以用 Java 编程语言做很多事情，但你首先应该理解的是它是一种面向对象的编程语言。这基本上意味着它更容易理解；许多新的编程语言转向到 OOP 是因为它更容易使用，并且可以防止在编写代码时发生混淆和其他问题。Java
    也是通用的，因为软件开发人员需要一种编写一次即可运行在不同平台上的编程语言。


    该程序使用了 C++ 和 C# 的一些功能，但对其进行了修改，使其更容易使用，而无需牺牲语言的性能和速度。Java 的核心在于保持易用。


    ### Java 基础知识


    首先，让我们看看 Java 到底是什么。Java 是一种为了在计算机上创建应用程序而开发的编程语言。用户下载需要 Java 的程序并不罕见，你可能已经在计算机上安装了它。它也可以作为插件用于计算机，以便在浏览器中运行。


