    \ off the true and false idea, but it is going to allow the program to show up\
    \ examples no matter what answer you are given.\n\nYou are able to use the if…else\
    \ statement as much as you would like. It is possible to do as many of these statements\
    \ as you would like. This can be helpful if you want to split the people into\
    \ several different groups. Let’s say that you want to have three different groups,\
    \ one that likes cats, one that likes dogs, and one that likes both. You will\
    \ be able to list all of these choices on the screen and allow the user to pick\
    \ them out. You can go through and add in the statements that you would like to\
    \ show u based on the answer that you are given.\n\nThere are no limits on the\
    \ amount of if…else statements that you are able to use when it comes to your\
    \ code in JavaScript. You get to be in control so pick as many options as you\
    \ would like to make it work for the ideas that you have with this particular\
    \ code.\n\n## The switch statement\n\nAnother option that you will be able to\
    \ use is the switch statement. This is going to allow you the option of testing\
    \ out any variable to see the equality of it against a list of known values. A\
    \ singular value in this option is going to be called a case, and the variable\
    \ that is switched on is going to be checked for each of the existing cases. An\
    \ example of doing an enhanced loop that has a switch statement inside of it will\
    \ include:\n\nswitch(expression){\n\n case value:\n\n //Statements\n\n Break;\
    \ //optional\n\n Case value :\n\n //Statements\n\n Break; //optional\n\n //You\
    \ can have any number of case statements.\n\n Default : //Optional\n\n //Statements\n\
    \n}\n\nThere are many times when you will want to use the switch statements and\
    \ the if statements in order to add more definition to your programs. You will\
    \ be able to test them out a few times to get a feel for how they work and what\
    \ all you are going to be able to do with them.\n\nWorking with Inheritances\n\
    \nInheritances can be really useful when you are writing your code. They are going\
    \ to allow you to take the features from one of your older classes and transfer\
    \ it over to a new class as you need. You will then be able to make changes as\
    \ well. You will also be able to keep the first class intact, which is helpful\
    \ if you want to still use the first class, but also want to change some of the\
    \ features to go in with the new class.\n\nFor example, if you transfer all of\
    \ the elements from class A over to class B, you are going to have both of these\
    \ still in the program. None of them are going to disappear. Right at the beginning\
    \ you will simply have two classes with the same information, although most people\
    \ who use inheritances will want to make changes to class B, while still maintaining\
    \ some of the original features of class A. This makes things easier since you\
    \ will be able to make those changes without completely getting rid of the first\
    \ class.\n\nWhen working in this kind of thing, remember that class A is going\
    \ to be considered the original class and that class B is going to be known as\
    \ the subclass, just to keep things in order. The elements of that first class\
    \ may now be found under another class once you do the inheritance, but you will\
    \ be able to trace the origins back to class A.\n\n## Concepts behind Inheritance\n\
    \nFor the most part, when you look at programming books, they are just going to\
    \ talk about how inheritance is the ability of elements to have common qualities.\
    \ It will also highlight the fact that these elements are able to have some unique\
    \ features, these features are going to be what allows the new class to stand\
    \ out.\n\nThe inheritance is going to allow the elements of the first class to\
    \ be transferred to another class, making it have a lot of the same features.\
    \ But it is nice because you will be able to make some changes to this second\
    \ class, without losing what you did in the first class at all. This is really\
    \ useful because it will save a lot of time when trying to write the code and\
    \ allows the programmer to “borrow’ elements from different programs in order\
    \ to get the functions that they desire.\n\n## What Does the Transitive Relationship\
    \ Mean?\n\nWhen you are talking about the relationship between the class and the\
    \ subclass, you are talking about a transitive relationship. In both mathematics\
    \ and programming, this means that the relationship is going to be traced to a\
    \ partial order, as well as to an equivalence order. If the group is introduced\
    \ within another group, it is said that all the elements of those groups are going\
    \ to be associated with each other. In addition, the transitive nature of your\
    \ inheritance will point out that it is inclusive and extensive in characteristics.\n\
    \nThere are two concepts that are going to be followed with inheritances. The\
    \ first is that if class 1 extends into class 2, the elements of class 1 are going\
    \ to be included inside of class 2\\. And second, when class 2 then extends into\
    \ class 3, the elements of both class 1 and class 2 are then going to be included\
    \ in class 3\\.\n\nWhat this basically means is that you are going to be able\
    \ to make as many inheritances down the line as you want. If you want to make\
    \ a new code from class A, you can do that and then you can later go down the\
    \ line and make a Class C that has the features of both Class A and Class B. You\
    \ can’t skip down and just go from Class B to Class C, you will need to have some\
    \ of the features that are found in Class A in there as well, but you can keep\
    \ going all the way down to Class Z or further if you choose in your code.\n\n\
    This helps to prevent waste in several ways. First, you are not wasting your time\
    \ rewriting the same features of code over and over again, even if you want to\
    \ reuse them within the code. Second, you will not waste as much space inside\
    \ the code because the new subclasses that you are making will be able to link\
    \ back to the original code, rather than having it rewritten a whole bunch of\
    \ times within the code.\n\nAnd of course, once you make the new subclass, you\
    \ are going to be able to make some changes if needed. If you want that part of\
    \ the code to do something a bit differently than the original one, that is fine.\
    \ You will be able to make changes to that subclass which will not make any changes\
    \ to the other classes or subclasses within your inheritance.\n\n## Java Shadowing"
