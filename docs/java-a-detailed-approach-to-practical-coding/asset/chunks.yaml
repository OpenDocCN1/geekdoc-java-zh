    \n## 布尔表达式\n\n你在 Java 中需要处理的下一件事是你的布尔逻辑。虽然在编写代码时可能有很多选项，但 Java 以及其他一些编程语言将将其简化为非假（false）或真（true）的语句。它们还将与二进制计数法配合。这将确保程序能够根据用户提供的信息做出自己的决策。\n\
