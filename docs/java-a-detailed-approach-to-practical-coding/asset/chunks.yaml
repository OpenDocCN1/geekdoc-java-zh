    虽然基本类型可以独立存在，但引用数据类型能够完成一些功能，使你的程序运行得更好，当涉及到程序运行的程度时，你会看到巨大的差异。你可以使用几种不同类型的此类数据，让我们来看看它们，以学习它们是如何运作的。


    ## 用户数据报协议 (User Datagram Protocol)


    这是 IPS 中一个非常重要的成员。它将提供无连接的传输，因此它是可靠的，并且不会以任何方式对你的网络协议产生任何问题。如果你有需要快速丢弃数据包的时间敏感型应用程序，这就是你应该使用的协议类型。用户数据报协议中你还可以看到的其他特性包括：


    - 它能够向网络提供数据报文

    - 它被认为是事务导型的，因此它适用于域名系统（DNS）和网络时间协议（NTP）

    - 它支持单向通信，这对于广播信息和服务发现非常有益

    - 它适用于需要实时发生的应用程序，例如 Snapchat 和 Twitter，因为它可以处理传输延迟。它通常适用于某些游戏以及各种 VOIP 应用（如 Skype）。

    - 当你处理许多不同的客户端和流媒体应用时，它是好用的。


    ## 传输控制协议 (Transmission Control Protocol)


    你可以选择的另一个选项是传输控制协议。这是 IP 网络与其包含的各种网络之间发生的一种可靠字节流。它是有序且经过错误检查的，因此它适用于你在线使用的的大多数应用程序，但特别用于电子邮件。该协议也是无连接且有延迟的，它可以处理已经发送通过的数据。


    在使用此协议时，你需要记住的几点，包括它是预留的，并且你需要让紧急指针、校验和和窗口大小同时被预留。你应该记住的几点包括：


    - 4 位在 32 位字中指定数据标头

    - 16 位将标识源端口以及接收端口

    - 32 位识别确认号

    - 9 位将包含 9 位标志位

    - 3 位定义预留供未来使用的数据


    ## 地址解析协议 (Address Resolution Protocol)


    正如其名称所示，这是一种让网站和应用程序易于通信的电信协议。它被用于帮助映射网络地址，并使视频通话和其他消息成为可能。许多出色的技术都会使用这种协议，包括
    `IPv4`、Xerox PARC Universal 数据包、ChaosNet 和 DEC Net。在使用它时你需要记住的项包括：


    - 0 – 硬件类型 (`HTYPE`)

    - 2 – 协议类型 (`PTYPE`)

    - 4 – 硬件地址 (`HLEN`) 或 协议地址 (`PLEN`)

    - 6 – 操作 (`OPER`)

    - 8 – 发送端硬件地址 (`SHA`)

    - 10 – 后续 2 个字节

    - 12 – 最后 2 个字节

    - 14 – 发送端地址协议 (`SAP`)

    - 16 – 后续 2 个字节

    - 18 – 目标硬件地址 (`THA`)

    - 20 – 后续 2 个字节

    - 22 – 最后 2 个字节

    - 24 – 目标协议地址 (`TPA`)

    - 26 – 后续 2 个字节


    ## 网际协议 (Internet Protocol)


    而与 Java 配合最好的是网际协议，因为这个程序是为了配合它而创建的。这个协议旨在为网络提供正确的边界，并中继数据报允许互联网上所有的网络活动发生。其结构将涉及有效负载和标头，其中标头被称为主
    IP 地址，接口将在特定参数的帮助下连接在一起。


    你还需要使用路由前缀和网络标识来让一切协同工作。你可以向此添加很多内容，但当涉及 Java 和网际协议时，你需要处理的基本框架包括：


    ```

    DataApplication

    UDP Header | UDP DATA Transport

    IP Header | IP Data Internet

    Frame Header | Frame Data | Frame FooterLink

    ```


    ## 在 Java 中创建一些类


    现在我们已经花了一些时间查看你可以用 Java 代码创建的基本内容，现在是时候去代码中创建一些属于你自己的类了。对于你的 Java 程序来说，类实际上是非常重要的，因为它们决定了程序将发生什么。


    在创建类时，会有很多元素被考虑。这些元素对于确保代码能够运行至关重要。我们将从类的框架开始，并从那里继续！


    #### 完善框架


    在你想要创建的 Java 类框架中，你需要包含的内容包括：


    - 程序类型。你需要使用 `UNICODE` 声明来描述程序类型。

    - 程序信息将在文本内提供。你应该使用 `<HEAD>` 和 `</HEAD>` 符号来包围这些程序信息。

    - Java 程序部分的描述方式类似，但符号将是 `<Java>` 和 `</Java>`

    - 标题应该位于开头，它将在文本 `<TITLE>` 和 `</TITILE>` 中找到。

    - 你在 `<H1>` 和 `</H1>` 之间看到的文本是标题。

    - 你在屏幕上看到的内容将在 `<BODY>` 和 `</BODY>` 之间。

    - 以及如果你想创建一个段落，就在 `<p>` 和 `</p>` 之间编写文本。


    ## 标签速查表 (Cheat Sheet)


    在编写标签时，你需要记住，大多数情况下它们是成对出现的。你之前见过这一点，标签所需的信息位于两个相同的标签之间。左侧的被视为开始标签，而结束标签几乎相同，但你需要在前面加一个斜杠来表示该部分代码的结束。你在
    Java 程序中可能使用的某些标签包括：


    ### Unicode


    - `NAME` – 它对应页面上的某个部分

    - `HREF` – 当你想在文档内进行超链接或想添加特定 URL 名称时，这是一个很好用的属性。

    - `onclick` – 这是运行以便使用户能够点击锚点的脚本。这将使用户能够点击你的链接，当他们到达时链接将会有效。


    ### `<A>` 锚点


    - `TITLE` – 这是你尝试打开的程序名称。

    - `onmouseout` – 这是判断鼠标不再位于锚点文本上的脚本。

    - `TARGET` – 它将显示程序进入的窗口。

    - `onmouseover` – 这显示鼠标正位于锚点文本上方。


    ### `<App…>`


    - `CODEBASE` – 这是通往 applet 类的路径

    - `CODE` – 它将决定当前运行哪个程序。

    - `HEIGHT` – 这是 applet 的高度

    - `WIDTH` – 这决定了你的 applet 的宽度

    - `ALIGN` – 它决定你编写的文本在屏幕上显示多少。


    ### `<APPLET…>`


    - `HSPACE` – 这将涉及 applet 与周围文本之间的水平空间。

