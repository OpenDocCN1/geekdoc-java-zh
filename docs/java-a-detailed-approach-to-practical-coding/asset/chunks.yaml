    - `VSPACE`—this is all the vertical space that is between the applet and the surrounding
    text.

    - `NAME`—this is the name that you will give to the applet and it is also the
    name that is used by other applets that are referencing it.

    - `BORDER`—this is the empty space that will be seen surrounding the aplite.

    - `ARCHIVE`—if the applet has taken some of the components and compressed them
