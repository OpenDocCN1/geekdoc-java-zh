    ## The If Statement


    The if statement is going to work on the true and false idea. It is going to decide
    whether the input that the user is putting in is true or false and then give the
    right response that you put in if the answer ends up being true. You will need
    to determine which statement that you would like to have come into the program
    if your user puts the true statement. On the other hand, if the user puts in a
