    These are the variables that can be found within the class, but they will be outside
    the method that you established. These will be instantiated when the class is
    loaded and they can be accessed within any of the constructors, blocks, or methods
    that are in that defined class.


    ### Class variables


    The class variables are going to be declared within a specific class, outside
    of a method, with the static keyword you use.


    ## Exception Handling


    There are many times that you will need to use exception handling in your code
    in order to keep things safe. You must use the catch and try keywords in order
    to deal with the exception handling that goes on within your code. You can place
    these around the code that you want to generate the exception, or you can put
    this around any code that you want to place under protection.


    ## The Throws/Throw Keywords


    Any time that you have a checked exception that is not being handled in some way
    by the method, you will need to declare it with the throws keyword. This is going
    to appear right at the end of the method’s signature.


    On the other hand, if you have a new instantiated, or also an exception that you
    just caught, you will be able to throw it using the “throw” keyword. This is going
    to help you to make some differences in your code. Experiment a bit with both
    of these keywords so that you can learn how they are going to be a little bit
    different when used in the code.


    ## Finally Keyword


    And next, we are going to take a look at the finally keyword. When you have a
    block of code that will follow a try block, you will need to use the finally keyword.
    This is true even in cases where the exception has not occurred. This is a good
    one to learn about because the finally block is going to allow your cleanup statements
    to run to make the code look better and end on time, even if you have some protected
    code around. A syntax that you may want to use for the finally keyword includes:


    try


    {


         //Protected code


    }catch(ExceptionType1.ei)


    {


         //Catch block


    }catch(ExceptionType2.e2)


    {


         //Catch block


    }catch(ExceptionType3.e3)


    {


         //Catch block


    {finally


    {


         //The finally block always executes


    }


    Learning how to use the objects, classes, and methods in your code will help you
    to define certain behaviors and functions within your code on Java. Sometimes
    you will find that you are trying to put too much into the code though. More is
    not always better when it comes to using the Java program, so it is a good idea
    to test out the code a few times and make adjustments when they are needed. But
    overall, you will find that working with the methods, classes, and objects in
    Java can add some greatness to your code and can open up a lot of new things that
    you are able to create.


    Conclusion'
