    ```


    ## Making Some Classes in Java


    Now that we have spent some time looking at the basic things that you are able
    to make with Java code, it is time to get out there and make some of your own
    classes in the code. The classes are really important when it comes to your Java
    program because they are responsible for determining what will happen to the program.


    There are quite a few elements that are going to be considered when making a class.
    These are all important to make sure that the code is actually going to work.
    We are going to start out with the framework of the class and will move on from
    there!


    ### Working on the framework


    The things that you will need to include in the framework of the Java class that
    you want to make include:


    - The program type. You will need to use the `UNICODE` declaration in order to
    describe the program type.

    - Program information is going to be provided within the text. You should use
    the `<HEAD>` and `</HEAD>` symbols to surround this program information.

    - The Java Program part is going to be described similarly, but the symbols are
    going to be `<Java>` and `</Java>`

    - The title should be at the beginning and it is going to be found within the
    text `<TITLE>` and `</TITILE>`

    - The text that you will see between the `<H1>` and `</H1>` are going to be the
    headings. If you want to have more than one heading show up, you would just need
    to change the heading number, such as having `H2`, `H3`, `H4`, and so on.

    - The content of the program or the information that you will see on the screen
    is going to go between the symbols `<BODY>` and `</BODY>`

    - And if you would like to create a paragraph, but write out the text between
    `<p>` and `</p>`


    ## Your Cheat Sheet for Tags


    When it comes to writing out tags, you need to remember that for the most part,
    they are going to come in pairs. You have seen this a bit above, where all the
    information that you need for the tags is going to fall in between two of the
    same tags on either side. What is on the left side is going to be considered the
    start tag and then the end tag will be almost the same, but you will need to use
    the slash right before it to indicate that this particular part of the code is
    done. Some of the tags that you will likely use in your Java program includes:


    ### Unicode


    - `NAME` – this is going to pertain to one of the sections on the page

    - `HREF` – this is a good one to use when you want to hyperlink within the document
    or when you want to add in the name of a particular URL that you are referring
    to.

    - `onclick` – this is the script that is going to run so that the user will be
    able to click on the anchor. This is going to work so that the user can click
    on your links and the link is actually going to work when they get there.


    ### `<A>` Anchor


    - `TITLE` – this is the name of the program that you are trying to open up.

    - `onmouseout` – this is the script that is going to determine that the mouse
    is no longer the anchor text.

    - `TARGET` – this is going to show the window where the program has to go into.

    - `onmouseover` – this shows that the mouse is right on top of the anchor text.


    ### `<App…>`


    - `CODEBASE` – this is the path that would take you to the applet class

    - `CODE` – this is going to determine which app is currently running.

    - `HEIGHT` – this is the height of the applet

    - `WIDTH` – this will determine the width of your applet

    - `ALIGN` – this is going to determine how much of the text that you are writing
    is going to show up on the screen.


    ### `<APPLET…>`


    - `HSPACE` – this is going to talk about the horizontal space between the applet
    and the surrounding text.

