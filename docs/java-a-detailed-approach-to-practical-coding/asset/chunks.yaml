    - 24 – Target Protocol Address (`TPA`)

    - 26 – Next 2 succeeding bytes


    ## Internet Protocol


    And the one that is the best to use with Java, because this program was created
    to go along with it, is the Internet Protocol. This one is all about providing
    the right boundaries to the network, as well as relaying out datagrams that will
    allow all the networking on the internet to happen. The construction is going
    to involve a payload and a header where the header is going to be known as the
    main IP address, and the interfaces are going to be connected together with the
    help of specific parameters.


    You will also need to use the routing prefixes and the network designation to
    get everything to work together. There are a lot of things that you will be able
    to add into this, but the basic framework that you will need to work with when
    it comes to Java and the Internet Protocol include:


    ```

