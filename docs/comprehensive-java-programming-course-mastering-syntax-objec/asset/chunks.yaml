    String replacedString = sentence.replace("Java", "Python"); // Replaces occurrences
    of "Java" with "Python"


    int indexOfLanguage = sentence.indexOf("language"); // Finds the index of the
    substring "language"


    String[] words = sentence.split("\\s+"); // Splits the sentence into an array
    of words


    Searching and Replacing Text within Strings


