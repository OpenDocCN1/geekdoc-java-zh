    Chapter 5: Conditions and Control Flow in Java


    In Java programming, conditions and control flow mechanisms play a crucial role
    in determining the flow of execution within a program. In this chapter, we''ll
    explore various constructs for handling conditions and controlling the flow of
    execution, including conditional statements, looping constructs, loop control
    statements, and techniques for optimizing loops.


    Conditional Statements: if, else, switch


    Conditional statements allow developers to execute different blocks of code based
    on certain conditions. In Java, the most common conditional statements are the
    if, else, and switch statements.


    The if statement evaluates a boolean expression and executes a block of code if
    the expression evaluates to true.


    Java


    Copy code:


    int x = 10;


    if (x > 0) {


    System.out.println("x is positive");


    }


    The else statement is used in conjunction with the if statement to execute a different
    block of code when the condition is false.


    Java


    Copy code:


    int x = -5;


    if (x > 0) {


    System.out.println("x is positive");


    } else {


    System.out.println("x is non-positive");


    }


    The switch statement allows developers to select one of several code blocks to
    be executed based on the value of a variable.


    Java


    Copy code:


    int day = 3;


    switch (day) {


    case 1:


    System.out.println("Monday");


    break;


    case 2:


    System.out.println("Tuesday");


    break;


    // More cases...


    default:


    System.out.println("Invalid day");'
