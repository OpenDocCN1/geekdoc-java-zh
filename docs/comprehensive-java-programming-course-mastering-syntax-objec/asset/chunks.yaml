    Copy code:


    String firstName = "John";


    String lastName = "Doe";


    String fullName = firstName + " " + lastName; // Using the + operator for concatenation


    String formatting is the process of inserting values into a string template to
    create formatted output. In Java, string formatting can be achieved using the
    String.format() method or the printf() method.


    Java


    Copy code:


    int age = 30;


    String message = String.format("My name is %s and I am %d years old.", fullName,
    age);


    System.out.println(message);


    Manipulating Strings with Built-in Methods


    The String class in Java provides a wide range of built-in methods for manipulating
    strings, including methods for extracting substrings, converting case, trimming
    whitespace, and more.


    Java


    Copy code:


    String text = "   Java Programming   ";


    String trimmedText = text.trim(); // Removes leading and trailing whitespace


    String upperCaseText = text.toUpperCase(); // Converts text to uppercase


    String lowerCaseText = text.toLowerCase(); // Converts text to lowercase


    Other common string manipulation methods include substring(), replace(), startsWith(),
    endsWith(), indexOf(), and split().


    Java


    Copy code:


