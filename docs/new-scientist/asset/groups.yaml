    # The leader Making the cut


    ASK most people to list the causes of climate change, and you would expect to
    hear about oil companies, flights and cars. But frankly, we are actually producing
    food that has massive impacts. The flip side of this is that we can have massive
    environmental benefits. Boosting yields could mean producing the same amount of
    food on half the land, save all the carbon that stores. One of the best ways to
    do this is to develop better crops. Plants and animals have been transformed by
    conventional breeding, but it is a slow and costly process. Powerful and precise
    tool, CRISPR. Another idea is to create crops with deeper roots that sequester
    carbon. The idea is to lock more carbon in the soil to help slow global warming.
    Of course, some creations could have undesirable consequences, these should be
    judged on case-case basis because we also need to consider the risks of unintended
    CRISPR crops and cows. Tiny change in generation. This tiny change has been edited
    into dairy cows in New Zealand, with the aim of making them more tolerant to heat.
    Many groups are trying is to be very hard to reduce the greenhouse emissions from
    farming. Rejecting technologies will make that job harder.


