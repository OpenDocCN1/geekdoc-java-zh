    # 德国法兰克福的养老院居民，一位未来的机器人护理员


    “只有当技术准备好实施时，自动化才会发生，”加利福尼亚斯坦福大学人类中心人工智能研究所的 Etchemery 说道，“如果技术还没有准备好接管任务，那么疫情并不一定会加速其采用。”


    “新冠肺炎可能会加速某些投资，但我们所观察的是一个比几个月更长的时间周期。”


    许多任务仍然难以自动化，例如组装智能手机、清理快递或进行医学诊断，这些任务需要人类的洞察力和同理心。如果 AI 可以完成一些工作，那么仍有一些任务是离开了人类触感就无法完成的。世界距离机器人治疗师，或者对于护士来说还有很长的路要走。


    与之前的创新浪潮相比，最容易自动化的工作是那些重复且枯燥的工作。人们被要求填满一张电子表格或包装一个箱子。


    # 重新定义工作


    马萨诸塞州波士顿大学的经济学家 James Bacon 同意这一观点。我们可能看到的总工作数量的减少，但是不同的工作。“没有证据表明 AI 会取代人类，但它会创造新的工作，”Chalmers
    说，“无论如何，我们已经看到对无人机操作员、数字营销专家、视频支持和虚拟活动组织者等的需求在增加。在未来，我们需要机器人机械师和客服人员，这样人们‘再也不能没有机器人在身边’。”


    “这将需要新的工作。工作将被重新定义，”Hardy 说道。许多专家建议，在后疫情时代缓解自动化经济影响的一种万妥方法是：投资教育，特别是重新教育。“核心是确保任何人都能以小块化的方式参与技能提升和重塑，”Jesuthasan
    说道，“而不是执着于为期三到四年的学位，而你指望在毕业后的 30 年里保持竞争力。我认为世界已经从那种技术模式中迅速演变了。”


    这需要劳动者采用现代学习方法，但政府和公司必须介入并提供帮助，通过提供补贴的大人课程、再培训计划和其他类型的转型。这将有助于实现必要的转型，特别是后疫情的恢复。“否则，如果听任于市场力量，我们将不得不发现并失去许多被遗落的人，”Jesuthasan
    说道。


    随着自动化趋势的发展，我们还将面临其他挑战。一个主要问题是，AI 倾向于继承并放大我们训练数据中存在的偏见——例如，少数群体的不平等或色盲歧视。如何在日益增长的自动化中，为负责任地使用机器划定界限，以及负担得起技术与负担不起的人之间可能出现的全球分化。


    寻找解决方案需要空间来思考这些问题，这在全球大流行期间是很困难的。“我们是一个非常被动的社会，”Hardy 说，“很难说接下来会什么，我们现在还没有处于一个可以节奏的状态。”


    不过，如果处理得，我们就可以拥抱新科技带来的机会，而不是被它伤害。随着新冠肺炎威胁的持续，像杀病毒的 UV 机器人可能正在重新定义工作，但它们为我们其他人提供了安全。


    > Sandy Song，总部位于新加坡的自由技术记者 @sandyong_yx


