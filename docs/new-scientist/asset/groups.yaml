    “我想大多数人对某些声音产生某种程度的反感，”来自加州大学圣地亚哥分校的米恩·艾登斯坦（Mien Edenstein）说，但据报道，严重患者有一种被称为“恐音症”（misophonia）的疾病。


    “患有恐音症的个体反感如此严重且痛苦，以至于对他们的健康和生活质量产生了重大影响。”


    艾登斯坦和她的同事想找出仅仅是声音本身让人们感到痛苦，还是声音来源会影响他们的感知。然而，团队识别了相同人数的恐音症患者和受控者。


