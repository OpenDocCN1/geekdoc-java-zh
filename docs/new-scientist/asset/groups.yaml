    SMART METER, SMARTER TECH

    A smart meter won''t stop your fridge.

    Or your phone charging needing all manner jiggery to make it work.

    But it could still make tomorrow look a little different.

    That seemingly run-the-mill box will help Britain''s energy adapt.

    So while it might seem like nothing will change.

    With a smart meter, everything just might.

    Ask your energy supplier for a smart meter today.

