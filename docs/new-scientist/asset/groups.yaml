    # EPS-SG 计划科学家


    EUMETSAT 是欧洲的**气象卫星机构。其作用是建立和运行气象卫星，从太空监测天气和气候，帮助保护人类生命、财产和工业。EUMETSAT 卫星极地系统（EPS）及其继任者
    EPS 第二代（EPS-SG）计划的卫星利用数据，可提前计算计算长达 10 天的预报。


    EPS 计划科学家为 EPS 的运营提供高水平指导、科学领导力，并协调 EPS 运营的科学支持，同时为 EPS-SG 系统的开发、协调和运行提供科学支持。这包括对
    EPS-SG 开发计划的管理支持、对关键项目级用户和科学文档的协调与维护、对 EPS-SG 系统调校所需的所有科学活动进行监督，以及发起相关的科学研究。


    现向对卫星/遥感数据中的气象应用以及相关用户社区拥有深入知识和丰富经验的科学领袖征求申请。


