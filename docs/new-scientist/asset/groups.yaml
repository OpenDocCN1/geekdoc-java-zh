    \n![](img/71a62d31bf56be9d093eacfaee93dd09_26_0.png)\n\n# Views Aperture\n\n![](img/71a62d31bf56be9d093eacfaee93dd09_27_0.png)\n\
    \n26 | New Scientist | 10 October 2020\n\n## Super sea view\n\nPhotographers Roland\
    \ Miller and Paolo Nespoli. Image courtesy of NASA and ASI\n\nEARTH's vast oceans\
    \ are particularly spectacular when glimpsed through a flurry of wispy clouds\
    \ from the International Space Station as it orbits kilometres above the planet.\
    \ This collaborative shot taken from Cupola, the ISS's observation module, was\
    \ created by Chicago-based photographer Roland Miller and Italian astronaut Paolo\
    \ Nespoli.\n\nThe module's seven windows allow astronauts to observe and other\
    \ operations outside the ISS. They are also ideal for enjoying panoramic views\
    \ of Earth and space. Cupola's outlook, especially from its 50-centimetre central\
    \ window, is a massive improvement on the small portals used before the module\
    \ was installed in 2010.\n\nThis image is from *Inner Space: A visual exploration\
    \ of the International Space Station* by Nespoli and Miller. The book documents\
