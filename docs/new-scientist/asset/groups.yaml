    supervision, doctors.


    "There may be dangers in the method," says Willem of the University of Helsinki,
    Finland. The team is doing work for tests, ruling out a third of the methods.


    Some studies show that babies born by C-section have different gut bacteria because
    they aren''t exposed to their mothers'' bacteria while they are. But researchers
    proposed that this is why children have significantly higher rates of allergies,
    asthma and obesity.


    Some groups have tried to control the microbial variety by wiping the mouths of
    babies born by C-section with their mother''s faecal fluid. This made their gut
    bacteria more like those of vaginally born, but not identical to them.


    Mothers'' faecal matter colonises the baby''s gut, as women in labour often defecate,
    and people delivering babies in the past would often have faecal bacteria in their
    hands, says Vo.


    His team recruited 17 women who needed C-section for multiple reasons. Three weeks
    before their operation, each gave a stool sample, which was frozen. Ten women
    were ruled out from the study, due to some harmful microbes, as group B streptococci.


    For the rest, a few milligrams of feces was mixed with breast milk and fed first.
    After three months, the infants'' gut bacteria were more similar to those of babies
    born vaginally than those of babies who didn''t have this intervention, according
    to data from other studies (Cell, doi.org/fbhj). The team is now doing a placebo-controlled
    trial with 40 babies.


    In a larger study in Sweden, babies are brushed with a gauze swab put into the
    mother''s mouth.


    Some researchers say that using faecal bacteria in these trials carries risks.
    "Without them, you are limited in what you can detect," says Peter Brockhurst
    at the University of Birmingham, UK.


    Gut bacteria born by C-section may not be due to how they were born, but because
    the surgery was needed, says Kjerts Jaeger at Baylor College of Medicine in Houston.
    "We see them as a way to label women who have bacteria as endangering their babies,
