    第一组团队向他们展示了人类和黑猩猩咀嚼的音频片段，以及如动物咀嚼或人走在碎石地上的声音。


    该承诺由中国、美国、巴西和澳大利亚签署，这些国家都是生物多样性丰富的国家。最遗憾的是，他们并没有这样做——他们的领导人取消了环境保护措施——


    他们重复了这些内容，但这次改变了他们听到的声音——他们有时很喜欢。在第三轮中，据说人们想要他们所产生的内容。


    中国的缺席令人失望，尤其是考虑到它是全球第二大排放国。


    上周善意的证明将体在昆明达成的目标中。最近的一份报告建议到 2030 年保护保护全球三分之一的陆地和海洋，这将保护面积增加一倍，需要剧烈的加速。而且这是二十个目标之一。


    最后，他们向参与者展示了与每个音频片段对应的人，并重复了完整背景。事实上，受访者按 1 到 10 分的标准对每个声音让他们不舒服的程度进行了评分。


