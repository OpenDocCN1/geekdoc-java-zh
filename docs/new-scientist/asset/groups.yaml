    Many tasks are still difficult to be automated, such as assembling a smartphone,
    clearning out deliveries, or performing a medical diagnosis, which require human
    insight and empathy. If AI can do some of the jobs, then there are tasks that
    cannot be done without a human touch. The world is a long way away from robot
    therapists, or for nurses,


