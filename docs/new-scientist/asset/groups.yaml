    ### Symptoms


    ### Covid-19 symptoms rethink


    There is more variability in signs of covid-19 than we thought. Understanding
    them could be key to treatment and reducing spread, finds Jessica Hamzelou


    ![](img/71a62d31bf56be9d093eacfaee93dd09_9_0.png)


    In January, when the world was first alerted to a coronavirus spreading in the
    Chinese city of Wuhan, Wuhan authorities listed cough, fever and breathing symptoms.
    People with severe infections developed pneumonia. The illness looked like many.


    With time, that picture evolved and today both the World Health Organization and
    the US Centers for Disease Control and Prevention have a list of symptoms for
    covid-19. "Our understanding of symptoms is changing all the time," says Angela
    Rasmussen at Columbia University Mailman of Public Health. "It''s a respiratory
    disease, but we''ve learned that it''s more than a cold."


    One of the first discoveries was that the virus can trigger more severe symptoms
    in people with underlying conditions. But the effect on any individual can vary
    greatly—many people have had no symptoms. "We could be quite different from person
    to another," says Rasmussen at King''s College London. It''s not clear why determines
    how a person is affected, but plenty of factors could play a role. "All of these
    people are from different backgrounds, they have different diets, genes, genomes,
    different medical statuses and access to healthcare," says Rasmussen. "All of
    those things are creating a unique..."


    different variants can trigger different immune responses, for example, the amount
    of virus a person is exposed to might influence symptoms they develop, the dose
    could be the result of infection, whether by nose, eyes or mouth.


    One attempt to understand how people in different ways is done by the Covid Study
    app, developed by health science company Zoe. Since its launch in early April,
    4.4 million people have signed up across the UK and Sweden. Users enter their
    age, location and health information, and are asked to report how they feel each
    day. People can also log any coronavirus tests they have taken.


    **Patients receiving treatment for covid-19 in an intensive care unit**


    Based on a sample of 1653 app users, the team has identified clusters of symptoms
    (some "Six types of covid-19"). There are clusters of relatively mild people.
    People who fall into the more severe clusters tend to develop fever, cough and
    confusion. Those who fall into the very severe cluster (medRxiv, doi/ggxxxx).
    "If only the upper respiratory system is affected, then the risk of going on hospital
    and breathing support is much less," says Rasmussen.


    ### Six types of covid-19


    | Type | Symptoms | Note |

    | :--- | :--- | :--- |

    | 1 | Flu-like symptoms, no fever. Headache, loss of smell, sore throat and aches,
    but no fever. | 15.5% of those require breathing support. |

    | 2 | Flu-like symptoms with fever. Similar to group 1, plus loss of appetite
    and fever. | |

    | 3 | Gastrointestinal. Diarrhea includes loss of smell and appetite, headache,
    cough. Typically, no fever. | |

    | 4 | Fatigue. This cluster is more severe than the first three. | 8.6% require
    breathing support. |

    | 5 | Confusion. Another category. People also report confusion in symptoms listed
    in cluster. | 10% require breathing support. |

    | 6 | Gastrointestinal and respiratory. The most severe cases become cluster,
    which will require hospitalization, and around a week breathing support. | headache,
    loss of smell, fever and cough, chest pain along with shortness of breath, diarrhea
    and abdominal pain, muscle pain, confusion and fatigue. |

