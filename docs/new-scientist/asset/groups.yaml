    \ | 10 October 2020\n\n# 15 October 2020 6pm BST/1pm EDT\nONLINE EVENT:\nHOW TO\
    \ KEEP YOUR BRAIN HEALTHY (EVEN IN A PANDEMIC)\n\nWith the pandemic predicted\
