    ## "My parents told me I should make myself useful and not waste time"


    Feng Zhang is one of the pioneers of gene editing. He tells Jessica Hamzelou how
    we can use it not just to battle disease, but also against hunger and even climate
    change.


    ![](img/71a62d31bf56be9d093eacfaee93dd09_42_0.png)


    It is no exaggeration to call Feng Zhang one of the most groundbreaking scientists
    working today. In his 20s and 30s, he helped develop two revolutionary technologies.
    The first, known as optogenetics, inserts genes into brain cells to allow them
    to be switched on and off by shining a light on them. This technique is being
    explored as a potential treatment for some neurological disorders.


    The second, CRISPR, is a gene-editing technology that allows scientists to correct
    near-limit lists of human diseases. These days, Zhang has a dual appointment at
    the McGover Institute for Brain Research and the Broad Institute in Massachusetts,
    and he has been spoken of a future Nobel laureate.


    Powerful tools can be used to benefit humanity, however, when it comes to CRISPR,
    there have been some worrying developments. Two years ago, biophysicist He Jiankui
    widely criticized and eventually handed a prison sentence for CRISPR to edit human
    embryos. Many researchers, including Zhang, feel his actions were an ethical oversight.


    Meanwhile, Zhang faces an ongoing dispute over who should own the patent for CRISPR.
    Other scientists were first to publish details of the technology, but he was quickest
    to show it works in human cells.


    New Scientist caught up with Zhang to discuss the low-down on the future of CRISPR.
    These days, Zhang is optimistic that the technology may help us in the fight against
    covid-19 and that it may have applications.


    A harmless virus carrying the CRISPR tools is injected into the eye, where it
    modifies cells to restore normal function of a faulty gene.


    Another called CRISPR Therapics has been using the system to treat people who
    have beta thalassemia, a disorder in which the blood has low levels of hemoglobin.
    Patients responded well and no longer need transplants.


    Because we can use CRISPR to treat many genes at once in human cells, scientists
    have been using it to carry out specific edits in specific diseases, and we can
    potentially edit those genes too.


    So CRISPR is already showing promising results. How does it make you feel when
    you see that?


    It is really exciting to be building something that has a huge impact on people''s
    lives, but it also makes me realize that there is more to learn.


    Seeing these promising results really motivates me to want to do more.


    > **Jessica Moreira:** What are the most promising applications of CRISPR in our
    world today?

    > **Zhang:** One of the tantalizing possibilities is to correct DNA sequences
    so that we can restore genes and treat disease. I co-founded Editing Medicine
    with other colleagues.


    ## What needs to be done before becoming approved treatments?


    We need to make CRISPR work efficiently and precisely. One risk is that it will
    not make edits that you want; by random chance, it also edits something else.
    We have started on engineering new versions of the system that are more specific.
    We also need to develop the tools so that we can make many types of changes in
    the genome and influence how genes work in different ways.


    We are working on new ways to deliver CRISPR. We have developed proteins from
    bacteria, which are much smaller than the first CRISPR system we reported. The
    report makes the package easier, it is better to get it inside cells where it
    can do its work. We have already shown that this system can edit genes much more
    efficiently.


    ## Are there conditions that you are particularly interested in?


    I had an interest in mental health and psychiatric conditions since I was a college
    student. People have been affected by illnesses. CRISPR is already used to understand
    how they affect the brain and how we might develop more effective treatments.


    But all diseases are different in one way. Biologically, also emotionally. In
    terms of negatively affecting their lives, it is the same - it is a toll on people''s
    quality of life. This is why I have focused on developing the technology for gene
    editing as something broadly applicable.


    ## When you are in a position to decide who owns the rights to the technology,
    as it is being developed?


    It is important that this technology is developed safely and responsibly, and
    shared in a way that everyone can benefit from it. The patient has the right and
    obligation to ensure that the technology is made accessible. The Broad Institute
    will continue to do this.


    ## What do you think the next breakthroughs are going to be?


    We will continue to see a lot of exciting applications in therapeutics. Cell therapy,
    where clinicians take cells out of a patient, repair them, and put them back,
    is where we see a lot. A harmless virus carrying the CRISPR tools is injected
