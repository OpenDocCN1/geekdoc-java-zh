    how a person is affected, but plenty of factors could play a role. "All of these
    people are from different backgrounds, they have different diets, genes, genomes,
    different medical statuses and access to healthcare," says Rasmussen. "All of
    those things are creating a unique..."


    different variants can trigger different immune responses, for example, the amount
    of virus a person is exposed to might influence symptoms they develop, the dose
