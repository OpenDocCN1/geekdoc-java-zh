    ## Features


    ## Covid-19''s AI revolution


    Automation is already taking over jobs, the coronavirus pandemic is highly accelerating
    the trend. Should we be worried, asks Sandy Ong.


    On an upper floor, something stirs in the semi-density of a closed shopping store,
    bathing the window display in living light. Salem stops in front of security guards
    rush front. The UV Bot, with 1000 watts'' UVC light not "tearing apart strands
    of virus DNA" comes everywhere, as well as a few other malls and hospitals in
    Singapore. It is doing helping human workers what would have done before the covid-pandemic:


    Similar scenes are occurring across the world. In Seoul hospitals, Moxi delivers
    medications, takes and samples. P Guard enforces lockdowns on Turkish streets.
    James telepresence helps residents at Belgian home care stays connected. Another
    Uber supermarket delivery service meets people in gone and even help the work
    gap. Meanwhile, non-embodied artificial intelligences are assisting in everything
    from contact and tracking patients'' genome code to logistics and customer fulfilment
    of an increasingly competitive online market.


    This trend towards automation and robotisation is now—but covid-19 is vastly accelerating
    it. "What this pandemic has done is to make people extremely aware of the risks
    of social distance", says Richard Pak at Clemson University in South Carolina.
    "In these times, robots and automation definitely provide a safety benefit."


    And also a huge problem. Unemployment has shot up as coronavirus has the global
    economy. What happens if we emerge from the covid-19 recession to find jobs have
    permanently gone—with no plan to keep them ever employed!


    The rise of robotics and AI has also been described as part of a "fourth industrial
    revolution," following from the three step changes over the past three centuries
    powered by coal and steam, by electricity and by digital computing (see). Many
    cheer the promise of self-driving vehicles, virtual assistants and other labour-saving
    innovations. It is hard to argue with technologies that can give us a customised
    message, recommend something good on Netflix or as to pay for groceries with the
    tap of a phone. During the covid-19 pandemic, such technologies have helped reduce
    public health risks by enabling people to work from home, safeguarding productivity
    while staying afloat.


    Before the pandemic, however, many people were worried about potential long-term
    jobs fails of the trend towards automation. One by consulting firm McKinsey &
    Company in 2017 suggested that automation could displace up to 800 million jobs
    worldwide by 2030. In 2013, Carl Frey and Michael Osborne at the University of
    Oxford famously used a machine-learning algorithm to assess how easy jobs could
    be automated. The study concluded that machines will be able to do 47 per cent
    of all jobs in coming two decades—a figure that remains evenly content today,
    Frey. "In the UK, the estimates are at 35 percent."


    ![](img/71a62d31bf56be9d093eacfaee93dd09_45_0.png)


    > "What happens if we emerge from the covid-19 recession to find that jobs have
    permanently gone – and there is no plan B to keep us gainfully employed?"


    ![](img/71a62d31bf56be9d093eacfaee93dd09_46_0.png)


    ## Four industrial revolutions


    The advent of AI and advanced robotics is part of suite of changes that some come
    as a fourth industrial revolution akin to the three that have already passed through.


    ## Getting serious


    Faced with employees under lockdown and need for social distancing measures in
    the workplace, many companies have putting a rocket under these trends, either
    by looking for greater automation the first time or by accelerating extending
    existing plans.


    "There''s so much room for automation now," says Derek Prideo, CEO of Oosar, a
    company in San Francisco that develops AI systems for warehouse robots. "If companies
    were thinking about it, they''re now doing something. they''re actually deploying
    it. Everyone is moving up a phase in their seriousness about automation." "In
    March, a survey by auditing firm Ernst & Young reported that 90 per cent of respondents
    in 44 countries that than three-quarters were taken measures to either confirm
    or re-evaluate the speed of their automation."


    Concept stores like the New Amazon Walmart and other big retailers deploying robots
    to pack and haul goods in pick houses, YouTube and Twitter using more machines
    for content delivery. Chatbots has also seen well Meta Pay 66 per cent of its
    message-based customer enquiries. IBM reported seeing 4 per cent jump in demand
    from February to April for its Watson Assistant software that firms such as US
    retailer Macy''s and car manufacturer Chevrolet to handle online calls.


    ## First industrial revolution: COAL AND ELECTRICITY


    - Kicked off in about 1760

    - Characterised by the steam engine and the first factories

    - Key inventions include steamships and railways, mechanisation widespread

    - Transformed societies from agrarian to industrial


    ## Second industrial revolution: OIL AND ELECTRICITY


    - 1860s onwards

    - Characterised by mass production and the assembly line, as well as new industries
    such as is, electricity and steel

    - Key inventions include the lightbulb, telephone, radio, cars and airplanes

    - Increasing rural to urban


    ## Third industrial revolution: COMPUTING


    - 1960s onwards

    - Characterised by electronics, automation, digitalisation and

    - Key inventions include semiconductors, computers, the internet, e-commerce

    - Shift from physical


    ## Fourth industrial revolution: CONNECTED


    - Characterised by artificial intelligence, robots, big data, smart technology
    and

    - Key inventions include DNA sequencing, blockchain, virtual reality, 3D printing

    - Continued shift from physical to online


    Pridmore says his firm has "seen a big pickup in interest since the pandemic hit.
    His clients include a grocery chain that found demand doubled as people began
    cooking at". Chris Hodges, managing director at UiPath, whose AI platforms help
    de-restocking,, this sentiment. "The pandemic was an accelerator for the adoption
    of."


    Increasing anxiety in lockdown. As part of a recent survey conducted by the Center
    for Governance of AI at Georgetown University, in 15 countries—11 said their governments
    should limit automation in order to save jobs. In January, three months later,
    the number rose to 55 and 44 per cent. Part of that is generalised concern. "If
    you work locally, you will see that automation tends to be valuable during downturns,
    when you lose your job in an economic downturn, you are going to struggle."


    Perhaps the most famous example, highlighted by Frey in his 2019 book The Technology
    Trap, were the Luddites who smashed machines, fought looms and other trappings
    of the first revolution in the UK. The unrest was especially bad after 1815, when
    Europe stepped into a depression, weavers wages took a hit blow food prices skyrocketed
    because of new tariffs imposed on foreign grain. Today, the sheer number of effect-led
    upheaval already posed a big threat to workers and factories, who many find themselves
    out of work. Those financial analysts and researchers whose jobs involve a routine
    of analysis of specific forms of data. Many of these jobs could be replaced by
    AI. "This is one of the first times in history when a mix of blue and white jobs
    are affected," says robotic Ayanna Howard at the Georgia Institute of Technology
