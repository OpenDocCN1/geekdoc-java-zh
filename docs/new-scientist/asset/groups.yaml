    suggest a surefire way to cushion the economic effects of automation in the post-era:
    invest in education, and specifically re-education. "At the heart of ensuring
    that anyone can engage with upskilling and reskilling in bite-sized chunks," says
    Jesuthasan, "as opposed to this fixation on a three or four year degree where
    you''re to be relevant for 30 years after. I think the world has moved very rapidly
    from that technology model."


    This needs workers to adopt modern learning, but governments and firms must step
    in and help too by offering subsidized adult courses, retraining programs and
    other types of transitions. This will help make the necessary transitions, especially
    post-19 recovery. "Otherwise, left to market forces, we will have to find and
    lose lots of people left behind," says Jesuthasan.


    There are other challenges we will have to face as the trend towards automation.
    One major issue is that AI has a tendency to inherit and amplify biases that exists
