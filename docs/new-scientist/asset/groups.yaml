    Putting aside-your-own adventure books, such as the Fighting Favor series, or
    films like Mirrorless, the chance to influence and craft a narrative is not something
    video games can provide. There are limits by genre and reward—play as a first
    person shooter and you won''t be to put your gun down and host a party—but for
    some games, choice is their defining.


    In Wasteland choosing choices is a real challenge. The set is in Colorado, some
    years after a nuclear war, and you put in charge of the Rangers, a memorial police
