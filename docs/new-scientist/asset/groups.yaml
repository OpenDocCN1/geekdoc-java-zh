    ## “我的父母告诉我，我应该让自己变得有用，不要浪费时间”


    张锋（Feng Zhang）是基因编辑领域的先驱者之一。他告诉 Jessica Hamzelou，我们不仅可以利用它来对抗疾病，还可以对抗饥饿甚至气候变化。


    ![](img/71a62d31bf56be9d093eacfaee93dd09_42_0.png)


    将张锋称为当今世界最具突破性的科学家之一并不为夸张。在他20多和30多岁时，他帮助开发了两项革命性的技术。第一种被称为光遗传学，将基因插入脑细胞中，使其通过光照射来开启或关闭。这项技术正在被探索作为某些神经系统疾病的潜在治疗方法。


    第二种是 CRISPR，这是一种基因编辑技术，允许科学家纠正人类的人类疾病。如今，张锋在马萨诸塞的麦格文脑科学（McGovern Institute for
    Brain Research）和宽研究所（Broad Institute）兼任职务，并被认为是未来的诺贝尔奖得主。


    然而，强大的工具本可以造福人类，但在 CRISPR 方面已经出现了一些令人担忧的进展。两年前，生物物理学家健建奎因使用 CRISPR 编辑人类胚胎而受到广泛批评，并最终被判刑。包括张锋在内的许多研究人员认为他的行为是伦理上的疏忽。


    同时，张锋面临着一场关于 CRISPR 专利归属的持续争议。其他科学家首先发布了该技术的细节，但他最快证明了它在人类细胞中是有效的。


    《新科学人》（New Scientist）采访了张锋，讨论了 CRISPR 的未来。如今，张锋乐观地认为，这项技术可能帮助我们对抗新冠肺炎，并可能具有应用前景。


    一种携带 CRISPR 工具的无害病毒被注射到眼部，在那里它修改细胞以恢复缺陷基因的正常功能。


    另一家名为 CRISPR Therapics 的公司一直在使用该系统治疗 β 地海贫血症患者，这种疾病会导致血液中血红蛋白水平过低。患者反应良好，不再需要移植。


    因为我们可以使用 CRISPR 同时处理人类细胞中的许多基因，科学家们一直在利用它对特定疾病进行特定编辑，我们也有可能编辑那些基因。


    所以 CRISPR 已经显示出令人鼓舞的结果。看到这些时你感觉如何？


    能够构建出对人们生活产生巨大影响的东西是非常令人兴奋的，但也让我意识到还有很多需要学习的。


    看到这些充满前景的结果激励了我想要做更多事情。


    > **Jessica Moreira:** 在当今世界，CRISPR 最有前景的应用是什么？

    > **张:** 令人兴奋的可能性之一是纠正 DNA 序列，以便我们恢复基因并治疗疾病。我与其他同事共同创立了 Editing Medicine。


    ## 在成为批准的治疗方法之前，需要完成什么？


    我们需要让 CRISPR 运行得高效且精确。一个风险是它不会进行你想要的编辑；由于随机偶然，它还会编辑其他东西。我们已经开始工程更高特异性的新版本。我们还需要开发工具，以便我们对基因组进行多种类型的变化，并通过不同的方式影响基因的作用。


    我们正在研究传递 CRISPR 的新方法。我们开发了来自细菌的蛋白质，它们比我们报告的第一种 CRISPR 系统小得多。这项报告使得包装更简单，更容易让它进入细胞发挥作用。我们已经证明该系统可以更高效地编辑基因。


    ## 你对哪些疾病特别感兴趣吗？


    从我上大学时代起，我对心理健康和精神疾病感兴趣。人们受到疾病的影响。CRISPR 已被用于理解它们如何影响大脑，以及我们如何开发更有效的治疗方法。


    但所有疾病在某方面是不同的。在生物学上如此，在情感上也是。在负面影响他们的生活方面是一样的——这是对生活质量的损害。这就是为什么我专注于将基因编辑技术开发为一种广泛适的技术。


    ## 当技术正在开发时，你有权决定谁拥有它的权利吗？


    确保这项技术以安全、负责任的方式开发，并以每个人都能受益的方式共享是非常重要的。患者有权利也有义务确保技术的可及性。宽研究所将继续这样做。


    ## 你认为下一个突破将会是什么？


    我们将继续在治疗领域看到许多令人兴奋的应用。细胞疗法，即医生从患者身上取出细胞、修复后再放回，是我们看到很多的地方。一种携带 CRISPR 工具的无害病毒被注射到眼部，在那里它修改细胞以恢复缺陷基因的正常功能。


    另一家名为 CRISPR Therapics 的公司一直在使用该系统治疗 β 地海贫血症患者，这种疾病会导致血液中血红蛋白水平过低。患者反应良好，不再需要移植。


    因为我们可以使用 CRISPR 同时处理人类细胞中的许多基因，科学家一直在利用它对特定疾病进行特定编辑，我们也有可能编辑那些基因。


    所以 CRISPR 已经显示出令人鼓舞的结果。看到这些时你感觉如何？


    能够构建出对人们生活产生巨大影响的东西是非常令人兴奋的，但也让我意识到还有很多需要学习的。


    看到这些充满前景的结果激励了我想要做更多事情。


    （注：原文后续部分存在大量内容重复，此处译文已根据要求进行处理，确保不重复输出原文。）


