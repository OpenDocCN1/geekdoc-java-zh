    在《荒野之地》中，做出选择是一项真正的挑战。背景位于科罗拉多州，核战争发生多年后，你负责“游侠者部队”，这是一支纪念性的警察部队。你的第一个选择是挑选小组成员，在这么多角色扮演游戏中，风格和发型供选择。《荒野之地5》更进一步。扮演一名默剧演员？你会变得更隐蔽，但无法说话，并且必须穿上条纹衫并画上脸彩。或者你想提升修理技能，《荒野之地3》并没有自认为。在游戏的第一小时里，你遇到了教父，他用一个基地招募了你，并要求你追捕并逮捕三个反叛的孩子，他们都在争夺他的帝国。


    这种选择我路径的能力让我沉浸在《荒野之地3》的故事中，尽管这是有代价的：游戏频繁做出选择。开发者正努力修补游戏，而这种修复是为了让我记住每当《荒野之地3》停顿时，我是有多么享受它。我渴望加速并继续玩。


    ## 荒野之地3

    InXile Entertainment

    PC, PlayStation 360, Xbox One


    支线任务很有趣，但我最喜欢的任务是主线故事的一部分。在丹佛追踪教父的一个克隆人时遇到了“吉珀人”（Gippers），这是一场反抗 AI 版里根总统的教派起义，他们居住在一个装备了死亡射线的巨大州境内。这正是我所想要的。


    ![](img/71a62d31bf56be9d093eacfaee93dd09_33_2.png)


    这构成了游戏的骨架，但还有许多其他任务。一个简单的任务是通过调查公寓里的新手来救了你的团队。门被撞开了，并被路障封住，他们在受到攻击时坚称自己是人类。


    > 我发现了一个计数赢得了 AI 版美国总统里根的人，在一个拥有死亡射线的州里


    ## 辐射世界3

    PC, PlayStation 3, Xbox 360


    《辐射世界》系列深受《荒野之地》的影响，但跳到了《辐射世界3》，背景是废墟中的华盛顿特区及周边。


    ## 魔兽：夺星夺

    Firaxis Games

    PC, PlayStation 3,

    Xbox, Android


    《荒野之地3》中的回合制战斗让你那装备劣势的军队去击败敌人。如果一切守住，XCOM——这并不是坏事，因为它是一部出色的游戏。


    在使用游戏的策略和像谜题般的回合制战斗追踪后，我找到了制造他们的人，结果发现是一个第四代克隆人。


