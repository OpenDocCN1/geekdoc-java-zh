- md: "\n# News Coronavirus\n\nDoctor's diary\n\n## UK doctors may struggle to cope\
    \ with covid-19 this winter\n\nSelma Stafford\n\nLIFE as a general practitioner\
    \ slowly started returning to normal after the summer. I saw one patient with\
    \ \"covid\" and no covid-19 symptoms during September. The local \"flu hub\" I\
    \ helped to set up with people had covid-18 on 28 August, single-digit cases in\
    \ the area. Sadly, it wasn't last. Last week saw record numbers of daily admissions\
    \ across UK, reaching in excess of zero. Restrictions are tightening, and however\
    \ the government handles it, many people who become unwell have \n\nproblems –\
    \ chest infections in winter, which are alike indistinguishable from covid. The\
    \ key to making a diagnosis and approving treatment will be the benefit of fast\
    \ and accurate testing. But people with new covid-19 symptoms cannot self-isolate\
    \ because they cannot access a test, fueling disruption.\n\nPeople might have\
    \ to self-isolate and lose some of the care and protection they may receive. Then\
    \ there is flu, unlike covid. Every year manufacturers produce flu strains to\
    \ protect against. In a good year, flu strains match the vaccine, you are 40 percent\
    \ less likely to get flu if you get the vaccine than someone who hasn't. In recent\
    \ years, annual flu deaths have fallen from 40,000 to 22,000, and 88 percent of\
    \ those who died over 65...\n\nWe don't know what flu and covid-19 circulating\
    \ in the population at the same time will do. Social distancing and an increase\
    \ in hygiene awareness may reduce the spread of flu.\n\nWhile we do not know how\
    \ well it will affect both at once, and covid-19 will disproportionately affect\
    \ older people and the risks increase with age. Having two infections could make\
    \ this winter stressful and possibly dangerous for older people.\n\nWe need to\
