    \ natural phenomenon in the universe. Fire is hot and sometimes, the natural states\
    \ of matter. Our sun is a large ball of gas and plasma produced by nuclear explosions.\
    \ Our solar flares are magnificent and beautiful, so different from those that\
    \ have ravaged California.\n\nAt the time of writing, the observatory has made\
    \ it the fire, which is now around 60 percent away. The fire came within 6 metres\
    \ of its structures. Towards the end of this saga, the Los Angeles Times reported\
    \ that the observatory is probably to go burning down soon, given the perilous\
    \ fires that were caused by Chanda's new variety of astronomy. This year, it sank\
    \ that there is nothing stopping SpaceX and Amazon from filling low Earth orbit\
    \ with their new satellites, forever altering our capacity to see the universe's\
    \ true face clearly. C. Rubin Observatory where I am a member of the dark working\
    \ group, must now have all of their future images of sky objects destroyed by\
    \ thousands of satellites that make our analysis harder.\n\n> \"This year, it\
    \ sank that there is nothing stopping Amazon and SpaceX by flooding low Earth\
    \ orbit with satellites\"\n\nClimate change is not the only human that threatens\
    \ normal climate. My colleague tells me that the air in LA is not clear for another\
