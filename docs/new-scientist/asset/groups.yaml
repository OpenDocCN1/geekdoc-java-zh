    当国际空间站在位于地球上方数公里的轨道上运行时，穿过层层稀薄的云雾瞥地球时，地球广阔的海洋显得尤为壮丽。这张从国际空间站观测舱穹顶舱（Cupola）拍摄的合作照片，是由芝加哥摄影师罗兰·米勒和意大利宇航员保罗·内斯波利创作的。


    该模块的七个窗户允许宇航员观察国际空间站外部并进行其他操作。它们也是欣赏地球和太空全景的理想场所。穹顶舱的视野，尤其是从它50厘米的中心窗望出去，相比2010年安装该模块之前使用的小型窗口有了巨大的改进。


