    # 生理学


    ## CRISPR


    ## 你能通过脸部看透内心吗？


    ## 基因编辑牛类以抵御气候变化


    Grace Browner

    Michael Le Page


    我们可能一眼就能看出某人的心率，这可以帮助我们解读情绪状态。伦敦大学的 Alejandro Galvan-Pol 和他的同事们测试了 120 名并排站立的志愿者。这些人的心率显示在屏幕上，形式为一个正方形，每心跳一次，该正方形的颜色就会从黑色变为红色。


    ![](img/71a62d31bf56be9d093eacfaee93dd09_16_0.png)


    随后，参与者被要求说出他们认为的心跳频率是多少。平均而言，他们猜中的准确率为 58%，超出了预期。


    伦敦金斯顿大学的 Fatima Felberg 发现，人类情绪竟然会导致我们互动的人血液流量发生如此剧烈的变化——这模糊了一个经典案例的边界。


    大多数人在某种程度上可以感知到自己的心率，正如高级研究学院的 Michael Airah 所说：“但真正好奇且迷人的是，我们仅仅通过感知他们的脸就能看到关于他人的这些信息。”


    这可能有助于我们理解他人的行为和情绪，特别是 Galvan-Pol 的团队（PhysRx.org/doi/rb）。

    Allen 表示：“这可能极大地‘读出’他人的心率，这是我们都能感受到并与他人共同感应的东西。”


    该研究的一个局限性是，测试在没有提示的情况下也能检测到更高或更低的心率。

    Allen 说：“目前尚不清楚人们利用什么信息来完成任务，但这本身就是一个非常有趣的研究课题。”


    CRISPR 基因编辑已用于创造出带有灰色斑块而非牛角的牛，这将减少压力。其目标是减少由全球变暖引起的动物热压力，而这种压力在牛类牧场产生的排放和森林砍伐中占有不小的比例。


    新西兰农业研究局的 Gayle 表示：“基因组编辑是改进和适应气候变化的一种很有前景的方法。”加州大学的 Allen Veenenaar 说，新西兰的奶牛在挤奶过程中已有近
    20% 的时间处于热压力状态，这也降低了繁殖能力，“在炎热天气很难让它们怀孕。奶牛每年大约需要凉爽的皮毛来维持奶产量。”


    这只小牛身上的灰色斑块旨在减少热压力。


    四周大时的感染，这些健康问题被认为是克隆过程的结果而非基因编辑的结果。Sable 表示，生产 CRISPR 编辑的牛并不需要克隆，因此他们在创建具有这种特征的小牛时会避免使用克隆。


    像荷斯坦奶牛这样主要是黑色皮毛的牛更难承受热压力。Gayle 和他的同事们决定找出他们是否能从浅色中获益。一只赫福德小牛是通过一个涉及色素沉的基因微小改变产生的，其名为——


    佛罗里达大学的 Peter Hansen 和他的同事们已经证明，以白色为主的牛表现更好，且产量下降幅度也比黑牛低。然而，新西兰的农民拥有大多是黑牛，因此他们尚未研究过这个问题。


    # 2


    ## 小牛出生时即带有基因编辑结果


    使用标准育种技术培育奶牛小牛将导致后代并不完全适用于使用。至少，利用 CRISPR 改变一头新西兰荷斯坦奶牛的雄性皮肤细胞中的基因正被用于产生待植入的后代。这些小牛出生时，颜色发生了巨大变化（BioRx.org/doi/cell）。


    其中一只小牛在出生后被处死，另一只……


    其他团队正在通过引入耐热变异基因基因来创造更耐热的牛，“耐热“变异”已经通过正常育种引入了荷斯坦牛中。


    一家名为 Genesis 的美国公司已将这一特征编辑到安格斯牛肉牛中。第一只小牛出生于 2018 年 8 月的巴西牛肉牛，出生时是巴西流行的内罗雷牛（Nelore）品种，但该品种在热带气候下可以产生三只后代。


    全球有 15 亿头牛因全球变暖而遭受热压力，但它们也是气候变化的主要原因之一，农业生产产生了约 18% 的温室气体排放。


    2020 年 10 月 10 日 | 新西兰 | 15


    # 新闻


    ### 考古学


    ### 天文学


    ## 第一位旅行到美洲的非洲人？


    Colin Barras


    ## 在银系中游荡的地球级流浪行星


    Lee Crane


    一个埋在美洲第一个定居点的 15 世纪骨骸可能属于一位非洲女性。她在二十多岁时去世，在克里斯托夫·哥伦布首航美洲五年后，在大西洋贸易开始几十年之前。未参与分析的密歇根州立大学的
    David Wheat 说：“我认为她可能是已知参与定居的最早非洲裔个体。”


    一颗质量与地球相当的流浪行星漂浮在自己的空间里。这是我们发现过的最小的流浪行星——天文学家只发现了少数，其中一些的质量远大于木星。


    哥伦布于 1492 年到达第一个位点并返回西班牙，最终在美洲建立了第一个欧洲小镇。这些定居点主要是通过引力微透镜发现的，当行星经过一个较亮物体前方时，行星的引力会弯曲光线，而不需要接触。


    殖民者因疾病和饥饿遭受了高死亡率。许多人埋在位于今多米尼共和国的城镇墓地里。


    十年后，该团队的 DNA 分析发现骨骸暗示了与撒哈拉以南非洲相似的遗传标记。哥本哈根大学的 Schroeder 表示，证据尚不确定。“考古学可以用来拼凑过去的故事。”


    佛罗里达大学的 William Keegan 说，人们利用什么信息来完成任务尚不清楚，但这本身就是一个有趣的研究课题。“考古学可以用来拼凑过去的故事。” 发现美洲的第一个非洲定居点


    16 | 新闻 | 2020 年 10 月（（科学家）


    ![](img/71a62d31bf56be9d093eacfaee93dd09_16.png)


    # 计算


    ## 量子不确定性


    许多公司正声称拥有最强大的量子计算机


    量子计算公司 IonQ 称其新机器比任何竞争对手都强大。这台机器拥有 32 个比特。与只能存储 0 或 1 的普通比特不同，量子比特是两者的结合，能够处理更多信息。帝国学院的
    Peter Knight 说：“这将是一个巨大的进步。”与其使用超导芯片，IonQ 使用激光操控量子比特。


    ![](img/71a62d31bf56be9d093eacfaee93dd09_17.png)


    IonQ 的机器在量子比特数量上并没有超过其他量子计算机。然而，该公司称其量子体积——一种考虑了量子比特数量、错误率和其他其他属性的指标——超过了竞争对手。


    “量子比特本身是完美的，优于我们的竞争对手。”它在数量上并没有超过任何人，但我们以这种方式减少了误差。“凭借这些额外的功率和量子比特数量，我们取得了巨大的成就。”IonQ
    的量子体积超过了一百万，相比之下，记录为 64。


    这使得 IonQ 更接近能够解决实际问题。但与 IonQ 的设备不同，超级计算机解决这类量子计算机进入的问题可能需要几周或几个月。“但作为量子计算机，它是非常有用的！”


    “如果你想从解决问题的困难程度来衡量量子计算机，那么拥有 32 个比特的量子计算机比 53 个比特的设备更强大。” 比较两者很困难，因为它们是不同类型的量子计算机，


    Monroe 表示他的设备处于实现量子霸权的边缘。经典


    # 量子比特


    计算公司 D-Wave 宣布了现存最大最强大的量子计算机。


    该设备拥有 5000 个量子比特，比目前任何量子计算机都多，但研究人员认为它是有局限性的。“我们还没有制造出单一量子计算机，它是一种可以轻松解决特定类型问题的定制硬件，”伦敦大学学院的
    Gillian-Gee 说。D-Wave 尚未发布结果证明其设备可以优于其他计算机，无论是量子还是经典。“在经典计算机无法解决的现实设定中，量子优势毫无意义，”Gillian-Gee
    说。


    D-Wave 的 John Marshall 说，公司的目标不是为了实现量子优势，而是为了给程序员提供比他们目前使用的工具更大的优势。


    对于许多此类问题，你可能会得到一个博士级别的计算机科学家团队，他们可能会想出一种经典算法来解决[优势系统]实际问题，但并不是所有问题都能拥有一支计算机科学家军队，”他说。


    2020 年 10 月 10 日 | 新科学 | 17


