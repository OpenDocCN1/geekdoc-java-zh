    ## 简要新闻


    ## 生物工程


    ## 制造出新型人工血管


    由金属和塑料制成的**电子**血管可用于替代心血管疾病中受损的动脉。


    中国深圳南方科技大学的刘星宇及其团队通过在柔性膜上打印一层含有镓和铋的液态金属墨水制造了这种血管。该小组通过将聚合物膜卷起，形成了一个宽度约 2 毫米的“血管”。该团队展示了电脉冲可以刺激内皮细胞（这些细胞像真实血管一样）在人工血管内部进行增殖。该小组表示，这些血管较不容易发生血栓泄漏。


    通过对血管施加电场，可以使其产生渗透性，从而向相邻细胞输送药物。该团队能够利用这一点将绿色荧光蛋白输送到人工血管周围的血细胞中。他们在活体系统中测试了这些血管，用于替换受损的大脑动脉并在六只大鼠身上进行了实验。在三个月里，它们在两个区域都存活良好，且没有引发炎症反应。研究人员还注意到，新血管的功能类似于天然颈动脉，没有撕裂的迹象（《Matter》，doi:
    2021）。


    ## 植物面临“灭绝”


    地球上约 40% 的植物面临灭绝风险，此前许多真菌也受到威胁。伦敦邱肯园皇家植物园的 Alexander Antoni 表示：“我们正处于一个‘灭绝时代’，”该机构每年发布一份关于世界植物状况的报告。


    ## Zoom 侵入是内部人员作案


    在线会议正受到内部人员而非黑客的干扰。波士顿大学的刘陈及其同事受请求参加 Zoom 会议，并发现 4cham 论坛上提出此类请求的人中，70% 的人有正当理由访问会议（arxiv.org/abs/2009.03822）。


    ## 大臀肌大锤夺金牌


    巨大的臀大肌（构成身体的肌肉）是实现记录的关键。这块肌肉的体积占了运动员冲刺差异的 44%（《Medicine & Science & Sports》，doi.org/f053）。


    ## 保护


    ![](img/71a62d31bf56be9d093eacfaee93dd09_22_0.png)


    ## 技术


    ## 蜜蜂状管子有助于提取肿瘤


    由寄生蜂设计的医疗设备可以使移除肿瘤和血块变得更容易且更不疼痛。


    寄生蜂通过一个名为产卵器的细长管状器官将卵注入活体宿主。该器官沿管部延伸的叶状瓣上下滑动以移动卵。


    目前，进行侵入性手术仍然具有风险且难以实现。如果没有管子，可能很难对更大更深处的肿瘤进行移除。


    这种新设备宽 7 毫米，长 8 厘米，带有六条独立移动的组织带。这允许运输各种类型的胶质或微型人类组织。它的效果良好，但比一根肌肉短（《生物工程与生物学前沿》，2021）。


    Christine L-Sastre


    ## GPS 编码诱饵帮助追踪蛋孵化


    假蛋可用于追踪从海滩被非法偷走的海龟的移动。


    肯塔基大学的 Helene Pheasey 及其团队使用 GPS 蛋（如图所示）追踪哥斯达黎加蛋的孵化情况。这种由 EggInvestor 和 3D 打印机制造的假蛋是由保护科学家
    Pacific Pacífico 开发的，用于打击盗蛋行为。


    这些假海龟蛋的大小和形状完全相同，包含 GPS、SIM 卡、充电端口和电池。团队在哥斯达黎加的四个海滩上部署了 10 只海龟的诱饵。在中洲部分地区，海龟蛋被当作食物食用。


    四分之一的蛋被拿走了，团队每小时追踪五个蛋的信号。他们使用了绿海龟和橄榄绿蛋。团队显示，这并没有影响真实蛋的孵化成功率。它们移动到了更远的区域，并回到了距离
    1.7 公里的超市停车场和住宅区（《Current Biology》，doi: 10.1016/j.cb.2020.06.065）。


    ## 信号增强


    欢迎来到我们的信号增强项目——这是一个供慈善机构向全球受众传播信息的周报，完全免费。

    今天，是来自职业医学协会的消息。


    ![](img/71a62d31bf56be9d093eacfaee93dd09_23_0.png)

    ![](img/71a62d31bf56be9d093eacfaee93dd09_23_1.png)


    职业医学协会 (SOM) 成立于 1935 年，是一家支持职业和职场健康的专业慈善机构。它告知政策制定者、雇主和员工基于证据的方法改进现有政策。在这次新冠肺炎危机期间，个人防护装备（PPE）以及普及职业健康服务的需求等问题得到了重点关注。最近的报告包括关于新冠病毒空气传播的研究综合，并支持潜在作者。


    最近，SOM 召集了多学科专家小组，与工业与社区特许学院等组织合作，为返回工作的人员制作基于证据的工具。与合作伙伴正在开发一种“新冠时代”工具，以评估个人对新冠的整体脆弱性。SOM
    在大学和研究机构聘研究人员以加强对关键职场问题的理解。SOM 是一个小型慈善机构，需要支持以：

    - 资助促进、保护和改善工作健康的研究。

    - 增加其向政府就关键问题（如保护健身房工作人员）提供基于证据指导的能力。

    - 汇集多学科专业知识，识别并解决职场中出现的新问题。


    ## 想要帮助？


    访问 som.org 了解更多信息。捐赠请拨打 0203 9134 或发送邮件至@som.org。我们为英国纳税人申请赠款援助（gift aid）。


    ## 观点


    - 专栏作家 Weinstein 见于 threads p24

    - 景观点：从国际空间站看地球 p26

    - 读者来：如果金星上确实存在生命，我们必须非常小心 p28

    - 文化：史蒂芬·霍金在一位朋友的回忆中被怀念 p30

    - 文化：专栏作家 Jacob Aron 表示，《荒野》（Wasteland）充满了艰难的选择 p32


    ## 评论


    ## 虚假新闻的失败


    Donna Lu 认为，Facebook 长期承诺解决其平台上的虚假信息，但到目前为止的尝试一直很不理想。


    ![](img/71a62d31bf56be9d093eacfaee93dd09_24_0.png)


    > 距离美国大选不到一个月了，Facebook 的虚假信息和……的问题同样严重。尽管社交媒体做出了处理仇恨言和虚假内容的承诺。


