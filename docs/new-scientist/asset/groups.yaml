    # If life exists on Venus, we must be very careful


    19 September, p 7

    From Yann Gourmourt and Anjeena Baopot, London, UK

    As microbiologists, the possible life on Venus remains tantalizing. After all,
    some microbial life could be on the verge of an interplanetary discipline.


    The existence of Venusian microbes would be worth considering in the next step
    of this scientific endeavour, the discovery of Venusian methane provides evidence
    for microbial life.

    But we must remain cautious and without regulatory frameworks that could prevent
    impulsive use of space capabilities by competing nations. High-risk extraterrestrial
    must be protected from nearby communities and highly secured. Every government
    agrees the accord to international standards.


    If examples of life are found, it would be uncommon to see even more: our analysis
    is done in labs on Earth, whether on purpose-built space stations or in Lunar
