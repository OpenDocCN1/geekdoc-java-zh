    ## 特性


    ## 新冠肺炎的 AI 革命


    自动化正在接管工作，而新冠肺炎疫情极大地加速了这一趋势。Sandy Ong 问，我们是否应该担心？


    在楼上，一个封闭商店的半密度区域内，东西在动着，生命的光芒沐浴着橱窗。Salem 在安保人员面前前停下脚步。UV Bot 拥有 1000 瓦的 UVC 光，能够“撕裂病毒
    DNA 链”，无处不在，新加坡的其他一些商场和医院也是如此。它正在帮助人类工人完成在新冠疫情前他们的工作：


    类似的场景正在世界各地发生。首尔的医院里，Moxi 递送药物、取样样本。P Guard 在土耳其街道上执行封锁。James 远程呈现技术帮助比利时居家护理的居民保持联系。另一种
    Uber 超市送货服务在缺席的人们面前，甚至填补了工作缺口。与此同时，非具身人工智能正在协助从接触和追踪患者基因组代码，到物流以及日益竞争激烈的在线市场客户履行的一切。


    这种向自动化和机器人化的趋势正在发生——但新冠肺炎极大地加速了它。“这场疫情让人们极度地意识到社交距离的风险，”南卡罗来纳州克莱姆姆森大学的 Richard
    Pak 说道，“在这些时期，机器人和自动化无疑提供了安全保障。”


    这也是一个巨大的问题。随着新冠病毒席卷全球经济，失业率飙升。如果我们从新冠肺炎导致的衰退中恢复过来，发现工作已经永久消失——而且没有计划让他们保持就业，那会变成什么？


    机器人技术和人工智能的兴起也被称为“第四次工业革命”的一部分，紧随过去三个世纪中由煤炭和蒸汽、电力以及数字计算驱动的三个阶段性变化之后（见）。许多人对自动驾驶汽车、虚拟助手和其他节省劳动创新的前景表示赞赏。对于能够为我们提供定制化信息、在
    Netflix 上推荐好东西，或者通过手机触碰支付杂货费的技术，人们很难反驳。在新冠肺炎疫情期间，这些技术通过让人们居家办公，帮助减少了公共健康风险，在保持生存的同时了生产力。


    然而，在疫情之前，许多人担心自动化趋势可能导致长期的失业。麦肯锡咨询公司在2017 年的一份报告中建议，到2030 年，自动化在全球可能取代多达 8 亿份工作。2013
    年，牛津大学的 Carl Frey 和 Michael Osborne 著名地使用机器学习算法评估工作自动化的容易程度。研究得出结论，在未来二十年里，机器将能够完成所有工作的
    47%——Frey 表示，这个数字在今天仍然保持一致。“在英国，估计数字为 35%。”


    ![](img/71a62d31bf56be9d093eacfaee93dd09_45_0.png)


    > “如果我们从新冠肺炎导致的衰退中恢复过来，发现工作已经永久消失——而且没有 B 计划来让我们保持有偿的工作，会发生什么？”


    ![](img/71a62d31bf56be9d093eacfaee93dd09_46_0.png)


    ## 四次工业革命


    人工智能和先进机器人的出现是一系列变化的一部分，其中一些被认为是第四次工业革命，类似于已经经历的三次革命。


    ## 变得严肃


    面对封锁状态下的员工以及工作场所对社交距离措施的需求，许多公司正在为这些趋势推波助澜，要么通过首次寻求更大的自动化，要么通过加速扩展现有计划。


    “现在自动化的空间非常大，”旧金山一家为仓库机器人开发 AI 系统的 Oosar 公司首席执行官 Derek Prideo 说道，“如果公司以前在考虑这件事，他们现在正在采取行动。他们实际上在部署它。每个人在对自动化的严肃性上都迈进了一个阶段。”“3
    月，审计师安华永的一项调查显示，在 44 个国家中，90% 的受访者中超过四之三的人采取了措施，以确认或重新评估他们的自动化速度。”


    概念店，如新亚马逊、沃尔玛以及其他大型零售商正在部署机器人在拣货中心包装和搬运货物；YouTube 和 Twitter 正在更多机器进行内容分发。聊天机器人也表现良好，Meta
    处理了其 66% 的基于消息的客户查询。IBM 报告说，从 2 月到 4 月，其 Watson Assistant 软件的需求增长了 4%，美国零售商梅西和汽车制造商雪佛等公司使用其处理在线电话。


    ## 第一次工业革命：煤炭与电力


    - 大约从 1760 年开始

    - 以蒸汽机和第一批工厂为特征

    - 关键发明包括蒸汽轮和铁路，机械化广泛普及

    - 将社会从农业社会转变为工业社会


    ## 第二次工业革命：石油与电力


    - 1860 年代起

    - 以大规模生产和装配线为特征，以及新的行业，如炼油、电力和钢铁

    - 关键发明包括灯泡、电话、收音机、汽车和飞机

    - 农村向城市的人口增加


    ## 第三次工业革命：计算


    - 1960 年代起

    - 以电子化、自动化、数字化为特征（此处原文缺失）

    - 关键发明包括半导体、计算机、互联网、电子商务

    - 从物理（向数字）的转变（此处原文不完整）


    ## 第四次工业革命：连接


    - 以人工智能、机器人、大数据、智能技术等为特征

    - 关键发明包括 DNA 测序、区块链、虚拟现实、3D 打印

    - 继续从物理向在线的转变


    Pridmore 表示，他的公司“自疫情袭来以来，兴趣大幅增加。”他的客户包括一家连锁超市，发现当人们开始在家做饭时需求翻了一倍。”UiPath 董事总经理
    Chris Hodges 表示，“疫情是这种加速器。”


    封锁期间焦虑日益增加。根据乔治大学 AI 治理中心最近的一项调查，在 15 个国家中，11% 的人认为政府应该限制自动化以保护工作。在 1 月，三个月后，这个数字上升到了
    55%。这种情绪普遍存在。“如果你观察，你会发现自动化在衰退时期是有用的，当你在衰退中失去工作时，你会陷入挣扎。”


    也许最著名的例子（Frey 在 2019 年的书《技术陷阱》中提到的）是卢德分子，他们捣毁织布机和其他第一次革命的产物。这种动荡在 1815 年之后尤为严重，当时欧洲陷入萧条，由于对进口粮食征收关税，食品价格飙升。今天，技术引发的变革对工人和工厂构成了巨大威胁，许多人发现自己失业了。对于那些涉及特定形式数据分析工作的分析师和研究人员来说，许多工作可能被
    AI 代替。“这是历史上第一次蓝领和白领工作同时受到影响，”佐治亚州理工学院的 Ayanna Howard 说道，“无论谁受到影响，这种趋势往往是单行道。“当自动化出现时，所谓的‘说’，”Levin
    说道，“在经济学中，一旦你投入了前期资金，无论是硬资金还是软资金，人们就会从舒适变得渴望。”


    这并非孤立现象，”Frey 说。“唯一的问题是，自动化并非不可避免的。如果你回顾过去的二十年，毫无疑问人们生活得更好，在很大程度上是因为自动化，”他说道——它带来了更高的生产力、更低的成本、更强的扩展性、更安全的环境以及更灵活的工作和机会，这仅举几例。”


