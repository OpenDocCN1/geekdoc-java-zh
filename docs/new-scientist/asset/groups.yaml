    We are working on new ways to deliver CRISPR. We have developed proteins from
    bacteria, which are much smaller than the first CRISPR system we reported. The
    report makes the package easier, it is better to get it inside cells where it
    can do its work. We have already shown that this system can edit genes much more
    efficiently.


    ## Are there conditions that you are particularly interested in?


    I had an interest in mental health and psychiatric conditions since I was a college
    student. People have been affected by illnesses. CRISPR is already used to understand
    how they affect the brain and how we might develop more effective treatments.


    But all diseases are different in one way. Biologically, also emotionally. In
    terms of negatively affecting their lives, it is the same - it is a toll on people''s
    quality of life. This is why I have focused on developing the technology for gene
    editing as something broadly applicable.


    ## When you are in a position to decide who owns the rights to the technology,
    as it is being developed?


    It is important that this technology is developed safely and responsibly, and
