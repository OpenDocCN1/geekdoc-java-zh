    # Work redefined


    Economist James Bacon at Boston University in Massachusetts agrees that. What
    we are likely to see is fewer jobs overall, but different ones. "There''s no evidence
    that AI will displace humans, but it will create new jobs," says Chalmers. "Anyway,
    we are already seeing an increase in demand for the likes of drones operators,
    digital marketing specialists, video support and virtual event organisers. In
    the future, we are going to need robot mechanics and customer service workers
    so people ''they can''t have a robot around anymore''.


    "That will require new jobs. Jobs will be redefined," says Hardy. Many experts
    suggest a surefire way to cushion the economic effects of automation in the post
    era: invest in education, and specifically re-education. "At the heart


    of ensuring that anyone can engage with upskilling and reskilling in bite-sized
    chunks," says Jesuthasan, "as opposed to this fixation on a three or four year
    degree where you''re to be relevant for 30 years after. I think the world has
    moved very rapidly from that technology model."


    This needs workers to adopt modern learning, but governments and firms must step
    in and help too by offering subsidized adult courses, retraining programs and
    other types of transitions. This will help make the necessary transitions, especially
    post-19 recovery. "Otherwise, left to market forces, we will have to find and
    lose lots of people left behind," says Jesuthasan


    There are other challenges we will have to face as the trend towards automation.
    One major issue is that AI has a tendency to inherit and amplify biases that exists
    in the data we train it - for example, minority inequality or color-blind discrimination.
    How to draw frames around the responsible use of machines with ever-increasing
    automation, and the possibility of a global divide between those who can afford
    technology and those who cannot


    Finding solutions requires having the headspace to think these things, and that
    is difficult in the middle of a global pandemic. "We are a very reactive society,"
    says Hardy. "It''s hard to say what comes next and right we''re not in state of
    charity to be able to pace."


    Get things right, though, and we can embrace the opportunities brought by new
    tech, rather than being harmed by it. As the threat of covid-19 persists, like
    the virus-killer UV robot may be redefining jobs, but they are also making it
    safe for us with others .


