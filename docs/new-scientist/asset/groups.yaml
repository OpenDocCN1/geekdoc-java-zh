    Roger Miles

    英国赫特福郡圣阿尔


    之前关于盖子紧固的讨论未能描述在金属盖和瓶口之间制造空气密封所需的相互作用。要做到，它们之间需要一种软材料。这是通过螺纹周围的塑料层实现的。然而，使密封有效的质量是玻璃与玻璃之间的摩擦很大。如果玻璃起了作用，盖子将很难取出。


    一个要求已由玻璃行业解决，采用了一种新类型的盖子。这是通过使用一个边缘密封的圆片和一个与玻璃有螺纹的边缘来实现的，使得圆片抵在边缘上，但可以自由旋转。


    关键是，两个盖子组件之间的密封少于玻璃和瓶之间的密封。这种更复杂的盖子结构并没有产生更多维生素D，维生素D会刺激信号多巴胺的产生并影响眼睛的发展。


