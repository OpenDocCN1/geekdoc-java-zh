    # 我的朋友，史蒂芬·霍金


    固执、幽默，在脆弱的外表下是一个钢铁之躯。这是同为物理学家莱纳德·莫洛迪诺夫（Leonard Mlodinow）记忆中的史蒂芬·霍金，他发现 Ge Li


    ![](img/71a62d31bf56be9d093eacfaee93dd09_31_0.png)


    书籍

    《史蒂芬·霍金：关于友谊与物理的回忆》

    莱纳德·莫洛迪诺夫

    Allen Lane


    当物理学家史蒂芬·霍金于 2018 年以 76 岁去世时，世界陷入了哀悼。在他去世后，这位科学家和人类留下了巨大的遗产供人们深思。


    还有一份遗产：因在宇宙学和黑洞领域数十年的工作而闻名，《广义简史》自 1988 年出版以来已销量超过 2500 万册，霍金重塑了我们对现代物理中一些最困难领域的理解。


    在他的成就中，他在物理学领域的许多新发现，而“黑洞是死胡同”的想法让他声名大噪。他最终被广泛认为是那个时代最伟大的大脑，甚至深。


    尽管身体衰落，但关于霍金仍有许多讨论空间。在《史蒂芬·霍金：关于友谊与物理的回忆》中，莱纳德·莫洛迪诺夫对这位科学家的生活提供了亲密的观察，范围从他在大学的早期到他与肌萎侧索硬化症（ALS）的斗争——这种疾病逐渐瘫痪了他的运动神经元——直到他成为一名……的。


    在与霍金相处的二十年后，莫洛迪诺夫并不缺少故事，特别是在他们合作撰写书籍《大设计》期间的故事。霍金的生活往往充满悲剧，死亡的可能从未远离过。他没有让这成为挫折，而是转向了他的成就。


