    ## The balancing act


    We are becoming less steady on our feet, and not just in old age. That is bad
    news for our health, but there is plenty we can do about it, finds Caroline Williams


    ![](img/71a62d31bf56be9d093eacfaee93dd09_36_0.png)


    The human body, standing upright, is inherently unstable as many scientists say.
    Our bodies are heavy, with a thin base of support relative to our height. Center
    of gravity pulls us at pelvis height and forward of ankles. Without a healthy
    system, we manage it by using a brain-body network which integrates information
    from our muscles, the eyes and the inner ear. Each step engages the muscles of
    the legs and core make necessary adjustments to


    10 October 2020 | New Scientist | 3


    ## The link to mental health


    Anxiety, depression, schizophrenia and other mental health disorders have been
    shown to affect balance in a way that influences posture and gait.


    Ron Feldman at Tel Aviv University says there are many reasons why people with
    stooped posture have significantly slower movements. This increases the risk that,
    if unstable, movements will happen too slowly. For people with schizophrenia,
    symptoms of mental distress are often accompanied by a swaying posture, which
    has been linked to problems with integrating visual information with components
    of balance.


    With this understanding, new methods of diagnosis or treatment are so far


    > "The physical elements are rarely addressed in mental disorders," says Feldman.
    That might be a missed opportunity, because the relationship between physical
    and mental health goes both ways; to improve your balance could benefit your mental
    health.


    While the core muscles get the credit for keeping balance, it is the leg muscles
    that do most of the work. "If we turned off all our muscles in legs when we were
    standing, we would fail," says Srinivasan. Integrating changing information from
    the muscles, joints, senses, and the environment is a massive computational challenge,
    and neuroscientists dont fully understand how the brain completes it. They have
    identified a few players, however the most important is the cerebellum, the small
    region at the bottom of the brain that contains more neurons than all other areas
    combined. Evolutionary studies show that ancestors began walking on two feet with
    size as ours today (see "Our feet," page 37)


    Our ability to balance—one of humanity''s hardest skills—is beginning to fade.


    It is thought that our ability to rapidly adapt to different situations is thanks
    to the brain making predictions before we experience. Neuroscientists have shown
    that these predictions are made in the cerebellum. The area is also linked with
    other regions including the motor cortex, which directs movement, in loops. The
    cerebellum as a kind of filter that supports all operations, says neuroscientist
    Jessica at Texas A&M University.


    "You stand back to process it more and it brings information and helps you refine
    your behavior,"


    ## Having a wobble


    We have long known that the cerebellum plays a part in movement control. Recently,
    research has shown that it has a role in finuning our thoughts and emotions too.
    This could explain why mental health conditions affect balance ("The link to mental
    health," left). It could also explain studies in people who are asked to cognitively
    demanding tasks dont balance as well as the time allows, and those trying to balance
    while in cognitive tasks. It turns out it might be quite apt when people invoke
    the "wobble".


    Around the world, falls that lead to serious injury or death are on the rise,
    even in the young. Globally, falls are the second cause of death after traffic
    accidents. Between 1950 and 2017, the total number of baby boomers entering their
    twilight years doubled.


    ## Our ability to balance is built through trial and error starting with our first
    steps


    Walking seems effortless to most people, so Srinivasan was surprised by what happened
    when he looked bit closer. He and his colleague at Ohio State University attached
    markers to the ankles, heels, and toes of volunteers to track their movements
    while walking freely. Even, on a flat surface, a basically refined version of
    a drunken stumble or a stagger under an unexpected nudge. "Imagine if you were
    walking and you had to stick your right leg afterwards and fall over left," says
    Srinivasan.


    It turns out that, even on the smoothest surface, it is a process of re-orienting
    our upper limbs like from side to side. Usually we don''t look at it if we''re
