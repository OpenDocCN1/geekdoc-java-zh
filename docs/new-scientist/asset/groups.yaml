    # 专栏


    ## 时空现场笔记


    ## 化为灰烬：加州野火正担忧地逼近，几乎要烧毁一座珍贵的天文台。遗憾的是，火灾并非天文学面临的唯一威胁。作者：钱达·普雷科德-魏因斯坦


    ![](img/71a62d31bf56be9d093eacfaee93dd09_25_0.png)


    钱达·普雷科德-魏因斯坦（Chanda Prescod-Weinstein）是新罕什尔大学物理与天文学教授，女性研究系教师。她的理论物理研究专注于宇宙学、中子星以及基于标准模型的行星。


    十年前，我读了丹尼斯·奥弗比（Dennis Overby）写的宇宙学史《宇宙中的孤独星球》（*Lonely Hearts of the Cosmos*）。我被那些死去的者的野心冲突的故事所吸引，以及对我们所谓的哈勃-勒梅特常数的任何测量所着迷，该常数衡量的是时空的膨胀速率。


    乔治·勒梅特（Georges Lemaître）将其与1927年的天文观测联系起来，而在1929年，埃德温·哈勃（Edwin Hubble）通过实质性数据支持了这一观点。为了实现这一点，哈勃使用了位于威尔逊山天文台的胡克望远镜，这在当时是顶尖的设备。威尔逊山位于加州的圣加布里埃尔山脉，我正在那里长大，靠近洛杉矶。


    几周后，我读到了天文台主席萨姆·海尔（Sam Hale）的笔记，提到一场火灾正逼近哈勃曾“拯救宇宙”的那个设施。如果这座天文台在第二天依然存在，那么鲍勃火灾（Bob
    Fire）本将拯救了洛杉矶国家森林，以及许多洛杉矶的电视和无线电通信塔。


    在接下来的两周里，我反复思考这件事——深夜关于临近火灾的新闻会传来，随后将是对素材的紧急寻找。当火焰在天文台附近闪烁时，我将火看作宇宙中的一种自然现象。火是热的，有时也是物质的自然状态。我们的太阳是一个由核爆炸产生的巨大气体和等离子体球。我们的太阳耀斑宏伟而美丽，与那些肆虐加州的火灾大不相同。


    在写作此时，天文台已经躲过了火灾，火场现在还有60%的距离。火势曾距离其建筑仅6米。在这场风剧的后期，《洛杉矶时报》报道说，由于钱达的新型天文学研究引发了危险火灾，该天文台可能很快就会烧毁。今年，人们意识到，没有什么能阻止SpaceX和亚马逊用他们的新卫星填满低地球轨道，这永远地改变了我们清晰观察宇宙真面目的能力。我所在的暗物质工作组成员的鲁宾天文台（C.
    Rubin Observatory），现在其未来所有的天体图像都可能被数千颗卫星破坏，这使得我们的分析变得更加。


    > “今年，人们意识到没有什么能阻止亚马逊和 SpaceX 用卫星填满低地球轨道”


    气候变化并非唯一威胁正常气候的人类因素。我的同事告诉我，洛杉矶的空气在未来几个月内不会清晰，我们需要等待才能看到清晰的夜空。


    昨晚，我想到了火灾在多大程度上将成为天文学的长期灾难。美国西部已被火灾或烟雾覆盖了数月。气候变化灾难影响了如此多人，而在2020年，它在历史上并非全球最大的山火。它仍然是科学家们最近喜爱的热门目的地，天文学学生仍然可以很好地利用这样的仪器……


    ## 钱达的一周


    ### 我在读

    我开始读了杰弗里·C·怀亚特（Jeffrey C. Wyatt）的《1944：阿尔法的生活》（*1944: The Life of Alpha*），这将是一场长年的跋涉。


    ### 我在看

    我和朋友最近完成了对该设施的编辑，他们非常喜欢。


    ### 我在做

    我正在学习将成为我书籍终稿的编辑课程！


    本专栏每月出版。下周预：

    格拉姆·劳森（Graham Lawson）


