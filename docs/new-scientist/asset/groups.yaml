    \n![](img/71a62d31bf56be9d093eacfaee93dd09_25_0.png)\n\nChanda Prescod-Weinstein\
    \ is an assistant professor of physics and astronomy, and a faculty member in\
    \ women's studies at the University of New Hampshire. Her theoretical physics\
    \ focuses on cosmology, neutron stars, and planets by the standard model.\n\n\
    A decade ago I read Dennis Overby's history of cosmology, *Lonely Hearts of the\
    \ Cosmos*. I was fascinated by the stories of dead men clashing ambitions, any\
    \ measurements of what we call the Hubble-Leemaître constant, which measures the\
    \ rate of expansion of spacetime.\n\nGeorges Lemaître connected this with astronomical\
    \ observations made in 1927, and in 1929 Edwin Hubble built with substantive data\
    \ to support it. To achieve this, Hubble used the Hooker telescope at Mount Wilson\
    \ Observatory, which was state-of-the-art in his time. Mount Wilson is in California's\
    \ San Gabriel mountains, where I grew up, down Los Angeles.\n\nA few weeks later,\
    \ I was reading notes from the observatory's chairman Sam Hale about a fire that\
    \ was approaching the facility where Hubble had saved the universe. If the observatory\
    \ would still exist the next day, then the Bob Fire would have saved the Angeles\
    \ National Forest, and the many LA TV and radio communications towers had served.\n\
    \nFor the next two weeks, I thought through that repeatedly — late-night news\
    \ about an approaching fire would come and an urgent search for footage would\
