    # 不同的观点

    眼睛里到底发生了什么，导致有些人近视而有些人远视？


    Joe Oldaker

    Nuneaton, Warwickshire


    近视（myopia）和远视（hyperopia）通常由于眼睛长度、眼睛前面的透明层角膜以及晶状体的组合功率之间的不。


    进入眼睛的光线被角膜折射并汇聚在一个焦点上，这本应该在视网膜上形成清晰的图像。近视时光线过度汇聚，远视时光线汇聚不足。


    在红光下生长的小睫毛更长。矫正角膜手术很有用，主要针对近视。另一个因素是眼睛晶状体具有弹性，通过肌肉控制改变形状。观察近物（如杂志上的文字）会导致人近视。晶状体不够灵活，因此看清近物需要阅读镜。近视者有额外的调节能力，可以不需要阅读镜。我们大多数人都需要。


    ![](img/71a62d31bf56be9d093eacfaee93dd09_55_0.png)


    # 本周的新问题


    对的，为什么有些人难以区分左右？

    Peter Jackson, 加利福尼亚州戴维


    涕涕的丹尼斯：吸鼻子还是吹鼻子来清除非感染分泌物更好？

    Mike Fellows

    西米德兰郡萨顿菲尔


    生活方式而非遗传解释了近视率的增加。


    这个案例源于1975年的一项名为《近视流行》的研究，该研究比较了年轻人和老年人的视力。发现30岁以下男性中有30%近视，而他们的父母约为4%。年轻人在学校花费了更多时间。


    随后的许多研究表明，在户外活动不容易近视，这可能是光诱导近视。在户外接触更多蓝光的儿童可能会降低近视风险。或者，我们可以让室内光在白天。


