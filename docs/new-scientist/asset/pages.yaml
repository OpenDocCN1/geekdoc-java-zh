    # Analysis


    # Can vitamin D protection against the coronavirus?


    CLAIMS that vitamin D can protect against the effects of coronavirus, but so far
    evidence doesn''t hold up. Vitamin D is produced in the skin through the action
    of sunlight, and is also found in foods such as fish. It builds bones and plays
    a role in the immune system, helping to fight infected cells. In the UK, it''s
    Advisory Committee on Nutrition


    (SACN) concluded that there is not enough evidence to support the idea that vitamin
    D can help prevent coronavirus complications. What about covid-19? Several researchers
    have said that vitamin D has potential to prevent people from being infected,
    or to reduce it. Stronger evidence has started to accrue, however most is in the
    form of observational studies, which may be misleading because they don''t prove
    that vitamin D causes infections, just that it correlates with them. For instance,
    one study found that


    admitted with covid-19 had half the risk of death if they had adequate vitamin
    D levels. The benefits of vitamin D would be tested by giving it to people with
    covid-19 to see if they help their symptoms. One study from Spain found that people
    with high doses of vitamin D were less likely to need intensive


    care than those who did not get. However, the study involved just 7 people. The
    only trial showed that vitamin D helped hospital patients, not that it works as
    a prevention. It is promising, but a larger study is needed, says Susan Latham,
    who is a member of SACN.


    All evidence shows that most people in temperate climates like the UK become vitamin
    D deficient over winter. As such, if only to support strong bones, they would
    need a vitamin D supplement every day, October until March. Claire Wilson


