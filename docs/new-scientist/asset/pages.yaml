    control, change shape to add power. Looking at things that are near, such as words
    in a magazine, can make someone short-sighted. Lenses are less flexible and thus,
    reading glasses are needed to see close objects sharply. People with myopia have
    extra accommodation and can do without reading the glasses most of us need with.


