    # My friend, Stephen Hawking


    Stubborn, funny and a man of iron behind a frail facade. This is the Stephen Hawking
    remembered by fellow physicist Leonard Mlodinow, who finds Ge Li


    ![](img/71a62d31bf56be9d093eacfaee93dd09_31_0.png)


    Book

    Stephen Hawking: A memoir of friendship and physics

    Leonard Mlodinow

    Allen Lane


    WHEN physicist Stephen Hawking died in 2018 at the age of 76, the world mourned.
    After the loss, there remains the enormous legacy of the scientist and the man
    to consider.

    And a legacy: Renowned for decades of work on cosmology and black holes, with
    a Brief Time History telling over 25 million copies since its release in 1988,
    Hawking reshaped our understanding of some of the trickest areas in modern physics.

    Among his achievements the discovery of so much new in physics, Hawking the dead-end
    idea that black holes made him famous. He ended up widely considered the greatest
    mind of his time and was even deeper.

    Despite the decline, there is still much to discuss about Hawking. In Stephen
