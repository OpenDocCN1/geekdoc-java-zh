    remained elusive. Now, the organ that houses magnetic sensors in mole rats has
    been identified.


    Many rodents build nests in particular orientations. The researchers placed the
    Anssel''s in magnetic fields that could be used to artificially change the direction
    of magnetic north. They found that the animals with eyes aligned their nests in
    south-eastern areas.


    Kai Casper at the University of Duisburg-Germany and his colleagues have found
    that the Anssel''s rat (Fukom orrelli) uses eyes for magnetoreception.


    Previous research has suggested the eyes of this mole rat, which is nearly blind,
    may contain magnetoreceptors. In fact, they are also linked to magnetic sensing.


    To confirm this, the team studied 40 Ansel''s rats, 22 of which had eyes removed.
    Without eyes they didn''t change their foraging or socialising behaviour. However,
    there was a change in the orientation of their nests.


    Without eyes they built in random orientations, suggesting that their magnetism
    has been disrupted by the social interface, doi.org/fb35j.


    This is the first time that a special organ magnetoreceptor has been identified
    in mammals. While not identified, the researchers found they can maintain magnetism,
    a magnetic orange . Donna Donut


