    # EPS-SG PROGRAMME SCIENTIST


    EUMETSAT is Europe’s meteorological satellite agency. Its role is to establish
    and operate meteorological satellites that monitor the weather and climate from
    space, helping protect lives, property and industries. The satellites of the EUMETSAT
    Sat Polar System (EPS) and its successor the EPS Second Generation (EPS-SG) programmes
    use data to compute forecasts up to 10 days in advance.


    The EPS Programme Scientist provides high-level guidance, scientific leadership
    and coordination of the science support to the operations of the EPS and to the
    development, coordination and operations of EPS-SG systems. This includes management
    support to the EPS-SG development programme, coordination and maintenance of key
    programme-level user and science documentation, supervision of all scientific
    activities necessary for EPS-SG system commissioning and the instigation of relevant
    scientific studies.


    Applications are invited from scientific leaders with an in-depth knowledge and
    proven experience of meteorological applications in satellite/remote sensing data
