    What exactly occurs in the eyes to make some people short-sighted and others long-sighted?


    Joe Oldaker

    Nuneaton, Warwickshire, UK

    Short-sightedness (myopia) and long-sightedness (hyperopia) are usually due to
    a mismatch between the length of the eye, from front to back, and the combined
    power of the cornea - the transparent surface layer at the front of the eye and
    the eye''s crystalline lens to converge rays of incoming light.


    Light rays entering the eye are bent by the cornea and converge at a focal point,
    which should be on the retina of the eye to make a sharp image. In myopia rays
    focus before the retina and is blurred. Near objects focus before the retina,
    with a normal sight.


