  md: '![](img/71a62d31bf56be9d093eacfaee93dd09_42_0.png)


    It is no exaggeration to call Feng Zhang one of the most groundbreaking scientists
    working today. In his 20s and 30s, he helped develop two revolutionary technologies.
    The first, known optogenetics, inserts genes into brain cells to allow them to
    be switched on and off by shining a light on them. This technique is being explored
    as a potential treatment for some neurological disorders.


    The second, CRISPR, is a gene-editing technology that allows scientists to correct
    near-limit lists of human diseases. These days, Zhang has a dual appointment at
    the McGover Institute for Brain Research and the Broad Institute in Massachusetts,
    and he has been spoken of a future Nobel laureate.


    Powerful tools can be used to benefit humanity, however, when it comes to CRISPR,
    there have been some worrying developments. Two years ago, biophysicist He Jiankui
    widely criticized and eventually handed a prison sentence


    for CRISPR to edit human embryos. Many researchers, including Zhang, feel his
    actions were an ethical oversight.


    Meanwhile, Zhang faces an ongoing dispute over who should own the patent for CRISPR.
    Other scientists were first to publish details of the technology, but he was quickest
    to show it works in human cells.


    New Scientist caught up with Zhang to discuss the low-down on the future of CRISPR.
    These days, Zhang is optimistic that the technology may help us in the fight against
    covid-19 and that it may have applications


    A harmless virus carrying the CRISPR tools is injected into the eye, where it
