    # Donald Trump

    The week being treated shocked the US


    After being treated for covid-19 in hospital, US president Trump has been criticised
    for downplaying the diagnosis of coronavirus, reports **Adam Vaughan**


    HEALTH experts criticised US president Trump for this telling people not to "be
    afraid" of coronavirus, and for removing his mask on during a campaign trail at
    the White House after he was treated for covid-19 in hospital.

    His return to Mar-a-Lago raised questions about whether he would break covid-isolating
    for 14 days. "Will be back on the trail," Trump wrote on Twitter without wanting
    to trace his cases, with at least seven other cases being linked to the administration.

    Anthony Fauci, the US'' leading infectious disease expert, appeared to contradict
    Trump''s advice. "Otherwise, the message


    should be that we should try as best as we can avoid infection. No matter who
    you are, or what your underlying condition is trivialite," he told *The New Yorker*.

    Other scientists pointed out the risk that Trump''s flouting could pay off. "Epidemiologists
    just wanna vomit," said Eric Felg-Dyer Scientists, at the Federation of American
    Medicine, as he posted a video of Trump refusing to talk.

    The exact time of Trump''s illness and when health has been fuzzy. While the president
    publicly


    revealed his diagnosis on Twitter just before midnight on 1 October, doctors said
    he had tested unproven on 30 September, which has since been retracted. It is
    however that he may have travelled to events, raising fears that he may have caused
    an experiment described as a "superpreader."

    Trump said he is feeling good, his condition three days described by his chief
    of staff Meadows as "very concerning."

    The president''s treatments


    included the steroid dexamethasone, which has been shown to help patients recover.
    He was also given the drug remdesivir, the effectiveness of which is still unproven,
    although trials have shown promise. Doctors administered an experimental antibody
    currently being developed by Regeneron, as well as vitamin and D.

    The shock caused by Trump brought a backlog of covid-19 cases again rising in
    the US. As New Scientist went to press, there were 7.5 million cases in the country,
    with more than 40,000 cases being reported daily on a seven average.


    > **Daily coronavirus news-round**

    **Online weekly at 6pm BST** newsscientist.com/coronavirus-latest


    10 October 2020 | Scientist | *'
