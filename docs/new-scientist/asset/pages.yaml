    # Animal behaviour


    Solar system


    # Potential sign of Venus life supported by old NASA data


    # First cockroach species seen to have both workers and a queen


    Leah Crane


    Michael Marshall


    WE HAVE another hint that there is really phosphine—a gas that may be of life—in
    the clouds of Venus, and it comes from old data collected by a spacecraft that
    visited the planet in 1998.


    COCKROACHES team up. A South American species is the first cockroach known to
    live in groups with workers and a queen, like honeybees or leafcutter ants.


