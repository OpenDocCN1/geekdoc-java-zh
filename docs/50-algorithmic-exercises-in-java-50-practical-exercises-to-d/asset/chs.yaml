  \               }\n            }\n        }\n        return topologicalOrder;\n\
  \    }\n}\n```\n\n在这个示例中，我们用邻接表表示了一个有向图，并根据节点的入度算法执行了拓扑排序。结果以拓扑排序的形式输出。你可以通过修改边来自定义图，观察拓扑排序结果的变化。\n\
  \n### 语句：Java 中的图深度遍历 (DFS)\n\n编写一个 Java 程序，对一个用邻接表表示的无向图进行深度遍历（DFS）。深度遍历是一种通过尽可能深入探索边直到回溯来遍历图中所有节点的技术。\n\
