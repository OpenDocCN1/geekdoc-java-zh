  \     System.out.println(\"The median of the table is: \" + median);\n    }\n\n\
  \    public static int findMedian(int[] array) {\n        // 排序数组\n        Arrays.sort(array);\n\
  \        int size = array.length;\n        if (size % 2 == 0) {\n            //\
  \ 如果数组元素为偶数个数，中位数是两个中间元素的平均值\n            int middleIndex1 = size / 2 - 1;\n   \
