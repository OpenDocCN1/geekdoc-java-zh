  \        }\n        // 添加图的边\n        addEdge(graph, 5, 2);\n        addEdge(graph,\
  \ 5, 0);\n        addEdge(graph, 4, 0);\n        addEdge(graph, 4, 1);\n       \
  \ addEdge(graph, 2, 3);\n        addEdge(graph, 3, 1);\n        // 执行拓扑排序并显示结果\n\
  \        ArrayList<Integer> topologicalOrder = topologicalSort(graph);\n       \
  \ System.out.println(\"拓扑排序: \" + topologicalOrder);\n    }\n\n    public static\
  \ void addEdge(ArrayList<ArrayList<Integer>> graph, int source, int destination)\
  \ {\n        graph.get(source).add(destination);\n    }\n\n    public static ArrayList<Integer>\
  \ topologicalSort(ArrayList<ArrayList<Integer>> graph) {\n        int numNodes =\
  \ graph.size();\n        int[] inDegree = new int[numNodes];\n        for (int i\
  \ = 0; i < numNodes; i++) {\n            ArrayList<Integer> neighbors = graph.get(i);\n\
  \            for (int neighbor : neighbors) {\n                inDegree[neighbor]++;\n\
  \            }\n        }\n        Queue<Integer> queue = new LinkedList<>();\n\
  \        for (int i = 0; i < numNodes; i++) {\n            if (inDegree[i] == 0)\
  \ {\n                queue.add(i);\n            }\n        }\n        ArrayList<Integer>\
  \ topologicalOrder = new ArrayList<>();\n        while (!queue.isEmpty()) {\n  \
  \          int node = queue.poll();\n            topologicalOrder.add(node);\n \
  \           ArrayList<Integer> neighbors = graph.get(node);\n            for (int\
  \ neighbor : neighbors) {\n                inDegree[neighbor]--;\n             \
