- "# 50 个 Java 算法练习：提升编程技能的 50 个实用练习\n\n\n\n![](img/image_rsrc4EG.jpg)\n\n# 50 道 JAVA\
  \ 算法练习题\n\n## 引言\n\n算法是计算机科学的核心。它是使用一系列逻辑指令来解决问题的艺术。无论你是想要掌握编程基础的初学者，还是想要提高问题解决能力的资深开发者，这本书都是为为你设计的。\n\
  \n## 题目：Java 中的冒泡排序\n\n编写一个 Java 程序，使用冒泡排序算法对整数数组进行排序。冒泡排序算法通过比较相邻的元素，如果它们的顺序错误则对其进行交换，并重复此过程，直到整个数组排序完毕。\n\
  \n你需要在 Java 中编写冒泡排序逻辑，并确保你的程序运行正确。你也可以添加注释来解释你的代码。\n\n### Java 解决方案示例：\n\n```java\n\
  import java.util.Scanner;\n\npublic class TriBubbles {\n    public static void main(String[]\
  \ args) {\n        Scanner scanner = new Scanner(System.in);\n        System.out.print(\"\
  Enter the size of the table: \");\n        int n = scanner.nextInt();\n        int[]\
  \ array = new int[n];\n        System.out.println(\"Enter the elements of the table:\"\
  );\n        for (int i = 0; i < n; i++) {\n            array[i] = scanner.nextInt();\n\
  \        }\n        // Implementation of the bubble sorting algorithm\n        for\
  \ (int i = 0; i < n - 1; i++) {\n            for (int j = 0; j < n - 1 - i; j++)\
  \ {\n                if (array[j] > array[j + 1]) {\n                    int temp\
  \ = array[j];\n                    array[j] = array[j + 1];\n                  \
  \  array[j + 1] = temp;\n                }\n            }\n        }\n        System.out.println(\"\
  Table sorted:\");\n        for (int i = 0; i < n; i++) {\n            System.out.print(array[i]\
  \ + \" \");\n        }\n    }\n}\n```\n\n在这个示例中，我们使用了一个整数数组来存储元素，冒泡排序算法实现在两个 `for`\
  \ 循环内部。程序要求用户输入数组的大小和元素，然后在最后显示排序后的数组。\n\n## 题目：Java 中的快速排序\n\n编写一个 Java 程序，使用快速排序算法对整数数组进行排序。快速排序算法是一种基于分治法的高效排序算法。它选择一个基准元素，将数组划分为两个子数组（基准元素元素和基准元素元素），然后递归地对这些子数组进行排序。\n\
  \n你需要在 Java 中编写快速排序逻辑，并确保你的程序运行正确。你也可以添加注释来解释你的代码。\n\n### Java 解决方案示例：\n\n```java\n\
  import java.util.Scanner;\n\npublic class QuickSort {\n    public static void main(String[]\
  \ args) {\n        Scanner scanner = new Scanner(System.in);\n        System.out.print(\"\
  Enter the size of the table: \");\n        int n = scanner.nextInt();\n        int[]\
  \ array = new int[n];\n        System.out.println(\"Enter the elements of the table:\"\
  );\n        for (int i = 0; i < n; i++) {\n            array[i] = scanner.nextInt();\n\
  \        }\n        // Call up the quick sort function\n        quickSort(array,\
  \ 0, n - 1);\n        System.out.println(\"Table sorted:\");\n        for (int i\
  \ = 0; i < n; i++) {\n            System.out.print(array[i] + \" \");\n        }\n\
  \    }\n\n    public static void quickSort(int[] arr, int low, int high) {\n   \
  \     if (low < high) {\n            int pivotIndex = partition(arr, low, high);\n\
  \            quickSort(arr, low, pivotIndex - 1);\n            quickSort(arr, pivotIndex\
  \ + 1, high);\n        }\n    }\n\n    public static int partition(int[] arr, int\
  \ low, int high) {\n        int pivot = arr[high];\n        int i = low - 1;\n \
  \       for (int j = low; j < high; j++) {\n            if (arr[j] < pivot) {\n\
  \                i++;\n                int temp = arr[i];\n                arr[i]\
  \ = arr[j];\n                arr[j] = temp;\n            }\n        }\n        int\
  \ temp = arr[i + 1];\n        arr[i + 1] = arr[high];\n        arr[high] = temp;\n\
  \        return i + 1;\n    }\n}\n```\n\n在这个示例中，我们使用了 `quickSort` 方法来对整数数组。程序要求用户输入数组的大小和元素，然后使用递归进行排序。\n\
  \n## 题目：Java 中的合并排序\n\n编写一个 Java 程序，使用合并排序算法（`MergeSort`）对整数数组进行排序。合并排序基于“分治”方法，通过将数组分为两部分，对这些部分进行排序，然后合并它们以得到一个排序后的数组。\n\
  \n你需要在 Java 中编写合并逻辑并确保你的程序运行正确。你也可以为你的代码添加注释。\n\n### Java 解决方案示例：\n\n```java\nimport\
  \ java.util.Scanner;\n\npublic class MergeSort {\n    public static void main(String[]\
  \ args) {\n        Scanner scanner = new Scanner(System.in);\n        System.out.print(\"\
  Enter the size of the table: \");\n        int n = scanner.nextInt();\n        int[]\
  \ array = new int[n];\n        System.out.println(\"Enter the elements of the table:\"\
  );\n        for (int i = 0; i < n; i++) {\n            array[i] = scanner.nextInt();\n\
  \        }\n        // Call the merge sort\n        mergeSort(array, 0, n - 1);\n\
  \        System.out.println(\"Table sorted:\");\n        for (int i = 0; i < n;\
  \ i++) {\n            System.out.print(array[i] + \" \");\n        }\n    }\n\n\
  \    public static void mergeSort(int[] arr, int left, int right) {\n        if\
  \ (left < right) {\n            int middle = (left + right) / 2;\n            mergeSort(arr,\
  \ left, middle);\n            mergeSort(arr, middle + 1, right);\n            merge(arr,\
  \ left, middle, right);\n        }\n    }\n\n    public static void merge(int[]\
  \ arr, int left, int middle, int right) {\n        int n1 = middle - left + 1;\n\
  \        int n2 = right - middle;\n        int[] leftArray = new int[n1];\n    \
  \    int[] rightArray = new int[n2];\n        for (int i = 0; i < n1; i++) {\n \
  \           leftArray[i] = arr[left + i];\n        }\n        for (int j = 0; j\
  \ < n2; j++) {\n            rightArray[j] = arr[middle + 1 + j];\n        }\n  \
  \      int i = 0, j = 0, k = left;\n        while (i < n1 && j < n2) {\n       \
  \     if (leftArray[i] <= rightArray[j]) {\n                arr[k] = leftArray[i];\n\
  \                i++;\n            } else {\n                arr[k] = rightArray[j];\n\
  \                j++;\n            }\n            k++;\n        }\n        while\
  \ (i < n1) {\n            arr[k] = leftArray[i];\n            i++;\n           \
  \ k++;\n        }\n        while (j < n2) {\n            arr[k] = rightArray[j];\n\
  \            j++;\n            k++;\n        }\n    }\n}\n```\n\n在这个示例中，我们使用了 `MergeSort`\
  \ 算法对整数数组进行排序。程序要求用户输入数组的大小和元素，然后使用递归进行排序。\n\n## 题目：Java 中的选择排序\n\n编写一个 Java 程序，使用选择排序算法对整数数组进行排序。选择排序算法包括找到数组中的最小元素并将其放在第一个位置，然后对数组的部分重复此过程。\n\
  \n你需要在 Java 中编写 `selectionSort` 逻辑并确保你的程序运行正确。你也可以为你的代码添加注释。\n\n### Java 解决方案示例：\n\
  \n```java\nimport java.util.Scanner;\n\npublic class SelectionSort {\n    public\
  \ static void main(String[] args) {\n        Scanner scanner = new Scanner(System.in);\n\
  \        System.out.print(\"Enter the size of the table: \");\n        int n = scanner.nextInt();\n\
  \        int[] array = new int[n];\n        System.out.println(\"Enter the elements\
  \ of the table:\");\n        for (int i = 0; i < n; i++) {\n            array[i]\
  \ = scanner.nextInt();\n        }\n        // Call up the sort by selection function\n\
  \        selectionSort(array);\n        System.out.println(\"Table sorted:\");\n\
  \        for (int i = 0; i < n; i++) {\n            System.out.print(array[i] +\
  \ \" \");\n        }\n    }\n\n    public static void selectionSort(int[] array)\
  \ {\n        int n = array.length;\n        for (int i = 0; i < n - 1; i++) {\n\
  \            int minIdx = i;\n            for (int j = i + 1; j < n; j++) {\n  \
  \              if (array[j] < array[minIdx]) {\n                    minIdx = j;\n\
  \                }\n            }\n            int temp = array[minIdx];\n     \
  \       array[minIdx] = array[i];\n            array[i] = temp;\n        }\n   \
  \ }\n}\n```\n\n\n\n\n\n```java\nfor (int i = 0; i < n; i++) {\n    System.out.print(array[i]\
  \ + \" \");\n}\n}\n}\n\npublic static void selectionSort(int[] arr) {\n    int n\
  \ = arr.length;\n    for (int i = 0; i < n - 1; i++) {\n        int minIndex = i;\n\
  \        for (int j = i + 1; j < n; j++) {\n            if (arr[j] < arr[minIndex])\
  \ {\n                minIndex = j;\n            }\n        }\n        int temp =\
  \ arr[i];\n        arr[i] = arr[minIndex];\n        arr[minIndex] = temp;\n    }\n\
  }\n}\n```\n\n在这个示例中，我们使用了选择排序算法对整数数组进行排序。程序要求用户输入数组的大小和元素，然后使用双重循环在数组的未排序部分找到最小元素并将其放置在正确的位置。此操作重复进行，直到整个数组排序完成。\n\
  \n## Java 中的插入排序\n\n编写一个 Java 程序，使用插入排序算法对整数数组进行排序。插入排序算法由从左到右依次将每个未排序元素插入到已排序元素中的正确位置组成。\n\
  \n你需要在 Java 中编写插入排序的逻辑，并确保你的程序运行正常。你也可以添加注释来解释你的代码。\n\n### Java 解决方案示例：\n\n```java\n\
  import java.util.Scanner;\n\npublic class InsertionSort {\n\n    public static void\
  \ main(String[] args) {\n        Scanner scanner = new Scanner(System.in);\n   \
  \     System.out.print(\"Enter the size of the table: \");\n        int n = scanner.nextInt();\n\
  \        int[] array = new int[n];\n        System.out.println(\"Enter the elements\
  \ of the table:\");\n        for (int i = 0; i < n; i++) {\n            array[i]\
  \ = scanner.nextInt();\n        }\n        // 调用插入排序函数\n        insertSort(array);\n\
  \        System.out.println(\"Table sorted:\");\n        for (int i = 0; i < n;\
  \ i++) {\n            System.out.print(array[i] + \" \");\n        }\n    }\n\n\
  \    public static void insertionSort(int[] arr) {\n        int n = arr.length;\n\
  \        for (int i = 1; i < n; i++) {\n            int key = arr[i];\n        \
  \    int j = i - 1;\n            while (j >= 0 && arr[j] > key) {\n            \
  \    arr[j + 1] = arr[j];\n                j--;\n            }\n            arr[j\
  \ + 1] = key;\n        }\n    }\n}\n```\n\n在这个示例中，我们使用了插入排序算法对整数数组进行排序。程序要求用户输入数组的大小和元素，然后使用循环将每个未排序元素插入到已排序元素中的正确位置。此操作重复进行，直到整个数组排序完成。\n\
  \n## Java 中的二分查找\n\n编写一个 Java 程序，在排序整数数组中执行二分查找。二分查找是一种高效算法，它通过递归地将数组分为两部分并将搜索元素与中间元素进行比较来查找。如果搜索元素与中间元素相等，算法返回该元素在数组中的位置。否则，算法将搜索范围缩小到可能找到该元素的数组半部分。\n\
  \n你需要在 Java 中编写二分查找的逻辑，并确保你的程序运行正常。你也可以添加注释来解释你的代码。\n\n### Java 解决方案示例：\n\n```java\n\
  import java.util.Scanner;\n\npublic class BinarySearch {\n\n    public static void\
  \ main(String[] args) {\n        Scanner scanner = new Scanner(System.in);\n   \
  \     System.out.print(\"Enter the size of the sorted array: \");\n        int n\
  \ = scanner.nextInt();\n        int[] array = new int[n];\n        System.out.println(\"\
  Enter the elements of the sorted array (in ascending order):\");\n        for (int\
  \ i = 0; i < n; i++) {\n            array[i] = scanner.nextInt();\n        }\n \
  \       System.out.print(\"Enter the item to search for: \");\n        int elementSearch\
  \ = scanner.nextInt();\n        int position = binarySearch(array, elementSearch);\n\
  \        if (position != -1) {\n            System.out.println(\"The element \"\
  \ + elementSearch + \" has been found at position \" + position + \" in the array.\"\
  );\n        } else {\n            System.out.println(\"The element \" + elementSearch\
  \ + \" was not found in the array.\");\n        }\n    }\n\n    public static int\
  \ binarySearch(int[] arr, int target) {\n        int left = 0;\n        int right\
  \ = arr.length - 1;\n        while (left <= right) {\n            int mid = left\
  \ + (right - left) / 2;\n            if (arr[mid] == target) {\n               \
  \ return mid;\n            }\n            if (arr[mid] < target) {\n           \
  \     left = mid + 1;\n            } else {\n                right = mid - 1;\n\
  \            }\n        }\n        return -1;\n    }\n}\n```\n\n## Java 中的顺序查找\n\
  \n编写一个 Java 程序在数组中执行搜索。顺序查找是一种简单的算法，它逐个遍历元素，直到找到正在查找的元素或遍历完数组。\n\nJava 解决方案示例：\n\
  \n```java\nimport java.util.Scanner;\n\npublic class SequentialSearch {\n\n    public\
  \ static void main(String[] args) {\n        Scanner scanner = new Scanner(System.in);\n\
  \        System.out.print(\"Enter the size of the table: \");\n        int n = scanner.nextInt();\n\
  \        int[] array = new int[n];\n        System.out.println(\"Enter the elements\
  \ of the table:\");\n        for (int i = 0; i < n; i++) {\n            array[i]\
  \ = scanner.nextInt();\n        }\n        System.out.print(\"Enter the item to\
  \ search for: \");\n        int elementSearch = scanner.nextInt();\n        int\
  \ position = sequentialSearch(array, elementSearch);\n        if (position != -1)\
  \ {\n            System.out.println(\"The element \" + elementSearch + \" has been\
  \ found at position \" + position + \" in the array.\");\n        } else {\n   \
  \         System.out.println(\"The element \" + elementSearch + \" was not found\
  \ in the array.\");\n        }\n    }\n\n    public static int sequentialSearch(int[]\
  \ arr, int target) {\n        for (int i = 0; i < arr.length; i++) {\n         \
  \   if (arr[i] == target) {\n                return i; // 找到元素，返回位置\n          \
  \  }\n        }\n        return -1; // 未找到\n    }\n}\n```\n\n在这个示例中，我们使用了顺序查找算法在数组中查找元素。程序要求用户输入数组的大小、数组元素以及要搜索的元素。然后执行顺序查找以找到元素，如果找到则显示其位置，否则指示未找到。顺序查找虽然简单，但对于大型数组可能比其他方法效率低，因为它需要遍历数组中的所有元素。\n\
  \n## Java 中计算阶乘\n\n编写一个 Java 程序计算给定数字的阶乘。正整数 n 的阶乘是从 1 到 n 的所有正整数的乘积。\n\n你需要在 Java\
  \ 中编写计算阶乘的逻辑，并确保你的程序运行正常。你也可以添加注释来解释你的代码。\n\n### Java 解决方案示例：\n\n```java\nimport\
  \ java.util.Scanner;\n\npublic class Factorial {\n\n    public static void main(String[]\
  \ args) {\n        Scanner scanner = new Scanner(System.in);\n```\n\n\n\n\n\n```java\n\
  System.out.print(\"Enter a positive integer: \");\n\nint n = scanner.nextInt();\n\
  if (n < 0) {\n    System.out.println(\"The factorial is only defined for positive\
  \ integers.\");\n} else {\n    long result = calculateFactorial(n);\n    System.out.println(\"\
  The factorial of \" + n + \" is \" + result);\n}\n\npublic static long calculateFactorial(int\
  \ n) {\n    if (n == 0 || n == 1) {\n        return 1; // The factorial of 0 and\
  \ 1 is 1\n    }\n    long factorial = 1;\n    for (int i = 2; i <= n; i++) {\n \
  \       factorial *= i;\n    }\n    return factorial;\n}\n```\n\n在这个示例中，我们使用 `for`\
  \ 循环来计算给定正整数的阶乘。程序要求用户输入一个数字，然后检查它是否为正数。如果是，它通过相乘从 `1` 到 `n` 的所有整数来计算阶乘；否则它指示阶乘仅对正整数定义。`0`\
  \ 和 `1` 的阶乘定义为 `1`。\n\n### 语句：在 Java 中计算一系列整数之和\n\n编写一个 Java 程序来计算一系列整数之和。用户必须输入要相加的整数个数，然后输入这些整数。程序必须计算这些整数的和并显示出来。\n\
  \n你需要在 Java 中编写计算和的逻辑代码，并确保你的程序正常运行。你也可以添加注释来解释你的代码。\n\n### Java 解决方案示例：\n\n```java\n\
  import java.util.Scanner;\n\npublic class SumOfIntegers {\n\n    public static void\
  \ main(String[] args) {\n        Scanner scanner = new Scanner(System.in);\n   \
  \     System.out.print(\"Enter the number of integers to be added: \");\n      \
  \  int n = scanner.nextInt();\n        int[] integers = new int[n];\n        int\
  \ sum = 0;\n        System.out.println(\"Enter the integers one by one:\");\n  \
  \      for (int i = 0; i < n; i++) {\n            integers[i] = scanner.nextInt();\n\
  \            sum += integers[i];\n        }\n        System.out.println(\"The sum\
  \ of the integers is: \" + sum);\n    }\n}\n```\n\n在这个示例中，我们使用 `for` 循环允许用户逐个输入整数。在循环的每次迭代中，输入的整数都会被加到\
  \ `sum` 变量中，该变量用于存储总和。一旦输入了所有整数，程序就会显示 `sum`。\n\n### 语句：在 Java 中计算一个数的幂\n\n编写一个\
  \ Java 程序来计算一个数的幂。用户必须输入底数（一个数字）和指数（一个非负整数）。程序必须计算底数相对于指数方的幂的值并显示出来。\n\n你需要在 Java\
  \ 中编写计算幂的逻辑，同时处理指数为负数的情况，并确保你的程序正常运行。你可以添加注释来解释你的代码。\n\n### Java 解决方案示例：\n\n```java\n\
  import java.util.Scanner;\n\npublic class PowerCalculation {\n\n    public static\
  \ void main(String[] args) {\n        Scanner scanner = new Scanner(System.in);\n\
  \        System.out.print(\"Enter the base (a number): \");\n        double base\
  \ = scanner.nextDouble();\n        System.out.print(\"Enter the exponent (a non-negative\
  \ integer): \");\n        int exponent = scanner.nextInt();\n        if (exponent\
  \ < 0) {\n            System.out.println(\"The exponent must be a non-negative integer.\"\
  );\n        } else {\n            double result = calculatePower(base, exponent);\n\
  \            System.out.println(base + \"raised to the power\" + exponent + \"equals\"\
  \ + result);\n        }\n    }\n\n    public static double calculatePower(double\
  \ base, int exponent) {\n        if (exponent == 0) {\n            return 1;\n \
  \       } else {\n            double result = 1;\n            for (int i = 1; i\
  \ <= exponent; i++) {\n                result *= base;\n            }\n        \
  \    return result;\n        }\n    }\n}\n```\n\n在这个示例中，我们使用 `for` 循环来计算 `base`\
  \ 的幂。程序要求用户输入 `base` 和 `exponent`，检查 `exponent` 是否为非负整数。`0` 的幂定义为 `1`。\n\n### 语句：在\
  \ Java 中计算最大公约数 (GCD)\n\n编写一个 Java 程序来计算两个数的最大公约数 (`GCD`)。`GCD` 是能够同时除尽两个数且无余数的最大整数。\n\
  \n你需要在 Java 中编写 `GCD` 的逻辑，并确保你的程序正常运行。你也可以添加注释来解释你的代码。\n\n### Java 解决方案示例：\n\n```java\n\
  import java.util.Scanner;\n\npublic class GCDCalculation {\n\n    public static\
  \ void main(String[] args) {\n        Scanner scanner = new Scanner(System.in);\n\
  \        System.out.print(\"Enter the first number: \");\n        int n1 = scanner.nextInt();\n\
  \        System.out.print(\"Enter the second number: \");\n        int n2 = scanner.nextInt();\n\
  \        int gcd = calculateGCD(n1, n2);\n        System.out.println(\"The GCD of\
  \ \" + n1 + \" and \" + n2 + \" is \" + gcd);\n    }\n\n    public static int calculateGCD(int\
  \ a, int b) {\n        while (b != 0) {\n            int temp = b;\n           \
  \ b = a % b;\n            a = temp;\n        }\n        return a;\n    }\n}\n```\n\
