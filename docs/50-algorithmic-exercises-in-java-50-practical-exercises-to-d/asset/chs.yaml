  \            int middleIndex = size / 2;\n            return array[middleIndex];\n\
  \        }\n    }\n}\n```\n\n\n\n\n\n在这个示例中，我们使用了 `Arrays.sort` 方法对整数数组进行排序，这对于寻找中位数至关重要。然后，我们使用逻辑判断根据数组大小的奇偶性来确定中位数。如果数组元素个数为偶数，中位数是两个中间元素的平均值；如果数组元素个数为奇数，中位数就是中间元素。程序最后会显示中位数。\n\
