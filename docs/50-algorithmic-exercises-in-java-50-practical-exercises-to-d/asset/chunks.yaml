    Statement: Calculating the average of an array of numbers in Java


    Write a Java program that calculates the average of the numbers in an array. The
    user must first enter the size of the table, then enter the numbers one by one.
    The program then calculates the average of these numbers and displays it.


    You need to code the averaging logic in Java and make sure that your program works
    correctly. You can also add comments to explain your code.


    Example of a solution in Java :


    import java.util.Scanner;


    public class AverageCalculator {


        public static void main(String[] args) {


            Scanner scanner = new Scanner(System.in);


            System.out.print("Enter the size of the table: ");


            int size = scanner.nextInt();


            double[] numbers = new double[size];


            double sum = 0;


            System.out.println("Enter the elements of the table:");


            for (int i = 0; i < size; i++) {


                numbers[i] = scanner.nextDouble();


                sum += numbers[i];


            }


            double average = calculateAverage(sum, size);


            System.out.println("The average number is: " + average);


        }


        public static double calculateAverage(double sum, int count) {


            if (count > 0) {


                return sum / count;


            } else {


                return 0.0; // Avoid division by zero if the array is empty


            }


        }


    }


    In this example, we have used an array of numbers and a for loop to allow the
    user to enter the elements of the array one by one. The sum of the numbers is
    calculated at the same time. Then the calculateAverage function is used to calculate
    the average by dividing the sum by the number of elements in the array. If the
    array is empty, the average is set to 0 to avoid division by zero. The program
    then displays the average.


    Statement : Finding the median in an unsorted array in Java


    Write a Java program that finds the median of an unsorted array of integers. The
    median is the central value of a set of sorted or unsorted data. You need to find
    the median in an unsorted array.


    You need to code the median search logic in Java and make sure that your program
    works correctly. You can also add comments to explain your code.


    Example of a solution in Java :


    import java.util.Scanner;


    import java.util.Arrays;


    public class MedianFinder {


        public static void main(String[] args) {


            Scanner scanner = new Scanner(System.in);


            System.out.print("Enter the size of the table: ");


            int size = scanner.nextInt();


            int[] numbers = new int[size];


            System.out.println("Enter the elements of the table:");


            for (int i = 0; i < size; i++) {


                numbers[i] = scanner.nextInt();


            }


            int median = findMedian(numbers);


            System.out.println("The median of the table is: " + median);


        }


        public static int findMedian(int[] array) {


            // Sort the table


            Arrays.sort(array);


            int size = array.length;


            if (size % 2 == 0) {


                // If the table has an even number of elements, the median is the
    average of the two central elements.


                int middleIndex1 = size / 2 - 1;


                int middleIndex2 = size / 2;


                return (array[middleIndex1] + array[middleIndex2]) / 2;


            } else {


                // If the table has an odd number of elements, the median is the central
    element.


                int middleIndex = size / 2;


                return array[middleIndex];


            }


        }


