    \ Bubble sorting in Java\n\nWrite a Java program to sort an array of integers\
    \ using the bubble sort algorithm. The bubble sort algorithm works by comparing\
    \ and swapping adjacent elements if they are in the wrong order, and repeats this\
    \ process until the whole array is sorted.\n\nYou need to code the bubble sort\
    \ logic in Java and make sure that your program works correctly. You can also\
    \ add comments to explain your code.\n\n### Example of a solution in Java :\n\n\
    ```java\nimport java.util.Scanner;\n\npublic class TriBubbles {\n    public static\
    \ void main(String[] args) {\n        Scanner scanner = new Scanner(System.in);\n\
    \        System.out.print(\"Enter the size of the table: \");\n        int n =\
    \ scanner.nextInt();\n        int[] array = new int[n];\n        System.out.println(\"\
    Enter the elements of the table:\");\n        for (int i = 0; i < n; i++) {\n\
    \            array[i] = scanner.nextInt();\n        }\n        // Implementation\
    \ of the bubble sorting algorithm\n        for (int i = 0; i < n - 1; i++) {\n\
    \            for (int j = 0; j < n - 1 - i; j++) {\n                if (array[j]\
    \ > array[j + 1]) {\n                    int temp = array[j];\n              \
    \      array[j] = array[j + 1];\n                    array[j + 1] = temp;\n  \
    \              }\n            }\n        }\n        System.out.println(\"Table\
    \ sorted:\");\n        for (int i = 0; i < n; i++) {\n            System.out.print(array[i]\
    \ + \" \");\n        }\n    }\n}\n```\n\nIn this example, we have used an array\
    \ of integers to store the elements, and the bubble sort algorithm is implemented\
    \ inside two `for` loops. The program asks the user to enter the size of the array\
    \ and the elements of the array, then displays the sorted array at the end.\n\n\
    ## Statement: Quicksort in Java\n\nWrite a Java program to sort an array of integers\
    \ using the quicksort algorithm. The quicksort algorithm is an efficient sorting\
    \ algorithm based on the divide-and-conquer method. It selects a pivot element,\
    \ partitions the array into two sub-arrays (elements below the pivot and elements\
    \ above the pivot), then recursively sorts these sub-arrays.\n\nYou need to code\
    \ the quick sort logic in Java and make sure your program works correctly. You\
    \ can also add comments to explain your code.\n\n### Example of a solution in\
    \ Java :\n\n```java\nimport java.util.Scanner;\n\npublic class QuickSort {\n \
    \   public static void main(String[] args) {\n        Scanner scanner = new Scanner(System.in);\n\
    \        System.out.print(\"Enter the size of the table: \");\n        int n =\
    \ scanner.nextInt();\n        int[] array = new int[n];\n        System.out.println(\"\
    Enter the elements of the table:\");\n        for (int i = 0; i < n; i++) {\n\
    \            array[i] = scanner.nextInt();\n        }\n        // Call up the\
    \ quick sort function\n        quickSort(array, 0, n - 1);\n        System.out.println(\"\
    Table sorted:\");\n        for (int i = 0; i < n; i++) {\n            System.out.print(array[i]\
    \ + \" \");\n        }\n    }\n\n    public static void quickSort(int[] arr, int\
    \ low, int high) {\n        if (low < high) {\n            int pivotIndex = partition(arr,\
    \ low, high);\n            quickSort(arr, low, pivotIndex - 1);\n            quickSort(arr,\
    \ pivotIndex + 1, high);\n        }\n    }\n\n    public static int partition(int[]\
    \ arr, int low, int high) {\n        int pivot = arr[high];\n        int i = low\
    \ - 1;\n        for (int j = low; j < high; j++) {\n            if (arr[j] < pivot)\
    \ {\n                i++;\n                int temp = arr[i];\n              \
    \  arr[i] = arr[j];\n                arr[j] = temp;\n            }\n        }\n\
    \        int temp = arr[i + 1];\n        arr[i + 1] = arr[high];\n        arr[high]\
    \ = temp;\n        return i + 1;\n    }\n}\n```\n\nIn this example, we have used\
    \ `quickSort` method to sort an array of integers. The program asks the user to\
    \ enter the size of the array and the elements, then uses recursion to sort the\
    \ array.\n\n## Statement: Mergesort in Java\n\nWrite a Java program to sort an\
    \ array of integers using the merge algorithm (`Mergesort`). The merge sort is\
    \ based on the \"divide and conquer\" method by dividing the array into two halves,\
    \ sorting these halves, then merging the sorted halves to obtain a sorted array.\n\
    \nYou need to code the fusion logic in Java and make sure your program works correctly.\
    \ You can also add comments to your code.\n\n### Example of a solution in Java\
    \ :\n\n```java\nimport java.util.Scanner;\n\npublic class MergeSort {\n    public\
