    \ / 2;\n            if (arr[mid] == target) {\n                return mid;\n \
    \           }\n            if (arr[mid] < target) {\n                left = mid\
    \ + 1;\n            } else {\n                right = mid - 1;\n            }\n\
    \        }\n        return -1; // Element not\n    }\n}\n```\n\nThis example solution\
