    \        for (int i = 0; i < n1; i++) {\n            leftArray[i] = arr[left +\
    \ i];\n        }\n        for (int j = 0; j < n2; j++) {\n            rightArray[j]\
    \ = arr[middle + 1 + j];\n        }\n        int i = 0, j = 0, k = left;\n   \
    \     while (i < n1 && j < n2) {\n            if (leftArray[i] <= rightArray[j])\
    \ {\n                arr[k] = leftArray[i];\n                i++;\n          \
