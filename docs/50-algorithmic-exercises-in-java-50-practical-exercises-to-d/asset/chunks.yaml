    \ sort an array of integers in ascending order. `Pancake Sort` is a sorting algorithm\
    \ that returns the elements of the array in order to sort them.\n\n## Part 1 -\
    \ Statement :\n\nWrite a Java program to sort an array of integers using the `pancake\
    \ sort` algorithm. The `pancake sort` returns the elements of the array to sort\
    \ them progressively. You can only return elements from the first position in\
    \ the array.\n\n## Part 2 - Example of a solution in Java :\n\nHere is an example\
    \ of a solution in Java that uses the `pancake sort` to sort an array of integers:\n\
    \n```java\npublic class PancakeSort {\n    public static void main(String[] args)\
    \ {\n        int[] arr = {8, 4, 1, 56, 3, 44, 23, 6, 28, 0};\n        pancakeSort(arr);\n\
    \        System.out.println(\"Table sorted:\");\n        for (int num : arr) {\n\
    \            System.out.print(num + \" \");\n        }\n    }\n\n    public static\
    \ void pancakeSort(int[] arr) {\n        int n = arr.length;\n        for (int\
    \ currentSize = n; currentSize > 1; currentSize--) {\n            int maxIndex\
    \ = findMaxIndex(arr, currentSize);\n            if (maxIndex != currentSize -\
    \ 1) {\n                // Invert elements from the beginning to the maximum element\n\
    \                flip(arr, maxIndex);\n                // Invert all elements\
    \ of the current array\n                flip(arr, currentSize - 1);\n        \
    \    }\n        }\n    }\n\n    public static int findMaxIndex(int[] arr, int\
    \ n) {\n        int maxIndex = 0;\n        for (int i = 0; i < n; i++) {\n   \
    \         if (arr[i] > arr[maxIndex]) {\n                maxIndex = i;\n     \
    \       }\n        }\n        return maxIndex;\n    }\n\n    public static void\
    \ flip(int[] arr, int end) {\n        int start = 0;\n        while (start < end)\
    \ {\n            int temp = arr[start];\n            arr[start] = arr[end];\n\
    \            arr[end] = temp;\n            start++;\n            end--;\n    \
