    ## Java 中的优化排序\n\n该练习涉及编写一个 Java 程序，实现优化的冒泡排序来对整数数组进行排序。冒泡排序是一种简单的算法，它遍历数组，比较相邻元素并在必要时交换它们以正确正确排序。该算法会持续遍历数组，直到在完整的一次遍历中没有发生任何交换，这表明数组已排序。\n\
    \n### 第 1 部分 - 题目描述\n\n编写一个 Java 程序，使用冒泡排序算法对整数数组进行排序。优化排序是对经典冒泡排序的改进，它在检测到完整遍历过程中不需要交换时立即停止排序过程。\n\
    \n## 第 2 部分 - Java 解决方案示例\n\n这是一个使用优化冒泡排序对整数数组进行排序的 Java 解决方案示例：\n\n```java\n\
    public class BubbleOptimized {\n    public static void main(String[] args) {\n\
    \        int[] arr = {64, 34, 25, 22, 11, 90};\n        bubbleSort(arr);\n   \
    \     System.out.println(\"排序后的表格:\");\n        for (int num : arr) {\n      \
    \      System.out.print(num + \" \");\n        }\n    }\n\n    public static void\
    \ bubbleSort(int[] arr) {\n        int n = arr.length;\n        boolean swapped;\n\
    \        for (int i = 0; i < n - 1; i++) {\n            swapped = false;\n   \
    \         for (int j = 0; j < n - i - 1; j++) {\n                if (arr[j] >\
    \ arr[j + 1]) {\n                    int temp = arr[j];\n                    arr[j]\
    \ = arr[j + 1];\n                    arr[j + 1] = temp;\n                    swapped\
    \ = true;\n                }\n            }\n            if (!swapped) {\n   \
    \             // 如果没有执行任何交换，则表格已经是排序过的。\n                break;\n            }\n\
    \        }\n    }\n}\n```\n\n此 Java 示例实现了优化的冒泡排序算法来对整数数组进行排序。程序接收数组作为输入，执行冒泡排序然后显示排序后的数组。你可以自定义输入以测试不同数据集的冒泡排序。\n\
    \n## Java 中的桶排序\n\n该练习涉及编写一个 Java 程序，实现桶排序以对整数数组进行升序排序。桶排序是一种非比较算法，它根据元素的值将数组划分为“桶”，并单独对它们进行排序。然后合并排序后的桶以获得最终数组。\n\
    \n### 第 1 部分 - 题目描述\n\n编写一个 Java 程序，使用鸽巢排序（pigeonhole sorting）对整数数组进行排序。程序必须考虑整数可能的取值范围，以便将元素分布到抽屉中。\n\
    \n### 第 2 部分 - Java 解决方案示例\n\n这是一个使用鸽巢排序对整数数组进行排序的 Java 解决方案示例：\n\n```java\nimport\
    \ java.util.ArrayList;\nimport java.util.Collections;\nimport java.util.List;\n\
    \npublic class BucketSort {\n    public static void main(String[] args) {\n  \
    \      int[] arr = {64, 34, 25, 22, 11, 90, 85};\n        bucketSort(arr);\n \
    \       System.out.println(\"排序后的表格:\");\n        for (int num : arr) {\n    \
    \        System.out.print(num + \" \");\n        }\n    }\n\n    public static\
    \ void bucketSort(int[] arr) {\n        int min = arr[0];\n        int max = arr[0];\n\
    \        int n = arr.length;\n        // 找到表格中的最小值和最大值\n        for (int i = 1;\
    \ i < n; i++) {\n            if (arr[i] < min) {\n                min = arr[i];\n\
    \            } else if (arr[i] > max) {\n                max = arr[i];\n     \
    \       }\n        }\n        int range = max - min + 1;\n        // 创建桶\n   \
    \     List<List<Integer>> buckets = new ArrayList<>(range);\n        for (int\
    \ i = 0; i < range; i++) {\n            buckets.add(new ArrayList<>());\n    \
    \    }\n        // 将元素放入抽屉\n        for (int i = 0; i < n; i++) {\n          \
    \  buckets.get(arr[i] - min).add(arr[i]);\n        }\n        // 对每个桶中的元素排序\n\
    \        for (int i = 0; i < range; i++) {\n            Collections.sort(buckets.get(i));\n\
    \        }\n        // 合并排序后的抽屉元素以获得排序数组\n        int index = 0;\n        for\
    \ (int i = 0; i < range; i++) {\n            for (int num : buckets.get(i)) {\n\
    \                arr[index++] = num;\n            }\n        }\n    }\n}\n```\n"
