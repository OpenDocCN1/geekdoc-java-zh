  raw: 'Write a Java program that allows a user to enter or represent a graph with
    its vertices and edges, and then detects whether it contains cycles.


    Part 2 - Example of a solution in Java :


    Here is an example of a solution in Java for detecting cycles in an undirected
    graph using depth-first search (DFS):


    import java.util.ArrayList;


    import java.util.HashSet;


    import java.util.List;


    import java.util.Set;


    public class GraphCycleDetection {


        private int V; // Number of vertices


        private List<List<Integer>> adj; // Adjacency list


        public GraphCycleDetection(int vertices) {


            V = vertices;


            adj = new ArrayList<>(vertices);


            for (int i = 0; i < vertices; i++) {


                adj.add(new ArrayList<>());


            }


        }


        public void addEdge(int u, int v) {


            adj.get(u).add(v);


            adj.get(v).add(u);


        }


        public boolean hasCycle() {


            Set<Integer> visited = new HashSet<>();


            for (int v = 0; v < V; v++) {


                if (!visited.contains(v)) {


                    if (hasCycleUtil(v, -1, visited)) {


                        return true;


                    }


                }


            }


            return false;


        }


        private boolean hasCycleUtil(int v, int parent, Set<Integer> visited) {


            visited.add(v);


            for (int neighbor : adj.get(v)) {


                if (!visited.contains(neighbor)) {


                    if (hasCycleUtil(neighbor, v, visited)) {


                        return true;


                    }


                } else if (neighbor != parent) {


                    return true;


                }


            }


            return false;


        }


        public static void main(String[] args) {


            int V = 4;


            GraphCycleDetection graph = new GraphCycleDetection(V);


            graph.addEdge(0, 1);


            graph.addEdge(0, 2);


            graph.addEdge(1, 2);


            graph.addEdge(2, 0);


            graph.addEdge(2, 3);


            graph.addEdge(3, 3);


            if (graph.hasCycle()) {


                System.out.println("The graph contains a cycle.");


            } else {


                System.out.println("The graph contains no cycles.");


            }


        }


    }


    This example shows how to detect cycles in an undirected graph using depth-first
    search (DFS). The program lets you create a graph, add edges and then check it
    for cycles. You can customise the graph by adding or modifying edges to test different
    scenarios.


    Statement: Bubble sorting optimised in Java


    The exercise involves writing a Java program that implements the optimised bubble
    sort algorithm to sort an array of integers in ascending order. Bubble Sort is
    a simple algorithm that traverses the array, comparing neighbouring elements and
    swapping them if necessary to order them correctly. The algorithm continues to
    traverse the array until no swaps are made on a complete pass, indicating that
    the array is sorted.


    Part 1 - Statement :


    Write a Java program to sort an array of integers using the optimised bubble sort
    algorithm. Optimised bubble sorting is an improvement on classic bubble sorting
    that stops the sorting process as soon as it detects that no exchange is necessary
    during a complete pass.


    Part 2 - Example of a solution in Java :


    Here is an example of a solution in Java that uses the optimised bubble sort algorithm
    to sort an array of integers:


    public class BubbleSortOptimized {


        public static void main(String[] args) {


            int[] arr = {64, 34, 25, 12, 22, 11, 90};


            bubbleSort(arr);


            System.out.println("Table sorted:");


            for (int num : arr) {


                System.out.print(num + " ");


            }


        }


        public static void bubbleSort(int[] arr) {


            int n = arr.length;


            boolean swapped;


            for (int i = 0; i < n - 1; i++) {


                swapped = false;


                for (int j = 0; j < n - i - 1; j++) {


                    if (arr[j] > arr[j + 1]) {


                        int temp = arr[j];


                        arr[j] = arr[j + 1];


                        arr[j + 1] = temp;


                        swapped = true;


                    }


                }


                if (!swapped) {


                    // If no inversion has been performed, the table is already sorted.


                    break;


                }


            }


        }


    }


    This example solution in Java implements the optimised bubble sort algorithm to
    sort an array of integers. The program takes an array as input, performs the optimised
    bubble sort and then displays the sorted array. You can customise the input array
    to test the optimised bubble sort with different data sets.


    Statement: Bucket Sort in Java


    The exercise involves writing a Java program that implements the Bucket Sort algorithm
    to sort an array of integers in ascending order. Bucket Sort is a non-comparative
    sorting algorithm that divides the elements of the array into ''drawers'' or ''buckets''
    according to their value, then sorts these drawers individually. It then combines
    the sorted drawers to obtain the final sorted array.


    Part 1 - Statement :


    Write a Java program to sort an array of integers using the pigeonhole sorting
    algorithm. The program must take into account the range of possible values of
    the integers in the array in order to distribute the elements into the drawers.


    Part 2 - Example of a solution in Java :


    Here is an example of a solution in Java that uses the pigeonhole sorting algorithm
    to sort an array of integers:


    import java.util.ArrayList;


    import java.util.Collections;


    import java.util.List;


    public class BucketSort {


        public static void main(String[] args) {


            int[] arr = {64, 34, 25, 12, 22, 11, 90, 80, 5};


            bucketSort(arr);


            System.out.println("Table sorted:");


            for (int num : arr) {


                System.out.print(num + " ");


            }


        }


        public static void bucketSort(int[] arr) {


            int min = arr[0];


            int max = arr[0];


            int n = arr.length;


            // Find the minimum and maximum values in the table


            for (int i = 1; i < n; i++) {


                if (arr[i] < min) {


                    min = arr[i];


                } else if (arr[i] > max) {


                    max = arr[i];


                }


            }


            int range = max - min + 1;


            // Create buckets


            List<List<Integer>> buckets = new ArrayList<>(range);


            for (int i = 0; i < range; i++) {


                buckets.add(new ArrayList<>());


            }


            // Place items in drawers


            for (int i = 0; i < n; i++) {


                buckets.get(arr[i] - min).add(arr[i]);


            }


            // Sort the items in each drawer


            for (int i = 0; i < range; i++) {


                Collections.sort(buckets.get(i));


            }


            // Combine the sorted elements of the drawers to obtain the sorted array


            int index = 0;


            for (int i = 0; i < range; i++) {


                for (int num : buckets.get(i)) {


                    arr[index++] = num;


                }


            }


        }


    }


    This example solution in Java uses the pigeonhole sorting algorithm to sort an
    array of integers. The program first determines the range of possible values,
    creates drawers for each possible value, places the elements in the drawers, sorts
    the elements in each drawer and then combines the sorted elements to obtain the
    final sorted array. You can customise the input array to test pigeonhole sorting
    with different data sets.


