    \ (int i = 0; i < n; i++) {\n            array[i] = scanner.nextInt();\n     \
    \   }\n        // Call up the sort by selection function\n        selectionSort(array);\n\
    \        System.out.println(\"Table sorted:\");\n        for (int i = 0; i < n;\
    \ i++) {\n            System.out.print(array[i] + \" \");\n        }\n    }\n\n\
    \    public static void selectionSort(int[] array) {\n        int n = array.length;\n\
    \        for (int i = 0; i < n - 1; i++) {\n            int minIdx = i;\n    \
    \        for (int j = i + 1; j < n; j++) {\n                if (array[j] < array[minIdx])\
    \ {\n                    minIdx = j;\n                }\n            }\n     \
