    The exercise involves writing a Java program that implements the Comb Sort algorithm\
    \ to sort an array of integers in ascending order. Comb Sort is a variation of\
    \ Bubble Sort that swaps elements at a fixed distance instead of swapping adjacent\
    \ elements, making it more efficient.\n\n## Part 1 - Statement :\n\nWrite a Java\
    \ program to sort an array of integers using the comb sort algorithm. Comb sorting\
    \ starts with a large gap between the elements to be compared, then progressively\
    \ reduces this gap until it reaches zero, thus carrying out comparisons and exchanges\
    \ efficiently.\n\n## Part 2 - Example of a solution in Java :\n\nHere is an example\
    \ of a solution in Java that uses the comb sort algorithm to sort an array of\
    \ integers:\n\n```java\npublic class CombSort {\n    public static void main(String[]\
    \ args) {\n        int[] arr = {8, 4, 1, 56, 3, -44, 23, -6, 28, 0};\n       \
    \ combSort(arr);\n        System.out.println(\"Table sorted:\");\n        for\
    \ (int num : arr) {\n            System.out.print(num + \" \");\n        }\n \
    \   }\n    public static void combSort(int[] arr) {\n        int n = arr.length;\n\
    \        int gap = n;\n        double shrink = 1.3; // shrink factor\n       \
    \ boolean swapped = true;\n        while (gap > 1 || swapped) {\n            //\
    \ Apply the reduction factor to the gap\n            gap = (int) (gap / shrink);\n\
    \            if (gap < 1) {\n                gap = 1;\n            }\n       \
    \     swapped = false;\n            for (int i = 0; i + gap < n; i++) {\n    \
    \            if (arr[i] > arr[i + gap]) {\n                    int temp = arr[i];\n\
    \                    arr[i] = arr[i + gap];\n                    arr[i + gap]\
    \ = temp;\n                    swapped = true;\n                }\n          \
    \  }\n        }\n    }\n}\n```\n\nThis example solution in Java implements the\
    \ comb sort algorithm to sort an array of integers. The program starts with a\
    \ large gap between the elements to be compared, then progressively reduces this\
    \ gap using a reduction factor. You can customise the input array to test comb\
    \ sorting with different data sets.\n\n# Statement: Sorting by heap (Heapsort)\
    \ in Java\n\nThe exercise involves writing a Java program that implements the\
    \ heapsort algorithm to sort an array of integers in ascending order. Heapsort\
    \ is a sorting algorithm based on the heap structure, which allows the array to\
    \ be sorted efficiently.\n\n## Part 1 - Statement :\n\nWrite a Java program to\
    \ sort an array of integers using the heap sort algorithm. The algorithm starts\
    \ by creating a heap from the array, then extracts the elements from the heap\
    \ one by one and places them in the sorted array.\n\n## Part 2 - Example of a\
    \ solution in Java :\n\nHere is an example of a solution in Java that uses the\
    \ heap sort algorithm to sort an array of integers:\n\n```java\npublic class HeapSort\
    \ {\n    public static void main(String[] args) {\n        int[] arr = {8, 4,\
    \ 1, 56, 3, 44, 23, 6, 28, 0};\n        heapSort(arr);\n        System.out.println(\"\
    Table sorted:\");\n        for (int num : arr) {\n            System.out.print(num\
    \ + \" \");\n        }\n    }\n    public static void heapSort(int[] arr) {\n\
    \        int n = arr.length;\n        // Create a max heap from the table\n  \
    \      for (int i = n / 2 - 1; i >= 0; i--) {\n            heapify(arr, n, i);\n\
    \        }\n        // Extract elements from the heap one by one\n        for\
    \ (int i = n - 1; i > 0; i--) {\n            // Exchange the root (maximum element)\
    \ with the current element\n            int temp = arr[0];\n            arr[0]\
    \ = arr[i];\n            arr[i] = temp;\n            // Call heapify to reduce\
    \ the size of the unsorted heap\n            heapify(arr, i, 0);\n        }\n\
    \    }\n    public static void heapify(int[] arr, int n, int i) {\n        int\
    \ largest = i;\n        int left = 2 * i + 1;\n        int right = 2 * i + 2;\n\
    \        if (left < n && arr[left] > arr[largest]) {\n            largest = left;\n\
    \        }\n        if (right < n && arr[right] > arr[largest]) {\n          \
    \  largest = right;\n        }\n        if (largest != i) {\n            int temp\
    \ = arr[i];\n            arr[i] = arr[largest];\n            arr[largest] = temp;\n\
    \            heapify(arr, n, largest);\n        }\n    }\n}\n```\n\n# Statement:\
    \ Ternary search in Java\n\nThe exercise involves writing a Java program to implement\
