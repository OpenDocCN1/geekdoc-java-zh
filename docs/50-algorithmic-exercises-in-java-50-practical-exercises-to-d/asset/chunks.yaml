    \            System.out.println(\"Element found at index: \" + result);\n    \
    \    }\n    }\n    public static int ternarySearch(int[] arr, int target) {\n\
    \        int left = 0;\n        int right = arr.length - 1;\n        while (left\
    \ <= right) {\n            int partitionSize = (right - left) / 3;\n         \
