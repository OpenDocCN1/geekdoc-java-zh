    50 algorithmic exercises in JAVA


    Introduction


    Algorithms are at the heart of computer science. It is the art of solving problems
    using sequences of logical instructions. Whether you are a beginner looking to
    master the basics of programming or an experienced developer looking to improve
    your problem-solving skills, this book is designed for you.


    Statement: Bubble sorting in Java


    Write a Java program to sort an array of integers using the bubble sort algorithm.
    The bubble sort algorithm works by comparing and swapping adjacent elements if
    they are in the wrong order, and repeats this process until the whole array is
    sorted.


    You need to code the bubble sort logic in Java and make sure that your program
    works correctly. You can also add comments to explain your code.


    Example of a solution in Java :


    import java.util.Scanner;


    public class TriBubbles {


        public static void main(String[] args) {


            Scanner scanner = new Scanner(System.in);


            System.out.print("Enter the size of the table: ");


            int n = scanner.nextInt();


            int[] array = new int[n];


            System.out.println("Enter the elements of the table:");


            for (int i = 0; i < n; i++) {


                array[i] = scanner.nextInt();


            }


            // Implementation of the bubble sorting algorithm


            for (int i = 0; i < n - 1; i++) {


                for (int j = 0; j < n - 1 - i; j++) {


                    if (array[j] > array[j + 1]) {


                        int temp = array[j];


                        array[j] = array[j + 1];


                        array[j + 1] = temp;


                    }


                }


            }


            System.out.println("Table sorted:");


            for (int i = 0; i < n; i++) {


                System.out.print(array[i] + " ");


            }


        }


    }


    In this example, we have used an array of integers to store the elements, and
    the bubble sort algorithm is implemented inside two for loops. The program asks
    the user to enter the size of the array and the elements of the array, then displays
    the sorted array at the end.


    Statement: Quicksort in Java


    Write a Java program to sort an array of integers using the quicksort algorithm.
    The quicksort algorithm is an efficient sorting algorithm based on the divide-and-conquer
    method. It selects a pivot element, partitions the array into two sub-arrays (elements
    below the pivot and elements above the pivot), then recursively sorts these sub-arrays.


    You need to code the quick sort logic in Java and make sure your program works
    correctly. You can also add comments to explain your code.


    Example of a solution in Java :


    import java.util.Scanner;


    public class QuickSort {


        public static void main(String[] args) {


            Scanner scanner = new Scanner(System.in);


            System.out.print("Enter the size of the table: ");


            int n = scanner.nextInt();


            int[] array = new int[n];


            System.out.println("Enter the elements of the table:");


            for (int i = 0; i < n; i++) {


                array[i] = scanner.nextInt();


            }


            // Call up the quick sort function


            quickSort(array, 0, n - 1);


            System.out.println("Table sorted:");


            for (int i = 0; i < n; i++) {


                System.out.print(array[i] + " ");


            }


        }


        public static void quickSort(int[] arr, int low, int high) {


            if (low < high) {


                int pivotIndex = partition(arr, low, high);


                quickSort(arr, low, pivotIndex - 1);


                quickSort(arr, pivotIndex + 1, high);


            }


        }


        public static int partition(int[] arr, int low, int high) {


            int pivot = arr[high];


            int i = low - 1;


            for (int j = low; j < high; j++) {


                if (arr[j] < pivot) {


                    i++;


                    int temp = arr[i];


                    arr[i] = arr[j];


                    arr[j] = temp;


                }


            }


            int temp = arr[i + 1];


            arr[i + 1] = arr[high];


            arr[high] = temp;


            return i + 1;


        }


    }


    In this example, we have used the quicksort method to sort an array of integers.
    The program asks the user to enter the size of the array and the elements, then
    uses recursion to sort the array.


    Statement: Mergesort in Java


    Write a Java program to sort an array of integers using the merge sort algorithm
    (Mergesort). The merge sort algorithm is based on the "divide and conquer" method
    by dividing the array into two halves, sorting these halves, then merging the
    sorted halves to obtain a sorted array.


    You need to code the fusion sorting logic in Java and make sure that your program
    works correctly. You can also add comments to explain your code.


    Example of a solution in Java :


    import java.util.Scanner;


    public class MergeSort {


        public static void main(String[] args) {


            Scanner scanner = new Scanner(System.in);


            System.out.print("Enter the size of the table: ");


            int n = scanner.nextInt();


            int[] array = new int[n];


            System.out.println("Enter the elements of the table:");


            for (int i = 0; i < n; i++) {


                array[i] = scanner.nextInt();


            }


            // Call the merge sort function


            mergeSort(array, 0, n - 1);


            System.out.println("Table sorted:");


            for (int i = 0; i < n; i++) {


                System.out.print(array[i] + " ");


            }


        }


        public static void mergeSort(int[] arr, int left, int right) {


            if (left < right) {


                int middle = (left + right) / 2;


                mergeSort(arr, left, middle);


                mergeSort(arr, middle + 1, right);


                merge(arr, left, middle, right);


            }


        }


        public static void merge(int[] arr, int left, int middle, int right) {


            int n1 = middle - left + 1;


            int n2 = right - middle;


            int[] leftArray = new int[n1];


            int[] rightArray = new int[n2];


            for (int i = 0; i < n1; i++) {


                leftArray[i] = arr[left + i];


            }


            for (int j = 0; j < n2; j++) {


                rightArray[j] = arr[middle + 1 + j];


            }


            int i = 0, j = 0, k = left;


            while (i < n1 && j < n2) {


                if (leftArray[i] <= rightArray[j]) {


                    arr[k] = leftArray[i];


                    i++;


                } else {


                    arr[k] = rightArray[j];


                    j++;


                }


                k++;


            }


            while (i < n1) {


                arr[k] = leftArray[i];


                i++;


                k++;


            }


            while (j < n2) {


                arr[k] = rightArray[j];


                j++;


                k++;


            }


        }


    }


    In this example, we have used the Mergesort algorithm to sort an array of integers.
    The program asks the user to enter the size of the array and the elements, then
    uses recursion to sort the array by dividing, sorting and merging the sub-arrays.


