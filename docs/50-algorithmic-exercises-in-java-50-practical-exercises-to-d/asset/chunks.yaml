    Statement: Calculating the intersection of two sets in Java


    Write a Java program that calculates the intersection of two sets of integers.
    The user must enter the elements of the two sets, and the program must determine
    and display the elements that are present in the two sets (i.e. the intersection).


    You need to code the logic for calculating the intersection of sets in Java and
    make sure that your program works correctly. You can also add comments to explain
    your code.


    Example of a solution in Java :


    import java.util.Scanner;


    import java.util.HashSet;


    import java.util.ArrayList;


    public class IntersectionOfSets {


        public static void main(String[] args) {


            Scanner scanner = new Scanner(System.in);


            System.out.print("Enter the size of the first set: ");


            int size1 = scanner.nextInt();


            HashSet<Integer> set1 = new HashSet<Integer>();


            System.out.println("Enter the elements of the first set:");


            for (int i = 0; i < size1; i++) {


                set1.add(scanner.nextInt());


            }


            System.out.print("Enter the size of the second set: ");


            int size2 = scanner.nextInt();


            HashSet<Integer> set2 = new HashSet<Integer>();


            System.out.println("Enter the elements of the second set:");


            for (int i = 0; i < size2; i++) {


                set2.add(scanner.nextInt());


            }


            ArrayList<Integer> intersection = findIntersection(set1, set2);


            System.out.println("The intersection of the two sets is: " + intersection);


        }


        public static ArrayList<Integer> findIntersection(HashSet<Integer> set1, HashSet<Integer>
    set2) {


            ArrayList<Integer> intersection = new ArrayList<Integer>();


            for (int num : set1) {


                if (set2.contains(num)) {


                    intersection.add(num);


                }


            }


            return intersection;


        }


    }


