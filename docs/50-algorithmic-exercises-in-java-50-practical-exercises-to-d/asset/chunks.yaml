- fmt: "\nWrite a Java program that allows a user to enter or represent a graph with\
    \ its vertices and edges, and then detects whether it contains cycles.\n\n## Part\
    \ 2 - Example of a solution in Java\n\nHere is an example of a solution in Java\
    \ for detecting cycles in an undirected graph using depth-first search (DFS):\n\
    \n```java\nimport java.util.ArrayList;\nimport java.util.HashSet;\nimport java.util.List;\n\
    import java.util.Set;\n\npublic class GraphCycleDetection {\n    private int V;\
    \ // Number of vertices\n    private List<List<Integer>> adj; // Adjacency list\n\
    \n    public GraphCycleDetection(int vertices) {\n        V = vertices;\n    \
    \    adj = new ArrayList<>(vertices);\n        for (int i = 0; i < vertices; i++)\
    \ {\n            adj.add(new ArrayList<>());\n        }\n    }\n\n    public void\
    \ addEdge(int u, int v) {\n        adj.get(u).add(v);\n        adj.get(v).add(u);\n\
    \    }\n\n    public boolean hasCycle() {\n        Set<Integer> visited = new\
    \ HashSet<>();\n        for (int v = 0; v < V; v++) {\n            if (!visited.contains(v))\
    \ {\n                if (hasCycleUtil(v, -1, visited)) {\n                   \
    \ return true;\n                }\n            }\n        }\n        return false;\n\
    \    }\n\n    private boolean hasCycleUtil(int v, int parent, Set<Integer> visited)\
    \ {\n        visited.add(v);\n        for (int neighbor : adj.get(v)) {\n    \
    \        if (!visited.contains(neighbor)) {\n                if (hasCycleUtil(neighbor,\
    \ v, visited)) {\n                    return true;\n                }\n      \
    \      } else if (neighbor != parent) {\n                return true;\n      \
    \      }\n        }\n        return false;\n    }\n\n    public static void main(String[]\
    \ args) {\n        int V = 4;\n        GraphCycleDetection graph = new GraphCycleDetection(V);\n\
    \        graph.addEdge(0, 1);\n        graph.addEdge(0, 2);\n        graph.addEdge(1,\
    \ 2);\n        graph.addEdge(2, 0);\n        graph.addEdge(2, 3);\n        graph.addEdge(3,\
    \ 3);\n        if (graph.hasCycle()) {\n            System.out.println(\"The graph\
    \ contains a cycle.\");\n        } else {\n            System.out.println(\"The\
    \ graph contains no cycles.\");\n        }\n    }\n}\n```\n\nThis example shows\
    \ how to detect cycles in an undirected graph using depth-first search (`DFS`).\
    \ The program lets you create a graph, add edges and then check for cycles. You\
    \ can customise the graph by adding or modifying edges.\n\n## Sorting optimised\
    \ in Java\n\nThe exercise involves writing a Java program that implements the\
    \ optimised bubble sort to sort an array of integers. Bubble Sort is a simple\
    \ algorithm that traverses the array, comparing neighbouring elements and swapping\
    \ them if necessary to order them correctly. The algorithm continues to traverse\
    \ the array until no swaps are made on a complete pass, indicating that the array\
    \ is sorted.\n\n### Part 1 - Statement\n\nWrite a Java program to sort an array\
    \ of integers using the bubble sort algorithm. Optimised sorting is an improvement\
    \ on classic bubble sorting that stops the sorting process as soon as it detects\
    \ no exchange is necessary during a complete pass.\n\n### Part 2 - Example of\
    \ a solution in Java\n\nHere is an example of a solution in Java that uses the\
    \ optimised bubble sort to sort an array of integers:\n\n```java\npublic class\
    \ BubbleOptimized {\n    public static void main(String[] args) {\n        int[]\
    \ arr = {64, 34, 25, 22, 11, 90};\n        bubbleSort(arr);\n        System.out.println(\"\
    Table sorted:\");\n        for (int num : arr) {\n            System.out.print(num\
    \ + \" \");\n        }\n    }\n\n    public static void bubbleSort(int[] arr)\
    \ {\n        int n = arr.length;\n        boolean swapped;\n        for (int i\
    \ = 0; i < n - 1; i++) {\n            swapped = false;\n            for (int j\
    \ = 0; j < n - i - 1; j++) {\n                if (arr[j] > arr[j + 1]) {\n   \
    \                 int temp = arr[j];\n                    arr[j] = arr[j + 1];\n\
    \                    arr[j + 1] = temp;\n                    swapped = true;\n\
    \                }\n            }\n            if (!swapped) {\n             \
    \   // If no inversion has been performed, the table is already sorted.\n    \
    \            break;\n            }\n        }\n    }\n}\n```\n\nThis example solution\
    \ in Java implements the optimised bubble sort algorithm to sort an array of integers.\
    \ The program takes an array as input, performs the bubble sort and then displays\
    \ the sorted array. You can customise the input to test the bubble sort with different\
    \ data sets.\n\n## Bucket Sort in Java\n\nThe exercise involves writing a Java\
    \ program that implements the Bucket Sort to sort an array of integers in ascending\
    \ order. Bucket Sort is a non-comparative algorithm that divides the elements\
    \ of the array into 'buckets' according to their value, sorts these individually.\
    \ It then combines the sorted buckets to obtain the final array.\n\n### Part 1\
    \ - Statement\n\nWrite a Java program to sort an array of integers using the pigeonhole\
    \ sorting. The program must take into account the range of possible values of\
    \ the integers to distribute the elements into the drawers.\n\n### Part 2 - Example\
    \ of a solution in Java\n\nHere is an example of a solution in Java that uses\
    \ the pigeonhole sorting to sort an array of integers:\n\n```java\nimport java.util.ArrayList;\n\
    import java.util.Collections;\nimport java.util.List;\n\npublic class BucketSort\
    \ {\n    public static void main(String[] args) {\n        int[] arr = {64, 34,\
    \ 25, 22, 11, 90, 85};\n        bucketSort(arr);\n        System.out.println(\"\
    Table sorted:\");\n        for (int num : arr) {\n            System.out.print(num\
    \ + \" \");\n        }\n    }\n\n    public static void bucketSort(int[] arr)\
    \ {\n        int min = arr[0];\n        int max = arr[0];\n        int n = arr.length;\n\
    \        // Find the minimum and maximum values in the table\n        for (int\
    \ i = 1; i < n; i++) {\n            if (arr[i] < min) {\n                min =\
    \ arr[i];\n            } else if (arr[i] > max) {\n                max = arr[i];\n\
    \            }\n        }\n        int range = max - min + 1;\n        // Create\
    \ buckets\n        List<List<Integer>> buckets = new ArrayList<>(range);\n   \
    \     for (int i = 0; i < range; i++) {\n            buckets.add(new ArrayList<>());\n\
