    then uses a loop to insert each unsorted element in its correct position among
    the sorted elements. This operation is repeated until the entire array is sorted.


    Statement: Binary search in Java


    Write a Java program that performs a binary search in a sorted array of integers.
    Binary search is an efficient algorithm that searches for an element in a sorted
    array by recursively dividing the array into two parts and comparing the element
    searched for with the element in the middle. If the element searched for is equal
    to the element in the middle, the algorithm returns the position of this element
    in the array. Otherwise, the algorithm reduces the search to the half of the array
    in which the element could be found.


    You need to code the binary search logic in Java and make sure that your program
    works correctly. You can also add comments to explain your code.


    Example of a solution in Java :


    import java.util.Scanner;


    public class BinarySearch {


        public static void main(String[] args) {


            Scanner scanner = new Scanner(System.in);


            System.out.print("Enter the size of the sorted array: ");


            int n = scanner.nextInt();


            int[] array = new int[n];


            System.out.println("Enter the elements of the sorted array (in ascending
    order):");


            for (int i = 0; i < n; i++) {


                array[i] = scanner.nextInt();


            }


            System.out.print("Enter the item to search for: ");


            int elementSearch = scanner.nextInt();


            int position = binarySearch(array, elementSearch);


            if (position != -1) {


                System.out.println("The element " + elementSearch + " has been found
    at position " + position + " in the array.");


            } else {


                System.out.println("The element " + elementSearch + " was not found
    in the array.");


            }


        }


        public static int binarySearch(int[] arr, int target) {


            int left = 0;


            int right = arr.length - 1;


            while (left <= right) {


                int mid = left + (right - left) / 2;


                if (arr[mid] == target) {


                    return mid;


                }


                if (arr[mid] < target) {


                    left = mid + 1;


                } else {


                    right = mid - 1;


                }


            }


            return -1;


        }


    }


    In this example, we have used the binary search algorithm to find an element in
    a sorted array. The program asks the user to enter the size of the sorted array,
    the elements of the array and the element to be searched for. It then performs
    the binary search to find the element and displays its position if it is found,
    or indicates if it has not been found.


