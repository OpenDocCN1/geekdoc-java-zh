    contains any duplicates. If an element cannot be added to the set (because it
    is already present), the program concludes that there are duplicates. Otherwise,
    it displays that all the elements are unique.


    Statement: Merging two sorted arrays in Java


    Write a Java program that merges two sorted arrays into a single sorted array.
    The user must enter the size of the two arrays and their elements, and the program
    must merge the two arrays so that the resulting array is also sorted.


    You need to code the logic for merging the two sorted arrays in Java and make
    sure that your program works correctly. You can also add comments to explain your
    code.


    Example of a solution in Java :


    import java.util.Scanner;


    public class SortedArrayMerger {


        public static void main(String[] args) {


            Scanner scanner = new Scanner(System.in);


            System.out.print("Enter the size of the first array: ");


            int size1 = scanner.nextInt();


            int[] array1 = new int[size1];


            System.out.println("Enter the elements of the first sorted array:");


            for (int i = 0; i < size1; i++) {


                array1[i] = scanner.nextInt();


            }


            System.out.print("Enter the size of the second array: ");


            int size2 = scanner.nextInt();


            int[] array2 = new int[size2];


            System.out.println("Enter the elements of the second sorted array:");


            for (int i = 0; i < size2; i++) {


                array2[i] = scanner.nextInt();


            }


            int[] mergedArray = mergeSortedArrays(array1, array2);


            System.out.println("The sorted result table is:");


            for (int num : mergedArray) {


                System.out.print(num + " ");


            }


        }


        public static int[] mergeSortedArrays(int[] array1, int[] array2) {


            int size1 = array1.length;


            int size2 = array2.length;


            int[] result = new int[size1 + size2];


            int i = 0, j = 0, k = 0;


            while (i < size1 && j < size2) {


                if (array1[i] < array2[j]) {


                    result[k++] = array1[i++];


                } else {


                    result[k++] = array2[j++];


                }


            }


            while (i < size1) {


                result[k++] = array1[i++];


            }


            while (j < size2) {


                result[k++] = array2[j++];


            }


            return result;


        }


    }


    In this example, we''ve used a mergeSortedArrays function to merge two sorted
    arrays into one resulting sorted array. The program asks the user to enter the
    size and elements of the two sorted arrays, then uses the mergeSortedArrays function
    to perform the merge. The result is then displayed. The merge is performed by
    comparing the elements of the two arrays and placing the smaller one in the resulting
    array, and so on until all the elements have been merged.


    Statement: Calculating the cumulative sum of an array in Java


    Write a Java program that calculates the cumulative sum of an array of integers.
    The cumulative sum is an array in which each element is the sum of all the previous
    elements of the original array, including itself. The user must enter the size
    of the array and its elements, and the program must calculate and display the
    cumulative sum array.


    You need to code the calculation logic for the cumulative sum table in Java and
    make sure that your program works correctly. You can also add comments to explain
    your code.


    Example of a solution in Java :


    import java.util.Scanner;


    public class CumulativeSumCalculator {


        public static void main(String[] args) {


            Scanner scanner = new Scanner(System.in);


            System.out.print("Enter the size of the table: ");


            int size = scanner.nextInt();


            int[] array = new int[size];


            int[] cumulativeSum = new int[size];


            System.out.println("Enter the elements of the table:");


            for (int i = 0; i < size; i++) {


                array[i] = scanner.nextInt();


            }


            calculateCumulativeSum(array, cumulativeSum);


            System.out.println("The cumulative sum table is:");


            for (int num : cumulativeSum) {


                System.out.print(num + " ");


            }


        }


        public static void calculateCumulativeSum(int[] input, int[] output) {


            int sum = 0;


            for (int i = 0; i < input.length; i++) {


                sum += input[i];


                output[i] = sum;


            }


        }


    }


    In this example, we have used the calculateCumulativeSum function to calculate
    the cumulative sum table. The program asks the user to enter the size of the array
    and the elements of the array, then uses the calculateCumulativeSum function to
    calculate the cumulative sum. The cumulative sum array is displayed at the end,
    where each element is the sum of all the previous elements, including itself.


