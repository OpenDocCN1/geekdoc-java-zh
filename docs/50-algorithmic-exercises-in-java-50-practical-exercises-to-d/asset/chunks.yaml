    Statement: Comb Sort in Java


    The exercise involves writing a Java program that implements the Comb Sort algorithm
    to sort an array of integers in ascending order. Comb Sort is a variation of Bubble
    Sort that swaps elements at a fixed distance instead of swapping adjacent elements,
    making it more efficient.


    Part 1 - Statement :


    Write a Java program to sort an array of integers using the comb sort algorithm.
    Comb sorting starts with a large gap between the elements to be compared, then
    progressively reduces this gap until it reaches zero, thus carrying out comparisons
    and exchanges efficiently.


    Part 2 - Example of a solution in Java :


    Here is an example of a solution in Java that uses the comb sort algorithm to
    sort an array of integers:


    public class CombSort {


        public static void main(String[] args) {


            int[] arr = {8, 4, 1, 56, 3, -44, 23, -6, 28, 0};


            combSort(arr);


            System.out.println("Table sorted:");


            for (int num : arr) {


                System.out.print(num + " ");


            }


        }


        public static void combSort(int[] arr) {


            int n = arr.length;


            int gap = n;


            double shrink = 1.3; // shrink factor


            boolean swapped = true;


            while (gap > 1 || swapped) {


                // Apply the reduction factor to the gap


                gap = (int) (gap / shrink);


                if (gap < 1) {


                    gap = 1;


                }


                swapped = false;


                for (int i = 0; i + gap < n; i++) {


                    if (arr[i] > arr[i + gap]) {


                        int temp = arr[i];


                        arr[i] = arr[i + gap];


                        arr[i + gap] = temp;


                        swapped = true;


                    }


                }


            }


        }


    }


    This example solution in Java implements the comb sort algorithm to sort an array
    of integers. The program starts with a large gap between the elements to be compared,
    then progressively reduces this gap using a reduction factor. You can customise
    the input array to test comb sorting with different data sets.


