    # The Cretaceous super-greenhouse


    The geological record demonstrates unequivocally that the Earth has been in super-greenhouse
    episodes several times in the past. During the early Eocene, 49–54 million years
    ago (just after the PETM discussed in Chapter 5), global temperatures averaged
    around 29°C, nearly 15°C higher than the pre-industrial temperature of 14.4°C.
    The PETM itself was probably a couple of degrees warmer still. But earlier time
    periods during the Cretaceous, famous as the last part of the age of the dinosaurs,
    were possibly hotter than that. The Cretaceous Thermal Maximum, for example, was
    the hottest globe has been since the evolution of complex life half a billion
    years ago. It saw sea-surface temperatures at high southern latitudes around 6°C
    warmer than the PETM. That might imply global average temperatures in the region
    of 20°C warmer than the pre-industrial period. This was a world where the ocean
    was as warm as 27°C in the sub-Antarctic, and champosaurs (a crocodile-like reptile)
    snapped their way around the high Arctic. As with other super-greenhouse episodes,
    the likely driver was the eruption of so-called ‘large igneous provinces’, gigantic
    emplacements of magma that de-gassed prodigious quantities of CO₂, as they spilled
    out from the Earth’s mantle over many tens of thousands of years.


    So why fret about what is by comparison a minor six-degree rise this century?
    Clearly, if the world has previously seen twenty degrees hotter, we can emit lot
    more CO without needing to worry about entering some unknown danger zone? On closer
    examination, however, the Cretaceous super-greenhouses were not exactly idyllic.
    They are typically generalised by super-heated, oxygen-starved, dead oceans; hence
    their alternative name – ‘oceanic events’. Taking place about 94 million years
    ago, the Cretaceous Thermal Maximum also has another name: ‘Oceanic Oceanic Event
    2’ (OAE 2). It devastated marine ecosystems, notably leading to the extinction
    of ichthyosaurs, fish-shaped seagoing reptiles that had dominated the oceans as
    apex predators for millions of years.'
