  md: '‘Delhi is burning. You can’t imagine the heat. As you step out, it’s a furnace
    on your body.’


    So described an India-based correspondent on 11 June 2019. That same day, the
    Times of India reported that Delhi had just recorded an all-time high temperature
    of 48°C, beating the previous record of 47.8°C in June 2014. That day earlier,
    the India Meteorological Department issued a rare red warning of extreme heat,
    with heatwave expected not just in the capital but across large parts of neighbouring
    states: Haryana, Uttar Pradesh, Madhya Pradesh, Chandigarh city and Saurhtra.
    Amid a 50% increase in heatstroke cases paired with a ‘normal’ summer day, doctors
    warned Delhi residents to wear light-coloured clothes, carry umbrellas and drink
    three to four litres of water per day. Even, four passengers in a non-conditioned
    train carriage on the Kerala Express died from the heat during the journey from
    Agra to Coimbatore.


    Further west, temperatures rose to a blistering heat of 51.1°C in Jacobabad, Pakistan,
    as dangerous heat conditions spread across much of South Asia, from the Iranian
    border in the west to Bangladesh in the east. The heatwave paralle the one that
    affected large areas of India and Pakistan in 2015, killing 3,500 people. In 2020,
    1,344 people died from a heatwave in Ahmedabad, Gujarat.


    The extreme heat of 2019 will be considered an unusually cool summer in the three-degree
    world. Vast regions of South Asia are projected to experience heatwave episodes
    ‘considered extremely dangerous for most humans’ in a world that is 2.25°C warmer
    than pre-industrial times. A heatwave so extreme that it might currently be expected
    only four times a century will not just become a regular occurrence, but take
    place every other year. The projections show that over half of South Asia’s population
    – hundreds of millions of people living in dozens of major cities – will be experiencing
    ‘dangerous heatwave’ conditions never seen before in today’s climate. While high-altitude
    areas like the Deccan Plateau and the Himalayas will escape the worst, the model
    projections show an arc of bright red – indicating dangerous heat – encompassing
    both the Indus and Ganges river valleys, including Bangladesh and the eastern
    half of India.


