  md: 'At five degrees we are approaching the end of life on Earth as we know it.
    The poles are in meltdown, and complex human societies have long since passed
    the point of collapse. For the natural world, the impacts are if anything ever
    devastating. Moving 5,000 kilometres towards the poles, as would be required for
    species to track the shift in climate zones implied by the PETM, requires a ‘climate
    velocity’ of about 62 kilometres a year, or 170 metres a day. It goes without
    saying that few plants can broadcast seeds and reproduce themselves sufficiently
    to move at such a speed. Moreover, you cannot just roll a rainforest like a piece
    of carpet and transport thousands of kilometres to the north or south. Ecosystems
    are incredibly complex, with interconnections, mutual and dependencies at every
    level in the food chain. Predator-prey relationships, the dependencies of plants
    on insect pollinators and fruit and seed dispersers, the fungi and micro-organisms
    that enable plants to thrive–all this complex will be fragmented and torn apart.
    The PETM avoided a major land-based mass extinction species were able to shift
    over many millennia across an entirely wild planet. This time the Earth will not
    be lucky.


    There are a few species models that aim to estimate the impacts of five degrees
    on wild species. In March 2018 Rachel Warren and colleagues published a paper
    in Nature comparing the biodiversity impacts of 1.5 versus 2°C of warming, but
    also examining the effects of higher levels of global heating. Their results show
    a linear relationship between degrees of warming and biodiversity impacts that
    is likely to be conservative given the wholesale unravelling of ecosystems implied
    by rapid climate change, as the authors themselves point out. So, and colleagues’
    results show that insects, plants, mammals, birds, reptiles and amphibians lose
    half and two-thirds of their climatic range in a 4.5°C warming scenario. This
    is surely a mass extinction by any other name.


    Returning to a geological perspective, in 2017 Daniel Rothman published a paper
    in Science with the ominous title ‘Thresholds of catastrophe in the Earth system’.
    As he explains, five times during the Phanerozoic (the past 542 million years)
    the planet has been struck by mass extinctions that killed more than three-quarters
    of marine animal species, and many more on land. Rothman writes: ‘Each of these
    events is associated with a significant'
  merge: -1
