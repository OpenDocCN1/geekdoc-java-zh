    according to a 2017 paper published in Nature Change. For a three-degree planet,
    that means 12 million square kilometres thaw – out of a current initial total
    of only 15 million, meaning that nearly three-quarters of the globe''s inventory
    of permafrost will be turned to mush as temperatures rise to three degrees. This
    will release upwards of 100 billion tonnes of carbon by the end of the century
    – boosting global warming by a further two-tenths of a degree by 2100 and still
    more thereafter.


    And it gets worse. Not all the thawing permafrost will be released as CO₂. Some
    will bubble out as methane, with a global warming potential 30–40 times as powerful
    as CO₂. Huge quantities of methane lie trapped in underwater deposits in the ocean
    shelves over Siberia, where sea temperatures have already risen by two degrees
