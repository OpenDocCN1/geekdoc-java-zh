    # Hyperthermal hothouses


    As we enter the five-degree world, we have now made the planet hotter than at
    any point for over 50 million years. The closest geological analogue for our new
    super-greenhouse climate is a ‘hyperthermal’ event that took place at the boundary
    of the Palaocene and Eocene epochs, about 56 million years ago, when the planet’s
    temperature rose between five and nine degrees alongside CO2 levels of 1,000–2000
    ppm. The Palaocene–Eocene Thermal Maximum (PETM) has long provoked interest among
    climate scientists because it closely parallels the world we will be heading into
    if we continue to rapidly increase our consumption of fossil fuels. This was an
    inhospitable and violent world, barely recognisable from the Earth humans have
    always known.


    If you want to stand right at the PETM boundary one of the best places to do sits
    part up a dusty valley on the Spanish side of the Pyrenean foothills. Just outside
    the pretty village of Arén, you cross a concrete bridge over the main highway,
    over a small river that marks the border between the provinces of Aragon and Catalonia.
    Travel up an unremarkable valley on an asphalt road that later gives way to a
    gravel track. The valley floor has some tilled land but the hillsides are all
    scrub,'
