    thanks to the increase in shipping traversing the newly open Northern Passage.
    The rapid warming affects the oceans, with Arctic fish species retreating north
    towards the pole as Atlantic and Pacific migratory fish move in.


    These ecological shifts can have tragic effects. For example, the summer sea edge
    has retreated 400 km further away from the nesting grounds of the black guillemot
