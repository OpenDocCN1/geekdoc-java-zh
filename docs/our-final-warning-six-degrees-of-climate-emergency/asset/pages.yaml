    # Tipping point in the Antarctic


    It is not just the Arctic. Current surveys have shown the Antarctic sea ice is
    in what scientists call ‘precipitous’ decline, with ‘decreases at rates exceeding
    the rates seen in the Arctic’, according to a PNAS paper published in July 2019.
    The sudden drop was particularly notable because it reversed a general increase
    in Antarctic sea ice that had been tracked by satellites over the last 40 years.


    Even the cautious IPCC warns that a potentially disastrous Antarctic tipping point
    may lie somewhere in the two-degree world. In 2018 report on 1.5°C, it states:
    ‘The threshold of global temperature increase that may initiate irreversible loss
    of the West Antarctic ice sheet and marine ice sheet instability (MISI) is estimated
    to lie between 1.5°C and 2°C.’ The West Antarctic Ice Sheet (WAIS) is cited as
    particular concern because it is mostly grounded below sea level, so a collapse
    could become self-sustaining once the grounding line crosses. Warm oceans would
    then penetrate hundreds of kilometres into the Antarctic interior, fragmenting
    the entire continental ice sheet and ultimately delivering – alongside East Antarctica
    and Greenland – more than five metres of sea-level rise. None of today’s coastal
    megacities could survive'
