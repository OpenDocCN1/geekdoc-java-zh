  md: '# Dust and fire


    Brian Allen had only been in Arizona two weeks when the symptoms began. His family
    of three had moved to Phoenix in April 2018 to start a new life, but had little
    time to enjoy the sun. ‘As soon as he got the job here he got sick,’ recalled
    his lifelong partner Franique, whom he had been with for 13 years. ‘He was experiencing
    headaches … and chills.’ By the time Brian was admitted to ER he had stopped recognising
    his family, including his young son Kal’el. He died on 2 June, less than two weeks
    after the headaches began. Franique does what she can to console her young son,
    but ‘Kal’el just wants his daddy to come back.’


    Neither Franique nor Brian had ever heard of valley fever when they first went
    to Phoenix. But the likely source of the infection was clear. ‘He was working
    and he was caught in a dust storm and inhaled the fungus in the air and it to
    his lungs,’ says Franique in a matter of fact way. Valley fever is a fungal infection
    caused by airborne spores that are lifted out of the arid desert soils in dust
    and transmitted long distances before being breathed in and lodging in the lungs.
    Most cases are mild, involving – as Brian Allen first experienced – fever, fatigue,
    headaches and chills. On rarer occasions the more serious form of the disease,
    disseminated coccidioidcosis, can occur as the fungus spreads beyond the lungs
    into the bones, liver, brain and heart. If the fungus causes pneumonia, meningitis
    or other complications, it can be fatal.


    Although valley fever has been around for a long time, its incidence increased
    eightfold in endemic areas – Arizona, California, Nevada, New Mexico and Utah
    – between 1998 and 2011. Scientists report a strong correlation between dust events
    and outbreaks of the disease, especially in the ‘Valley’ area of metropolitan
    Phoenix where fungal coccidioidomy is at its most severe. This is a serious concern
    because perennial drought in the south-western United States is helping to drive
    an extraordinary increase in airborne dust, which blankets towns and cities every
    summer when the monsoon arrives. The average number of dust storms has risen by
    240%, from 20 storms a year in the late 1980s to nearly 50 in the decade before
    2011. With dramatic drying and warming predicted for the southern and western
    United States in a four-degree scenario, valley fever will spread'
  merge: -1
  pgno: 155
- img_proc: true
  md: 'rapidly throughout the whole region east of the Rockies, even pushing up to
    the Canadian border and encompassing 17 states.


