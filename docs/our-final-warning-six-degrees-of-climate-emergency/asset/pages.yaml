    # A two-degree tipping point?


    So where did the PETM hothouse come from? Obviously there were no humans 55 million
    years ago burning coal in power stations and oil in cars. Scientists are not entirely
    sure about the source of the sudden and massive pulse of carbon, but there are
    several leading hypotheses. PETM-dated rocks have all a clear isotopic carbon
    signature, showing that vast amounts of CO₂ – perhaps accompanied by methane –
