    # An ice-free Arctic Ocean'
  merge: -1
  pgno: 144
- img_proc: true
  md: 'And that is not all. A more direct potential positive feedback also lies in
    the Arctic, but not on land – instead this drastic acceleration of the warming
    process operates out in the ocean. Most studies agree that a three-degree world
    sees permanent summertime ice-free conditions in the Arctic Ocean, perhaps as
    soon as mid-century. While the average September becomes ice-free early as August
    and October also see open water across the North Pole by 2070. This means that
    the only permanent, all-year ice left in the Arctic will be small areas attached
    to the land masses of northern Greenland and the Canadian Arctic archipelago,
    and even they won''t last into the second half of the century.


    The impact on the ecology of the Arctic will be disastrous, with polar bears forced
    to starve or on swim distances to chase drifting slush ice floes. The populations
    of bears – along with other ice-dependent animals like walrus, bowhead whales,
    numerous different species of fish, seal and seabirds – will be herded into a
    diminishing polar refuge in still, frozen areas for longer and longer periods
    of the year. With survival prospects dimming for each generation of pups, calves,
    cubs and extinction, in the wild looms for all Arctic species unfortunate to have
    evolved to be dependent on this vanishing sea habitat. After coral reefs and Amazon,
    this is the third globally significant ecological collapse in our hotter world.


    The effects of the loss of the Arctic cap ricochet around the planet as increasing
    climate chaos. With open water extending across virtually the entire polar ocean,
    huge amounts of heat are captured from the sun during the ice-free summer months
    (water absorbs six times as much solar heat as sea ice). This energy is released
    as warmth and moisture during the winter, transforming storm tracks across the
    mid and high latitudes, changing centres of high and low pressure, and even displacing
    the jet stream. Most importantly of all, this disappearance of white snow and
    ice changes the albedo and consequently the energy balance of the entire planet.
    With less solar radiation being reflected back into space by highly reflective
    polar ice, of the Sun’s heat is retained by the darker-coloured land and ocean
    and recirculated within the Earth system.


    The magnitude of this additional heat is no mystery, because it is already being
    monitored by scientific instruments. Satellites orbiting the Earth above the North
    Pole can directly measure the energy budget at the top of'
  merge: -1
  pgno: 145
- img_proc: true
  md: 'the atmosphere over the newly ice-free areas that have already appeared in
    our one-degree world. Extrapolate this additional heat over the whole polar ocean
    – as scientists did in a Geophysical Research Letters paper published in June
    2019 – and it is possible to generate a figure for the additional energy that
    will be absorbed by the whole planet in the event of a complete loss of Arctic
    sea ice. This adds up to about 0.7 watts per square metre of extra heat. That
    might not sound like much, but it yields an equivalent planetary heating effect
    to one trillion tonnes of CO2 emissions, on top of the 2.4 trillion tonnes that
    have already been released by humans since the pre-industrial period. This in
    turn is equivalent to fast-forwarding global warming by about 25 years.


    The scientists are not suggesting that this scenario will play out the instant
    Arctic Ocean sees its first ice-free September. To fully absorb this amount of
    new solar heat, the Arctic needs to be ice-free all the way through mid-March
    to the end of September, which most models do not simulate until global warming
    reaches five degrees or more. However, the scientists start by pointing out that
    the models are wrong on Arctic sea ice, and that observed rates of melt are already
    double those predicted by existing simulations. This suggests that ice-free conditions
    could come earlier and for longer in the year than is foreseen in conventional
    projections. Even half this amount of extra energy – equivalent to an additional
    500 billion tonnes of CO2 – would be disastrous.


    Add these positive feedbacks together – the permafrost, the methane, the Amazonian
    carbon, the additional heat captured by the ice-free Arctic – and it is clear
    that entering the three-degree world risks pushing the global heating process
    beyond humanity’s control. This could happen even in the event that we successfully
    reduce fossil fuel emissions substantially in future decades. Having said that,
    if we keep on increasing our carbon consumption in line with business-as-usual
    projections, another degree of global heating is virtually guaranteed, even without
    positive feedbacks. Maybe it is worth taking a look, therefore, at what the four-degree
    world has in store.'
