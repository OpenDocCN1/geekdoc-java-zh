  md: 'As well as the probable increase in the number of the strongest storms bringing
    heavier rainfall – and the potential for the emergence of Category 6 super-hurricanes
    – another area of concern is the possible widening geographic extent of tropical
    cyclones. These currently only form close to the tropics, as sea-surface temperatures
