  md: 'The other leading contender was proposed by Robert DeConto and colleagues in
    a much-cited 2012 paper in Nature. They began restating that the ‘PETM is characterized
    by a massive input of carbon, ocean acidification and an increase of global temperature
    of about 5°C within a few thousand years’. They then suggested that gradual warming
    forced the Earth over a threshold that led to the sudden release, not of oceanic
    methane hydrates but of enormous amounts of CO2 from melting permafrost in polar
    regions. This threshold could have triggered the release of as much three trillion
    tonnes of carbon from these sources, DeConto and colleagues calculated. The guilty
    permafrost was not only in the Arctic, but also in the interior of the Antarctic
    continent, which lacked any ice sheets but was probably cold enough for tundra
    and peat to form carbon-rich permafrost over vast areas, as seen in Siberia and
    Arctic Canada today. The theory remains controversial, least not because evidence
    of Palaeogene-aged permafrost carbon has been found in Antarctica. The dispute
    may not be resolved, given that all the entire continent sits within kilometres
    of ice, making investigations of its bedrock challenging to say the least.


    Whatever the relative contributions of thawing peat, bubbling methane hydrates
    or something else, the current scientific consensus is that not only was the PETM
    a sudden and extreme greenhouse episode, but that its onset was also triggered
    quite rapidly by the crossing of some kind of climatic threshold or tipping point.
    Scientists looking at sedimentary records have found characteristic signatures
    suggesting that the Earth system was becoming destabilised by gradual warming
    just prior to the crossing of this tipping point. As Joost Frieling and colleagues
    wrote in April 2019, whatever the specific sources of the additional carbon, all
    the evidence strongly suggests a scenario of positive feedbacks’. Most alarming
    of all is the likely magnitude of the pre-existing long-term temperature rise
    that is thought to have triggered the geologically sudden catastrophe of the PETM
    – an estimated two degrees of global warming. Frieling and his co-authors pointed
    out that ‘these results ... may warrant reconsideration of the political assignment
    of 2°C warming as a safe future scenario.’


    Similar positive feedback cascades, albeit with less profound heating than for
    the PETM, are observed in other later hyperthermal events in the Eocene. For example,
    the Eocene Thermal Maximum 2, which took place'
