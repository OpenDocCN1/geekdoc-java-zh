  md: '# Acknowledgements


    This book leans on the expert work of many people, first and foremost the climatologists
    and other scientific experts who have produced such a detailed, rigorous and voluminous
    literature about the past, present and future of our planet''s climate. I am hugely
    in their debt, and am am aware that a small-print reference at the back of this
    book seems like small thanks for extensive use I have made of their work. I don''t
    expect everyone to agree with the way I have compiled and presented this data,
    but I hope that at least some of those referred feel like I have done their efforts
    justice.


    I would not have felt prompted to write this book had it not been for the many
    people who have emailed and tweeted me the years since the first Six Degrees was
    published, asking for an update. Obviously I can''t mention individuals, except
    for Diletta Cateni from Pisa, Italy, while those corresponding on Facebook gave
    me the ‘final warning’ suggestion for the subtitle – which then became the title
    of this new edition. This does in some ways feel like a community enterprise!


    I am also very indebted to Cornell University, and all at the Cornell Alliance
    for Science – Sarah Evangelance, Joan Conrow, Vanessa Greenlee the whole team
    – for support, academic facilities and, and the daily reminder of how important
    it is to fight for science in all areas those who would attack and undermine truth
    and evidence-based thinking in the service of their ideologies.


    I''m also very grateful to everyone who has helped and supported me in Hay-on-Wye,
    where most of this book was written. That list includes everyone at the Hay Festival,
    the staff of Shepherds (purveyors of the best coffee anywhere on the Welsh borders),
    others in our office – Finn Beales, Scott Wallace, Claire Purcell and Emma Beagle
    – as well as Andy Fryers, Mel Newton, Paul and Dundy from Cadwgan Farm, Corin
    and the Burgess family, Pat Stirling and our local rewilding group, our new Hay'
  merge: -1
  pgno: 248
- img_proc: true
  md: 'Ultimate frisbee team and everyone on Broadmead Lane. I''m especially grateful
    to George Monbiot and Rebecca Wrigley, not just for enduring friendship, but for
    their positive vision of rewilding even in an age of climate breakdown.


    I have been fortunate to have a superb, knowledgeable and attentive editor in
    Nicholas Pearson, and am grateful to 4th Estate for taking on this second edition
    of Six Degrees after having made a success of the first. Thanks are also due to
    Iain Hunt, who worked tirelessly to improve the rather too meaty first drafts
    of this book and make it more readable, as well as Anthony Hippisley for proofreading.
    I have been with my agent Anthony Harvey my whole career as a writer: there is
    really no one.


    I know it is a cliché, but I truthfully couldn''t have written this book without
    daily support and love from my family. My children Tom and Rosa, who were small
    when the first edition was written, are now as engaged and opinionated on this
    subject as they should be young people whose future is really on the line. My
    godsons Didier and Alex Delgorge have also been an inspiration. My parents Bry
    and Val Lynas and my siblings Jenny, Richard and Suzanne have always been enthusiastic
    and engaged. Most of my wonderful wife Maria, who urged me to take a step back
    from regular work and focus on writing this book, deserves my thanks and appreciation.
    In many ways this has been a joint endeavour.


    Many moons ago I used to be a Cub Scout, and I recall that the Scouts had a phrase
    – ‘Be Prepared’ – that is in some ways an apt motto for the book. I hope this
    new Six Degrees helps its readers prepare for a hotter future, and also that it
    inspires people to take renewed action to cut emissions and thereby avoid the
    kind of devastation that is detailed in the later chapters. Love endures, and
    so does hope.'
