  md: '# Foreword


    When I started writing this book I thought that we could probably survive climate
    change. Now I am not so sure. As you will read in these pages, we are already
    living in a world one degree warmer than that inhabited by our parents and grandparents.
    Two degrees Celsius, which will stress human societies and destroy many natural
    ecosystems such as rainforests and coral reefs, looms on the near horizon. At
    three degrees I now believe the stability of human civilisation will be seriously
    imperiled, while at four degrees a full-scale global collapse of human societies
    is probable, accompanied by a mass extinction of the biosphere that will be the
    worst on Earth for tens or even hundreds of millions of years. By five degrees
    we will see massive feedbacks coming into play, driving further warming and climate
    impacts so extreme that they will leave most of the globe biologically uninhabitable,
    with humans reduced to a precarious existence in small refuges. At six degrees
    we risk triggering a runaway process that could render the biosphere completely
    extinct and for ever destroy the capacity of this planet to support life.


    In the Paris Agreement signed in 2015, world leaders vowed to hold global temperature
    rise to 1.5°C, or failing, 2°C. So far they have entirely to keep their promises.
    To meet the 1.5°C target we would have had to cut emissions by nearly half within
    a decade, and reach net zero by mid-century. Instead, emissions have reached a
    recordsetting every year since the agreement. Many countries have offered ‘Paris
    pledges’, but if these were to be fully complied with, their combined effect on
    emissions is so trivial that they would still take us headlong into the four-degree
    world. That is why I wanted to write a completely new, fully updated version of
    Six Degrees, my book that first published in 2007, because while the world’s scientists
    have done an amazing job in conducting research and writing papers over the last
    two'
  merge: -1
  pgno: 7
- img_proc: true
  md: 'decades, somehow the full import of the science has failed to register on our
    political system. Each chapter of this book makes abundantly clear every successive
    degree-by-degree rise in temperature will mean for human society and the planet’s
    natural systems. The situation has become desperately urgent, and nobody who reads
    this will be able to say they didn’t know what was coming.


    Even as I was writing this book, I could see the climate emergency continuing
    to escalate. When I began, Australia was still a normal country. Following the
    devastating wildfires of January 2020, which themselves recorded record-breaking
    high temperatures that a drought-stricken nation, no longer is. Millions of Australians
    endured weeks of living under a pall of smoke, as 12 million hectares of bush
    and farmland were incinerated in catastrophic mega-fires. The human death toll,
    currently standing at 33, is tragic enough. But spare a thought for the estimated
    billion animals that have lost their lives. And remember that there can be no
    return to normal. Normal has gone, for.


    I can’t tell you with any precision when the globe will reach different temperature
    levels in the future. This is not so because the science is uncertain – although
    to an extent it is – because the rapidity of warming this century will depend
    on decisions yet to be made about how far and fast carbon emissions continue to
    rise. If we stay on the current business-usual trajectory, we could see two degrees
    as soon as the early 2030s,three degrees around mid-century, and four degrees
    by 2075 or so. If we’re unlucky with positive feedbacks (or later in this book)
    from thawing permafrost in the Arctic or collapsing rainforests, we could be in
    five or even six degrees by the century’s end. On the other hand, if politicians
    make serious and determined efforts to implement the Paris targets, with the United
    States coming back into the fold as part of that effort, we can still hold off
    two degrees until the latter part of the century, and stop three or higher temperature
    rises from ever happening all.


    As to which of these two outcomes is more likely, I am sorry to say that I am
    now substantially pessimistic about the future than when Six Degrees was first
    published. Back then I believed that if enough people could be better informed
    about the reality of climate change, then surely the world would have been moved
    to act. While there have been positive'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'shifts, such as declining coal use in some countries and cheaper renewable
    energy, these are dwarfed both by rising emissions and an alarming trend towards
    denialism. By this I don’t just mean the overt climate denial of some US politicians
    stupid pretend to call global warming a ‘hoax’ on Twitter. Nor I am simply referring
    to the populist backlash that seriously threatens liberal democratic values and
    has brought the political far back into international ascendancy for the first
    time since the defeat of Hitler. (2007 already seems a much gentler world.) I’m
    talking, in addition, about the kind of denial that we all practise, the ‘imatory
    denial’ of climate change that allows us to keep on living our lives as usual
    the obvious implications of what climate scientists are telling us. It’s as if
    we don’t really believe them.


    After all, it’s still possible – just to pretend that the world isn’t warming,
    or that the rate of change is nothing exceptional, or that the warming we see
    could be the result of ‘natural cycles’ or of such. Even the UN’.. its 2014 report,
    IPCC experts stated that rising greenhouse gas concentrations in the atmosphere
    due to human activity are only ‘extremely likely’ to be the dominant cause of
    observed warming since the mid-20th century. In IPCC-speak, ‘extremely likely’
    translates to a precise numerically quantified of 95–100% probability. So yes,
    that does allow for a 5% probability that climate change is either natural orineplicable
    with current knowledge. However, in 2019 a team of scientists re-evaluated the
    possibilities. Looking at three datasets of atmospheric temperatures combined
    with climate model outputs, they concluded that there is only a 1 in 3.5 million
    chance that current global warming is natural. That translates into about a 0.00003%
    chance that the US Republican Party wistfully conclude:

    ‘Humanity cannot afford to ignore such clear signals.’


    I agree, and the task I set myself in writing this book was to make the science
    so that nobody will have any excuse for ignoring it. I have spent years combing
    through long-forgotten issues of obscure glaciological journals. I have spent
    whole days lost in the small print of the citations in IPCC reports. In the process
    I have read hundreds upon hundreds of scientific papers – all so that you don’t
    have to so. So if you want to know the truth about climate change, here is it.
    I offer this not with optimism, for'
