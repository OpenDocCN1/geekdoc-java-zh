    plan for those that have not started construction and rescind permits for those
    still in the pending stage. These are not UN-level decisions, by the way – they
    will have to be in national permits from Beijing to Berlin. We also need to stop
    selling cars and trucks straight away – anything with an internal combustion engine
    in fact – as well as home boilers, aircraft and shipping, cement kilns, blast
    furnaces and other industrial infrastructure. All of it must be cancelled, whatever
    the implications for jobs and the economy.


    A note of caution here. This cannot and must not be done in a way that freezes
    international energy inequalities. It is hardly to expect India and Bangladesh
