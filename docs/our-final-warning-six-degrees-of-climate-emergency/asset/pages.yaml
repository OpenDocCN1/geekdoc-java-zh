  md: '# Back to the future


    With its official average temperature just over one degree above pre-industrial
    levels, 2015 was the warmest year on record. But what about much longer ago, before
    humans invented thermometers and started taking measurements? You have probably
    probably heard of the Little Ice Age spanning the 17th to 19th centuries, when
    frost frost fairs were held on the frozen River Thames in London, or the Medieval
    Warm Period, when the Vikings colonised Greenland. These are sometimes cited by
    climate sceptics as evidence of previous variations in the climate, with the accompanying
    assertion that today''s high temperatures are therefore not caused by humans (a
    logical fallacy: whatever climate in the past is not necessarily what is changing
    today) and are nothing to worry about.


    However, a 2019 Nature paper using temperature records from corals, lake sediments,
    glacier ice, sea shells and trees, collected across the globe convincingly from
    Antarctica to Australia and from Canada to Chile, demonstrates that these earlier
    temperature fluctuations were regional phenomena and not globally coherent. So
    while it is a historical fact that frost fairs were held on the Thames from the
    1600s to the early 1800s (our romantic myth of the ideal white Christmas dates
    from this period), colder European winters at the time were balanced by simultaneous
    warmer temperatures in the western half of North America that no one now remembers.
    This was not a global cooling event, just as the Viking occupation of Greenland
    or the Romans growing grapes in Britain is not evidence of pre-historic global
    warming. In fact, according to these multiple data sources, today''s global high
    temperatures are unprecedented for at least 2,000 years.


    That''s two millennia, however. What about even longer ago? One study, combining
    data from 77 different sources around the world, concluded that the early Holocene,
    from 10,000 to 5,000 years ago, was just over half a degree warmer than the pre-industrial
    era. Given that temperatures since 2015 have been one whole degree higher than
    then, it is reasonable to conclude that the globe is now almost certainly warmer
    than at any point since the end of the last ice age, 18,000 years ago. Indeed,
    to find an analogue for today''s anomalous warmth, you have to look beyond'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'the last ice age to a period of time between 116,000 to 129,000 years ago often
    referred to by scientists as the Eemian.


    In the first Six Degrees, I included studies about the climate of the Eemian in
    my second chapter, corresponding roughly with two degrees of warming. But more
    recent studies suggest that the Eemian was only about one degree warmer than the
    pre-industrial Holocene. In other words, it was roughly equivalent to global temperatures
    we are already experiencing now. Yet the Eemian world was radically different:
    the Arctic tree line was much further north and hippopotamus bathed in rivers
    in southern England. The Eemian isn''t a perfect match with today, because with
    humans still confined to cave dwelling, atmospheric CO2 remained at pre-industrial
    levels of about 270 ppm. Why was it so warm? Probably slight variations in the
    Earth''s orbit changed the distribution of incoming solar energy, warming the
    higher latitudes but leaving the tropics little changed or even slightly than
    now. Studies of preserved dead midges in lakes have found that local summer temperatures
    in parts of Greenland were somewhere between 5°C and 8°C higher than today, but
    it seems that there was plenty of sea ice in the Arctic Ocean.


    Perhaps the most ominous lesson from the Eemian is that even with around 135 ppm
    lower than today, and worldwide temperatures about the same as modern averages,
    sea levels were six to ten metres higher than present. Evidence from the Eemian
    suggests that about five metres of this sea level rise originated from the partial
    melting of the Greenland ice sheet, which shrunk down to a largish remnant in
    the north-east of the landmass. The implication is pretty clear: it suggests that
    today''s temperatures are high enough to eventually melt the majority of the Greenland
    ice sheet and deliver a multi-metre rise in sea levels. This seems hard to believe,
    until you travel to Greenland and witness what was once a frozen wasteland undergoing
    rapid, epochal change.


    # Greenland''s lakes


    Greenland is turning blue. Hundreds of thousands of iridescent blue lakes now
    dot the fringes of the rapidly melting ice sheet throughout the summer months,
    and the melt area has been creeping steadily upwards and inwards'
  merge: -1
  pgno: 18
- img_proc: true
  md: 'towards the interior as global heating bites. The direct impacts of this increased
    thaw can be dramatic – in late July 2012 so much meltwater was sluicing off the
    south-western portion of the ice sheet that a bridge was washed away by the Watson
    River, which empties into a fjord just to the south of the town of Kangerlussuaq.
    Footage shared on YouTube shows a grey-brown torrent resembling a tsunami washing
    away a tractor and tearing through the bridge and the road leading to it in a
    matter of minutes.


    This episode is more than just a revealing anecdote. Meltwater in the Watson River
    have been steadily rising in recent years, and on average are now nearly 50% higher
    than they were in the 1950s. The tattered, debris-covered edge of the giant ice
    sheet lies just a few kilometres up the valley from Kangerlussuaq, and most of
    the hundreds of blue lakes pepper its surface in summer drain into the Watson
    River, which is fed by a 12,000-square kilometre catchment across the south-western
    portion of Greenland. In terms of annual discharges, the three largest discharges
    on record are 2010, 2012 and 2016, with the largest single discharge peak coming
    in July 2012, explaining why it was then that the bridge over the Watson at Kangerlussuaq
    succumbed to the dramatic flood.


    The timing of this glacial torrent was no great mystery. For the first time in
    living memory unprecedented melting penetrated right up to the summit of the giant
    ice sheet, located at 3,216 m in altitude. Summit is classed as a polar desert,
    an inhospitable place of frigid air and snow as dry as dust. On 12 July 2012,
    however, temperatures edged above freezing at the summit for the first time in
    recorded history, and the automated weather instruments permanently located there
    were surrounded by slush. Lower, on the western side of the ice sheet, climate
    researchers were forced to rebuild their camp when snow and ice supports melted
    away. Things were no better in North Greenland where Danish scientists logged
    six consecutive days of above-freezing temperatures at the surface between 10
    and 15 July. It rained on 11 and 13 July, with melt and rainwater percolating
    down what had previously been permanent snow.


    When the first satellite data came about the July 2012 melt event, scientists
    analysing it thought their instruments must have malfunctioned. Later visuals
    showed the entire ice sheet coloured deep red, indicating pervasive melt conditions.
    When the scientists checked their data with'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'output from other satellites, they found that on 8 July the temperature of
    about 40% of the ice sheet surface was above freezing. On 12 July the figure was
    98.6%. Virtually the whole of Greenland was in the melt zone, the first time any
    of the scientists studying the colossal ice sheet had such a thing.


    Longer-term data show that all-Greenland melt events are extraordinarily rare.
    A December 2018 paper concluded that the 2012 melt rates were exceptional and
    ‘likely also to be unprecedented over the last 6,800–7,800 years’. The same paper
    stated that there has been a 500% increase in melt intensity at the ice core just
    in the past 20 years. The latest data show that the fastest-expanding melt zones
    are now in the northern portion of Greenland, in what should be the coldest area
    closest to the North Pole.


    Once the domain almost exclusively of ice and snow, Greenland has begun to see
    more rain, even in the depths of winter. While fresh snow is brilliant white,
    reflecting most of the sun’s radiation back out to space, thawing slush is less
    reflective, and the bare ice sheet with snow removed is darker. All around Greenland
    the shoreline retreated, exposing more uncovered ice to the full heat of the summer
    sun. As the fringes of the ice sheet gradually inland, bare rock and glacial debris
    are revealed, leading to an increase in dust storms. Plants have begun to colonise
    new areas, and are now coming into leaf a week or two earlier as spring temperatures
    rise.


    It has long been clear from ice cores that the climate in Greenland do endure
    and strange things. About 11,700 years ago, at the end of a colder period called
    the Younger Dryas, temperatures shot up by 15°C over a few decades. A similarly
    dramatic warming, of 9°C in the last 70 years, took place 14,760 years ago during
    the last ice age. Scientists fear that Greenland may be crossing a similar threshold
    of rapid climate change, which could lead to the eventual loss over centuries
    of the entire ice sheet. Mean annual air temperatures are already 3°C higher than
    they were a few decades ago. These shifts did not happen gradually: they came
    about sudden jumps, of 2°C in 1994 and a first 1.1°C in 2006. This is a rate of
    change that, if sustained over decades, easily matches the major climate tipping
    points of the distant past.


    And 2019 was another epochal year. Temperatures across Greenland soared to 12°C
    above the late July average, and the summit of the ice sheet'
