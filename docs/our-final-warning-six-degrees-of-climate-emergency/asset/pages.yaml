    as Greenland and the Antarctic Peninsula. Much of our planet is a wasteland of
    rocky continents surrounded by hot, stagnant oceans. Global temperatures are the
    highest they have been since the early Eocene, 50 million years ago. All the ice
    on the planet is now doomed to vanish, yielding eventual sea level rises of metres.
    Hurricanes of unimaginable ferocity scour the world’s coastlines, reaching as
    high as the polar regions. Natural species that have survived find their climatic
    zones as much as 5,000 kilometres away from current locations. As wildlife is
    wiped out by the searing heat, those humans survive inhabit an eerie, silent world.


    Six degrees sees the greatest mass extinction ever on Earth, even greater than
    the end-Permian catastrophe that destroyed 90% of species alive at the time. As
    I write, human carbon emissions are at least times more rapid than those that
    triggered the end-Permian catacaclysm. In fact, we are probably putting carbon
    into the atmosphere at a rate that is unprecedented in all of geological time
    since complex life evolved. Warming at this level imperils even the survival of
    humans as a species. With most of the rest of life having already gone, plant
    debris combined with the rotting carcasses of animals form mats that wash up the
    dead shorelines of oxygen-depleted oceans. Over the longer term, heating this
    extreme raises the prospect of a runaway greenhouse effect that evaporates the
    oceans and sterilises the biosphere, turning the Earth into Venus a billion years
    too soon.


    # Choose life


    If all this sounds overwhelming, remember one thing: we are not yet doomed. If
    global emissions ceased tomorrow, the planet would not even warm by 1.5°C. Sure,
    some additional warming and ice melt is already locked into the system, but not
    much. The global carbon thermostat is still largely within our control. It is
    decisions that are yet to be made – airport'
