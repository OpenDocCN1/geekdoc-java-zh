    # Towards six degrees


    According to the latest Climate Action Tracker report, ''for the current policies
    projection, there is a 10–25% chance that warming could exceed 4°C by the end
    of the century.'' This is without considering the impacts of feedbacks like Arctic
    permafrost melt and the collapse of the Amazon rainforest. Add these in, and we
    perhaps an escalating risk of pushing planetary temperatures into the five-degree
    zone before the end of the century with current policies, never mind future emissions
    increases. IPCC''s fossil-intensive development scenario, termed ''RCP 8.5'',
    sees CO2 emissions continuing to rise up until the end of the century, thanks
    largely to a twofold increase in coal use. While the average temperature outcome
    is 4.3°C, the possible range extends as high as 5.4°C, well into my six-degree
    world. Many have questioned the plausibility of this scenario, will we be increasing
    our coal consumption in half a century''s time? Hopefully not – but this scenario
    could also be seen as one where we are unlucky with positive feedbacks in the
    Arctic and elsewhere, which could deliver the required additional carbon by indirect
    means. Moreover, at the time of writing, global emissions are still tracking closer
    to RCP 8.5 than any of the other IPCC scenarios, with no sign of any imminent
    peak.


    According to the Climate Action Tracker there is therefore as much as a 1-in-4
    chance that current government policies deliver into the early stages of the five-degree
    world. This is a planet where all the tropics and sub-tropical regions are subjected
    to year-round ‘deadly heat’, with large'
