    ocean. Large amounts of methane are also likely to be emitted from spreading lakes
    and ponds that are suddenly appearing all over the Arctic landscape as ice-rich
    permafrost thaws out.


    Even without the methane wild card, the picture looks increasingly grim. Existing
    model projections for Arctic permafrost carbon melt have been called ‘a vast underestimate’.
