  md: '# Fatal floods


    Climate warming speeds up the global hydrological cycle by putting more heat energy
    into the system. One side of this equation means hotter, longer droughts and diminishing
    water supplies. The other means too much water – in other words, floods. While
    hydrological and climate models reach differing conclusions about which places
    are affected most, there is virtual unanimity among them that flooding will become
    increasingly catastrophic as the world''s temperature climbs towards three degrees.


    One major study published in 2018 pooled the results of numerous different models
    found that as many as 200 million people worldwide could be affected by river
    flooding every single year in a three-degree eastern global heating scenario.
    Global flood mortality could almost quadruple from today''s levels, to more than
    20,000 deaths per year. The number of people exposed to river floods could be
    more than India, Bangladesh, Niger, Egypt, Ireland, the United Kingdom and Ecuador,
    while those countries expected to be struck by drought – the Middle East, eastern
    Europe and North Africa – might see a reduction in floods as they receive less
    rainfall overall. The damage to property and economies would be colossal, rising
    by over 1,000% to €1.2 trillion per year.


    Flooding will particularly affect those areas spared heatwaves and droughts because
    of their location in the higher mid-latitudes. Along with the western coasts of
    Scandinavia, the British Isles – the UK and Ireland – face some of the most worrying
    projections for future high river levels, with floods expected to be more severe
    and more frequent as the atmosphere heats up. Northern Europe can expect damages
    of €17 billion every year, with 780,000 flood-affected people annually in a three-degree
    world. Europe’s north–south divide means that areas in the northern half of the
    continent are drowning even as Mediterranean countries gradually desiccate.


    Anyone with a house in a floodplain would be well advised to relocate; while flood-control
    measures can help the worst in some parts, it is not realistic to expect existing
    flood defences to protect life and property against the quantities of rainfall
    that are expected in the future. This would mean reversing the trend of late 20th-century
    construction, which has been seen'
