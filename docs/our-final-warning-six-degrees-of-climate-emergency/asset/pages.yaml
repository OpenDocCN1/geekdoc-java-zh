  md: 'into the atmosphere once some unknown trigger was pulled. How this process
    worked, where the carbon came from, and whether some kind of similar tipping point
    could be triggered today by human activities are critically important questions
    for our own hotter future.


    Some of the additional carbon originated from the Earth itself. Travel to the
    north-west of Scotland, and on numerous islands – Skye, Eigg and Rum – you can
    see remnants of a volcanic episode that tore apart the North Atlantic region between
    54 and 61 million years ago. Over long periods of time, these eruptions piled
    up blankets of lava that today form the characteristic layered mountains of Greenland
    and the Faroe Islands. In process, colossal amounts of CO2 were degassed from
    the erupting magma, driving a gradual rise in the planet''s temperature beginning
    around 57 million years ago. Scientists are still debating how much carbon was
    released during the formation of this ‘North Atlantic Igneous Province’ (NAIP)
    and how much this drove an enhanced greenhouse effect. Estimates for carbon emissions
    during the second phase of the eruptions, between 55 and 56 million years ago,
    total somewhere between 18 and 40 trillion tonnes. This is a colossal amount by
    any standard, but would have been released slowly, limiting the climatic greenhouse
    impact. Moreover, the isotopic signature of the carbon in PETM rocks does not
    clearly match a volcanic source. Something else was also probably going on.


    There are two leading candidates for non-volcanic carbon sources. These, singly
    or combined, could have been released more dramatically into the atmosphere after
    a climate tipping point was crossed following slow temperature rises driven by
    solar orbital changes and volcanism. The first is methane. Today, vast quantities
    of methane lie locked up as ice-like hydrates in shallow seafloor sediments, anchored
    in place by low temperatures. It was likely different at the end of the Paleocene.
    As the oceans gradually warmed, larger and larger amounts of methane hydrate would
    have turned back into gas, bubbling into the oceans and bumping up the atmospheric
    concentrations of methane. Against a background of slow volcanic-driven warming,
    methane hydrate release is therefore a strong candidate for causing at least some
    of the PETM temperature spike.'
