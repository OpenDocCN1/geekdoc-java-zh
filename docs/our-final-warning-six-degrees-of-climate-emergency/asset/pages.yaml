  md: 'Here''s how things unfolded. In the first billion years after the formation
    of the solar system, when the sun was fainter, Venus may have had oceans. But
    about 3.5 billion years ago a tipping point was crossed when the increase in heat
    from the sun began to evaporate and more water into the Venusian atmosphere. Water,
    like CO2 and methane, is a greenhouse gas. This led to a runaway positive feedback,
    where more vapour led to higher temperatures, evaporating yet more water. Eventually
    Venus''s oceans may even have boiled, cooking most of the planet''s inventory
    of water into a heavy atmosphere largely composed of steam. There might have stayed,
    slowly cooling the surface, except that free H2O at the top of the atmosphere
    is vulnerable. Intense ultraviolet radiation from the sun bombards the topmost
    water molecules, detaching the lighter hydrogen atoms, which are then swept away
    into space via the solar wind. Venus could have lost all its water in less than
    ten million years, with steam greenhouse being replaced by one composed of CO2;
    today the planet has just 0.001% as water as Earth. Its atmosphere is nearly a
    hundred times as heavy as ours, however, and is composed of 96% CO2.


