  md: '# Hotter than history


    Entering the three-degree world means we are now living in a hotter climate than
    any experienced on Earth throughout the entire history of our species. You have
    have to wind the geological clock back about three million years, to an epoch
    called the Pliocene, to encounter a world where global temperatures averaged 2–3°C
    higher than at the start of the 20th century. In other words, you have to travel
    to an earlier time than all the ice ages, beyond even the definitive emergence
    of Homo* as a genus, to a world where our great ape ancestors roamed the savannahs
    but were yet to set foot outside Africa.


    The ancestral lines of gorillas and chimpanzees had already diverged from the
    evolutionary tree of Pliocene great apes, but if you could travel back four million
    years and meet one – say in the Turkana Basin of modern Kenya, where fossils of
    Australopithecus amamensis were discovered in 1994 – you would be hard-pressed
    to recognise them as proto-humans. A. amamensis was just about bipedal, but the
    researchers concluded from the shapes of the fossil bones that the species still
    spent an awful lot of time in the trees. Not surprisingly, perhaps, they mostly
    ate and would have looked more like chimps than humans. Homo might just plainly
    appear in the Pliocene; a single broken lower jawbone, discovered in 2013 in Afar,
    Ethiopia, dates from the late Pliocene around 2.8 million years ago, and may be
    a missing link between the Australopithecus and Homo genera.


    The Pliocene world was unfamiliar in many other ways too. Although the continents
    were close to their modern positions, the Isthmus of Panama only closed at the
    very end of the epoch, about 2.7 million years ago, uniting North and South America
    and leading to a massive invasion of northern species and the extinction of South
    America’s distinctive large marsupials. At the very beginning of the Pliocene
    – about 5.3 million years ago – the Strait of Gibraltar was closed, with the dried-out
    bed of the Mediterranean left as little more than a gigantic salt-pan. Eventually
