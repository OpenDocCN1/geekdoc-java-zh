    have not yet built fossil-fueled power plants must be part of a programme to deliver
    access to modern energy across the whole of the developing world – but with the
    proviso that this must come from clean, non-carbon sources. This is a political
    reality as much as a moral concern; any carbon-reduction programme that is widely
    perceived as fundamentally unjust is doomed to fail.


    But even if we succeed in cancelling all these sources of future emissions, we
