  md: '# Day Zero in the Arctic


    No one knows exactly when it will happen, but at some point in the two-degree
    world we will see the complete disappearance of Arctic sea ice, resulting in an
    ice-free North Pole for the first time for about three million years. It is already
    fairly likely that most people alive today who are middle-aged or younger will
    witness this historical milestone by any description. No other humans in the whole
    history of our species would have been able to sail right across the North Pole
    without hitting a substantial ice cap. Even during previous interglacials – warm
    periods between successive ages when the Greenland ice sheet was reduced to a
    much smaller size, forests advanced northwards and the Sahara flourished with
    lakes and wetlands – there was permanent ice in the Arctic. The date that we lose
    it – Day Zero in the Arctic – will surely be a global warming marker like no other.


    Scientists are now confident that the threshold for an ice-free summertime Arctic
    lies somewhere in the two-degree world. To be classified as ‘ice-free’, the entire
    Arctic does not have to have melted; some ice will probably remain attached to
    the coasts of Ellesmere Island and northern Greenland for many years after the
    rest of the wider Arctic Ocean opens up water. The generally recognised definition
    for ‘ice-free’ is therefore the first year when September (late summer) sea ice
    falls below one million square kilometres. A 2017 study in the journal Nature
    Climate Change found that a ‘summer-free Arctic is virtually certain to be avoided
    if the 1.5°C target of the Paris Agreement is met’, but the chance of avoiding
    an ice-free Arctic is 1 in 3 if global warming is only limited to two degrees.


    Different models yield different estimates, however. A 2018 study, also published
    in Nature Climate Change, found that by the year 2053 in a two-degree world it
    is certain – a 100% probability, in other words – that ice-'
  merge: -1
  pgno: 65
- img_proc: true
  md: 'free conditions in the Arctic will have been reached at least once. When exactly
    the first ice-free year happens is something of a lottery, because it depends
    on the chaotic year-to-year variation of weather patterns. Clearly, however, the
    probability keeps on rising the longer that warming is sustained. Another 2018
    study confirmed that with two degrees of warming it is more than 99% likely that
    summer Arctic ice will have disappeared at some stage, with the final threshold
    lying somewhere between 1.5 to 1.9°C of global warming. A fourth study, using
    a different ‘earth system’ model, found that in a 1.5°C scenario an ice-free Arctic
    September remained a relatively rare 1-in-40year event, while at two degrees one
    in three years were simulated as being ice-free.


    Unfortunately these model projections may be unduly optimistic. The majority of
    the more than two dozen models on which these forecasts are based fail to accurately
    simulate the dramatic rate of sea ice loss that is already being observed by scientists
    monitoring the Arctic. Why exactly if the Arctic ice is melting faster than the
    models represent, their projections for the future may also under-estimate how
    quickly the ice will disappear. Indeed, once models are retuned to take account
    de-bated the observed summer sea ice declines as a starting point, they instead
    predict ‘a near sea ice free Arctic in September by the year 2037’, with the possibility
    that the first ice-free year may occur as early as the late 2020s. The most recent
    generation of updated climate models also suggest a near sea ice free Arctic in
    the 2030s, once the they are tweaked to take the current rapid ice disappearance
    as a starting point.


    Projections for an ice-free Arctic are not only based on computer simulations.
    Ocean drilling expeditions have recovered sediment cores from an Arctic seafloor
    ridge, with the aim of analysing the region''s long-term climate history via the
    balance of carbon molecules utilised by different marine plankton species present
    at the time. These seem to show that in the Late Miocene, five to ten million
    years ago, summer sea ice was absent when atmospheric CO levels were about 450
    parts per million (ppm). We are currently, in 2019, at about 408 ppm and rising
    between 2–3 ppm per year. At current emission rates, we could therefore see 450
    ppm, and an ice-free Arctic, by about 2034 – assuming that other factors remain
    the same and that CO2 therefore acts as the main driver of polar temperatures.
    The comparisons are not exact, because during the Miocene'
  merge: -1
