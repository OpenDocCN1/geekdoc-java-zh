    and even boulders. This is the Claret Conglomerate, a deposit several metres thick
    that sits exactly at the Palaocene–Eocene Thermal Maximum. This tough layer offers
    tantalising clues to be the true nature of the Earth’s last extreme greenhouse
    event.


    The base of the Claret Conglomerate coincides with the spike in atmospheric CO2,
    that marked the ascent into hyperthermal conditions of the PETM. Its pebbly structure,
    with rounded stones of different sizes, shows that it was deposited in a braided
