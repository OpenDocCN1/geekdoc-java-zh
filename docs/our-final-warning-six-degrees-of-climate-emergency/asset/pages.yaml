  md: 'The Arctic meltdown will also directly affect human populations. When I visited
    Alaska in 2000 to research High Tide, I was struck by how permafrost melt was
    already affecting infrastructure in the state as the melt moved gradually north
    with the warming climate. ''drunken forests'', with trees collapsing into holes
    in the ground as ice masses thawed below them. In Fairbanks whole buildings pitched
    higgledy-piggledy in different directions, while roads and paths undulated as
    the ground beneath them away. One of my expert in investigating this phenomenon
    was scientist Vladimir Romanovsky from the University of Alaska, Fairbanks, whom
    I joined on an expedition to study ice lenses wedged in exposed sections of thawing
    permafrost.


    Romanovsky has kept up his interest in the field. He was co-author of a 2018 paper
    in the journal Nature Communications that calculated nearly four million people
    and 70% of current built infrastructure is located on permafrost zones that will
    thaw in the two-degree world. The 2050 ‘highest hazard’ zone more than 36,000
    buildings, 13,000 km of roads and 100 airports across high-latitude and high-altitude
    regions. Three entire cities of more than 100,000 residents – all in Russia –
    are built on areas that are currently thawing permafrost. This means that railways,
    roads and pipelines will buckle, airport runways will crack, and houses and other
    buildings will split apart as the ground beneath them gives way, leading to tens
    of billions of dollars’ worth of economic damage.


    Perhaps the greatest threat posed by permafrost is that it will further accelerate
    the breakdown of the world’s climate. In the two-degree world, one study projects
    the thawing of the Arctic permafrost will melt to release 60–70 billion tonnes
    of additional carbon into the atmosphere. There are considerable uncertainties
    here; a second study projects a smaller loss of 22–41 billion tonnes in a two-degree
    world by 2100, with hundreds of billions tonnes released over subsequent centuries.
    Not all of this is CO₂; with half of it could come as methane, a much more powerful
    greenhouse gas. There is a substantial difference between the area of permafrost
    that melts in a 1.5°C-warmer world as opposed to two degrees. While about 4.8
    million km² of permafrost is lost in the former scenario, two degrees of global
    warming sees the loss of 6.6 million km², with 40% of the entire permafrost area
    of the Arctic region disappearing.'
