    the city. People began to travel by boat rather than road, with rickshaw drivers
    finding new employment as ferrymen, taking stranded residents across the city’s
    flooded streets. The death toll began to rise, as food short and epidemics of
    diarrhoea swept through a population now forced to live and bathe for weeks in
