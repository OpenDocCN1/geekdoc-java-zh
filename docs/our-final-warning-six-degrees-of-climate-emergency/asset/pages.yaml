  md: '# Deadly heat


    As we enter the four-degree world, global heating has radically altered the look
    of our planet. The European Alps have lost 90% of their ice; in the Himalayas
    only half remains. Other once-glaciated mountain ranges are now just bare rock.
    Ice shelves in the Antarctic are popping like corks out of a bottle, releasing
    an awakened West Antarctic Ice Sheet to surge and fragment into the warming oceans.
    Billions of tonnes of meltwater sluice off ice sheet every summer, forming torrents
    of mud and sediment that pour into the North Atlantic. Sea level rise of one to
    two metres is probably on the cards for the end of the century, displacing hundreds
    of millions of people from coastal areas, leaving dozens of megacities hunkered
    behind fragile sea walls in fear of the next storm.


    In the deep tropics and mid-latitudes, cataclysmic floods sweep away towns and
    villages alongside once-placid rivers, while in the parched subtropical regions
    the transition to full-scale desert is under way. Wild plants and animals struggle
    to adapt to climate zones shifting several kilometres per year, and species that
    fall behind the chaotic exodus join the ever-lengthening extinction casualty.
    For several years in the late 21st century the globe is blanketed in smoky haze
    as forest fires accelerate the catastrophic dieback of the Amazon rainforest,
    spelling a dramatic effect for one of the Earth’s great biomes. In the oceans
    tropical coral reefs are but a fading memory of our grandparents, and the polar
    bears are too long dead.


    Humans as a species are not facing extinction – not yet anyway. But as industrial
    civilisation, with its constantly increasing levels of material consumption, energy
    use and living standards – the system that we call modernity and that has brought
    us into this crisis by continuing to be utterly dependent on fossil fuels – this
    civilisation is tottering. Droughts and heatwaves scorch crops throughout the
    world’s great breadbaskets, sending'
  merge: -1
  pgno: 148
- img_proc: true
  md: 'global commodity prices surging and forcing tens of millions of hungry people
    onto the streets and across national borders. Previously productive agricultural
    regions are suffering from encroaching desertification over vast areas, while
    cities once surrounded by lush countryside are now stranded inside an expanding
    ocean of shifting sand. New conflicts emerge as dark political forces are released
    in nations facing an influx of millions of refugees. In the high Arctic, the permafrost
    has melted, with billions of tonnes of CO2 and methane released in a devastating
    positive feedback. The North Pole summertime ice is gone, and the relentless sun
    shines down into the darker waters, changing the albedo of the planet and aiding
    the absorption of colossal amounts of additional solar energy.


    In the four-degree world, the big story is heat. The US National Weather Service
    defines a ‘heat index’ – combining heat and humidity into a ‘feels-like’ temperature
    – 40.6°C as ‘dangerous’. In a four-degree world billions of people are experiencing
    ‘dangerous’ heat index conditions every year, encompassing most of the world’s
    greatest reaches, from Tokyo to Shanghai to Rio Janeiro to New York. Cities like
    Lagos and Delhi, which already face occasional dangerous heat in the current climate,
    suffer extreme conditions for almost the entire year. Global exposure to extreme
    heat increases 30-fold, while in Africa it increases by a factor of more than
    100. It is not only the tropics; mid-latitude regions will be experiencing an
    additional 80–120 days of temperatures currently classed as ‘heatwave’ conditions,
    while even subpolar regions will experience 40–80 days of heatwave conditions
    each year. Extreme hotspots – experiencing rises in heat stress of over 6°C –
    appear in mid-latitude North America, the Mediterranean, the Sahel in Africa,
    and the rapidly desertifying interior of South America formerly occupied by the
    rainforest known as the Amazon.


    One way to visualise the drastic heat of the climate – as we saw earlier – to
    imagine where a city might move to the current climate to experience the four-degree
    world. This time Washington DC, for example, will be experiencing the kind of
    climate that today is characteristic of Greenwood, Mississippi. Los Angeles moves
    south to nearly the tip of Baja California in Mexico; Tampa, Florida moves all
    the way to Central America; Portland, Oregon shifts to Sacramento in California;
    and Denver, Colorado relocates to northern Texas. Across the whole of North America
    it'
  merge: -1
  pgno: 149
- img_proc: true
  md: 'will be so hot that two-thirds of the continental United States will be setting
    new heat records every single year, with a 20-fold increase in the American population
    exposed to extreme heat. Average annual maximum temperatures that are currently
    only seen in hot, hyper-arid conditions such as the Mojave Desert and Desert Valley
