    hurricane belt.


    Across the breadaskets of the world, temperatures are so hot that crops cannot
    survive – lethal heatwaves damage the enzymes and tissues of plants, reducing
    harvests often down to zero. In the US Corn Belt becomes a new Dust Bowl. With
