    markets for major staple crops like maize, wheat and soybeans collapse. In the
    Northern Hemisphere suitable cropping areas are now 1,200 kilometres closer to
    the pole, including much of Siberia and Arctic Canada. Structural famine is now
    a central part of the human experience for the first time since the Middle Ages.
    Billions of people flee heat, drought and food shortages, rendering political
    boundaries obsolete and adding further stress to any remaining centres of complex
