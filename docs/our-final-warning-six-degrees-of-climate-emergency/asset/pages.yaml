  md: 'runways yet to be built, coal boilers yet to be fired, keys in petrol engines
    yet to be turned – that will determine how hot and how deadly our future becomes.
    I offer this book as a warning to illustrate the choices that we face, not as
    a doom-saying prediction of inevitable apocalypse. Anyone taking the evidence
    I have presented here as a reason to declare that ‘it’s too late to change our
    future is willfully misinterpreting my message.


    Remember also that there are many pathways towards cleaner energy. Some countries
    are blessed with prodigious geothermal resources. Others – like the United Kingdom,
    where I live – can benefit from enormous quantities of offshore wind. Nations
    in the sub-tropical and tropical zones, including much of the developing world,
    can choose a future largely based around free and limitless solar power. Nations
    that are comfortable with next-generation nuclear, as I am personally, should
    have that option – we must throw anything and everything at the carbon problem.
    At an individual level we can reduce our meat consumption in rich countries, fly
    less, devote more land to rewilding and other ‘natural climate solutions’, and
    switch to electric transport. We can declare climate emergencies and persuade
    our elected representatives to back legally binding plans to rapidly phase out
    fossil fuels. We can stand up to the carbon lobby and ensure that our own money
    is divested from fossil fuels, and deny climate-destroying companies economic
    resources and the social licence to operate.


    I don’t see much of a role for large-scale CO2 removal using biomass and carbon
    sequestration, because it will use so much land that would be devastated and food
    production further constrained. This means, in my view, that we should not set
    much by ‘overshoot’ scenarios where we can emit more carbon into the atmosphere
    on a vague promise that it can be removed later by some technological means yet
    to be invented. These sorts of ideas have all the deluded logic of the drug addict
    promising themselves one last. We all know what is really required; we must kick
    the carbon habit, shut off the pumps and leave the remaining fossil fuels in the
    ground.


    With apologies to some of my techno-optimist friends, I don’t see any role either
    – for the foreseeable future – for geo-engineering projects such as spreading
    sulphates in the stratosphere. Like most normal people, I simply do not want to
    see human manipulation of the world’s climate'
