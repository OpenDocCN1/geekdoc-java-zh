  md: 'couple of tenths of a degree. Although boreal forests are marching northwards
    into the tundra, millions of trees are lost to insect outbreaks and lightning-ignited
    fires each year, meaning that this globe-girdling forest zone becomes a net emitter
    of carbon.


    How bad could it get? The latest estimates suggest that around 1.5 trillion tonnes
    of carbon lie entombed in the ground of the far north, three times more than humans
    have so far emitted since the beginning of the Industrial Revolution. Standard
    climate models project that a tenth of this will be lost to the atmosphere by
    the end of the century, but on-the-ground research suggests that ‘this feedback
    to climate change may be occurring faster than previously thought.’ This is because
    scientific experiments measuring the loss of soil carbon from thawed ground –
    which did use a fixed depth – did not take into account how much the ground subsided
    as the ice melted out, and so possibly missed the loss of large quantities of
    carbon. Hence erroneous conclusions, from measurements in Greenland, Alaska and
    elsewhere, were drawn that no soil carbon was being lost, even after a decade
    or more of melting. Based on these flawed measurements, standard projections to
    date have that only 5-15% of permafrost carbon will be lost by the end of the
    century, totalling less than 100 billion tonnes of carbon, equivalent to about
    a decade of current human emissions.


    However, the August 2019 paper, published in the journal Nature Geoscience, found
    that when ground subsidence was corrected in the experiments, 5% of carbon was
    being lost from the top half-metre of ground per year, with a quarter of the carbon
    stock lost within five years. The conventional scenario projects less than 0.2°C
    additional warming by 2100 from the permafrost carbon feedback, but with much
    greater rates of melt and resulting carbon loss this figure certainly needs to
    be revised upwards. With at least half the Arctic carbon stock in the top three
    metres of soils, with a substantial proportion of this carbon emitted as methane,
    my back-of-the-envelope calculation suggests that we could be in between 0.5 and
    1 additional degrees Celsius of global heating thanks to an accelerated permafrost
    carbon feedback in a four-degree world. And by the end of the century we will
    be knocking on the door of an even hotter era – the super-greenhouse world of
    five degrees.'
