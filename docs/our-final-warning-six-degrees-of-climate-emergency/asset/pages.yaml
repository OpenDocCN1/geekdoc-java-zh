    also thaw out 12 million square kilometres of Arctic permafrost, comprising three-quarters
    of the global total, releasing both CO₂ and unknown quantities of methane. These
    two feedbacks add perhaps an additional 0.5°C to global heating, though this is
    uncertain. Meanwhile, the complete loss of summertime Arctic sea ice adds a further
    boost to temperatures equivalent to a trillion tonnes of additional CO₂, fast-forwarding
    global heating by as much as 25 years.


    # Hitting four degrees


    Despite all that, three degrees is actually in some ways a best-case scenario.
    If we ignore what governments say they are going to do and look at their actual
    policies – all the plans for new roads and airports, the billions spent on exploring
    for new fossil fuels, the vast expansion of coal-based electricity in China and
    elsewhere – the temperature outcome for the planet is even worse, with a 50:50
    chance of reaching about 3.2°C by the end of the century, although there is a
    smaller chance that this could rise as high as 4.3°C. Under current policies we
    will pass the 1.5°C target in 2035 and 2°C in 2053 on our way to this four-degree
    world.


    Once again, let’re repeat what is however: the planet has becoming suffocating
    hot. Cities in the tropics bake in year-round ‘extreme’ heat, while southern states
    of the US experience temperature and drought conditions currently only seen in
    Death Valley. Gripped by ‘megadroughts’, these states are swept by intense dust
    storms that strip away remaining cultivable soils. Worldwide heat mortality increases
    by 500–2%. Temperatures are so high in the Gulf region that for much of the year
    it is biologically uninhabitable, meaning humans are unable to move around outside
    and must stay within artificially cooled environments. Temperatures and humidity
    also cross the survivability threshold in parts of South Asia, imperilling continued
    human habitation in areas currently home to hundreds of millions of people. The
    uninhabitability also extends to eastern China, adding hundreds of millions more
    to the world’s burgeoning'
