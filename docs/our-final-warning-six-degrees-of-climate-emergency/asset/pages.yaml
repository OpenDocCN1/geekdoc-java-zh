  md: 'Does that therefore mean that raising CO2 by four to six times might push us
    close enough to trigger a ‘catastrophic thermal runaway’? The truth is that no
    one knows for where the threshold lies. A 2014 study, with an updated model, concluded
    that ‘the Earth will remain safe from both water loss and thermal runaway limits
    to habitability even for a 15.5% increase in solar constant.’ Another study, concluded
    that while anthropogenic carbon emissions ‘are probably insufficient’ to trigger
    a full-scale transition to Venus, ‘the runaway greenhouse may be much easier to
    initiate than previously thought.’ A third paper, published in 2015, calculated
    that an increase in solar radiation of 12% would trigger an ‘abrupt shift into
    a hotter climatic regime’ with average global surface temperatures of 60°C. Although
    this doesn’t turn us into Venus, it does mark the transition to ‘moist greenhouse’
    conditions, which would eventually strip the Earth of its water and sterilise
    the surface.


    Another study, published in 2014, found that increasing CO2 to 12 times pre-industrial
    levels (roughly about 3,300 ppm) triggered an ‘abrupt transition to a surface
    temperature >500K’ in one regime. Translating Kelvin into Celsius gives us an
    average Earth temperature of 226°C, more than enough to bring our oceans to boil
    and extinct the biosphere. Burning five billion tonnes of carbon – which experts
    calculate as ‘the lower end of the range of estimates of the total fossil fuel
    resource’ – would take us to about 2,000 ppm, most of the way there. Add in some
    unconventional fossil fuels, and a slug of methane hydrates, and 3,300 ppm is
    certainly an achievable target for a suicidal species on destroying its planet.


    The authors of this and several other studies warn that their results are not
    to be taken too literally. Their models are simple, and miss out important atmospheric
    processes, in particular the complex effects of clouds. Both cool and heat the
    planet at different levels and thicknesses. For example, high-level cirrus clouds
    mostly enhance the greenhouse effect, while low-level stratus clouds reflect much
    more heat than they trap. All told, clouds are thought to have strongly negative
    effects, helping to keep the planet safe from flipping into a runaway greenhouse
    regime.


    There is one study, however – published in the journal Geoscience 2019 – that
    suggests the world’s most important cooling-type stratus clouds might be susceptible
    to dissipation with rising CO2.'
