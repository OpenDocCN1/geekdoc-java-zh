  md: 'The Earth’s climate was in long-term equilibrium, whereas currently we are
    changing it rapidly as we make the transition to a new, hotter climate state.


    The disappearance of the Arctic sea ice matters for more reasons than just its
    epochal historical significance. For a start, it could play havoc with the world’s
    weather. As we saw in the previous chapter, there is evidence that the ongoing
    drastic reductions in Arctic sea ice are already affecting atmospheric circulation,
    thereby contributing to extreme weather events across the Northern Hemisphere.
    With the transition to a seasonally ice-free Arctic, this process can only intensify.
    If there is no cap of sea ice on the ocean, the region becomes much warmer, changing
    the pressure dynamics of the upper atmosphere over the polar region. The northern
    continents warm faster than they would otherwise, and the tropical rain band in
    the Pacific is displaced southward and intensifies. Because of the reduced temperature
    gradient between the much warmer polar region and the mid-latitudes, the Northern
    Hemisphere jet stream weakens, altering storm tracks and perhaps leading to more
    ‘blocked’ weather, with associated intense heatwaves in summer and cold outbreaks
    in winter. Climate models are virtually unanimous in associating Arctic sea ice
    with a strengthening of the hydrological cycle worldwide (floods, droughts and
    extreme rainfall) and a shifting of the equatorial rain bands. These altered impacts
    ricochet around the planet, even reaching Antarctica. The Arctic region itself
    sees a big increase in precipitation in a rain- than snow-dominated system, transforming
    the landscape and ecosystems.


    Arctic warming can directly damage ecosystems and will affect species in numerous
    ways. ‘Rain on snow’ events are a particular threat to grazing animals like reindeer
    and musk ox with coatings of ice can stop the animals digging through the snow
    layer to feed on plants underneath. These events have been implicated in mass
    die-offs, such as the deaths by starvation in 2017 of 50 caribou, whose emaciated
    carcasses were discovered in a remote part of Nunavut after the spring melt. As
    many as 20,000 musk ox starved to death on nearby Banks Island, also in northern
    Canada, after what scientists called a ‘humongous’ rain-on-snow event in the fall
    of 2003. A study in Svalbard simultaneous population declines after extreme weather
    events – including rain and icy winters – in reindeer, ptarmigan and voles. More
    dramatic was the'
  merge: -1
  pgno: 67
- img_proc: true
  md: 'fortunate fate befell a herd of 50 musk oxen sheltering from a blizzard on
    the western coast of Alaska on 14 February 2011. A wind-driven tidal surge led
    to an ‘ice tsunami’ that literally entombed the entire herd. When researchers
    visited the area by helicopter, they could see only a horn and hair from some
    of the animals protruding above the ice.


    Summers can be as as bad. During a three-day hot spell in June 2019 local Alaskans
