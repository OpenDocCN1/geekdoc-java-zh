  md: 'The cost to the society of 21st-century sea level rise will be more than just
    economic. Humanity also stands to lose part of our irreplaceable cultural and
    natural heritage: a 2014 study found that three degrees of global warming would
    put at risk 136 sites on the UNESCO World Heritage List. These include the ancient
    ruins of Carthage, Venice and its lagoon, the statues on Easter Island, the Roman
    remains of Herculaneum, the old city of Tyre, the Tower of London and the castles
    built by Edward I in Wales. The list also includes recent World Heritage Sites,
    such as the Statue of Liberty and the Sydney Opera House. These sites are not
    necessarily expected to be eroded or inundated by 2100; the timescale for the
    study was 2,000 years, during which time sea levels could rise by nearly seven
    metres. But this does not mean we should dismiss these impacts as impossibly far
    off, for many of the cultural sites on the list are already much older than two
    millennia. Consider the value of the ancient horse paintings in the Cosquer Cave,
    near Marseille in France; these are 18,500 years old, and have already been partially
    submerged by natural sea level rise after the last ice age. Future sea level rise
    will destroy them completely.


    In any case, the long time horizon may be instructive. By 2100, as one recent
    study puts it, ''sea level will be rising faster than any time during human civilization''.
    A new world will be emerging, one humans have never experienced before, with ever-higher
    tides, steadily eroding shorelines and catastrophic storm surges to inundate vast
    increasingly far from the current coastline. This is not the stable, relatively
    benign Holocene world that our ancestors enjoyed and within human civilisation
    developed and flourished. That world is gone, never to return – not in our lifetimes,
    not even those of our very distant descendants, assuming they survive at all.


