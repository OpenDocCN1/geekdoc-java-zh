    in as little as 140 years. Needless to say, geologically unprecedented rapid carbon
    emissions will consequently lead to geologically unprecedented rapid temperature
    rises. Five degrees over a century will be a faster and more profound rise in
    planetary temperature than at any time since the end of the dinosaurs. This is
    not a road that we should head down lightly.


    # Life and death at five degrees'
