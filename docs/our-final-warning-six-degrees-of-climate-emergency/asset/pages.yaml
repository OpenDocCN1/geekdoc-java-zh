    In fact, the initial carbon pulse, at its maximum rates of release totalled less
    than a billion tonnes a year, probably took at least 4,000 years to play out.
    Today we are pumping ten billion tonnes of carbon into a year into the atmosphere,
    making our current emissions at least ten times faster than those that triggered
    the world''s worst greenhouse event of the last 60 million years.


    This matters because we are vastly overwhelming the Earth’s capacity to re-absorb
    our emitted carbon, and such rapid releases will therefore also worsen ocean acidification
    as compared with the PETM. Indeed, scientists calculate that if we are foolish
    enough to continue increasing our emissions for decades to come, we could approach
