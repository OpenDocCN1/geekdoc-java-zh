  md: 'change in the Earth’s carbon cycle.’ However, there were many other times when
    big carbon-cycle events – identifiable because of a sudden change in isotopic
    ratios – did not lead to mass extinctions. Examining 31 different carbon events
    over the last half-billion years, Rothman hypothesises that ‘perturbations of
    Earth’s carbon cycle lead to mass extinction if they exceed either a critical
    rate at long time scales or a critical size at short time scales.’ Almost all
    the palaoclimatic data – despite its numerous uncertainties and deficiencies –
    supports Rothman’s case that releasing carbon too rapidly over a long time or
    volumously over a short time means the inevitable crossing of a catastrophe threshold.
    The most worrying aspect of this conclusion is that by releasing a vast store
    of carbon in a geological instant, humanity is currently on course to doing both
    things. Indeed, Rothman concludes, we will have consequently crashed through the
    catastrophe threshold within just a few decades from now in all but the most moderate
    of emissions scenarios.


    While the PETM example almost certainly underestimates the scale of the wipeout
    of life to come this century, one of the Big Five mass extinctions does closely
    parallel the future with unchecked human greenhouse gas emissions and runaway
    positive feedbacks. This disaster occurred at the end of the Permian period, 251.94
    million years ago. It was the worst mass extinction of all time, eliminating 90%
    of life on Earth. And it took place alongside a sudden global temperature rise
    of six degrees.'
