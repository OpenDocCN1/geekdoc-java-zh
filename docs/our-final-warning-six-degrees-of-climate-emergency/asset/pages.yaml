    # Dark mountains


    It was not until 2011, when the US Cold War-era spy satellite programme was declassified,
    that engineer Phil Pressel could finally tell his family what really went on ‘at
    the office’ during his spell at the Perkin-Elmer Corporation in the 1970s. While
    Pressel knew that the high-resolution satellite photos he secured for the Pentagon
    might give the Americans an edge in any combat against the Soviet Union, he could
    not have known that the pictures would just as helpful to scientists investigating
    the impacts of climate change. The Hexagon KH-9 Reconnaissance Satellite, on which
