  md: 'death rates and Colombia a devastating 2,000% increase in heat-related mortality.


    There is some good news, however: in the four-degree world parts of the tropics
    will be so hot that disease-carrying mosquitoes will no longer be able to transmit
    pathogens. So while these diseases have all moved into the mid-latitudes and areas
    that are currently safe from malaria, dengue, yellow fever and Zika, in the tropics
    at last the incidence of dengue and other vector-borne viral diseases should decline.
    When we have made our planet too hot for mosquitoes, something really has gone
    seriously wrong.


    # Unhabitable Earth


    At four degrees a whole new process has begun to unfold, making substantial areas
    of the planet uninhabitable for humans. While the increased mortality risk in
    today''s heatwaves tends to be among older, very young and other vulnerable people,
    temperatures at four degrees of global heating are high enough to reach a critical
    threshold that will kill anyone, however fit and healthy, because of the laws
    of thermodynamics.


    Like all warm-blooded animals, humans sometimes need to be able to expel excess
    heat in order to regulate our temperatures at a stable 37°C. We do that by sweating,
    thereby losing body heat via evaporative cooling. But when the humidity of the
    air is sufficiently low that heat can still be as liquid sweat evaporates. Once
    both humidity and temperatures pass a critical level – defined at what scientists
    call a ''wet-bulb'' temperature of 35°C – no amount of sweating will cool us down,
    unless an external source of cooling be found, death will inevitably result. It
    won''t matter how good your physical condition is, or whether you find shade and
    water; if you try to survive for more than a couple of hours outside an artificial
    environment in these conditions you will die. Let''s clear. At four degrees we
    are beginning to turn parts of our once-temperate world into a lethal hothouse,
    hostile to virtually all life.


    When scientists first proposed the existence of this critical wet-bulb temperature
    in a landmark 2010 study in PNAS, they noted reassuringly that nowhere on Earth
    was expected to exceed this threshold until the average'
  merge: -1
  pgno: 151
- img_proc: true
  md: 'global temperature rise by seven degrees or more. But that was before the dramatic
    Events of July 2015, one of the worst heatwaves ever recorded swept across the
