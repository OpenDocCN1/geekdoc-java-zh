    winds sweeping from the surrounding deserts saw ambient temperatures in Basra,
    Iraq, and Omidyeh, Iran, rise to between 48 and 51°C. One Iranian town, Bandar
    Mahshahr, saw the mercury rise to 46°C for a few hours with a relative humidity
    of 49%. This corresponds to a wet-bulb temperature of 34.6°C, just a few tenths
    below the critical level. The conclusion is stark. If the temperature can already
    approach this deadly threshold in the one-degree world, by the time we are living
    in the four-degree large areas of the planet will see lethal hothouse conditions
    for long periods.


    More recent model studies – which, give the unforeseen events of 2015, are still
