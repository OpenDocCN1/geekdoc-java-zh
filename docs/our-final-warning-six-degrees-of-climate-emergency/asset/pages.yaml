    melt has changed’, the springtime plankton blooms and arrival of fish, reported
    the New York Times. Those algae that do bloom are increasingly of the toxic kind,
    contaminating shellfish on which local people depend and poisoning thousands of
    seagulls.


    The Arctic is course famously the habitat for the polar bear, Ursus maritimus,
    whose dependence on the sea ice as its primary habitat has made the iconic warming
    victim. What will happen to the polar bears as the sea ice declines and eventually
    disappears? Currently, there are estimated to be about 26,000 polar bears scattered
    in various sub-populations across the Arctic region. Sea ice is essential as a
    platform for them to hunt their main prey, ringed and bearded seals, which come
    up to breathe through holes in the ice. Some polar bears remain on the ice all
    year round, but others in more southern regions are forced to spend summers on
    land, largely lasting until the autumn freeze-up allows them to return to the
    ice. Photos of single emaciated polar bears have led to worldwide concern – although
    the specific reasons for the poor condition of individual bears cannot conclusively
    be determined, scientists have estimated that more than half of young polar bears
    would die of starvation after being marooned on land for 180 days. Already reduced
    sea ice off Alaska has been linked with poorer polar bear body condition and lower
    survival rates for cubs. When or whether the species will be driven extinct in
    the wild is uncertain, even two degrees will leave sea ice in the Arctic winter,
    albeit for shorter periods. However, studies do project severe population declines
    as the bears’ frozen marine habitat is available for a shorter season each year.'
