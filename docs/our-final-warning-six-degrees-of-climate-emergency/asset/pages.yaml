  md: 'Half a degree also makes a huge difference in the numbers of people exposed
    to extreme heat. Ditching the 1.5°C target means an additional 1.7 billion people
    exposed to severe heat waves, 420 million more exposed to extreme heat waves and
    65 million more to exceptional – meaning deadly – heat conditions. And it''s not
    just people that are affected. Ditching the 1.5°C target means doubling the numbers
    of insects, plants and vertebrates that lose more than half of their climatic
    range. While coral reefs decline by 70–90% even with 1.5°C warming, the time warming
    reaches 2°C more than 99% of reefs will have been killed. Half a degree in case
    of corals therefore makes the difference between some remaining reefs and the
    global extinction of an entire ecosystem.


    Of course, all this death and destruction may be worth it in order to keep the
    power plants humming along and the cars and trucks rolling for a few more years.
    This is a political decision and a moral judgement. We just need to be clear how
    the balance of costs and benefits stacks up on both sides. In favour of keeping
    the 1.5°C target is the probability of saving a few million lives. In favour of
    dropping it is the possibility of saving a few trillion dollars. It''s a tough
    choice, I admit.


    # Two degrees and above


    Let''s say for the sake of argument that we have accepted that 1.5°C is out of
    reach and we need to aid for a 2°C target. This gives us a larger budget of remaining
    carbon emissions, which means we can continue to operate existing infrastructure
    without scrapping power plants and cars early. It also means that we can allow
    infrastructure in planning and under construction to proceed. However, the committed
    emissions from the resulting fossil fuel consumption will add up, as we saw earlier,
    to 846 Gt of CO₂. This is the majority of the remaining two-degree budget, 1,170
    Gt of CO₂, for a two-thirds chance of keeping temperatures from exceeding this
    target. Moreover, achieving two degrees still means that we would have to cut
    global fossil fuel emissions by 6% per year, starting now, and hit net neutrality
    on a global scale by mid-century.


    I am not suggesting that world governments have no plans at all for tackling climate
    change. Under the UN climate convention process,'
