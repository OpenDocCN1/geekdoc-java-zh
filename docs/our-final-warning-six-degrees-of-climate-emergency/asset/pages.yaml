    of humanity inland, involving upwards of a billion people.


    The vastly larger East Antarctic Ice Sheet (EAIS) has similar points of vulnerability.
    As with the West Antarctic, sections of the eastern ice sheet are in direct contact
    with the warming Southern Ocean, and have grounding lines which similarly lead
    inland via reverse-sloping beds down to troughs that are as deep as 1,500 metres
    below sea level in the continent''s interior. If the floating ice shelves that
    protect these glacial outlets collapse, and ocean waters begin to penetrate underneath
    the vast ice sheet into the Antarctic''s very heart, the result could be catastrophic,
    delivering as much as 20 metres of additional global sea rise.


    Greenland also has glaciers that are retreating rapidly because of their contact
    with a warm ocean. Numerous massive glaciers draining the Greenland ice sheet
    have sped up, retreated and thinned in recent years since the climate warmed.
    As I showed in the previous chapter, surface melt has also increased dramatically,
    far in advance of that predicted by models. The most recent science suggests that
    Greenland too has a threshold after which, in the words of a 2018 study in Nature
    Climate Change,the ice sheet enters a state of irreversible mass loss and complete
    melting is initiated.’ There are not one but two positive feedbacks that lead
    to this unstoppable melt. The first is that as the ice sheet thins and will exposed
