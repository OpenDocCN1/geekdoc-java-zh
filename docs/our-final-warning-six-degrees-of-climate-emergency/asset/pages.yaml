    Asia and Australia.


    Rising heat and declining rainfall will move the world into major structural food
    deficit at three degrees. Smallholder farmers across Africa and South Asia are
    wiped out by drought and heat, eliminating the livelihoods of a billion people.
    Temperatures cross critical thresholds in all major food-production regions, drastically
    reducing yields for the world’s key staple food crops. Even higher latitudes like
    Canada see crops scorched by intense heat. Precise outcomes depend on the ability
    of crops to adapt and farming zones to shift, but even so there is a heightened
    risk that famine will kill millions in developing countries, triggering refugee
    flows and presenting an existential challenge to human civilisation on a global
    scale. In the Himalayas glacier mass declines by 50%, reducing freshwater and
    harming food production. In the Andes and European Alps more than 90% of the snow
    and ice disappears. In the higher latitudes and tropics too much water is an increasing
    problem, with 200 million people affected by river flooding and resulting global
    damages rising by more than 1,000%.


    The effects of climate breakdown on nature are even more disastrous. A half of
    insects, a quarter of mammals, 44% of plants and a fifth of birds will lose more
    than half their climatic range by the end of the century with a global temperature
    rise of three degrees. In North America, two-thirds of bird species face extinction.
    With coral reefs already gone, marine heatwaves take a deadly toll on remaining
    oceanic ecosystems from Australian kelp forests to Antarctic krill. There is no
    longer any thing as an ‘invasive species’ because every species on Earth has to
    move alongside climate zones shifting at several kilometres per year. Those that
    fail to keep up are wiped out, contributing to an emerging mass extinction of
    geological significance.


    Then there are the three-degree tipping points. Unless deforestation is dramatically
    curbed, global heating of three degrees pushes the Amazon'
