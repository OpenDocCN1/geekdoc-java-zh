    # Hurricane warning


    The largest and most powerful convective storms on Earth are hurricanes. These
    tropical cyclones form over areas of warm ocean when groups of thunderstorms converge
    and begin to rotate. If conditions are favourable, an enormous vortex forms, causing
    intense rainfall and destructive winds surrounding a characteristic clear central
    eye only a few kilometres wide. Tropical cyclones are known as typhoons in the
    western Pacific and hurricanes in the eastern Pacific and Atlantic, and figuring
    out precisely how they will change in a warming world is a question that has long
    bedevilled researchers.'
