- img_proc: true
  md: 'safety experts spend millions of dollars trying to reduce the odds still further.
    Nuclear power stations cost many additional billions to build because multiple
    redundant safety systems aim to keep the odds of catastrophic failure down to
    infinitesimal odds. Yet the chances of a six-degree outcome for our planet are
    far higher than either of these and the impacts obliviously incalculably worse.


    No one should doubt that six degrees of global heating would represent a catastrophic
    failure of the Earth system. Nor should anyone doubt the chances of it happening
    are much greater than one in a million. I wouldn''t bet on the odds, but by my
    view is that the chances lie somewhere between one in ten and a hundred. If I
    am right, that six degrees is at least as likely as the lower temperature scenario
    of 1.5°C – a subject on which the IPCC has published a weighty report citing thousands
    of papers. I would personally not board an aircraft with a 1–10% chance of crashing,
    but in the case of the planet we are all on board together and have no other choice.
    Although we do not know the precise risks of a fatal disaster, a collision course
    of sort has already been set.


    In my research for this book I did a couple of relatively recent publications
    looking at what the title of one terms ‘very high greenhouse emission scenarios’.
    This paper was written by Ben Sanderson and colleagues in 2011, and published
    in the open-source journal Environmental Research Letters. What is most interesting
    about this study is not so much the specifics of their model-derived planet –
    although this reaches 5.1°C above the 1990 average global temperature by 2100
