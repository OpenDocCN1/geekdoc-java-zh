  md: '# Catastrophic failure


    A temperature increase of six degrees within the space of a century would be such
    an extreme shock to the Earth that it is difficult to make any confident predictions
    about what might result. Although six degrees has been within the upper bounds
    of what is considered possible by probabilistic climate model projections for
    the last three IPCC reports, I have found that researchers are reluctant to talk
    about it, and to my knowledge almost no papers have been published reporting on
    any efforts to try or understand a six-degree future world in detail.


    This rather odd gap might be because climatologists are human after all, and the
    scientists would prefer not to think about worst-case scenarios when there is
    clearly still time to hope for the best and focus on more moderate outcomes. carbon
    emissions and positive feedbacks necessary to raise the Earth''s temperature by
    six degrees as highly unlikely, and they do not want to risk the career damage
    and lost-funding opportunities that might come with being branded an ''alarmist''
    or a ''doomsdayer''. Another factor is that most climate models, on most runs,
    do not heat up to six degrees by 2100 even in the highest emissions scenarios,
    making this hard to simulate on computers and therefore difficult to discuss in
    a sufficiently informed way. Climate scenarios often accuse scientists of being
    overly pessimistic in their assessments; in my view, the reverse is probably true.


    Having said all that, given that a six-degree outcome has been considered plausible
    for the IPCC over 15 years, one might have expected the climate community to put
    some real effort into examining and modelling this World. By way of analogy, there
    are many far less likely outcomes that experts spend an inordinate amount of time
    trying to figure out and therefore avoid. For example, the chances of a plane
    crash for each individual flight are considerably less than one in a million,
    and yet airlineatief'
  merge: -1
