  md: 'and weather systems on a day-to-day basis. This seems to me like the ultimate
    Faustian bargain – we would gain some version of a future, but at the cost of
    our souls. The planet we would bring into being would not be the Earth I love
    and protect. I admit I cannot justify this position in scientific, rationalist
    terms. So I will instead state it truthfully – I find the prospect of an intentionally
    geoengineered planet morally and spiritually repellent. Yes, it’s better than
    a dead planet, but only just.


    Geoengineering proponents often talk about their sunshade plan only as an ‘emergency’
    option, when it is too late to stop warming by cutting carbon emissions. As I
    mentioned above, if current policies continue there is already as much as a 25%
    chance that we will push towards four degrees and thereby trigger the widespread
    collapse of human civilisation. We should not beguile ourselves with the prospect
    of quick fixes in future decades. We really do have to act now.


    But let me repeat: it is not too late, and in fact it will never be too late.
    Just as 1.5°C is better than 2°C, so 2°C is better than 2.5°C, 3°C is better than
    3.5°C and so on. We should never give up, and at no point should we hunker down
    and abandon any remaining hope of a better future. We still have several decades
    during which our choices will have a huge impact on how far global heating accelerates
    over the course of this century. My insistence will be that sacrifices made must
    be fairly shared – we cannot demand carbon cuts at the expense of entrenching
    or worsening human poverty and inequality.


    Pessimists sometimes gloomily ask me whether they should still have children,
    or whether the future is so bad that they must remain childless and lonely. My
    response is unequivocal: of course you should have children! Bear children, love
    them, and fight for their future with every fibre of your being. To my mind merchants
    of doom are no better than merchants. By all means grieve for what is lost, but
    focus that emotional pain into determination, resolution and renewed hope. Never
    despair, because there will always be someone whose life is not yet too late to
    save. That person might even be your child.


    So I invite you to join me in this pledge: I will fight on, even as the waters
    rise and the deserts advance. I will never give up, never will be passive or defeatist,
    even as the beauty of this living world of ours is eroded and'
