    close to the inner edge of the theoretical habitable zone that exists around a
    main sequence star like the sun – one estimate is that the Earth would be vulnerable
    to a runaway greenhouse at just 0.97 to 0.99 AUs. We have therefore always been
    at risk of getting too hot, but negative feedbacks have so far been able to keep
    our atmosphere at a tolerable temperature for billions of years. Water is still
