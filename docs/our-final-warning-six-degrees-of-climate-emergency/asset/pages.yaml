    However, this is just one model. Other coupled models do not necessarily agree
    on what is in store. For a 2017 paper looking at the outputs of six different
    models for a four-degree scenario found that the global number of tropical cyclones
    fall by a third, with decreases also in the number of the strongest Category 4
    and 5 storms. While Hawaii, Japan and Madagascar saw more of the most intense
    tropical cyclones, much of the rest of the tropics decreases. However, these models
    typically have lower resolution than HIFLOR, and may be missing what is happening
    at the smaller scale. One approach to try to avoid this pitfall and more accurately
    reduce the future changes in tropical cyclones is statistical downscaling, where
    the most intense (but much weaker) storms simulated in low-resolution climate
    models are assumed to represent the strongest Category 4 and 5 storms and counted
    accordingly. When scientists tried this in 2017, they found not only that ‘very
    intense tropical cyclones increase in most regions of the Northern Hemisphere,’
    but that the pattern of change closely resembled the GFDL approach. Models also
    seem to agree that the storms of the future, with more heat energy to fuel them,
