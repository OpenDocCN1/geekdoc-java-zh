  md: 'Conventional climate models have a resolution – often of 100-km by 100-km grid
    boxes – that is too low to accurately simulate hurricanes. This is unavoidable
    because a higher resolution model, effectively representing the world’s weather
    by minute over the entire Earth’s surface for several simulated decades at a time,
    would require impossible amounts of computational power. Models also have to simulate
    the Earth’s climate in three dimensions, with grid cells stacked vertically in
    the atmosphere and down into the depths of the oceans. In addition, they must
    also accurately simulate sea ice, continental ice sheets, mountains, clouds, vegetation
    and so on, totalling over one million lines of code and needing to be run on the
    world’s most powerful supercomputers. (The UK Met Office’s three Cray XC40 supercomputers
    occupy the same space as a tennis court and run 14 trillion arithmetic operations
    per second.) High-resolution atmosphere-only models that aim to better represent
    smaller-scale features like tropical cyclones to neglect the ocean – but this
    means they cannot properly simulate the way the strongest storms are supercharged
    by changing sea temperatures.


    To address this conundrum, in 2015 scientists at the Global Fluid Laboratory in
    Princeton, New Jersey, took an earlier ‘coupled’ ocean and atmosphere model and
    increased the atmospheric and land surface resolution to 25-km boxes, while saving
    resources by keeping the ocean component at a relatively low resolution. The result
    – which they termed the ‘High-Resolution Forecast-Oriented Low Ocean Resolution’
    model – turned out to be surprisingly successful. Its control output of 300 simulated
    years of tropical cyclone occurrences looks strikingly to where these storms have
    been observed to occur in the real world. The higher resolution of the model also
    meant that it was much more successful than previous models in simulating the
    most intense Category 4 and 5 storms. The scientists further tested HiFLOR by
    running retrospective seasonal forecasts for 1997 and 1998, finding that the model
    did a remarkably good job in forecasting where the strongest storms did in fact
    each year.


    Armed with these relatively successful test runs, the GFDL experts ran HiFLOR
    in a high-CO₂ world to see what would happen to the number, geographical extent
    and intensity of tropical cyclones. They found that not only would the hotter
    future see more tropical cyclones overall – in'
  merge: -1
  pgno: 166
- img_proc: true
  md: 'contradiction to most earlier models, which tended to show a reduction in hurricanes
    – but that the increase would be greatest for the most intense storms, the Category
    4 and 5 events that can cause major loss of life and property at landfall through
    flooding, wind damage and storm surges. Most striking of all, HiFLOR simulates
    an increase in the strongest storms that is so dramatic that it implies the need
    to add an additional ‘Category 6’ superstorm level to the current 1–5 categorisation
