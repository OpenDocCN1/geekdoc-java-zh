    Today, ‘Atlantic Meridional Overturning Circulation’ (AMOC, of which the true
    Gulf Stream is a small component) continues to have an oversized impact on Europe’s
    climate. It is thanks to the AMOC that north-western Europe is roughly 6°C warmer
    than equivalent maritime latitudes on the Pacific coast of North America. This
    current carries subtropical surface water in volume to the flow of all the world’s
    rivers north via the Gulf Stream to the British Isles and Scandinavia. The AMOC
    is so big that it has its own unit, the Sverdrup (Sv), equivalent to one million
    cubic metres of water moving at one metre per second. The AMOC has an average
    strength of around 17 Sv in the North Atlantic; compare this with the flow of
    the Amazon – the world’s biggest river – at a paltry 0.2 Sv. It transports ocean
    heat, equivalent to the output of a million or so nuclear power stations from
    the tropics to the higher latitudes. For this reason alone, the Northern Hemisphere
    as a whole is warmer than the Southern Hemisphere, because ocean heat is transported
    from the south across the equator and into the North Atlantic. A fictionalised
    AMOC shutdown was the scenario depicted in the 2004 film The Day After Tomorrow;
    while the giant tsunami hitting New York might have been stretching things, it
    is widely agreed that a total AMOC collapse has the potential to plunge Europe
    back into decades of sub-zero winters and destabilise weather across the globe.


