    in 2016, reports: ‘The probability of megadrought is close to 100% if Southwest
    temperatures rise by 5°C or more’ regionally, as is predicted in a four-degree
    world. The landscape will change utterly as the region’s characteristic pine and
    forests die from drought or are consumed by beetle infestations and fire. Megadroughts
    in the past have been linked with the collapse of pre-industrial civilisations
    like the Anasazi, Maya and Angkor. Now it is our own industrial civilisation that
    is on the line. In their Science Advances the researchers remind that ‘an aggressive
    reduction in greenhouse gas emissions cuts megadrought risks nearly in half.’
    But in the four-degree world it will be too late.


    The drying trend is so profound that more than half of the world’s surface will
