    # The Arctic carbon bomb


    Planet Earth has now entered the endgame, and four degrees is unlikely to be our
    final destination. By this stage large-scale feedbacks have kicked in, threatening
    to turn the heating process into an unstoppable upwards spiral. The epicentre
    of this is in the Arctic, where the entirety of the circumpolar permafrost region
    is now in the melt zone. That means 15 million square kilometres of collapsing
    ground, with sudden craters opening in the middle of forests, lakes filling or
    draining away in a matter of hours, and millions of tonnes of methane bubbling
    out of the thawing mush that was once the frozen Arctic. Methane is roughly 30
    times as potent a global warming gas as CO₂, and methane released from warming
    wetlands around the world will by now be on course to raise world temperatures
    by another'
