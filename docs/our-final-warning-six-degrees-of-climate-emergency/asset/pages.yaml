  md: '# Headline of the century


    It happened in 2015. The event made the news, although only for a day or two,
    before normal service – terrorism, politics, sport, celebrity gossip – resumed.
    You could therefore be almost forgiven for not noticed what might be considered
    the most important news story of the entire century so far.


    To its credit, the Met Office (the UK’s meteorological service) put out a press
    release. This noted that, ‘for the first time, global mean temperature at the
    Earth’s surface is set to reach 1°C above pre-industrial levels’ (‘pre-industrial’
    was defined by the Met Office as 1850–1900). Human activities had, the scientists
    pointed out, now managed to cause a degree of global warming over and above what
    would have been the planet’s natural temperature otherwise. There was no mystery
    about the main driver: look no further than the two trillion tonnes of carbon
    dioxide (henceforth CO₂) that have been poured into the Earth’s atmosphere mainly
    through the combustion of fossil fuels since the start of the Industrial Revolution.


    With one degree already in the bag, some historical comparisons are in order.
    Just over a century of unbridled fossil fuel use, humanity has returned atmospheric
    CO₂ concentrations to levels last seen in the Pliocene, around three five million
    years ago. As a result, global surface temperatures are expected to go on rising
    for a long time yet, but the thermal inertia of the planet – the centuries to
    millennia to warm the abyssal depths of the oceans and the colossal bulk of the
    Greenland and Antarctic ice sheets – means that the temperature rise lags some
    way behind the ‘forcing’ effect of increased greenhouse gases. As we will see,
    there is much more still to come.


    Most of the global warming has gone into increasing the heat content of the oceans.
    The latest estimates published in 2019 by the IPCC that are'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'about 6 zettajoules of additional energy are accumulating in the upper oceans
    every year. A zetta is a big number: 6²¹ is a 6 followed by 21 zeroes, or 6,000,000,000,000,000,000
    joules. For comparison, humans use about half a zettajoule per year in our total
    global energy consumption. A better visualisation might be to quantify all this
    extra energy in a more evocative unit: the heat released by the Hiroshima atomic
    bomb. Six zettajoules of energy equates to the same amount of heat as three Hiroshima
    atomic bombs exploding in the oceans every second. Count them: 3, 6, 9, 12, 15,
    18 ...


    In late November 2018 the World Meteorological Organization (WMO) confirmed the
    UK Met Office''s preliminary diagnosis. Based on five independently maintained
    global temperature data sets, the WMO in its annual State of the Climate report
    revealed that the global average temperature between 2014 and 2018 was 1.04°C
    before-industrial levels. In other words, we are now definitively living in the
    one-degree world. For me, seeing this announcement was a particularly significant
    moment, because when I wrote the original Six Degrees book nearly a decade and
    a half ago this one-degree would still lie in the future. For the purposes of
    this book it is as if we have moved forward a chapter: what was once the future
    is now the present. If we don''t succeed in cutting back carbon emissions in time,
    the increasingly terrifying impacts detailed in later chapters – of two, three,
    four degrees and even higher – will one day become our present. This is our final
    warning.


    # The view from Mauna Loa


    Mauna Loa, the gigantic shield volcano that sits at the centre of the Big Island
    of Hawai’i, is so tall that its summit protrudes above most of the island''s active
    weather. On the east side of the mountain, as the winds hit and forced to climb
    the slopes, they cool, form clouds and drop torrents of tropical rainfall. This
    makes Hilo, the island’s biggest town, one of the wettest settlements in the United
    States. Drive through the glassy flows on the long haul up the flanks of the volcano,
    however, and you will quickly leave the rain clouds far below you. Conditions
    to the summit'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'are sub-Arctic, with only an inch or two of precipitation each year, much of
    that in the form of snow.


    The paved road ends at the 3,200-metre contour line, where a group of antiquated
    buildings scattered across the volcanic debris together comprise the Mauna Loa
    Observatory. The Observatory is not high as the solar telescopes that cluster
    atop the 4,207-metre summit of Mauna Kea, visible seemingly floating over the
    cloud layer 40 kilometres to the north. It is, however, arguably more historic,
    certainly from an earthly perspective. Was here that atmospheric chemist Charles
    Keeling began collecting samples of atmospheric CO2 in 1958, seemingly on a whim
    and with little official support, by pioneering monitoring equipment that he designed
    himself.


    Keeling had that measuring CO2 lower in the atmosphere was pointless, because
    the levels fluctuated constantly as a result of emissions from car exhausts, industrial
    chimneys, vegetation growth and so on. Thanks to its elevation, Mauna Loa rose
    above all day-to-day noise, and Keeling’s measurements were the first in the world
    to show that CO2 mixed at high altitudes through the global atmosphere was increasing,
    in a sawtooth upwards pattern now known as the ‘Keeling Curve''(probably the most
    famous global warming-related graph of all time). Charles Keeling died in 2005,
    but appropriately his efforts have been continued by his son Ralph, also an atmospheric
    chemist. Ralph Ke has made his own subsequent discoveries, such as the oxygen
    content of the air is decreasing commensurately with our consumption of fossil
    fuels, as airborne O2 is combined with carbon extracted from underground to form
    the gas CO2.


    When Charles Keeling began his measurements in 1955, the rarefied air atop the
    lava fields of Mauna Loa contained CO2 at a ratio of 35 parts per million (ppm),
    already substantially higher than the pre-industrial concentration of 278 ppm.
    On 10 May 2013 the Scripps Institution for Oceanography, which maintains the Observatory,
    made a landmark announcement. For the first time in human history, CO2 levels
    had briefly touched the 400 ppm threshold. ‘There’s no stopping CO2 from [permanently]
    reaching 400 ppm,’ commented Ralph Keeling sadly. ‘That’s now a done deal. But
    what happens from here on matters to climate, and it’s still under our control.
    It mainly comes down to how we'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'continue to rely on fossil fuels for energy.'' Perhaps no one was listening,
    because at the time of writing the atmospheric concentration of CO2 has hit 408
    ppm. This figure will already be out of date by the time you read this book. You
    can follow the relentless upwards progress of the Keeling Curve in real time on
    Twitter, via @Keeling_curve.


    The Keeling Curve is a useful reality check, one that cuts through all the noise
    and confusion of the climate and energy debates. Unlike the slopes of the huge
    volcano on which it is measured, the initially gentle curve gets steeper the higher
    you go. That means that the rate of CO2 accumulation in the atmosphere is steadily
    increasing, from roughly 1 ppm in the early years up to 2 ppm annually today.
    There is no visible slowdown, no downward blip, to mark the implementation of
    the Kyoto Protocol, still less 2009''s Copenhagen ''two degrees'' commitment or
    the landmark Paris Agreement of 2015. All those smiling heads of state shaking
    hands, the diplomats hugging the podium after marathon sessions of all-night negotiating
    – none of that actually made any identifiable difference to the Keeling Curve,
    which is the only thing that actually matters to the planet''s temperature. All
    our solar panels, wind turbines, electric cars, lithium-ion batteries, LED lightbulbs,
    nuclear plants, biogas digesters, press conferences, declarations, pieces of paper;
    all our shouting and arguing, weeping and marching, reporting and ignoring, decrying
    and denying; all our speeches, movies, websites, lectures and books; our announcements,
    carbon-neutral targets, moments of joy and despair; none of these to have so much
    made the slightest dent in the steepening upward slope of the Keeling Curve.


    This does not make us powerless prisoners of fortune. Nor trend continues for
    ever, and just because recent history has been all one way does not mean the future
    must necessarily follow suit. These emissions are extra-terrestrial – they come
    from our everyday activities. Indeed they are an inescapable part of modern civilisation.
    We get a sense of the sources, and the magnitudes, from the annual Global Carbon
    Project report. On average, every year over the last decade we transferred 35
    billion tonnes of CO2 from the geological reservoirs (that''s coal, oil and gas)
    into the atmosphere. This was augmented by 6 billion tonnes of CO2 from ''land-use
    change'' (that''s deforestation, ploughing up new farmland and so on). About 9
    billion tonnes of this new CO2 dissolved in the oceans,'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'and 12 billion tonnes was taken up on land by vegetation and soils. That left
    a remainder of about 18 billion tonnes to accumulate in the atmosphere and drive
    the relentless upward climb of the Keeling Curve. (The imbalance of 2 billion
    tonnes is due to uncertainties.)


    There are small changes in the carbon budget year by year, sometimes cause great
    excitement. In 2014, 2015 and 2016, for example, there was little to no annual
    growth in fossil fuel emissions, which seemed to have stabilised for the first
    time. Cue premature celebrations. But had the world reached an early peak in emissions?
    No. In 2017 growth resumed again, reaching a new high of 36.8 billion tonnes despite
    a record installation of 161 gigawatts of renewable generating capacity in 2016
    alone. In 2018 emissions continued to accelerate, however, increasing nearly 3%
    on the previous year and pushing CO₂ levels to a new historic high. In 2019 growth
    slowed somewhat, to 0.6% above 2018, thanks to a reduction in coal use in Europe
    and the US. But what we need is carbon cuts, not slower growth – urgently.


    So what''s going wrong? Well, it''s a matter of scale. The world is hungry for
    new energy: primary energy demand keeps increasing, and 80% of that is supplied
    by new fossil fuels. renewables (not including hydro) in 2019 accounted for only
    4% of global primary energy, still much too small a proportion to have any discernible
    effect on the upward trend in overall emissions. This is why wind and solar have
    so far not measurably dented the Keeling Curve. According to recent estimates,
    the installation rate for clean energy sources would have tenfold to arrest the
    annual growth in fossil fuels.


    Meanwhile, as the measurements in the Observatory buildings continue to show relentlessly
    rising CO₂, Mauna Loa itself is experiencing the effects of the resulting climate
    warming. Temperatures are gradually rising, and night frosts are rarer than they
    were when Charles Keeling began to keep records with his-made equipment. Mauna
    Loa may sit above most weather, but no part of the world can entirely escape global
    heating. Snowfall is less frequent and the snow melts in springtime – while plant
    life on the slopes of the mountain is changing with every year that passes. In
    1958 Charles Keeling had to design complex and sensitive equipment to discern
    subtle changes to the Earth''s environment. Now changes are plain for all to see.'
