  md: '# Read the README!


    There is a README file in the root folder, but also in each chapter, sometimes
    also in the projects. This will help you to easily use the scripts, set up a project,
    etc.


    The README of most chapters also has a “Read more” section where you can find
    links to more info about the topics of that chapter.


    Adding a README file is a good practice, even when you are the only person working
    on a project! Minimally it needs to contain a title and description, how to work
    on the project and how to build, test and run it.


    # Guidelines


    A README uses a list of conventions for the formatting, the ones used most in
    this book:


    +   * `##` or `###` for titles

    * `*` for bullets

    * `[title](link)` for links

    * `Three single ``` ` before and after a code block


    # Example


    This is a short example file:


    ```

