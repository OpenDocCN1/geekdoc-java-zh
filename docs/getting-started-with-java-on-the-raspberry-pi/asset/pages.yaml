  md: "# Chapter 9: Pl4J\n\nJSON = JavaScript Object Notation¹⁰¹ is a commonly used\
    \ way to structure data. For\nexample:\n\n```\n{\n  \"type\": \"measurement\"\
    ,\n  \"data\": {\n    \"sensor1\": 123,\n    \"sensor2\": 456\n  }\n}\n```\n\n\
    This format allows organizing data in a human-readable way which is also easy\
    \ to be parsed\nby a programming language.\n\nXML = Extensible Markup Language¹⁰²\
    \ is another way to achieve this. The same data can\nstructured like this, but\
    \ the formatting is up to the developer:\n\n```\n<message>\n  <type>measurement</type>\n\
    \  <dataset>\n    <data source=\"sensor1\">123</data>\n    <data source=\"sensor2\"\
    >456</data>\n  </dataset>\n</message>\n```\n\nWhich format is best, is open for\
    \ discussion, but with the current frameworks, there is\nbig performance issue\
    \ between the parsing of both. Just try to stick to one method.\n\n# Running the\
    \ examples\n\nSome of the examples can be started directly from Visual Studio\
    \ Code (VSC) on the Pi if you have\nMaven and the Java plugins installed in VSC.\n\
    \n> ¹⁰¹https://en.wikipedia.org/wiki/JSON\n¹⁰²https://en.wikipedia.org/wiki/XML"
