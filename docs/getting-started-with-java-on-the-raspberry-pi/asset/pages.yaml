  md: '# Different pinning numbering schemes


    As you can see in the header tables, there are three different numbers.


    # Board (pin) number


    These are the logical numbers in the header where one row has all the even numbers
    and the odd ones are on the other row.


    ![](img/d3f61a09bb1d08353ea609d038a99011_111_0.png)


    # BCM number


    BCM refers to the "Broadcom SOC channel" number, which is the numbering inside
    the chip which is used on the Raspberry Pi.


    These numbers changed between board versions as you can see in the previous tables
    for the 26-pin header type 1 versus 2, and or not sequential.


    # WiringPi number


    WiringPi55 is developed by Gordon Henderson56 and installed by default on the
    Pi when you use Raspberrybian. You can easily check the version and pins with
    the commands "gpio -v" and "gpio readall". This is the result on a Pi 3B+:'
