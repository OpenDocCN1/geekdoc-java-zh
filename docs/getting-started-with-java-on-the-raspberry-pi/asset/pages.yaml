    # Example 1: Digital output with RGB-LED


    Let''s start with the easiest example, using GPIOs as output pins. We will use
    three of them to control the red, green and blue of an RGB-LED.


    # Connecting an RGB-LED with a breadboard


    ![](img/d3f61a09bb1d08353ea609d038a99011_210_0.png)


    Make sure you have a common cathode LED by directly connecting one of the color
    pins to the 3.3V output of the Pi and use a resistor (330Ω will work for most).
    Then connect each of the RGB pins to a GPIO and the common pin to a ground pin.


    ![](img/d3f61a09bb1d08353ea609d038a99011_210_1.png)'
