  md: '# # Just a thought:Abbreviations


    As a developer, there are some "important" abbreviations you need to know.


    YAGNI


    “You Aren’t Gonna Need It”* is used to point out the fact you don’t need to add
    code until you need it. Sometimes it feels right to add some additional methods
    which one could day be useful. But as long as you didn’t finish and test the code,
    you cannot be sure what additional code you’ll need in the future. And it doesn’t
    make sense to write code which may never be used at all.


    KISS principle


    At work (?) I remember from time to time I love KISS. But what means “Keep It
    Simple, Stupid*: The goal of the KISS principle is to keep your code as simple
    as possible. Breaking complex methods into smaller ones, is one of the easiest
    ways to achieve this. If your method has a name like “doThisAndReturnThat”, you
    already should notice you could break it into three smaller ones.


    POGE


    Always keep the Principle of Good Enough in mind when you develop software. Users
    will go for anything that fulfills their needs, even if more advanced solutions
    are available. It is better to go for a quick solution, than to keep working forward,
    unreachable goal... At my CodeDojo club is already working on the same Minecraft
    project for years, and it never finishes as he keeps adding new features. Same
    problem exists in many software teams. Deliver fast, fail fast, improve even faster
    and never forget: “Perfect is the enemy of good”.


    NIH


    Engineers tend to suffer the “Not Invented Here” Syndrome. They keep reinventing
    the wheel while they could benefit by adopting existing solutions. This often
    is caused by the idea it is cheaper to do yourself instead of paying for a license
    or hiring someone with experience in the matter. As a good developer, if you need
    to do something, your first step should be to investigate if there are existing
    frameworks, methodologies, program languages... which can solve your problem.


    DRY


    The “Don’t repeat yourself” principle, aims to divide your application into small
    blocks with a single responsibility. Each block may only appear once in your system.
    Tools like SonarLint integrate with your IDE, alert if you have identical or similar
    code at multiple places. You don’t always need a tool, if you are repeating yourself,
    take a step back and look at how you can improve and simplify your code. If you
    are not following this approach, you end up with a “WET solution” aka “Waste Everyone’s
    Time”.'
  merge: -1
