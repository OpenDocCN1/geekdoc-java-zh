  md: '# Chapter 2: Tools and hardware used in this book


    # Raspberry Pi


    Just when I started working on this book, the 4th edition of the Pi became available.
    Combined with a 4K display it turned out be a perfect companion while testing
    and building stuff. It''s not required, but maybe it''s a good idea to buy a fan
    as the board can become hot. But WOW, what a magnificent device! Most of the writing
    and coding for this book was done on a Pi 4! And this was also the first time
    I used a 4K display, another WOW! Two code windows open on one single screen,
    each using less than half of screen, and still space for other tools like a terminal
    window.


    ![](img/d3f61a09bb1d08353ea609d038a99011_19_0.png)


    As you always risk “burning” a GPIO pin during experiments, most of the experiments
    were done on some older - cheaper - Pi 3 boards.


    Keep in mind, you can use the same SD card with Raspberry and Java JDK on different
    Pi’s (except the oldest ones with an ARMv6 processor, see “Chapter 4: Java” >
    “Install Java on a Pi”). When you have a working SD card with all the applications
    you need, you can take it out from a Pi 4 and use it with a Pi 3 board or vice-versa.


    # Prepare the Pi


