  md: '# Just a thought: Switching social


    So I decided to rehab! I wanted to take back control of my online existence. My
    Google emails are forwarded to my domain and everyone got my self-hosted address.
    I also stopped Google Calendar and switched completely to my work calendar. Which
    makes it even easier to have one place to back work and personal matters. Google
