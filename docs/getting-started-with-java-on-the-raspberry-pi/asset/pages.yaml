  md: '# Chapter 2: Tools and hardware used in this book


    # Common Anode


    Common Cathode


    ![](img/d3f61a09bb1d08353ea609d038a99011_40_0.png)


    Red Common Green Blue


    ![](img/d3f61a09bb1d08353ea609d038a99011_40_1.png)


    Pins of an RGB-LED


    The common pin is the longest one, in the order red-common-green-blue.

    Some (Arduino) starter kits, contain an RGB-LED attached to a small PCB with breadboard
    pins. In that case, you need to check the board itself for the correct connections.
    In the picture above you can see an example that has clear indications on the
    back.


    # LED strips


    LED strips are available in these two used "flavors": WS2812B (improved version
    of the WS2811, also known as the AdaFruit NeoPixel) versus WS2813 and their main
    difference is the number of connections (3 versus 4).

    Two important notes for LED strips:


    +   - it''s not enough to connect power to them, they won''t do anything until
    a controller sends data.

    - they need a lot of power so don''t take power from the Pi, but use an external
    power supply.


    # Power supply for LED strips


    To know which power supply you need, some calculation is required... Check the
    datasheet of the strip you are using to know how much current a single LED in
    the strip uses at maximum brightness. As an example, take one which uses 60mA
    max. per LED. By the way, this is only the case for white, so the real use will
    be lower if you are using colors only.'
  merge: -1
