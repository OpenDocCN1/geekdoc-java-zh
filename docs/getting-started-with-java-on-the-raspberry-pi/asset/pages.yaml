  md: '# What can we do with this?


    # Web colors


    The most known use of hex bytes is the definition of colors in HTML. Colors are
    defined with three bytes for red, green and blue. Some examples:


    +   - #FFFFFF is full R+G+B = white

    - #FF0000 is red only

    - #D3D3D3 is light grey with value 211 for red, green and blue


    You can try this out on [this page of w3schools.com]².


    This is also the color-coding we can use to define the value for RGB-LEDs and
    LED strips. We will need this later in this book.


    # Controlling a numeric segment display


    Let''s make a Java project to control a numeric segment display where we can fully
    use the possibilities of 8 bits in a byte.


    ![](img/d3f61a09bb1d08353ea609d038a99011_184_0.png)


    Full test set-up with running JavaFX application


    # The LED numeric segment display


    Each segment is an LED with its own pin so it can be controlled separately. To
    easily understand which segment will be used, they are identified as A till H.


    > ²https://www.w3schools.com/colors/colors_rgb.asp'
