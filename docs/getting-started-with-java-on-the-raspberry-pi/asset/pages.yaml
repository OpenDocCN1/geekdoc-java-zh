  md: '# Chapter 11: Message Queues


    +   $ sudo apt-get install wireshark

    $ sudo groupadd wireshark

    $ sudo groupadd wireshark

    $ sudo usermod -a -G wireshark /usr/bin/dumpcap

    $ sudo chgrp wireshark /usr/bin/dumpcap

    $ sudo chmod 750 /usr/bin/dumpcap

    $ sudo setcap cap_net_raw,cap_net_admin-eip /usr/bin/dumpcap


    After this, log-off or restart the Pi and you can start Wireshark, select your
    cable or WiFi connection and watch the messages transmitted over the network.


    +   In the sources, you can find a Wireshark trace file with the communication
    between my Pi and Arduino setup.


    With the filter "ip.addr == 192.168.0.213" you will get the messages from the
    Arduino in your test setup. In packet 13 you can see an LED-command message which
    was successfully sent from Pi (192.168.0.213) to Arduino (192.168.0.128). In the
    details of the packet (middle window) and the bytes (bottom window) you can find
    the full command "4:2:25:22:0:0:255".


    ![](img/d3f61a09bb1d08353ea609d038a99011_355_0.png)


