  md: '# Disable screensaver


    When you build a dashboard-like application or, for example, a home automation
    interface, you might want to disable the screensaver so the screen is never put
    off. By default, there is no easy to do this in Raspian OS, but we can fix this
    easily by installing “xcreensaver”.


    ```

    $ sudo apt install xcreensaver

