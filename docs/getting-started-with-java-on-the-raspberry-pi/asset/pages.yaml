  md: '# Interview with Mark Heckler


    Mark Heckler, @mkheck1, Spring Developer & Advocate at Pivotal Software (VMware),
    Java Champion


    Why has Pivotal (VMware) chosen to provide Spring framework as free and open software,
    while you are a company and need to make money out of this?


    Spring''s origins are free and open. When John Johnson published his groundbreaking
    book Expert One-on-One JEE Design and


    in 2002, he included source code showing how to solve some problems and pain points
    in enterprise Java. This code served as the foundation for Interface21, which
    eventually became known as the Spring Framework. It''s in our DNA!


    VM has many ways to make money, and all offerings contribute to that goal... but
    there are many goals within a company and its portfolio. If you provide the best
    tools for developers that can solve their problems, even if many of these offerings
    with no cost whatsoever, you''re in a far better position to partner with those
    devs on problems where it makes sense for them to invest. By putting the company
    first, everyone wins.


    Pivotal has been acquired by VMware, will this cause changes in the way Spring
    is developed and available?


    Nope! Even the spring.io (including start.spring.io) URLs are the same. Same approach,
    some unmatched developer productivity. ->


    As a developer, do you believe Java and Spring are a good match with the Raspberry
    Pi?


    First let me say that none of the Pivotal portfolio of projects has ever specifically
    targeted the Raspberry Pi, to my knowledge. - That said, as an IoT enthusiast
    & advocate myself, I''ve been deploying Spring code to the Pi for a few years
    now. Like all things Spring, it works. And with the Pi becoming more capable,
    there is no shortage of things you can do with Spring on the Pi... as your best
    monitors!


    Will the Spring platform be extended for "small" computers like the Pi?


    There is nothing specifically in the working targetSystem on a Chip (SoC) computers
    like the Pi within Spring, but there are some upcoming developments that will
    apply very nicely. Stay tuned! I think 2020 is going to be a very good year :-


    Why is now the perfect time to learn Java?


    Considering Java''s origins, it was made with small devices in mind! Of course,
    it could handle massive problems and workloads, which is why it was naturally
    embraced in tackling enterprise-grade problems pretty early on. But Java is again
    becoming smaller, more streamlined, and targeted toward efficiency. Between that
    and the first release cadence, we are seeing some great innovations that make
    now perhaps the most exciting time for Java since its initial splash.


    ![](img/d3f61a09bb1d08353ea609d038a99011_276_0.png)'
