  md: '# Example 4: Reactive data


    Reactive programming¹¹¹⁷ uses a different approach compared to the previous examples
    where data can be requested from a REST-service. In a reactive system, continuous
    streams are used. For instance, to update a user interface based on the incoming
    data.


    Trisha Gee in the interview "Chapter 3: Choosing an IDE" and Josh Long (Spring
    Developer Advocate at Pivotal, @starbxman¹¹¹⁸ worked together on a blog series¹¹¹⁹
    in which they showed the power of reactive data produced by a Spring application.


    Their examples use a Kotlin line to continuously send stock values, a Java client
    to receive this data and a JavaFX client to visualize the updating prices in real-time
    on a line chart.


    In this application example, we will achieve that same functionality on the Pi,
    based on the example from "Chapter 9: Pi4" with the distance sensor. We use the
    same wiring with rework of the code, integrated into a Spring application.


    # The code


    This project uses three classes in this structure:


    ![](img/d3f61a09bb1d08353ea609d038a99011_315_0.png)


    Full sources can be found in: Chapter_10_Spring > java-spring-stream


    An extra dependency needs to be added to pom.xml:


    > ¹¹⁷https://en.wikipedia.org/wiki/Reactive_programming

    ¹¹⁸https://twitter.com/starbxman

    ¹¹⁹https://trishagee.github.io/presentation/coding_duel/'
