  md: '# JDK providers


    All the sources of the Java Development Kit itself are open source and can be
    found on GitHub > OpenJDK³². So if you would like, you can build your own JDK
    from these sources. Luckily a lot of others have done this already and provide
    up-to-compiled versions.


    A full list is available on the jchoice website³³. Let''s take a quick look at
    some of them.


    # Oracle


    This is the "mother" of all JDK''s, the most expensive one for commercial use
    as you need a contract with Oracle for non-personal and non-development use.


    On the other hand, Oracle is still the main contributor to OpenJDK. There is a
    nice overview of the differences between Oracle JDK and OpenJDK in this post on
    the Baeldung site⁴⁴.


    # AdoptJDK


    If you want to have the most-to-date JDK for your development PC, this is the
    place to be³⁵. All the binaries and scripts are provided here.


    On the AdoptJDK website, you will find multiple versions for different platforms,
    all ready to install with a few.


    ![](img/d3f61a09bb1d08353ea609d038a99011_67_0.png)


    # Azul Zing and Zulu


    Azul³⁶ provides commercial support with Zing if you need a JVM to run a big application
    in a cluster to handle big loads of data. Also have Zulu is a build of OpenJDK
    and is available for


