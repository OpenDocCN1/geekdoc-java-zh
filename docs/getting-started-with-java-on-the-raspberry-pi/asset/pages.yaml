  md: "# One class for all code to control the RGB-LED\n\nFollow the code to see how:\n\
    \n+   - The GPIO controller is initialized.\n- The three GPIOs are initialized\
    \ for each pin.\n- Each color is toggled on/off for 10 times.\n- The three colors\
    \ are all on for 5 seconds.\n- The GPIO controller is shut down.\n\n```\npublic\
    \ class App {\n    private static final Pin PIN_RED = RaspberryPin.GPIO_23; //\
    \ BCM 13\n    private static final Pin PIN_GREEN = RaspberryPin.GPIO_26; // BCM\
    \ 12\n    private static final Pin PIN_BLUE = RaspberryPin.GPIO_14; // BCM 11\n\
    \n    public static void main(String[] args) {\n        System.out.println(\"\
    Starting output example...\");\n\n        try {\n            // Initialize the\
    \ Gpio controller\n            final Gpio controller = GpioFactory.getInstance();\n\
    \n            // Initialize the led pins as a digital output pin\n           \
    \ final GpioDigitalOutput ledRed = \n                gpio.provisionDigitalOutputPin(PIN_RED,\
    \ \"RED\",\n                PinState.LOW);\n            final GpioDigitalOutput\
