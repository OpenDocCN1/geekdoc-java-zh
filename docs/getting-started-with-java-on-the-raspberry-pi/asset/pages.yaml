  md: '# # Chapter 8: Bits and bytes


    A lot of interactions with the GPIOs require some understanding of bits and bytes.
    Let’s dive into a quick summary.


    Very short:


    +   - All logic inside the brain of a computer is a bit which can be 0 or 1 (off
    or on).

    - When you combine 8 bits, you just get a byte.


    ![](img/d3f61a09bb1d08353ea609d038a99011_177_0.png)


    But in the next years, quantum computers should become available, and they use
    qubits which can be 0 AND 1 the same time, what is called superposition¹. The
    first “Proof of Principle” quantum computers are already available and they use
    20 to 50 qubits. This looks a very small number compared to the Gigabyte memory
    and storage we now have on PCs, even the Pi.


    But quantum computers use their qubits at the same time, if there are 20 qubits,
    2^20 of parallel computations can be achieved and solve problems which are impossible
    to solve with current supercomputers. Breaking encryption keys, simulating the
    effect of new medicines, correctly predicting the weather.... are just a few examples.


    The goal is to reach a quantum computer with 300 qubits. And the value 2³ bigger
    than the number of atoms in the whole universe² If a quantum computer with 50
    qubits is capable of breaking all known encryptions in seconds, what will one
    with 300 qubits be able to?


    Programming a quantum computer will be very challenging even as the most intelligent
    physicist and mathematicians find it hard to understand the principles of all
    quantum stuff³. So, let’s stick to our OR 1 for now :-


    ¹https://en.wikipedia.org/wiki/Quantum_superposition


    ²https://www.quora.com/What-is-2-raised-to-the-power-of-300


    ³https://hubpages.com/education/QuantumVagary'
  merge: -1
