  md: "# # Chapter 10: Spring\n\nSpring is one of the leading frameworks for (enterprise)\
    \ Java applications providing a set of features and programming conventions that\
    \ allows developers to program faster and easier. Other such frameworks are Micronaut^105\
    \ and Quarkus^106.\n\nSpring is developed by Pivotal^107, but available as an\
    \ open-source framework. The goal of Spring is to make it easier to develop applications\
    \ by removing a lot of \"boilerplate code\". For example, reading and writing\
    \ data in and from a database can be done with minimal code. The core idea of\
    \ Spring is to use dependency injection which allows you to write decoupled classes\
    \ that are tight at runtime when needed\n\nDependency injection is a system to\
    \ provide Inversion Of Control (IOC)^108 which is used to manage the relationship\
    \ between objects. As a developer, you don't need to take care of this relationship,\
    \ as the framework will handle that for you.\n\nBy using Spring-annotations (e.g.\
    \ \"Component\") POJO classes (Plain Old Java Object^109) get injected into others\
    \ so they can use their methods.\n\nLet's look at an example where we have a class\
    \ which can load sensors from a database:\n\n```\n@Component\npublic class SensorDao\
    \ {\n    // We use the generic abbreviation for this class: DAO = Data Access\
    \ Object\n    public List<Sensor> getSensors() {\n        // Database code needs\
    \ to be added here\n    }\n}\n```\n\nNow any other class in the application can\
    \ use this Component by auto-wiring to it, without the need to initialize it or\
    \ worry about the correct order of initialization.\n\n> ^105https://micronautaut.io/\n\
    106https://quarkus.io/\n107https://pivotal.io/\n108https://en.wikipedia.org/wiki/Inversion_of_control\n\
    109https://en.wikipedia.org/wiki/Plain_old_Java_Object"
