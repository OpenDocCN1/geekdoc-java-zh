  md: "# Enums to make the code easier to use\n\nTo make it easy to define which boards\
    \ are available and which relay we want to toggle in the application, three different\
    \ enum classes are used.\n\nThe first one defines which boards are used. As you\
    \ can stack four of them, but this example only uses two, the ones defined here\
    \ with their address as configured with the dip switches.\n\n```\npublic enum\
    \ Board {\n    BOARD_1(0x01);\n    BOARD_2(0x11);\n\n    private final int address;\n\
    \    Board(int address) {\n        this.address = address;\n    }\n\n    public\
    \ int getAddress() {\n        return this.address;\n    }\n}\n```\n\nEach board\
    \ has relays, with each a byte defining their channel.\n\n```\npublic enum Relay\
    \ {\n    RELAY_1(byte) 0x01);\n    RELAY_2(byte) 0x02);\n    RELAY_3(byte) 0x03);\n\
    \    RELAY_4(byte) 0x04;\n\n    private final byte channel;\n    Relay(byte channel)\
    \ {\n        this.channel = channel;\n    }\n\n    public byte getChannel() {\n\
    \        return this.channel;\n    }\n}\n```\n\nAnd finally, each relay has two\
    \ states: on and off defined by a byte value."
