  md: "# Example 3: Build a UI with FXML\n\nIn the previous JavaFX example application\
    \ and all the others in this book, a full code-only approach has been taken. This\
    \ means all JavaFX layout is defined in code.\n\nBut JavaFX also provides a way\
    \ of working where you can split the visual definition and the actions, by using\
    \ FXML-files. These files are in XML format and only define how your interface\
    \ needs to look, while the functionality is handled in code.\n\nLet’s look at\
    \ an example to explain this...\n\n# Generate an empty FXML project as a starting\
    \ point\n\nWe start by creating an project with the Maven archetype \"javafx-archetype-fxml\"\
    \ which will prepare a starting-point application.\n\n```\n$ mvn archetype:generate\n\
    \  -DarchetypeGroupId=org.openfx\n  -DarchetypeArtifactId=javafx-archetype-fxml\n\
    \  -DarchetypeVersion=0.0.1\n  -groupId=webtechie\n  -artifactId=javafx-fxml-minimal\n\
    \  -Dversion=0.0.1\n```\n\n> This script to create the JavaFX start project is\
    \ available in:\nChapter_07_JavaFX > scripts > gluonishq_create_empty_javafx_fxml_project.sh\n\
    \nOr you can immediately download the generated project from:\nChapter_07_JavaFX\
    \ > javafx-minimal-fxml\n\nWhen you open this project in the IDE you’ll see that\
    \ the visual part is in the resources-directory, while the logic is in the java-directory\
    \ as controllers."
