  md: '# Chapter 9: Pl4J


    While testing this example on another day, an expected output on the temperature
    screen appeared with "4emp" where it should be displaying "Temp".


    Apparently, when the text is too long for one line, it overflows the other line
    and the length of the string value needs to be checked before sending it to the
    LCD. We can use the "substring(beginIndex, endIndex)" method to achieve this,
    as displayed here with a test in "shell":


    ```

    1 jshell> String test = "Min/Max 2.22/4.44"

    2 test == "Min/Max 2.22/4.44"

    3

    4 jshell> test.length()

    5 $ == 17

    6

    7 jshell> test = test.substring(0, 16);

    8 test == "Min/Max 2.22/4.4"

    9

    10 jshell> test.length()

    11 $ == 16

    ```


    # Conclusion


    In this example, you learned how easy it is to get data from a public source and
    show it on the LCD. Of course, you could also show a sensor measurement or a database
    value or ... Again, your imagination is the only limit!'
