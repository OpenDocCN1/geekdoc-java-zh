    > Liberica JDK 12.0.2

    Liberica is a 100% open source java 12 implementation. It is built from OpenJDK
    which BellSoft contributes to. It is thoroughly tested and passed the JDK provided
    under the license from OpenJDK. The versions of Liberica for Windows x86, x64,
    Windows x86, Mac x64, ARM64_ also contain java 12. The version for Linux x86,
    ARM64 JavaFX contains Device IO API as additional modules and works with hardware
    acceleration. We provide suitable binaries for different hardware and OS combinations:

