- img_proc: true
  md: 'Just a thought: Learn by educating


    # Interview with Karen Mouws


    ![](img/d3f61a09bb1d08353ea609d038a99011_45_0.png)


    Karen Mouws @LimsKaren*, Educational Designer by day, Maker Educator whenever
    I can. Part-time adult and proud of it.


    The IT world is mainly a (white) male environment. Why is this a problem in your
    opinion?


    I firmly believe that diversity in a team or company will have benefits. Bringing
    multiple perspectives to the table helps identify hidden problems, novel solutions
    and challenges existing thinking patterns. A lack of diversity can cause a narrow
    scope in


    the long term and start excluding users if they don''t fit the profile of the
    happy flow.


    Getting more into IT is a mission well on its way: there are many initiatives
    out there, helping women ''break into'' the IT sector. A bigger challenge will
    be keeping them there. It is never easy to be "echo one" on the team or to into
    metaphorical walls, as your voice not being heard or constantly underestimated
    as a professional.


    What is your "plan of attack" to inspire kids to get involved in the digital world?


    Children and teens are already ignored in the digital world, now more than ever,
    but can get "stuck" on the consumption levels. Only a small group of them will
    start creating content, from funny videos to games. I need to think about this
    pattern on multiple levels: introduction, creative production and visibility.


    First of all, you can''t know what you don''t know: if no one introduces you to
    code as a fun tool, how will you try it out? That''s why I have such a big love
    for CoderDojo and WeGoSTEM, reaches thousands of children every year.


    But we also need to move beyond the first, intro: how do we keep them engaged?
    I think that where long term projects come into play. Other interests and hobbies
    will interming with learning to code or physical computing. For example, if you
    have a dog or cat at home, how not try to build a game that is controlled by them?
    I rarely opt for "more serious" projects, as I love the power of silly ideas to
    challenge ourselves.


    Visibility is important important as we need more role models. It is easy to think
    "oh is not for me" or "programming is for boys" if all the role you see are Adam
    Savage or Elon Musk. As inspiring they are, I would love to see Sophie Wang or
    Sion Giert on platforms as well.


    Free tools like Scratch*, Code.org, Blockly* and many more, allow children of
    any age to learn the principles of coding. When do you think they should switch
    from drag-and-drop based tools to "real" programming languages?


    Block-based coding is an amazing entry point for programming projects, as you
    can focus on the idea and the creativity, without the fear of making syntax mistakes
    or the frustration of missing a "; somewhere deep in your code. I''d say moving
    to written code could come around 12 years'
  merge: -1
