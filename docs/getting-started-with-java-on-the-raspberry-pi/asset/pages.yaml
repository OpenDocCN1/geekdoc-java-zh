  md: "# Maven pom-files used in this book\n\nThere are different ways to package\
    \ your application into a jar-file. Depending on the fact if you want a minimal\
    \ package size by providing the dependencies on the device itself, or want to\
    \ include all the dependencies inside the jar so you don't to worry about them.\
    \ Each of these options has its use-case, with the size of the jar-file as an\
    \ important factor.\n\nFor ease-of-use, in the examples in this book, we will\
    \ include the dependencies into the jar-file. To do this, we will use \"maven-assembly-plugin\"\
    . Keep in mind you need to update the \"mainClass\" value to reference the class\
    \ with your main-method. The value \"webtechie.App\" used here, is only an example.\n\
    \n```\n<build>\n  <plugins>\n    <plugin>\n      <groupId>org.apache.maven.plugins</groupId>\n\
    \      <artifactId>maven-compiler-plugin</artifactId>\n      <version>3.8.0</version>\n\
    \      <configuration>\n        <release>11</release>\n      </configuration>\n\
    \    </plugin>\n    <plugin>\n      <artifactId>maven-assembly-plugin</artifactId>\n\
    \      <version>2.2.1</version>\n      <configuration>\n        <descriptorRef>jar-with-dependencies</descriptorRef>\n\
    \      </descriptorRefs>\n      <archive>\n        <manifest>\n          <addClasspath>true</addClasspath>\n\
    \          <mainClass>webtechie.App</mainClass>\n        </manifest>\n      </archive>\n\
    \    </configuration>\n    <executions>\n      <execution>\n        <id>maven-assembly</id>\n\
    \        <phase>package</phase>\n        <goals>\n          <goal>single</goal>\n\
    \      </execution>\n    </executions>\n  </plugins>\n</build>\n```"
