  md: '# Using Mosquitto on the Pi


    # Installation


    To install the broker (= the Mosquitto application) we need to do three steps:


    +   - Make sure the update list on the Pi is up-to-date

    - Get and install the broker

    - Let it start when the Pi boots so we are sure the broker is always running


    We can now check if it is installed correctly by running:


    ```

    $ sudo apt update

    sudo apt install -y mosquitto mosquitto-clients

    sudo systemctl enable mosquitto.service

    ```


    ```

    $ mosquitto -v

    156980732: mosquitto version 1.5.7 starting

    156980732: Using default config.

    156980732: Opening ipv4 listen socket on port 1883

    156980732: Error: Address already in use

    ```


    The error "Address already in use" apparently can be ignored...

    We can also validate Mosquitto by listening to incoming messages on the default
    port 1883 with "netstat":


    ```

    $ netstat -listen

    Active Internet connections (only servers)

    Proto Recv-Q Send-Q Local Address Foreign Address State

    tcp 0 0 0.0.0.0:1883 0.0.0.0:* LISTEN

    tcp6 0 0 [::]:1883 [::]:* LISTEN

    ```


    We will need to know which other devices need to connect to. So we need the IP
    address of the Pi on which we installed Mosquitto. We can check this with the
    following command:


    ```

    $ hostname -I

    192.168.0.213 2a02:1811:bc04:4900:412e:b96a:d93c:b0a2 2a02:1811:bc04:4900:11fb:315f:\nb8e1:f5dc

    ```


    In this case, it''s "192.168.0.213".


    The same info can also be found with the following command which will give you
    more information about your network interfaces. In my case I''m using the wireless
    connection on "wlan":'
