  md: '# Interview with Alexander Belokrylov


    ![](img/d3f61a09bb1d08353ea609d038a99011_69_0.png)


    Alexander Belokrylov, @gigabel, CEO of BellSoft, Java enthusiast


    BellSoft makes a living by providing Liberica Java services, so why did you decide
    to distribute Liberica JDK for free?


    Java by its nature should be Free and Open Source. BellSoft is the company committed
    to freedom by releasing Liberica JDK. Our goal is to create the most useful Open
    binary distribution which makes the life of developers easier and we do it for
    free


    source with full transparency. On top of that, we provide commercial support to
    companies who want to have additional assurance and a top OpenJDK.


    You are the only JDK provider who has a Raspberry Pi version and integrates JavaFX,
    why did you go this extra mile?


    We are passionate about making Liberica JDK fully functional on Raspberry Pi.
    Our company has started this journey with the first release of Liberica JDK 9
    for the Raspberry Pi platform. We continue to actively support the ARM32 port
    within OpenJDK to bringing Raspberry Pi developers to modern JDK features!


    In a blog post you announced support for video in JavaFX on the Pi. Can we expect
    even more of these additions from BellSoft?


    There was a high demand from the community and commercial companies for video
    in JavaFX on Raspberry Pi. We are carefully listening to the voice of the community.
    As soon as we see Liberica JDK lacks capabilities required by our users we act
    accordingly.


    Which DIY-projecting-electronics-project you are working on, or is on your "if
    I ever have time" list?


    On our blog, we already talked about the support of Liberica JDK for the Nvidia
    Jetson Nano. We implemented a demo application to provide a data-driven view of
    the effectiveness on an exhibition floor. The setup was tested at Code One in
    San Francisco and brought lots of attention from participants.


    Technically we have a Jetson Nano with a 4K camera that captures videos and uses
    DeepStream for real-time video analysis & people detection. A Java application
    is used to perform data analysis, and the OpenFX application is visualizing the
    statistics. The next step for us is to use Project Panama on Nvidia for interoperability
    between a Java application and C native app?


