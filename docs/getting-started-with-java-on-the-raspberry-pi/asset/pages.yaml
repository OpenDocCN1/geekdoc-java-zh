  md: '# # Chapter 11: Message Queues


    A message queue enables to decouple applications and devices, but let them interact
    with messages. In between, we add a "Message Queue". Some of the most popular
    ones are RabbitMQ, ActiveMQ, Mosquitto... These are software applications you
    install separately and act as a "post office" to receive messages and deliver
    them to all those who are interested in them.


    In our case, we will install Mosquitto on a Pi and use it as our message delivery
    system. Once Mosquitto is running we can let an application subscribe to a topic
    in Mosquitto, for which we can freely define a name, e.g. "sensorMeasurement",
    "ledCommands".


    ![](img/d3f61a09bb1d08353ea609d038a99011_322_0.png)


    Subscribe on a topic in Mosquitto


    Mosquitto will create the topic (= "mailbox") as soon as one party wants to listen
    to it or publishes a message in it, so they don''t need to be configured in advance.
    Any application or device (or multiple ones) can publish a message to a topic.


    ![](img/d3f61a09bb1d08353ea609d038a99011_322_1.png)


    Publish a message


    Mosquitto will check who is subscribed to the topic and forward the message to
    all subscribed applications.'
  merge: -1
  pgno: 322
- img_proc: true
  md: '# Chapter 11: Message Queues


    ![](img/d3f61a09bb1d08353ea609d038a99011_323_0.png)


    Deliver message to subscribers


    This way we achieve “loose coupling”, which means both the publishers and subscribers
    don’t need to know the existence of each other. They only need to agree on the
    topic name and the content of the messages they exchange via the queue.

    Some use-cases:


    +   * A temperature sensor publishes its measurements into a topic.

    * A database application is subscribed and stores every measurement in a database.

    * The air conditioning controller is also subscribed and if the temperature exceeds
    a given value for a few minutes, it turns on the cooling.

    * A bunch of sensors all publish their measurements into the same topic.

    * A dashboard application is subscribed and visualizes the values in different
    charts.

    * When someone rings your doorbell a message is published.

    * A Pi with a camera is subscribed and records a movie of the person at the door.

    * A subscribed switch powers the lights above the door.


    As you can imagine based on these examples the drawing can become a bit more complicated
    as applications can become publisher, subscriber or both.


    ![](img/d3f61a09bb1d08353ea609d038a99011_323_1.png)


    Mosquito with multiple apps'
  merge: -1
