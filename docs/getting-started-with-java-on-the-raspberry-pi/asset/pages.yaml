- img_proc: true
  md: '# Chapter 2: Tools and hardware used in this book


    | Current/LED | LED/m | Total 1m | Total 5m |

    |---|---|---|--|

    | 60A | 30 | 1.8A | 9A |

    | 60A | 60 | 3.6A | 18A |

    | 60A | 144 | 8.64A | 43.2A |


    If we only want to do some testing, we can use a short piece with e.g. only 10
    LEDs. So this would require 0.6A (600mA) at full brightness. But even this is
    is too much for the Pi. The 5V pin gets its power from the USB power supply, which
    is also used by the Pi-system itself, of course, leaving only a few hundred mA
    left for this pin.


    For an Arduino, it depends on the type and power supply but about 400mA to 800mA
    should be available. And indeed as I found myself while setting the example project
    described in "Chapter 11: Message Queues", a short strip can be powered directly
    from Arduino.


    > Side remark, that Arduino example didn''t work at some point because I had the
    board connected to my PC. So the board was powered by my PC, while I used a long
    LED-strip with a separate power supply. Because they didn''t share the same ground,
    the data was completely messed up and the LEDs didn''t show the effect I was expecting.
    So remember to ground them together!


    # Conclusions


    +   - Pi: connect the power for the led strip in all cases to a separate power
    supply.

    - Arduino: OK for testing a short strip.

    - Make sure board and strip share the same ground.'
