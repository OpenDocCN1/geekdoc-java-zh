  md: '# Example 2: Interact with an I²C relay board


    I²C (for more info see "Chapter 5: Raspberry Pi Pinning") allows controlling different
    devices with

    only two pins if each has a unique identifier.


    For this example "GeeekPi Raspberry Pi Expansion Board 4 Channel Relay Board Modules"*#86

    are used. You can stack up to four on top of each other directly on the Pi. Two
    dip switches

    allow you to assign a different address (0x10, 0x11, 0x12 or 0x13) to each of
    the boards. This board

    has a clear documentation page*#87 which is always important to be checked before
    you decide to buy

    component!


    ![](img/d3f61a09bb1d08353ea609d038a99011_164_0.png)


