  md: '# Interview with Gerrit Grunwald


    Gerrit Grunwald, the Java Champion with the coolest Twitter name: @hansolo*, loves
    Java(FX) and IoT, UI guy


    Why do you build such a nice framework for TilesFX as open-source and give it
    "for free" to everyone.


    I worked on a project where a dashboard for the management was needed. For this
    dashboard, I''ve created two different widgets. I Once started these widgets I
    realized there was no good library to create dashboards in Java and at that moment
    TilesFX was born. Just added everything that came up my mind and added it to the
    library. The funny thing is that only little side project but never in any official
    project. But it seems a lot of people use it for their stuff.


    In your opinion, what is the most important change within the Java ecosystem in
    recent years?


    The most important change was the movement to the modularized JDK,, which does
    not mean that I''m a big fan of it. It might be useful for some people but I guess
    for many people the old structure would still work. Of, it helps in the world
    of containerized applications in combination with GraalVM (which is another important
    change in the Java ecosystem).


    What do you see as the next evolution in the Java-world?


    I would love to see Project Panama* become reality soon to be able to make accessing
    native libs easier.


    Why is not the perfect time to learn Java?


    Java is still one of the most widely used languages in the field. For me this
    is reason enough to recommend it to people when they ask which programming language
    to learn. The other important thing is the huge number of libraries available
    and the strong community. Also, Java has shown that it was capable of "staying
    young" over all the years he evolving.


    ![](img/d3f61a09bb1d08353ea609d038a99011_136_0.png)


    > Which DI-programming-electronics-project are you working on, or is your "If
    I ever have time? List"

    ''m working on a little gadget that helps me and wife to monitor the diabetes
    of our son. This is mainly based on ESP8266 stuff but for this, I also created
    a TileFX :)


    +   *https://twitter.com/hansolo_

    *https://openjdk.org/projects/panama/

    *Project Panama aims to improve and enhance the connections between the Java virtual
    machine and well-defined but "foreign" (non-Java) APIs, including many interfaces
    commonly used by C programmers.'
