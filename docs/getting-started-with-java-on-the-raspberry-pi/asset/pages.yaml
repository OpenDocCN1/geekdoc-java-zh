  md: '# Interview with Trisha Gee


    Trisha Gee, Geer, blogger, speaker, Developer Advocate at JetBrains, @trisha_gee*


    Java is changing a lot with the new releases every 6 months. What is the impact
    for IntelliJ IDEA?


    Obviously, we have to keep up with the changes. It''s particularly challenging
    keeping up with preview features that might change in 6 months. However, since
    we have three years a, we can usually support the key features from each release
    of Java before the actual release, thanks to Early Access versions of both the
    JDK and IntelliJ, which help us to work iteratively with feedback from developers
    and allows us to feedback to the JDK developers.


    IntelliJ is the leading IDE for Java development. How do you look at a free competitor
    like Visual Studio Code? What are the main reasons to work with IntelliJ?


    I personally don''t like to think of VSCode as competitor. It''s all about using
    the right tools for the job - after all, a carpenter has more than one screwdriver
    (one hope!). IntelliJ IDEA is great as for Java; a full IDE (Integrated Development
    Environment) - it provides not only code highlighting, code suggestions, and code
    generation, of course; but also automatic refactoring for pretty much everything
    in Martin Fowler''s famous Refactoring for more language than just Java); full
    support for Version Control Systems like Git, so I no longer need the command
    line or a separate tool to do everything! complete tooling for automated testing,
    debugging, etc. For me, personally, IntelliJ gives me all the functionality I
    need as a developer so I don''t need to context switch into any other tool or
    environment. Do I use it to make a change to a README on a project when I don''t
    want to download the whole codebase? No, I use a text editor for that.


    What are the most recent and upcoming changes in the “Java World” according to
    you?


    The key thing I think to have is a view of what''s happening in the Java world,
    rather than a deep knowledge of one (or more) area(s). I expect people to be competent
    whatever it is they need for their day job, of course! And that will vary from
    job to job. The key to staying up is not to know about everything about everything,
    that''s not possible, but to have a “TL;DR” idea of what''s going on. In the Java
    world, I would say you to be aware of:


    +   - Monthly release cadence since Java 9.

    - Difference between “feature releases” (9, 10, 12, 13...) and “Long Term Support
    releases” (8, 11).

    - What''s a preview feature (also why you should try it and why you should not
    use it in production code!)

    - If you''re a team lead/decision-maker you should probably understand the licensing/support
    changes since Java 11. Otherwise, you might end up with a big bill to pay Oracle,
    and no-one wants that!


    ![](img/d3f61a09bb1d08353ea609d038a99011_52_0.png)'
  merge: -1
