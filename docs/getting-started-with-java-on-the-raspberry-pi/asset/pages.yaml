  md: "# Chapter 10: Spring\n\n# 281\n\n![](img/d3f61a09bb1d08353ea609d038a99011_289_0.png)\n\
    \nUML diagram database model\n\nThis can be achieved by adding two classes to\
    \ our project in a package (directory) \"entity\". First, we create one for the\
    \ sensors called \"SensorEntity.java\". As you can see this code contains a lot\
    \ of \"annotations\" (start with @) which will help the framework to map the code\
    \ to the database.\n\n```\n/**\n * Maps a database entity from the table SENSORS\
    \ to a Java object.\n * The ID is marked as the unique identifier.\n */\n@Entity\n\
    @Table(name = \"SENSORS\",\nuniqueConstraints={@UniqueConstraint(\nname=\"UN_SENSOR_ID\"\
    ,\ncolumnNames={\"ID\"}))\npublic class SensorEntity {\n    /**\n     * Auto-generated\
    \ identifier to have a unique key for this sensor.\n     */\n    @Id\n    @GeneratedValue\n\
    \    private Long id;\n\n    /**\n     * Name of the sensor, a required value.\n\
    \     */\n    @Column(nullable = false)\n    private String name;\n\n    /**\n\
    \     * Relationship between the sensor and a list of measurements.\n     */\n\
    \    @OneToMany(\n        mappedBy = \"sensorEntity\",\n        cascade = {CascadeType.MERGE},\n\
    \        fetch = FetchType.LAZY\n```"
