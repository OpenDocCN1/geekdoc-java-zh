    When you start with a new Pi, you will need to prepare an SD card with the operating
    system. You can download this from the Raspberry Pi site by selecting “Raspian
    with desktop and recommended software” from the downloads page.


    > *https://www.raspberrypi.org/downloads/raspberry/'
