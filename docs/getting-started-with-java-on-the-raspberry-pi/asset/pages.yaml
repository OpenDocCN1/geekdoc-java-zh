  md: '# # History


    ![](img/d3f61a09bb1d08353ea609d038a99011_130_0.png)


    # ## Timeline of JavaFX


    JavaFX was initially (version 1) a platform to develop Rich Internet Internet
    Applications (RIA) to make it easy to create web-based interfaces with a scripting
    language.


    After Oracle acquired Java and JavaFX from Sun Microsystems in 2009, it announced
    a new major version 2 in 2010. This was released in October 2011 and changed from
    a scripting language to a Java API.


    The version numbering jumped to 8 when Java 8 itself introduced a lot of new APIs
    and language enhancements and JavaFX got improved to be in line with all these
    changes.


    Since version 11 the JavaFX module moved out of the JDK and GluonHQ is maintaining
    openFX with the support of many contributors (also Oracle). Just like the 6-month
    release cycle of Java, JavaFX development speed has increased pushing new features
    forward.'
