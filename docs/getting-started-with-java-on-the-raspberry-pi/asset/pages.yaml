  md: '# Chapter 5: Raspberry Pi pinning


    numbering has a “historical reason”. When development for the very first Raspberry
    Pi’s was ongoing, only 8 pins were foreseen. But when the designs further evolved
    more pins were added, the numbering in WiringPi was extended to be able to address
    the extra pins.


    As Pi4](Chapter 9) uses WiringPi “under the hood”, it''s important to know this
    numbering scheme is used. In the example code, the BCM number is also added to
    make things clear.


    Important, if you are using a Raspberry Pi 4, you will need to make sure you are
    on the latest version 2.52. Because the internal version of the processor of this
    type is different compared to the previous boards, an updated gpio is available.
    Check the version with “gpio-v” in the terminal and install the new version with
    the following commands:


    ```

    $ gpio -v

    gpio version: 2.50

    $ cd /tmp

    $ wget https://project-downloads.drogon.net/wiringpi-latest.deb

    $ sudo dpkg -i wiringpi-latest.deb

    $ gpio -v

    gpio version: 2.52

    ```


    Unfortunately the maker of WiringPi announced in August 2019, he stopped further
    development of this tool!*. His decision is based on the problem many open-source
    developers of popular tools are facing. A lot of people use it and for free support
    or even worse, re-use and sell products using the code without giving proper credits
    to the maker.


    That''s the main reason this book and the README-files in the sources contain
    all the links of the sites and tools used while writing this book. Without all
    those people who publish and share their knowledge, creating the examples for
    this book would not have been possible.


    > *3http://wiringpi.com/wiringpi-deprecated/'
  merge: -1
