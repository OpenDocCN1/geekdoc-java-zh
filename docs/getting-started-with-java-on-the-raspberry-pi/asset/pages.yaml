  md: '# Chapter 4: About Java


    Readable, readable, READABLE

    Hmm, I seem to have repeated that word with a few times already.

    There is nothing wrong with long methods with a lot of code inside of them. Java
    doesn''t care. But the one looking at your code does! In many cases that will
    be only you and maybe you don''t enter either...

    But imagine you''ve written a complex DIY-project and next year you want to improve
    or extend it. When you have structured your code into small methods that do a
    very specific, small thing, you will be able to dive-in again very quickly and
    find the exact spot where you need to work in.

    Another major topic is the you name your variables. Which are the clearest ones
    from this example?


    ```

    int var1 = 10;

    int var2 = 21;

    int outsideTemperature = 10;

    int insideTemperature = 21;

    ```


    So remember, breaking your code into smaller portions, with “real” variable names
    will help you and your colleagues to understand, maintain, improve and extend
    the code.


