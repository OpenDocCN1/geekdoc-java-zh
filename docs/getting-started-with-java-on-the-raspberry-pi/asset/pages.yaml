  md: '# Chapter 3: Choosing an IDE


    If you''re interested in Java features since Java 8, then you probably want to
    look at:


    +   - The updates to Streams and Optional since Java 8

    - "var" (specifically when not to use it!)

    - Switch expressions.


    In terms of up-and-coming things, I''m interested in Records and Pattern Matching.
    Also, I think it''s worth learning a lot at Kotlin, and it''s a very pleasing
    language to code in.


    Why is not the perfect time to learn Java?


    Java is not going anywhere time fast! And even if no-one developed anything new
    in Java from now on (which is certainly not the case), there are many Java applications
    and so much Java code out there that there''s plenty to keep us in well-paid employment
    for as long as we want to be coders! Maybe that''s not the most exciting reason
    to learn a language but it''s certainly the most pragmatic. But on top of that,
    the six-monthly release cadence is really helping to move the language faster,
    and with feedback from real developers like us, it''s a really great time to be
    involved with the language and to drive it in a direction that works for us.


    Which DIY-programming-electronics-project you are working on, or is your "if I
    ever have time" list?


    Erone I''ve traditionally always used my so-called free time for community and
    advocacy, so I tended to go to user groups, write blog posts, and work on my presentation
    skills when I wasn''t doing my 9-5 job. Now, I don''t really do that because the
    reality of having small children is I just don''t have the time or energy for
    anything other than trying to keep them alive and possibly entertained. I have
    to scratch my development/technology itches during my day job. Luckily, as a developer
    advocate, I have a reasonable amount of flexibility in what I spend my time on,
    and I can use work time to learn new stuff, especially if it''s relevant to the
    Java/JVM community.


    > https://twitter.com/trisha_gee'
