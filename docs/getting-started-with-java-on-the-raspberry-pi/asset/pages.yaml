  md: '# Chapter 5: Raspberry Pi pinning


    # Pulse-Width Modulation (PWM)


    As a digital GPIO can only be low (0V) or high (3.3V) it is not possible to have
    a real analog output, for example, if you want to fade an LED to half brightness.


    In these cases, PWM is the perfect solution! By switching fast enough between
    low and high and using different durations for the low and/or high state, a “semi-analog
    output” can be achieved by creating an averaged value. The values to be used in
    this case are:


    +   - On-time: duration the output is high

    - Off-time: duration the output is low

    - Period: on-time + off-time

    - Duty cycle: percentage of the time is high


    ![](img/d3f61a09bb1d08353ea609d038a99011_106_0.png)


    > I was going to make a JavaFX to generate this chart, just like the one used
    for the timeline in "Chapter 4: Java". However, to avoid the "NIH Syndrome" (see
    "Just a thought: Important abbreviations") I decided to first look for an existing
    solution. After a quick search, I found an instructive by Artworker* in which
    a nice and ready to use Excel is shared to generate the above image.


    PWM can be generated with software (e.g. using timers) on all GPIO pins, but a
    more stable signal can be produced with hardware functions provided on GPIOs with
    BCM numbers 12, 13, 18 and 19. These are marked in the PIN table with the type
    "DIGITAL_AND_PWM".


