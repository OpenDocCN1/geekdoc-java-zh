  md: '# JVM versus JRE versus JDK


    Java code is platform-independent, to execute it, we need specific versions for
    every platform (Windows, Linux, iOS...) and processor (Intel, ARM, 32bit, 64bit..).


    # JVM = Java Virtual Machine


    The JVM is not a physical machine, but a specification to provide a runtime environment
    to execute Java code byte on each platform.


    This enables you to develop your code on one machine and compile it to bytecode,
    but run it on many different types of computers without the need to change anything
    in your code!


    # JRE = Java Runtime Environment


    The JRE contains everything needed to run a (compiled) Java program. It includes
    the implementation of the JVM and a collection of libraries, tools, and software
    that the JVM uses at runtime to run Java code and applications.


    You cannot use the JRE to create new programs.


    # JDK = Java Development Kit


    The JDK is a software package you need on your PC to develop Java applications.
    The JDK includes the JVM, JRE, an interpreter to load Java applications, a compiler
    to convert java-files to byte code and many other tools.


    If you install a JDK you have everything to build and run Java applications. And
    that''s what we will do on our Pi.'
