  md: "# Chapter 10: Spring\n\n# 285\n\n![](img/d3f61a09bb1d08353ea609d038a99011_293_0.png)\n\
    \nNotice the \"@JsonIgnore\" on \"getSensor()\" in this entity class. It's added\
    \ here to avoid\\less loops when we load the data with the REST-service. Otherwise,\
    \ the application tries\nto nest measurements-with-sensors into sensors-with-measurements\
    \ resulting in this error:\n\n```\n1 Request failed; nested exception is\n2 org.springframework.http.converter.HttpMessageNotWritableException:\n\
    3 Could not write JSON: Infinite recursion (StackOverflowError);\n4 nested exception\
    \ is: com.fasterxml.jackson.databind.JsonMappingException:\n5 Infinite recursion\
    \ (StackOverflowError) (through reference chain:\n6 be.webetechie.javascript.db.SensorEntity...)\n\
    ```\n\nThese two classes are all we need to define the database tables and how\
    \ data needs to be stored!\n\n# Storing data in the database\n\nWe will do this\
    \ with two repository-classes and minimal code! Let's start again with the Sensors\
    \ and\n a package \"repository\" and a file \"SensorRepository.java\". By extending\
    \ from JpaRepository\nget CRUD-functionality (Create, Read, Update and Delete)\
    \ for free, and only to define\nthe additional methods we need. By using the same\
    \ parameter-names as the values in the entities,\nSpring will handle the functionality\
    \ for us!\n\n```\n1 @Repository\n2 public interface SensorRepository extends JpaRepository<SensorEntity,\
    \ Long>{\n3 Page<SensorEntity> findAll(Pageable pageable);\n4\n5 List<SensorEntity>\
    \ findByName(String name);\n6\n7 SensorEntity findById(@Param(\"id\") long id);\n\
    8 }\n```\n\n\"MeasurementRepository.java\" is even smaller:\n\n```\n1 @Repository\n\
    2 public interface MeasurementRepository extends\n3 JpaRepository<MeasurementEntity,\
    \ Long>{\n4 Page<MeasurementEntity> findAll(Pageable pageable);\n5 }\n```\n\n\
    # Adding the REST-services\n\nNow let's expose our database functionality with\
    \ REST-services so anyone can read and write data\nfrom and into the database!"
