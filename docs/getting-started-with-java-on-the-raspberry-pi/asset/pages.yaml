    # Configuration to run on the Pi


    Application works on PC, let''s prepare the Pi now. Spring will look for an application.properties
    file in the config directory and if we find one, it will use instead of the one
    included in the jar. Let''s use this functionality to configure the application
    to use a file-database instead of in-memory, so the data is not lost when restarting.


    We will make a directory for the application and add the properties to this:


    +   - $ mkdir /home/pi/dbapp

    - $ cd /home/pi/dbapp

    - $ mkdir config

    - $ nano config/application.properties

    - spring.datasource.url=jdbc:h2:file:/home/pi/dbapp/spring-boot-h2-db

    - spring.datasource.username=sa

    - spring.datasource.password=

    - spring.datasource.driver-class-name=org.h2.Driver

    - spring.jpa.hibernate.ddl-auto=update


    Build the application on PC to a jar using "mvn clean package" and copy "0.0.1-SNAPSHOT.jar"
    from the "target" to the Pi in the "/home/pi/dbapp" directory.


    ![](img/d3f61a09bb1d08353ea609d038a99011_300_1.png)


    Database application and properties on the Pi'
