  md: '# Chapter 3: Choosing an IDE


    # IntelliJ IDEA


    IntelliJ IDEA is a commercial product built by the company JetBrains, headquartered
    in the Czech Republic. They sell a lot of developer tools, but IntelliJ IDEA is
    the most known one and it is the most used IDE by professional developers. There
    is a free version (the Community edition) which can be used for Java and Android
    development, while the Ultimate edition is a paid version with additional features,
    as you can see on the [download page+]().


    Code completion (= hinting) and powerful refactoring tools are the main advantages
    of an IDE which help you to write your code faster as the possible methods shown,
    including the parameters.


    ```

    HBox bitselection = new HBox();

    bitselection.setSpacing(double value) 10

    bitselection.setShape(boolean value)

    bitselection.setScale(double value)

    bitselection.setCa(double value)

    bitselection.setShape(boolean value)

    Toggle.setSnapToPixel(boolean value)

    RadioButton.setStyle(string value)

    rbInteger.setShape(boolean value)

    rbInteger.setCenter(boolean value)

    bitselection.setMaxSize(double maxWidth, double maxHeight)

    bitselection.setMinWidth(double width, double height)

    ```


    Code hinting in IntelliJ IDEA


    Another great of IDEA is the visualization of the parameter name in your code,
    you can easily check if you used the correct value when calling a method.


    ```

    HBox bitselection = new HBox();

    bitselection.setSpacing(10);

    bitselection.setPadding(new Insets(topBottomLeft: S));

    ```


    Parameter name hints in IntelliJ IDEA


    > The magic key of IntelliJ IDEA: double-tap shift

    You can speed up your development by learning the shortcuts, CTRL-C and CTRL-V
    are probably the best known to copy and paste. For every IDE there is a list,
    but if you only remember one for IntelliJ IDEA it''s double tapping the shift
    key for "Search Everywhere.

    It will show you a popup where you can type in anything you are searching for
    like a class name, a method you''ve written somewhere in your code, the setting
    of the IDE...


    https://www.jetbrainsbrains.com/idea/download/'
