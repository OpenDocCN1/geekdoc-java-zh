  md: '# Hardware components


    # Resistors


    These are the base components we will need in all of our projects. And as it is
    impossible to them separated, you will need to be able to calculate their value
    based on the color-coding. Most of the resistors in use 4 color rings and you
    will need this table to calculate the value.


    Resistor color coding


    | Name | Color | Value | Multiplier | Tolerance | Temp. Coeff. |

    | --- | --- | --- | --- | --- | --- |

    | BLACK | #000000 | 0 | 1Ω | | 250ppm/K |

    | BROWN | #761d1d | 1 | 10Ω | 1% | 100ppm/K |

    | RED | #cc0000 | 2 | 100Ω | 2% | 50ppm/K |

    | ORANGE | #ffa500 | 3 | 1K | | 15ppm/K |

    | YELLOW | #ffff00 | 4 | 10K | 0% | 25ppm/K |

    | GREEN | #008000 | 5 | 100K | 0.5% | 20ppm/K |

    | BLUE | #0000cc | 6 | 1M | 0.25% | 10ppm/K |

    | VIOLET | #88e2ee | 7 | 10M | 0.1% | 5ppm/K |

    | GREY | #808080 | 8 | 100M | 0.25% | 1ppm/K |

    | WHITE | #ffffff | 9 | 1G | 0% | |

    | GOLD | #ffd700 | | 0.1Ω | 5% | |

    | SILVER | #c0c0c0 | | 0.01Ω | 10% | |

    | NONE | | | | 20% | |


    Color coding table


    > This color-coding table is created as a JavaFX application. JavaFX is explained
    later in this book. You can take a look at the sources if you want to experiment
    with it or use it to calculate the values of a resistor as described below.


    Chapter_02_Tools > javafx-resistors


    The most type of resistor used in Pi- and Arduino-projects is a 330Ω to limit
    the power for an LED.


    Gold can never be the first one, so we need to start on the other side.


    ![](img/d3f61a09bb1d08353ea609d038a99011_37_0.png)


    +   - first two bands give us the value = orange-orange = 33

    - third band is a multiplier = brown = 10Ω

    - fourth band is the tolerance = gold = 5%'
