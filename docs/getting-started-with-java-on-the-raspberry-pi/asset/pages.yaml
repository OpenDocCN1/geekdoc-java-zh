  md: 'Chapter 11: Message Queues


    # Defining the messages


    First, we need to agree on the message structure which will be exchanged via Mosquitto
    and the topic. We will be using a string with ": as the separator between the
    different values. This is the structure which we will using:


    +   * The topic in Mosquito is "ledCommand" in which commands will be published

    * The command itself is structured in the format "COMMAND:ID:SPEED:R1:G1:B1:R2:G2:B2"

    * COMMAND_ID: number of the LED effect we want, see table below

    * SPEED: milliseconds between effects

    * RGB: two sets of color values for red, green and blue between 0 and 255


    So we can use two different colors in the command, but some effects don''t use
    colors at all, or one and some don''t need the speed value. This is an overview
    of the available commands:


    | ID Name | Uses speed | Uses RGB | Uses RGB2 |

    |---|---|---|--|

    | 1 Fixed color (RGB1) | false | true | false |

    | 2 Static frame from RGB1 to 2 | false | true | true |

    | 3 Blinking (between color RGB1 and RGB2) | true | true | true |

    | 4 Running (RGB1 by one, others fixed RGB2) | true | false | true |

    | 5 Fading rainbow using a color gradient | true | false | false |

    | 6 Static rainbow from RGB1 to RGB2 | false | false | false |

    | 98 All white | false | false | false |

    | 99 All out | false | false | false |


    Some examples


    +   * 1:20:255:0:0 = all LEDs fixed full red

    * 3:50:255:0:0:0:0:255 = change all leds from full red to full blue every 2,5
    seconds

    * 5:50:255:0:0:0:0:255 = all are blue, and one running is for 50 milliseconds


    # The Arduino part


    For the Arduino, we will be using an LED-strip of the type WS2812B which only
    uses one pin to control it, connected to pin 6. For the power, we connect to the
    5V and ground pin. Make sure not connect too many LEDs as this could require much
    power (also see "Chapter 2: Tools > LED strips"). If you want to control a long
    strip, you will need a separate power supply. In that case, also connect the ground
    of the Arduino board to the ground of the power supply, or you will get surprising
    and unwanted LED effects because the timing of the strip and Arduino are not in
    sync.'
