  md: '# Pin types


    The type of header is header between the Pi board versions and contains 8, 26
    or 40 pins. These pins have different functions:


    # Power and ground


    Both 5V and 3.3V are available as power pins and, of course, also ground pins.
    Anytime the board is powered you have a fixed power supply for your components.
    As mentioned in “Chapter 2: Tools and hardware used in this book” > “Hardware
    components” > “LED strips ”, you have to take into account not to connect devices
    that need a lot of current!


    # Digital GPIO


    The other ones are “General-Purpose Input/Output” (GPIO) pins. These pins can
    be addressed with software to act as input or output for an application. They
    use 3.3V, meaning an output pin will be set to 0V (low) or 3.3V (high) and an
    input pin will read 0V as low and 3.3V as high.


    Most of the GPIOs have an internal pull-up or pull-down resistor which can be
    enabled in software. The use of this is illustrated with the use of a push-button
    in “Chapter 5: Pi4J > Digital input with a button”.'
  merge: -1
  pgno: 103
- img_proc: true
  md: 'Chapter 5: Raspberry Pi pinning


    96


    # # Pin functions


    Certain GPIOs can be used for specific functions. The functionality is described
    here shortly, while in "Chapter 7: JavaFX" and "Chapter 9: Pi4J" examples are
    provided to make their specific functionalities more clear.


    | Name | Label | Description |

    | --- | --- | --- |

    | UART | Universal Asynchronous Receiver and Transmitter | Asynchronous serial
    communication protocol |

    | GPCLK | General Purpose Clock | Output a fixed frequency |

    | I2C | Integrated Integrated Circuit | Synchronous serial computer bus |

    | SPI | Serial Peripheral Interface | Four-wire serial bus |

    | PWM | Pulse-Width Modulation | Generate analog output with a digital one |


    # # Universal Asynchronous Receiver and Transmitter (UART - Serial)


    UART is the system that enables us to send and receive serial data by using a
    shift register (for more info, in "Chapter 8: Bits and Bytes > Controlling a numeric
    segment display")


    Serial communication is a way to transfer data, by bit in a sequence, through
    a single wire from a transmitter (= TX) to a receiver (= RX) where the bits are
    combined again to bytes.


    For two-way communication, two wires are needed between RX and TX from both sides:


    ![](img/d3f61a09bb1d08353ea609d038a99011_104_0.png)


    Connection between two devices


    The communication between these two devices can happen in different ways:


    +   - simplex: direction only without a message back to confirm the receiving

    - half-duplex: devices can only send or receive at once

    - full-duplex: both devices can send and receive at the same time


    Serial communication is done at a predefined speed which needs to be known on
    both sides, as both the sender and receiver need to handle the data at the same
    speed. This speed is called the "baud rate" with a value indicating the number
    of bits per second (bps). The most used speed is 9600 bps,'
  merge: -1
  pgno: 104
- img_proc: true
  md: '# Chapter 5: Raspberry Pi pinning


    but you can use lower (1200, 2400, 4800) or higher (19200, 38400, 57600, 115200)
    speeds, depending on the speed which can be handled reliably by the device.


    The Pi has two built-in UART connections to GPIOs BCM number 14 (TX) and 15 (RX).
    Identical to the other GPIOs, they use 3.3V so sure, when you connect other devices,
    the same voltage is used.


    # General Purpose Clock (GPCLK)


    General Purpose Clock pins can be configured to continuously output a fixed frequency.
    So once your software has started this output, no further control is needed. The
    clock signal as very stable as it is generated by hardware components.


    The GPCLK uses three pins with BCM numbers 4, 5 and 6.


    # Inter Integrated Circuit (I²C)


    I²C, invented by Philips (1982), is a serial computer bus to transfer data with
    these features:


    +   - synchronous: exchange of data on a clock signal

    - multi-master and multi-slave: multiple controllers can be used together with
    multiple devices

    - packet-switched: data is grouped in packets with a header and payload

    - single-ended: varying voltage represents the data compared to a reference voltage
    (the ground)


    It can be used to transfer (low-speed) between boards over a short distance.


    I²C needs two cables and two pins are designed for this purpose, GPIOs with BCM
    numbers 2 (data) and 3 (clock).


    # Serial Peripheral Interface (SPI)


    Just like I²C, SPI uses separate cables for the data and the clock to make sure
    the data is read at the right time. Where I²C needs two cables, SPI needs four
    but is faster while using power.


    SPI was invented by Motorola in the mid-1980s. Data is transferred in full-duplex
    mode, using a single master and one or more slaves.


    In most hardware diagrams and on SPI-components you''ll find these names:


    +   - MOSI = Master Out Slave In = Communication from Pi to component

    - MISO = Master In Slave Out = Communication from component to Pi'
