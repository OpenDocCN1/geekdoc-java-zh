  md: "# Java crash course\n\nFrom Java version 11, you can run simple Java code without\
    \ the need to compile it, the same as you can run a Python or Bash script. And\
    \ that's exactly what we are going to use for this high-speed, trial-and-error\
    \ crash course! If you are new to Java, follow these steps to get a first look\
    \ at how to write code.\n\nFor these examples, no IDE is required and it will\
    \ work with any JDK from version 11 or higher. So you can start with a complete\
    \ new SD card with the Raspberry OS as it comes with AdoptOpenJDK 11 pre-installed!\
    \ Of course, you can do the same on your PC with a simple text editor (check-out\
    \ Notepad++) and a JDK version 11 or higher.\n\n+   All the examples here can\
    \ be found in chapter_04_Java > java-crash-course\n\n# HelloWorld! Running a single-file\
    \ Java-application\n\nTraditionally we start our first experiment with a “Hello\
    \ World” application.\n\n```\n$ cd /home/pi\n$ nano HelloWorld.java\n```\n\nIn\
    \ this new file we add the following code:\n\n```\npublic class HelloWorld {\n\
    \    public static void main(String[] args) {\n        String txt = \"Hello World\"\
    ;\n        System.out.println(txt);\n    }\n}\n```\n\nJava requires us to “package”\
    \ our code in a class. This has the same name as the file, so in this case, we\
    \ need to start with \"public class HelloWorld\".\n\nA application also needs\
