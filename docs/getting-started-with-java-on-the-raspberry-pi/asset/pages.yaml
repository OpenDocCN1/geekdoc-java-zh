  md: '# Interview with Johan Vos


    Johan Vos, @johanvos*, Co-founder and CTO of Gluon*, Java Champion, Leading the
    development of OpenJFX and OpenJDK for Mobile


    You are one of the main contributors to JavaFX (OpenJFX). What are the biggest
    changes ongoing in this framework?


    The most important critic for the development of OpenJFX is stability. OpenJFX
    itself is not creating new coolness, but many others (libraries, frameworks, projects)
    to leverage the JavaFX APIs and built-value on top of it.


    ![](img/d3f61a09bb1d08353ea609d038a99011_131_0.png)


    OpenJFX provides the top-level JavaFX APIs that allow to create UI applications
    and tools in Java. We keep working on those APIs, mainly enhancing the quality,
    and making sure they stay relevant in the evolving landscape.


    Apart from the APIs, OpenJFX bridges the gap between those APIs and the low-level
    graphical systems on the different configurations. We make sure the APIs working
    first class on the underlying systems. It is a task that should not be underestimated.


    In the world, and especially in OpenJDK projects, we are very cautious about adding
    functionality. One of the first questions we ask is:Will this functionality be
    relevant and maintained in 5 years from now? We also have to make sure there is
    a consensus in the developer community to do something. Since JavaFX is widely
    used in very different areas, it is not always easy to come up with a set of APIs
    that are equally applicable in all domains. Hence, before adding or modifying
    APIs, we need loops of feedback.


    Fortunately, there is a strong JavaFX ecosystem, with many small and large contributors
    that are ever openly and constructively discussing the future path.


    Do you believe JavaFX is the perfect match for user interfaces on the Raspberry
    Pi?


    Absolutely. The cross-platform character of JavaFX makes it very easy to develop
    UI on a desktop system, and once you have power with it, you can run it on a Raspberry
    Pi and tuned embedded-specific issues.


    Specifically with the GraalVM native-image capabilities*, offered via the Gluon
    Substrate plugin*, applications created with JavaFX will be very relevant.


    BellSoft announced in a blog post, support for video in JavaFX on the Pi. We can
    expect more JavaFX features on the Raspberry Pi, like WebView


    Video support has been part of JavaFX since the beginning, as is WebView. Depending
    on the configuration and how you build, WebView might not be included in an embedded
    platform as an embedded component, but we rather use the existing webkit implementation
    on the device (which is what we do on iOS/Android for example). In general, everything
    that is available on the desktop is available as well on embedded and mobile.'
  merge: -1
