    # Conclusion


    A basic example with two tables, but it shows you how quickly and with minimal
    code, a database application can be built. The REST-services are available to
    all your devices who can connect to your Pi via the network so they can store
    data in one central place and/or read that data.


    The JSON data provided by the REST-services can be used by all different kinds
    of devices or applications to visualize the results. On the Elektor website you
    can find a nice example of a microcontroller doing this to show JSON data on a
    screen¹¹¹⁶.


