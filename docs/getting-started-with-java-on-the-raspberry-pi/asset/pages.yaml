  md: '# LCD-display with the weather forecast


    Pi4J also contains helper methods to minimize the work needed to use certain modules.
    As an example, we will be using `GpioLcdDisplay` to control an LCD with 2 rows
    of 16 characters (“1602A”).


    > Very important remark before you power the test setup for this example! This
    module uses 5V so we don''t want it to send back to the Pi GPIOs. This must be
    by connecting pin 5 (read/write) of the module to the ground.


    We will be requesting the weather forecast from a public website to have dynamic
    data to visualize on the LCD-display.


    ![](img/d3f61a09bb1d08353ea609d038a99011_253_0.png)


    ![](img/d3f61a09bb1d08353ea609d038a99011_253_1.png)


    ![](img/d3f61a09bb1d08353ea609d038a99011_253_2.png)


    ![](img/d3f61a09bb1d08353ea609d038a99011_253_3.png)


    The four generated outputs on the LCD-screen


    # Wiring to connect an LCD to the Pi


    Not all these types of displays have completely the same connections, so you''ll
    need to check your display to setup the wiring like this:


    +   - VSS: ground

    - VDD: 5V

    - V0: with a variable resistor (potentiometer) connected to ground. Used to control
    the brightness of the characters. If you don''t have one, you can experiment with
    different resistors to find the best one for maximum readability.

    - RS, E, D4, D5, D6 and D7: to GPIO as defined in the code'
