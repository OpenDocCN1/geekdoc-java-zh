    ![](img/d3f61a09bb1d08353ea609d038a99011_181_0.png)


    > Hmm, this is unexpected! Does a byte have the range of -128 to 127, instead
    of 0 to 255?

    On some forums, there was some confusion and someone thought he was doing wrong
    as he expected a different value during testing. To understand this, we need to
    know the difference between signed and unsigned values!


    # Signed versus unsigned


    When you calculate the byte value to a signed number value, the major bit (the
    most left one) is handled as an indicator for a negative number (1) or a positive
    number (0), for example, 8 bits “10001111”


    | Select type of value: | Integer | Short | Byte |

    | Power of 2 | 2^7 2^6 2^5 2^4 2^3 2^2 2^1 2^0 |

    | Value | 128 64 32 16 8 4 2 1 |

    | Select | [x] [ ] [ ] [ ] [x] |

    | Bits | 1000 1111 |

    | Hex value | 0x8f |

    | Unsigned value 143 - Min: 0 - Max: 255 |

    | Signed value | -15 - Min: -127 - Max: 127 |


    As an example: byte 0x8f can be both 143 and -15!


    The same goes for a short which consist of two bytes (= 16 bits), for example,
    “1000 0000 0000 1111”:'
