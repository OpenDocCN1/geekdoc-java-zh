  md: '# Building our first JavaFX application


    Running one Java-file is fin and enables us to quickly test something, but it''s
    only a first step. To make a full Java-application, we need some additional steps...


    Let''s start by making a copy of the "javafx-minimal" application we created with
    the GluonHQ-tool (or take it from the examples GitHub of course).


    # Extend the pom.xml


    The application will use the TilesFX libraries to make a fancy dashboard next
    to the already used JavaFX library. We need to add the TilesFX dependency in the
    pom.xml file so our IDE will download during development and we can call the methods
    of it.


    Go to the [Maven repository website](https://mvnrepository.com/) and search for
    TilesFX.


    ![](img/d3f61a09bb1d08353ea609d038a99011_145_0.png)


    When you click through you can select the version and on its page, you will find
    the dependency to be added to the pom.xml file, where the javafx-controls dependency
    is already included. We also need to add the javafx-web dependency as this is
    used by TilesFX.'
