  md: '# a thought - Beware of the PAF


    I first learned about the "WAF" at work during a lunch discussion between engineers,
    self-made domotics projects. The major reason such a project fails or succeeds
    is the **Wife Acceptance Factor**. According to some, the same WAF is the most
    critical point in decision when buying a new television, radio or any electronic
    device with a remote control.


    But as I strongly believe technology is not a man-only thing, the "W" in "PAF"
    gives me even more grey hair than I already have... Technology is not male - or
    at least it should not be at all. So that''s why I officially rename "W" to "PAF"
    now, **Partner Acceptance Factor**


    "MMI", **Man-Machine Interface**. It''s a touch screen device used by the train
    driver to select the journey, which announcements need to be played back, answer
    an emergency call, etc. But not all train drivers are male of course. By introducing
    the new name "HMI", **Human-Machine Interface** in one project, I was able to
    slowly break into the company''s history of product naming and turn this unfamiliar
    into a new one.


    It''s only a small step of course, but as we also do with CoderDojo (a computer
    club for kids), we need to convince girls technology is fun! Diversifying the
    group of people working in technology is important. Good products can only be
    made if the people involved are a good mixture of age, gender, origin...


    As STEAM (Science, Technology, Engineering, Arts and Mathematics) receives more
    and more attention in education, we see a slow change in the number of girls choosing
    for a scientific trajectory. This book is my own attempt to make sure enough fun
    and simple getting-starting projects are available to insure "kids" of age.


    And, as a side note in this, if anyone asks why you would build something if you
    can buy it off-the-shelf, the correct answer is **"Because I can!"**. Even if
    you fail during the process, you will have learned new things!


    While working on this book, I also encountered the "CAF", the "Community Acceptance
    Factor". Using Java on the Pi seems to be a polarizing subject answer to Mark
    Heckler (Spring Developer & Advocate at Pivot Software). You either love it or
    hate it, no middle ground. Some, a Pi is made for Python. Of course, I don''t
    agree ;) Python is great and you can get started with it quickly, but I don''t
    like the user interfaces you can make with it (and I tried). JavaFX provides better
    code for this. On the other hand, I have to repeat myself... Why do I prefer Java
    on the Pi? ""BECAUSE WE CAN!"


    > https://www.youtube.com/watch?v=ymtzJCo6nAk'
