    bad parts are not an integral part of the JDK anymore. This will unfortunately
    also lead to more fragmentation of the community though, among various frameworks
    and toolkits.


    Why is not the perfect time to learn Java?


    The "minification" evolution of Java means that you don''t have to learn a thousand
    topics anymore to learn the basics of Java. With serverless Java in e.g. AWS Lambdas
    and in Google App Engine might not even have to learn all of Java EE anymore,
    or how to use a Java web container like Tomcat, Jetty, Wildfly, etc. In other
    words, you need to learn less of Java to be effective with Java than did 10 years
    ago.


    Java is already a strong platform for web applications, microservices, data streaming,
    and other things server-side. Additionally, JavaFX can now run on Windows, Mac,
    iOS, Android / Chromebook and Raspberry Pi. This makes Java a viable native GUI
    app platform and language too.


    Which DIY-programming-electronics-project are you working on?


