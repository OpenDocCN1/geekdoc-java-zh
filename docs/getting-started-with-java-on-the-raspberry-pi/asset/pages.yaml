  md: '# Just a thought: Impostor Syndrome


    I have a confession to make. I''m suffering from a chronic disease, one which
    seems to be incurable,

    The Impostor Syndrome*. Every day I''m afraid of being exposed as a fraud, charlatan,
    hoax...

    People with the Impostor Syndrome are convinced their achievements are based on
    luck instead of knowledge or experience. They also believe other people think
    they are smarter than they are and will realize this sooner or later.


    Often I have this same feeling,

    dided to embrace it! At work, I''m

    srounded by colleagues we have a

    hig degree and are smarter than

    me. And we also share our failures

    victories. If one of us gets stuck,

    explain our problem to one another,

    which is the best first step to identify

    act''s the part of our code


    ![](img/d3f61a09bb1d08353ea609d038a99011_321_0.png)


    is not working as expected. And if no-one is available, we have a rubber duck*
    on our desk which is

    more happy to listen to our puzzles.


    Doubting is a good thing, it makes you question your decisions, which proves you
    are

    worth doing the things you''re doing. You got the job because you were the right
    person at the right

    ment. Use your doubts to improve your workflow, the communication... And never
    forget

    that the opposite of an impostor is a narcissist, and I''m certain which of those
    is my preferred

    type of colleague!


    What do you like to do, repeat it over and again, just like professional sporters
    do. Maybe you are

    not an expert yet, but choose your battles wisely and one day you will be.


    Rules to keep in mind...


    It''s not a problem to not know, it''s a problem to not have tried.


    There are two types of decisions: good decisions and lessons learned.


    > *https://en.wikipedia.org/wiki/Impostor_syndrome

    Using a rubber duck to explain your problem. By doing so you are forced to rethink
    the process which leads to your problem,

    which in many cases reveals the error. A good practice before involving (disturbing)
    a colleague.'
