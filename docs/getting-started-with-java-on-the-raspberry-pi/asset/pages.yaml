  md: '# Convert bits to a numeric and hex value


    A combination of multiple bits is converted to a number, by using the power of
    2.


    In everyday life, we are used to decimal values where we group everything by 10,
    20, 30. In programming, hexadecimal values are used more, and they have the range
    0 to 15, which perfectly matches the maximum value of four bits ("1111"). A hex
    value is written as x0 to xF.


    The following table shows all possible combinations of 4 bits ranging from "0000"
    to "1111":".


    | Bits | 2^3 | 2^2 | 2^1 | 2^0 | + | Number | HEX |

    |---|---|---|---|---|---|---||

    | 0000 | 0 | 0 | 0 | 0 | 0+0+0+0 | 0 | x0 |

    | 0001 | 0 | 0 | 0 | 1 | 0+0+0+1 | 1 | x1 |

    | 0010 | 0 | 0 | 1 | 0 | 0+0+2+0 | 2 | x2 |

    | 0011 | 0 | 0 | 1 | 1 | 0+0+2+1 | 3 | x3 |

    | 0100 | 0 | 1 | 0 | 0 | 0+4+0+0 | 4 | x4 |

    | 0101 | 0 | 1 | 0 | 1 | 0+4+0+1 | 5 | x5 |

    | 0110 | 0 | 1 | 1 | 0 | 0+4+2+0 | 6 | x6 |

    | 0111 | 0 | 1 | 1 | 1 | 0+4+2+1 | 7 | x7 |

    | 1000 | 1 | 0 | 0 | 0 | 8+0+0+0 | 8 | x8 |

    | 1001 | 1 | 0 | 0 | 1 | 8+0+0+1 | 9 | x9 |

    | 1010 | 1 | 0 | 1 | 0 | 8+0+2+0 | 10 | xA |

    | 1011 | 1 | 0 | 1 | 1 | 8+0+2+1 | 11 | xB |

    | 1100 | 1 | 1 | 0 | 0 | 8+4+0+0 | 12 | xC |

    | 1101 | 1 | 1 | 0 | 1 | 8+4+0+1 | 13 | xD |

    | 1110 | 1 | 1 | 1 | 0 | 8+4+2+0 | 14 | xE |

    | 1111 | 1 | 1 | 1 | 1 | 8+4+2+1 | 15 | xF |'
