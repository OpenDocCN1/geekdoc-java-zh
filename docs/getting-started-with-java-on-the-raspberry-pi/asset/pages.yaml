  md: '# Conclusion


    Wow, what a journey... What started as some blog posts and a 4-page article for
    MagPi, turned into this book!


    Building the examples and understanding what needed to be done on the hardware
    level has been pretty challenging times. In the end, all the examples I had in
    mind when starting this book and creating the first draft of the table of contents,
    are here. Especially thanks to all those who volunteered to review and give feedback.
    I''m also honored the experts I admire, were willing to spend some of their precious
    time for an interview!


    Do I still think Java on Raspberry Pi is a good idea? You bet!!! More than ever,
    I learned Java is the tool I love to create stuff, experiment and build. Is it
    the one-and-only-tool-for-everything? Of course! As always you have to choose
    but I hope you can find enough approaches in this


    JavaFX is a no-brainer when you need a tool to create user interfaces and you
    can create visually appeals with very little effort. Arduino is the best fit to
    control, for example, LEDstrips. The GPIOs are wonderful to attach any kind of
    hardware and easy to control as shown in "Chapter 9: Pi4j!", but sometimes it''s
    easier to find an example Python script for more complex components. But you can
    start these scripts from Java with parameters as described in "Chapter 8: Bits
    and Bytes".


    With any good software project you have to select the tools that fit your needs
    in the best possible way. And most of the times it will be a combination of different
    things. But anywhere is a big chance the Raspberry Pi will be the centerpiece
    of it. This small and cheap computer has proven once more it''s "game-changer"


    Now let me answer the question I asked all interviewees in this book...


    Which DIY-programming-electronics-project are you working on, or is your "if I
    ever have time" list?


    The project I had in mind starting my Java-on-Raspberry-Pi-experiments is a combination
    of some of the examples in this book. For my son, I built a booth both so he can
    continue his life for playing music without all the noise for me and myself. In
    booth, I want to add a touch-screen with a user interface to control LED-strips
    on the ceiling attached to an Arduino, different types of lights with a relay-board
    on the Pi, a web-interface for us so that we can alarm the food is on the table
    by turning those LED-strips into flashing red alarm signal... For this project,
    different examples from this book must be combined.


    So one final note to you and myself: hop get to work, experiment and most importantly...
    have fun!!!'
  merge: -1
  pgno: 356
