  md: '# Chapter 2: Tools and hardware used in this book


    Formula to calculate the resistor value:

    resistorValue = (sourceVoltage in V - ledVoltage in V) / ledCurrent in A


    For an example a 3.3V GPIO with an LED of 2.2V and 20mA.

    You can find these on the technical sheet or packaging of your LEDs.

    (3.3V - 2.2V) / 0.02A = 55Ω


    To be on the "safe side", in most cases we will use a 330Ω resistor.


    The JavaFX application also has a calculation tool for this:


    # Led resistor calculator


    | Input voltage (V) | 3.3 | Led voltage (V) | 2.2 | Led current (A) | 0,02 |

    | A resistor with value 55Ω is needed |


    Calculate the resistor value for an LED


    # RGB-LED


    RGB-LEDs combine three different colors in one component. They share either a
    common cathode (-) or anode (+). Luckily you can''t damage them by connecting
    them the wrong way, so you can quickly check with a fixed power pin from the Pi
    (don’t forget the resistor!). As you will see in “Chapter 9: Pi[4] > Digital GPIO
    input and output examples > Example 1: Digital output with RGB-LED” the different
    colors don’t have the same brightness and you’ll need to check the datasheet to
    define the correct resistors to be used for every pin.'
  merge: -1
