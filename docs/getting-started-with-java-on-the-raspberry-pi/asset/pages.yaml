  md: "# Add a GPIO helper class\n\nIn HelloGpio.java we were able to turn an LED\
    \ on and off with a small piece of code. To be able to handle exceptions and read\
    \ the state of the GPIO, we need some more code. We create a new class \"Gpio.java\"\
    . This will use the \"gpio\" commands we used before in the terminal, controlled\
    \ with Java. This is just a \"quick-win\" approach in chapter 9 we will start\
    \ using Pi4J which provides a better approach and other methods, but at this moment\
    \ we want to take a code-only approach.\n\n+   This full can be found in\nChapter_07_JavaFX\
    \ > javafx-dash-dashboard > src > main > java > be > webtechie > Gpio.java\n\n\
    Let's look at it, bit by bit.\nStart with the package name and the imports we\
    \ need. Within the class we will add the methods need.\n\n+   These are the last\
    \ examples where the full code is documented within this book. Look into the GitHub\
    \ source of each example including package names and imports.\n\n```\npackage\
    \ be.webtechie;\n\nimport java.io.BufferedReader;\nimport java.io.IOException;\n\
    import java.io.InputStream;\nimport java.io.InputStreamReader;\n\n/**\n* Change\
    \ a pin state using WiringPi and command line calls\n* http://wiringpi.com/the-gpio-utility/\n\
    \ */\npublic class Gpio {\n}\n```\n\nWe need one method to run the gpio commands\
    \ and handle the result. E.g. if we run \"gpio read 5\" we want to know if \"\
    1\" or \"0\" is returned by gpio. We call this \"execute\" method. It is a private\
    \ static method because it will only be used by other static methods Gpio.java.\
    \ The return of this method is a String, we can handle the value depending on\
    \ the type of result we are expecting.\nTo avoid memory leaks where Java blocks\
    \ memory which is no longer needed, the closing of the stream and reader is done\
    \ in the finally block which gets called even if an error occurs."
  merge: -1
