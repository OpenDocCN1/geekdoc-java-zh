  md: '# Using a bit shift register


    The Pi has GPIO connections to control these 8 LED segments. And you can control
    them the same as we have done before in the JavaFX chapter with the Gpio java
    class. For instance, turning one segment connected to pin with wiringpi number
    5 would be done like this:


    ```

    Gpio gpio = new Gpio();

    gpio.initiatePin(5, "out");

    gpio.setState(5, true);

    ```


    But this means we need 8 pins for 8 segments and if we would be building a more
    complex project, we could quickly run out of GPIOs... Let''s take a better approach
    and use a bit shift register. This is a digital circuit that can be used to extend
    the number of GPIOs of a Pi (or Arduino).


    In our case, we will work with the SN7HC595, a Serial-Parallel-Out shift register.
    Instead of 8, we will only need three of the Pi GPIOs to control 8 LED segments.


    First, we take a look at the technical sheet** to be sure what we can do with
    it and how to connect. This is the pin-listing with a reference to the variable
    we will use in the Python script "shift.py":


    | Pin Name | Description | shift.py |

    |---|---|---||

    | 1 | Qb | Output of B value | |

    | 2 | Qc | Output of C value | |

    | 3 | Qd | Output of D value | |

    | 4 | Qe | Output of E value | |

    | 5 | QF | Output of F value | |

    | 6 | Qg | Output of G value | |

    | 7 | Qh | Output of H value | |

    | 8 | GND | Ground | |

    | 9 | Qb'' | Output of H'' value | |

    | 10 | SERCLR | Input of CLEAR. Not used in this example. | |

    | 11 | SERCLK | Input of the CLOCK. A pulse on this lets the register store the
    value of data pin in memory. | PIN_SERCLK |

    | 12 | RCLOCK | Input of LATCH. A pulse on this sets the stored value on the 8
    output pins. | PIN_RCLK_LATCH |

    | 13 | OE | Input of enable | |

    | 14 | SER | Input of the DATA which needs to be sent bit by bit. | PIN_DATA |

    | 16 | Qa | Output of A value | |

    | 15 | VCC | Power pin | |


    # Wiring


    Before connecting the IC, you can first try all connections to the LED segment
    display with a fixed 3.3V input of a GPIO.


    > *https://www.ti.com/lit/ds/symlink/sn7hc595.pdf'
