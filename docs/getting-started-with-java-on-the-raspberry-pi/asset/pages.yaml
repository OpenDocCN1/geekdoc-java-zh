  md: '# What is Spring Boot?


    Spring Boot is a “layer” on top of Spring which provides “off-the-shelve” packages
    to create stand-alone Spring-based applications that you can “just run”. This
    is achieved by a principle known as **convention above configuration**. You only
    need to configure the things you want to behave differently than the default way.


    Most important features as listed on the Spring Boot website¹¹⁰:


    +   - Easily create stand-alone Spring applications

    - Embed a webserver inside your application (Tomcat, Jetty or Undertow)

    - Provide opinionated ‘starter’ dependencies to simplify your build configuration

    - Automatically configure Spring and 3rd party libraries whenever possible

    - Provide production-ready features such as metrics, health checks, and externalized
    configuration

    - Absolutely no code generation and no requirement for XML configuration


    The Spring examples in this book are all based on Spring Boot.


    > ¹¹⁰https://spring.io/projects/spring-boot'
