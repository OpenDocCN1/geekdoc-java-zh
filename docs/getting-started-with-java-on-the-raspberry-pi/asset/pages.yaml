  md: '# Chapter 7: About JavaFX


    # 124


    In your opinion, what is the most important change within the Java/JavaFX ecosystem
    in recent years?


    The decoupling of the JDK was an important change with a big impact. We knew this
    would shock several developers, but with the JDK and the ecosystem going modular,
    we had to do this with OpenFX as well. We are now in pretty smooth waters, where
    the majority of the ecosystem embraced the modular approach and is using existing,
    familiar tools like Maven or Gradle to create JavaFX applications. For those developers
    and companies that prefer a separate SDK, we still offer that as well.


    Why is now the perfect time to learn Java?


    With Java, you learn a language that doesn''t lock you in a particular market,
    area, or even language itself. Many languages are using the Java VM, and Java
    is used in a wide range of domains, open-source and commercial software.


    It is very mature, stable, and still very innovative, e.g. with the 6-month release
    cycles.


    Which DIY-programming-electronics-project are you working on, or is on your "if
    I ever have time" list?


    Alarm system for home, including AI and face recognition.


