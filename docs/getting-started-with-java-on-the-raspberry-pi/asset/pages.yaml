    # LEDs


    Next to resistors, LEDs are also most used in the projects in this book. They
    come in all colors and sizes. A Light-Emitting Dode, as the name says, emits light
    when current flows through the diode, blocking the current flowing in the opposite
    direction. The voltage drop caused by the LED mostly lies between 1.2 to 3.6 volts
    with a recommended current between 10 to 30 mA.


    ![](img/d3f61a09bb1d08353ea609d038a99011_38_1.png)


    They have a positive and negative pin and it’s easy to remember which is the positive
    one. The longest one! You have more of it ;-) In case the pins are cut, the flat
    edge of the plastic cap is the negative side. The current in the LED can only
    flow from the positive (anode) to the negative (cathode) side!


    As Pi outputs 3.3V on the GPIOs and most Arduinos output 5V, we will need a resistor
    to limit the voltage we don’t damage the LED.'
  merge: -1
