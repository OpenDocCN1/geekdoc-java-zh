  md: '# Chapter 9: Pi4j


    the system used by a bat to fly in the dark without hitting walls. The reflection
    of ultrasound is used to calculate the distance to an object on which the sound
    reflects.


    To measure the distance, these steps must be taken:


    +   - The module needs to be powered with 5V.

    - The application needs to put the trigger pin high for at least 10µ.

    - The module will send multiple (typically 8) 40kHz signals and detect when the
    signal is received back.

    - The echo pin will be set high for the same duration as the ultrasound needed
    for returning.

    - The application needs to measure the duration of the high state of the echo
    pin so it can calculate the distance based on the speed of sound.


    # ## Wiring between Pi and distance sensor


    As this sensor module works on 5V, we need to limit the current going back to
    the Pi to not damage the GPIO which expects max 3.3V. This is done with the resistors
    which also connect the echo pin to the ground to have a clear difference between
    high and low (pull-down).


    ![](img/d3f61a09bb1d08353ea609d038a99011_218_0.png)


    Connections for the distance sensor'
