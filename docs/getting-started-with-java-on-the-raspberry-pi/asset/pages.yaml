  md: 'Chapter 4: About Java


    # Version history


    The Java-architects always made sure improvements and new features in Java didn''t
    break existing applications. Because of this, you can still run old Java applications
    on newer versions with none or minimal changes. This is one of the big differences
    with Python were made for Python 2 are incompatible with the completely refactored
    version 3. On the other hand, the version naming of the Java releases took some
    strange turns when you can see in this timeline:


    ![](img/d3f61a09bb1d08353ea609d038a99011_66_0.png)


    Abbreviations used:


    +   - J2SE: Java Platform version 2, Standard Edition

    - SE: Standard Edition

    - LTS: Long Time Supported

    - RC: Release Candidate

    - EA: Early Access


    Between the 5 till 9, new versions of Java were released with big intervals. With
    current fast changes with cloud platforms, big data, artificial intelligence,
    etc. a faster release cycle was needed to be able to align new features with new
    demands.


    This led to a change in the Java ecosystem in recent years. A lot of companies
    contribute to the Open project pushing forward and releases are now scheduled
    every six months! All new features which are finished at the release date, get
    included, others just have to wait until the next one. This is a completely different
    approach compared to the earlier days when a release was only done when all scheduled
    new features were finished.


    If you can eye on the changes in new releases, you can decide for yourself if
    you want to update your development and runtime JDK to the latest one, or just
    stick to the one you are using if you don''t need one of the new features. But
    if you care about security and the best performance, following the release cycle
    will offer you the best results as Java gets improves continuously!'
