  md: '# # Just a thought: Learn by educating


    I started two CoderDojo clubs in Belgium (Roeslare and leper) at the start of
    2014 and today still organize the one in leper. CoderDojo is a club for kids to
    learn to program. Not with real courses, but by guiding the kids to experiment
    and discover. The coaches are only there to help when all else fails. At that
    time 2014, there was a lot of "fuzz" about the lack of engineers for software
    and electronics projects.


    ![](img/d3f61a09bb1d08353ea609d038a99011_44_0.png)


    | 2011-2 | 2012-13 | 2013-14 | 2014-15 | 2015-16 | 2016-17 | 2017-18 | 2018-19
    |

    |---|---|---|---|---|---|---|---||

    | 1794 | 1944 | 2058 | 2297 | 2472 | 2669 | 2644 | 2918 |

    | 11312 | 11711 | 11888 | 12547 | 13040 | 13394 | 13661 | 13642 |


    Engineering students in Flanders


    This chart is based on the number of engineering students (electromechanics, digital
    arts, and entertainment, electronics-ICT, multimedia and communication technology...)
    in Flanders, Belgium ^1 Thanks to CoderDojo and other STEAM-initiatives; this
    kind of education gained popularity and the female group from 15% to 21% in all
    these years.


    Of all the students (240,332) who started high school in 2018-2019, only 16,560
    or 7% started in this engineering direction, which almost guarantees you to find
    a fun and challenging job! As STEAM will become more and more important in the
    future, in a society that relies heavily on technology, we need to inspire more...


    A long intro to point out the fact I "educating" kids not only in CoderDojo, but
    also at with children of colleagues in a First Lego League^2 team. That''s the
    moment you know nothing... at not what kids are. Also, the moment you start experimenting
    with new things and a new world opens its doors for you. For me, was the moment
    I discovered Arduino, Raspberry Pi, Mindstorms and many more. Because I believe
    in the power of knowledge sharing, also blogging, writing, presenting and again
    discovered new worlds.


    You can only explain something if you master it or research, try out, fail, restart,
    document. Exactly what I tried to do for this book...


    > ^1 https://coderdoojo.com/

    ^2 Publications on www.vlaanderen.be/publicities > "Hoger onderwijs in cijfers"

    ^3 Science, Technology, Engineering, Arts and Mathematics

    ^4 http://firstlegolegoleague.org/'
