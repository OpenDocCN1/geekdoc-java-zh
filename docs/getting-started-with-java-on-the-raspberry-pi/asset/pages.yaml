- img_proc: true
  md: "```\n/**\n * Execute the given command, this is called by the public methods.\n\
    \ * @param cmd String command to be executed.\n */\nprivate static String execute(String\
    \ cmd) {\n    Process p = null;\n    InputError error = null;\n    BufferedReader\
    \ input = null;\n\n    try {\n        // Get a process to be able to do native\
    \ calls on the operating system.\n        // You can compare this to opening a\
    \ terminal window and running a command.\n        p = Runtime.getRuntime().exec(cmd);\n\
    \        // Get the error stream of the process and print it\n        // so we\
    \ will know if something goes wrong.\n        error = p.getErrorStream();\n  \
    \      for (int i = 0; i < error.available(); i++) {\n            System.out.println(\"\
    \" + error.read());\n        }\n\n        // Get the output stream, this is the\
    \ result of the command we give.\n        String line;\n        StringBuilder\
    \ output = new StringBuilder();\n        input = new BufferedReader(new InputStreamReader(p.getInputStream()));\n\
    \        while ((line = input.readLine()) != null) {\n            output.append(line);\n\
    \        }\n        input.close();\n\n        System.out.println(cmd);\n\n   \
    \     // Return the result of the command.\n        return output.toString();\n\
    \    } catch (IOException e) {\n        System.err.println(e.getMessage());\n\
    \        return \"\";\n    } finally {\n        if (p != null) {\n           \
    \ p.destroy();\n        }\n    }\n```"
