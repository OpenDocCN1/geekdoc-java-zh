  md: '# Just a thought: Switching social


    I have to admit, I''m socially addicted. Although I''m not the person who starts
    talking to everyone in real life. By on-line I''m networking fulltime with all
    means. I probably had an account on every service you can think of.


    Twitter, Facebook, Google, LinkedIn and every new thing that seemed interesting
    for one or more reasons... Until a few years ago, when you were searching for
    test-users and I saw your tweet, you got my data within five minutes.


    Free is not Free


    Of course, I realized a long time ago those services are free because they make
    a profit with your data. Data is the oil that keeps their engine running. Google
    offers you those user-friendly tools they get to know you thanks to your emails,
    documents in Google Drive, browsing and location history... And because of that,
    they can show you advertisements based on your interests so there is a bigger
    chance you click on, buy and make Google cash. That''s also how Facebook knows
    your relation will end before you change your status to "it''s complicated" yourself.
    And LinkedIn knows you''re searching for a new job, before you request a final
    chat with your boss.


    But what applies on-line, also hangs off-line. We''re pregnant thanks to your
    card, based on your shopping habits, before you even tell your parents.


    So we are constantly monitored and categorized, without seeing, and pushed in
    the most affordable direction for the advertisers.


    You are being sold


    It''s not that bad, isn''t it? That''s all what I thought. Until I saw the talks
    of Aral Balkan. Years ago I saw him the first time at Multi-Mania in Kortrijk
    where how dark-patterns are used to trick users in choosing the most expensive
    (low-cost flight operators to be most experienced in this matter...). Shortly
    after, he changed in an even inspiring speaker, fighting for a new internet where
    the users become owners of their own digital identity. And his wife Laura Kalberg,
    who is an even important voice in the same battle, founded the Small Technology
    foundation which advocates for, and builds small technology to protect personhood
    and democracy in the digital network age.


    It''s no longer advertising we have to worry about. That whole system to get know
    as much as possible you has only one goal: sell your identity, a digital copy
    of you. If you don''t pay for a service, you are the one sold. You became the
    product sold. You are being farmed!


    The acronym TANSTAAFL (The ain''t no such thing as a free lunch)already exists
    since the 1930s, but it has taken a very bad turn in the last decade.


    Rehab'
