    \ configure Swagger, we need to add a class. For a clear structure, it is added\
    \ in a new package \"configuration\" with the file \"SwaggerConfig.java\" which\
    \ looks like this to automatically document all our web services:\n\n```\n@Configuration\n\
    @EnableSwagger2\npublic class SwaggerConfig {\n    @Bean\n    public Docket api()\
