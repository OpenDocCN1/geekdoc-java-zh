  md: '# Interview with Vlad Mihalcea


    ![](img/d3f61a09bb1d08353ea609d038a99011_303_0.png)


    Vlad Mihalcea @vlad_mihalcea*, Java Champion, CEO of Hyperspace, JPA expert, one
    of the top Hibernate ORM committers.


    Java, Java Persistence API (JPA), and Hibernate allow building a database application
    with minimal code. All made possible by free and open-source frameworks! What
    is your motivation to contribute to these developments?


    JPA and Hibernate are, very convenient when building a data access layer, and
    this is the reason they are used by the


    vast majority of enterprise applications.


    Not only Java, but Spring Boot or JHipster use Hibernate by default, so, there''s
    no wonder Hibernate is so popular.


    My motivation for contributing to Hibernate is the desire to teach people how
    to get the most out of JPA, Hibernate, or the database system they use.


    That''s the reason I wrote High-Performance Java Persistence*, and started projects
    such as Hibernate Types* or Hypersistence Optimizer*.


    You share a lot of tips and tricks on Twitter, site, StackOverflow, books, talks...
    I''m wondering how all these experts you like, you achieved this with a job and
    family?


