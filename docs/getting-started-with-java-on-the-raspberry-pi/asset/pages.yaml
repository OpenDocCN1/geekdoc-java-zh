  md: '# Chapter 6: What is Maven?


    Maven is a tool to help you manage the dependencies (external libraries) of your
    Java project and build the application for testing and distribution. It works
    by using a predefined structure to organize your code and describe a project in
    a pom.xml (Project Object Model) file.


    Based on different polls, about 50 to 60% of Java developers use Maven. There
    are other tools available to do the same thing, with Gradle being the second most
    popular (20 to 30%). As I''m not familiar with Maven and it''s the most used one,
    we will only work with it in this book.


    Next to the development tool, there is also the on-line Repository where you can
    find a long list of verified libraries.


    Let''s take a look at the TilesFX library we will be using in chapter 7. Go to
    the mvnrepository.com website and search for TilesFX.


    ![](img/d3f61a09bb1d08353ea609d038a99011_114_0.png)


    If we click on the "tilesfx" link, we get the page with all the available versions
    of this library.


    > https://maven.apache.org/

