    \    return new ResponseEntity<>(ex.getMessage(), headers,\n            HttpStatus.INTERNAL_SERVER_ERROR);\n\
    }\n\n\n```\n\n```\n// Check which type of file we are returning so we can correctly\
    \ define\n// the header content type. By doing this, the browser can show\nif\
    \ (fileName.toLowerCase().endsWith(\".jpg\")) {\n    headers.setContentType(MediaType.IMAGE_JPEG);\n\
    } else if (fileName.toLowerCase().endsWith(\".png\")) {\n    headers.setContentType(MediaType.IMAGE_PNG);\n\
    } else if (fileName.toLowerCase().endsWith(\".gif\")) {\n    headers.setContentType(MediaType.IMAGE_GIF);\n\
    }\n\n\n```\n\n```\n// Everything OK, return the image.\nreturn new ResponseEntity<>(media,\
    \ headers, HttpStatus.OK);\n```\n\nThis method will give us the image in the browser:\n\
    \n![](img/d3f61a09bb1d08353ea609d038a99011_283_0.png)"
