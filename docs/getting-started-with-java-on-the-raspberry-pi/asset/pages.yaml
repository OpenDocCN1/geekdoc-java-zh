  md: 'Chapter 2: Tools and hardware used in this book


    34


    ![](img/d3f61a09bb1d08353ea609d038a99011_42_0.png)


    Connect LED strip to Pi with external power source


    Watch out for eye damage while experimenting with strips as they can be very bright!


    # WS2812B = controlled with one connection


    Every LED in such a strip can be separately controlled because each has a WS2812B
    chip embedded in it, notice the small dark spot inside the LED. In most of the
    cases, this is a 5050 LED (= 50x50 mm). Controlling the LEDs is done via one single
    data wire. These strips can be controlled with a refresh rate of 400Hz maximum.


    WS2812B


    # WS2813 = controlled with two connections


    The WS2813 is an updated version of the WS2812B and uses two data wires, the rest
    of the strip will continue to work if one LED breaks. Another advantage is the
    higher refresh rate of 2000, but this is specifically important for display usage,
    while in this book we will just do “fun LED-strip” experiments.


    WS2813


    Disadvantage: they are slightly more expensive compared to WS2812B-strips.'
