  md: "# Chapter 11: Message Queues\n\n```\nmodule be.webtech {\n  requires javafx.controls;\n\
    \  requires org.eclipse.paho.client.mqttv3;\n  exports be.webtech.javafx.mosquitto;\n\
    }\n```\n\n# Connecting and publishing to Mosquitto\n\nTo connect to Mosquitto\
    \ we need to know the IP address of the Pi. There is also some exception handling\
    \ required, but actually we only need to define the MqttClient and call the connect-method.\n\
    \n```\nMqttClient client = new MqttClient(\"tcp://\" + ipAddress + \":1883\");nMqttClient.generateClientId();\n\
    client.connect();\n```\n\nOnce the connection is established, we can send a message\
    \ \"Hello from PC\" to the topic (mailbox, e.g. \"testing/TestTopic\") with this\
    \ code:\n\n```\nString messageText = \"Hello from PC\"\nMqttMessage message =\
    \ new MqttMessage();\nmessage.setPayload(messageText.getBytes());\nclient.publish(\"\
    testing/TestTopic\", message);\n```\n\nThe full code with error handling is available\
    \ in the sources in \"QueueClient.java\".\n\n# Subscribing to Mosquitto\n\nSubscribing\
    \ to a topic is done in the QueueClient script like this:\n\n```\nObservableList<String>\
    \ queueItems = FXCollections.observableArrayList();\nclient.setCallback(new Callback(this.queueItems));\n\
    client.subscribe(\"testing/TestTopic\");\n```\n\nWe use an ObservableList so we\
    \ can use this in the UI to show the incoming messages.\nAs you see it uses another\
    \ class ClientCallback which implements MqttCallback, that will be called each\
    \ time a new message is published in \"testing/TestTopic\" and pushed to the subscribed\
    \ applications:"
