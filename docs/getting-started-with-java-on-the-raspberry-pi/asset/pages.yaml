  md: '# Start a Java application when the Pi starts up


    In case you''re building a dashboard-like application, as in the previous example,
    you''ll probably

    it it to start automatically when your Raspberry Pi is powered. This can be done
    with a script

    gets called after start-up.


    +   1. Upload your jar with the application to the Pi, for example, in the directory
    "/home/pi/java-apps/*"

    2. Create a text file, for example, "start-script" and add the two lines to start
    the jar.


    ```

    $ nano /home/pi/start-script

    #! /usr/bin/bash

    java -jar /home/pi/java-apps/my-app.jar

    ```


    +   3. Test the script you created by running manually.


    +   4. Create a new file "startup.desktop" in "/etc/xdg/autostart/" to execute
    the script you created when

    the Pi starts.


    ```

    $ sudo nano /etc/xdg/autostart/startup.desktop

    [Desktop Entry]

    Type=Application

    Name=JavaApplication

    Exec=bash /home/pi/start-script

    ```


    +   5. Restart the Pi and your application will be started automatically!'
