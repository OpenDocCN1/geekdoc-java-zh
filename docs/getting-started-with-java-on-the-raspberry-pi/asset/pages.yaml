  md: '# Software tools on the Pi


    # Linux commands crash course


    Clemens Valens¹⁵ of Elektor shared this overview in a blog post¹⁶ and was happy
    to have it included in this book. Thanks to it, Clemens!


    Because it is almost impossible to work on the Raspberry Pi, or for that matter,
    on Linux in general, without ever needing to enter commands in a terminal, there
    is a list of frequently used commands, which are executed by the command interpreter
    "Bash". A terminal is that black window in which you can only type text. Sometimes
    it is also called a Command Line Interface or CLI.


    There are many commands and most commands accept all sorts of parameters and arguments.
    To find out more on a specific command, add `--help` (two dashes) to it, e.g.,


    ```

    rm --help

    ```


    In the following "[path]" refers to a relative or absolute path. An absolute path
    starts with "/", e.g.


    /home/pi


    Please note that the table below is not exhaustive and your favorite commands
    may be missing. Some of these commands are only available on Debian-based Linux
    systems like Raspian for Raspberry Pi.


    | Command | Description |

    | --- | --- |

    | pwd | Display the name of the current working directory. |

    | ls | List the content of the current directory. |

    | ls [path] | List the content of the specified directory. |

    | ls -l | List the content of the current directory with additional information.
    List all files including hidden files beginning with ''.'' (i.e. dotfiles). List
    all files and display the file sizes in a human readable format. |

    | cd [path] | Change the current directory to [path]. | cd .. | Change to the
    parent directory (note the space between ''cd'' and ''..''). |

    | cd / | Change to the root directory (note the space between ''cd'' and ''/'').
    |

    | cd ~ | Change to the home directory (determined by $HOME environment variable).
    |

    | mkdir [name] | Create the directory [name] in the current working directory.
    |


    > ¹⁵https://twitter.com/Clemens_Elektor

    ¹⁶https://www.elektormagazine.com/news/bash-command-cheat-sheet'
  merge: -1
