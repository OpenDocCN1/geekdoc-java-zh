  md: '# Control with Python code


    In the previous chapter, we used Gpio.java to execute terminal commands from Java
    to toggle and read GPIOs. In the next chapter, we will be working with Pi4J so
    we can control the GPIOs directly from within Java. But in this chapter, we have
    yet another approach and use a Python script to execute multiple GPIO interactions
    in one flow.


    This script will be included in the Java application so that it can be called
    from within the application and needs to execute these steps:


    +   1. Parse the given number value to be sent to the LED segments

    2. For all 8 bits in the number value:

    3. Send the first bit from the HEX value to the DATA pin

    4. Send a pulse to the clock pin to show the DATA value

    5. Send a pulse to the RELEASE pin to send all 8 stored values to the 8 output
    pins

    6. Clean-up the GPIOs so we can use them


    Let us create a Python file "shift.py" (e.g. in "home/pi/\$) on the Pi, so we
    can start it in the terminal with a number value as start-up argument, e.g. number
    109 (see the table before) to show a "5" on the shift display:


    ```

    $ python shift.py 109

    ```


    The Python script sets the bits of this value 109 to the 8 memory positions of
    the SN74HC595. This is the full script:


    ```

    # coding=utf-8


    import RPi.GPIO as GPIO

    import time

    import sys


    # Define BCM pin numbers

    PIN_DATA = 4

    PIN_SRCLK = 5

    PIN_RCLK_LATCH = 6

    WAIT_TIME = 0.01


    # Ignore GPIO warnings as we are re-using GPIO

    GPIO.setsetwarnings(False)


    # Initialize pins

    GPIO.setmode(GPIO.BCM)

    ```'
  merge: -1
  pgno: 189
