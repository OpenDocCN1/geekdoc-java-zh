  md: '# Chapter 1: Introduction


    Welcome! Whether you are a newbie in Java, and want to learn from examples, or
    know the language, and want to get started with electronics and a Raspberry Pi,
    I hope you will find valuable new information in here!


    This is not a book to learn every aspect of the Java language. There are already
    a lot of those written by better programmers than me, please check your bookstore
    or an online course if you want to get a real deep knowledge of the Java programming
    language. My goal was to build a lot of sample code and information, I collected
    while learning and experimenting, and to get anyone interested in Java take a
    quick start by using the examples to set up their own experiments. By these examples,
    you will learn the language bit by bit.


    Over the last couple of years, I focused on Java in my professional job. But on
    the other hand, I also got involved in CodeDojo (coding club for children) where
    I was able to make a blinking LED with some simple code on Arduino and a Pi.


    If I see how kids learn with electronics and programming at CodeDojo, I''m jealous
    those things didn''t exist when I was a kid. I managed to control a relay-board
    with Commodore 64 but it took me years to collect all needed knowledge and components
    to reach that goal. Now to online shopping and knowledge sharing that same result
    can be achieved in days or hours...


    As a professional Java-developer with a love for open-source, I set myself as
    a personal goal for 2019 to run a recent Java version (Java 11 or newer) on the
    Pi, with a Java user interface, and control an LED with it. Very basic I Know,
    but it resulted in a series of blog posts about each step to reach this goal.
    Based on these blog posts, I also wrote an article for MagPi (in the Dutch and
    French July 2019) and produced an Udemy course.


    And as a blinking LED is the equivalent of a "Hello World" program, I continued
    with experimenting and ended up... with this started book! A whole list of "recipes"
    to get you started with many Java libraries and electronics to build your projects.
    Take one or more of these "recipes", combine and mix them to your taste, experiment
    and explore!


    Oh, and this is not an anti-Python or anti-C book! Java is the language I love
    and use the most, but for every problem you need to select the best solution.
    And in some cases, this could be Java or something else...


    > https://www.udemy.com/course/use-java-11-and-java-fx-11-on-a-raspberry-pi'
