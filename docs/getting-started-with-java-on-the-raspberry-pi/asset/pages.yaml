  md: '# Content overview


    You can read this book from start to end, but also use it as a "cookbook" and
    select the topics of your interest. For instance, you don''t need to know the
    history of Java to work with it, but it''s here for your reference.


    In between some of the chapters you find a short "Just a thought"\piece about
    the things I find important and I would like to share with you. I''m also very
    happy I interviewed some of my heroes, in the chapters that are related to.


    **Chapter 1: Introduction:** On the next pages you can find more info about the
    sources used in this book and are available for free, and some additional info
    about readme-files and a thank-you.


    **Chapter 2: Tools and hardware used in this book:** Setup a Raspberry Pi with
    Raspian and an overview of the software used on both Pi and PC. Also generic info
    about the most-used hardware components in this book.


    **Chapter 3: Choosing an IDE:** Info on IntelliJ IDEA and Visual Studio Code.


    **Chapter 4: About Java:** History of Java, different versions and tools within
    the eco-system and how to install it on your Pi and PC. And of-course crash course
    so you get a grasp of the language it''s completely new to you.


    **Chapter 5: Raspberry Pi pinning:** Different types of Raspberry Pi-boards and
    the different headers, pins and pin types and how you can use them to connect
    different types of hardware.


    **Chapter 6: What is Maven?:** More info on Maven, the tool we will use to test,
    build and run your Java projects on PC and Pi.


    **Chapter 7: About JavaFX:** The visual Java framework we will use to build beautiful
    user interfaces to interact with your Pi and hardware.


    **Chapter 8: Bits and bytes:** The magic of ones and zeros and how they are combined
    into longer values.


    **Chapter 9: Pi4J:** A framework that makes it easier to work with the GPIOs from
    Java with multiple examples.


    **Chapter 10: Spring:** Building a Java application that exposes your Pi as a
    web service to store or control the GPIOs.


    **Chapter 11: Message Queues:** Use your Pi as a message handler to receive and
    send messages to different devices like other Pi’s, PCs or Arduino’s.'
