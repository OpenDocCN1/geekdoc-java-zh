  md: '# Chapter 9: Pi4J


    Pi4J is the best library to link Java on the Raspberry Pi with the GPIOs. In our
    earlier experiments with the JavaFX dashboard (see “Chapter 7”), we created our
    own Gpio.java but this was only able to set a pin high or low or read a pin state
    via “terminal commands”. The Pi4J library offers a lot more methods directly connected
    to the hardware for optimal performance.


    ![](img/d3f61a09bb1d08353ea609d038a99011_203_0.png)


    Pi4J is a layer between Java and the hardware


    The open-source project was started by Robert Savage and Daniel Sendula and the
    code is available on GitHub.


    In 2019 a full rework of this library started to bring it in line with modern
    Java and to be able to handle new types of Raspberry Pi’s is more easily. Unfortunately,
    this new version is not available yet, so the following examples still use 1.2
    but can be easily adapted. All the examples in this chapter were developed on
    a Raspberry 3 B+.


    As the Raspberry Pi 4 uses a new chip, the interior wirings are different compared
    to the previous Pi’s. Make sure to update WiringPi** if you want to experiment
    with Pi4J on a Pi 4, as this is the interface between Pi4J and the hardware, as
    described in Chapter 5 > WiringPi number.


    All methods of Pi4J are documented with JavaDoc and the generated HTML documentation
    can be found on www.pi4j.com/1.2/apidocs/index.html**.


    > *9https://github.com/Pi4J/pi4j/*

    *9http://wiringpi.com/download-and-install/*

    *9https://www.pi4j.com/1.2/apidocs/index.html**'
  merge: -1
  pgno: 203
- img_proc: true
  md: '# Installation


    Adding the Pi4J framework to your Pi can be done with one single command which
    will download and launch an installation script that performs the following steps:


    +   - Adds the Pi4J APT repository to the local APT repositories

    - Downloads and installs the Pi4J GPG public key for signature validation

    - Invokes the ''apt-get update'' command on the Pi4J APT repository to update
    the local package database

    - Invokes the ''apt-get install pi4j'' command to perform the download and installation


    ```

    $ curl -sSL https://pi4j.com/install | sudo bash

    ```


    By using this method, you can update to newer versions later with the following
    commands:


    ```

    sudo apt-get update

    sudo update-get upgrade

    ```'
