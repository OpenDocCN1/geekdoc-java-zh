  md: "# Chapter 9: Pi4j\n\n# 221\n\n| Command | Description | Values |\n|---|---||\n\
    | 0x01 | Row 1 | 0x00 - 0xFF |\n| 0x02 | Row 2 | 0x00 - 0xFF |\n| ... | ... |\
    \ ... |\n| 0x08 | Row 8 | 0x00 - 0xFF |\n| 0x09 | Decode mode | 0x00 needed in\
    \ our to use all bits of the value 0x00 (min) - 0x0F (max) |\n| 0x0A | Brightness\
    \ | 0x00 needed in example |\n| 0x0B | Scan list | |\n| 0x0C | Let the chip listen\
    \ (or not) to SPI commands | 0x00: shutdown mode - 0x01: normal mode |\n| 0x0F\
    \ | Test mode | 0x00 (off) - 0x01 (on) |\n\nAgain, to make everything more clear,\
    \ the code is split into small blocks.\n\n# Definitions\n\nLet's first start with\
    \ a list of commands, not including the rows as we will just use the row number\
    \ later so doesn't need to define a command for them.\n\n```\n/**n * Reserved\
    \ byte values to send a command.\n */\npublic enum SpiCommand {\n    DECODE_MODE(byte\
    \ 0x09),\n    BRIGHTNESS(byte 0x0A),\n    SCAN_LIMIT(byte 0x0B),\n    SHUTDOWN_MODE(byte\
    \ 0x0C),\n    TEST(byte 0x0F);\n\n    private final byte value;\n\n    SpiCommand(byte\
    \ value) {\n        this.value = value;\n    }\n\n    public byte getValue() {\n\
    \        return value;\n    }\n}\n```\n\nTwo types of enums are also created:\
    \ images and characters, with an image always being 8 by 8 in size, but the characters\
    \ can have a different width, depending on the number of columns needed to draw\
    \ the character."
