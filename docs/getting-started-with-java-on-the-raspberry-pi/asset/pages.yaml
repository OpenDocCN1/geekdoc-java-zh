  md: "# Example 2: Database REST-service for IoT data on Pi\n\nThis project is a\
    \ proof-of-concept application to store data in a database on the Pi. The data\
    \ can be provided by any source with REST-services.\n\n+   - Full sources can\
    \ be found in:\n- Chapter_10_Spring > java-spring-rest-db\n\nThe H2 database¹¹¹⁵\
    \ will be using a full-Java-solution which doesn't need any installation but is\
    \ fully part of the application itself.\n\nThere is a lot of “discussion” whether\
    \ you use H2 only for testing or use it in production. In recent years it has\
    \ evolved into a very stable database solution which in my opinion is a very good\
    \ choice for embedded projects.\n\nJPA is the persistence specification used to\
    \ “communicate” with the database. It helps you to define which objects (entities)\
    \ can be stored in a database in which structure (tables).\n\n# pom.xml settings\n\
    \nAgain starting from a minimal Spring project, we modify the pom.xml file with\
    \ the correct settings and some more dependencies.\n\n```\n<dependencies>\n  <dependency>\n\
    \    <groupId>org.springframework.boot</groupId>\n    <artifactId>spring-boot-starter-web</artifactId>\n\
    \    <version>0.0.1-SNAPSHOT</version>\n    <name>java-spring-rest-db</name>\n\
    \    <description>Spring Boot project to store data in an H2 database</description>\n\
    \  </dependency>\n  <dependency>\n    <groupId>org.springframework.boot</groupId>\n\
    \    <artifactId>spring-boot-starter-data-jpa</artifactId>\n  </dependency>\n\
    \  <dependency>\n    <groupId>org.springframework.boot</groupId>\n    <artifactId>spring-boot-starter-data-rest</artifactId>\n\
    \  </dependency>\n</dependencies>\n```"
