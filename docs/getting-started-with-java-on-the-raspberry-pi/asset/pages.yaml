  md: '# Calculate a byte value


    A byte consists of 8 bits and has the range of 0x00 (= 0) to 0FF (= 255).


    So we need to extend the table above to have 8 bits. Let''s take a few examples:


    | Bits | 2^7 | 2^6 | 2^5 | 2^4 | 2^3 | 2^2 | 2^1 | 2^0 | + | Total | HEX |

    |---|---|---|---|---|---|---|---|---|---|---|-|

    | | 128 | 64 | 32 | 16 | 8 | 4 | 2 | 1 | | | |

    | 00001111 | 0 | 0 | 0 | 0 | 8 | 4 | 2 | 1 | 8+4+2+1 | 15 | x0F |

    | 00111111 | 0 | 0 | 1 | 1 | 8 | 4 | 2 | 1 | 16...+1 | 31 | x2F |

    | 01000000 | 0 | 1 | 0 | 0 | 0 | 0 | 0 | 0 | | 32 | x20 |

    | 11111111 | 1 | 1 | 1 | 1 | 8 | 4 | 2 | 1 | 128...+1 | 255 | xFF |


