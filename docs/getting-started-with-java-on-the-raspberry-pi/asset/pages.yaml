  md: "Chapter 9: Pl4J\n\n# Code blocks\n\n# Calculation helper class\n\nAs we will\
    \ need to do some calculations on the measured results, a separate \"Calculation.java\"\
    \ class is used to provide these methods.\n\n```\n/**\n * Helper class for duration\
    \ and distance calculation.\n */\npublic class Calculation {\n  /**\n   * Get\
    \ the distance (in cm) for a given duration.\n   * The calculation is based on\
    \ the speed of sound which is 34300 cm/s.\n   * @param seconds Number of seconds\n\
    \   * @param half Flag to define if the calculated distance must be divided\n\
    \   */\n  public static int getDistance(float seconds, boolean half) {\n    float\
    \ distance = seconds * 34300;\n    return Math.round(half ? distance / 2 : distance);\n\
    \  }\n  /**\n   * Get the number of seconds between two nanosecond timestamps.\n\
    \   * 1 second = 1000000000 nanoseconds\n   * @param start timestamp in nanoseconds\n\
    \   * @param end timestamp in nanoseconds\n   */\n  public static float getSecondsDifference(long\
    \ start, long end) {\n    return (end - start) / 1000000000F;\n  }\n}\n```\n\n\
    # Unit test\n\nTo validate these functions, a unit test \"CalculationTest.java\"\
    \ is also added to the example code which checks the results of these methods.\
    \ \"assertEquals\" checks if the test result is OK."
