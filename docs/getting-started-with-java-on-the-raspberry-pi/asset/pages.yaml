  md: '# Visual Studio Code (VSC)


    Another great IDE is Visual Studio Code developed by Microsoft. The source code
    is available on GitHub²⁶. It started as an editor for web applications, but thanks
    to its flexible approach with plugins, it gained a lot of attraction and almost
    all languages can now be written in VSC.


    For Windows and other 64-bit-systems, you can get it from the official site²⁷.


    ![](img/d3f61a09bb1d08353ea609d038a99011_54_0.png)


    Install VSC for Linux


    As described further, you can use VSC on PC but work with files of the Pi, but
    you can also install VSC on the Pi itself if you want to program on it. As the
    official version is only for 64-bit PCs and Raspbian has a 32-bit operating system
    version - although the Pi 4 has a 64-bit processor - this will not work. Luckily
    we can still find an earlier version of VSC which is 32-bit and compiled for the
    Pi! You can install in three easy steps:


    ```

    $ cd /home/pi

    $ wget https://github.com/stevedesmond-ca/vscode-arm/releases/download/1.28.2/

    $ vscode-1.28.2.deb

    $ sudo apt install ./vscode-1.28.2.deb

    ```'
