    System.err.println(\"Error: \" + ex.getMessage());\n}\n```\n\nOf course, we still\
    \ need to add the measureDistance-method. In the example code, it is part of the\
    \ same App-class but you could also put it in a separate one. Within this method,\
    \ each step is taken as described at the beginning of this example to put the\
    \ trigger high and measure the duration between the state changes of the echo\
    \ pin. Using the methods created before in the Calculation-class we can now log\
    \ the distance between the echo sensor and the nearest object.\n\n```\nprivate\
    \ static void measureDistance() {\ntry {\n  // Set trigger high for 0.0ms\n  trigger.pulse(10,\
    \ PinState.HIGH, true, TimeUnit.NANOSECONDS);\n  // Start the measurement\n  while\
    \ (echo.isLow()) {\n    // Wait until the echo pin is high,\n    // indicating\
    \ the ultrasound was sent\n  }\n  long start = System.nanoTime();\n  // Wait till\
    \ measurement is finished\n  while (echo.isHigh()) {\n    // Wait until the echo\
    \ pin is low,\n    // indicating the ultrasound was received back\n  }\n  long\
    \ end = System.nanoTime();\n  // Output the distance\n  float measuredSeconds\
    \ = Calculation.getSecondsDifference(start, end);\n  System.out.println(\"Measured\
