  md: '# Chapter 8: Bits and bytes


    ```

    61 time.sleep(WAIT_TIME)

    62

    63 print "Done"

    ```


    With the comments in the code this should be pretty self-explaining, but let us
    take out special line from the for-loop to get bit from the inputValue:


    ```

    1 bit = inputValue >> (7 - y) & 1

    ```


    +   * "inputValue >> (7 - y)" moves the bit to the right

    * "& 1" is used to get the most right bit from the given value


    To illustrate we take the inputValue 109 which is 0x6d = 0110101


    | inputValue | y | inputValue >> (7 - y) & 1 |

    |---|---|---|

    | 0110101 | 0 | 0 |

    | 0110101 | 1 | 01 |

    | 0110101 | 2 | 011 |

    | 0110101 | 3 | 0110 |

    | 0110101 | 4 | 01101 |

    | 0110101 | 5 | 011011 |

    | 0110101 | 6 | 011010 |

    | 0110101 | 7 | 0110101 |


    When we run this script in the terminal we get the following output matching this
    table:


    ```

    1 $ python shift.py 109

    2 Number of arguments: 2

    3 Sending value: 109

    4 Sending bit value 0 to slot 0

    5 Sending bit value 1 to slot 1

    6 Sending bit value 1 to slot 2

    7 Sending bit value 0 to slot 3

    8 Sending bit value 1 to slot 4

    9 Sending bit value 1 to slot 5

    10 Sending bit value 0 to slot 6

    11 Sending bit value 1 to slot 7

    12 Done

    ```


    But we can also call the same script with a HEX value when we start it with "0x"
    as this is converted correctly inside the script:'
