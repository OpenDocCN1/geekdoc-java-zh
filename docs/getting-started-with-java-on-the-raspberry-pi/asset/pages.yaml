  md: '# Example 1: TilesFX dashboard


    Let''s start with a first Java + JavaFX + GPIO example!


    This is the application we are going to build: a dashboard with tiles (from TilesFX),
    an input from a push button and an output with an LED.


    ![](img/d3f61a09bb1d08353ea609d038a99011_142_0.png)


    Chapter_07_JavaFX-dashboard


    # Wiring and testing in terminal


    Let''s add some hardware to use of the full power of the Pi. With some basic components
    add an LED and a push-button, connected like this:


    +   - GPIO22 (WiringPi n° 3) > resistor > LED > ground

    - 3.3V > push button > GPIO24 (WiringPi n° 5)


    To test if we have connected the LED in the correct direction, we can plug in
    a cable between a 3.3V pin and GPIO22. If the LED doesn''t turn on, we need to
    swap it.'
