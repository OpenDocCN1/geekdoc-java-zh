  md: '# Free software tools on PC


    Most of these tools are available in versions for Windows, Apple and/or Linux,
    or similar applications can easily be found.


    # Integrated development environment aka IDE


    I''m a visual developer. While "die-hards" stick to text only and the terminal,
    I always use a lot of different programs that show you what''s happening. Even
    for back-end applications that run somewhere on a far-away server, I always try
    to have some kind of simple web page to at least know the program is running...


    Yes, you are allowed to call me old fashioned :-)


    There are a lot of different IDE''s you can use for Java development, but in this
    book, Visual Studio Code and IntelliJ IDEA are used. More about that later in
    "Chapter 3: Choosing an IDE".


    # Remote connection to a Raspberry Pi (SSH)


    To work on your Pi from a PC, or upload a file, SSH (Secure Shell) is the way
    to go (see "Enable SSH on the Pi" earlier in this chapter). MobaXterm¹⁵ is a great
    choice for Windows.


    To start a new session, click on the "Session" button and in the popup select
    "SSH", fill in the address of your Pi (which you can find on the Pi itself in
    the terminal by typing in “ifconfig”), specify the username ("pi") by default
    and click "OK".


    > ¹⁵https://mobaxterm.mobatec.net/'
