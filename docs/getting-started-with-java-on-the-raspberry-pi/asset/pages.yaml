    # Resize the root partition of the SD card


    When you start the Pi for the first time with a new SD card, the root partition
    will be resized automatically to use the maximum available capacity. If you need
    to do this manually, you can use "raspi-config" which provides a list of configuration
    and maintenance options. Start it over the terminal on your Pi:


