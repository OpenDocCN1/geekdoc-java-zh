  md: 'Chapter 9: Pi4j


    # Serial communication example with an Arduino


    In this example, we will be using an Arduino board as a serial client for the
    Pi. With a light sensor, we''ll do a measurement every few seconds and send the
    result as JSON data through serial communication via USB.


    Two of the GPIO of the Pi can also be used for serial communication, but by default,
    they can''t be used by an application as they are configured console terminal
    port to be connect to the board without an ethernet connection. In the readme
    of this example project, some links are added in which the steps are described
    that you need to use the pins as serial communication link, but this is not needed
    in our case as we use the USB connection.


    The finished application will show a line chart showing each measurement that
    is received from the Arduino board. The different values on the chart in the following
    screenshot were generated by switching between the bright light of my phone flashlight
    and covering the sensor.


    ![](img/d3f61a09bb1d08353ea609d038a99011_242_0.png)


    Running serial example with chart showing the measurements


    # Wiring


    Connect the sensor to the 5V on one side, and the other side to the A0 analog
    pin of the Arduino board. With a 10kΩ resistor connected between the A0-connection
    and the ground, we add a pull-down system to have a good measurement.'
