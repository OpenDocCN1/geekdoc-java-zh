  md: "# Chapter 10: Spring\n\n+   * POST localhost:8080/measurement: add a measurement\
    \ for the given sensor ID, key and value, after checking the given sensor ID is\
    \ defined in the database:\n\n```\n@RestController\npublic class MeasurementResource\
    \ {\n    @Autowired\n    private SensorRepository sensorRepository;\n\n    @Autowired\n\
    \    private MeasurementRepository measurementRepository;\n\n    @GetMapping(\"\
    /measurement\")\n    public List<MeasurementEntity> retrieveAllMeasurements()\
    \ {\n        return measurementRepository.findAll();\n    }\n\n    @PostMapping(\"\
    /measurement\")\n    public ResponseEntity createMeasurement(\n        @RequestParam\
    \ long sensorId,\n        @RequestParam String key,\n        @RequestParam double\
    \ value) {\n\n        SensorEntity sensorEntity = sensorRepository.findById(sensorId);\n\
    \n        if (sensorEntity == null) {\n            return ResponseEntity.status(HttpStatus.BAD_REQUEST)\n\
    \                .body(\"No sensor defined with the ID: \" + sensorId);\n    \
    \    }\n\n        MeasurementEntity measurementEntity = new MeasurementEntity(\n\
    \            sensorEntity, System.currentTimeMillis(), key, value);\n        measurementRepository.save(measurementEntity);\n\
    \n        return ResponseEntity.ok().build();\n    }\n}\n```\n\n# Adding Swagger\n\
