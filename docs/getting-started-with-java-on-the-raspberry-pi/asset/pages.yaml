  md: '# Some of the changes between Java versions


    As the Java maintainers make sure the core functionality doesn''t change fundamentally,
    you can use the same code with different Java versions. But with each newer version,
    features are added, and existing ones get improved and extended.


    For business applications, usually only LTS (-- Long Term Supported) versions
    are used, like 8 and 11. But it''s always a good idea to keep track of the changes
    between versions, so you have an idea of which new features become available.


    # Changes between Java 8 and 11


    Java 8 was the latest LTS version released by Oracle, it took some time before
    a next LTS became available, which was the 11 version.


    In-between LTS-versions, Java 9 introduced modules that enable us to build a smaller
    distributable and define what code is available for other applications. [Check
    this page**](http://tutorials.jenkov.com/java/modules.html)


    "shell" was also added in version 9 which enables us to quickly test Java code.
    To start, just type in jshell in the terminal:


    ```

    $ jshell

    | Welcome to JShell -- Version 11.0.4

    | For an introduction type: /help intro


    intro=====

    The jshell tool allows you to execute Java code. getting immediate results.

    | You can enter a Java definition (variable, method, class, etc), like: int x
    = 8

    | or a Java expression, like: x + x

    | or a Java statement or import.

    | These little chunks of Java code are called ''snippets''.

    | There are also the jshell tool commands that allow you to understand and

    | control what you are doing, like: /list

    | For a list of commands: /help

    ```'
