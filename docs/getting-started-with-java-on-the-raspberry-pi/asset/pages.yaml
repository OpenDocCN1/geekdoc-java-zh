    # SPI example code


    The chip can be controlled by sending two byte-values. The first one is a command
    which is either the row number (1 to 8) or one of the predefined functions (see
    table). The next bytes defines the action. For a row, it is the on or off value
    for each column as. We know from "Chapter 8: Bits and Bytes" that 8 bits fit in
    one HEX-value, so that''s exactly the number of LEDs in a row.


    The full specification of the MAX can be found in the datasheet¹⁰³, but this is
    a short version related to the example application we are going to build.


    > https://www.sparkfun.com/datasheets/Components/General/COM-09622-MAX72219-MAX7221.pdf'
