  md: '# Chapter 2: Tools and hardware used in this book


    the terminal will start in your home location and this command will show you the
    content of the current directory, so in this case the home directory "/home/pi".


    +   - $ ls

    - Desktop Documents Downloads MagPi Music Public Templates Videos


    By adding a path to the ls-command, we can get the content for a given directory,
    for example for the root of the system "/" or for the home directory "home":


    ```

    $ ls /

    - bin dev lost+found mnt proc run srv tmp var

    - boot etc lib media opt root sbin sys usr

    - ls /home

    - pi

    ```


    To get more information we can do with the additional "-la" parameters to include:


    +   - l: add additional information (user rights, owner, size, etc.)

    - a: including hidden files beginning with ".*(i.e. dotfiles)


    ```

