  md: '# Raspberry Pi types


    # Models


    Raspberry Pi boards are available in different models, enabling you to select
    the right one for your project. Model B is most known and used as it has the most
    connections. If you don''t need a cabled network connection, you can use a Model
    A. The Zero is the smallest one, but not applicable for Java projects as it doesn''t
    have the correct processor (see “Chapter 4: Java”).


    The Compute Module is aimed at professional use as it needs to be integrated on
    a board that is fully adjusted to fit in a specific product. It is already used
    in industrial controllers and computers, home automation, panel PCs,


    | Name | Description |

    | --- | --- |

    | Model A | Without ethernet connector |

    | Model B | With ethernet connector |

    | Zero | Smaller size and reduced GPIO capabilities |

    | Compute Module | Pi on a 200-pin DDR2-memory-like module for integration in
    embedded systems


    ![](img/d3f61a09bb1d08353ea609d038a99011_100_0.png)


    Model A - Model B - Zero - Compute Module


    # Major versions


    Both Model A and B evolved and had different versions. Each version extended and
    improved the boards. These were the main changes:'
