  md: "# Chapter 10: Spring\n\nCreate a package \"resource\" and a file \"SensorResource.java\"\
    . In here we define three services which will be available on a URL:\n\n+   -\
    \ GET localhost:8080/sensor: all the sensors from the database\n- GET localhost:8080/sensor/id:\
    \ one sensor from the database\n- POST localhost:8080/sensor: add a sensor with\
    \ the given name, after checking this name isn’t already used\n\nAll this is done\
    \ through the SensorRepository we created before:\n\n```\n@RestController\npublic\
    \ class SensorResource {\n    @Autowired\n    private SensorRepository sensorRepository;\n\
    \n    @GetMapping(\"/sensor\")\n    public List<SensorEntity> getAllSensors()\
    \ {\n        return sensorRepository.findAll();\n    }\n\n    @GetMapping(\"/sensor/{id}\"\
    )\n    public SensorEntity retrieveSensor(@RequestParam long id) {\n        return\
    \ sensorRepository.findById(id);\n    }\n\n    @PostMapping(\"/sensor\")\n   \
    \ public ResponseEntity createSensor(@RequestParam String name) {\n        List<SensorEntity>\
    \ sensorEntities = sensorRepository.findAllByName(name);\n\n        if (sensorEntities.size()\
    \ > 0) {\n            return ResponseEntity.status(HttpStatus.BAD_REQUEST)\n \
    \               .body(\"There is already a sensor with the name: \" + name);\n\
    \        }\n\n        SensorEntity sensorEntity = new SensorEntity(name);\n  \
    \      sensorRepository.save(sensorEntity);\n        return ResponseEntity.ok(sensorEntity);\n\
    \    }\n}\n```\n\nWe now need to do the same for the measurements to provide these\
    \ URLs:\n\n+   - GET localhost:8080/measurement: all the measurements from the\
    \ database"
  merge: -1
