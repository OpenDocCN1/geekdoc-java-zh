  md: 'Just thought: Abbreviations


    # TDD


    "Test Driven Development" is a way of coding, in which you first write the minimal
    test for a new feature in your application. As soon as your test succeeds you
    can refactor and improve your implementation. If you need more functionality,
    you first extend the test to turn green by adding the required code, and all previous
    tests stay green.


    Other DD-principles are "Behavior Driven Development" and "Domain Driven Design".


    BDD focuses on creating applications by a team in which each member has a different
    role (developer, tester, manager...) and fully understands the functionality to
    be implemented.

    DD is driven by a "domain expert" who can explain how the system work which needs
    to be implemented and developed different subsystems can be developed but share
    the same "domain". For instance, if you would design a software system for a shop
    you would have a database that stores the data, next to a program where clients
    and orders can be managed by two teams but share some functions for after-sales
    support. The domain expert has an overview of all the use cases and can guide
    the development team in the best approach.


    While most teams are to use a healthy mix of these and other principles, still
    "Deadline Development" is the real-world approach in a lot of companies...


    # RTFM


    "Read The Fucking Manual" is often used by a developer who gets frustrated by
    users asking the same question over and over again. In my opinion, the user is
    always right. This means, if they keep asking how something works, you probably
    didn''t make it easy enough or the user is using it differently than what you
    assumed would happen.


    That''s why you need to "fail fast and often", meaning you need to involve the
    end-user in your development process as soon as possible so they can start testing
    or it and give you feedback.


    Next time you use "RTFM", listen carefully to the question and what the user wants
    to do and why they doesn''t succeed...


    > * https://en.wikipedia.org/wiki/You_aren%27_t_need_it

    * https://en.wikipedia.org/wiki/RSS_principle

    * https://en.wikipedia.org/wiki/Principle_of_good_enough

    * https://en.wikipedia.org/wiki/Perfect_is_the_enemy_of_good

    * https://en.wikipedia.org/wiki/Not_invented_here

    * https://en.wikipedia.org/wiki/Don%21_repeat_yourself

    * https://www.codline.com/

    * https://en.wikipedia.org/wiki/Test-driven_development

    * https://en.wikipedia.org/wiki/Behavior-driven-development

    * https://en.wikipedia.org/wiki/Domain-driven-design

    * https://en.wikipedia.org/wiki/RTFM'
