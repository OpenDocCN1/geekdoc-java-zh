  md: "```\npublic class ClientCallback implements MqttCallback {\n    private ObservableList<String>\
    \ queueItems;\n\n    public ClientCallback(ObservableList<String> queueItems)\
    \ {\n        this.queueItems = queueItems;\n    }\n\n    @Override\n    public\
    \ void connectionLost(Throwable throwable) {\n        System.out.println(\"Connection\
    \ to MQTT broker lost!\");\n    }\n\n    @Override\n    public void messageArrived(String\
    \ s, MqttMessage mqttMessage) throws Exception {\n        String message = new\
    \ String(mqttMessage.getPayload());\n\n        System.out.println(\"Message received:\\\
    n\\t\" + message);\n\n        Platform.runLater(() -> {\n            queueItems.add(message);\n\
    \        });\n    }\n\n    @Override\n    public void deliveryComplete(IMqttDeliveryToken\
    \ iqttDeliveryToken) {\n        System.out.println(\"Delivery complete\");\n \
    \   }\n}\n```\n\nWe need to use Platform.runLater to avoid Thread errors between\
    \ the Java app running the connection, and the JavaFX thread which updates the\
    \ screen.\n\n# The user interface\n\nFor the user interface, we are using a ListView,\
    \ TextInput and Button.\n\n\n\n\nWhen combining everything we get this app, e.g.\
    \ running on a PC in the same network as the Pi."
