  md: '# SPI example with MAX7219 and 8x8 LED-matrix


    A perfect component to experiment with the SPI connection (see "Chapter 5 > Pin
    functions > Serial Peripheral Interface (SPI)") is the component you can also
    find in a lot of starter boxes which combines 8x8 LED-matrix with a MAX7219 chip.


    This chip can be controlled via SPI. You send it a command and don''t need to
    care about timings to control the LEDs as the chip takes care of this. The command
    is sent, and the chip is powered, the requested output is shown and you don''t
    need to control it.


    You can also connect multiple of these boards in a daisy-chain to create a long
    display. But make sure to use an external power supply to not draw too much current
    from the Pi. We will use one in this example and create some helper functions
    to work with images and characters.


    The same MAX-chip is also available in combination with 8 LED-number displays.
    You can build your combination of multiple LEDs in any shape. There are a lot
    of examples projects you can find online with 3D cubes with 3x3x3 or more LEDs
    (search for "LED 3D cube").


    | COL 1 | COL 2 | COL 3 | COL 4 | COL 5 | COL 6 | COL 7 | COL 8 |

    |---|---|---|---|---|---|---|---||

    | ROW 1 | | | | | | | | |

    | ROW 2 | | | | | | | | |

    | ROW 3 | | | | | | | | |

    | ROW 4 | | | | | | | | |

    | ROW 5 | | | | | | | | |

    | ROW 6 | | | | | | | | |

    | ROW 7 | | | | | | | | |

    | ROW 8 | | | | | | | | |


    Connections between the LEDs in a matrix


    The LEDs inside the matrix are connected as shown in the previous image. row,
    and connecting a column to the ground, a specific LED can be put on. When this
    is done faster than the eye can see, multiple LEDs look to be continuously powered
    while they are very fast.


    # Wiring


    SPI requires four connections, but as we don''t read data back, we only connect
    three of them plus power and ground.'
