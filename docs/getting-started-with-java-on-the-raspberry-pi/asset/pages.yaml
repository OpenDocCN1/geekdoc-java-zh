  md: '# Interview with Jakob Jenkov


    One of the best Java learning sites is tutorials.jenkov.com*. "eco-system", you''ll
    find plenty of information on this site! This site is a project of Jakob Jenkov,
    who is one of the experts with in almost every Java-experts-to-follow-list on
    Twitter or blogs.


    Jakob Jenkov, @jenkov*, Independent Software Architect, owns jenkov.com*, Co-founder
    + CTO of Nanosai²


    What is your history in the Java world?


    I learned Java during university in 1995-1997 and started working with Java professionally
    from 1999. I started writing tutorials around 2005-2006 because I felt there were
    areas of Java that could be covered.


    How did you start and maintain your tutorial website?


    I started with a few topics I needed a bit more coverage - and which were interesting
    for me to study in more detail. Then the content grew from there. However, as
    the body of content grew, keeping it up-to-date with new developments in the languages,
    APIs, frameworks, methods, etc. - is a growing task. From Aug. 2018 and until
    now (Feb. 2020) the majority of the effort I put into the website has gone into
    updating statistics. That is why regular readers might not have seen many new
    topics added. I mostly maintain it in my spare time, and in time between consulting
    contracts.


    What is your motivation to do this?


    Well, at I just wanted to see if there would be any readers. As started getting
    readers, I was hoping that it could be a living income. Income takes a lot of
    traffic to make money enough from ads to make a living comparable to having a
    normal developer job (if you live in Europe or the US at least). Most websites
    don''t have that level of traffic. I mostly wrote what I anyways need to learn
    e.g. for work or other projects, so I am not just pouring throws of technology
    without a purpose. And every time I need to Google for a problem at work and find
    someone else''s thorough solution to that, it confirms to me that sharing with
    everyone is a good thing :-)


    I don''t have a wife and children, so I have more extra time than many others.


    What are the most recent changes in Java?


    In my view, Java is evolving towards smaller footprint (small JDK), higher performance
    and more control. Java is also evolving building standalone applications with
    the Java platform included. The various APIs are more "optional", meaning if you
    don''t use them you can leave them out of your application distribution. APIs
    like Java EE and JavaFX were considered "core" Java before, have been separated
    out and take on a life of their own. Both are still very popular though.


    I believe this development is good that in sometimes what we believe is the "best
    way" to do something now, turns out to be a bait way when we get more experience
    with it. This way we'
