  ***\n\n由于你要测试登录功能，必须添加依赖项。以下假设你使用的是 Payara Server 及其 json-processing 模块：\n\n![nb10](img/nb10.png)\n\
  \n```java\npublic class LoginTest {\n\n  private Client client;\n  private WebTarget\
  \ target;\n\n  @Before\n  public void setUp() {\n    client = ClientBuilder.newClient();\n\
  \    target = client.target(\"http://localhost:8080/ShiroTutorial/\")\n        \
