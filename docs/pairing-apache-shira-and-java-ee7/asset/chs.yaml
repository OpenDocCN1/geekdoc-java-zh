  \n![](img/default.jpg) **Nebrass Lamouchi**\n\n\n在过去的几年里，我参与了许多使用 Java 开发应用程序的项目和公司。在这些应用程序中，我曾尝试实现身份验证与授权模块，有时会使用\
  \ Spring Security 或 JBoss Picketlink。\n我对 IT 安全的硕士研究以及在 OWASP 基金会的经验让我更有动力去探索如 `JAAS`、`JASPIC`、`Spring\
  \ Security` 和 `Picketlink` 等安全框架。\n\n当我听到 Apache Shiro 时，我立刻就想使用它。它将我常用的框架整合到了一个易于使用的包中。我想写这本书，是因为我看到这对于初级\
  \ Java 开发者来说，能够快速入门并开始安全化他们的应用程序非常有帮助。我想进一步深化这个精彩项目的知识。我想向他们展示安全并不可怕，它只是另一个可以提高你的应用程序安全体验（Application\
  \ Security eXperience）的框架。\n\n## InfoQ 微型书包含什么内容？\n\nInfoQ 微型书的设计旨在精简扼要，旨在为希望快速深入地对新技术或技术获得坚实概念理解的技术架构师提供服务。你可以将这些书看作是对主题的策略性或本质性的涵盖。在读完微型书后，读者应该对某项技术有基本的理解，包括何时以及如何应用它、它与其他技术的关系，并总体上感觉自己吸收了已经搞清楚这项技术的其他人士的综合知识。这样，当他们的项目需要时，读者就能对该技术做出明智的，并在那时深入研究更详细的信息源（如较大的书籍或教程）。\n\
  \n## 本书适合读者\n\n本书专门针对希望通过学习如何将 Apache Shiro 与 Java EE 7 结合来快速了解 Apache Shiro 的 Java\
  \ 开发者。\n\n## 读本书需要什么\n\n为了尝试书中的代码示例，你需要一台运行最新操作系统（Windows、Linux 或 Mac OS X）的电脑。你需要安装\
  \ Node.js 和 Java。书中的代码针对 Node.js v0.12 和 JDK 8 进行过测试，但较新版本也应该有效。\n\n## 规范\n\n我们在书中使用了一些排版惯例，以区分不同类型的信息。\n\
  \n文中的代码（包括命令、变量、文件名、XML 配置和属性名称）所示：ShiroFilterActivator 继承了 `ShiroFilter` 类。它的注解\
  \ `@WebFilter(\"/*\")` 启用了所有请求的过滤器。\n\n代码块如下所示。根据你阅读本书的格式，颜色可能会不同。\n\n```xml\n<?xml\
  \ version=\"1.0\" encoding=\"UTF-8\"?>\n<beans\n        xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\
  \n        xmlns=\"http://xmlns.jcp.org/xml/ns/javaee\"\n        xsi:schemaLocation=\"\
  http://xmlns.jcp.org/xml/ns/javaee\n                      http://xmlns.jcp.org/xml/ns/javaee/beans_1_1.xsd\"\
  \n        bean-discovery-mode=\"all\">\n</beans>\n```\nListing 1. `src/main/webapp/WEB-INF/beans.xml`\n\
  \n```java\n@ApplicationPath(\"api\")\npublic class JaxRsConfiguration extends Application\
  \ {\n    // JAX-RS 配置类\n}\n```\nListing 2. `src/main/java/demo/DemoApplication.java`\n\
  \n当我们想要你注意代码特定部分时，会使用数字标注。\n\n```java\nprivate String getCredentials(AuthenticationInfo\
  \ info) { ①\n\n    Object credentials = info.getCredentials(); ②\n    return toString(credentials);\
  \ ③\n}\n```\n\n1. *①* 我们将基础 `AuthenticationInfo` 对象传递给 `getCredentials()` 方法。\n\
  2. *②* `info.getCredentials()` 是 `getCredentials()` 方法调用的函数，用于从 `AuthenticationInfo`\
  \ 实例获取 `credentials` 对象。\n3. *③* 将 `credentials` 实例的字符串格式返回给 `getCredentials()`\
  \ 调用。\n\n最后，这段文字展示了引用格式。\n\n> “最后，重要的不是生命的长度，而是生命的跨度。”\n\n> \n\n> ~ 林肯\n\n## 读者反馈\n\
  \n我们总是欢迎读者的反馈。告诉我们你对这本书的看法——你喜欢或不喜欢。读者反馈有助于我们开发你受益最大的书籍。向我们发送反馈，请邮件至 `feedback@infoq.com`。\n\
  \n如果你在某个领域拥有知识并兴趣编写或贡献书籍，请查看我们的微型书指南：`http://www.infoq.com/minibook-guidelines`。\n\
  \n\n\n\n\n每一位合格的 Java EE 开发者都知道，平台中必须具备安全 API，无论是原生提供的，还是由第三方框架提供的。但自 1999 年 12\
  \ 月 12 日 Java EE 诞生以来，Java EE 一直缺乏一个完整且专用的安全规范。`JSR-375` 的创建是为了为 Java EE 安全提供一个完整的规范，它涵盖了所有需求，但将会在\
  \ Java EE 8 版本中可用，预计于 2017 年发布。\n\n安全特性中最受期待的之一是认证和授权。在本文中，我将认证和授权称为“Auth²”。尽管尝试过通过\
  \ `JAAS` (2001-2003) 和 `JASPIC` (2009) 让 Java EE 的开发人员实现某些“标准化”的 Auth²，但平台尚未为这些功能提供实用的解决方案。\n\
  \n如往常一样，当社区需要一个平台不幸未提供的功能时，第三方会尝试满足这一需求。Java EE 中 Auth² 最流行的明星项目是 `Spring Security`、JBoss\
  \ 的 `PicketLink` 以及 `Apache Shiro`。\n\n许多开发者选择实现自己的 Auth² 机制，而不是花时间去理解和实现这些古异的第三方解决方案。我之所以用“古异”，是因为每个第三方解决方案都与其创建者紧密绑定（例如\
  \ `Spring Security` 和 `JBoss PicketLink`），或者文档记录不全且模糊（`Apache Shiro` 就属于这种情况）。\n\
  \n## 个人案例\n\n我决定分享我使用 Auth² 框架的个人经验。我正尝试为 Java EE 7 构建一个我自己的、最新的安全框架。在 `JSR-375`\
  \ 参考实现发布之前，我的实现将非常有用。我将尝试解释所做的每一个选择，并希望这对你有所帮助。\n\n我尝试过许多 API，但每一个都让我感到失望。要么是方案难以实现（使用\
  \ `EJB` 实现 `Spring Security`、使用 `JAAS` 和 `JASPIC` 并不理想），要么是方案特定于供应商（`PicketLink`\
  \ 只能在 JBoss 服务器上使用），或者是 API 文档不全（`Apache Shiro`）。\n\n我在 2012 年 12 月发现了 `Apache Shiro`。在那时它并不流行。它用起来很困难，且受困于糟糕的文档和参考。我曾尝试使用它，但最终放弃了。\n\
  \n## 专业经验\n\n自从开始我的 Java 开发者生涯以来，每一位客户都要求我帮助实现他们自己的 Auth² 解决方案，只有一个客户要求我在他的 Web\
  \ 应用中实现 `Spring Security`。每当我处理安全层的工作时，我都会问自己：“为什么我又要做一遍这个？为什么没有高效的解决方案？可用性在哪里？我为什么要重复自己？”\n\
  \n上一次实现 Auth² 机制时，我使用了旧的 Java EE 6 技术：`JSP` 2.5、`Servlets` 3.0、`JMS` 1.1、`EJB` 3.1\
  \ 和 `JPA` 2.0。使用 Java EE API 实现开放应用安全项目（OWASP）规范是一次奇妙的体验。\n\n## 编写本教程的动力\n\n在完成上项目后，我决定重新审视\
  \ `Apache Shiro`，那个三年前我无法使用的神秘框架。\n\n奇怪的是，我发现 Shiro 网站页面多年来没有发生变化。没有新的板块，没有新的教程，也没有新的文档。显然，我在\
  \ YouTube、Vimeo 和 Dailymotion 上寻找 Shiro 的视频教程，但无果。我寻找了任何相关的书籍或文章，也没有显著结果。这对于一个 Apache\
  \ 项目来说非常奇怪。通常情况下，任何 Apache 项目都能得到良好的覆盖。但 Shiro 并非如此。\n\n我尝试在一个示例项目中使用 Shiro，以下是我的初步反馈：\n\
  \n* 它支持使用 `INI` 文件，这与 `Spring Security` 使用 `XML` 文件进行配置的风格不同。\n* 官方文档和资源不足。例如，网站上的官方教程只关注\
  \ `Stormpath`。\n* 最新版本 Shiro 的 `JavaDoc` 网站几乎无法访问（我已向 Apache Shiro Twitter 账号报告了此）。\n\
  \n我决定编写本教程来填补这一空白。\n\n![](img/default.jpg) **Nebrass Lamouchi**\n\n\n## 什么是 Shiro？\n\
  \n`Apache Shiro` 是一个开源软件安全框架，负责认证、授权、加密和会话管理。它最初被称为 `JSecurity`，Shiro 的设计旨在提供直观且易于实现的健壮安全功能。\n\
  \n书中详细介绍的教程针对寻求用于现代技术栈的 Auth² 框架的 Java 开发者。\n\n该项目在 2008 年推向 Apache 社区时获得了它的名字（“shiro”在日语中是“城堡”的意思）。“城堡”的任务旨在提供一个能够满足任何\
  \ Java 项目全方位安全考虑的标准框架。\n\n## 城堡计划\n\n`Apache Shiro` 涵盖了应用安全的四个核心关注：\n\n* 认证（Authentication），有时被称为“登录”，是证明用户是其所称身份的行为。\n\
  * 授权（Authorization）访问控制的过程，即确定谁有权访问什么。\n* 会话管理（Session management）管理用户特定的会话，即使在非\
  \ Web 或 Enterprise JavaBeans (`EJB`) 应用中也是。\n* 加密（Cryptography）使用加密算法保持数据安全，同时保持易用性。\n\
  \n![ShiroFeatures](img/ShiroFeatures.png)\n\n支持的环境包括：\n\n* Web 支持——Shiro 的 Web 支持\
  \ API 有助于保护 Web 应用。\n* 缓存（Caching）——缓存是 Apache Shiro 的特性，确保安全操作保持快速。\n* 并发（Concurrency）——Shiro\
  \ 的并发功能设计用于支持多线程应用。\n* 测试（Testing）——测试支持简化了单元测试和集成测试的创建，并确保你的代码是安全的。\n* “以身份运行”（Run\
  \ As）——Shiro 允许用户假设另一个身份（如果有权限），这在管理场景中非常有用。\n* “记住我”（Remember Me）——Shiro 跨会话记住用户的身份，他们只需在需要时登录。\n\
  \n## 为什么不用 JAAS 或 Spring Security？\n\n现有的 Java 安全机制（如 `JAAS`）令人困惑，并在应用层安全方面不足。某些方案（例如\
  \ `PicketLink`）依赖服务器。其他方案（如 `Spring Security`）需要繁琐的 `XML` 配置。\n\n`Apache Shiro`\
  \ 旨在通过提供一个用户友好、标准化的 API 来在项目中解决这些挑战。\n\n![](img/default.jpg) **Nebrass Lamouchi**\n\
  \n\n![logo shiro](img/logo-shiro.png)\n\n## 技术栈\n\n本教程使用了：\n\n* `Apache Shiro` 1.2.4\n\
  * Java EE 7 后端，带有 `JPA` 2.1、`EJB` 3.2 和 `JAX-RS` 2.0\n* `Payara Server`\n* `NetBeans`\
  \ 8.1 IDE\n\n\n\n\n\n# Java 平台企业版 (Java EE)\n\nJava 是社区驱动型企业软件的标准。Java EE 通过 Java\
  \ 社区进程（Java Community Process）不断扩展，其贡献来自行业专家、商业和开源组织、Java 用户组以及无数个人。每个版本的发布都整合了符合行业需求的新功能，提高了开发效率并增强了应用程序的可移植性。\n\
  \nJava EE 的最新版本是 Java EE 7，于 2013 年 6 月发布。Java EE 7 平台对 Web 标准的最新发展提供了原生支持，包括 `WebSockets`\
  \ 和 `JSON`，它们为 Java EE 支持 HTML 5 提供了基础。Java EE 7 还增加了由 `JAX-RS 2.0` 定义的现代 HTTP 客户端\
  \ API。\n\nJava EE 7 规范包括：\n\n* [WebSocket Java API — JSR-356](https://www.jcp.org/en/jsr/detail?id=356)\n\
  * [JSON 处理 Java API — JSR-353](https://www.jcp.org/en/jsr/detail?id=353)\n* [Java\
  \ 平台批处理应用 — JSR-352](https://www.jcp.org/ja/jsr/detail?id=352)\n* [Java EE 并发实用程序\
  \ — JSR-236](https://www.jcp.org/ja/jsr/detail?id=236)\n* [RESTful Web Services\
  \ Java API — JSR-311](https://www.jcp.org/en/jsr/detail?id=311)\n* [Java Message\
  \ Service 2.0 — JSR-343](https://www.jcp.org/en/jsr/detail?id=343)\n* [表达式语言 3.0\
  \ — JSR-341](https://www.jcp.org/en/jsr/detail?id=341)\n* [Enterprise JavaBeans\
  \ 3.2 — JSR-345](https://www.jcp.org/en/jsr/detail?id=345)\n* [Java 持化 2.1 — JSR-338](https://www.jcp.org/en/jsr/detail?id=338)\n\
  * [JavaServer Faces 2.2 — JSR-344](https://www.jcp.org/en/jsr/detail?id=344)\n\n\
  你可以在 [JSR-342](https://jcp.org/en/jsr/detail?id=342) 汇总页面找到关于 Java EE 7 规范的所有必要信息。\n\
  \nJava EE 7 规范。![javaee7](img/javaee7.jpg)\n\n## Payara Server\n\nPayara Server\
  \ 是 `GlassFish` 服务器的无缝替代品，并保证季度发布。Payara 团队为上游 `GlassFish` 服务器及其依赖库提供增强、错误修复和补丁。这使得\
  \ Payara Server 成为 Java EE 生态系统中中最适用于生产的应用程序服务器之一。Payara 团队还提供行业内顶级中间件工程师提供的 24/7\
  \ 专用事故处理和软件支持。该团队欢迎贡献，并公开报告其在编写功能或修复错误方面的进展。此外，还有一个响应敏捷的社区对任何请求做出快速反应。Payara Server\
  \ 在微调 `GlassFish` 的同时，保留了它的易用性和优美的管理功能。\n\n你可以从[项目网站](http://www.payara.fish/downloads)\
  \ 获取 Payara Server 的最新版本。\n\n![payara logo](img/payara-logo.jpg)\n\n## NetBeans\
  \ IDE\n\nNetBeans IDE 是 Oracle 提供的免费 Java IDE，旨在无需配置或插件即可减少编码错误并优化生产力。NetBeans 可以与你所有的环境组件（如数据库、自动化服务器、应用程序服务器、质量工具等）进行交互，而无需花费大量时间准备环境。\n\
  \nNetBeans IDE 具有出色的调试器功能，可以优化重构和调试过程。它包含一个强大的文本编辑器，带有重构工具、代码补全、代码片段和分析器，甚至还有多语言拼写检查器。NetBeans\
  \ 还通过开箱即 `Git`、`SVN`、`CVS` 和 `Mercurial` 等工具提供了强大的多系统版本控制。除了 Java 和 `JavaFX` 之外，NetBeans\
  \ IDE 还支持 `C/C++`、`PHP` 和 `HTML5/JavaScript`。NetBeans IDE 适用于所有支持兼容 `JVM` 的操作系统。\n\
  \nNetBeans 在美国、法国、英国、荷兰、巴西等国家和全球范围内举办许多免费会议和活动。参加这些活动不仅让你学到 NetBeans 的技能，还能学到通用编程。\n\
  \n你可以在 [NetBeans 网站](https://netbeans.org/downloads/index.html) 下载最新版本的 NetBeans\
  \ IDE。\n\n![netbeans logo](img/netbeans-logo.png)\n\n![](img/default.jpg) Nebrass\
  \ Lamouchi\n\n\n本书剩余部分是一个分步骤演示的教程，旨在让你能够轻松跟随。\n\n首先，安装教程工具集以便你可以根据截图进行操作：\n\n* [JDK\
