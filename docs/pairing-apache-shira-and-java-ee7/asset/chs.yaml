  all\">\n\n</beans>\n```\n\n## 步骤 3: Apache Shiro \n\n首先，在你的项目中添加 Apache Shiro 依赖：\n\
  \n```xml\n<dependency>\n    <groupId>org.apache.shiro</groupId>\n    <artifactId>shiro-web</artifactId>\n\
  \    <version>1.2.4</version>\n</dependency>\n```\n\nApache Shiro 使用 INI 配置文件来定义参数。这是一个\
  \ `shiro.ini` 文件的示例：\n\n```ini\n[main]\nauthc.loginUrl = /login.jsp ①\nauthc.successUrl\
  \ = /home.jsp\n\npasswordMatcher = org.apache.shiro.authc.credential.HashedCredentialsMatcher\
  \ ②\npasswordService = org.apache.shiro.authc.credential.DefaultPasswordService\n\
  passwordMatcher.passwordService = $passwordService\n\nds = com.jolbox.bonecp.BoneCPDataSource\
  \ ③\nds.driverClass=com.mysql.jdbc.Driver\nds.jdbcUrl=jdbc:mysql://localhost:3306/simple_shiro_web_app\n\
  ds.username = root\nds.password = 123qwe\n\njdbcRealm = org.apache.shiro.realm.jdbc.JdbcRealm\
  \ ④\njdbcRealm.permissionsLookupEnabled = true\njdbcRealm.authenticationQuery =\
  \ SELECT password FROM USERS WHERE username = ?\njdbcRealm.userRolesQuery = SELECT\
  \ role_name FROM USERS_ROLES WHERE username = ?\njdbcRealm.permissionsQuery = SELECT\
  \ permission_name FROM ROLES_PERMISSIONS WHERE role_name = ?\njdbcRealm.credentialsMatcher\
  \ = $passwordMatcher\njdbcRealm.dataSource=$ds\n\nsecurityManager.realms = $jdbcRealm\
  \ ⑤\n\n[urls] ⑥\n## /login.jsp 不限制为已验证的用户（否则没人能登录！），\n# 但必须为其指定 'authc' 过滤器以便处理该\
  \ URL 的登录提交。\n# 它足够智能，可以允许上述 shiro.loginUrl 指定的请求通过。\n/login.jsp = authc\n/home.jsp\
  \ = anon, authc\n/logout = logout\n/account/** = authc\n```\n\n1. ① **authc** 登录过滤器的配置](http://shiro.apache.org/static/current/apidocs/org/apache/shiro/web/filter/authc/FormAuthenticationFilter.html)\uFEFF\
  。\n2. ② 哈希密码匹配器。\n3. ③ 数据源。\n4. ④ JDBC  Realm。\n5. ⑤ 安全管理器的领域（realms）。\n6. ⑥ URL\
  \ 映射。\n\n\n\n\n\n2. ② 对 [`passwordMatcher`](http://shiro.apache.org/static/current/apidocs/org/apache/shiro/authc/credential/PasswordMatcher.html)\
  \ 和 [`passwordService`](http://shiro.apache.org/static/current/apidocs/org/apache/shiro/authc/credential/PasswordService.html)\
  \ 的配置，它们是用于密码验证和匹配的组件。\n\n3. ③ 此示例中 `Datasource` 的定义是一个 JDBC `DataSource`。\n\n4.\
  \ ④ 此示例中 `Realm` 的配置是一个 JDBC `Realm`。\n\n5. ⑤ 这将配置好的 `Realm` 分配给 Shiro 的 `SecurityManager`。\n\
  \n6. ⑥ 这将 URL 模式分配给相应的过滤器。\n\n此 `shiro.ini` 文件必须放置在 `src/main/webapp/WEB-INF` 或\
  \ `src/main/resources` 中。若要启用 Shiro 框架，你必须配置你的 `web.xml` 文件。\n\n```xml\n<listener>\n\
  \    <listener-class>\n        org.apache.shiro.web.env.EnvironmentLoaderListener\n\
  \    </listener-class>\n</listener>\n\n<filter>\n    <filter-name>ShiroFilter</filter-name>\n\
  \    <filter-class>org.apache.shiro.web.servlet.ShiroFilter</filter-class>\n</filter>\n\
  \n<filter-mapping>\n    <filter-name>ShiroFilter</filter-name>\n    <url-pattern>/*</url-pattern>\n\
  \    <dispatcher>REQUEST</dispatcher>\n    <dispatcher>FORWARD</dispatcher>\n  \
  \  <dispatcher>INCLUDE</dispatcher>\n    <dispatcher>ERROR</dispatcher>\n</filter-mapping>\n\
  ```\n\n我听到你的抗议了！这些配置文件与 Java EE 的“约定优于配置”方法完全冲突！\n\n在每一个新的 Java EE 版本中，你都应该尽量减少配置文件。本教程的一个重点是在不使用混乱配置文件的情况下构建我们的\
  \ Shiro 框架应用程序。你可以尝试用一些创新解决方案来绕过这个问题。例如，你可以使用 Servlet 3.0 的特性来代替 `web.xml` 文件，在代码中定义过滤器：\n\
  \n- 你可以通过添加 servlet、过滤器、web 帧等方法来增加可插性。\n- 你可以通过针对 servlet、servlet 过滤器和 servlet\
  \ 上下文监听器的注解来提高开发便利性。\n\n## 第 4 步：Shiro：深入阶\n\n### 第 4.1 步：消除 web.xml 配置\n\n####\
  \ 第 4.1.1 步：从过滤器到 @WebFilter\n\n过滤器是可以转换请求或响应头部和内容（或两者）的对象。过滤器与 web 组件的区别在于，过滤器通常不会自己创建响应。相反，过滤器提供了可以附加到任何类型\
  \ web 资源的功能。因此，过滤器不应该对其作为过滤器的 web 资源有任何依赖；这样，它就可以与多种类型的 web 资源组合。\n\n过滤器可以执行的主要任务包括：\n\
  \n- 查询请求并采取相应的行动。\n- 阻止请求-响应对继续向下传递。\n- 修改请求头和数据。你通过提供请求的自定义版本来实现这一点。\n- 修改响应头和数据。你通过提供响应的自定义版本来实现这一点。\n\
  - 与外部资源交互。\n\nShiro 过滤器是实现 Shiro 框架的 web 应用程序的主要过滤器。\n\n要实现这一点，引入扩展 `org.apache.shiro.web.servlet.ShiroFilter`\
  \ 的类 `ShiroFilterActivator`，并将该过滤器应用于所有请求（\"/*\"）。\n\n```java\n@WebFilter(\"/*\"\
  )\npublic class ShiroFilterActivator extends ShiroFilter {\n    private ShiroFilterActivator()\
  \ {\n    }\n}\n```\n\n#### 第 4.1.2 步：从监听器到 @WebListener\n\n创建一个扩展 `org.apache.shiro.web.env.EnvironmentLoaderListener`\
  \ 的 `ShiroListener` 类。在 `contextInitialized()` 方法中，使用 `DefaultWebEnvironment` 类名初始化\
  \ `ENVIRONMENT_CLASS_PARAM` (`shiroEnvironmentClass`)。它用于定义在 servlet 上文中使用的 `WebEnvironment`\
  \ 实现类。\n\n```java\n@WebListener\npublic class ShiroListener extends EnvironmentLoaderListener\
  \ {\n    @Override\n    public void contextInitialized(ServletContextEvent sce)\
  \ {\n        sce.getServletContext()\n           .setInitParameter(ENVIRONMENT_CLASS_PARAM,\
  \ DefaultWebEnvironment.class.getName());\n        super.contextInitialized(sce);\n\
  \    }\n}\n```\n\n***\n\n### 第 4.2 步：消除 INI 配置文件\n\n为了消除对 INI 配置文件的使用，使用 `createEnvironment(ServletContext\
  \ sc)` 方法来定义 `WebEnvironment`。\n\n```java\n@Override\nprotected WebEnvironment createEnvironment(ServletContext\
  \ sc) {\n    DefaultWebEnvironment webEnvironment = (DefaultWebEnvironment) super.createEnvironment(sc);\n\
  \    ...\n    return webEnvironment;\n}\n```\n\n在 `WebEnvironment` 组件中，你必须定义两个参数：`FilterChainResolver`\
  \ 和 `SecurityManager`。但在定义 `FilterChainResolver` 之前，你必须先理解 `FilterChain` 的概念。\n\n\
  换说 Java EE 5 的 JavaDoc，servlet 容器提供了 `FilterChain` 对象，允许开发者查看针对资源的经过过滤请求的调用链。过滤器使用\
  \ `FilterChain` 来调用链中的下一个过滤器，或者如果调用的过滤器是链中的最后一个过滤器，则调用链末尾的资源。\n\nShiro 官方 JavaDoc\
  \ 定义了一些 `WebEnvironment` 组件。它指出 `FilterChainResolver` 可以解析适当的 `FilterChain`。它允许在\
  \ Servlet 请求执行期间解析任意 `FilterChain`。\n\n这种机制比普通的 `web.xml` 过滤器定义提供了更灵活的 `FilterChain`\
  \ 解析。它允许以更简洁、易读的方式为每个 URL 定义任意的过滤器链，甚至在底层实现支持的情况下在运行时动态解析或构建过滤器链。\n\n`SecurityManager`\
  \ 执行整个应用程序中所有 `Subjects`（即用户）的安全操作。该接口本身主要为了便利——它扩展了 `Authenticator`、`Authorizer`\
  \ 和 `SessionManager` 接口，从而将这些行为整合到一个引用点中。在大多数情况下，通过允许开发者与单个 `SecurityManager` 交互而不是分别引用\
  \ `Authenticator`、`Authorizer` 和 `SessionManager` 实例，这简化了配置。\n\n显然，你需要创建这些组件：`FilterChainResolver`\
  \ 和 `SecurityManager`。\n\n***\n\n首先创建一个类来持有 ShiroConfiguration 类的配置。该类有两个公共 getter。\n\
  \n```java\npublic class ShiroConfiguration {\n    private ShiroConfiguration() {\n\
  \    }\n\n    public WebSecurityManager getSecurityManager() {\n    }\n\n    public\
  \ FilterChainResolver getFilterChainResolver() {\n    }\n}\n```\n\n但这个解决方案仍然不；你想使用依赖注入来设置\
  \ `FilterChainResolver` 和 `SecurityManager` 实例。为了启用这两个配置组件的注入，通过注解两个 getter 方法来将实例绑定到你的会话。\n\
  \n```java\npublic class ShiroConfiguration {\n    private ShiroConfiguration() {\n\
  \    }\n\n    @Produces\n    public WebSecurityManager getSecurityManager() {\n\
  \    }\n\n    @Produces\n    public FilterChainResolver getFilterChainResolver()\
  \ {\n    }\n}\n```\n\n***\n\n你可以创建一个更优雅的 `ShiroListener`，为两个参数都使用 `@Inject`。\n\n\
  \n\n\n\n```\n@WebListener\npublic class ShiroListener extends EnvironmentLoaderListener\
  \ {\n    @Inject\n    WebSecurityManager webSecurityManager;\n    @Inject\n    FilterChainResolver\
  \ filterChainResolver;\n\n    @Override\n    protected WebEnvironment createEnvironment(ServletContext\
  \ sc) {\n        DefaultWebEnvironment webEnvironment = (DefaultWebEnvironment)\
  \ super.createEnvironment(sc);\n\n        webEnvironment.setSecurityManager(securityManager);\n\
  \        webEnvironment.setFilterChainResolver(filterChainResolver);\n\n       \
  \ return webEnvironment;\n    }\n\n    @Override\n    public void contextInitialized(ServletContextEvent\
  \ sce) {\n        sce.getServletContext()\n            .setInitParameter(ENVIRONMENT_CLASS_PARAM,\
  \ DefaultWebEnvironment.class.getName());\n        super.contextInitialized(sce);\n\
  \    }\n}\n```\n\n`ShiroListener` 类现在已经准备就绪，是时候定义你的 `ShiroWebEnvironmentConfiguration`\
  \ 类了。\n\n## 步骤 4.2.1: 编写 SecurityManager 生产者\n\nShiro 的 `SecurityManager` 有许多用于调调安全体验的功能和选项。对于基于\
  \ Web 的应用程序，Shiro 提供了一个名为 `DefaultWebSecurityManager` 的默认 `SecurityManager` 实现，它包含许多预配置的选项。这种选择对于新手以及功能性较简单的应用程序来说都特别有用。我建议你从默认实现开始，并根据需要修改每个选项。\n\
  \n以下是 Apache Shiro 框架中最重要的核心元素：\n\n* `SessionManager`\n* `Realm`\n* `Authenticator`\n\
  * `Authorizer`\n* `CacheManager`\n* `SubjectDAO`\n* `CredentialsMatcher`\n\n在进入代码之前，让我们先回顾一下官方\
  \ Shiro Javadoc 中指定的定义：\n\n* `SessionManager` 负责所有应用程序会话的创建、维护和清理。\n* `Realm` 是一种安全组件，可以访问特定的应用程序安全实体（如用户、角色和权限），以确定身份验证和授权操作。`Realm`\
  \ 通常与数据源（如关系型数据库、文件系统或类似的资源）有一一的对应关系。因此，该接口的实现使用特定数据源的 API 来确定授权数据（角色、权限等），例如 `JDBC`、`File\
  \ IO`、`Hibernate` 或 `JPA` 或任何其他数据访问 API。`Realm` 本质上是一个特定的安全的 DAO。\n* `Authenticator`\
  \ 负责应用程序中的账户身份验证。它是进入 Shiro API 的主要入口点之一。\n* `Authorizer` 为任何给 `Subject`（即应用程序用户）执行授权（访问控制）操作。每个方法都需要一个主体主体（principal）来为相应的用户执行操作。\n\
  * `CacheManager` 提供并维护缓存实例的生命周期。Shiro 本身没有实现完整的缓存机制，因为这超出了安全框架的核心范畴。相反，该接口在底层缓存框架的主管理器组件（例如\
  \ `JCache`、`Ehcache`、`JCS`、`OSCache`、`JBoss Cache`、`Terracotta`、`Coherence`、`GigaSpaces`\
  \ 等）之上提供了一个抽象 API，允许 Shiro 用户配置选择的任何缓存机制。\n* `SubjectDAO` 是一种数据访问对象的设计规范，允许会话访问企业信息系统（EIS）。它提供了常用的\
  \ CRUD 方法：\n    * create (`org.apache.shiro.session.Session`)\n    * readSession\
  \ (`java.io.Serializable`)\n    * update (`org.apache.shiro.session.Session`)\n\
  \    * delete (`org.apache.shiro.session.Session`)\n* `CredentialsMatcher` 是一个接口，由类实现以判断\
  \ `AuthenticationToken` 提供的凭据与系统中存储的对应账户凭据是否匹配。\n* `PasswordMatcher` 是 `CredentialsMatcher`\
  \ 的实现，它对哈希后的文本密码采用最佳实践比较。\n* `RememberMeManager` 是 Shiro 框架 `SecurityManager` 接口的默认具体实现，基于一组\
  \ `Realms`。该实现通过父类实现将其身份验证、授权和会话操作分别委托给封装的 `Authenticator`、`Authorizer` 和 `SessionManager`\
  \ 实例。\n\nShiro 的 JavaDoc 有些不足，但希望我们的解释能改善这一点。\n\n对于你的 `SecurityManager`，你将：\n\n\
  * 使用 `DefaultWebSecurityManager` 作为实现。\n* 创建你自定义的 `Realm`（我们稍后会看到原因）。\n* 使用带有自定义\
  \ `PasswordService` 的 `PasswordMatcher` 作为 `CredentialsMatcher`。\n* 使用 `CookieRememberMeManager`\
  \ 作为 `RememberMeManager`，因为你的实现将使用 cookie 来记住和跟踪用户 (`Subjects`）。你将为 `RememberMeManager`\
  \ 添加 `CipherKey` 以改进 cookie 命名。\n* 还有一个大惊喜，你将使用一个缓存管理器，即 `EhCacheManager`！（Shiro\
  \ 承诺在未来的版本中提供对 `Hazelcast` 等缓存提供器的原生支持）。\n\n### 步骤 4.2.1.1: 编写 Realm\n\n要创建 `Realm`，你必须创建一个扩展\
  \ `org.apache.shiro.realm.AuthorizingRealm` 抽象类并实现关键方法：\n\n* `doGetAuthenticationInfo(AuthenticationToken\
  \ token)` 方法是位于存储系统（DB、LDAP 等）中的身份信息（在我们例中为用户名和密码）的“get”。\n* `doGetAuthorizationInfo(PrincipalCollection\
  \ principals)` 方法是授权信息（在我们例中仅为角色，但根据项目选择的授权策略，可以是角色和权限，或仅限权限）的“get”。\n\n由于此项目使用了带有\
  \ Shiro 框架的 Java EE 特性，你将使用 EJB 处理数据。因此我们将使用注入（或尝试）来调用 EJB。注意，Shiro 组件并不是 CDI 感知的，因为某些方法是\
  \ final 的。\n\nStack Overflow 上有一些说明该问题的帖子：\n\n* [`stackoverflow.com/questions/15605038`](http://stackoverflow.com/questions/15605038)\n\
  * [`stackoverflow.com/questions/18507629`](http://stackoverflow.com/questions/18507629)\n\
  \n但不用担心——有一些技巧可以让它工作！注入我们的 EJB 至少有两种方法：`UserService` 和 `RoleService`。\n\n``````\n\
  public class ShiroConfiguration {\n    @Inject\n    UserService userService;\n\n\
  \    @Produces\n    public WebSecurityManager getSecurityManager() {\n        DefaultWebSecurityManager\
  \ securityManager = null;\n        if (securityManager == null) {\n            AuthorizingRealm\
  \ realm = new SecurityRealm(userService);\n            …\n            securityManager\
  \ = new DefaultWebSecurityManager(realm);\n        }\n        return securityManager;\n\
  \    }\n}\n```\n\n列表 5。方法 1) 将 EJB 注入到 `ShiroConfiguration` 类并将其传递给 `Realm` 的构造函数。\n\
  \n遗憾的是，这种策略违反了正确的关注点分离，因此让我们看看另一种方法。\n\n**方法 2) 在 `Realm` 中使用经典的 JNDI 查找来获取对 EJB\
  \ 的访问：** Java EE 6 规范为 EJB JNDI 查找名称提供了通用格式：`java:global[/appName]/moduleName/beanName`。\n\
  \n\n\n\n\n查找名称中的 `appName` 组件被显示为可选，因为它不适用于部署在独立模块中的 beans。只有封装在 `.ear` 文件中的 beans\
  \ 才会在 `java:global` 查找名称中包含 `appName` 组件。由于你的应用程序被打包为 WAR，因此在企业企业 Bean（EJB）的 JNDI\
  \ 名称中不会有 `appName` 值。你的 `moduleName` 为 `\"ShiroTutorial\"`（请参见 `pom.xml`）。\n\n因此，你\
  \ EJB 的 JNDI 名称为：\n\n```\njava:global/ShiroTutorial/UserService\njava:global/ShiroTutorial/RoleService\n\
  ```\n\n***\n\n现在，你可以按照如下方式编写 `SecurityRealm`：\n\n```java\npublic class SecurityRealm\
  \ extends AuthorizingRealm {\n    private Logger logger;\n    private UserService\
  \ userService;\n\n    public SecurityRealm() {\n        super();\n        this.logger\
  \ = Logger.getLogger(SecurityRealm.class.getName());\n\n        try {\n        \
  \    InitialContext ctx = new InitialContext();\n            this.userService =\
  \ (UserService) ctx.lookup(\"java:global/ShiroTutorial/UserService\");\n       \
  \ } catch (NamingException ex) {\n            logger\n                .warning(\"\
  Cannot do the JNDI Lookup to instantiate the User service : \" + ex);\n        }\n\
  \    }\n}\n```\n\n规范为 `appName` 和 `moduleName` 固定了预定义的 JNDI 名称，因此你可以动态地获取它们。\n\n\
  ```\njava:app/AppName\njava:module/ModuleName\n```\n\n使用这些名称，你可以这样编写 JNDI 查找代码：\n\
  \n```java\ntry {\n    InitialContext ctx = new InitialContext();\n    String moduleName\
  \ = (String) ctx.lookup(\"java:module/ModuleName\");\n    this.userService = (UserService)\
  \ ctx.lookup(String.format(\"java:global/%s/UserService\", moduleName));\n} catch\
  \ (NamingException ex) {\n    logger\n        .warning(\"Cannot do the JNDI Lookup\
  \ to instantiate the User service : \" + ex);\n}\n```\n\n***\n\n现在，在 `doGetAuthenticationInfo()`\
  \ 和 `doGetAuthorizationInfo()` 方法中使用你的 EJB。\n\n```java\n@Override\nprotected AuthenticationInfo\
  \ doGetAuthenticationInfo(AuthenticationToken token) throws AuthenticationException\
  \ {\n    // 识别要登录的账户\n    UsernamePasswordToken userPassToken = (UsernamePasswordToken)\
  \ token;\n    String username = userPassToken.getUsername();\n    if (username ==\
  \ null) {\n        logger.warning(\"Username is null.\");\n        return null;\n\
  \    }\n\n    // 从数据库中读取用户\n    User user = this.userService.findByUsername(username);\n\
  \    if (user == null) {\n        logger.warning(\"No account found for user [\"\
  \ + username + \"]\");\n        throw new IncorrectCredentialsException();\n   \
  \ }\n\n    return new SimpleAuthenticationInfo(username, user.getPassword(), getName());\n\
  }\n\n@Override\nprotected AuthorizationInfo doGetAuthorizationInfo(PrincipalCollection\
  \ principals) {\n    // 用户名是无效的\n    if (principals == null) {\n        throw new\
  \ AuthorizationException(\"PrincipalCollection method argument cannot be null.\"\
  );\n    }\n\n    String username = (String) getAvailablePrincipal(principals);\n\
  \    Set<String> roleNames = new HashSet<>();\n    roleNames.add(this.userService.findByUsername(username).getRole().getName());\n\
  \    AuthorizationInfo info = new SimpleAuthorizationInfo(roleNames);\n\n    /**\n\
  \    * 如果你想进行基于权限的授权，可以获取与你的用户关联的权限列表：\n    * Set<String> permissions = new HashSet<>();\n\
  \    * permissions.add(this.userService.findByUsername(username).getRole().getPermissions());\n\
  \    * ((SimpleAuthorizationInfo)info).setStringPermissions(permissions);\n    */\n\
  \    return info;\n}\n```\n\n代码非常直观，且组件名称已经说明了一切。\n\n### 步骤 4.2.1.2：编写 CredentialsMatcher\n\
  \n`CredentialsMatcher` 是用于验证凭据并检查是否可以授予访问的组件。`CredentialsMatcher` 接口有许多实现：\n\n*\
  \ `AllowAllCredentialsMatcher`\n* `HashedCredentialsMatcher`\n* `Md2CredentialsMatcher`\n\
  * `Md5CredentialsMatcher`\n* `PasswordMatcher`\n* `Sha1CredentialsMatcher`\n* `Sha256CredentialsMatcher`\n\
  * `Sha384CredentialsMatcher`\n* `Sha512CredentialsMatcher`\n* `SimpleCredentialsMatcher`\n\
  \n`CredentialsMatcher` 的每个实现都有特定的属性和功能。例如，`SimpleCredentialsMatcher` 用于直接的明文比较。`PasswordMatcher`\
  \ 使用内部的 `PasswordService` 来比较密码。Shiro 的 JavaDoc 将 `PasswordMatcher` 描述为“一个对哈希文本密码采用最佳实践比较的\
  \ `CredentialsMatcher`”。\n\n选择 `PasswordMatcher` 作为 `CredentialsMatcher` 的实现，以便你可以为密码验证定义自定义的\
  \ `PasswordService`。\n\n让我们来聊聊密码本身。我们需要选择一种哈希算法来存储和比较密码。经过研究，我选择了 `bcrypt` 作为哈希算法。基于\
  \ Blowfish 对称密钥块密码加密算法，`bcrypt` 是一种自适应哈希函数，它引入了一个工作因子（也称为安全因子），该因子允许你确定哈希函数的成本。\n\
  \n让我们使用 `bcrypt` 的 `jBCrypt` 实现，你必须在 `pom.xml` 文件中添加该依赖。\n\n```xml\n<dependency>\n\
  \    <groupId>de.svenkubiak</groupId>\n    <artifactId>jBCrypt</artifactId>\n</dependency>\n\
  ```\n\n***\n\n接下来，编写自定义的 `PasswordService` 类。将类命名为 `BCryptPasswordService` 并实现 `PasswordService`\
  \ 接口及其两个方法 `encryptPassword()` 和 `passwordsMatch()`。\n\n```java\npublic class BCryptPasswordService\
  \ implements PasswordService {\n    public static final int DEFAULT_BCRYPT_ROUND\
  \ = 10;\n    private int logounds;\n\n    public BCryptPasswordService() {\n   \
  \     this.logounds = DEFAULT_BCRYPT_ROUND;\n    }\n\n    public BCryptPasswordService(int\
  \ logounds) {\n        this.logounds = logounds;\n    }\n\n    @Override\n    public\
  \ String encryptPassword(Object plaintextPassword) {\n        if (plaintextPassword\
  \ instanceof String) {\n            String password = (String) plaintextPassword;\n\
  \            return BCrypt.hashpw(password, BCrypt.gensalt(logounds));\n       \
  \ }\n        throw new IllegalArgumentException(\n                \"BCryptPasswordService\
  \ encryptPassword only support java.lang.String.\");\n    }\n\n    @Override\n \
  \   public boolean passwordsMatch(Object submittedPlaintext, String encrypted) {\n\
  \        if (submittedPlaintext instanceof char[]) {\n            String password\
  \ = String.valueOf((char[]) submittedPlaintext);\n            return BCrypt.checkpw(password,\
  \ encrypted);\n        }\n        throw new IllegalArgumentException(\n        \
  \        \"BCryptPasswordService passwordsMatch only support char[].\");\n    }\n\
  \n    public void setLogRounds(int logounds) {\n        this.logounds = logounds;\n\
  \    }\n\n    public int getLogRounds() {\n        return logounds;\n    }\n}\n\
  ```\n\n***\n\n该类将在 `CredentialsMatcher` 的 `passwordMatch()` 方法中使用。但它也可以用于新用户的注册过程，在调用\
  \ `UserService` 的 `save` 方法之前。\n\n因此，更新你的 `ShiroConfiguration` 类。\n\n```java\npublic\
  \ class ShiroConfiguration {\n    @Inject\n    UserService userService;\n\n    @Produces\n\
  \    public WebSecurityManager getSecurityManager() {\n        DefaultWebSecurityManager\
  \ securityManager = null;\n        if (securityManager == null) {\n            AuthorizingRealm\
  \ realm = new SecurityRealm(userService);\n            CredentialsMatcher credentialsMatcher\
  \ = new PasswordMatcher();\n            ((PasswordMatcher) credentialsMatcher).setPasswordService(new\
  \ BCryptPasswordService());\n            realm.setCredentialsMatcher(credentialsMatcher);\n\
  \            …\n            securityManager = new DefaultWebSecurityManager(realm);\n\
  \        }\n        return securityManager;\n    }\n}\n```\n\n##### 步骤 4.2.1.3：编写\
  \ RememberMeManager\n\n\n\n\n接下来，为 `SecurityManager` 添加一个 `RememberMeManager`，它将使用\
  \ Cookie 来记住安全会话。为此请使用 `CookieRememberMeManager` 实现。\n\nCookie 值是多个主体（principals）集合的序列化表示经过\
  \ AES 加密表示后的 Base64 编码表示。简单来说，它包含了必要的用户信息，可以使用正确的密钥进行解密。使用默认密钥是不可行的，因为黑客通过查看 Shiro\
  \ 的源码就能发现这一点，因此请指定自定义的 `AES` 密码密钥。\n\n你自定义的 `RememberMeManager` 如下：\n\n```java\n\
  byte[] cypherKey = String.format(\"0x%s\", Hex.encodeToString(new AesCipherService().generateNewKey().getEncoded())).getBytes();\n\
  \nRememberMeManager rememberMeManager = new CookieRememberMeManager();\n((CookieRememberMeManager)\
  \ rememberMeManager).setCipherKey(cypherKey);\n\nsecurityManager.setRememberMeManager(rememberMeManager);\n\
  ```\n\n你自定义的 `RememberMeManager` 已准备就绪。\n\n### 步骤 4.2.1.4: 编写 CacheManager\n\nShiro\
  \ 已开始支持缓存系统，虽然目前的支持尚显不足，但在未来的版本中它将变得更加健壮。但 Shiro 支持 EhCache，它非常符合本项目的需求。让我们将该依赖添加到\
  \ `pom.xml` 文件中。\n\n```xml\n<!-- EhCache Dependencies -->\n<dependency>\n    <groupId>org.apache.shiro</groupId>\n\
  \    <artifactId>shiro-ehcache</artifactId>\n    <version>1.2.4</version>\n</dependency>\n\
  \n<dependency>\n    <groupId>net.sf.ehcache</groupId>\n    <artifactId>ehcache</artifactId>\n\
  \    <version>2.10.1</version>\n</dependency>\n```\n\n接下来，在 `src/main/resources`\
  \ 文件夹中创建 EhCache 配置文件。你可以将其命名为 `ehcache.xml`。\n\n```xml\n<ehcache name=\"shiro\"\
  \ updateCheck=\"false\">\n    <diskStore path=\"/Users/nebrass/shiro-ehcache\"/>\n\
  \n    <defaultCache\n        maxElementsInMemory=\"10000\"\n        eternal=\"false\"\
  \n        timeToIdleSeconds=\"120\"\n        timeToLiveSeconds=\"120\"\n       \
  \ overflowToDisk=\"false\"\n        diskPersistent=\"false\"\n        diskExpiryThreadIntervalSeconds=\"\
  120\"/>\n\n</ehcache>\n```\n\n我建议避免使用默认值，并始终将 `diskStore` 值指定为缓存存储的路径。\n\n***\n\n\
  现在，你可以在 `ShiroConfiguration` 类中为你的 `SecurityManager` 定义 `CacheManager`。\n\n```java\n\
  CacheManager cacheManager = new EhCacheManager();\n((EhCacheManager) cacheManager).setCacheManagerConfigFile(\"\
  classpath:ehcache.xml\");\nsecurityManager.setCacheManager(cacheManager);\n```\n\
  \n`classpath:ehcache.xml` 段表示 `ehcache.xml` 文件已在类路径可用。你刚刚将 `EhCacheManager` 设置为\
  \ `SecurityManager` 的 `CacheManager`。缓存将根据指定配置文件中定义的设置进行处理。\n\n### 步骤 4.2.1.5: 组装组件\n\
  \n你的 `SecurityManager` 几乎准备就绪。你的 `SecurityManager` getter 方法将如下：\n\n```java\n@Produces\n\
  public WebSecurityManager getSecurityManager() {\n    DefaultWebSecurityManager\
  \ securityManager = null;\n    if (securityManager == null) {\n        AuthorizingRealm\
  \ realm = new SecurityRealm();\n\n        CredentialsMatcher credentialsMatcher\
  \ = new PasswordMatcher();\n        ((PasswordMatcher) credentialsMatcher).setPasswordService(new\
  \ BCryptPasswordService());\n        realm.setCredentialsMatcher(credentialsMatcher);\n\
  \n        securityManager = new DefaultWebSecurityManager(realm);\n\n        CacheManager\
  \ cacheManager = new EhCacheManager();\n        ((EhCacheManager) cacheManager).setCacheManagerConfigFile(\"\
  classpath:ehcache.xml\");\n        securityManager.setCacheManager(cacheManager);\n\
  \n        byte[] cypherKey = String.format(\"0x%s\",\nHex.encodeToString(new AesCipherService().generateNewKey().getEncoded()))\n\
  \                    .getBytes();\n\n        RememberMeManager rememberMeManager\
  \ = new CookieRememberMeManager();\n        ((CookieRememberMeManager) rememberMeManager).setCipherKey(cypherKey);\n\
  \        securityManager.setRememberMeManager(rememberMeManager);\n    }\n    return\
  \ securityManager;\n}\n```\n\nCDI 的 `@Produces` 注解标识一个“生产者”方法或字段，这意味着它将 `getSecurityManager()`\
  \ 方法识别为 CDI 上文中 `WebSecurityManager` 实例的生产者。\n\n`WebSecurityManager` 生产者已准备就绪。下一步是定义你的\
  \ `FilterChainResolver`。\n\n### 步骤 4.2.2: 编写 FilterChainResolver 生产者\n\n`FilterChainResolver`\
  \ 生产者方法提供了为应用程序中任何匹配的 URL 路径定义即时过滤器链的能力。这种方法比在 `web.xml` 中定义过滤器链的常用策略要灵活、强大且简洁得多；即使你从未使用任何其他\
  \ Shiro 功能，单凭这一点就足以证明其使用价值。`<URL path expression, filterName>` 将每个过滤器映射到其应用的 URL\
  \ 路径表达式。\n\nURL 路径表达式按照它们定义的顺序对传入的请求进行求值，第一个匹配获胜。\n\nShiro 提供了大量的预定义过滤器。\n\n| 过滤器名称\
  \ | 类 |\n| --- | --- |\n| | |\n\n本项目主要使用 `anon`、`authc` 和 `user`：\n\n- `anon` 允许立即访问路径，而无需执行安全检查。\n\
  - `authc` 要求请求用户必须经过验证才能继续请求，通过重定向到 `loginUrl` 强制用户登录。\n- `user` 如果允许访问者是已知用户，则允许访问资源，已知用户定义为拥有主体（principal）。这意味着任何通过“记住我”功能验证或记住的用户都将被允许访问。\n\
  \n***\n\n选择过滤器后，在 `FilterChainManager` 中指定你的选择。\n\n```java\nFormAuthenticationFilter\
  \ authc = new FormAuthenticationFilter();\nAnonymousFilter anon = new AnonymousFilter();\n\
  UserFilter user = new UserFilter();\n\nFilterChainManager fcMan = new DefaultFilterChainManager();\n\
  fcMan.addFilter(\"authc\", authc);\nfcMan.addFilter(\"anon\", anon);\nfcMan.addFilter(\"\
  user\", user);\n```\n\n接下来，定义过滤器所需的属性。例如，你的 `authc` 和 `user` 过滤器需要定义 `loginUrl`。\n\
  \n```java\nauthc.setLoginUrl(\"/login.html\");\nuser.setLoginUrl(\"/login.html\"\
  );\n```\n\n接下来将 URL 路径表达式与相关的过滤器名称映射。\n\n```java\nfcMan.createChain(\"/index.html\"\
  , \"anon\");\nfcMan.createChain(\"/css/**\", \"anon\");\nfcMan.createChain(\"/api/auth\"\
  , \"anon\");\nfcMan.createChain(\"/login.html\", \"authc\");\nfcMan.createChain(\"\
  /**\", \"user\");\n```\n\n将你的 `fcMan` `(FilterChainManager)` 设置为你正在产生的 `FilterChainResolver`。\n\
  \n```java\nPathMatchingFilterChainResolver resolver = new PathMatchingFilterChainResolver();\n\
  resolver.setFilterChainManager(fcMan);\nfilterChainResolver = resolver;\n\nreturn\
  \ filterChainResolver;\n```\n\n最后，这就是 `FilterChainResolver` 生产者方法。\n\n\n\n\n\n```java\n\
  @Produces\npublic FilterChainResolver getFilterChainResolver() {\n    FilterChainResolver\
  \ filterChainResolver = null;\n    if (filterChainResolver == null) {\n        FormAuthenticationFilter\
  \ authc = new FormAuthenticationFilter();\n        AnonymousFilter anon = new AnonymousFilter();\n\
  \        UserFilter user = new UserFilter();\n\n        authc.setLoginUrl(WebPages.LOGIN_URL);\n\
  \        user.setLoginUrl(WebPages.LOGIN_URL);\n\n        FilterChainManager fcMan\
  \ = new DefaultFilterChainManager();\n        fcMan.addFilter(\"authc\", authc);\n\
  \        fcMan.addFilter(\"anon\", anon);\n        fcMan.addFilter(\"user\", user);\n\
  \n        fcMan.createChain(\"/index.html\", \"anon\");\n        fcMan.createChain(\"\
  /css/**\", \"anon\");\n        fcMan.createChain(\"/api/auth\", \"anon\");\n   \
  \     fcMan.createChain(WebPages.LOGIN_URL, \"authc\");\n        fcMan.createChain(\"\
  /**\", \"user\");\n\n        PathMatchingFilterChainResolver resolver = new PathMatchingFilterChainResolver();\n\
  \        resolver.setFilterChainManager(fcMan);\n        filterChainResolver = resolver;\n\
  \    }\n    return filterChainResolver;\n}\n```\n\n* * *\n\n此时，你的 `WebSecurityManager`\
  \ 和 `FilterChainResolver` CDI 生产者已经准备就绪，你可以更新 `ShiroListener` 类了。\n\n```java\n@WebListener\n\
  public class ShiroListener extends EnvironmentLoaderListener {\n    @Inject\n  \
  \  WebSecurityManager securityManager;\n\n    @Inject\n    FilterChainResolver filterChainResolver;\n\
  \n    @Override\n    protected WebEnvironment createEnvironment(ServletContext sc)\
  \ {\n        DefaultWebEnvironment webEnvironment = (DefaultWebEnvironment) super.createEnvironment(sc);\n\
  \n        webEnvironment.setSecurityManager(securityManager);\n        webEnvironment.setFilterChainResolver(filterChainResolver);\n\
  \n        return webEnvironment;\n    }\n\n    @Override\n    public void contextInitialized(ServletContextEvent\
  \ sce) {\n        sce.getServletContext().setInitParameter(ENVIRONMENT_CLASS_PARAM,\
  \ DefaultWebEnvironment.class.getName());\n        super.contextInitialized(sce);\n\
  \    }\n}\n```\n\n如你所见，你的 `ShiroListener` 中已启用 CDI 感知。\n\n## 第 5 步：将 Shiro 操作暴露为\
  \ REST 服务\n\nJava EE 7 对 REST Web 服务、HTML5、WebSockets 等许多功能提供了强有支持。为了从客户端与我们的应用程序交互，让我们使用\
  \ JAX-RS 创建一些 RESTful Web 服务来暴露服务器操作，例如：\n\n* 登录\n* 退出\n* 列出已连接的用户\n* 获取已连接用户的信息\n\
  * 等\n\n### 5.1 节：启用 JAX-RS\n\n要启用 JAX-RS 服务，你必须定义一个 JAX-RS 应用类。在 `com.targa.dev.shirotutorial.security`\
  \ 包的根目录下创建一个名为 `JaxRsConfiguration` 的类。但为什么要放在根目录下呢？\n\n按照 BCE 模式，此类是配置（configuration）；它不是边界（boundary）、控制器（controller）或实体（entity）。由于它涉及应用程序的配置，因此属于包根。\n\
  \n```java\n@ApplicationPath(\"api\")\npublic class JaxRsConfiguration extends Application\
  \ {\n}\n```\n\nRESTful 服务的根 URL 将为 `http://[ApplicationPath]/api/**`。\n\n你希望有两个服务：用于登录、退出、列出已连接用户以及获取连接用户信息的\
  \ `Authentication` Web 服务，以及用于用户增删改查（CRUD）的 `User Management` Web 服务。\n\nWeb 服务将在\
  \ `com.targa.dev.shirotutorial.security.boundary` 中创建，因为它们是应用程序的边界，并将有助于与外部客户端交互。\n\
  \n首先创建具有以下功能的 `Authentication` Web 服务：\n\n* `login()`\n* `logout()`\n* `getSubjectInfo()`\n\
  * `getConnectedUsers()`\n\n```java\n@Path(\"auth\")\npublic class AuthenticationResource\
  \ {\n    public Response login(){}\n    public Response logout(){}\n    public Response\
  \ getSubjectInfo(){}\n    public Response getConnectedUsers(){}\n}\n```\n\n该 Web\
  \ 服务将通过 `http://[ApplicationPath]/api/auth` 访问。\n\n* * *\n\n登录时，使用以下代码：\n\n```java\n\
  try {\n    SecurityUtils.getSubject().login(new UsernamePasswordToken(username,\
  \ password, rememberMe));\n} catch (AuthenticationException e) {\n    throw new\
  \ IncorrectCredentialsException(\"Unknown user,请重试\");\n}\n```\n\n在上述代码中，`username`\
  \ 和 `password` 是字符串，`rememberMe` 是布尔值。用户通过 HTML 表单提供这些值（例如）。因此，`login()` 方法如下：\n\
  \n```java\n@POST\n@Path(\"login\")\npublic Response login(@NotNull @FormParam(\"\
  username\") String username, ①\n                      @NotNull @FormParam(\"password\"\
  ) String password, ②\n                      @NotNull @FormParam(\"rememberMe\")\
  \ boolean rememberMe,\n                      @Context HttpServletRequest request)\
  \ { ③\n\n    boolean justLogged = false;\n    if (!SecurityUtils.getSubject().isAuthenticated()\
  \ ) { ④\n        justLogged = true;\n    }\n\n    try {\n        SecurityUtils.getSubject().login(new\
  \ UsernamePasswordToken(username, password, rememberMe));\n    } catch (AuthenticationException\
  \ e) {\n        throw new IncorrectCredentialsException(\"Unknown user,请重试\");\n\
  \    }\n\n   SavedRequest savedRequest = WebUtils.getAndClearSavedRequest(request);\
  \ ⑤\n\n    if (savedRequest != null) {\n        return this.getRedirectResponse(savedRequest.getRequestUrl(),\
  \ request);\n    } else {\n        if (justLogged) {\n            return this.getRedirectResponse(WebPages.DASHBOARD_URL,\
  \ request); ⑦\n        }\n        return this.getRedirectResponse(WebPages.HOME_URL,\
  \ request); ⑥\n    }\n}\n```\n\n1. `@NotNull` 用于 bean 验证；在此定义验证是为了在尽可能早的时刻执行。\n\
  2. `@FormParam(\"paramName\")` 获取 HTTP 请求的参数。\n3. `@Context` 注入支持的资源实例。在这里，它注入了\
  \ `HttpServletRequest`。\n4. 这检查用户是否已身份验证。\n5. 从之前保存的请求获取请求 URL。如果没有保存的请求或使用了回退 URL。\n\
  6. 我们将创建一个 `WebPages` 类，其中包含实用的页面 URL，例如 `HOME_URL`（应用程序首页）、`DASHBOARD_URL`（已连接用户的欢迎页）和\
  \ `LOGIN_URL`（登录页）。\n7. 我创建了这个方法来执行重定向到指定的 URL：\n\n```java\nprivate Response getRedirectResponse(String\
  \ requestedPath, HttpServletRequest request) {\n\n    String appName = request.getContextPath();\n\
  \    String baseUrl = request.getRequestURL().toString().split(request.getRequestURI())[0]\
  \ + appName;\n\n    try {\n        if (requestedPath.split(appName).length > 1)\
  \ {\n            baseUrl += requestedPath.split(appName)[1];\n        } else {\n\
  \            baseUrl += requestedPath;\n        }\n        return Response.seeOther(new\
  \ URI(baseUrl)).build();\n    } catch (URISyntaxException ex) {\n        logger.warning(\"\
  URL redirection failed for request[\" + request + \"] : \" + ex);\n        return\
  \ Response.serverError()\n                       .status(404)\n                \
  \       .type(MediaType.TEXT_HTML)\n                       .build();\n    }\n}\n\
  ```\n\n* * *\n\n`logout()` 方法简单得多。\n\n```java\n@GET\n@Path(\"logout\")\npublic Response\
  \ logout(@Context HttpServletRequest request) {\n    SecurityUtils.getSubject().logout();\n\
  \    return this.getRedirectResponse(WebPages.HOME_URL, request);\n}\n```\n\n这是\
  \ `getSubjectInfo()`。\n\n\n\n\n\n```java\n@GET\n@Path(\"me\")\npublic Response getSubjectInfo()\
  \ {\n    Subject subject = SecurityUtils.getSubject();\n    if (subject != null\
  \ && subject.isAuthenticated()) {\n        User connectedUser = this.userService.findByUsername(subject.getPrincipal().toString());\n\
  \        return Response.ok(connectedUser).build();\n    } else {\n        return\
  \ Response.serverError()\n                       .type(MediaType.TEXT_HTML)\n  \
  \                     .build();\n    }\n}\n```\n\n`getConnectedUsers()` 的设计思想是创建一个持有所有已连接用户的集合。当用户登录时，该用户会被添加到集合中；当用户注销时，该用户会被从集合中移除。我们将利用\
  \ CDI 的一个优秀特性：CDI 事件机制。\n\n首先注入 `Event<T>` 来监听类型为 T 的触发事件。\n\n```java\n@Inject\n\
  private Event<AuthenticationEvent> monitoring;\n\n@Inject\nprivate AuthenticationEventMonitor\
  \ authenticationEventMonitor;\n```\n\n`AuthenticationEventMonitor` 类是一个用于事件生产者和监控的持有类。\n\
  \n***\n\n按照如下所示创建 `AuthenticationEvent` 事件类。\n\n```java\npublic class AuthenticationEvent\
  \ {\n    public enum Type { LOGIN, LOGOUT }\n\n    private String username;\n  \
  \  private Date creation;\n    private Type type;\n\n    public AuthenticationEvent(String\
  \ username, Type type) {\n        this.username = username;\n        this.type =\
  \ type;\n        this.creation = new Date();\n    }\n\n    ...\n\n    @Override\n\
  \    public String toString() {\n        return \"AuthenticationEvent{\" +\n   \
  \             \"username='\" + username + '\\'' +\n                \", creation=\"\
  \ + creation +\n                \", type=\" + type + '}';\n    }\n}\n```\n\n***\n\
  \n接下来，为事件生产者和管理器创建一个持有类。\n\n```java\npublic class AuthenticationEventMonitor {\n\
  \    @Inject\n    private Logger logger;\n\n    private CopyOnWriteArrayList<String>\
  \ connectedUsers;\n\n    @PostConstruct\n    public void init() {\n        this.connectedUsers\
  \ = new CopyOnWriteArrayList<>();\n    }\n\n    public void onAuthenticationEvent(@Observes\
  \ AuthenticationEvent event) {\n        if (event != null &&\n                ((event.getType()\
  \ == AuthenticationEvent.Type.LOGIN) ||\n                        (event.getType()\
  \ == AuthenticationEvent.Type.LOGOUT))) {\n            if (event.getType() == AuthenticationEvent.Type.LOGIN)\
  \ {\n                if (!connectedUsers.contains(event.getUsername())) {\n    \
  \                this.connectedUsers.add(event.getUsername());\n               \
  \ }\n            } else {\n                if (connectedUsers.contains(event.getUsername()))\
  \ {\n                    this.connectedUsers.remove(event.getUsername());\n    \
  \            }\n            }\n        } else {\n            logger.warning(\"Unrecognized\
  \ AuthenticationEvent : [\" + event + \"]\");\n        }\n    }\n\n    public boolean\
  \ isUserAlreadyConnected(String username) {\n        return this.connectedUsers.contains(username);\n\
  \    }\n\n    public List<String> getConnectedUsers() {\n        return connectedUsers;\n\
  \    }\n}\n```\n\n***\n\n`AuthenticationResource` 类如下。\n\n```java\n@Path(\"auth\"\
  )\n@Produces(MediaType.APPLICATION_JSON)\npublic class AuthenticationResource {\n\
  \    @Inject\n    private Logger logger;\n\n    @Inject\n    private UserService\
  \ userService;\n\n    @Inject\n    private Event<AuthenticationEvent> monitoring;\n\
  \n    @Inject\n    private AuthenticationEventMonitor authenticationEventMonitor;\n\
  \n    @POST\n    @Path(\"login\")\n    public Response login(@NotNull @FormParam(\"\
  username\") String username,\n                          @NotNull @FormParam(\"password\"\
  ) String password,\n                          @NotNull @FormParam(\"rememberMe\"\
  ) boolean rememberMe,\n                          @Context HttpServletRequest request)\
  \ {\n        boolean justLogged = false;\n        if (!SecurityUtils.getSubject().isAuthenticated())\
  \ {\n            justLogged = true;\n        }\n\n        try {\n            SecurityUtils.getSubject().login(new\
  \ UsernamePasswordToken(username, password, rememberMe));\n        } catch (Exception\
  \ e) {\n            throw new IncorrectCredentialsException(\"Unknown user, please\
  \ try again\");\n        }\n\n        SavedRequest savedRequest = WebUtils.getAndClearSavedRequest(request);\n\
  \        if (savedRequest != null) {\n            return this.getRedirectResponse(savedRequest.getRequestUrl(),\
  \ request);\n        } else {\n            if (justLogged) {\n                return\
  \ this.getRedirectResponse(WebPages.DASHBOARD_URL, request);\n            }\n  \
  \          return this.getRedirectResponse(WebPages.HOME_URL, request);\n      \
  \  }\n    }\n```\n\n```java\n    @GET\n    @Path(\"logout\")\n    public Response\
  \ logout(@Context HttpServletRequest request) {\n        SecurityUtils.getSubject().logout();\n\
  \        return this.getRedirectResponse(WebPages.HOME_URL, request);\n    }\n\n\
  \    @GET\n    @Path(\"me\")\n    public Response getSubjectInfo() {\n        Subject\
  \ subject = SecurityUtils.getSubject();\n        if (subject != null && subject.isAuthenticated())\
  \ {\n            User connectedUser = this.userService.findByUsername(subject.getPrincipal().toString());\n\
  \            return Response.ok(connectedUser).build();\n        } else {\n    \
  \        return Response.serverError().type(MediaType.TEXT_HTML).build();\n    \
  \    }\n    }\n\n    @GET\n    @Path(\"users\")\n    public Response getConnectedUsers()\
  \ {\n        List<String> connectedUsers = this.authenticationEventMonitor.getConnectedUsers();\n\
  \        return Response.ok(connectedUsers).build();\n    }\n\n    private Response\
  \ getRedirectResponse(String requestedPath, HttpServletRequest request) {\n    \
  \    String appName = request.getContextPath();\n        String baseUrl = request.getRequestURL().toString().split(request.getRequestURI())[0]\
  \ + appName;\n\n        try {\n            if (requestedPath.split(appName).length\
  \ > 1) {\n                baseUrl += requestedPath.split(appName)[1];\n        \
  \    } else {\n                baseUrl += requestedPath;\n            }\n      \
  \      return Response.seeOther(new URI(baseUrl)).build();\n        } catch (URISyntaxException\
  \ ex) {\n            return Response.serverError().status(404).type(MediaType.TEXT_HTML).build();\n\
  \        }\n    }\n}\n```\n\n***\n\n然后创建 `UserResource` 类。\n\n```java\n@Path(\"\
  users\")\n@Produces(MediaType.APPLICATION_JSON)\npublic class UserResource {\n \
  \   @Inject\n    private UserService userService;\n\n    @POST\n    public Response\
  \ addUser(@Valid User user, @Context UriInfo info) {\n        User saved = this.userService.save(user);\n\
  \        long id = saved.getId();\n        URI uri = info.getAbsolutePathBuilder().path(\"\
  /\" + id).build();\n        return Response.created(uri).build();\n    }\n\n   \
  \ @DELETE\n    @Path(\"{id}\")\n    public Response deleteUser(@PathParam(\"id\"\
  ) long id) {\n        this.userService.delete(id);\n        return Response.ok().build();\n\
  \    }\n\n    @PUT\n    public Response editUser(@Valid User user, @Context UriInfo\
  \ info) {\n        User searched = this.userService.save(user);\n        return\
  \ Response.ok(searched).build();\n    }\n\n    @GET\n    @Path(\"{id}\")\n    public\
  \ Response findUser(@PathParam(\"id\") long id) {\n        User searched = this.userService.findById(id);\n\
  \        return Response.ok(searched).build();\n    }\n\n    @GET\n    public Response\
  \ listUsers() {\n        List<User> all = this.userService.findAll();\n        return\
  \ Response.ok(all).build();\n    }\n}\n```\n\n***\n\nJAX-RS 层中的最后一项是 `ExceptionMapper`\
  \ 类。\n\n\n\n\n```java\n@Provider\npublic class ShiroExceptionMapper implements ExceptionMapper<Exception>\
  \ {\n\n    private static final String CAUSE = \"cause\";\n\n    @Override\n   \
  \ public Response toResponse(Exception ex) {\n        if (ex instanceof UnknownAccountException)\
  \ {\n            return Response.status(Response.Status.FORBIDDEN)\n           \
  \ .header(ShiroExceptionMapper.CAUSE, \"Your username wrong\")\n               \
  \     .type(MediaType.TEXT_HTML)\n                    .build();\n        }\n   \
  \     if (ex instanceof IncorrectCredentialsException) {\n            return Response.status(Response.Status.UNAUTHORIZED)\n\
  \                    .header(ShiroExceptionMapper.CAUSE, \"Password is incorrect\"\
  )\n                    .type(MediaType.TEXT_HTML)\n                    .build();\n\
  \        }\n        if (ex instanceof LockedAccountException) {\n            return\
  \ Response.status(Response.Status.CONFLICT)\n                    .header(ShiroExceptionMapper.CAUSE,\
  \ \"This username is locked\")\n                    .type(MediaType.TEXT_HTML)\n\
  \                    .build();\n        }\n        if (ex instanceof AuthenticationException)\
  \ {\n            return Response.status(Response.Status.BAD_REQUEST)\n         \
  \           .header(ShiroExceptionMapper.CAUSE, ex.getMessage())\n             \
  \       .type(MediaType.TEXT_HTML)\n                    .build();\n        }\n\n\
  \        return Response.serverError().\n                header(ShiroExceptionMapper.CAUSE,\
  \ ex.toString()).build();\n    }\n}\n```\n\n此时，你的 JAX-RS 服务已准备就绪，并且你所有的 Shiro 服务都已通过\
  \ RESTful 服务暴露出来。\n\n`JSESSIONID` 是由 servlet 容器（如 Tomcat 或 Jetty）生成的 cookie，用于 Java\
  \ EE HTTP Web 应用程序中的会话管理。由于 HTTP 是一个无状态协议，Web 服务器必须通过工作将来自单个客户端的各个请求关联起来。会话管理是使用\
  \ cookie 和 URL 重写等标准技术跟踪用户会话的过程。\n\n一旦创建了会话，容器就会客户端响应中发送 `JSESSIONID` cookie。在通过\
  \ HTML 访问时，不会创建用户会话。如果客户端禁用了 cookie，则容器将使用 URL 重写来管理会话，此时 `JSESSIONID` 会像这样附加到 URL\
  \ 中：`https://localhost:8080/ShiroTutorial/login.htm`;`jsessionid=9e934f9330d5081e34ce607b478a8e32dd9b0297dbb8`\n\
  \n```xml\n<session-config>\n    <session-timeout>\n        30\n    </session-timeout>\n\
  \    <tracking-mode>COOKIE</tracking-mode>\n</session-config>\n```\n\n***\n\n###\
