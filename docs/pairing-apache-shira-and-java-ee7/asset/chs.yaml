  \n对于成功登录：\n\n* 将用户名、密码和 `rememberMe` 发送到 RESTful 服务\n* 获取 \"OK\" 响应状态 (200)\n\n\
  对于失败的登录尝试：\n\n* 将用户名、密码和 `rememberMe` 发送到 RESTful 服务\n* 获取 \"Unauthorized\" 响应状态\
  \ (401)\n\n***\n\n在测试登录操作之前，我们创建一个新的 `User` 记录。有很多方法可以实现，但让我们构建一个初始化 EJB，在应用程序启动时插入新用户。\n\
  \n```java\n@Singleton\n@Startup\npublic class InsertUser {\n    @Inject\n    UserService\
  \ us;\n    @Inject\n    BCryptPasswordService passwordService;\n\n    @PostConstruct\n\
  \    public void insert() {\n        User craftsman  = new User(\"shiro\", passwordService.encryptPassword(\"\
  netbeans\"));\n        Role role = new Role();\n        role.setName(\"ADMIN\");\n\
  \        craftsman.setRole(role);\n\n        this.us.save(craftsman);\n    }\n}\n\
  ```\n\n1. `us` 用于用户实体的 CRUD 服务。\n2. `BCryptPasswordService` 用于匹配 `PasswordMatcher`\
  \ 中密码的工具类。\n3. `@PostConstruct` 在 EJB 构建后执行带注解的方法（`public void insert()`）。\n\n为了避免每次重启时都重复记录，我们可以要求\
  \ ORM 在每次应用程序启动时 **drop-and-create** 表。要实现这一点，只需在你的 `persistence.xml` 文件的属性部分添加以下行：\n\
  \n```xml\n<property name=\"javax.persistence.schema-generation.database.action\"\
  \ value=\"drop-and-create\"/>\n```\n\n测试方法将是：\n\n\n\n\n\n```java\n@Test\npublic\
