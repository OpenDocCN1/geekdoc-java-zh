  trans: "\n\n2. ② 对 [`passwordMatcher`](http://shiro.apache.org/static/current/apidocs/org/apache/shiro/authc/credential/PasswordMatcher.html)\
    \ 和 [`passwordService`](http://shiro.apache.org/static/current/apidocs/org/apache/shiro/authc/credential/PasswordService.html)\
    \ 的配置，它们是用于密码验证和匹配的组件。\n\n3. ③ 此示例中 `Datasource` 的定义是一个 JDBC `DataSource`。\n\n\
    4. ④ 此示例中 `Realm` 的配置是一个 JDBC `Realm`。\n\n5. ⑤ 这将配置好的 `Realm` 分配给 Shiro 的 `SecurityManager`。\n\
    \n6. ⑥ 这将 URL 模式分配给相应的过滤器。\n\n此 `shiro.ini` 文件必须放置在 `src/main/webapp/WEB-INF`\
    \ 或 `src/main/resources` 中。若要启用 Shiro 框架，你必须配置你的 `web.xml` 文件。\n\n```xml\n<listener>\n\
    \    <listener-class>\n        org.apache.shiro.web.env.EnvironmentLoaderListener\n\
    \    </listener-class>\n</listener>\n\n<filter>\n    <filter-name>ShiroFilter</filter-name>\n\
    \    <filter-class>org.apache.shiro.web.servlet.ShiroFilter</filter-class>\n</filter>\n\
    \n<filter-mapping>\n    <filter-name>ShiroFilter</filter-name>\n    <url-pattern>/*</url-pattern>\n\
    \    <dispatcher>REQUEST</dispatcher>\n    <dispatcher>FORWARD</dispatcher>\n\
    \    <dispatcher>INCLUDE</dispatcher>\n    <dispatcher>ERROR</dispatcher>\n</filter-mapping>\n\
    ```\n\n我听到你的抗议了！这些配置文件与 Java EE 的“约定优于配置”方法完全冲突！\n\n在每一个新的 Java EE 版本中，你都应该尽量减少配置文件。本教程的一个重点是在不使用混乱配置文件的情况下构建我们的\
    \ Shiro 框架应用程序。你可以尝试用一些创新解决方案来绕过这个问题。例如，你可以使用 Servlet 3.0 的特性来代替 `web.xml` 文件，在代码中定义过滤器：\n\
    \n- 你可以通过添加 servlet、过滤器、web 帧等方法来增加可插性。\n- 你可以通过针对 servlet、servlet 过滤器和 servlet\
    \ 上下文监听器的注解来提高开发便利性。\n\n## 第 4 步：Shiro：深入阶\n\n### 第 4.1 步：消除 web.xml 配置\n\n####\
    \ 第 4.1.1 步：从过滤器到 @WebFilter\n\n过滤器是可以转换请求或响应头部和内容（或两者）的对象。过滤器与 web 组件的区别在于，过滤器通常不会自己创建响应。相反，过滤器提供了可以附加到任何类型\
    \ web 资源的功能。因此，过滤器不应该对其作为过滤器的 web 资源有任何依赖；这样，它就可以与多种类型的 web 资源组合。\n\n过滤器可以执行的主要任务包括：\n\
    \n- 查询请求并采取相应的行动。\n- 阻止请求-响应对继续向下传递。\n- 修改请求头和数据。你通过提供请求的自定义版本来实现这一点。\n- 修改响应头和数据。你通过提供响应的自定义版本来实现这一点。\n\
    - 与外部资源交互。\n\nShiro 过滤器是实现 Shiro 框架的 web 应用程序的主要过滤器。\n\n要实现这一点，引入扩展 `org.apache.shiro.web.servlet.ShiroFilter`\
    \ 的类 `ShiroFilterActivator`，并将该过滤器应用于所有请求（\"/*\"）。\n\n```java\n@WebFilter(\"/*\"\
    )\npublic class ShiroFilterActivator extends ShiroFilter {\n    private ShiroFilterActivator()\
    \ {\n    }\n}\n```\n\n#### 第 4.1.2 步：从监听器到 @WebListener\n\n创建一个扩展 `org.apache.shiro.web.env.EnvironmentLoaderListener`\
    \ 的 `ShiroListener` 类。在 `contextInitialized()` 方法中，使用 `DefaultWebEnvironment`\
    \ 类名初始化 `ENVIRONMENT_CLASS_PARAM` (`shiroEnvironmentClass`)。它用于定义在 servlet 上文中使用的\
    \ `WebEnvironment` 实现类。\n\n```java\n@WebListener\npublic class ShiroListener extends\
    \ EnvironmentLoaderListener {\n    @Override\n    public void contextInitialized(ServletContextEvent\
    \ sce) {\n        sce.getServletContext()\n           .setInitParameter(ENVIRONMENT_CLASS_PARAM,\
    \ DefaultWebEnvironment.class.getName());\n        super.contextInitialized(sce);\n\
    \    }\n}\n```\n\n***\n\n### 第 4.2 步：消除 INI 配置文件\n\n为了消除对 INI 配置文件的使用，使用 `createEnvironment(ServletContext\
    \ sc)` 方法来定义 `WebEnvironment`。\n\n```java\n@Override\nprotected WebEnvironment\
    \ createEnvironment(ServletContext sc) {\n    DefaultWebEnvironment webEnvironment\
    \ = (DefaultWebEnvironment) super.createEnvironment(sc);\n    ...\n    return\
    \ webEnvironment;\n}\n```\n\n在 `WebEnvironment` 组件中，你必须定义两个参数：`FilterChainResolver`\
    \ 和 `SecurityManager`。但在定义 `FilterChainResolver` 之前，你必须先理解 `FilterChain` 的概念。\n\
    \n换说 Java EE 5 的 JavaDoc，servlet 容器提供了 `FilterChain` 对象，允许开发者查看针对资源的经过过滤请求的调用链。过滤器使用\
    \ `FilterChain` 来调用链中的下一个过滤器，或者如果调用的过滤器是链中的最后一个过滤器，则调用链末尾的资源。\n\nShiro 官方 JavaDoc\
    \ 定义了一些 `WebEnvironment` 组件。它指出 `FilterChainResolver` 可以解析适当的 `FilterChain`。它允许在\
    \ Servlet 请求执行期间解析任意 `FilterChain`。\n\n这种机制比普通的 `web.xml` 过滤器定义提供了更灵活的 `FilterChain`\
    \ 解析。它允许以更简洁、易读的方式为每个 URL 定义任意的过滤器链，甚至在底层实现支持的情况下在运行时动态解析或构建过滤器链。\n\n`SecurityManager`\
    \ 执行整个应用程序中所有 `Subjects`（即用户）的安全操作。该接口本身主要为了便利——它扩展了 `Authenticator`、`Authorizer`\
    \ 和 `SessionManager` 接口，从而将这些行为整合到一个引用点中。在大多数情况下，通过允许开发者与单个 `SecurityManager`\
    \ 交互而不是分别引用 `Authenticator`、`Authorizer` 和 `SessionManager` 实例，这简化了配置。\n\n显然，你需要创建这些组件：`FilterChainResolver`\
    \ 和 `SecurityManager`。\n\n***\n\n首先创建一个类来持有 ShiroConfiguration 类的配置。该类有两个公共 getter。\n\
    \n```java\npublic class ShiroConfiguration {\n    private ShiroConfiguration()\
    \ {\n    }\n\n    public WebSecurityManager getSecurityManager() {\n    }\n\n\
    \    public FilterChainResolver getFilterChainResolver() {\n    }\n}\n```\n\n\
    但这个解决方案仍然不；你想使用依赖注入来设置 `FilterChainResolver` 和 `SecurityManager` 实例。为了启用这两个配置组件的注入，通过注解两个\
    \ getter 方法来将实例绑定到你的会话。\n\n```java\npublic class ShiroConfiguration {\n    private\
    \ ShiroConfiguration() {\n    }\n\n    @Produces\n    public WebSecurityManager\
    \ getSecurityManager() {\n    }\n\n    @Produces\n    public FilterChainResolver\
    \ getFilterChainResolver() {\n    }\n}\n```\n\n***\n\n你可以创建一个更优雅的 `ShiroListener`，为两个参数都使用\
    \ `@Inject`。\n\n"
- fmt: "\n```\n@WebListener\npublic class ShiroListener extends EnvironmentLoaderListener\
    \ {\n    @Inject\n    WebSecurityManager webSecurityManager;\n    @Inject\n  \
    \  FilterChainResolver filterChainResolver;\n\n    @Override\n    protected WebEnvironment\
    \ createEnvironment(ServletContext sc) {\n        DefaultWebEnvironment webEnvironment\
    \ = (DefaultWebEnvironment) super.createEnvironment(sc);\n\n        webEnvironment.setSecurityManager(securityManager);\n\
    \        webEnvironment.setFilterChainResolver(filterChainResolver);\n\n     \
    \   return webEnvironment;\n    }\n\n    @Override\n    public void contextInitialized(ServletContextEvent\
    \ sce) {\n        sce.getServletContext()\n            .setInitParameter(ENVIRONMENT_CLASS_PARAM,\
    \ DefaultWebEnvironment.class.getName());\n        super.contextInitialized(sce);\n\
    \    }\n}\n```\n\nThe `ShiroListener` class is now ready, and it’s time to move\
    \ on to defining your `ShiroWebEnvironmentConfiguration` class.\n\n## Step 4.2.1:\
    \ Writing the SecurityManager producer\n\nThe Shiro `SecurityManager` has many\
    \ features and options for tweaking your security experience. For web-based applications,\
    \ Shiro provides a default `SecurityManager` implementation called `DefaultWebSecurityManager`,\
    \ which features many preconfigured options. This choice is especially useful\
    \ for newbies as well as for applications with minor functional requirements.\
    \ I recommend that you start with the default implementation and modify each option\
    \ as the need arises.\n\nThe following are the most important core elements of\
    \ the Apache Shiro framework:\n\n* `SessionManager`\n* `Realm`\n* `Authenticator`\n\
    * `Authorizer`\n* `CacheManager`\n* `SubjectDAO`\n* `CredentialsMatcher`\n\nBefore\
    \ we get into the code, let’s review the definitions as specificed in the official\
    \ Shiro Javadoc:\n\n* `SessionManager` manages the creation, maintenance, and\
    \ clean-up of all application sessions.\n* `Realm` is a security component that\
    \ can access application-specific security entities such as users, roles, and\
    \ permissions to determine authentication and authorization operations. A `Realm`\
    \ usually has a one-to-one correspondence with a datasource such as a relational\
    \ database, file system, or similar resource. As such, implementations of this\
    \ interface use datasource-specific APIs to determine authorization data (roles,\
    \ permissions, etc.), such as `JDBC`, `File IO`, `Hibernate` or `JPA`, or any\
    \ other data-access API. A `Realm` is essentially a security-specific DAO.\n*\
    \ `Authenticator` is responsible for authenticating accounts in an application.\
    \ It is one of the primary entry points into the Shiro API.\n* `Authorizer` performs\
    \ authorization (access control) operations for any given `Subject` (i.e. application\
    \ user). Each method requires a subject principal to perform the action for the\
    \ corresponding user.\n* `CacheManager` provides and maintains the lifecycles\
    \ of cache instances. Shiro doesn’t implement a full cache mechanism itself, since\
    \ that falls outside the core competency of a security framework. Instead, this\
    \ interface provides an abstraction (wrapper) API on top of an underlying cache\
    \ framework’s main manager component (e.g. `JCache`, `Ehcache`, `JCS`, `OSCache`,\
    \ `JBoss Cache`, `Terracotta`, `Coherence`, `GigaSpaces`, etc.), allowing Shiro\
    \ users to configure any cache mechanism they choose.\n* `SubjectDAO` is a data-access-object\
    \ design-pattern specification to enable session access to an enterprise information\
    \ system (EIS). It provides the usual CRUD methods:\n    * create (`org.apache.shiro.session.Session`)\n\
    \    * readSession (`java.io.Serializable`)\n    * update (`org.apache.shiro.session.Session`)\n\
    \    * delete (`org.apache.shiro.session.Session`)\n* `CredentialsMatcher` is\
    \ an interface implemented by classes that can determine if an `AuthenticationToken`'s\
    \ provided credentials match a corresponding account’s credentials stored in the\
    \ system.\n* `PasswordMatcher` is a `CredentialsMatcher` that employs best-practices\
    \ comparisons for hashed text passwords.\n* `RememberMeManager` is the Shiro framework’s\
    \ default concrete implementation of the `SecurityManager` interface, based around\
    \ a collection of `Realms`. This implementation delegates its authentication,\
    \ authorization, and session operations to wrapped `Authenticator`, `Authorizer`,\
    \ and `SessionManager` instances respectively via superclass implementation.\n\
    \nThe Shiro JavaDoc leaves something to be desired, but hopefully our explanations\
    \ will improve that.\n\nFor your `SecurityManager`, you will:\n\n* Use `DefaultWebSecurityManager`\
    \ as implementation.\n* Create your own customized `Realm` (we will see why later).\n\
    * Use `PasswordMatcher` with your own `PasswordService` as the `CredentialsMatcher`.\n\
    * Use `CookieRememberMeManager` as the `RememberMeManager`, because your implementation\
    \ will use cookies to remember and track users (`Subjects`). You will add a `CipherKey`\
    \ to the `RememberMeManager` to improve cookie naming.\n* And for the big surprise,\
    \ you will use a cache manager, namely `EhCacheManager`! (Shiro promises to provide\
    \ native support for caching providers such as `Hazelcast` in future releases).\n\
    \n### Step 4.2.1.1: Writing the Realm\n\nTo create the `Realm`, you must create\
    \ a class that extends the `org.apache.shiro.realm.AuthorizingRealm` abstract\
    \ class and implement the critical methods:\n\n* The `AuthenticationInfo doGetAuthenticationInfo(AuthenticationToken\
    \ token)` method is the \"getter\" of the authentication information (username\
    \ and password in our case) sitting in the storage system (DB, LDAP, etc.).\n\
    * The `AuthorizationInfo doGetAuthorizationInfo(PrincipalCollection principals)`\
    \ method is the \"getter\" of the authorization information (roles only in our\
    \ case, but can be roles and permissions or only permissions, based on the authorization\
    \ strategy selected for the project).\n\nAs this project uses Java EE features\
    \ with the Shiro framework, you will be using EJB to deal with data. So we will\
    \ use the injection (or try to) to call your EJBs. Note that context dependency\
    \ injection (CDI) is not enabled for Shiro components, the Shiro `Realm` is not\
    \ a CDI-aware component, because some final methods are inherited.\n\nStack Overflow\
    \ has some posts that shed light on the problem:\n\n* [http://stackoverflow.com/questions/15605038](http://stackoverflow.com/questions/15605038)\n\
    * [http://stackoverflow.com/questions/18507629](http://stackoverflow.com/questions/18507629)\n\
    \nBut not to worry — there are some tricks to make this work! There are at least\
