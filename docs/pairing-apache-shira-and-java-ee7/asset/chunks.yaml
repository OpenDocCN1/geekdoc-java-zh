    \  form.param(\"username\", \"shiro\");\n  form.param(\"password\", \"netbeans\"\
    );\n  form.param(\"rememberMe\", \"false\");\n\n  Response response = target.request(MediaType.APPLICATION_JSON_TYPE)\n\
    \          .post(Entity.entity(form, MediaType.APPLICATION_FORM_URLENCODED));\n\
    \n  assertEquals(response.getStatus(), Response.Status.OK.getStatusCode());\n\
    }\n\n@Test\npublic void testFailingLogin() {\n  Form form = new Form();\n  form.param(\"\
    username\", \"shiro\");\n  form.param(\"password\", \"netbeans2\");\n  form.param(\"\
    rememberMe\", \"false\");\n\n  Response response = target.request(MediaType.APPLICATION_JSON_TYPE)\n\
    \          .post(Entity.entity(form, MediaType.APPLICATION_FORM_URLENCODED));\n\
    \n  assertEquals(response.getStatus(), Response.Status.UNAUTHORIZED.getStatusCode());\n\
    }\n```\n\n* * *\n\nExecute the test.\n\n![nb11](images/nb11.png)\n\nYou will get\
    \ the following result.\n\n![nb12](images/nb12.png)\n\nYou can keep making JUnit\
    \ tests to check your RESTful services, which I recommend because you can easily\
    \ debug them. In contrast, browser plugins such as Postman can make debugging\
    \ more difficult.\n\n![postman](images/postman.png)\n\n![](images/avatars/default.jpg)\
    \ **Nebrass Lamouchi**\n\n# **PAIRING** **APACHE** **SHIRO** **WITH** **JAVA**\
    \ **EE** **7**\n\n## How to consume Shiro’s web services\n\nOur RESTful web services\
    \ can be consumed using every client that can make HTTP requests:\n\n*   HTML5\
    \ pages\n\n*   Swing applications\n\n*   mobile applications on iOS, Android,\
    \ etc.\n\n*   etc.\n\nFor example, we can make an AngularJS single-page application\
    \ (SPA) as the view layer of our JavaEE7 application:\n\n*   Make the REST calls\
    \ in the services layer.\n\n*   Manage your Auth²\uFEFF operations depending on\
    \ the HTTP response codes.\n\n*   For the authorization, you can use AngularJS\
    \ authorization plugins (angular-route-authorisation, angular-http-auth, angular-permission,\
    \ etc.)\n\nYou may have to tweak your code to make it coherent with your authorization\
    \ mechanism.\n\n## What can you add to the implementation?\n\nOur implementation\
    \ of Apache Shiro framework is basic. We did not try concepts such as LDAP, ActiveDirectory,\
    \ CAS SSO, OAuth, or others.\n\nThe community offers many integrations:\n\n* \
    \  Pairing [Stormpath User Management](http://www.stormpath.com/blog/user-management-java-web-apps-stormpath-and-apache-shiro)\uFEFF\
    \ with Shiro provides a full application-security and user-management system with\
    \ little to no coding.\n\n*   [Grails](http://grails.org/plugins/shiro)\uFEFF\
    \ offers up-to-date Grails/Shiro integration, including Grails 2.0 and Shiro 1.2\\\
    . The plugin adds easy authentication and access control to Grails applications.\n\
    \n*   [OAuth](https://github.com/FeedTheCoffers/shiro-oauth)\uFEFF provides source\
    \ code for an OAuth module for Apache Shiro, based on Scribe.\n\n*   A [Google\
    \ App Engine](https://github.com/cilogi/gaeshiro)\uFEFF plugin demonstrates one\
    \ way to integrate Shiro with Google App Engine and Google Guice, and comes with\
    \ front-end user registration and password management.\n\n*   [Play Shiro Integration](https://github.com/wsargent/play-shiro)\uFEFF\
    \ simply integrates Apache Shiro and Play 2.0\\. If you want to play with it,\
    \ this project could use an update handling statelessness since the Shiro 1.2\
    \ release.\n\n*   [The 55 Minutes Wicket project](https://github.com/55minutes/fiftyfive-wicket)\uFEFF\
    \ is a nifty set of tools and libraries for enhancing productivity with the Apache\
    \ Wicket Java web framework, including Shiro integration.\n\n*   [Lift Shiro](https://github.com/timperrett/lift-shiro)\uFEFF\
    \ integrates Shiro and the Lift Web framework, using Lift’s sitemap locs instead\
    \ of Shiro’s built-in web.xml resource filters to control access to URLs.\n\n\
    ## Recommendations\n\n1.  Handle every HTTP error code (404, 400, 500, etc.) and\
    \ try to have an explicit error message in the HTTP headers of every response.\n\
    \n2.  Ensure that your design covers the maximum use cases and be sure that all\
    \ resources that get anonymous access are neither vulnerable nor sensitive.\n\n\
    3.  Activate and configure SSL when possible.\n\n4.  Avoid transmitting the **JSESSIONID**\uFEFF\
    \ parameter over plain old HTTP.\n\n5.  Avoid using URL parameters for session\
    \ tracking.\n\n6.  Be sure to define a session-timeout value that is rational\
    \ for your needs.\n\n7.  Try to build your knowledge of Auth²\uFEFF mechanisms\
    \ and strategies. Take a look at [OWASP](http://www.owasp.org)\uFEFF's useful\
    \ resources:\n\n    1.  [OWASP Authentication Cheat Sheet](https://www.owasp.org/index.php/Authentication_Cheat_Sheet)\uFEFF\
    \n\n    2.  [OWASP Guide to Authorization](https://www.owasp.org/index.php/Guide_to_Authorization)\uFEFF\
    \n\n    3.  [OWASP REST Security Cheat Sheet](https://www.owasp.org/index.php/REST_Security_Cheat_Sheet)\uFEFF\
    \n\n    4.  [OWASP Session Management Cheat Sheet](https://www.owasp.org/index.php/Session_Management_Cheat_Sheet)\uFEFF\
    \n\n8.  Penetration-test your web application to be sure that your security mechanisms\
    \ are powerful. You can use the [OWASP Pentesting Guide](https://www.owasp.org/index.php/Web_Application_Penetration_Testing)\uFEFF\
    .\n\n![](images/avatars/default.jpg) **Nebrass Lamouchi**\n\n# **PAIRING** **APACHE**\
    \ **SHIRO** **WITH** **JAVA** **EE** **7**\n\n## Additional reading\n\nI suggest\
    \ that you start diving into the official documentation of the Shiro framework.\
    \ It’s true that its documentation is poor in comparison to other frameworks such\
    \ as Spring Security or PicketLink, which have more resources and more support:\n\
    \n*   [https://shiro.apache.org/static/latest/apidocs/](https://shiro.apache.org/static/latest/apidocs/)\uFEFF\
    \n\n*   [http://shiro.apache.org/tutorial.html](http://shiro.apache.org/tutorial.html)\uFEFF\
    \n\nThere are some useful tutorials, including older Shiro stuff, like for INI\
    \ and XML configuration:\n\n*   [http://meri-stuff.blogspot.fr/2011/03/apache-shiro-part-1-basics.html](http://meri-stuff.blogspot.fr/2011/03/apache-shiro-part-1-basics.html)\uFEFF\
    \n\n*   [http://en.kodcu.com/2013/10/java-security-framework-apache-shiro-2/](http://en.kodcu.com/2013/10/java-security-framework-apache-shiro-2/)\uFEFF\
    \n\n*   [http://www.jjoe64.com/2014/01/apache-shiro-with-hibernatesql-full.html](http://www.jjoe64.com/2014/01/apache-shiro-with-hibernatesql-full.html)\uFEFF\
    \n\n*   [http://balusc.omnifaces.org/2013/01/apache-shiro-is-it-ready-for-java-ee-6.html](http://balusc.omnifaces.org/2013/01/apache-shiro-is-it-ready-for-java-ee-6.html)\uFEFF\
    \n\nYou can learn tips and tricks from these tutorials, and you can adopt these\
