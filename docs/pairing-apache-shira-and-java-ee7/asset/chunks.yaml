    每一位合格的 Java EE 开发者都知道，平台中必须具备安全 API，无论是原生提供的，还是由第三方框架提供的。但自 1999 年 12 月 12 日 Java
    EE 诞生以来，Java EE 一直缺乏一个完整且专用的安全规范。`JSR-375` 的创建是为了为 Java EE 安全提供一个完整的规范，它涵盖了所有需求，但将会在
    Java EE 8 版本中可用，预计于 2017 年发布。


    安全特性中最受期待的之一是认证和授权。在本文中，我将认证和授权称为“Auth²”。尽管尝试过通过 `JAAS` (2001-2003) 和 `JASPIC`
    (2009) 让 Java EE 的开发人员实现某些“标准化”的 Auth²，但平台尚未为这些功能提供实用的解决方案。


    如往常一样，当社区需要一个平台不幸未提供的功能时，第三方会尝试满足这一需求。Java EE 中 Auth² 最流行的明星项目是 `Spring Security`、JBoss
    的 `PicketLink` 以及 `Apache Shiro`。


    许多开发者选择实现自己的 Auth² 机制，而不是花时间去理解和实现这些古异的第三方解决方案。我之所以用“古异”，是因为每个第三方解决方案都与其创建者紧密绑定（例如
    `Spring Security` 和 `JBoss PicketLink`），或者文档记录不全且模糊（`Apache Shiro` 就属于这种情况）。


    ## 个人案例


    我决定分享我使用 Auth² 框架的个人经验。我正尝试为 Java EE 7 构建一个我自己的、最新的安全框架。在 `JSR-375` 参考实现发布之前，我的实现将非常有用。我将尝试解释所做的每一个选择，并希望这对你有所帮助。


    我尝试过许多 API，但每一个都让我感到失望。要么是方案难以实现（使用 `EJB` 实现 `Spring Security`、使用 `JAAS` 和 `JASPIC`
    并不理想），要么是方案特定于供应商（`PicketLink` 只能在 JBoss 服务器上使用），或者是 API 文档不全（`Apache Shiro`）。


    我在 2012 年 12 月发现了 `Apache Shiro`。在那时它并不流行。它用起来很困难，且受困于糟糕的文档和参考。我曾尝试使用它，但最终放弃了。


    ## 专业经验


    自从开始我的 Java 开发者生涯以来，每一位客户都要求我帮助实现他们自己的 Auth² 解决方案，只有一个客户要求我在他的 Web 应用中实现 `Spring
    Security`。每当我处理安全层的工作时，我都会问自己：“为什么我又要做一遍这个？为什么没有高效的解决方案？可用性在哪里？我为什么要重复自己？”


    上一次实现 Auth² 机制时，我使用了旧的 Java EE 6 技术：`JSP` 2.5、`Servlets` 3.0、`JMS` 1.1、`EJB` 3.1
    和 `JPA` 2.0。使用 Java EE API 实现开放应用安全项目（OWASP）规范是一次奇妙的体验。


    ## 编写本教程的动力


    在完成上项目后，我决定重新审视 `Apache Shiro`，那个三年前我无法使用的神秘框架。


    奇怪的是，我发现 Shiro 网站页面多年来没有发生变化。没有新的板块，没有新的教程，也没有新的文档。显然，我在 YouTube、Vimeo 和 Dailymotion
    上寻找 Shiro 的视频教程，但无果。我寻找了任何相关的书籍或文章，也没有显著结果。这对于一个 Apache 项目来说非常奇怪。通常情况下，任何 Apache
    项目都能得到良好的覆盖。但 Shiro 并非如此。


    我尝试在一个示例项目中使用 Shiro，以下是我的初步反馈：


    * 它支持使用 `INI` 文件，这与 `Spring Security` 使用 `XML` 文件进行配置的风格不同。

    * 官方文档和资源不足。例如，网站上的官方教程只关注 `Stormpath`。

    * 最新版本 Shiro 的 `JavaDoc` 网站几乎无法访问（我已向 Apache Shiro Twitter 账号报告了此）。


    我决定编写本教程来填补这一空白。


    ![](img/default.jpg) **Nebrass Lamouchi**


    # 将 APACHE SHIRO 与 JAVA EE 7 结合


    ## 什么是 Shiro？


    `Apache Shiro` 是一个开源软件安全框架，负责认证、授权、加密和会话管理。它最初被称为 `JSecurity`，Shiro 的设计旨在提供直观且易于实现的健壮安全功能。


    书中详细介绍的教程针对寻求用于现代技术栈的 Auth² 框架的 Java 开发者。


    该项目在 2008 年推向 Apache 社区时获得了它的名字（“shiro”在日语中是“城堡”的意思）。“城堡”的任务旨在提供一个能够满足任何 Java
    项目全方位安全考虑的标准框架。


    ## 城堡计划


    `Apache Shiro` 涵盖了应用安全的四个核心关注：


    * 认证（Authentication），有时被称为“登录”，是证明用户是其所称身份的行为。

    * 授权（Authorization）访问控制的过程，即确定谁有权访问什么。

    * 会话管理（Session management）管理用户特定的会话，即使在非 Web 或 Enterprise JavaBeans (`EJB`) 应用中也是。

    * 加密（Cryptography）使用加密算法保持数据安全，同时保持易用性。


    ![ShiroFeatures](img/ShiroFeatures.png)


    支持的环境包括：


    * Web 支持——Shiro 的 Web 支持 API 有助于保护 Web 应用。

    * 缓存（Caching）——缓存是 Apache Shiro 的特性，确保安全操作保持快速。

    * 并发（Concurrency）——Shiro 的并发功能设计用于支持多线程应用。

    * 测试（Testing）——测试支持简化了单元测试和集成测试的创建，并确保你的代码是安全的。

    * “以身份运行”（Run As）——Shiro 允许用户假设另一个身份（如果有权限），这在管理场景中非常有用。

    * “记住我”（Remember Me）——Shiro 跨会话记住用户的身份，他们只需在需要时登录。


    ## 为什么不用 JAAS 或 Spring Security？


    现有的 Java 安全机制（如 `JAAS`）令人困惑，并在应用层安全方面不足。某些方案（例如 `PicketLink`）依赖服务器。其他方案（如 `Spring
    Security`）需要繁琐的 `XML` 配置。


    `Apache Shiro` 旨在通过提供一个用户友好、标准化的 API 来在项目中解决这些挑战。


    ![](img/default.jpg) **Nebrass Lamouchi**


    # 将 APACHE SHIRO 与 JAVA EE 7 结合


    ![logo shiro](img/logo-shiro.png)


    ## 技术栈


    本教程使用了：


    * `Apache Shiro` 1.2.4

    * Java EE 7 后端，带有 `JPA` 2.1、`EJB` 3.2 和 `JAX-RS` 2.0

    * `Payara Server`

    * `NetBeans` 8.1 IDE


