    \ = $passwordMatcher\njdbcRealm.dataSource=$ds\n\nsecurityManager.realms = $jdbcRealm\
    \ ⑤\n\n[urls] ⑥\n# The /login.jsp is not restricted to authenticated users (otherwise\
    \ no one could log in!), but\n# the 'authc' filter must still be specified for\
    \ it so it can process that url's\n# login submissions. It is 'smart' enough to\
