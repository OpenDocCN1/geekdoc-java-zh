    /login.jsp = authc\n/home.jsp = anon, authc\n/logout = logout\n/account/** = authc\n\
    ```\n\n1. ① Configuration for the [**authc**\uFEFF authentication filter](http://shiro.apache.org/static/current/apidocs/org/apache/shiro/web/filter/authc/FormAuthenticationFilter.html)\uFEFF\
