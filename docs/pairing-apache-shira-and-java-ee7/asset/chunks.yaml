    You can extend the \"roles and rights\" strategy (for permission-based authorization)\
    \ by adding a **Permission**\uFEFF entity that contains the rights attributed\
    \ for the associated **Role**\uFEFF — for example, \"Read only\" or \"Control\"\
    . The resulting class diagram is:\n\n**Class diagram of **Role**\uFEFF and **Permission**\uFEFF\
    \ entities.** ![bce role permission](images/bce-role-permission.png)\n\n```\n\
    @Entity ①\n@NamedQueries({ ②\n    @NamedQuery(name = \"User.findAll\", query =\
    \ \"select u from User u\"),\n    @NamedQuery(name = \"User.findByUsername\",\
    \ query = \"SELECT u FROM User u WHERE u.username = :username\") ③\n})\npublic\
    \ class User {\n    private static final long serialVersionUID = 1L;\n    @Id\
    \ ④\n    @GeneratedValue ⑤\n    @Column(name = \"id\", nullable = false, updatable\
    \ = false) ⑥\n    private long id;\n    @NotNull ⑦\n    @Column(name = \"username\"\
    , length = 50, nullable = false)\n    private String username;\n    @NotNull\n\
    \    @Column(name = \"password\", nullable = false)\n    private String password;\n\
    \    @OneToOne(cascade = CascadeType.PERSIST) ⑧\n    private Role role;\n    @Column(name\
    \ = \"enabled\", nullable = false)\n    private Boolean enabled;\n    @Version\
    \ ⑨\n    @Column(name = \"version\", nullable = false)\n    private Timestamp\
    \ version; ⑩\n\n//Getters & setters\n}\n```\n\nListing 1\\. **User**\uFEFF:\n\n\
    1.  *①* Declares the annotated class as a JPA entity.\n\n2.  *②* Declares a list\
    \ of **NamedQuery**\uFEFF elements.\n\n3.  *③* The minimal **NamedQuery**\uFEFF\
    \ declaration = query name + JPQL query.\n\n4.  *④* Defines the attribute as the\
    \ entity’s **id**\uFEFF field.\n\n5.  *⑤* Used on the entity’s **id**\uFEFF field\
    \ to specify the **id**\uFEFF generation strategy.\n\n6.  *⑥* Specifies the definition\
    \ of the corresponding table’s column.\n\n7.  *⑦* Defines a validation contraint\
    \ for the corresponding field value → username is not null.\n\n8.  *⑧* Defines\
    \ the relation between the entities.\n\n9.  *⑨* Specifies the version field of\
    \ an entity class that serves as its optimistic lock value. The version is used\
    \ to ensure integrity when performing the merge operation and for optimistic concurrency\
    \ control.\n\n10.  *⑩* The **Timestamp**\uFEFF is the version property type.\n\
    \n```\n@Entity\n@NamedQueries({\n    @NamedQuery(name = \"Role.findAll\", query\
    \ = \"SELECT r FROM Role r\")\n})\npublic class Role {\n    private static final\
    \ long serialVersionUID = 1L;\n    @Id\n    @GeneratedValue\n    @Column(name\
    \ = \"id\", nullable = false, updatable = false)\n    private long id;\n    @NotNull\n\
    \    @Column(name = \"name\", length = 50, nullable = false)\n    private String\
    \ name;\n    @NotNull\n    @Past ①\n    @Column(name = \"creation\", nullable\
    \ = false, updatable = false)\n    @Temporal(TemporalType.TIMESTAMP) ②\n    private\
    \ Date creation;\n    @Column(name = \"enabled\", nullable = false)\n    private\
    \ Boolean enabled;\n\n//Getters & setters\n}\n```\n\nListing 2\\. **Role**\uFEFF\
    :\n\n1.  *①* Creation date must occur in the past.\n\n2.  *②* Indicates this is\
    \ a date or time column.\n\nNext, create a service for every entity. Your services\
    \ will be created in the **com.targa.dev.shirotutorial.security.control**\uFEFF\
    \ package. The **EntityManager**\uFEFF is an object that packages the CRUD operations\
    \ needed to handle the entity:\n\n*   Save/Edit\n\n*   Delete\n\n*   Find\n\n\
    ```\n@Stateless\npublic class UserService {\n    @PersistenceContext\n    EntityManager\
    \ em;\n\n    public User save(User entity) {\n        return this.em.merge(entity);\n\
    \    }\n\n    public void delete(long id) {\n        try {\n            User reference\
    \ = this.em.getReference(User.class, id);\n            this.em.remove(reference);\n\
    \        } catch (EntityNotFoundException e) {\n            //It doesn't exist\
    \ already\n        }\n    }\n\n    public User findById(long id) {\n        return\
    \ this.em.find(User.class, id);\n    }\n\n    public List<User> findAll() {\n\
    \        return this.em.createNamedQuery(\"User.findAll\", User.class)\n     \
    \           .getResultList();\n    }\n}\n```\n\nListing 3\\. **UserService**\uFEFF\
    :\n\n```\n@Stateless\npublic class RoleService {\n    @PersistenceContext\n  \
    \  EntityManager em;\n\n    public Role save(Role entity) {\n        return this.em.merge(entity);\n\
    \    }\n\n    public void delete(long id) {\n        try {\n            Role reference\
    \ = this.em.getReference(Role.class, id);\n            this.em.remove(reference);\n\
    \        } catch (EntityNotFoundException e) {\n            // It doesn't exist\
    \ already\n        }\n    }\n\n    public Role findById(long id) {\n        return\
    \ this.em.find(Role.class, id);\n    }\n\n    public List<Role> findAll() {\n\
    \        return this.em.createNamedQuery(\"Role.findAll\", Role.class)\n     \
    \           .getResultList();\n    }\n}\n```\n\nListing 4\\. **RoleService**\uFEFF\
    :\n\nYour services are now ready to use. For simpler and more flexible context\
    \ dependency injection (CDI), create a beans.xml file, and change the **bean-discovery-mode**\uFEFF\
    \ from **annotated**\uFEFF to **all**\uFEFF.\n\n```\n<?xml version=\"1.0\" encoding=\"\
    UTF-8\"?>\n<beans xmlns=\"http://xmlns.jcp.org/xml/ns/javaee\"\n    xmlns:xsi=\"\
    http://www.w3.org/2001/XMLSchema-instance\"\n    xsi:schemaLocation=\"http://xmlns.jcp.org/xml/ns/javaee\n\
    \                      http://xmlns.jcp.org/xml/ns/javaee/beans_1_1.xsd\"\n  \
    \  bean-discovery-mode=\"all\">\n\n</beans>\n```\n\nThis recommended step lets\
    \ you inject **all**\uFEFF the components, not only the **annotated**\uFEFF object.\n\
    \n## Step 3: Apache Shiro prime view\n\nFirst, add the Apache Shiro dependency\
    \ to your project pom:\n\n```\n<dependency>\n    <groupId>org.apache.shiro</groupId>\n\
    \    <artifactId>shiro-web</artifactId>\n    <version>1.2.4</version>\n</dependency>\n\
    ```\n\nApache Shiro uses an INI configuration file to define parameters. Here\
