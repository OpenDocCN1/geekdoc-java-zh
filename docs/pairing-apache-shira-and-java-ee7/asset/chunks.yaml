  trans: "\n\n# Java 平台企业版 (Java EE)\n\nJava 是社区驱动型企业软件的标准。Java EE 通过 Java 社区进程（Java\
    \ Community Process）不断扩展，其贡献来自行业专家、商业和开源组织、Java 用户组以及无数个人。每个版本的发布都整合了符合行业需求的新功能，提高了开发效率并增强了应用程序的可移植性。\n\
    \nJava EE 的最新版本是 Java EE 7，于 2013 年 6 月发布。Java EE 7 平台对 Web 标准的最新发展提供了原生支持，包括\
    \ `WebSockets` 和 `JSON`，它们为 Java EE 支持 HTML 5 提供了基础。Java EE 7 还增加了由 `JAX-RS 2.0`\
    \ 定义的现代 HTTP 客户端 API。\n\nJava EE 7 规范包括：\n\n* [WebSocket Java API — JSR-356](https://www.jcp.org/en/jsr/detail?id=356)\n\
    * [JSON 处理 Java API — JSR-353](https://www.jcp.org/en/jsr/detail?id=353)\n* [Java\
    \ 平台批处理应用 — JSR-352](https://www.jcp.org/ja/jsr/detail?id=352)\n* [Java EE 并发实用程序\
    \ — JSR-236](https://www.jcp.org/ja/jsr/detail?id=236)\n* [RESTful Web Services\
    \ Java API — JSR-311](https://www.jcp.org/en/jsr/detail?id=311)\n* [Java Message\
    \ Service 2.0 — JSR-343](https://www.jcp.org/en/jsr/detail?id=343)\n* [表达式语言 3.0\
    \ — JSR-341](https://www.jcp.org/en/jsr/detail?id=341)\n* [Enterprise JavaBeans\
    \ 3.2 — JSR-345](https://www.jcp.org/en/jsr/detail?id=345)\n* [Java 持化 2.1 — JSR-338](https://www.jcp.org/en/jsr/detail?id=338)\n\
    * [JavaServer Faces 2.2 — JSR-344](https://www.jcp.org/en/jsr/detail?id=344)\n\
    \n你可以在 [JSR-342](https://jcp.org/en/jsr/detail?id=342) 汇总页面找到关于 Java EE 7 规范的所有必要信息。\n\
    \nJava EE 7 规范。![javaee7](img/javaee7.jpg)\n\n## Payara Server\n\nPayara Server\
    \ 是 `GlassFish` 服务器的无缝替代品，并保证季度发布。Payara 团队为上游 `GlassFish` 服务器及其依赖库提供增强、错误修复和补丁。这使得\
    \ Payara Server 成为 Java EE 生态系统中中最适用于生产的应用程序服务器之一。Payara 团队还提供行业内顶级中间件工程师提供的 24/7\
    \ 专用事故处理和软件支持。该团队欢迎贡献，并公开报告其在编写功能或修复错误方面的进展。此外，还有一个响应敏捷的社区对任何请求做出快速反应。Payara Server\
    \ 在微调 `GlassFish` 的同时，保留了它的易用性和优美的管理功能。\n\n你可以从[项目网站](http://www.payara.fish/downloads)\
    \ 获取 Payara Server 的最新版本。\n\n![payara logo](img/payara-logo.jpg)\n\n## NetBeans\
    \ IDE\n\nNetBeans IDE 是 Oracle 提供的免费 Java IDE，旨在无需配置或插件即可减少编码错误并优化生产力。NetBeans\
    \ 可以与你所有的环境组件（如数据库、自动化服务器、应用程序服务器、质量工具等）进行交互，而无需花费大量时间准备环境。\n\nNetBeans IDE 具有出色的调试器功能，可以优化重构和调试过程。它包含一个强大的文本编辑器，带有重构工具、代码补全、代码片段和分析器，甚至还有多语言拼写检查器。NetBeans\
    \ 还通过开箱即 `Git`、`SVN`、`CVS` 和 `Mercurial` 等工具提供了强大的多系统版本控制。除了 Java 和 `JavaFX` 之外，NetBeans\
    \ IDE 还支持 `C/C++`、`PHP` 和 `HTML5/JavaScript`。NetBeans IDE 适用于所有支持兼容 `JVM` 的操作系统。\n\
    \nNetBeans 在美国、法国、英国、荷兰、巴西等国家和全球范围内举办许多免费会议和活动。参加这些活动不仅让你学到 NetBeans 的技能，还能学到通用编程。\n\
    \n你可以在 [NetBeans 网站](https://netbeans.org/downloads/index.html) 下载最新版本的 NetBeans\
    \ IDE。\n\n![netbeans logo](img/netbeans-logo.png)\n\n![](img/default.jpg) Nebrass\
    \ Lamouchi\n\n# 将 APACHE SHIRO 与 JAVA EE 7 配对\n\n本书剩余部分是一个分步骤演示的教程，旨在让你能够轻松跟随。\n\
    \n首先，安装教程工具集以便你可以根据截图进行操作：\n\n* [JDK 8](http://www.oracle.com/technetwork/java/javase/downloads/jdk8-downloads-2133151.html)\n\
    * [Maven 3](https://maven.apache.org/download.cgi)\n* 关系型数据库，如 [MySQL](https://www.mysql.com/)\n\
    * [PostgreSQL](https://www.postgresql.org/)（推荐）\n* [Payara Server](https://www.payara.fish/)（推荐）\n\
    * [WildFly](https://www.wildfly.org/)（推荐）\n* [NetBeans](https://netbeans.org/)（推荐）\n\
    \n##  1 ：项目\n\n###  1.1 ：创建项目\n\n通过创建一个新的 Web 应用开始教程。\n\n![nb1](img/nb1.png)\n\
    \n接下来，完成名称（Name）。\n\n![nb2](img/nb2.png)\n\n然后，填写服务器设置。\n\n![nb3](img/nb3.png)\n\
    \n创建项目后，进入 `pom.xml` 并对其进行编辑。\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"\
    ?>\n<project xmlns=\"http://maven.apache.org/POM/4.0.0\" \n         xmlns:xsi=\"\
    http://www.w3.org/2001/XMLSchema-instance\"\n         xsi:schemaLocation=\"http://maven.apache.org/POM/4.0.0\
    \ http://maven.apache.org/xsd/maven-4.0.0.xsd\">\n    <modelVersion>4.0.0</modelVersion>\n\
    \n    <groupId>targa.dev</groupId>\n    <artifactId>ShiroTutorial</artifactId>\n\
    \    <version>1.0-SNAPSHOT</version>\n    <packaging>war</packaging>\n\n    <name>ShiroTutorial</name>\n\
    \n    <properties>\n        <maven.compiler.source>1.8</maven.compiler.source>\n\
    \        <maven.compiler.target>1.8</maven.compiler.target>\n        <failOnMissingWebXml>false</failOnMissingWebXml>\n\
    \    </properties>\n\n    <dependencies>\n        <dependency>\n            <groupId>javax</groupId>\n\
    \            <artifactId>javaee-api</artifactId>\n            <version>7.0</version>\n\
    \            <scope>provided</scope>\n        </dependency>\n    </dependencies>\n\
    \n    <build>\n        <finalName>ShiroTutorial</finalName>\n    </build>\n</project>\n\
    ```\n\n### 1.2 ：设计示例应用程序\n\n#### 1.2.1 ：BCE/ECB 模式\n\n我们将使用实体-控制-边界（ECB）模式，这是模型-视图-控制器（MVC）模式的一种变体。在识别系统内执行序列的元素时，你可以将每个参与元素分类为三类之一：实体、控制或边界。\n\
    \n实体是长寿的被动元素，负责某些有意义的信息。这并不是说实体是“数据”而其他设计元素是“功能”，而是实体执行的行为是围绕某些数据集组织的。\n\n控制元素管理场景内部的交互流。控制元素可以管理整个场景的端到端行为，也可以管理部分元素之间的交互。你应该将与场景相关的涉及信息的行为和业务规则分类为实体；控制元素只负责场景的流程。\n\
    \n边界元素位于系统或子系统的边缘内部。对于跨整个系统或在某个子系统内部考虑的任何场景，某些边界元素是接受设计区域外部输入的前端元素，其他元素则是后端，负责与系统或子系统外部的支持元素通信。\n\
    \n边界-控制-实体模式。![bce structure](img/bce-structure.png)\n\n"
- fmt: "\n### Step 1.2.2: BCE implementation\n\nCreate some empty Java packages just\
    \ to highlight the BCE-pattern implementation in your application. The packages\
    \ will take this format:\n\n**BCE-pattern package structure.** ![bce package structure](images/bce-package-structure.png)\n\
    \nLet’s call the functional layer for the authentication and authorization needs\
    \ \"security\". This is the output:\n\n![nb4](images/nb4.png)\n\n![nb5](images/nb5.png)\n\
    \nNow start making your entities.\n\n## Step 2: JPA entities\n\nUse `JPA` 2.1\
    \ for your persistent entities. Create two entities in the `com.targa.dev.shirotutorial.security.entity`\
    \ package.\n\nFor our Auth² implementation, we will have two entities:\n\n`User`,\
    \ which refers to the client of the application, and `Role`, which refers to the\
    \ authorization level of the user.\n\n**Class diagram of `User` and `Role` entities.**\
    \ ![bce user role](images/bce-user-role.png)\n\nYou can extend the \"roles and\
    \ rights\" strategy (for permission-based authorization) by adding a `Permission`\
    \ entity that contains the rights attributed for the associated `Role` — for example,\
    \ \"Read only\" or \"Control\". The resulting class diagram is:\n\n**Class diagram\
    \ of `Role` and `Permission` entities.** ![bce role permission](images/bce-role-permission.png)\n\
    \n```\n@Entity ①\n@NamedQueries({ ②\n    @NamedQuery(name = \"User.findAll\",\
    \ query = \"select u from User u\"),\n    @NamedQuery(name = \"User.findByUsername\"\
    , query = \"SELECT u FROM User u WHERE u.username = :username\") ③\n})\npublic\
    \ class User {\n    private static final long serialVersionUID = 1L;\n    @Id\
    \ ④\n    @GeneratedValue ⑤\n    @Column(name = \"id\", nullable = false, updatable\
    \ = false) ⑥\n    private long id;\n    @NotNull ⑦\n    @Column(name = \"username\"\
    , length = 50, nullable = false)\n    private String username;\n    @NotNull\n\
    \    @Column(name = \"password\", nullable = false)\n    private String password;\n\
    \    @OneToOne(cascade = CascadeType.PERSIST) ⑧\n    private Role role;\n    @Column(name\
    \ = \"enabled\", nullable = false)\n    private Boolean enabled;\n    @Version\
    \ ⑨\n    @Column(name = \"version\", nullable = false)\n    private Timestamp\
    \ version; ⑩\n\n//Getters & setters\n}\n```\n\nListing 1. User:\n\n1. ① Declares\
    \ the annotated class as a JPA entity.\n2. ② Declares a list of `NamedQuery` elements.\n\
    3. ③ The minimal `NamedQuery` declaration = query name + JPQL query.\n4. ④ Defines\
    \ the attribute as the entity’s `id` field.\n5. ⑤ Used on the entity’s `id` field\
    \ to specify the `id` generation strategy.\n6. ⑥ Specifies the definition of the\
    \ corresponding table’s column.\n7. ⑦ Defines a validation contraint for the corresponding\
    \ field value → username is not null.\n8. ⑧ Defines the relation between the entities.\n\
    9. ⑨ Specifies the version field of an entity class that serves as its optimistic\
    \ lock value. The version is used to ensure integrity when performing the merge\
    \ operation and for optimistic concurrency control.\n10. ⑩ The `Timestamp` is\
    \ the version property type.\n\n```\n@Entity\n@NamedQueries({\n    @NamedQuery(name\
    \ = \"Role.findAll\", query = \"SELECT r FROM Role r\")\n})\npublic class Role\
    \ {\n    private static final long serialVersionUID = 1L;\n    @Id\n    @GeneratedValue\n\
    \    @Column(name = \"id\", nullable = false, updatable = false)\n    private\
    \ long id;\n    @NotNull\n    @Column(name = \"name\", length = 50, nullable =\
    \ false)\n    private String name;\n    @NotNull\n    @Past ①\n    @Column(name\
    \ = \"creation\", nullable = false, updatable = false)\n    @Temporal(TemporalType.TIMESTAMP)\
    \ ②\n    private Date creation;\n    @Column(name = \"enabled\", nullable = false)\n\
    \    private Boolean enabled;\n\n//Getters & setters\n}\n```\n\nListing 2. Role:\n\
    \n1. ① Creation date must occur in the past.\n2. ② Indicates this is a date or\
    \ time column.\n\nNext, create a service for every entity. Your services will\
    \ be created in the `com.targa.dev.shirotutorial.security.control` package. The\
    \ `EntityManager` is an object that packages the CRUD operations needed to handle\
    \ the entity:\n\n* Save/Edit\n* Delete\n* Find\n\n```\n@Stateless\npublic class\
    \ UserService {\n    @PersistenceContext\n    EntityManager em;\n\n    public\
    \ User save(User entity) {\n        return this.em.merge(entity);\n    }\n\n \
    \   public void delete(long id) {\n        try {\n            User reference =\
    \ this.em.getReference(User.class, id);\n            this.em.remove(reference);\n\
    \        } catch (EntityNotFoundException e) {\n            //It doesn't exist\
    \ already\n        }\n    }\n\n    public User findById(long id) {\n        return\
    \ this.em.find(User.class, id);\n    }\n\n    public List<User> findAll() {\n\
    \        return this.em.createNamedQuery(\"User.findAll\", User.class)\n     \
    \           .getResultList();\n    }\n}\n```\nListing 3. UserService:\n\n```java\n\
    @Stateless\npublic class RoleService {\n    @PersistenceContext\n    EntityManager\
    \ em;\n\n    public Role save(Role entity) {\n        return this.em.merge(entity);\n\
    \    }\n\n    public void delete(long id) {\n        try {\n            Role reference\
    \ = this.em.getReference(Role.class, id);\n            this.em.remove(reference);\n\
    \        } catch (EntityNotFoundException e) {\n            //It doesn't exist\
    \ already\n        }\n    }\n\n    public Role findById(long id) {\n        return\
    \ this.em.find(Role.class, id);\n    }\n\n    public List<Role> findAll() {\n\
    \        return this.em.createNamedQuery(\"Role.findAll\", Role.class)\n     \
    \           .getResultList();\n    }\n}\n```\nListing 4. RoleService:\n\nYour\
    \ services are now ready to use. For simpler and more flexible dependency injection\
    \ (CDI), create a `beans.xml` file, and change the `bean-discovery-mode` from\
    \ `annotated` to `all`.\n\n```\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<beans\
    \ xmlns=\"http://xmlns.jcp.org/xml/javaee\"\n    xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\
    \n    xsi:schemaLocation=\"http://xmlns.jcp.org/xml/javaee\n                 \
    \     http://xmlns.jcp.org/xml/javaee/beans_1_1.xsd\"\n    bean-discovery-mode=\"\
    all\">\n\n</beans>\n```\n\n## Step 3: Apache Shiro view\n\nFirst, add the Apache\
    \ Shiro dependency to your project pom:\n\n```xml\n<dependency>\n    <groupId>org.apache.shiro</groupId>\n\
