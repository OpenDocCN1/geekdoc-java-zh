  trans: "\n接下来，为 `SecurityManager` 添加一个 `RememberMeManager`，它将使用 Cookie 来记住安全会话。为此请使用\
    \ `CookieRememberMeManager` 实现。\n\nCookie 值是多个主体（principals）集合的序列化表示经过 AES 加密表示后的\
    \ Base64 编码表示。简单来说，它包含了必要的用户信息，可以使用正确的密钥进行解密。使用默认密钥是不可行的，因为黑客通过查看 Shiro 的源码就能发现这一点，因此请指定自定义的\
    \ `AES` 密码密钥。\n\n你自定义的 `RememberMeManager` 如下：\n\n```java\nbyte[] cypherKey =\
    \ String.format(\"0x%s\", Hex.encodeToString(new AesCipherService().generateNewKey().getEncoded())).getBytes();\n\
    \nRememberMeManager rememberMeManager = new CookieRememberMeManager();\n((CookieRememberMeManager)\
    \ rememberMeManager).setCipherKey(cypherKey);\n\nsecurityManager.setRememberMeManager(rememberMeManager);\n\
    ```\n\n你自定义的 `RememberMeManager` 已准备就绪。\n\n### 步骤 4.2.1.4: 编写 CacheManager\n\n\
    Shiro 已开始支持缓存系统，虽然目前的支持尚显不足，但在未来的版本中它将变得更加健壮。但 Shiro 支持 EhCache，它非常符合本项目的需求。让我们将该依赖添加到\
    \ `pom.xml` 文件中。\n\n```xml\n<!-- EhCache Dependencies -->\n<dependency>\n    <groupId>org.apache.shiro</groupId>\n\
    \    <artifactId>shiro-ehcache</artifactId>\n    <version>1.2.4</version>\n</dependency>\n\
    \n<dependency>\n    <groupId>net.sf.ehcache</groupId>\n    <artifactId>ehcache</artifactId>\n\
    \    <version>2.10.1</version>\n</dependency>\n```\n\n接下来，在 `src/main/resources`\
    \ 文件夹中创建 EhCache 配置文件。你可以将其命名为 `ehcache.xml`。\n\n```xml\n<ehcache name=\"shiro\"\
    \ updateCheck=\"false\">\n    <diskStore path=\"/Users/nebrass/shiro-ehcache\"\
    />\n\n    <defaultCache\n        maxElementsInMemory=\"10000\"\n        eternal=\"\
    false\"\n        timeToIdleSeconds=\"120\"\n        timeToLiveSeconds=\"120\"\n\
    \        overflowToDisk=\"false\"\n        diskPersistent=\"false\"\n        diskExpiryThreadIntervalSeconds=\"\
    120\"/>\n\n</ehcache>\n```\n\n我建议避免使用默认值，并始终将 `diskStore` 值指定为缓存存储的路径。\n\n***\n\
    \n现在，你可以在 `ShiroConfiguration` 类中为你的 `SecurityManager` 定义 `CacheManager`。\n\n\
    ```java\nCacheManager cacheManager = new EhCacheManager();\n((EhCacheManager)\
    \ cacheManager).setCacheManagerConfigFile(\"classpath:ehcache.xml\");\nsecurityManager.setCacheManager(cacheManager);\n\
    ```\n\n`classpath:ehcache.xml` 段表示 `ehcache.xml` 文件已在类路径可用。你刚刚将 `EhCacheManager`\
    \ 设置为 `SecurityManager` 的 `CacheManager`。缓存将根据指定配置文件中定义的设置进行处理。\n\n### 步骤 4.2.1.5:\
    \ 组装组件\n\n你的 `SecurityManager` 几乎准备就绪。你的 `SecurityManager` getter 方法将如下：\n\n```java\n\
    @Produces\npublic WebSecurityManager getSecurityManager() {\n    DefaultWebSecurityManager\
    \ securityManager = null;\n    if (securityManager == null) {\n        AuthorizingRealm\
    \ realm = new SecurityRealm();\n\n        CredentialsMatcher credentialsMatcher\
    \ = new PasswordMatcher();\n        ((PasswordMatcher) credentialsMatcher).setPasswordService(new\
    \ BCryptPasswordService());\n        realm.setCredentialsMatcher(credentialsMatcher);\n\
    \n        securityManager = new DefaultWebSecurityManager(realm);\n\n        CacheManager\
    \ cacheManager = new EhCacheManager();\n        ((EhCacheManager) cacheManager).setCacheManagerConfigFile(\"\
    classpath:ehcache.xml\");\n        securityManager.setCacheManager(cacheManager);\n\
    \n        byte[] cypherKey = String.format(\"0x%s\",\nHex.encodeToString(new AesCipherService().generateNewKey().getEncoded()))\n\
    \                    .getBytes();\n\n        RememberMeManager rememberMeManager\
    \ = new CookieRememberMeManager();\n        ((CookieRememberMeManager) rememberMeManager).setCipherKey(cypherKey);\n\
    \        securityManager.setRememberMeManager(rememberMeManager);\n    }\n   \
    \ return securityManager;\n}\n```\n\nCDI 的 `@Produces` 注解标识一个“生产者”方法或字段，这意味着它将\
    \ `getSecurityManager()` 方法识别为 CDI 上文中 `WebSecurityManager` 实例的生产者。\n\n`WebSecurityManager`\
    \ 生产者已准备就绪。下一步是定义你的 `FilterChainResolver`。\n\n### 步骤 4.2.2: 编写 FilterChainResolver\
    \ 生产者\n\n`FilterChainResolver` 生产者方法提供了为应用程序中任何匹配的 URL 路径定义即时过滤器链的能力。这种方法比在 `web.xml`\
    \ 中定义过滤器链的常用策略要灵活、强大且简洁得多；即使你从未使用任何其他 Shiro 功能，单凭这一点就足以证明其使用价值。`<URL path expression,\
    \ filterName>` 将每个过滤器映射到其应用的 URL 路径表达式。\n\nURL 路径表达式按照它们定义的顺序对传入的请求进行求值，第一个匹配获胜。\n\
    \nShiro 提供了大量的预定义过滤器。\n\n| 过滤器名称 | 类 |\n| --- | --- |\n| | |\n\n本项目主要使用 `anon`、`authc`\
    \ 和 `user`：\n\n- `anon` 允许立即访问路径，而无需执行安全检查。\n- `authc` 要求请求用户必须经过验证才能继续请求，通过重定向到\
    \ `loginUrl` 强制用户登录。\n- `user` 如果允许访问者是已知用户，则允许访问资源，已知用户定义为拥有主体（principal）。这意味着任何通过“记住我”功能验证或记住的用户都将被允许访问。\n\
    \n***\n\n选择过滤器后，在 `FilterChainManager` 中指定你的选择。\n\n```java\nFormAuthenticationFilter\
    \ authc = new FormAuthenticationFilter();\nAnonymousFilter anon = new AnonymousFilter();\n\
    UserFilter user = new UserFilter();\n\nFilterChainManager fcMan = new DefaultFilterChainManager();\n\
    fcMan.addFilter(\"authc\", authc);\nfcMan.addFilter(\"anon\", anon);\nfcMan.addFilter(\"\
    user\", user);\n```\n\n接下来，定义过滤器所需的属性。例如，你的 `authc` 和 `user` 过滤器需要定义 `loginUrl`。\n\
    \n```java\nauthc.setLoginUrl(\"/login.html\");\nuser.setLoginUrl(\"/login.html\"\
    );\n```\n\n接下来将 URL 路径表达式与相关的过滤器名称映射。\n\n```java\nfcMan.createChain(\"/index.html\"\
    , \"anon\");\nfcMan.createChain(\"/css/**\", \"anon\");\nfcMan.createChain(\"\
    /api/auth\", \"anon\");\nfcMan.createChain(\"/login.html\", \"authc\");\nfcMan.createChain(\"\
    /**\", \"user\");\n```\n\n将你的 `fcMan` `(FilterChainManager)` 设置为你正在产生的 `FilterChainResolver`。\n\
    \n```java\nPathMatchingFilterChainResolver resolver = new PathMatchingFilterChainResolver();\n\
    resolver.setFilterChainManager(fcMan);\nfilterChainResolver = resolver;\n\nreturn\
    \ filterChainResolver;\n```\n\n最后，这就是 `FilterChainResolver` 生产者方法。\n\n"
