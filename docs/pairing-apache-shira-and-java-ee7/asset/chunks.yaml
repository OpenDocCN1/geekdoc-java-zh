    \ by redirecting them to the `loginUrl` you configured.\n- `user` allows access\
    \ to resources if the accessor is a known user, which is defined as having a known\
    \ principal. This means that any user authenticated or remembered via \"remember\
    \ me\" feature will be allowed access via this filter.\n\n***\n\nAfter selecting\
    \ your filters, specify your selections in the `FilterChainManager`.\n\n```java\n\
    FormAuthenticationFilter authc = new FormAuthenticationFilter();\nAnonymousFilter\
    \ anon = new AnonymousFilter();\nUserFilter user = new UserFilter();\n\nFilterChainManager\
    \ fcMan = new DefaultFilterChainManager();\nfcMan.addFilter(\"authc\", authc);\n\
    fcMan.addFilter(\"anon\", anon);\nfcMan.addFilter(\"user\", user);\n```\n\nNext,\
    \ define the properties needed for the filters. For example, your `authc` and\
    \ `user` filters need to have the `loginUrl` defined.\n\n```java\nauthc.setLoginUrl(\"\
    /login.html\");\nuser.setLoginUrl(\"/login.html\");\n```\n\nNext, map the URL\
    \ path expressions with the associated filter name.\n\n```java\nfcMan.createChain(\"\
    /index.html\", \"anon\");\nfcMan.createChain(\"/css/**\", \"anon\");\nfcMan.createChain(\"\
    /api/auth\", \"anon\");\nfcMan.createChain(\"/login.html\", \"authc\");\nfcMan.createChain(\"\
    /**\", \"user\");\n```\n\nSet your `fcMan` `(FilterChainManager)` to the `FilterChainResolver`\
    \ that you are producing.\n\n```java\nPathMatchingFilterChainResolver resolver\
    \ = new PathMatchingFilterChainResolver();\nresolver.setFilterChainManager(fcMan);\n\
    filterChainResolver = resolver;\n\nreturn filterChainResolver;\n```\n\nFinally,\
    \ here’s the `FilterChainResolver` producer method.\n"
