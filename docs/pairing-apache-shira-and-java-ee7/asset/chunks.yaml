  trans: "\n\n![](img/cover.jpg)\n\n![](img/default.jpg) **Nebrass Lamouchi**\n\n\
    # 将 APACHE SHIRO 与 JAVA EE 7 结合\n\n© 2016 Nebrass Lamouchi 版权所有。版本 1.0。\n由 InfoQ.com\
    \ 的出版商 C4Media 出版。\n未经出版者书面许可，不得以任何形式或通过手段（电子、机械、复印、录制、扫描或其他）复制、存储在检索系统中或传输本书，除非符合\
    \ 1976 年《美国版权法》第 107 条或 108 条的规定。\n\n制作编辑：Ana Ciobotaru\n文字编辑：Lawrence Nyveen\n\
    封面与内页设计：Dragos Balasoiu\n美国国会图书馆编书数据：ISBN: 978-1-365-12404-4\n\n![](img/default.jpg)\
    \ **Nebrass Lamouchi**\n\n# 将 APACHE SHIRO 与 JAVA EE 7 结合\n\n致妈妈：无论如何，无法充分感谢你所的一切。\n\
    致爸爸的灵魂：我每天都在想念你……​\n致 Firass：你是最好的，愿上帝保佑你……​\n致我的爱人：自从你进入我的生活，许多新的情感和感受开始喷涌而出……\n\
    \n![](img/default.jpg) **Nebrass Lamouchi**\n\n# 将 APACHE SHIRO 与 JAVA EE 7 结合\n\
    \n我想向许多帮助我完成这本书的人表示感谢。感谢所有提供支持、阅读、撰写、提供评论以及协助编辑和设计的人。\n感谢我的朋友们，感谢你们在我需要时一直都在那里。\n\
    感谢 Jérome Salles，感谢你教我 Java EE 艺术，以及给予我的支持和指导。\n感谢 Paul Bernardi 和 Geertjan Wielenga，感谢你们信任我的能力，并为我提供机会。\n\
    感谢 Victor Grazi 和 Laurie Nyveen，这些为本书付出的优秀技术评审人员。感谢你们出色的工作。\n感谢 Ana Ciobotaru\
    \ 和 Charles Humble，感谢你们让这本书的想法变为现实。感谢你们提供的提供的所有帮助和支持。\n最后，同样重要的是，我恳请这些年来一直陪伴在我身边但我未能提及的各位给予原谅。\n\
    \n![](img/default.jpg) **Nebrass Lamouchi**\n\n# 将 APACHE SHIRO 与 JAVA EE 7 结合\n\
    \n在过去的几年里，我参与了许多使用 Java 开发应用程序的项目和公司。在这些应用程序中，我曾尝试实现身份验证与授权模块，有时会使用 Spring Security\
    \ 或 JBoss Picketlink。\n我对 IT 安全的硕士研究以及在 OWASP 基金会的经验让我更有动力去探索如 `JAAS`、`JASPIC`、`Spring\
    \ Security` 和 `Picketlink` 等安全框架。\n\n当我听到 Apache Shiro 时，我立刻就想使用它。它将我常用的框架整合到了一个易于使用的包中。我想写这本书，是因为我看到这对于初级\
    \ Java 开发者来说，能够快速入门并开始安全化他们的应用程序非常有帮助。我想进一步深化这个精彩项目的知识。我想向他们展示安全并不可怕，它只是另一个可以提高你的应用程序安全体验（Application\
    \ Security eXperience）的框架。\n\n## InfoQ 微型书包含什么内容？\n\nInfoQ 微型书的设计旨在精简扼要，旨在为希望快速深入地对新技术或技术获得坚实概念理解的技术架构师提供服务。你可以将这些书看作是对主题的策略性或本质性的涵盖。在读完微型书后，读者应该对某项技术有基本的理解，包括何时以及如何应用它、它与其他技术的关系，并总体上感觉自己吸收了已经搞清楚这项技术的其他人士的综合知识。这样，当他们的项目需要时，读者就能对该技术做出明智的，并在那时深入研究更详细的信息源（如较大的书籍或教程）。\n\
    \n## 本书适合读者\n\n本书专门针对希望通过学习如何将 Apache Shiro 与 Java EE 7 结合来快速了解 Apache Shiro 的\
    \ Java 开发者。\n\n## 读本书需要什么\n\n为了尝试书中的代码示例，你需要一台运行最新操作系统（Windows、Linux 或 Mac OS\
    \ X）的电脑。你需要安装 Node.js 和 Java。书中的代码针对 Node.js v0.12 和 JDK 8 进行过测试，但较新版本也应该有效。\n\
    \n## 规范\n\n我们在书中使用了一些排版惯例，以区分不同类型的信息。\n\n文中的代码（包括命令、变量、文件名、XML 配置和属性名称）所示：ShiroFilterActivator\
    \ 继承了 `ShiroFilter` 类。它的注解 `@WebFilter(\"/*\")` 启用了所有请求的过滤器。\n\n代码块如下所示。根据你阅读本书的格式，颜色可能会不同。\n\
    \n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<beans\n        xmlns:xsi=\"\
    http://www.w3.org/2001/XMLSchema-instance\"\n        xmlns=\"http://xmlns.jcp.org/xml/ns/javaee\"\
    \n        xsi:schemaLocation=\"http://xmlns.jcp.org/xml/ns/javaee\n          \
    \            http://xmlns.jcp.org/xml/ns/javaee/beans_1_1.xsd\"\n        bean-discovery-mode=\"\
    all\">\n</beans>\n```\nListing 1. `src/main/webapp/WEB-INF/beans.xml`\n\n```java\n\
    @ApplicationPath(\"api\")\npublic class JaxRsConfiguration extends Application\
    \ {\n    // JAX-RS 配置类\n}\n```\nListing 2. `src/main/java/demo/DemoApplication.java`\n\
    \n当我们想要你注意代码特定部分时，会使用数字标注。\n\n```java\nprivate String getCredentials(AuthenticationInfo\
    \ info) { ①\n\n    Object credentials = info.getCredentials(); ②\n    return toString(credentials);\
    \ ③\n}\n```\n\n1. *①* 我们将基础 `AuthenticationInfo` 对象传递给 `getCredentials()` 方法。\n\
    2. *②* `info.getCredentials()` 是 `getCredentials()` 方法调用的函数，用于从 `AuthenticationInfo`\
    \ 实例获取 `credentials` 对象。\n3. *③* 将 `credentials` 实例的字符串格式返回给 `getCredentials()`\
    \ 调用。\n\n最后，这段文字展示了引用格式。\n\n> “最后，重要的不是生命的长度，而是生命的跨度。”\n\n> \n\n> ~ 林肯\n\n## 读者反馈\n\
    \n我们总是欢迎读者的反馈。告诉我们你对这本书的看法——你喜欢或不喜欢。读者反馈有助于我们开发你受益最大的书籍。向我们发送反馈，请邮件至 `feedback@infoq.com`。\n\
    \n如果你在某个领域拥有知识并兴趣编写或贡献书籍，请查看我们的微型书指南：`http://www.infoq.com/minibook-guidelines`。\n\
    \n"
- fmt: '

    Every competent Java EE developer knows that you must have security APIs in the
    platform, either natively or offered by third-party frameworks. But since the
    birth of the Java EE platform on December 12, 1999, Java EE has lacked a full,
    dedicated security specification. `JSR-375` has been created to provide a complete
    specification for Java EE security, one that covers all needs, but will only be
    available in the Java EE 8 release, estimated to arrive in 2017.


    One of the most desired of security features are authentication and authorization.
    I will refer to authentication and authorization in this article as "Auth²". The
    platform hasn’t provided a useful solution for these despite attempts like `JAAS`
    (2001-2003) and `JASPIC` (2009) to allow Java EE folks to do some "standardized"
    Auth².


    As usual, when the community demands a feature that is unfortunately not provided
    by the platform, third parties try to satisfy the need. The most popular stars
    for Auth² in Java EE are `Spring Security`, JBoss’s `PicketLink`, and `Apache
    Shiro`.


    Many developers implement their own Auth² mechanisms rather than taking the time
    to understand and implement these weird third-party solutions. I write "weird"
    because every third-party solution is tightly linked to its creator, such as `Spring
    Security` and `JBoss PicketLink` or poorly documented and ambiguous, which is
    the case for `Apache Shiro`.


    ## Personal case


    I decided to share my personal experience with Auth² frameworks. I am trying to
    build my own up-to-date security framework for Java EE 7. My implementation will
    be handy until the release of a reference implementation for `JSR-375`. I will
    try to explain every choice made and I hope this it is useful to you.


    I have tried many APIs but every one disappointed me. Either the solution was
    hard to implement (implementing `Spring Security` with `EJB`, using `JAAS` and
    `JASPIC` is not exactly terrific) or the solution was vendor specific (`PicketLink`
    is usable only in a JBoss server) or the API was poorly documented (`Apache Shiro`).


    I discovered `Apache Shiro` in December 2012. At that time, it wasn’t popular.
    It was hard to use and suffered from poor documentation and references. I tried
    to use it but ended up dropping it.


    ## Professional experience


    Since starting my career as a Java developer, every client has asked me to help
    implementing their own Auth² solution, except for one who asked me to implement
    `Spring Security` on his web app. Every time I work on the security level, I keep
    asking myself "Why do I have to do this again? Why there is no efficient solution?
    Where is the reusability? Why I am repeating myself?"


    The last time I implemented an Auth² mechanism, I used older Java EE 6 technologies:
    `JSP` 2.5, `Servlets` 3.0, `JMS` 1.1, `EJB` 3.1, and `JPA` 2.0. It was an amazing
    experience to implement the Open Web Application Security Project (OWASP) specifications
    using Java EE APIs.


    ## Motivation for writing this tutorial


    After finishing that last project, I decided to revisit `Apache Shiro`, that mysterious
    framework that I could not use three years earlier.


    Oddly, I found that the Shiro website pages had not changed over the years. There
    were no new sections, no new tutorials, and no new documentation. Obviously, I
    looked on YouTube, Vimeo, and Dailymotion for Shiro video tutorials, with no success.
    I looked for any relevant books or articles, with no significant result. This
    was so strange for an Apache project. Usually, any Apache project rapidly gets
    well covered. But this wasn’t the case for Shiro.


    I tried to use Shiro in a sample project, and here’s my initial feedback:


    * There is the use for an `INI` file, which differs from `Spring Security` style,
    which uses `XML` files for configuration.

    * There is not enough official documentation and resources. For example, the official
    tutorial on the website focuses only on `Stormpath`.

    * The `JavaDoc` website of the latest Shiro version is almost always inaccessible
    (I reported that to the Apache Shiro Twitter account).


    I decided to write this tutorial to help fill in the gap.


    ![](images/avatars/default.jpg) **Nebrass Lamouchi**


    # PAIRING APACHE SHIRO WITH JAVA EE 7


    ## What is Shiro?


    `Apache Shiro` is an open-source software-security framework that performs authentication,
    authorization, cryptography, and session management. Originally known as `JSecurity`,
    Shiro has been designed to provide robust security features with intuitive and
    easy implementation.


    The tutorial detailed in this book is targeted at Java developers seeking an Auth²
    framework for use on contemporary technology stacks.


    The project got its name ("shiro" is Japanese for castle) in 2008 when it was
    pushed to the Apache Community. The "castle" mandate aims to provide a standardized
    framework that satisfies the full gamut of security considerations for any Java
    project.


    ## Plan of the castle


    `Apache Shiro` covers the main four concerns of application security:


    * Authentication, sometimes called "login", is the act of proving that a user
    is who they say they are.

    * Authorization is the process of access control, i.e., determining who has access
    to what.

    * Session management is managing user-specific sessions, even in non-web or Enterprise
    JavaBeans (`EJB`) applications.

    * Cryptography is keeping data secure using cryptographic algorithms while still
    maintaining ease of use.


    ![ShiroFeatures](images/ShiroFeatures.png)


    Supported environments include:


    * Web support — Shiro’s web support APIs help easily secure web applications.

    * Caching — caching is a first-class citizen in Apache Shiro ensures that security
    operations remain fast.

    * Concurrency — Shiro concurrency features are designed to support multi-threaded
    applications.

    * Testing — testing support simplifies the creation of unit and integration tests
    and ensures that your code will be secured.

    * "Run As" — Shiro allows users to assume the identity of another user (if entitled),
    a feature that can be useful in administrative scenarios.

    * "Remember Me" — Shiro remembers users'' identities across sessions so they only
    need to log in when mandatory.


    ## Why not JAAS or Spring Security?


    Existing Java security mechanisms (like `JAAS`) are confusing and fall short in
    the area of application-level security. Some, for example `PicketLink`, are server-dependent.
    Others, such as `Spring Security`, require tedious `XML` configuration.


    `Apache Shiro` aims to address these challenges by providing a user-friendly,
    standardized API for implementing security in your projects.


    ![](images/avatars/default.jpg) **Nebrass Lamouchi**


    # PAIRING APACHE SHIRO WITH JAVA EE 7


    ![logo shiro](images/logo-shiro.png)


    ## Technologies


    This tutorial uses:


    * `Apache Shiro` 1.2.4

    * Java EE 7 back end with `JPA` 2.1, `EJB` 3.2, and `JAX-RS` 2.0

    * `Payara Server`

    * `NetBeans` 8.1 IDE

