    \ request);\n    } else {\n        if (justLogged) {\n            return this.getRedirectResponse(WebPages.DASHBOARD_URL,\
    \ request); ⑦\n        }\n        return this.getRedirectResponse(WebPages.HOME_URL,\
    \ request); ⑥\n    }\n}\n```\n\n1. `@NotNull` 用于 bean 验证；在此定义验证是为了在尽可能早的时刻执行。\n\
