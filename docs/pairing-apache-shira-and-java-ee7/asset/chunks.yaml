    \n## Step 5: Exposing Shiro operations as REST services\n\nJava EE 7 introduced\
    \ strong support for REST web services, HTML5, WebSockets, and much more. To interact\
    \ with our application from the client side, let’s use JAX-RX to create some RESTful\
    \ web services to expose server operations such as:\n\n* login\n* logout\n* list\
    \ connected users\n* get information for a connected user\n* etc.\n\n### Step\
    \ 5.1: Enable JAX-RS\n\nTo enable JAX-RS services, you must define a JAX-RS application\
    \ class. Create a class called `JaxRsConfiguration` in the root of the `com.targa.dev.shirotutorial.security`\
    \ package. But why in the root?\n\nIn proper conformity with the BCE pattern,\
    \ this class is configuration; it is not boundary, controller, or entity. Since\
    \ it concerns the configuration of the application, it belongs in the package\
    \ root.\n\n```java\n@ApplicationPath(\"api\")\npublic class JaxRsConfiguration\
    \ extends Application {\n}\n```\n\nThe root URL of the RESTful web services will\
