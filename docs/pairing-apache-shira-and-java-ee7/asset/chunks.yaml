    \ Response.serverError()\n                       .type(MediaType.TEXT_HTML)\n\
    \                       .build();\n    }\n}\n```\n\nThe idea behind the `getConnectedUsers()`\
    \ is to create a collection that holds all connected users. When a user is logged\
    \ in, the user is added to the collection. When the user logs out, the user is\
    \ removed from the collection. We will leverage a nice benefit of CDI: the CDI\
    \ events mechanism.\n\nStart by injecting `Event<T>` to listen for fired events\
    \ of type T.\n\n```java\n@Inject\nprivate Event<AuthenticationEvent> monitoring;\n\
    \n@Inject\nprivate AuthenticationEventMonitor authenticationEventMonitor;\n```\n\
    \nThe `AuthenticationEventMonitor` class is a holder class for the event producer\
    \ and monitoring.\n\n***\n\nCreate the `AuthenticationEvent` event class as follows.\n\
    \n```java\npublic class AuthenticationEvent {\n    public enum Type { LOGIN, LOGOUT\
    \ }\n\n    private String username;\n    private Date creation;\n    private Type\
    \ type;\n\n    public AuthenticationEvent(String username, Type type) {\n    \
    \    this.username = username;\n        this.type = type;\n        this.creation\
    \ = new Date();\n    }\n\n    ...\n\n    @Override\n    public String toString()\
    \ {\n        return \"AuthenticationEvent{\" +\n                \"username='\"\
    \ + username + '\\'' +\n                \", creation=\" + creation +\n       \
    \         \", type=\" + type + '}';\n    }\n}\n```\n\n***\n\nNext, create a holder\
    \ for the events producer and manager.\n\n```java\npublic class AuthenticationEventMonitor\
    \ {\n    @Inject\n    private Logger logger;\n\n    private CopyOnWriteArrayList<String>\
    \ connectedUsers;\n\n    @PostConstruct\n    public void init() {\n        this.connectedUsers\
    \ = new CopyOnWriteArrayList<>();\n    }\n\n    public void onAuthenticationEvent(@Observes\
    \ AuthenticationEvent event) {\n        if (event != null &&\n               \
    \ ((event.getType() == AuthenticationEvent.Type.LOGIN) ||\n                  \
    \      (event.getType() == AuthenticationEvent.Type.LOGOUT))) {\n            if\
    \ (event.getType() == AuthenticationEvent.Type.LOGIN) {\n                if (!connectedUsers.contains(event.getUsername()))\
    \ {\n                    this.connectedUsers.add(event.getUsername());\n     \
    \           }\n            } else {\n                if (connectedUsers.contains(event.getUsername()))\
    \ {\n                    this.connectedUsers.remove(event.getUsername());\n  \
    \              }\n            }\n        } else {\n            logger.warning(\"\
    Unrecognized AuthenticationEvent : [\" + event + \"]\");\n        }\n    }\n\n\
    \    public boolean isUserAlreadyConnected(String username) {\n        return\
    \ this.connectedUsers.contains(username);\n    }\n\n    public List<String> getConnectedUsers()\
    \ {\n        return connectedUsers;\n    }\n}\n```\n\n***\n\nThe `AuthenticationResource`\
    \ class becomes the following.\n\n```java\n@Path(\"auth\")\n@Produces(MediaType.APPLICATION_JSON)\n\
    public class AuthenticationResource {\n    @Inject\n    private Logger logger;\n\
