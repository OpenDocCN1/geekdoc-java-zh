    \ Ne Nebrass Lamouchi\n\n# PAIRING APACHE SHIRO WITH JAVA EE 7\n\n## How to consume\
    \ Shiro’s web services\n\nOur RESTful web services can be consumed using every\
    \ client that can make HTTP requests:\n\n* HTML5 pages\n* Swing applications\n\
    * mobile applications on iOS, Android, etc.\n* etc.\n\nFor example, we can make\
    \ an AngularJS single-page application (SPA) as the view layer of our JavaEE7\
    \ application:\n\n* Make the REST calls in the services layer.\n* Manage your\
    \ Auth² operations depending on the HTTP response codes.\n* For the authorization,\
    \ you can use AngularJS authorization plugins (angular-route-authorisation, angular-http-auth,\
    \ angular-permission, etc.)\n\nYou may have to tweak your code to make it coherent\
    \ with your authorization mechanism.\n\n## What can you add to the implementation?\n\
    \nOur implementation of Apache Shiro framework is basic. We did not try concepts\
    \ such as LDAP, ActiveDirectory, CAS SSO, OAuth, or others.\n\nThe community offers\
    \ many integrations:\n\n* Pairing [Stormpath User Management](http://www.stormpath.com/blog/user-management-java-web-apps-stormpath-and-apache-shiro)\
    \ with Shiro provides a full application-security and user-management system with\
    \ little to no coding.\n* [Grails](http://grails.org/plugins/shiro) offers up-to-date\
    \ Grails/Shiro integration, including Grails 2.0 and Shiro 1.2\\. The plugin adds\
    \ easy authentication and access control to Grails applications.\n* [OAuth](https://github.com/FeedTheCoffers/shiro-oauth)\
    \ provides source code for an OAuth module for Apache Shiro, based on Scribe.\n\
    * A [Google App Engine](https://github.com/cilogi/gaeshiro) demonstrates one way\
    \ to integrate Shiro with Google App Engine and Google Guice, and comes with front-end\
    \ user registration and password management.\n* [Play Shiro Integration](https://github.com/wsargent/play-shiro)\
    \ simply integrates Apache Shiro and Play 2.0\\. If you want to play with it,\
    \ this project could use an update handling statelessness since the Shiro 1.2\
    \ release.\n* [The 55 Minutes Wicket project](https://github.com/55minutes/fiftyfive-wicket)\
    \ is a nifty set of tools and libraries for enhancing productivity with the Apache\
    \ Wicket Java web framework, including Shiro integration.\n* [Lift Shiro](https://github.com/timperrett/lift-shiro)\
    \ integrates Shiro and the Lift Web framework, using Lift’s sitemap locs instead\
    \ of Shiro’s built-in web.xml resource filters to control access to URLs.\n\n\
    ## Recommendations\n\n1. Handle every HTTP error code (404, 400, 500, etc.) and\
    \ try to have an explicit error message in the HTTP headers of every response.\n\
    2. Ensure that your design covers the maximum use cases and be sure that all resources\
    \ that get anonymous access are neither vulnerable nor sensitive.\n3. Activate\
    \ and configure SSL when possible.\n4. Avoid transmitting the `JSESSIONID` parameter\
    \ over plain old HTTP.\n5. Avoid using URL parameters for session tracking.\n\
    6. Be sure to define a session-timeout value that is rational for your needs.\n\
    7. Try to build your knowledge of Auth² mechanisms and strategies. Take a look\
    \ at [OWASP](http://www.owasp.org)’s useful resources:\n    1. [OWASP Authentication\
    \ Cheat Sheet](https://www.owasp.org/index.php/Authentication_Cheat_Sheet)\n \
    \   2. [OWASP Guide to Authorization](https://www.owasp.org/index.php/Guide_to_Authorization)\n\
    \    3. [OWASP REST Security Cheat Sheet](https://www.owasp.org/index.php/REST_Security_Cheat_Sheet)\n\
    \    4. [OWASP Session Management](https://www.owasp.org/index.php/Session_Management)\n\
    8. Penetration your application to be sure your security mechanisms are powerful.\
    \ Use the [OWASP Guide](https://www.owasp.org/index.php/Web_Application_Testing).\n\
    \n![](images/avatars/default.jpg) Ne Nebrass Lamouchi\n\n## Additional reading\n\
