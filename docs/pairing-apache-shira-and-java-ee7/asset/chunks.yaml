    \ ②\npasswordService = org.apache.shiro.authc.credential.DefaultPasswordService\n\
    passwordMatcher.passwordService = $passwordService\n\nds = com.jolbox.bonecp.BoneCPDataSource\
    \ ③\nds.driverClass=com.mysql.jdbc.Driver\nds.jdbcUrl=jdbc:mysql://localhost:3306/simple_shiro_web_app\n\
    ds.username = root\nds.password = 123qwe\n\njdbcRealm = org.apache.shiro.realm.jdbc.JdbcRealm\
    \ ④\njdbcRealm.permissionsLookupEnabled = true\njdbcRealm.authenticationQuery\
    \ = SELECT password FROM USERS WHERE username = ?\njdbcRealm.userRolesQuery =\
    \ SELECT role_name FROM USERS_ROLES WHERE username = ?\njdbcRealm.permissionsQuery\
    \ = SELECT permission_name FROM ROLES_PERMISSIONS WHERE role_name = ?\njdbcRealm.credentialsMatcher\
    \ = $passwordMatcher\njdbcRealm.dataSource=$ds\n\nsecurityManager.realms = $jdbcRealm\
