    \n# PAIRING APACHE SHIRO WITH JAVA EE 7\n\nTo Mom, it’s impossible to thank you\
    \ adequately for everything you’ve done.\nTo the soul of Dad, I miss you every\
    \ day…​\nTo Firass, you are the best, may God bless you…​\nTo my sweetheart, since\
    \ you’ve come into my life, there are so many new emotions and feelings begging\
    \ to come out..\n\n![](images/avatars/default.jpg) **Nebrass Lamouchi**\n\n# PAIRING\
    \ APACHE SHIRO WITH JAVA EE 7\n\nI would like to express my gratitude to the many\
    \ people who saw me through this book. To all those who provided support, read,\
    \ wrote, offered comments and assisted in the editing and design.\nTo my friends\
    \ thank you for always being there when I need you.\nTo Jérome Salles, thank you\
    \ for teaching me the Java EE Art and for your support and guidance.\nTo Paul\
    \ Bernardi and Geertjan Wielenga, thank you for believing in my skills and for\
    \ the chances that you are offering to me.\nTo Victor Grazi and Laurie Nyveen,\
    \ the great technical reviewers who worked on this book. Thank you for the great\
    \ job that you did.\nTo Ana Ciobotaru and Charles Humble, thank you for making\
    \ the idea of this book come true. Thank you for all the help & support that you\
    \ have provided me.\nLast and not least, I beg forgiveness of all those who have\
    \ been with me over the course of the years and whose names I have failed to mention.\n\
    \n![](images/avatars/default.jpg) **Nebrass Lamouchi**\n\n# PAIRING APACHE SHIRO\
    \ WITH JAVA EE 7\n\nOver the last few years, I’ve been working on many projects\
    \ and companies that used Java to develop their applications. On those applications,\
    \ I tried to implement the authentication & authorization modules and sometimes\
    \ using the Spring Security or JBoss Picketlink.\nMy M.Sc studies of the IT Security\
    \ and my experience with the OWASP Foundation gave me more motivation to explore\
    \ the security frameworks such as `JAAS`, `JASPIC`, `Spring Security` and `Picketlink`.\n\
    \nWhen I heard about Apache Shiro, I was motivated to use it right away. It combined\
    \ my most-often-used frameworks into an easy-to-use package. I wanted to write\
    \ this book because I saw that it will be very helpful for junior Java developers\
    \ to find some quick introduction for starting securing their apps. I wanted to\
    \ further the knowledge of this wonderful project. I wanted to show them how security\
    \ isn’t scary, it’s just another framework that can improve your Application Security\
    \ eXperience.\n\n## What is in an InfoQ mini-book?\n\nInfoQ mini-books are designed\
    \ to be concise, intending to serve technical architects looking to get a firm\
    \ conceptual understanding of a new technology or technique in a quick yet in-depth\
    \ fashion. You can think of these books as covering a topic strategically or essentially.\
    \ After reading a mini-book, the reader should have a fundamental understanding\
    \ of a technology, including when and where to apply it, how it relates to other\
    \ technologies, and an overall feeling that they have assimilated the combined\
    \ knowledge of other professionals who have already figured out what this technology\
    \ is about. The reader will then be able to make intelligent decisions about the\
    \ technology once their projects require it, and can delve into sources of more\
    \ detailed information (such as larger books or tutorials) at that time.\n\n##\
    \ Who this book is for\n\nThis book is aimed specifically at Java developers who\
    \ want a rapid introduction to Apache Shiro by learning how to couple it with\
    \ the Java EE 7.\n\n## What you need for this book\n\nTo try code samples in this\
    \ book, you will need a computer running an up-to-date operating system (Windows,\
    \ Linux, or Mac OS X). You will need Node.js and Java installed. The book code\
    \ was tested against Node.js v0.12 and JDK 8, but newer versions should also work.\n\
    \n## Conventions\n\nWe use a number of typographical conventions within this book\
    \ that distinguish between different kinds of information.\n\nCode in the text,\
    \ including commands, variables, file names, XML configuration files, and property\
    \ names are shown as follows: \"The ShiroFilterActivator extends the `ShiroFilter`\
    \ class. Its annotation `@WebFilter(\"/*\")` enables the filter for all the requests.\"\
    \n\nA block of code is set out as follows. It may be colored, depending on the\
    \ format in which you’re reading this book.\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
    UTF-8\"?>\n<beans\n        xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\
    \n        xmlns=\"http://xmlns.jcp.org/xml/ns/javaee\"\n        xsi:schemaLocation=\"\
    http://xmlns.jcp.org/xml/ns/javaee\n                      http://xmlns.jcp.org/xml/ns/javaee/beans_1_1.xsd\"\
    \n        bean-discovery-mode=\"all\">\n</beans>\n```\nListing 1. `src/main/webapp/WEB-INF/beans.xml`\n\
    \n```java\n@ApplicationPath(\"api\")\npublic class JaxRsConfiguration extends\
    \ Application {\n    // JAX-RS Configuration Class\n}\n```\nListing 2. `src/main/java/demo/DemoApplication.java`\n\
    \nWhen we want to draw your attention to a particular part of the code, it’s called\
    \ out with numbers.\n\n```java\nprivate String getCredentials(AuthenticationInfo\
    \ info) { ①\n\n    Object credentials = info.getCredentials(); ②\n    return toString(credentials);\
    \ ③\n}\n```\n\n1. *①* We are passing the fundamental `AuthenticationInfo` object\
    \ to the `getCredentials()` method.\n2. *②* `info.getCredentials()` is a function\
    \ called in the `getCredentials()` method, used to grab the `credentials` object\
    \ from the `AuthenticationInfo` instance.\n3. *③* The textual format of the `credentials`\
    \ instance is returned to the `getCredentials()` caller.\n\nFinally, this text\
    \ shows what a quote looks like.\n\n> “In the end, it’s not the years in your\
    \ life that count. It’s the life in your years.”\n\n> \n\n> ~ Abraham Lincoln\n\
    \n## Reader feedback\n\nWe always welcome feedback from our readers. Let us know\
    \ what you think about this book — what you liked or disliked. Reader feedback\
    \ helps us develop titles that you get the most out of. To send us feedback, e-mail\
    \ us at `feedback@infoq.com`.\n\nIf you have a topic that you have expertise in\
    \ and you are interested in either writing or contributing to a book, please take\
    \ a look at our mini-book guidelines at `http://www.infoq.com/minibook-guidelines`.\n"
