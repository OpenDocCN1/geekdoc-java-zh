  trans: "\n\n查找名称中的 `appName` 组件被显示为可选，因为它不适用于部署在独立模块中的 beans。只有封装在 `.ear` 文件中的 beans\
    \ 才会在 `java:global` 查找名称中包含 `appName` 组件。由于你的应用程序被打包为 WAR，因此在企业企业 Bean（EJB）的 JNDI\
    \ 名称中不会有 `appName` 值。你的 `moduleName` 为 `\"ShiroTutorial\"`（请参见 `pom.xml`）。\n\n\
    因此，你 EJB 的 JNDI 名称为：\n\n```\njava:global/ShiroTutorial/UserService\njava:global/ShiroTutorial/RoleService\n\
    ```\n\n***\n\n现在，你可以按照如下方式编写 `SecurityRealm`：\n\n```java\npublic class SecurityRealm\
    \ extends AuthorizingRealm {\n    private Logger logger;\n    private UserService\
    \ userService;\n\n    public SecurityRealm() {\n        super();\n        this.logger\
    \ = Logger.getLogger(SecurityRealm.class.getName());\n\n        try {\n      \
    \      InitialContext ctx = new InitialContext();\n            this.userService\
    \ = (UserService) ctx.lookup(\"java:global/ShiroTutorial/UserService\");\n   \
    \     } catch (NamingException ex) {\n            logger\n                .warning(\"\
    Cannot do the JNDI Lookup to instantiate the User service : \" + ex);\n      \
    \  }\n    }\n}\n```\n\n规范为 `appName` 和 `moduleName` 固定了预定义的 JNDI 名称，因此你可以动态地获取它们。\n\
    \n```\njava:app/AppName\njava:module/ModuleName\n```\n\n使用这些名称，你可以这样编写 JNDI 查找代码：\n\
    \n```java\ntry {\n    InitialContext ctx = new InitialContext();\n    String moduleName\
    \ = (String) ctx.lookup(\"java:module/ModuleName\");\n    this.userService = (UserService)\
    \ ctx.lookup(String.format(\"java:global/%s/UserService\", moduleName));\n} catch\
    \ (NamingException ex) {\n    logger\n        .warning(\"Cannot do the JNDI Lookup\
    \ to instantiate the User service : \" + ex);\n}\n```\n\n***\n\n现在，在 `doGetAuthenticationInfo()`\
    \ 和 `doGetAuthorizationInfo()` 方法中使用你的 EJB。\n\n```java\n@Override\nprotected AuthenticationInfo\
    \ doGetAuthenticationInfo(AuthenticationToken token) throws AuthenticationException\
    \ {\n    // 识别要登录的账户\n    UsernamePasswordToken userPassToken = (UsernamePasswordToken)\
    \ token;\n    String username = userPassToken.getUsername();\n    if (username\
    \ == null) {\n        logger.warning(\"Username is null.\");\n        return null;\n\
    \    }\n\n    // 从数据库中读取用户\n    User user = this.userService.findByUsername(username);\n\
    \    if (user == null) {\n        logger.warning(\"No account found for user [\"\
    \ + username + \"]\");\n        throw new IncorrectCredentialsException();\n \
    \   }\n\n    return new SimpleAuthenticationInfo(username, user.getPassword(),\
    \ getName());\n}\n\n@Override\nprotected AuthorizationInfo doGetAuthorizationInfo(PrincipalCollection\
    \ principals) {\n    // 用户名是无效的\n    if (principals == null) {\n        throw\
    \ new AuthorizationException(\"PrincipalCollection method argument cannot be null.\"\
    );\n    }\n\n    String username = (String) getAvailablePrincipal(principals);\n\
    \    Set<String> roleNames = new HashSet<>();\n    roleNames.add(this.userService.findByUsername(username).getRole().getName());\n\
    \    AuthorizationInfo info = new SimpleAuthorizationInfo(roleNames);\n\n    /**\n\
    \    * 如果你想进行基于权限的授权，可以获取与你的用户关联的权限列表：\n    * Set<String> permissions = new HashSet<>();\n\
    \    * permissions.add(this.userService.findByUsername(username).getRole().getPermissions());\n\
    \    * ((SimpleAuthorizationInfo)info).setStringPermissions(permissions);\n  \
    \  */\n    return info;\n}\n```\n\n代码非常直观，且组件名称已经说明了一切。\n\n### 步骤 4.2.1.2：编写 CredentialsMatcher\n\
    \n`CredentialsMatcher` 是用于验证凭据并检查是否可以授予访问的组件。`CredentialsMatcher` 接口有许多实现：\n\n\
    * `AllowAllCredentialsMatcher`\n* `HashedCredentialsMatcher`\n* `Md2CredentialsMatcher`\n\
    * `Md5CredentialsMatcher`\n* `PasswordMatcher`\n* `Sha1CredentialsMatcher`\n*\
    \ `Sha256CredentialsMatcher`\n* `Sha384CredentialsMatcher`\n* `Sha512CredentialsMatcher`\n\
    * `SimpleCredentialsMatcher`\n\n`CredentialsMatcher` 的每个实现都有特定的属性和功能。例如，`SimpleCredentialsMatcher`\
    \ 用于直接的明文比较。`PasswordMatcher` 使用内部的 `PasswordService` 来比较密码。Shiro 的 JavaDoc 将\
    \ `PasswordMatcher` 描述为“一个对哈希文本密码采用最佳实践比较的 `CredentialsMatcher`”。\n\n选择 `PasswordMatcher`\
    \ 作为 `CredentialsMatcher` 的实现，以便你可以为密码验证定义自定义的 `PasswordService`。\n\n让我们来聊聊密码本身。我们需要选择一种哈希算法来存储和比较密码。经过研究，我选择了\
    \ `bcrypt` 作为哈希算法。基于 Blowfish 对称密钥块密码加密算法，`bcrypt` 是一种自适应哈希函数，它引入了一个工作因子（也称为安全因子），该因子允许你确定哈希函数的成本。\n\
    \n让我们使用 `bcrypt` 的 `jBCrypt` 实现，你必须在 `pom.xml` 文件中添加该依赖。\n\n```xml\n<dependency>\n\
    \    <groupId>de.svenkubiak</groupId>\n    <artifactId>jBCrypt</artifactId>\n\
    </dependency>\n```\n\n***\n\n接下来，编写自定义的 `PasswordService` 类。将类命名为 `BCryptPasswordService`\
    \ 并实现 `PasswordService` 接口及其两个方法 `encryptPassword()` 和 `passwordsMatch()`。\n\n\
    ```java\npublic class BCryptPasswordService implements PasswordService {\n   \
    \ public static final int DEFAULT_BCRYPT_ROUND = 10;\n    private int logounds;\n\
    \n    public BCryptPasswordService() {\n        this.logounds = DEFAULT_BCRYPT_ROUND;\n\
    \    }\n\n    public BCryptPasswordService(int logounds) {\n        this.logounds\
    \ = logounds;\n    }\n\n    @Override\n    public String encryptPassword(Object\
    \ plaintextPassword) {\n        if (plaintextPassword instanceof String) {\n \
    \           String password = (String) plaintextPassword;\n            return\
    \ BCrypt.hashpw(password, BCrypt.gensalt(logounds));\n        }\n        throw\
    \ new IllegalArgumentException(\n                \"BCryptPasswordService encryptPassword\
    \ only support java.lang.String.\");\n    }\n\n    @Override\n    public boolean\
    \ passwordsMatch(Object submittedPlaintext, String encrypted) {\n        if (submittedPlaintext\
    \ instanceof char[]) {\n            String password = String.valueOf((char[])\
    \ submittedPlaintext);\n            return BCrypt.checkpw(password, encrypted);\n\
    \        }\n        throw new IllegalArgumentException(\n                \"BCryptPasswordService\
    \ passwordsMatch only support char[].\");\n    }\n\n    public void setLogRounds(int\
    \ logounds) {\n        this.logounds = logounds;\n    }\n\n    public int getLogRounds()\
    \ {\n        return logounds;\n    }\n}\n```\n\n***\n\n该类将在 `CredentialsMatcher`\
    \ 的 `passwordMatch()` 方法中使用。但它也可以用于新用户的注册过程，在调用 `UserService` 的 `save` 方法之前。\n\
    \n因此，更新你的 `ShiroConfiguration` 类。\n\n```java\npublic class ShiroConfiguration\
    \ {\n    @Inject\n    UserService userService;\n\n    @Produces\n    public WebSecurityManager\
    \ getSecurityManager() {\n        DefaultWebSecurityManager securityManager =\
    \ null;\n        if (securityManager == null) {\n            AuthorizingRealm\
    \ realm = new SecurityRealm(userService);\n            CredentialsMatcher credentialsMatcher\
    \ = new PasswordMatcher();\n            ((PasswordMatcher) credentialsMatcher).setPasswordService(new\
    \ BCryptPasswordService());\n            realm.setCredentialsMatcher(credentialsMatcher);\n\
    \            …\n            securityManager = new DefaultWebSecurityManager(realm);\n\
    \        }\n        return securityManager;\n    }\n}\n```\n\n##### 步骤 4.2.1.3：编写\
    \ RememberMeManager\n\n"
- fmt: "\nNext, add to `SecurityManager` a `RememberMeManager` that will use cookies\
    \ to remember security sessions. Use the `CookieRememberMeManager` implementation\
    \ for this.\n\nThe cookie value is a Base64-encoded representation of an AES-encrypted\
    \ representation of a serialized representation of a collection of principals.\
    \ Basically, it contains the necessary user information, which can be decrypted\
    \ with the right key. Using the default key will never do, since a hacker could\
    \ easily figure that out by looking at Shiro’s source code, so specify a custom\
    \ `AES` cipher key.\n\nYour customized `RememberMeManager` will look like this:\n\
    \n```java\nbyte[] cypherKey = String.format(\"0x%s\", Hex.encodeToString(new AesCipherService().generateNewKey().getEncoded())).getBytes();\n\
    \nRememberMeManager rememberMeManager = new CookieRememberMeManager();\n((CookieRememberMeManager)\
    \ rememberMeManager).setCipherKey(cypherKey);\n\nsecurityManager.setRememberMeManager(rememberMeManager);\n\
    ```\n\nYour customized `RememberMeManager` is ready for use.\n\n### Step 4.2.1.4:\
    \ Writing the CacheManager\n\nShiro has started supporting caching systems, and\
    \ although the support currently is somewhat lacking, it should become more robust\
    \ in upcoming releases. But Shiro supports EhCache, and that works nicely for\
    \ this project’s needs. Let’s add that dependency to the `pom.xml` file.\n\n```xml\n\
    <!-- EhCache Dependencies -->\n<dependency>\n    <groupId>org.apache.shiro</groupId>\n\
    \    <artifactId>shiro-ehcache</artifactId>\n    <version>1.2.4</version>\n</dependency>\n\
    \n<dependency>\n    <groupId>net.sf.ehcache</groupId>\n    <artifactId>ehcache</artifactId>\n\
    \    <version>2.10.1</version>\n</dependency>\n```\n\nNext, create the EhCache\
    \ configuration file in the `src/main/resources` folder. You can call it, for\
    \ example, `ehcache.xml`.\n\n```xml\n<ehcache name=\"shiro\" updateCheck=\"false\"\
    >\n    <diskStore path=\"/Users/nebrass/shiro-ehcache\"/>\n\n    <defaultCache\n\
    \        maxElementsInMemory=\"10000\"\n        eternal=\"false\"\n        timeToIdleSeconds=\"\
    120\"\n        timeToLiveSeconds=\"120\"\n        overflowToDisk=\"false\"\n \
    \       diskPersistent=\"false\"\n        diskExpiryThreadIntervalSeconds=\"120\"\
    />\n\n</ehcache>\n```\n\nI suggest that you avoid the defaults and always specify\
    \ the `diskStore` value as the path to the cache storage.\n\n***\n\nNow, you can\
    \ define the `CacheManager` for your `SecurityManager` in the `ShiroConfiguration`\
    \ class.\n\n```java\nCacheManager cacheManager = new EhCacheManager();\n((EhCacheManager)\
    \ cacheManager).setCacheManagerConfigFile(\"classpath:ehcache.xml\");\nsecurityManager.setCacheManager(cacheManager);\n\
    ```\n\nThe `classpath:ehcache.xml` snippet indicates that the `ehcache.xml` file\
    \ is already available in the classpath. You’ve just set the `EhCacheManager`\
    \ to be the `CacheManager` for your `SecurityManager`. The cache will be handled\
    \ according the settings defined in the specified configuration file.\n\n### Step\
    \ 4.2.1.5: Assembling the pieces\n\nYour `SecurityManager` is just about ready.\
    \ Your `SecurityManager` getter method will be:\n\n```java\n@Produces\npublic\
    \ WebSecurityManager getSecurityManager() {\n    DefaultWebSecurityManager securityManager\
    \ = null;\n    if (securityManager == null) {\n        AuthorizingRealm realm\
    \ = new SecurityRealm();\n\n        CredentialsMatcher credentialsMatcher = new\
    \ PasswordMatcher();\n        ((PasswordMatcher) credentialsMatcher).setPasswordService(new\
    \ BCryptPasswordService());\n        realm.setCredentialsMatcher(credentialsMatcher);\n\
    \n        securityManager = new DefaultWebSecurityManager(realm);\n\n        CacheManager\
    \ cacheManager = new EhCacheManager();\n        ((EhCacheManager) cacheManager).setCacheManagerConfigFile(\"\
    classpath:ehcache.xml\");\n        securityManager.setCacheManager(cacheManager);\n\
    \n        byte[] cypherKey = String.format(\"0x%s\",\nHex.encodeToString(new AesCipherService().generateNewKey().getEncoded()))\n\
    \                    .getBytes();\n\n        RememberMeManager rememberMeManager\
    \ = new CookieRememberMeManager();\n        ((CookieRememberMeManager) rememberMeManager).setCipherKey(cypherKey);\n\
    \        securityManager.setRememberMeManager(rememberMeManager);\n    }\n   \
    \ return securityManager;\n}\n```\n\nThe CDI `@Produces` annotation identifies\
    \ a \"producer\" method or field, which means that it will identify the `getSecurityManager()`\
    \ method as a producer of `WebSecurityManager` instances in the CDI context.\n\
    \nThe `WebSecurityManager` producer is ready for use. The next step is to define\
    \ your `FilterChainResolver`.\n\n### Step 4.2.2: Writing the FilterChainResolver\
    \ producer\n\nThe `FilterChainResolver` producer method provides the ability to\
    \ define ad hoc filter chains for any matching URL path in your application. This\
    \ approach is far more flexible, powerful, and concise than the familiar strategy\
    \ for defining filter chains in web.xml; even if you never use any other Shiro\
    \ feature, this alone would justify its use. The `<URL path expression, filterName>`\
    \ maps each filter to its applied URL path expression.\n\nThe URL path expressions\
    \ are evaluated against an incoming request in the order in which they are defined,\
    \ and the first match wins.\n\nShiro provides a large selection of predefined\
    \ filters.\n\n| Filter Name | Class |\n| --- | --- |\n| | |\n\nThis project mainly\
    \ uses `anon`, `authc`, and `user`:\n\n- `anon` allows access to a path immediately,\
    \ without performing security checks.\n- `authc` requires the requesting user\
