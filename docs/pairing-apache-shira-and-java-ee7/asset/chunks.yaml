    \ Form();\n  form.param(\"username\", \"shiro\");\n  form.param(\"password\",\
    \ \"netbeans\");\n  form.param(\"rememberMe\", \"false\");\n\n  Response response\
    \ = target.request(MediaType.APPLICATION_JSON_TYPE)\n          .post(Entity.entity(form,\
    \ MediaType.APPLICATION_FORM_URLENCODED));\n\n  assertEquals(response.getStatus(),\
    \ Response.Status.OK.getStatusCode());\n}\n\n@Test\npublic void testFailingLogin()\
    \ {\n  Form form = new Form();\n  form.param(\"username\", \"shiro\");\n  form.param(\"\
    password\", \"netbeans2\");\n  form.param(\"rememberMe\", \"false\");\n\n  Response\
    \ response = target.request(MediaType.APPLICATION_JSON_TYPE)\n          .post(Entity.entity(form,\
    \ MediaType.APPLICATION_FORM_URLENCODED));\n\n  assertEquals(response.getStatus(),\
    \ Response.Status.UNAUTHORIZED.getStatusCode());\n}\n```\n\n***\n\n执行测试。\n\n![nb11](img/nb11.png)\n\
    \n你将得到以下结果。\n\n![nb12](img/nb12.png)\n\n你可以不断编写 JUnit 测试来检查你的 RESTful 服务，我推荐这种方法，因为你可以轻松地调试它们。相比之下，像\
    \ Postman 这样的浏览器插件会让调试变得更加困难。\n\n![postman](img/postman.png)\n\n![](img/default.jpg)\
    \ Ne Nebrass Lamouchi\n\n# 将 APACHE SHIRO 与 JAVA EE 7 结合\n\n## 如何消费 Shiro 的 Web\
    \ 服务\n\n我们的 RESTful Web 服务可以使用任何可以发送 HTTP 请求的客户端来消费：\n\n* HTML5 页面\n* Swing 应用程序\n\
    * iOS、Android 等移动应用\n* 等等\n\n例如，我们可以制作一个 AngularJS 单页应用 (SPA) 作为我们 JavaEE7 应用程序的视图层：\n\
    \n* 在服务层进行 REST 调用。\n* 根据 HTTP 响应码管理你的 Auth² 操作。\n* 对于授权，你可以使用 AngularJS 授权插件（angular-route-authorisation、angular-http-auth、angular-permission\
    \ 等）。\n\n你可能需要微调代码以与你的授权机制保持一致。\n\n## 你可以在实现中添加哪些内容？\n\n我们对 Apache Shiro 框架的实现是基础的。我们没有尝试如\
    \ LDAP、ActiveDirectory、CAS SSO、OAuth 或其他概念。\n\n社区提供了许多集成方案：\n\n* 将 [Stormpath\
    \ 用户管理](http://www.stormpath.com/blog/user-management-java-web-apps-stormpath-and-apache-shiro)\
    \ 与 Shiro 结合，可以提供一个完整的应用安全和用户管理系统，且几乎不需要任何代码。\n* [Grails](http://grails.org/plugins/shiro)\
    \ 提供了最新的 Grails/Shiro 集成，包括 Grails 2.0 和 Shiro 1.2。该插件为 Grails 应用程序添加了简单的身份验证和访问控制。\n\
    * [OAuth](https://github.com/FeedTheCoffers/shiro-oauth) 为基于 Scribe 的 Apache Shiro\
    \ OAuth 模块提供了源码。\n* [Google App Engine](https://github.com/cilogi/gaeshiro) 展示了将\
    \ Shiro 与 Google App Engine 以及 Google Guice 集成的一种方法，并带有前端用户注册和密码管理。\n* [Play Shiro\
    \ Integration](https://github.com/wsargent/play-shiro) 简单地集成了 Apache Shiro 和 Play\
    \ 2.0。如果你想尝试它，该项目自 Shiro 1.2 发布后可能需要处理无状态更新。\n* [The 55 Minutes Wicket project](https://github.com/55minutes/fiftyfive-wicket)\
    \ 是一组实用的工具和库，用于增强 Apache Wicket Java Web 框架的生产力，包括 Shiro 集成。\n* [Lift Shiro](https://github.com/timperrett/lift-shiro)\
    \ 将 Shiro 与 Lift Web 框架集成，使用 Lift 的 sitemap 代替 Shiro 内置的 web.xml 资源过滤器来控制 URL\
    \ 的访问。\n\n## 建议\n\n1. 处理每一个 HTTP 错误代码（404, 400, 500 等），并尝试在每个响应的 HTTP 头部中包含显式的错误信息。\n\
    2. 确保你的设计涵盖了最大的用例，并确保所有允许匿名访问的资源既不脆弱也不敏感。\n3. 尽可能激活并配置 SSL。\n4. 避免通过明文 HTTP 传输\
    \ `JSESSIONID` 参数。\n5. 避免使用 URL 参数进行会话跟踪。\n6. 确保定义了一个符合你需求的合理会话超时值。\n7. 尝试构建你对\
    \ Auth² 机制和策略的理解。查看 [OWASP](http://www.owasp.org) 的有用资源：\n    1. [OWASP 身份认证备查清单](https://www.owasp.org/index.php/Authentication_Cheat_Sheet)\n\
    \    2. [OWASP 授权指南](https://www.owasp.org/index.php/Guide_to_Authorization)\n\
    \    3. [OWASP REST 安全备查清单](https://www.owasp.org/index.php/REST_Security_Cheat_Sheet)\n\
    \    4. [OWASP 会话管理](https://www.owasp.org/index.php/Session_Management)\n8. 对你的应用程序进行渗透测试，以确保你的安全机制是强大的。使用\
    \ [OWASP 指南](https://www.owasp.org/index.php/Web_Application_Testing)。\n\n![](img/default.jpg)\
    \ Ne Nebrass Lamouchi\n\n## 额外阅读\n\n建议你深入研究 Shiro 的官方文档。与 Spring Security 或 PicketLink\
    \ 等框架相比，它的文档确实匮乏，后者拥有更多资源：\n\n* [https://shiro.apache.org/static/latest/apidocs/]\n\
    * [http://shiro.apache.org/tutorial.html]\n\n有一些实用的教程，包括旧版本的 Shiro，例如 INI 和 XML\
    \ 配置：\n\n* [http://meri-stuff.blogspot.fr/2011/03/shiro-part-1-basics.html]\n\
    * [http://en.kodcu.com/2013/10/security-framework-2/]\n* [http://www.jjoe64.com/2014/01/apache-shiro-with-hibernates-full.html]\n\
    * [http://balusc.omnifaces.org/2013/01/apache-shiro-is-it-ready-for-java-ee-6.html]\n\
    \n你可以从这些教程中学习技巧，并将这些修改应用到任何 JavaEE7 项目中。\n\n"
