- fmt: "\n```java\n@Provider\npublic class ShiroExceptionMapper implements ExceptionMapper<Exception>\
    \ {\n\n    private static final String CAUSE = \"cause\";\n\n    @Override\n \
    \   public Response toResponse(Exception ex) {\n        if (ex instanceof UnknownAccountException)\
    \ {\n            return Response.status(Response.Status.FORBIDDEN)\n         \
    \   .header(ShiroExceptionMapper.CAUSE, \"Your username wrong\")\n           \
    \         .type(MediaType.TEXT_HTML)\n                    .build();\n        }\n\
    \        if (ex instanceof IncorrectCredentialsException) {\n            return\
    \ Response.status(Response.Status.UNAUTHORIZED)\n                    .header(ShiroExceptionMapper.CAUSE,\
    \ \"Password is incorrect\")\n                    .type(MediaType.TEXT_HTML)\n\
    \                    .build();\n        }\n        if (ex instanceof LockedAccountException)\
    \ {\n            return Response.status(Response.Status.CONFLICT)\n          \
    \          .header(ShiroExceptionMapper.CAUSE, \"This username is locked\")\n\
    \                    .type(MediaType.TEXT_HTML)\n                    .build();\n\
    \        }\n        if (ex instanceof AuthenticationException) {\n           \
    \ return Response.status(Response.Status.BAD_REQUEST)\n                    .header(ShiroExceptionMapper.CAUSE,\
    \ ex.getMessage())\n                    .type(MediaType.TEXT_HTML)\n         \
    \           .build();\n        }\n\n        return Response.serverError().\n \
    \               header(ShiroExceptionMapper.CAUSE, ex.toString()).build();\n \
    \   }\n}\n```\n\nAt this point, your JAX-RS services are ready for use, and all\
    \ of your Shiro services are exposed via RESTful services.\n\n`JSESSIONID` is\
    \ a cookie generated by a servlet container, such as Tomcat or Jetty, and is used\
    \ for session management in Java EE web apps for HTTP. Since HTTP is a stateless\
    \ protocol, a webserver must work to relate separate requests coming from a single\
    \ client. Session management is the process of tracking a user session using standard\
    \ techniques such as cookies and URL rewriting.\n\nOnce a session is created,\
    \ the container sends the `JSESSIONID` cookie in the client response. In the case\
    \ of HTML access, no user session is created. If the client has disabled cookies,\
    \ then the container uses URL rewriting to manage the session, where the `JSESSIONID`\
    \ is appended to the URL like this: `https://localhost:8080/ShiroTutorial/login.htm`;`jsessionid=9e934f9330d5081e34ce607b478a8e32dd9b0297dbb8`\n\
    \n```xml\n<session-config>\n    <session-timeout>\n        30\n    </session-timeout>\n\
    \    <tracking-mode>COOKIE</tracking-mode>\n</session-config>\n```\n\n***\n\n\
    ### Step 5.2: Test your RESTful services\n\nLet’s write a small client in the\
    \ form of a small Java SE app to test the web services. The client app will send\
    \ requests to our web services and you will use `JUnit` to check that all goes\
    \ well.\n\nFor testing the web services we are going to write a small client in\
    \ the form of a small Java SE app. Our client app, will make some requests to\
    \ our webservices to check if it is ok. This check will be done using `JUnit`.\n\
    \n### Step 5.2.1: Create the client project\n\nNow that everything is explained,\
    \ assemble the pieces into a working project:\n\n![nb6](images/nb6.png)\n\n***\n\
    \nAnd next…\n\n![nb7](images/nb7.png)\n\nAfter creating the project, go to the\
    \ `pom.xml` and change it as follows.\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
    UTF-8\"?>\n<project xmlns=\"http://maven.apache.org/POM/4.0.0\" xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\
    \ xsi:schemaLocation=\"http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd\"\
    >\n  <modelVersion>4.0.0</modelVersion>\n\n  <groupId>com.targa.dev</groupId>\n\
    \  <artifactId>ShiroTutorialClient</artifactId>\n  <version>1.0-SNAPSHOT</version>\n\
    \  <packaging>jar</packaging>\n\n  <properties>\n    <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>\n\
    \    <maven.compiler.source>1.8</maven.compiler.source>\n    <maven.compiler.target>1.8</maven.compiler.target>\n\
    \  </properties>\n\n  <build>\n    <finalName>ShiroTutorialClient</finalName>\n\
    \  </build>\n</project>\n```\n\n***\n\nAdd the `JUnit` dependency to your `pom.xml`.\n\
    \n```xml\n<dependencies>\n    <dependency>\n      <groupId>junit</groupId>\n \
    \     <artifactId>junit</artifactId>\n      <version>4.12</version>\n      <scope>test</scope>\n\
    \    </dependency>\n    <dependency>\n      <groupId>org.hamcrest</groupId>\n\
