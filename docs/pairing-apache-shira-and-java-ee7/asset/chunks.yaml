    \ `User Management` Web 服务。\n\nWeb 服务将在 `com.targa.dev.shirotutorial.security.boundary`\
    \ 中创建，因为它们是应用程序的边界，并将有助于与外部客户端交互。\n\n首先创建具有以下功能的 `Authentication` Web 服务：\n\n\
    * `login()`\n* `logout()`\n* `getSubjectInfo()`\n* `getConnectedUsers()`\n\n```java\n\
    @Path(\"auth\")\npublic class AuthenticationResource {\n    public Response login(){}\n\
    \    public Response logout(){}\n    public Response getSubjectInfo(){}\n    public\
    \ Response getConnectedUsers(){}\n}\n```\n\n该 Web 服务将通过 `http://[ApplicationPath]/api/auth`\
    \ 访问。\n\n* * *\n\n登录时，使用以下代码：\n\n```java\ntry {\n    SecurityUtils.getSubject().login(new\
    \ UsernamePasswordToken(username, password, rememberMe));\n} catch (AuthenticationException\
    \ e) {\n    throw new IncorrectCredentialsException(\"Unknown user,请重试\");\n}\n\
    ```\n\n在上述代码中，`username` 和 `password` 是字符串，`rememberMe` 是布尔值。用户通过 HTML 表单提供这些值（例如）。因此，`login()`\
    \ 方法如下：\n\n```java\n@POST\n@Path(\"login\")\npublic Response login(@NotNull @FormParam(\"\
    username\") String username, ①\n                      @NotNull @FormParam(\"password\"\
    ) String password, ②\n                      @NotNull @FormParam(\"rememberMe\"\
