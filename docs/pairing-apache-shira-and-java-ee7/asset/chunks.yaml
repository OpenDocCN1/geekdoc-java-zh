- fmt: "\n# Java Platform Enterprise Edition (Java EE)\n\nJava is the standard in\
    \ community-driven enterprise software. Java EE is ever expanding via the Java\
    \ Community Process, with contributions from industry experts, commercial and\
    \ open-source organizations, Java user groups, and countless individuals. Each\
    \ release integrates new features that align with industry requirements, increases\
    \ developer productivity, and improves application portability.\n\nThe latest\
    \ version of Java EE is Java EE 7, released in June 2013. The Java EE 7 platform\
    \ added first-class support for recent developments in web standards, including\
    \ `WebSockets` and `JSON`, which provide the underpinnings for HTML 5 support\
    \ in Java EE. Java EE 7 also adds a modern HTTP client API as defined by `JAX-RS\
    \ 2.0`.\n\nThe Java EE 7 specifications include:\n\n* [Java API for WebSockets\
    \ — JSR-356](https://www.jcp.org/en/jsr/detail?id=356)\n* [Java API for JSON Processing\
    \ — JSR-353](https://www.jcp.org/en/jsr/detail?id=353)\n* [Batch Applications\
    \ for Java Platform — JSR-352](https://www.jcp.org/ja/jsr/detail?id=352)\n* [Concurrency\
    \ Utilities for Java EE — JSR-236](https://www.jcp.org/ja/jsr/detail?id=236)\n\
    * [Java API for RESTful Web Services — JSR-311](https://www.jcp.org/en/jsr/detail?id=311)\n\
    * [Java Message Service 2.0 — JSR-343](https://www.jcp.org/en/jsr/detail?id=343)\n\
    * [Expression Language 3.0 — JSR-341](https://www.jcp.org/en/jsr/detail?id=341)\n\
    * [Enterprise JavaBeans 3.2 — JSR-345](https://www.jcp.org/en/jsr/detail?id=345)\n\
    * [Java Persistence 2.1 — JSR-338](https://www.jcp.org/en/jsr/detail?id=338)\n\
    * [JavaServer Faces 2.2 — JSR-344](https://www.jcp.org/en/jsr/detail?id=344)\n\
    \nYou can find all necessary information about the Java EE 7 specifications on\
    \ the umbrella [JSR-342](https://jcp.org/en/jsr/detail?id=342) page.\n\nJava EE\
    \ 7 specifications. ![javaee7](images/javaee7.jpg)\n\n## Payara Server\n\nPayara\
    \ Server is a drop-in replacement for the `GlassFish` server with guaranteed quarterly\
    \ releases. The Payara team provides enhancements, bug fixes, and patches to upstream\
    \ `GlassFish` server and dependent libraries. This is what makes Payara Server\
    \ one of the best application servers for production in the Java EE ecosystem.\
    \ The Payara team also provides 24/7 dedicated incident and software support delivered\
    \ by the best middleware engineers in the industry. The team is open to contributions\
    \ and publicly reports its progress in writing features or fixing bugs. There\
    \ also also a responsive community that reacts quickly to any request. Payara\
    \ Server tweaks `GlassFish` but keeps its ease of use and its beautiful administration\
    \ features.\n\nYou can grab the latest version of Payara Server from the [project\
    \ website](http://www.payara.fish/downloads)\uFEFF\n\n![payara logo](images/payara-logo.jpg)\n\
    \n## NetBeans IDE\n\nNetBeans IDE is the free Java IDE from Oracle, and is designed\
    \ to limit coding errors and optimize productivity without configuration or plugins.\
    \ NetBeans can interact with all of your environment components such as databases,\
    \ automation servers, application servers, quality tools, etc. without requiring\
    \ a lot of your time to prepare the environment.\n\nNetBeans IDE has awesome debugger\
    \ functionalities to optimize the refactoring and debugging processes. It includes\
    \ a powerful text editor with refactoring tools and code completion, snippets\
    \ and analyzers, and even a multilingual spelling checker. NetBeans also offers\
    \ powerful multisystem versioning using out-of-the-box integration with tools\
    \ such as `Git`, `SVN`, `CVS`, and `Mercurial`. Beyond Java and `JavaFX`, NetBeans\
    \ IDE supports `C/C++`, `PHP`, and `HTML5/JavaScript`. NetBeans IDE is available\
    \ for all operating systems that support a compatible `JVM`.\n\nNetBeans organizes\
    \ many free conferences and meetings all over the world, in the US, France, UK,\
    \ Netherlands, Brazil, and more countries. Attending these events will let you\
    \ acquire skills not only with NetBeans but for general programming, too.\n\n\
    You can download the latest version of NetBeans IDE at the [NetBeans website](https://netbeans.org/downloads/index.html)\uFEFF\
    \n\n![netbeans logo](images/netbeans-logo.png)\n\n![](images/avatars/default.jpg)\
    \ Nebrass Lamouchi\n\n# PAIRING APACHE SHIRO WITH JAVA EE 7\n\nThe remainder of\
    \ this book is a tutorial presented in steps designed to let you easily follow\
    \ along.\n\nFirst, install the tutorial tool set so that you can follow the screenshots:\n\
    \n* [JDK 8](http://www.oracle.com/technetwork/java/javase/downloads/jdk8-downloads-2133151.html)\uFEFF\
    \n* [Maven 3](https://maven.apache.org/download.cgi)\uFEFF\n* a relational database\
    \ such as [MySQL](https://www.mysql.com/)\uFEFF\n* [PostgreSQL](https://www.postgresql.org/)\uFEFF\
    \ (recommended)\n* [Payara Server](https://www.payara.fish/)\uFEFF (recommended)\n\
    * [WildFly](https://www.wildfly.org/)\uFEFF (recommended)\n* [NetBeans](https://netbeans.org/)\uFEFF\
    \ (recommended)\n\n## Step 1: The project\n\n### Step 1.1: Creating the project\n\
    \nStart the tutorial by creating a new web application.\n\n![nb1](images/nb1.png)\n\
    \nNext, complete the Name.\n\n![nb2](images/nb2.png)\n\nAnd next, fill in the\
    \ server settings.\n\n![nb3](images/nb3.png)\n\nAfter creating the project, go\
    \ to `pom.xml` and edit it.\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"\
    ?>\n<project xmlns=\"http://maven.apache.org/POM/4.0.0\" \n         xmlns:xsi=\"\
    http://www.w3.org/2001/XMLSchema-instance\"\n         xsi:schemaLocation=\"http://maven.apache.org/POM/4.0.0\
    \ http://maven.apache.org/xsd/maven-4.0.0.xsd\">\n    <modelVersion>4.0.0</modelVersion>\n\
    \n    <groupId>com.targa.dev</groupId>\n    <artifactId>ShiroTutorial</artifactId>\n\
    \    <version>1.0-SNAPSHOT</version>\n    <packaging>war</packaging>\n\n    <name>ShiroTutorial</name>\n\
    \n    <properties>\n        <maven.compiler.source>1.8</maven.compiler.source>\n\
    \        <maven.compiler.target>1.8</maven.compiler.target>\n        <failOnMissingWebXml>false</failOnMissingWebXml>\n\
    \    </properties>\n\n    <dependencies>\n        <dependency>\n            <groupId>javax</groupId>\n\
    \            <artifactId>javaee-api</artifactId>\n            <version>7.0</version>\n\
    \            <scope>provided</scope>\n        </dependency>\n    </dependencies>\n\
    \n    <build>\n        <finalName>ShiroTutorial</finalName>\n    </build>\n</project>\n\
    ```\n\n### Step 1.2: Designing the sample application\n\n#### Step 1.2.1: The\
    \ BCE/ECB pattern\n\nWe will be using the entity-control-boundary (ECB) pattern,\
    \ a variation of the ubiquitous model-view-controller (MVC) pattern. When identifying\
    \ the elements for an execution sequence in your system, you can classify each\
    \ participating element into one of three categories: entity, control, or boundary.\n\
    \nAn entity is a long-lived, passive element that is responsible for some meaningful\
    \ chunk of information. This is not to say that entities are \"data\" while other\
    \ design elements are \"function\", just that entities perform behavior that is\
    \ organized around some cohesive sets of data.\n\nA control element manages the\
    \ flow of interaction within a scenario. A control element can manage the end-to-end\
    \ behavior of a scenario or it can manage the interactions between a subset of\
    \ the elements. You should classify as entities those behavior and business rules\
    \ relevant to the scenario that relate to the information; control elements are\
    \ responsible only for the flow of the scenario.\n\nA boundary element lies just\
    \ within the periphery of a system or subsystem. For any scenario being considered\
    \ either across the whole system or within some subsystem, some boundary elements\
    \ will be front-end elements that accept input from outside the area under design\
    \ and other elements will be back end, managing communication to supporting elements\
    \ outside the system or subsystem.\n\nBoundary-control-entity pattern. ![bce structure](images/bce-structure.png)\n"
  raw: "Java Platform Enterprise Edition (Java EE) is the standard in community-driven\
    \ enterprise software. Java EE is ever expanding via the Java Community Process,\
    \ with contributions from industry experts, commercial and open-source organizations,\
    \ Java user groups, and countless individuals. Each release integrates new features\
    \ that align with industry requirements, increases developer productivity, and\
    \ improves application portability.\n\nThe latest version of Java EE is Java EE\
    \ 7, released in June 2013. The Java EE 7 platform added first-class support for\
    \ recent developments in web standards, including WebSockets and JSON, which provide\
    \ the underpinnings for HTML 5 support in Java EE. Java EE 7 also adds a modern\
    \ HTTP client API as defined by JAX-RS 2.0.\n\nThe Java EE 7 specifications include:\n\
    \n*   [Java API for WebSockets — JSR-356](https://www.jcp.org/en/jsr/detail?id=356)\uFEFF\
    \n\n*   [Java API for JSON Processing — JSR-353](https://www.jcp.org/en/jsr/detail?id=353)\uFEFF\
    \n\n*   [Batch Applications for Java Platform — JSR-352](https://www.jcp.org/ja/jsr/detail?id=352)\uFEFF\
    \n\n*   [Concurrency Utilities for Java EE — JSR-236](https://www.jcp.org/ja/jsr/detail?id=236)\uFEFF\
    \n\n*   [Java API for RESTful Web Services — JSR-311](https://www.jcp.org/en/jsr/detail?id=311)\uFEFF\
    \n\n*   [Java Message Service 2.0 — JSR-343](https://www.jcp.org/en/jsr/detail?id=343)\uFEFF\
    \n\n*   [Expression Language 3.0 — JSR-341](https://www.jcp.org/en/jsr/detail?id=341)\uFEFF\
    \n\n*   [Enterprise JavaBeans 3.2 — JSR-345](https://www.jcp.org/en/jsr/detail?id=345)\uFEFF\
    \n\n*   [Java Persistence 2.1 — JSR-338](https://www.jcp.org/en/jsr/detail?id=338)\uFEFF\
    \n\n*   [JavaServer Faces 2.2 — JSR-344](https://www.jcp.org/en/jsr/detail?id=344)\uFEFF\
    \n\nYou can find all necessary information about the Java EE 7 specifications\
    \ on the umbrella [JSR-342](https://jcp.org/en/jsr/detail?id=342)\uFEFF page.\n\
    \n**Java EE 7 specifications.** ![javaee7](images/javaee7.jpg)\n\n## Payara Server\n\
    \nPayara Server is a drop-in replacement for the GlassFish server with guaranteed\
    \ quarterly releases. The Payara team provides enhancements, bug fixes, and patches\
    \ to upstream GlassFish server and dependent libraries. This is what makes Payara\
    \ Server one of the best application servers for production in the Java EE ecosystem.\
    \ The Payara team also provides 24/7 dedicated incident and software support delivered\
    \ by the best middleware engineers in the industry. The team is open to contributions\
    \ and publicly reports its progress in writing features or fixing bugs. There\
    \ also a responsive community that reacts quickly to any request. Payara Server\
    \ tweaks GlassFish but keeps its ease of use and its beautiful administration\
    \ features.\n\nYou can grab the latest version of Payara Server from the [project\
    \ website](http://www.payara.fish/downloads)\uFEFF.\n\n![payara logo](images/payara-logo.jpg)\n\
    \n## NetBeans IDE\n\nNetBeans IDE is the free Java IDE from Oracle, and is designed\
    \ to limit coding errors and optimize productivity without configuration or plugins.\
    \ NetBeans can interact with all of your environment components such as databases,\
    \ automation servers, application servers, quality tools, etc. without requiring\
    \ a lot of your time to prepare the environment.\n\nNetBeans IDE has awesome debugger\
    \ functionalities to optimize the refactoring and debugging processes. It includes\
    \ a powerful text editor with refactoring tools and code completion, snippets\
    \ and analyzers, and even a multilingual spelling checker. NetBeans also offers\
    \ powerful multisystem versioning using out-of-the-box integration with tools\
    \ such as Git, SVN, CVS, and Mercurial. Beyond Java and JavaFX, NetBeans IDE supports\
    \ C/C++, PHP, and HTML5/JavaScript. NetBeans IDE is available for all operating\
    \ systems that support a compatible JVM.\n\nNetBeans organizes many free conferences\
    \ and meetings all over the world, in the US, France, UK, Netherlands, Brazil,\
    \ and more countries. Attending these events will let you acquire skills not only\
    \ with NetBeans but for general programming, too.\n\nYou can download the latest\
    \ version of NetBeans IDE at the [NetBeans website](https://netbeans.org/downloads/index.html)\uFEFF\
    .\n\n![netbeans logo](images/netbeans-logo.png)\n\n![](images/avatars/default.jpg)\
    \ **Nebrass Lamouchi**\n\n# **PAIRING** **APACHE** **SHIRO** **WITH** **JAVA**\
    \ **EE** **7**\n\nThe remainder of this book is a tutorial presented in steps\
    \ designed to let you easily follow along.\n\nFirst, install the tutorial tool\
    \ set so that you can follow the screenshots:\n\n*   [JDK 8](http://www.oracle.com/technetwork/java/javase/downloads/jdk8-downloads-2133151.html)\uFEFF\
    \n\n*   [Maven 3](https://maven.apache.org/download.cgi)\uFEFF\n\n*   a relational\
    \ database such as [MySQL](https://www.mysql.com/)\uFEFF or [PostgreSQL](http://www.postgresql.org/)\uFEFF\
    \ (recommended)\n\n*   [Payara Server](http://www.payara.fish/)\uFEFF (recommended),\
    \ [WildFly](http://wildfly.org/)\uFEFF, or any Java EE 7 server\n\n*   an IDE,\
    \ and I prefer [NetBeans](https://netbeans.org/)\uFEFF\n\n*   lots of hot coffee!\n\
    \nBefore starting the project, configure your system. Install the JDK, database,\
    \ etc., and create and configure the project environment and IDE\n\n## Step 1:\
    \ The project\n\n### Step 1.1: Creating the project\n\nStart the tutorial by creating\
    \ a new Maven project — a web application.\n\n![nb1](images/nb1.png)\n\n* * *\n\
    \nNext, complete the Name and Location pane.\n\n![nb2](images/nb2.png)\n\nAnd\
    \ next, fill in the server and Java EE settings.\n\n![nb3](images/nb3.png)\n\n\
    * * *\n\nAfter creating the project, go to the pom.xml file and edit it.\n\n```\n\
    <?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<project xmlns=\"http://maven.apache.org/POM/4.0.0\"\
    \n         xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\n         xsi:schemaLocation=\"\
    http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd\"\
    >\n\n    <modelVersion>4.0.0</modelVersion>\n\n    <groupId>com.targa.dev</groupId>\n\
    \    <artifactId>ShiroTutorial</artifactId>\n    <version>1.0-SNAPSHOT</version>\n\
    \    <packaging>war</packaging>\n\n    <name>ShiroTutorial</name>\n\n    <properties>\n\
    \        <maven.compiler.source>1.8</maven.compiler.source>\n        <maven.compiler.target>1.8</maven.compiler.target>\n\
    \        <failOnMissingWebXml>false</failOnMissingWebXml>\n    </properties>\n\
    \n    <dependencies>\n        <dependency>\n            <groupId>javax</groupId>\n\
    \            <artifactId>javaee-api</artifactId>\n            <version>7.0</version>\n\
    \            <scope>provided</scope>\n        </dependency>\n    </dependencies>\n\
    \n    <build>\n        <finalName>ShiroTutorial</finalName>\n    </build>\n\n\
    </project>\n```\n\n### Step 1.2: Designing the sample application\n\n#### Step\
    \ 1.2.1: The BCE/ECB pattern\n\nWe will be using the entity-control-boundary (ECB)\
    \ pattern, a variation of the ubiquitous model-view-controller (MVC) pattern.\
    \ When identifying the elements for an execution sequence in your system, you\
    \ can classify each participating element into one of three categories: entity,\
    \ control, or boundary.\n\nAn entity is a long-lived, passive element that is\
    \ responsible for some meaningful chunk of information. This is not to say that\
    \ entities are \"data\" while other design elements are \"function\", just that\
    \ entities perform behavior that is organized around some cohesive sets of data.\n\
    \nA control element manages the flow of interaction within a scenario. A control\
    \ element can manage the end-to-end behavior of a scenario or it can manage the\
    \ interactions between a subset of the elements. You should classify as entities\
    \ those behavior and business rules relevant to the scenario that relate to the\
    \ information; control elements are responsible only for the flow of the scenario.\n\
    \nA boundary element lies just within the periphery of a system or subsystem.\
    \ For any scenario being considered either across the whole system or within some\
    \ subsystem, some boundary elements will be front-end elements that accept input\
    \ from outside the area under design and other elements will be back end, managing\
    \ communication to supporting elements outside the system or subsystem.\n\n**Boundary-control-entity\
    \ pattern.** ![bce structure](images/bce-structure.png)"
