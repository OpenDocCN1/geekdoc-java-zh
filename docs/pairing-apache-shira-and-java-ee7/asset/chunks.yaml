  trans: "\n\n```\n@WebListener\npublic class ShiroListener extends EnvironmentLoaderListener\
    \ {\n    @Inject\n    WebSecurityManager webSecurityManager;\n    @Inject\n  \
    \  FilterChainResolver filterChainResolver;\n\n    @Override\n    protected WebEnvironment\
    \ createEnvironment(ServletContext sc) {\n        DefaultWebEnvironment webEnvironment\
    \ = (DefaultWebEnvironment) super.createEnvironment(sc);\n\n        webEnvironment.setSecurityManager(securityManager);\n\
    \        webEnvironment.setFilterChainResolver(filterChainResolver);\n\n     \
    \   return webEnvironment;\n    }\n\n    @Override\n    public void contextInitialized(ServletContextEvent\
    \ sce) {\n        sce.getServletContext()\n            .setInitParameter(ENVIRONMENT_CLASS_PARAM,\
    \ DefaultWebEnvironment.class.getName());\n        super.contextInitialized(sce);\n\
    \    }\n}\n```\n\n`ShiroListener` 类现在已经准备就绪，是时候定义你的 `ShiroWebEnvironmentConfiguration`\
    \ 类了。\n\n## 步骤 4.2.1: 编写 SecurityManager 生产者\n\nShiro 的 `SecurityManager` 有许多用于调调安全体验的功能和选项。对于基于\
    \ Web 的应用程序，Shiro 提供了一个名为 `DefaultWebSecurityManager` 的默认 `SecurityManager` 实现，它包含许多预配置的选项。这种选择对于新手以及功能性较简单的应用程序来说都特别有用。我建议你从默认实现开始，并根据需要修改每个选项。\n\
    \n以下是 Apache Shiro 框架中最重要的核心元素：\n\n* `SessionManager`\n* `Realm`\n* `Authenticator`\n\
    * `Authorizer`\n* `CacheManager`\n* `SubjectDAO`\n* `CredentialsMatcher`\n\n在进入代码之前，让我们先回顾一下官方\
    \ Shiro Javadoc 中指定的定义：\n\n* `SessionManager` 负责所有应用程序会话的创建、维护和清理。\n* `Realm`\
    \ 是一种安全组件，可以访问特定的应用程序安全实体（如用户、角色和权限），以确定身份验证和授权操作。`Realm` 通常与数据源（如关系型数据库、文件系统或类似的资源）有一一的对应关系。因此，该接口的实现使用特定数据源的\
    \ API 来确定授权数据（角色、权限等），例如 `JDBC`、`File IO`、`Hibernate` 或 `JPA` 或任何其他数据访问 API。`Realm`\
    \ 本质上是一个特定的安全的 DAO。\n* `Authenticator` 负责应用程序中的账户身份验证。它是进入 Shiro API 的主要入口点之一。\n\
    * `Authorizer` 为任何给 `Subject`（即应用程序用户）执行授权（访问控制）操作。每个方法都需要一个主体主体（principal）来为相应的用户执行操作。\n\
    * `CacheManager` 提供并维护缓存实例的生命周期。Shiro 本身没有实现完整的缓存机制，因为这超出了安全框架的核心范畴。相反，该接口在底层缓存框架的主管理器组件（例如\
    \ `JCache`、`Ehcache`、`JCS`、`OSCache`、`JBoss Cache`、`Terracotta`、`Coherence`、`GigaSpaces`\
    \ 等）之上提供了一个抽象 API，允许 Shiro 用户配置选择的任何缓存机制。\n* `SubjectDAO` 是一种数据访问对象的设计规范，允许会话访问企业信息系统（EIS）。它提供了常用的\
    \ CRUD 方法：\n    * create (`org.apache.shiro.session.Session`)\n    * readSession\
    \ (`java.io.Serializable`)\n    * update (`org.apache.shiro.session.Session`)\n\
    \    * delete (`org.apache.shiro.session.Session`)\n* `CredentialsMatcher` 是一个接口，由类实现以判断\
    \ `AuthenticationToken` 提供的凭据与系统中存储的对应账户凭据是否匹配。\n* `PasswordMatcher` 是 `CredentialsMatcher`\
    \ 的实现，它对哈希后的文本密码采用最佳实践比较。\n* `RememberMeManager` 是 Shiro 框架 `SecurityManager`\
    \ 接口的默认具体实现，基于一组 `Realms`。该实现通过父类实现将其身份验证、授权和会话操作分别委托给封装的 `Authenticator`、`Authorizer`\
    \ 和 `SessionManager` 实例。\n\nShiro 的 JavaDoc 有些不足，但希望我们的解释能改善这一点。\n\n对于你的 `SecurityManager`，你将：\n\
    \n* 使用 `DefaultWebSecurityManager` 作为实现。\n* 创建你自定义的 `Realm`（我们稍后会看到原因）。\n* 使用带有自定义\
    \ `PasswordService` 的 `PasswordMatcher` 作为 `CredentialsMatcher`。\n* 使用 `CookieRememberMeManager`\
    \ 作为 `RememberMeManager`，因为你的实现将使用 cookie 来记住和跟踪用户 (`Subjects`）。你将为 `RememberMeManager`\
    \ 添加 `CipherKey` 以改进 cookie 命名。\n* 还有一个大惊喜，你将使用一个缓存管理器，即 `EhCacheManager`！（Shiro\
    \ 承诺在未来的版本中提供对 `Hazelcast` 等缓存提供器的原生支持）。\n\n### 步骤 4.2.1.1: 编写 Realm\n\n要创建 `Realm`，你必须创建一个扩展\
    \ `org.apache.shiro.realm.AuthorizingRealm` 抽象类并实现关键方法：\n\n* `doGetAuthenticationInfo(AuthenticationToken\
    \ token)` 方法是位于存储系统（DB、LDAP 等）中的身份信息（在我们例中为用户名和密码）的“get”。\n* `doGetAuthorizationInfo(PrincipalCollection\
    \ principals)` 方法是授权信息（在我们例中仅为角色，但根据项目选择的授权策略，可以是角色和权限，或仅限权限）的“get”。\n\n由于此项目使用了带有\
    \ Shiro 框架的 Java EE 特性，你将使用 EJB 处理数据。因此我们将使用注入（或尝试）来调用 EJB。注意，Shiro 组件并不是 CDI\
    \ 感知的，因为某些方法是 final 的。\n\nStack Overflow 上有一些说明该问题的帖子：\n\n* [`stackoverflow.com/questions/15605038`](http://stackoverflow.com/questions/15605038)\n\
    * [`stackoverflow.com/questions/18507629`](http://stackoverflow.com/questions/18507629)\n\
    \n但不用担心——有一些技巧可以让它工作！注入我们的 EJB 至少有两种方法：`UserService` 和 `RoleService`。\n\n``````\n\
    public class ShiroConfiguration {\n    @Inject\n    UserService userService;\n\
    \n    @Produces\n    public WebSecurityManager getSecurityManager() {\n      \
    \  DefaultWebSecurityManager securityManager = null;\n        if (securityManager\
    \ == null) {\n            AuthorizingRealm realm = new SecurityRealm(userService);\n\
    \            …\n            securityManager = new DefaultWebSecurityManager(realm);\n\
    \        }\n        return securityManager;\n    }\n}\n```\n\n列表 5。方法 1) 将 EJB\
    \ 注入到 `ShiroConfiguration` 类并将其传递给 `Realm` 的构造函数。\n\n遗憾的是，这种策略违反了正确的关注点分离，因此让我们看看另一种方法。\n\
    \n**方法 2) 在 `Realm` 中使用经典的 JNDI 查找来获取对 EJB 的访问：** Java EE 6 规范为 EJB JNDI 查找名称提供了通用格式：`java:global[/appName]/moduleName/beanName`。\n\
    \n"
- fmt: "\nThe `appName`-component of the lookup name is shown as optional because\
    \ it does not apply to beans deployed in standalone modules. Only beans packaged\
    \ in `.ear` files contain the `appName` component in the `java:global` lookup\
    \ name. As your application is packaged as a WAR, you will not have the `appName`\
    \ value in the JNDI names of your EJB. Your `moduleName` is `\"ShiroTutorial\"\
    ` (see the `pom.xml`).\n\nSo, your EJB’s JNDI names are:\n\n```\njava:global/ShiroTutorial/UserService\n\
    java:global/ShiroTutorial/RoleService\n```\n\n***\n\nNow, you can write your `SecurityRealm`\
    \ as:\n\n```java\npublic class SecurityRealm extends AuthorizingRealm {\n    private\
    \ Logger logger;\n    private UserService userService;\n\n    public SecurityRealm()\
    \ {\n        super();\n        this.logger = Logger.getLogger(SecurityRealm.class.getName());\n\
    \n        try {\n            InitialContext ctx = new InitialContext();\n    \
    \        this.userService = (UserService) ctx.lookup(\"java:global/ShiroTutorial/UserService\"\
    );\n        } catch (NamingException ex) {\n            logger\n             \
    \   .warning(\"Cannot do the JNDI Lookup to instantiate the User service : \"\
    \ + ex);\n        }\n    }\n}\n```\n\nThe specification has fixed predefined JNDI\
    \ names for the `appName` and the `moduleName`, so you can grab them dynamically.\n\
    \n```\njava:app/AppName\njava:module/ModuleName\n```\n\nUsing that, you can write\
    \ your JNDI lookup code as:\n\n```java\ntry {\n    InitialContext ctx = new InitialContext();\n\
    \    String moduleName = (String) ctx.lookup(\"java:module/ModuleName\");\n  \
    \  this.userService = (UserService) ctx.lookup(String.format(\"java:global/%s/UserService\"\
    , moduleName));\n} catch (NamingException ex) {\n    logger\n        .warning(\"\
    Cannot do the JNDI Lookup to instantiate the User service : \" + ex);\n}\n```\n\
    \n***\n\nNow, use your EJB in the `doGetAuthenticationInfo()` and `doGetAuthorizationInfo()`\
    \ methods.\n\n```java\n@Override\nprotected AuthenticationInfo doGetAuthenticationInfo(AuthenticationToken\
    \ token) throws AuthenticationException {\n    // Identify account to log to\n\
    \    UsernamePasswordToken userPassToken = (UsernamePasswordToken) token;\n  \
    \  String username = userPassToken.getUsername();\n    if (username == null) {\n\
    \        logger.warning(\"Username is null.\");\n        return null;\n    }\n\
    \n    // Read the user from DB\n    User user = this.userService.findByUsername(username);\n\
    \    if (user == null) {\n        logger.warning(\"No account found for user [\"\
    \ + username + \"]\");\n        throw new IncorrectCredentialsException();\n \
    \   }\n\n    return new SimpleAuthenticationInfo(username, user.getPassword(),\
    \ getName());\n}\n\n@Override\nprotected AuthorizationInfo doGetAuthorizationInfo(PrincipalCollection\
    \ principals) {\n    //null usernames are invalid\n    if (principals == null)\
    \ {\n        throw new AuthorizationException(\"PrincipalCollection method argument\
    \ cannot be null.\");\n    }\n\n    String username = (String) getAvailablePrincipal(principals);\n\
    \    Set<String> roleNames = new HashSet<>();\n    roleNames.add(this.userService.findByUsername(username).getRole().getName());\n\
    \    AuthorizationInfo info = new SimpleAuthorizationInfo(roleNames);\n\n    /**\n\
    \    * If you want to do Permission Based authorization, you can grab the Permissions\
    \ List associated to your user:\n    * Set<String> permissions = new HashSet<>();\n\
    \    * permissions.add(this.userService.findByUsername(username).getRole().getPermissions());\n\
    \    * ((SimpleAuthorizationInfo)info).setStringPermissions(permissions);\n  \
    \  */\n    return info;\n}\n```\n\nThe code is straightforward and the components\
    \ names tell the whole story.\n\n### Step 4.2.1.2: Writing the CredentialsMatcher\n\
    \n`CredentialsMatcher` is the component that validates credentials and checks\
    \ if access can be granted. The `CredentialsMatcher` interface has many implementations:\n\
    \n* `AllowAllCredentialsMatcher`\n* `HashedCredentialsMatcher`\n* `Md2CredentialsMatcher`\n\
    * `Md5CredentialsMatcher`\n* `PasswordMatcher`\n* `Sha1CredentialsMatcher`\n*\
    \ `Sha256CredentialsMatcher`\n* `Sha384CredentialsMatcher`\n* `Sha512CredentialsMatcher`\n\
    * `SimpleCredentialsMatcher`\n\nEach implementation of `CredentialsMatcher` has\
    \ specific properties and functionality. For example, `SimpleCredentialsMatcher`\
    \ is used for direct, plain comparison. `PasswordMatcher` uses an internal `PasswordService`\
    \ to compare the passwords. The Shiro JavaDoc describes the `PasswordMatcher`\
    \ as \"a `CredentialsMatcher` that employs best-practices comparisons for hashed\
    \ text passwords.\"\n\nChoose `PasswordMatcher` as the implementation of `CredentialsMatcher`\
    \ so that you can define a customized `PasswordService` for password verification.\n\
    \nLet’s talk a little bit about about the password itself. We have to choose a\
    \ hash algorithm for storing and comparing passwords. After some research, I chose\
    \ `bcrypt` as a hash algorithm. Based on the Blowfish symmetric-key block-cipher\
    \ cryptographic algorithm, `bcrypt` is an adaptive hash function that introduces\
    \ a work factor (also known as security factor) that allows you to determine the\
    \ cost of the hash function.\n\nLet’s use the `jBCrypt` implementation of `bcrypt`,\
    \ and you must add that dependency to the `pom.xml` file.\n\n```xml\n<dependency>\n\
    \    <groupId>de.svenkubiak</groupId>\n    <artifactId>jBCrypt</artifactId>\n\
    </dependency>\n```\n\n***\n\nNext, write your customized `PasswordService` class.\
    \ Call the class `BCryptPasswordService` and implement the `PasswordService` interface\
    \ and its two methods, `encryptPassword()` and `passwordsMatch()`.\n\n```java\n\
    public class BCryptPasswordService implements PasswordService {\n    public static\
    \ final int DEFAULT_BCRYPT_ROUND = 10;\n    private int logounds;\n\n    public\
    \ BCryptPasswordService() {\n        this.logounds = DEFAULT_BCRYPT_ROUND;\n \
    \   }\n\n    public BCryptPasswordService(int logounds) {\n        this.logounds\
    \ = logounds;\n    }\n\n    @Override\n    public String encryptPassword(Object\
    \ plaintextPassword) {\n        if (plaintextPassword instanceof String) {\n \
    \           String password = (String) plaintextPassword;\n            return\
    \ BCrypt.hashpw(password, BCrypt.gensalt(logounds));\n        }\n        throw\
    \ new IllegalArgumentException(\n                \"BCryptPasswordService encryptPassword\
    \ only support java.lang.String.\");\n    }\n\n    @Override\n    public boolean\
    \ passwordsMatch(Object submittedPlaintext, String encrypted) {\n        if (submittedPlaintext\
    \ instanceof char[]) {\n            String password = String.valueOf((char[])\
    \ submittedPlaintext);\n            return BCrypt.checkpw(password, encrypted);\n\
    \        }\n        throw new IllegalArgumentException(\n                \"BCryptPasswordService\
    \ passwordsMatch only support char[].\");\n    }\n\n    public void setLogRounds(int\
    \ logounds) {\n        this.logounds = logounds;\n    }\n\n    public int getLogRounds()\
    \ {\n        return logounds;\n    }\n}\n```\n\n***\n\nThis class will be used\
    \ in the `CredentialsMatcher` by its `passwordMatch()` method. But it can also\
    \ be used in the registration process of a new user, before invoking the `UserService`'s\
    \ save method.\n\nSo, update your `ShiroConfiguration` class.\n\n```java\npublic\
    \ class ShiroConfiguration {\n    @Inject\n    UserService userService;\n\n  \
    \  @Produces\n    public WebSecurityManager getSecurityManager() {\n        DefaultWebSecurityManager\
    \ securityManager = null;\n        if (securityManager == null) {\n          \
    \  AuthorizingRealm realm = new SecurityRealm(userService);\n            CredentialsMatcher\
    \ credentialsMatcher = new PasswordMatcher();\n            ((PasswordMatcher)\
    \ credentialsMatcher).setPasswordService(new BCryptPasswordService());\n     \
    \       realm.setCredentialsMatcher(credentialsMatcher);\n            …\n    \
    \        securityManager = new DefaultWebSecurityManager(realm);\n        }\n\
    \        return securityManager;\n    }\n}\n```\n\n##### Step 4.2.1.3: Writing\
    \ the RememberMeManager\n"
