  trans: "\n\n### 步骤 1.2.2: BCE 实现\n\n创建一些空的 Java 包，仅用于突出应用程序中 BCE 模式的实现。这些包将采用以下格式：\n\
    \n**BCE 模式包结构。** ![bce package structure](img/bce-package-structure.png)\n\n我们将身份验证和授权需求的功能层命名为\
    \ \"security\"。输出如下：\n\n![nb4](img/nb4.png)\n\n![nb5](img/nb5.png)\n\n现在开始创建你的实体。\n\
    \n## 步骤 2: JPA 实体\n\n使用 `JPA` 2.1 构建持久化实体。在 `com.targa.dev.shirotutorial.security.entity`\
    \ 包中创建两个实体。\n\n对于我们的 Auth² 实现，将有两个实体：\n\n`User`，引用应用程序的客户端；`Role`，引用用户的授权级别。\n\
    \n**`User` 和 `Role` 实体的类图。** ![bce user role](img/bce-user-role.png)\n\n你可以通过添加一个\
    \ `Permission` 实体来扩展“角色与权限”策略（基于权限的授权），该实体包含赋予关联 `Role` 的权限——例如，“只读”或“控制”。生成的类图如下：\n\
    \n**`Role` 和 `Permission` 实体的类图。** ![bce role permission](img/bce-role-permission.png)\n\
    \n```\n@Entity ①\n@NamedQueries({ ②\n    @NamedQuery(name = \"User.findAll\",\
    \ query = \"select u from User u\"),\n    @NamedQuery(name = \"User.findByUsername\"\
    , query = \"SELECT u FROM User u WHERE u.username = :username\") ③\n})\npublic\
    \ class User {\n    private static final long serialVersionUID = 1L;\n    @Id\
    \ ④\n    @GeneratedValue ⑤\n    @Column(name = \"id\", nullable = false, updatable\
    \ = false) ⑥\n    private long id;\n    @NotNull ⑦\n    @Column(name = \"username\"\
    , length = 50, nullable = false)\n    private String username;\n    @NotNull\n\
    \    @Column(name = \"password\", nullable = false)\n    private String password;\n\
    \    @OneToOne(cascade = CascadeType.PERSIST) ⑧\n    private Role role;\n    @Column(name\
    \ = \"enabled\", nullable = false)\n    private Boolean enabled;\n    @Version\
    \ ⑨\n    @Column(name = \"version\", nullable = false)\n    private Timestamp\
    \ version; ⑩\n\n//Getters & setters\n}\n```\n\n列表 1. User:\n\n1. ① 将带注解的类声明为 JPA\
    \ 实体。\n2. ② 声明 `NamedQuery` 元素列表。\n3. ③ 最小的 `NamedQuery` 声明 = 查询名称 + JPQL 查询。\n\
    4. ④ 将属性定义为实体的 `id` 字段。\n5. ⑤ 用在实体的 `id` 字段上，以指定 `id` 生成策略。\n6. ⑥ 规定对应表列的定义。\n\
    7. ⑦ 为相应的字段值定义验证约束 → username 不为空。\n8. ⑧ 定义实体之间的关系。\n9. ⑨ 指定实体类中的版本字段，作为其乐观锁值。该版本号用于在执行合并（merge）操作时确保完整性，并用于乐观并发控制。\n\
    10. ⑩ `Timestamp` 是版本属性的类型。\n\n```\n@Entity\n@NamedQueries({\n    @NamedQuery(name\
    \ = \"Role.findAll\", query = \"SELECT r FROM Role r\")\n})\npublic class Role\
    \ {\n    private static final long serialVersionUID = 1L;\n    @Id\n    @GeneratedValue\n\
    \    @Column(name = \"id\", nullable = false, updatable = false)\n    private\
    \ long id;\n    @NotNull\n    @Column(name = \"name\", length = 50, nullable =\
    \ false)\n    private String name;\n    @NotNull\n    @Past ①\n    @Column(name\
    \ = \"creation\", nullable = false, updatable = false)\n    @Temporal(TemporalType.TIMESTAMP)\
    \ ②\n    private Date creation;\n    @Column(name = \"enabled\", nullable = false)\n\
    \    private Boolean enabled;\n\n//Getters & setters\n}\n```\n\n列表 2. Role:\n\n\
    1. ① 创建日期必须发生在过去。\n2. ② 表明这是一个日期或时间列。\n\n接下来，为每个实体创建一个服务。你的服务将创建在 `com.targa.dev.shirotutorial.security.control`\
    \ 包中。`EntityManager` 是一个封装了处理实体所需的 CRUD 操作的对象：\n\n* 保存/编辑\n* 删除\n* 查找\n\n```\n\
    @Stateless\npublic class UserService {\n    @PersistenceContext\n    EntityManager\
    \ em;\n\n    public User save(User entity) {\n        return this.em.merge(entity);\n\
    \    }\n\n    public void delete(long id) {\n        try {\n            User reference\
    \ = this.em.getReference(User.class, id);\n            this.em.remove(reference);\n\
    \        } catch (EntityNotFoundException e) {\n            //它已经不存在\n       \
    \ }\n    }\n\n    public User findById(long id) {\n        return this.em.find(User.class,\
    \ id);\n    }\n\n    public List<User> findAll() {\n        return this.em.createNamedQuery(\"\
    User.findAll\", User.class)\n                .getResultList();\n    }\n}\n```\n\
    列表 3. UserService:\n\n```java\n@Stateless\npublic class RoleService {\n    @PersistenceContext\n\
    \    EntityManager em;\n\n    public Role save(Role entity) {\n        return\
    \ this.em.merge(entity);\n    }\n\n    public void delete(long id) {\n       \
    \ try {\n            Role reference = this.em.getReference(Role.class, id);\n\
    \            this.em.remove(reference);\n        } catch (EntityNotFoundException\
    \ e) {\n            //它不存在\n        }\n    }\n\n    public Role findById(long\
    \ id) {\n        return this.em.find(Role.class, id);\n    }\n\n    public List<Role>\
    \ findAll() {\n        return this.em.createNamedQuery(\"Role.findAll\", Role.class)\n\
    \                .getResultList();\n    }\n}\n```\n列表 4. RoleService:\n\n你的服务现在可以使用了。为了实现更灵活的依赖注入（CDI），创建一个\
    \ `beans.xml` 文件，并将 `bean-discovery-mode` 从 `annotated` 改为 `all`。\n\n```\n<?xml\
    \ version=\"1.0\" encoding=\"UTF-8\"?>\n<beans xmlns=\"http://xmlns.jcp.org/xml/javaee\"\
    \n    xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\n    xsi:schemaLocation=\"\
    http://xmlns.jcp.org/xml/javaee\n                      http://xmlns.jcp.org/xml/javaee/beans_1_1.xsd\"\
    \n    bean-discovery-mode=\"all\">\n\n</beans>\n```\n\n## 步骤 3: Apache Shiro \n\
    \n首先，在你的项目中添加 Apache Shiro 依赖：\n\n```xml\n<dependency>\n    <groupId>org.apache.shiro</groupId>\n\
    \    <artifactId>shiro-web</artifactId>\n    <version>1.2.4</version>\n</dependency>\n\
    ```\n\nApache Shiro 使用 INI 配置文件来定义参数。这是一个 `shiro.ini` 文件的示例：\n\n```ini\n[main]\n\
    authc.loginUrl = /login.jsp ①\nauthc.successUrl = /home.jsp\n\npasswordMatcher\
    \ = org.apache.shiro.authc.credential.HashedCredentialsMatcher ②\npasswordService\
    \ = org.apache.shiro.authc.credential.DefaultPasswordService\npasswordMatcher.passwordService\
    \ = $passwordService\n\nds = com.jolbox.bonecp.BoneCPDataSource ③\nds.driverClass=com.mysql.jdbc.Driver\n\
    ds.jdbcUrl=jdbc:mysql://localhost:3306/simple_shiro_web_app\nds.username = root\n\
    ds.password = 123qwe\n\njdbcRealm = org.apache.shiro.realm.jdbc.JdbcRealm ④\n\
    jdbcRealm.permissionsLookupEnabled = true\njdbcRealm.authenticationQuery = SELECT\
    \ password FROM USERS WHERE username = ?\njdbcRealm.userRolesQuery = SELECT role_name\
    \ FROM USERS_ROLES WHERE username = ?\njdbcRealm.permissionsQuery = SELECT permission_name\
    \ FROM ROLES_PERMISSIONS WHERE role_name = ?\njdbcRealm.credentialsMatcher = $passwordMatcher\n\
    jdbcRealm.dataSource=$ds\n\nsecurityManager.realms = $jdbcRealm ⑤\n\n[urls] ⑥\n\
    # /login.jsp 不限制为已验证的用户（否则没人能登录！），\n# 但必须为其指定 'authc' 过滤器以便处理该 URL 的登录提交。\n# 它足够智能，可以允许上述\
    \ shiro.loginUrl 指定的请求通过。\n/login.jsp = authc\n/home.jsp = anon, authc\n/logout\
    \ = logout\n/account/** = authc\n```\n\n1. ① **authc** 登录过滤器的配置](http://shiro.apache.org/static/current/apidocs/org/apache/shiro/web/filter/authc/FormAuthenticationFilter.html)\uFEFF\
    。\n2. ② 哈希密码匹配器。\n3. ③ 数据源。\n4. ④ JDBC  Realm。\n5. ⑤ 安全管理器的领域（realms）。\n6. ⑥ URL\
    \ 映射。\n\n"
- fmt: "\n2. ② Configuration for the [`passwordMatcher`](http://shiro.apache.org/static/current/apidocs/org/apache/shiro/authc/credential/PasswordMatcher.html)\
    \ and [`passwordService`](http://shiro.apache.org/static/current/apidocs/org/apache/shiro/authc/credential/PasswordService.html),\
    \ which are components for password verification and matching.\n\n3. ③ The definition\
    \ of the `Datasource` in this example is a JDBC `DataSource`.\n\n4. ④ Configuration\
    \ for the `Realm` in this example is a JDBC `Realm`.\n\n5. ⑤ This assigns the\
    \ configured `Realm` to the Siro `SecurityManager`.\n\n6. ⑥ This assigns URL patterns\
    \ to the appropriate filters.\n\nThis `shiro.ini` file has to be placed in `src/main/webapp/WEB-INF`\
    \ or `src/main/resources`. To enable the Shiro framework, you have to configure\
    \ your `web.xml` file.\n\n```xml\n<listener>\n    <listener-class>\n        org.apache.shiro.web.env.EnvironmentLoaderListener\n\
    \    </listener-class>\n</listener>\n\n<filter>\n    <filter-name>ShiroFilter</filter-name>\n\
    \    <filter-class>org.apache.shiro.web.servlet.ShiroFilter</filter-class>\n</filter>\n\
    \n<filter-mapping>\n    <filter-name>ShiroFilter</filter-name>\n    <url-pattern>/*</url-pattern>\n\
    \    <dispatcher>REQUEST</dispatcher>\n    <dispatcher>FORWARD</dispatcher>\n\
    \    <dispatcher>INCLUDE</dispatcher>\n    <dispatcher>ERROR</dispatcher>\n</filter-mapping>\n\
    ```\n\nI hear your protests! These configuration files totally conflict with the\
    \ Java EE \"convention over configuration\" approach!\n\nIn every new Java EE\
    \ release, you should strive to minimize configuration files. One focus of this\
    \ tutorial will be to build our Shiro framework application without messy configuration\
    \ files. You can try to circumvent the problem with some innovative solutions.\
    \ For example, you can use the Servlet 3.0 features instead of the `web.xml` file\
    \ to define the filter in the code:\n\n- You can increase pluggability with methods\
    \ to add servlets, filters, web fragments, etc.\n- You can improve ease of development\
    \ with annotations for servlets, servlet filters, and servlet-context listeners.\n\
    \n## Step 4: Shiro: Getting serious\n\n### Step 4.1: Eliminating the web.xml configuration\n\
    \n#### Step 4.1.1: From the filter to the @WebFilter\n\nA filter is an object\
    \ that can transform the header and content (or both) of a request or response.\
    \ Filters differ from web components in that filters usually do not themselves\
    \ create a response. Instead, a filter provides functionality that can be attached\
    \ to any kind of web resource. Consequently, a filter should not have any dependencies\
    \ on a web resource for which it is acting as a filter; this way, it can be composed\
    \ with more than one type of web resource.\n\nThe main tasks that a filter can\
    \ perform are:\n\n- Query the request and act accordingly.\n- Block the request-and-response\
    \ pair from passing any further.\n- Modify the request headers and data. You do\
    \ this by providing a customized version of the request.\n- Modify the response\
    \ headers and data. You do this by providing a customized version of the response.\n\
    - Interact with external resources.\n\nThe Shiro filter is the primary filter\
    \ for web applications implementing the Shiro framework.\n\nTo do so, introduce\
    \ the class `ShiroFilterActivator` that extends `org.apache.shiro.web.servlet.ShiroFilter`,\
    \ and apply the filter to all requests (\"/*\").\n\n```java\n@WebFilter(\"/*\"\
    )\npublic class ShiroFilterActivator extends ShiroFilter {\n    private ShiroFilterActivator()\
    \ {\n    }\n}\n```\n\n#### Step 4.1.2: The listener to the @WebListener\n\nCreate\
    \ a `ShiroListener` class that extends `org.apache.shiro.web.env.EnvironmentLoaderListener`.\
    \ In the `contextInitialized()` method, initialize `ENVIRONMENT_CLASS_PARAM` (`shiroEnvironmentClass`)\
    \ with the `DefaultWebEnvironment` class’s name. It is used to define the `WebEnvironment`\
    \ implementation class to use in the servlet context.\n\n```java\n@WebListener\n\
    public class ShiroListener extends EnvironmentLoaderListener {\n    @Override\n\
    \    public void contextInitialized(ServletContextEvent sce) {\n        sce.getServletContext()\n\
    \           .setInitParameter(ENVIRONMENT_CLASS_PARAM, DefaultWebEnvironment.class.getName());\n\
    \        super.contextInitialized(sce);\n    }\n}\n```\n\n***\n\n### Step 4.2:\
    \ Eliminating the INI configuration file\n\nTo eliminate the use of the INI configuration\
    \ file, use the `createEnvironment(ServletContext sc)` method to define the `WebEnvironment`.\n\
    \n```java\n@Override\nprotected WebEnvironment createEnvironment(ServletContext\
    \ sc) {\n    DefaultWebEnvironment webEnvironment = (DefaultWebEnvironment) super.createEnvironment(sc);\n\
    \    ...\n    return webEnvironment;\n}\n```\n\nWithin the `WebEnvironment` component,\
    \ you must define two parameters: the `FilterChainResolver` and the `SecurityManager`.\
    \ But before defining the `FilterChainResolver`, you first must understand the\
    \ concept of a `FilterChain`.\n\nTo paraphrase the Java EE 5 JavaDoc, the servlet\
    \ container provides the `FilterChain` object to allow the developer to view the\
    \ invocation chain of a filtered request for a resource. Filters use the `FilterChain`\
    \ to invoke the next filter in the chain or, if the calling filter is the last\
    \ filter in the chain, to invoke the resource at the end of the chain.\n\nThe\
    \ official Shiro JavaDoc defines some `WebEnvironment` components. It states that\
    \ a `FilterChainResolver` can resolve an appropriate `FilterChain` to execute\
    \ during a `ServletRequest`. It allows resolution of arbitrary filter chains which\
    \ can be executed for any given request or URI/URL.\n\nThis mechanism allows for\
    \ more flexible `FilterChain` resolution than normal `web.xml` servlet filter\
    \ definitions. It allows you to define arbitrary filter chains per URL in a more\
    \ concise and easy-to-read manner, and even allows filter chains to be dynamically\
    \ resolved or constructed at run time if the underlying implementation supports\
    \ it.\n\nThe `SecurityManager` executes all security operations for all `Subjects`\
    \ (i.e. users) across a single application. The interface itself primarily exists\
    \ as a convenience — extends the `Authenticator`, `Authorizer`, and `SessionManager`\
    \ interfaces, thereby consolidating these behaviors into a single point of reference.\
    \ In most cases, this simplifies configuration by allowing developers to interact\
    \ with a single `SecurityManager` instead of having to reference `Authenticator`,\
    \ `Authorizer`, and `SessionManager` instances separately.\n\nObviously, you have\
    \ to create these components: `FilterChainResolver` & `SecurityManager`.\n\n***\n\
    \nStart by creating a new class to hold the configuration for your `ShiroConfiguration`\
    \ class. The class will have two public getters.\n\n```java\npublic class ShiroConfiguration\
    \ {\n    private ShiroConfiguration() {\n    }\n\n    public WebSecurityManager\
    \ getSecurityManager() {\n    }\n\n    public FilterChainResolver getFilterChainResolver()\
    \ {\n    }\n}\n```\n\nBut this solution is still incomplete; you want to use dependency\
    \ injection to set the `FilterChainResolver` and the `SecurityManager` instances.\
    \ To enable injection for the two configuration components, bind the instance\
    \ to your session by annotating the two getter methods with the `@Produces` annotation.\n\
    \n```java\npublic class ShiroConfiguration {\n    private ShiroConfiguration()\
    \ {\n    }\n\n    @Produces\n    public WebSecurityManager getSecurityManager()\
    \ {\n    }\n\n    @Produces\n    public FilterChainResolver getFilterChainResolver()\
    \ {\n    }\n}\n```\n\n***\n\nYou can create a more elegant `ShiroListener` that\
    \ sports `@Inject` for both parameters.\n"
