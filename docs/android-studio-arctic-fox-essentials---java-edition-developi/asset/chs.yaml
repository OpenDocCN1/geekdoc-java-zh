  \n![](img/4.1_toolbar_fragment.jpg)\n\n## 1.4 将片段迁移到视图绑定\n\n与 `Empty Activity` 模板一样，当向项目中添加新片段时，Android\
  \ Studio 不会启用视图绑定支持。因此，在移动到教程的下一步之前，我们需要执行此迁移。从编辑 `ToolbarFragment.java` 开始，并如下所示导入片段的绑定：\n\
  \n```java\nimport com.ebookfrenzy.fragmentexample.databinding.FragmentToolbarBinding;\n\
  ```\n\n接下来，找到 `onCreateView()` 方法并进行以下声明和更改（包括添加 `onDestroyView()` 方法以确保在片段销毁时移除绑定引用）：\n\
  \n```java\nprivate FragmentToolbarBinding binding;\n\n@Override\npublic View onCreateView(LayoutInflater\
  \ inflater, ViewGroup container, Bundle savedInstanceState) {\n    // Inflate 此片段的布局\n\
  \    return inflater.inflate(R.layout.fragment_toolbar, container, false);\n   \
  \ binding = FragmentToolbarBinding.inflate(inflater, container, false);\n    return\
  \ binding.getRoot();\n}\n\n@Override\npublic void onDestroyView() {\n    super.onDestroyView();\n\
  \    binding = null;\n}\n```\n\n一旦完成这些更改，片段就可以使用视图绑定。\n\n## 1.5 添加第二个片段\n\n重复创建工具栏片段的步骤，添加另一个名为\
  \ `TextFragment` 的空片段，布局文件命名为 `fragment_text`。再次将 `FrameLayout` 容器转换为 `ConstraintLayout`（将\
