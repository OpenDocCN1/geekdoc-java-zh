  \ `TableRow` 实例。随时可以通过调色板拖动 `TableRow` 对象并将其置于 `Component Tree` 工具窗口中的 `TableLayout`\
  \ 条目上，以添加额外的行。\n\n选中 `TableLayout` 后，使用 `Attributes` 工具窗口将 `layout_height` 属性更改为\
