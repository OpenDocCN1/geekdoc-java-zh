  \ Android 6 引入之前，权限总是在应用安装到设备时请求的。例如，图 73-1 显示了在通过 Google Play 安装应用时请求各种权限的典型界面。\n\
  \n![](img/Image24255.jpg)\n\n图 73-1\n\n对于许多类型的权限，这种场景对于运行在 Android 6.0 或更高版本的应用仍然适用。这些权限被称为**普通权限**（normal\
  \ permissions），它们仍然要求在安装点时由用户接受。第二类权限被称为**危险权限**（dangerous permissions），必须像普通权限一样在清单文件（manifest）中声明，但必须在应用程序首次启动时向用户请求。当发出此类请求时，它将以对话框的形式出现，如图图\
  \ 73-2 所示：\n\n![](img/Image24344.jpg)\n\n图 73-2\n\n属于危险类的权限完整列表包含在表 73-1 中：\n\n\
