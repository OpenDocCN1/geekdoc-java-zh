  \ |\n| 传感器 | BODY_SENSORS |\n| 短 | SEND_SMS,RECEIVE_SMS,READ_SMS,RECEIVE_WAP_PUSH,RECEIVE_MMS\
  \ |\n| 存储 | READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE |\n\n表 73-1\n\n## 73.2\
  \ 创建示例项目\n\n从欢迎屏幕选择 `New Project` ，在生成的新项目对话框中，点击 `Next` 按钮之前选择 `Empty Activity`\
  \ 模板。\n\n在 `Name` 字段中输入 `PermissionDemo`，并指定 `com.ebookfrenzy.permissiondemo` 为包名。在点击\
  \ `Finish` 按钮之前，将 `Minimum API level` 设置更改为 `API 26: Android 8.0 (Oreo)`，并将 `Language`\
  \ 菜单设置为 `Java`。\n\n## 73.3 检查权限\n\nAndroid Support Library 包含许多方法，可以在 Android 应用的代码中请求和管理危险权限。无论应用运行的\
  \ Android 版本如何，都可以安全地进行这些 API 调用，但只有在 Android 6.0 或更高版本上执行时，才会执行有意义的任务。\n\n在应用尝试使用需要危险权限批准的功能之前，无论之前是否授予过权限，代码都必须检查该权限是否已授予。可以通过调用\
  \ `Compat` 类的 `checkSelfPermission()` 方法来实现，并将当前 Activity 的引用和正在请求的权限作为参数传递。该方法将检查权限是否已授予，并返回与\
  \ `PackageManager.PERMISSION_GRANTED` 或 `PackageManager.PERMISSION_DENIED` 匹配的整数值。\n\
  \n在示例项目的 `MainActivity.java` 文件中，修改代码以检查应用是否已获得录音的权限：\n\n```java\npackage com.ebookfrenzy.permissiondemoactivity;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\nimport androidx.core.content.ContextCompat;\n\
  import android.os.Bundle;\nimport android.Manifest;\nimport android.content.pm.PackageManager;\n\
  import android.util.Log;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private static final String TAG = \"PermissionDemo\";\n\n    @Override\n\
  \    protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.activity_permission_demo);\n        setupPermissions();\n\
  \    }\n\n    private void setupPermissions() {\n        int permission = ContextCompat.checkSelfPermission(this,\n\
  \                Manifest.permission.RECORD_AUDIO);\n\n        if (permission !=\
  \ PackageManager.PERMISSION_GRANTED) {\n            Log.i(TAG, \"Permission to record\
  \ denied\");\n        }\n    }\n}\n```\n\n在运行 Android 6.0 之前的版本的设备或模拟器上运行应用，并检查\
  \ Android Studio 中的 `Logcat` 输出。应用启动后，`Logcat` 输出应包含“Permission to record denied”消息。\n\
  \n编辑 `AndroidManifest.xml` 文件（位于 Project 工具窗口的 `app -> manifests` 下），并添加一行以请求录音权限，如下：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    package=\"com.ebookfrenzy.permission_activity\"\
  >\n    <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />\n  \
  \  <application\n        android:allowBackup=\"true\"\n        android:icon=\"@mipmap/ic_launcher\"\
  \n        android:label=\"@string/app_name\"\n        android:supportsRtl=\"true\"\
  \n        android:theme=\"@style/AppTheme\">\n        <activity android:name=\"\
  .MainActivity\">\n            <intent-filter>\n                <action android:name=\"\
  android.intent.action.MAIN\" />\n                <category android:name=\"android.intent.category.LAUNCH\"\
  \ />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest\n\
  ```\n\n编译并运行应用一次，注意这次没有出现权限拒绝。显然，在旧版本 Android 上请求此权限的所有工作已经完成。在运行 Android 6.0 或更高版本的设备或模拟器上运行应用，注意即使权限已添加到清单文件中，检查仍然报告权限被拒绝。这是因为\
  \ Android 6 及更高版本要求应用在运行时请求危险权限。\n\n## 73.4 在运行时请求权限\n\n权限请求通过调用 `ActivityCompat`\
  \ 类的 `requestPermissions()` 方法发出。当调用此方法时，权限请求将被异步处理，并在任务完成后调用名为 `onRequestPermissionsResult()`\
  \ 方法。`requestPermissions()` 方法的参数接收当前 Activity 的引用、正在请求的权限标识符以及请求代码。请求代码可以是任意整数，并将用于识别哪个请求触发了\
  \ `onRequestPermissionsResult()` 方法。修改 `MainActivity.java` 文件以请求代码，并在权限检查失败时请求录音权限：\n\
  \n```java\nimport androidx.core.app.ActivityCompat;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private static final String TAG = \"PermissionDemo\"\
  ;\n    private static final int RECORD_REQUEST_CODE = 101;\n\n    @Override\n  \
  \  private void setupPermissions() {\n        int permission = ContextCompat.checkSelfPermission(this,\n\
  \                Manifest.permission.RECORD_AUDIO);\n        if (permission != PackageManager.PERMISSION_GRANTED)\
  \ {\n            Log.i(TAG, \"Permission to record denied\");\n            makeRequest();\n\
  \        }\n    }\n\n    protected void makeRequest() {\n        ActivityCompat.requestPermissions(this,\n\
  \                new String[]{Manifest.permission.RECORD_AUDIO},\n             \
  \   RECORD_REQUEST_CODE);\n    }\n}\n```\n\n接下来，实现 `onRequestPermissionsResult()`\
  \ 方法，使其内容如下：\n\n```java\n@Override\npublic void onRequestPermissionsResult(int requestCode,\n\
  \                      String permissions[], int[] grantResults) {\n    super.onRequestPermissionsResult(requestCode,\
  \ permissions, grantResults);\n    switch (requestCode) {\n        case RECORD_REQUEST_CODE:\
  \ {\n            if (grantResults.length == 0 || grantResults[0] !=\n```\n\n\n\n\
  \n\n```java\nif (permission != PackageManager.PERMISSION_GRANTED) {\n    Log.i(TAG,\
  \ \"Permission has been denied by user\");\n} else {\n    Log.i(TAG, \"Permission\
  \ has been granted by user\");\n}\n}\n```\n\n在 Android 6 或更高版本的模拟器或设备上编译并运行该应用，注意如图\
  \ 73-3 所示的请求录制音频权限的对话框：\n\n![](img/as_4.1_permission_request.jpg)\n\n图 73-3\n\n\
  点击“在使用应用期间”按钮，检查 Logcat 面板是否出现了“Permission has been granted by user”消息。\n\n一旦用户授予了请求的权限，`checkSelfPermission()`\
  \ 方法调用在未来的应用启动中将返回 `PERMISSION_GRANTED` 结果，直到用户卸载并重新安装应用，或者在`Settings` 中更改了该应用的权限。\n\
  \n## 73.5 为权限请求提供理由\n\n如图 73-3 所示，用户可以选择拒绝请求的权限。在这种情况下，应用每次由用户启动时都会继续请求该权限，除非用户在点击“拒绝”按钮之前选择了“不再询问”选项。用户的多次拒绝可能表明用户并不理解为什么应用需要该权限。因此，如果在发出请求时解释了需求的原因，用户更有可能授予权限。遗憾的是，无法更改请求对话框的内容来包含此类解释。\n\
  \n最好的做法是将解释包含在单独的对话框中，该对话框可以在请求对话框显示给用户之前显示。这引出了何时显示此解释对话框的问题。Android 文档建议仅在用户之前拒绝过权限的情况下显示解释对话框，并提供了一种识别何时发生这种情况的方法。\n\
  \n调用 `ActivityCompat` 类的 `shouldShowRequestPermissionRationale()` 方法，如果用户之前拒绝过对特定权限的请求，将返回\
  \ `true` 结果；如果之前没有请求过，则返回 `false` 结果。在结果为 `true` 的情况下，应用应该显示一个包含权限理由的对话框，并在用户阅读并关闭该对话框后，重复权限请求。\n\
  \n要向示例应用中添加此功能，请修改 `onCreate()` 方法使其内容如下：\n\n```java\nimport android.app.AlertDialog;\n\
  import android.content.DialogInterface;\n\nprivate void setupPermissions() {\n \
  \   int permission = ContextCompat.checkSelfPermission(this,\n            Manifest.permission.RECORD_AUDIO);\n\
  \    if (permission != PackageManager.PERMISSION_GRANTED) {\n        Log.i(TAG,\
  \ \"Permission to record denied\");\n        if (ActivityCompat.shouldShowRequestPermissionRationale(this,\n\
  \                    Manifest.permission.RECORD_AUDIO)) {\n            AlertDialog.Builder\
  \ builder =\n                    new AlertDialog.Builder(this);\n            builder.setMessage(\"\
  Permission to access the microphone is required for this app to record audio.\"\
  )\n                    .setTitle(\"Permission required\");\n            builder.setPositiveButton(\"\
  OK\",\n                    new DialogInterface.OnClickListener() {\n           \
  \         public void onClick(DialogInterface dialog, int id) {\n              \
  \          // ... 请求权限的逻辑 ...\n                    });\n            AlertDialog\
  \ dialog = builder.create();\n            dialog.show();\n        }\n    } else\
  \ {\n        // ... 已授予权限的逻辑 ...\n    }\n}\n```\n\n## 73.6 测试应用\n\n在 6.0 之前，应用访问某些功能的唯一步骤是在清单文件中添加一行代码。基于\
  \ 6 或更高版本的应用现在必须获得用户的许可批准。\n\n## 73.7 总结\n\n如本章概述，基于 6 或更高版本的应用现在必须请求危险权限，例如访问麦克风、联系人或外部存储。\n\
  \n# 74. 使用 MediaPlayer 和 MediaRecorder 进行音频录制和播放\n\n本章将提供 `MediaRecorder` 类的概述，并解释如何使用该类录制音频或视频的基础知识。还将涵盖使用\
  \ `MediaPlayer` 类播放音频。将创建一个应用程序来演示这些技术。此外，除了查看和处理，还将触及将文件保存到……\n\n## 74.1 音频\n\n\
  在音频播放方面，Android 支持实现 AAC/TP、HE-AACv1 (AAC+)、HE-AACv2 (enhanced AAC+)、AMR-NB、AMR-WB、MP3、MIDI、Ogg\
  \ Vorbis 以及 PCM/WAVE 格式。\n\n可以使用 `MediaPlayer` 或 `AudioTrack` 类执行播放。`AudioTrack`\
  \ 是更高级的选项，它使用流媒体缓冲区并对音频提供更大的控制。相反，`MediaPlayer` 类提供了一个更简单的编程接口来实现音频播放，并满足音频需求的需求。\n\
  \n`MediaPlayer` 类关联有一系列方法，应用程序可以调用这些方法来执行某些任务。该类一些关键方法的子集如下：\n\n- `create()` – 调用创建该类的新实例，传递要播放音频的\
  \ Uri。\n- `setDataSource()` – 设置音频播放的源。\n- `prepare()` – 指示播放器准备开始播放。\n- `start()`\
  \ – 开始播放。\n- `pause()` – 暂停播放。可以通过调用 `resume()` 方法恢复播放。\n- `stop()` – 停止播放。\n- `setVolume()`\
  \ – 接受两个浮点参数，指定左右通道的播放音量。\n- `resume()` – 恢复之前暂停的播放会话。\n\n\n\n\n\n- `reset()` –\
  \ 重置媒体播放器实例的状态。本质上是将实例重置为未初始化状态。至少，重置后的播放器需要重新设置数据源并调用 `prepare()` 方法。\n- `release()`\
  \ – 当播放器实例不再需要时调用此方法。此方法可确保播放器所持有的任何资源都会被释放。\n\n在典型的实现中，应用程序将实例化 `MediaPlayer` 类的一个实例，设置要播放的音频源，然后调用\
  \ `prepare()` 紧接着调用 `start()`。例如：\n\n```java\nMediaPlayer mediaPlayer = new MediaPlayer();\n\
  mediaPlayer.setDataSource(\"https://www.yourcompany.com/myaudio.mp3\");\nmediaPlayer.prepare();\n\
  mediaPlayer.start();\n```\n\n## 74.2 使用 MediaRecorder 类录制音视频\n\n与音频播放一样，可以使用多种不同的技术进行录制。一种方案是使用\
  \ `MediaRecorder` 类，它与 `MediaPlayer` 类一样，提供了许多用于录制音频的方法：\n\n- `setAudioSource()`\
  \ – 指定要录制的音频的源源（通常对于设备麦克风，这将会是 `MediaRecorder.AudioSource.MIC`）。\n- `setVideoSource()`\
  \ – 指定要录制的视频的源（例如 `MediaRecorder.VideoSource.CAMERA`）。\n- `setOutputFormat()` –\
  \ 指定录制的音频或视频要存储的格式（例如 `MediaRecorder.OutputFormat.AAC_ADTS`）。\n- `setAudioEncoder()`\
  \ – 指定用于录制音频的音频编码器（例如 `MediaRecorder.AudioEncoder.AAC`）。\n- `setOutputFile()` –\
  \ 配置录制的音频或视频要存储的文件路径。\n- `prepare()` – 准备 `MediaRecorder` 实例以开始录制。\n- `start()`\
  \ – 开始录制过程。\n- `stop()` – 停止录制过程。一旦录制机停止，在重新启动之前需要完全重新配置并准备。\n- `reset()` – 重置录制机。实例在重新启动之前需要完全重新配置并准备。\n\
  - `release()` – 当录制机实例不再需要时应调用此方法。此方法确保实例持有的所有资源都被释放。\n\n使用该类的典型实现将设置源、输出和编码格式以及输出文件。然后将调用\
  \ `prepare()` 和 `start()` 方法。当录制结束时将调用 `stop()` 方法，随后调用 `reset()` 方法。当应用程序不再需要录制机实例时，建议调用\
  \ `release()` 方法：\n\n```java\nMediaRecorder mediaRecorder = new MediaRecorder();\n\
  mediaRecorder.setAudioSource(MediaRecorder.AudioSource.MIC);\nmediaRecorder.setOutputFormat(MediaRecorder.OutputFormat.AAC_ADTS);\n\
  mediaRecorder.setAudioEncoder(MediaRecorder.AudioEncoder.AAC);\nmediaRecorder.setOutputFile(audioFilePath);\n\
  mediaRecorder.prepare();\nmediaRecorder.start();\n\nmediaRecorder.stop();\nmediaRecorder.reset();\n\
  mediaRecorder.release();\n```\n\n为了录制音频，应用程序的清单文件必须包含 `android.permission.RECORD_AUDIO`\
  \ 权限：\n\n```xml\n<uses-permission android:name=\"android.permission.RECORD_AUDIO\"\
  \ />\n```\n\n正如标题为在 Android 中请求运行时权限”的章节概述的，访问麦克风属于危险权限类别。因此，为了支持 Android 6，在应用程序启动时还必须对麦克风访问进行特定请求，相关步骤将在本章稍后介绍。\n\
  \n## 74.3 关于示例项目\n\n本章的剩余部分将介绍创建一个示例应用程序，旨在演示如何使用 `MediaPlayer` 和 `MediaRecorder`\
  \ 类在 Android 设备上实现音频的录制和播放。\n\n在开发使用特定硬件功能的应用程序时（麦克风就是一个例子），在尝试在应用程序代码中访问它之前，检查该功能的可用性是非常重要的。因此，本章创建的应用程序还将包含检测设备上是否存在麦克风的代码。\n\
  \n完成后，该应用程序将提供一个非常简单的界面，允许用户录制和播放音频。录制的音频需要存储在设备上的音频文件中。既然如此，本教程还将简要探索使用 SD 卡存储的机制。\n\
  \n## 74.4 创建 AudioApp 项目\n\n从欢迎界面选择 New Project 选项，在出现的新项目对话框中，点击 Next 按钮之前选择 Empty\
  \ Activity 模板。\n\n在 `Name` 字段中输入 `AudioApp`，并指定 `com.ebookfrenzy.audioapp` 为包名。在点击\
  \ Finish 按钮之前，将 Minimum API level 设置更改为 `API 26: Android 8.0 (Oreo)`，并将语言菜单更改为 `Java`。按照第\
  \ 11.8 Migrating a Project to View Binding 节概述的步骤为项目添加 view binding 支持。\n\n## 74.5\
  \ 设计用户界面\n\n创建新项目后，从 Project 工具窗口选择 `activity_main.xml` 文件，并在 Design 模式下的 Layout\
  \ Editor 工具中，选择“Hello World!” `TextView` 并将其从布局中删除。\n\n向布局中拖放三个 `Button` 视图。按钮的位置对于本示例来说并不十分重要，但图\
  \ 74-1 显示了布局。\n\n使用垂直链配置按钮显示字符串资源 Play、Record 和 Stop，并将它们的 ID 分别设置为 `playButton`、`recordButton`\
  \ 和 `stopButton`。\n\n选择 Play 按钮，并在 Attributes 面板中配置 `onClick` 属性以调用名为 `playAudio`\
  \ 方法。重复这些步骤配置剩余按钮调用 `recordAudio` 和 `stopAudio`。\n\n![](img/3.5_audioapp_ui.jpg)\n\
  图 74-1\n\n## 74.6 检查麦克风可用性\n\n在没有麦克风的设备上录制音频会导致 Android 系统抛出异常。因此，代码在进行此类尝试之前检查麦克风的存在是非常关重要的。对此有多种方法，包括检查设备的物理存在。一种更容易且可能适用于不同\
  \ Android 设备的方法是询问 Android 系统是否安装了特定功能的包。这涉及到创建一个 `PackageManager` 实例，然后调用对象的 `hasSystemFeature()`\
  \ 方法。`PackageManager.FEATURE_MICROPHONE` 是我们感兴趣的功能。\n\n为了本示例，我们将创建一个名为 `hasMicrophone()`\
  \ 的方法，它可以检查麦克风的存在。在 Project 工具窗口中，找到并双击 `MainActivity.java` 文件，进行修改以添加此方法：\n\n```java\n\
  package com.ebookfrenzy.audioapp;\n\nimport android.content.pm.PackageManager;\n\
  \npublic class MainActivity extends AppCompatActivity {\n\n    protected boolean\
  \ hasMicrophone() {\n        PackageManager pmanager = this.getPackageManager();\n\
  \        return pmanager.hasSystemFeature(PackageManager.FEATURE_MICROPHONE);\n\
  \    }\n}\n```\n\n## 74.7 初始化 Activity\n\n下一步是修改 activity 执行若干初始化任务。在 `MainActivity.java`\
  \ 文件中，按如下所示修改代码：\n\n```java\npackage com.ebookfrenzy.audioapp;\n\nimport java.io.IOException;\n\
  import android.media.MediaRecorder;\nimport android.os.Environment;\nimport android.media.MediaPlayer;\n\
  \npublic class MainActivity extends AppCompatActivity {\n\n    private ActivityMainBinding\
  \ binding;\n    private static MediaRecorder mediaRecorder;\n}\n```\n\n\n\n\n```java\n\
  \    private static MediaPlayer mediaPlayer;\n\n    private static String audioFilePath;\n\
  \n    private boolean isRecording = false;\n\n    @Override\n    protected void\
  \ onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        binding = ActivityMainBinding.inflate(getLayoutInflater());\n        View\
  \ view = binding.getRoot();\n        setContentView(view);\n        audioSetup();\n\
  \    }\n\n    private void audioSetup()\n    {\n        if (!hasMicrophone())\n\
  \        {\n            binding.stopButton.setEnabled(false);\n            binding.playButton.setEnabled(false);\n\
  \            binding.recordButton.setEnabled(false);\n        } else {\n       \
  \     binding.playButton.setEnabled(false);\n            binding.stopButton.setEnabled(false);\n\
  \        }\n        audioFilePath =\n                this.getExternalFilesDir(Environment.DIRECTORY_MUSIC).\n\
  \                getAbsolutePath() + \"/myaudio.3gp\";\n    }\n}\n```\n\n新增的代码首先获取用户界面中三个按钮视图的引用。接下来，调用了之前实现的\
  \ `hasMicrophone()` 方法来确定设备是否包含麦克风。如果没有，则禁用所有按钮；否则，仅禁用停止（Stop）和播放（Play）按钮。\n\n下一行代码需要进一步解释：\n\
  \n```java\naudioFilePath = this.getExternalFilesDir(Environment.DIRECTORY_MUSIC).getAbsolutePath()\
  \ + \"/myaudio.3gp\";\n```\n\n这段代码的目的是识别设备上外部存储（尽管在许多 Android 设备上它是内部存储的，但被称为外部存储）的位置，并使用该位置创建一个指向名为\
  \ `myaudio.3gp` 文件的路径，音频录制将存储其中。`getExternalFilesDir()` 方法的参数是所需的存储类型（在本例中，我们请求音乐目录的路径，尽管也有播客、有声书、电影、图片等选项可用）。\n\
  \n在处理外部存储工作时，重要的是意识到应用程序的此类活动需要在应用程序清单文件（manifest）中请求权限。例如：\n\n```xml\n<uses-permission\
  \ android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" />\n```\n\n## 74.8\
  \ 实现 `recordAudio()` 方法\n\n当用户触摸记录（Record）按钮时，将调用 `recordAudio()` 方法。该方法需要启用和禁用相应的按钮，并配置\
  \ `MediaRecorder` 实例，提供有关音频源、输出格式和编码以及要存储音频的文件位置的信息。最后，需要调用 `MediaRecorder` 对象的\
  \ `prepare()` 和 `start()` 方法。这些这些要求共同构成了 `MainActivity.java` 文件中的以下方法实现：\n\n```java\n\
  public void recordAudio (View view)\n{\n    isRecording = true;\n    binding.stopButton.setEnabled(true);\n\
  \    binding.playButton.setEnabled(false);\n    binding.recordButton.setEnabled(false);\n\
  \    try {\n        mediaRecorder = new MediaRecorder();\n        mediaRecorder.setAudioSource(MediaRecorder.AudioSource.MIC);\n\
  \        mediaRecorder.setOutputFormat(\n            MediaRecorder.OutputFormat.THREE_GPP);\n\
  \        mediaRecorder.setOutputFile(audioFilePath);\n        mediaRecorder.setAudioEncoder(MediaRecorder.AudioEncoder.AMR_NB);\n\
  \        mediaRecorder.prepare();\n    } catch (Exception e) {\n        e.printStackTrace();\n\
  \    }\n    mediaRecorder.start();\n}\n```\n\n## 74.9 实现 `stopAudio()` 方法\n\n`stopAudio()`\
  \ 方法负责启用播放（Play）按钮，禁用停止（Stop）按钮，然后停止并重置 `MediaRecorder` 实例。实现此目的的代码如下列表所示，并应被添加到\
  \ `MainActivity.java` 文件中：\n\n```java\npublic void stopAudio (View view)\n{\n  \
  \  binding.stopButton.setEnabled(false);\n    binding.playButton.setEnabled(true);\n\
  \    if (isRecording)\n    {\n        binding.recordButton.setEnabled(false);\n\
  \        mediaRecorder.stop();\n        mediaRecorder.release();\n        mediaRecorder\
  \ = null;\n        isRecording = false;\n    } else {\n        mediaRecorder.release();\n\
  \        mediaRecorder = null;\n        binding.recordButton.setEnabled(true);\n\
  \    }\n}\n```\n\n## 74.10 实现 `playAudio()` 方法\n\n`playAudio()` 方法简单地创建一个 `MediaPlayer`\
  \ 实例，将 SD 卡上的音频文件指定为数据源，然后准备并启动：\n\n```java\npublic void playAudio (View view) throws\
  \ IOException\n{\n    binding.playButton.setEnabled(false);\n    binding.recordButton.setEnabled(false);\n\
  \    binding.stopButton.setEnabled(true);\n    mediaPlayer = new MediaPlayer();\n\
  \    mediaPlayer.setDataSource(audioFilePath);\n    mediaPlayer.prepare();\n   \
  \ mediaPlayer.start();\n}\n```\n\n## 74.11 配置并请求权限\n\n在测试应用程序之前，必须在清单中请求适当权限。具体而言，应用程序将需要录制音频和访问外部存储（SD\
  \ 卡）的权限。在项目（Project）窗口中，双击 `AndroidManifest.xml` 文件将其加载到编辑器并修改 XML 以添加：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.frenzy.audioapp\">\n    <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\"\
  \ />\n    <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />\n\
  \    <application>\n</manifest>\n```\n\n上述步骤将确保在运行 Android 6 之前的设备上安装应用程序时启用这些权限。麦克风和外部存储访问在\
  \ Android 中被类为危险权限，因为它们可能会损害用户的隐私。因此，为了让示例应用程序在 Android 6 或更高版本上运行，需要添加代码在运行时请求这些权限。\n\
  \n编辑 `MainActivity.java` 文件，首先添加一些导入指令和作为请求请求码的常量：\n\n```java\nimport androidx.core.app.ActivityCompat;\n\
  import androidx.core.content.ContextCompat;\nimport android.widget.Toast;\nimport\
  \ android.Manifest;\n\npublic class MainActivity extends AppCompatActivity {\n \
  \   private static final int RECORD_REQUEST_CODE = 101;\n    private static final\
  \ int STORAGE_REQUEST_CODE = 102;\n```\n\n接下来，需要在类中添加一个方法，其目的是接收要请求的权限和对应的请求标识码。继续处理\
  \ `MainActivity.java` 类文件，如下所示实现此方法：\n\n```java\nprotected void requestPermission(String\
  \ permissionType, int requestCode) {\n    int permission = ContextCompat.checkSelfPermission(this,\
  \ permissionType);\n    if (permission != PackageManager.PERMISSION_GRANTED) {\n\
  \        ActivityCompat.requestPermissions(this, new String[]{permissionType}, requestCode);\n\
  \    }\n}\n```\n\n根据本书“在 Android 中进行运行时请求”章节中的概述，上述方法在发出请求之前验证指定的权限是否已授予，并将标识码作为参数传递。当请求被处理后，`onRequestPermissionsResult()`\
  \ 方法将在活动上调用，并传递标识码和请求结果。因此，下一步是在 `MainActivity.java` 文件中如下实现此方法：\n\n```java\n@Override\n\
  public void onRequestPermissionsResult(int requestCode,\n```\n\n\n\n\n\n```java\n\
  String permissions[], int[] grantResults) {\n\n    super.onRequestPermissionsResult(requestCode,\
  \ permissions, grantResults);\n    switch (requestCode) {\n        case RECORD_REQUEST_CODE:\
  \ {\n            if (grantResults.length == 0\n                    || grantResults[0]\
  \ !=\n                        PackageManager.PERMISSION_GRANTED) {\n           \
  \     binding.recordButton.setEnabled(false);\n                Toast.makeText(this,\n\
  \                        \"Record permission required\",\n                     \
  \   Toast.LENGTH_LONG).show();\n            } else {\n                requestPermission(\n\
  \                        Manifest.permission.WRITE_EXTERNAL_STORAGE,\n         \
  \               STORAGE_REQUEST_CODE);\n            }\n            return;\n   \
  \     }\n        case STORAGE_REQUEST_CODE: {\n            if (grantResults.length\
  \ == 0\n                    || grantResults[0] !=\n                        PackageManager.PERMISSION_GRANTED)\
  \ {\n                binding.recordButton.setEnabled(false);\n                Toast.makeText(this,\n\
  \                        \"External Storage permission required\",\n           \
  \             Toast.LENGTH_LONG).show();\n            }\n        }\n    }\n}\n```\n\
  \n上述代码通过检查请求标识符代码，在检查相应的权限是否被授予之前，先识别是哪个权限请求已返回。如果用户授予了访问麦克风的权限，代码将继续请求访问外部存储。如果任何权限被拒绝，则会向用户显示消息，指示应用将无法运行。在两种情况下，录制按钮都会被禁用。\n\
  \n在测试应用之前，剩下的唯一工作是在应用启动时调用新添加的 `requestPermission()` 方法来获取麦克风访问。在 `MainActivity.java`\
  \ 文件中，按如下方式修改 `audioSetup()` 方法：\n\n```java\nprivate void audioSetup(){\n\n    binding.recordButton\
  \ = findViewById(R.id.recordButton);\n    binding.playButton = findViewById(R.id.playButton);\n\
  \    binding.stopButton = findViewById(R.id.stopButton);\n    if (!hasMicrophone())\
  \ {\n        stopButton.setEnabled(false);\n        playButton.setEnabled(false);\n\
  \        recordButton.setEnabled(false);\n    } else {\n        playButton.setEnabled(false);\n\
  \        stopButton.setEnabled(false);\n    }\n    audioFilePath = Environment.getExternalStorageDirectory()\n\
  \            .getAbsolutePath() + \"/myaudio.3gp\";\n    requestPermission(Manifest.permission.RECORD_AUDIO,\
  \ RECORD_REQUEST_CODE);\n}\n```\n\n### 12 测试应用程序\n在包含麦克风的 Android 设备上编译并运行该程序，允许请求的权限并点击录制（Record）按钮。录制后，点击停止（Stop）然后点击播放（Play），此时录制的音频应通过设备扬声器播放出来。如果在\
  \ Android 6.0 或更高版本上运行，请注意应用会请求使用外部存储来录制音频。\n\n### 13 总结\nAndroid SDK 为音频录制和播放的实现提供了多种机制。本章以\
  \ `MediaPlayer` 和 `MediaRecorder` 类的形式查看了其中两种。在涵盖了使用这些技术的理论后，本章详细介绍了一个用于录制和回放音频的应用创建。在\
  \ Android 中处理音频的过程中，本章还研究了在尝试录制之前确保运行应用程序的设备具有麦克风的步骤。此外还涵盖了以 SD 卡形式使用外部存储的内容。\n\n\
  # 在 Android 中使用 Google Maps API\n\n当 Google 在许多年前决定推出地图服务时，很难说他们是否曾预料到会有一个可以集成到移动应用程序中的版本。当第一个被称为\
  \ Google Maps 的 Web 端版本于 2005 年推出时，iPhone 尚未引发智能手机革命，而开发 Android 操作系统的公司在几个几个月后才被\
  \ Google 收购。无论 Google 对 Google Maps 的未来有何愿景，考虑到现在可以通过 Google Maps API 直接通过 Android\
  \ 应用程序访问 Google Maps 的所有功能，这非常令人惊叹。\n\n本章旨在提供 Google Maps 系统和 Google Maps Android\
  \ API 的概述。本章将概述构成 API 的不同元素，详细说明配置开发环境以与 Google Maps 开发的必要步骤，然后通过一些代码示例演示 Google\
  \ Maps 集成的基础知识。\n\n## Google Maps API 的元素\nGoogle Maps Android API 由一组核心类组成，这些类结合在一起为\
  \ Android 应用程序提供地图绘制功能。地图的关键元素如下：\n\n- `GoogleMap`: Google Maps Android API 的主类。该类负责下载和显示地图瓦片，并显示和响应地图控件。`GoogleMap`\
  \ 对象不是由应用程序直接创建的，而是在创建 `MapView` 或 `MapFragment` 实例时创建的。在应用程序代码中，可以通过调用 `MapView`、`MapFragment`\
  \ 或 `SupportMapFragment` 实例的 `getMap()` 方法获取 `GoogleMap` 对象的引用。\n- `MapView`: `View`\
  \ 类的子类，该类提供了一个画布，`GoogleMap` 对象在上面绘制地图，允许将地图放置在活动（activity）的用户界面布局中。\n- `SupportMapFragment`:\
  \ `Fragment` 类的子类，该类允许将地图放置在 Android 布局的 `Fragment` 中。\n- `Marker`: `Marker` 类的作用允许在地图上标记位置。通过获取与地图关联的\
  \ `GoogleMap` 引用，然后调用该对象实例的 `addMarker()` 方法将标记添加到地图中。标记的位置通过 `Longitude`（经度）和 `Latitude`（纬度）定义。标记可以通过多种方式配置，包括指定标题、文本和图标。标记还可以被设置为“可拖拽的”（draggable），允许用户将标记移动到地图上的不同位置。\n\
  - `Shapes`: 在地图上绘制线条和形状是通过使用 `Polyline`、`Polygon` 和 `Circle` 类实现的。\n- `UiSettings`:\
  \ `UiSettings` 类提供了从应用程序内部控制地图上显示的用户界面控件的功能。例如，使用该类，应用程序可以控制地图上是否显示缩放、当前位置和罗盘控件。该类还可以用于配置地图识别的触摸屏手势。\n\
  - `My Location Layer`: 启用后，我的位置层会在地图上显示一个按钮，用户选择该按钮会将地图中心置于用户当前的地理位置。如果用户是静止的，该位置在地图上由蓝色标记表示。如果用户正在移动，该位置将由一个指示用户移动方向的箭头（chevron）表示。\n\
  \n## 2 创建 Google Maps 项目\n熟悉 Google Maps Android API 的最佳方法是通过一个示例进行学习。本章的剩余部分将创建一个基于\
  \ Google Maps 的应用程序，同时突出 API 的关键区域。\n\n从欢迎屏幕上选择 New Project（新建项目）选项，在生成的新项目对话框中选择\
  \ Google Maps Activity 模板，然后点击 Next（下一步）按钮。\n\n在 Name 字段中输入 MapDemo，并指定 `com.ebookfrenzy.mapdemo`\
  \ 为包名。在点击 Finish（完成）按钮之前，将 Minimum API level 设置为 API 26: Android 8.0 (Oreo)，并将 Language（语言）菜单更改为\
  \ Java。\n\n\n\n\n\n# 75.3 获取您的开发者签名\n\n在应用程序可以使用 Google Maps Android API 之前，必须先在\
  \ Google APIs 控制台中进行注册。然而，在注册应用程序之前，必须识别与您的开发环境关联的开发者签名（也称为 SHA-1 指纹）。该签名包含位于主目录下\
  \ `.android` 子目录下的密钥库文件（keystore file）中，可以使用 Java SDK 带提供的 `keytool` 工具获取。不过，为了简化这一过程，在创建项目过程中选择\
  \ Google Maps Activity 选项时，Android Studio 会向项目添加一些额外文件。其中一个文件名为 `google_maps_api.xml`，位于项目的\
  \ `app -> res -> values` 文件夹中。\n\n`google_maps_api.xml` 文件包含一个指向 Google 开发者控制的链接。将此链接复制并粘贴到浏览器窗口中。加载后，将出现类似下面的页面：\n\
  \n![](img/Image24274.jpg)\n\n图 75-1\n\n在点击“继续”（Continue）按钮之前，确认菜单已设置为“创建新项目”（Create\
  \ a new project）。启用 API 后，点击“创建 API 密钥”（Create API Key）按钮。稍等后，将创建新项目并出现一个面板（图 75-2），为应用程序提供\
  \ API 密钥。\n\n![](img/Image24364.jpg)\n\n图 75-2\n\n复制此密钥，返回 Android Studio，并将 API\
  \ 密钥粘贴到文件的 `YOUR_KEY_HERE` 部分：\n\n```xml\n<string name=\"google_maps_key\" templateMergeStrategy=\"\
  preserve\" translatable=\"false\">YOUR_KEY_HERE</string>\n```\n\n# 75.4 添加 Apache\
  \ HTTP Legacy 库依赖\n\n由于此示例项目将为用于 Android 9.0 或更高版本的 Android 而构建，因此需要在 `AndroidManifest.xml`\
  \ 文件的 `<application>` 部分内添加如下声明：\n\n```xml\n<application\n    android:allowBackup=\"\
  true\"\n    android:icon=\"@mipmap/ic_launcher\"\n    android:label=\"@string/app_name\"\
  \n    android:roundIcon=\"@mipmap/ic_launcher_round\"\n    android:supportsRtl=\"\
  true\"\n    android:theme=\"@style/Theme.MapDemo\">\n    <uses-library\n       \
  \ android:name=\"org.apache.http.legacy\"\n        android:required=\"false\" />\n\
  </application>\n```\n\n## 75.5 测试应用程序\n\n对应用程序进行测试运行以验证 API 密钥是否配置正确。假设配置正确，应用程序将运行并在屏幕上显示地图。\n\
  \n如果未显示地图，请检查以下区域：\n\n*   如果应用程序运行在模拟器上，请确保模拟器运行的 Android 版本包含 Google APIs。可以通过选择\
  \ `Tools -> Android -> AVD Manager` 菜单选项来更改 AVD 配置的当前操作系统，通过点击 AVD 操作（Actions）列中的铅笔图标，然后点击当前\
  \ Android 版本旁边的 `Change…` 按钮。在系统镜像对话框中，选择一个包含 Google APIs 的目标。\n*   检查 `Logcat`\
  \ 输出中是否有任何与 Google Maps API 身份验证问题相关。这通常意味着 API 密钥输入错误，或者应用程序包名与生成 API 密钥时指定的名称不匹配。\n\
  *   在 Google API 控制台中验证服务（Services）面板中是否已启用 Google Maps Android API。\n\n# 75.6 理解地理编码和反向地理编码\n\
  \n如果不先介绍地理编码（Geocoding）主题，就无法讨论地图和地理位置。地理编码可以被描述为：将基于文本的地理位置（如街道地址）转换为用经纬度表示的地理坐标的过程。\n\
  \n可以使用 Android 的 `Geocoder` 类来实现地理编码。例如，可以向 `Geocoder` 实例传递一个代表位置的字符串，如城市名、街道地址或机场代码。`Geocoder`\
  \ 将尝试查找匹配的位置，并返回一个可能与位置字符串匹配的 `Address` 对象列表，列表按匹配程度排序，最匹配的项位于列表的第 0 位。然后可以从 `Address`\
  \ 对象中提取各种信息，包括潜在匹配项的经度和纬度。\n\n例如，以下代码请求位于华盛顿特区的国家航空航天博物馆的位置：\n\n```java\nimport\
  \ java.io.IOException;\nimport java.util.List;\nimport android.location.Address;\n\
  import android.location.Geocoder;\n\ndouble latitude;\ndouble longitude;\nList<Address>\
  \ geocodeMatches = null;\n\ntry {\n    geocodeMatches = new Geocoder(this).getFromLocationName(\n\
  \        \"600 Independence Ave SW, Washington, DC 20560\", 1);\n} catch (IOException\
  \ e) {\n    // TODO Auto-generated catch block\n    e.printStackTrace();\n}\n\n\
  if (!geocodeMatches.isEmpty()) {\n    latitude = geocodeMatches.get(0).getLatitude();\n\
  \    longitude = geocodeMatches.get(0).getLongitude();\n}\n```\n\n注意，值 `1` 被作为第二个参数传递给\
  \ `getFromLocationName()` 方法。这仅仅是告诉 `Geocoder` 在列表中只返回一个结果。\n\n上述代码是正向编码（forward-geocoding）的示例，根据文本位置计算坐标。反向地理编码（Reverse-geocoding）顾顾名，涉及将地理坐标翻译为人类可读的字符串。考虑以下示例：\n\
  \n```java\nimport java.io.IOException;\nimport java.util.List;\nimport android.location.Address;\n\
  import android.location.Geocoder;\n\nList<Address> geocodeMatches = null;\nString\
  \ Address1;\nString Address2;\nString State;\nString Zipcode;\nString Country;\n\
  \ntry {\n    geocodeMatches = new Geocoder(this).getFromLocation(38.887425, -77.0200729,\
  \ 1);\n} catch (IOException e) {\n    // TODO Auto-generated catch block\n    e.printStackTrace();\n\
  }\n\nif (!geocodeMatches.isEmpty()) {\n    Address1 = geocodeMatches.get(0).getAddressLine(0);\n\
  \    Address2 = geocodeMatches.get(0).getAddressLine(1);\n    State = geocodeMatches.get(0).getAdminArea();\n\
  \    Zipcode = geocodeMatches.get(0).getPostalCode();\n    Country = geocodeMatches.get(0).getCountryName();\n\
  }\n```\n\n在这种情况下，通过 `getFromLocation()` 方法使用经纬度初始化 `Geocoder` 对象。再次请求单个匹配结果。然后从生成的\
  \ `Address` 对象中提取文本地址信息。应该注意，地理编码并非在 Android 设备上实际执行，而是在需要翻译时连接到的服务器上执行，并在翻译完成后返回结果。因此，只有当设备具有活动的网络连接时才能进行地理编码。\n\
  \n# 75.7 向应用程序添加地图\n\n将地图添加到应用程序的最简单方法是在  的用户界面布局 XML 文件中指定它。以下示例布局文件显示了在 Android\
  \ Studio 创建的 `activity_maps.xml` 文件添加的 `SupportMapFragment` 实例：\n\n```xml\n<fragment\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\"\n    android:layout_width=\"match_parent\"\n\
  \    android:layout_height=\"match_parent\"\n    android:id=\"@+id/map\"\n    tools:context=\"\
  .MapsActivity\"\n    android:name=\"com.google.android.gms.maps.SupportMapFragment\"\
  />\n```\n\n# 75.8 请求当前位置权限\n\n\n\n\n如章节 \"在 Android 中请求运行时权限\" 概述所示，某些权限被归类为危险权限，并且对于\
  \ Android 6.0 或更高版本需要特殊处理。其中一种权限赋予了应用程序识别用户当前位置的能力。默认情况下，Android Studio 已在 `AndroidManifest.xml`\
  \ 文件中放置了位置权限请求。在项目工具窗口的 `app -> manifests` 下找到该文件，并找到以下权限行：\n\n```xml\n<uses-permission\n\
  \      android:name=\"android.permission.ACCESS_FINE_LOCATION\" />\n```\n\n这将确保在在旧版本的\
  \ Android 上安装应用时，应用获得提供权限以获取位置信息的机会；但为了完全支持 Android 6.0 或更高版本，应用还必须在运行时专门请求此权限。为了实现这一点，需要在\
  \ `MapsActivity.java` 文件中添加一些代码。\n\n首先，添加一些导入指令和一个和一个用作权限请求代码的常量：\n\n```java\npackage\
  \ com.ebookfrenzy.mapdemo;\n\n.\n.\n\nimport androidx.core.content.ContextCompat;\n\
  import androidx.core.app.ActivityCompat;\nimport android.Manifest;\nimport android.widget.Toast;\n\
  import android.content.pm.PackageManager;\n.\n.\n\npublic class MapsActivity extends\
  \ FragmentActivity implements OnMapReadyCallback {\n    private static final int\
  \ LOCATION_REQUEST_CODE = 101;\n    private GoogleMap mMap;\n.\n.\n}\n```\n\n接下来，需要在类中添加一个方法来向用户请求指定的权限。在\
  \ `MapsActivity.java` 类文件中，按照如下方式实现此方法：\n\n```java\nprotected void requestPermission(String\
  \ permissionType,\n                                 int requestCode) {\n    ActivityCompat.requestPermissions(this,\n\
  \            new String[]{permissionType}, requestCode\n    );\n}\n```\n\n当用户对权限请求做出响应后，活动将调用\
  \ `onRequestPermissionsResult()` 方法。在 `MapsActivity.java` 文件中，现在实现此方法，使其读取如下：\n\n\
  ```java\n@Override\npublic void onRequestPermissionsResult(int requestCode,\n  \
  \                                   String permissions[], int[] grantResults) {\n\
  \    super.onRequestPermissionsResult(requestCode, permissions, grantResults);\n\
  \    switch (requestCode) {\n        case LOCATION_REQUEST_CODE: {\n           \
  \ if (grantResults.length == 0\n                    || grantResults[0] !=\n    \
  \                        PackageManager.PERMISSION_GRANTED) {\n                Toast.makeText(this,\n\
  \                        \"Unable to show location - permission required\",\n  \
  \                      Toast.LENGTH_LONG).show();\n            } else {\n      \
  \          SupportMapFragment mapFragment =\n                    (SupportMapFragment)\
  \ getSupportFragmentManager()\n                        .findFragmentById(R.id.map);\n\
  \                mapFragment.getMapAsync(this);\n            }\n        }\n    }\n\
  }\n```\n\n如果用户未授予权限，应用将显示消息指示无法显示当前位置。相反，如果授予了权限，地图将刷新，以提供显示位置标记的机会。\n\n## 75.9\
  \ 显示用户的当前位置\n\n一旦授予了相应的权限，可以通过获取与显示的地图关联的 `GoogleMap` 对象引用，并调用该实例的 `setMyLocationEnabled()`\
  \ 方法（传入 `true` 值），在地图上显示用户的当前位置。\n\n当地图准备好显示时，将调用活目的 `onMapReady()` 方法。当地图在 `onRequestPermissionsResult()`\
  \ 方法中刷新时，也会调用此方法。默认情况下，Android Studio 已实现此方法并添加了一些代码，将地图对准到澳大利亚，并在悉尼市上方放置标记。找到并编辑\
  \ `MapsActivity.java` 文件中的 `onMapReady()` 方法，以移除此模板代码，并在启用显示用户当前位置之前添加检查是否授予权限的代码。如果没有授予权限，将通过调用之前添加的\
  \ `requestPermission()` 方法向用户发出请求：\n\n```java\n@Override\npublic void onMapReady(GoogleMap\
  \ googleMap) {\n    mMap = googleMap;\n    // 在悉尼添加一个标记并移动相机\n    LatLng sydney\
  \ = new LatLng(-34, 151);\n    mMap.addMarker(new MarkerOptions().position(sydney).title(\"\
  Marker in Sydney\"));\n    mMap.moveCamera(CameraUpdate.newLatLng(sydney));\n  \
  \  if (mMap != null) {\n        int permission = ContextCompat.checkSelfPermission(this,\n\
  \                Manifest.permission.ACCESS_FINE_LOCATION);\n        if (permission\
  \ == PackageManager.PERMISSION_GRANTED) {\n            mMap.setMyLocationEnabled(true);\n\
  \        } else {\n            requestPermission(Manifest.permission.ACCESS_FINE_LOCATION,\n\
  \                    LOCATION_REQUEST_CODE);\n        }\n    }\n}\n```\n\n现在运行应用时，将出现图\
  \ 75-3 所示的对话框，请求位置权限。如果授予了权限，地图上会出现一个蓝点表示设备的当前位置。\n\n![](img/as_4.1_map_demo_permission.jpg)\n\
  图 75-3\n\n## 75.10 更改地图类型\n\n可以通过调用相应 `GoogleMap` 对象的 `setMapType()` 方法来动态修改显示的地图类型，传入以下值之一：\n\
  \n- `GoogleMap.MAP_TYPE_NONE`: 没有任何地图瓦片的空网格。\n- `GoogleMap.MAP_TYPE_NORMAL`: 经典的地图视图。\n\
  - `GoogleMap.MAP_TYPE_SATELLITE`: 显示区域的卫星图像。\n- `GoogleMap.MAP_TYPE_HYBRID`: 叠加地图的卫星图像。\n\
  - `GoogleMap.MAP_TYPE_TERRAIN`: 显示等高线和颜色等地形信息。\n\n以下对 `onMapReady()` 方法的代码可以将地图切换到卫星模式：\n\
  \n```java\n.\n.\nif (mMap != null) {\n    int permission = ContextCompat.checkSelfPermission(\n\
  \            this, Manifest.permission.ACCESS_FINE_LOCATION);\n    if (permission\
  \ == PackageManager.PERMISSION_GRANTED) {\n        mMap.setMyLocationEnabled(true);\n\
  \    } else {\n        requestPermission(Manifest.permission.ACCESS_FINE_LOCATION,\n\
  \                LOCATION_REQUEST_CODE);\n    }\n    mMap.setMapType(GoogleMap.MAP_TYPE_SATELLITE);\n\
  }\n.\n.\n```\n\n或者，可以在嵌入地图的 XML 布局文件中使用 `map:mapType` 属性配合 `none`、`normal`、`hybrid`、`satellite`\
  \ 或 `terrain` 值来指定地图类型。例如：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n\
  <fragment xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:map=\"\
  http://schemas.android.com/apk/res-auto\"\n    android:id=\"@+id/map\"\n    android:layout_width=\"\
  match_parent\"\n    android:layout_height=\"match_parent\"\n    map:mapType=\"hybrid\"\
  \n    android:name=\"com.google.android.gms.maps.SupportFragment\"/>\n```\n\n###\
  \ 75.11 向用户显示地图控件\n\nGoogle Maps Android API 提供了许多可以可选显示给用户的控件，包括放大和缩小按钮、“我的位置”按钮和罗盘。\n\
  \n是否显示缩放和罗盘控件可以通过编程或在 XML 布局资源中的地图元素进行控制。为了通过编程方式配置控件，必须获取与 `GoogleMap` 对象关联的 `UiSettings`\
  \ 对象引用：\n\n```java\nimport com.google.android.gms.maps.UiSettings;\n.\n.\n\nUiSettings\
  \ mapSettings;\nmapSettings = mMap.getUiSettings();\n```\n\n通过调用 `UiSettings` 对象的\
  \ `setZoomControlsEnabled()` 方法来启用或禁用缩放控件。例如：\n\n\n\n\n\n```java\nmapSettings.setZoomControlsEnabled(true);\n\
  ```\n\n或者，可以在 XML 资源文件的 `map` 元素中设置 `map:uiZoomControls` 属性：\n\n```xml\nmap:uiZoomControls=\"\
  false\"\n```\n\n罗针可以通过调用 `UiSettings` 实例的 `setCompassEnabled()` 方法显示，也可以通过 XML 资源并使用\
  \ `map:uiCompass` 属性来显示。请注意，只有当地图相机倾斜或旋转偏离默认朝向时，罗针图标才会出现。\n\n“我的位置”（My Location）按钮仅在在本章前文所述的启用了“我的位置”模式时才会出现。即使在该模式下，也可能通过调用\
  \ `UiSettings` 实例的 `setMyLocationButtonEnabled()` 方法来阻止该按钮的显示。\n\n# 75.12 处理地图手势交互\n\
  \nGoogle Maps Android API 能够响应多种不同的用户交互。这些交互可以用于更改显示的地图区域、缩放级别，甚至是视角（例如为某些城市显示地图区域的\
  \ 3D 表示形式）。\n\n### 75.12.1 地图缩放手势\n\n可以使用与 `GoogleMap` 实例关联的 `UiSettings` 对象的 `setZoomGesturesEnabled()`\
  \ 方法启用或禁用与地图放大和缩小相关的手势支持。例如，以下代码禁用了示例地图的缩放手势：\n\n```java\nUiSettings mapSettings;\n\
  mapSettings = map.getUiSettings();\nmapSettings.setZoomGesturesEnabled(false);\n\
  ```\n\n在 XML 资源文件中通过将 `map:uiZoomGestures` 属性设置为 true 或 false，也可以实现相同的结果。\n\n在启用状态下，当用户在屏幕上进行捏合手势时，将发生缩放。同样地，双击会放大，而双指点击会缩小。另一方面，单指缩放手势是通过双击两次（但不松开第二次点击）然后在屏幕上上下滑动手指来分别放大或缩小来实现的。\n\
  \n### 75.12.2 地图滚动/平移手势\n\n滚动（或平移）手势允许用户通过单指动作在屏幕上拖动地图来移动地图。可以通过代码中调用 `UiSettings`\
  \ 实例的 `setScrollGesturesEnabled()` 方法来启用滚动手势：\n\n```java\nUiSettings mapSettings;\n\
  mapSettings = mMap.getUiSettings();\nmapSettings.setScrollGesturesEnabled(true);\n\
  ```\n\n或者，可以在 XML 资源布局文件中使用 `map:uiScrollGestures` 属性启用地图实例上的滚动。\n\n### 75.12.3\
  \ 地图倾斜手势\n\n倾斜手势允许用户通过在屏幕上放置两个手指并上下移动它们来调整地图投影的倾角。可以通过调用 `UiSettings` 实例的 `setTiltGesturesEnabled()`\
  \ 方法启用或禁用倾斜手势，例如：\n\n```java\nUiSettings mapSettings;\nmapSettings = mMap.getUiSettings();\n\
  mapSettings.setTiltGesturesEnabled(true);\n```\n\n也可以在 XML 布局资源文件中使用 `map:uiTiltGestures`\
  \ 属性启用或禁用倾斜手势。\n\n### 75.12.4 地图旋转手势\n\n通过在屏幕上放置两个手指并进行圆周运动，当启用地图旋转手势时，用户可以旋转地图的朝向。这种手势支持在代码中通过调用\
  \ `UiSettings` 实例的 `setRotateGesturesEnabled()` 方法启用或禁用，例如：\n\n```java\nUiSettings\
  \ mapSettings;\nmapSettings = mMap.getUiSettings();\nmapSettings.setRotateGesturesEnabled(true);\n\
  ```\n\n也可以在 XML 布局资源文件中使用 `map:uiRotateGestures` 属性启用或禁用旋转手势。\n\n# 75.13 创建地图标记（Markers）\n\
  \n标记用于通知用户地图上的位置，其形式为标准图标或自定义图标。标记还可以包含一个标题和可选的文本（称为摘要，snippet），并且可以被配置为允许用户将其拖动到地图上的不同位置。当用户点击标记时，将弹出一个信息窗口，显示有关标记位置的附加信息。\n\
  \n标记由 `Marker` 类的实例表示，并通过调用相应 `GoogleMap` 对象的 `addMarker()` 方法添加到地图中。作为此方法的参数传递的是一个\
  \ `MarkerOptions` 类的实例，它包含了标记所需的各种选项，如标题和摘要文本。标记的位置通过指定纬度和经度值来定义，这些值也包含在 `MarkerOptions`\
  \ 实例中。例如，以下代码向地图上的特定位置添加了一个包含标题、摘要和位置的标记：\n\n```java\nimport com.google.android.gms.maps.model.Marker;\n\
  import com.google.android.gms.maps.model.LatLng;\nimport com.google.android.gms.maps.model.MarkerOptions;\n\
  \nLatLng position = new LatLng(38.8874245, -77.0200729);\nMarker museum = mMap.addMarker(new\
  \ MarkerOptions()\n                .position(position)\n                .title(\"\
  Museum\")\n                .snippet(\"National Air and Space Museum\"));\n```\n\n\
  执行上述代码后，将标记指定的位置，点击该位置时将显示如 [图 75-4] 所示的包含标题和摘要的信息窗口。\n\n# 75.14 控制地图相机\n\n由于 Android\
  \ 设备屏幕是平坦的，而地球是一个球体，Google Maps API 使用墨卡托投影将地球表示在平面上。地图的默认视图是相机悬挂在地图上方并正指向下方。Maps\
  \ API 允许实时更改相机的目标、缩放级别和倾角：\n\n- 目标（Target）：通过经度指定的地图中心位置。\n- 缩放（Zoom）：以级别指定的相机缩放级别。缩放级别增加\
  \ 1.0 会显示的地图宽度翻倍。\n- 倾角（Tilt）：以角度指定的相机视角（对于弧形的顶点，即相机正指向下方的地方）。\n- 朝向（Bearing）：以北为顺时针方向测量的地图方向。\n\
  \n相机的变化通过创建 `CameraUpdate` 类的实例并带有设置来实现。`CameraUpdate` 实例是通过调用 `CameraUpdateFactory`\
  \ 方法创建的。一旦创建了 `CameraUpdate` 实例，就可以通过 `GoogleMap` 实例的 `moveCamera()` 方法将其应用于地图。为了获得相机变化时的平滑动画效果，可以调用\
  \ `animateCamera()` 方法代替 `moveCamera()`。\n\n`CameraUpdateFactory` 方法摘要如下：\n\n- `CameraUpdateFactory.zoomIn()`：提供放大一级的\
  \ `CameraUpdate` 实例。\n- `CameraUpdateFactory.zoomOut()`：提供缩小一级的 `CameraUpdate` 实例。\n\
  - `CameraUpdateFactory.zoomTo(float)`：生成一个缩放级别更改为指定值的 `CameraUpdate` 实例。\n- `CameraUpdateFactory.zoomBy(float)`：提供一个缩放级别增加或减少指定量的\
  \ `CameraUpdate` 实例。\n- `CameraUpdateFactory.zoomBy(float, Point)`：创建一个按指定值增加或减少缩放级别的\
  \ `CameraUpdate` 实例。\n- `CameraUpdateFactory.newLatLng(LatLng)`：创建一个更改相机目标纬度和经度的\
  \ `CameraUpdate` 实例。\n- `CameraUpdateFactory.newLatLngZoom(LatLng, float)`：生成一个更改相机纬度、经度和缩放级别的\
  \ `CameraUpdate` 实例。\n- `CameraUpdateFactory.newCameraPosition(CameraPosition)`：返回一个将相机移动到指定位置的\
  \ `CameraUpdate` 实例。可以使用 `CameraPosition.Builder()` 获取 `CameraPosition` 实例。\n\n\n\
  \n\n例如，以下代码通过动画将摄像头放大一个级别：\n\n```java\nmMap.animateCamera(CameraUpdateFactory.zoomIn());\n\
  ```\n\n另一方面，以下代码在不使用动画的情况下将摄像头移动到新位置并将放级别调整为 10：\n\n```java\nprivate static final\
  \ LatLng position = new LatLng(38.8874245, -77.0200729);\nmMap.moveCamera(CameraUpdateFactory.newLatLngZoom(position,\
  \ 10));\n```\n\n最后，下一个代码示例使用 `CameraPosition.Builder()` 创建一个具有目标、缩放、方位和倾斜角更改的 `CameraPosition`\
  \ 对象。然后使用动画将此更改应用到摄像头：\n\n```java\nimport com.google.android.gms.maps.model.CameraPosition;\n\
  import com.google.android.gms.maps.CameraUpdateFactory;\n\nCameraPosition cameraPosition\
  \ = new CameraPosition.Builder()\n    .target(position)\n    .zoom(50)\n    .bearing(70)\n\
  \    .tilt(25)\n    .build();\nmMap.animateCamera(CameraUpdateFactory.newCameraPosition(cameraPosition));\n\
  ```\n\n## 75. 总结\n\n本章提供了构成 Google Maps Android API 的关键类和方法的概述，并概述了准备开发环境和应用程序项目以使用该\
  \ API 所需的步骤。\n\n## 76. 使用 Android 打印框架打印\n\n随着 Android 4.4 KitKat 的发布，从 Android\
  \ 内部打印内容已成为可能。虽然后续章节将更详细地探索为自己的应用程序添加打印支持的选项，但本章将关注现在 Android 中提供的各种打印选项以及启用这些选项的步骤。在涵盖了这些初始主题后，本章将概述\
  \ Android 开发者在构建应用程序构建打印支持方面可以使用的各种打印功能。\n\n### 76.1 Android 打印架构\n\nAndroid 打印由打印框架（Printing\
  \ framework）提供。简单来说，该框架由一个 `Print Manager`（打印管理器）和若干打印服务插件组成。`Print Manager` 负责处理来自设备上应用程序的打印请求，并与安装在设备上的打印服务插件进行交互，从而确保打印请求得到实现。默认情况下，许多\
  \ Android 设备都安装了打印服务插件，以便使用 `Google Cloud Print` 和 `Google Drive` 服务进行打印。其他打印机类型的打印服务插件（如果尚未安装）也可以从\
  \ Google Play 商店获取。目前打印服务插件适用于 HP、爱普、三星和佳能（Canon）打印机，未来还可能发布来自其他制造商的插件，尽管 `Google\
  \ Cloud Print` 服务插件也可以从 Android 设备打印到几乎任何类型和型号的打印机。在本书的范围内，我们将使用 `HP Print Services\
  \ Plugin` 作为参考示例。\n\n### 76.2 打印服务插件\n\n`Print Service plugins` 的目的是允许应用程序将内容打印到通过局域网无线网络或蓝牙对\
  \ Android 设备可见的兼容打印机。\n\n可以通过加载 Google Play 应用并搜索“Print Service Plugin”来验证 Android\
  \ 设备上是否存在 `Print Service Plugin`。一旦插件在 Play 商店中列出，如果该插件尚未安装，则可以选择 `Install`（安装）按钮进行安装。例如，图\
  \ 76-1 显示了 Google Play 中的 `HP Print Service plugin`。\n\n`Print Services plugins`\
  \ 将自动检测 Android 设备当前连接的网络上的兼容打印机，并在从应用程序中打印时将它们列为选项。\n\n![](img/as_4.1_hp_printer_plugin.jpg)\n\
  \n图 76-1\n\n## 76.3 Google Cloud Print\n\n`Google Cloud Print` 是 Google 提供的一种服务，允许你从任何具有互联网连接的地方通过网络将内容打印到自己的打印机上。`Google\
  \ Cloud Print` 支持以 `Cloud Ready`（云就）和 `Classic`（经典）打印机形式的设备和打印机型号。`Cloud Ready`\
  \ 打印机内置了通过网络打印的技术。提供云端打印机的制造商包括倍力、佳能、戴尔、爱普、HP、柯达和三星。要确定打印机是否支持云端且受 `Google Cloud\
  \ Print` 支持，请查看以下 URL 中的打印机列表：\n\n`https://www.google.com/cloudprint/learn/printers.html`\n\
  \n对于经典的非云端打印机，`Google Cloud Print` 通过在连接到经典打印机的计算机系统（直接连接或通过家庭或办公室网络）上安装软件来提供云打印支持。\n\
  \n要设置 `Google Cloud Print`，请访问以下网页并使用登录 Android 设备时相同的 Google 账户 ID 登录：\n\n`https://www.google.com/cloudprint/learn/index.html`\n\
  \n一旦打印机添加到你的 `Google Cloud Print` 账户，当你从设备上的 Android 应用程序打印时，它们将列为打印目标选项。\n\n##\
  \ 76.4 打印到 Google Drive\n\n除了支持物理打印机外，还可以将打印输出保存到 `Google Drive`。当从设备打印时，在打印面板中选择\
  \ `Save to Google Drive`（保存到 Google Drive）。打印的内容将转换为 PDF 并保存到 `Google Drive` 云存储中。\n\
  \n## 76.5 保存为 PDF\n\nAndroid 提供的最后一个打印选项允许将打印内容本地保存为设备上的 PDF。一旦选择，该选项将要求为 PDF 文件命名并指定设备保存位置。在测试应用程序的打印功能时，`Save\
  \ as PDF` 和 `Google Drive` 选项非常有价值。\n\n## 76.6 从 Android 设备打印\n\nGoogle 建议提供打印内容能力的应用程序通过将打印选项放在溢出菜单中来实现。Android\
  \ 自带的许多应用程序现在包含 `Print…` 菜单选项。例如，图 76-2 显示了通过选择 Chrome 浏览器应用程序溢出菜单中的 `Share…` 选项访问\
  \ `Print` 选项。\n\n![](img/as_3.5_chrome_print_option.jpg)\n\n图 76-2\n\n一旦在应用程序内选择了\
  \ `print` 选项，将出现标准的 Android 打印屏幕，显示要打印内容的预览，如图 76-3](#Printing.xhtml__idTextAnchor1432）所示：\n\
  \n![](img/as_3.5_chrome_print_panel.jpg)\n\n图 76-3\n\n点击屏幕顶部的面板将显示所有的打印选项：\n\n![](img/as_3.5_save_as_pdf.jpg)\n\
  \n图 76-4\n\nAndroid 打印面板提供了常用的打印选项，如纸张大小、颜色、方向和份数。可以通过点击当前打印机或 PDF 输出选择来访问其他打印目标选项。\n\
  \n### 构建打印支持的选项\n\n打印框架为 Android 应用程序集成打印支持提供了多种选项。这些选项可以分类如下：\n\n#### 76.7.1 图像打印\n\
  \n正如名称所示，此选项允许将图像打印集成到 Android 应用程序中。在应用程序中添加此功能时，第一步是创建 `PrintHelper` 类的新实例：\n\n\
  ```java\nPrintHelper imagePrinter = new PrintHelper(context);\n```\n\n\n\n\n接下来，可以通过调用\
  \ `PrintHelper` 实例的 `setScaleMode()` 方法来指定图像的缩放模式。选项如下：\n\n* `SCALE_MODE_FIT` –\
  \ 图像将缩放以适应纸张尺寸，且不会进行裁剪或更改纵横比。这通常会导致在某个维度上出现空白。\n* `SCALE_MODE_FILL` – 图像将缩放以填充纸张尺寸，并在必要时进行裁剪，以避免打印输出结果中出现空白。\n\
  \n在没有设置缩放模式的情况下，系统将默认使用 `SCALE_MODE_FILL`。例如，以下代码在之前声明的 `PrintHelper` 实例上将缩放设置为适应模式：\n\
  \n```java\nimagePrinter.setScaleMode(PrintHelper.SCALE_MODE_FIT);\n```\n\n同样，也可以配置颜色模式，以指示打印输出是彩色还是黑白。这是通过向\
  \ `PrintHelper` 实例的 `setColorMode()` 方法传递以下选项之一实现的：\n\n* `COLOR_MODE_COLOR` – 表示图像将以彩色打印。\n\
  * `COLOR_MODE_MONOCHROME` – 表示图像将以黑白打印。\n\n除非按照如下方式指定单色选项，否则打印框架将默认进行彩色打印：\n\n```java\n\
  imagePrinter.setColorMode(PrintHelper.COLOR_MODE_MONOCHROME);\n```\n\n完成打印操作所需的是一张要打印的图像，并调用\
  \ `PrintHelper` 实例的 `printBitmap()` 方法，传递一个表示分配给打印任务名称的字符串以及图像的引用（以 `Bitmap` 对象或图像的\
  \ `Uri` 引用形式存在）：\n\n```java\nBitmap bitmap = BitmapFactory.decodeResource(getResources(),\n\
  \        R.drawable.oceanscene);\n\nimagePrinter.printBitmap(\"My Test Print Job\"\
  , bitmap);\n```\n\n一旦启动打印任务，打印框架将显示打印对话框，并处理后续与用户的交互以及在用户选择的打印目标上打印图像。\n\n## 7.2\
  \ 创建并打印 HTML 内容\n\nAndroid 打印框架还提供了一种在应用程序内部打印基于 HTML 内容的简单方法。这些内容可以是通过在网站上托管的页面的\
  \ `URL` 引用的 HTML 内容，也可以是可以在应用程序内部动态创建的 HTML 内容。\n\n为了启用 HTML 打印，`WebView` 类已经过扩展，以支持具有极少代码要求的打印。\n\
  \n当动态创建 HTML 内容（与加载和打印现有的网页相反）时，该过程涉及创建一个 `WebView` 对象并与其关联一个 `WebViewClient` 实例。然后配置该\
  \ web view client，在 HTML 加载到 `WebView` 完成后启动打印任务。在配置好 web view client 后，HTML 将被加载到\
  \ `WebView` 中，此时将触发打印过程。\n\n例如，考虑以下代码：\n\n```java\npublic void printContent()\n\
  {\n    WebView webView = new WebView(this);\n    webView.setWebViewClient(new WebViewClient()\
  \ {\n        public boolean shouldOverrideUrlLoading(WebView view, String url) {\n\
  \            return false;\n        }\n        @Override\n        public void onPageFinished(WebView\
  \ view, String url) {\n            createWebPrintJob(view);\n            myWebView\
  \ = null;\n        }\n    });\n    String htmlDocument =\n            \"<html><body><h1>Android\
  \ Print Test</h1><p>\"\n            + \"This is some sample content.</p></</body>></html>\"\
  ;\n    webView.loadDataWithURL(null, htmlDocument, \"text/html\", \"UTF-8\", null);\n\
  }\n```\n一旦启动打印任务，打印框架将显示打印对话框，并处理后续与用户的交互以及在用户选择的打印目标上打印图像。\n\n\n\n\n\n与可以相对容易实现的\
  \ HTML 打印和图像打印不同，自定义文档的打印是一个更复杂的多阶段过程，该过程将在本书的“Android 自定义文档打印指南”章节中进行概述。这些步骤可以总结如下：\n\
  \n* 连接到 Android 打印管理器（Print Manager）\n* 创建一个继承自 `PrintDocumentAdapter` 类的自定义打印适配器（Print\
  \ Adapter）\n* 创建 `PdfDocument` 实例来表示文档页面\n* 获取 `PdfDocument` 实例页面的引用，每个页面都关联着一个\
  \ `Canvas` 实例\n* 在页面画布上绘制内容\n* 通知打印框架文档已准备绪\n\n上述步骤中概述的自定义打印适配器需要实现若干方法，Android\
  \ 系统会在打印过程中调用这些方法来执行特定任务。其中最重要的是 `onLayout()` 方法，它负责根据用户更改纸张大小或页面方向等设置来重新排列文档布局；以及\
  \ `onWrite()` 方法，它负责渲染待打印的页面。这一主题将在题为“Android 自定义文档打印指南”的章节中详细介绍。\n\n## 76.8 总结\n\
  \nAndroid SDK 包含了在运行的应用内部打印内容的能力。打印输出可以重定向到配置适当的打印机、本地 PDF 文件或通过 Google Drive 云端。从\
  \ Android 应用开发者的角度来看，通过打印框架（Printing framework），可以在应用程序中使用这些功能。目前最容易实现的打印选项是涉及图像和\
  \ HTML 格式的内容。然而，更高级的打印可以使用框架的自定义文档打印功能来实现。\n\n## 77. 一个 Android HTML 和 Web 内容打印示例\n\
  \n正如上一章“使用 Android 打印框架进行打印”中概述的，Android 打印框架可以用于打印网页和动态创建的 HTML 内容。虽然这两种打印方法之间有许多相似之处，但也存在一些需要考虑的细微差别。本章将通过创建两个示例应用程序，来对这两种打印选项提供清晰的说明。\n\
  \n### 77.1 创建 HTML 打印示例应用程序\n\n从欢迎屏幕上选择 `New Project`选项，在弹出的新项目对话框中，点击 `Next` 按钮之前选择\
  \ `Empty Activity` 模板。\n\n在 `Name` 字段中输入 `HTMLPrint`，并指定 `com.ebookfrenzy.htmlprint`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将\
  \ `Language` 菜单改为 `Java`。\n\n## 77.2 打印动态 HTML 内容\n\n教程的第一阶段是向项目添加代码以创建某些 HTML 内容，并以打印作业的形式发送给打印框架。\n\
  \n首先找到 `MainActivity.java` 文件（位于 Project 工具窗口的 `app` -> `java` -> `com.ebookfrenzy.htmlprint`\
  \ 下），并将其加载到编辑面板。加载后，修改代码使其读取内容如下列表所示：\n\n```java\npackage com.ebookfrenzy.htmlprint;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\nimport android.os.Bundle;\n\
  import android.webkit.WebView;\nimport android.webkit.WebViewClient;\nimport android.webkit.WebResourceRequest;\n\
  import android.print.PrintAttributes;\nimport android.print.PrintDocumentAdapter;\n\
  import android.print.PrintManager;\nimport android.content.Context;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n\n    private WebView myWebView;\n\n\
  \    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n     \
  \   super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_htmlprint);\n\
  \        printWebView();\n    }\n\n    private void printWebView() {\n        WebView\
  \ webView = new WebView(this);\n        webView.setWebViewClient(new WebViewClient()\
  \ {\n            public boolean shouldOverrideUrlLoading(WebView view,\n       \
  \                                            WebResourceRequest request) {\n   \
  \             return false;\n            }\n            @Override\n            public\
  \ void onPageFinished(WebView view, String url) {\n                createWebPrintJob(view);\n\
  \                myWebView = null;\n            }\n        });\n        String htmlDocument\
  \ =\n            \"<html><body><h1>Android Print Test</h1><p>\"\n            + \"\
  This is some sample content.</p></body></html>\";\n        webView.loadDataWithBaseURL(null,\
  \ htmlDocument, \"text/HTML\", \"UTF-8\", null);\n        myWebView = webView;\n\
  \    }\n}\n```\n\n代码更改从声明变量 `myWebView` 开始，其中将存储 `WebView` 的引用。在 `onCreate()` 方法中，创建了一个\
  \ `WebView` 实例，并为其分配了一个 `WebViewClient`。分配给 web 对象的 `WebViewClient` 配置为：通过从 `shouldOverrideUrlLoading()`\
  \ 方法返回 `false` 来表示处理 HTML 的加载。更重要的是，声明并实现了一个 `onPageFinished()` 处理器来调用 `createWebPrintJob()`。当所有\
  \ HTML 加载完成后，`onPageFinished()` 方法将被自动调用。接下来，创建一个包含某些 HTML 的 String 对象作为内容，随后将其加载到\
  \ web view 中。最后，该方法将 web 对象的引用存储在之前定义的 `myWebView` 中。如果没有这至关重要的一步，极可能会导致 Java 运行时假设应用程序不再需要它并将其丢弃以释放内存，导致打印作业终止。\n\
  \n示例中剩下的就是实现 `createWebPrintJob()` 方法，该方法目前配置为由 `onPageFinished()` 回调方法调用。因此，在 `MainActivity.java`\
  \ 文件中，实现该方法使其读取如下：\n\n```java\nprivate void createWebPrintJob(WebView view) {\n\
  \    PrintManager printManager = (PrintManager) this\n        .getSystemService(Context.PRINT_SERVICE);\n\
  \    PrintDocumentAdapter printAdapter =\n        view.createPrintDocumentAdapter(\"\
  MyDocument\");\n    String jobName = getString(R.string.app_name) + \" Print Test\"\
  ;\n    printManager.print(jobName, printAdapter, new PrintAttributes.Builder().build());\n\
  }\n```\n\n此方法获取 `PrintManager` 服务的引用，并指示 web view 实例创建一个打印适配器。创建一个新的字符串来存储打印作业名称（在此例中，基于应用程序名称和“Print\
  \ Test”字）。最后，通过调用打印管理器的 `print()` 方法启动打印作业，传递作业名称、打印适配器和一组默认打印属性。\n\n在运行 Android\
  \ 5.0 或更高版本的设备或模拟器上编译并运行该应用程序。启动后，标准的 Android 打印页面将如图 77-1 所示所示。\n\n![](img/Image24256.jpg)\n\
  \n图 77-1\n\n\n\n\n如果你配置了物理打印机，可以将其打印到打印机；或者保存到 `Google Drive`，亦可以选择选项保存为 PDF 文件。一旦启动打印任务，请在所选的目标位置检查生成的输出。请注意，当使用\
  \ `Save to PDF` 选项时，系统会请求 PDF 文件的名称和位置。`Downloads` 文件夹是一个不错的选择，可以通过点击设备上其他应用图标中的\
  \ `Downloads` 图标（在 Android 8 上重命名为 `Files`）来查看其内容。\n\n## 77.3 创建网页打印示例\n\n本章将创建的第二个示例程序将用户提供一个\
  \ `Overflow` 菜单选项，用于打印当前在 `WebView` 实例中显示的网页。\n\n欢迎屏幕选择 `New Project` 选项，在弹出的新项目对话框中，点击\
  \ `Next` 按钮之前选择 `Basic Activity` 模板。\n\n在 `Name` 字段中输入 `WebPrint`，并指定 `com.ebookfrenzy.webprint`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将\
  \ `Language` 菜单改为 `Java`。\n\n## 77.4 移除浮操作按钮\n\n选择 `Basic Activity` 模板提供了一个上下文菜单和一个浮操作按钮。由于应用不需要该浮操作按钮，可以在继续之前将其移除。将\
  \ `activity_main.xml` 布局文件加载到 `Layout Editor` 中，选择浮操作按钮并按键盘 `Delete` 键从布局中移除该对象。编辑\
  \ `MainActivity.java` 文件，从 `onCreate` 方法中移除浮操作按钮的代码，如下：\n\n```java\n@Override\n\
  protected void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    binding = ActivityMainBinding.inflate(getLayoutInflater());\n    setContentView(binding.getRoot());\n\
  \    setSupportActionBar(binding.toolbar);\n\n    binding.fab.setOnClickListener(new\
  \ View.OnClickListener() {\n        @Override\n        public void onClick(View\
  \ view) {\n            Snackbar.make(view, \"Replace with your own action\",\n \
  \                   Snackbar.LENGTH_LONG)\n                .setAction(\"Action\"\
  , null).show();\n        }\n    });\n}\n```\n\n## 77.5 移除导航功能\n\n正如“Android Studio\
  \ Layout Editor 工具指南”中所述，`Basic Activity` 模板包含多个 fragment 和按钮，用于在不同 fragment 之间进行导航。对于本教程而言，这些功能是不必要的，如果不移除，稍后将会导致问题。在继续教程之前，按照如下方式修改项目：\n\
  \n1. 在 `Project` 工具窗口中，导航到并双击 `app -> res -> navigation -> nav_graph.xml` 文件，将其加载到导航编辑器中。\n\
  2. 在编辑器中，在图表面板中选择 `SecondFragment` 条目，并按键盘删除 键将其从图表中移除。\n3. 找到并删除 `SecondFragment.java`\
  \ (`app -> java -> <package name> -> SecondFragment`) 和 `fragment_second.xml` (`app\
  \ -> res -> layout -> fragment_second.xml`) 文件。\n4. 找到 `FirstFragment.java` 文件，双击它将其加载到编辑器，并移除\
  \ `onViewCreated()` 方法中的代码，使其内容如下所示：\n\n```java\npublic void onViewCreated(@NonNull\
  \ View view, Bundle savedInstanceState) {\n    super.onViewCreated(view, savedInstanceState);\n\
  \    binding.buttonFirst.setOnClickListener(new View.OnClickListener() {\n     \
  \   @Override\n        public void onClick(View view) {\n            NavHostFragment.findNavController(FirstFragment.this)\n\
  \                .navigate(R.id.action_FirstFragment_to_SecondFragment);\n     \
  \   }\n    });\n}\n```\n\n5. 编辑 `MainActivity.java` 文件并移除以下导航代码：\n\n```java\n@Override\n\
  protected void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    binding = ActivityMainBinding.inflate(getLayoutInflater());\n    setContentView(binding.getRoot());\n\
  \    setSupportActionBar(binding.toolbar);\n    NavController navController = Navigation.findNavController(this,\
  \ R.id.nav_host_fragment);\n    AppBarConfiguration appBarConfiguration = new AppBarConfiguration.Builder(R.id.nav_main).build();\n\
  \    NavigationUI.setupWithNavController(this, navController, appBarConfiguration);\n\
  }\n\n@Override\npublic boolean onSupportUp() {\n    NavController navController\
  \ = Navigation.findNavController(this, R.id.nav_host_fragment);\n    return NavigationUI.navigateUp(navController,\
  \ appBarConfiguration);\n}\n```\n\n## 77.6 设计用户界面\n\n将 `content_main.xml` 布局文件加载到\
  \ `Layout Editor` 中。在 Design 模式下，选择 `nav_host_fragment`。从 `Widgets` 调板中将 `WebView`\
  \ 对象拖放到中心。使用 `Attributes` 窗口更改 `layout_width` 和 `layout_height` 属性以匹配布局。\n\n在继续后续步骤之前，需要向项目添加额外的权限，以允许\
  \ `WebView` 对象访问互联网。通过在 `Project` 窗口中找到 `AndroidManifest.xml` 文件并双击它来添加。一旦加载，编辑其内容：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    package=\"com.ebookfrenzy.webprint\"\
  >\n    <uses-permission android:name=\"android.permission.INTERNET\" />\n    <application\n\
  \        allowBackup=\"true\">\n```\n\n## 77.7 在 MainActivity 中访问 WebView\n\n正如“Android\
  \ RecyclerView 和 CardView”章节中的项目一样，我们需要使用绑定 从 `MainActivity` 类访问包含在 `content_main.xml`\
  \ 文件中的组件（此处为 `WebView`）。为了能够访问 `content_main.xml` 中的视图，我们再次需要在包含处为其分配一个 ID。编辑 `activity_main.xml`\
  \ 文件，修改 `include` 元素如下：\n\n```xml\n<include\n    android:id=\"@+id/contentMain\"\
  \n    layout=\"@layout/content_main\" />\n```\n\n## 77.8 将网页加载到 WebView\n\n在打印网页之前，需要将其加载到\
  \ `WebView` 实例。对于本教程，这将通过调用 `WebView` 实例的 `loadUrl()` 方法来实现，该调用将放在一个名为 `configureWebView()`\
  \ 方法中，并在 `MainActivity` 类的 `onStart()` 方法中调用。因此，编辑 `MainActivity.java` 文件并修改如下：\n\
  \n```java\npackage com.ebookfrenzy.webprint;\n\nimport android.view.Menu;\nimport\
  \ android.view.MenuItem;\nimport android.webkit.WebView;\nimport android.webkit.WebViewClient;\n\
  import android.webkit.WebResourceRequest;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private WebView myWebView;\n\n    @Override\n    protected void onStart()\
  \ {\n        super.onStart();\n        configureWebView();\n    }\n\n    private\
  \ void configureWebView() {\n        myWebView = findViewById(R.id.myWebView);\n\
  \        myWebView.setWebViewClient(new WebViewClient(){\n            @Override\n\
  \            public boolean shouldOverrideUrlLoading(\n```\n\n\n\n\n```java\nWebView\
  \ view, WebResourceRequest request) {\n\n    return super.shouldOverrideUrlLoading(\n\
  \                view, request);\n    }\n});\n    myWebView.loadUrl(\n         \
  \   \"https://www.answertopia.com\");\n    }\n.\n.\n}\n```\n\n## 77.9 添加打印菜单选项\n\
  \n现在，我们将使用“在 Android 上创建和管理溢出菜单”章节中概述的技术，将打印网页的添加到溢出菜单中。第一个要求是准备一个用于标记菜单选项的字符串资源。在\
  \ Project 工具窗口中，找到 `app -> res -> values -> strings.xml` 文件，双击将其加载到编辑器中并进行修改以添加一个新的字符串资源：\n\
  \n```xml\n<resources>\n    <string name=\"app_name\">WebPrint</string>\n    <string\
  \ name=\"action_settings\">Settings</string>\n    <string name=\"print_string\"\
  >Print</string>\n</resources>\n```\n\n接下来，将 `app -> res -> menu -> menu_main.xml`\
  \ 文件加载到菜单编辑器中，切换到 Code 模式，并将 Settings 菜单选项替换为打印选项：\n\n```xml\n<menu xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    tools:context=\"com.ebookfrenzy.webprint.MainActivity\" >\n    <item android:id=\"\
  @+id/action_settings\"\n        android:title=\"@string/action_settings\"\n    \
  \    android:orderInCategory=\"100\"\n        app:showAsAction=\"never\" />\n  \
  \  <item\n        android:id=\"@+id/action_print\"\n        android:orderInCategory=\"\
  100\"\n        app:showAsAction=\"never\"\n        android:title=\"@string/print_string\"\
  />\n</menu>\n```\n\n在配置菜单选项方面，剩下的工作是修改 `MainActivity.java` 文件中的 `onOptionsItemSelected()`\
  \ 处理程序方法：\n\n```java\n@Override\npublic boolean onOptionsItemSelected(MenuItem item)\
  \ {\n    int id = item.getItemId();\n    if (id == R.id.action_print) {\n      \
  \  createWebPrintJob(myWebView);\n        return true;\n    }\n    return super.onOptionsItemSelected(item);\n\
  }\n```\n\n实现 `onOptionsItemSelected()` 方法后，当从溢出菜单中选择打印菜单选项时，活动将调用名为 `createWebPrintJob()`\
  \ 的方法。该方法的实现与之前 HTMLPrint 项目中使用的相同，现在可以将其添加到 `MainActivity.java` 文件中，内容如下：\n\n```java\n\
  package com.ebookfrenzy.webprint;\n\n.\n.\n.\n\nimport android.print.PrintAttributes;\n\
  import android.print.PrintDocumentAdapter;\nimport android.print.PrintManager;\n\
  import android.content.Context;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private WebView myWebView;\n.\n.\n    private void createWebPrintJob(WebView\
  \ webView) {\n        PrintManager printManager = (PrintManager) this\n        \
  \            .getSystemService(Context.PRINT_SERVICE);\n        PrintDocumentAdapter\
  \ printAdapter =\n                    webView.createPrintDocumentAdapter(\"MyDocument\"\
  );\n        String jobName = getString(R.string.app_name) +\n                  \
  \  \" Print Test\";\n        printManager.print(jobName, printAdapter, new PrintAttributes.Builder().build());\n\
  \    }\n}\n```\n\n\n\n\n\n- `onWrite()` – 此方法在每次调用 `onLayout()` 后都会被调用，负责在待打印页面的画布上渲染内容。在其他参数中，此方法会接收一个文件描述符，渲染完成后必须将生成的\
  \ PDF 文档写入该描述符。随后，将调用 `onWriteFinished()` 回调方法，并传递一个包含待打印页范围信息的参数。在 `PrintDocumentAdapter`\
  \ 子类中，必须实现 `onWrite()` 方法。\n- `onFinish()` – 这是一个可选方法，如果实现了该方法，它将在打印过程完成后由打印框架调用一次，从而为应用程序提供了执行任何必要的清理操作的机会。\n\
  \n## 78.2 准备自定义文档打印项目\n\n从欢迎界面选择 `New Project`（新建项目）选项，在弹出的新项目对话框，点击 `Next` 按钮之前选择\
  \ `Empty Activity`（空活动）模板。\n\n在 `Name` 字段输入 `CustomPrint`，并指定 `com.ebookfrenzy.customprint`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level`（最低 API 级别）设置改为 `API 26: Android 8.0\
  \ (Oreo)`，并将 `Language`（语言）菜单改为 `Java`。\n\n将 `activity_main.xml` 布局文件加载到 `Layout\
  \ Editor` 工具中，并在 `Design` 模式下选择并删除“Hello World!” `TextView` 对象。从面板的 `Form Widgets`\
  \ 部分拖入一个 `Button` 视图并将其放置在布局视图的中心。选中 `Button` 视图后，将文本属性更改为“Print Document”，并将字符串提取到新资源中。完成后，用户界面布局应与图\
  \ 78-1 所示：\n\n![](img/as_4.1_custom_print_ui.jpg)\n\n图 78-1\n\n当在应用程序中选中按钮时，需要调用一个方法来启动文档打印过程。保持在\
  \ `Attributes` 工具窗口中，将 `onClick` 属性设置为调用名为 `printDocument` 的方法。\n\n## 78.3 创建自定义打印适配器\n\
  \n在 Android 应用程序内部打印自定义文档的大部分工作涉及自定义打印适配器的实现。本示例将需要一个实现了 `onLayout()` 和 `onWrite()`\
  \ 回调方法的打印适配器。在 `MainActivity.java` 文件中添加此新类的模板，使其内容如下：\n\n```java\npackage com.ebookfrenzy.customprint;\n\
  \nimport android.os.CancellationSignal;\nimport android.os.ParcelFileDescriptor;\n\
  import android.print.PageRange;\nimport android.print.PrintAttributes;\nimport android.print.PrintDocumentAdapter;\n\
  import android.content.Context;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    public static class MyPrintDocumentAdapter extends PrintDocumentAdapter\
  \ {\n        Context context;\n\n        MyPrintDocumentAdapter(Context context)\
  \ {\n            this.context = context;\n        }\n\n        @Override\n     \
  \   public void onLayout(PrintAttributes oldAttributes,\n                      \
  \       PrintAttributes newAttributes,\n                             CancellationSignal\
  \ cancellationSignal,\n                             LayoutResultCallback callback,\n\
  \                             Bundle metadata) {\n        }\n\n        @Override\n\
  \        public void onWrite(final PageRange[] pageRanges,\n                   \
  \         final ParcelFileDescriptor destination,\n                            final\
  \ CancellationSignal cancellationSignal,\n                            WriteResultCallback\
  \ callback) {\n        }\n    }\n}\n```\n\n目前该新类包含一个构造方法，该方法会在创建类的新实例时被调用。构造方法将调用空活动的\
  \ `context` 作为参数，并将其存储，以便稍后在两个回调方法中引用。在建立类结构后，下一步是开始实现两个回调方法，从 `onLayout()` 开始。\n\
  \n## 78.4 实现 onLayout() 方法\n\n继续留在 `MainActivity.java` 文件中，开始添加 `onLayout()` 方法中的代码所需的某些导入语句：\n\
  \n```java\npackage com.ebookfrenzy.customprint;\n\nimport android.print.PrintDocumentInfo;\n\
  import android.print.pdf.PrintedPdf;\nimport android.graphics.pdf.PdfDocument;\n\
  \npublic class MainActivity extends AppCompatActivity {\n```\n\n接下来，修改 `MyPrintDocumentAdapter`\
  \ 类，声明在 `onLayout()` 方法中使用的变量：\n\n```java\npublic static class MyPrintDocumentAdapter\
  \ extends PrintDocumentAdapter {\n    Context context;\n    int pageHeight;\n  \
  \  int pageWidth;\n    PdfDocument myPdfDocument;\n    int totalpages = 4;\n}\n\
  ```\n\n请注意，为了本示例的演示，将打印一个四页的文档。在更复杂的情况下，应用程序可能需要根据内容的数量、布局相对于用户纸张尺寸和页面方向的关系，动态计算要打印的页数。声明变量后，按照以下代码概述实现\
  \ `onLayout()` 方法：\n\n```java\n@Override\npublic void onLayout(PrintAttributes oldAttributes,\n\
  \                     PrintAttributes newAttributes,\n                     CancellationSignal\
  \ cancellationSignal,\n                     LayoutResultCallback callback,\n   \
  \                  Bundle metadata) {\n    myPdfDocument = new PrintedPdfDocument(context,\
  \ newAttributes);\n    pageHeight = newAttributes.getMediaSize().getHeightMils()/1000\
  \ * 72;\n    pageWidth = newAttributes.getMediaSize().getWidthMils()/1000 * 72;\n\
  \    if (cancellationSignal.isCanceled()) {\n        callback.onLayoutCancelled();\n\
  \        return;\n    }\n    if (totalpages > 0) {\n        PrintDocumentInfo.Builder\
  \ builder = new PrintDocumentInfo.Builder(\"print_output.pdf\")\n              \
  \  .setContentType(PrintDocumentInfo.CONTENT_TYPE_DOCUMENT)\n                .setPageCount(totalpages);\n\
  \        PrintDocumentInfo info = builder.build();\n        callback.onLayoutFinished(info,\
  \ true);\n    } else {\n        callback.onLayoutFailed(\"Page count is zero.\"\
  );\n    }\n}\n```\n\n显然，此方法执行了相当许多任务，每项任务都需要详细的解释。\n\n首先，以 `PdfDocument` 类实例的形式创建了一个新的\
  \ PDF 文档。当打印框架调用 `onLayout()` 方法时，传入的参数之一是 `PrintAttributes` 类型的对象，它包含了用户为打印输出选择的纸张尺寸、分辨率和颜色设置的细节。这些设置在创建\
  \ PDF 文档时会被使用，同时还有我们的构造方法预先存储的活动 `context`：\n\n`myPdfDocument = new PrintedPdfDocument(context,\
  \ newAttributes);`\n\n然后，该方法使用 `PrintAttributes` 对象提取文档页的高度和宽度值。这些维度在对象中以千分之一英寸为单位存储。由于本示例中稍后使用这些值的方法是以\
  \ 1/72 英寸为单位运行的，因此这些数字在存储之前经过了转换：\n\n`pageHeight = newAttributes.getMediaSize().getHeightMils()/1000\
  \ * 72;`\n\n`pageWidth = newAttributes.getMediaSize().getWidthMils()/1000 * 72;`\n\
  \n尽管本示例没有利用用户的颜色选择，但可以通过调用 `PrintAttributes` 对象的 `getColorMode()` 方法获取此属性，该方法将返回\
  \ `COLOR_MODE_COLOR` 或 `COLOR_MODE_MONOCHROME` 值之一。\n\n\n\n\n当 `onLayout()` 方法被调用时，它会接收一个类型为\
  \ `LayoutResultCallback` 的对象。该对象为方法提供了一组通过向打印框架（Printing framework）传回状态信息的方法。例如，当用户取消打印进程时，会调用\
  \ `onLayout()` 方法。进程已取消这一事实通过 `CancellationSignal` 参数中的一个设置来指示。在检测到取消操作时，`onLayout()`\
  \ 方法必须调用 `LayoutResultCallback` 对象的 `onLayoutCancelled()` 方法，以通知打印框架已收到了取消请求，且布局任务已取消：\n\
  \n```java\nif (cancellationSignal.isCanceled() ) {\n    callback.onLayoutCancelled();\n\
  \    return;\n}\n```\n\n当布局工作完成后，该方法需要调用 `LayoutResultCallback` 对象的 `onLayoutFinished()`\
  \ 方法，并传递两个参数。第一个参数的形式为 `PrintDocumentInfo` 对象，其中包含了要打印文档的信息。这些信息包括了用于 PDF 文档的名称、内容类型（在此情况下是文档而非图像）以及页数。第二个参数是一个布尔值，表示自上一次调用\
  \ `onLayout()` 方法以来布局是否发生了变化：\n\n```java\nif (totalpages > 0) {\n    PrintDocumentInfo.Builder\
  \ builder = new PrintDocumentInfo\n            .Builder(\"print_output.pdf\")\n\
  \            .setContentType(\n                PrintDocumentInfo.CONTENT_TYPE_DOCUMENT)\n\
  \            .setPageCount(totalpages);\n    PrintDocumentInfo info = builder.build();\n\
  \    callback.onLayoutFinished(info, true);\n} else {\n    callback.onLayoutFailed(\"\
  Page count is zero.\");\n}\n```\n\n如果页数为零，代码将通过调用 `LayoutResultCallback` 对象的 `onLayoutFailed()`\
  \ 方法向打印框架报告此失败。\n\n调用 `onLayoutFinished()` 方法会通知打印框架布局工作已完成，从而触发对 `onWrite()` 方法的调用。\n\
  \n## 78.5 实现 onWrite() 回调方法\n\n`onWrite()` 回调方法负责渲染文档页面，然后通知打印框架文档已准备好打印。完成后，`onWrite()`\
  \ 方法的实现如下：\n\n```java\npackage com.ebookfrenzy.customprint;\n\nimport java.io.FileOutputStream;\n\
  import java.io.IOException;\n.\n.\nimport android.graphics.pdf.PdfDocument.PageInfo;\n\
  .\n.\n\n@Override\npublic void onWrite(final PageRange[] pageRanges,\n         \
  \           final ParcelFileDescriptor destination,\n                    final CancellationSignal\
  \ cancellationSignal,\n                    final WriteResultCallback callback) {\n\
  \    for (int i = 0; i < totalpages; i++) {\n            if (pageInRange(pageRanges,\
  \ i)) {\n                PageInfo newPage = new PageInfo.Builder(pageWidth,\n  \
  \                      pageHeight, i).create();\n                PdfDocument.Page\
  \ page =\n                        myPdfDocument.startPage(newPage);\n          \
  \      if (cancellationSignal.isCanceled()) {\n                    callback.onWriteCancelled();\n\
  \                    myPdfDocument.close();\n                    myPdfDocument =\
  \ null;\n                    return;\n                }\n                drawPage(page,\
  \ i);\n                myPdfDocument.finishPage(page);\n            }\n    }\n \
  \   try {\n        myPdfDocument.writeTo(new FileOutputStream(\n               \
  \ destination.getFileDescriptor()));\n    } catch (IOException e) {\n        callback.onWriteFailed(e.toString());\n\
  \        return;\n    } finally {\n        myPdfDocument.close();\n        myPdfDocument\
  \ = null;\n    }\n    callback.onWriteFinished(pageRanges);\n}\n```\n\n`onWrite()`\
  \ 方法从循环遍历文档中的每一页开始。然而，重要的是，用户可能并没有请求打印组成文档的所有页面。事实上，打印框架的用户面板提供了选项，允许指定打印某些页面或页页码范围。图\
  \ 78-2 显示了配置为打印第 1-4 页、第 9 页以及第 1-13 页的打印。\n\n在将页面写入 PDF 文档时，`onWrite()` 方法必须采取措施确保用户指定的那些页面被打印。为了实现这一点，打印框架通过参数传递一个\
  \ `PageRange` 对象数组，指示要打印的页码范围。在上面的 `onWrite()` 实现中，会对每一页调用名为 `pagesInRange()` 的方法，以验证该页是否在指定的范围内。`pagesInRange()`\
  \ 方法的代码将在本章稍后部分实现。\n\n```java\nfor (int i = 0; i < totalpages; i++) {\n    if (pageInRange(pageRanges,\
  \ i)) {\n        // 对于位于任何指定范围内的每一页，都会创建一个新的 PdfDocument.Page 对象。 \n        // 在创建新页面时，之前由\
  \ onLayout() 方法存储的高度和宽度值 \n        // 将作为参数传递，以便使页面大小与用户选择的打印选项匹配：\n        PageInfo\
  \ newPage = new PageInfo.Builder(pageWidth, pageHeight, i).create();\n        PdfDocument.Page\
  \ page = myPdfDocument.startPage(newPage);\n        \n        // 与 onLayout() 方法一样，onWrite()\
  \ 方法需要响应取消请求。 \n        // 在这种情况下，代码通知打印框架已执行取消，\n        // 在关闭并释放 myPdfDocument\
  \ 变量之前：\n        if (cancellationSignal.isCanceled()) {\n            callback.onWriteCancelled();\n\
  \            myPdfDocument.close();\n            myPdfDocument = null;\n       \
  \     return;\n        }\n        \n        // 只要打印进程没有取消，方法就会调用一个方法在当前页面上绘制\n \
  \       // 内容，然后调用 myPdfDocument 对象的 finishPage 方法。\n        drawPage(page, i);\n\
  \        myPdfDocument.finishPage(page);\n    }\n}\n```\n\n`drawPage()` 方法负责在页面上绘制内容，将在\
  \ `onWrite()` 方法完成后实现。\n\n当足够的页面已添加到 PDF 文档后，文档将写入写入作为 `onWrite()` 方法参数传递的文件描述符流。如果由于任何原因写入操作失败，方法将通过调用\
  \ `WriteResultCallback` 对象的 `onWriteFailed()` 方法通知框架（该对象也是作为参数传递给 `onWrite()` 方法的）。\n\
  \n```java\ntry {\n    myPdfDocument.writeTo(new FileOutputStream(\n            destination.getFileDescriptor()));\n\
  } catch (IOException e) {\n    callback.onWriteFailed(e.toString());\n    return;\n\
  } finally {\n    myPdfDocument.close();\n    myPdfDocument = null;\n}\n```\n\n最后，调用\
  \ `WriteResultsCallback` 对象的 `onWriteFinish()` 方法通知打印框架文档已准备好打印。\n\n## 78.6 检查页面在范围内\n\
  \n如所述，当 `onWrite()` 方法被调用时，它会接收一个 `PageRange` 对象数组，指示要打印的文档页码范围。`PageRange` 类设计用于存储页码范围的起始和结束页，这些页可以通过该类的\
  \ `getStart()` 和 `getEnd()` 方法进行访问。\n\n\n\n\n当在上一节中实现 `onWrite()` 方法时，调用了一个名为 `pageInRange()`\
  \ 的方法，该方法接受一个 `PageRange` 对象的数组和一个页码数字作为参数。`pageInRange()` 方法的作用是识别指定的页码是否在指定的范围内，可以如下所示在\
  \ `MainActivity.java` 类的 `MyPrintDocumentAdapter` 类中实现：\n\n```java\npublic class\
  \ MyPrintDocumentAdapter extends PrintDocumentAdapter {\n\n.\n.\n\n    private boolean\
  \ pageInRange(PageRange[] pageRanges, int page) {\n        for (PageRange pageRange\
  \ : pageRanges) {\n            if ((page >= pageRange.getStart()) &&\n         \
  \       (page <= pageRange.getEnd()))\n                return true;\n        }\n\
  \        return false;\n    }\n.\n.\n}\n```\n\n## 78.7 在页面画布（Canvas）上绘制内容\n\n现在已经到了需要编写某些代码在页面上绘制内容的阶段，以便它们准备好打印。所绘制的内容完全取决于特定的应用程序，并且仅限于\
  \ Android `Canvas` 类所能实现的功能。然而，出于本示例的考虑，我们将在画布上绘制一些简单的文本和图形。\n\n`onWrite()` 方法被设计为调用名为\
  \ `drawPage()` 的方法，该方法接受当前页面的 `PdfDocument.Page` 对象和一个代表页码的整数作为参数。在 `MainActivity.java`\
  \ 文件中，该方法应该实现如下：\n\n```java\npackage com.ebookfrenzy.customprint;\n\n.\n.\n\nimport\
  \ android.graphics.Canvas;\nimport android.graphics.Color;\nimport android.graphics.Paint;\n\
  \npublic class MainActivity extends AppCompatActivity {\n.\n.\n\n    public static\
  \ class MyPrintDocumentAdapter extends PrintDocumentAdapter {\n.\n.\n\n        private\
  \ void drawPage(PdfDocument.Page page, int pagenumber) {\n            Canvas canvas\
  \ = page.getCanvas();\n            pagenumber++; // 确保页码从 1 开始\n\n            int\
  \ titleBaseLine = 72;\n            int leftMargin = 54;\n            Paint paint\
  \ = new Paint();\n            paint.setColor(Color.BLACK);\n            paint.setTextSize(40);\n\
  \            canvas.drawText(\n                \"Test Print Document Page \" + pagenumber,\n\
  \                leftMargin,\n                titleBaseLine,\n                paint);\n\
  \            paint.setTextSize(4);\n            canvas.drawText(\"This is some content\
  \ to verify that custom printing works\", leftMargin, titleBaseLine + 35, paint);\n\
  \            if (pagenumber % 2 == 0)\n                paint.setColor(Color.RED);\n\
  \            else\n                paint.setColor(Color.GREEN);\n            PageInfo\
  \ pageInfo = page.getInfo();\n            canvas.drawCircle(\n                pageInfo.getPageWidth()/2f,\n\
  \                pageInfo.getPageHeight()/2f,\n                150,\n          \
  \      paint);\n        }\n.\n.\n}\n```\n\n代码中的页码计数从 0 开始。由于文档从第 1 页开始，因此该方法首先增加存储的页码。然后获取与页面相关的\
  \ `Canvas` 对象的引用，并声明了一些边距和基线值：\n\n```java\nCanvas canvas = page.getCanvas();\npagenumber++;\n\
  int titleBaseLine = 72;\nint leftMargin = 54;\n```\n\n接下来，代码创建了用于绘制的 `Paint` 和 `Color`\
  \ 对象，设置文本大小并绘制页面标题文本，包括当前的页码：\n\n```java\nPaint paint = new Paint();\npaint.setColor(Color.BLACK);\n\
  paint.setTextSize(40);\ncanvas.drawText(\"Test Print Document Page \" + pagenumber,\
  \ leftMargin, titleBaseLine, paint);\n```\n\n然后减小文本大小并在标题下方绘制一些正文：\n\n```java\n\
  paint.setTextSize(14);\ncanvas.drawText(\"This is some content to verify that custom\
  \ printing works\", leftMargin, titleBaseLine + 35, paint);\n```\n\n该方法执行的最后一个任务是绘制一个圆（偶数页红色，奇数页绿色）。在确定页面是奇是偶后，该方法获取页面的高度和宽度，然后使用这些信息将圆放置在页面中心：\n\
  \n```java\nif (pagenumber % 2 == 0)\n    paint.setColor(Color.RED);\nelse\n    paint.setColor(Color.GREEN);\n\
  PageInfo pageInfo = page.getInfo();\ncanvas.drawCircle(\n    pageInfo.getPageWidth()/2f,\n\
  \    pageInfo.getPageHeight()/2f,\n    150,\n    paint);\n```\n\n在画布上绘制完成后，该方法将控制权交回\
  \ `onWrite()` 方法。随着 `drawPage()` 方法的完成，`MyPrintDocumentAdapter` 类编写完成。\n\n## 78.8\
  \ 启动打印任务\n\n当用户点击“打印文档”按钮时，将调用 `printDocument()` onClick 处理方法。因此，在开始测试之前，剩下的工作是将此方法添加到\
  \ `MainActivity.java` 文件中，特别要确保将其放置在 `MyPrintDocumentAdapter` 类之外：\n\n```java\n\
  package com.ebookfrenzy.customprint;\n\n.\n.\n\nimport android.print.PrintManager;\n\
  import android.view.View;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    public void printDocument(View view) {\n        PrintManager printManager\
  \ = (PrintManager) this.getSystemService(Context.PRINT_SERVICE);\n        String\
  \ jobName = this.getString(R.string.app_name) + \" Document\";\n        printManager.print(jobName,\
  \ new MyPrintDocumentAdapter(this), null);\n    }\n.\n.\n}\n```\n\n该方法首先获取设备上运行的打印服务的引用，然后创建一个作为打印任务名称的\
  \ `String` 对象。最后，调用 Print Manager 的 `print()` 方法来启动打印任务，传递 `jobName` 和自定义打印适配器类的实例。\n\
  \n## 78.9 测试应用程序\n\n在运行 Android 4.4 或更高版本的 Android 设备或模拟器上编译并运行应用程序。当应用程序加载后，触摸“打印文档”按钮启动打印任务，并为输出选择合适的目标（保存为\
  \ PDF 选项非常有用的选项，可以避免浪费纸张和打印墨水）。\n\n检查打印输出，它应该是包含文本和图形的 4 页内容。例如图 78-3 显示了以 PDF 文件形式保存在设备上的四个页面。\n\
  \n尝试其他的打印配置选项，例如更改纸张大小、方向和页面设置。每个设置更改都应该反映在打印输出中，表明自定义打印适配器工作正常。\n\n![](img/as_4.1_custom_print_running.jpg)\n\
  \n图 78-3\n\n## 78.10 总结\n\n虽然比 Android 框架的 HTML 和图像打印选项实现起来复杂，但自定义打印在 Android 应用程序内部打印复杂内容提供了极大的灵活性。实现自定义打印的大部分工作涉及创建一个自定义打印适配器类，使其不仅能在文档页面上绘制内容，而且在用户更改如纸张大小和打印页面范围等打印设置时做出正确响应。\n\
  \n## 79. Android App Links 简介\n\n\n\n\n随着技术的演进，网页内容与移动内容之间的传统区别开始变得模糊。这一点在一个领域为为：日益流行的渐进式\
  \ Web 应用（progressive web apps），这类 Web 应用在外观和行为上与传统的移动应用非常相似。\n\n另一个趋势是让移动应用中的内容可以通过网页搜索和\
  \ URL 链接被发现。在 Android 应用开发背景下，`App Links` 功能专门设计用于让用户即使在没有安装该应用的情况下，也能更容易地发现和访问存储在\
  \ Android 应用中的内容。\n\n## 79.1 Android App Links 概述\n\n应用链接（app link）是一个标准的 HTTP URL，旨在作为从网站或应用等外部直接链接到应用中特定位置的便捷方式。应用链接（也称为深度链接\
  \ deep links）主要用于鼓励用户与应用交互并允许用户分享应用内容。\n\n应用链接的实现是一个多步骤过程，涉及在项目清单文件（manifest）中添加\
  \ `intent filters`、在关联的应用 Activity 中实现链接处理代码，以及使用数字资产文件（digital assets files）将应用与网页内容关联。\n\
  \n这些步骤既可以通过手动修改项目中的内容来完成，也可以使用 Android Studio App Links 助手（App Links Assistant）自动完成。\n\
  \n本章剩余部分将从项目需要进行的更改方面概述应用链接的实现。下一章(“Android Studio App Links 教程”) 将演示如何使用 App Links\
  \ 助手来实现相同的结果。\n\n## 79.2 App Link Intent Filters\n\n应用链接 URL 需要映射到应用项目中的特定 Activity。这是通过在项目的\
  \ `AndroidManifest.xml` 文件中添加 `intent filters` 实现的，这些过滤器旨在响应 `android.intent.action.VIEW`\
  \ 来启动 Activity。`intent filters` 声明在要启动的 Activity 元素内部，并且包含概述应用链接 URL 的方案（scheme）、主机（host）和路径（path）的数据。例如，下面的清单片段声明了当检测到匹配\
  \ `http://www.example.com/welcome` 的应用链接时启动一个名为 `MyActivity` 的 Activity：\n\n```xml\n\
  <activity android:name=\"com.ebookfrenzy.myapp.MyActivity\">\n    <intent-filter>\n\
  \        <action android:name=\"android.intent.action.VIEW\" />\n        <category\
  \ android:name=\"android.intent.category.DEFAULT\" />\n        <category android:name=\"\
  android.intent.category.BROWSABLE\" />\n        <data\n            android:scheme=\"\
  http\"\n            android:host=\"www.example.com\"\n            android:pathPrefix=\"\
  /welcome\" />\n    </intent-filter>\n</activity>\n```\n\n处理歧义 intent filters 的顺序可以使用\
  \ intent filter 标签的 `order` 属性指定，如下所示：\n\n```xml\n<application>\n    <activity android:name=\"\
  \ com.ebookfrenzy.myapp.MyActivity\">\n        <intent-filter android:order=\"1\"\
  >\n.\n.\n```\n\n`intent filter` 会导致应用链接启动正确的 Activity，但仍需要在目标 Activity 中实现代码以恰当地处理\
  \ intent。\n\n## 79.3 处理 App Link Intents\n\n在大多数情况下，启动的 Activity 需要访问应用链接 URL，并根据\
  \ URL 的结构采取特定操作。接上上面的示例，当 Activity 通过包含路径 `/welcome/newuser` 的 URL 启动时，其显示的内容可能与路径设置为\
  \ `/welcome/existinguser` 的 URL 启动时显示的内容不同。\n\n当 Activity 由链接启动时，它会接收到一个包含启动 Activity\
  \ 操作数据的 `intent` 对象，其中包含一个包含应用链接 URL 的 `Uri` 对象。在 Activity 的初始化阶段，可以添加代码来提取这些数据：\n\
  \n```java\nIntent appLinkIntent = getIntent();\nString appLinkAction = appLinkIntent.getAction();\n\
  Uri appLinkData = appLinkIntent.getData();\n```\n\n获取应用链接的 `Uri` 后，可以使用构成 URL 路径的各种组件来对在\
  \ Activity 中执行的操作做出决策。在下面的代码示例中，URL 的最后一个组件被用于判断应该为新用户还是现有用户显示内容：\n\n```java\nString\
  \ userType = appLinkData.getLastPathSegment();\nif (userType.equals(\"newuser\"\
  )) {\n    // display new user content\n} else {\n    // display existing user content\n\
  }\n```\n\n## 79.4 应用与网站关联\n\n默认情况下，Android 会通过图 79-1 所示的面板为用户提供处理应用链接的选项。这通常包括 Chrome\
  \ 浏览器和目标应用。\n\n![](img/as_4.1_app_links_chooser.jpg)\n\n图 79-1\n\n为了防止这种情况发生，应用链接\
  \ URL 需要与网站关联。这是通过创建一个名为 `assetlinks.json` 的数字资产文件并将其放在 `.well-known` 文件夹中实现的。注意，数字资产链接仅适用于\
  \ https 网站。\n\n一个数字资产文件包含一个关系语句，为目标语句声明该项目的应用包名和 SHA256 证书授予权限。例如，一个典型的资产链接可能如下：\n\
  \n```json\n[\n  {\n    \"relation\": [\"delegate_permission/handle_all_urls\"],\n\
  \    \"target\": {\n      \"namespace\": \"android_app\",\n      \"package_name\"\
  : \"<app package name>\",\n      \"sha256_cert_fingerprints\": [\"<app certificate\
  \ here\"]\n    }\n  }\n]\n```\n\n`assetlinks.json` 文件可以包含多个数字资产链接，可能允许单个网站与多个应用关联。\n\
  \n## 79.5 总结\n\nAndroid App Links 允许通过来自网站或其他应用的 URL 链接启动应用 Activity。应用链接的实现项目清单中的\
  \ intent filters 与启动 Activity 中的 intent 处理代码相结合。此外，通过使用数字资产文件，可以将链接中使用的域名与相应的网站关联。一旦建立关联，当使用应用链接时，Android\
  \ 就不再需要用户选择目标应用了。\n\n# 80 Android Studio App Links 教程\n\n本章的目标是为 Android 应用链接和 Android\
  \ Studio App Links 助手提供实操演示。\n\n本章将为现有的 Android 应用添加应用链接支持，允许通过应用链接 URL 启动 Activity。除了启动\
  \ Activity 之外，显示的内容将在 URL 的路径中指定。\n\n## 80.1 关于示例应用\n\n本章使用的项目名为 `AppLink`，是一个旨在允许用户了解伦敦地标的简单应用。该应用使用标准的\
  \ Android content provider 类访问 SQLite 数据库。该应用提供了一个现有的数据库，其中包含了一些热门旅游景点的记录。除了现有的数据库条目外，该应用还允许用户添加和删除地标描述。\n\
  \n该项目由两个 Activity 组成：`AppLinkActivity` 和 `LandmarkActivity`。`AppLinkActivity` 是应用启动启动的主\
  \ Activity。该 Activity 允许用户输入搜索标准并向数据库添加额外记录。当搜索找到匹配的记录时，`LandmarkActivity` 将启动并显示相关地标的信息。\n\
  \n\n\n本章的目标是增强应用以支持应用链接（app linking），以便可以使用 URL 在应用内显示特定的地标标记记录。\n\n## 80.2 数据库结构\n\
  \n示例应用的数据包含在名为 `landmarks.db` 的文件中，该文件位于项目层级中的 `app -> assets -> databases` 文件夹。数据库包含一个名为\
  \ `locations` 的表，其结构如 表 80-1 所示：\n\n| 列 | 类型 | 描述 |\n| :--- | :--- | :--- |\n| _id\
  \ | String | 主索引，此列包含用于唯一标识数据库中地标的字符串值。 |\n| title | String | 地标的名称（例如：伦敦桥）。 |\n\
  | description | String | 地标的描述。 |\n| personal | Boolean | 表示该记录是私人的还是公共的。用户添加的所有记录此值均被设置为\
  \ true。数据库提供的现有记录被设置为 false。 |\n\n表 80-1\n\n## 80.3 加载并运行项目\n\n项目包含在位于 URL 的源码下载包的\
  \ `AppLinking` 文件夹中：\n\n[`www.ebookfrenzy.com/retail/arcticfoxjava/index.php`](https://www.ebookfrenzy.com/retail/arcticfoxjava/index.php)\n\
  \n找到文件夹后，在 Android Studio 中打开它，并在设备或模拟器上运行应用。一旦应用启动，将出现下方 图 80-1 所示的屏幕：\n\n![](img/Image24493.jpg)\n\
  \n图 80-1\n\n按照目前的实现，地标是使用位置的 ID 定位的。默认数据库配置当前包含两个由 ID `londonbridge` 和 `toweroflondon`\
  \ 引用的记录。通过在 ID 字段中输入 `londonbridge` 并点击 Find（查找）按钮来测试搜索功能。当找到匹配的记录时，将启动第二个活动（`LandmarkActivity`）并传递要显示的记录信息。这些信息以添加到\
  \ `Intent` 对象的额外数据（extra data）的形式存在。`LandmarkActivity` 使用这些信息从数据库中提取记录，并使用 图 80-2\
  \ 所示的屏幕显示给。\n\n![](img/Image24581.jpg)\n\n图 80-2\n\n## 80.4 添加 URL 映射\n\n现在应用已加载到\
  \ Android Studio 并通过测试，项目已准备好添加应用链接支持。目标是让 `LandmarkActivity` 屏幕响应应用链接点击启动并显示信息。这是通过将\
  \ URL 映射到 `LandmarkActivity` 实现的。对于此示例，URL 的格式如下：\n\n`http://<website domain>/landmarks/<landmarkId>`\n\
  \n完成所有步骤后，例如以下 URL 应该导致应用显示伦敦塔的信息：\n\n`http://www.yourdomain.com/landmarks/toweroflondon`\n\
  \n要向项目添加 URL 映射，首先使用 `Tools -> App Links Assistant` 菜单选项打开应用链接助手。打开后，助手将如 图 80-3\
  \ 所示：\n\n![](img/as_4.1_app_links_assistant.jpg)\n\n图 80-3\n\n点击 `Open URL Mapping\
  \ Editor`（打开 URL 映射编辑器）按钮开始将 URL 映射到活动。在映射屏幕中，点击 `+` 按钮（在 图 80-4 中突出显示）添加新 URL：\n\
  \n![](img/Image2473.jpg)\n\n图 80-4\n\n在 `Add URL Mapping` 对话框的 `Host` 字段中，输入您的网站域名，或者如果没有，则输入\
  \ `http://www.example.com`。\n\n`Path` 字段（标记为 图 80-5 中的 A）是声明 URL 路径组件的地方。路径必须以 `/`\
  \ 开头，因此在此字段中输入 `/landmarks`。\n\n`Path` 菜单 (B) 提供以下三个路径匹配选项：\n\n- `path` – URL 必须完全匹配\
  \ URL 的路径部分。例如，`http://example.com/landmarks`将被视为匹配。然而，`http://example.com/landmarks/londonbridge`\
  \ 不被视为匹配。\n- `pathPrefix` – 指定路径仅被视为前缀。例如，`http://example.com/landmarks/toweroflondon`。\n\
  - `pathPattern` – 允许使用正则表达式和通配符指定路径，例如 `http://example.com/landmarks/*`。\n\n由于示例中的路径是一个前缀，请选择\
  \ `pathPrefix` 选项。最后，使用 `C` 选择 `LandmarkActivity` 作为要启动的活动：\n\n![](img/Image2481.jpg)\n\
  \n图 80-5\n\n最新版本的 Android 要求同时为 HTTP 和 HTTPS 协议声明应用链接，即使只使用其中一个。在继续下一步之前，重复上述步骤以添加\
  \ HTTPS 版本的 URL。\n\n`https://<your domain>/landmarks`\n\n![](img/Image2489.jpg)\n\
  \n图 80-6\n\n## 80.5 添加意过滤器\n\n如上一章所述，需要意过滤器来允许目标活动响应应用链接启动。事实上，当添加 URL 映射时，意过滤器已自动添加到项目清单。在应用链接助手中选中\
  \ URL 映射，向下滚动屏幕直到看到意过滤器预览。预览应包含带有新添加的意过滤器的 `AndroidManifest.xml` 文件：\n\n![](img/Image2496.jpg)\n\
  \n图 80-7\n\n## 80.6 添加意处理代码\n\n到目前为止的步骤确保了响应正确格式的应用链接 URL 启动。下一步是在 `LandmarkActivity`\
  \ 类中处理意，以便从数据库中提取正确的记录并显示给用户。在修改 `LandmarkActivity.java` 文件中的代码之前，查看某些代码区域是有价值。在代码编辑器中打开\
  \ `LandmarkActivity.java` 文件并找到 `onCreate()` 和 `handleIntent()` 方法，它们目前的内容如下：\n\n\
  ```\n@Override\nprotected void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    binding = ActivityLandmarkBinding.inflate(getLayoutInflater());\n    view =\
  \ binding.getRoot();\n    setContentView(view);\n    handleIntent(getIntent());\n\
  }\n\nprivate void handleIntent(Intent intent) {\n    String landmarkId = intent.getStringExtra(AppLinkingActivity.LANDMARK_ID);\n\
  \    displayLandmark(landmarkId);\n}\n```\n\n在当前格式下，代码预期在 `Intent` 包的额外数据中找到地标 ID。由于活动现在也可以由应用链接启动，因此需要更改此代码以处理这两种情况。首先删除\
  \ `onCreate()` 方法中的 `handleIntent()` 调用：\n\n```\n@Override\nprotected void onCreate(Bundle\
  \ savedInstanceState) {\n    super.onCreate(savedInstanceState);\n    binding =\
  \ ActivityLandmarkBinding.inflate(getLayoutInflater());\n    view = binding.getRoot();\n\
  \    setContentView(view);\n}\n```\n\n\n\n\n\n```java\nhandleIntent(getIntent());\n\
  \n}\n```\n\n要添加初始的应用链接（app link）意图处理代码，请返回应用链接助手（App Links Assistant）面板，并点击步骤 2\
  \ 下列出的 `Select Activity` 按钮。在活动选择对话框中，点击 `Insert Code` 按钮之前，选择 `LandmarkActivity`\
  \ 项：\n\n![](img/Image2504.jpg)\n\n图 80-8\n\n返回 `LandmarkActivity.java` 文件，注意以下代码已插入到\
  \ `onCreate()` 方法中（注意，如果 Android Studio 无法完成此请求，您可以手动添加此代码）：\n\n```java\n// ATTENTION:\
  \ This was auto-generated to handle app links.\n\nIntent appLinkIntent = getIntent();\n\
  \nString appLinkAction = appLinkIntent.getAction();\n\nUri appLinkData = appLinkIntent.getData();\n\
  ```\n\n这段代码访问 `Intent` 对象并提取 `Action` 字符串和 `Uri`。如果活动启动是由应用链接的结果，则 action 字符串将设置为\
  \ `android.intent.action.VIEW`，这与添加到清单文件中意图过滤器（intent filter）中声明的 action 相匹配。另一方面，如果活动是由主活动中\
  \ `findLandmark()` 方法的标准意图启动代码启动的，则 action 字符串将为 `null`。通过检查赋值给 action 字符串的值，可以编写代码来识别活动启动的方式并采取适当的操作：\n\
  \n.\n\n.\n\n```java\nimport android.net.Uri;\n\n.\n\n@Override\nprotected void onCreate(Bundle\
  \ savedInstanceState) {\n    super.onCreate(savedInstanceState);\n.\n\n    // ATTENTION:\
  \ This was auto-generated to handle app links.\n    Intent appLinkIntent = getIntent();\n\
  \    String appLinkAction = appLinkIntent.getAction();\n    Uri appLinkData = appLinkIntent.getData();\n\
  \    String landmarkId = appLinkData.getLastPathSegment();\n    if (landmarkId !=\
  \ null) {\n        displayLandmark(landmarkId);\n    }\n}\n```\n\n剩下的只需在该方法中添加一些额外的代码，以识别应用链接\
  \ URL 路径中的最后一个组件，并在查询数据库时将其用作地标 ID：\n\n```java\n@Override\nprotected void onCreate(Bundle\
  \ savedInstanceState) {\n.\n\n.\n\n    // ATTENTION: This was auto-generated to\
  \ handle app links.\n    Intent appLinkIntent = getIntent();\n    String appLinkAction\
  \ = appLinkIntent.getAction();\n    Uri appLinkData = appLinkIntent.getData();\n\
  \    if (appLinkAction != null) {\n        if (appLinkAction.equals(\"android.intent.action.VIEW\"\
  )) {\n            String landmarkId = appLinkData.getLastPathSegment();\n      \
  \      if (landmarkId != null) {\n                Log.i(TAG, \"landmarkId = \" +\
  \ landmarkId);\n                displayLandmark(landmarkId);\n            }\n  \
  \      }\n    } else {\n        handleIntent(appLinkIntent);\n    }\n}\n```\n\n\
  如果 action 字符串不为 `null`，则会检查验证是否已设置为 `android.intent.action.VIEW`，然后提取 `Uri` 路径的最后一个组件。该组件随后在进行数据库查询时作为地标\
  \ ID。另一方面，如果 action 字符串为 `null`，则调用现有的 `handleIntent()` 方法从意图数据中提取 ID。\n\n识别活动启动方式的另一种选择是修改\
  \ `AppLinkingActivity.java` 文件中的 `findLandmark()` 方法，使其也通过 View 意图操作触发启动：\n\n```java\n\
  public void findLandmark(View view) {\n    if (!idText.getText().equals(\"\")) {\n\
  \        Landmark landmark =\n                dbHandler.findLandmark(idText.getText().toString());\n\
  \        if (landmark != null) {\n            Uri uri = Uri.parse(\"http://<your_domain>/landmarks/\"\
  \n                    + landmark.getID());\n            Intent intent = new Intent(Intent.ACTION_VIEW,\
  \ uri);\n            startActivity(intent);\n        } else {\n            binding.titleText.setText(\"\
  No Match\");\n        }\n    }\n}\n```\n\n这种技术的优点是不需要编写代码来识别活动是如何启动，但缺点是它可能会触发[图\
  \ 80-8] 所示的活动选择面板。\n\n\n\n\n\n尽管目前市场上只有少数 Android 设备提供面部识别功能，但可能在不久的将来，这将会变得更加普遍。针对这一点，Google\
  \ 已开始从以前以指纹为核心的 App 身份验证方法，转向一种更具通用性的方法，即“生物识别认证”（biometric authentication）。在 Android\
  \ 8 的初始版本中，这些生物识别功能仅涵盖指纹认证，但随着 Android 操作系统和 SDK 的后续发布和更新，将会发生变化。\n\n本章将提供生物识别认证的概述，以及一个详细的、分的教程，演示如何在\
  \ Android 应用项目内实现生物识别认证的实用方法。\n\n## 81.1 生物识别认证概述\n\n关键的生物识别组件是 `BiometricPrompt`\
  \ 类。该类执行了许多在早期 Android 版本中通过编写代码完成的工作，包括显示标准对话框以引导用户完成认证过程、执行认证并将结果报告给应用。该类还处理了过多的失败认证尝试，并在用户重试之前强制执行超时。\n\
  \n`BiometricPrompt` 类包含一个伴侣类 `Builder` 类，可以使用它来配置和创建 `BiometricPrompt` 实例，包括定义显示在生物识别对话框中的文本，以及对对话框中出现的取消按钮（也称为负向按钮）进行自定义。\n\
  \n`BiometricPrompt` 实例还分配了一组认证回调，这些回调将被调用以向应用提供认证操作的结果。还会使用 `CancellationSignal`\
  \ 实例来允许应用在认证处理过程中取消认证。\n\n在涵盖这些基础知识后，本章的剩余部分将在示例项目中实现基于指纹的生物识别认证。\n\n## 81.2 创建生物识别认证项目\n\
  \n从欢迎界面选择“New Project”（新建项目）选项，在出现的新项目对话框中，点击“Next”（下一步）按钮之前选择 `Empty Activity`\
  \ 模板。\n\n在 `Name` 字段中输入 `BiometricDemo`，并指定 `com.ebookfrenzy.biometricdemo` 为包名。在点击\
  \ Finish 按钮之前，将 Minimum API level（最低 API 级别）设置为 `API 29: Android 9.0 (Pie)`，并将语言菜单设置为\
  \ `Java`。\n\n## 81.3 配置设备指纹认证\n\n指纹认证仅适用于包含触摸传感器的设备，并且这些设备已采取适当的配置步骤来保护设备并录入至少一个指纹。有关配置模拟器会话测试指纹认证的步骤，请参考标题为\
  \ \"Using and Configuring the Android Studio AVD Emulator 的章节。\n\n要在物理设备上配置指纹认证，请打开\
  \ Settings（设置）应用并选择 Security（安全）选项。在安全设置屏幕内选择 Fingerprint（指纹）选项。在出现的信息屏幕上点击 Next\
  \ 按钮进入指纹设置屏幕。在启用指纹安全之前，必须配置备份锁屏解锁方法（例如 PIN 码）。如果锁屏尚未加密，请按照步骤配置 PIN、图案或密码安全。\n\n\
  锁屏加密后，继续进入指纹检测屏幕，并在提示时触摸传感器（图 81-1），如有需要重复此过程以添加额外的指纹。\n\n![](img/Image24257.jpg)\n\
  图 81-1\n\n## 81.4 在清单文件中添加生物识别权限\n\n生物识别认证要求应用在项目清单文件中请求 `USE_BIOMETRIC` 权限。在 Android\
  \ Studio 项目工具窗口中找到并编辑 `app -> manifests -> AndroidManifest.xml` 文件，按如下所示添加权限请求：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    package=\"com.ebookfrenzy.biometricdemo\"\
  >\n    <uses-permission\n        android:name=\"android.permission.USE_BIOMETRIC\"\
  \ />\n</manifest>\n```\n\n## 81.5 设计用户界面\n\n为了保持示例尽可能简单，用户界面中的唯一视觉元素将 `Button` 视图。找到并选择\
  \ `activity_main.xml` 布局资源文件，将其加载到 Layout Editor（布局编辑器）工具中。\n\n删除示例 `TextView` 对象，从调色板的\
  \ Common 类别拖放一个 `Button` 对象，并将其放置在布局画布的中心。使用 Attributes（属性）工具窗口，将按钮的 text 属性更改为“Authenticate”，并将字符串提取到资源中。最后，配置\
  \ `onClick` 属性以调用名为 `authenticateUser` 的方法。\n\n完成上述步骤后，布局应与图 81-2 所示所示：\n\n![](img/as_4.1_biometric_demo_ui.jpg)\n\
  图 81-2\n\n## 81.6 添加 Toast 便利方法\n\n在示例代码的各个点，应用将设计为通过 `Toast` 消息向用户显示信息。为了避免多次重复相同的\
  \ Toast 代码，将在主 Activity 中添加一个名为 `notifyUser()` 的便利方法。该方法接受单个 `String` 值并以 Toast\
  \ 消息的形式显示给用户。现在编辑 `MainActivity.java` 文件并按如下所示添加此方法：\n\n```java\nimport android.widget.Toast;\n\
  \nprivate void notifyUser(String message) {\n    Toast.makeText(this, message, Toast.LENGTH_LONG).show();\n\
  }\n```\n\n## 81.7 检查安全性\n\n在本章前面已经采取了配置待测试设备锁屏和录入指纹的步骤。然而，在尝试指纹认证之前，在应用中包含防御性代码以确保已满足这些要求。这些步骤将在\
  \ `MainActivity.java` 文件的 `onCreate` 方法中执行，并利用 `Keyguard` 和 `PackageManager` 服务。注意已添加代码以验证应用已配置\
  \ `USE_BIOMETRIC`：\n\n```java\npackage com.ebookfrenzy.biometricdemo;\n\nimport\
  \ androidx.appcompat.app.AppCompatActivity;\nimport androidx.core.app.ActivityCompat;\n\
  import android.widget.Toast;\nimport android.Manifest;\nimport android.pm.PackageManager;\n\
  import android.app.Keyguard;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n \
  \       super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_biometric_demo);\n\
  \        checkBiometricSupport();\n    }\n\n    private Boolean checkBiometricSupport()\
  \ {\n        KeyguardManager keyguardManager = (KeyguardManager) getSystemService(KEYGUARD_SERVICE);\n\
  \        PackageManager packageManager = this.getPackageManager();\n        if (!keyguardManager.isKeyguardSecure())\
  \ {\n            notifyUser(\"Lock screen security not enabled in Settings\");\n\
  \            return false;\n        }\n        if (ActivityCompat.checkSelfPermission(this,\
  \ Manifest.permission.USE_BIOMETRIC) != PackageManager.PERMISSION_GRANTED) {\n \
  \           notifyUser(\"Fingerprint authentication permission not enabled\");\n\
  \            return false;\n        }\n        if (packageManager.hasSystemFeature(PackageManager.FEATURE_FINGERPRINT))\
  \ {\n            return true;\n        }\n        return true;\n    }\n}\n```\n\n\
  \n\n上述代码首先通过使用 `Keyguard` 管理器来验证是否配置了备份屏幕解锁方法（换句话说，可以使用 `PIN` 或身份验证方法作为指纹认证的替代方案来解锁屏幕）。如果锁屏未加密，代码将向用户报告此问题并从该方法返回。\n\
  \n随后，该方法会在通过 `package manager` 验证设备是否支持指纹认证之前，先检查用户是否已为应用启用了生物识别验证权限。\n\n## 81.8\
  \ 配置身份验证回调\n\n在配置生物识别提示对话框时，需要分配一组身份验证回调方法，这些方法会被调用以通知应用身份验证过程的成功或失败。这些方法需要封装在 `BiometricPrompt.AuthenticationCallback`\
  \ 类实例中。在 `MainActivity.java` 文件中，添加一个方法来创建并返回一个实现了相应方法的该类实例：\n\n```java\nimport\
  \ android.hardware.biometrics.BiometricPrompt;\n\n    private BiometricPrompt.AuthenticationCallback\
  \ getAuthenticationCallback() {\n        return new BiometricPrompt.AuthenticationCallback()\
  \ {\n            @Override\n            public void onAuthenticationError(int errorCode,\n\
  \                                               CharSequence errString) {\n    \
  \            notifyUser(\"Authentication error: \" + errString);\n             \
  \   super.onAuthenticationError(errorCode, errString);\n            }\n        \
  \    @Override\n            public void onAuthenticationHelp(int helpCode,\n   \
  \                                           CharSequence helpString) {\n       \
  \         super.onAuthenticationHelp(helpCode, helpString);\n            }\n   \
  \         @Override\n            public void onAuthenticationFailed() {\n      \
  \          super.onAuthenticationFailed();\n            }\n            @Override\n\
  \            public void onAuthenticationSucceeded(\n                    BiometricPrompt.AuthenticationResult\
  \ result) {\n                notifyUser(\"Authentication Succeeded\");\n       \
  \         super.onAuthenticationSucceeded(result);\n            }\n        };\n\
  \    }\n```\n\n## 81.9 添加 CancellationSignal\n\n一旦启动，生物识别身份验证过程将独立于应用执行。为了给应用提供取消操作的方法，会创建一个\
  \ `CancellationSignal` 类实例并将其传递给生物识别验证过程。该 `CancellationSignal` 实例可以在必要时取消过程。取消信号实例可以配置一个监听器，该监听器会在取消完成后被调用。在活动类中添加一个新方法来配置并返回\
  \ `CancellationSignal` 对象，如下所示：\n\n```java\nimport android.os.CancellationSignal;\n\
  \n    private CancellationSignal cancellationSignal;\n\n    private CancellationSignal\
  \ getCancellationSignal() {\n        cancellationSignal = new CancellationSignal();\n\
  \        cancellationSignal.setOnCancelListener(\n            new CancellationSignal.OnCancelListener()\
  \ {\n                @Override\n                public void onCancel() {\n     \
  \               notifyUser(\"Cancelled via signal\");\n                }\n     \
  \       });\n        return cancellationSignal;\n    }\n```\n\n## 81.10 启动生物识别提示\n\
  \n剩下的工作是在 `authenticateUser()` 方法中添加代码，创建并配置 `BiometricPrompt` 实例并启动身份验证。按如下方式添加\
  \ `authenticateUser()` 方法：\n\n```java\nimport android.view.View;\nimport android.content.DialogInterface;\n\
  \npublic void authenticateUser(View view) {\n    BiometricPrompt biometricPrompt\
  \ = new BiometricPrompt.Builder(this)\n        .setTitle(\"Biometric Demo\")\n \
  \       .setSubtitle(\"Authentication is required to continue\")\n        .setDescription(\"\
  This app uses biometric authentication to protect your data.\")\n        .setNegativeButton(\"\
  Cancel\", this.getMainExecutor(),\n            new DialogInterface.OnClickListener()\
  \ {\n                @Override\n                public void onClick(DialogInterface\
  \ dialogInterface, int i) {\n                    notifyUser(\"Authentication cancelled\"\
  );\n                })\n        .build();\n    biometricPrompt.authenticate(getCancellationSignal(),\
  \ getMainExecutor(),\n            getAuthenticationCallback());\n}\n```\n\n`BiometricPrompt.Builder`\
  \ 类用于创建新的 `BiometricPrompt` 实例，并配置用于在提示对话框中显示的标题、副标题和描述文本。负按钮被配置为显示“Cancel”文本，并配置了一个在点击此按钮时显示消息的监听器。最后，调用\
  \ `BiometricPrompt` 实例的 `authenticate()` 方法，并传递 `AuthenticationCallback` 和 `CancellationSignal`\
  \ 实例。生物识别提示还需要知道在哪个线程上执行身份验证。这通过传递一个配置为所需线程的 `Executor` 对象来定义。在这种情况下，使用 `getMainExecutor()`\
  \ 方法将一个主 `Executor` 对象传递给 `BiometricPrompt` 实例，以便身份验证过程在应用的主线程上进行。\n\n## 81.11 测试项目\n\
  \n项目现在完成后，在物理 Android 设备或模拟器会话上运行应用，并点击 Authenticate 按钮以显示如图 81-3 所示的 `BiometricPrompt`\
  \ 对话框：\n\n![](img/as_3.2_biometric_prompt.jpg)\n\n图 81-3\n\n运行后，可以触摸指纹传感器或使用模拟器内的扩展控制面板来按照“使用和配置\
  \ Android Studio AVD 模拟器”章节所述模拟指纹触摸。假设检测到已注册的指纹，提示对话框将返回主活动，此时将出现来自成功身份验证回调方法的 toast\
  \ 消息（吐司）。\n\n再次点击 Authenticate 按钮，这次使用未注册的指纹尝试身份验证。这次，生物识别提示对话框将指示指纹未被识别：\n\n![](img/as_3.2_biometric_prompt_failed.jpg)\n\
  \n图 81-4\n\n通过点击生物识别提示对话框之外的区域来验证错误处理回调是否正常。提示对话框将消失，并出现带有以下消息的 toast 信息：\n\nAuthentication\
  \ error: Fingerprint operation cancelled by user.\n\n检查点击取消按钮取消提示对话框是否会触发“Authentication\
  \ Canceled” toast 信息。最后，使用未注册的指纹多次尝试身份验证，并注意在尝试多次后，提示对话框会指示发生了过多失败，在稍后之前无法进行后续尝试。\n\
  \n88..12**\n\n本章概述了如何将生物识别集成到 Android 应用项目中。这涉及对 `BiometricPrompt` 类的使用，该类一旦配置了适当的消息文本和回调，就会处理大部分身份验证过程。\n\
  \n# 82 创建、测试和上传 Android App Bundle\n\n一旦 Android 应用程序的开发完成并在各种 Android 设备上进行了测试，下一步是准备好提交到\
  \ Google Play 的应用程序。然而，在提交之前，必须对应用程序进行发布打包并使用私钥进行签名。本章将介绍获取私钥、准备项目的 Android App\
  \ Bundle 以及将其上传到 Google Play 的步骤。\n\n## 82.1 发布准备流程\n\n\n\n\n到本书为止，我们一直在以一种适用于测试和调试的模式构建应用程序项目。另一方面，要构建一个通过\
  \ Google Play 发布给客户的应用程序包，则需要采取一些额外的步骤。第一个要求是应用程序必须以发布模式（release mode）而非调试模式（debug\
  \ mode）编译。其次，应用程序必须使用私钥进行签名，该密钥用于唯一标识你作为应用程序的开发者。最后，应用程序必须打包成 Android App Bundle（Android\
  \ 应用包）。\n\n虽然这些任务中的每一个可以在 Android Studio 环境之外完成，但正如本章后续部分概述的，使用 Android Studio 构建机制可以更方便地完成这些操作。不过，首先，对\
  \ Android App Bundles 有一个更深入的了解。\n\n## 82.2 Android App Bundles\n\n当用户从 Google Play\
  \ 安装应用时，该应用是以 `APK` 文件的形式下载的。该文件包含了在用户设备上安装和运行应用所需的所有内容。在 Android Studio `3.2` 引入之前，开发者会使用\
  \ Android Studio 生成一个或多个 `APK` 文件并将它们上传到 Google Play。为了支持多种设备类型、屏幕尺寸和语言区域，这需要为每个目标设备和区域创建并上传多个自定义的\
  \ `APK` 文件，或者生成一个包含所有不同配置资源和平台二进制文件的大型通用 `APK`。\n\n创建多个 `APK` 文件涉及大量工作，且每次更新应用时都要重复，这给应用发布过程带来了巨大的时间开销。\n\
  \n通用 `APK` 选项虽然减轻了开发者的负担，但导致了一个完全意之外的问题。通过分析应用安装指标，Google 发现安装 `APK` 文件越大（导致下载时间变长和设备存储占用增加），应用的转化率就越低。转化率的计算方法是在于\
  \ Google Play 查看该应用后完成安装的用户所占的百分比。事实上，Google 估计 `APK` 文件大小每增加 `6MB`，应用的转化率就会下降 1%。\n\
  \nAndroid App Bundles 解决了这这两个问题，它为开发者提供了一种在 Android Studio 内部创建单个包的方法，并让 Google\
  \ Play 为每个单独支持的配置自动生成自定义的 `APK` 文件（这一概念被称为动态交付 Dynamic Delivery）。\n\nAndroid App\
  \ Bundle 本质上是一个 ZIP 文件，包含了为应用项目内支持的设备和区域构建 `APK` 文件所需的所有文件。例如，项目可能包含针对不同屏幕尺寸的资源和图像。当用户安装应用时，Google\
  \ Play 会接收有关用户设备的信息，包括显示屏、处理器架构和语言区域。利用这些信息，将相应的预生成 `APK` 文件传输到用户的设备上。\n\n动态交付的额外优点是能够将应用拆分为多个模块，称为动态功能模块（dynamic\
  \ feature modules），每个模块包含应用内特定功能区域的代码和资源。每个动态功能模块都包含在与基础模块分离的独立 `APK` 文件中，只有在用户需要该功能时才会下载到设备上。动态交付和应用包还允许创建即时动态功能模块（instant\
  \ dynamic feature modules），这些模块可以在无需安装整个应用的情况下立即在设备上运行。这些主题将从名为 Android 动态功能模块概述的章节开始进行详细介绍。\n\
  \n尽管仍然可以通过 Android Studio 生成 `APK` 文件，但应用包现在是将应用上传到 Google Play 的推荐方式。\n\n## 82.3\
  \ 注册 Google Play 开发者控制帐户\n\n应用程序提交过程的第一步是创建一个 Google Play 开发者控制帐户。要为此帐户，请导航到 `https://play.google.com/apps/publish/signup/`\
  \ 并按照说明完成注册过程。注意，注册需要支付一次性的 `$25` 费用。一旦应用程序开始销售，Google 将保留与应用程序相关的所有收入的 30%。\n\n\
  帐户创建完成后，下一步是收集有关应用程序的信息。为了将您的应用程序推向市场，需要以下信息：\n\n*   标题（Title）—— 应用程序的标题。\n*   短描述（Short\
  \ Description）—— 最多 80 个单词的应用描述。\n*   完整描述（Full Description）—— 最多 4000 个单词的应用描述。\n\
  *   截图（Screenshots）—— 最多 8 张应用程序运行的截图（至少需要两张）。Google 建议提交应用在 7 英寸或 10 英寸平板电脑上运行的截图。\n\
  *   语言（Language）—— 应用程序的语言（默认为美式英语）。\n*   推广文本（Promotional Text）—— 当您的应用程序出现在特殊促销活动时使用的文本。\n\
  *   应用类型（Application Type）—— 您的应用程序是游戏还是应用。\n*   类别（Category）—— 最能描述您应用程序的类别（例如：金融、健康与健身、教育、运动等）。\n\
  *   区域（Locations）—— 您希望您的应用程序可以提供的地理区域。\n*   联系详情（Contact Details）—— 用户就应用程序支持与您联系的方法。包括网页、电子邮件和电话。\n\
  *   定价与分发（Pricing & Distribution）—— 关于应用程序的价格以及进行营销销售的地理区域的信息。\n\n收集上述信息后，点击 Google\
  \ Play 控制台中的“创建应用”按钮开始流程。\n\n## 82.4 在控制台中配置应用程序\n\n当首次点击“创建应用”按钮时，将出现应用详情和声明屏幕，如下图\
  \ 82-1 所示：\n\n![](img/4.1_play_create_app.jpg)\n\n82-1\n\n一旦配置了应用条目，点击上图中的“创建应用”按钮添加应用并显示仪表板屏幕。在仪表板中，找到“初始设置”部分并展开配置应用商店列表的步骤：\n\
  \n![](img/4.1_play_app_initial_steps.jpg)\n\n82-2\n\n逐一处理列表并为您的应用提供所需的信息，确保每一步都保存更改。\n\
  \n## 82.5 启用 Google Play 应用签名\n\n直到最近，Google Play 上传是在 Android Studio 内部使用发布应用密钥签名，然后上传到\
  \ Google Play 控制台。虽然此选项仍然可用，但现在推荐的上传方法是使用被称为 Google Play 应用签名的流程。对于新创建的应用，这涉及加入\
  \ Google Play 应用签名，并生成用于签名 Android Studio 内部应用包文件的上传密钥。当上传 Android Studio 生成的应用包文件时，Google\
  \ Play 控制台会移除上传密钥并使用安全存储在 Google 服务器中的应用签名密钥进行签名。对于现有应用，需要额外的步骤来启用 Google Play 签名，将在本书末尾介绍。\n\
  \n在 Google Play 控制台中，从“所有应用”屏幕中选择新添加的应用条目（通过左侧导航面板顶部的选项访问），展开“设置”部分（位于图 82-3 中的标记\
  \ A 处），并选择“应用签名”选项（B）。\n\n\n\n\n\n![](img/as_4.1_play_enable_app_signing.jpg)\n\n\
  图 82-3\n\n点击 `Create release` 按钮 (C) 以启用 Google Play 应用签名。控制台现在准备好为您的应用创建第一个测试发布版本。在此之前，下一步是在\
  \ Android Studio 内部生成上传密钥（upload key）。这是生成签名应用包（app bundle）过程的一部分。请保持当前 Google Play\
  \ Console 页面加载，因为我们将在本章后部分返回这里。\n\n## 82.6 创建 Keystore 文件\n\n要创建 keystore 文件，请选择\
  \ Android Studio 的 `Build` -> `Generate Signed Bundle / APK…` 菜单选项，以显示 `Generate\
  \ Signed Bundle or APK Wizard` 对话框，如图 82-4 所示：\n\n![](img/android_studio_3.2_select_app_bundle.jpg)\n\
  \n图 82-4\n\n在点击 `Next` 按钮之前，确保已选择 `Android App Bundle` 选项。\n\n如果您已有一个现发布 keystore\
  \ 文件，请点击下一屏幕上的 `Choose existing…` 按钮并导航并选择该文件。如果您尚未创建 keystore 文件，请点击 `Create new…`\
  \ 按钮显示 `New Key Store` 对话框 (图 82-5)）。点击 `Key store path` 字段右侧的按钮，导航到文件系统中合适的位置，为\
  \ keystore 文件输入一个名称（例如 `release.keystore.jks`），并点击 `OK` 按钮。\n\n`New Key Store` 对话框分为两个部分。顶部部分与\
  \ keystore 文件有关。在此部分，在 `Password` 和 `Confirm` 字段中输入用于保护 keystore 文件的强密码。对话框的下部分与存储在\
  \ keystore 文件中的上传密钥有关。\n\n![](img/Image2483.jpg)\n\n图 82-5\n\n在 `New Key Store`\
  \ 对话框的 `Certificate` 部分，输入以下详细信息：\n\n• 引用密钥别名。可以是任何字符序列，但系统仅使用前 8 个字符。\n\n• 用于保护密钥的足够强度的密码。\n\
  \n• 密钥有效的年数（Google 建议时长超过 25 年）。\n\n此外，必须为剩余字段中的至少一个提供信息（例如，您的姓和名，或组织名称）。\n\n![](img/Image24921.jpg)\n\
  \n图 82-6\n\n输入信息后，点击 `OK` 按钮继续创建应用包。\n\n## 82.7 创建 Android App Bundle\n\n下一步是指示\
  \ Android Studio 以发布模式（release mode）构建应用程序应用包文件，然后用新创建的私钥对其进行签名。此时，`Generate Signed\
  \ Bundle or APK` 对话框应仍显示，`keystore path`、`passwords` 和 `key alias` 字段已填充信息：\n\n\
  ![](img/android_studio_3.2_keystore_info.jpg)\n\n图 82-7\n\n确保已启用 `Export Encrypted\
  \ Key` 选项，并在假设其他设置正确的情况下，点击 `Next` 按钮进入应用包生成屏幕 (图 82-8)。在此屏幕中，请检查 `Destination Folder:`\
  \ 设置，以验证生成应用包文件的位置是否可以接受。如果偏于其他位置，请点击文本字段右侧的按钮并导航到所需的文件系统位置。\n\n![](img/android_studio_3.2_generate_app_bundle.jpg)\n\
  \n图 82-8\n\n点击 `Finish` 按钮并等待 `Gradle` 系统构建应用包。构建完成后，将出现一个对话框，提供在资源管理器窗口中打开包含应用包文件的文件夹，或将文件加载到\
  \ `APK Analyzer` 中：\n\n```\n![](img/android_studio_3.2_app_bundle_generated.jpg)\n\
  ```\n图 82-9\n\n此时应用程序准备好提交到 Google Play。点击 `locate` 链接打开文件系统浏览器窗口。该文件应名为 `bundle.aab`，并位于项目文件夹的\
  \ `app/release` 子目录中，除非指定了其他位置。\n\n在此过程中生成的私钥应在签名和发布未来应用程序时使用，因此应存放在安全的地方并进行安全备份。\n\
  \n## 82.8 生成测试 APK 文件\n\n此阶段的可选步骤是从应用包生成 APK 文件，并在设备或模拟器会话上安装并运行它们。Google 提供了一个名为\
  \ `bundletool` 的命令行工具，专门为此目的设计，可以从以下 URL 下载：\n\n[`github.com/google/bundletool/releases`](https://github.com/google/bundletool/releases)\n\
  \n在编写时，`bundletool` 以 `.jar` 文件形式提供，可以从命令行如下执行（注意版本号自本书出版以来可能已经更改）：\n\n```\njava\
  \ -jar bundletool-all-0.9.0.jar\n```\n\n运行上述命令将列出工具中可用的所有选项。要从应用包生成 APK 文件，使用 `build-apks`\
  \ 选项。为了生成可以安装到设备上的 APK 文件，还需要对它们进行签名。为了实现这一点，包含指定 keystore 路径的 `--ks` 选项以及指定密钥别名的\
  \ `--ks-alias` 选项。\n\n```\n... build-apks --bundle=/tmp/bundle.aab --ks=release.keystore.jks\
  \ --ks-alias=MyRelease\n```\n（注：根据后续上下文重构命令）\n\n最后，必须使用 `--output` 标志来指定生成 APK Set\
  \ 的路径。该文件不能已存在，并且要求以 `.apks` 结尾。APK Set 文件只是包含所有 APK 文件的 ZIP 文件。\n\n```\n... install-apks\
  \ --apks=/tmp/MyApks.apks\n```\n\n当执行此命令时，将提示请求 keystore 密码，然后生成 APK 文件。\n\n也可以从\
  \ APK Set 中提取适用于连接设备的 APK 文件而不安装它们。此过程的第一步是如下所示获取连接设备的规格：\n\n```\njava -jar bundletool-all-0.9.0.jar\
  \ get-device-spec --output=/tmp/device.json\n```\n\n上述命令将生成一个类似的 JSON 文件：\n\n```json\n\
  {\n  \"supportedAbis\": [\"x86\"],\n  \"supportedLocales\": [\"en-US\"],\n  \"screenDensity\"\
  : 420,\n  \"sdkVersion\": 27\n}\n```\n\n接下来，使用此规格文件从 APK Set 中提取匹配的 APK 文件：\n\n\
  ```\njava-jar bundletool-all-0.9.0.jar extract-apks --apks=/tmp/MyApks.apks --output-dir=/tmp/nexus5_apks\
  \ --device-spec=/tmp/device.json\n```\n\n执行后，通过 `--output-dir` 标志指定的目录将包含适用于指定设备配置的\
  \ APK 文件。\n\n## 82.9 上传应用包到 Google Play Developer Console\n\n将 Android 应用程序推向市场的下一步将其提交到\
  \ Google Play Developer Console，以便进行测试。\n\n返回 Google Play Console，并在导航面板的测试部分中选择\
  \ `Internal testing` 选项（在[图 82-10]中标记为 A），然后点击 `Create new release` 按钮 (B)：\n\n\
  ![](img/as_4.1_play_create_new_release.jpg)\n\n图 82-10\n\n\n\n\n\n在生成的屏幕上，点击 `Continue`\
  \ 按钮（下方标记为 A 处）确认使用 Google Play 应用签名，然后将 Android Studio 生成的包文件拖放到到上传投放点 (B) ：\n\n\
  ![](img/as_4.1_play_upload_bundle.jpg)\n图 82-11\n\n上传完成后，向下滚动屏幕并输入发布名称和可选的发布说明。发布名称可以是任何帮助你识别该发布版本的信息，且对用户不可见。\n\
  \n在应用包（app bundle）文件上传后，Google Play 将生成所有必要的 `APK` 文件以供测试。一旦 `APK` 文件生成，滚动到屏幕底部并点击\
  \ `Save` 按钮。设置保存后，点击 `Review release` 按钮。\n\n## 82.10 探索应用包 (App Bundle)\n\n在审核屏幕上，点击上传包文件右侧的箭头，如\
  \ 图 82-12 所示：\n\n![](img/as_4.1_play_app_bundle_review.jpg)\n图 82-12\n\n在弹出的面板中，点击\
  \ `Explore bundle` 链接加载应用包探器。这提供了与应用包相关的支持的 `API` 级别、屏幕布局和平台相关的摘要信息：\n\n![](img/as_4.1_play_app_bundle_explorer.jpg)\n\
  图 82-13\n\n点击 `Go to device catalog` 链接将显示 `APK` 文件支持的设备：\n\n![](img/as_4.1_play_device_catalog.jpg)\n\
  图 82-14\n\n此时，应用已准备好进行测试，但在控制台中设置好测试人员之前，无法进行发布。\n\n## 82.11 管理测试人员\n\n如果应用仍处于 `Internal`（内部）、`Alpha`\
  \ 或 `Beta`（测试）测试阶段，可以通过以下步骤指定授权测试人员列表：在 Google Play 控制台中选择该应用，点击导航面板中的 `Internal\
  \ testing`，并选择 `Testers` 选项卡，如 图 82-15 所示：\n\n![](img/as_4.1_play_testers.jpg)\n\
  图 82-15\n\n要添加测试人员，点击 `Create email list` 按钮，为列表命名并手动指定或通过上传 `CSV` 文件指定测试用户的邮箱地址。\n\
  \n现在可以从屏幕复制 `Join on the web` URL 并提供给测试人员，以便他们接受测试邀请并下载应用。\n\n## 82.12 发布应用进行测试\n\
  \n现在已经创建了内部发布并添加了测试人员列表，应用已准备好发布进行测试。留在 `Internal testing` 屏幕中，在点击最近创建的发布版本的 `Edit`\
  \ 按钮之前，选择 `Releases` 选项卡：\n\n![](img/as_4.1_play_ready_for_rollout.jpg)\n图 82-16\n\
  \n在审核屏幕上，滚动到最后并点击 `Start rollout to Internal testing` 按钮。在发布处理期间经过短暂的延迟后，应用将可以供指定用户下载和测试。\n\
  \n## 82.13 上传新的应用包修订版本\n\n为你的应用程序上传的第一个应用包文件其版本号始终为 `1`。如果尝试上传具有相同版本号的另一个包文件，控制台将通过以下错误拒绝该文件：\n\
  \n`You need to use a different version code for your APK because you already have\
  \ one with version code 1.`\n\n要解决这个问题，需要增加嵌入包文件中的版本号。这在项目的模块级 `build.gradle` 文件中进行，如\
  \ 图 82-17 高亮所示：\n\n![](img/Image2561.jpg)\n图 82-17\n\n默认情况下，该文件通常读取如下：\n\n```gradle\n\
  plugins {\n    id 'com.android.application'\n}\n\nandroid {\n    compileSdkVersion\
  \ 31\n    defaultConfig {\n        applicationId \"com.example.myapplication\"\n\
  \        minSdkVersion 26\n        targetSdkVersion 31\n        versionCode 1\n\
  \        versionName \"1.0\"\n    }\n}\n```\n\n要更改版本号，只需更改 `versionCode` 旁边声明的数字。要同时更改向应用用户显示的版本号，请更改\
  \ `versionName` 字符串。例如：\n\n```gradle\nversionCode 2\nversionName \"2.0\"\n```\n\n\
  完成这些更改后，重新构建 `APK` 文件并再次上传。\n\n## 82.14 分析应用包文件\n\nAndroid Studio 提供了分析应用包文件内容的能力。要分析包文件，选择\
  \ `Android Studio Build -> Analyze APK…` 菜单选项，并导航到选择要审核的包文件。一旦加载到工具中，将显示有关包原始大小和下载大小的信息，连同包的文件结构列表，如\
  \ 图 82-18 所示：\n\n![](img/android_studio_3.2_play_bundle.jpg)\n图 82-18\n\n选择 `classes.dex`\
  \ 文件将显示文件的类结构。在此面板中，可以一直到方法级别探索类：\n\n![](img/Image283.jpg)\n图 82-19\n\n同样，选择列表中的资源或图像文件将显示其内容。可以通过点击\
  \ `Compare with previous` 按钮并选择另一个包文件来查看包之间的大小差异。\n\n## 82.15 总结\n\n一旦应用项目已完成或准备好测试，就可以将其上传到控制台并发布到生产、内部或\
  \ Beta 测试。在上传应用之前，必须在控制台中创建一个应用条目，包括应用信息以及用于商店的截图。然后生成发布版应用包文件并使用上传密钥进行签名。\n\n##\
  \ 83. Android 功能模块概述\n\n如前面的章节所述，应用包和动态交付的引入显著减少了用户在 Android 设备上安装应用时需要下载包的大小。最初的目的是为每个设备配置生成单独的包文件，动态交付的另一个关键优势是将应用拆分为多个动态功能模块。\n\
  \n在本章中，我们将探索动态功能模块的基本概念，为在下一章中进行详细的实践做准备。\n\n### 83.1 动态功能模块概述\n\n动态交付的主要目标是减少安装应用所需的时间带宽，同时确保应用安装后仅占用最少的存储空间。动态功能模块（也称为按需模块）允许将\
  \ Android 应用的不同功能封装在单独模块中，这些模块在用户需要时才会被下载并安装到设备上。\n\n\n\n\n使用动态功能模块（dynamic feature\
  \ modules）的应用程序对模块的安装方式和时间具有完全控制权。事实上，应用程序还可以监控用户访问特定功能的频率，并临时移除任何不经常使用的功能。\n\n\
  动态功能还可能被指定为“即时”（instant）模块。这取代了早期 Android 版本中的即时应用（Instant App）概念，并允许动态功能模块在无需安装应用程序的情况下在设备上运行。这使得应用程序可以在\
  \ Google Play 应用商店中显示“立即试用”按钮，或者通过点击网页 URL 在设备上即时启动。\n\n# 83.2 动态功能模块架构\n\n从一开始开始，Android\
  \ 的设计就考虑了模块化，特别是在 `Intents`（意图）和 `Activities`（活动）的概念。动态功能通过允许应用程序在用户需要的时候安装用户需要的内容，将这种哲学推向了逻辑终。鉴于这种能力的灵活性和强大，动态功能模块的实现相对简单。\n\
  \n简单来说，动态功能模块是使用分割 APK 文件（split APK files）构建的，这些文件允许多个 APK 文件组合形成单个应用程序。\n\n正如我们在“创建、测试和上传\
  \ Android App Bundle”中所学习的那样，动态交付和应用 bundle 通过生成一个自定义的 APK 文件来工作，该文件仅包含在特定设备配置上运行应用程序所需的字节码和资源。在这种情况下，应用程序仍然通过单个\
  \ APK 文件安装，尽管该文件是为用户的设备定制的。\n\n相比之下，动态功能模块通过将应用程序拆分为多个称为“分割 APK 文件”的文件来工作。\n\n当应用程序使用分割\
  \ APK 文件时，只有在首次下载应用程序时才会安装基础模块（base module）。基础模块通过一个可启动的活动（activity）作为应用程序的入口点，并包含了应用程序基础功能的字节码和资源，以及应用程序其他部分所需的配置和构建资源。例如，基础模块的清单文件（manifest\
  \ file）包含了与应用程序打包的任何动态功能模块的清单文件的合并版本。此外，所有动态功能模块的版本号由基础模块构建配置文件（build configuration\
  \ file）中的版本代码（version code）设置决定。\n\n基础模块还包含一个在应用 bundle 中包含的动态功能模块的列表，且所有动态功能模块必须在它们的构建配置中将基础模块列为依赖项。\n\
  \n每个动态功能以模块的形式存在，包含字节码、清单、资源和构建配置，以及该特定功能的任何其他资产（如图像或数据文件）。\n\n当用户从应用商店请求安装应用程序时，商店将为模块生成基础\
  \ APK 文件，该文件包含所有设备配置通用的字节码和资源，以及一组专门为用户设备配置的配置 APK 文件。同样，安装动态功能模块的请求将生成一个动态功能 APK\
  \ 文件，外加相应的配置 APK 文件，如下方的图 83-1 所示：\n\n![](img/android_dynamic_feature_diagram.jpg)\n\
  \n图 83-1\n\n## 83.3 创建动态功能模块\n\n可以通过添加全新的模块或迁移现有模块来向项目中添加动态功能。要添加新模块，只需选择 Android\
  \ Studio 的 `File -> New -> New Module...` 菜单选项。在弹出的对话框中，根据你要创建的动态功能类型，在左侧面板中选择 `Dynamic\
  \ Feature Module`动态功能模块）或 `Instant Dynamic Feature Module`即时动态功能模块）选项：\n\n![](img/as_4.2_add_dynamic_feature.jpg)\n\
  \n选择适当的动态功能选项后，为模块命名并更改最小 API 设置，使其与基础模块选择的 API 级别匹配（如果这些版本不匹配，项目将无法构建）。\n\n再次点击\
  \ `Next` 按钮以配置 `On-Demand`（按需）选项：\n\n![](img/as_4.2_dynamic_feature.jpg)\n\n图 83-3\n\
  \n当启用按需选项时，模块将与运行动态交付之前的 Android 版本（Android 4.4 或更高）的基础应用程序一起下载。`Module Title`字符串长度最多可达\
  \ 50 个字符，并在 Google Play 向用户描述功能和发送通知时使用。\n\n`Install-time`（安装时）包含提供了控制在什么情况下安装模块的选项：\n\
  \n- `Do not include module at install time (on-demand)`（按需包含）：无论设备配置如何，在应用程序请求前不安装模块。\n\
  - `Include module at install time`：在设备安装应用程序时同时安装模块。\n- `Only include module at\
  \ install-time for devices with specified`（对于具有指定的设备在安装时包含）：对于符合特定标准的设备和国家时包含模块。其他国家和配置将使用按需安装。当选择此选项时，会出现允许输入设备功能的额外选项。正如图\
  \ 83-4 所示，对于带有麦克风和指纹读取器的设备，模块将在安装时包含。对于所有其他设备，模块将按需安装：\n\n图 83-4 动态功能功能\n\n其他标准如国家和\
  \ API 级别必须在项目清单（`AndroidManifest.xml`）文件中声明。例如，以下条目将禁用法国用户和早于 API 21 的 Android 版本的功能安装：\n\
  \n```\n<dist:conditions>\n  <dist:user-countries exclude=\"true\">\n    <dist:country\
  \ code=\"FR\"/>\n  </dist:user-countries>\n  <dist:min-sdk value=\"21\"/>\n</dist:conditions>\n\
  ```\n\n# 转换现有模块\n\n如果应用程序包含一个适合动态交付的现有功能，可以通过几个基本步骤转换为动态功能。例如，考虑以下项目结构：\n\n![](img/andorid_dynamic_feature_convert_tree.jpg)\n\
  \n图 83-5\n\n在此项目中，应用程序模块将作为基础模块，而 `secondfeature` 模块是转换为动态功能模块的理想选择。\n\n要将应用程序中的现有模块转换为动态功能模块，首先编辑模块层的\
  \ `build.gradle` 文件（上述示例中的 `Gradle Scripts -> build.gradle (Module: secondfeature)`），将其修改为使用\
  \ `com.android.dynamic-feature` 而不是 `com.android.application` 插件，并更改依赖项使模块仅依赖于基础（`app`）模块。例如：\n\
  \n```\napply plugin: 'com.android.application'\napply plugin: 'com.android.dynamic-feature'\n\
  \ndependencies {\n  implementation fileTree(dir: 'libs', include: ['*.jar'])\n \
  \ api 'androidx.appcompat:appcompat:1.0.2'\n  api 'androidx.constraintlayout:constraintlayout:1.1.3'\n\
  \  testImplementation 'junit:junit:4.12'\n  androidTestImplementation 'androidx.test.ext:junit:1.1.1'\n\
  \  androidTestImplementation 'androidx.test.espresso:espresso-core:3.2.0'\n  implementation\
  \ project(':app')\n}\n```\n\n\n\n\n\n接下来，编辑模块的 `AndroidManifest.xml` 文件并按如下方式修改（注意在此示例中，这是一个按需模块\
  \ on-demand module，而不是即时模块 instant module）：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:dist=\"http://schemas.android.com/apk/distribution\"\n    package=\"\
  com.ebookfrenzy.mymodule\">\n    <dist:module\n        dist:instant=\"false\"\n\
  \        dist:onDemand=\"true\"\n        dist:title=\"@string/title_my_dynamic_feature\"\
  >\n        <dist:fusing dist:include=\"true\" />\n    </dist:module>\n    <application\n\
  \        android:allowBackup=\"true\">\n```\n\n注意 `title` 属性引用了一个字符串资源，该资源需要在 `strings.xml`\
  \ 文件中声明。该属性强制使用字符串资源而不是硬编码字符串。\n\n接下来，需要修改基础模块的 `build.gradle` 文件（`build.gradle\
  \ (Module: app)`）以引用动态功能模块，并添加 Play Core Library 作为依赖：\n\n```gradle\napply plugin:\
  \ 'com.android.application'\n\nandroid {\n    compileSdkVersion 29\n\n    dynamicFeatures\
  \ = [\":secondfeature\"]\n}\n\ndependencies {\n    api 'com.google.android.play:core:1.5.0'\n\
  }\n```\n\n最后，编辑基础模块的 `Android-AndroidManifest.xml` 文件，将该模块声明为 `SplitCompatApplication`\
  \ 的子类：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    package=\"com.ebookfrenzy.mydemoapp\"\
  >\n    <application\n        android:name=\"com.google.android.play.core.splitcompat.SplitCompatApplication\"\
  \n        android:allowBackup=\"true\">\n```\n\n## 83. 使用动态功能模块\n\n一旦应用项目添加了一个或多个动态功能模块，就需要编写代码来安装和管理这些模块。这将涉及执行任务，例如检查模块是否已安装、安装模块、跟踪安装进度以及删除不再需要的已安装模块。所有这些任务都将使用\
  \ Play Core Library 提供的 API 执行，大部分这些 API 调用都涉及使用 `SplitInstallManager` 实例，该实例可以通过以下方式创建：\n\
  \n```java\nprivate SplitInstallManager manager;\nmanager = SplitInstallManagerFactory.create(this);\n\
  ```\n\n通常，在允许用户启动动态功能之前，第一步是检查相应的模块是否已经安装。例如，以下代码获取已安装模块的列表并检查特定模块是否已安装：\n\n```java\n\
  if (manager.getInstalledModules().contains(\"my_dynamic_feature\")) {\n    // 模块已安装\n\
  }\n```\n\n可以通过构建 `SplitInstallRequest` 对象并将其传递给 `SplitInstallManager` 实例的 `startInstall()`\
  \ 方法来安装一个或多个模块：\n\n```java\nprivate int mySessionID = 0;\n\nSplitInstallRequest\
  \ request =\n    SplitInstallRequest\n        .newBuilder()\n        .addModule(\"\
  my_dynamic_feature\")\n        .addModule(\"my_dynamic_feature2\")\n        .build();\n\
  manager.startInstall(request)\n    .addOnSuccessListener(new OnSuccessListener<Integer>()\
  \ {\n        @Override\n        public void onSuccess(Integer sessionId) {\n   \
  \         mySessionID = sessionId;\n        }\n    })\n    .addOnFailureListener(new\
  \ FailureListener() {\n        @Override\n        public void onFailure(Exception\
  \ exception) {\n        }\n    });\n```\n\n当执行上述代码时，模块安装将开始。另一种方法是通过向 `deferredInstall()`\
  \ 方法传递一个功能名称数组来执行延迟安装，如下：\n\n```java\nmanager.deferredInstall(Arrays.asList(\"my_dynamic_feature\"\
  , \"my_dynamic_feature2\"));\n```\n\n延迟下载将在后台根据操作系统的决定进行。虽然可能无法跟踪延迟安装的状态，但可以通过向\
  \ `manager` 添加监听器来跟踪非延迟安装的进度：\n\n```java\nSplitInstallUpdatedListener listener =\
  \ new SplitInstallUpdatedListener() {\n    @Override\n    public void onStateUpdate(SplitSessionState\
  \ state) {\n        if (state.sessionId() == mySessionID) {\n            switch\
  \ (state.status()) {\n                case SplitSessionStatus.REQUIRES_USER_CONFIRMATION:\n\
  \                    // 大模块需要用户权限\n                    break;\n                case\
  \ SplitSessionStatus.DOWNLOADING:\n                    // 模块正在下载\n             \
  \       break;\n                case SplitSessionStatus.INSTALLING:\n          \
  \          // 已下载的模块正在安装\n                    break;\n                case SplitSessionStatus.DOWNLOADED:\n\
  \                    // 模块下载已完成\n                    break;\n                case\
  \ SplitSessionStatus.INSTALLED:\n                    // 模块已成功安装\n              \
  \      break;\n                case SplitSessionStatus.CANCELED:\n             \
  \       // 用户取消了下载\n                    break;\n                case SplitSessionStatus.PENDING:\n\
  \                    // 安装已推迟\n                    break;\n                case\
  \ SplitSessionStatus.FAILED:\n                    // 安装失败\n                    break;\n\
  \            }\n        }\n    }\n};\n```\n\n一旦实现了监听器，就需要将其向 `manager` 注册，并在不再需要时取消注册。\n\
  \n```java\nmanager.registerListener(listener);\n//\nmanager.unregisterListener(listener);\n\
  ```\n\n## 83.6 处理功能模块\n\nAndroid 系统在未请求用户许可的情况下不允许下载大于 10MB 的功能。当请求下载大功能时，监听器将被调用并传递\
  \ `REQUIRES_USER_CONFIRMATION` 状态。此时，由应用负责显示确认，并可选地实现 `onActivityResult()` 处理程序以识别用户是批准还是拒绝。\n\
  \n```java\nprivate static int REQUEST_CODE = 101;\n```\n\n上述代码启动了一个意图，该意图显示内置的确认对话框。该意图会将结果码返回给\
  \ `onActivityResult()` 方法，其实现如下：\n\n```java\n@Override\npublic void onActivityResult(int\
  \ requestCode, int resultCode, Intent data) {\n    if (requestCode == REQUEST_CODE)\
  \ {\n        if (resultCode == RESULT_OK) {\n            // 用户批准安装\n        } else\
  \ {\n            // 用户拒绝安装\n        }\n    }\n}\n```\n\n如果用户批准了请求，动态功能模块将自动下载并安装。\n\
  \n## 83.7 总结\n\n\n\n\n\n动态功能模块（Dynamic feature modules）允许将 Android 应用划分为独立的功能，这些功能在用户需要时按需下载。动态功能模块还可以被配置为即时功能（instant\
  \ features）。即时功能可以在设备不安装应用的情况下运行，用户可以通过应用商店页面上的“立即尝试”（Try Now）按钮或网页 URL 访问。\n\n\
  动态功能的实现涉及将应用拆分为一个基础模块（base module）和一个或多个动态功能模块。可以在 Android Studio 中创建新的动态功能模块，也可以通过更改一些项目配置将现有模块转换为动态功能模块。\n\
  \n一旦将动态功能模块添加到应用，这些模块的下载和管理将由应用通过 `Play Core Library` 中的 `SplitInstall` 类来处理。\n\n\
  # 84. Android Studio 动态功能教程\n\n在上一章涵盖了 Android 动态交付（Android Dynamic Delivery）和动态功能的基本概念后，本章将以示例项目的形式把理论付诸实践。在本章创建的应用将包含两个活动（activity），第一个作为应用的基础模块，而第二个将指定为动态功能，可以在运行中的应用内部按需下载。本教程将包括在\
  \ Android Studio 中创建动态模块的步骤、将应用包（app bundle）上传到 Google Play Store 进行测试，以及使用 `Play\
  \ Core Library` 下载和管理动态功能的步骤。本章还将探索延迟动态功能安装的使用。\n\n## 84.1 创建 DynamicFeature 项目\n\
  \n从欢迎界面选择 `New Project` 选项，在弹出的新项目对话框中，选择 `Empty Activity` 模板，然后点击 `Next` 按钮。\n\n\
  在 `Name` 字段中输入 `DynamicFeature`，并指定一个在 Google Play 生态系统中唯一标识您的应用的包名（例如 `com.<your\
  \ company>.dynamicfeature`）。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置更改为 `API 26:\
  \ Android 8.0 (Oreo)`，并将语言（Language）菜单更改为 `Java`。\n\n## 84.2 为项目添加动态功能支持\n\n在开始实现应用之前，需要对项目进行两个更改以添加对动态功能的支持。由于项目将大量使用\
  \ `Play Core Library`，因此需要在构建配置中添加一条指令以包含此库。在 Android Studio 中，打开应用层级的 `build.gradle`\
  \ 文件（`Gradle Scripts -> build.gradle (Module: DynamicFeature.app)`），找到 `dependencies`\
  \ 部分并按照如下方式添加 `Play Core Library`（请记住，一如既常，该库现在可能有更新的版本）：\n\n```gradle\ndependencies\
  \ {\n    ...\n    implementation 'com.google.android.play:core:1.10.1'\n    ...\n\
  }\n```\n\n一旦下载了动态功能模块，用户可能需要立即访问组成该功能的代码和资源资产。但默认情况下，新安装的功能模块在应用重启之前对应用的其他部分是不可用的。幸运的是，通过在项目中启用\
  \ `SplitCompat Library` 可以避免这一缺陷。目前实现此最简单的方法是在主 `AndroidManifest.xml` 文件（也称为基础模块清单）中将应用程序声明为子类\
  \ `SplitCompatApplication`，如下：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\n   \
  \ package=\"com.ebookfrenzy.dynamicfeature\">\n    <application\n        android:name=\"\
  com.google.android.play.core.splitcompat.SplitCompatApplication\"\n        android:allowBackup=\"\
  true\"\n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\
  \n        android:roundIcon=\"@mipmap/ic_launcher_round\">\n    ...\n```\n\n## 84.3\
  \ 设计基础 Activity 用户界面\n\n此时，项目包含一个活动，该活动将作为应用基础模块的入口。此基础模块将负责请求、安装和管理动态功能模块。\n\n\
  为了演示动态功能的使用，基础活动将由一系列按钮组成，这些按钮允许安装、启动和删除动态功能模块。用户界面还将包含一个 `TextView` 对象，用于显示与动态功能模块相关的状态。根据这些要求，将\
  \ `activity_main.xml` 布局文件加载到布局编辑器中，删除默认的 `TextView` 对象，并实现设计使其类似于下面的图 84-1。\n\n\
  ![](img/as_4.1_dynamic_feature_ui.jpg)\n图 84-1\n\n一旦定位了对象，选择 `TextView` 部件并使用 `Attributes`\
  \ 工具窗口将 `id` 属性设置为 `status_text`。通过选择布局中的所有对象，右键点击 `TextView` 对象，并从菜单中选择 `Center\
  \ -> Horizontally` 选项，开始应用布局约束，从而将四个对象约束在屏幕的水平中心。\n\n在所有对象仍选的情况下，再次右键点击 `TextView`，这次选择\
  \ `Chains -> Vertical Chain` 菜单选项。在继续之前，将所有按钮字符串提取到资源中，并配置三个按钮分别调用名为 `launchFeature`、`installFeature`\
  \ 和 `deleteFeature` 的方法。\n\n## 84.4 添加动态功能模块\n\n要向项目添加动态功能模块，选择 `File -> New ->\
  \ New Module...` 菜单选项，并在生成的对话框中从左侧面板选择 `Dynamic Feature`。在主面板中，将模块命名为 `dynamic_feature`，并将\
  \ API 设置更改为 `API 26: Android 8.0 (Oreo)`，与基础模块选择的 API 级别一致，如图 84-2 所示：\n\n![](img/as_4.2_add_dynmaic_feature.jpg)\n\
  图 84-2\n\n再次点击 `Next` 按钮以配置按需选项，确保启用了 `Fusing` 选项。在 `Module Title` 字段中输入文本“Example\
  \ Dynamic Feature”：\n\n![](img/as_4.2_dynamic_feature_options.jpg)\n图 84-3\n\n为了本示例，在点击\
  \ `Finish` 按钮之前，将 `Install-time inclusion` 菜单设置为 `Do not include module at install\
  \ time (on-demand only)` 以提交更改并将动态功能添加到项目。\n\n## 84.5 查看动态功能模块\n\n在下一步之前，值得花时间查看\
  \ Android Studio 所做的更改。理解更改对于解决问题和将现有功能转换为动态功能很有用。\n\n首先参考 `Project` 工具窗口，那里将出现一个代表新动态功能的文件夹条目：\n\
  \n![](img/as_3.5_dynamic_feature_project_window.jpg)\n图 84-4\n\n注意该功能有自己的结构，包括一个清单文件、可以添加代码和资源的包以及一个\
  \ `res` 文件夹。打开并查看 `AndroidManifest.xml` 文件，它应该包含功能创建过程中选择的属性设置，包括 `on-demand`、`fusing`\
  \ 和功能标题值：\n\n```xml\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:dist=\"http://schemas.android.com/apk/distribution\"\n    package=\"\
  com.ebookfrenzy.my_dynamic_feature\">\n    <dist:module\n        dist:instant=\"\
  false\"\n        dist:title=\"@string/title_my_dynamic_feature\">\n        <dist:delivery>\n\
  \            <dist:on-demand />\n        </dist:delivery>\n        <dist:fusing\
  \ dist:include=\"true\" />\n    </dist:module>\n</manifest>\n```\n\n\n\n\n\n一个特别感兴趣的点是，模块标题字符串已存储为字符串资源，而不是直接输入在清单文件中。这是为了标题字符串和资源可以在基础模块的\
  \ `strings.xml` 文件（`app -> res -> values -> strings.xml`）中找到，并在必要时进行修改。\n\n动态功能模块的构建配置可以在\
  \ `Gradle Scripts -> build.gradle (Module: DynamicFeature.my_dynamic_feature)` 文件找到，其内容如下：\n\
  \n```gradle\nplugins {\n    id 'com.android.dynamic-feature'\n}\n\nandroid {\n \
  \   compileSdkVersion 31\n}\n\ndependencies {\n    implementation project(\":app\"\
  )\n}\n```\n\n该文件中的关键条目是应用 `com.android.dynamic-feature` 插件，这确保了该模块被视为动态功能模块，以及 `implementation`\
  \ 行表示该功能依赖于基础 `(app)` 模块。\n\n基础模块的 `build.gradle` 文件（`Gradle Scripts -> build.gradle\
  \ (Module: DynamicFeature.app)`）也包含一个列出动态功能模块的新条目。在查看该文件时，请添加指令以启用视图绑定（view binding）支持：\n\
  \n```gradle\nplugins {\n    id 'com.android.application'\n}\n\nandroid {\n    buildFeatures\
  \ {\n        viewBinding true\n    }\n    dynamicFeatures = [':my_dynamic_feature']\n\
  }\n```\n\n项目中添加的任何额外动态功能也需要在此处引用，例如：\n`dynamicFeatures = [\":my_dynamic_feature\"\
  , \":my_second_feature\", ...]`\n\n## 84.6 添加动态功能 Activity\n\n从上方的图 84-4 所示的 Project\
  \ 工具窗口可以看出，此时动态功能模块几乎只包含一个清单文件。下一步是向模块添加一个 activity，以便该功能在从基础模块启动时能够执行实际操作。在 Project\
  \ 工具窗口中，右键点击位于 `my_dynamic_feature -> java` 下的包名，选择 `New -> Activity -> Empty Activity`\
  \ 菜单。将 activity 命名为 `MyFeatureActivity` 并启用 `Generate Layout File` 选项，但在点击 `Finish`\
  \ 按钮之前禁用 `Launcher Activity` 选项。![](img/as_4.2_add_dynamic_feature_activity.jpg)\n\
  \n图 84-5\n\n一旦将 activity 添加到模块中，请编辑 `AndroidManifest.xml` 文件并修改它以添加意图过滤器（intent\
  \ filter），允许基础模块启动该 activity（将 `<com.yourcompany>` 替换为您选择的包名，以确保您的应用在 Google Play\
  \ 上是唯一的）：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:dist=\"http://schemas.android.com/apk/distribution\"\
  \n    package=\"com.ebookfrenzy.my_dynamic_feature\">\n    <dist:module\n      \
  \  dist:instant=\"false\"\n        dist:title=\"@string/title_my_dynamic_feature\"\
  >\n        <dist:delivery>\n            <dist:on-demand />\n        </dist:delivery>\n\
  \        <dist:fusing dist:include=\"true\" />\n    </dist:module>\n    <application>\n\
  \        <activity android:name=\".MyFeatureActivity\"\n                  android:exported=\"\
  true\">\n            <intent-filter>\n                <action android:name=\"android.intent.action.VIEW\"\
  \ />\n                <action android:name=\"<com.yourcompany>.my_dynamic_feature.MyFeatureActivity\"\
  \ />\n                <category android:name=\"android.intent.category.DEFAULT\"\
  \ />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n\
  ```\n\n接下来，编辑 `build.gradle (Module: DynamicFeature)` 文件的 `dependencies` 部分以包含 Google\
  \ 库：\n\n```gradle\ndependencies {\n    implementation 'com.google.android.play:core:1.0.1'\n\
  }\n```\n\n为了能够访问动态模块的资源，需要在 `MyFeatureActivity` 中调用 `SplitCompat.install()`。编辑 `MainActivity.java`\
  \ 并按所示修改 `onCreate()` 方法，包括视图绑定支持：\n\n```java\nimport android.view.View;\nimport\
  \ com.google.android.play.core.split.SplitCompat;\nimport com.yourcompany.databinding.ActivityMainBinding;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private ActivityMainBinding\
  \ binding;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        SplitCompat.install(this);\n\
  \        binding = ActivityMainBinding.inflate(getLayoutInflater());\n        View\
  \ view = binding.getRoot();\n        setContentView(view);\n    }\n```\n\n在尚未安装的动态模块中启动\
  \ activity 将导致应用崩溃，并出现类似的错误：\n`java.lang.RuntimeException: Unable to start activity{com.ebookfrenzy.dynamic_feature/MyFeatureActivity}:\
  \ android.content.Resources$NotFoundException: Resource #0x0`\n\n## 84.7 实现 launch()\
  \ 方法\n\n完成项目结构和用户界面后，是时候使用 Play Core 开始处理动态模块了。第一步是实现 `launchFeature()` 方法，其目的是使用意图（intent）启动动态功能。然而，尝试启动尚未安装的动态模块中的\
  \ activity 会导致应用崩溃。因此，`launchFeature()` 方法需要包含防御性代码以确保功能已安装。为了实现这一点，我们需要创建一个 `SplitInstallManager`\
  \ 类的实例，并调用该对象的 `getInstalledModules()` 方法来检查 `my_dynamic_feature` 是否安装。如果是，则可以安全地启动模块中的\
  \ activity，否则需要在状态 TextView 上向用户显示消息。\n\n```84.6\nif (manager.getInstalledModules().contains(\"\
  my_dynamic_feature\")) {\n    Intent i = new Intent(this, \"<com.yourcompany>.my_dynamic_feature.MyFeatureActivity\"\
  );\n    startActivity(i);\n} else {\n    binding.statusText.setText(\"Feature not\
  \ yet installed\");\n}\n}\n```java\n\n## 84.8 上传 App Bundle 进行测试\n\n项目现在已准备好进行第一阶段测试。这涉及生成发布版\
  \ app bundle 并将其上传到 Google Play Console。实现这些步骤在[“创建、测试和上传 Android App Bundle”（App_Bundles.xhtml__idTextAnchor1524）章节中已有概述，但可以总结如下：\n\
  \n1. 登录 Google Play Console 并创建一个新应用。\n\n\n\n\n2. 按照步骤对标题、描述、分类和图像资源进行应用配置（示例图像资源可以在随书提供的示例代码下载的\
  \ `image_assets` 文件夹中找到），并保存草稿设置。同时，确保为应用包启用 Google Play 应用签名。\n\n3. 使用 Android\
  \ Studio 的 `Build` -> `Generate Signed App Bundle / APK...` 菜单生成经过签名的发布版应用包。\n\n\
  4. 在 Google Play Console 中，从左侧导航面板选择 `Testing`（测试） -> `Internal testing`（内部测试）选项。\n\
  \n5. 在内部测试界面，点击 `Create Release`（创建发布）按钮并点击 `Continue`（继续），接受让 Google 管理签名任务的选项。将上方生成的应用包文件拖入上传框中并点击\
  \ `Save`（保存）。\n\n6. 切换到内部测试界面内的 `Testers`（测试人员）标签页，添加用于在一个或多个物理设备上测试应用的账户邮箱地址。\n\
  \n7. 返回 `Releases`（发布）标签页并点击 `Edit`（编辑）按钮。滚动到结果页面底部，点击 `Review release`（审核发布）按钮。\n\
  \n8. 在确认屏幕上，点击 `Start rollout to Internal testing`（发布到内部测试）按钮。该应用将列为 `Pending publication`（待发布）。\n\
  \n一旦发布开始测试，将向内部测试轨道上的所有用户发送通知，请求他们加入应用的测试轨道。或者，复制 `Testers` 屏幕上列出的 URL 并发送给测试用户。一旦用户加入，将提供一个链接，在设备上打开该链接将启动\
  \ Play Store 应用并打开 `DynamicFeature` 应用的下载页面，如图 84-7 所示：\n\n![](img/as_3.6_install_dynamic_feature_app.jpg)\n\
  \n图 84-7\n\n点击按钮安装应用，然后打开它并点击 `Launch Feature`（启动功能）按钮。动态功能尚未安装的事实应反映在状态文本中。\n\n\
  ### 84.9 实现 `installFeature()` 方法\n\n`installFeature()` 方法将为 `my_dynamic_feature`\
  \ 模块创建一个 `SplitInstallRequest` 对象，然后使用 `SplitInstallManager` 实例启动安装过程。还将实现监听器以显示\
  \ `Toast` 消息指示安装请求的状态。在 `MainActivity.java` 文件中，如下如下添加 `installFeature()` 方法：\n\n\
  ```java\nimport android.widget.Toast;\nimport com.google.android.play.core.splitinstall.SplitInstallRequest;\n\
  import com.google.android.play.core.tasks.OnFailureListener;\nimport com.google.android.play.core.tasks.OnSuccessListener;\n\
  \npublic void installFeature(View view) {\n    SplitInstallRequest request =\n \
  \           SplitInstallRequest\n                    .newBuilder()\n           \
  \         .addModule(\"my_dynamic_feature\")\n                    .build();\n  \
  \  manager.startInstall(request)\n            .addOnSuccessListener(new OnSuccessListener<Integer>()\
  \ {\n                @Override\n                public void onSuccess(Integer sessionId)\
  \ {\n                    Toast.makeText(MainActivity.this,\n                   \
  \         \"Module installation started\",\n                            Toast.LENGTH_SHORT).show();\n\
  \                }\n            })\n            .addOnFailureListener(new OnFailureListener()\
  \ {\n            @Override\n            public void onFailure(Exception exception)\
  \ {\n                Toast.makeText(MainActivity.this,\n                       \
  \ \"Module installation failed\" + exception.toString(),\n                     \
  \   Toast.LENGTH_SHORT).show();\n            });\n}\n```\n\n编辑 `Gradle Scripts`\
  \ -> `build.gradle` (Module: `DynamicFeature.app`) 文件并增加 `versionCode` 和 `versionName`\
  \ 的值，以便可以将应用的新版本上传进行测试：\n\n```gradle\nandroid {\n    versionCode 2\n    versionName\
  \ \"2.0\"\n}\n```\n\n重复此步骤，在 `Gradle Scripts` -> `build.gradle` (Module: `DynamicFeature.my_dynamic_feature`)\
  \ 中声明一个匹配的版本号。生成一个包含更改的新应用包，然后返回 Google Play Console 中该应用的 `Testing` -> `Internal\
  \ testing` 页面，点击图 84-8 所示所示的 `Create new release` 按钮：\n\n![](img/as_4.1_dynamic_feature_new_release.jpg)\n\
  \n图 84-8\n\n按照步骤上传新的应用包并发布到内部测试。在测试设备上，打开 Google Play 应用并确保 `Install`（安装）按钮已变为 `Update`（更新）按钮（如果没有变为，请关闭应用商店并在几分钟后重试），并更新到新版本。一旦更新完成，运行应用，点击\
  \ `Install Feature` 按钮并检查 `Toast` 消息以确保安装已开始。在下载功能时，屏幕顶部的状态栏应短暂出现下载图标。下载完成后，点击 `Launch\
  \ Feature` 按钮显示第二个 Activity。\n\n如果安装失败或应用崩溃，通常可以从 `LogCat` 输出识别原因。要查看此输出，将设备连接到开发计算机，打开终端或命令提示窗口并执行以下命令：\n\
  \n```bash\nadb logcat\n```\n\n此 `adb` 命令将实时显示 `LogCat` 输出，包括应用遇到问题或崩溃时生成的任何异常或诊断错误。\n\
  \n### 84.10 添加更新监听器\n\n为了更详细地跟踪动态功能的安装进度，可以在应用中添加 `SplitInstallStateUpdatedListener`\
  \ 实例。由于可以同时安装多个功能模块，需要添加代码来跟踪分配的会话 ID。首先添加导入，在 `MainActivity.java` 文件中声明一个包含当前会话\
  \ ID 的变量，并修改 `installFeature()` 方法以便每次启动安装时存储会话 ID 并注册监听器：\n\n```java\nimport com.google.android.play.core.splitinstall.SplitInstallState;\n\
  import com.google.android.play.core.splitinstall.SplitInstallStateUpdatedListener;\n\
  import com.google.android.play.core.splitinstall.model.SplitInstallSessionStatus;\n\
  import java.util.Locale;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private ActivityMainBinding binding;\n    private SplitInstallManager manager;\n\
  \    private int mySessionId = 0;\n\n    public void installFeature(View view) {\n\
  \        manager.registerListener(listener);\n        manager.startInstall(request)\n\
  \                .addOnSuccessListener(new OnSuccessListener<Integer>() {\n    \
  \                @Override\n                    public void onSuccess(Integer sessionId)\
  \ {\n                        mySessionId = sessionId;\n                        Toast.makeText(MainActivity.this,\n\
  \                                \"Module installation started\",\n            \
  \                    Toast.LENGTH_SHORT).show();\n                    }\n      \
  \          });\n```\n\n接下来，实现监听器代码，如下：\n\n```java\nSplitInstallStateUpdatedListener\
  \ listener =\n    new SplitInstallStateUpdatedListener() {\n        @Override\n\
  \        public void onStateUpdate(SplitInstallState state) {\n            if (state.sessionId()\
  \ == mySessionId) {\n                switch (state.status()) {\n               \
  \     case SplitInstallSessionStatus.DOWNLOADING:\n                        long\
  \ size = state.totalBytesToDownload();\n                        long downloaded\
  \ = state.bytesDownloaded();\n                        binding.statusText.setText(String.format(Locale.getDefault(),\n\
  \                                \"%d of %d bytes downloaded.\", downloaded, size));\n\
  \                        break;\n                }\n            }\n        }\n \
  \   };\n```\n\n\n\n\n\n```java\ncase SplitInstallSessionStatus.INSTALLING:\n   \
  \ binding.statusText.setText(\"Installing feature\");\n    break;\ncase SplitInstallSessionStatus.DOWNLOADED:\n\
  \    binding.statusText.setText(\"Download Complete\");\n    break;\ncase SplitInstallSessionStatus.INSTALLED:\n\
  \    binding.statusText.setText(\"Installed - Feature is ready\");\n    break;\n\
  case SplitInstallSessionStatus.CANCELED:\n    binding.statusText.setText(\"Installation\
  \ cancelled\");\n    break;\ncase SplitInstallSessionStatus.PENDING:\n    binding.statusText.setText(\"\
  Installation pending\");\n    break;\ncase SplitInstallSessionStatus.FAILED:\n \
  \   binding.statusText.setText(\"Installation Failed. Error code: \" + state.errorCode());\n\
  \    break;\n}\n```\n\n该监听器捕获许多常见的安装状态并相应更新状态文本，包括提供下载大小信息以及目前为止下载的字节数总和。在继续之前，请添加\
  \ `onPause()` 和 `onResume()` 生命周期方法，以确保在应用未活跃状态时注销监听器：\n\n```java\n@Override\npublic\
  \ void onResume() {\n    manager.registerListener(listener);\n    super.onResume();\n\
  }\n\n@Override\npublic void onPause() {\n    manager.unregisterListener(listener);\n\
  \    super.onPause();\n}\n```\n\n通过增加两个模块级 `build.gradle` 文件中的版本号信息、生成并上传新的发布应用包并将其发布测试，验证监听器代码是否工作。如果设备上已经安装了动态功能模块，`Play\
  \ Core Library` 类将忽略再次下载该模块的尝试。因此，为了充分测试监听器，必须在安装更新的版本之前，从 Play Store 应用中卸载该应用。当然，移除应用后，将没有“更新”按钮通知我们新版本已准备好安装。要查看\
  \ Play Store 应用将安装哪个版本，请向下滚动应用页面到 `Read More`（阅读更多）按钮，选择它并检查 `App Info`（应用信息）部分中的\
  \ `Version`（版本）字段，如下方的图 84-9 所示：\n\n![](img/as_3.4_dynamic_feature_app_store_details.jpg)\n\
  \n图 84-9\n\n如果旧版本仍然列出，请退出 Play 应用并等待几分钟后再再次检查。一旦新版本列出，完成安装，打开应用并检查在下载动态功能模块时状态文本是否得到了恰当更新。\n\
  \n### 84.11 使用延迟安装\n\n延迟安装会导致动态功能模块在后台下载，并根据用户的决定决定何时完成。\n\n## 84.12 移除动态模块\n\n\
  本项目的最后一个任务是在不再需要时移除动态模块。\n\n## 84.13 总结\n\n本章涵盖了动态功能模块的创建以及如何在应用程序中管理它们。\n\n\n\n\
  \n\nAndroid Studio 项目使用另一个名为 `Maven` 的项目管理工具来处理远程依赖。如果使用 `Maven` 语法在 `Gradle` 构建文件中声明了远程依赖，则该依赖将自动从指定的仓库下载并包含在构建过程中。例如，下面的依赖声明将导致从\
  \ Google 仓库将 `AppCompat` 库添加到项目中：\n\n```gradle\nimplementation 'androidx.appcompat:appcompat:1.2.0'\n\
  ```\n\n## 85.2.3 构建变体 (Build Variants)\n\n除了依赖项，`Gradle` 还为 Android Studio 项目提供了构建变体支持。这允许从单个项目构建应用程序的多个变体。Android\
  \ 在许多不同的设备上，涵盖了各种处理器类型和屏幕尺寸。为了尽可能针对广泛设备类型和尺寸，通常需要构建应用程序的多个不同变体（例如，一个适用于手机的用户界面，另一个适用于平板大小的屏幕）。通过使用\
  \ `Gradle`，这在 Android Studio 中是可能的。\n\n## 85.2.4 Manifest 条目 (Manifest Entries)\n\
  \n每个 Android Studio 项目都关联有一个 `AndroidManifest.xml` 文件，其中包含应用程序的配置详情。在 `Gradle` 构建文件中可以指定许多清单条目，这些条目在项目构建时会自动生成到清单文件中。这种功能与构建变体功能互补，允许为每个构建变体配置不同的应用程序版本号、应用\
  \ ID 和 SDK 版本信息等元素。\n\n## 85.2.5 APK 签名 (APK Signing)\n\n标题为 “创建、测试和上传 Android App\
  \ 包” 的章节涵盖了使用 Android Studio 环境创建签名的发布版 APK 文件。也可以将通过 Android Studio 用户界面输入的签名信息包含在\
  \ `Gradle` 构建文件中，以便可以从命令行生成已签名的 APK 文件。\n\n## 85.2.6 ProGuard 支持\n\n`ProGuard` 是\
  \ Android Studio 自带的一个工具，它可以优化、压缩和混淆 Java 字节码，使其更高效且更难被反向工程（他人通过分析编译后的 Java 字节码来识别应用程序逻辑的方法）。`Gradle`\
  \ 构建文件提供了在构建您的程序时控制是否对该程序运行 `ProGuard` 的能力。\n\n## 85.3 顶层 Gradle 构建文件\n\n一个完整的 Android\
  \ Studio 项目包含了构建 Android 应用程序所需的一切内容，由模块、库、清单文件和 `Gradle` 构建文件组成。\n\n每个项目包含一个顶层\
  \ `Gradle` 构建文件。该文件列为 `build.gradle` (Project: `<project name>`)，可以在项目工具窗口中找到，如图\
  \ 85-1\n\n图 85-1\n\n默认情况下，顶层 `Gradle` 构建文件的内容如下：\n\n```gradle\n// 顶层构建文件，可以在此处添加适用于所有子项目/模块的配置选项。\n\
  \nbuildscript {\n    repositories {\n        google()\n        mavenCentral()\n\
  \    }\n    dependencies {\n        classpath \"com.android.tools.build:gradle:4.2.0-rc01\"\
  \n        // 注意: 不要将您的应用程序依赖放在此处；它们属于\n        // 单个模块的 build.gradle 文件\n    }\n\
  }\n\ntask clean(type: Delete) {\n    delete rootProject.buildDir\n}\n```\n\n目前，该文件的作用仅仅是声明使用\
  \ `jcenter` 仓库获取远程库，并且构建依赖于 Gradle 的 Android 插件。在大多数情况下，没有必要对此构建文件进行任何更改。\n\n##\
  \ 85.4 模块级 Gradle 构建文件\n\n一个 Android Studio 项目由一个或多个模块组成。例如，有一个名为 `GradleDemo` 的假设应用程序项目，它包含两个名为\
  \ `Module1` 和 `Module2` 的模块。在这种情况下，每个模块都需要自己的 `Gradle` 构建文件。从项目结构来看，这些文件的位置如下：\n\
  \n- `Module1/build.gradle`\n- `Module2/build.gradle`\n\n默认情况下，`Module1` `build.gradle`\
  \ 文件将类似于下面的列表：\n\n```gradle\nplugins {\n    id 'com.android.application'\n}\n\n\
  android {\n    compileSdk 31\n    defaultConfig {\n        applicationId \"com.ebookfrenzy.demoapp\"\
  \n        minSdkVersion 26\n        targetSdkVersion 31\n        versionCode 1\n\
  \        versionName \"1.0\"\n        testInstrumentationRunner \"androidx.test.runner.AndroidJUnitRunner\"\
  \n    }\n    buildTypes {\n        release {\n            minifyEnabled false\n\
  \            proguardFiles getDefault('proguard-android-optimize.txt'), 'proguard-rules.pro'\n\
  \        }\n    }\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_1_8\n\
  \        targetCompatibility JavaVersion.VERSION_1_8\n    }\n}\n\ndependencies {\n\
  \    implementation 'androidx.appcompat:appcompat:1.3.1'\n    implementation 'com.android.material:material:1.4.0'\n\
  \    implementation 'androidx.constraintlayout:constraintlayout:2.1.0'\n    testImplementation\
  \ 'junit:4.13.2'\n    androidTestImplementation 'androidx.test.ext:junit:1.1.5'\n\
  \    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'\n}\n\
  ```\n\n从文件内容可以看出，该文件开头声明了使用 Android 插件：\n\n```gradle\nplugins {\n    id 'com.android.application'\n\
  }\n```\n\n`android` 部分接着了构建 `Module1` 时使用的 SDK 版本：\n\n```gradle\nandroid {\n   \
  \ compileSdk 31\n}\n```\n\n`defaultConfig` 节中的项定义了构建期间生成到 `AndroidManifest.xml`\
  \ 中的元素。这些设置可以在构建文件中进行修改，它们是在模块创建时采用的：\n\n```gradle\ndefaultConfig {\n    applicationId\
  \ \"com.ebookfrenzy.demoapp\"\n    minSdkVersion 26\n    targetSdkVersion 31\n \
  \   versionCode 1\n    versionName \"1.0\"\n    testInstrumentationRunner \"androidx.test.runner.AndroidJUnitRunner\"\
  \n}\n```\n\n`buildTypes` 节包含了在构建应用程序发布版本何时以及如何运行 `ProGuard` 的指令：\n\n```gradle\n\
  buildTypes {\n    release {\n        minifyEnabled false\n        proguardFiles\
  \ getDefault('proguard-android-optimize.txt'), 'proguard-rules.pro'\n    }\n}\n\
  ```\n\n按照目前的配置，构建 `Module1` 时不会运行 `ProGuard`。要启用 `ProGuard`，需要将 `minifyEnabled`\
  \ 项从 `false` 改为 `true`。`proguard-rules.pro` 文件可以在模块目录中找到。\n\n由于该文件中没有声明 `debug`\
  \ 构建类型，将使用默认值（不带 `ProGuard` 构建，使用调试密钥签名并启用调试符号）。\n\n模块构建文件中还可以包含一个名为 `productFlavors`\
  \ 的额外节，以便创建多个构建变体。\n\n接下来，包含了指令以指定构建项目时使用的 Java 编译器版本：\n\n```gradle\ncompileOptions\
  \ {\n    sourceCompatibility JavaVersion.VERSION_1_8\n    targetCompatibility JavaVersion.VERSION_1_8\n\
  }\n```\n\n最后，`dependencies` 节列出了模块依赖的任何本地和远程依赖。上述示例文件依赖行指定了需要从 Android 仓库包含的 Android\
  \ 库：\n\n```gradle\ndependencies {\n    implementation 'androidx.appcompat:appcompat:1.3.1'\n\
  \    implementation 'com.android.material:material:1.4.0'\n    implementation 'androidx.constraintlayout:constraintlayout:2.1.0'\n\
  \    testImplementation 'junit:4.13.2'\n    androidTestImplementation 'androidx.test.ext:junit:1.1.5'\n\
  \    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'\n}\n\
  ```\n\n\n\n\n\n# 85.5 在构建文件中配置签名设置\n\n本书的“创建、测试和上传 Android App Bundle” 章节涵盖了使用 Android\
  \ Studio 用户界面设置密钥和生成签名发布版 APK 文件的步骤。这些设置也可以在 `build.gradle` 文件的 `signingSettings`\
  \ 节点中声明。例如：\n\n```gradle\n    defaultConfig {\n\n    }\n    signingConfigs {\n \
  \       release {\n            storeFile file(\"keystore.release\")\n          \
  \  storePassword \"your keystore password here\"\n            keyAlias \"your key\
  \ alias here\"\n            keyPassword \"your key password here\"\n        }\n\
  \    }\n    buildTypes {\n\n}\n```\n\n上面的示例将密钥密码信息直接嵌入到构建文件中。这种方法的另一种替代方案是从系统环境变量中提取这些值：\n\
  \n```gradle\nsigningConfigs {\n    release {\n        storeFile file(\"keystore.release\"\
  )\n        storePassword System.getenv(\"KEYSTOREPASSWD\")\n        keyAlias \"\
  your key alias here\"\n        keyPassword System.getenv(\"KEYPASSWD\")\n    }\n\
  }\n```\n\n另一种方法是配置构建文件，让 Gradle 在构建过程中提示输入密码：\n\n```gradle\nsigningConfigs {\n \
  \   release {\n        storeFile file(\"keystore.release\")\n        storePassword\
  \ System.console().readLine(\n                          (\"\\nEnter Keystore password:\
  \ \")\n        keyAlias \"your key alias here\"\n        keyPassword System.console().readLIne(\"\
  \\nEnter Key password: \")\n    }\n}\n```\n\n# 85.6 从命令行运行 Gradle 任务\n\n每个 Android\
  \ Studio 项目都包含一个 Gradle wrapper 工具，用于允许从命令行调用 Gradle 任务。该工具位于每个项目文件夹的根目录下。虽然该 wrapper\
  \ 在 Windows 系统上是可执行的，但在 Linux 和 macOS 上使用之前需要启用执行权限。要启用执行权限，请打开终端窗口，进入到需要该 wrapper\
  \ 的项目目录，并执行以下命令：\n\n```bash\nchmod +x gradlew\n```\n\n一旦文件具有执行权限，则需要将该文件的路径添加到你的\
  \ `$PATH` 环境变量中，或者在名称前加上 `./` 以便运行它。例如：\n\n```bash\n./gradlew tasks\n```\n\nGradle\
  \ 将项目构建视为许多不同的任务。通过在项目目录内运行以下命令，可以获取当前项目的可用任务完整列表（在 macOS 或 Linux 上运行时，请记住在命令前加上\
  \ `./`）：\n\n```bash\ngradlew tasks\n```\n\n要构建适用于设备或模拟器测试的项目调试发布版，请使用 `assembleDebug`\
  \ 选项：\n\n```bash\ngradlew assembleDebug\n```\n\n或者，要构建应用程序的发布版本：\n\n```bash\ngradlew\
  \ assembleRelease\n```\n\n## 85.7 总结\n\n在大多数情况下，Android Studio 在后台执行应用构建，无需开发人员干预。此构建过程由\
  \ Gradle 系统处理，Gradle 是一个自动化构建工具包，旨在通过一组构建配置文件来配置和管理项目的构建方式。虽然 Gradle 的默认行为足以满足许多基础的项目构建需求，但对于更复杂的项目，配置构建过程的需求是不可避免的。本章概述了\
  \ Android Studio 项目背景下的 Gradle 构建系统和配置文件。\n\n## 索引\n\n### 符号\n- `<application>`\
