  \n注意片段现在布局中可见，如图 31-9 所示：\n\n![](img/as_4.1_fragments_added.jpg)\n\n图 31-9\n\n在继续下一步之前，在布局中选择\
  \ `TextFragment` 实例，并在属性（Attributes）工具窗口中将片段的 ID 更改为 `text_fragment`。\n\n## 31.7\
  \ 让 Toolbar Fragment 与 Activity 通\n\n当用户触摸工具栏片段中的按钮时，片段类需要从 `EditText` 视图获取文本以及\
  \ `SeekBar` 的当前值发送到文本片段。正如“Android 片段简介”所述，片段之间不应直接通信，而应使用嵌入它们的活动作为中间媒介。\n\n此过程的第一步是确保工具栏片段对按钮点击有响应。我们还需要实现一些代码来跟踪\
  \ `SeekBar` 视图的值。在本例中，我们将在 `ToolbarFragment` 类中实现这些监听器。选择 `ToolbarFragment.java`\
  \ 文件并对其修改，如下所示所示：\n\n```java\npackage com.ebookfrenzy.fragmentexample;\n\n.\n\n\
  .\n\nimport android.content.Context;\n\nimport android.widget.SeekBar;\n\npublic\
  \ class ToolbarFragment extends Fragment implements\n                          \
  \     SeekBar.OnSeekBarChangeListener {\n\n    private static int seekvalue = 10;\n\
  \n.\n\n.\n\n@Override\n    public void onViewCreated(@NonNull View view,\n     \
  \                        @Nullable Bundle savedInstanceState) {\n\n        super.onViewCreated(view,\
  \ savedInstanceState);\n        binding.seekBar1.setOnSeekBarChangeListener(this);\n\
  \        binding.button1.setOnClickListener(new View.OnClickListener() {\n     \
  \       public void onClick(View v) {\n                buttonClicked(v);\n     \
  \       }\n        });\n    }\n    public void buttonClicked (View view) {\n   \
  \ }\n    @Override\n    public void onProgressChanged(SeekBar seekBar, int progress,\n\
  \                                boolean fromUser) {\n        seekvalue = progress;\n\
  \    }\n    @Override\n    public void onStartTracking(SeekBar arg0) {\n    }\n\
  \    @Override\n    public void onStopTracking(SeekBar arg0) {\n    }\n\n```\n\n\
  在继续之前，我们需要花些时间解释上面的代码。首先，该类声明为实现 `OnSeekBarChangeListener` 接口。这是因为用户界面包含一个 `SeekBar`\
  \ 实例，片段在用户滑动滑条更改大小时需要接收通知。实现 `OnSeekBarChangeListener` 接口要求实现 `onProgressChanged()`、`onStartTracking()`\
  \ 和 `onStopTracking()` 方法。这些方法已经实现，但实际上只需要 `onProgressChanged()` 来执行任务，在此情况下，即是将新值存储在名为\
  \ `seekvalue` 的变量中，该变量在类的开头已声明。此外还声明了一个变量，用于存储对 `EditText` 对象的引用。\n\n`onViewCreated()`\
  \ 方法已添加，用于为按钮设置 `OnClickListener`，以便在检测到点击事件时调用 `buttonClicked()`。该方法已实现，尽管目前它没有做任何操作。\n\
  \n此过程的下一阶段是设置监听器，允许片段在点击按钮时调用活动。这遵循在前一节中概述的机制：\n\n```java\npublic class ToolbarFragment\
  \ extends Fragment\n    implements SeekBar.OnSeekBarChangeListener {\n\n    private\
  \ static int seekvalue = 10;\n    ToolbarListener activityCallback;\n    public\
  \ interface ToolbarListener {\n        public void onButtonClick(int position, String\
  \ text);\n    }\n    @Override\n    public void onAttach(Context context) {\n  \
  \      super.onAttach(context);\n        try {\n            activityCallback = (ToolbarListener)\
  \ context;\n        } catch (ClassCastException e) {\n            throw new ClassCastException(context.toString()\n\
  \                + \" must implement ToolbarListener\");\n        }\n    }\n.\n\n\
  .\n\n    public void buttonClicked (View view) {\n        activityCallback.onButtonClick(seekvalue,\n\
  \            binding.editText1.getText().toString());\n    }\n.\n.\n\n.\n}\n```\n\
  \n上述实现将导致在用户点击按钮时属于活动类的 `onButtonClick()` 方法被调用。因此，剩下的工作是声明活动类实现新创建的 `ToolbarListener`\
  \ 接口并实现 `onButtonClick()` 方法。\n\n由于早期 Android 版本中使用 Android 支持库来支持片段，活动还需要更改为子自\
  \ `FragmentActivity` 而不是 `AppCompatActivity`。将这些要求结合起来，得到了以下修改后的 `MainActivity.java`\
  \ 文件：\n\n```java\npackage com.ebookfrenzy.fragmentexample;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  \nimport androidx.fragment.app.FragmentActivity;\n\nimport android.os.Bundle;\n\n\
  public class MainActivity extends FragmentActivity implements ToolbarFragment.ToolbarListener\
  \ {\n\n.\n\n.\n    public void onButtonClick(int fontsize, String text) {\n\n  \
  \  }\n}\n```\n\n\n\n按照目前的代码更改，工具栏片段将检测用户何时点击按钮，并调用 activity 的一个方法，传递 `EditText`\
  \ 字段的内容和 `SeekBar` 视图的当前设置。现在轮到 activity 的任务是与 `Text Fragment` 进行通信并传递这些值，以便片段能够相应地更新\
  \ `TextView` 对象。\n\n### 31.8 让 Activity 与 Text Fragment 通信\n\n如“Android Fragments\
  \ 简介”所述，activity 可以通过获取片段类实例的引用，然后调用该对象上的公共方法与片段进行通信。因此，在 `TextFragment` 类中，我们现在将实现一个名为\
  \ `changeTextProperties()` 的公共方法，该方法接受一个表示字体大小的整数和一个表示要显示的新文本的字符串作为参数。该方法将使用这些值来修改\
  \ `TextView` 对象。在 Android Studio 编辑面板中，找到并修改 `TextFragment.java` 文件，以添加此新方法：\n\n\
  ```java\npackage com.ebookfrenzy.fragmentexample;\n\n.\n\n.\n\npublic class TextFragment\
  \ extends Fragment {\n\n.\n\n.\n\n    public void changeTextProperties(int fontsize,\
  \ String text)\n    {\n        binding.textView2.setTextSize(fontsize);\n      \
  \  binding.textView2.setText(text);\n    }\n}\n```\n\n当 `TextFragment` 片段放置在 activity\
  \ 的布局中，它被赋予了一个 ID `text_fragment`。使用此 ID，activity 现在可以获取片段实例的引用并调用该对象上的 `changeTextProperties()`\
  \ 方法。编辑 `MainActivity.java` 文件并如下所示修改 `onButtonClick()` 方法：\n\n```java\npublic void\
  \ onButtonClick(int fontsize, String text) {\n    TextFragment textFragment =\n\
  \    (TextFragment)\n      getSupportFragmentManager().findFragmentById(R.id.text_fragment);\n\
  \    textFragment.changeTextProperties(fontsize, text);\n}\n```\n\n## 31.9 测试应用程序\n\
  \n该项目的代码编写已经完成，最后一个剩下的任务是运行应用程序。当应用程序启动时，主 activity 将启动，并创建创建显示两个片段。当用户触摸工具栏片段中的按钮时，activity\
  \ 的 `onButtonClick()` 方法将由工具栏片段调用，并传递来自 `EditText` 视图的文本和 `SeekBar` 的当前值。随后，activity\
  \ 将调用第二个片段的 `changeTextProperties()` 方法，该方法将修改 `TextView` 以反映新的文本和字体大小：\n\n![](img/as_4.1_fragment_example_running.jpg)\n\
  \n图 31-10\n\n## 31.10 总结\n\n本章的目标是完成一个示例项目的创建，该项目专门演示在 Android 应用程序中使用片段的步骤。涵盖的主题包括使用\
  \ Android Support Library 以兼容在引入片段之前的 Android 版本、在 activity 布局中包含片段，以及片段间通信的实现。\n\
  \n# 32. 使用 Jetpack 构建现代 Android 应用程序架构\n\n直到最近，Google 并没有推荐构建 Android 应用的特定方法，而是提供工具和开发工具包，让开发者决定哪种方法对于特定项目或个人编程风格最有效。这种情况在\
  \ 2017 年随着 Android Architecture Components 的引入而发生了变化，这些组件随后在 2018 年发布时成为了 Android\
  \ Jetpack 的一部分。\n\n本章的目的是提供 Jetpack 概念、Android 应用架构建议以及一些关键架构组件的概述。在涵盖基础知识后，这些主题将在后面的章节中更详细地讨论，并通过实际示例进行演示。\n\
  \n### 2.1 什么是 Android Jetpack？\n\nAndroid Jetpack 由 Android Studio、Android Architecture\
  \ Components 和 Android Support Library 组成，并带有一建议 Android App 应如何结构的指南。Android Architecture\
  \ Components 的目的是为了在开发 Android 应用时执行常用任务变得更快、更简单，同时符合架构指南的核心原则。\n\n虽然本书将涵盖所有的 Android\
  \ Architecture Components，但本章的目标是介绍关键架构指南以及 `ViewModel`、`LiveData`、`Lifecycle` 组件，同时引入数据绑定（Data\
  \ Binding）和 `Repositories`的使用。\n\n在继续之前，理解 Jetpack 应用开发方法并非强制性的非常重要。尽管强调了多年来广流行的其他技术的某些缺点，但\
  \ Google 并没有完全谴责那些应用开发方法。Google 似乎采取了这样的立场：虽然开发应用没有对错之分，但有一种推荐的方法。\n\n## 32.2 “旧”架构\n\
  \n在名为“在 Android Studio 中创建一个 Android 应用”的章节中，创建了一个包含单个 activity 的 Android 项目，该 activity\
  \ 包含了显示和管理用户界面的所有代码以及应用程序的后端逻辑。在 Jetpack 引入之前，最常见的架构遵循这种范式，应用由多个 activity 组成（应用中的每个屏幕对应一个），每个\
  \ activity 类在某种种程度上都混合了用户界面和后端代码。\n\n这种方法导致了一系列与应用生命周期相关的问题（例如，用户每次旋转设备时 activity\
  \ 都会被销毁并重建，导致任何未保存到某种持久化存储的应用数据丢失），以及诸如导航效率低下的问题（为每个屏幕启动新 activity）。\n\n### 32.3\
  \ 现代 Android 架构\n\n在最基础的层，Google 现在倡单 activity 应用，将不同的屏幕作为内容加载到 activity 中。\n\n\
  现代架构指南还建议将应用内部不同的职责区域分离到完全独立的模块（Google 将此称为“关注点分离”）。这种方法的关键之一是 `ViewModel` 组件。\n\
  \n## 32.4 ViewModel 组件\n\n`ViewModel` 的目的是将应用程序与用户界面相关的数据模型和逻辑从负责实际显示和管理界面以及与操作系统交互的代码分离出来。通过这种方式设计，应用程序将由一个或多个\
  \ UI 控制器（如 activity）以及负责处理这些控制器所需数据的 `ViewModel` 实例组成。\n\n实际上，`ViewModel` 只知道数据模型和相应的逻辑。它对用户界面一无所知，也不会尝试直接访问或响应与界面内视图相关的事件。当\
  \ UI 控制器需要显示数据时，它只需请求 `ViewModel` 提供。同样，当用户在界面内的视图中输入数据时，UI 控制器将其传递给 `ViewModel`\
  \ 进行处理。\n\n这种职责分离解决了 UI 控制器生命周期相关的问题。无论在应用生命周期内 UI 控制器重建了多少，`ViewModel` 实例都会保留在内存中，从而保持数据的一致性。例如，activity\
  \ 使用的 `ViewModel` 将留在内存中，直到 activity 完全结束，在单 activity 应用中，这意味着直到应用程序退出。\n\n![](img/jetpack_diagram_1.jpg)\n\
  \n图 32-1\n\n## 32.5 LiveData 组件\n\n\n\n\n考虑一个显示实时数据（如股票当前价格）的应用程序。该应用可能会使用某种形式的股票价格\
  \ Web 服务，用最新信息持续更新 `ViewModel` 中的数据模型。显然，除非及时将这些数据显示给用户，否则这些实时数据将毫无用处。有两种方法可以确保数据被显示给用户。\n\
  \n一种方案是使用 `ViewModel` 持续检查数据。然而，这种方法的问题在于效率很低。更好的解决方案是使用 `LiveData`，它允许 `ViewModel`\
  \ 在数据变化时接收通知。\n\n`LiveData` 是一个感知 Android 生命周期的可观察数据持有类。`LiveData` 只会更新处于活跃状态（例如\
  \ `STARTED` 或 `RESUMED`）的观察者。这可以防止当 Activity 在后台时因意外的生命周期事件导致崩溃。`LiveData` 还能确保当\
  \ UI 回到前台时，数据始终是最新的。\n\n`LiveData` 可以将数据从 `ViewModel` 传递到 UI。例如，`ViewModel` 可以暴露一个供\
  \ Activity 观察的 `LiveData` 对象。当 `LiveData` 中的数据发生变化时，观察者就会收到通知。\n\n```\npublic class\
  \ ViewModel extends ViewModel {\n    private MutableLiveData<Integer> stockPrice\
  \ = new MutableLiveData<>();\n\n    public LiveData<Integer> getStockPrice() {\n\
  \        return stockPrice;\n    }\n\n    public void updatePrice(Integer newPrice)\
  \ {\n        stockPrice.setValue(newPrice);\n    }\n}\n```\n\n在 Activity 中，你可以像这样观察\
  \ `LiveData` 对象：\n\n```java\nViewModel viewModel = new ViewModelProvider(this).get(ViewModel.class);\n\
  viewModel.getStockPrice().observe(this, new Observer<Integer>() {\n    @Override\n\
  \    public void onChanged(Integer price) {\n        // Update the UI with the new\
  \ price\n    }\n});\n```\n\n这种方法确保了 UI 仅在处于活跃状态时才更新，还能防止内存泄漏，因为当 Activity 销毁时，`LiveData`\
  \ 观察者会被清理。\n\n\n\n\nAndroid Jetpack 包含了 Android 架构组件（Android Architecture Components），这些组件专门经过设计，旨在让开发符合推荐指南的应用变得更容易。本章介绍了\
  \ `ViewModel`、`LiveData` 和 `Lifecycle` 组件。从下一章开始将详细介绍这些内容。本章未提到的其他架构组件将在本书后续部分介绍。\n\
  \n# 33. Android Jetpack ViewModel 教程\n\n上一章介绍了 Android Jetpack 的核心概念，并概述了现代 Android\
  \ 应用架构的基础。Jetpack 本质上定义了一套建议，描述了 Android 应用项目应该如何构建，同时提供了一系列库和组件，使其更容易遵循这些指南，旨在用更少的代码和更少的错误开发出可靠的应用。\n\
  \n为了帮助强化和澄清上一章提供的信息，本章将逐步演示一个使用 `ViewModel` 组件的示例应用项目的创建。该示例将在下一章中通过引入 `LiveData`\
  \ 和数据绑定支持进行进一步增强。\n\n## 33.1 关于项目\n\n在标题为在 Android Studio 中创建示例 Android 应用的章节中，创建了一个名为\
  \ `AndroidSample` 的项目，其中应用的所有代码都封装在主 `Activity` 类文件中。在随后的章节中，创建了一个 AVD 模拟器并用它运行该应用。在应用运行时，我们亲身经历了了按这种方式开发应用时发生的问题：当\
  \ `TextView` 小部件上显示的数据在设备旋转期间会丢失。\n\n本章将实现同一个货币转换器应用，这次将使用 `ViewModel` 组件并遵循 Google\
  \ 应用架构指南，以避免 Activity 生命周期带来的复杂性问题。\n\n## 33.2 创建 ViewModel 示例项目\n\n此练习的第一步是创建一个新项目。首先启动\
  \ Android Studio，如有必要，使用 `File -> Close Project` 菜单选项关闭任何已打开的项目，以便显示欢迎界面。\n\n创建\
  \ `AndroidSample` 项目时，选择了 `Empty Activity` 模板作为项目的依据。然而，对于此项目，将使用 `Fragment + ViewModel`\
  \ 模板。这将生成一个符合架构指南结构的 Android Studio 项目。\n\n从欢迎界面选择 `New Project` 选项，在弹出的新项目对话框中，在点击\
  \ `Next` 按钮之前选择 `Fragment + ViewModel` 模板。\n\n在 `Name` 字段中输入 `ViewModelDemo`，并指定\
  \ `com.ebookfrenzy.viewmodeldemo` 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为\
  \ `API 26: Android 8.0 (Oreo)`，并将语言菜单更改为 `Java`。编辑 `build.gradle (Module: ViewModelDemo)`\
  \ 文件，启用视图绑定（view binding）并点击编辑器面板顶部的 `Sync Now` 链接：\n\n```android\nandroid {\n \
  \   buildFeatures {\n        viewBinding true\n    }\n}\n```\n\n## 33.3 查看项目\n\n\
  使用 `Fragment + ViewModel` 模板创建项目时，其结构在许多方面与创建 `AndroidSample` 项目时使用的 `Empty Activity`\
  \ 有不同。项目的关键组件如下：\n\n### 33.3.1 主 Activity\n\n需要注意的是，主 Activity 的用户界面结构已经过处理，允许单个\
  \ activity 充当完成应用所需的全部屏幕的容器。活动的主用户界面布局包含在 `app -> res -> layout -> main_activity.xml`\
  \ 文件中，并以 `FrameLayout` 的形式提供了一个空容器空间（在图 33-1 中突出显示），屏幕内容将出现在其中：\n\n![](img/android_studio_view_model_container_area.jpg)\n\
  \n图 33-1\n\n### 33.3.2 内容 Fragment\n\n`FrameLayout` 容器只是一个占位符，将在运行时由应用启动时第一个屏幕的内容替换。这些内容通常以\
  \ `Fragment` 的形式存在，由一个 XML 布局资源文件和相应的类文件组成。事实上，在创建项目时，Android Studio 为了此创建了一个初始\
  \ fragment。该 fragment 的布局资源文件可以在 `app -> res -> layout -> main_fragment.xml` 找到，当加载到布局编辑器时，它将如图\
  \ 33-2 所示：\n\n![](img/as_3.5_viewmodel_main_fragment.jpg)\n\n图 33-2\n\n默认情况下，该 fragment\
  \ 仅包含一个显示“MainFragment”文本的 `TextView`，但除此之外已准备好被修改以包含应用第一个屏幕的布局。此时值得花些时间查看 Android\
  \ Studio 已经生成的代码，用于在 activity 容器区域内显示此 fragment。\n\n将 `FrameLayout` 占位符替换为 fragment\
  \ 的过程从 `MainActivity` 类文件（`app -> java -> <package name> -> MainActivity`）开始。关键代码行出现在该类的\
  \ `onCreate()` 方法中，并将容器的 id（已分配给 `FrameLayout` 占位符视图）替换为 `MainFragment` 类：\n\n```java\n\
  @Override\nprotected void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    setContentView(R.layout.main_activity);\n    if (savedInstanceState == null)\
  \ {\n        getSupportFragmentManager().beginTransaction()\n            .replace(R.id.container,\
  \ MainFragment.newInstance())\n            .commit();\n    }\n}\n```\n\n随 fragment\
  \ 的代码可以在 `MainFragment.java` 文件中找到（`app -> <package name> -> ui.main -> MainFragment`）。该类文件中包含\
  \ `onCreateView()` 方法，该方法在 fragment 创建时被调用。它加载 `main_fragment` 布局文件，使其在主 activity\
  \ 的容器区域内显示：\n\n```java\n@Override\npublic View onCreateView(@NonNull LayoutInflater\
  \ inflater, @Nullable ViewGroup container, @Nullable Bundle savedInstanceState)\
  \ {\n    return inflater.inflate(R.layout.main_fragment, container, false);\n}\n\
  ```\n\n### 33.3.3 ViewModel\n\n应用的 `ViewModel` 包含在 `MainViewModel.java` 类文件中，位于\
  \ `app -> java -> ui.main -> MainViewModel`。它被声明为 `ViewModel` 组件类的子类，并准备好修改以存储应用的数据模型：\n\
  \n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\nimport androidx.lifecycle.ViewModel;\n\
  \npublic class MainViewModel extends ViewModel {\n    // TODO: Implement the ViewModel\n\
  }\n```\n\n## 33.4 设计 Fragment 布局\n\n下一步是设计 fragment 的布局。在项目窗口中找到 `main_fragment.xml`\
  \ 文件并双击将其加载到布局编辑器。加载完成后，选择现有的 `TextView` 小部件并使用属性窗口将 `id` 属性更改为 `resultText`。从调色板拖入\
  \ `Number (Decimal)` 视图并位于现有 `TextView` 上方。在布局中选中视图后，引用属性窗口并将 id 更改为 `dollarText`。\n\
  \n将 `Button` 小部件拖到布局中，使其位于 `TextView` 下方，并将文本属性更改为“Convert”。在按钮仍被选中时，将 id 属性更改为\
  \ `convertButton`。此时，布局应如图 33-3 所示（注意这三个视图使用了垂直链进行约束）：\n\n![](img/as_4.2_viewmodeldemo_ui.jpg)\n\
  \n图 33-3\n\n\n\n\n最后，点击布局编辑器右上角的警告图标，并将硬编码字符串转换为资源。\n\n## 33.5 实现 ViewModel\n\n\
  在用户界面布局完成后，需要在 `view model` 中为应用程序创建数据模型。在 `Project`（项目）工具窗口中，找到 `MainViewModel.java`\
  \ 文件，双击它将其加载到代码编辑器中，并修改类使其内容如下：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\
  \nimport androidx.lifecycle.ViewModel;\n\npublic class MainViewModel extends ViewModel\
  \ {\n    private static final Float rate = 0.74F;\n    private String dollarText\
  \ = \"\";\n    private Float result = 0F;\n\n    public void setAmount(String value)\
  \ {\n        this.dollarText = value;\n        result = Float.parseFloat(dollarText)*rate;\n\
  \    }\n\n    public Float getResult()\n    {\n        return result;\n    }\n}\n\
  ```\n\n该类声明了变量来存储当前的美元字符串值以及转换后的金额，并提供了 getter 和 setter 方法来访问这些数据值。当调用 `setAmount()`\
  \ 方法时，它接收当前的美元金额作为参数，并将其存储在本地变量 `dollarText` 中。美元字符串值被转换为浮点数，乘以一个虚拟的汇率，并将生成的欧元值存储在\
  \ `result` 变量中。另一方面，`getResult()` 方法简单地返回赋值给 `result` 变量当前值。\n\n## 33.6 将 Fragment\
  \ 与 ViewModel 关联\n\n显然，需要某种方式让 `fragment` 获取 `ViewModel` 的引用，以便能够访问模型并观察数据变化。`Fragment`\
  \ 或 `Activity` 使用 `ViewModelProvider` 类的实例来维护其所依赖的用于数据的 `ViewModels` 引用。\n\n在 `Fragment`\
  \ 内部使用 `ViewModelProvider` 类创建 `ViewModelProvider` 实例。当调用该类时，类初始化器会接收当前 `Fragment`\
  \ 或 `Activity` 的引用，并返回如下所示的 `ViewModelProvider` 实例：\n\n```java\nViewModelProvider\
  \ viewModelProvider = new ViewModelProvider(this);\n```\n\n一旦创建了 `ViewModelProvider`\
  \ 实例，就可以在该实例上调用 `get()` 方法，并传递所需的特定 `ViewModel` 类。提供者将创建该 `ViewModel` 类的一个新实例，或者返回一个现有实例：\n\
  \n```java\nViewModel viewModel = viewModelProvider.get(MainViewModel.class);\n```\n\
  \n编辑 `MainFragment.java` 文件并验证 Android Studio 是否已经在 `onActivityCreated()` 方法中包含了此步骤（尽管为了简洁，操作在单行代码中完成）：\n\
  \n```java\nviewModel = new ViewModelProvider(this).get(MainViewModel.class);\n```\n\
  \n在访问模型视图后，现在可以向 `Fragment` 中添加代码以开始处理数据模型。\n\n## 33.7 修改 Fragment\n\n现在需要更新 fragment\
  \ 类以响应按钮点击，并与存储在 `ViewModel` 中的数据值进行交互。该类还需要用户界面布局中三个视图的引用，以便响应按钮点击、提取当前美元值并显示转换后的货币金额。\n\
  \n在标题为 \"在 Android Studio 中创建一个 Android 示例”的章节中，`Button` 控件的 `onClick` 属性被用于指定用户点击按钮时调用的方法。遗憾的是，此属性只能调用\
  \ `Activity` 上的方法，而不能用于调用 `Fragment` 中的方法。为了解决这一局限性，我们需要在 `Fragment` 类中添加一些代码，在按钮上设置\
  \ `onClick` 监听器。实现此操作的代码可以按文所示添加到 `MainFragment.java` 文件的 `onActivityCreated()`\
  \ 方法中。在进行这些更改的同时，还将转换 fragment 以使用视图绑定（view binding）：\n\n```java\nimport com.ebookfrenzy.viewmodeldemo.databinding.MainFragmentBinding;\n\
  \npublic class MainFragment extends Fragment {\n    private MainViewModel mViewModel;\n\
  \    private MainFragmentBinding binding;\n\n    public static MainFragment newInstance()\
  \ {\n        return new MainFragment();\n    }\n\n    @Nullable\n    @Override\n\
  \    public View onCreateView(@NonNull LayoutInflater inflater, @Nullable ViewGroup\
  \ container, @Nullable Bundle savedInstanceState) {\n        return inflater.inflate(R.layout.main_fragment,\
  \ container, false);\n        binding = MainFragmentBinding.inflate(inflater, container,\
  \ false);\n        return binding.getRoot();\n    }\n\n    @Override\n    public\
  \ void onDestroyView() {\n        super.onDestroyView();\n        binding = null;\n\
  \    }\n\n    @Override\n    public void onActivityCreated(@Nullable Bundle savedInstanceState)\
  \ {\n        super.onActivityCreated(savedInstanceState);\n        mViewModel =\
  \ new ViewModelProvider(this).get(MainViewModel.class);\n        binding.convertButton.setOnClickListener(new\
  \ View.OnClickListener() {\n            @Override\n            public void onClick(View\
  \ v) {\n            }\n        });\n    }\n}\n```\n\n添加监听器后，放置在 `onClick()` 方法中的任何代码将在用户点击按钮时被调用。\n\
  \n## 33.8 访问 ViewModel 数据\n\n当点击按钮时，`onClick()` 方法需要从 `EditText` 中读取当前值，确认该字段为空，然后调用\
  \ `ViewModel` 实例的 `setAmount()` 方法。随后该方法需要调用 `ViewModel` 的 `getResult()` 方法并将转换后的值显示在\
  \ `TextView` 控件上。\n\n由于项目中尚未使用 `LiveData`，因此在每次创建 `Fragment` 时，都有必要从 `ViewModel`\
  \ 获取最新结果。在 `MainFragment.java` 文件中，按如下所示在 `onActivityCreated()` 方法中实现这些要求：\n\n```java\n\
  import java.util.Locale;\n\n@Override\npublic void onActivityCreated(@Nullable Bundle\
  \ savedInstanceState) {\n    super.onActivityCreated(savedInstanceState);\n    mViewModel\
  \ = new ViewModelProvider(this).get(MainViewModel.class);\n    binding.resultText.setText(String.format(Locale.ENGLISH,\"\
  %.2f\", mViewModel.getResult()));\n    binding.convertButton.setOnClickListener(new\
  \ View.OnClickListener() {\n        @Override\n        public void onClick(View\
  \ v) {\n            if (!binding.dollarText.getText().toString().equals(\"\")) {\n\
  \                mViewModel.setAmount(String.format(Locale.ENGLISH,\"%s\", binding.dollarText.getText()));\n\
  \                binding.resultText.setText(String.format(Locale.ENGLISH,\"%f\"\
  , mViewModel.getResult()));\n            } else {\n                binding.resultText.setText(\"\
  No Value\");\n            }\n        }\n    });\n}\n```\n\n## 33.9 测试项目\n\n完成项目的开发阶段后，在模拟器或物理设备上构建并运行应用程序，输入美元值并点击\
  \ Convert 按钮。转换后的金额应显示在 `TextView` 上，这表明 UI 控制器和 `ViewModel` 的重构似乎运行按预期工作。\n\n\n\
  \n虽然这相对于原始的 `AndroidSample` 应用有所改进，但仍然可以通过利用 `LiveData` 和 `data binding`（数据绑定）进一步简化项目，这两者都是后续章节的主题。\n\
  \n## 33.10 总结\n\n在本章中，我们重新回顾了书中早些创建的 `AndroidSample` 项目，并创建了一个符合 Android Jetpack\
  \ 架构指南的新版本项目。本章概述了 `Fragment` + `ViewModel` 项目模板的结构，并解释了基于单个 `Activity` 构建应用的概念，即使用\
  \ `Fragments` 在单个 `Activity` 布局中展示不同的屏幕。示例项目还演示了使用 `ViewModels` 将数据处理与用户界面相关的代码分离来。最后，本章展示了\
  \ `ViewModel` 方法如何避免处理 `Fragment` 和 `Activity` 生命周期时遇到的某些问题。\n\n# 34. Android Jetpack\
  \ LiveData 教程\n\n上一章开始了设计符合推荐的 Jetpack 架构指南的应用流程。这些初始步骤包括选择 `Fragment`+`ViewModel`\
  \ 项目模板，以及在 `ViewModel` 实例中为应用用户界面实现数据模型。\n\n本章将通过使用 `LiveData` 架构组件来进一步增强应用设计。一旦在本章中为项目添加了\
  \ `LiveData` 支持，后续章节将使用 Jetpack Data Binding 库从项目中消除更多代码。\n\n## 34.1 LiveData -\
  \ 回顾\n\n`LiveData` 在之前名为“使用 Jetpack 构建现代 Android 应用架构”的章节中介绍过。正如之前描述，`LiveData`\
  \ 组件可以作为 ViewModel 中数据值的包装器。一旦包含在 `LiveData` 实例中，这些变量对应用内的其他对象（通常是 UI 控制器，如 `Activities`\
  \ 和 `Fragments`）可见。这允许 UI 控制器在底层 `LiveData` 值变化时接收到通知。通过创建 `Observer` 类的实例并定义 `onChange()`\
  \ 方法来设置观察者，该方法会在值变化时调用。一旦创建了 `Observer` 实例，就可以通过调用 `LiveData` 对象的 `observe()` 方法将其附加到\
  \ `LiveData` 对象。\n\n可以使用 `MutableLiveData` 类将 `LiveData` 实例声明为可变的，允许 `ViewModel`\
  \ 和 UI 控制器都对底层数据值进行更改。\n\n## 34.2 为 ViewModel 添加 LiveData\n\n启动 Android Studio，打开上一章创建的\
  \ `ViewModelDemo` 项目，并打开 `MainViewModel.java` 文件，其目前的内容应如下：\n\n```java\npackage\
  \ com.ebookfrenzy.viewmodeldemo.ui.main;\n\nimport androidx.lifecycle.ViewModel;\n\
  \npublic class MainViewModel extends ViewModel {\n\n    private static final Float\
  \ rate = 0.74F;\n\n    private String dollarText = \"\";\n\n    private Float result\
  \ = 0F;\n\n    public void setAmount(String value) {\n        this.dollarText =\
  \ value;\n        result = Float.parseFloat(dollarText)*rate;\n    }\n\n    public\
  \ Float getResult()\n    {\n        return result;\n    }\n}\n```\n\n本章此阶段的目标是将\
  \ `result` 变量封装在 `MutableLiveData` 实例中（该对象需要是可变的，以便在用户每次请求货币转换时都能更改值）。从修改类开始，使其内容如下所示，注意在使用\
  \ `LiveData` 时需要导入额外的包：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\
  \nimport androidx.lifecycle.MutableLiveData;\nimport androidx.lifecycle.ViewModel;\n\
  \npublic class MainViewModel extends ViewModel {\n\n    private static final Float\
  \ rate = 0.74F;\n\n    private String dollarText = \"\";\n\n    private Float result\
  \ = 0F;\n\n    private MutableLiveData<Float> result = new MutableLiveData<>();\n\
  \n    public void setAmount(String value) {\n        this.dollarText = value;\n\
  \        result = Float.valueOf(dollarText)*rate;\n    }\n\n    public Float getResult()\n\
  \    {\n        return result;\n    }\n}\n```\n\n现在 `result` 变量已包含在可变的 `LiveData`\
  \ 实例中，`setAmount()` 和 `getResult()` 方法都需要修改。在 `setAmount()` 方法中，不能再使用赋值运算符 (`=`)\
  \ 为 `result` 变量赋值了。相反，必须调用 `LiveData` 的 `setValue()` 方法，并将新值作为参数传递。按照目前的实现，`getResult()`\
  \ 方法声明为返回 `Float` 值，现在需要更改为返回 `MutableLiveData` 对象。完成这些剩余更改后将得到类文件：\n\n```java\n\
  package com.ebookfrenzy.viewmodeldemo.ui.main;\n\nimport androidx.lifecycle.MutableLiveData;\n\
  import androidx.lifecycle.ViewModel;\n\npublic class MainViewModel extends ViewModel\
  \ {\n    private static final Float rate = 0.74F;\n\n    private String dollarText\
  \ = \"\";\n\n    private MutableLiveData<Float> result = new MutableLiveData<>();\n\
  \n    public void setAmount(String value) {\n        this.dollarText = value;\n\
  \        result = Float.valueOf(dollarText)*rate;\n        result.setValue(Float.parseFloat(dollarText));\n\
  \    }\n\n    public MutableLiveData<Float> getResult()\n    {\n        return result;\n\
  \    }\n}\n```\n\n## 34.3 实现观察者\n\n现在结果已包含在 `LiveData` 实例中，下一步是在 UI 控制器中配置观察者，在本例中，它是\
  \ `Fragment` 类。找到 `MainFragment.java` 类（app -> package -> MainFragment），双击它将其加载到编辑器，并修改\
  \ `onCreated()` 方法创建一个名为 `resultObserver` 的新 `Observer`：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\
  \nimport androidx.lifecycle.Observer;\n\n@Override\npublic void onCreated(@Nullable\
  \ Bundle savedInstanceState) {\n    binding.resultText.setText(String.format(Locale.ENGLISH,\
  \ \"%.2f\", mViewModel.getResult()));\nfinal Observer<Float> resultObserver = new\
  \ Observer<Float>() {\n    @Override\n    public void onChanged(@Nullable Float\
  \ result) {\n        binding.resultText.setText(String.format(Locale.ENGLISH, \"\
  %.2f\", result));\n    }\n};\n```\n\n`resultObserver` 实例声明了 `onChange()` 方法，当它被调用时，会被传入当前结果值并显示在结果\
  \ TextView 对象上。下一步是将观察者添加到结果 `LiveData` 对象，可以通过调用 `ViewModel` 对象的 `getResult()`\
  \ 方法获取该引用。由于更新结果 `TextView` 现在是 `onChange()` 回调方法的职责，可以删除执行此任务的现有代码行：\n\n```java\n\
  @Override\npublic void onCreated(@Nullable Bundle savedInstanceState) {\n    super.onCreated(savedInstanceState);\n\
  \    mViewModel = new ViewModelProvider(this).get(MainViewModel.class);\n    binding.resultText.setText(String.format(Locale.ENGLISH,\
  \ \"%.2f\", mViewModel.getResult()));\n    final Observer<Float> resultObserver\
  \ = new Observer<Float>() {\n        @Override\n        public void onChanged(@Nullable\
  \ Float result) {\n            binding.resultText.setText(String.format(Locale.ENGLISH,\
  \ \"%.2f\", result));\n        }\n    };\n\n    mViewModel.getResult().observe(getViewLifecycleOwner(),\
  \ resultObserver);\n    binding.convertButton.setOnClickListener(new View.OnClickListener()\
  \ {\n        @Override\n        public void onClick(View v) {\n            if (!binding.dollarText.getText().toString().equals(\"\
  \")) {\n```\n\n\n\n\n```java\nmViewModel.setAmount(String.format(Locale.ENGLISH,\"\
  %s\",\n        binding.dollarText.getText()));\nbinding.resultText.setText(String.format(Locale.ENGLISH,\n\
  \        \"%.2f\", mViewModel.getResult()));\n} else {\n    binding.resultText.setText(\"\
  No Value\");\n}\n});```\n\n编译并运行应用程序，在美元字段中输入一个值，点击“转换”（Convert）按钮，验证转换后的欧元金额是否显示在\
  \ `TextView` 上。这确认了观察者收到了结果值已更改的通知，并调用了 `onChanged()` 方法来显示最新数据。\n\n注意上述 `onActivityCreated()`\
  \ 方法的实现，负责在每次调用该方法时显示当前结果值的代码行被删除了。最初这样做是为了确保在 `Fragment` 因任何原因被重建时，显示的值不会丢失。由于\
  \ `LiveData` 会监控其观察者的生命周期，这一步不再是必要的。当 `LiveData` 检测到 UI 控制器被重建时，它会自动触发任何相关的观察者并提供最新数据。通过在\
  \ `TextView` 对象显示欧元值时旋转设备来验证这一点，并确认该值没有丢失。\n\n在继续后续章节之前，请先关闭项目，复制 `ViewModelDemo`\
  \ 项目文件夹并将其保存为 `ViewModelDemo_LiveData`，以便稍后查看保存 ViewModel 状态时使用。\n\n## 34.4 总结\n\
  \n本章演示了如何使用 Android `LiveData` 组件来确保显示给用户的数据始终与存储在 `ViewModel` 中的数据匹配。这个相对简单的过程包括：将\
  \ `ViewModel` 数据值封装在 `LiveData` 对象中，并在 UI 控制器中设置一个订阅该 `LiveData` 值的观察者。每当 `LiveData`\
  \ 值发生变化时，观察者就会收到通知，并调用 `onChanged()` 方法，传递更新后的值。\n\n为项目中添加 `LiveData` 支持已在很大程度上简化了项目设计。通过使用数据绑定库（Data\
  \ Binding Library），还可以实现额外且重大的改进，其细节将在稍后的章节中介绍。然而，在此之前，我们将查看如何保存 ViewModel 状态。\n\
  \n# 35. Android Jetpack Data Binding 概述\n\n在标题为 “Modern Android App Architecture\
  \ with Jetpack” 的章节中，我们介绍了 Android 数据绑定（Data Binding）的概念，并简要解释了如何将其直接将用户界面布局中的视图连接到应用中其他对象的方法和数据，而无需编写代码。本章将提供更多关于数据绑定的细节，重点解释如何在\
  \ Android Studio 项目中实现数据绑定。下一章的教程（“An Android Jetpack Data Binding Tutorial”）将提供一个数据绑定的实际操作示例。\n\
  \n## 35.1 数据绑定概述\n\n数据绑定支持由 Android Jetpack Data Binding 库提供，其主要目的是提供一种简单的方法，将用户界面布局中的视图与存储在应用代码中的数据（通常在\
  \ `ViewModel` 实例中）连接起来。数据绑定还提供了一种方便的方法，将用户界面控件（如 `Button` 控件）映射到其他对象（如 UI 控制器和 `ViewModel`\
  \ 实例）中的事件和监听方法。\n\n当数据绑定与 `LiveData` 组件结合使用时，会变得异常强大。例如，考虑将一个 `EditText` 视图绑定到 `ViewModel`\
  \ 中的 `LiveData` 变量。通过这种方式连接后，`ViewModel` 中数据值的任何更改将自动显示在 `EditText` 视图中；当使用双向绑定时，输入\
  \ `EditText` 的任何数据都将自动用于更新 `LiveData` 值。最令人印象深刻的是，这一切除了初始设置绑定所需的代码之外，不需要任何额外的代码实现。\n\
  \n传统上，将交互式视图（如 `Button` 控件）连接到 UI 控制器中的方法，需要开发者编写代码来实现一个监听方法，以便在点击按钮时调用。数据绑定使得这一切变得非常简单，只需在布局\
  \ XML 文件的 `Button` 元素中引用要调用的方法即可。\n\n## 35.2 数据绑定的关键组件\n\n默认情况下，Android Studio 项目未配置数据绑定支持。事实上，在应用开始使用数据绑定之前，需要组合多个不同的元素。这些涉及项目构建配置、布局文件、数据绑定类以及数据表达式的使用。虽然这初看起来看起来可能很复杂，但如果分开来看，它们实际上非常简单，一旦完成，在节省精力方面就更有价值了。在本章的剩余部分中，将详细介绍这些每一个元素。\n\
  \n### 35.2.1 项目构建配置\n\n在项目可以使用数据绑定之前，必须首先将其配置为使用数据绑定库和语法。幸运的是，这只需在模块级 `build.gradle`\
  \ 文件（Project 窗口列出的出的）中添加几行即可。以下是部分构建文件：\n\n```gradle\nandroid {\n    buildFeatures\
  \ {\n        dataBinding = true\n    }\n}\n```\n\n### 35.2.2 数据绑定布局\n\n正如我们在之前的章节中所看到的，应用的用户界面通常包含在布局文件中。在这些文件中的视图能够利用数据绑定之前，布局文件必须先转换为数据绑定文件。\n\
  \n正如书前面提到的，XML 布局文件定义了布局中组件的层次结构，从顶层或根视图开始。根视图总是采用布局容器的形式，例如 `ConstraintLayout`、`FrameLayout`\
  \ 或 `LinearLayout` 实例，就像 `ViewModelDemo` 项目中 `main_fragment.xml` 文件中的所示：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:id=\"@+id/main\"\n    android:layout_width=\"match_parent\"\n    android:layout_height=\"\
  match_parent\"\n    tools:context=\".ui.main.MainFragment\">\n\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n为了能够使用数据绑定，布局层次结构必须有一个布局组件作为根视图，该组件反过来成为当前根视图的父节点。在上述示例中，这将需要对现有的布局文件进行以下更改：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<layout xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  >\n\n    <androidx.constraintlayout.widget.ConstraintLayout\n        android:id=\"\
  @+id/main\"\n        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  match_parent\">\n\n    </androidx.constraintlayout.widget.ConstraintLayout>\n</layout>\n\
  ```\n\n\n\n\n\n```xml\n<android:layout_width=\"match_parent\"\n    android:layout_height=\"\
  match_parent\"\n    tools:context=\".ui.main.MainFragment\">\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  </layout>\n```\n\n### 35.2.3 布局文件数据元素\n\n数据绑定布局文件需要某种方式来声明项目中的类，布局中的视图将绑定到这些类上（例如\
  \ `ViewModel` 或 UI 控制器）。在声明这些类后，布局文件还需要一个变量名称，以便在绑定表达式中引用这些实例。\n\n这是通过使用 `data`\
  \ 元素实现的，例如所示：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<layout xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <data>\n\
  \        <variable\n            name=\"myViewModel\"\n            type=\"com.ebookfrenzy.myapp.ui.main.MainViewModel\"\
  \ />\n    </data>\n    <androidx.constraintlayout.widget.ConstraintLayout\n    \
  \    android:id=\"@+id/main\"\n        android:layout_width=\"match_parent\"\n \
  \       android:layout_height=\"match_parent\"\n        tools:context=\".ui.main.MainFragment\"\
  >\n</layout>\n```\n\n上面的 `data` 元素声明了一个名为 `myViewModel` 的新变量，类型为 `MainViewModel`（注意，在声明变量时，必须声明\
  \ `MyViewModel` 类的完整包名）。\n\n`data` 元素还可以导入其他类，这些类随后可以在布局文件的其他地方绑定表达式中引用。例如，如果你有一个类，其中包含一个在值显示给用户之前需要对该值调用的方法，则可以如下所示导入该类：\n\
  \n```xml\n<data>\n    <import type=\"com.ebookfrenzy.MyFormattingTools\" />\n  \
  \  <variable\n        name=\"viewModel\"\n        type=\"com.ebookfrenzy.myapp.ui.main.MainViewModel\"\
  \ />\n</data>\n```\n\n### 35.2.4 绑定类\n\n对于绑定布局文件 `data` 元素中引用的每个类，Android Studio\
  \ 会自动生成一个对应的绑定类。它是 `AndroidDataBinding` 类的子类，并将根据布局文件名、使用单词首字母大写并添加 `Binding` 后缀进行命名。因此，名为\
  \ `main_fragment.xml` 的布局文件的绑定类将命名为 `MainFragmentBinding`。绑定类包含布局文件中指定的绑定，并将它们映射到已绑定对象中的变量和方法。\n\
  \n尽管绑定类是自动生成的，但仍然需要编写代码来根据对应的数据绑定布局文件创建该类的实例。幸运的是，这可以通过使用 `DataBindingUtil` 类来实现。\n\
  \n`Activity` 或 `Fragment` 的初始化代码通常会设置内容视图或“膨胀（inflate）”用户界面面的布局文件。这仅意味着代码打开了布局文件、解析\
  \ XML 并在内存中创建并配置所有的视图对象。在现有的 `Activity` 类中，实现此点的代码可以在 `onCreate()` 方法中找到，其读取如下：\n\
  \n```java\nsetContentView(R.layout.activity_main);\n```\n\n在 `Fragment` 的情况下，这发生在\
  \ ` onCreateView()` 方法中：\n\n```java\nreturn inflater.inflate(R.layout.main_fragment,\
  \ container, false);\n```\n\n在 `Activity` 类中创建绑定类实例只需按照如下所示修改此初始化代码：\n\n```java\n\
  ActivityMainBinding binding;\nbinding = DataBindingUtil.setContentView(this, R.layout.activity_main,\
  \ false);\n```\n\n在 `Fragment` 的情况下，代码如下：\n\n```java\nMainFragmentBinding binding;\n\
  binding = DataBindingUtil.inflate(inflater, R.layout.main_fragment, container, false);\n\
  binding.setLifecycleOwner(this);\nView view = binding.getRoot();\nreturn view;\n\
  ```\n\n### 35.2.5 数据绑定变量配置\n\n如上所述，数据绑定布局文件包含 `data` 元素，该元素又包含 `variable` 元素，这些元素由变量名和要建立绑定的类类型组成。例如：\n\
  \n```xml\n<data>\n    <variable\n        name=\"viewModel\"\n        type=\"com.ebookfrenzy.myapp.ui.main.MainViewModel\"\
  \ />\n    <variable\n        name=\"uiController\"\n        type=\"com.ebookfrenzy.viewdemo.ui.main.MainFragment\"\
  \ />\n</data>\n```\n\n在上面的示例中，第一个变量知道它将绑定到 `MainViewModel` 的实例，但尚未建立连接。这需要额外的步骤：\n\
  \n```java\nMainViewModel mViewModel = ViewModelProvider(this).get(ViewModel.class);\n\
  binding.setVariable(viewModel, mViewModel);\n```\n\n上述元素中的第二个变量引用了 `Fragment` 的\
  \ UI 控制器类。在这种情况下，`Activity` 内部的代码仅需将自己赋值给：\n\n```java\nbinding.setVariable(uiController,\
  \ this);\n```\n\n### 35.2.6 绑定表达式（单向）\n\n绑定表达式定义了特定视图如何与绑定对象进行交互。例如，`Button` 上的绑定表达式可能会声明在响应点击时调用对象上的哪个方法。或者，绑定表达式可能会定义存储在\
  \ `ViewModel` 中的哪个数据值显示在 `TextView` 中以及如何格式化。\n\n绑定表达式使用声明式语言，允许逻辑和对类的访问。例如，表达式可以包括数学表达式、方法调用、字符串拼接、数组访问和比较操作。此外，所有的标准\
  \ Java 类都是默认导入的，因此许多在 Java 中实现的功能也可以在绑定表达式中完成。如前所述，也可以使用 `data` 元素导入自定义类以增加表达式的能力。\n\
  \n绑定表达式以 `@` 符号开头，后跟大括号 `{}` 中的表达式。\n\n例如，考虑一个包含名为 `result` 的 `ViewModel` 实例。假设该类已在数据布局文件中分配给变量\
  \ `viewModel`，并需要绑定到 `TextView` 对象，以便视图始终显示最新结果。如果此值被存储为 `String` 对象，则在布局文件中声明如下：\n\
  \n```xml\n<TextView\n    android:id=\"@+id/resultText\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:text=\"\
  @viewModel.result\"\n    app:layout_constraintBottom_toBottomOf=\"parent\"\n   \
  \ app:layout_constraintEnd_toEndOf=\"parent\"\n    app:layout_constraintStart_toStartOf=\"\
  parent\"\n    app:layout_constraintTop_toTopOf=\"parent\" />\n```\n\n在上面的 XML 中，`text`\
  \ 属性被设置为 `viewModel` 对象中 `result` LiveData 属性的值。\n\n然而，假设 `result` 在模型中存储为 `Float`\
  \ 值而不是 `String`。如果是这样，上面的表达式将导致编译错误。显然，在 `TextView` 显示该值之前，需要将 `Float` 值转换为字符串。为了解决此类问题，绑定表达式可以使用标准\
  \ Java 语言类包含完成转换所需的步骤：\n\n```xml\nandroid:text=\"@String.valueOf(viewModel.result)}\"\
  \n```\n\n在进行此更改后运行应用程序时，必须注意 Android Studio 控制台中可能会出现以下警告：\n\n\n\n\n\nwarning：`myViewModel.result.getValue()`\
  \ 是一个包装字段（boxed field），需要解箱才能执行 `String.valueOf(viewModel.result.getValue())`。\n\
  \nJava 中的值可以以原始值的形式存在，例如 `boolean` 类型（称为未解箱），或者包装在 Java 对象中，例如 `Boolean` 类型，并通过该对象的引用进行访问（即已箱/boxed）。解箱的过程涉及从对象中拆出原始值。\n\
  \n为了避免出现此消息，请按照如下所示，将违规的操作封装在 `safeUnbox()` 调用中：\n\n```xml\nandroid:text=\"@{String.valueOf(safeUnbox(myViewModel.result))}\"\
  \n```\n\n也可以使用字符串拼接。例如，为了在结果字符串值后包含“dollars”一词，将使用以下表达式：\n\n```xml\nandroid:text='@{String.valueOf(safeUnbox(myViewModel.result))\
  \ + \" dollars\"}'\n```\n\n请注意，由于附加的的结果字符串被封装在双引号中，现在表达式被封装在单引号中，以避免语法错误。\n\n表达式语法还允许声明三元语句。在下面的表达式中，视图将根据结果值是否大于\
  \ 10 显示不同的文本。\n\n```xml\n@{myViewModel.result > 10 ? \"Out of range\" : \"In range\"\
  }\n```\n\n还可以构造表达式来访问数据数组中的特定元素：\n\n```xml\n@{myViewModel.resultsArray[3]}\n```\n\
  \n### 35.2.7 绑定表达式（双向）\n\n到目前为止涵盖的表达式类型被称为单向绑定。换句话说，随着对应值的变化，布局会不断更新，但从布局内部对值的更改不会更新存储的值。\n\
  \n另一方面，双向绑定允许数据模型响应布局的变化而进行更新。例如，一个 `EditText` 视图可以配置为双向绑定，这样当用户输入不同的值时，该值将用于更新对应的数据模型值。在声明双向表达式时，语法与单向表达式相似，区别在于它以\
  \ `@=` 开头。例如：\n\n```xml\nandroid:text=\"@={myViewModel.result}\"\n```\n\n### 35.2.8\
  \ 事件和监听器绑定\n\n绑定表达式还可以用于响应视图上的事件触发方法调用。例如，`Button` 视图可以配置为点击时调用一个方法。在标题为“在 Android\
  \ Studio 中创建一个 Android 示例”（#Sample_App.xhtml__idTextAnchor034）的章节中，按钮的 `onClick`\
  \ 属性被配置为调用应用主 Activity 中名为 `convertCurrency()` 的方法。在 XML 文件中，表示如下：\n\n```xml\nandroid:onClick=\"\
  convertCurrency\"\n```\n\n`convertCurrency()` 方法在以下行中声明：\n\n```java\npublic void\
  \ convertCurrency(View view) {\n.\n    .\n}\n```\n\n请注意，这种类型的方法调用始终会传递事件发生视图的引用。在数据绑定中，可以使用以下表达式相同的效果（假设布局已绑定到一个变量名为\
  \ `uiController` 的类）：\n\n```xml\nandroid:onClick=\"@{uiController::convertCurrency}\"\
  \n```\n\n另一个选项，也是一种提供向方法传递参数的选项，被称为监听器绑定。下面的表达式使用这种方法在同一个 `viewModel` 实例上调用一个无参数的方法：\n\
  \n```xml\nandroid:onClick='@{() -> myViewModel.methodOne()}'\n```\n\n接下来的表达式调用了一个需要三个参数的方法：\n\
  \n```xml\nandroid:onClick='@{() -> myViewModel.methodTwo(viewModel.result, 10, \"\
  A String\")}'\n```\n\n绑定表达式提供了一种丰富且灵活的语言，可以将用户界面视图绑定到其他对象的数据和方法，本章仅涵盖了最常见的用例。要了解更多关于绑定表达式的信息，请查看在线\
  \ Android 文档：\n\nhttps://developer.android.com/topic/libraries/data-binding/expressions\n\
  \n## 35.3 总结\n\nAndroid 数据绑定提供了一个系统，用于用户界面布局中的视图与应用架构中其他对象的数据和方法之间创建连接，无需编写代码。一旦完成了一些初始配置，数据绑定只需在布局文件的视图元素中使用绑定表达式。这些绑定表达式可以是单向的，也可以是双向的，还可以用于绑定响应用户界面内按钮点击等事件而调的方法。\n\
  \n### 36. Android Jetpack 数据绑定教程\n\n到目前为止，在书中我们涵盖了现代 Android 应用架构的基本概念，并更详细地查看了\
  \ `ViewModel` 和 `LiveData` 组件。数据绑定的概念在上一章中也涵盖了，现在将在本章中使用它进一步修改 `ViewModelDemo` 应用。\n\
  \n### 36.1 移除冗余代码\n\n如果你还没有这样做，请复制 `ViewModelDemo` 项目文件夹并将其保存为 `ViewModelDemo_LiveData`，以便在下一章节中再次使用。复制完成后，打开原始的\
  \ `ViewModelDemo` 项目，准备实现数据绑定。\n\n在 `ViewModelDemo` 应用中实现数据绑定之前，将通过删除项目中在本章结束时不再需要的所有代码来演示绑定的威力。\n\
  \n启动 Android Studio，打开 `ViewModelDemo` 项目，编辑 `MainFragment.java` 文件并按如下所示修改代码：\n\
  \n```java\npackage com.ebookfrenzy.viewmodel;\n\n.\nimport android.arch.lifecycle.Observer;\n\
  \n.\npublic class MainFragment extends Fragment {\n    \n    @Override\n    public\
  \ void onActivityCreated(@Nullable Bundle savedInstanceState) {\n        super.onActivityCreated(savedInstanceState);\n\
  \        mViewModel = new ViewModelProvider(this).get(MainViewModel.class);\n  \
  \      final Observer<Float> resultObserver = new Observer<Float>() {\n        \
  \    @Override\n            public void onChanged(@Nullable result) {\n        \
  \        binding.resultText.setText(String.format(Locale.ENGLISH,%.2f\", result));\n\
  \            }\n        };\n        mViewModel.getResult().observe(getViewOwner(),\
  \ resultObserver);\n        binding.convertButton.setOnClickListener(new View.OnClickListener()\
  \ {\n            @Override\n            public void onClick(View v) {\n        \
  \        if (!binding.dollarText.toString().equals(\"\")) {\n                  \
  \  mViewModel.setAmount(String.format(Locale.ENGLISH,\"%s\", binding.dollarText.getText()));\n\
  \                } else {\n                    binding.resultText.setText(\"No Value\"\
  );\n                }\n            }\n        });\n    }\n}\n```\n\n接下来，编辑 `MainViewModel.java`\
  \ 文件并继续删除代码如下（注意将 `dollarText` 转换为 `LiveData`）：\n\n```java\npackage com.ebookfrenzy.viewdemo.ui.main;\n\
  \nimport android.arch.lifecycle.MutableLiveData;\nimport android.arch.lifecycle.ViewModel;\n\
  \npublic class MainViewModel extends ViewModel {\n    private static final Float\
  \ rate = 0.74F;\n    public MutableLiveData<String> dollarValue = new MutableLiveData<>();\n\
  \    private String dollarText = \"\";\n    private public MutableLiveData<Float>\
  \ result = new MutableLiveData<>();\n\n    public void setAmount(String value) {\n\
  \        this.dollarText = value;\n        result.setValue(Float.valueOf(dollarText)*rate);\n\
  \    }\n\n    public MutableLiveData<Float> getResult()\n    {\n        return result;\n\
  \    }\n}\n```\n\n虽然我们在实现数据绑的过程中会添加一些额外的代码，但显然数据绑定显著减少了需要编写的代码。\n\n### 36.2 启用数据绑定\n\
  \n使用数据绑定的第一步是在 Android Studio 项目中启用。这需要在 Gradle Scripts -> build.gradle (Module:\
  \ ViewModelDemo.app) 文件中添加一个新属性。\n\n\n\n\n\n在 `build.gradle` 文件中，添加所示元素以启用项目中的数据绑定：\n\
  \n```gradle\nplugins {\n    id 'com.android.application'\n}\n\nandroid {\n    buildFeatures\
  \ {\n        viewBinding true\n        dataBinding true\n    }\n}\n```\n\n一旦添加了该条目，编辑器顶部会出现一个黄色条，其中包含\
  \ `Sync Now`（立即同步）链接。点击此链接以根据新的构建配置设置重新同步项目。\n\n### 36.3 添加布局元素\n\n如“Android Jetpack\
  \ 数据绑定概览”中所描述，为了能够使用数据绑定，布局层次结构必须有一个布局组件作为根视图。这要求对 `main_fragment.xml` 布局文件（app\
  \ -> res -> layout -> `main_fragment.xml`）进行以下更改。在布局编辑器工具中打开此文件，切换到 `Code`模式并进行这些更改：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<layout xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  >\n    <androidx.constraintlayout.widget.ConstraintLayout\n        xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n        xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n        xmlns:tools=\"http://schemas.android.com/tools\"\n        android:id=\"\
  @+id/main\"\n        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  match_parent\"\n        tools:context=\".ui.main.MainFragment\">\n    </androidx.constraintlayout.widget.ConstraintLayout>\n\
  </layout>\n```\n\n完成这些更改后，切换回 `Design`模式，并注意新的根视图虽然在布局画布上不可见，但现在已列在组件树中，如图 36-1\
  \ 所示：\n\n![](img/as_3.5_databinding_layout.jpg)\n\n图 36-1\n\n构建并运行应用，以验证添加布局元素没有以任何方式改变用户界面外观。\n\
  \n### 36.4 在布局文件中添加数据元素\n\n将布局文件转换为数据绑定布局文件的下一步是添加 `<data>` 元素。对于此示例，布局将绑定到 `MainViewModel`，因此编辑\
  \ `main_fragment.xml` 文件并如下添加数据元素：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<layout xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\"\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  >\n    <data>\n        <variable\n            name=\"myViewModel\"\n           \
  \ type=\"com.ebookfrenzy.viewmodeldemo.ui.main.MainViewModel\" />\n    </data>\n\
  \    <androidx.constraintlayout.widget.ConstraintLayout\n        android:id=\"@+id/main\"\
  \n        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  match_parent\"\n        tools:context=\".ui.main.MainFragment\">\n</layout>\n```\n\
  \n再次构建并运行应用，以确保这些更改生效。\n\n### 36.5 使用绑定类\n\n下一步是修改 `MainFragment.java` 文件中的代码以膨胀数据绑定。最佳方法是重写\
  \ `onCreateView()` 方法：\n\n```java\nimport androidx.databinding.DataBindingUtil;\n\
  \npublic class MainFragment extends Fragment {\n    public View onCreateView(@NonNull\
  \ LayoutInflater inflater, @Nullable ViewGroup container, @Nullable Bundle savedInstanceState)\
  \ {\n        binding = MainFragmentBinding.inflate(inflater, container, false);\n\
  \        binding = DataBindingUtil.inflate(inflater, R.layout.main_fragment, container,\
  \ false);\n        binding.setLifecycleOwner(this);\n        return binding.getRoot();\n\
  \    }\n}\n```\n\n旧代码仅仅是膨胀了 `main_fragment.xml` 布局（换句话说创建了包含所有视图对象的布局）并返回了根（顶层布局）的引用。数据绑定库包含一个实用类，它提供了一个特殊的膨胀方法，该方法在构建\
  \ UI 的同时还会返回布局数据绑定类的实例。新代码调用此方法并将绑定类的引用存储在变量中：`binding = DataBindingUtil.inflate(inflater,\
  \ R.layout.main_fragment, container, false);`。\n\n绑定对象只需要 fragment 存在期间保留在内存中。为了确保实例在\
  \ fragment 消失时销毁，将当前 fragment 声明为绑定的生命周期所有者：\n`binding.setLifecycleOwner(this);`\n\
  `return binding.getRoot();`\n\n### 36.6 将 ViewModel 实例分配给绑定变量\n\n此时，数据绑定知道它将绑定到类型为\
  \ `MainViewModel` 的类实例，但尚未连接到实际 `MainViewModel` 对象。这需要额外的步骤，将应用内部使用的 `MainViewModel`\
  \ 实例分配给布局文件中声明的 `viewModel` 变量。由于 `ViewModel` 的引用是在 `onActivityCreated()` 方法中获取的，因此在这里进行赋值是合理的：\n\
  \n```java\nimport static com.ebookfrenzy.viewmodeldemo.BR.myViewModel;\n\n@Override\n\
  public void onActivityCreated(@Nullable Bundle savedInstanceState) {\n    super.onActivityCreated(savedInstanceState);\n\
  \    mViewModel = new ViewModelProvider(this).get(MainViewModel.class);\n    binding.setVariable(myViewModel,\
  \ mViewModel);\n}\n```\n\n如果 Android Studio 报告 `myViewModel` 未定义，请使用 `Build -> Make\
  \ Project` 选项重新构建项目。完成这些更改后，下一步是在数据绑定文件的视图元素中插入绑定表达式。\n\n### 36.7 添加绑定表达式\n\n第一个绑定表达式将\
  \ `resultText` `TextView` 绑定到模型中的值。编辑 `main_fragment.xml` 文件，找到 `resultText` 元素并修改\
  \ `text` 属性如下：\n\n```xml\n<TextView\n    android:id=\"@+id/resultText\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:text=\"\
  MainFragment\"\n    android:text='@{safeUnbox(myViewModel.result) == 0.0 ? \"Enter\
  \ value\" : String.valueOf(safeUnbox(myViewModel.result)) + \" euros\"}'\n    app:layout_constraintBottom=\"\
  parent\"\n    app:layout_constraintEnd_toEndOf=\"parent\"\n    app:layout_constraintStart_toStartOf=\"\
  parent\"\n    app:layout_constraintTop_toTopOf=\"parent\" />\n```\n\n### 该表达式首先检查结果值是否为零，如果是，则显示指示用户输入的值。然而，如果结果不为零，则会将该值转换为字符串并与“euros”拼接，然后显示给用户。\n\
  \n结果值只需要单向绑定，因为布局永远更新存储在 `ViewModel` 中的值。相反，`dollarValue` `EditText` 视图需要使用双向绑定，以便根据用户的最新输入更新数据模型，并在生命周期事件（例如由设备旋转触发的事件）发生时重新显示当前值。`dollarText`\
  \ 元素现在应声明如下：\n\n```xml\n<EditText\n    android:id=\"@+id/dollarText\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:layout_marginTop=\"\
  96dp\"\n    android:ems=\"10\"\n    android:importantForAutofill=\"no\"\n    android:inputType=\"\
  numberDecimal\"\n    android:text=\"@={myViewModel.dollarValue}\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintHorizontal_bias=\"0.502\"\n    app:layout_constraintStart_toStartOf=\"\
  parent\"\n    app:layout_constraintTop_toTopOf=\"parent\" />\n```\n\n\n\n\n\n现在已经添加了这些初始绑定表达式，现在需要编写一个方法，以便在用户点击\
  \ `Button` 小部件时执行转换。\n\n## 36.8 添加转换方法\n\n当点击 `Convert` 按钮时，它将调用 `ViewModel` 的一个方法来执行转换计算，并将欧元值存入\
  \ `result` `LiveData` 变量中。现在在 `MainViewModel.java` 文件中添加此方法：\n\n```java\npublic\
  \ class MainViewModel extends ViewModel {\n    private static final Float usd_to_eu_rate\
  \ = 0.74F;\n    public MutableLiveData<String> dollarValue = new MutableLiveData<>();\n\
  \    public MutableLiveData<Float> result = new MutableLiveData<>();\n    public\
  \ void convertValue() {\n        if ((dollarValue.getValue() != null) &&\n     \
  \       (!dollarValue.getValue().equals(\"\"))) {\n            result.setValue(Float.parseFloat(dollarValue.getValue())\n\
  \                    * rate);\n        } else {\n            result.setValue(0F);\n\
  \        }\n    }\n}\n```\n\n注意，在没有有效的美元值的情况下，会将零值分配给 `result` `LiveData` 变量。这确保了如果用户没有输入任何值，分配给\
  \ `resultText` `TextView` 的绑定表达式将显示“Enter value”消息。\n\n## 36.9 添加监听绑定\n\n在测试项目之前的最后一步是在布局文件中的\
  \ `Button` 元素中添加监听绑定表达式，以便在点击按钮时调用 `convertValue()` 方法。再次在 Code 模式下编辑 `main_fragment.xml`\
  \ 文件，找到 `convertButton` 元素并添加如下 `onClick` 条：\n\n```xml\n<Button\n    android:id=\"\
  @+id/convertButton\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:layout_marginTop=\"77dp\"\n    android:onClick=\"@{()\
  \ -> myViewModel.convertValue()}\"\n    android:text=\"Convert\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toBottomOf=\"\
  @+id/resultText\" />\n```\n\n## 36.10 测试应用\n\n编译并运行应用，测试在美元字段中输入值并点击 `Convert` 按钮是否会在\
  \ `TextView` 上显示正确的结果（连同“euros”后缀），以及当美元字段为空时尝试转换，是否会出现“Enter value”提示。此外，还要验证用户界面中显示的信息在设备旋转后是否仍能被保留。\n\
  \n## 36.11 总结\n\n本章的主要目标是完成设置使用数据绑定项目所需的步骤，并演示单向、双向和监听绑定表达式的使用。本章还提供了一个实际示例，说明了通过结合数据绑定和\
  \ `LiveData` 将用户界面视图与应用的后端数据和逻辑连接起来，可以节省多少代码编写工作。\n\n# 37. Android ViewModel 状态保存教程\n\
  \n应用状态的保存与恢复，在于当应用被置于后台后，能够从外观和行为上为用户提供连续性。用户已经习惯于可以在不同应用之间切换，并在返回原始应用时，发现它处于切换发生前完全相同的状态。\n\
  \n正如“理解 Android 应用和 Activity 生命周期”章节中所述，当用户将应用置于后台时，在资源受限的情况下，该应用可能会被操作系统终止。当用户尝试将已终止的应用返回前台时，Android\
  \ 只是简单地在新进程中重新启动应用。由于这一切对用户是不可见的，因此应用有责任将自己恢复到最初置于后台时的相同状态，而不是以其“初始启动”状态呈现。在基于 `ViewModel`\
  \ 的应用中，许多此类行为可以通过 `ViewModel` Saved State 模块来实现。\n\n## 37.1 理解 ViewModel 状态保存\n\n\
  正如前面的章节所述，`ViewModel` 为应用开发带来了许多好处，包括在设备旋转等配置更改时进行 UI 状态恢复。\n\n## 37.2 实现 ViewModel\
  \ 状态保存\n\n通过引入 `ViewModel` Saved State 库，实现了基本的 ViewModel 状态保存。该库本质上扩展了 `ViewModel`\
  \ 类，以支持在后台进程终止及后续重新启动期间维护状态。\n\n保存状态的关键是 `SavedStateHandle` 类，它用于保存和恢复模型的状态。`SavedStateHandle`\
  \ 对象包含一个键值映射，允许通过相应的键来保存和恢复数据值。\n\n为了支持状态保存，需要声明一种不同的 `ViewModel` 子类，这种情况下包含一个可以接收\
  \ `SavedStateHandle` 实例的构造函数。一旦声明，可以通过在创建时包含 `SavedStateViewModelFactory` 创建这种类型的\
  \ `ViewModel` 实例。考虑以下标准 ViewModel 声明的代码：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\
  import androidx.lifecycle.ViewModel;\nimport androidx.lifecycle.MutableLiveData;\n\
  \npublic class MainViewModel extends ViewModel {\n    // ...\n}\n```\n\n创建该类实例的代码可能如下：\n\
  \n```java\nprivate MainViewModel mViewModel;\nmViewModel = new ViewModelProvider(this).get(MainViewModel.class);\n\
  ```\n\n另一方面，设计用于支持状态保存的 `ViewModel` 子类需要声明如下：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\
  import android.util.Log;\nimport androidx.lifecycle.ViewModel;\nimport androidx.lifecycle.MutableLiveData;\n\
  import androidx.lifecycle.SavedStateHandle;\n\npublic class MainViewModel extends\
  \ ViewModel {\n    private SavedStateHandle savedStateHandle;\n    public MainViewModel(SavedStateHandle\
  \ savedStateHandle) {\n        this.savedStateHandle = savedStateHandle;\n    }\n\
  }\n```\n\n当创建上述 ViewModel 的实例时，必须向 `ViewModelProvider` 类初始化器传递一个 `SavedStateViewModelFactory`\
  \ 实例，如下：\n\n```java\nSavedStateViewModelFactory factory = \n    new SavedStateViewModelFactory(getActivity().getApplication(),this);\n\
  ```\n\n\n\n\n\n```java\nmViewModel = new ViewModelProvider(this).get(MainViewModel.class);\n\
  ```\n\n## 37.3 保存和恢复状态\n\n可以通过 `ViewModel` 内部将对象或值传递给 `SavedStateHandle` 实例的 `set()`\
  \ 方法进行保存，并提供在执行检索时用于引用的键字符串：\n\n```java\nprivate static final String NAME_KEY =\
  \ \"Customer Name\";\n\nsavedStateHandle.set(NAME_KEY, customerName);\n```\n\n当与\
  \ `LiveData` 对象配合使用时可以使用 `SavedStateHandle` 实例的 `getLiveData()` 方法恢复之前保存的值，再次通过如下方式引用相应的键：\n\
  \n```java\nMutableLiveData<String> restoredName = savedStateHandle.getLiveData(NAME_KEY);\n\
  ```\n\n要恢复普通（非 LiveData）对象，只需使用 `SavedStateHandle` 的 `get()` 方法即可：\n\n```java\n\
  String restoredName = savedStateHandle.get(NAME_KEY);\n```\n\n其他有用的 `SavedStateHandle`\
  \ 方法包括：\n\n- `contains(String key)` - 返回一个布尔值，表示保存的状态是否包含指定键的值。\n- `remove(String\
  \ key)` - 从保存的状态中移除该值和键。返回被移除的值。\n- `keys()` - 返回一个包含保存状态中所有键的字符串集合（String set）。\n\
  \n## 37.4 为 ViewModelDemo 项目添加保存状态支持\n\n在涵盖了 `ViewModel` 保存状态的基础知识后，可以扩展 `ViewModelDemo`\
  \ 应用以包含此支持。首先，将从“Android Jetpack LiveData 教程”中创建的 `ViewModelDemo_LiveData` 项目导入\
  \ Android Studio（示例代码下载中也有该项目的副本），打开 `build.gradle (Module: `ViewModelDemo.app)`\
  \ 文件并添加保存状态库依赖项（像既往一样，检查是否有更新的库版本）：\n\n```gradle\ndependencies {\n    implementation\
  \ \"androidx.savedstate:savedstate:1.1.0\"\n    implementation \"androidx.lifecycle:lifecycle-viewmodel-savedstate:2.3.1\"\
  \n}\n```\n\n接下来，修改 `MainViewModel.java` 文件，使构造函数接受并存储 `SavedStateHandle` 实例。同时导入\
  \ `androidx.lifecycle.SavedStateHandle`，声明一个键字符串常量，并修改结果 `LiveData` 变量，以便值现在从构造函数中的保存状态中获取：\n\
  \n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\nimport androidx.lifecycle.ViewModel;\n\
  import androidx.lifecycle.MutableLiveData;\nimport androidx.lifecycle.SavedStateHandle;\n\
  \npublic class MainViewModel extends ViewModel {\n    private static final String\
  \ RESULT_KEY = \"Euro Value\";\n    private static final Float rate = 0.74F;\n \
  \   private String dollarText = \"\";\n    private SavedStateHandle savedStateHandle;\n\
  \    private MutableLiveData<Float> result = new MutableLiveData<>();\n\n    public\
  \ MainViewModel(SavedStateHandle savedStateHandle) {\n        this.savedStateHandle\
  \ = savedStateHandle;\n        result = savedStateHandle.getLiveData(RESULT_KEY);\n\
  \    }\n}\n```\n\n在 `MainViewModel.java` 文件中继续，修改 `setAmount()` 方法，包含在每次计算新欧元金额时保存结果值的代码：\n\
  \n```java\npublic void setAmount(String value) {\n    this.dollarText = value;\n\
  \    result.setValue(Float.valueOf(dollarText)* rate);\n    Float convertedValue\
  \ = Float.parseFloat(dollarText)* rate;\n    result.setValue(convertedValue);\n\
  \    savedStateHandle.set(RESULT_KEY, convertedValue);\n}\n```\n\n完成 `ViewModel`\
  \ 的更改后，打开 `MainFragment.java` 文件并进行以下更改，以便在 `ViewModel` 创建过程中包含一个 Saved State 工厂实例：\n\
  \n```java\nimport androidx.lifecycle.SavedStateViewModelFactory;\n\n@Override\n\
  public void onActivityCreated(@Nullable Bundle savedInstanceState) {\n    super.onActivityCreated(savedInstanceState);\n\
  \    SavedStateViewModelFactory factory =\n        new SavedStateViewModelFactory(getActivity().getApplication(),this);\n\
  \    mViewModel = new ViewModelProvider(this).get(MainViewModel.class);\n}\n```\n\
  \n完成更改后，构建并运行应用并进行货币转换。当屏幕 UI 显示了美元和欧元值时，将应用置于后台，从 Logcat 工具窗口中终止它，然后从设备或模拟器屏幕重新启动它。重启后，之前的货币金额仍然显示在\
  \ `TextView` 和 `EditText` 组件中，证明了状态已成功保存并恢复。\n\n## 37.5 总结\n\n设计良好的应用在从后台切回时，应该始终向用户呈现相同的状态，无论该进程是否被操作系统终止。这可以通过利用\
  \ `ViewModel` 保存状态模块来实现。当创建实例时，必须 le 传递一个 `SavedStateViewModelFactory`。\n\n## 38.\
  \ 使用生命周期感知组件\n\n早之前标题为“理解应用程序和 Activity 生命周期”的章节描述了如何使用生命周期方法在 UI 控制器内部跟踪状态。这些方法的主要问题之一是它们将处理更改的负担置于\
  \ UI 控制器。从表面上看，这似乎是逻辑上的方法，因为 UI 控制器毕竟是经历状态变化的对象。然而，事实是，通常受变化影响的代码始终位于应用中的其他类中。这导致\
  \ UI 控制器中出现了复杂的代码，需要响应更改来管理和操作其他对象。显然，在遵循 Android 指南时应避免这种情况。\n\n一种更清晰且符合逻辑的方法是让应用中的对象能够观察其他对象的状态，并负责对更改采取任何行动。例如，负责跟踪用户位置的类可以观察\
  \ UI 控制器的状态，并在控制器进入暂停状态时挂起位置更新。当控制器进入恢复状态时，即可重新跟踪。这通过 `Lifecycle` 包提供的类和接口实现。\n\n\
  本章将介绍用于在 Android 应用中构建生命周期感知的术语和关键组件。\n\n### 38.1 生命周期感知\n\n如果一个对象能够检测并响应应用内其他对象生命周期状态的变化，则称它是生命周期感知的。某些\
  \ Android 组件（以 LiveData 为例）已经是生命周期感知的。也可以在类中实现 `LifecycleObserver` 接口来配置任何类为生命周期感知。\n\
  \n### 38.2 生命周期所有者\n\n生命周期感知组件只能观察作为生命所有者的对象的状态。生命所有者实现 `LifecycleOwner` 接口，并分配一个相应的\
  \ `Lifecycle` 对象，该对象负责存储组件的当前状态并向生命周期观察者提供状态。大多数标准的 Android Framework 组件（如 activity\
  \ 和 fragment 类）都是生命所有者。自定义类也可以通过使用 `LifecycleRegistry` 类并实现 `LifecycleObserver`\
  \ 接口来配置为生命所有者。例如：\n\n\n\n\n\n```java\npublic class SampleOwner implements LifecycleOwner\
  \ {\n\n    private LifecycleRegistry lifecycleRegistry;\n\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        lifecycleRegistry = new LifecycleRegistry(this);\n    }\n\n    @NonNull\n\
  \    @Override\n    public Lifecycle getLifecycle() {\n        return lifecycleRegistry;\n\
  \    }\n}\n```\n\n除非生命周期所有者（lifecycle owner）是另一个生命感知组件的子类，否则该类需要通过调用 `LifecycleRegistry`\
  \ 类的方法来触发生命周期状态变化。可以使用 `markState()` 方法通过传递新的状态值来触发生命周期状态变化：\n\n```java\npublic\
  \ void resuming() {\n    lifecycleRegistry.markState(Lifecycle.State.RESUMED);\n\
  }\n```\n\n上述调用也将导致相应的事件处理器被调用。或者，可以调用 `LifecycleRegistry.handleLifecycleEvent()`\
  \ 方法并传递要触发的生命周期事件（这将导致生命周期状态发生改变）。例如：\n\n```java\nlifecycleRegistry.handleLifecycleEvent(Lifecycle.Event.ON_START);\n\
  ```\n\n## 38.3 生命周期观察者 (Lifecycle Observers)\n\n为了让生命感知组件能够观察生命周期所有者的状态，它必须实现 `LifecycleObserver`\
  \ 接口，并对其需要观察的任何生命周期变化事件包含事件监听处理器。\n\n```java\npublic class SampleObserver implements\
  \ LifecycleObserver {\n    // 生命周期事件方法在这里\n}\n```\n\n然后创建此观察者类的实例并将其添加到 `Lifecycle`\
  \ 对象维护的观察者列表中。\n\n如果不再需要跟踪生命周期状态，可以随时从 `Lifecycle` 对象中移除观察者。\n\n图 38-1 展示了提供生命感知的关键元素之间的关系：\n\
  \n![](img/lifecycle_component_diagram.jpg)\n\n图 38-1\n\n## 38.4 生命周期状态与事件 (Lifecycle\
  \ States and Events)\n\n当生命周期所有者的状态发生变化时，分配的 `Lifecycle` 对象将更新为新状态。在任何时刻，生命周期所有者都处于以下五个状态之一：\n\
  \n- `Lifecycle.State.INITIALIZED`\n- `Lifecycle.State.CREATED`\n- `Lifecycle.State.STARTED`\n\
  - `Lifecycle.State.RESUMED`\n- `Lifecycle.State.DESTROYED`\n\n随着组件在不同状态之间转换，`Lifecycle`\
  \ 对象将在任何已添加到列表的观察者上触发事件。在生命周期观察者可以实现以下事件：\n\n- `Lifecycle.Event.ON_CREATE`\n- `Lifecycle.Event.ON_START`\n\
  - `Lifecycle.Event.ON_RESUME`\n- `Lifecycle.Event.ON_PAUSE`\n- `Lifecycle.Event.ON_STOP`\n\
  - `Lifecycle.Event.ON_DESTROY`\n- `Lifecycle.Event.ON_ANY`\n\n观察者类中使用注解来将方法与生命周期事件关联。例如，以下代码配置了观察者中的一个方法，以便在响应\
  \ `ON_RESUME` 生命周期事件时被调用：\n\n```java\n@OnLifecycleEvent(Lifecycle.Event.ON_RESUME)\n\
  public void onResume() {\n    // 响应状态变为 RESUMED 时执行任务\n}\n```\n\n分配给 `ON_ANY` 事件的方法将在所有生命周期事件发生时被调用。此类型事件的方法传递了一个生命周期所有者的引用和一个\
  \ `event` 对象，该对象可以查找当前状态和事件类型。例如，以下方法提取了当前状态和事件的名称：\n\n```java\n@OnLifecycleEvent(Lifecycle.Event.ON_ANY)\n\
  public void onAny(LifecycleOwner owner, Lifecycle.Event event) {\n    String currentState\
  \ = getLifecycle().getCurrentState().name();\n    String eventName = event.name();\n\
  }\n```\n\n当所有者状态需要处于特定的生命周期级别时，也可以使用当前状态对象的 `isAtLeast()` 方法：\n\n```java\nif (getLifecycle().getCurrentState().isAtLeast(Lifecycle.State.STARTED))\
  \ {\n}\n```\n\n图 38-2 中的流程图说明了生命周期所有者的状态变化序列，以及在每次状态转换之间将在观察者上触发的生命周期事件：\n\n![](img/android_lifecycle_states_diagram.jpg)\n\
  \n图 38-2\n\n### 38.5 总结 (Summary)\n\n本章介绍了生命感知的基础知识，以及 Android Jetpack 的 Android\
  \ Lifecycle 包中的类和接口。该包包含了许多用于创建生命周期所有者、生命周期观察者生命感知组件的类和接口。生命周期所有者分配有一个 `Lifecycle`\
  \ 对象，该对象维护所有者状态的记录以及订阅观察者的列表。当所有者状态变化时，会通过生命周期事件方法通知观察者，以便对其变化做出响应。\n\n下一章将创建一个\
  \ Android Studio 项目，演示如何使用和创建生命感知组件，包括创建生命周期观察者和所有者，以及处理生命周期状态变化和事件。\n\n## 39. Android\
  \ Jetpack 生命周期感知教程\n\n上一章概述了生命感知的知识，并概述了在 Android 应用项目中实现此特性的关键类和接口。本章将在此知识的基础上，通过构建一个专为生命感知设计的\
  \ Android Studio 项目。\n\n### 39.1 创建示例项目\n\n从欢迎界面选择 `New Project`（新建项目）选项，并在生成的项目对话框中，选择\
  \ `Empty Activity`（空活动）模板。输入 `LifecycleDemo` 作为名称，并在 `com.ebookrenzy.lifecemo` 指定包名。\n\
  \n### 39.2 创建生命周期观察者\n\n如前所述，Activity 和 Fragment 已经实现了 `LifecycleOwner` 接口并准备好被对象观察。为了在实践中看到这一点，本教程的下一步是在项目中添加一个新类，它可以观察\
  \ `MainActivity` 实例。\n\n在项目窗口中右键点击 `app` -> `java` -> `com.ebookrenzy.lifecemo`，选择\
  \ `New` -> `Java Class...`。在 `New Class` 对话框中将类命名为 `DemoObserver` 并按回车键创建 `DemoObserver.java`\
  \ 文件。新文件会在编辑器中打开，内容如下：\n\n```java\npackage com.ebookrenzy.lifecemo;\n\npublic class\
  \ DemoObserver {\n}\n```\n\n留在编辑器中，修改类文件声明它将实现 `LifecycleObserver` 接口：\n\n```java\n\
  package com.ebookrenzy.lifecemo;\n\nimport androidx.lifecycle.LifecycleObserver;\n\
  \npublic class DemoObserver implements LifecycleObserver {\n}\n```\n\n\n\n\n\n```java\n\
  Log.i(LOG_TAG, \"onStart\");\n\n}\n\n@OnLifecycleEvent(Lifecycle.Event.ON_STOP)\n\
  public void onStop() {\n    Log.i(LOG_TAG, \"onStop\");\n}\n\n@OnLifecycleEvent(Lifecycle.Event.ON_DESTROY)\n\
  public void onDestroy() {\n    Log.i(LOG_TAG, \"onDestroy\");\n}\n}\n```\n\n为了能够跟踪与\
  \ fragment 当前状态相关的事件，还会添加一个 `ON_ANY` 事件处理程序。由于该方法传递了生命周期所有者（lifecycle owner）的引用，因此可以添加代码来获取当前状态。在\
  \ `DemoObserver.java` 文件中，添加以下方法：\n\n```java\n@OnLifecycleEvent(Lifecycle.Event.ON_ANY)\n\
  \npublic void onAny(LifecycleOwner owner, Lifecycle.Event event) {\n    Log.i(LOG_TAG,\
  \ owner.getLifecycle().getCurrentState().name());\n}\n```\n\n完成 `DemoObserver` 类后，下一步是将其作为观察者添加到\
  \ `MainFragment` 类中。\n\n### 39.3 添加观察者\n\n观察者是通过调用所有者 `Lifecycle` 对象的 `addObserver()`\
  \ 方法添加的，而该对象是通过调用 `getLifecycle()` 方法获取的。编辑 `MainFragment.java` 类文件，并在 `onActivityCreated()`\
  \ 方法中添加代码以添加观察者：\n\n```\n.\n.\n\nimport com.ebookfrenzy.lifecycledemo.DemoObserver;\n\
  \n.\n.\n\n@Override\npublic void onActivityCreated(@Nullable Bundle savedInstanceState)\
  \ {\n    super.onActivityCreated(savedInstanceState);\n    mViewModel = new ViewModelProvider(this).get(MainViewModel.class);\n\
  \    getLifecycle().addObserver(new DemoObserver());\n}\n```\n\n在观察者类被创建并添加到生命周期所有者的\
  \ `Lifecycle` 对象后，应用就已准备好进行测试。\n\n## 39.4 测试观察者\n\n由于 `DemoObserver` 类会将诊断信息输出到\
  \ Logcat 控制台，如果配置了过滤器仅显示 `DemoObserver` 消息，将更容易看到输出。使用之前在 “通过示例了解 Android 状态变化”\
  \ 中列出的步骤，在设备或模拟器上运行应用之前，为与 `DemoObserver` 标签的消息配置过滤器。\n\n应用成功启动后，Logcat 输出应指示以下生命周期状态变化和事件：\n\
  \n`onCreate`\nCREATED\n`onStart`\nSTARTED\n`onResume`\nRESUMED\n\n在应用运行时，执行设备旋转以触发\
  \ fragment 的销毁和重建，生成以下额外的输出：\n\n`onPause`\nSTARTED\n`onStop`\nCREATED\n`onDestroy`\n\
  DESTROYED\n`onCreate`\nCREATED\n`onStart`\nSTARTED\n`onResume`\nRESUMED\n\n在移动到本章下一节之前，请花些时间将应用的输出与上一章中\
  \ 图 38-2 中的流程图进行比较。\n\n## 39.5 创建生命周期所有者\n\n本章的最后一项任务是创建一个自定义的生命周期所有者类，并演示如何从该类内部触发事件并修改生命周期状态。\n\
  \n在项目工具窗口（Project tool window）中，右键点击应用 `app` -> `java` -> `com.ebookfrenzy.lifecycledemo`\
  \ 项，并选择 `New` -> `Java Class...` 菜单选项。在 `Create Class` 对话框中按回车键之前，将类命名为 `DemoOwner`。将新的\
  \ `DemoOwner.java` 文件加载到代码编辑器后，对其进行如下修改：\n\n```java\npackage com.ebookfrenzy.lifecycledemo;\n\
  \nimport androidx.lifecycle.Lifecycle;\nimport androidx.lifecycle.LifecycleOwner;\n\
  import androidx.lifecycle.LifecycleRegistry;\nimport org.jetbrains.annotations.NotNull;\n\
  \npublic class DemoOwner implements LifecycleOwner {\n\n}\n```\n\n该类需要一个用自身引用初始化的\
  \ `LifecycleRegistry` 实例，以及一个配置为返回 `LifecycleRegistry` 实例的 `getLifecycle()` 方法。声明一个变量来存储\
  \ `LifecycleRegistry` 引用，一个初始化 `LifecycleRegistry` 实例的构造函数以及 `getLifecycle()` 方法：\n\
  \n```java\npublic class DemoOwner implements LifecycleOwner {\n    private final\
  \ LifecycleRegistry lifecycleRegistry;\n    public DemoOwner() {\n        lifecycleRegistry\
  \ = new LifecycleRegistry(this);\n    }\n    @NotNull\n    @Override\n    public\
  \ Lifecycle getLifecycle() {\n        return lifecycleRegistry;\n    }\n}\n```\n\
  \n接下来，该类需要通知注册表生命周期状态的变化。这可以通过使用 `LifecycleRegistry` 对象的 `markState()` 方法标记状态，也可以通过使用\
  \ `handleLifecycleEvent()` 方法触发生命周期事件来实现。自定义类中什么构成了状态更改取决于类的目的。在本示例中，我们将添加一些在调用时简单地触发生命周期事件的方法：\n\
  \n```\n.\n.\n\nprivate LifecycleRegistry lifecycleRegistry;\n\n.\n.\n\npublic void\
  \ startOwner() {\n    lifecycleRegistry.handleLifecycleEvent(Lifecycle.Event.ON_START);\n\
  }\n\npublic void stopOwner() {\n    lifecycleRegistry.handleLifecycleEvent(Lifecycle.Event.ON_STOP);\n\
  }\n\n@NotNull\n@Override\npublic Lifecycle getLifecycle() {\n    return lifecycleRegistry;\n\
  }\n```\n\n`DemoOwner` 类中的最后一个更改是添加 `DemoObserver` 作为观察者。此调用将在构造函数中完成：\n\n```java\n\
  public DemoOwner() {\n    lifecycleRegistry = new LifecycleRegistry(this);\n   \
  \ getLifecycle().addObserver(new DemoObserver());\n}\n```\n\n将 `MainFragment.java`\
  \ 文件加载到代码编辑器中，找到 `onActivityCreated()` 方法并添加代码创建 `DemoOwner` 实例，并调用 `startOwner()`\
  \ 和 `stopOwner()`。请注意，添加 `DemoObserver` 作为观察者的调用已被移除，以避免 Logcat 窗口中重复且混淆的输出：\n\n\
  ```\n.\n.\n\nimport com.ebookfrenzy.lifecycledemo.DemoOwner;\n\n.\n.\n\nprivate\
  \ DemoOwner demoOwner;\n\n.\n.\n\n@Override\npublic void onActivityCreated(@Nullable\
  \ Bundle savedInstanceState) {\n    super.onActivityCreated(savedInstanceState);\n\
  \    mViewModel = new ViewModelProvider(this).get(MainViewModel.class);\n    demoOwner\
  \ = new DemoOwner();\n    demoOwner.startOwner();\n    demoOwner.stopOwner();\n\
  }\n```\n\n## 39.6 测试自定义生命周期所有者\n\n最后一次运行应用，参考 Logcat 窗口，确认观察者按以下顺序检测到生命周期生命周期事件：\n\
  \n`onCreate`\nCREATED\n`onStart`\nSTARTED\n`onStop`\nCREATED\n\n注意，即使没有在 `DemoOwner`\
  \ 类中手动添加代码，“创建”状态更改仍然触发了。事实上，这些更改是在实例首次创建以及随后处理 `ON_STOP` 事件时自动触发的。\n\n## 39.7 总结\n\
  \n本章演示了在 Android 应用中实现生命周期感知的相关步骤。这包括创建生命周期观察者以及设计并实现基础生命周期所有者类。\n\n## 40. 导航架构组件概述\n\
  \n如今的 Android 应用很少由单个屏幕组成。事实上，大多数应用包含多个屏幕，用户通过屏幕手势、按钮点击和菜单选择在之间进行导航。在 Android Jetpack\
  \ 引入之前，应用内导航的实现主要是手动编码过程，没有简单的方法来查看和组织复杂的导航路径。然而，随着 Android 导航架构组件的引入以及 Android\
  \ Studio 对导航图的支持，这种情况已得到了极大改善。\n\n## 40.1 理解导航\n\n\n\n\n\n每个应用都有一个主屏幕，它在应用启动且任何启动屏显示后就会出现（启动屏是应用加载时临时显示的应用品牌界面）。从这个主屏幕开始，用户通常会执行任务并导致出现其他屏幕。这些屏幕通常以应用内其他活动（activity）和碎片（fragment）的形式存在。例如，消息应用可能有一个列出当前消息的主屏幕，用户可以从中导航到另一个屏幕以访问联系人列表，或者导航到设置屏幕。联系人列表屏幕反过来允许用户导航到其他屏幕，在其中添加新用户或更新现有联系人。从图形上看，应用的导航图（navigation\
  \ graph）可以如图 40-1\n\n图 40-1\n\n构成应用的每个屏幕（包括主屏幕）统称为目的地（destination），通常是一个碎片或活动。Android\
  \ 导航架构使用导航栈（navigation stack）来跟踪用户在应用内目的地之间的路径。当应用首次启动时，主屏幕是第一个被放入栈中的目的地，并成为当前目的地。当用户导航到另一个目的地时，该屏幕将成为当前目的地，并推送到主目的地之上。随着用户导航到其他屏幕，它们也会被推入栈中。例如，图\
  \ 40-2\n\n图 40-2\n\n当用户使用系统返回键通过屏幕返回导航时，每个目的地都会从栈中弹出，直到主屏幕再次成为栈上的唯一目的地。在图 40-3 中，用户从“添加联系人”屏幕返回，将其从栈中弹出并使“联系人列表”屏幕成为当前目的地：\n\
  \n![](img/jetpack_navigation_stack_pop_diagram.jpg)\n\n图 40-3\n\n在目的地之间导航和管理导航栈的所有工作都由导航控制器处理，它由\
  \ `NavController` 类表示。\n\n使用导航架构组件向 Android 项目中添加导航是一个简单的过程，涉及导航宿主（navigation host）、导航图、导航动作以及少量的代码编写，以获取并与导航控制器实例进行交互。\n\
  \n## 40.2 声明导航宿主\n\n导航宿主仅仅是嵌入到活动用户界面布局中的特殊碎片（`NavHostFragment`），作为用户将要导航的目的地的占位符。例如，图\
  \ 40-4 显示了一个典型的活动屏幕，并突出显示由导航宿主碎片表示的区域：\n\n![](img/jetpack_navigation_navhost.jpg)\n\
  \n图 40-4\n\n可以通过 Android Studio 布局编辑器从调色板的容器（Containers）部分拖放实例，或者通过如下手动编辑 XML 的方式，将\
  \ `NavHostFragment` 放置在活动布局中：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<FrameLayout xmlns:android=\"http://schemas.android.com/apk/res/android\"\n\
  \    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:id=\"@+id/container\"\n    android:layout_width=\"match_parent\"\n\
  \    android:layout_height=\"match_parent\"\n    tools:context=\".MainActivity\"\
  \ >\n    <androidx.fragment.app.FragmentContainerView\n        android:id=\"@+id/demo_nav_host_fragment\"\
  \n        android:name=\"androidx.navigation.fragment.NavHostFragment\"\n      \
  \  android:layout_width=\"match_parent\"\n        android:layout_height=\"match_parent\"\
  \n        app:defaultNavHost=\"true\"\n        app:navGraph=\"@navigation/navigation_graph\"\
  \ />\n</FrameLayout>\n```\n\n上述导航宿主碎片元素中的注意点是 `name` 属性对 `NavHostFragment` 的引用、`defaultNavHost`\
  \ 设置为 `true` 以及将包含导航图的文件分配给 `navGraph` 属性。\n\n当活动启动时，此导航宿主碎片将被导航图中指定的首页目的地替换。当用户在应用屏幕间导航时，宿主碎片将被对应目的地的相应碎片替换。\n\
  \n## 40.3 导航图\n\n导航图是一个 XML 文件，包含了包含在应用导航中的目的地。除了这些目的地外，该文件还包含目的地之间导航的导航动作，以及从一个目的地传递数据到另一个目的地的可选参数。Android\
  \ Studio 包含一个导航图编辑器，可以使用可视化方式或手动编辑 XML 来设计图并实现动作。图 40-5 显示了设计模式下的 Android Studio\
  \ 导航编辑器：\n\n![](img/as_4.jpg)\n\n图 40-5\n\n目的地列表 (A) 提供了图中包含的所有目的地的列表。从列表中选择一个目的地将定位并选中图中对应的目的地。导航面板\
  \ (B) 包含每个目的地的对话框，显示用户界面的表示。在此示例中，此图包含两个目的地 `mainFragment` 和 `secondFragment`。目的地之间的箭头\
  \ (C) 表示导航连接。通过将鼠标指针悬留在起点边缘直到出现圆，然后点击并拖动到目的地来添加动作。属性面板 (D) 查看当前选中目的地或动作的属性。在上方显示了属性。通过点击按钮\
  \ E 从菜单中选择选项可以添加新目的地。可以选择现有碎片作为目的地，或创建空白目的地。组件树面板 (F) 提供了导航图的层级概览。\n\n通过将编辑器切换到代码模式，可以查看并修改导航图的底层\
  \ XML。以下 XML 代表上述图 40-5：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n\
  <navigation xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:id=\"@+id/navigation_graph\"\n    app:startDestination=\"@id/mainFragment\"\
  >\n    <fragment\n        android:id=\"@+id/mainFragment\"\n        android:name=\"\
  com.ebookfrenzy.navigationdemo.ui.main.MainFragment\"\n        android:label=\"\
  main_fragment\"\n        tools:layout=\"@layout/main_fragment\" >\n        <action\n\
  \            android:id=\"@+id/mainToSecond\"\n            app:destination=\"@id/secondFragment\"\
  \ />\n    </fragment>\n    <fragment\n        android:id=\"@+id/secondFragment\"\
  \n        android:name=\"com.ebookfrenzy.navigationdemo.SecondFragment\"\n     \
  \   android:label=\"fragment_second\"\n        tools:layout=\"@layout/fragment_second\"\
  \ >\n    </fragment>\n</navigation>\n```\n\n\n\n\n\n如有必要，导航图也可以拆分到多个文件中，以改进组织结构并促进重用。当以这种方式构建时，嵌套图会被嵌入到根图中。要创建一个嵌套图，只需按住\
  \ Shift 并点击要嵌套的目标，在第一个目标上点击右键并选择 `Move to Nested Graph -> New Graph`（移动到嵌套图 -> 新图）菜单选项。嵌套图随后将作为图中的新节点出现。要访问嵌套图，只需双击嵌套图节点即可将图文件加载到编辑器中。\n\
  \n### 40.4 访问导航控制器\n\n从一个目的地到另一个目的地的导航通常是为了应用内的某种事件响应，例如按钮点击或菜单选择。在触发导航操作之前，代码必须先获取导航控制器实例的引用。这需要调用\
  \ `Navigation` 或 `NavHostFragment` 类的 `findNavController()` 方法。例如，下面的代码可以用于访问 activity\
  \ 的导航控制器。注意，为了使代码生效，activity 必须包含一个导航宿片段：\n\n```java\nNavController controller =\n\
  \    Navigation.findNavController(activity, R.id.demo_nav_host_fragment);\n```\n\
  \n在这种情况下，方法调用传递了 `activity` 的引用以及嵌入在 activity 布局中的 `NavHostFragment` 的 `id`。\n\n\
  或者，与任何视图关联的导航控制器可以通过将该视图传递给方法来识别：\n\n```java\nNavController controller = Navigation.findNavController(binding.button);\n\
  ```\n\n最后一种选项通过调用 `NavHostFragment` 类的 `findNavController()` 方法并传递片段引用来查找片段的导航控制器：\n\
  \n```java\nNavController controller = NavHostFragment.findNavController(fragment);\n\
  ```\n\n### 40.5 触发导航操作\n\n一旦找到导航控制器，可以通过调用控制器的 `navigate()` 方法并传递要执行的操作资源 ID 来触发导航操作。例如：\n\
  \n```java\ncontroller.navigate(R.id.goToContactsList);\n```\n\n操作的 `id` 是在导航图编辑器选择操作连接时在属性（Attributes）面板中定义的。\n\
  \n### 40.6 传递参数\n\n在导航操作期间，可以使用导航图文件中定义的参数将数据从一个目的地传递到另一个目的地。参数由名称、类型和可选的默认值组成，可以在\
  \ XML 中手动添加，也可以在图中选择操作箭头或目标时使用属性面板添加。例如，在图 40-6 中，一个名为 `contactsCount` 的整数参数被定义的默认值为\
  \ `0`：\n\n![](img/jetpack_navigation_action.jpg)\n\n图 40-6\n\n添加后，参数放置在接收目的地的 XML\
  \ 元素中，例如：\n\n```xml\n<fragment\n    android:id=\"@+id/secondFragment\"\n    android:name=\"\
  com.ebookfrenzy.navigationdemo.SecondFragment\"\n    android:label=\"fragment_second\"\
  \n    tools:layout=\"@layout/fragment_second\" >\n    <argument\n        android:name=\"\
  contactsCount\"\n        android:defaultValue=0\n        app:type=\"integer\" />\n\
  </fragment>\n```\n\n导航架构组件提供了两种在目的地之间传递数据的技术。一种方法是将数据放入 `Bundle` 对象中，在操作期间将其传递给目的地，然后在该处进行解包并提取参数。\n\
  \n这种特定方法的主要缺点是它不是“类型安全的”。换句话说，如果接收目的地将参数处理为与声明类型不同的的类型（例如将字符串视为整数），此错误将不会被编译器捕获，并可能在运行时引发问题。\n\
  \n更好的选择（也是本书中使用的方法）是使用 `safeargs`。`safeargs` 是 Android Studio Gradle 构建系统的一个插件，它会自动生成特殊类，允许以类型安全的方式传递参数。`safeargs`\
  \ 的参数传递方法将在下一章中描述和演示（“Android Jetpack Navigation 组件教程”）。\n\n## 40.7 总结\n\n在 Android\
  \ 应用用户界面的范围内，`Navigation` 一词指的是用户在不同屏幕之间来回移动的能力。曾经实现非常耗时且难以组织，现在 Android Studio\
  \ 和导航架构组件使得在 Android 应用项目内实现和管理导航变得更容易。\n\n应用中的不同屏幕被称为 `destinations`（目的地），通常由片段或活动表示。所有应用都有主目的地，包括应用首次加载时显示的屏幕。此布局的内容区域被一个导航宿片段取代，当用户导航应用时，该片段会被其他目的地片段。导航路径由导航图文件定义，该文件由目的地以及将它们连接的操作以及需要在目的地之间传递的任何参数组成。导航由导航控制器处理，控制器在管理导航栈外，还提供了从应用代码内部启动导航操作的方法。\n\
  \n# 41. 一个 Android Jetpack Navigation 组件教程\n\n上一章描述了 Android Jetpack Navigation\
  \ 组件以及它如何与 Android Studio 的导航绘图功能集成，为在 Android 应用屏幕之间实现导航提供了一种简单的方法。在本章中，将创建一个新的\
  \ Android Studio 项目，利用这些导航功能实现一个包含多个屏幕的示例应用。除了演示 Android Studio 图编辑器的用法外，示例项目还将实现使用类型安全的参数在源屏幕和目标屏幕之间传递数据。\n\
  \n## 41.1 创建 NavigationDemo 项目\n\n在欢迎界面选择 `New Project` 选项，并在出现的新项目对话框中选择 `Fragment\
  \ + ViewModel` 模板，然后点击 `Next` 按钮。\n\n在 `Name` 字段输入 `NavigationDemo`，指定 `com.ebookfrenzy.navigationdemo`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`并将`Language`\
  \ 更改为 Java。\n\n### 41.2 为构建配置添加导航\n\n新的 Android Studio 项目默认不会在构建文件中包含组件库。因此，在执行任何其他任务之前，第一步是修改应用级的\
  \ `build.gradle` 文件。在项目窗口找到该文件（`Gradle Scripts -> build.gradle (Module: NavigationDemo.app)`），双击它将其加载到代码编辑器并修改\
  \ `dependencies` 部分以添加导航库。借此机会为该模块启用视图绑定：\n\n```gradle\nandroid {\n    buildFeatures\
  \ {\n        viewBinding true\n    }\n}\n\ndependencies {\n    implementation 'androidx.navigation:navigation-fragment:2.3.5'\n\
  \    implementation 'androidx.navigation:navigation-ui:2.3.5'\n}\n```\n\n注意，本书出版以来，这些库可能发布了更新版本。要识别并使用库的新版本，请将上述行添加到构建文件中，然后打开\
  \ `Project Structure` 对话框（`File -> Project Structure...`）。在 `Project Structure`\
  \ 对话框中，选择 `Suggestions` 以显示可用更新。如果有新的库版本，点击 `Update` 按钮以确保在 `build.gradle` 文件中使用最新版本，然后点击\
  \ `Apply` 按钮：\n\n![](img/as_3.4_project_structure_suggestions.jpg)\n\n图 41-1\n\n\
  \n\n\n\n在文件中添加导航依赖项后，点击 `Sync Now` 链接以重新同步项目的构建配置。\n\n## 41.3 创建导航图资源文件\n\n在构建配置中添加了导航库后，现在可以向项目中添加导航图资源文件了。如\
  \ “导航架构组件概述` 所示，这是一个 XML 文件，包含了用户可以进行导航的片段（fragments）和活动（activities），以及执行转换的动作和在目的地之间传递的任何数据。\n\
  \n在 Project 工具窗口中，找到 `res` 文件夹（`app` -> `res`），右键点击它并选择 `New` -> `Android Resource\
  \ File` 菜单选项：\n\n![](img/as_3.2_navigation_new_resource_menu.jpg)\n\n图 41-2\n\n\
  选择菜单项后，将出现 `New Resource File` 对话框。对话框中，将文件命名为 `navigation_graph`，并将 `Resource type`\
  \ 菜单更改为 `Navigation`（如图 41-3 所示），然后点击 `OK` 按钮创建文件。\n\n![](img/as_3.2_navigation_new_resource_file.jpg)\n\
  \n图 41-3\n\n导航图资源文件被添加到项目后，它将出现在主面板中，准备好添加新的目的地。在添加任何目的地之前，将编辑器切换到 `Code` 模式并检查表的\
  \ XML：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<navigation xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    android:id=\"@+id/navigation_graph\">\n</navigation>\n```\n\n在编辑器中切换回 `Design`\
  \ 模式，注意 `Destinations` 面板的 `Host` 部分指示项目中未检测到任何导航主机片段（navigation host fragments）：\n\
  \n![](img/as_4.1_navigation_no_hosts.jpg)\n\n图 41-4\n\n在导航图中添加任何目的地之前，下一步是向项目添加一个导航主机片段。\n\
  \n## 41.4 声明导航主机\n\n对于本项目，导航主机片段将包含在主活动的用户用户界面布局中。这意味着导航图中的目的地片段将出现在主活动的内容区域，目前该区域由\
  \ `main_fragment.xml` 布局占据。在 Project 工具窗口中找到主活动布局文件（`app` -> `res` -> `layout` ->\
  \ `main_activity.xml`）并将其加载到布局编辑器工具中。\n\n当编辑器处于 `Design` 模式时，从 `Palette`（调色板）的 `Containers`\
  \ 部分拖入 `NavHostFragment` 元素，并将其释放到活动布局的容器区域，如图 41-5 箭头所示：\n\n![](img/as_3.6_add_navhostfragment.jpg)\n\
  \n图 41-5\n\n从生成的 `Navigation Graphs` 对话框中，选择在上节中创建的 `navigation_graph.xml` 文件并点击\
  \ `OK` 按钮。\n\n在布局中选中新添加的 `NavHostFragment` 实例，使用 `Attributes` 工具窗口将元素的 ID 更改为 `demo_nav_host_fragment`。\n\
  \n将布局编辑器切换到 `Code` 模式并检查 XML 文件。注意编辑器已正确配置了导航图属性以引用 `navigation_graph.xml` 文件，且\
  \ `defaultNavHost` 属性已设置为 `true`：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<FrameLayout xmlns:android=\"http://schemas.android.com/apk/res/android\"\n\
  \    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:id=\"@+id/container\"\n    android:layout_width=\"match_parent\"\n\
  \    android:layout_height=\"match_parent\"\n    tools:context=\".MainActivity\"\
  \ >\n    <androidx.fragment.app.FragmentContainerView\n        android:id=\"@+id/demo_nav_host_fragment\"\
  \n        android:name=\"androidx.navigation.fragment.NavHostFragment\"\n      \
  \  android:layout_width=\"match_parent\"\n        android:layout_height=\"match_parent\"\
  \n        app:defaultNavHost=\"true\"\n        app:navGraph=\"@navigation/navigation_graph\"\
  \ />\n</FrameLayout>\n```\n\n在主活动布局文件中配置好 `NavHostFragment` 后，需要从 `MainActivity.java`\
  \ 类文件中移除某些代码，以防止活动在运行时加载 `main_fragment.xml` 文件。将此文件加载到代码编辑器中，找到 `onCreate()` 方法并移除负责显示主片段的代码：\n\
  \n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState) {\n   \
  \ super.onCreate(savedInstanceState);\n    setContentView(R.layout.main_activity);\n\
  \    if (savedInstanceState == null) {\n        getFragmentManager().beginTransaction()\n\
  \            .replace(R.id.container, MainFragment.newInstance())\n            .commitNow();\n\
  \    }\n}\n```\n\n返回 `navigation_graph.xml` 文件并确认已检测到 `NavHostFragment` 实例（可能需要关闭并重新打开文件）：\n\
  \n![](img/as_4.1_navigation_host_added.jpg)\n\n图 41-6\n\n## 41.5 添加目的地\n\n留在导航图中，现在是添加第一个目的地的时间了。由于项目已经有了第一个屏幕的片段（`main_fragment.xml`），这将是要添加的第一个目的地。点击图\
  \ 41-7 所示的 `New Destination` 按钮来选择或创建目的地：\n\n![](img/as_4.1_add_destination.jpg)\n\
  \n图 41-7\n\n选择 `main_fragment` 作为目的地，使其出现在导航图中：\n\n![](img/as_4.1_first_added.jpg)\n\
  \n图 41-8\n\n位于目的地上方的房屋图标表示它是起始目的地。这意味着当创建 `NavHostFragment` 的活动时，它将是第一个显示的目的地。要更改起始目的地，选择图中的节点并点击工具栏上的房屋按钮。\n\
  \n通过将编辑器切换到 `Code` 模式检查导航表的 XML 内容：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<navigation xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\"\n    android:id=\"@+id/navigation_graph\"\n \
  \   app:startDestination=\"@id/mainFragment\">\n    <fragment\n        android:id=\"\
  @+id/mainFragment\"\n        android:name=\"com.ebookfrenzy.navigationdemo.ui.main.MainFragment\"\
  \n        android:label=\"main_fragment\"\n        tools:layout=\"@layout/main_fragment\"\
  \ />\n</navigation>\n```\n\n在执行任何导航之前，图中至少还需要另一个目的地。这次将使用导航图编辑器创建一个新的空白目的地。切换回 `Design`\
  \ 模式并再次点击 `New Destination` 按钮，这次从菜单中选择 `Create new destination` 选项。在生成的对话框中，选择\
  \ `Fragment (Blank)` 模板，将新片段命名为 `SecondFragment`并将布局命名为 `fragment_second`，然后点击 `Finish`\
  \ 按钮。在项目重新构建的短暂等待后，新片段将作为另一个目的地出现在图中，如图 41-9 所示：\n\n![](img/as_3.2_navigation_second_destination.jpg)\n\
  \n图 41-9\n\n## 41.6 设计目的地片段布局\n\n\n\n\n\n在添加用于在目的地之间导航的操作之前，现在是为图中两个目标片段（fragments）添加一些用户界面组件的好时机。首先，双击\
  \ `mainFragment` 目标，使 `main_fragment.xml` 文件加载到布局编辑器中。选择并删除当前的 `TextView` 小部件，然后将\
  \ `Button` 和 `Plain Text EditText` 小部件拖放到布局中，使其外观类似于下方图 41-10 所示：\n\n![](img/as_4.1_navigation_demo_ui.jpg)\n\
  \n图 41-10\n\n一旦视图位置正确，点击工具栏上的 `Infer constraints`（推断约束）按钮以为布局添加任何缺失的约束。选择 `EditText`\
  \ 视图并使用 `Attributes`（属性）工具窗口删除默认的“Name”文本，并将小部件的 ID 改为 `userText`。\n\n返回 `navigation_graph.xml`\
  \ 文件并双击 `secondFragment` 目标将 `fragment_second.xml` 文件加载到布局编辑器，然后选择并删除默认的 `TextView`\
  \ 实例。在 `Component Tree`（组件树）面板中，右键点击 `FrameLayout` 条目并选择 `Convert from FrameLayout\
  \ to ConstraintLayout...`（从 FrameLayout 转换为 ConstraintLayout...）菜单选项，在生成的转换对话框中接受默认设置：\n\
  \n![](img/as_3.2_navigation_convert_framelayout.jpg)\n\n图 41-11\n\n使用 `Attributes`\
  \ 工具窗口将 `ConstraintLayout` 的 ID 更改为 `constraintLayout`。由于片段父管理器已转换为更灵活的 `ConstraintLayout`，拖放一个新的\
  \ `TextView` 小部件，使其位于布局中心，并点击 `Infer constraints` 按钮添加任何缺失的约束。选中新的 `TextView` 后，使用\
  \ `Attributes` 面板将 ID 更改为 `argText`。\n\n## 41.7 向导航图中添加操作\n\n现在两个目的地已添加到图中，并且相应的用户界面布局也已设计完成，项目现在需要一种让用户能够从主片段导航到第二个片段的方法。这将通过向图添加操作（action）来实现，之后可以在应用代码内部引用该操作。\n\
  \n要建立以 `mainFragment` 为起点、`secondFragment` 为目的地的操作连接，打开导航图，并将鼠标指针悬停在 `mainFragment`\
  \ 目标右边缘的垂直中心上，直到出现一个高亮显示的圆，如图 41-12 所示：\n\n![](img/as_4.1_navigation_connection_circle.jpg)\n\
  \n图 41-12\n\n点击圆圈内部并将生成的线条拖到 `secondFragment` 目标：\n\n![](img/as_4.1_navigation_connecting.jpg)\n\
  \n图 41-13\n\n释放线条以建立起点和目的地之间的操作连接，此时线条将变为箭头，如图 41-14 所示：\n\n![](img/as_4.1_navigation_connected.jpg)\n\
  \n图 41-14\n\n操作连接可以随时通过选择操作连接并按下键盘上的 `Delete` 键来删除。选中箭头，检查 `Attributes` 工具窗口中的可用属性并将\
  \ ID 更改为 `mainToSecond`。这是代码中引用该操作的 ID。将编辑器切换到 `Code` 模式，注意该操作已包含在 XML 中：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<navigation xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\"\n    android:id=\"@+id/navigation_graph\"\n \
  \   app:startDestination=\"@id/mainFragment\">\n    <fragment\n        android:id=\"\
  @+id/mainFragment\"\n        android:name=\"com.ebookfrenzy.navigationdemo.ui.main.MainFragment\"\
  \n        android:label=\"main_fragment\"\n        tools:layout=\"@layout/main_fragment\"\
  \ >\n        <action\n            android:id=\"@+id/mainToSecond\"\n           \
  \ app:destination=\"@id/secondFragment\" />\n    </fragment>\n    <fragment\n  \
  \      android:id=\"@+id/secondFragment\"\n        android:name=\"com.ebookfrenzy.navigationdemo.SecondFragment\"\
  \n        android:label=\"fragment_second\"\n        tools:layout=\"@layout/fragment_second\"\
  \ />\n```\n\n## 41.8 实现 OnFragmentInteractionListener\n\n在添加代码触发操作之前，需要修改 `MainActivity`\
  \ 类以实现 `OnFragmentInteractionListener` 接口。该接口是在导航图编辑器中创建空白片段时，在 `SecondFragment`\
  \ 类中生成的。为了符合该接口，活动需要实现一个名为 `onFragmentInteraction()` 的方法，该方法用于实现片段与活动之间的通信。\n\n\
  编辑 `MainActivity.java` 文件并进行如下修改：\n\n```java\nimport android.net.Uri;\n\npublic\
  \ class MainActivity extends AppCompatActivity implements SecondFragment.OnFragmentInteractionListener\
  \ {\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n \
  \       super.onCreate(savedInstanceState);\n        setContentView(R.layout.main_activity);\n\
  \    }\n    @Override\n    public void onFragmentInteraction(Uri uri) {\n    }\n\
  }\n```\n\n如果 Android Studio 报告 `OnFragmentInteraction` 未定义（某些版本会自动添加），请编辑 `SecondFragment.java`\
  \ 并添加它：\n\n```java\nimport android.net.Uri;\n\npublic interface OnFragmentInteraction\
  \ {\n    void onFragmentInteraction(Uri uri);\n}\n```\n\n## 41.9 为片段添加 View Binding\n\
  \n由于我们需要访问布局中的某些视图，需要修改代码以启用视图绑定。首先编辑 `MainFragment.java` 并执行以下操作：\n\n```java\n\
  import com.ebookfrenzy.navigationdemo.databinding.MainFragmentBinding;\n\npublic\
  \ class MainFragment extends Fragment {\n    private MainViewModel mViewModel;\n\
  \    private MainFragmentBinding binding;\n\n    public static MainFragment newInstance()\
  \ {\n        return new MainFragment();\n    }\n    @Nullable\n    @Override\n \
  \   public View onCreateView(@NonNull LayoutInflater inflater, @Nullable ViewGroup\
  \ container, @Nullable Bundle savedInstanceState) {\n        binding = MainFragmentBinding.inflate(inflater,\
  \ container, false);\n        return binding.getRoot();\n    }\n    @Override\n\
  \    public void onDestroyView() {\n        super.onDestroyView();\n        binding\
  \ = null;\n    }\n}\n```\n\n对 `SecondFragment.java` 重复上述步骤，这次引用 `FragmentBinding`。\n\
  \n## 41.10 触发操作\n\n现在操作已添加到导航图中，下一步是在主片段内部添加代码，以便在点击 `Button` 小部件时触发操作。找到 `MainFragment.java`，将其加载到代码编辑器并修改\
  \ `onActivityCreated()` 方法，以获取按钮的引用并配置 `OnClickListener` 实例以便在用户点击按钮时调用：\n\n```java\n\
  import android.widget.Button;\nimport androidx.navigation.Navigation;\n\npublic\
  \ class MainFragment extends Fragment {\n    @Override\n    public void onActivityCreated(@Nullable\
  \ Bundle savedInstanceState) {\n        super.onActivityCreated(savedInstanceState);\n\
  \        mViewModel = new ViewModelProvider(this).get(MainViewModel.class);\n  \
  \      binding.button.setOnClickListener(new View.OnClickListener() {\n        \
  \    @Override\n            public void onClick(View view) {\n                Navigation.findNavController(view).navigate(R.id.mainToSecond);\n\
  \            }\n        });\n    }\n}\n```\n\n\n\n\n上述代码获取了导航器的引用，并在该实例上调用了 `navigate()`\
  \ 方法，将导航动作的资源 ID 作为参数传递。\n\n编译并运行应用，验证点击主片段（fragment）中的按钮会切换到第二个片段。\n\n作为这种设置监听器方法的替代方案，`Navigation`\
  \ 类还包含一个名为 `createNavigateOnClickListener()` 的方法，它提供了一种更高效的方法来设置监听器并导航到目标地。因此，可以使用以下单行代码来启动切换：\n\
  \n```java\nbinding.button.setOnClickListener(Navigation.createNavigateOnClickListener(\n\
  \        R.id.mainToSecond, null));\n```\n\n### 41.11 使用 Safeargs 传递数据\n\n下一个目标是将主\
  \ fragment 中 `EditText` 视图中输入的文本传递到第二个 fragment，并在那里将其显示在 `TextView` 控件上。正如上一章概述的，Android\
  \ Navigation 组件支持两种传递数据的方法。本章将使用类型安全的参数传递。\n\n使用 `safeargs` 的第一步是向 Gradle 构建配置添加\
  \ `safeargs` 插件。使用 Project 工具窗口，找到并编辑项目层级的 `build.gradle` 文件（`Gradle Scripts ->\
  \ `build.gradle (Project: NavigationDemo)`），将插件如下所示添加到依赖中（再次记住，现在可能有更更新的版本可用）：\n\
  \n```gradle\ndependencies {\n    classpath 'com.android.tools.build:gradle:4.2.0-rc01'\n\
  \    classpath \"androidx.navigation:navigation-safe-args-gradle-plugin:2.3.5\"\n\
  }\n```\n\n接下来，编辑应用层级的 `build.gradle` 文件（`Gradle Scripts -> build.gradle (Module:\
  \ App)`），按如下所示应用插件，并在提示时重新同步项目。\n\n```gradle\nplugins {\n    id 'com.android.application'\n\
  \    id 'androidx.navigation.safeargs'\n}\n\nandroid {\n// ...\n```\n\n下一步是定义目标地将接收的任何参数，在本例中，目标是第二个\
  \ fragment。编辑导航图，选择 `secondFragment` 目标并在 Attributes 工具窗口中找到 `Arguments` 部分。点击 `+`\
  \ 按钮（在 图 41-15 中高亮）以向目标添加新参数：\n\n![](img/as_3.6_nav_graph_add_argument.jpg)\n图 41-15\n\
  \n点击 `+` 按钮后会弹出一个对话框，需要在其中输入参数名称、类型和默认值。将参数命名为 `message`，类型设置为 `String`，并在默认值字段输入\
  \ `No Message`：\n\n![](img/as_3.6_nav_graph_add_argument_dialog.jpg)\n图 41-16\n\n\
  新配置的参数将如下出现在 `navigation_graph.xml` 文件的 `secondFragment` 元素中：\n\n```xml\n<fragment\n\
  \    android:id=\"@+id/secondFragment\"\n    android:name=\"com.ebookfrenzy.navigationdemo.SecondFragment\"\
  \n    android:label=\"fragment_second\"\n    tools:layout=\"@layout/fragment_second\"\
  \ >\n    <argument\n        android:name=\"message\"\n        app:argType=\"string\"\
  \ />\n        android:defaultValue=\"No Message\"\n</fragment>\n```\n\n下一步是在 `MainFragment.java`\
  \ 文件中添加代码，从 `EditText` 视图中提取文本并在导航期间将其传递给第二个 fragment。这将涉及使用由 `safeargs` 插件自动生成的某些特殊导航类。目前导航涉及\
  \ `MainFragment` 类、`SecondFragment` 类、一个名为 `mainToSecond` 的导航动作以及名为 `message` 的参数。\n\
  \n当构建项目时，`safeargs` 插件将生成以下额外的类，这些可以在导航期间传递和接收参数：\n\n- `MainFragmentDirections`\
  \ - 此类表示导航动作的起点（使用导航源的类名并在末尾附加“Directions”进行命名），并提供对动作对象的访问。\n- `ActionMainToSecond`\
  \ - 表示执行切换的动作的类（根据导航图文件中分配给动作的 ID 命名，前缀为“Action”）。该类为目标上配置的每个参数都包含一个 setter 方法。例如，由于第二个\
  \ fragment 目标包含一个名为 `message` 的参数，该类包含一个名为 `setMessage()` 的方法。一旦配置完成，该类的实例将被传递给导航器的\
  \ `navigate()` 方法以导航到目标地。\n- `SecondFragmentArgs` - 在目标片段中用于访问从源传递的参数的类（使用导航目标的类名并在末尾附加“Args”进行命名）。该类包含每个传递给目标的参数的\
  \ getter 方法。\n\n当构建项目时，`safeargs` 插件将生成以下额外的类……（见上方列表）。\n\n使用这些类，可以修改 `MainFragment`\
  \ `onViewCreated()` 方法中的 `onClick` 代码，以从 `EditText` 提取文本，将其应用于动作并启动到第二个 fragment\
  \ 的切换：\n\n```java\nbinding.button.setOnClickListener(new View.OnClickListener()\
  \ {\n    @Override\n    public void onClick(View view) {\n        MainFragmentDirections\
  \ action = MainFragmentDirections.mainToSecond();\n        action.setMessage(binding.userText.getText().toString());\n\
  \        Navigation.findNavController(view).navigate(action);\n    }\n});\n```\n\
  （注：此处原文代码块结束处有括号闭合错误，翻译时已根据逻辑进行了微调）\n\n上述代码获取了动作对象的引用，使用 `setMessage()` 方法设置消息，然后调用导航器的切换。如果\
  \ Android Studio 报告 `MainFragmentDirections` 未定义，请使用 `Build -> Make Project` 重新构建项目。\n\
  \n最后是修改 `SecondFragment.java` 在执行导航后接收参数并显示在 `TextView` 控件上。对于此示例，实现这些任务的代码将使用 `onStart()`\
  \ 生命周期方法。编辑 `SecondFragment.java` 文件并添加该方法如下：\n\n```java\n@Override\npublic void\
  \ onStart() {\n    super.onStart();\n    SecondFragmentArgs args = SecondFragmentArgs.fromBundle(getArguments());\n\
  \    String message = args.getMessage();\n    binding.argText.setText(message);\n\
  }\n```\n\n上述方法的代码首先获取 `TextView` 控件的引用。接下来，调用 `SecondFragmentArgs` 类的 `fromBundle()`\
  \ 方法提取从源传递的 `SecondFragmentArgs` 对象。由于参数在 `navigation_graph.xml` 文件中命名为 `message`，因此在\
  \ `args` 对象上调用相应的 `getMessage()` 方法来获取字符串值。然后显示该字符串。\n\n编译并运行应用并在点击 `Button` 控件之前输入一些文本。当第二个片段目标出现时，`TextView`\
  \ 现在应该显示主 fragment 中输入的文本，表明数据已成功在导航目标之间传递。\n\n### 41.12 总结\n\n本章提供了如何使用 Navigation\
  \ Architecture Component 以及 Android Studio 导航图编辑器实现 Android 应用导航的实用示例。涵盖的主题包括创建包含现有和新目标片段的导航图、在活动布局中嵌入导航宿主片段、编写触发导航事件的代码，以及使用\
  \ Gradle `safeargs` 插件在目标之间传递参数。\n\n### 42. MotionLayout 简介\n\n\n\n\n\n`MotionLayout`\
  \ 类提供了一种简单的方法，为用户界面布局中的视图添加动画效果。本章首先概述 `MotionLayout`，并介绍 `MotionScenes`（运动场景）、`Transitions`（过渡）和\
  \ `Keyframes`（关键帧）的概念。在介绍这些基础之后，接下来的两章（标题分别为“Android MotionLayout 教程”和“MotionLayout\
  \ KeyCycle 教程”）将通过创建示例项目，提供 `MotionLayout` 动画的更多细节和示例。\n\n## 42.1 MotionLayout 概述\n\
  \n`MotionLayout` 是一种布局容器，其主要目的是实现布局内视图从一个状态到另一个状态过渡动画。例如，`MotionLayout` 可以在指定的时间内让\
  \ `ImageView` 实例从屏幕的左上角移动到右下角。除了视图的位置，其他属性的变化也可以进行动画处理，例如颜色、大小或旋转角度。这些状态变化还可以进行插值（使得视图在整个动画过程中能够移动、旋转并改变大小）。\n\
  \n使用 `MotionLayout` 视图的运动可以在两点之间沿直线执行，也可以实现为遵循由起点和终点之间不同位置中间点组成的路径。`MotionLayout`\
  \ 还支持使用触摸和滑动来启动和控制动画。\n\n`MotionLayout` 动画完全在 XML 中声明，通常不需要编写任何代码。这些 XML 声明可以在 Android\
  \ Studio 代码编辑器中手动实现，也可以使用 `MotionLayout` 编辑器进行视觉化实现，或者结合使用两种方法。\n\n## 42.2 MotionLayout\n\
  \n在实现动画时，必须首先将用户界面中通常使用的 `ConstraintLayout` 容器转换为 `MotionLayout` 实例（此任务可以通过在布局编辑器中右键点击\
  \ `ConstraintLayout` 并选择 `Convert to MotionLayout` 选项来实现）。`MotionLayout` 还需要至少 2.0.0\
  \ 版本的 `ConstraintLayout` 库。\n\n意乎不用说，由于它是 `ConstraintLayout` 的子类，`MotionLayout`\
  \ 支持 `ConstraintLayout` 的所有布局功能。因此，当使用 `MotionLayout` 为任何不需要动画的视图设计用户界面布局时，其设计方法与之完全相同。\n\
  \n对于需要制作动画的视图，需要声明两个 `ConstraintSets`，分别定义视图在动画开始和结束时的外观和位置。`transition` 声明定义了关键帧，用于在起始和结束状态之间对目标视图应用额外效果，并带有用于启动和控制动画的点击和滑动处理器。\n\
  \n开始和结束的 `ConstraintSets` 以及过渡都声明在一个 `MotionScene` XML 文件中。\n\n## 42.3 MotionScene\n\
  \n正如我们在前面的章节中看到的，XML 布局文件包含了配置呈现给用户的静态视图的外观和布局行为所必需的信息，在使用 `MotionLayout` 时情况依然如此。对于非静态视图（换句话说，制作动画的视图），这些视图仍然声明在布局文件中，但与这些视图相关的开始、结束和过渡声明存储在一个单独的\
  \ XML 文件中，称为 `MotionScene` 文件（之所以这样命名，是因为所有声明都定义在 `MotionScene` 元素内）。该文件被导入到布局 XML\
  \ 文件中，包含了开始和结束的 `ConstraintSets` 以及 `Transition` 声明（文件可以包含多个 `ConstraintSet` 对和过渡声明，允许将不同的动画作用于用户界面布局中的特定视图）。\n\
  \n以下列表显示了 `MotionScene` 文件的模板：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<MotionScene\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:motion=\"http://schemas.android.com/apk/res-auto\">\n    <Transition\n\
  \        motion:constraintSetEnd=\"@+id/end\"\n        motion:constraintSetStart=\"\
  @id/start\"\n        motion:duration=\"1000\">\n        <KeyFrameSet>\n        </KeyFrameSet>\n\
  \    </Transition>\n    <ConstraintSet android:id=\"@+id/start\">\n    </ConstraintSet>\n\
  \    <ConstraintSet android:id=\"@+id/end\">\n    </ConstraintSet>\n</MotionScene>\n\
  ```\n\n在上面的 XML 中，声明了命名为 `start` 和 `end` 的 `ConstraintSets`（尽管可以使用任何名称），此时它们尚未包含任何约束元素。`Transition`\
  \ 元素定义了这些 `ConstraintSets` 代表动画的开始和结束点，并包含一个空的 `KeyFrameSet` 元素，准备填充额外的动画关键帧项。`Transition`\
  \ 元素还包含一个毫秒持续时间属性，用于控制动画的运行时间。\n\n`ConstraintSets` 不一定意味着视图的运动。例如，可以让开始和结束集合声明屏幕上的相同位置，然后使用过渡对其他属性变化（如比例和旋转角度）进行动画。\n\
  \n## 42.4 配置 ConstraintSets\n\n`MotionScene` 文件中的 `ConstraintSets` 允许将全套 `ConstraintLayout`\
  \ 设置应用于视图的定位、大小调整以及与父视图和其他视图的关系。此外，在 `ConstraintSet` 声明中还可以包含以下属性：\n\n- `alpha`\n\
  - `visibility`\n- `elevation`\n- `rotation`\n- `rotationX`\n- `rotationY`\n- `translationX`\n\
  - `translationY`\n- `translationZ`\n- `scaleX`\n- `scaleY`\n\n例如，为了在动画期间旋转视图 180\
  \ 度，可以在开始和结束处声明如下：\n\n```xml\n<ConstraintSet android:id=\"@+id/start\">\n    <Constraint\n\
  \        motion:layout_constraintStart_toStartOf=\"parent\"\n        rotation=\"\
  0\" />\n</ConstraintSet>\n<ConstraintSet android:id=\"@+id/end\">\n    <Constraint\n\
  \        motion:layout_constraintBottom_toBottomOf=\"parent\"\n        rotation=\"\
  180\" />\n</ConstraintSet>\n```\n\n上述更改告诉 `MotionLayout` 视图从 0° 开始，然后在动画过程中倒过来。\n\
  \n## 42.5 自定义属性\n\n除了上述列出的标准属性外，还可以指定一系列自定义属性（使用 `CustomAttribute` 声明）。事实上，该视图类型上可用的几乎任何属性都可以作为自定义属性包含在动画中。要识别属性名称，请从目标视图类的文档查找\
  \ getter/setter 名称，删除 `get`/`set` 前缀并将剩余第一个字母转换为小写。例如，在代码中更改 `Button` 视图的背景颜色，我们可能会调用\
  \ `setBackgroundColor()` 设置方法：\n\n```java\nmyButton.setBackgroundColor(Color.RED)\n\
  ```\n\n在约束或关键帧设置设置属性时，属性名称将为 `backgroundColor`。除了属性名称，还必须使用以下列表中的相应类型声明值：\n\n- `motion:customBoolean`\
  \ - 布尔属性值。\n- `motion:customColorValue` - 颜色属性值。\n- `motion:customDimension` - 维度属性值。\n\
  - `motion:customFloatValue` - 浮点属性值。\n- `motion:customIntegerValue` - 整数属性值。\n-\
  \ `motion:customStringValue` - 字符串属性值。\n\n例如，颜色设置需要使用 `customColorValue` 类型分配：\n\
  \n```xml\n<CustomAttribute\n    motion:attributeName=\"backgroundColor\"\n    motion:customColorValue=\"\
  #43CC76\" />\n```\n\n以下 `MotionScene` 文件的片段例如，在声明视图的开始和结束约束之外，还将背景颜色从绿色变为红色：\n\n\
  .\n.\n\n\n\n\n\n```xml\n<ConstraintSet android:id=\"@+id/start\">\n    <Constraint\n\
  \        android:layout_width=\"wrap_content\"\n        android:layout_height=\"\
  wrap_content\"\n        motion:layout_editor_absoluteX=\"21dp\"\n        android:id=\"\
  @+id/button\"\n        motion:layout_constraintTop_toTopOf=\"parent\"\n        motion:layout_constraintStart_toStartOf=\"\
  parent\" >\n        <CustomAttribute\n            motion:attributeName=\"backgroundColor\"\
  \n            motion:customColorValue=\"#33CC33\" />\n    </Constraint>\n</ConstraintSet>\n\
  <ConstraintSet android:id=\"@+id/end\">\n    <Constraint\n        android:layout_width=\"\
  wrap_content\"\n        android:layout_height=\"wrap_content\"\n        motion:layout_editor_absoluteY=\"\
  21dp\"\n        android:id=\"@+id/button\"\n        motion:layout_constraintEnd_toEndOf=\"\
  parent\"\n        motion:layout_constraintBottom_toBottomOf=\"parent\" >\n     \
  \   <CustomAttribute\n            motion:attributeName=\"backgroundColor\"\n   \
  \         motion:customColorValue=\"#F80A1F\" />\n    </Constraint>\n</ConstraintSet>\n\
  ```\n\n## 42.6 触发动画\n\n如果没有某种形式的事件告诉 `MotionLayout` 开始动画，则 `MotionScene` 文件中的任何设置都不会对布局产生任何影响（视图将根据起始\
  \ `ConstraintSet` 中的设置进行定位除外）。\n\n动画可以配置为通过响应屏幕点击（`OnClick`）或滑动手势（`OnSwipe`）来启动。`OnClick`\
  \ 处理器会使动画开始并运行到完成，而 `OnSwipe` 则将同步动画，使其沿着时间轴往复移动，以匹配触控动作。`OnSwipe` 处理器还会响应屏幕上的“飞掷”（flinging）动作。`OnSwipe`\
  \ 处理器还提供了配置选项，用于设置动画如何对不同方向的拖拽做出反应，以及滑动锚定的目标视图的哪一侧。这允许例如向左的运动使视图向相应方向移动，同时防止向上运动导致视图向侧面移动（除非这正是需要的行为）。\n\
  \n`OnSwipe` 和 `OnClick` 声明包含在 `MotionScene` 文件的 `Transition` 元素中。在这两种情况下，都必须指定视图\
  \ ID。例如，为了实现一个响应于锚定在名为 `button` 的视图底部的向下拖拽的 `OnSwipe` 处理器，可以将以下 XML 放置在 `Transition`\
  \ 元素中：\n\n```xml\n<Transition\n    motion:constraintSetEnd=\"@+id/end\"\n    motion:constraintSetStart=\"\
  @id/start\"\n    motion:duration=\"1000\">\n    <KeyFrameSet>\n    </KeyFrameSet>\n\
  \    <OnSwipe\n    motion:touchAnchorId=\"@+id/button\"\n    motion:dragDirection=\"\
  dragDown\"\n    motion:touchAnchorSide=\"bottom\" />\n</Transition>\n```\n\n或者，为同一个按钮添加\
  \ `OnClick` 处理器：\n\n```xml\n<OnClick motion:targetId=\"@+id/button\" clickAction=\"\
  toggle\" />\n```\n\n在上面的示例中，动作已设置为 `toggle` 模式，其他可用选项总结如下：\n\n- `toggle`：动画化切换到相反状态。例如，如果视图当前处于过渡点，它将过渡到结束点，反之亦然。\n\
  - `jumpToStart`：立即更改到起始状态，不进行动画。\n- `jumpToEnd`：立即更改到结束状态，不进行动画。\n- `transitionToStart`：带有动画过渡到起始状态。\n\
  - `transitionToEnd`：带有动画过渡到结束状态。\n\n## 42.7 弧线运动\n\n默认情况下，视图位置的移动将在起始点和结束点之间直线直线。要将运动更改为弧形路径，只需在起始约束中如下所示使用\
  \ `pathMotionArc` 属性，并配置 `startHorizontal` 或 `startVertical` 来定义弧形是凹的还是凸的：\n\n```xml\n\
  <ConstraintSet android:id=\"@+id/start\">\n    <Constraint\n        android:layout_width=\"\
  wrap_content\"\n        android:layout_height=\"wrap_content\"\n        motion:layout_editor_absoluteX=\"\
  21dp\"\n        android:id=\"@+id/button\"\n        motion:layout_constraintTop_toTopOf=\"\
  parent\"\n        motion:layout_constraintStart_toStartOf=\"parent\"\n        motion:pathMotionArc=\"\
  startVertical\" >\n```\n\n图 42-1 展示了 `startVertical` 和 `startHorizontal` 弧线与默认直线的对比\n\
  \n图 42-1\n\n## 42.8 关键帧\n\n到为止概述的所有 `ConstraintSet` 属性仅适用于动画的起始和结束点。换句话说，如果将结束点的\
  \ `rotation` 属性设置为 180°，旋转将在动画开始时开始并在到达结束点时完成。因此，无法配置旋转在动画进行 50% 处达到完全 180°，然后在动画结束时旋转回原始方向。幸运的是，这种效果可以使用关键帧（Keyframes）实现。\n\
  \n关键帧用于定义动画过程期间发生状态变化的中间点。例如，可以声明关键帧，使得视图的背景颜色在动画进行到 50% 处过渡到蓝色，在 75% 处变为绿色，然后在动画结束时回到原始颜色。关键帧实现在\
  \ `MotionScene` 文件的 `Transition` 元素中，嵌入到 `KeyFrameSet` 元素中。\n\n`MotionLayout` 支持几种类型的关键帧，总结如下：\n\
  \n### 42.8.1 属性关键帧\n\n属性关键帧（使用 `KeyAttribute` ）允许在动画时间轴上的中间点更改视图属性。`KeyAttribute`\
  \ 支持上述 `ConstraintSets` 列出的相同属性，并能够指定更改在动画时间轴上何时生效。例如，以下关键帧声明将使按钮在水平（`scaleX`）和垂直（`scaleY`）方向上尺寸增加，并在时间线的\
  \ 50% 处达到完全尺寸。在时间线的剩余时间内，视图将缩小到原始尺寸：\n\n```xml\n<Transition\n    motion:constraintSetEnd=\"\
  @+id/end\"\n    motion:constraintSetStart=\"@id/start\"\n    motion:duration=\"\
  1000\">\n    <KeyFrameSet>\n        <KeyAttribute\n            motion:motionTarget=\"\
  @+id/button\"\n            motion:framePosition=\"50\"\n            android:scaleX=\"\
  2.0\" />\n        <KeyAttribute\n            motion:motionTarget=\"@+id/button\"\
  \n            motion:framePosition=\"50\"\n            android:scaleY=\"2.0\" />\n\
  \    </KeyFrameSet>\n```\n\n### 42.8.2 位置关键帧\n\n位置关键帧（`KeyPosition` ）用于修改视图在起始位置和结束位置之间移动时遵循的路径。通过在时间轴上的不同点放置关键位置，可以为动画应用几乎任何复杂程度的路径。使用\
  \ `x` 和 `y` 坐标结合过渡时间线的相应点进行声明。这些坐标必须相对于以下一种坐标系进行声明：\n\n- `parentRelative`：`x` 和\
  \ `y` 坐标相对于父容器，以百分比指定（表示为 0.0 到 1.0 之间的值）：\n\n![](img/motionlayout_parentRelative.jpg)\n\
  \n图 42-2\n\n- `deltaRelative`：`x` 和 `y` 坐标不是相对于父容器，而是相对于起始和结束位置。例如，起点为 (0, 0)，结束点为\
  \ (1, 1)。请记住 `x` 和 `y` 坐标可以是负值：\n\n![](img/motionlayout_deltaRelative.jpg)\n\n图\
  \ 42-3\n\n\n\n\n\n-   `pathRelative` - `x` 和 `y` 坐标相对于路径，其中起点和终点之间的直线作为图表的 `X` 轴。再次，坐标以百分比（0.0\
  \ 到 1.0）的形式表示。这与 `deltaRelative` 坐标空间相似，但它考虑了路径的角度。再次，坐标也可能为负值：\n\n![](img/motionlayout_pathRelative.jpg)\n\
  图 42-4\n\n例如，下面的 `ConstraintSets` 在设备屏幕的侧边声明了起点和终点。默认情况下，使用这些点的视图过渡将跨越屏幕沿直线移动，如\
  \ 图 42-5 所示：\n\n![](img/motionlayout_straight_path.jpg)\n图 42-5\n\n但是，如果要求视图遵循类似于下图中\
  \ 图 42-6 所示的路径：\n\n![](img/motionlayout_wave_path.jpg)\n图 42-6\n\n为了实现这一点，可以在过渡中按如下方式声明关键帧位置点：\n\
  \n```xml\n<KeyPosition\n    motion:motionTarget=\"@+id/button\"\n    motion:framePosition=\"\
  25\"\n    motion:keyPositionType=\"pathRelative\"\n    motion:percentY=\"0.3\"\n\
  \    motion:percentX=\"0.25\"/>\n\n<KeyPosition\n    motion:motionTarget=\"@+id/button\"\
  \n    motion:framePosition=\"75\"\n    motion:keyPositionType=\"pathRelative\"\n\
  \    motion:percentY=\"-0.3\"\n    motion:percentX=\"0.75\"/>\n```\n\n上述元素使用 `pathRelative`\
  \ 坐标系在路径的 25% 和 75% 处创建了关键帧位置点。第一个位置放置在坐标 (0.25, 0.3)，第二个位置位于 (0.75, -0.3)。这些位置关键帧可以可视化，如下方的\
  \ 图 42-7 所示：\n\n![](img/motionlayout_curve_path.jpg)\n图 42-7\n\n### 42.9 时间线性\n\n\
  在没有任何额外设置的情况下，上述动画将以恒定速度执行。要更改动画的速度（例如，使其加速和减速），可以在 `ConstraintSet` 或 `Keyframe`\
  \ 中使用过渡缓动属性（`transitionEasing`）。\n\n对于复杂的缓动需求，可以通过在三次贝塞尔 曲线上绘制点来定义线性度，例如：\n\n```xml\n\
  motion:layout_constraintBottom_toBottomOf=\"parent\"\nmotion:transitionEasing=\"\
  cubic(0.2, 0.7, 0.3, 1)\"\nandroid:rotation=\"360\">\n```\n\n如果你不熟悉贝塞尔 曲线，可以考虑使用以下\
  \ URL 上的在线曲线生成器：\n[`cubic-bezier.com/`](https://cubic-bezier.com/)\n\n但是，对于大多数需求，可以使用内置的标准\
  \ `accelerate`（加速）和 `decelerate`（减速）值来指定缓动：\n\n```xml\nmotion:layout_constraintBottom_toBottomOf=\"\
  parent\"\nmotion:transitionEasing=\"decelerate\"\nandroid:rotation=\"360\">\n```\n\
  \n## 42.10 KeyTrigger\n\n触发关键帧（`KeyTrigger`）允许在动画到达动画时间轴内的指定帧位置时，调用视图上的方法。这同样考虑了动画的方向。例如，可以根据动画是正向运行还是反向运行调用不同的方法。考虑一个按钮，当动画移动超过时间轴的\
  \ 20% 时将其设为可见。`KeyTrigger` 将在 `Transition` 元素的 `KeyFrameSet` 中通过 `onPositiveCross`\
  \ 属性如下所示实现：\n\n```xml\n<KeyFrameSet>\n    <KeyTrigger\n        motion:framePosition=\"\
  20\"\n        motion:onPositiveCross=\"show\"\n        motion:motionTarget=\"@id/button\"\
  />\n```\n\n同样，如果要在动画反向运行并落到 10% 以下时隐藏同一个按钮，可以使用 `onNegativeCross` 属性添加第二个关键触发器：\n\
  \n```xml\n<KeyTrigger\n    motion:framePosition=\"0\"\n    motion:onNegativeCross=\"\
  show\"\n    motion:motionTarget=\"@id/button\"/>\n```\n\n如果动画使用 `toggle` 动作，只需使用\
  \ `onCross` 属性即可：\n\n```xml\n<KeyTrigger\n    motion:framePosition=\"20\"\n    motion:onCross=\"\
  show\"\n    motion:motionTarget=\"@id/button\"/>\n```\n\n### 42.11 Cycle 和 Time\
  \ 关键帧\n\n虽然位置关键帧可以用于向动画添加中间变化，但如果需要实现大量的重复变化，这很快就会变得非常繁琐。对于需要重复执行可预测状态更改的情况，`MotionLayout`\
  \ 包含了 `Cycle`（循环）和 `Time`（时间）关键帧，该主题将在 MotionLayout 教程 章节中详细介绍。\n\n### 42.2 从代码启动动画\n\
  \n到本章为止，我们只查看了如何使用 `OnSwipe` 和 `OnClick` 处理程序来控制动画。也可以通过调用 `MotionLayout` 实例的方法从代码启动动画。例如，下面的代码运行持续时间为\
  \ 2000ms 的从开始到结束的过渡，针对 `motionLayout` 布局：\n\n```java\nmotionLayout.setTransitionDuration(2000);\n\
  motionLayout.transitionToEnd();\n```\n\n\n\n\n\n在 `Name` 字段中输入 `MotionLayoutDemo`，并将\
  \ `com.ebookfrenzy.motionlayoutdemo` 指定为包名。点击 `Finish` 按钮之前，将 `Minimum API level`\
  \ 设置更改为 `API 26: Android 8.0 (Oreo)`，并将 `Language` 菜单更改为 `Java`。\n\n## 43.2 将 ConstraintLayout\
  \ 转换为 MotionLayout\n\n如往常，Android Studio 会在 `activity_main.xml` 布局文件中放置一个 `ConstraintLayout`\
  \ 容器作为父视图。下一步是将该容器转换为 `MotionLayout` 实例。在 `Component Tree`（组件树）中，右键点击 `ConstraintLayout`\
  \ 条目并选择 `Convert to MotionLayout` 菜单选项：\n\n![](img/as_4.0_motionlayout_conversion.jpg)\n\
  \n图 43-1\n\n选择后，点击确认对话框中的 `Convert` 按钮。一旦转换完成，`MotionLayout` 编辑器将出现在 Android Studio\
  \ 主窗口中，如  [图 43-2 所示：\n\n![](img/as_4.0_motionlayout_editor.jpg)\n\n图 43-2\n\n作为转换过程的一部分，Android\
  \ Studio 还会创建一个名为 `res -> xml` 的新文件夹，并在其中放置名为 `activity_main_scene.xml` 的 `MotionLayout`\
  \ 场景文件：\n\n![](img/as_4.0_motionlayout_scene_file.jpg)\n\n图 43-3\n\n该文件由一个顶层 `MotionScene`\
  \ 元素组成，包含 `ConstraintSet` 和 `Transition` 条目，它们定义了在主布局中执行的动画。默认情况下，该文件将包含起始和结束约束集的空元素以及初始过渡：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<MotionScene\n    xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:motion=\"http://schemas.android.com/apk/res-auto\"\
  >\n    <Transition\n        motion:constraintSetEnd=\"@+id/end\"\n        motion:constraintSetStart=\"\
  @id/start\"\n        motion:duration=\"1000\">\n        <KeyFrameSet>\n        </KeyFrameSet>\n\
  \    </Transition>\n    <ConstraintSet android:id=\"@+id/start\">\n        </ConstraintSet>\n\
  \    <ConstraintSet android:id=\"@+id/end\">\n        </ConstraintSet>\n</MotionScene>\n\
  ```\n\n在 `MotionLayout` 编辑器中进行的任何更改都将存储在此文件中。同样，也可以直接编辑此文件，以便在 `MotionLayout` 编辑器之外实现和修改动画设置。在本教程中，动画将主要通过\
  \ `MotionLayout` 编辑器界面来实现。然而，在每个阶段，我们都会花时间查看这些更改是如何反映在底层的 `MotionScene` 文件中的。随着章节的进行，你会发现\
  \ `MotionScene` XML 语法实际上非常简单且易于学习。\n\n本教程的第一阶段将演示如何使用 `MotionLayout` 对 `Button`\
  \ 对象制作动画，包括运动（包括跟随路径）、旋转和尺寸缩放。\n\n## 43.3 配置起始和结束约束\n\n当 `activity_main.xml` 文件加载到\
  \ `MotionLayout` 编辑器后，请确保已选中 `Motion Layout` 框框（见下方的  [图 43-5 ] 中标记为 E），然后在从调色板拖放\
  \ `Button` 视图到布局画布的左上角之前，删除默认的 `TextView`，如  [图 43-4 ] 所示：\n\n![](img/as_4.1_motion_layout_button_added.jpg)\n\
  \n图 43-4\n\n选中按钮后，使用 `Attributes`（属性）工具窗口将 `id` 更改为 `myButton`。\n\n正如上一章所述，`MotionLayout`\
  \ 动画主要是指定视图如何在两个状态之间切换的用例。因此，实现动画的第一步是指定定义这些状态的约束。对于此示例，起点将是布局视图的顶部中央。要配置这些约束，请在编辑器窗口中选择\
  \ `start` 约束集条目（见下方的  [图 43-5 ] 中标记为 A）：\n\n![](img/as_4.0_motionlayout_editor_start_labeled.jpg)\n\
  \n图 43-5\n\n当选中起始框时，所有的约束和布局更改都将应用于起始点约束集。要返回到整个布局的标准约束和属性，请点击 `Motion Layout` 框\
  \ (E)。\n\n接下来，在 `ConstraintSet` 列表中选择 `myButton` 条目 (B)。注意，`Source`（源）列显示按钮是根据布局文件中的约束定位的。相反，我们希望按钮根据\
  \ `start` 约束集进行定位。在 `myButton` 条目仍被选中的情况下，点击 `Edit` 按钮 (C) 并从菜单中选择 `Create Constraint`（创建约束），按钮条目将指示该视图将根据\
  \ `start` 约束集进行定位：\n\n![](img/as_4.0_motionlayout_editor_start_set.jpg)\n\n图 43-6\n\
  \n起始约束集需要将按钮置在布局顶部，并带有 `8dp` 的偏移且居中。在 `myButton` 仍被选中的情况下，使用 `Attributes` 窗口设置 `top`（顶部）和两侧的约束，设置如下：\n\
  \n![](img/as_4.0_motionlayout_editor_start_set.jpg)\n\n图 43-7\n\n选择 `end` 约束集（见下方的\
  \  [图 43-5 ] 中标记为 D），并重复步骤创建一个新约束，这次将按钮放置在布局的中央，距离底部边缘有 `8dp` 的偏移：\n\n![](img/as_4.0_motionlayout_editor_start_set.jpg)\n\
  \n图 43-8\n\n配置好 `start` 和 `end` 约束后，打开 `activity_main_scene.xml` 文件，注意约束已添加，如下所示代码所示：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<MotionScene\n    xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:motion=\"http://schemas.android.com/apk/res-auto\"\
  >\n    <ConstraintSet android:id=\"@+id/start\">\n        <Constraint\n        \
  \    android:id=\"@+id/myButton\"\n            android:layout_width=\"wrap_content\"\
  \n            android:layout_height=\"wrap_content\"\n            android:layout_marginTop=\"\
  8dp\"\n            motion:layout_constraintLeft_toStartOf=\"parent\"\n         \
  \   motion:layout_constraintRight_toEndOf=\"parent\"\n            motion:layout_constraintTop_toTopOf=\"\
  parent\" />\n    </ConstraintSet>\n    <ConstraintSet android:id=\"@+id/end\">\n\
  \        <Constraint\n            android:id=\"@+id/myButton\"\n            android:layout_width=\"\
  wrap_content\"\n            android:layout_height=\"wrap_content\"\n           \
  \ android:layout_marginBottom=\"8dp\"\n            motion:layout_constraintBottom_toBottomOf=\"\
  parent\"\n            motion:layout_constraintLeft_toStartOf=\"parent\"\n      \
  \      motion:layout_constraintRight_toEndOf=\"parent\"\n            motion:layout_editorY=\"\
  6dp\" />\n    </ConstraintSet>\n```\n\n此外注意，`Transition` 元素已预配置为在 1000 毫秒内动画起始和结束点之间的过渡。虽然我们还没有添加触发过渡的动作，但仍然可以在\
  \ `MotionLayout` 编辑器中预览动画。\n\n## 43.4 预览 MotionLayout 动画\n\n为了在不构建和运行应用的情况下预览动画，请选择\
  \ `MotionLayout` 编辑器中的过渡箭头，见下方的  [图 43-9 ] 中标记为 A。这将显示动画时间轴面板（标记为 B）：\n\n![](img/as_4.0_motionlayout_labeled_timeline.jpg)\n\
  \n图 43-9\n\n要测试动画，点击滑块 (C) 并沿时间轴拖动。随着滑块移动，布局画布上的按钮将沿着虚线路径 (D) 移动。使用工具栏按钮 (E) 执行完整动画，或以不同的速度持续重复动画（正向、反向或往复）。\n\
  \n## 43.5 添加点击手势\n\n\n\n\n\n虽然已经创建了一个简单的 MotionLayout 动画过渡，但我们仍然需要一种在运行中的 App 启动动画的方法。这可以通过分配点击或滑动处理程序来实现。在本示例中，我们将配置动画在用户点击按钮时启动。在\
  \ MotionLayout 编辑器中，如果时间轴动画正在循环运行，首先将其暂停。接下来，选择过渡箭头（如上方图 43-9 中标记的 A），在属性（Attributes）工具窗口找到\
  \ `OnClick` 属性部分，并点击下方图 43-10 中箭头所示的 `+` 按钮：\n\n![](img/as_4.0_motionlayout_onclick_add.jpg)\n\
  Figure 43-10\n\n`OnClick` 面板将出现一个第一个属性的空行。对于属性名称，输入 `targetId`，在值字段中输入按钮的 ID（`@id/myButton`）。再次点击\
  \ `+` 按钮，这次在属性名称字段中输入 `app:clickAction`。在值字段中，点击向下箭头显示有效选项的菜单：\n\n![](img/as_4.0_motionlayout_onclick_actions.jpg)\n\
  Figure 43-11\n\n在本示例中，选择切换动作（toggle action）。这将导致视图在被点击时动画到相反的位置。一旦输入了这些设置，它们应该与图\
  \ 43-12 中所示的内容匹配：\n\n![](img/as_4.0_motionlayout_onclick_added.jpg)\nFigure 43-12\n\
  \n再次打开 `activity_main_scene.xml` 文件并检查在 `Transition` 条目中定义的 `OnClick` 属性：\n\n```xml\n\
  <Transition\n    motion:constraintSetEnd=\"@+id/end\"\n    motion:constraintSetStart=\"\
  @id/start\"\n    motion:duration=\"1000\">\n    <KeyFrameSet>\n    </KeyFrameSet>\n\
  \    <OnClick motion:targetId=\"@id/myButton\"\n          motion:clickAction=\"\
  toggle\" />\n</Transition>\n```\n\n在设备或模拟器上编译并运行 App，确认点击按钮会导致它在 MotionScene 文件定义的起始点和结束点之间来回切换。\n\
  \n## 43.6 向过渡中添加属性关键帧\n\n到目前为止，示例项目仅演示了按钮视图从屏幕上一个位置到另一个位置的运动。属性关键帧（`KeyAttribute`）提供了一种方法，用于指定过渡时间轴内的点，使其他属性更改生效。例如，可以定义\
  \ `KeyAttribute`，使得当视图移动到时间轴的 30% 处时，视图尺寸必须增加了 50%。在本示例中，我们将在动画的中点添加一个旋转效果。\n\n\
  首先，在 MotionLayout 编辑器中打开 `activity_main.xml` 文件，选择过渡连接器箭头以显示时间轴，然后点击图 43-13 中高亮的按钮：\n\
  \n![](img/as_4.0_motionlayout_timeline_add_key_button.jpg)\nFigure 43-13\n\n从菜单中，选择\
  \ `KeyAttribute` 选项：\n\n![](img/as_4.0_motionlayout_timeline_add_key_attribute_menu.jpg)\n\
  Figure 43-14\n\n选中后，将出现如图 43-15 所示的对话框。在对话框中，确保选中了 ID 选项并引用了 `myButton`。在位置字段中输入\
  \ 50（这是以百分比表示的，0 为起点，100 为终点）。最后，在属性下拉菜单中选择旋转（rotation）项，然后点击 `Add` 按钮：\n\n![](img/as_4.0_motionlayout_timeline_key_attr_dialog.jpg)\n\
  Figure 43-15\n\n添加 `KeyAttribute` 后，时间轴内会出现一个一个该属性的行。点击该行将其高亮，然后点击行最左侧边缘的折叠箭头以展开属性过渡图。注意，时间轴上会出现一个微小的菱形标记（如下方图\
  \ 43-16 所示），表示关键帧的位置。图表表示效果的线性度。在这种情况下，按钮将稳定地旋转到指定的度数，并在关键帧位置达到最大旋转。当按钮到达终点时，它将旋转回\
  \ 0 度：\n\n![](img/as_4.0_motionlayout_timeline_graph.jpg)\nFigure 43-16\n\n要更改 `KeyAttribute`\
  \ 的属性，在时间轴上选中它，然后参考属性工具窗口。在 `KeyAttribute` 面板中，将 `rotation` 属性更改为 360 度：\n\n![](img/as_4.0_motionlayout_timeline_key_attr_angle.jpg)\n\
  Figure 43-17\n\n通过来移动滑块并观察按钮在遍历动画过程中的旋转来检查该属性是否正常工作。参考 `activity_main_scene.xml`\
  \ 文件，它现在应该如下所示：\n\n```xml\n<Transition\n    motion:constraintSetEnd=\"@+id/end\"\
  \n    motion:constraintSetStart=\"@id/start\"\n    motion:duration=\"1000\">\n \
  \   <KeyFrameSet>\n        <KeyAttribute\n            motion:targetId=\"@+id/myButton\"\
  \n            motion:framePosition=\"50\"\n            motion:rotation=\"360\" />\n\
  \    </KeyFrameSet>\n    <OnClick motion:targetId=\"@id/myButton\"\n          motion:clickAction=\"\
  toggle\" />\n</Transition>\n```\n\n使用时间轴滑块或通过编译运行 App 测试动画，确保按钮在动画期间旋转。\n\n## 43.7\
  \ 在过渡中添加自定义属性 (CustomAttribute)\n\n`KeyAttribute` 属性限于调整大小和旋转等内置效果。通过声明 `CustomAttributes`\
  \ 可以实现额外的更改。与 `KeyAttributes` 存储在 `Transition` 元素中不同，`CustomAttributes` 位于起始和结束约束集中。因此，这些属性只能在起点和终点生效（也就是说，你不能在过渡中间指定属性关键帧）。\n\
  \n在本示例中，我们将配置按钮颜色从红色逐渐变为绿色。首先选择图 43-18 中标记为 A 的起始框，然后是 `myButton` 约束集（B）：\n\n![](img/as_4.0_motionlayout_start_and_view.jpg)\n\
  Figure 43-18\n\n参考属性工具窗口，点击下方所示 `CustomAttributes` 部分的 `+` 按钮：\n\n![](img/as_4.0_motionlayout_timeline_custom_attr_add.jpg)\n\
  Figure 43-19\n\n在弹出的对话框中（图 43-20\nFigure 43-20\n\n点击 OK 提交更改，然后选择上方图 43-18 中标记为\
  \ C 的结束约束集，重复步骤添加自定义属性，这次指定颜色 值为 `#33CC33`。\n\n使用时间轴滑块或运行 App，确保按钮在动画期间颜色颜色。这些 `CustomAttributes`\
  \ 的添加将反映在 `activity_main_scene.xml` 文件中，如下：\n\n```xml\n<ConstraintSet android:id=\"\
  @+id/start\">\n    <Constraint>\n        <CustomAttribute\n            motion:attributeName=\"\
  backgroundColor\"\n            motion:customColorValue=\"#F80A1F\" />\n    </Constraint>\n\
  </ConstraintSet>\n<ConstraintSet android:id=\"@+id/end\">\n    <Constraint>\n  \
  \      <CustomAttribute\n            motion:attributeName=\"backgroundColor\"\n\
  \            motion:customColorValue=\"#33CC33\" />\n    </Constraint>\n</ConstraintSet>\n\
  ```\n\n## 43.8 添加位置关键帧\n\n\n\n\n\n本教程的最后一个任务是向动画路径添加两个位置关键帧（`KeyPosition`），以为动画引入一些横向移动。在\
  \ MotionLayout 编辑器中显示过渡时间轴的情况下，点击如上方图 43-13 所示的高亮按钮创建关键帧，并如下方图 43-21 所示从菜单中选择 `KeyPosition`\
  \ ：\n\n![](img/as_4.0_motionlayout_add_keyposition.jpg)\n\n图 43-21\n\n在弹出的对话框中，按照图\
  \ 43-22 所示设置属性：\n\n![](img/as_4.0_motionlayout_keyposition_1.jpg)\n\n图 43-22\n\n\
  点击 `Add` 按钮提交更改，然后重复上述步骤，添加配置如下的第二个位置关键帧：\n\n- 位置 (Position): 75\n- 类型 (Type): parentRelative\n\
  - X 百分比 (PercentX): 0.85\n- Y 百分比 (PercentY): 0.75\n\n完成这些更改后，`activity_main_scene.xml`\
  \ 文件中的过渡元素将添加以下关键帧项：\n\n```xml\n<KeyFrameSet>\n  <KeyPosition\n      motion:motionTarget=\"\
  @+id/myButton\"\n      motion:framePosition=\"25\"\n      motion:keyPositionType=\"\
  parentRelative\"\n      motion:percentX=\"0.15\"\n      motion:percentY=\"0.25\"\
  \ />\n  <KeyPosition\n      motion:motionTarget=\"@+id/myButton\"\n      motion:framePosition=\"\
  75\"\n      motion:keyPositionType=\"parentRelative\"\n      motion:percentX=\"\
  0.85\"\n      motion:percentY=\"0.75\" />\n</KeyFrameSet>\n```\n\n最后测试一次应用，验证按钮现在是否遵循下方所示路径，同时仍保持旋转并改变颜色：\n\
  \n![](img/as_4.0_motionlayout_zig_zag.jpg)\n\n图 43-23\n\n位置关键帧由预览画布中代表运动路径的虚线上的菱形标记表示，如图\
  \ 43-24 所示（如果标记不可见，请确保在预览中选中了 `Button` 视图）：\n\n![](img/as_4.1_motion_layout_position_markers.jpg)\n\
  \n图 43-24\n\n要视觉上调整关键帧的位置，只需点击标记并将其拖到新位置。随着标记移动，Motion Layout 编辑器将显示网格以及当前的 x 和\
  \ y 坐标：\n\n![](img/as_4.1_motion_layout_position_marker_drag.jpg)\n\n图 43-25\n\n\
  ### 43.9 总结\n\n本章引入了 Android Studio 内置的 MotionLayout 编辑器，并探索了如何在如何在无需手动编写 XML 声明的情况下，为\
  \ Android 应用的用户界面添加动画。本章涵盖的示例包括：将 `ConstraintLayout` 容器转换为 `MotionLayout`、在 `MotionScene`\
  \ 文件中创建起始和结束约束集及过渡，以及添加 `OnClick` 处理程序。此外还涵盖了动画预览器、自定义属性和位置关键帧的使用。\n\n### 44. MotionLayout\
  \ 循环教程\n\n之前的章节介绍并演示了如何使用 `MotionLayout` 容器结合 Android Studio MotionLayout 编辑器的功能，将动画集成到\
  \ Android 应用的用户界面中。标题为“MotionLayout 简介`所示可视化，其中五个点代表关键帧位置：\n\n![](img/as_4.0_keycycle_simple_sin.jpg)\n\
  \n图 44-1\n\n目前的实现方式每个循环包含一个波。假设我们需要的不是均匀分布的波，而是在最后一个循环内四个波。这可以通过增加最后一个 `KeyCycle`\
  \ 元素的 `wavePeriod` 属性来轻松实现：\n\n```xml\n<KeyCycle\n    motion:framePosition=\"75\"\
  \n    motion:motionTarget=\"@+id/myButton\"\n    motion:wavePeriod=\"4\"\n    motion:waveOffset=\"\
  0dp\"\n    motion:waveShape=\"sin\"\n    android:translationY=\"50dp\"/>\n```\n\n\
  进行此更改后，帧集可以以波形渲染如下：\n\n![](img/as_4.0_keycycle_sin_waveperiod.jpg)\n\n图 44-2\n\n\
  \n\n\n到为止，本章的示例一直在使用正弦波。事实上，在 `MotionLayout` 中使用循环关键帧时，可以使用多种不同的波形。例如，图 44-3 展示了将所有循环关键帧的\
  \ `waveShape` 属性更改为锯齿波的效果：\n\n![](img/as_4.0_keycycle_sawtooth.jpg)\n\n图 44-3\n\n\
  除了正弦波和锯齿波，`MotionLayout` 还支持三角形（triangle）、方形（square）、反弹（bounce）和反锯齿波（reverseSawtooth）波形。\n\
  \n在上面的示例中，每个循环都在 Y 轴的相同范围内移动按钮。然而，假设我们需要第二个循环沿正 Y 轴移动按钮的距离更远。这我们需要对第二个循环的 `waveOffset`\
  \ 属性进行如下调整：\n\n```xml\n<KeyCycle\n      motion:framePosition=\"25\"\n      motion:target=\"\
  @+id/button\"\n      motion:wavePeriod=\"1\"\n      motion:waveOffset=\"100dp\"\n\
  \      motion:waveShape=\"sin\"\n      android:translationY=\"50dp\"/>\n```\n\n\
  通过此项更改，我们得到了一个类似于 图 44-4 的时间线：\n\n![](img/as_4.0_keycycle_sin_waveoffset.jpg)\n\n\
  图 44-4\n\n现在，在第二个循环期间，按钮的移动将在 Y 轴上的约 0 到 150dp 之间。如果我们仍然需要范围的低端与其他波形匹配，我们当然可以在 `translationY`\
  \ 值上增加 100dp：\n\n```xml\n<KeyCycle\n      motion:framePosition=\"25\"\n      motion:target=\"\
  @+id/button\"\n      motion:wavePeriod=\"1\"\n      motion:waveOffset=\"100dp\"\n\
  \      motion:waveShape=\"sin\"\n      android:translationY=\"150dp\"/>\n```\n\n\
  此更改现在为我们生成了如下波形：\n\n![](img/as_4.0_keycycle_sin_waveoffset_flat.jpg)\n\n图 44-5\n\
  \n## 44.2 使用循环编辑器 (Cycle Editor)\n\n虽然并不复杂，但通过直接编辑 `MotionScene` 文件中的 XML `KeyCycle`\
  \ 条目来获取你所需的精确循环配置可能需要一些时间。考虑到这一事实，Google 的 Android 工程师开发了循环编辑器（Cycle Editor）。这是一个独立的\
  \ Java 工具，目前尚未成为 Android Studio 的一部分。循环编辑器允许你可视化地设计和测试循环关键帧集。\n\n循环编辑器工具以 Java 归档（jar）文件的形式提供，这需要在你的开发系统上安装\
  \ Java 运行时。安装 Java 的步骤取决于你的操作系统。\n\n一旦安装了 Java，即可从以下 URL 下载 `CycleEditor.jar` 文件：\n\
  \n`https://github.com/googlesamples/android-ConstraintLayoutExamples/releases/download/1.0/CycleEditor.jar`\n\
  \n下载完成后，打开命令提示符或终端窗口，切换到 jar 文件所在的目录，并运行以下命令：\n\n```bash\njava -jar CycleEditor.jar\n\
  ```\n\n工具加载后，将出现图 44-6 所示的屏幕：\n\n![](img/as_4.0_keycycle_editor_main.jpg)\n\n图 44-6\n\
  \n上图中标记为 A 的面板显示关键帧集的 XML，可以直接进行编辑，也可以使用 B 面板中的控件进行编辑。C 面板显示波形形式的循环渲染。遗憾的是，在进行更改时不会实时重绘。相反，必须通过选择\
  \ `File -> Parse XML` 菜单选项来刷新。当点击 B 面板中的播放按钮时，标记为 D 的面板将显示循环动画的实时渲染。`Examples` 菜单提供了一个示例关键帧集集合，它们既可以用于学习，也可以作为你自己动画的基础。\n\
  \n为了演示循环关键帧和循环编辑器的用法，本章剩余部分将创建一个实现基于 `KeyCycle` 动画效果的示例项目。\n\n## 44.3 创建 KeyCycleDemo\
  \ 项目\n\n从欢迎屏幕上选择 New Project（新建项目）选项，在生成的新项目对话框中，点击 Next（下一步）按钮之前选择 Empty Activity\
  \ 模板。\n\n在 `Name` 字段中输入 `KeyCycleDemo` 并指定 `com.ebookfrenzy.keycycledemo` 为包名。在点击\
  \ Finish（完成）按钮之前，将 Minimum API level 设置更改为 `API 26`：Android 8.0 (Oreo)，并将 Language\
  \ 菜单设置为 Java。\n\n## 44.4 配置起始和结束约束\n\n本教程的目标是制作按钮从设备一侧到另一侧移动的动画。第一步是配置起始结束约束。\n\n\
  加载 `activity_main.xml` 文件后，选择并删除 `TextView`。确保从调色板拖入一个 `Button`，使其沿左边缘垂直居中：\n\n\
  ![](img/as_4.0_keycycle_layout.jpg)\n\n图 44-8\n\n要配置起始点的约束，选择起始集条目（在图 44-9 中标记为\
  \ A）：\n\n![](img/as_4.0_keycycle_layout.jpg)\n\n图 44-9\n\n接下来，在 `ConstraintSet`\
  \ 中选择按钮。在按钮仍被选中时，点击 C 按钮并选择 `Constraint`。在按钮仍被选中时，使用属性窗口设置顶部和左侧的约束：\n\n![](img/as_4.0_keycycle_layout.jpg)\n\
  \n图 44-10\n\n选择结束约束集条目（在图 44-9 中标记为 D），并重复步骤创建一个新的约束，这次在顶部、底部和右侧设置约束：\n\n![](img/as_4.0_keycycle_layout.jpg)\n\
  \n图 44-11\n\n## 44.5 创建循环\n\n下一步是使用循环编辑器为动画生成循环关键帧。循环编辑器运行时，参考下方图 44-12 所示的控制面板：\n\
  \n![](img/as_4.0_layout.jpg)\n\n图 44-12\n\n使用标记为 A 的菜单，将要修改的属性从 `rotation` 更改为 `translationY`。\n\
  \n接下来，使用循环控件 (B) 选择循环 0，这样面板其他其他更改将应用于第一个循环。将 `Period` 滑块移动到 1，并将 `translationY`\
  \ 滑块移动到 60，如图 44-13 所示（在移动滑块时参考 XML 面板查看 `translationY` 值的精确设置）：\n\n![](img/as_4.0_layout.jpg)\n\
  \n图 44-13\n\n为了在图中查看为止的更改，选择 `File -> Parse XML` 菜单选项。使用表 44-1](#MotionLayout_KeyCycle_Tutorial.xhtml__idTextAnchor903)出的值，配置关键帧\
  \ 1 到 4 的设置（记住你已经配置了 KeyCycle 0 列中的设置）：\n\n|  | KeyCycle 0 | KeyCycle 1 | KeyCycle\
  \ 2 | KeyCycle 3 | KeyCycle 4 |\n| --- | --- | --- | --- | --- | --- |\n| Position\
  \ | 0 | 25 | 50 | 75 | 100 |\n| Period | 1 | 2 | 3 | 2 | 1 |\n| translationY | 60\
  \ | 60 | 150 | 60 | 60 |\n\n表 44-1\n\n\n\n\n完成这些更改后，关键帧集 XML 内容如下：\n\n```xml\n<KeyFrameSet>\n\
  \    <KeyCycle\n      motion:framePosition=\"0\"\n      motion:motionTarget=\"@+id/button\"\
  \n      motion:wavePeriod=\"1\"\n      motion:waveOffset=\"0dp\"\n      motion:waveShape=\"\
  sin\"\n      android:translationY=\"60dp\"/>\n    <KeyCycle\n      motion:framePosition=\"\
  25\"\n      motion:motionTarget=\"@+id/button\"\n      motion:wavePeriod=\"2\"\n\
  \      motion:waveOffset=\"0dp\"\n      motion:waveShape=\"sin\"\n      android:translationY=\"\
  60dp\"/>\n    <KeyCycle\n      motion:framePosition=\"50\"\n      motion:motionTarget=\"\
  @+id/button\"\n      motion:wavePeriod=\"3\"\n      motion:waveOffset=\"0dp\"\n\
  \      motion:waveShape=\"sin\"\n      android:translationY=\"150dp\"/>\n    <KeyCycle\n\
  \      motion:framePosition=\"75\"\n      motion:motionTarget=\"@+id/button\"\n\
  \      motion:wavePeriod=\"2\"\n      motion:waveOffset=\"0dp\"\n      motion:waveShape=\"\
  sin\"\n      android:translationY=\"60dp\"/>\n    <KeyCycle\n      motion:framePosition=\"\
  100\"\n      motion:motionTarget=\"@+id/button\"\n      motion:wavePeriod=\"1\"\n\
  \      motion:waveOffset=\"0dp\"\n      motion:waveShape=\"sin\"\n      android:translationY=\"\
  60dp\"/>\n</KeyFrameSet>\n```\n\n要查看带有新循环的图形，选择 `File -> Parse XML` 菜单选项来刷新波形，该波形现在应该如图\
  \ 44-14 所示：\n\n![](img/as_4.0_keycycle_editor_cyclekeys_complete.jpg)\n图 44-14\n\
  \n## 44.6 预览动画\n\n现在可以在 `Cycle Editor` 工具中预览基于的动画。点击播放按钮（图 44-15 中的标记 A）开始运行动画。要将循环与水平移动相结合，将第二个菜单\
  \ (B) 从 `Stationary`（静止）更改为 `West`（西）或 `East`（东）。此外，花些时间尝试时间和线性度设置（C 和 D）。\n\n![](img/as_4.0_keycycle_play_buttons.jpg)\n\
  图 44-15\n\n## 44.7 将 KeyFrameSet 添加到 MotionScene\n\n在 `Cycle Editor` 中，从 XML 面板高亮并复制\
  \ `KeyCycle` 元素，并将它们粘贴到 Android Studio 中 `res -> xml -> activity_main_scene.xml`\
  \ 文件的 `Transition` 部分，以便它们置于现有的 `KeyFrameSet` 标记之间。还要注意增加的持续时间设置以及用于启动动画的 `OnClick`\
  \ 句添加：\n\n```xml\n<Transition\n  motion:constraintSetEnd=\"@+id/end\"\n  motion:constraintSetStart=\"\
  @id/start\"\n  motion:duration=\"7000\">\n    <KeyFrameSet>\n        <KeyCycle\n\
  \          motion:framePosition=\"0\"\n          motion:motionTarget=\"@+id/button\"\
  \n          motion:wavePeriod=\"1\"\n          motion:waveOffset=\"0dp\"\n     \
  \     motion:waveShape=\"sin\"\n          android:translationY=\"60dp\"/>\n    \
  \    <KeyCycle\n          motion:framePosition=\"25\"/>\n    </KeyFrameSet>\n  \
  \  <OnClick motion:target=\"@id/button\" motion:click=\"toggle\" />\n```\n\n在继续之前，检查每个属性是否已正确声明。在编写时，`Cycle\
  \ Editor` 正在使用过时的 `motion:target` 标签。例如：`motion:target=\"@+id/button\"` 需要为五个 `KeyCycle`\
  \ 条目中的每一个更改为如下：`motion:motionTarget=\"@+id/button\"`。\n\n完成这些更改后，在设备或模拟器上编译并运行应用，点击按钮开始并查看动画。注意，`KeyCycle`\
  \ 的波形形成可以在 Android `MotionLayout` 编辑器中查看，如图 44-16 所示：\n\n![](img/as_4.0_keycycle_motion_timeline_waves.jpg)\n\
  图 44-16\n\n`KeyCycle` 帧集不仅限于每个动画一个。例如，向 `activity_main_scene.xml` 文件的 `Transition`\
  \ 部分添加以下 `KeyFrameSet`，以便为按钮在移动时添加一些旋转效果：\n\n```xml\n<KeyFrameSet>\n    <KeyCycle\n\
  \      motion:framePosition=\"0\"\n      motion:motionTarget=\"@+id/button\"\n \
  \     motion:wavePeriod=\"1\"\n      motion:waveOffset=\"0dp\"\n      motion:waveShape=\"\
  sin\"\n      android:translationY=\"60dp\"\n      android:rotation=\"45\"/>\n  \
  \  <KeyCycle\n      motion:framePosition=\"25\"\n      motion:motionTarget=\"@+id/button\"\
  \n      motion:wavePeriod=\"2\"\n      motion:waveOffset=\"0dp\"\n      motion:waveShape=\"\
  sin\"\n      android:translationY=\"60dp\"\n      android:rotation=\"80\"/>\n  \
  \  <KeyCycle\n      motion:framePosition=\"50\"\n      motion:motionTarget=\"@+id/button\"\
  \n      motion:wavePeriod=\"3\"\n      motion:waveOffset=\"0dp\"\n      motion:waveShape=\"\
  sin\"\n      android:translationY=\"150dp\"\n      android:rotation=\"45\"/>\n \
  \   <KeyCycle\n      motion:framePosition=\"75\"\n      motion:motionTarget=\"@+id/button\"\
  \n      motion:wavePeriod=\"2\"\n      motion:waveOffset=\"0dp\"\n      motion:waveShape=\"\
  sin\"\n      android:translationY=\"60dp\"\n      android:rotation=\"80\"/>\n</KeyFrameSet>\n\
  ```\n\n## 44.8 总结\n\n基于的动画现在可以在 `Cycle Editor` 工具中预览。\n\n## 45. 使用悬浮按钮和 Snackbar\n\
  \n本章的目标是提供材料设计概念的概述。\n\n## 45.1 材料设计\n\nAndroid 的整体外观由材料设计原则定义。材料设计是由 Google 团队创建的，它规定了\
  \ Android 及其运行的应用程序的用户界面元素在行为、阴影和样式方面的呈现和行为方式。材料设计的一个原则是用户界面元素看起来具有物理深度，并且感觉是由物理材料层构建的。\n\
  \n\n\n\n实现采用 Material Design（材料设计）原则的 Android 应用所需的许多构建模块都包含在 Android Design Support\
  \ Library 中。该库包含了一系列用户界面组件，可以包含在 Android 应用中以实现 Material 设计的大部分外观、感觉和行为。该库中的两个组件——悬浮操作按钮（floating\
  \ action button）和 Snackbar 将在本章介绍，其他组件将在后续章节介绍。\n\n## 45.3 悬浮操作按钮 (FAB)\n\n悬浮操作按钮是一个浮在应用程序用户界面之上的按钮，通常用于促进用户界面屏幕中最常见的操作。例如，可以将悬浮操作按钮放在屏幕上，允许用户向联系人列表添加条目或从应用内发送电子邮件。例如，图\
  \ 45-1 显示了标准 Android 联系人应用中允许用户添加新联系人的悬浮操作按钮：\n\n![](img/Image24251.jpg)\n\n图 45-1\n\
  \n为了符合 Material 设计指南，在使用悬浮操作按钮时应遵循许多规则。悬浮操作按钮必须是圆形的，尺寸可以是 56 x 56dp（默认）或 40 x 40dp（微型）。按钮在手机上应距离屏幕边缘至少\
  \ 16dp，在桌面电脑和平板设备上至少 24dp。无论尺寸如何，按钮必须包含一个大小为 24x24dp 的内部图标，并且建议每个用户界面屏幕只有一个悬浮操作按钮。\n\
  \n悬浮操作按钮可以进行动画处理，或者设计为在触摸时变形为其他项目。例如，悬浮操作按钮可以在点击时旋转，或者变形为其他元素，如工具栏或列出相关操作的面板。\n\n\
  ## 45.4 Snackbar\n\nSnackbar 组件提供了一种以出现在屏幕底部面板的形式向用户展示信息的方法，如图 45-2 所示。Snackbar\
  \ 实例包含一条简短的文本消息和一个可选的操作按钮，用户点击该按钮时将执行某项任务。显示后，Snackbar 会自动超时消失，也可以由用户通过滑动操作手动移除。在\
  \ Snackbar 显示期间，应用程序将继续运行并以正常方式响应用户交互。\n\n![](img/Image2434.jpg)\n\n图 45-2\n\n在本章的剩余部分中，将创建一个示例应用程序，利用悬浮操作按钮和\
  \ Snackbar 的基本功能向项目列表添加条目。\n\n## 45.5 创建示例项目\n\n从欢迎界面选择 New Project（新建项目）选项，在生成的新项目对话框中，点击\
  \ `Next` 按钮之前选择 Basic Activity 模板。\n\n在 `Name` 字段中输入 `FabExample`，并指定 `com.ebookfrenzy.fabexample`\
  \ 为包名。在点击 `Finish` 按钮之前，将 Minimum API 级别设置为 `API 26`：Android 8.0 (Oreo)，并将语言菜单设置为\
  \ `Java`。\n\n## 45.6 检查项目\n\n由于选择了 Basic Activity 模板，该活动包含四个布局文件。`activity_main.xml`\
  \ 文件由一个 `CoordinatorLayout` 布局组成，其中包含应用栏、工具栏和悬浮操作按钮的条目。\n\n`content_main.xml` 文件表示活动内容区域的布局，并包含一个\
  \ `NavHostFragment` 实例。该文件通过以下 `include` 指令嵌入到 `activity_main.xml` 文件中：\n\n```xml\n\
  <include layout=\"@layout/content_main\" />\n```\n\n`activity_main.xml` 文件中的悬浮操作按钮元素如下：\n\
  \n```xml\n<com.google.android.material.floatingactionbutton.FloatingActionButton\n\
  \    android:id=\"@+id/fab\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:layout_gravity=\"bottom|end\"\n    android:layout_margin=\"\
  @dimen/fab_margin\"\n    app:srcCompat=\"@android:drawable/ic_dialog_email\" />\n\
  ```\n\n这声明按钮将出现在屏幕的右下角，边距由 `values/dimens.xml` 文件中的 `fab_margin` 标识表示（在本例中设置为 16dp）。XML\
  \ 进一步声明按钮的内部图标将采用标准 drawable 内置电子邮件图标的形式。\n\n空白模板还配置了悬浮操作按钮，以便在用户点击时显示一个 Snackbar\
  \ 实例。实现此功能的代码可以在 `MainActivity.java` 文件的 `onCreate()` 方法中找到，内容如下：\n\n```java\nbinding.fab.setOnClickListener(new\
  \ View.OnClickListener() {\n    @Override\n    public void onClick(View view) {\n\
  \        Snackbar.make(view, \"Replace with your own action\", Snackbar.LENGTH_LONG)\n\
  \                  .setAction(\"Action\", null).show();\n    }\n});\n```\n\n该代码通过视图绑定访问悬浮操作按钮，并为其添加了\
  \ `onClickListener` 处理器，以便在按钮被点击时调用。此方法简单地显示一个配置了消息但没有操作的 Snackbar。当项目编译并运行时，悬浮操作按钮将出现在屏幕底部，如图\
  \ 45-3 所示：\n\n![](img/as_4.1.jpg)\n\n图 45-3\n\n点击悬浮操作按钮将触发 `onClick` 方法，导致 Snackbar\
  \ 出现在屏幕底部：\n\n![](img/4_1.jpg)\n\n图 45-4\n\n当 Snackbar 在较窄的设备上显示时（如上述图 45-4 所示），注意悬浮操作按钮会移动以留出空间。这是由\
  \ `activity_main.xml` 中的 `CoordinatorLayout` 容器自动处理的。\n\n## 45.7 移除功能\n\n正如 Android\
  \ 布局编辑器指南所示，Basic Activity 模板包含多个片段以及用于片段间导航的按钮。对于本教程而言，这些功能是不必要的，如果不移除将会导致问题。在继续教程之前，请按照以下方式修改项目：\n\
  \n1. 在 Project 窗口中，导航并双击 `app -> res -> navigation -> nav_graph.xml` 文件将其加载到导航编辑器中。\n\
  2. 在编辑器中，在 Component Tree 面板选择 `SecondFragment` ，按下键盘删除键将其从图中移除。\n3. 定位并删除 `SecondFragment.java`\
  \ (`app -> java -> <package name> -> SecondFragment`) 和 `fragment_second.xml` (`app\
  \ -> res -> layout -> fragment_second.xml`) 文件。\n4. 定位 `FirstFragment.java` 文件，双击加载到编辑器，并删除\
  \ `onViewCreated()` 方法中的代码，使其内容如下：\n\n```java\nbinding.buttonFirst.setOnClickListener(new\
  \ View.OnClickListener() {\n    @Override\n    public void onClick(View view) {\n\
  \        NavHostFragment.findNavController(FirstFragment.this)\n            .navigate(R.id.action_FirstFragment_to_SecondFragment);\n\
  \    }\n});\n```\n\n## 45.8 更改悬浮操作按钮\n\n由于此示例的目标是配置悬浮操作按钮向列表添加条目，因此需要将按钮当前显示的电子邮件图标更改为指示所执行操作的内容。用于按钮的图标命名为\
  \ `ic_add_entry.png`，可以在以下 URL 下载的示例代码的 `project_icons` 文件夹找到：\n\n[`www.ebookfrenzy.com/retail/arcticfoxjava/index.php`](https://www.ebookfrenzy.com/retail/arcticfoxjava/index.php)\n\
  \n\n\n\n\n在操作系统的文件导航器中找到此图像并复制该图像文件。在 Project 工具窗口中，右键点击 app -> `res` -> `drawable`\
  \ 项，并从菜单中选择“粘贴”将文件添加到文件夹中：\n\n![](img/as_3.6_fab_icon_added.jpg)\n\n图 45-5\n\n接下来，编辑\
  \ `activity_main.xml` 文件，将图标的图像源从 `@android:drawable/ic_dialog_email` 更改为 `@drawable/ic_add_entry`，如下：\n\
  \n```xml\n<com.google.android.material.floatingactionbutton.FloatingActionButton\n\
  \    android:id=\"@+id/fab\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:layout_gravity=\"bottom|end\"\n    android:layout_margin=\"\
  @dimen/fab_margin\"\n    app:srcCompat=\"@drawable/ic_add_entry\" />\n```\n\n在布局预览中，按钮内部的图标将变为加号。\n\
  \n我们也可以通过向 `OnClickListener` 中添加代码，让悬动按钮在点击时执行几乎任何操作。例如，对 `MainActivity.java` 文件的以下更改会在每次点击按钮时调用名为\
  \ `displayMessage()` 的方法来显示 toast 消息：\n\n```java\nimport android.widget.Toast;\n\
  \nbinding.fab.setOnClickListener(new View.OnClickListener() {\n    @Override\n \
  \   public void onClick(View view) {\n        displayMessage(\"Fab clicked\");\n\
  \        Snackbar.make(view, \"Replace with your own action\", Snackbar.LENGTH_LONG)\n\
  \                  .setAction(\"Action\", null).show();\n    }\n});\n\npublic void\
  \ displayMessage(String message) {\n    Toast.makeText(this,message,Toast.LENGTH_SHORT).show();\n\
  }\n```\n\n## 45.9 为 Snackbar 添加操作\n\n也可以为 `Snackbar` 添加一个操作，当用户点击时会执行该任务。编辑 `MainActivity.java`\
  \ 文件并修改 `Snackbar` 的创建代码，添加一个标题为“My Action”的操作，并配置一个命名为 `actionOnClickListener`\
  \ 的 `OnClickListener`，该监听反过来会显示 toast 消息：\n\n```java\nbinding.fab.setOnClickListener(new\
  \ View.OnClickListener() {\n    @Override\n    public void onClick(View view) {\n\
  \        Snackbar.make(view, \"Replace with your own action\", Snackbar.LENGTH_LONG)\n\
  \                  .setAction(\"My Action\", actionOnClickListener).show();\n  \
  \  }\n});\n```\n\n在 `MainActivity.java` 文件中添加监听器处理器：\n\n```java\nView.OnClickListener\
  \ actionOnClickListener = new View.OnClickListener() {\n    @Override\n    public\
  \ void onClick(View view) {\n        Snackbar.make(view, \"Action Complete\", Snackbar.LENGTH_LONG)\n\
  \                  .setAction(\"Action\", null).show();\n    }\n};\n```\n\n运行应用并点击悬浮按钮，此时\
  \ toast 消息和 `Snackbar` 都应该会显示。当 `Snackbar` 可见时，点击 `Snackbar` 中的 My Action 按钮，并验证\
  \ `Snackbar` 上的文本是否更改为“Action Complete”：\n\n![](img/as_4.2_fab_example_snack_action.jpg)\n\
  \n图 45-6\n\n## 45.10 总结\n\n本章对 Material 设计（Material Design）、悬浮按钮和 `Snackbar` 提供了概述，并完成了一个使用这些特性的示例项目。\n\
  \n悬浮按钮和 `Snackbar` 都是 Android 用户界面实现 Material 设计方法的一部分。悬浮按钮提供了一种在 Android 应用特定屏幕内推广最常用操作的方法。`Snackbar`\
  \ 提供了一种应用程序既向用户展示信息，又允许用户对信息采取操作的方法。\n\n# 46. 使用 TabLayout 组件创建标签页界面\n\n上一章概述了 Android\
  \ 中 Material 设计的概念，并引入了设计支持库提供的两个组件，即悬浮按钮和 `Snackbar`。本章将演示如何使用设计库的另一个组件——`TabLayout`，它可以与\
  \ `ViewPager` 类结合使用，在 Android Activity 中创建一个基于标签页的界面。\n\n## 46.1 ViewPager2 简介\n\
  \n虽然 `ViewPager2` 不属于设计支持库，但在与 `TabLayout` 组件结合使用实现标签页用户界面时，它是一个非常有用的伙伴类。`ViewPager2`\
  \ 的主要作用是允许用户翻阅不同的信息页，每页通常由一个布局碎片（fragment）表示。与 `ViewPager2` 关联的碎片由 `PagerAdapter`\
  \ 的实例管理。分页器至少必须实现两个方法。第一个 `getItemCount()` 必须返回可用页总数。第二个 `createFragment()` 接收一个页码并必须返回该碎片。\n\
  \n## 46.2 TabLayout 组件概述\n\n如前所述，`TabLayout` 是作为 Material 设计引入的组件之一，用于向用户展示一行可以选择的标签。标签可以是固定的也可以是可滚的，用户可以向左或右滑动以查看比当前显示更多的内容。本章的剩余部分将通过创建一个示例来演示\
  \ `TabLayout` 与 `ViewPager2` 配合使用。\n\n## 46.3 创建 TabLayout 项目\n\n从欢迎屏幕选择 New Project（新建项目），在新项目对话框中，选择\
  \ Basic Activity 模板。在 Name 字段中输入 `TabLayoutDemo`，并指定 `com.ebookrenzy.tablayout`\
  \ 为包名。在点击 Finish 按钮之前，将 Minimum API 设置为 API 26: Android 8.0 (Oreo)，并将 Language 设置为\
  \ Java。\n\n项目创建完成后，在布局编辑器加载 `content_main.xml` 文件，选择 `HostFragment` 对象并将其删除。由于我们不会使用\
  \ Basic Activity 模板的导航功能，请编辑 `MainActivity.java` 文件并修改 `onCreate()` 方法以移除导航代码：\n\
  \n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState) {\n   \
  \ super.onCreate(savedInstanceState);\n    binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \    setContentView(binding.getRoot());\n    setSupportActionBar(binding.toolbar);\n\
  \    NavController navController = Navigation.findNavController(this, R.id.nav_host_fragment_content_main);\n\
  \    appBarConfiguration = new AppBarConfiguration.Builder(navController.getGraph()).build();\n\
  \    NavigationUI.setupActionBarWithNavController(this, navController, appBarConfiguration);\n\
  \    binding.fab.setOnClickListener(new View.OnClickListener() {\n        @Override\n\
  \        public void onClick(View view) {\n            Snackbar.make(view, \"Replace\
  \ with your own action\", Snackbar.LENGTH_LONG)\n                      .setAction(\"\
  Action\", null).show();\n        }\n    });\n}\n```\n\n最后，删除 `onSupportNavigateUp()`\
  \ 方法：\n\n```java\n@Override\npublic boolean onSupportNavigateUp() {\n    NavController\
  \ navController = Navigation.findNavController(this, R.id.nav_host_fragment_content_main);\n\
  \    return NavigationUI.navigateUp(navController, appBarConfiguration) || super.onSupportNavigateUp();\n\
  }\n```\n\n\n\n\n\n`TabLayout` 上的每个标签页在选中时将显示不同的碎片（fragment）。在 Project 工具窗口中，右键点击\
  \ `app` -> `java` -> `com.ebookfrenzy.tablayoutdemo` 项，并选择 `New` -> `Fragment` ->\
  \ `Fragment (Blank)` 选项来创建第一个碎片。在弹出的对话框中，在 `Fragment Name:` 字段中输入 `Tab1Fragment`，`Fragment\
  \ Layout Name:` 字段中输入 `fragment_tab1`。点击 `Finish` 按钮创建新碎片：\n\n![](img/as_4.2_new_fragment_java1.jpg)\n\
  图 46-3\n\n编辑 `Tab1Fragment.java` 文件，如果 Android Studio 没有自动添加，请按照如下所示添加 `OnFragmentInteractionListener`\
  \ 接口声明：\n\n```java\nimport android.net.Uri;\n\npublic interface OnFragmentInteractionListener\
  \ {\n    // TODO: Update argument type and name\n    void onFragmentInteraction(Uri\
  \ uri);\n}\n```\n\n将新创建的 `fragment_tab1.xml` 文件（位于 `app` -> `res` -> `layout` 下）加载到\
  \ Layout Editor 工具中，右键点击 Component Tree 面板中的 `FrameLayout` 项并选择 `Convert FrameLayout\
  \ to ConstraintLayout` 菜单选项。在弹出的对话框中，点击 `OK` 之前确保选中了所有转换选项。将布局的 ID 改为 `constraintLayout`。\n\
  \n一旦布局转换为 `ConstraintLayout`，从布局中删除 `TextView`。从 `Palette`（调色板）中找到 `TextView` 控件，并将其拖放到布局的中心位置。编辑该对象的文本属性，使其显示为“Tab\
  \ 1 Fragment”，并将字符串提取为命名为 `tab_1_fragment` 的资源，此时布局应与 图 46-4 一致：\n\n![](img/as_3.5_tab_layout_fragment_ui.jpg)\n\
  图 46-4\n\n## 46.5 复制碎片\n\n到目前为止，项目包含了四个所需碎片中的一个。与其使用之前的步骤创建剩余的三个碎片，不如复制第一个碎片会更快。每个碎片由一个布局\
  \ XML 文件和一个 Java 类文件组成，每个文件都需要复制。\n\n在 Project 工具窗口中右键点击 `fragment_tab1.xml` 文件，并从弹出的菜单中选择\
  \ `Copy` 选项。右键点击布局项，这次选择 `Paste` 选项。在弹出的对话框中，在点击 `OK` 按钮之前，将新布局文件命名为 `fragment_tab2.xml`。编辑新的\
  \ `fragment_tab2.xml` 文件，并将 `Text View` 上的文本更改为“Tab 2 Fragment”，按照通常步骤将字符串提取为命名为\
  \ `tab_2_fragment` 的资源。\n\n要复制 `Tab1Fragment` 类文件，右键点击 `app` -> `java` -> `com.ebookfrenzy.tablayoutdemo`\
  \ 下列出的类并选择 `Copy`。右键点击 `com.ebookfrenzy.tablayoutdemo` 项并选择 `Paste`。在 `Copy Class`\
  \ 对话框中，在 `New name:` 字段输入 `Tab2Fragment` 并点击 `OK`。编辑新的 `Tab2Fragment.java` 文件并更改类名，然后修改\
  \ `onCreateView()` 方法以加载（inflate）`fragment_tab2` 布局文件：\n\n```java\n@Override\npublic\
  \ View onCreateView(LayoutInflater inflater, ViewGroup container,\n            \
  \             Bundle savedInstanceState) {\n    // Inflate the layout for this fragment\n\
  \    return inflater.inflate(R.layout.fragment_tab2, container, false);\n}\n```\n\
  \n再次执行上述复制步骤两次，为剩余的两个碎片创建碎片布局和类文件。完成这些步骤后，项目结构应与 图 46-5 一致：\n\n![](img/as_4.2_tablayout_project_files.jpg)\n\
  图 46-5\n\n## 46.6 添加 TabLayout 和 ViewPager2\n\n碎片创建过程现在已经完成，下一步是向主活动布局文件添加 `TabLayout`\
  \ 和 `ViewPager2`。编辑 `activity_main.xml` 文件，并按照下面的 XML 列表所示添加这些元素。注意，`TabLayout`\
  \ 组件嵌入在 `AppBarLayout` 元素中，而 `ViewPager2` 放置在 `AppBarLayout` 之后：\n\n```xml\n<?xml\
  \ version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.coordinatorlayout.widget.CoordinatorLayout\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    tools:context=\".MainActivity\">\n    <com.google.android.material.appbar.AppBarLayout\n\
  \        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  wrap_content\"\n        android:theme=\"@style/AppTheme.Overlay\">\n        <androidx.appcompat.widget.Toolbar\n\
  \            android:id=\"@+id/toolbar\"\n            android:layout_width=\"match_parent\"\
  \n            android:layout_height=\"?attr/actionBarSize\"\n            android:background=\"\
  ?attr/colorPrimary\"\n            app:popupTheme=\"@style/AppTheme.Overlay\" />\n\
  \        <com.google.android.material.tabs.TabLayout\n            android:id=\"\
  @+id/tabLayout\"\n            android:layout_width=\"match_parent\"\n          \
  \  android:layout_height=\"wrap_content\"\n            app:tabMode=\"fixed\"\n \
  \           app:tabGravity=\"fill\"/>\n    </com.google.android.material.appbar.AppBarLayout>\n\
  \    <androidx.view2.widget.ViewPager2\n        android:id=\"@+id/view_pager\"\n\
  \        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  match_parent\"\n        app:layout_behavior=\"@string/appbar_scrolling_view_behavior\"\
  \ />\n    <include layout=\"@layout/content_main\" />\n    <com.google.android.material.floatingbutton.FloatingActionButton\n\
  \        android:id=\"@+id/fab\"\n        android:layout_width=\"wrap_content\"\n\
  \        android:layout_height=\"wrap_content\"\n        android:layout_gravity=\"\
  bottom|end\"\n        android:layout_margin=\"@dimen/fab_margin\"\n        app:srcCompat=\"\
  @android:drawable/ic_dialog_email\" />\n</androidx.coordinatorlayout.widget.\n\n\
  Layout\n\n 4 .. 创建 Pager Adapter\n\n此示例将使用 `ViewPager2` 方法来处理分配给 `TabLayout` 标签的碎片。在布局资源文件中添加了\
  \ `ViewPager2` 后，需要向项目添加一个子类 `FragmentPagerAdapter` 的类，以管理用户选择标签项时显示的碎片。\n\n在 Project\
  \ 工具窗口中右键点击 `com.ebookfrenzy.tablayoutdemo` 项，选择 `New` -> `Java Class` 选项。在新类对话框中，在\
  \ `Name:` 字段中输入 `TabPagerAdapter`，选择列表中的 `Class` 项并按回车键。\n\n编辑 `TabPagerAdapter.java`\
  \ 文件，使其内容如下：\n\n```java\npackage com.ebookfrenzy.tablayoutdemo;\n\nimport androidx.annotation.NonNull;\n\
  import androidx.fragment.app.*;\nimport androidx.viewpager2.adapter.FragmentStateAdapter;\n\
  \npublic class TabPagerAdapter extends FragmentStateAdapter {\n    int tabCount;\n\
  \    public TabPagerAdapter(@NonNull FragmentActivity fragmentActivity, int numberOfTabs)\
  \ {\n        super(fragmentActivity);\n        this.tabCount = numberOfTabs;\n \
  \   }\n    @NonNull\n    @Override\n    public Fragment createFragment(int position)\
  \ {\n        switch (position) {\n            case 0:\n                return new\
  \ Tab1Fragment();\n            case 1:\n                return new Tab2Fragment();\n\
  \            case 2:\n                return new Tab3Fragment();\n            case\
  \ 3:\n                return new Tab4Fragment();\n            default:\n       \
  \         return null;\n        }\n    }\n    @Override\n    public int getItemCount()\
  \ {\n        return tabCount;\n    }\n}\n```\n\n\n\n\n\n该类被声明为扩展 `FragmentPagerAdapter`\
  \ 类，并实现了一个构造函数，允许在创建实例时将所需的页面数量传递给该类。当需要特定页面时，将调用 `createFragment()` 方法。使用 `switch`\
  \ 语句来识别请求请求的页码并返回对应的 fragment 实例。最后，`getItemCount()` 方法简单地返回创建对象实例时传递的计数值。\n\n##\
  \ 46.8 执行初始化任务\n\n剩余的任务涉及初始化 `TabLayout`、`ViewPager2` 和 `TabPagerAdapter` 实例，并声明\
  \ `MainActivity` 类实现针对四个 tab fragment 的片段交互监听器。编辑 `MainActivity.java` 文件，使其内容如下：\n\
  \n```java\npackage com.ebookfrenzy.tablayoutdemo;\n\n.\n.\n\nimport android.net.Uri;\n\
  \nimport com.google.android.material.tabs.TabLayoutMediator;\n\n.\n.\n\npublic class\
  \ MainActivity extends AppCompatActivity implements\n\nTab1Fragment.OnFragmentInteractionListener,\n\
  \      Tab2Fragment.OnFragmentInteractionListener,\n      Tab3Fragment.OnFragmentInteractionListener,\n\
  Tab4Fragment.OnFragmentInteractionListener {\n\n    @Override\n    protected void\
  \ onCreate(Bundle savedInstanceState) {\n.\n.\n        configureTabLayout();\n \
  \   }\n\n    protected void configureTabLayout() {\n        for (int i = 0; i <\
  \ 4; i++) {\n            binding.tabLayout.addTab(binding.tabLayout.newTab());\n\
  \        }\n        final TabPagerAdapter adapter = new TabPagerAdapter\n      \
  \              (this, binding.tabLayout.getTabCount());\n        binding.viewPager.setAdapter(adapter);\n\
  \        new TabLayoutMediator(binding.tabLayout, binding.viewPager,\n         \
  \           (tab, position) -> tab.setText(\"Tab \" + (position + 1) +\n       \
  \                                      \" Item\")).attach();\n    }\n\n    @Override\n\
  \    public void onFragmentInteraction(Uri uri) {\n\n    }\n.\n.\n}\n```\n\n代码首先创建四个标签并将它们添加到\
  \ `TabLayout` 实例中，如下所示：\n\n```java\nfor (int i = 0; i < 4; i++) {\n    binding.tabLayout.addTab(binding.tabLayout.newTab());\n\
  }\n```\n\n接下来，创建 `TabPagerAdapter` 类的实例。注意，创建 `TabPagerAdapter` 实例的代码传递了分配给 `TabLayout`\
  \ 组件的标签数量。然后，将 `TabPagerAdapter` 实例赋值为 `ViewPager2` 实例的适配器：\n\n```java\nfinal TabPagerAdapter\
  \ adapter = new TabPagerAdapter\n        (this, binding.tabLayout.getTabCount());\n\
  binding.viewPager.setAdapter(adapter);\n```\n\n最后，使用 `TabLayoutMediator` 类实例来连接\
  \ `TabLayout` 和 `ViewPager2` 对象：\n\n```java\nnew TabLayoutMediator(binding.tabLayout,\
  \ binding.viewPager,\n            (tab, position) -> tab.setText(\"Tab \" + (position\
  \ + 1) + \" Item\")).attach();\n```\n\n该类确保了 `TabLayout` 标签与当前选中的片段保持同步。此过程的一部分是确保每个标签上显示正确的文本。在这种情况下，文本被配置为“Tab\
  \ <n> Item”，其中 `<n>` 被替换为当前选定标签的数字。\n\n## 46.9 测试应用程序\n\n在设备或模拟器上编译并运行应用，并确保选择一个标签会导致相应的片段出现在屏幕的内容区域：\n\
  \n![](img/as_4.1_tab_layout_running.jpg)\n\n图 46-6\n\n## 46.10 自定义 TabLayout\n\n\
  此示例项目中的 `TabLayout` 是使用固定模式（fixed）配置的。这种模式适用于数量少且标题短的标签。当使用固定模式时，更多的标签或更长的标题可能会迅速变成问题，如图\
  \ 46-7 所示：\n\n![](img/as_4.1_tab_layout_truncated.jpg)\n\n图 46-7\n\n为了让标签适应可显示宽度，`TabLayout`\
  \ 使用了多行文本。尽管如此，第二行明显被截断了。解决此问题的最佳方案是将 `TabLayout` 切换为滚动模式（scrollable），如图 46-8 所示：\n\
  \n![](img/as_4.1_tab_layout_scrollable.jpg)\n\n图 46-8\n\n要将 `TabLayout` 切换为滚动，只需将\
  \ `activity_main.xml` 文件中的 `tabMode` 属性从 `fixed` 更改为 `scrollable` 即可：\n\n```xml\n\
  <support.android.material.widget.TabLayout\n    android:id=\"@+id/tabLayout\"\n\
  \    android:layout_width=\"match_parent\"\n    android:layout_height=\"wrap_content\"\
  \n    app:tabMode=\"scrollable\"\n    app:tabGravity=\"fill\"/>\n```\n\n当 `tabGravity`\
  \ 设置为 `fill` 时（例如），项将均匀分布在整个宽度上，如图 46-9 所示：\n\n![](img/as_4.1_tab_layout_fill.jpg)\n\
  \n图 46-9\n\n将属性值更改为 `center` 将导致项相对于标签栏的中心进行定位：\n\n![](img/as_4.1_tab_layout_center.jpg)\n\
  \n图 46-10\n\n在继续本章的最后一步之前，将 `activity_main.xml` 中的 `tabMode` 和 `tabGravity` 属性分别还原为\
  \ `fixed` 和 `center`。\n\n## 46.11 总结\n\n`TabLayout` 是 Android Material 设计引入的组件之一。`TabLayout`\
  \ 组件的目的是展示一系列标签项，当这些项被选中时，会向用户显示不同的内容。标签项可以显示文本、图像或两者的结合。当与 `ViewPager2` 类和片段结合时，可以轻松地创建标签布局，每个标签项显示一个片段。\n\
  \n# 47 使用 RecyclerView 和 CardView\n\n`RecyclerView` 和 `CardView` 控件共同工作，提供可滚的信息列表，其中信息以单个卡片的形式呈现。在本章中处理示例项目的设计和实现之前，将介绍这两个类的详细信息。\n\
  \n## 47.1 RecyclerView 概述\n\n与章节 Floating_Action_Button.xhtml__idTextAnchor910)\
  \ [使用悬浮操作按钮和 Snackbar 中概述的 `ListView` 类一样，`RecyclerView` 的目的是允许以滚动列表的形式向用户展示信息。然而，`RecyclerView`\
  \ 相比 `ListView` 有许多优势。特别是，`RecyclerView` 在管理构成列表的视图方面要高效得多，它实际上通过复用滚动出屏幕的列表项视图，而不是创建新视图（因此名为“回收器”/recycler）。这既提高了性能，又减少了列表使用的资源，这一特性在向用户展示大量数据时特别有益。\n\
  \n与 `ListView` 不同，`RecyclerView` 还提供了三种内置布局管理器，用于控制列表项向用户展示的方式：\n\n- `LinearLayoutManager`\
  \ —— 列表项以水平或垂直滚动列表的形式呈现。\n\n![](img/Image2427.jpg)\n\n图 47-1\n\n- `GridLayoutManager`\
  \ —— 列表项以网格格式呈现。这种管理器适用于列表项大小均匀的情况。\n\n![](img/Image2436.jpg)\n\n图 47-2\n\n- `StaggeredGridLayoutManager`\
  \ —— 列表项以交错网格格式呈现。这种管理器适用于列表项大小不均匀的情况。\n\n![](img/Image2443.jpg)\n\n图 47-3\n\n\n\
  \n\n\n当三个内置管理器都无法提供所需的布局时，可以通过子类 `RecyclerView.LayoutManager` 类来实现自定义布局管理器。\n\n\
  在 `RecyclerView` 中显示的每个列表项都是作为 `ViewHolder` 类的实例被创建的。`ViewHolder` 实例包含了 `RecyclerView`\
  \ 显示列表项所需的所有内容，包括要显示的信息和用于显示该项的视图布局。\n\n与 `ListView` 一样，`RecyclerView` 依赖于一个适配器（adapter）作为\
  \ `RecyclerView` 实例与要显示给用户的数据之间中介。该适配器被创建为 `RecyclerView.Adapter` 类的子类，并且至少必须实现以下方法，这些方法将在分配给该适配器的\
  \ `RecyclerView` 对象在不同时间点被调用：\n\n*   `getItemCount()` – 此方法必须返回列表中要显示的项目数量计数。\n\
  *   `onCreateViewHolder()` – 此方法创建并返回一个 `ViewHolder` 对象，该对象使用用于显示数据的视图进行初始化。此视图通常通过膨胀（inflate）XML\
  \ 布局文件创建。\n*   `onBindViewHolder()` – 此方法接收由 `onCreateViewHolder()` 方法创建的 `ViewHolder`\
  \ 对象，以及一个指示即将显示的列表项的整数值。`ViewHolder` 对象中包含了 `onCreateViewHolder()` 方法分配的布局。`onBindViewHolder()`\
  \ 方法的责任是将布局中的视图填充与指定项目对应的文本和图形，并将该对象返回给 `RecyclerView`，从而向用户展示。\n\n在布局中添加 `RecyclerView`\
  \ 只需要在它将出现的 Activity 的 XML 内容布局文件中添加相应的元素即可。例如：\n\n```xml\n<?xml version=\"1.0\"\
  \ encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n   \
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    app:layout_behavior=\"@string/appbar_scrolling_view_behavior\"\n    tools:context=\"\
  .MainActivity\"\n    tools:showIn=\"@layout/activity_card_demo\">\n    <androidx.recyclerview.widget.RecyclerView\n\
  \        android:id=\"@+id/recycler_view\"\n        android:layout_width=\"0dp\"\
  \n        android:layout_height=\"0dp\"\n        app:layout_constraintBottom_toBottomOf=\"\
  parent\"\n        app:layout_constraintEnd_toEndOf=\"parent\"\n        app:layout_constraintStart_toStartOf=\"\
  parent\"\n        app:layout_constraintTop_toTopOf=\"parent\"\n        tools:listItem=\"\
  @layout/card_layout\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n在上面的示例中，`RecyclerView` 被嵌入到主 Activity 布局文件的 `CoordinatorLayout` 中，并与 `AppBar`\
  \ 和 `Toolbar` 在一起。这提供了一些额外功能，例如配置 `Toolbar` 和 `AppBar`，当用户在 `RecyclerView` 中向上滚动时，它们会滚出屏幕（该主题在名为“使用\
  \ AppBar 和 Collapsing Toolbar Layout”的章节中会有更详细的介绍）。\n\n## 47.2 CardView 概述\n\n`CardView`\
  \ 类是一种用户界面视图，允许使用卡片比喻来分组展示信息。卡片通常使用 `RecyclerView` 实例以列表形式呈现，并可以配置为带有阴影效果和圆角出现。例如，图中显示了三个配置为显示由\
  \ `ImageView` 和两个 `TextView` 组成的布局的 `CardView` 实例：\n\n![](img/Image24512.jpg)\n\n\
  图 47-4\n\n随 `CardView` 实例呈现的用户界面布局定义在 XML 布局资源文件中，并在运行时加载到 `CardView` 中。`CardView`\
  \ 布局可以包含任何复杂性的布局，使用如 `RelativeLayout` 和 `LinearLayout` 等标准布局管理器。下面的 XML 布局文件表示了一个由\
  \ `RelativeLayout` 和单个 `ImageView` 组成的卡片视图布局。该卡片被配置为提升以创建阴影效果，并带有圆角显示：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.cardview.widget.CardView\n\
  \    xmlns:card_view=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    android:id=\"@+id/card_view\"\n\
  \    android:layout_width=\"match_parent\"\n    android:layout_height=\"wrap_content\"\
  \n    android:layout_margin=\"5dp\"\n    card_view:cardRadius=\"12dp\"\n    card_view:cardElevation=\"\
  3dp\"\n    card_view:contentPadding=\"4dp\">\n    <RelativeLayout\n        android:layout_width=\"\
  match_parent\"\n        android:layout_height=\"wrap_content\"\n        android:padding=\"\
  16dp\">\n        <ImageView\n            android:id=\"@+id/item_image\"\n      \
  \      android:layout_width=\"100dp\"\n            android:layout_height=\"100dp\"\
  \ />\n    </RelativeLayout>\n</androidx.cardview.widget.CardView>\n```\n\n当与 `RecyclerView`\
  \ 结合创建可滚动卡片列表时，回收视图的 `onCreateViewHolder()` 方法会膨胀卡片的布局文件，将其分配给 `ViewHolder` 实例并返回。\n\
  \n## 47.3 总结\n\n本章介绍了 Android `RecyclerView` 和 `CardView` 组件。`RecyclerView` 提供了一种资源高效的方式来显示滚动列表。`CardView`\
  \ 在以卡片形式呈现分组数据（如姓名和地址）时有用。正如前面提到的，两者结合使用时效果更佳。\n\n# 48 RecyclerView 和 CardView 教程\n\
  \n在本章中，将创建一个示例项目，利用 `CardView` 和 `RecyclerView` 组件创建一个可滚动卡片列表。完成后的应用将显示包含图像和文本的卡片列表。除了显示卡片列表外，项目还将实现选择卡片时向用户显示点击了哪张卡片。\n\
  \n## 48.1 创建 CardDemo 项目\n\n在欢迎屏幕上选择 New Project，在出现的新项目对话框中选择 Basic Activity 模板，然后点击\
  \ Next。\n\n在 Name 字段中输入 `CardDemo` 并指定 `com.ebookfzy.carddemo` 为包名。在点击 Finish 按钮之前，将\
  \ Minimum API level 设置为 `API 26: Android 8.0 (Oreo)`，并将 Language 菜单更改为 `Java`。\n\
  \n## 48.2 修改 Basic Activity 项目\n\n由于选择了 Basic Activity，布局中包含一个悬浮按钮，但此项目不需要它。加载 `activity_main.xml`\
  \ 布局文件到 Layout Editor 工具，选择悬浮按钮并按键盘删除键将其从布局中移除。编辑 `MainActivity.java` 文件，从 `onCreate`\
  \ 方法中删除悬浮按钮和导航控制器代码，如下：\n\n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState)\
  \ {\n    super.onCreate(savedInstanceState);\n    binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \    setContentView(binding.getRoot());\n    setSupportActionBar(binding.toolbar);\n\
  \    NavController navController = Navigation.findNavController(this, R.id.nav_host_fragment_content_main);\n\
  \    appBarConfiguration = new AppBarConfiguration.Builder(navController.getGraph()).build();\n\
  }\n```\n\n\n\n\n\n```java\nNavigationUI.setupActionBarWithNavController(this, navController,\
  \ appBarConfiguration);\n\nbinding.fab.setOnClickListener(new View.OnClickListener()\
  \ {\n    @Override\n    public void onClick(View view) {\n        Snackbar.make(view,\
  \ \"Replace with your own action\", Snackbar.LENGTH_LONG)\n                .setAction(\"\
  Action\", null).show();\n    }\n});\n```\n\n此外，移除 `onSupportNavigateUp()` 方法，然后打开\
  \ `content_main.xml` 文件并从布局中删除 `nav_host_fragment_content_main` 对象，只保留 `ConstraintLayout`\
  \ 父布局。\n\n## 48.3 设计 CardView 布局\n\n卡片内包含的视图布局将在单独的 XML 文件中定义。在 `Project` 工具窗口中，右键点击\
  \ `app` -> `res` -> `layout` 项，并选择 `New` -> `Layout Resource File` 菜单。在 `New Resource\
  \ Dialog` 中，在 `File name:` 字段中输入 `card_layout`，并在点击 `OK` 之前在根元素字段中输入 `androidx.cardview.widget.CardView`。\n\
  \n将 `card_layout.xml` 文件加载到 `Layout Editor` 工具中，切换到 `Code` 模式并修改布局如下所示：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.cardview.widget.CardView\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    android:layout_width=\"match_parent\"\
  \n    android:layout_height=\"wrap_content\"\n    android:id=\"@+id/card_view\"\n\
  \    android:layout_margin=\"5dp\"\n    app:cardBackgroundColor=\"#81C784\"\n  \
  \  app:cardCornerRadius=\"12dp\"\n    app:cardElevation=\"3dp\"\n    app:contentPadding=\"\
  4dp\">\n    <androidx.constraintlayout.widget.ConstraintLayout\n        android:id=\"\
  @+id/relativeLayout\"\n        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  wrap_content\"\n        android:padding=\"16dp\">\n        <ImageView\n        \
  \    android:id=\"@+id/itemImage\"\n            android:layout_width=\"100dp\"\n\
  \            android:layout_height=\"100dp\"\n            app:layout_constraintLeft_toLeftOf=\"\
  parent\"\n            app:layout_constraintStart_toStartOf=\"parent\"\n        \
  \    app:layout_constraintTop_toTopOf=\"parent\" />\n        <TextView\n       \
  \     android:id=\"@+id/itemTitle\"\n            android:layout_width=\"236dp\"\n\
  \            android:layout_height=\"39dp\"\n            android:layout_marginStart=\"\
  16dp\"\n            android:textSize=\"30sp\"\n            app:layout_constraintLeft_toRightOf=\"\
  @+id/itemImage\"\n            app:layout_constraintStart_toEndOf=\"@+id/itemImage\"\
  \n            app:layout_constraintTop_toTopOf=\"parent\" />\n        <TextView\n\
  \            android:id=\"@+id/itemDetail\"\n            android:layout_width=\"\
  236dp\"\n            android:layout_height=\"16dp\"\n            android:layout_marginStart=\"\
  16dp\"\n            android:layout_marginTop=\"8dp\"\n            app:layout_constraintLeft_toRightOf=\"\
  @+id/itemImage\"\n            app:layout_constraintStart_toEndOf=\"@+id/itemImage\"\
  \n            app:layout_constraintTop_toBottomOf=\"@+id/itemTitle\" />\n    </androidx.constraintlayout.widget.ConstraintLayout>\n\
  </androidx.cardview.widget.CardView>\n```\n\n## 48.4 添加 RecyclerView\n\n选择 `content_main.xml`\
  \ 文件，从调色板的 `Containers` 部分将 `RecyclerView` 对象拖放到布局中，使其位于屏幕中心，此时它将自动调整大小以填满整个屏幕。使用\
  \ `Infer` 工具栏添加任何缺失的布局约束。使用 `Attributes` 窗口将 `RecyclerView` 实例的 `ID` 更改为 `recyclerView`，并将\
  \ `layout_width` 和 `layout_height` 属性更改为 `match_constraint`。\n\n## 48.5 添加文件\n\n\
  除了两个 `TextView` 外，卡片布局还包含一个 `ImageView`，`Recycler adapter` 已配置为显示图像。在可以测试项目之前，必须添加这些图像。项目将使用的图像命名为\
  \ `android_image_<n>.jpg`，可以在该 URL 提供的示例代码中的 `project_icons` 文件夹中找到：https://www.ebookrenzy.com/retail/arcticjava/index.php\n\
  \n在操作系统的文件导航器中找到这些图像，选择并复制这八张图像。在 `Project` 工具窗口中右键点击 `app` -> `res` -> `drawable`\
  \ 项并选择 `Paste` 将文件添加到文件夹中。\n\n## 48.6 创建 RecyclerView Adapter\n\n如上一章所述，`RecyclerView`\
  \ 需要一个适配器来处理列表项的创建。在 `Project` 工具窗口中右键点击 `app` -> `java` -> `com.ebookrenzy.carddemo`\
  \ 项并选择 `New` -> `Java Class` 菜单选项，将此新类添加到项目中。在类对话框中，在 `Name` 字段中输入 `RecyclerAdapter`\
  \ 并从列表中选择 `Class`，然后按回车键创建新的 Java 类文件。\n\n编辑 `RecyclerAdapter.java` 文件以添加导入指令并声明该类现在继承\
  \ `RecyclerView.Adapter`。与其创建一个单独的类来提供显示的数据，不如向适配器添加一些基础数组作为应用程序的数据：\n\n```java\n\
  package com.ebookrenzy.carddemo;\n\nimport android.view.LayoutInflater;\nimport\
  \ android.view.View;\nimport android.view.ViewGroup;\nimport android.widget.ImageView;\n\
  import android.widget.TextView;\nimport androidx.recyclerview.RecyclerView;\n\n\
  public class RecyclerAdapter extends RecyclerView.Adapter<RecyclerAdapter.ViewHolder>\
  \ {\n    private String[] titles = {\"Chapter One\", \"Chapter Two\", \"Chapter\
  \ Three\", \"Chapter Four\", \"Chapter Five\", \"Chapter Six\", \"Chapter Seven\"\
  , \"Chapter Eight\"};\n    private String[] details = {\"Item one details\", \"\
  Item two details\", \"Item three details\", \"Item four details\", \"Item five details\"\
  , \"Item six\", \"Item seven\", \"Item eight\"};\n    private int[] images = {R.drawable.android_image_1,\
  \ R.drawable.android_image_2, R.drawable.android_image_3, R.drawable.android_image_4,\
  \ R.drawable.android_image_5, R.drawable.android_image_6, R.drawable.android_image_7,\
  \ R.drawable.android_image_8};\n}\n```\n\n在 `RecyclerAdapter` 类中，我们现在需要 `ViewHolder`\
  \ 的自定义实现，配置以引用 `card_layout.xml` 文件中的视图元素。留在 `RecyclerAdapter.java` 文件中，如下所示实现此类：\n\
  \n```java\nclass ViewHolder extends RecyclerView.ViewHolder {\n    ImageView itemImage;\n\
  \    TextView itemTitle;\n    TextView itemDetail;\n\n    ViewHolder(View itemView)\
  \ {\n        super(itemView);\n        itemImage = itemView.findViewById(R.id.itemImage);\n\
  \        itemTitle = itemView.findViewById(R.id.itemTitle);\n        itemDetail\
  \ = itemView.findViewById(R.id.itemDetail);\n    }\n}\n```\n\n\n\n\n此方法将由 `RecyclerView`\
  \ 调用以获取一个 `ViewHolder` 对象。它会展开视图层结构文件 `card_layout.xml`，并创建一个 `ViewHolder` 类的实例，在初始化时传入该视图层结构，然后将其返回给\
  \ `RecyclerView`。\n\n`onBindViewHolder()` 方法的作用是将要显示的数据填充到 `ViewHolder` 对象中的视图层结构中。它接收一个\
  \ `ViewHolder` 对象和一个表示要显示列表项的整数值。现在应该添加此方法，并使用项目编号作为数据数组的索引。然后，这些数据将使用 `ViewHolder`\
  \ 类构造方法中创建的引用显示在布局视图：\n\n```java\n@Override\npublic void onBindViewHolder(ViewHolder\
  \ viewHolder, int i) {\n    viewHolder.itemTitle.setText(titles[i]);\n    viewHolder.itemDetail.setText(details[i]);\n\
  \    viewHolder.itemImage.setImageResource(images[i]);\n}\n```\n\n适配器类的最后一个要求是实现\
  \ `getItemCount()` 方法，在当前情况下，它只需返回 `titles` 数组中的项目数量：\n\n```java\n@Override\npublic\
  \ int getItemCount() {\n    return titles.length;\n}\n```\n\n## 48.7 初始化 RecyclerView\
  \ 组件\n\n此时，项目包含一个 `RecyclerView` 实例、一个用于 `CardView` 实例的 XML 布局文件以及一个 `RecyclerView`\
  \ 适配器。在测试目前进展之前的最后一步是使用布局管理器初始化 `RecyclerView`，创建适配器实例并将该实例分配给 `RecyclerView` 对象。为了本示例的目的，`RecyclerView`\
  \ 将配置为使用 `LinearLayoutManager` 布局选项。\n\n这里有一点小复杂之处，因为我们需要能够使用视图绑定（view binding）从\
  \ `MainActivity` 类内部访问 `recyclerView` 组件。问题是 `recyclerView` 包含在 `content_main.xml`\
  \ 布局文件中，而该文件又被包含在 `activity_main.xml` 中。为了能够访问 `content_main.xml` 文件，我们需要在包含它时为其分配一个\
  \ `id`。要做到这一点，请编辑 `activity_main.xml` 文件并修改 `include` 元素，如下所示：\n\n```xml\n<include\n\
  \    android:id=\"@+id/contentMain\"\n    layout=\"@layout/content_main\" />\n```\n\
  \n为包含的文件分配了 `id` 后，可以使用以下绑定访问 `recyclerView` 组件：\n\n现在编辑 `MainActivity.java` 文件并修改\
  \ `onCreate()` 方法以实现初始化代码：\n\n```java\npackage com.ebookfrenzy.carddemo;\n\n...\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\nimport androidx.appcompat.widget.Toolbar;\n\
  import androidx.recyclerview.widget.LinearLayoutManager;\nimport androidx.recyclerview.widget.RecyclerView;\n\
  import android.view.View;\nimport android.view.Menu;\nimport android.view.MenuItem;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private RecyclerView\
  \ recyclerView;\n    private RecyclerView.LayoutManager layoutManager;\n    private\
  \ RecyclerView.Adapter adapter;\n\n...\n\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n...\n        setSupportActionBar(toolbar);\n        layoutManager\
  \ = new LinearLayoutManager(this);\n        binding.contentMain.recyclerView.setLayoutManager(layoutManager);\n\
  \        adapter = new RecyclerAdapter();\n        binding.contentMain.recyclerView.setAdapter(adapter);\n\
  \    }\n\n...\n}\n```\n\n## 48.8 测试应用程序\n\n在物理设备或模拟器会话上编译并运行应用，然后滚动列表中的不同的卡片项：\n\
  \n![](img/Image24342.jpg)\n\n图 48-2\n\n## 48.9 响应卡片选择\n\n本项目的最后一个阶段是使列表中的卡片变为可选选择，这样点击卡片就会触发应用中的事件。对于此示例，卡片将被配置为在用户点击时在屏幕上显示一条消息。为了响应点击，需要修改\
  \ `ViewHolder` 类，为每个项视图分配一个 `OnClickListener`。编辑 `RecyclerAdapter.java` 文件并修改 `ViewHolder`\
  \ 类声明，如下所示：\n\n```java\n...\nimport com.google.android.material.snackbar.Snackbar;\n\
  \n...\n\nclass ViewHolder extends RecyclerView.ViewHolder{\n    ImageView itemImage;\n\
  \    TextView itemTitle;\n    TextView itemDetail;\n    ViewHolder(View itemView)\
  \ {\n        super(itemView);\n        itemImage = itemView.findViewById(R.id.item_image);\n\
  \        itemTitle = itemView.findViewById(R.id.item_title);\n        itemDetail\
  \ = itemView.findViewById(R.id.item_detail);\n        itemView.setOnClickListener(new\
  \ View.OnClickListener() {\n            @Override\n            public void onClick(View\
  \ v) {\n            }\n        });\n    }\n}\n```\n\n在 `onClick` 处理程序的体内部，现在可以添加代码来显示消息。鉴于作为点击执行的操作取决于点击了哪张卡片，因此识别所选卡片也很重要。可以通过调用\
  \ `getPosition()` 获取此信息。留在 `RecyclerAdapter.java` 中，为 `onClick` 处理程序添加代码，如下所示：\n\
  \n```java\nint position = getPosition();\nSnackbar.make(v, \"Click detected on item\
  \ \" + (position + 1), Snackbar.LENGTH_LONG).show();\n}\n```\n\n最后一个任务是启用项被点击时出现的材质设计波纹效果（ripple\
  \ effect）。这只需向 `card_layout.xml` 文件中的 `CardView` 实例添加一些属性即可：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<androidx.cardview.widget.CardView\n    xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:card_view=\"http://schemas.android.com/apk/res-auto\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    android:id=\"@+id/card_view\"\n    android:layout_margin=\"5dp\"\n    app:cardBackgroundColor=\"\
  #81C784\"\n    app:cardCornerRadius=\"12dp\"\n    app:cardElevation=\"3dp\"\n  \
  \  app:contentPadding=\"4dp\"\n    android:foreground=\"?selectableItemBackground\"\
  \n    android:clickable=\"true\" >\n```\n\n再次运行应用，验证点击列表中的卡片是否会触发触处的标准波纹效果，以及显示选中项目编号的\
  \ Snackbar。\n\n## 48.10 总结\n\n本章介绍了结合 `CardView` 和 `RecyclerView` 组件以显示可滚动卡片项列表的步骤。示例还涵盖了列表项点击检测，包括识别所选项以及在被点击的\
  \ `CardView` 实例上启用视觉反馈。\n\n## 49. 布局编辑器示例数据教程\n\n在前章节中创建的 CardDemo 项目提供了一个很好的例子，说明了在测试完成应用之前，很难从布局编辑器内部准确评估用户界面将是种样子。当用户界面中显示的内容只有在用户安装并运行应用后才会被生成或获取时，这是一个经常出现的问题。\n\
  \n 49.1 向项目添加示例数据\n\n\n\n\n在用户界面布局的设计阶段，`RecyclerView` 实例（#图 49-1）与上一章末尾测试的运行应用程序几乎没有相似之处：\n\
  \n![](img/as_3.6_recyclerview_no_sample_data.jpg)\n\n图 49-1\n\n在书中前面的“使用 Jetpack\
  \ 构建现代 Android 应用架构”章节中，介绍了样本数据的概念。为了演示样本数据的使用，现在将对项目进行修改，以便在布局编辑器中 `RecyclerView`\
  \ 中显示完全填充的卡片。然而，在此之前，值得注意的是布局编辑器有一组预配置的样本数据模板，可以在设计用户界面时使用。要查看这些模板的实际效果，将 `content_main.xml`\
  \ 布局文件加载到布局编辑器并选择 `RecyclerView` 实例。右键点击 `RecyclerView` 并选择 `Set Sample Data`（设置样本数据）菜单选项，以显示设计视图属性（Design-time\
  \ View Attributes）面板：\n\n![](img/as_3.2_design_time_attributes.jpg)\n\n图 49-2\n\n\
  将模板更改为 `Email Client` 选项并将项目计数更改为 12，注意 `RecyclerView` 发生变化以显示来自模板的数据：\n\n![](img/as_3.6_recyclerview_sample_data_email.jpg)\n\
  \n图 49-3\n\n这些模板可以用于无需任何额外工作即可显示样本数据，并且通常提供足够完成布局设计的内容。然而，对于此示例，将使用样本数据显示 `RecyclerView`\
  \ 中的卡片，正如它们在运行应用程序中预期的样子。当 `content_main.xml` 文件仍加载在布局编辑器中时，切换到 `Code` 模式并找到 `RecyclerView`\
  \ 元素，其内容如下：\n\n```xml\n<androidx.recyclerview.widget.RecyclerView\n    android:id=\"\
  @+id/recyclerView\"\n    android:layout_width=\"0dp\"\n    android:layout_height=\"\
  0dp\"\n    app:layout_constraintBottom_toBottomOf=\"parent\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\"\n    tools:itemCount=\"12\"\n    tools:listitem=\"@layout/recycler_view_item\"\
  \ />\n```\n\n注意当前配置的两个特殊的 `tools` 属性，用于在列表中显示 12 个项目，每个项目使用包含在 `recycler_view_item.xml`\
  \ 文件中的布局。布局编辑器了一系列可以在布局文件中配置的 `tools` 选项。虽然涵盖所有这些设置超出了本书的范围，但可以在以下 URL 找到每个设置的完整说明：\n\
  \nhttps://developer.android.com/studio/write/tool-attributes#toolssample_resources\n\
  \n上述引用的 `recycler_view_item.xml` 文件是布局编辑器在选择样本数据模板时自动生成的，可以在项目工具窗口中找到。\n\n切换回 `Design`\
  \ 模式，并在选中 `RecyclerView` 的情况下，使用设计视图属性面板将模板切回默认设置。`recycler_view_item.xml` 文件将从项目从删除，同时\
  \ `content_main.xml` XML 文件中的两个 `tools` 属性行也会被删除（如果 Android Studio 未能删除这些行，则可以在\
  \ `Code` 视图中手动删除）。\n\n要切换到使用卡片布局显示样本数据，添加一个 `listitem` 属性以引用 `card_layout.xml` 文件。在布局中选中\
  \ `RecyclerView` 的情况下，在属性（Attributes）工具窗口中搜索 `listitem` 属性，并在属性字段中输入 `@layout/card_layout`，如图\
  \ 49-4 所示：\n\n![](img/as_4.1_sample_data_list_item.jpg)\n\n图 49-4\n\n切换回 `Design`\
  \ 模式，注意每个列表项现在都显示卡片布局，尽管没有任何图像且使用的是样本文本数据：\n\n![](img/as_3.6_recyclerview_sample_data_car_layout.jpg)\n\
  \n图 49-5\n\n下一步是在卡片布局的视图中显示一些图像和不同的文本。这既可以是布局编辑器提供的模板样本数据形式，也可以是专门为此项目添加的自定义样本数据形式。将\
  \ `card_layout.xml` 文件加载到布局编辑器中，选择 `ImageView` 并如本章前面的所述显示设计视图属性面板。从 `srcCompat`\
  \ 菜单中，选择内置的 `backgrounds/scenic` 图像集，如下方的图 49-6 所示：\n\n![](img/as_3.6_recyclerview_sample_data_background_images.jpg)\n\
  \n图 49-6\n\n接下来，右键点击 `itemTitle` TextView 对象，选择 `Set Sample Data` 菜单选项，并在设计属性面板中选择\
  \ `cities` 文本选项。对 `itemDetail` 重复此步骤，这次选择 `full_names` 选项，如图 49-7 所示：\n\n![](img/as_3.6_recyclerview_sample_data_full_names.jpg)\n\
  \n图 49-7\n\n在 `Design` 模式下打开 `content_main.xml` 文件，注意 `RecyclerView` 现在使用了内置图像和样本数据：\n\
  \n![](img/as_3.6_recyclerview_sample_data_cities.jpg)\n\n图 8\n\n## 使用自定义数据\n\n本章的最后一步是在卡片布局的视图中使用自定义样本数据和图像。这需要创建\
  \ `sampledata` 目录并添加文本文件。在工具窗口中，右键点击 `app` 并选择 `Sample Data`，此时会出现一个名为 `sampledata`\
  \ 的新目录。如果新文件夹不可见，将工具窗口从 `Android` 切换到 `Project` 模式，如图 49-9 所示：\n\n![](img/as_4.2_sample_data_folder.jpg)\n\
  \n9\n\n右键点击 `sampledata` 目录，按照本章之前的步骤创建 `images` 子目录。再次显示 `ImageView` 的设计属性，这次点击\
  \ `Browse` 链接并在资源对话框中选择新添加的 Android 图像（如果文件夹没有出现，请尝试构建项目）：\n\n![](img/as_4.1_sample_data_pick.jpg)\n\
  \n10\n\n再次右键点击 `sampledata` 目录，选择 `New -> File` 选项，将文件命名为 `chapters`，在新文件对话框中选择\
  \ `Text`，并输入以下内容：\n\n```text\nChapter One\nChapter Two\nChapter Three\nChapter Four\n\
  Chapter Five\nChapter Six\nChapter Seven\nChapter Eight\n```\n\n接下来，创建一个名为 `items`\
  \ 的第二个文本文件，内容如下：\n\n```text\nItem one details\nItem two details\nItem three details\n\
  Item four details\nItem five details\nItem six details\nItem seven details\nItem\
  \ eight details\n```\n\n创建样本数据文本文件，剩下的是在 `card_layout.xml` 文件的视图元素中引用它们，如下：\n\n\
  ```xml\n<TextView\n    android:id=\"@+id/itemTitle\"\n    android:layout_width=\"\
  236dp\"\n    android:layout_height=\"39dp\"\n    android:layout_marginStart=\"16dp\"\
  \n    android:textSize=\"30sp\"\n    app:layout_constraintLeft_toRightOf=\"@+id/itemImage\"\
  \n    app:layout_constraintStart_toEndOf=\"@+id/itemImage\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\"\n    tools:text=\"@sample/chapters\" />\n\n<TextView\n    android:id=\"\
  @+id/itemDetail\"\n    android:layout_width=\"236dp\"\n    android:layout_height=\"\
  16dp\"\n    android:layout_marginStart=\"16dp\"\n    android:layout_marginTop=\"\
  8dp\"\n    app:layout_constraintLeft_toRightOf=\"@+id/itemImage\"\n    app:layout_constraintStart_toEndOf=\"\
  @+id/itemImage\"\n    app:layout_constraintTop_toBottomOf=\"@+id/itemTitle\"\n \
  \   tools:text=\"@sample/items\" />\n```\n\n返回 `content_main.xml` 文件中的布局设计，此时自定义样本数据和图像现在应该显示在\
  \ `RecyclerView` 列表中：\n\n\n\n\n\n![](img/as_3.6_sample_data_running.jpg)\n\n####\
  \ 图 49-11\n\n与其使用两个独立的文本文件并对图像集的引用，另一种方案是在 `JSON` 文件中声明示例数据。例如：\n\n```json\n{\n\
  \  \"mydata\": [\n    {\n      \"chapter\" : \"Chapter One\",\n      \"details\"\
  : \"Item one details\",\n      \"image\": \"@sample/images\"\n    },\n    {\n  \
  \    \"chapter\" : \"Chapter Two\",\n      \"details\": \"Item two details\",\n\
  \      \"image\": \"@sample/images\"\n    }\n  ]\n}\n```\n\n假设上述内容位于名为 `chapterdata.json`\
  \ 的文件中，则示例数据将如下所示在视图 XML 元素中引用：\n\n```xml\n<ImageView\n    tools:src=\"@sample/chapterdata.json/mydata/image\"\
  \ />\n<TextView\n    tools:text=\"@sample/chapterdata.json/mydata/chapter\" />\n\
  <TextView\n    tools:text=\"@sample/chapterdata.json/mydata/details\" />\n```\n\n\
  ## 49.3 总结\n\n本章演示了如何在布局编辑器中使用示例数据，以提供用户界面在运行时外观的更真实表示。本教程涵盖的步骤包括使用预先的示例数据模板以及自定义示例数据的集成。\n\
  \n# 50 配合 AppBar 和折叠工具栏布局使用\n\n在本章中，我们将探索如何自定义 Activity 布局中的 app bar，并使其能够对屏幕上其他视图发生的滚动事件做出响应。通过使用\
  \ `CoordinatorLayout` 结合 `AppBarLayout` 和 `CollapsingToolbarLayout` 容器，可以配置 app\
  \ bar 显示图像并在视图中进行动画淡入和淡出效果。例如，列表上的向上滚动动作可以配置为使 app bar 从视图中退回，然后在执行向下滚动动作时重新出现。\n\
  \n本章将从概述可以组成 app bar 的元素开始介绍，然后介绍各种 app bar 配置的示例。\n\n##### 50.1 AppBar 的结构\n\n\
  App bar 是应用程序运行时显示在显示器顶部的区域，可以配置为包含各种不同的项目，包括状态栏、工具栏（toolbar）、标签页栏（tab bar）和弹性空间区域。例如，图\
  \ 50-1 显示了一个包含状态栏、工具栏和标签页栏的 app bar：\n\n![](img/Image24271.jpg)\n\n图 50-1\n\n弹性空间区域可以用空白背景颜色填充，或者如\
  \ 图 50-2 所示，在 `ImageView` 对象上显示图像：\n\n![](img/Image24361.jpg)\n\n图 50-2\n\n正如本章其余部分将演示的，如果\
  \ Activity 用户界面布局的主内容区域包含可滚动内容，则 app bar 的元素可以根据屏幕上内容的滚动进行展开和收缩。\n\n##### 50.2 示例项目\n\
  \n为了本示例，将对早些章节中创建的标题为 Android RecyclerView 和 CardView 教程 的 `CardDemo` 项目进行更改。首先启动\
  \ Android Studio 并加载此项目。\n\n项目加载后，运行应用并注意当向上滚动列表时，工具栏如 图 50-3 所示保持可见：\n\n![](img/Image24431.jpg)\n\
  \n图 50-3\n\n第一步是进行一些配置更改，使工具栏在向上滚动期间收缩，然后在向下滚动时展开。\n\n##### 50.3 协调 RecyclerView\
  \ 和工具栏\n\n将 `activity_main.xml` 文件加载到布局编辑器工具中，切换到 Code 模式并查看 XML 布局设计，其层级结构由 图 50-4\
  \ 中的图表示：\n\n![](img/as3.0_appbar_coordinatorlayout_tree.jpg)\n\n图 50-4\n\n层级的顶层是\
  \ `CoordinatorLayout`，正如名称所示，它协调其包含的各种子视图元素之间的交互。例如，在“使用悬浮操作按钮和 Snackbar](#Floating_Action_Button.xhtml__idTextAnchor910)\
  \ 中所示，`CoordinatorLayout` 会自动将悬浮操作按钮向上滑动，以容纳 `Snackbar` 的出现，然后在条消失后将按钮移回下方。\n\n\
  `CoordinatorLayout` 同样可以用于根据视图层级中某些视图的滚动动作使 app bar 的元素滑入或滑出视图。在 图 50-4 所示的布局层级中的此类元素是\
  \ `ConstraintLayout`。要实现这种协调行为，必须在发生滚动的元素以及与滚动协调的元素上都设置属性。在滚动元素（在此例中 `RecyclerView`）上，必须将\
  \ `android:layout_behavior` 属性设置为 `appbar_scrolling_behavior`。在 `content_xml` 文件中，找到顶层\
  \ `ConstraintLayout` 元素并注意该属性已默认设置：\n\n```xml\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    app:layout_behavior=\"@string/appbar_scrolling_behavior\">\n```\n\n接下来，在布局编辑器中打开\
  \ `activity_main.xml` 文件，切换到 Code 模式并找到 `AppBarLayout`。注意 `AppBarLayout` 的唯一子元素是\
  \ `Toolbar`。为了让工具栏响应 `RecyclerView` 发生的滚动事件，必须在该元素上设置 `app:layout_scrollFlags` 属性。该属性的值取决于所需的交互性质，并且由以下一个或多个选项组成：\n\
  \n- `scroll`: 表示视图滚动屏幕。如果不设置此项，视图在滚动事件期间将固定在屏幕顶部。\n- `enterAlways`: 与 `scroll` 选项配合使用时，向上滚动会导致视图退回。在此模式下，任何向下滚动都会导致视图重新出现。\n\
  - `enterAlwaysCollapsed`: 设置后，视图在向下滚动到达列表限制之前不会从折叠状态展开。如果设置了 `minHeight` 属性，视图在初始滚动期间会显示，但直到达到最小高度。随后它将保持该高度，直到到达列表顶部才会完全展开。注意此选项仅在与\
  \ `enterAlways` 和 `scroll` 选项配合使用时才有效。\n- `exitUntilCollapsed`: 设置后，视图在向上滚动期间会折叠，直到达到\
  \ `minHeight` 阈值，此时它将保持该高度直到滚动方向改变。\n\n为了本示例，将在 `Toolbar` 上设置 `scroll` 和 `enterAlways`\
  \ 选项：\n\n```xml\n<androidx.appcompat.widget.Toolbar\n    android:id=\"@+id/toolbar\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"?attr/actionBarSize\"\
  \n    android:background=\"?attr/colorPrimary\"\n    app:popupTheme=\"@style/Theme.CardDemo.PopupOverlay\"\
  \n    app:layout_scrollFlags=\"scroll|enterAlways\" />\n```\n\n设置好属性后，再次运行应用并在 `RecyclerView`\
  \ 列表中进行向上滚动动作。这将导致工具栏从视图中折叠（图 50-5）。向下滚动动作将导致工具栏重新出现。\n\n![](img/Image24591.jpg)\n\
  \n图 50-5\n\n\n\n\n\n# 50.4 引入折叠工具栏布局 (Collapsing Toolbar Layout)\n\n`CollapsingToolbarLayout`\
  \ 容器通过提供更多的选项以及对协调滚动动作响应的应用栏（app bar）及其子项折叠的控制级别，增强了标准工具栏的功能。`CollapsingToolbarLayout`\
  \ 类旨在作为 `AppBarLayout` 的子元素添加，并提供了诸如在工具栏折叠和展开时自动调整工具栏标题字体大小等功能。视差模式（parallax mode）允许应用栏中的指定内容在折叠时淡出视图，而固定模式（pin\
  \ mode）则允许应用栏的元素在收缩期间保持在固定位置。\n\n还提供了 `scrim`（遮罩层）选项，用于指定工具栏在折叠序列期间过渡的颜色。\n\n为了演示这些功能，s\
  \ 将修改 `activity_main.xml` 文件中的应用栏，使其使用 `CollapsingToolbarLayout` 类，并添加 `ImageView`\
  \ 以更好地演示视差模式的效果。使用 `CollapsingToolbarLayout` 的新视图层级结构如图图 50-6 所示：\n\n![](img/as3.0_appbar_collapsing_tree.jpg)\n\
  \n图 50-6\n\n将 `activity_main.xml` 文件加载到 Code 模式的布局编辑器中，并修改布局如下：\n\n```xml\n<?xml\
  \ version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.coordinatorlayout.widget.CoordinatorLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    tools:context=\".MainActivity\">\n    <com.google.android.material.appbar.AppBarLayout\n\
  \        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  wrap_content\"\n        android:theme=\"@style/Theme.CardDemo.AppBarOverlay\">\n\
  \        <com.google.android.material.appbar.CollapsingToolbarLayout\n         \
  \   android:id=\"@+id/collapsing_toolbar\"\n            android:layout_width=\"\
  match_parent\"\n            android:layout_height=\"match_parent\"\n           \
  \ app:layout_scrollFlags=\"scroll|enterAlways\"\n            android:fitsSystemWindows=\"\
  true\"\n            app:contentScrim=\"?attr/colorPrimary\"\n            app:expandedTitleMarginStart=\"\
  48dp\"\n            app:expandedTitleMarginEnd=\"64dp\">\n            <ImageView\n\
  \                android:id=\"@+id/backdrop\"\n                android:layout_width=\"\
  match_parent\"\n                android:layout_height=\"200dp\"\n              \
  \  android:scaleType=\"centerCrop\"\n                android:fitsSystemWindows=\"\
  true\"\n                app:layout_collapseMode=\"parallax\"\n                android:src=\"\
  @drawable/appbar_image\" />\n            <androidx.appcompat.widget.Toolbar\n  \
  \              android:id=\"@+id/toolbar\"\n                android:layout_width=\"\
  match_parent\"\n                android:layout_height=\"?attr/actionBarSize\"\n\
  \                android:background=\"?attr/colorPrimary\"\n                app:popupTheme=\"\
  @style/AppTheme.PopupOverlay\"\n                app:layout_scrollFlags=\"scroll|enterAlways\"\
  \n                app:layout_collapseMode=\"pin\" />\n        </com.google.android.material.appbar.CollapsingToolbarLayout>\n\
  \    </com.google.android.material.appbar.AppBarLayout>\n    <include layout=\"\
  @layout/content_main\" />\n</androidx.coordinatorlayout.widget.CoordinatorLayout\n\
  ```\n\n除了向布局添加新元素外，还删除了背景颜色设置。此更改的好处是提供了透明工具栏，允许应用栏显示更多图像。\n\n使用文件系统找到 `res/drawable`\
  \ 文件夹中的 `appbar_image.jpg` 文件并复制。在项目窗口中右键点击 `res -> drawable` 并从菜单中选择粘贴。运行时，应用栏应如图\
  \ 50-7 所示：\n\n![](img/Image2474.jpg)\n\n图 50-7\n\n向上滚动列表会导致应用栏逐渐折叠。在收缩过程中，图像将变为\
  \ `scrim` 属性定义的颜色，而标题字体大小按比例缩小，直到只剩下工具栏：\n\n![](img/Image2482.jpg)\n\n图 50-8\n\n\
  在滚动动作的初始阶段，工具栏保持可见（如果继续向上滚动，工具栏也会消失），这是因为 `activity_main.xml` 文件中的工具栏元素配置为固定模式：`app:layout_collapseMode=\"\
  pin\"`。如果将折叠模式设置为视差，工具栏将与视图一起收回。继续向上滚动会导致工具栏也折叠，只留下状态栏：\n\n![](img/Image2491.jpg)\n\
  \n图 50-9\n\n由于 `CollapsingToolbarLayout` 元素的 `scrollFlags` 属性包含了 `enterAlways` 选项，向下滚动会导致应用栏再次展开。\n\
  \n为了固定工具栏使其在向上滚动动作期间不再消失，请将 `activity_main.xml` 文件中 `CollapsingToolbarLayout` 元素的\
  \ `app:layout_scrollFlags` 属性中的 `enterAlways` 替换为 `exitUntilCollapsed`，如下：\n\n```xml\n\
  <com.google.android.material.appbar.CollapsingToolbarLayout\n    android:id=\"@+id/collapsing_toolbar\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    app:layout_scrollFlags=\"scroll|exitUntilCollapsed\"\n    android:fitsSystemWindows=\"\
  true\"\n    app:contentScrim=\"?attr/colorPrimary\"\n    app:expandedTitleMarginStart=\"\
  48dp\"\n    app:expandedTitleMarginEnd=\"64dp\">\n```\n\n## 50.5 更改标题和遮罩颜色\n\n作为最后一个任务，编辑\
  \ `MainActivity.java` 文件并在 `onCreate()` 方法中添加一些代码，以更改折叠布局实例上的标题文本并设置不同的遮罩颜色（注意遮罩颜色也可以在布局资源文件中设置）：\n\
  \n```java\npackage com.ebookfrenzy.carddemo;\n\nimport com.google.android.material.appbar.CollapsingToolbarLayout;\n\
  import android.graphics.Color;\n\n@Override\nprotected void onCreate(Bundle savedInstanceState)\
  \ {\n    super.onCreate(savedInstanceState);\n    binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \    setContentView(binding.getRoot());\n    setSupportActionBar(binding.toolbar);\n\
  \    binding.collapsingToolbar.setTitle(\"My Toolbar Title\");\n    binding.collapsingToolbar.setContentScrimColor(Color.GREEN);\n\
  \    layoutManager = new LinearLayoutManager(this);\n    binding.contentMain.recyclerView.setLayoutManager(layoutManager);\n\
  \    adapter = new RecyclerAdapter();\n    binding.contentMain.recyclerView.setAdapter(adapter);\n\
  }\n```\n\n最后运行一次应用程序，注意新标题出现在应用栏中，并且滚动现在会导致工具栏在收缩时过渡到绿色。\n\n## 50.6 总结\n\n大多数 Android\
  \ 应用顶部的应用栏可以由许多不同的元素组成，包括工具栏、标签布局甚至图像视图。当嵌入在 `CoordinatorLayout` 父布局时，有许多可用选项可以控制应用栏响应活动主要内容滚动事件的行为。为了更精确地控制这种行为，`CollapsingToolbarLayout`\
  \ 布局提供了一系列额外的控制级别，用于控制应用栏内容相对于滚动动作的展开和收缩。\n\n\n\n\n\n本章将详细介绍 Android Studio 中包含的主/详情流（Primary/Detail\
  \ Flow）模板的组成元素，在此之前介绍主/详情用户界面设计的概念。随后，将创建一个示例应用程序，演示修改模板以满足应用程序开发者特定需求的步骤。\n\n##\
  \ 51.1 主/详情流\n\n主/详情流是一种界面设计概念，其中向用户显示一个项目列表（称为主列表，primary list）。当从列表中选择一个项目时，与该项目相关的附加信息将在详情窗格（detail\
  \ pane）中呈现给用户。例如，一个电子邮件应用程序可能包含一个接收消息的主列表，其中包含发件人地址和邮件主题。当从主列表中选择一条消息后，邮件正文将出现在详情窗格中。\n\
  \n在横屏模式的平板尺寸 Android 设备屏幕上，主列表显示在屏幕左边缘的狭窄垂直面板中。屏幕的其余部分用于详情窗格，这种布局被称为双窗格模式（two-pane\
  \ mode）。例如，图 51-1 展示了主/详情双窗格布局，其中列出了主项目，并在详情窗格中显示了项目一的内容：\n\n![](img/Image2428.jpg)\n\
  \n图 51-1\n\n在较小的手机尺寸 Android 设备上，主列表占据整个屏幕，而详情窗格出现在从主列表中做出选择时显示的另一个独立屏幕上。在这种模式下，详情屏幕包含一个用于返回主列表的动作栏（action\
  \ bar）条目。例如，图 51-2 展示了在 4 英寸手机屏幕上同一项目列表的主屏幕和详情屏幕：\n\n![](img/Image24371.jpg)\n\n\
  图 51-2\n\n## 51.2 创建主/详情流活动（Activity）\n\n在本章的下一节中，将详细介绍组成主/详情流模板的各种元素。实现这一方法是使用主/详情流模板创建一个项目，并在学习信息时对其进行操作。该项目随后将作为本章末尾教程的基础。\n\
  \n尽管项目创建向导包含了选择主/详情流模板的选项，但在项目创建后添加活动，可以在配置模板方面获得更大的灵活性。\n\n从欢迎界面选择 `New Project`（新建项目）选项，在生成的新项目对话框中，点击\
  \ `Next`（下一步）按钮之前选择 `No Activity`（无活动）模板。\n\n在 `Name`字段中输入 `PrimaryDetailFlow`，并指定\
  \ `com.ebookfrenzy.primarydetailflow` 为包名。在点击 `Finish`（完成）按钮之前，将 `Minimum API level`（最低\
  \ API 级别）设置改为 `API 26: Android 8.0 (Oreo)`并将`Language`（语言）菜单设置为 `Java`。\n\n项目创建完成后，在\
  \ Project 工具窗口中右键点击 `app` -> `java` -> `com.ebookfrenzy.primarydetailflow` 条目，选择\
  \ `New` -> `Activity` -> `Primary/Detail Flow` 菜单选项。\n\nNew Android Activity 屏幕（图\
  \ 51-3）提供了配置显示在主/详情活动中对象的机会。在本章稍后的教程中，主列表将包含若干网站名称，当选择这些名称时，将把选定的网站加载到详情窗格内的 web\
  \ view 中。考虑到这些需求，将 `Object Kind` 字段设置为“Website”，并将 `Object Kind Plural` 设置为“Websites”。\n\
  \n![](img/as_4.2_primary_detail_flow_new_activity.jpg)\n\n图 51-3\n\n在点击 `Finish`\
  \ 按钮之前，确保已启用 `Launcher Activity`（启动活动）选项并将 `Source Language`（源语言）菜单设置为 `Java`。\n\
  \n## 51.3 修改主/详情流模板\n\n虽然主/详情流模板的结构初看起可能令人困惑，但正如将要所示，模板提供的大部分功能对于许多主/详情实现需求来说可以保持不变。\n\
  \n在本章的剩余部分中，将修改 `PrimaryDetailFlow` 项目，使主列表显示网站名称列表，并将详情窗格更改为包含一个 `WebView` 对象而不是当前的\
  \ `TextView`。当用户选择一个网站时，相应的网页随后将在详情窗格中加载并显示。\n\n## 51.4 更改内容模型\n\n当前示例的内容由 `PlaceholderContent`\
  \ 类文件定义。因此，首先选择 `PlaceholderContent.java` 文件（位于 Project 工具窗口中 `app` -> `java` ->\
  \ `com.ebookfrenzy.PrimaryDetailflow` -> `placeholder` 文件夹下）并查看代码。文件底部是一个名为 `PlaceholderItem`\
  \ 的类的声明，它目前能够存储三个 `String` 对象，分别代表内容、详情字符串和一个 ID。另一方面，更新后的项目需要每个项目对象包含一个 ID 字符串、一个网站名称字符串以及一个对应网站的\
  \ URL 字符串。为了添加这些功能，修改 `PlaceholderItem` 类使其读取如下：\n\n```java\npublic static class\
  \ PlaceholderItem {\n    public String id;\n    public String website_name;\n  \
  \  public String website_url;\n    public PlaceholderItem(String id, String website_name,\
  \ String website_url) {\n        this.id = id;\n        this.website_name = website_name;\n\
  \        this.website_url = website_url;\n    }\n    @Override\n    public String\
  \ toString() {\n        return website_name;\n    }\n}\n```\n\n注意，封装 `PlaceholderContent`\
  \ 类当前包含一个循环，通过调用名为 `createPlaceholderItem()` 和 `makeDetails()` 方法添加 25 个项目。许多代码将不再需要，应从类中删除，如下：\n\
  \n```java\npublic static final Map<String, PlaceholderItem> ITEM_MAP = new HashMap<String,\
  \ PlaceholderItem>();\nprivate static int COUNT = 25;\nstatic {\n    for (int i\
  \ = 1; i <= COUNT; i++) {\n        addItem(createPlaceholderItem(i));\n    }\n}\n\
  private static void addItem(PlaceholderItem item) {\n    ITEMS.add(item);\n    ITEM_MAP.put(item.id,\
  \ item);\n}\nprivate static PlaceholderItem createPlaceholderItem(int position)\
  \ {\n    return new PlaceholderItem(String.valueOf(position), \"Item \" + position,\
  \ makeDetails(position));\n}\n\nprivate static String makeDetails(int position)\
  \ {\n    StringBuilder builder = new StringBuilder();\n    builder.append(\"Details\
  \ about Item: \").append(position);\n    for (int i = 0; i < position; i++) {\n\
  \        builder.append(\"\\nMore details here.\");\n    }\n    return builder.toString();\n\
  }\n```\n\n此代码需要修改以以所需的网站数据初始化数据模型：\n\n```java\npublic static final Map<String, PlaceholderItem>\
  \ ITEM_MAP = new HashMap<String, PlaceholderItem>();\nstatic {\n    addItem(new\
  \ PlaceholderItem(\"1\", \"eBookFrenzy\", \"https://www.ebookfrenzy.com\"));\n \
  \   addItem(new PlaceholderItem(\"2\", \"Amazon\", \"https://www.amazon.com\"));\n\
  \    addItem(new PlaceholderItem(\"3\", \"New York Times\", \"https://www.nytimes.com\"\
  ));\n}\n```\n\n该代码现在利用修改后的 `PlaceholderItem` 类来为每个项目存储 ID、网站名称和 URL。\n\n## 51.5\
  \ 更改详情窗格\n\n\n\n\n详情窗的布局（用户从主列表中选择一个项目时显示的屏幕）包含在 `activity_website_detail.xml` 文件中，该文件包含一个\
  \ `FrameContainerView` 实例，用于显示实际详情窗的内容。如果应用以单窗模式显示，框架容器将显示 `fragment_website_detail.xml`\
  \ 文件中的布局，而多窗模式将显示 `fragment_website_detail.xml (sw600dp)` 布局。\n\nAndroid Studio\
  \ 为 `fragment_website_detail.xml` 提供的模板布局包含一个 `Coordinator` 布局，其中包含应用栏、工具栏、浮动按钮和一个\
  \ `text` 。在本例中，我们需要显示的是 `WebView`，因此打开此文件并删除布局中 `website_detail_container` 视图以外的所有视图。实现此操作简单的方法是在按下键盘删除键之前，所示在\
  \ `Component Tree`（组件树）中选择所有不需要的视图：\n\n![](img/as_4.2_new_primary_detail_delete_views.jpg)\n\
  \n图 51-4\n\n从 `Palette`（调色板）的 `Widgets` 部分拖出一个 `WebView` 对象，将其放置到布局画布的中心并将 `id`\
  \ 更改为 `website_detail`。\n\n接下来，编辑 `fragment_website_detail.xml (sw600dp)` 文件，在将\
  \ `WebView` 拖放到布局之前删除默认的 `TextView` 实例，再次将 `id` 更改为 `website_detail`。这两个文件的布局现在应该类似于\
  \ 图 51-5：\n\n![](img/as_3.5_master_detail_webview.jpg)\n\n图 51-5\n\n### 51.6 修改\
  \ WebsiteDetailFragment 类\n\n此时，用户界面详情窗已过修改，但相应的 Java 类仍然设计用于处理 `TextView` 对象而不是\
  \ `WebView`。在 `Project`（项目）工具窗口中双击 `WebsiteDetailFragment.java` 文件来加载该类的源代码。\n\n\
  为了加载与当前所选项目对应的网页 URL，只需要更改几行代码。一旦完成此更改，代码读取起来如下：\n\n```java\nimport android.webkit.WebResourceRequest;\n\
  import android.webkit.WebView;\nimport android.webkit.WebViewClient;\n\npublic class\
  \ WebsiteDetailFragment extends Fragment {\n\n    @Override\n    public View onCreateView(LayoutInflater\
  \ inflater, ViewGroup container,\n                             Bundle savedInstanceState)\
  \ {\n        binding = FragmentWebsiteDetailBinding.inflate(inflater, container,\
  \ false);\n        View rootView = binding.getRoot();\n        mToolbarLayout =\
  \ rootView.findViewById(R.id.toolbar_layout);\n        mTextView = binding.websiteDetail;\n\
  \        updateContent();\n        rootView.setOnDragListener(dragListener);\n \
  \       return rootView;\n    }\n\n    private void updateContent() {\n        if\
  \ (mItem != null) {\n            binding.websiteDetail.setWebViewClient(new WebViewClient(){\n\
  \                @Override\n                public boolean shouldOverrideUrlLoading(\n\
  \                        WebView view, WebResourceRequest request) {\n         \
  \           return super.shouldOverrideUrlLoading(\n                           \
  \         view, request);\n                }\n            });\n            binding.websiteDetail.loadUrl(mItem.website_url);\n\
  \        }\n    }\n}\n```\n\n### 52.1 Intent 概述\n\n在本书的这个阶段，应该很清楚 Android 应用由一个或多个活动（activity）组成。然而，尚未详细介绍的一个领域是一个活动触发另一个活动启动的机制。正如“Android\
  \ 应用剖析”章节（#App_Anatomy.xhtml__idTextAnchor238）中简要概述的那样，这主要通过使用 Intent 实现。\n\n在后续章节中处理一些基于\
  \ Android Studio 的 Intent 示例实现之前，本章的目标是以显式 Intent 和隐式 Intent 的形式提供 Intent 的概述，并对意图过滤器（intent\
  \ filters）进行介绍。\n\n\n\n\n`Intents` (`android.content.Intent`) 是一种消息系统，允许一个活动（activity）启动另一个活动。例如，一个活动可以发出一个\
  \ intent 来请求启动同一应用程序内的另一个活动。然而，intent 的范围也超出了这一概念，它允许一个活动请求设备上任何其他已适当注册且配置了权限的活动提供的服务。例如，考虑一个应用程序内包含的某个活动，该活动需要加载并向用户显示一个网页。该应用程序并不需要包含第二个活动来执行此任务，代码可以简单向\
  \ Android 运行时发送一个 intent，请求任何注册了显示网页能力的活动服务。运行时系统会将该请求与设备上可用的活动进行匹配，并启动匹配的活动，或者在存在多个匹配项的情况下，允许用户决定使用哪一个活动。\n\
  \nIntent 还允许将数据从发送方活动传输到接收方活动。在之前描述的场景中，例如，发送方活动需要将要显示的网页 URL 发送给第二个活动。同样，接收方活动也可以配置为在完成所需任务后将数据返回给发送方活动。虽然在随后的章节中才会详细介绍，但值得强调的是，除了启动活动外，intent\
  \ 还用于启动和与服务（services）以及广播接收器（broadcast receivers）通信。\n\nIntent 分为显式（explicit）和隐式（implicit）。\n\
  \n## 52.2 显式 Intent (Explicit Intents)\n\n显式 intent 通过引用目标活动的组件名称（实际上是类名）来请求启动特定的活动。当启动与发送活动位于相同应用程序的活动时，这种方法常见（因为应用程序开发者已知类名）。\n\
  \n显式 intent 通过创建 `Intent` 类的实例来发出，并传入活动上下文（context）和要启动活动的组件名称。然后调用 `startActivity()`\
  \ 方法，并将 intent 对象作为参数传递。例如，以下代码段发出了一个请求启动类名为 `ActivityB` 活动的 intent：\n\n```java\n\
  Intent i = new Intent(this, ActivityB.class);\nstartActivity(i);\n```\n\n可以通过调用\
  \ intent 对象的 `putExtra()` 方法，在启动它之前将数据添加到 intent 对象中，从而将其传输到接收方活动。数据必须以键值对的形式添加。以下代码扩展了之前的示例，分别向\
  \ intent 添加了键为 `\"myString\"` 和 `\"myInt\"` 的 `String` 和整数值：\n\n```java\nIntent\
  \ i = new Intent(this, ActivityB.class);\ni.putExtra(\"myString\", \"This is a message\
  \ for ActivityB\");\ni.putExtra(\"myInt\", 100);\nstartActivity(i);\n```\n\n目标活动作为\
  \ `Bundle` 对象的一部分接收这些数据，该对象可以通过调用 `getIntent().getExtras()` 获取。`Activity` 类的 `getIntent()`\
  \ 方法返回启动该活动的 intent，而 `Intent` 类的 `getExtras()` 方法返回一个包含数据的 `Bundle` 对象。例如，要提取传递给\
  \ `ActivityB` 的数据值：\n\n```java\nBundle extras = getIntent().getExtras();\nif (extras\
  \ != null) {\n    String myString = extras.getString(\"myString\");\n    int myInt\
  \ = extras.getInt(\"myInt\");\n}\n```\n\n当使用 intent 启动同一应用程序内的其他活动时，确保这些活动列在应用程序清单文件（manifest\
  \ file）中是关重要的。以下 `AndroidManifest.xml` 内容对于包含名为 `ActivityA` 和 `ActivityB` 活动的应用程序来说是正确的配置：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    package=\"com.ebookfrenzy.intent1.intent1\"\
  \ >\n    <application\n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"\
  @string/app_name\" >\n        <activity\n            android:label=\"@string/app_name\"\
  \n            android:name=\"com.ebookfrenzy.intent1.intent1.ActivityA\" >\n   \
  \         <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\"\
  \ />\n                <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n            </intent-filter>\n        </activity>\n        <activity\n   \
  \         android:name=\"ActivityB\"\n            android:label=\"ActivityB\" >\n\
  \        </activity>\n    </application>\n</manifest>\n```\n\n## 52.3 从活动返回数据 (Returning\
  \ Data from an Activity)\n\n如上一节示例所示，虽然数据被传输到了 `ActivityB`，但没有方法将数据返回给第一个活动。然而，可以通过将\
  \ `ActivityB` 作为子活动（sub-activity）启动来实现。通过 `registerForActivityResult` 方法创建一个 `ActivityResultLauncher`\
  \ 实例，并以 lambda 表达式的形式传递一个处理器（handler）。当子活动返回时，该处理器将被调用。代码通常读取如下：\n\n```java\nActivityResultLauncher<Intent>\
  \ startForResult = registerForActivityResult(\n    ActivityResultContracts.StartForResult(),\n\
  \    new ActivityResultCallback<ActivityResult>() {\n        @Override\n       \
  \ public void onActivityResult(ActivityResult result) {\n            if (result.getResultCode()\
  \ == Activity.RESULT_OK) {\n                Intent data = result.getData();\n  \
  \              // 处理返回的数据\n            }\n        }\n    });\n```\n\n一旦启动器准备就绪，就可以调用它并传递要启动的\
  \ intent：\n\n```java\nIntent i = new Intent(this, ActivityB.class);\nstartForResult.launch(i);\n\
  ```\n\n为了向父活动返回数据，子活动必须实现 `finish()` 方法，该方法的目的是创建一个包含数据的新的 intent 对象，然后调用封装该方法的\
  \ `setResult()` 方法，传入结果码和包含返回数据的 intent。结果码通常为 `RESULT_OK` 或 `RESULT_CANCELED`，也可以根据开发者的需求使用自定义值。如果子活动崩溃，父活动将收到\
  \ `RESULT_CANCELED` 结果码。\n\n例如，以下代码说明了典型的子活动 `finish()` 方法的代码：\n\n```java\npublic\
  \ void finish() {\n    Intent data = new Intent();\n    data.putExtra(\"returnString1\"\
  , \"Message to parent activity\");\n    setResult(RESULT_OK, data);\n    super.finish();\n\
  }\n```\n\n## 52.4 隐式 Intent (Implicit Intents)\n\n显式 intent 引用要启动活动的类名不同，隐式 intent\
  \ 通过指定要执行的操作和接收活动要处理的数据类型来标识要启动的活动。例如，`ACTION_VIEW` 动作类型配以 `URI` 对象形式的网页 URL，将指示\
  \ Android 系统搜索并随后启动一个能够浏览器的活动。以下隐式 intent 在 Android 设备上执行时，将导致指定的网页在浏览器活动中显示：\n\n\
  ```java\nIntent intent = new Intent(Intent.ACTION_VIEW,\n    Uri.parse(\"https://www.ebookfrenzy.com\"\
  ));\nstartActivity(intent);\n```\n\n\n\n\n\n当活动发布上述隐式意图时，Android 系统将通过称为“意图解析”（intent\
  \ resolution）的过程，在设备上搜索注册了处理 `http` 方案数据的 `ACTION_VIEW` 请求的活动。如果找到一个匹配项，则将启动该活动。如果找到多个匹配项，将提示用户从可用的活动选项中进行选择。\n\
  \n## 52.5 使用意图过滤器 (Intent Filters)\n\n意图过滤器是活动向 Android 意图解析过程“广告”其支持的操作和数据处理能力的机制。延续上一节的示例，能够显示网页的活动将在其清单文件文件中包含一个意图过滤器部分，表示支持对\
  \ `http` 方案数据的 `ACTION_VIEW` 类型意图请求。\n\n需要注意的是，发送方和接收方活动都必须对要执行的操作类型请求权限。这通过在两个对的清单文件中添加\
  \ `<uses-permission>` 标签来实现。例如，下方的清单文件行请求了访问互联网和联系人数据库的权限：\n\n```xml\n<uses-permission\
  \ android:name=\"android.permission.READ_CONTACTS\" />\n<uses-permission android:name=\"\
  android.permission.INTERNET\"/>\n```\n\n接下来的 `AndroidManifest.xml` 文件展示了一个名为 `WebViewActivity`\
  \ 的活动的配置，该活动启用了意图过滤器并允许访问互联网权限：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\n   \
  \ package=\"com.ebookfreny.WebView\"\n    android:versionCode=\"1\"\n    android:versionName=\"\
  1.0\" >\n    <uses-sdk android:minSdkVersion=\"10\" />\n    <uses-permission android:name=\"\
  android.permission.INTERNET\" />\n    <application\n        android:icon=\"@mipmap/ic_launcher\"\
  \n        android:label=\"@string/app_name\" >\n        <activity\n            android:label=\"\
  @string/app_name\"\n            android:name=\".MainActivity\" >\n            <intent-filter>\n\
  \                <action android:name=\"android.intent.action.VIEW\" />\n      \
  \          <category android:name=\"android.intent.category.DEFAULT\" />\n     \
  \           <data android:scheme=\"http\" />\n            </intent-filter>\n   \
  \     </activity>\n    </application>\n</manifest>\n```\n\n## 52.6 检查意图的可用性\n\n\
  通常假设某个活动对于特定意图是可用的是不明智的，特别是因为缺少匹配的操作通常会导致应用程序崩溃。幸运的是，可以在意图发送到运行时系统之前，识别某个活动对于特定意图的可用性。可以使用以下方法识别活动对于指定意图操作种的可用性：\n\
  \n```java\npublic static boolean isIntentAvailable(Context context, String action)\
  \ {\n    final PackageManager packageManager = context.getPackageManager();\n  \
  \  final Intent intent = new Intent(action);\n    List<ResolveInfo> list =\n   \
  \         packageManager.queryIntentActivities(intent,\n                    PackageManager.MATCH_DEFAULT_ONLY);\n\
  \    return list.size() > 0;\n}\n```\n\n## 52.7 总结\n\n意图（Intents）是一个 Android 活动可以启动另一个活动的消息传递机制。显式意图（explicit\
  \ intent）通过类名引用接收方活动来引用要启动的特定活动。显式意图通常（但并非专门）用于启动位于同一应用程序内的活动。隐式意图（implicit intent）指定要执行的操作和要处理的数据类型，并让\
  \ Android 运行时找到匹配的活动进行启动。隐式意图通常用于启动位于不同应用程序中的活动。\n\n活动可以通过键值对的形式将数据封装到意图对象并发送给接收方活动。只有当活动作为发送活动的子活动启动时，才能从活动返回数据。\n\
  \n活动通过在应用程序清单文件中指定意图过滤器向 Android 意图解析过程展示能力。发送方和接收方活动也必须请求适当的权限以执行访问设备联系人数据库或互联网等任务。\n\
  \n涵盖了意图理论后，接下来的章节将在 Android Studio 中创建一些示例，将显式和隐式意图投入实践。\n\n## 53 Android 显式意图 –\
  \ 实例演示\n\n“Android 意图概览”章节涵盖了使用意图启动活动的理论。本章将通过创建一个示例应用程序将该理论付诸实践。在本章中创建的示例 Android\
  \ Studio 应用程序项目将演示如何使用显式意图启动活动，包括发送方和接收方活动之间的数据传输。下一章（“Android 隐式意图 – 实例演示”）将演示隐式意图的使用。\n\
  \n### 53.1 创建显式意图示例应用程序\n\n从欢迎屏幕选择“New Project”选项，在弹出的新项目对话框中，点击“Next”按钮之前，选择“Empty\
  \ Activity”模板。\n\n在 `Name` 字段中输入 `ExplicitIntent` 并指定 `com.ebookfrenzy.explicitintent`\
  \ 为包名。在点击“Finish”按钮之前，将 Minimum API level 设置更改为 `API 26`，并将 Language 菜单设置为 `Java`。按照章节\
  \ `11.8 Migrating a Project to View Binding` 中列出的步骤，将项目转换为使用 view binding。\n\n###\
  \ 53.2 设计 MainActivity 的用户界面布局\n\n`MainActivity` 的用户界面将由一个 `ConstraintLayout` 视图组成，其中包含分别名为\
  \ `editText1`、`textView1` 和 `button1` 的 `EditText`（纯文本）、`TextView` 和 `Button` 视图。使用\
  \ Project 工具窗口找到 MainActivity 的 `activity_main.xml` 资源文件（位于 `app -> res -> layout`），并双击将其加载到\
  \ Android Studio 布局编辑器。选择并删除默认的“Hello World!” TextView。\n\n从调板中拖入一个 `TextView` 小部件并将其放置在布局中心，并使用\
  \ Attributes 工具窗口分配 ID 为 `textView1`。从调板中拖入一个 `Button` 对象，并将其放置在水平居中且位于 `TextView`\
  \ 边缘下方。更改文本属性使其显示为“Send Text”，并配置 `onClick` 属性以调用名为 `sendText()` 方法。\n\n接下来，添加一个\
  \ Plain Text 对象，使其水平居中并位于 `TextView` 边缘上方。使用 Attributes 工具窗口移除分配给文本属性的“Name”字符串，并将\
  \ ID 设置为 `editText1`。布局完成后，点击工具栏上的“Infer constraints”（推约束）按钮以添加适当的约束：\n\n![](img/Image24343.jpg)\n\
  *图 53-1*\n\n最后，点击布局编辑器窗口右上角的红色警告按钮，并在生成的面板将“Send Text”字符串提取为名为 `send_text` 的资源。布局完成后，用户界面应该像图\
  \ 53-2 所示：\n\n![](img/as_4.1_explicit_intent_ui.jpg)\n*图 53-2*\n\n### 53.3 创建第二个活动类\n\
  \n\n\n\n\n当用户点击“发送文本”（Send Text）按钮时，将发出一个意图（intent），请求启动第二个活动，并在其中输入响应。因此，下一步是创建第二个活动。在\
  \ Project（项目）工具窗口中，右键点击 `app` -> `java` 下的 `com.ebookfrenzy.explicitintent` 包名，选择\
  \ `New` -> `Activity` -> `Empty Activity` 菜单选项，显示如图图 53-3\n\n图 53-3\n\n在 Activity\
  \ Name（活动名称）和 Title（标题）字段中输入 `SecondActivity`，并将布局文件命名为 `activity_second`，将 Language（语言）菜单改为\
  \ `Java`。由于此活动在应用程序启动时不启动（它将在点击按钮时由 `MainActivity` 通过意图启动），因此在点击 Finish（完成）按钮之前，确保禁用了\
  \ Launcher Activity（启动活动）选项非常重要。\n\n### 53.4 为 SecondActivity 设计用户界面布局\n\n第二个活动的用户界面所需的元素是\
  \ `Plain Text EditText`（纯文本输入框）、`TextView` 和 `Button`（按钮）视图。根据这些要求，将 `activity_second.xml`\
  \ 布局加载到 Layout Editor 工具中并添加视图。\n\n在设计过程中，注意按钮视图上的 `onClick` 属性已配置为调用名为 `returnText`\
  \ 的方法，`TextView` 和 `EditText` 视图分别被分配了 ID `textView2` 和 `editText2`。完成后，布局应类似于图\
  \ 53-4 所示所示所示。请注意，按钮上的文本（显示为“Return Text”）已提取到名为 `return_text` 的字符串资源。\n\n布局完成后，点击工具栏上的\
  \ `Infer constraints`（推断约束）按钮为布局添加必要的约束：\n\n![](img/as_4.1_explicit_intent_ui_2.jpg)\n\
  \n图 53-4\n\n### 53.5 检查应用程序清单文件（Manifest File）\n\n为了让 `MainActivity` 能够使用意图启动 `SecondActivity`，必须在\
  \ `AndroidManifest.xml` 文件中存在 `SecondActivity` 的项。在 Project 工具窗口中找到该文件（`app` ->\
  \ `manifests`），双击将其加载到编辑器中，并验证 Android Studio 已自动添加了该活动的项：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.explicitintent\">\n    <application\n        android:allowBackup=\"\
  true\"\n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\
  \n        android:roundIcon=\"@mipmap/ic_launcher_round\"\n        android:supportsRtl=\"\
  true\"\n        android:theme=\"@style/AppTheme\">\n        <activity\n        \
  \    android:name=\".SecondActivity\"\n            android:exported=\"true\" />\n\
  \        <activity\n            android:name=\".MainActivity\"\n            android:exported=\"\
  true\">\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\"\
  \ />\n                <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n\
  ```\n\n创建第二个活动并将其列在清单文件中后，现在是时候在 `MainActivity` 类中编写一些代码来发出意图了。\n\n### 53.6 创建意图（Intent）\n\
  \n`MainActivity` 的目标是在用户触摸“发送文本”按钮时创建并启动意图。作为意图创建过程的一部分，用户在 `EditText` 视图中输入的查询字符串将以键值对的形式添加到意图对象中。当为\
  \ `MainActivity` 创建用户界面布局时，按钮对象已配置为在用户“点击”时调用名为 `sendText()` 的方法。现在需要按照所示将该方法添加到\
  \ `MainActivity` 类 `MainActivity.java` 源文件中：\n\n```java\npackage com.ebookfrenzy.explicitintent;\n\
  \n.\n.\n\nimport android.content.Intent;\n\n.\n.\n\npublic class MainActivity extends\
  \ AppCompatActivity {\n.\n.\n    public void sendText(View view) {\n        Intent\
  \ i = new Intent(this, SecondActivity.class);\n        String myString = binding.editText1.getText().toString();\n\
  \        i.putExtra(\"qString\", myString);\n        startActivity(i);\n    }\n\
  }\n```\n\n`sendText()` 方法的代码遵循了 “Android Intent 概述”中概述的技巧。首先，创建一个新的 `Intent` 实例，并将当前活动和\
  \ `SecondActivity` 的类名作为参数传递。接下来，将输入 `EditText` 对象的文本以键值对的形式添加到意图对象，并通过 `startActivity()`\
  \ 启动意图。编译并运行应用程序返回。\n\n### 53.7 提取意图数据\n\n现在 `SecondActivity` 已从 `MainActivity`\
  \ 启动，下一步是从意图中提取包含的 String 值并赋值给 `TextView`。这涉及在 `SecondActivity` 的 `onCreate()`\
  \ 方法中添加代码：\n\n```java\npackage com.ebookfrenzy.intent;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  import android.os.Bundle;\nimport android.content.Intent;\nimport android.view.View;\n\
  import com.ebookfrenzy.intent.databinding.ActivitySecond;\n\npublic class SecondActivity\
  \ extends AppCompatActivity {\n    private ActivitySecond binding;\n    public void\
  \ onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        binding = ActivitySecond.inflate(getLayoutInflater());\n        View view\
  \ = binding.getRoot();\n        setContentView(view);\n        Bundle extras = getIntent().getExtras();\n\
  \        if (extras == null) {\n            return;\n        }\n        String qString\
  \ = extras.getString(\"qString\");\n        binding.textView2.setText(qString);\n\
  \    }\n}\n```\n\n在模拟器或物理设备上编译并运行应用程序。在触摸“发送文本”按钮之前，在 `MainActivity` 的文本框中输入一些文本。现在消息应该出现在\
  \ `SecondActivity` 用户界面的 TextView 组件上。\n\n### 53.8 作为子活动启动 SecondActivity\n\n为了让\
  \ `SecondActivity` 能够向 `MainActivity` 返回数据，必须作为 `MainActivity` 的子活动启动。这意味着我们需要调用\
  \ `registerActivityResult()` 并声明 `SecondActivity` 返回时定义的回调处理器。该回调将提取 `SecondActivity`\
  \ 返回的数据并显示在 `textView1` 上。\n\n`registerActivityResult()` 的调用返回一个 `ActivityResultLauncher`\
  \ 实例，可以在 `sendText()` 中调用以启动意图。编辑 `MainActivity.java` 文件使其内容如下：\n\n```java\n.\n\
  .\nimport androidx.activity.result.ActivityResult;\nimport androidx.activity.result.ActivityResultCallback;\n\
  import androidx.activity.result.ActivityResultLauncher;\nimport androidx.activity.result.contract.ActivityResultContracts;\n\
  \n.\n.\n\npublic class MainActivity extends AppCompatActivity {\n.\n.\n    ActivityResultLauncher<Intent>\
  \ startForResult = registerActivityResult(\n        new ActivityResultContracts.StartActivityForResult(),\n\
  \        new ActivityResultCallback<ActivityResult>() {\n            @Override\n\
  \            public void onActivityResult(ActivityResult result) {\n           \
  \     if (result.getResultCode() == Activity.RESULT_OK) {\n                    Intent\
  \ data = result.getData();\n                    String returnString = \n```\n\n\n\
  \n\n\n```java\ndata.getExtras().getString(\"returnData\");\n\nbinding.textView1.setText(returnString);\n\
  \n}\n\n}\n});\n\npublic void sendText(View view) {\n    Intent i = new Intent(this,\
  \ SecondActivity.class);\n    String myString = binding.editText1.getText().toString();\n\
  \    i.putExtra(\"qString\", myString);\n    startForResult.launch(i);\n}\n```\n\
  \n## 53.9 从子活动返回数据\n\n`SecondActivity` 现在作为 `MainActivity` 的子活动启动，而 `MainActivity`\
  \ 反过来也经过修改以处理从 `SecondActivity` 返回的数据。现在剩下的就是修改 `SecondActivity.java` 来实现 `finish()`\
  \ 方法，并为 `returnText()` 方法添加代码，该方法在点击“返回文本”（Return Text）按钮时被调用。当活动退出时会触发 `finish()`\
  \ 方法（例如用户选择设备上的返回键时）：\n\n```java\npublic void returnText(View view) {\n    finish();\n\
  }\n\n@Override\npublic void finish() {\n    Intent data = new Intent();\n    String\
  \ returnString = binding.editText2.getText().toString();\n    data.putExtra(\"returnData\"\
  , returnString);\n    setResult(RESULT_OK, data);\n    super.finish();\n}\n```\n\
  \n`finish()` 方法需要做的仅仅是创建一个新的 intent，将返回的数据作为键值对添加，然后调用 `setResult()` 方法，传递一个结果代码和\
  \ intent 对象。`returnText()` 方法简单地调用了 `finish()` 方法。\n\n## 53.10 测试应用程序\n\n编译并运行应用程序，在\
  \ `MainActivity` 的文本字段中输入一个问题并点击“发送文本”（Send Text）按钮。当 `SecondActivity` 出现时，在 `EditText`\
  \ 视图输入文本，并使用返回键或“返回文本”按钮返回 `MainActivity`响应应该出现在文本视图对象中。\n\n## 53.11 总结\n\n在上一节涵盖了\
  \ intent 的基础知识之后，本章的目标是在 Android Studio 中创建一个应用程序项目，用于演示显式 intent 的使用，以及父级活动与子活动之间数据传输的概念。\n\
  \n下一章将介绍一个旨在演示隐式 intent 作用的示例。\n\n## 54. Android 隐式 intent – 实例演示\n\n在本章中，将在 Android\
  \ Studio 中创建一个示例应用程序，用于演示隐式 intent 的实际实现。目标是创建并发送一个 intent，请求加载并向用户显示特定网页页面的内容。由于示例应用程序本身不包含能够执行此任务的活动，因此将发布一个隐式\
  \ intent，以便调用 Android 意图解析算法，来识别并启动来自另一个应用程序的合适活动。这很可能是 Android 操作系统捆带的 Chrome 网页浏览器的活动。\n\
  \n在成功启动内置浏览器后，将创建一个新项目，该项目也包含一个能够显示网页的活动。这将被安装到设备或模拟器上，并用于演示当活动符合隐式 intent 标准时发生什么。\n\
  \n### 54.1 创建 Android Studio 隐式 intent 示例项目\n\n从欢迎界面选择“New Project”（新建项目）选项，在出现的新项目对话框中，点击“Next”（下一步）按钮之前选择“Empty\
  \ Activity”模板。\n\n在 Name 字段中输入 `ImplicitIntent`，并指定 `com.ebookfrenzy.implicitintent`\
  \ 为包名。在点击“Finish”（完成）按钮之前，将 Minimum API level 设置为 API 26: Android 8.0 (Oreo)，并将\
  \ Language 菜单更改为 Java。\n\n## 54.2 设计用户界面\n\n`MainActivity` 类的用户界面非常简单，仅由一个 `ConstraintLayout`\
  \ 和一个 `Button` 对象组成。在 Project 工具窗口中找到 `app -> res -> layout -> activity_main.xml`\
  \ 文件并双击它将其加载到 Layout Editor 工具中。\n\n删除默认的 `TextView`，并在 Autoconnect（自动连接）模式下，放置\
  \ `Button` 小部件使其在布局中居中。请注意按钮上的文本（“Show Web Page”）已提取为名为 `show_web_page` 的字符串资源。\n\
  \n![](img/as_4.1_implicit_intent_ui.jpg)\n\n图 54-1\n\n选中 `Button`，使用 Attributes（属性）工具窗口配置\
  \ `onClick` 属性调用名为 `showWebPage` 的方法。\n\n## 54.3 创建隐式 intent\n\n如上所述，隐式 intent 将在\
  \ `MainActivity` 类内部创建并发布。找到 `MainActivity.java` 源文件并双击它，添加 `showWebPage()` 方法以及一些必要的导入：\n\
  \n```java\npackage com.ebookfrenzy.implicitintent;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  import android.os.Bundle;\nimport android.net.Uri;\nimport android.content.Intent;\n\
  import android.view.View;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n \
  \       super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_intent);\n\
  \    }\n\n    public void showWebPage(View view) {\n        Intent intent = new\
  \ Intent(Intent.ACTION_VIEW, Uri.parse(\"https://www.ebookfrenzy.com\"));\n    \
  \    startActivity(intent);\n    }\n}\n```\n\n此方法执行的任务实际上非常简单。首先，创建一个新的 `intent`\
  \ 对象。然而，代码并没有指定 intent 的类名，而是简单地指示了 intent 的性质（向用户显示内容），使用了 `ACTION_VIEW` 选项。intent\
  \ 对象还包含要显示的 URL 的 `URI`。这向 Android 意图解析系统指示该活动请求显示网页。然后通过调用 `startActivity()` 方法发布\
  \ intent。\n\n在模拟器或物理设备上编译并运行应用程序，运行后点击 Show Page 按钮。应该出现网页浏览器视图并加载由 URL 指定的页面。成功。\n\
  \n设备上安装了多个符合隐式 intent 要求的活动。为了实现这一点，将创建并安装第二个应用程序。因此，从创建一个新项目开始，应用程序名称设置为 `MyWebView`，使用在本章稍早创建\
  \ `ImplicitIntent` 项目时相同的 SDK 配置，并再次选择 Empty Activity。\n\n### 54.5 在 UI 中添加 Web\
  \ View\n\n新 `MyWebView` 项目包含的唯一活动的用户界面将由 Android `WebView` 小部件的实例组成。在 Project 工具窗口中，找到包含活动界面描述的\
  \ `activity_main.xml` 文件，并双击它将其加载到 Layout Editor 工具中。\n\n在 Layout Editor 工具的 Design\
  \ 模式下，选择默认的 `TextView` 小部件并使用键盘删除键将其从布局中删除。\n\n从调板的 Widgets 部分拖放一个 `WebView` 对象到现有的\
  \ `ConstraintLayout` 视图上，如图 54-2 所示：\n\n![](img/as_3.5_implicit_intent_webview_ui.jpg)\n\
  \n图 54-2\n\n\n\n\n\n在继续之前，将 `WebView` 实例的 ID 更改为 `webView1`，并使用 `Infer` 约束按钮添加任何缺失约束。\n\
  \n## 54.6 获取 Intent URL\n\n当创建隐式意图（implicit intent）对象以显示浏览器窗口时，要显示的网页 URL 将被封装在意图对象中的一个\
  \ `Uri` 对象内。`MainActivity` 类中 `onCreate()` 方法的任务是从意图对象中提取此 `Uri`，将其转换为 `URL` 字符串并将其赋值给\
  \ `WebView` 对象。要实现此功能，请修改 `MainActivity.java` 文件，使其内容如下：\n\n```java\npackage com.ebookfrenzy.mywebview;\n\
  \nimport java.net.URL;\nimport android.net.Uri;\nimport android.content.Intent;\n\
  import android.webkit.WebView;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private ActivityMainBinding binding;\n\n    @Override\n    protected void\
  \ onCreate(Bundle savedInstanceState) {\n        handleIntent();\n    }\n\n    private\
  \ void handleIntent() {\n        Intent intent = getIntent();\n        Uri data\
  \ = intent.getData();\n        URL url = null;\n        try {\n            url =\
  \ new URL(data.getScheme(),\n                          data.getHost(),\n       \
  \                   data.getPath());\n        } catch (Exception e) {\n        \
  \    e.printStackTrace();\n        }\n        binding.webView1.loadUrl(url.toString());\n\
  \    }\n}\n```\n\n添加到 `onCreate()` 方法中的新代码执行了以下任务：\n- 获取导致此活动启动的意图引用\n- 从意图对象中提取\
  \ `Uri` 数据\n- 将 `Uri` 数据转换为 `URL` 对象\n- 将 `URL` 加载到 Web  中，在此过程中将 `URL` 转换为 `String`\n\
  \n`MyWebView` 项目的代码部分已完成。剩下的工作是修改清单（manifest）文件。\n\n## 54.7 修改 MyWebView 项目清单文件\n\
  \n在进行测试之前，必须对 `MyWebView` 的清单文件进行多项更改。首先，该活动需要请求访问互联网的权限（因为需要加载网页）。这通过在清单文件中添加相应的权限行来实现：\n\
  \n```xml\n<uses-permission android:name=\"android.permission.INTERNET\" />\n```\n\
  \n此外，检查 `MyWebView` 项目中 `AndroidManifest.xml` 文件的意图过滤器（intent filter）部分内容，将发现以下设置：\n\
  \n```xml\n<intent-filter>\n    <action android:name=\"android.intent.action.MAIN\"\
  \ />\n    <category android:name=\"android.intent.category.LAUNCHER\" />\n</intent-filter>\n\
  ```\n\n在上面的 XML 中，`android.intent.action.MAIN` 项表示该活动是在没有任何数据输入的情况下启动时，应用程序的入口。另一方面，`android.intent.category.LAUNCHER`\
  \ 指令表示该活动应该列在设备的应用程序启动器屏幕中。\n\n由于该活动不需要作为应用程序的入口启动，在没有数据输入（在此例中为 `URL`）的情况下运行，且不需要在启动器中出现，因此该活动的清单文件中不需要\
  \ `MAIN` 或 `LAUNCHER` 指令。\n\n然而，`MainActivity` 活动的意图过滤器需要进行修改，以表明它能够处理针对 `http`\
  \ 数据方案的 `ACTION_VIEW` 意图动作。\n\nAndroid 还要求，任何能够处理隐式意图且不包含 `MAIN` 和 `LAUNCHER` 项的活动，还必须在意图过滤器中包含所谓的\
  \ `browsable` 和 `default` 类别。因此，修改后的意图过滤器部分应该如下：\n\n```xml\n<intent-filter>\n  \
  \  <action android:name=\"android.intent.action.VIEW\" />\n    <category android:name=\"\
  android.intent.category.BROWSABLE\" />\n    <category android:name=\"android.intent.category.DEFAULT\"\
  \ />\n    <data android:scheme=\"http\" android:host=\"www.ebookfrenzy.com\" />\n\
  </intent-filter>\n```\n\n注意，上面的 `android:host` 项引用了一个特定的 `URL`。也可以使用通配符，例如支持所有 URL：\n\
  \n```xml\n<data android:scheme=\"http\" android:host=\"*\" />\n```\n\n将这些要求整合在以下完整的\
  \ `AndroidManifest.xml` 文件中：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\n   \
  \ package=\"com.ebookfrenzy.mywebview\">\n    <uses-permission android:name=\"android.permission.INTERNET\"\
  \ />\n    <application\n        android:allowBackup=\"true\"\n        android:icon=\"\
  @mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\n        android:roundIcon=\"\
  @mipmap/ic_launcher_round\"\n        android:supportsRtl=\"true\"\n        android:theme=\"\
  @style/Theme.MyWebView\">\n        <activity\n            android:name=\".MainActivity\"\
  \n            android:label=\"@string/app_name \">\n            <intent-filter>\n\
  \                <action android:name=\"android.intent.action.VIEW\" />\n      \
  \          <category android:name=\"android.intent.category.BROWSABLE\" />\n   \
  \             <category android:name=\"android.intent.category.DEFAULT\" />\n  \
  \              <data android:scheme=\"https\" android:host=\"www.ebookfrenzy.com\"\
  \ />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n\
  ```\n\n通过双击项目窗口中的文件名将 `AndroidManifest.xml` 文件加载到清单编辑器。完成上述修改后，该活动已准备好安装。\n\n##\
  \ 54.8 在设备上安装 MyWebView 包\n\n在 `MyWebView` 主活动作为意图接收者之前，它必须先安装到设备上。这通过正常方式运行应用程序来实现。由于清单文件中不包含\
  \ `MAIN` 或 `LAUNCHER` 设置，需要指示 Android Studio 只安装不启动应用。要配置此行为，请选择工具栏上的 `app` -> `Edit\
  \ configurations...` 菜单，如图 54-3 所示：\n\n![](img/as_3.5_implicit_intent_edit_configuration.jpg)\n\
  \n在 `Run/Debug Configurations` 对话框中，将 `Launch Options` 部分的 `Launch` 选项更改为 `Nothing`，然后点击\
  \ `Apply` 并点击 `OK`：\n\n![](img/as_3.5_implicit_intent_launch_nothing.jpg)\n\n配置完成后运行应用。注意应用已安装但未启动。\n\
  \n## 54.9 测试应用程序\n\n为了测试 `MyWebView`，只需重新启动在本章之前创建的 `ImplicitIntent` 应用程序并触摸 `Show\
  \ Web Page` 按钮。然而这次意图解析过程将找到两个匹配意图过滤器的活动。因此，系统将显示一个对话框（图 54-5），为用户提供启动活动的选择。\n\n\
  ![](img/as_4.1_implicit_intent_chooser.jpg)\n\n选择 `MyWebView` 并点击 `Just once` 按钮应导致意图由我们新的\
  \ `MyWebView` 主活动处理，该活动随后出现并显示指定的网页。\n\n如果网页加载到 `Chrome` 浏览器而没有出现上述对话框，可能是 `Chrome`\
  \ 已被设置为设备的默认浏览器。可以通过进入设备上的 `Settings` -> `Apps & notifications` 然后点击 `App info`\
  \ 来更改。在应用列表中滚动并选择 `Chrome`。在 `Chrome` 应用信息屏幕，点击高级设置中的 `Open by default` ，然后点击 `Clear\
  \ Defaults` 按钮。\n\n## 54.10 总结\n\n\n\n\n\n隐式意图（Implicit intents）提供了一种机制，允许一个活动请求另一个服务的服务，只需指定操作类型，并可选地指定执行该操作的数据。然而，为了成为隐式意图的目标候选者，活动必须配置为从传入的意图对象中提取适当的数据，并包含在配置正确的清单文件中，其中包含适当的权限和意图过滤器（intent\
  \ filters）。当在意图解析搜索过程中发现多个匹配隐式意图的活动时，会提示用户选择使用哪一个。\n\n在本章中，我们创建了一个示例来演示隐式意图的发送，以及能够处理此类意图的示例活动的创建。\n\
  \n# 55. Android 广播意图与广播接收器\n\n意图（intents）除了提供启动应用程序机制外，还用于向系统中的其他组件广播系统级消息。这涉及到广播意图（Broadcast\
  \ Intents）和广播接收器（Broadcast Receivers）的实现，两者都是本章的主题。\n\n## 55.1 广播意图概述\n\n广播意图是 `Intent`\
  \ 对象，通过调用 `Activity` 类的 `sendBroadcast()`、`sendStickyBroadcast()` 或 `sendOrderedBroadcast()`\
  \ 方法进行广播（后者在需要广播结果时使用）。广播意图除了在应用程序组件之间提供消息和事件系统外，Android 系统还用它来通知感兴趣的应用程序有关关键系统事件（例如外部电源或耳机被连接或断开）。\n\
  \n在创建广播意图时，除了可选的数据和类别字符串（category string）外，必须包含一个操作字符串（action string）。与标准意图一样，数据使用意图对象的\
  \ `putExtra()` 方法结合键值对被添加到广播意图中。可选的类别字符串可以通过调用 `addCategory()` 方法分配给广播意图。\n\n标识广播事件的操作字符串必须是唯一的，并且通常使用应用程序的包名语法。例如，以下代码片段创建并发送了一个包含唯一操作字符串和数据的广播意图：\n\
  \n```java\nIntent intent = new Intent();\nintent.setAction(\"com.example.Broadcast\"\
  );\nintent.putExtra(\"MyData\", 1000);\nsendBroadcast(intent);\n```\n\n上述代码将在运行比\
  \ 3.0 较早的 Android 版本的设备上成功启动相应的广播接收器。然而，在较新版本的 Android 系统中，该意图将不会被广播接收器接收。这是因为 Android\
  \ 3.0 引入了一种启动控制安全措施，防止通过意图启动已停止应用程序的组件。如果应用程序刚刚安装且尚未启动过，或者用户使用设备上的应用程序管理器手动停止了程序，则该应用程序被认为处于停止状态。但为了解决这个问题，可以在发送意图之前向意图添加一个标记，以允许意图启动已停止应用程序的组件。该标记是\
  \ `FLAG_INCLUDE_STOPPED_PACKAGES`，并将按照如下对之前代码片段的适配方式进行使用：\n\n```java\nIntent intent\
  \ = new Intent();\nintent.addFlags(Intent.FLAG_INCLUDE_STOPPED_PACKAGES);\nintent.setAction(\"\
  com.example.Broadcast\");\nintent.putExtra(\"MyData\", 1000);\nsendBroadcast(intent);\n\
  ```\n\n## 55.2 广播接收器概述\n\n应用程序通过注册广播接收器来监听特定的广播意图。广播接收器通过扩展 `BroadcastReceiver`\
  \ 类并重写 `onReceive()` 方法来实现。随后，可以在代码中注册该广播接收器（例如在活动内部），也可以在清单文件中注册。注册实现的一部分涉及创建意图过滤器，以指示接收器需要监听的特定广播意图。这是通过引用广播意图的操作字符串来实现的。当检测到匹配的广播时，会调用广播接收器的\
  \ `onReceive()` 方法，此时该方法有 5 秒钟的时间在返回之前执行任何必要的任务。需要注意的是，广播接收器不需要一直运行。当检测到匹配的意图时，Android\
  \ 运行时系统会在调用 `onReceive()` 方法之前自动启动广播接收器。\n\n以下代码概述了一个模板类的广播接收器子类：\n\n```java\npackage\
  \ com.example.broadcastdetector;\n\nimport android.content.BroadcastReceiver;\n\
  import android.content.Context;\nimport android.content.Intent;\n\npublic class\
  \ MyReceiver extends BroadcastReceiver {\n\n    public MyReceiver() {\n\n    }\n\
  \n    @Override\n    public void onReceive(Context context, Intent intent) {\n \
  \       // 在此处实现检测到广播时 \n        // 要执行的代码\n    }\n}\n```\n\n在清单文件中注册广播接收器时，必须为接收器添加一个\
  \ `<receiver>` 条目。以下示例清单文件注册了上述示例广播接收器：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.example.broadcastdetector.broadcastdetector\"\n    android:versionCode=\"\
  1\"\n    android:versionName=\"1.0\" >\n    <uses-sdk android:minSdkVersion=\"17\"\
  \ />\n    <application android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"\
  @string/app_name\" >\n        <receiver android:name=\"MyReceiver\" />\n    </application>\n\
  </manifest>\n```\n\n在比 8.0 旧的 Android 版本上运行时，与接收器关联意图过滤器可以如下放在清单文件的 `receiver` 元素中：\n\
  \n```xml\n<receiver android:name=\"MyReceiver\" >\n    <intent-filter>\n       \
  \ <action android:name=\"com.example.Broadcast\" />\n    </intent-filter>\n</receiver>\n\
  ```\n\n在 Android 8.0 或更高版本上，必须在代码中使用 `Activity` 类的 `registerReceiver()` 方法结合配置适当的\
  \ `IntentFilter` 对象来注册接收器：\n\n```java\nIntentFilter filter = new IntentFilter(\"\
  com.example.Broadcast\");\nMyReceiver receiver = new MyReceiver();\nregisterReceiver(receiver,\
  \ filter);\n```\n\n当代码中注册的广播接收器不再需要时，可以通过调用活动类的 `unregisterReceiver()` 方法进行注销，并将接收器引用作为参数传递。例如，以下代码将注销上述广播接收器：\n\
  \n```java\nunregisterReceiver(receiver);\n```\n\n需要记住，某些系统广播意图只有当接收器在代码中注册而非清单文件中注册时才能被检测到。可以在在线查看\
  \ Android `Intent` 类文档以获取系统广播意图及相应要求的详细概述：[`developer.android.com/reference/android/content/Intent`](https://developer.android.com/reference/android/content/Intent)\n\
  \n## 55.3 从广播获取结果\n\n当使用 `sendBroadcast()` 方法发送广播意图时，发起活动无法从任何获取广播的广播接收器处接收结果。如果需要返回结果，则必须使用\
  \ `sendOrderedBroadcast()` 方法。\n\n\n\n\n\n`sendOrderedBroadcast()` 方法在调用时传入了多个参数，其中包含另一个广播接收器的引用（称为结果接收器），当所有其他广播接收器处理完意图后，该接收器将被通知；同时还有一组数据引用，这些接收器可以将结果数据放入其中。当所有广播接收器都获得了机会处理广播后，结果接收器的\
  \ `onReceive()` 方法将被调用并传入结果数据。\n\n## 55.4 粘性广播意图 (Sticky Broadcast Intents)\n\n\
  默认情况下，广播意图一旦发送并被任何感兴趣的广播接收器处理后就会消失。然而，可以将广播意图定义为“粘性”。粘性意图及其包含的数据在执行完成后仍保留在系统中。存储在粘性广播意图中的数据可以通过调用\
  \ `registerReceiver()` 方法的返回值获取，并使用常规参数（指向广播接收器的引用和意图过滤器对象）。许多 Android 系统广播都是粘性的，一个典型的例子是与电量状态相关的的广播。\n\
  \n可以通过调用 `removeStickyBroadcast()` 方法随时移除粘性广播，调用时将要移除的广播意图引用作为参数传递。\n\n## 55.5 广播意图示例\n\
  \n本章的剩余部分将通过创建一个基于 Android Studio 的示例来演示广播意图的操作。首先，将创建一个简单的应用程序，用于发送自定义的广播意图。随后，将创建一个相应的广播接收器，当检测到广播时，会在\
  \ Android 设备的屏幕上显示消息。最后，将修改广播接收器，以检测系统关于外部电源已从设备断出的通知。\n\n## 55.6 创建示例应用程序\n\n从欢迎界面选择\
  \ `New Project`（新建项目）选项，在出现的新项目对话框中，点击 `Next`（下一步）按钮之前选择 `Empty Activity` 模板。\n\n\
  在 `Name` 字段输入 `SendBroadcast`，并指定 `com.ebookfrenzy.sendbroadcast` 为包名。在点击 `Finish`（完成）按钮之前，将\
  \ `Minimum API level`（最低 API 级别）设置为 `API 26: Android 8.0 (Oreo)`，并将 `Language` 菜单设置为\
  \ `Java`。\n\n一旦创建新项目，在 Project 工具窗口的 `app -> res -> layout` 下找到并加载 `activity_main.xml`\
  \ 布局文件，在 Design（设计）模式下使用 Layout Editor 工具，将 `TextView` 对象替换为 `Button` ，并设置 `text`\
  \ 属性使其显示为“Send Broadcast”。一旦设置了文本值，按照通常步骤将该字符串提取为名为 `send_broadcast` 的资源。\n\n在布局中仍选中按钮时，在\
  \ Attributes（属性）面板中找到 `onClick` 属性，并将其配置为调用名为 `broadcastIntent` 的方法。\n\n## 55.7\
  \ 创建并发送广播意图\n\n在创建了 `SendBroadcast` 应用程序的框架后，现在是实现发送广播意图代码了。这涉及到实现之前指定的作为界面 `Button`\
  \ 视图 `onClick` 目标的 `broadcastIntent()` 方法。找到并双击 `MainActivity.java` 文件，修改它以添加创建和发送广播意图的代码。修改后，该类的源代码应如下：\n\
  \n```java\npackage com.ebookfrenzy.sendbroadcast;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  \nimport android.os.Bundle;\nimport android.content.Intent;\nimport android.view.View;\n\
  \npublic class MainActivity extends AppCompatActivity {\n\n.\n\n.\n\n    public\
  \ void broadcastIntent(View view)\n    {\n        Intent intent = new Intent();\n\
  \        intent.setAction(\"com.ebookfrenzy.sendbroadcast\");\n        intent.addFlags(Intent.FLAG_INCLUDE_STOPPED_PACKAGES);\n\
  \        sendBroadcast(intent);\n    }\n}\n```\n\n注意，在此例中，意图的 action 字符串为 `com.ebookfrenzy.sendbroadcast`。在本章后续章节中创建广播接收器类时，意图过滤器声明必须匹配此\
  \ action 字符串。\n\n此时发送广播意图的应用程序创建完成。剩下的只是构建匹配的广播接收器。\n\n## 55.8 创建广播接收器\n\n为了创建广播接收器，需要创建一个继承自\
  \ `BroadcastReceiver` 父类的新类。在 Project 工具窗口中，导航到 `app -> java` 并右键点击包名。从结果菜单中选择 `New\
  \ -> Other -> Broadcast Receiver` 选项，将类命名为 `MyReceiver`，并确保选择了 `Exported`（导出）和 `Enabled`（启用）选项。这些设置允许\
  \ Android 系统在需要时启动接收器，并确保该类可以接收设备上其他应用程序发送的消息。配置好类后，点击 `Finish`。\n\n一旦创建，Android\
  \ Studio 将将新的 `MyReceiver.java` 类文件加载到编辑器中，其内容如下：\n\n```java\npackage com.ebookfrenzy.sendbroadcast;\n\
  \nimport android.content.BroadcastReceiver;\nimport android.content.Context;\nimport\
  \ android.content.Intent;\n\npublic class MyReceiver extends BroadcastReceiver {\n\
  \n    @Override\n    public void onReceive(Context context, Intent intent) {\n \
  \       // TODO: 当 BroadcastReceiver 接收到\n        // Intent 广播时调用此方法。\n        throw\
  \ new UnsupportedOperationException(\"Not yet implemented\");\n    }\n}\n```\n\n\
  如代码所示，Android Studio 已为该类生成了模板，并为 `onReceive()` 方法生成了存根。需要对类进行一些更改以实现所需的行为。因此，在\
  \ `MyReceiver.java` 文件中，修改代码如下：\n\n```java\npackage com.ebookfrenzy.sendbroadcast;\n\
  \nimport android.content.BroadcastReceiver;\nimport android.content.Context;\nimport\
  \ android.content.Intent;\nimport android.widget.Toast;\n\npublic class MyReceiver\
  \ extends BroadcastReceiver {\n\n    @Override\n    public void onReceive(Context\
  \ context, Intent intent) {\n        // TODO: 当 BroadcastReceiver 接收到\n        //\
  \ Intent 广播时调用此方法。\n        throw new UnsupportedOperationException(\"Not yet implemented\"\
  );\n        Toast.makeText(context, \"Broadcast Detected.\", Toast.LENGTH_LONG).show();\n\
  \    }\n}\n```\n\n接收器的代码现在完成。\n\n## 55.9 注册广播接收器\n\n项目需要公开广播接收器的存在，并必须包含意图过滤器以指定接收器感兴趣的广播意图。在上一节中创建\
  \ `BroadcastReceiver` 类时，Android Studio 已自动在清单文件中添加了 `<receiver>` 元素。因此，剩下的是在 `MainActivity.java`\
  \ 文件中添加代码创建意图过滤器并注册接收器：\n\n```java\npackage com.ebookfrenzy.sendbroadcast;\n\n.\n\
  \n.\n\nimport android.content.BroadcastReceiver;\nimport android.content.IntentFilter;\n\
  \n.\n\n.\n\npublic class MainActivity extends AppCompatActivity {\n\n    BroadcastReceiver\
  \ receiver;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \        configureReceiver();\n    }\n\n    private void configureReceiver() {\n\
  \        IntentFilter filter = new IntentFilter();\n        filter.addAction(\"\
  com.ebookfrenzy.sendbroadcast\");\n        receiver = new MyReceiver();\n      \
  \  registerReceiver(receiver, filter);\n    }\n\n.\n\n.\n}\n```\n\n在接收器不再需要时注销广播接收器也是重要的：\n\
  \n```java\n@Override\nprotected void onDestroy() {\n    super.onDestroy();\n   \
  \ unregisterReceiver(receiver);\n}\n```\n\n## 55.10 测试广播示例\n\n\n\n\n为了测试广播发送者和接收器，请在设备或\
  \ AVD 上运行 `SendBroadcast` 应用并等待其显示在屏幕上。运行后，点击按钮，此时应该弹出显示“Broadcast Intent Detected”（检测到广播意图）的\
  \ toast 信息，持续几秒后消失。\n\n## 55.11 监听系统广播\n\n此示例的最后一个阶段是修改广播接收器的意图过滤器（intent filter），使其也监听外部电源断开设备连接时广播的系统意图。该操作是\
  \ `android.intent.action.ACTION_POWER_DISCONNECTED`。修改 `MainActivity.java` 文件中的\
  \ `configureReceiver()` 方法以添加此额外的过滤器：\n\n```java\nprivate void configureReceiver()\
  \ {\n    IntentFilter filter = new IntentFilter();\n    filter.addAction(\"com.ebookfrenzy.sendbroadcast\"\
  );\n    filter.addAction(\n            \"android.intent.action.ACTION_POWER_DISCONNECTED\"\
  );\n    receiver = new MyReceiver();\n    registerReceiver(receiver, filter);\n\
  }\n```\n\n由于 `MyReceiver.java` 文件中的 `onReceive()` 方法现在将监听两种类型的广播意图，因此有必要修改代码，使当前意图的动作字符串也显示在\
  \ toast 信息中。此字符串可以通过调用作为 `onReceive()` 方法参数的意图对象的 `getAction()` 方法来获取：\n\n```java\n\
  public void onReceive(Context context, Intent intent) {\n    String message = \"\
  Broadcast intent detected \"\n                    + intent.getAction();\n    Toast.makeText(context,\
  \ message,\n            Toast.LENGTH_LONG).show();\n}\n```\n\n通过重新安装修改后的 `SendBroadcast`\
  \ 包来测试接收器。在 `SendBroadcast` 应用中点击按钮现在应该会产生一条包含自定义动作字符串的新消息：\n\nBroadcast intent\
  \ detected com.ebookfrenzy.sendbroadcast\n\n接下来，移除当前为 Android 设备供电的 USB 连接器，此时接收器将在\
  \ toast 信息中报告以下内容。如果应用运行在模拟器上，请显示扩展控制面板，选择 Battery（电池）选项并将充电器连接设置改为 None。\n\nBroadcast\
  \ intent detected android.intent.action.ACTION_POWER_DISCONNECTED\n\n为了避免每次设备断开电源时都出现此消息，请在设备上启动设置应用并选择\
  \ Apps 选项。从结果列表中选择 `SendBroadcast` 应用并点击卸载按钮。\n\n## 55.12 总结\n\n广播意图（Broadcast intents）是一种机制，可以发布供\
  \ Android 系统上的多个组件使用的意图。通过注册广播接收器（Broadcast Receiver）来检测广播，接收器反过来配置为监听匹配特定动作字符串的意图。通常情况下，广播接收器保持休眠状态，直到系统检测到匹配的意图时将其唤醒。Android\
  \ 系统也使用广播意图来发布事件通知，例如低电警告或外部电源与设备的连接或断开。\n\n本章除了提供广播意图和接收器的概述外，还通过示例演示了发送广播意图以及用于监听自定义和系统广播的广播接收器的实现。\n\
  \n## 56. Java 线程（Threads）、处理器（Handlers）和执行器（Executors）的基本概述\n\n下一章将系列章节中的第一个，旨在介绍如何使用\
  \ Android Service 在后台执行应用程序任务。然而，如果不先了解 Android 应用程序中线程的概念，就不可能理解实现服务涉及的步骤。因此，线程、线程处理器和执行服务是本章的主题。\n\
  \n## 56.1 线程概述\n\n线程是任何多任务操作系统的基石，可以被视为运行在主进程中的微进程，其目的是为了在应用程序中至少实现并行执行路径的外。\n\n\
  ### 56.2 应用程序主线程\n\n当 Android 应用程序首次启动时，运行时系统会创建一个单一线程，所有应用程序组件默认将在该线程中运行。该线程通常被称为主线程（main\
  \ thread）。主线程的主要作用是在事件处理方面处理用户界面，并与用户界面中的视图进行交互。在应用程序内启动的任何额外组件默认也会运行在主线程上。\n\n\
  应用程序中任何使用主线程执行耗时任务的组件都会导致整个应用程序看起来像锁定了，直到任务完成。这通常会导致操作系统向用户显示“程序无响应”（Application\
  \ is not responding）的警告。显然，这远不是任何应用程序的理想行为。这可以通过将将要执行的任务启动在单独线程中来避免，让主线程能够不受阻地继续处理其他任务。\n\
  \n### 56.3 线程处理器（Thread Handlers）\n\n显然，Android 开发的关键规则之一是绝不要在应用程序的主线程上执行耗时操作。第二条同样同样重要的规则是，在任何情况下，独立线程中的代码都绝不能直接更新用户界面的任何部分。\n\
  \n对用户界面的任何更改必须始终从主线程内部执行。之所以这样做是因为 Android UI 工具包不是线程安全的（thread-safe）。在多个线程内部尝试处理非安全的代码通常会导致间歇性问题和不可预测的应用程序行为。\n\
  \n如果在线程中执行的代码需要与用户界面交互，它必须通过与主 UI 线程同步来实现。这是通过在主线程中创建一个 handler 实现的，handler 反过来接收来自另一个线程的消息并相应地更新用户界面。\n\
  \n## 56.4 线程示例\n\n本章的剩余部分将通过一些简单的示例来提供对线程的基础介绍。第一步将强调在主线程之外的独立线程中执行耗时任务的重要性。\n\n\
  启动 Android Studio，从欢迎界面选择 New Project，在弹出的新项目对话框中选择 Empty Activity 模板，然后点击 Next\
  \ 按钮。\n\n在 Name 字段中输入 `ThreadExample`，并指定包名为 `com.ebookfrenzy.threadexample`。在点击\
  \ Finish 之前，将 Minimum API level 设置为 `API 26`: Android 8.0 (Oreo)，并将 Language 菜单改为\
  \ Java。按照章节 [11.8 Migrating a Project to View Binding] 中的步骤将项目转换为使用 view binding。\n\
  \n## 56.5 构建应用\n\n将项目的 `activity_main.xml` 文件加载到 Layout Editor 工具中。选择默认的 TextView\
  \ 组件并在 Properties 工具窗口中将视图 ID 改为 `myTextView`。\n\n在用户界面上添加一个 Button 视图，位于现有 TextView\
  \ 对象正下方，如图 [56-1] 所示。添加按钮后，点击工具栏上的 Infer Constraints 按钮以添加缺失的约束。\n\n将文本更改为“Press\
  \ Me”，并提取为名为 `press_me` 的资源。当按钮视图在布局中仍选中时，找到 `onClick` 属性并输入 `buttonClick` 作为方法名。\n\
  \n![](img/as_4.2_threadexample_ui.jpg)\n\n图 56-1\n\n\n\n\n接下来，将 `MainActivity.java`\
  \ 文件加载到编辑面板，并为 `buttonClick()` 方法添加代码，该方法将在用户点击 `Button` 视图时被调用。由于这里的目标是演示在主线程上执行耗时任务的问题，代码将在并在\
  \ `TextView` 对象上显示不同文本之前，简单地暂停 20 秒：\n\n```java\npublic void buttonClick(View view)\
  \ {\n    long endTime = System.currentTimeMillis() + 20 * 1000;\n    while (System.currentTimeMillis()\
  \ < endTime) {\n        synchronized (this) {\n            try {\n             \
  \   wait(endTime - System.currentTimeMillis());\n            } catch (Exception\
  \ e) {\n            }\n        }\n    }\n    binding.myTextView.setText(\"Button\
  \ Pressed\");\n}\n```\n\n完成代码更改后，在物理设备或模拟器上运行应用程序。一旦应用程序运行，点击按钮，此时应用程序将看起来处于冻结状态。例如，你将无法第二次点击按钮，在某些情况下，操作系统将报告应用程序无响应，如图\
  \ 56-2 所示。\n\n![](img/as_4.2_threadexample_not_responding.jpg)\n\n图 56-2\n\n显然，`buttonClick()`\
  \ 方法中任何需要时间完成的任务都需要在单独的线程中执行。\n\n## 56.6 创建新线程\n\n为了创建一个新线程，需要将在该线程中执行的代码放置在 `Runnable`\
  \ 实例的 `run()` 方法中。然后需要创建一个新的 `Thread` 对象，并将 `Runnable` 实例的引用传递给构造函数。最后，需要调用线程对象的\
  \ `start()` 方法来启动线程运行。因此，为了执行 `buttonClick()` 方法中的任务，需要进行以下更改：\n\n```java\npublic\
  \ void buttonClick(View view) {\n    Runnable runnable = new Runnable() {\n    \
  \    public void run() {\n            long endTime = System.currentTimeMillis()\
  \ + 20 * 1000;\n            while (System.currentTimeMillis() < endTime) {\n   \
  \             synchronized (this) {\n                    try {\n               \
  \         wait(endTime - System.currentTimeMillis());\n                    } catch\
  \ (Exception e) {\n                    }\n                }\n            }\n   \
  \     }\n        binding.myTextView.setText(\"Button Pressed\");\n    };\n    Thread\
  \ myThread = new Thread(runnable);\n    myThread.start();\n}\n```\n\n事实上，如果需要，可以使用\
  \ Java lambda 表达式来简化 `runnable` 的声明。进行此更改将导致如下声明：\n\n```java\nRunnable runnable\
  \ = () -> {\n    long endTime = System.currentTimeMillis() + 20 * 1000;\n    while\
  \ (System.currentTimeMillis() < endTime) {\n        synchronized (this) {\n    \
  \        try {\n                wait(endTime - System.currentTimeMillis());\n  \
  \          } catch (Exception e) {\n            }\n        }\n    }\n};\nThread\
  \ myThread = new Thread(runnable);\nmyThread.start();\n```\n\n现在运行应用程序时，触摸按钮会导致延迟在一个新的线程中执行，从而让主线程继续处理用户界面。事实上，每次触摸按钮时，都会创建一个新线程，允许任务执行多次。仔细检查\
  \ `buttonClick()` 方法的更新后的代码，会发现更新 `TextView` 的代码已被移除。如所述，从主线程以外的线程内部更新用户界面违反了 Android\
  \ 开发的一项关键规则。为了更新用户界面，有必要为线程实现一个 `Handler`。\n\n## 5.7 实现线程处理器\n\n线程处理器（Thread handlers）在应用程序的主线程中实现，主要用于响应应用程序内运行的其他线程发送的消息并对用户界面进行更新。Handlers\
  \ 继承自 `Handler` 类，可以通过指定由线程执行的 `Runnable`，或者通过重写 `Handler` 子类中的 `handleMessage()`\
  \ 方法来使用，当线程向处理器发送消息时，该方法会被调用。\n\n为了本示例，将实现一个 `handler` 以从之前创建线程内部更新用户界面。将 `MainActivity.java`\
  \ 文件加载到 Android 编辑器并修改代码，为 activity 添加一个 `Handler` 实例：\n\n```java\nimport android.os.Handler;\n\
  import android.os.Message;\nimport android.os.Looper;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    Handler handler = new Handler(Looper.getMainLooper())\
  \ {\n        @Override public void handleMessage(Message msg) {\n            binding.myTextView.setText(\"\
  Message Received\");\n        }\n    };\n}\n```\n\n上述更改声明了一个 `handler` 并在该处理器内部实现了\
  \ `handleMessage()` 回调，当线程向处理器发送消息时，该回调将被调用。在此实例中，代码仅在用户界面的 `TextView` 对象上显示一个字符串。现在只需修改\
  \ `buttonClick()` 方法中创建的线程，在延迟完成后向 `handler` 发送消息：\n\n```java\npublic void buttonClick(View\
  \ view) {\n    Runnable runnable = () -> {\n        long endTime = System.currentTimeMillis()\
  \ + 20 * 1000;\n        while (System.currentTimeMillis() < endTime) {\n       \
  \     synchronized (this) {\n                try {\n                    wait(endTime\
  \ - System.currentTimeMillis());\n                } catch (Exception e) {\n    \
  \            }\n            }\n        }\n        handler.sendEmptyMessage(0);\n\
  \    };\n    Thread myThread = new Thread(runnable);\n    myThread.start();\n}\n\
  ```\n\n注意，唯一的更改是调用了 `handler` 的 `sendEmptyMessage()`。由于 `handler` 目前不对接收到的任何消息内容执行任何操作，它发送的是空消息。编译并运行应用程序，执行后点击用户界面上的按钮。\n\
  \n## 5.8 向 Handler 传递消息\n\n虽然上一个示例触发了 `handleMessage()` 回调，但它没有利用消息对象向 `handler`\
  \ 传递数据。在教程的阶段，将修改示例以便在线程和 `handler` 之间传递数据。首先，`buttonClick()` 方法中更新的线程将从系统获取日期时间并将信息存储在\
  \ `Bundle` 中。然后调用 `handler` 的 `obtainMessage()` 方法获取消息。最后，在通过调用 `handler` 的 `sendMessage()`\
  \ 方法发送之前，将 `bundle` 添加到消息对象中：\n\n```java\npublic void buttonClick(View view) {\n\
  \    Runnable runnable = () -> {\n        long endTime = System.currentTimeMillis()\
  \ + 20 * 1000;\n        while (System.currentTimeMillis() < endTime) {\n       \
  \     synchronized (this) {\n                try {\n                    wait(endTime\
  \ - System.currentTimeMillis());\n                } catch (Exception e) {\n    \
  \            }\n            }\n        }\n        Message msg = handler.obtainMessage();\n\
  \        Bundle bundle = new Bundle();\n        bundle.putString(\"myKey\", \"Thread\
  \ Completed\");\n        msg.setData(bundle);\n        handler.sendMessage(msg);\n\
  \    };\n    Thread myThread = new Thread(runnable);\n    myThread.start();\n}\n\
  ```\n\n\n\n\n接下来，更新处理程序的 `handleMessage()` 方法，从消息的 `bundle` 对象中提取日期和时间字符串，并将其显示在\
  \ `TextView` 对象上：\n\n```java\nHandler handler = new Handler(Looper.getMainLooper())\
  \ {\n    @Override\n    public void handleMessage(Message msg) {\n        Bundle\
  \ bundle = msg.getData();\n        String string = bundle.getString(\"myKey\");\n\
  \        binding.myTextView.setText(string);\n    }\n};\n```\n\n最后，编译并运行应用程序，测试点击按钮后在线程结束后，`TextView`\
  \ 对象上是否会显示“Thread Complete（线程完成）”的消息。\n\n# 56.9 Java Executor 并发\n\n到本章为止，我们一直都在关注直接创建和管理\
  \ `Java` 线程。虽然对于简单的多线程任务这种做法是可以接受的，但在处理涉及大量线程的复杂情况时，这被证明是不够的。例如，启动和停止线程涉及系统开销。因此，创建一个并销毁大量线程的应用程序可能会面临性能下降的风险。基础线程\
  \ API 也没有提供调度或重复任务执行、或从任务返回结果的预构建选项。\n\n直接与线程操作的缺点可以通过使用 `Java Concurrent` 框架（属于\
  \ `java.util.concurrent` 包）中的 `Executor` 类来克服。该框架允许创建一个活动线程池，并管理如何将任务分配给这些线程。这使得现有线程可以重用于其他任务，而无需不断创建新线程。\n\
  \n该框架还提供了额外功能，包括在任务完成后返回结果的能力（称为 `Callable` 任务）、检查线程状态以及调度任务在超时后或按重复的时间间隔运行。\n\n\
  ## 56.10 使用 Runnable 任务工作\n\n探索此框架的第一步是修改 `buttonClicked()` 方法，使用并发框架 `Executor`\
  \ 在单独线程中运行任务：\n\n```java\nimport java.util.concurrent.ExecutorService;\nimport java.util.concurrent.Executors;\n\
  \npublic void buttonClick(View view) {\n    ExecutorService executor = Executors.newSingleThreadExecutor();\n\
  \    executor.submit(new Runnable(){\n        public void run(){\n            long\
  \ endTime = System.currentTimeMillis() + 10 * 1000;\n            while (System.currentTimeMillis()\
  \ < endTime) {\n                synchronized (this) {\n                    try {\n\
  \                        wait(endTime - System.currentTimeMillis());\n         \
  \           } catch (Exception e) {\n                    }\n                }\n\
  \            }\n            Message msg = handler.obtainMessage();\n           \
  \ Bundle bundle = new Bundle();\n            bundle.putString(\"myKey\", \"Button\
  \ Pressed\");\n            msg.setData(bundle);\n            handler.sendMessage(msg);\n\
  \        }\n    });\n    executor.shutdown();\n}\n```\n\n当执行上述代码时，超时将像以前一样在单独线程中执行。然而，对方法进行的更改需要一些解释。首先，从\
  \ `Executors` 实例获取 `ExecutorService` 实例的引用：\n\n`ExecutorService executor = Executors.newSingleThreadExecutor();`\n\
  \n在这种情况下，请求了一个只包含一个线程的池。也可以如下所示请求具有指定线程数量的池：\n\n`ExecutorService executor = Executors.newFixedThreadPool(10);`\n\
  \n接下来，通过调用执行器实例的 `submit()` 方法在线程上启动一个 `Runnable` 任务：\n\n`executor.submit(new Runnable(){\
  \ public void run(){ long endTime = System.currentTimeMillis() + 20 * 1000; });`\n\
  \n注意，可以通过将其转换为 lambda 表达式来简化上述声明：\n\n`executor.submit(() -> { long endTime = System.currentTimeMillis()\
  \ + 20 * 1000; });`\n\n从现在开始，任务将一直运行直到完成。一旦完成，执行器服务将继续运行。如果你不再需要该服务，则应该将其关闭。\n\n\
  ### 6.1.1 关闭 ExecutorService 服务\n\n`ExecutorService` 提供了几种启动关闭的技巧。要通知服务在当前运行的任务达到完成状态后自动关闭，应如下所示调用\
  \ `shutdown()` 方法：\n\n`executor.shutdown();`\n\n另一方面，调用 `shutdownNow()` 方法会停止服务上运行的所有任务，并取消对待处理任务的处理：\n\
  \n`executor.shutdownNow();`\n\n### 6.1.2 使用 Callable 任务和 Futures 工作\n\n如前所述，`ExecutorService`\
  \ 支持所谓的“Callable”任务，该任务能够在任务完成后返回一个结果。运行在单独线程上的任务通常被认为需要一些时间才能完成（否则它们可能根本就不需要运行在单独的线程中）。这引出了一个问题：如何将结果返回到启动任务的代码中。这是通过使用\
  \ `Future` 类型实现的，它代表了未来某个时刻将提供的值。\n\n当执行 `callable` 任务时，它会返回一个 `Future` 实例，应用程序可以使用该实例在任务完成后获取结果。要查看其实效果，首先编辑\
  \ `activity_main.xml` 文件，添加一个标签为“Status”的额外按钮，并将 `onClick` 属性配置为调用名为 `statusClick`\
  \ 的方法：\n\n(image/as_4.2_threadexample_status_button.jpg) 图 56-3\n\n接下来，修改 `buttonClick()`\
  \ 方法以执行一个 `Callable` 任务，该任务通过 `Future` 变量配置为返回 `String` 值：\n\n```java\nimport java.util.concurrent.Callable;\n\
  import java.util.concurrent.Future;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    Future<String> future;\n\n    public void buttonClick(View view) {\n  \
  \      ExecutorService executor = Executors.newSingleThreadExecutor();\n       \
  \ future = executor.submit(new Callable<String>() {\n            public String call()\
  \ {\n                long endTime = System.currentTimeMillis() + 10 * 1000;\n  \
  \              while (System.currentTimeMillis() < endTime) {\n                \
  \    synchronized (this) {\n                        try {\n                    \
  \        wait(endTime - System.currentTimeMillis());\n                        }\
  \ catch (Exception e) {\n                        }\n                    }\n    \
  \            }\n                return \"Task Completed\";\n            }\n    \
  \    });\n        executor.shutdown();\n    }\n}\n```\n\n注意，除了导入 `java.util.concurrent.Future`\
  \ 包并声明一个存储字符串值的 `Future` 变量外，启动任务的方式也进行了一些更改：\n\n`future = executor.submit(new Callable<String>()\
  \ { ... });`\n\n这里的关键点是，我们不再向执行器服务提交 `Runnable` 任务，而是传递一个 `Callable` 任务（声明返回 `String`\
  \ 值）。注意注意任务的结果赋值给了 `Future` 变量。此外，使用 `call()` 方法代替了以前提交 `Runnable` 任务时使用的 `run()`\
  \ 方法。最后，添加了返回语句以返回字符串值：\n\n`return \"Task Completed\"`\n\n## 56.13 处理 Future 结果\n\
  \n`buttonClick()` 方法现在配置为启动 `Callable` 任务，并将返回值赋值给 `Future` 变量。应用程序现在需要知道任务何时完成以及结果何时可用。一种方案是调用\
  \ `Future` 变量的 `get()` 方法。由于该方法在执行失败或被中断时可能会抛出异常，必须在 `try/catch` 语句中执行，如下所示：\n\n\
  ```java\nString result = null;\ntry {\n```\n\n\n\n\n\n```java\nresult = future.get();\n\
  \n} catch (ExecutionException | InterruptedException e) {\n    e.printStackTrace();\n\
  }\n```\n\n遗憾的是，`get()` 方法将阻塞当前线程，直到在线程中运行的任务完成，这从而违背了最初在独立线程中运行任务的意图。另一个选项是为 `get()`\
  \ 方法提供一个超时时间，到期后它会将控制权返回给当前线程。例如，以下代码将导致 `get()` 调用在 3 秒后超时：\n\n```java\nresult\
  \ = future.get(3, TimeUnit.SECONDS);\n```\n\n然而，更好的替代方案是调用 `Future` 实例的 `isDone()`\
  \ 方法来检查线程状态，仅在任务完成后才调用 `get()` 方法。要实现此行为，请如下所示向 `MainActivity.java` 文件添加 `statusClick()`\
  \ 方法：\n\n```java\nimport java.util.concurrent.ExecutionException;\nimport java.util.concurrent.TimeUnit;\n\
  import java.util.concurrent.TimeoutException;\n\npublic void statusClick(View view)\
  \ {\n    if (future.isDone()) {\n        String result = null;\n        try {\n\
  \            result = future.get(3, TimeUnit.SECONDS);\n        } catch (ExecutionException\
  \ | InterruptedException | TimeoutException e) {\n            e.printStackTrace();\n\
  \        }\n        binding.myTextView.setText(result);\n    } else {\n        binding.myTextView.setText(\"\
  Waiting\");\n    }\n}\n```\n\n完成更改后，运行应用并点击“Press Me”按钮。在任务运行期间，点击“Status”按钮。只要任务仍在运行，TextView\
  \ 中就会显示“Waiting”消息。然而，一旦任务完成，`isDone()` 方法将返回 `true` 值，将调用 `get()` 方法，并且任务返回的字符串（“Task\
  \ Complete”）将显示在 TextView 上。\n\n## 56.14 任务调度\n\n最后一个涵盖的内容涉及使用 `ExecutorService`\
  \ 来调度任务执行。这涉及到使用 `ScheduledExecutorService` 实例，并在该实例上调用 `schedule()` 方法，并传入要执行的\
  \ `Runnable` 任务以及一个时间延迟。`schedule()` 调用将返回一个 `ScheduledFuture` 实例，该实例可以用于识别任务启动前的剩余时间。\n\
  \n例如，以下代码调度了一个在 30 秒延迟后运行的任务，并访问了剩余延迟时间：\n\n```java\nScheduledExecutorService executor\
  \ = Executors.newScheduledThreadPool(1);\nRunnable task = () -> {\n    // 在此处执行任务的代码\n\
  };\nScheduledFuture<?> future = executor.schedule(task, 30, TimeUnit.SECONDS);\n\
  long delayRemaining = future.getDelay(TimeUnit.SECONDS);\n```\n\n同样，`ScheduledExecutorService`\
  \ 可用于在可选的初始延迟后，以固定的间隔重复执行某个任务。例如，以下代码导致任务在初始 30 秒延迟后每隔 10 秒执行一次：\n\n```java\nexecutor.scheduleAtFixedRate(task,\
  \ 30, 10, TimeUnit.SECONDS);\n```\n\n`scheduleAtFixedRate()` 方法无论之前调度的任务是否完成，都会启动任务的下一个实例。若要指定任务执行结束与下一次执行开始之间的固定时间间隔，请使用\
  \ `scheduleWithFixedDelay()` 方法。在以下示例中，第一个任务在延迟 0 秒后被调度，随后的每次执行都会在上一个任务完成后 10 秒后发生：\n\
  \n```java\nexecutor.scheduleWithFixedDelay(task, 0, 10, TimeUnit.SECONDS);\n```\n\
  \n## 56.15 总结\n\n本章的目标是概述 Android 中的多线程。当应用程序在进程中首次启动时，运行时系统会创建一个主线程，所有随后启动的应用程序组件默认都在该线程中运行。主线程的主要作用是处理用户界面，因此在该线程中执行的任何耗时任务都会导致应用出现假死的假象。因此，将可能需要时间完成的任务在独立线程中启动是非常关重要的。\n\
  \n由于 Android 用户界面包不是线程安全的，因此不应在主线程以外的任何线程中更改用户界面。可以通过在主线程中创建一个 handler 来实现用户界面更改，并从其他非主线程向其发送消息。\n\
  \n线程可以直接创建，也可以使用 Java Concurrent 框架的执行器服务。对于更复杂的线程需求，该框架提供了线程池的自动管理、任务结果返回以及执行调度。\n\
  \n## 57. Android 服务概览\n\n`Service` 类专门设计用于允许应用程序启动并执行后台任务。与广播接收器（broadcast receivers）旨在快速执行任务并退出不同，服务\
  \ 设计用于执行耗时较长时间的任务（例如通过互联网连接下载文件或向用户流式传输音乐），但不需要用户界面。\n\n在本章中，将概述不同类型的可用服务，包括启动服务（started\
  \ services）、绑定服务（bound services）和意图服务（intent services）。在涵盖这些基础知识后，后续章节将通过多个服务运行的示例。\n\
  \n## 57.1 启动服务\n\n启动服务由其他应用程序组件（如 Activity 甚至是广播接收器）启动，并可能在后台无限运行，直到服务被停止，或者被 Android\
  \ 运行时系统销毁以释放资源。如果启动它的应用程序不再处于前台，该服务将继续运行，即使在最初启动服务的组件被销毁的情况下也是如此。\n\n在默认情况下，服务将在与其启动的应用程序相同的主线程中运行（称为本地服务）。因此，将任何密集\
  \ 任务在线程中执行是有关重要的。要指示服务在单独进程中运行（因此被称为远程服务），需要在清单文件中进行配置。\n\n除非服务被显式配置为私有（再次通过清单文件中的设置），否则该服务可以在同一\
  \ Android 设备上的其他组件启动。这是通过使用 Intent 机制实现的，方式类似于之前章节所述的 Activity 启动另一个 Activity。\n\
  \n启动服务通过调用 `startService()` 方法启动，并传入标识要启动服务的 `Intent` 对象。当启动服务完成其任务后，它应该通过调用 `stopSelf()`\
  \ 停止自己。或者，运行的服务可以通过另一个组件通过调用 `stopService()` 来停止，并传入匹配的用于停止服务的 `Intent`。\n\n服务被\
  \ Android 系统赋予高优先级，通常是释放资源时最后被终止的服务之一。\n\n## 57.2 Intent 服务\n\n如前所述，服务默认在与其启动的组件相同的主线程中运行。因此，需要由服务执行的任何密集任务都应在新线程中进行，以避免影响调用应用程序的性能。\n\
  \n`JobIntentService` 类是一个便利类（子自 `Service` 类），它设置了一个工作线程来处理后台任务，并以异步方式处理每个请求。一旦服务处理了所有队列中的请求，它将直接退出。使用\
  \ `JobIntentService` 类只需实现 `onHandleWork()` 方法，并在其中包含为每个请求执行的代码。\n\n\n\n\n\n对于不需要同步处理请求的服务，`JobIntentService`\
  \ 是推荐的选项。然而，需要同步处理请求的服务需要继承自 `Service` 类，并手动实现和管理线程，以高效地处理任何 CPU 密集型任务。\n\n## 57.3\
  \ 绑定服务 (Bound Service)\n\n绑定服务与启动服务类似，不同之处在于启动服务通常不会返回结果，也不允许与启动它的组件进行交互。相反，绑定服务允许启动组件与服务进行交互并从其接收结果。通过进程间通信（IPC）的实现，这种交互也可以跨进程边界进行。例如，一个\
  \ activity 可能会启动一个服务来处理音频播放。该 activity 可能会包含一个用户界面，为用户提供控制控件，用于暂停播放或跳到下一曲。同样，该服务很可能需要向调用它的\
  \ activity 通信信息，指示当前音频轨道已完成，并提供即将开始播放的下一曲的详情。\n\n组件（在此上下文中也称为客户端）通过调用 `bindService()`\
  \ 方法启动并绑定到绑定服务。此外，多个组件可以同时绑定到同一个服务。当客户端不再需要服务绑定时，应调用 `unbindService()` 方法。当最后一个绑定的客户端从服务取消绑定时，该服务将由\
  \ Android 运行时系统终止。需要注意的是，绑定服务也可以通过调用 `startService()` 来启动。一旦启动，组件就可以通过 `bindService()`\
  \ 调用绑定到它。当绑定服务通过调用 `startService()` 启动时，即使在最后一个客户端从其取消绑定后，它仍将继续运行。\n\n绑定服务必须包含 `onBind()`\
  \ 方法的实现，该方法在服务首次创建时以及其他客户端随后绑定到运行中的服务时都会被调用。此方法的目的是向已绑定的客户端返回一个类型为 `IBinder` 的对象，该对象包含了客户端与服务通信所需的信息。\n\
  \n在实现客户端与绑定服务之间的通信方面，推荐的技术取决于客户端和服务是否处于同一个进程或不同的进程中，以及服务是否对客户端是私有的。本地通信可以通过扩展 `Binder`\
  \ 类并从 `onBind()` 方法返回一个实例来实现。另一方面，进程间通信需要 `Messenger` 和 `Handler` 的实现。这两种方法的详细细节将在随后的章节中进行介绍。\n\
  \n## 57.4 服务的结构 (The Anatomy of a Service)\n\n正如前面提到的，服务必须创建为 Android `Service`\
  \ 类（更具体地说是 `android.app.Service`）或其子类（例如 `android.app.IntentService`）。在类化过程中，取决于所创建的服务的具体性质，必须重写以下一个或多个父类回调方法：\n\
  \n- `onStartCommand()` – 当服务通过另一个组件调用 `startService()` 方法启动服务时，会调用此方法。对于绑定服务，不需要实现此方法。\n\
  - `onBind()` – 当组件通过调用 `bindService()` 方法绑定到服务时调用。在实现绑定服务时，此方法必须返回一个 `IBinder` 对象，以促进与客户端的通信。对于启动服务，必须实现此方法并返回一个\
  \ `NULL` 值。\n- `onCreate()` – 旨在作为执行初始化的地方，该方法在 `onStartCommand()` 调用或第一次调用 `onBind()`\
  \ 之前立即调用。\n- `onDestroy()` – 当服务被销毁时调用。\n- `onHandleWork()` – 仅适用于 `IntentService`。调用此方法在单独线程中处理工作。注意，`IntentService`\
  \ 包含了它自己的 `onStartCommand()` 和 `onBind()` 实现，因此不需要再实现它们。\n\n## 57.5 控制服务的重启 (Controlling\
  \ Service Restart)\n\n`onStartCommand()` 方法要求返回一个整数值，以定义服务被运行时系统销毁时服务应该发生的情况。这些方法的可能值有：\n\
  \n- `START_NOT_STICKY` – 向系统指示，如果服务被销毁，除非有待处理的意（intents），否则不应重启服务。\n- `START_STICKY`\
  \ – 表示服务在销毁后应尽快重启并返回之前的意。\n- `START_REDELIVER_INTENT` – 表示如果服务在从 `onStartCommand()`\
  \ 方法返回后被销毁，则应使用当前意重启服务。\n\n## 57.6 在清单文件中声明服务 (Declaring a Service in the Manifest\
  \ File)\n\n为了使服务可用，必须首先在清单文件内声明它。这涉及在 `<application>` 条目中嵌入一个配置适当的 `<service>` 元素。至少，`<service>`\
  \ 元素必须包含一个属性，声明服务的类名，如下例 XML 所示：\n\n```xml\n<application\n    android:icon=\"@mipmap/launcher\"\
  \n    android:label=\"@string/app_name\">\n    <activity android:name=\".MainActivity\"\
  >\n        <intent-filter>\n            <action android:name=\"android.intent.action.MAIN\"\
  \ />\n            <category android:name=\"android.intent.category.LAUNCHER\" />\n\
  \        </intent-filter>\n    </activity>\n    <service android:name=\".MyService\"\
  \ />\n</application>\n```\n\n默认情况下，服务被声明为公共，这意味着它们可以被其所在应用程序包之外的组件访问。为了使服务私有，必须在清单文件的\
  \ `<service>` 元素中将 `android:exported` 属性声明为 `false`。例如：\n\n```xml\n<service android:name=\"\
  MyService\"\n    android:exported=\"false\">\n</service>\n```\n\n在使用 `JobIntentService`\
  \ 时，清单中的服务声明还必须如下请求 `BIND_JOB_SERVICE` 权限：\n\n```xml\n<service\n    android:name=\"\
  .MyJobIntentService\"\n    android:permission=\"android.permission.BIND_JOB_SERVICE\"\
  \ />\n```\n\n正如之前讨论，服务默认在调用组件相同的进程中运行。为了强制服务在它自己的进程中运行，需要在 `<service>` 元素中添加 `android:process`\
  \ 属性，声明一个以冒号（`:`）开头的进程名称：\n\n```xml\n<service android:name=\".MyService\"\n    android:exported=\"\
  false\"\n    android:process=\":myprocess\">\n</service>\n```\n\n冒号前缀表示新进程对本地应用程序私有。然而，如果进程名称以小写字母而不是冒号开头，则该进程将是全局的，供其他组件使用。\n\
  \n\n\n\n最后，使用与 Activity 相同的意图过滤器机制，服务也可以也可以向设备上运行的其他应用程序发布功能。有关意图过滤器的更多细节，请参阅“Android\
  \ Intent 概述”章节。\n\n## 57.7 在系统启动时启动服务\n\n鉴于服务的后台特性，在 Android 系统首次启动时需要启动服务的情况并不罕见。这可以通过创建一个广播接收器（broadcast\
  \ receiver）并配置意图过滤器来监听系统的 `android.intent.action.BOOT_COMPLETED` 意图。当检测到此类意图时，广播接收器只需调用必要的服务并返回。请注意，为了运行，此类广播接收器需要请求\
  \ `android.permission.RECEIVE_BOOT_COMPLETED` 权限。\n\n## 57.8 总结\n\nAndroid 服务是一种强大的机制，允许应用程序在后台执行任务。服务一旦启动，无论调用它的应用程序是否为前台任务，即使在启动服务的组件被销毁的情况下，它都将继续运行。\n\
  \n服务继承自 `Android Service` 类，并分为启动服务（started services）或绑定服务（bound services）。启动服务一直运行直到被停止或销毁，它们本身不提供与其他组件进行交互或数据交换的机制。相比之下，绑定服务为其他客户端组件提供了通信接口，并且通常一直运行到最后一个客户端从服务取消绑定为止。\n\
  \n默认情况下，服务在与调用应用程序相同的进程和主线程中本地运行。因此，应该在服务内部创建一个新线程用于处理 CPU 密集型任务。通过对应用程序清单文件（manifest\
  \ file）中相应的 `<service>` 项进行细小的配置更改，可以在单独进程中启动远程服务。\n\n`IntentService` 类（本身是 `Android\
  \ Service` 类的子类）提供了一种方便的机制，用于在单独的工作线程中处理异步服务请求。\n\n## 58. 实现一个 Android 启动服务 —— 实例教程\n\
  \n上一章涵盖了大量与 Android 服务相关的信息，此时此刻，服务的概念可能看起来有些眼不缭乱。为了强化上一章中的信息，本章将通过一个 Android Studio\
  \ 教程，旨在逐步介绍启动服务的实现概念。\n\n在本章中，将创建一个示例应用程序并将其作为实现 Android 服务的的基础。首先，将使用 `IntentService`\
  \ 类创建服务。随后将扩展此示例以演示如何使用 `Service` 类。最后，将实现在使用 `Service` 类时在单独线程中执行任务的步骤。在本章涵盖了启动服务后，下一章名为“Android\
  \ 本地绑定服务 – 实例教程”，将重点关注绑定服务的实现以及客户端与服务之间的通信。\n\n## 58.1 创建示例项目\n\n从欢迎界面选择 `New Project`\
  \ 选项，在弹出的新项目对话框中，选择 `Empty Activity` 模板，然后点击 `Next` 按钮。\n\n在 `Name` 字段中输入 `ServiceExample`，并指定\
  \ `com.ebookfrenzy.serviceexample` 为包名。在点击 `Finish` 按钮之前，将 Minimum API 级别设置改为 `API\
  \ 26: Android 8.0 (Oreo)`，并将语言菜单更改为 `Java`。按照章节 11.8 将项目迁移到 View Binding 中所述，修改项目以支持视图绑定。\n\
  \n## 58.2 设计用户界面\n\n在 Project 工具窗口（`app -> res -> layout -> activity_main.xml`）中找到并加载\
  \ `activity_main.xml` 文件。右键点击“Hello World!” `TextView`，并在出的菜单中选择 `Convert view...`\
  \ 选项。在转换对话框中，点击 `Apply` 之前选择 `Button` 视图。选择新按钮，将文本更改为“Start Service”，并将字符串提取为名为\
  \ `start_service` 的资源。在保持选中新 `Button` 的情况下，在 Attributes 面板中找到 `onClick` 属性，并分配一个名为\
  \ `buttonClick` 的方法。\n\n## 58.3 创建服务类\n\n在编写任何代码之前，第一步是向项目添加一个新类来包含服务。本教程中演示的第一类服务将基于\
  \ `JobIntentService` 类。如前一章所述（“Android 服务概述”），`JobIntentService` 类的目的是为开发者提供一种方便的机制，用于创建在调用应用程序的单独线程中异步执行任务的服务。\n\
  \n在 Project 工具窗口中，右键点击 `app -> java` 下的 `com.ebookfrenzy.serviceexample` 包名，选择 `New\
  \ -> Java Class` 菜单选项，向项目添加新类。在弹出的对话框中，将新类命名为 `MyJobIntentService`。最后，创建新类。\n\n\
  在 Android Studio 编辑器中查看新的 `MyJobIntentService.java` 文件，其内容应如下：\n\n```java\npackage\
  \ com.ebookfrenzy.serviceexample;\n\npublic class MyJobIntentService {\n\n}\n```\n\
  \n需要修改该类以便继承 `JobIntentService` 类。在继承 `JobIntentService` 时，该类必须重写 `onHandleWork()`\
  \ 方法。因此，修改 `MyJobIntentService.java` 文件中的代码，使其内容如下：\n\n```java\npackage com.ebookfrenzy.serviceexample;\n\
  \nimport android.content.Intent;\nimport androidx.core.app.JobIntentService;\nimport\
  \ androidx.annotation.NonNull;\n\npublic class MyIntentService extends JobIntentService\
  \ {\n\n    @Override\n    protected void onHandleWork(@NonNull Intent intent) {\n\
  \n    }\n}\n```\n\n剩下的工作是在 `onHandleWork()` 方法中实现代码，以便服务在被调用时实际执行操作。通常这涉及到需要一些时间的任务，例如下载文件或播放音频。但对于本例而言，处理程序将睡眠\
  \ 30 秒，并每 10 秒向 Android Studio Logcat 输出一条消息：\n\n```java\npackage com.ebookfrenzy.serviceexample;\n\
  \nimport android.util.Log;\n\npublic class MyIntentService extends JobIntentService\
  \ {\n    private static final String TAG = \"ServiceExample\";\n    @Override\n\
  \    protected void onHandleWork(@NonNull Intent intent) {\n        Log.i(TAG, \"\
  Job started\");\n        int i = 0;\n        while (i <= 3) {\n            try {\n\
  \                Thread.sleep(10000);\n                i++;\n            } catch\
  \ (Exception e) {\n            }\n        }\n        Log.i(TAG, \"Service running\"\
  );\n    }\n}\n```\n\n## 58.4 在清单文件中添加服务\n\n在调用服务之前，必须先将其添加到所属应用程序的清单文件中。至少涉及添加 `<service>`\
  \ 元素、服务的类名以及 `BIND_JOB_SERVICE` 权限请求。\n\n双击当前项目的 `AndroidManifest.xml` 文件（`app ->\
  \ manifests`）将其加载到编辑器中，并按照以下列表修改 XML 以添加服务元素：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.example.serviceexample\" >\n\n    <application\n        android:allowBackup=\"\
  true\"\n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\
  \n        android:roundIcon=\"@mipmap/ic_launcher_round\">\n```\n\n\n\n\n```xml\n\
  <android:supportsRtl=\"true\"\n        android:theme=\"@style/Theme.ServiceExample\"\
  \ >\n\n    <activity\n        android:name=\".MainActivity\"\n        android:exported=\"\
  true\">\n        <intent-filter>\n            <action android:name=\"android.intent.action.MAIN\"\
  \ />\n            <category android:name=\"android.intent.category.LAUNCHER\" />\n\
  \        </intent-filter>\n    </activity>\n    <service\n        android:name=\"\
  .MyJobIntentService\"\n        android:permission=\"android.permission.BIND_JOB_SERVICE\"\
  \ />\n</application>\n</manifest>\n```\n\n## 58.5 启动服务\n\n现在服务已经实现并在 manifest 文件中声明，下一步是添加代码以便在点击按钮时启动服务。找到并서\
  \ `MainActivity.java` 文件加载到编辑器中，并实现 `buttonClick()` 方法以添加启动服务的代码：\n\n```java\npackage\
  \ com.ebookfrenzy.serviceexample;\n\nimport android.content.Intent;\nimport static\
  \ androidx.core.app.JobIntentService.enqueueWork;\n\npublic class MainActivity extends\
  \ AppCompatActivity {\n    static final int SERVICE_ID = 1001;\n\n    public void\
  \ buttonClick(View view) {\n        Intent intent = new Intent();\n        enqueueWork(this,\
  \ MyJobIntentService.class, SERVICE_ID, intent);\n    }\n}\n```\n\n该代码声明了一个服务 ID（可以是任何整数值），用于识别该服务。接下来，实现了\
  \ `buttonClick()` 方法来调用 `JobIntentService` 类的 `enqueueWork()` 方法，以提交服务执行。\n\n##\
  \ 58.6 测试 IntentService 示例\n\n这个基于 IntentService 的服务示例现在完成并准备好进行测试。由于服务显示的消息将出现在\
  \ Logcat 面板中，因此在 Android Studio 环境中进行配置至关重要。\n\n首先，显示 Logcat 工具窗口，然后点击面板右上角的菜单（该菜单目前可能显示为\
  \ Show only selected application）。从该菜单中，选择 Edit Filter Configuration 菜单选项。\n\n在\
  \ Create New Logcat Filter 对话框中，将过滤器命名为 `ServiceExample`，并在 Log Tag 字段中输入在 `MyIntentService.java`\
  \ 中声明的 `TAG` 值（在上面的代码中为 `ServiceExample`）。\n\n更改完成后，点击 OK 按钮创建过滤器并关闭对话框。新创建的过滤器现在应该已经在\
  \ Android 工具窗口中选中。配置过滤器后，在物理设备或 AVD 模拟器上运行应用程序，点击 Start Service 按钮。注意 Logcat 面板中出现了“Job\
  \ Service Started”消息。注意在应用程序启动后可能需要将过滤器设置改回 `ServiceExample`：\n\n`2021-01-14 14:20:05.630\
  \ 793-265 com.example.service/ServiceExample: Job Service started`\n\n在接下来的 30 秒内，Running\
  \ 信息将每隔 10 秒出现一次。需要注意的是，此执行是在主线程的独立线程中进行的，应用程序可以自由响应并执行其他任务。\n\n## 58.7 使用 Service\
  \ 类\n\n虽然 `JobIntentService` 类允许用极少的代码实现服务，但在某些情况下，`Service` 类的灵活性和同步性质将变得非常明显。为了避免一次性引入过多概念，并作为在调用应用程序同一线程中执行耗时任务的固有风险的演示，此处创建的示例将不在新线程中运行任务，而是依赖应用程序的主线程。在服务内部创建和管理新线程将在下一阶段介绍。\n\
  \n## 58.8 创建新服务\n\n为了本示例，将向项目添加一个 `Service` 类的子类。右键点击 Project 工具窗口中 java 下列出的包名，并选择\
  \ New -> Service。创建一个名为 `MyService` 的新类，并勾选 Exported 和 Enabled 选项。创建一个可运行服务的最低要求是实现\
  \ `onStartCommand()` 回调，该回调会在服务启动时被调用。此外，`onBind()` 方法必须返回空值，以向 Android 系统指示这不是绑定服务。为了本示例，`onStartCommand()`\
  \ 方法将循环 3 次，每次迭代休  10 秒。为了完整性，`MyService.java` 中还将实现 `onCreate()` 和 `onDestroy()`\
  \ 方法的存根版本，如下：\n\n```java\npackage com.ebookfrenzy.serviceexample;\nimport android.app.Service;\n\
  import android.content.Intent;\nimport android.os.IBinder;\nimport android.util.Log;\n\
  \npublic class MyService extends Service {\n    public MyService() {\n    }\n  \
  \  private static final String TAG = \"ServiceExample\";\n\n    @Override\n    public\
  \ void onCreate() {\n        Log.i(TAG, \"Service onCreate\");\n    }\n\n    @Override\n\
  \    public int onStartCommand(Intent intent, int flags, int startId) {\n      \
  \  Log.i(TAG, \"Service onStartCommand \" + startId);\n        int i = 0;\n    \
  \    while (i <= 3) {\n            try {\n                Thread.sleep(10000);\n\
  \                i++;\n            } catch (Exception e) {\n            }\n    \
  \        Log.i(TAG, \"Service running\");\n        }\n        return Service.START_STICKY;\n\
  \    }\n\n    @Override\n    public IBinder onBind(Intent arg0) {\n        Log.i(TAG,\
  \ \"Service onBind\");\n        return null;\n    }\n\n    @Override\n    public\
  \ void onDestroy() {\n        Log.i(TAG, \"Service onDestroy\");\n    }\n}\n```\n\
  \n服务实现后，将 `AndroidManifest.xml` 文件加载到编辑器中，验证 Android Studio 是否已为新服务添加了相应的条目，其内容如下：\n\
  \n```xml\n<service\n    android:name=\".MyService\"\n    android:enabled=\"true\"\
  \n    android:exported=\"true\" >\n</service>\n```\n\n## 58.9 启动服务\n\n编辑 `MainActivity.java`\
  \ 文件并修改 `buttonClick()` 方法以启动 `MyService` 服务：\n\n```java\npublic void buttonClick(View\
  \ view)\n{\n    Intent intent = new Intent(this, MyService.class);\n    startService(intent);\n\
  }\n```\n\n`buttonClick()` 方法只是为新服务创建一个 `Intent` 对象并启动它。\n\n## 58.10 运行应用程序\n\n运行应用程序并在加载后触摸\
  \ Start Service 按钮。在 Logcat 工具窗口（使用之前创建的 `ServiceExample` 过滤器）中，将出现日志消息表示 `buttonClick()`\
  \ 方法已调用。\n\n\n\n\n\n如“Java 线程、处理器和执行器概述”概述，当 Android 应用程序首次启动时，运行时系统会创建一个线程，所有应用程序组件默认将在该线程中运行。该线程通常被称为主线程。主线程的主要作用是处理用户界面，包括事件处理以及与用户界面中视图的交互。在应用程序内部启动的任何额外组件默认也会运行在主线程上。\n\
  \n正如上一节所示，任何在主线程上执行耗时操作的组件都会导致应用程序在任务任务完成之前处于无响应状态。因此，Android 提供了一个允许应用程序创建和使用额外线程的\
  \ API，这并不意外。在主线程之外的独立线程中执行的任务本质上是在后台执行的。此类线程通常被称为后台线程或工作线程。\n\n修改 `MyService.java`\
  \ 文件中的 `onStartCommand()` 方法，如下所示在独立线程中执行任务：\n\n```java\n@Override\npublic int onStartCommand(Intent\
  \ intent, int flags, int startId) {\n    Log.i(TAG, \"Service onStartCommand \"\
  \ + startId);\n    Runnable runnable = () -> {\n        int i = 0;\n        while\
  \ (i <= 3) {\n            try {\n                Thread.sleep(10000);\n        \
  \        i++;\n            } catch (Exception e) {\n            }\n            Log.i(TAG,\
  \ \"Service running \" + startId);\n        }\n    };\n    Thread serviceThread\
  \ = new Thread(runnable);\n    serviceThread.start();\n    return Service.START_STICKY;\n\
  }\n```\n\n现在运行应用程序，应该可以多次点击“启动服务”（Start Service）按钮。这样做时，Logcat 输出应指示有多个任务在同时运行：\n\
  \nI/ServiceExample: Service onStartCommand 1\nI/ServiceExample: Service onStartCommand\
  \ 2\nI/ServiceExample: Service onStartCommand 3\nI/ServiceExample: Service running\
  \ 1\nI/ServiceExample: Service running 2\nI/ServiceExample: Service running 3\n\n\
  由于服务现在在主线程之外处理请求，应用程序对用户和 Android 系统都保持响应状态。\n\n## 58.12 总结\n本章通过一个使用 `IntentService`\
  \ 和 `Service` 类实现 Android 启动服务的示例进行了讲解。该示例还演示了在服务内部使用异步任务以避免应用程序的主线程变得无响应。\n\n##\
  \ 59. Android 本地绑定服务 – 实例示例\n正如前面的章节中详细概述的那样，绑定服务与启动服务不同，它提供了一种实现 Android 服务与一个或多个客户端组件之间通信的机制。本章的目的是基于“Android\
  \ 服务概述”中提供的绑定服务概述，开始对本地绑定服务进行实例实现。\n\n## 59.1 理解绑定服务\n与启动服务相同，提供绑定服务的目的是为了允许应用程序在后台执行任务。然而，与启动服务不同，多个客户端组件可以绑定到一个绑定服务上，并且一旦绑定，就可以使用多种机制与该服务进行交互。\n\
  \n绑定服务作为 `Service` 类的子类创建，并且至少必须实现 `onBind()` 方法。客户端组件通过调用 `bindService()` 方法绑定到服务。对绑定服务的第一个绑定请求将导致调用该服务的\
  \ `onBind()` 方法（随后的绑定请求不会触发 `onBind()` 调用）。想要绑定到服务的客户端还必须实现一个 `ServiceConnection`\
  \ 子类，其中包含 `onServiceConnected()` 和 `onServiceDisconnected()` 方法，这两个方法将在客户端-服务器连接建立或断开后分别调用。在\
  \ `onServiceConnected()` 方法的情况下，将传递一个 `IBinder` 对象，该对象包含了客户端与服务交互所需的信息。\n\n## 59.2\
  \ 绑定服务的交互选项\n实现客户端组件与绑定服务之间交互有两种推荐机制。如果绑定服务是本地的且对客户端组件所在的同一应用程序私有（也就是说，它在同一个进程中运行，对其他应用程序中的组件不可用），推荐的方法是创建一个\
  \ `Binder` 类的子类并扩展它以为服务提供接口。然后通过 `onBind()` 方法返回该 `Binder` 对象的实例，随后供客户端组件直接访问服务中持有的方法和数据。\n\
  \n在绑定服务不是应用程序本地的情况下（也就是说，它在不同的进程中运行），最佳交互方式是使用 `Messenger`。在本章的剩余部分中，将创建一个示例，旨在演示如何与本地绑定服务交互。\n\
  \n## 59.3 本地绑定服务示例\n在本章剩余部分创建的示例应用程序将由单个 Activity 和一个绑定服务组成。绑定服务的目的是从系统获取当前时间，并将该信息返回给显示它的\
  \ Activity。该绑定服务将是本地的对同一应用程序私有的。\n\n从欢迎界面选择“新建项目”（New Project）选项，在新项目对话框中，点击“下一步”（Next）按钮之前选择“Empty\
  \ Activity”模板。在 Name 字段中输入 `LocalBound` 并指定 `com.ebookrenzy.localbound` 为包名。在点击“完成”（Finish）按钮之前，将最低\
  \ API 级别设置为 `API 26: Android 8.0 (Oreo)`，并将语言菜单更改为 `Java`。使用 11.8 将项目迁移到视图绑定中的步骤将项目迁移到视图绑定。\n\
  \n## 59.4 向项目添加绑定服务\n项目创建后，下一步是添加一个作为绑定服务的类类。要在项目中添加新类，在项目窗口中右键点击 `app -> java ->\
  \ com.ebookrenzy.localbound` 下的包名，选择 New -> Service -> Service 菜单选项。指定 `BoundService`\
  \ 为类名，并在点击完成（Finish）创建类之前，确保勾选了 Exported（导出）和 Enabled（启用）选项。Android Studio 将将 `BoundService.java`\
  \ 文件加载到编辑器中，内容如下：\n\n```java\npackage com.ebookrenzy.localbound;\n\nimport android.app.Service;\n\
  import android.content.Intent;\nimport android.os.IBinder;\n\npublic class BoundService\
  \ extends Service {\n    public BoundService() {\n    }\n\n    @Override\n    public\
  \ IBinder onBind(Intent intent) {\n        // TODO: 返回服务的通信通道。\n        throw new\
  \ UnsupportedOperationException(\"尚未实现\");\n    }\n}\n```\n\n\n\n\n\n因此，为了本示例，需要对上一节创建的\
  \ `BoundService` 类模板进行更改。首先，需要声明一个 `Binder` 子类。该类将包含一个名为 `getService()` 的方法，该方法将简单返回当前服务对象实例的引用（由\
  \ `this` 关键字表示）。在这些要求的基础上，编辑 `BoundService.java` 文件并进行如下修改：\n\n```java\npackage\
  \ com.ebookfrenzy.localbound;\n\nimport android.app.Service;\n\nimport android.content.Intent;\n\
  \nimport android.os.IBinder;\n\nimport android.os.Binder;\n\npublic class BoundService\
  \ extends Service {\n    private final IBinder myBinder = new MyLocalBinder();\n\
  \n    public BoundService() {\n\n    }\n\n    @Override\n    public IBinder onBind(Intent\
  \ intent) {\n        // TODO: Return the communication channel to the service.\n\
  \        throw new UnsupportedOperationException(\"Not yet implemented\");\n   \
  \ }\n\n    public class MyLocalBinder extends Binder {\n        BoundService getService()\
  \ {\n            return BoundService.this;\n        }\n    }\n}\n```\n\n对类完成修改后，值得花一点时间回顾一下此处执行的步骤。首先，声明了一个新的\
  \ `Binder` 子类（命名为 `MyLocalBinder`）。该类包含一个单一方法，唯一目的是返回 `BoundService` 类当前实例的引用。创建了\
  \ `MyLocalBinder` 类的新实例并将其赋值给 `myBinder` `IBinder` 引用（由于 `Binder` 是 `IBinder` 的子类，因此此赋值不存在类型匹配）。\n\
  \n接下来，需要修改 `onBind()` 方法以返回 `myBinder` 对象的引用，并实现一个新的公共方法，以便在任何绑定到服务的客户端调用时返回当前时间：\n\
  \n```java\npackage com.ebookfrenzy.localbound;\n\nimport java.text.SimpleDateFormat;\n\
  \nimport java.util.Date;\nimport java.util.Locale;\n\nimport android.app.Service;\n\
  \nimport android.content.Intent;\n\nimport android.os.IBinder;\n\nimport android.os.Binder;\n\
  \npublic class BoundService extends Service {\n    private final IBinder myBinder\
  \ = new MyLocalBinder();\n\n    public BoundService() {\n\n    }\n\n    @Override\n\
  \    public IBinder onBind(Intent intent) {\n        return myBinder;\n    }\n\n\
  \    public String getCurrentTime() {\n        SimpleDateFormat dateformat =\n \
  \               new SimpleDateFormat(\"HH:mm:ss MM/dd/yyyy\",\n                \
  \        Locale.US);\n        return (dateformat.format(new Date()));\n    }\n\n\
  \    public class MyLocalBinder extends Binder {\n        BoundService getService()\
  \ {\n            return BoundService.this;\n        }\n    }\n}\n```\n\n此时，绑定服务已经完成，并准备好被添加到项目清单文件中。在\
  \ Project 工具窗口中找到并双击 `LocalBound` 项目的 `AndroidManifest.xml` 文件，一旦加载到 Manifest 编辑器，验证\
  \ Android Studio 是否已按所示为服务添加了 `<service>` 条目：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.localbound.localbound\" >\n    <application\n  \
  \      android:allowBackup=\"true\"\n        android:icon=\"@mipmap/ic_launcher\"\
  \n        android:label=\"@string/app_name\"\n        android:theme=\"@style/AppTheme\"\
  \ >\n        <service\n            android:name=\".BoundService\"\n            android:enabled=\"\
  true\"\n            android:exported=\"true\" >\n        </service>\n        <activity\n\
  \            android:name=\".MainActivity\" >\n            <intent-filter>\n   \
  \             <action name=\"android.intent.action.MAIN\" />\n                <category\
  \ name=\"android.intent.category.LAUNCHER\" />\n            </intent-filter>\n \
  \       </activity>\n  </application>\n</manifest>\n```\n\n下一阶段是在 Activity 中实现必要的代码以绑定到服务并调用\
  \ `getCurrentTime()` 方法。\n\n## 59.6 将客户端绑定到服务\n\n对于本教程而言，客户端是运行应用程序的 `MainActivity`\
  \ 实例。如前所述，为了成功绑定到服务并接收由服务的 `onBind()` 方法返回的 `IBinder` 对象，需要创建一个 `ServiceConnection`\
  \ 子类并实现 `onServiceConnected()` 和 `onServiceDisconnected()` 回调方法。编辑 `MainActivity.java`\
  \ 文件并进行如下修改：\n\n```java\npackage com.ebookfrenzy.localbound;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  import android.os.Bundle;\nimport android.os.IBinder;\nimport android.content.Context;\n\
  import android.content.Intent;\nimport android.content.ComponentName;\nimport android.content.ServiceConnection;\n\
  import com.ebookfrenzy.localbound.BoundService.MyLocalBinder;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    BoundService myService;\n    boolean isBound\
  \ = false;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \    }\n\n    private ServiceConnection myConnection = new ServiceConnection()\n\
  {\n        @Override\n        public void onServiceConnected(ComponentName className,\
  \ IBinder service) {\n            MyLocalBinder binder = (MyLocalBinder) service;\n\
  \            myService = binder.getService();\n            isBound = true;\n   \
  \     }\n\n        @Override\n        public void onServiceDisconnected(ComponentName\
  \ name) {\n            isBound = false;\n        }\n    };\n```\n\n`onServiceConnected()`\
  \ 方法将在客户端成功绑定到服务时被调用。该方法接收由服务的 `onBind()` 方法返回的 `IBinder` 对象作为参数。该参数被强制转换为 `MyLocalBinder`\
  \ 类型对象，然后调用该对象的 `getService()` 方法以获取服务实例的引用，将其赋值给 `myService`。一个布尔标志用于指示连接已建立。\n\
  \n`onServiceDisconnected()` 方法将在连接结束时被调用，并将布尔标志设置为 false。\n\n建立连接后，下一步是修改 Activity\
  \ 以绑定到服务。这包括创建一个 `intent` 并调用 `bindService()` 方法，可以在 Activity 的 `onCreate()` 方法中执行：\n\
  \n```java\n@Override\npublic void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    setContentView(R.layout.activity_main);\n    Intent intent = new Intent(this,\
  \ BoundService.class);\n    bindService(intent, myConnection, Context.BIND_AUTO_CREATE);\n\
  }\n```\n\n## 59.7 完成示例\n\n最后实现一种调用 `getCurrentTime()` 方法并向用户显示结果的机制。按照惯，Android\
  \ Studio 为 Activity 创建了一个仅包含一个 `TextView` 的模板 `activity_main.xml` 文件。将此文件加载到布局编辑器工具中，并使用设计模式选择\
  \ `TextView` 组件，将其 ID 更改为 `myTextView`。在 `TextView` 下方添加一个 `Button` 视图并将按钮上的文本改为“Show\
  \ Time”，将文本提取到名为 `show_time` 的字符串资源。完成这些更改后，布局应类似于图 59-1 所示](#Local_Bound.xhtml__idTextAnchor1144)。如果缺少任何约束，点击布局编辑器工具栏上的推断约束（Infer\
  \ Constraints）按钮。\n\n![](img/as_4.1_local_bound_ui.jpg)\n\n图 59-1\n\n通过选择按钮并配置 `onClick`\
  \ 属性以调用名为 `showTime` 的方法来完成用户界面设计。\n\n\n\n\n最后，编辑 `MainActivity.java` 文件中的代码来实现\
  \ `showTime()` 方法。该方法简单地调用服务的 `getCurrentTime()` 方法（得益于 `onServiceConnected()` 方法，现在可以通过\
  \ `myService` 引用从活动内部访问它），并将结果字符串赋值给 `TextView`：\n\n```java\npackage com.ebookfrenzy.localbound;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\nimport android.os.Bundle;\n\
  import android.os.IBinder;\nimport android.content.Context;\nimport android.content.Intent;\n\
  import android.content.ComponentName;\nimport android.content.ServiceConnection;\n\
  import android.view.View;\nimport android.widget.TextView;\nimport com.ebookfrenzy.localbound.BoundService.MyLocalBinder;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    BoundService myService;\n\
  \    boolean isBound = false;\n\n    public void showTime(View view)\n    {\n  \
  \      String currentTime = myService.getCurrentTime();\n        TextView myTextView\
  \ = findViewById(R.id.myTextView);\n        myTextView.setText(currentTime);\n \
  \   }\n}\n```\n\n## 59.8 测试应用程序\n代码更改完成后，对应用程序进行测试运行。一旦界面可见，点击按钮并注意文本视图更改为显示当前的日期和时间。该示例已成功启动并绑定到服务，然后调用了该服务的方法来执行任务并将结果返回给活动。\n\
  \n## 59.9 总结\n当绑定的服务是本地的且对某个应用程序私有时，该应用程序内的组件就可以与服务进行交互，而无需使用进程间通信（IPC）。通俗来说，服务的\
  \ `onBind()` 方法返回一个 `IBinder` 对象，该对象包含指向正在运行的服务实例的引用。客户端组件实现 `ServiceConnection`\
  \ 子类，该子类包含回调方法，这些方法会在服务连接和断开连接时被调用。前一个方法接收由 `onBind()` 方法返回的 `IBinder` 对象，从而允许调用服务中的公共方法。\n\
  \n在涵盖了本地绑定服务的实现后，下一章将重点关注使用 IPC 与远程绑定服务进行交互。\n\n## 60. Android 远程绑定服务 – 实例示例\n在关于\
  \ Android 服务的最后一个章节中，将开发一个示例应用程序，以演示使用 `messenger` 和 `handler` 配置来促进客户端与远程绑定服务之间的交互。\n\
  \n## 60.1 客户端到远程服务的通信\n如上一章所述，客户端与本地服务之间的交互可以通过向客户端返回一个包含服务对象引用的 `IBinder` 对象来实现。然而，对于远程服务，这种方法是不可行的，因为远程服务运行在不同的进程中，因此无法从客户端直接访问。\n\
  \n在远程服务的情况下，必须创建一个 `Messenger` 和 `Handler` 配置，允许消息跨越客户端和服务器之间的进程边界进行传递。\n\n具体而言，服务会创建一个\
  \ `Handler` 实例，当接收到来自客户端的消息时将会调用该实例。在初始化方面，`Handler` 的任务是创建一个 `Messenger` 对象，该对象反过来创建一个\
  \ `IBinder` 对象并在 `onBind()` 方法中返回给客户端。客户端使用此 `IBinder` 对象来创建 `Messenger` 对象的实例，随后将消息发送给服务处理器。每当客户端发送一次消息时，处理器的\
  \ `handleMessage()` 方法就会被调用，并传递消息对象。\n\n本章创建的示例将包含一个运行在单独进程中的活动和一个绑定服务。将使用 `Messenger/Handler`\
  \ 机制向服务发送字符串，服务随后将在 `Toast` 消息中显示该字符串。\n\n## 60.2 创建示例应用程序\n从欢迎界面选择 `New Project`\
  \ 选项，在出现的新项目对话框中，点击 `Next` 按钮之前选择 `Empty Activity` 模板。\n\n在 `Name` 字段中输入 `RemoteBound`，并指定\
  \ `com.ebookfrenzy.remotebound` 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为\
  \ `API 26: Android 8.0 (Oreo)`，并将语言菜单更改为 `Java`。\n\n## 60.3 设计用户界面\n在 Project 工具窗口中找到\
  \ `activity_main.xml` 文件并双击它将其加载到 Layout Editor 工具中。在 Design 模式下的 Layout Editor\
  \ 工具中，右键点击默认的 `TextView` 实例，选择 `Convert view...` 菜单选项，并从生成的对话框中选择 `Button` 视图并点击\
  \ `Apply`。将按钮的 `text` 属性更改为“Send Message”，并将字符串提取到命名名为 `send_message` 的新资源。\n\n\
  最后，配置 `onClick` 属性以调用名为 `sendMessage` 的方法。\n\n## 60.4 实现远程绑定服务\n为了为此示例实现远程绑定服务，在\
  \ Project 工具窗口中右键点击包名（位于 `app -> java` 下）并选择 `New -> Service -> Service` 菜单选项。指定\
  \ `RemoteService` 为类名，并在点击 `Finish` 创建类之前，确保勾选了 `Exported` 和 `Enabled` 选项。\n\n下一步是为新服务实现处理器类（handler）。这是通过扩展\
  \ `Handler` 类并实现 `handleMessage()` 方法来实现。当接收到来自客户端的消息时，将调用此方法。它将接收一个 `Message` 对象作为参数，其中包含客户端所需的数据。实现后，修改后的\
  \ `RemoteService.java` 文件如下：\n\n```java\npackage com.ebookfrenzy.remotebound;\n\n\
  import android.app.Service;\nimport android.content.Intent;\nimport android.os.IBinder;\n\
  import android.os.Bundle;\nimport android.os.Handler;\nimport android.os.Message;\n\
  import android.widget.Toast;\nimport android.os.Messenger;\n\npublic class RemoteService\
  \ extends Service {\n    public RemoteService() {\n    }\n\n    class IncomingHandler\
  \ extends Handler {\n        @Override\n        public void handleMessage(Message\
  \ msg) {\n            Bundle data = msg.getData();\n            String dataString\
  \ = data.getString(\"MyString\");\n            Toast.makeText(getApplicationContext(),\
  \ dataString, Toast.LENGTH_SHORT).show();\n        }\n    }\n\n    @Override\n \
  \   public IBinder onBind(Intent intent) {\n        // TODO: 返回服务的通信通道\n       \
  \ throw new UnsupportedOperationException(\"Not yet implemented\");\n    }\n}\n\
  ```\n\n实现处理器后，服务代码方面剩下的任务是修改 `onBind()` 方法，使其返回一个包含 `Messenger` 对象的 `IBinder` 对象，该对象反过来包含一个指向处理器的引用：\n\
  \n```java\nfinal Messenger myMessenger = new Messenger(new IncomingHandler());\n\
  \n@Override\npublic IBinder onBind(Intent intent) {\n    return myMessenger.getBinder();\n\
  }\n```\n\n## 60.5 在 Manifest 文件中配置远程服务\n\n\n\n\n\n为了准确描绘客户端与远程服务之间的通信，有必要将服务配置为运行在应用程序其他部分独立的进程中。这通过在清单文件中为服务的\
  \ `<service>` 标签添加 `android:process` 属性来实现。此外，为了启动远程服务，还需要为该服务提供一个意图过滤器（intent filter）。要实现此更改，请修改\
  \ `AndroidManifest.xml` 文件以添加所需的条目：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.remotebound\" >\n    <application\n        android:allowBackup=\"\
  true\"\n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\
  \n        android:supportsRtl=\"true\"\n        android:theme=\"@style/AppTheme\"\
  \ >\n        <service\n            android:name=\".RemoteService\"\n           \
  \ android:enabled=\"true\"\n            android:exported=\"true\"\n            android:process=\"\
  :my_process\" >\n        </service>\n        <activity\n            android:name=\"\
  .MainActivity\" >\n            <intent-filter>\n                <action android:name=\"\
  android.intent.action.MAIN\" />\n                <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n\
  ```\n\n## 60.6 启动并绑定到远程服务\n\n与本地绑定服务一样，客户端组件需要实现 `ServiceConnection` 类的实例，并包含 `onServiceConnected()`\
  \ 和 `onServiceDisconnected()` 方法。同样，与本地服务相同，`onServiceConnected()` 方法将接收由远程服务的 `onBind()`\
  \ 方法返回的 `IBinder` 对象，并将用于向服务器处理器发送消息。在本例中，客户端是 `MainActivity`，其代码位于 `MainActivity.java`。加载此文件并进行修改，添加\
  \ `ServiceConnection` 类以及一个存储接收到的 `Messenger` 对象引用的变量，以及用于指示连接是否建立的 `Boolean` 标志位：\n\
  \n```java\npackage com.ebookfrenzy.remotebound;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  import android.os.Bundle;\nimport android.os.IBinder;\nimport android.os.Message;\n\
  import android.os.Messenger;\nimport android.os.RemoteException;\nimport android.content.ComponentName;\n\
  import android.content.Context;\nimport android.content.Intent;\nimport android.content.ServiceConnection;\n\
  import android.view.View;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    Messenger myService = null;\n    boolean isBound;\n\n    @Override\n  \
  \  protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.activity_main);\n    }\n\n    final private ServiceConnection\
  \ myConnection =\n            new ServiceConnection() {\n                public\
  \ void onServiceConnected(\n                            ComponentName className,\n\
  \                            IBinder service) {\n                    myService =\
  \ new Messenger(service);\n                    isBound = true;\n               \
  \ }\n                public void onServiceDisconnected(\n                      \
  \  ComponentName className) {\n                    myService = null;\n         \
  \           isBound = false;\n                }\n            };\n}\n```\n\n接下来，需要添加一些代码来绑定到远程服务。这涉及创建一个与清单文件中声明的服务意图过滤器匹配的\
  \ `intent`，然后调用 `bindService()` 方法，并将 `intent` 和 `ServiceConnection` 实例的引用作为参数。为了本示例，此代码将在\
  \ Activity 的 `onCreate()` 方法中实现：\n\n```java\n@Override\nprotected onCreate(Bundle\
  \ savedInstanceState) {\n    super.onCreate(savedInstanceState);\n    setContentView(R.layout.activity_remote_bound);\n\
  \    Intent intent = new Intent(getApplicationContext(),\n            RemoteService.class);\n\
  \    bindService(intent, myConnection, Context.BIND_AUTO_CREATE);\n}\n```\n\n##\
  \ 60.7 向远程服务发送消息\n\n在测试应用程序之前，最后剩下的工作是在 `MainActivity` 类中实现 `sendMessage()` 方法，该方法被配置为当用户触摸界面上的按钮时被调用。此方法需要检查服务是否已连接，创建一个包含服务器要显示的字符串的\
  \ `bundle` 对象，将其添加到 `Message` 对象中并发送到服务器：\n\n```java\npublic void sendMessage(View\
  \ view) {\n    if (!isBound) return;\n    Message msg = Message.obtain();\n    Bundle\
  \ bundle = new Bundle();\n    bundle.putString(\"MyString\", \"Message Received\"\
  );\n    msg.setData(bundle);\n    try {\n        myService.send(msg);\n    } catch\
  \ (RemoteException e) {\n        e.printStackTrace();\n    }\n}\n```\n\n代码更改完成后，编译并运行应用程序。加载后，触摸用户界面上的按钮，此时应该出现一条显示为“Message\
  \ Received”的 `Toast`get。\n\n## 60.8 总结\n\n为了实现客户端与远程绑定服务之间的交互，有必要实现处理器/消息（handler/message）通信框架。该技术背后的基本概念在本章已涵盖，并包含了一个示例应用程序的实现，该程序用于演示客户端与绑定服务之间的通信，它们分别运行在独立的进程中。\n\
  \n# 61 Android 通知教程\n\n通知提供了一种让应用程序在未运行或当前处于后台时向用户传递消息的方法。例如，消息应用可能会发布通知，让用户知道收到来自联系人的新消息。通知可以分为本地通知和远程通知。本地通知是由运行设备上的应用程序本身触发的。相反，远程通知是由远程服务器启动并递送到设备上进行展示的。\n\
  \n通知出现在从屏幕状态栏下拉的通知栏中，每个通知都可以包含操作，例如打开发送通知的应用程序的按钮。Android 还支持直接回复（Direct Reply）通知，该功能允许用户在通知面板内输入并提交对通知的响应。\n\
  \n本章的目标是概述并演示 Android 应用程序本地通知的实现。下一章 Android 直接回复通知教程将涵盖直接回复通知的实现。\n\n## 61.1 通知概述\n\
  \n当通知在 Android 设备上启动时，它会以图标的形式出现在状态栏中。例如图 61-1 显示了带有多个通知图标的状态栏：\n\n要查看通知，用户从状态栏开始向下滑动，以拉下通知栏，如图\
  \ 61-2 所示。\n\n在运行 Android 8 或更高版本的设备上，长按应用程序启动图标将显示与应用关联的所有待处理通知，如图 61-3 所示。\n\n\
  \n\n\n\n典型的通知将简单显示一条消息，并在点击时启动负责发布该通知的应用程序。通知还可以包含操作按钮，点击这些按钮会执行对应应用程序的特定任务。例如，图\
  \ 61-4 显示了一个包含两个操作按钮的通知，允许用户删除或保存收到的消息。\n\n![](img/Image2450.jpg)\n图 61-4\n\n用户还可以在通知中输入内联文本回复并将其发送给应用程序，如下方的图\
  \ 61-5 所示。这允许用户在无需将相应的应用程序调前台的情况下对通知做出响应。\n\n![](img/Image2458.jpg)\n图 61-5\n\n\
  本章的剩余部分将介绍创建和发布包含操作的简单通知的步骤。直接回复支持的主题将在下一章题为“Android 直接回复通知教程”的章节中介绍。\n\n## 61.2\
  \ 创建 NotifyDemo 项目\n\n从欢迎界面选择“New Project”（新项目）选项，在生成的新项目对话框中，点击“Next”（下一步）按钮之前选择“Empty\
  \ Activity”（空活动）模板。\n\n在`Name`字段中输入`NotifyDemo`并指定`com.ebookfrenzy.notifydemo`为包名。在点击“Finish”（完成）按钮之前，将`Minimum\
  \ API level`最小 API 级别）设置为`API 26`：Android 8.0 (Oreo)，并将`Language`语言）菜单设置为`Java`。\n\
  \n## 61.3 设计用户界面\n\n主活动将包含一个按钮，其目的是创建并发布一个意图（intent）。在布局编辑器（Layout Editor）工具中找到并加载`activity_main.xml`文件，删除默认的`TextView`组件。\n\
  \n在启用 Autoconnect（自动连接）的情况下，从面板将`Button`对象拖动到布局画布的中心，如图图 61-6 所示。\n\n在布局中选中`Button`组件，使用\
  \ Attributes（属性）面板配置`onClick`属性，以调用名为`sendNotification` 的方法。\n\n![](img/as_4.1_notify_demo_ui.jpg)\n\
  图 61-6\n\n选中`Button`组件，在 Attributes 工具窗口中将`text`属性更改为“Notify”，并将属性值提取到字符串资源。\n\n\
  ## 61.4 创建第二个 Activity\n\n为了本示例的目的，应用程序将包含第二个活动，该活动将由用户从通知内部启动。通过右键点击`app -> java`\
  \ 下的`com.ebookfrenzy.notifydemo`包名，选择`New -> Activity -> Empty Activity`菜单选项显示新\
  \ Android 活动对话框，从而向项目添加此新活动。\n\n在`Activity Name`字段中输入`ResultActivity`并将布局文件命名为`activity_result`。由于此活动在应用程序启动时不会启动（它将通过通知内部的意图启动），因此在点击“Finish”按钮之前，确保已禁用了`Launcher\
  \ Activity`（启动活动）选项。使用节 11.8 将项目迁移到 View Binding 中的步骤向`build.gradle`和`ResultActivity.java`文件添加视图绑定支持（请注意绑定名称将是`ActivityResultBinding`而不是`ActivityMainBinding`）。\n\
  \n打开第二个活动的布局（`app -> res -> layout -> activity_result.xml`）并拖放一个`TextView`组件，使其位于布局中心。编辑`TextView`的文本使其显示为“Result\
  \ Activity”，并将属性值提取到字符串资源。\n\n## 61.5 创建通知通道\n\n在应用程序发送通知之前，它必须先创建一个通知通道。通知通道由一个唯一标识应用程序内通道的`ID`、一个通道名称和一个通道描述组成（只有后两个对用户可见）。通道通过配置一个`NotificationChannel`实例并，然后将该对象传递给`NotificationManager`类的`createNotificationChannel()`方法来创建。对于此示例，应用程序将包含一个名为“NotifyDemo\
  \ News”的单一通知通道。编辑`MainActivity.java`文件并实现当应用程序启动时创建通道的代码：\n\n```java\nimport android.app.NotificationManager;\n\
  import android.app.NotificationChannel;\nimport android.content.Context;\nimport\
  \ android.graphics.Color;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    NotificationManager notificationManager;\n\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.activity_main);\n        notificationManager =\
  \ (NotificationManager)\n            getSystemService(Context.NOTIFICATION_SERVICE);\n\
  \        createNotificationChannel(\n            \"com.ebookfrenzy.notifydemo.news\"\
  ,\n            \"NotifyDemo News\",\n            \"Example Channel\");\n    }\n\n\
  \    protected void createNotificationChannel(String id, String name, String description)\
  \ {\n        int importance = NotificationManager.IMPORTANCE_LOW;\n        NotificationChannel\
  \ channel = new NotificationChannel(id, name);\n        channel.setDescription(description);\n\
  \        channel.enableLights(true);\n        channel.setLight(Color.RED);\n   \
  \     channel.enableVibration(true);\n        channel.setVibration(new long[]{100,\
  \ 200, 300, 400});\n        notificationManager.createNotificationChannel(channel);\n\
  \    }\n}\n```\n\n代码声明并初始化了`NotificationManager`实例，然后带有低重要性（其他选项为高、最大、无）的名称和描述创建新通道。还向通道添加了一些可选设置，以自定义用户接收通知的方式。最后，通过将通道对象传递给管理器的`createNotificationChannel()`方法创建通道。\n\
  \n代码完成后，在运行 Android 10 或更高版本的设备或模拟器上编译并运行应用程序。启动后，将其放入后台并打开设置应用程序。在设置中，选择“应用和通知”选项，然后是应用信息。在应用信息屏幕找到并选择\
  \ NotifyDemo 项目，在后续屏幕上点击“通知”。通知屏幕应显示 NotifyDemo News 类别处于激活状态：\n\nimage/as_3.5_notifications_enabled.jpg)\n\
  图 61-7\n\n在继续之前，检查高级设置以确保为应用程序启用通知点和气泡。\n\n虽然本示例不需要，但值得注意的是，可以通过调用通知管理器的`deleteNotificationChannel()`方法删除通道，传递要删除通道的\
  \ ID：\n\n```java\nString channelID = \"com.ebookfrenzy.notifydemo.news\";\nnotificationManager.deleteNotificationChannel(channelID);\n\
  ```\n\n## 61.6 创建并发布通知\n\n通知使用`Notification.Builder`类创建，并且包含图标、标题和内容。打开`MainActivity.java`文件并按如下所示实现`sendNotification()`方法以构建基础通知：\n\
  \n```java\nimport android.app.Notification;\nimport android.view.View;\n\npublic\
  \ void sendNotification(View view) {\n    String channelID = \"com.ebookfrenzy.notifydemo.news\"\
  ;\n    Notification notification = new Notification.Builder(MainActivity.this, channelID)\n\
  \        .setContentTitle(\"Example Notification\");\n}\n```\n\n\n\n\n\n```java\n\
  \            .setContentText(\"This is an example notification.\")\n           \
  \ .setSmallIcon(android.R.drawable.ic_dialog_info)\n            .setChannelId(channelID)\n\
  \            .build();\n}\n```\n\n一旦构建了通知，就需要使用 `NotificationManager` 实例的 `notify()`\
  \ 方法将其发布。访问 `NotificationManager` 并发布通知的代码需要添加到 `sendNotification()` 方法中，如下：\n\n\
  ```java\nprotected void sendNotification(View view) {\n    int notificationID =\
  \ 101;\n    String channelID = \"com.ebookfrenzy.notifydemo.news\";\n    Notification\
  \ notification =\n            new Notification.Builder(MainActivity.this,\n    \
  \                                 channelID)\n                .setContentTitle(\"\
  New Message\")\n                .setContentText(\"You've received new messages.\"\
  )\n                .setSmallIcon(android.R.drawable.ic_dialog_info)\n          \
  \      .setChannelId(channelID)\n                .build();\n    notificationManager.notify(notificationID,\
  \ notification);\n}\n```\n\n注意，当发布通知时，它会被分配一个通知 ID。这可以是任何整数，并可在稍后更新通知时使用。\n\n编译并运行应用，点击主活动上的按钮。当通知图标出现在状态栏中时，从状态栏向下拖动以查看完整通知：\n\
  \n![](img/Image2481.jpg)\n\n图 61-8\n\n点击并向右滑动通知，然后选择设置齿轮图标以查看关于通知的更多信息：\n\n![](img/as_3.5_notification_settings.jpg)\n\
  \n图 61-9\n\n接下来，将应用置于后台，导航到显示所有应用启动器图标的主屏幕，并注意到 NotifyDemo 启动器图标上出现了通知点，如 图 61-10\
  \ 所示：\n\n![](img/Image24991.jpg)\n\n图 61-10\n\n如果没有出现圆点，请检查“设置”应用中 NotifyDemo 的通知选项，以确认是否已如本章前面所述启用了“通知点”。如果圆点仍未出现，请长按设备主屏幕的空白区域，从弹出菜单中选择“主屏幕设置”选项并启用“通知点”选项。\n\
  \n长按启动器图标将显示一个包含通知的弹出窗口：\n\n![](img/as_3.5_notifydemo_long_press_popup.jpg)\n\n\
  图 61-11\n\n如果一个应用有多个待处理通知，长按菜单弹出窗口将包含通知数量计数（如上图高亮所示）。该数字可以在应用内部通过在构建通知时调用 `setNumber()`\
  \ 方法来完成完成配置：\n\n```java\nNotification notification = new Notification.Builder(MainActivity.this,\
  \ CHANNEL_ID)\n        .setContentTitle(\"Example Notification\")\n        .setContentText(\"\
  This is an example notification.\")\n        .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \        .setChannelId(CHANNEL_ID)\n        .setNumber(10)\n        .build();\n\
  ```\n\n按照目前的实现，无论在何处访问，点击通知都没有效果。下一步是配置通知以便在点击时启动一个活动。\n\n## 61.7 从通知启动 Activity\n\
  \n理想情况下，通知应该允许用户执行某些形式的操作，例如启动相应的应用，或响应通知采取其他形式的操作。一个常见的需求是在用户点击通知时，简单启动属于该应用的活动。\n\
  \n这种方法需要启动一个活动并配置一个 `Intent` 来启动该活动。假设应用包含一个名为 `ResultActivity` 的活动，该意的创建方式如下：\n\
  \n```java\nIntent resultIntent = new Intent(this, ResultActivity.class);\n```\n\n\
  然后需要将该意封装在 `PendingIntent` 实例中。`PendingIntent` 对象的设计允许将意传递给其他应用程序，授予这些应用程序在未来某个时刻执行该意的权限。在这种情况下，`PendingIntent`\
  \ 对象用于为通知系统提供一种方法，在用户点击通知时启动 `ResultActivity` 活动：\n\n```java\nPendingIntent pendingIntent\
  \ =\n    PendingIntent.getActivity(\n        this,\n        0,\n        resultIntent,\n\
  \        PendingIntent.FLAG_UPDATE_CURRENT);\n```剩下的只需在构建通知期间使用 `setContentIntent()`\
  \ 方法分配 `PendingIntent` 对象。将这些整合在一起得到一个修改后的 `sendNotification()` 方法，内容如下：\n\n```java\n\
  import android.app.PendingIntent;\nimport android.content.Intent;\nimport android.graphics.drawable.Icon;\n\
  \nprotected void sendNotification(View view) {\n    int notificationId = 101;\n\
  \    Intent resultIntent = new Intent(this, ResultActivity.class);\n    PendingIntent\
  \ pendingIntent =\n        PendingIntent.getActivity(\n            this,\n     \
  \       0,\n            resultIntent,\n            PendingIntent.FLAG_UPDATE_CURRENT);\n\
  \    String CHANNEL_ID = \"com.ebookfrenzy.notifydemo.news\";\n    Notification\
  \ notification = new Notification.Builder(MainActivity.this,\n                 \
  \                                           CHANNEL_ID)\n                .setContentTitle(\"\
  Example Notification\")\n                .setContentText(\"This is an example notification.\"\
  )\n                .setSmallIcon(android.R.drawable.ic_dialog_info)\n          \
  \      .setChannelId(channelID)\n                .setContentIntent(pendingIntent)\n\
  \                .build();\n    notificationManager.notify(notificationId, notification);\n\
  }\n```\n\n再次编译并运行应用，点击按钮并显示通知栏。然而这一次点击通知将导致 `ResultActivity` 启动。\n\n## 61.8 为通知添加操作（Actions）\n\
  \n为通知添加交互性的另一种方法是创建操作。它们显示为通知下方的按钮，并在程序化为用户点击时触发特定的意。如果将以下代码添加到 `sendNotification()`\
  \ 方法中，将添加一个标记为“打开”的操作按钮，选择时会启动引用的等待意：\n\n```java\nfinal Icon icon = Icon.createWithResource(MainActivity.this,\n\
  \                                          android.R.drawable.ic_dialog_info);\n\
  Notification.Action action =\n    new Notification.Action.Builder(icon, \"Open\"\
  , pendingIntent)\n        .build();\nNotification notification = new Notification.Builder(MainActivity.this,\
  \ CHANNEL_ID)\n        .setContentTitle(\"Example Notification\")\n        .setContentText(\"\
  This is an example notification.\")\n        .setSmallIcon(R.drawable.ic_info_24dp)\n\
  \        .setChannelId(channelID)\n        .setContentIntent(pendingIntent)\n  \
  \      .setActions(action)\n        .build();\n\nnotificationManager.notify(notificationId,\
  \ notification);\n```\n\n将上述代码添加到方法并运行应用。发布通知并注意通知中的操作（取决于 Android 版本，可能需要下拉通知面板以显示打开操作）：\n\
  \n![](img/as_3.5_notification_with_action.jpg)\n\n图 61-12\n\n点击操作将触发等待意并启动 `ResultActivity`。\n\
  \n## 61.9 组合通知（Bundled Notifications）\n\n如果一个应用倾向于定期发布通知，这些通知可能会迅速占满状态栏和通知栏，为用户提供欠佳的体验。这对于新闻或消息应用尤为如此，它们会在每有突发新闻或收到联系人的新消息时发送通知。例如，考虑图\
  \ 61-13 中的通知：\n\n![](img/as_3.2_unbundled_notifications.jpg)\n\n图 61-13\n\n\n\n\n\
  \n现在想象一下如果收到了十条甚至二十条新消息。为了避免这类问题，Android 允许将通知打包成组。\n\n要打包通知，每条通知都必须通过 `setGroup()`\
  \ 方法指定为属于同一个组，并且必须发布另一条通知，并将其配置为摘要通知（summary notification）。例如，下面的代码创建并发布了上方 图 61-13\
  \ 所示的三个通知，但将它们打包到了同一个组中。该代码还发布了一个通知作为摘要：\n\n```java\nfinal String GROUP_KEY_NOTIFY\
  \ = \"group_key_notify\";\n\nNotification.Builder builderSummary =\n    new Notification.Builder(this,\
  \ channelID)\n        .setSmallIcon(android.R.drawable.ic_dialog_info)\n       \
  \ .setContentTitle(\"A Bundle Example\")\n        .setContentText(\"You have 3 new\
  \ messages\")\n        .setGroup(GROUP_KEY_NOTIFY)\n        .setGroupSummary(true);\n\
  \nNotification.Builder builder1 =\n    new Notification.Builder(this, channelID)\n\
  \        .setSmallIcon(android.R.drawable.ic_dialog_info)\n        .setContentTitle(\"\
  New Message\")\n        .setContentText(\"You have a new message from Kassidy\"\
  )\n        .setGroup(GROUP_KEY_NOTIFY);\n\nNotification.Builder builder2 =\n   \
  \ new Notification.Builder(this, channelID)\n        .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \        .setContentTitle(\"New Message\")\n        .setContentText(\"You have a\
  \ new message from Caitlyn\")\n        .setGroup(GROUP_KEY_NOTIFY);\n\nNotification.Builder\
  \ builder3 =\n    new Notification.Builder(this, channelID)\n        .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \        .setContentTitle(\"New Message\")\n        .setContentText(\"You have a\
  \ new message from Jason\")\n        .setGroup(GROUP_KEY_NOTIFY);\n\nint notificationId0\
  \ = 100;\nint notificationId1 = 101;\nint notificationId2 = 102;\nint notificationId3\
  \ = 103;\n\nnotificationManager.notify(notificationId1, builder1.build());\nnotificationManager.notify(notificationId2,\
  \ builder2.build());\nnotificationManager.notify(notificationId3, builder3.build());\n\
  notificationManager.notify(notificationId0, builderSummary.build());\n```\n\n当代码执行时，尽管应用实际上发布了四条通知，状态栏中只会显示一个通知图标。在通知栏中，会显示一个摘要通知，列出每个已打包通知中的信息：\n\
  \n![](img/Image2528.jpg)\n图 61-14\n\n在通知条目上进一步向下滑动可以展开面板，显示每个已打包通知的详情：\n\n![](img/Image2536.jpg)\n\
  图 61-15\n\n### 6.10 总结\n通知为应用程序提供了一种在未运行或当前处于后台时向用户递送消息的方法。通知出现在状态栏和通知栏中。本地通知由运行的应用程序在设备上触发，而远程通知由远程服务器启动并递送到设备。本地通知使用\
  \ `NotificationCompat.Builder` 创建并使用 `NotificationManager` 发布。如本章所示，可以通过使用操作（actions）、意图（intents）和\
  \ `PendingIntent` 类来配置通知，为用户提供选项（如启动活动或保存消息）。通知打包提供了一种分组机制，为发布较多通知的应用程序提供了改进的体验。\n\
  \n### 2. Android 直接回复通知\n直接回复（Direct reply）是 Android 7 中引入的一项功能，允许用户在通知中输入文本并将其发送到与该通知关联的应用程序。这允许用户无需启动应用内的活动即可回复消息。本章将基于上一章学到的知识，创建一个使用此项功能的示例应用程序。\n\
  \n#### 2.1 创建 DirectReply 项目\n从欢迎界面中选择 `New Project`（新项目）选项，在随出的项目对话框中，在点击 `Next`\
  \ 之前选择 `Empty Activity` 模板。在 `Name` 字段中输入 `DirectReply`，并指定 `com.ebookfrenzy.directreply`\
  \ 为包名。在点击 `Finish` 之前，将最低 API 级别改为 `API 26 (Oreo)`，并将语言更改为 Java。按照 1.8 Migrating\
  \ a Project to View Binding 中列出的步骤修改项目以支持视图绑定（view binding）。\n\n#### 2.2 设计用户界面\n\
  将 `activity_main.xml` 文件加载到布局工具中。启用 `Autnect` 后，在现有的 \"Hello World!\" 标签下方添加一个 `Button`\
  \ 对象，如 图 2-1 所示。在布局中选中 `Button` 时，使用属性（Attributes）窗口将 `onClick` 属性设置为调用名为 `sendNotification`\
  \ 的方法。如有必要，使用 `Constraints` 按钮为布局添加任何约束。在继续之前，选择 \"Hello World!\" `TextView` 并将\
  \ `id` 属性更改为 `textView`，并将按钮上的文本改为 \"Notify\"。\n\n![](img/as_4.1_direct_reply_ui.jpg)\n\
  图 6-1\n\n#### 2.3 创建通知通道\n与上一章的示例一样，在发送通知之前必须创建一个通道。编辑 `MainActivity.java` 文件并添加以下代码创建一个新通道：\n\
  \n```java\nimport android.app.NotificationChannel;\nimport android.app.NotificationManager;\n\
  import android.content.Context;\nimport android.graphics.Color;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n    private ActivityMainBinding binding;\n\
  \    private NotificationManager notificationManager;\n    private final String\
  \ channelID = \"com.ebookfrenzy.directreply\";\n\n    @Override\n    protected void\
  \ onCreate(Bundle savedInstanceState) {\n        notificationManager = (NotificationManager)\
  \ getSystemService(Context.NOTIFICATION_SERVICE);\n        createNotificationChannel(channelID,\
  \ \"DirectReply News\", \"Example News Channel\");\n    }\n\n    protected void\
  \ createNotificationChannel(String id, String name, String description) {\n    \
  \    int importance = NotificationManager.IMPORTANCE_HIGH;\n        NotificationChannel\
  \ channel = new NotificationChannel(id, name, importance);\n        channel.setDescription(description);\n\
  \        channel.enableLights(true);\n        channel.setLightColor(Color.RED);\n\
  \        channel.enableVibration(true);\n        channel.setVibrationPattern(new\
  \ long[]{100, 200, 300, 400, 500, 400, 300, 200, 400});\n        notificationManager.createNotificationChannel(channel);\n\
  \    }\n}\n```\n\n#### 2.4 构建 RemoteInput 对象\n在通知中实现直接回复内联文本的关键元素是 `RemoteInput`\
  \ 类。之前的章节介绍了 `PendingIntent` 类，并解释了它如何允许一个应用程序创建一个意图，然后授予其他应用程序或服务从原始应用程序之外启动该意图的能力。在标题为“Android\
  \ 通知教程”（#Notifications.xhtml__idTextAnchor1156）的章节中，创建了一个等待许可，允许从通知内部启动原始应用程序中的活动。`RemoteInput`\
  \ 类允许将用户输入请求与意图一起包含在 `PendingIntent` 对象中。当 `PendingIntent` 对象中的意图触发时（例如启动活动），该活动也会收到用户提供的任何输入。\n\
  \n\n\n\n在通知中实现直接回复的第一步是创建 `RemoteInput` 对象。这通过使用 `RemoteInput.Builder()` 方法实现。构建\
  \ `RemoteInput` 对象需要一个键字符串（key string），它将用于从生成的 intent 中提取输入内容。该对象还需要一个标签字符串（label\
  \ string），它将显示在通知的文本输入字段中。编辑 `MainActivity.java` 文件并开始实现 `sendNotification()` 方法。请注意还添加了一些导入指令和变量，它们将在本章节的后续内容中使用：\n\
  \n```java\npackage com.ebookfrenzy.directreply;\n\nimport android.view.View;\nimport\
  \ android.app.PendingIntent;\nimport android.app.RemoteInput;\nimport android.content.Intent;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private ActivityMainBinding\
  \ binding;\n    private static final int notificationId = 101;\n    private static\
  \ final String KEY_TEXT_REPLY = \"key_text_reply\";\n    private NotificationManager\
  \ notificationManager;\n    private static final String channelID = \"com.ebookfrenzy.directreply.news\"\
  ;\n\n    public void sendNotification(View view) {\n        String replyLabel =\
  \ \"Enter your reply here\";\n        RemoteInput remoteInput =\n              \
  \  new RemoteInput.Builder(KEY_TEXT_REPLY)\n                    .setLabel(replyLabel)\n\
  \                    .build();\n    }\n}\n```\n\n现在 `RemoteInput` 对象已经创建并使用键和标签字符串完成了初始化，它需要被放置在通知动作对象中。在执行该步骤之前，需要先创建\
  \ `PendingIntent` 实例。\n\n### 62.5 创建 PendingIntent\n\n创建 `PendingIntent` 的步骤与 \"\
  Android 通知教程”章节中概述的步骤相同，但 intent 将配置为启动 `MainActivity`。留在 `MainActivity.java` 文件中，添加以下代码来创建\
  \ `PendingIntent`：\n\n```java\npublic void sendNotification(View view) {\n    String\
  \ replyLabel = \"Enter your reply here\";\n    RemoteInput remoteInput =\n     \
  \       new RemoteInput.Builder(KEY_TEXT_REPLY)\n                .setLabel(replyLabel)\n\
  \                .build();\n    Intent resultIntent = new Intent(this, MainActivity.class);\n\
  \    PendingIntent resultPendingIntent =\n            PendingIntent.getActivity(\n\
  \                this,\n                0,\n                resultIntent,\n    \
  \            PendingIntent.FLAG_UPDATE_CURRENT\n            );\n}\n```\n\n### 62.6\
  \ 创建回复动作\n\n内联回复将可以通过通知中的动作按钮进行访问。现在需要创建此动作，并使用图标、显示在按钮上的标签、`PendingIntent` 对象和\
  \ `RemoteInput` 对象进行配置。修改 `sendNotification()` 方法以添加创建此动作的代码：\n\n```java\nimport\
  \ android.graphics.drawable.Icon;\nimport android.app.Notification;\nimport android.graphics.Color;\n\
  import androidx.core.content.ContextCompat;\n\npublic void sendNotification(View\
  \ view) {\n    String replyLabel = \"Enter your reply here\";\n    RemoteInput remoteInput\
  \ =\n            new RemoteInput.Builder(KEY_TEXT_REPLY)\n                .setLabel(replyLabel)\n\
  \                .build();\n    Intent resultIntent = new Intent(this, MainActivity.class);\n\
  \    PendingIntent resultPendingIntent =\n            PendingIntent.getActivity(\n\
  \                this,\n                0,\n                resultIntent,\n    \
  \            PendingIntent.FLAG_UPDATE_CURRENT\n            );\n    final Icon icon\
  \ =\n            Icon.createWithResource(MainActivity.this,\n            android.R.drawable.ic_dialog_info);\n\
  \    Notification.Action replyAction =\n            new Notification.Action.Builder(\n\
  \                icon,\n                \"Reply\", resultPendingIntent)\n      \
  \          .addRemoteInput(remoteInput)\n                .build();\n}\n```\n\n在教程的这一阶段，我们已经构建了并准备好使用的\
  \ `RemoteInput`、`PendingIntent` 和 `Notification` 对象。下一阶段是构建并发布通知：\n\n```java\npublic\
  \ void sendNotification(View view) {\n    String replyLabel = \"Enter your reply\
  \ here\";\n    RemoteInput remoteInput =\n        new RemoteInput.Builder(KEY_TEXT_REPLY)\n\
  \            .setLabel(replyLabel)\n            .build();\n    Intent resultIntent\
  \ = new Intent(this, MainActivity.class);\n    PendingIntent resultPendingIntent\
  \ =\n            PendingIntent.getActivity(\n                this,\n           \
  \     0,\n                resultIntent,\n                PendingIntent.FLAG_UPDATE_CURRENT\n\
  \            );\n    final Icon icon =\n        Icon.createWithResource(MainActivity.this,\n\
  \        android.R.drawable.ic_dialog_info);\n    Notification.Action replyAction\
  \ =\n        new Notification.Action.Builder(\n            icon,\n            \"\
  Reply\", resultPendingIntent)\n            .addRemoteInput(remoteInput)\n      \
  \      .build();\n    Notification newMessageNotification =\n        new Notification.Builder(this,\
  \ channelID)\n            .setColor(ContextCompat.getColor(this,\n            R.color.default_color_primary))\n\
  \            .setSmallIcon(android.R.drawable.ic_dialog_info)\n            .setContentTitle(\"\
  My Notification\")\n            .setContentText(\"This is a test\")\n          \
  \  .addAction(replyAction).build();\n    NotificationManager notificationManager\
  \ =\n        (NotificationManager)getSystemService(Context.NOTIFICATION_SERVICE);\n\
  \    notificationManager.notify(notificationId, newMessageNotification);\n}\n```\n\
  \n完成更改后，编译并运行应用，测试点击按钮是否可以成功发布通知。查看通知栏，通知应如图 62-2 所示。\n\n点击回复按钮，随后会出现输入框，并显示创建 `RemoteInput`\
  \ 对象时嵌入的回复标签。\n\n输入一些文本并点击输入字段末尾的发送箭头。\n\n### 62.7 接收直接回复输入\n\n现在通知已成功获取输入，应用程序需要对该输入进行处理。本教程的目标是让用户在通知中输入的文本显示在\
  \ Activity 界面的 `TextView` 组件上。\n\n当用户输入文本并点击发送按钮时，`MainActivity` 将通过包含的 intent 启动。该\
  \ intent 中包含了用户通过通知输入的文本。在 Activity 的 `onCreate()` 方法中，调用 `getIntent()` 方法将返回启动该\
  \ Activity 的 intent 副本。将其传递给 `RemoteInput.getResultsFromIntent()` 方法将返回一个包含回复文本的\
  \ `Bundle` 对象，可以提取并赋值给 `TextView` 组件。这使得 `MainActivity.java` 文件中的 `onCreate()` 方法修改如下：\n\
  \n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState) {\n   \
  \ createNotificationChannel(channelID, \"DirectReply News\", Example News Channel);\n\
  \    handleIntent();\n}\n\nprivate void handleIntent() {\n    Intent intent = this.getIntent();\n\
  \    Bundle remoteInput = RemoteInput.getResultsFromIntent(intent);\n    if (remoteInput\
  \ != null) {\n        String inputString = remoteInput.getCharSequence(KEY_TEXT_REPLY).toString();\n\
  \    }\n}\n```\n\n\n\n\n```java\nbinding.textView.setText(inputString);\n\n}\n\n\
  }\n```\n\n完成这些代码更改后，再次构建并运行应用。点击按钮发布通知，并在通知面板中输入并发送一些文本。注意，`MainActivity` 中的 `TextView`\
  \ 控件已更新，以显示输入的内联文本。\n\n## 62.8 更新通知\n\n在通知中发送回复后，你可能会注意到进度指示器在通知面板中继续旋转，如图 62-4\
  \ 所示：\n\n![](img/Image24491.jpg)\n\n图 62-4\n\n通知显示此指示器是因为它正在等待 activity 的响应，以确认已接收到发送的文本。执行此任务的推荐方法是更新通知，显示一条新消息，表明回复已接收并处理。由于原始通知在发布时已分配了一个\
  \ ID，可以再次使用该 ID 来执行更新。在 `handleIntent()` 方法中添加以下代码以执行此任务：\n\n```java\nprivate void\
  \ handleIntent() {\n    Intent intent = this.getIntent();\n    Bundle remoteInput\
  \ = RemoteInput.getResultsFromIntent(intent);\n    if (remoteInput != null) {\n\
  \        String inputString = remoteInput.getCharSequence(\n                KEY_TEXT_REPLY).toString();\n\
  \        binding.myTextView.setText(inputString);\n        Notification repliedNotification\
  \ =\n                new Notification.Builder(this, channelID)\n               \
  \         .setSmallIcon(\n                            android.R.drawable.ic_dialog_info)\n\
  \                        .setContentText(\"Reply received\")\n                 \
  \       .build();\n        notificationManager.notify(notificationId,\n        \
  \        repliedNotification);\n    }\n}\n```\n\n最后测试一次应用，验证在发送内联回复文本后进度指示器是否消失，并出现了一个新面板表示回复已接收：\n\
  \n![](img/Image2457.jpg)\n\n图 62-5\n\n## 62.9 总结\n\n直接回复通知功能允许用户在通知内输入文本，并通过通过 intent\
  \ 传递给相应应用的 activity。直接回复的实现是通过 `RemoteInput` 类实现的，该类的实例可以嵌入 action 中并与通知一起打包。在处理直接回复通知时，让\
  \ `NotificationManager` 服务知道回复已接收并处理是非常重要的。实现此点的最佳方法是直接使用首次发布通知时提供的通知 ID 来更新通知消息。\n\
  \n# 63 折叠屏设备和多窗口支持\n\n无论我们是否准备好，折叠屏设备都将到来（对于第一代三星 Galaxy Fold 来说，可能在设备本身准备好之前就出现了）。为了准备这类新类型的设备，了解应该采取的某些额外步骤非常重要，以确保你的应用在折叠屏设备上运行正常。\n\
  \n幸运的是，支持折叠屏设备的大部分行为已经以多窗口支持的形式存在 Android 中。\n\n## 63.1 折叠屏与多窗口支持\n\n当应用在折叠屏设备上运行时，它可能会与其他应用共享屏幕，并遇到重大的配置更改（例如当用户折叠或展开显示时屏幕尺寸发生变化）。如果你的应用已经设计为可以处理设备方向变化，那么它可能也能处理由屏幕折叠引起的变化，尽管建议进行彻底测试。\n\
  \n多窗口支持最初是在 Android 7 中引入的。与之前的 Android 版本不同，Android 7 中的多窗口支持允许在设备屏幕上同时显示多个 activity。\n\
  \nAndroid 中的多窗口支持提供了三种形式的窗口支持。分屏模式适用于大多数手机、折叠屏和平板设备，提供了一个分屏环境，其中两个 activity 并排或上下堆叠。它提供了一个可移动的分割线，用户拖动它可以调整屏幕的比例。\n\
  \n![](img/Image2427.jpg)\n\n图 63-1\n\n自由形式为较大的屏幕提供了一个窗口化环境，并且目前由设备决定是否启用。自由形式与分屏模式的区别在于，它允许每个\
  \ activity 在可调整大小的窗口中出现。\n\n![](img/Image2436.jpg)\n\n图 63-2\n\n画中画支持（如名所示）允许视频播放在用户执行其他任务时在较小的窗口中继续进行。\n\
  \n## 63.2 使用折叠屏模拟器\n\n尽管在编写本文时，市面上还没有用于测试的折叠屏设备，但 Android SDK 包含了折叠屏模拟器。要创建一个折叠屏模拟器，选择\
  \ Android Studio 中的 `Tools` -> `AVD Manager`，点击 `Create Virtual Device` 按钮，并在硬件选择屏幕上选择\
  \ `Foldable` 之一：\n\n![](img/Image243.jpg)\n\n图 63-3\n\n完成折叠屏选择后，继续创建过程，选择 Android\
  \ 29 或更高版本作为系统镜像。一旦模拟器启动，工具栏将出现一个额外的按钮，允许模拟器在折叠配置之间切换。\n\n## 63.3 进入多窗口模式\n\n可以通过显示概览（Overview）屏幕、长按工具栏中的应用图标并选择分屏菜单选项来进入分屏模式，如图\
  \ 63-5 所示：\n\n![](img/Image2459.jpg)\n\n图 63-5\n\n进入分屏模式后，概览按钮将变为两个矩形（在图 63-6 中标记为\
  \ A），当前 activity 将占据屏幕的一部分 (B)，而概览屏幕将出现在屏幕的相邻部分，允许选择第二个 activity 进行显示 (C)：\n\n![](img/Image2.jpg)\n\
  \n图 63-6\n\n一旦选择了第二个应用，屏幕将平均平分。要退出分屏模式，只需将分离两个 activity 的分割线拖动到边缘，使一个 activity 填充整个屏幕，或者长按概览按钮直到它恢复为单个正方形。\n\
  \n### 63.4 启用并使用自由形式支持\n\n虽然并非在所有设备都正式支持，但在大屏设备和模拟器上启用自由形式多窗口模式。要启用此模式，在模拟器运行时或设备连接时运行以下\
  \ `adb` 命令：\n\n```\nadb shell settings put global enable_freeform_support 1\n```\n\
  \n进行此更改后，可能需要重启设备设置才能生效。启用后，在概览屏幕中长按应用图标时会出现一个额外的选项，如图 63-7 所示：\n\n![](img/Image7.jpg)\n\
  \n图 63-7\n\n## 63.5 检查自由形式支持\n\n\n\n\n正如本章早期概述，Google 将是否启用自由窗口多窗口模式（freeform multi-window\
  \ mode）的选择交给了各个 Android 设备制造商。由于自由窗口模式仅在较大的设备上才有意义，因此无法保证每个可能运行应用程序的设备上都支持自由窗口模式。幸运的是，如果设备不支持自由窗口模式，系统将忽略所有与自由窗口特定的方法和属性，因此使用这些功能不会在不支持自由窗口的设备上导致应用崩溃。然而，可能会出现某些情况，此时检测设备是否支持自由窗口多窗口模式是有用的。幸运的是，这可以通过在包管理器中检查自由窗口管理功能来实现。下面的代码示例检查了对自由窗口多窗口的支持，并根据测试结果返回一个\
  \ `Boolean` 值：\n\n```java\npublic Boolean checkFreeform() {\n    return getPackageManager().hasSystemFeature(\n\
  \            PackageManager.FEATURE_FREEFORM_WINDOW_MANAGEMENT);\n}\n```\n\n## 63.6\
  \ 在应用中启用多窗口支持\n\n清单文件中的 `android:resizableActivity` 设置控制应用是否支持多窗口行为。该设置可以在应用程序级别或单个\
  \ Activity 级别进行配置。例如，下面的代码片段配置了名为 `MainActivity` 的 Activity 同时支持分屏和自由窗口多窗口模式：\n\n\
  ```xml\n<activity\n    android:name=\".MainActivity\"\n    android:resizeableActivity=\"\
  true\"\n    android:label=\"@string/app_name\"\n    android:theme=\"@style/AppTheme.NoActionBar\"\
  >\n    <intent-filter>\n        <action android:name=\"android.intent.action.MAIN\"\
  \ />\n        <category android:name=\"android.intent.category.LAUNCHER\" />\n \
  \   </intent-filter>\n</activity>\n```\n\n将该属性设置为 `false` 将防止 Activity 出现在分屏或自由窗口模式下，且相应的按钮将出现在应用的概览（Overview）菜单中。在分屏配置中选择一个禁用了多窗口支持的\
  \ Activity 作为第二个 Activity，将显示一条消息，指示该应用可能不支持多窗口模式。\n\n## 63.7 指定多窗口属性\n\n在`<layout>`\
  \ 元素中提供了多个属性，用于指定 Activity 在多窗口模式下启动时的尺寸和位置。当 Activity 在自由窗口模式下启动时，其初始高度、宽度和位置可以使用以下属性指定：\n\
  \n* `android:defaultWidth` – 指定 Activity 的默认宽度。\n* `android:defaultHeight` – 指定\
  \ Activity 的默认高度。\n* `android:gravity` – 指定 Activity 的初始位置（start、end、left、right、top\
  \ 等）。\n\n注意，上述属性仅在 Activity 在自由窗口模式下显示时才生效。下面的示例配置了 Activity 在屏幕边缘顶部以特定的高度和宽度出现：\n\
  \n```xml\n<activity android:name=\".MainActivity \">\n    <layout android:defaultHeight=\"\
  350dp\"\n             android:defaultWidth=\"450dp\"\n             android:gravity=\"\
  start|end\" />\n</activity>\n```\n\n可以使用以下 `<layout>` 属性来指定 Activity 在分屏或自由窗口模式下可以缩小的最小宽度和高度：\n\
  \n* `android:minimalHeight` – 指定 Activity 在分屏或自由窗口模式下可以缩小的最小最小高度。\n* `android:minimalWidth`\
  \ - 指定 Activity 在分屏或自由窗口模式下可以缩小的最小最小宽度。\n\n当用户将分屏分割线滑出最小高度或宽度边界之外时，系统将停止调整收缩中 Activity\
  \ 的布局，并简单地裁剪用户界面以为相邻的 Activity 留出空间。\n\n下面的清单文件片段为 Activity 实现了最小宽度和高度属性：\n\n```xml\n\
  <activity android:name=\".MainActivity \">\n    <layout android:minimalHeight=\"\
  400dp\"\n             android:minimalWidth=\"290dp\" />\n</activity>\n```\n\n##\
  \ 63.8 在 Activity 中检测多窗口模式\n\n可能会出现某些情况，Activity 需要检测当前是否正以多窗口模式显示给用户。当前状态可以通过调用\
  \ `Activity` 类的 `isInMultiWindowMode()` 方法获取。调用此方法时，它将根据 Activity 当前是否处于全屏状态返回 `true`\
  \ 或 `false` 值：\n\n```java\nif (this.isInMultiWindowMode()) {\n    // Activity 正在多窗口模式运行\n\
  } else {\n    // Activity 不在多窗口模式\n}\n```\n\n## 63.9 接收多窗口通知\n\n如果 Activity 重写了\
  \ `onMultiWindowModeChanged()` 回调方法，它将接收进入或退出多窗口模式的通知。传递给方法的第一个参数在进入多窗口模式时为 `true`，在\
  \ Activity 退出该模式时为 `false`。新的配置设置包含在 `Configuration` 对象参数中：\n\n```java\n@Override\n\
  public void onMultiWindowModeChanged(boolean isInMultiWindowMode, Configuration\
  \ newConfig) {\n    super.onMultiWindowModeChanged(isInMultiWindowMode, newConfig);\n\
  \    if (isInMultiWindowMode) {\n        // Activity 进入了多窗口模式\n    } else {\n  \
  \      // Activity 离开了多窗口模式\n    }\n}\n```\n\n正如处理 Activity 状态变化 章节所述，Android 10\
  \ 及更高版本允许多个 Activity 处于恢复状态（也称为多恢复，multi-resume）。用户最近交互的 Activity 被称为顶层 Activity（topmost\
  \ activity）。为了跟踪 Activity 获得和失去顶层状态，可以在 Activity 中实现 `onTopResumed()` 回调方法，例如：\n\
  \n```java\n@Override\npublic void onTopResumed(boolean isTopResumed) {\n    super.onTopResumed(isTopResumed);\n\
  \    if (isTopResumed) {\n        // Activity 现在是顶层 Activity\n    } else {\n   \
  \     // Activity 不再是顶层 Activity\n    }\n}\n```\n\n在某些运行 Android 9 的设备上，也可以通过在应用清单中启用以下属性利用多恢复：\n\
  \n```xml\n<meta-data android:name=\"android.allow_resumed_activities\" android:value=\"\
  true\" />\n```\n\n## 63.10 在多窗口模式下启动 Activity\n\n在本书的[Android 显式——示例](#Explicit_Intents）章节中，有一个示例应用，其中\
  \ Activity 使用 Intent 启动另一个 Activity。默认情况下，通过 Intent 启动的 Activity 被认为与源 Activity\
  \ 在同一个任务栈中。然而可以通过向 Intent 传递相应的标志将其启动到新的任务栈。\n\n当多窗口模式下的 Activity 在同一任务栈中启动另一个 Activity\
  \ 时，新 Activity 将替换分屏或自由窗口中的源 Activity（用户通过返回键回到原始 Activity）。\n\n但在分屏模式下启动到新的任务栈时，第二个\
  \ Activity 将出现在原始 Activity 相邻的窗口中，允许同时查看两个 Activity。在自由窗口模式下，启动的 Activity 将出现在原始\
  \ Activity 独立的窗口中。\n\n为了将 Activity 启动到新的任务栈，必须在启动前在 Intent 上设置以下标志：\n\n* `Intent.FLAG_ACTIVITY_LAUNCH_ADJACENT`\n\
  * `Intent.FLAG_ACTIVITY_MULTIPLE_TASK`\n* `Intent.FLAG_ACTIVITY_NEW_TASK`\n\n下面的代码示例配置并启动了设计为在独立窗口中出现的第二个\
  \ Activity：\n\n\n\n\n\n```\nIntent i = new Intent(this, SecondActivity.class);\n\
  \ni.addFlags(Intent.FLAG_ACTIVITY_LAUNCH_ADJACENT|\n           Intent.FLAG_ACTIVITY_MULTIPLE_TASK|\n\
  \           Intent.FLAG_ACTIVITY_NEW_TASK);\nstartActivity(i);\n```\n\n### 63.11\
  \ 配置自由窗形 Activity 的大小和位置\n\n默认情况下，在自由窗形（freeform）模式下启动到不同任务栈的 activity 将位于屏幕中心，其大小由系统决定。此窗口的位置和维度可以通过通过\
  \ `ActivityOptions` 类向 intent 传递启动边界（launch bounds）设置来控制。此过程的第一步是创建一个 `Rect` 对象，并配置为代表\
  \ activity 窗口的矩形的左侧 (X)、顶部 (Y)、右侧 (X) 和底部 (Y) 坐标。例如，以下代码创建了一个 `Rect` 对象，其左上角位于坐标\
  \ (0, 0)，右下角位于 (100, 100)：\n\n```\nRect rect = new Rect(100, 800, 900, 700);\n```\n\
  \n下一步是创建 `ActivityOptions` 类的基本实例，并通过 `setLaunchBounds()` 方法通过 `Rect` 设置对其进行初始化：\n\
  \n```\nActivityOptions options = ActivityOptions.makeBasic();\nActivityOptions bounds\
  \ = options.setLaunchBounds(rect);\n```\n\n最后，将 `ActivityOptions` 实例转换为 `Bundle`\
  \ 对象并同 `Intent` 对象一起传递给 `startActivity()` 方法：\n\n```\nstartActivity(i, bounds.toBundle());\n\
  ```\n\n结合这些步骤将得到如下代码序列：\n\n```\nIntent i = new Intent(this, SecondActivity.class);\n\
  \ni.addFlags(Intent.FLAG_ACTIVITY_LAUNCH_ADJACENT|\n           Intent.FLAG_ACTIVITY_MULTIPLE_TASK|\n\
  \           Intent.FLAG_ACTIVITY_NEW_TASK);\nRect rect = new Rect(100, 800, 900,\
  \ 700);\nActivityOptions options = ActivityOptions.makeBasic();\nActivityOptions\
  \ bounds = options.setLaunchBounds(rect);\nstartActivity(i, bounds.toBundle());\n\
  ```\n\n当源 activity 处于自由窗形模式时，通过 `intent` 启动第二个 activity，新 activity 窗口将按照 `Rect`\
  \ 对象中定义的位置和维度出现。\n\n## 63.12 总结\n\nAndroid 7 引入了多窗口支持，该系统允许屏幕上同时同时显示多个 activity。此功能现在构成了为折叠设备提供支持的基础。多窗口支持提供的三种模式是分屏、自由窗形和画中画。在分屏模式下，屏幕被水平或垂直划分为两个窗格，每个窗格中显示一个\
  \ activity。自由窗形模式仅在某些 Android 设备上支持，允许每个 activity 出现在独立的、可移动且可调整大小的窗口中。正如本章概述，Android\
  \ SDK 提供了许多方法和属性设置，用于检测、响应和控制应用内部的多窗口行为。\n\n### 64. Android SQLite 数据库概览\n\n不需要存储至少某些持久化数据的移动应用寥寥无几。数据库的使用是大多数应用至关重要的方面，从几乎完全由数据驱动的应用，到只需要存储少量数据（例如游戏的当前得分）的应用。\n\
  \n当考虑到典型 Android 应用的某种短暂生命周期时，持久化数据存储的重要性变得更加明显。考虑到 Android 运行时系统随时可能终止应用程序组件以释放资源的风险，为了避免数据丢失的全面数据存储策略是任何应用开发策略设计和实现的关键因素。\n\
  \n本章将提供 Android 操作系统绑定的 SQLite 数据库管理系统的概述，并概述提供的 Android SDK 类，以便从 Android 应用内部实现基于\
  \ SQLite 的持久化数据库存储。然而，在深入研究 Android 开发背景下的 SQLite 细节之前，将对数据库和 SQL 进行简要概述。\n\n####\
  \ 64.1 理解数据库表\n\n数据库表（Database Tables）提供了数据库中最基本的数据结构级别。每个数据库可以包含多个表，每个表都设计用于存储特定类型的信息。例如，数据库可能包含一个客户表，其中包含特定业务每个客户的名称、地址和电话号码。同一个数据库可能还包含一个产品表，用于存储该业务销售的商品描述以及相关的产品代码。\n\
  \n数据库中的每个表都分配有一个名称，该名称在该特定数据库内必须唯一。表名一旦分配给某个数据库中的表，除非在另一个数据库范围内，否则不能用于另一个表。\n\n\
  #### 64.2 引入数据库模式（Schema）\n\n数据库模式（Database Schemas）定义了存储在数据库表中的数据的特征。例如，客户数据库表模式可能定义客户名称长度不超过\
  \ 20 个字符，且客户电话号码是特定格式的数值数据字段。\n\n模式还用于定义整个数据库的结构以及每个数据库中包含各种表之间的关系。\n\n#### 64.3\
  \ 列和数据类型\n\n在此阶段，将数据库表视为类似于电子表格是有帮助的，其中数据存储在行和列中。\n\n每列代表对应表中的一个数据字段。例如，表的名称、地址和电话数据字段都是列。\n\
  \n每列反又被定义包含特定类型的数据。因此，设计用于存储数字的列被定义为包含数值。\n\n## 64.4 数据库行\n\n保存到表的每个新记录都存储在行中。再次，考虑本章前面描述的电子表格类比。客户表中的每个条目等同于电子表格中的行，每行由与保存记录相关的列组成。当向表中添加新客户时，会创建一个新行，并将客户的数据存储在相应的列中。\n\
  \n行也被称为记录（records）或条目（entries），这些术语通常可以换使用。\n\n#### 64.5 引入主键（Primary Keys）\n\n\
  每个数据库表都应该包含一个或多个列，用于唯一标识表中的每一行。这在数据库术语中被称为主键（Primary Key）。例如，表可以使用银行账户号码列作为主键。或者，客户表可以使用客户的社会安全号码作为主键。\n\
  \n主键允许数据库管理系统唯一地标识表中的特定行。没有主键，将无法检索或删除表中的特定行，因为无法确定选中了正确的行。例如，假设有一个表将客户的姓氏定义为主键。那么设想一下，如果数据库中记录了多个姓“Smith”的客户，可能会出现什么问题。如果没有某种保证的方法来唯一标识特定行，就无法确保在任何时候都访问的是正确的数据。\n\
  \n主键由表中的单列或多列组成。要符合单列主键的标准，任何两行不能包含匹配的主键值。当使用多个列构造主键时，单个列的值不需要是唯一的，但所有列的值组合在一起必须是唯一的。\n\
  \n#### 64.6 什么是 SQLite?\n\n\n\n\n\nSQLite 是一种嵌入式关系型数据库管理系统（RDBMS）。大多数关系型数据库（Oracle、SQL\
  \ Server 和 MySQL 为主要示例）都是独立运行的服务器进程，并与需要数据库访问的应用程序协作工作。SQLite 被称为嵌入式，因为它是以库的形式提供并链接到应用程序中的。因此，后台没有运行独立的数据库服务器。所有的数据库操作都是通过调用\
  \ SQLite 库中包含的函数，在应用程序内部处理的。\n\nSQLite 的开发者已将该技术投入公有领域，因此它现在是一种广泛部署的数据库解决方案。\n\n\
  SQLite 使用 C 语言编写，因此 Android SDK 为底层数据库接口提供了一个基于 Java 的“包装器”。这本质上由一组类组成，可以在应用程序的\
  \ Java 或 Kotlin 代码中使用这些类来创建和管理基于 SQLite 的数据库。\n\n有关 SQLite 的更多信息，请参阅 [`www.sqlite.org`](http://www.sqlite.org)。\n\
  \n## 64.7 结构化查询语言 (SQL)\n\n在 SQLite 数据库中，使用一种名为结构化查询语言的高级语言访问数据。这通常缩写为 `SQL`，读作\
  \ sequel。`SQL` 是大多数关系型数据库管理系统使用的标准语言。SQLite 大多符合 `SQL-92` 标准。\n\n`SQL` 本质上是一种非常简单且易用的语言，专门设计用于能够读写数据库数据。由于\
  \ `SQL` 包含一小部分关键字，因此可以快速学习。此外，大多数 DBMS 实现之间的 `SQL` 语法大同小异，因此在学习了某个系统的 `SQL` 后，你的技能很可能会迁移到其他数据库管理系统。\n\
  \n虽然本章将使用一些基本的 `SQL` 语句，但对 `SQL` 的详细概述超出了本书的范围。然而，还有许多其他资源可以提供比我们在这里一个章节中能提供的好得多的\
  \ `SQL` 概述。\n\n## 64.8 在 Android 虚拟设备 (AVD) 上尝试 SQLite\n\n对于不熟悉数据库（特别是 SQLite）的读者来说，直接开始创建一个使用\
  \ SQLite 的 Android 应用程序可能看起来有些畏惧。幸运的是，Android 预装了 SQLite，包括一个交互式环境，允许从连接到运行中的 Android\
  \ AVD 模拟器实例的 `adb shell` 会话中发布 `SQL` 命令。这既是学习 SQLite 和 `SQL` 的有效方法，也是识别在模拟器中运行的应用程序所创建的数据库问题的价值工具。\n\
  \n要启动交互式 SQLite 会话，首先运行 AVD 会话。这可以通过在 Android Studio 中启动 Android 虚拟设备管理器（Tools ->\
  \ AVD Manager），选择一个之前配置过的 AVD 并点击启动按钮来实现。\n\n一旦 AVD 运行，打开终端或命令提示符窗口并使用 `adb` 命令行工具连接到模拟器，如下（注意\
  \ `-e` 标志指示工具查找要连接的模拟器，而不是物理设备）：\n\n```bash\nadb –e shell\n```\n\n连接成功后，shell 环境将提供一个命令提示符，可以在其中输入命令。首先使用\
  \ `su` 命令获取超级用户权限：\n\n```bash\nGeneric_x86:/ su\nroot@android:/ #\n```\n\n如果出现消息表示不允许超级用户权限，可能是该\
  \ AVD 实例包含了 Google Play 支持。要解决这个问题，请创建一个新的 AVD，并在“Choose a device definition”屏幕上，选择一个在“Play\
  \ Store”列中没有标记的设备。\n\n存储在 SQLite 数据库中的数据实际上存储在运行应用程序的 Android 设备的文件系统的数据库文件中。默认情况下，这些数据库文件的文件系统路径如下：\n\
  \n`/data/data/<package name>/databases/<database filename>.db`\n\n例如，如果一个包名为 `com.example.MyDBApp`\
  \ 的应用程序创建一个名为 `mydatabase.db` 的数据库，则设备上的文件路径如下：\n\n`/data/data/com.example.MyDBApp/databases/mydatabase.db`\n\
  \n因此，为了进行练习，请在 `adb shell` 中切换目录到 `/data/data` 并创建一个适用于某些 SQLite 实验的子目录层次：\n\n```bash\n\
  cd /data/data\nmkdir com.example.dbexample\ncd com.example.dbexample\nmkdir databases\n\
  cd databases\n```\n\n为数据库文件创建了合适的位置后，如下启动交互式 SQLite 工具：\n\n```bash\nroot@android:/data/data/databases\
  \ # sqlite3 ./mydatabase.db\nsqlite3 ./mydatabase.db\nSQLite version 3.8.10.2 2015-05-20\
  \ 18:17:19\nEnter \".help\" for usage hints.\nsqlite>\n```\n\n在 `sqlite> ` 提示符下，可以输入命令来执行任务，如创建表、插入和检索数据。例如，为了在数据库中创建一个包含存储\
  \ ID、名称、地址和电话号码字段的新表，需要以下语句：\n\n```sql\ncreate table contacts (_id integer primary\
  \ key autoincrement, name text, address text, phone text);\n```\n\n注意，表中的每一行都应该有一个对该行是唯一的的主键。在上面的示例中，我们将\
  \ ID 字段指定为主键，将其声明为整数类型，并要求 SQLite 在每次添加新行时自动增加数字。这是是确保每行都具有唯一主键的常用方法。在大多数其他平台上，主键的名称选择是任意的。然而，在\
  \ Android 中，必须将键命名为 `_id`，以便使用所有的 Android 数据库相关类完全访问数据库。其余字段均被声明为文本类型。\n\n要列出当前选择数据库中的表，使用\
  \ `.tables` 语句：\n\n```sql\nsqlite> .tables\ncontacts\n```\n\n向表中插入记录：\n\n```sql\n\
  sqlite> insert into contacts (name, address, phone) values (\"Bill Smith\", \"123\
  \ Main Street, California\", \"123-555-2323\");\nsqlite> insert into contacts (name,\
  \ address, phone) values (\"Mike Parks\", \"10 Upping Street, Idaho\", \"444-444-1212\"\
  );\n```\n\n从表中检索所有行：\n\n```sql\nsqlite> select * from contacts;\n1|Bill Smith|123\
  \ Main Street, California|123-555-2323\n2|Mike Parks|10 Upping Street, Idaho|444-444-1212\n\
  ```\n\n提取符合特定标准的行：\n\n```sql\nsqlite> select * from contacts where name=\"Mike Parks\"\
  ;\n2|Mike Parks|10 Upping Street, Idaho|444-444-1212\n```\n\n从 sqlite 交互式环境退出：\n\
  \n```sql\nsqlite> .exit\n```\n\n\n\n\n如所述，SQLite 是用 C 语言编写的，而 Android 应用主要使用 Java\
  \ 或 Kotlin 开发。为了弥补过去的这种“语言差距”，Android SDK 包含了一组类，它们在 SQLite 数据库管理系统之上提供了一个层。尽管这些类在\
  \ SDK 中仍然可用，但使用这些类仍然需要编写大量的代码，并且没有利用新的架构指南和功能（如 LiveData 和生命周期管理）。为了解决这些缺点，Android\
  \ Jetpack 架构组件包含了 Room 持久化库。该库在 SQLite 数据库系统之上提供了一个高层接口，使得能够以极少的代码在 Android 设备上本地存储数据，同时符合现代应用架构的建议。\n\
  \n接下来的章节将提供使用 Room 持久化库进行 SQLite 数据库管理的概述和教程。\n\n## 64.10 总结\n\nSQLite 是一种轻量级的嵌入式关系型数据库管理系统，作为\
  \ Android 框架的一部分，为 Android 应用提供了实现组织的持久化数据存储的机制。与 Room 持久化库结合时，Android 提供了一种从 Android\
  \ 应用内部实现数据存储的现代方法。\n\n本章的目标是在 Android 应用开发的背景下，对数据库特别是 SQLite 提供概述。\n\n接下来的章节将提供\
  \ Room 持久化库的概述，之后我们将通过创建一个示例应用来进行实战学习。\n\n## 65. Android Room 持久化库\n\nRoom 持久化库包含在\
  \ Android 架构组件中，专门设计用于能够以符合 Android 架构指南的方式为 Android 应用添加数据库存储支持。在上一章涵盖了 SQLite\
  \ 数据库基础知识后，本章将探索基于 Room 的数据库管理的基本概念、在 Android 应用中协作实现 Room 支持的关键元素，以及这些元素在架构和编码方面是如何实现的。在涵盖这些主题后，接下来的两个章节将以示例\
  \ Room 项目项目的形式将这些理论付诸实践。\n\n## 65.1 重新审视现代应用架构\n\n名为“使用 Jetpack 构建现代 Android 应用架构”的章节介绍了现代应用架构的概念，并强调了分离应用不同责任区域的重要性。图\
  \ 65-1 所示的图概述了典型 Android 应用的推荐架构：\n\n![](img/room_diagram_1.jpg)\n\n图 65-1\n\n在本书之前的章节中已经详细介绍了该架构的顶三层，现在是时候在\
  \ Room 持久化库的背景下开始探索仓库和数据库架构级别了。\n\n## 65.2 Room 数据库持久化的关键元素\n\n在章节稍后的详细讨论之前，首先值得总结使用\
  \ Room 持久化库处理 SQLite 数据库涉及的关键元素：\n\n### 65.2.1 仓库 (Repository)\n\n如前所述，仓库模块包含了直接处理应用使用的所有数据源所需的代码。这避免了\
  \ UI 控制器和 `ViewModel` 包含直接访问数据库或网络服务的代码的需求。\n\n### 65.2.2 Room 数据库\n\n`room database`\
  \ 对象提供了底层 SQLite 数据库的接口。它还为仓库提供了访问数据访问对象（DAO）的权限。应用应该只有一个 `room database` 实例，然后可以使用该实例访问多个数据库表。\n\
  \n### 65.2.3 数据访问对象 (DAO)\n\n`DAO` 包含了仓库在 SQLite 数据库中插入、检索和删除数据所需的 SQL 语句。这些 SQL\
  \ 语句映射到方法，然后从仓库内部调用这些方法来执行相应的查询。\n\n### 65.2.4 实体 (Entities)\n\n`entity` 是一个定义数据库中表模式的类，定义了表名、列名和数据类型，并指定哪一列作为主键。除了声明表模式外，实体类还包含提供对这些数据字段访问的\
  \ getter 和 setter 方法。`DAO` 响应 SQL 查询方法调用时返回给仓库的数据将以这些实体类实例的形式存在。然后将调用 getter 方法从实体对象中提取数据。同样，当仓库需要向数据库写入新记录时，它会创建一个实体实例，通过\
  \ setter 调用在对象上配置值，然后调用 `DAO` 中声明的 `insert` 方法，并传递要保存的实体实例。\n\n### 65.2.5 SQLite\
  \ 数据库\n\n负责存储和提供数据访问的实际 SQLite 数据库。应用代码（包括仓库）永远不直接访问此底层数据库。所有的数据库操作都通过 `room database`、`DAOs`\
  \ 和 `entities` 的结合来完成。\n\n图 65-2 中的架构图说明了这些不同元素如何交互以在 Android 应用中提供基于 Room 的数据库存储：\n\
  \n![](img/room_architecture_diagram.jpg)\n\n图 65-2\n\n上述架构图中的带数字连接可以总结如下：\n\n1.\
  \ 仓库与 `Room Database` 交互以获取数据库实例，反之，该实例用于获取 `DAO` 实例的引用。\n2. 仓库创建实体实例并在传递给 `DAO`\
  \ 之前对它们配置数据，以便用于搜索和插入操作。\n3. 仓库调用 `DAO` 上的方法并传递要插入到数据库的实体，并在响应搜索查询时接收实体实例。\n4. 当\
  \ `DAO` 有结果要返回给仓库时，它会将这些结果封装成实体对象。\n5. `DAO` 与 `Room Database` 交互以启动数据库操作并处理结果。\n\
  6. `Room Database` 处理与底层 SQLite 数据库的所有低级交互，提交查询并接收结果。\n\n在涵盖了使用 Room 持久化进行数据库访问的关键元素的基本大纲后，现在该详细探索实体、`DAOs`、`room\
  \ databases` 和仓库了。\n\n## 65.3 理解实体\n\n每个数据库表都有与其关联的实体类。该类定义了表模式，并表现为穿插了一些 Room 注解的标准\
  \ Java 类。一个声明存储在数据库表中的示例 Java 类可能如下：\n\n```java\npublic class Customer {\n    private\
  \ int id;\n    private String name;\n    private string address;\n\n    public Customer(String\
  \ name, String address) {\n        this.id = id;\n        this.name = name;\n  \
  \      this.address = address;\n    }\n\n    public int getId() {\n        return\
  \ this.id;\n    }\n\n    public String getName() {\n        return this.name;\n\
  \    }\n\n    public int getAddress() {\n        return this.address;\n    }\n\n\
  \    public void setId(int id) {\n        this.id = id;\n    }\n\n    public void\
  \ setName(String name) {\n        this.name = name;\n    }\n\n    public void setAddress(int\
  \ quantity) {\n        this.address = address;\n    }\n}\n```\n\n\n\n\n\n按照目前的实现，上述代码声明了一个基础\
  \ Java 类，其中包含若干表示数据库表字段的变量以及一组 getter 和 setter 方法。然而，该类尚未成为实体。要将此类转换为实体并使其能够在 SQL\
  \ 语句中使用，需要按照如下添加一些 Room 注解：\n\n```java\n@Entity(tableName = \"customers\")\n\npublic\
  \ class Customer {\n    @PrimaryKey(autoGenerate = true)\n    @NonNull\n    @ColumnInfo(name\
  \ = \"customerId\")\n    private int id;\n\n    @ColumnInfo(name = \"customerName\"\
  )\n    private String name;\n\n    private String address;\n\n    public Customer(String\
  \ name, String address) {\n        this.id = id;\n        this.name = name;\n  \
  \      this.address = address;\n    }\n\n    public int getId() {\n        return\
  \ this.id;\n    }\n\n    public String getName() {\n        return this.name;\n\
  \    }\n\n    public String getAddress() {\n        return this.address;\n    }\n\
  \n    public void setId(@NonNull int id) {\n        this.id = id;\n    }\n\n   \
  \ public void setName(String name) {\n        this.name = name;\n    }\n\n    public\
  \ void setAddress(int quantity) {\n        this.address = address;\n    }\n}\n```\n\
  \n上述注解首先声明该类代表一个实体，并分配了一个名为“customers”的表名。这是在 DAO SQL 语句中引用该表的名称：\n\n`@Entity(tableName\
  \ = \"customers\")`\n\n每个数据库表都需要一列作为主键。在这种情况下，customer id 被声明为主键。同时还添加了注解来分配一个在\
  \ SQL 查询中引用的列名，并指明该字段不能用于存储空值。最后，`id` 值被配置为自动生成。这意味着分配给新记录的 `id` 将由系统自动生成，以避免主键冲突。\n\
  \n```java\n@PrimaryKey(autoGenerate = true)\n@NonNull\n@ColumnInfo(name = \"customerId\"\
  )\nprivate int id;\n```\n\ncustomer name 字段也被分配了一个列名。但请注意，`address` 字段没有分配列名。这意味着\
  \ `address` 数据仍将存储在数据库中，但不需要在 SQL 语句中引用。如果实体中的某个字段不需要存储在数据库中，只需直接使用 `@Ignore` 注解：\n\
  \n```java\n@Ignore\nprivate String myString;\n```\n\n最后，修改了 `id` 变量的 setter 方法，以防止尝试分配空值：\n\
  \n```java\npublic void setId(@NonNull int id) {\n    this.id = id;\n}\n```\n\n注解也可以包含在实体类中，使用称为“外键”的关系型数据库概念来与其他实体建立关系。外键允许一个表引用另一个表的主键。例如，可以在名为\
  \ `Purchase` 的实体与我们现有的 `Customer` 实体之间建立如下关系：\n\n```java\n@Entity(foreignKeys =\
  \ {@ForeignKey(entity = Customer.class,\n        parentColumns = \"customerId\"\
  ,\n        childColumns = \"buyerId\",\n        onDelete = ForeignKey.CASCADE,\n\
  \        onUpdate = ForeignKey.RESTRICT})\npublic class Purchase {\n    @PrimaryKey(autoGenerate\
  \ = true)\n    @ColumnInfo(name = \"purchaseId\")\n    private int purchaseId;\n\
  \n    @ColumnInfo(name = \"buyerId\")\n    private int buyerId;\n}\n```\n\n注意，外键声明还指定了当父级记录被删除或更新时应采取的操作。可用选项有\
  \ `CASCADE`、`NO_ACTION`、`RESTRICT`、`SET_DEFAULT` 和 `SET_NULL`。\n\n## 65.4 数据访问对象\n\
  \n数据访问对象（Data Access Object）提供了一种访问存储在 SQLite 数据库中的数据的方法。`DAO` 被声明为标准的 Java 接口，带有额外的注解，将特定的\
  \ SQL 语句映射到方法，这些方法可以由仓库（repository）调用。\n\n第一步是创建接口并使用 `@Dao` 注解将其声明为 `DAO`：\n\n\
  ```java\n@Dao\npublic interface CustomerDao {\n}\n```\n\n接下来，添加包含 SQL 语句和对应方法名的条。例如下面的声明允许通过调用名为\
  \ `getAllCustomers()` 的方法检索 `customers` 表中的所有行：\n\n```java\n@Dao\npublic interface\
  \ CustomerDao {\n    @Query(\"SELECT * FROM customers\")\n    LiveData<List<Customer>>\
  \ getAllCustomers();\n}\n```\n\n注意 `getAllCustomers()` 方法返回一个 `List` 对象，其中包含从数据库表中检索出的每条记录对应的\
  \ `Customer` 实体对象。`DAO` 还利用了 `LiveData`，以便仓库能够观察到数据库的变化。\n\n参数也可以传递给方法，并在相应的 SQL\
  \ 语句中引用。考虑下面的 DAO 声明，它搜索与客户名称匹配的数据库记录（注意 `WHERE` 条件中引用的列名是实体类中分配给列的名称）：\n\n```java\n\
  @Query(\"SELECT * FROM customers WHERE name = :customerName\")\nList<Customer> findCustomer(String\
  \ customerName);\n```\n\n在此示例中，方法传递了一个字符串值，该值随后通过在变量名前前加冒号（`:`）包含在 SQL 语句中。可以使用\
  \ `@Insert` 注解按如下声明一个基本的插入操作：\n\n```java\n@Insert\nvoid addCustomer(Customer);\n\
  ```\n\n这被称为便利注解，因为 Room 持久库可以推断出传递给 `addCustomer()` 的 `Customer` 实体将插入数据库，而无需 SQL\
  \ 语句。可以在单个事务中按如下插入多个数据库记录：\n\n```java\n@Insert\npublic void insertCustomers(Customer...\
  \ customers);\n```\n\n下面的声明删除所有匹配客户名称的记录：\n\n```java\n@Query(\"DELETE FROM customers\
  \ WHERE name = :name\")\nvoid deleteCustomer(String name);\n```\n\n作为使用 `@Query`\
  \ 注解执行删除的替代方案，也可以 `@Delete` 注解。在下面的示例中，传递给 `deleteCustomers()` 的所有 `Customer` 记录将从数据库中删除：\n\
  \n```java\n@Delete\npublic void deleteCustomers(Customer... customers);\n```\n\n\
  `@Update` 便利注解在更新记录时提供了类似的功能：\n\n```java\n@Update\npublic void updateCustomers(Customer...\
  \ customers);\n```\n\n此类数据库操作的 `DAO` 方法也可以声明返回 `int` 值，表示受影响的行数，例如：\n\n```java\n\
  @Delete\npublic int deleteCustomers(Customer... customers);\n```\n\n## 65.5 Room\
  \ 数据库\n\nRoom 数据库类通过扩展 `RoomDatabase` 类创建，它是 Android 嵌入数据库的上层。该类负责创建并返回新的 Room 实例，并提供与数据库关联的\
  \ `DAO` 实例。\n\nRoom 持久库提供了创建数据库实例的构建器。每个 Android 应用应只有一个 Room 实例，因此在类内部实现防御性代码以防止创建多个实例是最佳实践。\n\
  \n示例 Room 数据库实现如下代码所示：\n\n```java\nimport android.content.Context;\nimport android.arch.persistence.room.Database;\n\
  import android.arch.persistence.room.Room;\nimport android.arch.persistence.room.RoomDatabase;\n\
  \n@Database(entities = {Customer.class}, version = 1)\npublic class CustomerRoomDatabase\
  \ extends RoomDatabase {\n    public abstract CustomerDao customerDao();\n    private\
  \ static CustomerRoomDatabase INSTANCE;\n    static CustomerRoomDatabase getDatabase(final\
  \ Context context) {\n        if (INSTANCE == null) {\n            synchronized\
  \ (CustomerRoomDatabase.class) {\n                if (INSTANCE == null) {\n    \
  \                INSTANCE = Room.databaseBuilder(\n```\n\n\n\n\n\n```java\n    \
  \            context.getApplicationContext(),\n                CustomerRoomDatabase.class,\
  \ \"customer_database\")\n                .build();\n            }\n        }\n\
  \    }\n    return INSTANCE;\n}\n}\n```\n\n上述示例中需要注意的重要区域是：类声明上方用于声明数据库要操作的实体的注解、检查类实例是否已经创建的代码，以及为该实例分配名称\
  \ `customer_database`。\n\n## 65.6 仓库（Repository）\n\n仓库负责获取 `Room Database` 实例，使用该实例访问关联的\
  \ `DAOs`，然后通过调用 `DAO` 方法的方法来执行数据库操作。一个为配合 `Room Database` 设计的典型仓库构造函数如下：\n\n```java\n\
  public class CustomerRepository {\n\n    private CustomerDao customerDao;\n\n  \
  \  private CustomerRoomDatabase db;\n\n    public CustomerRepository(Application\
  \ application) {\n        db = CustomerRoomDatabase.getDatabase(application);\n\
  \        customerDao = db.customerDao();\n    }\n\n.\n.\n\n}\n```\n\n一旦仓库获取了 `DAO`，它就可以调用数据访问方法。例如，下面的代码调用了\
  \ `getAllCustomers()` `DAO` 方法：\n\n```java\nprivate LiveData<List<Customer>> allCustomers;\n\
  \nallCustomers = customerDao.getAllCustomers();\n```\n\n在调用 `DAO` 方法时，需要注意的是，除非方法返回\
  \ `LiveData` 实例（它会在单独的线程上运行查询），否则无法在应用的主线程上执行操作。事实上，尝试这样做将导致应用崩溃并输出以下诊断信息：\n\n`Cannot\
  \ access database on the main thread since it may potentially lock the UI for a\
  \ long period of time`\n\n由于某些数据库事务可能需要更长时间才能完成，因此在单独线程上运行操作可以避免应用出现假死状态。正如标题为 Android\
  \ Room 数据库和仓库教程的章节将演示的那样，可以通过 `Java` 线程轻松解决这个问题（如需更多信息或关于如何使用线程，请参阅标题为 Java 线程、Handlers\
  \ 和 Executors 的基础概述章节）。\n\n## 65.7 内存数据库（In-Memory Databases）\n\n本章概述的示例涉及 `SQLite`\
  \ 数据库，它以数据库文件的形式存在于 Android 设备的持久性存储中。这确保了即使在应用进程终止后数据依然存在。\n\n`Room` 持久化库也支持内存数据库。这些数据库完全留在内存中，并在应用终止时丢失。与内存数据库交互所需的唯一更改是调用\
  \ `Room Database` 类的 `Room.inMemoryDatabaseBuilder()` 方法，而不是 `Room.databaseBuilder()`。下面的代码显示了方法调用之间的区别（注意内存数据库不需要数据库名称）：\n\
  \n```java\n// 创建基于文件存储的数据库\nINSTANCE = Room.databaseBuilder(context.getApplicationContext(),\n\
  \                    CustomerRoomDatabase.class, \"customer_database\")\n      \
  \              .build();\n\n// 创建一个内存数据库\nINSTANCE = Room.inMemoryDatabaseBuilder(context.getApplicationContext(),\n\
  \                    CustomerRoomDatabase.class)\n                    .build();\n\
  ```\n\n## 65.8 数据库检查器（Database Inspector）\n\nAndroid Studio 包含一个 `Database Inspector`\
  \ 工具窗口，它允许查看、搜索和修改与运行应用关联的 `Room` 数据库，如图图 65-3 所示：\n\n[图 65-3]\n\n## 65.9 总结\n\n\
  `Room` 持久化库与 `Android Components` 一起打包，作为 `SQLite` 之上的抽象层。本章介绍了与 Room 交互的不同元素：实体、仓库、数据访问对象。在涵盖了\
  \ `Room` 的基础知识后，下一步是为数据库示例创建用户界面，这将在下一章中完成。\n\n## 66. Android TableLayout 教程\n\n\
  在开始下一章的工作时，原计划是使其包含使用 `TableLayout` 设计用户界面的步骤，并花时间介绍表格布局的基础知识。\n\n### 66.1 TableLayout\
  \ 和 TableRow 视图\n\n`TableLayout` 容器视图的目的是允许界面元素以表格格式组织在屏幕上。`TableLayout` 中的每一行由\
  \ `TableRow` 占据，单元 又划分为单元格，每个单元格包含一个子元素（该元素本身可以是包含多个子元素的容器）。\n\n表格中的列数由列数最多的行决定，默认情况下，每列的宽度由该列中最宽的单元格定义。列可以配置为可收缩或可伸展（或两者都有），以便它们相对于父容器更改大小。此外，单个单元格可以配置为跨越多个列。\n\
  \n考虑图 66-1 所示的用户界面布局：\n\n[图 66-1]\n\n从布局的视觉外观来看，很难识别用于设计界面的 `TableLayout` 结构。然而，图\
  \ 66-2 所示的层级树使得结构变得稍微更容易理解：\n\n[图 66-2]\n\n## 66.2 创建 Room 数据库项目\n\n从欢迎屏幕选择 `New\
  \ Project` 菜单选项，并在生成的项目对话框中，点击 `Next` 按钮之前选择 `Fragment + ViewModel` 模板。\n\n\n\n\n\
  \n在 `Name` 字段中输入 `RoomDemo`，并指定 `com.ebookfrenzy.roomdemo` 为包名。在点击 `Finish` 按钮之前，将\
  \ `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将 `Language` 菜单更改为 `Java`。\n\
  \n## 66.3 转换为 LinearLayout\n\n在 `Project` 工具窗口（`app -> res -> layout`）中找到 `main_fragment.xml`\
  \ 文件，并双击它将其加载到 `Layout Editor` 工具中。默认情况下，Android Studio 使用 `ConstraintLayout` 作为用户界面的根布局元素。这需要被转换为垂直方向的\
  \ `LinearLayout`。在 `Design` 模式下的 `Layout Editor` 工具中，在 `Component tree`（组件树）中找到主\
  \ `ConstraintLayout` 组件，右键点击它以显示如图 66-3 所示的菜单，然后选择 `Convert view...` 选项：\n\n![](img/as_4.1_room_demo_convert_view.jpg)\n\
  \n图 66-3\n\n在生成的对话框（图 66-4）中，在点击 `Apply` 按钮之前，选择转换为 `LinearLayout` 的选项：\n\n![](img/as_4.1_room_demo_convert_linear.jpg)\n\
  \n图 66-4\n\n默认情况下，布局编辑器会将 `ConstraintLayout` 转换为水平方向的 `LinearLayout`，因此在 `Component\
  \ Tree` 窗口中选择布局组件，参考 `Attributes` 工具窗口并将 `orientation` 属性更改为 `vertical`（垂直）：\n\n\
  ![](img/as_3.4_linearlayout_change_orientation.jpg)\n\n图 66-5\n\n完成后，选择并删除布局中的默认\
  \ `TextView` 小部件。\n\n## 66.4 向用户界面添加 TableLayout\n\n继续留在 `main_fragment.xml` 文件中，参考\
  \ `Palette`（调色板）中的 `Layouts` 类别，拖放一个 `TableLayout` 视图，使其位于 `LinearLayout` 画布区域的顶部。\n\
  \n一旦完成这些初始步骤，布局的 `Component Tree` 应该类似于图 66-6 所示。\n\n![](img/as3.2_tablelayout_in_tree.jpg)\n\
