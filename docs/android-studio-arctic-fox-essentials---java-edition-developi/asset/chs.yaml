- "# Android Studio Arctic Fox 核心指南 - Java 版：使用 Android Studio 2020.31 和 Java 开发 Android\
  \ 应用\n\n\n\n![](img/java_arctic_fox_front_cover_large.png)\n\n\n\n\n\n\n\n\n\n\n\
  \n## 8.13 总结\n\nAndroid Studio 编辑器尽力减少编写代码所需的输入量，并使代码更容易阅读和导航。在本章中，我们涵盖了许多关键编辑器功能，包括代码补全、代码生成、编辑器拆分、代码折叠、重新格式化、文档查询和实时模板。\n\
  \n# 9 Android 架构概述\n\n到目前为止，本书已经采取步骤建立了一个适用于使用 Android Studio 开发 Android 应用的环境。通过创建\
  \ Android Studio 应用项目，也迈出了应用开发过程的第一步。\n\n然而，在进一步研究 Android 应用开发的实际问题之前，理解 Android\
  \ SDK 以及通用的 Android 开发中一些更抽象的概念是非常重要的。现在清晰地理解这些概念将为构建进一步知识提供坚实的基础。\n\n本章从 Android\
  \ 架构的概述开始，并在本书的接几章中继续，目标是提供 Android 开发基础的详细概述。\n\n## 9.1 Android 软件栈\n\nAndroid\
  \ 结构为软件栈的形式，由应用程序、操作系统、运行时环境、中间件、服务和库组成。这种架构或许可以通过 图 9-1 所示的形式进行视觉化表示。栈的每一层以及每层中对应的元素都紧密集成并经过仔细调整，以为移动设备提供最佳的应用开发和执行环境。本章的其余部分将逐步介绍\
  \ Android 栈的不同层，从底部的 `Linux Kernel` 开始。\n\n![](img/Image2438.jpg)\n\n图 9-1\n\n##\
  \ 9.2 Linux 内核\n\n`Linux Kernel` 位于 Android 软件栈的底部，在设备硬件和 Android 软件栈上层之间提供了抽象层。基于\
  \ Linux 版本 `2.6`，内核提供了抢式多任务处理、底层核心系统服务（如内存、进程和电源管理），以及为设备显示、WiFi 和音频硬件提供的网络栈和设备程序。\n\
  \n原始 Linux 内核由 Linus Torvalds 于 1991 年开发，并与 Richard Stallman 在自由软件基金开发的一系列工具、实用程序和编译器相结合，创建名为\
  \ `GNU/Linux` 的完整操作系统。各种 Linux 发行版都是基于这些基础衍生而来的，如 `Ubuntu` 和 `Red Hat Enterprise\
  \ Linux`。\n\n但重要的是，Android 仅使用 `Linux kernel`。尽管如此，值得注意的是，`Linux kernel` 最初是为台式机和服务器形式的传统计算机设计的。事实上，Linux\
  \ 现在最广泛地部署在任务关键型企业服务器环境中。我们在 Android 软件栈的核心发现这种软件，既证明了今天移动设备的强大，也证明了 `Linux kernel`\
  \ 的效率和性能。\n\n## 9.3 Android 运行时 (ART) – ART\n\n当在 Android Studio 中构建 Android 应用时，它会被编译成一种中间字节码格式（称为\
  \ `DEX` 格式）。当随后将其加载到设备上时，Android Runtime (`ART`) 使用一种称为提前编译（Ahead-of-Time, `AOT`）的过程将字节码翻译为设备处理器所需的原生指令。这种格式被称为可执行和链接格式\
  \ (`ELF`)。\n\n每次启动应用时，都会运行 `ELF` 可执行版本，从而获得更快的应用性能和更优的电池寿命能力。\n\n这与旧版 Android 实现使用的即时编译（Just-in-Time,\
  \ `JIT`）方法形成对比，在旧方法中，字节码每次启动应用时都在虚拟机 (`VM`) 内进行翻译。\n\n## 9.4 Android 库\n\n除了一组标准的\
  \ Java 开发库（提供字符串处理、网络连接和文件操作等通用任务的支持）外，Android 开发环境还包含了 `Android Libraries`。这些是特定于\
  \ Android 开发的 Java 库。该类别的库示例包括应用框架库，以及便于用户界面构建、图形绘制和数据库访问的库。\n\nAndroid 开发者可用的某些核心\
  \ Android 库摘要如下：\n\n- `android.app` – 提供对应用模型的访问，是所有 Android 应用的基础。\n- `android.content`\
  \ – 促进应用程序和应用组件之间的内容访问、发布和消息传递。\n- `android.database` – 用于访问内容提供者发布的数据并包含 SQLite\
  \ 数据库管理类。\n- `android.graphics` – 一个底层 2D 图形绘制 API，包括颜色、点、过滤器、矩形和画布。\n- `android.hardware`\
  \ – 提供了一个访问加速度计和光传感器等硬件的 API。\n- `android.opengl` – OpenGL ES 3D 图形渲染 API 的 Java\
  \ 接口。\n\n\n\n\n\n- `android.os` – 为应用程序提供对标准操作系统服务的访问，包括消息、系统服务和进程间通信。\n- `android.media`\
  \ – 提供用于音频和视频播放的类。\n- `android.net` – 一组提供网络堆栈访问的 API。包括 `android.net.wifi`，它提供了对设备无线栈的访问。\n\
  - `android.print` – 包含一组类，允许从 Android 应用程序将内容发送到已配置的打印机。\n- `android.provider` –\
  \ 一组便利类，提供对标准 Android 内容提供者数据库的访问，例如由日历和联系人应用程序维护的数据库。\n- `android.text` – 用于在设备显示器上渲染和操作文本。\n\
  - `android.util` – 一组工具类，用于执行字符串和数字转换、XML 处理以及日期时间操作等任务。\n- `android.view` – 应用程序用户界面的基础构建块。\n\
  - `android.widget` - 丰富的预构建用户界面组件集合，如按钮、标签、列表视图、布局管理器、单选按钮等。\n- `android.webkit`\
  \ – 一组旨在允许在应用程序中构建网络浏览功能的类。\n\n在涵盖了 Android 运行时基于 Java 的库之后，现在是将注意力转向 Android 软件栈这一层包含的基于\
  \ C/C++ 的库了。\n\n### 9.4.1 C/C++ 库\n\n前一节概述的 Android 运行时核心库是基于 Java 的，为编写 Android\
  \ 应用程序的开发者提供了主要的 API。然而，需要注意的是，核心库并没有执行许多实际工作，事实上它们本质上是基于 C/C++ 库的 Java “包装器”（wrappers）。例如，在调用\
  \ `android.opengl` 库以便在设备显示器上绘制 3D 图形时，该库最终会调用 `OpenGL ES` C++ 库，而该库又与底层的 Linux\
  \ 内核协作执行绘图任务。\n\n引入 C/C++ 库是为了满足广泛且化的功能，包括 2D 和 3D 图形绘制、安全套接层 (SSL) 通信、SQLite 数据库管理、音频视频播放、位图和矢量字体渲染、显示子系统和图形层管理以及标准\
  \ C 系统库 (`libc`) 的实现。\n\n在实践中，典型的 Android 应用程序开发者将仅通过基于 Java 的 Android 核心库 API 访问这些库。如果需要直接访问这些库，可以使用\
  \ Android Native 开发包 (NDK) 实现，其目的是通过 Java Native Interface (JNI) 从 Java 代码中调用非 Java\
  \ 或 Kotlin 编程语言（如 C 和 C++）的原生方法。\n\n## 9.5 应用程序框架\n\n应用程序框架是一组服务，共同构成了 Android 应用程序运行和管理的环境。该框架实现了这样一个概念：Android\
  \ 应用程序是由可重用、可交换和可替换的组件构建的。这一概念进一步，应用程序还可以发布其功能以及任何相关数据，以便其他应用程序发现并重用它们。\n\nAndroid\
  \ 框架包含以下关键服务：\n\n- Activity Manager（活动管理器）– 控制应用程序周期的所有方面和活动栈。\n- Content Providers（内容提供者）–\
  \ 允许应用程序发布与其他应用程序共享数据。\n- Resource Manager（ResourceManager）– 提供对非代码嵌入资源的访问，如字符串、颜色设置和用户界面布局。\n\
  - Notifications Manager（通知管理器）– 允许应用程序向用户显示警告和通知。\n- View System（视图系统）– 用于创建应用程序用户界面的扩展视图集合。\n\
  - Package Manager（包管理器）– 应用程序获取设备上当前安装的其它应用程序信息的系统。\n- Telephony Manager（电话管理器）–\
  \ 向应用程序提供有关设备上可用电话服务的信息，如状态和订阅者信息。\n- Location Manager（位置管理器）– 提供对位置服务的访问，允许应用程序接收位置变更的更新。\n\
  \n## 9.6 应用程序\n\n位于 Android 软件栈顶端的是应用程序。它们由由特定 Android 实现提供的原生应用程序（例如网络浏览器和电子邮件应用程序）以及用户在购买设备后安装的第三方应用程序组成。\n\
  \n## 9.7 总结\n\n良好的 Android 开发知识基础需要理解 Android 的整体架构。Android 以软件栈架构的形式实现，由 Linux\
  \ 内核、运行时环境及相应的库、应用程序框架和一组应用程序组成。应用程序主要用 Java 或 Kotlin 编写，并在 Android Studio 构建环境中编译为字节码格式。当应用程序事后安装在设备上时，这些字节码将由\
  \ Android 运行时 (ART) 编译为 CPU 使用的原生格式。Android 架构的关键目标是性能和效率，既体现在应用程序执行中，也体现在应用程序设计的重用实现中。\n\
  \n# 10 Android 剖析\n\n无论你之前的编程经验如何（无论是基于 Windows、macOS、Linux 甚至是 iOS），Android 开发可能与你以前遇到过的任何东西都非常不同。\n\
  \n因此，本章的目的是提供对 Android 应用程序架构背后高级概念的理解。通过这种方式我们将详细探讨用于构建应用程序的各种组件，以及允许这些组件协作以创建一个协作应用程序的机制。\n\
  \n## 10.1 Android Activity（活动）\n\n熟悉 Java、Kotlin、C++ 或 C# 等面向对象编程语言的人将熟悉将应用程序功能元素封装在类中的概念，然后将这些类实例化为对象并进行操作以创建应用程序。由于\
  \ Android 应用程序是用 Java 和 Kotlin 编写的，情况仍然如此。然而，Android 将可重用组件的概念提升到了更高的水平。\n\nAndroid\
  \ 应用程序通过汇集一个或多个称为 Activity 的组件来创建。Activity 是单个、独立的应用程序功能模块，通常直接对应于单个用户界面屏幕及其相应的功能。例如，一个预约应用程序可能会有一个显示当天预约的活动屏幕。该应用程序可能还会使用第二个\
  \ Activity，该屏幕由用户输入新预约的屏幕组成。\n\nActivity 设计用于完全可重用和可交换的构建块，可以在不同的应用程序之间共享。例如，一个现有的电子邮件应用程序可能包含一个专门用于编写和发送电子邮件消息的\
  \ Activity。开发者可能正在编写一个同样具有发送电子邮件消息要求的应用程序。开发者无需为新应用程序专门开发电子邮件编写 Activity，而是可以直接使用现有的电子邮件应用程序中的\
  \ Activity。\n\n\n\n\nActivity（活动）是作为 `Activity` 类的子类创建的，并且必须实现为完全独立于应用程序中的其他活动。换句话说，共享的活动不能依赖于在程序流的已知点被调用（因为其他应用程序可能会以意想不到的方式使用该活动），而且一个活动不能直接调用另一个活动的方法或访问其实例数据。相反，这种功能通过\
  \ `Intents`（意图）和 `Content Providers`（内容提供者）来实现。\n\n默认情况下，活动无法向调用它的活动返回结果。如果需要此功能，必须将该活动专门启动为源源的子活动。\n\
  \n## 10.2 Android Fragments（片段）\n\n如上所述，活动通常代表应用内部的单个用户界面屏幕。一种方案是使用单个用户界面布局和一个对应的活动类文件来构建活动。然而，更好的替代方案是将活动拆分为不同的部分。这些部分中的每一个都被称为一个\
  \ `fragment`（片段），每个片段由用户界面布局的一部分和一个匹配的类文件组成（声明为 Android `Fragment` 类的子类）。在这种情况下，活动简单地变成一个容器，可以在其中嵌入一个或多个片段。\n\
  \n事实上，片段为每个用户界面屏幕由单独活动表示提供了一种高效的替代方案。相反，应用可以由单个活动组成，在不同的片段之间切换，每个片段代表一个不同的应用屏幕。\n\
  \n## 10.3 Android Intents（Android 意图）\n\n`Intents` 是一个能够启动另一个活动并实现构成应用程序的活动流的机制。`Intents`\
  \ 由对要执行的操作的描述以及可选的要执行该操作的数据组成。\n\n`Intents` 可以是显式的，即通过通过类名引用活动来请求启动特定活动；也可以是隐式的，即通过说明要执行的操作类型或提供要执行该操作的特定类型的数据。在隐式意图的情况下，Android\
  \ 运行时将使用称为 `Intent Resolution`（意图解析）的过程选择与 `Intent` 指定标准最匹配的活动进行启动。\n\n## 10.4 Broadcast\
  \ Intents（广播意图）\n\n`Intent` 的另一种类型 `Broadcast Intent`（广播意图）是一种系统范围内的意图，发送给所有注册了“感兴趣”的\
  \ `Broadcast Receiver`（广播接收器）的应用程序。例如，Android 系统通常会发送 `Broadcast Intents` 来指示设备状态的变化，例如系统启动完成、外部电源连接到设备或屏幕的开启或关闭。\n\
  \n`Broadcast Intent` 可以是正常的（异步的），因为它在约相同的时间内发送给所有感兴趣的 `Broadcast Receivers`；也可以是有序的，因为它一次发送给一个接收器，接收器对其进行处理，然后要么中止或允许传递给下一个\
  \ `Broadcast Receiver`。\n\n## 10.5 Broadcast Receivers（广播接收器）\n\n`Broadcast Receivers`\
  \ 是应用程序能够响应 `Broadcast Intents` 的机制。`Broadcast Receiver` 必须由应用程序注册，并配置 `Intent Filter`（意图过滤器）以指示其感兴趣的广播类型。当匹配的意图被广播时，无论注册该接收器的应用程序当前是否运行，Android\
  \ 运行时都会调用该接收器。接收器留有 5 秒钟来完成对其要求的任何任务（例如启动 `Service`、更新数据或向用户发出通知），然后返回。`Broadcast\
  \ Receivers` 在后台运行，并且没有用户界面。\n\n## 10.6 Android Services（Android 服务）\n\n`Android\
  \ Services` 是在后台运行且没有用户界面的进程。它们可以从活动、`Broadcast Receivers` 或其他 `Services` 启动并随后进行管理。`Android\
  \ Services` 适用于应用程序需要继续执行任务但不一定需要用户界面对用户可见的情况。虽然 `Services` 缺乏用户界面，但它们仍然可以使用通知（notifications）和吐司（toast，出现在屏幕上但不中断当前可见活动的小通知消息）来通知用户事件，并且能够发出\
  \ `Intents`。\n\nAndroid 运行时赋予 `Services` 的优先级比许多其他进程更高，只有在为了释放资源作为最后手段时，系统才会将其终止。然而，如果运行时确实需要杀死一个\
  \ `Service`，一旦资源再次可用，它将自动重启。`Service` 可以通过声明自己需要在在前台运行来降低被终止的风险。这是通过调用 `startForeground()`\
  \ 实现的。这仅建议用于终止会对用户体验产生不利的情况（例如，如果用户正在收听由 `Service` 流出的音频）。\n\n`Service` 作为实际解决方案的示例情况包括，如之前提到的，当应用程序不再活动时也应继续的音频流传输，或者当股票达到指定价格时需要通知用户的股票市场跟踪应用程序。\n\
  \n## 10.7 Content Providers（内容提供者）\n\n`Content Providers` 实现了一种应用程序之间共享数据的机制。任何应用程序都可以通过实现\
  \ `Content Provider` 为其他应用程序提供访问其底层数据的权限，包括添加、删除和查询数据的能力（受权限限制）。对数据的访问通过 `Content\
  \ Provider` 定义的通用资源标识符 (`URI`) 提供。数据可以以文件或整个 `SQLite` 数据库的形式进行共享。\n\n原生 Android\
  \ 应用程序包含许多标准的 `Content Providers`，允许应用程序访问联系人和多媒体文件等数据。Android 系统当前可用的 `Content\
  \ Providers` 可以使用 `Content Resolver` 进行定位。\n\n## 10.8 The Application Manifest（应用清单）\n\
  \n将组成应用程序的各种元素整合的胶水是 `Application Manifest`（应用清单）文件。在这个基于 XML 的文件中，概述了构成完整应用程序的活动、服务、广播接收器、数据提供和权限。\n\
  \n## 10.9 Application Resources（应用资源）\n\n除了清单文件和包含字节码的 `Dex` 文件外，Android 应用包通常包含一组资源文件。这些文件包含了用户界面中字符串、图像、字体和颜色，以及用户界面布局的\
  \ XML 表示。默认情况下，这些文件存储在应用程序项目层次结构的 `/res` 子目录中。\n\n## 10.10 Application Context（应用上下文）\n\
  \n当应用程序编译时，会创建一个名为 `R` 的类，其中包含对应用资源的引用。应用清单文件和这些资源结合创建了所谓的 `Application Context`（应用上下文）。该上下文由\
  \ Android `Context` 类表示，可以在应用程序代码中使用并在运行时访问应用资源。此外，可以在应用程序上下文中调用广泛范围的方法，以获取信息并在运行时更改应用程序的环境。\n\
  \n## 10.11 Summary（总结）\n\n可以通过组合许多不同的元素来创建一个 Android 应用程序。在本章中，我们对活动、片段、服务、意图和广播接收器进行了高层次概述，并对清单文件和应用资源进行了概述。\n\
  \n\n\n通过创建以活动（activities）和意图（intents）形式存在的单个独立功能模块，可以促进最大的重用性和互操作性；而应用程序之间的数据共享则通过实现内容提供者（content\
  \ providers）来实现。\n\n活动专注于用户与应用程序交互的区域（活动本质等同于单个用户界面屏幕，通常由一个或多个片段 fragments 组成），而后台处理通常由`Services`和广播接收器`Broadcast\
  \ Receivers`处理。\n\n构成应用程序的组件在清单文件中 Android 运行时系统进行了概述，该文件结合应用程序的资源共同代表了应用程序的上下文（context）。\n\
  \n本章涵盖了许多对普通开发者来说可能比较全新的内容。不过，请放心，在后续章节中将对这些概念进行深入的探索和实际应用，以确保为构建自己的应用程序打下坚实的知识基础。\n\
  \n# 11. Android View Binding 概述\n\n开发 Android 应用的一个重要部分涉及代码与构成用户界面布局的视图之间的交互。本章将介绍在代码中访问布局视图的可用选项，特别强调一种名为视图绑定（view\
  \ binding）的选项。在介绍视图绑定的基础知识后，本章将概述将 AndroidSample 项目转换为使用这种方法所需的更改。\n\n## 11.1 通过\
  \ ID 查找视图\n\n正如标题为“Android 剖析”的章节概述的，构成应用程序的所有资源都被编译成一个名为`R`的类。在这些资源中包含了定义布局的资源。在`R`类中有一个名为`layout`的子类，它包含了布局资源，包括构成用户界面的视图。大多数应用程序都需要实现代码与这些视图之间的交互，例如在读取输入到`EditText`视图中的值或更改在`TextView`上显示的内容时。\n\
  \n在 Android Studio 3.6 引入之前，从应用代码内部访问视图的唯一选项是编写代码通过名为`findViewById()`的方法根据其 id 手动查找视图。例如：\n\
  \n```\nTextView exampleView = findViewById(R.id.exampleView);\n```\n\n获取引用后，就可以访问视图的属性。例如：\n\
  \n```\nexampleView.setText(\"Hello\");\n```\n\n虽然通过 ID 查找视图仍然是一个可行选项，但它具有一些局限性，`findViewById()`最大的缺点是可能会获取到布局中尚未创建的视图的引用，导致在尝试访问视图属性时出现空指针异常。\n\
  \n自 Android Studio 3.6 以来，已经有了视图绑定形式的另一种从应用代码访问视图的替代方法。\n\n## 11.2 视图绑定\n\n当应用模块中启用视图绑定时，Android\
  \ Studio 会自动为模块内的每个布局文件生成一个绑定类（binding class）。使用此绑定类，可以在代码内部访问布局视图，而无需使用`findViewById()`。\n\
  \nAndroid Studio 生成的绑定类的名称基于布局文件名，转换为所谓的“驼峰命名”（camel case），并在末尾附加“Binding”单词。例如，对于`activity_main.xml`文件，绑定类将命名为`ActivityMainBinding`。\n\
  \nAndroid Studio Arctic Fox 在项目模板中使用视图绑定方面并不一致。例如，我们在创建 AndroidSample 项目时使用的 Empty\
  \ Activity 模板并没有使用视图绑定。另一方面，Basic Activity 模板是使用视图绑定实现的。如果你使用没有使用视图绑定的模板，那么了解如何将该项目迁移出合成属性（synthetic\
  \ properties）是非常重要的。\n\n## 11.3 转换 AndroidSample 项目\n\n在本章的剩余部分中，我们将通过将 AndroidSample\
  \ 项目转换为使用视图绑定而不是使用`findViewById()`来练习迁移到视图绑定。\n\n从启动 Android Studio 并打开标题为“在 Android\
  \ Studio 中示例 Android 应用”的章节中创建的 AndroidSample 项目开始。\n\n## 11.4 启用视图绑定\n\n使用视图绑定，必须对需要视图绑定的每个模块的`build.gradle`文件进行更改。对于\
  \ AndroidSample 项目，这将需要对`Gradle Scripts -> build.gradle (Module: AndroidSample.app)`文件进行细微更改。将此文件加载到编辑器中，找到`android`部分并添加以下项以启用`viewBinding`属性：\n\
  \n```gradle\nplugins {\n    id 'com.android.application'\n}\n\nandroid {\n    buildFeatures\
  \ {\n        viewBinding true\n    }\n}\n```\n\n完成此更改后，点击编辑器面板顶部的`Sync Now`链接，然后使用`Build`菜单清理并重新构建项目，以确保生成了绑定类。下一步是在代码中使用绑定类。\n\
  \n## 11.5 使用视图绑定\n\n此过程的第一步是“膨胀”（inflate）视图绑定类，以便我们可以访问布局中的根视图（root view）。该根视图将随后用作布局的内容视图（content\
  \ view）。\n\n执行这些任务的逻辑位置是在与布局相关的活动的`onCreate()`方法中。一个典型的`onCreate()`方法如下：\n\n```java\n\
  @Override\nprotected void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    setContentView(R.layout.activity_main);\n}\n```\n\n要切换到使用视图绑定，需要导入绑定类并按如下所示修改类。注意，由于布局文件名为`activity_main.xml`，我们可以推断\
  \ Android Studio 生成的绑定类将是`ActivityMainBinding`。注意如果在创建项目时使用了`example`以外的域，则下面的导入语句需要更改以反映这一点：\n\
  \n```java\nimport android.widget.EditText;\nimport android.widget.TextView;\nimport\
  \ com.example.androidsample.databinding.ActivityMainBinding;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private ActivityMainBinding binding;\n\n    @Override\n\
  \    protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.activity_main);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n    }\n\
  ```\n\n现在我们有了绑定的引用，可以按如下方式访问视图：\n\n```java\npublic void convertCurrency(View view)\
  \ {\n    EditText dollarText = findViewById(R.id.dollarText);\n    TextView textView\
  \ = findViewById(R.id.textView);\n    if (!binding.dollarText.getText().toString().equals(\"\
  \")) {\n        Float dollarValue = Float.valueOf(binding.dollarText.getText().toString());\n\
  \        Float euroValue = dollarValue * 0.85F;\n        binding.textView.setText(euroValue.toString());\n\
  \    } else {\n        binding.textView.setText(R.string.no_value_string);\n   \
  \ }\n}\n```\n\n编译并运行应用程序，验证货币转换过程是否像以前一样正常工作。\n\n## 11.6 选择选项\n\n尽管 Empty Activity\
  \ 项目模板中没有采用视图绑定，但 Google 强烈建议尽可能使用视图绑定。事实上，对合成属性的支持已被弃用并可能会在 Android Studio 的未来版本中删除。因此，在开发自己的项目时，应该使用视图绑定。\n\
  \n## 11.7 书中示例的视图绑定\n\n\n\n\n本书中任何依赖未实现视图绑定（view binding）项目模板的章节将首先进行迁移。然而，为了避免在每次需要迁移时都重复步骤，这些章节将引导你回到此处以重温记忆（不用担心，过几个章节后，必要的更改将变成你的本能）。为了帮助这一过程，接下来的部分更简要地总结了迁移步骤。\n\
  \n## 11.8 将项目迁移到视图绑定\n\n将项目模块转换为使用视图绑定的过程涉及以下步骤：\n\n1.  编辑项目工具窗口中列出的 `Gradle Scripts`\
  \ -> `build.gradle` (Module: `<project name>.app`) 模块级 `Gradle` 构建脚本文件，其中 `<project\
  \ name>` 是项目的名称（例如 `AndroidSample`）。\n\n2.  找到文件的 `android` 部分，并添加如下条目以启用 `viewBinding`\
  \ 属性：\n\n```gradle\nandroid {\n    buildFeatures {\n        viewBinding true\n \
  \   }\n}\n```\n\n3.  点击编辑器顶部的 `Sync Now` 链接以这些新的构建设置重新同步项目。\n\n4.  编辑 `MainActivity.java`\
  \ 文件并将其修改为如下（其中 `<reverse domain>` 代表创建项目时使用的域名，`<project name>` 被替换为项目的小写名称，例如\
  \ `androidsample`），`<binding name>` 是对应布局资源文件的绑定名称（例如，`activity_main.xml` 的绑定为 `ActivityMainBinding`）。\n\
  \n```java\nimport android.view.View;\nimport android.<reverse domain>.<project name>.databinding.<binding\
  \ name>;\n\npublic class MainActivity extends AppCompatActivity {\n    private <binding\
  \ name> binding;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        binding = <binding name>.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n    }\n\
  }\n```\n\n5.  通过绑定对象的属性（名称）访问视图。\n\n## 11.9 总结\n\n在 Android Studio 3.6 引入之前，从应用代码内部访问布局视图需要使用\
  \ `findViewById()` 方法。现在有了视图绑定的形式的替代方案。视图绑定由 Android Studio 为每个 XML 布局文件自动生成的类组成。这些类包含对对应布局中每个视图的绑定，提供了比\
  \ `findViewById()` 方法更安全的选项。然而，从 Android Studio Arctic Fox 版本开始，某些项目模板默认未启用视图绑定，需要额外的步骤来手动启用并配置每个项目模块中的支持。\n\
  \n# 12 理解 Android 应用和 Activity 生命周期\n\n在早的章节中，我们已经学习了 Android 应用运行在进程中，并且它们由以活动、服务和广播接收器形式存在的多个组件组成。本章的目标是通过查看\
  \ Android 运行时系统内应用程序和 Activity 的生命周期来扩展这些知识。\n\n无论现在的移动设备与以前的桌面系统相比拥有多少内存和计算能力而备受推崇，但请记住，根据现代桌面和笔记本系统的标准，这些设备仍然被认为是“资源受限”的，特别是在内存方面。因此，Android\
  \ 系统的一项核心职责是确保有效管理这些有限资源，并确保操作系统和运行其上的应用程序始终对用户保持响应。为了实现这一点，Android 对运行应用程序的进程以及组成应用程序的各个组件的生命周期和状态拥有完全控制权。\n\
  \n因此，开发 Android 应用的一个重要因素是理解 Android 的应用程序和 Activity 生命周期管理模型，以及应用程序在执行生命周期内可能对其施加的状态变化做出反应的方式。\n\
  \n## 12.1 Android 应用与资源管理\n\n每个运行的 Android 应用都被操作系统视为一个独立的进程。如果系统识别到设备上的资源达到容量，它将采取措施终止进程以释放内存。\n\
  \n在决定终止哪个进程以释放内存时，系统会同时考虑所有当前运行进程的优先级和状态，结合这些因素创建 Google 所谓的“重要性层次结构”（importance\
  \ hierarchy）。然后从最低优先级开始终止进程，沿层次结构向上移动，直到释放了足够的资源供系统运行。\n\n## 12.2 Android 进程状态\n\
  \n进程托管应用程序，而应用程序由组件组成。在 Android 系统中，进程的当前状态由其托管的应用中排名最高的活动组件定义。如图 12-1 所示，进程在任何时候都可以处于以下五种状态之一：\n\
  \n![android_process_priorities.png](img/Image24381.jpg)\n\n图 12-1\n\n### 12.2.1\
  \ 前台进程\n\n这些进程被分配了最高级别的优先级。在任何时刻，活跃的前台进程可能只有一个或两个，而且这些通常是系统最后终止的进程。进程必须满足以下一条或多个标准才能获得前台状态：\n\
  \n*   托管一个用户当前正在交互的 Activity。\n*   托管一个与用户正在交互的 Activity 连接的 Service。\n*   托管一个通过调用\
  \ `startForeground()` 表明终止将破坏用户体验的 Service。\n*   托管一个执行其 `onCreate()`、`onResume()`\
  \ 或 `onStart()` 回调的 Service。\n*   托管一个正在执行其 `onReceive()` 方法的广播接收器。\n\n### 12.2.2\
  \ 可见进程\n\n包含对用户可见但不是用户正在交互的 Activity 的进程被归类为“可见进程”。这通常发生在进程中的某个 Activity 对用户可见，但另一个\
  \ Activity（如部分屏幕或对话框）处于前台时。如果一个进程托管一个绑定到可见或前台 Activity 的 Service，则该进程也符合可见状态。\n\n\
  ### 12.2.3 服务进程\n\n包含已启动并正在执行的 Service 的进程。\n\n### 12.2.4 后台进程\n\n包含一个或多个当前对用户不可见的\
  \ Activity，且未托管符合服务进程状态的 Service。在需要为高优先级进程释放额外内存时，属于此类别的进程面临极高的被终止风险。Android 维护一个动态后台进程列表，按时间顺序终止进程，因此最近未处于前台的进程首先被杀死。\n\
  \n### 12.2.5 空进程\n\n空进程不再包含任何活跃的应用，被保留在内存中以准备好托管新启动的应用程序。这有点比巴士在预期乘客到达时保持门开启并引擎运转。显然，此类进程被认为优先级最低，是释放资源时最先杀死的。\n\
  \n## 12.3 进程间依赖\n\n\n\n\n\n关于确定最高优先级进程的情况比前节描述的要稍微复杂，其根本原因是进程之间往往存在相互依赖依赖关系。因此，在确定进程的优先级时，Android\
  \ 系统还会考虑该进程是否以某种方式为另一个高优先进程提供服务（例如，作为前台进程的内容提供者的服务进程）。作为一个基本规则，Android 文档指出，进程的排名永远不会低于它当前正在服务的另一个进程。\n\
  \n## 12.4 Activity 生命周期\n\n正如我们之前所确定的，Android 进程的状态在很大程度上取决于其所托管应用程序的 Activity 和组件的状态。因此，理解这些\
  \ Activity 在应用程序的执行生命周期内转换不同的状态至关重要。Activity 的当前状态部分取决于它在所谓的 `Activity Stack`（Activity\
  \ 栈）中的位置。\n\n## 12.5 Activity 栈\n\n对于在 Android 设备上运行的每个应用程序，运行时系统都维护着一个 `Activity\
  \ Stack`。当应用程序启动时，第一个启动的应用程序 Activity 被放入栈中。当启动第二个 Activity 时，它被放置在栈顶，而之前的 Activity\
  \ 则被向下推。栈顶的 Activity 被称为活跃（或运行中）Activity。当活跃 Activity 退出时，它会被运行时系统从栈中弹出，栈中紧邻其下方的\
  \ Activity 变为当前活跃 Activity。例如，栈顶的 Activity 可能仅仅是因为它负责的任务已完成而退出。或者，用户可能选择了屏幕上的“返回”按钮以返回上一个\
  \ Activity，导致当前 Activity 被运行时系统从栈中弹出并销毁。Android `Activity Stack` 的视觉化表示如图图 12-2\
  \ 所示。\n\n如图所示，新的 Activity 在启动时会被推入栈顶。当前活跃 Activity 位于栈顶，直到它被新的 Activity 推入栈下方，或者在它退出或用户导航到上一个\
  \ Activity 时从栈中弹出。在资源受限的情况下，运行时将杀死 Activity，从栈底的 Activity 开始。\n\n`Activity Stack`\
  \ 就是编程术语中所谓的“后进先出”（LIFO）栈，因为最后一个推入栈的项是第一个弹出的项。\n\n![android_activity_lifecycle_diagram.png](img/Image2447.jpg)\n\
  \n图 12-2\n\n## 12.6 Activity 状态\n\n在应用程序的执行过程中，Activity 可以处于多种不同状态之一：\n\n*   **活跃\
  \ / 运行 (Active / Running)** – Activity 位于 `Activity Stack` 栈顶，是设备屏幕上可见的前台任务，拥有焦点并且正在与用户交互。在资源短缺的情况下，这种\
  \ Activity 最不容易被终止。\n*   **暂停 (Paused)** – Activity 对用户可见，但目前没有焦点（通常是因为该 Activity\
  \ 被当前活跃 Activity 部分遮挡）。暂停的 Activity 保留在内存中，保持连接到窗口管理器，保留所有状态信息，并在移动到 `Activity Stack`\
  \ 栈顶时可以快速恢复活跃状态。\n*   **停止 (Stopped)** – Activity 目前对用户不可（换句话说，它在设备显示上被其他 Activity\
  \ 完全遮挡）。与暂停的 Activity 一样，它保留所有状态和成员信息，但在低内存情况下被终止的风险更高。\n*   **杀死 (Killed)** – Activity\
  \ 已被运行时系统终止以释放内存，不再存在于 `Activity Stack` 中。如果应用程序需要，必须重启此类 Activity。\n\n## 12.7 配置更改\n\
  \n到本章为止，我们已经了导致 Android Activity 状态改变的两种原因，即 Activity 在前台和后台之间的移动，以及运行时系统为了释放内存而对\
  \ Activity 进行终止。事实上，还有第三种情况会导致 Activity 的状态发生剧变，这涉及到设备配置的更改。\n\n默认情况下，任何影响 Activity\
  \ 外观的配置更改（例如在竖屏和横屏之间旋转设备方向，或更改系统字体设置）都会导致 Activity 被销毁并重建。这背后的逻辑是此类更改会影响用户界面布局等资源，而简单地销毁并重建受影响的\
  \ Activity 是 Activity 响应配置更改的最快方法。不过，也可以配置 Activity，使其在响应特定的配置更改时不被系统重启。\n\n## 12.8\
  \ 处理状态更改\n\n即使没有其他，从本章也应该很清楚，应用程序以及（根据定义）其中包含的组件在其生命周期内将转换过许多状态。尤为重要的一点是，这些状态更改（包括完全终止）是\
  \ Android 运行时根据用户操作和设备上资源的可用性强加给应用程序的。\n\n但在实践中，这些状态更改并非完全在没有通知的情况下强加的，在大多数情况下，应用程序会收到运行时系统的更改通知，并获得相应做出反应的机会。这通常涉及保存或恢复内部数据结构和用户界面状态，从而允许用户在应用程序之间无缝切换，并提供至少多个并发运行应用程序的假象。\n\
  \nAndroid 提供了两种方法处理应用内对象生命周期状态的变化。一种方法涉及响应操作系统的状态更改方法调用，将在下一章处理 Android Activity\
  \ 状态更改中详细介绍。\n\n另一种方法（也是 Google 推荐的方法）涉及 Jetpack Android Architecture 组件包含的生命周期类，这些类在使用\
  \ Jetpack 构建现代 Android 架构中介绍，并在使用 Android 生命周期感知组件章节中进行更详细的解释。\n\n\n\n\n\n本章的核心信息是，应用程序在整个执行生命周期内会经历多种状态，并且对其在\
  \ Android 运行时环境中的命运几乎没有多少控制权。那些不直接与用户交互的进程和 Activity 运行运行时系统终止的风险更高。因此，Android 应用开发中的一个要素要素是应用程序具备响应操作系统发送的状态更改通知的能力。\n\
  \n# 13. 处理 Android Activity 状态变化\n\n根据“理解 Android 应用程序和 Activity 生命周期”章节中概述的信息，现在而易见的是，组成应用程序的\
  \ Activity 和 Fragment 在应用程序的整个生命周期内会经历各种不同的状态。从一个状态到另一个状态的转变是由 Android 运行时系统强制的，因此在很大程度上超出了\
  \ Activity 自身的控制。然而，这并不意味着应用无法对这些变化做出反应并采取适当措施。\n\n本章的主要目的是提供 Activity 通知状态变化方式的高级概述，并概述建议保存或恢复状态信息的区域。在涵盖这些信息后，本章将简要触及\
  \ Activity 周期的话题。\n\n## 13.1 新旧生命周期技术\n\n直到最近，有一种标准方法可以在应用中构建生命周期感知。这就是本章涵盖的方法，它涉及在\
  \ Activity 或 Fragment 实例中实现一组方法（每个生命周期状态对应一个），这些方法会在该对象的生命周期状态更改时由操作系统调用。这种方法自 Android\
  \ 操作系统早期以来一直保持未变，虽然在今天仍然是一个可行的选择，但它确实存在一些局限性，将在本章稍后部分进行解释。\n\n随着 Jetpack Android\
  \ 架构组件引入生命周期类，现在有了更好的生命周期处理方法。这种现代的生命周期管理方法（结合 Jetpack 组件和架构指南）将在后面的章节中详细介绍。然而，出于几个原因，理解传统的生命周期方法仍然很重要。首先，作为一名\
  \ Android 开发人员，你无法完全隔离开传统的生命周期方法，并且仍然会使用其中一些。更重要的是，理解处理生命周期的旧方法将为在书中后期开始学习新方法提供良好的知识基础。\n\
  \n## 13.2 Activity 和 Fragment 类\n\n除少数例外外，应用程序中的 Activity 和 Fragment 分别作为 `AppCompatActivity`\
  \ 类和 `Fragment` 类的子类创建。\n\n例如，考虑在在 Android Studio 中创建 Android 示例应用中创建并随后转换为使用视图绑定的\
  \ `AndroidSample` 项目。将此项目加载到 Android Studio 环境中并定位 `MainActivity.java` 文件（位于 `app\
  \ -> java -> com.<your domain>.androidsample`）。找到文件后，双击它将其加载到编辑器中，其内容如下：\n\n```java\n\
  package com.example.androidsample;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  \nimport android.view.View;\n\nimport android.os.Bundle;\n\nimport java.util.Locale;\n\
  \nimport com.example.androidsample.databinding.ActivityMainBinding;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n\n    private ActivityMainBinding binding;\n\
  \n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n    \
  \    super.onCreate(savedInstanceState);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n    }\n\n\
  \    public void convertCurrency(View view) {\n        if (!binding.dollarText.getText().toString().equals(\"\
  \")) {\n            float dollarValue = Float.parseFloat(binding.dollarText.getText().toString());\n\
  \            float euroValue = dollarValue * 0.85F;\n            binding.textView.setText(String.format(Locale.ENGLISH,\"\
  %f\", euroValue));\n        } else {\n            binding.textView.setText(R.string.no_value_string);\n\
  \        }\n    }\n}\n```\n\n当创建项目时，我们指示 Android Studio 同时也创建一个名为 `MainActivity.java`\
  \ 的初始 Activity。如上述代码所示，`MainActivity` 类是 `AppCompatActivity` 类的子类。\n\n查看 `AppCompatActivity`\
  \ 类的参考文档可以发现它本身也是 `Activity` 类的子类。可以在 Android Studio 编辑器的层次结构（Hierarchy）工具窗口验证这一点。将\
  \ `MainActivity.java` 文件加载到编辑器中后，点击类声明行中的 `AppCompatActivity` 并按下键盘快捷键 `Ctrl-H`。层次结构工具窗口随后出现，显示所选类的类层次结构。如图\
  \ 13-1 所示，`AppCompatActivity` 显然是派自 `FragmentActivity` 类的，而 `FragmentActivity` 又是\
  \ `Activity` 类的子类：\n\n`Activity` 和 `Fragment` 类包含一系列方法，旨在由 Android 运行时调用，以便在对象状态更改时通知对象。为了本章，我们将这些方法称为生命周期方法。Activity\
  \ 或 Fragment 类只需要重写这些方法并在它们内部实现必要的功能，以便对状态变化做出相应反应。\n\n其中一个方法名为 `onCreate()`，再次回到上面的代码片段，我们可以看到该方法在\
  \ `MainActivity` 类中已经为我们重写并实现。在稍后的章节中，我们将详细探讨 `onCreate()` 以及 `Activity` 和 `Fragment`类的其他相关生命周期方法。\n\
  \n## 13.3 动态状态 vs. 持久化状态\n\n生命周期管理的关键目标是确保在适当的时间保存和恢复 Activity 的状态。当我们在此背景下讨论状态时，指的是\
  \ Activity 内部保存的数据以及用户界面的外观。例如，Activity 可能在内存中维护一个数据模型，该模型需要保存到数据库、内容提供者或文件中。这种状态信息因为在程序的多次调用之间持续，因此被称为持久化状态。\n\
  \n用户界面的外观（例如输入到文本框但尚未提交到应用程序内部数据模型的文本）被称为动态状态，因为它通常只在应用程序的单次调用期间保留（也称为用户界面状态或实例状态）。\n\
  \n理解这两个状态之间的区别是非常重要的，因为它们的保存方式以及保存的原因都不同。保存持久化状态的目的是避免 Activity 在后台运行时被运行时系统杀死而可能导致的数据丢失。另一方面，动态状态的保存和恢复的原因要稍微复杂一些。\n\
  \n\n\n\n例如，假设有一个应用程序包含一个 Activity（我们将其称为 `Activity A`），该 Activity 包含一个文本字段和一些单选按钮。在使用应用程序的过程中，用户在文本字段中输入了一些文本，并从单选按钮中进行了选择。然而，在执行保存这些更改的操作之前，用户切换到了另一个\
  \ Activity，导致 `Activity A` 被推入 `Activity Stack`（Activity 栈）并置于后台。一段时间后，运行时系统确定内存不足，并因此杀死了\
  \ `Activity A` 以释放资源。然而，对于用户来说，`Activity A` 只是被置于后台，并随时准备移动到前台。当返回 `Activity A`\
  \ 到前台时，用户会理所当然地期望输入的文本和单选按钮的选择被保留。然而，在这种情况下，将创建一个 `Activity A` 的新实例，并且如果没有保存和恢复动态状态，之前的用户输入将会丢失。\n\
  \n因此，保存动态状态的主要目的是提供一种在在前台和后台活动之间进行无缝切换的感知，无论活动实际上可能在用户不知情的情况下被杀掉并重启。\n\n在本章的后续章节中，将更清晰地介绍持久化状态和动态状态的保存机制。\n\
  \n### 13.4 Android 生命周期方法\n\n如之前解释的那样，`Activity` 和 `Fragment` 类包含许多生命周期方法，这些方法在实例状态更改时充当事件处理器。Android\
  \ `Activity` 和 `Fragment` 类支持的主要方法如下：\n\n- `onCreate(Bundle savedInstanceState)`\
  \ – 当 Activity 首次创建时调用的方法是执行大多数初始化任务的理想位置。该方法接收一个以 `Bundle` 对象形式传递的参数，该对象可能包含来自\
  \ Activity 上次运行调用的动态状态信息（通常与用户界面的状态有关）。\n- `onRestart()` – 当 Activity 在之前被运行时系统停止后准备重启时调用。\n\
  - `onStart()` – 始终在调用 `onCreate()` 或 `onRestart()` 方法之后立即调用，此方法指示 Activity 它即将对用户可见。如果\
  \ Activity 移动到 Activity 栈的顶端，则在此调用之后将跟调用 `onResume()`；如果它被另一个 Activity 推入栈中，则调用\
  \ `onStop()`。\n- `onResume()` – 表示 Activity 现在处于 Activity 栈的顶端，并且是用户当前与之交互的 Activity。\n\
  - `onPause()` – 表示之前的 Activity 即将成为前台 Activity。根据 Activity 是移回前台还是对用户不可见，此调用之后将调用\
  \ `onResume()` 或 `onStop()` 方法。在此方法中可以采取步骤存储应用尚未保存的持久化状态信息。为了避免 Activity 切换之间的延迟，应避免在此方法中执行将数据存储到数据库或执行网络操作等耗时操作。此方法还应该停止任何动画等\
  \ CPU 密集型任务。\n- `onStop()` – Activity 现在不再对用户可见了。在此调用之后可能出现的两种场景是：如果 Activity 再次移动到前台，则调用\
  \ `onRestart()`；如果 Activity 正被终止，则调用 `onDestroy()`。\n- `onDestroy()` – Activity\
  \ 即将被销毁，可能是因为 Activity 完成了任务并调用了 `finish()` 方法自，也可能是因为运行时为了释放内存或由于配置更改（例如设备方向改变）而终止它。需要注意的是，当\
  \ Activity 终止时并不总是会调用 `onDestroy()`。\n- `onConfigurationChanged()` – 当发生配置更改且该 Activity\
  \ 已指示不重启时调用。该方法接收一个概述了新设备配置的 `Configuration` 对象，然后由 Activity 负责对更改做出反应。\n\n以下生命周期方法仅适用于\
  \ `Fragment` 类：\n\n- `onAttach()` – 当 fragment 分配给一个 Activity 时调用。\n- `onCreateView()`\
  \ – 用于创建并返回 Fragment 的用户界面布局层次结构。\n- `onActivityCreated()` – 与 Fragment 关联的 Activity\
  \ 的 `onCreate()` 方法已执行。\n- `onViewStatusRestored()` – Fragment 保存的视图层次结构已恢复。\n\n\
  除了上述列出的生命周期方法外，还有两个方法专门用于保存和恢复 Activity 的动态状态：\n\n- `onRestoreInstanceState(Bundle\
  \ savedInstanceState)` – 当 Activity 从之前保存了状态的调用中重启时，此方法在调用 `onStart()` 方法后立即调用。与\
  \ `onCreate()` 一一样，此方法传递一个包含之前的状态数据的 `Bundle` 对象。此方法通常用于此类情况：在 `onCreate()` 和 `onStart()`\
  \ 中完成 Activity 初始化后，恢复之前的状态更合逻辑。\n- `onSaveInstanceState(Bundle outState)` – 在 Activity\
  \ 销毁之前调用，以便可以保存当前的动态状态（通常与用户界面有关）。该方法接收一个应将状态保存其中的 `Bundle` 对象，该状态随后会在 Activity\
  \ 重启时传递给 `onCreate()` 和 `onRestoreInstanceState()` 方法。注意，只有在运行时确定需要保存动态状态时，此方法才会被调用。\n\
  \n在重写上述方法时，重要的是，除了 `onRestoreInstanceState()` 和 `onSaveInstanceState()` 之外，方法实现必须包含对父类中对应方法的调用。例如，下面的方法重写了\
  \ `onRestart()` 方法，但也包含了对父类方法的调用：\n\n```\nprotected void onRestart() {\n    super.onRestart();\n\
  \    Log.i(TAG, \"onRestart\");\n}\n```\n\n重写方法时未进行父类调用会导致运行时抛出异常。虽然 `onRestoreInstanceState()`\
  \ 和 `onSaveInstanceState()` 方法中的父类调用是可选的（例如，在实现自定义保存和恢复行为时可以省略），但使用它们有许多好处，该主题将在“保存和恢复\
  \ Android Activity 状态”章节中讨论。\n\n### 13.5 生命周期\n\n最后一个涵盖的主题涉及 Activity 或 Fragment\
  \ 在执行过程中经过的整个生命、可见生命和前台生命的概述：\n\n- 整个生命 (Entire Lifetime) – “整个生命”一词用于描述从首次调用 `onCreate()`\
  \ 方法到对象终止前调用 `onDestroy()` 之间发生的一切。\n- 可见生命 (Visible Lifetime) – 涵盖调用 `onStart()`\
  \ 和 `onStop()` 之间的执行期间。在此期间，Activity 或 Fragment 对用户可见，尽管可能不是用户当前与之交互的对象。\n- 前台生命\
  \ (Foreground Lifetime) – 指在调用 `onResume()` 和 `onPause()` 方法之间的执行期间。\n\n需要注意的是，在整个生命期间，Activity\
  \ 或 Fragment 可能会多次经过前台和可见生命。\n\n生命周期和生命周期方法的概念如图 13-2 所示：\n\n\n\n\n\n![android_activity_lifecycle_methods.png](img/Image2446.jpg)\n\
  \n图 13-2\n\n### 13.6 折叠屏设备与多恢复\n\n如前所述，当一个活动移动到前台并成为用户当前正在交互的活动时，它被认为处于恢复（resumed）状态。在标准设备上，一个应用任何时候只能有一个活动处于恢复状态，而所有其他活动可能处于暂停（paused）或停止（stopped）状态。\n\
  \n长期以来，Android 已经包含了多窗口支持，允许多个活动同时在分屏或自由窗口布局中显示。虽然此功能最初主要用于大屏幕平板设备，但随着折叠屏设备的引入，该功能可能会更加流行。\n\
  \n在运行 Android 10 且启用多窗口支持的设备（大多数折叠屏设备都是如此）上，多个应用活动可能同时处于恢复状态（这种概念被称为多恢复，multi-resume），使得可见的活动即使在另一个活动获取焦点时也能继续运行（例如流流媒体内容或更新视觉数据）。尽管多个活动可以处于恢复状态，但只有其中一个活动会被视为顶层恢复活动（换句话说，就是用户最近交互的活动）。\n\
  \n活动可以通过实现 `onTopResumedActivityChanged()` 回调方法来接收获得或丢失顶层恢复状态的通知。\n\n### 13.7 禁用配置更改重启\n\
  \n如之前概述，活动可以指明在某些配置更改发生时不重新启动。这通过在项目清单文件（manifest file）的 `activity` 元素中添加 `android:configChanges`\
  \ 指令来实现。例如，下面的清单文件片段表明，当发生方向或全设备字体大小配置更改时，不应重启活动：\n\n```xml\n<activity android:name=\"\
  .MainActivity\"\n          android:configChanges=\"orientation|fontScale\"\n   \
  \       android:label=\"@string/app_name\">\n```\n\n### 13.8 生命周期方法的局限性\n\n正如本章开头讨论的，生命周期方法已经使用了多年，直到最近，它们仍然处理活动和片段生命周期状态变化的唯一机制。然而，这种方法存在缺点。\n\
  \n生命周期方法的一个问题是，它们没有为活动或片段提供一种简单的方法在应用执行过程中的任何点查找其当前的生命周期状态。相反，对象需要在内部跟踪状态，或者等待下次生命周期方法的调用。\n\
  \n此外，这些方法没有一种简单的方法让一个对象观察应用内其他对象的生命周期状态变化。这是一个严肃的考虑因素，因为应用中的许多其他对象都可能受到特定活动或片段中生命周期状态变化的影响。\n\
  \n生命周期方法仅适用于 `Fragment` 和 `Activity` 类的子类。因此，无法构建真正感知生命周期（lifecycle aware）的自定义类。\n\
  \n最后，生命周期方法导致大多数生命周期处理代码被写在活动或片段内部，这可能导致复杂且易出错的代码。理想情况下，这部分代码应该位于受状态变化影响的其他类中。例如，一个流媒体视频的应用可能会包含一个专门设计用于管理输入流的类。如果应用需要在主活动停止时暂停流传输，那么执行此操作的代码应该位于流类中，而不是主活动中。\n\
  \n所有这些问题以及更多问题通过使用生命周期感知组件（lifecycle-aware components）得到了解决，该主题将从使用 Jetpack 构建现代\
  \ Android 应用架构 章节开始介绍。\n\n### 13.9 总结\n\n所有活动都派自 `Android Activity` 类，该类反过来包含了许多生命周期方法，这些方法旨在运行时系统在活动状态更改时调用。同样，`Fragment`\
  \ 类也包含许多类似的方法。通过重写这些方法，活动和片段可以对状态变化做出响应，并在必要采取步骤保存并恢复活动以及应用程序当前的状态。生命周期状态可以被认为有两种形式。持久状态（persistent\
  \ state）是指在应用调用之间需要存储的数据（例如存储到文件或数据库）。另一方面，动态状态（dynamic state）涉及用户界面的当前显示。\n\n尽管生命周期方法有很多局限性，可以通过使用生命周期感知组件来避免，但理解这些方法对于充分理解书中后面介绍的生命周期管理新方法至关重要。\n\
  \n在本章中，我们强调了活动可用的生命周期方法，并涵盖了活动生命期的概念。在下一章——通过示例理解 Android 活动状态变化——中，我们将实现一个示例应用，将这些许多理论付诸实践。\n\
  \n# 14 通过示例理解 Android 活动状态变化\n\n之前的章节详细讨论了构成 Android 应用的各种活动的不同状态和生命周期。在本章中，我们将通过创建一个示例应用，将处理活动状态变化的理论付诸实践。该示例应用的目的是提供一个真实的演示，展示活动如何在\
  \ Android 运行时在各种不同的状态之间切换过。在下一章——保存和恢复 Android 活动的状态中，在本章构建的示例项目将得到扩展，以演示动态活动状态的保存和恢复。\n\
  \n### 14.1 创建状态变化示例项目\n\n此练习的第一步是创建一个新项目。首先启动 Android Studio，如有必要，使用 `File -> Close\
  \ Project` 选项关闭任何打开的项目，以便显示欢迎屏幕。\n\n在欢迎屏幕上选择 New Project 选项，并在新项目对话框中选择 `Empty Activity`\
  \ 模板，然后点击 Next 按钮。\n\n在 Name 字段输入 `StateChange`，并将包名指定为 `com.ebookrenzy.statechange`。在点击\
  \ Finish 之前，将 Minimum API 设置为 `API 26: Android 8.0 (Oreo)`，并将 Language 菜单设置为 Java。项目创建完成后，`StateChange`\
  \ 项目应列在 Android Studio 主窗口左侧的 Project 工具窗口中。使用第 11.8 将项目迁移到视图绑定 节概述的步骤将项目转换为使用视图绑定（view\
  \ binding）。\n\n接要执行的操作涉及活动用户界面的设计。该界面的代码存储在名为 `activity_main.xml` 的文件中，该文件应该已经加载到\
  \ Layout Editor 工具中。如果没有加载，请在 Project 工具窗口导航到它，它可以在 `app -> res -> layout` 文件夹中找到。找到后，双击文件将将其加载到\
  \ Android Studio Layout Editor 工具中。\n\n![](img/as_4.2_statechange_layout_editor.jpg)\n\
  \n图 14-1\n\n### 14.2 设计用户界面\n\n\n\n\n\n当用户界面布局加载到 Layout Editor（布局编辑器）工具后，现在是为示例应用程序设计用户界面了。与用户界面设计中目前的“Hello\
  \ World!” `TextView` 不同，活动实际上需要一个 `EditText` 视图。在 Layout Editor 画布上选择 `TextView`\
  \ 对象，并按下键盘上的 `Delete` 键将其从设计中删除。\n\n从 Layout Editor 左侧的 `Palette`（调色板）中选择 `Text`\
  \ 类别，从文本组件列表中点击并拖动 `Plain Text`（纯文本）组件到设备屏幕的视觉表示上。将组件移动到显示器中心直到出现中心引导线，然后将其放置到位，使布局类似于图\
  \ 14-2 所示。\n\n![](img/as_3.6_state_change_ui.jpg)\n\n图 14-2\n\n在运行 `EditText` 小控件时，有必要为视图指定输入类型（input\
  \ type）。这仅定义了用户将输入的文本或数据类型。例如，如果将输入类型设置为 `Phone`，则用户将被限制在视图中输入数字。或者，如果输入类型设置为 `TextCapCharacters`，则输入将默认为大写字母。输入类型设置也可以组合。\n\
  \n为了本示例的，我们将输入类型设置为支持普通文本输入。为此，选择布局中的 `EditText` 小控件，并在 `Attributes`（属性）工具窗口中找到\
  \ `inputType` 条目。点击当前设置左侧的标志图标打开选项列表，并在列表中关闭 `textPersonName` 并启用 `text`，然后点击 `Apply`（应用）按钮。继续留在\
  \ Attributes 工具窗口中，将视图的 `id` 更改为 `editText` 并点击弹出的对话框中的 `Refactor`（重构）按钮。\n\n默认情况下，`EditText`\
  \ 显示的文本为“Name”。留在 Attributes 面板中，删除文本属性字段中的此内容，使视图在布局中为空。\n\n在继续之前，点击布局编辑器工具栏上的\
  \ `Infer Constraints`（推断约束）按钮以添加任何缺失的约束。\n\n### 14.3 写活动生命周期方法\n\n此时，项目包含一个名为 `MainActivity`\
  \ 的单一活动，它派自 Android 的 `AppCompatActivity` 类。该活动的源代码包含在 `MainActivity.java` 文件中，该文件应该已经在编辑器会话中打开，并由编辑器标签栏中的标签页表示。如果文件不再打开，请在\
  \ Project 工具窗口面板中导航到它（`app -> java -> com.ebookfrenzy.statechange -> MainActivity`）并双击它将文件加载到编辑器。\n\
  \n到为止，活动重写的唯一生命周期方法是 `onCreate()` 方法，该方法已实现为在设置活动用户界面之前调用父类的实例方法。我们现在将修改此方法，使其每次执行时都在\
  \ Android Studio 的 Logcat 面板中输出一条诊断消息。为此，我们将使用 `Log` 类，这需要导入 `android.util.Log`\
  \ 并声明一个标签（tag），以便我们能够在日志输出中过滤这些消息：\n\n```java\npackage com.ebookfrenzy.statechange;\n\
  \n.\n\n.\n\nimport android.util.Log;\n\nimport androidx.annotation.NonNull;\n\n\
  import android.view.View;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n\n    private ActivityMainBinding binding;\n\n    private static final String\
  \ TAG = \"StateChange\";\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n       \
  \ Log.i(TAG, \"onCreate\");\n    }\n}\n```\n\n下一个任务是重写更多方法，每个方法都包含一个相应的日志调用。这些重写方法可以手动添加，也可以使用\
  \ `Alt-Insert` 快捷键生成，正如标题为“Android Studio 代码编辑器基础的章节中所概述。请注意，如果方法是自动生成的，仍然需要手动添加\
  \ Log 调用：\n\n```java\n@Override\nprotected void onStart() {\n    super.onStart();\n\
  \    Log.i(TAG, \"onStart\");\n}\n\n@Override\nprotected void onResume() {\n   \
  \ super.onResume();\n    Log.i(TAG, \"onResume\");\n}\n\n@Override\nprotected void\
  \ onPause() {\n    super.onPause();\n    Log.i(TAG, \"onPause\");\n}\n\n@Override\n\
  protected void onStop() {\n    super.onStop();\n    Log.i(TAG, \"onStop\");\n}\n\
  \n@Override\nprotected void onRestart() {\n    super.onRestart();\n    Log.i(TAG,\
  \ \"onRestart\");\n}\n\n@Override\nprotected void onDestroy() {\n    super.onDestroy();\n\
  \    Log.i(TAG, \"onDestroy\");\n}\n\n@Override\nprotected void onSaveInstanceState(Bundle\
  \ outState) {\n    super.onSaveInstanceState(outState);\n    Log.i(TAG, \"onSaveInstanceState\"\
  );\n}\n\n@Override\nprotected void onRestoreInstanceState(Bundle savedInstanceState)\
  \ {\n    super.onRestoreInstanceState(savedInstanceState);\n    Log.i(TAG, \"onRestoreInstanceState\"\
  );\n}\n```\n\n### 14.4 过滤 Logcat 面板\n\n在 `MainActivity.java` 重写方法中添加的代码旨在向 Logcat\
  \ 窗口输出日志信息。此输出可以配置为显示与设备或模拟器的所有事件，或限制为当前选择应用的事件。显示 Logcat 工具窗口并点击过滤器菜单（如图 14-3 中标记为\
  \ B），以查看可用选项。当此菜单设置为“Show only application”（仅显示应用）时，将只显示与所选应用相关的消息。而选择“No Filters”（无过滤器）将显示设备或模拟器生成的所有消息。\n\
  \n![](img/as_4.0_statechange_logcat.jpg)\n\n图 14-3\n\n在运行应用程序之前，值得演示创建一个过滤器，选择后进一步限制日志输出，确保只显示包含我们在活动中声明标签的消息。\n\
  \n从过滤器菜单（B），选择 Edit Filter Configuration（编辑过滤器配置）选项。在新 Logcat Filter 对话框中（图 14-4），将过滤器命名为\
  \ Lifecycle，并在 Log Tag 字段中输入 `MainActivity.java` 中声明的 Tag 值（在上面的代码示例中为 `StateChange`）。\n\
  \n![](img/Image2459.jpg)\n\n图 14-4\n\n在 Package Name（包名）字段中输入包标识符，更改完成后点击 OK 按钮创建过滤器并关闭对话框。现在不再列出\
  \ No Filters，新创建的过滤器应该位于 Logcat 工具窗口。\n\n### 14.5 运行应用程序\n\n为了获得最佳结果，应用程序应在物理 Android\
  \ 设备或模拟器上运行。在设备已配置并连接到开发计算机的情况下，点击 Android Studio 工具栏上由绿色三角形表示的运行按钮，如下图 14-5 所示，选择\
  \ `Run -> Run…` 菜单选项或使用 `Shift+F10` 快捷键：\n\n![](img/as_3.5_run_statechange_app.jpg)\n\
  \n图 14-5\n\n如果出现 Choose Device 对话框，从中选择物理 Android 设备或模拟器（假设你尚未将其配置为默认目标）。在 Android\
  \ Studio 构建应用程序并将其安装到设备后，它应该启动并在前台运行。\n\n\n\n\n\n查看 Logcat 面板可以指示哪些方法目前已被触发（请确保选择了上一节中创建的\
  \ Lifecycle 过滤器，以过滤掉我们目前不感兴趣的日志事件）：\n\n![](img/Image2476.jpg)\n\n图 14-6\n\n## 14.6\
  \ Activity Activity 实验\n\n既然诊断功能已正常工作，现在是时候运行应用程序，以理解 Activity 生命周期周期状态的变化了。首先，考虑\
  \ Logcat 面板中的初始日志事件序列：\n\n```\nonCreate\nonStart\nonResume\n```\n\n显然，初始状态的变化与“理解\
  \ Android 应用程序和 Activity 生命周期”中概述的完全一致。但请注意，并没有调用 `onRestoreInstanceState()`，因为\
  \ Android 运行时检测到在这种情况下没有需要恢复的状态。\n\n点击设备屏幕底部状态栏上的主页（Home）图标，并注意日志中报告的方法调用序列如下：\n\
  \n```\nonPause\nonStop\nonSaveInstanceState\n```\n\n在这种情况下，运行时注意到该 Activity 不再处于前台，对用户不可见，并停止了该\
  \ Activity，但并没有为 Activity 提供保存动态状态的机会。取决于运行时最终销毁了 Activity 还是仅仅重启了它，该 Activity 将通过调用\
  \ `onRestart()` 被通知其已重启，或者在用户返回 Activity 时再次经历创建序列。\n\n正如正如“理解 Android 应用程序和 Activity\
  \ 生命周期”中概述的，Activity 的销毁和重建可以通过对设备进行配置更改（例如，从竖屏旋转到横屏）来触发。要看到这一效果，只需在 StateChange\
  \ 应用程序处于前台时旋转设备即可。当使用模拟器时，可以使用模拟器工具栏上的旋转按钮来模拟设备旋转。为了完成旋转，还需要点击设备或模拟器屏幕上工具栏中出现的旋转按钮，如图\
  \ 14-7 所示：\n\n![](img/as_4.1_rotate_screen_button.jpg)\n\n图 14-7\n\n日志中生成的方法调用序列应如下：\n\
  \n```\nonPause\nonStop\nonSaveInstanceState\nonDestroy\nonCreate\nonStart\nonRestoreInstanceState\n\
  onResume\n```\n\n显然，运行时系统在 Activity 被销毁和重启之前，给了它保存状态的机会。\n\n## 14.7 总结\n\n古语“一画胜于千言”在学习新编程范式的示例中同样适用。在本章中，我们创建了一个\
  \ Android 应用程序示例，其目的是为了演示 Activity 可能会经过的不同生命周期状态。在这一章的项目开发过程中，我们还查看了从 Activity\
  \ 内部生成诊断日志信息的机制。\n\n在下一章中，我们将扩展 StateChange 示例项目，以演示如何保存和恢复 Activity 的动态状态。\n\n\
  ## 15. 保存和恢复 Android Activity 状态\n\n如果前面的几个章节已经实现了它们的目标，那么现在对于在 Activity 生命周期特定点保存和恢复用户界面状态的重要性，应该会变得更清晰一些。\n\
  \n在本章中，我们将扩展“通过示例理解 Android Activity 状态变化”中创建的示例应用程序，演示当 Activity 被运行时系统销毁和重建时保存和恢复状态涉及的步骤。\n\
  \n保存和恢复动态状态的关键组件涉及使用 Android SDK 的 `Bundle` 类，该主题在本章中也会涵盖。\n\n## 15.1 保存动态状态\n\n\
  正如我们已经学到的，Activity 有机会通过运行时系统调用 Activity 实现的 `onSaveInstanceState()` 方法来保存动态状态信息。作为参数传递给该方法的是对\
  \ `Bundle` 对象的引用，该方法需要向其中存储任何需要保存的动态数据。随后，`Bundle` 对象由运行时系统代表 Activity 进行存储，并在当这些方法被调用时，作为参数传递给\
  \ Activity 的 `onCreate()` 和 `onRestoreInstanceState()` 方法。然后，可以在这些方法内部从 `Bundle`\
  \ 对象中检索数据，并将其用于恢复 Activity 的状态。\n\n## 15.2 用户界面状态的默认保存\n\n在上一节中，StateChange 示例应用程序的诊断输出显示，当运行该\
  \ Activity 的设备旋转到足以触发方向变化时，Activity 会经历一系列状态变化。\n\n再次启动 StateChange 应用程序，这次在执行设备旋转之前在\
  \ `EditText` 字段中输入一些文本（在运行 Android 9 或更高版本的设备或模拟器上，可能需要点击位于状态栏的旋转按钮来完成旋转）。旋转设备后，Logcat\
  \ 窗口中应出现以下状态变化序列：\n\n```\nonPause\nonStop\nonSaveInstanceState\nonDestroy\nonCreate\n\
  onStart\nonRestoreInstanceState\nonResume\n```\n\n显然，这导致了 Activity 的销毁和重建。然而，查看正在运行的应用程序界面，应该显示输入到\
  \ `EditText` 字段中的文本已被保留。鉴于 Activity 已被销毁并重建，且我们没有添加任何特定代码来确保文本被保存和恢复，这种行为需要一些解释。\n\
  \n事实上，Android SDK 包含的大多数视图小部件已经实现了在 Activity 重启时自动保存和恢复状态所需的行为。启用此行为的唯一要求是 Activity\
  \ 中的 `onSaveInstanceState()` 和 `onRestoreInstanceState()` 重写方法包含对父类方法的调用：\n\n```java\n\
  @Override\nprotected void onSaveInstanceState(@NonNull Bundle outState) {\n    super.onSaveInstanceState(outState);\n\
  }\n\n@Override\nprotected void onRestoreInstanceState(@NonNull Bundle savedInstanceState)\
  \ {\n    super.onRestoreInstanceState(savedInstanceState);\n}\n```\n\n可以通过在 XML\
  \ 文件中将 `saveEnabled` 属性设置为 false 来禁用用户界面视图的状态自动保存。为了演示，将在用户界面布局中禁用 `EditText` 视图的自动保存机制，然后在应用程序中添加代码手动保存和恢复视图状态。\n\
  \n为了配置 `EditText` 视图以便在 Activity 重启事件时不保存和恢复状态，请编辑 `activity_main.xml` 文件，使视图的条目如下所示（注意可以通过点击布局编辑器面板底部的\
  \ Text 标签页直接编辑 XML）：\n\n```xml\n<EditText\n    android:id=\"@+id/editText\"\n  \
  \  android:layout_width=\"wrap_content\"\n    android:layout_height=\"wrap_content\"\
  \n    android:ems=\"10\"\n    android:inputType=\"text\"\n    android:saveEnabled=\"\
  false\"\n    app:layout_constraintBottom_toBottomOf=\"parent\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n```\n\n进行更改后，运行应用程序，输入文本并旋转设备，在继续之前验证文本不再被保存和恢复。\n\n\n\n\n\n对于需要在用户界面视图组件提供的默认功能之外保存状态的情况，`Bundle`\
  \ 类提供了一个使用键值对机制存储数据的容器。键的形式为字符串值，而与这些键关联的值可以是原始类型值的形式，也可以是任何实现了 Android `Parcelable`\
  \ 接口的对象的。已经有许多类实现了 `Parcelable` 接口。自定义类可以可以通过实现 `Parcelable` 接口中定义的一组方法来使其变为“可序列化的”，相关细节可以在\
  \ Android 文档中找到：\n\nhttps://developer.android.com/reference/android/os/Parcelable.html\n\
  \n`Bundle` 类还包含一组方法，用于获取和设置各种数据类型的键值对，涵盖了原始类型（包括 `Boolean`、`char`、`double` 和 `float`\
  \ 值）和对象（例如 `String` 和 `CharSequence`）。\n\n为了本示例的演示，并且在禁用了 `EditText` 视图的文本自动保存的情况下，我们需要确保用户输入\
  \ `EditText` 字段的文本被保存到 `Bundle` 对象中并在随后恢复。这将演示如何在 Android 应用程序中手动保存和恢复状态，并将分别使用\
  \ `Bundle` 类的 `putCharSequence()` 和 `getCharSequence()` 方法来实现。\n\n### 15.4 保存状态\n\
  \n扩展 `StateChange` 应用程序的第一步是确保在 `MainActivity` 类的 `onSaveInstanceState()` 方法中从 `EditText`\
  \ 组件中提取用户输入的文本，然后将其作为键值对保存到 `Bundle` 对象中。\n\n为了从 `EditText` 对象中提取文本，我们首先需要在用户界面中标识出该对象。显然，这涉及到\
  \ Activity 的 Java 代码（包含在 `MainActivity.java` 源码文件中）与用户界面的 XML 表示（包含在 `activity_main.xml`\
  \ 资源文件中）之间的桥接工作。为了提取输入 `EditText` 组件的文本，我们需要获得对该用户界面对象的访问权限。\n\n用户界面中的每个组件都关联有一个唯一的标识符。默认情况下，布局编辑器（Layout\
  \ Editor）工具根据对象类型为新添加的组件构建 `id`。如果布局中包含多个相同类型的视图，则类型名称后面会跟一个顺序数字（尽管开发者可以也应该将其更改更具意义的内容）。正如在\
  \ Android Studio 主窗口中选择 `activity_main.xml` 文件并显示布局编辑器工具时检查组件树（Component Tree）面板所示，`EditText`\
  \ 组件已被分配了 id 为 editText：\n\n![](img/as_4.1_state_change_component_tree.jpg)\n\n\
  图 15-1\n\n我们现在可以通过对象的 `getText()` 方法获取 `editText` 视图包含的文本，该方法反过来返回当前文本：\n\n```\n\
  CharSequence userText = binding.editText.getText();\n```\n\n最后，我们可以使用 `Bundle` 对象的\
  \ `putCharSequence()` 方法保存文本，传递键（可以是任何字符串值，但在本例中我们将将其声明为“savedText”）和 `userText`\
  \ 对象作为参数：\n\n```\noutState.putCharSequence(\"savedText\", userText);\n```\n\n将这一切整合在一起，我们在\
  \ `MainActivity.java` 文件中得到了修改后的 `onSaveInstanceState()` 方法，内容如下：\n\n```java\npackage\
  \ com.ebookfrenzy.statechange;\n\n.\n.\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n.\n.\n.\n    protected void onSaveInstanceState(@NonNull Bundle outState) {\n\
  \        super.onSaveInstanceState(outState);\n        Log.i(TAG, \"onSaveInstanceState\"\
  );\n        CharSequence userText = binding.editText.getText();\n        outState.putCharSequence(\"\
  savedText\", userText);\n    }\n.\n.\n```\n\n现在已经采取了保存状态的步骤，下一阶段是确保在需要时恢复它。\n\n\
  ### 15.5 恢复状态\n\n保存的动态状态可以在那些将 `Bundle` 对象作为参数传递的生命周期方法中恢复。这让开发者可以选择 `onCreate()`\
  \ 或 `onRestoreInstanceState()`。使用哪种方法取决于 Activity 的性质。在 Activity 执行初始化任务最适合恢复状态的情况下，通常\
  \ `onRestoreInstanceState()` 方法更为合适。为了本示例的演示，我们将在 `onRestoreInstanceState()` 方法中添加代码，使用“savedText”\
  \ 键从 `Bundle` 中提取保存的状态。然后我们使用对象的对象的 `setText()` 方法在 `editText` 组件上显示文本：\n\n```java\n\
  @Override\nprotected void onRestoreInstanceState(@NonNull Bundle savedInstanceState)\
  \ {\n    super.onRestoreInstanceState(savedInstanceState);\n    Log.i(TAG, \"onRestoreInstanceState\"\
  );\n    CharSequence userText =\n        savedInstanceState.getCharSequence(\"savedText\"\
  );\n    binding.editText.setText(userText);\n}\n```\n\n### 15.6 测试应用程序\n\n剩下的只是再次构建并运行\
  \ `StateChange` 应用程序。运行并处于前台时，触摸 `EditText` 组件并在旋转设备之前输入一些文本。虽然之前的文本更改会丢失，但得益于在本章中添加的代码，新文本保留在了\
  \ `editText` 组件中。\n\n### 15.7 总结\n\nAndroid 应用程序中动态状态的保存和恢复只需要在适当的生命周期方法中实现适当的代码。对于大多数用户界面视图，这由\
  \ `Activity` 超类自动处理。在其他情况下，这通常涉及在 `onSaveInstanceState()` 方法中提取值和设置，并将数据作为键值对保存在传递给\
  \ Activity 的 `Bundle` 对象中。\n\n\n\n\n\n“Android 设备”一词涵盖了大量具有不同屏幕尺寸和分辨率的平板电脑和智能手机产品。因此，应用程序的用户界面现在必须精心设计，以确保在尽可能广泛的显示尺寸上正确呈现。这其中的一个关键部分是确保用户界面布局在不同设备上运行时能够正确地进行缩放。这在很大程度上可以通过仔细的规划以及使用本章概述的布局管理器来实现。\n\
  \n同样重要的是要记住，大多数基于 Android 的智能手机和平板电脑都可以用户以竖屏和横屏模式手持。设计良好的用户界面应该能够适应这些变化，并进行合理的布局调整，以利用每种方向下的可用屏幕空间。\n\
  \n## 16.2 视图 (Views) 和 视图组 (View Groups)\n\n用户界面中的每一个项都是 Android `View` 类的子类（确切来说是\
  \ `android.view.View`）。Android SDK 提供了一组预构建的视图，可用于构建用户界面。典型的示例包括标准项，如 `Button`、`CheckBox`、`ProgressBar`\
  \ 和 `TextView` 类。这些视图也被称为控件（widgets）或组件。对于 SDK 提供的控件无法满足的需求，可以通过对现有类进行子类化和扩展，或者通过直接在\
  \ `View` 类之上构建完全全新的组件来创建新视图。\n\n视图还可以由多个其他视图组成（也称为复合视图）。此类视图派自 Android `ViewGroup`\
  \ 类（`android.view.ViewGroup`），而该类本身也是 `View` 的子类。此类视图的一个示例是 `RadioGroup`，它旨在包含多个\
  \ `RadioButton` 对象，以便在任何时刻只有一个对象可以处于“开启”位置。从结构上讲，复合视图由单个父视图（派自 `ViewGroup` 类，另称为容器视图或根元素）组成，该父视图能够包含其他视图（称为子视图）。\n\
  \n另一类基于 `ViewGroup` 的容器视图是布局管理器（layout managers）。\n\n## 16.3 Android 布局管理器 (Layout\
  \ Managers)\n\n除了上一节讨论的控件式视图外，SDK 还包含了一组被称为布局（layouts）的视图。布局是容器视图（因此也派自 `ViewGroup`），其设计的唯一目的是控制子视图在屏幕上的对齐方式。\n\
  \nAndroid SDK 包含了以下可能在 Android 用户界面设计中使用的布局视图：\n\n- `ConstraintLayout` – 引入自 Android\
  \ 7，对于大多数布局需求建议使用此布局管理器。`ConstraintLayout` 允许通过分配给每个子视图的简单约束设置来定义布局中视图的定位和行为。这种布局的灵活性允许快速、方便地创建复杂布局，而无需在内部嵌套其他布局类型，从而提高了布局性能。`ConstraintLayout`\
  \ 也紧密集成到 Android Studio 布局编辑器工具中。除非另有说明，否则它是本书书中大多数示例的首选布局。\n- `LinearLayout` –\
  \ 根据所选择的方向（orientation）将子视图放置在单行或单列中。可以在每个子视图上设置权重（weight）值，以指定该子视图相对于其他子视图占据布局空间的比例。\n\
  - `TableLayout` – 将子视图按行和列的网格格式排列。表格中的每一行由一个 `TableRow` 对象子项表示，该对象又包含每个单元格的视图对象。\n\
  - `FrameLayout` – `FrameLayout` 的目的是分配屏幕区域，通常用于显示单个视图。如果添加了多个子视图，默认情况下它们将相互堆叠，并位于布局区域的左上角。通过为每个子视图设置重力（gravity）值，可以实现单个子视图的交替定位。例如，在子视图上设置\
  \ `center_vertical` 重力值将导致其位于包含的 `FrameLayout` 视图的垂直中心。\n- `RelativeLayout` – `RelativeLayout`\
  \ 允许子视图相对于彼此以及相对于包含的布局视图进行定位。例如，子视图 A 可以配置为位于 `RelativeLayout` 布局的垂直中心。另一方面，视图 B\
  \ 可以被配置为位于布局的水平中心，并位于视图 A 顶上方 30 像素处。`RelativeLayout` 在设计需要适应各种屏幕尺寸和方向的用户界面时非常有用。\n\
  - `AbsoluteLayout` – 允许在布局视图通过特定的 X 和 Y 坐标放置子视图。由于缺乏活性，不建议使用这种布局。\n- `GridLayout`\
  \ – `GridLayout` 实例被划分为行和列的网格，子视图被放置在单元格中，并可以水平或垂直跨越多个单元格。可以通过放置特殊的 `Space` 视图来实现单元格之间的间隙。\n\
  - `CoordinatorLayout` – 作为 Android 5.0 设计支持库的一部分，`CoordinatorLayout` 设计用于协调应用程序顶部应用栏与其他元素行为。在使用基础\
  \ Activity 模板创建新活动时，主布局将使用 `CoordinatorLayout` 实现。该布局将在使用浮动按钮和 Snackbar 章节中进行更详细的介绍。\n\
  \n在考虑 Android 用户界面的布局时，值得注意的是，正如下一节所述，这些布局可以相互嵌套以创建任何所需复杂的用户界面。\n\n## 16.4 视图层次结构\
  \ (View Hierarchy)\n\n用户界面中的每个视图都代表屏幕的一个矩形区域。视图负责在该矩形内绘制内容，并响应在该屏幕区域发生的事件（如触摸事件）。\n\
  \n用户界面屏幕由视图层次结构组成，顶部是根视图，下方是子视图。容器视图的子出现在父视图之上，并被限制在父视图的边界内。例如，考虑图 16-1 所示的用户界面：\n\
  \n\n\n\n\n![](img/Image2815.jpg)\n\n图 16-3\n\n视图层级图可能最清晰地概述了构成图 16-1 所示用户界面的视图之间的关系。当用户界面显示给用户时，Android\
  \ 运行时会遍历视图层级，从根视图开始，沿着树结构向下，并渲染每个视图。\n\n## 16.5 创建用户界面\n\n在对视图、布局和视图层级概念有了更清晰的理解后，接下来的章节将重点介绍为\
  \ Android Activity 创建用户界面的步骤。事实上，用户界面设计有三种不同的方法：使用 Android Studio 布局编辑器工具、手动编写 XML\
  \ 布局资源文件或编写 Java 代码，每种方法都将得到涵盖。\n\n## 16.6 总结\n\nAndroid 应用用户界面屏幕中的每个元素都是视图（view），它们最终都派自\
  \ `android.view.View` 类。每个视图代表设备屏幕上的矩形区域，并负责该矩形区域显示的内容以及处理在该视图边界内发生的事件。多个视图可以组合创建一个复合视图（composite\
  \ view）。复合视图中的视图是容器视图的子视图，容器视图通常是 `android.view.ViewGroup` 的子类（它本身也是 `android.view.View`\
  \ 的子类）。用户界面由以视图层级形式构建的视图组成。\n\nAndroid SDK 包含一系列预构建的视图可用于创建用户界面。这些包括文本字段和按钮等基本组件，还包括一系列用于控制子视图位置的布局管理器。如果提供的视图不能满足特定需求，可以通过扩展或组合现有视图来创建自定义视图，或者通过派生\
  \ `android.view.View` 并创建一个全新的视图类。\n\n用户界面可以使用 Android Studio 布局编辑器工具、手动编写 XML 布局资源文件或编写\
  \ Java 代码来创建。这些方法中的每一种将在接后的章节中进行介绍。\n\n# 17. Android Studio 布局编辑器工具指南\n\n很难想象出一个不需要某种形式用户界面的\
  \ Android 应用概念。大多数 Android 设备都配有触摸屏和键盘（虚拟或物理），点击和滑动是用户与应用程序之间交互的主要形式。这些交互不可避免地通过应用程序的用户界面进行。\n\
  \n一个设计且实现良好的用户界面是创建一个成功且流行的 Android 应用的重要因素，根据单个应用程序的设计需求，它可以从简单到极其复杂不等。无论复杂程度如何，Android\
  \ Studio 布局编辑器工具都极大简化了设计和实现 Android 用户界面的任务。\n\n### 17.1 基础与空 Activity 模板\n\n正如“Android\
  \ 应用的剖析”章节概述的那样，Android 应用由一个或多个 Activity 组成。Activity 是应用程序功能的一个独立模块，通常直接对应于单个用户界面屏幕。因此，当我们使用\
  \ Android Studio 布局编辑器时，我们总是在为某个 Activity 编写布局。\n\n在创建新的 Android Studio 项目时，有许多不同的模板可以作为主\
  \ Activity 用户界面的起点。这些模板中最基础的是基础 Activity（Basic Activity）模板和空 Activity（Empty Activity）模板。尽管它们初看之下很相似，但这两个选项之间实际上存在显著差异。若要在布局编辑器中查看这些差异，请使用“视图选项”（View\
  \ Options）菜单启用“显示系统 UI”（Show System UI），如下方的图 17-1 所示：\n\n![](img/as_4.1_layout_editor_system_ui.jpg)\n\
  \n图 17-1\n\n空 Activity 模板创建一个单个布局文件，由一个 `ConstraintLayout` 布局管理器实例组成，该实例包含一个 `TextView`\
  \ 对象，如图 17-2 所示：\n\n![](img/as_4.1_empty_activity_ui.jpg)\n\n图 17-2\n\n另一方面，基础 Activity\
  \ 包含多个布局文件。顶层布局文件具有 `CoordinatorLayout` 作为根视图、一个可配置的应用程序标题栏（也称为操作栏），显示在设备屏幕顶部（在图\
  \ 17-3 中标记为 A），以及一个浮动按钮（标记为 B 的邮件按钮）。除了这些项目，`activity_main.xml` 布局文件还引用了名为 `content_main.xml`\
  \ 的第二个文件，该文件包含内容布局（标记为 C）：\n\n![](img/as_4.1_basic_activity_ui.jpg)\n\n图 17-3\n\n\
  基础 Activity 包含两个屏幕的布局，都包含一个按钮和一个文本视图。该模板的目的是演示如何在应用内的多个屏幕之间实现导航。如果运行使用基础 Activity\
  \ 模板的未修改应用，将出现这两个屏幕中的第一个（在图 17-4 中标记为 A）。点击“下一步”（Next）按钮将导航到第二个屏幕 (B)，该屏幕反过来包含一个可以返回第一个屏幕的按钮：\n\
  \n![](img/as_4.1_layout_editor_basic_navigation.jpg)\n\n图 17-4\n\n此应用行为利用了被称为“碎片”（fragments）和“导航”（navigation）的两个\
  \ Android 功能，它们都将分别从“Android 碎片简介”和“导航架构概述`章节开始介绍。\n\n`content_main.xml` 文件包含一个名为“导航宿碎片”（Navigation\
  \ Host Fragment）的特殊碎片，它允许根据 `res/layout/nav_graph.xml` 文件中的设置在视图中切换不同的内容。在基础 Activity\
  \ 的情况下，`nav_graph.xml` 文件被配置为根据用户选择的“下一步”和“上一步”按钮，在 `fragment_first.xml` 和 `fragment_second.xml`\
  \ 定义的用户界面布局之间进行切换。\n\n显然，如果你在 Activity 中既不需要浮动按钮也不需要菜单，不需要 `CoordinatorLayout` 提供的特殊标题栏行为（例如在某些滚动操作期间让标题栏和工具栏折叠，该主题见“使用\
  \ AppBar 和折叠工具栏布局”章节](#AppBar.xhtml__idTextAnchor991)),那么空 Activity 模板是非常用的。然而，基础\
  \ Activity 很有用的，因为它默认提供了这些元素。\n\n事实上，由于本书中并非所有示例都需要基础 Activity 模板的功能，因此在本章中的大多数示例除非示例需要基础\
  \ Activity 模板提供的一个或其他功能，否则都将使用空 Activity 模板。\n\n为了方便以后参考，如果你需要菜单但不需要浮动按钮，请使用基础 Activity\
  \ 并按照以下步骤删除浮动按钮：\n\n1. 在“项目”工具窗口的 `app -> res -> layout` 下双击主 `activity_main.xml`\
  \ 布局文件，将其加载到布局编辑器中。当布局加载到布局编辑器工具后，选择浮动按钮并按下键盘上的 Delete 键将其从布局中删除。\n\n\n\n\n\n2.\
  \ 找到并编辑 activity 的 Java 代码（位于 `app` -> `java` -> `<package name>` -> `<activity\
  \ class name>`），并按照如下所示从 `onCreate` 方法中删除悬浮按钮代码：\n\n```java\n@Override\nprotected\
  \ void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    binding = ActivityMainBinding.inflate(getLayoutInflater());\n    setContentView(binding.getRoot());\n\
  \    setSupportActionBar(binding.toolbar);\n    NavController navController = Navigation.findNavController(this,\
  \ R.id.nav_host_fragment_content_main);\n    appBarConfiguration = new AppBarConfiguration.Builder(navController.getGraph()).build();\n\
  \    NavigationUI.setupActionBarWithNavController(this, navController, appBarConfiguration);\n\
  \    binding.fab.setOnClickListener(new View.OnClickListener() {\n        @Override\n\
  \        public void onClick(View view) {\n            Snackbar.make(view, \"Replace\
  \ with your own action\", Snackbar.LENGTH_LONG)\n                    .setAction(\"\
  Action\", null).show();\n        }\n    });\n}\n```\n\n如果你需要悬浮按钮但不需要菜单，请使用 Basic\
  \ Activity 模板并遵循以下步骤：\n\n1. 编辑 activity 类文件并删除 `onCreateOptionsMenu` 和 `onOptionsItemSelected`\
  \ 方法。\n2. 在 Project 工具窗口中选择 `res` -> `menu` 项，按下键盘上的 Delete 键从项目中删除该文件夹和相应的菜单资源文件。\n\
  \n如果你需要使用 Basic Activity 模板，但既不需要导航功能也不需要第二个片段，请遵循以下步骤：\n\n1. 在 Project 工具窗口中，导航并双击\
  \ `app` -> `res` -> `navigation` -> `nav_graph.xml` 文件，将其加载到导航编辑器中。\n2. 在编辑器中，选择图表面板中的\
  \ `SecondFragment` 项，并按下键盘 delete 键将其从图中移除。\n3. 找到并删除 `SecondFragment.java`（app`\
  \ -> `java` -> `<package name>` -> `SecondFragment`）和 `fragment_second.xml`（app`\
  \ -> `res` -> `layout` -> `fragment_second.xml`）文件。\n4. 最后的任务是从 `FirstFragment`\
  \ 类中移除一些代码，使得 `Button` 视图在被点击时不再导航到已不存在的第二个片段。找到 `FirstFragment.java` 文件，双击它将其加载到编辑器，并移除\
  \ `onViewCreated()` 方法中的代码，使其内容如下：\n\n```java\npublic void onViewCreated(@NonNull\
  \ View view, Bundle savedInstanceState) {\n    super.onViewCreated(view, savedInstanceState);\n\
  \    binding.buttonFirst.setOnClickListener(new View.OnClickListener() {\n     \
  \   @Override\n        public void onClick(View view) {\n            NavHostFragment.findNavController(FirstFragment.this)\n\
  \                    .navigate(R.id.action_FirstFragment_to_SecondFragment);\n \
  \       }\n    });\n}\n```\n\n## 17.2 Android Studio 布局编辑器\n\n正如前面的章节所示，布局编辑器工具提供了一个“所见即所得”（WYSIWYG）的环境，在该环境中，可以从调板中选择视图，然后将其放置在代表\
  \ Android 设备显示的画布上。一旦视图被放置在画布上，就可以对其进行移动、删除和调整大小（受父视图约束的限制）。此外，可以使用 Attributes 工具窗口窗口修改与所选视图相关的各种属性。\n\
  \n在底层，布局编辑器工具实际上构建了一个包含正在设计的用户界面定义的 XML 资源文件。因此，布局编辑器以三种不同的模式运行，称为 Design（设计）、Code（代码）和\
  \ Split（拆）模式。\n\n## 17.3 设计模式\n\n在设计模式下，可以直接操作视图调板和布局的图形表示来视觉化操作用户界面。图 17-5 突出了\
  \ Android Studio 布局编辑器在设计模式下的关键区域：\n\n![](img/as_4.2_layout_editor_labelled.jpg)\n\
  \n图 17-5\n\nA – 调板 (Palette) – 调板提供了 Android SDK 提供的系列视图组件。这些组件被分为类别以便于导航。可以通过从调板中拖拽视图组件并将其掉在布局所需位置来向布局添加项。\n\
  \nB – 设备屏幕 (Device Screen) – 设备屏幕提供了设计中的用户界面布局的视觉“所见即所得”表示。\n\nC – 组件树 (Component\
  \ Tree) – 组件树提供了层级结构的视觉概述。正如上一章理解视图、视图组和布局) 所述，用户界面是使用层级结构构建的。\n\nD – 属性 (Attributes)\
  \ – 调板列出的所有组件都有一组可以使用的相关属性。\n\nE – 工具栏 (Toolbar) – 工具栏提供了快速访问各种选项的功能，包括放大和缩小、旋转布局以及切换到不同的\
  \ SDK API 级别等。工具栏还有一组上下文相关的按钮，当选择相关的视图类型时，这些按钮会出现。\n\nF – 模式切换控件 (Mode Switching\
  \ Controls) – 这三个按钮提供了在布局编辑器的 Design、Code 和 Split 模式之间切换的方法。\n\nG – 缩放和平和平移动控件 (Zoom\
  \ and Pan Controls) – 此控制面板允许你对设计画布进行放大和缩小，并抓取画布进行移动以找到被遮挡的区域。\n\n## 17.4 调板\n\n\
  布局编辑器调板组织为两个面板，旨在方便查找和预览要添加到布局中的视图组件。类别面板（如图 17-6 中的标记 A）列出了 Android SDK 支持的不同视图组件类别。从列表中选择一个类别时，第二个面板（B）将更新以显示属于该类别的组件列表：\n\
  \n![](img/as_4.1_layout_editor_palette.jpg)\n\n图 17-6\n\n要将调板上的组件添加到画布上，只需从组件列表或预览面板中选择该项，将其拖到画布上的所需位置并放置到位。\n\
  \n在当前选定的类别内搜索特定组件，可以通过点击调板工具栏上的搜索按钮（如图 17-6 上方的标记 C）并输入组件名称来启动。随着字符的输入，匹配的结果将实时显示在组件列表面板中。如果不确定组件所在的类别，只需在搜索操作之前或期间简单选择\
  \ All（全部）类别即可。\n\n## 17.5 设计模式与布局视图\n\n默认情况下，布局编辑器将以 Design 模式出现，如图 17-5 所示。此模式提供了用户界面的视觉表示。可以通过点击最右侧的模式切换控件（如图\
  \ 17-7 所示）随时选择 Design 模式。\n\n\n\n\n\n![](img/as_4.0_layout_editor_design_button.jpg)\n\
  图 17-7\n\n当 `Layout Editor`（布局编辑器）工具处于 `Design` 模式时，可以通过两种方式查看布局。上方图 17-5 所示的视图为\
  \ `Design` 视图，它显示了布局和控件在运行的应用程序中出现的样子。第二种模式被称为 `Blueprint`（蓝图）视图，可以替代 `Design` 视图显示，也可以与\
  \ `Design` 视图同时显示。图 17-8 所示的工具栏菜单提供了显示 `Design`、`Blueprint` 或两种视图都视图的选项。第四种选项 `Force\
  \ Refresh Layout`（强制刷新布局）会导致布局重新构建并重绘。当布局进入意外状态或未能准确反映当前设计设置时，此功能非常有用：\n\n![](img/as_4.2_layout_editor_design_blueprint_menu.jpg)\n\
  图 17-8\n\n显示布局视图、设计视图还是两者都取决于个人喜好。一种好的方法是如图 17-9 所示，开始同时显示两者：\n\n![](img/as_3.5_show_layout_design_and_blueprint.jpg)\n\
  图 17-9\n\n## 17.6 夜间模式 (Night Mode)\n\n要在设计期间以夜间模式查看布局，请选择下方图 17-10 所示的菜单并将设置更改为\
  \ `Night`：\n\n![](img/as_4.2_layout_editor_night_menu.jpg)\n图 17-10\n\n## 17.7 代码模式\
  \ (Code Mode)\n\n在使用 `Android Studio Layout Editor` 工具时，必须记住它实际上所做的只是为创建 XML 布局资源文件提供了一种易用户的方法。在设计过程的任何时候，只需点击位于\
  \ `Layout Editor` 工具面板右上角的 `Code` 按钮，即可查看并直接编辑底层的 XML，如图 17-11 所示：\n\n![](img/as_4.0_layout_editor_code_button.jpg)\n\
  图 17-11\n\n图 17-12 显示了 `Code` 模式下的 `Android Studio Layout Editor` 工具，允许通过修改 XML\
  \ 来更改用户界面声明：\n\n![](img/as_3.6_layout_editor_code_mode.jpg)\n图 17-12\n\n## 17.8\
  \ 分屏模式 (Split Mode)\n\n在 `Split` 模式下，编辑器并排显示 `Design` 和 `Code` 视图，允许用户既可以使用设计画布可视化地修改用户界面，也可以通过直接更改\
  \ XML 声明进行修改。要进入 `Split` 模式，请点击下方图 17-13 所示的中间按钮：\n\n![](img/as_4.1_layout_split_button.jpg)\n\
  图 17-13\n\n对 XML 的任何更改都会反映在设计画布上，反之亦然。图 17-14 显示了 `Split` 模式下的编辑器：\n\n![](img/as_4.1_layout_split_mode.jpg)\n\
  图 17-14\n\n## 17.9 设置属性 (Setting Attributes)\n\n`Attributes`（属性）面板提供了对当前选中组件所有可用设置的访问。例如图\
  \ 17-15 显示了 `TextView` 控件的属性：\n\n![](img/as_4.1_layout_attributes.jpg)\n图 17-15\n\
  \n`Attributes` 工具窗口分为以下不同的部分。\n\n- `id` - 包含 `id` 属性，定义了在应用程序源代码中引用当前所选对象的名称。\n\
  - `Declared Attributes`（已声明属性） - 包含所有已赋值的属性。\n- `Layout`（布局） - 定义当前所选视图对象相对于屏幕和布局中其他对象的定位和大小的设置。\n\
  - `Transforms`（变换） - 包含允许当前所选对象旋转、缩放和偏移的控件。\n- `Common Attributes`（常用属性） - 对于当前所选视图对象类通常需要更改的属性列表。\n\
  - `All Attributes`（所有属性） - 当前所选对象可用属性的完整列表。\n\n也可以通过选择 `attributes` 工具窗口工具栏中的搜索按钮并输入属性名称来对特定属性进行搜索。\n\
  \n某些属性在值字段右侧有一个窄按钮。这表示可以使用 `Resources`（资源）对话框来协助选择合适的属性值。要显示该对话框，只需点击该按钮。该按钮的外观会根据相应的属性值是存储在资源文件中还是硬编码而发生变化。如果值存储在资源文件中，`text`\
  \ 属性字段右侧的按钮将被填充，以指示该值不是硬编码的，如下方的图 17-16 所示：\n\n![](img/as_3.4_resource_extracted.jpg)\n\
  图 17-16\n\n具有有限数量有效选项的属性将呈现下拉菜单（如图 17-17 所示），可以从中进行选择。\n\n![](img/as_4.0_type_menu.jpg)\n\
  图 17-17\n\n## 17.10 变换 (Transforms)\n\n`Attributes` 工具窗口中的 `transforms` 面板（如图 17-18\
  \ 所示）提供一组控件和属性，用于控制当前所选对象的视觉方面，包括旋转、`alpha`（淡入淡出）、`scale`（缩放）和 `translation`（偏移）：\n\
  \n![](img/as_4.1_layout_editor_transforms.jpg)\n图 17-18\n。\n\n## 17.11 工具切换 (Tools\
  \ Toggles)\n\n在 `Code` 模式下查看 Android Studio 布局文件的内容时，你会发现定义视图外观的许多属性以 `android:`\
  \ 前缀开头。这表示属性设置在 `android` 命名空间内，并在应用程序运行时生效。例如，以下布局文件片段为 `Button` 视图设置了各种属性：\n\n\
  ```xml\n<Button\n    android:id=\"button\"\n    android:layout_width=\"wrap_content\"\
  \n    android:layout_height=\"wrap_content\"\n    android:text=\"Button\" />\n```\n\
  \n除了 `android` 命名空间外，Android Studio 还提供了一个 `tools` 命名空间。当在此命名空间设置属性时，它们仅在布局编辑器中生效。在设计布局时，你可能会发现\
  \ `EditText` 视图显示某些文本很有帮助，但在应用程序运行时需要视图为空。为了实现这一点，你可以如下使用 `tools` 命名空间设置视图的 `text`\
  \ 属性：\n\n```xml\n<EditText\n    android:id=\"@+id/editTextTextPersonName\"\n   \
  \ android:layout_width=\"wrap_content\"\n    android:layout_height=\"wrap_content\"\
  \n    android:ems=\"10\"\n    android:inputType=\"textPersonName\"\n    tools:text=\"\
  Sample Text\" />\n```\n\n此类工具属性通过在 `Attributes` 工具窗口带有扳手图标标记的属性字段中输入值来设置，如图 17-19\
  \ 所示：\n\n![](img/as_4.1_text_tools_property.jpg)\n图 17-19\n\n工具属性在设计过程中更改视图的可见性特别有用。布局中可能包含一个视图，在应用程序运行时根据用户操作程序化地显示和隐藏。为了模拟隐藏视图，可以在视图的\
  \ XML 声明中添加以下工具属性：\n\n```xml\ntools:visibility=\"invisible\"\n```\n\n\n\n\n在使用 `invisible`（隐藏）设置时，虽然视图将不再可见，但它仍然存在于布局中，并占据其可见时相同的空间。要让布局表现得像视图不再存在，应将可见性属性设置为\
  \ `gone`，如下：\n\n```\ntools:visibility=\"gone\"\n```\n\n在上述两个示例中，可见性设置仅适用于布局编辑器，对运行中的\
  \ App 不产生任何影响。要同时控制布局编辑器和运行中 App 的可见性，需要使用 `android` 命名空间设置相同的属性：\n\n```xml\nandroid:visibility=\"\
  gone\"\n```\n\n虽然这些可见性工具 tools 属性很有用，但手动编辑 XML 布局文件是一个繁琐的过程。为了方便更改这些设置，Android Studio\
  \ 在布局编辑器的 `Component Tree`（组件树）面板中提供了一组开关。要访问这些控件，请点击面板中对应视图右侧的边距。例如，图 17-20 显示了名为\
  \ `myButton` 的 `Button` 视图的 `tools` 可见性切换控件：\n\n![](img/as_4.2_layout_tools_visibility.jpg)\n\
  \n图 17-20\n\n这些开关控制 `android` 和 `tools` 命名空间对应视图的可见性，并提供 `not set`、`visible`、`invisible`\
  \ 和 `gone` 选项。当设置了冲突属性时（例如 `android` 命名空间的开关设置为 `visible`，而 `tools` 值设置为 `invisible`），`tools`\
  \ 命名空间在布局预览中具有更高的优先级。当选择一个切换项时，Android Studio 会自动向布局文件中的 XML 视图元素添加相应的属性。\n\n除了\
  \ `Component Tree` 面板中的可见性开关外，布局编辑器还包含 `tools` 可见性和位置切换按钮，如译文图 17-21 中高亮显示的所示：\n\
  \n![](img/as_4.1_layout_editor_tools_toggle.jpg)\n\n图 17-21\n\n此按钮切换当前的 `tools`\
  \ 可见性设置。例如，如果上方显示的 `Button` 视图当前 `tools` 可见性属性设置为 `gone`，则切换此按钮将使其变为可见。这使得在视图添加到布局和从布局中移除时，能够快速检查布局行为。该开关对于检查布局中的视图是否正确约束也非常有用，该主题将在题为在\
  \ Android Studio 中使用 ConstraintLayout 指南的章节中介绍。\n\n## 17.12 转换视图\n\n在布局中将视图从一种类型更改另一种类型（例如将\
  \ `TextView` 转换为 `EditText`），可以在 Android Studio 布局编辑器中轻松完成，只需在屏幕布局或 `Component tree`\
  \ 窗口中右键点击视图，并选择 `Convert view...`（转换视图）菜单选项（图 17-22）：\n\n![](img/as_3.4_convert_view_menu_option.jpg)\n\
  \n图 17-22\n\n选中后，将弹出一个对话框，其中包含兼容的视图类型列表，选中的对象可以转换为这些类型。例如，图 17-23 显示了现有的 `TextView`\
  \ 视图可以转换为哪些类型：\n\n![](img/as_3.2_convert_layout_textview.jpg)\n\n图 17-23\n\n这种技术也用于将布局从一种类型转换为另一种类型（例如将\
  \ `ConstraintLayout` 转换为 `LinearLayout`）。\n\n## 17.13 显示样本数据\n\n在 Android Studio\
  \ 中设计布局时，会出现这样的情况：用户界面内要显示的内容在 App 完成并运行之前不可用。这有时可能很难从布局编辑器内部评估布局在 App 运行时外观。为了解决这个问题，布局编辑器允许指定样本数据，用样本图像和数据填充布局编辑器中的视图。这些样本数据只在布局编辑器中显示，在\
  \ App 运行时不会显示。可以通过直接编辑布局的 XML 或视觉化使用设计时助手（在设计区域右键点击小部件并选择 `Set Sample Data`（设置样本数据）菜单选项）来配置样本数据。设计时助手面板将为所选视图项上显示的样本数据提供一系列预配置的选项，包括各种配置的文本和图像组合。例如，图\
  \ 17-24 显示了选择在 `RecyclerView` 列表中显示样本数据时显示的样本数据选项：\n\n![](img/as_3.4_sample_data_menu.jpg)\n\
  \n图 17-24\n\n或者，可以在布局设计过程中提供用于显示的的自定义文本和图像。在布局编辑器中使用样本数据的示例包含在后文题为“布局编辑器样本数据教程的章节中。由于样本数据是通过\
  \ `tools` 属性实现的，可以使用上文图 17-21 中高亮显示的切换按钮来控制预览中数据的可见性。\n\n## 17.14 创建自定义设备定义\n\n\
  布局编辑器工具栏中的设备菜单（图 17-25）提供了一系列预配置的设备类型列表，选择后将作为设备画布显示。除了预配置的设备类型外，任何在 Android Studio\
  \ 环境中配置过的 `AVD` 实例也会列在列表中。要添加设备配置，显示设备菜单，选择 `Add Device`（添加设备）选项，并按照题为在 Android\
  \ Studio 中创建 Android 虚拟机 (AVD)的章节中的概述进行操作。\n\n![](img/as_3.6_layout_editor_select_device.jpg)\n\
  \n图 17-25\n\n## 17.15 更改当前设备\n\n作为设备选择的替代方案，可以通过从设备菜单选择 `Custom`、点击设备屏幕右下角的缩放手（图\
  \ 17-26）并拖动来更改当前设备格式。随着屏幕调整，将显示各种可用选项标记：\n\n![](img/as_3.5_show_layout_resize_device.jpg)\n\
  \n图 17-26\n\n## 17.16 布局验证（多预览）\n\n布局验证（也称为多预览）选项允许在系列 Pixel 屏幕上同时预览用户界面布局。要访问多预览，点击\
  \ Android Studio 主窗口右上角的标签，如图 17-27 所示：\n\n![](img/as_4.0_layout_validation_tab.jpg)\n\
  \n图 17-27\n\n加载后，面板将如图 17-28 所示出现，在多个 Pixel 设备配置上渲染布局：\n\n![](img/as_3.6_layout_editor_multi_preview.jpg)\n\
  \n图 17-28\n\n## 17.17 总结\n\n开发 Android 应用的关键部分是创建用户界面。在 Android Studio 环境中，这是通过布局编辑器工具完成的，该工具有三种模式。在设计模式下，从调色板选择视图组件并放置在代表\
  \ Android 设备屏幕的布局上，使用属性列表进行配置。在代码模式下，可以直接编辑表示用户界面布局的底层 XML。分割模式则可以通过可视化和直接编辑 XML\
  \ 来创建和修改布局。这些模式共同提供了一个丰富且直观的用户界面设计环境。\n\n\n\n\n布局验证面板允许用户界面布局在多种不同的设备屏幕尺寸上进行快速预览。\n\
  \n# 18. Android ConstraintLayout 指南\n\n正如在理解 Android 视图、视图组和布局 章节中讨论的那样，Android\
  \ 提供了多种布局管理器用于设计用户界面。在 Android 7 中，Google 引入了一种新的布局，旨在解决旧布局管理器的许多缺点。这种名为 `ConstraintLayout`\
  \ 的新布局将简单、表现力强且灵活的布局系统与 Android Studio 布局编辑器工具内置的强大功能相结合，以简化响应式用户界面布局的创建，而这种布局能够自动适应不同的屏幕尺寸和设备方向的变化。\n\
  \n本章将概述 `ConstraintLayout` 的基本概念，而下一章将详细介绍如何在 Android Studio 布局编辑器中使用 `ConstraintLayout`\
  \ 创建基于约束的布局。\n\n## 18.1 ConstraintLayout 的工作原理\n\n与其他所有布局一样，`ConstraintLayout` 负责管理其包含的视觉组件（也称为\
  \ `widgets`）的位置布局和尺寸调整行为。它是根据设置在每个子控件上的约束连接来实现此点的。\n\n为了充分理解和使用 `ConstraintLayout`，掌握以下关键概念至关重要：\n\
  \n- `Constraints`（约束）\n- `Margins`（边距）\n- `Opposing Constraints`（相对约束）\n- `Constraint\
  \ Bias`（约束偏置）\n- `Chains`（链）\n- `Chain Styles`（链样式）\n- `Guidelines`（指南线）\n- `Groups`（组）\n\
  - `Barriers`（屏障）\n- `Flow`（流）\n\n### 18.1.1 约束\n\n`Constraints` 本质上是一组规则，规定了 `widget`与其他控件、容器\
  \ `ConstraintLayout` 的边缘以及称为指南线的特殊元素之间的对齐和间距方式。`Constraints` 还决定了 Activity 用户界面布局如何响应设备方向的变化，或者在不同屏幕尺寸的设备上显示时的响应。为了充分配置，`widget`\
  \ 必须具有足够的约束连接，使其位置可以由 `ConstraintLayout` 布局引擎在水平和垂直平面上进行解析。\n\n### 18.1.2 边距\n\n\
  `margin` 是指定固定距离的约束形式。考虑一个需要放置在设备屏幕右上角的 `Button` 对象。这可以通过实现从 `Button` 顶部和右边缘的边距约束，并连接到父级\
  \ `ConstraintLayout` 的相应侧来实现，如图 18-1 所示：\n\n![](img/Image2437.jpg)\n\n图 18-1\n\n\
  如上图所示，这些约束连接中的每一个都有一个 `margin` 值，规定了 `widget` 距离父布局两侧的固定距离。在这种配置下，无论屏幕尺寸或设备方向如何，`Button`\
  \ 对象将始终根据两个约束连接指定的，分别距离父级 `ConstraintLayout` 的顶部和右边缘 20 和 15 个设备无关像素（`dp`）。\n\n\
  虽然上述配置在某些情况下是可以接受的，但它并没有在允许 `ConstraintLayout` 布局引擎通过调整 `widget` 的位置来响应设备旋转并支持不同尺寸屏幕方面提供任何灵活性。为了向布局中添加这种响应性，有必要实现相对约束。\n\
  \n### 18.1.3 相对约束\n\n在单个 `widget` 上沿同一轴运行的两个约束被称为相对约束。换句话说，在左右两侧都具有约束的 `widget`\
  \ 被认为具有水平相对约束。例如，图 18-2 展示了在之前的布局中添加了水平和垂直相对约束：\n\n![](img/Image24461.jpg)\n\n图\
  \ 18-2\n\n这里需要理解的关键点是，一旦在特定轴上实现了相对约束，`widget` 的定位将变为基于百分比而不是基于坐标。例如，`widget` 不再固定在布局顶部的\
  \ `20dp` 处，而是被放置在距离布局顶部 30% 的位置。在不同的方向上以及在较大或较小的屏幕上运行时，`Button` 相对于父级布局的尺寸将始终保持在相同的位置。\n\
  \n现在，重要的是理解到，图 18-2 中概述的布局不仅是通过相对约束来实现的，还应用了约束偏置。\n\n### 18.1.4 约束偏置\n\n现在已经确定 `ConstraintLayout`\
  \ 中的 `widget` 可能会受到相对约束连接的影响。默认情况下，相对约束是相等的，导致相应的 `widget` 在相对轴上居中。例如，图 18-3 显示了一个使用水平和垂直相对约束在包含的\
  \ `ConstraintLayout` 中居中的 `widget`：\n\n![](img/Image2453.jpg)\n\n图 18-3\n\n为了在存在相对约束的情况下允许对\
  \ `widget` 位置进行调整，`ConstraintLayout` 实现了一种名为约束偏置（constraint bias）的功能。`Constraint\
  \ bias` 允许 `widget` 在相对轴上的定位根据指定的百分比向其中一个约束偏斜。例如，图 18-4 显示了之前的约束布局，具有 75% 的水平偏置和\
  \ 10% 的垂直偏置：\n\n![](img/Image2461.jpg)\n\n图 18-4\n\n下一章题为在 Android Studio 中 ConstraintLayout，将更详细地介绍这些概念，并解释这些功能是如何集成到\
  \ Android Studio 布局编辑器工具中的。在此期间，`ConstraintLayout` 类的几个领域仍然需要介绍。\n\n### 18.1.5 链\n\
  \n`ConstraintLayout` 链提供了一种将多个控件的布局行为定义为组的方法。`Chains` 可以在垂直或水平轴上声明，并配置以定义链中控件的间距和尺寸。\n\
  \n控件通过双向约束连接在一起时即形成链。例如，图 18-5 展示了三个这样成链的控件：\n\n![](img/Image24681.jpg)\n\n图 18-5\n\
  \n链中的元素是链头（chain head），它在垂直链中对应顶部控件，在水平链中对应最左侧的控件。整个链的布局行为主要通过在链头上设置属性来配置。\n\n###\
  \ 18.1.6 链样式\n\n`ConstraintLayout` 链的布局行为由应用到链头的链样式设置决定。`ConstraintLayout` 类目前支持以下链布局样式：\n\
  \n- `Spread Chain`（分布链）：链中的控件在可用空间内均匀分布。这是链的默认行为。\n\n![](img/Image24781.jpg)\n\n\
  图 18-6\n\n- `Spread Inside Chain`（内部分布链）：链中的控件在链头和链中的最后一个控件之间均匀分布。头部和最后一个控件不包含在间距分布中。\n\
  \n![](img/Image2485.jpg)\n\n图 18-7\n\n- `Weighted Chain`（权重链）：允许通过权重属性定义链中每个控件所占的空间。\n\
  \n![](img/Image2492.jpg)\n\n图 18-8\n\n- `Packed Chain`（压缩链）：构成链的控件紧凑排列，没有任何间距。可以应用偏置来控制链相对于父容器的水平或垂直位置。\n\
  \n\n\n\n\n![](img/Image2500.jpg)\n图 18-9\n\n## 18.2 基线对齐 (Baseline Alignment)\n\n\
  到为止，本章仅提到了相对于组件侧边的对齐约束（通常称为侧边约束）。然而，一个常见的需求是让组件相对于其显示的内容进行对齐，而不是相对于组件本身的边界。为了为了满足这一需求，`ConstraintLayout`\
  \ 提供了基线对齐支持。\n\n例如，假设之前的 图 18-1 理论布局需要将 `TextView` 组件放置在 `Button` 的左侧 40dp 处。在这种情况下，`TextView`\
  \ 需要与 `Button` 视图基线对齐。这意味着 `Button` 内的文本需要与 `TextView` 内的文本在垂直方向上对齐。该布局的额外约束需要如\
  \ 图 18-10 所示进行连接：\n\n![](img/Image2508.jpg)\n图 18-10\n\n现在 `TextView` 沿 `Button`\
  \ 的基线垂直对齐，并位于距离 `Button` 对象左边缘水平方向 40dp 的位置。\n\n## 18.3 配置组件尺寸\n\n控制组件的尺寸是用户界面设计过程的关键元素。`ConstraintLayout`\
  \ 提供了三个可以设置在单个组件上的选项，以管理尺寸行为。这些设置针对高度和宽度维度进行单独配置：\n\n*   `Fixed`（固定）——组件固定为指定的尺寸。\n\
  *   `Match Constraint`（匹配约束）——允许布局引擎通过调整组件大小来满足当前的占导约束。也称为 `AnySize` 或 `MATCH_CONSTRAINT`\
  \ 选项。\n*   `Wrap Content`（包裹内容）——组件的大小由其所包含的内容（即文本或图形）决定。\n\n## 18.4 辅助线帮助类 (Guideline\
  \ Helper)\n\n辅助线（Guidelines）是 `ConstraintLayout` 中提供的特殊元素，它们提供了一个可以连接约束的额外目标。可以在\
  \ `ConstraintLayout` 实例中添加多个辅助线，这些辅助线反过来可以配置为水平或垂直方向。一旦添加，就可以从布局中的组件到辅助线建立约束连接。这在多个组件需要沿某个轴对齐时特别有用。例如，在\
  \ 图 18-11 中，包含在 `ConstraintLayout` 中的三个 `Button` 对象沿一条垂直辅助线进行约束：\n\n![](img/Image2519.jpg)\n\
  图 18-11\n\n## 18.5 组帮助类 (Group Helper)\n\n`ConstraintLayout` 的此功能允许将组件放置在逻辑组中，并作为一个单一实体控制这些组件的可见性。`Group`\
  \ 本质上是布局中其他组件的引用列表。一旦定义，更改组实例的可见性属性（`visible`、`invisible` 或 `gone`）将把该更改应用到所有组内成员。这使得通过更改单个属性即可轻松地隐藏和显示多个组件。一个布局可以包含多个组，一个组件也可以属于多个组。如果组之间发生冲突，XML\
  \ 文件中最后声明的组具有优先级。\n\n## 18.6 屏障帮助类 (Barrier Helper)\n\n与辅助线类似，屏障（barriers）是用于约束布局内视图的虚拟视图。与辅助线一样，屏障可以是垂直或水平的，并且一个或多个视图可以约束到它（为了避免混淆，这些被称为受约束视图）。然而，与辅助线在布局中保持固定位置不同，屏障的位置是由一组所谓的参考视图（reference\
  \ views）定义的。屏障的引入是为了解决某些情况下频繁发生的视图重叠问题。例如，考虑下方 图 18-12 所示的布局：\n\n![](img/Image2526.jpg)\n\
  图 18-12\n\n关于上述布局需要注意的要点是：`View 3` 的宽度被设置为匹配约束模式，且该视图的左边缘连接到 `View 1` 的右边缘。按照目前的实现方式，增加\
  \ `View 1` 的宽度将产生减少 `View 3` 宽度的预期效果：\n\n![](img/Image25331.jpg)\n图 18-13\n\n但是，如果增加的是\
  \ `View 2` 的宽度而不是 `View 1`，就会出现问题：\n\n![](img/Image25401.jpg)\n图 18-14\n\n显然，因为\
  \ `View 3` 仅受 `View 1` 约束，它不会为了适应 `View 2` 宽度的增加而调整大小，导致视图重叠。\n\n解决此问题的方法是添加一个垂直屏障并将\
  \ `View 1` 和 `View 2` 分配为屏障的参考视图，以便它们控制屏障的位置。`View 3` 的左边缘将相对于屏障进行约束，使其成为受约束视图。\n\
  \n现在，当 `View 1` 或 `View 2` 宽度增加时，屏障将移动以适应两个中最宽的视图，导致 `View 3` 的宽度相对于新的屏障位置发生变化：\n\
  \n![](img/Image2548.jpg)\n图 18-15\n\n在使用屏障时，与单个屏障关联的参考视图和约束视图的数量没有限制。\n\n## 18.7\
  \ 流帮助类 (Flow Helper)\n\n`ConstraintLayout Flow` 帮助类允许以流布局显示视图组。与 `Group` 帮助类一样，`Flow`\
  \ 包含了它负责定位的视图，并提供了多种配置选项，包括垂直和水平方向、换行行为（包括换行前的最大组件数量）、间距和对齐属性。链行为也可以应用于 `Flow` 布局，包括分布（spread）、内部分布（spread\
  \ inside）和填充（packed）选项。\n\n图 18-16 代表使用 `Flow` 实例在水平模式下无换行设置的均匀按钮布局：\n\n![](img/as_4.1_flow_no_wrap.jpg)\n\
  图 18-16\n\n图 18-17 显示相同的按钮设置为每三个组件换行一次：\n\n![](img/as_4.1_flow_with_wrap.jpg)\n\
  图 18-17\n\n另一方面，图 18-18](#Constraint_Layout.xhtml__idTextAnchor428) 显示了设置为内部链模式的按钮（其效果仅在第二行可见，因为第一行满了）。该配置还设置了\
  \ `gap` 属性以添加按钮之间的间距：\n\n![](img/as_4.1_flow_chain_spread_inside.jpg)\n图 18-18\n\
  \n作为 `Flow` 帮助类灵活性的最后一个演示，图 18-19 显示了五个不同尺寸的按钮，配置为水平填充链模式，并每三个组件换行一次。此外，通过设置水平偏置值为\
  \ `1.0` 使网格内容右对齐（值为 `0.0` 将导致左对齐，而 `0.5` 将使网格内容居中）：\n\n![](img/as_4.1_flow_right_align.jpg)\n\
  图 18-19\n\n## 18.8 比例 (Ratios)\n\n组件的尺寸可以使用比例设置来定义。例如，可以使用比例设置对组件进行约束，使得无论任何调整行为如何，宽度始终是高度的两倍。\n\
  \n## 18.9 ConstraintLayout 优势\n\n`ConstraintLayout` 提供的灵活性使得单个布局实例即可实现许多旧布局的功能，而以前可能需要嵌套多个布局。这种方法的优势在于允许设计所谓的“扁平”或“浅层”布局结构，从而避免了布局嵌套固有的问题，既减少了布局的复杂性，又提高了运行时用户界面的渲染性能。\n\
  \n\n\n\n\n`ConstraintLayout` 的实现也是为了解决如今市面上各种 Android 设备屏幕尺寸的问题。`ConstraintLayout`\
  \ 的灵活性使得设计用户界面变得更容易，使其能够响应并适应运行应用程序的设备。\n\n最后，正如“Android Studio 中使用 ConstraintLayout\
  \ 指南章节将演示的那样，Android Studio 布局编辑器（Layout Editor）工具已专门针对基于 `ConstraintLayout` 的用户界面设计进行了增强。\n\
  \n## 18.10 ConstraintLayout 的可用性\n\n尽管 `ConstraintLayout` 是在 Android 7 中引入的，但它是作为一个独立的支持库从主\
  \ Android SDK 中提供的，并兼容追溯到 API 级别 9（Gingerbread）的更旧 Android 版本。这使得使用这种新布局的应用程序可以在运行旧老\
  \ Android 版本的设备上运行。\n\n## 18.11 总结\n\n`ConstraintLayout` 是随 Android 7 引入的布局管理器。它的设计旨在创建灵活的布局，以适应目前市面上许多\
  \ Android 设备的尺寸和方向。`ConstraintLayout` 使用约束来控制控件相对于父级 `ConstraintLayout` 实例、辅助线（guidelines）、障碍边界（barriers）以及布局中其他控件的对齐和定位。`ConstraintLayout`\
  \ 是新创建 Android Studio 项目的默认布局，也是设计用户界面布局时的推荐选择。通过这种简单而灵活的布局管理方法可以轻松实现复杂且响应式的用户界面。\n\
  \n## 19. Android Studio 中使用 ConstraintLayout 指南\n\n正如在前面的章节中多次提到的，Google 对 Android\
  \ Studio 布局编辑器工具进行了重大更改，其中许多更改纯粹是为了支持使用 `ConstraintLayout` 的用户界面布局设计。既然上一章已经概述了\
  \ `ConstraintLayout` 的基本概念，本章将详细探讨这些概念，同时概述布局编辑器工具如何允许设计和实现基于 `ConstraintLayout`\
  \ 的用户界面。\n\n### 19.1 设计视图和布局视图\n\n名为“Android Studio 布局编辑器工具指南”的章节解释了 Android Studio\
  \ 布局编辑器工具提供了两种方式来以设计（Design）和布局（Layout，也称为蓝图）视图的形式查看活动的用户界面布局。这些布局视图可以单独显示，也可以像图\
  \ 19-1 那样并排显示：\n\n![](img/as_4.1_layout_editor_previews.jpg)\n\n图 19-1\n\n设计视图（位于上图左侧）呈现布局的“所见即所得”表示，其中布局的外观与其在运行程序中的显示一致。另一方面，布局视图显示了一种蓝图风格的视图，其中控件由阴影轮廓表示。如上方的图\
  \ 19-1 所示，布局视图还显示了约束连接（在本例中，用于将按钮在布局中居中的对向约束）。当选择布局中的特定控件或鼠标指针悬停在设计区域上时，这些约束也会叠加在设计视图上，如图\
  \ 19-2 所示：\n\n![](img/as_4.1_layout_editor_design_view.jpg)\n\n图 19-2\n\n两种视图中约束连接的外观都可以使用图\
  \ 19-3 所示的视图选项（View Options）菜单进行更改：\n\n![](img/as_4.2_view_options_menu.jpg)\n\n\
  图 19-3\n\n除了显示用户界面布局的模式外，布局编辑器工具还提供了三种建立特定布局设计所需约束的不同方式。\n\n### 19.2 自动连接模式 (Autoconnect\
  \ Mode)\n\n顾如其名，自动连接会在项目添加到布局中时自动建立约束连接。可以使用图 19-4 所示的工具栏按钮来启用或禁用自动连接模式：\n\n![](img/as_4.2_view_options_autoconnect.jpg)\n\
  \n图 19-4\n\n自动连接模式使用算法根据控件的位置以及控件与父布局侧边和布局中其他元素的接近程度，决定要建立的最佳约束。如果任何自动约束连接未能提供预期的行为，可以在本章稍后部分进行手动更改。\n\
  \n### 19.3 推断模式 (Inference Mode)\n\n推断模式使用涉及算法和概率的启发式方法，在控件已添加到布局后自动实现约束连接。这种模式通常用于关闭了自动连接功能且在没有任何约束连接的情况下将对象添加到布局的情况。这允许通过从调色板将对象拖到布局画布上并进行尺寸和位置更改，直到布局符合要求，从而简单地设计布局。本质上，这涉及到“绘制”布局而不必担心约束。推断模式也可以在设计过程中的任何时候用于填充布局中缺失的约束。\n\
  \n点击推断约束按钮（图 19-5）时，约束会自动添加到布局：\n\n![](img/as_4.2_inference_mode.jpg)\n\n图 19-5\n\
  \n与自动连接模式一样，布局编辑器工具始终可能推断错误的约束，但这些可以手动修改和修正。\n\n### 19.4 手动操作约束\n\n实现约束连接的第三种选择是手动操作。在此过程中，了解布局编辑器中控件周围出现的各种句柄将帮助。例如，考虑图\
  \ 19-6 所示的控件：\n\n![](img/as_4.1_constraint_handles.jpg)\n\n图 19-6\n\n显然，弹簧状线条（A）代表从控件侧边到目标的已建立约束连接。对象每个角的正方形标记（B）是缩放句柄，点击并拖动时可调整控件尺寸。位于控件每侧的小圆形句柄（C）是侧约束锚点。要创建约束连接，点击句柄并将生成的线条拖到要连接的元素上（例如辅助线或父布局侧边或另一个控件的侧边），如图\
  \ 19-7 所示。连接到另一个控件的侧边时，只需将线条拖到该控件的侧约束句柄并在控件和句柄高亮时释放线条。\n\n![](img/as_4.1_constraint_drag_line.jpg)\n\
  \n图 19-7\n\n如果将约束线拖到控件并释放，但未连接到约束句柄，布局编辑器将显示一个包含可以附加约束的侧边列表。例如，在图 19-8 中，约束可以附加到目标按钮控件的顶部或底部边缘：\n\
  \n![](img/as_4.1_constraint_between_widgets.jpg)\n\n图 19-8\n\n\n\n\n\n额外的标记指示了基准约束（baseline\
  \ constraints）的锚点，其中组件内部的内容（而非外部边缘）被用作对齐点。要显示此标记，只需右键点击组件并选择 `Show Baseline`（显示基准）菜单选项。要从基准约束句柄建立约束连接，只需将鼠标指针悬停在句柄上直到其高亮，然后点击并拖动到目标位置（例如如图\
  \ 19-9 所示的另一个组件的基准锚点）。\n\n![](img/as_baseline_constraint.jpg)\n\nFigure 19-9\n\n\
  要隐藏基准锚点，再次右键点击组件并选择 `Hide Baseline`（隐藏基准）菜单选项。\n\n## 19.5 在检查器中添加约束\n\n也可以通过位于 `Attributes`\
  \ 工具窗口的 `Inspector`（检查器）面板向 Android Studio 布局编辑器中的视图添加约束，如图 19-10 所示。中间的正方形表示当前选中的视图，正方形周围的区域表示应用到视图相应侧的约束（如果有）：\n\
  \n![](img/as_3.5_constraint_attributes.jpg)\n\nFigure 19-10\n\n视图某侧缺少约束由一条指向带有加号的蓝色圆圈的虚线表示（如上图中视图底边所示）。要添加约束，只需点击此蓝色圆圈，布局编辑器将添加一个连接到它认为的布局内最合适目标的约束。\n\
  \n## 19.6 在属性窗口中查看约束\n\n可以通过显示 `Attributes` 工具窗口的 `Constraints`（约束）部分来查看当前选中组件上配置的约束列表，如下文所示图\
  \ 19-11 所示：\n\n![](img/as_3.5_attributes_constraints_list.jpg)\n\nFigure 19-11\n\
  \n点击列表中的约束将在设计布局中选中该约束。\n\n### 19.7 删除约束\n\n要删除单个约束，只需在设计布局或 `Attributes` 工具窗口中选择该约束使其高亮（例如在图\
  \ 19-12 中，选中了最右侧的约束并按下键盘上的 delete 键。该约束将从布局中移除。\n\n![](img/as_4.1_constraint_highlighted.jpg)\n\
  \nFigure 19-12\n\n另一种选项是在按住 `Ctrl` 键（macOS 上为 `Cmd`）并将鼠标指针悬停在约束锚点上，并在变为红色后点击锚点：\n\
  \n![](img/as_4.1_constraint_delete.jpg)\n\nFigure 19-13\n\n或者，通过右键点击组件并选择 `Clear\
  \ Constraints of Selection`（清除选中约束）菜单选项来移除该组件的所有约束。\n\n要移除布局中每个组件的所有约束，请使用图 19-14\
  \ 中高亮的工具栏按钮：\n\n![](img/as_4.2_clear_constraints.jpg)\n\nFigure 19-14\n\n## 19.8\
  \ 调整约束偏置\n\n在上一章中，概述了使用偏置设置偏于一个对立约束而非另一个约束的概念。Android Studio 布局编辑器工具中的偏置通过位于 `Attributes`\
  \ 工具窗口的 `Inspector` 进行调整，如图 19-15 所示。图中箭头指示的两个滑块用于控制当前选中组件的垂直和水平对立约束的偏置。\n\n![](img/as_3.2_constraint_bias_sliders.jpg)\n\
  \nFigure 19-15\n\n### 19.9 了解 ConstraintLayout 边距\n\n约束可以结合边距使用，以实现组件与另一个元素（如另一个组件、指南或父布局的侧边）之间的固定间隙。例如，考虑应用于图\
  \ 19-16 中 `Button` 对象的水平约束：\n\n![](img/as_4.1_constraint_no_margins.jpg)\n\nFigure\
  \ 19-16\n\n按照目前的配置，水平约束延伸到父 `ConstraintLayout` 的左右边缘。因此，该组件具有对立的水平约束，表明 `ConstraintLayout`\
  \ 布局引擎在运行时对组件的实际位置具有一定的裁量。这允许布局具有一定的灵活性以适应不同的屏幕尺寸和设备方向。水平偏置设置还能控制组件的位置一直直到布局的右侧。例如，图\
  \ 19-17 显示了对同一个按钮应用 100% 水平偏置的情况：\n\n![](img/as_4.1_constraint_bias_100.jpg)\n\n\
  Figure 19-17\n\n`ConstraintLayout` 边距可以出现在约束连接的末端，代表一个固定间隙，即使在调整偏置或响应活动其他处的布局变化，组件也无法移动到该区域内。在图\
  \ 19-18 中，右侧约束现在包含一个 `50dp` 的边距，即使调整偏置组件也无法移动此处。\n\n![](img/as_4.1_constraint_50.jpg)\n\
  \nFigure 19-18\n\n组件的现有边距值可以在 `Inspector` 中修改。如图 19-19 所示，使用下拉菜单更改右侧边距为 `16dp`。或者，点击当前值可以在字段中输入数字。\n\
  \n![](img/as_3.2_constraint_margins.jpg)\n\nFigure 19-19\n\n新约束的默认边距可以随时使用图 19-20\
  \ 所示工具栏中的选项进行更改：\n\n![](img/as_4.2_default_margin.jpg)\n\nFigure 19-20\n\n## 19.10\
  \ 对立约束和偏置的重要性\n\n如章所述，对立约束、边距和偏置是使用 `ConstraintLayout` 进行响应式布局设计的基石。当组件没有对立约束时，这些约束本质上是边距约束。这在布局编辑器中通过带有边距测量值的实线表示，如图\
  \ 19-21 所示。\n\n![](img/as_4.1_constraints_opposing.jpg)\n\nFigure 19-21\n\n上述约束基本上将组件固定在该位置。其结果是，当设备旋转到横屏模式时，组件将不再可见，因为垂直约束将其推出了设备屏幕顶部（如图\
  \ 19-22 所示）。如果程序在比设计过程中使用的屏幕小的设备上运行，也会出现类似的问题。\n\n![](img/as_4.1_constraints_opposing_landscape.jpg)\n\
  \nFigure 19-22\n\n实施对立约束时，约束连接由弹簧状锯齿线表示（弹簧的比喻旨在指示组件的位置并非固定在绝对 X 和 Y 坐标上）：\n\n![](img/as_4.1_constraints_opposing_constrained.jpg)\n\
  \nFigure 19-23\n\n在上述布局中，配置了垂直和水平偏置设置，组件始终位于距离底部 90% 处以及距离父布局左边缘 35% 处。因此，旋转后，组件仍然可见，并相对于屏幕尺寸保持在相同位置：\n\
  \n![](img/as_4.1_constraints_opposing_constrained_landscape.jpg)\n\nFigure 19-24\n\
  \n\n\n\n\n在设计响应式且自适应的用户界面布局时，手动设计用户界面布局以及对自动创建的约束进行修正时，考虑偏差（bias）和相反约束（opposing\
  \ constraints）是非常重要的。\n\n### 19.11 配置组件尺寸\n\n`ConstraintLayout` 中组件的内部维度可以使用 `Inspector`\
  \ 进行配置。如上一节所述，组件维度可以设置为 `wrap content`、`fixed` 或 `match constraint`（匹配约束）模式。当前选中组件的每个维度的流行设置显示在\
  \ `Inspector` 中代表组件的正方形内，如图图 19-25\n\n图 19-25\n\n在上方图中，水平和垂直维度都设置为 `wrap content`\
  \ 模式（由向内的 V 字形箭头指示）。检查器使用以下视觉指示器表示三个维度模式：\n\n| 固定尺寸 | ![](img/Image2826.jpg) |\n\
  | 匹配约束 | ![](img/Image2834.jpg) |\n| 适应内容 | ![](img/Image2844.jpg) |\n\n表 19-1\n\
  \n要更改当前设置，只需点击指示器即可在三个不同的设置之间循环。当布局编辑器中视图的维度设置为 `match constraint` 模式时，视图相应的边将用类似弹簧的线条而不是普通的实线绘制。例如，在图\
  \ 19-26 中，仅将视图的宽度被设置为 `match constraint`：\n\n![](img/Image2855.jpg)\n\n图 19-26\n\
  \n此外，可以使用 `Expand horizontally`（水平扩展）和 `Expand vertically`（垂直扩展）选项将组件的大小水平或垂直扩展到布局中约束和其他组件所允许的最大值。这些可以通过右键点击布局中的组件，并从生成的菜单中选择\
  \ `Organize`（组织）选项来访问这些（图 19-27）。使用时，当前选中的组件将在水平或垂直方向上增大尺寸以填充其周围的可用空间。\n\n![](img/as_4.1_constraint_organize_menu.jpg)\n\
  \n图 19-27\n\n### 19.12 设计时工具定位\n\n标题为 Android Studio 布局编辑器工具指南的章节引入了 `tools` 命名空间的概念，并解释了如何使用它设置仅在布局编辑器中生效的可见性属性。在后台，Android\
  \ Studio 还使用 `tools` 属性在组件无约束放置在布局中时保持其原有位置。例如，想象在禁用 `autoconnect` 模式的情况下将一个 `Button`\
  \ 放到布局中。虽然组件在预览画布中看起来处于正确位置，但运行应用时，它将出现在屏幕的左上角。这是因为组件没有约束来告诉父级 `ConstraintLayout`\
  \ 将其放置在哪里。\n\n组件在布局编辑器中看起来位于正确位置的原因是 Android Studio 设置了绝对的 `X` 和 `Y` 定位 `tools`\
  \ 属性，以便在添加约束之前将其保持在正确位置。在 XML 布局文件中，内容可能如下：\n\n```xml\n<Button\n    android:id=\"\
  @+id/button4\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:text=\"Button\"\n    tools:layout_editor_absoluteX=\"\
  111dp\"\n    tools:layout_editor_absoluteY=\"88dp\" />\n```\n\n一旦为组件添加了充分的约束，这些\
  \ `tools` 属性将由布局编辑器移除。一种快速识别哪些组件缺少约束而无需等待应用运行的实用技巧是，点击在图 19-28 中高亮显示的按钮，以切换 `tools`\
  \ 位置的可见性。任何跳转到左上角的组件都没有被完全约束，它们正通过临时的 `tools` 绝对 `X` 和 `Y` 定位属性固定在位。\n\n![](img/as_4.1_toggle_tools_positions.jpg)\n\
  \n图 19-28\n\n### 19.13 添加指南线\n\n指南线（Guidelines）提供了约束可以锚定的额外元素。可以通过通过右键点击布局并选择 `Vertical\
  \ Guideline`（垂直指南线）或 `Horizontal Guideline`（水平指南线）菜单选项，或者使用如图 19-29 所示的工具栏菜单选项来添加指南线：\n\
  \n![](img/as_4.2_guidelines_menu.jpg)\n\n图 19-29\n\n或者，可以从 `Palette`（调色板）的 `Helpers`\
  \ 部分拖动水平垂直 `Guidelines` 到布局画布或 `Component Tree`（组件树）面板：\n\n![](img/as_4.1_add_guideline_from_palette.jpg)\n\
  \n图 19-30\n\n一旦添加，指南线将以虚线的形式出现在布局中，只需通过点击并拖动该线即可移动。要建立到指南线的约束连接，点击组件的约束句柄，并在释放之前拖动到指南线。在图\
  \ 19-31 中，两个 `Buttons` 的左侧通过约束连接到一个指南线。垂直指南线的位置可以指定为距离父级左侧或右侧的绝对距离。在上方图中，例如，垂直指南线距离父级\
  \ `96dp`。\n\n![](img/as_4.1_constraint_guideline.jpg)\n\n图 19-31\n\n或者，指南线的位置可以是相对于父级整体宽度或高度的百分比。要切换这三种模式，选择指南线并点击指南线的顶部或起始（取决于指南线是垂直还是水平）。图\
  \ 19-32 显示了一个基于百分比的指南线：\n\n![](img/as_4.1_constraint_guideline_percentage.jpg)\n\
  \n图 19-32\n\n### 19.14 添加屏障\n\n屏障（Barriers）可以通过右键点击布局并从 `Add helpers...` 菜单中选择 `Vertical\
  \ Barrier`（垂直屏障）或 `Horizontal Barrier`（水平屏障），或者使用之前图 19-29 所示的工具栏选项来添加。或者，在 `Palette`\
  \ 的 `Helpers` 部分找到 `Barrier` 类型，并将它们拖放到布局画布或 `Component Tree` 面板。\n\n一旦向布局添加屏障，它将作为项出现在\
  \ `Component Tree`面板中：\n\n![](img/as_4.2_barrier_added.jpg)\n\n图 19-33\n\n要将视图作为参考视图（即控制屏障位置的视图），只需从\
  \ `Component Tree` 内部将组件拖到屏障条目上。在图 19-34 中，命名为 `textView1` 和 `textView2` 的组件被分配为\
  \ `barrier1` 的参考组件：\n\n![](img/as_4.2_barrier_children.jpg)\n\n图 19-34\n\n在添加参考视图后，需要配置屏障以指定其相对于这些视图的方向。这是屏障方向设置，当在\
  \ `Component Tree` 面中选择屏障时，在 `Attributes` 工具窗口中定义：\n\n![](img/as_4.1_layout_barrier_direction.jpg)\n\
  \n图 19-35\n\n下图显示了一个包含屏障的布局，其中 `textView1` 和 `textView2` 作为参考视图，`textView3` 作为受约束视图。由于屏障从参考视图的末端推向受约束视图，屏障方向已设置为\
  \ `end`：\n\n![](img/as_3.5_constraints_barrier.jpg)\n\n图 19-36\n\n\n\n\n\n# 向布局中添加组\n\
  \n要向布局中添加一个 `Group`（组），可以右键点击布局并在 `Add helpers..`（添加辅助工具）菜单中选择 `Group` 选项，或者如之前在\
  \ 图 19-29 中所示使用工具栏菜单选项。或者，在 `Palette`（调色板）的 `Helpers` 部分找到 `Group` 项，并将其拖动到布局画布或\
  \ `Component Tree`（组件树）面板上。\n\n要向组添加小部件，请在 `Component Tree` 中选择它们并将其拖动到 `Group`\
  \ 条目上。例如 图 19-37 显示了将三个选中的小部件添加到组中：\n\n```\n![](img/as_4.1_add_widgets_to_group.jpg)\n\
  ```\n图 19-37\n\n该组引用的任何小部件将以*斜体*形式显示在 `Component Tree` 中组条目的下方，如 图 19-38 所示。要从组中移除某个小部件，只需选择它并按下键盘上的\
  \ delete 键即可：\n\n```\n![](img/as_4.1_group_widget_list.jpg)\n```\n图 19-38\n\n一旦将小部件分配给组，请使用\
  \ `Attributes`（属性）工具窗口的 `Constraints`（约束）部分修改可见性设置：\n\n```\n![](img/as_4.1_group_visibility.jpg)\n\
  ```\n图 19-39\n\n## 19.16 使用 Flow 辅助工具\n\n可以像之前概述其他辅助工具一样，使用菜单或 `Palette` 添加 `Flow`（流）辅助工具。与\
  \ `Group` 辅助工具（图 19-37）一样，通过在 `Component Tree` 中将小部件拖动到 `Flow` 条目添加到 `Flow` 实例。添加\
  \ `Flow` 辅助工具并分配小部件后，在 `Component Tree` 中选择它并使用 `Attribute` 工具窗口的 `Common Attributes`（通用属性）部分配置流布局行为：\n\
  \n```\n![](img/as_4.1_flow_attributes.jpg)\n```\n图 19-40\n\n## 19.17 小部件组的对齐与分布\n\
  \n当布局选择了两个或多个小部件时，Android Studio 布局编辑器提供了一系列对齐和分布操作。只需 Shift 点击要包含在内的每个小部件，右键点击布局并从\
  \ `Align`（对齐）菜单显示的众多选项中进行选择：\n\n```\n![](img/as_4.1_constraints_align.jpg)\n```\n\
  图 19-41\n\n如下方的 图 19-42 所示，这些选项也可以通过布局编辑器工具栏上的 `Align` 按钮访问：\n\n```\n![](img/as_4.1_constraints_align_menu.jpg)\n\
  ```\n图 19-42\n\n同样，`Pack`（打包）菜单（图 19-43）可用于重新定位所选小部件，使其在垂直或水平方向上紧密排列在一起。它通过更改小部件的绝对\
  \ `x` 和 `y` 坐标来实现，但不会应用任何约束。另一方面，`Pack` 菜单中的两个分布选项会移动所选小部件，使它们在垂直或水平轴上均匀间距分布，并在视图之间应用约束以保持此间距。\n\
  \n```\n![](img/as_3.2_constraints_pack_menu.jpg)\n```\n图 19-43\n\n### 19.18 将其他布局转换为\
  \ ConstraintLayout\n\n对于使用一个或多个其他布局类（例如 `RelativeLayout` 或 `LinearLayout`）的现有界面布局，布局编辑器提供了将其转换为\
  \ `ConstraintLayout` 的选项。\n\n当布局编辑器打开并处于设计（Design）模式时，显示 `Component Tree` 面板。要将布局转换为\
  \ `ConstraintLayout`，在 `Component Tree` 中找到布局，右键点击并选择 `Convert to ConstraintLayout`\
  \ 选项：\n\n```\n![](img/as_3.4_layout_to_constraintlayout.jpg)\n```\n\n### 19.19 总结\n\
  \n结合 `ConstraintLayout` 布局编辑器设计复杂的界面布局是一个相对快速且直观的过程。本章涵盖了约束、边距和偏置的概念，并详细介绍了如何创建链（Chains）。\n\
  \n\n\n\n\n```xml\napp:layout_constraintStart_toEndOf=\"@+id/button1\"\napp:layout_constraintTop_toTopOf=\"\
  parent\" />\n\n<Button\n    android:id=\"@+id/button3\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:layout_marginEnd=\"\
  8dp\"\n    android:layout_marginTop=\"16dp\"\n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"\
  0.5\"\n    app:layout_constraintEnd_toEndOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\"\n    app:layout_constraintStart_toEndOf=\"@+id/button2\" />\n```\n\n通过这些更改，小部件现在配置了双向水平约束。这在本质上构成了一个\
  \ `ConstraintLayout` 链（chain），在布局编辑器中通过链连接视觉化表示，如下方的图 20-2 所示。注意，在此配置中，链默认使用了散开链样式（spread\
  \ chain style）。\n\n![](img/as_4.1_layout_horizontal_chain.jpg)\n\n图 20-2\n\n也可以通过右键点击其中一个视图并选择\
  \ `Chains -> Create Horizontal Chain（创建水平链）或 `Chains -> Create Vertical Chain（创建垂直链）\
  \ 菜单选项来创建链。\n\n## 20.2 更改链样式\n\n如果没有配置链样式，`ConstraintLayout` 将默认使用散开链样式。可以通过右键点击链中的任何小部件并选择\
  \ `Cycle Chain Mode（循环链模式）菜单选项来更改链样式。每次点击该菜单选项，样式都会按照散开（spread）、内部散开（spread inside）和打包（packed）的顺序切换到另一个设置。\n\
  \n或者，可以在属性（Attributes）工具窗口中指定样式，展开 `layout_constraints` 属性并根据链的方向更改 `horizontal_chainStyle`\
  \ 或 `vertical_chainStyle` 属性：\n\n![](img/as_4.1_chain_style_attribute.jpg)\n\n图\
  \ 20-3\n\n## 20.3 内部散开链样式\n\n图 20-4 展示了使用上述技术将链样式更改为内部散开链样式的效果：\n\n![](img/as_4.1_layout_horizontal_chain_spread_inside.jpg)\n\
  \n图 20-4\n\n## 20.4 打包链样式\n\n使用相同的技术，将链样式属性更改为打包（packed）会导致布局发生变化，如图 20-5 所示：\n\n\
  ![](img/as_4.1_layout_horizontal_chain_packed.jpg)\n\n图 20-5\n\n## 20.5 带有偏置的打包链\n\
  \n打包链的位置可能会受到偏置值（bias）的影响。偏置可以是 `0.0` 到 `1.0` 之间的任何值，其中 `0.5` 代表父容器的中心。偏置通过选择链头小部件并在属性面板中为\
  \ `layout_constraintHorizontal_bias` 或 `layout_constraintVertical_bias` 属性赋值来控制。图\
  \ 20-6 显示了一个水平偏置设为 `0.2` 的打包链：\n\n![](img/as_4.1_layout_horizontal_chain_packed_bias.jpg)\n\
  \n图 20-6\n\n## 20.6 加权链\n\n要探索的链的最后一个区域涉及单个小部件的权重，以控制链中每个小部件在可用空间中所占据的比例。加权链只能使用散开链样式实现，并且链中任何要响应权重属性的小部件必须将其相应的维度属性（垂直链为\
  \ `height`，水平链为 `width`）配置为 `match constraint（匹配约束）`模式。小部件维度的 `match constraint`\
  \ 模式可以通过选择小部件、显示属性面板并将维度更改为 `match_constraint`（等同于 `0dp`）来配置。在图 20-7 中，例如，按钮的 `layout_width`\
  \ 约束已设置为 `match_constraint` (`0dp`)，这表示小部件的宽度将根据现行的约束设置来确定：\n\n![](img/as_3.5_chain_match_constraints.jpg)\n\
  \n图 20-7\n\n假设已选择散开链样式，并且三个按钮都已配置为宽度维度设置为匹配约束，则链中的小部件将等宽扩展以填充可用空间：\n\n![](img/as_4.1_layout_horizontal_chain_match_constraints.jpg)\n\
  \n图 20-8\n\n每个小部件相对于链中其他小部件所占据空间的大小可以通过向小部件添加权重属性来控制。图 20-9 显示了将 `button1` 的 `layout_constraintHorizontal_weight`\
  \ 属性设为 `4`，将 `button2` 和 `button3` 的属性均设为 `2` 的效果：\n\n![](img/as_4.1_layout_horizontal_chain_weight.jpg)\n\
  \n图 20-9\n\n由于这些权重值，`button1` 占据了的一分之一的空间，而 `button2` 和 `button3` 各占据了四分之一的空间。\n\
  \n## 20.7 使用比例\n\n`ConstraintLayout` 比例允许小部件的一个维度相对于另一个维度进行调整。通过将维度设置为匹配约束并在小部件上配置\
  \ `layout_constraintRatio` 属性可以配置宽高比例。例如，下面的 XML 代码段为 `ImageView` 配置了 `2:1` 的比例：\n\
  \n```xml\n<ImageView\n    android:layout_width=\"0dp\"\n    android:layout_height=\"\
  100dp\"\n    layout_constraintRatio=\"2:1\" />\n```\n\n上面的示例演示了当仅一个维度设置为匹配约束时如何配置比例。当两个维度都设置为匹配约束时，也可以应用比例。这需要在比例前指定一个\
  \ `H` 或 `W`，以指明哪一个维度是受约束的。例如，考虑以下 `ImageView` 对象的 XML 代码段：\n\n```xml\n<ImageView\n\
  \    android:layout_width=\"0dp\"\n    android:layout_height=\"0dp\"\n    android:id=\"\
  @+id/imageView\"\n    app:layout_constraintBottom=\"parent\"\n    app:layout_constraintRight_toRight=\"\
  parent\"\n    app:layout_constraintLeft_toLeft=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\"\n    app:layout_constraintRatio=\"W,1:3\" />\n```\n\n在上面的示例中，高度将根据应用于它的约束来定义。在这种情况下，约束配置为连接父容器的顶部和底部，从而使小部件填充整个父容器的高度。另一方面，宽度维度被约束为\
  \ ImageView 高度的三分之一。\n\n同样的结果也可以无需手动编辑 XML 资源文件来实现。每当小部件维度设置为 `match constraint`\
  \ 模式时，属性面板中的检查器区域就会出现一个比例控制开关。图 20-10 例如显示了一个按钮小部件的布局宽度和高度属性分别设置为匹配约束模式和 `100dp`，并突亮了小部件尺寸预览中的比例控制开关：\n\
  \n![](img/as_3.2_toggle_aspect_ratio_constraint.jpg)\n\n图 20-10\n\n默认情况下，比例尺寸控制是关闭的。点击该控件将启用比例约束并显示一个可以更改比例的额外字段：\n\
  \n![](img/as_3.2_toggle_aspect_ratio_settings.jpg)\n\n图 20-11\n\n## 20.8 总结\n\n\n\
  \n\n\n约束（Constraints）和比例（Ratios）都是 `ConstraintLayout` 类的强大功能，旨在为 Android 应用中设计灵活且响应式的用户界面布局提供额外选项。正如本章概述，Android\
  \ Studio 布局编辑器已经经过增强，以便在用户界面设计过程中更容易地使用这些功能。\n\n# 21. Android Studio 布局编辑器 ConstraintLayout\
  \ 教程\n\n到目前为止，为 Android 应用设计用户界面最简单且高效的方法是使用 Android Studio 布局编辑器。本章的目标是概述如何使用这种方法创建基于\
  \ `ConstraintLayout` 的用户界面。本章包含的练习也将作为概述从“骨架” Android Studio 项目开始创建一个 Activity 的机会。\n\
  \n在介绍 Android Studio 布局编辑器用法后，本章还将引入布局检查（Layout Inspector）工具。\n\n## 21.1 Android\
  \ Studio 布局编辑器工具示例\n\n此示例的第一步是创建一个新的 Android Studio 项目。因此，请先启动 Android Studio，通过选择\
  \ `File -> Close Project` 菜单关闭任何之前打开的项目。\n\n在欢迎界面上选择 `New Project`（新建项目）选项。在之前的示例中，我们要求\
  \ Android Studio 为项目创建一个模板 Activity。然而，我们将利用此教程学习如何手动创建一个全新的 Activity 和相应的布局资源文件，因此请在点击\
  \ `Next` 按钮之前确保已选择 `No Activity`（无 Activity）选项。\n\n在 `Name` 字段中输入 `LayoutSample`\
  \ 并指定 `com.ebookfrenzy.layoutsample` 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level`\
  \ 设置为 `API 26: Android 8.0 (Oreo)`，并将 `Language` 菜单设置为 `Java`。\n\n## 21.2 创建新 Activity\n\
  \n项目创建过程完成后，将出现 Android Studio 主窗口。项目的第一步是创建一个新的 Activity。这是一个非常有价值的练习练习，因为在开发 Android\
  \ 应用的过程中，有很多情况需要从零创建新的 Activity。\n\n使用 `Alt-1/Cmd-1` 快捷键显示 `Project`（项目）工具窗口（如果尚未可见）。一旦显示了\
  \ Android 层级结构，点击 `Project` 窗口中条目右侧的箭头来展开它。这里的目标是访问项目层级结构中的 `app -> java -> com.ebookfrenzy.layoutsample`\
  \ 文件夹。包名可见后，右键点击它，并选择 `New -> Activity -> Empty Activity` 菜单选项，如 图 21-1 所示。或者，选择\
  \ `New -> Activity -> Gallery...` 选项来浏览可用模板并使用 `New Android Activity` 对话进行选择。\n\n\
  ![](img/Image2435.jpg)\n\n图 21-1\n\n在生成的 `New Android Activity` 对话中，将新 Activity\
  \ 命名为 `MainActivity`，布局命名为 `activity_main`。Activity 自然需要一个布局资源文件，因此确保已启用 `Generate\
  \ a Layout File`（生成布局文件）选项。\n\n为了应用程序能够在设备上运行，必须指定一个 Activity 作为启动 Activity（Launcher\
  \ Activity）。如果没有启动 Activity，操作系统将不知道在应用程序首次启动时启动哪个 Activity，导致应用程序无法启动。由于此示例只有一个\
  \ Activity，它需要被指定为应用的启动 Activity，因此在点击 `Finish` 按钮之前确保已启用 `Launcher Activity` 选项。\n\
  \n此时，Android Studio 应该已向项目添加两个文件。Activity 的 Java 源代码文件位于 `app -> java -> com.ebookfrenzy.layoutsample`\
  \ 文件夹中。\n\n此外，用户界面的 XML 布局文件应该已创建在 `app -> res -> layout` 文件夹中。注意，此 Activity 选择了\
  \ `Empty Activity` 模板，因此布局完全包含在 `activity_main.xml` 文件中，没有独立的布局文件。此外，由于我们不会编写任何代码来访问用户界面布局中的视图，因此没有将将项目支持视图绑定（view\
  \ binding）。\n\n最后，新 Activity 应该已添加到 `AndroidManifest.xml` 文件并指定为启动 Activity。清单文件可以在项目窗口的\
  \ `app -> manifests` 文件夹下找到，并应包含以下 XML：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.layoutsample\">\n\n    <application\n      android:allowBackup=\"\
  true\"\n      android:icon=\"@mipmap/ic_launcher\"\n      android:label=\"@string/app_name\"\
  \n      android:roundIcon=\"@mipmap/ic_launcher_round\"\n      android:supportsRtl=\"\
  true\"\n      android:theme=\"@style/AppTheme\">\n      <activity android:name=\"\
  .MainActivity\">\n          <intent-filter>\n              <action android:name=\"\
  android.intent.action.MAIN\" />\n              <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n          </intent-filter>\n      </activity>\n    </application>\n</manifest>\n\
  ```\n\n## 21.3 准备布局编辑器环境\n\n找到并双击 `app -> res -> layout` 文件夹中的 `activity_main.xml`\
  \ 布局文件以将其加载到布局编辑器。由于本教程的目的是获得约束经验，请使用布局工具栏上的按钮关闭 `Autoconnect`（自动连接）功能。禁用后，按钮将出现划线，如\
  \ 图 21-2 所示：\n\n![](img/4_2.jpg)\n\n图 21-2\n\n如果 Autoconnect 右侧的默认边距值不是 `8dp`，点击它并从结果面板选择\
  \ `8dp`。\n\n用户界面设计还将使用 `ImageView` 对象显示图像。在继续之前，应将此图像添加到项目中以供使用。该文件名为 `galaxys6.png`，可以在从以下\
  \ URL 获取的示例代码 `project_icons` 文件夹中找到：\n\n[`www.ebookfrenzy.com/retail/arcticjava/index.php`](https://www.ebookfrenzy.com/retail/arcticjava/index.php)\n\
  \n在 Android Studio 中，显示 `Resource Manager` 工具窗口（View -> Tool Windows -> Resource\
  \ Manager）。在文件导航器中找到 `galaxys6.png` 图像并将其拖放到 Resource Manager 工具窗口。在生成的对话框中，点击 `Next`\
  \ 然后点击 `Import` 按钮将图像添加到项目。图像现在应如下 图 21-3 所示：\n\n![](img/as_4_1.jpg)\n\n图 21-3\n\
  \n图像还将出现在 `Project` 工具窗口的 `res -> drawables` 部分：\n\n![](img/Image2451.jpg)\n\n图\
  \ 21-4\n\n## 21.4 向用户界面添加控件\n\n从 `Common`调色板类别中，将 `ImageView` 对象拖入显示视图的中心。注意，会出现水平和垂直虚线表示显示中心轴。当居中时，释放鼠标按钮将视图放置到位位置。一旦放置在布局中，`Resources`\
  \ 对话框将出现，请求视图中显示的图像。在对话框顶部搜索栏中输入“galaxy”以找到 `galaxys6.png` 资源，如 图 21-5 所示。\n\n![](img/as_3_6.jpg)\n\
  \n图 21-5\n\n\n\n\n\n选择图像并点击 OK 将其分配给 `ImageView` 对象。如有必要，使用缩放手调整 `ImageView` 的大小，并将其重新置在布局的中心。此时，布局应与图\
  \ 21-6 所示：\n\n![](img/as_3.5_layout_sample_imageview_added.jpg)\n\n图 21-6\n\n从调色板的常用（Common）部分点击并拖动\
  \ `TextView` 对象，并将其位置放置在 `ImageView` 之上，如图 21-7 所示。\n\n使用属性（Attributes）面板，展开常用属性（Common\
  \ Attributes）部分中的 `textAppearance` 属性条目，将 `textSize` 属性更改为 `24sp`，将 `textAlignment`\
  \ 设置为 `center`，并将文本更改为“Samsung Galaxy S6”。\n\n![](img/as_3.5_layout_sample_textview_added.jpg)\n\
  \n图 21-7\n\n接下来，在布局底部添加三个 `Button` 控件，并将这些视图的文本属性设置为“Buy Now”、“Pricing”和“Details”。完成后的布局现在应与图\
  \ 21-8 所示：\n\n![](img/as_4.1_layout_sample_ui.jpg)\n\n图 21-8\n\n此时，控件尚未足够的约束，以至于布局引擎能够在运行时对控件进行定位和调整大小。如果应用程序现在运行，所有控件都将位于在显示器的左上角。\n\
  \n在布局中添加控件后，使用位于布局编辑器（Layout Editor）工具栏中的设备旋转按钮（如图 21-9 中的箭头所示）来查看横向模式下的用户界面：\n\n\
  ![](img/as_4.2_layout_rotate.jpg)\n\n图 21-9\n\n由于缺少约束，布局无法适应设备方向的变化，使得内容偏离中心，并且部分图像和所有三个按钮都位于在屏幕可视区域之外。显然，为了使之成为一个响应式用户界面，还需要做一些工作。\n\
  \n## 21.5 添加约束\n\n约束是创建能够适应设备方向变化和不同屏幕尺寸布局的关键。首先将布局旋转回竖屏模式，并选择位于 `ImageView` 之上的\
  \ `TextView` 控件。选中控件后，从 `TextView` 的左侧、右侧和顶部建立到父级 `ConstraintLayout` 对应侧的约束，如图 21-10\
  \ 所示：\n\n![](img/as_3.5_layout_sample_textview_constraints.jpg)\n\n图 21-10\n\n约束\
  \ `TextView` 控件后，选择 `ImageView` 实例，并在左侧和右侧建立对立约束，每个约束连接到父级布局的对应侧。接下来，从 `ImageView`\
  \ 的顶部到 `TextView` 的底部建立约束连接，并从 `ImageView` 的底部到中间 `Button` 控件的顶部建立约束连接。如有必要，点击并拖动\
  \ `ImageView`，使其仍位于布局的垂直中心。\n\n在 `ImageView` 仍被选中的情况下，使用属性面板中的检查器（Inspector）将 `ImageView`\
  \ 的顶部和底部边距分别更改为 `24` 和 `8`，并将控件的高度和宽度维度属性均更改为 `match_constraint`，以便控件将调整大小以匹配约束。这些设置将允许布局引擎在需要增大或缩小\
  \ `ImageView` 的大小以适应布局变化：\n\n![](img/as_33_layout_attributes.jpg)\n\n图 21-11\n\n\
  图 21-12 显示了 `ImageView` 相对于布局中其他元素当前实施的约束：\n\n![](img/as_4.1_layout_sample_ui_constrained.jpg)\n\
  \n图 21-12\n\n最后的任务是为三个 `Button` 控件添加约束。在本例中，按钮将放置在链（chain）中。首先通过点击图 21-2 中高亮的工具栏按钮，在布局编辑器中开启自动连接（Autoconnect）。\n\
  \n接下来，点击 Buy Now 按钮，然后按住 Shift 并点击另外两个按钮，使三个按钮都被选中。右键点击 Buy Now 按钮，并在弹出的菜单中选择 `Chains\
  \ -> Create Horizontal Chain` 选项。默认情况下，链将使用展开（spread）样式显示，这是本例的正确行为。\n\n最后，在 Buy\
  \ Now 按钮的底部和布局底部之间建立约束。对剩余按钮重复此步骤。\n\n完成这些步骤后，按钮应如图 21-13 所示被约束好：\n\n![](img/as_4.1_layout_sample_chain.jpg)\n\
  \n图 21-13\n\n## 21.6 测试布局\n\n在布局中添加约束后，将屏幕旋转到横向模式，并验证布局是否适应了新的屏幕尺寸。\n\n虽然布局编辑器工具提供了一个设计用户界面布局的有用视觉环境，但在涉及测试时，运行应用程序的测试是不可替代的。在物理\
  \ Android 设备或模拟器会话上启动应用程序，并验证用户界面是否反映了在布局编辑器中创建的布局。图 21-14 例如展示了横向模式下的运行应用程序：\n\n\
  ![](img/as_4.1_layout_sample_completed.jpg)\n\n图 21-14\n\n用户界面设计现在完成。设计更复杂的用户界面布局是上述步骤的延续。只需将视图拖放到显示器上，根据需要定位、约束并设置属性。\n\
  \n## 21.7 使用布局检查器（Layout Inspector）\n\n可以使用布局检查器随时查看组成用户界面的层次结构。为了访问此信息，应用程序必须在运行\
  \ API 29 或更高版本的设备或模拟器上运行。应用程序运行后，选择 `Tools -> Layout Inspector` 选项，然后按照图 21-15 中标记\
  \ A 所示选择要检查的过程）。\n\n一旦检查器加载，最左侧面板（B）显示组成用户界面布局的层次结构。中间面板（C）显示布局的视觉表示。在视觉布局上点击控件将使列表中的项高亮，从而轻松找到视觉组件在整个布局层次中的位置。\n\
  \n最后，最右侧面板（图 21-15 标记 D））包含当前选中组件的所有属性设置，允许对组件的内部配置进行深入分析。在适当的情况下，值单元格将包含指向项目源码中属性设置位置的链接。\n\
  \n![](img/as_layout_inspector.jpg)\n\n图 21-15\n\n要以 3D 视图查看布局，请点击标记为 E 的按钮。这将显示层次结构的“爆炸”表示，以便对其进行旋转和检查。这对于识别被遮挡视图的任务非常有用：\n\
  \n![](img/as_4.1_layout_inspector_layer_spacing.jpg)\n\n图 21-16\n\n点击并拖动渲染图在三维空间内旋转，使用上方箭头所示的滑块增加层之间的间距。再次点击标记为\
  \ E 的按钮返回 2D 视图。\n\n## 21.8 总结\n\n\n\n\n\nAndroid Studio 中的布局编辑器（Layout Editor）工具与\
  \ `ConstraintLayout` 类紧密集成。本章通过一个示例用户界面的创建，概述了如何使用布局编辑器工具通过添加组件和设置约束来实现基于 `ConstraintLayout`\
  \ 的用户界面。本章还介绍了实时布局检查器（Live Layout Inspector）工具，该工具对于分析用户界面布局的结构组成非常有帮助。\n\n# 22.\
  \ 在 Android Studio 中手动设计 XML 布局\n\n虽然使用 Android Studio 布局编辑器设计布局可以极大提高效率，但仍然可以通过手动编辑\
  \ XML 来创建 XML 布局。本章将介绍 Android XML 布局文件格式的基础。\n\n## 22.1 手动创建 XML 布局\n\nXML 布局文件的结构实际上非常简单，它遵循视图树的层次结构方法。XML\
  \ 资源文件的第一行理想情况下包含以下标准声明：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n\
  ```\n\n该声明之后应当是布局的根元素，通常是一个容器视图（例如布局管理器）。它由起始标签和结束标签表示，并包含需要在视图上设置的任何属性。例如，下面的 XML\
  \ 声明了一个 `ConstraintLayout` 视图作为根元素，分配了 ID `activity_main` 并设置了 `match_parent` 属性，使其填充设备显示的所有可用空间：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:id=\"@+id/activity_main\"\n    android:layout_width=\"match_parent\"\
  \n    android:layout_height=\"match_parent\"\n    android:paddingLeft=\"16dp\"\n\
  \    android:paddingRight=\"16dp\"\n    android:paddingTop=\"16dp\"\n    android:paddingBottom=\"\
  16dp\"\n    tools:context=\".MainActivity\">\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n注意，在上面的示例中，布局元素每个侧都配置了 16dp（密度无关像素）的内边距（padding）。Android 布局中的任何间距规范都必须使用以下测量单位之一：\n\
  \n* `in` – 英寸。\n* `mm` – 毫米。\n* `pt` – 磅（1/72 英寸）。\n* `dp` – 密度无关像素。一种根据设备显示物理密度相对于\
  \ 160dpi 显示基准计算的抽象测量单位。\n* `sp` – 缩放无关像素。与 `dp` 类似，但会根据用户的字体偏好进行缩放。\n* `px` – 实际屏幕像素。不建议使用，因为不同的显示器每英寸像素不同。建议使用\
  \ `dp` 而不是此单位。\n\n任何需要添加到 `ConstraintLayout` 父元素的子元素都必须嵌套在起始标签和结束标签之间。在接下来的示例中，添加了一个\
  \ `Button` 组件作为 `ConstraintLayout` 的子元素：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n    xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    android:id=\"@+id/activity_main\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    android:paddingLeft=\"16dp\"\n    android:paddingRight=\"16dp\"\n    android:paddingTop=\"\
  16dp\"\n    android:paddingBottom=\"16dp\"\n    tools:context=\".MainActivity\"\
  >\n    <Button\n        android:text=\"@string/button_string\"\n        android:layout_width=\"\
  wrap_content\"\n        android:layout_height=\"wrap_content\"\n        android:id=\"\
  @+id/button\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n```\n\n\
  按照目前的实现，该按钮没有任何约束。因此，在运行时，按钮将出现在屏幕的左上角（由于父元素分配的内边距，缩进了 16dp）。然而，如果为按钮两侧添加了对立的约束，它将出现在布局内：\n\
  \n```xml\n<Button\n    android:text=\"@string/button_string\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:id=\"@+id/button\"\
  \n    app:layout_constraintBottom_toBottomOf=\"parent\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n```\n\n注意，每个约束都都连接到名为 `activity_main` 的元素上，在本例中，它是父级 `ConstraintLayout`\
  \ 实例。\n\n要向布局中添加第二个组件，只需将其嵌入 `ConstraintLayout` 元素的正体中。例如，下面的修改向布局中添加了一个 `TextView`\
  \ 组件：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:id=\"@+id/activity_main\"\n    android:layout_width=\"match_parent\"\
  \n    android:layout_height=\"match_parent\"\n    android:paddingLeft=\"16dp\"\n\
  \    android:paddingTop=\"16dp\"\n    android:paddingRight=\"16dp\"\n    android:paddingBottom=\"\
  16dp\"\n    tools:context=\".MainActivity\">\n    <Button\n        android:text=\"\
  @string/button_string\"\n        android:layout_width=\"wrap_content\"\n       \
  \ android:layout_height=\"wrap_content\"\n        android:id=\"@+id/button\"\n \
  \       app:layout_constraintBottom_toBottomOf=\"parent\"\n        app:layout_constraintEnd_toEndOf=\"\
  parent\"\n        app:layout_constraintStart_toStartOf=\"parent\"\n        app:layout_constraintTop_toTopOf=\"\
  parent\" />\n    <TextView\n        android:text=\"@string/text_string\"\n     \
  \   android:layout_width=\"wrap_content\"\n        android:layout_height=\"wrap_content\"\
  \n        android:id=\"@+id/textView\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n再次，新添加的 `TextView` 缺少约束会导致它在运行时出现在布局的左上角。下面的修改添加了连接到父布局的对立约束，使组件水平居中，并将 `TextView`\
  \ 的底部连接到按钮的顶部：\n\n```xml\n<TextView\n    android:id=\"@+id/textView\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:layout_marginTop=\"\
  8dp\"\n    android:layout_marginBottom=\"8dp\"\n    android:text=\"@string/text_string\"\
  \n    app:layout_constraintBottom_toTopOf=\"@+id/button\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n```\n\n同样注意 `Button` 和 `TextView` 视图声明有很多属性。两个视图都分配了 ID，并配置为显示由 `button_string`\
  \ 和 `text_string` 字符串资源表示文本。此外，两个对象都声明了 `wrap_content` 高和宽属性，以便它们的大小适应内容（在此情况下为字符串资源值引用的文本）。\n\
  \n在布局编辑器设计模式的预览面板中查看，上述布局的渲染结果如 图 22-1 所示：\n\n![](img/as_4.2_manual_xml_ui.jpg)\n\
  \n图 22-1\n\n## 22.2 手动 XML 与可视化布局设计\n\n手动编写 XML 还是使用设计模式下的布局编辑器工具取决于个人喜好。然而，使用设计模式具有其优势。\n\
  \n\n\n\n\n首先，设计模式通常会更快，因为它避免了编写大量 XML 代码的必要性。此外，设计模式还避免了学习 Android SDK 视图类各种属性值的复杂细节。你不需要不断查阅\
  \ Android 文档来寻找正确的关键字和值，大多数属性都可以通过“属性（Attributes）”面板找到。\n\n抛开设计模式的所有优点暂不谈，重要的是记住，用户界面设计的这两种方法并不是互斥的。作为一名应用程序开发者，你很可能会在设计模式下创建用户界面，同时通过直接编辑生成的\
  \ XML 资源对设计进行精调和布局调整。毕竟，界面设计的这两种视图在 Android Studio 环境中并排显示，这使得在 XML 和视觉化布局之间进行无缝工作变得易轻松。\n\
  \n## 22.3 总结\n\nAndroid Studio 布局编辑器（Layout Editor）工具提供了一种视觉直观的方法来设计用户界面。通过使用拖放式范式结合一组属性编辑器，该工具为应用程序开发者带来了显著的生产力优势。\n\
  \n用户界面设计也可以通过手动编写 XML 布局资源文件来实现，这些文件的结构良好且易于理解。\n\n布局编辑器工具可以生成 XML 资源文件，这一事实意味着这两种界面设计方法可以结合，为用户界面开发提供一种“两者的结合”的方法。\n\
  \n## 23. 使用约束集管理约束\n\n在本书为止，所有的用户界面设计任务都是使用 Android Studio 布局编辑器完成的，无论是文本模式还是设计模式。编写\
  \ XML 资源文件或使用 Android Studio 布局编辑器的替代方案是编写 Java 代码来直接创建、配置和操作组成 Android Activity\
  \ 用户界面的视图对象。在本章中，我们将在描述编写 Java 代码创建用户界面的某些优缺点之前，先探索其中的一些关键概念，例如视图属性以及布局约束的创建和管理。\n\
  \n在下一章中，将创建并使用一个示例项目来演示这种创建 Android 用户界面方法涉及的一些典型步骤。\n\n## 23.1 Java 代码与 XML 布局文件\n\
  \n与编写 Java 代码相比，使用 XML 资源文件设计用户界面具有许多关键优势。事实上，Google 在 Android 文档中花费了大量篇幅来赞扬 XML\
  \ 资源优于 Java 代码的优点。正如上一节所讨论的，XML 方法的一个关键优势可以使用 Android Studio 布局编辑器工具，而该工具本身会生成 XML\
  \ 资源。第二个优势是，一旦创建了应用程序，只需修改 XML 文件即可对用户界面屏幕进行更改，从而避免了重新编译应用程序的必要性。此外，即使手动编写 XML 布局，也可以通过\
  \ Android Studio 布局编辑器的预览功能获取用户界面外观的即时反馈。为了测试 Java 创建的用户界面的外观，开发者不可避免地需要反复进行编写代码、编译和测试的循环以完成设计工作。\n\
  \n在 Java 代码创建布局的优势方面，Java 相比 XML 资源文件最显著的优势可能出现在处理动态用户界面时。XML 资源文件在定义静态布局时本质上最有用，换句话说，就是在一个\
  \ Activity 的每次调用之间不太可能发生显著变化的布局。另一方面，Java 代码非常适合在运行时动态创建用户界面。这在用户界面可能受外部因素影响而在每次执行\
  \ Activity 时显示出不同不同的情况下尤为有用。\n\n当需要在 Activity 运行时对基于静态 XML 资源的布局进行动态更改时，掌握在 Java\
  \ 代码中操作用户界面组件的知识也会有用。\n\n最后，某些开发者简单倾向于编写 Java 代码而不是使用布局工具和 XML，无论后两种方法提供了哪些优势。\n\
  \n## 23.2 创建视图\n\n如前所述，Android SDK 包含了一个视图类工具箱，旨在满足大多数基础的用户界面设计需求。在 Java 中创建视图仅仅是创建这些类的实例，并将与该视图要关联的\
  \ Activity 引用作为参数传递。\n\n第一个视图（通常是一个可以添加额外子视图的容器视图）通过调用 Activity 的 `setContentView()`\
  \ 方法显示给用户。可以通过调用对象的 `addView()` 方法向根视图添加额外的视图。\n\n当使用 Java 代码操作包含在 XML 布局资源文件中的视图时，必须获取视图的\
  \ ID。对于在 Java 中创建的视图也遵循相同的规则。因此，对于任何在后续 Java 代码中需要某些类型访问的视图，都有必要分配一个 ID。这是通过调用相关视图对象的\
  \ `setId()` 方法实现的。在随后的代码中，可以通过对象的 `getId()` 方法获取视图的 ID。\n\n## 23.3 视图属性\n\n每个视图类都关联有一系列属性。这些属性设置直接设置在视图实例上，通常定义了视图对象将如何显示或行为。属性的示例包括显示在\
  \ `Button` 对象上的文本，或 `ConstraintLayout` 视图的背景颜色。Android SDK 中的每个视图类都有一组预定义的方法，允许用户设置和获取这些属性值。例如，`Button`\
  \ 类有一个 `setText()` 方法，可以从 Java 代码内部调用，将按钮上显示的文本设置为特定的字符串值。相反，`ConstraintLayout`\
  \ 对象的背景颜色可以通过调用对象的 `setBackgroundColor()` 方法来设置。\n\n### 23.4 约束集\n\n虽然属性设置是视图内部的并决定了视图的显示和行为，但约束集用于控制视图相对于其父视图和其他兄弟视图的显示。每个\
  \ `ConstraintLayout` 实例都关联有一组约束，定义了子视图的定位和约束。\n\n在 Java 代码中处理约束集的关键是 `ConstraintSet`\
  \ 类。该类包含一系列方法，允许对 `ConstraintLayout` 实例执行创建、配置和应用约束等任务。此外，可以将 Layout 实例的当前约束复制到\
  \ `ConstraintSet` 对象中，并应用于其他布局（无论是否修改）。\n\n`ConstraintSet` 实例的创建就像任何其他 Java 对象一样：\n\
  \n```\nConstraintSet set = new ConstraintSet();\n```\n\n一旦创建了约束集，就可以在实例上调用方法来执行广泛的任务。\n\
  \n### 23.4.1 建立连接\n\n`ConstraintSet` 类的 `connect()` 方法用于建立视图之间的约束连接。以下代码配置了一个约束集，其中\
  \ `Button` 视图的左侧连接到 `EditText` 视图的右侧，间距为 70dp：\n\n```\nset.connect(button1.getId(),\
  \ ConstraintSet.LEFT, editText1.getId(), ConstraintSet.RIGHT, 70);\n```\n\n### 23.4.2\
  \ 将约束应用到布局\n\n\n\n\n\n一旦配置了约束集，必须将其应用到 `ConstraintLayout` 实例上才能生效。约束集的应用是通过调用 `applyTo()`\
  \ 方法实现的，并传递一个要应用设置的布局对象的引用：\n\n```\nset.applyTo(myLayout);\n```\n\n### 23.4.3 父级约束连接\n\
  \n也可以通过引用 `ConstraintSet.PARENT_ID` 常量，在子视图与其父级 `ConstraintLayout` 之间建立连接。在接下来的示例中，约束集被配置为将\
  \ `Button` 视图的顶部连接到父布局的顶部，并留有 100dp 的间距：\n\n```\nset.connect(button1.getId(), ConstraintSet.TOP,\n\
  \            ConstraintSet.PARENT_ID, ConstraintSet.TOP, 100);\n```\n\n### 23.4.4\
  \ 尺寸约束\n\n提供了多种方法来控制视图的尺寸行为。例如，以下代码将一个 `Button` 视图的水平尺寸设置为 `wrap_content`，并将 `ImageView`\
  \ 实例的垂直尺寸最大限制为 250dp：\n\n```\nset.constrainWidth(button1.getId(), ConstraintSet.WRAP_CONTENT);\n\
  set.constrainMaxHeight(imageView1.getId(), 250);\n```\n\n### 23.4.5 约束偏移\n\n正如“在\
  \ Android Studio 中使用 ConstraintLayout 指南”章节概述所示，当视图具有相反的约束时，它将沿着约束轴（即水平或垂直方向）居中。这种居中可以通过沿着特定的约束轴应用偏移（bias）来调整。在使用\
  \ Android Studio 布局编辑器时，这可以通过“属性”（Attributes）工具窗口中的控件来实现。然而，在处理约束集时，可以使用 `setHorizontalBias()`\
  \ 和 `setVerticalBias()` 方法添加偏移，并引用视图 ID 和作为 0 到 1 之间的浮点值的偏移值。\n\n例如，以下代码在将 `Button`\
  \ 的左侧和右侧连接到父布局的相应侧边之前，向其应用了 25% 的水平偏移：\n\n```\nset.connect(button1.getId(), ConstraintSet.LEFT,\n\
  \            ConstraintSet.PARENT_ID, ConstraintSet.LEFT, 0);\nset.connect(button1.getId(),\
  \ ConstraintSet.RIGHT,\n            ConstraintSet.PARENT_ID, ConstraintSet.RIGHT,\
  \ 0);\nset.setHorizontalBias(button1.getId(), 0.25f);\n```\n\n### 23.4.6 对齐约束\n\n\
  也可以使用约束集应用对齐。Android Studio 布局编辑器中提供的完整对齐选项也可以通过 `centerVertically()` 和 `centerHorizontally()`\
  \ 方法使用约束集进行配置，这两个方法都根据正在配置的对齐方式接受多种参数。此外，可以使用 `center()` 方法将视图在两个视图之间居中。\n\n在下面的代码中，`button2`\
  \ 的位置设置使其与 `button1` 在水平上对齐：\n\n```\nset.centerHorizontally(button2.getId(), button1.getId());\n\
  ```\n\n### 23.4.7 复制和应用约束集\n\n可以使用 `clone()` 方法将 `ConstraintLayout` 实例当前的约束集复制到约束集对象中。例如，下行代码将名为\
  \ `myLayout` 的 `ConstraintLayout` 实例的约束设置复制到约束集对象中：\n\n```\nset.clone(myLayout);\n\
  ```\n\n复制后，可以将约束集直接应用到另一个布局，或者像示例所示，在应用到第二个布局之前进行修改：\n\n```\nConstraintSet set =\
  \ new ConstraintSet();\nset.clone(myLayout);\nset.constrainWidth(button1.getId(),\
  \ ConstraintSet.WRAP_CONTENT);\nset.applyTo(mySecondLayout);\n```\n\n### 23.4.8\
  \ ConstraintLayout 链 (Chains)\n\n也可以使用 `createHorizontalChain()` 和 `createVerticalChain()`\
  \ 方法在约束集内部创建垂直和水平链。使用这些方法的语法如下：\n\n```\ncreateHorizontalChain(int leftId, int leftSide,\
  \ int rightId, int rightSide, int[] chainIds, float[] weights, int style);\n```\n\
  \n根据上述语法，以下示例创建了一个从 `button1` 开始并以 `button4` 结束的水平分布链（spread chain）。在这些视图之间是 `button2`\
  \ 和 `button3`它们的权重均设置为零：\n\n```\nint[] chainViews = {button2.getId(), button3.getId()};\n\
  float[] chainWeights = {0, 0};\nset.createHorizontalChain(button1.getId(), ConstraintSet.LEFT,\n\
  \                            button4.getId(), ConstraintSet.RIGHT,\n           \
  \                 chainViews, chainWeights, ConstraintSet.SPREAD);\n```\n\n### 23.4.9\
  \ 辅助线 (Guidelines)\n\n使用 `create()` 方法将辅助线添加到约束集中，然后使用 `setGuidelineBegin()`、`setGuidelineEnd()`\
  \ 或 `setGuidelinePercent()` 方法进行定位。在下面的代码中，创建了一个垂直辅助线并将其位于父布局宽度的 50% 处。然后将按钮的左侧连接到辅助线且无间距：\n\
  \n```\nset.create(R.id.myGuideline, ConstraintSet.VERTICAL_GUIDELINE);\nset.setGuidelinePercent(R.id.myGuideline,\
  \ 0.5f);\nset.connect(button.getId(), ConstraintSet.LEFT, R.id.myGuideline, ConstraintSet.RIGHT,\
  \ 0);\nset.applyTo(layout);\n```\n\n### 23.4.10 移除约束\n\n可以使用 `clear()` 方法从视图移除约束，并传递视图\
  \ ID 和要移除约束的锚点：\n\n```\nset.clear(button.getId(), ConstraintSet.LEFT);\n```\n\n\
  同样，可以通过仅在 `clear()` 方法中引用视图来移除视图的所有约束：\n\n```\nset.clear(button.getId());\n```\n\
  \n### 23.4.11 缩放\n\n可以使用 `setScaleX()` 和 `setScaleY()` 方法调整布局内视图的比例，这两个方法接受执行操作的视图以及表示比例的浮点值。在下面的代码中，按钮对象被缩放为宽的两倍和高度的一半：\n\
  \n```\nset.setScaleX(myButton.getId(), 2f);\nset.setScaleY(myButton.getId(), 0.5f);\n\
  ```\n\n### 23.4.12 旋转\n\n可以使用 `setRotationX()` 和 `setRotationY()` 方法分别在 X 或 Y 轴上旋转视图，这两个方法都必须传递视图\
  \ ID 和表示要旋转角度的浮点值。旋转发生的中心点可以通过调用 `setTransformPivot()`、`setTransformPivotX()` 和\
  \ `setTransformPivotY()` 方法定义。下面的代码使用位于 (500, 500) 处的中心点在 Y 轴上旋转按钮视图 30 度：\n\n```\n\
  set.setTransformPivot(button.getId(), 500, 500);\nset.setRotationY(button.getId(),\
  \ 30);\nset.applyTo(layout);\n```\n\n## 23.5 总结\n\n作为编写 XML 布局资源文件或使用 Android Studio\
  \ 布局编辑器工具的替代方案，可以在 Java 代码中动态创建 Android 用户界面。\n\n在 Java 代码中创建布局包括创建视图类的实例并在这些对象上设置属性以定义所需的显示和行为。\n\
  \n\n\n\n\n视图相对于其 `ConstraintLayout` 父视图以及任何兄弟视图的定位和大小设置，是通过使用约束集（constraint sets）定义的。约束集由\
  \ `ConstraintSet` 类的实例表示，一旦创建，就可以使用广泛的方法调用进行配置，以执行任务，例如建立约束连接、控制视图大小行为以及创建链（chains）。\n\
  \n在本章涵盖 `ConstraintSet` 类的基础知识后，下一章将通过一个教程来将这些功能投入实际应用。\n\n# 24. Android ConstraintSet\
  \ 教程\n\n上一章介绍了使用 `ConstraintLayout` 和 `ConstraintSet` 类在 Java 代码中创建和修改用户界面布局的基本概念。本章将这些这些并付诸实践，通过创建一个完全使用\
  \ Java 代码编写且不使用 Android Studio 布局编辑器（Layout Editor）的示例布局。\n\n## 24.1 在 Android Studio\
  \ 中创建示例项目\n\n启动 Android Studio，并在欢迎界面选择 `New Project`（新建项目）选项，在出现的新项目对话框中，点击 `Next`\
  \ 按钮之前选择 `Empty Activity` 模板。\n\n在 `Name` 字段中输入 `JavaLayout`，并指定 `com.ebookfrenzy.javalayout`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将\
  \ `Language` 菜单更改 `Java`。\n\n项目创建完成后，`MainActivity.java` 文件会自动加载到编辑面板中。正如我们预期的，Android\
  \ Studio 创建了一个模板 activity 并重写了 `onCreate()` 方法，为添加 Java 代码以创建用户界面提供了一个理想的位置。\n\n\
  ## 24.2 向 Activity 添加视图\n\n`onCreate()` 方法目前设计为使用资源资源布局文件作为用户界面。因此，首先从该方法中删除此行：\n\
  \n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState) {\n   \
  \ super.onCreate(savedInstanceState);\n    setContentView(R.layout.activity_main);\n\
  }\n```\n\n下一个修改是向 activity 添加一个包含单个 `Button` 视图子项的 `ConstraintLayout` 对象。这涉及创建 `ConstraintLayout`\
  \ 和 `Button` 类的新实例。然后需要将 `Button` 视图作为子视图添加到 `ConstraintLayout` 视图中，而该视图又通过调用 activity\
  \ 实例的 `setContentView()` 方法来显示：\n\n```java\npackage com.ebookfrenzy.javalayout;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\nimport android.os.Bundle;\n\
  import androidx.constraintlayout.widget.ConstraintLayout;\nimport android.widget.Button;\n\
  import android.widget.EditText;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n \
  \       super.onCreate(savedInstanceState);\n        configureLayout();\n    }\n\
  \n    private void configureLayout() {\n        Button myButton = new Button(this);\n\
  \        ConstraintLayout myLayout = new ConstraintLayout(this);\n        myLayout.addView(myButton);\n\
  \        setContentView(myLayout);\n    }\n}\n```\n\n当以此方式创建用户界面对象的新实例时，必须向构造方法传递创建该对象的上下文（context），在本例中就是当前\
  \ activity。由于上述代码位于 activity 类中，因此通过标准的 `this` 关键字引用上下文：\n\n```java\nButton myButton\
  \ = new Button(this);\n```\n\n在完成上述添加后，编译并运行应用程序（在物理设备或模拟器上）。启动后，可见结果将是一个没有任何文本的按钮出现在\
  \ `ConstraintLayout` 视图的左上角，如图 24-1 所示。\n\n![](img/Image24351.jpg)\n\n图 24-1\n\n\
  ## 24.3 设置视图属性\n\n为了本次练习，我们需要 `ConstraintLayout` 视图的背景为蓝色，并且 `Button` 视图在黄色背景上显示“Press\
  \ Me”的文本。这两项任务都可以通过如下代码片段所示，在 Java 代码中设置视图属性来实现。为了让按钮上的文本能够轻松翻译成其他语言，将将其作为 `String`\
  \ 资源添加。在 Project 工具窗口中，找到 `app -> res -> values -> strings.xml` 文件，并修改它以为“Press\
  \ Me”字符串添加资源值：\n\n```xml\n<resources>\n    <string name=\"app_name\">JavaLayout</string>\n\
  \    <string name=\"press_me\">Press Me</string>\n</resources>\n```\n\n虽然这是处理代码中直接引用字符串的推荐方法，但为了避免在书的范围内重复此步骤，许多后续代码示例将直接在代码中输入字符串。\n\
  \n一旦字符串存储为资源，就可以如下方式从代码内部访问：\n\n```java\ngetString(R.string.press_me);\n```\n\n\
  创建字符串资源后，向 `configureLayout()` 方法添加代码以设置按钮文本和颜色属性：\n\n```java\nimport android.graphics.Color;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private void configureLayout()\
  \ {\n        Button myButton = new Button(this);\n        myButton.setText(R.string.press_me);\n\
  \        myButton.setBackgroundColor(Color.YELLOW);\n        ConstraintLayout myLayout\
  \ = new ConstraintLayout(this);\n        myLayout.setBackgroundColor(Color.BLUE);\n\
  \        myLayout.addView(myButton);\n        setContentView(myLayout);\n    }\n\
  }\n```\n当应用程序现在编译并运行时，布局将呈现出蓝色背景，按钮将在黄色背景上显示文本。\n\n## 24.4 创建视图 ID\n\n当布局完成后，它将包含一个\
  \ `Button` 和一个 `EditText` 视图。在 `ConstraintSet` 类的方法中引用这些视图之前，必须为它们分配唯一的 ID。此过程的第一步是创建一个包含这些\
  \ ID 的资源文件。\n\n右键点击 `app -> res -> values` 文件夹，选择 `New -> Values File` 选项并将资源文件命名为\
  \ `id.xml`。创建资源文件后，将其修改如下：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n\
  <resources>\n    <item name=\"myButton\" type=\"id\" />\n    <item name=\"myEditText\"\
  \ type=\"id\" />\n</resources>\n```\n\n在教程此时，仅创建了 `Button`，因此编辑 `configureLayout()`\
  \ 方法为对象分配相应的 ID：\n\n```java\nprivate void configureLayout() {\n    Button myButton\
  \ = new Button(this);\n    myButton.setText(R.string.press_me);\n    myButton.setBackgroundColor(Color.YELLOW);\n\
  \    myButton.setId(R.id.myButton);\n}\n```\n\n## 24.5 配置约束集\n\n在没有任何约束的情况下，`ConstraintLayout`\
  \ 视图将 `Button` 放置在屏幕左上角。为了指示布局视图将按钮放在不同的位置（在本例中为水平和垂直居中），需要创建一个 `ConstraintSet`\
  \ 实例，对其进行初始化并将其应用于父布局。\n\n对于此示例，按钮需要配置为使其宽度和高度约束为其显示的文本大小，并在父布局中居中。再次编辑 `configureLayout()`\
  \ 方法以进行这些更改：\n\n```java\nimport androidx.constraintlayout.widget.ConstraintSet;\n\
  \nprivate void configureLayout() {\n    Button myButton = new Button(this);\n  \
  \  myButton.setText(R.string.press_me);\n    myButton.setBackgroundColor(Color.YELLOW);\n\
  \    myButton.setId(R.id.myButton);\n    ConstraintLayout myLayout = new ConstraintLayout(this);\n\
  \    myLayout.setBackgroundColor(Color.BLUE);\n    myLayout.addView(myButton);\n\
  \    setContentView(myLayout);\n\n    ConstraintSet constraintSet = new ConstraintSet();\n\
  \    constraintSet.clone(myLayout);\n    // ... 在此处将设置约束\n    constraintSet.applyTo(myLayout);\n\
  }\n```\n\n\n\n\n\n```java\nConstraintSet set = new ConstraintSet();\nset.constrainHeight(myButton.getId(),\
  \ ConstraintSet.WRAP_CONTENT);\nset.constrainWidth(myButton.getId(), ConstraintSet.WRAP_CONTENT);\n\
  set.connect(myButton.getId(), ConstraintSet.START, ConstraintSet.PARENT_ID, ConstraintSet.START,\
  \ 0);\nset.connect(myButton.getId(), ConstraintSet.END, ConstraintSet.PARENT_ID,\
  \ ConstraintSet.END, 0);\nset.connect(myButton.getId(), ConstraintSet.TOP, ConstraintSet.PARENT_ID,\
  \ ConstraintSet.TOP, 0);\nset.connect(myButton.getId(), ConstraintSet.BOTTOM, ConstraintSet.PARENT_ID,\
  \ ConstraintSet.BOTTOM, 0);\nset.applyTo(myLayout);\n```\n\n配置好初始约束后，编译并运行应用程序，验证\
  \ `Button` 视图现在是否出现在布局的中心：\n\n![](img/Image2444.jpg)\n图 24-2\n\n## 24.6 添加 EditText\
  \ 视图\n\n下一个要添加到布局中的项是 `EditText` 视图。第一步是创建 `EditText` 对象，为其分配分配在 `id.xml` 资源文件中声明的\
  \ ID，并将其添加到布局中。为了实现这些步骤，现在对 `configureLayout()` 方法进行如下更改：\n\n```java\nprivate void\
  \ configureLayout() {\n    Button myButton = new Button(this);\n    myButton.setText(getString(R.string.press_me));\n\
  \    myButton.setBackgroundColor(Color.YELLOW);\n    myButton.setId(R.id.myButton);\n\
  \    EditText myEditText = new EditText(this);\n    myEditText.setId(R.id.myEditText);\n\
  \    ConstraintLayout myLayout = new ConstraintLayout(this);\n    myLayout.setBackgroundColor(Color.BLUE);\n\
  \    myLayout.addView(myButton);\n    myLayout.addView(myEditText);\n    setContentView(myLayout);\n\
  }\n```\n\n`EditText` 控件的设计目标是根据其显示的内容调整大小，在布局中水平居中，并位于现有 `Button` 视图上方 70dp 处。在\
  \ `configureLayout()` 方法中添加代码，使其如下：\n\n```java\nset.connect(myButton.getId(), ConstraintSet.START,\
  \ ConstraintSet.PARENT_ID, ConstraintSet.START, 0);\nset.connect(myButton.getId(),\
  \ ConstraintSet.END, ConstraintSet.PARENT_ID, ConstraintSet.END, 0);\nset.connect(myButton.getId(),\
  \ ConstraintSet.TOP, ConstraintSet.PARENT_ID, ConstraintSet.TOP, 0);\nset.connect(myButton.getId(),\
  \ ConstraintSet.BOTTOM, ConstraintSet.PARENT_ID, ConstraintSet.BOTTOM, 0);\nset.constrainHeight(myEditText.getId(),\
  \ ConstraintSet.WRAP_CONTENT);\nset.constrainWidth(myEditText.getId(), ConstraintSet.WRAP_CONTENT);\n\
  set.connect(myEditText.getId(), ConstraintSet.START, ConstraintSet.PARENT_ID, ConstraintSet.START,\
  \ 0);\nset.connect(myEditText.getId(), ConstraintSet.END, ConstraintSet.PARENT_ID,\
  \ ConstraintSet.END, 0);\nset.connect(myEditText.getId(), ConstraintSet.BOTTOM,\
  \ myButton.getId(), ConstraintSet.TOP, 70);\nset.applyTo(myLayout);\n```\n\n运行测试应用程序，应该看到\
  \ `EditText` 字段居于按钮上方，并留有 70dp 的间距。\n\n## 24.7 将密度无关像素 (dp) 转换为像素 (px)\n\n本练习的下一个任务是将\
  \ `EditText` 视图的宽度设置为 200dp。正如“Android Studio 布局编辑器”章节概述的，在用户界面布局中设置尺寸和位置时，使用密度无关像素（`dp`）而不是像素（`px`）更好。为了使用\
  \ `dp` 设置位置，需要在运行时将 `dp` 值转换为 `px` 值，并考虑设备显示器的密度。因此，为了将 `EditText` 视图的宽度设置为 200dp，需要在该类中添加以下代码：\n\
  \n```java\npackage com.ebookrenzy.javalayout;\n\nimport android.content.res.Resources;\n\
  import android.util.TypedValue;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private int convertToPx(int value) {\n        Resources r = getResources();\n\
  \        int px = (int) TypedValue.applyDimension(TypedValue.COMPLEX_UNIT_DIP, value,\
  \ r.getDisplayMetrics());\n        return px;\n    }\n\n    private void configureLayout()\
  \ {\n        Button myButton = new Button(this);\n        myButton.setText(getString(R.string.press_me));\n\
  \        myButton.setBackgroundColor(Color.YELLOW);\n        myButton.setId(R.id.myButton);\n\
  \        EditText myEditText = new EditText(this);\n        myEditText.setId(R.id.myEditText);\n\
  \        int px = convertToPx(200);\n        myEditText.setWidth(px);\n    }\n}\n\
  ```\n\n再次编译并运行应用程序，注意 `EditText` 视图的宽度已经发生变化，如图 24-3 所示：\n\n![](img/Image24511.jpg)\n\
  图 24-3\n\n## 24.8 总结\n\n在本章创建的示例 Activity 创建了一个相似的用户界面（尽管背景颜色和视图类型发生了变化），这与在“Android\
  \ Studio 中手动设计布局”章节中创建的相似。尽管如此，本章至少应该让读者意识到 Android Studio 布局编辑器和资源可以避免许多复杂性。\n\n\
  然而，在某些情况下，使用 Java 创建用户界面是有意义的。这种方法在创建动态用户界面布局时特别有用。\n\n## 25. Android Studio 中 Apply\
  \ Changes 使用指南\n\n在涵盖了使用 Android Studio 开发的一些基本概念后，现在是介绍 Android Studio Apply Changes（应用更改）功能的好时机。正如所有经验丰富的开发者所知，等待应用程序编译运行的每一秒都可以用于编写代码。\n\
  \n## 25.1 引入 Apply Changes\n\n在早期版本中，每次需要测试项目的更改时，Android Studio 都会重新编译代码、转换为 格式、生成\
  \ APK 包并将其安装到设备或模拟器上。完成这些步骤后，应用程序才能启动并准备测试。即使在快速的开发系统上，这也是一个需要大量时间的过程。对于大型应用程序，此过程通常需要一分钟甚至更久。相比之下，Apply\
  \ Changes 允许项目中的许多代码和资源更改在已经在设备或模拟器会话运行时几乎立即反映出来。\n\n为了说明，考虑一个正在 Android Studio\
  \ 中开发且已经启动的应用程序。如果对资源设置或方法内的代码进行了更改，Apply Changes 将更新的代码和资源推送到运行的应用程序，并动态地“切换”这些更改。这些更改将实现在运行的应用程序中，而无需重新构建、部署和重新启动整个应用程序。\n\
  \n## 25.2 理解 Apply Changes 选项\n\nAndroid Studio 提供了三种应用于运行应用程序的更改选项，形式为 Run App、Apply\
  \ Changes 以及 Restart Activity and Apply Code Changes。这些选项可以总结如下：\n\n- **Run App**:\
  \ 停止当前运行的应用程序并重启。如果自上次启动以来没有发生任何更改，此选项将仅仅重启应用程序。反之，如果项目发生了更改，Android Studio 将重新构建并安装应用程序到设备或模拟器上，然后启动。\n\
  \n\n\n\n\n- **应用代码更改 (Apply Code Changes)** - 当对项目的更改仅涉及现有方法体的修改，或者添加了新类或新方法时，可以使用此选项。选中后，更改将应用到运行中的应用，而无需重启应用或当前运行的活动。然而，当对任何项目资源（如布局文件）进行更改时，无法使用此模式。其他限制还包括删除方法、更改方法签名、重命名类以及其他结构性代码更改。如果项目清单（manifest）进行了更改，无法使用此选项。\n\
  \n- **应用更改并重启活动 (Apply Changes and Restart Activity)** - 选中后，此模式将动态应用项目内的任何代码或资源更改，并重启活动，而无需重新安装或重启应用。与“应用代码更改”选项不同，当对项目的代码和资源进行更改时可以使用此选项，尽管涉及某些结构性代码更改和清单修改的相同限制仍然适用。\n\
  \n## 25.3 使用应用更改\n\n当项目已加载到 Android Studio 但尚未在设备或模拟器上运行时，可以像往常一样使用工具栏上的运行按钮（在图\
  \ 25-1 中标记为 A）或调试按钮（B）启动：\n\n![](img/as_3.6_run_debug_toolbar_buttons.jpg)\n\n图\
  \ 25-1\n\n应用启动并运行后，运行按钮上的图标将更改，表示应用正在运行，且“应用更改并重启活动”和“应用代码更改”按钮将如下方图 25-2 所示启用：\n\
  \n![](img/as_3.5_apply_changes_labelled_buttons.jpg)\n\n图 25-2\n\n如果在选择其中一个应用更改按钮时无法应用更改，Android\
  \ Studio 将显示一条指示失败的消息以及解释。例如，图 25-3 显示了在对资源文件进行更改后选择“应用代码更改”选项时 Android Studio 显示的消息：\n\
  \n![](img/as_apply_changes_resource_error.jpg)\n\n图 25-3\n\n在这种情况下，解决方案是使用“应用更改并重启活动”选项（提供了提供了链接）。同样，当尝试应用涉及方法的添加或删除的更改时，将出现以下消息：\n\
  \n![](img/as_apply_changes_method_error.jpg)\n\n图 25-4\n\n在这种情况下，唯一的选项是点击“运行应用”按钮以重新安装并重启应用。作为在这些情况下手动选择正确选项的替代方案，Android\
  \ Studio 可以配置为自动回退到执行运行应用操作。\n\n## 25.4 配置应用更改的回退设置\n\n应用更改的回退设置位于 Android Studio\
  \ 偏好设置窗口中，通过选择 `File -> Settings` 菜单项（macOS 上为 Android Studio -> Preferences）显示。在偏好设置对话框中，选择左侧面板中的\
  \ `Build, Execution, Deployment` 项，然后选择 `Deployment`，如图 25-5 所示：\n\n![](img/as_3.5_apply_changes_preferences.jpg)\n\
  \n图 25-5\n\n启用所需的选项后，点击 Apply 然后点击 OK 按钮以提交更改并关闭对话框。启用这些默认设置后，Android Studio 将需要时自动重新安装并重启应用。\n\
  \n## 25.5 应用更改教程\n\n启动 Android Studio，从欢迎屏幕选择 New Project 选项，并在生成的新项目对话框中，点击 Next\
  \ 按钮之前选择 Basic Activity 模板。\n\n在 `Name` 字段中输入 `ApplyChanges`，并指定 `com.ebookfrenzy.applychanges`\
  \ 为包名。在点击 Finish 按钮之前，将 Minimum API 级别设置为 `API 26`：Android 8.0 (Oreo)，并将语言菜单更改为\
  \ `Java`。\n\n## 25.6 使用应用代码更改\n\n点击运行按钮并选择合适的模拟器或物理设备作为运行目标。点击运行按钮后，跟踪示例应用出现在设备或模拟器之前的时间。\n\
  \n运行后，点击操作按钮（位于屏幕右下角的显示信封图标的按钮）。注意会出现一个 `Snackbar` 实例，显示文本为“Replace with your own\
  \ action”，如图 25-6 所示：\n\n![](img/as_4.1_apply_changes_snackbar.jpg)\n\n图 25-6\n\n\
  应用运行后，应用更改按钮应该已经启用，表示某些项目更改可以在无需重新安装和重启应用的情况下应用。要查看此效果，编辑 `MainActivity.java` 文件，找到\
  \ `onCreate` 方法并修改操作代码，以便在选择操作按钮时显示不同的消息：\n\n```java\nbinding.fab.setOnClickListener(new\
  \ View.OnClickListener() {\n    @Override\n    public void onClick(View view) {\n\
  \        Snackbar.make(view, \"Apply Changes is Amazing!\", Snackbar.LENGTH_LONG)\n\
  \              .setAction(\"Action\", null).show();\n    }\n});\n```\n\n实现代码更改后，点击“应用代码更改”按钮，注意几秒内出现了一条消息。点击操作按钮，注意新消息现在显示在\
  \ `Snackbar` 中。\n\n## 25.7 使用应用更改并重启活动\n\n任何资源更改都要求使用“应用更改并重启活动”选项。在 Android Studio\
  \ 中选择 `app -> res -> layout -> fragment_first.xml` 布局文件。在布局编辑器的设计模式下，选择默认的 `TextView`\
  \ 组件并在属性窗口中更改文本为“Hello Android”。\n\n在点击应用更改按钮之前，确保配置应用更改回退设置中概述的回退选项已关闭。注意请求失败，因为此更改涉及资源。点击“应用更改并重启活动”按钮，验证活动重启并在\
  \ `TextView` 上显示新文本。\n\n## 25.8 使用运行应用\n\n如前，删除方法需要对运行应用进行完全重新安装和重启。为了体验这一点，编辑 `MainActivity.java`\
  \ 文件并在 `onCreate` 方法之后添加新方法：\n\n```java\npublic void demoMethod() {\n\n}\n```\n\n\
  使用“应用代码更改”按钮并确认更改在无需重新安装应用的情况下应用。\n\n接下来，删除新方法，并验证点击任一应用更改按钮都会导致请求失败。此类更改后运行应用的唯一方法是点击“运行应用”按钮。\n\
  \n## 25.9 总结\n\n应用更改是 Android Studio 的一项功能，旨在加速开发应用时的代码、构建和运行周期。应用更改功能能够更新运行中的应用，在许多情况下无需重新安装甚至重启应用。应用更改根据应用于项目的修改性质提供了不同程度的支持。\n\
  \n## 26. Android 事件处理概述与示例\n\n在前面的章节中已经涵盖了大量关于 Android 应用程序界面设计的内容。然而，尚未涵盖的一个领域涉及用户与界面的交互如何触发底层活动执行任务的方式。换句话说，我们从前面的章节中知道如何创建一个包含按钮视图的用户界面，但不知道当用户触摸它时让应用程序内部发生什么。\n\
  \n\n\n\n\n因此，本章的主要目标是概述 Android 应用程序中的事件处理，并提供一个基于 Android Studio 的示例项目。\n\n## 26.1\
  \ 理解 Android 事件\n\nAndroid 中的事件可以采取多种不同的形式，但通常是响应外部操作而产生的。最常见的事件形式（特别是对于平板电脑和智能手机等设备）涉及与触摸屏幕的某种交互。此类事件属于输入事件范畴。\n\
  \nAndroid 框架维护了一个事件队列，事件在发生时会被放入队列中。然后，事件按照先进先出（FIFO）的原则从队列中移除。对于如触摸屏幕之类的输入事件，事件将传递给屏幕上发生触摸位置的视图（view）。除了事件通知外，视图还会被传递到有关事件性质的一系列信息（取决于事件类型），例如用户手指与屏幕之间接触点的坐标。\n\
  \n为了能够处理传递给它的事件，视图必须配备事件监听器（event listener）。所有用户界面组件都派生自 `View` 类，它包含一系列事件监听器接口，每个接口都包含一个回调方法的抽象声明。为了能够响应特定类型的事件，视图必须注册相应的事件监听器并实现相应的回调。例如，如果一个按钮要响应点击事件（相当于用户触摸并松开按钮视图，就像点击物理按钮一样），它必须同时注册\
  \ `View.onClickListener` 事件监听器（通过调用目标视图的 `setOnClickListener()` 方法）并实现相应的 `onClick()`\
  \ 回调方法。当按钮视图的位置检测到“点击”事件时，Android 框架会在该事件从事件队列中移除时调用该视图的 `onClick()` 方法。当然，应该在 `onClick()`\
  \ 回调方法的实现中执行任何对按钮点击的响应的任务或调用其他方法。\n\n## 26.2 使用 android:onClick 资源\n\n在详细探索事件监听器之前，值得注意的是，当仅需在用户“点击”用户界面中的按钮视图时调用回调方法时，可以使用一种快捷方式。考虑一个包含名为\
  \ `button1` 的按钮视图的用户界面布局，其要求是：当用户触摸按钮时，调用在活动类（activity class）中声明的 `buttonClick()`\
  \ 方法。实现此行为只需要编写 `buttonClick()` 方法（该方法接收一个触发点击事件的视图引用作为参数），并在 XML 文件中的按钮视图声明中添加一行即可。例如：\n\
  \n```xml\n<Button\n      android:id=\"@+id/button1\"\n      android:layout_width=\"\
  wrap_content\"\n      android:layout_height=\"wrap_content\"\n      android:onClick=\"\
  buttonClick\"\n      android:text=\"Click me\" />\n```\n\n这提供了一种捕获点击事件的简单方法。然而，它并没有提供事件处理器提供的范围选项，而这些是本章其余部分的主题。正如后续章节概述的，`onClick`\
  \ 属性在涉及 fragment 的布局也有局限性。在 Android Studio Layout 编辑器中工作时，当在设备屏幕布局中选择合适的视图类型时，可以在属性（Attributes）面板中找到并配置\
  \ `onClick` 属性。\n\n## 26.3 事件监听器和回调方法\n\n在本章后续的示例活动中，将详细介绍注册事件监听器和实现回调方法的步骤。在在此之前，值得花些时间概述\
  \ Android 框架中可用的事件监听器以及每个监听器关联的回调方法。\n\n- `onClickListener` – 用于检测点击式事件，用户触摸并释放由占据的设备显示区域。对应于\
  \ `onClick()` 回调方法，该方法将接收事件的视图引用作为参数传递。\n- `onLongClickListener` – 用于检测用户是否在视图上长时间触摸。对应于\
  \ `onLongClick()` 回调方法，该方法将接收事件的视图作为参数传递。\n- `onTouchListener` – 用于检测与触摸屏幕的任何形式接触，包括单个或多次触摸以及手势动作。对应于\
  \ `onTouch()` 回调，此主题将在 Android 触摸和多点事件处理 章节中进行详细介绍。回调方法将接收事件的视图和一个 `MotionEvent`\
  \ 对象作为参数传递。\n- `onCreateContextMenuListener` – 监听由于长按产生上下文菜单的创建。对应于 `onCreateContextMenu()`\
  \ 回调方法。回调将接收菜单、接收事件的视图和一个菜单上下文对象。\n- `onFocusChangeListener` – 检测当由于与轨迹球或导航键交互时，焦点移出当前视图的情况。对应于\
  \ `onFocusChange()` 回调方法，该方法将接收事件的视图和一个指示是否获得或失去焦点的 `Boolean` 值传递。\n- `onKeyListener`\
  \ – 用于检测当视图拥有焦点时按下了设备上的某个按键。对应于 `onKey()` 回调方法。传递的参数是接收事件的视图、所按物理键的 `KeyCode` 和一个\
  \ `KeyEvent` 对象。\n\n## 26.4 事件处理示例\n\n在本章的剩余部分中，我们将通过创建一个 Android Studio 项目来演示事件监听器和回调方法的实现。回调方法中的代码将更新一个文本视图以指示。从欢迎界面选择\
  \ New Project 选项，并在新项目对话框中选择 Empty Activity 模板，然后点击 Next 按钮。\n\n在 Name 字段输入 `EventExample`\
  \ 并指定 `com.ebookzy.eventexample` 为包名。在点击 Finish 按钮之前，将 Minimum API 级别改为 API 26:\
  \ Android 8.0 (Oreo)，并将 Language 菜单改为 Java。按照节 11.8 将项目迁移到 View Binding 中概述的步骤，将项目转换为视图绑定。\n\
  \n## 26.5 设计用户界面\n\n示例中 `MainActivity` 类的用户界面布局由一个 `ConstraintLayout`、一个 `Button`\
  \ 和一个 `TextView` 组成，如图图 26-1 所示。\n\n![](img/4.1_event_example_ui.jpg)\n\n图 26-1\n\
  \n找到并选择 Android Studio 创建的 `activity_main.xml` 文件（位于 Project 窗口的 app -> res -> layouts\
  \ 下），双击将其加载到 Layout Editor 中。\n\n确保启用了 Autoconnect，然后从调板中拖入 `Button` 组件并移动它，使其位于布局的水平居中并在现有\
  \ `TextView` 组件下方。当位置正确时，将组件释放到位置，以便自动连接系统添加相应的约束。\n\n选择“Hello World!” `TextView`\
  \ 组件并使用属性面板将 ID 设置为 `statusText`。重复此步骤将 `Button` 组件的 ID 改为 `myButton`。\n\n点击布局编辑器工具栏中的\
  \ Infer Constraints 按钮添加任何缺失的约束。\n\n\n\n\n\n选中 `Button` 控件后，使用属性面板（Attributes panel）将\
  \ text 属性设置为 `Press Me`。使用布局编辑器（Layout Editor）右上角的黄色警告按钮（图 26-2）显示警告列表，并点击 `Fix`\
  \ 按钮将按钮上的字符串提取为名为 `press_me` 的资源：\n\n![](img/as_4.1_layout_warning.jpg)\n\n图 26-2\n\
  \n用户界面布局现在已完成，下一步是注册事件监听器和回调方法。\n\n## 26.6 事件监听器和回调方法\n\n为了本示例，需要为 `myButton` 视图注册一个\
  \ `onClickListener`。这是通过调用按钮视图的 `setOnClickListener()` 方法来实现的，并将一个新的 `onClickListener`\
  \ 对象作为参数传递，并实现 `onClick()` 回调方法。由于任务只需要只需要 activity 创建时执行，因此理想的位置是 `MainActivity`\
  \ 类的 `onCreate()` 方法。\n\n如果编辑器会话中已经打开了 `MainActivity.java` 文件，请点击编辑器面板中的选项卡来选择它。或者，在\
  \ Project 工具窗口中，通过导航到 `(app -> java -> com.ebookfrenzy.eventexample -> MainActivity)`\
  \ 并双击它将其加载到代码编辑器中。加载后，找到模板 `onCreate()` 方法并修改它以获取按钮视图的引用、注册事件监听器并实现 `onClick()`\
  \ 回调方法：\n\n```java\npackage com.ebookfrenzy.eventexample;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  \nimport android.os.Bundle;\n\nimport android.view.View;\n\nimport android.widget.Button;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        binding = ActivityMainBinding.inflate(getLayoutInflater());\n        View\
  \ view = binding.getRoot();\n        setContentView(view);\n        binding.myButton.setOnClickListener(\n\
  \            new Button.OnClickListener() {\n                public void onClick(View\
  \ v) {\n                }\n            }\n        );\n    }\n.\n}\n```\n\n上述代码现在已经在按钮上注册了事件监听器并实现了\
  \ `onClick()` 方法。然而，如果此时运行应用程序，将没有任何指示表明安装在按钮上的事件监听器正在工作，因为目前 `onClick()` 回调方法的体内部尚未实现任何代码。本示例的目标是在点击按钮时在\
  \ `TextView` 上显示一条消息，因此需要进行一些进一步的代码更改：\n\n```java\n@Override\nprotected void onCreate(Bundle\
  \ savedInstanceState) {\n    super.onCreate(savedInstanceState);\n    binding =\
  \ ActivityMainBinding.inflate(getLayoutInflater());\n    View view = binding.getRoot();\n\
  \    setContentView(view);\n    binding.myButton.setOnClickListener(\n        new\
  \ Button.OnClickListener() {\n            public void onClick(View v) {\n      \
  \          binding.statusText.setText(\"Button clicked\");\n            }\n    \
  \    }\n    );\n}\n```\n\n通过在 AVD 模拟器或物理 Android 设备上编译并运行应用程序来完成本教程的这一阶段。在触摸并释放按钮视图（即所谓的“点击”）时，文本视图应该更改为显示“Button\
  \ clicked”文本。\n\n## 26.7 消费事件\n\n在视图上检测标准点击（区别于长按）是事件处理中一个非常简单的用例。现在将扩展示例以包含对长按事件的检测，长按事件发生在用户点击并按住屏幕上的视图时，通过这涵盖了事件消费的主题。\n\
  \n考虑本章上一部分中 `onClick()` 方法的代码。回调被声明为 `void`，因此它在执行完毕后不会向 Android 框架返回值。相反，分配给 `onClickListener`\
  \ 的代码需要向 Android 框架返回一个 `Boolean` 值。此返回值的目的是指示 Android 运行时回调是否消费了该事件。如果回调返回 `true`\
  \ 值，则事件将被框架丢弃。相反，如果回调返回 `false` 值，Android 框架将认为事件仍然处于激活状态，并因此将其传递给在同一视图上注册的下一个匹配监听器。\n\
  \n与许多编程概念一样，这可能通过示例演示得最好。第一步是为示例中的按钮视图添加用于长按的事件监听器和回调方法：\n\n```java\n@Override\n\
  protected void onCreate(Bundle savedInstanceState) {\n.\n    binding.myButton.setOnLongClickListener(\n\
  \        new Button.OnLongClickListener() {\n            public boolean onLongClick(View\
  \ v) {\n                binding.statusText.setText(\"Long button click\");\n   \
  \             return true;\n            }\n        }\n    );\n}\n```\n\n显然，当检测到长按时，`onLongClick()`\
  \ 回调方法将在文本视图上显示“Long click”。但注意，回调方法也返回了 `true` 值以表示它已消费了该事件。运行应用程序并按住 `Button`\
  \ 视图，直到出现“Long click”文本。在释放按钮时，文本视图继续显示“Long click”文本，表明 `onClick` 监听器代码没有被调用。\n\
  \n接下来，修改代码使 `onLongClick` 监听器现在返回 `false` 值：\n\n```java\nbutton.setOnLongClickListener(\n\
  \    new Button.OnLongClickListener() {\n        public boolean onLongClick(View\
  \ v) {\n            TextView myTextView = findViewById(R.id.myTextView);\n     \
  \       myTextView.setText(\"Long button click\");\n            return false;\n\
  \        }\n    }\n);\n```\n\n再次编译并运行应用程序，对按钮进行长按直到出现长按消息。然而，这次释放按钮时，注意 `onClick`\
  \ 监听器也被触发了，且文本变为“Button clicked”。这是因为 `onLongClick` 监听器代码返回的 `false` 值指示 Android\
  \ 框架该事件未被该方法消费，有权传递给视图上注册的下一个监听器。在这种情况下，运行时确认按钮上的 `onClickListener` 也对此类事件感感兴趣，并随后调用了\
  \ `onClick` 监听器代码。\n\n## 26.8 总结\n\n如果用户界面包含的视图对用户交互没有反应，那么它几乎没有实用价值。Android 通过事件监听器和回调方法的概念桥接了用户界面与应用程序后端代码之间的差距。`View`\
  \ 类定义了一组事件监听器，可以注册在视图对象上。每个事件监听器也关联了一个回调方法。\n\n当事件发生在用户界面视图上时，该事件被放入事件队列，并由 Android\
  \ 运行时按照先来顺序进行处理。如果发生事件的视图注册了匹配事件类型的监听器，则会调用相应的回调方法。该代码将在返回之前将执行 activity 所需的任务。\n\
  \n\n\n\n\n# 27. Android 触摸与多点事件处理\n\n大多数基于 Android 的设备使用触摸屏作为用户与设备之间的主要接口。上一章介绍了屏幕上的触摸如何转换为运行中的\
  \ Android 应用程序内部动作的机制。然而，触摸事件处理远不止于对视图（view）对象的单指点击响应。例如，大多数 Android 设备可以同时检测到多个触摸点。此外，触摸也不局限于设备显示器的某一点。当然，当用户在屏幕表面上滑动一个或多个接触点时，触摸也可以是动态的。\n\
  \n应用程序还可以将触摸解释为一种手势（gesture）。例如，水平滑动通常用于翻页电子书的页，或者捏合动作（pinching）可以用于对屏幕上显示的图像进行放大或缩小。\n\
  \n本章将解释涉及运动的触摸处理，并探索拦截并发多点的概念。识别不同手势的主题将在下一节介绍。\n\n## 27.1 拦截触摸事件\n\n视图对象可以通过注册\
  \ `onTouchListener` 事件监听器并实现相应的 `onTouch()` 回调方法来拦截触摸事件。例如，以下代码确保了对名为 `myLayout`\
  \ 的 `ConstraintLayout` 视图实例上的任何触摸操作都会导致 `onTouch()` 方法调用：\n\n```java\nbinding.myLayout.setOnTouchListener(\n\
  \    new ConstraintLayout.OnTouchListener() {\n        public boolean onTouch(View\
  \ v, MotionEvent m) {\n            // 在此处执行任务\n            return true;\n      \
  \  }\n    }\n);\n```\n\n如代码示例所示，`onTouch()` 回调需要返回一个 `Boolean` 值，指示 Android 运行时系统是否将事件传递给在同一视图上注册的其他事件监听器，或将其丢弃。该方法传递了触发事件的视图引用以及类型为\
  \ `MotionEvent` 的对象。\n\n## 27.2 MotionEvent 对象\n\n传递给 `onTouch()` 回调方法的 `MotionEvent`\
  \ 对象是获取信息的关键。对象中包含的信息包括触摸在视图中的位置以及所执行的动作类型。`MotionEvent` 对象也是处理多点的关键。\n\n## 27.3\
  \ 理解触摸动作\n\n触摸事件处理的一个重要方面是能够识别用户执行的动作类型。可以通过调用传递给 `onTouch()` 回调方法的 `MotionEvent`\
  \ 对象的 `getActionMasked()` 方法来获取与事件相关的动作类型。当视图上发生第一次触摸时，`MotionEvent` 对象将包含动作类型 `ACTION_DOWN`\
  \ 以及触摸坐标。当该触摸从屏幕上抬起时，会产生 `ACTION_UP` 事件。在 `ACTION_DOWN` 和 `ACTION_UP` 事件之间的任何触摸运动将由\
  \ `ACTION_MOVE` 事件表示。\n\n当在视图上同时进行多个触摸时，这些触摸被称为指针（pointers）。在多点触摸场景中，指针的开始和结束对应类型为\
  \ `ACTION_POINTER_DOWN` 和 `ACTION_POINTER_UP` 的事件动作。为了识别指针，必须调用 `MotionEvent` 的\
  \ `getActionIndex()` 方法。\n\n## 27.4 处理多点触摸\n\n多点事件处理比单点触摸处理更复杂。`MotionEvent` 对象提供了有关事件涉及的所有指针的信息。`getCount()`\
  \ 方法返回事件中的指针数量，而 `getPointerId(int index)` 返回特定指针的 ID。\n\n要获取特定指针的坐标，请使用 `getX(int\
  \ pointer)` 和 `getY(int pointer)`。这些方法接受的是指针 ID，而不是指针索引。\n\n以下代码演示了如何处理多点触摸：\n\n\
  ```java\nint count = m.getCount();\nfor (int i = 0; i < count; i++) {\n    int pointerId\
  \ = m.getPointerId(i);\n    float x = m.getX(pointerId);\n    float y = m.getY(pointerId);\n\
  \    // 处理每个指针\n}\n```\n\n## 27.5 一个多点触摸应用程序示例\n\n在本章剩余部分创建的示例应用程序将跟踪多达两个手势的移动。随着每个触摸事件的触发，每个触摸的坐标和\
  \ ID 将显示在屏幕上。\n\n## 27.6 设计 Activity 用户界面\n\n该应用程序唯一 Activity 的用户界面将由包含两个 `TextView`\
  \ 对象的 `ConstraintLayout` 视图组成。\n\n## 27.7 实现触摸事件监听器\n\n\n\n\n\n为了接收触摸事件通知，需要在 `MainActivity`\
  \ Activity 类的 `onCreate()` 方法中对布局视图注册一个触摸监听器。请从 Android Studio 器面板面板中选择 `MainActivity.java`\
  \ 标签页以显示源代码。在 `onCreate()` 方法中，添加代码来注册触摸监听器并实现相关代码；在此情况下，该代码将调用名为 `handleTouch()`\
  \ 的第二个方法，并为其传递 `MotionEvent` 对象：\n\n```java\npackage com.ebookfrenzy.motionevent;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\nimport androidx.constraintlayout.widget.ConstraintLayout;\n\
  import android.os.Bundle;\nimport android.view.MotionEvent;\nimport android.view.View;\n\
  import com.ebookfrenzy.motionevent.databinding.ActivityMainBinding;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n    private ActivityMainBinding binding;\n\
  \n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n    \
  \    super.onCreate(savedInstanceState);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n       \
  \ binding.activityMain.setOnTouchListener(\n            new ConstraintLayout.OnTouchListener()\
  \ {\n                public boolean onTouch(View v, MotionEvent m) {\n         \
  \           handleTouch(m);\n                    return true;\n                }\n\
  \            }\n        );\n    }\n}\n```\n\n在测试应用程序之前的最后一项任务是实现由监听器调用的 `handleTouch()`\
  \ 方法。该方法的代码如下：\n\n```java\nvoid handleTouch(MotionEvent m) {\n    int pointerCount\
  \ = m.getPointerCount();\n    for (int i = 0; i < pointerCount; i++) {\n       \
  \ int x = (int) m.getX(i);\n        int y = (int) m.getY(i);\n        int id = m.getPointerId(i);\n\
  \        int action = m.getActionMasked();\n        int actionIndex = m.getActionIndex();\n\
  \        String actionString;\n        switch (action) {\n            case MotionEvent.ACTION_DOWN:\n\
  \                actionString = \"DOWN\";\n                break;\n            case\
  \ MotionEvent.ACTION_UP:\n                actionString = \"UP\";\n             \
  \   break;\n            case MotionEvent.ACTION_POINTER_DOWN:\n                actionString\
  \ = \"PNTR DOWN\";\n                break;\n            case MotionEvent.ACTION_POINTER_UP:\n\
  \                actionString = \"PNTR UP\";\n                break;\n         \
  \   case MotionEvent.ACTION_MOVE:\n                actionString = \"MOVE\";\n  \
  \              break;\n            default:\n                actionString = \"\"\
  ;\n        }\n        String touchStatus = \"Action: \" + actionString + \" Index:\
  \ \" + actionIndex + \" ID: \" + id + \" X: \" + x + \" Y: \" + y;\n        if (id\
  \ == 0)\n            binding.textView1.setText(touchStatus);\n        else\n   \
  \         binding.textView2.setText(touchStatus);\n    }\n}\n```\n\n在编译和运行应用程序之前，花时间梳理这段代码以突出显示所执行的任务。代码首先获取两个\
  \ `TextView` 对象的引用，并识别视图上活跃了多少个指针：\n\n```java\nTextView textView1 = findViewById(R.id.textView1);\n\
  TextView textView2 = findViewById(R.id.textView2);\nint pointerCount = m.getPointerCount();\n\
  ```\n\n接下来，使用 `pointerCount` 变量启动 `for` 循环，为每个活跃的指针执行一组任务。循环的前几行获取了触摸的 `X` 和 `Y`\
  \ 坐标，以及相应的事件 `ID`、动作类型和动作 `index`。最后，声明了一个 `string` 变量：\n\n```java\nfor (int i =\
  \ 0; i < pointerCount; i++) {\n    int x = (int) m.getX(i);\n    int y = (int) m.getY(i);\n\
  \    int id = m.getPointerId(i);\n    int action = m.getActionMasked();\n    int\
  \ actionIndex = m.getActionIndex();\n    String actionString;\n}\n```\n\n由于动作类型对应整数值，因此使用\
  \ `switch` 语句将动作类型转换为更有意义的字符串值，并将其存储在之前声明的 `actionString` 变量中：\n\n```java\nswitch\
  \ (action) {\n    case MotionEvent.ACTION_DOWN:\n        actionString = \"DOWN\"\
  ;\n        break;\n    case MotionEvent.ACTION_UP:\n        actionString = \"UP\"\
  ;\n        break;\n    case MotionEvent.ACTION_POINTER_DOWN:\n        actionString\
  \ = \"PNTR DOWN\";\n        break;\n    case MotionEvent.ACTION_POINTER_UP:\n  \
  \      actionString = \"PNTR UP\";\n        break;\n    case MotionEvent.ACTION_MOVE:\n\
  \        actionString = \"MOVE\";\n        break;\n    default:\n        actionString\
  \ = \"\";\n}\n```\n\n最后，使用 `actionString` 值、动作索引、触摸 `ID` 以及 `X` 和 `Y` 坐标构建字符串消息。然后使用\
  \ `ID` 值来决定该字符串应该显示在第一个还是第二个 `TextView` 对象上：\n\n```java\nString touchStatus = \"\
  Action: \" + actionString + \" Index: \" + actionIndex + \" ID: \" + id + \" X:\
  \ \" + x + \" Y: \" + y;\nif (id == 0)\n    binding.textView1.setText(touchStatus);\n\
  \    else\n    binding.textView2.setText(touchStatus);\n```\n\n在编译和运行应用程序之前，值得花时间过一遍这段代码，以强调所执行的任务。\n\
  \n### 27.8 运行应用程序\n\n编译并运行应用程序，启动后，在屏幕上尝试单次和多次触摸，如图 27-3 所示，视图会更新。在模拟器上运行时，可以通过按住\
  \ `Ctrl` 键（macOS 上为 `Cmd`）的同时点击鼠标键来模拟多次触摸（注意，如果模拟器在工具窗口中运行可能会失效）：\n\n![](img/4.1_motion_event_running.jpg)\n\
  \n图 27-3\n\n### 27.9 总结\n\nActivity 通过注册监听器并实现回调方法来接收触摸事件，该方法在调用时传递一个 `MotionEvent`\
  \ 对象。该对象包含了触摸的信息，例如事件类型、坐标以及活跃触摸的数量。\n\n当涉及多次触摸时，每个接触点被称为 `pointer`，每个指针被分配一个 `index`\
  \ 和 `ID`。虽然触摸的 `index` 可以在事件之间发生变化，但在触摸结束之前 `ID` 将保持不变。\n\n本章创建了一个用于显示并发触摸坐标和动作类型的示例应用程序。\n\
  \n在涵盖了触摸之后，下一章（标题为“使用 Android 检测器识别常见手势”）将通过实现手势识别进一步处理触摸屏幕事件。\n\n\n\n\n本章的目标是探索使用\
  \ `GestureDetector` 类来检测在 Android 设备屏幕上执行的常用手势。下一章标题为在 Android 上实现自定义手势和缩放识别，将涵盖更复杂的自定义手势检测，例如圆形运动和缩放操作。\n\
  \n## 28.1 实现常用手势检测\n\n当用户与 Android 设备的屏幕进行交互时，系统会调用当前活动应用的 `onTouchEvent()` 方法，并传递包含用户与屏幕接触数据的\
  \ `MotionEvent` 对象。通过对这些数据进行解释，可以识别屏幕上的动作是否匹配点击（tap）或滑动等常用手势。利用 `GestureDetectorCompat`\
  \ 类，只需极少的编程工作即可实现这一点。该类专门设计用于接收应用程序的运动事件信息，并根据检测到的（可用常用手势类型触发方法调用。\n\n检测常用手势的基本步骤如下：\n\
  \n1. 声明一个实现 `GestureDetector.OnGestureListener` 接口的类，包括所需的 `onFling()`、`onDown()`、`onScroll()`、`onShowPress()`、`onSingleTapUp()`\
  \ 和 `onLongPress()` 回调方法。注意，这可以是一个全新的类，也可以是包含它的 activity 类。如果需要检测双击手势，该类还必须实现 `GestureDetector.OnDoubleTapListener`\
  \ 接口并包含相应的 `onDoubleTap()` 方法。\n2. 创建 `GestureDetectorCompat` 类的实例，并将步骤 1 中创建的类实例作为参数传递进去。\n\
  3. 可选调用 `GestureDetectorCompat` 实例的 `setOnDoubleTapListener()` 方法，以便在需要时启用双击检测。\n\
  4. 在包含的 activity 中实现 `onTouchEvent()` 回调方法，该方法必须调用 `GestureDetectorCompat` 实例的 `onTouchEvent()`\
  \ 方法，并将当前的运动事件对象作为参数传递给它。\n\n一旦实现，结果是在应用程序代码中有一组方法，当检测到特定类型的手势时，这些方法会被调用。随后可以实现这些方法中的代码来执行响应相应手势需要执行的任何任务。\n\
  \n在本章的剩余部分中，我们将创建一个示例项目，将上述步骤付诸实践。\n\n## 28.2 创建示例手势检测项目\n\n该项目的目标是检测 `GestureDetectorCompat`\
  \ 类目前支持的所有常用手势，并向用户显示状态信息，以指示检测到的手势类型。\n\n从欢迎界面选择 `New Project` 选项，在弹出的新项目对话框中，点击\
  \ `Next` 按钮之前选择 `Empty Activity` 模板。\n\n在 `Name` 字段中输入 `CommonGestures` 并指定 `com.ebookfrenzy.commongestures`\
  \ 为包名。在点击 `Finish` 按钮之前，将 Minimum API level 设置为 `API 26`：`Android 8.0 (Oreo)`，并将\
  \ `Language` 菜单设置为 `Java`。\n\n按照第 11.8 将项目迁移到 View Binding 节所述调整项目以使用 view binding。\n\
  \n一旦创建了新项目，在 Project 工具窗口中导航到 `app -> res -> layout -> activity_main.xml` 文件并双击它将其加载到\
  \ Layout Editor 工具中。\n\n在 Layout Editor 工具中，选择“Hello, World!” `TextView` 组件，并在 Attributes\
  \ 工具窗口中输入 `gestureStatusText` 作为 ID。\n\n## 28.3 实现监听器类\n\n如前所述，有创建一个实现 `GestureDetector.OnGestureListener`\
  \ 接口的类，如果需要双击检测，还需要实现 `GestureDetector.OnDoubleTapListener` 接口。虽然可以是一个全新的类，但在当前\
  \ activity 类中实现它也是完全有效的。因此，为了本示例，我们将修改 `MainActivity` 类以实现这些监听接口。编辑 `MainActivity.java`\
  \ 文件使其内容如下：\n\n```java\npackage com.ebookfrenzy.commongestures;\n\nimport android.view.GestureDetector;\n\
  \n.\n\n.\n\npublic class MainActivity extends AppCompatActivity\n        implements\
  \ GestureDetector.OnGestureListener,\n        GestureDetector.OnDoubleTapListener\n\
  {\n\n.\n.\n}\n```\n\n声明该类实现了监听接口意味着在类中也必须实现相应的方法：\n\n```java\npackage com.ebookfrenzy.commongestures;\n\
  \n.\n\n.\n\nimport android.view.MotionEvent;\n\npublic class MainActivity extends\
  \ AppCompatActivity\n        implements GestureDetector.OnGestureListener,\n   \
  \     GestureDetector.OnDoubleTapListener {\n\n.\n.\n\n    @Override\n    public\
  \ boolean onDown(MotionEvent event) {\n        binding.gestureStatusText.setText\
  \ (\"onDown\");\n        return true;\n    }\n\n    @Override\n    public boolean\
  \ onFling(MotionEvent event1, MotionEvent event2,\n                            \
  \   float velocityX, float velocityY) {\n        binding.gestureStatusText.setText(\"\
  onFling\");\n        return true;\n    }\n\n    @Override\n    public void onLongPress(MotionEvent\
  \ event) {\n        binding.gestureStatusText.setText(\"onLongPress\");\n    }\n\
  \n    @Override\n    public boolean onScroll(MotionEvent e1, MotionEvent e2,\n \
  \                              float distanceX, float distanceY) {\n        binding.gestureStatusText.setText(\"\
  onScroll\");\n        return true;\n    }\n\n    @Override\n    public void onShowPress(MotionEvent\
  \ event) {\n        binding.gestureStatusText.setText(\"onShowPress\");\n    }\n\
  \n    @Override\n    public boolean onSingleTapUp(MotionEvent event) {\n       \
  \ binding.gestureStatusText.setText(\"onSingleTapUp\");\n        return true;\n\
  \    }\n\n    @Override\n    public boolean onDoubleTap(MotionEvent event) {\n \
  \       binding.gestureStatusText.setText(\"onDoubleTap\");\n        return true;\n\
  \    }\n\n    @Override\n    public boolean onDoubleEvent(MotionEvent event) {\n\
  \        binding.gestureStatusText.setText(\"onDoubleEvent\");\n        return true;\n\
  \    }\n\n    @Override\n    public boolean onSingleTapConfirmed(MotionEvent event)\
  \ {\n        binding.gestureStatusText.setText(\"onSingleTapConfirmed\");\n    \
  \    return true;\n    }\n\n.\n.\n}\n```\n\n注意许多方法返回了 `true`。这向 Android 框架指示事件已被方法消费，不需要传递给栈中的下一个事件处理器。\n\
  \n## 28.4 创建 GestureDetectorCompat 实例\n\n在 activity 类更新实现监听接口后，下一步是创建 `GestureDetectorCompat`\
  \ 类的实例。由于只需要在创建 activity 时执行一次，此代码的最佳位置是 `onCreate()` 方法中。由于我们还想检测双击，代码还需要调用 `GestureDetectorCompat`\
  \ 实例的 `setOnDoubleTapListener()` 方法：\n\n```java\npackage com.ebookfrenzy.commongestures;\n\
  \n.\n\n.\n\nimport androidx.core.view.GestureDetectorCompat;\n\npublic class MainActivity\
  \ extends AppCompatActivity\n        implements GestureDetector.OnGestureListener,\n\
  \        GestureDetector.OnDoubleTapListener {\n\n    private ActivityMainBinding\
  \ binding;\n    private GestureDetectorCompat gDetector;\n\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        binding = ActivityMainBinding.inflate(getLayoutInflater());\n        View\
  \ view = binding.getRoot();\n        setContentView(view);\n        this.gDetector\
  \ = new GestureDetectorCompat(this,this);\n        gDetector.setOnDoubleTapListener(this);\n\
  \    }\n\n...\n}\n```\n\n## 28.5 实现 onTouchEvent() 方法\n\n\n\n\n\n如果此时编译并运行应用程序，即使在设备显示屏上执行手势，也不会发生任何事情。这是因为尚未添加代码来拦截触摸事件并将其传递给\
  \ `GestureDetectorCompat` 实例。为了实现这一点，需要在 activity 类中重写 `onTouchEvent()` 方法，并对其进行实现，使其调用\
  \ `GestureDetectorCompat` 实例的 `onTouchEvent()` 方法。因此，在 `MainActivity.java` 文件中实现该方法，其代码内容如下：\n\
  \n```java\n@Override\npublic boolean onTouchEvent(MotionEvent event) {\n    this.gDetector.onTouchEvent(event);\n\
  \    // Be sure to call the superclass implementation\n    return super.onTouchEvent(event);\n\
  }\n```\n\n## 28.6 测试应用程序\n\n在物理 Android 设备或 AVD 模拟器上编译并运行应用程序。启动后，尝试滑动、按下、滚动动作以及双击和单击。注意，文本视图会更新以反映这些事件，如图\
  \ 28-1 所示：\n\n![](img/Image2425.jpg)\n\n图 28-1\n\n## 28.7 总结\n\n用户与设备触摸屏显示之间的任何物理接触都可以被视为“手势”。由于缺乏传统系统的物理键盘和鼠标指针，手势被广泛用作用户与应用程序之间的交互方法。虽然手势可以由几乎任何序列动作组成，但有一套广泛使用的手势集，触摸屏设备的用户对此非常熟悉。利用\
  \ Android 手势检测器（Gesture Detector）类，可以在应用程序中轻松检测出许多此类“常用手势”。在本章中，从理论和示例项目实现两个概述了该技术的使用。\n\
  \n在本章涵盖了常用手势之后，下一章将介绍检测更广泛的手势类型，包括同时设计和检测自定义手势的能力。\n\n## 29. 在 Android 上实现自定义手势和缩放识别\n\
  \n上一章涵盖了在 Android 应用程序内部检测所谓的“常用手势”。然而，在实践中，一个手势从理论上讲可能涉及 Android 设备显示屏上的几乎任何序列触摸动作。考虑到这一事实，Android\
  \ SDK 允许应用程序开发者定义几乎任何性质的自定义手势，并在用户执行时触发事件。这是一个多阶段的过程，其细节是本章的主题。\n\n## 29.1 Android\
  \ 手势生成应用程序\n\nAndroid SDK 允许开发者设计自定义手势，这些手势随后存储在与 Android 应用程序包捆绑的手势文件中。这些自定义手势文件最简单的创建方法是使用作为\
  \ Android SDK 示例包一部分提供的 Gesture Builder 应用程序。创建手势文件涉及在物理设备或模拟器上启动 Gesture Builder\
  \ 应用程序，并“绘制”应用程序需要检测的手势。一旦设计好手势，就可以包含手势数据的文件从设备或模拟器的 SD 卡中提取出来并添加到应用程序项目中。在应用程序代码中，该文件会被加载到\
  \ `GestureLibrary` 类的实例中，并可以使用它来搜索用户在设备显示屏上执行的任何手势的匹配项。\n\n### 29.2 GestureOverlayView\
  \ 类\n\n为了方便在应用程序中检测手势，Android SDK 提供了 `GestureOverlayView` 类。这是一个透明视图，可以放置在用户界面的其他视图之上，其唯一目的是检测手势。\n\
  \n## 29.3 检测手势\n\n通过加载使用 Gesture Builder 应用创建的手势文件，然后在 `GestureOverlayView` 类的实例上注册\
  \ `GesturePerformedListener` 事件监听器来检测手势。随后，声明该类实现 `OnGesturePerformedListener` 接口以及该接口所需的\
  \ `onGesturePerformed` 回调方法。当监听器检测到手势时，Android 运行时系统会触发对 `onGesturePerformed` 回调方法的调用。\n\
  \n## 29.4 识别特定手势\n\n当检测到手势时，会调用 `onGesturePerformed` 回调方法，并传递检测手势的 `GestureOverlayView`\
  \ 对象引用以及一个包含手势信息的 `Gesture` 对象。\n\n访问 `Gesture` 对象后，可以使用 `GestureLibrary` 将检测到的手势与之前加载到应用程序的手势文件中的内容进行比较。`GestureLibrary`\
  \ 通过为每个手势计算预测分，报告用户执行的手势与手势文件条目匹配的概率。预测分达到 1.0 或更高通常被认为文件中存储的手势与用户在设备显示屏上执行的手势之间是良好匹配。\n\
  \n### 29.5 安装并运行 Gesture Builder 应用程序\n\n创建手势文件最简单的方法是使用允许捕获并保存手势动作的应用程序。虽然 Google\
  \ 最初提供了一个此类用途的程序，但它在较新版本的 Android 上已没有得到充分维护。幸运的是，由 Manan Gandhi 开发的 Gesture Builder\
  \ 应用程序提供了替代方案，可以通过 Google Play Store 中的以下 URL 获取：\n\n[`play.google.com/store/apps/details?id=pack.GestureApp`](https://play.google.com/store/apps/details?id=pack.GestureApp)\n\
  \n注意，该程序在运行 Android 9.0 (API 28) 或更旧版本的设备或模拟器上运行最好。\n\n## 29.6 创建手势文件\n\n一旦加载 Gesture\
  \ Builder 应用程序，点击设备屏幕底部的 Add 按钮，在随后的屏幕上，如图 29-1 所示，使用屏幕上的圆形动作绘制手势。假设手势符合要求（如屏幕上的黄色线条所示），点击保存按钮将手势添加到手势文件中，并在提示输入名称时输入“Circle\
  \ Gesture”。\n\n![](img/as_3.4_gesture_builder.jpg)\n\n图 29-1\n\n手势保存后，返回主界面，Gesture\
  \ Builder 将显示当前定义的手势列表，此时仅包含新的 Circle Gesture。在继续之前，使用 Test 按钮验证该手势是否符合预期。\n\n###\
  \ 29.7 创建示例项目\n\n在欢迎界面选择 New Project 选项，并在生成的新项目对话框中选择 Empty Activity 模板，然后点击 Next。\n\
  \n在 Name 字段输入 CustomGestures，并指定 `com.ebookfrenzy.customgestures` 为包名。在点击 Finish\
  \ 按钮之前，将 Minimum API level 设置为 API 26: Android 8.0 (Oreo)，并将 Language 菜单 Java。按照第\
  \ 11.8 节概述的步骤修改项目以使用 view binding。\n\n### 29.8 从 SD 卡提取手势文件\n\n\n\n\n\n由于每个手势都是在\
  \ Gesture Builder 应用中创建的，因此它们被添加到名为 `gesture.txt` 的文件中，该文件位于运行应用程序的模拟器或设备的存储中。然而，在将此文件添加到\
  \ Android Studio 项目之前，必须先将其从设备存储中拷贝出来并保存到本地文件系统。最简单的方法是使用 Android Studio 的 Device\
  \ File Explorer（设备文件浏览器）工具窗口。通过 `View` -> `Tool Windows` -> `Device File Explorer`\
  \ 菜单选项显示此工具。显示后，从下拉菜单中选择创建手势文件的设备或模拟器，然后通过文件系统导航到以下文件夹：\n\n`sdcard/Android/data/pack.GestureApp/files`\n\
  \n在该文件夹中找到 `gesture.txt` 文件，右键点击它，选择 `Save As……`（另存为）菜单选项，并将文件保存到临时位置，重命名为 `gestures`。\n\
  \n![](img/as_3.5_gestures_file_in_device_explorer.jpg)\n\n图 29-2\n\n一旦手势文件创建并从设备存储中提取出来，就可以作为资源文件添加到\
  \ Android Studio 项目中了。\n\n### 29.9 将手势文件添加到项目\n\n在 Android Studio Project 工具窗口中，找到并右键点击\
  \ `res` 文件夹（位于 `app` 下），并从生成的菜单中选择 `New`（新建） -> `Directory`（目录）。在 `New Directory`\
  \ 对话中，输入 `raw` 作为文件夹名称并按下键盘回车键。使用适用于你操作系统类型的相应文件管理器工具，找到之前从设备存储中提取的 `gestures` 文件，并将其复制、粘贴到\
  \ Project 工具窗口中新的 `raw` 文件夹中。\n\n## 29.10 设计用户界面\n\n此示例应用需要一个用户界面，由 `ConstraintLayout`\
  \ 视图组成，在其上方层叠一个 `GestureOverlayView`，以拦截用户执行的任何手势。找到 `app` -> `res` -> `layout`\
  \ -> `activity_main.xml` 文件，双击它将其加载到 Layout Editor（布局编辑器）工具中，选择并删除默认的 `TextView`\
  \ 部件。\n\n切换布局编辑器的 Code 模式并修改 XML 使内容如下：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n    xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    android:layout_width=\"\
  match_parent\"\n    android:layout_height=\"match_parent\"\n    tools:context=\"\
  .MainActivity\">\n    <android.gesture.GestureOverlayView\n        android:id=\"\
  @+id/gOverlay\"\n        android:layout_width=\"0dp\"\n        android:layout_height=\"\
  0dp\"\n        app:layout_constraintBottom_toBottomOf=\"parent\"\n        app:layout_constraintEnd_toEndOf=\"\
  parent\"\n        app:layout_constraintStart_toStartOf=\"parent\"\n        app:layout_constraintTop_toTopOf=\"\
  parent\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n```\n\n### 29.11\
  \ 加载手势文件\n\n现在手势文件已添加到项目中，下一步是编写一些代码以便在活动启动时加载该文件。对于本项目，实现此目的的代码将按所示添加到位于 `MainActivity.java`\
  \ 源文件中的 `MainActivity` 类中：\n\n```java\npackage com.ebookfrenzy.customgestures;\n\
  \n.\n\n.\n\nimport android.gesture.GestureLibraries;\nimport android.gesture.GestureLibrary;\n\
  import android.gesture.GestureOverlayView;\nimport android.gesture.GestureOverlayView.OnGesturePerformedListener;\n\
  \npublic class MainActivity extends AppCompatActivity\n        implements OnGesturePerformedListener\
  \ {\n\n    private ActivityMainBinding binding;\n\n    private GestureLibrary gLibrary;\n\
  \n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n    \
  \    super.onCreate(savedInstanceState);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n       \
  \ gestureSetup();\n    }\n\n    private void gestureSetup() {\n        gLibrary\
  \ =\n                GestureLibraries.fromRawResource(this,\n                  \
  \  R.raw.gestures);\n        if (!gLibrary.load()) {\n            finish();\n  \
  \      }\n    }\n\n.\n}\n```\n\n除了一些导入指令外，上述代码还创建了一个名为 `gLibrary` 的 `GestureLibrary`\
  \ 实例，然后将 raw 文件夹中手势文件的内容加载到其中。活动还被修改为实现 `OnGesturePerformedListener`，这需要实现 `onGesturePerformed`\
  \ 方法（该方法将在后面的章节中创建）。\n\n## 29.12 注册事件\n\n为了让活动接收到用户已执行手势的通知，必须在视图上注册 `OnGesturePerformed`\
  \ 监听器，可以通过以下代码获取其引用：\n\n```java\nprivate void gestureSetup() {\n    gLibrary = GestureLibraries.fromRawResource(this,\
  \ R.raw.gestures);\n    if (!gLibrary.load()) {\n        finish();\n    }\n    GestureOverlayView\
  \ gOverlay = findViewById(R.id.gOverlay);\n    gOverlay.addOnGestureListener(this);\n\
  }\n```\n\n### 29.13 实现 onGesturePerformed 方法\n\n在对应用进行首次测试之前，剩下的就是实现 `onGesturePerformed`\
  \ 回调。这是该方法：\n\n```java\npackage com.ebookfrenzy.customgestures;\n\n// ... imports\n\
  import android.gesture.Gesture;\nimport android.gesture.Prediction;\nimport android.widget.Toast;\n\
  import java.util.ArrayList;\n\npublic class MainActivity extends AppCompatActivity\
  \ implements OnGesturePerformedListener {\n    // ... fields and methods\n\n   \
  \ public void onGesturePerformed(GestureOverlayView overlay, Gesture gesture) {\n\
  \        ArrayList<Prediction> predictions = gLibrary.recognize(gesture);\n    \
  \    if (predictions.size() > 0 && predictions.get(0).score > 1.0) {\n         \
  \   String action = predictions.get(0).name;\n            Toast.makeText(this, action,\
  \ Toast.LENGTH_SHORT).show();\n        }\n    }\n}\n```\n\n当 `GestureOverlayView`\
  \ 对象上检测到手势时，Android 运行时会调用 `onGesturePerformed` 方法。传递的参数是检测手势的 `GestureOverlayView`\
  \ 对象的引用以及一个 `Gesture` 类型的对象。`Gesture` 类设计用于持有定义特定手势的信息（本质上构成手势的笔画的一系列带时间戳的点）。\n\n\
  `Gesture` 对象被传递给 `gLibrary` 实例的 `recognize()` 方法，该方法的目的是是将当前手势与从手势加载的每个手势进行比较。完成此任务后，`recognize()`\
  \ 方法返回一个 `ArrayList` 对象，其中包含每次比较执行后的 `Prediction` 对象。该列表按照从最佳匹配（数组中位置 0）到最差匹配的顺序排序。\n\
  \n因此，上述方法中的代码获取位置 0 的预测（最匹配项），确保其得分大于 1.0，然后显示一个 Toast- 消息（一种设计用于向用户显示通知弹窗的 Android\
  \ 类），用以显示匹配的手势的名称。\n\n### 29.14 测试应用程序\n\n\n\n\n\n在模拟器或物理 Android 设备上构建并运行应用程序，然后在屏幕上执行圆圈手势。执行后，应该出现一个包含检测出手势名称的通知。请注意，当手势被识别时，屏幕上会用亮黄色线条将其勾勒，而覆盖层不确定的手势则显示为淡黄色线条。虽然这在开发过程中很有用，但对于实际应用可能并不理想。显然，仍然还有一些配置工作需要完成。\n\
  \n### 29.15 配置 GestureOverlayView\n\n默认，`GestureOverlayView` 配置为在手势期间显示黄色线条。用于绘制已识别和未识别手势的颜色可以通过\
  \ `android:gestureColor` 和 `android:uncertainGestureColor` 属性定义。例如，要隐藏手势线条，请如下所示修改示例项目中的\
  \ `activity_main.xml` 文件：\n\n```xml\n<android.gesture.GestureOverlayView\n    android:id=\"\
  @+id/gOverlay\"\n    android:layout_width=\"0dp\"\n    android:layout_height=\"\
  0dp\"\n    app:layout_constraintBottom_toBottomOf=\"parent\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\"\n    android:gestureColor=\"#00000000\"\n    android:uncertainGestureColor=\"\
  #00000000\" />\n```\n\n重新运行应用程序后，手势现在应该是不可见的（因为它们在 `ConstraintLayout` 视图的白色背景上被绘制为白色）。\n\
  \n## 29.16 拦截手势\n\n如前所述，`GestureOverlayView` 是透明覆盖层，可以放置在其他视图之上。这引出了问题：当手势被识别时，手势覆盖层拦截的事件是否应该传递给底层的视图？这通过\
  \ `GestureOverlayView` 实例的 `android:eventsInterceptionEnabled` 属性来控制。当设置为 `true`\
  \ 时，识别出手势时，手势事件不会传递给底层视图。当在可能配置为响应某些手势而滚动的视图上执行手势时，此设置可能特别有用。将此属性设置为 `true` 可以避免手势同时被解释为底层视图向特定方向滚动的指令。\n\
  \n### 29.17 检测缩放手势\n\n在离开通用触摸处理和特定的手势识别之前，本章的最后一个主题是处理缩放手势。虽然可以使用本章之前节概述的步骤来创建和检测各种手势，但实际上，使用目前讨论的技术无法检测缩放手势（即使用两个手指进行拉展和收缩动作，通常用于缩放视图或图像）。\n\
  \n检测缩放手势最简单的方法是使用 `ScaleGestureDetector` 类。通常来说，检测缩放手势涉及以下三个步骤：\n\n1. 声明一个实现 `SimpleOnScaleGestureListener`\
  \ 接口的新类，包括所需的 `onScale()`、`onScaleBegin()` 和 `onScaleEnd()` 回调方法。\n2. 创建 `ScaleGestureDetector`\
  \ 类的实例，并将步骤 1 中创建的类实例作为参数传递。\n3. 在所属 Activity 中实现 `onTouchEvent()` 回调方法，该方法反过来调用\
  \ `ScaleGestureDetector` 类的 `onTouchEvent()` 方法。\n\n在本章的剩余部分，我们将创建一个示例，旨在演示缩放手势识别的实现。\n\
  \n### 29.18 缩放手势示例项目\n\n从欢迎界面选择 `New Project` 选项，在生成的新项目对话框中，点击 `Next` 按钮之前选择 `Empty\
  \ Activity` 模板。\n\n在 `Name` 字段输入 `PinchExample`，并指定 `com.ebookfrenzy.pinchexample`\
  \ 为包名。在点击 `Finish` 按钮之前，将 Minimum API 级设置为 `API 26: Android 8.0 (Oreo)`，并将语言菜单更改为\
  \ `Java`。按照 11.8 Migrating a Project to View Binding 中的步骤将项目转换为使用 view binding。\n\
  \n在 `activity_main.xml` 文件中，选择默认的 `TextView` 对象并使用 Attributes 属性窗口将 ID 设置为 `myTextView`。\n\
  \n找到并加载 `MainActivity.java` 文件到 Android Studio 编辑器，并如下所示修改文件：\n\n```java\npackage\
  \ com.ebookfrenzy.pinchexample;\n\nimport android.view.MotionEvent;\nimport android.view.ScaleGestureDetector;\n\
  import android.view.ScaleGestureDetector.SimpleOnScaleGestureListener;\n\npublic\
  \ class MainActivity extends AppCompatActivity {\n    private ActivityMainBinding\
  \ binding;\n    ScaleGestureDetector scaleGestureDetector;\n\n    @Override\n  \
  \  protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        binding = ActivityMainBinding.inflate(getLayoutInflater());\n        View\
  \ view = binding.getRoot();\n        setContentView(view);\n        scaleGestureDetector\
  \ = new ScaleGestureDetector(this, new MyOnScaleListener());\n    }\n\n    @Override\n\
  \    public boolean onTouch(MotionEvent event) {\n        scaleGestureDetector.onTouchEvent(event);\n\
  \        return true;\n    }\n\n    public class MyOnScaleListener extends SimpleOnScaleGestureListener\
  \ {\n        @Override\n        public boolean onScale(ScaleGestureDetector detector)\
  \ {\n            float scaleFactor = detector.getScaleFactor();\n            if\
  \ (scaleFactor > 1) {\n                binding.myTextView.setText(\"Zooming Out\"\
  );\n            } else {\n                binding.myTextView.setText(\"Zooming In\"\
  );\n            }\n            return true;\n        }\n\n        @Override\n  \
  \      public boolean onScaleBegin(ScaleGestureDetector detector) {\n          \
  \  return true;\n        }\n\n        @Override\n        public void onScaleEnd(ScaleGestureDetector\
  \ detector) {\n        }\n    }\n}\n```\n\n\n\n\n通过在现有视图上叠加透明的 `GestureOverlayView`\
  \ 类实例，并实现 `OnGesturePerformedListener` 事件监听器，可以在显示器的区域上检测手势。使用 `GestureLibrary`，可以生成用户执行的手势与手势文件中存储的手势之间的匹配排序列表，并使用预测分数来决定某个手势是否足够匹配。\n\
  \n可以通过实现 `ScaleGestureDetector` 类来检测缩放手势，本章也提供一个该类的示例。\n\n# 30. Android Fragments\
  \ 简介\n\n随着书中章节的深入，你会逐渐发现，Android 系统背后的许多设计概念其初衷都是促进组成应用程序的不同元素之间的重用和交互。本章将探讨的此类领域涉及\
  \ `Fragments` 的使用。\n\n本章将概述片段的基础知识，包括它们是什么以及如何在应用程序中创建和使用它们。下一章将通过一个教程，展示如何在 Android\
  \ Studio 中开发应用程序时让片段投入实际运行，包括片段之间通信的实现。\n\n## 30.1 什么是 Fragment？\n\nFragment（片段）是应用程序用户界面的一个自包含的、模块化的部分以及相应的行为，它可以嵌入到\
  \ activity 中。在应用程序设计阶段，可以组合多个 Fragment 来创建一个 activity，并在应用程序运行时将它们添加到 activity 或从\
  \ activity 中移除，以创建动态变化的用户界面。\n\nFragment 只能作为 activity 的一部分使用，而不能被实例化为独立的应用程序元素。尽管如此，一个\
  \ Fragment 可以被认为是一个功能性的“子 activity”，它具有与完整 activity 相似的生命周期。\n\nFragment 以 XML 布局文件的形式存储，可以通过在\
  \ activity 的布局文件中放置适当的 `<fragment>` 元素，或者直接通过 activity 类实现中的代码将其添加到 activity 中。\n\
  \n## 30.2 创建 Fragment\n\n构成 Fragment 的两个组件都是一个 XML 布局文件和一个对应的 Java 类。用于 Fragment\
  \ 的 XML 布局文件格式与任何其他 activity 布局的格式相同，并且可以包含布局管理器和视图的任何组合和复杂度。例如，下面的 XML 布局用于一个由带有红色背景的\
  \ `ConstraintLayout` 组成的片段，其中包含一个具有白色前景的单个 `TextView`：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    android:id=\"@+id/constraintLayout\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    android:background=\"@android:color/holo_red_dark\"\n    tools:context=\"\
  .FragmentOne\">\n    <TextView\n        android:id=\"@+id/textView1\"\n        android:layout_width=\"\
  wrap_content\"\n        android:layout_height=\"wrap_content\"\n        android:text=\"\
  My First Fragment\"\n        android:textAppearance=\"@style/TextAppearance.AppCompat.Large\"\
  \n        android:textColor=\"@color/white\"\n        app:layout_constraintBottom_toBottomOf=\"\
  parent\"\n        app:layout_constraintEnd_toEndOf=\"parent\"\n        app:layout_constraintStart_toStartOf=\"\
  parent\"\n        app:layout_constraintTop_toTopOf=\"parent\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n与布局对应的类必须是 Android `Fragment` 类的子类。该类至少应该重写 `onCreateView()` 方法，该方法负责加载片段的布局。例如：\n\
  \n```java\npackage com.example.myfragmentdemo;\n\nimport android.os.Bundle;\nimport\
  \ android.view.LayoutInflater;\nimport android.view.View;\nimport android.view.ViewGroup;\n\
  import androidx.fragment.app.Fragment;\n\npublic class FragmentOne extends Fragment\
  \ {\n    @Override\n    public View onCreateView(LayoutInflater inflater,\n    \
  \          ViewGroup container,\n              Bundle savedInstanceState) {\n  \
  \      // 胀此片段的布局\n        binding = FragmentTextBinding.inflate(inflater, container,\
  \ false);\n        return binding.getRoot();\n}\n```\n\n除了 `onCreateView()` 方法外，该类还可以重写标准的生命周期方法。一旦片段布局和类被创建，该片段就可以在\
  \ activity 中使用了。\n\n## 30.3 将 Fragment 添加到 Activity 中\n\n可以通过编写 Java 代码或将片段嵌入 activity\
  \ 的布局将 Fragment 并到 activity 中。无论使用哪种方法，需要注意的关键点是，如果在旧版本发布中使用支持库，任何 activity 必须实现为\
  \ `FragmentActivity` 的子类，而不是 `Activity` 类：\n\n```java\npackage com.example.myfragmentdemo;\n\
  \nimport android.os.Bundle;\nimport androidx.fragment.app.FragmentActivity;\n\n\
  public class MainActivity extends FragmentActivity {\n}\n```\n\n接下来的示例将上一节创建的片段嵌入到\
  \ activity 布局中：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    tools:context=\".MainActivity\">\n    <androidx.fragment.app.FragmentContainerView\n\
  \        android:id=\"@+id/fragment2\"\n        android:name=\"com.example.myfragmentdemo.FragmentOne\"\
  \n        android:layout_width=\"0dp\"\n        android:layout_height=\"wrap_content\"\
  \n        android:layout_marginStart=\"32dp\"\n        android:layout_marginEnd=\"\
  32dp\"\n        app:layout_constraintBottom_toBottomOf=\"parent\"\n        app:layout_constraintEnd_toEndOf=\"\
  parent\"\n        app:layout_constraintStart_toStartOf=\"parent\"\n        app:layout_constraintTop_toTopOf=\"\
  parent\"\n        tools:layout=\"@layout/fragment_one\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n`<fragment>` 元素中的关键属性是 `android:name`（它必须引用片段相关的类）和 `tools:layout`（它必须引用片段布局的\
  \ XML 资源文件）。\n\n一旦添加到 activity 的布局中，就可以在 Android Studio Layout Editor 工具中查看和操作片段。例如，图\
  \ 30-1 显示了 Android Studio Layout Editor 中嵌入片段的上述布局：\n\nimage/4.1_my_first_fragment.jpg\n\
  \n图 30-1\n\n## 30.4 使用代码添加和管理 Fragment\n\n通过 activity 的 XML 布局将片段添加到 activity 虽然方便，但代价是\
  \ activity 无法在运行时移除片段。为了在运行时对片段进行完全动态控制，必须通过代码添加这些片段。这样做的好处是，可以在应用程序运行时动态地添加、移除甚至让片段相互替换。\n\
  \n在使用代码管理片段时，片段本身仍然由一个 XML 布局文件和一个对应的类组成。区别在于宿主 activity 如何处理片段。在使用代码向 activity\
  \ 添加片段时，有一套标准的步骤序列：\n\n\n\n\n\n1. 创建 fragment 类的实例。\n2. 将任何额外的 intent 参数传递给该类实例。\n\
  3. 获取 `fragment manager` 实例的引用。\n4. 在 `fragment manager` 实例上调用 `beginTransaction()`\
  \ 方法。这将返回一个 `fragment transaction` 实例。\n5. 调用 `fragment transaction` 实例的 `add()`\
  \ 方法，将要包含 fragment 的视图资源 ID 和 fragment 类实例作为参数传递进去。\n6. 调用 fragment transaction\
  \ 的 `commit()` 方法。\n\n例如，以下代码添加了由 `FragmentOne` 类定义的 fragment，使其显示在 ID 为 `LinearLayout1`\
  \ 的容器视图中：\n\n```java\nFragmentOne firstFragment = new FragmentOne();\nfirstFragment.setArguments(getIntent().getExtras());\n\
  FragmentManager fragManager = getSupportFragmentManager();\nFragmentTransaction\
  \ transaction = fragManager.beginTransaction();\ntransaction.add(R.id.LinearLayout1,\
  \ firstFragment);\ntransaction.commit();\n```\n\n上述代码为了清晰起见，将每个步骤拆分为单独语句。然而，最后四行可以简写为单行代码，如下：\n\
  \n```java\ngetSupportFragmentManager().beginTransaction()\n        .add(R.id.LinearLayout1,\
  \ firstFragment).commit();\n```\n\n一旦被添加到容器中，后续可以通过调用 fragment transaction 实例的 `remove()`\
  \ 方法将其移除，并传递要移除的 fragment 实例引用：\n\n```java\ntransaction.remove(firstFragment);\n\
  ```\n\n同样，可以通过调用 fragment transaction 实例的 `replace()` 方法用一个 fragment 替换另一个。该方法接受包含\
  \ fragment 的视图 ID 和新 fragment 的实例作为参数。被替换的 fragment 也可以放置于所谓的返回栈（back stack）中，以便在用户导航回来时可以快速恢复。这通过在调用\
  \ `commit()` 方法之前调用 fragment transaction 对象的 `addToBackStack()` 方法来实现：\n\n```java\n\
  FragmentTwo secondFragment = new FragmentTwo();\ntransaction.replace(R.id.LinearLayout1,\
  \ secondFragment);\ntransaction.addToBackStack(null);\ntransaction.commit();\n```\n\
  \n## 30.5 处理 fragment 事件\n\n如之前讨论过的，fragment 非常像一个子 activity，拥有它自己的布局、类和生命周期。fragment\
  \ 内部的视图组件（如按钮和文本视图）能够像普通 activity 一样产生事件。这产生了一个问题：是哪个类来接收来自 fragment 中视图的事件；是 fragment\
  \ 本身，还是嵌入该 fragment 的 activity？问题的答案取决于事件处理程序的声明方式。\n\n在标题为 Android 事件处理概述与示例 的章节中，讨论了两种处理事件的方法。第一种涉及在\
  \ activity 的代码中配置事件监听器和回调方法。例如：\n\n```java\nbinding.button.setOnClickListener(\n\
  \        new Button.OnClickListener() {\n            public void onClick(View v)\
  \ {\n                // 当按钮被点击时\n                // 执行的代码\n            }\n     \
  \   }\n);\n```\n\n在拦截点击事件的情况下，第二种涉及在 XML 布局文件中设置 `android:onClick` 属性：\n\n```xml\n\
  <Button\n    android:id=\"@+id/button1\"\n    android:layout_width=\"wrap_content\"\
  \n    android:layout_height=\"wrap_content\"\n    android:onClick=\"onClick\"\n\
  \    android:text=\"Click me\" />\n```\n\nfragment 中视图生成的事件的通用规则是：如果在 fragment 类中使用事件监听器和回调方法的方法声明了事件监听器，那么该事件将首先由\
  \ fragment 处理。然而，如果使用了 `android:onClick` 资源，事件将直接传递给包含 fragment 的 activity。\n\n\
  ## 30.6 实现 fragment 通信\n\n一旦一个或多个 fragment 被嵌入 activity 中，很有可能需要在 fragment 与 activity\
  \ 之间、以及 fragment 彼此之间进行某种形式的通信。事实上，良好的实践要求 fragment 之间不直接通信。所有通信都应该通过封装它的 activity\
  \ 进行。\n\n为了让 activity 与 fragment 通信，activity 必须通过分配它的 ID 来识别 fragment 对象。一旦获取此引用，activity\
  \ 就可以直接调用 fragment 对象的公共方法。\n\n反向通信（从 fragment 到 activity）稍微复杂一些。首先，fragment 必须定义一个监听器接口，然后在\
  \ activity 中实现该接口。例如，以下代码在 fragment 类 `ToolbarFragment` 上声明了一个名为 `ToolbarListener`\
  \ 的接口。代码还声明了一个变量，用于存储 activity 的引用：\n\n```java\npublic class ToolbarFragment extends\
  \ Fragment {\n    ToolbarListener activityCallback;\n    public interface ToolbarListener\
  \ {\n        void onButtonClick(int position, String text);\n    }\n}\n```\n\n上述代码规定，任何实现\
  \ `ToolbarListener` 接口的类都必须实现回调方法 `onButtonClick`，该方法反过来接受一个整数和一个 `String`。\n\n\
  接下来，需要重写并实现 fragment 类的 `onAttach()` 方法。当 fragment 初始化并与 activity 关联时，Android 系统会自动调用此方法。该方法传递了包含该\
  \ fragment 的 activity 引用。该方法必须存储此 activity 的本地引用，并验证它是否实现了 `ToolbarListener` 接口：\n\
  \n```java\n@Override\npublic void onAttach(Context context) {\n    super.onAttach(context);\n\
  \    try {\n        activityCallback = (ToolbarListener) activity;\n    } catch\
  \ (ClassCastException e) {\n        throw new ClassCastException(activity.toString()\
  \ + \" must implement ToolbarListener\");\n    }\n}\n```\n\n执行此示例后，activity 的引用将存储在变量\
  \ `activityCallback` 中，如果该 activity 未实现 `ToolbarListener` 接口，将抛出异常。\n\n下一步是在 fragment\
  \ 内部调用 activity 的回调方法。何时以及如何发生取决于 fragment 需要联系 activity 的情况。例如，以下代码在点击按钮时调用 activity\
  \ 的回调方法：\n\n```java\npublic void buttonClicked(View view) {\n    activityCallback.onButtonClick(arg1,\
  \ arg2);\n}\n```\n\n剩下的就是修改 activity 类以实现 `ToolbarListener` 接口。例如：\n\n```java\n\
  public class MainActivity extends FragmentActivity implements ToolbarFragment.ToolbarListener\
  \ {\n    public void onButtonClick(String arg1, int arg2) {\n        // 实现回调方法的代码\n\
  \    }\n}\n```\n\n从上述代码中可以看出，activity 声明它实现了 `ToolbarFragment` 类的 `ToolbarListener`\
  \ 接口，并按照接口实现了 `onButtonClick()` 方法。\n\n## 30.7 总结\n\n\n\n\n\n片段（Fragments）为创建可复的用户界面布局和应用行为模块提供了一种强大的机制，这些模块一旦创建，就可以嵌入活动（activities）中。一个片段由一个用户界面布局文件和一个类组成。可以通过将片段添加到活动的布局文件中，或者通过编写代码来管理片段，从而在活动中使用片段。在代码中添加到活动中的片段可以在运行时动态地删除和替换。片段之间的所有通信都应该通过其所属的活动进行。在本章涵盖了片段的基础知识后，下一章将通过一个教程来加强本章中概述的技术。\n\
  \n# 在 Android Studio 中使用片段 - 示例\n\n正如上一章所述，片段为创建包含用户界面和行为在内的可重用应用功能模块提供了一种方便的机制。片段一旦创建，就可以被嵌入。在上一章探索了片段的整体理论后，本章的目标是使用\
  \ Android Studio 创建一个示例，用以演示创建和使用片段的实际步骤，并实现片段片段之间的通信。\n\n## 1.1 关于片段应用程序\n\n在本章创建的应用程序将由单个活动和两个片段组成。第一个片段的用户界面将包含一个类似于工具栏的内容，由一个\
  \ `EditText` 视图、一个 `SeekBar` 和一个 `Button` 组成，它们都包含在一个 `ConstraintLayout` 视图中。第二个片段仅由一个\
  \ `TextView` 组成，同样包含在一个 `ConstraintLayout` 视图中。\n\n这两个片段将嵌入应用程序的主活动，并实现通信：当第一个片段中的按钮被按下时，输入到\
  \ `EditText` 视图中的文本将出现在第二个片段的 `TextView` 上，大小由第一个片段中 `SeekBar` 的位置决定。由于此应用程序旨在适用于早期版本的\
  \ Android，因此有必要使用适当的支持库。\n\n## 1.2 创建示例项目\n\n从欢迎界面选择 `New Project` 选项，在生成的项目对话框中，选择\
  \ `Empty Activity` 模板。在 `Name` 字段中输入 `FragmentExample` 并指定 `com.ebookfrenzy.fragmentexample`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为 `26`（Android Oreo），并将 `Language`\
  \ 菜单改为 `Java`。按照 1.8 节中概述的步骤修改项目以使用视图绑定（view binding）。返回 `Gradle Scripts -> build.gradle\
  \ (Module: FragmentExample)` 文件，并在 `dependencies` 部分中添加以下指令（请注意可能有更新版本的库）：\n\n```\n\
  implementation 'androidx.navigation:navigation-fragment:2.3.5'\n```\n\n## 1.3 创建第一个布局\n\
  \n下一步是为将在我们的活动中使用的第一个片段创建用户界面。该用户界面将由一个 XML 布局文件和一个片段类组成。虽然可以手动添加，但让 Android Studio\
  \ 为我们创建会更快。在项目窗口中，找到 `app -> java -> com.ebookfrenzy.fragmentexample` 条目并点击它。从生成的菜单中，选择\
  \ `New -> Fragment -> Gallery...` 选项显示所示对话框：\n\n![](img/4.2_fragment.jpg)\n\n在点击\
  \ `Next` 按钮之前选择 `Fragment (Blank)` 模板。在随后的屏幕上，将片段命名为 `ToolbarFragment`，布局文件命名为 `fragment_toolbar`：\n\
  \n![](img/4.2_new_fragment.jpg)\n\n使用 `Design` 模式将 `fragment_toolbar.xml` 文件加载到布局编辑器，在\
  \ `Component Tree` 面板中右键点击 `FrameLayout` 条目，选择 `Convert to ConstraintLayout` 菜单，并接受确认对话框中的默认设置。将\
  \ `id` 从 `frameLayout` 更改为 `constraintLayout`。选择并删除默认的 `TextView`，向布局添加 `EditText`、`SeekBar`\
  \ 和 `Button`，并将 ids 分别更改为 `editText1`、`button1` 和 `seekBar1`。\n\n按钮上的文本更改为“Change\
  \ Text”，将文本提取为名为 `change_text` 的字符串资源，并从 `EditText` 视图中移除它。最后，将 `SeekBar` 的 `layout_width`\
