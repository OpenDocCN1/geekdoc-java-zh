  \ `Infer constraints` 按钮添加任何缺失的约束。将 `TextView` 的 `id` 更改为 `textView2`，文本更改为“Fragment\
  \ Two”，并将 `textAppearance` 属性修改为 `Large`。\n\n完成后，布局应如下所示：\n\n![](img/4.0_fragment_text_layout.jpg)\n\
  \n重复上一节执行的步骤，将 `TextFragment` 类迁移到使用视图绑定如下：\n\n```java\nimport com.ebookfrenzy.fragmentexample.databinding.FragmentTextBinding;\n\
  \nprivate FragmentTextBinding binding;\n\n@Override\npublic View onCreateView(LayoutInflater\
  \ inflater, ViewGroup container, Bundle savedInstanceState) {\n    // Inflate 此片段的布局\n\
  \    return inflater.inflate(R.layout.fragment_text, container, false);\n    binding\
  \ = FragmentTextBinding.inflate(inflater, container, false);\n    return binding.getRoot();\n\
  }\n\n@Override\npublic void onDestroyView() {\n    super.onDestroyView();\n    binding\
  \ = null;\n}\n```\n\n\n\n\n应用程序的主要活动关联了一个名为 `activity_main.xml` 的 XML 布局文件。在本例中，片段将使用该文件中的\
  \ `<fragment>` 元素添加到活动中。使用项目（Project）工具窗口，导航到 `FragmentExample` 项目的 `app -> res\
  \ -> layout` 部分，并双击 `activity_main.xml` 文件，将其加载到 Android Studio 布局编辑器（Layout Editor）工具中。\n\
  \n在设计（Design）模式下的布局编辑器中，选择并删除布局中的默认 `TextView` 对象，然后在调色板中选择“常用”（Common）类别。从视图列表中拖动\
  \ `FragmentContainerView` 组件并将其释放到布局上，使其水平居中，并使虚线出现以指示顶部布局边距的位置：\n\n![](img/as_3.5_fragment_example_add_fragment.jpg)\n\
