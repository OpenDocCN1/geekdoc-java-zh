  \n图 31-6\n\n从列表中选择 `ToolbarFragment` 条目并点击 OK 按钮关闭片段对话框。添加完成后，点击布局编辑器右上角的红色警告按钮以显示警告面板。将列出一条“未知片段”的消息，表示布局编辑器工具需要知道在预览期间期间显示哪个片段。点击错误消息中的\
