  \ `Component Tree` 中的布局层级结构如下所示：\n\n![](img/as_4.1_room_demo_table_tree.jpg)\n\n\
  图 66-13\n\n## 66.8 调整布局边距\n\n最后只需要调整布局设置。首先点击 `Component Tree` 面板中的第一个 `TableRow`\
  \ 条目。按住键盘上的 `Cmd/Ctrl` 键并点击第二个、第三个 `TableRow`、水平 `LinearLayout` 以及 `RecyclerView`，以便选中五个项目。在\
  \ `Attributes` 面板中找到 `layout_margin` 属性类别，一旦找到，就如图 66-14 所示将值更改为 `10dp`：\n\n![](img/as_3.4_layout_margin.jpg)\n\
  \n图 66-14\n\n设置边距后，用户界面应该如图 66-1 所示。\n\n## 66.9 总结\n\nAndroid `TableLayout` 容器视图提供了一种以行列配置排列视图组件的方法。虽然\
  \ `TableLayout` 视图提供了整体容器，每行及其包含的内容通过 `TableRow` 视图实例来实现。在本章中，使用 `TableLayout` 和\
  \ `TableRow` 容器设计了用户界面。下一章将为此用户界面添加功能，使用仓库和 Room 持久化库实现 SQLite 数据库功能。\n\n\n\n\n\n\
  # 67. Android Room 数据库与存储库教程\n\n本章将结合在 Android Room 持久化库章节中学的知识以及上一章创建的初始项目，为您提供一个详细的教程，演示如何使用\
  \ Room 持久化库实现基于 SQLite 的数据库存储。遵循 Android 架构指南，项目将使用视图模型（ViewModel）和存储库（Repository）。本教程将涵盖\
  \ Android Room 持久化库介绍的所有元素，包括实体（Entity）、数据访问对象（DAO）、Room 数据库以及异步数据库查询。\n\n## 67.1\
  \ 关于 RoomDemo 项目\n\n上一章中创建的用户界面布局是创建简易库存应用的第一步，该应用旨在存储产品的名称和数量。项目完成后，该应用将提供添加、删除和搜索数据库条目的功能，同时显示当前存储在数据库中的所有产品的可滚动列表。当数据库条目被添加或删除时，此产品列表将自动更新。\n\
  \n## 67.2 修改构建配置\n\n首先启动 Android Studio 并打开上一章开始的 RoomDemo 项目。在向项目添加任何新类之前，第一步是向构建配置添加一些额外的库，包括\
  \ Room 持久化库。现在也是在 `build.gradle` 文件中启用视图绑定（view binding）的好时。找到并编辑模块级 `build.gradle`\
  \ 文件（`app -> Gradle Scripts -> build.gradle (Module: RoomDemo.app)`）并进行如下修改：\n\n\
  ```gradle\nandroid {\n    buildFeatures {\n        viewBinding true\n    }\n}\n\n\
  dependencies {\n    implementation \"androidx.recyclerview:recyclerview:1.2.0\"\n\
  \    implementation \"androidx.room:room-runtime:2.3.0\"\n    implementation \"\
  androidx.fragment:fragment-ktx:1.3.3\"\n    annotationProcessor \"androidx.room:room-compiler:2.3.0\"\
  \n}\n```\n\n## 67.3 构建实体\n\n该项目将从创建定义数据库表结构的实体开始。该实体将包含一个产品 ID 的整数、一个存储产品名称的字符串列以及另一个存储数量的整数值。productid\
  \ 列将作为主键并自动生成。表 67-1 总结了实体的结构：\n\n| 列 | 数据类型 |\n| :--- | :--- |\n| productid | Integer\
  \ / Primary Key / 自动增长 |\n| productname | String |\n| productquantity | Integer\
  \ |\n\n表 67-1\n\n在 Project 工具窗口中右键点击 `app -> java -> com.ebookfrenzy.roomdemo`，选择\
  \ `New -> Java Class` 菜单选项为实体添加一个类文件。在新类对话框中，将类命名为 `Product`，选择列表中的 `Class` 并按回车键生成文件。\n\
  \n当 `Product.java` 文件在编辑器中打开时，将其修改为如下：\n\n```java\npackage com.ebookfrenzy.roomdemo;\n\
  \npublic class Product {\n    private int id;\n    private String name;\n    private\
  \ int quantity;\n\n    public Product(String name, int quantity) {\n        this.name\
  \ = name;\n        this.quantity = quantity;\n    }\n\n    public int getId() {\n\
  \        return this.id;\n    }\n\n    public String getName() {\n        return\
  \ this.name;\n    }\n\n    public int getQuantity() {\n        return this.quantity;\n\
  \    }\n\n    public void setId(int id) {\n        this.id = id;\n    }\n\n    public\
  \ void setName(String name) {\n        this.name = name;\n    }\n\n    public void\
  \ setQuantity(int quantity) {\n        this.quantity = quantity;\n    }\n}\n```\n\
  \n该类现在拥有对应数据库表的变量以及匹配的 getter 和 setter 方法。当然，在类被添加注解之前，它不会成为一个实体。在编辑器中保持类文件打开的情况下，添加注解和相应的导入语句：\n\
  \n```java\npackage com.ebookfrenzy.roomdemo;\n\nimport androidx.annotation.NonNull;\n\
  import androidx.room.ColumnInfo;\nimport androidx.room.Entity;\nimport androidx.room.PrimaryKey;\n\
  \n@Entity(tableName = \"products\")\npublic class Product {\n    @PrimaryKey(autoGenerate\
  \ = true)\n    @NonNull\n    @ColumnInfo(name = \"productId\")\n    private int\
  \ id;\n    @ColumnInfo(name = \"productName\")\n    private String name;\n    private\
  \ int quantity;\n}\n``` these 这些注解声明此类为名为 `products` 的表的实体，并为 `id` 和 `name` 分配了列名。`id`\
  \ 列也被配置为主键并自动生成。由于主键永远不能为空，因此应用了 `@NonNull` 注解。由于在 SQL 查询中不需要引用 `quantity` 列，因此没有为\
  \ `quantity` 变量分配列名。\n\n## 67.4 创建数据访问对象\n\n定义产品实体后，下一步是创建 DAO 接口。再次参考 Project 窗口，右键点击\
  \ `app -> java -> com.ebookfrenzy.roomdemo` 并选择 `New -> Java`。在新类对话框中，在 Name 字段中输入\
  \ `ProductDao`，并在列表中选择 `Interface`，如图 67-1 所示：\n\n图 67-1\n\n点击 OK 生成新接口，并在 `ProductDao.java`\
  \ 文件加载到编辑器后，进行以下更改：\n\n```java\npackage com.ebookfrenzy.roomdemo;\n\nimport androidx.lifecycle.LiveData;\n\
  import androidx.room.Dao;\nimport androidx.room.Insert;\nimport androidx.room.Query;\n\
  import java.util.List;\n\n@Dao\npublic interface ProductDao {\n    @Insert\n   \
  \ void insertProduct(Product product);\n\n    @Query(\"SELECT * FROM products WHERE\
  \ productName = :name\")\n    List<Product> findProduct(String name);\n\n    @Query(\"\
  DELETE FROM products WHERE productName = :name\")\n    void deleteProduct(String\
  \ name);\n\n    @Query(\"SELECT * FROM products\")\n    LiveData<List<Product>>\
  \ getAllProducts();\n}\n```\n\nDAO 实现了对 `products` 数据库的插入、查找和删除操作。插入方法接收产品实体，而查找和删除方法接收执行操作的产品名称字符串。`getAllProducts()`\
  \ 方法返回包含数据库所有记录的 `LiveData` 对象。此方法将用于保持界面中的 RecyclerView 列表与数据库同步。\n\n## 67.5 添加\
  \ Room 数据库\n\n在项目添加存储库之前的最后一个任务是实现 Room 数据库实例。向项目中添加名为 `ProductRoomDatabase` 的新类，这次选择\
  \ `Class` 选项。\n\n文件生成后，根据 Android 持久化库章节概述的步骤进行如下修改：\n\n```java\npackage com.ebookfrenzy.roomdemo;\n\
  \nimport android.content.Context;\nimport androidx.room.Database;\nimport androidx.room.Room;\n\
  import androidx.room.RoomDatabase;\n\n@Database(entities = {Product.class}, version\
  \ = 1)\npublic abstract class ProductRoomDatabase extends RoomDatabase {\n    public\
  \ abstract ProductDao productDao();\n    private static ProductRoomDatabase INSTANCE;\n\
  \n    static ProductRoomDatabase getDatabase(final Context context) {\n        if\
  \ (INSTANCE == null) {\n            synchronized (ProductRoomDatabase.class) {\n\
  \                if (INSTANCE == null) {\n                    INSTANCE = Room.databaseBuilder(\n\
  \                            context.getApplicationContext(),\n                \
  \            ProductRoomDatabase.class,\n                            \"product_database\"\
  ).build();\n                }\n            }\n        }\n        return INSTANCE;\n\
  \    }\n}\n```\n\n## 67.6 添加存储库\n\n\n\n\n\n# ProductRepository 类\n\n向项目中添加一个名为 `ProductRepository`\
  \ 的新类，并选择 Class 选项。\n\n该仓库类负责代表 `ViewModel` 与 `Room` 数据库进行交互，并需要提供使用 `DAO` 插入、删除和查询产品记录的方法。除了\
  \ `getAllProducts()` DAO 方法（它返回一个 `LiveData` 对象）外，这些数据库操作都需要在主线程之外的线程中执行。\n\n留在\
  \ `ProductRepository.java` 文件中，添加一个处理程序的代码，将搜索结果返回给仓库线程：\n\n```java\npackage com.ebookfrenzy.roomdemo;\n\
  \nimport android.os.Handler;\nimport android.os.Looper;\nimport android.os.Message;\n\
  import java.util.concurrent.ExecutorService;\nimport java.util.concurrent.Executors;\n\
  import androidx.lifecycle.MutableLiveData;\nimport java.util.List;\n\npublic class\
  \ ProductRepository {\n    private final MutableLiveData<List<Product>> searchResults\
  \ = new MutableLiveData<>();\n    private List<Product> results;\n\n    Handler\
  \ handler = new Handler(Looper.getMainLooper()) {\n        @Override\n        public\
  \ void handleMessage(Message msg) {\n            searchResults.setValue(results);\n\
  \        }\n    };\n}\n```\n\n上述代码声明了一个名为 `searchResults` 的 `MutableLiveData` 变量，当异步搜索任务完成时，搜索结果就会存储其中（在稍后的教程中，`ViewModel`\
  \ 的一个观察者将监控此实时数据对象）。\n\n仓库类现在需要提供一些可以由 `ViewModel` 调用以启动这些操作的方法。然而，为了实现这一点，仓库需要通过\
  \ `ProductRoomDatabase` 实例获取 `DAO` 引用。为 `ProductRepository` 类添加构造方法来执行这些任务：\n\n\
  ```java\nimport android.app.Application;\n\npublic class ProductRepository {\n \
  \   private final MutableLiveData<List<Product>> searchResults = new MutableLiveData<>();\n\
  \    private List<Product> results;\n    private final ProductDao productDao;\n\n\
  \    public ProductRepository(Application application) {\n        ProductRoomDatabase\
  \ db;\n        db = ProductRoomDatabase.getDatabase(application);\n        productDao\
  \ = db.productDao();\n    }\n}\n```\n\n在存储了 `DAO` 引用后，可以按如下所示将方法添加到 `ProductRepository`\
  \ 类文件中：\n\n```java\npublic void insertProduct(Product newproduct) {\n    ExecutorService\
  \ executor = Executors.newSingleThreadExecutor();\n    executor.submit(() -> {\n\
  \        productDao.insertProduct(newproduct);\n    });\n    executor.shutdown();\n\
  }\n\npublic void deleteProduct(String name) {\n    ExecutorService executor = Executors.newSingleThreadExecutor();\n\
  \    executor.submit(() -> {\n        productDao.deleteProduct(name);\n    });\n\
  \    executor.shutdown();\n}\n\npublic void findProduct(String name) {\n    ExecutorService\
  \ executor = Executors.newSingleThreadExecutor();\n    executor.submit(() -> {\n\
  \        results = productDao.findProduct(name);\n        handler.sendEmptyMessage(0);\n\
  \    });\n    executor.shutdown();\n}\n```\n\n在插入和删除方法中，创建并使用了适当的新线程来执行相应的数据库操作。在\
  \ `findProduct()` 方法中，向 `handler` 发送了一条消息，指示新结果可用。\n\n完成仓库类还剩最后一个任务。用户界面布局中的 `RecyclerView`\
  \ 需要能够能够更新数据库中存储的当前产品列表。`ProductDao` 类已经包含一个名为 `getAllProducts()` 的方法，它使用 SQL 查询选择所有数据库记录，并将它们封装在\
  \ `LiveData` 对象中返回。仓库需要在初始化时调用一次此方法，并将结果存储在一个 `LiveData` 对象中，该对象可以被 `ViewModel`\
  \ 观察，进而被 UI 控制器观察。一旦设置完成，每当数据库表发生变化时，UI 控制器观察者就会收到通知，`RecyclerView` 就可以更新最新的产品列表。留在\
  \ `ProductRepository.java` 文件中，在构造函数添加 `LiveData` 变量并调用 `getAllProducts()`：\n\n\
  ```java\nimport androidx.lifecycle.LiveData;\n\npublic class ProductRepository {\n\
  \    private final MutableLiveData<List<Product>> searchResults = new MutableLiveData<>();\n\
  \    private List<Product> results;\n    private final ProductDao productDao;\n\n\
  \    public ProductRepository(Application application) {\n        ProductRoomDatabase\
  \ db;\n        db = ProductRoomDatabase.getDatabase(application);\n        productDao\
  \ = db.productDao();\n        // 此处处理 allProducts 初始化逻辑\n    }\n}\n```\n\n为了完成仓库，添加\
  \ `ViewModel` 可以调用以获取 `allProducts` 和 `searchResults` 对象引用的方法：\n\n```java\npublic\
  \ LiveData<List<Product>> getAllProducts() {\n    return allProducts;\n}\n\npublic\
  \ MutableLiveData<List<Product>> getSearchResults() {\n    return searchResults;\n\
  }\n```\n\n# 67.7 修改 ViewModel\n\n`ViewModel` 负责创建仓库的实例，并提供 UI 控制器可以利用以保持用户界面与数据库同步的方法和\
  \ `LiveData` 对象。正如在 `ProductRepository.java` 中实现的那样，仓库构造函数需要访问应用上下文以便能够获取 Room 实例。为了让\
  \ `ViewModel` 内部可以访问应用上下文，`ViewModel` 需要继承 `AndroidViewModel` 而不是 `ViewModel`。因此，请从编辑\
  \ `MainViewModel.java` 文件开始（位于 Project 工具窗口的 `app -> java -> com.ebookfrenzy ->\
  \ roomdemo -> ui` 下），将类更改为扩展 `AndroidViewModel` 并实现构造构造：\n\n```java\npackage com.ebookfrenzy.roomdemo.ui.main;\n\
  \nimport android.app.Application;\nimport androidx.lifecycle.AndroidViewModel;\n\
  import androidx.lifecycle.LiveData;\nimport androidx.lifecycle.MutableLiveData;\n\
  import com.ebookfrenzy.roomdemo.Product;\nimport com.ebookfrenzy.roomdemo.ProductRepository;\n\
  import java.util.List;\n\npublic class MainViewModel extends AndroidViewModel {\n\
  \    private ProductRepository repository;\n    private LiveData<List<Product>>\
  \ allProducts;\n    private MutableLiveData<List<Product>> searchResults;\n\n  \
  \  public MainViewModel (Application application) {\n        super(application);\n\
  \        repository = new ProductRepository(application);\n        allProducts =\
  \ repository.getAllProducts();\n        searchResults = repository.getSearchResults();\n\
  \    }\n}\n```\n\n构造函数本质上创建了一个仓库实例，然后使用它获取结果和实时数据的引用，以便 UI 控制器进行观察。现在 `ViewModel`\
  \ 中剩下的只是实现在 UI 控制器内部响应按钮点击以及设置 `LiveData` 对象观察者时调用的方法：\n\n```java\nMutableLiveData<List<Product>>\
  \ getSearchResults() {\n    return searchResults;\n}\n\nLiveData<List<Product>>\
  \ getAllProducts() {\n    return allProducts;\n}\n\npublic void insertProduct(Product\
  \ product) {\n    repository.insertProduct(product);\n}\n\npublic void findProduct(String\
  \ name) {\n    repository.findProduct(name);\n}\n\npublic void deleteProduct(String\
  \ name) {\n    repository.deleteProduct(name);\n}\n```\n\n## 67.8 创建产品项布局\n\n\n\n\
  \n\n数据库中每个产品的名称将出现在主用户界面的 `RecyclerView` 列表中。这需要一个包含 `TextView` 的布局资源文件，用于列表中的每一行。现在通过\
  \ Project 工具窗口中右键点击 `app` -> `res` -> `layout` 项，并选择 `New` -> `Layout resource file`\
  \ 菜单选项来添加此文件。将文件命名为 `product_list_item`，并在点击 `OK` 创建文件并将其加载到布局编辑器之前，将根元素更改为 `LinearLayout`。在布局编辑器处于\
  \ Design（设计）模式下，从调色板中拖入一个 `TextView` 对象到布局中，它将默认将显示在布局的顶部：\n\n![](img/as_3.5_roomdemo_item_layout.jpg)\n\
  \n图 67-2\n\n在布局中选中 `TextView`，使用 Attributes（属性）窗口将视图的 ID 设置为 `product_row`，并将 `layout_height`\
  \ 设置为 `30dp`。在 Component Tree（组件树）窗口中选择 `LinearLayout` 项，并将 `layout_height` 属性设置为\
  \ `wrap_content`。\n\n## 67.9 添加 RecyclerView 适配器\n\n正如“与 RecyclerView 和 CardView\
  \ 组件一起工作”章节中详细概述的那样，`RecyclerView` 实例需要一个适配器类来提供显示的数据。现在通过 Project 工具窗口中右键点击 `app`\
  \ -> `java` -> `com.ebookfrenzy.roomdemo` -> `ui.main` 项，并选择 `New` -> `Java Class...`\
  \ 菜单添加此类。在对话框中，将类命名为 `ProductListAdapter` 并在列表中选择 `Class`，然后按下键盘上的 Return 键。将生成的\
  \ `ProductListAdapter.java` 类加载到编辑器中，按如下方式实现该类：\n\n```java\npackage com.ebookfrenzy.roomdemo.ui.main;\n\
  \nimport android.view.LayoutInflater;\nimport android.view.View;\nimport android.view.ViewGroup;\n\
  import android.widget.TextView;\nimport com.ebookfrenzy.roomdemo.R;\nimport androidx.annotation.NonNull;\n\
  import androidx.recyclerview.widget.RecyclerView;\nimport com.ebookfrenzy.roomdemo.Product;\n\
  import java.util.List;\n\npublic class ProductListAdapter\n        extends RecyclerView.Adapter<ProductListAdapter.ViewHolder>\
  \ {\n\n    private final int productItemLayout;\n    private List<Product> productList;\n\
  \n    public ProductListAdapter(int layoutId) {\n        productItemLayout = layoutId;\n\
  \    }\n\n    public void setProductList(List<Product> products) {\n        productList\
  \ = products;\n        notifyDataSetChanged();\n    }\n\n    @Override\n    public\
  \ int getItemCount() {\n        return productList == null ? 0 : productList.size();\n\
  \    }\n\n    @NonNull\n    @Override\n    public ViewHolder onCreateViewHolder(ViewGroup\
  \ parent, int viewType) {\n        View view = LayoutInflater.from(\n          \
  \      parent.getContext()).inflate(productItemLayout, parent, false);\n       \
  \ return new ViewHolder(view);\n    }\n\n    @Override\n    public void onBindViewHolder(final\
  \ ViewHolder holder, final int listPosition) {\n        TextView item = holder.item;\n\
  \        item.setText(productList.get(listPosition).getName());\n    }\n\n    static\
  \ class ViewHolder extends RecyclerView.ViewHolder {\n        TextView item;\n \
  \       ViewHolder(View itemView) {\n            super(itemView);\n            item\
  \ = itemView.findViewById(R.id.product_row);\n        }\n    }\n}\n```\n\n## 67.10\
  \ 准备主 Fragment\n\n最后一个需要修改的组件是 `MainFragment` 类，它需要对 `Button` 视图配置监听器，并对 `ViewModel`\
  \ 类中的 live data 对象配置观察者。在添加此代码之前，需要进行一些准备工作，添加一些导入项、变量并获取视图 ID 的引用。我们还需要修改 fragment\
  \ 以使用视图绑定（view binding）。编辑 `MainFragment.java` 文件并进行如下修改：\n\n```java\nimport com.ebookfrenzy.roomdemo.databinding.MainFragmentBinding;\n\
  \npublic class MainFragment extends Fragment {\n    private MainViewModel mViewModel;\n\
  \    private MainFragmentBinding binding;\n    private ProductListAdapter adapter;\n\
  \n    @Nullable\n    @Override\n    public View onCreateView(@NonNull LayoutInflater\
  \ inflater, @Nullable ViewGroup container, @Nullable Bundle savedInstanceState)\
  \ {\n        return inflater.inflate(R.layout.main_fragment, container, false);\n\
  \        binding = MainFragmentBinding.inflate(inflater, container, false);\n  \
  \      return binding.getRoot();\n    }\n\n    @Override\n    public void onDestroyView()\
  \ {\n        super.onDestroyView();\n        binding = null;\n    }\n\n    @Override\n\
  \    public void onActivityCreated(@Nullable savedInstanceState) {\n        super.onActivityCreated(savedInstanceState);\n\
  \        mViewModel = new ViewModelProvider(this).get(MainViewModel.class);\n  \
  \      listenerSetup();\n        observerSetup();\n        recyclerSetup();\n  \
  \  }\n```\n\n在代码的各个阶段，应用程序需要清除用户界面中显示的商品信息。为了避免代码重复，添加以下便利函数 `clearFields()`：\n\n\
  ```java\nprivate void clearFields() {\n    binding.productID.setText(\"\");\n  \
  \  binding.productName.setText(\"\");\n    binding.productQuantity.setText(\"\"\
  );\n}\n```\n\n在应用程序可以进行构建和测试之前，需要将从 `onActivityCreated()` 方法中调用的三个设置方法添加到类中。\n\n\
  ## 67.11 添加按钮监听器\n\n主 fragment 的用户界面布局包含三个按钮，每个按钮在被用户点击时都需要执行特定任务。编辑 `MainFragment.java`\
  \ 文件并添加 `listenerSetup()` 方法：\n\n```java\nimport com.ebookfrenzy.roomdemo.Product;\n\
  \nprivate void listenerSetup() {\n    binding.addButton.setOnClickListener(new View.OnClickListener()\
  \ {\n        @Override\n        public void onClick(View view) {\n            String\
  \ name = binding.productName.getText().toString();\n            String quantity\
  \ = binding.productQuantity.getText().toString();\n            if (!name.equals(\"\
  \") && !quantity.equals(\"\")) {\n                Product product = new Product(name,\
  \ Integer.parseInt(quantity));\n                mViewModel.insertProduct(product);\n\
  \                clearFields();\n            } else {\n                binding.productID.setText(\"\
  Incomplete information\");\n            }\n        }\n    });\n\n    binding.findButton.setOnClickListener(new\
  \ View.OnClickListener() {\n        @Override\n        public void onClick(View\
  \ view) {\n            mViewModel.findProduct(binding.productName.getText().toString());\n\
  \        }\n    });\n\n    binding.deleteButton.setOnClickListener(new View.OnClickListener()\
  \ {\n        @Override\n        public void onClick(View view) {\n            mViewModel.deleteProduct(binding.productName.getText().toString());\n\
  \            clearFields();\n        }\n    });\n}\n```\n\n`addButton` 监听器执行了一些基础验证，确保用户输入了产品名称和数量，并使用这些数据创建一个新的\
  \ `Product` 实体对象（注意数量字符串转换为整数以匹配实体数据类型）。然后调用 `ViewModel.insertProduct()` 方法并传递 `Product`\
  \ 对象，最后清空字段。\n\n`findButton` 和 `deleteButton` 监听器将产品名称传递给 `ViewModel.findProduct()`\
  \ 或 `deleteProduct()` 方法。\n\n## 67.12 添加 LiveData 观察者\n\n用户界面现在需要添加观察者，以与 `ViewModel`\
  \ 中的 `searchResults` 和 `allProducts` live data 对象保持同步。在 `Mainfragment.java` 文件中，按如下方式实现\
  \ `observerSetup` 方法：\n\n```java\nimport androidx.lifecycle.Observer;\nimport java.util.List;\n\
  import java.util.Locale;\n\nprivate void observerSetup() {\n    mViewModel.getAllProducts().observe(getViewLifecycleOwner(),\
  \ new Observer<List<Product>>() {\n```\n\n\n\n\n\n```java\n@Override\npublic void\
  \ onChanged(@Nullable final List<Product> products) {\n    adapter.setProductList(products);\n\
  }\n});\n\nmViewModel.getSearchResults().observe(getViewLifecycleOwner(),\n    new\
  \ Observer<List<Product>>() {\n        @Override\n        public void onChanged(@Nullable\
  \ final List<Product> products) {\n            if (products.size() > 0) {\n    \
  \            binding.productID.setText(String.format(Locale.US, \"%d\",\n      \
  \                  products.get(0).getId()));\n                binding.productName.setText(products.get(0).getName());\n\
  \                binding.productQuantity.setText(String.format(Locale.US, \"%d\"\
  ,\n                        products.get(0).getQuantity()));\n            } else\
  \ {\n                binding.productID.setText(\"No Match\");\n            }\n \
  \       }\n    });\n}\n```\n\n“所有产品”观察者只需是将当前产品列表传递给 `RecyclerAdapter` 的 `setProductList()`\
  \ 方法，在该处将更新显示列表。\n\n“搜索结果”观察者会检查数据库中是否至少找到一个匹配的结果，从列表中提取第一个匹配的 Product 实体对象，从对象中获取数据，在需要时进行转换并将其分配给布局中的\
  \ `TextView` 和 `EditText` 视图。如果产品搜索失败，将通过显示在产品 ID `TextView` 上的消息来通知用户。\n\n## 67.13\
  \ 初始化 RecyclerView\n\n添加最终设置方法以初始化并配置 `RecyclerView` 和 `adapter`，如下：\n\n```java\n\
  import androidx.recyclerview.widget.LinearLayoutManager;\nimport androidx.recyclerview.widget.RecyclerView;\n\
  \nprivate void recyclerSetup() {\n    adapter = new ProductListAdapter(R.layout.product_list_item);\n\
  \    binding.productRecycler.setLayoutManager(\n        new LinearLayoutManager(getContext()));\n\
  \    binding.productRecycler.setAdapter(adapter);\n}\n```\n\n## 67.14 测试 RecyclerView\n\
  \n在设备或模拟器上编译并运行应用，添加一些产品并验证它们是否出现。\n\n## 67.15 使用数据库\n\n如之前在 Android 持久化库 中概述的，可以使用数据库来检查..###\
  \ 67.16 总结\n\n本章演示了使用 Room 存储数据，包括实体的创建、`DAO`、`ViewModel` 以及异步任务。\n\n# 68 访问云存储\n\
  \n近年来，远程存储服务（也称为“云存储”）得到了广泛采用。驱动这一增长的是两个关键因素。之一是大多数移动设备现在提供持续、高速的互联网连接，使得数据传输非常快。第二个因素是，相对于计算机系统（如台式机和笔记本电脑），这些移动设备在内部存储方面受到限制。例如，今天一台高规格的平板电脑配备\
  \ 128GB 的存储容量。与带有 750GB 硬盘的中端笔记本电脑相比，对无缝存储的需求是一个关键需求。\n\n为了承认这一事实，Google 在 Android\
  \ 4.4 SDK 中引入了存储访问框架（Storage Access Framework）。本章将提供存储访问框架的高级概述，为下一章中包含的注重细节的教程做准备，该章节标题为\
  \ Android 存储访问框架。\n\n## 68.1 存储访问框架\n\n从用户的角度来看，存储访问框架提供了一个直观的用户界面，允许用户在 Android\
  \ 应用程序内部浏览、选择、删除和创建由存储服务（也称为文档提供者）托管的文件。通过此浏览界面（也称为选择器），用户可以浏览其所选文档提供者托管的文件（如文档、音频、图像和视频）。例如，图\
  \ 68-1 显示了选择器界面，显示了由文档提供者服务托管的文件集：\n\n```\nimage/as3.0_storage_demo_picker.jpg\n\
  ```\n\n图 68-1\n\n除了基于云的文档提供者外，选择器还提供了对设备内部存储的访问，为应用程序用户提供了一系列文件存储选项。在编写时，兼容存储访问框架的最著名的文档提供者是\
  \ Box 和（意料之中的）Google Drive。其他云存储提供商和应用程序开发者可能很快也会提供符合存储访问框架的服务。\n\n## 68.2 使用存储访问框架\n\
  \n\n\n\n\nAndroid 包含了一组 `Intents`，旨在将存储访问框架（Storage Access Framework）的功能集成到 Android\
  \ 应用程序中。这些 intent 向用户显示存储访问框架的选择器用户界面，并通过调用启动该 intent 的 activity 的 `onActivityResult()`\
  \ 方法将交互结果返回给应用程序。当 `onActivityResult()` 方法被调用时，它将接收到所选文件的 `Uri` 以及一个指示操作成功与否的值。\n\
  \n存储访问框架的 intent 可以总结如下：\n\n• `ACTION_OPEN_DOCUMENT` – 为用户提供访问选择器用户界面的权限，以便从设备上配置的文档提供者中选择文件。选定的文件以\
  \ `Uri` 对象的格式传回应用程序。\n\n• `ACTION_CREATE_DOCUMENT` – 允许用户选择文档提供者、该提供者存储空间上的位置以及新文件的文件名。一旦完成选择，存储访问框架将创建该文件，并将该文件的\
  \ ` `Uri` 返回给应用程序以进行后续处理。\n\n## 68.3 过滤选择器文件列表\n\n当启动 intent 时，选择器用户界面中列出的文件可以使用多种选项进行过滤。例如，考虑以下代码来配置\
  \ `ACTION_OPEN_DOCUMENT` intent：\n\n```java\nIntent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);\n\
  ```\n\n当启动时，上述 intent 将导致显示选择器用户界面，允许用户浏览并选择由可用文档提供者托管的任何文件。一旦用户选择了文件，应用程序将以 `Uri`\
  \ 对象的形式获得该文件的引用。随后，应用程序可以使用 `openFileDescriptor(Uri, String)` 方法打开该文件。然而，存在某种风险，即并非所有文档提供者列出的文件都能通过这种方式打开。可以通过使用\
  \ `CATEGORY_OPENABLE` 选项修改 intent 从而在选择器中排除此类文件。例如：\n\n```java\nIntent intent =\
  \ new Intent(Intent.ACTION_OPEN_DOCUMENT);\nintent.addCategory(Intent.CATEGORY_OPENABLE);\n\
  ```\n\n现在当显示 intent 时，无法使用 `openFileDescriptor()` 方法打开的文件将被列出，但用户无法选择它们。\n\n另一种实用的过滤方法允许根据文件类型来限制可供选择的文件。这涉及到指定应用程序能够处理的文件类型。例如，一个图像编辑应用程序可能只想为用户提供从文档提供者中选择图像文件的选项。这是通过配置\
  \ intent 对象，指定用户可以选择的文件 MIME 类型来实现的。例如，以下代码指定了只有图像文件适用于在选择器中选择：\n\n```java\nintent.addCategory(Intent.CATEGORY_OPENABLE);\n\
  intent.setType(\"image/*\");\n```\n\n可以进一步细化以限制选择为 JPEG 图像：\n\n```java\nintent.setType(\"\
  image/jpeg\");\n```\n\n或者，音频播放器应用可能只能处理音频文件：\n\n```java\nintent.setType(\"audio/*\"\
  );\n```\n\n音频应用可能被进一步限制为仅支持播放基于 MP4 的音频文件：\n\n```java\nintent.setType(\"audio/mp4\"\
  );\n```\n\n在处理存储访问框架时，有广泛的 MIME 类型设置可以使用，其中更常见的可以在网上查找到：\n\nhttps://en.wikipedia.org/wiki/Internet_media_type#List_of_common_media_types\n\
  \n## 68.4 处理 intent 结果\n\n由于我们正在启动会返回结果的 intent，需要使用 `registerForActivityResult()`\
  \ 方法（在章节 “Android Explicit Intents – A Worked Example” 中介绍过）来创建一个启动器并声明一个 lambda\
  \ 来处理返回的数据，例如：\n\n```java\nActivityResultLauncher<Intent> startOpenForResult = registerForActivityResult(\n\
  \    new ActivityResultContracts.StartActivityForResult(),\n    new ActivityResultCallback<ActivityResult>()\
  \ {\n        @Override\n        public void onActivityResult(ActivityResult result)\
  \ {\n            if (result.getResultCode() == Activity.RESULT_OK) {\n         \
  \       Intent data = result.getData();\n                // 在此处从 Uri 读取文件内容\n  \
  \          }\n        }\n    });\n```\n\n一旦声明，可以按照以下方式配置并启动 intent：\n\n```java\n\
  Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);\nintent.addCategory(Intent.CATEGORY_OPENABLE);\n\
  intent.setType(\"text/plain\");\nstartOpenForResult.launch(intent);\n```\n\n## 68.5\
  \ 读取文件内容\n\n读取文档提供者托管的文件内容的确切步骤很大程度上取决于文件的类型。读取文本文件的内容需要更多工作并使用 `InputStream` 对象。例如，以下代码从文件中读取行：\n\
  \n```java\nInputStream inputStream = getContentResolver().openInputStream(uri);\n\
  BufferedReader reader = new BufferedReader(new InputStreamReader(inputStream));\n\
  String readline;\nwhile ((readline = reader.readLine()) != null) {\n    // 对文件中的每一行进行操作\n\
  }\ninputStream.close();\n```\n\n通过从 `Uri` 提取文件描述符然后对其解码，可以将图像文件赋予 `Bitmap`。例如：\n\
  \n```java\nParcelFileDescriptor pFileDescriptor = getContentResolver().openFileDescriptor(uri,\
  \ \"r\");\nBitmap image = BitmapFactory.decodeFileDescriptor(pFileDescriptor.getDescriptor());\n\
  ```\n\n注意文件描述符是以 `r` 模式打开的。这表示该文件将被读取。其他选项有 `w`（写）和 `rwt`（读写，后者会截断现有内容）。\n\n## 68.6\
  \ 向文件写入内容\n\n向文档提供者托管的打开文件写入与读取类似，区别在于使用的是输出流而不是输入流。例如，以下代码将文本写入文件的输出流：\n\n```java\n\
  try {\n    ParcelFileDescriptor pFileDescriptor = getContentResolver().openFileDescriptor(uri,\
  \ \"w\");\n    FileOutputStream fileOutputStream = new FileOutputStream(pFileDescriptor.getDescriptor());\n\
  \    String textContent = \"Some sample text\";\n    fileOutputStream.write(textContent.getBytes());\n\
  \    fileOutputStream.close();\n    pFileDescriptor.close();\n} catch (FileNotFoundException\
  \ e) {\n    e.printStackTrace();\n} catch (IOException e) {\n    e.printStackTrace();\n\
  }\n```\n\n## 68.7 删除文件\n\n是否可以从存储器中删除文件取决于文件的文档提供者是否支持删除文件。假设允许删除，可以通过指定的 `Uri`\
  \ 执行删除操作：\n\n```java\nif (DocumentsContract.deleteDocument(getContentResolver(),\
  \ uri)) {\n    // 删除成功\n} else {\n    // 删除失败\n}\n```\n\n## 68.8 获取文件的持久访问权限\n\n\
  \n\n\n当应用程序通过存储访问框架（Storage Access Framework）访问文件时，该访问将一直有效，直到运行该应用程序的 Android 设备重启。通过对\
  \ `Uri` “摄取”必要的权限，可以获得对特定文件的持久化访问。例如，以下代码为 `fileUri` `Uri` 实例所引用的文件持久化了读写权限：\n\n\
  ```java\nfinal int takeFlags = intent.getFlags()\n                & (Intent.FLAG_GRANT_READ_URI_PERMISSION\n\
  \                | Intent.FLAG_GRANT_WRITE_URI_PERMISSION);\ngetContentResolver().takePersistableUriPermission(fileUri,\
  \ takeFlags);\n```\n\n一旦应用获取了文件的权限，并且假设 `Uri` 已经被应用保存，那么用户应该能够在设备重启后继续访问该文件，而无需用户从文件选择器界面重新选择文件。\n\
  \n如果在任何时候不再需要这些持久化权限，可以通过调用内容解析器的 `releasePersistableUriPermission()` 方法来释放：\n\n\
  ```java\nfinal int releaseFlags = intent.getFlags()\n                & (Intent.FLAG_GRANT_READ_URI_PERMISSION\n\
  \                | Intent.FLAG_GRANT_WRITE_URI_PERMISSION);\ngetContentResolver().releasePersistableUriPermission(fileUri,\
  \ releaseFlags);\n```\n\n## 68. 总结\n\n思考这些年来对存储的感知是如何变化的是一件趣事。“存储”一词曾是高容量内置硬盘驱动器的同义词，现在它同样可能指代托管在云端并通过互联网连接访问的存储空间。随着资源受限、内部存储容量极小的“始终连接”移动设备被广泛采用，这种情况变得越来越普遍。\n\
  \nAndroid 存储访问框架为用户和应用程序开发者提供了一种简单的机制，用于无缝访问存储在云端的文件。通过使用一组 `intents` 以及用于选择文档提供程序和文件的内置用户界面，现在可以使用极少的代码将全面的云端存储集成到\
  \ Android 应用程序中。\n\n# 69. Android 存储访问框架示例\n\n如前所述的，存储访问框架极大地简化将云端存储访问集成到 Android\
  \ 应用程序中的过程。它由一个选择器界面和一组新的 `intents` 组成，现在可以相对轻松地将对 Google Drive 和 Box 等文档提供程序中存储文件的访问构建到\
  \ Android 应用程序中。在上一节介绍了 Android 存储访问框架的基础知识后，本章将演示创建一个示例应用程序，该程序使用存储访问框架来存储和管理文件。\n\
  \n## 69.1 关于存储访问框架示例\n\n在本章创建的 Android 应用程序将采用原始文本编辑器的形式，旨在将文本文件远程创建并存储到云端存储服务中。在实践中，示例将与任何兼容存储访问框架的云端文档存储提供程序配合，但为了本示例的目的，假设使用的是\
  \ Google Drive。\n\n在功能方面，该应用程序将向用户展示一个多行文本视图，用户可以在其中输入和编辑文本，并带有一允许创建、打开和保存基于存储的文本文件的按钮。\n\
  \n## 69.2 创建存储访问框架示例\n\n从欢迎屏幕上选择“New Project”（新建项目）选项，在弹出的新项目对话中，点击“Next”（下一步）按钮之前选择\
  \ `Empty Activity` 模板。\n\n在 `Name` 字段输入 `StorageDemo`，并指定 `com.ebookfrenzy.storagedemo`\
  \ 为包名。在点击“Finish”（完成）按钮之前，将 `Minimum API level` 设置为 `API 26`：Android 8.0 (Oreo)，并将\
  \ `Language` 菜单设置为 `Java`。按照 [11.8 Migrating a Project to View Binding] 节中的常规步骤为项目添加\
  \ view binding 支持。\n\n## 69.3 设计用户界面\n\n用户界面需要由三个 `Button` 视图和一个 `EditText` 视图组成。在\
  \ Project 工具窗口中，导航到 `app -> res -> layout` 下 `activity_main.xml` 布局文件，并双击它将其加载到\
  \ Layout Editor 工具中。在工具处于 Design 模式时，选择并删除 Hello World! `TextView` 对象。\n\n在布局的左上角拖动并放置\
  \ `Button` 小部件，以便在释放部件到位置之前，左侧和上方的虚线边距指南出现。放置第二个 `Button`，使中心和顶部的边距指南出现。然后放置第三个\
  \ `Button` 小部件，使顶部和右侧的边距指南出现。\n\n将三个按钮的文本属性分别更改为“New”、“Open”和“Save”。接下来，放置一个 `Plain\
  \ Text` 小部件，使其水平居中并位于中心 `Button` 之下，以便用户界面布局与[图 69-1]所示匹配。使用 Layout Editor 工具栏中的\
  \ `Infer Constraints` 按钮添加任何缺失的约束。\n\n在布局中选择 `Plain Text` 小部件，删除当前的文本属性设置使该字段初始为空，并将\
  \ ID 设置为 `fileText`，记住将所有字符串属性提取到资源值：\n\n(image/as_4.1_storage_demo_ui.jpg) 图 69-1\n\
  \n使用 Attributes 窗口，配置 `Button` 小部件上的 `onClick` 属性，分别调用方法 `newFile`、`openFile` 和\
  \ `saveFile`。\n\n## 69.4 添加 Activity 启动器\n\n按照“Android Intents – Worked Example”章节概述的步骤进行，我们需要开始注册\
  \ activity 启动器来处理文件内容的创建、打开和保存。在 `MainActivity.java` 文件中，为三个操作中的每一个添加一个启动器，如下所示：\n\
  \n```java\nimport androidx.activity.result.ActivityResult;\nimport androidx.activity.result.ActivityResultCallback;\n\
  import androidx.activity.result.ActivityResultLauncher;\nimport androidx.activity.result.contract.ActivityResultContracts;\n\
  import android.app.Activity;\nimport android.content.Intent;\nimport android.net.Uri;\n\
  import java.io.IOException;\n\nActivityResultLauncher<Intent> startForResult = registerForActivityResult(\n\
  \    new ActivityResultContracts.StartActivityForResult(),\n    new ActivityResultCallback<ActivityResult>()\
  \ {\n        @Override\n        public void onActivityResult(ActivityResult result)\
  \ {\n            if (result.getResultCode() == Activity.RESULT_OK) {\n         \
  \       Intent data = result.getData();\n                if (data != null) {\n \
  \                   Uri currentUri = data.getData();\n                    try {\n\
  \                        String content = readFileContent(currentUri);\n       \
  \                 binding.fileText.setText(content);\n                    } catch\
  \ (IOException e) {\n                        // 在此处处理错误\n                    }\n\
  \                }\n            }\n        }\n    });\n\nActivityResultLauncher<Intent>\
  \ startSaveForResult = registerForActivityResult(\n    new ActivityResultContracts.StartActivityForResult(),\n\
  \    new ActivityResultCallback<ActivityResult>() {\n        // ... implementation\n\
  \    });\n```\n\n\n\n\n\n```java\nUri currentUri = data.getData();\ntry {\n    writeFileContent(currentUri);\n\
  } catch (IOException e) {\n    // Handle error here\n}\n\nActivityResultLauncher<Intent>\
  \ startCreateForResult =\n    registerForActivityResult(\n        new ActivityResultContracts.StartActivityForResult(),\n\
  \        new ActivityResultCallback<ActivityResult>() {\n            @Override\n\
  \            public void onActivityResult(ActivityResult result) {\n           \
  \     if (result.getResultCode() == Activity.RESULT_OK) {\n                    Intent\
  \ data = result.getData();\n                    if (data != null) {\n          \
  \              binding.fileText.setText(\"\");\n                    }\n        \
  \        }\n            }\n        });\n```\n\n## 69.5 创建新的存储文件\n\n当选择“新建”（New）按钮时，应用程序需要触发一个配置为创建纯文本\
  \ MIME 类型文件的 `ACTION_CREATE_DOCUMENT` 意图（intent）。在设计用户界面时，新建按钮被配置为调用名为 `newFile()`\
  \ 的方法。相应的意图需要在方法内部启动。\n\n继续留在 `MainActivity.java` 文件，按照如下方式实现该方法：\n\n```java\npackage\
  \ com.ebookfrenzy.storagedemo;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n.\n    public void newFile(View view) {\n        Intent intent = new Intent(Intent.ACTION_CREATE_DOCUMENT);\n\
  \        intent.addCategory(Intent.CATEGORY_OPENABLE);\n        intent.setType(\"\
  text/plain\");\n        intent.putExtra(Intent.EXTRA_TITLE, \"newfile.txt\");\n\
  \        startCreateForResult.launch(intent);\n    }\n.\n}\n```\n\n此代码创建了一个新的 `ACTION_CREATE_DOCUMENT`\
  \ `Intent` 对象。随后对该意图进行配置，使得仅返回可以通过文件描述符打开的文件（通过 `Intent.CATEGORY_OPENABLE`）。接下来，代码指定了要打开的文件为纯文本类型，并提供了一个占位符文件名（用户可以在选择器界面中更改该文件名）。当执行此方法且意图完成后，将调用\
  \ `startCreateForResult()` 并传递新创建文档的 `Uri`。\n\n编译并运行应用程序，然后选择“新建”按钮。存储访问框架（Storage\
  \ Access Framework）随后将如图 69-2 所示显示下载界面。\n\n点击上方菜单按钮，选择“云端硬盘”（Drive），然后选择“我的云端硬盘”（My\
  \ Drive），导航到 Google 存储上的合适位置以保存文件。在选择器界面底部的文本字段中，选择“保存”选项之前，将名称从“newfile.txt”更改为合适的名称（但保留\
  \ `.txt` 扩展名）。如图 69-3。\n\n一旦创建新文件，应用程序应返回主活动，通知面板中可能会出现显示“文件已上传”的通知。如图 69-4。\n\n\
  此时，应该可以在浏览器窗口中登录你的 Google 云端硬盘账号，并在请求的位置找到新文件。如果文件丢失，请确保运行应用程序的 Android 设备具有活跃的连接。还可以运行\
  \ Google Drive 应用来验证设备对 Google Drive 的访问权限，该应用在许多 Android 设备上默认安装，并可以在 Google 商店下载。\n\
  \n## 69.6 保存到存储文件\n\n现在应用程序已经能够创建新的存储文件，下一步是添加将用户输入的任何文本保存到文件的功能。用户界面被配置为当用户选择“保存”（Save）按钮时调用\
  \ `saveFile()`。此方法将负责启动一个类型为 `ACTION_OPEN_DOCUMENT` 的新意图，这将导致选择器界面出现，以便用户可以选择要存储文本的文件。由于我们只处理纯文本文件，因此意图需要配置为将用户的选择选项限制为匹配\
  \ `text/plain` MIME 类型的现有文件。在确定了 `saveFile()` 方法要执行的操作后，现在可以如下所示将其添加到 `MainActivity.java`\
  \ 类中：\n\n```java\npublic void saveFile(View view) {\n    Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);\n\
  \    intent.addCategory(Intent.CATEGORY_OPENABLE);\n    intent.setType(\"text/plain\"\
  );\n    startSaveForResult.launch(intent);\n}\n```\n\n分配给 `startSaveForResult()`\
  \ 的 lambda 表达式调用了名为 `writeFileContent()` 的方法，传递了要写入文本的文件 `Uri`。继续留在 `MainActivity.java`\
  \ 文件，现在实现该方法，其读取内容如下：\n\n```java\npackage com.ebookfrenzy.storagedemo;\n\nimport\
  \ java.io.FileOutputStream;\nimport android.os.ParcelFileDescriptor;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n.\n    private void writeFileContent(Uri\
  \ uri) throws IOException {\n        try {\n            ParcelFileDescriptor pfd\
  \ = this.getContentResolver().openFileDescriptor(uri, \"w\");\n            FileOutputStream\
  \ fileOutputStream = new FileOutputStream(pfd.getFileDescriptor());\n          \
  \  String textContent = binding.fileText.getText().toString();\n            fileOutputStream.write(textContent.getBytes());\n\
  \            fileOutputStream.close();\n            pfd.close();\n        } catch\
  \ (IOException e) {\n            e.printStackTrace();\n        }\n    }\n.\n}\n\
  ```\n\n## 69.7 打开和读取存储文件\n\n编写完创建和保存文本文件的代码后，最后的任务是添加一些从存储中打开和读取文件的功能。这将涉及编写 `openFile()`\
  \ 点击事件处理方法并实现它，使其启动一个 `ACTION_OPEN_DOCUMENT` 意图：\n\n```java\npublic void openFile(View\
  \ view) {\n     Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);\n    intent.addCategory(Intent.CATEGORY_OPENABLE);\n\
  \    intent.setType(\"text/plain\");\n    startOpenForResult.launch(intent);\n}\n\
  ```\n\n下一个任务是实现由 `startOpenForResult()` lambda 表达式调用的 `readFileContent()` 方法：\n\n\
  \n\n\n\n```java\npackage com.ebookfrenzy.storagedemo;\n\nimport java.io.BufferedReader;\n\
  import java.io.InputStream;\nimport java.io.InputStreamReader;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n\n    private String readFileContent(Uri uri) throws\
  \ IOException {\n        InputStream inputStream =\n            getContentResolver().openInputStream(uri);\n\
  \        BufferedReader reader =\n            new BufferedReader(new InputStreamReader(\n\
  \                inputStream));\n        StringBuilder stringBuilder = new StringBuilder();\n\
  \        String currentline;\n        while ((currentline = reader.readLine()) !=\
  \ null) {\n            stringBuilder.append(currentline).append(\"\\n\");\n    \
  \    }\n        inputStream.close();\n        return stringBuilder.toString();\n\
  \    }\n}\n```\n\n该方法首先提取所选文本文件的文件描述符并打开以读取。随后打开与 `Uri` 关联的输入流，并将其作为 `BufferedReader`\
  \ 实例的输入源。文件中的每一行都会被读取并存储在 `StringBuilder` 对象中。一旦读取完所有行，输入流和文件描述符都将被关闭，文件内容将作为 `String`\
  \ 对象返回。\n\n## 69.8 测试存储访问应用程序\n\n编码阶段完成后，应用程序现在已准备好进行全面测试。首先，在配置了 Google 账户身份的 Android\
  \ 设备或 AVD 上启动应用程序，并点击“New”（新建）按钮。在随之出现的存储存储选择器界面中，选择一个 Google Drive 位置，并将文本文件命名为\
  \ `storagedemo.txt`，然后选择文件名字段右侧的 Save（保存）选项。\n\n当控制权返回您的应用程序时，寻找文件上传通知，然后在选择“Save”（保存）按钮之前在文本区域输入一些文本。从选择器中选择之前创建的\
  \ `storagedemo.txt` 文件以将内容保存到文件中。返回应用程序后，删除文本并选择“Open”（打开）按钮，再次选择 `storagedemo.txt`\
  \ 文件。当控制权返回应用程序时，文本视图应该已经填充了文本文件的内容。\n\n需要注意的是，如果 Android 设备缺乏活跃的互联网连接，存储访问框架（Storage\
  \ Access Framework）会将存储文件缓存在本地。然而，一旦重新建立连接，任何缓存数据将与远程存储服务同步。因此，作为应用程序的最后一个测试，请在浏览器窗口中登录您的\
  \ Google Drive 账号，导航到 `storagedemo.txt` 文件并点击它以查看内容，如果一切顺利，该内容应包含应用程序保存的文本。\n\n\
  ## 69.9 总结\n\n本章详细介绍了创建一个示例 Android Studio 应用程序，该程序是一个非常原始的文本编辑器，旨在使用基于云的存储通过 Android\
  \ 存储访问框架创建、保存和打开文件。\n\n# 70 使用 VideoView 和 MediaController 类在 Android 上进行视频播放\n\n\
  智能手机和平板电脑的主要用途之一是访问在线内容。一种被广泛使用的内容形式（特别是在平板设备上）是视频。\n\nAndroid SDK 包含了两个类，它们使得在开发应用程序时，在\
  \ Android 设备上实现视频播放变得极其简单。本章将在创建视频播放应用程序之前，对 `VideoView` 和 `MediaController` 这两个类进行概述。\n\
  \n## 70.1 介绍 Android VideoView 类\n\n到目前为止，在 Android 应用程序中显示视频最简单简单的方法是使用 `VideoView`\
  \ 类。这是一个视觉组件，当它被添加到活动的布局中时，提供了一个可以播放视频的表面。Android 目前支持以下视频格式：\n\n* H.263\n* H.264\
  \ AVC\n* H.265 HEVC\n* MPEG-4 SP\n* VP8\n* VP9\n\n`VideoView` 类有一系列广泛的方法，可以调用它们来管理播放。一些常用的方法包括：\n\
  \n* `setVideoPath(String path)` – 指定要播放的媒体的路径（字符串形式）。\n* `setVideoUri(Uri uri)`\
  \ – 执行与 `setVideoPath()` 相同的任务，但它接收一个 `Uri` 对象而不是字符串。\n* `start()` – 开始视频播放。\n*\
  \ `stop()` – 停止视频播放。\n* `pause()` – 暂停视频播放。\n* `isPlaying()` – 返回一个布尔值，指示视频是否正在播放。\n\
  * `setOnPreparedListener(MediaPlayer.OnPreparedListener)` – 允许在视频准备好播放时调用回调方法。\n\
  * `setOnErrorListener(MediaPlayer.OnErrorListener)` - 允许在视频播放期间发生错误时调用回调方法。\n* `setOnCompletionListener(MediaPlayer.OnCompletionListener)`\
  \ - 允许在视频结束时调用回调方法。\n* `getDuration()` – 返回视频时长。除非从 `OnPrepared()` 回调方法调用，否则通常会返回\
  \ -1。\n* `getCurrentPosition()` – 返回一个指示当前播放位置的整数值。\n* `setMediaController(MediaController)`\
  \ – 指定一个 `MediaController` 实例，允许向用户显示播放控制。\n\n## 70.2 介绍 Android MediaController\
  \ 类\n\n如果仅使用 `VideoView` 类播放视频，用户将无法对播放进行任何控制，视频将一直运行到视频结束。这个问题可以通过在 `VideoView`\
  \ 上挂载 `MediaController` 类的实例来解决。`MediaController` 将提供一组控件，允许用户管理播放（例如暂停以及在视频时间轴上向后/向前跳进/进度）。\n\
  \n控件的位置通过将控制器实例锚定到用户界面中的特定视图上来指定。一旦挂载并锚定，控件在播放开始时将短暂出现，此后用户可以通过点击锚定的视图在任何时间重新恢复它们。\n\
  \n该类的一些关键方法如下：\n\n* `setAnchorView(View view)` – 指定控制器要锚定的视图。这 决定了控件在屏幕上的位置。\n*\
  \ `show()` – 显示控件。\n* `show(int timeout)` – 控件显示指定的时间（毫秒）。\n* `hide()` – 向用户隐藏控制器。\n\
  * `isShowing()` – 返回一个布尔值，指示控制器当前对用户可见。\n\n## 70.3 创建视频播放示例\n\n本章的剩余部分将创建一个示例应用程序，旨在使用\
  \ `VideoView` 和 `MediaController` 类播放 MPEG-4 视频文件。\n\n从欢迎屏幕选择 New Project 选项，并在随后的新项目对话框中选择\
  \ Empty Activity 模板，然后点击 Next 按钮。\n\n在 Name 字段输入 `VideoPlayer` 并指定 `com.ebookfrenzy.videoplayer`\
  \ 为包名。在点击 Finish 按钮之前，将 Minimum API level 设置为 API 26: Android 8.0 (Oreo)，并将 Language\
  \ 菜单设置为 Java。\n\n## 70.4 设计 VideoPlayer 布局\n\n主活动的用户界面将仅由 `VideoView` 类的实例组成。使用\
  \ Project 工具窗口找到 `app -> res -> layout -> activity_main.xml` 文件，双击打开它，将 Layout Editor\
  \ 工具切换到 Design 模式并删除默认的 `TextView` 控件。\n\n\n\n\n\n从调色板（Palette）面板的 Widgets 类中，将\
  \ `VideoView` 实例拖放到布局中，使其填充整个可用画布区域，如图 70-1 所示。使用属性（Attributes）面板，将 `layout_width`\
  \ 和 `layout_height` 属性分别更改为 `match_constraint` 和 `wrap_content`。此外，删除连接 `VideoView`\
  \ 底到父级 `ConstraintLayout` 底部的约束。最后，将组件的 ID 更改为 `videoView1`。\n\n![](img/as_3.5_videoplayer_ui.jpg)\n\
  \n图 70-1\n\n## 70.5 下载视频文件\n\n`VideoPlayer` 应用播放的视频是一个 MPEG-4 格式编码的短动画片段。使用网络浏览器导航到以下\
  \ URL 播放视频：\n\n[`www.ebookfrenzy.com/android_book/movie.mp4`](https://www.ebookfrenzy.com/android_book/movie.mp4)\n\
  \n在浏览器窗口中，右键点击视频播放，并选择保存或下载视频到本地文件，选择一个合适的临时文件系统位置，并将文件命名为 `movie.mp4`。\n\n在 Android\
  \ Studio 中，在 Project 工具窗口找到 `res` 文件夹，右键点击它并选择 `New -> Directory` 菜单，在名称字段中输入 `raw`，然后点击\
  \ `OK` 按钮。使用操作系统的文件系统导航器找到上述下载的 `movie.mp4` 文件并复制。返回 Android Studio，右键点击新创建的 `raw`\
  \ 目录并选择 `Paste`，将视频文件复制到项目中。添加完成后，Project 工具窗口中的 `raw` 文件夹应与图 70-2 一致：\n\n![](img/as_3.6_video_player_raw_file_added.jpg)\n\
  \n图 70-2\n\n## 70.6 配置 VideoView\n\n下一步是为 `VideoView` 配置要播放的视频路径并开始播放。将在主活动初始化后执行，因此将\
  \ `MainActivity.java` 文件加载到编辑器中，并按照下面的列表对其进行修改：\n\n```java\npackage com.ebookfrenzy.videoplayer;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\nimport android.os.Bundle;\n\
  import android.widget.VideoView;\nimport android.net.Uri;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private ActivityMainBinding binding;\n    private\
  \ VideoView videoView;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n       \
  \ configureVideoView();\n    }\n\n    private void configureVideoView() {\n    \
  \    binding.videoView1.setVideoURI(Uri.parse(\"android.resource://\"\n        \
  \            + getPackageName() + \"/\" + R.raw.movie));\n        binding.videoView1.start();\n\
  \    }\n}\n```\n\n这段代码的作用只是获取布局中 `VideoView` 实例的引用，为其分配一个指向 raw 资源目录中电影文件的 `Uri`\
  \ 对象，然后开始播放视频。\n\n通过在物理 Android 设备上运行应用程序来测试它。应用程序启动后，在视频开始播放之前，视频内容缓冲可能会有短暂的延迟（图\
  \ 70-3）。\n\n![](img/as_3.6_video_player_playing.jpg)\n\n图 70-3\n\n这说明了将视频播放集成到 Android\
  \ 应用中是多么简单。本示例中目前为止的所有内容都是通过一个 `VideoView` 实例三行代码实现的。\n\n## 70.7 在 Video View 中添加\
  \ MediaController\n\n目前 `VideoPlayer` 应用的状况是用户没有控制播放的方法。如前所述，这可以通过 `MediaController`\
  \ 类来实现。要为 `VideoView` 添加控制器，请再次修改 `configureVideoView()` 方法：\n\n```java\npackage\
  \ com.ebookfrenzy.videoplayer;\n\nimport android.widget.MediaController;\n\npublic\
  \ class MainActivity extends AppCompatActivity {\n    private ActivityMainBinding\
  \ binding;\n    private VideoView videoView;\n    private MediaController mediaController;\n\
  \n    private void configureVideoView() {\n        binding.videoView1.setVideoURI(Uri.parse(\"\
  android.resource://\"\n                    + getPackageName() + \"/\" + R.raw.movie));\n\
  \        mediaController = new MediaController(this);\n        mediaController.setAnchorView(videoView);\n\
  \        binding.videoView1.setMediaController(mediaController);\n        binding.videoView.start();\n\
  \    }\n}\n```\n\n当应用这些更改后应用时，点击 `VideoView` 画布将导致媒体控件出现在视频播放上层。这些控件应包含一个进度条以及快进、倒退和播放/暂停按钮。在控件从视图中消失后，可以随时再次点击\
  \ `VideoView` 画布来恢复它们。只需额外三行代码，我们的视频播放器应用现在就有了如图 70-4 所示的媒体控件。\n\n![](img/as_3.6_video_player_controls.jpg)\n\
  \n图 70-4\n\n## 70.8 设置 onListener\n\n作为处理媒体的最后一个示例，现在将扩展活动以演示监听器。在这种情况下，将实现一个监听器在\
  \ Android 日志中输出视频时长：\n\n```java\npackage com.ebookfrenzy.videoplayer;\n\nimport\
  \ android.util.Log;\nimport android.media.MediaPlayer;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private ActivityMainBinding binding;\n    private\
  \ VideoView videoView;\n    private MediaController mediaController;\n    String\
  \ TAG = \"VideoPlayer\";\n\n    private void configureVideoView() {\n        binding.videoView1.setVideoURI(Uri.parse(\"\
  android.resource://\"\n                    + getPackageName() + \"/\" + R.raw.movie));\n\
  \        mediaController = new MediaController(this);\n        mediaController.setAnchorView(videoView);\n\
  \        binding.videoView1.setMediaController(mediaController);\n        binding.videoView1.setOnPreparedListener(new\
  \ MediaPlayer.OnPreparedListener() {\n            @Override\n            public\
  \ void onPrepared(MediaPlayer mp) {\n                mp.setLooping(true);\n    \
  \            Log.i(TAG, \"Duration = \" + binding.videoView1.getDuration());\n \
  \           }\n        });\n        binding.videoView.start();\n    }\n}\n```\n\n\
  现在在视频开始播放之前，Android Studio Logcat 面中会出现一条类似于所示的消息，并且视频在结束后将重新开始：\n\n11-05 10:27:52.256\
  \ 12542-12542/com.ebookfrenzy.videoplayer I/VideoPlayer: Duration = 13504\n\n##\
  \ 70.9 总结\n\nAndroid 设备是向用户交付内容的优秀平台，特别是以视频媒体的形式。如本章所述，Android SDK 提供了两个类，即 `VideoView`\
  \ 和 `MediaController`，它们结合使得将视频播放集成到 Android 应用中变得快速且简单，通常只需要几行 Java 代码。\n\n\n\n\
  \n\n在前面的章节中介绍 Android 多任务处理时，简要提到了画中画（`PiP`）模式，但没有进行详细介绍。`PiP` 模式主要为视频播放设计，允许一个界面（activity）屏幕缩小尺寸并放置在屏幕的任何位置。在此状态下，界面会继续运行，且无论设备上运行着任何其他活动，窗口都会保持可见。这允许用户在执行检查邮件或处理电子表格等任务的同时，继续观看视频播放。\n\
  \n本章将提供画中画模式的概述，在下一章中，我们将为 `VideoPlayer` 项目添加对画中画的支持。\n\n# 71.1 画中画功能\n\n正如本章稍后将解释的以及下一章将演示的那样，界面可以通过运行中应用\
  \ 内部的 API 调用进入 `PiP` 模式。在进入 `PiP` 模式时，可以指定配置选项来控制 `PiP` 窗口的宽高比，并定义要包含在窗口内的界面区域。例如，图\
  \ 71-1 显示了处于 `PiP` 模式下的视频播放界面：\n\n![](img/Image24273.jpg)\n\n图 71-1\n\n图 71-2 显示了用户点击界面后的\
  \ `PiP` 模式窗口。在此模式下，窗口看起来变得更大，并在中心包含一个全屏操作（点击该操作会将窗口恢复到全屏模式），并在右上角有一个退出按钮，用于关闭窗口并将应用置于后台。添加到\
  \ `PiP` 窗口的任何自定义操作在在此模式下显示时也会出现在屏幕上。在图 71-2 中，`PiP` 窗口包含了自定义的播放和暂停操作按钮：\n\n![](img/Image24363.jpg)\n\
  \n图 71-2\n\n本章的剩余部分将概述如何在 Android 应用内部启用和管理 `PiP` 模式。\n\n# 71.2 启用画中画模式\n\n`PiP`\
  \ 模式目前仅支持运行 `API 26`：Android 8.0（Oreo）或更高版本的设备。实现 `PiP` 模式的第一步是在项目的 manifest 文件中启用它。`PiP`\
  \ 模式是按界面配置的，通过在每个需要 `PiP` 支持的 `activity` 元素中添加以下行：\n\n```xml\n<activity android:name=\"\
  .MyActivity\"\n    android:supportsPictureInPicture=\"true\"\n    android:configChanges\n\
  \        \"screenSize|smallestScreenSize|screenLayout|orientation\"\n    <intent-filter>\n\
  \        <action android:name=\"android.intent.action.MAIN\" />\n        <category\
  \ android:name=\"android.intent.category.LAUNCHER\" />\n    </intent-filter>\n</activity>\n\
  ```\n\n`android:supportsPictureInPicture` 条目开启了界面的 `PiP` 功能，而 `android:configChanges`\
  \ 属性通知 Android 该界面能够处理布局配置更改。如果没有此设置，界面每次进入和退出 `PiP` 模式时，界面都会重新启动，导致在切换期间视频从头开始重新播放。\n\
  \n# 71.3 配置画中画参数\n\n`PiP` 行为通过使用 `PictureInPictureParams` 类来定义，该实例可以使用 `Builder`\
  \ 类如下创建：\n\n```java\nPictureInPictureParams params =\n    new PictureInPictureParams.Builder().build();\n\
  ```\n\n上述代码创建了一个定义了特殊参数的默认 `PictureInPictureParams` 实例。可以使用以下可选方法调用来自定义参数：\n\n-\
  \ `setActions()` – 用于定义在界面处于 `PiP` 模式时从 `PiP` 窗口内执行的操作。操作将在本章稍后部分详细介绍。\n- `setAspectRatio()`\
  \ – 声明 `PiP` 窗口显示的首选宽高比。该方法接受一个包含高度/宽度/高度比例的 `Rational` 对象作为参数。\n- `setSourceRectHint()`\
  \ – 接受一个 `Rect` 对象作为参数，定义 `PiP` 窗口内显示的界面区域。\n\n例如，以下代码在 `PictureInPictureParams`\
  \ 对象中配置了宽高比和操作参数。对于宽高比，它是使用 `VideoView` 实例的宽度和高度定义的：\n\n```java\nRational rational\
  \ = new Rational(videoView.getWidth(),\n    videoView.getHeight());\n\nPictureInPictureParams\
  \ params =\n    new PictureInPictureParams.Builder()\n            .setAspectRatio(rational)\n\
  \            .setActions(actions)\n            .build();\n```\n\n一旦定义，可以随时使用 `setPictureInParams()`\
  \ 方法设置 `PiP` 参数：\n\n```java\nsetPictureInParams(params);\n```\n\n# 71.4 进入画中画模式\n\
  \n通过调用 `enterPictureMode()` 并传递 `PictureInParams` 对象使界面进入画中画模式：如果不需要参数，只需调用 `enterPictureMode()`\
  \ 即可。如果之前使用 `setPictureInParams()` 方法设置了参数，这些将与调用 `enterPictureMode()` 时指定的参数合并。\n\
  \n# 71.5 检测画中画模式变化\n\n当界面进入画中画模式时，重要的是隐藏任何必要的视图，以便在 `PiP` 窗口内仅显示视频。当界面重新进入全屏模式时，需要恢复用户界面组件。这些和其他应用任务可以通过重写\
  \ `onPictureModeChanged()` 方法来实现。当界面每次在 `PiP` 和全屏模式之间切换时，该方法会被调用，并传递一个指示界面是否处于 `PiP`\
  \ 模式的布尔值：\n\n```java\n@Override\npublic void onPictureModeChanged(boolean isInPictureMode)\
  \ {\n    super.onPictureModeChanged(isInPictureMode);\n    if (isInPictureMode)\
  \ {\n        // 进入画中画模式\n    } else {\n        // 进入全屏模式\n    }\n}\n```\n\n# 71.6\
  \ 添加画中画操作\n\n画中画操作在用户点击 `PiP` 窗口时会以图标形式出现在窗口内。实现 `PiP` 操作是一个多步骤过程，首先是实现一种让 `PiP`\
  \ 窗口通知应用已选择操作的方法。这通过在应用内设置广播接收器来实现，然后在 `PiP` 操作中创建等待图，该意图随后配置为广播接收器正在监听的意图。当广播接收器被意图触发时，可以使用意图中存储的数据来识别执行的操作并在应用内采取必要的行动。\n\
  \n`PiP` 操作使用 `RemoteAction` 实例声明，这些实例使用图标、标题、描述和 `PendingIntent` 对象初始化。一旦创建了一个或多个操作，它们就会被添加到\
  \ `ArrayList` 中，并在构建 `PictureInPictureParams` 对象时传递给 `setActions()` 方法。\n\n以下代码片段演示了\
  \ `Intent`、`PendingIntent` 和 `RemoteAction` 对象的创建，以及一个 `PictureInPictureParams`\
  \ 实例，，随后将其应用于应用的 `PiP` 设置中：\n\n```java\nfinal ArrayList<RemoteAction> actions =\
  \ new ArrayList<>();\nIntent actionIntent = new Intent(\"MY_PIP_ACTION\");\nfinal\
  \ PendingIntent pendingIntent =\n    PendingIntent.getBroadcast(MyActivity.this,\
  \ REQUEST_CODE, actionIntent, 0);\nfinal Icon icon = Icon.createWithResource(MyActivity.this,\n\
  ```\n\n\n\n\n\n```java\nR.drawable.action_icon);\n\nRemoteAction remoteAction =\
  \ new RemoteAction(icon,\n    \"My Action Title\",\n    \"My Action Description\"\
  ,\n    pendingIntent);\nactions.add(remoteAction);\n\nPictureInPictureParams params\
  \ =\n    new PictureInPictureParams.Builder()\n        .setActions(actions)\n  \
  \      .build();\nsetPictureInPictureParams(params);\n```\n\n# 71.7 总结\n\n画中画（Picture-in-Picture，简称\
  \ PiP）模式是 Android 8.0 引入的一种多任务功能，专门用于允许用户在执行其他应用和活动任务时在小窗口继续播放视频。在使用 PiP 模式之前，必须先在清单文件（manifest）中启用支持\
  \ PiP 的活动。\n\nPiP 模式的行为通过 `PictureInPictureParams` 类的实例进行配置，并通过在活动内部调用 `enterPictureInPictureMode()`\
  \ 方法来启动。在 PiP 模式下，应该只显示视频播放，这要求在选择全屏模式之前隐藏任何其他用户界面元素。这些以及与其他模式切换相关的任务可以通过重写 `onPictureInPictureModeChanged()`\
  \ 方法来完成。\n\nPiP 操作在用户点击 PiP 窗口时会作为叠加在 PiP 窗口上的图标出现。选中后，这些操作将触发活动内的行为。活动通过广播接收器和\
  \ `pending intents` 接收 PiP 窗口的操作。\n\n# 72. Android 画中画教程\n\n接上一章节，本章将采用现有的 `VideoPlayer`\
  \ 项目并对其进行增强以添加画中画支持，包括检测 PiP 模式变化以及添加一个设计用于显示当前运行视频信息的 PiP 操作。\n\n## 72.1 在清单文件中添加画中画支持\n\
  \n在 Android 应用项目中添加 PiP 支持的第一步是在项目的清单文件（Manifest）中启用它。打开 `manifests` -> `AndroidManifest.xml`\
  \ 文件并修改 `activity` 元素以启用 PiP 支持：\n\n```xml\n<activity android:name=\".MainActivity\"\
  \n  android:supportsPictureInPicture=\"true\"\n  android:configChanges=\"screenSize|smallestScreenSize|screenLayout|orientation\"\
  \n  android:exported=\"true\">\n    <intent-filter>\n        <action android:name=\"\
  android.intent.action.MAIN\" />\n        <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n    </intent-filter>\n</activity>\n```\n\n## 72.2 添加画中画按钮\n\n按照目前的设计，`VideoPlayer`\
  \ 活动的布局仅包含一个 `VideoView` 实例。现在将布局中添加一个按钮用于切换到 PiP 模式。将 `activity_main.xml` 文件加载到布局编辑器中，从调色板将\
  \ `Button` 对象拖到布局中，使其位置如图 图 72-1 所示：\n\n![](img/as_4.1_video_plater_pip_ui.jpg)\n\
  \n图 72-1\n\n更改按钮上的文本为“Enter PiP Mode”，并将字符串提取到名为 `enter_pip_mode` 的资源。在继续下一步之前，将按钮的\
  \ ID 更改为 `pipButton` 并配置按钮调用名为 `enterPipMode` 的方法。\n\n## 72.3 进入画中画模式\n\n现在需要将 `enterPipMode`\
  \ onClick 回调方法添加到 `MainActivity.java` 类文件中。找到此文件，在代码编辑器中打开并按如下添加此方法：\n\n```java\n\
  import android.app.PictureInPictureParams;\nimport android.util.Rational;\n\npublic\
  \ void enterPipMode(View view) {\n    Rational rational = new Rational(binding.videoView1.getWidth(),\n\
  \        binding.videoView1.getHeight());\n    PictureInPictureParams params =\n\
  \        new PictureInPictureParams.Builder()\n            .setAspectRatio(rational)\n\
  \            .build();\n    binding.pipButton.setVisibility(View.INVISIBLE);\n \
  \   binding.videoView1.setMediaController(null);\n    enterPictureInPictureMode(params);\n\
  }\n```\n\n该方法首先获取 `VideoView` 的引用，然后创建一个包含宽度和高的 `Rational` 对象。接着使用 `PictureInPictureParams.Builder`\
  \ 创建一组 `PictureInPictureParams`，并将 `Rational` 对象作为宽高比。在 PiP 模式下将 `pipButton` 设置为不可见。\n\
  \n在运行 Android 8 或更高版本的设备或模拟器上编译并运行应用，并在视频播放开始前点击 PiP 模式。视频播放应该最小化并出现在 图 72-2 中：\n\
  \n![](img/as_3.6_video_player_action_bar.jpg)\n\n图 72-2\n\n虽然视频现在要在 PiP 中播放，但大部分视图被标准操作栏遮挡。要移除这一点，找到\
  \ `app -> res -> values -> themes.xml` 文件并修改 `AppTheme` 元素使用 `NoActionBar`：\n\n\
  ```xml\n<resources xmlns:tools=\"http://schemas.android.com/tools\">\n    <!-- 基础应用主题。\
  \ -->\n    <style name=\"Theme.VideoPlayer\" parent=\"Theme.MaterialComponents.DayNight.NoActionBar\"\
  >\n        <!-- 主品牌颜色。 -->\n        <item name=\"colorPrimary\">@color/purple_500</item>\n\
  \        <item name=\"colorPrimaryVariant\">@color/purple_700</item>\n    </style>\n\
  </resources>\n```\n\n对 `themes.xml (night)` 资源重复此步骤。编译并运行应用，将视频播放放入 PiP 模式，并注意操作栏不再出现在窗口中。\n\
  \n点击 PiP 窗口使其增大，然后点击窗口中心出现的全屏标记。尽管活动返回了全屏模式，但注意按钮和媒体控件仍然隐藏着。\n\n显然需要在项目中添加一些代码来检测活动内发生的\
  \ PiP 模式变化。\n\n## 72.4 检测画中画模式变化\n\n如上一章所示，PiP 模式的变化是通过重写活动内的 `onPictureInPictureModeChanged()`\
  \ 方法检测的。在这种情况下，该方法需要编写为能够检测活动是进入还是退出 PiP 模式，并采取相应操作重新激活 PiP 按钮和播放控件。继续留在 `MainActivity.java`\
  \ 文件中，现在添加此方法：\n\n```java\n@Override\npublic void onPictureInPictureModeChanged(boolean\
  \ isInPictureInPictureMode) {\n    super.onPictureInPictureModeChanged(isInPictureInPictureMode);\n\
  \    if (isInPictureInPictureMode) {\n    } else {\n        binding.pipButton.setVisibility(View.VISIBLE);\n\
  \        binding.videoView1.setMediaController(mediaController);\n    }\n}\n```\n\
  \n调用该方法时，会传递一个指示活动现在是否处于 PiP 模式的布尔值。上述方法中的代码简单地检查此值，以决定是否显示 PiP 按钮并重新激活播放控件。\n\n\
  ## 72.5 添加广播接收器\n\n\n\n\n项目的最后一步是为 PiP 窗口添加一个操作（action）。该操作的目的是显示一个包含正在播放视频名称的 `Toast`\
  \ 消息。这需要在 PiP 窗口和活动（activity）之间进行一些通信。实现这一目标的最简单方法之一是在活动中实现一个 `broadcast receiver`（广播接收器），并使用\
  \ `pending intent` 从 PiP 窗口向活动广播消息。这些步骤在每次活动进入 PiP 模式时都需要执行，因此需要在 `onPictureInPictureModeChanged()`\
  \ 方法中添加代码。现在找到该方法，并开始添加代码来创建一个 `intent filter`（意图过滤器）并初始化 `broadcast receiver`：\n\
  \n```java\nimport android.content.BroadcastReceiver;\nimport android.content.Context;\n\
  import android.content.Intent;\nimport android.content.IntentFilter;\nimport android.widget.Toast;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private BroadcastReceiver\
  \ receiver;\n\n    @Override\n    public void onPictureInPictureModeChanged(boolean\
  \ isInPictureInPictureMode) {\n        super.onPictureInPictureModeChanged(isInPictureInPictureMode);\n\
  \        if (isInPictureInPictureMode) {\n            IntentFilter filter = new\
  \ IntentFilter();\n            filter.addAction(\"com.ebookfrenzy.videoplayer.VIDEO_INFO\"\
  );\n            receiver = new BroadcastReceiver() {\n                @Override\n\
  \                public void onReceive(Context context, Intent intent) {\n     \
  \               Toast.makeText(context, \"Favorite Movie Clips\", Toast.LENGTH_LONG).show();\n\
  \                }\n            };\n            registerReceiver(receiver, filter);\n\
  \        } else {\n            binding.pipButton.setVisibility(View.VISIBLE);\n\
  \            binding.videoView1.setController(mediaController);\n            if\
  \ (receiver != null) {\n                unregisterReceiver(receiver);\n        \
  \    }\n        }\n    }\n}\n```\n\n## 72.6 添加 PiP 操作\n\n实现广播接收器后，下一步是创建一个 `RemoteAction`\
  \ 对象，并配置一个图像来表示 PiP 窗口中的操作。在本例中，将使用一个名为 `ic_info_2dp.xml` 的图像文件。该文件可以在以下 URL 提供的源代码归包的\
