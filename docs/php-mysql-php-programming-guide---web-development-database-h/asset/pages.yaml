  md: '# Inserting data into a MySQL table using PHP


    INSERT INTO statement:

    Sometimes we may need to insert data into an already existing table.

    We can insert new records into a table using the INSERT INTO statement. For inserting
    data into a MySQL table, there are a set of rules to be followed. They are:


    +   - The SQL query should be quoted in PHP

    - The String values that are present inside the query should be quoted.

    - Numeric values should not be quoted.

    - The Word NULL should not be quoted.


    Here is the syntax for inserting data.


    ```

    INSERT INTO table_name (column1, column2, column3,...)nVALUES (value1, value2,
    value3,...);

    ```


    In the last chapter, we have created a table "customers" which has 4 columns.
    With the INSERT INTO statement, we can add data to that table. We can use the
    following examples.


    We have created a table named "Customers" in the last chapter with four columns
    namely "customer_id", "first_name", "last_name" and "email_id". We can enter data
    into the table using the following examples:


    Example: Using Object oriented mysqli to insert data into a table:


    ```

    <php

    $servername = "localhost";

    $username = "username";

    $password = "password";

    $dbname = "Our_Customers";

    // create connection

    $conn = new mysqli($servername, $username, $password, $dbname);

    ```'
