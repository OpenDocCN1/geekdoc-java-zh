  md: '# # What are data types?


    A datatype is nothing but the representation of the class to which the data item
    originally belongs. What examples all letters characters and they belong to the
    data type character. The number ''200'' is an integer and it belongs to the datatype
    integer. The important data types used in MySQL are given below.


    | Data type | Use |

    |---|---|

    | CHAR(y) | Stores characters of length ''y''. The length ''y'' is fixed. Using
    this data type, one cannot store a string which has characters less than ''y''.
    |

    | VARCHAR(y) | Stores characters in variable length up to a maximum length of
    ''y''. Slower than CHAR. |

    | TEXT | Stores string values up to 65,535 characters. |

    | BLOB | Stores Binary Large Objects. A total of 65,535 bytes can be stored. |

    | ENUM(a,b,c...) | A list of values can be entered using this data data type.
    A total of 65,535 values can be listed up. |

    | TININT(y) | Can store numerical values between 128 to 127 for signed integers
    and 0 to 255 for UNSIGNED integers. Here, y is the highest of the digits. |

    | SMALLINT(y) | Can store numerical values between |'
