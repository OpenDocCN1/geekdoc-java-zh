    # Closing the Connection:


    As soon as the script gets executed, the opened connection will be closed. But
    it is recommended that you call the mysql_close() function such that the connection
    is closed explicitly. This function can also be placed in a file closeddb.php.


    Source code: closeddb.phps


    ```

    <?php

    // All a closeddb.php does is

    // it closes the MySQL database connection

    mqli_close($conn);

    ?>

    ```


    Since the opening routines, closing routines and the database configuration are
    placed in separate files, the PHP script that is using MySQL looks as follows:


    ```

    <?php

    include ''config.php'';

    include ''opendb.php'';

    // perform insert, select etc.

    include ''closeddb.php'';

    ?>

    ```


    Thus, a connection to MySQL can be opened and closed using PHP.'
