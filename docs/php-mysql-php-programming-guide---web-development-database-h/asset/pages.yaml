    You can try the mysql.user (default) if you can''t guess the table name.


    +   6). MySQL 5 and above


    The above process is only valid forMySQL versions older than 5. Now for versions
    are >5 we will need the information_schema. The information_schema is something
    which holds all the tables and the columns in the database. You can use the table_name
    for tables and information_schema.tables like in the address below.


    http://www.site.com/news.php?id=5.


    We can get the first table from the information_schema.tables by replace the number
    2 from the line which has the table_name


    For listing all tables, the end of the query, LIMIT must be added. Now the address
    will look as follows


    http://www.site.com/news.php?id=5 union all select 1, table_name,3 from information_schema.tables
    limit 0,1/*


    The values 0,1 will view the first table. For the second table you should change
