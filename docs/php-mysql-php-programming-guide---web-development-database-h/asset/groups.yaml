    # Chapter 2: Connecting to MySQL Database Using PHP


    # Writing PHP


    Writing PHP is actually pretty simple since you won''t need any software for it,
    except any text editor (like Notepad in Windows). If you run it, you can write
    your own first PHP script.'
  - '[PAGE 10]


    # Declaring PHP


    PHP scripts are enclosed between 2 PHP tags. Due to this, your server can parse
    information through them as PHP. The different forms of declaring code are as
    follows:


    ```

    <?

    PHP Code in Here

    ?>

    <?php

    PHP Code in Here

    php?>

    <script language="php">

    PHP Code in Here</script>

    ```


    These function in the same manner but here I will am using first options (<??>).There
    isn''t any reason for this; however, you can make use of any of the options. But
    remember, to begin and end your code with same tags (you can not start with<?
    and end with </script> for example).'
  - '[PAGE 11]


    # Opening and closing a connection


    It is easy to open a connection between MySQL database and PHP, from PHP. It can
    be done by using the mysqli_connect () function. MySQL system from version 4.1
    has so many new features when compared to the older versions. Those new features
    can be taken advantage of by using the newly developed mysqli extension. mysqli
    extension means MySQL improved extension. For PHP versions from 5 and above, MySQL
    extension has been included.


    A connection to MySQL can be opened from PHP as follows:


    ```

    <?php

    $dbhost = ''localhost'';

    $dbuser = ''root'';

    $dbpass = ''password'';

    $conn = mysqli_connect($dbhost, $dbuser, $dbpass) or die (''Error connecting to
    MySQL'');

    $dbname = ''Our_Customers'';

    mqli_select_db($dbname);

    ?>

    ```


    MySQL server''s name is $dbhost. We can use the localhost or 127.0.0.1 as the
    webserver and MySQL server are on the same machine. The $dbuser is the valid MySQL
    username and $dbpass is the valid MySQL password. After connecting to MySQL, never
    forget selecting a database using mysqli_select_db(). If you forget to select
    the database, the select or update queries won''t work.


    You are required to specify the name of the MySQL server and port number sometimes,
    for example, let us assume the name of the MySQL server is db.xyz.com. It has
    a port number of'
  - '[PAGE 12]


    3306 (default). Then the code given above can be modified as follows:


    ```

    <?php

    $dbhost = ''db.xyz.com:3306'';

    $dbuser = ''root'';

    $dbpass = ''password'';

    $conn = mysqli_connect($dbhost, $dbuser, $dbpass) or die (''Error connecting to
    MySQL'');

    $dbname = ''Our_Customers'';

    mysqli_select_db($dbname);

    ?>

    ```


    Usually, the routine that opens a database connection is placed in another file
    separately. The connection can be opened when needed by including the file. The
    database name, password, user and host are usually stored separately in a configuration
    file.


    A good example for config.php which stores a connection configuration and opendb.php
    which opens the connection is:


    # Source code: config.php, opendb.php


    ```

    <?php

    $dbhost = ''localhost'';

    $dbuser = ''root'';

    $dbpass = ''password'';

    $dbname = ''Our_Customers'';

    ?>

    <?php

    $conn = mysqli_connect($dbhost, $dbuser, $dbpass) or die (''Error connecting to
    MySQL'');

    mysqli_select_db($dbname);

    ?>

    ```


    Now, a connection to MySQL can be opened as follows:'
  - '[PAGE 13]


    ```

    <?php

    include ''config.php'';

    include ''opendb.php'';

    ?>

    ```


    # Closing the Connection:


    As soon as the script gets executed, the opened connection will be closed. But
    it is recommended that you call the mysql_close() function such that the connection
    is closed explicitly. This function can also be placed in a file closeddb.php.


    Source code: closeddb.phps


    ```

    <?php

    // All a closeddb.php does is

    // it closes the MySQL database connection

    mqli_close($conn);

    ?>

    ```


    Since the opening routines, closing routines and the database configuration are
    placed in separate files, the PHP script that is using MySQL looks as follows:


    ```

    <?php

    include ''config.php'';

    include ''opendb.php'';

    // perform insert, select etc.

    include ''closeddb.php'';

    ?>

    ```


    Thus, a connection to MySQL can be opened and closed using PHP.'
  - '[PAGE 14]


    # Chapter 3: Creating Database and Tables in MySQL Using PHP


    Let us have a look at the extensions that we use in PHP in order to work with
    MySQL database before we create and manipulate a given database with MySQL and
    PHP.


    PHP versions 5 and later use extensions in order to work with MySQL database.
    They are as follows.


    +   1. MySQLLi

    2. PHP Data Objects (PDO)


    2012, MySQL extension was removed from PHP though it was used in its previous
    versions. Both MySQLi and PDO are object oriented. But MySQLLi provides a procedural
    Application Program Interface in addition.


    Create a MySQL Database using PHP


    In my SQL, for creating a database, we use CREATE DATABASE statement.


    Here is an example in which we create a database named ''Our_Customerers'':


    Example: Using object oriented MySQLi to create a database


    ```

    <?php

    $servername = "localhost";

    $username = "username";

    $password = "password";

    // create connection

    $conn = new mysqli($servername, $username, $password);

    ```'
