    # Chapter 5: Hacking a Website Using SQL and PHP Scripting


    # What is SQL Injection?


    SQL injection is a famous and widely used method for hacking. This method lets
    an unauthorised person access the website''s database. With this, the attacker
    gets access to all the data from the website''s database.


    With SQL injection the attacker can


    +   - Bypass logins

    - Modify the contents of the website

    - Access confidential data

    - Can shut down the MySQL server


    You can implement SQL injection with the following steps


    Step 1: Finding Vulnerable Website:


    You can find some vulnerable websites with the help of Google Dork list. Google
    Dork constantly searches for websites that are vulnerable using their searching
    tricks. You can find a number of tricks to search in Google.


    Here, for finding websites that are vulnerable, we will use the "inurl: command.


    Below mentioned are a few examples


    ```

    inurl:index.php?id=

    inurl:gallery.php?id=

    inurl:article.php?id=

    inurl:pageid=

    ```


    How to use?


    You will get a list of websites when you copy any of the above commands and paste
    them in Google. Then you will have to check the vulnerability of each website
    by visiting them one by one.'
