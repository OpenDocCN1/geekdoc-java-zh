    +   5. Supports Open Database Connectivity aka (ODBC): MySQL through Database
    Connectivity (ODBC) provides the connection of its database to be used by the
    programming language that the operating system of computer uses.


    +   6. Existence of two dimensional data: There are many systems such as geographic
