    # # Chapter 1: Introduction to MySQL


    MySQL is also an open source database that is dependent on the relationships between
    those tables. Hence it is called a Relational Database and managing it is Relational
    Database Management System and it is one of the most popularly used RDBMS after
    Oracle.


    Like PHP MySQL has its own important characteristics listing a couple of:


    +   1. Architectural Design: MySQL has a client/server architecture that contains
    the MySQL server that acts as a medium to which the client and server interact
    with. This interaction can be with multiple clients. A client could be an application
    that has connected with the server for retrieving data. These could be distributed
    over multiple computers or can be from the same computer i.e. the client and the
    server can be working from the same computer or they can be from different computers
    spit over the borders. High access of the server can be provided for various clients
    to access.


    +   2. High Speed: Since most of the tables in the database are connected with
    the correct joins the data can be retrieved quite fast. And this is the most important
    feature of MySQL that makes it popular.


    +   3. Independent of the platform: Like PHP even MySQL can run on multiple operating
    systems such as Linux, MAC, UNIX, windows etc.


    +   4. High compatibility of SQL and MySQL: SQL stands for Structured Query Language.
    It is a programming language which MySQL database supports. Through Structured
    Query Language we can create databases i.e. create the tables in the database,
    create their relationships and also the data and using the same language we can
    manipulate the data. Using the same'
