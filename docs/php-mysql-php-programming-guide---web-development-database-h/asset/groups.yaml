    书中提供了许多带有 MySQL 查询的 PHP 示例程序，以便读者理解 PHP 和 MySQL 是融合并互为补充的。在必要的地方，程序末尾都提供了输出结果，让读者理解程序如何影响数据库。这本书还包含了用于入侵网站的示例代码。


    我希望你发现这本书很有益处；感谢你选择这本书。

