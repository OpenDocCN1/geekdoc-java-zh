  md: "\n# Chapter 2: Connecting to MySQL Database Using PHP\n\n## Writing PHP\n\n\
    Writing PHP is actually pretty simple since you won't need any software for it,\
    \ except any text editor (like Notepad in Windows). If you run it, you can write\
    \ your own first PHP script.\n\n## Declaring PHP\n\nPHP scripts are enclosed between\
    \ 2 PHP tags. Due to this, your server can parse information through them as PHP.\
    \ The different forms of declaring code are as follows:\n\n```\n<?php\nPHP Code\
    \ in Here\n?>\n<?php\nPHP Code in Here\nphp?>\n<script language=\"php\">\nPHP\
    \ Code in Here</script>\n```\n\nThese function in the same manner but here I will\
    \ am using first options (<??>). There isn't any reason for this; however, you\
    \ can make use of any of the options. But remember, to begin and end your code\
    \ with same tags (you can not start with <?php and end with </script> for example).\n\
    \n## Opening and closing a connection\n\nIt is easy to open a connection between\
    \ MySQL database and PHP, from PHP. It can be done by using the mysqli_connect\
    \ () function. MySQL system from version 4.1 has so many new features when compared\
    \ to the older versions. Those new features can be taken advantage of by using\
    \ the newly developed mysqli extension. mysqli extension means MySQL improved\
    \ extension. For PHP versions from 5 and above, MySQL extension has been included.\n\
    \nA connection to MySQL can be opened from PHP as follows:\n\n```php\n<?php\n\
    $dbhost = 'localhost';\n$dbuser = 'root';\n$dbpass = 'password';\n$conn = mysqli_connect($dbhost,\
    \ $dbuser, $dbpass) or die ('Error connecting to MySQL');\n$dbname = 'Our_Customers';\n\
    mysqli_select_db($dbname);\n?>\n```\n\nMySQL server's name is $dbhost. We can\
    \ use the localhost or 127.0.0.1 as the webserver and MySQL server are on the\
    \ same machine. The $dbuser is the valid MySQL username and $dbpass is the valid\
    \ MySQL password. After connecting to MySQL, never forget selecting a database\
    \ using mysqli_select_db(). If you forget to select the database, the select or\
    \ update queries won't work.\n\nYou are required to specify the name of the MySQL\
    \ server and port number sometimes, for example, let us assume the name of the\
    \ MySQL server is db.xyz.com. It has a port number of 3306 (default). Then the\
    \ code given above can be modified as follows:\n\n```php\n<?php\n$dbhost = 'db.xyz.com:3306';\n\
    $dbuser = 'root';\n$dbpass = 'password';\n$conn = mysqli_connect($dbhost, $dbuser,\
    \ $dbpass) or die ('Error connecting to MySQL');\n$dbname = 'Our_Customers';\n\
    mysqli_select_db($dbname);\n?>\n```\n\nUsually, the routine that opens a database\
    \ connection is placed in another file separately. The connection can be opened\
    \ when needed by including the file. The database name, password, user and host\
    \ are usually stored separately in a configuration file.\n\nA good example for\
    \ config.php which stores a connection configuration and opendb.php which opens\
    \ the connection is:\n\n# Source code: config.php, opendb.php\n\n```php\n<?php\n\
    $dbhost = 'localhost';\n$dbuser = 'root';\n$dbpass = 'password';\n$dbname = 'Our_Customers';\n\
    ?>\n<?php\n$conn = mysqli_connect($dbhost, $dbuser, $dbpass) or die ('Error connecting\
    \ to MySQL');\nmysqli_select_db($dbname);\n?>\n```\n\nNow, a connection to MySQL\
    \ can be opened as follows:\n\n```php\n<?php\ninclude 'config.php';\ninclude 'opendb.php';\n\
    ?>\n```\n\n## Closing the Connection:\n\nAs soon as the script gets executed,\
    \ the opened connection will be closed. But it is recommended that you call the\
    \ mysql_close() function such that the connection is closed explicitly. This function\
    \ can also be placed in a file closeddb.php.\n\nSource code: closeddb.php\n\n\
    ```php\n<?php\n// All a closeddb.php does is\n// it closes the MySQL database\
    \ connection\nmysqli_close($conn);\n?>\n```\n\nSince the opening routines, closing\
    \ routines and the database configuration are placed in separate files, the PHP\
    \ script that is using MySQL looks as follows:\n\n```php\n<?php\ninclude 'config.php';\n\
    include 'opendb.php';\n// perform insert, select etc.\ninclude 'closeddb.php';\n\
    ?>\n```\n\nThus, a connection to MySQL can be opened and closed using PHP.\n\n\
    # Chapter 3: Creating Database and Tables in MySQL Using PHP\n\nLet us have a\
    \ look at the extensions that we use in PHP in order to work with MySQL database\
    \ before we create and manipulate a given database with MySQL and PHP.\n\nPHP\
    \ versions 5 and later use extensions in order to work with MySQL database. They\
    \ are as follows:\n\n- 1. MySQli\n- 2. PHP Data Objects (PDO)\n\n2012, MySQL extension\
    \ was removed from PHP though it was used in its previous versions. Both MySQLi\
    \ and PDO are object oriented. But MySQli provides a procedural Application Program\
    \ Interface in addition.\n\n## Create a MySQL Database using PHP\n\nIn MySQL,\
    \ for creating a database, we use CREATE DATABASE statement.\n\nHere is an example\
    \ in which we create a database named 'Our_Customerers':\n\nExample: Using object\
    \ oriented MySQLi to create a database\n\n```php\n<?php\n$servername = \"localhost\"\
    ;\n$username = \"root\";\n$password = \"password\";\n// Create connection\n$conn\
    \ = new mysqli($servername, $username, $password);\n\n// Check connection\nif\
    \ ($conn->connect_error) {\n    die(\"Connection failed: \" . $conn->connect_error);\n\
    }\n// Create database\n$sql = \"CREATE DATABASE Our_Customerers\";\nif ($conn->query($sql)\
    \ === TRUE) {\n    echo \"Database Our_Customerers created successfully\";\n}\
    \ else {\n    echo \"Error creating database: \" . $conn->error;\n}\n$conn->close();\n\
    ?>\n```\n\n## Creating a MySQL table using PHP\n\nTo create a table in MySQL,\
    \ we use the CREATE TABLE statement. Here is an example of creating a Customers\
    \ table:\n\n```php\n<?php\n$servername = \"localhost\";\n$username = \"root\"\
    ;\n$password = \"password\";\n// Create connection\n$conn = new mysqli($servername,\
    \ $username, $password);\n\n// Check connection\nif ($conn->connect_error) {\n\
    \    die(\"Connection failed: \" . $conn->connect_error);\n}\n\n// Create table\n\
    $sql = \"CREATE TABLE Customers (\n  id INT(6) NOT NULL AUTO_INCREMENT PRIMARY\
    \ KEY,\n  first_name varchar(30) NOT NULL,\n  last_name varchar(30) NOT NULL,\n\
    \  email varchar(50),\n  address varchar(255),\n  age int\n)\";\n\nif ($conn->query($sql)\
    \ === TRUE) {\n    echo \"Table Customers created successfully\";\n} else {\n\
    \    echo \"Error creating table: \" . $conn->error;\n}\n\n$conn->close();\n?>\n\
    ```\n\n## What are data types?\n\nA datatype is nothing but the representation\
    \ of data. The type of data to which it belongs. The important data types used\
    \ in MySQL are given below.\n\n| Data type | Use |\n|---|---|\n| CHAR(y) | Stores\
    \ characters of length 'y'. The length 'y' is fixed. |\n| VARCHAR(y) | Stores\
    \ characters in variable length up to a maximum 'y'. Slower than CHAR. |\n| TEXT\
    \ | Stores string values up to 65,535. |\n| BLOB | Stores Binary Large Objects.\
    \ A total of 65,535 bytes. |\n| ENUM(a,b,c...) | A list of values can be entered\
    \ using this data type. A total of 65,535 values can be listed. |\n| TINYINT(y)\
    \ | Can store numerical values between -128 to 127 for signed and 0 to 255 for\
    \ UNSIGNED. Here, y is the highest of digits. |\n| SMALLINT(y) | Can store numerical\
    \ values between -32,768 and 32,767. Here, y is the maximum size of digits. |\n\
    | INT(y) | Can store numerical values between -2,147,483,648 and 2,147,483,647.\
    \ Here, y is the maximum size of digits. |\n| BIGINT(y) | Can store numericals\
    \ between -9,223,372,036,854,775,808 and 9,223,372,036,854,775,807. Here, y is\
    \ the maximum size of digits. |\n| DECIMAL(precision,scale) | This can store large\
    \ decimal values. The number of digits that can be stored is called precision.\
    \ Scale is nothing but number of digits that can be placed after point. Here is\
    \ an example: 654.123 is a number with 3 digits before and 3 digits after the\
    \ decimal point. |\n| FLOAT(precision,scale) | Can store small fractional values.\
    \ Precision means the total number of digits that can be stored. Scale means the\
    \ number of digits after the decimal point. |\n| DATE() | This datatype stores\
    \ the year, month, day format |\n| TIME() | Stores the time in the hour, minute,\
    \ and seconds format |\n| TIMESTAMP() | Can store date and time values together\
    \ |\n"
  mdcn: "\n\n# 第 2 章：使用 PHP 连接 MySQL 数据库\n\n## 编写 PHP\n\n编写 PHP 实际上非常简单，因为你不需要任何软件，除了任何文本编辑器（如\
    \ Windows 中的记事本）。如果你运行它，你就可以编写自己的第一个 PHP 脚本。\n\n## 声明 PHP\n\nPHP 脚本被包含在两个 PHP\
    \ 标签之间。由于由于，你的服务器可以通过这些标签将信息解析为 PHP。代码的不同形式如下：\n\n```\n<?php\nPHP Code in Here\n\
    ?>\n<?php\nPHP Code in Here\nphp?>\n<script language=\"php\">\nPHP Code in Here</script>\n\
    ```\n\n它们的功能相同，但在这里我将使用第一种选项（<??>）。这没有特殊原因；但是，你可以使用任何选项。但记住，代码的开始和结束必须相同的标签（例如，你不能用\
    \ `<?php` 开始而用 `</script>` 结束）。\n\n## 打开和关闭连接\n\n从 PHP 打开 MySQL 数据库的连接非常简单。可以使用\
    \ `mysqli_connect()` 函数来实现。与旧版本相比，MySQL 系统从 4.1 版本开始有了许多新功能。可以通过新开发的 `mysqli`\
    \ 扩展来利用这些新功能。`mysqli` 扩展意味着 MySQL 改进扩展。对于 5 及以上的 PHP 版本，MySQL 扩展已经包含在内。\n\n可以通过如下方式从\
    \ PHP 打开到 MySQL连接：\n\n```php\n<?php\n$dbhost = 'localhost';\n$dbuser = 'root';\n\
    $dbpass = 'password';\n$conn = mysqli_connect($dbhost, $dbuser, $dbpass) or die\
    \ ('Error connecting to MySQL');\n$dbname = 'Our_Customers';\nmysqli_select_db($dbname);\n\
    ?>\n```\n\nMySQL 服务器的名称是 `$dbhost`。如果 Web 服务器和 MySQL 服务器在同一台机器上，可以使用 `localhost`\
    \ 或 `127.0.0.1`。$dbuser` 是有效的 MySQL 用户名，$dbpass` 是有效的 MySQL 密码。连接到 MySQL 后，永远不要忘记使用\
    \ `mysqli_select_db()` 选择数据库。如果你忘记选择数据库，`select` 或 `update` 查询将无法运行。\n\n有时你需要指定\
    \ MySQL 服务器的名称和端口号，例如，假设 MySQL 服务器的名称为 `db.xyz.com`。它的端口号为 3306（默认）。那么上面的代码可以修改如下：\n\
    \n```php\n<?php\n$dbhost = 'db.xyz.com:3306';\n$dbuser = 'root';\n$dbpass = 'password';\n\
    $conn = mysqli_connect($dbhost, $dbuser, $dbpass) or die ('Error connecting to\
    \ MySQL');\n$dbname = 'Our_Customers';\nmysqli_select_db($dbname);\n?>\n```\n\n\
    通常，打开数据库连接的例程被单独放在另一个文件中。需要时可以通过包含该文件来打开连接。数据库名称、密码、用户和主机通常单独存储在配置文件中。\n\n一个存储连接配置的\
    \ `config.php` 和打开连接的 `opendb.php` 的良好示例如下：\n\n# 源代码：config.php, opendb.php\n\n\
    ```php\n<?php\n$dbhost = 'localhost';\n$dbuser = 'root';\n$dbpass = 'password';\n\
    $dbname = 'Our_Customers';\n?>\n<?php\n$conn = mysqli_connect($dbhost, $dbuser,\
    \ $dbpass) or die ('Error connecting to MySQL');\nmysqli_select_db($dbname);\n\
    ?>\n```\n\n现在，可以如下方式打开到 MySQL 连接：\n\n```php\n<?php\ninclude 'config.php';\ninclude\
    \ 'opendb.php';\n?>\n```\n\n## 关闭连接：\n\n脚本一旦执行，打开的连接就会关闭。但建议你调用 `mysql_close()`\
    \ 函数，以便显式地关闭连接。此函数也可以放在 `closeddb.php` 文件中。\n\n源代码：closeddb.php\n\n```php\n<?php\n\
    // closeddb.php 所做的只是\n// 它关闭了 MySQL 数据库连接\nmysqli_close($conn);\n?>\n```\n\n\
    由于打开例程、关闭例程和数据库配置被放在不同的文件中，使用 MySQL 的 PHP 脚本如下所示：\n\n```php\n<?php\ninclude 'config.php';\n\
    include 'opendb.php';\n// 执行 insert, select 等操作\ninclude 'closeddb.php';\n?>\n\
    ```\n\n因此，可以使用 PHP 打开和关闭到 MySQL 连接。\n\n# 第 3 章：使用 PHP 在 MySQL 中创建数据库和表\n\n在用 MySQL\
    \ 和 PHP 创建并操作特定数据库之前，让我们来看看在 PHP 中与 MySQL 数据库交互而使用的扩展。\n\nPHP 5 及更高版本使用扩展来与 MySQL\
    \ 数据库交互。它们如下：\n\n- 1. MySQli\n- 2. PHP Data Objects (PDO)\n\n2012 年，MySQL 扩展从\
    \ PHP 中移除，尽管它在之前的版本中被使用。MySQLi 和 PDO 都是面向对象的。但 MySQli 还提供了过程化的应用程序接口。\n\n## 使用\
    \ PHP 创建 MySQL 数据库\n\n在 MySQL 中，为了创建数据库，我们使用 `CREATE DATABASE` 语句。\n\n这是一个示例，我们创建一个名为\
    \ 'Our_Customerers' 的数据库：\n\n示例：使用面向对象的 MySQLi 创建数据库\n\n```php\n<?php\n$servername\
    \ = \"localhost\";\n$username = \"root\";\n$password = \"password\";\n// 创建连接\n\
    $conn = new mysqli($servername, $username, $password);\n\n// 检查连接\nif ($conn->connect_error)\
    \ {\n    die(\"Connection failed: \" . $conn->connect_error);\n}\n// 创建数据库\n$sql\
    \ = \"CREATE DATABASE Our_Customerers\";\nif ($conn->query($sql) === TRUE) {\n\
    \    echo \"Database Our_Customerers created successfully\";\n} else {\n    echo\
    \ \"Error creating database: \" . $conn->error;\n}\n$conn->close();\n?>\n```\n\
    \n## 使用 PHP 创建 MySQL 表\n\n为了在 MySQL 中创建表，我们使用 `CREATE TABLE` 语句。这里有一个创建 Customers\
    \ 表的示例：\n\n```php\n<?php\n$servername = \"localhost\";\n$username = \"root\";\n\
    $password = \"password\";\n// 创建连接\n$conn = new mysqli($servername, $username,\
    \ $password);\n\n// 检查连接\nif ($conn->connect_error) {\n    die(\"Connection failed:\
    \ \" . $conn->connect_error);\n}\n\n// 创建表\n$sql = \"CREATE TABLE Customers (\n\
    \  id INT(6) NOT NULL AUTO_INCREMENT PRIMARY KEY,\n  first_name varchar(30) NOT\
    \ NULL,\n  last_name varchar(30) NOT NULL,\n  email varchar(50),\n  address varchar(255),\n\
    \  age int\n)\";\n\nif ($conn->query($sql) === TRUE) {\n    echo \"Table created\
    \ successfully\";\n} else {\n    echo \"Error creating table: \" . $conn->error;\n\
    }\n\n$conn->close();\n?>\n```\n\n## 什么是数据类型？\n\n数据类型无非数据的表示。数据所属的类型。MySQL 中使用的重要数据类型如下。\n\
    \n| 数据类型 | 用途 |\n|---|---|\n| CHAR(y) | 存储长度为 'y' 的字符。长度是固定的。 |\n| VARCHAR(y)\
    \ | 存储长度可为 'y' 的字符。比 CHAR 慢。 |\n| TEXT | 存储字符串值 65535。 |\n| BLOB | 存储二进制大对象。总共\
    \ 65535 字节。 |\n| ENUM(a,b,c...) | 使用此数据类型输入值列表。共有 65535 个值。 |\n| TINYINT(y) |\
    \ 有符号存储 -128 到 127，无符号存储 0 到 255。这里，y 是最大位数。 |\n| SMALLINT(y) | 存储 -32768 到 32767\
    \ 之间的数值。这里，y 是最大位数。 |\n| INT(y) | 存储 -2147483648 到 2147483647 之间的数值。这里，y 是最大位数。\
    \ |\n| BIGINT(y) | 存储 -9223372036854775808 到 9223372036854775807 之间的数值。这里，y 是最大位数。\
    \ |\n| DECIMAL(precision,scale) | 这可以存储大的小数值。可以存储的数字位数称为精度。标无非小数点后放置的数字位数。这里有一个示例：654.123\
    \ 是一个小数点前 3 位、后 3 位的数字。 |\n| FLOAT(precision,scale) | 可以存储较小的分数值。精度意味着可以存储的总数字位数。标意味着小数点后的数字位数。\
    \ |\n| DATE() | 此数据类型存储年、月、日格式。 |\n| TIME() | 存储小时、分、秒格式的时间。 |\n| TIMESTAMP()\
    \ | 可以同时存储日期和时间值。 |\n\n"
