    Next, add code to display() that will cause the values in the buffer to be set
    to the vertex attribute in the shader. We do this with the following three steps:
    (a) make buffer “active” with the glBindBuffer() command as we did above, (b)
    activate the active buffer with a vertex attribute in the shader, and (c) enable
    the vertex attribute. The following three lines of code will outline these steps:


    ```

    glBindBuffer(GL_ARRAY_BUFFER, vbo[0]); // make the 0th buffer "active"

    glVertexAttribPointer(0, 3, GL_FLOAT, false, 0, 0); // associate 0th vertex attribute
    with active buffer

    EnableVertexArray(0); // enable the 0th vertex attribute

    ```


    Now when we execute glDrawArrays(), data in the 0th VBO will be transmitted to
    the vertex attribute that has a layout qualifier with location 0. This sends the
    cube vertices to the shader.


    # 4.2 UNIFORM VARIABLES


    Rendering a scene so it appears 3D requires building appropriate transformation
    matrices, such as those described in Chapter 3, and applying them to each of the
    models’ vertices. It is most efficient to apply the required matrix operations
    in the vertex shader, and it is customary to send these matrices from the Java/JOGL
    application to the shader in a uniform variable.


    Uniform variables are declared in a shader using the “uniform” keyword. The following
    example, declaring variables to hold model-view and projection matrices, will
    be suitable for our cube program:


    ```

    uniform mat4 mv_matrix;

    uniform mat4 proj_matrix;

    ```


    The keyword “mat4” indicates that these are 4x4 matrices. Here we have named the
    variables mv_matrix to hold the model-view matrix and proj_matrix to hold the
    projection matrix. Since 3D transformations are 4x4, mat4 is a commonly used datatype
    in GLSL shader uniforms.'
