  md: '# Chapter 7 · Lighting 171


    The manner in which φ is used to compute the specular contribution depends on
    the desired "shininess" of the object being rendered. Objects that are extremely
    shiny, as a mirror, have very small specular highlights—that is, they reflect
    the incoming light to the eye accurately. Materials that are less shiny have specular
    highlights that are "spread out," and thus more pixels are a part of the highlight.


    Shininess is generally modeled with a falloff function that expresses how quickly
    the specular contribution reduces to zero as the angle φ grows. We can use cos(φ)
    to model falloff, and increase or decrease the shininess by using powers of the
    cosine function, as cos(φ), cos²(φ), cos³(φ), cos^n(φ), and so on, as illustrated
    in Figure 7.6.


    ![](img/2c98d23f81c0609c29ed8f5a139a1e22_191_0.png)


    Figure 7.6

    Shininess modeled as cosine exponent.


    Note that the higher value of the exponent, the faster the falloff, and the smaller
    the specular contribution of pixels with light reflections are off-axis from the
    viewing angle.


    We call the exponent n, as used in cosⁿφ) falloff function, the shininess factor
    for a specified material. Note back in Figure 7.3 that shininess factors for each
    of the materials listed are specific in the rightmost column.


    We can now specify the full specular calculation:


    ```

    I_spec = Light_spec * Material_spec * max(0, (R·V̂))

    ```


    Note that we use the max() function in a similar manner as we did for the diffuse
    computation. In this case, we need to ensure that the specular contribution does
    not utilize negative values for cos(φ), which could produce strange artifacts
    such as "darkened" specular highlights.


    And of course as before, the actual computations involve red, green, and blue
    components.


    # 7.5 IMPLEMENTING ADS LIGHTING


    The computations described in Section 7.4 have so far been mostly theoretical,
    as they have assumed that we can perform them for every pixel. This is'
