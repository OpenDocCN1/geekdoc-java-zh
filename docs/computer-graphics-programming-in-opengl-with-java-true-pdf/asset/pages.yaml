  md: "# Chapter 14 — Other Techniques\n\n# 14.7 NOISE APPLICATION—WOOD\n\nCreating\
    \ a \"wood\" texture can be done in a similar way as was done in the previous\
    \ \"marble\" example. Trees grow in rings, and it is these rings that produce\
    \ the \"grain\" we see in objects of wood. As trees grow, environmental stresses\
    \ create variations in the rings, which we also see in the grain.\n\nWe start\
    \ by building a procedural \"rings\" 3D texture map, similar to the \"checkerboard\"\
    \ from earlier in this chapter. We then use a noise map to perturb those rings,\
    \ inserting dark and light colors into the ring texture map. By adjusting the\
    \ number of rings and the degree to which we perturb the rings, we can simulate\
    \ wood with various types of grain. Shades of green can be made by combining similar\
    \ amounts of red and green, we can then Phong shading with a level of \"shininess\"\
    .\n\nWe generate concentric the Z axis in our 3D texture map by filling the floatDataArray()\
    \ function, using trigonometry to specify values for X and Y that are equidistant\
    \ from the Z axis. We use a sine wave to repeat this process cyclically, raising\
    \ and lowering the red and green components equally based on this sine wave, to\
    \ produce the varying shades of brown. A variable sineValue holds the exact shade,\
    \ which can be adjusted by slightly offsetting one or the other (in this case\
    \ increasing the red by 80 and the green by 30). We can create or fewer rings\
    \ by adjusting the value of xyPeriod. The resulting texture is shown in Figure\
    \ 14.18.\n\n```\nprivate void dataArray(byte data[])\n double xyPeriod = 40.0;\n\
    \ for (int i=0; i<noiseHeight; i++) {\n  for (int j=0; j<noiseWidth; j++) {\n\
    \    for (int k=0; k<noiseDepth; k++) {\n      double xValue = (i - (double)noiseWidth/2.0)\
    \ / (double)noiseWidth;\n      double yValue = (j - (double)noiseHeight/2.0) /\
    \ (double)noiseHeight;\n      double distanceFromZ = Math.sqrt(xValue* xValue+\
    \ yValue* yValue);\n      double sineValue = 128.0*Math.abs(sin(2.0*xyPeriod*\
    \ distanceFromZ*3.14159));\n      Color c = new Color((int)(0+(int)sineValue),(int)(30+(int)sineValue),0);\n\
    \      data[i*noiseHeight*noise4 + j*noiseDepth*4 + k*4+0] = (byte)c.getRed();\n\
    \      data[i*noiseHeight*noise4 + j*noiseDepth*4 + k*4+1] = (byte)c.getGreen();\n\
    \      data[i*noiseHeight*noise4 + j*noiseDepth*4 + k*4+2] = (byte)c.getBlue();\n\
    \      data[i*noiseHeight*noise4 + j*noiseDepth*4 + k*4+3] = (byte) 255);\n  \
    \  }\n  }\n}\n```"
