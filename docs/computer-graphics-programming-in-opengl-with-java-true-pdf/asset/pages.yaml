    A commonly used algorithm for PCF is a sample near texels per pixel, with the
    samples selected at offset distances from the texel which corresponds to the pixel.
    As we process pixel, we alter the offsets used to determine which four texels
    are sampled. Altering the offsets in a staggered manner is sometimes called dithering,
    and to make the soft boundary appear less “blocky” than it ordinarily would give
    the small number of sample points.


    A common approach is to assume one of four offset patterns—we can choose which
    pattern to use for a given pixel by computing the pixel''s glFragCoord mod 2.
    Recall that the result of the mod computation is then one of four values: (0,0),
    (0,1), (1,0), or (1,1). We use this to select one of our four offset patterns
    in the texture space (i.e., in the shadow map).


