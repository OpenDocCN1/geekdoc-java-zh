    **Figure 4.11**

    Animated planetary system.

    Source: Sun and earth textures are from [HT16]; the moon texture is from [NA16].


    It turns out that we can do this fairly easily with a matrix stack. A matrix stack
    is, as its name implies, a stack of transformation matrices. As we will see, matrix
    stacks make it easy to create and manage complex hierarchical objects and scenes,
    where transforms can be built upon (and removed from) other transforms.


    OpenGL has a built-in matrix stack, but has long been deprecated. The older fixed-function
    (nonprogrammable) pipeline was nicely devised and convenient to use, and happily
    a similar Java class is available in JML, called Matrix4fStack, patterned after
    the one that became popular in older versions of OpenGL. As we will see, many
    of the model, view, and model-view matrices that normally be needed in a complex
    scene can be replaced by a single instance of Matrix4fStack.


    We will examine the basic commands for instantiating and utilizing a matrix stack,
    then use Matrix4fStack to build a complex animated scene. Some important Matrix4fStack
    functions include the following:


    +   - pushMatrix()—makes a copy of the top matrix and pushes the copy onto the
    stack

    - popMatrix()—removes and returns the top matrix

    - get(v)—copies values in topmost matrix to buffer v and returns a reference to
    the buffer (topmost matrix is not removed from the stack)

    - rotate(x,y,z)—apply directly to the top matrix in the stack

    - scale(x,y,z)—apply directly to the top matrix in the stack

    - translate(x,y,z)—apply directly to the top matrix in the stack'
