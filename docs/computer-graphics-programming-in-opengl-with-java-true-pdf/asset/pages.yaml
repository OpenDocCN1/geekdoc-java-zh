    \ over which the output color transitions from object color to fog, and can be\
    \ tuned to meet the needs of the scene. The percentage of fog mixed with the object\
    \ color is calculated in the variable fogFactor, which is the ratio of how close\
    \ the vertex is to fogEnd to the total length of the transition region. The GLSL\
    \ clamp() function is used to restrict this ratio to being between the values\
    \ 0.0 and 1.0. The GLSL mix() function returns a weighted average of fog color\
    \ and object color, based on the value of fogFactor. Figure 14.2 shows the addition\
