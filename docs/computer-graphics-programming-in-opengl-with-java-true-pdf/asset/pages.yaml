    "outer" levels—by assigning values to the reserved named gl_TessLevelxxx. This
    is for tessellating a rectangular grid of triangles, called a quad.³ The levels
    tell the tessellator how to subdivide the grid when forming triangles, and are
    arranged as shown in Figure 12.3.


    Note the line in the control shader that says layout (vertices=1) out;


