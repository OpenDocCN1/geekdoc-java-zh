  md: '# Chapter 2 · The OpenGL Graphics Pipeline 29


    That is, the GLCanvas has its own display() function. If we call it, the GLCanvas
    will then in turn call back the display() function in your Java/JOGL application.
    Technically, the two display()s are completely different functions, but they are
    intertwined.


    One approach is to call display() whenever a change in the scene occurs. In a
    complex scene, this can become unwieldy. A better approach is to make this call
    repeatedly, without regard to whether or not anything in the scene has changed,
    and have our display() function alter what it draws over time. While this may
    at first seem inconvenient, it actually leads to a more efficient and responsive
    program. Each rendering of our scene is then called a *frame*, and the frequency
    of calls to display() is the *frame rate*.


    There are many ways to organize the code for animating a scene. One way is to
    create an "animator" class in Java, using either Timer, or Thread.sleep(), or
    better yet, a *ScheduledThreadPoolExecutor*.


    An even simpler way to build the animator is to use one of the JOGL-specific animators:


    +   * Animator

    * FPSAnimator


    These classes are designed specifically for animating 3D scenes. An FPSAnimator
    ("frames per second"), when instantiated, calls the display() function on a drawable
    object repeatedly, at a specified frame rate. An Animator ("FPS"), when instantiated,
    calls the display() function repeatedly, but not at any particular frame rate.
    The developers of JOGL recommend using Animator (instead of FPSAnimator), and
    handling the rate of movement within the application logic based on the elapsed
    time since the previous frame. Hence that how we will write our programs that
    are animated.


    An example is shown in Program 2.6. We will move the triangle from Program 2.5
    and animate it that it moves to the left, back and forth. The Animator is instantiated
    by the Java/JOGL application in its constructor; the parameter on the Animator
    constructor call specifies the drawable object. After that, the application is
    free to make changes to the scene within the display() function. In this example,
    we don''t consider the elapsed time, so the triangle may move more or less quickly
    depending on the speed of the computer (in future examples, we will use the elapsed
    time to ensure that they run at the same speed regardless of the computer).'
