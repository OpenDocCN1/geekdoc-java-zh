  md: 'The wood rings in Figure 14.18 are a good start, but they don''t look very
    realistic—they are too perfect. To improve this, we use the noise map (more specifically,
    turbulence) to perturb the distanceFromZ variable so that the rings have slight
    variations. The computation is as follows:


    ```

    distanceFromZ = Math.sqrt(xValue *xValue + yValue *yValue)

    ```


    Again, the variable turbPower adjusts how much turbulence is applied (setting
    it to 0.0 results in the unperturbed version shown in Figure 14.18), and maxZoom
    specifies the zoom value (32 in this example). Figure 14.19 shows the resulting
    wood textures for turb-Power values 0.05, 1.0, and 2.0 (left to right).


    ![](img/2c98d23f81c0609c29ed8f5a139a1e22_360_0.png)


    **Figure 14.18**

    Creating rings for 3D texture.


    We can now apply the 3D texture map to a model. The realism of the texture can
    be further enhanced by applying a rotation to the originalPosition vertex locations
    used for texture coordinates; this is because most items carved out of wood don''t
    perfectly align with the


    orientation of rotating the texture coordinates. To accomplish this, we send an
    additional rotation matrix to the shaders. also add Phong shading, with appropriate
    wood-color ADS values, and a modest level of shininess. The complete additions
    and changes for creating a “wood dolphin” are shown in Program 14.6.


    ![](img/2c98d23f81c0609c29ed8f5a139a1e22_360_1.png)


