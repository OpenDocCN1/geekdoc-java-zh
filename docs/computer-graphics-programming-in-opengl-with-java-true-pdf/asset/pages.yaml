  md: '# B.2.3 Compiling and Running a Program


    To compile a program, open a terminal window, navigate to the parent folder of
    the .java files (if using the code on the accompanying CD, you can recognize this
    parent folder because it contains compile.bat and run.bat files intended for use
    with a PC) and type


    ```

    javac code.java

    ```


    To run your compiled program, type


    ```

    java code.Code

    ```


