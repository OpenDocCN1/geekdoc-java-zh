  md: 'Vector4f, respectively. In some cases (as we will see), JOML adds the fourth
    element (set to 1.0) to a Vector3f when needed to carry out a homogeneous operation.


    # 3.3 MATRICES


    A matrix is a rectangular array of values, and its elements are typically accessed
    by means of subscripts. The first subscript refers to the row number, and the
    second subscript refers to the column number, with the subscripts starting at
    0. Most of the matrices that we will use for 3D graphics computations are of size
    4x4, as shown in Figure 3.2.


    ![](img/2c98d23f81c0609c29ed8f5a139a1e22_59_0.png)


    The GLSL includes a data type called mat4 that can be used for storing 4x4 matrices.
    Similarly, JOML includes a class Matrix4f for instantiating and storing 4x4 matrices.


    The identity matrix contains all zeros, except along the diagonal:


    ![](img/2c98d23f81c0609c29ed8f5a139a1e22_59_1.png)


    Any item multiplied by the identity matrix remains unchanged. In JOML, the identity
    matrix is available through the function Matrix4f.identity().


    The transpose of a matrix is computed by interchanging its rows and columns. For
    example:


    ![](img/2c98d23f81c0609c29ed8f5a139a1e22_59_2.png)'
