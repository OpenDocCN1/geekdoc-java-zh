  md: '# 262 Computer Graphics Programming in OpenGL with Java, Second Edition


    By introducing a parameter t, we can build a system of parametric equations that
    define a curve. The t represents a fraction of the distance along the line segment
    connecting one to the next control point. Values for t are within the range [0.1]
    for points along the segment. Figure 11.2 shows such a value, t=0.75, applied
    to the lines connecting $p_0$-$p_1$ and $p_1$-$p_2$, respectively. Doing this
    defines new points $p_{01}(t)$ and $p_{12}(t)$ along the two original lines. We
    repeat this process for the line segment connecting the two new points $p_{01}(t)$
    and $p_{12}(t)$ producing point $P(t)$ where $t=0.75$ along the line $p_{01}(t)$-$p_{12}(t)$.
    $P(t)$ is one of the points on the resulting curve, and for reason reason is denoted
    with a capital $P$.


    ![](img/2c98d23f81c0609c29ed8f5a139a1e22_282_0.png)


    ![](img/2c98d23f81c0609c29ed8f5a139a1e22_282_1.png)


    Collecting many points P(t) for various values of t generates a curve, as shown
    in Figure 11.3. The more parameter values for t that are sampled, the more points
    P(t) are generated, and the smoother the resulting curve.


    The analytic definition for a quadratic Bézier curve can now be derived. First,
    we note that an arbitrary point $p$ on the line segment $p_a$-$p_b$ connecting
    two points $p_a$ and $p_b$, can be represented in terms of the parameter t follows:


    ```

    $p(t) = p_a + (1 - t)p_b$

    ```


    Using this, we find the points $p_{01}$ and $p_{12}$ (on points $p_0$-$p_1$ and
    $p_1$-$p_2$) as follows:


    ```

    $p_{01}(t) = tp_1 + (1 - t)p_0$

    p_{12}(t) = tp_2 + (1 - t)p_1$

    ```


    Similarly, a point on the connecting segment between these points would be


    ```

    $P(t) = tp_{12}(t) + (1 - t)p_0$

    ```'
