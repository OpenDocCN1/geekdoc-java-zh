    # A.1 INSTALLING THE LIBRARIES AND\DEVELOPMENT ENVIRONMENT


    # A.1.1 Installing Java


    To use Java for the examples in this book, you will need both the JRE (Java Runtime
    Environment) and the JDK (Java Development Kit). To install them, Oracle’s download
    site, http://www.oracle.com/technwork/java, and click the “Java SE” (Standard
    Edition) link under Software Downloads. From there you can find instructions for
    downloading the latest JDK, which includes both the Java compiler and the JRE.
    We assume that the reader is experienced with programming in Java and is using
    at version 8.


    # A.1.2 Installing OpenGL/GLSL


    It is not necessary to “install” OpenGL or GLSL, but it is necessary to ensure
    that your graphics card supports at least version 4.3 of OpenGL. If you do not
    know'
