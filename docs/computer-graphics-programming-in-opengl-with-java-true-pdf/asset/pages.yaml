  md: 'code. Simply run an existing program with Nsight enabled. Nsight allows examining
    shaders at runtime, such as seeing the current contents of a shader''s uniform
    variables. It also enables seeing the C calls being made by a JOGL-wrapped program.


    There are versions of Nsight for Windows and for Linux/MacOS, including versions
    that run under Microsoft''s Visual Studio and under the Eclipse IDE. As of this
    writing the Eclipse version of Nsight does not appear to provide graphics debugging
    support for Java-based programs, so we restrict our discussion to the Windows
    Studio-based version, which can be made to work with Java/JOGL.


    The Visual Studio (VS) version of Nsight was originally developed for developing
    shaders under control of application code written in C++. However, it is possible
    to get it to work with Java programs as. To do this, the C++ must first be installed
    in VS. This plugin allows invoking an "external program" written in a different
    language—e.g., Java. The approach we take is set up VS as if it was going to run
    C++ code, instead have invoke your Java/JOGL application as an "external programm."


    Nsight works only with NVIDIA graphics cards; it won''t work with Intel or AMD
    graphics cards. A complete list of supported cards is available on the NVIDIA
    website [NS18].


    # C.2 SETTING UP NSIGHT FOR JOGL


    Setting up Nsight for JOGL is surprisingly easy. Our instructions are based on
    version 5.3 of Nsight.


    If you''t already done so, install Visual Studio (VS), such as Visual Studio 2017
    Community. Be sure to include the C++ core compiler. Note that Visual Studio installation
    can be notoriously slow. Visual Studio 2017 is available at https://www.visualstudio.com/downloads.


