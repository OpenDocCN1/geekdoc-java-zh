  md: 'For example, if the source pixel is red, with 75% opacity ([1, 0, 0, 0.75])
    and the destination pixel contains completely opaque green ([0, 1, 0, 1]), then
    the result placed in the frame buffer would


    ```

    srcPixel * srcAlpha = [0.75, 0, 0, 0.5625]

    destPixel * (1-srcAlpha) = [0, 0.25, 0, 0.25]

    resulting_pixel = [0.75, 0.25, 0, 0.8125]

    ```


    That is, predominantly red, with some green, and mostly solid. The overall effect
    of the settings is to let the destination show through by an amount corresponding
    to the source pixel''s transparency. In this example, the pixel in the frame buffer
    is green, and the incoming pixel is red with 25% transparency (75% opacity). Some
    green is allowed to show through the red.


    It turns out that these settings for blend function and blend equation work in
    many cases. Let''s apply them to a practical example in a scene containing two
