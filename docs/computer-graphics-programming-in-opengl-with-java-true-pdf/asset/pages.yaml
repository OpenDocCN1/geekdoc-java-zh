  md: '# 8.7.2 Generating Soft Shadows—Percentage Closer Filtering (PCF)


    There are various ways of simulating the penumbra effect to generate soft shadows
    in software. One of the simplest and most common is called percentage closer filtering
    (PCF). In PCF, we sample the shadow texture at surrounding locations to estimate
    what percentage of nearby locations are in shadow. Depending on how many of the
    nearby locations are in shadow, we increase or decrease the degree of lighting
    contribution for the pixel being rendered. The entire computation can be done
    in the fragment shader, and that is the only place where we have to change any
    of the code. PCF also can be used to reduce jagged artifacts.


