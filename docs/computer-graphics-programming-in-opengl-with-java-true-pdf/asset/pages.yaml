    as “out”; this means they send their values forward to the next stage in the pipeline.
    For example, the following declaration in a vertex shader specifies a vertex attribute
    named “color” that outputs a vec4:


    ```

    out vec4 color;

    ```


    It is not necessary to declare an “out” variable for the vertex positions, because
    OpenGL has a built-in out vec4 variable gl_Position for that purpose. In the vertex
    shader, we apply the matrix transformations to the incoming vertex (declared earlier
    as position), assigning the result to gl_Position:


    ```

    gl_Position = proj_matrix * mv_matrix * position;

    ```


    The transformed vertices will then be automatically output to the rasterizer,
    with corresponding pixel locations ultimately sent to the fragment shader.


    The rasterization process is illustrated in Figure 4.2. When specifying GL_TRIANGLES
    function, rasterization is done per triangle. Interpolation starts along the lines
    connecting the vertices, at a level of precision corresponding to the pixel display
    density. The pixels in the interior space of the triangle are then filled by interpolating
    the horizontal lines connecting the edge pixels.


