    It turns out that, in this case, it is not necessary to compute θ itself. What
    we really is cos(θ), and recall from Chapter 3 that this can be found using the
    dot product. Thus, the diffuse contribution can be computed as:


    ```

    $I_{diffuse} = Light_{diffuse} * Material_{diffuse} *(\vec{N} \cdot \vec{L})$

    ```


    The diffuse contribution is only relevant when the surface is exposed to the light,
    which occurs when -90 < θ < 90—that is, cos(θ) > 0. Then we must replace the right
    term above with


    ```

    $max((\vec{N} \cdot \vec{L}), 0)$

    ```


    Specular contribution determines whether the pixel rendered should be brightened
    because it is part of a “specular highlight.” It involves not only the angle of
    incidence of the light source but also the angle between the reflection of the
    light on the surface and the viewing angle of the “eye” relative to the object’s
    surface.


    ![](img/2c98d23f81c0609c29ed8f5a139a1e22_190_0.png)


    **Figure 7.5**

    View angle incidence.


    In Figure 7.5, $\vec{R}$ represents the direction of reflection of the light,
    and $\vec{V}$ (called the view vector) is a vector from the pixel to the eye.
    Note that $\vec{V}$ is the negative of the vector from the eye to the pixel (in
    camera space, the eye is at the origin). The smaller the angle $\varphi$ between
    $\vec{R}$ and $\vec{V}$, the more the eye is on-axis, or “looking into” the reflection,
    and the more this pixel contributes to the specular highlight (and thus the brighter
    it should appear).'
