  md: 'xiv Preface


    artifacts, and so users are likely to use them frequently, even when soft shadows
    aren''t necessary. We also added a new section in Chapter 13 (on geometry), showing
    how to generate or fur by using a geometry shader to change primitive types.


    Almost immediately after our first edition was released, we were asked how to
    run the programs on a Macintosh. After getting all of the examples running on
    a Mac, we published the steps on our website. That information has become an additional
    appendix in this edition. In fact, for this edition, we have moved all installation
    details into appendices.


    We also added an appendix using NVIDIA''s Nsight graphics debugger. The first
    time we saw this tool we were blown away and wanted to include it in our book.
    Nsight was developed for use with C++, but after some experimentation—and much
    appreciated help from NVIDIA—we were able to get it to work with Java/JOGL. We
    are delighted to include it in this second edition.


    We made numerous corrections—and hope—improvements. The chapter on skyboxes is
    largely rewritten, for example. Throughout the book, much of the code has been
    restructured, so by moving reused functions into a separate utility module. We
    also went through the entire book and spruced up the quality and resolution of
    the figures.


    # Intended Audience


    This book is targeted at students of computer science. This could mean undergraduates
    pursuing a BS degree, but it could also mean anyone who studies computer science.
    As such, we are assuming that the reader has at least a solid background in object-oriented
    programming, at the level of someone who is, say, a computer science major at
    the junior or senior level.


    There are also some specific things that we use in this book but don''t cover
    because we assume the reader already has sufficient background, including the
    following:


    +   - Java and its Abstract Window Toolkit (AWT) or Swing library, especially
    for GUI-building

    - Java configuration details, such as manipulating the CLASSPATH

    - event-driven programming

    - basic math algebra and trigonometry

    - awareness of color models, such as RGB, RGBA, etc.'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'Preface xv


    The audience for this new second edition is also hoped to be expanded by the release
    of its "sister" textbook, Computer Graphics Programming in OpenGL with C++. In
    particular, we envisage the possibility of a learning environment where students
    are free to utilize Java or C++ in the same classroom, selecting one or the other
    book. The two texts cover the material sufficiently in lockstep that we believe
    conducting a course in this manner should be possible.


    # # How to Use This Book


    This book is designed to be read from front to back. That is, material in later
    chapters frequently relies on information learned in earlier chapters. So it probably
    won''t work to jump back and forth in the chapters; work your way forward through
    the material.


    This book is intended mostly as a practical, hands-guide. While there is plenty
    of theoretical material included, the reader should treat this as a sort of "workbook,"
    in which you learn basic concepts by programming yourself. We have provided code
    for all of the examples, but to really learn the concepts you want to "play" with
    those examples—extend them to help build your 3D scenes.


    At the end of each chapter are a few problems to solve. Some are very simple,
    involving making simple modifications to the modified code. The problems that
    are marked "PROJECT," however, are expected to take some time to solve and require
    writing significant amount of code, or combining techniques from various examples.
    There are also a few marked "RESEARCH" that encourage independent study because
    this textbook doesn''t provide sufficient detail to solve them.


    OpenGL, whether made in C or Java in JOGL, often involve long lists of parameters.
    While writing this book, the authors decided whether or not to, in each case describe
    all of the parameters. We decided that at the very beginning we describe every
    detail. As the topics progress, we decided to avoid getting bogged down in every
    piece of minutiae in the OpenGL calls (and there are many), for fear of the reader
    losing sight of the big picture. For this reason, it is essential when working
    through the examples to have access to reference material for Java, OpenGL, and
    JOGL.


    For this, there are a number of excellent reference sources that we recommend
    using in conjunction with this book. The Javadocs for Java and JOGL are absolutely
    essential, and can be accessed online or downloaded. The reader should bookmark
    them for easy access in a browser, and expect to access them continuously for
    looking up items'
  merge: -1
