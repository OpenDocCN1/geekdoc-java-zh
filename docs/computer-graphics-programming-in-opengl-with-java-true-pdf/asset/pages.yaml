    Light affects the appearance of our world in varied and sometimes dramatic ways.
    When a flashlight shines on an object, we expect it to appear brighter on the
    side facing the light. The earth on which we live is itself brightly lit where
    it faces the sun at noon, but as it turns, daytime brightness gradually fades
    into evening, becoming completely dark at midnight.


    Objects also respond differently to light. Besides having different colors, objects
    can have different reflective characteristics. Consider two objects, both green,
    but one is made of cloth versus the other made of polished steel—the latter will
    appear “shiny”.


    # 7.1 LIGHTING MODELS


    Light is the product of photons being emitted by high energy sources and subsequently
    bouncing around until some of the photons reach our eyes. Unfortunately, it is
    computationally infeasible to emulate this natural process, as would require simulating
    and then tracking the movement of a huge number of photons, adding many objects
    (and matrices) to our scene. What we need is a lighting model.'
  merge: -1
  pgno: 181
- img_proc: true
  md: 'Lighting models are sometimes called shading models, although in the presence
    of shader programming, that can be a bit confusing. Sometimes the reflection model
    is used, complicating the terminology further. We will try to stick to whatever
    terminology is simplest and most practical.


    The most common lighting models today are called “ADS” models, because they are
    based on three types of reflection labeled A, D, and S:


    +   - Ambient reflection simulates a low-level illumination that equally affects
    everything in the scene.

    - Diffuse reflection brightens objects to various degrees depending on the light''s
    angle of incidence.

    - Specular reflection conveys the shininess of an object by strategically placing
    a highlight of appropriate size on the object''s surface where light is reflected
    most directly towards our eyes.


    ADS models can be used to simulate different lighting effects and a variety of
    materials.


    ![](img/2c98d23f81c0609c29ed8f5a139a1e22_182_0.png)


    Figure 7.1 illustrates the ambient, diffuse, and specular contributions of a positional
    light on a shiny gold sphere.


    Figure 7.1 ADS Lighting contributions.


    Recall that a specular is ultimately drawn by the fragment shader output a color
    for each pixel on the screen. Using an ADS lighting model requires specifying


    contributions due to lighting on a pixel''s RGBA output value. Factors include
    the following:


    +   - the type of light source and its ambient, diffuse, and specular characteristics

    - the object material''s ambient, diffuse, and specular characteristics

    - the object material''s specified “shininess”

    - the angle at which the light hits the object

    - the angle from which the scene is being viewed'
  merge: -1
