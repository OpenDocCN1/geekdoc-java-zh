  md: '# Computer Graphics Programming in OpenGL with Java, Second Edition


    Some of the code we will will be in Java, with JOGL calls, and some will be written
    in GLSL. Our Java/JOGL application will work with our GLSL modules and the hardware
    to create our 3D graphics. Once our application is complete, the end user will
    interact with the Java application.


    ![](img/2c98d23f81c0609c29ed8f5a139a1e22_26_0.png)


    Figure 2.1 Overview of a JOGL-based graphics application.


    GLSL is an example of a shader language. Shader languages are intended to run
    on a GPU in the context of a graphics pipeline. There are other shader languages,


    such as HLSL, which works with Microsoft''s 3D framework DirectX. GLSL is the
    specific shader language that is compatible with OpenGL, and thus we will write
    shader code in GLSL, in addition to our Java/JOGL application code.


    For the rest of this chapter, we will take a brief ''tour'' of the OpenGL pipeline.
    The reader is not expected to understand every detail thoroughly, but just to
    get a feel for how the stages work together.


    # 2.1 THE OPENGL PIPELINE


    Modern 3D graphics programming utilizes a pipeline, in which the process of converting
    a 3D scene to a 2D image is broken down into a series of steps. OpenGL and DirectX
    utilize similar pipelines.


    A simplified overview of the OpenGL graphics pipeline is shown in Figure 2.2 (not
    every stage is shown, the major ones we will study). The Java/JOGL application
    sends data into the vertex shader, processing proceeds through the pipeline, and
    pixels emerge for display on the monitor.


    The stages shaded in blue (vertex, tessellation, geometry, and fragment) are programmable
    in GLSL. It is one of the responsibilities of the Java/JOGL application to load
    GLSL programs into these shader stages, as follows:


    +   It uses Java to obtain the GLSL shader code, either from text files or hardcoded
    as strings.'
