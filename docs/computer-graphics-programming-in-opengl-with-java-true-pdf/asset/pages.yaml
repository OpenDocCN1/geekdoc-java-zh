  md: 'The set of generated points that comprise a Bézier surface is sometimes called
    a patch. The term patch can sometimes be confusing, as we will see later when
    we study tessellation shaders (useful for actually implementing Bézier surfaces).
    There, it the grid of control points that is typically called a “patch.”


    # 11.4 CUBIC BÉZIER SURFACES


    Moving from quadratic to cubic surfaces requires utilizing a larger mesh—4x4 rather
    than 3x3. Figure 11.10 shows an example of a 16-control-point mesh (in blue) and
    the corresponding curved surface (in red).


    ![](img/2c98d23f81c0609c29ed8f5a139a1e22_288_0.png)


    **Figure 11.10**ncubic Bézier control mesh and corresponding surface.


    As before, we can derive the formula for points P(u,v) on the surface by combining
    the associated blending functions for cubic Bézier curves:


    ```

    $P(u,v) = \sum_{i=0}^{3} \sum_{j=0}^{3} P_{i,j} B_i(u) B_j(v)$

    ```


    where


    $B_0(u) = (1-u)^3$

    $B_1(u) = 3u-6u^2+2u^3$

    $B_2(u) = -3u^3+3u^2$

    $B_3(u) = u^3$


    $B_0(v) = (1-v)^3$

    $B_1(v) = 3v-6v^2+2v^3$

    $B_2(v) = -3v^3+3v^2$

    $B_3(v) = v^3$


    Rendering Bézier surfaces can also be done with recursive division [AS14], by
    alternately splitting the surface in half along each dimension, as shown in Figure
    11.11. Each subdivision produces four new control point meshes, each containing
    16 points, which define one quadrant of the surface.


    When rendering Bézier curves, we stopped subdividing the curve “straight enough.”
    For Bézier surfaces, we stop recursing when the surface is “flat enough.” One
    way of doing this is to ensure that all of the recursively generated'
  merge: -1
  pgno: 288
- img_proc: true
  md: '![](img/2c98d23f81c0609c29ed8f5a139a1e22_289_0.png)


    points in a subquadrant mesh are within some small allowable distance from a plane
    defined by three of the four corner points of that mesh. The distance between
    a point $(x,y,z)$ and a plane $(A,B,C,D)$ is


    ```

    $d = abs\left| \frac{Ax + By + Cz + D}{\sqrt{A^2 + B^2 + C^2}} \right|$

    ```


    If $d$ is less than some sufficiently small tolerance, then we stop subdividing,
    and simply use the four corner control points of the subquadrant mesh to draw
    two triangles.'
