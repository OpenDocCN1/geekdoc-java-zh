    As described in Chapter 1, there are number of installation and setup steps that
    must be accomplished in order to use OpenGL and Java on your machine. These steps
    vary depending on which platform you wish to use. The code samples in this book
    are designed to be run on a PC (Windows); this appendix provides step-by-step
    detailed setup instructions for the Windows platform. For information on setting
    up and running the code samples on a Mac see “Appendix B: Installation and Setup
