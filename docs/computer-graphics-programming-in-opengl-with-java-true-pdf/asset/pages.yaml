    Java has two types of buffers: direct and non-direct. For performance reasons,
    direct buffers should be used in JOGL applications. JOGL provides tools in the
    class com.jogamp.common.nio.Buffers that facilitate the use of direct buffers.
    In the example above, the JOGL function newDirectBuffer() copies values from an
