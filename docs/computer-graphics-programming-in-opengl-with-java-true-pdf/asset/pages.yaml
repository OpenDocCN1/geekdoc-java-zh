    to compute the blend function result. There are a few blend functions that are
    not listed above (not described here).


    The possible options for the glBlendEquation() parameter (i.e., mode) are as


    | mode | blended color |

    | --- | --- |

    | GL_FUNC_ADD | result = source_{RGBA} + destination_{RGBA} |

    | GL_FUNC_SUBTRACT | result = source_{RGBA} - destination_{RGBA} |

    | GL_FUNC_REVERSE_SUBTRACT | result = destination_{RGBA} - source_{RGBA} |

    | GL_MIN | result = min(source_{RGBA}, destination_{RGBA}) |

    | GL_MAX | result = max(source_{RGBA}, destination_{RGBA}) |


    The glBlendFunc() defaults to (1.0) for srcFactor and GL_ZERO (0.0) for destFactor.
    The default for glBlendEquation() is GL_FUNC_ADD. Thus, by default, the source
    pixel is unchanged (multiplied by 1), the destination pixel is scaled to 0, and
    the two are added—meaning that the source becomes the frame buffer color.


    There are also the commands glEnable(GL_BLEND) and glDisable(GL_BLEND), which
    can be used to tell OpenGL to apply the blending or to ignore it.


    We won''t illustrate the effects of all of these here, but we will walk through
    some illustrative examples. Suppose we specify the following settings in the Java/JOGL
    application:


    +   - glBlendFunc(GL_SRC_ALPHA, GL_ONE_MINUS_SRC_ALPHA)

    - glBlendEquation(GL_FUNC_ADD)


    Compositing would proceed as follows:


    +   1. The source pixel is scaled by its alpha value.

    2. The destination pixel is scaled by 1-srcAlpha (the source transparency).

    3. The pixel values are added together.'
