  md: '4. Deciding on appropriate 3D texture coordinates for the object vertices


    5. Texturing the object in the fragment shader using an appropriate sampler


    Texture coordinates for 3D textures range from 0 to 1, in the same manner as 2D
    textures.


    Interestingly, step 4 (determining 3D texture coordinates) is usually a lot simpler
    than one might initially inspect. This is because (in the case of 2D textures),
    since a 3D object was being textured with a 2D image, we needed to decide how
    to “flatten” the 3D object’s vertices (as by UV mapping) to create texture coordinates.
    When 3D texturing, both the object and the texture are of the same dimensionality
    (three). In most cases, we want the object to reflect the texture pattern, as
    if it were “carved” out of it (or dipped into it). So the vertex locations themselves
    serve as the texture coordinates! Usually all that is necessary is apply some
    simple scaling to ensure that the object’s location coordinates map to the 3D
    texture coordinates'' range [0..1].


    Since we are generating the 3D texture procedurally, we need a way of constructing
    an OpenGL texture map out of generated data. The process for loading data into
    a texture is similar to what we saw earlier in Section 5.12. In this case, we
    fill a 3D array with color values, and then copy them into a texture object.


