  md: '# 300 Computer Graphics Programming in OpenGL with Java, Second Edition


    shader can manipulate one primitive at a time, we usually mean that the shader
    has access to all vertices of a triangle at time. Geometry shaders allow you to


    +   - access all vertices in a primitive at once,

    - output the same primitive unchanged, or

    - output the same primitive with modified vertex locations, or

    - output a different type of primitive, or

    - delete the primitive (not output it at all).


    Similar to the tessellation evaluation shader, incoming vertex attributes are
    accessible in a geometry shader as arrays. However, in a geometry shader, incoming
    attribute arrays are indexed only up to the primitive size. For example, if the
    primitives are triangles, then the available indices are 0, 1, and 2. Accessing
    the vertices themselves is done using the predefined array gl_in, as follows:


    ```

    gl_in[2].gl_Position // position of the 3rd vertex

    ```


    Also similar to the tessellation evaluation shader, the geometry shader''s output
    vertex attributes are all scalars. That is, the output is a stream of individual
    vertices (their positions and other attribute variables, if any) that form primitives.


    There is a layout qualifier used to set the primitive input/output types to the
    output size.


    The special GLSL command EmitVertex() specifies that a vertex is to be output.
    The special GLSL command EndPrimitive() indicates the completion of building a
    particular primitive.


    The built-in variable gl_PrimitiveID is available and holds the ID of the current
    primitive. The ID numbers start at 0 and count up to the number of primitives
