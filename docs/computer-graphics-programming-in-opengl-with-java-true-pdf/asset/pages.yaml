    # SUPPLEMENTAL NOTES


    One of the appeals of geometry shaders is that they are relatively easy to use.
    Although many applications for which geometry shaders are used could be achieved
    using tessellation, the mechanism of geometry shaders often makes them easier
    to implement and debug. Of course, the relative fit of geometry versus tessellation
    depends on the particular application.


    Generating convincing hair or fur is challenging, and there is a wide range of
    techniques depending on the application. In some cases, simple texturing is adequate
    and the use of tessellation or geometry shaders such as the basic technique shown
    in this chapter. When greater realism is required, movement (animation) and lighting
    become tricky. Two dedicated tools for hair and fur generation are HairWorks which
    is part of the NVIDIA GameWorks suite [GW18] and TessFX was developed by AMD [TR18].
    The former works with OpenGL and DirectX, whereas the latter works only with DirectX.
    Examples of using TessFX can be found in [GP14].'
