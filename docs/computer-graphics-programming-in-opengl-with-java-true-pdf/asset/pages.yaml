    Using OpenGL to render 3D images generally involves sending datasets through the
    OpenGL shader pipeline. For example, to draw a simple 3D object as a cube, you
    will need to at least send the following items:


    +   - the vertices for the cube model

    - some transformation matrices to control the appearance of the cube''s orientation
    in 3D space


