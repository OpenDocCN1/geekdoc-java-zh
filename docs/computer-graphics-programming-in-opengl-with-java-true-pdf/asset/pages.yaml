  md: 'invoked (called back) by OpenGL, or (b) by calling GLContext.getCurrentGL()
    as done in Program 2.1. Obtaining the current GL4 object is important because,
    in general, any OpenGL function described in the OpenGL documentation can be called
    by preceding it with the name of the appropriate GL4 object (such as "gl").


    The parameter references a "Glbitfield" called "GL_COLOR_BUFFER_BIT"; OpenGL has
    many defined constants (some of them called enums), and this one refers to the
    color buffer that contains the pixels as they are rendered. OpenGL has several
    buffers, and this command clears all of them—that is, it fills them with a predefined
    color called the "clear color." Note that "color" in this context doesn''t mean
    a "color that is clear"; rather, it refers to the color that is applied when a
    buffer is reset (cleared).


    Immediately before the call to glClear() is the call to gl(). Again, this specifies
    the value placed in the elements of a color buffer when it is cleared. (1,0,0,1),
    which corresponds to the RGBA color red. If a "clear color" isn''t specified,
    the default value is black.


    Finally, besides display() and init(), we must implement reshape() and dispose().
    The reshape() function is called when a GLCanvas is resized, and dispose() is
    called when the application exits. In Program 2.1 we left both empty.


    # 2.1.2 Vertex and Fragment Shaders


    Our first OpenGL program didn''t actually draw anything—it simply filled the color
    buffer with a single color. To actually draw something, we need to include a vertex
    shader and a fragment shader.


    You may be surprised to learn that OpenGL is capable of drawing only a few kinds
    of very simple things, as points, lines, or triangles. These simple things are
    called primitives, and for this reason, 3D models are made up of lots and lots
    of primitives, usually triangles.


    Primitives are made up of vertices—for example, a triangle consists of three vertices.
    The vertices can come from a variety of sources—they can be read from files and
    then loaded into buffers by the Java/JL application, or they can be hardcoded
    in the Java code or even in the GLSL code.'
