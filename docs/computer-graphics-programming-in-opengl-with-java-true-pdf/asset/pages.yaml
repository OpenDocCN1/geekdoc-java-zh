  md: 'complicated by the fact that normal (N) vectors are typically available to
    use only for the vertices that define the model, not for each pixel. Then we need
    to either compute normals for each pixel, which could be time-consuming, or find
    some way of estimating the values that we need to achieve a sufficient effect.


    One approach is called "faceted shading" or "flat shading." We assume that every
    pixel in rendered primitive (i.e., Polygon or triangle) has the same lighting
    value. We need only the lighting computations for one vertex in each polygon in
    the model, and then copy those lighting values across the nearby rendered pixels
    on a per-polygon or per-triangle basis.


    ![](img/2c98d23f81c0609c29ed8f5a139a1e22_192_0.png)


    Figure 7.7

    Torus with faceted shading.


    Although faceted shading is adequate in some circumstances (or used as a deliberate
    effect), a better approach is "smooth shading," in which the lighting intensity
    is computed for each pixel. Smooth shading is feasible because of the parallel
    processing takes place on modern graphics cards and because of the interpolation
    that takes place in the OpenGL graphics pipeline.


    We will examine two popular methods for smooth shading: Gouraud shading and Phong
    shading.


    # 7.5.1 Gouraud Shading


    The French scientist Henri Gouraud published a smooth shading algorithm in 1971
    that has become known as Gouraud shading (GO71). It is particularly well suited
    to modern graphics cards, because it takes advantage of the automatic interpolated
    rendering is available in 3D graphics pipelines such as in OpenGL. The process
    for Gouraud shading is as follows:


    +   1. Determine the color of each vertex, incorporating the lighting computations.'
