    # 8.2 PROJECTIVE SHADOWS


    A variety of interesting methods have been devised for adding shadows to 3D scenes.
    One method that is well suited to drawing shadows on a ground plane (such as our
    image in Figure 8.1) and relatively computationally inexpensive called *projective
    shadows*. Given a point light source position $(X_s, Y_s, Z_s)$ on the object
    to render, and on a plane on which the object''s shadow is to cast, it is possible
    to derive a transformation matrix that convert points $(X_w, Y_w, Z_w)$ to corresponding
    shadow points $(X_s, 0, Z_s)$ on the plane. The resulting “shadow polygon” is
    then drawn, typically as a dark object blended with the texture on the ground
    plane, as illustrated in Figure 8.3.


    The advantages of projective shadow casting are their efficiency and simplicity
    of implementation. However, it only works on a flat plane—the method can''t be
    used to cast shadows on a curved surface or other objects. It is still useful
    for performance-intensive applications involving outdoor scenes, such as in many
    video games.


    Development of projective shadow transformation matrices is discussed in [AS14],
    [BL88], and [KS16].'
