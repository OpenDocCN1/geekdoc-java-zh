  md: '# Chapter 4 · Managing 3D Graphics Data


    When culling is enabled, default triangles are rendered only if they are front-facing.
    By default a triangle is considered front-facing if its three vertices progress
    in a counterclockwise direction (based on the order that they were defined in
    the buffer) as viewed from the OpenGL camera. Triangles whose vertices progress
    in a clockwise direction (as viewed from the OpenGL camera) are back-facing, and
    are not rendered. This counterclockwise definition of “front-facing” is sometimes
    called the winding order, and can be explicitly specified using the function glFrontFace(GL_CCW)
    for counterclockwise (the default) or glFrontFace(GL_CW) for clockwise. Similarly,
    whether it is the front-facing or the back-facing triangles are rendered can also
    be explicitly specified. Actually, for this purpose we specify which ones are
    not to be rendered—that is, which ones are “culled.” We can specify that the back-facing
    triangles are culled (although this would be unnecessary because it is the default)
    by calling glullFace(GL_BACK). Alternatively, we can specify instead that the
    front-facing triangles are culled, or all of the triangles are culled, by practice
    replacing the parameter GL_BACK or GL_FRONT_AND_BACK, respectively.


    As we see in Chapter 6, 3D models are typically designed so that the outer surface
    is constructed of triangles with the same winding order—most counterclockwise—so
    that if culling is enabled, then by the portion of the model''s surface that faces
    the camera is rendered. By default OpenGL assumes the winding order is counterclockwise,
    if a model is designed to be displayed with a clockwise winding order, it is up
    to the programmer to call glFrontFace(gl_CW) to account for this back-face culling
    enabled.


    Note that in the case of GL_TRIANGLE_STRIP, the winding order of each triangle
    alternates. OpenGL compensates for this by “flipping” the vertex sequence when
    building each triangle, as follows: 0-1-2, 2-1-3, 2-3-4, 4-3-5, and so on.


    Back-face culling improves performance by ensuring that OpenGL doesn''t spend
    time rasterizing and rendering surfaces that are not intended to be seen. Some
    of the examples we have seen in this chapter are so small that there is little
    motivation to enable face culling (an exception is the example shown in Figure
    4.9, where the 100,000 animated characters, which may pose a performance challenge
    on some systems). In practice, it is common for most 3D models to be “closed,”
    and it is customary to routinely enable back-face'
