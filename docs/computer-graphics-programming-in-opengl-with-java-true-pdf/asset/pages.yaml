  md: '# # Preface


    This book is designed primarily as a textbook for a typical computer science undergraduate
    course in OpenGL 3D graphics programming. However, we have also endeavored to
    create a text that could be used to teach oneself, without an accompanying course.
    With both of those aims in mind, we have tried to explain things as clearly and
    simply as we can. Every programming example is stripped down and simplified as
    much as possible, but still complete so that the reader may run them all as presented.


    One of the things that we hope is unique about this book is that we have striven
    to make it accessible to a beginner—that is, someone new to 3D graphics programming.
    While there is by no means a lack of information available on the topic—quite
    the contrary—many students are initially overwhelmed. This text is our attempt
    to write the book we had when we were starting out, with step-by-step explanations
    of the basics, progressing in an ordered manner through advanced topics. We considered
    titling the book Shader Programming Made Easy; however, we do not think there
    really is any way of making shader programming "easy." We hope we have come close.


    This book teaches OpenGL programming in Java, using JOGL—a Java "wrapper" for
    OpenGL''s native calls [J16]. There are several advantages to learning programming
    in Java rather than in C:


    +   - It is more convenient for students at schools that do most of their curriculum
    in Java.

    - Java''s I/O, window, and event handling are arguably cleaner than in C.

    - Java''s excellent support for object-oriented design patterns can foster good
    design.

    - JOGL includes some very nice tools, such as for loading textures, animation
    loops, etc.'
  merge: -1
  pgno: 11
- img_proc: true
  md: '# xii Preface


    It is worth mentioning that there exist other Java bindings for OpenGL. One that
    has become very popular is Lightweight Java Game Library, and LWJGL [LW16]. Like
    JOGL, LWJGL also offers bindings for OpenGL and OpenCL.


    Another thing that this book unique is that it has a "sister" textbook: Computer
    Graphics Programming in OpenGL with C++. The two books are organized in lockstep,
    with the same chapter and notices, figures, exercises, and theoretical descriptions.
    Wherever possible, the code is organized similarly. Of course, the use of Java
    versus C++ leads to considerable programming differences. Still, we believe that
    we have provided identical learning paths, allowing a student to choose either
    option within a single chapter.


    An important point of clarification is that there exist both versions of OpenGL
    (briefly discussed later) and different variants of OpenGL. For example, in addition
    to "standard OpenGL" (sometimes called "desktop OpenGL"), there exists a variant
    OpenGL ES which is tailored for development of embedded systems (hence the "ES",
    "Embedded systems" include devices such as mobile phones, game consoles, automobiles,
    and industrial control systems). OpenGL ES is mostly a subset of OpenGL, eliminating
    a number of operations that are not needed for embedded systems. OpenGL ES also
    adds some additional functionality, typically application-specific operations
    for target environments. The JOGL suite includes interfaces for different versions
    of OpenGL ES, although we do not use them in this book.


    Yet another variant of OpenGL is called "WebGL". Based on OpenGL ES, WebGL is
    designed to support the use of OpenGL in web browsers. WebGL allows an application
    to use JavaScript to invoke OpenGL ES operations, which makes it easy to embed
    OpenGL graphics into standard (web) documents. Most modern web browsers support
    WebGL, including Apple Safari, Google Chrome, Microsoft Internet Explorer, Mozilla
    Firefox, and Opera. Since programming is outside the scope of this book, we will
    not cover any WebGL specifics. Note however that because WebGL is based on OpenGL
    ES, which in turn is based on standard OpenGL, of what is covered in this book
    can be transferred to learning about these OpenGL variants.


    The very topic of 3D graphics lends itself to impressive, even beautiful images.
    Indeed, many popular textbooks on the topic are filled with breathtaking scenes,
    and it is enticing to leaf through their galleries. While we acknowledge the motivational


    > JavaScript is a scripting language that can be used to encode code in webpages.
    It has strong similarities to Java, but also many important differences.'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'of such examples, our aim is to teach, not to impress. The images in this book
    are simple outputs of the example programs, and since this is an introductory
    text, the resulting scenes are unlikely to impress an expert. However, the techniques
    presented constitute the fundamental elements for producing today''s stunning
    3D effects.


    We also haven''t tried to create an OpenGL or JOGL "reference." Our coverage of
    OpenGL and JOGL represents only a tiny fraction of their capabilities. Our aim
    is to use OpenGL and JOGL as vehicles for teaching the fundamentals of modern
    shader-based 3D graphics programming, and provide the reader with a sufficiently
    deep understanding for further study. Along the way this text helps to expand
    awareness of JOGL and related technologies, that would be nice too.


    # What''s New in this Edition


    The biggest change we have made in this edition is switching math libraries. In
    the first edition, we used a math library called "graphicslib3D" which we built
    ourselves to support an advanced graphics course at California State Sacramento.
    Since then, a new Java-based math library called "JOML" has emerged that offers
    many advantages over graphicslib3D. First, JOML was developed with speed in mind,
    and using it enables us to effectively introduce performance-related topics. Second,
    JOML is becoming an extremely popular math library among JOGL users, and learning
    it is a valuable skill. Finally, JOML is an open source project with an active
    developer community, and as is likely to enjoy better long-term support than graphicslib3D.


    The switch to JOML affects virtually every program in the book, although in most
    cases the changes are the same. Readers who have used our previous edition will
    find that their existing code may work without updating the code (and the library)
    to JOML. We hope that any minor inconvenience be offset by improved performance
    and the benefits of standardization to a more widely used library.


    As we did for graphicslib3D in our previous edition, we included the latest version
    of JOML on the companion disc distributed with this book. However, readers are
    encouraged to seek out and utilize the new version of JOML as it is being continually
    updated. For this reason, our installation instructions describe how to obtain
    the latest version of JOML from the Internet.


    There are some new sections in the book that we hope readers will find exciting.
    As alluded to above, we have added a section on coding for performance. We also
    added a section on generating soft shadows that we promised in the instructor
    notes for our previous edition. The techniques for soft shadows also help with
    reducing jagged-edge shadow'
  merge: -1
