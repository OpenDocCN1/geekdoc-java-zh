  md: 'Consider a rectangle made of two triangles and textured with a checkerboard
    image, facing the camera. As the rectangle is rotated around the X axis, the top
    part of the rectangle tilts away from the camera, while the lower part of the
    rectangle swings closer to the camera. Thus, we would expect the squares at the
    top to become smaller and the squares at the bottom to become larger. However,
    linear interpolation of the texture coordinates will instead cause the height
    of all squares to be equal. The distortion is exacerbated along the diagonal defining
    the two triangles that make up the rectangle. The resulting distortion is shown
    in Figure 5.16.


    Fortunately, there are algorithms for correcting perspective distortion, and by
    default, OpenGL applies a *perspective correction* algorithm [OP14] during rasterization.
    Figure 5.17 shows the same rotating checkerboard, properly rendered by OpenGL.


    ![](img/2c98d23f81c0609c29ed8f5a139a1e22_147_0.png)


