  md: '# Chapter 12 · Tessellation


    ```

    glGlPatchParameters(GL_PATCH_VERTICES, 16); // number of vertices per patch =
    16

    GlPolygonMode(GL_FRONT_AND_BACK, GL_FILL);

    GlDrawArrays(GL_PATCHES, 0, 16); // total number of vertices: 16 x 1 patch = 16

    ```


    The vertex shader controls 16 control points (the "patch" vertices) representing
    a Bézier surface. In this example they are all normalized to the range [-1,+1].
    The vertex shader also uses the control points to define texture coordinates for
    the tessellated grid, with values in the range [0.,1]. It is important to reiterate
    that the vertices output from the vertex shader are not vertices that will be
    rasterized, but instead Bézier control points. When using tessellation, patch
    vertices are never—only tessellated vertices proceed to rasterization.


    The control shader still specifies the inner and outer tessellation levels. It
    now has the responsibility of forwarding the control points and texture coordinates
    to the evaluation shader. Note that the tessellation levels only need to be specified
    once, and therefore that tessellation is only done during the eighth invocation
    (recall that the TCS runs once per vertex—thus there are 16 invocations in this
    example). For convenience, we have specified 23 subdivisions for each tessellation
    level.


    Next, the evaluation shader performs all the Bézier surface computations. The
    large block of assignment statements at the beginning of main() extract the control
    points from the incoming gl_Position of each incoming gl_in that correspond to
    the control shader''s gl_out variable. The weights for the blending functions
    are then computed using the grid points coming from the tessellator, resulting
    in a new outputPosition, which the model-view-projection matrix is then applied,
    producing an output gl_Position for each grid point, forming the Bézier surface.


    It is also necessary to create texture coordinates. The vertex shader provided
    one for each control point location, but it doesn''t control the points that are
    being rendered—we ultimately need texture coordinates for the much larger number
    of tessellated grid points. There are various ways of doing this—here we linearly
    interpolate them using GLSL''s handy mix function. The mix(x function expects
    three parameters: (a) starting point, (b) ending point, and (c) interpolation
    value, which ranges from 0 to 1. It returns the value between the starting and
