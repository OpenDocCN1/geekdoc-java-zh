    The composable pipeline can be configured in the Java/JOGL application code [JU16],
    rather than just enabling it on the command line (as was described in Section
    2.2). This can be useful for utilizing the debugging and tracing tools based on
    interactive input (e.g., a user keystroke).


    Through this the reader may at times wish to know one or more of OpenGL''s upper
    limits. For example, the programmer might need to know the maximum number of outputs
    that can be produced by the geometry shader, or the maximum size that can be specified
    for rendering a point. Many values are implementation-dependent, meaning that
    they can vary between different machines. OpenGL provides a mechanism for retrieving
    such limits using the glGet() command, which takes forms depending on the type
    of parameter being queried. For example, to find the maximum allowable point size,
    the following call will place the minimum and maximum values (for your machine''s
    OpenGL implementation) into the first two elements of the float array named "size":


    ```

    gl.glGetFloat(GL_POINT_SIZE_RANGE, size, 0);

    ```


    Many queries are possible. Consult the OpenGL reference [OP16] documentation for
    examples.


    In some cases, the reader may notice that an OpenGL call is defined as requiring
    a C pointer as one of its parameters. For example, this occurs in Program 2.2,
    in the following JOGL call:


    ```

    gl.glVertexArrays(vao, vao, 0);

    ```


    Looking up the corresponding OpenGL call to glVertexArrays() in the OpenGL documentation
