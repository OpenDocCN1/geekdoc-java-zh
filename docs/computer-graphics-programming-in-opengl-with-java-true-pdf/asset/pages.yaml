    respectively, and return integer IDs for them. We store these into the arrays
    vao and vbo. The three parameters on each of them refer to how many are created,
    an array to hold the returned IDs, and an offset into that array (usually set
    to 0). The purpose of glBindVertexArrays() is to make the specified VAO "active"
    so that the generated buffers will be associated with that VAO.


