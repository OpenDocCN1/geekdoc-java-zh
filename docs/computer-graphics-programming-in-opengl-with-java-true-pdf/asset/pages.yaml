    Note that your code and material properties described so far in these sections
    does not actually perform lighting. It merely provides a way to specify and store
    desired light and material properties in a scene. We still need to compute the
    lighting ourselves. This is going to require some serious mathematical processing
    in our shader code. So let’s now into the nuts-and-bolts of implementing ADS lighting
    in your Java/JOGL and GLSL graph-programs.


    # 7.4 ADS LIGHTING COMPUTATIONS


    As we draw our scene, recall that each vertex is transformed so as to simulate
    a 3D world on a 2D scene. Pixel colors are the result of rasterization, as well
    as texturing and interpolation. We must now incorporate the additional step of
    adjusting those rasterized pixel colors to effect the lighting and materials in
    our scene. The basic ADS computation that we need to perform is to determine the
    reflection intensity (I) for each pixel in our scene. This computation takes the
    following form:


    > $I_{observed} = I_{ambient} + I_{diffuse} + I_{specular}$


    That, we need to compute and sum the ambient, diffuse, and specular contributions
    for each light source. This will of course depend on the type of light(s) in our
    scene and the type of material associated with the rendered model.


    Ambient contribution is the simplest. It is the product of the specified light
    and the specified ambient coefficient of the material:


    > $I_{ambient} = Light_{ambient} * Material_{ambient}$'
  merge: -1
  pgno: 188
- img_proc: true
  md: '# Chapter 7 · Lighting 169


    Keeping in mind that light and material intensities are specified via RGB values,
    the computation is more precisely


    ```

    $I_{ambient}^{red} = Light_{ambient}^{red} * Material_{ambient}^{red}$

    I_{ambient}^{green} = Light_{ambient}^{green} * Material_{ambient}^{green}$

    I_{ambient}^{blue} = Light_{ambient}^{blue} * Material_{ambient}^{blue}$

    ```


    Diffuse contribution is more complex because it depends on the angle of incidence
    between the light and the surface. Lambert''s Cosine Law (published in 1760) specifies
    that the amount of light that reflects from a surface is proportional to the cosine
    of the light''s angle of incidence. This can be modeled as follows:


    ```

    $I_{diffuse} = Light_{diffuse} * Material_{diffuse} * cos(\theta)$

    ```


    As before, the actual computations involve red, green, and blue components.

    Determining the angle of incidence $\theta$ requires us to (a) find a vector from
    the pixel being down to the light source (or, similarly, a vector opposite the
    light direction) and (b) find a vector that is normal (perpendicular) to the surface
    of the object being rendered. Let''s denote these vectors $\vec{L}$ and $\vec{N}$,
    respectively, as shown in Figure 7.4.


