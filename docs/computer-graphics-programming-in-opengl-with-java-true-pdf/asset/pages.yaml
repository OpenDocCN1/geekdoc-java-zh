  md: "![](img/2c98d23f81c0609c29ed8f5a139a1e22_354_0.png)\n\n**Figure 14.14**nSmoothing\
    \ of 3D textures, at various zooming levels.\n\nNext, smoothed noise maps of various\
    \ zooming factors are **combined**. A new noise map is created in which each of\
    \ its texels is formed by another weighted average, this time based on the sum\
    \ of the texels at the same location in each of the \"smoothed\" noise maps, with\
    \ the zoom factor serving as the weight. The effect was dubbed \"turbulence\"\
    \ by Perlin [PE85], although it is really more closely related to the harmonics\
    \ produced by summing various waveforms. A new turbulence function and a modified\
    \ version of fillDataArray(y) that specifies a noise map that sums levels 1 through\
    \ 32 (the ones that are power of two) are shown below, followed by an image of\
    \ a cube textured with the resulting noise map.\n\n```\nprivate double turbulence(double\
    \ x, double y, double z, double maxZoom)\n{\n    while (zoom >= 1.0) // the last\
    \ pass is when zoom=1.\n        // compute weighted sum of smoothed noise maps\n\
    \        sum = sum + smoothNoise(x / zoom, y / zoom, z / zoom) * zoom;\n     \
    \   zoom = zoom / 2.0; // for each zoom factor that is a power of two.\n}\n```"
