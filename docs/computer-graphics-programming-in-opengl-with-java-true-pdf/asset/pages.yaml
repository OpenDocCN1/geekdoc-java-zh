  md: 'The multiplication in the vertex shader applies the matrix transforms to the
    vertex, converting it to camera space (note the right-to-left concatenation order).
    Those values are put in the built-in OpenGL output variable gl_Position and then
    proceed through the pipeline and are interpolated by the rasterizer.


    The interpolated pixel locations are then sent to the fragment shader (referred
    to as fragments) Recall the primary function of the fragment shader is to set
    the color of an output pixel. In a manner similar to the vertex shader, the fragment
    shader processes the pixels one-by-one, with a separate invocation for each pixel.
    In this, it outputs a hardcoded value corresponding to red. For reasons indicated
    earlier, the uniform variables have been included in the fragment shader even
    though they aren''t being used in this example.


    An overview of the flow of data starting with the Java/JOGL application and passing
    through the pipeline is shown in Figure 4.5.


    ![](img/2c98d23f81c0609c29ed8f5a139a1e22_97_0.png)


    **Figure 4.5**

    Data flow through Program 4.1.


    Let''s make a slight modification to the shaders. In particular, we will assign
    a color to each vertex according to its location and that varyingColor. The fragment
    shader is similarly revised to accept the incoming color (interpolated by the
    rasterizer) and that to set the color of the output pixel. Note that the code
    also multiplies the location by one-half and adds one-half to convert the range
    of values from [-1.+1] to [0..1]. Note also use of the common convention of assigning
    variable names that include the word varying to programmer-defined interpolated
    vertex attributes. The changes in each shader are highlighted and the resulting
    output shown on the following page.'
