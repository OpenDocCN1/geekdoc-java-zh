    # 14.9 NOISE APPLICATION—SPECIAL EFFECTS


    Noise textures can be used for a variety of special effects. In fact, there are
    so many possible uses that its applicability is limited only by one’s imagination.


    One very simple special effect that we will demonstrate here is a dissolve effect.
    This is where we make an object appear to gradually dissolve into small particles,
    until it eventually disappears. Given a 3D noise texture, this effect can'
  merge: -1
  pgno: 367
- img_proc: true
  md: 'be achieved with very little additional code. Note that this example only works
    if animation is incorporated, such as with the use of Animator.


    To facilitate the dissolve effect, we introduce the GLSL discard command. This
    command is only legal in the fragment shader, and when executed, it causes the
    fragment shader to discard the current fragment (meaning not render).


    Our strategy is a simple one. In the Java/JOGL application, we create a fine-grained
    noise map identical to the one shown back in Figure 14.12, and also a float variable
    counter that gradually increases time. This variable is then sent down the shader
    pipeline in a uniform variable, and the noise map is also placed in a texture
    map with an associated sampler. The fragment shader then accesses the texture
    noise value to determine whether or not to discard the fragment. We do this by
    comparing the grayscale value against the counter, which serves as a sort of “threshold”
    value. Because the threshold is gradually changing over time, we can set it up
    so that gradually and more fragments are discarded. The result is that the object
    appears to dissolve. Program 14.9 shows the relevant code sections, which are
    added to the earth-rendered sphere from Program 6.1. The generated output is shown
    in Figure 14.24.


    # Program 14.9 Dissolve Effect using discard Command


    Java/JOGL application:


    ```

    private float thresholdLoc = 0.0f; // gradually-increasing threshold for retaining/discarding
    fragment

    ```


    ...


    in Display:


    ```

    thresholdLoc = gl.getUniformLocation(renderingProgram, "threshold");

    thresholdLoc = thresholdLoc + 0.02f;

    glUniform1f(thresholdLoc, thresholdLoc);

    ```


    ```

    gl.glTexture(GL_TEXTURE_0);

    gl.glBindTexture(GL_TEXTURE_3D, noiseTexture);

    gl.glBindTexture(GL_TEXTURE_1);

    gl.glBindTexture(GL_TEXTURE_2D, earthTexture);

    ...

    gl.glDrawArrays(GL_TRIANGLES, 0, numSphereVertices);

    ```'
