  md: "# 7.5.2 Phong Shading\n\nBui Tong developed a smooth shading algorithm while\
    \ a graduate student at the University of Utah and described it in his 1973 dissertation\
    \ [PH73] and published it in [PH75]. The structure of the algorithm is similar\
    \ to the algorithm for Gouraud shading, except that the lighting computations\
    \ are per-pixel rather than per-vertex. Since the lighting computations require\
    \ a normal vector $\\vec{N}$ and a light vector $\\vec{L}$, which are only available\
    \ in the model at per-vertex basis, Phong shading is often implemented using a\
    \ clever “trick,” where $\\vec{N}$ and $\\vec{L}$ are computed in the vertex shader\
    \ and *interpolated* during rasterization. Figure 7.10\n\n| JOGL (Java) code |\
    \ Vertex shader | Fragment shader |\n| --- | --- | --- |\n| (same for Gouraud\
    \ shading) | 1. compute: vectors $N, L, V$<br>2. output attributes: $N, L, V,\
    \ gl\\_position$ | 1. incoming interpolated: $N, L, V$<br>2. compute: $R, \theta,\
    \ \\phi$<br>3. compute contributions<br>4. output color |\n\n**Figure 7.10**\n\
    Implementing Phong shading.\n\nThe Java/JOGL code is completely unchanged. Some\
    \ of the computations previously done in the vertex shader are now moved into\
    \ the fragment shader. The effect of interpolating normal vectors is illustrated\
    \ in Figure 7.11.\n\n![](img/2c98d23f81c0609c29ed8f5a139a1e22_200_0.png)\n\n**Figure\
    \ 7.11**\nInterpolation of normal vectors."
