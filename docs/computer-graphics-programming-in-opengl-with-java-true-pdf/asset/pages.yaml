  md: 'The reason for this modification is difficult to illustrate in still images.
    In an animated scene as a tessellated object moves through 3D space, it is sometimes
    possible, if LOD is used, to see the changes in tessellation levels on the surface
    of the object as wiggling artifacts called “popping.” Changing from equal spacing
    to fractional spacing reduces this effect by making the grid geometry of adjacency
    instances more similar, even if they differ in level of detail. (See Exercises
    12.2 and 12.3.)


    ![](img/2c98d23f81c0609c29ed8f5a139a1e22_316_0.png)


    Employing LOD can dramatically reduce the load on the system. For example when
    animated, the scene might be less likely to appear jerky or lag than without controlling
    LOD.


    Applying this simple LOD technique to the version that includes Phong shading
    (i., Program 12.4) is a bit tricky. This is because the changes in LOD between
    adjacent patch instances can in turn cause sudden changes to the associated normal
    vectors, causing popping artifacts in the lighting! As always, there are tradeoffs
    and compromises to consider when constructing a complex 3D scene.


    # SUPPLEMENTAL NOTES


    Combining tessellation with LOD is particularly useful in real-time virtual applications
    that require both complex detail for realism and frequent object movement and
    changes in camera position, as in computer games. In this chapter we have illustrated
    the use of tessellation and LOD for real-time terrain generation, it can also
    be applied in other areas such as in displacement mapping for 3D models (where
    tessellated vertices are added to the surface of a model and then so to add detail).
    It is also useful in computer-aided design applications.


    Sellers and colleagues extend the LOD technique (shown in Program 12.5) further
    than we have presented by eliminating vertices in patches that are *behind the
    camera* (they do this by setting their inner and outer levels to zero) [SW15].'
