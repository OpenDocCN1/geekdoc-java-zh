    ```

    int vao[] = new int[1];

    int vbo[] = new int[2];


    glGenVertexArrays(1, vao);

    glBindVertexArray(vao[0]);

    glGenBuffers(2, vbo);

    ```


    // OpenGL requires these values to be specified in arrays


