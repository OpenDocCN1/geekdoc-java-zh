  md: '# Chapter 3 · Mathematical Foundations


    | Aa+Be+Ci+Dm | Ab+Bf+Cj+Dn | Ac+Bg+Ck+Do | Ad+Bh+Cl+Dp |

    | Ea+Fe+Gi+Hm | Eb+Ef+Gj+Hn | Ec+Fg+Gk+Ho | Ed+Fh+Gl+Hp |

    | Ia+Je+Ki+Lm | Ib+Jf+Kj+Ln | Ic+Jg+Kk+Lo | Id+Jh+Kl+Lp |\| Ma+Ne+Oi+Pm | Mb+Nf+Oj+Pn
    | Mc+Ng+Ok+Po | Md+Nh+Ol+Pp |


    Matrix multiplication is frequently referred to as concatenation, as will be seen,
    it is used to combine a set of matrix transforms into a single matrix. This ability
    to combine matrix transforms is made possible because of the associative property
    of matrix multiplication. Consider the following sequence of operations:


    New Point = Matrix₁ * (Matrix₂, (Matrix₃ * Point))


    Here, we multiply a point by Matrix₁, then multiply that result by Matrix₂, and
    that result finally by Matrix₁. The result is a new point. The associative property
    ensures that the above computation is equivalent to


    New Point = (Matrix₁, Matrix₂, * Point)


    Here we multiply three matrices together, following the concatenation of Matrix₁,
    Matrix₂, and Matrix₃ (which itself is also a 4x4 matrix). If we refer to this
    concatenation as Matrix₂, we can rewrite the above operation as


    New Point = Matrix₃ * Point


    The advantage, here we will see in Chapter 4, is that we will frequently need
    to apply the same sequence of matrix transformations to every point in our scene.
