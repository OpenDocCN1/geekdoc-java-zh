  md: '# Java/JOGL code


    Assuming that we wish to build a cubic Bézier surface, we will need 16 control
    points. We could send them from the Java side in a VBO, or we could hardcode them
    in the vertex shader. Figure 12.4 shows an overview of the process, with control
    points coming from the Java side.


    ![](img/2c98d23f81c0609c29ed8f5a139a1e22_300_0.png)


    Figure 12-4 Overview of tessellation for Bézier surfaces.


    Now is a good time to explain a bit precisely how the tessellation control shader
    (TCS) works. Similar to the vertex shader, the TCS executes once per vertex. Also,
    recall from Chapter 2 that OpenGL provides a built-in variable gl_VertexID which
    a counter indicates which invocation of the vertex shader is currently


    executing. A similar built-in variable gl_InvocationID exists for the tessellation
    shader.


    A powerful feature of tessellation is that the TCS (and also the TES) shader has
    access to all of the control points simultaneously, in arrays. At first, it may
    seem confusing that the TCS executes once per vertex, when each invocation has
    access to all of the vertices. It is also counterintuitive that the tessellation
    levels are specified in assignment statements that are redundantly set at each
    TCS invocation. Although all of this may seem odd, it is this way because the
    tessellation architecture is designed so that TCS can run in parallel.


    OpenGL provides several built-in variables for use in the TCS and TES shaders.
    Ones that we have already mentioned are gl_InvocationID and, of course, gl_TessLevelInner
    and gl_TessLevelOuter. Here are more details and descriptions of some of the most
    built-in variables:


    Tessellation Control Shader (TCS) built-in variables:


    +   - gl_In[] — an array containing each of the incoming control point vertices—one
    element per incoming vertex. Particular vertex attributes can be accessed as fields
    using the “.” notation. One built-in attribute is gl_Position—the position of
    incoming vertex “i” is accessed as gl_In[i].gl_Position.'
  merge: -1
  pgno: 300
- img_proc: true
  md: '+   gl_out [] – an array for sending outgoing control point vertices to the
    TES—one array element per outgoing vertex. Particular vertex attributes can be
    accessed as fields using the “” notation. One built-in attribute is gl_Position—thus,
    the outgoing vertex “i” is accessed as gl_out[i].Position.


    +   glInvocationID – an integer ID counter indicating invocation of the TCS is
    continuous. One can use it for passing vertex attributes; for example, passing
    the current invocation''s vertex position from the TCS to the TES would be done
    as follows: gl_out[glInvocationID].gl_Position = gl_in[glInvocationID].gl_Position;


    Tessellation Shader (TES) built-in variables:


    +   gl_in [] – an array containing the incoming control point vertices—one element
    per incoming vertex. Particular vertex attributes can be accessed as fields using
    the “” notation. One built-in attribute is gl_Position—thus, incoming positions
    are accessed as gl_in[xxx].gl_Position.


    +   gl_Position – output position of a tessellated vertex, possibly modified in
    the TES. It is important to note that gl_Position and gl_in[xxx].gl_Position are
    different—gl_Position is the position of an output vertex that originated in the
    tessellator, while gl_in[xxx].gl_Position is a control point vertex position coming
    into the TES from the TCS.


    It is important to note that input and output control point vertex attributes
    in the TCS are arrays. By contrast, control point and vertex attributes in the
    TES are arrays, but output vertices are scalars. Also, it is easy to be confused
    as which vertices are for control points and which are tessellated and then moved
    to the resulting surface. To summarize, vertex inputs and outputs to the TCS are
    control points, whereas in the TES, gl_in[] holds incoming control points, gl_TessCoord
    holds tessellated grid points, and gl_Position holds surface vertices for rendering.


    Our tessellation shader has two tasks: specifying the tessellation levels and
    passing the control points through the vertex shader to the evaluation shader.
    The evaluation shader can then modify the locations of the grid points (the gl_TessCoords)
    based on the Bézier control points.


    Program 12.2 shows all four shaders—vertex, TCS, TES, and fragment—for specifying
    a control point patch, generating a flat tessellated grid of vertices,'
