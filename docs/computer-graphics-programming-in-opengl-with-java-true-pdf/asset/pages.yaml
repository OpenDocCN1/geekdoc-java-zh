  md: '# Chapter 5 · Texture Mapping 131


    Although not part of the OpenGL core, they are supported on many graphics cards
    through OpenGL''s extension mechanism [OE16].


    There is an alternative mechanism for configuring and managing textures and samplers.
    Version 3.3 of OpenGL introduced sampler objects (sometimes called “sampler states”—not
    to be confused with sampler variables) that can be used to hold a set of texture
    settings independent of the actual texture object. Sampler objects are attached
    to texture units for conveniently and efficiently changing texture settings. The
    examples shown in this textbook are sufficiently simple that we decided to omit
    coverage of sampler objects. For interested readers, usage of sampler objects
    is easy to learn, and there are many excellent online tutorials (such as [GE11]).


    The JOGL class makes a number of OpenGL texture-related functions available directly,
    without extracting the actual OpenGL texture object as we did in this chapter.
    For example, there are bind() and setTexParameter() functions that invoke the
    OpenGL functions glBindTexture() and glTexParameteri(). We will explore more of
    the functionality of the JOGL texture later in the book when we use cube maps
    and 3D textures. An excellent source of information on the JOGL Texture, TextureIO,
    and TextureData classes is its extensive Javadoc pages.


