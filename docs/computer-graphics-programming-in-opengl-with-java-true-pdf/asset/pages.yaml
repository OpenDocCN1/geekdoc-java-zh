    immediately after the getTextureObject() function call:


    ```

    glBindTexture(GL_TEXTURE_2D, textureID);

    glTexParameterf(GL_TEXTURE_2D, GL_TEXTURE_MIN_FILTER, GL_LINEAR_MIPMAP_LINEAR);

    glGenerateMipmap(GL_TEXTURE_2D);

    ```


    This tells OpenGL to generate the mipmaps. The brick texture is active with the
    glBindTexture() call, and then the glTexParameteri() function enables one of the
    minification factors listed above, such as GL_LINEAR_MIPMAP_LINEAR shown in the
    above call, which enables trilinear filtering.


    Once the mipmap is built, the filtering option can be changed (although this is
    rarely necessary) by calling glTexParameteri() again, as in the display function.
    Mipmapping can be disabled by selecting GL_NEAREST or GL_LINEAR.


    For critical applications, it is possible to build the mipmaps, using whatever
    is your preferred editing software. They can then be added as mipmap levels when
    creating the texture object by repeatedly calling OpenGL’s glTexImage2D() function,
    or JOG’s updateSubImage() function, for each mipmap. Further discussion of this
    approach is outside the scope of this book.


    # ANISOTROPIC FILTERING


    Mipmapped textures can appear more blurry than non-mipmapped textures, especially
    when the texture is rendered at a heavily tilted viewing angle. We saw an example
    of this back in Figure 5.9, where reducing artifacts with mipmapping leads to
    reduced detail (compared with Figure 5.8).


    This loss of detail occurs when an object is tilted, its primitives smaller along
    one axis (i.e., width vs. height) than the other. When OpenGL textures a primitive,
    it selects the mipmap appropriate for the *smaller* of the two axes (to avoid
    "sparkling") artifacts). In Figure 5.9 the surface is tilted heavily away from
    the viewer, so each rendered primitive will utilize the mipmap appropriate for
