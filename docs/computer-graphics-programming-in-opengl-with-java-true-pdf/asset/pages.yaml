  md: 'Here is an overview of how a display() function using a matrix stack is typically
    organized:


    | | |

    | --- | --- |

    | Setup | - Instantiate the matrix stack.<br>- - Push a new matrix onto the stack.
    (this will instantiate an empty VIEW matrix). |

    | Camera Parent | - Apply transform(s) to the view matrix on the top of the stack.<br>-
    - Push a new matrix onto the stack (this will be the parent MV matrix—for the
    first parent, it duplicates the view matrix).<br>- - Apply transforms to incorporate
    the parent''s M into the duplicated parent MV matrix.<br>- - Send the topmost
    matrix ("get") to the MV uniform variable in the vertex shader. |

    | Child | - Draw the parent object.<br>- - Push a new matrix onto the stack. This
    will be the child''s MV matrix, duplicating the parent MV matrix.<br>- - Apply
    transforms to incorporate the parent''s M into the duplicated parent MV matrix.<br>-
    - Send the topmost matrix ("get") to the MV uniform variable in the vertex shader.
    |

    | Cleanup | - Draw the child object.<br>- - Pop the child''s MV matrix off the
    stack.<br>- - Pop the parent''s MV matrix off the stack.<br>- - Pop the VIEW matrix
    off the stack. |


    The pyramid ("sun") rotation on its axis is in its own local coordinate space,
