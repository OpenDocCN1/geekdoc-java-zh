  md: '# Preface


    We are extremely grateful for the ongoing assistance provided to us by Julien
    Gouesse, engine support maintainer at JogAmp. Mr. Gouesse has provided technical
    information on OpenGLL, cube maps, buffer handling, proper loading of shader source
    files, and a variety of other types. His help led to significant improvements
    in our text.


    Jay Turnerville of Studio 522 Productions in Scottsdale (Arizona) built the dolphin
    model on the cover and used throughout this book. Our students love it. Studio
    522 Productions did incredibly high-quality 3D animation and video production,
    as well as custom 3D modeling. We were thrilled that Mr. Turnerville offered to
