  md: '# 14.2 COMPOSITING/BLENDING/TRANSPARENCY


    We have already seen a few examples of blending—in the supplementary notes for
    Chapter 7 and just above in our implementation of fog. However, we haven''t yet
    seen to utilize the blending (or compositing) capabilities that follow after the
    fragment shader, during pixel operations (recall the pipeline sequence in Figure
    2.2). It is that transparency is handled, which we look at now.


    Throughout this book we have made frequent use of the vec4 data type, to represent
    3D points and vectors in a homogenous coordinate system. You have noticed that
    we also frequently use a vec4 to store color information, while the first three
    values consist of red, green, and blue, and the fourth element is—what?


    The fourth element in a color is the alpha channel and specifies the opacity of
    the color. Opacity is a measure of how non-transparent the pixel color is. An
    alpha value of 0 means “no opacity,” or completely transparent. An alpha value
    of 1 means “fully opaque,” not at all. In a sense, the “transparency” of color
    is 1-α, where α is the value of the alpha channel.


    Recall from Chapter 2 that pixel operations utilize the Z-buffer, which achieves
