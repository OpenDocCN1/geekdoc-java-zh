  md: '# 366 Computer Graphics Programming in OpenGL with Java, Second Edition


    **First**, click the button to select “Launch external program”: The box to the
    right of that probably contains something like $(LocalDebuggerCommand). Change
    that entry to instead contain the path to the SDK executable. On Windows machines,
    this will be something like C:\Program Files\Java\jdk1.8.0_10\bin\java.exe.


    **Second**, further down on the same pane, under Launch Options, there is a line
    that says “Command line arguments”. In the box to the right of that, replace whatever
    is there with the command line arguments needed to run your Java/OpenGL application.
    Each argument must be in its own set of quotations. For example, if you usually
    run your program with a command such as


    ```

    java -Dsun.java2d.d3=false code.code

