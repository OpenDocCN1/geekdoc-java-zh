  md: '# Chapter 7 · Lighting


    $\phi$ between the spotlight''s direction and a vector from the spotlight to the
    pixel. We then compute an intensity factor by raising the cosine of $\phi$ to
    the falloff exponent when $\phi$ is less than (when greater than the intensity
    factor is set to 0). The result is an intensity factor that ranges from 0 to 1.
    The falloff exponent adjusts the rate at which the intensity factor tends to 0
    as the angle $\phi$ increases. The intensity factor is then multiplied by the
