  md: 'are soft shadows. That is, their edges are blurred to various degrees. In this
    section, we will explore the appearance of soft shadows as they occur in the real
    world, and then describe a commonly used algorithm for simulating them in OpenGL.


    # 8.7.1 Soft Shadows in the Real World


    There are many causes of soft shadows, and there are many types of soft shadows.
    One thing that commonly causes shadows in nature is real-world light sources are
    rarely points—more often they occupy some area. Another cause is the accumulation
    of imperfections in materials and surfaces, and the role that the objects themselves
    play in generating ambient light through their own reflective properties.


    Figure 8.16 shows a photograph of an object casting a shadow on a table top. Note
    that this is not a 3D computer rendering, but an actual photograph of an object,
    taken in the home of one of the authors.


    There are two aspects to note about the shadow in Figure 8.16:


    +   - The shadow is “softer” the further it is from the object and “harder” the
    closer it is to the object. This is apparent when comparing the shadow near the
    legs of the object versus the wider portion of the shadow at the right region
    of the image.

    - The shadow appears slightly darker the closer it is to the object.


    The dimensionality of the light source can lead to soft shadows. As shown in Figure
    8.17, the various regions across the light source cast slightly different shadows.
    Areas where the various shadows differ are called the penumbra and comprise the
    soft regions at the edges of the shadow.


    ![](img/2c98d23f81c0609c29ed8f5a139a1e22_231_0.png)


    ![](img/2c98d23f81c0609c29ed8f5a139a1e22_231_1.png)'
