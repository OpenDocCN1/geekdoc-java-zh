    # HISTORICAL NOTE


    We took the liberty of oversimplifying some of the terminology in this chapter,
    with respect to the contributions of Gouraud and Phong. Gouraud is credited with
    Gouraud shading—the notion of generating a smoothly curved surface appearance
    by computing light intensities at vertices and aligning the rasterizer to interpolate
    these values (sometimes called “smooth shading”). Phong is credited with another
    form of smooth shading that instead interpolates normals and computes light per-pixel.
    Phong is also credited with pioneering the successful incorporation of specular
    highlights into smooth shading. For this reason, the ADS lighting model, when
    applied to computer graphics, is often referred to as the Phong Reflection Model.
    Our example of Gouraud shading is more accurate, Gouraud shading with a Phong
    reflection model. Since Phong''s reflection model has so ubiquitous in 3D graphics
    programming, it is common to demonstrate Gouraud shading in the presence of Phong
    reflection, although it is a misleading because Gouraud’s original 1971 work did
    not, for example, include any specular component.


