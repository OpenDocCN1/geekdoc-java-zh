    # 4.3 INTERPOLATION OF VERTEX ATTRIBUTES


    It is important to know how vertex attributes are processed in the OpenGL pipeline
    versus. Recall that immediately before the fragment shader is rasterization, primitives
    (e.g., triangles) defined by vertices are converted to fragments. Rasterization
    linearly interpolates vertex attributes so that the displayed pixels seamlessly
    connect the modeled surfaces.


    By contrast, uniform variables behave like initialized constants and remain unchanged
    across each vertex shader invocation (i.e., for each vertex sent from the buffer).
    A uniform variable is not interpolated; it contains the same value regardless
    of the number of vertices.


    The interpolation done on attributes by the rasterizer is useful in many ways.
    Later, we will use rasterization to interpolate colors, texture coordinates, and
    surface normals. It is important to understand that all values sent through a
    buffer to a vertex attribute will be interpolated further down the pipeline.


    We have seen vertex attributes in a vertex shader declared as "in" to indicate
    that they receive values from a buffer. Vertex attributes may instead be declared'
