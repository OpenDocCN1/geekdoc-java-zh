    “destination” pixel. OpenGL provides many options for deciding which of the two
    pixels, or what sort of combination, is placed in the frame buffer. Note that
    the pixel operations are not a programmable stage—so the OpenGL tools for configuring
    the desired compositing are found in the Java/JGL appropriate rather than in a
    shader.


    The two OpenGL functions for controlling compositing are glBlendEquation(mode)
    and glBlendFunc(srcFactor, destFactor). Figure 14.3 shows an overview of the compositing
    process.


    The compositing process works as follows:


    +   1. The source and destination pixels are multiplied by source factor and destination
    factor, respectively. The source and destination factors are specified in the
    blendFunc() function call.'
