  md: '# Chapter 8 · Shadows 197


    The second method is to build a “custom framebuffer” back in pass one (rather
    than use the default Z-buffer) and attach the shadow texture to it using the command
    glBufferTexture(). This command was introduced into OpenGL, in version 3.0, to
    further support shadow mapping. When using this approach, isn''t necessary to
    “copy” the Z-buffer into a texture, because the buffer already has a texture attached
    to it, and the depth information is put into the texture by OpenGL automatically.
    This is the method we use in our implementation.


    # 8.4.3 Shadow Mapping (Pass Two)——Rendering the Scene with Shadows


    Much of pass two will resemble what we saw in Chapter 7. Namely, it is here that
    we render our complete scene and all of the items in it, along with the lighting,
    materials, and textures ordering the objects in the scene. We also need to add
    the necessary code to determine, for each pixel, whether or not it in shadow.


    An important feature of pass two is that it utilizes MVP matrices. One is the
    standard MVP matrix that transforms object coordinates into scene coordinates
    (seen in most of our previous examples). The other is the shadowMVP matrix that
    was generated in pass two for rendering from the light’s point of view—this will
    now be used in pass two for looking up depth information from the shadow texture.


    A complication arises in pass two when we try to look up pixels in a texture map.
    The OpenGL camera utilizes a [-1,1] coordinate space, where texture maps utilize
    a [0.1] space. A common solution is to use an additional matrix transform, typically
    $B$, that converts (“biases,” hence the name) from camera space to texture space.
    Deriving $B$ is fairly simple—a scale by one-half followed by a translate by one-half.


    $B$ matrix is as follows:


    $B = \begin{bmatrix} 0.5 & 0 & 0.5 \ 0 & 0.5 & 0.5 \ 0 & 0 & 1 \end{bmatrix}$


    $B$ is then concatenated onto the shadowMVP matrix for use in pass two, as follows:

    shadowMVP2 = [B] [shadowMVP_{(pass1)}]$'
