    The realism in an outdoor 3D scene can often be improved by generating a real-istic
    effect at the horizon. As we look beyond our buildings and trees, we are accustomed
    to seeing large distant objects as clouds, mountains, or the sun (or at night,
    the moon and stars). However, adding such objects to our scene as indi-ividual
    models may come at an unacceptable performance cost. A skybox or skydome provides
    a relatively simple way of efficiently generating a convincing horizon.


    # 9.1 SKYBOXES


    The concept of a skybox is a remarkably clever and simple one:


    +   1. Instantiate a cube object.

    2. Texture the cube with the desired environment.

    3. Position the cube so it surrounds the camera.


    We already know how to do all of these steps. There are a few additional details,
    however.


    +   How do we make the texture for our horizon?

    A cube has six faces, and we will need to texture all of them. One way is to use
    six image files and six texture units. Another common (and efficient) way is to
    use a single image that contains textures for all six faces, as shown in Figure
    9.1.'
