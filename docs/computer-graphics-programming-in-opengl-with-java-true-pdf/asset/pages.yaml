    \ 270\n\nWhile working at the Renault corporation in the 1950s and 1960s, Pierre\
    \ Bézier developed working software systems for designing automobile bodies. These\
    \ programs utilized mathematical systems of equations developed by Paul de Casteljau,\
    \ who was working for the competing Citroën automobile manufacturer [BE72, DC63].\
    \ The de Casteljau equations describe curves using just a few scalar parameters\
    \ and are accompanied by a clever recursive algorithm dubbed “de Casteljau’s algorithm”\
    \ for generating the curves to arbitrary precision. Now known as “Bézier surfaces,”\
    \ these methods are commonly used to efficiently model many kinds of curved 3D\
    \ objects.\n\n# 11.1 QUADRATIC BEZIER CURVES\n\nA Quadratic Bézier curve is defined\
    \ by a set of parametric equations that specify a particular curved shape using\
    \ three control points, each of which is a point in 2D space. Consider, for example,\
    \ the set of three points [p₀,p₁,p₂] shown in Figure 11.1.\n\n![](img/2c98d23f81c0609c29ed8f5a139a1e22_281_0.png)\n\
    \n> Of course, a curve can exist in 3D space. However, a quadratic curve lies\
    \ entirely within a 2D plane."
