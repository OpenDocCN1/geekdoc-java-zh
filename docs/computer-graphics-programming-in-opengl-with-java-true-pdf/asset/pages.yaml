- img_proc: true
  md: '# B.2.2 Modifying the GLSL Code


    Some changes will need to be made at various locations in our GLSL shader code
    (and some of the associated Java/OpenGL code) because of the slightly earlier
    version of OpenGL (specifically, 4.1) present in Macs:


    +   - The specified version in the shaders must be changed. Presuming that your
    Mac supports version 4.1, at the top of each shader locate the line that says


    ```

    #version 430

    ```


    and change it to


    ```

    #version 410

    ```


    +   - Version 4.1 doesn''t support layout binding qualifiers for texture sampler
    variables. This affects material starting from Chapter 5. You''ll need to remove
    the layout binding qualifiers and replace them with another command that accomplishes
    the same thing. Specifically, look for lines in the shaders that have the following
    format:


    ```

    layout (binding=0) uniform sampler2D sampler;

    ```


    The texture unit specified in the binding clause might be different (it is "0"
    here), and the name of the sampler variable might be different (it is "sam" here).
    In any case, you''ll need to remove the layout clause and simplify the command
    so that it just says


    ```

    uniform sampler2D sampler;

    ```


    Then you''ll need to add the following command to the Java program, for each texture
    enabled:


    ```

    glUniform1i(gl.getUniformLocation(renderingProgram, "sam"), 0);

    ```


    immediately after the glBindTexture() command in the Java display() function,
    where sam is the name of the uniform sampler variable and the 0 in the above example
    is the texture unit specified in the binding command that was removed earlier.'
