  md: '# 164 Computer Graphics Programming in OpenGL with Java, Second Edition


    It might seem redundant to include an ambient contribution for a light when we
    already have global ambient light. The separation of the two, however, is intentional
    and noticeable when the light is “on” or “off.” When “on”, the total ambient contribution
    would be increased, as expected. In the example above, we have included only a
    small ambient contribution for the light. It is important to balance the two contributions,
    depending on the needs of your scene.


    A positional light has a specific location in the 3D scene. Light sources that
    are near the scene, such as lamps, candles, and so forth, are examples. Like directional
    lights, the effect of a positional light depends on angle of impact; however,
    its direction is not specified, as is different for each vertex in our scene.
    Positional lights may also incorporate attenuation factors, in order to model
    how intensity diminishes with distance. As with the other types of lights we have
    seen, positional lights have ambient, diffuse, and specular properties specified
    by RGB values. A red positional light at (5,2,3) could for example be:


    ```

    float[] posLightAmbient = new float[]{0.1f, 0.0f, 0.0f, 0.1f};

    float[] posLightDiffuse = new float[]{1.0f, 0.0f, 0.0f, 1.0f};

    float[] posLightSpecular = new float[]{1.0f, 0.0f, 0.0f, 1.0f};

    float[] posLightLocation = new float[]{5.0f, -2.0f, -3.0f};

    ```


    Attenuation factors can be modeled in a variety of ways. One way is to include
    tunable non-negative parameters for constant, linear, and quadratic attenuation
    ($k_c, k_l, k_q$, respectively). These parameters are then combined, taking into
    account the distance ($d$) from the light source:


    > $attenuationFactor = \frac{1}{k_c + k_ld + k_qd^2}$


    Multiplying this factor by the light causes the intensity to be decreased the
    further the distance is the light source. Note that $k_c$ should always be greater
    than equal to 1, so that the attenuation factor will always be in the range $[0.1]$
    and approach 0 as the distance $d$ increases.


    Spotlights have both a position and direction. The effect of the spotlight’s “cone”
    can be simulated using a cutoff angle between $0^{\circ}$ and $90^{\circ}$, specifying
    the half-width of the light beam, and a falloff exponent to model the variation
    of intensity across the angle of the beam. As shown in Figure 7.2, we determine
    the angle'
