    (a) we like to perform this computation in the fragment shader, but the fragment
    shader does not have access to other pixels, and (b) obtaining a sufficiently
    broad penumbra effect (10 to 20 texels wide) would require sampling hundreds of
    nearby texels for each pixel being rendered.


    PCF addresses these two issues as follows. First, rather than attempting to access
    nearby pixels, we instead sample shadow map texels in the shadow map. The fragment
    shader can do this because though it doesn''t have access to nearby pixel values,
    it does access to the entire shadow map. Second, to achieve a sufficiently broad
    penumbra effect, a moderate number of shadow map texels are sampled, each at some
    modest distance from the texel corresponding to the pixel being rendered.


    The width of the penumbra and the number of points sampled can be tuned depending
    on the scene and performance requirements. For example, the image shown in Figure
