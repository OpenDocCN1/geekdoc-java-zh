    Most of the elements of Program 7.1 will be familiar. The torus, light, and materials
    properties are defined. Torus vertices and associated normals are loaded into
    buffers. The display() function is similar to that in previous programs, except
    that it also sends the light and material information to the vertex shader. To
    do this, it calls installLights(), which loads the light location and material
    characteristics into corresponding uniform variables to make available to the
    shaders. Note that we declared these uniform variables ahead of time, for performance
    reasons.


    An important detail is that the transformation matrix MV, used to move vertex
    positions into space view, doesn''t always adjust normal vectors into space view.
    Simply applying the MV matrix to the normals doesn''t guarantee that they will
    remain perpendicular to the object surface. The correct transformation is the
    inverse transpose of MV, as described earlier in the supplemental notes to Chapter
    3. In Program 7.1, this additional matrix, named "invTrMat", is sent to the shaders
    in a uniform variable.


    The lightPos contains the light''s position in camera space. We only need to compute
    this one per frame, as we do in installLights() (called from display()) rather
