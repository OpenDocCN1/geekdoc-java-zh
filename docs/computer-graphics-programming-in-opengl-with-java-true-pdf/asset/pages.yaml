    Perspective was one of the great discoveries of the Renaissance era in the 1400-1500s,
    when artists started painting with more realism than did their predecessors.


    An excellent example can be seen in Figure 3.14, the Annunciation, with St. Emidius
    by Carlo Crivelli, painted in 1486 at the National Gallery in London [CR86]. The
    intense use of perspective is clear—the receding lines of the left-facing wall
    of the building are slanted toward each other dramatically. This creates the illusion
    of depth and 3D space, and in the process lines that are parallel are not parallel
    in the picture. Also, the people in the foreground are larger than the people
    in the background. While today we take these devices for granted, finding a transformation
    matrix to accomplish this requires some mathematical analysis.


    We achieve this by using a matrix transform that converts parallel lines into
    non-parallel lines. Such a matrix is called a perspective matrix or perspective
    transform, and is built by defining the four parameters of a volume. Those parameters
    are (a) aspect ratio, (b) field of view, (c) projection plane or near clipping
    plane, and (d) far clipping plane.


    ![](img/2c98d23f81c0609c29ed8f5a139a1e22_74_0.png)


    Only objects between the near and far clipping planes are rendered. The near clipping
    plane also serves as the plane on which objects are projected, and is generally
    positioned close to the eye or camera (shown on the left in Figure 3.15). Selection
    of an appropriate value for the far clipping plane is discussed in Chapter 4.
    The field of view is the vertical angle of viewable space. The aspect ratio is
    the ratio width/height of the near and far clipping planes. The shape formed by
    these elements and shown in Figure 3.15 is called a frustum.'
