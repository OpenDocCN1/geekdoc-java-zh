  md: 'Substituting the definitions of $p_{12}$ and $p_{01}$ gives


    ```

    $P(t) = t[p_2 + (1-t)p_1] + (1-t)[p_1 + (1-t)p_0]$

    ```


    Factoring and combining terms gives


    ```

    $P(t) = (1-t)^2 p_0 + (-2t^2 + 2t)p_1 + t^2 p_2$

    ```


    or


    ```

    $P(t) = \sum_{i=0}^2 p_i B_i(t)$

    ```


    where


    ```

    $B_0(t) = (1-t)^2$

    $B_1(t) = -2t^2 + 2t$

    $B_2(t) = t^2$

    ```


    Thus, we find any point on the curve by a weighted sum of the control points.
    The weighting function $B$ is often called a “blending function” (although the
    name $B$ actually derives from Sergei Bernstein [BE16] first characterized this
    family of polynomials). Note that the blending functions are all quadratic in
    form, which is why the resulting curve is called a quadratic Bézier curve.


    # 11.2 CUBIC BÉZIER CURVE


    We extend our model to four control points, resulting in a cubic Bézier curve
    as shown in Figure 11.4. Cubic Bézier curves are capable of defining a much richer
    set of shapes than quadratic curves, which are limited to concave shapes.


    As for the quadratic case, we can derive an analytic definition for cubic Bézier
    curves:


    ```

    $p_{01}(t) = tp_1 + (1-t)p_0$

    $p_{12}(t) = tp_2 + (1-t)p_1$

    ```


    ![](img/2c98d23f81c0609c29ed8f5a139a1e22_283_0.png)


    > Figure 11.4

    Building a cubic Bézier curve.'
