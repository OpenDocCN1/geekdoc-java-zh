  md: '# Chapter 14 · Other Techniques 345


    The logistic function causes the colors to tend more toward white or blue, rather
    than values in-between, producing the visual effect of more distinct cloud boundaries.
    The variable cloudQuant adjusts the relative amount of white (versus blue) in
    the noise map, which in turn leads to more (fewer) generated white regions (i.e.,
    distinct clouds) when the logistic function is applied. The resulting skydome
    with more distinct cloud formations, is shown in Figure 14.22.


    ![](img/2c98d23f81c0609c29ed8f5a139a1e22_365_0.png)


    Figure 14.22

    Skyd with exponential cloud texture.


    Finally, real clouds aren''t static. To enhance the realism of our clouds, we
    should animate them by (a) making them move or "drift" over time and (b) gradually
    changing their form as they drift.


    One simple way of making the clouds "drift" is to slowly rotate the skydome. This
    isn''t a perfect solution, as real clouds tend to drift in a straight direction
    rather than rotating around the observer. However, if the rotation is slow and
    the clouds are simply for decorating a scene, the effect is likely to be adequate.


    Having the clouds gradually change form as they drift may at first seem tricky.
    However, given the 3D noise map we have used to texture the clouds, there is actually
    a very simple and clever way of achieving the effect. Recall that although we
    constructed a 3D texture map for clouds, we have so far used only "slice" of it,
    in conjunction with the skydome''s 2D texture coordinates (we set the "Z" coordinate
    of the texture lookup to a constant value). The rest of the 3D texture has so
    far gone unused.


    Our trick will be to replace the texture lookup''s "Z" coordinate with a variable
    that changes gradually over time. That is, as we rotate the skydome, we gradually
    increment the depth variable, causing the texture lookup to use a different slice.
    Recall that when we built the 3D texture map, we applied smoothing to the color
    changes along all three axes. So neighboring slices from the texture map are very
    similar, but slightly different. Thus, by gradually changing the "Z" value in
    the texture() call, the appearance of the clouds will gradually change.


    The code changes to cause the clouds to slowly move and change over time are shown
    in Program 14.8.'
