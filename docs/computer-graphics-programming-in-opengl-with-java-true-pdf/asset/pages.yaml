  md: 'The discard command should, if possible, be used sparingly, because it can
    incur a performance penalty. This is because its presence makes it more difficult
    for OpenGL to optimize Z-buffer testing.


    # SUPPLEMENTAL NOTES


    In this chapter, we used noise to generate clouds and to simulate both wood and
    a marble-like stone from which we rendered a dragon. People have many uses for
    noise. For example, it can be used to create fire and smoke [KE16, AF14], build
    realistic bump maps [GR05], and generate terrain, as in the videogame Minecraft
    [PE11].


    The maps produced in this chapter are based on procedures outlined by Lode Vandevenne
    [VA04]. There remain some deficiencies in our 3D cloud generation. The texture
    is not seamless, so at the 360° there is a noticeable vertical line. (This is
    also why we started the depth variable in Program 14.8 at 0.01 rather than 0.0—to
    avoiding the seam in the Z dimension of the noise map.) Simple methods exist for
    removing the seams [AS04], if needed. Another issue is at the northern peak of
    the skydome where the spherical distortion in the sky causes a punishing effect.


    The clouds we implemented in this chapter also fail to model some important aspects
    of real clouds, as the way that they scatter the sun’s light. Real clouds also
    tend to be more white on the top and gray at the bottom. Our clouds don''t achieve
    a 3D “Fluffy” look that many actual clouds have.


    Similarly, more comprehensive models exist for generating fog, as the one described
    by Kilgard and Fernando [KF03].


    While using the OpenGL documentation, the reader might notice that GLSL includes
    some noise functions named noise1(), noise2(), and noise4(), that are described
    as taking an input seed and producing Gaussian-like stochastic output. We didn''t
    use these functions in this chapter because as of this writing, most vendors have
    not implemented them. For example, many NVIDIA currently return 0 for these functions,
    regardless of the input seed.'
