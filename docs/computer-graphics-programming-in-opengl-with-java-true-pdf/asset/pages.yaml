  md: '# 6.1 PROCEDURAL MODELS—BUILDING A SPHERE


    Some types of objects, such as spheres, cones, and so forth, have mathematical
    definitions that lend themselves to algorithmic generation. Consider for a circle
    of radius R; coordinates of points around its perimeter are well-defined (Figure
    6.1).


    ![](img/2c98d23f81c0609c29ed8f5a139a1e22_154_0.png)


    We can systematically use our knowledge of the geometry of a circle to algorithmically
    build a sphere model. Our strategy is as follows:


    +   1. Select a precision representing a number of circular “horizontal slices”
    through the sphere. See the left side of Figure 6.2.

    2. Subdivide the circumference of each circular slice into some number of points.
    See the right side of Figure 6.2. More points and horizontal slices produces a
    more accurate and smoother model of the sphere. In our model, each slice will
    have the same number of points.


    ![](img/2c98d23f81c0609c29ed8f5a139a1e22_154_1.png)'
  merge: -1
