    # 8.1 THE IMPORTANCE OF SHADOWS


    In Chapter 7, we learned how to add lighting to our 3D scenes. However, we didn''t
    actually add light—instead, we simulated the effects of light on objects—using
    the ADS model—and modified how we drew those objects accordingly.


    The limitations of this approach become apparent when we use it to light more
    one object in the same scene. Consider the scene in Figure 8.1, which includes
    both our brick-textured torus and a ground plane (the ground plane is the top
    of a giant cube with a grass texture from [Lu6]).


    At first our scene may appear reasonable. However, closer examination reveals
    that there is something important missing. In particular, it is impossible to
    discern the distance between the torus and the large texture below it. Is the
    torus floating above the cube, or is it resting on top of the cube?


    ![](img/2c98d23f81c0609c29ed8f5a139a1e22_211_0.png)


    Figure 8.1

    Scene without shadows.'
