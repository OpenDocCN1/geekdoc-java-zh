    ```\n\n```\n// the indices for neighouring pixels in the X, Y, and Z directions\n\
    int x2 = (int)x1 + noiseWidth % noiseWidth;\nint y2 = (int)y1 + noiseHeight %\
    \ noiseHeight;\nint z2 = (int)z1 + noiseDepth % noiseDepth;\n```\n\n```\n// smooth\
    \ the value by interpolating the greyscale intensity along all three axes\ndouble\
    \ value = 0.0;\nvalue += (1-fractionX) * (1-fractionY) * (1-fractionZ) * noise[x1][(int)y1][(int)z1];\n\
    value += (1-fractionX) * fractionY * (1-fractionZ) * noise[x1][(int)y2][(int)z1];\n\
    value += (1-fractionX) * (1-fractionY) * fractionZ * noise[x1][(int)y1][(int)z2];\n\
    value += fractionX * (1-fractionY) * (1-fractionZ) * noise[x2][(int)y1][(int)z1];\n\
    value += fractionX * fractionY * (1-fractionZ) * noise[x2][(int)y2][(int)z1];\n\
    value += fractionX * (1-fractionY) * fractionZ * noise[x2][(int)y1][(int)z2];\n\
    value += fractionX * fractionY * fractionZ * noise[x2][(int)y2][(int)z2];\n```\n\
    \nThe Smooth() function calculates a greyscale value for each texel in the smoothed\
    \ version of a noise map by computing a weighted average of the eight greyscale\
    \ values surrounding the texel in the original “blocky” noise map. It, however,\
    \ averages the color of the texel at the eight vertices of the small “block” the\
    \ texel is in. The weights of each “neighbor” colors are based on the distance\
    \ of its neighbors, normalized to the range [0..1]."
