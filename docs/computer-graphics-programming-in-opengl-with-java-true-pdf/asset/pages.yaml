    #  4.6.1 Instancing


    **Instancing** provides a mechanism for telling the graphics card to render multiple
    copies of an object using only a single Java call. This can result in a significant
    performance benefit, particularly when there are thousands or millions of copies
    of the object being drawn—such as rendering many flowers in a field, or many zombies
    in an army.


    We start by changing the glDrawArrays() call in our Java/JGL application to glDrawArraysInstanced().
    Now we can use OpenGL to draw as many copies as we want. We can specify drawing
    24 cubes as follows:


    ```

    glDrawArraysInstanced(GL_TRIANGLES, 0, 36);

    ```


    When using instancing, the vertex shader has access to a built-in variable, gl_InstanceID,
    an integer that refers to numeric instance of the object is currently being processed.


    To replicate our tumbling cubes example using instancing, we will need to compute
    the computations that build the different model matrices (previously inside a
