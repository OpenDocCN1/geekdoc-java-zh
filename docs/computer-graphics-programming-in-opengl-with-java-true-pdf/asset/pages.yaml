  md: 'The ModelImporter class includes a parseOBJ() function that reads in each line
    of an OBJ file one-by-one, handling separately the cases v, vt, vn, and f. In
    each case, the subsequent numbers are extracted, first using substring() to skip
    the initial v, vt, vn, or f character(s) and then using the iterator returned
    by the split() function to extract each subsequent parameter value, storing them
    in an ArrayList. The face (f) entries are processed, the vertices are built, with
    corresponding entries in parallel arrays for vertex positions, texture coordinates,
    and normal vectors.


