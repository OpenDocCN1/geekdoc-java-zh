  md: '# Chapter 2 · The OpenGL Graphics Pipeline 25


    Enabling debugging causes glError() to be invoked at each OpenGL call. Although
    any error messages generated to not be as informative as the case when retrieving
    the error codes as shown in Program 2.3, it can be a quick way of narrowing down
    the little location where an error has occurred.


    Enabling tracing causes a line of output on the command window to be displayed
    for each OpenGL call executed—including those called directly by the application,
    and invoked by JOGL. For example, a trace for Program 2.2 produces the output
    following, which reflects the order of calls in a typical run:


