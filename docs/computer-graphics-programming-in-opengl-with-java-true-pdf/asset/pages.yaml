    \ = (byte)c.getBlue();\n      data[i*noiseWidth*noiseHeight+j*noiseHeight+k*4+3]\
    \ = 255;\n    }\n  }\n}\nThe resulting value of the noise map can now be used\
    \ to texture a skydome. Recall that a skydome is a sphere or half-sphere that\
    \ is textured, rendered with depth testing disabled, and so that it surrounds\
    \ the camera (similar to a skybox).\n```\n\nOne way of building the skydome to\
    \ texture it is in the same way as we have for other 3D textures, using the vertex\
    \ coordinates as texture coordinates. Instead produces patterns that look more\
    \ like clouds, However, it turns out that using the skydome's 2D texture coordinates\
    \ is better, because the spherical distortion slightly stretches the texture map\
    \ horizontally. We can grab a 2D slice from the noise map by setting the third\
    \ dimension in the GLSL texture() call to a constant value. Assuming that the\
    \ skydome's texture coordinates have been sent to the OpenGL pipeline in a vertex\
    \ attribute, in the standard way, the fragment shaders use it with a 2D slice\
    \ of the noise map:\n\n```\n#version 430\nin vec2 tc;\nout vec4 fragColor;\nuniform\
