  md: '5. It is also desirable to generate normal vectors—vectors that are perpendicular
    to the model''s surface—for each vertex. We will use them soon, in Chapter 7,
    for lighting.


    Determining normal can be tricky, but in the case of a sphere, the vector pointing
    from the center of the sphere to a vertex happens to conveniently equal the normal
    vector for that vertex! Figure 6.6 illustrates this property (the center of the
    sphere is indicated with a “star”).


    ![](img/2c98d23f81c0609c29ed8f5a139a1e22_156_0.png)


    Some models define triangles using indices. Note in Figure 6.3 that each vertex
    appears in multiple triangles, which would lead to each vertex being specified
    multiple times. Rather than doing this, we store each vertex once, and then specify
    indices for each corner of a triangle, referencing the desired vertices. Since
    we will store a vertex''s location, texture coordinates, and normal vector, this
    can facilitate memory savings for large models.


    The vertices are stored in a one-dimensional array, starting with the vertices
    in thebottom horizontal slice. When using indexing, the associated array of indices
    includes an entry for each triangle corner. The contents are integer references
    (specifically, subscripts) into the vertex array. Assuming each slice contains
    n vertices, the vertex array would look as shown in Figure 6.7, along with an
    example portion of the corresponding index array.'
