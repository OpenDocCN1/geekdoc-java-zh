  md: 'The output of Program 7.1 is shown in Figure 7.9.


    The vertex shader contains our first example using the struct notation. A GLSL
    “struct” is like a datatype; it has a name and a set of fields. When a variable
    is declared using the name of a struct, it then contains fields using the “” notation.
    For example, “light” is declared of type “PositionalLight” so we can refer to
    its fields light.ambient, light.diffuse, and so forth.


    ![](img/2c98d23f81c0609c29ed8f5a139a1e22_199_0.png)


    Figure 7.9

    Torus with Gouraud shading.


    Also note the field selector notation “xyz” that is used in several places in
    the vertex shader. This is a shortcut for converting a vec4 to an equivalent vec3
    containing only its three elements.


    The vertex shader is where most of the lighting computations are performed. For
    each vertex, the appropriate matrix transforms are applied to the vertex position
    and associated normal vector, and vectors for light direction (L) and reflection
    (R). The ADS computations described in Section 7.4 are performed, resulting in
    a color for each vertex (called varyingColor in the code). The colors are interpolated
    as part of the normal rasterization process. The fragment shader is also present
    in the fragment shader (for reasons declared earlier in Chapter 4), but none of
    them are actually used.


    Note the use of the GLSL functions normalize() , which converts a vector to unit
    length and is necessary for proper application of the dot product, and reflect()
    , which computes the reflection of one vector about another.


    Artifacts are evident in the output torus shown in Figure 7.9. Specular highlights
    are a blocky, faceted appearance. This artifact is pronounced if the object is
    in motion (we can’t illustrate that).


    Gouraud shading is susceptible to other artifacts. If the highlight highlight
    entirely contained within one of the model’s triangles—that is, it doesn’t contain
    at least one of the model vertices—then it may disappear entirely. The specular
    component is calculated per-vertex, so if a model vertex with a specular contribution
    does not exist, none of the rasterized pixels will include light either.'
