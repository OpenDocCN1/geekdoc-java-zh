  md: '# Chapter 5 · Texture Mapping


    Mipmapping is richly supported in OpenGL. There are mechanisms provided for building
    your mipmap levels or having OpenGL build them for you. In most cases, the mipmaps
    are built automatically by OpenGL. This is sufficient. By adding the following
