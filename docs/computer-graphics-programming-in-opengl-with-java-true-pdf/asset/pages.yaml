    # 8.3 SHADOW VOLUMES


    Another important method, proposed by Crow in 1977, is to identify the spatial
    volume shadowed by an object, and reduce the color intensity of polygons inside
    the intersection of the shadow volume with the view volume [CR77]. Figure 8.4
    shows a cube in a shadow volume, so the cube would be drawn darker.


    Shadow volumes have the advantage of being accurate, with fewer artifacts than
    other methods. However, finding the shadow volume, and then computing whether
    each polygon is inside of it, is computationally expensive even on modern GPU
    hardware. Geometry shaders can be used to generate shadow volumes, and the stencil
    buffer¹ can be used to determine whether a pixel is within the volume. Some graphics
    cards include hardware support for optimizing certain shadow volume operations.


    ![](img/2c98d23f81c0609c29ed8f5a139a1e22_213_1.png)


    Figure 8.4

    Shadow volume.


    ¹ The stencil buffer is a third buffer—along with the color buffer and the z-buffer—accessible
    through OpenGL. The stencil buffer is not described in this textbook.'
