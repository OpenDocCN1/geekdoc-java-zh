    arrays of Vector3f and Vector2f objects. Recall these as JOWL classes; we use
    them to store vertex positions, texture coordinates, and normal vectors. The accessors
    in the ImportedModel class then make them available to the Java/JGL application
    in the same manner as was done in the Sphere and Taurus classes.


