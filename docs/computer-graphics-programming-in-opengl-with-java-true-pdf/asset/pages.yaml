  md: '# 76 Computer Graphics Programming in OpenGL with Java, Second Edition


    enable subsequent OpenGL calls to determine the shader''s vertex attribute and
    uniform locations. The display() function gets the uniform variable locations;
    builds the perspective, view, and model matrices; concatenates the view and model
    matrices into a single MV matrix; and assigns the MV matrices to their corresponding
    uniforms.


    Next, display() enables the buffer containing the cube vertices and attaches it
    to 0th vertex attribute to prepare for sending the vertices to the shader.


    The last thing display() does is draw the model by calling glDrawArrays(), specifying
    that the model is composed of triangles and has three vertices. The glDrawArrays()
    is typically preceded by additional commands that add rendering vertices for this.
    In example, there are two such commands, both of which are related to depth testing.
    Recall from Chapter 2 that depth testing is used by OpenGL to perform surface
    removal. Here we enable depth testing, and specify the particular depth test we
    use with OpenGL. The settings shown correspond to the description in Chapter 2;
    later in the book we will see others for these commands.


    Finally, consider the shaders. First, note that both include the same block of
    uniform variable declarations. Although this is not always required, it is often
    a good practice to include the same block of uniform variable declarations in
    all of the shaders within a particular rendering program.


    Note also in the vertex shader the presence of the layout qualifier on the incoming
    vertex attribute. Since the location is specified as "0" the display() function
    can reference this variable by using 0 in the first parameter of glVertexAttribPointer()
    function call, and in glEnableVertexAttrib() function call. Note that the position
    attribute is a vec3, so it needs to be converted to a vec4 to be compatible with
    the 4x4 matrices it will be multiplied. This conversion is done using vec4(position,1,0),
    which builds a vec4 of the variable named “position” and puts a value of 1.0 in
    the newly fourth spot.


    > 3 An reader may notice that it shouldn''t be necessary to build the perspective
    matrix every time display() is called, because its value doesn''t change. This
    is partially true—the perspective matrix would need to be recomputed if the user
    were to resize the window the program was running. In Section 4.1 we will handle
    this situation more efficiently, and in the process we will move the computation
    of the perspective matrix out of display() and into the init function


    > 4 Often, these calls may be placed in init() rather than display(). However,
    it is necessary to place one or more in display() when drawing multiple objects
    with different properties. For simplicity, we always place them in display().'
