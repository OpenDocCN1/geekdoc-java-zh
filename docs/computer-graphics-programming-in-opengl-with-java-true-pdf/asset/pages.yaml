    # 10.3 HEIGHT MAPPING


    We extend the concept of normal mapping—where a texture is used to perturb normals—instead
    perturb the vertex locations themselves. Actually modifying an object''s geometry
    in this way has certain advantages, such as making the surface features visible
    along the object''s edge and enabling the features to respond to shadow mapping.
    It can also facilitate terrain, as we will see.


    A practical approach is to use a texture image to store height values, which can
    be used to raise (or lower) vertex locations. An image that contains height information
    is called a height map, and using a height map to alter an object''s vertices
    is called height mapping. Height maps usually encode height information as grayscale
    colors: (0,0) (black) = low height and (1,1) (white) = high height. This makes
    it easy to create height maps algorithmically, or by using a “paint” program.
    The higher the contrast, the greater the variation in height expressed by the
    map. These concepts are illustrated in Figure 10.12 (showing a randomly generated
    map) and Figure 10.13 (showing a map with an organized pattern).


    The usefulness of altering vertex locations depends on the model being altered.
    Vertex mapping is easily done in the vertex shader, and when there is a high level
    of detail in the model vertices (such as in a sphere with sufficiently'
