    \ misty clouds look nice, we would like to shape them—that is, make more or less\
    \ hazy. One way of doing this is to modify the turbulence() function so that it\
    \ uses an exponential, as a logistic function, to make the clouds look more \"\
    distinct\". The modified turbulence() function is shown in Program 14.7, with\
    \ an associated logistic() function. The complete Program 14.7 incorporates the\
    \ smooth(), fillDataArray(), and generateNoise() functions described earlier.\n\
    \n# Program 14.7 Cloud Texture Generation\n\nJava/JGL application:\n\n```\nprivate\
    \ double turbulence(double x, double y, double z, double size)\n    { double value\
    \ = 0.0, initialState = size, cloudQuant;\n        while(size >= 0.9)\n      \
    \      { value = smoothNoise(x/size, z/size) * size;\n            size = size\
    \ / 2.0;\n        }\n        float cloudQuant = 110.0; // tunnel quantity of clouds\n\
    \        value = value / initialState;\n        value = 256.0 * logistic(value\
    \ * 128.0 - cloudQuant);\n        return value;\n    }\n```\n\n```\nprivate double\
    \ logistic(double x)\n    { double k = 0.2; // tunnel hazel of clouds, produces\
    \ more or less distinct cloud boundaries\n        return (1.0 / (1.0+Math.pow(2.718,-k*x)));\n\
    \    }\n```\n\n2 A \"logistic\" (or \"sigmoid\") function has an S-shaped curve\
    \ with asymptotes on both ends. Common examples are hyperbolic tangent and f(x)\
    \ = 1/(1+e^-x). They are also called \"squashing\" functions."
