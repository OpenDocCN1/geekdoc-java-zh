    # SUPPLEMENTAL NOTES


    Researchers have developed a number of uses for texture units beyond just texturing
    models in a scene. In later chapters, we will see how texture units can be used
    for altering the light reflects off an object, making it appear blurry. We can
    also use a texture to store "height maps" for generating terrain and for storing
    "shadow maps" to efficiently add shadows to our scenes. These uses will be described
    in subsequent chapters.


    Shaders also use shaders to modify texture images, or even copy part of one texture
    into some portion of another texture.


    Mipmaps and anisotropic filtering are not only the tools for reducing aliasing
    artifacts in textures. Full-scene anti-aliasing (FSAA) and other supersampling
    methods, for example, can also improve the appearance of textures in a 3D scene.'
