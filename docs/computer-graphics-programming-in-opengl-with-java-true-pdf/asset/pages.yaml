  md: 'Start by examining the function near the end of the Java/JOGL listing, setupVertices(),
    called by init(). At the start of this function, an array is called vertexPositions
    that contains the 36 vertices comprising the cube. At first you might wonder why
    this cube has 36 vertices, when logically a cube should only require eight. The
    answer is that we need to build our cube out of triangles, and each of the six
    cube needs to be built of triangles, for a total of 6x2=12 (see Figure 4.4). Since
    each triangle is specified by three vertices, this totals 36 vertices. Since each
    vertex has three values (x,y,z), there are a total of 36*3=108 values in the array.
    It is true that each vertex participates in multiple triangles, but we specify
    each vertex separately because we are sending each triangle''s vertices down the
    pipeline separately.


    ![](img/2c98d23f81c0609c29ed8f5a139a1e22_95_0.png)


    The cube is defined in its unit coordinate system, with (0,0,0) at its center,
    with its corners ranging from -1.0 to +1 along the x, y, and z axes. The rest
    of the setupVertices() function sets up the VAO, two VBOs (although only one is
    used), and loads the cube vertices into the OBO buffer.


    Note that the init() function performs tasks that only need to be done: reading
    in the shader code and building the rendering program, and loading the cube into
    the buffer (by calling “setupVertices()”). Note that it also positions the cube
    and the camera in the world; we will animate the cube and also see how to move
    the camera around, at which point we may need to remove this hardcoded positioning.


    Now let''s look at the display() function. Recall that display() may be called
    repeatedly at the rate which it is called as the frame rate. That is, animation
    by continuously drawing and redrawing the screen, very quickly. It is usually
    necessary to clear the depth buffer before rendering a frame, so that not clearing
    the depth buffer results in every surface being removed, resulting in a completely
    black screen. By default, depth values in OpenGL range from 0.0 to 1.0. Clearing
    the depth buffer is done by calling glClear(GL_DEPTH_BUFFER_BIT), which fills
    the depth buffer with the default value (usually 1.0).


    Next, display() enables the shaders by calling glUseProgram(), installing the
    GLSL code on the GPU. Recall this doesn''t run the shader program, but it does'
