    # ## 4.7 RENDERING MULTIPLE DIFFERENT MODELS IN A SCENE


    To render more than one model in a single scene, a simple approach is to use a
    separate buffer for each model. Each model will need its own model matrix, and
    thus a new model-view matrix will be generated for each model that we render.
    There will also need to be separate calls to glDrawArrays() for each model. There
    are changes both in init() and display().


    Another consideration is whether or not we will need different shaders—or a different
    rendering program—for each of the objects we wish to draw. As it turns out, in
    many cases we can use the same shaders (and thus the same rendering program) for
    the various objects we are drawing. We usually only need to employ different rendering
    programs for the various objects if they are built of different primitives (such
    lines instead of triangles), or if there are complex lighting or other effects
    involved. For now, that isn''t the case, so we can reuse the same vertex and fragment
    shaders, and just modify our Java/JGL application to send each model down the
    pipeline with display() is called.'
