  md: 'This makes it very easy to specify that an object has, say, a “gold” material,
    in either the init(Ambient) function or in the top-level declarations, as follows:


    ```

    float ] matAmbient = Utils.goldAmbient();

    float ] matDiffuse = Utils.goldDiffuse();

    float ] matSpecular = Utils.goldSpecular();

    float ] matShiness = Utils.goldShiness();

