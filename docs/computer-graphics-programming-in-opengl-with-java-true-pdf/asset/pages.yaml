  md: 'In 2009, version 3.1 removed a large number of features that had been deprecated,
    to enforce the use of shader programming as opposed to earlier approaches (referred
    to as “immediate mode”).¹ Among the most recent features, version 4.0 (in 2010)
    added a tessellation stage to the programmable pipeline.


    This textbook assumes that the user is using a machine with a graphics card that
    supports at least version 4.3 of OpenGL. If you are not sure which version of
    OpenGL your GPU supports, there are free applications available on the web that
    can be used to find out. One such application is GLView, by a company named “realtech
    VR”[GV6].


    # 1.1.3 JOGL


    JOGL is a set of OpenGL bindings (sometimes called a “wrapper”) which provides
    a mechanism for invoking C-based OpenGL functions from Java code. JOGL first appeared
    in 2003, published on the website Java.net. Since 2010 it has been an independent
    open source project, part of a set of Java bindings maintained by JoAmp[JO06],
    an online community of developers. JoAmp also maintains JOAL and JOCL, bindings
    for OpenAL and OpenCL, respectively. As new versions of OpenGL and/or Java are
    released, new versions of JOGL are developed to support continued compatibility.
    JoAmp maintains a short user’s guide that includes valuable guidelines for installing
    and using JOGL efficiently and effectively[JU16]. This book assumes at least version
    2.3 of JOGL.


    # 1.1.4 JOML


    3D graphics programming makes heavy use of vector and matrix algebra. For this
    reason, use of OpenGL is greatly facilitated by an accompanying function library
    or class package to support common mathematical tasks. For example, the popular
    OpenGLBible[SW15] utilizes a C library called “math”; in this book, we use a Java
    library called Java Math Library, or JOML.


    JOML provides classes and basic math functions related to graphics concepts, such
    as vector, matrix, and quaternion. It also contains a variety of utility classes
    for creating and using 3D graphics structures, such as a stack for building


    > Despite this, many graphics manufacturers (notably NVIDIA) continue to use deprecated
