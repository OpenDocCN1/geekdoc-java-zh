  md: '# 8.4 SHADOW MAPPING


    One the most practical and popular methods for casting shadows is called shadow
    mapping. Although it is not as accurate as shadow volumes (and is often accompanied
    by pesky artifacts), shadow mapping is easier to implement, can be used in a wide
    variety of situations, and enjoys powerful hardware support.


    We would be remiss if we failed to clarify our use of the word easy in the previous
    paragraph. Although shadow mapping is simpler than shadow volumes (both conceptually
    and in practice), it is by no means "easy! Students often find shadow mapping
    among the most difficult techniques to implement in a 3D graphics course. Shader
    programs are by nature difficult to debug, and shadow mapping requires the perfect
    coordination of several components and shader modules. We are advised that successful
    implementation of shadow mapping will be greatly facilitated by liberal use of
    the debugging tools described earlier in Section 2.2.


    Shadow mapping is based on a very simple and clear idea—namely, anything that
    cannot be seen by the light is in shadow. That is, if object #1 blocks the light
    from reaching object #2, it is the same as the light not being able to “see” object
    #2.


    The reason this is so powerful is that we have already have a method for determining
    whether it can be “seen”—the hidden surface removal algorithm (HSR) using the
    Z-buffer, as described in Section 2.1.7. A strategy for finding shadows is to
    temporarily move the camera to the location of the light, apply the Z-buffer HSR
    algorithm, and then use the resulting depth information to find shadows.


    Rendering our scene will require two passes: one to render the scene from the
    point of view of the light (but not drawing it to the screen) and a second pass
    to render it from the point of view of the camera. The purpose of pass one is
    to generate a Z-buffer from the light’s point of view. After completing pass one,
    we need to retain the Z-buffer and use it to help us generate shadows in pass
    two. Pass two actually draws the scene.


    Our strategy is becoming more refined:


    +   (Pass 1) Render the scene from the light’s position. The depth buffer contains,
    for each pixel, the distance between the light and the nearest object to it.


    +   Copy the depth buffer to a separate “shadow buffer.”'
