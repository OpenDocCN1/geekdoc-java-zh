    There are many different techniques for rendering Bézier curves. One approach
    is to iterate through successive values of $t$, starting at 0.0 and ending at
    1.0, using a fixed increment. For instance, if the increment is 0.1, then we use
    a loop with $t$ values 0.0, 0.1, 0.2, 0.3, and so on. For each value of $t$, the
    corresponding point on the Bézier curve would be computed and a series of lines
    connecting the successive points would be drawn, as described in the algorithm
    in Figure 11.5.


