    # ### 2.1.4 Geometry Shader


    We cover the geometry shader in Chapter 13. Whereas the vertex shader gives the
    programmer the ability to manipulate one vertex at a time (i.e., “per-vertex"
    processing), and the fragment shader (as we will see) allows manipulating one
    pixel at a time ("per-fragment" processing), the geometry shader provides the
    capability to manipulate one primitive at a time—"per-primitive" processing.


    Recalling the most common primitive is the triangle, by the time we have reached
    the geometry stage, the pipeline must have completed grouping the vertices into
    triangles (a process called primitive assembly). The geometry shader then makes
    all three vertices in each triangle accessible to the programmer simultaneously.


    There are many uses for per-primitive processing. The primitives could be altered,
    such as stretching or shrinking them. Some of the primitives could be deleted,
    putting "holes" in the object being rendered——this is one way of turning a simple
    model into a more complex one.


    The geometry shader also provides a mechanism for generating additional primitives.
    Here, too, opens the door to many possibilities for turning simple models into
    more complex ones.


    An interesting use for the geometry shader is adding surface texture such as bumps
    or scales—even "hair" or "fur”—to an object. Consider for example, the simple
    torus shown in Figure 2.7 (we will see how to generate this later in the book).
    The surface of this torus is built out of hundreds of triangles. If at each triangle,
    we use a geometry shader to add additional triangles that face outward, we get
    the result shown in Figure 2.8. This "scaly torus" would be computationally expensive
    to try and model from scratch in the Java/JOGL application side.'
