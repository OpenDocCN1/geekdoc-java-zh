  md: '# 2 Computer Graphics Programming in OpenGL with Java, Second Edition


    Using OpenGL with Java requires configuring several libraries. In this section,
    we describe which libraries are needed, some common options for each, and the
    option(s) that we will use throughout the book. Details on how to install and
    configure these libraries for your specific platform can be found in the appendices.


    Running the programs in this book requires the following languages and libraries:


    +   - Java

    - OpenGL / GLSL

    - JOGL

    - JOML


    It is likely that the reader will need to do a few preparatory steps to ensure
    that each of these are installed and properly accessible on his or her system.
    The following subsections we briefly describe each of them; see the appendices
    for details on how to install and/or configure them for use.


    # 1.1. Java


    Java was developed at Sun Microsystems in the early 1990s, and the first stable
    release of a development kit (JDK) occurred in 1995. In 2010, Oracle Corporation
    acquired Sun and has maintained Java since that time [OR16]. This book assumes
    at least Java version 8, which was released in 2014.


    # 1.1.2 OpenGL / GLSL


    1.0 OpenGL appeared in 1992 as an "open" alternative to vendor-specific application
    programming interfaces (APIs) for computer graphics. Its specification and development
    was managed and controlled by the OpenGL Architecture Review Board (ARB), which
    a newly formed group of industry participants. In 2006 the ARB transferred control
    of the OpenGL specification to the Khronos Group, a nonprofit consortium that
    manages not only the OpenGL specification but a wide variety of other open industry
    standards.


    Since its beginning OpenGL has been revised and extended regularly. In 2004, version
    2.0 introduced the OpenGL Shading Language (GLSL), allowing "shader programs"
    to be installed and run directly in graphics pipeline stages.'
