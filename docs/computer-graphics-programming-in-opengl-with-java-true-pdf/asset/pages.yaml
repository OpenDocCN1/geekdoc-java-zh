  md: '# Appendix B · Installation and Setup for Macintosh


    # B.1.4 Installing JOML


    To install JOML, visit the JOML GitHub page and click on “Releases,” or navigate
    directly to the Releases page [J17]. You''ll probably want to download the latest
    version (1.9.11 of this writing), specifically the .jar file named jom-1.9.11.jar.


    After downloading the .jar file, move it to wherever you would like to store JOML
    on your machine Then add the full path name of the .jar file to your CLASSPATH
    environment variable.


    There is a lot of helpful reference material on JOML and how to most effectively
    use it. Especially two pages worth bookmarking:


    +   - the readme using JOML with JOGL [JJ17]

    - the JOML Wiki [JW17]


    # B.2 MODIFYING THE JAVA/OPENGL/GLSL APPLICATION CODE FOR THE MAC


    For the most part, the Java programs themselves, as described in this textbook,
    will run as-is. There are, however, a small number of changes that must be made.
    Some of these changes won''t make sense until one has studied the corresponding
    programming sections in the text. The reader may need to skip parts of this section
    and return to it later while learning the material in question. Despite the possible
    risk of confusion, we have decided to place all of the code changes for the Macintosh
    here, so that they are assembled in one place.


    # B.2.1 Modifying the Java Code


    Many Macs default to much earlier versions of OpenGL. To use of the latest version
    of OpenGL on the hardware, in each of the code examples in this book replace the
    line of code


    ```

    myCanvas = new GLCanvas();

    ```


    with the following lines:


    ```

    GLProfile glp = GLProfile.getMaxProgrammableCore(true);

    GLCapabilities caps = new GLCapabilities(glp);

    myCanvas = new GLCanvas(caps);

    ```'
