    We might ordinarily expect a “get” function to return these values in an object
    as an array (as is done in other math libraries such as glm or graphics3D). However,
    JOML instead requires that a parameter be included in the call to get(), and then
    uses this parameter for the destination where we place the retrieved matrix values.
    What makes this so clever is that the JOML get() function also returns a reference
    to the user-supplied destination object, so that the call to get() can be placed
    directly into the glUniformMatrix4fv() call (which is expecting such a reference).
    Note that that we have declared and allocated this variable in the declaration
    block outside of display() (along with all of the other variables in display()).
    In a sense, the get() is actually doing a sort of “put,” but when implemented
    in this manner fulfills the needs of a “get” function in OpenGL, albeit much more
    efficiently.


    In keeping with the recommendations of JOML developers, we have used the form
    of get() that extends a FloatBuffer to the destination parameter. JOG allows transferring
    either buffer or an array to a structured uniform (such as mat4 or vec4). But
    performance is slightly better when using buffers, particularly because JOML forces
    the use of only direct NIO buffers, as opposed to buffers that are wrappers for
    Java primitive types.


    # 4.1.2 Pre-Computing the Perspective Matrix


    Another optimization that can be done to reduce overhead in the display() function
    is to move the computation of the perspective matrix into the init() function.
    We mentioned this possibility earlier in Section 4.5 (well, in a footnote). While
    this is certainly easy to do, there is one slight complication. Although it is
    not necessary to recompute the perspective matrix, it would if the user running
    the application resizes the window (such as dragging the window resize handle).


    Fortunately, JOGL automatically makes a call to reshape() whenever the window
    is resized. So far, we have left the reshape() function empty—now we have a use
    for it. We simply move the code that computes the perspective matrix into init(),
    and also copy it into reshape().'
