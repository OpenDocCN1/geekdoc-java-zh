  md: "# Fragment Shader:\n\n```\n#version 430\nin vec2 tc;                 // texture\
    \ coordinates for this fragment\nin vec3 i_origPos;        // original vertex\
    \ positions in the model, for accessing 3D texture\n\nlayout(binding=0) uniform\
    \ sampler3d n;   // sampler for noise texture\nlayout(binding=1) uniform sampler2d\
    \ e; // sampler for earth texture\n\nuniform float threshold;               //\
    \ threshold for retaining or discarding fragment\nvoid main(void) {\n    float\
    \ noise = texture(n,origPos).x;     // retrieve value for this fragment.\n   \
    \ if (noise > threshold) {               // if the noise value > current threshold\
    \ value,\n        fragColor = texture(e, tc);         // render the fragment using\
    \ the earth texture.\n    } else {\n        discard;                         \
    \   // otherwise, discard the fragment (do not render it)\n    }\n}\n```\n\n![](img/2c98d23f81c0609c29ed8f5a139a1e22_369_0.png)\n\
