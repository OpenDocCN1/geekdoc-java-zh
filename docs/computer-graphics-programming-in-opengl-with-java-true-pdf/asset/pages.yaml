  md: 'surfaces, we will refer to the parameters as **u** and **v**. Whereas our curves
    are composed of points P(t), our surfaces comprise points P(u,v), as shown in
    Figure 11.8.


    For quadratic Bézier surfaces, there are three control points on each axis u and
    v, for a total of nine control points. Figure 11.9 shows an example of a set of
    nine control points (typically called a *control point mesh*) in blue, and the
    associated curved surface (in red).


    ![](img/2c98d23f81c0609c29ed8f5a139a1e22_287_0.png)


    **Figure 11.8**nParametric surface.


    The nine control points in the mesh are labeled $p_{ij}$, where $i$ and $j$ represent
    the indices in the u and v directions, respectively. Each set of three adjacent
    control points, such as $(p_{00}p_{01}p_{02})$, defines a Bézier curve. Points
    on the surface are defined as sum of two blending functions, one in the u direction
    and one in the v direction. The form of the two blending functions for building
    Bézier surfaces then follows from the methodology used previously for Bézier curves:


    ![](img/2c98d23f81c0609c29ed8f5a139a1e22_287_1.png)


    **Figure 11.9**nQuadratic Bézier control mesh and corresponding surface.


    ```

    $B_0(u) = (1-u)^2$

    $B_1(u) = -2u^2 + 2u$

    $B_2(u) = u^2$

    $B_0(v) = (1-v)^2$

    $B_1(v) = -2v^2 + 2v$

    $B_2(v) = v^2$

    ```


    The points P(u,v) comprising the Bézier surface are then generated by the product
    of each control point $P_{ij}$ and the $i$th and $j$th blending functions evaluated
    at parametric values $u$ and $v$, respectively:


    ```

    $P(u,v) = \sum_{i=0}^2 \sum_{j=0}^2 P_{ij} B_i(u) B_j(v)$

    ```'
