- img_proc: true
  md: 'what version of OpenGL your machine supports, you can use one of the various

    free applications (such as GLView [GV16]) to find out.


    # A.1.3 Installing JOGL


    To install JOGL, visit the JogAmp website [JO16], http://jogamp.org. There,

    as of this writing (September 2018), the current version of JOGL is found in the

    Builds/Downloads section—look under Current and click on [zip]. The latest

    JOGL files are then displayed in a folder named /deployment/jogamp-current/archive.

    Download the following:


    ```

    jogamp-all-platforms.7z

    jogl-javadoc.7z

    ```


    Unzip these files into the folder on your machine where you would like to

    store the JOGL. A typical location in Windows could be, for example, in a

    folder named “JOGL” at the root of the C: drive.


    The unzipped jogamp-all-platforms contains a folder named jar which contains

    two important files that will be used by your applications:


    ```

    jogl-all.jar

    glueen-rt.jar

    ```


    Add the full path name of each of these two files to your CLSPATH environ-

    ment variable.


    After you have copied the above files onto your machine, go into the jogl-

    javadoc folder and double-click the file named index.html. This opens the JOGL

    javadocs in a browser, which you should then bookmark for reference.


    # A.1.4 Installing JOML


    To install JOML, visit the JGitHub page and click on “Releases,” or

    nav directly to the Releases page [JR17]. You will probably want to download

    the latest version (1.9.11 at the time of this writing), specifically the .jar
    file named

    jom-1.9.11.jar. This file is also available on the companion CD distributed with

    this book.'
