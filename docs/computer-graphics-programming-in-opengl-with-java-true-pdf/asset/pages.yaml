    # 5.12 LOADING TEXTURE IMAGE FILES USING AWT CLASSES


    Throughout the rest of this textbook we use the JOGL Texture, TextureID, and TexturedData
    classes as described earlier in this chapter to load texture image data into OpenGL
    objects. However, it is possible to load texture image data into OpenGL objects
    *directly*, using Java AWT classes and some additional OpenGL commands. The process
    is quite more complicated, so for simplicity and clarity we will use the JOGL
    classes in this book whenever possible. However, it is useful to understand the
    process (and the particular commands) one could use in lieu of the JOGL texture
    classes. For example, the JOGL texture classes do not support 3D textures, so
    we will see later, building an OpenGL 3D texture object will require many of the
    steps ourselves in Java. We will also use these steps when building skyboxes,
    as described in Chapter 9.


    Building a texture-loading function analogous to the one in Program 5.1 using
    JOGL texture classes is shown in Program 5.2. To avoid confusion, we will call
    `loadTextureAWT()`. It starts by calling two utility functions (also shown). The
    first one is `getBufferedImage()`, which returns the specified image file, assumed
    to be in a recognized format as *.jpg* or *.png*, and returns a Java BufferedImage
    containing the image data. The second utility function, `getRGBAPixelData`, extracts
    the RGBA pixel colors from the specified BufferedImage and returns them in a byte
    array organized in the format expected by OpenGL. It is in function that we may
    or not flip the image vertically (specified by a boolean parameter) as described,
    depending on the application.


    The `loadTextureAWT()` function continues by copying the byte array returned from
