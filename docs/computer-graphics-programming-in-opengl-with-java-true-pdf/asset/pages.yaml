    The reason we cannot answer this question is due to the lack of shadows in the
    scene. We expect to see shadows, and our brain uses shadows to build a more complete
    mental model of the objects where we see and where they are located.


    Consider the same scene, shown in Figure 8.2, with shadows incorporated. It is
