  md: '# Instructor Ancillaries


    Instructors in a college or university setting are encouraged to obtain the instructor
    ancillary package that is available for this book, which contains the following
    additional items:


    +   - A complete set of PowerPoint slides covering all topics in the book

    - Solutions to most of the exercises at the ends of the chapters, including where
    applicable

    - Sample syllabus for a course based on the book

    - Additional hints for preparing the material, chapter-by-chapter


    This instructor ancillary package is available by contacting the publisher at
    info@merclelarning.com.


    # Acknowledgments


    Early drafts of this book (prior to the first edition) were used in the CSC-155
    (Advanced Computer Graphics Programming) course at CSU Sacramento, and benefited
    from many student corrections and comments (and in some cases, the). The authors
    would like to particularly thank Mitchell Brennan, Tiffany Chiapuzio-Wong, Samson
    Cha, Anthony Doan, Kian Farouhi, Cody Jackson, John Johnston, Zeeshan Khaliq,
    Raymond Rivera, Oscar Scalorzano, Darren Takemoto, Jon Tinney, James Wack, and
    Victor Zepeda for their suggestions.


    Feedback coming in immediately after the first edition was published. We were
    especially excited to hear from instructors who adopted the book for their courses
    and shared their experiences. Dr. Mauricio Papa from the University of Tulsa several
    useful emails with Sean McCry provided a wonderfully detailed set of corrections
    to a course of lighting (Chapter 7) and Perlin noise (Chapter 14) implementations.
    We also heard from many students at various institutions, and their questions
    helped us to address weaknesses in our book.


    A sort of "acid test" for our book came in the fall of 2017, when our colleague
    Dr. Pinar Muyan-Ozcelik used the first edition while teaching our CSC-155 course
    for her first time. This gave us an opportunity to assess whether our book achieved
    its goal as a "teach yourself" resource. The course went well, and along the way
    Muyan-Ozcelik kept a running log of questions and corrections for each chapter,
    which led to many improvements in this second edition.


    Kai Burjack, developer of the JOML math library, has been extraordinarily generous
    with his time and assistance as we migrated from graphicslib3 to JOML. He reviewed
    key segments of our book and gained insight into important aspects of JOML. He
    also helped guide us in using JOML correctly.'
