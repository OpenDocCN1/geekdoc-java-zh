  md: 'OpenGL cube maps are similar to 3D textures that we will study later, in that
    they are accessed using three texture coordinates—often labeled (s,t,r)—rather
    than we have been doing far. Another unique characteristic of OpenGL cube maps
    is that the images are oriented with texture coordinate (0,0,0) at the upper left
    (rather than the usual lower left) of the texture image; this is often a source
    of confusion.


    The method shown in Program 9.1 reads in a single image for texturing the cube
    map, the loadCubeMap() function in Program 9.2 reads in six separate cube face
    files. There are two approaches we could use to read the six faces and build the
    cube map. We could use the JOGL TextureIO and TextureData classes as we did throughout
    Chapter 5 or we could use the AWT tools described at the end of Chapter 5. In
    this chapter, we choose the latter approach as it affords more flexibility with
    respect to whether or not we vertically flip the textures to accommodate the aforementioned
    difference in texture orientation.


    In the loadCubeMap() function, the six texture image files are read using the
    getRGBPixelData() function described in Section 5.12. We set its second parameter
    to false, so that it doesn''t flip the textures vertically—this is because OpenGL
    automatically does a vertical flip for cube maps.


    After reading the textures and converting them to texture, we then generate a
    single texture of type GL_TEXTURE_CUBE_MAP. OpenGL requires that we specify the
    size of the texture images using the glTexture2D() function—which they are 1024×1024
    (they must be square). Finally, the loadCubeMap() function uses glSubImage2D()
    to add each texture to a cube face.


    The init() function now includes a call to enable GL_TEXTURE_CUBE_MAP_SEAMLESS,
    which allows OpenGL to prevent blending edges of the cube to reduce or eliminate
    seams. In display(), the cube''s vertices are sent down the pipeline, but this
    time it is unnecessary to send the cube''s coordinates. As we will see, this is
    because OpenGL texture cube map uses the cube''s vertex positions as its texture
    coordinates. After disabling depth testing, the cube is drawn. Depth testing is
    re-enabled for the rest of the scene.


    The completed OpenGL cube map is referenced by an int identifier. As was the case
    with shadow mapping, artifacts along a border can be reduced by setting the texture
    wrap mode to "clamp to edge." In this case it can help further reduce seams. Note
    that this is set for all three texture coordinates (s, t, and r).'
