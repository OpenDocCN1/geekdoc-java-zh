  md: "# Chapter 12 · Tessellation 279\n\nNext let's look at the tessellation evaluation\
    \ shader. It starts with a line of code\nthat says\n\n```\nlayout (quads, equal_spacing,\
    \ ccw);\n```\n\nThis may at first appear to be related to the \"out\" layout statement\
    \ in the control\nshader, but actually they are unrelated. Rather, this line is\
    \ where we instruct the\ntessellator to generate vertices so they are arranged\
    \ in a large rectangle (a \"quad\\).\nIt also specifies the subdivisions (inner\
    \ and outer) to be of equal length (later we\nwill see a use for subdivisions\
    \ of unequal length). The \"ccw\" parameter specifies\ntinding order in which\
    \ the tessellated grid vertices are generated (in this case,\ncounterclockwise).\n\
    \nThe vertices generated by the tessellator are then sent to the evaluation shader.\n\
    Thus, the evaluation shader receive vertices both from the control shader\n(typically\
    \ as control points) and from the tessellator (the tessellated grid). In\nProgram\
    \ 12.1, vertices are only received from the tessellator.\n\nThe evaluation shader\
    \ executes once for each vertex produced by the tessellator.\nThe vertex location\
    \ is accessible using the built-in variable gl_TessCoord. The tess-\nelated grid\
    \ is oriented such that it lies in the X-Z plane, and therefore gl_TessCoord's\n\
    X and Y components are applied to the grid's X and Z coordinates. The grid coordi-\n\
    nates, and the values of gl_TessCoord range from 0.0 to 1.0 (this will be handy\n\
    l when computing texture coordinates). The evaluation shader then uses the mvp\n\
    matrix to orient each vertex (this was done in the vertex shader in examples\n\
    er chapters).\n\nFinally, the fragment shader outputs a constant color yellow\
    \ for each\npixel. We can, of course, also use it to apply a texture or lighting\
    \ to our scene as\naw in previous chapters.\n\n# 12.2 TESSELLATION FOR BÉZIER\
    \ SURFACES\n\nLet's extend our program so that it turns our simple rectangular\
    \ grid into\na Bézier surface. The tessellated grid should give us plenty of vertices\
    \ for sam-\\pling the surface (and we can increase the inner/outer subdivision\
    \ levels if we want\nmore). What we now need is to send control points through\
    \ the pipeline, and then\n those control points to perform the computations to\
