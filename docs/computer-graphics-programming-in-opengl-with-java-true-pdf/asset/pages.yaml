    // use time (factor) to compute different translations in x, y, and z

    Mat.identity();

    Mat.translate(float(Math.sin(3.5f*tf*tf))*2.0f, float(Math.sin(5.2f*tf*tf))*2.0f,
    float(Math.sin(7.1f*tf*tf))*2.0f);

    Mat.rotateXYZ(1.75f*(float)tf, 1.75f*(float)tf); // the 1.75 adjusts the rotation
    speed

    ```


    The use of elapsed time (and a variety of trigonometric functions) in the model
    matrix causes the cube to appear to tumble around in space. Note that adding this
    animation illustrates the importance of clearing the depth buffer each time through
    display() as shown; otherwise, the cube will leave a trail as it moves.


    The translate() and rotateXYZ() functions are part of the JOML library. Note that
    in the code, translate() is called before rotate(). This results in concatenation
    of the two transforms, with translation on the left and rotation on the right.
    When a vertex is subsequently multiplied by this matrix, the computation is right-to-left,
    meaning that the rotation is done first, followed by the translation. Order of
    application of transforms is significant and the order would result in different
    behavior. Figure 4.7 shows some of the frames that are displayed after animating
    the cube.


