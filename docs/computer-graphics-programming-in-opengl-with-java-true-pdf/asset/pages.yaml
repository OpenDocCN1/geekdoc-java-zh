    Let''s continue examining the remainder of the OpenGL pipeline.


    # 2.1.3 Tessellation


    We cover tessellation in Chapter 12. The programmable tessellation stage is one
    of the most recent additions to OpenGL (in version 4.0). It provides a tessellator
    that can generate a large number of triangles, typically as a grid, and also some
    tools to manipulate these triangles in a variety of ways. For example, the programmer
    might manipulate a tessellated grid of triangles as shown in Figure 2.6.


    Tessellation is useful when a lot of vertices are needed on what is otherwise
    a simple shape, such as an square area or curved surface. It is also very useful
    for generating complex terrain, as we will see later. In such instances, it is
    much more efficient to have the tessellator in the GPU generate the triangle mesh
    in hardware, rather than doing it in Java.'
