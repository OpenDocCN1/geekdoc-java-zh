    **Matrix addition** is straightforward:


    ```

    $$\begin{bmatrix} A+a&B+b&C+c&D+d \ E+e&F+f&G+g&H+h \ I+i&J+j&K+k&L+l \ M+m&N+n&O+o&P+p
    \end{bmatrix} = \begin{bmatrix} A&B&C&D \ E&F&G&H \ I&J&K&L \ M&N&O&P \end{bmatrix}$$

    ```


    In GLSL the +` operator is overloaded on mat4 to support matrix addition.


    There are various multiplication operations in general can be either left-to-right
    or right-to-left (note that these operations are different, it follows that matrix
    multiplication is not commutative). Most of the time we use right-to-left multiplication.


    **In 3D graphics, multiplying a point by a matrix** is in most cases done right-to-left,
    as follows:


    ```

    $$\begin{bmatrix} AX+BY&CZ+D \ EX+FY&G+Z \ IX+JY&KZ+L \ MY+NY&OZ+P \end{bmatrix}
    = \begin{bmatrix} A&B&C&D \ E&F&G&H \ I&J&K&L \ M&N&O&P \end{bmatrix} * \begin{bmatrix}
    X \ Y \ Z \ 1 \end{bmatrix}$

    ```


    Note that we represent the point (X,Y,Z) in homogeneous notation as a one-column
    matrix.


    GLSL and JOML support multiplying a point by a matrix. In JOML, when the point
    and the matrix are compatible dimensions (such as a Vector4f and a Matrix4f) then.
    Cases where a point is stored in a Vector3f, the function Vector3f.mulPosition(Matrix4f)
    can be used, which will assume a fourth element (1) in the vector before calculating
    the multiplication. GLSL vectors and matrices can be multiplied with the * operator.


    **Multiplying a 4x4 matrix by another 4x4 matrix** does as follows:


    ```

    $$\begin{bmatrix} A&B&C&D \ E&F&G&H \ I&J&K&L \ M&N&O&P \end{bmatrix} * \begin{bmatrix}
    a&b&c&d \ e&f&g&h \ i&j&k&l \ m&n&o&p \end{bmatrix} =$

