  md: '# Chapter 2 · The OpenGL Graphics Pipeline 9


    The mechanism by which these functions are deployed as follows: When a GLCanvas
    is made "visible" (by calling "setVisible(true)") on the JFrame that contains
    it, it initializes OpenGL, which creates a "GL4" object that our application can
    use for making OpenGL function calls. OpenGL then does a "callback," calling init(),
    and passes a "drawable" object (in this case the drawable object is the GLCanvas,
    In this particular example, init() doesn''t do anything—in applications it we
    would need in GLSL code, load 3D models, and so on. OpenGL (actually, JOGL) next
    calls display(), also sending the drawable object. It is typical to immediately
    obtain the GL4 object and pass it a reference "call" (actually, GL4 is an interface—in
    practice we don''t need to know the actual GL object classes).


    Later we will see if we want our scene to be animated, Our Java/JOGL application
    will need to tell JOGL to make additional calls to display().


    Now is an appropriate time to take a look at JOGL calls in Program 2.1. Consider
    this one:


    ```

    glClear(GL_COLOR_BUFFER_BIT);

    ```


    Since JOGL is a Java binding for OpenGL, that means calls to JOGL in turn generate
    calls to OpenGL''s library of C functions. In this case, the C function being
    called, is described in the OpenGL reference documentation (available on the web
    at https://www.opengl.org/sdk/docs):


    ```

    void glClear(Glbitfield mask);

    ```


    The first thing to notice is that the name of the JOGL function is the same as
    that of the original OpenGL C function, except it is preceded by "gl."—which is
    the name of the GL4 object. The period \.-\ after the "gl" is significant because
    "gl" is on the object which we are invoking the OpenGL function.


    To reiterate, GL4 is a Java interface to the OpenGL functions. We can obtain it
    in one of two ways: (a) by calling drawable.getGL(), utilizing the "GLAutoDrawable
    object provided automatically when the various GLEventListener functions are


