    The unzipped jogamp-all-platforms file contains a folder named jar which contains
    important files that will be used by your applications:


    ```

    jogl-all.jar

    jogl-all-natives-macosc-universal.jar

    gluegen-rt.jar

    gluegen-rt-natives-macosc-universal.jar

    ```


    Traditionally these files would be placed in the /System/Library/Java/Extensions
    folder. However, this Extensions mechanism has been deprecated [OR18]. So a better
    strategy going forward is to add paths to these files to your CLSPATH environment
    variable.


    After you have copied the above files onto your machine, go into the jogl-javadoc
    folder and double-click the file name index.html. This opens the JOGL javadocs
    in a browser, which you should then bookmark for future reference.'
