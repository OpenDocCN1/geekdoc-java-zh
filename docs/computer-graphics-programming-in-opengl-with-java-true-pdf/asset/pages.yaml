  md: '# Chapter 12 · Tessellation


    The resulting output mesh is shown in Figure 12.1.


    nThe tessellator produces a mesh of vertices defined by two parameters: *inner
    level* and *outer level*. In this case, the inner level is 12 and the outer level
    is 6—the outer edges of the grid are divided into 6 segments, while the lines
    spanning the interior are divided into 12 segments.


    ![](img/2c98d23f81c0609c29ed8f5a139a1e22_297_0.png)


    **Figure 12.1**

    Tessellator triangle mesh output.


    The specific relevant constructs in Program 12.1 are highlighted. Let’s start
    by discussing the first portion—the Java/JOGL code.


    Compiling the new shaders is dont exactly as the vertex and fragment shaders.
    They are then attached to the rendering program, and the linking call is unchanged.
    The only new items are the constants for specifying the type of shader being instantiated—the
    new constants are named


    ```

    GL_TESS_CONTROL_SHADER

    GL_TESS_EVALUATION_SHADER

    ```


    Note the new items in the display() function. The glDrawArrays() call now specifies
    GL_PATCHES. When using tessellation, vertices from the Java/JOGL application into
    the pipeline (i.e., in a VBO) *aren’t rendered but are usually control points*,
    which those we saw for Bézier curves. A set of control points is called a patch,
    and in those sections of the code using tessellation, GL_PATCHES is the only allowable
    primitive. The number of vertices in a patch is specified in the code to glPatchParameter().
    In this particular example, there aren’t control points being sent, but we are
    still required to specify at least one. Similarly, in the glDrawArrays() we call
    a start value of 0 and a vertex count of 1, even when we aren’t actually sending
    vertices from the JOGL program.


    The call to glPolygonMode() specifies how the mesh should be rasterized. The default
    is GL_FILL. Shown in the code is GL_LINE, as we see in Figure 12.1 caused only
    lines to be rasterized (so we could see the grid itself that was produced by the
    tessellator). If we change that line code to GL_FILL (or comment it out, resulting
    in the default behavior GL_FILL), we get the version shown in Figure 12.2.'
