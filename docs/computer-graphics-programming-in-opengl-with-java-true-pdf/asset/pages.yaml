  md: 'The tessellation stage of the OpenGL pipeline offers an attractive alternative
    approach for rendering Bézier surfaces on the iterative algorithm in 11.5 for
    Bézier curves. The strategy is to have the tessellator generate a large grid of
    vertices, and then use blending functions to reposition those vertices onto the
    Bézier surface as specified by the cubic Bézier control points. We implement this
    in Chapter 12.


    # SUPPLEMENTAL NOTES


    This chapter focused on the mathematical fundamentals of parametric Bézier curves
    and surfaces. We have deferred presenting an implementation of any of them in
    OpenGL, because an appropriate vehicle for this is the tessellation stage, covered
    in the next chapter. We also skipped some of the derivations, such as for the
    recursive subdivision algorithm.


    In 3D graphics, there are many advantages to using Bézier curves for modeling
    objects. First, those objects can, in theory, be scaled arbitrarily and still
    retain smooth surfaces without “pixelating.” Second, many objects up of complex
    curves can be stored more efficiently as sets of Bézier control points rather
    storing thousands of vertices.


    Bézier curves have many real-world applications computer graphics and automobiles.
    They can also be found in the design of bridges, such as in the Chords Bridge
    in Jerusalem [CB16]. Similar techniques are used for building TrueType fonts,
    which as a result can be scaled to any arbitrary size, or zoomed in any degree
    of closeness, while always retaining smooth edges.


