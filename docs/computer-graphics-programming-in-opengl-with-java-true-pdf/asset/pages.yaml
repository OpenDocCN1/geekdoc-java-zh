    The OpenGL primitive type ("strip" and "fan" types) were described in Chapter
    4. "Adjacency" types were introduced in OpenGL for use with geometry shaders and
    allow access to vertices adjacent to the primitive. We don''t use them in this
    book, but are listed for completeness.


    The output primitive type must be points, line_strip, or triangle_strip. Note
    that the output layout qualifier also specifies the maximum number of vertices
    of the shader outputs in each invocation.


    This particular alteration to the torus could have been done more easily in the
    vertex shader. However, suppose that instead of moving each vertex outward along
    its own surface normal, we wished to move each triangle outward ("exploding")
    the torus outward. The vertex shader cannot do that, because computing a normal
    for the triangle requires averaging the normals of all three triangle vertices,
    and the vertex shader only has access to the vertex attributes of one vertices
    in the triangle at a time. We can, however, do this in the geometry shader, the
    geometry shader does have access to all three vertices in each triangle. We average
    their normals to compute a surface normal for the triangle, then add averaged
    normal to each of the vertices in the triangle primitive. Figures 13.2, 13.3,
    and 13.4 show the averaging of surface normals, the modified geometry shader main()(),
    and the resulting output, respectively.


