    Immediately following tessellation in the OpenGL pipeline is the geometry stage.
    The programmer has the option of including a geometry shader. This stage actually
    predates tessellation; it became part of the OpenGL core at version 3.2 (2009).


    Like tessellation, geometry shaders enable the programmer to manipulate groups
    of vertices, in ways that are impossible to do in a vertex shader. In some cases,
    a task might be accomplished using either a tessellation shader or a geometry
    shader, as their capabilities overlap in many ways.


    # 13.1 PER-PRIMITIVE PROCESSING IN OPENGL


    The geometry shader stage is situated between tessellation and rasterization,
    within the segment of the pipeline devoted to primitive processing (refer back
    to Figure 2.2). Where vertex shaders enable the manipulation of one vertex at
    a time and fragment shaders enable the manipulation of one fragment (essentially
    one pixel) at a time, geometry shaders enable manipulation of one primitive at
    a time.


    Recall that primitives are the basic building blocks in OpenGL for drawing objects.
    Only a few types of primitives are available; we will focus primarily on geometry
    shaders that manipulate triangles. Thus, when we say that a geometry'
