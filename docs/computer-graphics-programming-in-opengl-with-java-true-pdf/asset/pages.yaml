    that it takes two triangles to specify each square. The texture coordinates for
    each of the six vertices that specify this one cube are listed alongside the four
    corners, with the corners at the upper left and lower right comprising a pair
    of vertices. The image is also shown. The texture coordinates (indexed by s and
    t) have mapped portions of the image (the texels) to the rasterized pixels of
    the front face. Note that all of the intervening pixels between the vertices have
    been painted with the intervening vertices in the image. This is achieved because
    the texture coordinates are sent to the fragment shader in a vertex attribute,
    and thus are also interpolated just like the vertices themselves.


