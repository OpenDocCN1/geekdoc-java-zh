    ### 3.3. Solar Panel Efficiency


    Notable formula to calculate traditional linear expression of solar module efficiency
    in function of module temperature explained by Evans and Florschetz, 1977 [45]


    ```

    $\eta = \eta_{dc}[1 - \beta_{ref}(T_c - T_{ref})]$

    ```


    A notable equation created by Kamuyu, Lim et al. 2018 [27] to obtain FPV module
    temperature from GIS and water data is


    ```

    $T_{ppv} = (1.8081 + (0.92882T_a + 0.021G) - (1.2210V_w) + (0.0246T_{w}))

    ```


    The general formula to calculate operating temperature of ground-mounted solar
    PV panel is a function of material, radiation, ambient temperature, and wind speed,
    developed by Duffy and Beckman, 2013 [46] and shown as follows


    ```

    $T_{gpv} = T_a + \left(\frac{G}{G_{noct}}\right)(T_{cnoc} - T_a) \left(\frac{9.5}{5.7
    + (3.8V_a)}\right)$

    ```


