    # 浮式太阳能光伏的冷却效应：性能与经济分析——以印尼西爪哇为例


    Adimas Pradityo Sukarko 和 Kyung Nam *


    KU-KIST 能源与环境学院（绿学院），高丽大学，首尔 02841，韩国；

    adimas.pradityo@ptjb.com

    * 通信：i005034@korea.ac.kr. 电话：82-10-6348-9677

    收稿：2020年3月18日；采用：2020年4月22日；发表：2020年4月26日


    **摘要：** 太阳能光伏技术是最成熟的可再生能源技术之一。许多研究人员在该领域进行了开发工作，包括材料和设计系统。为了保护全球陆地资源的枯竭并避免占用农田，太阳能光伏（PV）开发者和政策制定者一直在寻求各种解决方案，包括开发浮式太阳能光伏（FPV）。本研究从技术和经济角度对浮式太阳能光伏系统进行了分析。作者利用遥感结果预测
    FPV 效率并测量系统的能量产出，同时对 FPV 项目与地面光伏（GPS）进行了对比分析。遥感方法的结果显示，FPV 的温度较低，年温差约为 8 °C。预测结果还显示，FPV
    的效率比 GPS 高出约 0.61%。在基准场景下，FPV 的经济对比还显示其平准化电成本（LCOE）低了 3.37 美元/kWh，内部收益率（IRR）高出
    6.08%。


    **关键词：** 浮式太阳能光伏；地面遥感；冷却效应；性能分析；经济分析


    ## 1. 引言


    能源消耗与人类生活福祉密切相关。如今，世界人口的福祉面临着工业化时期以来气候变化的限制。能源消耗和生产活动占了温室气体（GHG）排放的三分之二。目前几乎 80%
    的总能源来自化石燃料 [1]。发电部门在世界总能源消耗中占重要地位，印尼拥有超过 1,900,000 平方公里的丰富自然资源，具有很高的可再生能源潜力。印尼国家电力公司
    PT Perusahaan Listrik Negara (PT PLN) 根据印尼国家能源总体规划 [2] 估计，可再生能源总计可产生 442.9 GW
    的电力。国家能源总体规划的一份报告解释说，印尼平均太阳能光伏潜力为每天 4.8 kWh/m²。


    技术创新，特别是电力供应，可以为新的可再生能源（NRE）技术和范式做出贡献，成为解决世界依赖化石燃料能源问题的方案。技术创新使得太阳能光伏（PV）系统、风能、储能和电动汽车具有商业竞争优势并日益完善
    [1]。2017 年太阳能光伏容量增加了约 402 GW [4]。随着国际对太阳能光伏受益者意识的增强，全球专家预测太阳能光伏市场在未来将继续发展。太阳能光伏市场的渗透预计将对劳动力市场的就业机会和可用性产生积极联动效应。


    尽管如此，技术仍面临着若干重大挑战，如间歇性负载、低效率和电价政策。太阳能光伏最流行的安装类型是地面安装，由于土地是稀缺商品，这种方式通常面临土地价格限制。众所周知，太阳能的产量与面板温度有强相关性，温度决定了太阳能光伏板的效率。


    为了解决土地利用限制，太阳能光伏安装方法已不断演变，现在包括屋顶、运河、海上和浮式（FPV）安装。FPV 最初于 2007 年引入日本爱知，并于 2008
    年在美国纳帕谷声名鹊起。其 2013 年的总容量为 1.1 MW，2017 年达到 98.6 MW [7]。FPV 也成为湖泊、水坝和水库等开阔水域的解决方案，在经济和环境上均具有吸引力。因此，FPV
    对于拥有大量开放水域水电站的国家是一种合适的解决方案。尽管 FPV 自 2007 年以来一直在使用，但尚没有特定的软件让我们包含其能量生产中的冷却效应。


    可再生能源光伏的经济参数也得到了评估。在 2018 年，对于各种商业太阳能光伏产品，FPV 安装的成本将比化石燃料发电更具竞争力。根据印尼国家电力公司 PT
    PLN 的 2018 年报告 [9]，印尼的可再生能源估计成本仍然很高（约 54.8 美分/kWh），而蒸汽发电厂为 5.93 美分/kWh。作者意识到，通过
    FPV 预测能量对许多研究人员来说是一项挑战。因此，本文设计了一套结合遥感方法来计算 FPV 效率的系统，并对 FPV 性能进行了评估。特别是本研究是首次通过遥感技术测量
    FPV 模块温度的尝试。作者希望本文的方法和工具能有助于未来的 FPV 研究。


    ## 2. 文献综述


    根据 Thi (2017) [10] 和 Sahu 等 (2016) [11]，典型的太阳能光伏安装是地面式的，浮式太阳能光伏（FPV）与土地成本、水域利用和能量效率有关。PV
    模块温度上升的影响是一个缺陷。在水体上方安装太阳能光伏可以防止蒸发，并利用多种冷却方法（包括蒸发冷却）增加太阳能板产量，Karthikeyan 等 (2018)、Balakrishnan
    等 (2018)、Hortmanesh 等 (2017) 和 Kusakana 等 (2017) 进行了调查。


    FPV 显示出在建设、运行和寿命终结阶段具有更好的环境影响。在水库上方安装太阳能光伏被认为停止藻类生长并减少水库蒸发。与 GPV 相比，FPV 还需要更小的面积。之前的浮式安装导致了不同的效率值。在2018
    年末，Helio® 技术是浮式设备的一个例子。Helio 是法国公司（Saigh-Melantois, France）的产品，占据了日本市场约 75%，这是
    FPV 与 GPV 比较的最显著之处（见表 1）。


    表 1 之前的研究：浮式太阳能光伏（FPV）与地面太阳能光伏（GPV）效率的差异


    | 作者 | 参考文献 | 效率 (+/-) |

    | :--- | :--- | :--- |

    | Choi, Lee 等 2013 | [18] | 10.3; 13.5; 以及 11 |

    | Durkovič, Djurisic 等 2015 | [12] | 31.29 |

    | Trapani, Safante 等 2015 | [19] | 20.0-25.0 |

    | Spencer, Maverick 等 2018 | [20] | -4.0-2.0 |

    | Liu, Wang, 等 2017 | [21] | 1.58-2.0 |

    | Lee, Joo 等 2014 | [22] | 0.6-1.8 |

    | Rosa-clclat, Tina 等 2017 | [23] | 10.0 |

    | Yadav 和 Gupta 2016 | [24] | 3.7 |

    | Azmi, Othman, 等 2013 | [25] | 2.82-14.58 |

    | Majid, Rasul, 等 2014 | [26] | 5.93-15.5 |

    | Kamuyu, Lim, 等 2018 | [27] | 14.69 |


    结果显示 FPV 的效率显著优于 GPV。Kamuyu, Lim 等 [2018] 在位于韩国庆州的庆州水坝（一个水库）进行了一项 500 kW 的安装。在与结果比较之前，他们能够将
    FPV 模块计算为风速、辐照、温度和水温的函数。结果显示，水温是决定 FPV 面板温度的关键因素之一；计算实地测量或访问数据的方法是通过美国国家航空和航天局（NASA）的名为“NASA
    power”的在线应用程序。对湖面水温的遥感已被监测，以跟踪全球环境变化 [28] 以及气候对全球碳循环的贡献。用于水温监测的卫星包括先进的高分辨率辐射辐射计（AVHRR）以及线扫描仪（STAR）[28,30]。Landsat
    计划由美国政府于 1965 年启动，旨在收集地球自然资源的事实，政府于 1972 年发射了第一颗 Landsat。目前和最新的分别于 1999 年和 2013
    年发射 [33]。Landsat 卫星提供了最长的空间线观测记录 [34]。与之前的 Landsat 7 相比，Landsat 8 具有更窄的光谱带、更高的分辨率和信噪比、12
    个辐射分辨率以及更精确的几何结构 [35]。在本研究中，我们还利用遥感方法估计水温。


    为了目的，作者模拟了一个容量为 1 MW 的固定型 FPV 系统，该系统安装并运行于印尼西爪哇省的 Cirata 水坝。1 MW FPV 的设计采用了 Paslić,
    Asković 等 (2018) [36] 的数学方程，该由 Janlana Bašić (2016) [37] 在韩国尚龙露天石灰岩矿规划。几种流行的软件包如
    RETChem（加拿大政府）、PVGIS（欧盟/欧洲委员会科学中心）、PVWatts（美国国家能源实验室/NREL，华盛顿）、System Advisor
    Model/SAM（NREL，华盛顿），以及 Homer 是一个用于计算可再生能源项目能量产出的工具。


