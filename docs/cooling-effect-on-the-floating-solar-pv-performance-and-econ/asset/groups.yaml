    # Cooling Effect on the Floating Solar PV: Performance and Economic Analysis on
    the Case of West Java in Indonesia


    Adimas Pradityo Sukarko and Kyung Nam *


    KU-KIST Graduate School of Energy and Environment (Green School), Korea University,
    Seoul 02841, Korea;

    adimas.pradityo@ptjb.com

    * Correspondence: i005034@korea.ac.kr. Tel.:82-10-6348-9677

    Received: 18 March 2020; Accepted: 22 April 2020; Published: 26 April 2020


    **Abstract:** Solar photovoltaic technology is one of the most well established
    and renewable energy technologies. Many researchers have undertaken research and
    development in this sector, including material and design system. To protect the
    exhaustion of global terrestrial land and to avoid the occasion of extensive farmland,
    solar photovoltaic (PV) developers, and policymakers, have pursued various solutions,
    including the development of floating solar PV (FPV). This study considers a technological
    and economic perspective to analyze the floating solar PV system. The authors
    utilize remote sensing results to predict FPV efficiency and measure energy yield
    from the system while also demining analysis on an FPV project comparison with
    ground-based PV (GPS). The results from remote sensing method found that FPV has
    a lower temperature, with an annual difference around 8 °C. FPV efficiency was
    also shown to be around 0.61% higher than GPS in terms of the prediction. FPV
    economic comparison also resulted in 3.37/kWh lower leveled cost of electricity
    (LCOE), and 6.08% higher internal rate of return (IRR) for FPV in the base scenario.


    **Keywords:** floating solar photovoltaic; ground-based remote sensing; cooling
    effect; performance analysis; economic analysis


    ## 1. Introduction


    Consumption of energy is related to human welfare in life. Nowadays, the welfare
    of the world population is facing constraints of climate change that occur on
    after the period of industrialization. Energy consumption and production activities
    are responsible for two-thirds of greenhouse gases (GHG) emissions. Almost 80%
    of the total energy sources are currently from fossil fuels [1]. The electric
    power generation sector plays a significant role in total world energy consumption,
    where most with a surface area of more than 1,900,000 km² abundant natural resources,
    Indonesia has a high potential for renewable energy. The Indonesian state-owned
    electric company, PT Perusahaan Listrik Negara (PT PLN), from Indonesia national
    energy general plan [2] estimates that a total potential capacity of 442.9 GW
    of electric could be generated from renewable energy sources. A report from the
    national energy general plan explains that the average solar PV potential in Indonesia
    is 4.8 kWh/m²/day.


    The innovation of technology, especially electric energy supply, can contribute
    a new and renewable energy (NRE) technology and paradigm could constitute a solution
    to the problem of world dependence on fossil fuel-based energy. Technological
    innovation has made solar photovoltaic (PV) systems, wind energy, energy storage,
    and electric vehicles, commercially competitive and well-developed [1]. Solar
    PV increasing capacity in 2017 was approximately 402 GW [4]. Simultaneous to the
    increase in international awareness of solar PV beneficiaries, worldwide experts
    have predicted that the solar PV market will keep developing in the near future.
    Solar PV market penetration is also expected to create a positive collateral effect
    on the labor sector regarding work opportunity and availability.


    Nonetheless, technology is facing several significant challenges, such as intermittent
    loads, low efficiency, and tariff policies. The most popular installation type
    of solar PV is a ground-based installation, which generally faces land price constraints
    because of the usage of land, which is a premium commodity. It is also well known
    that solar energy production has a strong correlation with panel temperature to
    determine solar PV panel efficiency.


    In order to address land-use constraints, methods of solar PV installation have
    evolved and now include rooftop, canal, off-shore, and floating (FPV) installations.
    FPV was first introduced in Aichi, Japan, 2007, and became prominent in Napa Valley,
    USA 2008 [6]. Its total capacity in 2013 was 1.1 MW and was 98.6 MW in 2017 [7].
    FPV has also become a solution for uness water surface areas such as lakes, dams,
    and water reservoirs to be created economically and environmentally attractive
    projects in NRE sector. Therefore, FPV is a suitable solution for a country that
    has lot of hydropower plants with open water areas. Even though FPV has been in
    use since 2007, there is no specific software that will allow us to include the
    cooling effect in its energy production measurement.


    The economic parameters of NRE solar PV are also evaluated through the cost generation
    price. At the technology of 2018, with various types of commercial solar PV product,
    solar product, PV installation cost in the range of ... electricity generated
    from PV will have become more competitive than fossil-based electricity. cost
    also becomes one of the parameters to ensure investor attractiveness in the NRE
    sector. According to Indonesia''s state-owned electric company PT PLN''s stated
    report [9], 2018, the estimation cost of RE in Indonesia is still very high (around
    54.8 cents/kWh) compared to a traditional steam power plant (5.93 cents/kWh).


    The authors realize that predicting the energy by FPV is a challenge for many
    researchers. Therefore, in this article design a system to develop a combination
    of sensing methods and a process of calculating the efficiency of FPV, completes
    this assessment with economic analysis. In particular, this study is the first
    trial to measure the temperature of the PV module from an FPV system through remote
    sensing and apply it to FPV performance. The authors hope that the methodology
    and tools in this paper can be helpful to future FPV research.


    ## 2. Literature Review


    According to Thi, 2017 [10] and Sahu, Yadav et al. 2016 [11], typical solar PV
    installations are ground-mounted, floating solar PV (FPV) was related to premium
    land cost, utilization of water area, and energy efficiency. The impact of temperature
    rise of the PV module is one solve the deficiencies. Solar PV installation above
    water bodies will prevent evaporation, and with cooling methods benefit the solar
    panel, increasing energy production. Several cooling methods, including evaporative
    cooling, were investigated by Karthikeyan et al. 2018; Balakrishnan et al. 2018,
    Hortmanesh et al. 2017 and Kusakana et al. 2017.


    FPV was shown to have a better environmental impact within construction, operation,
    and end-of-life period compared to PV Blocked sunlight by PV installation above
    the water reservoir was considered to stop algae growth and reduce the water reservoir
    evaporation. FPV also requires a smaller area compared to GPV for laydown and
    connecting processes. The previous floating installation resulted in solar PV
    efficiency with various values compared to ground installation of solar PV systems.
    In late 2018, Helio® technology was one example of a floater that was available
    for FPV. Helio is a product from French company (Saigh-Melantois, France) which
    dominates around 75% of the Japanese market, which is the location of the most
    significant installations of FPV in comparison to GPV (Table 1).


    Table 1. Previous studies: Difference of floating solar photovoltaic (FPV) efficiency
    with ground-bound solar PV (GPV).


    | Authors | Reference No. | Efficiency (+/-) |

    | :--- | :--- | :--- |

    | Choi, Lee et al. 2013 | [18] | 10.3; 13.5; and 11 |

    | Durkovič, Djurisic et al. 2015 | [12] | 31.29 |

    | Trapani, Safante et al. 2015 | [19] | 20.0-25.0 |

    | Spencer, Maverick et al. 2018 | [20] | -4.0-2.0 |

    | Liu, Wang, et al. 2017 | [21] | 1.58-2.0 |

    | Lee, Joo, et al. 2014 | [22] | 0.6-1.8 |

    | Rosa-clclat, Tina et al. 2017 | [23] | 10.0 |

    | Yadav and Gupta, 2016 | [24] | 3.7 |

    | Azmi, Othman, et al. 2013 | [25] | 2.82-14.58 |

    | Majid, Rasul, et al. 2014 | [26] | 5.93-15.5 |

    | Kamuyu, Lim, et al. 2018 | [27] | 14.69 |


    The results showed that FPV efficiency is significantly superior to that of GPV.
    Kamuyu, Lim, et al. [2018] performed a 500 kW installation at Hapcheon Dam, a
    water reservoir located in Hapcheon, South Korea. They were able to calculate
    the FPV module as a function of wind speed, irradiation, temperature, and water
    temperature before comparison with results. The results show that water temperature
    is one of the critical factors in determining FPV panel temperature; in method
    to calculate direct-situ measurement or data access is through the national aeronautics
    and space administration (NASA) software named "NASA power" online application.
    Remote sensing of lake surfaces'' water temperatures have been monitored to track
    global environmental change [28] as well as climatic contribution to the global
    carbon cycle. The satellites employed for water temperature monitoring include
    the advanced high-resolution radiometric (AVHRR) as well as the long scanner (STAR)
    [28,30]. The Landsat program was initiated in 1965 by the US government to gather
    facts about natural resources of the Earth, and the government launched the first
    Landsat in 1972. Current and the most recent are after being launched in 1999
    and 2013, respectively [33]. Landsat satellites provide the longest record of
    space-based line observations [34]. Compared to previous Landsat 7, Landsat 8
    has a narrower spectral band, improved resolution and signal to noise characteristics,
    12 radiometric resolutions, and more precise geometry [35]. In this study, we
    also use remote sensing method to estimate water temperature.


    For purposes, the authors simulate a fixed type of the FPV system in capacity
    of 1 MW that is installed and operating at Cirata Dam, West Java province, Indonesia.
    The design of 1 MW FPV adopts the mathematical equation from Paslić, Asković et
    al. 2018 [36] which is planned by Janlana Bašić, 2016 [37] at Sangyong Open pit
    limestone, Korea. Several popular software packages such as RETChem (Government
    of Canada), PVGIS (European Union/EU science hub, European Commission), PVWatts
    (The national energy laboratory/NREL, Washington, D.C., USA), System Advisor Model/SAM
    (NREL, Washington, D.C., USA), Homer comes a tool to calculate energy production
    of the NRE project.

