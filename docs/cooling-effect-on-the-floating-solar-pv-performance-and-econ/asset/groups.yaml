    在代表水基和陆基安装的两个高产量位置的情况下，在基础场景中使用现有电价，安装在湖泊 1 的 FPV 的 LCOE 比安装在土壤位置湖泊 1 的 GPV 低了
    3.37 分分/kWh。然而，从 IRR 和 NPV 参数来看，安装方法显示出负值，这意味着现有电价太低，无法引起对太阳能光伏项目投资的关注。


