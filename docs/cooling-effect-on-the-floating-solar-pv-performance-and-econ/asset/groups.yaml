    ### 4.3. Economic Analysis Result

    In this subsection, the authors examine the results of an economic analysis based
    on the best among representative type of location. From the performance results
    of four cases, the authors select Lake 1 and Soil for a more detailed economic
    analysis. The first approach of economic analysis is to find financial parameters
    NPV, IRR, and LCOE in base. Electricity price in Indonesia is unequal based on
    territory and population area. The Ministry of Energy and Mineral Resources (MoMEM)
    developed the basic cost of generation (BCoG) which consists of three methods,
    such as national, regional, and local BCoG. Local BCoG in 2019 has widely differentiated
    tariffs from 6.91 cents/kWh to 21.34 cents/kWh. The base condition utilizes the
    existing sell tariff regard the existing policy on NPE for selling energy to the
    utility. West Java province, the area of interest, ratifies 6.91 cents/kWh from
    the NRE source. The financial parameter results are shown in Table 7.


    ## Table 7. Base scenario result.


    | Location | Type | Energy Yield (GWh) | LCOE, Nominal, After Tax (cents/kWh)
    | IRR (%) | Net Present Value ($) |

    |---|---|---|---|---|---|

    | Lake 1 | Water | 1.439 | 9.81 | -1.10 | -285,733 |

    | Soil | Ground | 1.408 | 13.18 | -7.18 | -605,312 |


    In the case of two higher energy yield locations that represent water and ground-based
    installations, using an existing tariff in base scenario, LCOE of FPV installed
    at Lake 1 resulted in values that were 3.37 cents/kWh lower compared to GPV installed
    at Lake 1 on the soil location. However, from the IRR and NPV parameters, methods
    of installation show negative values, which means the existing tariff is too low
    to draw attention to solar PV project investment.


    ### 4.4. Parametric Analysis in the Policy Perspective

    In the second approach of economic analysis, the authors expected to find the
    implications from the policy perspective. Therefore, the authors considered the
    price policy in NRE to see the impact on the ToD(Tod) factor. The main impact
    in the alternative price policy is the time on delivery electricity delivered.
    It is possible to change the tariff multiplier of electricity on the power purchase
    agreement negotiations. Even though Indonesia only recognizes the NRE tariff based
    on the BCoG method, this study tries to analyze the ToD factor in terms of the
    NPV value. Previous analysis on the base scenario uses a flat-rate universal dispatch
    where the multiplier is equal to 1.0. After observation of a heat map of irradiation,
    as shown in Figure 4 below, the authors found that most of the energy yield in
    the area of interest is from 09:00 to 16:00. Therefore, the authors developed
    a manual ToD, as shown in Figure 5, the second scheme, considering a heat map
    obtained from weather files created with incremental steps and maximum multiplier
    is 2.0 of the existing tariff.


