    ### 4.3. 经济分析结果

    在本节中，作者研究了基于代表性位置最佳经济分析结果。从四个案例的结果来看，作者选择了湖泊 1 和土壤进行更详细的经济分析。经济分析的第一种方法是寻找财务参数
    NPV、IRR 和 LCOE。印尼的电价根据领土和人口区域而不同。能源和矿产部 (MoMEM) 开发了基础发电成本 (BCoG)，它由三种方法组成，如国家、地区和当地
    BCoG。2019 年的当地 BCoG 资费差异很大，从 6.91 分分/kWh 到 21.34 分分/kWh 不等。基础条件利用了根据现有向公用公司出售能源的
    NPE 政策的销售电价。作为兴趣区域的爪哇省批准了来自可再生能源 (NRE) 的 6.91 分分/kWh。财务参数结果见表7。


