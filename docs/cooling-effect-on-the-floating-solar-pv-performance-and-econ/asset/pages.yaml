    investigated by Kalaiselvan, Karthikeyan et al. 2018 [13]; Rishi, Balakrishnan
    et al. 2018 [14], Peng, Hortmanesh et al. 2017 [15] and Siecker, Kusakana et al.
    2017 [16].


    FPV was shown to have a better environmental impact within construction, operation,
    and end-of-life period compared to PV [17]. Blocked sunlight by PV installation
    above the water reservoir and benefit the panel was considered to stop uncontrolled
    algae growth and reduce the water reservoir evaporation process. FPV also requires
