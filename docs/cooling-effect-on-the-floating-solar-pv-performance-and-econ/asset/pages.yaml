    land cost, utilization of water area, and energy efficiency. The impact of the
    temperature rise of the PV module is one solve the mentioned deficiencies. Solar
    PV installation above water bodies will prevent evaporation, and with cooling
    methods benefit the solar panel, panel temperature will reduce, increasing energy
