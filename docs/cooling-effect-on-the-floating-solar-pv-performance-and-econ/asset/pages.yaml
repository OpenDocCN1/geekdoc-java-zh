    # 3.4. Economic Analysis


    The financial calculation methodology for this study calculates the value from
    NPV, IRR, and LCOE of this proposed study. The authors utilize all parameters
    in SAM software functions to calculate the financial parameter of the project.
    This research also requires sensitivity analysis among FPV and NPV projects. Financial
    parameters for economic analysis will benefit the input from Indonesia''s national
    data, literature reviews, and assumptions. SAM provides the software with various
    simulation analysis tools that capable of mapping impacts out variations and uncertainty
    in input assumptions on the model. The parametric analysis tool is sensitivity
    analysis which to assign multiple values to input variables to create graphs and
    tables showing the outputs for each value. This tool is useful for optimization
    and exploring relationships between input variables and results.


    The stochastic analysis uses a statistical distribution to assign variable input
    value. A stochastic analysis also a parametric analysis, which generates values
    of input variables over a range; a probability distribution and sensitivity analysis
    specifically, as is the case for SAM. Stochastic analysis also show the effect
    on metric output with uncertain input values. This study also includes a tornado
    chart for the simplicity of uncertain parameter input that affects output results.
    Since SAM has no input for floater in the parameters, the authors searched for
    a footer reference in $/Watt data in the research. The authors set the logic that
    the cost of floater is an input in Land with a $/Watt parameter while the Land
    cost is an input in Land with a $/acre unit parameter.


    # 4. Result and Analysis


    # 4.1. The Solar PV Design Result


    This study proposes solar PV with 1 MW capacity and a central inverter system.
    Based on system design calculation, as seen in the literature review, the system
    will require ten modules per string with a total of 460 strings. The system also
    requires two inverters'' central model types. With these configurations, the system
    is predicted to occupy 1.5 acres of area for the solar PV capacity.


