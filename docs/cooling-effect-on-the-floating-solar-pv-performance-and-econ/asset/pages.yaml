    [38] while Psomopoulos, Ioannidis et al. 2015 [39] and Blair, Dobos et al. 2014
    [40] compared and briefly reviewed the NREL software systems.


    SAM is software developed for predicting performance of renewable energy systems
    and analyzing the feasibility of project. SAM is a techno-economic model that
    supports people who are interested in the NREL industry. SAM is suitable for simulating
    NREL on-grid performance systems with the financial model of the NREL project.
    SAM''s advantages are the availability of options in the analysis section, which
    provide parametric, sensitivity, statistical, and probability results as an extension
    of analysis [40]


    Economic analysis comprises a variety of evaluation methods such as leveled cost
    of energy (LCOE), net value (NPV), internal rate of return (IRR) and power purchase
    agreement (PPA). LCOE is a parameter that allows for the comparison of alternative
    technologies between different scales of operation, different investment, and
    operating periods. LCOE also could be used to compare the cost of energy generated
    by renewable resources with fossil-based power plants. PPA of electricity is a
    contract between two parties, and electricity undertakes. IRR of a project is
    the discount rate (nominal value agreeing to SAM) that corresponds to NPV for
    the PPA financial models [41]. IRR of an investment that has a series of cash
    flows is a rate that sets the NPV of the cash flows to zero. IRR analysis is commonly
    used for either acceptance or rejection decisions, allowing a comparison with
    a minimum acceptable rate.


    # 3. Data and Methodology


    # 3.1. Systematic Workflow


    This paper consists of four main analysis parts, as shown in Figure 1. First,
    the authors investigate surface temperature by remote sensing methodology. Second,
    the developed formula and conditions the solar module efficiency in four location
    cases, labeled Lake 1, Lake 2, Soil, and Dam. Lake 1 and Lake 2 represent water-based
    locations, while Soil and Dam represent groundbased locations. Third, the authors
    compare the analyzed energy production, i.e., the performance of each case. Lastly,
    the authors analyze the financial results with the PPA price scenario.


    ![](img/6920548fe7daf37aeb031ac079641ebe_3_0.png)


    Figure 1. Schematic workflow of the Study.'
