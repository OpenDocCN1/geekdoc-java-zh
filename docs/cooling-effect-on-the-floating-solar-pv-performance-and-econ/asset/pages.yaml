    For minimizing and analyzing the result, this study uses stochastic analysis SAM
    to examine the output value of uncertain input with a minimum of 800 sample simulations.
    The first analysis studies the effect of uncertain input parameters within the
    system to examine the LCOE output of proposed projects. The second analysis uses
    uncertain determined to examine LCOE, IRR, and the third analysis examines NPV
    as output. This study develops sensitivity analysis through a tornado graph with
    a variable setting of the value alteration to describe specific factors of FPV
    and GPV that affect the output results. After capturing the top 5 most significant
    impacts on output from the tornado graph, the authors undertake stochastic analysis
    with normal distribution in the probability scheme.


    From the tornado graph in Figure 6 and histogram data sets in Table 11, the LCOE
    value in FPV is mostly dependent on variables such as module cost, floater cost,
    engineering, the balance of the system, and O&M cost. Nevertheless, a reduction
    in the GPV land cost with 50% less input value still generates much higher LCOE
    compared to the FPV LCOE base scenario. From the stochastic analysis, the histogram
    shows that the top 5 probability result, from FPV, varies from 9.2 to 10.2 cents/kWh.


