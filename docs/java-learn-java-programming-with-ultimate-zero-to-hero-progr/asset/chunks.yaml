    \ statement, the values for the constructor’s arguments are provided:\n\n`Point\
    \ sourceOne = new Point(56, 87);`\n\nConsider this following code for the `Rectangle1`\
    \ class that incorporates 4 constructors:\n\n```java\npublic class Rectangle1\
    \ {\n    public int width1 = 0;\n    public int height1 = 0;\n    public Point\
    \ origin;\n    // four constructors\n    public Rectangle1() {\n        origin\
    \ = new Point(0, 0);\n    }\n\n    public Rectangle1(Point a) {\n        origin\
    \ = a;\n    }\n\n    public Rectangle1(int w, int h) {\n        origin = new Point(0,\
    \ 0);\n        width1 = w1;\n        height1 = h1;\n    }\n\n    public Rectangle1(Point\
    \ a, int w1, int h1) {\n        origin = a;\n        width = w1;\n        height\
    \ = h1;\n    }\n\n    // a method for moving the rectangle\n    public void move(int\
    \ y, int z) {\n        origin.y = y;\n        origin.z = z;\n    }\n\n    // a\
