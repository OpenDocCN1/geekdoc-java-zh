    \nDeclaration includes variable declaration of a variable name with an object\
    \ type. The code set written in bold are the variable declarations associating\
    \ the variable name with object types.\n\nWhen declaring variable, write:\n\n\
    `type name;`\n\nThis declaration tells the compiler that `name` will be used in\
