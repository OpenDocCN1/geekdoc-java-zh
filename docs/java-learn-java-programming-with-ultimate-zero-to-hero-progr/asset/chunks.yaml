    public Student (String studeName){


    name = studeName;


    }


    // The grade variable is assigned a value.


    public void setGrade(double studeGrade){


    grade = studeGrade;


    }


    // This method prints the student details.


    public void printStude() {


    System.out.printIn(“name : “ + name );


    System.out.printIn(“salary :” + salary);


