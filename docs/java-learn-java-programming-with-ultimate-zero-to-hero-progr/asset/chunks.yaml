    public static void main(String args[]){


    Student studeOne = new Student(“Jennica”);


    empOne.setGrade(98);


    empOne.printStude();


    }


    }


    The result will be:


    name : Jennica


    grade : 98


    Class/Statistic variables


    Class or statistic variables are declared using the keyword static in a class.
    This, however, is outside a block, method, or constructor. Declaration creates
    only a single copy of each class variable for each class, no matter how many objects
    are produced from it.


    This type of variable, however, is rarely used aside of getting declared as a
    constant. Constant variables are declared as private/public, static and final.
    These never change the initial value and the storage is in static memory. These
    variables are made when a program starts. Once the program stops, the static variable
    is destroyed. The visibility is similar to instance variables, although, most
    static variables are declared public because these have to be available for the
    class users.


    The default values of static variables are the same as those of instance variables.
    The default value for numbers is 0\. Default value for Booleans is false, and
    null for object references. Assigning values are done within the constructor or
    during declaration. Values can also be assigned by placing them in special static
    initializer blocks. Accessing static variables is done using “ClassName VariableName”.


    To declare class variables as final and public static, constants (variable names)
    should be written in the upper case. If it is not declared public, the naming
    syntax is similar to those for local and instance variables.


    Take a look at this example in declaring and using class variables.


    import java.io.*;


    public class Students{


    // grade variable is a privare static variable


    private static double grade;


    // SUBJECT is a constant


    public static final String SUBJECT = “Progress”;


    public static void main(String args[]){


    grade = 88;


    System.out.printIn(PROGRESS+”average grade:”+grade);


    )


    }


    The result of this will be:


    Progress average grade:88


    If accessing these variables is from an outside class, use StudentPROGRESS to
    access the constant.


    HOW TO CREATE VARIABLES


    When creating variable, it involves 2 basic things to do. One, creating any kind
    of variable includes giving it a unique name. Two, define what data type the variable
    is. These are essentially like creating new address space and giving it a unique
    name.


    The entire process is called variable declaration. It can be as simple as this:


    int b;


    Naming Variables


    There are different sets of conventions and rules that every programming language
    follows when it comes to giving names. In Java, there are also things to follow:


    •Names of variables are case sensitive. The name can be a legal identifier, with
    an unlimited length of a sequence of digits and Unicode letters. The name should
    always begin with a letter, the underscore character or a dollar sign ($). The
    convention is to start the variable name with a letter, though. By convention,
    the dollar sign is never used to start any variable name. However, auto-generated
    names may sometimes start with “$” but programmers are highly advised against
    it. The same goes for underscore. It is technically legal but not a good thing
    to follow in actual programming. White space to start a variable name is also
    not allowed.


    •The succeeding characters may include dollar sign, underscore, digits and letters.
    Conventions still apply in this part of a variable name. Use full words when naming
    variables instead of cryptic words. This will make things much easier because
    the codes will be easier to read and understand what they are for. It is also
    a great help because the code will doubly function for self-documentation. For
    instance, fields that are named as gears, grades, speed and closet are much easier
    to understand what they are and what they are for rather than those named with
    xx6g or z. Keep in mind, too, that variable names should not be any of the reserved
    words or keywords.


    • When the chosen variable name is a single word, spell it with all the letters
    in lowercase. If the variable name is more than a single word, capitalize the
    1^(st) letter of each word, except the 1^(st) word. For example, gradeAverage,
    gearParts and concentrationRatios. If the variable is meant for storage of constant
    values, this convention may have to be slightly altered. For instance, the variable
    static final int AMT_TUBES = 85. The name is fully capitalized and the words of
    the variable name are separated with an underscore. The underscore, by convention,
    is never used in a different place.


    # Chapter 5 – Java Language: Operators


    In Java programming, operators are a set of special symbols. Their function is
    to perform precise operations on 1, 2, or 3 operands and then provide a result.
    These are used in creating expressions, which in turn, compute values.


    TYPES OF OPERATORS


    There are basically 6 different types of operators in Java.


    Arithmetic operators


    These are operators used in mathematical expressions much like in regular algebra.


    For instance, the integer variable X holds 15 and variable Y holds 25\. The following
    are examples of what results will be obtained if the different arithmetic operators
    are used on these 2 integer variables.


    + Addition: This operator adds the values placed on both its sides.


    X + Y yields 40


    - Subtraction: This operator subtracts the operand on the right from that on the
    left.


    X – Y yields -10


    * Multiplication: This operator multiplies the values on both its sides.


    X * Y yields 375


    / Division: This operator divides the operand on the left by the operand on the
    right


    X / Y yields 1.67


    % Modulus: This operator divides the operand on the left by the one on the right
    and returns the remainder. It is also called the remainder operator.


    X % Y yields 0.67


    ++ Increment: This operator increase the operand’s value by 1'
