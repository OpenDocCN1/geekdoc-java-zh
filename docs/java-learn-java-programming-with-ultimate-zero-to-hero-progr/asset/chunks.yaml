    \ VariableName`.\n\nTo declare class variables as `final` and `public static`,\
    \ constants (variable names) should be written in the upper case. If it is not\
    \ declared public, the naming syntax is similar to those for local and instance\
    \ variables.\n\nTake a look at this example in declaring and using class variables.\n\
    \n```java\nimport java.io.*;\n\npublic class Students{\n    // grade variable\
    \ is a privare static variable\n    private static double grade;\n\n    // SUBJECT\
    \ is a constant\n    public static final String SUBJECT = “Progress”;\n\n    public\
    \ static void main(String args[]){\n        grade = 88;\n        System.out.println(PROGRESS+”average\
    \ grade:”+grade);\n    }\n}\n```\n\nThe result of this will be:\n\nProgress average\
    \ grade:88\n\nIf accessing these variables is from an outside class, use `StudentPROGRESS`\
    \ to access the constant.\n\n## HOW TO CREATE VARIABLES\n\nWhen creating variable,\
    \ it involves 2 basic things to do. One, creating any kind of variable includes\
    \ giving it a unique name. Two, define what data type the variable is. These are\
    \ essentially like creating new address space and giving it a unique name.\n\n\
    The entire process is called variable declaration. It can be as simple as this:\n\
    \n```java\nint b;\n```\n\n## Naming Variables\n\nThere are different sets of conventions\
