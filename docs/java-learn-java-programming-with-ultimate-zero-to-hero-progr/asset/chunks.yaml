    \ In Java, there are also things to follow:\n\n*   Names of variables are case\
    \ sensitive. The name can be a legal identifier, with an unlimited length of a\
    \ sequence of digits and Unicode letters. The name should always begin with a\
    \ letter, the underscore character or a dollar sign (`$`). The convention is to\
    \ start the variable name with a letter, though. By convention, the dollar sign\
    \ is never used to start any variable name. However, auto-generated names may\
    \ sometimes start with “$” but programmers are highly advised against it. The\
    \ same goes for underscore. It is technically legal but not a good thing to follow\
    \ in actual programming. White space to start a variable name is also not allowed.\n\
    *   The succeeding characters may include dollar sign, underscore, digits and\
    \ letters. Conventions still apply in this part of a variable name. Use full words\
    \ when naming variables instead of cryptic words. This will make things much easier\
    \ because the codes will be easier to read and understand what they are for. It\
    \ is also a great help because the code will doubly function for self-documentation.\
    \ For instance, fields that are named as gears, grades, speed and closet are much\
    \ easier to understand what they are and what they are for rather than those named\
    \ with `xx6g` or `z`.\n*   When the chosen variable name is a single word, spell\
    \ it with all the letters in lowercase. If the variable name is more than a single\
    \ word, capitalize the 1st) letter of each word. For example, `gradeAverage`,\
    \ `gearParts` and `concentrationRatios`. If the variable is meant for storage\
    \ of constant values, this convention may have to be slightly altered. For instance,\
    \ the variable `static int AMT_TUBES = 85`. The name is fully capitalized and\
    \ the words of the variable name are separated with an underscore. The underscore,\
    \ by convention, is never used in a different place.\n\n# Chapter 5 – Java Language:\
    \ Operators\n\nIn Java programming, operators are a set of special symbols. Their\
    \ function is to perform precise operations on 1, 2, or 3 operands and then provide\
    \ a result. These are used in creating expressions, which in turn, compute values.\n\
    \n## TYPES OF OPERATORS\n\nThere are basically 6 different types of operators\
    \ in Java.\n\n### Arithmetic operators\n\nThese are operators used in mathematical\
    \ expressions much like in regular algebra.\n\nFor instance, the integer variable\
    \ `X` holds 15 and variable `Y` holds 25. The following are examples of what results\
    \ will be obtained if the different arithmetic operators are used on these 2 integer\
    \ variables.\n\n*   `+` Addition: This operator adds the values placed on both\
    \ its sides `X + Y` yields `40`.\n*   `-` Subtraction: This operator subtracts\
    \ the operand on the right from that on the left `X - Y` yields `-10`.\n*   `*`\
    \ Multiplication: This operator multiplies the values on both its sides `X * Y`\
    \ yields `375`.\n*   `/` Division: This operator divides the operand on the left\
    \ by the operand on the right `X / Y` yields `1.67`.\n*   `%` Modulus: This operator\
    \ divides the operand on the left by the one on the right and returns the remainder.\
    \ It is also called the remainder operator. `X % Y` yields `0.67`.\n*   `++` Increment:\
    \ This operator increase the operand’s value by 1.\n"
