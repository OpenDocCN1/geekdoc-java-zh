  trans: "\n\n# 类（Classes）为对象的创建提供了蓝图。因此，对象基本上是从类创建的。考虑下面的示例：\n\n```java\npublic class\
    \ Shoes{\n    public Shoes(String name){\n        // 这个构造函数有一个参数，name。\n     \
    \   System.out.println(\"Preferred Shoe is :\" + name );\n    }\n\n    public\
    \ static void main(String []args){\n        // 下述语句将创建一个类型为 Shoes 的对象 \n     \
    \   Shoes kindofShoes = new Shoes( \"sneakers\" );\n    }\n}\n```\n\n编译并运行此程序将得到如下结果：\n\
    \nPreferred Shoe is : sneakers\n\n## 声明对象 (Declaring Objects)\n\n声明包括带有对象类型的变量名进行变量声明。**粗体**编写的代码集是将变量名与对象类型关联的变量声明。\n\
    \n在声明变量时，写为：\n\n`type name;`\n\n此声明告诉编译器 `name` 将被用于引用数据类型 `type`。如果使用原始变量，这种声明会为特定变量预留正确的内存。\n\
    \n引用变量可以单独另一行声明，例如所示：\n\n`Point sourceOne;`\n\n在此声明中，在创建对象并将其赋值之前，`sourceOne`\
    \ 将具有不确定的值。引用变量的简单声明不会自动从中创建对象。要从引用变量创建对象，必须使用运算符 `new`。此外，在代码中使用之前，必须将对象赋值给 `sourceOne`。否则将发生编译器错误。\n\
    \n在此状态下，声明的变量没有引用任何对象。\n\n## 实例化对象 (Instantiating objects)\n\n实例化基本上就是创建对象。这是因为这一基本上是从类创建一个实例，并从实例创建对象。在创建对象的这一使用了关键字\
    \ `new`。它通过为新对象分配内存空间来实例化类，并返回该特定内存的引用。`new` 还会调用对象的构造函数并使其工作。\n\n在使用 `new` 运算符时，参数应该是单个后缀，这是对构造函数的调用或信号。构造函数的名称即为将被实例化的类名。\n\
    \n然后，`new` 运算符将返回创建对象的引用。该引用通常被赋值给相应的变量类型。例如：\n\n`Point sourceOne = new Point(56,\
    \ 87);`\n\n运算符返回的引用并不总是赋值给变量。它也可以直接在表达式中使用，如本例所示：\n\n`int length1 = new Triangle().length1;`\n\
    \n## 初始化对象 (Initializing Objects)\n\n调用构造函数位于关键字 `new` 之后。该调用是必要的，以便初始化对象。来看这个示例，使用了\
    \ `Point` 类：\n\n```java\npublic class Point {\n    public int a = 0;\n    public\
    \ int d = 0;\n    //构造函数\n    public Point(int x, int z) {\n        a = x;\n \
    \       d = z;\n    }\n}\n```\n\n`Point` 类只有 1 个构造函数，这是因为它的名称与声明时的类名相同。它也没有返回类型。在此类中，构造函数接受\
    \ 2 个 `int` 参数，通过代码 `(int x, int z)` 声明。\n\n在随后的语句中，提供了构造函数参数的值：\n\n`Point sourceOne\
    \ = new Point(56, 87);`\n\n考虑以下关于 `Rectangle1` 类的代码，它包含了 4 个构造函数：\n\n```java\n\
    public class Rectangle1 {\n    public int width1 = 0;\n    public int height1\
    \ = 0;\n    public Point origin;\n    // 四个构造函数\n    public Rectangle1() {\n \
    \       origin = new Point(0, 0);\n    }\n\n    public Rectangle1(Point a) {\n\
    \        origin = a;\n    }\n\n    public Rectangle1(int w, int h) {\n       \
    \ origin = new Point(0, 0);\n        width1 = w1;\n        height1 = h1;\n   \
    \ }\n\n    public Rectangle1(Point a, int w1, int h1) {\n        origin = a;\n\
    \        width = w1;\n        height = h1;\n    }\n\n    // 移动矩形的方法\n    public\
    \ void move(int y, int z) {\n        origin.y = y;\n        origin.z = z;\n  \
    \  }\n\n    // 计算矩形面积的方法\n    public int getArea() {\n        return width1 *\
    \ height1;\n    }\n}\n```\n\n每个构造函数都允许通过引用和原始类型为矩形的 `origin` 以及高度和宽度提供初始值。如果一个类有多个构造函数，则需要不同的签名。通过这样，Java\
    \ 编译器能够根据参数的类型和数量来区分构造函数。因此，当编译器遇到此代码时：\n\n`Rectangle1 rectOne = new Rectangle(originOne,\
    \ 150, 250);`\n\n调用了位于 `Rectangle` 类中的构造函数，它需要 `Point` 参数，随后是 2 个 `int` 参数。\n\n\
    此代码调用了用于将 `origin` 初始化为 `originOne` 的构造函数之一。该构造函数将高度设置为 250，宽度设置为 150。\n\n## 使用对象\
    \ (Using Objects)\n\n创建对象后，下一步是使用它。对象的用途可能是利用其任何字段的值、更改字段或调用其任何方法来执行特定功能。\n\n\
    ### 对象的引用 (Making a reference to objects field)\n\n通过使用其名称可以访问对象。因此，名称是明确的。名称可能位于类内部。为了这一点，在类内部添加语句打印\
    \ `height1` 和 `width1`。\n\n`System.out.println(\"Width and height are: \" + width1\
    \ + \", \" + height1);`如果代码在类外部，使用对象表达式，如示例所示：\n\n`objectReference.fieldName`\n\
    \n考虑这个示例：\n`createObject` 中的代码在类外。因此为了成功引用 `rectOne` 的字段，程序必须使用 `rectOne.origin`\
    \ 后跟 `rectOne.width`。\n\n`System.out.println(\"Width of rectOne: \" + rectOne.width);`\n\
    \n`System.out.println(\"Height of rectOne: \" + rectOne.height);`如果在 `ObjectDemo`\
    \ 代码中使用简单的名称，将不会生效。这是对象内部的字段。如果程序使用相同的代码打印 `rectTwo` 的信息，需要进行一些调整。`rectOne` 和\
    \ `rectTwo` 是相同类型的对象。它们共享相同的实例字段，每个对象都有自己的实例字段副本。\n\n### 调用方法 (Calling methods)\n\
    \n要调用特定方法，必须使用其引用。方法的简单名称附加引用之后，并用点 (.)运算符分隔。为调用的方法提供参数并将其放在括号内。如果情况下方法没有参数要求，只需放置空括号。\n\
    \n例如：\n\n`objectReference.methodName(argumentList);`来看之前使用 `Rectangle` 类的示例。它包含\
    \ 2 个不同的方法，即获取面积 `getArea()` 和移动矩形原点 `move()`。以下调用了这 2 个方法：\n\n`System.out.println(\"\
    Area of rectOne: \" + rectOne.getArea());`\n\n...\n\n`rectTwo.move(40, 72);`\n\
    \n语句 `System.out.println(\"Area of rectOne: \" + rectOne.getArea());` 调用了 `rectOne`\
    \ 的面积并显示其结果。\n\n第 2 行 `rectTwo.move(40, 72);` 移动了 `rectTwo`，因为 `move()` 方法通过为\
    \ `origin.y` 和 `origin.z` 分配新值来工作。\n\n"
