    \ else in the method. These remain within the memory during the method execution.\
    \ When the method is used again, these can no longer be used.\n\n### Local Variables\n\
    \nLocal variables are ones that were defined and used for a specific method. The\
    \ function is within method level scope but do not play much function to method\
    \ signature. Local variables do not contain any modifiers. Also, these variables\
    \ cease to exist when the method returns.\n\n### Class variables\n\nAlso known\
    \ as static fields, class variables refer to any field declared by the modifier\
    \ `static`. It informs the compiler that this particular variable has exactly\
    \ only 1 copy available, no matter how many times that the class is referred to\
    \ or represented.\n\nClass variables are variables that are clearly defined at\
    \ the class level of a static modifier. This specific static modifier should not\
    \ be used with any other variables. The attached static modifier would produce\
