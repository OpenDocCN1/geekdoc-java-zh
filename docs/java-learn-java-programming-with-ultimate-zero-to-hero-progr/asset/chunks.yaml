    \ Operator: `Z %= X`.\n- `<<=` Left Shift Assignment Operator: `Z <<= X`.\n- `>>=`\
    \ Right Shift Assignment Operator: `Z >>= X`.\n- `&=` Bitwise AND Assignment Operator:\
    \ `Z &= X`.\n- `^=` Bitwise XOR OR Assignment Operator: `Z ^= X`.\n- `|=` Bitwise\
    \ OR Assignment Operator: `Z |= X`.\n\n## Miscellaneous Operators\n\nAside from\
    \ the main operators, Java supports a few other types:\n\n### Conditional operator\
