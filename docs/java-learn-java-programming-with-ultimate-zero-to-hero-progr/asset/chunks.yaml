    ARITHMETIC OPERATOR


    Consider the following example of how to conduct arithmetic operators.


    class BasicMathDemo {


    public static void main (String[] args) {


    int result = 5 + 1;


    // result is now 6


    System.out.printIn(“5 + 1 = “ + result);


    int original_result = result;


    result = result – 3;


    // result is now 3


    System.out.printIn(original_result + “ – 3 = “ + result);


    original_result = result;


    result = result * 4;


    // result is now 12


    System.out.printIn(original_result + “ * 2 = “ + result);


    original_result = result;


    result = result / 2;


    // result is now 6


    System.out.printIn(original_result + “ / 2 = “ + result);


    original_result = result;


    result = result + 5;


    // result is now 11


    System.out.printIn(original_result + “ + 5 = ” + result);


    original_result = result;


    result = result % 3;


    // result is now 2


    System.out.printIn(original_result + “ % 3 = “ + result);


    }


    }


    After the above program is done, the printed results will be:


    5 + 1 = 6


    6 – 3 = 3


    3 * 4 = 12


    12 / 2 = 6


    6 + 5 = 11


    11 / 3 = 2


    Arithmetic operators that contain simple assignment operators can be combined
    to create combined assignments. One example is x+=5; and x=x+5;. Both of these
    increase the value of x by 1.


    Using the operator “+” creates a concatenation or combination of 2 strings. The
    following illustrates how this can be done.


    class ConcatSample {


    public static void main(String[] args){


    String firstString = “This is”;


    String secondString = “ a concatenated string.”;


    String thirdString = firstString+secondString;


    System.out.printIn(thirdString);


    }


    }


    At the end of the program, the result will be:


    This is a concatenated string.


    UNARY OPERATORS


    This type of operator uses a single operand. It is used for various functions
    such as negation of expressions, inversion of boolean value or decrementing/incrementing
    values by one.


    + Unary plus operator: This is used to indicate a positive value.


    - Unary minus operator: This is used in negating an expression.


    ++ Increment operator: It produces an increment in a value by 1.


    -- Decrement operator: It creates a decrement in a value by 1.


    ! logical complement operator: It is used in inverting a Boolean value.


    Consider the following example of testing a unary operator:


    class UnaryDemo {


    public static void main(String[] args) {


    int result = +2;


    // result is now 2


    System.out.printIn(result);


    result--;


    // result is now 1


    System.out.printIn(result);


    result++;


    // result is now 2


    System.out.printIn(result);


    result = -result;


    // result is now -2


    System.out.printIn(result);


    Boolean success = false


    // false


    System.out.printIn(success);


    // true


    System.out.printIn(!success);


    }


    }


    The decrement/increment operators can be used as prefix (before) or as postfix
    (after) of an operand. Both the codes ++result; (prefix) and result++; (postfix)
    produces the result with an increment of 1\. The difference lies in which value
    is evaluated. The prefix (++result) evaluates based on the incremented value.
    The postfix (result++) evaluates based on the original value. Either version works
    if the program is performing increment/decrement. However, larger expressions
    would require a more specific choice, as the different results would create a
    significant difference in the final result.


    Consider the following example:


    class PrePostDemo {


    public static void main(String[] args){


    int g = 1;


    g++;


    // prints 2


    System.out.printIn(g);


    ++g;


    // prints 3


    System.out.printIn(g);


    // prints 4


    System.out.printIn(++g);


    // prints 4


    System.out.printIn(g++);


    // prints 5


    System.out.printIn(g);


    }


    }


    CONDITIONAL, EQUALITY AND RELATIONAL OPERATORS


    Relational and Equality Operators


    These operators function by determining if one of the operands is less than, greater
    than or equal to the other operand. When testing 2 primitive values if they are
    equal for this operator, use “==” instead of “=”.


    != not equal to


    == equal to


    > greater than


    < less than


    >= greater than or equal to


    <= less than or equal to


    Consider the following, which tests comparison operators


    class ComparisonTest {


    public static void main(String[] args){


    int value1 = 5;


    int value2 = 1;


    if(value1 == value2)


    System.out.printIn(“value1 == value2”);


    if(value1 != value2)


    System.out.printIn(“value1 != value2”);


    if(value1 > value2)


    System.out.printIn(“value1 > value2”);


    if(value1 < value2)


    System.out.printIn(“value1 < value2”);


    if(value1 <= value2)


    System.out.printIn(“value1 <= value2);


    }


    }


    The output of the above program would be:


    value1 != value2


    value1 < value2


    value1 <= value2


    Conditional Operators


    Conditional operators are the conditional AND and conditional OR. These tests
    2 boolean expressions. Conditional operators display a behavior called “short
    circuiting”. This is a process by which the 2^(nd) operand is evaluated


    || Conditional - OR


    && Conditional-AND


    Consider the following test for the conditional operator:


    class ConditionalSample1 {


    public static void main(string[] args){


    int value1 = 5;


    int value2 = 3;


    if((value1 == 5) && (value2 == 3))


    System.out.printIn(“value is 5 AND value2 is 3);


    if((value1 == 5) || (value2 == 5))


    System.out.printIn(“value1 is 5 OR value2 is 5”);


    }


    }


    The ?: is another conditional operator that is often considered as a shorthand
    for the statement if-then-else. It is also called the ternary operator because
    it involves 3 operands. The result of this operator is read as “if (someCondition)
    is true, assign value1 to the result. If it is otherwise, assign value2 to the
    result.


    Consider the following test for the ?: operator:


    class ConditionalSAmple2 {


    public static void main(String[] args){


    int value1 = 3;


    int value2 = 5;


    int result;


    boolean someCondition = true;


    result = someCondition ? value1 : value2;


    System.out.printIn(result);


    }


    }


    The someCondition is true, which would yield a printed result of “1” on the screen.


    The ?: operator can be used instead of making an if-then-else statement. This
    helps to make the code more readable, such as when using compact expressions.


    Instanceof operator


    This is a type comparison operator. It compares the object to the specified type.
    This tests if the stated object is an instance that belongs to a class, subclass
    or a class implementing a certain interface.


    Consider the following InstanceofDemo1 program that illustrates how to define
    a parent class, a simple interface and a child class (which inherits from the
    parent). This program will then implement the interface.


    class InstanceofDemo1 {


    public static void main(String[] args) {


    Parent obj1 = new Parent1();


    Parent obj2 = new Child1();


    System.out.printIn(“obj1 instanceof Parent1: “


    + (obj1 instanceof Parent1));


    System.out.println("obj1 instanceof Child1: "


    + (obj1 instanceof Child1));


    System.out.println("obj1 instanceof MyInterface: "


    + (obj1 instanceof MyInterface));


    System.out.println("obj2 instanceof Parent1: "


    + (obj2 instanceof Parent1));


    System.out.println("obj2 instanceof Child: "


    + (obj2 instanceof Child1));


    System.out.println("obj2 instanceof MyInterface: "


    + (obj2 instanceof MyInterface));


    }


    }


    class Parent {}


    class Child extends Parent implements MyInterface {}


    interface MyInterface {}


    The output of this program would be the following:


    obj1 instanceof Parent: true


    obj1 instanceof Child: false


    obj1 instanceof MyInterface: false


    obj2 instanceof Parent: true


    obj2 instanceof Child: true


    obj2 instanceof MyInterface: true


    With instanceof operator, null is not considered as an instance for anything.


