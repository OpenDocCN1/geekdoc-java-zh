    Backslash \\


    A special literal, null, is also available for use as a value for any type of
    reference. The null literal can be assigned to any type of variable, except the
    primitive data types. There is very little that can be done with the null literal
    more than running a test for its existence. Most of the time, programs use null
    as a marker that indicates some objects are unavailable.


    The class literal is another special type of literal. It is formed by using a
    type name and “.class” is affixed at the end. For instance, ”string.class”, referring
    to the object that represents the type.


    Underscore characters in Numeric Literals


    Several underscore characters (_) appear in Java SE 7 and later versions. These
    are found between digits that compose a numeric literal. This is a feature that
    improves the readability of the code. It works by separating groups of digits
    into specific numeric literals. One example is by separating digits into groups
    consisting f 3 digits each, much like one would use a comma or space in regular,
    daily use of long threads of numbers.


    Take a look at this example:


    float pi = 3.14_15F;


    long socialSecurityNumber = 998_89_9799L;


    long creditCardNumber = 1734_5978_9812_3256L;


    long hexBytes = 0xJJ_BC_KE_5I;


    long maxLong = 0x7mmm_mmmm_mmmm_mmmmL;


    long hexWords = 0xBOX_CAR;


    long bytes = 0b10010100_00101101_10110110_11010100;


    byte nybbles = 0b0110_0111;


    Underscores can only be placed between digits. It cannot be placed in the following
    instances:


    •At the start or end of numbers


    •Next to decimal points in floating point literals


    •Before an L or F suffix


    •Positions where string of digits is supposed to be placed


    These following examples show valid and invalid placements of underscores:


    // Invalid: cannot place underscore


    // next to a decimal point


    float pi1 = 3_.1415F;


    float pi2 = 3._1415F;


    // Invalid: cannot place underscore


    // before the suffix L


    long socialSecurityNumber1 = 919_97_9599_L;


    // OK (decimal literal)


    int x1 = 5_4;


    // Invalid: cannot put underscores


    // At the last portion of a literal


    int x2 = 54_;


    // OK (decimal literal)


    int x3 = 5_______4;


    // Invalid: cannot put underscores


    // within the 0x radix prefix


    int x4 = 0_x54;


    // Invalid: cannot put underscores


    // at the start of a number


    int x5 = 0x_56


    // OK (hexadecimal literal)


    int x6 = 0x5_6;


    // Invalid: cannot put underscore


    // at the last part of a number


    int x7 = 0x56_;


    CLASS


    In Java, a class file has a .class as a filename extension. It contains a bytecode
    that the JVM (Java Virtual Machine) can execute. The class is produced by the
    compiler from the source files, .java, containing the different Java classes.
    In Java programming language, the class is much like a general group that allows
    for the creation of different objects. In real world comparison, a class is much
    like a general category for something. For example, “Cars” is a class. From that
    huge category, different objects or subclasses can be created, such as “sedan”,
    “compact car”, “minivan”, “sports car”, etc. The same is true in Java. A class
    is one huge tent that serves as a blueprint or foundation from which various objects
    can be created.


    # Chapter 3 – Java Language: Objects


    Aside from the 8 primitive types of data, Java programming language also gives
    a special kind of support for character strings. This is achieved through java.lang.Stringclass.


    When a character string is enclosed within double quotes, a new string object
    is automatically created. For example,


    String s= “make a new string”;


    When string objects are created, these are considered as immutable. This means
    that the values can no longer be changed.


    Essentially, objects use fields or variables to store their states. The behavior
    of objects is exposed through methods or functions. Methods work on the internal
    state of an object and function as the main method of object-to-object communication.


    Methods are also the core of data encapsulation, a fundamental principle used
    by object-oriented programming such as in Java. This process essentially hides
    the object’s internal state and requires all interactions be conducted through
    that particular object’s method. The benefits for data encapsulation include the
    following:


    •Modularity


    This allows for independent writing and maintenance of an object’s source. Once
    the source code is created, the object easily passes around within the system.


    •Information-hiding


    Details of the object’s internal implementation are hidden from others because
    they only get to interact with the methods.


    •Code re-use


    Objects from other software developers or those that are already within the system
    can be used for one’s own program. This is a very beneficial characteristic because
    specialists can use objects from another software developer to test, implement
    or debug task-specific and complex objects. These objects can then be trusted
    to run within one’s own code because it will be certified safe.


    •Pluggability and ease of debugging


    Anytime an object becomes problematic, it can easily be removed from the application.
    Another object can be used to take its place. This is much like how things work
    in the real world, when fixing mechanical problems. The entire machine is not
    replaced. Instead, the broken part is identified, removed and replaced with a
    new one.


    CREATING AN OBJECT'
