    \ declaration reserves the correct memory for the particular variable.\n\nReference\
    \ variables can be declared on its very own line, such as in this example:\n\n\
    `Point sourceOne;`\n\nIn this declaration, `sourceOne` will have undetermined\
    \ value until an object is created and has been assigned to it. A simple declaration\
    \ of a reference variable does not automatically create an object from it. To\
    \ create an object from a reference variable, the operator `new` must be used.\
    \ Also, the object must be assigned to `sourceOne` before it can be used in a\
    \ code. If not, a compiler error occurs.\n\nIn this state, the declared variable\
    \ is currently referencing to no object.\n\n## Instantiating objects\n\nInstantiating\
    \ is basically creating the object. This is because this step basically creates\
    \ an instance of a class from which the object is created. In this part of creating\
    \ an object, the keyword `new` is used. It instantiates a class by allotting memory\
    \ space for the new object and returns a reference for that specific memory. The\
    \ operator `new` also calls upon an object constructor and puts it to work.\n\n\
    In using `new` operator, the argument should be a single postfix, which is a call\
    \ or signal to a constructor. The constructor’s name gives the class' name that\
    \ will be instantiated.\n\nThen, the operator `new` will return a reference to\
    \ the created object. The reference is often assigned to the appropriate variable\
    \ type. For example:\n\n`Point sourceOne = new Point(56, 87);`\n\nThe reference\
    \ that the operator returns does not always get to be assigned to a variable.\
    \ It may also be directly used in an expression such as in this example:\n\n`int\
    \ length1 = new Triangle().length1;`\n\n## Initializing Objects\n\nCalling a constructor\
    \ follows after the keyword `new`. The call is necessary in order to have the\
    \ object initialized.\n\nTake a look at this example, using the class `Point`:\n\
    \n```java\npublic class Point {\n    public int a = 0;\n    public int d = 0;\n\
    \    //constructor\n    public Point(int x, int z) {\n        a = x;\n       \
    \ d = z;\n    }\n}\n```\n\nThe `Point` class only has 1 constructor, which is\
    \ recognizable because it uses the same name as that of the class when it was\
    \ declared. It also has no return type. In this class, the constructor took 2\
