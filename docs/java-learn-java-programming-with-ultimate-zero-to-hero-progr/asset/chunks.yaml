    or methods within the class. It is normally recommended to keep these instance
    variables private within the access level. Access modifiers can be added to instance
    variables. Doing so will allow visibility for the subclasses.


    Default values are available for instance variables. Numbers come with a default
    value of 0\. Booleans have a default value of false. Object references have “null”
    for default value. Assigning values can be done during the variable’s declaration
    or within a constructor.


    To access instance variables, do so by directly calling the name of the variable
    inside a class. Use the fully qualified name “ObjectReference VariableName” when
    accessing instance variables within a different class and within static methods.


    Take a look at this example:


    importjava.io*;


    public class Student{


    //this instance variable is visible for any child class.


    Public String name;


