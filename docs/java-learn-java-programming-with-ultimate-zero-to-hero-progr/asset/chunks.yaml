    \ : “ + name );\n        System.out.println(“salary :” + salary);\n    }\n\n \
    \   public static void main(String args[]){\n        Student studeOne = new Student(“Jennica”);\n\
    \        empOne.setGrade(98);\n        empOne.printStude();\n    }\n}\n```\n\n\
    The result will be:\n\nname : Jennica\ngrade : 98\n\n## Class/Statistic variables\n\
    \nClass or statistic variables are declared using the keyword `static` in a class.\
    \ This, however, is outside of a block, method, or constructor. Declaration creates\
    \ only a single copy of each class variable for each class, no matter how many\
