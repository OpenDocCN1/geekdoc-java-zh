    # Chapter 4 – Java Language: Variables


    Java programming uses variables. These are named storage that can be manipulated
    by the program. These have specific types determined by the following parameters:


    •Memory size occupied by the variable


    •Layout of the memory occupied by the variable


    •Range of values that the variable’s memory space can accommodate


    •Set of operations that the variable allows


    TYPES OF VARIABLES


    Instance variables


    These are also referred to as “non static fields”. The individual states of objects
    are stored in non static fields. These are fields that have not been defined by
    the keyword static. These are also called instance variables because the values
    are unique for each instance or each object.


    Instance variables are used in storing the state of an object. A copy of the variable
    is available for each of the objects formed from a class. This copy is valid and
    occupies the assigned storage provided that its corresponding object remains within
    the memory.


    Arguments or Parameters


    Variables of this type are ones that were passed into method signatures such as
    parameter. Another example is the use of args in the previous examples. These
    are not connected to modifiers, such as static, protected or public. These can
    be used, however, everywhere else in the method. These remain within the memory
    during the method execution. When the method is used again, these can no longer
    be used.


    Local Variables


    Local variables are ones that were defined and used for a specific method. The
    function is within method level scope but do not play much function to method
    signature. Local variables do not contain any modifiers. Also, these variables
    cease to exist when the method returns.


    Class variables


    Also known as static fields, class variables refer to any field declared by the
    modifier static. It informs the compiler that this particular variable has exactly
    only 1 copy available, no matter how many times that the class is referred to
    or represented.


    Class variables are variables that are clearly defined at the class level of a
    static modifier. This specific static modifier should not be used with any other
    variables. The attached static modifier would produce a single copy for each of
    the variables.


    DECLARING VARIABLES


    Before any variable can be used, it must be declared first. Basic variable declaration
    is in the following form:


    data type variable [ = value][, variable [=value] …];


    The data type part refers to any of the different data types in Java, such as
    int. The variable part refers to the name given to that particular variable. Commas
    can be used to separate multiple variables belonging to the same data type when
    declaring them.


    Valid variable declarations are in the following form:


    int d, e, f; //when declaring the 3 variables d, e, and f, which are all of the
    same data type, int


    int g = 10, h = 10; //an example form of initialization


    byte E = 76; // initializing variable E, which is a byte type


    double pi = 3.14159; // declaring and assigning the value of pi


    char j = ‘j’; // char variable j initialized with ‘j’ as its value


    Local variables


    Local variables functions as storage of a method’s temporary state, much like
    how fields function for storage of object states. Declaring local variables is
    the same as declaring a field. Take a look at this example:


    Int count = 5;


    No special keywords are required to declare any variable as local. It is determined
    entirely on where the variable was declared. This is located in between the opening
    and the closing braces of the particular method that stores its temporary state.
    Because of this, local variables become visible only to the methods where they
    have been declared. These are, however, not accessible compared to the rest of
    the class.


    When declaring local variables, blocks, constructors and methods are used. There
    are no default values for so these should be declared. An initial value must be
    assigned before these are used. To create local variables, enter the particular
    block, method or constructor. Once the variables exit the block, constructor or
    method, it will be destroyed.


    For local variables, access modifiers cannot be used. They become visible only
    within their declared block, method or constructor. To implement these declared
    local variables, they are implemented internally at stack level.


    Take a look at this example:


    The local variable is age, defined inside the “catAge()” method. The scope of
    use for this declared variable works within this particular method only.


    public class Test{


    public void catAge(){


    int age = );


    age = age + 9;


    System.out.printIn(“Cat age is : “ + age);


    }


    public static void main(String args[]){


    Test test = new Test();


    Test.catAge();


    }


    }


    The result of this is:


    Cat age is: 9


    In the following example, if the local variable age is used without initialization.
    There would be an error at the compilation time.


    public class Test {


    public void catAge(){


    int age;


