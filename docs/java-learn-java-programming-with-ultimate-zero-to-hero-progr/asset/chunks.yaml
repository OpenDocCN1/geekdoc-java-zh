    \ and the storage is in static memory. These variables are made when a program\
    \ starts. Once the program stops, the static variable is destroyed. The visibility\
    \ is similar to instance variables, although, most static variables are declared\
    \ public because these have to be available for the class users.\n\nThe default\
    \ values of static variables are the same as those of instance variables. The\
