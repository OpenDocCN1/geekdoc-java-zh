    \ the area of this 2^(nd) rectangle, based on the new numbers or figures (value)\
    \ but based on the original equation.\n\nInvoking or calling upon an object reference\
    \ is much like sending messages to that particular object. It tells the method\
    \ to come into play and give the desired results.\n\n## Garbage Collection\n\n\
    Other object-oriented languages require regular tracking of the objects created.\
    \ Users have to check objects one-by-one and painstakingly delete each object\
    \ that is no longer being used. This takes too much time and effort. This method\
    \ also is a huge risk on accidentally deleting an object that may be needed in\
    \ the future or objects that are still being used by current programs. With Java,\
    \ deleting objects is much easier and less prone to deletion errors. Java allows\
    \ users to create a vast number of objects, as long as the system can handle all\
    \ the data and has adequate memory space for everything. The part is that there\
    \ is no need to worry about having to clean up the various programs by deleting\
    \ unused objects. There is no need to scroll through a long list of objects just\
    \ to find the ones that should already be deleted. Java provides a neat process\
    \ called the garbage collector. The runtime environment implemented by the Java\
    \ programming language detects and automatically deletes any object that is no\
    \ longer in use.\n\nThe garbage collector only deletes objects that no longer\
    \ have any references. When a variable goes out of range, the references that\
    \ this particular variable holds will be dropped. Once the references are dropped,\
    \ the garbage collector will automatically delete it.\n\nTo induce the garbage\
    \ collector to delete an object, the user explicitly drops the reference to that\
    \ object. To do so, access the variable and assign it with `null`, which is a\
    \ special value. Once assigned with the `null` value, the reference is dropped\
    \ and the garbage collector deletes the object. Also, it is important to remember\
    \ that for an object to be successfully deleted, all of its existing references\
    \ must be dropped. Otherwise, the program will continue to hold on to the object\
    \ and make it available.\n\n# Chapter 4 – Java Language: Variables\n\nJava programming\
    \ uses variables. These are named storage that can be manipulated by the program.\
    \ These have specific types determined by the following parameters:\n\n* Memory\
    \ size occupied by the variable\n* Layout of the memory occupied by the variable\n\
    * Range of values that the variable’s memory space can accommodate\n* Set of operations\
    \ that the variable allows\n\n## TYPES OF VARIABLES\n\n### Instance variables\n\
    \nThese are also referred to as “non static fields”. The individual states of\
