    # 第 1 章 – Java 基础


    `Java` 是一种具有许多应用的计算平台和编程语言。这种编程和计算软件无处不在。它存在于各种计算机和数据中心，包括简单的笔记本电脑。平板电脑和手机等移动设备都使用
    `Java`。互联网也使用 `Java` 进行运行。事实上，`Java` 是几乎每种网络应用程序的核心。


    在设备上安装 `Java` 允许用户在互联网上聊天、玩在线游戏和查看 3D 。它是允许计算（如抵押贷款计算和简单算术）的程序中不可或缺的。它还是各种企业计算需求的基础，例如电子商务解决方案和内网应用。


    ### Java 的起源是什么？


    20 世纪 90 年代初，一个由詹姆斯·高斯林（James Gosling）领导的太阳太阳微系统公司团队开发了这种计算机编程语言。最初的设计旨在用于手机、机顶盒和其他数字移动设备。该编程语言最初被命名为
    `OAK`。第一个版本未能吸引大量的赞助，这促使公司进行了一些修改。该语言经过了修改以适应互联网，名称也更改为今天所看到的 `Java`。1996 年，`Java
    1.0`向公众发布。这次公开发将其主要用途从移动设备转移到了蓬勃发展的互联网。


    ### 谁在使用 Java？


    `Java` 也是嵌入式和移动应用开发与交付的全球标准。它也是 Web 内容、企业级和游戏领域的标准。约 97% 的企业在运行 `Java` 的桌面电脑上运营。仅在美国，约有
    89% 的计算机或桌面电脑也使用 `Java` 程序运行。


    超过 900 万名开发者正在使用 `Java` 进行所有所需的应用程序和服务。在全球范围内，还有惊人的 30 亿部手机也使用 `Java` 作为其核心操作和应用程序。所有的蓝光播放机都配备了
    `Java` 程序。约 1.25 亿台电视设备在其实基础操作中使用 `Java`。目前有高达 50 亿张 `Java` 卡正在使用。各种电气设备的前 5 大原始制造商都出货
    `Java ME`。这些数字显示了 `Java` 的使用多么广泛。


    `Java` 为用户提供了更多的交互性。这允许开发者制作动画网页，从而增加了网站对在线用户的吸引力。随着时间的推移，`Java` 演变成了一个全球性的成功。它的使用扩展到了涵盖互联网用途之外的应用程序和服务。即使在向公众发布多年后，`Java`
    仍然流行。截至今天，全球约有 65 亿开发者正在使用它，从简单的桌面应用程序到复杂的、敏感的科学超级计算机。


    修改包括对 `C++` 编程语言的简化。消除了一些语言特性，减少了许多常见的编程错误。


    `Java` 使用源代码文件，即使用 `.java` 扩展名的文件。这些源代码由编译器汇装并分组，然后格式化为字节码。字节码是一个具有 `.class` 扩展的文件，由
    `Java` 解释器执行。所有编译的 `Java` 代码都可以由于 `VMs`（或 `Java 虚拟机`）而运行在任何计算机上。这些是存在 Windows、Macintosh
    OS 和 UNIX 等大多数操作系统中的运行时环境和 `Java` 解释器。字节码可以由 `JIT`（即时编译器）直接转换为机器语言指令。


    ### 使用 Java 的核心原则


    `Java` 的设计包含了 4 个核心原则，即易用性、可靠性、安全性和平台无关。


    #### 易用性


    `Java` 的基础源于 `C++`，这是一种强大的编程语言。然而，它的语法被认为非常复杂。`Java` 构建在 `C++` 语言之上并对其改进。结果是一个既强大又简单的编程平台。


    #### 可靠性


    `Java` 开发的主要原则之一是减少产生常见编程错误的可能性，这些错误可能会严重阻碍程序高效运行。为了消除常见的编程错误，`Java` 引入了一种面向对象的编程方法。数据及其操作方法被方便地封装在一个地方。这种技术使
    `Java` 编程变得更加健壮和可靠。


    #### 安全性


    如前所述，`Java` 最初是为预期在各种网络上交换数据的移动设备开发的。这一功能需要高水平的安全措施，而 `Java` 能够提供这些措施。到目前，`Java`
    被高度认为是所有可用编程语言中最安全的。


    #### 平台无关


    `Java` 是一种可移植的语言。它不区分各种平台。这意味着无论存在什么种类型的硬件或什么种操作系统，它都能运行得完美且保持一致。


    # 使用 Java 进行软件开发的优势


    `Java` 是一种计算机编程语言，经过了多年的磨练、改进、精炼、测试、扩展和证明。一个由爱好者以及 `Java` 开发者和架构师组成的专门社区都在共同努力，帮助该语言能够满足软件开发者和用户各种化且不断变化的需求。它能够在许多平台上执行最广泛的功能，并提供最高的性能。这些关键特征使得像企业这样的用户能够提供更好、更广泛的服务。这些提升了终端用户的生产力，以及协作与通信（主要得益于其平台无关的特性）。这些极地减少了拥有消费者和企业级应用的成本。


    对于软件开发者来说，`Java` 提供了以下主要优势：


    - 软件可以在一种平台上编写，并可以在任何其他不同平台上运行，且具有相同一致的功能

    - 使用 `Java` 创建的程序可以在任何网络浏览器中运行，并可以访问任何可用的 Web 服务

    - `Java` 可用于开发服务端应用程序，可用于在线投票、商店、论坛、HTML 表单处理等。

    - `Java` 语言通过允许集成和组合以适应特定需求，实现了应用程序服务的定制


