    # 引言


    我想感谢你的下载，并祝贺你下载了《Java：针对初学者的零到英雄编程速成课程》一书。


    这本书包含了经过验证的步骤和策略，教你如何使用 `Java` 并在短时间内成为编程专家。这本书将帮助初学者了解并理解 `Java` 是什么，它可以做什么，以及如何最大限度地利用该程序。


    理解 `Java` 将为你开启一个全新的世界，因为 `Java` 处于当今编程的核心，从笔记本电脑到超级计算机，从手机到游戏机。甚至互联网也使用 `Java`，因为应用程序和网站需要
    `Java` 才能运行。因此，即使你不精通计算机编程，在在线活动中仍然需要它。


    对于初学者来说，编程语言可能会让人有些无所措。面对所有的术语和字符字符串，人们很容易迷失方向。幸运的是，这本书就是你上手并轻松掌握这款编程软件所需的一切。


    再次感谢下载本书，希望你读得愉快！


    ## 目录


    - 引言

    - 第 1 章 - Java 基础

    - 第 2 章 基础 Java 语言

    - 第 3 章 Java 语言：对象

    - 第 4 章 Java 语言：变量

    - 第 5 章 Java 语言：运算符

    - 结论

    - “ZERO to HERO”的其他书籍

