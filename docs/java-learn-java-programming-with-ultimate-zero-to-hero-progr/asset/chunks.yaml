    and the maximum value is 2^(31)-1\. This data type is used in Java SE 8 and later
    versions as a means to represent unsigned 32-bit integers from 0 to 2^(31)-1.


    The int data type can be used as an unsigned integer. To do this, the Integer
    Class of variables has to be used. The integer class incorporates methods such
    as compareUnsigned and divideUnsigned in order to support arithmetic operations
    that involve unsigned integers.


    long


    This type of data is 64-bit two’s complement integer. The minimum value of a signed
    long data is -2^(63) and with a maximum value of 2^(63)-1\. For Java versions
    SE 8 and later, long data types can be used for representing unsigned 64-bit long.
    These have minimum value of 0 and maximum value of 2^(64)-1\. These are used when
    there is a need for wider range of values than those offered by the data type
    int. Long class data incorporates methods such as divideUnsigned and compareUnsigned.
