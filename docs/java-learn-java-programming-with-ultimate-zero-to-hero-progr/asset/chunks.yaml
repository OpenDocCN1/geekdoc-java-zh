- fmt: 'For the integral types of `int`, `long`, `short` and `byte` data, the values
    can be made from `int` literals. For type `long` values that are more than the
    range provided by `int`, `long` literals can be used instead.


    Integer literals are expressed in various number systems such as these:


    - Decimal: This number system is the one everyone uses in real life on a daily
    basis, outside of programming. The numbers are in base 10, composed of digits
    from number `0` to `9`.

    - Hexadecimal: This number system uses letters and numbers. Using base 16, the
    digits are composed of a combination of the letters `A` to `Z` and the numbers
    `0` to `9`.

    - Binary: this number system is at base 2. The digits are various combinations
    of number `0` and `1`. Binary literals can be created in Java SE 7 and later versions.


    The decimal system is used when creating general purpose programming. The following
    are examples on how to use the correct syntax when using any of these number systems.
    For hexadecimals, the prefix `0x` is used. For binary, the prefix `0b` is used.


    ```

    // The number 35, in decimal

    int decVal = 35;


    // The number 26, in hexadecimal

    int hexVal = 0x1a;


    // The number 26, in binary

    int binVal = 0b11010;

    ```


    ### Floating point literals


    This is a type of `float` if the literal ends with `F` or `f`. If not, then it
    is considered a `double` data type, optionally ending in `D` or `d`. For both
    floating types (`double` and `float`), the scientific notation is expressed with
    the letter `E` or `e`. For 32-bit float literal, the letter `F` or `f` is used.
    A `D` or `d` is used for 64-bit double literal, although this is already a default
    and omitted by convention.


    For example:


    ```java

    double d1 = 456.4;


    // same value as d1, but in scientific notation

    double d2 = 4.564e2;


    float f1 = 456.4f;

    ```


    ### Character and String Literal


    The string and `char` types of literals often contain Unicode characters (UTF-16).
    These characters may be used directly in the code if the file system and editor
    allow it. Otherwise, the Unicode escape may be used, such as `\u0108` (for capital
    C that has a circumflex) or `S\u00ED Se\u00Flor` (for the Spanish Si Señor). For
    `char` literals, use single quotes (`‘`). For string literals, use double quotes
    (`“). There are also uses for Unicode escapes in a program other than in string
    or char literals, for instance, in field names.


    There also other special escape sequences supported by Java programming language
    for string and char literals. These are:


    - Backspace `\b`

    - Tab `\t`

    - Line feed `\n`

    - Form feed `\f`

    - Carriage return `\r`

    - Double quote `\"`

    - Single quote `\''`

    - Backslash `\\`


    A special literal, `null`, is also available for use as a value for any type of
    reference. The `null` literal can be assigned to any type of variable, except
    the primitive data types. There is very little that can be done with the `null`
    literal more than running a test for its existence. Most of the time, programs
    use `null` as a marker that indicates some objects are unavailable.


    The class literal is another special type of literal. It is formed by using a
    type name and `.class` is affixed at the end. For instance, `"string.class"`,
    referring to the object that represents the type.


    ### Underscore characters in Numeric Literals


    Several underscore characters (`_`) appear in Java SE 7 and later versions. These
    are found between digits that compose a numeric literal. This is a feature that
    improves the readability of the code. It works by separating groups of digits
    into specific numeric literals. One example is by separating digits into groups
    consisting of 3 digits each, much like one would use a comma or space in regular,
    daily use of long threads of numbers.


    Take a look at this example:


    ```java

    float pi = 3.14_15F;


    long socialSecurityNumber = 998_89_9799L;


    long creditCardNumber = 1734_5978_9812_3256L;


    long hexBytes = 0xJJ_BC_KE_5I;


    long maxLong = 0x7mmm_mmmm_mmmm_mmmmL;


    long hexWords = 0xBOX_CAR;


    long bytes = 0b10010100_00101101_10110110_11010100;


    byte nybbles = 0b0110_0111;

    ```


    Underscores can only be placed between digits. It cannot be placed in the following
    instances:


    - At the start or end of numbers

    - Next to decimal points in floating point literals

    - Before an `L` or `F` suffix

    - Positions where string of digits is supposed to be placed


    The following examples show valid and invalid placements of underscores:


    ```java

    // Invalid: cannot place underscore

    // next to a decimal point

    float pi1 = 3_.1415F;

    float pi2 = 3._1415F;


    // Invalid: cannot place underscore

    // before the suffix L

    long socialSecurityNumber1 = 919_97_9599_L;


    // OK (decimal literal)

    int x1 = 5_4;


    // Invalid: cannot put underscores

    // At the last portion of a literal

    int x2 = 54_;


    // OK (decimal literal)

    int x3 = 5_4;

    ```

