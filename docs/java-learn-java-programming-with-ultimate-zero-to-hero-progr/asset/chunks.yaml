    \ variable. Commas can be used to separate multiple variables belonging to the\
    \ same data type when declaring them.\n\nValid variable declarations are in the\
    \ following form:\n\n```\nint d, e, f; //when declaring the 3 variables d, e,\
    \ and f, which are all of the same data type, int\nint g = 10, h = 10; //an example\
    \ form of initialization\nbyte E = 76; // initializing variable E, which is a\
    \ byte type\ndouble pi = 3.14159; // declaring and assigning the value of pi\n\
    char j = ‘j’; // char variable j initialized with ‘j’ as its value\n```\n\n###\
    \ Local variables\n\nLocal variables functions as storage of a method’s temporary\
