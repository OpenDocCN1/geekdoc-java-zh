    # Chapter 1 – Java Basics


    `Java` is a computing platform and a programming language that has lots of applications.
    This programming and computing software is present everywhere. It is in all kinds
    of computers and data centers, including the simple laptop. Mobile devices like
    tablets and cell phones all use `Java`. The Internet, too, uses `Java` for its
    operations. In fact, `Java` is at the core of nearly every kind of networked application.


    Installing `Java` in a device allows the user to chat on the Internet, play games
    online, and view 3D images. It is integral in programs that allow computations
    such as mortgage interest computations and simple arithmetic. It is also the foundation
    of various corporate computing needs such as e-business solutions and intranet
    applications.


    ### What is the origin of Java?


    A team from Sun Microsystems led by a man named James Gosling developed this computer
    programming language in the early 1990s. The original design was intended to be
    used on cellular phones, set-top boxes, and other digital mobile devices. The
    programming language was originally named `OAK`. The first version failed to attract
    a substantial patronage, which prompted the company to make some modifications.
    The language was modified to cater to the Internet and the name was changed into
    `Java` as it is called today. In 1996, `Java 1.0` was made available to the public.
    This public release shifted its main use from use on mobile devices to use on
    the burgeoning Internet.


    ### Who uses Java?


    `Java` is also the global standard in embedded and mobile applications development
    and delivery. It is also the standard in web-based contents, enterprise and games.
    About 97% of enterprises operated in desktops run on `Java`. In the US alone,
    about 89% of computers or desktops also operate using the `Java` program.


    More than 9 million developers are using `Java` for all applications and services
    needed. Worldwide, an astounding 3 billion mobile phones also use `Java` for its
    core operations and applications. All Blu-ray disc players are equipped with the
    `Java` program. About 125 million TV devices use `Java` in their fundamental operations.
    `Java` cards reaching a whopping 5 billion are currently in use. All of the Top
    5 original manufacturers of various electrical equipment ship the `Java ME`. These
    figures show just how widespread `Java` use is.


    `Java` provided users with more interactivity. This allowed developers to produce
    webpages that are animated, which increased websites’ appeal to online users.
    With the passing of the years, `Java` evolved into a worldwide success. Its use
    expanded to included applications and services that went beyond Internet use.
    Even after more than a decade since it was released to the public, `Java` remains
    popular. As of today, about 6.5 billion developers worldwide are using it, from
    simple desktop applications to complex, sensitive scientific supercomputers.


    The modifications include a simplification of the `C++` programming language.
    A few language features were eliminated, which reduced a lot of common programming
    errors.


    `Java` uses source code files, which are files that use a `.java` extension name.
    These source code files are assembled and grouped together by a compiler and formatted
    into a bytecode. A bytecode is a file that has a `.class` extension, which a `Java`
    interpreter executes. All `Java` codes that were compiled are able to run on any
    computer because of `VMs` or `Java Virtual Machines`. These are runtime environments
    and `Java` interpreters present in most operating systems such as Windows, Macintosh
    OS and UNIX. Bytecodes may be directly converted by `JIT` (just-in-time compiler)
    into machine language instructions.


    ### Key Principles of using Java


    The `Java` design incorporated 4 key principles, namely, ease of use, reliability,
    security, and platform independent.


    #### Ease of Use


    The basics of `Java` originated from `C++`, which is a powerful programming language.
    However, its syntax is considered as very complex. `Java` built on the `C++` language
    and improved on it. The result is a powerful yet simple programming platform.


    #### Reliability


    One of the main principles in the development of `Java` was to reduce the possibility
    of making common programming errors that may seriously hinder efficient program
    function. To eliminate common programming mistakes, `Java` introduced a programming
    method that is object oriented. Data and its methods of manipulation were conveniently
    packaged in one place. This technique made `Java` programming more robust and
    reliable.


    #### Security


    `Java`, as previously mentioned, was originally developed for mobile devices expected
    to exchange data over various networks. This function required high level security
    measures, which `Java` was able to provide. To date, `Java` is highly considered
    as the most secure of all programming languages available.


    #### Platform independent


    `Java` is a portable language. It does not discriminate across various platforms.
    This means that it works perfectly fine and consistent regardless of whatever
    type of hardware or what operating system is present.


    # Advantages of Using Java for Software Development


    `Java` is a computer programming language that has been honed, improved, refined,
    tested, extended and proven through the years. A dedicated community involving
    enthusiasts, as well as `Java` developers and architects all work together to
    help the language able to meet the various and changing needs of software developers
    and users. It is able to perform the widest range of functions, across numerous
    platforms, and provide the highest performance. These key characteristics enable
    users such as businesses to provide better and wider ranges of services. These
    boost the productivity of end-users, as well as collaboration and communication
    (mainly from its platform independent characteristic). These also immensely reduce
    the costs involved in owning consumer and enterprise applications.


    To software developers, `Java` provides the following major benefits:


    - Software can be written in one kind of platform and have it run in practically
    any other different platform with the same, consistent function

    - Programs created using `Java` can be run within any web browser and can be used
    to access any available web services

    - `Java` can be used for development of server-side applications that can be used
    for online polls, store, forums, processing of HTML forms, among many others.

    - `Java` language enables customization of applications and service by allowing
    integration and combination to suit specific needs

