    \ | 30.00 | 01-MAY-13 |\n\n## 多层嵌套子查询\n\n子查询可以包含另一个查询，使其成为具有多个嵌套子查询的查询。例如，列表 6.7\
    \ 中的查询具有多个嵌套子查询。注意那两个 IN，分别对应两个嵌套查询。查询仅返回没有订购包含 'Nut' 产品名的客户。\n\n列表 6.7：带有多个嵌套子查询的查询\n\
