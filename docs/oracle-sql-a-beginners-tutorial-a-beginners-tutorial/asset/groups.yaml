    ```\n\n这是查询结果。\n\n```\nC_NO C_NAME\n------\n40 Super Agent\n10 Standard Store\n\
    ```\n\n## 关联子查询\n\n之前的子查询都是独立于其外部查询的。子查询也可以与其外部查询相关，其中外部表中的一个或多个列与子查询表的列（们）相关。这种子查询被称为关联子查询。\n\
    \n例如，列表 6.8 中的查询包含一个关联子查询，返回订购了任何包含 'Nut' 名称产品的客户。注意外部表的 c_no 列与 c_order 表的 c_no\
    \ 列相关。\n\n## 使用关联子查询\n\n```\nSELECT customer.*\nFROM customer\nWHERE c_no IN\n\
