    ```


    # User_Source 视图


    我解释的最后一个视图是 `user_source` 视图。该视图包含你的存储函数的源代码。例如，列表 11.6 中的查询返回了 `CALC_NEW_PRICE`
    函数的源码。


    列表 11.6：读取函数的源代码


    ```

    SELECT line, text FROM user_source WHERE name = ''CALC_NEW_PRICE'';

    ```


    执行该查询将向你显示所示的函数代码行。


