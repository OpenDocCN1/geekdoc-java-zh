    # The User_Catalog View


    The user_catalog view stores the names of your tables and views. Use the query
    in Listing 11.2 to see the tables and views that you have in your database. These
    tables and views are known as user tables and views (as opposed to system tables
    and views).


    Listing 11.2: Using the user_catalog view


    ```

    SELECT * FROM user_catalog;

    ```


    The output from running the query in Listing 11.2 in your database may not be
    exactly the same as what I have got here. Here is mine.


    | TABLE_NAME | TABLE_TYPE |

    | --- | --- |

    | CUSTOMER | TABLE |

    | C_ORDER | TABLE |

    | PRODUCT | TABLE |

    | C_SHIP | TABLE |

    | OLD_PRODUCT | TABLE |

    | PRICE_LOG | TABLE |'
  - '[PAGE 114]


    # The User_Tab_Cols View


    You can get table and view names from the User_Catalog view. To see the details
    of each table and view, you can query the user_tab_cols view. For example, the
    query in Listing 11.3 shows you column names, and their data type, length, precision
    and scale, of the product table.


    # Listing 11.4: Finding out the columns metadata of the product table


    Here is the query output.


    | COLUMN_NAME | DATA_TYPE | DATA_LENGTH | DATA_PRECISION | DATA_SCALE |

    |---|---|---|---|---|

    | P_CODE | VARCHAR2 | 6 | | |

    | P_NAME | VARCHAR2 | 14 | | |

    | PRICE | NUMBER | 22 | 4 | 2 |

    | LAUNCH_DT | DATE | 7 | | |


    In addition to these five columns, the USER_TAB_COLS view has many other columns,
    such as those for showing the owner and the default value.'
