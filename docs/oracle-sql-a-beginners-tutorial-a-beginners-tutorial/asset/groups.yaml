    # 列表 5.5：多列连接


    ```

    SELECT o.c_no,

    o.p_code,

    o.order_dt,

    ship_qty,

    ship_dt,

    qty

    FROM shipment s

    JOIN c_order o

    ON s.c_no = o.c_no

    AND s.p_code = o.p_code

    AND s.order_dt = o.order_dt;

    ```


    在 `c_order` 和 `shipment` 表上执行此查询将得到以下输出行。


    | C_NO | P_CODE | ORDER_DT | SHIP_QTY | SHIP_DT | QTY |

