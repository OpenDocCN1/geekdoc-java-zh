    # 复合条件


    列表 2.4 中的条件 `p_name != ''Nut''` 被称为谓词。使用 AND 和 OR 逻辑运算符，你可以将谓词组合起来形成复合条件。查询将只返回满足复合条件的行。


    OR 逻辑运算符的规则在表 2.2 中。


    | Left condition | Logical operator | Right condition | Compound condition |

    | --- | --- | --- | --- |

    | True | OR | True | True |

    | True | OR | False | False |

    | False | OR | True | True |

    | False | OR | False | False |


    表 2.2：OR 规则


    原则上，如果两个进行 OR 连接的条件中任何一个为真，则 OR 条件的结果为真；否则，如果没有一个条件为真，则复合条件为假。AND 逻辑运算符的规则在表 2.3
    中。


    | Left condition | Logical operator | Right condition | Compound condition |

    | --- | --- | --- | --- |

    | True | AND | True | True |

    | True | AND | False | False |

    | False | AND | True | False |

    | False | AND | False | False |


    表 2.3：AND 规则


    基本上，只有当两个进行 AND 连接的条件都为真时，AND 条件的结果才为真；否则结果为假。例如，列表 2.5 中的语句 WHERE 子句中包含三个谓词。


    # 列表 2.5：带有三个谓词的查询


    ```sql

    SELECT *

    FROM product

    WHERE (launch_dt >= ''30-MAR-13''

    OR price > 15)

    AND (p_name != ''Nail'');

    ```


    第一个条件 `launch_dt >= ''30-MAR-13'' OR price > 15` 的结果对于 Nail、Screw 和 Super_Nut
    行为真。查询将只返回满足复合条件的行，在这种情况下是 Screw 和 Super_Nut。查询输出如下。


    ```

    P_NAME          PRICE

    ------------ ----------

    Screw          25.00

    Super_Nut       30.00

    ```


