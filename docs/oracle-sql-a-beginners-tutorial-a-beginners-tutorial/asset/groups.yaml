    # Natural Joins


    If two tables have columns that share a name, you can naturally join the two tables
    on these columns. In a natural join, you do not need to specify the columns that
    the join should use.


    The syntax for the natural join is this.


    ```

    SELECT columns FROM table_1 NATURAL JOIN table_2 ... ;

    ```


    Listing 5.11 shows an example of a natural join on the c_order and customer tables.
    This natural join implicitly joins the tables on their c_no columns.


    Listing 5.11: A natural join


    ```

    SELECT * FROM c_order NATURAL JOIN customer;

    ```


