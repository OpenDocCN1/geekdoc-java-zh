    # Multiple Uses of A Table


    If a product can have more than one substitute, you need to store the product-substitute
    relationships in a separate table. A substitute cannot be recorded in the product
    table.


    To create the table that stores the product-substitute relationships named prod_subst,
    execute the following statement.


    ```

    CREATE TABLE prod_subst (p_code VARCHAR(6), s_code VARCHAR(6));

    ```


    To remove the s_code column, execute the following statement:


    ```

    ALTER TABLE product DROP (s_code);

    ```


    Your product table will now contain the following rows.


    | P_CODE | P_NAME | PRICE | LAUNCH_DT |

    | --- | --- | --- | --- |

    | 1 | Nail | 10 | 31-MAR-13 |

    | 2 | Washer | 15 | 29-MAR-13 |

    | 3 | Nut | 15 | 29-MAR-13 |

    | 4 | Screw | 25 | 30-MAR-13 |

    | 5 | Super_Nut | 30 | 30-MAR-13 |

    | 6 | New Nut | NULL | NULL |


    Assuming that the only product with substitutes is product 3 and its substitutes
    are the products 5 and 6, the prod_subst table will have two rows as follows.
    (You need to insert these two rows using the INSERT statements)


    ```

    P_NO_S_CODE

    ------ -------

    3     5

    3     6

    ```


    To get the name of a product and the names of its substitutes, you need to use
    the product table twice, as shown in the query in Listing 5.10.


    # Listing 5.10: Multiple uses of a table


    ```

    SELECT prod.p_code,

    prod.p_name,

    ps.s_code,

    subst.p_name AS s_name

    FROM product prod

    INNER JOIN prod_subst ps

    ON prod.p_code = ps.p_code

    INNER JOIN product subst

    ON ps.s_code = subst.p_code

    ORDER BY prod.p_code;

    ```


    Here are the output rows from the query in Listing 5.10.


    | P_CODE P_NAME | S_CODE S_NAME |

    |---|---|---|---|

    | 3 Nut | 6 Newer Nut |

    | 3 Nut | 5 Super_Nut |


    # Natural Joins


    If two tables have columns that share a name, you can naturally join the two tables
    on these columns. In a natural join, you do not need to specify the columns that
    the join should use.


    The syntax for the natural join is this.


    ```

    SELECT columns FROM table_1 NATURAL JOIN table_2 ... ;

    ```


    Listing 5.11 shows an example of a natural join on the c_order and customer tables.
    This natural join implicitly joins the tables on their c_no columns.


    Listing 5.11: A natural join


    ```

    SELECT * FROM c_order NATURAL JOIN customer;

    ```


    Running the query in Listing 5.11 gives you the following output rows.


    | C_NO P_CODE | QTY ORDER_DT | C_NAME |

    |---|---|---|---|

    | 10 1 | 100 01-APR-13 | Standard Store |

    | 10 2 | 100 01-APR-13 | Standard Store |

    | 20 1 | 200 01-APR-13 | Quality Store |

    | 40 4 | 400 02-APR-13 | Super Agent |

    | 40 5 | 400 03-APR-13 | Super Agent |


    # Natural Outer Joins


    The natural join is also applicable to the outer join. Consider the query in Listing
    5.12.


    # Listing 5.12: A natural outer join


    ```

    SELECT * FROM c_order NATURAL RIGHT JOIN customer;

    ```


    Applying the query against the c_order and customer tables will give you the following
    output rows.


    | C_NO P_CODE | QTY ORDER_DT | C_NAME |

    |---|---|---|---|

    | 10 1 | 100 01-APR-13 | Standard Store |

    | 10 2 | 100 01-APR-13 | Standard Store |

    | 20 1 | 200 01-APR-13 | Quality Store |

    | 40 4 | 400 02-APR-13 | Super Agent |

    | 40 5 | 400 03-APR-13 | Super Agent |

    | 30 NULL | NULL | Head Office |


    # Mixing Natural Joins with Different Column Names


    If you need to join on one column, and the second column pair does not share a
    name, you can specify the different column names in the WHERE clause. Listing
    5.13 shows an example of such a case.


    # Listing 5.13: Mixing natural join with different column names


    ```

    SELECT * FROM c_order o NATURAL RIGHT JOIN product p WHERE

    o.order_dt = p.launch_dt;

    ```


    In the query in Listing 5.13, in addition to the natural join on the same c_no
    column, the rows from the two tables have to be joined on the dates.


    The query does not return any row as we don’t have any order of a product with
    the same date as the product’s launch date.


    # The USING Keyword


    A natural join will use all columns with the same names from the joined tables.
    If you want your query to join only some of these identically named columns, instead
    of using the NATURAL keyword, use the USING keyword. The Syntax for joining two
    tables with USING is as follows.


    ```

    SELECT columns

    FROM table_1

    JOIN table_2 USING (column);

    ```


    Listing 5.14, for example, joins the c_order table to the shipment table on only
    their p_code columns. It does not join the tables on their c_no columns. This
    query gives you the total quantity shipped by product.


    # Listing 5.14: USING


    ```

    SELECT p_code,

    SUM(s.qty)

    FROM c_order o

    JOIN shipment s USING (p_code)

    GROUP BY p_code;

    ```


    Executing this query against our c_order and shipment tables will produce the
    following output.


    ```

    P_CODE SUM(S_QTY)

    ------

    1 400

    2 100

    ```


    # Summary


    In this chapter you learned about getting data from multiple tables. You learned
    how to use various types of joins for this purpose.


    # Chapter 6 Subqueries


    A subquery is a query nested within another query. The containing query is called
    an outer query. A subquery in turn can have a nested query, making multiple nested
    queries. This chapter discusses subqueries in detail.


    # Single-Row Subqueries


    A single-row subquery is a subquery that returns a single value. A single-row
    subquery can be placed in the WHERE clause of an outer query. The return value
    of the subquery is compared with a column of the outer query using one of comparison
    operators (Comparison operators were discussed in Chapter 2, “Basic Queries”).
    For example, the query in Listing 6.1 contains a single-row subquery that returns
    the highest price for a product. The outer query returns all products from the
    product table that have that highest price (30.00), the Super_Nut and Nut products.


    # Listing 6.1: A subquery that returns a single value


    ```

    SELECT *

    FROM product

    WHERE price =

    (SELECT MAX(price)

    FROM product p

    INNER JOIN c_order o

    ON p.p_code = o.p_code);

    ```


    # Oracle SQL: A Beginner''s Tutorial


    Note the subquery in Listing 6.1 is printed in bold. Executing the query in Listing
    6.1 against this product table


    | P_CODE | P_NAME | PRICE | LAUNCH_DT |

    | --- | --- | --- | --- |

    | 1 | Nail | 10 | 31-MAR-13 |

    | 2 | Washer | 15 | 29-MAR-13 |

    | 3 | Nut | 15 | 29-MAR-13 |

    | 4 | Screw | 25 | 30-MAR-13 |

    | 5 | Super_Nut | 30 | 30-MAR-13 |

    | 6 | Newer Nut | 30 | 01-MAY-13 |


    and the following c_order (customer order) table


    | C_NO | P_CODE | QTY | ORDER_DT |

    | --- | --- | --- | --- |

    | 10 1 | 100 | 01-APR-13 |

    | 10 2 | 100 | 01-APR-13 |

    | 20 1 | 200 | 01-APR-13 |

    | 30 3 | 300 | 02-APR-13 |

    | 40 4 | 400 | 02-APR-13 |

    | 40 5 | 400 | 03-APR-13 |


    will give you the following result.


    | P_CODE | P_NAME | PRICE | LAUNCH_DT |

    | --- | --- | --- | --- |

    | 5 | Super_Nut | 30.00 | 30-MAR-13 |

    | 6 | Newer Nut | 30.00 | 01-MAY-13 |


    The column and subquery result do not have to be the same column, but they must
    have compatible data types. In the query in Listing 6.1, the price column of the
    product table is a numeric type and the subquery also returns a numeric type.


    If the subquery returns more than one value, you will get an error message. For
    example, the query in Listing 6.2 throws an error because the subquery returns
    more than one value.


    # Listing 6.2: Single-row subquery error


