    # INTERSECT（交集）


    当你使用 INTERSECT 运算符结合两个或多个查询时，输出将包含所有参与的 SELECT 语句共同拥行。换句话说，只有当某行被所有 SELECT 语句返回时，该行才会被包含最终结果中。


    让我们来看列表 7.4 中的示例。


    # 列表 7.4：使用 INTERSECT


    ```sql

    SELECT p.p_code,

    p_name

    FROM product p

    WHERE p_name LIKE ''%Nut%''

    INTERSECT

    SELECT p.p_code,

    p_name

    FROM c_order o

    INNER JOIN product p

    ON o.p_code = p.p_code

    ORDER BY p_code;

    ```


    在相同的 product 和 c_order 表上运行该查询将返回以下结果。


    P_CODE P_NAME

    ----- ------

    3 Nut

    5 Super_Nut


    # MINUS（相减）


    当你使用 MINUS 运算符结合两个 SELECT 语句时，最终输出将来自第一个查询但未被第二个查询返回的行。查看列表 7.5 中的示例。


    列表 7.5：使用 MINUS


    ```sql

    SELECT p_code,

    p_name

    FROM product p

    WHERE p_name LIKE ''%Nut%''

    MINUS

    SELECT p.p_code,

    p_name

    FROM c_order JOIN product p

    ON o.p_code = p.p_code

    ORDER BY p_code;

    ```


    在相同的 product 和 c_order 表上运行此查询会产生以下输出。


    P_CODE P_NAME

    ----- ------

    6 New Nut


    使用 MINUS 时，构成查询的 SELECT 语句的顺序非常重要。如果你交换了列表 7.5 查询中两个 SELECT 语句，输出将完全不同。查看列表 7.6
    中的查询，它与列表 7.5 中的查询完全相同，仅是两个 SELECT 语句被交换了。


    列表 7.6：在结合 MINUS 的查询中交换参与的 SELECT 语句


    ```sql

    SELECT p.p_code,

    p_name

    FROM c_order o

    INNER JOIN product p

    ON o.p_code = p.p_code

    MINUS

    SELECT p.p_code,

    p_name

    FROM product p

    WHERE p_name LIKE ''%Nut%%''

    ORDER BY p_p_code;

    ```


    列表 7.6 中查询的输出如下：


    | P_CODE | P_NAME |

    | --- | --- |

    | 1 | Nail |

    | 2 | Washer |

    | 4 | Screw |


    # 总结


    在本章中，你学习了可以组合两个或多个 SELECT 语句的输出。你有五种运算符可以此目的：UNION ALL、UNION、INTERSECT 和 MINUS。


    # 第 8 章

    视图 (Views)


    视图实质上是一个预定义的查询。你最频繁地创建和使用视图是为了出于以下目的：


    - 隐藏表列（为了安全保护）

    - 展示预计算的列（代替表列）

    - 隐藏查询（以便无需运行查询即可获得查询输出）


    本章讨论了视图并展示了视图的示例。


    # 创建和使用视图


    你使用 CREATE VIEW 语句创建视图。其语法如下。


    ```sql

    CREATE VIEW view_name (columns) AS SELECT ...;

    ```


    CREATE VIEW 语句末尾的 SELECT 语句是预定义的查询。当你使用视图时，会执行其预定义的查询。由于查询结果是一个没有持久化（存储）在数据库中的表，因此视图也被称为虚拟表。视图
    SELECT 语句中的表被称为基表。


    你使用视图的原因之一是你有一个需要与他人共享的表时。如果你不想让其他人看到某些表列，可以使用视图来隐藏这些列。然后你可以共享该视图，并限制对基表的访问。


    # 8 Oracle SQL：初学者教程


    例如，列表 8.1 显示了基于 product 表创建名为 product_v 视图的 SQL 语句。该视图隐藏了基表的的价格列。


    # 列表 8.1：使用 VIEW 隐藏列


    ```sql

    CREATE VIEW product_v

    ( p_code , p_name

    ) AS

    SELECT p_code, p_name FROM product;

    ```


    现在可以使用任何数据库表一样使用 product_v。例如，以下语句显示了 product_v 视图中的所有列。


