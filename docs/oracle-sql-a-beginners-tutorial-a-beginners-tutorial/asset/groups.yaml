    # # Chapter 3

    Query Output


    All the queries in Chapter 2, "Basic Queries" returned rows that contained columns
    from the source table. However, output rows can also contain string or numeric
    expressions that include string or numeric literals, operators, and functions.


    In this chapter you learn how to manipulate query output using expressions and
    how to order and store output rows into a table.


    # Column Aliases


    By default the names of the output columns in the query output are the names of
    the columns of the queried table. However, you don''t have to be stuck with the
    original column names. You can give them different names or aliases if you wish.


    The syntax for the SELECT clause that uses aliases is as follows.


    ```

    SELECT column_1 AS alias1, column_2 AS alias2, ...

    FROM table;

    ```


    An alias can consist of one or multiple words. You must enclose a multiword alias
    with quotes, e.g. "PRODUCT NAME". For example, the query in Listing 3.1 uses an
    alias for the p_name column.


    # Listing 3.1: Using an alias in a query


    ```

    SELECT p_code,

    p_name AS "PRODUCT NAME"

    FROM product;

    ```'
