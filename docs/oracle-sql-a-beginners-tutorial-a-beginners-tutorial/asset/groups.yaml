    # Chapter 2

    Basic Queries


    A query is a request for data from one or more tables. When you execute a query,
    rows that satisfy the condition of the query will be returned as a table. Similarly,
    when a query embedded in another query or a program gets executed, the data returned
    by the other query or the program is a table.


    In this chapter you learn how to write basic queries using the SELECT statement.
    Once you master the basic queries, you can start learning about queries within
    other queries in Chapter 6, “Subqueries” and within PL/SQL programs in Chapter
    10, “PL/SQL.”


    # The SELECT statement


    All queries regardless of their complexity use the SELECT statement. The SELECT
    statement has the following general syntax.


    ```

    SELECT column_names FROM table_name [WHERE condition];

    ```


    Only the SELECT and FROM clauses are mandatory. If your query does not have a
    WHERE clause, the result will include all rows in the table. If your query has
    a WHERE clause then only the rows satisfying the WHERE condition will be returned.


