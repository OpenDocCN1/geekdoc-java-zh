    # Deleting Data


    To delete a row or multiple rows in a table, use the DELETE statement. You can
    specify which rows to be deleted by using the WHERE clause.


    The syntax for the DELETE statement is as follows


    ```

    DELETE FROM table

    [WHERE condition];

    ```


    You specify which rows to delete in the WHERE clause.


    For example, the statement in Listing 1.6 deletes from the product table all rows
    whose p_name field value is ''Nut''.


    Listing 1.6: Deleting rows


    ```

    DELETE FROM product

    WHERE p_name = ''Nut'';

    ```


    After you run the statement in Listing 1. 6, please issue a ROLLBACK command to
    return the data values back to before the deletion:


    ```

    ROLLBACK;

    ```'
