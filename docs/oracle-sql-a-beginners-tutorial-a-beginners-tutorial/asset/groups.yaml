    # Using DISTINCT on Multiple Columns


    If a query returns multiple columns, two rows are considered duplicates if all
    their columns have the same values. They are not duplicates if only one column
    has the same value.


    The DISTINCT keyword can be applied on multiple columns too. For example, the
    query in Listing 3.5 uses DISTINCT on multiple columns.


