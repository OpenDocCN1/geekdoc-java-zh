    \ NULL |\n\n该查询将返回这些行。\n\n| P_CODE | P_NAME | PRICE_CAT |\n|---|---|---|\n| 1\
    \ | Nail | Cheap |\n| 2 | Washer | Medium |\n| 3 | Nut | Medium |\n| 4 | Screw\
    \ | Expensive |\n| 5 | Super_Nut | Others |\n| 6 | New Ut | Others |\n\n## Searched\
    \ CASE\n\nSimple CASE 将列与多个值进行比较。相反，Searched CASE 可以是任何条件。以下是 Searched CASE 的语法。\n\
    \n```\nSELECT columns,\nCASE\n  WHEN condition1\n    THEN output_value1\n  WHEN\
    \ condition2\n    THEN output_value2\n  WHEN\n    ELSE else_value\nEND AS output_column\n\
    FROM table\nWHERE;\n```\n\n条件从第一个 WHEN 到最后一个进行评估。如果满足某个条件，则返回相应的值并停止 CASE 过程。如果都不满足且存在\
    \ ELSE 子句，则返回 else_value。如果都不满足且不存在 ELSE 子句，则将返回 NULL。\n\n例如，列表 3.8 中的查询对 price\
    \ 列使用了 Searched CASE 表达式以产生 price_cat（价格类别）输出列。\n\n### 列表 3.8：Searched CASE 示例\n\
    \n```\nSELECT p_code,\np_name,\nCASE\nWHEN price <= 10 THEN 'Cheap'\nWHEN price\
    \ BETWEEN 10 AND 25 THEN 'Medium'\nWHEN price > 25 THEN 'Expensive'\nELSE 'Others'\n\
    END AS price_cat\nFROM product;\n```\n\n"
