    # Chapter 3

    ## Query Output


    All the queries in Chapter 2, "Basic Queries" returned rows that contained columns
    from the source table. However, output rows can also contain string or numeric
    expressions. In this chapter you learn how to format query outputs.


    ### Column Aliases


    By default, the output columns are the same as the table columns. However, you
    can give them different names using aliases. The syntax for an alias is as follows:


    ```

    SELECT column_name AS alias_name FROM table;

    ```


    An alias can consist of one or more words. For instance, you must enclose them
    in quotes.


    # Listing 3.1: Using an alias


    ```

    SELECT p_name AS "Product Name" FROM product;

    ```


    ### Expressions


    You can use other arithmetic operators in addition to the multiplication (*) operator
    in your column. These include addition (+), subtraction (-), and division (/).
    For example, the query in Listing 3.2 uses several expressions.


    # Listing 3.2: Various expressions


    ```sql

    SELECT p_name, price * 1.1 AS new_price, price - 10 AS discounted_price, price
    / 2 AS half_price

    FROM product;

    ```


    The output of the query in Listing 3.2 returns the following rows.


    | P_CODE | PRICE | LAUNCH_DT |

    | --- | --- | --- |

    | 1 Nail | 10.00 31-MAR-13 |

    | 2 Washer | 15.00 29-MAR-13 |

    | 3 Nut | 15.00 29-MAR-13 |

    | 4 Screw | 25.00 30-MAR-13 |

    | 5 Super_Nut | 30.00 30-MAR-13 |

    | 6 New Nut | NULL | NULL |


    The output of the query in Listing 3.2 is as follows.


    ```

    P_NAME          NEW_PRICE  DISCOUNTED_PRICE  HALF_PRICE LAUNCH_DT

    ---------- ------------------------------------------ ---------- ----------

    Nail            11.00     0.00              5.00      31-MAR-13

    Washer           16.50     5.00              7.50      29-MAR-13

    Nut             16.50     5.00              7.50      29-MAR-13

    Screw           27.50     15.00             12.50     30-MAR-13

    Super_Nut       33.00     20.00             15.00     30-MAR-13

    New Nut         NULL       NULL              NULL      NULL

    ```


    ### Concatenation


    You can also use the concatenation operator (||) to join strings. For example,
    the query in Listing 3.3 uses it.


    # Listing 3.3: Concatenation


    ```

    SELECT p_name || '' - '' || p_code AS "product_info" FROM product;

    ```


    The output of the query in Listing 3.3 is as follows.


    ```

    PRODUCT_INFO

    ----------

    ```


    # Limiting the Number of Rows


    You can limit the number of output row by using the ROWNUM pseudo column. Its
    syntax is as follows.


    ```

    SELECT columns FROM table(s)

    WHERE conditions ROWNUM < count;

    ```


    The maximum number of output rows of a query that employs ROWNUM will be count
    – 1.


    As an example, take a look at the query in Listing 3.4.


    # Listing 3.4: Using ROWNUM


    ```

    SELECT * FROM product WHERE price > 10 AND ROWNUM < 4;

    ```


    Without the expression ROWNUM < 4, the number of output rows would be 4. The query
    in Listing 3.4, however, returns these three rows.

