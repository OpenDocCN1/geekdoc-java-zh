    | P_CODE | P_NAME |

    |---|---|

    | 1 | Nail |

    | 2 | Washer |

    | 4 | Screw |


    注意，在数据库中视图名称必须在数据库中所有视图和表之间是唯一的。


    视图的另一个用途是派生基表中不可用的计算列。这里有一个示例。


