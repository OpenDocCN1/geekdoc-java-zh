    # Outer Joins


    All the joins I explained so far were inner joins. There is another type of join,
    the outer join. While an inner join query produces only related rows from the
    joined tables, an outer join query produces all rows from one table even when
    some of the rows do not have matching rows from the other table.


    There are three subtypes of outer joins, LEFT, RIGHT, and FULL. The following
    points described each of these three types.


    All rows from the table on the left of the outer join will be in the output whether
    or not there are matching rows from the table on its right. The syntax for the
    left outer join is as follows.


    ```

    SELECT columns

    FROM table_1 LEFT OUTER JOIN table_2

    ON table_1.column = table_2.column;

    ```


    All rows form the table on the right of the right outer join will be in the output
    whether or not there are matching rows from the table on its left. The syntax
    for the right outer join is as follows.'
