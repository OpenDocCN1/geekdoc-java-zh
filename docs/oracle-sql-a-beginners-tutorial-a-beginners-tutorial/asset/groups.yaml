    # Direction of Order


    The default direction is ascending. To order a column in descending direction,
    use the DESC reserved word. For example, the query in Listing 3.10 is similar
    to that in Listing 3.9 except that the output is presented in descending order.


    # Listing 3.10: Changing the order direction


    ```

    SELECT FROM product ORDER BY p_name DESC;

    ```


    The output rows will be returned with p_name sorted in descending order.


    | P_CODE P_NAME PRICE LAUNCH_DT |

    |------------------------------------|

    | 2 Washer | 15 29-MAR-13 |

    | 5 Super_Nut | 30 30-MAR-13 |

    | 4 Screw | 25 30-MAR-13 |

    | 3 Nut | 15 29-MAR-13 |

    | 6 New Nut NULL NULL |

    | 1 Nail | 10 30-MAR-13 |


    # Multiple Columns


    To order by more than one column, list the columns in the ORDER BY clause. The
    sequence of columns listed is significant. The order will be conducted by the
    first column in the list, followed by the second column, and so on. For example,
    if the ORDER BY clause has two columns, the query output will first be ordered
    by the first column. Any rows with identical values in the first column will be
    further ordered by the second column.


    For example, the query in Listing 3.11 uses an ORDER BY clause with two columns.'
