    # Evaluation Precedence and the Use of Parentheses


    If a compound condition contains both the OR condition and the AND condition,
    the AND condition will be evaluated first because AND has a higher precedence
    than OR. However, anything in parentheses will have even higher precedence than
    AND. For example, the SELECT statement in Listing 2.5 has an OR and an AND, but
    the OR condition is in parentheses so the OR condition is evaluated first. If
    you remove the parentheses in the SELECT statement in Listing 2.5, the query will
    return a different result. Consider the statement in Listing 2.6, which is similar
    to that in Listing 2.5 except that the parentheses have been removed.


    # Listing 2.6: Evaluation precedence


    ```

    SELECT *

    FROM product

    WHERE launch_dt >= ''30-MAR-13''

    OR price > 15

    AND p_name != ''Nail'';

    ```


    For your reading convenience, the product table is reprinted here.


    | P_CODE | P_NAME | PRICE | LAUNCH_DT |

    |---|---|---|--|

    | 1 | Nail | 10.00 | 31-MAR-13 |

    | 2 | Washer | 15.00 | 29-MAR-13 |

    | 3 | Nut | 15.00 | 29-MAR-13 |

    | 4 | Screw | 25.00 | 30-MAR-13 |

    | 5 | Super_Nut | 30.00 | 30-MAR-13 |

    | 6 | New Nut | NULL | NULL |


    Without the parentheses, the compound condition price > 15 AND p_name !==''Nail''
    will be evaluated first, resulting in the Screw and Super_Nut. The result is then
    OR-ed with the launch_dt >= 30-MAR-13 condition, resulting in these three rows.


    | P_CODE | P_NAME | PRICE | LAUNCH_DT |

    |---|---|---|--|

    | 1 | Nail | 10.00 | 31-MAR-13 |'
