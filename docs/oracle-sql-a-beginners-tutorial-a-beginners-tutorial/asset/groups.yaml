    | Screw | 20.00 | 17.00 | 18 |

    | New Nut | NULL | 10.00 | 10 |

    | Newer Nut | NULL | NULL | 5 |'
  - '[PAGE 99]


    # NULLIF


    NULLIF(expr1, expr2) compares expr1 and expr2. If they are equal, the function
    returns null. If they are not equal, the function returns expr1.


    Suppose you store product price in a table named old_price. The following old_price
    table, for example, shows two old prices of the Nut product, the products with
    p_code = 3.


    ```

    P_CODE P_NAME   PRICE LAUNCH_DT

    ------------------------------------

    3      Nut         15.00 01-MAR-10

    3      Newer Nut   12.00 01-APR-12

    ```


    Say just you want to show the old products with their current price. The following
    query that employs the NULLIF function can solve your problem.


    ```

    SELECT p_code,

    p_name,

    NULLIF(p.price, op.price) current_price

    FROM product p

    JOIN old_product op USING (p_code);

    ```


    Applying the query against the following product table and the old_price table


    ```

    P_CODE P_NAME   PRICE LAUNCH_DT

    ------------------------------------

    1      Nail        10.00 31-MAR-13

    2      Washer      15.00 29-MAR-13

    3      Better Nut  10.00 01-MAY-13

    4      Screw       15.00 01-MAY-13

    ```


    returns the two old nuts as follows


    ```

    P_CODE P_NAME   CURRENT_PRICE

    ----------------------------

    3      Nut             10

    3      Newer Nut       10

    ```'
  - '[PAGE 100]


    # NVL


    NVL (expr1, expr2) returns exprs1 if expr1 is not NULL; otherwise, it returns
    expr2.


    For example, suppose you want to compare old and current prices. Applying NVL
    in the following query gives you the old price from the product table if the product
    has never been supersed; otherwise, if a product has been superseded, its old
    price will come from the old_product table.


    ```

    SELECT p_code,

    p.p_name,

    p.price current_price,

    NVL(op.price,p.price) old_price

    FROM product p

    LEFT OUTER JOIN old_product op USING (p_code);

    ```


    Here is the result.


    | P_CODE | P_NAME | CURRENT_PRICE | OLD_PRICE |

    |---|---|---|--|

    | 1 | Nail | 10 | 10 |

    | 2 | Washer | 15 | 15 |

    | 3 | Nut | 10 | 12 |

    | 4 | Nut | 10 | 15 |

    | 5 | Screw | 15 | 15 |


    The query result shows that the only product that has superseded is Nut, and it
    has been superseded twice. Therefore, its old prices are shown from the old_product
    table. The other products have never been superseded so their current and old
    prices are the same. Their old_price is coming from the product table because
    its op.price column, the first parameter of the NVL function, is NULL.'
