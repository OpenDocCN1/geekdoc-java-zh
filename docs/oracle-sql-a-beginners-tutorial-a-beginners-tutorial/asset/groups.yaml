    # # The DISTINCT Keyword


    A query may return duplicate rows. Two rows are duplicates if each of their columns
    contains exactly the same data. If you don''t want to see duplicate output rows,
    use DISTINCT in your SELECT clause. You can use DISTINCT on one column or multiple
    columns.


    # # Using DISTINCT on A Single Column


    The query in Listing 3.4 uses DISTINCT on the price column.


    +   Listing 3.4: Using DISTINCT on a single column


    ```

    SELECT DISTINCT price FROM product ORDER BY price;

    ```


    Without DISTINCT, the query in Listing 3.4 will return six rows that include two
    duplicate prices for row 2 and row 3. Instead, the query in Listing 3.4 returns
    the following output.


    ```

    PRICE

    -----

    10

    15

    25

    30

    NULL

    ```'
