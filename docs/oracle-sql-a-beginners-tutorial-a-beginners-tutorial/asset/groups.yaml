    \ | 01-MAY-13 |\n\n由于产品的 launch_dt 为空，处理过程不会为这个额外的订单插入发票行。如果你执行列表 10.2 中的程序，则会将与上一个示例相同的相同的被插入到\
    \ invoice 表中。PL/SQL 中的异常处理允许你使用 `EXCEPTION` 语句来处理程序中的错误（或异常）。其语法如下。\n\n```\nEXCEPTION\n\
    \  WHEN exception_name\n  THEN exception_handling_statement;\n```\n\n例如，假设你想使用列表\
    \ 10.3 中的 PL/SQL 程序从 invoice 表中查询特定的发票。列表 10.3 中的 SELECT 查询将其输出行存储在 `invoc` 变量中，该变量被定义为\
    \ `ROWTYPE` 数据类型。\n\n# 列表 10.3: 不带异常处理的 PL/SQL 程序\n\n```\nDECLARE\n  invc invoice%ROWTYPE;\n\
    BEGIN\n  SELECT *\n  INTO invoc\n  FROM invoice\n  WHERE c_no = '&c_no_prompt'\n\
    \  AND p_name = '&p_name_prompt'\n  AND TO_CHAR(invoice_dt, 'DD-MON-YY') = '&invoice_dt_prompt';\n\
    \  dbms_output.put_line(invoc.c_name || ' - ' || invoc.p_name || ' - - ' || invoc.total_prc);\n\
    END;\n```\n\n# 第 10 章：PL/SQL 103\n\n假设 invoice 表包含以下行。\n\n| C_NO | C_NAME | P_NAME\
    \ | QTY | UNIT_PRC | TOTAL_PRC | INVOICE_DT |\n| :--- | :--- | :--- | :--- | :---\
    \ | :--- | :--- |\n| 10 | Standard Store | Washer | 100 | 15 | 1500 | 12-SEP-13\
    \ |\n| 10 | Standard Store | Nail | 100 | 10 | 1000 | 12-SEP-13 |\n| 20 | Quality\
    \ Store | Nail | 200 | 10 | 2000 | 12-SEP-13 |\n| 40 | Super Agent | Screw | 400\
    \ | 25 | 10000 | 12-SEP-13 |\n| 40 | Super Agent | Super_Nut | 400 | 30 | 12000\
    \ | 12-SEP-13 |\n\n如果你执行列表 10.3 中的程序，系统会提示你三次，输入要查询的发票 c_no、p_name 和 invoice_dt。如果\
    \ invoice 表中不存在该发票，程序将终止，并且你会看到“no data found”错误消息。你的 SQL*Plus 看起来如下所示。\n\n```\n\
    SQL> DECLARE\n2 invoc invoice%ROWTYPE;\n3 BEGIN\n4 SELECT *\n5 INTO invoc\n6 FROM\
    \ invoc\n7 WHERE c_no = '&c_no_prompt'\n8 AND p_name = '&p_name_prompt'\n9 AND\
    \ TO_CHAR(invoice_dt, 'DD-MON-YY') = '&invoice_dt_prompt';\n10 dbms_output.put_line(invoc.c_name\
    \ || ' - ' || invoc.p_name || ' - - ' || invoc.total_prc);\n11 END;\n12 /\\\n\
    Enter value for c_no_prompt: 10\nold 7: WHERE c_no = '&c_no_prompt'\nnew 7: WHERE\
    \ c_no = '10'\nEnter value for p_name_prompt: Nail\nold 8: AND p_name = '&p_name_prompt'\n\
    new 8: AND p_name = 'Nail'\nEnter value for invoice_dt_prompt: 11-SEP-13\n```\n\
    \n# 104 Oracle SQL: 初学者教程\n\n```\nold 9: AND TO_CHAR(invoice_dt, 'DD-MON-YY')\
    \ =\n  '&invoice_dt_prompt';\nnew 9: AND TO_CHAR(invoice_dt, 'DD-MON-YY') = '11-SEP-13';\n\
    ```\n\n```\nDECLARE\n*\nERROR at line 1:\nORA-01403: no data found\nORA-06512:\
    \ at line 4\nSQL>\n```\n\n为了处理错误（异常），你可以为列表 10.3 中的程序添加异常处理语句。列表 10.4 显示了列表 10.3\
    \ 程序的修改版本。\n\n# 列表 10.4: 带异常处理程序\n\n```\nDECLARE\n  invc invoice%ROWTYPE;\nBEGIN\n\
    \  SELECT *\n  INTO invoc\n  FROM invoice\n  WHERE c_no = '&c_no_prompt'\n  AND\
    \ p_name = '&p_name_prompt'\n  AND TO_CHAR(invoice_dt, 'DD-MON-YY') = '&invoice_dt_prompt';\n\
    \  dbms_output.put_line(invoc.c_name || ' - ' || invoc.p_name || ' - - ' || invoc.total_prc);\n\
    EXCEPTION\n  WHEN NO_DATA_FOUND THEN\n    dbms_output.put_line('Error: data not\
    \ found');\nEND;\n```\n\n"
