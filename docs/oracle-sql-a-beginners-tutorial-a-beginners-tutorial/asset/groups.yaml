    # Compound Conditions


    The condition p_name != ''Nut'' in Listing 2.4 is called a predicate. Using the
    AND and OR logical operator you can combine predicates to form a compound condition.
    Only rows that satisfy the compound condition will be returned by the query.


    The rules for the OR logical operator are given in Table 2.2.


    | Left condition | Logical operator | Right condition | Compound condition |

    | --- | --- | --- | --- |

    | True | OR | True | True |

    | True | OR | False | False |

    | False | OR | True | True |

    | False | OR | False | False |


    Table 2.2: The OR rules


    In principle, the result of the OR compound condition is true if any one of the
    two conditions OR-ed is true; otherwise, if none of the conditions are true, the
    compound condition is false (not satisfying the condition).


    The rules for the AND logical operator are presented in Table 2.3.'
