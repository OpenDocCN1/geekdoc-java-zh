    # Selecting Rows with WHERE


    To query specific rows, use the WHERE clause. Recall that the SQL SELECT statement
    has the following syntax.


    ```

    SELECT column_names FROM table_name [WHERE condition];

    ```


    For example, the SQL statement in Listing 2.3 queries the p_name and price data
    from the product table with price = 15.


    +   Listing 2.3: Querying specific rows


    ```

    SELECT p_name, price FROM product WHERE price = 15;

    ```


    Only rows whose price is 15 will be returned by the query, in this case the Washer
    and Nut. The query output is as follows.


    ```

    P_NAME          PRICE

    ------------ ----------

    Washer          15.00

    Nut             15.00

    ```


    The equal sign (=) in the WHERE condition in Listing 2.3 is one of the comparison
    operators. Table 2.1 shows all comparison operators.


    | Operator | Description |

    | --- | --- |

    | = | Equal to |

    | < | Less than |

    | > | Greater than |

    | <= | Less than or equal to |

    | >= | Greater than or equal to |

    | != | Not equal to |


    Table 2.1: Comparison operators


    As another example, Listing 2.4 shows a WHERE clause that uses the not equal to
    (!=) operator.'
