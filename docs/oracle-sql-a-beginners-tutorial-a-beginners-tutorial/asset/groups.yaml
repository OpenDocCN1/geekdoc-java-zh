    | 2 | Washer | 15 | 29-MAR-13 |

    | 3 | Nut | 15 | 29-MAR-13 |

    | 4 | Screw | 25 | 30-MAR-13 |

    | 5 | Super_Nut | 30 | 30-MAR-13 |

    | 6 | New Nut | NULL | NULL |


    假设唯一具有替代品的是产品 3，其替代品是产品 5 和 6，则 `prod_subst` 表将具有如下两行。（你需要使用 `INSERT` 语句插入这两行）


