    main objective of this chapter is to give you a taste of working with SQL.


    To test the examples you need a working Oracle database. Appendix A, "Installing
    Oracle Database XE" shows how you can install Oracle Database Express Edition
    (XE) and make it ready for use with the examples. This appendix also shows how
    to use SQL*Plus to execute your SQL statements. If you do not have a working Oracle
    database, you should read this appendix first.


    ### Selecting A Database to Use


    You need a database to store your data. When you install Oracle Database XE, a
    database named "XE" is created as part of the installation. To use this database,
    run SQL*Plus and issue a CONNECT command as described in Appendix A, "Installing
    Oracle Database XE."

