    \ 7.1 中的查询。\n\n## 列表 7.2：对复合查询的输出行进行排序\n\n```\nSELECT p_code, p_name, 'FIRST QUERY'\n\
    FROM product p WHERE p_name LIKE '%Nut%'\nUNION ALL\nSELECT p.p_code,\np_name,\n\
    'SECOND_QUERY'\nFROM c_order o\nINNER JOIN product p\non o.p_code = p.p_code\n\
