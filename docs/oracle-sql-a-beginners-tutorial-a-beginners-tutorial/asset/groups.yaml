    # Chapter 7

    Compound Queries


    You can combine the results of two or more SELECT statements using the UNION ALL,
    UNION, INTERSECT, or MINUS operators. The number of output columns from every
    statement must be the same and the corresponding columns must have identical or
    compatible data types.


    This chapter shows how to combine query results.


    # UNION ALL


    When you combine two or more queries with the UNION ALL operator, the overall
    output will be the total rows from all the queries. For example, take a look at
    the query in Listing 7.1. This query consists of two SELECT statements.


    Listing 7.1: Using UNION ALL


    ```

    SELECT p_code, p_name, ''FIRST QUERY'' query

    FROM product p WHERE p_name LIKE ''%Nut''

    UNION ALL

    SELECT p_p_code,

    p_name,

    ''SECOND_QUERY'' o

    FROM c_order o

    INNER JOIN product p

    ON o.p_code = p.p_code;

    ```


    Note that the ''FIRST QUERY'' and ''SECOND_QUERY'' literals in the first and second
    SELECT statements, respectively, are just labels to identify where a row is coming
    from.'
