    FROM table_1 FULL OUTER JOIN table_2

    ON table_1.column = table_2.column ... ;

    ```


    Listing 5.6 is an example left outer join query. This query returns all rows from
    the c_order table.


    # Listing 5.6: Left outer join


    ```

    SELECT o.*,

    ship_dt

    FROM c_order shipment s

    LEFT OUTER JOIN ON o.p_code = s.p_code

    AND o.c_no = s.c_no;

    ```


    If you run this query against our example c_order and shipment tables, you will
    see the following output rows.


    | C_NO | P_CODE | QTY ORDER_DT | SHIP_DT |

    |---|---|---|---|---|

    | 10 | 1 | 100 01-APR-13 | 02-APR-13 |

    | 10 | 2 | 100 01-APR-13 | 02-APR-13 |

    | 20 | 1 | 200 01-APR-13 | 02-APR-13 |

    | 30 | 3 | 300 02-APR-13 | 03-APR-13 |

    | 10 | 1 | 100 01-APR-13 | 10-APR-13 |

    | 40 | 4 | 400 02-APR-13 | NULL |

    | 40 | 5 | 400 03-APR-13 | NULL |


    Note that the last two rows have no matching rows from the shipment table and
    therefore their ship_dt column has NULL values.


    # Rows with NULL only


    If you want to query only orders that have not been shipped at all, you have to
    put this “only” condition in the WHERE clause of your query (ship_dt IS NULL)
    as in the query in Listing 5.7.


    # Listing 5.7: NULL rows


    ```

    SELECT o.*,

    ship_dt

    FROM c_order o

    LEFT OUTER JOIN shipment s

    ON o.p_code = s.p_code

    AND o.c_no = s.c_no

    WHERE s.ship_dt IS NULL;

    ```


    The following output rows from the query in Listing 5.7 are orders that have not
    been shipped.


    | C_NO | P_CODE | QTY ORDER_DT | SHIP_DT |

    |---|---|---|---|

    | 40 | 4 | 400 02-APR-13 | NULL |

    | 40 | 5 | 400 03-APR-13 | NULL |


    # Full Outer Joins


    Suppose any order was canceled from the c_order table (in a real-life application,
    canceled orders might be moved to a different table, rather than deleted). This
    means some rows of the shipment table may not have matching rows in the order
    table. To return orders that do not have shipments as well as shipments that do
    not have orders, we need to write a query with the full outer join, like the one
    shown in Listing 5.8.


    # Listing 5.8: Full outer join


    ```

    SELECT o.*, s.*

    FROM c_order o

    FULL OUTER JOIN shipment s

    ON o.p_code = s.p_code

    AND o.c_no = s.c_no;

    ```


    To test the query, you need to delete an order, such as the order(s) placed by
    customer 30. Our c_order table now has the following rows. After the deletion,
    the c_order table has the following rows.


    | C_NO | P_CODE | QTY ORDER_DT |

    |---|---|---|

    | 10 | 1 | 100 01-APR-13 |

    | 10 | 2 | 100 01-APR-13 |

    | 20 | 1 | 200 01-APR-13 |

    | 40 | 4 | 400 02-APR-13 |

    | 40 | 5 | 400 03-APR-13 |


    If you run the query in Listing 5.8, you will get the following output rows. Note
    that we have NULL on both sides. The NULLs on the right side are shifted from
    the shipment table, the NULL on the left (in our row) is coming from the c_order
    table.


    | C_NO | P_CODE | QTY ORDER_DT | C_NO | P_CODE ORDER_DT | SHIP_QTY SHIP_DT |

    |---|---|---|---|---|---|---|

    | 10 | 1 | 100 01-APR-13 | 10 | 1 01-APR-13 | 50 02-APR-13 |

    | 10 | 2 | 100 01-APR-10 | 10 | 2 01-APR-13 | 100 02-APR-13 |

    | 20 | 1 | 200 01-APR-20 | 20 | 1 01-APR-13 | 100 02-APR-13 |

    | 10 | 1 | 100 01-APR-10 | 10 | 1 01-APR-13 | 50 10-APR-13 |

    | 40 | 4 | 400 02-APR-13 | NULL | NULL | NULL NULL |

    | 40 | 5 | 400 03-APR-13 | NULL | NULL | NULL NULL |

    | NULL | NULL | NULL | 30 | 3 02-APR-13 |


    # Self-Joins


    Assuming some of your products have substitutes and you want to record the substitutes
    in the product table, then you need to add a column. The new column, which is
    called s_code in the product table, contains the product code of the substitute.
    The new product, with a row having s_code 5, now looks like the following.


    | P_CODE P_NAME | PRICE DT S_CODE |

    |---|---|---|---|

    | 1 Nail | 10 31-MAR-13 | NULL |

    | 2 Washer | 15 29-MAR-13 | NULL |

    | 3 Nut | 15 29-MAR-13 | 5 |

    | 4 Screw | 25 30-MAR-13 | NULL |


    To add the s_code column, execute the following statement:


    ```

    ALTER TABLE product ADD (s_code VARCHAR2(6));

    ```


    Then, to update the p_code = 3, execute the following statement:


    ```

    UPDATE product SET s_code = 5 WHERE p_code = 3;

    ```


    If you need to know the product name of a substitute, you need the query shown
    in Listing 5.9. This query joins the product table to itself. This kind of join
    is called a self-join.


    The syntax for the self-join is as follows.


    ```

    SELECT columns

    FROM table alias_1

    JOIN table alias_2

    ON alias_1.column_x = alias_2.column_y;

    ```


    Note that column_x and column_y are columns in the same table.


    # Listing 5.9: A self-join


    ```

    SELECT prod.p_code,

    prod.p_name,

    subst.p_code subst_p_code,

    subst.p_name subst_name

    FROM product prod

    LEFT OUTER JOIN product subst

    ON prod.s_code = subst.p_code

    ORDER BY prod.p_code;

    ```


    Here are the output rows of the query, showing “Newer Nut” in the subst_name column
    of the third row.


    | P_CODE P_NAME | SUBST SUBST_NAME |

    |---|---|---|---|

    | 1 Nail | NULL NULL |

    | 2 Washer | NULL NULL |

    | 3 Nut | 5 Super_Nut |

    | 4 Screw | NULL NULL |

    | 5 Super_Nut | NULL NULL |

    | 6 New Nut | NULL NULL |

