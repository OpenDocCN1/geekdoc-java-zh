    # INTERSECT


    When you combine two or more queries with the INTERSECT operator, the output will
    consist of all rows common to all the participating SELECT statements. In other
    words, only if a row is returned by all the SELECT statements will the row be
    included in the final result.


    Let’s take a look at the example in Listing 7.4.


    # Listing 7.4: Using INTERSECT


    ```sql

    SELECT p.p_code,

    p_name

    FROM product p

    WHERE p_name LIKE ''%Nut%''

    INTERSECT

    SELECT p.p_code,

    p_name

    FROM c_order o

    INNER JOIN product p

    ON o.p_code = p.p_code

    ORDER BY p_code;

    ```


    Running the query against the same product and c_order tables will return the
    following result.


    P_CODE P_NAME

    ----- ------

    3 Nut

    5 Super_Nut


    # MINUS


    When you combine two SELECT statements using the MINUS operator, the final output
    will be rows from the first query that are not returned by the second query. Take
    a look at the example in Listing 7.5.


    Listing 7.5: Using MINUS


    ```sql

    SELECT p_code,

    p_name

    FROM product p

    WHERE p_name LIKE ''%Nut%''

    MINUS

    SELECT p.p_code,

    p_name

    FROM c_order JOIN product p

    ON o.p_code = p.p_code

    ORDER BY p_code;

    ```


    Running this query against the same product and c_order tables produces the following
    output.


    P_CODE P_NAME

    ----- ------

    6 New Nut


    With MINUS, the order of constituting SELECT statements is important. If you swap
    the two SELECT statements in the query in Listing 7.5, the output will be totally
    different. Take a look at the query in Listing 7.6, which is identical to that
    in Listing 7.5 except for the fact that the two SELECT statements have been swapped.


    Listing 7.6: Swapping the participating SELECT statements in a query combined
    with MINUS


    ```sql

    SELECT p.p_code,

    p_name

    FROM c_order o

    INNER JOIN product p

    ON o.p_code = p.p_code

    MINUS

    SELECT p.p_code,

    p_name

    FROM product p

    WHERE p_name LIKE ''%Nut%%''

    ORDER BY p_p_code;

    ```


    The output of the query in Listing 7.6 is this:


    | P_CODE | P_NAME |

    | --- | --- |

    | 1 | Nail |

    | 2 | Washer |

    | 4 | Screw |


    # Summary


    In this chapter you learned that you can combine the output of two or more SELECT
    statements. There are five operators you can use for this purpose, UNION ALL,
    UNION, INTERSECT, and MINUS.


    # Chapter 8

    Views


    A view is effectively a predefined query. You create and use views most frequently
    for the following purposes:


    - Hiding table columns (for security protection)

    - Presenting pre-computed columns (in lieu of table columns)

    - Hiding queries (so that the query outputs are available without running the
    queries)


    This chapter discusses view and presents examples of views.


    # Creating and Using Views


    You create a view using the CREATE VIEW statement. Here is its syntax.


    ```sql

    CREATE VIEW view_name (columns) AS SELECT ...;

    ```


    The SELECT statement at the end of the CREATE VIEW statement is the predefined
    query. When you use a view its predefined query is executed. Since a query result
    is a table that is not persisted (stored) in the database, a view is also known
    as a virtual table. The table in the SELECT statement of a view is is known as
    a base table.


    One of the reasons you use a view is when you have a table you need to share with
    other people. If you don''t want some of the table columns viewable by others,
    you can use a view to hide those columns. You would then share the view and restrict
    access to the base table.


    # 8 Oracle SQL: A Beginner''s Tutorial


    For example, Listing 8.1 shows an SQL statement for creating a view called product_v
    that is based on the product table. The view hides the price column of the base
    table.


    # Listing 8.1: Using a VIEW to hide columns


    ```sql

    CREATE VIEW product_v

    ( p_code , p_name

    ) AS

    SELECT p_code, p_name FROM product;

    ```


    The product_v can now be used just as you would any database table. For example,
    the following statement displays all columns in the product_v view.


    Assuming the product table contains these rows


    | P_CODE | P_NAME | PRICE | LAUNCH_DT |

    |---|---|---|---|

    | 1 | Nail | 10.00 | 31-MAR-13 |

    | 2 | Washer | 15.00 | 29-MAR-13 |

    | 3 | Nut | 15.00 | 29-MAR-13 |

    | 4 | Screw | 25.00 | 30-MAR-13 |

    | 5 | Super_Nut | 30.00 | 30-MAR-13 |

    | 6 | New Nut | 30.00 | 01-MAY-13 |


    selecting all columns from the product_v view will return these rows.


    | P_CODE | P_NAME |

    |---|---|

    | 1 | Nail |

    | 2 | Washer |

    | 4 | Screw |


    Note that within a database view name must be unique among all the views and tables
    in the database.


    Another use of the view is to derive computed columns not available in the base
    table(s). Here is an example.


    Suppose the product table stores profit margins for each product as follows.


    # Chapter 8: Views


    | P_CODE | P_NAME | PRICE | LAUNCH_DT | MARGIN |

    | --- | --- | --- | --- | --- |

    | 1 | Nail | 10.00 | 31-MAR-13 | 1 |

    | 2 | Washer | 15.00 | 29-MAR-13 | 2 |

    | 3 | Nut | 15.00 | 29-MAR-13 | 3 |

    | 4 | Screw | 25.00 | 30-MAR-13 | 4 |

    | 5 | Super_Nut | 30.00 | 30-MAR-13 | 5 |

    | 6 | New Nut | 30.00 | 01-MAY-13 | 6 |


    If you want to see the profit margin for each product in a view, you can create
    a view that computes it. Here is an example in Listing 8.2.


    ```sql

    CREATE VIEW product_margin

    ( p_code, p_name, margin

    ) AS

    SELECT p_code, p_name, (price * 0.1) AS margin

    FROM product;

    ```


    The product_margin view can now be used just as you would any database table.
    For example, the following statement displays all columns in the product_margin
    view.


    | P_CODE | P_NAME | MARGIN |

    |---|---|---|

    | 1 | Nail | 1 |

    | 2 | Washer | 1.5 |

    | 3 | Nut | 1.5 |

    | 4 | Screw | 2.5 |

    | 5 | Super_Nut | 3 |

    | 6 | New Nut | 3 |


    Another use of the view is to join multiple tables. Here is an example in Listing
    8.3.


    ```sql

    CREATE VIEW order_details

    ( o_id, p_name, order_date

    ) AS

    SELECT o.o_id, p.p_name, o.order_date

    FROM c_order o

    INNER JOIN product p

    ON o.p_code = p.p_code;

    ```


    The order_details view can now be used just as you would any database table. For
    example, the following statement displays all columns in the order_details view.


    | O_ID | P_NAME | ORDER_DATE |

    |---|---|---|

    | 1001 | Nail | 01-JAN-23 |

    | 1002 | Washer | 02-JAN-23 |

    | 1003 | Nut | 03-JAN-23 |

    | 1004 | Screw | 04-JAN-23 |

    | 1005 | Super_Nut | 05-JAN-23 |

    | 1006 | New Nut | 06-JAN-23 |


    Views can also be used to filter data. Here is an example in Listing 8.4.


    ```sql

    CREATE VIEW expensive_products

    ( p_code, p_name

    ) AS

    SELECT p_code, p_name

    FROM product

    WHERE price > 20;

    ```


    The expensive_products view can now be used just as you would any database table.
    For example, the following statement displays all columns in the expensive_products
    view.


    | P_CODE | P_NAME |

    |---|---|

    | 4 | Screw |

    | 5 | Super_Nut |

    | 6 | New Nut |


    In summary, views are a powerful tool in SQL. They can be used to simplify queries,
    improve security, and provide data abstraction.

