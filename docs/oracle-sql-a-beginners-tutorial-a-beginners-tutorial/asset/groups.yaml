    假设 `c_order` 表中的某个订单被了（在现实应用中，取消的订单可能会移动到另一个表）。这意味着 `shipment` 表的某些行在 `order`
    表中没有匹配行。为了返回没有发货的订单以及没有订单的发货记录，我们需要编写一个如列表 5.8 所示的全外连接查询。


    # 列表 5.8：全外连接


    ```

    SELECT o.*, s.*

    FROM c_order o

    FULL OUTER JOIN shipment s

    ON o.p_code = s.p_code

