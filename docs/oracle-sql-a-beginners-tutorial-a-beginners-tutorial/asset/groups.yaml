    # # Appendix C

    Indexes


    An index entry of the Index section of a book points to the location of the word/phrase
    indicated by the entry. The index entry helps you find the pages containing the
    word/phrase. Similarly, a column index of a table can speed up your finding data
    in a database. If your query has a condition on a column (or columns) that is
    (are) not indexed, the table will be fully scanned and the query will be slower
    than if an index was available.


    This appendix shows how to create various indexes. The topics covered are as follows.


    +   - Creating an index

    - Multi-column indexes

    - Bit map and join bit map indexes

    - Function-based indexes

    - Deleting an index


    # ## Creating an Index


    To create an index on a column or columns of a table, use this statement.


    ```

    CREATE INDEX index_on ON table (columns);

    ```


    For example, the statement in Listing C.1 creates an index named p_name_ix on
    the p_name column of the product table.


    **Listing C.1: Creating an index on the p_name in the product table***


    ```

    CREATE INDEX p_name_ix ON product (p_name);

    ```'
  - '[PAGE 129]


    # Unique Index Names and Columns


    You cannot have duplicate index names. In addition, you cannot have the same column(s)
    indexed more than once.


    # Multi-Column Indexes


    An index can be based on multiple columns. A multi-column index is useful when
    you need to search on rows having the same value on an indexed column. For instance,
    if your query has to search on the p_name column of the product table and there
    can be more than one row with the same p_name but with different launch dates,
    it would help if you create an index on both p_name and launch_dt.


    As an example, the statement in Listing C.2 creates a multi-column index on the
    p_name and launch_dt columns of the product table.


    Listing C.2: Creating an index on multiple columns


    ```

    CREATE INDEX p_name_launch_ix ON product (p_name, launch_dt);

    ```


    # Bitmap Indexes


    The indexes created in Listings C.1 and C.2 are ordinary indexes, which are technically
    called B-tree indexes. Another type of index, the bitmap index, can be a better
    choice for tables rows will not be changed concurrently, such as in a low-volume
    data entry environment. A product table is an example of such low data maintenance
    and therefore is suitable for bitmap indexes. By contrast, the customer order
    table gets inserted more frequently and is not a good candidate for bitmap indexes.


    For example, the statement in Listing C.3 creates a bitmap index named order_ibx
    on the c_order table.


    Listing C.3: Creating a bitmap index


    ```

    CREATE BITMAP INDEX order_bix ON c_order (p_code, c_no);

    ```'
  - '[PAGE 130]


    # Bitmap Join Indexes


    The bitmap join index is a variant of the bitmap index. The bitmap join index
    is specifically created to expedite column retrieval from a joined table in a
    join query.


    For example, the statement in Listing C.4 creates a bitmap join index on the c_name
    column. Note that for creating a bitmap join index has additional clauses, FROM
    and WHERE. These clauses define the join of the tables.


    # Listing C.4: Creating a bitmap join index on the c_name column


    ```

    CREATE BITMAP INDEX c_name_bji ON c_order(c.c_name)

    FROM c_order o, customer c

    WHERE o.c_no = c.c_no;

    ```


    c_name can now be retrieved faster using the index if it has to be scanned from
    the c_order table.


    While the aim of having a bitmap join index is to expedite a specific column retrieval
    (c_name in the statement in Listing C.4), joining tables generally make use of
    the primary key indexes of the tables as they are mostly joined on these keys.
    If you often need to join on other columns, you may want to create indexes on
    these columns as well.


    # Function-based Indexes


    There are often cases capitalization is used inconsistently when entering data
    into a table. Sometimes, a column value is entered in all capitals, sometimes
    in lowercase, and sometimes in mixed cases.


    For example, the following customer table shows inconsistent capitalization has
    been used for the c_name column.


    | C_NO C_NAME | PHONE |

    |---|---|

    | 10 | Standard Store 1-416-223-4455 |'
