    no rows selected\n```\n\n## 返回具有相同值的行的子查询\n\n如果你使用 ALL = 且子查询返回一行或多行具有相同值的行，你将不会得到“no\
    \ rows selected”的消息。\n\n你也可以使用 ANY 运算符将一列与子查询返回的值进行比较。如果你使用 ALL，查询会将该列与子查询返回的所有值（每一个值）进行比较。如果你使用\
