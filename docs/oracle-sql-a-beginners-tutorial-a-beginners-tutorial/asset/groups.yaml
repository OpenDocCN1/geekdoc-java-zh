  - "[PAGE 46]\n\n# # Chapter 4 Grouping\n\nA group is a set of rows having the same\
    \ value on specific columns. In Chapter 3, “Query Output” you learned how to apply\
    \ aggregate functions on all output rows. In this chapter you learn how to create\
    \ groups and apply aggregate functions on those groups.\n\n# ## The GROUP BY Clause\n\
    \nIn a query the GROUP BY clause appears after the WHERE clause and before the\
    \ ORDER clause, if any. Here is the syntax for a SELECT statement with the WHERE,\
    \ GROUP BY, and ORDER BY clauses.\n\n```\nSELECT columns,\n  aggregate_function(group_columns)\n\
    FROM table(s)\nWHERE condition\n  GROUP BY group_columns\nORDER BY column(s);\n\
    ```\n\nAs an example, the query in Listing 4.1 gives the output from the product\
    \ table by their launch date.\n\n# ### Listing 4.1: Grouping on one column\n\n\
    ```\nSELECT launch_dt,\n  MAX(price) MAX,\nMIN(price) MIN,\nSUM(price) SUM,\n\
    AVG(price) AVG,\nCOUNT(price) COUNT,\nCOUNT(*) AS \"COUNT(*)\"\n```"
