    \ (p_code);\n```\n\n对以下 product 表和 old_price 表应用查询：\n\n```\nP_CODE P_NAME   PRICE\
    \ LAUNCH_DT\n------------------------------------\n1      Nail        10.00 31-MAR-13\n\
    2      Washer      15.00 29-MAR-13\n3      Better Nut  10.00 01-MAY-13\n4    \
    \  Screw       15.00 01-MAY-13\n```\n\n返回的两个旧 Nut 如下：\n\n```\nP_CODE P_NAME  \
    \ CURRENT_PRICE\n----------------------------\n3      Nut             10\n3  \
    \    Newer Nut       10\n```\n\n## NVL\n\nNVL (expr1, expr2) 如果 expr1 不是 NULL，则返回\
    \ expr1；否则，返回 expr2。\n\n例如，假设你想比较旧价格和当前价格。在以下查询中应用 NVL，如果产品从未被更新，则从 product 表中获取旧价格；否则，如果产品已被更新过，其旧价格将来自\
    \ old_product 表。\n\n```sql\nSELECT p_code,\np.p_name,\np.price current_price,\n\
    NVL(op.price, p.price) old_price\nFROM product p\nLEFT OUTER JOIN old_product\
    \ op USING (p_code);\n```\n\n这是结果：\n\n| P_CODE | P_NAME | CURRENT_PRICE | OLD_PRICE\
    \ |\n|---|---|---|---|\n| 1 | Nail | 10 | 10 |\n| 2 | Washer | 15 | 15 |\n| 3\
    \ | Nut | 10 | 12 |\n| 4 | Nut | 10 | 15 |\n| 5 | Screw | 15 | 15 |\n\n显示只有 Nut\
    \ 被更新了，并且更新了两次。因此，它的旧价格来自 old_price 表。其他产品从未被更新，所以它们的当前和旧价格相同。它们的旧价格来自 product\
    \ 表，因为 `op.price` 列的参数是 NULL。\n\n## 总结\n\n你学习了一些可以在 Oracle 数据库中使用的内置函数。如果你想了解更多内置函数，请查阅\
    \ Oracle 手手册。\n\n## PL/SQL\n\nPL/SQL 是 Procedural Language（过程语言）的缩写，它补充了 SQL。本章的目标是介绍常用的\
    \ PL/SQL 特性，例如：\n\n- 行处理查询输出\n- if-then-else 逻辑\n- 异常处理\n- 用户自定义函数\n\n## 行处理\n\
    \n在之前的章节中，你已经了解到查询的输出可以有多行。你可以编写一个 PL/SQL 程序来处理查询输出。行处理的 PL/SQL 程序结构如下：\n\n```sql\n\
    BEGIN\nFOR output_row IN (\n  SELECT ...)\nLOOP\n...\nEND LOOP;\nEND;\n```\n\n\
    ## 示例 10.1: 行处理\n\n示例中的程序使用了连接查询，其输出存储在名为 `inv` 的变量中。在循环中，`inv` 的每行都被插入到 invoice\
    \ 表中：\n\n```sql\nBEGIN\n  FOR inv IN\n    (SELECT c_no,\n      c_name,\n     \
    \ p_name,\n      qty,\n      price * prc, total_prc,\n      sysdate as invoice_dt,\n\
    \      launch_dt\n    FROM c_order\n    JOIN product\n    JOIN customer)\n  LOOP\n\
    \    INSERT INTO invoice\n    (\n      inv.c_no,\n      inv.c_name,\n      inv.p_name,\n\
    \      inv.qty,\n      inv.unit_prc,\n      inv.total_prc,\n      inv.invoice_dt\n\
    \    );\n  END LOOP;\n```\n\n假设你有 c order、customer 和 product 表，分别如表 10.1、10.2\
    \ 和 10.3，并且你还有一个空的 invoice 表。\n\n## 表 10.1: c_order 表\n\n| C_NO | Store | C_DATE\
    \ |\n|---|---|---|\n| 10 | Standard Store | 25-JUL-13 |\n| 20 | Quality Store\
    \ | 27-JUL-13 |\n| 30 | Head Office | 19-JUL-13 |\n| 40 | Super Agent | 14-JUL-13\
    \ |\n\n## 表 10.2: customer 表\n\n| P_CODE | P_NAME | PRICE | LAUNCH_DT |\n|---|---|---|---|\n\
    | 1 | Nail | 10.00 | 31-MAR-13 |\n| 2 | Washer | 15.00 | 29-MAR-13 |\n| 3 | Nut\
    \ | 15.00 | 29-MAR-13 |\n| 4 | Screw | 25.00 | 30-MAR-13 |\n| 5 | Super Nut |\
    \ 30.00 | 30-MAR-13 |\n| 6 | New Nut | NULL | NULL |\n\n## 表 10.3: product 表\n\
    \n如果你在 SQL*Plus 中输入并执行示例 10.1 中的 PL/SQL 程序，你的 SQL*Plus 屏幕将如图 10.1 所示。注意，执行 PL/SQL\
    \ 程序需要在最后一个 END; 之后输入斜杠 `/`。\n\n![](img/45d34be9f5c11ea49c07c6bf553ed6_105_0.png)\n\
    \n```sql\nSQL> BEGIN\n  FOR inv IN\n    (SELECT c_no,\n      c_name,\n      p_name,\n\
    \      qty,\n      price * prc, total_prc,\n      sysdate as invoice_dt,\n   \
    \   launch_dt\n    FROM c_order\n    JOIN product NATURAL\n    JOIN customer)\n\
    \  LOOP\n    INSERT INTO invoice\n    (\n      inv.c_no,\n      inv.c_name,\n\
    \      inv.p_name,\n      inv.qty,\n      inv.unit_prc,\n      inv.total_prc,\n\
    \      inv.invoice_dt\n    );\n  END LOOP;\nEND;\nSQL> |\n```\n\nPL/SQL 过程成功完成。\n\
    \n图 10.1：在 SQL*Plus 中执行 PL/SQL 程序\n\n执行程序后，invoice 表将填充以下行：\n\n| C_NO C_NAME |\
    \ P_NAME | QTY UNIT_PRC TOTAL_PRC | INVOICE_DT |\n|---|---|---|---|---|---|\n\
    | 10 Standard Store | Washer | 100 | 15 | 1500 | 12-SEP-13 |\n| 10 Standard Store\
    \ | Nail | 100 | 10 | 1000 | 12-SEP-13 |\n\n"
