    # 110 Oracle SQL: A Beginner''s Tutorial


    # The User_Procedures View


    The user_procedures view contains information about your stored programs, including
    functions, procedures and triggers. Use the query in Listing 11.5 to show your
    stored procedures. Note that this view has some other columns that provide more
    information about the stored programs.


    Listing 11.5: Revealing the metadata of stored procedures and functions


    ```

    SELECT object_name, object_type FROM user_procedures;

    ```


    Executing the query against your database will give you something like the following
    output rows.


    ```

    OBJECT_NAME        OBJECT_TYPE

    -----------        -----------

    CALC_NEW_PRICE      FUNCTION

    UPD_PRICE           PROCEDURE

    PRICE_UPD_LOGGING TRIGGER

    ```


    # The User_Source View


    The last view I explain is the user_source view. This view contains the source
    code of your stored functions. For example, the query in Listing 11.6 returns
    the source of the CALC_NEW_PRICE function.


    Listing 11.6: Reading the source code of a function


    ```

    SELECT line, text FROM user_source WHERE name = ''CALC_NEW_PRICE'';

    ```


    Executing the query will show you the lines of codes of the function as shown
    here.'
