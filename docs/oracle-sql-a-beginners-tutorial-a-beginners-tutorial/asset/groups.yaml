    # 总结


    在本章中，你学习了如何对行值进行聚合。你还学习了使用应用在聚合上的 `HAVING` 条件。在下一章中，你将学习使用 `JOIN` 子句，它用于“聚合”来自多个表的行。


    # 第 5 章

    ## 连接 (Joins)


    现实世界的数据库通常将数据存储在几十个甚至数百个表中。在这些多表数据库中，一个表通常与一个或多个其他表相关。在这种环境下，你应该能够使用 `JOIN` 子句关联两个或多个表的行。本章将向你展示如何操作。


    ## 主键和外键


    在第 1 章“存储和维护数据”中，你学习了主键。主键是一个列或一组列，它能唯一标识表中的每一行。外键是一个列或一组列，它用于与另一个表的主键建立关联。使用外键/主键关联两个表的行的过程被称为“连接（joining）”。虽然主键是唯一的，但外键不需要是唯一的。你可以在多行中拥有相同的外键。例如，在订单表中，同一个产品可以有多个订单。在这个订单表中，产品由其外键表示，例如产品代码，它是产品表的主键。虽然连接表必须使用主键和外键，但缺失它们会导致错误地连接表。


    ## 查询多个表


    要从多个表查询数据，使用 `JOIN` 关键字来指定两个表的关联列。`SELECT` 语句的 `JOIN` 子句根据主键/外键关系连接两个或多个表的行。例如，订单表（c_order）可能需要一个外键来关联产品表的主键。此外，订单表可能还需要一个外键来关联客户表的主键。`JOIN`
    的语法如下：


    ```sql

    SELECT columns FROM table_1, table_2, ... table_n

    WHERE table_1.primary_key = table_2.foreign_key

    AND table_2.primary_key = table_n.foreign_key;

    ```


    为了说明连接的使用，将分别使用表 5.1、5.2 和 5.3 中的订单表、客户表和产品表。订单表的 `C_NO` 和 `P_CODE` 是外键；它们对应的主键分别在客户表和产品表中。


    | C_NO | P_CODE | QTY | ORDER_DT |

    |---|---|---|---|

    | 10 | 1 | 100 | 01-APR-13 |

    | 10 | 2 | 100 | 01-APR-13 |

    | 20 | 1 | 200 | 01-APR-13 |

    | 30 | 3 | 300 | 02-APR-13 |

    | 40 | 4 | 400 | 02-APR-13 |

    | 40 | 5 | 400 | 03-APR-13 |


    表 5.1：订单表（c_order）


    ```

    C_NO C_NAME

    ----------

    10 Standard Store

    20 Quality Store

    30 Head Office

    40 Super Agent

    ```

    表 5.2：客户表


    # 第 5 章：连接 49


    | P_CODE | P_NAME | PRICE | LAUNCH_DT |

    |---|---|---|---|

    | 1 | Nail | 10.00 | 31-MAR-13 |

    | 2 | Washer | 15.00 | 29-MAR-13 |

    | 3 | Nut | 15.00 | 29-MAR-13 |

    | 4 | Screw | 25.00 | 30-MAR-13 |

    | 5 | Super_Nut | 30.00 | 30-MAR-13 |

    | 6 | New Nut | NULL | NULL |


    表 5.3：产品表


    列表 5.1 是 `JOIN` 查询的示例。它根据订单表的 `c_no` 外键列和客户表的 `c_no` 主键列将订单表与客户表连接。该查询返回下了一个或多个订单的客户名称。


    ## 列表 5.1：双表连接


    ```sql

    SELECT c_name,

    p_code,

    c_order.qty,

    c_order.order_dt

    FROM c_order

    JOIN customer

    ON c_order.c_no = customer.c_no;

    ```


    对 c_order 和 customer 表应用后，结果如下。


    | C_NAME | QTY | ORDER_DT |

    |---|---|---|

    | Standard Store | 2 | 100 01-APR-13 |

    | Standard Store | 1 | 100 01-APR-13 |

    | Quality Store | 1 | 200 01-APR-13 |

    | Head Office | 3 | 300 02-APR-13 |

    | Super Agent | 5 | 400 03-APR-13 |

    | Super Agent | 4 | 400 02-APR-13 |


    ## 使用别名 (Aliases)


    在 `join` 查询中，不同的表可能具有相同名的列。为了确保引用的是表的正确列，你需要使用其别名对其进行限定。在上一个示例中，`order.c_no`（c_order表的
    `c_no` 列）和 `customer.c_no`（customer表的 `c_no` 列）被限定了。表别名是一种更方便（更短）的限定列的方法。


    例如，在列表 5.2 的查询中，`o` 是 c_order表的别名，`c` 是客户表的别名。这些别名被用于 `ON` 子句，以通过各自表来限定 `c_no`
    列。


    ## 列表 5.2：使用表别名


    ```sql

    SELECT c_name,

    p_code,

    o.qty,

    o.order_dt

    FROM c_order o

    JOIN customer c

    ON o.c_no = c.c_no;

    ```


    ## 列别名 vs. 表别名


    在第 3 章“查询输出”中，我解释了使用 `AS` 关键字创建列别名。虽然列别名可以不用 `AS` 关键字创建，但它的存在提高了可读性（使用 `p_name
    AS product name` 代替 `p_name`）。另一方面，表别名不能使用 `AS`。


    ## 连接多个表


    根据之前提供的 `JOIN` 语法，你可以连接多个表。要实现这一点，在 `SELECT` 语句中一次连接两个表。例如，列表 5.3 中的查询将订单表与客户表连接，然后将客户表与产品表连接。订单表的行与客户表的相同
    `c_no` 列连接，这些行再与产品表的相同 `p_code` 连接。该查询返回客户名称及其订单。


    ## 列表 5.3：三表连接


    ```sql

    SELECT c_name,

    p_name,

    o.qty,

    o.order_dt

    FROM c_order o

    JOIN customer c

    ON o.c_no = c.c_no

    JOIN product p

    ON o.p_code = p.p_code;

    ```


    对 c_order、customer 和 product 示例表应用后，你将看到以下结果。你也可以在 `join` 查询中应用 `WHERE` 条件来选择行。例如，在列表
    5.4 中，得益于 `WHERE` 条件，只有以“Super”开头的产品名称出现在查询输出中。


    ## 列表 5.4：JOIN AND WHERE


    ```sql

    SELECT c_name,

    p_name,

    o.qty,

    o.order_dt

    FROM c_order o

    JOIN customer c

    ON o.c_no = c.c_no

    JOIN product p

    ON o.p_code = p.p_code

    WHERE p_name NOT LIKE ''Super%'';

    ```


