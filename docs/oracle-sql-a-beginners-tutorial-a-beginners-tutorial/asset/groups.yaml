    # Introduction


    Welcome to Oracle SQL: A Beginner’s Tutorial. This book is for you if you want
    to learn SQL the easy way. SQL, which stands for Structured Query Language and
    is pronounced euc-cue-el, is the standard language you use to interact with a
    relational database management system (RDBMS). This book uses the free edition
    of the Oracle database to show how SQL works.


    # SQL Overview


    Initially developed at IBM in the early 1970s, SQL was formalized by the American
    National Standards Institute (ANSI) in 1986. Since then the SQL standard has been
    revised seven times. The examples in this book were tested using Oracle database
    11g Release 2, which conforms to the SQL:2008 standard. This standard is one revision
    earlier than SQL:2011, the latest standard.


    SQL consists of a data definition language (DDL) and a data manipulation language
    (DML). The DDL is used to create, delete, and alter the structure of a table and
    other database objects. The DML is used to insert, retrieve, and update data in
    a table or tables.


    Many database vendors implement a version of SQL that is not 100% compliant with
    the standard. They often add unique features to their SQL, resulting in a SQL
    dialect. For example, the following are some of the differences between Oracle
    and MySQL.


    +   - The AS reserved word in the CREATE TABLE AS INSERT statement is mandatory
    in Oracle but optional in MySQL


    +   - An Oracle INSERT statement can only insert one row; a MySQL INSERT statement
    can insert multiple rows.'
  - '[PAGE 7]


    # Oracle SQL: A Beginner’s Tutorial


    +   - Oracle supports UNION, INTERSECT and MINUS set operators whereas MySQL only
    supports UNION.

    - Oracle’s PL/SQL equivalent in MySQL is the stored routine (MySQL) did not give
    a name to its procedural extension). PL/SQL has much more functions than the stored
    routine.


    Because of these dialects, SQL statements written for one RDBMS may not necessarily
    work in other RDBMSs.


    # About This Book


    This book consists of eleven chapters and three appendixes. This section gives
    you an overview of each chapter and appendix.


    Chapter 1, “Storing and Maintaining Data” starts the book by discussing how data
    is stored and maintained in a relational database. In this chapter you learn how
    to use SQL INSERT, UPDATE, and DELETE statements.


    Chapter 2, “Basic Queries” explains how to construct queries using the SELECT
    statement.


    Chapter 3, “Query Output” shows how you can format query outputs beyond displaying
    columns of data from a database.


    Chapter 4, “Grouping” explains what a group is, how to create a group, and how
    to apply aggregate functions to a group.


    Chapter 5, “Joins” talks about the JOIN clause for querying data from multiple
    tables.


    Chapter 7, “Compound Queries” talks about set operators for combining the outputs
    of multiple queries.


    Chapter 8, “Views” discusses views, which are predefined queries that you create
    and store in a database.'
