    | 30 30-MAR-13 | 30 | 30 | 30 | 30 | 1 | 1 |

    | NULL | NULL | NULL | NULL | | 0 | 1 |


    # # The HAVING Keyword


    The WHERE condition can be used to select individual rows. On the other hand,
    the HAVING condition is used for selecting individual groups. Only groups that
    satisfy the condition in the HAVING clause will be returned by the query. In other
    words, the HAVING condition is on the aggregate, not on a column.


    If present, the HAVING clause must appear after the GROUP BY, as in the following
    syntax.


    ```

    SELECT columns,

    aggregate_function(group_columns)

    FROM table(s)

    WHERE condition

    GROUP BY group_columns

    HAVING aggregate_condition

    ORDER BY columns;

    ```


    As an example, the query in Listing 4.3 uses the HAVING condition.'
