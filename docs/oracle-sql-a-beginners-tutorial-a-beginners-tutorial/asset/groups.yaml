    # The USING Keyword


    A natural join will use all columns with the same names from the joined tables.
    If you want your query to join only on some of these identically named columns,
    instead of using the NATURAL keyword, use the USING keyword.


    The Syntax for joining two tables with USING is as follows.


    ```

    SELECT columns

    FROM table_1

    JOIN table_2 USING (column);

    ```


    Listing 5.14, for example, joins the c_order table to the shipment table on only
    their p_code columns. It does not join the tables on their c_no columns. This
    query gives you the total quantity shipped by product code.


    # Listing 5.14: USING


    ```

    SELECT p_code,

    SUM(s.ship_qty)

    FROM c_order o

    JOIN shipment s USING (p_code)

    GROUP BY p_code;

    ```


    Executing this query against our example c_order and shipment tables will produce
    the following output rows.


    ```

    P_CODE SUM(S.SHIP_QTY)

    ------ -

    1 400

    2 100

    ```


    # Summary


    In this chapter you learned about getting data from multiple tables. You learned
    how to use the various types of joins for this purpose.'
