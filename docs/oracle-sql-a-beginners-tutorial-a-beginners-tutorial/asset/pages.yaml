  md: '# Chapter 5

    Joins


    A real-world database typically stores data in dozens or even hundreds of tables.
    In these multi-table databases, a table often relates to one or some other tables.
    In this environment, you should be able to relate rows from two or more tables
    using the JOIN clause. This chapter shows you how.


    # Primary Keys and Foreign Keys


    In Chapter 1, “Storing and Maintaining Data” you learned about primary keys. A
    primary key is a column, or a set of columns, which uniquely identifies every
    row in a table. A foreign key is a column, or a set of columns, which is used
    to relate to the primary key of another table. The process of using the foreign
    key/primary key to relate rows from two tables is called joining.


    While a primary key is unique, a foreign key does not have to be unique. You can
    have a foreign key in more than one row. For example, in a customer order table
    you can have many orders for the same product. In this customer order table, a
    product is represented by its foreign key, e.g. product code, which is the primary
    key of the product table.


    Even though the use of primary and foreign keys is not an absolute requirement
    for joining tables, their absence may cause you to incorrectly join tables.'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# Querying Multiple Tables


    To query data from multiple tables, use the JOIN keyword to specify the related
    columns from two tables. The JOIN clause of a SELECT statement joins related rows
    from two or more tables, based on their primary key/foreign key relationship.


    For example, a customer order (c_order) table may need a foreign key column to
    relate to the primary key of the product table. Additionally, the customer order
    table may also need a foreign key to relate to the primary key of the customer
    table.


    The syntax for JOIN is as follows:


    ```

    SELECT columns FROM table_1, table_2, ... table_n

    WHERE table_1.primary_key = table_2.foreign_key

    AND table_2.primary_key = table_n.foregin_key;

    ```


    To illustrate the use of joins, will use the c_order table, customer table, and
    product table in Table 5.1, Table 5.2, and Table 5.3, respectively. The C_NO and
    P_CODE of the c_order table are foreign keys; their related primary keys are in
    the customer and product tables, respectively.


    C_NO | P_CODE | QTY ORDER_DT |

