- pgno: 36
  md: '# Chapter 3: Query Output 31


    In the Simple CASE, column_name is compared to equal_values in the WHEN clause,
    starting from the first WHEN and down to the last WHEN. If column_name matches
    a WHEN value, the value right after the THEN is returned and the CASE process
    stops. If column_name matches none of the WHEN values, else_value is returned
    if there exists an ELSE clause. If column_name matches none of the WHEN values
    but no ELSE clause exists, NULL will be returned.


    As an example, the query in Listing 3.7 uses a Simple CASE expression for the
    price column to produce price_cat (price category) output column.


    # Listing 3.7: An example of the Simple CASE


    ```

    SELECT p_code,

    p_name,

    CASE price

    WHEN 10

    THEN ''Cheap''

    WHEN 15

    THEN ''Medium''

    WHEN 25

    THEN ''Expensive''

    ELSE ''Others''

    END AS price_cat

    FROM product;

    ```


    Assuming the product table has the following data


    | P_CODE | P_NAME | PRICE | LAUNCH_DT |

    |---|---|---||}{

    | 1 | Nail | 10.00 | 31-MAR-13 |

    | 2 | Washer | 15.00 | 29-MAR-13 |

    | 3 | Nut | 15.00 | 29-MAR-13 |

    | 4 | Screw | 25.00 | 30-MAR-13 |

    | 5 | Super_Nut | 30.00 | 30-MAR-13 |

    | 6 | New Ut | NULL | NULL |


    the query will return these rows.


    | P_CODE | P_NAME | PRICE_CAT |

    |---|---||}{

    | 1 | Nail | Cheap |

    | 2 | Washer | Medium |'
