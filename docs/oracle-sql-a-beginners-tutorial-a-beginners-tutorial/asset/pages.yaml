- pgno: 14
  md: "# Updating Data\n\nYou specify the UPDATE statement to update one or more columns\
    \ of existing data. You can update all rows in a table or certain rows in the\
    \ table.\n\nThe syntax for the UPDATE statement is as follows\n\n```\nUPDATE table_name\n\
    SET column_1 = new_value_1,\n    column_2 = new_value_2,\n    ...\n[WHERE condition];\n\
    ```\n\nYou specify which rows to update in the WHERE clause. Without a WHERE clause,\
    \ all rows will be updated. With a WHERE clause, only rows that meets the condition\
    \ will be updated. If no row meets the condition in the WHERE clause, nothing\
    \ will be updated.\n\nAs an example, the SQL statement in Listing 1.4 will cut\
    \ the price by 5%. As the UPDATE statement does not have a WHERE clause, the prices\
    \ of all the products will be updated.\n\n# Listing 1.4: Updating the price column\n\
    \n```\nUPDATE product\nSET price = price - (price * 0.05);\n```\n\nIf you query\
    \ the product table using this statement, you will learn that the values in the\
    \ price column have changed.\n\n```\nSELECT * FROM product;\n```\n\nHere is the\
    \ result of the query.\n\n| P_CODE | P_NAME | PRICE LAUNCH_DT |\n|---|---|---||\n\
    | 1 | Nail | 9.50 | 31-MAR-13 |\n| 2 | Washer | 14.25 | 29-MAR-13 |\n| 3 | Nut\
    \ | 14.25 | 29-MAR-13 |\n| 4 | Screw | 23.75 | 30-MAR-13 |\n| 5 | Super_Nut |\
    \ 28.50 | 30-MAR-13 |"
  merge: -1
  img_proc: true
- pgno: 15
  md: '# Oracle SQL: A Beginner''s Tutorial


    6 New Nut NULL NULL


    Now, issue a ROLLBACK command to return the data values back to before the update:


    ```

    ROLLBACK;

    ```


    As another example, the statement in Listing 1.5 will update the price of product
    with p_code = 9, but the product table does not have such a p_code. Therefore,
    no row will be updated.


    Listing 1.5: Updating the price column with a WHERE clause


    ```

    UPDATE product

    SET price = price - (price * 0.05)

    WHERE p_code = 9;

    ```


    # Deleting Data


    To delete a row or multiple rows in a table, use the DELETE statement. You can
    specify which rows to be deleted by using the WHERE clause.


    The syntax for the DELETE statement is as follows


    ```

    DELETE FROM table

    [WHERE condition];

    ```


    You specify which rows to delete in the WHERE clause.


    For example, the statement in Listing 1.6 deletes from the product table all rows
    whose p_name field value is ''Nut''.


    Listing 1.6: Deleting rows


    ```

    DELETE FROM product

    WHERE p_name = ''Nut'';

    ```


    After you run the statement in Listing 1. 6, please issue a ROLLBACK command to
    return the data values back to before the deletion:


    ```

    ROLLBACK;

    ```'
