    # Multiple-Row Subqueries


    A subquery that returns more than one value is called a multiple-row subquery.
    This type of subquery also occurs in the WHERE clause of an outer query, however
    instead of using a comparison operator, you use IN or NOT IN in the WHERE clause.


    For example, the query in Listing 6.3 contains a multiple-row subquery.


    # Listing 6.3: Using a multiple-row subquery


    ```

    SELECT *

    FROM product

    WHERE price IN

    (SELECT MAX(price))

    FROM product p

    INNER JOIN c_order s

    ON p.p_code = s.p_code

    GROUP BY p.launch_dt

    );

    ```


    Run again same product and order tables, the subquery will return these three
    values:


    ```

    MAX(PRICE)

    ------

    15

    30

    10

    ```'
