    # Multiple Nested Subqueries


    A subquery can contain another query, making it a query with multiple nested subqueries.
    The query in Listing 6.7, for example, has multiple nested subqueries. Notice
    the two IN''s, one for each of the two nested queries? The query returns only
    customers who have not ordered product name that contains ''Nut''.


    Listing 6.7: Query with multiple nested subqueries


    ```

    SELECT customer.*

    FROM customer

    WHERE c_no IN

    (SELECT c_order

    FROM c_order

    WHERE p_code IN

    (SELECT p_code FROM product WHERE p_name NOT LIKE ''%Nut%'')

    );

    ```


