    # Limiting the Number of Rows


    You can limit the number of output row by using the ROWNUM pseudo column. Its
    syntax is as follows.


    ```

    SELECT columns FROM table(s)

    WHERE conditions ROWNUM < count;

    ```


    The maximum number of output rows of a query that employs ROWNUM will be count
    – 1.


    As an example, take a look at the query in Listing 3.3.


    # Listing 3.3: Using ROWNUM


    ```

    SELECT * FROM product WHERE price > 10 AND ROWNUM < 4;

    ```


    Without the expression ROWNUM < 4, the number of output rows would be 4. The query
    in Listing 3.3, however, returns these three rows.'
