- pgno: 75
  md: "# Correlated Subqueries\n\nAll the preceding subqueries are independent of\
    \ their outer queries. A subquery can also be related to its outer query, where\
    \ one or more column from the outer query table is (are) related to the column(s)\
    \ of the subquery table in the WHERE clause of the subquery. This type of subquery\
    \ is called the correlated subquery.\n\nAs an example, the query in Listing 6.8\
    \ contains a correlated subquery that returns only customers who have not ordered\
    \ any product whose name contains 'Nut'. Note that the c_no column of the outer\
    \ query table, customer, is related to the c_no column of the c_order table of\
    \ the subquery.\n\n# Using a correlated subquery\n\n```\nSELECT customer.*\nFROM\
    \ customer\nWHERE c_no IN\n  (SELECT c_no\n  FROM order o\n  JOIN product p\n\
    \  ON o.p_code = p.p_code\n  WHERE p_name NOT LIKE '%Nut%')\nAND customer.c_no\
    \ = o.c_no;\n```\n\nThe following are the query result.\n\n| C_NAME |\n|---||\n\
    | 40 Super Agent |\n| 10 Standard Store |\n| 20 Quality Store |"
  merge: -1
  img_proc: true
