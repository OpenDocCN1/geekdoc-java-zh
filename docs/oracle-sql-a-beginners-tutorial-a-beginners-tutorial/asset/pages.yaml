- pgno: 112
  md: '# Chapter 11

    The Data Dictionary


    The data dictionary of a database contains data about the data in the database.
    This data about data is also known as metadata. The data in the data dictionary
    is stored as tables. As such, you can use your SQL skills gained so far to query
    the data dictionary of your database. The tables and their data are maintained
    by the Oracle database system. You should not access the dictionary tables directly.
    Instead, use the Oracle-supplied views of the dictionary.


    In this chapter you explore the views in the data dictionary.


    # The Dictionary View


    The dictionary view is one of the views in the data dictionary. It returns all
    the views available in your dictionary. The view has two columns and can have
    over 650 rows.


    The query in Listing 11.1 can be used to list all the views in the data dictionary.


    # Listing 11.1: Exploring the data dictionary


    ```

    SELECT * FROM dictionary;

    ```


    Here is partial output of the query in Listing 11.1. Remember, the actual output
    has many more rows.'
