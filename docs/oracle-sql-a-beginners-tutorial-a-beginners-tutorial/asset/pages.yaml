  md: "# Chapter 8\nViews\n\nA view is effectively a predefined query. You create\
    \ and use views most\nfrequently for the following purposes:\n\n+   - Hiding table\
    \ columns (for security protection)\n- Presenting pre-computed columns (in lieu\
    \ of table columns)\n- Hiding queries (so that the query outputs are available\
    \ without\n  running the queries)\n\nThis chapter discusses view and presents\
    \ examples of views.\n\n# Creating and Using Views\n\nYou create a view using\
    \ the CREATE VIEW statement. Here is its syntax.\n\n```\nCREATE VIEW view_name\
    \ (columns) AS SELECT ...;\n```\n\nThe SELECT statement at the end of the CREATE\
    \ VIEW statement is the\npredefined query. When you use a view its predefined\
    \ query is executed.\nSince a query result is a table that is not persisted (stored)\
    \ in the database,\na view is also known as a virtual table. The table in the\
    \ SELECT statement of\na view is is known as a base table.\n\nOne of the reasons\
    \ you use a view is when you have a table you need to\nshare with other people.\
    \ If you don't want some of the table columns\nviewable by others, you can use\
    \ a view to hide those columns. You would\nthen share the view and restrict access\
    \ to the base table."
  merge: -1
  img_proc: true
- pgno: 85
  md: '# 80 Oracle SQL: A Beginner''s Tutorial


    For example, Listing 8.1 shows an SQL statement for creating a view called product_v
    that is based on the product table. The view hides the price column of the base
    table.


    # Listing 8.1: Using a VIEW to hide columns


    ```

    CREATE VIEW product_v

    ( p_code , p_name

    ) AS

    SELECT p_code, p_name FROM product;

    ```


