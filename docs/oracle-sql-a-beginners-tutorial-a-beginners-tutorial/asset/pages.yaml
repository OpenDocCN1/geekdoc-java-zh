  md: '# # Appendix B

    Oracle Built-in Data Types


    The Oracle database has 18 built-in data types, shown in Table B.1.


    | Data Type | Description |

    | --- | --- |

    | VARCHAR2(ml) | Variable-length character string having a maximum length of ml
    |

    | NVARCHAR2(ml) | The Unicode version of VARCHAR2 |

    | NUMBER(p, s) | Number having precision p and scale s |

    | DATE | Valid date ranging from January 1, 4712 BC, to December 31, 9999 AD |

    | BINARY FLOAT | 32-bit floating point number |

    | BINARY DOUBLE | 64-bit floating point number |

    | TIMESTAMP | The year, month, and day values of the date, plus the hour, minute,
    and second values of the time |

    | INTERVAL YEAR | Stores a period of time in years and months |

    | INTERVAL DAY | Stores a period of time in days, hours, minutes, and seconds
    |

    | RAW(size) | Raw binary data of the length of size bytes |

    | LONG RAW | The larger version of RAW |

    | ROWID | Base-64 string representing the unique address of a row in its table
    |

    | CHAR(l) | Fixed-length character having length l |

    | NCHAR(l) | Unicode version of CHAR |

    | CLOB | A character large object containing single-bytes or multi-byte characters
    |

    | NCLOB | Unicode version of CLOB |

    | BLOB | A binary large object |

    | BFILE | Contains the locator to a large binary file stored outside the database
    |


    Table B.1: Oracle Built-in Data Types'
