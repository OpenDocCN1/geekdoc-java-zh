    The full outer join returns all rows from tables whether or not there are matching
    rows from the opposite table. The syntax for the full outer join is as follows.


    ```

    SELECT columns

    FROM table_1 FULL OUTER JOIN table_2

    ON table_1.column = table_2.column ... ;

    ```


