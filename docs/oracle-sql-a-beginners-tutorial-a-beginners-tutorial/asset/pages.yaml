    The next section shows you how to create a database user that you will use to
    test the book examples.


    # Creating a User with SQL*Plus


    To create a database user and run an SQL statement, use SQL*Plus, a tool that
    comes with the Oracle database. To run SQL*Plus, select “Run SQL..." from your
    Windows Start menu, as shown in Figure A.5.'
  merge: -1
