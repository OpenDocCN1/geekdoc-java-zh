    The CASE expressionCASE allows you to have dynamic query output in which a column
    may vary depending on the value of the column. CASE comes in two flavors: Simple
    and Searched. Both will be explained in the following subsections.


    # The Simple CASE


    The general syntax for the Simple CASE is as follows.


    ```

    SELECT columns,

    CASE column

    WHEN equal_value1

    THEN output_value1

    WHEN equal_value2

    THEN output_value2

    WHEN

    ...

    [ELSE else_value]

    END AS output_column

    FROM table

    WHERE ... ;

    ```'
