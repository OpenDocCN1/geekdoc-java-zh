  md: '# COALESCE


    COALESCE(expr-1, expr-2, ..., expr-n) returns the first expression from the list
    that is NULL. For example, suppose your product table contains the following rows


    | P_CODE | P_NAME | LAUNCH_DT | MIN_PRICE |

    |---|---|---|---||

    | 1 | Nail | 10.00 | 31-MAR-13 | NULL |

    | 2 | Washer | 15.00 | 29-MAR-13 | NULL |

    | 3 | Nut | 15.00 | 29-MAR-13 | 12.00 |

    | 4 | Screw | 20.00 | 30-MAR-13 | 17.00 |

    | 5 | New Nut | NULL | 01-APR-13 | 10.00 |

    | 6 | Newer Nut | NULL | 01-MAY-13 | NULL |


    and you want to view the sale_price column of the products using this formula:


    +   * If price is available (not NULL) then discount it by 10%

    * If price is not available then return min_price

    * If both price and min_price are not available, return 5.0


    You can use COALESCE to produce the correct sale_price values:


    ```

    SELECT p_name, price, min_price,

    COALESCE(price * 0.9), min_price, 5.0) sale_price

    FROM product;

    ```


    Here is the query result.


    | P_NAME | PRICE | MIN_PRICE | SALE_PRICE |

    |---|---|---|--|

    | Nail | 10.00 | NULL | 9 |

    | Washer | 15.00 | NULL | 13.5 |

    | Nut | 15.00 | 12.00 | 13.5 |

    | Screw | 20.00 | 17.00 | 18 |

    | New Nut | NULL | 10.00 | 10 |

    | Newer Nut | NULL | NULL | 5 |'
