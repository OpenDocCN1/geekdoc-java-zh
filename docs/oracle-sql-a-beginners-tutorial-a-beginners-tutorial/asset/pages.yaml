- pgno: 68
  md: '# Chapter 6 Subqueries


    A subquery is a query nested within another query. The containing query is called
    an outer query. A subquery in turn can have a nested query, making it multiple
    nested query.


    This chapter discucsses subqueries in detail.


    # Single-Row Subqueries


    A single-row subquery is a subquery that returns a single value. A single-row
    subquery can be placed in the WHERE clause of an outer query. The return value
    of the subquery is compared with a column of the outer query using one of the
    comparison operators. (Comparison operators were discussed in Chapter 2, “Basic
    Queries”)


    For example, the query in Listing 6.1 contains a single-row subquery that returns
    the highest sale price for a product. The outer query returns all products from
    the product table that have that highest price (30.00), the Super_Nut and New
    Nut products.


    Listing 6.1: A subquery that returns a single value


    ```

    SELECT *

    FROM product

    WHERE price =

    (SELECT MAX(price))

    FROM product p

    INNER JOIN c_order o

    ON p.p_code = o.p_code

    );

    ```'
  merge: -1
  img_proc: true
