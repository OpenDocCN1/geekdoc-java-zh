  md: "# Subqueries Returning Rows Having the Same Value\n\nIf you use ALL = the subquery\
    \ returns one row or multiple rows with the same value you will not get a “no\
    \ rows selected” message.\n\nYou can also use the ANY operator to compare a column\
    \ with the values returned by a subquery. If you use ALL, the query compares a\
    \ column to all values (every one of the values) returned by the subquery. If\
    \ you use ANY, the query compares a column to any one of the values returned by\
    \ the subquery.\n\nFor example, the query in Listing 6.6 compares the price column\
    \ for equality to any the maximum prices returned by the subquery, in other words,\
    \ the WHERE condition is true if the price equals to any of maximum prices.\n\n\
    # Listing 6.6: Using the equal comparison to ANY value\n\n```\nSELECT *\nFROM\
    \ product\nWHERE price = ANY\n(SELECT MAX(price)\n  FROM product p\n  INNER JOIN\
    \ c_order o\n  ON p.P_code = o.p_code\n  GROUP BY p.launch_dt\n)\nORDER BY p_code;\n\
    ```\n\nThe subquery will return these rows.\n\n```\nMAX(PRICE)\n-------\n15\n\
    30\n10\n```\n\nThe outer query output will consist of any product that has a price\
    \ equal to any of these (maximum price) values. Here is the query output.\n\n\
    ```\nP_CODE P_NAME PRICE LAUNCH_DT\n```"
