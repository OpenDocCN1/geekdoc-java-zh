- pgno: 10
  md: '# # Chapter 1

    Storing and Maintaining Data


    Data in a relational database (such as the Oracle database) is stored in tables.
    A very simple sales database, for example, might have four tables that store data
    on products, customers, suppliers, and customer orders.


    When you add a record of data into a table, the record is stored as a row of the
    table. A record has fields. A product record, for example, might have four fields:
    product code, name, price, and launch date. All records you store in the product
    table must have the same fields. Each of the fields is a column of the table.


    This chapter shows you how to use SQL statements to store and maintain data. The
    main objective of this chapter is to give you a taste of working with SQL.


    To test the examples you need a working Oracle database. Appendix A, "Installing
    Oracle Database XE" shows how you can install Oracle Database Express Edition
    (XE) and make it ready for use with the examples. This appendix also shows how
    to use SQL*Plus to execute your SQL statements. If you do not have a working Oracle
    database, you should read this appendix first.


    # Selecting A Database to Use


    You need a database to store your data. When you install Oracle Database XE, a
    database named "XE" is created as part of the installation. To use this database,
    run SQL*Plus and issue a CONNECT command as described in Appendix A, "Installing
    Oracle Database XE."'
  merge: -1
  img_proc: true
- pgno: 11
  md: "# Oracle SQL: A Beginner’s Tutorial\n\n# # Creating a Table\n\nBefore you can\
    \ store data in a database, you must first create a table for your data. You do\
    \ this by using the SQL CREATE TABLE statement. Tables that you create will reside\
    \ in the database that you are currently connected to, which in this case is the\
    \ XE database.\n\nThe syntax for the CREATE TABLE statement is as follows.\n\n\
    ```\nCREATE TABLE table\n  column_1 data_type_1,\n  column_2 data_type_2,\n  ...\n\
    \  PRIMARY KEY (columns);\n\n```\n\nListing 1.1 shows a CREATE TABLE statement\
    \ for creating a product table with four columns.\n\n# ### Listing 1.1: Creating\
    \ a product table with four columns\n\n```\nCREATE TABLE product\n  p_code VARCHAR(6),\n\
    \  p_name VARCHAR(15),\n  price NUMBER(4,2),\n  launch_dt DATE,\n  PRIMARY KEY\
    \ (p_code);\n\n```\n\nThe four columns have three different data types. They are\
    \ as follows.\n\n+   - VARCHAR2(n) - variable length string to n characters.\n\
    - NUMBER(p, s) - numeric with precision p and scale s. The price column, whose\
    \ type is NUMBER(4,2), can store numbers between -99.99 and +99.99.\n- DATE –\
    \ date"
  merge: -1
  img_proc: true
- pgno: 12
  md: 'Note

    Appendix B, “Oracle Built-in Data Types” provides a complete list of Oracle data
    types.


    When creating a table, you should always add a primary key, even though a primary
    key is optional. A primary key is a column or a set of columns that uniquely identify
    every row in the table. In the CREATE TABLE statement in Listing 1.1, the p_code
    field will be the primary key for the product table.


    Also note that an SQL statement must be terminated with a semicolon;


    # Adding Data


    Once you have a table, you can add data to it using the INSERT statement. The
    syntax for the INSERT statement is as follows


    ```

    INSERT INTO table

    (column_1,

    column_2,

    ...)

    VALUES (value_1,

    value_2,

    ...);

    ;

    ```


    For example, Listing 1.2 shows an SQL statement that inserts a row into the product
    table.


    Listing 1.2: Inserting a row into the product table


    ```

    INSERT INTO product

    ( p_code, p_name, price, launch_dt)

    VALUES ( 1, ''Nail'', 10.0, ''31-MAR-2013'');

    ```


    After you execute the statement in Listing 1.2, your product table will have one
    row. You can query your table using this statement.'
  merge: -1
  img_proc: true
