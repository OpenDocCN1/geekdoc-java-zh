  md: '# Rows with NULL only


    If you want to query only orders that have not been shipped at all, you have to
    put this “only” condition in the WHERE clause of your query (ship_dt IS NULL)
    as in the query in Listing 5.7.


    # Listing 5.7: NULL only rows


    ```

    SELECT o.*,

    ship_dt

    FROM c_order o

    LEFT OUTER JOIN shipment s

    ON o.p_code = s.p_code

    AND o.c_no = s.c_no

    WHERE s.ship_dt IS NULL;

    ```


    The following output rows from the query in Listing 5.7 are customer orders that
    have not been shipped.


    | C_NO P_CODE | QTY ORDER_DT SHIP_DT |

    |---|---|---|

    | 40 4 | 400 02-APR-13 NULL |

    | 40 5 | 400 03-APR-13 NULL |


    # Full Outer Joins


    Suppose any order that was canceled was deleted from the c_order table (In a real-life
    application, canceled orders might be moved to a different table, rather than
    deleted). This means, some rows of the shipment table now may not have matching
    rows in the order table. To return orders that do not have shipments as well shipments
    that do not have orders, we need to write a query with the full outer join, like
    the one shown in Listing 5.8.


    # Listing 5.8: Full outer join


    ```

    SELECT o.*, s.*

    FROM c_order o

    FULL OUTER JOIN shipment s

    ON o.p_code = s.p_code

    AND o.c_no = s.c_no;

    ```'
  merge: -1
  img_proc: true
