    # SUBSTR


    SUBSTR(str, start_position, [length]) returns a substring of str starting from
    the position indicated by start_position. If length is not specified, the function
    returns a substring from start_position to the last character in str. If length
    is present, the function returns a substring which is length characters starting
    from start_position. If length is not 1, the function returns an empty string.


