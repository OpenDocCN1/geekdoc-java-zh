  md: '# Using Table Aliases


    In a join query, different tables can have columns with identical names. To make
    sure you refer to the correct column of a table, you need to qualify it with its.
    In the previous example, order.c_no (the c_no column of the c_order table) and
    customer.c_no (the c_no column of the customer_table) were how the c_no columns
    were qualified. A table alias can be a more convenient (shorter) way to qualify
    a column.


    For example, in the query in Listing 5.2, o is an alias for the c_order table
    and c is an alias for the customer table. These aliases are used in the ON clause
    to qualify the c_no columns with their respective tables.


    # Listing 5.2: Using table aliases


    ```

    SELECT c_name,

    p_code,

    o.qty,

    o.order_dt

    FROM c_order o

    JOIN customer c

    ON o.c_no = c.c_no;

    ```


    # Column Aliases vs. Table Aliases


    In Chapter 3, "Query Output", I explained the use of aliases for columns using
    the AS keyword. Although a column alias can be created without the AS keyword,
    its presence improves readability ("p_name AS product name" instead of "p_name
    product_name\). On the other hand, table aliases cannot use the AS keyword.


    # Joining More than Two Tables


    From the JOIN syntax presented earlier, you can join more than two tables. To
    do this, in the SELECT statement, join two tables at a time.


    For example, the query in Listing 5.3 joins the c_order table to the customer
    table, and then joins the customer table to the product table. The'
