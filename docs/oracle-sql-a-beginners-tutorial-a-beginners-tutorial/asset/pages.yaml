  md: '# If-Then-Else Decision Logic


    You can use an if statement to branch in a program. For instance, the if-then-else
    decision logic in Listing 10.2 treats the output rows differently based on the
    product launch_dt.


    # Listing 10.2: If-then-else decision logic


    ```

    BEGIN

    FOR invc IN

    (SELECT c_no,

    c name,

    p_name,

    qty,

    price unit_prc,

    (qty * price) total_prc,

    sysdate invoice_dt,

    launch dt

    FROM c_order NATURAL

    JOIN product NATURAL

    JOIN customer

    )

    LOOP

    IF invc.launch_dt IS NOT NULL THEN

    INSERT

    INTO invoice VALUES

    (

    invc.c_no,

    invc.c_name,

    invc.p_name,

    invc.qty,

    invc.unit_prc,

    invc.total_prc,

    invc.invoice_dt

    );

    ELSE

    NULL;

    END IF;

    ```'
  merge: -1
  img_proc: true
