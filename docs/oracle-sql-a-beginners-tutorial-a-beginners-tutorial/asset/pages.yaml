  md: '```

    FROM product prod

    INNER JOIN prod_subst ps

    ON prod.p_code = ps.p_code

    INNER JOIN product subst

    ON ps.s_code = subst.p_code

    ORDER BY prod.p_code;

    ```


    Here are the output rows from the query in Listing 5.10.


    | P_CODE P_NAME | S_CODE S_NAME |

    |---|---|---|---||

    | 3 Nut | 6 Newer Nut |

    | 3 Nut | 5 Super_Nut |


    # Natural Joins


    If two tables have columns that share a name, you can naturally join the two tables
    on these columns. In a natural join, you do not need to specify the columns that
    the join should use.


    The syntax for the natural join is this.


    ```

    SELECT columns FROM table_1 NATURAL JOIN table_2 ... ;

    ```


    Listing 5.11 shows an example of a natural join on the c_order and customer tables.
    This natural join implicitly joins the tables on their c_no columns.


    Listing 5.11: A natural join


    ```

    SELECT * FROM c_order NATURAL JOIN customer;

    ```


    Running the query in Listing 5.11 gives you the following output rows.


    | C_NO P_CO | QTY ORDER_DT | C_NAME |

    |---|---|---||

    | 10 1 | 100 01-APR-13 Standard Store |

    | 10 2 | 100 01-APR-13 Standard Store |

    | 20 1 | 200 01-APR-13 Quality Store |

    | 40 4 | 400 02-APR-13 Super Agent |

    | 40 5 | 400 03-APR-13 Super Agent |'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# Natural Outer Joins


    The natural join is also applicable to the outer join. Consider the query in Listing
    5.12.


    # Listing 5.12: A natural outer join


    ```

    SELECT * FROM c_order NATURAL RIGHT JOIN customer;

    ```


    Applying the query against the c_order and customer tables will give you the following
    output rows.


    | C NO P_CODE | QTY ORDER_DT | C_NAME |

    |---|---|---||

    | 10 1 | 100 01-APR-13 | Standard Store |

    | 10 2 | 100 01-APR-13 | Standard Store |

    | 20 1 | 200 01-APR-13 | Quality Store |

    | 40 4 | 400 02-APR-13 | Super Agent |

    | 40 5 | 400 03-APR-13 | Super Agent |

    | 30 NULL | NULL | Head Office |


    # Mixing Natural Joins with Different Column Names


    If you need to join on one column, and the second column pair does not share a
    name, you can specify the different column names in the WHERE clause. Listing
    5.13 shows an example of such a case.


    # Listing 5.13: Mixing natural join with different column names


    ```

    SELECT * FROM c_order o NATURAL RIGHT JOIN product p WHERE

    o.order_dt = p.launch_dt;

    ```


    In the query in Listing 5.13, in addition to the natural join on the same c_no
    column, the rows from the two tables have to be joined on the dates.


    The query does not return any row as we don’t have any order of a product with
    the same order date as the product’s launch date.'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# The USING Keyword


    A natural join will use all columns with the same names from the joined tables.
    If you want your query to join only on some of these identically named columns,
    instead of using the NATURAL keyword, use the USING keyword.


    The Syntax for joining two tables with USING is as follows.


    ```

    SELECT columns

    FROM table_1

    JOIN table_2 USING (column);

    ```


    Listing 5.14, for example, joins the c_order table to the shipment table on only
    their p_code columns. It does not join the tables on their c_no columns. This
    query gives you the total quantity shipped by product code.


    # Listing 5.14: USING


    ```

    SELECT p_code,

    SUM(s.ship_qty)

    FROM c_order o

    JOIN shipment s USING (p_code)

    GROUP BY p_code;

    ```


    Executing this query against our example c_order and shipment tables will produce
    the following output rows.


    ```

    P_CODE SUM(S.SHIP_QTY)

    ------ -

    1 400

    2 100

    ```


    # Summary


    In this chapter you learned about getting data from multiple tables. You learned
    how to use the various types of joins for this purpose.'
  merge: -1
  img_proc: true
