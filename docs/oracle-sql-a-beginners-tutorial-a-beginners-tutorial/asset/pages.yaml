  md: '# SIGN


    SIGN(n) returns a value indicating the sign of n. This function returns -1 for
    n < 0, 0 for n = 0, and 1 for n > 0. As an example, the following query uses SIGN
    to return the sign of (price – 15).


    ```

    SELECT p_code, price, SIGN(price - 15) FROM product;

    ```


