- pgno: 16
  md: 'If none of the rows meets the condition, nothing will be deleted. Without the
    WHERE condition, all rows will be deleted and the product table will be empty.


    As another example, the SQL statement in Listing 1.7 deletes all the rows in the
    product table.


    # Listing 1.7: Deleting all rows


    ```

    DELETE FROM product;

    ```


    Note that you cannot delete some of the columns in a row; the DELETE statement
    deletes the whole row. If you need to change the content of a specific column,
    use the UPDATE statement. For instance, the statement in Listing 1.8 changes the
    content of the product column to NULL. NULL is the absence of a value; it is neither
    (zero) nor empty. Chapter 2, “Basic Queries” has a section (“Handling NULL”) that
    explains NULL in detail.


    # Listing 1.8: Updating to NULL


    ```

    UPDATE product price = NULL WHERE p_name = ''Nut'';

    ```


    When you query the Nut product, the result will show NULL on the price column.


    ```

    SELECT * FROM product WHERE p_name = ''Nut'';

    ```


    The output is as follows.


    | P_CODE P_NAME PRICE LAUNCH_DT |

    |---|---|---||

    | 1 Nut NULL 13-DEC-01 |


    Please use a ROLLBACK command to return the data values back before the update:


    ```

    ROLLBACK;

    ```


    # NULL display


    In SQL* Plus, the default display of NULL is blank. Throughout this book, NULL
    is displayed as NULL. You can change the setting by executing the SET NULL command
    in your SQL*Plus console.'
