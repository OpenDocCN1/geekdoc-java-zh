    Scroll down until you see Database 11g Express Edition on the list and click the
    link. Then, select the version for your platform (Windows or Unix) and follow
    the download instructions. You will be requested to accept the license agreement,
    and if you don’t have one already, create an account. Don’t worry, creating an
    account is free.


