- pgno: 102
  md: "# Chapter 10\nPL/SQL\n\nPL/SQL, short for Procedural Language extension to\
    \ SQL, complements SQL with a procedural programming language. PL/SQL is a feature\
    \ of the Oracle database.\n\nThe objective of this chapter is to introduce some\
    \ of the most commonly used PL/SQL features such as\n\n+   - row-by-row processing\
    \ of query output\n- if-then-else decision logic\n- exception handling\n- user-defined\
    \ functions\n\n# Row-by-row Processing\n\nYou learned in the previous chapters\
    \ that the output of a query can be more than one row. You can write a PL/SQL\
    \ program to process query output row-by-row sequentially.\n\nThe structure of\
    \ the PL/SQL program for row-by-row processing is as follows.\n\n```\nBEGIN\n\
    FOR output_row_variable IN (\n  SELECT ...)\nLOOP\n  row processing statements;\n\
    END LOOP;\nEND;\n```"
  merge: -1
  img_proc: true
- pgno: 103
