    need to create tables and other objects, as well as store and update data, it
    is best if you have your own database. Fortunately, you can download Oracle Database
    Express Edition (a.k.a. from Oracle’s website. As you will learn in this appendix,
    Oracle Database XE comes with a tool called SQL*Plus that you can use to run SQL
    statements.


    # ## Downloading Oracle Database XE


    This database software can be downloaded from this web page.

