    # UNION


    UNION is similar to UNION ALL. However, with UNION duplicate rows will be returned
    once only. For example, consider the query in Listing 7.3 that consists of two
    SELECT elements.


    # Listing 7.3: Using UNION


    ```

    SELECT p_code,

    p_name

