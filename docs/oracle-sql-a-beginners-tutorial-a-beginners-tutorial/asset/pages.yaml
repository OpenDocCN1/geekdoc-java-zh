- pgno: 124
  md: '# Appendix A: Installing Oracle Database XE 119


    ![](img/45d34be9f5c11ea469c007c6bf553ed6_124_0.png)


    # Figure A.6: The SQL*Plus console


    Connect as SYSTEM by typing the following command and pressing Enter


    ```

    CONNECT SYSTEM/password AS SYSDBA;

    ```


    Here, *password* is the password of the SYSTEM user you entered during installation.
    To create a user, enter and execute the following command.


    ```

    CREATE user name IDENTIFIED BY password;

    ```


    Replace *name* with the actual user name you want to create and *password* with
    a password. For example, the following command creates a user named john with
    password secret.


    ```

    CREATE USER john IDENTIFIED BY secret;

    ```


    Next, enter and execute the following command, replacing *name* with the user
    name used in the previous command:


    ```

    GRANT ALL PRIVILEGES TO *name*;

    ```


    The GRANT ALL command gives the specified users all available permissions. Giving
    a user all privileges may not be a wise thing to do in a real system.


    The user now has permissions to test the book examples. To log on, enter this
    command to SQL*Plus.


    ```

    CONNECT name/password;

    ```


    For example


    ```

    CONNECT john/secret;

    ```'
  merge: -1
  img_proc: true
