- pgno: 62
  md: '# Chapter 5: Joins


    5 Super_Nut 30 30-MAR-13 NULL

    6 New Nut NULL NULL NULL


    To add the s_code column, execute the following statement:


    ```

    ALTER TABLE product ADD (s_code VARCHAR2(6));

    ```


    Then, to update the p_code = 3, execute the following statement:


    ```

    UPDATE product SET s_code = 5 WHERE p_code = 3;

    ```


    If you need to know the product name of a substitute, you need the query shown
    in Listing 5.9. This query joins the product table to itself. This kind of join
    is called a self-join.


    The syntax for the self-join is as follows.


    ```

    SELECT columns

    FROM table alias_1

    JOIN table alias_2

    ON alias_1.column_x = alias_2.column_y;

    ```


    Note that column_x and column_y are columns in the same table.


    # Listing 5.9: A self-join


    ```

    SELECT prod.p_code,

    prod.p_name,

    subst.p_code subst_p_code,

    subst.p_name subst_name

    FROM product prod

    LEFT OUTER JOIN product subst

    ON prod.s_code = subst.p_code

    ORDER BY prod.p_code;

    ```


    Here are the output rows of the query, showing “Newer Nut” in the subst_name column
    of the third row.


    | P_CODE P_NAME | SUBST SUBST_NAME |

    |---|---|---|---|

    | 1 Nail | NULL NULL |

    | 2 Washer | NULL NULL |

    | 3 Nut | 5 Super_Nut |

    | 4 Screw | NULL NULL |

    | 5 Super_Nut | NULL NULL |

    | 6 New Nut | NULL NULL |'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# Multiple Uses of A Table


    If a product can have more than one substitute, you need to store the product-substitute
    relationships in a separate table. A substitute cannot be recorded in the product
    table.


    To create the table that stores the product-substitute relationships named prod_subst,
    execute the following statement.


    ```

    CREATE TABLE prod_subst (p_code VARCHAR(6), s_code VARCHAR(6));

    ```


    To remove the s_code column, execute the following statement:


    ```

    ALTER TABLE product DROP (s_code);

    ```


    Your product table will now contain the following rows.


    | P_CODE | P_NAME | PRICE | LAUNCH_DT |

    | --- | --- | --- | --- |

    | 1 | Nail | 10 | 31-MAR-13 |

    | 2 | Washer | 15 | 29-MAR-13 |

    | 3 | Nut | 15 | 29-MAR-13 |

    | 4 | Screw | 25 | 30-MAR-13 |

    | 5 | Super_Nut | 30 | 30-MAR-13 |

    | 6 | New Nut | NULL | NULL |


    Assuming that the only product with substitutes is product 3 and its substitutes
    are the products 5 and 6, the prod_subst table will have two rows as follows.
    (You need to insert these two rows using the INSERT statements)


    ```

    P_NO_S_CODE

    ------ -------

    3     5

    3     6

    ```


    To get the name of a product and the names of its substitutes, you need to use
    the product table twice, as shown in the query in Listing 5.10.


    # Listing 5.10: Multiple uses of a table


    ```

    SELECT prod.p_code,

    prod.p_name,

    ps.s_code,

    subst.p_name AS s_name

    ```'
  merge: -1
  img_proc: true
