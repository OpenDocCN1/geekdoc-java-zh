  \ `ID` 更改为 `product_recycler`并将 `layout_height` 属性设为 `match_parent`。在继续之前，检查 `Component\
  \ Tree` 中的布局层级结构是否符合下图：\n\n![](img/as_4.1_room_demo_tree.jpg)\n\n图 66-13\n\n###\
  \ 66.8 调整布局边距\n\n最后只需调整一些布局设置。首先点击 `Component Tree` 面板中的第一个 `TableRow` 条目使其选中。按住键盘上的\
  \ `Cmd/Ctrl` 键，并点击第二个、第三个 `TableRow`、水平 `LinearLayout` 以及 `RecyclerView`。在 `Attributes`\
  \ 面板中，找到 `layout_margin` 属性类别，找到后将其值更改为 `10dp`，如 图 66-14 所示：\n\n![](img/as_3.4_layout_margin.jpg)\n\
  \n图 66-14\n\n设置边距后，用户界面应如 图 66-1 所示。\n\n### 66.9 总结\n\nAndroid `TableLayout` 容器视图提供了以行和列配置排列组件的方法。虽然\
  \ `TableLayout` 视图提供了整体容器，但每行及其包含的单元通过 `TableRow` 实现。在本章中，我们设计了一个用户界面。下一章将为该用户界面添加功能，以实现\
  \ SQLite 数据库功能。\n\n## 67. Android Room 数据库和仓库教程\n\n本章将结合 Android Room Persistence\
  \ Library 章节中学到的知识与上一章创建的初始项目，提供关于如何使用 Room 库实现 SQLite 数据库存储的详细教程。遵循 Android 架构指南，该项目将使用视图模型和仓库。\n\
  \n### 67.1 关于 RoomDemo 项目\n\n\n\n\n\n首先，启动 Android Studio 并打开上一章开始的 `RoomDemo` 项目。在向项目添加任何新类之前，第一步是向构建配置添加一些额外的库，包括\
  \ Room 持久化库。现在也是在 `build.gradle` 文件启用视图绑定（view binding）的好时机。找到并编辑模块层级的 `build.gradle`\
  \ 文件（`app` -> `Gradle Scripts` -> `build.gradle (Module :app)`），进行如下修改：\n\n```gradle\n\
  android {\n    buildFeatures {\n        viewBinding true\n    }\n}\n\ndependencies\
  \ {\n    implementation \"androidx.recyclerview:recyclerview:1.2.1\"\n    implementation\
  \ \"androidx.room:room-runtime:2.4.3\"\n    annotationProcessor \"androidx.room:room-compiler:2.4.3\"\
  \n}\n```\n\n## 67.3 构建实体 (Entity)\n\n该项目将从创建实体开始，实体定义了数据库表的模式结构（schema）。该实体将包含一个用于产品\
  \ ID 的整数、一个用于存储产品名称的字符串列以及另一个存储数量的整数值。`productid` 列将作为主键并自动生成。表 67-1 总结了实体的结构：\n\
  \n| 列名 | 数据类型 |\n| :--- | :--- |\n| productid | Integer / 主键 / 自动递增 |\n| productname\
  \ | String |\n| productquantity | Integer |\n\n表 67-1\n\n在 Project（项目）工具窗口中右键点击\
  \ `app` -> `java` -> `com.ebookfrenzy.roomdemo` 项，选择 `New` -> `Java Class` 菜单选项为实体添加一个类文件。在新类对话框中，将类命名为\
  \ `Product`，在列表中选择 `Class` 项并按键盘回车键生成文件。\n\n当 `Product.java` 文件在编辑器中打开时，对其进行修改如下如下：\n\
  \n```java\npackage com.ebookfrenzy.roomdemo;\n\npublic class Product {\n    private\
  \ int id;\n    private String name;\n    private int quantity;\n\n    public Product(String\
  \ name, int quantity) {\n        this.name = name;\n        this.quantity = quantity;\n\
  \    }\n\n    public int getId() {\n        return this.id;\n    }\n\n    public\
  \ String getName() {\n        return this.name;\n    }\n\n    public int getQuantity()\
  \ {\n        return this.quantity;\n    }\n\n    public void setId(int id) {\n \
  \       this.id = id;\n    }\n\n    public void setName(String name) {\n       \
  \ this.name = name;\n    }\n\n    public void setQuantity(int quantity) {\n    \
  \    this.quantity = quantity;\n    }\n}\n```\n\n现在该类拥有数据库表列的变量以及对应的 getter 和 setter\
  \ 方法。当然，在对类进行注解之前，它还没有成为实体。在编辑器中保持类文件打开的情况下，添加注解和相应的导入语句：\n\n```java\npackage com.ebookfrenzy.roomdemo;\n\
  \nimport androidx.room.ColumnInfo;\nimport androidx.room.Entity;\nimport androidx.room.PrimaryKey;\n\
  \n@Entity(tableName = \"products\")\npublic class Product {\n    @PrimaryKey(autoGenerate\
  \ = true)\n    @ColumnInfo(name = \"productId\")\n    private int id;\n\n    @ColumnInfo(name\
  \ = \"productName\")\n    private String name;\n\n    private int quantity;\n}\n\
  ```\n\n这些注解声明此实体为名为 `products` 的表的实体，并为 `id` 和 `name` 变量分配了列名。`id` 列也被配置为主键并自动生成。由于在\
  \ SQL 查询中不需要引用 `quantity` 列，因此没有为 `quantity` 变量分配列名。\n\n### 67.4 创建数据访问对象 (DAO)\n\
  \n定义好产品实体后，下一步是创建 DAO 接口。再次参考 Project 工具窗口，右键点击 `app` -> `java` -> `com.ebookfrenzy.roomdemo`\
  \ 项并选择 `New` -> `Java Class` 菜单选项。在新类对话框中，在 `Name` 字段中输入 `ProductDao`，并如图 67-1 所示，从列表中选择\
  \ `Interface`。\n\n按下回车键生成新接口，并在 `ProductDao.java` 文件加载到代码编辑器中后，进行以下更改：\n\n```java\n\
  package com.ebookfrenzy.roomdemo;\n\nimport androidx.lifecycle.LiveData;\nimport\
  \ androidx.room.Dao;\nimport androidx.room.Insert;\nimport androidx.room.Query;\n\
  import java.util.List;\n\n@Dao\npublic interface ProductDao {\n    @Insert\n   \
  \ void insertProduct(Product product);\n\n    @Query(\"SELECT * FROM products WHERE\
  \ productName = :name\")\n    List<Product> findProduct(String name);\n\n    @Query(\"\
  DELETE FROM products WHERE productName = :name\")\n    void deleteProduct(String\
  \ name);\n\n    @Query(\"SELECT * FROM products\")\n    LiveData<List<Product>>\
  \ getAllProducts();\n}\n```\n\n`DAO` 实现了从 products 数据库中插入、查找和删除记录的方法。插入方法接收一个包含要存储数据的\
  \ `Product` 对象，而查找和删除记录的方法则接收一个包含产品名称的字符串以执行操作。`getAllProducts()` 方法返回一个包含数据库中所有记录的\
  \ `LiveData` 对象。该方法将用于保持用户界面中 `RecyclerView` 产品列表与数据库同步。\n\n### 67.5 添加 Room 数据库\n\
  \n在将仓库添加到项目之前，最后一项任务是实现 Room 数据库。向项目中添加一个名为 `ProductRoomDatabase` 的新类，这次选择 `Class`\
  \ 。文件生成后，按照“Android 持久化库”章节概述的步骤对其进行修改：\n\n```java\npackage com.ebookfzy.roomdemo;\n\
  \nimport android.content.Context;\nimport androidx.room.Database;\nimport androidx.room.Room;\n\
  import androidx.room.RoomDatabase;\n\n@Database(entities = {Product.class}, version\
  \ = 1)\npublic abstract class ProductRoomDatabase extends RoomDatabase {\n    public\
  \ abstract ProductDao productDao();\n    private static ProductRoomDatabase INSTANCE;\n\
  \n    static ProductRoomDatabase getDatabase(final Context context) {\n        if\
  \ (INSTANCE == null) {\n            synchronized (ProductRoomDatabase.class) {\n\
  \                INSTANCE = Room.databaseBuilder(\n                        context.getApplicationContext(),\n\
  \                        ProductRoomDatabase.class,\n                        \"\
  product_database\").build();\n            }\n        }\n        return INSTANCE;\n\
  \    }\n}\n```\n\n## 67.6 添加仓库 (Repository)\n\n向项目中添加名为 `ProductRepository` 的新类，选择\
  \ `Class` 。仓库类负责代表 ViewModel 与 Room 数据库交互，并提供使用 DAO 插入、删除和查询产品记录的方法。除了 `getAllProducts()`\
  \ 方法（它返回 `LiveData` 对象）外，这些数据库操作需要在独立于主线程的线程上执行。\n\n在 `ProductRepository.java` 文件中，添加用于将搜索结果返回仓库线程的\
  \ handler 代码：\n\n```java\npackage com.ebookfzy.roomdemo;\n\nimport android.os.Handler;\n\
  import android.os.Looper;\nimport android.os.Message;\nimport java.util.concurrent.ExecutorService;\n\
  import java.util.concurrent.Executors;\nimport androidx.lifecycle.MutableLiveData;\n\
  import java.util.List;\n\npublic class ProductRepository {\n    private final MutableLiveData<List<Product>>\
  \ searchResults = new MutableLiveData<>();\n    private List<Product> results;\n\
  \n    Handler handler = new Handler(Looper.getMainLooper()) {\n        @Override\
  \ \n        public void handleMessage(Message msg) {\n            searchResults.setValue(results);\n\
  \        }\n    };\n}\n```\n\n上述代码声明了一个名为 `searchResults` 的 `MutableLiveData` 变量，当异步搜索任务完成时，结果将被存储其中（在随后的教程中，ViewModel\
  \ 中的观察者将监控此实时数据对象）。\n\n\n\n\n\n`Repository` 类现在需要提供一些可以供 `ViewModel` 调用以启动这些操作的方法。然而，为了实现这一点，仓库需要通过\
  \ `ProductRoomDatabase` 实例获取 `DAO` 引用。为 `ProductRepository` 类添加一个构造方法来执行这些任务：\n\n\
  ```java\nimport android.app.Application;\n\npublic class ProductRepository {\n \
  \   private final MutableLiveData<List<Product>> searchResults = new MutableLiveData<>();\n\
  \    private List<Product> results;\n    private final ProductDao productDao;\n\n\
  \    public ProductRepository(Application application) {\n        ProductRoomDatabase\
  \ db;\n        db = ProductRoomDatabase.getDatabase(application);\n        productDao\
  \ = db.productDao();\n    }\n}\n```\n\n在存储了 `DAO` 引用后，就可以按照所示将方法添加到 `ProductRepository`\
  \ 类文件中：\n\n```java\npublic void insertProduct(Product newproduct) {\n    ExecutorService\
  \ executor = Executors.newSingleThreadExecutor();\n    executor.submit(() -> productDao.insertProduct(newproduct));\n\
  \    executor.shutdown();\n}\n\npublic void deleteProduct(String name) {\n    ExecutorService\
  \ executor = Executors.newSingleThreadExecutor();\n    executor.submit(() -> productDao.deleteProduct(name));\n\
  \    executor.shutdown();\n}\n\npublic void findProduct(String name) {\n    ExecutorService\
  \ executor = Executors.newSingleThreadExecutor();\n    executor.submit(() -> {\n\
  \        results = productDao.findProduct(name);\n        handler.sendEmptyMessage(0);\n\
  \    });\n    executor.shutdown();\n}\n```\n\n在插入和删除方法中，创建并使用了适当的新线程来执行相应的数据库操作。在\
  \ `findProduct()` 方法中，会向 `handler` 发送消息，指示新结果可用。\n\n完成仓库类还剩最后一项任务。用户界面布局中的 `RecyclerView`\
  \ 需要能够更新数据库中存储的当前产品列表。`ProductDao` 类已包含一个名为 `getAllProducts()` 的方法，该方法使用 SQL 查询选择所有数据库记录并将它们封装在\
  \ `LiveData` 对象中返回。仓库需要在初始化时调用一次此方法，并将结果存储在 `LiveData` 对象中，该对象可以被 `ViewModel` 及其对应的\
  \ UI 控制器观察。一旦设置完成，每当数据库表发生变化时，UI 控制器观察者都会收到通知，`RecyclerView` 就可以更新最新的产品列表。在 `ProductRepository.java`\
  \ 文件中，在构造方法内添加 `LiveData` 变量并调用 DAO 的 `getAllProducts()` 方法：\n\n```java\nimport\
  \ androidx.lifecycle.LiveData;\n\npublic class ProductRepository {\n    private\
  \ final MutableLiveData<List<Product>> searchResults = new MutableLiveData<>();\n\
  \    private List<Product> results;\n    private final LiveData<List<Product>> allProducts;\n\
  \    private final ProductDao productDao;\n\n    public ProductRepository(Application\
  \ application) {\n        ProductRoomDatabase db;\n        db = ProductRoomDatabase.getDatabase(application);\n\
  \        productDao = db.productDao();\n        allProducts = productDao.getAllProducts();\n\
  \    }\n}\n```\n\n为了完成仓库，添加 `ViewModel` 可以调用的方法以获取 `allProducts` 和 `searchResults`\
  \ Live 数据对象的引用：\n\n```java\npublic LiveData<List<Product>> getAllProducts() {\n\
  \    return allProducts;\n}\n\npublic MutableLiveData<List<Product>> getSearchResults()\
  \ {\n    return searchResults;\n}\n```\n\n### 67.7 修改 ViewModel\n\n`ViewModel` 负责创建仓库实例，并提供\
  \ UI 控制器可以使用的方法和 `LiveData` 对象，以保持用户界面与底层数据库的同步。正如在 `ProductRepository.java` 中实现的，仓库构造方法需要访问应用上下文以便获取\
  \ Room 数据库实例。为了让 `ViewModel` 能够访问应用上下文以便将其传递给仓库，`ViewModel` 需要继承 `AndroidViewModel`\
  \ 而不是 `ViewModel`。因此，首先编辑 `MainViewModel.java` 文件（位于项目工具窗口的 `app -> java -> com.ebookfrenzy.roomdemo\
  \ -> ui.main` 下），并将类更改为扩展 `AndroidViewModel` 并实现默认构造函数：\n\n```java\npackage com.ebookfrenzy.roomdemo.ui.main;\n\
  \nimport android.app.Application;\nimport androidx.lifecycle.AndroidViewModel;\n\
  import androidx.lifecycle.LiveData;\nimport androidx.lifecycle.MutableLiveData;\n\
  import com.ebookfrenzy.roomdemo.Product;\nimport com.ebookfrenzy.roomdemo.ProductRepository;\n\
  import java.util.List;\n\npublic class MainViewModel extends AndroidViewModel {\n\
  \    private ProductRepository repository;\n    private LiveData<List<Product>>\
  \ allProducts;\n    private MutableLiveData<List<Product>> searchResults;\n\n  \
  \  public MainViewModel(Application application) {\n        super(application);\n\
  \        repository = new ProductRepository(application);\n        allProducts =\
  \ repository.getAllProducts();\n        searchResults = repository.getSearchResults();\n\
  \    }\n}\n```\n\n构造方法本质上创建一个仓库实例，然后使用它获取 `allProducts` Live 数据的引用，以便 UI 控制器进行观察。现在\
  \ `ViewModel` 中剩下的工作是实现从 UI 控制器内部在响应按钮点击以及在设置 `LiveData` 对象观察者时调用的方法：\n\n```java\n\
  MutableLiveData<List<Product>> getSearchResults() {\n    return searchResults;\n\
  }\n\nLiveData<List<Product>> getAllProducts() {\n    return allProducts;\n}\n\n\
  public void insertProduct(Product product) {\n    repository.insertProduct(product);\n\
  }\n\npublic void findProduct(String name) {\n    repository.findProduct(name);\n\
  }\n\npublic void deleteProduct(String name) {\n    repository.deleteProduct(name);\n\
  }\n```\n\n### 67.8 创建项目布局\n\n数据库中的每个产品名称将出现在 `RecyclerView` 列表中。这需要一个包含 `TextView`\
  \ 的布局文件用于列表的每一行。现在通过右键点击项目工具窗口中的 `app -> res -> layout` 项并选择 `New -> Layout Resource\
  \ File` 添加此文件。将文件命名为 `product_list_item`，并在点击确定之前将根元素更改为 `LinearLayout`，将其加载到布局编辑器中。在设计模式下，从调色板将\
  \ `TextView` 对象拖到布局中，它将默认出现在布局顶部：\n\nimage/as_3.5_roomdemo_item_layout.jpg\n图 67-2\n\
  \n选中 `TextView`，使用属性窗口将视图 ID 设置为 `product_row`并将 `layout_height` 设置为 `30dp`。选择组件树中的\
  \ `LinearLayout` 并将 `layout_height` 属性设置为 `wrap_content`。\n\n### 67.9 添加 RecyclerView\
  \ 适配器\n\n正如“使用 RecyclerView 和 CardView ”章节详细概述，`RecyclerView` 实例需要一个适配器类来提供要显示的数据。现在通过右键点击项目工具窗口中的\
  \ `app -> java -> com.ebookfrenzy.roomdemo -> ui.main` 项并选择 `New -> Java Class`\
  \ 添加此类。在对话框中，将类命名为 `ProductListAdapter` 并从列表中选择 `Class`，然后按回车键。将生成的 `ProductListAdapter.java`\
  \ 类加载到编辑器后，按如下实现该类：\n\n```java\npackage com.ebookfrenzy.roomdemo.ui.main;\n\nimport\
  \ android.view.LayoutInflater;\nimport android.view.View;\nimport android.view.ViewGroup;\n\
  import android.widget.TextView;\n\nimport com.ebookfrenzy.roomdemo.R;\n```\n\n\n\
  \n\n\n```java\nimport androidx.annotation.NonNull;\n\nimport androidx.recyclerview.widget.RecyclerView;\n\
  \nimport com.ebookfrenzy.roomdemo.Product;\n\nimport java.util.List;\n\npublic class\
  \ ProductListAdapter\n        extends RecyclerView.Adapter<ProductListAdapter.ViewHolder>\
  \ {\n\n    private final int productItemLayout;\n\n    private List<Product> productList;\n\
  \n    public ProductListAdapter(int layoutId) {\n        productItemLayout = layoutId;\n\
  \    }\n\n    public void setProductList(List<Product> products) {\n        productList\
  \ = products;\n        notifyDataSetChanged();\n    }\n\n    @Override\n    public\
  \ int getItemCount() {\n        return productList == null ? 0 : productList.size();\n\
  \    }\n\n    @NonNull\n    @Override\n    public ViewHolder onCreateViewHolder(ViewGroup\
  \ parent, int viewType) {\n        View view = LayoutInflater.from(\n          \
  \      parent.getContext()).inflate(productItemLayout, parent, false);\n       \
  \ return new ViewHolder(view);\n    }\n\n    @Override\n    public void onBindViewHolder(final\
  \ ViewHolder holder, final int listPosition) {\n        TextView item = holder.item;\n\
  \        item.setText(productList.get(listPosition).getName());\n    }\n\n    static\
  \ class ViewHolder extends RecyclerView.ViewHolder {\n        TextView item;\n\n\
  \        ViewHolder(View itemView) {\n            super(itemView);\n           \
  \ item = itemView.findViewById(R.id.product_row);\n        }\n    }\n}\n```\n\n\
  ### 67.10 准备 MainFragment\n\n最后一个需要修改的组件是 `MainFragment` 类，它需要在 `Button` 视图上配置监听器，并在位于\
  \ `ViewModel` 类中的 live data 对象配置观察者。在添加这些代码之前，需要进行一些准备工作，以添加一些导入、变量并获取视图 ID 的引用。我们还需要修改\
  \ fragment 以使用视图绑定（view binding）。编辑 `MainFragment.java` 文件并进行如下修改：\n\n```java\n\
  import com.ebookfrenzy.roomdemo.databinding.FragmentMainBinding;\n\npublic class\
  \ MainFragment extends Fragment {\n\n    private MainViewModel mViewModel;\n\n \
  \   private FragmentMainBinding binding;\n    private ProductListAdapter adapter;\n\
  \n    @Nullable\n    @Override\n    public View onCreateView(@NonNull LayoutInflater\
  \ inflater,\n                               @Nullable ViewGroup container,\n   \
  \                            @Nullable Bundle savedInstanceState) {\n        return\
  \ inflater.inflate(R.layout.fragment_main, container, false);\n        binding =\
  \ FragmentMainBinding.inflate(inflater, container, false);\n        return binding.getRoot();\n\
  \    }\n\n    @Override\n    public void onDestroyView() {\n        super.onDestroyView();\n\
  \        binding = null;\n    }\n\n    @Override\n    public void onViewCreated(@NonNull\
  \ View view,\n                             @Nullable Bundle savedInstanceState)\
  \ {\n        super.onViewCreated(view, savedInstanceState);\n        listenerSetup();\n\
  \        observerSetup();\n        recyclerSetup();\n    }\n```\n\n在代码的各个阶段，应用需要清除用户界面上显示的商品信息。为了避免重复，请添加以下\
  \ `clearFields()` 方便函数：\n\n```java\nprivate void clearFields() {\n    binding.productID.setText(\"\
  \");\n    binding.productName.setText(\"\");\n    binding.productQuantity.setText(\"\
  \");\n}\n```\n\n在构建构建和测试之前，需要将从 `onViewCreated()` 方法中调用的三个设置方法添加到类中。\n\n### 67.11\
  \ 添加监听器\n\n主 fragment 的用户界面布局包含三个按钮，每个按钮在用户点击时都需要执行特定的特定任务。编辑 `MainFragment.java`\
  \ 文件并添加 `listenerSetup()` 方法：\n\n```java\nimport com.ebookfrenzy.roomdemo.Product;\n\
  \nprivate void listenerSetup() {\n    binding.addButton.setOnClickListener(view\
  \ -> {\n        String name = binding.productName.getText().toString();\n      \
  \  String quantity = binding.productQuantity.getText().toString();\n        if (!name.equals(\"\
  \") && !quantity.equals(\"\")) {\n            Product product = new Product(name,\
  \ Integer.parseInt(quantity));\n            mViewModel.insertProduct(product);\n\
  \            clearFields();\n        } else {\n            binding.productID.setText(\"\
  Incomplete information\");\n        }\n    });\n    binding.findButton.setOnClickListener(view\
  \ ->\n        mViewModel.findProduct(binding.productName.getText().toString())\n\
  \    );\n    binding.deleteButton.setOnClickListener(view -> {\n        mViewModel.deleteProduct(binding.productName.getText().toString());\n\
  \        clearFields();\n    });\n}\n```\n\n`addButton` 监听器执行一些基础验证，以确保用户同时输入了商品名称和数量，并使用这些数据创建一个新的\
  \ `Product` 实体对象（注意，数量字符串被转换为整数以匹配实体数据类型）。在清除字段之前，会调用 `ViewModel.insertProduct()`\
  \ 方法并传递 `Product` 对象。\n\n`findButton` 和 `deleteButton` 监听器会将商品名称传递给 `ViewModel.findProduct()`\
  \ 或 `deleteProduct()` 方法。\n\n### 67.12 添加 LiveData 观察者\n\n现在用户界面现在需要添加观察者，以与 `ViewModel`\
  \ 内部的 `searchResults` 和 `allProducts` live data 对象保持同步。在 `Mainfragment.java` 文件中，按照如下方式实现观察者设置方法：\n\
  \n```java\nimport java.util.Locale;\n\nprivate void observerSetup() {\n    mViewModel.getAllProducts().observe(getViewLifecycleOwner(),\n\
  \            products -> adapter.setList(products));\n    mViewModel.getSearchResults().observe(getViewLifecycleOwner(),\n\
  \            products -> {\n                if (products.size() > 0) {\n       \
  \             binding.productID.setText(String.format(Locale.US, \"%d\", products.get(0).getId()));\n\
  \                    binding.productName.setText(products.get(0).getName());\n \
  \                   binding.productQuantity.setText(String.format(Locale.US, \"\
  %d\", products.get(0).getQuantity()));\n                } else {\n             \
  \       binding.productID.setText(\"No Match\");\n                }\n          \
  \  });\n}\n```\n\n`allProducts` 观察者简单地将列表传递给 `RecyclerViewAdapter` 的 `setList()`\
  \ 方法。\n\n`searchResults` 观察者检查数据库中是否至少有一个匹配的结果，提取第一个匹配的 `Product` 对象，获取数据并在需要时将其分配给\
  \ `TextView` 和 `EditText` 视图。如果搜索失败，将通过显示在 product ID TextView 上的消息用户。\n\n### 67.13\
  \ 初始化 RecyclerView\n\n添加如下方法初始化并配置 `RecyclerView` 和适配器：\n\n```java\nimport androidx.recyclerview.widget.LinearLayoutManager;\n\
  \nprivate void recyclerSetup() {\n    adapter = new ProductListAdapter(R.layout.product_list_item);\n\
  \    binding.productRecycler.setLayoutManager(new LinearLayoutManager(getContext()));\n\
  \    binding.productRecycler.setAdapter(adapter);\n}\n```\n\n### 67.14 测试 RoomDemo\
  \ 应用\n\n编译并在设备或模拟器上运行应用，添加一些商品并确保它们自动出现在 `RecyclerView` 中。对现有商品进行搜索，并验证商品 ID 和数量字段是否相应更新。最后，输入一个现有商品的名称，从数据库中删除它，并确认它已从\
  \ `RecyclerView` 商品列表中移除。\n\n### 67.15 使用数据库检查器\n\n\n\n\n\n正如之前在“Android Room Persistence\
  \ Library”中概述的那样，可以使用 `Database Inspector` 工具检查与运行中的应用程序相关的 Room 数据库的内容，并进行细微的数据更改。在使用\
  \ `RoomDemo` 应用添加一些数据库记录后，通过 `View -> Tool Windows -> App Inspection` 菜单显示 `Database\
  \ Inspector` 工具：\n\n在检查器窗口中，从下方图 67-3 中标记为 A 的菜单中选择正在运行的应用程序：\n\n![](img/as_database_inspector.jpg)\n\
  \n图 67-3\n\n在 Databases 面板 (B) 中，双击 `products` 表格，以查看当前存储在数据库中的表行。启用 `Live updates`\
  \ 选项 (C)，然后使用运行的应用程序向数据库添加更多记录。请注意，`Database Inspector` 会实时更新表数据 (D) 以反映更改。\n\n\
  关闭 `Live updates` 以便表不再是只读状态，双击表行的 `quantity` 单元格，并在按下键盘 Enter 键之前更改值。返回运行的应用程序并搜索该产品，以确认检查器中对\
  \ `quantity` 进行的更改已保存到数据库表中。\n\n最后，点击表查询按钮（如下方图 67-4 中的箭头所示）以显示新的查询标签页 (A)，确保选择了\
  \ `product_database` (B)，并在查询文本字段 (C) 中输入 SQL 语句，然后点击 `Run` 按钮 (D)：\n\n![](img/as_database_inspector_query.jpg)\n\
  \n图 67-4\n\n行列表应该会更新，以反映 SQL 查询的结果 (E)。\n\n### 67.16 总结\n\n本章已演示了如何使用 Room 持久化库在\
  \ SQLite 数据库中存储数据。完成的项目使用了存储库（repository）将 `ViewModel` 与所有数据库操作分离，并演示了实体、`DAO` 和\
  \ Room 数据库实例的创建，包括在执行某些数据库操作时使用异步任务。\n\n## 68. 使用 Android Storage Access Framework\
  \ 访问云存储\n\n近年来，远程存储服务（也称为“云存储”）被广泛用于存储用户文件和数据。驱动这一增长的有两个关键因素：第一，大多数移动设备现在都提供持续、高速的互联网连接，从而使得数据传输既快速又便宜。第二个因素是，与传统的计算机系统（如台式机和笔记本电脑）相比，这些移动设备在内部存储资源受到限制。例如，今天一台高配\
  \ Android 平板通常具有 128Gb 的存储容量。与配备 750Gb 硬盘驱动器的中端笔记本系统相比，对文件无缝远程存储的需求是今天许多移动应用程序的关键需求。\n\
  \n考虑到这一事实，Google 在 Android 4.4 SDK 中引入了 `Storage Access Framework`。本章将提供存储访问框架的高级概述，为下一章中更详细的教程做准备，该章节标题为“An\
  \ Storage Access Framework Example”。\n\n### 68.1 Storage Access Framework\n\n从用户的角度来看，`Storage\
  \ Access Framework` 提供了一个直观的用户界面，允许用户在 Android 应用程序内部浏览、选择、删除和创建存储服务（也称为文档提供者）托管的文件。通过使用此浏览界面（也称为选择器），用户可以浏览他们所选文档提供者托管的文件（如文档、音频、图像和视频）。例如，图\
  \ 68-1 显示了选择器界面显示由文档提供者服务托管的文件集合：\n\n![](img/as3.0_storage_demo_picker.jpg)\n\n\
  图 68-1\n\n文档提供者可以从云端服务到运行在与客户端应用程序同一设备上的本地文档提供者不等。在编写时，兼容 `Storage Access Framework`\
  \ 的最著名的文档提供者是 Box，意料之中，还有 Google Drive。其他云存储提供者和应用程序开发者很快也会提供符合 Android Storage\
  \ Access Framework 的服务。\n\n除了云端文档提供者外，选择器还提供了对设备内部存储的访问，为应用程序用户提供一系列文件存储选项。\n\n\
  通过一组 `Intents`，Android 应用程序开发者只需几行代码即可将这些存储功能集成到应用程序中。从开发者的角度来看，`Storage Access\
  \ Framework` 特别吸引人的方面是，用户选择的底层文档提供者对应用程序完全透明的。一旦在应用程序中使用该框架实现了存储功能，它将可以在不修改代码的情况下与所有文档提供者协同工作。\n\
  \n### 68.2 使用 Storage Access Framework 工作\n\nAndroid 包含一组 `Intents`，旨在将 `Storage\
  \ Access Framework` 的功能集成到 Android 应用程序中。这些 intent 向用户显示 `Storage Access Framework`\
  \ 选择器界面，并通过调用启动 intent 的 activity 的 `onActivityResult()` 方法将交互结果返回给应用程序。当调用 `onActivityResult()`\
  \ 方法时，它将把所选文件的 `Uri` 以及一个指示操作成功与否的值传递给它。\n\n`Storage Access Framework` intents 可以总结如下：\n\
  \n- `ACTION_OPEN_DOCUMENT` – 为用户提供访问选择器界面的权限，以便从配置的文档提供者中选择文件。所选的文件以 `Uri` 对象的形式返回给应用程序。\n\
  - `ACTION_CREATE_DOCUMENT` – 允许用户选择文档提供者、提供者的存储位置以及新文件的文件名。一旦选择，文件将由 `Storage Access\
  \ Framework` 创建并将文件的 `Uri` 返回给应用程序进行进一步处理。\n\n### 68.3 过滤选择器文件列表\n\n在启动 intent 时，选择器用户界面中列出的文件可以使用各种选项进行过滤。例如，考虑以下用于配置\
  \ `ACTION_OPEN_DOCUMENT` intent 的代码：\n\n```\nIntent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);\n\
  ```\n\n启动后，上述 intent 将显示选择器用户界面，允许用户浏览并选择可用文档提供者托管的文件。一旦用户选择了文件，该文件的引用将以 `Uri` 对象的形式提供给应用程序。应用程序可以使用\
  \ `openFileDescriptor(Uri, String)` 方法打开文件。然而，存在某种风险，并非文档提供者列出的所有文件都可以以这种方式打开。通过使用\
  \ `CATEGORY_OPENABLE` 选项修改 intent，可以在选择器中排除此类文件。例如：\n\n```\nIntent intent = new\
  \ Intent(Intent.ACTION_OPEN_DOCUMENT);\nintent.addCategory(Intent.CATEGORY_OPENABLE);\n\
  ```\n\n现在显示 intent 时，无法使用 `openFileDescriptor()` 方法的文件将列出，但用户无法选择。\n\n\n\n\n另一种实用的过滤方法允许根据文件类型限制可选择的文件。这涉及到指定应用程序能够处理的文件类型。例如，一个图像编辑应用程序可能只想为用户提供从文档提供者中选择图像文件的选项。这是通过配置\
  \ `intent` 对象并指定供用户可选的文件的 MIME 类型来实现的。例如，以下代码指定了在选择器中仅图像文件适合选择：\n\n```\nintent.addCategory(Intent.CATEGORY_OPENABLE);\n\
  intent.setType(\"image/*\");\n```\n\n这可以进一步细化以将选择限制为 JPEG 图像：\n\n```\nintent.setType(\"\
  image/jpeg\");\n```\n\n或者，音频播放器应用可能只能处理音频文件：\n\n```\nintent.setType(\"audio/*\"\
  );\n```\n\n该音频应用可能会被进一步限制为仅支持播放基于 MP4 格式的音频文件：\n\n```\nintent.setType(\"audio/mp4\"\
  );\n```\n\n在与存储访问框架（Storage Access Framework）一起工作时，有广泛的 MIME 类型设置可供使用，更常见的可以在网上找到列表：\n\
  \nhttps://en.wikipedia.org/wiki/Internet_media_type#List_of_common_media_types\n\
  \n### 68.4 处理 Intent 结果\n\n由于我们启动了将返回结果的 intent，需要使用 `registerForActivityResult()`\
  \ 方法（在“Android Explicit Intents – 实例示例”,\n    new ActivityResultCallback<ActivityResult>()\
  \ {\n        @Override\n        public void onActivityResult(ActivityResult result)\
  \ {\n            if (result.getResultCode() == Activity.RESULT_OK) {\n         \
  \       Intent data = result.getData();\n                // 在此处从 Uri 读取文件内容\n  \
  \          }\n        }\n    });\n```\n\n一旦声明，就可以如下所示配置并启动 `intent`：\n\n```\nIntent\
  \ intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);\nintent.addCategory(Intent.CATEGORY_OPENABLE);\n\
  intent.setType(\"text/plain\");\nstartOpenForResult.launch(intent);\n```\n\n###\
  \ 68.5 读取文件内容\n\n读取由文档提供者托管的文件内容所需的具体步骤在很大程度上取决于文件的类型。例如，从文本文件中读取行的步骤与图像或音频文件的读取步骤不同。\n\
  \n可以通过从 `Uri` 对象中提取文件描述符，然后将图像解码为 `BitmapFactory` 实例，并将图像文件分配给 `Bitmap` 对象。例如：\n\
  \n```\nParcelFileDescriptor pFileDescriptor =\n    getContentResolver().openFileDescriptor(uri,\
  \ \"r\");\nFileDescriptor fileDescriptor =\n    pFileDescriptor.getFileDescriptor();\n\
  Bitmap image = BitmapFactory.decodeFileDescriptor(fileDescriptor);\npFileDescriptor.close();\n\
  myImageView.setImageBitmap(image);\n```\n\n注意，文件描述符是以“r”模式打开的。这表示该文件将用于读取。其他选项包括用于写访问的“w”和用于读写写访问的“rwt”，其中文件中的现有内容将被新内容截断。\n\
  \n读取文本文件的内容需要稍多的工作，并需要使用 `InputStream` 对象。例如，以下代码从文本文件中读取每一行：\n\n```\nInputStream\
  \ inputStream = getContentResolver().openInputStream(uri);\nBufferedReader reader\
  \ = new BufferedReader(new InputStreamReader(\n    inputStream));\nString readline;\n\
  while ((readline = reader.readLine()) != null) {\n    // 对文件中的每一行进行操作\n}\ninputStream.close();\n\
  ```\n\n### 68.6 向文件写入内容\n\n向文档提供者托管的打开文件写入内容与读取类似，但使用的是输出流而不是输入流。例如，以下代码向由指定 `Uri`\
  \ 的存储文件输出流写入文本：\n\n```\ntry {\n    ParcelFileDescriptor pFileDescriptor =\n    \
  \    getContentResolver().openFileDescriptor(uri, \"w\");\n    FileOutputStream\
  \ fileOutputStream = new FileOutputStream(pFileDescriptor.getFileDescriptor());\n\
  \    String textContent = \"Some text\";\n    fileOutputStream.write(textContent.getBytes());\n\
  \    fileOutputStream.close();\n    pFileDescriptor.close();\n} catch (FileNotFoundException\
  \ e) {\n    e.printStackTrace();\n} catch (IOException e) {\n    e.printStackTrace();\n\
  }\n```\n\n首先，从 `Uri` 中提取文件描述符，这次用于获取输出流的引用。然后，将内容（在本例中为某些文本）在文件描述符和输出流关闭之前写入输出流。\n\
  \n### 68.7 删除文件\n\n是否可以从存储器中删除文件取决于文件提供者是否支持删除。假设允许删除，则可以在指定的 `Uri` 上执行：\n\n```\n\
  if (DocumentsContract.deleteDocument(getContentResolver(), uri)) {\n    // 删除成功\n\
  } else {\n    // 删除失败\n}\n```\n\n### 68.8 获取对文件的持久访问权限\n\n当应用程序通过存储访问框架获取文件的访问权限时，该权限将一直有效，直到运行应用程序的\
  \ Android 设备重启。通过“获取” `Uri` 的必要权限，可以获得特定文件的持久访问权限。例如，以下代码为 `fileUri` 所引的文件持久化了读写权限：\n\
  \n```java\nint takeFlags = intent.getFlags()\n    & (Intent.FLAG_GRANT_READ_PERMISSION\
  \ | Intent.FLAG_GRANT_WRITE_PERMISSION);\ngetContentResolver().takePersistableUriPermission(fileUri,\
  \ takeFlags);\n```\n\n一旦应用程序获取了文件的权限并保存了 `Uri`，用户在设备重启后应能够继续访问该文件，而无需从选择器界面重新选择文件。\n\
  \n如果在任何时间不再需要持久权限，可以通过调用 content resolver 的 `releasePersistableUriPermission()`\
  \ 方法来释放它们：\n\n```java\nint releaseFlags = intent.getFlags()\n    & (Intent.FLAG_GRANT_READ_PERMISSION\
  \ | Intent.FLAG_GRANT_WRITE_PERMISSION);\ngetContentResolver().releasePersistableUriPermission(fileUri,\
  \ releaseFlags);\n```\n\n### 68.9 总结\n\n思考几年来对存储的感知是如何变化的很有意义。“存储”一词曾与高容量内置硬盘等同，而现在这个词同样可能指的是通过互联网连接访问的托管在云端的远程存储空间。随着内置存储容量资源受限且“始终在线”移动设备的广泛采用，这种情况已日益普遍。\n\
  \n## 69. 一个 Android 存储访问框架示例\n\n\n\n\n如前所述，存储访问框架（Storage Access Framework）极大简化了将云存储访问集成到\
  \ Android 应用程序的过程中。通过包含一个选择器用户界面和一组新的 Intent，现在可以相对地在 Android 应用程序中构建对 Google Drive\
  \ 和 Box 等文档提供程序上存储的文件访问。在上一章介绍了 Android 存储访问框架的基础知识后，本章将通过创建一个示例应用程序，该程序使用存储访问框架来存储和管理文件。\n\
  \n# 69.1 关于存储访问框架示例\n\n在本章中创建的 Android 应用程序将作为一个基础文本编辑器，旨在将文本文件远程创建并存储到云存储服务中。在实践中，该示例适用于任何兼容存储访问框架的云文档存储提供程序，但为了本示例的目的，假设使用了\
  \ Google Drive。\n\n从功能角度来看，该应用程序将为用户提供一个多行文本视图，可以在其中输入和编辑文本，并带一组按钮，允许创建、打开和保存基于存储的文本文件。\n\
  \n# 69.2 创建存储访问框架示例\n\n从欢迎界面选择“New Project”（新建项目）选项，在弹出的新项目对话框中，点击“Next”（下一步）按钮之前选择“Empty\
  \ Activity”模板。\n\n在`Name`字段中输入 `StorageDemo`，并指定 `com.ebookfrenzy.storagedemo` 为包名。在点击“Finish”（完成）按钮之前，将\
  \ Minimum API level 设置为 `API 26: Android 8.0 (Oreo)`，并将语言菜单更改为 `Java`。按照[11.8 Migrating\
  \ a Project to View Binding] 节中的常规步骤为项目添加 view binding 支持。\n\n### 69.3 设计用户界面\n\n\
  用户界面将需要由三个 Button 视图和一个 EditText 视图组成。在 Project 工具窗口中，导航到位于 `app -> res -> layout`\
  \ 的 `activity_main.xml` 布局文件，并双击将其加载到 Layout Editor 工具中。在工具的设计（Design）模式下，选择并删除\
  \ Hello World! TextView 对象。\n\n在布局的左上角拖动并放置 Button 控件，以便在放置组件之前显示左侧和顶部的虚线边距指南线（margin\
  \ guidelines）。放置第二个 Button，使中心和顶部的边距指南线出现。第三个 Button 组件应被放置，使得顶部和右侧的边距指南线出现。\n\n\
  将三个按钮的文本属性分别更改为“New”、“Open”和“Save”。接下来，放置一个 Plain Text 控件，使其水平居中并位于中心按钮下方，以便用户界面布局与[图\
  \ 69-1]所示所示匹配。使用 Layout Editor 工具栏中的“Infer Constraints”（推断约束）按钮添加任何缺失的约束。\n\n选择布局中的\
  \ Plain Text 控件，删除当前的文本属性设置（该字段最初为空），并将 ID 设置为 `fileText`。接下来，将字符串属性提取为命名为 `string`、`open_string`\
  \ 和 `save_string` 的资源值。\n\n![](img/as_4.1_storage_demo_ui.jpg)\n\n图 69-1\n\n使用 Attributes\
  \ 工具窗口，配置 Button 控件上的 `onClick` 属性，分别调用名为 `newFile`、`openFile` 和 `saveFile` 方法。\n\
  \n# 69.4 添加 Activity 启动器\n\n按照[Android Explicit Intents – A Worked Example] 章节概述的步骤，我们需要开始注册\
  \ activity 启动器以处理文件内容的创建、打开和保存。在 `MainActivity.java` 文件中，如下所示为三个操作中的每个操作添加一个启动器：\n\
  \n```java\nimport androidx.activity.result.ActivityResult;\nimport androidx.activity.result.ActivityResultCallback;\n\
  import androidx.activity.result.ActivityResultLauncher;\nimport androidx.activity.result.contract.ActivityResultContracts;\n\
  import android.app.Activity;\nimport android.content.Intent;\nimport android.net.Uri;\n\
  import java.io.IOException;\n\nActivityResultLauncher<Intent> startOpenForResult\
  \ =\n    registerForActivityResult(\n        new ActivityResultContracts.StartActivityForResult(),\n\
  \        new ActivityResultCallback<ActivityResult>() {\n            @Override\n\
  \            public void onActivityResult(ActivityResult result) {\n           \
  \     if (result.getResultCode() == Activity.RESULT_OK) {\n                    Intent\
  \ data = result.getData();\n                    if (data != null) {\n          \
  \              Uri currentUri = data.getData();\n                        try {\n\
  \                            String content = readFileContent(currentUri);\n   \
  \                         binding.fileText.setText(content);\n                 \
  \       } catch (IOException e) {\n                            // Handle here\n\
  \                        }\n                    }\n                }\n         \
  \   }\n        });\n\nActivityResultLauncher<Intent> startSaveForResult =\n    registerForActivityResult(\n\
  \        new ActivityResultContracts.StartActivityForResult(),\n        result ->\
  \ {\n            if (result.getResultCode() == Activity.RESULT_OK) {\n         \
  \       Intent data = result.getData();\n                if (data != null) {\n \
  \                   Uri currentUri = data.getData();\n                    try {\n\
  \                        writeFileContent(currentUri);\n                    } catch\
  \ (IOException e) {\n                        // Handle here\n                  \
  \  }\n                }\n            }\n        });\n\nActivityResultLauncher<Intent>\
  \ startCreateForResult =\n    registerForActivityResult(\n        new ActivityResultContracts.StartActivityForResult(),\n\
  \        new ActivityResultCallback<ActivityResult>() {\n            @Override\n\
  \            public void onActivityResult(ActivityResult result) {\n           \
  \     if (result.getResultCode() == Activity.RESULT_OK) {\n                    Intent\
  \ data = result.getData();\n                    if (data != null) {\n          \
  \              binding.fileText.setText(\"\");\n                    }\n        \
  \        }\n            }\n        });\n```\n\n### 69.5 创建新的存储文件\n\n当选择 New 按钮时，应用程序需要触发\
  \ `ACTION_CREATE_DOCUMENT` Intent 来创建一个纯文本 MIME 类型的文件。在设计用户界面时，New 按钮被配置为调用名为 `newFile()`\
  \ 的方法。需要在该方法内部启动相应的 Intent。\n\n在 `MainActivity.java` 文件中，如下实现此方法：\n\n```java\npackage\
  \ com.ebookfrenzy.storagedemo;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n\n    public void newFile(View view) {\n        Intent intent = new Intent(Intent.ACTION_CREATE_DOCUMENT);\n\
  \        intent.addCategory(Intent.CATEGORY_OPENABLE);\n        intent.setType(\"\
  text/plain\");\n        intent.putExtra(Intent.EXTRA_TITLE, \"newfile.txt\");\n\
  \        startCreateForResult.launch(intent);\n    }\n}\n```\n\n此代码创建了一个新的 `ACTION_CREATE_DOCUMENT`\
  \ Intent 对象。然后对该 Intent 进行配置，使其仅返回可以通过文件描述打开的文件（通过 `Intent.CATEGORY_OPENABLE` 类别设置）。\n\
  \n接下来，代码指定要打开的文件具有纯文本 MIME 类型，并提供了一个占位文件名（用户可以在选择器界面中更改它）。\n\n\n\n\n\n当此方法执行且 intent\
  \ 已完成分配的任务时，将调用 `startCreateForResult()` lambda 表达式并传递新创建文档的 `Uri`。\n\n### 69.6\
  \ 保存到存储文件\n\n现在应用程序能够创建新的存储基于文件，下一步是添加将用户输入的任何文本保存到文件的功能。用户界面已配置为当用户选择保存（Save）按钮时调用\
  \ `saveFile()` 方法。该方法将负责启动一个类型为 `ACTION_OPEN_DOCUMENT` 的新 intent，这将显示选择器用户界面，使用户可以选择用于存储文本的文件。由于我们只处理纯文本文件，因此需要配置\
  \ intent，以将用户的选择选项限制为匹配 `text/plain` MIME 类型的现有文件。在确定了 `saveFile()` 方法要执行的操作后，现在可以将其添加到\
  \ `MainActivity.java` 类文件中，如下：\n\n```java\npublic void saveFile(View view)\n{\n\
  \    Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);\n    intent.addCategory(Intent.CATEGORY_OPENABLE);\n\
  \    intent.setType(\"text/plain\");\n    startSaveForResult.launch(intent);\n}\n\
  ```\n\n分配给 `startSaveForResult()` 的 lambda 调用一个名为 `writeFileContent()` 的方法，传递要写入文本的文件的\
  \ `Uri`。在 `MainActivity.java` 文件中，现在实现此方法，使其读取内容如下：\n\n```java\npackage com.ebookfrenzy.storagedemo;\n\
  \nimport java.io.FileOutputStream;\nimport android.os.ParcelFileDescriptor;\n\n\
  public class MainActivity extends AppCompatActivity {\n\n.\n.\n\n    private void\
  \ writeFileContent(Uri uri) throws IOException\n    {\n        try{\n          \
  \  ParcelFileDescriptor pfd =\n                    this.getContentResolver().\n\
  \                    openFileDescriptor(uri, \"w\");\n            FileOutputStream\
  \ fileOutputStream =\n                    new FileOutputStream(\n              \
  \              pfd.getFileDescriptor());\n            String textContent =\n   \
  \                 binding.fileText.getText().toString();\n            fileOutputStream.write(textContent.getBytes());\n\
  \            fileOutputStream.close();\n            pfd.close();\n        } catch\
  \ (IOException e) {\n            e.printStackTrace();\n        }\n    }\n.\n.\n\
  }\n```\n\n该方法首先从用户选择的文件的 `Uri` 获取并打开文件描述符。由于代码需要写入文件，因此以写入模式（`w`）打开描述符。然后使用该文件描述符作为创建输出流的基础，以便应用程序能够写入文件。用户输入的文本从编辑对象中提取，并在文件描述符和流关闭之前写入输出流。此外还添加了代码以处理在文件写入过程中遇到的任何异常。\n\
  \n## 69.7 打开并读取存储文件\n\n编写完创建和保存文件的代码后，最后的任务是添加一些从存储中打开和读取文件的功能。这将涉及编写 `openFile()`\
  \ 点击事件处理程序并实现它，使其启动 `ACTION_OPEN_DOCUMENT` intent：\n\n```java\npublic void openFile(View\
  \ view)\n{\n    Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);\n    intent.addCategory(Intent.CATEGORY_OPENABLE);\n\
  \    intent.setType(\"text/plain\");\n    startSaveForResult.launch(intent);\n}\n\
  ```\n\n下一个任务是实现由 `startSaveForResult()` lambda 用的 `readFileContent()` 方法：\n\n```java\n\
  package com.ebookfrenzy.storagedemo;\n\n.\nimport java.io.BufferedReader;\nimport\
  \ java.io.InputStream;\nimport java.io.InputStreamReader;\n\n.\npublic class MainActivity\
  \ extends AppCompatActivity {\n.\n.\n\n    private String readFileContent(Uri uri)\
  \ throws IOException {\n        InputStream inputStream =\n                getContentResolver().openInputStream(uri);\n\
  \        BufferedReader reader = \n                new BufferedReader(new InputStreamReader(inputStream));\n\
  \        StringBuilder stringBuilder = new StringBuilder();\n        String currentline;\n\
  \        while ((currentline = reader.readLine()) != null) {\n            stringBuilder.append(currentline).append(\"\
  \\n\");\n        }\n        inputStream.close();\n        return stringBuilder.toString();\n\
  \    }\n.\n.\n}\n```\n\n该方法首先提取所选文本文件的文件描述符并将其打开读取。然后打开与 `Uri` 关联的输入流，并将其作为 `BufferedReader`\
  \ 实例的输入源。读取文件中的每一行并存储在 `StringBuilder` 对象中。一旦读取了所有行，输入流和文件描述符都将被关闭，文件内容作为 `String`\
  \ 对象返回。\n\n## 69.8 测试存储访问应用程序\n\n编码阶段完成后，应用程序已准备好进行测试。编译并运行应用程序，点击新建（New）按钮。Storage\
  \ Access Framework 随后应显示如 图 69-3 所示的下载用户界面：\n\n![](img/as_3.5_storage_downloads_screen.jpg)\n\
  图 69-2\n\n点击上方高亮的菜单按钮并选择 Drive 选项，然后选择我的云端硬盘（My Drive），并导航到 Google Drive 存储中的合适位置以保存文件。在选择器界面底部的文本字段中，在选择保存（Save）选项之前，将名称从“newfile.txt”更改为合适的名称（但保留\
  \ `.txt` 扩展名）。\n\n![](img/as_3.5_storage_destination_.jpg)\n图 69-3\n\n创建新文件后，应用程序应返回主活动，通知面板可能会出现“已上传\
  \ 1 个文件”的通知。\n\n![](img/as_3.5_storage_upload_notification.jpg)\n图 69-4\n\n此时，可以在浏览器窗口中登录您的\
  \ Google Drive 账户，并在请求的位置找到新创建的文件。如果文件丢失，请确保运行应用程序的 Android 设备已连接到网络。\n\n### 69.9\
  \ 总结\n\n本章通过创建一个示例 Android Studio 应用程序，该程序是一个非常基础的文本编辑器，设计用于使用云存储通过 Android Storage\
  \ Access Framework 创建、保存和打开文件。\n\n## 70\\. 使用 VideoView 和 MediaController 类在 Android\
  \ 上进行视频播放\n\n\n\n\n\n智能手机和平板电脑的主要用途之一是访问在线内容。一种被广泛使用的内容形式（特别是在平板设备上）是视频。\n\n`Android\
  \ SDK` 包含了两个类，它们使得在开发应用程序时，在 Android 设备上实现视频播放变得极其简单。本章将在介绍视频播放应用的创建之前，先对这两个类——`VideoView`\
  \ 和 `MediaController` 进行概述。\n\n## 70.1 介绍 Android VideoView 类\n\n到目前为止，在 Android\
  \ 应用中显示视频最简单的方法是使用 `VideoView` 类。这是一个视觉组件，当它添加到 `activity` 的布局中时，会提供一个可以播放视频的表面。Android\
  \ 目前支持以下视频格式：\n\n• H.263\n• H.264 AVC\n• H.265 HEVC\n• MPEG-4 SP\n• VP8\n• VP9\n\
  \n`VideoView` 类拥有许多可以调用来管理视频播放的方法。以下是一些较常用的方法：\n\n• `setVideoPath(String path)`\
  \ – 指定要播放的视频媒体的路径（字符串形式的）。这既可以是远程视频文件的 URL，也可以是设备本地的视频文件。\n• `setVideoUri(Uri uri)`\
  \ – 执行与 `setVideoPath()` 方法相同的任务，但它接受 `Uri` 对象作为参数而不是字符串。\n• `start()` – 开始视频播放。\n\
  • `stopPlayback()` – 停止视频播放。\n• `pause()` – 暂停视频播放。\n• `isPlaying()` – 返回一个布尔值，表示视频是否正在播放。\n\
  • `setOnPreparedListener(MediaPlayer.OnPreparedListener)` – 在视频准备好播放时调用回调方法。\n•\
  \ `setOnErrorListener(MediaPlayer.OnErrorListener)` - 在视频播放期间发生错误时调用回调方法。\n• `setOnCompletionListener(MediaPlayer.OnCompletionListener)`\
  \ - 在视频结束时调用回调方法。\n• `getDuration()` – 返回视频时长。除非在 `OnPreparedListener()` 回调方法内部调用，否则通常会返回\
  \ -1。\n• `getCurrentPosition()` – 返回表示当前播放位置的整数值。\n• `setMediaController(MediaController)`\
  \ – 指定一个 `MediaController` 实例，允许向用户显示播放控制。\n\n## 70.2 介绍 Android MediaController\
  \ 类\n\n如果仅使用 `VideoView` 类播放视频，用户将无法控制播放，视频将一直运行到结束。这个问题可以通过将 `MediaController`\
  \ 类的实例挂载到 `VideoView` 实例来解决。此时 `MediaController` 将提供一组控制控件，允许用户管理播放（例如暂停以及在视频时间轴上向后/向前快进）。\n\
  \n控制控件的位置通过将控制器实例锚定到用户界面布局中的特定视图来指定。一旦挂载并锚定，控制控件将在播放开始时短暂出现，随后用户可以通过点击锚定该实例的视图在任何时间点重新恢复它们。\n\
  \n该类的一些关键方法如下：\n\n• `setAnchorView(View view)` – 指定控制器要锚定的视图。这确定了控制控件在屏幕上的位置。\n\
  • `show()` – 显示控制控件。\n• `show(int timeout)` – 控制控件显示指定的持续时间（毫秒）内。\n• `hide()` –\
  \ 向用户隐藏控制器。\n• `isShowing()` – 返回一个布尔值，表示控制控件当前对用户是否可见。\n\n## 70.3 创建视频播放示例\n\n\
  本章的剩余部分将创建一个示例应用程序，旨在使用 `VideoView` 和 `MediaController` 类来播放 MPEG-4 视频文件。\n\n从欢迎界面选择\
  \ `New Project` 选项，在出现的新项目对话框中，点击 `Next` 按钮之前选择 `Empty Activity` 模板。\n\n在 `Name`\
  \ 字段中输入 `VideoPlayer` 并指定 `com.ebookfrenzy.videoplayer` 为包名。在点击 `Finish` 按钮之前，将\
  \ `Minimum API level` 设置更改为 `API 26: Android 8.0 (Oreo)`并将 `Language` 菜单设置为 `Java`。使用\
  \ [11.8 Migrating a Project to View Binding] 部分中的步骤为项目启用视图绑定。\n\n## 70.4 设计 VideoPlayer\
  \ 布局\n\n主活动的用户界面将仅由一个 `VideoView` 类的实例组成。使用 `Project` 工具窗口找到 `app -> res -> layout\
  \ -> activity_main.xml` 文件，双击打开它，将 `Layout Editor` 工具切换到 `Design` 模式并删除默认的 `TextView`\
  \ 小部件。\n\n从 `Palette` 面板的 `Widgets` 类别中，将 `VideoView` 实例拖放到布局中，使其如[图 70-1] 所示填充可用画布区域。使用\
  \ `Attributes` 面板，将 `layout_width` 和 `layout_height` 属性分别更改为 `match_constraint`\
  \ 和 `wrap_content`。此外，移除连接 `VideoView` 底到父 `ConstraintLayout` 底部的约束。最后，将组件的 `ID`\
  \ 更改为 `videoView1`。\n\n![](img/as_3.5_videoplayer_ui.jpg)\n\n图 70-1\n\n### 70.5\
  \ 下载视频文件\n\n`VideoPlayer` 应用将播放的视频是一个 MPEG-4 格式的短动画片段。使用浏览器访问以下 URL 播放视频：\n\n[`www.ebookfrenzy.com/android_book/movie.mp4`](https://www.ebookfrenzy.com/android_book/movie.mp4)\n\
  \n留在浏览器中，右键点击视频并选择下载视频，命名为 `movie.mp4`。\n\n在 Android Studio 中，在窗口中找到 `res` 文件夹，右键点击它并选择\
  \ `New -> Directory` 选项，在名称字段中输入 `raw` 然后按 `Return` 键。使用操作系统的文件导航器找到上面的 `movie.mp4`\
  \ 文件并复制它。返回 Android Studio，右键点击新创建的 `raw` 目录并选择 `Paste` 选项将其复制到项目中。添加后，`raw` 文件夹应符合[图\
  \ 70-2]：\n\n![](img/as_3.6_video_player_raw_added.jpg)\n\n图 70-2\n\n### 70.6 配置\
  \ VideoView\n\n下一步是用视频路径配置 VideoView 并开始播放。这将在主活动初始化时执行，因此将 `MainActivity.java`\
  \ 文件加载到编辑器并按照以下列表进行修改：\n\n```java\npackage com.ebookfrenzy.videoplayer;\n\nimport\
  \ androidx.appcompat.app.AppCompatActivity;\nimport android.os.Bundle;\nimport android.net.Uri;\n\
  import android.view.View;\nimport com.ebookfrenzy.videoplayer.databinding.ActivityMainBinding;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private ActivityMainBinding\
  \ binding;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n       \
  \ configureVideoView();\n    }\n\n    private void configureVideoView() {\n    \
  \    binding.videoView1.setVideoURI(Uri.parse(\"android.resource://\" + getPackageName()\
  \ + \"/\" + R.raw.movie));\n        binding.videoView1.start();\n    }\n}\n```\n\
  \n这段代码做的只是获取布局中 `VideoView` 实例的引用，分配一个指向 raw 资源目录中电影文件的 `Uri` 对象，然后开始播放视频。\n\n\n\
  \n\n通过在模拟器或物理 Android 设备上运行来测试该应用程序。应用程序启动后，在视频播放之前之前缓冲视频内容可能会出现短暂的延迟（见图 70-3）。\n\
  \n![](img/as_3.6_video_player_playing.jpg)\n\n图 70-3\n\n这展示了将视频播放集成到 Android 应用程序有多简单。在本示例中，目前为止的所有内容都是通过一个\
  \ `VideoView` 实例和三行代码实现的。\n\n## 70.7 在 Video View 中添加 MediaController\n\n按照目前 `VideoPlayer`\
  \ 应用程序的状态，用户无法控制播放。如之前所述，这可以通过 `MediaController` 类来实现。要为 `VideoView` 添加控制器，请再次修改\
  \ `configureVideoView()` 方法：\n\n```java\npackage com.ebookfrenzy.videoplayer;\n\n\
  .\n\n.\n\nimport android.widget.MediaController;\n\npublic class MainActivity extends\
  \ AppCompatActivity {\n    private ActivityMainBinding binding;\n    private MediaController\
  \ mediaController;\n.\n.\n\n    private void configureVideoView() {\n        binding.videoView1.setVideoURI(Uri.parse(\"\
  android.resource://\"\n                + getPackageName() + \"/\" + R.raw.movie));\n\
  \        mediaController = new MediaController(this);\n        mediaController.setAnchorView(binding.videoView1);\n\
  \        binding.videoView1.setMediaController(mediaController);\n        binding.videoView.start();\n\
  \    }\n}\n```\n\n当应用这些更改启动应用程序时，点击 `VideoView` 画布将使媒体控件出现在视频播放上层。这些控件应包含一个进度条以及快进、倒退和播放/暂停按钮。当控件从视线中消失后，可以随时再次点击\
  \ `VideoView` 画布来恢复。只需多加三行代码，我们的视频播放器应用程序现在就拥有了如图 70-4 所示的媒体控件：\n\n![](img/as_3.6_video_player_media_controls.jpg)\n\
  \n图 70-4\n\n### 70.8 设置 onPreparedListener\n\n作为处理视频媒体的最后一个示例，该活动现在将进一步扩展，以演示配置监听器的机制。在这种情况下，将实现一个监听器，用于将视频时长作为消息输出到\
  \ Android Studio Logcat 面板。该监听器还将配置视频播放为持续循环：\n\n```java\npackage com.ebookfrenzy.videoplayer;\n\
  \n...\n\nimport android.util.Log;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private ActivityMainBinding binding;\n    private MediaController mediaController;\n\
  \    String TAG = \"VideoPlayer\";\n\n    private void configureVideoView() {\n\
  \        binding.videoView1.setVideoURI(Uri.parse(\"android.resource://\"\n    \
  \            + getPackageName() + \"/\" + R.raw.movie));\n        MediaController\
  \ mediaController = new\n                    MediaController(this);\n        mediaController.setAnchorView(binding.videoView1);\n\
  \        binding.videoView1.setMediaController(mediaController);\n        binding.videoView1.setOnPreparedListener(mp\
  \ -> {\n            mp.setLooping(true);\n            Log.i(TAG, \"Duration = \"\
  \ +\n                    binding.videoView1.getDuration());\n        });\n     \
  \   binding.videoView.start();\n    }\n}\n```\n\n现在，在视频播放开始之前，Android Studio Logcat\
  \ 面板中会出现一条如下所示的消息，并且视频将在播放结束后重启：\n\n`2022-12-13 16:41:42.867 5723-5723 VideoPlayer\
  \ com.ebookfrenzy.videoview I Duration = 13504`\n\n### 70.9 总结\n\nAndroid 设备是向用户传递内容的极佳平台，特别是视频媒体形式。如本章所述，Android\
  \ SDK 提供了两个类，即 `VideoView` 和 `MediaController`，它们结合使得将视频播放集成到 Android 应用程序中变得快速简单，通常只需要几行\
  \ Java 代码。\n\n## 71. Android 画中画模式 (Picture-in-Picture Mode)\n\n在之前的章节中介绍 Android\
  \ 的多任务处理时，曾简要提到了画中画（PiP）模式，但没有进行任何详细介绍。PiP 模式主要为视频播放设计，它允许活动窗口缩小尺寸并放置在屏幕上的任何位置。在此状态下，活动继续运行，且无论设备上运行任何其他活动，窗口都保持可见。这允许用户例如在执行检查电子邮件或处理电子表格等任务的同时继续观看视频播放。\n\
  \n在本章将在为 `VideoPlayer` 添加画中画支持之前，将提供画中画模式的概述。\n\n### 71.1 画中画功能\n\n正如章节后半部分将解释的，通过\
  \ API 调用可以将活动放入 PiP 模式。例如，图 71-1 显示了处于 PiP 模式下的视频播放活动：\n\n![](img/2473.jpg)\n\n\
  图 71-1\n\n图 71-2 显示了点击后的 PiP 窗口。在此模式下，窗口会变得更大，并在右上角包含一个退出按钮，用于关闭窗口并将应用置于后台。添加到 PiP\
  \ 窗口的自定义操作出现在屏幕上：\n\n![](img/2463.jpg)\n\n图 71-2\n\n本章剩余部分将概述如何在 Android 内部启用 PiP\
  \ 模式。\n\n### 71.2 启用画中画模式\n\nPiP 模式目前仅支持运行 API 26：Android 8.0 (Oreo) 或更高版本的设备。实现\
  \ PiP 模式的第一步是在项目文件中启用它。通过为每个需要 PiP 支持的活动添加以下行，可以按活动配置 PiP 模式：\n\n```xml\n<activity\
  \ android:name=\".MyActivity\"\n    android:supportsPictureInPicture=\"true\"\n\
  \    android:configChanges=\"screenSize|smallestScreenSize|screenLayout|orientation\"\
  >\n    <intent-filter>\n        <action android:name=\"android.intent.action.MAIN\"\
  \ />\n        <category android:name=\"android.intent.category.LAUNCHER\" />\n \
  \   </intent-filter>\n</activity>\n```\n\n`android:supportsPictureInPicture` 启用了活动的\
  \ PiP，而 `configChanges` 属性 通知 Android 活动能够处理布局更改。如果没有此设置，每当活动进入或退出 PiP 模式时，活动都会重启，导致视频在切换期间从头开始。\n\
  \n### 71.3 配置画中画参数\n\nPiP 行为通过使用 `PictureInPictureParams` 类来定义，可以使用 `Builder` 类按如下方式创建实例：\n\
  \n```java\nPictureInPictureParams params = new PictureInPictureParams.Builder().build();\n\
  ```\n\n上述代码创建了一个带有特殊参数的默认 `PictureInPictureParams` 实例。可以使用以下可选方法调用来自定义参数：\n\n- `setActions()`：用于定义在活动处于\
  \ PiP 模式时从 PiP 窗口内执行的操作。操作将在本章后半部分进行详细介绍。\n\n\n\n\n* `setAspectRatio()` – 声明 PiP\
  \ 窗口显示的默认宽高比。此方法接收一个 `Rational` 对象作为参数，该对象包含高度除以宽度的比例。\n* `setSourceRectHint()`\
  \ – 接收一个 `Rect` 对象作为参数，定义在 PiP 窗口内显示的活动屏幕区域。\n\n例如，以下代码在 `PictureInPictureParams`\
  \ 对象中配置了宽高比和操作参数。在宽高比方面，它是使用 `VideoView` 实例的宽度和高度维度定义的：\n\n```java\nRational rational\
  \ = new Rational(videoView.getWidth(),\n                               videoView.getHeight());\n\
  PictureInPictureParams params =\n    new PictureInPictureParams.Builder()\n    \
  \          .setAspectRatio(rational)\n              .setActions(actions)\n     \
  \         .build();\n```\n\n一旦定义，可以使用 `setPictureInPictureParams()` 方法随时设置 `PiP`\
  \ 参数，如下：\n\n```java\nsetPictureInPictureParams(params);\n```\n\n在进入 PiP 模式时也可以指定参数。\n\
  \n## 71.4 进入画中画模式\n\n通过调用 `enterPictureInPictureMode()` 方法并传递 `PictureInPictureParams`\
  \ 对象，可以将活动放入画中画模式：\n\n```java\nenterPictureInPictureMode(params);\n```\n\n如果不需要参数，只需按照上一节所述创建一个默认的\
  \ `PictureInPictureParams` 对象即可。如果之前已使用 `setPictureInPictureParams()` 方法设置了参数，则这些参数将与\
  \ `enterPictureInPictureMode()` 方法调用时指定的参数进行合并。\n\n## 71.5 检测画中画模式的变化\n\n当活动进入 PiP\
  \ 模式时，隐藏任何不必要的视图是非常重要的，这样 PiP 窗口内只显示视频播放。当活动重新进入全屏模式时，需要恢复任何隐藏的 界面组件。可以通过重写 `onPictureInPictureModeChanged()`\
  \ 方法来完成这些以及任何其他特定特定的任务。当该方法被添加到活动时，每当活动在 PiP 和全屏模式之间切换时都会被调用，并传递一个 `Boolean` 值，指示活动当前是否处于\
  \ PiP 模式：\n\n```java\n@Override\npublic void onPictureInPictureModeChanged(\n  \
  \          boolean isInPictureInPictureMode) {\n    super.onPictureInPictureModeChanged(isInPictureInPictureMode);\n\
  \    if (isInPictureInPictureMode) {\n        // Activity 进入画中画模式\n    } else {\n\
  \        // Activity 进入全屏模式\n    }\n}\n```\n\n## 71.6 添加画中画操作\n\n当用户点击 PiP 窗口时，画中画操作将以图标的形式显示出来。实现\
  \ PiP 操作是一个多步骤过程，首先要实现一种让 PiP 窗口通知活动已选择某项操作。这通过在活动中设置广播接收器（broadcast receiver）来实现，然后在\
  \ PiP 操作中创建一个 `pending intent`，该意图随后被配置为广播广播接收器正在监听的意图。当广播接收器由意图触发时，可以使用意图中存储的数据来识别执行的操作，并在活动内采取必要的行动。\n\
  \nPiP 操作使用 `RemoteAction` 实例声明，这些实例使用图标、标题、描述和 `PendingIntent` 对象进行初始化。一旦创建了一个或多个操作，它们就会被添加到\
  \ `ArrayList` 中，并在构建 `PictureInPictureParams` 对象时传递给 `setActions()` 方法。\n\n以下代码段演示了\
  \ `Intent`、`PendingIntent` 和 `RemoteAction` 对象的创建，以及随后应用于活动 PiP 设置的 `PictureInPictureParams`\
  \ 实例：\n\n```java\nfinal ArrayList<RemoteAction> actions = new ArrayList<>();\nIntent\
  \ actionIntent = new Intent(\"MY_PIP_ACTION\");\nfinal PendingIntent pendingIntent\
  \ =\n    PendingIntent.getBroadcast(MyActivity.this,\n                         \
  \      REQUEST_CODE, actionIntent, FLAG_IMMUTABLE);\nfinal Icon icon = Icon.createWithResource(MyActivity.this,\n\
  \                                         R.drawable.action_icon);\nRemoteAction\
  \ remoteAction = new RemoteAction(icon,\n                                      \
  \      \"My Action Title\",\n                                            \"My Action\
  \ Description\",\n                                            pendingIntent);\n\
  actions.add(remoteAction);\nPictureInPictureParams params =\n    new PictureInPictureParams.Builder()\n\
  \              .setActions(actions)\n              .build();\n\nsetPictureInPictureParams(params);\n\
  ```\n\n### 71.7 总结\n\n画中画模式是 Android 8.0 引入的一个功能，旨在允许视频在用户执行其他任务时在小窗口中继续播放。在使用 PiP\
  \ 模式之前，必须先在清单文件中启用它。PiP 行为通过 `PictureInPictureParams` 实例进行配置，并通过调用 `enterPictureInPictureMode()`\
  \ 启动。可以通过重写 `onPictureInPictureModeChanged()` 来检测模式变化。通过广播接收器和意图通知活动操作。\n\n## 72.\
  \ Android 画中画教程\n\n接续前面的章节，本章将采用现有的 VideoPlayer 项目并对其进行增强以添加对画中画的支持，包括检测 PiP 模式变化以及添加用于显示当前正在运行视频信息的\
  \ PiP 操作。\n\n### 72.1 在 Manifest 中添加画中画支持\n\n在 Android 应用中添加 PiP 支持的第一步是在项目 Manifest\
  \ 中启用它。打开 `AndroidManifest.xml` 文件并修改 `activity` 元素以启用 PiP 支持：\n\n```xml\n<activity\
  \ android:name=\".MainActivity\"\n    android:supportsPictureInPicture=\"true\"\n\
  \    android:configChanges=\"screenSize|smallestScreenSize|screenLayout|orientation\"\
  \n    android:exported=\"true\">\n    <intent-filter>\n        <action android:name=\"\
  android.intent.action.MAIN\" />\n        <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n    </intent-filter>\n</activity>\n```\n\n### 72.2 添加画中画按钮\n\n按照目前的设计，VideoPlayer\
  \ 活动的布局仅包含一个 `VideoView` 实例。现在将布局添加一个按钮用于切换到 PiP 模式。加载 `activity_main.xml` 文件到布局编辑器，从调色板拖入\
  \ `Button` 对象到布局中，位置如图 72-1 所示：\n\n![](img/as_4.1_video_plater_pip_ui.jpg)\n图 72-1\n\
  \n更改按钮文本为“Enter PiP Mode”，并将字符串提取为名为 `enter_pip_mode` 的资源。在继续下一步之前，将按钮的 ID 更改为 `pipButton`\
  \ 并配置 `onClick` 属性以调用名为 `enterPipMode` 方法。\n\n### 72.3 进入画中画模式\n\n现在需要将 `enterPipMode`\
  \ `onClick` 回调方法添加到 `MainActivity.java` 类文件中。找到该文件，在代码编辑器中打开并如下添加此方法：\n\n```java\n\
  import android.app.PictureInPictureParams;\nimport android.util.Rational;\n\npublic\
  \ void enterPipMode(View view) {\n    Rational rational = new Rational(binding.videoView1.getWidth(),\n\
  \                               binding.videoView1.getHeight());\n    PictureInPictureParams\
  \ params =\n```\n\n\n\n\n\n```java\nnew PictureInPictureParams.Builder()\n    .setAspectRatio(rational)\n\
  \    .build();\n\nbinding.pipButton.setVisibility(View.INVISIBLE);\nbinding.videoView1.setMediaController(null);\n\
  enterPictureInPictureMode(params);\n```\n\n该方法首先获取 `Button` 视图的引用，然后创建一个包含 `VideoView`\
  \ 宽度和高度的 `Rational` 对象。接着，使用 `PictureInPictureParams` Builder 创建一组画中画（Picture-in-Picture）参数，并将\
  \ `Rational` 对象作为视频播放的宽高比传入。由于视频在画中画（PiP）模式下不需要显示按钮，因此将其设置为不可见。视频播放控件也会从视图中隐藏，以确保视频视图在\
  \ PiP 模式下不会被遮挡。\n\n在运行 Android 版本 8 或更高版本的设备或模拟器上编译并运行应用，在点击 PiP 模式按钮之前等待视频开始播放。视频将缩小并显示在\
  \ PiP 窗口中，如图 72-2 所示：\n\n![](img/as_3.6_video_player_action_bar.jpg)\n\n图 72-2\n\
  \n虽然视频现在 PiP 窗口中播放，但大部分视图被标准的 Android 操作栏（action bar）遮挡了。要移除它需要更改活动的主题样式。在 Android\
  \ Studio 中，找到并编辑 `app -> res -> values -> themes -> themes.xml` 文件，并修改 `AppTheme`\
  \ 元素以 `NoActionBar` 主题：\n\n```xml\n<resources xmlns:tools=\"http://schemas.android.com/tools\"\
  >\n    <!-- Base application theme. -->\n    <style name=\"Theme.VideoPlayer\" parent=\"\
  Theme.MaterialComponents.DayNight.NoActionBar\">\n        <!-- Primary brand color.\
  \ -->\n        <item name=\"colorPrimary\">@color/purple_500</item>\n        <item\
  \ name=\"colorPrimaryVariant\">@color/purple_700</item>\n</style>\n</resources>\n\
  ```\n\n对 `themes.xml (night)` 资源文件重复此步骤。编译并运行应用，将视频播放置于 PiP 模式，注意窗口中不再出现操作栏：\n\n\
  ![](img/as_pip_video_window.jpg)\n\n图 72-3\n\n点击 PiP 窗口，然后点击窗口中心出现的全屏模式标记。尽管活动返回了全屏模式，但请注意按钮和媒体播放控件仍保持隐藏状态。\n\
  \n显然，需要在项目中添加一些代码，以检测活动内部何时发生了 PiP 模式的变化。\n\n## 72.4 检测画中画模式的变化\n\n正如在前一节中所讨论的，PiP\
  \ 模式的变化是通过重写受影响活动中的 `onPictureInPictureModeChanged()` 方法来检测的。在这种情况下，需要编写该方法，能够检测活动是正在进入还是退出\
  \ PiP 模式，并采取适当行动重新激活 PiP 按钮和播放控件。在 `MainActivity.java` 文件中，现在添加此方法：\n\n```java\n\
  @Override\npublic void onPictureInPictureModeChanged(boolean isInPictureInPictureMode)\
  \ {\n    super.onPictureInPictureModeChanged(isInPictureInPictureMode);\n    if\
  \ (isInPictureInPictureMode) {\n    } else {\n        binding.pipButton.setVisibility(View.VISIBLE);\n\
  \        binding.videoView1.setMediaController(mediaController);\n    }\n}\n```\n\
  \n当该方法被调用时，会传入一个 `Boolean` 值，指示活动现在是否处于 PiP 模式。上述方法中的代码只需检查此值，以决定是否显示 PiP 按钮并重新激活播放控件。\n\
  \n### 72.5 添加广播接收器\n\n项目的最后一步是为 PiP 窗口添加一个操作。该操作目的是显示包含当前播放视频名称的 `Toast` 消息。这需要在\
  \ PiP 窗口与活动之间进行通信。实现此点的简单方法之一是在活动内实现一个广播接收器，并使用等待意图从 PiP 窗口向活动广播消息。这些步骤在每次活动进入 PiP\
  \ 模式时都需要执行，因此需要在 `onPictureInPictureModeChanged()` 方法中添加代码。现在找到该方法，并开始添加代码以创建意图过滤器并初始化广播接收器：\n\
  \n```java\nimport android.content.BroadcastReceiver;\nimport android.content.Context;\n\
  import android.content.Intent;\nimport android.content.IntentFilter;\nimport android.widget.Toast;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private BroadcastReceiver\
  \ receiver;\n\n    @Override\n    public void onPictureInPictureModeChanged(boolean\
  \ isInPictureInPictureMode) {\n        super.onPictureInPictureModeChanged(isInPictureInPictureMode);\n\
  \        if (isInPictureInPictureMode) {\n            IntentFilter filter = new\
  \ IntentFilter();\n            filter.addAction(\"com.ebookfrenzy.videoplayer.VIDEO_INFO\"\
  );\n            receiver = new BroadcastReceiver() {\n                @Override\n\
  \                public void onReceive(Context context, Intent intent) {\n     \
  \               Toast.makeText(context, \"Favorite Movie Clips\", Toast.LENGTH_LONG).show();\n\
  \                }\n            };\n            registerReceiver(receiver, filter);\n\
  \        } else {\n            binding.pipButton.setVisibility(View.VISIBLE);\n\
  \            binding.videoView1.setMediaController(mediaController);\n         \
  \   if (receiver != null) {\n                unregisterReceiver(receiver);\n   \
  \         }\n        }\n    }\n}\n```\n\n## 72.6 添加 PiP 操作\n\n实现广播接收器后，下一步是创建一个\
  \ `RemoteAction` 对象，并配置一个图像来表示 PiP 窗口中的操作。为了本示例，将使用名为 `ic_info_24dp.xml` 的图像图标文件。该文件可以在从以下\
  \ URL 下载的源代码包的 `project_icons` 文件夹中找到：https://www.ebookfrenzy.com/retail/eeljava/index.php\n\
  \n找到此图标文件并将其复制粘贴到项目窗口中的 `app -> res -> drawables` 文件夹中：\n\n![](img/Image24491.jpg)\n\
  \n图 72-4\n\n下一步是创建一个将发送给广播接收器的 `Intent`。然后，该意图需要封装在 `PendingIntent` 对象中，以便在用户点击\
  \ PiP 窗口中的操作按钮稍后触发该意图。\n\n编辑 `MainActivity.java` 文件，添加一个方法来创建 `Intent` 和 `PendingIntent`\
  \ 对象，如下：\n\n```java\nimport android.app.PendingIntent;\nimport static android.app.PendingIntent.FLAG_IMMUTABLE;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private static final\
  \ int REQUEST_CODE = 101;\n\n    private void createPipAction() {\n        Intent\
  \ actionIntent = new Intent(\"com.ebookfrenzy.videoplayer.VIDEO_INFO\");\n     \
  \   final PendingIntent pendingIntent = PendingIntent.getBroadcast(MainActivity.this,\
  \ REQUEST_CODE, actionIntent, FLAG_IMMUTABLE);\n    }\n}\n```\n\n现在 `Intent` 对象和包含它的\
  \ `PendingIntent` 实例都已创建，需要创建一个 `RemoteAction` 对象，其中包含显示在 PiP 窗口中的图标以及 `PendingIntent`\
  \ 对象。继续在 `createPipAction()` 方法中，添加如下代码：\n\n```java\nimport android.app.RemoteAction;\n\
  import android.graphics.drawable.Icon;\nimport java.util.ArrayList;\n\nprivate void\
  \ createPipAction() {\n    final ArrayList<RemoteAction> actions = new ArrayList<>();\n\
  \    Intent actionIntent = new Intent(\"com.ebookfrenzy.videoplayer.VIDEO_INFO\"\
  );\n    final PendingIntent pendingIntent = PendingIntent.getBroadcast(MainActivity.this,\n\
  ``` (注：根据上下文添加了 `FLAG_IMMUTABLE`)\n\n\n\n\n```java\nREQUEST_CODE, actionIntent,\
  \ FLAG_IMMUTABLE);\n\nfinal Icon icon =\n        Icon.createWithResource(MainActivity.this,\n\
  \            R.drawable.ic_info_24dp);\n\nRemoteAction remoteAction = new RemoteAction(icon,\
  \ \"Info\",\n        \"Video Info\", pendingIntent);\n\nactions.add(remoteAction);\n\
  }\n```\n\n现在需要创建一个包含该操作的 `PictureInPictureParams` 对象并应用参数，以便该操作显示在 PiP 窗口中：\n\n\
  ```java\nprivate void createPipAction() {\n    final ArrayList<RemoteAction> actions\
  \ = new ArrayList<>();\n    Intent actionIntent =\n            new Intent(\"com.ebookfrenzy.videoplayer.VIDEO_INFO\"\
  );\n    final PendingIntent pendingIntent =\n        PendingIntent.getBroadcast(MainActivity.this,\n\
  \            REQUEST_CODE, actionIntent, FLAG_IMMUTABLE);\n    final Icon icon =\n\
  \            Icon.createWithResource(MainActivity.this,\n                    R.drawable.ic_info_24dp);\n\
  \    RemoteAction remoteAction = new RemoteAction(icon, \"Info\",\n        \"Video\
  \ Info\", pendingIntent);\n    actions.add(remoteAction);\n    PictureInPictureParams\
  \ params =\n            new PictureInPictureParams.Builder()\n                 \
  \   .setActions(actions)\n                    .build();\n    setPictureInPictureParams(params);\n\
  }\n```\n\n在测试操作之前的最后一个任务是在 activity 进入 PiP 模式时调用 `createPipAction()` 方法：\n\n```java\n\
  @Override\npublic void onPictureInPictureModeChanged(boolean isInPictureInPictureMode)\
  \ {\n    super.onPictureInPictureModeChanged(isInPictureInPictureMode);\n.\n.\n\
  \    registerReceiver(receiver, filter);\n    createPipAction();\n} else {\n   \
  \ binding.pipButton.setVisibility(View.VISIBLE);\n    binding.videoView1.setMediaController(mediaController);\n\
  .\n.\n}\n```\n\n## 72.7 测试画中画操作\n\n再次构建并运行应用，并将 activity 置 PiP 模式。点击 PiP 窗口，新的操作按钮将如图\
  \ 72-5 所示所示：\n\n![](img/as_3.6_video_player_action_button.jpg)\n\n图 72-5\n\n点击操作按钮，等待\
  \ Toast 消息出现并显示视频名称：\n\n![](img/as_pip_video_window_toast.jpg)\n\n图 72-6\n\n###\
  \ 72.8 总结\n\n本章演示了如何为 Android Studio 应用项目添加画中画支持，包括启用和进入 PiP 模式以及 PiP 操作的实现。这使用了\
  \ `broadcast receiver`（广播接收器）和 `pending intents`（等待意图）来实现 PiP 窗口与 activity 之间的通信。\n\
  \n## 73. 使用 MediaPlayer 和 MediaRecorder 进行 Android 音频录制和播放\n\n本章将概述 `MediaRecorder`\
  \ 类并解释如何使用该类录制音频或视频。还将涵盖使用 `MediaPlayer` 类播放音频。在介绍基础知识后，将创建一个示例应用来演示这些技术。除了处理音频和视频，本章还将涉及保存文件的主题。\n\
  \n### 73.1 播放音频\n\n`MediaPlayer` 类关联以下方法：\n\n- `create()` – 创建新实例。\n- `setDataSource()`\
  \ – 设置播放的源。\n- `prepare()` – 准备开始媒体文件。\n- `start()` – 开始播放。\n- `pause()` – 暂停播放。\n\
  - `stop()` – 停止播放。\n- `setVolume()` – 接收浮点参数以指定音量。\n- `resume()` – 恢复之前暂停的播放。\n\
  - `reset()` – 重置实例。\n- `release()` – 当播放器不再需要时应调用。\n\n在典型的实现中，应用程序将实例化 `MediaPlayer`，设置源，然后执行\
  \ `prepare()` 并在 `start()`。例如：\n\n```java\nMediaPlayer mediaPlayer = new MediaPlayer();\n\
  mediaPlayer.setDataSource(\"mp3\");\nmediaPlayer.prepare();\nmediaPlayer.start();\n\
  ```\n\n### 73.2 使用 MediaRecorder 录制音频和视频\n\n与音频播放一样，可以使用多种不同的技术进行录制。一种方案是使用 `MediaRecorder`\
  \ 类，与 `MediaPlayer` 类一样，它提供了许多用于录制的方法：\n\n- `setAudioSource()` – 指定要录制的音频源（通常为 `MediaRecorder.AudioSource.MIC`）。\n\
  - `setVideoSource()` – 指定要录制的视频源（例如 `MediaRecorder.VideoSource.CAMERA`）。\n- `setOutputFormat()`\
  \ – 指定录录的音频或视频存储的格式（例如 `MediaRecorder.OutputFormat.AAC_ADTS`）。\n- `setAudioEncoder()`\
  \ – 指定用于录制音频的音频编码器（例如 `MediaRecorder.AudioEncoder.AAC`）。\n- `setOutputFile()` –\
  \ 配置存储录制的音频或视频的文件路径。\n- `prepare()` – 准备 `MediaRecorder` 实例以开始录制。\n- `start()` –\
  \ 开始录制过程。\n- `stop()` – 停止录制过程。\n- `reset()` – 重置录制器。\n- `release()` – 当录制器实例不再需要时应调用。\n\
  \n使用此类的典型实现将设置源、输出、编码格式以及输出文件。然后将调用 `prepare()` 和 `start()` 方法。例如：\n\n```java\n\
  MediaRecorder mediaRecorder = new MediaRecorder();\nmediaRecorder.setAudioSource(MediaRecorder.AudioSource.MIC);\n\
  mediaRecorder.setOutputFormat(MediaRecorder.OutputFormat.AAC_ADTS);\nmediaRecorder.setAudioEncoder(MediaRecorder.AudioEncoder.AAC);\n\
  mediaRecorder.setOutputFile(audioFilePath);\nmediaRecorder.prepare();\nmediaRecorder.start();\n\
  ```\n\n\n\n\n正如“在 Android 中发起运行时权限请求”章节概述的，访问麦克风属于危险权限类别。因此，为了支持 Android 6，在应用程序启动时必须对麦克风访问进行特定请求，相关步骤将在本章后文中介绍。\n\
  \n### 73.3 关于示例项目\n\n本章的剩余部分将通过创建一个示例应用程序，来演示如何使用 `MediaPlayer` 和 `MediaRecorder`\
  \ 类在 Android 设备上实现音频的录制和播放。\n\n在开发使用特定硬件功能的应用程序（例如麦克风）时，在尝试代码尝试访问该功能之前，检查该功能的可用性是非常重要的。因此，在本章创建的应用程序还将包含检测设备是否存在麦克风的代码。\n\
  \n完成后，该应用程序将提供一个非常简单的界面，允许用户录制和播放音频。录制的音频需要存储在设备上的音频文件中。既然如此，本教程还将简要探索使用 `SD Card`\
  \ 存储的机制。\n\n### 73.4 创建 AudioApp 项目\n\n从欢迎界面选择 `New Project` ，在弹出的新项目对话框中选择 `Empty\
  \ Activity` 模板，然后点击 `Next` 按钮。\n\n在 `Name` 字段中输入 `AudioApp`，并指定包名为 `com.ebookfrenzy.audioapp`。在点击\
  \ `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 31`：Android 12.0，并将 `Language` 菜单设置为\
  \ `Java`。按照第 11.8 节“迁移项目到 View Binding”概述的步骤为项目添加  支持。\n\n### 73.5 设计用户界面\n\n创建新项目后，从\
  \ Project 工具窗口选择 `activity_main.xml` 文件，并在 Design 模式下的 Layout Editor 工具中，选择“Hello\
  \ World!” `TextView` 并将其从布局中删除。\n\n将三个 `Button` 视图拖放到布局中。按钮的位置对于本示例并不至关重要，尽管图 73-1\
  \ 显示了使用垂直链的建议布局。\n\n配置按钮以显示为 `Play`、`Record` 和 `Stop` 的字符串资源，并分别为它们分配名为 `playButton`、`recordButton`\
  \ 和 `stopButton` 的视图 ID。\n\n选择 `Play` 按钮，并在 Attributes 面板中配置 `onClick` 属性，以便在用户点击时调用名为\
  \ `playAudio` 的方法。重复这些步骤配置其余按钮，分别调用名为 `recordAudio` 和 `stopAudio` 的方法。\n\n![](img/as_3.5_audioapp_ui.jpg)\n\
  \n图 73-1\n\n### 73.6 检查麦克风可用性\n\n在没有麦克风的设备上尝试录制音频会导致 Android 系统抛出异常。因此，代码在进行此类尝试之前检查麦克风的存在至关重要。有多种方法可以实现，包括检查设备物理是否存在。一种更容易且更可能在不同\
  \ Android 设备上生效的方法是询问 Android 系统是否安装了针对特定功能的包。这涉及创建一个 `Android PackageManager` 类的实例，然后调用对象的\
  \ `hasSystemFeature()` 方法。`PackageManager.FEATURE_MICROPHONE` 是本例中关注的功能。\n\n为了本示例，我们将创建一个名为\
  \ `hasMicrophone()` 的方法，可以通过调用它来检查麦克风的存在。在 Project 工具窗口中，找到并双击 `MainActivity.java`\
  \ 文件并进行修改以添加此方法：\n\n```java\npackage com.ebookfrenzy.audioapp;\n\n.\n.\n\nimport\
  \ android.content.pm.PackageManager;\n\n.\n.\n\npublic class MainActivity extends\
  \ AppCompatActivity {\n.\n.\n    protected boolean hasMicrophone() {\n        PackageManager\
  \ pmanager = this.getPackageManager();\n        return pmanager.hasSystemFeature(\n\
  \                PackageManager.FEATURE_MICROPHONE);\n    }\n}\n```\n\n### 73.7\
  \ 初始化 Activity\n\n下一步是修改 activity 以执行若干初始化任务。在 `MainActivity.java` 文件中，对代码修改如下：\n\
  \n```java\npackage com.ebookfrenzy.audioapp;\n\nimport java.io.File;\nimport java.io.IOException;\n\
  import androidx.annotation.NonNull;\nimport android.media.MediaRecorder;\nimport\
  \ android.os.Environment;\nimport android.media.MediaPlayer; \n.\n.\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n    private ActivityMainBinding binding;\n\
  \    private static MediaRecorder mediaRecorder;\n    private static MediaPlayer\
  \ mediaPlayer;\n    private static String audioFilePath;\n    private boolean isRecording\
  \ = false;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n       \
  \ audioSetup();\n    }\n    private void audioSetup() {\n        if (!hasMicrophone())\
  \ {\n            binding.stopButton.setEnabled(false);\n            binding.playButton.setEnabled(false);\n\
  \            binding.recordButton.setEnabled(false);\n        } else {\n       \
  \     binding.playButton.setEnabled(false);\n            binding.stopButton.setEnabled(false);\n\
  \        }\n        File audioFile = new File(this.getFilesDir(), \"myaudio.3gp\"\
  );\n        audioFilePath = audioFile.getAbsolutePath();\n    }\n.\n}\n```\n\n添加的代码调用\
  \ `hasMicrophone()` 来确定设备是否包含麦克风。如果不包含，则禁用所有按钮；否则只禁用 Stop 和 Play 按钮。下一行代码需要解释：`File\
  \ audioFile = new File(this.getFilesDir(), \"myaudio.3gp\");` 在应用内部存储创建一个名为 `myaudio.3gp`\
  \ 的文件。\n\n### 73.8 实现 recordAudio 方法\n\n当用户触摸 按钮时，将调用 `recordAudio()` 方法。该方法需要启用和禁用相应的按钮，并配置\
  \ `MediaRecorder` 实例的音频源、输出格式以及存储音频的文件位置。最后，需要调用 `MediaRecorder` 对象的 `prepare()`\
  \ 和 `start()` 方法。这些需求在 `MainActivity.java` 中形成了以下方法：\n\n```java\npublic void recordAudio\
  \ (View view)\n{\n    isRecording = true;\n    binding.stopButton.setEnabled(true);\n\
  \    binding.playButton.setEnabled(false);\n    binding.recordButton.setEnabled(false);\n\
  \    try {\n        mediaRecorder = new MediaRecorder(this);\n        mediaRecorder.setAudioSource(MediaRecorder.AudioSource.MIC);\n\
  \        mediaRecorder.setOutputFormat(MediaRecorder.OutputFormat.THREE_GPP);\n\
  \        mediaRecorder.setOutputFile(audioFilePath);\n        mediaRecorder.setAudioEncoder(MediaRecorder.AudioEncoder.AMR_NB);\n\
  \        mediaRecorder.prepare();\n    } catch (Exception e) {\n        e.printStackTrace();\n\
  \    }\n    mediaRecorder.start();\n}\n```\n\n### 73.9 实现 stopAudio 方法\n\n`stopAudio()`\
  \ 方法负责启用 Play 按钮、禁用 Stop 按钮，然后停止并重置 `MediaRecorder` 实例。实现此点的代码如下列表所示，并应添加到 `MainActivity.java`\
  \ 文件中：\n\n```java\npublic void stopAudio (View view)\n{\n    binding.stopButton.setEnabled(false);\n\
  \    binding.playButton.setEnabled(true);\n    if (isRecording)\n    {\n       \
  \ binding.recordButton.setEnabled(false);\n    }\n}\n```\n\n\n\n\n\n```java\nmediaRecorder.stop();\n\
  mediaRecorder.release();\nmediaRecorder = null;\nisRecording = false;\n} else {\n\
  \    mediaPlayer.release();\n    mediaPlayer = null;\n    binding.recordButton.setEnabled(true);\n\
  }\n```\n\n### 73.10 实现 `playAudio()` 方法\n\n`playAudio()` 方法将简单创建一个新的 `MediaPlayer`\
  \ 实例，将位于 SD 卡上的音频文件指定为数据源，然后准备并启动播放：\n\n```java\npublic void playAudio (View view)\
  \ throws IOException\n{\n    binding.playButton.setEnabled(false);\n    binding.recordButton.setEnabled(false);\n\
  \    binding.stopButton.setEnabled(true);\n    mediaPlayer = new MediaPlayer();\n\
  \    mediaPlayer.setDataSource(audioFilePath);\n    mediaPlayer.prepare();\n   \
  \ mediaPlayer.start();\n}\n```\n\n### 73.11 配置和请求权限\n\n在测试应用程序之前，必须在应用程序的清单文件（manifest）中请求适当的权限。具体而言，应用程序需要访问麦克风的权限。在\
  \ Project 工具窗口中，找到并双击 `AndroidManifest.xml` 文件将其加载到编辑器中，并修改 XML 以添加权限标签：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.audioapp\" >\n    <uses-permission android:name=\"\
  android.permission.RECORD_AUDIO\" />\n    <application\n...\n```\n\n上述步骤将足以确保当应用安装在运行\
  \ Android 6.0 之前的版本的设备上时，用户启用麦克风访问权限。在 Android 中，麦克风访问被归类为危险权限，因为它赋予了应用程序损害用户隐私的可能。因此，为了让示例应用在\
  \ Android 6 或更高版本的设备上运行，需要添加代码在应用运行时专门请求权限。\n\n编辑 `MainActivity.java` 文件，并开始添加一些额外的导入指令和常量，作为所请求权限的请求识别码：\n\
  \n```java\n...\nimport androidx.core.app.ActivityCompat;\nimport androidx.core.content.ContextCompat;\n\
  import android.widget.Toast;\nimport android.Manifest;\n...\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private static final int RECORD_REQUEST_CODE\
  \ = 101;\n...\n```\n\n接下来，需要在类中添加一个方法，其目的是将要请求的权限和相应的请求识别码作为参数。留在 `MainActivity.java`\
  \ 类文件中，按照如下方式实现此方法：\n\n```java\nprotected void requestPermission(String permissionType,\
  \ int requestCode) {\n    int permission = ContextCompat.checkSelfPermission(this,\n\
  \            permissionType);\n    if (permission != PackageManager.PERMISSION_GRANTED)\
  \ {\n        ActivityCompat.requestPermissions(this,\n            new String[]{permissionType},\
  \ requestCode\n        );\n    }\n}\n```\n\n使用本书书中“在 Android 中进行运行时权限请求章节中概述的步骤，上述方法在发出请求之前验证指定的权限是否尚未授予，并将识别码作为参数传递。\n\
  \n当请求被处理后，将在 activity 上调用 `onRequestPermissionsResult()` 方法，并传递识别码和请求结果。因此，下一步是在\
  \ `MainActivity.java` 文件中按所示实现此方法：\n\n```java\n@Override\npublic void onRequestPermissionsResult(int\
  \ requestCode,\n        @NonNull String[] permissions, @NonNull int[] grantResults)\
  \ {\n    super.onRequestPermissionsResult(requestCode, permissions, grantResults);\n\
  \    if (requestCode == RECORD_REQUEST_CODE) {\n        if (grantResults.length\
  \ == 0\n                || grantResults[0] != PackageManager.PERMISSION_GRANTED)\
  \ {\n            binding.recordButton.setEnabled(false);\n            Toast.makeText(this,\n\
  \                \"Permission required\", Toast.LENGTH_LONG).show();\n        }\n\
  \    }\n}\n```\n\n在测试应用之前，剩下的就是调用新添加的 `setup()` 方法。留在 `MainActivity.java` 中，按如下方式修改\
  \ `setup()` 方法：\n\n```java\nprivate void setup(){\n    binding.recordButton = findViewById(R.id.recordButton);\n\
  \    binding.playButton = findViewById(R.id.playButton);\n    binding.stopButton\
  \ = findViewById(R.id.stopButton);\n    if (!hasMicrophone()){\n        stopButton.setEnabled(false);\n\
  \        playButton.setEnabled(false);\n        recordButton.setEnabled(false);\n\
  \    } else {\n        stopButton.setEnabled(false);\n        playButton.setEnabled(false);\n\
  \        recordButton.setEnabled(true);\n    }\n    File audioFile = new File(this.getFilesDir(),\
  \ \"yaudio.3gp\");\n    audioFilePath = audioFile.getAbsolutePath();\n    requestPermission(Manifest.RECORD_AUDIO,\
  \ RECORD_REQUEST_CODE);\n}\n```\n\n### 73.12 测试应用程序\n\n在带有麦克风的 Android 设备上编译并运行应用程序，允许麦克风访问并点击\
  \ Record 按钮。录音后，触摸 Stop 然后点击 Play，此时录制的音频应通过通过设备扬声器播放。\n\n### 73.13 总结\n\nAndroid\
  \ SDK 提供了多种实现音频录制和播放的机制。本章介绍了其中两种，即 `MediaPlayer` 和 `MediaRecorder` 类。在涵盖了使用这些技术的理论之后，本章详细实现了一个用于录制并播放音频的示例应用程序。在\
  \ Android 中处理音频的过程中，本章还查看了在尝试录制音频之前确保运行应用程序的设备具有麦克风的步骤。\n\n### 74. 在 Android Studio\
  \ 中使用 Google Maps Android API\n\n当 Google 在许多年前决定引入地图服务时，很难说他们是否预料到会有版本可以集成到移动应用程序中。当最终成为\
  \ Google Maps 的第一个 Web 版本在 2005 年推出时，iPhone 尚未引发智能手机革命，而开发 Android 操作系统的公司在另外六个月后才被\
  \ Google 收购。无论 Google 对 Google Maps 的未来有何愿望，值得注意的是，现在可以通过 Android 使用 Google Maps\
  \ Android API 直接访问 Google Maps 的所有功能。\n\n本章旨在提供 Google Maps 系统和 Google Maps Android\
  \ API 的概述。本章将概述组成 API 的不同元素，详细说明配置开发环境以用于 Google Maps 的必要步骤，然后通过一些代码示例演示 Google\
  \ Maps Android 集成的基础知识。\n\n### 74.1 Google Maps Android API 的元素\n\nGoogle Maps Android\
  \ API 由一组核心类组成，这些类结合在一起为 Android 应用程序提供地图功能。地图的关键元素如下：\n\n\n\n\n\n- `GoogleMap`\
  \ – Google Maps Android API 的主类。该类负责下载和显示地图瓦片，并显示和响应地图控件。`GoogleMap` 对象不是由应用程序直接创建的，而是在创建\
  \ `MapView` 或 `MapFragment` 实例时创建。在应用程序代码中，可以通过调用 `MapView`、`MapFragment` 或 `SupportMapFragment`\
  \ 实例的 `getMap()` 方法获取 `GoogleMap` 引用。\n- `MapView` - `View` 类的子类，该类提供视图画布，`GoogleMap`\
  \ 对象在其上绘制地图，从而允许地图放置在 Activity 的用户界面布局中。\n- `SupportMapFragment` – `Fragment` 类的子类，该类允许将地图放置在\
  \ Android 布局中的 `Fragment` 中。\n- `Marker` – `Marker` 类的目的是允许在地图上标记位置。通过获取与地图关联的 `GoogleMap`\
  \ 对象引用，然后调用该对象实例的 `addMarker()` 方法即可向地图添加标记。标记的位置通过 `Longitude`（经度）和 `Latitude`（纬度）定义。标记可以通过多种方式进行配置，包括指定标题、文本和图标。标记还可以被设置为“可拖拽”，允许用户将标记移动到地图上的不同位置。\n\
  - `Shapes` – 通过使用 `Polyline`、`Polygon` 和 `Circle` 类在地图上绘制线条和形状。\n- `UiSettings`\
  \ – `UiSettings` 类提供了从应用程序内部控制地图上显示的用户界面控件的功能。例如，使用该类，应用程序可以控制缩放、当前位置和指南针控件是否出现在地图上。该类还可以用于配置地图识别哪些触摸屏手势。\n\
  - `My Location Layer` – 启用时，“我的位置”层会在地图上显示一个按钮，用户选择该按钮会将地图中心置于用户当前的地理位置。如果用户静止，该位置在地图上由一个蓝色标记表示。如果用户正在移动，该位置将由一个指示用户行驶方向的箭头表示。\n\
  \n熟悉 Google Maps Android API 的最佳方法是运行示例。本章的其余部分将创建一个基于 Google Maps 的应用程序，同时突出 API\
  \ 的关键区域。\n\n### 74.2 创建 Google Maps 项目\n\n从欢迎屏幕选择 `New Project` 选项，在生成的新项目对话框中，点击\
