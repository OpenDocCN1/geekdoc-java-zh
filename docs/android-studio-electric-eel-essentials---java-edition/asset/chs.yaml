  \n图 41-5\n\n### 4.5 添加导航目的地\n\n继续留在导航图中，现在是时候添加第一个目的地了。由于项目已经有一个用于第一个屏幕的 fragment（`fragment_main.xml`），它将是添加到图中的第一个目的地。点击如图\
