  \n在继续此教程的下一步之前，需要向项目添加额外的权限，以允许 `WebView` 对象访问互联网并下载网页进行打印。在 Project 窗口中找到 `AndroidManifest.xml`\
  \ 文件并双击将其加载到编辑面板，以添加此权限。加载后，编辑 XML 内容添加如下所示的适当权限行：\n\n```xml\n<?xml version=\"1.0\"\
