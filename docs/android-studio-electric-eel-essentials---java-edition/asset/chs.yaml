  \n如果设备仍然未列出，尝试执行以下命令：\n\n```\nandroid update adb\n```\n\n请注意，可能还需要重新启动系统。\n\n##\
  \ 7.2.3 Linux adb 配置\n\n在本章中，我们将再次使用 Ubuntu Linux 作为参考示例，介绍如何在 Linux 上配置 `adb` 以连接物理\
  \ Android 设备进行应用测试。\n\n在 Ubuntu Linux 上进行物理设备测试需要安装名为 `android-tools-adb` 的包，这反过来要求\
