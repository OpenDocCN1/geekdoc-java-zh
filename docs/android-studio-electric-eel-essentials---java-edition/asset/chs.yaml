  \ >\n        <action\n            android:id=\"@+id/mainToSecond\"\n           \
  \ app:destination=\"@id/secondFragment\" />\n    </fragment>\n</navigation>\n```\n\
  \n\n\n\n\n```xml\n            android:id=\"@+id/mainToSecond\"\n            app:destination=\"\
  @id/secondFragment\" />\n</fragment>\n\n<fragment\n    android:id=\"@+id/secondFragment\"\
  \n    android:name=\"com.ebookfrenzy.navigationdemo.SecondFragment\"\n    android:label=\"\
  fragment_second\"\n    tools:layout=\"@layout/fragment_second\" />\n```\n\n## 41.8\
  \ 实现 OnFragmentInteractionListener\n\n在添加触发动作的代码之前，需要修改 `MainActivity` 类以实现 `OnFragmentInteractionListener`\
  \ 接口。该接口是在在导航图编辑器中创建空白 fragment 时，在 `SecondFragment` 类内部生成的。为了符合该接口，activity 需要实现一个名为\
  \ `onFragmentInteraction()` 的方法，该方法用于实现 fragment 与 activity 之间的通信。\n\n编辑 `MainActivity.java`\
  \ 文件并将其修改如下所示：\n\n```java\nimport android.net.Uri;\n\npublic class MainActivity\
  \ extends AppCompatActivity implements SecondFragment.OnFragmentInteractionListener\
  \ {\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n\
  \        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \    }\n\n    @Override\n    public void onFragmentInteraction(Uri uri) {\n    }\n\
  }\n```\n\n如果 Android Studio 报告 `OnFragmentInteractionListener` 未定义（某些版本的 Android\
  \ Studio 会自动添加它，而另一些则不会），请编辑 `SecondFragment.java` 文件并添加以下内容：\n\n```java\nimport\
  \ android.net.Uri;\n\npublic interface OnFragmentInteractionListener {\n    // TODO:\
  \ 更新参数类型和名称\n    void onFragmentInteraction(Uri uri);\n}\n```\n\n## 41.9 为目标 Fragment\
  \ 添加 View Binding 支持\n\n由于我们需要访问 fragment 布局中的某些视图，因此需要修改当前代码以启用 view 绑定 支持。首先编辑\
  \ `MainFragment.java` 文件并进行以下更改：\n\n```java\nimport com.ebookfrenzy.navigationdemo.databinding.FragmentMainBinding;\n\
  \npublic class MainFragment extends Fragment {\n    private MainViewModel mViewModel;\n\
  \    private FragmentMainBinding binding;\n\n    public static MainFragment newInstance()\
  \ {\n        return new MainFragment();\n    }\n\n    @Nullable\n    @Override\n\
  \    public View onCreateView(@NonNull LayoutInflater inflater, @Nullable ViewGroup\
  \ container,\n                             @Nullable Bundle savedInstanceState)\
  \ {\n        return inflater.inflate(R.layout.fragment_main, container, false);\n\
  \        binding = FragmentMainBinding.inflate(inflater, container, false);\n  \
  \      return binding.getRoot();\n    }\n\n    @Override\n    public void onDestroyView()\
  \ {\n        super.onDestroyView();\n        binding = null;\n    }\n}\n```\n\n\
  对 `SecondFragment.java` 文件重复上述步骤，这次引用 `FragmentSecondBinding`。\n\n### 41.10 触发动作\n\
  \n现在动作已经添加到导航图中，下一步是在主 fragment 中添加一些代码，以便在点击 `Button` 小部件时触发该动作。找到 `MainFragment.java`\
  \ 文件，将其加载到代码编辑器中，并重写 `onViewCreated()` 方法，以获取按钮实例的引用，并配置 `OnClickListener` 实例以便在用户点击按钮时调用：\n\
  \n```java\nimport android.widget.Button;\nimport androidx.navigation.Navigation;\n\
  \npublic class MainFragment extends Fragment {\n\n    @Override\n    public void\
  \ onViewCreated(@NonNull View view,\n                             @Nullable Bundle\
  \ savedInstanceState) {\n        super.onViewCreated(view, savedInstanceState);\n\
  \        binding.button.setOnClickListener(new View.OnClickListener() {\n      \
  \      @Override\n            public void onClick(View view) {\n               \
  \ Navigation.findNavController(view).navigate(R.id.mainToSecond);\n            }\n\
  \        });\n    }\n}\n```\n\n上述代码获取了导航控制器的引用并在该实例上调用 `navigate()` 方法，将导航动作的资源\
  \ ID 作为参数传递。编译并运行应用，验证点击主 fragment 中的按钮是否跳转到第二个 fragment。\n\n作为这种设置监听器方法的替代方案，`Navigation`\
  \ 类还包含一个名为 `createNavigateOnClickListener()` 的方法，它提供了一种更高效的方法来设置监听器并导航到目标。因此，可以使用以下单行代码来启动跳转：\n\
  \n```java\nbinding.button.setOnClickListener(Navigation.createNavigateOnClickListener(R.id.mainToSecond,\
  \ null));\n```\n\n## 41.11 使用 Safeargs 传递数据\n\n下一个目标是将主 fragment 中 `EditText` 视图中输入的文本传递到第二个\
  \ fragment，并在那里在 `TextView` 小部件上显示。如上一章所述，Android Navigation 组件支持两种传递数据的方法。本章将使用类型安全的参数。\n\
  \n使用 safeargs 的第一步是在 Gradle 配置中添加 `safeargs` 插件。使用 Project 窗口，找到并编辑项目级的 `build.gradle`\
  \ 文件（`Gradle Scripts` -> `build.gradle` (Project: `NavigationDemo`），以按如下方式添加插件依赖（再次提醒，可能有更更新的版本）：\n\
  \n```gradle\n// 顶层构建文件，可以在其中添加适用于所有子项目/模块的配置\nbuildscript {\n    dependencies {\n\
  \        classpath(\"androidx.navigation:navigation-safe-args-gradle-plugin:2.5.3\"\
  )\n    }\n}\n```\n\n接下来，编辑模块级的 `build.gradle` 文件（`Gradle Scripts` -> `build.gradle`\
  \ (Module :app)），按如下方式应用插件并同步项目：\n\n```gradle\nplugins {\n    id 'com.android.application'\n\
  \    id 'androidx.navigation.safeargs'\n}\n\nandroid {\n}\n```\n\n下一步是定义目标接收的任何参数，在本例中目标是第二个\
  \ fragment。编辑导航图，选择 `secondFragment` 目标并找到 Attributes 工具窗口中的 `Arguments` 部分。点击 `+`\
  \ 按钮（如图 41-14 所示）向目标添加新参数：\n\n![](img/as_3.6_nav_graph_add_argument.jpg)\n图 41-14\n\
  \n点击 `+` 按钮后会弹出一个对话框，需要在其中输入参数名称、类型和默认值。将参数命名为 `message`，将类型设置为 `String`，在默认值字段中输入\
  \ `No Message`，然后点击 `Add` 按钮：\n\n![](img/as_3.6_nav_graph_add_argument_dialog.jpg)\n\
  图 41-15\n\n新配置的参数将如下出现在 `navigation_graph.xml` 文件的 `secondFragment` 元素中：\n\n```xml\n\
  <fragment\n    android:id=\"@+id/secondFragment\"\n    android:name=\"com.ebookfrenzy.navigationdemo.SecondFragment\"\
  \n    android:label=\"fragment_second\"\n    tools:layout=\"@layout/fragment_second\"\
  \ >\n    <argument\n        android:name=\"message\"\n        app:argType=\"string\"\
  \ />\n        android:defaultValue=\"No Message\"\n</fragment>\n``````\n\n下一步是向\
  \ `MainFragment.java` 文件添加代码，从 `EditText` 视图中提取文本并在导航期间将其传递给第二个 fragment。这将涉及使用由\
  \ `safeargs` 插件自动生成的一些特殊导航类。当前导航涉及 `MainFragment` 类、`SecondFragment` 类、名为 `mainToSecond`\
  \ 的导航动作以及名为 `message` 的参数。\n\n当构建项目时，safeargs 插件将生成以下额外的类，用于在导航期间传递和接收参数。\n\n\n\n\
  \n\n- `MainFragmentDirections` - 此类表示导航动作的起点（使用导航源点的类名并在末尾附加“Directions”来命名），并提供对动作对象的访问。\n\
  \n- `ActionMainToSecond` - 此类表示用于执行跳转的动作（根据导航图文件中分配给动作的 ID 命名，并带有“Action”前缀）。该类为目标地上配置的每个参数都包含一个\
  \ setter 方法。例如，由于第二个片段目标地包含一个名为 `message` 的参数，因此该类包含一个名为 `setMessage()` 的方法。一旦配置完成，该类的实例将传递给导航控制器的\
  \ `navigate()` 方法，以跳转到目标地。\n\n- `SecondFragmentArgs` - 在目标片段中使用该类，用于访问从起点传递的参数（使用导航目的地的类名并在末尾附加“Args”来命名）。该类为每个传递到目的地的参数都包含一个\
  \ getter 方法（例如 `getMessage()`）。\n\n使用这些类，可以对 `MainFragment.java` 文件中 `onViewCreated()`\
  \ 方法内的 `onClickListener` 代码进行如下修改，以从 `EditText` 控件中提取当前文本，将其应用于动作并启动到第二个片段的跳转：\n\
  \n```java\nbinding.button.setOnClickListener(view1 -> {\n    MainFragmentDirections.MainToSecond\
  \ action =\n            MainFragmentDirections.mainToSecond();\n\n    action.setMessage(binding.userText.getText().toString());\n\
  \n    Navigation.findNavController(view1).navigate(action);\n});\n```\n\n上述代码获取动作对象的引用，使用\
  \ `setMessage()` 方法设置消息参数字符串，然后调用导航控制器的 `navigate()` 方法并传递动作对象。如果 Android Studio\
  \ 报告 `MainFragmentDirections` 未定义，请使用 `Build -> Make Project` 菜单选项重新构建项目以生成该类。\n\
  \n剩下的只需修改 `SecondFragment.java` 类文件，以便在跳转执行后接收参数并显示在 `TextView` 控件上。对于此示例，实现这些任务的代码将使用\
  \ `onStart()` 生命周期方法进行添加。编辑 `SecondFragment.java` 文件并添加此方法，使其内容如下：\n\n```java\n\
  @Override\npublic void onStart() {\n    super.onStart();\n    SecondFragmentArgs\
  \ args = SecondFragmentArgs.fromBundle(getArguments());\n    String message = args.getMessage();\n\
  \    binding.argText.setText(message);\n}\n```\n\n上述方法中的代码首先获取 `TextView` 控件的引用。接下来，调用\
  \ `SecondFragmentArgs` 类的 `fromBundle()` 方法从起点提取 `SecondFragmentArgs` 对象。由于此示例中的参数在\
  \ `navigation_graph.xml` 文件中名为 `message`，因此在 `args` 对象上调用相应的 `getMessage()` 方法来获取字符串值。该字符串随后显示在\
  \ `TextView` 控件上。\n\n编译并运行应用，在点击 `Button` 控件之前输入一些文本。当第二个片段目标出现时，`TextView` 现在应该显示在主片段中输入的文本，这表明数据已在导航目的地之间成功传递。\n\
  \n### 41.12 总结\n\n本章提供了一个实用示例，展示了如何使用 Navigation Architecture 组件结合 Android Studio\
  \ 导航图编辑器实现 Android 应用导航。涵盖的主题包括创建包含现有和新目标片段的导航图、在 Activity 布局中嵌入导航宿片段、编写触发跳转事件的代码，以及使用\
  \ `Gradle safeargs` 插件在目的地之间传递参数。\n\n## 42. MotionLayout 简介\n\n`MotionLayout` 类为为用户界面布局中的视图添加动画效果提供了一种简单的方法。本章将首先提供\
  \ MotionLayout 的概述，并引入 `MotionScenes`（场景）、`Transitions`（过渡）和 `Keyframes`（关键帧）的概念。在涵盖这些基础之后，接下来的两章（题为“Android\
  \ MotionLayout 编辑教程”和“MotionLayout KeyCycle 教程”）将通过创建示例项目提供 MotionLayout 动画的更多细节和示例。\n\
  \n### 42.1 MotionLayout 概述\n\n`MotionLayout` 是一种布局容器，其主要目的是使布局内视图从一个状态到另一个状态的转换动画化。例如，`MotionLayout`\
  \ 可以对指定时间内 `ImageView` 实例从屏幕左上角移动到右下角的运动。除了视图的位置，还可以对其他属性的变化进行动画处理，例如颜色、大小或旋转角度。这些状态变化还可以进行插值（使得视图在整个动画过程中移动、旋转并改变大小）。\n\
  \n使用 `MotionLayout` 的视图运动可以在两点之间沿直线执行，也可以实现为遵循由起点和终点之间不同位置中间点组成的路径。`MotionLayout`\
  \ 还支持使用触摸和滑动来启动和控制动画。\n\n`MotionLayout` 动画完全在 XML 中声明，通常不需要编写任何代码。这些 XML 声明可以在 Android\
  \ Studio 代码编辑器中手动实现、使用 `MotionLayout` 编辑器进行视觉化实现，或者结合这两种方法使用。\n\n### 42.2 MotionLayout\n\
  \n在实现动画时，用户界面中通常使用的 `ConstraintLayout` 容器必须先转换为 `MotionLayout` 实例（此任务可以通过在布局编辑器中右单击\
  \ `ConstraintLayout` 并选择 `Convert to MotionLayout` 菜单选项来实现）。`MotionLayout` 至少需要\
  \ 2.0.0 版本的 `ConstraintLayout` 库。\n\n意外，由于它是 `ConstraintLayout` 的子类，`MotionLayout`\
  \ 支持 `ConstraintLayout` 的所有布局功能。因此，在使用 `MotionLayout` 处理不需要动画的视图时，用户界面布局的设计方式完全相同。\n\
  \n对于需要动画的视图，会声明两个 `ConstraintSet` 来定义视图在动画开始和结束时的外观和位置。`transition` 声明定义关键帧，在这些开始和结束状态之间对目标视图应用额外效果，以及用于启动和控制动画的点击和滑动处理器。\n\
  \n开始和结束的 `ConstraintSet` 以及过渡都在 `MotionScene` 文件中声明。\n\n### 42.3 MotionScene\n\n\
  正如我们在前面的章节中看到的，XML 布局文件包含配置呈现给用户的静态视图的外观和布局所需的信息，在使用 MotionLayout 时也是如此。对于非静态视图（即将进行动画的视图），这些视图仍然声明在布局文件中，但与它们相关的开始、结束和过渡声明存储在独立的\
  \ XML 文件中，称为 `MotionScene` 文件（如此是因为所有声明都定义在 `MotionScene` 元素内）。该文件被导入布局 XML 文件中，并包含开始和结束的\
  \ `ConstraintSets` 以及过渡声明（单个文件可以包含多个 `ConstraintSet` 对和 `Transition` 声明，允许对用户界面布局中的特定视图实现不同的动画）。\n\
  \n以下列表显示了 `MotionScene` 模板：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<MotionScene\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  >\n```\n\n\n\n\n\n```xml\nxmlns:motion=\"http://schemas.android.com/apk/res-auto\"\
  >\n    <Transition\n        motion:constraintSetEnd=\"@+id/end\"\n        motion:constraintSetStart=\"\
  @id/start\"\n        motion:duration=\"1000\">\n        <KeyFrameSet>\n        </KeyFrameSet>\n\
  \    </Transition>\n    <ConstraintSet android:id=\"@+id/start\">\n    </ConstraintSet>\n\
  \    <ConstraintSet android:id=\"@+id/end\">\n    </ConstraintSet>\n</MotionScene>\n\
  ```\n\n在上述 XML 中，声明了名为 `start` 和 `end` 的 `ConstraintSets`（尽管可以使用任何名称），它们在此时尚未包含任何约束元素（constraint\
  \ elements）。`Transition` 元素定义了这些 `ConstraintSets` 代表动画的起点和终点，并包含一个空的 `KeyFrameSet`\
  \ 元素，准备好填充额外的动画关键帧项。`Transition` 元素还包含一个毫秒级的持续时间属性（`duration`），用于控制动画的运行时间。\n\n\
  `ConstraintSets` 并不意味着视图的移动。例如，可以让起始集合和结束集合声明屏幕上的相同位置，然后使用过渡来制作其他属性的变化，例如缩放和旋转角度。\n\
  \n### 42.4 配置 ConstraintSets\n\n`MotionScene` 文件中的 `ConstraintSets` 允许将全套 `ConstraintLayout`\
  \ 设置应用于视图上，涉及定位、尺寸调整以及与父视图和其他视图之间的关系。此外，在 `ConstraintSet` 声明中还可以包含以下属性：\n\n* `alpha`\n\
  * `visibility`\n* `elevation`\n* `rotation`\n* `rotationX`\n* `rotationY`\n* `translationX`\n\
  * `translationY`\n* `translationZ`\n* `scaleX`\n* `scaleY`\n\n例如，为了在动画期间将视图旋转 180°，可以在起始和结束约束中声明以下内容：\n\
  \n```xml\n<ConstraintSet android:id=\"@+id/start\">\n    <Constraint\n        .\n\
  \        .\n        motion:layout_constraintStart_toStartOf=\"parent\"\n       \
  \ android:rotation=\"0\">\n    </Constraint>\n</ConstraintSet>\n\n<ConstraintSet\
  \ android:id=\"@+id/end\">\n    <Constraint\n        .\n        .\n        motion:layout_constraintBottom_toBottomOf=\"\
  parent\"\n        android:rotation=\"180\">\n    </Constraint>\n</ConstraintSet>\n\
  ```\n\n上述更改告诉 `MotionLayout` 视图将从 0° 开始，然后在动画过程中旋转整个 180°，最后以倒置的状态停下。\n\n### 42.5\
  \ 自定义属性\n\n除了上述列出的标准属性外，还可以指定范围内的自定义属性（使用 `CustomAttribute` 声明）。事实上，视图类型上可用的几乎任何属性都可以指定为自定义属性以包含在动画中。要识别属性名称，请从目标视图类的文档中找到获取/设置方法（getter/setter）名称，删除\
  \ `get/set` 前缀并将剩余字符的首字母转换为小写。例如，为了在代码中更改 `Button` 视图的背景颜色，我们可能如下所示调用 `setBackgroundColor()`\
  \ 设置方法：\n\n```java\nmyButton.setBackgroundColor(Color.RED)\n```\n\n在约束集或关键帧中设置此属性时，属性名称将为\
  \ `backgroundColor`。除了属性名称外，值还必须使用以下列表中的适当类型声明：\n\n* `motion:customBoolean` - 布尔属性值。\n\
  * `motion:customColorValue` - 颜色属性值。\n* `motion:customDimension` - 维度属性值。\n* `motion:customFloatValue`\
  \ - 浮点属性值。\n* `motion:customIntegerValue` - 整数属性值。\n* `motion:customStringValue`\
  \ - 字符串属性值。\n\n例如，颜色设置需要使用 `customColorValue` 类型进行赋值：\n\n```xml\n<CustomAttribute\n\
  \    motion:attributeName=\"backgroundColor\"\n    motion:customColorValue=\"#43CC76\"\
  \ />\n```\n\n例如，以下来自 `MotionScene` 文件的片段除了将背景颜色从绿色改为红色外，还声明了视图的起始和结束约束：\n\n```xml\n\
  .\n.\n<ConstraintSet android:id=\"@+id/start\">\n    <Constraint\n        android:layout_width=\"\
  wrap_content\"\n        android:layout_height=\"wrap_content\"\n        motion:layout_editor_absoluteX=\"\
  21dp\"\n        android:id=\"@+id/button\"\n        motion:layout_constraintTop_toTopOf=\"\
  parent\"\n        motion:layout_constraintStart_toStartOf=\"parent\">\n        <CustomAttribute\n\
  \            motion:attributeName=\"backgroundColor\"\n            motion:customColorValue=\"\
  #33CC33\" />\n    </Constraint>\n</ConstraintSet>\n<ConstraintSet android:id=\"\
  @+id/end\">\n    <Constraint\n        android:layout_width=\"wrap_content\"\n  \
  \      android:layout_height=\"wrap_content\"\n        motion:layout_editor_absoluteY=\"\
  21dp\"\n        android:id=\"@+id/button\"\n        motion:layout_constraintEnd_toEndOf=\"\
  parent\"\n        motion:layout_constraintBottom_toBottomOf=\"parent\">\n      \
  \  <CustomAttribute\n            motion:attributeName=\"backgroundColor\"\n    \
  \        motion:customColorValue=\"#F8A1F\" />\n    </Constraint>\n</ConstraintSet>\n\
  .\n```\n\n### 42.6 触发动画\n\n如果没有某种形式的事件告诉 `MotionLayout` 启动动画，`MotionScene` 文件中的任何设置都不会对布局产生任何影响（视图将根据\
  \ `start ConstraintSet` 中的设置进行定位除外）。\n\n动画可以配置为响应屏幕点击（`OnClick`）或滑动动作（`OnSwipe`）手势来启动。\n\
  \n`OnClick` 处理程序会导致动画启动并运行到完成，而 `OnSwipe` 则会同步动画，使其沿时间轴来回移动以匹配触摸动作。`OnSwipe` 处理程序还会响应屏幕上的“飞掷”（flinging）动作。`OnSwipe`\
  \ 处理程序还提供了配置动画如何响应不同方向拖拽的选项，以及滑动锚定在目标视图的哪一侧。这允许例如，向左拖拽动作让视图沿相应方向移动，同时防止向上运动导致视图横向移动（除非这确实是所需的行为）。\n\
  \n`OnSwipe` 和 `OnClick` 声明包含在 `MotionScene` 文件的 `Transition` 元素中。两种情况下都必须指定视图的 `id`。例如，要实现响应锚定在名为\
  \ `button` 的视图底部向下拖动的 `OnSwipe` 处理程序，可以将以下 XML 放置在 `Transition` 元素中：\n\n```xml\n\
  .\n.\n<Transition\n    motion:constraintSetEnd=\"@+id/end\"\n    motion:constraintSetStart=\"\
  @id/start\"\n    motion:duration=\"1000\">\n    <KeyFrameSet>\n    </KeyFrameSet>\n\
  \    <OnSwipe\n        motion:touchAnchorId=\"@+id/button\"\n        motion:dragDirection=\"\
  dragDown\"\n        motion:touchAnchorSide=\"bottom\" />\n</Transition>\n.\n```\n\
  \n或者，为同一个按钮添加 `OnClick` 处理程序：\n\n```xml\n<OnClick motion:targetId=\"@id/button\"\
  \n    motion:clickAction=\"toggle\" />\n```\n\n在上述示例中，已设置为 `toggle` 模式。此模式和其他可用选项总结如下：\n\
  \n* `toggle` - 切换到相反状态。例如，如果视图当前处于过渡起点，它将过渡到终点，反之亦然。\n* `jumpToStart` - 立即跳转到起始状态，不进行动画。\n\
  * `jumpToEnd` - 立即跳转到结束状态，不进行动画。\n* `transitionToStart` - 过渡到起始状态。\n* `transitionToEnd`\
  \ - 过渡到结束状态。\n\n### 42.7 弧形运动\n\n默认情况下，视图位置的移动将在起点和终点之间直线旅行。要将运动改为弧形路径，只需在起始约束中如下所示使用\
  \ `pathMotionArc` 属性，并配置 `startHorizontal` 或 `startVertical` 设置来定义弧线是凹形还是凸形：\n\n\
  ```xml\n<ConstraintSet android:id=\"@+id/start\">\n    <Constraint\n        android:layout_width=\"\
  wrap_content\"\n        android:layout_height=\"wrap_content\"\n```\n\n\n\n\n\n\
  ```xml\nmotion:layout_editor_absoluteX=\"21dp\"\nandroid:id=\"@+id/button\"\nmotion:layout_constraintTop_toTopOf=\"\
  parent\"\nmotion:layout_constraintStart_toStartOf=\"parent\"\nmotion:pathMotionArc=\"\
  startVertical\"\n```\n\n图 42-1 展示了 `startVertical` 和 `startHorizontal` 弧线运动与默认直线运动的对比：\n\
  \n![](img/motionlayout_arcMotion_three.jpg)\n\n图 42-1\n\n## 42.8 关键帧 (Keyframes)\n\
  \n目前为止概述的所有 `ConstraintSet` 属性仅适用于动画的起点和终点。换句话说，如果 `rotation`（旋转）属性在终点设置为 180°，那么旋转将在动画开始时开始并在到达终点时完成。因此，无法配置旋转在动画进行到\
  \ 50% 处时达到完整的 180°，然后在动画结束时旋转回原始方向。幸运的是，使用 `Keyframes` 可以实现这种效果。\n\n关键帧用于定义动画过程中的中间点，在这些点上发生状态变化。例如，可以声明关键帧，使视图的背景颜色在动画进行\
  \ 50% 处变为蓝色，在 75% 处变为绿色，并在动画结束时恢复原始颜色。关键帧实现在嵌入 `MotionScene` 文件的 `Transition` 元素中，位于\
  \ `KeyFrameSet` 。\n\nMotionLayout 支持多种类型的关键帧，总结如下：\n\n### 42.8.1 属性关键帧 (Attribute\
  \ Keyframes)\n\n属性关键帧（使用 `KeyAttribute` ）允许在动画时间轴的中间点更改视图属性。`KeyAttribute` 支持与上述\
  \ `ConstraintSets` 列出的相同属性集，并能够指定更改在动画时间轴的何位置生效。例如，以下关键帧声明将导致 `button` 视图在水平（`scaleX`）和垂直（`scaleY`）方向上逐渐增大倍，并在时间轴\
  \ 50% 处达到完全尺寸。在时间轴的剩余时间内，视图的尺寸将缩小到原始尺寸：\n\n```xml\n<Transition\n    motion:constraintSetEnd=\"\
  @+id/end\"\n    motion:constraintSetStart=\"@id/start\"\n    motion:duration=\"\
  1000\">\n    <KeyFrameSet>\n        <KeyAttribute\n            motion:motionTarget=\"\
  @+id/button\"\n            motion:framePosition=\"50\"\n            android:scaleX=\"\
  2.0\" />\n        <KeyAttribute\n            motion:motionTarget=\"@+id/button\"\
  \n            motion:framePosition=\"50\"\n            android:scaleY=\"2.0\" />\n\
  \    </KeyFrameSet>\n</Transition>\n```\n\n### 42.8.2 位置关键帧 (Position Keyframes)\n\
  \n位置关键帧（`KeyPosition`）用于修改视图在起点和终点位置移动时遵循的路径。通过在时间轴上的不同点放置关键位置，可以为动画应用任何复杂程度的路径。位置使用\
  \ `x` 和 `y` 坐标结合过渡时间轴中的相应点进行声明。这些坐标必须相对于以下坐标系之一进行声明：\n\n- `parentRelative` - `x`\
  \ 和 `y` 坐标相对于指定坐标的父容器，以百分比形式表示（ 0.0 到 1.0 之间的值）：\n\n![](img/motionlayout_parentRelative.jpg)\n\
  \n图 42-2\n\n- `deltaRelative` - 相对于父容器，`x` 和 `y` 坐标是相对于起点和终点位置。例如，起点为 (0, 0)，终点为\
  \ (1, 1)。请记住 `x` 和 `y` 坐标可以是负值：\n\n![](img/motionlayout_deltaRelative.jpg)\n\n图\
  \ 42-3\n\n- `pathRelative` - `x` 和 `y` 坐标相对于路径，其中起点和终点之间的直线作为图表的 X 轴。再次，坐标以百分比形式表示（0.0\
  \ 到 1.0）。这与 `deltaRelative` 坐标空间相似，但考虑了路径的角度。再次，坐标可能可能是负的：\n\n![](img/motionlayout_pathRelative.jpg)\n\
  \n图 42-4\n\n例如，以下 `ConstraintSets` 声明了设备屏幕两侧的起点和终点。默认情况下，使用这些点的视图过渡将跨越屏幕沿直线移动，如\
  \ 图 42-5 所示：\n\n![](img/motionlayout_straight_path.jpg)\n\n图 42-5\n\n然而，假设视图需要遵循类似于\
  \ 图 42-6 所示的路径：\n\n![](img/motionlayout_wave_path.jpg)\n\n图 42-6\n\n为了实现这一点，可以在过渡中如下如下声明关键帧点：\n\
  \n```xml\n<KeyPosition\n    motion:motionTarget=\"@+id/button\"\n    motion:framePosition=\"\
  25\"\n    motion:keyPositionType=\"pathRelative\"\n    motion:percentY=\"0.3\"/>\n\
  <KeyPosition\n    motion:motionTarget=\"@+id/button\"\n    motion:framePosition=\"\
  75\"\n    motion:keyPositionType=\"pathRelative\"\n    motion:percentY=\"-0.3\"\
  />\n```\n\n上述 `KeyPosition` 元素在路径的 25% 和 75% 处创建了关键帧。第一个位置在 (0.25, 0.3)，第二个在 (0.75,\
  \ -0.3)。这些位置可以在下方 图 42-7 中可视化：\n\n![](img/motionlayout_curve.jpg)\n\n图 42-7\n\n\
  ## 42.9 线性度 (Linearity)\n\n在没有任何设置的情况下，上述动画将以恒定速度执行。为了改变动画的速度（例如使其加速后减速），可以在 `ConstraintSet`\
  \ 中使用 `easing` 属性。\n\n对于复杂的需求，可以通过在贝塞尔曲线上绘制点来定义线性度，例如：\n\n```xml\nmotion:easing=\"\
  cubic(0.2, 0.7, 0.3, 1)\"\n```\n\n如果你不熟悉贝塞尔曲线，可以使用 [`cubic-bezier.com/`](https://cubic-bezier.com/)\
  \ 生成器。\n\n然而，对于大多数需求，可以使用内置的 `accelerate` 和 `decelerate` 值来指定。\n\n## 42.10 触发 (KeyTrigger)\n\
  \n触发关键帧（`KeyTrigger`）允许在动画到达指定的帧位置时调用视图的方法。这还考虑了动画的方向。例如，可以根据动画向前还是向后运行调用不同的方法。考虑一个在超过时间轴\
  \ 20% 时可见的按钮。该 `KeyTrigger` 将实现在 `Transition` 元素的 `KeyFrameSet` 中，使用 `onPositiveCross`\
  \ 属性如下：\n\n```xml\n<KeyTrigger\n    motion:framePosition=\"20\"\n    motion:onPositiveCross=\"\
  show\"\n    motion:motionTarget=\"@+id/button\"/>\n```\n\n同样，如果当动画反向并降至 10% 时隐藏同一个按钮，则可以使用\
  \ `onNegativeCross` 属性添加第二个关键触发器：\n\n```xml\n<KeyTrigger\n    motion:framePosition=\"\
  10\"\n    motion:onNegativeCross=\"hide\"\n    motion:motionTarget=\"@+id/button\"\
  />\n```\n\n如果动画使用切换动作，只需使用 `onCross` 属性：\n\n```xml\n<KeyTrigger\n    motion:framePosition=\"\
  10\"\n    motion:onCross=\"show\"\n    motion:motionTarget=\"@+id/button\"/>\n```\n\
  \n\n\n\n\n虽然可以使用位置关键帧（position keyframes）为动画添加中间状态变化，但如果需要大量重复的位置和变化，这很快就会变得繁琐。对于需要重复执行具有预测变化的状态更改的情况，`MotionLayout`\
  \ 包含了 `Cycle`（循环）和 `Time Cycle`（时间循环）关键帧，主题将在名为 MotionLayout KeyCycle 教程;\nmotionLayout.transitionToEnd();\n\
  ```\n\n在没有额外设置的情况下，用于动画的起始状态和结束状态将是 `MotionScene` 文件中 `Transition` 声明里定义的那些。要使用特定的起始和结束约束集，只需在调用\
  \ `MotionLayout` 实例的 `setTransition()` 方法时通过 id 引用它们：\n\n```\nmotionLayout.setTransition(R.id.myStart,\
  \ R.id.myEnd);\nmotionLayout.transitionToEnd();\n```\n\n要在动画运行中监控的状态，请如下所示为 `MotionLayout`\
  \ 实例添加过渡监听器（transition listener）：\n\n```\nmotionLayout.setTransitionListener(transitionListener);\n\
  \nMotionLayout.TransitionListener transitionListener =\n    new MotionLayout.TransitionListener()\
  \ {\n        @Override\n        public void onTransitionStarted(MotionLayout motionLayout,\
  \ int startId, int endId) {\n            // 当过渡开始时调用\n        }\n        @Override\n\
  \        public void onTransitionChange(MotionLayout motionLayout, int startId,\
  \ int endId, float progress) {\n            // 每次属性变化时调用。跟踪进度值以查找\n            //\
  \ 当前位置\n        }\n        @Override\n        public void onTransitionCompleted(MotionLayout\
  \ motionLayout, int currentId) {\n            // 当过渡完成时调用\n        }\n        @Override\n\
  \        public void onTransitionTrigger(MotionLayout motionLayout, int triggerId,\
  \ boolean positive, float progress) {\n            // 当跨越触发关键帧阈值时调用\n        }\n\
  \    };\n```\n\n## 42.13 总结\n\n`MotionLayout` 是 `ConstraintLayout` 的子类，专门为用户界面布局中的视图添加动画效果而设计。`MotionLayout`\
  \ 的工作原理是对视图在由起始和结束约束集定义的两个状态之间的过渡进行动画处理。可以通过关键帧在这些起始和结束点之间添加额外的动画效果。\n\n动画可以通过 `OnClick`\
  \ 或 `OnSwipe` 处理器触发，也可以通过调用 `MotionLayout` 实例的方法进行程序化触发。\n\n## 43. Android MotionLayout\
  \ 编辑器教程\n\n既然已经涵盖了 `MotionLayout` 的基础知识，本章将提供在示例项目中尝试 `MotionLayout` 的机会。除了继续探索\
  \ `MotionLayout` 的主要功能外，本章还将介绍 `MotionLayout` 编辑器，并探索如何使用它来视觉化构建和修改 `MotionLayout`\
  \ 动画。\n\n在本章创建的项目将使用起始和结束 `ConstraintSets`（约束集）、手势处理器以及 `Attribute`（属性）和位置关键帧。\n\
  \n### 43.1 创建 MotionLayoutDemo 项目\n\n点击欢迎屏幕上的 `New Project` 按钮，在生成的新项目对话框中，选择 `Empty\
  \ Activity` 模板，然后点击 `Next` 按钮。\n\n在 `Name` 字段中输入 `MotionLayoutDemo` 并指定 `com.ebookfrenzy.motionlayoutdemo`\
  \ 为包名。在点击 `Finish` 按钮之前，将 Minimum API level 设置更改为 `API 26`：Android 8.0 (Oreo)，并将\
  \ `Language` 菜单设置为 `Java`。\n\n### 43.2 ConstraintLayout 到 MotionLayout 的转换\n\n一如既常，Android\
  \ Studio 会在 `activity_main.xml` 布局文件中放置一个 `ConstraintLayout` 容器作为父视图。下一步是将此容器转换为\
  \ `MotionLayout` 实例。在 `Component Tree`（组件树）中，右键点击 `ConstraintLayout` 并选择 `Convert\
  \ to MotionLayout` ：\n\n![](img/as_4.0_motionlayout_conversion)\n图 43-1\n\n选择后，点击\
  \ `Convert` 按钮。一旦转换完成，`MotionLayout` 编辑器将出现在主窗口中，如图所示：\n\n![](img/as_4.0_motionlayout_editor)\n\
  图 43-2\n\n作为转换的一部分，Android Studio 还会创建一个名为 `res/xml` 的新文件夹，并在其中放置名为 `activity_main_scene.xml`\
  \ 的 MotionLayout 场景文件：\n\n![](img/as_4.0_motionlayout_scene)\n图 43-3\n\n该文件包含一个顶层\
  \ `MotionScene` 元素，其中包含定义动画的 `ConstraintSet` 和 `Transition` 。默认情况下，该文件将包含起始和结束的空元素以及初始过渡：\n\
  \n```xml<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<MotionScene xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:motion=\"http://schemas.android.com/apk/res-auto\"\
  >\n    <Transition motion:constraintSetEnd=\"@+id/end\"\n        motion:constraintSetStart=\"\
  @id/start\"\n        motion:duration=\"1000\">\n        <KeyFrameSet />\n    </Transition>\n\
  \    <ConstraintSet android:id=\"@+id/start\" />\n    <ConstraintSet android:id=\"\
  @+id/end\" />\n</MotionScene>\n```\n\n在 MotionLayout 编辑器中进行的任何更改都将存储在此文件中。同样，也可以直接编辑此文件在\
  \ MotionLayout 编辑器之外实现动画。在本教程中，我们将主要使用 MotionLayout 编辑器来实现。然而，在每个阶段我们将花时间查看这些更改如何反映在底层\
  \ MotionScene 中。随着章节的进行，你会发现 MotionScene XML 语法实际上非常简单易于学习。\n\n本教程的第一阶段将演示使用 `MotionLayout`\
  \ 对 `Button` 对象进行动画处理，包括运动（沿路径）、旋转和尺寸缩放。\n\n### 43.3 配置起始和结束约束\n\n将 `activity_main.xml`\
  \ 文件加载到 MotionLayout 编辑器后，确保选中 MotionLayout 容器框（下方 图 43-5 中标记为 E 的部分），然后删除默认的 `TextView`，最后从调色板拖放\
  \ `Button` 视图到布局画布的左上角，如 图 43-4 所示：\n\n![](img/as_4.1_motion_layout_button_added)\n\
  图 43-4\n\n选中按钮后，使用 `Attributes` 工具窗口将 `id` 更改为 `myButton`。\n\n如上一章所述，MotionLayout\
  \ 动画主要主要是指定视图在两个状态之间转换的情况。因此，实现动画的第一步是指定定义这些状态的约束。对于此示例，起点将是布局视图的顶部中央。要配置这些约束，请选择编辑器窗口中的起始约束集项（图\
  \ 43-5 中标记为 A 的部分）：\n\n![](img/as_4.0_motionlayout_editor_start_labeled)\n图 43-5\n\
  \n\n\n\n当选中“起始”框（start box）时，所有的约束和布局更改都将应用于起始约束集（start constraint set）。要返回到整个布局的标准约束和属性，请点击\
  \ `Motion Layout` 框 (E)。\n\n接下来，在 `ConstraintSet` 列表中选择 `myButton` 项 (B)。请注意，`Source`（源）列显示该按钮是根据布局文件中的约束进行定位的。相反，我们希望按钮根据起始约束集进行定位。在仍选中\
  \ `myButton` 项的状态下，点击 `Edit`（编辑）按钮 (C) 并从菜单中选择 `Create Constraint`（创建约束），之后该按钮项将指示该视图将根据起始约束集进行定位：\n\
  \n![](img/as_4.0_motionlayout_editor_start_set.jpg)\n图 43-6\n\n起始约束集需要将按钮放置在布局的顶部，带有\
  \ 8dp 的偏移量并水平居中。在仍选中 `myButton` 的情况下，使用 Attributes（属性）工具窗口，为视图的顶部、左侧和右侧设置约束如下：\n\
  \n![](img/as_4.0_motionlayout_start_constraints.jpg)\n图 43-7\n\n选择“结束”约束集项（在上方 图\
  \ 43-5 中标记为 D），并重复这些步骤创建一个新约束，这次将按钮放置在布局的水平中心，但距离布局底部有 8p 的偏移量：\n\n![](img/as_4.0_motionlayout_end_constraints.jpg)\n\
  图 43-8\n\n配置好起始和结束约束后，打开 `activity_main_scene.xml` 文件，注意约束已添加到文件中：\n\n```xml\n<?xml\
  \ version=\"1.0\" encoding=\"utf-8\"?>\n<MotionScene\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:motion=\"http://schemas.android.com/apk/res-auto\">\n    <ConstraintSet\
  \ android:id=\"@+id/start\">\n        <Constraint\n            android:id=\"@+id/myButton\"\
  \n            android:layout_width=\"wrap_content\"\n            android:layout_height=\"\
  wrap_content\"\n            motion:layout_constraintTop_toTopOf=\"parent\"\n   \
  \         android:layout_marginTop=\"8dp\"\n            motion:layout_constraintStart_toStartOf=\"\
  parent\"\n            motion:layout_constraintEnd_toEndOf=\"parent\" />\n    </ConstraintSet>\n\
  \    <ConstraintSet android:id=\"@+id/end\">\n        <Constraint\n            android:id=\"\
  @+id/myButton\"\n            android:layout_width=\"wrap_content\"\n           \
  \ android:layout_height=\"wrap_content\"\n            motion:layout_editor_absoluteY=\"\
  6dp\"\n            motion:layout_constraintStart_toStartOf=\"parent\"\n        \
  \    motion:layout_constraintEnd_toEndOf=\"parent\"\n            motion:layout_constraintBottom_toBottomOf=\"\
  parent\"\n            android:layout_marginBottom=\"8dp\" />\n    </ConstraintSet>\n\
  </MotionScene>\n```\n\n同样注意，`Transition`（过渡）元素已经预先配置，用于在 1000 毫秒内动画起始和结束点之间的过渡。尽管我们尚未添加操作来启动过渡，但仍然可以在\
  \ `MotionLayout` 编辑器内部预览动画。\n\n### 43.4 预览 MotionLayout 动画\n\n要在无需构建和运行应用的情况下预览动画，请选择\
  \ `MotionLayout` 编辑器中下方 图 43-9 标记为 A 的过渡箭头。这将显示动画时间轴面板（标记为 B）：\n\n![](img/as_4.0_motionlayout_labeled_timeline.jpg)\n\
  图 43-9\n\n要测试动画，点击滑块 (C) 并沿着时间轴拖动。随着滑块的移动，布局画布上的按钮将沿着虚线路径 (D) 移动。使用工具栏按钮 (E) 执行完整动画，或以不同的速度连续重复动画（向前、向后或在之间来回切换）。\n\
  \n### 43.5 添加 OnClick 点击手势\n\n尽管已经创建了简单的 `MotionLayout` 动画过渡，但我们仍然需要一种方法从运行的应用内部启动动画。这可以通过分配点击或滑动处理程序来实现。在本示例中，我们将配置动画为在用户点击按钮时启动。在\
  \ `MotionLayout` 编辑器中，如果时间轴动画当前正以循环设置运行，请首先开始暂停它。接下来，选择过渡箭头（在上方 图 43-9 中标记为 A），在\
  \ Attributes 工具窗口中找到 `OnClick` 属性部分，并点击 图 43-10 中箭头所示的 `+` 按钮：\n\n![](img/as_4.0_motionlayout_onclick.jpg)\n\
  图 43-10\n\n`OnClick` 面板中会出现一个空行。对于属性名，输入 `targetId`，对于值字段，输入 `@myButton`。再次点击 `+`\
  \ 按钮，这次在属性名中输入 `clickAction`。在值字段中，点击向下箭头显示有效选项：\n\n![](img/as_4.0_motionlayout_onclick_actions.jpg)\n\
  图 43-11\n\n对于此示例，选择 `toggle` 操作。这将导致视图动画到相反的位置。一旦输入了这些设置，它们应与 图 43-12 中的内容一致。再次打开\
  \ `activity_main_scene.xml` 文件，查看 `Transition` 中定义的 `OnClick`：\n\n```xml\n<Transition\n\
  \    motion:constraintSetEnd=\"@+id/end\"\n    motion:constraintSetStart=\"@+id/start\"\
  \n    motion:duration=\"1000\">\n    <KeyFrameSet />\n    <OnClick motion:targetId=\"\
  @+id/myButton\" clickAction=\"toggle\" />\n</Transition>\n```\n\n编译并在设备上运行应用，并确认点击按钮使其会在\
  \ `MotionScene` 文件定义的起始和结束点之间来回过渡。\n\n### 43.6 为过渡添加属性关键帧\n\n到为止，示例项目仅演示了按钮从屏幕上一个位置到另一个位置的运动。属性关键帧（`KeyAttribute`）提供了一种在过渡过程中指定其他属性生效点的方法。例如可以定义一个\
  \ `KeyAttribute`，使得在视图移动时间轴 30% 时，其尺寸已经增加了 50%。对于此示例，我们将在动画的中点添加一个旋转效果。\n\n首先在 `MotionLayout`\
  \ 编辑器中打开 `activity_main.xml` 文件，选择过渡箭头显示时间轴，然后点击 图 43-13 中高亮的按钮：\n\n![](img/as_4.0_motionlayout_timeline_add_key_button.jpg)\n\
  图 43-13\n\n从菜单中选择 `KeyAttribute` 选项：\n\n![](img/as_4.0_motionlayout_timeline_add_key_attribute_menu.jpg)\n\
  图 43-14\n\n选中后，将显示 图 43-15 所示的对话框。在对话框中，确保选择了 ID 并引用了 `myButton`。在位置字段中，输入 50（以百分比指定，0\
  \ 为起始点，100 为结束点）。最后在 Attribute 下拉菜单中选择 `rotation` 项，然后点击 `Add` 按钮：\n\n![](img/as_4.0_motionlayout_timeline_key_attr_dialog.jpg)\n\
  图 43-15\n\n\n\n一旦添加了 `KeyAttribute`，时间轴上就会出现该属性的一行。点击该行将其高亮，然后点击该行最左侧的折叠箭头以展开属性过渡图。请注意，时间轴上会出现一个小的菱形标记（如下方的图\
  \ 43-16 所示），它表示关键帧的位置。图表表示了效果的线性度。在这种情况下，按钮将稳定地旋转到指定的度数，并在关键帧位置达到最大旋转。当到达终点时，按钮将旋转回\
  \ 0 度：\n\n![](img/as_motionlayout_attribute_timeline.jpg)\n\n图 43-16\n\n要更改 `KeyAttribute`\
  \ 的属性，请在时间轴上选择它，然后参考 Attributes（属性）工具窗口。在 `KeyAttribute` 面板中，将旋转（rotation）属性改为 360\
  \ 度：\n\n![](img/as_4.0_motionlayout_timeline_key_attr_rotation_angle.jpg)\n\n图 43-17\n\
  \n通过来移动滑动块并观察按钮在布局画布中遍历动画路径时的旋转情况，检查属性是否生效。参考 `activity_main_scene.xml` 文件，它现在应该如下：\n\
  \n```xml\n<Transition\n    motion:constraintSetEnd=\"@+id/end\"\n    motion:constraintSetStart=\"\
  @id/start\"\n    motion:duration=\"1000\">\n    <KeyFrameSet>\n        <KeyAttribute\n\
  \            motion:motionTarget=\"@+id/myButton\"\n            motion:framePosition=\"\
  50\"\n            android:rotation=\"360\" />\n    </KeyFrameSet>\n    <OnClick\
  \ motion:targetId=\"@id/myButton\"\n        motion:clickAction=\"toggle\" />\n</Transition>\n\
  ```\n\n使用过渡滑动块或通过编译并运行应用来测试动画，验证按钮现在在动画过程中会旋转。\n\n## 43.7 在 Transition 中添加 CustomAttribute\n\
  \n`KeyAttribute` 属性仅限于缩放和旋转等内置效果。通过声明 `CustomAttributes`（自定义属性）也可以实现额外的更改。与存储在 `Transition`\
  \ 元素 `KeyAttributes` 不同，`CustomAttributes` 位于起始和结束约束集中。因此，这些属性只能声明在起始和结束点生效（换句话说，你无法在过渡时间轴的中间位置指定属性关键帧）。\n\
  \n在本示例中，我们将配置按钮使其颜色从红色逐渐变为绿色。首先选择图 43-18 中标记为 A 的起始框，然后选择 `myButton` 视图约束集 (B)：\n\
  \n![](img/as_4.0_motionlayout_start_and_view.jpg)\n\n图 43-18\n\n参考 Attributes 工具窗口，点击如下所示的\
  \ `CustomAttributes` 区域中的 `+` 按钮：\n\n![](img/as_4.0_motionlayout_timeline_custom_attr_add.jpg)\n\
  \n图 43-19\n\n在弹出的对话框（图 43-20）中，将属性类型更改为 `Color` 并在 `Attribute Name`（属性名称）字段中输入 `backgroundColor`。最后将值设置为\
  \ `#F80A1F`：\n\n![](img/as_4.0_motionlayout_custom_attr_color.jpg)\n\n图 43-20\n\n\
  点击 OK 提交更改，然后选择结束约束集（在上方图 43-18 中标记为 C），并重复步骤以添加自定义属性，这次指定 `#33CC33` 为颜色的 RGB 值。\n\
  \n使用时间轴滑动块或运行应用，确保按钮在动画过程中更改了颜色。\n\n这些 `CustomAttributes` 的添加将反映在 `activity_main_scene.xml`\
  \ 文件中，如下所示：\n\n```xml\n<ConstraintSet android:id=\"@+id/start\">\n    <Constraint>\n\
  \        <CustomAttribute\n            motion:attributeName=\"backgroundColor\"\n\
  \            motion:customColorValue=\"#F80A1F\" />\n    </Constraint>\n</ConstraintSet>\n\
  <ConstraintSet android:id=\"@+id/end\">\n    <Constraint>\n        <CustomAttribute\n\
  \            motion:attributeName=\"backgroundColor\"\n            motion:customColorValue=\"\
  #33CC33\" />\n    </Constraint>\n</ConstraintSet>\n```\n\n### 43.8 添加位置关键帧\n\n本教程的最后一个任务是在动画路径上添加两个位置关键帧（`KeyPosition`）以引入横向移动。在\
  \ MotionLayout 编辑器中显示过渡时间轴时，点击按钮创建一个关键帧（如上方图 43-13 所示的高亮显示），并从下方的图 43-21 所示菜单中选择\
  \ `KeyPosition` 选项：\n\n![](img/as_4.0_motionlayout_add_keyposition.jpg)\n\n图 43-21\n\
  \n在弹出的对话框中，按照图 43-22 所示设置属性：\n\n![](img/as_4.0_motionlayout_keyposition_1.jpg)\n\
  \n图 43-22\n\n点击 `Add` 按钮提交更改，然后重复上述步骤添加位置关键帧，配置如下：\n\n* 位置：75\n* 类型：parentRelative\n\
  * PercentX：0.85\n* PercentY：0.75\n\n完成这些更改后，`activity_main_scene.xml` 中的 `transition`\
  \ 元素将添加以下关键帧项：\n\n```xml\n<KeyFrameSet>\n    <KeyPosition\n        motion:motionTarget=\"\
  @+id/myButton\"\n        motion:framePosition=\"25\"\n        motion:keyPositionType=\"\
  parentRelative\"\n        motion:percentX=\"0.15\"\n        motion:percentY=\"0.25\"\
  \ />\n    <KeyPosition\n        motion:motionTarget=\"@+id/myButton\"\n        motion:framePosition=\"\
  75\"\n        motion:keyPositionType=\"parentRelative\"\n        motion:percentX=\"\
  0.85\"\n        motion:percentY=\"0.75\" />\n</KeyFrameSet>\n```\n\n最后测试一次应用，验证按钮现在按照所示路径进行旋转并改变颜色：\n\
  \n![](img/as_4.0_motionlayout_zig_zag.jpg)\n\n图 43-23\n\n位置关键帧由预览中表示运动路径的虚线上的菱形标记表示，如图\
  \ 43-24 所示（如果标记不可见，请确保选中了 `Button` 视图）：\n\n![](img/as_4.1_motionlayout_position_markers.jpg)\n\
  \n图 43-24\n\n要视觉上调整关键帧的位置，只需点击标记并将其拖到新位置。随着标记移动，Motion Layout 编辑器将显示网格以及当前的 `x`\
  \ 和 `y` 坐标：\n\n![](img/as_4.1_motionlayout_position_marker_drag.jpg)\n\n图 43-25\n\
  \n### 43.9 总结\n\n本章介绍了 Android Studio 中的 MotionLayout 编辑器，并探索了如何在无需手动编写 XML 声明的情况下为界面添加动画。本章涵盖的示例包括将\
  \ `ConstraintLayout` 容器转换为 `MotionLayout`、在 `MotionScene` 文件中创建起始和结束约束集以及过渡以及添加\
  \ `OnClick` Handler。还涵盖了动画预览器、自定义属性和位置关键帧的使用。\n\n## 44. MotionLayout Cycle 教程\n\n\
  之前的章节介绍并演示了使用 MotionLayout 容器结合 Android Studio MotionLayout 编辑器功能将动画集成到 Android\
  \ 应用用户界面的概念。标题为“MotionLayout 简介”的章节（MotionLayout_Overview.xhtml__idTextAnchor856）简要介绍了循环（`KeyCycle`）和时间循环（`KeyTimeCycle`）关键帧，并解释了如何使用它们来实现大量重复状态更改的动画。\n\
  \n本章将详细介绍循环关键帧，然后在示例项目中使用 Android Studio 和 Cycle 编辑器演示它们。\n\n### 44.1 循环关键帧概述\n\n\
  \n\n\n显然，位置关键帧（position keyframes）可以用于向动画轴添加中间状态变化。虽然这对于少量状态变化效果良好，但如果要实现大量的更改，将会非常繁琐。例如，为了让按钮在点击时抖动\
  \ 50 次以表示发生错误，将涉及手动创建 100 个位置关键帧来执行微小的顺时针和反时针旋转。同样，在视图跨越屏幕时实现弹跳效果也是一项同样耗时的任务。\n\n\
  对于需要重复执行状态变化的情况，`MotionLayout` 包含了 `Cycle` 和 `Time Cycle` 关键帧。这两者执行相同的任务，区别在于 `KeyCycle`\
  \ 帧是基于动画路径中的帧位置的，而 `KeyTimeCycles` 是基于每秒循环次数（Hz）的时间基础的。\n\n使用这些 `KeyCycle` 帧，动画时间轴本质上被划分为若干子部分（称为循环），每个子部分包含一个或多个波形，这些波形定义了视图属性在整个时间轴上如何修改。创建一个\
  \ `KeyCycle` 循环，需要以下信息：\n\n- `target view`（目标视图） - 要进行更改的视图的 `id`。\n- `frame position`（帧位置）\
  \ - 循环开始的时间轴位置。\n- `wave period`（波周期） - 循环中包含的波数量。\n- `attribute`（属性） - 被波形修改的视图属性。\n\
  - `wave offset`（波偏移） - 按指定的量从关键帧基准偏移循环。\n- `wave shape`（波形） - 波形的形状（`sin`、`cos`、`sawtooth`、`square`、`triangle`、`bounce`\
  \ 或 `reverse sawtooth`）。\n\n考虑以下循环关键帧集：\n\n```xml\n<KeyFrameSet>\n    <KeyCycle\n\
  \        motion:framePosition=\"0\"\n        motion:motionTarget=\"@+id/button\"\
  \n        motion:wavePeriod=\"1\"\n        motion:waveOffset=\"0dp\"\n        motion:waveShape=\"\
  sin\"\n        android:translationY=\"50dp\"/>\n    <KeyCycle\n        motion:framePosition=\"\
  25\"\n        motion:motionTarget=\"@+id/button\"\n        motion:wavePeriod=\"\
  1\"\n        motion:waveOffset=\"0dp\"\n        motion:waveShape=\"sin\"\n     \
  \   android:translationY=\"50dp\"/>\n    <KeyCycle\n        motion:framePosition=\"\
  50\"\n        motion:motionTarget=\"@+id/button\"\n        motion:wavePeriod=\"\
  1\"\n        motion:waveOffset=\"0dp\"\n        motion:waveShape=\"sin\"\n     \
  \   android:translationY=\"50dp\"/>\n    <KeyCycle\n        motion:framePosition=\"\
  75\"\n        motion:motionTarget=\"@+id/button\"\n        motion:wavePeriod=\"\
  1\"\n        motion:waveOffset=\"0dp\"\n        motion:waveShape=\"sin\"\n     \
  \   android:translationY=\"50dp\"/>\n    <KeyCycle\n        motion:framePosition=\"\
  100\"\n        motion:motionTarget=\"@+id/button\"\n        motion:wavePeriod=\"\
  1\"\n        motion:waveOffset=\"0dp\"\n        motion:waveShape=\"sin\"\n     \
  \   android:translationY=\"50dp\"/>\n</KeyFrameSet>\n```\n\n上述关键帧集将时间轴分为四个相等的循环。每个循环都被配置为包含一个\
  \ `sin` 波形，该波形将按钮的 `translationY` 属性调整 50dp。执行时，此动画将导致按钮在指定范围内多次垂直振荡。此关键帧集可以可视化，如图\
  \ 44-1 所示，其中五个点代表关键帧位置：\n\n![](img/as_4.0_keycycle_simple_sin.jpg)\n\n图 44-1\n\n\
  按照目前的实现方式，每个循环包含单个波形。假设我们需要的不是均匀分布的波形，而是在最后一个循环内需要四个波形。可以通过如下方式增加最后一个 `KeyCycle`\
  \ 元素的 `wavePeriod` 属性来轻松实现：\n\n```xml\n<KeyCycle\n    motion:framePosition=\"75\"\
  \n    motion:target=\"@+id/button\"\n    motion:wavePeriod=\"4\"\n    motion:waveOffset=\"\
  0dp\"\n    motion:waveShape=\"sin\"\n    android:translationY=\"50dp\"/>\n```\n\n\
  在进行此更改后，帧集可以如下图所示以波形形式渲染：\n\n![](img/as_4.0_keycycle_sin_waveperiod.jpg)\n\n图 44-2\n\
  \n到目前，本章的示例一直使用 `sin` 波。事实上，在 `MotionLayout` 中处理循环关键帧时，可以使用许多不同的波形。图 44-3 说明了将所有循环关键帧的\
  \ `waveShape` 属性更改为 `sawtooth`（锯齿）形状的效果：\n\n![](img/as_4.0_cycle_sawtooth.jpg)\n\
  \n图 44-3\n\n除了 `sin` 和 `sawtooth`，`MotionLayout` 还支持 `triangle`、`square`、`bounce`\
  \ 和 `reverse sawtooth` 形状。\n\n在上面的示例中，每个循环都在 Y 轴上以相同的范围移动按钮。然而，假设我们需要第二个循环沿正 Y 轴移动按钮的距离更远。这涉及对第二个循环的\
  \ `waveOffset` 属性进行如下调整：\n\n```xml\n<KeyCycle\n    motion:framePosition=\"25\"\n\
  \    motion:target=\"@+id/button\"\n    motion:wavePeriod=\"1\"\n    motion:waveOffset=\"\
  0dp\"\n    motion:waveShape=\"sin\"\n    android:translationY=\"50dp\"/>\n```\n\n\
  通过此更改，我们得到的时间轴以波形呈现，类似于图 44-4：\n\n![](img/as_4.0_keycycle_sin_waveoffset.jpg)\n\n\
  图 44-4\n\n目前，按钮在第二个循环期间的范围在 0 到 150dp 之间。如果我们仍然需要范围的低端匹配其他波形，当然可以在 `translationY`\
  \ 值上添加 100dp：\n\n```xml\n<KeyCycle\n    motion:framePosition=\"25\"\n    motion:target=\"\
  @+id/button\"\n    motion:wavePeriod=\"1\"\n    motion:waveOffset=\"100dp\"\n  \
  \  motion:waveShape=\"sin\"\n    android:translationY=\"150dp\"/>\n```\n\n此更改给了我们如下波形：\n\
  \n![](img/as_4.0_keycycle_sin_waveoffset_flat.jpg)\n\n图 44-5\n\n## 44.2 使用 Cycle\
  \ Editor\n\n虽然并不复杂，但通过直接编辑 `MotionScene` 文件中的 `KeyCycle` 条目来获得所需的循环配置可能需要一些时间。考虑到这一点，Google\
  \ 的 Android 工程师开发了 `Cycle Editor`。这是一个独立的 Java 工具，尚未加入 Android Studio。`Cycle Editor`\
  \ 允许你可视化地设计和测试关键帧集。\n\nCycle Editor 工具以 Java 归档（.jar）的形式提供，需要在开发系统中安装 Java 运行时。安装\
  \ Java 的步骤取决于你的操作系统。\n\n安装 Java 后，可以从以下 URL 下载 `CycleEditor.jar` 文件：\n\n`https://github.com/googlesamples/android-ConstraintLayoutExamples/releases/download/1.0/CycleEditor.jar`\n\
  \n下载完成后，打开命令行提示符或终端，切换到 jar 文件所在的目录并运行以下命令：\n\n```bash\njava -jar CycleEditor.jar\n\
  ```\n\n工具加载后，将出现如图 44-6 所示的屏幕：\n\n![](img/as_4.0_keycycle_editor_main.jpg)\n\n图\
  \ 44-6\n\n图中标记为 A 的面板显示关键帧集的 XML，可以直接编辑，也可以通过面板 B 中的控件进行编辑。面板 C 显示循环的波形渲染结果。遗憾的是，在进行更改时它不会实时重绘。相反，必须选择\
  \ `File -> parse xml` 菜单来刷新。标记为 D 的面板将在点击面板 B 中的播放按钮时，显示循环动画的实时渲染。\n\n\n\n\n###\
  \ 44.3 创建 KeyCycleDemo 项目\n\n从欢迎屏幕选择 `New Project` 选项，在出现的新项目对话框中，点击 `Next` 按钮之前，选择\
  \ `Empty Activity` 模板。\n\n在 `Name` 字段中输入 `KeyCycleDemo`，并指定 `com.ebookfrenzy.keycycledemo`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置更改为 `API 26: Android 8.0 (Oreo)`，并将\
  \ `Language` 菜单更改为 `Java`。\n\n在布局编辑器处于 `Design` 模式并打开了 `activity_main.xml` 文件的情况下，右键点击\
  \ `ConstraintLayout` 条目并选择 `Convert to MotionLayout` 选项：\n\n![](img/as_4.0_motionlayout_conversion1.jpg)\n\
  \n图 44-7\n\n选择后，点击确认对话框中的 `Convert` 按钮。\n\n### 44.4 配置起始和结束约束\n\n本教程的目标是制作按钮从设备屏幕一侧移动到另一侧的动画，包括\
  \ KeyCycle 效果，这些效果会使视图沿 Y 轴上下移动。第一步是配置起始和结束约束。\n\n将 `activity_main.xml` 文件加载到 `MotionLayout`\
  \ 编辑器中，选择并删除默认的 `TextView` 小部件。在从调色板拖放 `Button` 视图之前，确保 `Motion Layout` 框（在下方 图\
  \ 44-9 中标记为 `E`）已选中，以便该视图在垂直方向上居中并放置在布局画布的左边缘：\n\n![](img/as_4.1_keycycledemo_button_added.jpg)\n\
  \n图 44-8\n\n要配置起始点的约束，请在编辑器窗口中选择起始约束集条目（在下方 图 44-9 中标记为 `A`）：\n\n![](img/as_4.0_keycycle_motionlayout_editor_labelled.jpg)\n\
  \n图 44-9\n\n接下来，在 `ConstraintSet` 列表中选择按钮条目（`B`）。在保持按钮条目选中状态的情况下，点击 `edit` 按钮（`C`）并从菜单中选择\
  \ `Create Constraint`。\n\n在按钮仍选中的情况下，使用 `Attributes` 工具窗口为视图的 `top`、`left` 和 `bottom`\
  \ 侧设置约束如下：\n\n![](img/as_4.0_keycycle_start_constraint.jpg)\n\n图 44-10\n\n选择结束约束集条目（在上方\
  \ 图 44-9 中标记为 `D`），并重复步骤创建一个新约束，这次对按钮的 `top`、`bottom` 和 `right` 边缘设置约束：\n\n![](img/as_4.0_keycycle_end_constraint.jpg)\n\
  \n图 44-11\n\n## 44.5 创建循环 (Cycles)\n\n下一步是使用 `Cycle Editor` 为动画生成循环关键帧。在 `Cycle\
  \ Editor` 运行时，请参考下方 图 44-12 所示的控制面板：\n\n![](img/as_4.0_keycycle_control_panel_labelled.jpg)\n\
  \n使用标记为 `A` 的菜单，将要修改的属性从 `rotation` 更改为 `translationY`。\n\n接下来，使用 `KeyCycle` 控制（`B`）选择\
  \ `cycle 0`，这样在面板其他处的更改将应用到第一个循环。将 `Period` 滑块移动到 `1`，并将 `translationY` 滑块移动到 `60`，如\
  \ 图 44-13 所示（在在移动滑块时，参考 XML 面板以查看 `translationY` 值的精确设置）：\n\n![](img/as_4.0_keycycle_editor_cyclekey_0.jpg)\n\
  \n图 44-13\n\n为了在图中看到目前为止的变化，选择 `File -> Parse XML` 菜单选项。使用 表 44-1 中列出的值，配置 `KeyFrames\
  \ 1` 到 `4` 的设置（记住你已经配置了 `KeyCycle 0` 列中的设置）：\n\n|  | KeyCycle 0 | KeyCycle 1 | KeyCycle\
  \ 2 | KeyCycle 3 | KeyCycle 4 |\n| --- | --- | --- | --- | --- | --- |\n| Position\
  \ | 0 | 25 | 50 | 75 | 100 |\n| Period | 1 | 2 | 3 | 2 | 1 |\n| translationY | 60\
  \ | 60 | 150 | 60 | 60 |\n\n表 44-1\n\n完成这些更改后，关键帧集 XML 应该如下：\n\n```xml\n<KeyFrameSet>\n\
     <KeyCycle\n       motion:framePosition=\"0\"\n       motion:motionTarget=\"@+id/button\"\
  \n       motion:wavePeriod=\"1\"\n       motion:waveOffset=\"0dp\"\n       motion:waveShape=\"\
  sin\"\n       android:translationY=\"60dp\"/>\n   <KeyCycle\n       motion:framePosition=\"\
  25\"\n       motion:motionTarget=\"@+id/button\"\n       motion:wavePeriod=\"2\"\
  \n       motion:waveOffset=\"0dp\"\n       motion:waveShape=\"sin\"\n       android:translationY=\"\
  60dp\"/>\n   <KeyCycle\n       motion:framePosition=\"50\"\n       motion:motionTarget=\"\
  @+id/button\"\n    motion:wavePeriod=\"3\"\n       motion:waveOffset=\"0dp\"\n       motion:waveShape=\"\
  sin\"\n       android:translationY=\"150dp\"/>\n   <KeyCycle\n       motion:framePosition=\"\
  75\"\n       motion:motionTarget=\"@+id/button\"\n       motion:wavePeriod=\"2\"\
  \n       motion:waveOffset=\"0dp\"\n       motion:waveShape=\"sin\"\n       android:translationY=\"\
  60dp\"/>\n   <KeyCycle\n      motion:framePosition=\"100\"\n       motion:motionTarget=\"\
  @+id/button\"\n       motion:wavePeriod=\"1\"\n       motion:waveOffset=\"0dp\"\n\
         motion:waveShape=\"sin\"\n       android:translationY=\"60dp\"/>\n</KeyFrameSet>\n\
  ```\n\n要查看带有循环的图形，选择 `File -> parse xml` 选项以刷新波形，它现在应该像 图 44-14 所示：\n\n![](img/as_4.0_keycycle_editor_cyclekeys_complete.jpg)\n\
  \n图 44-14\n\n### 44.6 预览动画\n\n现在可以在 `Cycle Editor` 工具中预览基于循环的动画。点击 `play` 按钮启动动画（在\
  \ 图 44-15 中标记为 `A`）。要将循环与水平移动结合，将第二个菜单（`B`）从 `Stationary` 更改为 `East`。此外，花时间尝试 `time`\
  \ 和 `linearity` 设置（`C` 和 `D`）。\n\n![](img/as_4.0_keycycle_play_buttons.jpg)\n\n\
  图 44-15\n\n## 44.7 将 KeyFrameSet 添加到 MotionScene\n\n在 `Cycle Editor` 中，从 XML 面板复制并粘贴到\
  \ Android Studio 中 `res -> xml -> activity_main_scene.xml` 文件的 `Transition` 部分，使其位于现有的\
  \ `KeyFrameSet` 标记之间。还要注意增加的时间设置以及用于启动动画的 `OnClick` 处理程序：\n\n```xml\n<Transition\n\
     motion:constraintSetEnd=\"@+id/end\"\n   motion:constraintSetStart=\"@id/start\"\
  \n   motion:duration=\"7000\">\n   <KeyFrameSet>\n    <KeyCycle\n       motion:framePosition=\"\
  0\"\n       motion:motionTarget=\"@+id/button\"\n       motion:wavePeriod=\"1\"\n\
         motion:waveOffset=\"0dp\"\n       motion:waveShape=\"sin\"\n       android:translationY=\"\
  60dp\"/>\n    <KeyCycle\n       motion:framePosition=\"25\"\n.\n.\n    </KeyFrameSet>\n\
     <OnClick motion:targetId=\"@id/button\"\n      motion:clickAction=\"toggle\"\
  \ />\n\n.\n.\n```\n\n在继续之前，检查每个目标属性是否正确声明。在编写本文时，Cycle Editor 使用的是过时的 `motion:target`\
  \ 标签。例如：\n\n`motion:target=\"@+id/button\"`\n\n需要将这五个 `KeyCycle` 条目中的每一个更改为：\n\n\
  `motion:motionTarget=\"@+id/button\"`\n\n完成这些更改后，在设备或模拟器上编译并运行应用程序，点击按钮开始并查看动画。\n\
  \n注意在 Android Studio MotionLayout 编辑器中也可以查看循环波形形成，如下方 图 44-16 所示：\n\n![](img/as_4.0_keycycle_motionlayout_timeline_waves.jpg)\n\
  \n图 44-16\n\n循环关键帧集不仅限于每个动画只有一个。例如，在 `activity_main_scene.xml` 文件的 `Transition`\
  \ 部分添加以下 `KeyFrameSet`，以便为移动的按钮添加一些旋转效果：\n\n```xml\n<KeyFrameSet>\n   <KeyCycle\n\
        motion:framePosition=\"0\"\n```\n\n\n\n\n```xml\nmotion:motionTarget=\"@+id/button\"\
  \nmotion:wavePeriod=\"1\"\nmotion:waveOffset=\"0dp\"\nmotion:waveShape=\"sin\"\n\
  android:translationY=\"60dp\"\nandroid:rotation=\"45\"/>\n<KeyCycle\n    motion:framePosition=\"\
  25\"\n    motion:motionTarget=\"@+id/button\"\n    motion:wavePeriod=\"2\"\n   \
  \ motion:waveOffset=\"0dp\"\n    motion:waveShape=\"sin\"\n    android:translationY=\"\
  60dp\"\n    android:rotation=\"80\"/>\n<KeyCycle\n    motion:framePosition=\"50\"\
  \n    motion:motionTarget=\"@+id/button\"\n    motion:wavePeriod=\"3\"\n    motion:waveOffset=\"\
  0dp\"\n    motion:waveShape=\"sin\"\n    android:translationY=\"150dp\"\n    android:rotation=\"\
  45\"/>\n<KeyCycle\n    motion:framePosition=\"75\"\n    motion:motionTarget=\"@+id/button\"\
  \n    motion:wavePeriod=\"2\"\n    motion:waveOffset=\"0dp\"\n    motion:waveShape=\"\
  sin\"\n    android:translationY=\"60dp\"\n    android:rotation=\"80\"/>\n<KeyCycle\n\
  \    motion:framePosition=\"100\"\n    motion:motionTarget=\"@+id/button\"\n   \
  \ motion:wavePeriod=\"1\"\n    motion:waveOffset=\"0dp\"\n    motion:waveShape=\"\
  sin\"\n    android:translationY=\"60dp\"\n    android:rotation=\"45\"/>\n</KeyFrameSet>\n\
  ```\n\n### 44.8 总结\n\n循环关键帧（Cycle key frames）为构建帧动画提供了一种有效的方法，涉及匹配波形的大数量状态变化。正如本章概述，通过\
  \ Cycle Editor 应用可以显著简化生成这些循环关键帧的过程。\n\n## 45. 使用悬浮按钮（Floating Action Button）和 Snackbar\n\
  \n本章的目标之一是提供材料设计（material design）概念的概述。材料设计最初作为 Android 5.0 的引入，是一套设计指南，规定了 Android\
  \ 用户界面以及运行在 Android 上的应用的外观和行为。\n\n作为实现材料设计概念的一部分，Google 还引入了 Android 设计支持库（Android\
  \ Design Support Library）。该库包含了许多不同的组件，允许将材料设计的许多关键功能构建到 Android 应用中。这些组件中的两个——悬浮按钮和\
  \ Snackbar，将在后续章节介绍其他组件之前在本章中介绍。\n\n### 45.1 材料设计\n\nAndroid 环境的整体外观由材料设计的原则定义。材料设计由\
  \ Google 的 Android 团队创建，它规定构成 Android 用户界面和运行在 Android 上的应用元素在行为、阴影、动画和样式方面以特定方式呈现和运行。材料设计的原则之一是用户界面的元素似乎具有物理深度，并且具有项目是由物理材料层构建的感。例如，按钮通过使用阴影效果似乎悬浮于其所在的布局表面之上。按下按钮时，按钮也会弯曲并抬起。\n\
  \n\n\n\n```xml\nandroid:layout_marginEnd=\"@dimen/fab_margin\"\nandroid:layout_marginBottom=\"\
  16dp\"\napp:srcCompat=\"@android:drawable/ic_dialog_email\" />\n```\n\n此代码声明按钮将出现在屏幕右下角，边距由\
  \ `values/dimens.xml` 文件中的 `fab_margin` 标识符表示（在本例中被设置为 `16dp`）。`XML` 进一步声明按钮的内部图标将采用标准的内置\
  \ drawable 电子邮件图标形式。\n\n空白模板还配置了悬浮操作按钮，在用户点击时显示 `Snackbar` 实例。实现此功能的代码可以在 `MainActivity.java`\
  \ 文件的 `onCreate()` 方法中找到，内容如下：\n\n```java\nbinding.fab.setOnClickListener(new View.OnClickListener()\
  \ {\n    @Override\n    public void onClick(View view) {\n        Snackbar.make(view,\
  \ \"Replace with your own action\", Snackbar.LENGTH_LONG)\n                 .setAction(\"\
  Action\", null).show();\n    }\n});\n```\n\n该代码通过视图绑定（view binding）访问悬浮操作按钮，并为其添加了一个\
  \ `onClickListener` 处理器，在按钮被点击时调用。此方法仅显示了一个配置了消息但没有操作的 `Snackbar` 实例。\n\n当编译并运行项目时，悬浮操作按钮出现在屏幕底部，如图\
  \ 45-3 所示：\n\n![](img/fab_button.jpg)\n\n图 45-3\n\n点击悬浮操作按钮将触发 `onClickListener`\
  \ 处理器方法，导致 `Snackbar` 出屏幕底部：\n\n![](img/fab_snackbar.jpg)\n\n图 45-4\n\n### 45.7\
  \ 移除导航功能\n\n如《Android Studio 布局编辑器指南》所述，`Basic Activity` 模板包含多个片段和按钮，用于在不同片段之间导航。对于本教程而言，这些功能是不必要的，如果不移除，稍后将会引起问题。在继续教程之前，请按照以下方式修改项目：\n\
  \n1. 在 `Project` 工具窗口中，导航并双击 `app -> res -> navigation -> nav_graph.xml` 文件，将其加载到导航编辑器中。\n\
  2. 在编辑器中，在 `Component Tree` 面板中选择 `SecondFragment` 项，并按键盘删除键将其从图中移除。\n3. 找到并删除 `SecondFragment.java`（`app\
  \ -> java -> <package name> -> SecondFragment`）和 `fragment_second.xml`（`app -> res\
  \ -> layout -> fragment_second.xml`）文件。\n4. 找到 `FirstFragment.java` 文件，双击加载到编辑器并移除\
  \ `onViewCreated()` 方法中的代码，使其内容如下：\n\n```java\nbinding.buttonFirst.setOnClickListener(new\
  \ View.OnClickListener() {\n    @Override\n    public void onClick(View view) {\n\
  \        NavHostFragment.findNavController(FirstFragment.this)\n               \
  \  .navigate(R.id.action_FirstFragment_to_SecondFragment);\n    }\n});\n```\n\n\
  ### 45.8 更改悬浮操作按钮\n\n由于本示例的目标是配置悬浮操作按钮向列表添加条目，因此当前按钮上显示的电子邮件图标需要更改为更能指示所执行操作的内容。按钮将使用的图标名为\
  \ `ic_add_entry.png`，可以在从以下 URL 下载的示例代码 `project_icons` 文件夹中找到：\n\n[`www.ebookfrenzy.com/retail/eeljava/index.php`](https://www.ebookfrenzy.com/retail/eeljava/index.php)\n\
  \n在您的操作系统的文件导航器中找到此图像并复制图像文件。在 `Project` 工具窗口中右键点击 `app -> res -> drawable` 项，从菜单中选择\
  \ `Paste`（粘贴）将文件添加到文件夹：\n\n![](img/as_fab_icon_added.jpg)\n\n图 45-5\n\n接下来，编辑 `activity_main.xml`\
  \ 文件，将图标的图像源从 `@android:drawable/ic_dialog_email` 更改为 `@drawable/ic_add_entry`如下：\n\
  \n```xml\n<com.google.android.material.floatingactionbutton.FloatingActionButton\n\
  \    android:id=\"@+id/fab\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:layout_gravity=\"bottom|end\"\n    android:layout_margin=\"\
  @dimen/fab_margin\"\n    android:layout_marginBottom=\"16dp\"\n    app:srcCompat=\"\
  @drawable/ic_add_entry\" />\n```\n\n在布局预览中，按钮的内部图标将更改为加号。\n\n我们也可以通过通过添加 `onClickListener`\
  \ 让悬浮操作按钮在点击时执行几乎任何操作。例如，对 `MainActivity.java` 文件的以下更改调用了名为 `displayMessage()` 的方法来显示\
  \ toast：\n\n```java\n.\nbinding.fab.setOnClickListener(new View.OnClickListener()\
  \ {\n    @Override\n    public void onClick(View view) {\n        Snackbar.make(view,\
  \ \"Replace with your own action\", Snackbar.LENGTH_LONG)\n                 .setAction(\"\
  Action\", null).show();\n    }\n});\n.\n\npublic void displayMessage(String message)\
  \ {\n    Toast.makeText(this,message,Toast.LENGTH_SHORT).show();\n}\n```\n\n###\
  \ 45.9 为 Snackbar 添加操作\n\n也可以为 `Snackbar` 添加操作，在用户点击时执行特定任务。编辑 `MainActivity.java`\
  \ 文件并修改 `Snackbar` 的创建代码，以添加一个标题为“My Action”并配置了 `onClickListener` 的操作：\n\n```java\n\
  binding.fab.setOnClickListener(new View.OnClickListener() {\n    @Override\n   \
  \ public void onClick(View view) {\n        Snackbar.make(view, \"Replace with your\
  \ own action\", Snackbar.LENGTH_LONG)\n                 .setAction(\"My Action\"\
  , actionOnClickListener).show();\n    }\n});\n```\n\n在 `MainActivity.java` 文件中添加监听处理器：\n\
  \n```java\nView.OnClickListener actionOnClickListener = new View.OnClickListener()\
  \ {\n    @Override\n    public void onClick(View view) {\n        displayMessage(\"\
  Action clicked\");\n        Snackbar.make(view, \"Action Complete\", Snackbar.LENGTH_LONG)\n\
  \                 .setAction(\"Action\", null).show();\n    }\n};\n```\n\n运行应用并点击悬浮操作按钮，此时\
  \ toast 消息和 `Snackbar` 将出现。当 `Snackbar` 可见时，点击 Snackbar 中的 My Action 按钮，验证 Snackbar\
  \ 上的文字更改为“Action Complete”：\n\n![](img/fab_action_clicked.jpg)\n\n图 45-6\n\n###\
  \ 45.10 总结\n\n本章对材料设计、悬浮操作按钮和 Snackbar 进行了概述，并并通过一个使用这些特性的示例项目进行了演示。\n\n悬浮操作按钮和\
  \ Snackbar 都是 Android 用户界面实现材料设计方法的一部分。悬浮操作按钮提供了一种推广应用程序特定屏幕内最常用操作的方式。Snackbar 则为应用程序提供了一种向用户展示信息并允许用户对其采取行动的方式。\n\
  \n## 46 使用 TabLayout 组件创建标签页界面\n\n上一章概述了 Android 中材料设计的概念，并介绍了设计支持库提供的两个组件：悬浮操作按钮和\
  \ Snackbar。本章将演示如何使用设计库的另一个组件 `TabLayout`，它可以与 `ViewPager` 类结合，在 Android Activity\
  \ 中创建标签页界面。\n\n### 46.1 ViewPager2 简介\n\n\n\n\n\n虽然 `ViewPager2` 不是设计支持库的一部分，但在与\
  \ `TabLayout` 组件配合使用时是一个非常有用的辅助类，用于实现标签页用户界面。`ViewPager2` 的主要作用是允许用户翻阅不同的信息页面，每个页面通常由一个布局片段（fragment）表示。与\
  \ `ViewPager2` 关联的片段由 `FragmentStateAdapter` 类的实例管理。\n\n至少，分配给 `ViewPager2` 的页面适配器必须实现两个方法。第一个名为\
  \ `getItemCount()`，它必须返回可供用户显示的页面片段总数。第二个方法 `createFragment()` 接收一个页码，并必须返回准备好给用户的相应片段对象。\n\
  \n### 46.2 TabLayout 组件概述\n\n如前所述，`TabLayout` 是材料设计（material design）引入的组件之一，并包含在设计支持库中。`TabLayout`\
  \ 的目的是为用户提供一行标签，可以通过选择标签向用户显示不同的页面。标签可以是固定的，也可以是滚动的，用户可以向左或向右滑动查看当前屏幕无法显示的更多标签。标签上显示的信息可以是文本、图像或文本与图像的组合。例如，图\
  \ 46-1 显示了一个包含四个显示图像标签的 App 标签栏：\n\n![](img/Image24251.jpg)\n\n图 46-1\n\n另一方面，图\
  \ 46-2 显示了一个 `TabLayout` 配置，其包含四个以可滚动配置显示文本的标签：\n\n![](img/Image24341.jpg)\n\n图\
  \ 46-2\n\n本章的剩余部分将通过创建一个示例项目，来演示如何将 `TabLayout` 组件与 `ViewPager2` 以及四个片段结合使用。\n\n\
