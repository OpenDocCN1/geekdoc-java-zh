  \ Android 架构，随后介绍了使用 Android Studio 环境设计应用程序和用户界面。\n\n章节还涵盖了 Android 组件，包括 ViewModel、生命周期管理、Room\
  \ 数据库访问、Database Inspector、LiveData 以及数据绑定。\n\n更高级的主题如 Intents 也包括屏幕处理、手势识别以及音频录制和播放。本书还涵盖了打印、折叠屏设备支持。\n\
  \n详细介绍了 Material Design 的概念，包括浮动按钮、Snackbars、标签页界面、卡片视图、导航抽屉和折叠工具栏。\n\nAndroid Studio\
  \ 的其他关键功能也包括布局编辑器、`ConstraintLayout` 和 `ConstraintSet` 类、MotionLayout、视图约束和直接通知。\n\
  \n章节还涵盖了 Android Studio 的高级功能，如 App Links、动态交付、Gradle 配置以及将应用提交到 Google Play 控制台。假设你已经具备\
  \ Java 编程经验，准备好下载 Android Studio 和 Android SDK，拥有 Windows、Mac 或 Linux 系统，并有开发某些应用程序的想法，准备好开始吧。\n\
  \n## 1.1 下载代码示例\n\n书中包含的示例源代码和 Android Studio 项目文件可以在以下地址下载：\n\nhttps://www.ebookrenzy.com/retail/eeljava/index.php\n\
  \n将代码示例加载到 Android Studio 的步骤如下：\n\n1. 在 Welcome to Android 对话框中，点击 `Open` 按钮。\n\
  2. 在项目选择对话框中，导航到要导入的项目文件夹并点击 `OK`。\n\n## 1.2 反馈\n\n我们希望你对本书的购买满意。如果你在书中发现任何错误，或有任何意见或建议，请通过\
  \ `feedback@ebookrenzy.com` 联系我们。\n\n## 1.3 勘误\n\n虽然我们尽力确保本书内容的准确性，但如此规模和复杂程度的内容不可免会包含一些错误和疏漏。任何已知问题及其解决方案将列在以下\
  \ URL：\n\nhttps://www.ebookrenzy.com/errata/eeljava.html\n\n如果你在勘误列表中未找到某个错误，请发送邮件至\
  \ `feedback@ebookrenzy.com` 通知我们的技术支持团队，他们将帮助你解决你可能遇到的任何问题。\n\n## 2. 设置 Android\
  \ Studio 开发环境\n\n在开始任何 Android 应用开发之前，第一步是配置计算机系统作为开发平台。这涉及多个步骤，包括安装 Android Studio\
  \ 集成开发环境 (IDE)，以及 Android 软件包 (SDK) 和 OpenJDK 开发环境。\n\n本章将涵盖在 Windows、macOS 和 Linux\
  \ 系统上安装 Android 开发所需组件的步骤。\n\n### 2.1 系统要求\n\n可以在以下系统类型上进行 Android 应用开发：\n\n- Windows\
  \ 8/10/11 64 位\n- 运行 Intel 或 Apple 芯片的 macOS 10.14 或更高版本\n- 带有 Intel i5 或更高处理器的\
  \ Chrome OS\n- Linux 系统，glibc 版本或更高\n- 至少 8GB RAM\n- 约 8GB 可用磁盘空间\n- 最小屏幕分辨率 1280\
  \ x 800\n\n### 2.2 下载 Android Studio 包\n\n开发 Android 应用的大部分工作将使用 Android Studio\
  \ 环境完成。本书的内容和示例是基于 Android Studio Electric Eel 2022.1.1 创建的，使用了 Android API 33 SDK\
  \ (Tiramisu)，在编写时这些都是最新版本。\n\n然而，Android Studio 会频繁更新，因此自本书出版以来可能发布了新版本。\n\n可以从以下\
  \ URL 的主下载页面下载最新版本的 Android Studio：\n\nhttps://developer.android.com/studio/index.html\n\
  \n如果此页面提供了下载新版本 Android Studio 的说明，请注意本书与软件之间可能存在某些细微差异。如果这些差异成为问题，通过网页搜索“Android\
  \ Studio Electric Eel”应该提供下载旧版本的选项。或者，访问以下网页在存档中找到 Android Studio Electric Eel 2022.1.1：\n\
  \nhttps://developer.android.com/studio/archive\n\n### 2.3 安装 Android Studio\n\n\
  下载完成后，安装 Android Studio 的具体步骤取决于执行安装的操作系统。\n\n#### 2.3.1 在 Windows 上安装\n\n在 Windows\
  \ 资源管理器窗口中找到下载的 Android Studio 安装可执行文件（命名为 `android-studio-<version>-windows.exe`），并双击它以开始安装过程，如果弹出用户帐户控制对话框，点击\
  \ `是` 按钮。\n\n一旦出现 Android Studio 安装向导，请按照各个屏幕进行配置安装，以满足你对 Android Studio 安装文件系统位置以及是否向系统其他用户提供的要求。在提示选择要安装的组件时，确保勾选\
  \ Android Studio 和 Android Virtual Device 所有选项。\n\n虽然对 Android Studio 的安装位置没有严格规定，但本书的其余部分将假设安装在\
  \ `C:\\Program Files\\Android\\Android Studio` 中，并且 Android SDK 包已安装在用户的 `AppData\\\
  Local\\Android\\sdk` 子文件夹中。配置好选项后，点击 `Install` 按钮开始安装过程。\n\n在带有开始菜单的 Windows 版本上，可以从安装期间添加到菜单的项目启动新安装的\
  \ Android Studio。可以通过导航到 Android Studio\\bin 目录，右键点击 `studio64` 可执行文件并选择“固定到任务栏”选项来方便访问。\n\
  \n#### 2.3.2 在 macOS 上安装\n\nmacOS 版 Android Studio 以磁盘镜像 (`.dmg`) 文件的形式下载。一旦下载了\
  \ `android-studio-<version>-mac.dmg` 文件，在 Finder 窗口中找到它并双击打开，如图 2-1 所示：\n\n![](img/as_dmg_drag_to_applications.jpg)\n\
  \n图 2-1\n\n要安装该包，只需将 Android Studio 图标拖动并释放到应用程序文件夹中。Android Studio 将安装到系统的应用程序文件夹中，此过程通常需要几秒钟。\n\
  \n要启动 Android Studio，请在 Finder 窗口的应用程序文件夹找到可执行文件并双击它。\n\n\n\n\n\n为了方便以后访问该工具，请从\
  \ Finder 窗口拖动 Android Studio 图标并将其置到 dock 栏上。\n\n### 2.3.3 在 Linux 上安装\n\n下载 Linux\
  \ 版本的 Android Studio 安装包后，打开终端窗口，切换到要安装 Android Studio 的目录并执行以下命令：\n\n```bash\n\
  unzip /<path to package>/android-studio-ide-<version>-linux.zip\n```\n\n请注意，Android\
  \ Studio 软件包将安装在名为 `android-studio` 的子目录下。因此，假设上述命令是在 `/home/demo` 中执行的，那么软件包将会被解压到\
  \ `/home/demo/android-studio`。\n\n要启动 Android Studio，打开终端窗口，切换到 `android-studio/bin`\
  \ 子目录并执行以下命令：\n\n```bash\n./studio.sh\n```\n\n在 64 位 Linux 系统上运行时，可能在运行 Android\
  \ Studio 之前需要安装一些 32 位的支持库。在 Ubuntu 上，可以使用以下命令安装这些库：\n\n```bash\nsudo apt-get install\
  \ libc6:i386 libncurses5:i386 libstdc++6:i386 lib32z1 libbz2-1.0:i386\n```\n\n在基于\
  \ Red Hat 和 Fedora 的 64 位系统上，使用以下命令：\n\n```bash\nsudo yum install zlib.i686 ncurses-libs.i686\
  \ bzip2-libs.i686\n```\n\n### 2.4 Android Studio 设置向导\n\n如果您之前安装过旧版本的 Android Studio，在首次启动此新版本时，可能会出现对话框，提供从之前的\
  \ Android Studio 版本导入设置的选项。如果您有旧版本的设置并希望将其导入到最新安装中，请选择相应的选项和位置。或者，指示您不需要导入任何之前的设置并点击\
  \ OK 按钮继续。\n\n如果您是第一次安装 Android Studio，在设置过程开始后出现的初始对话框可能如下面的图 2-2 所示：\n\n![](img/as_setup_wizard.jpg)\n\
  \n图 2-2\n\n如果出现此对话框，点击 Next（下一步）按钮显示安装类型屏幕（图 2-3）。在此屏幕上，点击 Next 之前选择 Standard（标准）安装选项。\n\
  \n![](img/as_setup_wizard_install_type.jpg)\n\n图 2-3\n\n在 Select UI Theme（选择 UI\
  \ 主题）屏幕上，根据您的喜好选择 Darcula 或 Light（浅色）主题。选择后，点击 Next，并在进入 License Agreement（许可协议）屏幕之前检查\
  \ Settings 选项。选择每个许可类别并启用 Accept（接受）复选框。最后，点击 Finish（完成）按钮开始安装。\n\n完成这些初始设置步骤后，点击\
  \ Finish 按钮使用您选择的 UI 主题显示 Welcome to Android Studio 屏幕：\n\n![](img/as_eel_welcome_screen.jpg)\n\
  \n图 2-4\n\n### 2.5 安装额外的 Android SDK 软件包\n\n到为止执行的步骤已经安装了 Android Studio IDE 和当前的默认\
  \ Android SDK 软件包。在继续之前，值得花些时间验证安装了哪些软件包，并安装任何缺失或需要更新的软件包。\n\n此任务可以通过点击欢迎对话框中的 More\
  \ Actions（更多操作）链接并在下拉菜单中选择 SDK Manager（SDK 管理器）选项来完成。一旦调用，将出现 Preferences（首选项）对话框中的\
  \ Android SDK 屏幕，如图 2-5 所示：\n\n![](img/as_sdk_manager.jpg)\n\n图 2-5\n\n在首次安装 Android\
  \ Studio 之后，很可能只安装了最新版本的 Android SDK。要安装旧版本的 Android SDK，只需勾选对应版本的复选框并点击 Apply（应用）按钮。本书的其余部分假设已安装了\
  \ Android Tiramisu (API Level 33) SDK。\n\n书中的大多数示例将支持低低到 Android 8.0 (Oreo) 的旧版本\
  \ Android。这是为了确保应用程序运行在广泛的 Android 设备上。在 SDK 版本列表中，启用 Android 8.0 (Oreo) 旁的复选框并点击\
  \ Apply 按钮。在生成的确认对话框中，点击 OK 按钮安装 SDK。随后的对话框将在执行安装前寻求对许可和条款的接受。安装完成后，点击 Finish。\n\
  \n可能还会列出最新 SDK 有可用更新。要访问有关待更新软件包的详细信息，请启用屏幕右下角的 Show Package Details（显示包详情）选项。这将显示与图\
  \ 2-6 类似的信息：\n\n![](img/Image2471.jpg)\n\n图 2-6\n\n上图强调了可用更新。要安装这些更新，请启用项目名称左侧的复选框并点击\
  \ Apply 按钮。\n\n除了 Android SDK 软件包外，还安装了一些构建 Android 应用程序的工具。要查看当前安装的软件包并检查更新，请留在\
  \ SDK 设置屏幕并选择 SDK Tools 选项卡，如图 2-7 所示：\n\n![](img/as_sdk_tools.jpg)\n\n图 2-7\n\n\
  在 Android SDK Tools 屏幕中，确保以下软件包在 Status（状态）列中显示为 Installed（已安装）：\n\n- Android SDK\
  \ Build-tools\n- Android Emulator\n- Android SDK Platform-tools\n- Google Play Services\n\
  - Intel x86 Emulator Accelerator (HAXM)*\n- Google USB Driver（仅限 Windows）\n- Layout\
  \ Inspector image for API 31\n\n注：Intel x86 Emulator Accelerator (HAXM) 无法在基于 Apple\
  \ silicon 的 Mac 上安装。\n\n如果上述任何软件包显示为 Not Installed（未安装）或需要更新，只需选择这些软件包并点击 Apply\
  \ 按钮。如果出现 HAXM 模拟器对话框，选择推荐的内存分配：\n\n![](img/as_haxm_memory.jpg)\n\n图 2-8\n\n安装完成后，检查软件包列表并确保所选软件包现在已为\
  \ Installed。如果仍未安装，请选中它们并点击 Apply 按钮。\n\n### 2.6 安装 Android SDK 命令行工具\n\nAndroid\
  \ Studio 包含一组工具允许从系统命令行执行某些任务。要在您的系统中安装这些工具，请打开 SDK Manager，选择 SDK Tools 选项卡并启用窗口左下角的\
  \ Show Package Details 选项。接下来，滚动软件包列表，当 Android SDK Command-line Tools (latest)\
  \ 软件包出现时，如图 2-9 所示启用它：\n\n![](img/as_install_cmdline_tools.jpg)\n\n图 2-9\n\n开发操作系统能够找到这些工具，需要将它们添加到系统的\
  \ PATH 环境变量中。无论哪种操作系统，您都需要配置 PATH 环境变量以包含以下路径（其中 `path_to_android_sdk_installation`\
  \ 代表您安装 Android SDK 的文件系统位置）：\n\n `<path_to_android_sdk_installation>/sdk/cmdline-tools/latest/bin`\n\
  - `<path_to_android_sdk_installation>/sdk/platform-tools`\n\n您可以通过启动 SDK Manager\
  \ 并参考设置面板顶部的 Android SDK Location 字段来识别 SDK 在系统上的位置，如图 2-10 所示：\n\n![](img/as_sdk_location.jpg)\n\
  \n图 2-10\n\n\n\n\n一旦确定了 SDK 的位置，将其添加到 `PATH` 变量的步骤取决于操作系统：\n\n### 2.6.1 Windows\
  \ 8.1\n\n1. 在开始屏幕上，将鼠标移动到屏幕右下角，并在弹出的菜单中选择`搜索`。在搜索框中，输入`控制面板`。当结果区域出现`控制面板` 图标时，点击它在桌面上启动该工具。\n\
  2. 在`控制面板`中，使用`类别` 菜单将显示更改为`大图标`。从图标列表中选择标记为`系统` 的项。\n3. 在`环境变量`对话框中，在`系统变量` 列表中找到\
  \ `Path` 变量，选择它并点击`编辑…` 按钮。使用编辑对话框中的`新建` 按钮向路径添加三个新条目。例如，假设 Android SDK 安装在 `C:\\\
  Users\\demo\\AppData\\Local\\Android\\Sdk`，则需要添加以下项：\n\n```\nC:\\Users\\demo\\AppData\\\
  Local\\Android\\Sdk\\cmdline-tools\\latest\\bin\nC:\\Users\\demo\\AppData\\Local\\\
  Android\\Sdk\\platform-tools\n```\n\n4. 点击每个对话框中的`确定`并关闭系统属性控制面板。\n\n通过按下键盘上的 `Windows\
  \ + R` `运行`对话框中输入 `cmd` 来打开命令提示符窗口。在`命令提示符`窗口中，输入：\n\n```cmd\necho %Path%\n```\n\
  \n返回的路径变量值应包含 Android SDK 工具文件夹的路径。可以通过尝试如下运行 `adb` 工具来验证 `platform-tools` 值是否正确：\n\
  \n```\nadb\n```\n\n执行该工具后应输出命令行选项列表。\n\n同样，通过尝试运行 `AVD Manager` 命令行工具来检查工具路径设置（如果\
  \ `avdmanager` 工具报告 Java 问题请不要担心——稍后会解决）：\n\n```\navdmanager\n```\n\n如果执行其中一个或两个命令时出现类似下面的消息，很可能是向\
  \ `Path` 环境变量中添加了错误的路径：\n\n`'adb'不是内部或外部命令，可运行程序或批文件。`\n\n### 2.6.2 Windows 10\n\
  \n右键点击`开始` 菜单，从弹出的菜单中选择`设置`，并在`查找设置`文本框中输入“编辑系统环境变量”。在`系统属性`对话框中，点击`环境变量...` 按钮。按照\
  \ Windows 8.1 列出的步骤从第 3 步开始继续。\n\n### 2.6.3 Windows 11\n\n右键点击任务栏上的`开始` 图标，从弹出的菜单中选择`设置`。当`设置`对话框出现时，向下滚动类别列表并选择“关于”选项。在“关于”屏幕上，从“相关链接”部分选择`高级系统设置`。当`系统属性`窗口出现时，点击`环境变量...`\
  \ 按钮。按照 Windows 8.1 列出的步骤从第 3 步开始继续。\n\n### 2.6.4 Linux\n\n在 Linux 上，此配置通常可以通过通过向用户主目录下的\
  \ `.bashrc` 文件中添加命令来实现（具体细节取决于所使用的特定 Linux 发行版）。假设 Android SDK 压缩包安装在 `/home/demo/Android/sdk`，`.bashrc`\
  \ 文件中的 `export` 行如下：\n\n```bash\nexport PATH=/home/demo/Android/sdk/platform-tools:/home/demo/Android/sdk/cmdline-tools/latest/bin:/home/demo/android-studio/bin:$PATH\n\
  ```\n\n另注意，上述命令将 `android-studio/bin` 目录添加了 `PATH` 变量。这将允许在终端窗口的任何当前目录下都能执行 `studio.sh`\
  \ 脚本。\n\n### 2.6.5 macOS\n\n在 macOS 上可以使用多种技术来修改 `$PATH` 环境变量。认为最干净的方法是在 `/etc/paths.d`\
  \ 目录中创建一个新文件，其中包含要添加到 `$PATH` 的路径。假设 Android SDK 安装位置为 `/Users/demo/Library/Android/sdk`，可以通过在\
  \ `/etc/paths.d` 目录下创建一个名为 `android-sdk` 的新文件并包含以下行：\n\n```\n/Users/demo/Library/Android/sdk/cmdline-tools/latest/bin\n\
  /Users/demo/Library/Android/sdk/platform-tools\n```\n\n注意，由于这是一个系统目录，在创建文件时需要使用\
  \ `sudo` 命令。例如：\n\n```bash\nsudo vi /etc/paths.d/android-sdk\n```\n\n### 2.7 Android\
  \ Studio 内存管理\n\nAndroid Studio 是一个大型且复杂的软件应用程序，由许多后台进程组成。尽管 Android Studio 过去曾因性能欠佳而受到批评，但\
  \ Google 在最近的发行中进行了显著的性能改进，并在每个新版本中持续改进。这些改进允许用户配置 Android Studio IDE 以及用于构建和运行应用程序的后台进程的内存使用。这使得软件能够利用具有较大内存的系统。\n\
  \n如果你在具有足够空闲内存来增加这些值的系统上运行 Android Studio（此功能仅适用于具有 5GB 或更多内存的 64 位系统），并发现 Android\
  \ Studio 性能似乎有所下降，那么尝试这些内存设置可能是值得的。Android Studio 还可能通过类似下所示的对话框通知你可以提高性能：\n\n![](img/as_3.5_increase_memory_notification.jpg)\n\
  \n图 2-11\n\n要查看并修改当前内存配置，请选择 `File -> Settings...`（macOS 上为 `Android Studio -> Preferences...`）菜单选项，并在出的对话框中选择\
  \ `Appearance & Behavior`，然后选择左侧导航面板中 `System Settings` 下的 `Memory Settings` 选项，如下图\
  \ 2-12 所示。\n\n在更改内存分配时，请确保不要分配超过必要的内存，或在不减慢其他进程的情况下超过系统可承受的内存。\n\n![](img/memory_settings.jpg)\n\
  \n图 2-12\n\nIDE 堆大小（IDE heap size）设置调整分配给 Android Studio 的内存，并且无论当前加载的项目如何都生效。另一方面，当从\
  \ Android Studio 内部构建和运行项目时，许多后台进程（称为守护进程 daemon）会执行编译和运行应用程序的任务。在编译和运行大型复杂项目时，可以通过调整守护进程堆设置来改进构建时间。与\
  \ IDE 堆设置不同，这些守护进程设置仅适用于当前项目，并且只有在 Android Studio 中打开项目时才能访问。\n\n### 2.8 更新 Android\
  \ Studio 和 SDK\n\nAndroid Studio 和 Android SDK 不经常会发布新版本。新版本的 SDK 使用 `Android SDK\
  \ Manager` 安装。Android Studio 通常会在更新可用时通知你。\n\n要手动检查 Android Studio 更新，请使用 Android\
  \ Studio 主窗口中的 `Help -> Check for Updates...` 菜单选项（macOS 上为 `Android Studio -> Check\
  \ for Updates...`）。\n\n### 2.9 总结\n\n在开始开发 Android 应用程序之前，第一步是设置适当的开发环境。这包括 Android\
  \ SDK 和 Android Studio（它还包含 OpenJDK 开发环境）。在本章中，我们涵盖了在 Windows、macOS 和 Linux 上安装这些包所需的步骤。\n\
  \n# 3. 在 Android Studio 中创建一个示例 Android 应用\n\n\n\n\n本书前面的章节已经涵盖了配置适用于 `Android Studio`\
  \ IDE 开发 Android 应用程序的环境的步骤。在进入稍高阶的主题之前，现在是验证所有所需的开发包是否已安装并正常运行的良好时机。实现这一目标的最佳方法是创建一个\
  \ Android 应用程序并对其进行编译和运行。本章将介绍如何使用 `Android Studio` 创建 Android 应用程序项目。项目创建完成后，随后的章节将探索如何使用\
  \ Android 模拟器环境对应用程序进行测试运行。\n\n### 3.1 关于项目\n\n在本章中创建的项目是一个基础的货币汇率转换器（事实上，它非常简单，只支持从美元转换为欧元，并使用估算的汇率进行转换）。该项目还将使用\
  \ `Android Studio` 最基础的项目模板之一。这种简单易性使我们能够在不介绍 Android 应用开发的一些关键方面，而不会因为一次性尝试引入过多概念（例如推荐的应用架构和\
  \ Android 架构组件）而让初学者无从从。在遵循本章的教程时，请放心，初始示例项目中所使用的所有技术和代码将在后续章节中进行更详细的介绍。\n\n###\
  \ 3.2 创建新的 Android 项目\n\n应用程序开发过程的第一步是在 `Android Studio` 环境中创建一个新项目。因此，请先启动 `Android\
  \ Studio`，直到出现“欢迎来到 Android Studio”屏幕，如图 3-1 所示：\n\n![](img/as_eel_welcome_screen1.jpg)\n\
  \n图 3-1\n\n一旦出现此窗口，`Android Studio` 已准备好创建新项目。要创建新项目，只需点击 `New Project`（新项目）选项即可显示“新项目”向导的第一个屏幕。\n\
  \n### 3.3 创建 Activity（活动）\n\n第一步是定义为应用程序创建的初始 Activity 类型。提供了多种选项，可以为手机和和平板、Wear\
  \ OS、TV、Android 音频或 Android Things 创建项目。在开发 Android 应用程序时，可以使用多种 Activity 类型，其中许多将在后面的章节中进行详细介绍。然而，就本示例而言，只需从\
  \ `Templates`（模板）面板中选择 `Phone and Tablet`（手机和平板）选项，然后选择创建 `Empty Activity`（空活动）。`Empty\
  \ Activity` 选项会创建一个包含单个 `TextView` 对象的模板用户界面。\n\n![](img/as_template_dialog.jpg)\n\
  \n图 3-2\n\n选中 `Empty Activity` 后，点击 `Next`（下一步）继续配置项目。\n\n### 3.4 定义项目和 SDK 设置\n\
  \n在项目配置窗口 ( ) 中，将 `Name`（名称）字段设置为 `AndroidSample`。应用程序名称是在 `Android Studio` 内部引用和标识应用程序的名称，也是如果完成的应用程序要在\
  \ Google Play 商店发售时将要使用的名称。\n\n`Package name`（包名）用于在 Android 应用程序生态系统中唯一标识应用程序。虽然这可以设置为任何唯一标识您的应用程序的字符串，但传统上它是基于您域名的反转\
  \ URL，后跟应用程序名称。例如，如果您的域名是 `www.mycompany.com`，且应用程序命名为 `AndroidSample`，那么包名可以指定如下：\n\
  \n`com.mycompany.androidsample`\n\n如果您没有域名，可以在 `Company Domain`（公司域名）字段中输入任何其他字符串，或者出于测试目的使用\
  \ `example.com`，但在发布应用程序之前需要更改它：\n\n`com.example.androidsample`\n\n`Save location`（保存位置）设置将默认到位于您主目录下的名为\
  \ `AndroidStudioProjects` 文件夹中的位置，可以通过点击包含当前路径设置的文本字段右侧文件夹图标进行更改。\n\n将 `minimum\
  \ SDK`（最低 SDK）设置为 `API 26`：Android 8.0 (Oreo)。这是本书创建的大多数项目将使用的最低 SDK，除非某个必要功能仅在更高版本中可用。这里的目标是使用最新的\
  \ Android SDK 构建应用，同时保留与运行较旧版本 Android 的设备的兼容性（在这种情况下，可追溯到 Android 8.0）。`Minimum\
  \ SDK` 设置下的文字将概述目前运行该应用程序的 Android 设备百分比。点击 `Help me choose`（帮助我选择）按钮（在图 3-3 中突出显示）查看仍在使用的各种\
  \ Android 版本的完整细分：\n\n![](img/as_new_project_settings.jpg)\n\n图 3-3\n\n最后，将 `Language`（语言）菜单更改为\
  \ `Java` 并点击 `Finish`（完成）启动项目创建过程。\n\n### 3.5 修改示例应用程序\n\n此时，`Android Studio` 已创建了一个最小的示例应用程序项目并打开了主窗口。\n\
  \n![](img/as_4.1_main_window.jpg)\n\n图 3-4\n\n新创建的项目和关联文件的引用列位于主项目窗口左侧的 `Project`（项目）工具窗口。`Project`\
  \ 工具窗口有多种显示信息的模式。默认情况下，此面板应处于 `Android` 模式。此设置由面板顶部的菜单控制，如图 3-5 中突出所示。如果面板当前不是 `Android`\
  \ 模式，请使用菜单切换模式：\n\n![](img/as_project_tool_window_menu.jpg)\n\n图 3-5\n\n### 3.6\
  \ 修改用户界面\n\n我们 Activity 的界面设计存储在名为 `activity_main.xml` 的文件中，该文件位于项目层次结构中的 `app ->\
  \ res -> layout` 下。在 `Project` 工具窗口找到该文件后，双击将其加载到用户界面 `Layout Editor`（布局编辑器）工具中，该工具将出现在\
  \ `Android Studio` 主窗口的中间面板：\n\n![](img/as_4.1_layout_editor.jpg)\n\n图 3-6\n\n在\
  \ `Layout Editor` 窗口顶部工具栏上有一个菜单（在上方图中设置为 `Pixel`），它反映在 `Layout Editor` 面板中设备视觉表示上。通过点击此菜单可以选择广泛的其他设备选项。\n\
  \n要在设备表示的横屏和竖屏之间切换方向，请直接使用设备选择菜单左侧的显示 ![](img/as_4.1_orientation.jpg) 图标的下拉菜单。使用\
  \ `night mode`（夜模式）按钮 ![](img/as_night_mode.jpg)) 来关闭夜模式。\n\n从设备屏幕可以看到，内容布局已经包含了一个显示“Hello\
  \ World!”消息的标签。面板左侧运行着 `palette`（调色板），包含了用于构建用户界面的不同类别用户界面组件，例如按钮、标签和文本字段。然而需要注意的是，并不是所有的用户界面组件对用户都是可见的。其中一类是布局。Android\
  \ 支持多种布局，对视觉用户界面组件在屏幕上的定位和管理提供不同程度的控制。虽然从用户界面的视觉上很难判断，但当前的设计是使用 `ConstraintLayout`\
  \ 创建的。这可以通过查看 `Component Tree`（组件树）面板中的信息来确认，该面板默认位于 `Layout Editor` 面板的左下角，如图 3-7\
  \ 所示：\n\n![](img/as_4.1_component_tree.jpg)\n\n图 3-7\n\n\n\n\n从组件树层级结构中看到，用户界面布局由一个\
  \ `ConstraintLayout` 父容器和一个 `TextView` 子对象组成。\n\n在继续之前，还要检查布局编辑器的 `Autoconnect`（自动连接）模式是否启用。这意味着当组件被添加到布局中时，布局编辑器会自动添加约束条件，以确保组件在不同的屏幕尺寸和设备方向上都能正确定位（该主题将在后续章节中进行更详细的介绍）。`Autoconnect`\
  \ 按钮出现在布局编辑器的工具栏中，用磁铁图标表示。当禁用时，磁铁图标上会出现一条斜线（图 3-8）。如有必要，可以通过点击此按钮重新启用 Autoconnect\
  \ 模式。\n\n![](img/as_autoconnect_button.jpg)\n\n图 3-8\n\n修改应用程序的下一步是向布局添加一些额外的组件，其中第一个是\
  \ `Button`（按钮），供用户点击以启动货币转换。\n\n`Palette`（调色板）面板由两列组成，左列包含视图组件类别列表。右列列出当前选定类别包含的组件。例如，在\
  \ 图 3-9 中，当前在 `Buttons` 类别中选择了 `Button` 视图：\n\n![](img/as_4.1_palette.jpg)\n\n图\
  \ 3-9\n\n从 `Buttons` 列表中点击并拖动 `Button` 对象，将其释放到用户界面设计的水平中心，使其位于现有 `TextView` 控件下方：\n\
  \n![](img/as_4.1_androidsample_button_added.jpg)\n\n图 3-10\n\n下一步是更改 `Button` 组件当前显示的文本。位于设计区域右侧的面板是\
  \ `Attributes`（属性）面板。该面板显示分配给布局中当前选定组件的属性。在此面板中，在 `Common Attributes`（常用属性）部分找到\
  \ `text` 属性，并如 图 3-11 所示，将当前值从“Button”更改为“Convert”：\n\n![](img/as_4.1_text_attribute.jpg)\n\
  \n图 3-11\n\n第二个文本属性旁边有一个扳手允许设置文本属性，该属性仅在布局编辑器工具中显示，而在运行时不会显示。这对于测试视觉组件和布局在不同设置下的行为非常有用，而无需反复运行应用。\n\
  \n为了防万一 `Autoconnect` 系统未能设置所有布局连接，点击 `Infer constraints`（推断约束）按钮（图 3-12）为布局添加任何缺失的约束：\n\
  \n![](img/as_layout_editor_toolbar.jpg)\n\n图 3-12\n\n此时，重要的是解释位于布局编辑器工具右上角的警告按钮，如\
  \ 图 3-13 所示。显然，这表示布局可能存在问题。要需有关任何问题的详细信息，请点击该按钮：\n\n![](img/as_3.6_layout_warnings.jpg)\n\
  \n图 3-13\n\n点击后，将出现 `Problems`（问题）工具窗口（图 3-14），描述问题的性质：\n\n![](img/as_layout_and_qualifiers.jpg)\n\
  \n图 3-14\n\n此工具窗口分为两个面板。左侧面板（上图标记为 A）列出了在布局文件中检测到的问题。在我们的示例中，仅列出了以下问题：\n\n```\n\
  button <Button>: Hardcoded text\n```\n\n当从列表中一个项目 (B) 时，右侧面板将更新以提供有关问题的更多详细信息 (C)。在这种情况下，解释如下：\n\
  \n```\nHardcoded string \"Convert\", should use @string resource\n```\n\n工具窗口还包含一个预览编辑器\
  \ (D)，允许对布局文件进行手动修正。\n\n此 I18N 消息是在告知我们，项目未来的国际化可能存在潜在问题（“I18N”源于“internationalization”一词以“I”开头，以“N”结尾，中间有\
  \ 18 个字母）。警告在提醒我们，在开发 Android 应用时，应尽可能将文本字符串等属性和值以资源（resources）的形式存储。这样做可以通过修改资源文件而不是更改应用程序源代码来更改应用程序的外观。这在将用户界面翻译成不同的口语时尤其为有价值。如果用户界面中的所有文本都包含在一个资源文件中，例如，可以将该文件交给翻译人员，由他们执行翻译工作并返回翻译后的文件包含在应用程序中。这使得无需修改任何源代码即可针对多种语言。在这种情况下，我们将创建一个名为\
  \ `convert_string` 的新资源，并为其分配字符串“Convert”。\n\n首先点击 `Show Quick Fixes`（显示快速修复）按钮\
  \ (E)，并在菜单中选择 `Extract string resource`（提取字符串资源）选项，如 图 3-15 所示：\n\n![](img/as_quick_fix_menu.jpg)\n\
  \n图 3-15\n\n选择此选项后，将出现 `Extract Resource`（提取资源）面板（图 3-16）。在此面板中，将资源名称更改为 `convert_string`，并将资源值设置为\
  \ Convert，然后点击 OK 按钮。\n\n![](img/as_4.1_extract_resource.jpg)\n\n图 16\n\n要添加的控件是\
  \ `EditText`，用户将在其中输入金额。从 `Palette` 面板选择 `Text` 类别，并点击拖动一个 `Number (Decimal)` 组件到布局中，使其位于现有\
  \ `TextView` 控件上方。选中该控件后，使用 `Attributes` 窗口将 `hint` 属性设置为“dollars”。点击警告图标并将字符串提取为资源\
  \ `dollars_hint`。\n\n稍后编写的代码需要访问用户输入 `EditText` 字段的美元值。它将通过引用分配给控件的 `id` 来。在布局中选中控件时，可以在\
  \ `Attributes` 窗口查看并更改 Android 分配的默认 `id`，如 图 3-17 所示：\n\n![](img/as_4.1_change_widget_id.jpg)\n\
  \n图 3-17\n\n将 `id` 更改为 `dollarText`并在 `Rename` 对话中点击 `Refactor`（重构）按钮。这将项目其他地方对旧\
  \ `id` 的引用自动更新为新的 `id`：\n\n![](img/as_4.1_rename_dialog.jpg)\n\n图 3-18\n\n重复步骤将\
  \ `TextView` 控件的 `id` 设置为 `textView`。\n\n点击 `Infer constraints` 按钮添加任何缺失的布局约束。此时，布局应类似于\
  \ 图 3-19 所示：\n\n![](img/as_4.1_androidsample_ui.jpg)\n\n图 3-19\n\n## 3.7 查看布局和资源文件\n\
  \n在继续下一步之前，我们将查看用户界面设计和资源处理的一些内部方面。在上一节中，我们通过使用布局编辑器工具修改 `activity_main.xml` 文件对用户界面进行了一些更改。事实上，布局编辑器所做的只是提供了编辑文件底层\
  \ XML 内容的用户友好方式。在实践中，没有理由不直接修改 XML 来进行用户界面更改，在某些情况下，这实际上比使用布局编辑器工具更快。布局编辑器面板的右上角有三个按钮，如下方的\
  \ 图 3-20 所示：\n\n![](img/as_4.0_layout_editor_buttons.jpg)\n\n图 3-20\n\n\n\n默认情况下，编辑器处于设计模式（Design\
  \ mode），此时仅显示布局的视觉呈现。最左侧的按钮将切换到代码模式（Code mode），显示布局的 XML；而中间的按钮将进入拆模式（Split mode），同时显示布局和\
  \ XML，如图图 3-21 所示：\n\n![](img/as_4.1_split_mode.jpg)\n\n图 3-21\n\n从 XML 文件的结构可以看出，用户界面由\
  \ `ConstraintLayout` 组件组成，该组件又是 `TextView`、`Button` 和 `EditText` 对象的父级。我们还可以看到，例如\
  \ `Button` 的文本属性被设置为我们的 `convert_string` 资源。尽管复杂性和内容各异，但所有用户界面布局都是以这种分层的、基于 XML\
  \ 的方式组织的。\n\n当 XML 布局发生更改时，这些更改将反映在布局画布上。也可以在布局画布面板内对布局进行视觉修改，更改将显示在 XML 列表中。要查看操作效果，请切换到拆模式并修改\
  \ XML 布局，将 `ConstraintLayout` 的背景颜色更改为红色调，如下：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\"\n    android:layout_width=\"match_parent\"\n\
  \    android:layout_height=\"match_parent\"\n    tools:context=\".MainActivity\"\
  \n    android:background=\"#ff2438\" >\n\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n注意，布局的颜色会实时更改以匹配 XML 文件中的新设置。同样注意，在 XML 编辑器左侧边距（也称为行槽）中，包含颜色设置的旁边会出现一个小的红色方块。这是该属性已设置为红色的视觉提示。点击红色方块将显示颜色选择器，允许选择不同的颜色：\n\
  \n![](img/as_4.1_gutter_color_chooser.jpg)\n\n图 3-22\n\n在继续之前，删除布局文件中的背景属性，以便背景恢复默认设置。\n\
  \n最后，使用 Project 面板找到 `app -> res -> values -> strings.xml` 文件，并双击它将其加载到编辑器中。目前 XML\
  \ 的内容如下：\n\n```xml\n<resources>\n    <string name=\"app_name\">AndroidSample</string>\n\
  \    <string name=\"convert_string\">Convert</string>\n    <string name=\"dollars_hint\"\
  >dollars</string>\n</resources>\n```\n\n作为资源实际应用的演示，将当前分配给 `convert_string` 资源的字符串值更改为“Convert\
  \ to Euros”，然后通过选择编辑器面板中布局文件的标签页返回布局编辑器工具。注意，布局已经获取了该字符串的新资源值。\n\n访问 XML 文件中引用的资源值还有一种快速方法。在拆模式或代码模式下使用布局编辑器工具时，点击\
  \ `text`@string/convert_string` 属性设置使其变为高亮，然后按键盘上按下 `Ctrl-B`（macOS 上为 `Cmd-B`）。Android\
  \ Studio 随后将打开 `strings.xml` 文件并将您带到该文件中声明此资源的行。利用此机会将字符串资源恢复为原始的“Convert”文本，并添加以下后续在应用代码中引用的字符串资源条目：\n\
  \n```xml\n<resources>\n    .\n    <string name=\"convert_string\">Convert</string>\n\
  \    <string name=\"dollars_hint\">dollars</string>\n    <string name=\"no_value_string\"\
  >No Value</string>\n</resources>\n```\n\n也可以通过点击编辑器窗口左上角的“Open editor”链接，使用 Android\
  \ Studio 翻译编辑器（Translations Editor）来编辑资源字符串。这将在 Android Studio 窗口的主面板中显示翻译编辑器：\n\
  \n![](img/as_translations_editor.jpg)\n\n图 3-23\n\n此编辑器允许编辑分配给资源键的字符串，并管理多种语言的翻译。\n\
  \n### 3.8 添加交互\n\n此示例项目的最后一步是使应用程序具有交互性，以便当用户在 `EditText` 字段中输入美元值并点击转换按钮时，转换后的欧元值将显示在\
  \ `TextView` 上。这涉及在 `Button` 小部件上实现一些事件处理。具体来说，需要配置 `Button`，以便在触发 `onClick` 事件时调用应用代码中的方法。事件处理可以通过多种不同的方式实现，并在稍后标题为\
  \ Android 事件处理概述与示例的章节中详细介绍。将布局编辑器返回设计模式，在布局编辑器中选择 `Button` 小部件，参考 Attributes（属性）工具窗口并指定名为\
  \ `convertCurrency` 的方法，如下所示：\n\n![](img/as_3.6_set_onclick.jpg)\n\n图 3-24\n\n注意，`onClick`\
  \ 属性的文本字段现在用红色边框高亮，警告我们该按钮已配置为调用一个不存在的方法。要解决这个问题，在 Project 窗口中双击 `MainActivity.java`\
  \ 文件（`app -> java -> <package> -> MainActivity`）将其加载到代码中，并在类中添加 `convertCurrency`\
  \ 代码，如下：\n\n```java\npackage com.ebookrenzy.androidsample;\nimport androidx.appcompat.app.AppCompatActivity;\n\
  import android.os.Bundle;\nimport android.view.View;\nimport android.widget.EditText;\n\
  import android.widget.TextView;\nimport java.util.Locale;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \    }\n\n    public void convertCurrency(View view) {\n        EditText dollarText\
  \ = findViewById(R.id.dollarText);\n        TextView textView = findViewById(R.id.textView);\n\
  \        if (!dollarText.getText().toString().equals(\"\")) {\n            float\
  \ dollarValue = Float.parseFloat(dollarText.getText().toString());\n           \
  \ float euroValue = dollarValue * 0.85F;\n            textView.setText(String.format(Locale.ENGLISH,\"\
  %.2f\", euroValue));\n        } else {\n            textView.setText(R.string.no_value_string);\n\
  \        }\n    }\n}\n```\n\n### 3.9 总结\n\n设置 Android 开发环境涉及许多步骤，尽管并不复杂。完成这些步骤后，值得运行示例以确保环境正确安装和配置。在本章中，我们创建了一个示例应用程序，并使用\
  \ Android Studio 布局编辑器工具修改了界面布局。在此过程中，我们探讨了尽可能使用资源的重要性，特别是在字符串值的情况下，并简要接触了布局的主题。\n\
  \n\n\n\n最后，在 `Button` 上添加了一个 `onClick` 事件，并连接到一个已实现的方法，该方法用于从 `EditText` 组件中提取用户输入，将美元转换为欧元，然后将结果显示在\
  \ `TextView` 上。\n\n应用程序已准备好进行测试，下一章将详细介绍为为测试目的设置模拟器所需的必要步骤。\n\n# 4. 在 Android Studio\
  \ 中创建 Android 虚拟设备 (AVD)\n\n尽管 Android Studio 的预览面板（Preview panel）允许我们看到正在设计的布局，并使用交互模式测试基本功能，但仍需编译并运行整个应用程序才能完全测试其运行情况。Android\
  \ 应用程序可以通过在物理设备上或在 Android 虚拟设备 (AVD) 模拟器环境中安装并运行来完成测试。在使用 AVD 之前，必须先创建并配置它以匹配特定设备型号的规格。在本章中，我们将以\
  \ `Pixel 4` 手机作为参考示例，完成此类虚拟设备的创建。\n\n## 4.1 关于 Android 虚拟设备\n\nAVD 本质上是模拟器，它们允许在无需将应用程序安装到物理\
  \ Android 设备上的情况下测试 Android 应用程序。AVD 可以配置为模拟各种硬件功能，包括屏幕大小、内存容量，以及是否存在摄像头、GPS 导航支持或加速度计等功能。作为\
  \ Android Studio 标准安装程序的一部分，系统安装了几个模拟器模板，允许为一系列不同的设备配置 AVD。可以通过指定处理器类型、内存容量以及屏幕尺寸和像素密度等属性，创建自定义配置以匹配任何物理\
  \ Android 设备。\n\nAVD 会话既可以以独立窗口的形式出现，也可以嵌入在 Android Studio 窗口中。\n\n新的 AVD 使用 Android\
  \ 虚拟设备管理器（Android Virtual Device Manager）创建和管理，该管理器可以在命令行模式下使用，也可以使用更友好的图形用户界面。创建新\
  \ AVD 的第一步是启动 AVD Manager。这可以在 Android Studio 环境中通过选择主窗口中的 `Tools -> Device Manager`\
  \ 菜单选项来实现。\n\n启动后，管理器将作为工具窗口形式出现，如图 4-1 所示：\n\n![](img/as_avd_manager.jpg)\n\n图\
  \ 4-1\n\n如果您是首次在计算机上安装 Android Studio（而不是升级现有的 Android Studio 安装），安装程序可能已经创建了一个可用的初始\
  \ AVD 实例，如图图 4-2 所示：\n\n![](img/as_default_avd.jpg)\n\n图 4-2\n\n如果您的系统中存在此 AVD，您可以使用它来测试应用程序。如果没有创建\
  \ AVD，或者您想为不同类型的设备创建 AVD，请按照本章其余部分的步骤进行操作。\n\n要添加新的 AVD，请确保在点击 `Create device` 按钮之前选择了\
  \ `Virtual` 选项卡，以打开虚拟设备配置对话框：\n\n![](img/as_avd_manager_select_hardware.jpg)\n\n\
  图 4-3\n\n在对话框中，执行以下步骤创建一个兼容 `Pixel 4` 的模拟器：\n\n1. 从 `Category` 面板中，选择 `Phone` 选项以显示可用的\
  \ Android 手机 AVD 模板列表。\n2. 选择 `Pixel 4` 设备选项并点击 `Next`。\n3. 在 `System Image` 屏幕上，选择最新版本的\
  \ Android。注意，如果尚未安装系统镜像，则 `Release Name` 旁边将提供 `Download` 链接。点击此链接在选择它之前下载并安装系统镜像。如果所需的镜像未列出，请点击\
  \ `x86 Images`（如果您运行带有 Apple 芯片的 Mac，请点击 `ARM images`）和 `Other images` 标签查看替代列表。\n\
  4. 点击 `Next` 继续并在 `name` 字段输入描述性名称（例如 `Pixel 4 API 33`），或直接接受默认名称。\n5. 点击 `Finish`\
  \ 创建 AVD。\n6. AVD 创建后，现在可以关闭 `Device Manager`。如果以后需要修改 AVD，只需重新打开 `Device Manager`，从列表中选择\
  \ AVD，并点击 `Actions` 列中的 `pencil icon`（铅笔图标）编辑设置。\n\n## 4.2 启动模拟器\n\n对新创建的 AVD 模拟器进行测试运行，只需从\
  \ `Device Manager` 中选择模拟器并点击 `launch` 按钮（`Actions` 列中的三角形）。模拟器将嵌入到 Android Studio\
  \ 主窗口中并开始启动过程。模拟器启动所需的时间取决于 AVD 及其运行的系统的配置：\n\n![](img/as_emulator_tool_window.jpg)\n\
  \n图 4-4\n\n要隐藏和显示模拟器工具窗口，请点击 `Emulator` 工具窗口按钮（如标记 A 所示）。点击标签页旁边的 `x` 关闭按钮 (B) 退出模拟器。模拟器工具窗口可以容纳多个模拟器会话，每个会话由一个标签页表示。例如图\
  \ 4-5 显示了一个带有两个模拟器会话的工具窗口：\n\n![](img/as_4.1_emulator_tool_window_two_sessions.jpg)\n\
  \n图 4-5\n\n要在会话之间切换，只需点击相应的标签页。\n\n尽管模拟器可能默认以竖屏方向显示，但此或其他默认选项可以更改。在 `Device Manager`\
  \ 中，选择 `Pixel 4` 条目并点击设备行中的 `pencil icon`。在配置屏幕上，找到 `Startup orientation` 部分并更改方向设置。退出并重启模拟器以使更改生效。关于模拟器的更多细节将在下一章使用和配置\
  \ Android Studio AVD 中介绍。\n\n为了节省本章后续章节的时间，请保持模拟器运行。\n\n## 4.3 在 AVD 中运行应用程序\n\n\
  有了 AVD 模拟器，早期章节创建的示例 `AndroidSample` 应用程序现在可以编译并运行。将 `AndroidSample` 项目加载到 Android\
  \ Studio 后，确保新创建的 `Pixel 4` AVD 显示在下方图 4-6 所示的设备菜单中（标记为 A），然后点击由绿色三角形表示的运行按钮 (B)，或使用快捷键\
  \ `Ctrl-R`：\n\n![](img/as_run_button.jpg)\n\n图 4-6\n\n设备菜单 (A) 可选择不同的 AVD 实例或物理设备作为运行目标，也可在多个设备上运行应用。菜单还提供了访问\
  \ `Device Manager` 以及设备连接配置和故障排除选项：\n\n![](img/as_run_target_menu.jpg)\n\n图 4-7\n\
  \n应用程序安装并运行时，第一个 fragment 的用户界面将出现在模拟器中（fragment 是 Android 项目的可重用部分，通常由用户界面布局和一些代码组成，该主题将在后续的“Android\
  \ Fragment 简介”章节](#Fragments.xhtml__idTextAnchor688)中介绍）：\n\n![](img/as_eandroid_sample_running.jpg)\n\
  \n图 4-8\n\n如果活动没有自动启动，请检查启动图标是否出现在模拟器的应用列表中。如果是，只需点击它即可启动应用程序。一旦运行过程开始，`Run` 工具窗口将可用。`Run`\
  \ 工具窗口将在应用程序包安装和启动时显示诊断信息。图 4-9 显示了典型成功启动应用程序的 `Run` 工具窗口输出：\n\n![](img/as_4.1_run_tool_window.jpg)\n\
  \n图 4-9\n\n\n\n\n如果在启动过程中遇到问题，`Run` 工具窗口将提供相关信息，这些信息可能有助于定位问题所在。\n\n假设应用程序已加载到模拟器并按预期运行，我们已经安全地验证了\
  \ Android 开发环境已正确安装并配置。现在应用正在运行，尝试进行货币兑换以验证应用是否按预期工作。\n\n## 4.4 在多个设备上运行\n\n上述图\
  \ 4-7 所示的“运行”菜单包含一个在多个模拟器和设备上并行运行应用程序的选项。选择该选项后，将显示如图 4-10 所示的对话框，列出系统上配置的所有 `AVDs`\
  \ 以及任何已连接的物理设备。在点击 `Run` 按钮之前，勾选目标模拟器或设备旁边的复选框：\n\n![](img/as_4.1_multiple_devices.jpg)\n\
  \n图 4-10\n\n点击 `Run` 按钮后，Android Studio 将会在选定的模拟器和设备上启动应用程序。\n\n## 4.5 停止运行的应用程序\n\
  \n要停止运行的应用程序，只需点击位于主工具栏上的停止按钮，如图 4-11 所示：\n\n![](img/as_stop_button.jpg)\n\n图 4-11\n\
  \n也可以使用 `Run` 工具窗口终止应用程序。首先，通过应用程序运行时变为可用的窗口栏按钮显示 `Run` 工具窗口。一旦 `Run` 工具窗口出现，点击下方图\
  \ 4-12 所示的高亮显示的停止按钮：\n\n![](img/as_4.1_stop_button_run_window.jpg)\n\n图 4-12\n\n\
  ## 4.6 支持深色主题\n\nAndroid 10 引入了备受期待的深色主题，Android Studio 应用项目默认启用了该功能的支持。要在 `AVD`\
  \ 模拟器中测试深色主题，请在模拟器中运行的 Android 实例内打开 `Settings` 应用。在 `Settings` 应用中，选择 `Display`\
  \ 类别并启用如图 4-13 所示的 `Dark theme` 选项，使屏幕背景变为黑色：\n\n![](img/as_avd_dark_theme_setting.jpg)\n\
  \n图 4-13\n\n启用深色主题后，运行 `AndroidSample` 应用，注意它以深色主题显示，包括黑色背景和按钮上的紫色背景，如图 4-14 所示：\n\
  \n![](img/as_eandroid_sample_running_dark.jpg)\n\n图 4-14\n\n在继续操作之前，返回 `Settings`\
  \ 应用并关闭 `Dark theme` 模式。\n\n## 4.7 在独立窗口中运行模拟器\n\n在本章到目前为止，我们仅将模拟器作为嵌入在 Android\
  \ Studio 主窗口内的工具窗口使用。若要在独立窗口中运行模拟器，请选择 `File -> Settings...` 菜单选项（macOS 上为 `Android\
  \ Studio -> Preferences...`），在设置对话框的左侧导航面板中导航到 `Tools -> Emulator`，并禁用 `Launch in\
  \ a tool window` 选项：\n\n![](img/as_avd_separate_window_setting.jpg)\n\n图 4-15\n\n\
  禁用该选项后，点击 `Apply` 按钮随后点击 `OK` 以提交更改，然后点击上方图 4-4 中标记为 B 的标签上的关闭按钮退出当前模拟器会话。\n\n再次运行示例应用，此时模拟器将显示所示的独立窗口：\n\
  \n![](img/as_android_emulator_standalone.jpg)\n\n图 4-16\n\n选择独立模式还是工具窗口模式取决于个人喜好。如果你喜欢模拟器在工具窗口中运行，请返回设置屏幕并重新启用\
  \ `Launch in a tool window` 选项。然而，在提交独立模式之前，请记住也可以通过点击模拟器工具栏中的设置按钮（由齿轮图标表示）并选择 `View\
  \ Mode -> Float` 菜单选项，将模拟器工具窗口从 Android Studio 主窗口分离：\n\n![](img/as_avd_float.jpg)\n\
  \n图 4-17\n\n## 4.8 启用设备框架\n\n模拟器可以配置为带有（图 4-18）或不带设备框架（图 4-16）显示。\n\n![](img/as_eandroid_sample_running_device_frame.jpg)\n\
  \n图 4-18\n\n要更改设置，打开 `Device Manager`，从列表中选择 `AVD`，并点击 `Actions` 列中的铅笔图标以编辑设置。在设置屏幕中，找到并更改\
  \ `Enable Device Frame` 选项：\n\n![](img/as_avd_enable_device_frame.jpg)\n\n图 4-19\n\
  \n## 4.9 AVD 命令行创建\n\n如前所述，除了图形界面外，还可以直接从命令行创建新的 `AVD`。这是通过使用 `avdmanager` 工具结合一些命令行选项实现的。一旦启动，该工具将在创建\
  \ `AVD` 之前提示额外信息。\n\n`avdmanager` 工具需要访问 Java 环境（JRE）。如果在尝试运行 `avdmanager` 时出现找不到\
  \ `java` 命令的消息，可以配置运行命令提示符或终端以使用 Android Studio 绑定的 JDK。\n\n1. 启动 Android Studio\
  \ 并项目。\n2. 选择 `File -> Settings...`（macOS 上为 `Android Studio -> Preferences...`）。\n\
  3. 导航到 `Build, Execution, Deployment` 部分并选择 `Gradle` 选项。\n4. 点击 `JDK` 设置并记录 Android\
  \ home 的路径：\n\n![](img/as_grade_path.jpg)\n\n图 4-20\n\n在 Windows 上，在命令提示符中执行以下命令（将\
  \ `<path to jre>` 替换为从对话框复制的路径）：\n\n`set JAVA_HOME=<path to jre>`\n\n在 macOS 或 Linux\
  \ 上执行以下命令：\n\n如果你预计频繁使用 `avdmanager` 工具，请按照设置 Android 开发环境章节中概述的操作系统环境变量步骤来配置 `JAVA_HOME`。\n\
  \n假设系统已配置将 Android SDK 目录包含在 `PATH` 环境变量中，可以通过在终端中执行以下命令获取 `AVD` 目标列表：\n\n`avdmanager\
  \ list targets`\n\n上述命令的输出将包含系统上可用的 Android 版本列表。例如：\n\nAvailable targets:\n\n----------\n\
  \nid: 1 or \"android-29\"\n     Name: Android API 29\n     Type: Platform\n     API\
  \ level: 29\n     Revision: 1\n\n----------\n\nid: 2 or \"android-26\"\n     Name:\
  \ Android API 26\n     Type: Platform\n     API level: 26\n     Revision: 1\n\n\
  `avdmanager` 工具还允许从命令行创建新的 `AVD` 实例。例如，要使用 Android API  29 设备的目标 ID 使用 `x86` ABI\
  \ 创建名为 `myAVD` 的新 `AVD`，可以使用命令：\n\n`avdmanager create avd -n myAVD -k \"system-images;android-29;google_apis_playstore;x86\"\
  `\n\n`avdmanager` 工具将根据基本 Android 8 设备的规范创建新的 `AVD`，并在需要时提供创建匹配特定设备规范的自定义配置的选项。一旦从命令行创建了新的\
  \ `AVD`，在点击 `Refresh` 按钮之前，它可能不会出现在 Android Device Manager 工具中。\n\n\n\n\n除了创建新的\
  \ AVD 之外，还可以从命令行执行其他任务。例如，可以使用 `list avd` 命令行参数获取当前可用的 AVD 列表：\n\n```\navdmanager\
  \ list avd\n```\n\n可用 Android 虚拟设备：\n\n  Name: Pixel_XL_API_28_No_Play\n  Device:\
  \ pixel_xl (Google)\n    Path: /Users/neilsmyth/.android/avd/Pixel_XL_API_28_No_Play.avd\n\
  \  Target: Google APIs (Google Inc.)\n      Based on: Android API 28 Tag/ABI: google_apis/x86\n\
  \  Skin: pixel_xl_silver\n  Sdcard: 512M\n\n同样，要删除现有的 AVD，只需如下使用 `delete` 选项：\n\n\
  ```\navdmanager delete avd –n <avd name>\n```\n\n## 4.10 Android 虚拟设备配置文件\n\n默认情况下，与\
  \ AVD 关联的文件存储在用户主目录下的 `.android/avd` 子目录下，其结构如下（其中 `<avd name>` 被替换为分配给 AVD 的名称）：\n\
  \n`<avd name>.avd/config.ini`\n`<avd name>.avd/userdata.img`\n`<avd name>.ini`\n\
  \n`config.ini` 文件包含了在 AVD 创建过程中指定的设备配置设置，如显示尺寸和内存。这些设置可以直接在配置文件中进行更改，并在下次调用 AVD\
  \ 时被其采纳。\n\n`<avd name>.ini` 文件包含了对目标 Android SDK 的引用以及 AVD 文件的路径。请注意，`config.ini`\
  \ 文件中 `image.sysdir` 值的更改也需要反映在该文件的 `target` 值中。\n\n## 4.11 移动和重命名 Android 虚拟设备\n\
  \n可以使用 `avdmanager` 工具的 `move avd` 参数从命令行更改 AVD 的当前名称或文件所在位置。例如，要将命名为 `Pixel4` 的\
  \ AVD 重命名为 `Pixel4a`，可以执行以下命令：\n\n```\navdmanager move avd -n Pixel4 -r Pixel4a\n\
  ```\n\n要物理重新移动与 AVD 关联的文件，应使用以下命令语法：\n\n```\navdmanager move avd -n <avd name> -p\
  \ <path to new location>\n```\n\n例如，将 AVD 从其当前的文件系统位置移动到 `/tmp/Pixel4Test`：\n\n\
  ```\navdmanager move avd -n Pixel4 -p /tmp/Pixel4Test\n```\n\n注意，在执行移动 AVD 的命令之前，目标目录不能已经存在。\n\
  \n## 4.12 总结\n\n典型的应用开发过程遵循编码、编译和在测试环境中运行的循环。Android 应用可以在物理 Android 设备上进行测试，也可以使用\
  \ Android 虚拟设备（AVD）模拟器进行测试。AVD 使用 Android Studio Device Manager 工具创建和管理，该工具可以作为命令行工具使用，也可以通过图形用户界面使用。在创建\
  \ AVD 以模拟特定的 Android 设备型号时，虚拟设备应配置为与物理设备匹配的硬件规格。\n\nAVD 模拟器会可能会以独立窗口的形式显示，也可以嵌入到\
  \ Android Studio 主用户界面中。\n\n## 5. 使用和配置 Android Studio AVD 模拟器\n\n在下一章探索在物理 Android\
  \ 设备上进行测试之前，本章将花费一些时间概述 Android Studio AVD 模拟器，并突出介绍在独立模式和工具窗口模式下可用于自定义环境的许多配置功能。\n\
  \n### 5.1 模拟器环境\n\n当以独立模式启动时，模拟器在加载过程中会显示初始启动屏幕。加载完成后，会出现模拟器主窗口，其中包含所选设备类型的表示（在图\
  \ 5-1 中，这是一个 Pixel 4 设备）：\n\n![](img/android_12_avd_running_standalone.jpg)\n\n\
  图 5-1\n\n窗口右侧排列着工具栏，提供了快速访问模拟器控制和配置选项的功能。\n\n### 5.2 模拟器工具栏选项\n\n模拟器工具栏（图 5-2）提供了与模拟器环境外观和行为相关的一系列选项。\n\
  \n![](img/as_3.5_avd_toolbar.jpg)\n\n图 5-2\n\n工具栏中的每个按钮都关联有一个键盘快捷键，可以通过将鼠标指针悬停在按钮上并等待工具提示出现，或者通过扩展控制面板的帮助选项来识别。\n\
  \n尽管工具栏包含的许多选项都是言而易懂，但为了完整起见，将对每个选项进行介绍：\n\n*   **退出 / 最小化 (Exit / Minimize)** –\
  \ 工具栏中最顶部的“x”按钮在选中时退出模拟器会话，而“－”选项会最小化整个窗口。\n*   **电源 (Power)** – 电源按钮模拟物理 Android\
  \ 设备上的电源按钮。点击并释放此按钮将锁定设备并关闭屏幕。长按此按钮将启动设备的“关机”请求序列。\n*   **音量增大 / 减小 (Volume Up /\
  \ Down)** – 控制模拟器环境中播放音频音量的两个按钮。\n*   **向左/右旋转 (Rotate Left/Right)** – 模拟的设备在竖屏和横屏方向之间旋转。\n\
  *   **截图 (Take Screenshot)** – 拍摄设备屏幕上当前显示的内容。捕获的图像存储在扩展控制面板设置屏幕中指定的位置。\n*   **缩放模式\
  \ (Zoom Mode)** – 此按钮切换进入或退出缩放模式，其细节将在本章后续介绍。\n*   **返回 (Back)** – 执行标准的 Android“返回”导航返回上一屏幕。\n\
  *   **主页 (Home)** – 显示设备主屏幕。\n*   **任务界面 (Overview)** – 模拟标准的 Android“任务界面”导航，显示设备上正在运行的应用。\n\
  *   **折叠设备 (Fold Device)** – 模拟折叠设备的折叠和展开。此选项仅在模拟器运行折叠设备镜像时可用。\n*   **扩展控制 (Extended\
  \ Controls)** – 显示扩展控制面板，允许配置模拟位置和通话活动、电池强度、移动网络类型和指纹识别。\n\n### 5.3 使用缩放模式\n\n位于模拟器工具栏的缩放按钮进入或退出缩放模式。当缩放模式激活时，工具栏按钮处于按下状态，鼠标指针悬停在设备屏幕上时显示放大镜。点击左鼠标键将导致显示相对于选点放大，重复点击会增加缩放级别。相反，点击右鼠标键将减少缩放级别。切换缩放按钮会将显示恢复到默认大小。\n\
  \n在缩放模式下点击并拖动将定义一个矩形区域，释放鼠标后视图将缩放到该区域。\n\n在缩放模式下，可以使用模拟器窗口内的水平和垂直滚动条移动可视区域。\n\n\
  ### 5.4 调整模拟器窗口大小\n\n可以通过点击并拖动窗口的任何角或边随时更改模拟器窗口（以及相应的设备表示）的大小。\n\n### 5.5 扩展控制选项\n\
  \n扩展控制工具栏按钮显示图 5-3 所示的面板。默认将显示位置设置。从左侧面板选择不同的类别将显示相应的控件组：\n\n#### 5.5.1 位置 (Location)\n\
  \n\n\n\n\n位置控制允许以十进制或度分秒坐标的形式将模拟的位置信息发送到模拟器。位置信息可以是单个位置的形式，也可以是代表设备移动的点序列，后者通过 GPS\
  \ 交换 (GPX) 或 Keyhole 标记语言 (KML) 格式的文件提供。或者，可以使用集成的 Google Maps 面板视觉化地选择单点或旅行路线。\n\
  \n### 5.5.2 显示器\n\n除了模拟器屏幕内显示的主显示外，“显示器”（Displays）选项允许添加运行在同一 Android 实例中的额外显示器。这对于测试如\
  \ Microsoft Surface Duo 等双屏设备的 App 非常有用。这些额外的屏幕可以配置为任何所需的尺寸，并与主屏幕出现在同一个模拟器窗口中。\n\
  \n### 5.5.3 蜂窝\n可以在蜂窝设置屏幕中更改模拟的蜂窝连接类型。提供了模拟不同网络类型（如 `CSM`、`EDGE`、`HSDPA` 等）以及漫游和拒绝访问等一系列语音和数据场景。\n\
  \n### 5.5.4 电池\n在扩展控制屏幕的此面板上，可以模拟各种电池状态和充电条件，包括电池电量、电池健康以及当前是否连接了 AC 器。\n\n### 5.5.5\
  \ 摄像头\n当摄像头激活时，模拟器会模拟 3D 场景。它表现为虚拟建筑内部，您可以在模拟器内录制视频或拍照之前，通过按住 `Option` 键（Windows\
  \ 上的 `Alt`）并同时使用鼠标指针和键盘键在其中进行导航。此扩展配置选项允许上传不同的图像以显示在虚拟环境中。\n\n### 5.5.6 电话\n电话扩展控制在模拟器中提供了两个非常简单但实用的模拟。第一个选项允许模拟来自指定电话号码的入电电话。这在测试\
  \ App 如何处理此类高层中断时特别有用。\n\n第二个选项允许在模拟器会话中模拟接收短信。与现实世界中一样，这些消息会出现在 `Message` 应用中，并触发模拟器内的标准通知。\n\
  \n### 5.5.7 方向键\n方向键（`D-Pad`）是内置在 Android 设备中或外接（如游戏手柄）的另一组控制控件，提供方向性控制（左、右、上、下）。方向键设置允许在模拟器中模拟\
  \ `D-Pad` 交互。\n\n### 5.5.8 麦克风\n麦克风设置允许启用麦克风并模拟虚拟耳机和麦克风连接。还提供按钮启动模拟器上的 `Voice Assistant`。\n\
  \n### 5.5.9 指纹\n许多 Android 设备现在配备了内置指纹检测硬件。AVD 模拟器使得测试指纹认证成为可能，无需在带有指纹传感器的物理设备上测试\
  \ App。如何在模拟器中配置指纹测试的细节将在本章稍后详细介绍。\n\n### 5.5.10 虚拟传感器\n虚拟传感器选项允许模拟加速度计和磁计，通过偏航（yaw）、俯仰（pitch）和滚滚（roll）设置来模拟设备物理运动的效果，如旋转、移动和倾斜。\n\
  \n### 5.5.11 快照\n快照包含当前运行的 AVD 会话状态，可以保存并快速恢复，使模拟器能够返回到精确的状态。快照将在本章稍后介绍。\n\n###\
  \ 5.5.12 录制与回放\n允许以 WebM 或动画 GIF 格式录制并保存模拟器屏幕和音频。\n\n### 5.5.13 Google Play\n如果模拟器运行安装了\
  \ Google Play 服务的 Android 版本，此选项将显示当前的 Google Play 版本，并提供更新模拟器到最新版本的选项。\n\n### 5.5.14\
  \ 设置\n设置面板提供了一组小型配置选项。使用此面板为工具栏和扩展控制面板选择较深颜色的主题，指定保存截图的文件系统位置，配置 OpenGL 支持级别，并配置模拟器窗口显示在桌面其他窗口之上。\n\
  \n### 5.5.15 帮助\n帮助屏幕包含三个子面板，其中包含键盘快捷键列表、访问模拟器在线文档/报告 Bug 和发送反馈的链接，以及模拟器版本信息。\n\n\
  ### 5.6 使用快照\n当模拟器第一次启动时，它会执行冷启动，就像物理 Android 设备通电时一样。由于操作系统的加载和所有后台进程的启动，此冷启动过程可能需要一些时间才能完成。为了避免每次启动模拟器都必须经过此过程，系统配置为每次退出时自动保存模拟器当前状态的快照（称为“快速启动快照”）。下次启动模拟器时，快速启动快照将被加载到内存中，并从之前离开的地方继续执行，允许模拟器重启的时间仅为冷启动所需时间的一部分。\n\
  \n扩展控制面板的“快照”屏幕可以在模拟器执行期间的任何点存储额外的快照。这保存了整个模拟器的精确状态，允许模拟器恢复到拍摄快照时的精确时间点。从屏幕内部，可以使用\
  \ `Take Snapshot` 按钮拍摄快照（标记为 `Figure 5-4]` 中的 A 标记）。要恢复现有快照，从列表 (B) 中选择它并点击屏幕底部的运行按钮\
  \ (C)。还提供了编辑 (D) 快照名称和描述以及删除 (E) 当前选中快照的选项。\n\n设置选项 (F) 提供了配置自动保存快速启动快照的选项（默认情况下，模拟器每次退出都会询问是否保存快速启动快照）以及加载最近的快照。要强制模拟器会话执行冷启动而不是使用快速启动快照，请打开\
  \ `AVD Manager`（工具 -> AVD Manager），点击模拟器对应的 Actions 列中的向下箭头，并选择 `Cold Boot Now`\
  \ 选项。\n\n\n\n\n\n点击 `Touch the Sensor` 按钮模拟 `Finger 1` 触摸指纹传感器。模拟器将报告指纹添加成功：\n\n\
  ![](img/Image2478.jpg)\n\n图 5-7\n\n要添加更多指纹，请点击 `Add Another` 按钮，并在再次点击 `Touch the\
  \ Sensor` 按钮之前，从扩展控制面板菜单中选择另一个手指。\n\n## 5.8 工具窗口模式下的模拟器\n\n正如前一章节（“在 Android Studio\
  \ 中创建 Android 虚拟设备 (AVD)”）所述，Android Studio 可以配置为将模拟器嵌入工具窗口启动，这样它就不会出现在独立的窗口中。当在此模式下运行时，工具栏中将提供与独立模式下可用的相同控件，如图\
  \ 5-8 所示：\n\n![](img/as_avd_tool_window_toolbar.jpg)\n\n图 5-8\n\n从左到右，这些按钮执行以下任务（详细信息与独立模式一致）：\n\
  \n- 电源\n- 音量上\n- 音量减\n- 向左旋转\n- 向右旋转\n- 返回\n- 首页\n- 概览\n- 截图\n- 快照\n- 扩展控制\n\n##\
  \ 5.9 创建可调整大小的模拟器\n\n除了配置为匹配特定 Android 设备模型的模拟器外，Android Studio 还提供了可调整大小的 AVD，允许你在手机、平板和折叠设备尺寸之间切换。要创建一个可调整大小的模拟器，打开\
  \ `Device Manager` 并点击 `Create device` 按钮。接下来，选择图 5-9 所示的 `Resizable` 设备定义，并按照通常步骤创建新的\
  \ AVD：\n\n![](img/as_avd_resizable.jpg)\n\n图 5-9\n\n当你在工具窗口内的新模拟器上运行应用时，工具栏中会出现\
  \ `Display mode` 选项，允许你在模拟器配置之间切换，如图 5-10 所示：\n\n![](img/as_avd_display_mode.jpg)\n\
  \n图 5-10\n\n如果模拟器在独立模式下运行，可以在侧边工具栏中找到 `Display mode` 选项，如下所示：\n\n![](img/as_avd_standalone_display_mode.jpg)\n\
  \n图 5-11\n\n## 5.10 总结\n\nAndroid Studio 包含 Android 虚拟设备模拟器环境，旨在使其无需运行物理 Android\
  \ 设备即可更轻松地测试应用程序。本章对模拟器进行了简要介绍，并突出了关键功能，这些用于配置和自定义环境以模拟不同的测试条件。\n\n## 6. Android\
  \ Studio 用户界面概览\n\n虽然人们可能急于运行上一章中创建的示例应用，但这样做涉及到使用 Android Studio 用户界面的某些方面，这些内容最好先进行描述。\n\
  \nAndroid Studio 是一个强大且功能丰富的开发环境，在很大程度上是直观易用的。尽管如此，现在花时间来熟悉 Android Studio 用户界面的布局和结构，将大大缩短本书后续章节的学习曲线。考虑到这一点，本章将提供构成\
  \ Android Studio 环境的各种区域和组件的初步概述。\n\n## 6.1 欢迎屏幕\n\n欢迎屏幕（图 6-1）在 Android Studio\
  \ 运行且当前没有打开任何项目时显示（可以通过选择 `File -> Close Project` 菜单选项随时关闭项目）。如果在项目仍打开时之前退出了 Android\
  \ Studio，工具在下次启动时将跳过欢迎屏幕，自动打开之前活跃的项目。\n\n![](img/as_eel_welcome_screen2.jpg)\n\n\
  图 6-1\n\n除了最近项目列表外，欢迎屏幕提供了执行任务的选项，如打开和创建项目，以及访问当前位于版本控制下的项目。此外，`Customize` 屏幕提供了更改\
  \ IDE 和编辑器使用的主题和字体设置的选项。可以使用 `Plugins` 选项查看、安装和管理 Android Studio 插件。\n\n点击菜单按钮可以获得更多选项，如图\
  \ 6-2 所示：\n\n![](img/android_studio_welcome_menu.jpg)\n\n图 6-2\n\n## 6.2 主窗口\n\n\
  当创建新项目或打开现有项目时，Android Studio 主窗口将出现。当同时打开多个项目时，每个项目将分配到自己的主窗口。窗口的精确配置将取决于项目上次打开时显示了哪些工具和面板，但通常类似于图\
  \ 6-3 所示。\n\n![](img/as_main_window_java.jpg)\n\n图 6-3\n\n主窗口的各种元素可以总结如下：\n\nA –\
  \ 菜单栏 – 包含用于在 Android Studio 环境中执行任务的一系列菜单。\n\nB – 工具栏 – 经常执行的操作快捷键选择。工具栏按钮提供了快速访问一组菜单栏操作的通道。可以通过右键点击工具栏并选择\
  \ `Customize Menus and Toolbars…` 菜单选项来自定义工具栏。如果工具栏不可见，可以使用 `View -> Appearance\
  \ -> Toolbar` 菜单选项显示。\n\nC – 导航栏 – 导航栏提供了在组成项目的文件和文件夹之间移动的方便方法。点击导航栏中的元素将列出该处的子文件夹和文件供选择。同样，点击类名将列出该类的方法。从列表中选择方法将跳转到代码编辑器中的相应位置。使用\
  \ `View -> Appearance -> Navigation Bar` 菜单选项隐藏或显示此栏。\n\nD – 编辑器窗口 – 编辑器窗口显示当前正在开发的文件内容。当打开多个文件时，每个文件都由编辑器顶部的标签表示，如图\
  \ 6-4 所示：\n\n![](img/as_4.1_editor_tabs.jpg)\n\n图 6-4\n\nE – 状态栏 – 状态栏显示有关项目和 Android\
  \ Studio 活动的信息消息，以及位于远左角的工具菜单按钮。悬停在状态栏项目上将显示该字段的描述。许多字段是交互式的，允许用户点击以执行任务或获取更详细的状态信息。\n\
  \nF – 项目工具窗口 – 项目窗口提供了项目文件结构的层次概述，允许导航到特定的文件和文件夹。工具栏可以使用不同的方式显示项目。默认设置是 `Android`\
  \ 视图，这是本书其余部分使用的模式。\n\n项目窗口只是 Android Studio 环境中许多工具窗口之一。\n\n## 6.3 工具窗口\n\n除了项目视图工具窗口，Android\
  \ Studio 还包含许多其他窗口，启用后，它们将显示在主窗口的底部和侧面。可以通过将鼠标指针悬停在状态栏最左角的按钮上（图 6-5）而不点击鼠标按钮来显示工具窗口快速访问菜单。\n\
  \n![](img/as_tool_window_menu.jpg)\n\n图 6-5\n\n从快速访问菜单中选择项目将导致相应的工具窗口在主窗口中出现。\n\n\
  \n\n\n或者，也可以通过点击状态栏中的快速访问菜单图标来显示一组工具窗口栏。这些工具栏会出现在主窗口的左侧、右侧和底部边缘（如图 6-6 中的箭头所示），并包含用于显示和隐藏每个工具窗口的按钮。当工具窗口栏显示时，再次点击状态栏中的按钮将把它们隐藏。\n\
  \n![](img/as_4.1_tool_window_bars.jpg)\n\n图 6-6\n\n点击按钮将显示相应的工具窗口，而再次点击将隐藏该窗口。带有数字前缀的按钮（例如\
  \ 1: Project）表示可以通过按下键盘上的 `Alt` 键（macOS 上为 `Command` 键）配合相应的数字来显示该工具窗口。\n\n按钮在工具窗口栏中的位置表示该窗口在显示时将出现在窗口的哪一。可以通过点击并拖拽按钮到其他窗口工具栏中的不同位置来更改这些位置。\n\
  \n每个工具窗口在顶部边缘都有自己的工具栏。这些工具栏中的按钮随工具的不同而异，但所有工具窗口都包含一个由齿轮图标表示的设置选项，允许更改窗口的各个方面。图 6-7\
  \ 显示了 Project 工具窗口的设置菜单。可用选项包括取消停靠窗口并允许其浮动在 Android Studio 主窗口边界之外，以及移动和调整工具面板的大小。\n\
  \n![](img/android_studio_tool_window_options.jpg)\n\n图 6-7\n\n所有窗口在工具栏的最右侧还包含一个按钮，提供了隐藏工具窗口视图的额外方法。只需通过点击窗口获取焦点，然后输入搜索词（例如\
  \ Project 工具窗口中的文件名），即可对工具窗口内的项目进行搜索。搜索框将出现在窗口的工具栏中，与搜索匹配的项将会被高亮显示。\n\nAndroid Studio\
  \ 提供了广泛的工具窗口，最常用的如下：\n\n- **App Inspection**（应用检查） - 提供访问 `Database`（数据库）和 `Background\
  \ Task`（后台任务）检查器。`Database Inspector` 允许你在应用运行时检查、查询和修改应用的数据库。`Background Task Inspector`\
  \ 允许监控和管理使用 `WorkManager` 创建的后台工作任务。\n- **Build**（构建） - 构建工具窗口显示项目正在编译和打包时的构建过程信息，并显示遇到的任何错误详细信息。\n\
  - **Build Variants**（构建变体） – 构建变体工具窗口提供了为当前应用程序项目配置不同构建目标的快速方法（例如为应用程序的调试和发布版本提供不同的构建，或针对不同设备类别的多个构建）。\n\
  - **Device File Explorer**（设备文件管理器） - 通过 `View` -> `Tool Windows` -> `Device File\
  \ Explorer` 菜单可用，该工具窗口直接访问当前连接的 Android 设备或模拟器的文件系统，允许浏览文件系统并将文件复制到本地文件系统。\n- **Device\
  \ Manager**（设备管理器） - 提供访问 `Device Manager` 工具窗口的权限，可以在其中添加、删除和管理物理 Android 设备连接和模拟器。\n\
  - **Emulator**（模拟器） - 如果启用了“在 Android Studio 中创建 Android 虚拟设备 (AVD)”章节中所述的在工具窗口中运行模拟器的选项，则该窗口包含\
  \ `AVD` 模拟器。\n- **Bookmarks**（书签） – `Bookmarks` 工具窗口提供了快速访问已书签的文件和代码行。例如，在项目视图中右键点击文件可以访问\
  \ `Add to Bookmarks` 菜单选项。同样，可以通过将光标移动到该行并按下 `F11` 键（macOS 上为 `F3`）书签源文件中的代码。所有书签项都可以通过此窗口访问。\n\
  - **Gradle** - `Gradle` 工具窗口提供了组成项目构建配置的 `Gradle` 任务视图。窗口列出了参与将项目各种元素编译为可执行应用程序的任务。右键点击顶层\
  \ `Gradle` 任务并选择 `Open Gradle Config` 菜单选项，可以将当前项目的 `Gradle` 构建文件加载到编辑器中。`Gradle`\
  \ 将在本书后部分进行详细介绍。\n- **Layout Inspector**（布局检查器） - 提供构成用户界面布局的组件层次结构的可视 3D 渲染。\n\
  - **Logcat** - `Logcat` 工具窗口提供了对运行应用程序监控日志输出的访问，外提供了拍摄应用程序截图和视频以及停止和重启进程的选项。\n-\
  \ **Problems**（问题） - 查看项目内所有当前错误或警告的中心位置。双击问题列表中的项将带您进入问题所在的文件和位置。\n- **Profiler**（分析器）\
  \ - `Android Profiler` 工具窗口提供了识别运行应用中性能问题的实时监控和分析工具，包括 CPU、内存和网络使用情况。此选项在应用当前运行时变为可用。\n\
  - **Project**（项目） - 项目视图提供了构成项目的文件结构概述，允许在文件之间快速导航。通常情况下，在项目视图中双击文件将导致该文件加载到适当的编辑工具中。\n\
  - **Resource Manager**（资源管理器） - 用于添加和管理项目包含的资源和资产（如图像、颜色和布局文件）。\n- **Run**（运行） -\
  \ 当应用程序运行时，运行工具窗口变为可用并提供运行结果视图以及停止或重启进程的选项。如果应用程序无法安装和运行，此窗口通常会提供相关的诊断信息。\n- **Structure**（结构）\
  \ - 结构工具提供了当前编辑器中源文件的结构层次视图。这些信息包括类、方法和变量。从结构列表中选择项将带您进入编辑器中的对应位置。\n- **Terminal**（终端）\
  \ - 提供访问运行 Android Studio 的系统的终端窗口。在 Windows 系统上，它是命令提示符界面，而在 Linux 和 macOS 系统上，它呈现为终端提示符。\n\
  - **TODO**（待办事项） – 顾其实名，此工具提供了查看项目中尚未完成项的地方。Android Studio 通过扫描组成项目的源文件查找指定 `TODO`\
  \ 模式的注释来编译此列表。可以通过选择 `File` -> `Settings…` 菜单选项（macOS 上为 `Preferences…`）并导航到 `Editor`\
  \ 下的 `TODO` 页面查看和更改这些模式。\n- **Version Control**（版本控制） - 当项目文件受源代码版本控制时使用此工具窗口，允许访问\
  \ `Git` 仓库和代码更改历史。\n\nAndroid Studio 包含了大量的键盘快捷键，旨在执行常用任务时节省时间。可以在 Android Studio\
  \ 项目窗口内通过选择 `Help` -> `Keymap Reference` 菜单选项查看并打印完整的键盘快捷键列表。您还可以通过选择 `File` ->\
  \ `Settings...` 菜单选项（macOS 上为 `Preferences...`）并点击 `Keymap` 来列出并修改键盘快捷键。\n\n## 6.5\
  \ 切换器和最近文件导航\n\n\n\n\n在 Android Studio 主窗口内进行导航的另一个有用机制是使用 `Switcher`（切换器）。通过 `Ctrl-Tab`\
  \ 快捷键访问，切换器会以面板的形式出现，列出工具窗口和当前打开的文件（图 6-9）。\n\n![](img/as_switcher.jpg)\n\n图 6-9\n\
  \n一旦显示出来，只要 `Ctrl` 键保持按下状态，切换器就会保持可见。按住 `Ctrl` 键并重复点击 `Tab` 键可以在各种选择选项之间循环，松开 `Ctrl`\
  \ 键将选中当前高亮的项并在主窗口中显示。\n\n除了切换器之外，`Recent Files`（最近文件）面板提供了导航到最近打开的文件的功能（图 6-10 可以使用可以使用\
  \ `Ctrl-E` 快捷键（mac 上为 `Cmd-E`）访问它。显示后，可以使用鼠标指针选择选项，或使用键盘箭头键滚动浏览文件名和工具窗口选项。按下 `Enter`\
  \ 键将选中当前高亮的项。\n\n![](img/android_studio_recent_files.jpg)\n\n图 6-10\n\n## 6.6 修改\
  \ Android Studio 主题\n\nAndroid Studio 环境的整体主题可以通过欢迎界面的 `Configure -> Settings`（配置\
  \ -> 设置）选项，或者通过主窗口的 `File -> Settings…` 菜单（mac 上为 `Android Studio -> Preferences…`）进行更改。\n\
  \n一旦显示设置对话框，在左侧面板中选择 `Appearance & Behavior`（外观与行为），然后选择 `Appearance`（外观），在点击 `Apply`（应用）按钮之前更改\
  \ `Theme`（主题）菜单设置。可用主题取决于平台，但通常包括 `Light`（浅色）、`IntelliJ`、`Windows`、`High Contrast`（高对比度）和\
  \ `Darcula` 等选项。图 6-11 显示选择了 `Darcula` 主题的主窗口示例：\n\n![](img/as_3.6_darcula.jpg)\n\
  \n图 6-11\n\n要将 Android Studio 主题与操作系统的亮/色模式设置同步，请启用 `Sync with OS`（与操作系统同步）选项，并使用下拉菜单控制每个模式下使用哪个主题：\n\
  \n![](img/as_theme_configuration.jpg)\n\n图 6-12\n\n## 6.7 总结\n\nAndroid Studio 环境的主要元素包括欢迎界面和主窗口。每个打开的项目都分配有自己的主窗口，该窗口反过来由菜单栏、工具栏、编辑和设计区域、状态栏以及工具窗口组成。工具窗口显示在主窗口的侧边和底部，可以通过状态栏中的快速访问菜单访问，也可以通过可选的工具窗口栏访问。\n\
  \nAndroid Studio 中有极少数的操作是无法通过快捷键触发的。可以随时从 Android Studio 主窗口访问默认快捷键的键位映射（keymap）。\n\
  \n## 7. 在物理 Android 设备上测试 Android Studio 应用\n\n虽然使用 Android 虚拟设备 (AVD) 测试应用程序可以实现许多功能，但在物理\
  \ Android 设备上进行真实世界的应用测试是不可替代的，而且由于某些 Android 功能仅在物理 Android 设备上可用。\n\n与 AVD 实例和已连接的\
  \ Android 设备的通信均由 Android 调试桥接 (`ADB`) 处理。在本章中，我们将解释如何配置 `adb` 环境，以便在基于 macOS、Windows\
  \ 和 Linux 的系统上对 Android 设备进行应用测试。\n\n### 7.1 Android 调试桥 (ADB) 概述\n\n`ADB` 的主要目的是促进开发系统（在本例中为\
  \ Android Studio）与 AVD 模拟器以及 Android 设备之间的交互，以运行和调试应用程序。`ADB` 允许通过 WiFi 网络或直接使用\
  \ USB 线连接到设备。\n\n`ADB` 由一个客户端、一个运行在开发系统后台的服务器进程以及一个运行在 AVD 或真实 Android 设备（如手机和平板电脑）上的守护进程后台进程组成。\n\
  \n`ADB` 客户端有多种形式。例如，以名为 `adb` 的命令行工具形式提供，位于 Android SDK 的 `platform-tools` 子目录中。同样，Android\
  \ Studio 也有一个内置的客户端。\n\n可以使用 `adb` 命令行工具执行多种任务。例如，可以使用 `devices` 命令行参数获取当前活跃的虚拟或物理设备列表。以下命令输出表示系统中存在一个\
  \ AVD 但没有物理设备：\n\n```\n$ adb devices\n\nList of devices attached\nemulator-5554\
  \ device\n```\n\n### 7.2 在 Android 设备上启用 USB 调试 ADB\n\n在 `ADB` 连接到 Android 设备之前，该设备必须先配置为允许连接。在运行\
  \ Android 6.0 或更高版本的手机和平板设备上，实现此点的步骤如下：\n\n1. 打开设备上的 `Settings`（设置）应用并选择 `About\
  \ tablet` 或 `About phone`（在某些 Android 版本中，可以在 `Settings` 应用的 `System` 页面找到）。\n2.\
  \ 在 `About` 屏幕上滚动到 `Build number`（版本号）字段（图 7-1）并点击七次，直到出现指示开发者模式已启的消息。如果 `About`\
  \ 屏幕上没有列出 `Build number`，则可以通过 `Software information`（软件信息）选项找到。或者，如果可用，展开列表中的 `Advanced`（高级）部分。\n\
  \n![](img/as_3.2_build_number.jpg)\n\n图 7-1\n\n3. 返回设置设置主屏幕，注意出现了 `Developer options`（开发者选项）选项（在较新的\
  \ Android 版本中，该选项位于 `System` 设置屏幕）。选择此选项，并在生成的屏幕上找到图 7-2 所示的 `USB debugging` 选项：\n\
  \n![](img/android_12_debugging.jpg)\n\n图 7-2\n\n4. 启用 `USB debugging` 选项并在请求时点击\
  \ `Allow`（允许）按钮。\n\n此时，设备已配置为接受来自开发系统的 `adb` 连接。剩下的工作是配置开发系统检测该设备。虽然这是一个相对简单的过程，但取决于开发系统运行的是\
  \ Windows、macOS 还是 Linux。以下步骤假设 Android SDK `platform-tools` 目录已包含在操作系统的 `PATH`\
  \ 环境中，参见“设置 Android Studio 开发环境”章节(#Installation.xhtml__idTextAnchor09)。\n\n####\
  \ 7.2.1 macOS ADB 配置\n\n要在 macOS 系统上配置 `ADB` 环境，使用 USB 线将设备连接到计算机，打开终端窗口并执行以下命令重启\
  \ `adb` 服务器：\n\n```\n$ adb kill-server\n$ adb start-server\n* daemon not running.\
  \ starting it now on port 5037\n* daemon started successfully *\n```\n\n服务器成功启动后，执行以下命令验证设备是否已检测到：\n\
  \n```\n$ adb devices\n\nList of devices attached\n74CE00060000001 offline\n```\n\
  \n如果设备被列为 `offline`（离线），回到 Android 设备并检查是否存在图 7-3 所示的请求允许 USB 调试的对话框。勾选“Always allow\
  \ from this computer”（始终允许此计算机）旁边的复框，然后点击 `OK`。\n\n![](img/Image2856.jpg)\n\n图 7-3\n\
  \n重复执行 `adb devices` 命令现在应该列出可用设备：\n\n```\n$ adb devices\n\nList of devices attached\n\
  015d41d4454bf80c device\n```\n\n如果没有列出设备，尝试注销并重新登录 macOS 桌面，如果问题仍然存在，请重启系统。\n\n\
  #### 7.2.2 Windows ADB 配置\n\n\n\n\n\n在配置 Windows 开发系统以使用 `ADB` 连接到 Android 设备时，第一步是在系统上安装相应的\
  \ USB 驱动程序。需要安装的 USB 驱动程序取决于 Android 设备的型号。如果你拥有 Google 设备（例如 Pixel 手机），则有必要在你的\
  \ Windows 系统上安装并配置 `Google USB Driver` 程序包。实现此操作的详细步骤请参见以下网页：\n\n[`developer.android.com/sdk/win-usb.html`](https://developer.android.com/sdk/win-usb.html)\n\
  \n对于不支持 `Google USB` 驱动程序的 Android 设备，则需要下载由设备制造商提供的驱动程序。你可以在线上获取驱动程序列表以及下载和安装信息：\n\
  \n[`developer.android.com/tools/extras/oem-usb.html`](https://developer.android.com/tools/extras/oem-usb.html)\n\
  \n安装驱动程序后，一旦设备被识别为正确的设备类型，打开命令提示符窗口并执行以下命令：\n\n```\nadb devices\n```\n\n该命令应该输出关于已连接设备的信息，类似于下所示：\n\
  \n```\nList of devices attached\nHT4CTJT01906 offline\n```\n\n如果设备被列为 `offline`（离线）或\
  \ `unauthorized`（未授权），请查看设备屏幕并检查[图 7-3]中请求“Allow USB debugging”（允许 USB 调试）的对话框。在点击确定\
  \ 之前，勾选“Always allow from this computer”（始终允许来自此计算机）旁复选框。再次执行 `adb devices` 命令会将设备列为已就绪：\n\
  \n```\nList of devices attached\nHT4CTJT01906 device\n```\n\n如果设备未列出，执行以下命令重启 `ADB`\
  \ 服务：\n\n```\nadb kill-server\nadb start-server\n```\n\n如果设备仍然未列出，尝试执行以下命令：\n\n\
  ```\nandroid update adb\n```\n\n请注意，可能还需要重新启动系统。\n\n## 7.2.3 Linux adb 配置\n\n在本章中，我们将再次使用\
  \ Ubuntu Linux 作为参考示例，介绍如何在 Linux 上配置 `adb` 以连接物理 Android 设备进行应用测试。\n\n在 Ubuntu\
  \ Linux 上进行物理设备测试需要安装名为 `android-tools-adb` 的包，这反过来要求 Android Studio 用户必须是 `plugdev`\
  \ 组的成员。大多数 Ubuntu 版本的用户账户默认此类设置，可以通过运行 `id` 命令进行验证。如果没有列出 `plugdev` 组，请运行以下命令将你的账户添加到该组：\n\
  \n```\nsudo usermod -aG plugdev $LOGNAME\n```\n\n在满足组成员要求后，可以通过执行以下命令安装 `android-tools-adb`\
  \ 包：\n\n```\nsudo apt-get install android-tools-adb\n```\n\n完成上述更改后，重启 Ubuntu 系统。系统重启后，打开终端窗口，启动\
  \ `adb` 服务并检查已连接的设备列表：\n\n```\n$ adb start-server\n* daemon not running. starting\
  \ it now on port 5037 *\n* daemon started successfully *\n$ adb devices\nList of\
  \ devices attached\n015d41d4454bf80c offline\n```\n\n如果设备被列为 `offline` 或 `unauthorized`，请查看\
  \ Android 设备并检查[图 7-3]中请求“Allow USB debugging”（允许 USB 调试）的对话框。\n\n### 7.3 解决 USB\
  \ 连接问题\n\n如果你无法通过上述步骤成功连接到设备，请显示运行目标菜单（[图 7-4]）并选择 `Troubleshoot Device Connections`排除设备连接）选项：\n\
  \n![](img/as_pair_devices_troubleshooting.jpg)\n图 7-4\n\n连接助手将扫描设备并报告问题及可能的解决方案。\n\
  \n### 7.4 在 Android 设备上启用无线调试\n\n在 Android 设备上启用无线调试，请按照上述步骤 1 到 3 操作，这次是显示[图 7-5]所示的\
  \ `Wireless debugging` 选项：\n\n![](img/as_pair_devices.jpg)\n\n接下来，点击[图 7-6]所示的 `Wireless\
  \ debugging` 条目：\n\n![](img/12_enable_debugging.jpg)\n图 7-6\n\n如果设备列为 `offline`\
  \ 或 `unauthorized`，请查看 Android 设备并检查[图 7-3]中请求“Allow USB debugging”（允许 USB 调试）的对话框。在点击确定\
  \ 之前，勾选“Always allow from this computer”（始终允许来自此计算机）旁复选框。再次执行 `adb devices` 命令会将设备列为已就绪：\n\
  \n```\nList of devices attached\nHT4CTJT01906 device\n```\n\n如果设备未列出，执行以下命令重启 `ADB`\
  \ 服务：\n\n```\nadb kill-server\nadb start-server\n```\n\n如果设备仍然未列出，尝试执行以下命令：\n\n\
  ```\nandroid update adb\n```\n\n请注意，可能还需要重新启动系统。\n\n## 7.2.3 Linux adb 配置\n\n在本章中，我们将再次使用\
  \ Ubuntu Linux 作为参考示例，介绍如何在 Linux 上配置 `adb` 以连接物理 Android 设备进行应用测试。\n\n在 Ubuntu\
  \ Linux 上进行物理设备测试需要安装名为 `android-tools-adb` 的包，这反过来要求 Android Studio 用户必须是 `plugdev`\
  \ 组的成员。大多数 Ubuntu 版本的用户账户默认此类设置，可以通过运行 `id` 命令进行验证。如果没有列出 `plugdev` 组，请运行以下命令将你的账户添加到该组：\n\
  \n```\nsudo usermod -aG plugdev $LOGNAME\n```\n\n在满足组成员要求后，可以通过执行以下命令安装 `android-tools-adb`\
  \ 包：\n\n```\nsudo apt-get install android-tools-adb\n```\n\n完成上述更改后，重启 Ubuntu 系统。系统重启后，打开终端窗口，启动\
  \ `adb` 服务并检查已连接的设备列表：\n\n```\n$ adb start-server\n* daemon not running. starting\
  \ it now on port 5037 *\n* daemon started successfully *\n$ adb devices\nList of\
  \ devices attached\n015d41d4454bf80c offline\n```\n\n如果设备被列为 `offline` 或 `unauthorized`，请查看\
  \ Android 设备并检查[图 7-3]中请求“Allow USB debugging”（允许 USB 调试）的对话框。\n\n### 7.3 解决 USB\
  \ 连接问题\n\n如果你无法通过上述步骤成功连接到设备，请显示运行目标菜单（[图 7-4]）并选择 `Troubleshoot Device Connections`排除设备连接）选项：\n\
  \n![](img/as_pair_devices_troubleshooting.jpg)\n图 7-4\n\n连接助手将扫描设备并报告问题及可能的解决方案。\n\
  \n### 7.4 在 Android 设备上启用无线调试\n\n在 Android 设备上启用无线调试，请按照上述步骤 1 到 3 操作，这次是显示[图 7-5]所示的\
  \ `Wireless debugging` 选项：\n\n![](img/as_pair_devices.jpg)\n图 7-5\n\n接下来，点击[图 7-6]所示的\
  \ `Wireless debugging` 条目：\n\n![](img/12_enable_debugging.jpg)\n图 7-6\n\n如果设备被列为\
