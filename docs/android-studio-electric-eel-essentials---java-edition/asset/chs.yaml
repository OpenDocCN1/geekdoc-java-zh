  \n将属性值更改为“center”将导致项目相对于标签栏的中心进行定位：\n\n![](img/as_4.1_tab_layout_center.jpg)\n\n\
  图 46-10\n\n### 46.11 总结\n\n`TabLayout` 是 Android Material 设计实现的一部分引入的组件之一。`TabLayout`\
  \ 组件的目的是展示一系列标签页项，这些项在被选中时会向用户显示不同的内容。标签页项可以显示文本、图像或两者的结合。当与 `ViewPager2` 类和 `fragments`\
  \ 结合时，可以轻松地创建标签布局，每个标签页项的选择都会显示不同的 `fragment`。\n\n### 47. 使用使用 RecyclerView 和 CardView\
  \ 组件\n\n`RecyclerView` 和 `CardView` 组件共同工作，为用户提供可滚动的信息列表，其中信息以单个卡片的形式呈现。在深入介绍示例项目的设计和实现之前，本章将介绍这两个类的详细信息。\n\
  \n### 47.1 RecyclerView 概述\n\n与标题为“使用悬浮操作按钮和 Snackbar”章节中概述的 `ListView` 类类似，`RecyclerView`\
  \ 的目的是允许信息以可滚动列表的形式向用户呈现。然而，`RecyclerView` 相比 `ListView` 提供了许多优势。特别是 `RecyclerView`\
  \ 在管理组成列表的视图方面效率高得多，它本质上是在列表项滚出屏幕时复用已有的列表项视图，而不是创建新视图（因此其名为“recycler”，即“回收器”）。这既提高了性能，又减少了列表消耗的资源，这一特性在向用户展示大量数据时特别有益。\n\
  \n由于与 `ListView` 不同，`RecyclerView` 还提供了三种内置布局管理器的选择，以控制列表项呈现给用户的方式：\n\n- `LinearLayoutManager`\
  \ – 列表项以水平或垂直滚动列表的形式呈现。\n\n![](img/Image2427.jpg)\n\n图 47-1\n\n- `GridLayoutManager`\
  \ – 列表项以网格格式呈现。当列表项的大小均相同时，使用此管理器效果最好。\n\n![](img/Image2436.jpg)\n\n图 47-2\n\n-\
  \ `StaggeredGridLayoutManager` - 列表项以交错网格格式呈现。当列表项的大小不相同时，使用此管理器效果最好。\n\n![](img/Image2443.jpg)\n\
  \n图 47-3\n\n对于三种内置管理器都无法提供所需布局的情况，可以通过子类化 `RecyclerView.LayoutManager` 类来实现自定义布局管理器。\n\
  \n在 `RecyclerView` 中显示的每个列表项都是作为 `ViewHolder` 类的实例创建的。`ViewHolder` 实例包含了 `RecyclerView`\
  \ 显示列表项所需的所有内容，包括要显示的信息和用于显示该项的视图布局。\n\n与 `ListView` 一样，`RecyclerView` 依赖于适配器（adapter）在\
  \ `RecyclerView` 实例与要显示给用户的数据之间当中间人。适配器被创建为 `RecyclerView.Adapter` 类的子类，并且至少必须实现以下方法，这些方法会被分配给适配器的\
  \ `RecyclerView` 对象在不同时间点调用：\n\n- `getItemCount()` – 此方法必须返回在列表中要显示的项数量计数。\n- `onCreateViewHolder()`\
  \ – 此方法创建并返回一个 `ViewHolder` 对象，该对象使用用于显示数据的视图进行初始化。此视图通常通过膨胀 XML 布局文件创建。\n- `onBindViewHolder()`\
  \ – 此方法接收由 `onCreateViewHolder()` 方法创建的 `ViewHolder` 对象，以及一个指示即将显示的列表项的整数值。`ViewHolder`\
  \ 对象中包含了 `onCreateViewHolder()` 方法分配的布局。`onBindViewHolder()` 方法的责任是用与指定项目对应的文本和图形填充布局中的视图，并将该对象返回给\
  \ `RecyclerView`，然后由其呈现给用户。\n\n在布局中添加 `RecyclerView` 只需要在它将要出现的 Activity 的 XML 内容布局文件中添加相应的元素即可。例如：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    app:layout_behavior=\"@string/appbar_scrolling_view\"\n    tools:context=\"\
  .MainActivity\">\n\n    <androidx.recyclerview.widget.RecyclerView\n        android:id=\"\
  @+id/recycler_view\"\n        android:layout_width=\"0dp\"\n        android:layout_height=\"\
  0dp\"\n        app:layout_constraintBottom_toBottomOf=\"parent\"\n        app:layout_constraintEnd_toEndOf=\"\
  parent\"\n        app:layout_constraintStart_toStartOf=\"parent\"\n        app:layout_constraintTop_toTopOf=\"\
  parent\"\n        tools:listitem=\"@layout/card_layout\" />\n\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n在上面的示例中，`RecyclerView` 被嵌入主 Activity 布局的 `CoordinatorLayout` 中，并带有 `Toolbar`。这提供了一些额外功能，例如当用户在\
  \ `RecyclerView` 内向上滚动时配置 `Toolbar` 和 `AppBar` 滚出屏幕（该主题在“使用 AppBar 和折叠 Toolbar 布局”章节中有更详细的介绍）。\n\
  \n### 47.2 CardView 概述\n\n`CardView` 类是一种用户界面视图，允许以卡片隐喻的形式分组信息。卡片通常使用 `RecyclerView`\
  \ 实例在列表中呈现，并可以配置为具有阴影效果和圆角。例如图 47-4 显示了三个配置为显示包含 `ImageView` 和两个 `TextView` 布局的\
  \ `CardView` 实例：\n\n![](img/Image2512.jpg)\n\n图 47-4\n\n要在 `CardView` 实例呈现的用户界面布局是在\
  \ XML 布局文件中定义的并在运行时加载到 `CardView` 中。`CardView` 布局可以使用标准布局管理器（如 `RelativeLayout`\
  \ 和 `LinearLayout`）包含任何复杂的布局。以下 XML 布局文件表示一个包含 `RelativeLayout` 和单个 `ImageView`\
  \ 的卡片视图布局。该卡片被配置为提升以创建阴影效果并具有圆角：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n\n<androidx.cardview.widget.CardView\n    xmlns:card_view=\"http://schemas.android.com/apk/res-auto\"\
  \n    card_view:cardElevation=\"4dp\"\n    card_view:cardCornerRadius=\"8dp\">\n\
  </androidx.cardview.widget.CardView>\n```\n\n\n\n\n\n```xml\nxmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    android:id=\"@+id/card_view\"\n    android:layout_width=\"match_parent\"\n\
  \    android:layout_height=\"wrap_content\"\n    android:layout_margin=\"5dp\"\n\
  \    card_view:cardCornerRadius=\"12dp\"\n    card_view:cardElevation=\"3dp\"\n\
  \    card_view:contentPadding=\"4dp\">\n    <RelativeLayout\n        android:layout_width=\"\
  match_parent\"\n        android:layout_height=\"wrap_content\"\n        android:padding=\"\
  16dp\" >\n        <ImageView\n            android:layout_width=\"100dp\"\n     \
  \       android:layout_height=\"100dp\"\n            android:id=\"@+id/item_image\"\
  \n            android:layout_alignParentLeft=\"true\"\n            android:layout_alignParentTop=\"\
  true\"\n            android:layout_marginRight=\"16dp\" />\n    </RelativeLayout>\n\
  </androidx.cardview.widget.CardView>\n```\n\n当与 `RecyclerView` 结合以创建一个可滚动的卡片列表时，复用视图的\
  \ `onCreateViewHolder()` 方法会膨胀卡片的布局资源文件，将其分配给 `ViewHolder` 实例并返回给 `RecyclerView`\
  \ 实例。\n\n### 47.3 总结\n\n本章介绍了 Android 的 `RecyclerView` 和 `CardView` 组件。`RecyclerView`\
  \ 提供了一种资源高效的方式，用于在 Android 应用中显示可滚动的视图列表。当以卡片形式展示分组数据（例如名称和地址列表）时，`CardView` 非常有用。正如之前概述的，并且在下一章的教程中所演示的那样，`RecyclerView`\
  \ 和 `CardView` 结合使用时特别别有用。\n\n## 48. Android RecyclerView 和 CardView 教程\n\n在本章中，将创建一个示例项目，该项目将同时使用\
  \ `CardView` 和 `RecyclerView` 组件来创建一个滚动的卡片列表。完成后的应用程序将显示一个包含图像和文本的卡片列表。除了显示卡片列表外，项目还将实现为：选择卡片将向用户显示消息，以指示点击了哪张卡片。\n\
  \n### 48.1 创建 CardDemo 项目\n\n从欢迎屏幕上选择 `New Project` 选项，在出现的新项目对话框中，选择 `Basic Activity`\
  \ 模板，然后点击 `Next` 按钮。\n\n在 `Name` 字段中输入 `CardDemo` 并指定 `com.ebookfrenzy.carddemo`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将\
  \ `Language` 菜单更改 `Java`。\n\n### 48.2 修改 Basic Activity 项目\n\n由于选择了 `Basic Activity`，布局中包含了一个浮动按钮，但这对于该项目来说是需要的。在\
  \ `Layout Editor` 工具中加载 `activity_main.xml` 布局文件，选择浮动按钮并按下键盘上的删除键将该对象从布局中移除。编辑 `MainActivity.java`\
  \ 文件，从 `onCreate` 方法中移除浮动按钮和导航控制器代码，如下：\n\n```java\n@Override\nprotected void onCreate(Bundle\
  \ savedInstanceState) {\n    super.onCreate(savedInstanceState);\n    binding =\
  \ ActivityMainBinding.inflate(getLayoutInflater());\n    setContentView(binding.getRoot());\n\
  \    setSupportActionBar(binding.toolbar);\n    NavController navController =\n\
  \        Navigation.findNavController(this, R.id.nav_host_fragment_content_main);\n\
  \    appBarConfiguration =\n        new AppBarConfiguration.Builder(navController.getGraph()).build();\n\
  \    NavigationUI.setupActionBarWithNavController(this, navController, appBarConfiguration);\n\
  \    binding.fab.setOnClickListener(new View.OnClickListener() {\n        @Override\n\
  \        public void onClick(View view) {\n            Snackbar.make(view, \"Replace\
  \ with own action\", Snackbar.LENGTH_LONG).setAction(\"Action\", null).show();\n\
  \        }\n    });\n}\n```\n\n同时，移除 `onSupportNavigateUp()` 方法，然后打开 `content_main.xml`\
  \ 文件并从布局中删除 `nav_host_fragment_content_main` 对象，只保留 `ConstraintLayout`。\n\n### 48.3\
  \ 设计 CardView 布局\n\n卡片内视图的布局将在单独的 XML 文件定义。在 Project 窗口中右键点击 `app -> res -> layout`\
  \ 并选择 `New -> Layout Resource File` 选项。在 `New Resource Dialog` 中，在 `File name:`\
  \ 字段中输入 `card_layout`，并在 `root element` 字段中输入 `androidx.cardview.widget.CardView`，然后点击\
  \ `OK` 按钮。\n\n将 `card_layout.xml` 文件加载到 `Layout Editor` 工具中，切换到 `Code` 并修改布局如下：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.cardview.widget.CardView\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    android:layout_width=\"match_parent\"\
  \n    android:layout_height=\"wrap_content\"\n    android:id=\"@+id/card_view\"\n\
  \    android:layout_margin=\"5dp\"\n    app:cardBackgroundColor=\"#81C74\"\n   \
  \ app:cardCornerRadius=\"12dp\"\n    app:cardElevation=\"3dp\"\n    app:contentPadding=\"\
  4dp\" >\n    <androidx.constraintlayout.widget.ConstraintLayout\n        android:id=\"\
  relativeLayout\"\n        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  wrap_content\"\n        android:padding=\"16dp\">\n        <ImageView\n        \
  \    android:id=\"@+id/itemImage\"\n            android:layout_width=\"100dp\"\n\
  \            android:layout_height=\"100dp\"\n            app:layout_constraintLeft_toLeftOf=\"\
  parent\"\n            app:layout_constraintStart_toStartOf=\"parent\"\n        \
  \    app:layout_constraintTop_toTopOf=\"parent\" />\n        <TextView\n       \
  \     android:id=\"@+id/itemTitle\"\n            android:layout_width=\"236dp\"\n\
  \            android:layout_height=\"39dp\"\n            android:layout_marginStart=\"\
  16dp\"\n            android:textSize=\"30sp\"\n            app:layout_constraintLeft_toRightOf=\"\
  itemImage\"\n            app:layout_constraintStart_toEndOf=\"itemImage\"\n    \
  \        app:layout_constraintTop_toTopOf=\"parent\" />\n        <TextView\n   \
  \         android:id=\"@+id/itemDetail\"\n            android:layout_width=\"236dp\"\
  \n            android:layout_height=\"16dp\"\n            android:layout_marginStart=\"\
  16dp\"\n            android:layout_marginTop=\"8dp\"\n            app:layout_constraintLeft_toRightOf=\"\
  itemImage\"\n            app:layout_constraintStart_toEndOf=\"itemImage\"\n    \
  \        app:layout_constraintTop_toBottomOf=\"itemTitle\" />\n    </androidx.constraintlayout.widget.ConstraintLayout>\n\
  </androidx.cardview.widget.CardView>\n```\n\n### 48.4 添加 RecyclerView\n\n选择 `content_main.xml`\
  \ 布局文件并从调面板的 `Containers` 部分拖入 `RecyclerView` 对象到布局中，使其位于屏幕中心，它会自动调整填充整个屏幕。使用工具栏上的\
  \ `Infer constraints` 按钮为视图添加缺失的布局约束。使用 `Attributes` 工具窗口将 `RecyclerView` 实例的 ID\
  \ 更改为 `recyclerView`，并将 `layout_width` 和 `layout_height` 属性更改为 `match_constraint`。\n\
  \n### 48.5 添加图像\n\n除了两个 `TextView` 外，卡片布局还包含一个 `ImageView`，`RecyclerView adapter`\
  \ 已配置为显示图像。在测试项目之前，必须添加这些图像。项目将使用的图像命名为 `android_image_<n>.jpg`，可以在从以下 URL 下载示例代码的\
  \ `project_icons` 文件夹中找到：[`www.ebookfrenzy.com/retail/eeljava/index.php`](https://www.ebookfrenzy.com/retail/eeljava/index.php)\n\
  \n在操作系统的文件系统导航器中找到这些图像，选择并复制这八张图像。右键点击 Project 工具窗口中的 `app -> res -> drawable` 项并选择\
  \ `Paste` 将文件添加到文件夹中：\n\n![](img/Image24252.jpg)\n\n图 48-1\n\n\n\n\n\n# 48.6 创建\
  \ RecyclerView 适配器\n\n如上一节所述，`RecyclerView` 需要一个 `adapter`（适配器）来处理列表项的创建。在项目工具窗口中右键点击\
  \ `app` -> `java` -> `com.ebookfrenzy.carddemo`，选择 `New` -> `Java Class` 菜单向项目添加此新类。在新类对话框中，在\
  \ `Name` 字段输入 `RecyclerAdapter`，并在列表中选择 `Class`，然后按回键 `Return` 创建新的 Java 类文件。\n\n\
  编辑新的 `RecyclerAdapter.java` 文件以添加一些导入指令，并声明该类现在继承 `RecyclerView.Adapter`。我们没有创建一个单独的类来提供要显示的数据，而是向适配器添加了一些基础数组作为应用的数据：\n\
  \n```java\npackage com.ebookfrenzy.carddemo;\n\nimport android.view.LayoutInflater;\n\
  import android.view.View;\nimport android.view.ViewGroup;\nimport android.widget.ImageView;\n\
  import android.widget.TextView;\nimport androidx.annotation.NonNull;\nimport androidx.recyclerview.widget.RecyclerView;\n\
  \npublic class RecyclerAdapter extends RecyclerView.Adapter<RecyclerAdapter.ViewHolder>\
  \ {\n    final private String[] titles = {\"Chapter One\",\n            \"Chapter\
  \ Two\",\n            \"Chapter Three\",\n            \"Chapter Four\",\n      \
  \      \"Chapter Five\",\n            \"Chapter Six\",\n            \"Chapter Seven\"\
  ,\n            \"Chapter Eight\"};\n\n    final private String[] details = {\"Item\
  \ one details\",\n            \"Item two details\", \"Item three details\",\n  \
  \          \"Item four details\", \"Item five details\",\n            \"Item six\
  \ details\", \"Item seven details\",\n            \"Item eight details\"};\n\n \
  \   final private int[] images = { R.drawable.android_image_1,\n               \
  \                    R.drawable.android_image_2,\n                             \
  \      R.drawable.android_image_3,\n                                   R.drawable.android_image_4,\n\
  \                                   R.drawable.android_image_5,\n              \
  \                     R.drawable.android_image_6,\n                            \
  \       R.drawable.android_image_7,\n                                   R.drawable.android_image_8\
  \ };\n}\n```\n\n在 `RecyclerAdapter` 类中，我们现在需要 own `ViewHolder` 类的实现，并配置其引用 `card_layout.xml`\
  \ 文件中的视图元素。在 `RecyclerAdapter.java` 文件中按如下方式实现此类：\n\n```java\npublic class RecyclerAdapter\
  \ extends RecyclerView.Adapter<RecyclerAdapter.ViewHolder> {\n// ...\n    static\
  \ class ViewHolder extends RecyclerView.ViewHolder {\n        ImageView itemImage;\n\
  \        TextView itemTitle;\n        TextView itemDetail;\n\n        ViewHolder(View\
  \ itemView) {\n            super(itemView);\n            itemImage = itemView.findViewById(R.id.itemImage);\n\
  \            itemTitle = itemView.findViewById(R.id.itemTitle);\n            itemDetail\
  \ = itemView.findViewById(R.id.itemDetail);\n        }\n    }\n}\n```\n\n`ViewHolder`\
  \ 类包含一个 `ImageView` 和两个 `TextView` 变量，其构造方法使用 `card_layout.xml` 中的三个项目来初始化这些变量。下一个要添加到\
  \ `RecyclerAdapter.java` 文件中的项是 `onCreateViewHolder()` 方法的实现：\n\n```java\n@NonNull\n\
  @Override\npublic ViewHolder onCreateViewHolder(ViewGroup viewGroup, int i) {\n\
  \    View v = LayoutInflater.from(viewGroup.getContext())\n            .inflate(R.layout.card_layout,\
  \ viewGroup, false);\n    return new ViewHolder(v);\n}\n```\n\n此方法将由 `RecyclerView`\
  \ 调用以获取 `ViewHolder` 对象。它会膨胀 `card_layout.xml` 文件，并创建一个用视图层级结构初始化的 `ViewHolder`\
  \ 类实例，然后将其返回给 `RecyclerView`。\n\n`onBindViewHolder()` 方法的目的是用要显示的数据填充 `ViewHolder`\
  \ 对象中的视图层级结构。它接收一个 `ViewHolder` 对象和一个表示要显示的列表项的整数值。现在应该添加此方法，并使用项目编号作为数据数组的索引。然后，这些数据将使用\
  \ `ViewHolder` 类构造方法创建的引用显示在布局视图上：\n\n```java\n@Override\npublic void onBindViewHolder(ViewHolder\
  \ viewHolder, int i) {\n    viewHolder.itemTitle.setText(titles[i]);\n    viewHolder.itemDetail.setText(details[i]);\n\
  \    viewHolder.itemImage.setImageResource(images[i]);\n}\n```\n\n适配器类的最后一项要求是实现\
  \ `getItemCount()` 方法，在这种情况下，它简单地返回 titlestitles` 数组中的数量：\n\n```java\n@Override\n\
  public int getItemCount() {\n    return titles.length;\n}\n```\n\n# 48.7 初始化 RecyclerView\
  \ 组件\n\n此时，项目包含一个 `RecyclerView` 实例、一个 `CardView` 实例的 XML 布局文件以及一个 `RecyclerView`\
  \ 的 `adapter`。在测试目前进展之前的最后一步是使用布局管理器初始化 `RecyclerView`，创建 `adapter` 实例并将该实例分配给 `RecyclerView`\
  \ 对象。为了本示例，`RecyclerView` 将配置为使用 `LinearLayoutManager` 布局选项。\n\n这里有一点复杂之处，因为我们需要能够在\
  \ `MainActivity` 类内部使用视图绑定（view binding）来访问 `recyclerView` 组件。问题是 `recyclerView`\
  \ 包含在 `content_main.xml` 布局文件中，而该文件被包含在 `activity_main.xml` 中。为了能够访问 `content_main.xml`\
  \ 文件，我们需要在包含时为其分配一个 ID。编辑 `activity_main.xml` 文件，使 `include` 元素如下：\n\n```xml\n<include\n\
  \    android:id=\"@+id/contentMain\"\n    layout=\"@layout/content_main\" />\n```\n\
  \n为包含的文件分配 ID 后，可以使用以下绑定访问 `recyclerView` 组件：`binding.contentMain`\n\n现在编辑 `MainActivity.java`\
  \ 文件并修改 `onCreate()` 方法来实现初始化代码：\n\n```java\npackage com.ebookfrenzy.carddemo;\n\
  \nimport androidx.recyclerview.widget.LinearLayoutManager;\nimport androidx.recyclerview.widget.RecyclerView;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private RecyclerView\
  \ recyclerView;\n    private RecyclerView.LayoutManager layoutManager;\n    private\
  \ RecyclerView.Adapter adapter;\n\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        setSupportActionBar(toolbar);\n        layoutManager\
  \ = new LinearLayoutManager(this);\n        binding.contentMain.recyclerView.setLayoutManager(layoutManager);\n\
  \        adapter = new RecyclerAdapter();\n        binding.contentMain.recyclerView.setAdapter(adapter);\n\
  \    }\n}\n```\n\n# 48.8 测试应用程序\n\n在物理设备或模拟器会话上编译并运行应用，滚动列表中的不同的卡片：\n\n![](img/as_card_demo_running.jpg)\n\
  \n图 48-2\n\n# 48.9 响应卡片选择\n\n本项目的最后一个阶段是使列表中的卡片可选，这样点击卡片就会触发应用内的事件。在本文示例中，卡片将被配置为在用户点击时在屏幕上显示消息。为了响应点击，需要修改\
  \ `ViewHolder` 类以为每个项目视图分配一个 `OnClickListener`。编辑 `RecyclerAdapter.java` 文件并修改 `ViewHolder`\
  \ 类声明如下所示：\n\n```java\nimport com.google.android.material.snackbar.Snackbar;\n\n\
  class ViewHolder extends RecyclerView.ViewHolder {\n    ImageView itemImage;\n \
  \   TextView itemTitle;\n    TextView itemDetail;\n\n    ViewHolder(View itemView)\
  \ {\n        super(itemView);\n        itemImage = itemView.findViewById(R.id.itemImage);\n\
  \        itemTitle = itemView.findViewById(R.id.itemTitle);\n        itemDetail\
  \ = itemView.findViewById(R.id.itemDetail);\n    }\n}\n```\n\n\n\n\n\n```java\n\
  itemView.setOnClickListener(new View.OnClickListener() {\n    @Override\n    public\
  \ void onClick(View v) {\n\n    }\n});\n```\n\n在 `onClick` 程序的句体内部，现在可以添加代码来显示一条消息，指示卡片已被点击。由于点击后执行的操作可能取决于点击了哪张卡片，因此识别选中的卡片也同样重要。此信息可以通过调用\
  \ `RecyclerView.ViewHolder` 类的 `getAdapterPosition()` 方法获取。继续留在 `RecyclerAdapter.java`\
  \ 文件中，为 `onClick` 处理器添加代码，其内容如下：\n\n```java\n@override\npublic void onClick(View\
  \ v) {\n    int position = getAdapterPosition();\n    Snackbar.make(v, \"Click detected\
  \ on item \" + (position + 1),\n            Snackbar.LENGTH_LONG)\n            .setAction(\"\
  Action\", null).show();\n}\n```\n\n最后一个任务是启用 Android 应用中点击项时出现的 Material Design\
  \ 水波纹效果（ripple effect）。这仅涉及在 `card_layout.xml` 文件的 `CardView` 实例声明中添加一些属性，如下所示：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.cardview.widget.CardView\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:card_view=\"\
  http://schemas.android.com/apk/res-auto\"\n    android:layout_width=\"match_parent\"\
  \n    android:layout_height=\"match_parent\"\n    android:id=\"@+id/card_view\"\n\
  \    android:layout_margin=\"5dp\"\n    app:cardBackgroundColor=\"#81C784\"\n  \
  \  app:cardCornerRadius=\"12dp\"\n    app:cardElevation=\"3dp\"\n    app:contentPadding=\"\
  4dp\"\n    android:foreground=\"?selectableItemBackground\"\n    android:clickable=\"\
  true\" >\n```\n\n再次运行应用，验证点击列表中的卡片是否会触发接触点的标准水波纹效果，并显示报告所选项目编号的 `Snackbar`。\n\n\
  ### 48.10 总结\n\n本章介绍了结合 `CardView` 和 `RecyclerView` 组件以显示可滚的卡片项列表的步骤。示例还涵盖了对列表项点击的检测，包括识别选中的项目以及在被点击的\
  \ `CardView` 实例上启用水波纹视觉反馈。\n\n### 49. 布局编辑器示例数据教程\n\n在上一章中创建的 `CardDemo` 项目提供了一个很好的示例，说明了在完成应用并测试之前，很难从布局编辑器内部准确判断用户界面将呈现什么样子的。当用户界面中要显示的内容只有在用户安装并运行应用后才会生成或获取时，这个问题就会频繁发生。\n\
  \n从一段时间以来，Android Studio 布局编辑器一直提供了指定简单属性的能力，这些属性仅在设计布局时有效。例如，可以将一个仅用于设计时的字符串资源分配给布局编辑器中的\
  \ `TextView`，而该资源在应用运行时不会显示。随着 Android Studio 布局编辑器中引入示例数据支持，这一功能得到了显著扩展，并在本章中，它被用于改进\
  \ `CardDemo` 项目中的布局编辑器体验。\n\n#### 49.1 为项目添加示例数据\n\n在用户界面布局的设计阶段，`RecyclerView`\
  \ 实例（图 49-1）与上一章末尾测试的运行应用几乎没有相似之处：\n\n![](img/as_3.6_recyclerview_no_sample_data.jpg)\n\
  \n图 49-1\n\n在书中前面的“使用 Jetpack 构建现代 Android 应用架构”章节中，引入了示例数据的概念。为了演示示例数据的使用，现在将修改项目，使得完全填充的卡片出现在布局编辑器内部的\
  \ `RecyclerView` 中。然而在此之前，值得注意的是，布局编辑器有一系列预配置的示例数据模板，在设计用户界面时可以使用。要查看其中一些的的效果，请将\
  \ `content_main.xml` 布局文件加载到布局编辑器并选择 `RecyclerView` 实例。右键点击 `RecyclerView` 并选择 `Set\
  \ Sample Data` 菜单选项以显示设计视图属性（Design-time View Attributes）面板：\n\n![](img/as_3.2_design_time_attributes.jpg)\n\
  \n图 49-2\n\n将模板更改为 `Email Client` 选项并将项目计数更改为 `12`，注意 `RecyclerView` 变为显示来自模板的数据：\n\
  \n![](img/as_3.6_recyclerview_sample_data_email.jpg)\n\n图 49-3\n\n这些模板可以用于无需任何额外工作即可显示示例数据，并且通常提供足够的内容完成布局。对于此示例，将使用示例数据来显示\
  \ `RecyclerView` 中的卡片。在编辑器中仍加载 `content_main.xml` 文件的情况下，切换到 Code 模式并找到 `RecyclerView`\
  \ 元素，其内容如下：\n\n```xml\n<androidx.recyclerview.widget.RecyclerView\n    android:id=\"\
  @+id/recyclerView\"\n    android:layout_width=\"0dp\"\n    android:layout_height=\"\
  0dp\"\n    app:layout_constraintBottom=\"parent\"\n    app:layout_constraintEnd=\"\
  toEndOf=\"parent\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\"\n    tools:itemCount=\"12\"\n    tools:listitem=\"@layout/recycler_view_item\"\
  \ />\n```\n\n注意用于列表两个 `tools` 属性。虽然这些设置的范围超出了本书的范围，但可以在以下 URL 找到完整描述：https://developer.android.com/studio/write/tool-attributes#toolssample_resources\n\
  \n上述 `recycler_view_item` 文件是布局编辑器在选择示例数据模板时自动生成的，可以在项目窗口中找到。切换回 Design 模式，选中 `RecyclerView`\
  \ 后，使用设计视图属性面板将模板切回默认设置。`tools` 行将从项目被移除，正如图 49-4 所示：\n\n![](img/as_4.1_sample_data_list_item.jpg)\n\
  \n图 49-4\n\n要切换到使用卡片布局作为示例数据，添加 `listitem` 属性以引用 `card_layout.xml` 文件。在布局中选中 `RecyclerView`，在\
  \ Attributes 工具窗口中搜索 `listitem` 属性并在属性字段中输入 `@layout/card_layout`：\n\n![](img/as_sample_data_cards.jpg)\n\
  \n图 49-5\n\n注意每个列表项现在显示卡片布局，但没有任何图像且使用的是示例文本数据。下一步是在卡片布局中的视图显示某些图像和不同的文本。这既可以是布局编辑器提供的模板示例数据形式，也可以是专门为此项目添加的自定义示例数据。将\
  \ `card_layout.xml` 文件加载到布局编辑器，选择 `ImageView` 并按照本章前面的概述显示设计视图属性面板。从 `srcCompat`\
  \ 菜单中选择内置的背景/风景图像集，如下方的图 49-6 所示：\n\n![](img/as_3.6_recyclerview_sample_data_background_images.jpg)\n\
  \n图 49-6\n\n\n\n\n\n接下来，右键点击 `itemTitle` `TextView` 对象，选择 `Set Sample Data` 菜单选项，并在设计时属性面板（Design-time\
  \ attributes panel）中选择 `cities` 选项。对 `itemDetail` 视图重复此步骤，这次选择 `full_names` 选项，如图\
  \ 49-7 所示：\n\n![](img/as_3.6_recyclerview_sample_data_full_names.jpg)\n\n图 49-7\n\
  \n在设计模式下打开 `content_main.xml` 文件，并注意 `RecyclerView` 现在正在使用内置图像和示例文本数据：\n\n![](img/as_3.6_recyclerview_sample_data_cities.jpg)\n\
  \n图 49-8\n\n## 49.2 使用自定义样本数据\n\n本章的最后一步是演示如何在布局编辑器中使用自定义样本数据图像。这需要创建一个样本数据目录并添加一些文本和图像文件。在\
  \ `Project` 工具窗口中，右键点击 `app` 条目并选择 `New -> Sample Data Directory` 菜单选项，此时 `Project`\
  \ 工具窗口中会出现一个名为 `sampledata` 的新目录。如果新文件夹不可见，将 `Project` 工具窗口从 `Android` 切换到 `Project`\
  \ 模式，并在 `CardDemo -> app` 下找到该文件夹，如图 49-9 所示：\n\n![](img/as_4.2_sample_data_folder.jpg)\n\
  \n图 49-9\n\n右键点击 `sampledata` 目录，创建一个名为 `images` 的子目录，并按照上一章概述的步骤将 Android 图像复制粘贴到新文件夹中。在\
  \ `card_layout.xml` 文件中，再次显示 `ImageView` 的设计时视图属性面板（Design-time View Attributes），这次点击\
  \ `Browse` 链接并在 `Resources` 对话中选择新添加的 Android 图像（如果 `images` 文件夹未出现，请重新构建项目）：\n\n\
  ![](img/as_4.1_sample_data_pick_drawing.jpg)\n\n图 49-10\n\n再次右键点击 `sampledata` 目录，选择\
  \ `New -> File` 选项，将文件命名为 `chapters`，并输入以下内容：\n\n```\nChapter One\nChapter Two\n\
  Chapter Three\nChapter Four\nChapter Five\nChapter Six\nChapter Seven\nChapter Eight\n\
  ```\n\n接下来，创建一个名为 `items` 的第二个文本文件，内容如下：\n\n```\nItem one details\nItem two details\n\
  Item three details\nItem four details\nItem five details\nItem six details\nItem\
  \ seven details\nItem eight details\n```\n\n创建样本数据文本文件后，剩下的只需在 `card_layout.xml`\
  \ 文件的视图元素中按如下引用它们：\n\n```xml\n<TextView\n    android:id=\"@+id/itemTitle\"\n   \
  \ android:layout_width=\"236dp\"\n    android:layout_height=\"39dp\"\n    android:layout_marginStart=\"\
  16dp\"\n    android:textSize=\"30sp\"\n    app:layout_constraintLeft_toRightOf=\"\
  @+id/itemImage\"\n    app:layout_constraintStart_toEndOf=\"@+id/itemImage\"\n  \
  \  app:layout_constraintTop_toTopOf=\"parent\"\n    tools:text=\"@sample/chapters\"\
  \ />\n\n<TextView\n    android:id=\"@+id/itemDetail\"\n    android:layout_width=\"\
  236dp\"\n    android:layout_height=\"16dp\"\n    android:layout_marginStart=\"16dp\"\
  \n    android:layout_marginTop=\"8dp\"\n    app:layout_constraintLeft_toRightOf=\"\
  @+id/itemImage\"\n    app:layout_constraintStart_toEndOf=\"@+id/itemImage\"\n  \
  \  app:layout_constraintTop_toBottomOf=\"@+id/itemTitle\"\n    tools:text=\"@sample/items\"\
  \ />\n```\n\n重新构建应用并返回 `content_main.xml` 文件中的布局设计，此时自定义样本数据和图像应该已经显示在 `RecyclerView`\
  \ 列表中：\n\n![](img/as_3.6_sample_data_running.jpg)\n\n图 49-11\n\n与其使用两个独立的文本文件和对图像集的引用，另一种选项是在\
  \ JSON 文件中声明样本数据。例如：\n\n```json\n{\n  \"mydata\": [\n    {\n      \"chapter\" :\
  \ \"Chapter One\",\n      \"details\": \"Item one details\",\n      \"image\": \"\
  @sample/images\"\n    },\n    {\n      \"chapter\" : \"Chapter Two\",\n      \"\
  details\": \"Item two details\",\n      \"image\": \"@sample/images\"\n    }\n.\n\
  \  ]\n}\n```\n\n假设上述内容包含在名为 `chapterdata.json` 的文件中，则在视图 XML 元素中的引用方式如下：\n\n```xml\n\
  <ImageView\n    tools:src=\"@sample/chapterdata.json/mydata\" />\n\n<TextView\n\
  \    tools:text=\"@sample/chapterdata.json/chapter\" />\n\n<TextView\n    tools:text=\"\
  @sample/chapterdata.json/details\" />\n```\n\n### 49.3 总结\n\n本章演示了在布局编辑器中使用样本数据以提供更真实的表示。本教程涵盖的步骤包括使用现有的样本数据以及集成自定义样本数据。\n\
  \n## 50 使用 AppBar 和折叠布局\n\n在本章中，我们将探索如何自定义 Activity 布局内应用栏（app bar）并使其对滚动事件做出响应的方法。通过使用\
  \ `CoordinatorLayout` 配合 `AppBarLayout` 和 `CollapsingToolbarLayout`，可以配置应用栏的进入和退出。\n\
  \n### 50.1 AppBar 的结构\n\n应用栏是应用运行时显示在顶部的区域，可以配置为包含状态栏、工具栏和可扩展区域。图 50-1 展示了一个包含状态栏、工具栏和标签栏的应用栏：\n\
  \n![](img/2427.jpg)\n\n图 50-1\n\n可扩展区域可以使用背景颜色填充，或者如图 50-2 所示，显示在 `ImageView` 图像：\n\
  \n![](img/2436.jpg)\n\n图 50-2\n\n正如本章其余部分所示，如果 Activity 用户界面的主体区域包含可滚动内容，可以配置应用栏元素随屏幕滚动进行展开和收起。\n\
  \n### 50.2 示例项目\n\n为了本示例，将在早期章节 Android RecyclerView 和 CardView 教程创建的 `CardDemo`\
  \ 项目基础上进行修改。启动 Android Studio 并加载该项目。\n\n项目加载后，运行应用并注意向上滚动列表时，工具栏保持可见，如图 50-3 所示：\n\
  \n![](img/2443.jpg)\n\n图 50-3\n\n### 50.3 协调 RecyclerView 和工具栏\n\n第一步是进行一些配置更改，使工具栏在向上滚动过程中收起，在向下滚动时展开。\n\
  \n\n\n\n`CoordinatorLayout` 同样可以用于根据视图层级中某些视图的滚动动作，使应用栏（app bar）的元素滑入或滑出视图。图 50-4\
  \ 所示的布局层级中，其中一个元素就是 `ConstraintLayout`。为了实现这种协调行为，必须在发生滚动的元素以及与滚动进行协调的元素上都设置属性。\n\
  \n在滚动元素（在此例中 `RecyclerView`）上，必须将 `android:layout_behavior` 属性设置为 `appbar_scrolling_view_behavior`。在\
  \ `content_main.xml` 文件中，找到顶层 `ConstraintLayout` 元素，并注意该属性已默认设置：\n\n```xml\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    app:layout_behavior=\"@string/appbar_scrolling_view_behavior\" >\n```\n\n\
  接下来，在布局编辑器中打开 `activity_main.xml` 文件，切换到 Code 模式并找到 `AppBarLayout` 元素。注意视图层级中 `AppBarLayout`\
  \ 的唯一子元素是 `Toolbar`。为了让工具栏对 `RecyclerView` 中发生的滚动事件做出反应，必须在该元素上设置 `app:layout_scrollFlags`\
  \ 属性。赋值给该属性的值取决于所需的交互性质，并且必须由以下一个或多个选项组成：\n\n- **scroll** – 表示该视图将滚动出屏幕。如果不设置此项，在滚动事件期间，该视图将固定在屏幕顶部。\n\
  - **enterAlways** – 与 `scroll` 选项配合使用时，向上滚动的动作会导致视图收回。在此模式下，任何向下滚动动作都会导致视图重新出现。\n\
  - **enterAlwaysCollapsed** – 设置在视图上时，在向下滚动动作达到列表限制之前，该视图不会从折叠状态展开。如果设置了 `minHeight`\
  \ 属性，视图将在初始滚动期间出现，但只到达到最小高度为止。随后它将保持在该高度，在到达列表顶部之前不会完全展开。注意，此选项仅在与 `enterAlways`\
  \ 和 `scroll` 选项结合使用时有效。例如：\n\n```xml\napp:layout_scrollFlags=\"scroll|enterAlways|enterAlwaysCollapsed\"\
  \nandroid:minHeight=\"20dp\"\n```\n\n- **exitUntilCollapsed** – 设置后，视图在向上滚动期间会折叠，直到达到\
  \ `minHeight` 阈值，此时它将保持在该高度，直到滚动方向改变。\n\n为了本例的演示，`scroll` 和 `enterAlways` 选项将如下所示设置在\
  \ `Toolbar` 上：\n\n```xml\n<androidx.appcompat.widget.Toolbar\n    android:id=\"\
  @+id/toolbar\"\n    android:layout_width=\"match_parent\"\n    android:layout_height=\"\
  ?attr/actionBarSize\"\n    android:background=\"?attr/colorPrimary\"\n    app:popupTheme=\"\
  @style/Theme.CardDemo.PopupOverlay\"\n    app:layout_scrollFlags=\"scroll|enterAlways\"\
  \ />\n```\n\n在设置了相应的属性后，再次运行应用并在 `RecyclerView` 列表中执行向上滚动动作。这应该导致工具栏折叠出视图（图 50-5）。向下滚动动作应该导致工具栏重新出现。\n\
  \n![](img/Image2459.jpg)\n\n图 50-5\n\n## 50.4 引入折叠工具栏布局\n\n`CollapsingToolbarLayout`\
  \ 容器通过提供更广泛的选项，以及在响应协调滚动动作时对应用栏及其子元素的折叠提供更深层次的控制，增强了标准工具栏。`CollapsingToolbarLayout`\
  \ 类旨在被作为 `AppBarLayout` 的子元素添加，并提供诸如在工具栏折叠和展开时自动调整工具栏标题字体大小的功能。视差模式（parallax mode）允许应用栏中的指定内容在折叠时淡出视图，而固定模式（pin\
  \ mode）则允许应用栏的元素在收缩期间保持在固定位置。\n\n还可以遮罩（scrim）选项，用于指定工具栏在折叠序列期间过渡的颜色。\n\n为了看到这些功能的效果，将修改\
  \ `activity_main.xml` 文件中包含的应用栏，以使用 `CollapsingToolbarLayout` 类，并添加一个 `ImageView`\
  \ 以更好地演示视差模式的效果。使用 `CollapsingToolbarLayout` 的新视图层级由图 50-6 中的图所示：\n\n![](img/as3.0_appbar_collapsing_tree.jpg)\n\
  \n图 50-6\n\n在 Code 模式下将 `activity_main.xml` 文件加载到 Layout Editor 工具中，并修改布局如下：\n\n\
  ```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.coordinatorlayout.widget.CoordinatorLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    tools:context=\".MainActivity\">\n    <google.android.material.app.AppBarLayout\n\
  \        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  wrap_content\"\n        android:theme=\"@style/Theme.CardDemo.AppBarOverlay\">\n\
  \        <google.android.material.appbar.CollapsingToolbarLayout\n            android:id=\"\
  @+id/collapsing_toolbar\"\n            android:layout_width=\"match_parent\"\n \
  \           android:layout_height=\"match_parent\"\n            app:layout_scrollFlags=\"\
  scroll|enterAlways\"\n            android:fitsSystemWindows=\"true\"\n         \
  \   app:expandedTitleBottom=\"30dp\"\n            app:expandedTitleStart=\"15dp\"\
  \n            app:expandedTitleEnd=\"64dp\">\n            <android.widget.ImageView\n\
  \                android:id=\"@+id/backdrop\"\n                android:layout_width=\"\
  match_parent\"\n                android:layout_height=\"200dp\"\n              \
  \  android:scaleType=\"centerCrop\"\n                android:fitsSystemWindows=\"\
  true\"\n                app:layout_collapseMode=\"parallax\"\n                android:src=\"\
  @drawable/appbar_image\" />\n            <androidx.appcompat.widget.Toolbar\n  \
  \              android:id=\"@+id/toolbar\"\n                android:layout_width=\"\
  match_parent\"\n                android:layout_height=\"?attr/actionBarSize\"\n\
  \                android:background=\"?attr/colorPrimary\"\n                app:popupTheme=\"\
  @style/Theme.CardDemo.PopupOverlay\"\n                app:layout_collapseMode=\"\
  pin\" />\n        </google.android.material.appbar.CollapsingToolbarLayout>\n  \
  \  </google.android.material.app.AppBarLayout>\n    <androidx.view.View\n      \
  \  android:id=\"@+id/contentMain\"\n        layout=\"@layout/content_main\" />\n\
  </androidx.coordinatorlayout.widget.CoordinatorLayout\n```\n\n除了向上述布局添加新元素外，还删除了背景颜色属性设置。此更改的优点是提供了透明工具栏，允许应用栏中显示更多图像。\n\
  \n使用你操作系统的文件导航器，在书籍代码示例下载的 `project_icons` 文件夹中找到 `appbar_image.jpg` 文件并复制。在 Project\
  \ 工具窗口的 `app` -> `res` -> `drawable` 条上点击右键，并在生成的菜单中选择粘贴。\n\n运行时，应用栏应如图 50-7 所示：\n\
  \n![](img/as_cardlayout_image.jpg)\n\n图 50-7\n\n向上滚动列表会导致应用栏逐渐折叠。在收缩期间，图像将淡入到 scrim\
  \ 属性定义的颜色，同时标题文本的字体大小随之减小，直到只看到工具栏：\n\n![](img/as_cardlayout_image_collapsed.jpg)\n\
  \n图 50-8\n\n\n\n在滚动动作的初始阶段，由于灵活区域收叠，工具栏仍然保持可见（如果继续向上滚动，工具栏也会从视图中退回），这是因为 `activity_main.xml`\
  \ 文件中的工具栏元素被配置为使用 `pin`（固定）模式：\n\n```xml\napp:layout_collapseMode=\"pin\"\n```\n\
  \n如果将折叠模式设置为 `parallax`（视差），工具栏将随着视图一起收。\n\n继续向上滚动会导致工具栏也收叠，只留下状态栏可见：\n\n![](img/as_cardlayout_image_fully_collapsed.jpg)\n\
  \n图 50-9\n\n由于 `CollapsingToolbarLayout` 元素的 `scrollFlags` 属性包含了 `enterAlways` 选项，向下滚动将导致应用栏再次展开。\n\
  \n要将工具栏固定在位置，使其在向上滚动过程中不再消失，请按照所示所示，将 `activity_main.xml` 文件中 `CollapsingToolbarLayout`\
  \ 元素的 `layout_scrollFlags` 属性中的 `enterAlways` 替换为 `exitUntilCollapsed`：\n\n```xml\n\
  <com.google.android.material.appbar.CollapsingToolbarLayout\n    android:id=\"@+id/collapsing_toolbar\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    app:layout_scrollFlags=\"scroll|exitUntilCollapsed\"\n    android:fitsSystemWindows=\"\
  true\"\n    app:expandedTitleMarginBottom=\"30dp\"\n    app:expandedTitleMarginStart=\"\
  15dp\"\n    app:expandedTitleMarginEnd=\"64dp\">\n```\n\n## 50.5 修改标题和遮罩颜色\n\n最后一个任务是编辑\
  \ `MainActivity.java` 文件并在 `onCreate()` 方法中添加一些代码，以更改折叠布局管理器实例上的标题文本并设置不同的遮罩颜色（注意，遮罩颜色也可以在布局资源文件中设置）：\n\
  \n```java\npackage com.ebookfrenzy.carddemo;\n\n.\n.\n\nimport com.google.android.material.appbar.CollapsingToolbarLayout;\n\
  import android.graphics.Color;\n\n.\n.\n.\n\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        binding\
  \ = ActivityMainBinding.inflate(getLayoutInflater());\n        setContentView(binding.getRoot());\n\
  \        setSupportActionBar(binding.toolbar);\n        binding.collapsingToolbar.setTitle(\"\
  My Toolbar Title\");\n        binding.collapsingToolbar.setContentScrimColor(Color.GREEN);\n\
  \        layoutManager = new LinearLayoutManager(this);\n        binding.contentMain.recyclerView.setLayoutManager(layoutManager);\n\
  \        adapter = new RecyclerAdapter();\n        binding.contentMain.recyclerView.setAdapter(adapter);\n\
  \    }\n.\n.\n```\n\n最后运行一次应用程序，并新新标题出现在应用栏中，并且现在滚动会导致工具栏在从视图中退回时过渡到绿色。\n\n### 50.6\
  \ 总结\n\n大多数 Android 应用顶部的应用栏可以由许多不同的元素组成，包括工具栏、标签布局甚至图像视图。当嵌入在 `CoordinatorLayout`\
  \ 父布局中，可以使用许多不同的选项来控制应用栏响应活动主要内容滚动事件的行为方式。为了对这种行为进行更强的控制，`CollapsingToolbarLayout`\
  \ 管理器提供了应用栏内容相对于滚动活动展开和收缩方式的一系列额外控制级别。\n\n## 51. Android Studio 主界面/详情流教程\n\n本章将在探索主界面/详情（Primary/Detail）用户界面设计概念之前，将详细介绍构成\
  \ Android Studio 带的主界面/详情流模板的元素。随后将创建一个示例应用程序，演示修改模板以满足应用程序开发者特定需求所需的步骤。\n\n###\
  \ 51.1 主界面/详情流\n\n主界面/详情流是一种界面设计概念，其中向用户显示项目列表（称为主列表）。当从列表中选择一个项目时，与该项目相关的附加信息将在详情窗格中呈现给用户。例如，一个电子邮件应用程序可能由一个收到的消息主列表组成，该列表由发件者地址和消息主题组成。当从主列表中选择一条消息时，邮件正文将显示在详情窗格中。\n\
  \n在横屏模式的平板尺寸 Android 设备显示器上，主列表显示在屏幕左边缘的狭窄垂直面板中。屏幕的其余部分用于详情窗格，这种布局被称为双窗格模式。例如，图\
  \ 51-1 显示了主界面/详情的双窗格布局，其中列出了主项目，项目一的内容显示在详情窗格中：\n\n![](img/detail_flow_tablet.jpg)\n\
  \n图 51-1\n\n在较小的手机尺寸 Android 设备上，主列表占据整个屏幕，当从主列表中做出选择时，详情窗格将出现在单独的屏幕上。在这种模式下，详情屏幕包含一个用于返回主列表的操作栏。例如，图\
  \ 51-2 展示了同一个项目的主界面屏幕和详情屏幕：\n\n![](img/detail_flow_phone.jpg)\n\n图 51-2\n\n### 51.2\
  \ 创建主界面/详情流\n\n在本章的下一节中，将涵盖组成主界面/详情流的不同元素。实现此点的最佳方法是创建一个项目。该项目随后将作为本章最后教程的基础。\n\n\
  从欢迎界面选择“New Project（新建项目）”，并在项目对话框中选择“Primary/Detail”模板。在“Name（名称）”字段中输入 `PrimaryDetailFlow`，并指定\
  \ `com.ebookfrenzy.primaryflow` 作为包名。在点击“Finish（完成）”按钮之前，将 Minimum API 设置为 26: Android\
  \ 8.0 (Oreo)，并将 Language（语言）菜单设置为 Java。\n\n### 51.3 修改主界面/详情模板\n\n虽然主界面/详情流的结构初看起来可能很复杂，正如事实所示，模板提供的许多功能对于许多主界面/详情需求可以保持不变。\n\
  \n在本章的剩余部分中，将修改 `PrimaryDetailFlow` 项目，使主列表显示网站列表，并将详情窗格改为 `WebView` 而不是当前的 `TextView`。当用户选择网站时，相应的网页将在详情窗格中加载并显示。\n\
  \n### 51.4 更改内容模型\n\n示例的内容由 `PlaceholderContent` 类定义。因此，首先选择 `PlaceholderContent.java`\
