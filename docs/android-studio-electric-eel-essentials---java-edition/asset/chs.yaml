  \n    package=\"com.ebookfzy.webprint\" >\n    <uses-permission android:name=\"\
  android.permission.INTERNET\" />\n    <application android:allowBackup=\"true\"\n\
  </manifest>\n```\n\n### 76.7 从 Activity 访问 WebView\n\n与“一个 RecyclerView 和 CardView”章节中的项目一样，我们需要能够使用\
  \ view binding 从 `MainActivity` 类内部访问 `content_main.xml` 文件包含的组件（在本例中为 `myWebView`）。为了能够访问\
  \ `content_main.xml` 文件中的视图，我们再次需要在包含它时为其分配一个 `id`。编辑 `activity_main.xml` 文件并修改\
  \ `include` 元素如下所示：\n\n```xml\n<include android:id=\"@+id/contentMain\" layout=\"\
  @layout/content_main\" />\n```\n\n### 76.8 将网页加载到 WebView 中\n\n在打印网页之前，需要将其加载到 `WebView`\
  \ 实例中。对于本教程，这将通过调用 `WebView` 实例的 `loadUrl()` 方法来实现，该方法将放在名为 `configureWebView()`\
  \ 的方法中，并在 `MainActivity` 类的 `onStart()` 方法中调用。因此，编辑 `MainActivity.java` 文件并进行如下修改：\n\
  \n```java\npackage com.ebookfzy.webprint;\n\nimport android.view.Menu;\nimport android.view.MenuItem;\n\
  import android.webkit.WebView;\nimport android.webkit.WebViewClient;\nimport android.webkit.WebResourceRequest;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private WebView myWebView;\n\
  \n    @Override\n    protected void onStart() {\n        super.onStart();\n    \
  \    configureWebView();\n    }\n\n    private void configureWebView() {\n     \
  \   myWebView = findViewById(R.id.myWebView);\n        myWebView.setWebViewClient(new\
  \ WebViewClient() {\n            @Override\n            public boolean shouldOverrideLoading(WebView\
  \ view, WebResourceRequest request) {\n                return super.shouldOverrideLoading(view,\
  \ request);\n            }\n        });\n        myWebView.loadUrl(\"https://www.answertopia.com\"\
  );\n    }\n}\n```\n\n### 76.9 添加打印菜单选项\n\n现在将根据“在 Android 中创建溢出菜单”章节概述的技术添加打印网页选项。第一个要求是用于标记菜单选项的字符串资源。在\
  \ Project 窗口中，找到 `app -> res -> values -> strings.xml` 文件，双击将其加载到编辑器并修改以添加新的字符串资源：\n\
  \n```xml\n<resources>\n    <string name=\"app_name\">WebPrint</string>\n    <string\
  \ name=\"action_settings\">Settings</string>\n    <string name=\"print_string\"\
  >Print</string>\n</resources>\n```\n\n接下来，将 `app -> res -> menu -> menu_main.xml`\
  \ 文件加载到菜单编辑器中，切换到 Code 模式并将 Settings 菜单替换为打印选项：\n\n```xml\n<menu xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    tools:context=\"com.ebookfrenzy.webprint.MainActivity\" >\n    <item android:id=\"\
  @+id/action_settings\"\n        android:title=\"@string/action_settings\"\n    \
  \    android:priority=\"100\"\n        app:showAsAction=\"never\" />\n    <item\n\
  \        android:id=\"@+id/action_print\"\n        android:priority=\"100\"\n  \
  \      app:showAsAction=\"never\"\n        android:title=\"@string/print_string\"\
  />\n</menu>\n```\n\n配置菜单选项剩下的只需修改 `MainActivity.java` 文件中的 `onOptionsItemSelected()`\
  \ 处理方法了：\n\n```java\n@Override\npublic boolean onOptionsItemSelected(MenuItem item)\
  \ {\n    int id = item.getItemId();\n    if (id == R.id.action_print) {\n      \
  \  createWebPrintJob(myWebView);\n        return true;\n    }\n    return super.onOptionsItemSelected(item);\n\
  }\n```\n\n\n\n\n在实现 `onOptionsItemSelected()` 方法后，当从溢出菜单中选择打印选项时，活动将调用名为 `createWebPrintJob()`\
  \ 的方法。该方法的实现方式与之前的 `HTMLPrint` 项目中使用的相同，现在可以将其添加到 `MainActivity.java` 文件中，其内容如下：\n\
  \n```java\npackage com.ebookfrenzy.webprint;\n\n.\n.\n.\n\nimport android.print.PrintAttributes;\n\
  import android.print.PrintDocumentAdapter;\nimport android.print.PrintManager;\n\
  import android.content.Context;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private WebView myWebView;\n.\n.\n    private void createWebPrintJob(WebView\
  \ webView) {\n        PrintManager printManager = (PrintManager) this\n        \
  \            .getSystemService(Context.PRINT_SERVICE);\n        PrintDocumentAdapter\
  \ printAdapter =\n                    webView.createPrintDocumentAdapter(\"MyDocument\"\
  );\n        String jobName = getString(R.string.app_name) +\n                  \
  \  \" Print Test\";\n        printManager.print(jobName, printAdapter,\n       \
  \             new PrintAttributes.Builder().build());\n    }\n.\n.\n}\n```\n\n代码更改完成后，在物理\
  \ Android 设备或运行 Android 5.0 或更高版本的模拟器上运行应用程序。一旦成功启动，`WebView` 应该是可见的并加载了指定的网页。页面加载后，从溢出菜单中选择打印选项，并使用生成的打印面板将网页打印到合适的目标。\n\
  \n### 76.10 总结\n\nAndroid 打印框架包含了对 `WebView` 类的扩展，这使得在 Android 应用程序内部打印基于 HTML 的成为成为。这些内容可以是应用程序在运行时动态创建的\
  \ HTML 形式，也可以是加载到 `WebView` 实例中的预现有网页。在动态创建 HTML 的情况下，使用 `WebViewClient` 实例进行是非常重要的，以确保在\
  \ HTML 完全加载到 `WebView` 之前，不会开始打印。\n\n## 77. Android 自定义文档打印指南\n\n正如我们在前面的章节中所看到的，只要内容是图像或\
  \ HTML 标记形式，Android 打印框架就可以相对容易地在应用程序中构建打印支持。通过利用打印框架的自定义文档打印功能，可以满足更高级的打印需求。\n\n\
  ### 77.1 Android 自定义文档打印概述\n\n通俗来说，自定义文档打印使用画布来表示要打印的文档页面。应用程序在这些画布上以形状、颜色、文本和图像的形式绘制要打印的内容。事实上，画布是由\
  \ `Android Canvas` 类的实例表示的，从而提供了对丰富绘制选项的访问。一旦绘制了所有页面，就可以打印文档。\n\n虽然这听起来足够简单，但实际上有许多步骤需要执行才能实现，这些步骤可以总结如下：\n\
  \n- 实现一个继承自 `PrintDocumentAdapter` 类的自定义打印适配器\n- 获取打印管理器服务（Print Manager Service）的引用\n\
  - 创建 `PdfDocument` 类的实例，用于存储文档页面\n- 以 `PdfDocument.Page` 实例的形式将页面添加到 `PdfDocument`\
  \ 中\n- 获取与文档页面相关的 `Canvas` 对象的引用\n- 在画布上绘制内容\n- 将 PDF 文档写入由打印框架提供的目标输出流中\n- 通知打印框架文档已准备好可以打印\n\
  \n在本章中，将提供对这些步骤的概述，随后是一个详细的教程，旨在演示如何在 Android 应用程序中演示自定义文档打印的实现。\n\n### 77.1.1 自定义打印适配器\n\
  \n打印适配器的作用是为打印框架提供要打印的内容，并确保其按照用户选择的偏好正确格式化（考虑纸张大小和页面方向等因素）。\n\n在打印 HTML 和图像时，大部分工作由\
  \ Android 打印框架的一部分提供的打印适配器完成，这些适配器是为这些特定的打印任务设计的。例如，在打印网页时，调用 `WebView` 类实例的 `createPrintDocumentAdapter()`\
  \ 方法时，就会为我们创建一个打印适配器。\n\n然而，在自定义文档打印的情况下，应用程序开发者有责任设计打印适配器并实现绘制和格式化内容的代码以为打印准备。\n\
  \n自定义打印适配器通过子类 `PrintDocumentAdapter` 类并重写该类中的一组回调方法来创建，这些回调方法将在打印过程的各个阶段由打印框架调用。这些回调方法可以总结如下：\n\
  \n- `onStart()` – 当打印过程开始时调用此方法，提供该方法是为了让应用程序代码有机会在创建打印作业之前执行任何必要的任务。在 `PrintDocumentAdapter`\
  \ 子类中实现此方法是可选的。\n- `onLayout()` – 此回调方法在调用 `onStart()` 方法之后被调用，并且每当用户更改打印设置（如更改方向、纸张大小或颜色设置）时再次调用。此方法应根据需要调整内容和布局。一旦完成更改，该方法必须返回要打印的页面数。在\
  \ `PrintDocumentAdapter` 子类中实现 `onLayout()` 方法是强制的。\n- `onWrite()` – 此方法在每次调用 `onLayout()`\
  \ 之后被调用，负责在打印页面的画布上渲染内容。除其他参数外，此方法传递了一个文件描述符，渲染完成后必须将生成的 PDF 写入其中。然后调用 `onWriteFinished()`\
  \ 回调方法并传递一个关于页面范围的参数。在 `PrintDocumentAdapter` 子类中实现 `onWrite()` 方法是强制的。\n- `onFinish()`\
  \ – 一个可选方法，如果实现，它将在打印过程完成后由打印框架调用一次，从而为应用程序提供执行任何必要的清理操作的机会。\n\n### 77.2 准备自定义打印项目\n\
  \n\n\n\n在 Android 内部打印自定义文档时的大部分工作涉及自定义打印适配器（print adapter）的实现。此示例将需要一个实现了 `onLayout()`\
  \ 和 `onWrite()` 回调方法的打印适配器。在 `MainActivity.java` 文件中添加此新类的模板，使其内容如下：\n\n```java\n\
  package com.ebookfrenzy.customprint;\n\n.\n.\n\nimport android.os.CancellationSignal;\n\
  \nimport android.os.ParcelFileDescriptor;\n\nimport android.print.PageRange;\n\n\
  import android.print.PrintAttributes;\nimport android.print.PrintDocumentAdapter;\n\
  import android.content.Context;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    public static class MyPrintDocumentAdapter extends PrintDocumentAdapter\n\
  \    {\n        Context context;\n        MyPrintDocumentAdapter(Context context)\n\
  \        {\n            this.context = context;\n        }\n        @Override\n\
  \        public void onLayout(PrintAttributes oldAttributes,\n                 \
  \                    PrintAttributes newAttributes,\n                          \
  \           CancellationSignal cancellationSignal,\n                           \
  \          LayoutResultCallback callback,\n                                    \
  \ Bundle metadata) {\n        }\n        @Override\n        public void onWrite(final\
  \ PageRange[] pageRanges,\n                                     final ParcelFileDescriptor\
  \ destination,\n                                     final CancellationSignal\n\
  \                                     cancellationSignal,\n                    \
  \                 final WriteResultCallback callback) {\n        }\n    }\n.\n.\n\
  }\n```\n\n目前这个新类，它包含一个构造函数方法，该方法会在创建类的新实例时被调用。构造函数接受调用活动的上下文（context）作为参数，并将其存储，以便在随后的两个回调方法中引用它。\n\
  \n在建立类的大纲后，下一步是开始实现这两个回调方法，从 `onLayout()` 开始。\n\n### 77.4 实现 onLayout() 回调方法\n\n\
  继续停留在 `MainActivity.java` 文件中，首先添加一些 `onLayout()` 方法中的代码所需的导入指令：\n\n```java\npackage\
  \ com.ebookfrenzy.customprint;\n\n.\n.\n\nimport android.print.PrintDocumentInfo;\n\
  import android.print.pdf.PrintedPdfDocument;\nimport android.graphics.pdf.PdfDocument;\n\
  \npublic class MainActivity extends AppCompatActivity {\n.\n.\n}\n```\n\n接下来，修改\
  \ `MyPrintDocumentAdapter` 类以声明在 `onLayout()` 方法中使用的变量：\n\n```java\npublic static\
  \ class MyPrintDocumentAdapter extends PrintDocumentAdapter\n{\n    Context context;\n\
  \    int pageHeight;\n    int pageWidth;\n    PdfDocument myPdfDocument;\n    int\
  \ totalpages = 4;\n.\n}\n```\n\n请注意，为了本示例，将打印一个四页的文档。在更复杂的情况下，应用程序可能需要根据内容的数量以及布局相对于用户纸张尺寸和方向动态计算要打印的页数。\n\
  \n声明变量后，按照以下代码大纲实现 `onLayout()` 方法：\n\n```java\n@Override\npublic void onLayout(PrintAttributes\
  \ oldAttributes,\n                                     PrintAttributes newAttributes,\n\
  \                                     CancellationSignal cancellationSignal,\n \
  \                                    LayoutResultCallback callback,\n          \
  \                           Bundle metadata) {\n    myPdfDocument = new PrintedPdfDocument(context,\
  \ newAttributes);\n    pageHeight = newAttributes.getMediaSize().getHeightMils()/1000\
  \ * 72;\n    pageWidth = newAttributes.getMediaSize().getWidthMils()/1000 * 72;\n\
  \    if (cancellationSignal.isCanceled() ) {\n        callback.onLayoutCancelled();\n\
  \        return;\n    }\n    if (totalpages > 0) {\n        PrintDocumentInfo.Builder\
  \ builder = new PrintDocumentInfo\n                .Builder(\"print_output.pdf\"\
  ).setContentType(\n                PrintDocumentInfo.CONTENT_TYPE_DOCUMENT)\n  \
  \              .setPageCount(totalpages);\n        PrintDocumentInfo info = builder.build();\n\
  \        callback.onLayoutFinished(info, true);\n    } else {\n        callback.onLayoutFailed(\"\
  Page count is zero.\");\n    }\n}\n```\n\n显然，该方法执行了许多任务，每项任务都需要详细的解释。\n\n首先，以 `PdfDocument`\
  \ 类实例的形式创建了一个新的 PDF 文档。当打印框架调用 `onLayout()` 方法时，传入的参数之一是 `PrintAttributes` 类型的对象，包含了用户为打印输出选择的纸张尺寸、分辨率和颜色设置详情。在创建\
  \ PDF 文档时会使用这些设置，以及之前由构造方法为我们存储的活动上下文：\n\n`myPdfDocument = new PrintedPdfDocument(context,\
  \ newAttributes);`\n\n该方法随后使用 `PrintAttributes` 对象提取文档页的高度和宽度值。这些维度以英寸千分之一的形式存储在对象中。由于本示例稍后使用这些值的方法是以\
  \ 1/72 英寸为单位运行的，因此这些数字在存储之前进行了转换：\n\n`pageHeight = newAttributes.getMediaSize().getHeightMils()/1000\
  \ * 72;`\n`pageWidth = newAttributes.getMediaSize().getWidthMils()/1000 * 72;`\n\
  \n虽然此示例没有使用用户的颜色选择，但可以通过调用 `PrintAttributes` 对象的 `getColorMode()` 方法获取此属性，该方法将返回\
  \ `COLOR_MODE_COLOR` 或 `COLOR_MODE_MONOCHROME` 值之一。\n\n当调用 `onLayout()` 方法时，会传递一个\
  \ `LayoutResultCallback` 类型的对象。该对象提供了一种通过一组方法向打印框架返回状态信息的方法。例如，如果用户取消打印过程，将调用 `onLayout()`\
  \ 方法。进程已取消通过 `CancellationSignal` 参数中的设置指示。如果检测到取消，`onLayout()` 方法必须调用 `LayoutResultCallback`\
  \ 对象的 `onLayoutCancelled()` 方法来通知打印框架已收到取消：\n\n`if (cancellationSignal.isCanceled()\
  \ ) {`\n`callback.onLayoutCancelled();`\n`return;`\n\n当布局工作完成后，方法要求调用 `LayoutResultCallback`\
  \ 对象的 `onLayoutFinished()` 方法并传入两个参数。第一个参数采用 `PrintDocumentInfo` 对象的形式，包含了要打印文档的信息。这些信息包括用于\
  \ PDF 的名称、内容类型（在此情况下是文档而非图像）以及页数。第二个参数是一个布尔值，表示自上一次调用 `onLayout()` 方法以来布局是否发生了变化：\n\
  \n`if (totalpages > 0) {`\n`PrintDocumentInfo.Builder builder = new PrintDocumentInfo.Builder(\"\
  print_output.pdf\").setContentType(PrintDocumentInfo.CONTENT_TYPE_DOCUMENT).setPageCount(totalpages);`\n\
  `PrintDocumentInfo info = builder.build();`\n`callback.onLayoutFinished(info, true);`\n\
  `}`\n\n如果页数为零，代码将通过调用 `LayoutResultCallback` 对象的 `onLayoutFailed()` 方法向打印框架报告此失败。\n\
  \n### 77.5 实现 onWrite() 回调方法\n\n\n\n\n`onWrite()` 回调方法负责渲染文档的页面，然后通知打印框架（Printing\
  \ framework）文档已就绪可以打印。完成后，`onWrite()` 方法的内容如下：\n\n```java\npackage com.ebookfrenzy.customprint;\n\
  \nimport java.io.FileOutputStream;\nimport java.io.IOException;\n\n.\n.\n\nimport\
  \ android.graphics.pdf.PdfDocument.PageInfo;\n\n.\n.\n\n@Override\npublic void onWrite(final\
  \ PageRange[] pageRanges,\n                    final ParcelFileDescriptor destination,\n\
  \                    final CancellationSignal cancellationSignal,\n            \
  \        final WriteResultCallback callback) {\n    for (int i = 0; i < totalpages;\
  \ i++) {\n        if (pageInRange(pageRanges, i)) {\n            PageInfo newPage\
  \ = new PageInfo.Builder(pageWidth,\n                    pageHeight, i).create();\n\
  \            PdfDocument.Page page =\n                    myPdfDocument.startPage(newPage);\n\
  \            if (cancellationSignal.isCanceled()) {\n                callback.onWriteCancelled();\n\
  \                myPdfDocument.close();\n                myPdfDocument = null;\n\
  \                return;\n            }\n            drawPage(page, i);\n      \
  \      myPdfDocument.finishPage(page);\n        }\n    }\n    try {\n        myPdfDocument.writeTo(new\
  \ FileOutputStream(\n                destination.getFileDescriptor()));\n    } catch\
  \ (IOException e) {\n        callback.onWriteFailed(e.toString());\n        return;\n\
  \    } finally {\n        myPdfDocument.close();\n        myPdfDocument = null;\n\
  \    }\n    callback.onWriteFinished(pageRanges);\n}\n```\n\n`onWrite()` 方法首先循环遍历文档中的每一个页面。然而，重要的是，要考虑到用户可能并没有请求打印构成文档的所有页面。事实上，打印框架的用户面板提供了指定打印特定页面或页面范围的选项。图\
  \ 77-2 显示了配置为打印文档第 1-4 页、第 9 页以及第 1-13 页的面板。\n\n![](img/Image2364.jpg)\n图 77-2\n\
  \n在将页面写入 PDF 文档时，`onWrite()` 方法必须采取措施确保只打印用户指定的页面。为了实现这一点，打印框架通过参数传递 `PageRange`\
  \ 对象的数组，指示要打印的页面范围。在上述 `onWrite()` 实现中，每个页面都会调用一个名为 `pageInRange()` 的方法，以验证该页面是否在指定的范围内。`pageInRange()`\
  \ 方法的代码将在本章后后实现。\n\n```java\nfor (int i = 0; i < totalpages; i++) {\n    if (pageInRange(pageRanges,\
  \ i)) // 对于每一个在任何指定范围内的页面，都会创建一个新的 `PdfDocument.Page` 对象。在创建新页面时，之前由 `onLayout()`\
  \ 方法存储的高度和宽度将作为参数传递，以便页面大小与用户选择的打印选项相匹配：\n    PageInfo newPage = new PageInfo.Builder(pageWidth,\
  \ pageHeight, i).create();\n    PdfDocument.Page page = myPdfDocument.startPage(newPage);\n\
  \    与 `onLayout()` 方法一样，`onWrite()` 方法需要响应取消请求。在这种情况下，代码会通知打印框架取消已执行，并在关闭并取消引用\
  \ `myPdfDocument` 变量之前：\n    if (cancellationSignal.isCanceled()) {\n        callback.onWriteCancelled();\n\
  \        myPdfDocument.close();\n        myPdfDocument = null;\n        return;\n\
  \    }\n    只要打印过程没有被取消，该方法就会调用一个方法在当前页面上绘制内容，然后调用 `myPdfDocument` 对象的 `finishPage()`\
  \ 方法。\n    drawPage(page, i);\n    myPdfDocument.finishPage(page); // drawPage()\
  \ 方法负责在页面上绘制内容，将在 onWrite() 方法完成后实现。\n当所需的页面数已添加到 PDF 文档后，文稿将使用作为参数传递给 `onWrite()`\
  \ 方法的文件描述符写入目标流。如果由于任何原因写入操作失败，该方法将通过调用 `WriteResultCallback` 对象的 `onWriteFailed()`\
  \ 方法（该也作为参数传递给 `onWrite()` 方法）来通知框架。\n\n```java\ntry {\n    myPdfDocument.writeTo(new\
  \ FileOutputStream(\n            destination.getFileDescriptor()));\n} catch (IOException\
  \ e) {\n    callback.onWriteFailed(e.toString());\n    return;\n} finally {\n  \
  \  myPdfDocument.close();\n    myPdfDocument = null;\n}\n```\n\n最后，调用 `WriteResultsCallback`\
  \ 对象的 `onWriteFinish()` 方法，以通知打印框架文档已就绪可以打印。\n\n### 77.6 检查页面是否在范围内\n\n如前所述，当调用\
  \ `onWrite()` 方法时，会传递一个 `PageRange` 对象的数组，指示文档中要打印的页面范围。`PageRange` 类设计用于存储页面范围的起始页和结束页，反之，可以通过类的\
  \ `getStart()` 和 `getEnd()` 方法访问它们。\n\n在上一节实现 `onWrite()` 方法时，调用了一个名为 `pageInRange()`\
  \ 的方法，该方法接收 `PageRange` 对象的数组和页码作为参数。`pageInRange()` 方法的作用是识别指定的页码是否在范围内，可以在 `MainActivity.java`\
  \ 类的 `MyPrintDocumentAdapter` 类中如下实现：\n\n```java\npublic class MyPrintDocumentAdapter\
  \ extends PrintDocumentAdapter {\n.\n.\n    private boolean pageInRange(PageRange[]\
  \ pageRanges, int page) {\n        for (PageRange pageRange : pageRanges) {\n  \
  \          if ((page >= pageRange.getStart() && page <= pageRange.getEnd())) {\n\
  \                return true;\n            }\n        }\n        return false;\n\
  \    }\n.\n}\n```\n\n## 7.7 在页面上绘制内容\n\n我们现在到了需要编写代码在页面上绘制内容以准备打印的阶段。绘制的内容完全取决于应用程序，并限于\
  \ Android 类所能实现的功能。然而，对于本示例，将在画布上绘制简单的文本和图形。`onWrite()` 方法设计为调用一个名为 `drawPage()`\
  \ 的方法，该方法将代表当前页面的 `PdfDocument.Page` 对象和代表页码的整数作为参数。在 `MainActivity.java` 中，该方法现在应当如下：\n\
  \n```java\npackage com.ebookfrenzy.customprint;\n.\nimport android.graphics.Canvas;\n\
  import android.graphics.Color;\nimport android.graphics.Paint;\npublic class MainActivity\
  \ extends AppCompatActivity {\n.\n    public static class MyPrintDocumentAdapter\
  \ extends PrintDocumentAdapter {\n.\n.\n        private void drawPage(PdfDocument.Page\
  \ page, int pagenumber) {\n            Canvas canvas = page.getCanvas();\n     \
  \       pagenumber++; // 让页码从 1 开始\n            int titleBaseLine = 72;\n      \
  \      int leftMargin = 54;\n            Paint paint = new Paint();\n          \
  \  paint.setColor(Color.BLACK);\n            paint.setTextSize(40);\n          \
  \  canvas.drawText(\n                \"Test Print Document Page \" + pagenumber,\n\
  \                leftMargin,\n                titleBaseLine,\n```\n\n\n\n\n```java\n\
  paint);\npaint.setTextSize(14);\ncanvas.drawText(\"This is some test content to\
  \ verify that custom document printing works\", leftMargin, titleBaseLine + 35,\
  \ paint);\nif (pagenumber % 2 == 0)\n    paint.setColor(Color.RED);\nelse\n    paint.setColor(Color.GREEN);\n\
  PageInfo pageInfo = page.getInfo();\ncanvas.drawCircle(pageInfo.getPageWidth()/2f,\n\
  \    pageInfo.getPageHeight()/2f,\n    150,\n    paint);\n}\n.\n}\n```\n\n代码中的页码计数从\
  \ 0 开始。由于文档传统上从第 1 页开始，该方法首先对存储的页码计数。然后获取与页面相关的 `Canvas` 对象的引用，并声明了一些边距和基线值：\n\n\
  ```java\nCanvas canvas = page.getCanvas();\npagenumber++;\nint titleBaseLine = 72;\n\
  int leftMargin = 54;\n```\n\n接下来，代码创建了用于绘制的 `Paint` 和 `Color` 对象，设置了字体大小并绘制了页面标题文本，包括当前的页码：\n\
  \n```java\nPaint paint = new Paint();\npaint.setColor(Color.BLACK);\npaint.setTextSize(40);\n\
  canvas.drawText(\"Test Print Document Page \" + pagenumber,\n    leftMargin,\n \
  \   titleBaseLine,\n    paint);\n```\n\n随后缩小了字体大小并在标题下方绘制了正文文本：\n\n```java\npaint.setTextSize(14);\n\
  canvas.drawText(\"This is some test content to verify that document printing works\"\
  , leftMargin, titleBaseLine + 35);\n```\n\n该方法执行的最后项任务是绘制一个圆（偶数页为红色，奇数页为绿色）。在确定页面是奇是偶后，方法获取页面的高度和宽度，然后使用这些信息将圆置在页面中心：\n\
  \n```java\nif (pagenumber % 2 == 0)\n    paint.setColor(Color.RED);\nelse\n    paint.setColor(Color.GREEN);\n\
  PageInfo pageInfo = page.getInfo();\ncanvas.drawCircle(pageInfo.getPageWidth()/2,\n\
  \    pageInfo.getPageHeight()/2,\n    150,\n    paint);\n```\n\n绘制完画布后，方法将控制权交回\
  \ `onWrite()` 方法。随着 `drawPage()` 方法的完成，`MyPrintDocumentAdapter` 类现在已完成。\n\n## 7.8\
  \ 启动打印作业\n\n当用户点击“打印文档”（Print Document）按钮时，将调用 `printDocument()` 点击事件处理方法。在开始测试之前，剩下的唯一工作是将此方法添加到\
  \ `MainActivity.java` 文件中，并特别注意确保将其放置在 `MyPrintDocumentAdapter` 类之外：\n\n```java\n\
  package com.ebookfrenzy.customprint;\n\nimport android.print.PrintManager;\nimport\
  \ android.view.View;\n\npublic class MainActivity extends AppCompatActivity {\n\
  \    public void printDocument(View view) {\n        PrintManager printManager =\
  \ (PrintManager) this\n            .getSystemService(Context.PRINT_SERVICE);\n \
  \       String jobName = this.getString(R.string.app_name) + \" Document\";\n  \
  \      printManager.print(jobName, new MyPrintDocumentAdapter(this),\n         \
  \   null);\n    }\n}\n```\n\n该方法在创建新的 `String` 对象作为打印任务的名称之前，获取了设备上运行的 `PrintManager`\
  \ 服务的引用。最后，调用 `PrintManager` 的 `print()` 方法来启动打印作业，传递作业名称和我们自定义文档适配器类的实例。\n\n##\
  \ 7.9 测试应用程序\n\n在运行 Android 4.4 或更高版本的 Android 设备或模拟器上编译并运行该应用程序。应用程序加载后，点击“打印文档”按钮启动打印作业，并为输出选择一个合适的目标（保存为\
  \ PDF 选项是避免浪费纸和打印机墨水的有用选项）。\n\n检查打印输出，它应该包含文本和图形的 4 个页面。例如，图 77-3](#Custom_Printing.xhtml__idTextAnchor1502)\
  \ 显示了作为 PDF 文件查看的文档四页，准备保存到设备上。\n\n尝试其他的打印配置选项，例如在打印面板中更改纸张大小、方向和页面设置。每项设置更改都应该反映在打印输出中，这表明自定义打印文档适配器正在正常工作。\n\
  \n![](img/as_4.1_custom_print_running.jpg)\n图 77-3\n\n## 7.10 总结\n\n虽然自定义文档打印在实现上比\
  \ Android 打印框架的 HTML 和图像打印选项复杂，但它在从 Android 内部打印复杂内容方面提供了极大的灵活性。实现自定义文档打印的大部分工作涉及创建一个自定义的\
  \ `Print Adapter` 类，以便它不仅能在文档页面上绘制内容，还能在用户更改打印设置（如页面大小和打印页面范围）时做出正确响应。\n\n## 8.\
  \ Android App Links 简介\n\n随着技术的演进，Web 内容和移动内容之间的传统界限开始模糊。这一点尤为明显的一个领域是渐进式 Web 应用（PWA）日益流行，这些\
  \ Web 应用的外观和行为与传统的移动应用非常相似。\n\n另一个趋势是让移动应用中的内容可以通过 Web 搜索和 URL 链接被发现。在 Android 应用开发背景下，`App\
  \ Links` 功能专门设计用于让用户即使在没有安装应用的情况下也能更容易发现并访问存储在 Android 应用中的内容。\n\n### 78.1 Android\
  \ App Links 概述\n\nApp Links 是一种标准的 HTTP URL，旨在从外部源（如网站）直接链接到应用程序中的特定位置。App Links（称为深度链接/deep\
  \ links）主要用于鼓励用户参与应用并允许用户分享应用内容。\n\nApp Links 的实现是一个多步骤过程，涉及向项目中添加意过滤器、在关联的应用中实现链接处理代码以及使用数字资产链接来关联应用和\
  \ Web 内容。\n\n这些步骤可以通过手动对项目更改来完成，也可以通过 Android Studio 的 App Links 助手自动完成。\n\n本章剩余部分将从项目更改的角度概述\
  \ App Links 的实现。下一章（“Android App Links 教程”](#App_Links_Tutorial.xhtml__idTextAnchor1510））将演示\
  \ App Links 助手的使用。\n\n\n\n\n\n```xml\n<category android:name=\"android.intent.category.BROWSABLE\"\
  \ />\n<data\n    android:scheme=\"http\"\n    android:host=\"www.example.com\"\n\
  \    android:pathPrefix=\"/welcome\" />\n</intent-filter>\n</activity>\n\n<application>\n\
  \    <activity android:name=\"com.ebookfrenzy.myapp.MyActivity\">\n        <intent-filter\
  \ android:autoVerify=\"true\" android:order=\"1\">\n```\n\n歧义意图过滤器（intent filters）的处理顺序可以使用\
  \ `intent-filter` 标签的 `order` 属性进行指定，如下：\n\n意图过滤器会导致应用链接（app link）启动正确的 activity，但仍需要在目标\
  \ activity 中实现代码以适当处理该意图。\n\n## 78.3 处理 App Link 意图\n\n在大多数情况下，启动的 activity 需要访问应用链接\
  \ URL，并根据 URL 的结构采取特定操作。接上例示例，当通过包含 `/welcome/newuser` 路径的 URL 启动时，该 activity 显示的内容可能与路径设置为\
  \ `/welcome/existinguser` 的 URL 显示的不同。\n\n当 activity 通过链接启动时，它会接收一个包含启动该 activity\
  \ 的动作数据的 intent 对象，其中包含一个包含应用链接 URL 的 `Uri` 对象。在 activity 的初始化阶段，可以添加代码来按如下方式提取这些数据：\n\
  \n```javaIntent appLinkIntent = getIntent();\nString appLinkAction = appLinkIntent.getAction();\n\
  Uri appLinkData = appLinkIntent.getData();\n```\n\n在获取应用链接的 `Uri` 后，可以使用组成 URL 路径的各种组件来对在\
  \ activity 内要执行的操作做出决定。在下面的代码示例中，URL 的最后一个组件被用于识别应该为新用户还是现有用户显示内容：\n\n```java\n\
  String userType = appLinkData.getLastPathSegment();\nif (userType.equals(\"newuser\"\
  )) {\n    // 显示新用户内容\n} else {\n    // 显示现有用户内容\n}\n```\n\n## 78.4 将应用与网站关联\n\n\
  在应用链接生效之前，需要将应用链接 URL 与该应用链接所属的网站关联。这是通过创建一个名为 `assetlinks.json` 的数字资产链接（Digital\
  \ Asset Links）文件并将其安装在网站的 `.well-known` 文件夹中实现的。注意，数字资产链接仅适用于基于 https 的网站。\n\n数字资产链接文件包含一个关系声明（relation\
  \ statement），允许目标应用使用网站的链接 URL 启动，以及一个目标声明（target statement），声明伴侣应用的包名和该项目的 SHA-256\
  \ 证书指纹。一个典型的资产链接文件可能如下：\n\n```json\n[{\n    \"relation\": [\"delegate_permission/common.handle_all_urls\"\
  ],\n    \"target\" : { \"namespace\": \"android_app\",\n      \"package_name\":\
  \ \"<app package name here>\",\n      \"sha256_cert_fingerprints\": [\"<app certificate\
  \ here>\"] }\n}]\n```\n\n`assetlinks.json` 文件可以包含多个数字资产链接，这可能允许单个网站与多个伴侣应用关联。\n\n\
  ## 78.5 总结\n\nAndroid App Links 允许通过来自外部网站和其他应用的 URL 链接启动应用 activity。应用链接的实现结合了项目清单文件（manifest\
  \ file）中的意图过滤器和已启动的 activity 内部的意图处理代码。此外，通过使用数字资产链接文件，可以将应用链接中使用的域名与相应的网站关联。一旦建立关联，当使用应用链接时，Android\
  \ 就不再需要用户选择目标应用了。\n\n## 79. Android Studio App Links 教程\n\n本章的目标是为 Android 应用链接和\
  \ Android Studio App Link 助手（App Link Assistant）提供实操演示。\n\n本章将为现有的 Android 应用添加应用链接支持，允许通过应用链接\
  \ URL 启动 activity。除了启动 activity 之外，显示的内容将在 URL 的路径中指定。\n\n### 79.1 关于示例应用\n\n本章使用的项目命名为\
  \ `AppLinking`，是一个基础应用，旨在允许用户查找有关伦敦地标的信息。该应用使用通过标准 Android 内容提供者（content provider）类访问的\
  \ `SQLite` 数据库。该应用提供了一个现有的数据库，其中包含了一些伦敦热门旅游景点的记录。除了现有的数据库条目外，应用还允许用户添加和删除地标描述。\n\
  \n在目前的形式下，该应用允许对现有记录进行搜索，并添加和删除新记录。\n\n该项目包含两个名为 `AppLinkingActivity` 和 `LandmarkActivity`\
  \ 的 activity。`AppLinkingActivity` 是应用启动时启动的主 activity。该 activity 允许用户输入搜索标准并向数据库添加额外记录。当搜索找到匹配的记录时，`LandmarkActivity`\
  \ 将启动并显示相关地标的信息。\n\n本章的目标是增强该应用以添加对应用链接的支持，以便可以使用 URL。\n\n### 79.2 数据库结构\n\n示例应用的数据包含位于\
  \ `assets -> databases` 文件夹下的 `landmarks.db` 文件中。数据库包含一个名为 `locations` 的表，其结构如表\
  \ 79-1 所示：\n\n| 列 | 类型 | 描述 |\n| :--- | :--- | :--- |\n| id | String | 主索引，此列包含唯一标识数据库中地标的字符串值。\
  \ |\n| title | String | 地标的名称（例如，伦敦桥）。 |\n| description | String | 地标的描述。 |\n| personal\
  \ | Boolean | 表示记录是私人的还是公共的。对于用户添加的记录，此值设置为 true。提供的现有数据库记录设置为 false。 |\n\n表 79-1\n\
  \n### 79.3 加载和运行项目\n\n该项目位于以下 URL 下载存档中的 `AppLinking` 文件夹中：`https://www.ebookfrenzy.com/retail/eeljava/index.php`\n\
  \n定位到文件夹后，在 Android Studio 中打开它并在设备或模拟器上运行应用。应用启动后，将出现图 79-1 所示的屏幕：\n\n（图 79-1：主屏幕）\n\
  \n按照目前的实现，使用位置 ID 查找景点。通过在 ID 字段中输入 `londonbridge` 并点击 Find 按钮来测试搜索功能。找到匹配记录后，将启动第二个\
  \ activity（`LandmarkActivity`）并将传递的信息传递。这些信息以添加到 `Intent` 对象的额外数据的形式。\n\n（图 79-2：地标详情屏幕）\n\
  \n### 79.4 添加 URL 映射\n\n现在应用已加载到 Android Studio 并经过测试，项目已准备好添加应用链接支持。目标是在点击应用链接时启动\
  \ `LandmarkActivity` 屏幕并显示信息。这是通过将 URL 映射到 `LandmarkActivity` 实现的。对于此示例，URL 的格式如下：\n\
  \n`http://<website domain>/landmarks/<landmarkId>`\n\n完成所有步骤后，例如以下 URL 应该导致应用显示伦敦塔的信息：\n\
  \n\n\n\n\nhttp://www.yourdomain.com/landmarks/toweroflondon\n\n要向项目添加 URL 映射，首先通过\
  \ `Tools -> App Links Assistant` 菜单选项打开 App Links 助手。打开后，助手将如图 79-3 所示所示：\n\n![](img/as_4.1_app_links_assistant.jpg)\n\
  \n图 79-3\n\n点击 Open URL Mapping Editor 按钮开始将 URL 映射到活动。在映射屏幕中，点击 `+` 按钮（在图 79-4\
  \ 中突出）来添加新 URL：\n\n![](img/Image2473.jpg)\n\n图 79-4\n\n在 Add URL Mapping 对话框的 `Host`\
  \ 字段中，输入你自己的网站的 URL。如果你没有自己的网站供本教程使用，仍然可以使用 `http://www.example.com` 遵循本章的大部分内容，但无法测试需要存在\
  \ Digital Asset Links 文件的功能。\n\n`Path` 字段（下方图 79-5 中标记为 B）是声明 URL 路径组件的地方。路径必须以\
  \ `/` 开头，在此字段中输入 `/landmarks`。\n\n`Path` 菜单 (B) 提供以下三个路径匹配选项：\n\n- `path` – URL\
  \ 必须与 URL 的路径组件完全匹配才能启动活动。例如，如果路径设置为 `/landmarks`，则 `http://www.example.com/landmarks`将被视为匹配。然而，`http://www.example.com/landmarks/londonbridge`\
  \ 将不被视为匹配。\n- `pathPrefix` – 指定路径仅被视为前缀。在 `/landmarks` 组件之后可以包含额外的路径组件（例如 `http://www.example.com/landmarks/londonbridge`\
  \ 仍被视为匹配）。\n- `pathPattern` – 允许使用基本正则表达式和通配符形式的模式匹配来指定路径，例如 `landmarks/*/[l-L]ondon/*`\n\
  \n由于此示例中的路径是地标 ID 组件的前缀，请选择 `pathPrefix` 菜单选项。\n\n最后，使用 `Activity` 菜单 (C) 选择 `LandmarkActivity`\
  \ 作为响应应用链接时启动的活动：\n\n![](img/Image2481.jpg)\n\n图 79-5\n\n完成对话话框中的设置后，点击 OK 按钮提交更改。在映射屏幕的\
  \ Check URL Mapping 字段中输入以下 URL（其中 `<your domain>` 设置为上方 `Host` 字段中指定的域名），检查 URL\
  \ 格式是否正确并分配给相应的活动：\n\n`http://<your domain>/landmarks/toweroflondon`\n\n如果映射配置正确，`LandmarkActivity`\
  \ 将列为映射的活动：\n\n![](img/Image2489.jpg)\n\n图 79-6\n\n最新版本的 Android 要求同时对 HTTP 和 HTTPS\
  \ 协议声明 App Links，即使只使用了其中一种。因此，在继续下一步之前，请重复上述步骤，将 URL 的 HTTPS 版本添加到列表中。\n\n下一步也将在\
  \ App Links 助手的 URL 映射屏幕中执行，因此请保持该屏幕处于选中状态。\n\n###\n\n### 79.5 添加 Intent Filter\n\
  \n如上一章所述，需要一个 intent filter 来允许目标活动响应应用链接点击而启动。事实上，当添加 URL 映射时，intent filter 会自动添加到项目清单文件中。在\
  \ App Links 助手的 URL 映射列表中选中 URL 映射，向下滚动屏幕直到 intent filter 预览部分进入视野。预览应包含修改后的 `AndroidManifest.xml`\
  \ 文件，其中包含了新添加的 intent filters：\n\n![](img/Image2496.jpg)\n\n图 79-7\n\n尽管 App Links\
  \ 助手为我们添加了 intent filters，但它可能没有包含应用链接时所需的 `autoVerify` 设置。打开 `manifests -> AndroidManifest.xml`\
  \ 文件，并如下所示将此设置添加到两个 intent filters 中：\n\n```xml\n<intent-filter android:autoVerify=\"\
  true\">\n\n.\n.\n\n    <data\n        android:scheme=\"http\"\n        android:host=\"\
  www.ebookfrenzy.com\"\n        android:pathPrefix=\"/landmarks\" />\n</intent-filter>\n\
  \n<intent-filter android:autoVerify=\"true\">\n\n.\n.\n\n    <data\n        android:scheme=\"\
  https\"\n        android:host=\"www.ebookfrenzy.com\"\n        android:pathPrefix=\"\
  /landmarks\" />\n</intent-filter>\n```\n\n###\n\n 79.6 添加 Intent Handling 代码\n\n\
  到目前为止的步骤确保了在响应格式正确的应用链接 URL 时启动正确的活动。下一步是在 `LandmarkActivity` 类中处理 intent，以便从数据库中提取正确的记录并显示给用户。在修改\
  \ `LandmarkActivity.java` 文件中的任何代码之前，回顾现有代码的某些区域是值得的。在代码编辑器中打开 `LandmarkActivity.java`\
  \ 文件并找到 `onCreate()` 和 `handleIntent()` 方法：\n\n```java\n@Override\nvoid onCreate(Bundle\
  \ savedInstanceState) {\n    super.onCreate(savedInstanceState);\n    binding =\
  \ LandmarkActivityBinding.inflate(getLayoutInflater());\n    view = binding.getRoot();\n\
  \    setContentView(view);\n    handleIntent();\n}\n\nprivate void handleIntent(Intent\
  \ intent) {\n    String landmarkId = intent.getStringExtra(AppLinkingActivity.LANDMARK_ID);\n\
  \    displayLandmark(landmarkId);\n}\n```到目前为止的步骤确保了在响应格式正确的应用链接 URL 时启动正确的活动。下一步是在\
  \ `LandmarkActivity` 类中处理 intent，以便从数据库中提取正确的记录并显示给用户。在修改 `LandmarkActivity.java`\
  \ 文件中的任何代码之前，回顾现有代码的某些区域是值得的。在代码编辑器中打开 `LandmarkActivity.java` 文件并找到 `onCreate()`\
  \ 和 `handleIntent()` 方法：\n\n```java\n@Override\nvoid onCreate(Bundle savedInstanceState)\
  \ {\n    super.onCreate(savedInstanceState);\n    binding = LandmarkActivityBinding.inflate(getLayoutInflater());\n\
  \    view = binding.getRoot();\n    setContentView(view);\n    handleIntent();\n\
  }\n\nprivate void handleIntent(Intent intent) {\n    String landmarkId = intent.getStringExtra(AppLinkingActivity.LANDMARK_ID);\n\
  \    displayLandmark(landmarkId);\n}\n```在当前形式下，代码期望在 Intent 中找到地标 ID。由于活动现在可以由应用链接启动，此代码需要更改。首先删除\
  \ `onCreate()` 方法中 `handleIntent()` 的调用：\n\n```java\n@Override\nvoid onCreate(Bundle\
  \ savedInstanceState) {\n    super.onCreate(savedInstanceState);\n    binding =\
  \ LandmarkActivityBinding.inflate(getLayoutInflater());\n    view = binding.getRoot();\n\
  \    setContentView(view);\n}\n```要添加应用链接处理代码，返回 App Links 面板并点击步骤 2 下的 Select Activity\
  \ 按钮。在活动选择对话框中，选择 `LandmarkActivity` 后点击 Insert Code：\n\n![](img/Image2504.jpg)\n\
  \n图 79-8\n\n返回 `LandmarkActivity.java` 文件并注意以下代码已插入 `onCreate()` 方法中（如果 Android\
  \ Studio 无法完成请求，你可以手动添加此代码）：\n\n```java\n// ATTENTION: 这是为处理应用链接自动生成的。\nIntent appLinkIntent\
  \ = getIntent();\nString appLinkAction = appLinkIntent.getAction();\nUri appLinkData\
  \ = appLinkIntent.getData();\n```此代码访问 Intent 对象并提取 Action 字符串和 Uri。如果活动启动是应用链接的结果，action\
  \ 字符串将被设置为 `android.intent.action.VIEW`，这与添加到文件中 intent filter 中声明的 action 相匹配。如果活动是通过主活动\
  \ `findLandmark()` 方法中的标准 intent 代码启动的，action 字符串将为空。通过检查赋值给 action 字符串的值，可以编写代码来识别启动方式并采取相应行动：\n\
  \n```java\nimport android.net.Uri;\n\n@Override\nvoid onCreate(Bundle savedInstanceState)\
  \ {\n    super.onCreate(savedInstanceState);\n\n    // ATTENTION: 这是为处理应用链接自动生成的。\n\
  \    Intent appLinkIntent = getIntent();\n    String appLinkAction = appLinkIntent.getAction();\n\
  \    Uri appLinkData = appLinkIntent.getData();\n    String landmarkId = appLinkData.getLastPathSegment();\n\
  \    if (landmarkId != null) {\n        displayLandmark(landmarkId);\n    }\n}\n\
  ```剩下的工作是在方法中添加一些额外代码以识别应用链接 URL 路径中的最后一个组件，并将其作为地标 ID 用于查询数据库：\n\n@Override\n\n\
  \n\n\n\n```java\nprotected void onCreate(Bundle savedInstanceState) {\n    // ATTENTION:\
  \ This was auto-generated to handle app links.\n    Intent appLinkIntent = getIntent();\n\
  \    String appLinkAction = appLinkIntent.getAction();\n    Uri appLinkData = appLinkIntent.getData();\n\
  \    if (appLinkAction != null) {\n        if (appLinkAction.equals(\"android.intent.action.VIEW\"\
  )) {\n            String landmarkId = appLinkData.getLastPathSegment();\n      \
  \      if (landmarkId != null) {\n                displayLandmark(landmarkId);\n\
  \            }\n        }\n    } else {\n        handleIntent(appLinkIntent);\n\
  \    }\n}\n```\n\n如果 action 字符串不为空，则会检查其是否已设置为 `android.intent.action.VIEW`，然后提取\
  \ `Uri` 路径的最后一个组件。该组件随后被作为 `landmarkId` 用于数据库查询。相反，如果 action 字符串为 `null`，则调用现有的\
  \ `handleIntent()` 方法从 intent 数据中提取 ID。\n\n# 79.7 测试应用程序\n\n在设备或模拟器上运行应用程序，并确保仍然可以搜索示例地标。我们已成功地为应用程序添加了应用链接（app\
  \ links）支持。如果你为应用链接指定了了自己的网站 URL，我们现在可以更进一步，通过创建并安装数字资源链接（Digital Asset Links）文件来实现。\n\
  \n# 79.8 创建数字资源链接文件\n\n正如标题为 Android Intents 概述”的章节所述，为了完全支持应用链接，我们需要在应用链接中引用的网站上安装数字资源链接文件。首先，按照“Android\
  \ Intents 概述”中列出的步骤找到你的 `debug.keystore` 文件，并识别出你的 `SHA256` 指纹。\n\n接下来，在网络浏览器中打开以下页面：\n\
  \n`https://developers.google.com/digital-asset-links/tools/generator`\n\n页面加载后，在\
  \ Hosting site domain 字段中输入你的网站 URL，将 `com.ebookfrenzy.applinking` 作为 App 包包名，并将你的\
  \ `SHA256` 指纹输入到 App package fingerprint (`SHA256`) 字段中：\n\n![](img/asset_file_generator.jpg)\n\
  \n图 79-9\n\n点击 `Generate` 按钮显示生成的语句，并将其放在名为 `assetlinks.json` 的文件中，位于 Web 服务器上名为\
  \ `.well-known` 的文件夹中。返回生成器页面并点击 `Test` 按钮以验证文件是否位于正确位置。如果测试成功，将出现类似下方的输出：\n\n![](img/asset_file_link_test.jpg)\n\
  \n图 79-10\n\n假设测试成功，我们现在准备好尝试应用链接了。\n\n# 79.9 测试应用链接\n\n通过返回应用链接助手（App Links Assistant）面板并点击\
  \ `Test App Links` 按钮，测试 intent 处理是否正常工作。在提示输入测试 URL 时，点击 `Run Test` 按钮之前，输入 `londonbridge`\
  \ 地标 ID 的 URL（使用应用链接映射中引用的域名）：\n\n![](img/Image2513.jpg)\n\n图 79-11\n\n点击按钮后，`Landmark`\
  \ activity 应该在设备或模拟器上启动并显示关于伦敦桥（London Bridge）的信息。\n\n# 79.10 总结\n\n本章演示了在 Android\
  \ 应用程序项目中实现应用链接支持的步骤。本章涵盖的内容包括：在 Android Studio 中使用应用链接助手、应用链接 URL 映射、intent 过滤器、使用数字资源链接文件条目处理网站关联以及应用链接测试。\n\
  \n# 80. Android 生物识别认证教程\n\n触摸传感器现在已内置在许多 Android 设备中，用于识别用户并提供对设备和应用程序功能的访问，例如使用指纹识别的应用内支付选项。指纹识别当然是多种身份验证方法之一，包括密码、PIN\
  \ 码以及最近的面部识别。\n\n尽管目前市场上只有少数 Android 设备提供面部识别，但在不久的将来，这可能会变得更加常见。针对此，Google 开始从以指纹为核心的应用程序身份验证方法转向一种更通用的方法，称为生物识别认证（biometric\
  \ authentication）。在 Android 8 的初始版本中，这些生物识别功能仅涵盖指纹认证，但这将在 Android 操作系统的后续版本和 SDK\
  \ 更新中发生变化。\n\n本章既提供了生物识别认证的概述，还提供了一个详细的、逐步的教程，演示了在 Android 应用程序项目中实现生物识别认证的实用方法。\n\
  \n## 80.1 生物识别认证概述\n\n关键生物识别认证组件是 `BiometricPrompt` 类。该类执行了许多以前在版本中需要编写代码完成的工作，包括显示标准对话框引导用户完成身份认证过程、执行认证并将结果报告给应用程序。该类还处理了过多的认证尝试，并在用户再次尝试之前强制超时。\n\
  \n`BiometricPrompt` 类包含一个伴侣类 `Builder`，可用于配置和创建 `BiometricPrompt` 实例，包括定义显示在认证对话框中的文本，以及对对话框中出现的取消按钮（也称为负按钮）进行自定义。\n\
  \n`BiometricPrompt` 实例还分配了一组身份认证回调（callbacks），这些回调将被调用以向应用程序提供认证结果。还使用了 `CancellationSignal`\
  \ 实例来允许应用程序在认证过程中取消认证。\n\n在介绍这些基础知识后，本章剩余部分将在示例项目中实现基于指纹的认证。\n\n## 80.2 创建生物识别项目\n\
  \n在欢迎界面选择 `New Project` 选项，并在新项目对话框中选择 `Empty Activity` 模板，然后点击 `Next` 按钮。\n\n在\
  \ `Name` 字段中输入 `BiometricDemo`，并将 `com.ebookfrenzy.biometricdemo` 指定包名。在点击 `Finish`\
  \ 按钮之前，将 `Minimum API` 设置为 `API 29: Android 9.0 (Pie)`并将`Language` 菜单设置为 Java。\n\
  \n## 80.3 配置设备指纹认证\n\n指纹认证仅适用于带有触摸传感器且已采取适当配置步骤保护设备并录入至少一个指纹设备。有关配置模拟器话以测试指纹认证的步骤，请参见章节使用和配置\
  \ Android Studio AVD 模拟器。\n\n要在物理设备上配置指纹认证，首先打开 `Settings` 应用并选择 `Security` 选项。在\
  \ `Security` 设置屏幕内，选择 `Fingerprint` 选项。在生成的屏幕上点击 `Next` 按钮继续。在启用指纹安全之前，必须配置备份屏幕解锁方法（如\
  \ PIN 码）。如果锁屏尚未加密，请按照步骤配置 `PIN`、`pattern` 或 `password` 安全。\n\n锁屏加密后，继续进入指纹检测屏幕，并在提示时触摸传感器（参见图\
  \ 80-1），根据需要重复此过程添加更多指纹。\n\n## 80.4 在 Manifest 文件中添加生物识别权限\n\n\n\n\n\n生物识别身份验证要求应用在项目清单文件中请求\
  \ `USE_BIOMETRIC` 权限。在 Android Studio 项目窗口中，找到并编辑 `app` -> `manifests` -> `AndroidManifest.xml`\
  \ 文件，按如下所示添加权限请求：\n\n```xml<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    package=\"com.ebookfrenzy.biometricdemo\"\
  >\n    <uses-permission\n        android:name=\"android.permission.USE_BIOMETRIC\"\
  \ />\n</manifest>\n```\n\n## 80.5 设计用户界面\n\n为了保持示例尽可能简单，用户界面中的唯一视觉元素将 `Button` 视图。找到并选择\
  \ `activity_main.xml` 布局资源文件，将其加载到布局编辑器（Layout Editor）工具中。\n\n删除示例 `TextView` 对象，从调色板（Palette）的\
  \ Common（常用）类别拖放一个 `Button` 对象，并将其放置在布局画布的中心。使用属性（Attributes）工具窗口将按钮上的 `text` 属性更改为“Authenticate”，并将字符串提取到资源中。最后，配置\
  \ `onClick` 属性以调用名为 `authenticateUser` 的方法。\n\n完成上述步骤后，布局应与图 80-2 所示：\n\n![](img/as_4.1_biometric_demo_ui.jpg)\n\
  \n图 80-2\n\n## 80.6 添加 Toast 便捷方法\n\n在示例代码的各个位置，应用将被设计为通过 `Toast` 消息向用户显示信息。为了避免多次重复相同的\
  \ `Toast` 代码，将在主 Activity 中添加一个名为 `notifyUser()` 的便利方法。该方法将接受单个 `String` 值并以 `Toast`\
  \ 消息的形式显示给用户。现在编辑 `MainActivity.java` 文件并按如下添加此方法：\n\n```java\nimport android.widget.Toast;\n\
  \nprivate void notifyUser(String message) {\n    Toast.makeText(this,\n        message,\n\
  \        Toast.LENGTH_LONG).show();\n}\n```\n\n## 80.7 检查安全设置\n\n在本章前面的部分，已经采取了步骤来配置锁屏，并在测试应用的设备或模拟器上注册指纹。然而，在应用中包含防御性代码是非常重要的，以在尝试请求指纹验证之前确保这些要求已满足。这些步骤将在\
  \ `MainActivity.java` 文件中的 `onCreate` 方法中执行，并利用 `Keyguard` 和 `PackageManager` 管理服务。注意，还添加了代码来验证应用已配置了\
  \ `USE_BIOMETRIC` 权限：\n\n```java\npackage com.ebookfrenzy.biometricdemo;\n\nimport\
  \ androidx.appcompat.app.AppCompatActivity;\nimport androidx.core.app.ActivityCompat;\n\
  import android.widget.Toast;\nimport android.Manifest;\nimport android.content.pm.PackageManager;\n\
  import android.app.KeyguardManager;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n \
  \       super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_biometric_demo);\n\
  \        checkBiometricSupport();\n    }\n\n    private void checkBiometricSupport()\
  \ {\n        KeyguardManager keyguardManager =\n            (KeyguardManager) getSystemService(KEYGUARD_SERVICE);\n\
  \        if (!keyguardManager.isKeyguardSecure()) {\n            notifyUser(\"Lock\
  \ screen security not enabled in Settings\");\n        }\n        if (ActivityCompat.checkSelfPermission(this,\n\
  \            Manifest.permission.USE_BIOMETRIC) !=\n            PackageManager.PERMISSION_GRANTED)\
  \ {\n            notifyUser(\"Fingerprint authentication permission not enabled\"\
  );\n        }\n    }\n}\n```\n\n上述代码首先使用 `Keyguard` 管理器验证是否已配置了备用解锁方法（也就是说，可以使用\
  \ `PIN` 或其他验证方法作为指纹验证的替代方案来解锁屏幕）。如果锁屏未加密，代码将向用户报告问题并返回。然后，该方法将使用包管理器验证用户是否为应用启用了生物识别身份验证，以确认设备上是否可用指纹验证。\n\
  \n## 80.8 配置回调函数\n\n当配置生物识别提示（biometric prompt）时，需要为其分配一组身份验证回调（authentication callback），这些回调可以被调用以通知应用过程的成功或失败。这些方法需要封装在\
  \ `BiometricPrompt.AuthenticationCallback` 实例中。留在 `MainActivity.java` 文件中，添加一个方法来创建并返回该类的实例，并实现相应的方法：\n\
  \n```java\nimport android.hardware.biometrics.BiometricPrompt;\n\nprivate BiometricPrompt.AuthenticationCallback\
  \ getAuthenticationCallback() {\n    return new BiometricPrompt.AuthenticationCallback()\
  \ {\n        @Override\n        public void onError(int errorCode, CharSequence\
  \ errString) {\n            notifyUser(\"Authentication error: \" + errString);\n\
  \            super.onError(errorCode, errString);\n        }\n        @Override\n\
  \        public void onAuthenticationHelp(int helpCode, CharSequence helpString)\
  \ {\n            super.onAuthenticationHelp(helpCode, helpString);\n        }\n\
  \        @Override\n        public void onAuthenticationFailed() {\n           \
  \ super.onAuthenticationFailed();\n        }\n        @Override\n        public\
  \ void onAuthenticationSucceeded(BiometricPrompt.AuthenticationResult result) {\n\
  \            notifyUser(\"Authentication Succeeded\");\n            super.onAuthenticationSucceeded(result);\n\
  \        }\n    };\n}\n```\n\n## 80.9 添加 CancellationSignal\n\n一旦启动，生物识别验证过程将独立于应用执行。为应用提供取消操作的方法，将创建一个\
  \ `CancellationSignal` 类的实例并将其传递给生物识别验证过程。该 `CancellationSignal` 实例随后可以在需要时取消过程。取消信号实例可以配置一个监听器，该监听器将在取消完成后被调用。在类中添加一个新方法，按如下所示配置并返回\
  \ `CancellationSignal` 对象：\n\n```java\nimport android.os.CancellationSignal;\n\n\
  private CancellationSignal cancellationSignal;\n\nprivate CancellationSignal getCancellationSignal()\
  \ {\n    cancellationSignal = new CancellationSignal();\n    cancellationSignal.setOnCancelListener(()\
  \ -> notifyUser(\"Cancelled via signal\"));\n    return cancellationSignal;\n}\n\
  ```\n\n## 80.10 启动生物识别提示\n\n剩下的是在 `authenticateUser()` 方法中添加代码以创建并配置 `BiometricPrompt`\
  \ 实例并启动验证。按如下所示添加 `authenticateUser()` 方法：\n\n```java\nimport android.view.View;\n\
  \npublic void authenticateUser(View view) {\n    BiometricPrompt biometricPrompt\
  \ = new BiometricPrompt.Builder(this)\n        .setTitle(\"Biometric Demo\")\n \
  \       .setSubtitle(\"Authentication is required to continue\")\n        .setDescription(\"\
  This app uses biometric authentication to protect your data.\")\n        .setNegativeButton(\"\
  Cancel\", this.getMainExecutor(),\n            (dialogInterface, i) -> notifyUser(\"\
  Authentication cancelled\"))\n        .build();\n    biometricPrompt.authenticate(getCancellationSignal(),\
  \ getMainExecutor(), getAuthenticationCallback());\n}\n```\n\n\n\n\n\n`BiometricPrompt.Builder`\
  \ 类用于创建一个新的 `BiometricPrompt` 实例，并配置标题、副标题和描述文本，以显示在提示对话框中。负按钮被配置为显示“取消”的文本，并配置了一个在点击此按钮时显示消息的监听器。最后，调用\
  \ `BiometricPrompt` 实例的 `authenticate()` 方法，并传入 `AuthenticationCallback` 和 `CancellationSignal`\
  \ 实例。生物识别提示还需要知道在哪个线程上执行身份验证。这是通过传递一个配置为所需线程的 `Executor` 对象来定义的。在这种情况下，使用 `getMainExecutor()`\
  \ 方法将主 `Executor` 对象传递给 `BiometricPrompt` 实例，以便身份验证过程在应用的主线程上进行。\n\n### 80.11 测试项目\n\
  \n现在项目已完成，在物理 Android 设备或模拟器会话上运行应用，并点击身份验证（Authenticate）按钮显示如图 80-3 所示的 `BiometricPrompt`\
  \ 对话框：\n\n![](img/as_3.2_biometric_prompt.jpg)\n\n图 80-3\n\n运行后，触摸指纹传感器或使用模拟器内的扩展控制面板来模拟指纹触摸，如“使用和配置\
  \ Android Studio AVD 模拟器”章节概述的。假设检测到已注册的指纹，提示对话框将返回主活动，此时将显示来自成功身份验证回调方法的吐信息（toast\
  \ message）。\n\n再次点击身份验证按钮，这次使用未注册的指纹尝试身份验证。这次，生物识别提示对话框将指示指纹未被识别：\n\n![](img/as_3.2_biometric_prompt_failed.jpg)\n\
  \n图 80-4\n\n通过点击生物识别对话框之外的区域来验证错误处理回调是否正常。提示对话框将消失，并显示带有以下消息的吐：\n\n身份验证错误：用户取消了指纹操作。\n\
  \n检查使用取消按钮取消提示对话框是否会触发“身份验证已取消”的吐信息。最后，尝试使用未注册的指纹多次身份验证，并注意在尝试多次后，提示对话框会指示发生了过多失败，在此之前无法进行后续尝试。\n\
  \n### 80.12 总结\n\n本章概述了如何将生物识别身份集成到 Android 应用项目中。这涉及使用 `BiometricPrompt` 类，该类一旦配置了适当的消息文本和回调，就能自动处理大部分身份验证过程。\n\
  \n# 81. 创建、测试和上传 Android App Bundle\n\n一旦 Android 的开发工作完成并在广泛的 Android 设备上通过测试，下一步是为提交到\
  \ Google Play 准备该应用。然而，在提交之前，必须对应用进行发布打包并使用私钥进行签名。本章将介绍获取私钥、为项目准备 Android App Bundle\
  \ 以及将其上传到 Google Play 的相关步骤。\n\n## 81.1 发布准备流程\n\n到本书的目前为止，我们一直在以适用于测试和调试的模式构建应用项目。另一方面，构建通过\
  \ Google Play 向客户发布的应用包需要采取一些额外的步骤。第一个要求是应用必须以发布模式（release mode）而不是调试模式（debug mode）编译。其次，应用必须使用私钥签名，该私钥唯一标识你作为应用的开发者。最后，应用必须打包成\
  \ Android App Bundle。\n\n虽然这些任务都可以在 Android Studio 环境之外执行，但使用在本章剩余部分概述的 Android\
  \ Studio 构建机制执行这些过程会更加容易。不过，重要的是进一步了解一下 Android App Bundles。\n\n## 81.2 Android\
  \ App Bundles\n\n当用户从 Google Play 安装应用时，应用以 `APK` 文件的形式下载。该文件包含了在用户设备上安装和运行应用所需的所有内容。在\
  \ Android Studio 3.2 引入之前，开发者会使用 Android Studio 生成一个或多个 `APK` 文件并将它们上传到 Google Play。为了支持多种设备类型、屏幕尺寸和语言，这需要为每个目标设备和语言创建并上传多个自定义的\
  \ `APK` 文件，或者生成一个包含所有不同配置资源和平台二进制的大型通用 `APK`。\n\n创建多个 `APK` 文件涉及大量工作，且每次应用需要更新时都必须重复，给应用发布过程造成了相当的时间开销。\n\
  \n通用 `APK` 选项虽然减轻了开发者的负担，但导致了一个完全意外之外的问题。通过分析应用安装指标，Google 发现安装 `APK` 文件越大（导致下载时间变长和设备存储占用增加），应用获得的转化率就越低。转化率的计算方式为在\
  \ Google Play 上查看应用后完成安装的用户的百分比。事实上，Google 估计 `APK` 文件大小每增加 6MB，应用的转化率就会下降 1%。\n\
  \nAndroid App Bundles 通过提供一种方法解决了这两个问题：开发者可以在 Android Studio 内部创建一个包，并让 Google Play\
  \ 为每个单独支持的配置自动生成自定义的 `APK` 文件（这称为动态交付 Dynamic Delivery）。\n\nAndroid App Bundle 本质上是一个\
  \ ZIP 文件，包含了构建应用项目内支持的设备和语言所需的 `APK` 文件的所有文件。例如，项目可能包含适用于不同尺寸的资源和图像。当用户安装应用时，Google\
  \ Play 会接收有关用户设备的信息，包括显示器、处理器架构和语言。使用这些信息，将相应的预生成 `APK` 文件传输到用户设备上。\n\n动态交付的额外优点是将应用拆分为多个模块，称为动态功能模块（dynamic\
  \ feature modules），每个模块包含应用内特定区域的代码和资源。每个动态功能模块都包含在与基础模块独立的 `APK` 文件中，并且在用户需要该功能时才会下载到设备上。动态交付和应用包还允许创建快速动态功能模块，它们可以在无需安装整个应用的情况下在设备上立即运行。这些主题将从“Android\
  \ 动态功能模块概述”章节开始详细介绍。\n\n尽管仍然可以从 Android Studio 生成 `APK` 文件，但应用包现在是向 Google Play\
  \ 上传应用的推荐方式。\n\n### 81.3 注册 Google Play 开发者控制台账户\n\n\n\n\n\n应用提交过程的第一步是创建一个 Google\
  \ Play 开发者控制台账号。执行此操作，请访问 [`play.google.com/apps/publish/signup/`](https://play.google.com/apps/publish/signup/)\
  \ 并按照说明完成注册。请注意注册需要支付一次性费用 $25 美。一旦应用程序开始销售，Google 将保留与应用程序相关的所有收入的 30%。账户创建后，可以通过\
  \ [`play.google.com/console`](https://play.google.com/console%20) 访问开发者控制台。\n\n\
  下一步是收集有关应用程序的信息。为了将您的应用程序推向市场，需要以下信息：\n\n- 标题（Title）——应用程序的标题。\n- 简短说明（Short Description）——最多\
  \ 80 个字的应用程序描述。\n- 完整说明（Full Description）——最多 4000 个字的应用程序描述。\n- 截图（Screenshots）——最多\
  \ 8 张应用程序运行截图（至少需要两张）。Google 建议提交在 7 英寸或 10 英寸平板电脑上运行的应用程序截图。\n- 语言（Language）——应用程序的语言（默认为美国英语）。\n\
  - 推广文本（Promotional Text）——当您的应用程序出现在 Google Play 环境内的特殊推广功能中时将使用的文本。\n- 应用程序类型（Application\
  \ Type）——您的应用程序被归为游戏还是应用程序。\n- 类别（Category）——最能描述您的应用程序的类别（例如金融、健康与健身、教育、体育等）。\n\
  - 地区（Locations）——您希望您的应用程序可以购买的地理位置。\n- 联系详情（Contact Details）——用户可以通过哪些方式与您联系以获取应用程序的支持。选项包括网页、电子邮件和电话。\n\
  - 价格与发行（Pricing & Distribution）——有关应用程序价格以及进行营销和销售的地理位置的信息。\n\n收集完上述信息后，点击 Google\
  \ Play 控制台中的 `Create app`（创建应用）按钮以开始创建过程。\n\n## 81.4 在控制台中配置应用\n\n当首次点击 `Create\
  \ app` 按钮时，将出现如下所示的应用程序详情和声明屏幕（图 81-1\n\n![](img/as_4.1_play_create_app.jpg)\n\n\
  图 81-1\n\n一旦应用条目完全配置，点击 `Create app` 按钮（如上图所示）来添加应用并显示仪表板屏幕。在仪表板中，找到 `Initial setup`（初始设置）部分并展开步骤列表以配置应用商店列表：\n\
  \n![](img/as_4.1_play_app_initial_steps.jpg)\n\n图 81-2\n\n按照链接列表操作，并为您的应用提供所需信息，确保在每一步中都保存更改。\n\
  \n## 81.5 启用 Google Play 应用签名\n\n直到最近，Google Play 的上传文件都是在 Android Studio 内部使用发布应用签名密钥进行签名的，然后上传到\
  \ Google Play 控制台。虽然此选项仍然可用，但现在推荐的上传方式是使用被称为 `Google Play App Signing`（Google Play\
  \ 应用签名）的流程。对于新创建的应用，这涉及加入 `Google Play App Signing`，然后在 Android Studio 中生成一个用于签名应用包文件的上传密钥。当上传由\
  \ Android Studio 生成的应用包文件时，Google Play 控制台将移除上传密钥，然后使用安全存储在 Google Play 服务器中的应用签名密钥对文件进行签名。对于现有应用，则需要额外的步骤来启用\
  \ Google Play 签名，将在章末尾介绍。\n\n在 Google Play 控制台中，从 `All Apps`（所有应用）屏幕（通过左侧导航面板顶部的选项访问）选择新添加的应用条目，展开\
  \ `Setup`（设置）部分（图 81-3 中标记 A），并选择 `App Signing`（应用签名）选项（B）。\n\n![](img/as_4.1_play_enable_app_signing.jpg)\n\
  \n图 81-3\n\n点击 `Create release`（创建发布）按钮（C）加入 Google Play 应用签名。控制台现在准备好创建您的应用程序的第一个版本进行测试。在此之前，下一步是在\
  \ Android Studio 内部生成上传密钥。这是生成签名应用包过程中的一部分。请保持当前 Google Play 控制台屏幕加载在浏览器中，因为我们将在本章稍后返回此处。\n\
  \n## 81.6 创建 Keystore 文件\n\n要创建 keystore 文件，选择 Android Studio 的 `Build`（构建）-> `Generate\
  \ Signed Bundle / APK…`（生成签名包/APK…）菜单选项，显示如 图 81-4 所示的 `Generate Signed Bundle or\
  \ APK Wizard` 对话：\n\n![](img/android_studio_3.2_select_app_bundle.jpg)\n\n图 81-4\n\
  \n在点击 `Next`（下一步）按钮之前，确认已选择 `Android App Bundle`（Android 应用包）。\n\n如果您已有发布 keystore\
  \ 文件，点击下一个屏幕上的 `Choose existing…`（选择现有…）按钮并导航选择该文件。如果您尚未创建 keystore 文件，点击 `Create\
  \ new…`（创建新…）按钮显示 `New Key Store`（新建密钥库）对话（图 81-5\n\n图 81-5\n\n底部部分与存储在密钥库中的上传密钥有关。在\
  \ `New Key Store` 对话的 `Key` 部分，输入以下信息：\n\n- 用于引用密钥的 `alias`（可以是字符序列，但系统仅使用前 8 个）。\n\
  - 用于保护密钥的强密码。\n- 密钥有效期（Google 建议超过 25 年）。\n\n此外，必须为剩余字段中的至少一个提供信息（例如，您的姓名或组织名称）。\n\
  \n![](img/Image4921.jpg)\n\n图 81-6\n\n输入信息后，点击 `OK` 按钮继续创建。\n\n## 81.7 创建 Android\
  \ 应用包\n\n下一步是指示 Android Studio 以发布模式构建应用包，然后使用新创建的私钥对其进行签名。此时 `Generate Signed Bundle\
  \ or APK` 对话应仍显示，且 `keystore path`、`passwords` 和 `key alias` 字段已填充信息：\n\n![](img/android_studio_3.2_keystore_info.jpg)\n\
  \n图 81-7\n\n确保启用了 `Export Encrypted Key`（导出加密密钥）选项，并在假设其他设置正确的情况下点击 `Next` 按钮进入应用包生成屏幕（图\
  \ 81-8）。在此屏幕上，检查 `Destination Folder:`（目标文件夹）设置，验证生成应用包文件的位置可以接受。如果需要其他位置，点击文本字段右侧的按钮并导航到所需的文件系统位置。\n\
  \n![](img/android_studio_3.2_generate_app_bundle.jpg)\n\n图 81-8\n\n点击 `Finish`（完成）按钮并等待\
  \ Gradle 系统构建应用包。完成后，将弹出在管理器中打开包含应用包文件文件夹的选项，或将文件加载到 APK Analyzer：\n\n![](img/android_studio_3.2_app_bundle_generated.jpg)\n\
  \n图 81-9\n\n\n\n\n\n此时，应用程序已准备好提交到 Google Play。点击“定位（locate）”链接打开文件浏览器窗口。该文件应命名为\
  \ `bundle.aab`，并位于项目文件夹的 `app/release` 子目录中，除非指定了其他位置。\n\n在此过程中生成的私钥应在以后签名和发布应用程序时使用，因此，应将其保存在安全的地方并进行安全备份。\n\
  \n# 81.8 生成测试 APK 文件\n\n此阶段的一个可选步骤是从应用包（`app bundle`）生成 `APK` 文件，并在设备或模拟器会话上安装并运行它们。Google\
  \ 提供了一个名为 `bundletool` 的命令行工具，专门为此目的设计，可以通过以下 URL 下载：\n\nhttps://github.com/google/bundletool/releases\n\
  \n在编写时，`bundletool` 以 `.jar` 文件的形式提供，可以按照如下方式从命令行执行（注意，自本书出版以来，版本号可能已经发生）：\n\n```\n\
  java -jar bundletool-all-0.9.0.jar\n```\n\n运行上述命令将列出工具中可用的所有选项。要从 `app bundle` 生成\
  \ `APK` 文件，需使用 `build-apks` 选项。要生成可以安装到设备或模拟器的 `APK` 文件，这些文件还需要经过签名。为了实现这一点，请包含\
  \ `--ks` 选项（指定在本节较早创建的密钥库文件路径），并配合 `--ks-key-alias` 选项（指定生成密钥时提供的别名）。\n\n最后，必须使用\
  \ `--output` 标志来指定生成 `APK` 文件的路径（称为 `APK Set`）。该文件不能已存在存在，且必须具有 `.apks` 文件扩展名。将这些要求结合起来，得到如下命令行（考虑到您的操作系统路径结构的差异）：\n\
  \n```\njava -jar bundletool-all-0.9.0.jar build-apks --bundle=/tmp/MyApps/app/release/bundle.aab\
  \ --output=/tmp/MyApks.apks --ks=/MyKeys/release.keystore.jks --ks-key-alias=MyReleaseKey\n\
  ```\n\n当执行此命令时，将出现提示符，在生成 `APK` 文件到指定的 `APK Set` 文件之前要求输入密钥库密码。`APK Set` 文件本质上是一个包含从\
  \ `app bundle` 生成的所有 `APK` 文件的 `ZIP` 文件。\n\n要将相应的 `APK` 文件安装到连接的设备或模拟器上，请使用类似的命令：\n\
  \n```\njava -jar bundletool-all-0.9.0.jar install-apks --apks=/tmp/MyApks.apks\n\
  ```\n\n此命令将指示工具识别适用于连接设备的相应 `APK` 文件并安装它们，以便可以启动和测试应用程序。\n\n也可以从 `APK Set` 中提取适用于连接设备的\
  \ `APK` 文件而不不安装它们。此过程的第一步是按照如下方式获取连接设备的规格：\n\n```\njava -jar bundletool-all-0.9.0.jar\
  \ get-device-spec --output=/tmp/device.json\n```\n\n上述命令将生成一个类似于所示的 `JSON` 文件：\n\
  \n```json\n{\n  \"supportedAbis\": [\"x86\"],\n  \"supportedLocales\": [\"en-US\"\
  ],\n  \"screenDensity\": 420,\n  \"sdkVersion\": 27\n}\n```\n\n接下来，使用此规格文件从 `APK\
  \ Set` 中提取匹配的 `APK` 文件：\n\n```\njava -jar bundletool-all-0.9.0.jar extract-apks\
  \ --apks=/tmp/MyApks.apks --output-dir=/tmp/nexus5_apks --device-spec=/tmp/device.json\n\
  ```\n\n执行时，通过 `--output-dir` 标志指定的目录将包含适用于指定设备配置的 `APK` 文件。\n\n将 Android 应用程序推向市场的下一步是将其提交到\
  \ Google Play 开发人员控制台，以便可以进行测试。\n\n# 81.9 将应用包上传到 Google Play 开发人员控制台\n\n返回 Google\
  \ Play 控制台，在点击“创建新发布（Create new release）”按钮（B）之前，在导航面板的“测试（Testing）”部分选择“内部测试（Internal\
  \ testing）”选项（在图 81-10 中标记为 A）：\n\n![](img/as_4.1_play_create_new_release.jpg)\n\
  ```图\n\n在结果屏幕上，点击“继续（Continue）”按钮（下方标记为 A）以确认使用 Google Play 应用签名，然后将 Android Studio\
  \ 生成的包文件拖放到上传投放点（B）：\n\n![](img/as_4.1_play_upload_bundle.jpg)\n```图 81-11\n```\n\
  \n上传完成后，向下滚动屏幕并输入发布名称和可选的发布说明。发布名称可以是任何帮助您识别发布的信息，且它对用户不可见。\n\n应用包文件上传后，Google Play\
  \ 将生成所有用于测试的必要 `APK` 文件。一旦生成了 `APK` 文件，滚动到屏幕底部并点击“保存（Save）”按钮。设置保存后，点击“审核发布（Review\
  \ release）”按钮。\n\n# 81.10 探索应用包\n\n在审核屏幕上，点击应用包右侧的箭头，如图 81-12 所示：\n\n![](img/as_4.1_play_bundle_review.jpg)\n\
  ```12\n```\n\n在结果面板中，点击“探索（Explore）”链接加载应用包。这提供了有关 API 级别、屏幕布局和平台的摘要信息：\n\n![](img/as_4.1_play_explorer.jpg)\n\
  ```13\n```\n\n点击“转到设备目录（Go to device catalog）”将显示支持设备：\n\n![](img/as_4.1_play_device_catalog.jpg)\n\
  ```4\n```\n\n此时，应用程序已准备好测试，但在设置测试人员之前无法发布。\n\n# 81.11 管理测试人员\n\n如果应用程序仍处于`内部（Internal）`、`Alpha`\
  \ 或 `Beta` 测试阶段，可以通过在控制台中内选择应用、点击“内部测试（Internal testing）”并选择“测试人员（Testers）”选项页来指定授权测试人员，如图\
  \ 81-15 所示：\n\n![](img/as_4.1_play_testers.jpg)\n```15\n```\n\n要添加测试人员，点击“创建电子邮件列表（Create\
  \ email list）”按钮，命名列表并手动或通过上传 `CSV` 文件指定电子邮件。现在可以从屏幕上复制“网页加入” URL 并提供给测试用户。\n\n\
  # 81.12 发布应用程序\n\n现在已经创建了内部发布并添加了测试人员列表，应用程序已准备好发布。在“内部测试（Internal testing）”屏幕内，在点击最近创建发布的“编辑（Edit）”按钮之前，选择“发布（Releases）”页：\n\
  \n![](img/as_4.1_play_ready_for_rollout.jpg)\n```16\n```\n\n在审核屏幕上，滚动到最后并点击“发布到内部测试（Start\
  \ rollout to Internal testing）”按钮。在发布处理短暂延迟后，应用程序将供指定用户下载和测试。\n\n# 81.13 上传新的应用包版本\n\
  \n您的应用程序首次上传的应用包版本号始终为 `1`。如果尝试上传具有相同版本代码的包文件，控制台将拒绝并显示以下错误：\n\n`You need to use\
  \ a different version code for your APK because you already have one with version\
  \ code 1.`\n\n要解决这个问题，需要增加嵌入包文件的版本代码。这在项目的模块级 `build.gradle` 文件中进行，如图 81-17 中高亮显示所示：\n\
  \n![](img/as_build_gradle.jpg)\n```17\n```\n\n默认情况下，该文件通常读取如下：\n\n```\nplugins {\n\
  \    id 'com.android.application'\n}\n\nandroid {\n    namespace 'com.ebookfrenzy.androidsample'\n\
  \    compileSdk 33\n    defaultConfig {\n        applicationId \"com.ebookfrenzy.androidsample\"\
  \n        minSdk 29\n        targetSdk 33\n    }\n}\n```\n\n\n\n\n\n```gradle\n\
  versionCode 1\nversionName \"1.0\"\n```\n\n要更改版本代码，只需更改 `versionCode` 旁声明的数字。若要更改显示给应用程序用户的版本号，请更改\
  \ `versionName` 字符串。例如：\n\n```gradle\nversionCode 2\nversionName \"2.0\"\n```\n\n\
  完成这些更改后，重新构建 APK 文件并再次执行上传。\n\n# 81.14 分析 App Bundle 文件\n\nAndroid Studio 提供了分析应用包（app\
  \ bundle）文件内容的功能。要分析包文件，请选择 Android Studio 中的 `Build -> Analyze APK…` 菜单选项，并导航到选择要审查的包文件。加载到工具后，将显示有关包的原始大小和下载大小的信息，并列出包的文件结构，如图\
  \ 81-18 所示：\n\n![](img/android_studio_3.2_bundle_analyzer.jpg)\n图 81-18\n\n选择 `classes.dex`\
  \ 文件将在下方面板中显示该文件的类结构。在此面板中，可以深入探索单个类的详细信息，直到类的方法级别：\n\n![](img/Image2583.jpg)\n\
  图 81-19\n\n同样，在文件列表中选择资源或图像文件将在下方面板中显示该文件的内容。通过点击 `Compare with previous APK…` 按钮并选择第二个包文件，可以查看两个包文件之间的大小差异。\n\
  \n# 81.15 总结\n\n一旦应用项目完成或准备好用户测试，即可将其上传到 Google Play 控制台并发布用于生产、内部、alpha 或 beta\
  \ 测试。在应用应用之前，必须在控制台中创建一个应用条目，其中包含应用的信息以及用于 Play 商店的截图。然后，在 Android Studio 内部生成一个发布范围的\
  \ Android App Bundle 文件，并使用上传密钥对其进行签名。包文件上传后，Google Play 会移除上传密钥，并将其替换为安全存储的应用签名密钥，此时应用程序即可发布。\n\
  \n可以随时通过将包文件加载到 Android Studio APK 分析器中来查看包文件的内容。\n\n# 82. Android 内购计费概述\n\n在 Android\
  \ 和 iOS 等操作系统的移动应用早期，最常见的盈利方式是收取预付费用以下载和安装应用程序。很快，另一种通过在应用内嵌入广告的收入机会被引入了。现在最常见且利润丰厚的选项可能是安装应用后向用户收取购买应用内项目的费用。这通常表现为访问游戏的高层级、获取虚拟商品或货币，或者订阅数字版杂志或报纸的高级内容。\n\
  \nGoogle 通过 `Google Play In-App Billing API` 和 Play 控制台支持集成内购功能。本章将提供内购计费的概述，并概述如何将内购计费集成到你的\
  \ Android 项目中。在探索这些主题后，下一章将引导你创建一个包含内购特性的示例应用。\n\n## 82.1 为内购准备项目\n\n在应用中构建内购计费需要一个\
  \ Google Play 开发者控制台帐户，其细节已在“创建、测试和上传 Android App Bundle”章节中介绍过。你还需要注册一个 Google\
  \ 商户账户并配置你的支付设置。通过在 Play 控制台中导航到 `Setup -> Payments profile`，可以找到这些设置。请注意，并非所有国家都提供商户注册。详情请参考以下页面：\n\
  \n[`support.google.com/googleplay/android-developer/answer/9306917`](https://support.google.com/googleplay/android-developer/answer/9306917)\n\
  \n随后需要将应用上传到控制台并启用内购。然而，除非在模块级的 `build.gradle` 文件中添加了 `Google Play Billing Library`，否则控制台将不会为应用激活内购支持：\n\
  \n```gradle\ndependencies {\n    implementation 'com.android.billingclient:billing:<latest\
  \ version>'\n}\n```\n\n一旦修改了构建文件并将应用包上传到控制台，下一步是添加用户购买的内购产品或订阅。\n\n## 82.2 创建内购产品和订阅\n\
  \n产品和订阅是通过 Play 控制台导航面板中 `Monetize`（变现）部分下方列出的选项创建和管理的，如下所示图 82-1 所示：\n\n![](img/play_console_monetization.jpg)\n\
  图 82-1\n\n每个产品或订阅都需要一个 ID、标题、描述和定价信息。购买分为消耗性（用户在每次需要时都必须购买，例如游戏中的虚拟货币）、非消耗性（用户只需购买一次，例如内容访问）和基于订阅的。消耗性和非消耗性产品统称为受管理产品。\n\
  \n订阅适用于销售需要按定期续订的物品，例如访问新闻内容或应用的高级功能。在创建订阅时，会定义一个基础方案，指定价格、续订周期（每月、每年等）以及订阅是否自动续订。还可以为用户提供优惠并给予促销选项。\n\
  \n## 82.3 计费客户端 (Billing Client)\n\n应用与 Google Play 库之间的通信由 `BillingClient` 实例处理。此外，`BillingClient`\
  \ 包含一组可以执行同步和异步计费的方法。在初始化客户端时，需要为其提供一个 `PurchasesListener` 处理器。客户端将调用该处理器来通知应用购买结果。为了避免重复通知，建议每个应用使用一个\
  \ `BillingClient` 实例。可以使用 `newBuilder()` 方法创建 `BillingClient` 实例并传入当前的 Activity。然后通过\
  \ `setListener()` 方法将处理程序分配给客户端：\n\n```java\nfinal PurchasesUpdatedListener purchasesUpdatedListener\
  \ = new PurchasesUpdatedListener() {\n    @Override\n    public void onPurchasesUpdated(BillingResult\
  \ billingResult, List<Purchase> purchases) {\n        if (billingResult.getResponseCode()\
  \ == BillingClient.BillingResponseCode.OK && purchases != null) {\n            //\
  \ 购买成功\n            for (Purchase purchase : purchases) {\n                // 处理购买\n\
  \            }\n        } else if (billingResult.getResponseCode() == BillingClient.BillingResponseCode.USER_CANCELED)\
  \ {\n            // 用户取消了购买\n        } else {\n            //在此处处理错误\n        }\n\
  \    }\n};\n\nprivate BillingClient billingClient = BillingClient.newBuilder(context)\n\
  \    .setListener(purchasesUpdatedListener)\n    .enablePendingPurchases()\n   \
  \ .build();\n```\n\n## 82.4 连接到 Google Play 计费库\n\n\n\n\n\n在成功创建 `BillingClient`\
  \ 后，下一步是初始化与 Google Play Billing Library 的连接。要建立此连接，需要调用计费客户端实例的 `startConnection()`\
  \ 方法。由于连接是异步进行的，因此需要实现一个 `BillingClientStateListener` 处理器，以接收指示连接是否成功的回调。还应该添加代码来重写\
  \ `onBillingServiceDisconnected()` 方法。当与 Billing Library 的连接丢失时，会调用此方法，并可以用它向用户报告问题并重试连接。\n\
  \n一旦设置和连接任务完成，`BillingClient` 实例将调用 `onBillingSetupFinished()` 方法，该方法可以检查客户端是否已就绪：\n\
  \n```java\nbillingClient.startConnection(new BillingClientStateListener() {\n  \
  \  @Override\n    public void onBillingSetupFinished(\n            @NonNull BillingResult\
  \ billingResult) {\n        if (billingResult.getResponseCode() ==\n           \
  \     BillingClient.BillingResponseCode.OK) {\n            // 连接成功\n        } else\
  \ {\n            // 连接失败\n        }\n    }\n    @Override\n    public void onBillingServiceDisconnected()\
  \ {\n        // 现有连接丢失\n    }\n});\n```\n\n## 82.5 查询可用产品\n\n一旦计费环境初始化并准备就绪，下一步是请求可购买的产品或订阅的详情。这通过调用\
  \ `BillingClient` 的 `queryProductDetailsAsync()` 方法并传递一个配置适当的 `QueryProductDetailsParams`\
  \ 实例来实现，该实例包含产品 ID 和类型（订阅使用 `ProductType.SUBS`，受管产品使用 `ProductType.INAPP`）：\n\n\
  ```java\nQueryProductDetailsParams queryProductDetailsParams =\n    QueryProductDetailsParams.newBuilder()\n\
  \        .setProductList(\n            ImmutableList.of(\n                QueryProductDetailsParams.Product.newBuilder()\n\
  \                    .setProductId(\"one_button_click\")\n                    .setProductType(BillingClient.ProductType.INAPP)\n\
  \                    .build()))\n        .build();\n\nbillingClient.queryProductDetailsAsync(queryProductDetailsParams,\n\
  \    new ProductDetailsResponseListener() {\n        public void onProductDetailsResponse(\n\
  \                @NonNull BillingResult billingResult,\n                @NonNull\
  \ List<ProductDetails> productDetailsList) {\n            if (!productDetailsList.isEmpty())\
  \ {\n                // 处理匹配产品列表\n            } else {\n                // 未找到匹配的产品\n\
  \            }\n        }\n    }\n);\n```\n\n`queryProductDetailsAsync()` 方法被传递一个\
  \ `ProductDetailsResponseListener` 处理器，该处理器反过来会被调用并传递一个包含匹配产品信息的 `ProductDetail`\
  \ 对象列表。例如，我们可以调用这些对象的方法来获取如产品名称、标题、描述、价格和优惠详情等信息。\n\n## 82.6 启动购买流程\n\n一旦用户查询并选择了某个产品或订阅，就可以启动购买流程了。我们通过调用\
  \ `BillingClient` 的 `launchBillingFlow()` 方法来实现，传递当前 activity 的参数以及一个包含已购买物品 `ProductDetail`\
  \ 对象的 `BillingFlowParams` 实例。\n\n```java\nBillingFlowParams billingFlowParams =\n\
  \    BillingFlowParams.newBuilder()\n        .setProductDetailsList(\n         \
  \   ImmutableList.of(\n                BillingFlowParams.ProductDetailsParams.newBuilder()\n\
  \                    .setProductDetails(productDetails)\n                    .build()))\n\
  \        .build();\nbillingClient.launchBillingFlow(this, billingFlowParams);\n\
  ```\n\n购买操作是否成功将通过之前述的 `PurchasesUpdated` 监听器调用来报告。\n\n## 82.7 完成购买\n\n当购买成功时，`PurchasesUpdated`\
  \ 处理器将收到一个包含每个物品 `Purchase` 对象的列表。你可以按照如下方式调用 `Purchase` 实例的 `getPurchaseState()`\
  \ 方法来验证是否已购买：\n\n```java\nif (purchase.getPurchaseState() == Purchase.PURCHASED)\
  \ {\n    // 购买完成\n} else if (purchase.getPurchaseState() == Purchase.PENDING) {\n\
  \    // 支付仍在处理中\n}\n```\n\n注意，只有在初始化期间调用了 `enablePendingPurchases()`，你的应用才会支持待处理购买。待处理购买将一直保留直到用户完成支付流程。\n\
  \n当非消耗性物品购买完成后，需要对其进行确认（acknowledge），以防止向用户退款。这需要物品的购买令牌，通过调用 `Purchase` 对象的 `getPurchaseToken()`\
  \ 方法获取。该令牌与 `AcknowledgePurchaseListener` 一起用于创建 `AcknowledgePurchaseParams` 实例。受管产品和订阅通过如下方式调用\
  \ `BillingClient` 的 `acknowledgePurchase()` 方法进行确认：\n\n```java\nAcknowledgePurchaseParams\
  \ acknowledgePurchaseParams =\n    AcknowledgePurchaseParams.newBuilder()\n    \
  \    .setPurchaseToken(purchase.getPurchaseToken())\n        .build();\nAcknowledgePurchaseListener\
  \ acknowledgeResponseListener =\n    new AcknowledgePurchaseListener() {\n     \
  \   @Override\n        public void onAcknowledgePurchaseResponse(@NonNull BillingResult\
  \ billingResult) {\n            billingClient.acknowledgePurchase(\n           \
  \     acknowledgePurchaseParams,\n                acknowledgeResponseListener);\n\
  \        }\n    };\n```\n\n对于消耗性购买，当物品被消耗后你需要通知 Google Play，以便用户可以再次购买。这需要一个包含购买令牌的配置好的\
  \ `ConsumeParams` 实例、一个 `ConsumeResponseListener` 以及对计费客户端 `consumeAsync()` 方法的调用：\n\
  \n```java\nConsumeParams consumeParams =\n    ConsumeParams.newBuilder()\n     \
  \   .setPurchaseToken(purchase.getPurchaseToken())\n        .build();\nConsumeResponseListener\
  \ listener = new ConsumeResponseListener() {\n    @Override\n    public void onConsumeResponse(BillingResult\
  \ billingResult,\n            @NonNull String purchaseToken) {\n        if (billingResult.getResponseCode()\
  \ ==\n                BillingClient.BillingResponseCode.OK) {\n            // 消耗成功\n\
  \        }\n    }\n};\n\nbillingClient.consumeAsync(consumeParams, listener);\n\
  ```\n\n## 82.8 查询历史购买\n\n在处理应用内计费时，一个常见需求是检查用户是否已购买某个产品或订阅。通过调用 `BillingClient`\
  \ 实例的 `queryPurchasesAsync()` 方法并实现 `PurchasesListener`可以生成特定类型的用户的所有历史购买列表。例如，以下代码获取了尚未消耗的已购买物品：\n\
  \n```java\nQueryPurchasesParams queryPurchasesParams =\n    QueryPurchasesParams.newBuilder()\n\
  \        .setProductType(BillingClient.ProductType.INAPP)\n        .build();\n\n\
  billingClient.queryPurchasesAsync(queryPurchasesParams,\n    new PurchasesListener()\
  \ {\n        @Override\n        public void onQueryPurchasesResponse(@NonNull BillingResult\
  \ billingResult,\n                @NonNull List<Purchase> list) {\n            //\
  \ 处理购买列表\n        }\n    }\n);\n```\n\n要获取活跃订阅列表，请将 `ProductType` 值从 `INAPP` 更改为\
  \ `SUBS`。\n\n\n\n\n另一种方法是获取每个产品的最新购买列表，请调用 `BillingClient queryPurchaseHistoryAsync()`\
  \ 方法：\n\n```java\nQueryPurchaseHistoryParams queryPurchaseHistoryParams =\n    \
  \    QueryPurchaseHistoryParams.newBuilder()\n            .setProductType(BillingClient.ProductType.INAPP)\n\
  \            .build();\n\nbillingClient.queryPurchaseHistoryAsync(queryPurchaseHistoryParams,\n\
  \    new PurchaseHistoryResponseListener() {\n        @Override\n        public\
  \ void onPurchaseHistoryResponse(@NonNull BillingResult billingResult,\n       \
  \         @NonNull List<PurchaseHistoryRecord> list) {\n            // 处理购买历史\n\
  \        }\n    });\n```\n\n# 82.9 总结\n\n应用内购买通过向用户出售虚拟产品和订阅，提供了一种从 Android 应用内部产生收入的方式。在本章中，我们探索了受管商品和订阅，并解释了消耗性商品（consumable）和非消耗性商品（non-consumable）之间的区别。使用\
  \ Google Play 应用内结算库为应用添加应用内购买支持，涉及创建和初始化一个结算客户端，并调用其方法来执行购买、列出可用产品和消耗现有购买等任务。下一章将包含一个教程，演示如何在\
  \ Android Studio 项目中添加应用内购买。\n\n# 83. Android 应用内购买教程\n\n在上一章中，我们探索了如何将应用内购买集成到\
  \ Android 项目中，并查看了一些可以在开发自己的项目时使用的代码示例。本章将通过创建一个示例项目将这些理论付诸实践，演示如何向 Android 应用添加消耗性应用内产品。该教程还将展示如何在\
  \ Google Play Console 中添加和管理应用内产品，并解释如何启用测试支付，以便在测试期间进行购买而无需花费真实资金。\n\n## 83.1 关于应用内购买示例项目\n\
  \n该项目的简单概念是：在点击按钮之前，必须先购买一个应用内产品。该应用内产品在每次点击按钮时都会被消耗，要求用户每次想点击按钮时都要重新购买产品。在初始化时，应用将连接到应用商店，获取产品详情并显示产品名称。一旦应用确认产品可用，购买按钮将启用，点击该按钮将进入购买流程。购买完成后，将启用第二个按钮，允许用户点击它并消耗购买商品。\n\
  \n## 83.2 创建 InAppPurchase 项目\n\n此练习的第一步是创建一个新项目。首先启动 Android Studio，并在欢迎屏幕上选择 `New\
  \ Project`。在新建项目对话框中，点击 `Next` 按钮之前选择 `Empty Activity` 模板。\n\n在 `Name` 字段中输入 `InAppPurchase`，并指定一个在\
  \ Google Play 生态系统中唯一标识您的应用的包名（例如 `com.<您的公司>.InAppPurchase`）。在点击 `Finish` 按钮之前，将\
  \ `Minimum API level` 设置为 `API 26`：Android 8.0 (Oreo)，并将 `Language` 菜单更改为 `Java`。项目创建后，使用第\
  \ [11.8 迁移项目到 View Binding] 节概述的步骤将项目转换为使用 view binding。\n\n## 83.3 向项目添加库\n\n在我们开始编写代码之前，需要向项目构建配置添加一些库，包括标准的\
  \ Android 结算客户端库。在项目的后期，我们还需要使用 Google Guava Core Java 库中的 `ImmutableList` 类。现在通过修改\
  \ `Gradle Scripts -> build.gradle (Module: InAppPurchase.app)` 文件并进行以下更改来添加这些库：\n\
  \n```gradle\ndependencies {\n    implementation 'com.android.billingclient:billing:5.1.0'\n\
  \    implementation 'com.google.guava:guava:24.1-jre'\n    implementation 'com.google.guava:guava:27.0.1-android'\n\
  }\n```\n\n点击编辑器面板顶部的 `Sync Now` 链接以提交这些更改。\n\n## 83.4 设计用户界面\n\n用户界面将由现有的 `TextView`\
  \ 和两个 `Buttons` 组成。在编辑器中加载 `activity_main.xml` 文件后，将两个 `Button` 视图拖放到布局中，使其中一个在\
  \ `TextView` 上方，另一个在下方。选择 `TextView`并将 `id` 属性更改为 `statusText`。\n\n点击工具栏中的 `Clear\
  \ all Constraints` 按钮并按住 Shift 选择所有三个视图。右键点击最上方的 `Button` 视图并选择 `Center -> Horizontally\
  \ in Parent` 菜单选项再次重复此步骤，这次选择 `Chains -> Create Vertical Chain`。更改顶部按钮的 `text` 属性使其显示为“Consume\
  \ Purchase”，并将 `id` 改为 `consumeButton`。此外，配置 `onClick` 属性以调用名为 `consume` 的方法。\n\n\
  选择最下方的按钮并重复上述步骤，这次将文本设置为“Buy Product”，id 设置为 `buyButton`，并将 onClick 设置为 `makePurchase`。完成后，布局应与图\
  \ 83-1 所示的匹配：\n\n![as_inpurchase_ui]\n\n## 83.5 将应用添加到 Google Play 商店\n\n使用“创建、测试和上传\
  \ Android Bundle”章节中概述的步骤，登录 Play Console，创建一个新应用，并设置一个新的内部测试轨道（internal track），其中包含指定测试人员的电子邮件地址。返回\
  \ Android Studio 为项目生成一个签名的发布包（release bundle）。生成包文件后，将其上传。\n\n现在应用已经在商店中占位，我们准备好创建应用内产品了。\n\
  \n## 83.6 创建应用内产品\n\n在 Play Console 中选中应用后，向下滚动左侧面板中的列表直到看到 Monetize（变现）部分。在该部分内，选择\
  \ Products 下的 In-app products 选项，如图 83-2 所示：\n\n![play_console_monetization1]\n\n\
  在应用内产品页面上，点击 `Create product` 按钮：\n\n![play_console_create_product]\n\n在新产品屏幕上，保存新产品之前输入以下信息：\n\
  \n- Product ID: `one_button_click`\n- Name: A Button Click\n- Description: 这是一个允许点击一次的测试应用内产品。\n\
  - Default price: 设置为您首选货币的最低价格。\n\n## 83.7 启用许可测试人员\n\n在测试应用内结算时，能够在不花费资金的情况下进行测试是非常用的。这可以通过对内部轨道测试人员启用许可测试来实现。许可测试人员在购买时可以使用测试支付卡，这样就不会被扣费。\n\
  \n在 Play Console 中，返回主界面并选择 `Setup -> License testing` 选项：\n\n![play_console_license_testing]\n\
  \n在许可测试屏幕内，添加内部测试轨道的测试人员，将 `License response` 设置为 `RESPOND_NORMALLY` 并保存更改：\n\n\
  ![play_console_license_testing_screen]\n\n## 83.8 初始化结算客户端\n\n现在应用和应用内产品已经在 Play\
  \ Console 中设置，我们可以开始向项目添加代码。\n\n编辑 `MainActivity.java` 文件并进行以下更改以开始实现应用内购买功能：\n\n\
  ```java\nimport androidx.annotation.NonNull;\nimport android.util.Log;\nimport com.android.billingclient.api.*;\n\
  ```\n\n\n\n\n```java\npublic class MainActivity extends AppCompatActivity {\n\n\
  \    private ActivityMainBinding binding;\n    private BillingClient billingClient;\n\
  \    private ProductDetails productDetails;\n    private Purchase purchase;\n  \
  \  static final String TAG = \"InAppPurchaseTag\";\n\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        binding = ActivityMainBinding.inflate(getLayoutInflater());\n        View\
  \ view = binding.getRoot();\n        setContentView(view);\n        billingSetup();\n\
  \    }\n\n    private void billingSetup() {\n        billingClient = BillingClient.newBuilder(this)\n\
  \                    .setListener(purchasesUpdatedListener)\n                  \
  \  .enablePendingPurchases()\n                    .build();\n        billingClient.startConnection(new\
  \ BillingClientStateListener() {\n            @Override\n            public void\
  \ onBillingSetupFinished(\n                        @NonNull BillingResult billingResult)\
  \ {\n                if (billingResult.getResponseCode() ==\n                  \
  \          BillingClient.BillingResponseCode.OK) {\n                    Log.i(TAG,\
  \ \"OnBillingSetupFinish connected\");\n                    queryProduct();\n  \
  \              } else {\n                    Log.i(TAG, \"OnBillingSetupFinish failed\"\
  );\n                }\n            }\n            @Override\n            public\
  \ void onBillingServiceDisconnected() {\n                Log.i(TAG, \"OnBillingSetupFinish\
  \ connection lost\");\n            }\n        });\n    }\n}\n```\n\n当应用启动时，`onCreate()`\
  \ 方法现在会调用 `billingSetup()`，该方法将创建一个新的结算客户端实例并尝试连接到 Google Play Billing Library。当连接尝试完成后，`onBillingSetupFinished()`\
  \ 监听器会被调用，并输出 Logcat 消息指示连接尝试的成功或失败。最后，我们还实现了 `onBillingServiceDisconnected()` 回调，如果\
  \ Google Play Billing Library 连接丢失，该回调将被调用。\n\n如果连接成功，将调用一个名为 `queryProduct()` 的方法。此方法和分配给\
  \ `billingClient` 的 `purchasesUpdatedListener` 现在都需要被添加。\n\n### 83.9 查询产品\n\n为了确保产品可以购买，我们需要创建一个\
  \ `QueryProductDetailsParams` 实例，并使用在 Play Console 中指定的产品 ID 进行配置，然后将其传递给 `billingClient`\
  \ 的 `queryProductDetailsAsync()` 方法。这要求我们还要添加 `onProductDetails()` 回调，在回调中中我们将检查产品是否存在、提取产品名称并将其显示在状态栏上。现在我们获取了产品详情，也可以安全地启用购买按钮。在\
  \ `MainActivity` 文件中，添加 `queryProduct()` 方法，其内容如下：\n\n```java\nimport com.google.common.collect.ImmutableList;\n\
  import java.util.List;\n\nprivate void queryProduct() {\n    QueryProductDetailsParams\
  \ queryProductDetailsParams =\n        QueryProductDetailsParams.newBuilder()\n\
  \            .setProductList(\n                ImmutableList.of(\n             \
  \       QueryProductDetailsParams.Product.newBuilder()\n                       \
  \ .setProductId(\"one_button_click\")\n                        .setProductType(BillingClient.ProductType.INAPP)\n\
  \                        .build()))\n            .build();\n    billingClient.queryProductDetailsAsync(\n\
  \        queryProductDetailsParams,\n        new ProductDetailsResponseListener()\
  \ {\n            public void onProductDetailsResponse(\n                    @NonNull\
  \ BillingResult billingResult,\n                    @NonNull List<ProductDetails>\
  \ productDetailsList) {\n                if (!productDetailsList.isEmpty()) {\n\
  \                    productDetails = productDetailsList.get(0);\n             \
  \       runOnUiThread(() -> {\n                        binding.buyButton.setEnabled(true);\n\
  \                        binding.statusText.setText(productDetails.getName());\n\
  \                    });\n                } else {\n                    Log.i(TAG,\
  \ \"onProductDetailsResponse: No products\");\n                }\n            }\n\
  \        });\n}\n```\n\n这里使用的许多代码在前面的章节中应该很熟悉。监听器检查是否至少找到一个符合标准的产品。然后，从匹配的产品中提取\
  \ `ProductDetails` 对象，将其存储在 `productDetails` 变量中，并将产品名称显示在 `TextView` 上。值得注意的是，当我们在状态\
  \ `TextView` 上显示产品名称时，是通过调用 `runOnUiThread()` 实现的。这是有必要的，因为监听器不是运行在主线程上的，所以无法安全地对用户界面更改。`runOnUiThread()`\
  \ 方法提供了一种在主线程上执行代码的快速方便的方法，而无需使用协程。\n\n### 83.10 启动购买流程\n\n当用户点击购买按钮时，将调用一个名为 `makePurchase()`\
  \ 的方法来启动购买过程。我们现在如下所示添加此方法：\n\n```java\npublic void makePurchase(View view) {\n\
  \    BillingFlowParams billingFlowParams =\n        BillingFlowParams.newBuilder()\n\
  \            .setProductDetailsParams(\n                ImmutableList.of(\n    \
  \                BillingFlowParams.ProductDetailsParams.newBuilder()\n         \
  \               .setProductDetails(productDetails)\n                        .build())\n\
  \            )\n            .build();\n    billingClient.launchBillingFlow(this,\
  \ billingFlowParams);\n}\n```\n\n### 83.11 处理购买更新\n\n购买过程的结果将通过初始化阶段分配给 `billingClient`\
  \ 的 `PurchaseUpdatedListener` 报告给应用。现在如下添加此处理器：\n\n```java\nprivate final PurchasesUpdatedListener\
  \ purchasesUpdatedListener = new PurchasesUpdatedListener() {\n    @Override\n \
  \   public void onPurchasesUpdated(BillingResult billingResult,\n            List<Purchase>\
  \ purchases) {\n        if (billingResult.getResponseCode() ==\n               \
  \     BillingClient.BillingResponseCode.OK\n                && purchases != null)\
  \ {\n            for (Purchase purchase : purchases) {\n                completePurchase(purchase);\n\
  \            }\n        } else if (billingResult.getResponseCode() ==\n        \
  \        BillingClient.BillingResponseCode.USER_CANCELED) {\n            Log.i(TAG,\
  \ \"onPurchasesUpdated: Purchase Canceled\");\n        } else {\n            Log.i(TAG,\
  \ \"onPurchasesUpdated: Error\");\n        }\n    }\n};\n```\n\n如果用户取消购买或发生其他错误，处理器将输出日志消息。然而，成功的购买将导致调用名为\
  \ `completePurchase()` 的方法，该方法传递当前的 `Purchase` 对象。按如下添加此方法：\n\n```java\nprivate\
  \ void completePurchase(Purchase item) {\n    purchase = item;\n    if (purchase.getPurchaseState()\
  \ == Purchase.PurchaseState.PURCHASED) {\n        runOnUiThread(() -> {\n      \
  \      binding.consumeButton.setEnabled(true);\n            binding.statusText.setText(\"\
  Purchase Complete\");\n        });\n    }\n}\n```\n\n该方法在验证产品确实已购买且付款尚未处理中之前存储了购买信息。然后启用“消耗”按钮并通知用户购买成功。\n\
  \n### 83.12 消耗产品\n\n现在用户可以点击“消耗”按钮，下一步是确保产品已被消耗，以便在再次购买按钮点击之前只能执行一次点击。这要求我们现在编写\
  \ `consumePurchase()` 方法：\n\n```java\npublic void consumePurchase(View view) {\n\
  ```\n\n\n\n\n\n```java\nConsumeParams consumeParams =\n        ConsumeParams.newBuilder()\n\
  \            .setPurchaseToken(purchase.getPurchaseToken())\n            .build();\n\
  ConsumeResponseListener listener = new ConsumeResponseListener() {\n    @Override\n\
  \    public void onConsumeResponse(BillingResult billingResult,\n            @NonNull\
  \ String purchaseToken) {\n        if (billingResult.getResponseCode() ==\n    \
  \            BillingClient.BillingResponseCode.OK) {\n            runOnUiThread(()\
  \ -> {\n                binding.consumeButton.setEnabled(false);\n             \
  \   binding.statusText.setText(\"Purchase consumed\");\n            });\n      \
  \  }\n    }\n};\n\nbillingClient.consumeAsync(consumeParams, listener);\n```\n\n\
  此方法创建了一个 `ConsumeParams` 实例，并为当前购买项配置了 `purchase token`（从之前在 `completePurchase()`\
  \ 方法中保存的 `Purchase` 对象获取）。该参数被传递给 `consumePurchase()` 方法，该方法在使用 `IO` 调度器的协程中启动。如果产品被成功消耗，将在主线程中执行代码以禁用消耗按钮并更新状态文本。\n\
  \n## 83.13 恢复之前的购买\n\n到目前为止，通过添加这些代码，我们可以在单次会话中购买并消耗产品。如果我们进行购买但在消耗之前退出应用，那么该购买项目前在应用重启时将会丢失。我们可以通过配置\
  \ `QueryPurchasesParams` 实例来搜索未消耗的内内产品，并将其传递给客户端的 `queryPurchasesAsync()` 方法，同时带上监听器引用，监听器将在结果返回时被调用。在\
  \ `MainActivity.java` 文件中添加如下新函数和监听器：\n\n```java\nprivate void reloadPurchase()\
  \ {\n    QueryPurchasesParams queryPurchasesParams = QueryPurchasesParams.newBuilder()\n\
  \            .setProductType(BillingClient.ProductType.INAPP)\n            .build();\n\
  \    billingClient.queryPurchasesAsync(\n            queryPurchasesParams,\n   \
  \         purchasesListener\n    );\n}\n\nprivate final PurchasesResponseListener\
  \ purchasesListener = new PurchasesResponseListener() {\n    @Override\n    public\
  \ void onQueryPurchasesResponse(@NonNull BillingResult billingResult,\n        \
  \    @NonNull List<Purchase> list) {\n        if (!list.isEmpty()) {\n         \
  \   purchase = list.get(0);\n            binding.consumeButton.setEnabled(true);\n\
  \        } else {\n            binding.consumeButton.setEnabled(false);\n      \
  \  }\n    }\n};\n```\n\n如果传递给监听器的购买列表不为空，则将列表中的第一个购买赋值给 `purchase` 变量，并启用消耗按钮（在更完整的实现代码中，应该添加逻辑通过比较产品\
  \ ID 来检查是否是正确的产品，并处理多个购买项返回）。如果没有找到任何购买项，则禁用消耗按钮，直到再次进行购买。剩下的工作工作是在计费设置过程中调用我们新的\
  \ `reloadPurchase()` 方法，如下：\n\n```java\nprivate void billingSetup() {\n.\n.\n  \
  \  if (billingResult.getResponseCode() ==\n            BillingClient.BillingResponseCode.OK)\
  \ {\n        Log.i(TAG, \"billingSetup connected\");\n        reloadPurchase();\n\
  \    } else {\n        Log.i(TAG, \"billingSetup failed\");\n    }\n}\n```\n\n##\
  \ 83.14 测试应用\n\n在测试应用之前，请确保设备已通过 USB 线缆或 WiFi 连接到 Android Studio，并在 Logcat 面板中选择该设备。在\
  \ Logcat 搜索栏中输入 `InAppTag` 并检查诊断输出。关于失败的额外信息，一个实用的技巧是从 `BillingResult` 实例中访问调试消息，例如：\n\
  \n```java\n} else if (billingResult.getResponseCode() ==\n        BillingClient.BillingResponseCode.USER_CANCELED)\
  \ {\n    Log.i(TAG, \"onPurchasesUpdated: Purchase Canceled\");\n} else {\n    Log.i(TAG,\
  \ billingResult.getDebugMessage());\n}\n```\n\n注意，只要你不更改模块级 `build.gradle` 文件中的应用版本号，你现在应该能够可以直接在设备上运行修改后的应用版本，而无需重新打包并上传到控制台。\n\
  \n如果没有列出测试卡，请确保设备上的用户账户已添加到许可测试列表中。如果应用运行在物理设备上，请尝试在模拟器上运行。如果所有其他方法都失败，你可以输入有效的支付方式进行测试购买，然后通过\
  \ Play Console 首页的订单管理界面自行退款。\n\n## 83.16 总结\n\n在本章中，我们创建了一个项目，演示了如何向 Android 应用中添加内购产品。这包括在\
  \ Google Play Console 中创建产品、编写初始化并连接计费客户端的代码、查询可用产品，最后是对产品的购买和消耗。我们还解释了如何使用 Play\
  \ Console 添加许可测试人员，以便在测试期间进行购买而无需付费。\n\n## 84. Android 动态功能模块概述\n\n如前一节所述，应用包（App\
  \ Bundles）和动态交付（Dynamic Delivery）的引入显著减少了用户安装应用时需要下载的包文件大小。尽管最初的目的是为每种可能的设备配置自动生成单独的包，但动态交付的另一个关键优势是将应用拆分为多个可以按需安装的动态功能模块。\n\
  \n在本章中，我们将开始探索动态功能模块的基本概念，为在下一章详细详细实践示例做准备。\n\n\n\n\n\n动态交付的主要目标是减少从应用商店安装应用所需的时间和带宽，同时确保应用在安装后仅占用最少的存储空间。\n\
  \n动态功能模块（也称为按需模块）允许将构成 Android 应用的不同功能打包到独立的模块中，只有在用户需要这些功能时，这些对等模块才会被下载并安装到设备上。例如，一个应用可能包含新闻和讨论功能。在这种情况下，该应用默认可能只安装新闻功能，并将讨论功能分离成一个动态功能模块。当用户尝试访问讨论功能时，应用将从\
  \ Google Play 商店下载该功能模块并启动它。如果用户从未访问过该功能，该模块将永远不会被安装，从而确保应用仅使用绝对最少的存储空间。\n\n使用动态功能模块的应用对模块的安装方式和时机具有完全控制权。事实上，应用还可以监控用户访问特定功能的频率，并临时移除任何不经常使用的模块。\n\
  \n动态功能还可能被指定为“即时（instant）”模块。这取代了早期 Android 版本中的“即时应用”（Instant App）概念，并允许在不安装应用的情况下在设备上运行动态功能模块。这使得应用可以在\
  \ Google Play 应用商店中显示“立即试用”按钮，或者通过点击网络 URL 在设备上立即启动。\n\n## 84.2 动态功能模块架构\n\n从一开始开始，Android\
  \ 的设计就考虑了模块化，特别是在 `Intents` 和 `Activities` 概念方面。动态功能将这种哲学推向了逻辑上的完成，允许应用在用户需要的时候安装用户需要的内容。鉴于这种能力的灵活性和强大，动态功能模块的实现相对简单。\n\
  \n简单来说，动态功能模块是使用拆分 APK 文件构建的，这些文件允许将多个 APK 文件组合成一个单一应用。\n\n正如我们在“创建、测试和上传 Android\
  \ App Bundle”中学习到的，动态交付和应用包通过生成一个自定义的 APK 文件来工作，该文件仅包含在特定设备配置上运行应用所需的字节码和资源。在这种情况下，应用仍然通过单个\
  \ APK 文件进行安装，尽管该文件是为用户的设备定制的。\n\n与此相反，动态功能模块通过将应用拆分为多个称为拆分 APK 文件的文件来工作。\n\n当应用使用拆分\
  \ APK 文件时，只有在首次下载应用时才会安装基础模块（base module）。基础模块通过可启动的 activity 充当应用的入口，并包含了应用基础功能的字节码和资源，以及应用其他部分所需的配置和构建资源。例如，基础模块的清单文件包含了与应用打包的任何动态功能模块的清单文件的合并版本。此外，所有动态功能模块的版本号由基础模块构建配置文件中的版本代码设置决定。\n\
  \n基础模块还包含一个应用包中包含的动态功能模块列表，且所有动态功能模块必须在它们的构建配置中将基础模块列为依赖项。\n\n每个动态功能以模块的形式存在，包含字节码、清单、资源和构建配置，以及该特定功能的任何其他资产（如图像或数据文件）。\n\
  \n当用户从应用商店请求安装应用时，商店将为该模块生成基础 APK 文件，该文件包含所有设备配置通用的字节码和资源，以及一组专门为用户设备配置的配置 APK 文件。同样，安装动态功能模块的请求除了生成相应的配置\
  \ APK 文件外，还会生成一个动态功能 APK 文件，如下方的图 84-1 所示：\n\n![](img/android_dynamic_feature_diagram.jpg)\n\
  \n图 84-1\n\n## 84.3 创建动态功能模块\n\n可以通过添加全新的模块或迁移现有模块来向项目添加动态功能。要添加新模块，只需选择 Android\
  \ Studio 的 `File -> New -> New Module...` 菜单选项。在弹出的对话框中，根据左侧面板选择“Dynamic Feature\
  \ Module”或“Instant Dynamic Feature Module”选项，取决于你要创建的动态功能类型：\n\n![](img/as_add_new_module.jpg)\n\
  \n图 84-2\n\n选择合适的动态功能选项后，为模块命名并更改最小 API 设置，使其与基础模块选择的 API 级别匹配（如果这些版本不匹配，项目将构建失败）。\n\
  \n再次点击 `Next` 按钮配置按需（On-Demand）选项：\n\n![](img/as_4.2_dynamic_feature_options.jpg)\n\
  \n图 84-3\n\n当启用 `Fusing` 选项时，在运行旧版本 Android（Android 4.4 API 20 或更早版本）的设备上，模块将与基础\
  \ APK 一起下载。模块标题（Module Title）字符串长度可达 50 个字符，Google Play 将在消息和通知中向用户描述该功能时使用。\n\n\
  安装时包含（Install-time inclusion）菜单提供了选项，用于控制模块按需安装而非包含在用户设备上的初始安装中的条件。该菜单提供以下选项：\n\n\
  - **在安装时不包含模块（仅按需）(Do not include module at install time (on-demand only))** - 无论设备配置和用户国家，除非应用请求，否则模块不会安装。\n\
  - **在安装时包含模块(Include module at install time)** - 为所有设备和用户国家禁用按需动态安装。模块将在应用安装设备时同时安装。\n\
  - **仅对具有指定功能的设备在安装时包含(Only include module at install-time for devices with specified\
  \ features)** - 符合指定标准的设备配置和国家将在安装时包含该模块。所有其他国家和配置将使用动态安装。选择此选项时，会出现额外的选项允许输入设备功能。如图\
  \ 84-4 所示，该模块将在具有麦克风和指纹识别器的设备上安装时包含。在所有其他设备上，模块将按需动态安装：\n\n![](img/as_4.2_dynamic_feature_device_features.jpg)\n\
  \n图 84-4\n\n其他标准（如国家 API 级别）必须在项目清单（`AndroidManifest.xml`）文件中声明。例如，以下项目将为法国用户和运行早于\
  \ API 21 的 Android 版本禁用动态按需功能安装：\n\n```xml\n<dist:conditions>\n  <dist:user-countries\
  \ exclude=\"true\">\n   <dist:country code=\"FR\"/>\n  </dist:user-countries>\n\
    <dist:min-sdk value=\"21\"/>\n</dist:conditions>\n```\n\n## 84.4 将现有模块转换为动态交付\n\
  \n如果应用包含适合动态交付现有功能，可以通过几个基本步骤转换为动态功能。例如，考虑以下项目结构：\n\n![](img/andorid_dynamic_feature_convert_tree.jpg)\n\
  \n图 84-5\n\n在此项目中，应用模块将作为基础模块，而 `secondfeature` 模块是转换为动态功能模块的理想候选者。\n\n\n\n\n要将应用中的现有模块转换为动态功能模块，请首先编辑模块层级的\
  \ `build.gradle` 文件（在上述示例中为 Gradle Scripts -> `build.gradle (Module: secondfeature)`），并将其修改为使用\
  \ `com.android.dynamic-feature` 替代 `com.android.application` 插件，同时更改依赖项使该模块仅依赖于基础（app）模块。例如：\n\
  \n```gradle\napply plugin: 'com.android.application'\n\napply plugin: 'com.android.dynamic-feature'\n\
  \ndependencies {\n    implementation fileTree(dir: 'libs', include: ['*.jar'])\n\
  \    api 'androidx.appcompat:appcompat:1.6.0'\n    api 'androidx.constraintlayout:constraintlayout:2.1.4'\n\
  \    testImplementation 'junit:junit:4.13.2'\n    androidTestImplementation 'androidx.test.ext:junit:1.1.5'\n\
  \    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'\n  \
  \  implementation project(':app')\n}\n```\n\n接下来，编辑该模块的 `AndroidManifest.xml` 文件并如下所示进行修改（注意在本示例中，这是一个按需模块，而非即时模块）：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:dist=\"http://schemas.android.com/apk/distribution\"\
  \n    package=\"com.ebookfrenzy.mymodule\">\n    <dist:module\n        dist:instant=\"\
  false\"\n        dist:onDemand=\"true\"\n        dist:title=\"@string/title_my_dynamic_feature\"\
  >\n        <dist:fusing dist:include=\"true\" />\n    </dist:module>\n    <application\n\
  \        android:allowBackup=\"true\">\n```\n\n注意 `title` 属性引用了一个字符串资源，该资源也需要在 `strings.xml`\
  \ 文件中声明。该属性强制要求使用字符串资源而非硬编码字符串。\n\n接下来，需要修改基础模块的 `build.gradle` 文件（`build.gradle\
  \ (Module: app)`）以引用动态功能模块，并添加 Play Core Library 作为依赖项：\n\n```gradle\napply plugin:\
  \ 'com.android.application'\n\nandroid {\n    compileSdkVersion 29\n    dynamicFeatures\
  \ = [\":secondfeature\"]\n}\n\ndependencies {\n    api 'com.google.android.play:core:1.10.3'\n\
  }\n```\n\n最后，编辑基础模块的 `AndroidManifest.xml` 文件，将该模块声明为 `SplitCompatApplication` 的子类：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    package=\"com.ebookfrenzy.mydemoapp\"\
  >\n    <application\n        android:name=\"com.google.android.play.core.splitcompat.SplitCompatApplication\"\
  \n        android:allowBackup=\"true\">\n```\n\n## 84. 使用动态功能模块\n\n一旦应用项目添加了一个或多个动态功能模块，就需要编写代码来安装和管理这些模块。这将涉及执行某些任务，例如检查模块是否已安装、安装模块、跟踪安装进度以及删除不再需要的已安装模块。所有这些任务都是使用\
  \ Play Core Library 提供的 API 完成的，大部分 API 调用涉及使用 `SplitInstallManager` 实例，该实例可以通过如下方式创建：\n\
  \n```java\nprivate SplitInstallManager manager;\nmanager = SplitInstallManagerFactory.create(this);\n\
  ```\n\n通常，在允许用户启动动态功能之前，第一步是检查相应的模块是否已经安装。例如，以下代码获取已安装模块的列表并检查特定模块是否安装：\n\n```java\n\
  if (manager.getInstalledModules().contains(\"my_dynamic_feature\")) {\n    // 模块已安装\n\
  }\n```\n\n可以通过构建 `SplitInstallRequest` 对象并将其传递给 `SplitInstallManager` 实例的 `startInstall()`\
  \ 方法来安装一个或多个模块：\n\n```java\nprivate int mySessionID = 0;\n\nSplitInstallRequest\
  \ request =\n        SplitInstallRequest\n            .newBuilder()\n          \
  \  .addModule(\"my_dynamic_feature\")\n            .addModule(\"my_dynamic_feature2\"\
  )\n            .build();\nmanager.startInstall(request)\n    .addOnSuccessListener(new\
  \ OnSuccessListener<Integer>() {\n        @Override\n        public void onSuccess(Integer\
  \ sessionId) {\n            mySessionID = sessionId;\n        }\n    })\n    .addOnFailureListener(new\
  \ FailureListener() {\n        @Override\n        public void onFailure(Exception\
  \ exception) {\n        }\n    });\n```\n\n当执行上述代码时，模块安装将开始。或者，也可以通过将功能名称数组传递给 `deferredInstall()`\
  \ 方法来执行延迟安装，如下：\n\n```java\nmanager.deferredInstall(Arrays.asList(\"my_dynamic_feature\"\
  , \"my_dynamic_feature2\"));\n```\n\n延迟下载由操作系统的决定在后台执行。虽然无法跟踪延迟安装的状态，但可以通过向管理器添加监听器来跟踪非延迟的安装：\n\
  \n```java\nSplitInstallStateUpdatedListener listener = new SplitInstallStateUpdatedListener()\
  \ {\n    @Override\n    public void onStateUpdate(SplitSessionState state) {\n \
  \       if (state.sessionId() == mySessionID) {\n            switch (state.status())\
  \ {\n                case SplitSessionStatus.REQUIRES_USER_CONFIRMATION:\n     \
  \               // 待用户许可\n                    break;\n                case SplitSessionStatus.DOWNLOADING:\n\
  \                    // 模块正在下载\n                    break;\n                case\
  \ SplitSessionStatus.INSTALLING:\n                    // 下载的模块正在安装\n           \
  \         break;\n                case SplitSessionStatus.DOWNLOADED:\n        \
  \            // 模块下载完成\n                    break;\n                case SplitSessionStatus.INSTALLED:\n\
  \                    // 模块已安装\n                    break;\n                case\
  \ SplitSessionStatus.CANCELED:\n                    // 用户取消了\n                 \
  \   break;\n                case SplitSessionStatus.PENDING:\n                 \
  \   // 安装已延迟\n                    break;\n                case SplitSessionStatus.FAILED:\n\
  \                    // 失败\n                    break;\n            }\n        }\n\
  \    }\n};\n```\n\n一旦实现了监听器，将需要将其向 `SplitInstallManager` 实例进行注册，并在不再需要时注销。\n\n```java\n\
  manager.registerListener(listener);\nmanager.unregisterListener(listener);\n```\n\
  \n## 84.6 处理大型功能模块\n\nAndroid 交付系统在未请求用户许可，不允许下载大于 10MB 的功能。当请求下载大型功能时，监听器会被调用并传递\
  \ `REQUIRES_USER_CONFIRMATION` 状态。此时，应用负责显示确认对话框，并可选地实现 `onActivityResult()` 方法以识别用户是批准还是拒绝了下载。\n\
  \n```java\nprivate static int REQUEST_CODE = 101;\n\n// ... 在 onStateUpdate 内部\n\
  case SplitSessionStatus.REQUIRES_USER_CONFIRMATION:\n    try {\n        manager.startConfirmationDialogForResult(state,\
  \ MainActivity.this, REQUEST_CODE);\n    } catch (IntentSender.SendIntentException\
  \ ex) {\n        // 请求失败\n    }\n    break;\n```\n\n\n\n上述代码启动了一个意图，该意图随后显示内置的确认对话框。此意图会将结果代码返回给\
  \ `onActivityResult()` 方法，其实现可能如下：\n\n```java\n@Override\npublic void onActivityResult(int\
  \ requestCode, int resultCode, Intent data) {\n    if (requestCode == REQUEST_CODE)\
  \ {\n        if (resultCode == RESULT_OK) {\n            // 用户批准了安装\n        } else\
  \ {\n            // 用户拒绝了安装\n        }\n    }\n}\n```\n\n如果用户批准了请求，动态功能模块将自动下载并安装。\n\
  \n# 84.7 总结\n\n动态功能模块允许将 Android 应用拆分为多个独立的功能模块，这些模块在用户需要时按需下载。动态功能模块还可以被配置为即时功能（instant\
  \ features）。即时功能可以在不向设备上安装应用的情况下运行，并且用户可以通过应用商店页面上的“立即尝试”（Try Now）按钮或通过网络 URL 访问。\n\
  \n动态特征的实现涉及将应用拆分为基础模块（base module）和一个或多个动态功能模块。可以在 Android Studio 中创建新的动态功能模块，也可以通过对项目配置进行少量更改，将现有模块转换为动态功能模块。\n\
  \n一旦动态功能模块被添加到应用中，应用将通过 Play Core Library 的 `SplitInstall` 类来处理这些模块的下载和管理。\n\n#\
  \ 85. Android Studio 动态功能教程\n\n在上一章中涵盖了 Android 动态交付和动态功能的基本概念，本章将以示例项目的形式将这些理论付诸实践。在本章创建的应用将包含两个\
  \ Activity，其中第一个将作为应用的基础模块，而第二个将指定为从运行中的应用内部按需下载的动态功能。本教程将包括在 Android Studio 内部创建动态模块、将应用包上传到\
  \ Google Play 商店进行测试，以及使用 Play Core Library 下载和管理动态功能的步骤。本章还将探索延迟动态功能安装的使用。\n\n\
  ## 85.1 创建 DynamicFeature 项目\n\n从欢迎界面选择 New Project（新建项目）选项，在弹出的新项目对话框中，点击 Next\
  \ 按钮之前选择 Empty Activity 模板。\n\n在 Name 字段中输入 `DynamicFeature`，并指定一个能够在 Google Play\
  \ 生态系统中唯一标识您的应用的包名（例如 `com.<your 公司>.dynamicfeature`）。在点击 Finish 按钮之前，将 Minimum\
  \ API level 设置更改为 API 26: Android 8.0 (Oreo)，并将 Language 菜单设置为 Java。\n\n## 85.2\
  \ 为项目添加动态功能支持\n\n在开始实现应用之前，需要对项目进行两处更改以添加对动态功能的支持。由于项目将大量使用 Play Core Library，需要在构建配置中添加一条指令以包含此库。在\
  \ Android Studio 中，打开 app 级别的 `build.gradle` 文件（`Gradle Scripts -> build.gradle\
  \ (Module: DynamicFeature.app)`），找到 dependencies 部分并按照所示所示添加 Play Core Library（请始终记住，现在可能有该库的更新版本）：\n\
  \n```gradle\ndependencies {\n    ...\n    implementation 'com.google.android.play:core:1.10.3'\n\
  \    ...\n}\n```\n\n一旦下载了动态功能模块，用户很可能需要立即访问组成该功能的代码和资源资产。但默认情况下，在应用重启之前，新安装的功能模块对应用的其余部分不可用。幸运的是，通过在项目中启用\
  \ `SplitCompat` 库可以避免这一缺陷。目前实现此目标最简单的方法是在主 `AndroidManifest.xml`（也称为基础模块清单）中将应用程序声明为子类\
  \ `SplitCompatApplication`，如下所示：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\n   \
  \ package=\"com.ebookfrenzy.dynamicfeature\">\n    <application\n        android:name=\"\
  com.google.android.play.core.splitcompat.SplitCompatApplication\"\n        android:allowBackup=\"\
  true\"\n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\
  \n        android:roundIcon=\"@mipmap/ic_launcher_round\">\n    ...\n</manifest>\n\
  ```\n\n## 85.3 设计基础 Activity 用户界面\n\n此时，项目包含一个 Activity，它将作为应用基础模块的入口点。该基础模块将负责请求、安装和管理动态功能模块。\n\
  \n为了演示动态功能的使用，基础 Activity 将由一系列按钮组成，这些按钮允许动态功能模块的安装、启动和删除。界面还将包含一个 `TextView` 用于显示与功能模块相关的状态信息。根据这些要求，将\
  \ `activity_main.xml` 文件加载到布局编辑器中，删除默认的 `TextView` 对象，并进行设计使其类似于图 85-1。\n\n一旦对齐对象，选择\
  \ `TextView` 并使用 Attributes（属性）工具窗口将 `id` 属性设置为 `status_text`。通过选择所有对象、右键点击 `TextView`\
  \ 并选择 `Center -> Horizontally` 选项开始应用布局约束，从而将所有对象约束在屏幕的水平中心。\n\n在所有对象仍处于选中状态时，再次右键点击\
  \ `TextView`，这次选择 `Chains -> Vertical Chain` 。在继续之前，将所有按钮文本字符串提取到资源中，并配置三个按钮分别调用\
  \ `launchFeature`、`installFeature` 和 `deleteFeature` 方法。\n\n## 85.4 添加动态功能模块\n\n\
  要在项目中添加动态功能模块，选择 `File -> New -> New Module...` 选项，在弹出的对话框中，从左侧面板选择 `Dynamic Feature`。在主面板中，将模块命名\
  \ `my_dynamic_feature`，并将最小 API 设置为 API 26: Android 8.0 (Oreo)，以便与基础模块选择的 API 级别匹配，如图\
  \ 85-2 所示。\n\n再次点击 Next 按钮以配置按需选项，确保已启用 Fusing 选项。在 Module Title 字段中输入文本“My Dynamic\
  \ Feature”。在点击 Finish 按钮之前，将 Install-time inclusion 菜单设置为 `Do not include module\
  \ at install time (on-demand only)`，提交更改并将动态功能模块添加到项目中。\n\n## 85.5 审查动态功能模块\n\n\
  在继续下一步之前，值得花时间查看 Android Studio 对项目进行的更改。理解这些更改对于解决问题以及将现有应用功能转换为动态功能都很有用。\n\n首先参考\
  \ Project 工具窗口，那里将出现一个代表新动态功能模块文件夹的新条目。\n\n\n\n\n请注意，该功能有自己的子结构，包括一个清单文件（manifest）、一个可以添加代码和资源的包以及一个\
  \ `res` 文件夹。打开并查看 `AndroidManifest.xml` 文件，该文件应包含在功能创建过程中选择的属性设置，包括按需（on-demand）、融合（fusing）和功能标题值：\n\
  \n```xml\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:dist=\"http://schemas.android.com/apk/distribution\"\n    package=\"\
  com.ebookfrenzy.my_dynamic_feature\">\n    <dist:module\n        dist:instant=\"\
  false\"\n        dist:title=\"@string/title_my_dynamic_feature\">\n        <dist:delivery>\n\
  \            <dist:on-demand />\n        </dist:delivery>\n        <dist:fusing\
  \ dist:include=\"true\" />\n    </dist:module>\n</manifest>\n```\n\n特别值得注意的是，模块标题字符串已作为字符串资源存储，而不是直接输入清单文件中。这是标题字符串的前提，该资源可以在基础模块的\
  \ `strings.xml` 文件（`app -> res -> values -> strings.xml`）中找到并在必要时进行修改。\n\n动态功能模块的构建配置可以在\
  \ `Gradle Scripts -> build.gradle (Module: DynamicFeature.my_dynamic_feature)` 文件中找到，其内容如下：\n\
  \n```gradle\nplugins {\n    id 'com.android.dynamic-feature'\n}\n\nandroid {\n \
  \   compileSdkVersion 33\n}\n\ndependencies {\n    implementation project(\":app\"\
  )\n}\n```\n\n该文件的关键条目是应用 `com.android.dynamic-feature` 插件，这确保了该模块被视为动态功能，以及指示该功能依赖于基础（`app`）模块的实现行。\n\
  \n基础基础模块的 `build.gradle` 文件（`Gradle Scripts -> build.gradle (Module: DynamicFeature.app)`）也包含一个列出动态功能模块的新条目。在查看该文件时，添加启用视图绑定（view\
  \ binding）支持的指令：\n\n```gradle\nplugins {\n    id 'com.android.application'\n}\n\n\
  android {\n    buildFeatures {\n        viewBinding true\n    }\n    dynamicFeatures\
  \ = [':my_dynamic_feature']\n}\n```\n\n项目中添加的任何额外动态功能也需要在此处引用，例如：`dynamicFeatures\
  \ = [\":my_dynamic_feature\", \":my_second_feature\", ...]`\n\n### 85.6 添加动态功能 Activity\n\
  \n从上方图 85-4 所示的 Project 工具窗口中可以明显看出，此时动态功能模块几乎只包含一个清单文件。下一步是向模块中添加一个 activity，以便该功能在从基础模块启动时能够实际执行操作。在\
  \ Project 工具窗口中，右键点击位于 `my_dynamic_feature -> java` 下的包名，选择 `New -> Activity ->\
  \ Empty Activity` 菜单选项。将 activity 命名为 `MyFeatureActivity` 并启用 `Generate Layout File`\
  \ 选项，但在点击 `Finish` 按钮之前禁用 `Launcher Activity` 。\n\n![](img/as_4.2_add_dynamic_feature_activity.jpg)\n\
  \n图 85-5\n\n一旦将 activity 添加到模块中，编辑 `AndroidManifest.xml` 文件并修改它以添加意图过滤器（intent filter），该过滤器将允许基础模块启动该\
  \ activity（其中 `<com.yourcompany>` 替换为您选择的使应用在 Google Play 上唯一的包名）：\n\n```xml\n<?xml\
  \ version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:dist=\"http://schemas.android.com/apk/distribution\"\n    package=\"\
  com.ebookfrenzy.my_dynamic_feature\">\n    <dist:module\n        dist:instant=\"\
  false\"\n        dist:title=\"@string/title_my_dynamic_feature\">\n        <dist:delivery>\n\
  \            <dist:on-demand />\n        </dist:delivery>\n        <dist:fusing\
  \ dist:include=\"true\" />\n    </dist:module>\n    <application>\n        <activity\
  \ android:name=\".MyFeatureActivity\"\n            android:exported=\"true\">\n\
  \            <intent-filter>\n                <action android:name=\"android.intent.action.VIEW\"\
  \ />\n                <action android:name=\"com.yourcompany.my_dynamic_feature.MyFeatureActivity\"\
  \ />\n                <category android:name=\"android.intent.category.DEFAULT\"\
  \ />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n\
  ```\n\n接下来，编辑 `build.gradle (Module: DynamicFeature.my_dynamic_feature)` 文件的 `dependencies`\
  \ 部分以包含 Google Play 库：\n\n```gradle\ndependencies {\n    implementation 'com.google.android.play:core:1.10.1'\n\
  }\n```\n\n为了能够从动态模块内部访问资源，需要在 `FeatureActivity` 内部调用 `SplitCompat.install()` 方法。编辑\
  \ `MainActivity.java` 文件并按所示修改 `onCreate()` 方法，包括添加视图绑定的更改：\n\n```java\nimport android.view.View;\n\
  import com.google.android.play.core.splitcompat.SplitCompat;\nimport <com.yourcompany>.dynamicfeature.databinding.ActivityMainBinding;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private ActivityMainBinding\
  \ binding;\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        SplitCompat.install(this);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n    }\n\
  ```\n\n如果未执行此步骤，在启动动态功能时会导致应用程序崩溃，出现类似的错误：\n`AndroidRuntime: java.lang.RuntimeException:\
  \ Unable to start activity ComponentInfo{com.ebookfrenzy.my_dynamic_feature.FeatureActivity}:\
  \ android.content.res.NotFoundException: Resource ID #0x8002000`\n\n通过在布局编辑器中加载\
  \ `activity_feature.xml` 文件并添加显示“My Dynamic Module”的 `TextView` 对象来完成该功能：\n\n![](img/as_3.4_dynamic_feature_activity.jpg)\n\
  \n图 85-6\n\n### 85.7 实现 launchIntent() 方法\n\n项目结构和用户界面设计完成后，是使用 Play Core 库开始处理动态功能了。第一步是实现\
  \ `launchFeature()` 方法，其目的是使用 `intent` 启动动态功能 activity。然而，启动尚未安装的动态功能模块中的 activity\
  \ 会导致应用程序崩溃。因此，`launchFeature()` 方法需要一些防御性代码来确保动态功能已安装。为了实现这一点，我们需要创建一个 `SplitInstallManager`\
  \ 类的实例，并调用该方法。如果已安装，则可以安全地启动模块中的 activity，否则需要在状态 `TextView` 上向用户显示消息。在 `MainActivity.java`\
  \ 文件中，对类进行以下更改：\n\n```java\nimport android.content.Intent;\nimport com.google.android.play.core.splitinstall.SplitInstallManager;\n\
  import com.google.android.play.core.splitinstall.SplitInstallManagerFactory;\n\n\
  public class MainActivity extends AppCompatActivity {\n    private ActivityMainBinding\
  \ binding;\n    private SplitInstallManager manager;\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        SplitCompat.install(this);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n       \
  \ manager = SplitInstallManagerFactory.create(this);\n    }\n\n    public void launchFeature(View\
  \ view) {\n        if (manager.getInstalledModules().contains(\"my_dynamic_feature\"\
  )) {\n```\n\n\n\n\n```java\nIntent i = new Intent(\n    \"<com.yourcompany>.my_dynamic_feature.MyFeatureActivity\"\
  );\nstartActivity(i);\n} else {\n    binding.statusText.setText(\"Feature not yet\
  \ installed\");\n}\n}\n.\n.\n\n### 85.8 上传 App Bundle 进行测试\n\n项目现在已准备好第一阶段测试。这涉及生成发布版\
  \ app bundle 并将其上传到 Google Play Console。实现此操作的步骤在创建、测试和上传 Android App Bundle 章节中已概述，但可以总结如下：\n\
  \n1. 登录 `Google Play Console` 并创建一个新应用。\n2. 按照步骤对标题、描述、分类和图像资源进行应用配置（示例图像资源可以在随书附带的示例代码的\
  \ `image_assets` 文件夹中找到）并保存草稿设置。同时，确保为 bundle 启用 Google Play 应用签名。\n3. 使用 `Android\
  \ Studio` 的 `Build` -> `Generate Signed App Bundle / APK...` 菜单生成签名的发布版 app bundle。\n\
  4. 在 `Google Play Console` 中，从左侧导航面板选择 `Testing` -> `Internal testing` 选项。\n5. 在\
  \ `Internal test` 界面，点击 `Create Release` 按钮并点击 `Continue` Accept 让 Google 管理密钥签名任务的选项。将上述生成的\
  \ app bundle 文件拖放到上传框并点击 `Save`。\n6. 切换到内部测试界面内的 `Testers` 标签卡，添加用于在一个或多个物理设备上测试应用的账户邮箱地址。\n\
  7. 返回 `Releases` 标签卡并点击 `Edit` 按钮。滚动到页面底部并点击 `Review release` 按钮。\n8. 在确认界面上，点击\
  \ `Start rollout to Internal testing` 按钮。该应用将列为 `Pending publication`（等待发布）。\n\n\
  一旦发布用于测试，将向通知发送给内部测试轨道上的所有用户，要求他们加入该应用的测试轨道。或者，复制 `Testers` 屏幕上列出的 URL 并发送给测试用户。一旦用户加入，将提供一个链接，在设备上打开该链接将启动\
  \ Play Store 应用并打开 DynamicFeature 应用的下载页，如图图 85-7 所示：\n\n![](img/as_3.6_install_dynamic_feature_app.jpg)\n\
  \n图 85-7\n\n点击按钮安装应用，然后打开它并点击 `Launch Feature` 按钮。动态功能尚未安装的事实应该反映在状态文本中。\n\n###\
  \ 85.9 实现 installFeature() 方法\n\n`installFeature()` 方法将为 `my_dynamic_feature` 模块创建一个\
  \ `SplitInstallRequest` 对象，然后使用 `SplitInstallManager` 实例启动安装过程。还将实现监听器以显示指示安装请求状态的\
  \ `Toast` 消息。留在 `MainActivity.java` 文件中，按照如下方式添加 `installFeature()` 方法：\n\n```java\n\
  .\n.\nimport android.widget.Toast;\n.\n.\nimport com.google.android.play.core.splitinstall.SplitInstallRequest;\n\
  import com.google.android.play.core.tasks.OnFailureListener;\nimport com.google.android.play.core.tasks.OnSuccessListener;\n\
  ...\npublic void installFeature(View view) {\n    SplitInstallRequest request =\n\
  \        SplitInstallRequest\n            .newBuilder()\n            .addModule(\"\
  my_dynamic_feature\")\n            .build();\n    manager.startInstall(request)\n\
  \        .addOnSuccessListener(new OnSuccessListener<Integer>() {\n            @Override\n\
  \            public void onSuccess(Integer sessionId) {\n                Toast.makeText(MainActivity.this,\n\
  \                    \"Module installation started\",\n                    Toast.LENGTH_SHORT).show();\n\
  \            }\n        })\n        .addOnFailureListener(new OnListener() {\n \
  \           @Override\n            public void onFailure(Exception exception) {\n\
  \                Toast.makeText(MainActivity.this,\n                    \"Module\
  \ installation failed\" + exception.toString(),\n                    Toast.LENGTH_SHORT).show();\n\
  \            }\n        });\n}\n.\n.\n```\n\n编辑 `Gradle Scripts` -> `build.gradle`\
  \ (Module: `DynamicFeature.app`) 文件并增加 `versionCode` 和 `versionName` 的值，以便将新版本的\
  \ app bundle 上传进行测试：\n\n```gradle\nandroid {\n.\n.\n    versionCode 2\n    versionName\
  \ \"2.0\"\n}\n```\n\n重复此步骤，在 `Gradle Scripts` -> `build.gradle` (Module: `DynamicFeature.my_dynamic_feature`)\
  \ 中声明匹配的版本号。\n\n生成一个包含更改的新 app bundle，然后返回 `Google Play Console` 中该应用的 `Testing`\
  \ -> `Internal testing` 页面，并点击下方图 85-8 所示的 `Create new release` 按钮：\n\n![](img/as_4.1_dynamic_feature_new_release.jpg)\n\
  \n图 85-8\n\n按照步骤上传新的 app bundle 并将其发布到内部测试。在测试设备上，打开 `Google Play Store` 应用并确保 `Install`\
  \ 按钮已变为 `Update` 按钮（如果没有，请关闭 App Store 应用并等待几分钟）并更新到新发布。一旦更新完成，运行应用，点击 `Install\
  \ Feature` 按钮确保安装成功。\n\n如果安装失败或应用崩溃，通常可以从 `LogCat` 输出中识别原因。将设备连接到开发计算机，打开终端或命令行窗口并执行以下命令：\n\
  \n```bash\nadb logcat\n```\n\n此 `adb` 命令将实时显示 `LogCat` 输出，包括应用遇到问题或崩溃时生成的任何异常。\n\
  \n### 85.10 添加监听器\n\n为了更详细地跟踪动态功能的安装进度，可以为应用添加 `SplitInstallUpdatedListener` 实例。由于可以同时安装多个功能模块，需要添加代码来跟踪分配给安装过程的\
  \ `session IDs`。首先添加一些导入，在 `MainActivity.java` 文件中声明当前会话 ID 的变量，并修改 `installFeature()`\
  \ 方法在每次成功启动时存储会话 ID 并注册监听器：\n\n```java\n.\n.\nimport com.google.android.play.core.splitinstall.SplitInstallSessionState;\n\
  import com.google.android.play.core.splitinstall.SplitInstallStateUpdatedListener;\n\
  import com.google.android.play.core.splitinstall.model.SplitInstallStatus;\n..\n\
  import java.util.Locale;\n..\npublic class MainActivity extends AppCompatActivity\
  \ {\n    MainBinding binding;\n    SplitInstallManager manager;\n    int mySessionId\
  \ = 0;\n..\n    public void installFeature(View view) {\n.\n.\n        manager.registerListener(listener);\n\
  \        manager.startInstall(request)\n            .addOnSuccessListener(new OnSuccessListener<Integer>()\
  \ {\n                @Override\n                public void onSuccess(Integer sessionId)\
  \ {\n                    mySessionId = sessionId;\n                    Toast.makeText(MainActivity.this,\n\
  \                        \"Module installation started\",\n                    \
  \    Toast.LENGTH_SHORT).show();\n                }\n            })\n..\n}\n```\n\
  \n\n\n\n接下来，实现监听器代码，使其读取如下：\n\n```java\nSplitInstallStateUpdatedListener listener\
  \ =\n    new SplitInstallStateUpdatedListener() {\n\n    @Override\n    public void\
  \ onStateUpdate(SplitInstallSessionState state) {\n        if (state.sessionId()\
  \ == mySessionId) {\n            switch (state.status()) {\n                case\
  \ SplitInstallSessionStatus.DOWNLOADING:\n                    long size = state.totalBytesToDownload();\n\
  \                    long downloaded = state.bytesDownloaded();\n              \
  \      binding.statusText.setText(String.format(Locale.getDefault(),\n         \
  \                   \"%d of %d bytes downloaded.\", downloaded, size));\n      \
  \              break;\n                case SplitInstallSessionStatus.INSTALLING:\n\
  \                    binding.statusText.setText(\"Installing feature\");\n     \
  \               break;\n                case SplitInstallSessionStatus.DOWNLOADED:\n\
  \                    binding.statusText.setText(\"Download Complete\");\n      \
  \              break;\n                case SplitInstallSessionStatus.INSTALLED:\n\
  \                    binding.statusText.setText(\"Installed - Feature is ready\"\
  );\n                    break;\n                case SplitInstallSessionStatus.CANCELED:\n\
  \                    binding.statusText.setText(\"Installation cancelled\");\n \
  \                   break;\n                case SplitInstallSessionStatus.PENDING:\n\
  \                    binding.statusText.setText(\"Installation pending\");\n   \
  \                 break;\n                case SplitInstallSessionStatus.FAILED:\n\
  \                    binding.statusText.setText(\n                            \"\
  Installation Failed. Error code: \" +\n                            state.errorCode());\n\
  \                case SplitInstallSessionStatus.CANCELING:\n                   \
  \ binding.statusText.setText(\"Installation canceling\");\n                    break;\n\
  \                case SplitInstallSessionStatus.REQUIRES_USER_CONFIRMATION:\n  \
  \                  binding.statusText.setText(\"User Confirmation\");\n        \
  \            break;\n                case SplitInstallSessionStatus.UNKNOWN:\n \
  \                   binding.statusText.setText(\"Unknown\");\n                 \
  \   break;\n            }\n        }\n    };\n```\n\n\n\n我们当然知道，Android 应用程序的用户界面是通过组装布局、文本字段和按钮等组件创建的。除非我们专门在\
  \ XML 布局资源文件中或通过编写代码显式地覆盖颜色属性，否则所有这些组件都将使用默认颜色显示。这些默认颜色由项目的主题（theme）定义。主题由一组颜色槽（在\
  \ `themes.xml` 文件中声明）组成，这些颜色槽被分配了颜色值（在 `colors.xml` 文件中声明）。每个 UI 组件在内部都经过程序设计，将主题颜色槽作为特定属性的默认颜色（例如\
  \ `Text` 小部件的前景颜色和背景颜色）。因此，我们可以通过更改分配给特定主题槽的颜色，简单地更改应用程序全局范围的主题。当应用程序运行时，当用户界面被渲染时，新的默认颜色将作为所有小部件的默认颜色。\n\
  \n## 86.3 Material Design 2 主题化\n\n在探索 Material Design 3 之前，我们首先需要查看 Material Design\
  \ 2 是是如何在 Android Studio 项目中使用的。应用程序项目使用的主题被声明为 `AndroidManifest.xml` 文件中 `application`\
  \ 元素的属性，例如：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    package=\"com.ebookfrenzy.themedemo\"\
  >\n    <application\n        android:allowBackup=\"true\"\n.\n.\n        android:supportsRtl=\"\
  true\"\n        android:theme=\"@style/Theme.MyDemoApp\"\n        tools:targetApi=\"\
  31\">\n        <activity\n.\n.\n```\n\n如之前讨论过的，所有与项目主题相关的文件都包含 `res -> values` 文件夹下的\
  \ `colors.xml` 和 `themes.xml` 文件中，如图图 86-1 所示：\n\n![](img/as_theme_files_in_project_tool_window.jpg)\n\
  \n图 86-1\n\n主题本身声明在位于 themes 文件夹下的两个 `themes.xml` 文件中。这些资源文件声明了不同的调色板，其中包含了用于设备处于亮色模式或深色模式时使用的\
  \ Material 主题颜色槽。注意，每个文件中的 `style` 名称属性必须与 `AndroidManifest.xml` 文件中引用的名称匹配：\n\n\
  ```xml\n<resources xmlns:tools=\"http://schemas.android.com/tools\">\n    <!-- 应用程序主题。\
  \ -->\n    <style name=\"Theme.MyDemoApp\" parent=\"Theme.MaterialComponents.DayNight.DarkActionBar\"\
  >\n        <!-- 主品牌颜色。 -->\n        <item name=\"colorPrimary\">@color/purple_500</item>\n\
  \        <item name=\"colorPrimaryVariant\">@color/purple_700</item>\n        <item\
  \ name=\"colorOnPrimary\">@color/white</item>\n        <!-- 次要品牌颜色。 -->\n      \
  \  <item name=\"colorSecondary\">@color/teal_200</item>\n.\n.\n```\n\n这些颜色槽（也称为颜色属性）被\
  \ Material 组件用于在屏幕上渲染时设置颜色。例如，`colorPrimary` 颜色槽被用 Material Button 组件的背景颜色。分配给槽的实际颜色在\
  \ `colors.xml` 资源文件中声明如下：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n\
  <resources>\n    <color name=\"purple_200\">#FFBB86FC</color>\n    <color name=\"\
  purple_500\">#FF6200EE</color>\n    <color name=\"purple_700\">#FF3700B3</color>\n\
  \    <color name=\"teal_200\">#FF03DAC5</color>\n    <color name=\"teal_700\">#FF018786</color>\n\
  \    <color name=\"black\">#FF000000</color>\n    <color name=\"white\">#FFFFFFFF</color>\n\
  </resources>\n```\n\n例如，`colorPrimary` 槽被分配了颜色 `purple_500`，而该颜色又被分配了 RGB 颜色值 `FF6200EE`。\n\
  \n创建自定义主题只需编辑这些文件以使用不同的颜色设置。这些更改将由 Material 组件作为默认颜色使用。\n\n## 86.4 Material Design\
  \ 3 主题化\n\nMaterial Design 3 (MD3) 仍然使用 `colors.xml` 和 `themes.xml` 文件，但为 MD3 组件提供了更广泛的颜色槽供使用。事实上，MD3\
  \ 为自定义应用主题提供了超过 25 种颜色槽。颜色名称也变得不同，它们描述的是颜色的用途而不是颜色本身。在 Material Design 2 中，例如，我们有一个名为\
  \ `purple_500` 的颜色：\n\n```xml\n<color name=\"purple_500\">#FF6200EE</color>\n```\n\
  \n这反过来被用于 `themes.xml` 文件中的 `colorPrimary` 主题槽：\n\n```xml\n<item name=\"colorPrimary\"\
  >@color/purple_500</item>\n```\n\n假设我们需要将 `colorPrimary` 从紫色改为红色。当然，，我们只需要为 `purple_500`\
  \ 颜色声明分配一个红色色调的 RGB 值即可。遗憾的是，我们现在有一个名称暗示它是紫色的红色颜色声明。唯一的选项是在 `colors.xml` 文件为红色添加一个新条目。\n\
  \n例如，`colorPrimary` 槽被分配了颜色 `purple_500`，该颜色又被分配了 RGB 颜色值 `FF6200EE`。\n\n创建自定义主题只需编辑这些文件以使用不同的颜色设置。这些更改将由\
  \ Material 组件作为默认颜色使用。\n\nMaterial Design 3 (MD3) 仍然使用 `colors.xml` 和 `themes.xml`\
  \ 文件，但为 MD3 组件提供了更广泛的颜色槽供使用。事实上，MD3 为自定义应用主题提供了超过 25 种颜色槽。颜色名称也变得不同，它们描述的是颜色的用途而不是颜色本身。在\
  \ Material Design 2 中，例如，我们有一个名为 `purple_500` 的颜色：\n\n```xml\n<color name=\"purple_500\"\
  >#FF6200EE</color>\n```\n\n这反过来被用于 `themes.xml` 文件中的 `colorPrimary` 主题槽：\n\n```xml\n\
  <item name=\"colorPrimary\">@color/purple_500</item>\n```\n\n假设我们需要将 `colorPrimary`\
  \ 从紫色改为红色。当然，我们只需要为 `purple_500` 颜色声明分配一个红色色调的 RGB 值即可。遗憾的是，我们现在有一个名称暗示它是紫色的红色颜色声明。唯一的选项是在\
  \ `colors.xml` 文件为红色添加一个新条目。\n\n例如，`colorPrimary` 槽被分配了颜色 `purple_500`，该颜色又被分配了\
  \ RGB 颜色值 `FF6200EE`。\n\n创建自定义主题只需编辑这些文件以使用不同的颜色设置。这些更改将由 Material 组件作为默认颜色使用。\n\
  \n## 86.5 构建自定义主题\n\n如我们目前所见，实现主题的编码工作相对简单。然而，困难的部分通常是选择一组组成主题的互补颜色。幸运的是，Google\
  \ 开发了一个工具，可以为为应用程序设计自定义颜色主题。该工具被称为 Material Theme Builder，地址如下：\n\n[`m3.material.io/theme-builder#/dynamic/custom`](https://m3.material.io/theme-builder#/dynamic/custom)\n\
  \n\n\n在自定义屏幕（图 86-2）上，点击颜色圆显示颜色选择对话框，为主色调键 (A) 选择颜色。一旦选择了颜色，预览 (B) 将更改，以反映所有 MD3\
  \ 颜色槽的推荐颜色，并带有示例应用界面和控件。此外，您可以通过点击相应的颜色圆显示颜色选择对话框，来覆盖二级（Secondary）、三级（Tertiary）和中性（Neutral）槽的生成颜色。\n\
  \n标记为 B 的区域显示了示例应用界面、亮色和深色方案图以及更新以预览您的颜色选择的控件。由于面板比浏览器浏览器长，必须向下滚动查看所有信息。\n\n要将主题整合到您的设计中，点击\
  \ `Export` 按钮 (C) 并选择 `Android View (XML)` 。下载后，可以使用 `colors.xml` 和 `themes.xml`\
  \ 文件替换项目中的现有文件。请注意，导出的两个 `themes.xml` 文件中的主题名称需要更改以匹配您的项目。\n\n![](img/theme_builder_custom.jpg)\n\
  \n图 86-2\n\n### 86. 总结\n\nMaterial Design 提供了指南和组件，定义了 Android 应用的外观和外观。可以通过设计主题为应用应用个人品牌，主题指定了显示应用时应使用的颜色、字体和形状。Google\
  \ 目前正在引入 Material Design 3，它取代了 Material Design 2 并支持包括动态颜色在内的 Material You 的新功能。为了设计您自己的主题，Google\
  \ 还提供了 `Material Theme Builder`，它简化了选择互补主题颜色的任务。一旦使用此工具设计了主题，就可以导出相应的文件并在 Android\
  \ Studio 项目中使用。\n\n### 87. 从 Material Design 2 迁移到 Material Design 3\n\n本章将演示如何将\
  \ Android Studio 项目从 Material Design 2 迁移到 Material Design 3，并集成使用 `Material Theme\
  \ Builder` 工具生成的自定义主题。本教程还将演示如何添加对动态主题颜色的支持并进行测试。\n\n#### 87.1 创建 ThemeMigration\
  \ 项目\n\n从欢迎界面选择 `New Project` 选项，在弹出的新项目对话框中，点击 `Next` 按钮之前选择 `Empty Activity` 模板。\n\
  \n在 `Name` 字段中输入 `ThemeMigration`，并指定 `com.ebookfrenzy.thememigration` 为包名。在点击 `Finish`\
  \ 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将 `Language` 菜单更改为\
  \ `Java`。\n\n#### 87.2 设计用户界面\n\n主活动将包含一个简单的布局，其中包含一些用户界面组件，这些组件使我们能够看到切换到 Material\
  \ Design 3 的效果以及本章之后执行的主题工作的效果。有关 MD3 组件的信息，请参考以下网页：\n\n[`material.io/blog/migrating-material-3`](https://material.io/blog/migrating-material-3)\n\
  \n布局将在 `activity_main.xml` 文件中设计，该文件目前包含一个 `Text` 。在布局编辑器中打开此文件，删除 `Text view`，禁用\
  \ `Autoconnect` 模式（在 图 87-1 中标记为 A），并点击按钮清除布局中的所有约束 (B)。\n\n![](img/as_theme_demo_autoconnect.jpg)\n\
  \n图 87-1\n\n从 `Palette` 部分，将 `Checkbox`、`Switch` 和 `Button` 拖到布局中。接下来，将一个 `FloatingActionButton`\
  \ 拖到布局中，使其位置如 图 87-2 所示：\n\n![](img/theme_demo_select.jpg)\n\n图 87-2\n\n主题准备好后，点击右上角的\
  \ `Export` 按钮并选择 `Android Views (XML)` 。在提示时，将文件保存到计算机文件系统上的合适位置。主题将保存为名为 `material-theme.zip`\
  \ 的压缩文件。\n\n使用适用于您的操作系统的工具解压主题文件，该文件应在名为 `material-theme` 的文件夹中包含以下文件夹和文件：\n\n-\
  \ `values/colors.xml` - 颜色定义\n\n- `values/themes.xml` - 亮色模式的主题\n- `values-night/themes.xml`\
  \ - 深色模式的主题\n\n现在主题文件已经生成，需要将其集成到 Android Studio 项目中。\n\n#### 87.3 迁移到 Material\
  \ Design 3\n\n要切换到 MD3 组件，我们仅需要编辑位于 `app > res > values` 下的 `themes.xml` 文件。第一个\
  \ `themes.xml` 中 `style` 元素的属性需要更改如下：\n\n```xml\n<resources>\n    <style name=\"\
  ThemeMigration\" parent=\"Theme.Material3.Light\">\n</resources>\n```\n\n同样，对 `themes.xml`\
  \ (night) 文件进行以下更改以迁移到深色模式：\n\n```xml\n<resources>\n    <style name=\"ThemeMigration\"\
  \ parent=\"Theme.Material3.Dark\">\n</resources>\n```\n\n做出更改后，运行一次应用，并注意下方 图 87-4\
  \ 所示的 MD2 和 MD3 在外观上的差异：\n\n![](img/theme_demo_md2_vs_md3.jpg)\n\n图 87-4\n\n####\
  \ 87.4 构建新主题\n\n如果您完成了上一章（“Material Design 3 主题与动态颜色”），可以使用可以使用一章中创建的自定义主题。如果您还没有自定义主题，请打开浏览器窗口并导航到以下\
  \ URL 以访问构建工具：\n\n[`m3.material.io/theme-builder#/custom`](https://m3.material.io/theme-builder#/custom)\n\
  \n一旦加载了构建器，选择一张壁纸，然后点击屏幕顶部的 `Custom` 按钮，然后点击 `Core Colors` 部分的 `Primary` 颜色圆以显示颜色选择器。从颜色选择器选择任何颜色作为您主题的基础：\n\
  \n![](img/theme_builder_color_dialog.jpg)\n\n图 87-5\n\n#### 87.5 将主题添加到项目\n\n在我们将新主题添加到项目之前，首先需要删除旧的\
  \ MD2 主题文件。如果 `Project` 工具窗口处于 `Project Files` 模式，这将更容易进行。要切换模式，请使用下方所示的 `Project`\
  \ 工具窗口顶部的菜单，并选择 `Project Files` 选项：\n\n\n\n\n\n![](img/as_theme_demo_project_files_menu_option.jpg)\n\
  \n图 87-6\n\n选择 `Project Files` 模式后，导航到 `app` -> `src` -> `main` -> `res` -> `values`\
  \ 文件夹，选择并删除 `colors.xml` 和 `themes.xml` 文件。同时，删除 `values-night` 文件夹中的 `themes.xml`\
  \ 文件。\n\n打开你操作系统的文件系统导航工具，找到新材料主题 `values` 文件夹中的 `colors.xml` 和 `themes.xml` 文件，并将它们复制并粘贴到\
  \ `Project` 工具窗口内的 `values` 文件夹中。重复此步骤，将 `values-night` 文件夹中的 `themes.xml` 文件复制并粘贴到\
  \ `values-night` 文件夹中。\n\n将 `Project` 工具窗口切换回 Android 模式，此时资源文件部分应与图 87-7 匹配：![](img/new_theme_files_added.jpg)\n\
  \n图 87-7\n\n接下来，修改亮色 `themes.xml` 文件以匹配当前项目：\n\n```xml\n<resources>\n    <style\
  \ name=\"Base.ThemeMigration\" parent=\"Theme.Material3.Light.NoActionBar\">\n \
  \       <item name=\"colorPrimary\">@color/md_theme_light_primary</item>\n     \
  \   <item name=\"colorOnPrimary\">@color/md_theme_light_onPrimary</item>\n    </style>\n\
  \    <style name=\"ThemeMigration\" parent=\"Base.ThemeMigration\" />\n</resources>\n\
  ```\n\n对 `themes.xml` (night) 文件重复这些步骤。\n\n返回 `activity_main.xml` 文件或再次运行应用，确认用户界面现在已使用自定义主题。\n\
  \n## 87.6 启用动态颜色\n\n为了测试动态颜色，需要在运行 Android 12 或更高版本且具有正确壁纸设置的设备或模拟器上运行应用。在设备或模拟器上启动\
  \ `Settings` 应用，从列表中选择 `Wallpaper`。在壁纸设置屏幕上，点击图 87-8 中标记为 A 的更改壁纸选项，选择一张与你的主题颜色显著不同的图片。一旦选择，将壁纸应用到首页。\n\
  \n返回 `Wallpaper & styles` 设置屏幕，在尝试不同的颜色方案（C）之前，确保已选择 `Wallpaper colors` 选项（B）。每点击一个选项，示例壁纸都会随之变化：\n\
  \n图 87-8\n\n```\n\n要要启用动态颜色，我们需要调用 `DynamicColors` 类的 `applyToActivitiesAvailable()`\
  \ 方法。为整个应用启用动态颜色支持，需要在自定义 `Application` 实例的 `onCreate()` 方法中调用它。首先，在 `app` -> `java`\
  \ -> `com.ebookfrenzy.themedemo` 下创建一个名为 `ThemeDemoApplication` 的新 Java 类，并修改如下：\n\
  \n```java\npackage com.ebookfrenzy.themedemo;\n\nimport android.app.Application;\n\
  import com.google.android.material.color.DynamicColors;\n\npublic class ThemeDemoApplication\
  \ extends Application {\n    @Override\n    public void onCreate() {\n        super.onCreate();\n\
  \        DynamicColors.applyToActivitiesAvailable(this);\n    }\n}\n```\n\n创建自定义的\
  \ `Application` 类后，现在需要配置项目使用该类而不是默认的 `Application` 实例。执行此操作，编辑 `AndroidManifest.xml`\
  \ 文件并添加引用新类的 `android:name` 元素：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\n   \
  \ package=\"com.ebookfrenzy.themedemo\">\n    <application\n        android:name=\"\
  .ThemeDemoApplication\"\n        android:allowBackup=\"true\">\n```\n\n编译并运行应用，注意布局现在使用的是匹配壁纸颜色的主题。将\
  \ `ThemeDemo` 应用置于后台，返回 `Wallpaper & styles` 设置屏幕并选择不同的壁纸。再次将 `ThemeDemo` 应用带回前景，此时它已动态适应了新的壁纸。\n\
  \n## 87.7 总结\n\n在本章中，我们演示了如何将 Android Studio 项目从 Material Design 2 迁移到 Material\
  \ Design 3。项目还使用了 Material Theme Builder 设计自定义主题，并解释了将生成的主文件集成到旧项目的步骤。\n\n## 88.\
  \ Android Studio 中的 Gradle 概述\n\n到为止，大多数人都认为 Android Studio 会采取必要的步骤来编译和运行已创建的应用项目。Android\
  \ Studio 一直在后台使用名为 `Gradle` 的系统来实现这一点。\n\n现在是查看如何使用 `Gradle` 来编译和打包应用程序的各种元素，并开始探索在\
  \ Android Studio 中需要高级需求时如何配置此系统。\n\n### 88.1 Gradle 概述\n\nGradle 是一个自动化构建工具包，它允许通过构建配置文件来配置项目的构建方式，这些文件定义了如何构建项目、项目成功构建需要满足哪些依赖项以及构建过程的最终结果应该是什么。\n\
  \nGradle 的优势在于它为开发者提供的灵活性。Gradle 系统是一个自包含的、基于命令行的环境，可以通过使用插件集成到其他环境中。在 Android Studio\
  \ 的情况下，Gradle 集成是通过通过命名恰当的插件提供的。尽管该插件允许在 Android Studio 内部启动和管理 Gradle 任务，但 Gradle\
  \ 命令行包装器仍然可用于构建 Android Studio 项目，包括未安装 Android Studio 的系统。\n\n构建项目的配置规则声明在基于 Groovy\
  \ 编程语言的 Gradle 构建文件和脚本中。\n\n### 88.2 Gradle 和 Android Studio\n\nGradle 为构建 Android\
  \ 应用项目带来了许多强大功能。一些关键功能如下：\n\n#### 88.2.1 合理默认\n\nGradle 实现了一个被称为“约定优于配置”的概念。这简单来说意味着\
  \ Gradle 有一组预定义的合理默认设置，除非它们被构建文件中的设置所覆盖。这意味着开发者可以使用最少的配置完成构建。只有当默认配置不能满足你的构建需求时，才需要修改构建文件。\n\
  \n#### 88.2.2 依赖项\n\nGradle 的另一个关键领域是依赖项。例如，考虑 Android Studio 项目中的模块触发了加载项目中另一个模块的请求。第一个模块实际上对第二个模块有依赖，因为如果运行时无法找到并启动第二个模块，应用程序将失败。这种依赖可以在第一个模块的\
  \ Gradle 构建文件中声明，以便将第二个模块包含在应用构建中，或者在无法找到或构建第二个模块时标记错误。依赖的其他示例是项目编译和运行所需的库和 JAR\
  \ 文件。\n\n\n\n\n\nAndroid Studio 项目使用另一个名为 `Maven` 的项目管理工具来处理远程依赖项。如果在 `Gradle` 构建文件中使用\
  \ Maven 语法声明了远程依赖，则该依赖项将从指定的仓库自动下载并包含在构建过程中。例如，下面的依赖项声明会将 `AppCompat` 库从 Google\
  \ 仓库添加到项目中：\n\n```\nimplementation 'androidx.appcompat:appcompat:1.6.0'\n```\n\n\
  ## 88.2.3 构建变体 (Build Variants)\n\n除了依赖项外，`Gradle` 还为 Android Studio 项目提供了构建变体支持。这允许从单个项目构建应用程序的多个变体。Android\
  \ 运行在许多不同的设备上，涵盖了各种处理器类型和屏幕尺寸。为了尽可能覆盖广泛的设备类型和尺寸，通常需要构建应用程序的多个不同变体（例如，一个适用于手机的用户界面，另一个适用于平板电脑屏幕的）。通过使用\
  \ `Gradle`，这现在 Android Studio 中已经可以实现。\n\n## 88.2.4 Manifest 条目 (Manifest Entries)\n\
  \n每个 Android Studio 项目都关联着一个 `AndroidManifest.xml` 文件，其中包含了应用程序的配置细节。在 `Gradle`\
  \ 构建文件中可以指定许多 manifest 条目，这些条目在项目构建时会自动生成到 manifest 文件中。这种功能与构建变体功能互补，允许为每个构建变体配置不同的应用程序版本号、应用\
  \ ID 和 SDK 版本信息等元素。\n\n## 88.2.5 APK 签名 (APK Signing)\n\n标题为 “创建、测试和上传 Android App\
  \ Bundle` 的章节涵盖了如何使用 Android Studio 环境创建带签名的发布 APK 文件。也可以将通过 Android Studio 用户界面输入的签名信息包含在\
  \ `Gradle` 构建文件中，这样就可以从命令行生成带签名的 APK 文件。\n\n## 88.2.6 ProGuard 支持\n\n`ProGuard`\
  \ 是 Android Studio 自带的一个工具，它可以对 Java 字节码进行优化、收缩和混淆，使其更高效且更难被反向工程（即他人通过分析编译后的 Java\
  \ 字节码来识别应用程序逻辑的方法）。`Gradle` 构建文件提供了控制在构建应用程序时是否对您的程序运行 `ProGuard` 的功能。\n\n## 88.3\
  \ 属性和设置 Gradle 构建文件\n\n`gradle` 构建配置由一组配置、属性和设置文件组成。例如，`gradle.properties` 文件主要包含与\
  \ Java 虚拟机 (`JVM`) 使用的命令行标志相关的晦涩设置、项目是否使用 `AndroidX` 库以及 Kotlin 编码风格支持。作为典型用户，你可能不需要更改此文件中的任何设置。\n\
  \n另一方面，`settings.gradle` 文件定义了当构建系统需要下载和安装构建项目所需的任何额外库和插件时，应该搜索哪些在线仓库，以及项目名称。一个典型的\
  \ `settings.gradle` 文件如下：\n\n```\npluginManagement {\n    repositories {\n     \
  \   gradlePluginPortal()\n        google()\n        mavenCentral()\n    }\n}\n\n\
  dependencyResolutionManagement {\n    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)\n\
  \    repositories {\n        google()\n        mavenCentral()\n    }\n}\n\nrootProject.name\
  \ = \"AndroidSample\"\n\ninclude ':app'\n```\n\n与 `gradle.properties` 文件一样，可能不需要对此文件进行更改。\n\
  \n## 88.4 顶层 Gradle 构建文件\n\n一个完整的 Android Studio 项目包含了构建 Android 应用程序所需的所有内容，由模块、库、manifest\
  \ 文件和 `Gradle` 构建文件组成。\n\n每个项目包含一个顶层 `Gradle` 构建文件。该文件列为 `build.gradle` (Project:\
  \ <project name>)，可以在项目工具窗口中找到，如图 88-1 所示：\n\n![](img/as_4.1_project_gradle_file.jpg)\n\
  \n图 88-1\n\n默认情况下，顶层 `Gradle` 构建文件的内容如下：\n\n```\n// 顶层构建文件，您可以在此处添加适用于所有子项目/模块的配置选项。\n\
  plugins {\n    id 'com.android.application' version '7.3.0' apply false\n    id\
  \ 'com.android.library' version '7.3.0' apply false\n}\n\ntask clean(type: Delete)\
  \ {\n    delete rootProject.buildDir\n}\n```\n\n目前，该文件所做的只是声明使用 `jcenter` 仓库获取远程库，并且构建依赖于\
  \ Gradle 的 Android 插件。在大多数情况下，没有对此构建文件进行任何更改。\n\n## 88.5 模块级 Gradle 构建文件\n\n一个 Android\
  \ Studio 应用程序项目由一个或多个模块组成。例如，假设有一个名为 `GradleDemo` 的应用程序项目，它包含两个名为 `Module1` 和 `Module2`\
  \ 的模块。在这种情况下，每个模块都需要它们自己的 `Gradle` 构建文件。在项目结构方面，这些文件的位置如下：\n\n- `Module1/build.gradle`\n\
  - `Module2/build.gradle`\n\n默认情况下，`Module1` 的 `build.gradle` 文件类似于以下：\n\n```\nplugins\
  \ {\n    id 'com.android.application'\n}\n\nandroid {\n    buildFeatures {\n   \
  \     viewBinding true\n    }\n    namespace 'com.ebookrenzy.example'\n    compileSdk\
  \ 33\n    defaultConfig {\n        applicationId \"com.ebookrenzy.example\"\n  \
  \      minSdk 26\n        targetSdk 33\n        versionCode 1\n        versionName\
  \ \"1.0\"\n        testInstrumentationRunner \"androidx.test.runner.AndroidJUnitRunner\"\
  \n    }\n    buildTypes {\n        release {\n            minifyEnabled false\n\
  \            proguardFiles getDefault('proguard-android-optimize.txt'), 'proguard-rules.pro'\n\
  \        }\n    }\n    compileOptions {\n        sourceCompatibility JavaVersion.VERSION_8\n\
  \        targetCompatibility JavaVersion.VERSION_8\n    }\n}\n\ndependencies {\n\
  \    implementation 'androidx.appcompat:appcompat:1.6.0'\n    implementation 'com.google.android.material:material:1.7.0'\n\
  \    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'\n    testImplementation\
  \ 'junit:junit:4.13.2'\n    androidTestImplementation 'androidx.test.ext:junit:1.1.3'\n\
  \    androidTestImplementation 'androidx.test.espresso:espresso-core:3.4.0'\n}\n\
  ```\n\n从文件内容可以看出，构建文件开头声明了使用 `Gradle` Android 插件：\n\n```\nplugins {\n    id 'com.android.application'\n\
  }\n```\n\n文件的 `android` 部分随后说明了构建 `Module1` 时使用的 SDK 版本。\n\n```\nandroid {\n   \
  \ compileSdk 33\n```\n\n`defaultConfig` 部分中声明的项定义了在构建期间生成到模块 `AndroidManifest.xml`\
  \ 中的元素。这些设置可以在构建文件中进行修改，它们取自最初创建模块时在 Android Studio 中输入的设置：\n\n```\ndefaultConfig\
  \ {\n    applicationId \"com.ebookrenzy.example\"\n    minSdk 26\n    targetSdk\
  \ 33\n    versionCode 1\n    versionName \"1.0\"\n    testInstrumentationRunner\
  \ \"androidx.test.runner.AndroidJUnitRunner\"\n}\n```\n\n`buildTypes` 部分包含了在构建应用程序发布版本\
  \ APK 时是否以及如何对 APK 文件上运行 `ProGuard` 的指令：\n\n```\nbuildTypes {\n        release {\n\
  \            minifyEnabled false\n            proguardFiles getDefault('proguard-android-optimize.txt'),\
  \ 'proguard-rules.pro'\n        }\n    }\n}\n```\n\n\n\n\n按照当前的配置，在构建 `Module1`\
  \ 时不会运行 ProGuard。要启用 ProGuard，需要将 `minify` 项从 `false` 更改为 `true`。可以在项目的模块目录中找到 `proguard-rules.pro`\
  \ 文件。对该文件所做的更改将覆盖 `proguard-android.txt` 文件中的默认设置，该文件位于 Android SDK 安装目录的 `sdk/tools/proguard`\
  \ 之下。\n\n由于此文件中没有声明 `debug buildType`，将使用默认设置（不带 ProGuard 进行构建，使用调试密钥进行签名，并启用调试符号）。\n\
  \n在模块构建文件中，还可能包含一个名为 `productFlavors` 的额外部分，以便创建多个构建变体。\n\n接下来，还包含了一些指令，用于指定构建项目时使用的\
  \ Java 编译器版本：\n\n```gradle\ncompileOptions {\n    sourceCompatibility JavaVersion.VERSION_1_8\
  \ own    targetCompatibility JavaVersion.VERSION_1_8\n}\n```\n\n最后，`dependencies`\
  \ 部分列出了模块所依赖的任何本地和远程依赖。上述示例文件中的依赖行指定了需要从 Android 仓库中包含的 Android 库：\n\n```\n.\n.\n\
  implementation 'androidx.appcompat:appcompat:1.6.0'\n.\n.\n```\n\n请注意，依赖声明包含了版本号，用于指示应该包含哪个版本的库。\n\
  \n## 88.6 在构建文件中配置签名设置\n\n本书的“创建、测试和上传 Android App Bundle”章节涵盖了使用 Android Studio\
  \ 用户界面设置密钥和生成签名发布版 APK 文件的步骤。这些设置也可以在 `build.gradle` 文件的 `signingConfigs` 部分中声明。例如：\n\
  \n```gradle\n.\n.\n    defaultConfig {\n.\n.\n    }\n    signingConfigs {\n    \
  \    release {\n            storeFile file(\"keystore.release\")\n            storePassword\
  \ \"your keystore password here\"\n            keyAlias \"your key alias here\"\n\
  \            keyPassword \"your key password here\"\n        }\n    }\n    buildTypes\
  \ {\n.\n.\n.\n}\n```\n\n上面的示例将密钥密码信息直接嵌入到构建文件中。这种方法的另一种替代方案是从系统环境变量中提取这些值：\n\n```gradle\n\
  signingConfigs {\n    release {\n        storeFile file(\"keystore.release\")\n\
  \        storePassword System.getenv(\"KEYSTOREPASSWD\")\n        keyAlias \"your\
  \ key alias here\"\n        keyPassword System.getenv(\"KEYPASSWD\")\n    }\n}\n\
  ```\n\n另一种方法是配置构建文件，让 Gradle 在构建过程中提示输入密码：\n\n```gradle\nsigningConfigs {\n    release\
  \ {\n        storeFile file(\"keystore.release\")\n        storePassword System.console().readLine(\"\
  \\nEnter Keystore password: \")\n        keyAlias \"your key alias here\"\n    \
  \    keyPassword System.console().readLIne(\"\\nEnter Key password: \")\n    }\n\
  }\n```\n\n## 88.7 从命令行运行 Gradle 任务\n\n每个 Android Studio 项目都包含一个 Gradle wrapper 工具，用于允许从命令行调用\
  \ Gradle 任务。该工具位于每个项目文件夹的根目录下。虽然该 wrapper 在 Windows 系统上可执行，但在 Linux 和 macOS 上使用之前，可能需要启用执行权限。要启用执行权限，请打开终端窗口，切换到需要该\
  \ wrapper 的项目文件夹，并执行以下命令：\n\n```bash\nchmod +x gradlew\n```\n\n一旦文件具有执行权限，则需要将该文件的位置添加到你的\
  \ `$PATH` 环境变量中，或者在运行时名前名前加上 `./` 前缀。例如：\n\n```bash\n./gradlew tasks\n```\n\nGradle\
  \ 将项目构建视为一系列不同的任务。通过在项目目录下运行以下命令，可以获取当前项目可用任务的完整列表（在 macOS 或 Linux 上运行时，记得在命令前加上\
  \ `./` 前缀）：\n\n```bash\ngradlew tasks\n```\n\n要构建一个适用于设备或模拟器测试的调试发布版项目，请使用 `assembleDebug`\
  \ ：\n\n```bash\ngradlew assembleDebug\n```\n\n或者，构建应用程序的发布版本：\n\n```bash\ngradlew\
  \ assembleRelease\n```\n\n## 88.8 总结\n\n在大多数情况下，Android Studio 在后台执行操作而无需任何人工干预。Gradle\
