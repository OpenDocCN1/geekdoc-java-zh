  ### 4.7 为导航图添加动作\n\n现在两个目的地已添加到图中，用户布局也已设计，项目现在需要一种方法让用户从主 fragment 导航到第二个 fragment。这将通过向图中添加动作来实现，并在可以在代码中引用。\n\
  \n要建立以主 fragment 为起点、第二个 fragment 为目的地的动作，打开导航图并将鼠标指针悬停在 `mainFragment` 目的地上，如图\
  \ 41-11 所示所示会出现一个圆：\n\n![](img/as_navigation_circle.jpg)\n\n图 4-11\n\n点击圆内部并将生成的线条拖向\
  \ `SecondFragment`：\n\n![](img/as_navigation_connecting.jpg)\n\n图 4-12\n\n释放线条以建立起点和目的地之间的动作连接，此时线条将如图\
  \ 41-13 所示变为箭头：\n\n![](img/as_navigation_connected.jpg)\n\n图 4-13\n\n可以通过选中它随时删除动作连接。选中箭头，查看属性窗口中的可用属性并将\
  \ 更改为 `mainToSecond`。这是代码中引用该动作的 ID。将编辑器切换到代码模式，注意动作现在包含在 XML 中：\n\n```xml\n<?xml\
  \ version=\"1.0\" encoding=\"utf-8\"?>\n<navigation xmlns:android=\"http://schemas.android.com/apk/res/android\"\
