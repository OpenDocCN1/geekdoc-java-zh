  \ `WebView` 对象拖放到到设备屏幕布局的中心。点击“推断约束”（Infer constraints）工具栏按钮，并使用 Attributes（属性）工具窗口更改\
  \ `WebView` 的 `layout_width` 和 `layout_height` 属性以匹配约束，使其填充整个布局画布，如图 76-2 所示：\n\n\
