  \n## 51.10 总结\n主/详情用户界面由一个主项目列表组成，当选择某个项目时，会在详情面板中显示关于该选择的额外信息。主/详情流（Primary/Detail\
  \ Flow）是 Android Studio 提供的一个模板，允许快速且相对轻松地创建主/详情布局。如本章所示，通过对默认模板文件进行细微修改，就可以以极少的编码和设计工作实现广泛基于主/详情的功能。\n\
  \n## 52. Android 服务概览\n`Service` 类专门设计用于允许应用程序启动并执行后台任务。与旨在快速执行任务后退出的广播接收器（broadcast\
  \ receivers）不同，服务设计用于执行需要较长时间才能完成的任务（例如通过互联网连接下载文件或向用户流式传输音乐），但不需要用户界面。\n\n在本章中，将概述不同类型的可用，包括绑定服务（bound\
  \ services）和意图服务（intent services）。介绍这些基础知识后，后续章节将通过一些服务的运行示例。\n\n### 52.1 Intent\
  \ 图服务\n如前所述，服务默认在启动它的组件相同的主线程中运行。因此，服务需要执行的任何 CPU 密集型任务都应该在新线程中进行，从而避免影响调用应用程序的性能。\n\
  \n`JobIntentService` 类是一个便利类（继承自 `Service` 类），它为处理后台任务设置了一个工作线程，并以异步方式处理每个请求。一旦服务处理了所有队列中的请求，它就会直接退出。使用\
  \ `JobIntentService` 类时，只需要实现 `onHandleWork()` 方法，其中包含为每个请求要执行的代码。\n\n对于不需要同步处理请求的服务，`JobIntentService`\
  \ 是推荐的选项。然而，需要同步处理请求的服务将需要继承自 `Service` 类，并手动实现和管理线程，以高效地处理任何 CPU 密集型任务。\n\n###\
  \ 52.2 绑定服务\n绑定服务允许启动组件与服务进行交互并从其接收结果。通过进程间通信（IPC）的实现，这种交互也可以跨进程边界进行。例如，一个 Activity\
  \ 可能会启动一个服务来处理音频播放。该 Activity 很可能包含一个用户界面，为用户提供暂停播放或跳到下一曲目的控制控件。同样，服务很可能需要向调用的 Activity\
  \ 通信信息，以指示当前音频轨道已完成，并提供即将开始播放的下一曲目的详情。\n\n组件（在此上下文中也称为客户端）通过调用 `bindService()` 方法启动并绑定到绑定服务。此外，多个组件可以同时绑定到一个服务。当客户端不再需要服务绑定关系时，应该调用\
  \ `unbindService()` 方法。当最后一个绑定的客户端从服务取消绑定时，Android 运行时系统将终止该服务。需要注意的是，绑定服务也可以通过调用\
  \ `startService()` 来启动。一旦启动，组件就可以通过 `bindService()` 调用绑定到它。当绑定服务通过调用 `startService()`\
  \ 启动时，即使在最后一个客户端从其取消绑定后，它将继续运行。\n\n绑定服务必须包含 `onBind()` 方法的实现，该方法在服务首次创建以及其他客户端随后绑定到正在运行的服务时都会被调用。该方法的目的是向绑定的客户端返回一个类型为\
  \ `IBinder` 的对象，该对象包含了客户端与服务通信所需的信息。\n\n在实现客户端与绑定服务之间的通信方面，推荐的技术取决于客户端和服务器是否位于相同或不同的进程中，以及该服务是否对客户端是私有的。本地通信可以通过扩展\
  \ `Binder` 类并从 `onBind()` 方法返回实例来实现。而进程间通信则需要 `Messenger` 和 `Handler` 的实现。这两种方法的细节将在后面的章节中介绍。\n\
  \n### 52.3 服务的结构\n如前所述，服务必须创建为 Android `Service` 类（具体为 `android.app.Service`）或其子类（如\
  \ `android.app.IntentService`）子类。在继承过程中，取决于所创建服务的具体性质，必须重写以下一个或多个父类回调方法：\n\n- `onStartCommand()`\
  \ – 当另一个组件通过调用 `startService()` 方法启动服务时调用的该方法。绑定服务不需要实现此方法。\n- `onBind()` – 当组件通过调用\
  \ `bindService()` 方法绑定到服务时调用。在实现绑定服务时，此方法必须返回一个 `IBinder` 对象以促进与客户端通信。\n- `onCreate()`\
  \ – 旨在执行初始化任务的地方，此方法在调用 `onStartCommand()` 或第一次调用 `onBind()` 方法之前立即调用。\n- `onDestroy()`\
  \ – 当服务被销毁时调用。\n- `onHandleWork()` – 仅适用于 `JobIntentService` 子类。调用此方法来处理服务的逻辑。它在独立于主应用程序的线程中执行。\n\
  \n注意，`IntentService` 类包含了自己的 `onStartCommand()` 和 `onBind()` 回调方法的实现，因此在子类中不需要实现它们。\n\
  \n### 52.4 控制销毁服务的重启选项\n`onStartCommand()` 回调方法需要返回一个整数值，以定义服务被 Android 运行时系统销毁时发生的情况。这些方法的可能返回值如下：\n\
  \n- `START_NOT_STICKY` – 指示系统在服务被销毁时不重启，除非有等待交付的意图。\n- `START_STICKY` – 指示如果服务在\
  \ `onStartCommand()` 方法返回后被销毁，则应尽快重启。在没有等待交付的意图的情况下，`onStartCommand()` 回调方法调用的意图值为\
  \ `NULL`。在销毁时正在处理的意图将被丢弃。\n- `START_REDELIVER_INTENT` – 指示如果服务从 `onStartCommand()`\
  \ 回调方法返回后被销毁，则应重启服务并将当前意图重新传递给 `onStartCommand()` 方法，随后是任何待挂的意图。\n\n### 52.5 在清单文件中声明服务\n\
  为了使服务可用，必须首先在清单文件中声明。这涉及在现有的 `<application>` 条目嵌入配置适当的 `<service>` 元素。至少，`<service>`\
  \ 元素必须包含声明服务类名的属性，如下 XML 片段所示：\n\n```xml\n<application\n    android:icon=\"@mipmap/ic_launcher\"\
  \n    android:label=\"@string/app_name\" >\n    <activity\n        android:label=\"\
  @string/app_name\"\n        android:name=\".MainActivity\" >\n        <intent-filter>\n\
  \            <action android:name=\"android.intent.action.MAIN\" />\n        </intent-filter>\n\
  \    </activity>\n</application>\n```\n\n\n\n\n\n```xml\n<manifest>\n<application>\n\
  <activity>\n<intent-filter>\n<category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n</intent-filter>\n</activity>\n<service android:name=\".MyService\" /> />\n\
  ```\n\n默认情况下，服务被声明为公开的，这意味着它们可以被其所在应用程序包之外的组件访问。要将服务设置为私有，必须在清单文件文件的 `<service>`\
  \ 元素中将 `android:exported` 属性声明为 `false`。例如：\n\n```xml\n<service android:name=\"\
  MyService\"\n         android:exported=\"false\">\n</service>\n```\n\n在使用 `JobIntentService`\
  \ 时，清单文件中的 Service 声明还必须如下所示请求 `BIND_JOB_SERVICE` 权限：\n\n```xml\n<service\n    android:name=\"\
  .MyJobIntentService\"\n    android:permission=\"android.permission.BIND_JOB_SERVICE\"\
  \ />\n```\n\n如前所述，服务默认运行在与调用组件相同的进程中。若要强制服务运行在自己的进程中，请向 `<service>` 元素添加 `android:process`\
  \ 属性，并声明一个以冒号（:）为前缀的进程名称：\n\n```xml\n<service android:name=\".MyService\"\n    \
  \     android:exported=\"false\"\n         android:process=\":myprocess\">\n</service>\n\
  ```\n\n冒号前缀表示新进程是本地应用程序私有的。然而，如果进程名以小写字母而不是冒号开头，该进程将是全局的，供其他组件使用。\n\n最后，服务可以使用与活动相同的意图过滤器机制向设备运行的其他应用程序发布功能。有关意图过滤器的更多细节，请参阅标题为\
  \ \"Android Intent 概述 的章节。\n\n## 52.6 在系统启动时运行的服务\n\n考虑到服务的后台性质，当 Android 系统首次启动时需要启动服务并不罕见。这可以通过创建一个广播接收器来实现，并配置意图过滤器以监听系统\
  \ `android.intent.action.BOOT_COMPLETED` 意图。当检测到此类意图时，广播接收器只需调用所需的服务然后返回。请注意，为了运行此类广播接收器需要请求\
  \ `android.permission.RECEIVE_BOOT_COMPLETED` 权限。\n\n### 52.7 总结\n\nAndroid 服务是一种强大的机制，允许应用程序在后台执行任务。服务一旦启动，无论调用它的应用程序是否为前台任务，即使启动服务的组件被销毁，它都会继续运行。\n\
  \n服务继承自 `Android Service` 类。绑定服务（Bound services）为其他客户端组件提供通信接口，通常一直运行到最后一个客户端从服务取消绑定为止。\n\
  \n默认情况下，服务在与调用应用程序相同的进程和主线程中运行。因此，应该在服务内部创建一个新线程，用于处理 CPU 密集型任务。通过对应用程序清单文件中相应的\
  \ `<service>` 条目进行细微配置，可以在单独进程中启动远程服务。\n\n`IntentService` 类（本身是 `Android Service`\
  \ 类的子类）为在单独的工作线程中处理异步服务请求提供了方便的机制。\n\n## 53. Android Intent 概述\n\n读到这本书的这里，你应该已经清楚\
  \ Android 应用程序在很大程度上由一个或多个活动组成。然而，一个尚未详细介绍的领域是一个活动如何触发另一个活动启动的机制。正如标题为 \"Android\
  \ 应用程序结构 的章节简要概述的那样，这主要通过使用意图（Intents）实现。\n\n在后续章节中通过基于 Android Studio 的意图示例实现之前，本章的目标是以显式意图和隐式意图的形式提供意图概述，并介绍意图过滤器。\n\
  \n### 53.1 意图概述\n\n意图（`android.content.Intent`）是一个活动启动另一个活动的消息系统。例如，一个活动可以发出一个意图来请求启动位于同一个应用程序内的另一个活动。然而，意图也超越了这一概念，它允许活动请求设备上任何其他已相应注册并配置了权限的活动的服务。例如，考虑应用程序中包含一个需要加载并向用户显示网页的活动。应用程序不需要包含第二个活动来执行执行此任务，代码只需简单地向\
  \ Android 运行时发送一个意图，请求任何注册了显示网页能力的活动的服务。运行时系统将该请求与设备上的可用活动进行匹配，并启动匹配的活动，或者在有多个匹配项的情况下，允许用户决定使用哪个活动。\n\
  \n意图还允许数据从发送活动传输到接收活动。在之前描述的场景中，例如，发送活动需要将要显示的网页 URL 发送给第二个活动。同样，接收活动也可以配置为在完成所需任务后向发送活动返回数据。\n\
  \n虽然在后面的章节中才会介绍，但值得强调，除了启动活动外，意图还用于启动并与服务以及广播接收器通信。\n\n意图分为显式意图和隐式意图。\n\n### 53.2\
  \ 显式意图\n\n显式意图通过引用目标活动的组件名称（实际上是类名）请求启动特定的活动。这种方法在启动与发送活动位于相同应用程序的活动时最为常见（因为应用程序开发者已知类名）。\n\
  \n显式意图是通过创建 `Intent` 类的实例来发出的，并传递活动上下文和要启动的活动的组件名称。然后调用 `startActivity()` 方法，并将意图对象作为参数传递。例如，以下代码段发出了请求启动类名为\
  \ `ActivityB` 的活动的意图：\n\n```java\nIntent i = new Intent(this, ActivityB.class);\n\
  startActivity(i);\n```\n\n可以在启动意图对象之前，通过调用意图对象的 `putExtra()` 方法将数据添加到意图对象中，从而传输到接收活动。数据必须以键值对的形式添加。以下代码扩展了之前的示例，向意图添加了键\
  \ `\"myString\"` 和 `\"myInt\"` 的字符串和整数值：\n\n```java\nIntent i = new Intent(this,\
  \ ActivityB.class);\ni.putExtra(\"myString\", \"This is a message for ActivityB\"\
  );\ni.putExtra(\"myInt\", 100);\nstartActivity(i);\n```\n\n目标活动作为 `Bundle` 对象的一部分接收数据，该对象可以通过调用\
  \ `getIntent().getExtras()` 获取。`Activity` 类的 `getIntent()` 方法返回启动该活动的意图，而 `Intent`\
  \ 类的 `getExtras()` 方法则返回一个包含数据的 `Bundle` 对象。例如，提取传递给 `ActivityB` 的数据值：\n\n\n\n\n\
  \n当使用意（intent）启动同一应用程序内的其他活动（activity）时，必须将这些活动列在应用程序清单文件中。以下 `AndroidManifest.xml`\
  \ 内容对于包含名为 `ActivityA` 和 `ActivityB` 的活动的应用程序是正确配置：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.intent1.intent1\" >\n    <application\n        android:icon=\"\
  @mipmap/ic_launcher\"\n        android:label=\"@string/app_name\" >\n        <activity\n\
  \            android:label=\"@string/app_name\"\n            android:name=\"com.ebookfrenzy.intent1.intent1.ActivityA\"\
  \ >\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\"\
  \ />\n                <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n            </intent-filter>\n        </activity>\n        <activity\n   \
  \         android:name=\"ActivityB\"\n            android:label=\"ActivityB\" >\n\
  \        </activity>\n    </application>\n</manifest>\n```\n\n### 53.3 从活动返回数据\n\
  \n正如上一节中的示例所示，虽然数据被传输到了 `ActivityB`，但没有方法可以将数据返回给第一个活动（我们称之为 `ActivityA`）。然而，这可以通过将\
  \ `ActivityB` 启动为 `ActivityA` 的子活动来实现。通过创建一个 `ActivityResultLauncher` 实例，可以将活动启动为子活动。通过调用\
  \ `registerForActivityResult()` 方法创建 `ActivityResultLauncher` 实例，并以 lambda 的形式传递一个回调处理器。当子活动返回时，将调用该处理器并传递其返回的数据。一旦创建了\
  \ `ActivityResultLauncher` 实例，就可以带有 `intent` 参数调用它来启动子活动。创建 `ActivityResultLauncher`\
  \ 实例的代码通常如下所示：\n\n```java\nActivityResultLauncher<Intent> startForResult = registerForActivityResult(\n\
  \    new ActivityResultContracts.StartActivityForResult(),\n    new ActivityResultCallback<ActivityResult>()\
  \ {\n        @Override\n        public void onActivityResult(ActivityResult result)\
  \ {\n            if (result.getResultCode() == Activity.RESULT_OK) {\n         \
  \       Intent data = result.getData();\n                // 处理返回数据的代码\n        \
  \    }\n        }\n    });\n```\n\n一旦启动器准备就绪，就可以如下调用它并传递要启动的 `intent`：\n\n```java\n\
  Intent i = new Intent(this, ActivityB.class);\n// ...\nstartForResult.launch(i);\n\
  ```\n\n要将数据返回给父活动，子活动必须实现 `finish()` 方法，该方法的目的是创建一个包含要返回数据的新 `intent` 对象，然后调用封装该方法的活动的\
  \ `setResult()` 方法，传递一个结果代码和包含返回数据的 `intent`。结果代码通常为 `RESULT_OK` 或 `RESULT_CANCELED`，但也可以根据开发者的需求使用自定义值。如果子活动崩溃，父活动将收到\
  \ `RESULT_CANCELED` 结果代码。\n\n例如，以下代码说明了典型的子活动 `finish()` 方法：\n\n```java\npublic\
  \ void finish() {\n    Intent data = new Intent();\n    data.putExtra(\"returnString\"\
  , \"Message to parent activity\");\n    setResult(RESULT_OK, data);\n    super.finish();\n\
  }\n```\n\n### 53.4 隐式意图\n\n与引用要启动活动类的显式意图（explicit intents）不同，隐式意图通过指定要执行的操作和接收活动要处理的数据类型来标识要启动的活动。例如，操作类型\
  \ `ACTION_VIEW` 配合以 `URI` 对象形式的网页 URL，将指示 Android 系统搜索并启动一个具备 Web 访问能力的活动。以下隐式意图在\
  \ Android 设备上执行执行时，将导致指定的网页在 Web 浏览器活动中出现：\n\n```java\nIntent intent = new Intent(Intent.ACTION_VIEW,\
  \ Uri.parse(\"https://www.ebookfrenzy.com\"));\nstartActivity(intent);\n```\n\n\
  当活动发布上述隐式意图时，Android 系统将使用一种称为意图解析（intent resolution）的过程，在设备上搜索能够处理 `http` 方案的 `ACTION_VIEW`\
  \ 请求的活动。系统在使用隐式意图启动活动之前，该活动必须已经经过用户验证或启用。如果这两个条件都不满足，该活动将不会被意图启动。在探索这两个选项之前，我们首先需要讨论意图过滤器（intent\
  \ filters）。\n\n### 53.5 使用意图过滤器\n\n意图过滤器是活动向 Android 意图过程“广告”其支持的操作和数据处理能力的机制。这些声明还包含了执行链接验证所需的设置。以下\
  \ `AndroidManifest.xml` 文件演示了在名为 `WebView` 的应用中名为 `WebActivity` 的活动的配置，并带有适当配置的意图过滤器：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<application\n    android:allowBackup=\"\
  true\"\n    android:icon=\"@mipmap/ic_launcher\"\n    android:label=\"@string/app_name\"\
  \n    android:roundIcon=\"@mipmap/ic_launcher_round\"\n    android:supportsRtl=\"\
  true\"\n    android:theme=\"@style/Theme.MyWebView\">\n    <activity\n        android:name=\"\
  WebActivity\"\n        android:exported=\"true\">\n        <intent-filter android:autoVerify=\"\
  true\">\n            <action android:name=\"android.intent.action.VIEW\" />\n  \
  \          <category android:name=\"android.intent.category.BROWSABLE\" />\n   \
  \         <category android:name=\"android.intent.category.DEFAULT\" />\n      \
  \      <data android:scheme=\"https\" />\n            <data android:host=\"www.ebookfrenzy.com\"\
  />\n        </intent-filter>\n    </activity>\n</application>\n</manifest>\n```\n\
  \n该清单文件配置了 `WebActivity` 活动，当另一个活动通过意图包含 `https://www.ebookfrenzy.com` URL 时进行响应。例如，以下代码将启动\
  \ `WebActivity` 活动（假设 `MyWebView` 应用已被用户验证或启用为支持链接）：\n\n```java\nIntent intent =\
  \ new Intent(Intent.ACTION_VIEW, Uri.parse(\"https://www.ebookfrenzy.com\"));\n\
  startActivity(intent);\n```\n\n### 53.6 自动链接验证\n\n使用 Web 启动 Android 设备上的活动被认为存在潜在的安全风险。为了降低这种风险，启动意图的链接必须经过自动验证，或者由用户在设备上手动添加为支持链接。要启用自动验证，目标活动中的相应声明必须将\
  \ `autoVerify` 设置为 `true`，如下所示：\n\n```xml\n<intent-filter android:autoVerify=\"\
  true\">\n<!-- ... -->\n</intent-filter>\n```\n\n接下来，需要将链接 URL 与应用链接所在的网站关联。这是通过创建一个名为\
  \ `assetlinks.json` 的数字资产链接文件并将其安装网站的 `.well-known` 文件夹中来实现。\n\n数字资产链接文件包含一个授予目标应用使用网站链接的权限的关系声明，以及一个声明配套应用包名和\
  \ SHA-256 证书指纹的目标声明。一个典型的资产链接文件可能如下所示：\n\n```json\n[\n  {\n    \"relation\": [\"\
  delegate_permission/common.handle_all_urls\"],\n    \"target\": {\n      \"namespace\"\
  : \"android_app\",\n      \"package_name\": \"com.ebookfrenzy.mywebview\",\n   \
  \   \"sha256_cert_fingerprints\": [\n        \"<您的证书指纹>\"\n      ]\n    }\n  }\n\
  ]\n```\n\n\n\n\n\n请注意，你可以手动创建此文件，也可以使用以下 URL 中的在线工具生成：\n\n[`developers.google.com/digital-asset-links/tools/generator`](https://developers.google.com/digital-asset-links/tools/generator)\n\
  \n在 Android 开发中，命名空间（namespace）值始终设置为“android_app”，而包名（package name）对应于要通过 intent\
  \ 启动的应用包。最后，证书指纹是构建应用所需的哈希值。当你测试应用时，这将是包含在 `debug.keystore` 文件中的调试证书。在 Windows 系统上，Android\
  \ Studio 将此文件存储在以下位置：\n\n`\\Users\\<your user name>\\.android\\debug.keystore`\n\
  \n在 macOS 和 Linux 系统上，可以在此处找到文件：\n\n`$HOME/.android/debug.keystore`\n\n一旦找到该文件，可以在终端或命令提示符窗口中运行以下命令获取\
  \ `SHA 256` 指纹：\n\n```bash\nkeytool -list -v -keystore <path to debug.keystore file\
  \ here>\n```\n\n当提示输入密码时，输入“android”，随后将出现包含 `SHA 256` 指纹的输出：\n\n证书指纹：\n\nSHA1:\
  \ 11:E8:66:11:B6:94:3D:AA:7E:50:63:99:77:B8:6A:90:FF:B6:9C:6D\n\nSHA256: 7F:EE:E3:C8:38:41:C3:EA:11:56:83:94:2A:4C:D2:EA:A0:69:F8:96:D1:17:77:02:46:EC:AD:6E:3C:64:A9:29\n\
  \n当你准备好构建应用的发布版本时，需要确保已将发布版的 `SHA 256` 指纹添加到资源文件中。关于生成发布版密钥库（keystore）文件的详情，请参见创建、测试和上传\
  \ Android App Bundle”章节。一旦拥有发布版密钥库文件，对其运行上述 `keytool` 命令即可获取指纹。\n\n一旦将数字资源文件放置在网站的正确位置，将应用安装到设备或模拟器上并等待\
  \ 30 秒以验证链接。要检查验证状态，请在命令行或终端提示符中运行以下命令：\n\n```bash\nadb shell pm get-app-links --user\
  \ cur com.example.mywebview\n```\n\n输出结果应包含链接已验证的确认：\n\n```text\ncom.example.mywebview:\n\
  \    ID: 0e399bca-bf58-4cfc-8c7b-d1a6c3b065ec\n    Signatures: [7F:EE:E3:C8:38:41:C3:EA:11:56:83:94:2A:4C:D2:EA:A0:69:F8:96:D1:17:77:02:46:EC:AD:6E:3C:64:A9:29]\n\
  \    Domain verification state:\n      www.ebookfrenzy.com: verified\n    User 0:\n\
  \      Verification link handling allowed: true\n      Selection state:\n      \
  \  Disabled:\n          www.ebookfrenzy.com\n```\n\n你也可以通过设备或模拟器上的“设置”应用按以下步骤检查状态：\n\
  \n1. 启动“设置”应用。\n2. 从主列表中选择“应用”（Apps）。\n3. 从已安装列表中找到并选择你的应用。\n4. 在应用的设置页面上，选择“默认打开”（Open\
  \ by Default）选项。\n\n页面显示后，该页面应标明链接已通过验证，如图图 53-1 所示：\n\n![](img/as_verified_app_link.jpg)\n\
  \n图 53-1\n\n要查看哪些链接已验证，点击上图中箭头指示的详情按钮，以显示以下面板：\n\n![](img/as_verified_links.jpg)\n\
  \n图 53-2\n\n`assetlinks.json` 文件可以包含多个数字资源链接，可能允许单个网站与多个应用关联。如果你无法使用自动链接验证，则需要在应用中添加代码，提示用户手动启用链接。\n\
  \n### 53.7 手动启用链接\n\n在无法通过上述步骤自动验证链接的情况下，唯一的选项是请求用户手动启用应用链接。这涉及启动目标应用的“设置”应用中的“默认打开”屏幕，用户可以在那里启用链接。由于突然弹出的“默认打开”屏幕可能会让普通用户感到困惑，建议在启动“设置”应用之前显示一个说明性对话框。\n\
  \n为了给用户提供手动启用链接的选项，需要在启动“设置”应用之前执行以下代码：\n\n```java\n// 显示说明需要启用链接的对话框的代码\n// ...\
  \ (对话框逻辑)\n\n// 点击后，上述示例将显示设置屏幕\nIntent intent = new Intent(Settings.ACTION_APP_OPEN_BY_DEFAULT);\n\
  intent.setData(Uri.parse(\"package:com.example.mywebview\"));\nstartActivity(intent);\n\
  ```\n\n### 53.8 检查 Intent 的可用性\n\n假设某个 intent 一定可用是不明智的，因为缺少匹配的 action 通常会导致应用程序崩溃。幸运的是，可以检查\
  \ activity 的可用性。可以使用以下方法识别 activity：\n\n```java\npublic static boolean isIntentAvailable(Context\
  \ context, String action) {\n    final PackageManager packageManager = context.getPackageManager();\n\
  \    final Intent intent = new Intent(action);\n    List<ResolveInfo> list = packageManager.queryIntentActivities(intent,\
  \ PackageManager.MATCH_DEFAULT_ONLY);\n    return list.size() > 0;\n}\n```\n\n###\
  \ 53.9 总结\n\nIntent 是一个 Android activity 启动另一个 activity 的机制。显式意（explicit intent）通过引用接收端的类名来引用特定的\
  \ activity。显式意通常但不限于用于启动应用内部的 activity。隐式意（implicit intent）指定要执行的操作和要处理的数据类型，并让\
  \ Android 运行时找到匹配的 activity。隐式意通常用于启动位于不同应用程序的 activity。\n\n在使用隐式意时，安全限制要求包含该意的应用在启动之前必须经过自动验证或由用户手动启用。自动验证涉及在链接\
  \ URL 对应的网站上放置数字资源链接文件。\n\n### 54 Android 显式意 —— 实例演示\n\nAndroid Intent 概述”章节涵盖了使用\
  \ intent 启动 activity 的理论。本章将通过创建一个示例应用将这些理论付诸实践。\n\n\n\n\n本章在章节中创建的示例 Android Studio\
  \ 应用程序项目将演示如何使用显式 `intent`来启动 `activity`，包括在发送和接收活动之间传输数据。下一章（“Android Implicit\
  \ Intents – 实例示例”）将演示隐式意图的使用。\n\n## 54.1 创建显式 Intent 示例应用程序\n\n从欢迎界面选择 `New Project`\
  \ 选项，在弹出的新项目对话框中，点击 `Next` 按钮之前选择 `Empty Activity` 模板。\n\n在 `Name` 字段中输入 `ExplicitIntent`，并指定\
  \ `com.ebookfrenzy.explicitintent` 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置更改为\
  \ `API 26`：Android 8.0 (Oreo)，并将 `Language` 菜单设置为 `Java`。按照节 11.8 将项目迁移到 View Binding\
  \ 中列出的步骤，将项目转换为使用 view binding。\n\n## 54.2 设计 MainActivity 的用户界面布局\n\n`MainActivity`\
  \ 的用户界面将由一个 `ConstraintLayout` 视图组成，其中包含命名为 `editText1`、`textView1` 和 `button1`\
  \ 的 `EditText`（文本）、`TextView` 和 `Button` 视图。使用 `Project` 工具窗口找到 `MainActivity` 的\
  \ `activity_main.xml` 资源文件（位于 `app -> res -> layout`），双击将其加载到 Android Studio 布局编辑器工具中。选择默认的“Hello\
  \ World!” `TextView` 并使用 `Attributes` 工具窗口为其分配 ID `textView1`。\n\n从调色板中拖入 `Button`\
  \ 对象并将其放置在水平居中且位于 `TextView` 底部边缘下方。更改文本属性使其显示为“Send Text”，并配置 `onClick` 属性以调用名为\
  \ `sendText()` 的方法。\n\n接下来，添加一个 `Plain Text` 对象，使其水平居中并位于 `TextView` 顶部边缘上方。使用 `Attributes`\
  \ 工具窗口删除分配给文本属性的“Name”字符串，并将 ID 设置为 `editText1`。布局完成后，点击工具栏上的 `Infer constraints`\
  \ 按钮以添加相应的约束：\n\n![](img/Image24342.jpg)\n\n图 54-1\n\n最后，点击布局编辑器窗口右上角的红色警告按钮，并使用生成的面板将“Send\
  \ Text”字符串提取到名为 `send_text` 的资源中。布局完成后，用户界面应该类似于图 54-2 所示：\n\n![](img/as_4.1_explicit_intent_ui.jpg)\n\
  \n图 54-2\n\n### 54.3 创建第二个 Activity 类\n\n当用户触摸“Send Text”按钮时，将发布一个 `intent` 请求启动第二个活动，用户可以在其中输入响应。因此，下一步是创建第二个活动。在\
  \ `Project` 工具窗口中，右键点击 `app -> java` 下的 `com.ebookfrenzy.explicitintent` 包名，并选择\
  \ `New -> Activity -> Empty Activity` 菜单选项以显示 New Android Activity 对话框，如图 54-3 所示：\n\
  \n![](img/as_4.2_intent_new_java_activity.jpg)\n\n图 54-3\n\n在 `Activity Name` 和\
  \ `Title` 字段中输入 `SecondActivity`，将布局文件命名为 `activity_second`并将 `Language` 菜单改为 `Java`。由于此活动在应用程序启动时不会启动（它将在点击按钮时通过\
  \ `MainActivity` 的 `intent` 启动），因此在点击 `Finish` 按钮之前确保禁用 `Launcher Activity` 选项。\n\
  \n## 54.4 设计 SecondActivity 的用户界面布局\n\n第二个活动所需的元素是 `Plain Text` `EditText`、`TextView`\
  \ 和 `Button` 视图。根据这些要求，将 `activity_second.xml` 布局加载到布局编辑器中并添加视图。\n\n在设计过程中，注意按钮视图上的\
  \ `onClick` 属性已配置为调用名为 `returnText()` 的方法，`TextView` 和 `EditText` 视图分别分配了 ID `textView2`\
  \ 和 `editText2`。完成后，布局应类似于图 54-4 所示。注意按钮上的文本（显示为“Return Text”）已提取到名为 `return_text`\
  \ 的字符串资源中。\n\n布局完成后，点击 `Infer constraints` 工具栏按钮为布局添加必要的约束：\n\n![](img/as_4.1_explicit_intent_ui_2.jpg)\n\
  \n图 54-4\n\n## 54.5 检查应用程序清单文件\n\n为了让 `MainActivity` 能够使用 `intent` 启动 `SecondActivity`，`AndroidManifest.xml`\
  \ 文件中需要存在 `SecondActivity` 节点。在 `Project` 工具窗口中找到此文件 (`app -> manifests`)，双击将其加载到编辑器并验证\
  \ Android Studio 是否已自动添加了该活动项：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\nxmlns:tools=\"\
  http://schemas.android.com/tools\">\n    <application\n        android:allowBackup=\"\
  true\"\n        android:dataExtractionRules=\"@xml/backup_rules\"\n        android:icon=\"\
  @mipmap/launcher\"\n        android:label=\"@string/app_name\"\n        android:roundIcon=\"\
  @mipmap/launcher_round\"\n        android:supportsRtl=\"true\"\n        android:theme=\"\
  @style/Theme.ExplicitIntent\">\n        <activity\n            android:name=\".MainActivity\"\
  \n            android:exported=\"true\">\n            <intent-filter>\n        \
  \        <action android:name=\"android.intent.action.MAIN\" />\n              \
  \  <category android:name=\"android.intent.category.LAUNCHER\" />\n            </intent-filter>\n\
  \        </activity>\n        <activity\n            android:name=\".SecondActivity\"\
  \n            android:exported=\"false\" />\n    </application>\n</manifest>\n```\n\
  \n由于第二个活动已列在清单文件中，现在是需要在 `MainActivity` 中编写代码来发布意了。\n\n### 54.6 创建 Intent\n\n`MainActivity`\
  \ 的目标是在用户触摸“Send Text”按钮时创建并启动 `intent`。在创建意的过程中，用户在 `EditText` 视图中输入的字符串将作为键值对添加到意对象中。当为\
  \ `MainActivity` 创建用户界面布局时，按钮对象被配置为在用户点击时调用 `sendText()` 方法。现在需要按照所示代码向 `MainActivity`\
  \ 类 `MainActivity.java` 源文件：\n\n```java\npackage com.ebookfrenzy.explicitintent;\n\
  \nimport android.content.Intent;\nimport android.view.View;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    public void sendText(View view) {\n        Intent\
  \ i = new Intent(this, SecondActivity.class);\n        String myString = binding.editText1.getText().toString();\n\
  \        i.putExtra(\"qString\", myString);\n        startActivity(i);\n    }\n\
  }\n```\n\n`sendText()` 方法的代码遵循“Android Intent 概述”中列出的技术。首先，创建一个 `Intent` 实例，并将当前活动和\
  \ `SecondActivity` 的类名作为参数传递。接下来，将 `EditText` 对象中的文本作为键值对添加到 `intent` 对象，并通过调用 `startActivity()`\
  \ 启动意，并将 `intent` 对象作为参数传递。编译并运行应用程序，触摸“Send Text”按钮启动 `SecondActivity`。使用返回按钮（位于屏幕底部工具栏中）或在较新的\
  \ Android 版本上从屏幕边缘向右滑动返回 `MainActivity` 屏幕。\n\n### 54.7 提取 Intent 数据\n\n\n\n\n既然\
  \ `SecondActivity` 正在从 `MainActivity` 启动，下一步是提取 `intent` 中包含的 `String` 数据值，并将其赋值给\
  \ `SecondActivity` 用户界面中的 `TextView` 对象。这需要在 `SecondActivity.java` 源文件的 `onCreate()`\
  \ 方法中添加一些代码，同时还需要调整 activity 以使用视图绑定（view binding）：\n\n```java\npackage com.ebookfrenzy.explicitintent;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\n\nimport android.os.Bundle;\n\
  \nimport android.content.Intent;\n\nimport android.view.View;\n\nimport com.ebookfrenzy.explicitintent.databinding.ActivitySecondBinding;\n\
  \npublic class SecondActivity extends AppCompatActivity {\n    private ActivitySecondBinding\
  \ binding;\n\n    public void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.SecondActivity);\n        binding = ActivitySecondBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n       \
  \ Bundle extras = getIntent().getExtras();\n        if (extras == null) {\n    \
  \        return;\n        }\n        String qString = extras.getString(\"qString\"\
  );\n        binding.textView2.setText(qString);\n    }\n}\n```\n\n在模拟器或物理 Android\
  \ 设备上编译并运行应用程序。在点击“Send Text”按钮之前，在 `MainActivity` 的文本框中输入一些文本。现在消息应该出现在 `SecondActivity`\
  \ 用户界面的 `TextView` 组件上。\n\n## 54.8 将 SecondActivity 作为子 Activity\n\n为了让 `SecondActivity`\
  \ 能够向 `MainActivity` 返回数据，`SecondActivity` 必须作为 `MainActivity` 的子活动启动。这意味着我们需要调用\
  \ `registerForActivityResult()` 并声明一个回调处理器，在 `SecondActivity` 返回时调用它。该回调将提取 `SecondActivty`\
  \ 返回的数据并显示在 `textView1` 上。\n\n调用 `registerForActivityResult()` 返回一个 `ActivityResultLauncher`\
  \ 实例，可以在 `sendText()` 内部调用它启动 intent。编辑 `MainActivity.java` 文件，使其内容如下：\n\n```java\n\
  import android.app.Activity;\nimport androidx.activity.result.ActivityResult;\n\
  import androidx.activity.result.ActivityResultCallback;\nimport androidx.activity.result.ActivityResultLauncher;\n\
  import androidx.activity.result.contract.ActivityResultContracts;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n    ActivityResultLauncher<Intent> startForResult\
  \ = registerForActivityResult(\n            new ActivityResultContracts.StartActivityForResult(),\n\
  \            new ActivityResultCallback<ActivityResult>() {\n                @Override\n\
  \                public void onActivityResult(ActivityResult result) {\n       \
  \             if (result.getResultCode() == Activity.RESULT_OK) {\n            \
  \            Intent data = result.getData();\n                        String returnString\
  \ = data.getExtras().getString(\"returnData\");\n                        binding.textView1.setText(returnString);\n\
  \                    }\n                }\n            });\n}\n```\n\n### 54.9 从子\
  \ Activity 返回数据\n\n为了让 `SecondActivity` 能够向 `MainActivity` 返回数据，`SecondActivity`\
  \ 必须作为 `MainActivity` 的子活动启动。这意味着我们需要调用 `registerForActivityResult()` 并声明一个回调处理器，在\
  \ `SecondActivity` 返回时调用它。该回调将提取 `SecondActivty` 返回的数据并显示在 `textView1` 上。\n\n调用\
  \ `registerForActivityResult()` 返回一个 `ActivityResultLauncher` 实例，可以在 `sendText()`\
  \ 内部调用它启动 intent。编辑 `MainActivity.java` 文件，使其内容如下：\n\n### 54.10 测试应用程序\n\n在模拟器或物理\
  \ Android 设备上编译并运行应用程序。在点击“Send Text”按钮之前，在 `MainActivity` 的文本框中输入一些文本。现在消息应该出现在\
  \ `SecondActivity` 用户界面的 `TextView` 组件上。\n\n### 54.11 总结\n\n在上一章涵盖了 intent 的基础知识后，本章的目标是完成一个应用程序，用于演示显式意（explicit\
  \ intents）的使用，以及父活动与子活动之间的数据传输。\n\n下一章将通过一个旨在演示隐式意（implicit intents）的示例。\n\n## 55.\
  \ Android 隐式意 – 实例详解\n\n在本章中，将在 Android Studio 中创建一个示例应用程序，以演示隐式意的实际实现。其目标是创建并发送一个意，请求加载网页内容并将其显示给用户。由于示例应用程序本身不包含能够执行此任务的\
  \ activity，因此将发布一个隐式意，以便 Android 解析算法能够识别并启动来自另一个应用程序的合适 activity。这最可能是 Android\
  \ 操作系统捆带的 Chrome 浏览器的 activity。\n\n### 55.1 创建 Android Studio 隐式意项目\n\n从欢迎界面选择 New\
  \ Project 选项，在弹出的新项目对话框中，选择 Empty Activity 模板，然后点击 Next 按钮。\n\n在 Name 字段中输入 `ImplicitIntent`，并指定\
  \ `com.ebookfrenzy.implicitintent` 为包名。由于此示例将使用仅限最新 Android 版本中的功能，在点击 Finish 按钮之前，将\
  \ Minimum API level 设置更改为 `API 31: Android 12.0 (S)`，并将语言菜单改为 Java。\n\n### 55.2\
  \ 设计用户界面\n\n`MainActivity` 类的用户界面非常简单，由一个 `ConstraintLayout` 和两个 `Button` 对象组成。在\
  \ Project 工具窗口中，找到 `app -> res -> layout -> activity_main.xml` 文件并双击它将其加载到 Layout\
  \ Editor 工具。\n\n删除默认的 `TextView`，并在启用 Autoconnect（自动连接）模式的情况下，在布局中放置 `Button` 组件，使其显示所示：\n\
  \n![](img/as_implicit_intent_ui.jpg)\n\n图 55-1\n\n将按钮上的文本分别设置为 `Show Web Page` 和\
  \ `Enable Links`，并将文本提取到字符串资源中。\n\n依次选择每个 `Button` 并使用 Attributes 工具窗口配置 `onClick`\
  \ 属性，以调用 `showWebPage` 和 `enableLink` 方法。\n\n\n\n\n如上所述，隐式意图将在名为 `showWebPage()`\
  \ 的方法内部创建并发布，该方法需要在 `MainActivity` 类中实现，该类的代码位于 `MainActivity.java` 源文件中。在 Project\
  \ 工具窗口中找到该文件，并双击它将其加载到编辑窗中。加载后，修改代码以添加 `showWebPage()` 和 `enableLink()` 方法，以及若干个必要的导入（import）\
  \ 语句：\n\n```java\npackage com.ebookfrenzy.implicitintent;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  \nimport android.os.Bundle;\n\nimport android.net.Uri;\n\nimport android.content.Intent;\n\
  \nimport android.view.View;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n \
  \       super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_implicit_intent);\n\
  \    }\n\n    public void showWebPage(View view) {\n        Intent intent = new\
  \ Intent(Intent.ACTION_VIEW,\n                    Uri.parse(\"https://www.ebookfrenzy.com\"\
  ));\n        startActivity(intent);\n    }\n\n    public void enableLink(View view)\
  \ {\n    }\n}\n```\n\n`showWebPage()` 方法执行的任务实际上非常简单。首先，创建一个新的意图对象。然而，代码并没有指定意图的类名，而是简单地使用\
  \ `ACTION_VIEW` 选项来说明意图的性质（向用户显示某些内容）。意图对象还包含一个包含要显示的 URL 的 `URI`。这告诉 Android 意图解析系统，该\
  \ Activity 正在请求显示网页。然后通过调用 `startActivity()` 方法发布意图。\n\n在模拟器或物理 Android 设备上编译并运行应用程序，运行后，点击“Show\
  \ Web Page”（显示网页）按钮。点击后，应该出现一个网页浏览器视图并加载 URL 指定的网页。此时，一个成功的隐式意图已经执行完毕。\n\n### 55.4\
  \ 添加第二个匹配的 Activity\n\n本章的剩余部分将用于演示：当设备上安装了多个符合隐式意图要求的 Activity 时，会产生什么。为了实现这一点，将在设备或模拟器上创建并安装第二个应用程序。首先在\
  \ Android Studio 中创建一个新项目，将应用程序名称设置为 `MyWebView`，使用与在本章早期创建 ImplicitIntent 项目时相同的\
  \ SDK 配置选项，并再次选择 Empty Activity（空 Activity）。\n\n如果你有一个网站可以托管数字资产链接（Digital Asset\
  \ Links）文件，并想尝试自动验证功能，请在指定包名时使用你的网站 URL。例如，如果你的网站托管在 `www.mycompany.com`，则包名需要设置为如下：\n\
  \n`com.mycompany.mywebview`\n\n如果你没有网站或不计划使用自动验证，请使用以下包名：\n\n`com.ebookfrenzy.mywebview`\n\
  \n点击 Finish（完成）创建项目，然后按照章节 11.8 Migrating a Project to View Binding 中所述将项目转换为使用\
  \ view bindings。\n\n## 55.5 将 WebView 添加到 UI\n\n新 `MyWebView` 项目包含的唯一 Activity 的用户界面将由一个\
  \ Android `WebView` 组件实例组成。在 Project 工具窗口中，找到 `activity_main.xml` 文件，该文件包含 Activity\
  \ 的用户界面描述，双击它将其加载到布局编辑器（Layout Editor）工具中。\n\n在设计模式（Design mode）下的布局编辑器工具中，选择默认的\
  \ `TextView` 组件，并使用键盘删除键将其从布局中移除。\n\n从调色板（palette）的 Widgets 部分将 `WebView` 对象拖放到现有的\
  \ `ConstraintLayout` 视图上，如图图 55-2\n\n图 55-2\n\n在继续之前，将 `WebView` 实例 ID 更改为 `webView1`，并使用\
  \ Infer constraints（推约束）按钮添加任何缺失的约束。\n\n## 55.6 获取意图 URL\n\n当创建用于显示浏览器窗口的隐式意图对象时，显示的网页\
  \ URL 将封装在意图对象的 `Uri` 对象中。`MainActivity` 类中 `onCreate()` 方法的任务是从意图对象中提取此 `Uri`，将其转换为\
  \ URL 字符串并赋值给 `WebView` 对象。为了实现此功能，修改 `MainActivity.java` 文件，使其内容如下：\n\n```java\n\
  package com.ebookfrenzy.mywebview;\n\n.\n.\n\nimport java.net.URL;\nimport android.net.Uri;\n\
  import android.content.Intent;\nimport android.webkit.WebView;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private ActivityMainBinding binding;\n\n    @Override\n\
  \    protected void onCreate(Bundle savedInstanceState) {\n.\n.\n        handleIntent();\n\
  \    }\n\n    private void handleIntent() {\n        Intent intent = getIntent();\n\
  \        Uri data = intent.getData();\n        URL url = null;\n        try {\n\
  \            url = new URL(data.getScheme(), data.getHost(), data.getPath());\n\
  \        } catch (Exception e) {\n            e.printStackTrace();\n        }\n\
  \        binding.webView1.loadUrl(url.toString());\n    }\n}\n```\n\n添加到 `onCreate()`\
  \ 中的新代码执行了以下任务：\n- 获取导致此 Activity 启动的意图引用\n- 从意图中提取 `Uri` 数据\n- 将 `Uri` 数据转换为 `URL`\
  \ 对象\n- 将 `URL` 加载到视图中，并转换为 `String`\n\n`MyWebView` 项目的代码部分已完成。剩下的就是修改清单（manifest）。\n\
  \n## 55.7 修改 MyWebView 项目清单\n\n在测试之前，必须对 MyWebView 清单文件进行若干更改。首先，该 Activity 需要访问互联网的权限（因为它需要加载网页）。这是通过在清单文件中添加适当的权限行来实现的：\n\
  \n`<uses-permission android:name=\"android.permission.INTERNET\" />`\n\n此外，检查 MyWebView\
  \ 项目 `AndroidManifest.xml` 文件意图过滤器（intent filter）部分的内容将发现如下设置：\n\n```xml\n<intent-filter>\n\
  \    <action android:name=\"android.intent.action.MAIN\" />\n    <category android:name=\"\
  android.intent.category.LAUNCHER\" />\n</intent-filter>\n```\n\n在上述 XML 中，`android.intent.action.MAIN`\
  \ 表示该 Activity 是应用程序在无数据输入时启动的入口。另一方面，`android.intent.category.LAUNCHER` 指令表示该 Activity\
  \ 应出现在设备的启动屏幕上。\n\n由于该 Activity 无法在没有数据输入（在此例中为 URL）的情况下运行，也不出现在启动器中，因此在清单文件中不需要\
  \ `MAIN` 或 `LAUNCHER` 指令。\n\n然而，`MainActivity` Activity 的意图过滤器确实需要修改，以指示它能够处理 `http`\
  \ 数据方案的 `ACTION_VIEW` 意图操作。\n\nAndroid 要求任何能够处理隐式意图且不包含 `MAIN` 和 `LAUNCHER` 条目的\
  \ Activity，还必须在意图过滤器中包含所谓的可浏览（browsable）和默认类别。因此，修改后的意图过滤器部分应如下，其中 `<website url>`\
  \ 替换为你的网站地址或 `www.ebookfrenzy.com`，取决于你创建 `MyWebView` 项目时使用的包名：\n\n```xml\n<intent-filter\
  \ android:autoVerify=\"true\">\n    <action android:name=\"android.intent.action.VIEW\"\
  \ />\n    <category android:name=\"android.intent.category.BROWSABLE\" />\n</intent-filter>\n\
  ```\n\n\n\n\n\n```xml\n<category android:name=\"android.intent.category.DEFAULT\"\
  \ />\n\n<data android:scheme=\"https\" />\n\n<data android:host=\"<website url>\"\
  />\n</intent-filter>\n```\n\n将这些要求整合后得到完整的 `AndroidManifest.xml` 文件：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.mywebview\">\n    <uses-permission android:name=\"\
  android.permission.INTERNET\" />\n    <application\n        android:allowBackup=\"\
  true\"\n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\
  \n        android:roundIcon=\"@mipmap/ic_launcher_round\"\n        android:supportsRtl=\"\
  true\"\n        android:theme=\"@style/Theme.MyWebView\">\n        <activity\n \
  \           android:name=\".MainActivity\"\n            android:exported=\"true\"\
  >\n            <intent-filter android:autoVerify=\"true\">\n                <action\
  \ android:name=\"android.intent.action.VIEW\" />\n                <category android:name=\"\
  android.intent.category.BROWSABLE\" />\n                <category android:name=\"\
  android.intent.category.DEFAULT\" />\n                <data android:scheme=\"https\"\
  \ />\n                <data android:host=\"<website url>\"/>\n            </intent-filter>\n\
  \        </activity>\n    </application>\n</manifest>\n```\n\n在 Project 工具窗口中双击文件名，将\
  \ `AndroidManifest.xml` 文件加载到清单编辑器。加载后，修改 XML 以匹配上述更改，记得输入正确的网站 URL。\n\n对 manifest\
  \ 文件进行适当修改后，新的 activity 已准备好安装到设备上。\n\n### 55.8 在设备上安装 MyWebView 包\n\n在 MyWebView\
  \ 主 activity 作为隐式 intent 的接收者之前，必须先将其安装到设备上。这通过正常方式运行应用程序来实现。由于 manifest 文件既不包含\
  \ `android.intent.action.MAIN` 也不包含 `android.intent.category.LAUNCHER` 设置，需要指示 Android\
  \ Studio 只安装而不启动应用。要配置此行为，请从工具栏中选择 `app` -> `Edit configurations…` 菜单，如图 图 55-3\
  \ 所示：\n\n![](img/as_implicit_intent_run_edit_config.jpg)\n\n图 55-3\n\n在 `Run/Debug\
  \ Configurations` 对框中，将位于面板 `Launch Options` 区域的 `Launch` 选项改为 `Nothing`，然后点击 `Apply`\
  \ 最后点击 `OK`：\n\n![](img/as_3.5_implicit_intent_launch_nothing.jpg)\n\n图 55-4\n\n\
  配置好此设置后，按通常方式运行应用。注意应用已安装到设备上，但尚未启动。\n\n### 55.9 测试应用程序\n\n安装 MyWebView 应用后，再次运行\
  \ ImplicitIntent 并点击“Show Web Page”按钮。注意，网页仍然加载到 `Chrome` 浏览器中，而不是 MyWebView 应用的主\
  \ activity。这是因为 MyWebView activity 尚未验证或启用打开启动 intent 中包含的链接。要手动启用该链接，需要在 `enableLink()`\
  \ 方法中添加一些代码。\n\n## 55.10 手动启用链接\n\n在 `enableLink()` 方法中，我们现在需要创建并启动一个 intent，以显示\
  \ MyWebView 应用的“默认打开”设置屏幕。将 `MainActivity.java` 文件加载到代码编辑器并修改 `enableLink()` 方法，使其内容如下，确保将\
  \ `<reverse domain>` 替换为 `com.ebookfrenzy` 或您自己的反向域名，取决于您在创建 MyWebView 项目时选择的包名：\n\
  \n```java\nimport android.provider.Settings;\n\npublic void enableLink(View view)\
  \ {\n    Intent intent = new Intent(Settings.ACTION_OPEN_BY_DEFAULT,\n         \
  \   Uri.parse(\"https://<reverse domain>\"));\n    intent.addCategory(Intent.CATEGORY_BROWSABLE);\n\
  \    intent.setPackage(getPackageName());\n    startActivity(intent);\n}\n```\n\n\
  \n\n\n\n# 广播意图 (Broadcast Intents)\n\n广播意图是 `Intent` 对象，通过调用 `Activity` 类的 `sendBroadcast()`、`sendStickyBroadcast()`\
  \ 或 `sendOrderedBroadcast()` 方法发送（后者用于需要获取广播结果的情况）。广播意图除了在应用程序组件之间提供了消息和事件系统外，还被\
  \ Android 系统用于通知感兴趣的应用程序以通报关键系统事件（例如外部电源或耳机的插入或断开连接）。\n\n在创建广播意图时，除了可选的数据和类别字符串（category\
  \ string）外，必须包含一个动作字符串（action string）。与标准意图一样，数据是结合 `intent` 对象的 `putExtra()` 方法使用键值对添加到广播意图中的。可选的类别字符串可以通过调用\
  \ `addCategory()` 方法分配给广播意图。\n\n用于标识广播事件的动作字符串必须是唯一的，并且通常使用应用程序的包名语法。例如，以下代码段创建并发送了一个包含唯一动作字符串和数据的广播意图：\n\
  \n```\nIntent intent = new Intent();\nintent.setAction(\"com.example.Broadcast\"\
  );\nintent.putExtra(\"MyData\", 1000);\nsendBroadcast(intent);\n```\n\n上述代码将在运行\
  \ Android 3.0 之前的版本的设备上成功启动相应的广播接收器。然而，在较新的 Android 版本上，该意图将不会被广播接收器接收。这是因为 Android\
  \ 3.0 引入了一种启动控制安全措施，防止停止状态的应用程序组件通过意图启动。如果应用程序刚刚安装且之前没有启动过，或者被用户使用设备上的应用程序管理器手动停止，则该应用程序被认为处于停止状态。然而，为了绕过这一点，可以在发送意图之前向意图添加一个标记，以指示允许意图启动已停止应用程序的组件。该标记是\
  \ `FLAG_INCLUDE_STOPPED_PACKAGES`，并将按照下述之前代码片段的适配方式使用：\n\n```\nIntent intent = new\
  \ Intent();\nintent.addFlags(Intent.FLAG_INCLUDE_STOPPED_PACKAGES);\nintent.setAction(\"\
  com.example.Broadcast\");\nintent.putExtra(\"MyData\", 1000);\nsendBroadcast(intent);\n\
  ```\n\n## 56.2 广播接收器概述 (An Overview of Broadcast Receivers)\n\n应用程序通过注册广播接收器来监听特定的广播意图。广播接收器通过扩展\
  \ `Android BroadcastReceiver` 类并重写 `onReceive()` 方法来实现。广播接收器可以注册在代码中（例如在活动内部），也可以注册在清单（manifest）文件中。注册实现的一部分涉及创建意图过滤器（intent\
  \ filters），以指示接收器需要监听的特定广播意图。这是通过引用广播意图的动作字符串来实现的。检测到匹配的广播时，会调用广播接收器的 `onReceive()`\
  \ 方法，此时该方法有 5 秒钟的时间来执行任何必要的任务然后返回。需要注意的是，广播接收器不需要一直运行。如果检测到匹配的意图，Android 运行时系统将在调用\
  \ `onReceive()` 方法之前自动启动该广播接收器。\n\n以下代码概述了一个模板形式的广播接收器子类：\n\n```\npackage com.example.broadcastdetector;\n\
  \nimport android.content.BroadcastReceiver;\nimport android.content.Context;\nimport\
  \ android.content.Intent;\n\npublic class MyReceiver extends BroadcastReceiver {\n\
  \    public MyReceiver() {\n    }\n\n    @Override\n    public void onReceive(Context\
  \ context, Intent intent) {\n        //在此处实现代码，以便在\n        // 检测到广播时执行\n    }\n\
  }\n```\n\n在清单文件中注册广播接收器时，必须为接收器添加一个 `<receiver>` 条目。以下示例清单文件注册了上述示例广播接收器：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.example.broadcastdetector.broadcastdetector\"\n    android:versionCode=\"\
  1\"\n    android:versionName=\"1.0\" >\n    <uses-sdk android:minSdkVersion=\"17\"\
  \ />\n    <application\n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"\
  @string/app_name\" >\n        <receiver android:name=\"MyReceiver\" >\n        </receiver>\n\
  \    </application>\n</manifest>\n```\n\n在 Android 8.0 之前的版本上运行时，与接收器关联的意图过滤器可以放置在清单文件的接收器元素中，如下所示：\n\
  \n```xml\n<receiver android:name=\"MyReceiver\" >\n    <intent-filter>\n       \
  \ <action android:name=\"com.example.Broadcast\" >\n    </intent-filter>\n</receiver>\n\
  ```\n\n在 Android 8.0 或更高版本上，必须在代码中使用 `registerReceiver()` 方法结合适当配置的 `IntentFilter`\
  \ 来注册接收器：\n\n```\nIntentFilter filter = new IntentFilter(\"com.example.Broadcast\"\
  );\nMyReceiver receiver = new MyReceiver();\nregisterReceiver(receiver, filter);\n\
  ```\n\n当代码中注册的广播接收器不再需要时，可以通过调用  的 `unregisterReceiver()` 方法来取消注册。例如，以下代码将取消注册上述接收器：\n\
  \n```\nunregisterReceiver(receiver);\n```\n\n需要注意的是，某些系统广播意图只有在在代码中注册而非清单文件中注册时才能被广播接收器检测到。可以在此处查看\
  \ Android `Intent` 类关于系统广播意图的详细概述：[`developer.android.com/reference/android/content/Intent`](https://developer.android.com/reference/android/content/Intent)\n\
  \n## 56.3 从广播获取结果 (Obtaining Results from a Broadcast)\n\n当使用 `sendBroadcast()`\
  \ 方法发送广播意图时，发起活动无法从获取广播的广播接收器获取结果。如果需要返回结果，则必须使用 `sendOrderedBroadcast()` 方法。当使用此方法发送广播意图时，意图将按顺序传递给感兴趣的广播接收器。\n\
  \n调用 `sendOrderedBroadcast()` 时带有多个参数，包括另一个广播接收器（称为结果接收器），在所有其他广播接收器处理意图后通知它，以及一组供这些接收器放置结果数据的引用。当所有广播接收器都获得了处理广播的机会，将调用结果接收器的\
  \ `onReceive()` 方法并传递结果数据。\n\n## 56.4 粘性广播意图 (Sticky Broadcast Intents)\n\n默认情况下，广播意图在发送并被感兴趣的广播接收器处理后就会消失。然而，广播意图可以定义为“粘性”。意及其包含的数据在完成后仍然存在于系统中。粘性广播意图中存储的数据可以通过\
  \ `registerReceiver()` 方法的返回值获取，使用通常的参数（接收器和意图过滤器对象的引用）。许多 Android 系统广播都是粘性的，一个典型的例子是与电量状态有关的广播。\n\
  \n可以随时通过 `removeStickyBroadcast()` 方法移除粘性广播，并作为参数传递要移除的广播意图引用。\n\n## 56.5 广播意图示例\
  \ (The Broadcast Intent Example)\n\n\n\n\n本章的剩余部分将通过一个基于 Android Studio 的示例来演示广播意（broadcast\
  \ intents）的作用。首先，将创建一个简单的应用程序用于发送自定义广播意。随后将创建一个相应的广播接收器（broadcast receiver），在检测到广播时会在\
  \ Android 设备的屏幕上显示消息。最后，将修改广播接收器以检测系统发出的外部电源已从设备断开通知。\n\n### 56.6 创建示例应用程序\n\n从欢迎界面选择\
  \ `New Project`选项，在弹出的新项目对话框中，在点击 `Next`（下一步）按钮之前选择 `Empty Activity` 模板。\n\n在 `Name`\
  \ 字段中输入 `SendBroadcast`，并指定 `com.ebookfrenzy.sendbroadcast` 为包名。在点击 `Finish` 按钮之前，将\
  \ `Minimum API level` 设置更改为 `API 26: Android 8.0 (Oreo)`，并将 `Language` 菜单设置为 `Java`。\n\
  \n新项目创建完成后，在 Project 工具窗口的 `app -> res -> layout` 下找到并加载 `activity_main.xml` 布局文件。在\
  \ `Design` 模式下使用 `Layout Editor` 工具，将 `TextView` 对象替换为 `Button` 视图，并设置 `text` 属性显示为“Send\
  \ Broadcast”。一旦设置了文本值，按照通常步骤将字符串提取为名为 `send_broadcast` 的资源。\n\n在布局中仍选中按钮的情况下，在 `Attributes`\
  \ 面板中找到 `onClick` 属性，并配置其调用名为 `broadcastIntent` 的方法。\n\n## 56.7 创建并发送广播意\n\n在创建了\
  \ `SendBroadcast` 应用程序框架后，现在是实现发送广播意代码了。这涉及到实现之前指定的、作为用户界面 `Button` 视图的 `onClick`\
  \ 目标的 `broadcastIntent()` 方法。找到并双击 `MainActivity.java` 文件，并修改它以添加创建和发送广播意的代码。修改后，该类的源代码应如下：\n\
  \n```java\npackage com.ebookfrenzy.sendbroadcast;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  \nimport android.os.Bundle;\n\nimport android.content.Intent;\n\nimport android.view.View;\n\
  \npublic class MainActivity extends AppCompatActivity {\n\n.\n\n.\n\n    public\
  \ void broadcastIntent(View view)\n    {\n        Intent intent = new Intent();\n\
  \        intent.setAction(\"com.ebookfrenzy.sendbroadcast\");\n        intent.addFlags(Intent.FLAG_INCLUDE_STOPPED_PACKAGES);\n\
  \        sendBroadcast(intent);\n    }\n}\n```\n\n注意，在此实例中，意 的 action 字符串为 `com.ebookfrenzy.sendbroadcast`。在本章后续章节创建广播接收器类时，意图过滤器（intent\
  \ filter）声明必须匹配此 action 字符串。\n\n发送广播意的应用程序创建完成。剩下的只是构建一个匹配的广播接收器。\n\n### 56.8 创建广播接收器\n\
  \n要创建广播接收器，需要创建一个子自 `BroadcastReceiver` 超类的类。在 Project 工具窗口中，导航到 `app -> java` 并右键点击包名。从弹出的菜单中选择\
  \ `New -> Other -> Broadcast Receiver` ，将类命名为 `MyReceiver`，并确保 `Exported` 和 `Enabled`\
  \ 选项已选中。这些设置允许 Android 系统在需要时启动接收器，并确保该类可以接收设备上其他应用程序发送的消息。配置好类后，点击 `Finish`。\n\n\
  创建后，Android Studio 将自动将新的 `MyReceiver.java` 类文件加载到编辑器中，其内容如下：\n\n```java\npackage\
  \ com.ebookfrenzy.sendbroadcast;\n\nimport android.content.BroadcastReceiver;\n\n\
  import android.content.Context;\n\nimport android.content.Intent;\n\npublic class\
  \ MyReceiver extends BroadcastReceiver {\n\n    @Override\n    public void onReceive(Context\
  \ context, Intent intent) {\n        // TODO: This method is called when the BroadcastReceiver\
  \ is receiving\n        // an Intent broadcast.\n        throw new UnsupportedOperationException(\"\
  Not yet implemented\");\n    }\n}\n```\n\n从代码所示，Android Studio 为新类生成了一个模板，并为 `onReceive()`\
  \ 方法生成了一个存根。现在需要对类进行一些更改以实现所需的行为。因此，在 `MyReceiver.java` 文件中，修改代码使其如下：\n\n```java\n\
  package com.ebookfrenzy.sendbroadcast;\n\nimport android.content.BroadcastReceiver;\n\
  \nimport android.content.Context;\nimport android.content.Intent;\n\nimport android.widget.Toast;\n\
  \npublic class MyReceiver extends BroadcastReceiver {\n\n    @Override\n    public\
  \ void onReceive(Context context, Intent intent) {\n        // TODO: This method\
  \ is called when the BroadcastReceiver is receiving\n        // an Intent broadcast.\n\
  \        throw new UnsupportedOperationException(\"Not yet implemented\");\n   \
  \     Toast.makeText(context, \"Broadcast Detected.\", Toast.LENGTH_LONG).show();\n\
  \    }\n}\n```\n（注：原文在 Toast 调用处有一处轻微的语法错误，已为了可读性进行了清理，同时保持了内容）。\n\n广播接收器的代码现在已完成。\n\
  \n### 56.9 注册广播接收器\n\n项目需要公布广播接收器的存在，并包含一个意图过滤器来指定它感兴趣的广播意。在上一节创建 `BroadcastReceiver`\
  \ 类时，Android Studio 自动向清单文件添加了 `<receiver>` 元素。因此，剩下的工作是在 `MainActivity.java` 文件中添加代码以创建一个意图过滤器并注册接收器：\n\
  \n```java\npackage com.ebookfrenzy.sendbroadcast;\n\n.\n\n.\n\nimport android.content.BroadcastReceiver;\n\
  import android.content.IntentFilter;\n\n.\n\n.\n\npublic class MainActivity extends\
  \ AppCompatActivity {\n    BroadcastReceiver receiver;\n\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.activity_main);\n        configureReceiver();\n\
  \    }\n\n    private void configureReceiver() {\n        IntentFilter filter =\
  \ new IntentFilter();\n        filter.addAction(\"com.ebookfrenzy.sendbroadcast\"\
  );\n        receiver = new MyReceiver();\n        registerReceiver(receiver, filter);\n\
  \    }\n\n.\n}\n```\n\n在不再需要时注销广播接收器也是重要的：\n\n```java\n@Override\nprotected void\
  \ onDestroy() {\n    super.onDestroy();\n    unregisterReceiver(receiver);\n}\n\
  ```\n\n### 56.10 测试广播示例\n\n要测试广播发送和接收接收，在设备或 AVD 上运行 `SendBroadcast` 应用并等待其显示在屏幕上。运行时，触摸按钮，此时显示“Broadcast\
  \ Detected.”的 toast 信息将弹出几秒后消失。\n\n### 56.11 监听系统广播\n\n示例的最后一个阶段是修改广播接收器的意图过滤器，以也监听外部电源从设备断开时发出的系统意。该\
  \ action 是 `android.intent.action.ACTION_POWER_DISCONNECTED`。修改 `MainActivity.java`\
  \ 文件中的 `configureReceiver()` 方法以添加此额外的过滤器：\n\n```java\nprivate void configureReceiver()\
  \ {\n    IntentFilter filter = new IntentFilter();\n    filter.addAction(\"com.ebookfrenzy.sendbroadcast\"\
  );\n    filter.addAction(\"android.intent.action.ACTION_POWER_DISCONNECTED\");\n\
  \    receiver = new MyReceiver();\n    registerReceiver(receiver, filter);\n}\n\
  ```\n\n由于 `MyReceiver.java` 文件中的 `onReceive()` 方法现在将监听两种类型的广播意，值得修改代码以便将当前意的 action\
  \ 字符串也显示在 toast 信息中。该字符串可以通过调用作为 `onReceive()` 方法参数传递的 `intent` 对象的 `getAction()`\
  \ 方法获取。\n\n\n\n\n\n```java\npublic void onReceive(Context context, Intent intent)\
  \ {\n    String message = \"Broadcast intent detected \"\n                    +\
  \ intent.getAction();\n    Toast.makeText(context, message,\n            Toast.LENGTH_LONG).show();\n\
  }\n```\n\n通过重新安装修改后的 `SendBroadcast` 包来测试接收器。在 `SendBroadcast` 应用程序中点击按钮，现在应该产生一个包含自定义动作字符串的新消息：\n\
  \n`Broadcast intent detected com.ebookfrenzy.sendbroadcast`\n\n接下来，移除当前为 Android\
  \ 设备提供供电的 USB 连接器，此时接收器应该在 toast 消息中报告以下内容（在竖屏显示模式的设备上，该消息可能会被截断）。如果应用运行在模拟器上，请显示扩展控制面板，选择\
  \ `Battery` 选项并将 `Charger` 连接设置为 `None`。\n\n`Broadcast intent detected android.intent.action.ACTION_POWER_DISCONNECTED`\n\
  \n为了避免在设备每次断开电源连接时都出现此消息，请在设备上启动 `Settings` 应用并选择 `Apps` 选项。从结果列表中选择 `SendBroadcast`\
  \ 应用，并点击 `Uninstall` 按钮。\n\n### 56.12 总结\n\n广播意（Broadcast intents）是一种机制，允许发布一个意以供\
  \ Android 系统上的多个组件消费。广播通过注册 `Broadcast Receiver`（广播接收器）来检测，接收器随后被配置为监听匹配特定动作字符串的意。通常情况下，广播接收器保持休眠状态，直到系统检测到匹配的意时将其唤醒。Android\
  \ 系统也使用广播意发布事件通知，例如低电量警告或外部电源与设备的连接或断开。\n\n本章在提供了广播意和接收器的概述外，还通过了一个发送广播意的示例，以及用于监听自定义广播意和系统广播意的广播接收器实现。\n\
  \n## 57. Android 本地绑定服务 – 实例示例\n\n如上一章所述，绑定服务（Bound services）为实现 Android 服务与一个或多个客户端组件之间的通信提供了机制。本章的目标是在基于\
  \ “An Overview of Android Services” 中提供的绑定服务概述的基础上，开始对本地绑定服务的进行实例实现。\n\n### 57.1\
  \ 理解绑定服务\n\n提供绑定服务是为了允许应用程序在后台执行任务。多个客户端组件可以绑定到一个绑定服务，一旦绑定，它们就可以可以使用不同的机制与该服务进行交互。\n\
  \n绑定服务是作为 `Android Service` 类的子类创建的，并且至少必须实现 `onBind()` 方法。客户端组件通过调用 `bindService()`\
  \ 方法绑定到服务。对绑定服务的首次绑定请求将导致该服务的 `onBind()` 方法（随后的绑定请求不会触发 `onBind()` 调用）。想要绑定到服务的客户端还必须实现一个\
  \ `ServiceConnection` 子类，该子类包含 `onServiceConnected()` 和 `onServiceDisconnected()`\
  \ 方法，这些方法分别会在客户端-服务器连接建立或断开后被调用。在 `onServiceConnected()` 方法中，将会传递一个 `IBinder` 对象，该对象包含了客户端与服务交互所需的所有信息。\n\
  \n### 57.2 绑定服务交互选项\n\n实现客户端组件与绑定服务之间交互的，有两种推荐的机制。如果绑定服务是本地的，且与客户端组件属于同一个应用程序（换句话说，它在同一个进程中运行，并且对其他应用程序中的组件不可用），推荐的方法是创建一个\
  \ `Binder` 类的子类并扩展它以为服务提供接口。随后，`onBind()` 方法将返回此 `Binder` 对象的实例，客户端组件随后使用该实例直接访问服务中持有的方法和数据。\n\
  \n在绑定服务不是本地的情况下（换句话说，它运行在与客户端组件不同的进程中），交互的最佳方式是使用 `Messenger/Handler` 实现。\n\n在本章的剩余部分中，将创建一个示例，旨在演示创建、启动和与本地私有绑定服务交互的涉及步骤。\n\
  \n### 57.3 本地绑定服务示例\n\n在本章剩余部分创建的示例应用程序将由单个 activity 和绑定服务组成。绑定服务的目的是从系统获取当前时间，并将该信息返回给\
  \ activity，由其显示给用户。绑定服务将是本地的，且与 activity 属于同一个应用程序。\n\n从欢迎界面选择 `New Project` 选项，在结果的新项目对话框中，选择\
  \ `Empty Activity` 模板，然后点击 `Next` 按钮。\n\n在 `Name` 字段中输入 `LocalBound` 并指定 `com.ebookfrenzy.localbound`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API` 级设置更改为 `API 26: Android 8.0 (Oreo)`，并将 `Language`\
  \ 菜单更改为 `Java`。使用章节 11.8 Migrating a Project to View Binding 中的步骤将项目迁移到 view binding。\n\
  \n一旦项目创建完成，下一步是添加一个新类作为绑定服务。\n\n### 57.4 向项目添加绑定服务\n\n要向项目添加新类，请在 Project 工具窗口中右键点击包名（位于\
  \ `app -> java -> com.ebookfrenzy.localbound` 下方），并选择 `New -> Service -> Service`\
  \ 菜单选项。指定 `BoundService` 为类名，并在点击 `Finish` 创建类之前，确保 `Exported` 和 `Enabled` 选项均已被选中。Android\
  \ Studio 将将 `BoundService.java` 文件加载到编辑器中，其读取内容如下：\n\n```java\npackage com.ebookfrenzy.localbound;\n\
  \nimport android.app.Service;\n\nimport android.content.Intent;\n\nimport android.os.IBinder;\n\
  \npublic class BoundService extends Service {\n\n    public BoundService() {\n\n\
  \    }\n\n    @Override\n    public IBinder onBind(Intent intent) {\n        //\
  \ TODO: Return the communication channel to the service.\n        throw new UnsupportedException(\"\
  Not yet implemented\");\n    }\n}\n```\n\n### 57.5 实现 Binder\n\n如前所述，本地绑定服务通过向客户端传递一个配置好的\
  \ `Binder` 对象来与其通信。这通过在绑定服务类内部创建一个 `Binder` 子类并通过扩展添加一个或多个供客户端调用的新方法来实现。在大多数情况下，这只需实现一个返回绑定服务实例引用的方法。有了该实例引用，客户端就可以直接访问服务内部的数据并调用方法。\n\
  \n因此，为了本示例，需要对上一节创建的模板 `BoundService` 类进行一些更改。首先，需要声明一个 `Binder` 子类。该类将包含一个名为 `getService()`\
  \ 的方法，该方法将简单返回当前服务对象的引用（由 `this` 关键字表示）。根据这些要求，编辑 `BoundService.java` 文件并将其修改如下：\n\
  \n```java\npackage com.ebookfrenzy.localbound;\n\nimport android.app.Service;\n\n\
  import android.content.Intent;\n\nimport android.os.IBinder;\n\nimport android.os.Binder;\n\
  \npublic class BoundService extends Service {\n\n    private final IBinder myBinder\
  \ = new MyLocalBinder();\n\n    public BoundService() {\n\n    }\n\n    @Override\n\
  \    public IBinder onBind(Intent intent) {\n```\n\n\n\n\n```java\n// TODO: Return\
