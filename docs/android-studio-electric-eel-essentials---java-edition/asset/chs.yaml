  \ 和 `local.properties` 文件中的 API 密钥与 Google Cloud 控制台中生成的密钥匹配。\n*   在 Google API\
  \ 控制台中验证 `Credentials` 面板中是否已启用 `Maps SDK for Android`。\n\n## 74.10 理解地理编码和反向地理编码\n\
  \n如果不预先讲解地理编码（Geocoding）主题，就无法讨论地图和地理位置。地理编码最好的描述是：将基于文本的地理位置（如街道地址）转换为以经纬度表示的地理坐标的过程。\n\
  \n可以使用 Android 的 `Geocoder` 类来实现地理编码。例如，可以向 `Geocoder` 实例传递代表位置的字符串，如城市名、街道地址或机场代码。`Geocoder`\
  \ 将尝试查找该位置的匹配项，并返回一个可能与位置字符串匹配的 `Address` 对象列表，这些对象按顺序排序，最匹配的位于列表的第 0 位。随后可以从 `Address`\
  \ 对象中提取各种信息，包括潜在匹配项的经纬度。\n\n例如，以下代码请求位于华盛顿特区的国家航空太空博物馆的位置：\n\n```java\nimport java.io.IOException;\n\
  import java.util.List;\nimport android.location.Address;\nimport android.location.Geocoder;\n\
  \n.\n.\n\ndouble latitude;\ndouble longitude;\nList<Address> geocodeMatches = null;\n\
  \ntry {\n    geocodeMatches =\n        new Geocoder(this).getFromLocationName(\n\
  \            \"600 Independence Ave SW, Washington, DC 20560\", 1);\n} catch (IOException\
  \ e) {\n    // TODO Auto-generated catch block\n    e.printStackTrace();\n}\n\n\
  if (!geocodeMatches.isEmpty())\n{\n    latitude = geocodeMatches.get(0).getLatitude();\n\
  \    longitude = geocodeMatches.get(0).getLongitude();\n}\n```\n\n注意，值 `1` 作为第二个参数传递给\
  \ `getFromLocationName()` 方法的。这只是告诉 `Geocoder` 在数组中返回一个结果。考虑到提供的地址具有特定性，应该只有一个潜在匹配项。然而，对于更模糊的位置名称，可能需要请求更多的匹配项并允许用户选择正确的那个。\n\
  \n上述代码是正向地理编码（forward-geocoding）的示例，坐标是基于文本位置描述计算的。反向地理编码（Reverse-geocoding）顾其实名，涉及将地理坐标转换为人类可读的地址字符串。考虑以下代码：\n\
  \n```java\nimport java.io.IOException;\nimport java.util.List;\nimport android.location.Address;\n\
  import android.location.Geocoder;\n\n.\n.\n\nList<Address> geocodeMatches = null;\n\
  String Address1;\nString Address2;\nString State;\nString Zipcode;\nString Country;\n\
  \ntry {\n    geocodeMatches =\n        new Geocoder(this).getFromLocation(38.8874245,\
  \ -77.0200729, 1);\n} catch (IOException e) {\n    // TODO Auto-generated catch\
  \ block\n    e.printStackTrace();\n}\n\nif (!geocodeMatches.isEmpty())\n{\n    Address1\
  \ = geocodeMatches.get(0).getAddressLine(0);\n    Address2 = geocodeMatches.get(0).getAddressLine(1);\n\
  \    State = geocodeMatches.get(0).getAdminArea();\n    Zipcode = geocodeMatches.get(0).getPostalCode();\n\
  \    Country = geocodeMatches.get(0).getCountryName();\n}\n```\n\n在这种情况下，`Geocoder`\
  \ 对象通过 `getFromLocation()` 方法使用经纬度值初始化。同样，只请求了单个匹配结果。然后从 `Address` 对象中提取基于文本的地址信息。需要注意的是，地理编码实际上并不是在设备上执行的，而是在翻译需要设备连接的服务器上执行。\n\
  \n## 74.1 向应用程序添加地图\n\n向应用程序添加地图最简单的方法是在用户界面布局文件中指定它。以下示例布局显示了添加到 `activity_maps.xml`\
  \ 中的 `SupportMapFragment` 实例：\n\n```xml\n<fragment xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    android:layout_width=\"\
  match_parent\"\n    android:layout_height=\"match_parent\"\n    android:id=\"@+id/map\"\
  \n    tools:context=\".MapsActivity\"\n    android:name=\"com.google.gms.maps.SupportFragment\"\
  />\n```\n\n## 74.12 请求当前位置\n\n正如“运行时请求”章节中所述，某些权限被认为是危险的，对于 Android 6.0 或更高版本，需要特殊处理。一组权限允许应用程序识别用户的当前位置。编辑项目窗口中\
  \ `app` -> `manifests` 下的 `AndroidManifest.xml` 文件，并添加以下权限行：\n\n```xml\n<uses-permission\
  \ android:name=\"android.permission.FINE_LOCATION\" />\n<uses-permission android:name=\"\
  android.permission.ACCESS_COARSE_LOCATION\" />\n```\n\n这些设置将确保应用在安装在旧版本的 Android\
  \ 上时提供位置信息。然而，为了支持 Android 6.0 或更高版本，我们需要在 `MapsActivity.java` 文件中添加一些代码以在运行时请求此权限。首先添加一些导入语句和一个作为权限代码的常量：\n\
  \n```java\npackage com.ebookrenzy.mapdemo;\n\n.\n.\n\nimport androidx.annotation.NonNull;\n\
  import androidx.core.content.ContextCompat;\nimport androidx.core.app.ActivityCompat;\n\
  import android.Manifest;\nimport android.widget.Toast;\nimport android.content.pm.PackageManager;\n\
  \n.\n.\n\npublic class MapsActivity extends FragmentActivity implements OnReadyCallback\
  \ {\n    private static final int LOCATION_REQUEST_CODE = 101;\n    private GoogleMap\
  \ mMap;\n.\n.\n}\n```\n\n接下来，需要向类中添加一个方法向用户请求指定的权限。在 `MapsActivity.java` 类文件中，按如下实现该方法：\n\
  \n```java\nprotected void requestPermission(String permissionType, int requestCode)\
  \ {\n    ActivityCompat.requestPermissions(this, new String[]{permissionType}, requestCode);\n\
  }\n```\n\n当用户对权限请求做出响应时，将在活动调用 `onRequestPermissionsResult()` 方法。在 `MapsActivity.java`\
  \ 中现在实现此方法，使其内容如下：\n\n```java\n@Override\npublic void onRequestPermissionsResult(int\
  \ requestCode, @NonNull String[] permissions, @NonNull int[] grantResults) {\n \
  \   super.onRequestPermissionsResult(requestCode, permissions, grantResults);\n\
  \    if (requestCode == LOCATION_REQUEST_CODE) {\n        if (grantResults.length\
  \ == 0 || grantResults[0] !=\n```\n\n\n\n\n\n```java\n        PackageManager.PERMISSION_GRANTED)\
  \ {\n\n            Toast.makeText(this,\n                        \"Unable to show\
  \ location - permission required\",\n                        Toast.LENGTH_LONG).show();\n\
  \        } else {\n            SupportMapFragment mapFragment =\n              \
  \      (SupportMapFragment) getSupportFragmentManager()\n                      \
  \      .findFragmentById(R.id.map);\n            mapFragment.getMapAsync(this);\n\
  \        }\n    }\n}\n```\n\n如果用户没有授予权限，应用程序将显示一条消息，指示无法显示当前位置。相反，如果授予了权限，地图将进行刷新，以便提供显示位置标记的机会。\n\
  \n### 74.13 显示用户的当前位置\n\n一旦授予了适当的权限，可以通过获取与显示地图关联的 `GoogleMap` 对象的引用，并调用该实例的 `setMyLocationEnabled()`\
  \ 方法（传入 `true` 值），从而在地图上显示用户的当前位置。\n\n当地图准备好显示时，会调用 Activity 的 `onMapReady()` 方法。当在上述\
  \ `onRequestPermissionsResult()` 方法中刷新地图时，该方法也会被调用。默认情况下，Android Studio 已经实现了此方法，并添加了一些代码，将地图引导至澳大利亚，并在悉尼市上方放置标记。在\
  \ `MapsActivity.java` 文件中找到并编辑 `onMapReady()` 方法，删除此模板代码，并添加代码在启用显示用户当前位置之前检查是否授予了权限。如果未授予权限，将通过调用之前添加的\
  \ `requestPermission()` 方法向用户请求权限：\n\n```java\n@Override\npublic void onMapReady(GoogleMap\
  \ googleMap) {\n    mMap = googleMap;\n    // 在悉尼添加一个标记并移动相机\n    LatLng sydney\
  \ = new LatLng(-34, 151);\n    mMap.addMarker(new MarkerOptions().position(sydney).title(\"\
  Marker in Sydney\"));\n    mMap.moveCamera(CameraUpdateFactory.newLatLng(sydney));\n\
  \    if (mMap != null) {\n        int permission = ContextCompat.checkSelfPermission(this,\n\
  \            Manifest.permission.ACCESS_FINE_LOCATION);\n        if (permission\
  \ == PackageManager.PERMISSION_GRANTED) {\n            mMap.setMyLocationEnabled(true);\n\
  \        } else {\n            requestPermission(\n                Manifest.permission.ACCESS_FINE_LOCATION,\n\
  \                LOCATION_REQUEST_CODE);\n        }\n    }\n}\n```\n\n现在运行应用程序时，将显示图\
  \ 74-9 所示对话框，请求位置权限。如果授予了权限，地图上将出现一个蓝点，指示设备的当前位置。\n\n![](img/as_map_permission.jpg)\n\
  \n图 74-9\n\n## 74.14 更改地图类型\n\n可以通过调用相应 `GoogleMap` 对象的 `setMapType()` 方法并传入以下值之一，动态地修改显示的地图类型：\n\
  \n- `GoogleMap.MAP_TYPE_NONE`:没有任何地图瓦片的的空网格。\n- `GoogleMap.MAP_TYPE_NORMAL`:由经典地图组成的标准视图。\n\
  - `GoogleMap.MAP_TYPE_SATELLITE`:显示地图区域的卫星图像。\n- `GoogleMap.MAP_TYPE_HYBRID`:显示叠加了道路地图的卫星图像。\n\
  - `GoogleMap.MAP_TYPE_TERRAIN`:显示地形信息，如等高线和颜色。\n\n例如，对 `onMapReady()` 方法进行以下代码更改可以将地图切换到卫星模式：\n\
  \n```java\nif (mMap != null) {\n    int permission = ContextCompat.checkSelfPermission(\n\
  \        this, Manifest.permission.ACCESS_FINE_LOCATION);\n    if (permission ==\
  \ PackageManager.PERMISSION_GRANTED) {\n        mMap.setMyLocationEnabled(true);\n\
  \    } else {\n        requestPermission(Manifest.permission.ACCESS_FINE_LOCATION,\n\
  \            LOCATION_REQUEST_CODE);\n    }\n    mMap.setMapType(GoogleMap.MAP_TYPE_SATELLITE);\n\
  }\n```\n\n或者，可以在嵌入地图的 XML 布局文件中指定地图类型，并使用 `map:mapType` 属性配合 `none`、`normal`、`hybrid`\
  \ 或 `terrain` 值。例如：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<fragment\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:map=\"\
  http://schemas.android.com/apk/res-auto\"\n    android:id=\"@+id/map\"\n    android:layout_width=\"\
  match_parent\"\n    android:layout_height=\"match_parent\"\n    map:mapType=\"hybrid\"\
  \n    android:name=\"com.google.android.maps.SupportMapFragment\"/>\n```\n\n###\
  \ 74.15 向用户显示地图控件\n\nGoogle Maps Android API 提供了许多可以显示给用户的控件，包括放大和缩小按钮、“我的位置”按钮和指南针。\n\
  \n缩放控件和指南针控件的显示可以通过编程方式控制，也可以在 XML 布局资源的地图元素中控制。要通过编程方式配置控件，必须获取与 `GoogleMap` 对象关联的\
  \ `UiSettings` 对象引用：\n\n```java\nimport com.google.android.gms.maps.UiSettings;\n\
  \nUiSettings mapSettings;\nmapSettings = mMap.getUiSettings();\n```\n\n缩放控件可以通过调用\
  \ `UiSettings` 对象的 `setZoomControls()` 方法来启用或禁用。例如：\n\n```java\nmapSettings.setZoomControls(true);\n\
  ```\n\n或者，可以在 XML 文件的地图元素中设置 `map:zoomControls` 属性：\n\n```xml\nmap:zoomControls=\"\
  false\"\n```\n\n指南针可以通过调用 `UiSettings` 实例的 `setCompassEnabled()` 方法，或者通过 XML 资源使用\
  \ `map:compass` 属性来显示。注意，指南针图标只有在地图倾斜或离开默认方向时才会出现。\n\n“我的位置”按钮只有在本章之前提到的启用位置模式时才会出现。可以通过调用\
  \ `UiSettings` 实例的 `setMyLocationButtonEnabled()` 方法在该模式下阻止该按钮出现。\n\n## 74.16 处理地图交互\n\
  \nGoogle Maps Android API 能够响应多种用户交互。这些交互可以用于更改显示的地图区域、缩放级别甚至视图角度（使得某些城市区域显示 3D\
  \ 表示）。\n\n#### 74.16.1 地图缩放手势\n\n放大和缩小地图的手势支持可以使用关联 `GoogleMap` 实例的 `setZoomGesturesEnabled()`\
  \ 方法来启用或禁用。例如，以下代码禁用了示例地图的缩放手势：\n\n```java\nUiSettings mapSettings;\nmapSettings\
  \ = map.getUiSettings();\nmapSettings.setZoomGesturesEnabled(false);\n```\n\n也可以在\
  \ XML 资源文件中将 `map:zoomGestures` 属性设置为 true 或 false 来实现相同的结果。\n\n启用后，当用户在屏幕上进行捏合手势时，将发生缩放。同样，双击将放大，而双指轻击将缩小。单指缩放手势（使用另一只手）是通过双击两次但不释放第二次轻击，然后在屏幕上上下滑动手指分别进行放大和缩小的。\n\
  \n#### 74.16.2 地图滚动/平移手势\n\n滚动（或平移）手势允许用户通过单指运动在屏幕上移动地图。滚动手势可以通过调用 `UiSettings`\
  \ 实例的 `setScrollGesturesEnabled()` 方法在代码中启用。例如：\n\n```java\nUiSettings mapSettings;\n\
  mapSettings = mMap.getUiSettings();\nmapSettings.setScrollGesturesEnabled(true);\n\
  ```\n\n或者，可以在 XML 资源文件中使用 `map:scrollGestures` 属性启用地图实例的滚动功能。\n\n#### 74.16.3 地图倾斜手势\n\
  \n\n\n\n\n倾斜手势允许用户通过在屏幕上放置两个手指并上下移动来调整地图投影的角度。可以通过调用 `UiSettings` 实例的 `setTiltGesturesEnabled()`\
  \ 方法来启用或禁用倾斜手势，例如：\n\n```java\nUiSettings mapSettings;\nmapSettings = mMap.getUiSettings();\n\
  mapSettings.setTiltGesturesEnabled(true);\n```\n\n也可以在 XML 布局资源文件中使用 `map:uiTiltGestures`\
  \ 属性来启用或禁用倾斜手势。\n\n#### 74.16.4 地图旋转手势\n\n在 clunt 在启用地图旋转手势时，用户可以通过在屏幕上放置两个手指并进行圆周运动来旋转地图的朝向。该手势的支持可以通过调用\
  \ `UiSettings` 实例的 `setRotateGesturesEnabled()` 方法在代码中启用或禁用，例如：\n\n```java\nUiSettings\
  \ mapSettings;\nmapSettings = mMap.getUiSettings();\nmapSettings.setRotateGesturesEnabled(true);\n\
  ```\n\n也可以在 XML 布局资源文件中使用 `map:uiRotateGestures` 属性来启用或禁用旋转手势。\n\n### 74.17 创建地图标记\n\
  \n标记用于通知用户地图上的位置，其形式可以是标准图标或自定义图标。标记还可以包含一个标题和可选的文本（称为摘要/snippet），并可以配置为允许用户将其拖动到地图上的不同位置。当用户点击标记时，将弹出一个信息窗口显示有关该标记位置的额外信息。\n\
  \n标记由 `Marker` 类的实例表示，并通过调用相应 `GoogleMap` 对象的 `addMarker()` 方法添加到地图上。作为此方法的参数传递的是一个\
  \ `MarkerOptions` 类实例，它包含了标记所需的各种选项，如标题和摘要文本。标记的位置通过指定纬度和经度值定义，这些值也包含在 `MarkerOptions`\
  \ 实例中。例如，以下代码在地图的特定位置添加了一个包含标题、摘要和位置的标记：\n\n```java\nimport com.google.android.gms.maps.model.Marker;\n\
  import com.google.android.gms.maps.model.LatLng;importimport com.google.android.gms.maps.model.MarkerOptions;\n\
  \n...\n\nLatLng position = new LatLng(38.8874245, -77.0200729);\nMarker museum =\
  \ mMap.addMarker(new MarkerOptions()\n                .position(position)\n    \
  \            .title(\"Museum\")\n                .snippet(\"National Air and Space\
  \ Museum\"));\n```\n\n执行上述代码将标记指定的位置，当点击该位置时将显示一个包含标题和摘要的信息窗口，如图图 74-10 所示：\n\n\
  ![](img/Image24513.jpg)\n\n图 74-10\n\n### 74.18 控制地图相机\n\n由于 Android 设备屏幕是平面的，而地球是球体，因此\
  \ Google Maps Android API 使用墨卡托投影在平面上表示地球。地图的默认视图呈现给用户，就像通过一个悬挂在地图上方并直接指向地图的相机一样。Google\
  \ Maps Android API 允许在应用程序内部实时更改此相机的目标、缩放、方位角度：\n\n- **目标 (Target)** – 地图在设备显示器中的中心位置，以经纬度指定。\n\
  - **缩放 (Zoom)** – 以级别指定的相机缩放级别。将缩放级别增加 1.0 会使显示的地图宽度增加一倍。\n- **倾斜 (Tilt)** – 相机的视角，指定为跨越可视图区域中心正上方弧形上的位置，从弧顶开始以度测量（弧顶是弧的底点，相机在该处直接指向地图）。\n\
  - **方位角 (Bearing)** – 地图的朝向，从北方向开始顺时针方向测量的度数。\n\n相机更改通过创建一个具有适当设置的 `CameraUpdate`\
  \ 类实例来实现。`CameraUpdate` 实例是通过调用 `CameraUpdateFactory` 类的方法创建的。一旦了 `CameraUpdate`\
  \ 实例，就可以通过调用 `GoogleMap` 实例的 `moveCamera()` 方法将其应用到地图。为了在相机变化时获得平滑的动画效果，可以调用 `animateCamera()`\
  \ 方法代替 `moveCamera()`。\n\n`CameraUpdateFactory` 方法摘要如下：\n\n- `CameraUpdateFactory.zoomIn()`\
  \ – 提供一个放大一级的 `CameraUpdate` 实例。\n- `CameraUpdateFactory.zoomOut()` - 提供一个缩小一级的\
  \ `CameraUpdate` 实例。\n- `CameraUpdateFactory.zoomTo(float)` - 生成一个将缩放级别更改为指定值的 `CameraUpdate`\
  \ 实例。\n- `CameraUpdateFactory.zoomBy(float)` – 提供一个缩放级别按指定量增加或减少的 `CameraUpdate`\
  \ 实例。\n- `CameraUpdateFactory.zoomBy(float, Point)` - 创建一个缩放级别按指定值增的 `CameraUpdate`\
  \ 实例。\n- `CameraUpdateFactory.newLatLng(LatLng)` - 创建一个更改相机目标纬度和经度的 `CameraUpdate`\
  \ 实例。\n- `CameraUpdateFactory.newLatLngZoom(LatLng, float)` - 生成一个更改相机目标、经度和缩放的\
  \ `CameraUpdate` 实例。\n- `CameraUpdateFactory.newCameraPosition(CameraPosition)`\
  \ - 返回一个移动相机到指定位置的 `CameraUpdate` 实例。\n\n\n\n\nAndroid 打印功能由打印框架（Printing framework）提供。简单来说，该框架由一个\
  \ `Print Manager` 和若干个打印服务插件组成。`Print Manager` 负责处理来自设备上应用程序的打印请求，并与设备上安装的打印服务插件交互，从而确保打印请求得到执行。默认情况下，许多\
  \ Android 设备都安装了打印服务插件，以便使用 `Google Cloud Print` 和 `Google Drive` 服务进行打印。其他类型打印机的打印服务插件如果尚未安装，也可以从\
  \ Google Play 商店获取。目前打印服务插件已适用于 HP、爱普、三星和佳能打印机，来自其他打印机制造商的插件未来很可能还会发布，尽管 `Google\
  \ Cloud Print` 服务插件也可以用于从 Android 设备打印到几乎任何类型和型号的打印机。本书的需要，我们将使用 `HP Print Services\
  \ Plugin` 作为示例。\n\n### 75.2 打印服务插件\n\n打印服务插件的目的是让应用程序能够打印到通过局域无线网络或蓝牙对 Android 设备可见的兼容打印机上。\n\
  \n可以通过加载 Google Play 应用并搜索“Print Service Plugin”来验证 Android 设备上是否存在打印服务插件。一旦插件在\
  \ Play 商店中列出，如果插件尚未安装，可以通过选择 `Install` 按钮进行安装。例如，图 75-1 显示了 Google Play 中的 `HP Print\
  \ Service plugin`。\n\n打印服务插件会自动检测 Android 设备当前连接的网络上的兼容打印机，并在从应用程序打印时将它们列为可选选项。\n\
  \n![](img/as_4.1_hp_printer_plugin.jpg)\n\n图 75-1\n\n### 75.3 Google Cloud Print\n\
  \nGoogle Cloud Print 是 Google 提供的一项服务，使您能够从任何连接互联网的地方通过网络将内容打印到自己的打印机上。Google Cloud\
  \ Print 支持多种设备和打印机型号，形式包括 `Cloud Ready`（云就）和 `Classic`（经典）打印机。`Cloud Ready` 打印机内置了通过网络打印的技术。提供云就打印机的制造商包括兄弟、佳能、戴尔、爱普、HP、柯达和三星。要确定您的打印机是否同时支持云就并受\
  \ Google Cloud Print 支持，请查看以下 URL 上的打印机列表：\n\n[`www.google.com/cloudprint/learn/printers.html`](https://www.google.com/cloudprint/learn/printers.html)\n\
  \n对于经典的、非云就的打印机，Google Cloud Print 通过在连接到经典打印机的计算机系统上（直接连接或通过家庭或办公室网络连接）安装软件来提供云打印支持。\n\
  \n要设置 Google Cloud Print，请访问以下网页并使用与登录 Android 设备相同的 Google  way ID 登录：\n\n[`www.google.com/cloudprint/learn/index.html`](https://www.google.com/cloudprint/learn/index.html)\n\
  \n一旦打印机添加到您的 Google Cloud Print 账户，当您从设备上的 Android 应用程序中打印时，它们将列为打印目标选项。\n\n###\
  \ 75.4 打印到 Google Drive\n\n除了支持物理打印机外，还可以将打印输出保存到您的 Google Drive 账户。从设备上打印时，在打印面板中选择\
  \ `Save to Google Drive` 选项。要打印的内容将被转换为 PDF 文件，并保存到与设备上当前激活的 Google Account 相关的\
  \ Google Drive 云存储中。\n\n## 75.5 存为 PDF\n\nAndroid 提供的最后一个打印选项允许将打印内容作为 PDF 文件本地保存到\
  \ Android 设备上。一旦选择此选项，系统将要求指定 PDF 文件名以及将文档保存到设备上的位置。\n\n在测试您自己的 Android 应用程序的打印功能时，`Save\
  \ as PDF` 和 Google Drive 选项在节约纸方面可能极具价值。\n\n### 75.6 从 Android 设备打印\n\nGoogle 建议提供打印内容能力的应用程序通过将打印选项放置在溢出菜单（Overflow\
  \ menu）中来实现。现在 Android 捆绑的许多应用程序都包含了“打印…” 菜单选项。例如，图 75-2 显示了通过选择 Chrome 浏览器应用程序溢出菜单中的“共享…”\
  \ 选项来访问打印选项：\n\n![](img/as_3.5_chrome_print_option.jpg)\n\n图 75-2\n\n一旦在应用程序内部选择了打印选项，将出现标准的\
  \ Android 打印屏幕，显示要打印内容的预览，如 图 75-3 所示：\n\n![](img/as_3.5_chrome_print_panel.jpg)\n\
  \n图 75-3\n\n点击屏幕顶部的面板将显示完整的打印选项：\n\n![](img/as_3.5_save_as_pdf.jpg)\n\n图 75-4\n\n\
  Android 打印面板提供了常用的打印选项，如纸张大小、颜色、方向和打印份数。可以通过点击当前打印机或 PDF 输出选择来访问其他打印目标选项。\n\n###\
  \ 75.7 在 Android 应用中构建打印支持的选项\n\n打印框架为将打印支持集成到 Android 应用程序中提供了多种选项。这些选项可以分类如下：\n\
  \n#### 75.7.1 图像打印\n\n顾如名，此选项允许将图像打印集成到 Android 应用程序中。向应用程序添加此功能时，第一步是创建一个 `PrintHelper`\
  \ 类的实例：\n\n```\nnew PrintHelper(context)\n```\n\n接下来，通过调用 `PrintHelper` 实例的 `setScaleMode()`\
  \ 方法指定打印图像的缩放模式。选项如下：\n\n- `SCALE_MODE_FIT`：图像将适应纸张尺寸，而不进行任何裁剪或更改宽高比例。这通常会导致留白。\n\
  - `SCALE_MODE_FILL`：图像将填充纸张尺寸，必要时会裁剪以避免留白。\n\n在没有设置缩放模式的情况下，系统默认使用 `SCALE_MODE_FILL`。例如，下面的代码将之前声明的\
  \ `PrintHelper` 实例缩放设置为适应：\n\n```\nimagePrinter.setScaleMode(PrintHelper.SCALE_MODE_FIT);\n\
  ```\n\n同样，也可以配置颜色模式以指示打印输出是彩色还是黑白。这是通过将以下选项传递给 `PrintHelper` 实例的 `setColorMode()`\
  \ 方法实现的：\n\n- `COLOR_MODE_COLOR`：表示彩色打印图像。\n- `COLOR_MODE_MONOCHROME`：表示黑白打印图像。\n\
  \n除非如下指定了单白选项，否则打印框架将默认彩色打印：\n\n```\nimagePrinter.setColorMode(PrintHelper.COLOR_MODE_MONOCHROME);\n\
  ```\n\n完成打印操作只需要一个要打印的图像并调用 `PrintHelper` 实例的 `printBitmap()` 方法，传递一个代表打印任务名称的字符串以及图像的引用（以\
  \ `Bitmap` 对象或 `Uri` 引用的形式）：\n\n```\nBitmap bitmap = BitmapFactory.decodeResource(getResources(),\
  \ R.drawable.oceanscene);\nimagePrinter.printBitmap(\"My Test Print Job\", bitmap);\n\
  ```\n\n一旦启动打印任务，打印框架将显示打印对话框，并处理后续的用户交互以及在用户选择的打印目标上打印图像。\n\n\n\n\n\n#### 75.7.2\
  \ 创建和打印 HTML 内容\n\nAndroid 打印框架还提供了一种在应用程序内部打印 HTML 内容的简单方法。这些内容可以是通过托管在网站上的页面 URL\
  \ 所引用的 HTML 内容，也可以是在应用程序内部动态创建的 HTML 内容。\n\n为了启用 HTML 打印，`WebView` 类已经过扩展，以以最少的代码要求支持打印功能。\n\
  \n在动态创建 HTML 内容时（与加载并打印现有网页不同），该过程涉及创建一个 `WebView` 对象并与其关联一个 `WebViewClient` 实例。然后配置该\
  \ web 视图客户端，以便在 HTML 加载到 `WebView` 后启动打印任务。配置好 web 视图客户端后，HTML 会被加载到 `WebView` 中，此时将触发打印过程。\n\
  \n例如，考虑以下代码：\n\n```java\npublic void printContent()\n{\n    WebView webView = new\
  \ WebView(this);\n    webView.setWebViewClient(new WebViewClient() {\n        public\
  \ boolean shouldOverrideUrlLoading(WebView view,\n                    String url)\n\
  \        {\n            return false;\n        }\n        @Override\n        public\
  \ void onPageFinished(WebView view, String url) {\n            createWebPrintJob(view);\n\
  \            myWebView = null;\n        }\n    });\n    String htmlDocument =\n\
  \        \"<html><body><h1>Android Print Test</h1><p>\"\n        + \"This is some\
  \ sample content.</p></body></html>\";\n    webView.loadDataWithBaseURL(null, htmlDocument,\n\
  \                \"text/HTML\", \"UTF-8\", null);\n    myWebView = webView;\n}\n\
  ```\n\n该方法的代码首先声明了一个名为 `myWebView` 的变量，其中将存储方法中创建的 `WebView` 实例的引用。在 `printContent()`\
  \ 方法内部，创建了一个 `WebView` 类的实例，并为其分配了一个 `WebViewClient` 实例。\n\n### WebViewClient 配置\n\
  \n分配给 web 视图对象的 `WebViewClient` 经过配置，用于指示 HTML 内容的加载将由 `WebView` 实例处理（通过从 `shouldOverrideUrlLoading()`\
  \ 方法返回 `false`）。更重要的是，声明并实现了一个 `onPageFinished()` 处理器方法，用于调用名为 `createWebPrintJob()`\
  \ 的方法。当所有 HTML 内容加载到 web 视图后，`onPageFinished()` 回调方法将被自动调用。这确保了在内容准备绪之前不会启动打印任务，从而确保所有内容都能被打印。\n\
  \n接下来，创建一个包含某些 HTML 的字符串作为内容。然后将其加载到 web 视图中。一旦 HTML 加载，`onPageFinished()` 方法就会触发。最后，该方法存储了\
  \ web 视图对象的引用。如果没有这一关键步骤，极有可能导致 Java 运行时系统认为应用程序不再需要该 web 视图对象并丢弃以释放内存（Java 术语中称为垃圾回收），导致打印任务在完成之前就终止。\n\
  \n### 方法实现\n\n此示例中剩下的只需按照如下方式实现 `createWebPrintJob()` 方法：\n\n```java\nprivate void\
  \ createWebPrintJob(WebView webView) {\n    PrintManager printManager = (PrintManager)\
  \ this.getSystemService(Context.PRINT_SERVICE);\n    PrintDocumentAdapter printAdapter\
  \ = new MyDocumentAdapter();\n    String jobName = getString(R.string.app_name)\
  \ + \" Document\";\n    PrintJob printJob = printManager.print(jobName, printAdapter,\
  \ new PrintAttributes.Builder().build());\n}\n```\n\n#### 75.7.3 打印网页\n\n打印网页涉及的步骤与上述概述的相似，不同在于向\
  \ web 视图传递了要打印的 URL，例如：\n\n`myWebView.loadUrl(\"https://developer.android.com/guide/\"\
  );`\n\n同样重要的是，`WebViewClient` 配置仅在页面需要在加载时自动打印时才是必需的。如果打印是由用户选择菜单选项启动的，则只需要在应用程序中包含上述概述的代码。下一章标题为“Android\
  \ HTML 打印示例”，将演示此类此类场景。\n\n#### 75.7.4 打印自定义文档\n\n虽然打印框架引入的 HTML 和图像功能为在应用程序内打印内容提供了方便路径，但显而易见，对于高级打印需求，这些选项将过于简单。对于更复杂的打印任务，框架还提供了自定义打印支持。这允许将文本和图形形式的内容绘制到画布（canvas）上。\n\
  \n与较较实现的 HTML 和图像打印不同，自定义文档打印是一个复杂的多阶段过程，本章将对其进行概述。这些步骤可以总结如下：\n\n- 连接到 `PrintManager`\n\
  - 创建一个继承自 `PrintDocumentAdapter` 类的 `CustomDocumentAdapter` 子类\n- 创建一个 `PdfDocument`\
  \ 实例来表示文档页面\n- 获取 `PdfDocument` 实例页面的引用，每个页面都关联有一个 `Canvas` 实例\n- 在页面画布上绘制内容\n-\
  \ 通知打印框架文档已准备就绪打印\n\n上述步骤概述的自定义打印适配器需要实现许多方法，Android 系统将在打印过程中调用这些方法来执行特定任务。其中最重要的是\
  \ `onLayout()` 方法，它负责在用户更改纸张大小或页面方向等设置时重新排列文档布局；以及 `onWrite()` 方法，它负责渲染待打印的页面。\n\
  \n\n\n\n\n正如上一章使用 Android 打印框架进行打印的概述，可以使用 Android 打印框架来打印网页和动态创建的 HTML 内容。虽然这两种打印方法之间有许多相似之处，但也存在一些需要考虑的细微差别。本章将通过创建两个示例应用程序，来对这两种打印选项提供更清晰的说明。\n\
  \n### 76.1 创建 HTML 打印示例应用程序\n\n从欢迎界面选择`New Project”（新建项目）选项，在出现的新项目对话框中，点击`Next`\
  \ 按钮之前选择`Empty Activity”（空活动）模板。\n\n在`Name` 字段中输入 `HTMLPrint`，并指定 `com.ebookfrenzy.htmlprint`\
  \ 为包名。在点击`Finish` 按钮之前，将`Minimum API level` 设置更改为 `API 26: Android 8.0 (Oreo)`，并将`Language`\
  \ 菜单改为 `Java`。\n\n### 76.2 打印动态 HTML 内容\n\n本教程的第一阶段是向项目添加代码，以创建一些 HTML 内容并以打印任务的形式将其发送到\
  \ `Printing` 框架。\n\n首先找到 `MainActivity.java` 文件（位于 `Project` 工具窗口的 `app` -> `java`\
  \ -> `com.ebookfrenzy.htmlprint`get 下），并将其加载到编辑面板。加载后，修改代码使其如下文列表所示：\n\n```java\n\
  package com.ebookfrenzy.htmlprint;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  \nimport android.os.Bundle;\nimport android.webkit.WebView;\nimport android.webkit.WebViewClient;\n\
  import android.webkit.WebResourceRequest;\nimport android.print.PrintAttributes;\n\
  import android.print.PrintDocumentAdapter;\nimport android.print.PrintManager;\n\
  import android.content.Context;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n\n    private WebView myWebView;\n\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_htmlprint);\n\
  \        printWebView();\n    }\n\n    private void printWebView() {\n        WebView\
  \ webView = new WebView(this);\n        webView.setWebViewClient(new WebViewClient()\
  \ {\n            public boolean shouldOverrideUrlLoading(WebView view,\n       \
  \                                            WebResourceRequest request) {\n   \
  \             return false;\n            }\n            @Override\n            public\
  \ void onPageFinished(WebView view, String url) {\n                createWebPrintJob(view);\n\
  \                myWebView = null;\n            }\n        });\n        String htmlDocument\
  \ =\n            \"<html><body><h1>Android Print Test</h1><p>\"\n            + \"\
  This is some sample content.</p></body></html>\";\n        webView.loadDataWithBaseURL(null,\
  \ htmlDocument,\n            \"text/HTML\", \"UTF-8\", null);\n        myWebView\
  \ = webView;\n    }\n}\n```\n\n代码更改从声明一个名为 `myWebView` 的变量开始，其中存储用于打印操作的 `WebView`\
  \ 实例引用。在`printWebView()` 方法中，创建了一个 `WebView` 类的实例，并为其分配了一个 `WebViewClient` 实例。\n\
  \n分配给 web view 对象的 `WebViewClient` 配置为：HTML 内容的加载由 `WebView` 实例处理（通过从 `shouldOverrideUrlLoading()`\
  \ 方法返回 `false`）。更重要的是，声明并实现了一个名为 `createWebPrintJob()` 的方法处理程序 `onPageFinished()`。当所有\
  \ HTML 内容都加载到 web view 时，`onPageFinished()` 方法将被自动调用。正如上一章所述，在打印动态创建的 HTML 内容时，此步骤是必要的，以确保在内容完全加载到\
  \ `WebView` 之前不会启动打印任务。\n\n接下来，创建一个包含某些 HTML 的 `String` 对象作为内容，并随后将其加载到 web view\
  \ 中。一旦 HTML 加载，`onPageFinished()` 回调方法将触发。最后，该方法将 web view 对象的引用存储在之前声明的 `myWebView`\
  \ 变量中。如果没有这一至关重要的步骤，存在很大风险，Java 运行时系统可能会假设应用程序不再需要 web view 对象并将其丢弃以释放内存，导致打印任务在完成之前就终止。\n\
  \n此示例中剩下的工作是实现 `createWebPrintJob()` 方法，该方法目前由 `onPageFinished()` 回调调用。继续留在 `MainActivity.java`\
  \ 文件中，实现以下内容：\n\n```java\nprivate void createWebPrintJob(WebView webView) {\n  \
  \  PrintManager printManager = (PrintManager) getSystemService(Context.PRINT_SERVICE);\n\
  \    PrintDocumentAdapter printAdapter = webView.createPrintAdapter(\"MyDocument\"\
  );\n    String jobName = getString(R.string.app_name) + \" Print Test\";\n    printManager.print(jobName,\
  \ printAdapter, new PrintAttributes.Builder().build());\n}\n```\n\n此方法获取 `PrintManager`\
  \ 服务的引用，并指示 web view 创建适配器。创建一个新的 `string` 来存储打印任务的名称（在此情况下基于应用程序名称和“Print Test”字样）。最后，通过调用打印器的\
  \ `print()` 方法启动打印任务，传递任务名称、适配器和一组默认属性。\n\n在运行 5.0 或更高版本的设备或模拟器上编译并运行应用程序。启动后，将标准的打印页面，如图\
  \ 76-1 所示。\n\n![图 76-1](img/Image425.jpg)\n\n如果有物理打印机，可以进行打印；保存到 Google 云硬盘，或者选择保存为\
  \ PDF 文件。一旦启动打印任务，检查目标位置上生成的输出。注意，使用保存到 PDF 选项时，系统会请求 PDF 文件的文件名和位置。`Downloads`\
  \ 文件夹是一个很好的选择，其内容可以通过选择设备上应用图标中的 `Downloads` 图标（在 Android 8 中重名为 `Files`）来查看。\n\n\
