  \ Studio 中创建应用”章节中创建的应用。启动 Android Studio，打开项目，并验证设备是否出现在[图 7-11]所示的设备菜单中：\n\n![](img/12_device_in_menu_scaled.jpg)\n\
  ``````\n\n从列表中选择设备并点击运行按钮（位于设备菜单右侧的绿色箭头按钮）安装并运行应用。\n\n### 7.6 设备镜像\n\n设备镜像允许你在物理设备上运行应用，同时在\
  \ Android Studio 的 `Running Devices` 工具窗口中查看设备显示。换句话说，尽管应用在物理设备上运行，但它以类似于 AVD 实例的方式出现在\
  \ Android Studio 中。\n\n设备镜像是 Android Studio Electric Eel 的一项实验功能，必须手动启用。要启用设备镜像，选择\
  \ `File -> Settings...`（macOS 上为 `Android Studio -> Preferences...`），选择左面板中的 `Experimental`\
  \ 项，并开启“Enable mirroring of physical Android devices”（启用物理 Android 设备镜像），如[图 7-12]所示：\n\
  \n![](img/as_enable_device_mirroring.jpg)\n```\n\n在启用设备镜像后，将设备连接到 Android Studio，显示\
  \ `Running Devices` 工具窗口（`View -> Tool Windows -> Running Devices`）。Android Studio\
  \ 将镜像物理设备的显示。\n\n### 7.7 总结\n\n虽然 Android 虚拟机模拟器提供了一个极佳的测试环境，但重要的是，确保应用在物理 Android\
  \ 设备上正常运行没有真正的替代方案。毕竟，这才是应用在现实世界中被使用的地方。\n\n\n\n\n[content]\n默认情况下，Android Studio\
  \ 环境并未配置为将 Android 设备视为目标测试设备。因此，必须执行一些步骤，以便能够在 Android Studio 开发环境中通过 USB 线缆或 WiFi\
  \ 网络将应用程序直接加载到 Android 设备上。实现这一目标的具体步骤取决于所使用的开发平台。在本章中，我们已经涵盖了适用于 Linux、macOS 和基于\
  \ Windows 平台的步骤。\n\n# 8. Android Studio 代码编辑器的基础\n\n开发 Android 应用涉及大量的编程工作，根据定义，这涉及到输入、审查和修改代码行。开发者在使用\
  \ Android Studio 时花费的大部分时间通常都是在编辑器窗口内编辑代码，这似乎并不令人意外。\n\n现代代码编辑器需要远超最初的输入、删除、剪切和粘贴等基本功能。如今，代码编辑器的实用性通常由等因素衡量，例如它在减少程序员输入量方面的程度、在大型源文件中导航的便利性，以及编辑器在编写代码时实时检测并突出显示编程错误的能力。正如本章将所示，这些只是\
  \ Android Studio 编辑器出色的领域之一。\n\n虽然本章并非对 Android Studio 编辑器功能的详尽概述，但旨在提供一份该工具关键功能的指南。丰富的程序员会发现，其中某些功能是目前大多数代码编辑器的共同点，而许多功能是这一特定编辑环境独有的。\n\
  \n### 8.1 Android Studio 编辑器\n\n当选择 Java、Kotlin、XML 或其他文本文件进行编辑时，Android Studio\
  \ 编辑器出现在主窗口的中心。例如，图 8-1 显示了一个加载了 Java 源文件的典型编辑器会话：\n\n![](img/as_code_editor_labelled.jpg)\n\
  \n图 8-1\n\n构成编辑器窗口的元素总结如下：\n\n**A – 文档标签 (Document Tabs)** – Android Studio 能够同时打开多个文件进行编辑。每当打开一个文件时，它都会分配一个文档标签，在编辑器窗口顶部边缘的标签栏中显示文件名。当空间不足以显示所有标签时，标签栏的最右侧会出现一个较小的下拉菜单。点击此菜单将列出其他已打开的文件列表。标签页中文件名下方的红色波浪线表示该文件中的代码包含一个或多个错误，这些错误在项目编译和运行之前需要解决。\n\
  \n在文件之间进行切换只需点击相应的标签或使用快捷键 `Alt-Left` 和 `Alt-Right`。也可以使用 Switcher 机制（通过快捷键 `Ctrl-Tab`\
  \ 访问）进行文件间的导航。\n\n要将编辑器面板从 Android Studio 主窗口分离以便在单独窗口中显示，请点击标签并将其拖到主窗口之外的桌面区域。要将编辑器返回主窗口，请点击分离的编辑器窗口中的文件标签，并将其拖放到主窗口中原始编辑器标签栏上。\n\
  \n**B – 编辑器行槽区 (The Editor Gutter Area)** - 槽区被编辑器用于显示信息图标和控件。该槽区中出现的一些典型项目包括调试断点标记、用于折叠和展开代码块的控件、书签、更改标记和行号。行号默认开启，但可以通过在槽区上点击单击右键并选择\
  \ `Show Line Numbers` 菜单选项来将其禁用。\n\n**C – 代码结构位置 (Code Structure Location)** – 编辑器顶部的此栏显示了光标相对于代码整体结构的位置。例如，在图中，该栏指示当前正在编辑\
  \ `convertCurrency` 方法，且该方法包含在 `MainActivity` 类中。\n\n![](img/as_4.2_code_location.jpg)\n\
  \n图 8-2\n\n双击栏内的任意元素将把光标移动到代码文件中的相应位置。例如，双击 `convertCurrency` 条目将把光标移动到源代码中 `convertCurrency`\
  \ 方法的顶部。同样，点击 `MainActivity` 条目将弹出一个可供选择的代码导航点列表：\n\n![](img/as_4.2_code_location_menu.jpg)\n\
  \n图 8-3\n\n**D – 编辑器区域 (The Editor Area)** – 这是用户显示、输入和编辑代码的主区域。本章随后的章节将详细介绍编辑区域的关键功能。\n\
  \n**E – 验证与标记侧边栏 (The Validation and Marker Sidebar)** – Android-ndroid Studio 整合了一项名为“实时代码分析”（on-the-fly\
  \ code analysis）的功能。这本质上意味着当你输入代码时，编辑器正在分析代码以检查警告和语法错误。验证侧边栏顶部的指示器会随着代码的添加实时更新，指示发现的错误和警告数量。点击此指示器将显示一个弹出窗口，如图\
  \ 8-4 所示，其中包含编辑器中代码发现问题的摘要：\n\n![](img/as_4.2_code_editor_warning_errors.jpg)\n\n\
  图 8-4\n\n可以使用向上和向下箭头在代码中的错误位置之间移动。绿色勾钩表示未检测到警告或错误。\n\n侧边栏还使用相同的颜色编码在检测到问题的位置显示标记。当代码行在编辑器区域可见时，将鼠标指针悬停在标记上将显示一个包含问题描述的弹出窗口：\n\
  \n![](img/as_warning_box.jpg)\n\n图 8-5\n\n当代码行当前位于编辑器区域的可视图之外时，将鼠标指针悬停在标记上将显示一个包含问题所在代码块的“透镜”覆盖层（图\
  \ 8-6），从而无需滚动到编辑器的该位置即可：\n\n![](img/Image2460.jpg)\n\n图 8-6\n\n值得注意的是，透镜覆盖不仅限于侧边栏的警告和错误。悬停在侧边栏的任何部分都会显示一个包含源文件中该位置代码的透镜。\n\
  \n**F – 状态栏 (The Status Bar)** – 虽然状态栏实际上是主窗口的一部分而非编辑器，但它确实包含有关当前活动编辑会话的信息。这些信息包括光标在行和字符方面的当前位置，以及文件的编码格式（UTF-8、ASCII\
  \ 等）。点击状态栏中的这些值可以更改相应的设置。例如，点击行号将显示“转到行：列”对话框。使用 `View -> Appearance -> Status Bar\
  \ Widgets` 菜单选项可以添加和删除组件。例如，如果你遇到 Android Studio 的性能问题，内存指示（Memory Indicator）是一个非常有帮助的组件。\n\
  \n在对构成 Android Studio 编辑器的元素进行概述之后，本章剩余部分将更详细地介绍编辑环境的关键功能。\n\n### 8.2 分割编辑器窗口\n\n\
  \n\n\n\n默认情况下，编辑器将显示单个面板，用于显示当前选中文件的内容。在同时处理多个源代码文件时，一个特别实用的功能是将编辑器拆分为多个窗格。若要拆分编辑器，请在编辑器窗口内右键点击文件标签，然后选择\
  \ `Split Vertically`（垂直拆分）或 `Split Horizontally`（水平拆分）菜单选项。例如，图 8-7 显示了拆分器的工作状态，编辑器被分为三个面板：\n\
  \n![](img/Image2467.jpg)\n\n图 8-7\n\n可以通过右键点击相应的标签并选择 `Change Splitter Orientation`（更改拆分方向）菜单选项，随时更改拆分面板的方向。重复这些步骤可以取消单个面板的拆分，从从中选择\
  \ `Unsplit`（取消拆分）选项。可以通过右键点击任何标签并选择 `Unsplit All`（取消全部拆分）移除所有的拆分面板。\n\n窗口拆分可显示不同的文件，或为同一个文件提供多个窗口，允许同时查看和编辑同一文件的不同区域。\n\
  \n### 8.3 代码补全\n\nAndroid Studio 编辑器对 Java 编程语法以及构成 Android SDK 的类和方法拥有大量的内置知识，同时也对您自己的代码库有深入了解。在输入代码时，编辑器会扫描正在输入的内容，并在适当的情况下针对完成某个语句或引用可能需要的内容提供建议。当编辑器检测到代码补全建议时，将出现一个包含建议列表的面板。例如，在图\
  \ 8-8 中，编辑器正在为 `String` 声明的开头提供可能的选项：\n\n![](img/Image2477.jpg)\n\n图 8-8\n\n如果没有任何自动补全建议是正确的，只需继续输入，编辑器将在适当的情况下继续精炼建议。若要采纳最顶部的建议，只需按下键盘上的\
  \ `Enter` 或 `Tab` 键。若要选择不同的建议，请使用方向键在列表中上下移动，再次使用 `Enter` 或 `Tab` 键选中高亮的项。\n\n可以使用\
  \ `Ctrl-Space` 组合键手动调用完成补全建议。这在更改编辑器中的单词或声明时非常有用。当光标置于编辑器中的某个单词上时，该单词将自动高亮。按下 `Ctrl-Space`\
  \ 将显示一组备选建议。若要将当前单词替换为建议列表中当前高亮的项，只需按下 `Tab` 键。\n\n除了实时自动补全功能外，Android Studio 编辑器还提供名为“智能补全”（Smart\
  \ Completion）的系统。智能补全通过 `Shift-Ctrl-Space` 组合键调用，选中后将根据代码当前的上下文提供更详细的建议。再次按下 `Shift-Ctrl-Space`\
  \ 快捷键将从更广泛范围内提供更多建议。\n\n代码补全对许多程序员来说可能取决于个人偏好。考虑到这一事实，Android Studio 对自动补全设置提供了很高的控制权限。可以通过选择\
  \ `File -> Settings…` 菜单选项（macOS 上 `Android Studio -> Preferences…`）并在设置面板中选择 `Editor\
  \ -> General -> Code Completion` 来查看和修改这些设置，如图 8-9 所示：\n\n![](img/as_code_completion_preferences.jpg)\n\
  \n图 8-9\n\n### 8.4 语句补全\n\nAndroid Studio 编辑器提供的另一种自动补全形式是语句补全。它可以自动填充方法和循环语句等项的括号和大括号。语句补全通过通过\
  \ `Shift-Ctrl-Enter`（macOS 上为 `Shift-Cmd-Enter`）组合键调用。请考虑以下代码：\n\n```\nmyMethod()\n\
  ```\n\n在编辑器中输入此代码后，触发语句补全将导致编辑器自动为方法添加大括号：\n\n```java\nmyMethod() {\n\n}\n```\n\n\
  ### 8.5 参数信息\n\n还可以请求编辑器提供关于方法接受的参数参数的信息。当光标置于方法调用的括号之间时，使用 `Ctrl-P`（macOS 上为 `Cmd-P`）组合键将显示该方法已知接受的参数，并对可能的建议进行加粗高亮：\n\
  \n![](img/Image2491.jpg)\n\n图 8-10\n\n### 8.6 参数名提示\n\n代码编辑器可以配置为在方法调用中显示参数名提示。例如，图\
  \ 8-11 高亮了 `Snackbar` 类 `make()` 和 `setAction()` 方法调用中的参数名提示：\n\n![](img/Image2499.jpg)\n\
  \n图 8-11\n\n此模式的设置可以通过选择 `File -> Settings` 菜单（macOS 上为 `Android Studio -> Preferences`），然后在左侧面板中选择\
  \ `Editor -> Inlay Hints -> Java` 来配置。在结果屏幕上，从列表中选择 `Parameter Hints` 项并启用或禁用 `Show\
  \ parameter hints` 选项。要调整提示设置，点击 `Exclude list...` 链接进行任何必要的调整。\n\n### 8.7 代码生成\n\
  \n除了在输入代码时进行补全外，编辑器在某些条件下还可以为您生成代码。如图 8-12 所示的可用代码生成选项列表可以在光标位于文件所需位置时使用 `Alt-Insert`（macOS\
  \ 上为 `Cmd-N`）快捷键来访问。\n\n![](img/as_3.4_code_editor_generate.jpg)\n\n图 8-12\n\n考虑一种在\
  \ `Activity` 被操作系统销毁之前收到通知的情况。正如本书后续章节概述的那样，这可以通过重写 `Activity` 的生命周期方法来实现。要让 Android\
  \ Studio 生成此存根方法，只需从代码生成列表中选择 `Override Methods` 选项，并在方法列表中选择 `onStop()` 方法：\n\n\
  ![](img/as_3.6_override_methods.jpg)\n\n图 8-13\n\n选择好要覆盖的方法后，点击 OK 将在源位置生成存根方法：\n\
  \n```java\n@Override\nprotected void onStop() {\n    super.onStop();\n}\n```\n\n\
  ### 8.8 代码折叠\n\n一旦源文件达到一定大小，即使是格式良好、组织良好的代码也可能变得难以处理和导航。Android Studio 认为没有必要显示所有代码块的内容。通过使用\
  \ Android Studio 编辑器的代码折叠功能可以使代码导航变得更容易。代码折叠通过位于源文件中代码块开始和结束处的边缘标记来控制。例如，图 8-14\
  \ 高亮了当前未折叠的方法定义的起始和结束标记：\n\n![](img/as3.2_java_code_folding.jpg)\n\n图 8-14\n\n点击这些标记之一都将折叠语句，使其只显示签名行，如图\
  \ 8-15 所示：\n\n![](img/Image2533.jpg)\n\n图 8-15\n\n要展开已折叠的代码部分，只需点击编辑器边缘的 `+` 标记。若要在不折叠的情况下查看隐藏的代码，请将鼠标指针悬停在\
  \ `{…}` 指示器上。编辑器随后将显示一个包含折叠代码块的透镜叠加：\n\n![](img/Image2540.jpg)\n\n图 8-16\n\n\n\n\
  \n\n文件中的所有代码块都可以使用 `Ctrl-Shift-Plus` 和 `Ctrl-Shift-Minus` 组合键进行折叠或展开。\n\n默认情况下，`Android\
  \ Studio` 编辑器在打开源文件时会自动折叠某些代码。要配置发生此情况条件，请选择 `File` -> `Settings…`（macOS 上为 `Android\
  \ Studio` -> `Preferences…`），并在生成的设置面板中选择 `Editor` -> `General` -> `Code Folding`（图\
  \ 8-17）：\n\n![](img/as_code_folding_preferences.jpg)\n\n图 8-17\n\n### 8.9 快速文档查询\n\
  \n通过将光标置于需要查看文档的声明上并按下 `Ctrl-Q` 快捷键（macOS 上为 `Ctrl-J`），可以访问与上下文相关的 Java 和 Android\
  \ 文档。这将显示一个包含该项目相关参考文档的弹出窗口。例如，图 8-18 显示了 `AndroidFloatingActionButton` 类的文档。\n\n\
  ![](img/as_documentation.jpg)\n\n图 8-18\n\n### 8.10 代码重格式\n\n通常情况下，`Android Studio`\
  \ 编辑器会在添加语句和代码块时，根据缩进、间距和嵌套自动对代码格式格式。在需要重新格式化代码的情况下（这是很常见的情况，例如从网站复制粘贴示例代码时），编辑器提供了源码重格式功能，选择该功能后将自动重格式代码以匹配主流的代码风格。\n\
  \n要重格式源代码，请按 `Ctrl-Alt-L`（macOS 上为 `Cmd-Opt-L`）快捷键组合。要显示“重格式代码”对话框（图 8-19），请使用 `Ctrl-Alt-Shift-L`（macOS\
  \ 上为 `Cmd-Opt-Shift-L`）。此对话框提供了仅重格式当前选定代码、编辑器中活动的整个源文件或仅重格式由于源码控制更新而更改的代码选项。\n\n\
  ![](img/as_reformat_code.jpg)\n\n图 8-19\n\n完整的代码风格偏可以在项目设置对话框中更改。选择 `File` -> `Settings`\
  \ 菜单（macOS 上为 `Android Studio` -> `Preferences…`）并在左侧面板中选择 `Code Style` 以访问支持的编程和标记语言列表。选择一种语言将提供大量的格式风格选项，所有选项都可以从\
  \ `Android Studio` 默认值修改以匹配您喜的代码风格。例如，要配置上述对话框中 `Rearrange` 代码选项的设置，请展开 `Code Style`\
  \ 部分，选择 `Java`，并在 `Java` 设置中选择 `Arrangement` 标签。\n\n### 8.11 查找示例代码\n\n`Android\
  \ Studio` 编辑器提供了访问与代码列表中当前高亮项相关的示例代码的方法。此功能对于学习如何使用特定的 `Android` 类或方法非常有用。要查找示例代码，在编辑器中高亮方法或类名，右键点击它并选择\
  \ `Find Sample Code` 菜单选项。`Find Sample Code` 面板（图 8-20）将出现在编辑器下方，列出匹配示例。从列表中选择一个示例会将相应的代码加载到右侧面板：\n\
  \n![](img/Image2571.jpg)\n\n图 8-20\n\n### 8.12 Live Templates（实时模板）\n\n在编写 `Android`\
  \ 代码时，你会发现有一些经常使用的常用结构。例如，一个常见的需求是使用 `Android Toast` 类向用户显示弹出消息。Live 模板是常用代码结构的集合，可以通过在编辑器中输入初始字符后跟一个特殊键（默认设置为\
  \ `Tab` 键）来插入模板代码。要体验这一操作，请在代码编辑器中输入 `toast` 然后按 `Tab` 键，`Android Studio` 将在光标位置插入以下代码并准备好编辑：\n\
  \n```java\nToast.makeText(, \"\", Toast.LENGTH_SHORT).show();\n```\n\n要列出并编辑现有模板、更改特殊键或添加您自己的模板，请打开\
  \ `Preferences` 对话框并从左侧导航面板的 `Editor` 部分选择 `Live Templates`：\n\n![](img/as_4.0_live_templates.jpg)\n\
  \n图 8-21\n\n使用上方 图 8-21 中标记为 `A` 的按钮添加、删除、复制或重置模板。要修改模板，从列表中选择它 (B) 并更改标记为 (C) 的面板中的设置。\n\
  \n### 8.13 总结\n\n`Android Studio` 编辑器付出了很大努力减少编写代码所需的打字量，并使代码更容易阅读和导航。在本章中，我们涵盖了许多关键编辑器功能，包括代码补全、代码生成、编辑器窗口拆、代码折叠、重格式、文档查询和实时模板。\n\
  \n## 9. Android 架构概览\n\n到本书为止，已经采取了步骤来建立适用于使用 `Android Studio` 开发 `Android` 应用程序的环境。通过创建\
  \ `Android Studio` 应用程序项目也迈出了应用开发过程的第一步。\n\n然而，在进一步探讨 `Android` 应用开发的实际问题之前，获取 `Android\
  \ SDK` 和通用 `Android` 开发的一些更抽象的概念是非常重要的。现在理解这些概念将为后续知识提供坚实基础。\n\n从本章对 `Android` 架构的概览开始，并在接下来的章节中继续，目标是提供\
  \ `Android` 开发的详细概述。\n\n### 9.1 Android 软件栈\n\n`Android` 结构为软件栈的形式，由应用程序、操作系统、运行时环境、中间件、服务和库组成。这种架构可以通过图\
  \ 9-1 所示的视觉表示。软件栈的每一层以及每层中相应的元素都紧密集成并经过仔细调整，为移动设备提供最优的应用开发和执行环境。\n\n![](img/Image438.jpg)\n\
  \n图 9-1\n\n### 9.2 Linux 内核\n\n位于 核栈栈栈，设备硬件与 Android 软件栈上层之间提供了抽象层。基于 `Linux` 版本\
  \ 2.6，内核提供了抢占式多任务、内存、进程和电源管理等底层核心系统服务，还提供了网络栈以及显示、WiFi 和音频等设备的驱动程序。\n\n原始 `Linux`\
  \ 内核由 `Linus Torvalds` 于 1991 年开发，并与 `Richard Stallman` 在自由软件基金开发的系列工具、实用程序和编译器相结合，创建了被称为\
  \ `GNU/Linux` 的完整操作系统。各种 `Linux` 发行版都是从这些基础衍生出的，如 `Ubuntu` 和 `Red Hat Enterprise\
  \ Linux`。\n\n然而，重要的是 `Android` 仅使用 `Linux 内核`。尽管如此，值得注意的是，`Linux 内核` 最初是为传统计算机（桌面电脑和服务器的形式）开发的。事实上，`Linux`\
  \ 现在在任务关键的企业级服务器环境中部署最广泛。这种软件能出现在 `Android` 软件栈的核心，既证明了移动设备的强大，也证明了 `Linux 内核` 的效率和性能。\n\
  \n### 9.3 Android Runtime – ART\n\n\n\n\n\n当 Android 应用在 Android Studio 中构建时，它会被编译成一种中间字节码格式（称为\
  \ `DEX` 格式）。当应用程序随后加载到设备上时，Android Runtime（`ART`）会使用一种称为提前编译（Ahead-of-Time，简称 `AOT`）的过程将字节码翻译为设备处理器所需的原生指令。这种格式被称为可执行和链接格式（`ELF`）。\n\
  \n此后每次启动应用程序时，都会运行 `ELF` 可执行版本，从而获得更快的应用性能和更好的电池续航。\n\n这与旧版 Android 实现使用的即时编译（Just-in-Time，简称\
  \ `JIT`）方法形成对比，后者是在每次启动应用程序时在虚拟机（`VM`）内翻译字节码。\n\n### 9.4 Android 库\n\n除了一组标准的 Java\
  \ 开发库（提供字符串处理、网络和文件操作等通用任务的支持）外，Android 开发环境还包含了 `Android Libraries`（Android 库）。这些是专门用于\
  \ Android 开发的 Java 库。此类库示例包括应用框架库，以及便于用户界面构建、图形绘制和数据库访问的库。\n\n以下是 Android 开发者可以使用的一些核心\
  \ Android 库的摘要：\n\n* `android.app` – 提供对应用模型的访问，是所有 Android 应用的石。\n* `android.content`\
  \ – 促进应用程序与应用组件之间的内容访问、发布和消息传递。\n* `android.database` – 用于访问内容提供发布的数据，包含 `SQLite`\
  \ 数据库管理类。\n* `android.graphics` – 一种底层 2D 图形绘制 API，包括颜色、点、过滤器、矩形和画布。\n* `android.hardware`\
  \ – 提供访问硬件（如加速度计和光线传感器）的 API。\n* `android.opengl` – 指向 `OpenGL ES` 3D 图形渲染 API 的\
  \ Java 接口。\n* `android.os` – 为应用程序提供对标准操作系统服务的访问，包括消息、系统服务和进程间通信。\n* `android.media`\
  \ – 提供启用音频和视频播放的类。\n* `android.net` – 一组提供对网络栈访问的 API。包括 `android.net.wifi`，它提供了对设备无线栈的访问。\n\
  * `android.print` – 包括一组类，允许从 Android 内部将内容发送到已配置的打印机。\n* `android.provider` – 一组便利类，提供对标准\
  \ Android 内容提供者数据库的访问，例如日历和联系人应用维护的数据库。\n* `android.text` – 用于在设备显示上渲染和操作文本。\n*\
  \ `android.util` – 一组工具类，用于执行字符串和数字转换、XML 处理以及日期时间操作等任务。\n* `android.view` – 应用用户界面的基础构建模块。\n\
  * `android.widget` - 一组丰富的预构建用户界面组件，如按钮、标签、列表视图、布局管理器、单选按钮等。\n* `android.webkit`\
  \ – 一组旨在在应用程序中构建网络浏览能力的类。\n\n在涵盖了 Android 运行时中的 Java 库之后，现在是关注 Android 软件栈这一层中的\
  \ C/C++ 库了。\n\n#### 9.4.1 C/C++ 库\n\n在前节概述的 Android 运行时核心库是基于 Java 的，为编写 Android\
  \ 应用的开发者提供了主要的 API。然而，重要的是，这些核心库并没有执行大量的实际工作，事实上它们本质上是一组基于 C/C++ 的库的 Java“包装器”。例如，在调用\
  \ `android.opengl` 库在设备显示器上绘制 3D 图形时，该库最终会调用 `OpenGL ES` C++ 库，而后者又与底层的 Linux 内核协作执行绘制任务。\n\
  \n引入 C/C++ 库是为了满足广泛且多样的功能，包括 2D 和 3D 图形绘制、安全套接层（`SSL`）通信、`SQLite` 数据库管理、音频视频播放、位图和矢量字体渲染、显示子系统和图形层以及标准\
  \ C 系统库（`libc`）的实现。\n\n在实践中，典型的 Android 应用开发者将通过基于 Java 的 Android 核心库 API 访问这些库。如果需要访问这些库，可以使用\
  \ Android Native 开发包（`NDK`），其目的是使用 Java Native Interface（`JNI`）从 Java 代码中调用非 Java\
  \ 或 Kotlin 编程语言（如 `C` 和 `C++`）的原生方法。\n\n# 9.5 应用框架\n\n应用框架是共同构成 Android 应用运行和管理环境的服务集。该框架实现了这样一个概念：Android\
  \ 应用是由可重用、可交换和可替换的组件构建的。这一概念更进了一步，应用程序还可以发布其功能以及任何相关数据，以便其他应用程序发现并重用它们。\n\nAndroid\
  \ 框架包含以下关键服务：\n\n* `Activity Manager` – 控制应用程序生命周期和活动栈的所有方面。\n* `Content Providers`\
  \ – 允许应用程序与其他应用程序发布并共享数据。\n* `Resource Manager` – 提供对非代码嵌入资源的访问，如字符串、颜色设置和用户界面布局。\n\
  * `Notifications Manager` – 允许应用程序向用户显示警报和通知。\n* `View System` – 用于创建应用程序用户界面的可扩展视图集。\n\
  * `Package Manager` – 应用程序通过此系统获取设备上当前安装的其他应用程序的信息。\n* `Telephony Manager` – 为应用程序提供关于设备上可用电话服务的信息，如状态和订阅者信息。\n\
  * `Location Manager` – 提供对位置服务的访问，允许应用程序接收位置变化的更新。\n\n# 9.6 应用\n\n位于 Android 软件栈顶端的是应用程序。这些程序包含了特定\
  \ Android 实现提供的原生应用（例如网络浏览器和电子邮件应用）以及用户购买设备后安装的第三方应用。\n\n# 10 Android 应用的解析\n\n\
  无论你之前的编程经验如何，无论是 Windows、macOS、Linux 还是 iOS 平台，很有可能 Android 开发与你遇到过的任何东西都不同。\n\n\
  \n\n\n\n因此，本章的目的是让读者理解 Android 架构背后的高层概念。为此，我们将详细探索用于构建应用程序的各种组件，以及允许这些组件协作以创建一个统一应用程序的机制。\n\
  \n## 10.1 Android Activities（活动）\n\n熟悉 `Java`、`Kotlin`、`C++` 或 `C#` 等面向对象语言的人都会熟悉将应用程序功能元素封装在类中，然后将这些类实例化为对象并进行操作以创建应用程序。由于\
  \ Android 应用是用 `Java` 和 `Kotlin` 编写的，情况仍然如此。然而， Android 将可重用组件的概念提升到了更高的水平。\n\n\
  Android 应用是通过组合一个或多个称为 `Activities` 的组件创建的。`Activity` 是应用程序功能的一个单一、独立模块，通常直接对应单个用户界面屏幕及其相应的功能。例如，一个预约应用程序可能包含一个显示当天已安排预约的\
  \ Activity 屏幕。该应用程序还可以使用第二个 Activity，该屏幕包含一个允许用户输入新预约的屏幕。\n\n`Activities` 被设计为完全可重用且可交换的构建块，可以在不同的应用程序之间共享。例如，一个现有的电子邮件应用程序可能包含一个专门用于编写和发送电子邮件消息的\
  \ Activity。开发者可能正在编写一个也具有发送电子邮件消息要求的应用程序。开发者无需为新应用程序专门开发一个电子邮件编写 Activity，只需简单地使用现有电子邮件应用程序中的\
  \ Activity 即可。\n\n`Activities` 是作为 `Android Activity` 类的子类创建的，并且必须实现为完全独立于应用程序中的其他\
  \ Activity。换句话说，共享的 Activity 不能依赖于在程序流的已知点被调用（因为其他应用程序可能会以意想不到的方式使用该 Activity），而且一个\
  \ Activity 不能直接调用另一个 Activity 的方法或访问其实例数据。相反，这是通过 `Intents` 和 `Content Providers`\
  \ 实现的。\n\n默认情况下，Activity 不能向调用它的 Activity 返回结果。如果需要此功能，则必须将该 Activity 特别启动为源 Activity\
  \ 的子 Activity。\n\n## 10.2 Android Fragments（片段）\n\n如上所述，Activity 通常代表应用中的一个单一用户界面屏幕。一种方案是使用单一的用户界面布局和一个对应的\
  \ Activity 类文件来构建该 Activity。然而，更好的替代方案是将 Activity 拆分为不同的部分。这些部分中的每一个都被称为 `fragment`，每个片段都由用户界面布局的一部分和一个匹配的类文件（声明为\
  \ `Android Fragment` 类的子类）组成。在这种情况下，Activity 仅仅变成一个容器，其中嵌入了一个或多个片段。\n\n事实上，片段为每个用户界面屏幕由单独的\
  \ Activity 表示提供了高效的替代方案。相反，应用可以由单个 Activity 组成，在不同的片段之间切换，每个片段代表不同的应用屏幕。\n\n## 10.3\
  \ Android Intents（意图）\n\n`Intents` 是一个 Activity 启动另一个 Activity 并实现组成应用程序的 Activity\
  \ 流的机制。`Intents` 由对要执行的操作的描述以及可选的要执行操作的数据组成。\n\n`Intents` 可以是显式的（explicit），即通过类名引用\
  \ Activity 来请求启动特定的 Activity；也可以是隐式的（implicit），通过说明要执行的操作类型或提供要执行操作的特定类型的数据。在隐式意图的情况下，Android\
  \ 运行时将使用称为 `Intent Resolution`（意图解析）的过程选择最符合 `Intent` 指定标准的 Activity 进行启动。\n\n##\
  \ 10.4 Broadcast Intents（广播意图）\n\n另一种类型的 `Intent`——`Broadcast Intent`（广播意图），是一种系统范围的意图，发送给所有注册了“感兴趣”的\
  \ `Broadcast Receiver`（广播接收器）的应用程序。例如，Android 系统通常发送广播意图来指示设备状态的变化，例如系统启动完成、外部电源连接到设备或屏幕开启或关闭。\n\
  \n`Broadcast Intent` 可以是普通的（异步的），因为它是在大致相同的时间发送给所有感兴趣的 `Broadcast Receivers`；也可以是有序的（ordered），因为它是一次发送给一个接收器，接收器可以对其进行处理，然后要么中止或允许传递给下一个\
  \ `Broadcast Receiver`。\n\n## 10.5 Broadcast Receivers（广播接收器）\n\n`Broadcast Receivers`\
  \ 是应用程序响应 `Broadcast Intents` 的机制。`Broadcast Receiver` 必须由应用程序注册，并配置 `Intent Filter`（意图过滤器）以指示其感兴趣的广播类型。当一个匹配的意图被广播时，无论注册该接收器的应用程序当前是否运行，Android\
  \ 运行时都会调用该接收器。接收器随后有 5 秒钟的时间来完成对其要求的任何任务（如启动 `Service`、更新数据或向用户发出通知），然后返回。`Broadcast\
  \ Receivers` 在后台运行，没有用户界面。\n\n## 10.6 Android Services（Android 服务）\n\n`Android Services`\
  \ 是在后台运行的进程，没有用户界面。它们可以从 Activity、`Broadcast Receivers` 或其他 `Services` 启动并进行管理。`Android\
  \ Services` 适用于需要继续执行任务但不一定需要用户可见用户界面的情况。虽然 `Services` 缺乏用户界面，但它们仍然可以使用通知（notification）和吐司（toast，出现在屏幕上且不中断当前可见\
  \ Activity 的小型通知消息）通知用户事件，并能够发出 `Intents`。\n\nAndroid 运行时赋予了服务比许多其他进程更高的优先级，系统只会在最后手段情况下才会将其终止以释放资源。然而，如果运行时确实需要杀死一个\
  \ `Service`，一旦资源再次可用，它将自动重启。`Service` 可以通过声明其需要在前台运行来降低被终止的风险。这是通过调用 `startForeground()`\
  \ 实现的。这仅建议用于会对用户体验产生不利的情况（例如，如果用户正在听由 `Service` 流出的音频）。\n\n`Service` 可能作为实际解决方案的示例情况包括如之前提到的，在应用程序不再活动时继续流音频，或者在股票达到指定价格时需要通知用户的股票市场跟踪应用程序。\n\
  \n## 10.7 Content Providers（内容提供者）\n\n`Content Providers` 实现了一种在应用程序之间共享数据的机制。任何应用程序都可以通过实现\
  \ `Content Provider` 向其他应用程序提供对其底层数据的访问，包括添加、删除和查询数据的能力（受权限限制）。对数据的访问通过 `Content\
  \ Provider` 定义的通用资源标识符 (`URI`) 提供的。数据可以以文件或整个 SQLite 数据库的形式共享。\n\n\n\n\n\n原生 Android\
  \ 应用程序包含许多标准的内容提供（Content Providers），允许应用程序访问联系人和媒体文件等数据。Android 系统上当前可用的内容提供可以使用内容解析器（Content\
  \ Resolver）进行定位。\n\n## 10.8 应用清单（Application Manifest）\n\n将组成应用程序各种元素结合在一起的胶水是应用清单文件。在这个基于\
  \ XML 的文件中，应用程序概述了构成完整应用程序的活动、服务、广播接收器、数据提供和权限。\n\n## 10.9 应用资源（Application Resources）\n\
  \n除了清单文件和包含字节码的 Dex 文件外，Android 应用包通常还包含一组资源文件。这些文件包含了出现在用户界面中的资源，如字符串、图像、字体和颜色，以及用户界面布局的\
  \ XML 表示。默认情况下，这些文件存储在应用程序项目层级结构中的 `/res` 子目录下。\n\n## 10.10 上下文（Application Context）\n\
  \n当应用程序被编译时，会创建一个名为 `R` 的类，其中包含对应用程序资源的引用。应用清单文件和这些资源结合创建了所谓的应用程序上下文（Application\
  \ Context）。该上下文由 `Android Context` 类表示，可以在应用程序代码中使用它在运行时访问应用程序资源。此外，可以在应用程序上下文上调用广泛的方法，以收集信息并在运行时更改应用程序的环境。\n\
  \n### 10.11 总结\n\n许多不同的元素可以组合在一起创建一个 Android 应用程序。在本章中，我们提供了对活动（Activities）、片段（Fragments）、服务（Services）、意（Intents）和广播接收器（Broadcast\
  \ Receivers）的高级概述，以及清单文件和应用资源的概述。\n\n通过以活动和意的形式创建独立的、单独的功能模块，促进了最大重用和互操作性；而应用程序之间的数据共享通过实现内容提供来实现。\n\
  \n虽然活动专注于用户与应用程序交互的区域（一个活动本质等同于单个用户界面屏幕，通常由一个或多个片段组成），但后台处理通常由服务和广播接收器处理。\n\n构成应用程序的组件在清单文件中为\
  \ Android 运行时系统概述，该文件与应用程序资源结合，代表了应用程序的上下文。\n\n本章涵盖了许多对普通开发者来说可能是新的内容。但请放心，在后续章节中将对这些概念进行广泛的探索和实际应用，以确保在坚实的知识基础之上构建您自己的应用程序。\n\
  \n## 11. Android 视图绑定（View Binding）概述\n\n开发 Android 应用程序的重要部分涉及代码与构成用户界面布局的视图之间的交互。本章将查看在代码中访问布局视图的选项，特别强调一种名为视图绑定（view\
  \ binding）的选项。在涵盖视图绑定的基础知识后，本章将概述将 AndroidSample 项目转换为使用此方法所需的更改。\n\n## 11.1 通过\
  \ ID 查找视图（Find View by Id）\n\n正如“Android 应用程序剖析”章节中所概述的，构成应用程序的所有资源都被编译成一个名为 `R`\
  \ 的类。这些资源中包含了定义布局的资源。`R` 类中有一个名为 `layout` 的子类，它包含了布局资源，包括构成用户界面的视图。大多数应用程序都需要实现代码与这些视图之间的交互，例如读取输入到\
  \ `EditText` 视图的值或更改 `TextView` 上显示的内容时。\n\n在引入 Android Studio 3.6 之前，从应用代码访问视图的唯一选项是编写代码，通过\
  \ `findViewById()` 方法根据其 id 手动查找视图。例如：\n\n```java\nTextView exampleView = findViewById(R.id.exampleView);\n\
  ```\n\n获取引用后，就可以访问视图的属性。例如：\n\n```java\nexampleView.setText(\"Hello\");\n```\n\n\
  虽然通过 id 查找视图仍然是一个可行的选项，但它有一些局限性，`findViewById()` 最大的缺点可能会获取到尚未在布局中创建的视图引用，导致在尝试访问视图属性时发生空指针异常。\n\
  \n自 Android Studio 3.6 以来，已经有了以视图绑定形式从应用代码访问视图的替代方法。\n\n## 11.2 视图绑定（View Binding）\n\
  \n当应用模块中启用视图绑定时，Android Studio 会自动为模块中的每个布局文件生成一个绑定类（binding class）。使用此绑定类，可以在代码内部访问布局视图，而无需使用\
  \ `findViewById()`。\n\nAndroid Studio 生成的绑定类名称基于布局文件名转换为所谓的“驼峰命名法”（camel case），并在末尾添加“Binding”单词。例如，对于\
  \ `activity_main.xml` 文件，绑定类将命名为 `ActivityMainBinding`。\n\nAndroid Studio Electric\
  \ Eel 在项目模板中使用视图绑定方面存在不一致。例如，我们在创建 AndroidSample 项目时使用的空活动（Empty Activity）模板没有使用视图绑定。另一方面，基础活动（Basic\
  \ Activity）模板是使用视图绑定实现的。如果您使用的模板没有使用视图绑定，那么了解如何将该项目迁移出合成属性（synthetic properties）是非常重要的。\n\
  \n### 11.3 转换 AndroidSample 项目\n\n在本章的剩余部分中，我们将通过将 AndroidSample 项目转换为使用视图绑定而不是使用\
  \ `findViewById()` 来练习迁移到视图绑定。\n\n从启动 Android Studio 并打开“在 Android Studio 中创建示例\
  \ Android 应用”章节创建的 AndroidSample 项目开始。\n\n## 11.4 启用视图绑定（Enabling View Binding）\n\
  \n要使用视图绑定，必须对需要视图绑定的模块的 `build.gradle` 文件进行一些更改。对于 AndroidSample 项目，这将对 Gradle Scripts\
  \ -> `build.gradle (Module: AndroidSample.app)` 文件进行细微更改。将此文件加载到编辑器，找到 `android`\
  \ 部分并添加以下项以启用 `viewBinding` 属性：\n\n```gradle\nplugins {\n    id 'com.android.application'\n\
  }\n\nandroid {\n    buildFeatures {\n        viewBinding true\n    }\n}\n```\n\n\
  完成更改后，点击编辑器顶部的“Sync Now”（同步）链接，然后使用 Build 菜单清理并重新构建项目，以确保生成绑定类。下一步是在代码中使用绑定类。\n\n\
  ## 11.5 使用视图绑定（Using View Binding）\n\n此过程的第一步是“实例化”（inflate）视图绑定类，以便我们可以访问布局中的根视图。然后，将此根视图作为布局的内容视图。\n\
  \n执行这些任务的逻辑位置位于关联布局的 `onCreate()` 方法中。典型的 `onCreate()` 方法如下：\n\n```java\n@Override\n\
  protected void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    setContentView(R.layout.activity_main);\n}\n```\n\n\n\n\n要切换到使用视图绑定（view binding），需要导入绑定类并按如下方式修改类。注意，由于布局文件名为\
  \ `activity_main.xml`，我们可以推断 Android Studio 生成的绑定类名为 `ActivityMainBinding`。注意，如果你在创建项目时使用了\
  \ `com.example` 以外的域，则需要更改下方的导入语句以反映此点：\n\n```java\nimport android.widget.EditText;\n\
  import android.widget.TextView;\nimport com.example.androidsample.databinding.ActivityMainBinding;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private ActivityMainBinding\
  \ binding;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \        binding = ActivityMainBinding.inflate(getLayoutInflater());\n        View\
  \ view = binding.getRoot();\n        setContentView(view);\n    }\n}\n```\n\n现在我们已经有了绑定的引用，可以如下所示通过名称访问视图：\n\
  \n```java\npublic void convertCurrency(View view) {\n    EditText dollarText = findViewById(R.id.dollarText);\n\
  \    TextView textView = findViewById(R.id.textView);\n    if (!binding.dollarText.getText().toString().equals(\"\
  \")) {\n        Float dollarValue = Float.valueOf(\n                           \
  \ binding.dollarText.getText().toString());\n        Float euroValue = dollarValue\
  \ * 0.85F;\n        binding.textView.setText(String.format(Locale.ENGLISH,\"%.2f\"\
  ,\n                                            euroValue));\n    } else {\n    \
  \    binding.textView.setText(R.string.no_value_string);\n    }\n}\n```\n\n编译并运行应用，验证货币转换过程是否如以前一样正常工作。\n\
  \n### 11.6 选择选项\n\n尽管在 Empty Activity 项目模板中没有采用视图绑定，但 Google 强烈建议尽可能使用视图绑定。事实上，对合成属性（synthetic\
  \ properties）的支持现在已被弃用，并可能在 Android Studio 的未来版本中移除。因此，在开发自己的项目时，可能应该使用视图绑定。\n\n\
  ### 11.7 书中示例中的视图绑定\n\n本书中任何依赖于未实现视图绑定项目模板的章节将首先进行迁移。然而，为了避免每次执行迁移时都重复这些步骤，这些章节将引导你回到此处以温习（别担心，在几个章节之后，必要的更改将变成本能）。为了帮助这一过程，接下来的部分更简要地总结了迁移步骤。\n\
  \n### 11.8 将项目迁移到视图绑定\n\n将项目模块转换为使用视图绑定的过程涉及以下步骤：\n\n1. 在 Project 工具窗口中列出模块级 Gradle\
  \ 构建脚本文件，其路径为 `Gradle Scripts -> build.gradle (Module :app)`，其中 `<project name>`\
  \ 是项目名称（例如 `AndroidSample`）。\n2. 找到文件的 `android` 部分，并添加如下条目以启用 `viewBinding` 属性：\n\
  \n```gradle\nandroid {\n    buildFeatures {\n        viewBinding true\n    }\n}\n\
  ```\n\n3. 点击编辑器顶部的 `Sync Now` 链接，用这些新的构建设置重新同步项目。\n4. 编辑 `MainActivity.java` 文件并将其修改为如下内容（其中\
  \ `<reverse domain>` 代表创建项目时使用的域名，`<project name>` 替换为项目的小写名称，例如 `androidsample`），且\
  \ `<binding name>` 是对应布局资源文件的绑定名称（例如，`activity_main.xml` 的绑定为 `ActivityMainBinding`）。\n\
  \n```java\nimport android.view.View;\nimport com.<reverse domain>.<project name>.databinding.<binding\
  \ name>;\n\npublic class MainActivity extends AppCompatActivity {\n    private <binding\
  \ name> binding;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \        binding = <binding name>.inflate(getLayoutInflater());\n        View view\
  \ = binding.getRoot();\n        setContentView(view);\n    }\n}\n```\n\n### 11.9\
  \ 总结\n\n在引入视图绑定之前，Android 使用合成属性。现在视图绑定提供了另一种替代方案，它由 Android Studio 为每个布局自动生成。然而，从\
  \ Android Studio Electric 版本开始，某些模板默认未启用视图绑定，需要额外的步骤来手动启用。\n\n## 12. 理解 Android\
  \ 应用程序和 Activity 生命周期\n\n在早的章节中，我们已经学习了 Android 应用程序运行在进程，并且由组件组成。本章的目标是通过查看应用程序和\
  \ Activity 的生命周期来扩展这些知识。\n\n无论当今移动设备与桌面系统相比拥有了多少内存和计算能力，重要的是，要记住这些设备仍然被认为是“资源受限的”。因此，Android\
  \ 的核心职责是确保这些有限资源得到有效管理，并确保操作系统以及运行其上的应用程序都能保持响应。为了实现这一点，Android 对进程的生命周期和状态具有完全控制权。\n\
  \n因此，开发 Android 应用的一个重要因素是理解 Android 的应用程序和 Activity 生命周期模型，以及应用程序如何应对在其执行生命周期内可能被施加的状态变化。\n\
  \n### 12.1 Android 应用程序与资源管理\n\n每个运行的 Android 应用程序都被操作系统视为一个独立的进程。如果系统识别到设备上的资源达到容量，它将采取措施终止进程以释放内存。\n\
  \n在决定终止哪个进程以释放内存时，系统会考虑所有当前运行进程的优先级和状态，结合这些因素创建 Google 所说的“重要性层次结构”。然后系统将从最低优先级开始按层次向上终止进程，直到释放出足够的系统资源。\n\
  \n### 12.2 Android 进程状态\n\n进程托管应用程序，应用程序由组件组成。在 Android 系统中，进程的当前状态由其托管的应用程序中排名最高的活动组件定义。如图\
  \ 12-1 所示，进程在任何时候都可以处于以下五种状态之一：\n\n#### 12.2.1 前台进程\n\n这些进程被分配最高优先级。任何时候都不可能多有一个或两个活跃的前台进程，它们通常是系统最后终止的。进程必须满足以下一个或多个标准才能获得前台状态：\n\
  \n\n\n\n\n-   托管一个用户当前正在交互的 Activity。\n-   托管一个与用户正在交互的 Activity 相连的 Service。\n\
  -   托管一个通过调用 `startForeground()` 表明终止会破坏用户体验的 Service。\n-   托管一个正在执行其 `onCreate()`、`onResume()`\
  \ 或 `onStart()` 回调函数的 Service。\n-   托管一个正在执行其 `onReceive()` 方法的广播接收器（Broadcast Receiver）。\n\
  \n#### 12.2.2 可见进程 (Visible Process)\n\n包含一个对用户可见但并非用户当前正在交互的 Activity 的进程被归类为“可见进程”。通常发生在当进程中的某个\
  \ Activity 对用户可见，但另一个 Activity（如部分屏幕或对话框）处于前台时。如果一个进程托管了一个本身已绑定到可见或前台 Activity 的\
  \ Service，那么该进程也具备可见状态的资格。\n\n#### 12.2.3 服务进程 (Service Process)\n\n包含已启动并正在执行的\
  \ Service 的进程。\n\n#### 12.2.4 后台进程 (Background Process)\n\n包含一个或多个当前对用户不可见的 Activity，且不托管符合服务进程状态的\
  \ Service 的进程。如果需要为高优先级进程释放额外内存，落入此类别的进程面临极高的终止风险。Android 维护着后台进程的动态列表，按时间顺序终止进程，因此最久未处于前台的进程会被首先杀死。\n\
  \n#### 12.2.5 空进程 (Empty Process)\n\n空进程不再包含任何活跃的应用程序，被保留在内存中，准备作为新启动应用程序的托管者。这在某种程度上类似于为了等待乘客到达而保持巴士车门敞开并引擎运转。显然，此类进程被认为是最低优先级，是第一个被杀死以释放资源的进程。\n\
  \n## 12.3 进程间依赖 (Inter-Process Dependencies)\n\n关于确定最高优先级进程的情况比前节概述的要稍微复杂，简单原因是进程之间往往是相互依赖的。因此，在判定进程的优先级时，Android\
  \ 系统还会考虑该进程是否正在以某种方式为另一个更高级的进程提供服务（例如，作为前台进程的内容提供者的服务进程）。根据基本规则，Android 文档规定，一个进程的排名永远不会低于它当前正在服务的另一个进程。\n\
  \n## 12.4 Activity 生命周期 (The Activity Lifecycle)\n\n正如我们之前确定的，Android 进程的状态在很大程度上取决于它托管的应用程序所包含的\
  \ Activity 和组件的状态。因此，理解这一点很重要：这些 Activity 在应用程序的执行生命周期内也会经历不同的状态。Activity 的当前状态部分由它在所谓的\
  \ Activity 栈（Activity Stack）中的位置决定的。\n\n## 12.5 Activity 栈 (The Activity Stack)\n\
  \n对于在 Android 设备上运行的每个应用程序，运行时系统都维护着一个 Activity 栈。当应用程序启动时，首先启动的应用程序 Activity 会被放入栈中。当启动第二个\
  \ Activity 时，它被放置在栈顶，而上一个 Activity 则被向下推。栈顶部的 Activity 被称为活跃（或运行中）的 Activity。当活跃\
  \ Activity 退出时，运行时会将其从栈中弹出，栈中紧邻其下方的 Activity 就会成为当前的活跃 Activity。例如，栈顶部的 Activity\
  \ 可能会因为其所负责的任务已完成而直接退出。或者，用户可能选择了屏幕上的“返回”按钮以返回到上一个 Activity，导致当前 Activity 被运行时系统从栈中弹出并被销毁。Android\
  \ Activity 栈的视觉表示见图 12-2。\n\n如图所示，新的 Activity 在启动时会被推入栈顶。当前活跃的 Activity 位于栈顶，直到它被新的\
  \ Activity 推向下移动，或者在它退出或用户导航到上一个 Activity 时被从栈中弹出。如果资源变得紧张，运行时将杀死 Activity，从栈底部的\
  \ Activity 开始。\n\nActivity 栈即为编程术语中所指的“后进先出”（LIFO）栈，因为最后一个推入栈的项是第一个被弹出栈的项。\n\n![android_activity_lifecycle_diagram.png](img/Image2447.jpg)\n\
  \n图 12-2\n\n## 12.6 Activity 状态 (Activity States)\n\n在应用程序内部的执行过程中，Activity 可以处于若干不同状态之一：\n\
  \n-   **活跃 / 运行中 (Active / Running)** – 该 Activity 位于 Activity 栈的顶端，是设备屏幕上可见的前台任务，拥有焦点并正在与用户交互。在资源短缺的情况下，这种\
  \ Activity 被终止的概率最低。\n-   **已暂停 (Paused)** – 该 Activity 对用户可见，但当前没有焦点（通常是因为该 Activity\
  \ 被当前活跃的 Activity 部分遮挡）。已暂停的 Activity 保留在内存中，保持连接到窗口管理器，保留所有状态信息，并在移动到 Activity\
  \ 栈顶端时可以快速恢复到活跃状态。\n-   **已停止 (Stopped)** – 该 Activity 当前对用户是不可见的的（换句话说，它在设备显示器上被其他\
  \ Activity 完全遮挡）。与已暂停的 Activity 一样，它保留了所有状态和成员信息，但在低内存情况下面临更高的终止风险。\n-   **已杀死 (Killed)**\
  \ – 该 Activity 被运行时系统终止以释放内存，不再存在于 Activity 栈中。如果应用程序需要，必须重新启动此类 Activity。\n\n###\
  \ 12.7 配置更改 (Configuration Changes)\n\n到本节为止，我们查看了导致 Android Activity 状态改变的两种原因，即\
  \ Activity 在前台和后台之间的移动，以及运行时系统为了释放内存而终止 Activity。事实上，还有第三种情况会导致 Activity 状态发生剧变，这涉及到设备配置的更改。\n\
  \n默认情况下，任何影响 Activity 外观的配置更改（例如在竖屏和横屏之间旋转设备，或更改系统字体设置）都会导致 Activity 被销毁并重新创建。这种背后的原因是此类更改影响了用户界面布局等资源，简单地销毁并重新创建受影响的\
  \ Activity 是响应配置更改最快的方法。然而，也可以配置 Activity，使其在响应特定的配置更改时不被重启。\n\n## 12.8 处理状态更改 (Handling\
  \ State Change)\n\n本章除了其他说明外，读者应该明确一点：应用程序以及根据定义包含其它的组件，在整个生命周期内将经历许多状态转换。特别重要的一点是，这些状态变化（包括完全终止）是由\
  \ Android 运行时根据用户操作和设备资源可用性施加给应用程序的。\n\n\n\n\n在实践中，这些状态更改并非完全在无通知的情况下强制发生，在大多数情况下，运行时系统会通知应用程序状态的变化，并给予其机会做出相应的反应。这通常涉及保存或恢复内部数据结构和用户界面状态，从而允许用户在应用程序之间无缝切换，并至少提供多个并发运行应用程序的假象。\n\
  \nAndroid 两种方法来处理应用内对象生命周期状态的变化。一种方法是响应操作系统的状态更改方法调用，这将在标题为“处理 Android Activity\
  \ 状态更改`的后续章节中详细介绍。\n\n另一种新方法（也是 Google 推荐的方法）涉及与 Jetpack Android 架构组件包含的生命周期类，这些类在“使用\
  \ Jetpack 构建现代 Android 应用架构”中引入，并在标题为“与 Android 生命周期感知组件一起工作`的章节中进行了更详细的解释。\n\n\
  ### 12.9 总结\n\n移动设备通常被认为资源受限，特别是在板载内存容量方面。因此，Android 操作系统的主要职责之一是确保应用程序以及整个操作系统对用户保持响应。\n\
  \n应用程序托管在 Android 的进程中。每个应用程序反过来又由以 Activity 和 Service 形式的组件组成。\n\nAndroid 运行时系统有权终止进程和单个\
  \ Activity 以释放内存。运行时系统在决定一个进程是否为合适的终止候选者时，会考虑进程状态。进程的状态很大程度上取决于该进程所托管的 Activity\
  \ 的状态。\n\n本章的核心信息是，应用程序在执行生命周期内会经历多种状态，并且对其在 Android 运行时环境中的命运几乎没有控制权。那些不直接与用户交互的进程和\
  \ Activity 面临着被运行时系统终止的较高风险。因此， Android 应用开发的一个基本元素是应用程序具备响应操作系统状态更改通知的能力。\n\n##\
  \ 13 处理 Android Activity 状态更改\n\n根据标题为“理解 Android 应用和 Activity 生命周期`的章节中概述的原理，现在显而易见，组成应用程序的\
  \ Activity 和 Fragment 在应用程序的生命周期期间会经历各种不同的状态。从一个状态到另一个状态的更改是由 Android 运行时系统强制的，因此在很大程度上超出了\
  \ Activity 自身的控制。然而，这并不意味着应用无法对这些更改做出反应并采取适当行动。\n\n本章的主要目标是提供 Activity 如何接收状态更改通知的高级概述，并概述建议保存或恢复状态信息的区域。在涵盖这些信息后，本章将简要触及\
  \ Activity 周期的话题。\n\n### 13.1 新旧生命周期技术\n\n直到最近，有一种标准方法可以向应用中构建生命周期感知能力。这是本章涵盖的方法，它涉及在\
  \ Activity 或 Fragment 实例中实现一组方法（每个生命周期状态对应一个），当该对象的生命周期状态更改时，操作系统会调用这些方法。这种方法自 Android\
  \ 操作系统早期以来一直保持不变，虽然它它在今天仍然是一个可行的选项，但它确实存在一些局限性，将在本章的稍后部分解释。\n\n随着 Jetpack Android\
  \ 架构组件引入了生命周期类，现在有了更好的生命周期处理方法。这种现代的生命周期管理方法（结合 Jetpack 组件和架构指南）将在后面的章节中详细介绍。然而，理解传统的生命周期方法仍然很重要，原因有几点：首先，作为一名\
  \ Android 开发人员，你无法完全隔绝传统的生命周期方法，并且仍会使用其中一些。更重要的是，理解处理生命周期的旧方法将为在书后部分开始学习新方法提供良好的知识基础。\n\
  \n### 13.2 Activity 和 Fragment 类\n\n在极少数例外，应用程序中的 Activity 和 Fragment 分别作为 Android\
  \ `AppCompatActivity` 类和 `Fragment` 类的子类被创建。\n\n例如，考虑在“在 Android Studio 中创建 Android\
  \ 示例`中创建并随后转换为使用视图绑定（view binding）的 AndroidSample 项目。将此项目加载到 Android Studio 环境中，并找到\
  \ `MainActivity.java` 文件（位于 `app -> java -> <your domain> -> androidsample`）。找到文件后，双击它将其加载到编辑器中，其内容应如下：\n\
  \n```java\npackage com.example.androidsample;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  \nimport android.view.View;\n\nimport android.os.Bundle;\n\nimport java.util.Locale;\n\
  \nimport com.example.androidsample.databinding.ActivityMainBinding;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n\n    private ActivityMainBinding binding;\n\
  \n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n    \
  \    super.onCreate(savedInstanceState);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n    }\n\n\
  \    public void convertCurrency(View view) {\n        if (!binding.dollarText.getText().toString().equals(\"\
  \")) {\n            float dollarValue = Float.parseFloat(binding.dollarText.getText().toString());\n\
  \            float euroValue = dollarValue * 0.85F;\n            binding.textView.setText(String.format(Locale.ENGLISH,\"\
  %f\", euroValue));\n        } else {\n            binding.textView.setText(R.string.no_value);\n\
  \        }\n    }\n}\n```\n\n在创建项目时，我们指示 Android Studio 创建了一个名为 `MainActivity` 的初始\
  \ Activity。如上述代码所示，`MainActivity` 类是 `AppCompatActivity` 类的子类。\n\n查看 `AppCompatActivity`\
  \ 类的参考文档可以发现它本身是 `FragmentActivity` 类的子类，而后者最终是 `Activity` 类的子类。可以在 Android Studio\
  \ 编辑器中使用层次级窗口来验证这一点。当 `MainActivity.java` 文件加载到编辑器中时，点击类声明行中的 `AppCompatActivity`\
  \ 并按下快捷键 `Ctrl-H`。层次级窗口随后出现，显示所选类的层次结构。正如图 13-1 所示，`AppCompatActivity` 显然继承自 `FragmentActivity`\
  \ 类，而后者最终是 `Activity` 类的子类：\n\n![](image/as_3.6_class_heirachy.jpg\n\n图 13-1\n\n\
  `Activity` 和 `Fragment` 类包含了一系列方法，旨在由 Android 运行时调用，以便在对象状态更改时通知对象。在本章中，我们将这些方法称为生命周期方法。Activity\
  \ 或 Fragment 类只需要重写这些方法并在其内部实现必要的功能，以便对状态更改做出相应反应。\n\n\n\n\n其中一种方法被命名为 `onCreate()`，再次回到上面的代码段，我们可以看到方法已经在\
  \ `MainActivity` 类中为我们重写并实现。在随后的章节中，我们将详细探讨 `onCreate()` 以及 `Activity` 和 `Fragment`\
  \ 类的其他相关构生命周期方法。\n\n### 13.3 动态状态 vs. 持久状态\n\n生命周期管理的一个核心目标是确保 activity 的状态在适当的时间保存并恢复。当我们在此背景下讨论“状态”时，指的是当前在\
  \ activity 中保存的数据以及用户界面的外观。例如，activity 可能在内存中维护一个数据模型，该模型需要保存到数据库、内容提供程序或文件中。这种状态信息因为其从应用程序的一次调用到下一次调用都持续存在，因此被称为**持久化状态**（persistent\
  \ state）。\n\n用户界面的外观（例如输入到文本框但尚未提交到应用程序内部数据模型的文本）被称为**动态状态**（dynamic state），因为它通常只在应用程序的单次调用期间保留（也称为用户界面状态或实例状态）。\n\
  \n理解这两种状态之间的区别是非常重要的，因为它们的保存方式以及保存的原因都是不同的。\n\n保存持久化状态的目的是避免 activity 在后台被运行时系统杀死而导致的数据丢失。另一方面，动态状态的保存和恢复的原因要稍微复杂一些。\n\
  \n例如，假设应用程序包含一个 activity（我们将其称为 `Activity A`），该 activity 包含一个文本框和一些单选按钮。在使用应用程序的过程中，用户在文本框中输入了一些文本，并在单选按钮上进行了选择。然而，在执行保存这些更改的操作之前，用户切换到了另一个\
  \ activity，导致 `Activity A` 被推入 Activity 栈并置于后台。一段时间后，运行时系统确定内存不足，因此杀杀了 `Activity\
  \ A` 以释放资源。然而，对于用户来说，`Activity A` 仅仅是被置于后台，并准备好随时移动到前台。当将 `Activity A` 回到前台时，用户理所当然地预期输入的文本和单选按钮的选择已被保留。然而，在这种情况下，将创建一个\
  \ `Activity A` 的新实例，如果动态状态没有被保存和恢复，之前的用户输入就会丢失。\n\n因此，保存动态状态的主要目的是提供一种在在前台和后台活动\
  \ 之间进行无缝切换的感知，无论活动实际上可能在用户不知情的情况下被杀死并重启。\n\n保存持久化状态和动态状态的机制将在本章的后续章节中变得更加清晰。\n\n\
  ### 13.4 Android 生命周期方法\n\n如前所述，`Activity` 和 `Fragment` 类包含许多生命周期方法，这些方法在实例状态发生时充当事件处理器。Android\
  \ `Activity` 和 `Fragment` 类支持的主要方法如下：\n\n- `onCreate(Bundle savedInstanceState)`\
  \ – 当 activity 首次创建时调用的方法，是执行大多数初始化任务的理想位置。该方法接收一个以 `Bundle` 对象形式的参数，该对象可能包含来自 activity\
  \ 之前调用的动态状态信息（通常与用户界面状态有关）。\n- `onRestart()` – 当 activity 在之前被运行时系统停止后准备重新启动时调用。\n\
  - `onStart()` – 始终在调用 `onCreate()` 或 `onRestart()` 方法后立即调用，此方法指示 activity 它即将对用户可见。如果\
  \ activity 移动到 activity 栈的顶端，则此调用将随后调用 `onResume()`；如果它被另一个 activity 推入栈中，则调用 `onStop()`。\n\
  - `onResume()` – 表示 activity 现在处于 activity 栈的顶端，并且是用户当前正在交互的 activity。\n- `onPause()`\
  \ – 表示之前的 activity 即将成为前台活动。此调用将根据 activity 是移回前台还是对用户不可见，随后调用 `onResume()` 或 `onStop()`\
  \ 方法。可以在此方法中采取措施存储尚未被应用保存的持久化状态信息。为了避免切换 activity 之间的延迟，应避免在此方法中执行耗时较的操作，如将数据存储到数据库或执行网络操作。此方法还应该停止任何\
  \ CPU 密集型任务（如动画）。\n- `onStop()` – activity 现在对用户不再可见。此此调用之后可能出现两种场景：如果 activity\
  \ 再次移动到前台，则调用 `onRestart()`；如果 activity 正在被终止，则调用 `onDestroy()`。\n- `onDestroy()`\
  \ – activity 即将被销毁，可能是因为 activity 完成了任务并调用了 `finish()` 方法，也可能是因为运行时为了释放内存或由于配置更改（例如设备方向改变）而正在终止它。需要注意的是，当\
  \ activity 终止时，并不总是调用 `onDestroy()`。\n- `onConfigurationChanged()` – 当发生配置更改且 activity\
  \ 已指示不要重新启动时调用。该方法传递一个概述新设备配置的 `Configuration` 对象，然后由 activity 对对更改做出反应。\n\n以下生命周期方法仅适用于\
  \ `Fragment` 类：\n\n- `onAttach()` - 当 fragment 分配给一个 activity 时调用。\n- `onCreateView()`\
  \ – 用于创建并返回 fragment 的用户界面布局视图层级。\n- `onViewCreated()` – 在 `onCreateView()` 返回后调用。\n\
  - `onViewRestored()` – fragment 保存的视图层级已恢复。\n\n除了上述生命周期方法外，还有两个专门用于保存和恢复 activity\
  \ 动态状态的方法：\n\n- `onRestoreInstanceState(Bundle savedInstanceState)` – 当 activity\
  \ 从之前保存状态的状态重新启动时，在调用 `onStart()` 方法之后立即调用。与 `onCreate()` 类似，该方法传递包含之前状态数据的 `Bundle`\
  \ 对象。此方法通常用于在 `onCreate()` 和 `onStart()` 完成 activity 初始化后恢复之前状态的场景。\n- `onSaveInstanceState(Bundle\
  \ outState)` – 在 activity 销毁之前调用，以便保存当前的动态状态（通常与用户界面有关）。该方法传递一个应保存状态的 `Bundle` 对象，该对象在\
  \ activity 重启时会被传递给 `onCreate()` 和 `onRestoreInstanceState()` 方法。请注意，此方法仅在运行时确定需要保存动态状态时才会被调用。\n\
  \n在重写上述方法时，请记住除了 `onRestoreInstanceState()` 和 `onSaveInstanceState()` 之外，方法实现必须包含对父类相应方法的调用。例如，下面的方法重写了\
  \ `onRestart()` 方法，但也包含了对父类实例方法的调用：\n\n```java\nprotected void onRestart() {\n \
  \        super.onRestart();\n}\n```\n\n\n\n\n\n```java\nLog.i(TAG, \"onRestart\"\
  );\n\n}\n```\n\n如果在方法重写中未能调用此父类方法，会导致运行时在执行期间抛出异常。虽然在 `onRestoreInstanceState()`\
  \ 和 `onSaveInstanceState()` 方法中调用父类方法是可选的（例如，在实现自定义保存和恢复行为时可以省略它们），但使用这些方法有显著的好处，这一主题将在名为保存和恢复\
  \ Android Activity 状态的章节中介绍。\n\n### 13.5 生命周期 (Lifetimes)\n\n最后一个要涵盖的主题涉及对 activity\
  \ 或 fragment 在执行过程中将经历的整个、可见和前台生命周期的概述：\n\n- **整个生命周期 (Entire Lifetime)** – “整个生命周期”一词用于描述从初始调用\
  \ `onCreate()` 方法到对象终止前调用 `onDestroy()` 之间发生的一切。\n- **可见生命周期 (Visible Lifetime)**\
  \ – 涵盖了调用 `onStart()` 和 `onStop()` 之间的执行期间。在此期间，activity 或 fragment 对用户是可见的，但可能不是用户当前交互的对象。\n\
  - **前台生命周期 (Foreground Lifetime)** – 指在调用 `onResume()` 和 `onPause()` 方法之间的执行期间。\n\
  \n需要注意的是，一个 activity 或 fragment 在整个生命周期期间可能会多次经过前台和可见生命周期。\n\n生命周期和生命周期方法的概念在图 13-2\
  \ 中所示所示：\n\n![android_activity_lifecycle_methods.png](img/Image2446.jpg)\n\n图 13-2\n\
  \n### 13.6 折叠屏设备与多恢复 (Foldable Devices and Multi-Resume)\n\n正如之前讨论的，当 activity 移动到前台并是用户当前交互的\
  \ activity 时，它被认为处于恢复状态。在标准设备上，应用程序在任何时候只能有一个处于恢复状态的 activity，而所有其他 activity 可能处于暂停或停止状态。\n\
  \n从一段时间以来，Android 包含了多窗口支持，允许多个 activity 同时在分屏或自由窗口配置中出现。虽然该功能最初主要用于大屏幕平板设备，但随着折叠屏设备的引入，这一功能可能会变得更加流行。\n\
  \n在运行 Android 10 且启用了多窗口支持的设备上（大多数折叠屏设备如此），多个应用 activity 可能同时处于恢复状态（这种概念被称为“多恢复”），允许这些可见的\
  \ activity 在另一个 activity 当前拥有焦点的同时继续运行功能（例如流流媒体内容或更新视觉数据）。尽管多个 activity 可以处于恢复状态，但这些\
  \ activity 中只有一个会被视为最顶层的恢复状态 activity（换句话说，就是用户最近交互的 activity）。\n\nactivity 可以通过实现\
  \ `onTopResumedActivityChanged()` 回调方法来接收其获得或丢失顶层恢复状态的通知。\n\n### 13.7 禁用配置更改重启 (Disabling\
  \ Configuration Change Restarts)\n\n正如之前概述的，activity 可以指明在某些配置更改发生时不重新启动。这是通过在项目清单文件（manifest）的\
  \ activity 元素中添加 `android:configChanges` 指令实现的。例如，下面的清单文件片段表明，当发生与方向或全局字体大小相关的配置更改时，不应重启\
  \ activity：\n\n```xml\n<activity android:name=\".MainActivity\"\n          android:configChanges=\"\
  orientation|fontScale\"\n          android:label=\"@string/app_name\">\n```\n\n\
  ### 13.8 生命周期方法的局限性 (Lifecycle Method Limitations)\n\n正如在本章开头讨论的那样，生命周期方法已经使用了多年，直到最近，它们仍然处理\
  \ activity 和 fragment 生命周期周期状态变化的唯一机制。然而，这种方法存在一些缺点。\n\n生命周期方法的一个问题是，它们没有为 activity\
  \ 或 fragment 提供在应用执行期间任何给定点轻松查找当前生命周期状态的方法。相反，对象需要在内部跟踪状态，或者等待下一次生命周期方法的调用。\n\n\
  此外，这些方法没有提供一种简单的方法让一个对象观察应用内其他对象的生命周期状态变化。这是一个严重的考虑因素，因为应用中的许多其他对象都可能受到特定 activity\
  \ 或 fragment 生命周期周期状态变化的影响。\n\n生命周期方法仅适用于 `Fragment` 和 `Activity` 类的子类。因此，无法构建出真正感知生命周期的自定义类。\n\
  \n最后，生命周期方法导致大部分的生命周期处理代码被写在 activity 或 fragment 内部，这可能导致复杂且易出错的代码。理想情况下，这些代码大部分应该位于受状态变化影响的其他类中。例如，一个流媒体视频的应用程序可能包含一个专门设计用于管理输入流的类。如果应用需要在主\
  \ activity 停止时暂停流，那么执行此操作的代码应该位于流媒体类中，而不是主 activity 中。\n\n所有这些以及更多问题都可以通过感知生命周期组件（lifecycle-aware\
  \ components）解决，该主题将从名为使用 Jetpack 构建现代 Android 应用架构的章节开始介绍。\n\n### 13.9 总结\n\n所有的\
  \ activity 都派自 `Android Activity` 类，该类反过来包含了许多生命周期方法，这些方法设计用于在 activity 状态改变时运行时系统调用。同样`Fragment`\
  \ 类包含了许多类似的方法。通过重写这些方法，activity 和 fragment 可以对状态变化做出响应，并在必要采取步骤保存并恢复 activity 以及应用程序的当前状态。生命周期状态可以被认为有两种形式。持久化状态指的是在应用程序调用之间需要存储的数据（例如存储到文件或数据库）。而动态状态则关系到用户界面的当前显示。\n\
  \n尽管生命周期方法具有可以通过感知生命周期组件避免的许多局限性，但理解这些方法对于充分理解书中后面介绍的新生命周期管理方法至关重要。\n\n### 14 示例\
  \ Android Activity 状态变化\n\n之前的章节已经详细讨论了构成 Android 应用程序的 activity 的状态和生命周期。在本章中，我们将通过创建一个示例应用程序将处理\
  \ activity 状态变化的理论付诸实践。该示例应用程序的目的是为 activity 在 Android 运行时通过各种不同状态提供真实演示。在下一章中，名为[保存和恢复\
  \ Android Activity 状态](#Activity_Restore_State.xhtml__idTextAnchor332），在本章构建的示例项目将得到扩展，以演示动态\
  \ activity 状态的保存和恢复。\n\n#### 14.1 创建状态变化示例项目\n\n\n\n\n\n# 引言\n\n此练习的第一步是创建一个新项目。首先启动\
  \ `Android Studio`，如有必要，使用 `File` -> `Close Project` 菜单关闭任何当前打开的项目，以便显示欢迎界面。\n\n\
  在欢迎界面上选择 `New Project` ，并在弹出的新项目对话框中，点击 `Next` 按钮之前选择 `Empty Activity` 模板。\n\n在\
  \ `Name` 字段中输入 `StateChange`，并指定 `com.ebookfrenzy.statechange` 为包名。在点击 `Finish`\
  \ 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将 `Language` 菜单改为\
  \ `Java`。项目创建过程完成后，`StateChange` 项目应列位于 `Android Studio` 主窗口左侧的 `Project` 工具窗口中。请按照章节\
  \ 11.8 将项目迁移到 View Binding 中概述的步骤将项目转换为使用 view binding。\n\n接下来的操作涉及设计 activity 的用户界面。该界面存储在名为\
  \ `activity_main.xml` 的文件中，该文件应该已经加载到 `Layout Editor` 工具中。如果没有，请在 `project` 工具窗口中导航到它，可以在\
  \ `app` -> `res` -> `layout` 文件夹找到它。找到后，双击该文件将将其加载到 `Android Studio Layout Editor`\
  \ 工具中。\n\n![](img/as_4.2_statechange_layout_editor.jpg)\n\n图 14-1\n\n### 14.2 设计用户界面\n\
  \n当用户界面布局加载到 `Layout Editor` 工具后，现在是为示例应用程序设计用户界面了。与用户界面设计中目前的“Hello World!” `TextView`\
  \ 不同，activity 实际上需要一个 `EditText` 视图。在 `Layout Editor` 画布上选择 `TextView` 对象，并按下键盘上的\
  \ `Delete` 键将其从设计中删除。\n\n从位于 `Layout Editor` 左侧的 `Palette` 中，选择 `Text` 类别，并在文本组件列表中点击并拖动\
  \ `Plain Text` 组件到设备屏幕的可视表示上。将组件移动到显示器中心，直到出现中心引导线，然后将其释放到位，使布局类似于图 14-2。\n\n![](img/as_3.6_state_change_ui.jpg)\n\
  \n图 14-2\n\n使用 `EditText` 控件时，必须为视图指定输入类型。这仅定义了用户将输入的文本或数据类型。例如，如果输入类型设置为 `Phone`，则用户被限制在视图中输入数字。或者，如果输入类型设置为\
  \ `TextCapCharacters`，则输入将默认为大写字母。输入类型设置也可以进行组合。\n\n出于本示例的考虑，我们将输入类型设置为支持普通文本输入。为此，请选择布局中的\
  \ `EditText` 控件，并在 `Attributes` 工具窗口中找到 `inputType` 条目。点击当前设置左侧的标志图标打开选项列表，并在点击\
  \ `Apply` 按钮之前，在列表中关闭 `textPersonName` 并启用 `text`。留在 `Attributes` 工具窗口中，将视图的 `id`\
  \ 更改为 `editText`，并点击弹出的对话框中的 `Refactor` 按钮。\n\n默认情况下，`EditText` 显示读取为“Name”的文本。留在\
  \ `Attributes` 面板中，从 `text` 属性字段中删除此内容，使视图在布局中保持空白。\n\n在继续之前，点击布局编辑器工具栏上的 `Infer\
  \ Constraints` 按钮以添加任何缺失的约束。\n\n## 14.3 重写 Activity 生命周期方法\n\n此时，项目包含一个名为 `MainActivity`\
  \ 的单 activity，它派生自 `AppCompatActivity` 类。该 activity 的源代码包含在 `MainActivity.java`\
  \ 文件中，该文件已经在编辑器会话中打开并由编辑器标签栏中的标签页表示。如果文件不再打开，请在 `Project` 工具窗口面板中导航它（`app` -> `java`\
  \ -> `com.ebookfrenzy.statechange` -> `MainActivity`）并双击它将文件加载到编辑器。\n\n到为止，activity\
  \ 重写的唯一生命方法是 `onCreate()` 方法，该方法已实现为在设置 activity 的用户界面之前调用 `super` 类实例的方法。我们现在将修改此方法，使其在每次执行时都在\
  \ `Android Studio Logcat` 面板中输出诊断消息。为此，我们将使用 `Log` 类，这需要导入 `android.util.Log` 并声明一个标记，以便我们能够在日志输出中过滤这些消息：\n\
  \n```java\npackage com.ebookfrenzy.statechange;\n\nimport android.util.Log;\nimport\
  \ androidx.annotation.NonNull;\nimport android.view.View;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private ActivityMainBinding binding;\n    private\
  \ static final String TAG = \"StateChange\";\n\n    @Override\n    protected void\
  \ onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        binding = ActivityMainBinding.inflate(getLayoutInflater());\n        View\
  \ view = binding.getRoot();\n        setContentView(view);\n        Log.i(TAG, \"\
  onCreate\");\n    }\n}\n```\n\n下一个任务是重写一些方法，每个方法都包含一个日志调用。这些重写方法可以手动添加，也可以使用 Android\
  \ Studio 代码编辑器章节中概述的 `Alt-Insert` 快捷键生成。注意，日志调用仍需要手动添加：\n\n```java\n@Override\n\
  protected void onStart() {\n    super.onStart();\n    Log.i(TAG, \"onStart\");\n\
  }\n\n@Override\nprotected void onResume() {\n    super.onResume();\n    Log.i(TAG,\
  \ \"onResume\");\n}\n\n@Override\nprotected void onPause() {\n    super.onPause();\n\
  \    Log.i(TAG, \"onPause\");\n}\n\n@Override\nprotected void onStop() {\n    super.onStop();\n\
  \    Log.i(TAG, \"onStop\");\n}\n\n@Override\nprotected void onRestart() {\n   \
  \ super.onRestart();\n    Log.i(TAG, \"onRestart\");\n}\n\n@Override\nprotected\
  \ void onDestroy() {\n    super.onDestroy();\n    Log.i(TAG, \"onDestroy\");\n}\n\
  \n@Override\nprotected void onSaveInstanceState(@NonNull outState) {\n    super.onSaveInstanceState(outState);\n\
  \    Log.i(TAG, \"onSaveInstanceState\");\n}\n\n@Override\nprotected void onRestoreInstanceState(@NonNull\
  \ savedInstanceState) {\n    super.onRestoreInstanceState(savedInstanceState);\n\
  \    Log.i(TAG, \"onRestoreInstanceState\");\n}\n```\n\n### 14.4 过滤 Logcat 面板\n\n\
  添加到 `MainActivity.java` 重写方法中的代码目的是是将日志信息输出到 `Logcat` 工具窗口。此输出可以配置为显示与设备或模拟器会话相关事件，或者限制为与当前选定应用程序相关的事件。输出也可以进一步限制为仅匹配指定过滤器的日志事件。\n\
  \n当在当前应用程序运行时显示时，`Logcat` 工具窗口将如下方的图 14-3 所示：\n\n![](img/as_logcat_tool_window.jpg)\n\
  \n图 14-3\n\n\n\n\n\n上图中标记为 A 的菜单允许你选择显示日志输出的设备或模拟器。此输出显示在标记为 C 的输出面板中。通过在标记为 B 的字段中输入选项，可以对日志输出进行过滤。默认设置\
  \ `package:mine` 将输出限制为由当前应用包（在本例中为 `com.ebookfrenzy.statechange`）生成的日志消息。留空此字段将允许显示来自所选设备或模拟器的日志输出，包括由操作系统生成的诊断消息。也可以组合键值以进一步过滤输出。例如，我们可以配置\
  \ Logcat 面板，使其仅显示与我们的 `StateChange` 标签相关的消息，如下所示：\n\n```\npackage:mine tag:StateChange\n\
  ```\n\n我们还可以通过在键值前加上一个负号（-）来排除输出。除了 `StateChange` 标签外，我们可能还有使用名为“OtherTag”的不同标签的诊断消息。为了过滤日志以排除第二个标签的输出，我们可以输入以下键选项：\n\
  \n```\npackage:mine tag:StateChange -tag:OtherTag\n```\n\n除了你自己的标签值外，还可以从 Android\
  \ 内置的一系列预定义诊断标签中进行选择。当你向过滤字段输入内容时，Logcat 将显示匹配的标签列表，如图 14-4 所示：\n\n![](img/as_logcat_tool_window_tags.jpg)\n\
  \n图 14-4\n\nlevel 键可以根据严重性控制显示哪些消息。要过滤掉除错误消息以外的所有消息，将使用以下键：\n\n```\nlevel:error\n\
  ```\n\n除了 error 之外，Logcat 面板支持 verbose、info、warn 和 assert 级别设置。\n\nLogcat 还支持多个日志面板，每个面板都有自己的过滤设置。要添加另一个面板，请点击上方图\
  \ 14-3 中标记为 D 的 + 按钮。使用相应的标签在不同面板之间切换，或者通过右键点击当前显示的面板并选择 `Split-Right` 或 `Split-Down`\
  \ 菜单选项来水平或垂直排列面板。要重命名面板，请右键点击标签并选择 `Rename Tab` 选项。在继续之前，关闭除一个以外的所有 Logcat 面板并按如下配置过滤器：\n\
  \n```\npackage:mine tag:StateChange\n```\n\n### 14.5 运行应用程序\n\n为了获得最佳结果，应在物理 Android\
  \ 设备或模拟器上运行应用程序。配置设备并连接到开发电脑后，点击 Android Studio 工具栏中绿色三角形表示的运行按钮，如下方的图 14-5 所示，选择\
  \ `Run -> Run…` 菜单选项或使用键盘快捷键 `Shift+F10`：\n\n![](img/as_run_button1.jpg)\n\n图 14-5\n\
  \n如果出现 `Choose Device` 对话框，请从中选择物理 Android 设备或模拟器（假设你尚未将其配置为默认目标）。在 Android Studio\
  \ 构建应用程序并将其安装到设备后，它应该启动并在前台运行。\n\n查看 Logcat 面板应指示到目前为止触发了哪些方法：\n\n![](img/as_logcat_statechange_output.jpg)\n\
  \n图 14-6\n\n### 14.6 实验 Activity\n\n诊断功能工作正常后，现在是时候运行应用程序来理解 Activity 生命周期状态变化了。首先，考虑\
  \ Logcat 面板中的初始日志事件序列：\n\n```\nonCreate\nonStart\nonResume\n```\n\n显然，初始状态的变化与“理解\
  \ Android 应用和 Activity 生命周期”中概述的完全一致。但请注意，并没有调用 `onRestoreInstanceState()`，因为 Android\
  \ 运行时检测到在这种情况下没有需要恢复的状态。\n\n点击设备显示屏底部状态栏上的 Home 图标，并注意日志中报告的方法调用序列，如下：\n\n```\n\
  onPause\nonStop\nonSaveInstanceState\n```\n\n在这种情况下，运行时注意到 Activity 不再处于前台，对用户不可见，并停止了该\
  \ Activity，但并不是没有给 Activity 提供保存动态状态的机会。取决于运行时最终是销毁了 Activity 还是简单地重新启动了它，Activity\
  \ 将通过调用 `onRestart()` 通知其已重启，或者当用户返回 Activity 时再次通过创建序列。\n\n正如“理解 Android 应用和 Activity\
  \ 生命周期”所述，Activity 的销毁和重建可以通过对设备进行配置更改触发，例如从竖屏旋转到横屏。要看到这一过程，只需在 `StateChange` 处于前台时旋转设备。使用模拟器时，可以使用模拟器工具栏上的旋转按钮来模拟设备旋转。为了完成旋转，可能还需要点击旋转按钮。它显示在设备或模拟器屏幕的底部，如图\
  \ 14-7 所示：\n\n![](img/as_4.1_rotate_screen_button.jpg)\n\n图 14-7\n\n日志中产生的方法调用序列应如下：\n\
  \n```\nonPause\nonStop\nonSaveInstanceState\nonDestroy\nonCreate\nonStart\nonRestoreInstanceState\n\
  onResume\n```\n\n显然，运行时系统在销毁和重启之前给了 Activity 一个保存状态的机会。\n\n### 14.7 总结\n\n“一画胜千言”的老谚语在学习新范式的示例中同样适用。在本章中，我们创建了一个\
  \ Android 应用程序，用于演示 Activity 可能经过的不同生命周期状态。在本章项目的过程中，我们还查看了从 内部生成诊断信息的机制。\n\n在下一章中，我们将扩展\
  \ StateChange 示例项目，演示如何保存和恢复 Activity 的动态状态。\n\n### 15. 保存和恢复 Android Activity 的状态\n\
  \n如果前面的几章达到了目标，现在对于保存和恢复界面状态的重要性应该更清晰了。在本章中，我们将扩展在 Android Activity 状态示例中创建的应用程序，演示当\
  \ Activity 被运行时系统销毁和重建时保存和恢复状态的步骤。\n\n### 15.1 保存动态状态\n\n正如我们已经学的，Activity 通过运行时调用其实现的\
  \ `onSaveInstanceState()` 方法获得保存动态状态信息的机会。作为参数传递给方法的是一个 `Bundle` 对象的引用，该方法需要向其中存储任何需要保存的动态数据。随后，`Bundle`\
  \ 对象由运行时系统代表 Activity 进行存储，并在调用 Activity 的 `onCreate()` 和 `onRestoreInstanceState()`\
  \ 方法时，将其作为参数传递回来。然后，可以在这些方法中从 `Bundle` 对象中检索数据并用于恢复 Activity 的状态。\n\n\n\n\n\n在上一章中，`StateChange`\
  \ 示例应用程序的诊断输出显示，当运行该程序的设备旋转足够以触发方向变化时，活动会经历一系列状态更改。\n\n再次启动 `StateChange` 应用程序，并在执行设备旋转之前向\
  \ `EditText` 字段中输入一些文本（在运行 Android 9 或更高版本的设备或模拟器上，可能需要点击状态栏中的旋转按钮来完成旋转）。旋转设备后，`Logcat`\
  \ 窗口中将出现以下状态更改序列：\n\n```\nonPause\nonStop\nonSaveInstanceState\nonDestroy\nonCreate\n\
  onStart\nonRestoreInstanceState\nonResume\n```\n\n显而易见，这导致了活动被销毁并重建。然而，检查运行中应用程序的用户界面，应该发现输入到\
  \ `EditText` 字段中的文本被保留了。鉴于活动被销毁并重建了，而且我们没有添加任何特定代码来确保文本被保存和恢复，这种行为需要一些解释。\n\n事实上，Android\
  \ SDK 包含的大多数视图控件（view widgets）已经实现了在活动重启时自动保存和恢复状态所需的必要行为。启用此行为的唯一要求是活动中的 `onSaveInstanceState()`\
  \ 和 `onRestoreInstanceState()` 覆盖方法必须包含对父类等效方法的调用：\n\n```java\n@Override\nprotected\
  \ void onSaveInstanceState(@NonNull Bundle outState) {\n    super.onSaveInstanceState(outState);\n\
  }\n\n@Override\nprotected void onRestoreInstanceState(@NonNull Bundle savedInstanceState)\
  \ {\n    super.onRestoreInstanceState(savedInstanceState);\n}\n```\n\n可以通过在 XML\
  \ 布局文件中将 `android:saveEnabled` 属性设置为 `false` 来禁用用户界面视图的自动状态保存。为了示例目的，我们将禁用用户界面布局中\
  \ `EditText` 视图的自动状态保存机制，然后向应用程序添加代码以手动保存和恢复视图的状态。\n\n要配置 `EditText` 视图以便在活动重启时时不保存和恢复状态，请编辑\
  \ `activity_main.xml` 文件，使视图的条目如下所示（注意可以通过点击 Layout Editor 面板底部的 Text 标签页直接编辑 XML）：\n\
  \n```xml\n<EditText\n    android:id=\"@+id/editText\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:ems=\"10\"\
  \n    android:inputType=\"text\"\n    android:saveEnabled=\"false\"\n    app:layout_constraintBottom_toBottomOf=\"\
  parent\"\n    app:layout_constraintEnd_toEndOf=\"parent\"\n    app:layout_constraintStart_toStartOf=\"\
  parent\"\n    app:layout_constraintTop_toTopOf=\"parent\" />\n```\n\n做出更改后，运行应用程序，输入文本并旋转设备，以验证文本不再被保存和恢复。\n\
  \n### 15.3 Bundle 类\n\n对于需要在用户界面视图组件提供的默认功能之外保存状态的情况，`Bundle` 类提供了一个容器，用于使用键值对机制存储数据。键的形式为字符串值，而与这些键关联的值可以是原始类型值或任何实现了\
  \ `Parcelable` 接口的对象。许多类已经实现了 `Parcelable` 接口。可以通过实现 `Parcelable` 接口中定义的一组方法来使自定义类变为“可序列化的”，详细信息可以在\
  \ Android 文档中找到：\n\nhttps://developer.android.com/reference/android/os/Parcelable.html\n\
  \n`Bundle` 类还包含一组方法，可用于获取和设置各种数据类型的键值对，包括原始类型（包括 Boolean、char、double 和 float 值）和对象（如\
  \ `Strings` 和 `CharSequences`）。\n\n为了本示例，并且已经禁用了 `EditText` 视图的文本自动保存，我们需要确保用户输入\
  \ `EditText` 字段的文本被保存到 `Bundle` 对象中并在随后恢复。这将演示如何在 Android 应用程序中手动保存和恢复状态，并将分别使用\
  \ `Bundle` 类的 `putCharSequence()` 和 `getCharSequence()` 方法来实现。\n\n### 15.4 保存状态\n\
  \n扩展 `StateChange` 应用程序的第一步是确保在 `MainActivity` 类的 `onSaveInstanceState()` 方法中从 `EditText`\
  \ 组件提取用户输入的文本，然后将其作为键值对保存到 `Bundle` 对象中。\n\n要从 `EditText` 对象提取文本，我们首先需要在用户界面中识别该对象。显而易见，这涉及到活动的\
  \ Java 代码（包含在 `MainActivity.java` 源码文件中）与用户界面 XML 表示（包含在 `activity_main.xml` 资源文件中）之间的差距。为了提取输入到\
  \ `EditText` 组件的文本，我们需要访问该用户界面对象。\n\n用户界面中的每个组件都关联有一个唯一标识符。默认情况下，Layout Editor 工具根据对象类型为新添加的组件构建\
  \ `id`。如果布局中包含多个相同类型的视图，则类型名称后会跟一个顺序数字（尽管开发者可以并且应该将其更改为更有意义的内容）。正如在 Android Studio\
  \ 主窗口中选中 `activity_main.xml` 文件并显示 Layout Editor 时通过检查 Component Tree（组件树）面板所示，`EditText`\
  \ 组件被分配了 id `editText`：\n\nimage/as_4.1_state_.jpg\n\n图 15-1\n\n我们现在可以通过对象的 `getText()`\
  \ 方法获取 `editText` 视图包含的文本：\n\n```java\nCharSequence userText = binding.editText.getText();\n\
  ```\n\n最后，我们可以使用 `Bundle` 对象的 `putCharSequence()` 方法保存文本，传递键（可以是任何字符串值，但在本例中我们声明为“savedText”）和\
  \ `userText` 对象作为参数：\n\n```java\noutState.putCharSequence(\"savedText\", userText);\n\
  ```\n\n将这一切整合在一起，我们在 `MainActivity.java` 文件中修改后的 `onSaveInstanceState()` 方法如下：\n\
  \n```java\n@Override\nprotected void onSaveInstanceState(@NonNull Bundle outState)\
  \ {\n    super.onSaveInstanceState(outState);\n    Log.i(TAG, \"onSaveInstanceState\"\
  );\n    CharSequence userText = binding.editText.getText();\n    outState.putCharSequence(\"\
  savedText\", userText);\n}\n```\n\n现在已经了保存状态的步骤，下一步是确保在需要时恢复它。\n\n### 15.5 恢复状态\n\
  \n保存的动态状态可以在那些将 `Bundle` 对象作为参数的生命周期方法中恢复。这让开发者可以选择使用 `onCreate()` 或 `onRestoreInstanceState()`。使用哪种方法取决于活动的性质。在执行活动初始化任务后最好恢复状态的情况下，`onRestoreInstanceState()`\
  \ 方法通常更合适。为了本示例目的，我们将在 `onRestoreInstanceState()` 方法中添加代码，使用“savedText”键从 `Bundle`\
  \ 中提取保存的状态。然后我们可以使用对象的 `setText()` 方法将文本显示在 `editText` 组件上：\n\n```java\n@Override\n\
  protected void onRestoreInstanceState(@NonNull Bundle savedInstanceState) {\n  \
  \  super.onRestoreInstanceState(savedInstanceState);\n}\n```\n\n\n\n\n\n```java\n\
  Log.i(TAG, \"onRestoreInstanceState\");\n\nCharSequence userText =\n    savedInstanceState.getCharSequence(\"\
  savedText\");\n\nbinding.editText.setText(userText);\n}\n```\n\n### 15.6 测试应用程序\n\
  \n剩下的工作就是再次构建并运行 StateChange 应用程序。运行并处于前台状态时，触摸 `EditText` 组件，并在设备旋转到另一个方向之前输入一些文本。此前文本的更改会丢失，但得益于我们在本章中向活动中添加的代码，新文本将保留在\
  \ `editText` 组件中。\n\n验证代码执行结果符合预期后，注释掉这两个方法中的 `super.onSaveInstanceState()` 和 `super.onRestoreInstanceState()`\
  \ 调用，重新启动应用并注意设备旋转后文本仍然被保留。默认的保存和恢复系统本质上被自定义实现取代，从而提供了一种在活动内部动态且选择性保存和恢复状态的方法。\n\
  \n### 15.7 总结\n\nAndroid 应用中动态状态的保存和恢复只需要在适当生命周期方法中实现适当的代码。对于大多数界面视图，这由 `Activity`\
  \ 超类自动处理。在其他情况下，这通常包括在 `onSaveInstanceState()` 方法中提取值和设置，并将数据以键值对的形式保存到运行时系统传递给活动的\
  \ `Bundle` 对象中。\n\n可以在活动的 `onCreate()` 或 `onRestoreInstanceState()` 方法中，通过从 `Bundle`\
  \ 对象中提取值并根据存储的值更新活动，从而恢复状态。\n\n在本章中，我们使用了这些技术更新了 StateChange 项目，使 `Activity` 能够在活动的销毁及随后的重建过程中保留更改。\n\
  \n## 16 理解 Android 视图、视图组和布局\n\n除了可能收流流音频外，用户与 Android 设备的交互本质上主要是视觉和触觉的。所有这些交互都通过设备上安装的应用的用户界面进行，包括内置应用和用户安装的任何第三方应用。因此，开发\
  \ Android 应用的一个关键要素涉及用户界面的设计和创建，这并不令人意外。\n\n在本章中，将涵盖 Android 用户界面结构的主题，并概述组成用户界面的不同元素；即视图（Views）、视图组（View\
  \ Groups）和布局（Layouts）。\n\n### 16.1 为不同的 Android 设备进行设计\n\n“Android 设备”一词涵盖了具有不同屏幕尺寸和分辨率的海量平板电脑和智能手机产品。因此，应用程序的用户界面现在必须经过仔细设计，以确保在尽可能广泛的显示尺寸上正确显示。其关键部分之一是确保用户界面布局在不同设备上运行时能够正确调整缩放。这在很大程度上可以通过仔细的规划以及使用本章概述的布局管理器来实现。\n\
  \n同样重要的是，大多数基于 Android 的智能手机和平板电脑都可以用户以竖屏或横屏模式手持。设计良好的用户界面应该能够适应这些变化，并进行合理的布局调整，以利用每种方向下的可用屏幕空间。\n\
  \n### 16.2 视图和视图组\n\n用户界面中的每项内容都是 Android `View` 类的子类（准确来说是 `android.view.View`）。Android\
  \ SDK 提供了一套预构建视图，用于构建用户界面。典型示例包括标准项，如 `Button`、`CheckBox`、`ProgressBar` 和 `TextView`\
  \ 类。这些视图也被称为小部件（widgets）或组件。对于 SDK 提供的小部件无法满足的需求，可以通过子类并扩展现有类来创建新视图，或者通过直接在 `View`\
  \ 类之上构建创建一个全新的组件。\n\n一个视图也可以由多个其他视图（也称为复合视图）组成。此类视图派自 Android `ViewGroup` 类（`android.view.ViewGroup`），而该类本身是\
  \ `View` 的子类。此类视图的示例是 `RadioGroup`，它旨在包含多个 `RadioButton` 对象，以便在任何时间只有一个对象处于“开启”状态。从结构上来说，复合视图由单个父视图（派自\
  \ `ViewGroup` 类，其他称为容器视图或根元素）组成，它可以包含其他视图（称为子视图）。\n\n另一类基于 `ViewGroup` 的容器视图是布局管理器。\n\
  \n### 16.3 Android 布局管理器\n\n除了上一节讨论的小部件样式视图外，SDK 还包含了一组被称为“布局（layouts）”的视图。布局是容器视图（因此派自\
  \ `ViewGroup`），其设计目的仅用于控制子视图在屏幕上的定位方式。\n\nAndroid SDK 包含以下可能用于 Android 用户界面设计中的布局视图：\n\
  \n- `ConstraintLayout` – 引入自 Android 7，建议对于大多数布局需求都使用此布局管理器。`ConstraintLayout` 允许通过分配给每个子视图的简单约束设置来定义布局中视图的位置和行为。该布局的灵活性允许快速、方便地创建复杂布局，而无需将其他布局类型嵌套在内部，从而提高了布局性能。`ConstraintLayout`\
  \ 也紧密集成到 Android Studio 布局编辑器工具中。除非另有说明，它是书中大多数示例的首选布局。\n\n- `LinearLayout` – 根据所选的方向，将子视图放置在单行或单列中。可以在每个子视图上设置权重（weight）值，以指定该视图相对于其他子视图应占据布局空间的比例。\n\
  \n- `TableLayout` – 将子视图按行和列的网格格式排列。表格中的每一行由一个 `TableRow` 对象对象表示，该对象为每个单元格包含一个视图对象。\n\
  \n- `FrameLayout` – `FrameLayout` 的目的是分配一个屏幕区域，通常用于显示单个视图。如果添加了多个子视图，默认它们将相互堆叠并位于布局区域左上角。通过为每个子视图设置重力（gravity）值来实现单个子视图的备定位。例如，在子视图上设置\
  \ `center_vertical` 重力值将其放置在容器 `FrameLayout` 视图的垂直居中。\n\n- `RelativeLayout` – `RelativeLayout`\
  \ 允许通过指定子视图的对齐方式和边距，使子视图相对于彼此以及容器布局视图进行定位。例如，子视图 `View A` 可以配置为位于容器 `RelativeLayout`\
  \ 视图的垂直和水平居中。另一方面，`View B` 可能也配置为在布局视图内水平居中，但位于 `View A` 顶部上方 30 像素处，从而使其在垂直方向相对于\
  \ `View A` 定位。`RelativeLayout` 管理器在设计适用于各种屏幕尺寸和方向的用户界面时可能特别有用。\n\n- `AbsoluteLayout`\
  \ – 允许将子视图放置在容器布局视图内特定的 X 和 Y 坐标处。不建议使用此布局，因为它缺乏响应屏幕尺寸和方向变化的灵活性。\n\n\n\n\n\n- `GridLayout`\
  \ – `GridLayout` 实例由不可见的线条划分，形成一个包含行和列单元格的网格。子视图被放置在单元格中，并可以配置为水平和垂直方向上覆盖多个单元格，从而能够快速方便地实现各种布局选项。`GridLayout`\
  \ 中组件之间的间隔可以通过在相邻单元格中放置一种名为 `Space` 的特殊类型视图，或者通过设置页边距参数来实现。\n- `CoordinatorLayout`\
  \ – `CoordinatorLayout` 随着 Android 5.0 作为 Android 设计支持库的一部分引入，它专门设计用于协调应用程序屏幕顶部应用标题栏（app\
  \ bar）与其他视图元素之间的外观和行为。当使用 Basic Activity 模板创建新活动时，主布局中的父视图将使用 `CoordinatorLayout`\
  \ 实例实现。该布局管理器将从标题为 “使用浮动操作按钮和 Snackbar” 的章节开始进行更详细的介绍。\n\n在考虑在 Android 应用程序的用户界面中使用布局时，值得记住，正如下一节将将概述的，这些布局可以相互嵌套，以创建几乎任何所需复杂度的用户界面设计。\n\
  \n## 16.4 视图层次结构\n\n用户界面中的每个视图代表显示器上的矩形区域。视图负责在该矩形区域内绘制的内容，并响应发生在屏幕该部分的事件（例如触摸事件）。\n\
  \n用户界面屏幕由一个视图层次结构组成，其中根视图位于树的顶端，子视图位于下方的分支上。容器视图的子视图位于父视图之上，并被限制在父视图显示区域的边界内。例如，考虑\
  \ 图 16-1 所示的用户界面：\n\n![](img/Image2798.jpg)\n\n图 16-1\n\n除了可见的按钮和复选框视图外，用户界面实际上还包含许多布局视图，这些布局视图控制可见视图的位置。图\
  \ 16-2 显示了用户界面的另一种视图，这次重点突出了布局视图与子视图之间的关系：\n\n![](img/Image2808.jpg)\n\n图 16-2\n\
  \n正如之前讨论过的，用户界面是以视图层次结构的形式构建的，顶端有一个根视图。既然如此，我们也可以通过 图 16-3 所示的视图树形式来视觉化上述用户界面示例：\n\
  \n![](img/Image2815.jpg)\n\n图 16-3\n\n视图层次结构图可能为构成 图 16-1 所示用户界面的各种视图之间的关系提供了最清晰的概览。当用户界面显示给用户看时，Android\
  \ 运行环境会遍历视图层次结构，从根视图开始向下遍历树，并渲染每个视图。\n\n### 16.5 创建用户界面\n\n在对视图、布局和视图层次结构的概念有了更清晰的理解后，接下来的章节将重点关注为\
  \ Android 活动创建用户界面的步骤。事实上，有三种不同的用户界面设计方法：使用 Android Studio 布局编辑器工具、手写 XML 布局资源文件或编写\
  \ Java 代码，每种方法都将被涵盖。\n\n### 16.6 总结\n\nAndroid 应用程序用户界面屏幕中的每个元素都是视图，它们最终派生自 `android.view.View`\
  \ 类。每个视图代表设备显示器上的矩形区域，并负责该矩形区域内出现的内容以及处理发生在视图边界内的事件。多个视图可以组合成单个复合视图。复合视图中的视图是容器视图的子视图，容器视图通常是\
  \ `android.view.ViewGroup` 的子类（它本身也是 `android.view.View` 的子类）。用户界面由以后层次结构形式构建的视图组成。\n\
  \nAndroid SDK 包含了一系列预构建视图，可用于创建用户界面。这些包括文本字段和按钮等基础组件，还包括一系列用于控制子视图位置的布局管理器。如果提供的视图不能满足特定需求，可以通过扩展或组合现有视图，或者通过派生\
  \ `android.view.View` 并创建一个完全新类型的视图来创建自定义视图。\n\n用户界面可以使用 Android Studio 布局编辑器工具、手写\
  \ XML 布局资源文件或编写 Java 代码来创建。这些方法中的每一种将在随后的章节中介绍。\n\n## 17. Android Studio 布局编辑器工具指南\n\
  \n很难想象出一个不需要某种形式用户界面的 Android 应用程序概念。大多数 Android 设备都配备了触摸屏和键盘（虚拟或物理），点击和滑动是用户与应用程序之间交互的主要形式。这些交互不可避免地通过应用程序的用户界面进行。\n\
  \n设计良好的良好的用户界面是创建成功且流行的 Android 应用程序的重要因素，它取决于单个应用程序的设计需求，从简单到极其复杂不等。无论复杂度如何，Android\
  \ Studio 布局编辑器工具都显著简化了设计和实现 Android 用户界面的任务。\n\n## 17.1 Basic Activity vs. Empty\
  \ Activity 模板\n\n正如 “Android 应用程序剖析” 章节概述的，Android 应用程序由一个或多个活动组成。活动是一个独立的应用程序功能模块，通常直接对应单个用户界面屏幕。因此，当使用\
  \ Android 布局编辑器时，我们始终是在处理某个活动的布局。\n\n在创建新的 Android Studio 项目时，有许多不同的模板可以作为主活动用户界面的起点。这些模板中最基础的是\
  \ Basic Activity 和 Empty Activity 模板。虽然这些模板初看起来看起来相似，但它们之间实际上存在相当差异。要在布局编辑器中查看这些差异，请使用\
  \ View 菜单如下方 图 17-1 所示启用 Show System UI：\n\n![](img/as_layout_editor_system_ui.jpg)\n\
  \n图 17-1\n\nEmpty Activity 模板创建一个单布局文件，由一个 `ConstraintLayout` 器实例包含一个 `TextView`\
  \ 对象组成，如 图 17-2 所示：\n\n![](img/as_4.1_empty_activity_ui.jpg)\n\n图 17-2\n\n另一方面，Basic\
  \ Activity 由多个布局文件组成。顶层布局文件以 `CoordinatorLayout` 作为根视图，一个跨越设备屏幕顶部的可配置应用栏（包含工具栏，如\
  \ 图 17-3 中的 A 所示）和一个浮动操作按钮（标记为 B 的电子邮件按钮）。除了这些项目，`activity_main.xml` 布局文件还包含名为 `content_main.xml`\
  \ 的第二个文件的引用，该文件包含内容布局（标记为 C）：\n\n![](img/as_basic_activity_layout.jpg)\n\n图 17-3\n\
  \n\n\n\n\n基础活动（Basic Activity）包含两个屏幕的布局，这两个屏幕都包含一个按钮和一个文本视图（text view）。此模板目的是演示如何在应用内实现多个屏幕之间的导航。如果运行使用未修改的\
  \ Basic Activity 模板的程序，将显示这两个屏幕中的第一个屏幕（在图 17-4 中标记为 A）。点击 Next（下一步）按钮将导航到第二个屏幕（B），该屏幕反过来包含一个可以返回第一个屏幕的按钮：\n\
  \n![](img/as_basic_activity_layout_1.jpg)\n\n图 17-4\n\n此应用行为利用了两个 Android 功能，称为片段（fragments）和导航（navigation），这两者都将分别从标题为“Android\
  \ Fragment 简介和“导航架构组件概述的章节开始进行介绍。\n\n`content_main.xml` 文件包含一个名为导航宿主片段（Navigation\
  \ Host Fragment）的特殊片段，它允许根据 `res -> layout -> nav_graph.xml` 文件中配置的设置，将不同的内容切换入或出视图。对于\
  \ Basic Activity 模板，`nav_graph.xml` 文件被配置为根据用户选择 Next（下一步）和 Previous（上一步）按钮，在 `fragment_first.xml`\
  \ 和 `fragment_second.xml` 文件定义的用户界面布局之间进行切换。\n\n显然，如果你在活动中既不需要悬浮操作按钮（floating action\
  \ button）也不需要菜单，不需要 `CoordinatorLayout` 提供的特殊应用栏行为（例如在某些滚动操作期间让应用栏和工具栏折叠隐藏的选项，该主题在标题为“使用\
  \ AppBar 和折叠工具栏布局”的章节中介绍过），那么 Empty Activity 模板就是很有用的。然而，Basic Activity 的用处在于它默认提供了这些元素。事实上，使用\
  \ Basic Activity 模板创建一个新活动并删除你不需要的元素，比使用 Empty Activity 模板并手动实现折叠工具栏、菜单或悬浮操作按钮等行为要快得多。\n\
  \n然而，由于书中并非所有的示例都需要 Basic Activity 模板的功能，因此本章的大多数示例将使用 Empty Activity 模板，除非示例需要\
  \ Basic Activity 模板提供的某个或多个功能。\n\n为了以后参考，如果你需要菜单但不需要悬浮操作按钮，请使用 Basic Activity 并按照以下步骤删除悬浮操作按钮：\n\
  \n1. 双击位于 Project 工具窗口中 `app -> res -> layout` 下的主主 `activity_main.xml` 布局文件，将其加载到布局编辑器（Layout\
  \ Editor）中。当布局加载到布局编辑器工具时，选择悬浮操作按钮并按下键盘上的 Delete 键从布局中删除该对象。\n\n2. 找到并编辑活动的 Java\
  \ 代码（位于 `app -> java -> <package name> -> <activity class name>`），并按如下所示从 `onCreate`\
  \ 方法中删除悬浮操作按钮代码：\n\n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState)\
  \ {\n    super.onCreate(savedInstanceState);\n    binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \    setContentView(binding.getRoot());\n    setSupportActionBar(binding.toolbar);\n\
  \    NavController navController = Navigation.findNavController(this, R.id.nav_host_fragment_content_main);\n\
  \    appBarConfiguration = new AppBarConfiguration.Builder(navController.getGraph()).build();\n\
  \    NavigationUI.setupActionBarWithNavController(this, navController, appBarConfiguration);\n\
  \    binding.fab.setOnClickListener(new View.OnClickListener() {\n        @Override\n\
  \        public void onClick(View view) {\n            Snackbar.make(view, \"Replace\
  \ with your own action\", Snackbar.LENGTH_LONG)\n                    .setAction(\"\
  Action\", null).show();\n        }\n    });\n}\n```\n\n如果你需要悬浮操作按钮但不需要菜单，请使用 Basic\
  \ Activity 模板并遵循以下步骤：\n\n1. 编辑活动类文件并删除 `onCreateOptionsMenu` 和 `onOptionsItemSelected`\
  \ 方法。\n2. 在 Project 工具窗口中选择 `res -> menu item`，并按下键盘 Delete 键从项目中删除文件夹和相应的菜单资源文件。\n\
  \n如果你需要使用 Basic Activity 模板但既不需要导航功能也不需要第二个内容片段，请遵循以下步骤：\n\n1. 在 Project 工具窗口中，导航并双击\
  \ `app -> res -> navigation -> nav_graph.xml` 文件，将其加载到导航编辑器中。\n2. 在编辑器中，选择图面板中的\
  \ `SecondFragment` 条，并按下键盘 delete 键将其从图中移除。\n3. 找到并删除 `SecondFragment.java`（`app\
  \ -> java -> <package name> -> SecondFragment`）和 `fragment_second.xml`（`app -> res\
  \ -> layout -> fragment_second.xml`）文件。\n4. 最后的任务是从 `FirstFragment` 类中移除一些代码，以便\
  \ Button 视图在点击时不再导航到已不存在的第二个片段。找到 `FirstFragment.java` 文件，双击将其加载到编辑器，并删除 `onViewCreated()`\
  \ 方法中的代码，使其内容如下：\n\n```java\npublic void onViewCreated(@NonNull View view, Bundle\
  \ savedInstanceState) {\n    super.onViewCreated(view, savedInstanceState);\n  \
  \  binding.buttonFirst.setOnClickListener(new View.OnClickListener() {\n       \
  \ @Override\n        public void onClick(View view) {\n            NavHostFragment.findNavController(FirstFragment.this)\n\
  \                .navigate(R.id.action_FirstFragment_to_SecondFragment);\n     \
  \   }\n    });\n}\n```\n\n### 17.2 Android Studio 布局编辑器\n\n正如前面的章节所示，布局编辑器工具提供了一个“所见即所得”（WYSIWYG）环境，在该环境中可以从调色板中选择视图并将其放置在代表设备的画布上。一旦视图放置在画布上，就可以对其进行移动、删除和调整大小。此外，可以使用属性窗口（Attributes\
  \ window）修改与选中视图相关的各种属性。\n\n在底层，布局编辑器工具实际上构建了一个包含正在设计的用户界面定义的 XML 资源文件。因此，布局编辑器以三种不同的模式运行，称为设计（Design）、代码（Code）和拆（Split）模式。\n\
  \n### 17.3 设计模式\n\n在设计模式下，可以通过直接操作视图调色板和布局的图形表示来视觉化用户界面。图 17-5 突出了 Android Studio\
  \ 布局编辑器在设计模式下的关键区域：\n\nA – 调色板（Palette）——调色板提供了 Android SDK 提供的视图组件范围。这些组件分类以便导航。可以通过从调色板中拖拽视图组件并将其放在布局上的指定位置向布局添加项。\n\
  \nB – 设备屏幕（Device Screen）——设备屏幕提供了正在设计的的用户界面布局的视觉“所见即所得”表示。该布局允许对设计进行直接操作，允许对视图进行选择、删除、移动和调整大小。可以使用工具栏中的菜单随时更改布局代表的设备模型。\n\
  \n\n\n\n\n### C – 组件树\n如前一章（“理解 Android Views、Groups 和 Groups”）所述，用户界面是使用分级结构构建的。组件树提供了用户界面设计层级的可视化概述。在组件树中选择一个元素会导致布局中相应的视图被选中。同样，在设备屏幕布局中选择一个视图将选中组件树层级中的该视图。\n\
  \n### D – 属性\n调面板中列出的所有组件视图都有一组相关的属性，可用于调整该视图的行为和外观。`Layout Editor` 的属性面板可以访问布局中当前选中视图的属性，从而进行更改。\n\
  \n### E – 工具栏\n`Layout Editor` 工具栏提供了对广泛选项的快速访问，这些选项包括但不限于：放大和缩小设备屏幕布局、更改当前显示的设备模型、在横屏和竖屏之间旋转布局，以及切换到不同的\
  \ Android SDK API 级别。工具栏还有一组上下文敏感按钮，当在设备屏幕布局选中相关的视图类型时，这些按钮将会显示。\n\n### F – 模式切换控制\n\
  这三个按钮提供了一种在 `Layout Editor` 工具的 `Design`（设计）、`Code`（代码）和 `Split`（拆）模式之间切换的方法。\n\n\
  ### G - 缩放与和平控制\n此控制面板允许你对设计画布进行放大和缩小，并抓取画布进行移动，以找到放大时被遮挡的区域。\n\n## 17.4 调面板\n`Layout\
  \ Editor` 调面板由两个面板组成，旨在方便定位和预览视图组件，以便添加到布局设计中。类别面板（在图 17-6 中标记为 A）列出了 Android SDK\
  \ 支持的各种视图组件类别。当从列表中选择一个类别时，第二个面板 (B) 将更新并显示属于该类别的组件列表：\n\n![](img/as_4.1_layout_editor_palette.jpg)\n\
  \n图 17-6\n\n要将组件从调色面板添加到布局画布上，只需从组件列表或预览面板中选择该项，将其拖动到画布上的所需位置并释放即可。\n\n要在当前选定的类别中搜索特定组件，可以点击调面板工具栏中的搜索按钮（在图\
  \ 17-6 中标记为 C）并输入组件名称。随着字符的输入，匹配的结果将实时显示在组件列表面板中。如果你不确定组件所属的类别，只需在搜索操作之前或期间勾选 `All\
  \ Results`（所有结果）类别即可。\n\n## 17.5 设计模式与布局视图\n默认情况下，布局编辑器将以 `Design` 模式出现，如上面的图 17-5\
  \ 所示。此模式提供了用户界面的视觉化表示。可以通过点击图 17-7 所示的最右侧的模式切换控制控件，随时选择 `Design` 模式：\n\n![](img/as_4.0_layout_editor_design_button.jpg)\n\
  \n图 17-7\n\n当 `Layout Editor` 工具处于 `Design` 模式时，可以用两种不同的方式查看布局。上方图 17-5 所示的视图是 `Design`\
  \ 视图，显示了布局和小部件在运行程序中的外观。第二种模式称为 `Blueprint`（蓝图）视图，可以替代 `Design` 视图，也可以与 `Design`\
  \ 视图同时显示。图 17-8 所示的工具栏菜单提供了显示 `Design`、`Blueprint` 或两种视图的选项。还提供了设置来调整色盲显示。第五种选项\
  \ `Force Refresh Layout`（强制刷新布局）会导致布局重建并重绘。当布局进入意外状态或未能准确反映当前设计设置时，此功能非常有用：\n\n\
  ![](img/as_layout_editor_select_design_surface.jpg)\n\n图 17-8\n\n显示布局视图、设计视图还是两者都取决于个人喜好。一种好的方法是像图\
  \ 17-9 所示，从同时显示两者开始：\n\n![](img/as_3.5.show_layout_design_and_blueprint.jpg)\n\n\
  图 17-9\n\n## 17.6 夜间模式\n要在设计工作期间以夜间模式查看布局，请选择下方图 17-10 所示菜单并将设置更改为 `Night`：\n\n\
  ![](img/as_layout_editor_night_mode.jpg)\n\n图 17-10\n\n## 17.7 代码模式\n在使用 `Android\
  \ Studio Layout Editor` 工具时，必须记住它实际上所做的只是提供一种易于的方法来创建 XML 布局资源文件。在设计过程中的任何时候，只需点击位于\
  \ `Layout Editor` 工具面板右上角的 `Code` 按钮，即可查看并直接编辑底层 XML，如图 17-11 所示：\n\n![](img/as_4.0_layout_editor_code_button.jpg)\n\
  \n图 17-11\n\n图 17-12 显示了 `Code` 模式下的 Android Studio Layout Editor，允许修改 XML 来更改用户界面：\n\
  \n![](img/as_3.6_layout_editor_code_mode.jpg)\n\n图 17-12\n\n## 17.8 拆分模式\n在 `Split`\
  \ 模式下，编辑器并排显示 `Design` 和 `Code` 视图，允许通过设计画布可视化或直接修改 XML 声明来修改用户界面。要进入 `Split` 模式，请点击下方图\
  \ 17-13 所示的中间按钮：\n\n![](img/as_4.1_layout_split_button.jpg)\n\n图 17-13\n\nXML 的任何更改都会反映在设计画布上，反之亦然。图\
  \ 17-14 显示了处于 `Split` 模式的编辑器：\n\n![](img/as_4.1_layout_split_mode.jpg)\n\n图 17-14\n\
  \n### 17.9 设置属性\n属性面板提供了访问当前选中所有可用设置的方法。例如，图 17-15 显示了 `TextView` 小部件的属性：\n\n![](img/as_attributes_panel.jpg)\n\
  \n图 17-15\n\n属性窗口分为以下不同部分：\n\n- `id`：包含 `id` 属性，定义了在源码中引用当前选中对象的名称。\n- `Declared\
  \ Attributes`（已声明属性）：包含所有已赋值的属性。\n- `Layout`（布局）：定义当前视图对象相对于屏幕和其他布局中其他对象的位置和大小的设置。\n\
  - `Transforms`（变换）：允许对当前对象进行旋转、缩放和偏移的控件。\n- `Common Attributes`（常用属性）：当前选中视图对象通常需要更改的属性列表。\n\
  - `All Attributes`（所有属性）：当前对象所有可用属性的完整列表。\n\n也可以通过选择属性窗口工具栏中的搜索按钮并输入属性名称来对特定属性进行搜索。\n\
  \n\n\n\n\n某些属性在值字段右侧包含一个窄按钮。这表示可以使用资源（Resources）对话框来帮助选择合适的属性值。只需点击该按钮即可显示对话框。此按钮的外观会变化，以反映相应的属性值是存储在资源文件中还是硬编码的。如果值存储在资源文件中，文本属性字段右侧的按钮将变为填充，以指示该值不是硬编码，如下方的图\
  \ 17-16 所示：\n\n![](img/as_3.4_resource_extracted.jpg)\n\n图 17-16\n\n具有有限数量有效选项的属性将呈现一个下拉菜单（图\
  \ 17-17），从中从中进行选择。\n\n![](img/as_4.0_type_face_menu.jpg)\n\n图 17-17\n\n可以点击吸管图标（如上方图\
  \ 17-16 中`backgroundTint` 字段所示）来显示颜色调色板。同样，当此位置出现标志图标时，点击它可以显示该属性的可用选项列表，而图像图标会打开资源管理器面板，允许为该属性选择图像和其他资源类型。\n\
  \n### 17.10 变换 (Transforms)\n\n属性工具窗口内的变换面板（图 17-18）提供了一组控件和属性，用于控制当前选中对象的视觉方面，包括旋转、alpha（用于视图的淡入淡出）、缩放（大小）和平移（相对于当前位置的偏移）：\n\
  \n![](img/as_4.1_layout_editor_transforms.jpg)\n\n图 17-18\n\n该面板包含视图的视觉表示，随着属性的更改而更新。这些更改也会反映在布局画布内的视图上。\n\
  \n### 17.11 工具可见性切换 (Tools Visibility Toggles)\n\n在代码模式下查看 Android Studio XML 布局文件的内容时，你会发现许多定义视图外观和行为的属性以\
  \ `android:` 前缀开头。这表示这些属性是在 `android` 命名空间内设置的，并在应用运行时生效。例如，以下布局文件的节录在 `Button`\
  \ 视图上设置了多种属性：\n\n```xml\n<Button\n    android:id=\"@+id/button\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:text=\"\
  Button\"\n```\n\n除了 `android` 命名空间外，Android Studio 还提供了 `tools` 命名空间。当属性在此命名空间内设置时，它们仅在布局编辑器的预览中生效。在设计布局时，例如，你可能会发现\
  \ `EditText` 视图显示某些文本很有帮助，但在应用运行时需要视图为空。为了实现这一点，你可以如下所示使用 `tools` 命名空间设置视图的文本属性：\n\
  \n```xml\n<EditText\n    android:id=\"@+id/editTextTextPersonName\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:ems=\"10\"\
  \n    android:inputType=\"textPersonName\"\n    tools:text=\"Sample Text\"\n```\n\
  \n此类工具属性在属性工具窗口中的设置是通过在带有扳手图标标记的属性字段中输入值来实现的，如图 17-19 所示：\n\n![](img/as_4.1_text_tools_property.jpg)\n\
  \n图 17-19\n\n工具属性对于在设计过程中更改视图的可见性特别有用。布局可能包含一个视图，根据用户操作在应用运行运行时程序化地显示或隐藏。为了模拟视图的隐藏，可以在视图的\
  \ XML 声明中添加以下工具属性：\n\n```xml\ntools:visibility=\"invisible\"\n```\n\n使用 `invisible`\
  \ 设置时，尽管视图不再可见，但它仍然存在于布局中，并占据它可见时相同的空间。若要让布局表现得像视图不再存在一样，应将可见性属性设置为 `gone`，如下所示：\n\
  \n```xml\ntools:visibility=\"gone\"\n```\n\n在上述两个示例中，可见性设置仅适用于布局编辑器，而对运行中的应用不会产生影响。若要同时在布局编辑器和运行中的应用中控制可见性，则应使用\
  \ `android` 命名空间设置相同的属性：\n\n```xml\nandroid:visibility=\"gone\"\n```\n\n虽然这些可见性工具属性很有用，但手动编辑\
  \ XML 布局文件是一个繁琐的过程。为了方便更改这些设置，Android Studio 在布局编辑器的组件树（Component Tree）面板中提供了一组开关。要访问这些控件，请点击面板中对应视图右侧的边距。例如，图\
  \ 17-20 显示了名为 `myButton` 的 `Button` 视图的工具可见性切换控件：\n\n![](img/as_4.2_layout_tools_visibility.jpg)\n\
  \n图 17-20\n\n这些开关控制 `android` 和 `tools` 命名空间下对应视图的可见性，并提供 not set（未设置）、visible（可见）、invisible（不可见）和\
  \ gone（隐藏占位）选项。当设置了冲突的属性时（例如，`android` 命名空间开关设置为 `visible`，而 `tools` 值设置为 `invisible`），`tools`\
  \ 命名空间在布局预览中具有优先权。当做出切换选择时，Android Studio 会自动向布局中的元素添加相应的属性。\n\n除了组件树面板中的可见性开关外，布局编辑器还包含了下方的图\
  \ 17-21 所示的工具可见性和位置按钮：\n\n![](img/as_4.1_layout_editor_tools_toggle.jpg)\n\n图 17-21\n\
  \n此按钮切换当前的工具可见性设置。例如，如果上述 `Button` 视图当前的工具设置为 `gone`，切换此按钮将使其变为可见。这便于快速检查视图从布局中添加或移除时的行为。此切换对于检查布局中的视图是否正确约束也非常有用，该主题将在`Android\
  \ Studio 中使用 ConstraintLayout`章节中介绍。\n\n### 17.13 显示示例数据\n\n\n\n\n在 Android Studio\
  \ 中设计布局时，可能会遇到这样的情况：用户界面中要显示的内容在应用完成并运行之前无法获取。这有时会导致很难从布局编辑器内部评估布局在应用运行时的实际外观。为了解决这个问题，布局编辑器允许指定样本数据，这些数据将用样本图像和数据填充布局编辑器中的视图。这些样本数据仅在布局编辑器中显示，而在应用运行时不会被显示。可以通过直接编辑布局的\
  \ XML，或者通过视觉化使用设计时助手（通过在设计区域中右键点击小部件并选择 `Set Sample Data`（设置样本数据）菜单选项）来配置样本数据。设计时助手面板将为所选的视图项显示一系列预配置的样本数据选项，包括各种配置的文本和图像组合。例如，图\
  \ 17-24 显示了在 `RecyclerView` 列表中选择显示样本数据时显示的样本数据选项：\n\n![](img/as_3.4_sample_data_menu.jpg)\n\
  \n图 17-24\n\n或者，也可以在布局设计过程中提供自定义的文本和图像进行显示。后续章节名为“布局编辑器样本数据教程” 的章节包含一个在布局编辑器中使用样本数据的示例。由于样本数据是实现为\
  \ `tools` 属性的，因此可以使用上方图 17-21 中突出显示的切换按钮来控制预览界面中数据的可见性。\n\n## 17.14 创建自定义设备定义\n\n\
  布局编辑器工具栏中的设备菜单（图 17-25）提供了一个预配置的设备类型列表，选择这些类型后将作为设备屏幕画布出现。除了预配置的设备类型外，之前在 Android\
  \ Studio 环境中配置过的任何 `AVD` 实例也会列在菜单中。要添加额外的设备配置，显示设备菜单，选择 `Add Device Definition`（添加设备定义）选项并按照“在\
  \ Android Studio 中创建 Android 虚拟设备 (AVD)”章节中概述的步骤进行。\n\n![](img/as_3.6_layout_editor_select_device.jpg)\n\
  \n图 17-25\n\n## 17.15 更改当前设备\n\n作为设备选择菜单的替代方案，可以通过从设备菜单选择 `Custom`（自定义）选项更改当前设备格式，点击位于设备屏幕右下角的缩放手（图\
  \ 17-26）并拖动以选择另一种设备显示格式。随着屏幕调整大小，将出现标记，指示可选的各种尺寸选项和方向：\n\n![](img/as_3.5_show_layout_resize_device.jpg)\n\
  \n图 17-26\n\n### 17.16 布局验证\n\n布局验证（Layout Validation）选项允许在系列 Pixel 尺寸的屏幕上同时预览用户界面布局。要访问布局验证工具窗口，可以点击\
  \ Android Studio 主窗口右边缘的标签页，或使用窗口左下角的 `Tool Window`（工具窗口）菜单。如果没有显示布局验证工具窗口，你可能需要创建一个键位快捷键来显示它。要添加键位快捷键，选择\
  \ `File`（文件） -> `Settings...`（设置...）（在 macOS 上为 `Android Studio` -> `Preferences...`），并在左侧导航面板中选择\
  \ `Keymap`（键位）项。在 `Keymap` 列表中，找到位于 `Tool Windows`（工具窗口）下的 `Layout Validation` 条，右键点击它并选择\
  \ `Add Keyboard Shortcut`（添加键盘快捷键）菜单选项：\n\n![](img/as_add_keyboard_shortcut.jpg)\n\
  \n图 17-27\n\n在 `Keyboard Shortcut` 对话框中，尝试键盘序列，直到找到一个未被使用的序列，然后点击 `OK` 按钮。接下来，在\
  \ `Preferences`（偏好设置）对话框中点击 `Apply`（应用）后点击 `OK`，返回布局编辑器并使用快捷键显示布局验证工具窗口。一旦加载，该面板将如图\
  \ 17-28 所示所示，在多个设备屏幕配置上渲染布局：\n\n![](img/as_layout_validation.jpg)\n\n图 17-28\n\n\
  ### 17.17 总结\n\n开发 Android 应用的关键部分涉及创建用户界面。在 Android Studio 环境中，这是通过运行三种模式的 `Layout\
  \ Editor` 工具完成的。在 `Design`（设计）模式下，从调板中选择视图组件并放置在代表 Android 设备屏幕的布局上，并使用属性列表进行配置。在\
  \ `Code`（代码）模式下，可以直接编辑代表用户界面布局的底层 `XML`。另一方面，`Split`（拆）模式允许通过视觉化和直接编辑 XML 来创建和修改布局。这些模式结合在一起提供了一个广泛且直观的用户界面设计环境。\n\
  \n布局验证面板允许在不同的设备屏幕尺寸上快速预览用户界面布局。\n\n## 18. Android ConstraintLayout 指南\n\n正如在“理解\
  \ Android View、视图组和布局”章节中所讨论的，Android 提供了许多布局管理器用于设计用户界面。在 Android 7 中，Google 引入了一种新的布局，旨在解决旧布局管理器的许多缺点。这种名为\
  \ `ConstraintLayout` 的新布局将简单、灵活且灵活的布局系统与 Android Studio 布局编辑器中的强大功能相结合，以便创建能够自动适应屏幕尺寸和设备方向变化的响应式用户界面布局。\n\
  \n本章将概述 `ConstraintLayout` 的基本概念，而下一章将详细介绍如何在 Android Studio 布局编辑器中使用 `ConstraintLayout`\
  \ 创建基于约束的布局。\n\n### 18.1 ConstraintLayout 工作原理\n\n与其他布局一样，`ConstraintLayout` 负责管理其包含的视觉组件（也称为小部件）的位置和尺寸行为。它是根据每个小部件上设置的约束连接来实现的。\n\
  \n为了充分理解并使用 `ConstraintLayout`，理解以下关键概念非常重要：\n\n• 约束（Constraints）\n• 边距（Margins）\n\
  • 对抗约束（Opposing Constraints）\n• 约束偏移（Constraint Bias）\n• 链（Chains）\n• 链样式（Chain\
  \ Styles）\n• 引导线（Guidelines）\n• 组（Groups）\n• 屏障（Barriers）\n• 流（Flow）\n\n### 18.1.1\
  \ 约束\n\n约束是定义小部件相对于其他小部件、`ConstraintLayout` 边缘以及特殊元素对齐和距离的规则集。约束还决定了活动的用户界面布局对设备方向变化或在不同屏幕尺寸设备上显示时的响应。为了充分配置，小部件必须具有足够的约束连接，以便\
  \ `ConstraintLayout` 布局引擎能够在水平和垂直平面上解析其位置。\n\n#### 18.1.2 边距\n\n边距是一种指定固定距离的约束形式。考虑一个需要放置在设备屏幕右上角的\
  \ `Button` 对象。这可以通过实现 `Button` 顶部和右边缘连接到父级 `ConstraintLayout` 对应侧的边距约束来实现，如图 18-1\
  \ 所示：\n\n![](img/Image2437.jpg)\n\n图 18-1\n\n\n\n\n如上图所示，每个约束连接都关联有一个边距值（margin\
  \ value），该值规定了组件距离父布局两边的固定距离。在此配置下，无论屏幕大小或设备方向如何，`Button` 对象将始终根据两个约束连接的指定，分别距离父级\
  \ `ConstraintLayout` 的顶部和右侧边缘 20 和 15 个设备无关像素 (dp)。\n\n虽然上述配置在某些情况下是可以接受的，但它在允许\
  \ `ConstraintLayout` 布局引擎通过调整组件位置来响应设备旋转并支持不同尺寸的屏幕方面没有提供灵活性。要为布局添加这种响应性，必须实现相反约束（opposing\
  \ constraints）。\n\n### 18.1.3 相反约束 (Opposing Constraints)\n\n在单个组件上沿同一轴运行的两个约束被称为相反约束。换句话说，在左右两侧都有约束的组件被认为具有水平方向的相反约束。例如，图\
  \ 18-2 展示了在之前的布局中同时添加水平和垂直方向的相反约束：\n\n![](img/Image24461.jpg)\n\n图 18-2\n\n这里需要理解的关键点是，一旦在特定轴上实现了相反约束，组件的定位将变为基于百分比而非基于坐标。例如，组件不再固定在距离布局顶部的\
  \ 20dp 处，而是位于距离布局顶部 30% 的位置。在不同的方向上以及在较大或更小的屏幕上运行时，`Button` 始终相对于父布局的尺寸处于相同的位置。\n\
  \n现在重要的是要理解，图 18-2 中概述的布局不仅使用了相反约束，还应用了**约束偏置（constraint bias）**。\n\n### 18.1.4\
  \ 约束偏置 (Constraint Bias)\n\n现在已经确定 `ConstraintLayout` 中的组件可能会受到相反约束连接的影响。默认情况下，相反约束是对等的，导致相应的组件在相反轴上居中。例如，图\
  \ 18-3 展示了一个使用相反的水平和垂直约束，在包含它的 `ConstraintLayout` 中居中的组件：\n\n![](img/Image2453.jpg)\n\
  \n图 18-3\n\n为了在相反约束的情况下允许调整组件位置，`ConstraintLayout` 实现了一种名为约束偏置（constraint bias）的功能。约束偏置允许组件沿相反轴的定位根据指定的百分比向其中一个约束倾斜（偏置）。例如，图\
  \ 18-4 显示了具有 75% 水平偏置和 10% 垂直偏置的之前的约束布局：\n\n![](img/Image24611.jpg)\n\n图 18-4\n\n\
  下一章节标题为在 Android Studio 中使用 ConstraintLayout 的指南，将更详细地涵盖这些概念，并解释这些功能是如何集成到 Android\
  \ Studio 布局编辑器工具中的。然而，在此还需要涵盖 `ConstraintLayout` 类的其他领域。\n\n#### 18.1.5 链 (Chains)\n\
  \n`ConstraintLayout` 链（Chains）提供了一种将两个或多个组件的布局行为定义为组的方法。链可以在垂直或水平轴上声明，并进行配置以定义链中组件的间距和大小。\n\
  \n当组件通过双向约束连接在一起时，它们就成了链。例如，图 18-5 展示了三个以这种方式链联的组件：\n\n![](img/Image24681.jpg)\n\
  \n图 18-5\n\n链中的第一个元素是**链头（chain head）**，它在垂直链中翻译为顶部的组件，在水平链中则翻译为最左侧的组件。整个链的布局行为主要通过在链头组件上设置属性来配置。\n\
  \n### 18.1.6 链样式 (Chain Styles)\n\n`ConstraintLayout` 链的布局行为由应用在链头组件上的链样式设置决定。`ConstraintLayout`\
  \ 类目前支持以下链样式：\n\n-   **散布链 (Spread Chain)** – 链中包含的组件在可用空间内均匀分布。这是链的默认行为。\n\n![](img/Image24781.jpg)\n\
  \n图 18-6\n\n-   **内侧散布链 (Spread Inside Chain)** – 链中包含的组件均匀分布在链头和链中的最后一个组件之间。链头和最后一个组件不包含在间距分布中。\n\
  \n![](img/Image24853.jpg)\n\n图 18-7\n\n-   **权重链 (Weighted Chain)** – 允许通过权重属性定义链中每个组件占据的空间。\n\
  \n![](img/Image24922.jpg)\n\n图 18-8\n\n-   **紧凑链 (Packed Chain)** – 构成链的组件紧凑在一起，没有任何间距。可以应用偏置来控制链相对于父容器的水平或垂直位置。\n\
  \n![](img/Image25000.jpg)\n\n图 18-9\n\n### 18.2 基线对齐 (Baseline Alignment)\n\n到目前为止，本章只提到了相对于组件侧边规定对齐的约束（通常称为侧边约束）。然而，一个常见的的需求是让组件相对于其显示的内容进行对齐，而不是相对于组件本身的边界。为了解决这个问题，`ConstraintLayout`\
  \ 提供了基线对齐支持。\n\n举个例子，假设图 18-1 之前的布局需要一个 `TextView` 组件位于 `Button` 左侧 40dp。在这种情况下，`TextView`\
  \ 需要与 `Button` 进行基线对齐。这意味着 `Button` 中的文本需要与 `TextView` 中的文本进行垂直对齐。此布局的额外约束需要如图 18-10\
  \ 所示所示连接：\n\n![](img/Image25088.jpg)\n\n图 18-10\n\n`TextView` 现在沿 `Button` 的基线对齐，并水平距离\
  \ `Button` 对象的左边缘 40dp。\n\n### 18.3 配置组件尺寸\n\n控制组件尺寸是设计过程的关键元素。`ConstraintLayout`\
  \ 提供了三个可以在单个组件上设置的来管理尺寸行为。这些设置单独为高度和宽度配置：\n\n-   **固定 (Fixed)** – 组件固定为指定的尺寸。\n\
  -   **匹配约束 (Match Constraint)** – 允许布局引擎调整组件大小以满足现有约束。也称为 `AnySize` 或 `MATCH_CONSTRAINT`\
  \ 。\n-   **内容包裹 (Wrap Content)** – 组件的大小由其包含的内容（即文本或图形）决定。\n\n### 18.4 辅助线助手 (Guideline)\n\
  \n辅助线是 `ConstraintLayout` 中的特殊元素，提供了一个可以连接约束的额外目标。可以向 `ConstraintLayout` 实例添加多个辅助线，这些辅助线可以被配置为水平或垂直方向。一旦添加，就可以建立从布局中的组件到辅助线的约束连接。当多个组件需要沿某一轴对齐时，这特别有用。例如，在图\
  \ 18-11 中，包含在 `ConstraintLayout` 中的三个 `Button` 对象沿垂直辅助线进行约束：\n\n![](img/Image25199.jpg)\n\
  \n图 18-11\n\n### 18.5 组助手 (Group Helper)\n\n\n\n\n\n`ConstraintLayout` 的此功能允许将组件放置在逻辑组中，并作为一个单一实体控制这些组件的可见性。`Group`\
  \ 本质上是布局中其他组件的引用列表。一旦定义，更改 `group` 实例的可见性属性（`visible`、`invisible` 或 `gone`）将此更改应用到组内的所有成员。这使得通过更改单个属性即可轻松隐藏和显示多个组件。单个布局可以包含多个\
  \ `group`，且一个组件可以属于多个 `group`。如果组之间发生冲突，则在 XML 文件中最后声明的组具有优先级。\n\n## 18.6 Barrier\
  \ Helper（障碍辅助类）\n\n与辅助线（guidelines）类似，障碍是用来用于约束布局内视图的虚拟视图。与辅助线一样，障碍可以是垂直或水平的，并且一个或多个视图可以被约束在其上（为了避免混淆，这些视图被称为受约束视图）。然而，与辅助线在布局中保持固定位置不同，障碍的位置是由一组所谓的“参考视图”（reference\
  \ views）定义的。引入障碍是为了解决某些经常发生的视图重叠问题。例如，考虑下所示 图 18-12 所示的布局：\n\n![](img/Image2526.jpg)\n\
  \n图 18-12\n\n上述布局需要注意的关键点是，`View 3` 的宽度设置为匹配约束模式（constraint mode），且该视图的左边缘连接到 `View\
  \ 1` 的右边缘。按照目前的实现方式，增加 `View 1` 的宽度将产生减少 `View 3` 宽度的预期效果：\n\n![](img/Image25331.jpg)\n\
  \n图 18-13\n\n然而，如果是 `View 2` 的宽度增加而不是 `View 1`，就会出现问题：\n\n![](img/Image25401.jpg)\n\
  \n图 18-14\n\n显然，由于 `View 3` 仅受 `View 1` 约束，它不会为了适应 `View 2` 宽度的增加而调整大小，导致视图重叠。\n\
  \n解决此问题的方法是添加垂直障碍并将 `Views 1` 和 `View 2` 分配为障碍的参考视图，以便它们控制障碍的位置。`View 3` 的左边缘将相对于障碍进行约束，使其成为受约束视图。\n\
  \n现在，当 `View 1` 或 `View 2` 的任一宽度增加时，障碍将移动以适应两个视图中较宽的一个，从而导致 `View 3` 的宽度相对于新的障碍位置发生相应变化：\n\
  \n![](img/Image2548.jpg)\n\n图 18-15\n\n在使用障碍时，与单个障碍关联的参考视图和受约束视图的数量没有限制。\n\n## 18.7\
  \ Flow Helper（流辅助类）\n\n`ConstraintLayout Flow` 辅助类允许视图组以流式网格样式布局显示。与 `Group` 辅助类一样，`Flow`\
  \ 包含了对其负责定位的视图的引用，并提供了多种配置选项，包括垂直和水平方向、换行行为（包括换行前的最大组件数量）、间距和对齐属性。链（Chain）行为也可以应用于\
  \ `Flow` 布局，包括分布（spread）、内部分布（spread inside）和打包（packed）选项。\n\n图 18-16 表示在水平模式下使用\
  \ `Flow` 实例定位、且无换行设置的五个大小相同的按钮的布局：\n\n![](img/as_4.1_flow_no_wrap.jpg)\n\n图 18-16\n\
  \n图 18-17 显示了相同的按钮在水平流配置中，并设置在每第三个组件后换行：\n\n![](img/as_4.1_flow_with_wrap.jpg)\n\
  \n图 18-17\n\n另一方面，图 18-18 显示了按钮的换行设置为使用“内部分布”模式的链模式（其效果仅在第二行可见，因为第一行是满的）。该配置还设置了\
  \ `gap` 属性以在按钮之间添加间距：\n\n![](img/as_4.1_flow_chain_spread_inside.jpg)\n\n图 18-18\n\
  \n作为 `Flow` 辅助类灵活性的最后一个演示，图 18-19 显示了五个大小不一的按钮，配置为水平打包链模式，并在每第三个组件后换行。此外，通过设置 `horizontal-bias`\
  \ 值为 `1.0`，网格内容已右对齐（值为 `0.0` 将导致左对齐，而 `0.5` 将使网格内容居中对）：\n\n![](img/as_4.1_flow_right_align.jpg)\n\
  \n图 18-19\n\n## 18.8 Ratios（比例）\n\n组件的尺寸可以使用比例设置来定义。例如，一个组件可以使用比例设置进行约束，使得无论任何调整大小的行为如何，其宽度始终是高度的两倍。\n\
  \n## 18.9 ConstraintLayout 优势\n\n`ConstraintLayout` 提供的灵活性允许人们在单个布局实例中实现旧布局的许多功能，而以前这可能需要嵌套多个布局。这样做的好处是允许设计所谓的“扁平”或“浅层”布局层级，避免了布局嵌套固有的问题，从而使布局不那么复杂并提升了用户界面的渲染性能。\n\
  \n`ConstraintLayout` 的实现也是为了适应市场上存在的各种 Android 设备屏幕尺寸。\n\n最后，正如将在在 Android Studio\
  \ 中使用 ConstraintLayout 章节中演示的那样，Android Studio 布局编辑器工具已针对 `ConstraintLayout` 用户界面设计进行了增强。\n\
  \n### 18.10 ConstraintLayout 的可用性\n\n尽管 `ConstraintLayout` 是随 Android 7 引入的，但它是作为独立的支持库提供的，可以追溯到\
  \ Android 9 (Gingerbread)。这使得使用这种新布局的应用运行在更旧的 Android 版本上。\n\n### 18.11 总结\n\n`ConstraintLayout`\
  \ 是随 Android 7 引入的管理器。它旨在简化创建适应各种设备尺寸和方向的灵活布局。`ConstraintLayout` 使用约束相对于父 `ConstraintLayout`\
  \ 实例、辅助线、障碍以及布局中的其他组件来控制组件的定位。它是新建 Android Studio 项目的默认布局，也是设计用户界面布局时的推荐选择。通过这种简单而灵活的布局管理方法，可以轻松地实现复杂的响应式用户界面。\n\
  \n## 19. 在 Android Studio 中使用 ConstraintLayout 指南\n\n正如之前的章节中多次提到的，Google 对 Android\
  \ Studio 布局编辑器工具进行了重大改进，其中许多改进完全是为了支持使用 `ConstraintLayout` 进行用户界面设计。既然上一章已经概述了 `ConstraintLayout`\
  \ 的基本概念，本章将详细探讨这些概念，同时概述布局编辑器工具允许设计和实现基于 `ConstraintLayout` 用户界面的方法。\n\n### 19.1\
  \ 设计与布局视图\n\nAndroid Studio 布局编辑器指南 章节解释了 Android Studio 布局编辑器提供了两种查看活动用户界面布局的方式：设计视图和布局视图（也称为蓝图视图）。这些布局视图可以单独显示，也可以像\
  \ 图 19-1 所示并排显示：\n\n![](img/as_4.1_layout_editor_previews.jpg)\n\n图 19-1\n\n\n\n\
  \n设计视图（Design view，位于上图左侧）提供了布局的“所见即所得”表示，其中布局的外观与其在运行应用程序中的显示完全一致。相反，`Layout` 视图显示了一种蓝图风格的视图，其中小部件由阴影轮廓表示。如上方的图\
  \ 19-1 所示，`Layout` 视图还会显示约束连接（在本例中，使用了相对的约束来将按钮居中于布局内）。当选中布局中的特定小部件或鼠标指针悬停在设计区域上时，这些约束也会叠加在设计视图上，如图\
  \ 19-2 所示：\n\n![](img/as_4.1_layout_editor_design_view.jpg)\n\n图 19-2\n\n两种视图中约束连接的显示方式可以通过图\
  \ 19-3 所示的 `View Options`（视图选项）菜单进行更改：\n\n![](img/as_show_constraints.jpg)\n\n图\
  \ 19-3\n\n除了显示用户界面布局的两种模式外，`Layout Editor` 工具提供了三种方法来建立特定布局设计所需的约束。\n\n### 19.2\
  \ 自动连接模式 (Autoconnect Mode)\n\n顾如其名，自动连接在项目添加到布局中时会自动建立约束连接。可以使用图 19-4 所示的工具栏按钮来启用或禁用\
  \ `Autoconnect` 模式：\n\n![](img/as_autoconnect.jpg)\n\n图 19-4\n\n`Autoconnect` 模式使用算法根据小部件的位置以及它与父布局侧边和布局中其他元素的距离，来决定建立最佳的约束。如果任何自动约束连接未能提供预期的效果，可以按照本文后面的概述进行手动修改。\n\
  \n### 19.3 推断模式 (Inference Mode)\n\n推断模式使用涉及算法和概率的启发式方法，在小部件已添加到布局后自动实现约束连接。这种模式通常用于关闭了\
  \ `Autoconnect` 功能且在没有任何约束连接的情况下向布局添加对象的情况。这允许通过简单的从调色板将对象拖放到布局画布上，并更改尺寸和位置，直到布局符合要求，从而完成布局。本质上，这涉及到在不担心约束的情况下“绘制”布局。推断模式也可以在设计过程中的任何时候用于填充布局中缺失的约束。\n\
  \n当点击 `Infer constraints` 按钮（图 19-5）时，约束会自动添加到布局中：\n\n![](img/as_inference_mode.jpg)\n\
  \n图 19-5\n\n与自动连接模式一样，`Layout Editor` 工具始终存在推断错误约束的可能性，尽管这些约束可以手动进行修改和纠正。\n\n###\
  \ 19.4 手动操作约束\n\n实现约束连接的第三种方法是手动进行。这样做时，理解 `Layout Editor` 工具中小部件周围出现的各种句柄将很有帮助。例如，考虑图\
  \ 19-6 所示的小部件：\n\n![](img/as_4.1_constraint_handles.jpg)\n\n图 19-6\n\n显然，弹簧状线条 (A)\
  \ 代表从小部件侧边到目标的已建立约束连接。对象每个角的小正方形标记 (B) 是调整大小的句柄，点击并拖动它们可以调整小部件的大小。位于小部件每侧的小圆形句柄\
  \ (C) 是侧约束锚点。要创建约束连接，点击句柄并将生成的线条拖到要连接约束的元素上（例如引导线或父布局侧边或另一个小部件的侧边），如图 19-7 所示。连接到另一个小部件的侧边时，只需将线条拖到该小部件的侧约束句柄，并在小部件和句柄高亮时释放线条。\n\
  \n![](img/as_4.1_constraint_drag_line.jpg)\n\n图 19-7\n\n如果将约束线拖到小部件并释放，但未附加到约束句柄，布局编辑器将显示一个菜单，列出约束可以附加的侧边列表。例如，在图\
  \ 19-8 中，约束可以附加到目标按钮小部件的顶部或底部：\n\n![](img/as_4.1_constraint_between_widgets.jpg)\n\
  \n图 19-8\n\n额外的标记指示了基线约束的锚点，其中小部件内部的内容（而非外部边缘）被用作对齐点。要显示此标记，只需右键点击该小部件并选择 `Show\
  \ Baseline`（显示基线）菜单选项。要从基线约束句柄建立约束连接，只需将鼠标指针悬停在句柄上直到其高亮，然后点击并拖动到目标（如图 19-9 所示的另一个小部件的基线锚点）。\n\
  \n![](img/as_baseline_constraint.jpg)\n\n图 19-9\n\n要隐藏基线锚点，再次右键点击小部件并选择 `Hide Baseline`\
  \ 。\n\n### 19.5 在检查器中添加约束\n\n还可以通过图 19-10 所示的 `Attributes` 工具窗口中的 `Inspector`（检查器）面板在\
  \ Android Studio 布局编辑器为视图添加约束。中间的正方形表示选中的视图，周围的区域表示应用于视图对应侧边的约束：\n\n![](img/as_3.5_constraint.jpg)\n\
  \n图 19-10\n\n视图侧缺少约束由一条指向带有加号的蓝圆的虚线表示（如上图视图底边所示）。要添加约束，只需点击此蓝圆，布局编辑器将将其连接到它认为最合适的目标。\n\
  \n### 19.6 在属性窗口中查看约束\n\n当前小部件上配置的约束列表可以通过显示下方图 19-11 所示的 `Attributes` 工具窗口中的 `Constraints`\
  \ 部分来查看：\n\n![](img/as_3.5_attributes_constraints_list.jpg)\n\n图 19-11\n\n点击列表中的约束将选择布局中的该约束。\n\
  \n### 19.7 删除约束\n\n要删除单个约束，只需在设计布局或 `Attributes` 工具窗口中选择该约束使其高亮（例如在图 19-12 中，最右侧的约束已被选中），然后按下键盘删除键。该约束将从布局中移除。\n\
  \n![](img/as_4.1_constraint_highlighted.jpg)\n\n图 19-12\n\n另一种选项是在按住 `Ctrl` 键（macOS\
  \ 上为 `Cmd`）将鼠标指针悬停在约束锚点上，并在变为红色后点击锚点：\n\n![](img/as_4.1_constraint_delete.jpg)\n\
  \n图 19-13\n\n或者，通过右键点击小部件并选择 `Clear Constraints of Selection`（清除选择约束）菜单选项来移除该小部件上的所有约束。\n\
  \n使用图 19-14 中亮出的工具栏按钮从布局中每个小部件的所有约束：\n\n![](img/as_clear_constraints.jpg)\n\n图 19-14\n\
  \n\n\n\n# 19.8 调整约束偏置（Constraint Bias）\n\n在上一节中，概述了使用偏置设置优于一个对立约束而非另一个的概念。Android\
  \ Studio 布局编辑器工具中的偏置通过 `Attributes` 工具窗口中的 `Inspector`（检查器）进行调整，如图图 19-15 所示。图中箭头指示的两个滑块用于控制当前所选控件的垂直和水平对立约束的偏置。\n\
  \n![](img/as_3.2_constraint_bias_sliders.jpg)\n\n图 19-15\n\n### 19.9 理解 ConstraintLayout\
  \ 边距\n\n约束可以结合边距（margins）使用，以实现控件与其他元素（例如另一个控件、指南或父布局的边缘）之间的固定间隙。例如，考虑应用于图 19-16\
  \ 中 `Button` 对象上的水平约束：\n\n![](img/as_4.1_constraint_no_margins.jpg)\n\n图 19-16\n\
  \n按照当前的配置，水平约束延伸到父 `ConstraintLayout` 的左右边缘。因此，该控件具有对立的水平约束，这意味着 `ConstraintLayout`\
  \ 布局引擎在运行时对控件的实际位置具有某些裁量权。这使得布局具有灵活性，以适应不同的屏幕尺寸和设备方向。水平偏置设置还能控制控件的位置一直到布局的右侧。例如，图\
  \ 19-17 显示了应用了 100% 水平偏置的同一个按钮：\n\n![](img/as_4.1_constraint_bias_100.jpg)\n\n图\
  \ 19-17\n\n`ConstraintLayout` 边距可以出现在约束连接的末端，并代表一个固定间隙，即使调整偏置或响应 Activity 中其他处的布局变化，控件也无法移动到该间隙。在图\
  \ 19-18 中，右侧约束现在包含一个 `50dp` 的边距，即使偏置仍设置为 100%，控件也无法移动到该区域。\n\n![](img/as_4.1_constraint_margin_50.jpg)\n\
  \n图 19-18\n\n控件上的现有边距值可以在 `Inspector` 中进行修改。如图 19-19 所示，正在使用下拉菜单将当前所选控件的右侧边距更改为\
  \ `16dp`。或者，点击当前值也可以在字段中输入数字。\n\n![](img/as_3.2_constraint_set_margins.jpg)\n\n\
  图 19-19\n\n新约束的默认边距可以随时使用工具栏中的高亮选项进行更改，该选项在图 19-20 中被高亮：\n\n![](img/as_constraints_margins.jpg)\n\
  \n图 19-20\n\n# 19.10 对立约束和偏置重要性\n\n正如上一节所讨论的，在使用 `ConstraintLayout` 时，对立约束、边距和偏置成了\
  \ Android 响应式布局设计的基石。当控件被约束但没有对立的约束连接时，这些约束本质上是边距约束。这在布局编辑器工具中通过实线直线并配以边距测量值来直观地表示出来，如图图\
  \ 19-21 所示。\n\n![](img/as_4.1_constraints_opposing.jpg)\n\n图 19-21\n\n上述约束本质上将控件固定在那个位置。其结果是，如果设备旋转到横屏模式，控件将不再可见，因为垂直约束将它推出了设备屏幕的顶边缘（如图\
  \ 19-22 所示）。如果应用程序在屏幕比设计过程中使用的更小的设备上运行，也会出现类似的问题。\n\n![](img/as_4.1_constraints_opposing_landscape.jpg)\n\
  \n图 19-22\n\n当实现对立约束时，约束连接由像弹簧一样的锯齿线表示（使用弹簧的比喻旨在表示控件的位置并非固定在绝对的 X 和 Y 坐标上）：\n\n\
  ![](img/as_4.1_constraints_opposing_constrained.jpg)\n\n图 19-23\n\n在上述布局中，配置了垂直和水平偏置设置，使得控件将始终位于距离父布局底部\
  \ 90% 距离处，以及距离左边缘 35% 处。因此，当旋转时，控件仍然可见，并且相对于屏幕尺寸保持在相同的位置：\n\n![](img/as_4.1_constraints_opposing_constrained_landscape.jpg)\n\
  \n图 19-24\n\n在设计响应式且自适应的用户界面布局时，手动设计用户界面布局以及对自动创建的约束进行修正时，同时考虑偏置和对立约束是非常重要的。\n\n\
  # 19.11 配置控件尺寸\n\n`ConstraintLayout` 中控件的内部尺寸也可以使用 `Inspector` 进行配置。正如上一节概述的，控件尺寸可以设置为\
  \ `wrap content`、`fixed` 或 `match constraint`。如图 19-25 所示，当前所选控件的每个尺寸的流行设置显示在代表该控件的方框内的\
  \ Inspector 中：\n\n![](img/as_3.2_constraint_dimensions.jpg)\n\n图 19-25\n\n在上方图中，水平和垂直维度都设置为\
  \ `wrap content`（由向内的箭头指示）。Inspector 使用以下视觉指示器表示这三种模式：\n\n| 固定大小 (Fixed Size) |\
  \ ![](img/Image2826.jpg) |\n| 匹配约束 (Match Constraint) | ![](img/Image2834.jpg) |\n\
  | 内容内容 (Wrap Content) | ![](img/Image2844.jpg) |\n\n表 19-1\n\n只需点击指示器即可在三个设置之间切换。当布局编辑器内视图的维度设置为\
  \ `match constraint` 时，相应的边将用弹簧线代替普通的直线绘制。例如，在图 19-26 中，仅视图的宽度被设置为匹配约束：\n\n![](img/Image2855.jpg)\n\
  \n图 19-26\n\n此外，可以使用 `Expand horizontally`（水平扩展）和 `Expand vertically`（垂直扩展）选项根据约束和布局中的其他控件水平或垂直扩展控件的大小。这些选项可以通过右键点击布局中的控件并从生成的菜单中选择\
  \ `Organize`（组织）来访问（如图 19-27 所示）。使用时，当前选择的控件将水平或垂直增大以填充周围的空间。\n\n![](img/as_4.1_constraint_organize_menu.jpg)\n\
  \n图 19-27\n\n# 19.12 设计时工具定位\n\nAndroid Studio 布局编辑器工具指南章节介绍了 `tools` 空间的概念，并解释了如何使用它设置仅在布局编辑器中生效可见性属性。在后台，Android\
  \ Studio 还使用 `tools` 属性在没有约束的情况下放置在布局上时保持控件的位置。例如，想象在禁用自动连接模式时将 `Button` 放到布局中。虽然控件在预览画布上看起来位置正确，但在运行应用程序时，它将出现在屏幕的左上角。这是因为控件没有约束来告诉父容器\
  \ `ConstraintLayout` 应该如何放置它。\n\n\n\n\n\n小组件在布局编辑器中显示在正确位置的原因，是因为 Android Studio\
  \ 设置了绝对 X 和 Y 定位工具属性，以便在添加约束条件之前将其保持在正确位置。在 XML 布局文件中，这些内容可能读起来如下：\n\n```xml\n<Button\n\
  \    android:id=\"@+id/button4\"\n    android:layout_width=\"wrap_content\"\n  \
  \  android:layout_height=\"wrap_content\"\n    android:text=\"Button\"\n    tools:layout_editor_absoluteX=\"\
  111dp\"\n    tools:layout_editor_absoluteY=\"88dp\" />\n```\n\n一旦为小组件添加了足够的约束条件，布局编辑器将移除这些工具属性。一种快速识别哪些小组件缺少约束（而无需等待应用运行）的实用技巧是，点击图\
  \ 19-28\n\n图 19-28\n\n### 19.13 添加辅助线\n\n辅助线提供了可以锚定约束的额外元素。可以通过右键点击布局并选择 `Vertical\
  \ Guideline`（垂直辅助线）或 `Horizontal Guideline`（水平辅助线）菜单选项，或者使用工具栏菜单选项（如图 19-29 所示）来添加辅助线：\n\
  \n![](img/as_guidelines_menu.jpg)\n\n图 19-29\n\n或者，也可以从面板（Palette）的助手（Helpers）部分拖动水平和垂直\
  \ `Guidelines`，并将其释放到布局画布或组件树（Component Tree）面板上，如图 19-30 中的箭头所示：\n\n![](img/as_4.1_add_guideline_from_palette.jpg)\n\
  \n图 19-30\n\n添加后，辅助线将以虚线的形式出现在布局中，并可以通过简单的点击和拖动线条来移动。要建立到辅助线的约束连接，请点击小组件的约束句柄，并在释放之前拖动到辅助线。在图\
  \ 19-31 中，两个按钮的左侧通过约束连接到一条垂直辅助线。\n\n垂直辅助线的位置可以指定为距离父布局左侧或右侧的绝对距离（水平辅助线为距离顶部或底部）。例如，上图中的垂直辅助线距离父布局左边缘\
  \ `96dp`。\n\n![](img/as_4.1_constraint_guidline.jpg)\n\n图 19-31\n\n或者，辅助线也可以定位为父布局总宽度或高度的百分比。若要在这三种模式之间切换，请选择辅助线并点击辅助线顶部或起始处的圆（取决于辅助线是垂直还是水平）。例如，图\
  \ 19-32 显示了一个基于百分比定位的辅助线：\n\n![](img/as_4.1_constraint_guideline_percentage.jpg)\n\
  \n图 19-32\n\n### 19.14 添加屏障\n\n可以通过右键点击布局并在 `Add helpers...` 菜单中选择 `Vertical Barrier`（垂直屏障）或\
  \ `Horizontal Barrier`（水平屏障）选项，或使用工具栏菜单选项（如之前的图 19-29 所示）来添加屏障。或者，在面板的助手部分找到 Barrier\
  \ 类型，将其拖放到布局画布或组件树面板上。\n\n一旦布局中添加了屏障，它将作为组件树面板中的一个项目：\n\n![](img/as_4.2_barrier_added.jpg)\n\
  \n图 19-33\n\n要将视图作为引用视图（换句话说，控制屏障位置的视图），只需将组件树内部的小组件拖动到屏障项上。例如，在图 19-34 中，名为 `textView1`\
  \ 和 `textView2` 的小组件已被分配为 `barrier1` 的引用组件：\n\n![](img/as_4.2_barrier_children.jpg)\n\
  \n图 19-34\n\n添加引用视图后，需要配置屏障以指定屏障相对于这些视图的方向。这是屏障方向设置，当在组件树面板中选择屏障时，它在属性（Attributes）工具窗口中定义：\n\
  \n![](img/as_4.1_layout_barrier_direction.jpg)\n\n图 19-35\n\n接下来的图显示了一个包含屏障的布局，其中\
  \ `textView1` 和 `textView2` 作为引用视图，`textview3` 作为受约束视图。由于屏障是从引用视图的末端向受约束视图推挤，因此屏障方向已设置为\
  \ `end`：\n\n![](img/as_3.5_constraints_barrier.jpg)\n\n图 19-36\n\n## 19.15 添加组\n\
  \n要在布局中添加 `Group`（组），请右键点击布局并在 `Add helpers..` 菜单中选择 `Group` 选项，或使用工具栏菜单选项（如之前的图\
  \ 19-29 所示）。或者，在面板的助手部分找到 `Group` 并将其拖放到布局画布或组件树面板。\n\n要向组添加小组件，请在组件树中选择它们并将它们拖放到该项。例如，图\
  \ 19-37 显示将三个选中的小组件添加到组中：\n\n![](img/as_4.1_add_widgets_to_group.jpg)\n\n图 19-37\n\
  \n组引用的任何小组件将以斜体显示在组件树的组下方，如图 19-38 所示。要从组中移除小组件，只需选择它并按删除键：\n\n![](img/as_4.1_group_list.jpg)\n\
  \n图 19-38\n\n一旦分配组，可以使用属性工具窗口的约束（Constraints）部分来修改可见性设置：\n\n![](img/as_4.1_group_visibility.jpg)\n\
  \n图 19-39\n\n## 19.16 使用 Flow 助手\n\n可以使用之前为其他助手指定的菜单或面板添加 Flow 助手。与 Group 助手一样（图\
  \ 19-37），通过将组件拖入组件树项中添加到 Flow 中。添加 Flow 助手并为其分配组件后，在组件树中选择它并使用属性工具窗口的通用属性（Common\
  \ Attributes）部分来配置流布局行为：\n\n![](img/as_4.1_flow_attributes.jpg)\n\n图 19-40\n\n###\
  \ 19.17 组件组对齐与分布\n\n当在布局中选择多个小组件时，Android Studio 布局编辑器提供了一系列对齐和分布操作。只需按 Shift 点击要参与操作的每个组件，右键点击布局并从对齐（Align）菜单显示的许多选项中进行选择：\n\
  \n![](img/as_layout_align_menu.jpg)\n\n图 19-41\n\n如下所示图 19-42，这些选项也可以通过布局编辑器工具栏上的对齐按钮访问：\n\
  \n![](img/as_align_menu.jpg)\n\n图 19-42\n\n同样，`Pack` 菜单（图 19-43）可以用于共同重新定位选中的小组件，使其在垂直或水平方向上紧凑。它通过更改组件的绝对\
  \ X 和 Y 坐标来实现，但不应用任何约束。另一方面，Pack 菜单中的两个分布选项会移动选中的组件，使其在垂直或水平轴上均匀间距，并在视图之间应用约束以保持这种间距。\n\
  \n![](img/as_3.2_constraints_pack_menu.jpg)\n\n图 19-43\n\n\n\n### 19.18 将其他布局转换为\
  \ ConstraintLayout\n\n对于使用一个或多个其他 Android 布局类（如 `RelativeLayout` 或 `LinearLayout`）的现有用户界面布局，`Layout\
  \ Editor` 工具提供了一个选项，可以将用户界面转换为使用 `ConstraintLayout`。\n\n当 `Layout Editor` 工具打开并处于\
  \ Design（设计）模式时，`Component Tree`组件树）面板显示在 `Palette”（调色板）下方。要将布局转换为 `ConstraintLayout`，在\
  \ `Component Tree` 中找到它，右键点击并选择 `Convert <current layout> to Constraint Layout`（将当前布局转换为\
  \ Constraint Layout）菜单选项：\n\n![](img/as_3.4_convert_to_constraintlayout.jpg)\n\n\
  图 19-44\n\n选择此菜单选项后，Android Studio 将将选布局转换为 `ConstraintLayout`，并使用推理建立约束，以匹配原始布局类型的行为。\n\
  \n### 19.19 总结\n\n重新设计的 `Layout Editor` 工具结合 `ConstraintLayout`，使得使用 Android Studio\
  \ 设计复杂的用户界面布局成为一个相对快速且直观的过程。本章详细介绍了约束（constraints）、外边距（margins）和偏置（bias）的概念，同时也探索了基于\
  \ `ConstraintLayout` 的设计集成到 `Layout Editor` 工具的方法。\n\n## 20. 在 Android Studio 中处理\
  \ ConstraintLayout 链和比例\n\n之前的章节已经介绍了 `ConstraintLayout` 类的关键特性，并概述了在 Android Studio\
  \ `Layout Editor` 中基于 `ConstraintLayout` 的用户界面设计的最佳实践。尽管 `ConstraintLayout` 链和比例的概念在标题为\
  \ \"A Guide to the Android ConstraintLayout\" 的章节中进行了概述，但我们尚未讨论过如何在 `Layout Editor`\
  \ 中利用这些功能。因此，本章的重点是提供在使用 `ConstraintLayout` 类时创建和管理链和比例的实际步骤。\n\n## 20.1 创建链（Chain）\n\
  \n链可以通过在 Activity 的 XML 布局资源文件中添加几行代码，也可以使用 `Layout Editor` 的某些链特定功能来实现。\n\n考虑一个包含三个\
  \ `Button` 控件的布局，它们被约束为定位在 `ConstraintLayout` 父布局的左上角、顶部中央和右上角，如图 20-1 所示：\n\n![](img/as_4.1_layout_buttons_no_chain.jpg)\n\
  \n图 20-1\n\n为了表示此类布局，XML 资源布局文件可能包含按钮控件的以下条：\n\n```xml\n<Button\n    android:id=\"\
  @+id/button1\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:layout_marginStart=\"8dp\"\n    android:layout_marginTop=\"\
  16dp\"\n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"\
  0.5\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n\n<Button\n    android:id=\"@+id/button2\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:layout_marginEnd=\"\
  8dp\"\n    android:layout_marginStart=\"8dp\"\n    android:layout_marginTop=\"16dp\"\
  \n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"0.5\"\n\
  \    app:layout_constraintEnd_toStartOf=\"@+id/button3\"\n    app:layout_constraintStart_toEndOf=\"\
  @+id/button1\"\n    app:layout_constraintTop_toTopOf=\"parent\" />\n\n<Button\n\
  \    android:id=\"@+id/button3\"\n    android:layout_width=\"wrap_content\"\n  \
  \  android:layout_height=\"wrap_content\"\n    android:layout_marginEnd=\"8dp\"\n\
  \    android:layout_marginTop=\"16dp\"\n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"\
  0.5\"\n    app:layout_constraintEnd_toEndOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n```\n\n按照目前的配置，没有双向约束将这些控件分组成一条链。为了解决这个问题，需要从 `button1` 的右侧到 `button2`\
  \ 的左侧添加额外的约束，并从 `button3` 的左侧到 `button2` 的右侧添加约束，如下所示：\n\n```xml\n<Button\n    android:id=\"\
  @+id/button1\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:layout_marginStart=\"8dp\"\n    android:layout_marginTop=\"\
  16dp\"\n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"\
  0.5\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n\n<Button\n    android:id=\"@+id/button2\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:layout_marginEnd=\"\
  8dp\"\n    android:layout_marginStart=\"8dp\"\n    android:layout_marginTop=\"16dp\"\
  \n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"0.5\"\n\
  \    app:layout_constraintEnd_toStartOf=\"@+id/button3\"\n    app:layout_constraintStart_toEndOf=\"\
  @+id/button1\"\n    app:layout_constraintTop_toTopOf=\"parent\" />\n\n<Button\n\
  \    android:id=\"@+id/button3\"\n    android:layout_width=\"wrap_content\"\n  \
  \  android:layout_height=\"wrap_content\"\n    android:layout_marginEnd=\"8dp\"\n\
  \    android:layout_marginTop=\"16dp\"\n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"\
  0.5\"\n    app:layout_constraintEnd_toEndOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n```\n\n通过这些更改，这些控件现在有了双向约束。这本质上构成了一个 `ConstraintLayout` 链，在 `Layout\
  \ Editor` 中的视觉表示如下方的图 20-2。注意，在此配置下，链默认使用散布（spread）样式。\n\n### 20.2 更改链样式\n\n如果没有配置链样式，`ConstraintLayout`\
  \ 将默认使用散布链样式。可以通过右键点击链中的任何控件并选择 `Cycle Mode`（循环模式）选项来更改链样式。每点击一次菜单选项，样式就会在散布（spread）、内部散布（spread\
  \ inside）和打包（packed）之间切换。\n\n或者，可以在 `Attributes` 窗口中展开 `layout_constraints` 属性，并根据链的方向更改\
  \ `horizontalChainStyle` 或 `verticalChainStyle` 属性来指定样式：\n\n![](img/as_4.1_chain_style.jpg)\n\
  \n图 20-3\n\n## 20.3 内部散布链样式\n\n图 20-4 展示了使用上述技术将链样式更改为内部散布链的效果：\n\n![](img/as_4.1_layout_horizontal_chain_spread_inside.jpg)\n\
  \n图 20-4\n\n## 20.4 打包链样式\n\n使用相同的技术，将链样式属性更改为 `packed`打包）会导致布局发生如图 20-5 所示的变化：\n\
  \n![](img/as_4.1_layout_horizontal_chain_packed.jpg)\n\n图 20-5\n\n## 20.5 带有偏置的打包链样式\n\
  \n打包链的位置可能会受到应用偏置值的影响。偏置可以是 0.0 到 1.0 之间的任何值，0.5 代表父布局的中心。偏置通过选择链头控件并在 `Attributes`\
  \ 面板中的 `layout_constraintHorizontal_bias` 或 `layout_constraintVertical_bias` 属性赋值值来控制。图\
  \ 20-6 显示了一个水平偏置设置为 0.2 的打包链：\n\n![](img/as_4.1_layout_horizontal_chain_packed_bias.jpg)\n\
  \n图 20-6\n\n\n\n\n\n链（chains）的最后一个探索领域涉及对单个组件进行加权，以控制链中每个组件在可用空间中所占据的。加权链只能通过扩散式链（spread\
  \ chain）样式来实现，且链中任何需要响应权重属性的组件都必须将其相应的尺寸属性（垂直链为高度，水平链为宽度）配置为 `match constraint`（匹配约束）模式。可以通过选择组件、显示属性（Attributes）面板并将尺寸（dimension）更改为\
  \ `match_constraint`（（等同于 `0dp`）来配置组件尺寸的匹配约束模式。例如，在图 20-7 中，按钮的 `layout_width` 约束已设置为\
  \ `match_constraint` (`0dp`)，表示该组件的宽度将根据现有的约束设置来确定：\n\n![](img/as_3.5_chain_match_constraints.jpg)\n\
  \n图 20-7\n\n假设已选择扩散式链样式，并且三个按钮都已配置为宽度维度设置为匹配约束，链中的组件将等比例扩展以填充可用空间：\n\n![](img/as_4.1_layout_horizontal_chain_match_constraints.jpg)\n\
  \n图 20-8\n\n每个组件相对于链中其他组件所占空间的大小可以通过向组件添加权重属性来控制。图 20-9 显示了将 `button1` 的 `layout_constraintHorizontal_weight`\
  \ 属性设置为 `4`，将 `button2` 和 `button3` 同时设置为 `2` 的效果：\n\n![](img/as_4.1_layout_horizontal_chain_weight.jpg)\n\
  \n图 20-9\n\n由于这些权重值，`button1` 占据了空间的一半 (4/8)，而 `button2` 和 `button3` 各占据空间的四分之一\
  \ (2/8)。\n\n### 20.7 使用比例\n\n`ConstraintLayout` 比例（ratios）允许组件的一个维度相对于组件的另一个维度（也称为宽高比）进行尺寸调整。例如，可以将比例设置应用于\
  \ `ImageView`，以确保其宽度始终是高度的两倍。\n\n尺寸比例约束通过通过将受约束的维度设置为匹配约束模式，并将该组件上的 `layout_constraintDimensionRatio`\
  \ 属性配置为所需的比例来实现。该比例值可以指定为浮点值或“宽度:高度”比例设置。例如，下面的 XML 代码段为 `ImageView` 组件配置了 2:1 的比例：\n\
  \n```xml\n<ImageView\n    android:layout_width=\"0dp\"\n    android:layout_height=\"\
  100dp\"\n    android:id=\"@+id/imageView\"\n    app:layout_constraintDimensionRatio=\"\
  2:1\" />\n```\n\n上面的示例演示了当仅设置一个维度为匹配约束时如何配置比例。当两个维度都设置为匹配约束模式时，也可以应用比例。这需要在比例前加加\
  \ `H` 或 `W`，以指明哪一个维度是相对于另一个维度受约束的。\n\n例如，考虑以下针对 `ImageView` 对象的 XML 代码段：\n\n```xml\n\
  <ImageView\n    android:layout_width=\"0dp\"\n    android:layout_height=\"0dp\"\n\
  \    android:id=\"@+id/imageView\"\n    app:layout_constraintBottom_toBottomOf=\"\
  parent\"\n    app:layout_constraintRight_toRightOf=\"parent\"\n    app:layout_constraintLeft_toLeftOf=\"\
  parent\"\n    app:layout_constraintTop_toTopOf=\"parent\"\n    app:layout_constraintDimensionRatio=\"\
  W,1:3\" />\n```\n\n在上面的示例中，高度将根据应用于其上的约束来定义。在这种情况下，约束已配置为使其附加到父视图的顶部和底部，实质上是将组件拉伸以填充父视图的高度。另一方面，宽度维度被约束为\
  \ `ImageView` 高度的三分之一。因此，无论布局显示在什么尺寸的屏幕或方向上，`ImageView` 的高度始终与父视图相同，宽度为该高度的三分之一。\n\
  \n也可以不需要手动编辑 XML 资源文件的情况下相同的结果。每当组件维度设置为匹配约束模式时，属性面板的检查器（Inspector）区域就会出现比例控制开关。例如，图\
  \ 20-10 显示了按钮组件的布局宽度和高度属性分别设置为匹配约束模式和 `100dp`，并在组件尺寸预览中高亮了比例控制开关：\n\n![](img/as_3.2_toggle_aspect_ratio_constraint.jpg)\n\
  \n图 20-10\n\n默认情况下，比例尺寸控制是关闭的。点击该控件可以启用比例约束，并显示一个可以在其中更改比例的额外字段：\n\n![](img/as_3.2_toggle_aspect_ratio_settings.jpg)\n\
  \n图 20-11\n\n### 20.8 总结\n\n链和比例都是 `ConstraintLayout` 类的强大功能，旨在为设计用户界面布局提供额外的选项。正如本章概述，Android\
  \ Studio 布局编辑器已经过增强，使得使用这些功能更加容易。\n\n## 21. Android 布局编辑器 ConstraintLayout 教程\n\n\
  到目前为止，为 Android 应用设计用户界面最简单最高效的方法是利用 Android Studio 布局编辑器。本章将概述如何使用这种方法创建基于 `ConstraintLayout`\
  \ 的用户界面。本章包含的练习也将作为从“空壳”Android Studio 项目创建一个活动的机会。\n\n### 21.1 Android 布局编辑器示例\n\
  \n此阶段的第一步是创建一个新项目。首先启动 Android Studio 并通过选择 `File -> Close Project` 来关闭任何已打开的项目。\n\
  \n在欢迎屏幕上选择 `New Project` 选项。在之前的示例中，我们请求 Android Studio 为项目创建一个模板活动。然而，我们将利用此教程学习手动创建一个活动以及相应的布局文件，因此在点击\
  \ `Next` 按钮之前，请确保选择了 `No Activity`。\n\n在 Name 字段中输入 `LayoutSample`，并在包名中指定 `com.ebookfzy.layoutsample`。在点击\
  \ `Finish` 按钮之前，将 Minimum API 设置为 `API 26: Android 8.0 (Oreo)`并将语言设置为 `Java`。\n\n\
  ### 21.2 创建新活动\n\n一旦项目创建完成，Android Studio 主窗口将出现，我们准备好创建一个新活动。这将是一个非常有价值的学习练习，因为在开发\
  \ Android 应用的过程中，有很多需要从零创建新活动的情况。\n\n如果 `Project` 工具窗口可见，请使用 `Alt-1/Cmd-1` 快捷键显示它。一旦显示了\
  \ Android 结构，通过点击 Project 窗口条目旁边的右箭头来展开它。这里的目标是访问 `app -> java -> com.ebookfzy.layoutsample`\
  \ 文件夹。一旦包名可见，右键点击它并选择 `New -> Activity -> Empty Activity` 菜单选项，如图图 21-1 所示。或者，选择\
  \ `New -> Activity -> Gallery...` 选项以浏览可用模板并在 `New Android Activity` 对话框中进行选择。\n\
  \n\n\n\n\n在生成的 New Android Activity 对话框中，将新活动命名为 `MainActivity`，布局命名为 `activity_main`。当然，该活动需要一个布局资源文件，因此确保启用\
  \ `Generate a Layout File`（生成布局文件）选项。\n\n为了让应用程序能够在设备上运行，它必须有一个被指定为启动活动（launcher\
  \ activity）的活动。如果没有启动活动，操作系统不知道在应用程序首次启动时启动哪个活动，导致应用程序启动失败。由于此示例只有一个活动，它需要被指定为应用程序的启动活动，因此请在点击\
  \ `Finish`（完成）按钮之前确保启用了 `Launcher Activity`（启动活动）选项。\n\n此时，Android Studio 应该向项目添加了两个文件。该活动的\
  \ Java 源代码文件位于 `app -> java -> com.ebookfrenzy.layoutsample` 文件夹中。\n\n此外，用户界面的 XML\
  \ 布局文件应该已创建在 `app -> res -> layout` 文件夹中。注意，此活动选择了 `Empty Activity` 模板，因此布局完全包含在\
  \ `activity_main.xml` 文件中，没有独立的内容布局文件。此外，由于我们不会编写任何代码来访问用户界面布局中的视图，因此没有必要将项目转换为支持视图绑定（view\
  \ binding）。\n\n最后，新活动应该已添加到 `AndroidManifest.xml` 文件中并指定为启动活动。清单文件可以在项目窗口的 `app\
  \ -> manifests` 文件夹下找到，并应包含以下 XML：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    package=\"com.ebookfrenzy.layoutsample\"\
  >\n    <application\n        android:allowBackup=\"true\"\n        android:dataExtractionRules=\"\
  @xml/data_extraction_rules\"\n        android:fullBackupContent=\"@xml/backup_rules\"\
  \n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\
  \n        android:roundIcon=\"@mipmap/ic_launcher_round\"\n        android:supportsRtl=\"\
  true\"\n        android:theme=\"@style/Theme.LayoutSample\"\n        tools:targetApi=\"\
  31\">\n        <activity\n            android:name=\".MainActivity\"\n         \
  \   android:exported=\"true\" >\n            <intent-filter>\n                <action\
  \ android:name=\"android.intent.action.MAIN\" />\n                <category android:name=\"\
  android.intent.category.LAUNCHER\" />\n            </intent-filter>\n        </activity>\n\
  \    </application>\n</manifest>\n```\n\n## 21.3 准备布局编辑器环境\n\n找到并双击 `app -> res\
  \ -> layout` 文件夹中的 `activity_main.xml` 布局文件，将其加载到 `Layout Editor` 工具中。由于本教程的目的是获得约束（constraints）的使用经验，请使用\
  \ `Layout Editor` 工具栏上的按钮关闭 `Autoconnect`（自动连接）功能。一旦禁用，该按钮将出现一条删除线，如 图 21-2 所示：\n\
  \n![](img/as_autoconnect_off.jpg)\n\n图 21-2\n\n如果 `Autoconnect` 按钮右侧的默认边距值未设置为 `8dp`，请点击它并在出现的面板中选择\
  \ `8dp`。\n\n用户界面设计还将利用 `ImageView` 对象来显示图像。在继续之前，应将此图像添加到项目中，以便在章节后续部分使用。该文件名为 `galaxysys6.png`，可以在从以下\
  \ URL 下载的示例代码 `project_icons` 文件夹中找到：\n\n[`www.ebookfrenzy.com/retail/eeljava/index.php`](https://www.ebookfrenzy.com/retail/eeljava/index.php)\n\
  \n在 Android Studio 中，显示 `Resource Manager` 工具窗口（`View -> Tool Windows -> Resource\
  \ Manager`）。在操作系统的文件导航器中找到 `galaxy6s.png` 图像，并将其拖到 `Resource Manager` 工具窗口中。在出现的对话框中，点击\
  \ `Next`（下一步）然后点击 `Import`（导入）按钮将图像添加到项目。图像现在应该出现在 `Resource Manager` 中，如 图 21-3\
  \ 所示：\n\n![](img/as_4.1_resource_manager.jpg)\n\n图 21-3\n\n图像还将出现在 `Project` 工具窗口的\
  \ `res -> drawables` 部分：\n\n![](img/Image2451.jpg)\n\n图 21-4\n\n## 21.4 向用户界面添加控件\n\
  \n从 `Common`调色板类别中，将一个 `ImageView` 对象拖到显示视图的中心。注意，会出现水平和垂直虚线，表示显示的中心轴。当居中时，释放鼠标按钮将视图放置在相应位置。一旦放置在布局中，将出现\
  \ `Resources` 对话框，请求在视图中要的图像。在位于对话框顶部的搜索栏中，输入 `galaxy` 以定位 `galaxys6.png` 资源，如 图\
  \ 21-5 所示。\n\n![](img/as_layoutsample_pick_image.jpg)\n\n图 21-5\n\n选择图像并点击 `OK`（确定）将其分配给\
  \ `ImageView`。如有，使用缩放句柄调整 `ImageView` 的大小并将其重新定位在布局中心。此时，布局应如 图 21-6 所示：\n\n![](img/as_3.5_layout_sample.jpg)\n\
  \n图 21-6\n\n从调色板的 `Common` 部分点击并拖入一个 `TextView` 对象，将其放置在 `ImageView` 上方，如 图 21-7\
  \ 所示。\n\n使用 `Attributes` 面，展开 `Common Attributes` 部分中的 `textAppearance` ，将 `textSize`\
  \ 属性更改为 `24sp`，`textAlignment` 设置为 `center`，并将文本设置为 `Samsung Galaxy S6`。\n\n![](img/as_3.5_textview_added.jpg)\n\
  \n图 21-7\n\n接下来，在布局底部添加三个 `Button` 控件，并将这些视图的文本属性设置为 `Buy Now`、`Pricing` 和 `Details`。完成后的布局现在应如\
  \ 图 21-8 所示：\n\n![](img/as_4.1_layout_sample.jpg)\n\n图 21-8\n\n此时，控件还没有足够的约束，布局引擎无法在运行时对控件进行定位和调整大小。如果现在运行该程序，所有控件都将位于显示器的左上角。\n\
  \n将控件添加到布局后，使用 `Layout Editor` 工具栏上的设备旋转按钮（如 图 21-9 中的箭头所示）在横向模式下查看用户界面：\n\n![](img/as_layout_editor_rotate.jpg)\n\
  \n图 21-9\n\n缺少约束导致布局无法适应设备方向的变化，导致内容偏离，并且部分图像和所有三个按钮位于屏幕可视区域之外。显然，还需要一些工作才能使其成为响应式用户界面。\n\
  \n### 21.5 添加约束\n\n约束是创建能够适应设备方向变化和不同屏幕尺寸的关键。首先将布局旋转回竖屏模式，并选择 `ImageView` 上方的 `TextView`\
  \ 控件。在选中控件时，从 `TextView` 的左侧、右侧和顶部到 `ConstraintLayout` 相应侧建立约束，如 图 21-10 所示：\n\n\
  ![](img/as_3.5_layout_sample_textview_constraints.jpg)\n\n图 21-10\n\n\n\n\n在约束了\
  \ `TextView` 小部件后，选择 `ImageView` 实例，并在左右两侧建立相反的约束，使每侧都连接到父布局相应的侧边。接下来，建立从 `ImageView`\
  \ 顶部到 `TextView` 底部的约束连接，以及从 `ImageView` 底部到中间 `Button` 小部件顶部的约束连接。如有必要，点击并拖动 `ImageView`，使其保持在布局的垂直中心位置。\n\
  \n在 `ImageView` 仍处于选中状态时，使用属性面板中的 `Inspector` 将 `ImageView` 的顶部和底部外边距分别更改为 `24`\
  \ 和 `8`，并将小部件的高度和宽度维度属性均更改为 `match_constraint`，以便小部件调整大小以匹配约束。这些设置将允许布局引擎在需要时放大或缩小\
  \ `ImageView` 的尺寸以适应布局变化：\n\n![](img/as_33_layout_attributes.jpg)\n\n图 21-11\n\n\
  图 21-12 显示了 `ImageView` 相对于布局中其他元素的当前实现的约束：\n\n![](img/as_4.1_layout_sample_ui_constrained.jpg)\n\
  \n图 21-12\n\n最后一个任务是为三个 `Button` 小部件添加约束。在本示例中，按钮将放置在一个链中。首先通过点击图 21-2 中高亮的工具栏按钮，在\
  \ `Layout Editor` 中开启 `Autoconnect`。\n\n接下来，点击 `Buy Now` 按钮，然后按住 Shift 点击另外两个按钮，使三个按钮都被选中。右键点击\
  \ `Buy Now` 按钮，并在弹出菜单中选择 `Chains` -> `Create Horizontal Chain` 。默认情况下，链将使用 `spread`\
  \ 样式显示，这是本示例的正确行为。\n\n最后，在 `Buy Now` 按钮底部和布局底部之间建立约束。对剩余按钮重复此步骤。\n\n完成这些步骤后，按钮应如图\
  \ 21-13 所示所示受到约束：\n\n![](img/as_4.1_layout_sample_chain.jpg)\n\n图 21-13\n\n### 21.6\
  \ 测试布局\n\n在布局中添加约束后，将屏幕旋转到横屏模式，验证布局是否适应了新的屏幕尺寸。\n\n虽然 `Layout Editor` 工具提供了一个实用的视觉环境来设计用户界面布局，但在测试方面，没有任何东西可以替代运行应用测试。在物理\
  \ Android 设备或模拟器会话上启动应用，验证用户界面是否反映了在 `Layout Editor` 中创建的布局。例如，图 21-14 显示了横屏模式下的运行应用：\n\
  \n![](img/as_4.1_layout_sample_completed.jpg)\n\n图 21-14\n\n用户界面设计现在已完成。设计更复杂的用户界面布局是上述步骤的延续。只需将视图拖放到显示器上，根据需要进行定位、约束并设置属性即可。\n\
  \n## 21.7 使用布局检查 (Layout Inspector)\n\n可以使用 `Layout Inspector` 工具随时查看组成用户界面布局的组件层次结构。要访问此信息，应用必须运行在运行\
  \ Android 29 或更高版本的设备或模拟器上。应用运行后，选择图 21-15 中标记为 `A` 的 `Tools` -> `Layout Inspector`\
  \ 选项。\n\n检查器加载后，左侧面板 (`B`) 显示层次结构。中间面板 (`C`) 显示布局的视觉表示。点击布局中的小部件将将其高亮。最后，最右侧的面板\
  \ (`D`) 包含当前选中组件的所有属性设置，如上例所示。这对于在源代码中定位非常有用。\n\n![](img/as_inspector.jpg)\n\n图\
  \ 21-15\n\n要查看 3D 布局，点击标记为 `E` 的按钮。这将显示一个“爆炸式”表示：\n\n![](img/as_inspector_3D.jpg)\n\
  \n图 21-16\n\n点击并拖动滑块进行旋转。再次点击按钮 `E` 返回 `2D` 视图。\n\n### 21.8 总结\n\nAndroid Studio\
  \ 中的 `Layout Editor` 工具与 `ConstraintLayout` 紧密集成。本章通过创建一个用户界面的示例，概述了添加约束的方法。\n\n\
  ## 22 Android 中的手动布局设计\n\n虽然使用 Android Studio Layout Editor 设计布局极大地提高了效率，但仍然可以通过手动编辑\
  \ XML 来创建 XML 布局。本章将介绍 XML 布局格式的基础。\n\n### 22.1 手动创建 XML 布局\n\nXML 布局的结构实际上非常简单并遵循视图树。XML\
  \ 资源的第一行理想情况下包含以下声明：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n```\n\
  \n该声明之后应当是布局的根元素，通常是一个容器视图（如布局管理器）。例如，下面的 XML 声明了一个 `ConstraintLayout` 作为根元素，并设置\
  \ `match_parent` 属性使其填充设备上的所有可用空间：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n    xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    android:layout_width=\"\
  match_parent\"\n    android:layout_height=\"match_parent\"\n    android:paddingLeft=\"\
  16dp\"\n    android:paddingRight=\"16dp\"\n    android:paddingTop=\"16dp\"\n   \
  \ android:paddingBottom=\"16dp\"\n    tools:context=\".MainActivity\">\n\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n注意，在上面的示例中，布局元素还配置了每侧 16dp（密度独立像素）的内边距。Android 布局中的任何间距规范都必须使用以下单位之一：\n\n\
  - `in` – 英寸。\n- `mm` – 毫米。\n- `pt` – 磅（1/72 英寸）。\n- `dp` – 密度独立像素。基于设备显示相对于 160dpi\
  \ 显示基准的物理密度的抽象单位。\n- `sp` – 缩放独立像素。与 dp 类似，但根据用户的字体偏好进行缩放。\n- `px` – 屏幕像素。不建议使用，因为不同的显示器像素不同。优先使用\
  \ `dp` 而非此单位。\n\n\n\n\n\n任何需要添加到 `ConstraintLayout` 父类的子组件必须嵌套在起始标签和结束标签之间。在以下示例中，一个\
  \ `Button` 组件被添加为 `ConstraintLayout` 的子组件：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n\n<androidx.constraintlayout.widget.ConstraintLayout\n    xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    android:layout_width=\"\
  match_parent\"\n    android:layout_height=\"match_parent\"\n    tools:context=\"\
  .MainActivity\">\n    <Button\n        android:text=\"My Button\"\n        android:layout_width=\"\
  wrap_content\"\n        android:layout_height=\"wrap_content\"\n        android:id=\"\
  @+id/button\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n```\n\n\
  按照目前的实现，按钮没有任何约束连接。因此，在运行时，按钮将出现在屏幕的左上角（尽管根据父布局分配的内边距会缩进 16dp）。然而，如果在按钮的两侧添加了相反的约束，它将显示在布局正中央：\n\
  \n```xml\n<Button\n    android:text=\"My Button\"\n    android:layout_width=\"wrap_content\"\
  \n    android:layout_height=\"wrap_content\"\n    android:id=\"@+id/button\"\n \
  \   app:layout_constraintBottom_toBottomOf=\"parent\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n```\n\n要向布局中添加第二个组件，只需将其嵌入 `ConstraintLayout` 元素的正体内即可。例如，以下修改向布局中添加了一个\
  \ `TextView` 组件：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    android:paddingLeft=\"16dp\"\n    android:paddingTop=\"16dp\"\n    android:paddingRight=\"\
  16dp\"\n    android:paddingBottom=\"16dp\"\n    tools:context=\".MainActivity\"\
  >\n    <Button\n        android:text=\"@string/button_string\"\n        android:layout_width=\"\
  wrap_content\"\n        android:layout_height=\"wrap_content\"\n        android:id=\"\
  @+id/button\"\n        app:layout_constraintBottom_toBottomOf=\"parent\"\n     \
  \   app:layout_constraintEnd_toEndOf=\"parent\"\n        app:layout_constraintStart_toStartOf=\"\
  parent\"\n        app:layout_constraintTop_toTopOf=\"parent\" />\n    <TextView\n\
  \        android:text=\"My Text\"\n        android:layout_width=\"wrap_content\"\
  \n        android:layout_height=\"wrap_content\"\n        android:id=\"@+id/textView\"\
  \ />\n</androidx.constraintlayout.widget.ConstraintLayout>\n```\n\n同样，新添加的 `TextView`\
  \ 缺少约束会导致它在运行时出现在布局的左上角。以下修改添加了与父布局连接的相反约束以使组件在水平上居中，同时添加了一个将 `TextView` 底部连接到 `button`\
  \ 顶部的约束：\n\n```xml\n<TextView\n    android:text=\"My Text\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:id=\"@+id/textView\"\
  \n    app:layout_constraintBottom_toBottomOf=\"parent\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n```\n\n\n\n\n\n与编写 Java 代码相比，使用 XML 资源文件设计用户界面具有许多关键优势。事实上，Google 在\
  \ Android 文档中花费了大量精力来推扬 XML 资源优于 Java 代码的优点。正如在前一节中讨论的，XML 方法的一个关键优势包括可以使用 Android\
  \ Studio 布局编辑器工具，该工具本身可以生成 XML 资源。另一个优势是，一旦创建了应用程序，只需修改 XML 文件即可对用户界面屏幕进行更改，从而避免了重新编译应用程序的必要。此外，即使是手动编写\
  \ XML 布局，也可以通过 Android Studio 布局编辑器工具的预览功能获取用户界面外观的实时反馈。而要测试由 Java 创建的用户界面外观，开发者不可避免地将反复通过“编写代码、编译和测试”的循环以完成设计工作。\n\
  \n在 Java 代码创建布局的优势方面，Java 相比 XML 资源文件最显著的优势可能在处理动态用户界面时发挥作用。XML 资源文件在定义静态布局时本质最有用，换句话说，就是这些布局在一次\
  \ activity 调用到下一次调用之间不太发生显著变化。相反，Java 代码非常适合在运行时动态创建用户界面。当用户界面可能受外部因素影响在每次执行 activity\
  \ 时显示不同的情况下，这种方法特别有用。\n\n当需要在 activity 运行时实时对基于静态 XML 资源的布局进行动态更改时，在 Java 代码中处理用户界面组件的知识也会有用。\n\
  \n最后，一些开发者简单地倾向于编写 Java 代码而不是使用布局工具和 XML，无论后方法提供哪些优势。\n\n## 23.2 创建视图 (Views)\n\n\
  如前所述，Android SDK 包含了一个视图类工具箱，旨在满足大多数基本用户界面设计需求。在 Java 中创建视图只需对这些类进行实例化，并传递与该视图要关联的\
  \ activity 引用作为参数。\n\n第一个视图（通常是一个可以添加额外子视图的容器视图）通过调用 activity 的 `setContentView()`\
  \ 方法向用户显示。可以通过调用对象的 `addView()` 方法向根视图添加额外的视图。\n\n当使用 Java 代码处理 XML 布局资源文件中包含的视图时，必须获取该视图的\
  \ ID。在 Java 中创建的视图也遵循相同的规则。因此，对于后续 Java 代码中需要某些类型访问的任何视图，都有必要分配一个 ID。这是通过调用相关 view\
  \ 对象的 `setId()` 方法实现的。在随后的代码中，可以通过对象的 `getId()` 方法获取视图的 ID。\n\n## 23.3 视图属性 (View\
  \ Attributes)\n\n每个视图类都关联有一系列属性。这些属性设置直接设置在视图实例上，通常定义了视图对象将如何外观或行为。属性的示例包括 `Button`\
  \ 对象上显示的文本，或 `ConstraintLayout` 视图的背景颜色。Android SDK 中的每个视图类都有一组预定义的方法，允许用户设置和获取这些属性值。例如，`Button`\
  \ 类有一个 `setText()` 方法，可以在 Java 代码内部调用它，以将按钮上显示的文本设置为特定的字符串值。另一方面，`ConstraintLayout`\
  \ 对象的背景颜色可以通过调用对象的 `setBackgroundColor()` 方法设置。\n\n## 23.4 约束集 (Constraint Sets)\n\
  \n虽然属性设置是视图对象内部的，并决定了视图的外观和行为，但约束集用于控制视图相对于其父视图和其他兄弟视图的显示方式。每个 `ConstraintLayout`\
  \ 实例都关联一组约束，定义了其子视图如何定位和受限约束。\n\n在 Java 代码中处理约束集的关键是 `ConstraintSet` 类。该类包含一系列方法，允许执行诸如创建、配置和将约束应用到\
  \ `ConstraintLayout` 实例等任务。此外，`ConstraintLayout` 实例的当前约束可以复制到 `ConstraintSet` 对象中，并用于将相同的约束应用于其他布局（可以或不带修改）。\n\
  \n`ConstraintSet` 实例的创建就像其他 Java 对象一样：\n\n```\nConstraintSet set = new ConstraintSet();\n\
  ```\n\n一旦创建了约束集，就可以在实例上调用方法来执行广泛的任务。\n\n#### 23.4.1 建立连接\n\n`ConstraintSet`类的 `connect()`\
  \ 方法用于建立视图之间的约束连接。以下代码配置了一个约束集，其中 `Button` 视图的左侧连接到 `EditText` 视图的右侧，边距为 70dp：\n\
  \n```\nset.connect(button1.getId(), ConstraintSet.LEFT, editText1.getId(), ConstraintSet.RIGHT,\
  \ 70);\n```\n\n#### 23.4.2 将约束应用到布局\n\n一旦配置了约束集，就必须将其应用到 `ConstraintLayout` 实例才能生效。约束集的应用是通过调用\
  \ `applyTo()` 方法实现的，并传递要应用设置的布局对象的引用：\n\n```\nset.applyTo(myLayout);\n```\n\n###\
  \ 23.4.3 父约束连接\n\n也可以通过引用 `ConstraintSet.PARENT_ID` 常量在子视图与其父 `ConstraintLayout`\
  \ 之间建立连接。在以下示例中，约束集被配置为将 `Button` 视图的顶部连接到父布局的顶部，边距为 100dp：\n\n```\nset.connect(button1.getId(),\
  \ ConstraintSet.TOP, ConstraintSet.PARENT_ID, ConstraintSet.TOP, 100);\n```\n\n\
  #### 23.4.4 尺寸约束\n\n有很多方法可以控制视图的尺寸行为。例如，以下代码将 `Button` 视图的水平尺寸设置为 `wrap content`，并将\
  \ `ImageView` 实例的垂直尺寸最大设置为 250dp：\n\n```\nset.constrainWidth(button1.getId(), ConstraintSet.WRAP_CONTENT);\n\
  set.constrainMaxHeight(imageView1.getId(), 250);\n```\n\n### 23.4.5 约束偏移 (Constraint\
  \ Bias)\n\n正如在 Android Studio 中使用 ConstraintLayout 的章节中所概述的，当一个视图具有相反的约束时，它会在约束的轴上居中（即水平或垂直）。可以通过沿特定的约束轴应用偏移来调整这种居中状态。当使用\
  \ Android Studio 布局编辑器时，这是通过“属性”工具窗口中的控件实现的。然而，在处理约束集时，可以使用 `setHorizontalBias()`\
  \ 和 `setVerticalBias()` 方法添加偏移，并引用视图 ID 和在 0 到 1 之间的浮点值作为偏移量。\n\n例如，以下代码首先将 `Button`\
  \ 的左侧和右侧约束到父布局相应的侧边，然后应用 25% 的水平偏移：\n\n```\nset.connect(button1.getId(), ConstraintSet.LEFT,\
  \ ConstraintSet.PARENT_ID, ConstraintSet.LEFT, 0);\nset.connect(button1.getId(),\
  \ ConstraintSet.RIGHT, ConstraintSet.PARENT_ID, ConstraintSet.RIGHT, 0);\nset.setHorizontalBias(button1.getId(),\
  \ 0.25f);\n```\n\n### 23.4.6 对齐约束 (Alignment Constraints)\n\n\n\n\n对齐也可以使用约束集（constraint\
  \ set）来实现。Android Studio 布局编辑器中提供的完整对齐选项也可以通过 `centerVertically()` 和 `centerHorizontally()`\
  \ 方法使用约束集进行配置，这两个方法都会根据正在配置的对齐方式接收多种不同的参数。此外，可以使用 `center()` 方法将视图在两个其他视图之间居中。\n\
  \n在下面的代码中，`button2` 的位置设置使其与 `button1` 水平对齐：\n\n```java\nset.centerHorizontally(button2.getId(),\
  \ button1.getId());\n```\n\n### 23.4.7 复制和应用约束集\n\n`ConstraintLayout` 实例的当前约束集可以使用\
  \ `clone()` 方法复制到约束集对象中。例如，下行代码将名为 `myLayout` 的 `ConstraintLayout` 实例的约束设置复制到一个约束集对象中：\n\
  \n```java\nset.clone(myLayout);\n```\n\n一旦复制，可以将约束集直接应用到另一个布局，或者像下面的示例所示，在应用到第二个布局之前进行修改：\n\
  \n```java\nConstraintSet set = new ConstraintSet();\nset.clone(myLayout);\nset.constrainWidth(button1.getId(),\
  \ ConstraintSet.WRAP_CONTENT);\nset.applyTo(mySecondLayout);\n```\n\n### 23.4.8\
  \ ConstraintLayout 链（Chains）\n\n也可以在约束集中中使用 `createHorizontalChain()` 和 `createVerticalChain()`\
  \ 创建垂直和水平链。使用这些方法的语法如下：\n\n```java\ncreateHorizontalChain(int leftId, int leftSide,\
  \ int rightId, int rightSide, int[] chainIds, float[] weights, int style);\n```\n\
  \n根据上面的语法，下面的示例创建了一个从 `button1` 开始到 `button4` 结束的水平散布链。在这些视图之间是 `button2` 和 `button3`，它们的权重都设置为零：\n\
  \n```java\nint[] chainViews = {button2.getId(), button3.getId()};\nfloat[] chainWeights\
  \ = {0, 0};\nset.createHorizontalChain(button1.getId(), ConstraintSet.LEFT, button4.getId(),\
  \ ConstraintSet.RIGHT, chainViews, chainWeights, ConstraintSet.CHAIN_SPREAD);\n\
  ```\n\n可以通过将要删除视图的 ID 传递给 `removeFromHorizontalChain()` 或 `removeFromVerticalChain()`\
  \ 方法之一来从链中移除视图。可以使用 `addToHorizontalChain()` 或 `addToVerticalChain()` 方法将视图添加到现有链中。在这两种情况下，方法接收的参数是新视图要插入的两个视图之间的\
  \ ID，如下：\n\n```java\nset.addToHorizontalChain(newViewId, leftViewId, rightViewId);\n\
  ```\n\n### 23.4.9 辅助线（Guidelines）\n\n使用 `create()` 方法向约束集添加辅助线，然后使用 `setGuidelineBegin()`、`setGuidelineEnd()`\
  \ 或 `setGuidelinePercent()` 方法进行定位。在下面的代码中，创建了一个垂直辅助线，并将其定位在父布局宽度的 50% 处。然后将按钮视图的左侧无边距连接到该辅助线：\n\
  \n```java\nset.create(R.id.myGuideline, ConstraintSet.VERTICAL_GUIDELINE);\nset.setGuidelinePercent(R.id.myGuideline,\
  \ 0.5f);\nset.connect(button.getId(), ConstraintSet.LEFT, R.id.myGuideline, ConstraintSet.RIGHT,\
  \ 0);\nset.applyTo(layout);\n```\n\n### 23.4.10 移除约束\n\n可以使用 `clear()` 方法从约束集中的视图移除约束，传递的参数是视图\
  \ ID 和要移除约束的锚点：\n\n```java\nset.clear(button.getId(), ConstraintSet.LEFT);\n```\n\
  \n同样，通过仅在 `clear()` 方法调用中引用视图，可以一次性移除该视图上的所有约束：\n\n```java\nset.clear(button.getId());\n\
  ```\n\n#### 23.4.11 缩放\n\n可以使用 `ConstraintSet.setScaleX()` 和 `setScaleY()` 方法调整布局内视图的缩放，这些方法接收的参数是要执行操作的视图以及一个表示缩放比例的浮点值。在下面的代码中，按钮对象被缩放为原始宽度的两倍和高度一半：\n\
  \n```java\nset.setScaleX(myButton.getId(), 2f);\nset.setScaleY(myButton.getId(),\
  \ 0.5f);\n```\n\n#### 23.4.12 旋转\n\n分别可以使用 `setRotationX()` 和 `setRotationY()` 方法在\
  \ X 轴或 Y 轴上旋转视图，这两个方法都必须传递要旋转视图的 ID 和代表要旋转角度的浮点值。旋转发生的中心点可以通过调用 `setTransformPivot()`、`setTransformPivotX()`\
  \ 和 `setTransformPivotY()` 方法来定义。下面的代码使用 500, 500 处的中心点在 Y 轴上旋转按钮 30 度：\n\n```java\n\
  set.setTransformPivot(button.getId(), 500, 500);\nset.setRotationY(button.getId(),\
  \ 30);\n```\n\n### 23.5 总结\n\n作为 XML 的替代，Android 用户界面可以在 Java 代码中动态创建。在 Java 代码中创建布局包括创建视图实例并在这些对象上设置属性以定义所需的显示。\n\
  \n视图相对于其 `ConstraintLayout` 父视图和任何兄弟视图的位置和大小是通过使用约束集定义的。约束集由 `ConstraintSet` 实例表示，一旦创建，就可以通过一系列方法调用进行配置，以执行建立连接、控制视图大小和创建链等任务。\n\
  \n在介绍了 `ConstraintSet` 类的基础知识后，下一章将通过教程把这些功能付诸。\n\n## 24. Android ConstraintSet\
  \ 教程\n\n上一章介绍了使用 Java 代码通过 `ConstraintLayout` 和 `ConstraintSet` 类创建和修改布局的基本概念。本章将通过创建一个完全在\
  \ Java 代码中创建的示例布局将这些概念付诸实践。\n\n### 24.1 在 Android Studio 中创建示例项目\n\n启动 Android Studio\
  \ 并在欢迎界面选择 New Project，在出现的新项目对话框中选择 Empty Activity 模板，然后点击 Next 按钮。\n\n在 Name 字段输入\
  \ `JavaLayout` 并指定 `com.ebookfrenzy.javalayout` 为包名。在点击 Finish 按钮之前，将 Minimum API\
  \ level 设置为 `API 26: Android 8.0 (Oreo)`，并将 Language 菜单设置为 Java。\n\n项目创建完成后，`MainActivity.java`\
  \ 文件应该会自动加载到编辑面板。正如我们预期的那样，Android Studio 创建了一个模板 Activity 并重写了 `onCreate()` 方法，为添加用于创建用户界的\
  \ Java 代码提供了一个理想的位置。\n\n### 24.2 向 Activity 添加视图\n\n`onCreate()` 方法目前设计为使用资源布局文件创建用户界面。因此，首先从该方法中删除此行：\n\
  \n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState) {\n   \
  \ super.onCreate(savedInstanceState);\n    setContentView(R.layout.activity_main);\n\
  }\n```\n\n\n\n下一次修改是向活动添加一个 `ConstraintLayout` 对象，该对象包含一个的 `Button` 视图作为子视图。这涉及创建\
  \ `ConstraintLayout` 和 `Button` 类的新实例。然后，需要将 `Button` 视图作为子视图添加到 `ConstraintLayout`\
  \ 视图中，该视图将通过调用活动实例的 `setContentView()` 方法显示：\n\n```java\npackage com.ebookfrenzy.javalayout;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\n\nimport android.os.Bundle;\n\
  \nimport androidx.constraintlayout.widget.ConstraintLayout;\n\nimport android.widget.Button;\n\
  import android.widget.EditText;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n \
  \       super.onCreate(savedInstanceState);\n        configureLayout();\n    }\n\
  \n    private void configureLayout() {\n        Button myButton = new Button(this);\n\
  \        ConstraintLayout myLayout = new ConstraintLayout(this);\n        myLayout.addView(myButton);\n\
  \        setContentView(myLayout);\n    }\n}\n```\n\n当以这种方式创建用户界面对象的新实例时，必须向构造方法传递创建该对象的上下文（context），在本例中，它是当前活动。由于上述代码位于活动类内部，因此通过标准的\
  \ `this` 关键字引用上下文：\n\n```java\nButton myButton = new Button(this);\n```\n\n一旦完成上述添加，请编译并运行应用程序（在物理设备或模拟器上）。启动后，可见的运行将是一个不包含文本的按钮出现在\
  \ `ConstraintLayout` 视图的左上角，如图 24-1 所示：\n\n![](img/Image24351.jpg)\n\n图 24-1\n\n\
  ### 24.3 设置视图属性\n\n为了本次练习，我们需要将 `ConstraintLayout` 视图的背景设置为蓝色，并让 `Button` 视图在黄色背景上显示文本“Press\
  \ Me”。这两项任务都可以通过如接下来的代码片段所示，在 Java 代码中设置视图的属性来实现。为了让按钮上的文本能够轻松翻译到其他语言，将将其作为 String\
  \ 资源添加。在项目（Project）工具窗口中，找到 `app -> res -> values -> strings.xml` 文件并对其进行修改，以为“Press\
  \ Me”字符串添加资源值：\n\n```xml\n<resources>\n    <string name=\"app_name\">JavaLayout</string>\n\
  \    <string name=\"press_me\">Press Me</string>\n</resources>\n```\n\n虽然这是处理直接在代码中引用字符串的推荐方法，但为了避免在书中剩余部分重复此步骤，许多后续代码示例将直接将字符串输入代码中。\n\
  \n一旦字符串作为资源存储，就可以如下方式从代码内部访问它：\n\n`getString(R.string.press_me);`\n\n创建字符串资源后，向\
  \ `configureLayout()` 方法添加代码以设置按钮的文本和颜色属性：\n\n.\n\n.\n\n```java\nimport android.graphics.Color;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private void configureLayout()\
  \ {\n        Button myButton = new Button(this);\n        myButton.setText(getString(R.string.press_me));\n\
  \        myButton.setBackgroundColor(Color.YELLOW);\n        ConstraintLayout myLayout\
  \ = new ConstraintLayout(this);\n        myLayout.setBackgroundColor(Color.BLUE);\n\
  \        myLayout.addView(myButton);\n        setContentView(myLayout);\n    }\n\
  }\n```\n\n当现在编译并运行应用程序时，布局将反映属性设置，使得布局将呈现蓝色背景，并且按钮将在黄色背景上显示分配的文本。\n\n### 24.4 创建视图\
  \ ID\n\n当布局完成后，它将由一个 `Button` 和一个 `EditText` 视图组成。在这些视图被 `ConstraintSet` 类的方法中引用之前，必须为它们分配唯一的视图\
  \ ID。此此过程的第一步是创建一个包含这些 ID 值的新资源文件。\n\n右键点击 `app -> res -> values` 文件夹，选择 `New ->\
  \ Values Resource File` 菜单选项并将新资源文件命名为 `id.xml`。创建资源文件后，对其进行编辑使其内容如下：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<resources>\n    <item name=\"myButton\"\
  \ type=\"id\" />\n    <item name=\"myEditText\" type=\"id\" />\n</resources>\n```\n\
  \n在教程的此时，只创建了 `Button`，因此编辑 `configureLayout()` 方法来分配相应的 ID：\n\n```java\nprivate\
  \ void configureLayout() {\n    Button myButton = new Button(this);\n    myButton.setText(getString(R.string.press_me));\n\
  \    myButton.setBackgroundColor(Color.YELLOW);\n    myButton.setId(R.id.myButton);\n\
  }\n```\n\n### 24.5 配置约束集\n\n在没有任何约束的情况下，`ConstraintLayout` 放置了 `Button` 视图。要指示布局将按钮放置在不同的位置（在本例中为水平和垂直居中），需要创建一个\
  \ `ConstraintSet` 实例，使用适当的设置对其初始化并将其应用于布局。对于此示例，需要配置按钮，使其宽度和高度受限于它正在显示的大小，并在父布局中居中。再次编辑\
  \ `configureLayout()` 方法来做出这些更改：\n\n.\n\n.\n\n```java\nimport android.constraintlayout.widget.ConstraintSet;\n\
  \nprivate void configureLayout() {\n    Button myButton = new Button(this);\n  \
  \  myButton.setText(getString(R.string.press_me));\n    myButton.setBackgroundColor(Color.YELLOW);\n\
  \    myButton.setId(R.id.myButton);\n    ConstraintLayout myLayout = new ConstraintLayout(this);\n\
  \    myLayout.setBackgroundColor(Color.BLUE);\n    myLayout.addView(myButton);\n\
  \    setContentView(myLayout);\n\n    ConstraintSet set = new ConstraintSet();\n\
  \    set.clone(myLayout);\n    set.constrainHeight(myButton.getId(), ConstraintSet.WRAP_CONTENT);\n\
  \    set.constrainWidth(myButton.getId(), ConstraintSet.WRAP_CONTENT);\n    set.connect(myButton.getId(),\
  \ ConstraintSet.START, ConstraintSet.PARENT_ID, ConstraintSet.START, 0);\n    set.connect(myButton.getId(),\
  \ ConstraintSet.END, ConstraintSet.PARENT_ID, ConstraintSet.END, 0);\n    set.connect(myButton.getId(),\
  \ ConstraintSet.TOP, ConstraintSet.PARENT_ID, ConstraintSet.TOP, 0);\n    set.connect(myButton.getId(),\
  \ ConstraintSet.BOTTOM, ConstraintSet.PARENT_ID, ConstraintSet.BOTTOM, 0);\n   \
  \ set.applyTo(myLayout);\n}\n```\n\n配置好初始约束后，编译并运行应用程序，验证 `Button` 视图现在位于布局的中心：\n\
  \n![](img/Image444.jpg)\n\n图 24-2\n\n### 24.6 添加 EditText 视图\n\n要添加到布局的下一个项目是 `EditText`\
  \ 视图。第一步是创建 `EditText` 对象，为其分配在 `id.xml` 资源文件中声明的 ID，并将其添加到布局中。现在需要按照如下方式对 `configureLayout()`\
  \ 方法进行代码更改：\n\n```java\nprivate void configureLayout() {\n    Button myButton =\
  \ new Button(this);\n    myButton.setText(getString(R.string.press_me));\n    myButton.setBackgroundColor(Color.YELLOW);\n\
  \    myButton.setId(R.id.myButton);\n    EditText myEditText = new EditText(this);\n\
  \    myEditText.setId(R.id.myEditText);\n    ConstraintLayout myLayout = new ConstraintLayout(this);\n\
  \    myLayout.setBackgroundColor(Color.BLUE);\n    myLayout.addView(myButton);\n\
  \    myLayout.addView(myEditText);\n    setContentView(myLayout);\n}\n```\n\n`EditText`\
  \ 组件旨在根据其显示的内容进行调整，在布局中水平居中，并位于现有 `Button` 视图上方 70dp。向 `configureLayout()` 方法添加代码使其内容如下：\n\
  \n.\n\n.\n\n`set.connect(myButton.getId(), ConstraintSet.START, ConstraintSet.PARENT_ID,\
  \ ConstraintSet.START, 0);`\n\n\n\n\n\n```java\nset.connect(myButton.getId(), ConstraintSet.END,\
  \ ConstraintSet.PARENT_ID, ConstraintSet.END, 0);\nset.connect(myButton.getId(),\
  \ ConstraintSet.TOP, ConstraintSet.PARENT_ID, ConstraintSet.TOP, 0);\nset.connect(myButton.getId(),\
  \ ConstraintSet.BOTTOM, ConstraintSet.PARENT_ID, ConstraintSet.BOTTOM, 0);\nset.constrainHeight(myEditText.getId(),\
  \ ConstraintSet.WRAP_CONTENT);\nset.constrainWidth(myEditText.getId(), ConstraintSet.WRAP_CONTENT);\n\
  set.connect(myEditText.getId(), ConstraintSet.START, ConstraintSet.PARENT_ID, ConstraintSet.START,\
  \ 0);\nset.connect(myEditText.getId(), ConstraintSet.END, ConstraintSet.PARENT_ID,\
  \ ConstraintSet.END, 0);\nset.connect(myEditText.getId(), ConstraintSet.BOTTOM,\
  \ myButton.getId(), ConstraintSet.TOP, 70);\nset.applyTo(myLayout);\n```\n\n应用程序的测试运行显示\
  \ `EditText` 字段居中位于按钮上方，且边距为 `70dp`。\n\n### 24.7 将密度无关像素 (dp) 转换为像素 (px)\n\n本次练习的下一项任务是将\
  \ `EditText` 视图的宽度设置为 `200dp`。正如\"Android Studio 布局编辑器 ConstraintLayout 教程”(#ConstraintLayout_Tutorial.xhtml__idTextAnchor538)章节概述的，在用户界面布局中设置尺寸和位置时，使用密度无关像素（`dp`）比像素（`px`）更好。使用\
  \ `dp` 设置位置，需要在运行时将 `dp` 值转换为 `px` 值，并考虑设备显示器的密度。因此，为了将 `EditText` 视图的宽度设置为 `200dp`，需要向类中添加以下代码：\n\
  \n```java\npackage com.ebookfrenzy.javalayout;\n\nimport android.content.res.Resources;\n\
  import android.util.TypedValue;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private int convertToPx(int value) {\n        Resources r = getResources();\n\
  \        return (int) TypedValue.applyDimension(\n            TypedValue.COMPLEX_UNIT_DIP,\
  \ value,\n            r.getDisplayMetrics());\n    }\n\n    private void configureLayout()\
  \ {\n        Button myButton = new Button(this);\n        myButton.setText(getString(R.string.press_me));\n\
  \        myButton.setBackgroundColor(Color.YELLOW);\n        myButton.setId(R.id.myButton);\n\
  \        EditText myEditText = new EditText(this);\n        myEditText.setId(R.id.myEditText);\n\
  \        int px = convertToPx(200);\n        myEditText.setWidth(px);\n    }\n}\n\
  ```\n\n再次编译并运行应用程序，并注意 `EditText` 视图的宽度已经发生变化，如[图 24-3 所示：\n\n![](img/Image24511.jpg)\n\
  \n图 24-3\n\n### 24.8 总结\n\n在本章创建的示例 activity 显然创建了一个类似的用户界面（不考虑背景颜色和视图类型的变化），这与之前的\"\
  在 Android Studio 中手动进行 XML 布局设计\"章节中创建的相似。尽管如此，本章应该让读者意识到，Android Studio 布局编辑器工具和\
  \ XML 资源在很大程度上保护了开发者，免受创建 Android 用户界面布局的复杂。\n\n然而，在某些情况下，使用 Java 创建用户界面是有意义的。这种方法非常有用，例如在创建动态用户界面布局时。\n\
  \n## 25. Android Studio 中使用 Apply Changes 的指南\n\n现在已经涵盖了使用 Android Studio 进行 Android\
  \ 开发的一些基本概念，现在是介绍 Android Studio Apply Changes（应用更改）功能的好时机。正如所有经验丰富的开发者所知的，等待应用编译和运行的每一秒都应该花在编写和完善代码上。\n\
  \n### 25.1 介绍 Apply Changes\n\n在 Android Studio 的早期版本中，每次需要测试对项目的更改时，Android Studio\
  \ 都会重新编译代码，将其转换为 Dex 格式，生成 APK 包并将其安装到设备或模拟器上。完成这些步骤后，应用程序最终启动并准备好测试。即使在快速的开发系统上，这也是一个需要相当时间才能完成的过程。对于大型应用程序，此过程花费一分钟或更长的时间并不罕见。\n\
  \n相比之下，Apply Changes 允许在项目中的许多代码和资源更改在应用程序已在设备或模拟器会话运行时几乎立即反映在应用中。\n\n举例来说，一个在 Android\
  \ Studio 中开发已在设备或模拟器上启动的应用程序。如果对资源设置或方法内的代码进行了更改，Apply Changes 将更新后的代码和资源推送到运行的应用程序并动态地“交换”更改。更改随后反映在运行的应用程序中，而无需构建、部署和重新启动整个应用程序。在许多情况下，这允许在不使用\
  \ Apply Changes 的所需时间的一内测试更改。\n\n### 25.2 理解 Apply Changes 选项\n\nAndroid Studio\
  \ 提供了针对运行应用应用更改的选项，分别是运行应用（Run App）、应用更改（Apply Changes）、重启 Activity（Restart Activity）和应用代码更改（Apply\
  \ Code Changes）。这些选项可以总结如下：\n\n*   **Run App (运行应用)** - 停止当前运行的应用程序并重启它。如果自上次启动以来项目未发生任何更改，此选项将仅重启应用程序。但如果对项目进行了更改，Android\
  \ Studio 将重新构建并安装应用程序。\n*   **Apply Code Changes (应用代码更改)** - 当对项目的更改仅涉及现有方法的修改或添加了新类或方法时，可以使用此选项。选中后，更改将应用到运行的应用程序，而无需重启应用程序。然而，当对资源（如布局文件）进行更改时，无法使用此模式。其他限制包括删除方法、更改方法签名、重命名类以及其他结构性代码更改。\n\
  *   **Apply Changes and Restart Activity (应用更改并重启 Activity)** - 选择此模式将动态应用于项目内的任何代码或资源更改并重启\
  \ Activity，而无需重新安装或重启应用程序。与 Apply Changes 选项不同，它可以应用于项目代码资源的更改，但相同的结构性代码更改和清单修改限制仍然适用。\n\
  \n### 25.3 使用 Apply Changes\n\n当项目加载到 Android Studio 但尚未在设备或模拟器上运行时，可以照常使用工具栏上的运行（如图\
  \ 25-1 中 A 所示）或调试（B）按钮启动：\n\n![](img/run_and_debug.jpg)\n\n图 25-1\n\n应用程序启动并运行后，运行按钮上的图标将更改以指示应用程序正在运行，且应用更改并重启\
  \ Activity 以及应用代码更改按钮将启用，如下图 25-2 所示：\n\n![](img/apply_changes_buttons.jpg)\n\n\
  图 25-2\n\n如果在选择一个 Apply Changes 按钮时无法应用更改，Android Studio 将显示一条指示失败的消息以及解释。例如，图 25-3\
  \ 显示了对资源文件进行更改后选择应用代码更改时 Android Studio 显示的消息：\n\n![](img/apply_changes_resource_error.jpg)\n\
  \n图 25-3\n\n\n\n在这种情况下，解决方案是使用 `Apply Changes and Restart Activity` 选项（此处提供了相关链接）。同样，当尝试应用涉及方法的添加或删除的更改时，将会出现以下消息：\n\
  \n![](img/as_apply_changes_method_error.jpg)\n\n图 25-4\n\n在这种情况下，唯一的选项是点击 `Run App`\
  \ 按钮来重新安装并启动应用。作为在这些情况下手动选择正确选项的替代方案，可以配置 Android Studio 自动回退到执行 `Run App` 操作。\n\
  \n## 25.4 配置 Apply Changes 回退设置\n\nApply Changes 回退设置位于 Android Studio 的 `Preferences`（偏好设置）窗口，该窗口通过选择\
  \ `File` -> `Settings` 菜单项显示（macOS 上为 `Android Studio` -> `Preferences`）。在 `Preferences`\
  \ 对话框中，选择左侧面板中的 `Build, Execution, Deployment` 项，然后选择 `Deployment`，如图 25-5 所示：\n\
  \n![](img/as_3.5_apply_changes_preferences.jpg)\n\n图 25-5\n\n一旦启用了所需的选项，点击 `Apply`\
  \ 然后点击 `OK` 按钮以提交更改并关闭对话框。在启用这些默认设置后，Android Studio 将会在需要自动重新安装并启动应用。\n\n## 25.5\
  \ Apply Changes 教程\n\n启动 Android Studio，从欢迎界面选择 `New Project` 选项，并在随后的新项目对话框中，在点击\
  \ `Next` 按钮之前选择 `Basic Activity` 模板。\n\n在 `Name` 字段中输入 `ApplyChanges`，并指定 `com.ebookfrenzy.applychanges`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置更改为 `API 26: Android 8.0 (Oreo)`，并将\
  \ `Language` 菜单更改为 `Java`。\n\n## 25.6 使用 Apply Code Changes\n\n首先点击运行按钮，并选择模拟器或物理设备作为运行目标。点击运行按钮后，跟踪从示例应用在设备或模拟器上出现所需的时间。\n\
  \n运行后，点击操作按钮（位于屏幕右下角的显示信封图标的按钮）。注意会出现一个 `Snackbar` 实例，显示文本为“Replace with your own\
  \ action”，如图 25-6 所示：\n\n![](img/app_changes_snackbar.jpg)\n\n图 25-6\n\n一旦应用运行，`Apply\
  \ Changes` 按钮应该已启用，表示某些项目更改可以在无需重新安装和启动应用的情况下应用。为了查看此效果，编辑 `MainActivity.java` 文件，找到\
  \ `onCreate` 方法并修改操作代码，以便在选择操作按钮时显示不同的消息：\n\n```java\nbinding.fab.setOnClickListener(new\
  \ View.OnClickListener() {\n    @Override\n    public void onClick(View view) {\n\
  \        Snackbar.make(view, \"Apply Changes is Amazing!\", Snackbar.LENGTH_LONG)\n\
  \                .setAction(\"Action\", null).show();\n    }\n});\n```\n\n实现代码更改后，点击\
  \ `Apply Code Changes` 按钮，注意几秒钟内会出现一条消息，表明应用已更新。点击操作按钮，注意新消息现在已显示在 `Snackbar` 中。\n\
  \n## 25.7 使用 Apply Changes and Restart Activity\n\n任何资源更改都需要使用 `Apply Changes and\
  \ Restart Activity` 选项。在 Android Studio 中选择 `app -> res -> layout -> fragment_first.xml`\
  \ 布局文件。使用 Design 模式下的 `Layout Editor` 工具，选择默认的 `TextView` 组件，并将属性工具窗口中的 `text` 属性更改为“Hello\
  \ Android”。\n\n在点击 `Apply Code Changes` 按钮之前，确保上述“#Configuring Apply Changes Fallback\
  \ Settings”]中列出的回退选项已关闭。注意请求失败了，因为此更改涉及项目资源。点击 `Apply Changes and Restart Activity`\
  \ 按钮，验证活动已重启并在 `TextView` 控件上显示新文本。\n\n## 25.8 使用 Run App\n\n如前所述，删除方法需要完全重新安装并重启正在运行的应用。为了体验这一点，编辑\
  \ `MainActivity.java` 文件，并在 `onCreate` 方法之后添加一个新方法，如下：\n\n```java\npublic void demoMethod()\
  \ {\n}\n```\n\n使用 `Apply Code Changes` 按钮并确认更改已应用而无需重新安装应用。\n\n接下来，删除新方法并验证点击两个\
  \ `Apply Changes` 按钮之一都会导致请求失败。在发生此类更改后，运行应用的唯一方法是点击 `Run App` 按钮。\n\n### 25.9 总结\n\
  \nApply Changes 是 Android Studio 的一项功能，旨在加速开发应用时的代码、构建和运行周期。`Apply Changes` 功能能够将更新推送到运行的应用中，在许多情况下无需重新安装甚至无需重启应用。Apply\
  \ Changes 提供了多个级别的支持，取决于对项目所应用的修改性质。\n\n## 26. Android 事件处理概述与示例\n\n前面的章节已经涵盖了许多关于\
  \ Android 应用用户界面设计的内容。然而，一个尚未涵盖的领域涉及用户与用户界面交互如何触发底层活动执行任务的方法。换句话说，从之前的章节中我们知道如何创建按钮用户界面，但不知道在用户触摸时让应用内部发生什么。\n\
  \n因此，本章的主要目标是提供 Android 事件处理的概述，并结合基于 Android Studio 的示例。\n\n### 26.1 理解 Android\
  \ 事件\n\nAndroid 事件有多种形式，但通常是响应外部动作而产生的。常见的事件形式（对于平板电脑和智能手机）涉及与触摸屏幕的某种形式交互。此类事件属于输入事件。\n\
  \nAndroid 框架维护一个事件队列，事件在发生时被放入其中。然后按照先进先出（FIFO）的原则从队列中移除。在触摸屏幕等输入事件的情况下，事件将传递给位于触摸位置的视图。除了事件通知外，视图还会接收有关事件性质的信息（取决于事件类型），例如手指与屏幕接触点的坐标。\n\
  \n为了能够处理传递过的事件，视图必须配备事件监听器。Android `View` 类（所有用户界面组件均派自于）包含一系列事件监听接口，每个接口都包含一个回调方法的抽象声明。为了能够响应特定类型的事件，视图必须注册相应的事件监听器并实现相应的回调。\n\
  \n## 26.2 使用 android:onClick 资源\n\n\n\n\n\n在详细探索事件监听器之前，值得注意的是，如果只需要在用户“点击”用户界面上的按钮视图时调用一个回调方法，可以使用一种快捷方法。考虑一个包含名为\
  \ `button1` 的按钮视图的用户界面布局，其要求是当用户触碰按钮时，调用在活动类（activity class）中声明的 `buttonClick()`\
  \ 方法。实现此行为只需要编写 `buttonClick()` 方法（该方法接受触发点击事件的视图引用作为参数），并在 XML 文件中的按钮视图声明中添加一行代码即可。例如：\n\
  \n```xml\n<Button\n    android:id=\"@+id/button1\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:onClick=\"\
  buttonClick\"\n    android:text=\"Click me\" />\n```\n\n这提供了一种捕获点击事件的简单方法。然而，它并没有提供事件处理器（event\
  \ handlers）提供的范围选项，这是本章后续的主题。正如后续章节概述的，`onClick` 属性在涉及片段（fragments）的布局中也具有局限性。在\
  \ Android Studio 布局编辑器中工作时，当在设备屏幕布局中选择合适的视图类型时，可以在属性面板（Attributes panel）找到并配置 `onClick`\
  \ 属性。\n\n## 26.3 事件监听器与回调方法\n\n在本章稍后概述的示例活动中将详细介绍注册事件监听器和实现回调方法的涉及步骤。但在在此之前，值得花些时间概述\
  \ Android 框架中提供的事件监听器以及与每个关联的回调方法。\n\n- `onClickListener` – 用于检测点击样式事件，用户触碰然后释放由视图占据的设备显示区域。对应于\
  \ `onClick()` 回调方法，该方法将接收事件的视图引用作为参数传递。\n- `onLongClickListener` – 用于检测用户是否在视图上长时间保持触摸。对应于\
  \ `onLongClick()` 回调方法，该方法将接收事件的视图作为参数传递。\n- `onTouchListener` – 用于检测与触摸屏的任何形式接触，包括单次或多次触摸以及手势动作。与\
  \ `onTouch()` 回调对应，该主题将在 Android 触摸和多点事件处理章节中进行更详细的介绍。回调方法将接收事件的视图和一个 `MotionEvent`\
  \ 对象作为参数传递。\n- `onCreateContextMenuListener` – 监听由于长按产生的上下文菜单创建。对应于 `onCreateContextMenu()`\
  \ 回调方法。回调将接收菜单、接收事件的视图和一个菜单上下文对象。\n- `onFocusChangeListener` – 检测焦点是否因与轨迹球或导航键的交互而移出当前视图。对应于\
  \ `onFocusChange()` 回调方法，该方法将接收事件的视图和一个用于指示是否获得或丢失焦点的 `Boolean` 值传递。\n- `onKeyListener`\
  \ – 用于检测当视图拥有焦点时按了设备上的按键。对应于 `onKey()` 回调方法。传递参数的是接收事件的视图、所按物理键的 `KeyCode` 以及一个\
  \ `KeyEvent` 对象。\n\n### 26.4 事件处理示例\n\n在本章的剩余部分中，我们将完成一个 Android Studio 项目的创建，该项目旨在演示事件监听器和相应回调方法的实现，以检测用户何时点击了按钮。回调方法中的代码将更新文本视图（text\
  \ view）以指示事件已处理。\n\n从欢迎界面选择 `New Project`（新建项目）选项，在生成的新项目对话框中，点击 `Next`（下一步）按钮之前选择\
  \ `Empty Activity` 模板。\n\n在 `Name`（名称）字段中输入 `EventExample` 并指定 `com.ebookfrenzy.eventexample`\
  \ 为包名。在点击 `Finish`（完成）按钮之前，将最低 API 级别设置为 `API 26: Android 8.0 (Oreo)`，并将语言菜单更改为\
  \ `Java`。按照章节 11.8 将项目迁移到 View Binding 中概述的步骤，将项目转换为使用 view binding。\n\n### 26.5\
  \ 设计用户界面\n\n示例中 `MainActivity` 类的用户界面布局将由一个 `ConstraintLayout`、一个 `Button` 和一个 `TextView`\
  \ 组成，如图 26-1 所示所示。\n\n![](img/as_4.1_event_example_ui.jpg)\n\n图 26-1\n\n找到并选择 Android\
  \ Studio 创建的 `activity_main.xml` 文件（位于 Project 工具窗口的 `app -> res -> layouts` 下），并双击它将其加载到布局编辑器工具中。\n\
  \n确保 `Autoconnect`（自动连接）已启用，然后从调板中拖入一个 `Button` 组件并移动使其位于布局的水平中心且现有 `TextView` 组件的下方。当位置正确时，将组件释放到到位，以便自动连接系统添加适当的约束。\n\
  \n选择“Hello World!” `TextView` 组件，并使用属性面板将 ID 设置为 `statusText`。重复此步骤将 `Button` 组件的\
  \ ID 更改为 `myButton`。\n\n点击布局编辑器工具栏上的 `Infer Constraints`（推断约束）按钮添加任何缺失的约束。\n\n选中\
  \ `Button` 组件，使用属性面板将属性设置为 `Press Me`。将按钮上的文本提取为名为 `press_me` 的资源。\n\n用户界面布局完成后，下一步是注册事件监听器和回调方法。\n\
  \n## 26.6 事件监听器与回调方法\n\n在该示例中，需要为 `myButton` 视图注册 `OnClickListener`。通过调用按钮视图的 `setOnClickListener()`\
  \ 方法来实现，传递一个新的 `OnClickListener` 作为参数并实现 `onClick()` 方法。由于这是一个只需要在创建活动时执行的任务，良好的位置是\
  \ `MainActivity` 类的 `onCreate()` 方法。\n\n如果 `MainActivity.java` 文件已在编辑器会话中打开，点击编辑器面板中的标签页选择它。或者在\
  \ Project 窗口中导航到 `app -> java -> com.ebookfrenzy.eventexample -> MainActivity` 并双击将其加载到代码编辑器中。加载后，找到模板\
  \ `onCreate()` 方法并修改以获取视图引用、注册事件监听器并实现 `onClick()` 方法：\n\n```java\npackage com.ebookfrenzy.eventexample;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\nimport android.os.Bundle;\n\
  import android.view.View;\nimport android.widget.Button;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private ActivityMainBinding binding;\n\n    @Override\n\
  \    protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        binding = ActivityMainBinding.inflate(getLayoutInflater());\n        View\
  \ view = binding.getRoot();\n        setContentView(view);\n\n        binding.myButton.setOnClickListener(\n\
  \            new Button.OnClickListener() {\n                @Override\n       \
  \         public void onClick(View v) {\n                    // 事件逻辑在这里\n      \
  \          }\n            }\n        );\n    }\n}\n```\n\n\n\n\n\n上述代码现在已经在按钮上注册了事件监听器，并实现了\
  \ `onClick()` 方法。然而，如果此时运行应用程序，将没有任何迹象表明安装在按钮上的事件监听器正在工作，因为在 `onClick()` 回调方法的体内尚未实现任何代码。本示例的目标是在点击按钮时在\
  \ `TextView` 上显示一条消息，因此需要对代码进行一些进一步更改：\n\n```java\n@Override\nprotected void onCreate(Bundle\
  \ savedInstanceState) {\n    super.onCreate(savedInstanceState);\n    binding =\
  \ ActivityMainBinding.inflate(getLayoutInflater());\n    View view = binding.getRoot();\n\
  \    setContentView(view);\n    binding.myButton.setOnClickListener(\n        new\
  \ Button.OnClickListener() {\n            public void onClick(View v) {\n      \
  \          binding.statusText.setText(\"Button clicked\");\n            }\n    \
  \    }\n    );\n}\n```\n\n通过在 AVD 模拟器或物理 Android 设备上编译并运行应用程序，来完成教程的这一阶段。在触摸并释放按钮视图（即所谓的“点击”）时，文本视图应该发生变化并显示“Button\
  \ clicked”文本。\n\n### 26.7 消费事件\n\n在视图上检测标准点击（与长点击相对）是事件处理的一个非常简单的情况。现在将扩展示例以包含对长点击事件的检测，长点击事件发生在用户点击并按住屏幕上的视图时，并借此涵盖事件消费的主题。\n\
  \n考虑本章上一节中 `onClick()` 方法的代码。该回调被声明为 `void`，因此它在执行完毕后不会向 Android 框架返回值。\n\n另一方面，分配给\
  \ `onLongClickListener` 的代码需要向 Android 框架返回一个 `Boolean` 值。此返回值的目的是向 Android 运行时指示回调是否已经消费了该事件。如果回调返回\
  \ `true` 值，则事件将由框架丢弃。反，如果回调返回 `false` 值，Android 框架将认为该事件仍然有效，并因此将其传递给在同一视图上注册的下一个匹配的事件监听器。\n\
  \n与许多编程概念一样，这可能通过示例演示得最好。第一步是为示例活动中的按钮视图添加长点击的事件监听器和回调方法：\n\n```java\n@Override\n\
  protected void onCreate(Bundle savedInstanceState) {\n. ...\n.\n    binding.myButton.setOnLongClickListener(\n\
  \        new Button.OnLongClickListener() {\n            public boolean onLongClick(View\
  \ v) {\n                binding.statusText.setText(\"Long button click\");\n   \
  \             return true;\n            }\n        }\n    );\n}\n```\n\n显然，当检测到长点击时，`onLongClick()`\
  \ 回调方法将在文本视图上显示“Long button click”。但注意，该回调方法也返回 `true` 值以表示它已消费了该事件。运行应用程序并按住 `Button`\
  \ 视图直到文本视图中出现“Long button click”文本。释放按钮时，文本视图继续显示“Long button click”文本，表明 `onClick`\
  \ 监听器代码未被调用。\n\n接下来，修改代码使 `onClick` 监听器不被调用：\n\n```java\nbutton.setOnLongClickListener(\n\
  \    new Button.OnLongClickListener() {\n        public boolean onLongClick(View\
  \ v) {\n            TextView myTextView = findViewById(R.id.statusText);\n     \
  \       myTextView.setText(\"Long button click\");\n            return false;\n\
  \        }\n    }\n);\n```\n\n再次编译并运行应用程序，并对按钮进行长点击。释放按钮后，文本视图继续显示“Long button click”文本。\n\
  \n### 26.8 总结\n\n如果用户界面包含的视图不对用户交互做出任何响应，那么该界面几乎毫无用处。Android 定义了一组事件监听器。当视图上发生事件时，它会被放入队列中并由运行时处理。如果视图注册了与事件匹配的监听器，则会调用相应的方法。某些方法要求返回一个\
  \ `Boolean` 值，指示系统是需要传递还是丢弃该事件。在涵盖事件处理的基础知识后，下一章将探索触摸事件。\n\n## 27 Android 触摸和多点事件处理\n\
  \n大多数 Android 设备使用触摸屏作为主要接口。上一章介绍了将触摸转换为动作的机制。然而，触摸处理远比响应视图上的单指点击要复杂。例如，大多数 Android\
  \ 设备可以同时检测到多个触摸点。触摸也不限于单点。当然，当用户在表面滑动一个或多个接触点时，触摸可以是动态的。\n\n应用程序还可以将触摸解释为手势。例如，水平滑动通常用于翻页电子书，或者捏合动作如何缩放图像。本章将解释通过注册\
  \ `onTouchListener` 事件监听器并实现相应的 `onTouch()` 回调方法由视图对象拦截触摸事件，并探索拦截多个触摸的概念。识别手势的主题将在下一章涵盖。\n\
  \n### 27.1 拦截触摸事件\n\n视图对象可以通过注册 `onTouchListener` 事件监听器并实现相应的 `onTouch()` 回调方法来拦截触摸事件。例如，下面的代码确保名为\
  \ `myLayout` 的 `ConstraintLayout` 实例上的任何触摸都会调用 `onTouch()` 方法：\n\n```java\nbinding.myLayout.setOnTouchListener(\n\
  \    new ConstraintLayout.OnTouchListener() {\n        public boolean onTouch(View\
  \ v, MotionEvent m) {\n            // 在处执行任务\n            return true;\n       \
  \ }\n    }\n);\n```\n\n### 27.2 MotionEvent 对象\n\n\n\n\n传递给 `onTouch()` 回调方法的 `MotionEvent`\
  \ 对象是获取事件信息的关键。该对象中包含的信息包括触摸在视图中的位置以及所执行的操作类型。`MotionEvent` 对象也是处理多点触摸的关键。\n\n##\
  \ 27.3 理解触摸动作\n\n触摸事件处理的一个重要方面是能够识别用户执行的操作类型。通过调用传递给 `onTouch()` 回调方法的 `MotionEvent`\
  \ 对象的 `getActionMasked()` 方法，可以获取与事件关联的动作类型。当视图上发生第一次触摸时，`MotionEvent` 对象将包含一个动作类型\
  \ `ACTION_DOWN` 以及触摸坐标。当该触摸从屏幕上抬起时，会产生一个 `ACTION_UP` 事件。在 `ACTION_DOWN` 和 `ACTION_UP`\
  \ 事件之间的任何触摸移动将由 `ACTION_MOVE` 事件表示。\n\n当在视图上同时进行多个触摸操作时，这些触摸被称为“指针”（pointers）。在多点触摸场景中，指针分别通过类型为\
  \ `ACTION_POINTER_DOWN` 和 `ACTION_POINTER_UP` 的事件动作开始和结束。要识别触发事件的指针索引，必须调用 `MotionEvent`\
  \ 对象的 `getActionIndex()` 回调方法。\n\n## 27.4 处理多点触摸\n\n名为“Android 事件处理概述与示例”的章节在单次触摸事件的狭窄背景下开始探索事件处理。在实践中，大多数\
  \ Android 设备都具有响应多个连续触摸的能力（但需要注意的是，可以检测到的同时触摸数量取决于设备）。\n\n正如之前讨论的，在多点触摸情况下，多点触摸中的每次触摸都被\
  \ Android 框架视为一个指针。每个指针反过来通过一个索引值被引用并分配一个 ID。当前的指针数量可以通过调用当前 `MotionEvent` 对象的 `getPointerCount()`\
  \ 方法来获取。当前指针列表中特定索引处的指针的 ID，可以通过调用 `MotionEvent.getPointerId()` 方法来获取。例如，以下代码段落获取了指针的计数以及索引为\
  \ 0 的指针的 ID：\n\n```java\npublic boolean onTouch(View v, MotionEvent m) {\n    int\
  \ pointerCount = m.getPointerCount();\n    int pointerId = m.getPointerId(0);\n\
  \    return true;\n}\n```\n\n请注意，当 `onTouch` 监听器被触发时，指针计数将始终大于或等于 1（因为回调的触发至少必须发生一次触摸）。\n\
  \n对视图的触摸，特别是涉及跨屏幕移动的触摸会在接触点从屏幕抬起之前产生一系列事件。因此，应用程序可能需要跨越多个触摸事件来跟踪单个触摸。虽然特定触摸手势的 ID\
  \ 不会从一个事件变到下一个事件，但重要的是要记住，索引值会随着其他触摸事件的到来和离开而改变。因此，在跨越多个事件处理触摸手势时，必须使用 ID 值作为触摸引用，以确保跟踪的是同一次触摸。在调用需要索引值的方法时，应该通过调用\
  \ `MotionEvent` 对象的 `findPointerIndex()` 方法将触摸的 ID 转换为相应的索引值来获取它。\n\n## 27.5 多触摸应用程序示例\n\
  \n在本章剩余部分创建的示例应用程序将跟踪在跨越布局视图移动的最多两个触摸手势。当每个触摸的事件被触发时，每个触摸的坐标、索引和 ID 将显示在屏幕上。\n\n\
  从欢迎界面选择“New Project”（新建项目）选项，在生成的新项目对话框中，在点击“Next”（下一步）按钮之前选择“Empty Activity”（空活动）模板。\n\
  \n在“Name”（名称）字段中输入 `MotionEvent`，并指定 `com.ebookfrenzy.motionevent` 为包名。在点击“Finish”（完成）按钮之前，将“Minimum\
  \ API level”（最低 API 级别）设置为 API 26: Android 8.0 (Oreo)，并将“Language”（语言）菜单设置为 Java。\n\
  \n按照第 11.8 节“将项目迁移到 View Binding”所述，调整项目以使用 view binding。\n\n## 27.6 设计 Activity\
  \ 用户界面\n\n应用程序唯一 Activity 的界面由一个包含两个 `TextView` 对象的 `ConstraintLayout` 视图组成。在 Project\
  \ 工具窗口中，导航到 `app -> res -> layout` 并双击 `activity_main.xml` 布局资源文件，将其加载到 Android\
  \ Studio 布局编辑器中。\n\n选择并删除默认的“Hello World!” `TextView` 部件，然后在启用自动连接的情况下，拖放一个新的 `TextView`\
  \ 部件，使其水平居中并位于布局顶部边缘的 16dp 边距线上：\n\n![](img/as_4.1_motion_event_one_textview.jpg)\n\
  图 27-1\n\n拖入第二个 `TextView` 部件，并对其进行定位和约束，使其与第一个部件的底部保持 32dp 的距离：\n\n![](img/as_4.1_motion_event_two_textviews.jpg)\n\
  图 27-2\n\n使用 Attributes 工具窗口将 `TextView` 部件的 ID 分别更改为 `textView1` 和 `textView2`。将部件上显示的文本更改为“Touch\
  \ One Status”和“Touch Two Status”，并使用布局右上角的警告按钮将字符串提取到资源中。\n\n### 27.7 实现触摸监听器\n\n\
  为了接收事件通知，需要在 `MainActivity` 类的 `onCreate()` 方法中为布局注册触摸监听器。从 Android Studio 面板选择\
  \ `MainActivity.java` 显示源码。在 `onCreate()` 方法中添加代码以注册监听器，在这种情况下，它将调用一个名为 `handleTouch()`\
  \ 的方法并传递 `MotionEvent` 对象：\n\n```java\npackage com.ebookfrenzy.motionevent;\n\n\
  import androidx.appcompat.app.AppCompatActivity;\nimport androidx.constraintlayout.widget.ConstraintLayout;\n\
  import android.os.Bundle;\nimport android.view.MotionEvent;\nimport android.view.View;\n\
  import com.ebookfrenzy.motionevent.databinding.ActivityMainBinding;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n    ActivityMainBinding binding;\n\n\
  \    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n     \
  \   super.onCreate(savedInstanceState);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n       \
  \ binding.activityMain.setOnTouchListener(\n            new ConstraintLayout.OnTouchListener()\
  \ {\n                public boolean onTouch(View v, MotionEvent m) {\n         \
  \           handleTouch(m);\n                    return true;\n                }\n\
  \            }\n        );\n    }\n}\n```\n\n当我们设计用户界面时，父 `ConstraintLayout` 没有分配允许通过\
  \ view binding 机制访问的 ID。由于该布局组件是 UI 层次结构的顶层组件，我们能够使用上述代码中的 `root` 属性引用它。\n\n在测试应用程序之前的最后一个任务是实现监听器调用的\
  \ `handleTouch()` 方法。该方法的代码如下：\n\n```java\nvoid handleTouch(MotionEvent m) {\n \
  \   int pointerCount = m.getPointerCount();\n    for (int i = 0; i < pointerCount;\
  \ i++) {\n        int x = (int) m.getX(i);\n        int y = (int) m.getY(i);\n \
  \       int id = m.getPointerId(i);\n        int action = m.getActionMasked();\n\
  \        int actionIndex = m.getActionIndex();\n        String actionString;\n \
  \   }\n}\n```\n\n\n\n\n```java\nswitch (action)\n{\n    case MotionEvent.ACTION_DOWN:\n\
  \        actionString = \"DOWN\";\n        break;\n    case MotionEvent.ACTION_UP:\n\
  \        actionString = \"UP\";\n        break;\n    case MotionEvent.ACTION_POINTER_DOWN:\n\
  \        actionString = \"PNTR DOWN\";\n        break;\n    case MotionEvent.ACTION_POINTER_UP:\n\
  \        actionString = \"PNTR UP\";\n        break;\n    case MotionEvent.ACTION_MOVE:\n\
  \        actionString = \"MOVE\";\n        break;\n    default:\n        actionString\
  \ = \"\";\n}\nString touchStatus = \"Action: \" + actionString + \" Index: \" +\
  \ actionIndex + \" ID: \" + id + \" X: \" + x + \" Y: \" + y;\nif (id == 0)\n  \
  \  binding.textView1.setText(touchStatus);\nelse\n    binding.textView2.setText(touchStatus);\n\
  }\n```\n\n在编译和运行应用程序之前，花时间系统地梳理这段代码，以突出显示正在执行的任务。\n\n代码首先获取用户界面中两个 `TextView` 对象的引用，并识别视图上当前有多少个活跃的指针：\n\
  \n```java\nTextView textView1 = findViewById(R.id.textView1);\nTextView textView2\
  \ = findViewById(R.id.textView2);\nint pointerCount = m.getPointerCount();\n```\n\
  \n接下来，使用 `pointerCount` 变量启动一个 `for` 循环，为每个活跃的指针执行一组任务。循环的前几行获取触摸的 `X` 和 `Y` 坐标，以及相应的事件\
  \ `ID`、动作类型和动作索引。最后，声明了一个字符串变量：\n\n```java\nfor (int i = 0; i < pointerCount; i++)\n\
  {\n    int x = (int) m.getX(i);\n    int y = (int) m.getY(i);\n    int id = m.getPointerId(i);\n\
  \    int action = m.getActionMasked();\n    int actionIndex = m.getActionIndex();\n\
  \    String actionString;\n}\n```\n\n由于动作类型等于整数值，因此使用 `switch` 语句将动作类型转换为更有意义的字符串值，并将其存储在之前声明的\
  \ `actionString` 变量中：\n\n```java\nswitch (action)\n{\n    case MotionEvent.ACTION_DOWN:\n\
  \        actionString = \"DOWN\";\n        break;\n    case MotionEvent.ACTION_UP:\n\
  \        actionString = \"UP\";\n        break;\n    case MotionEvent.ACTION_POINTER_DOWN:\n\
  \        actionString = \"PNTR DOWN\";\n        break;\n    case MotionEvent.ACTION_POINTER_UP:\n\
  \        actionString = \"PNTR UP\";\n        break;\n    case MotionEvent.ACTION_MOVE:\n\
  \        actionString = \"MOVE\";\n        break;\n    default:\n        actionString\
  \ = \"\";\n}\n```\n\n最后，使用 `actionString` 值、动作索引、触摸 `ID` 以及 `X` 和 `Y` 坐标构建字符串消息。然后使用\
  \ `ID` 值来决定该字符串应该显示在第一个或第二个 `TextView` 上：\n\n```java\nString touchStatus = \"Action:\
  \ \" + actionString + \" Index: \" + actionIndex + \" ID: \" + id + \" X: \" + x\
  \ + \" Y: \" + y;\nif (id == 0)\n    binding.textView1.setText(touchStatus);\nelse\n\
  \    binding.textView2.setText(touchStatus);\n```\n\n### 2.8 运行示例\n\n编译并运行应用程序，一旦启动，在屏幕上进行单点和多点触摸实验，并注意文本视图会更新以反映事件，如图\
  \ 27-3 所示。在模拟器上运行时，可以通过按住 `Ctrl` 键（macOS 上为 Cmd）的同时点击鼠标按钮来模拟多点触摸（注意，如果模拟器在工具窗口中运行，模拟多点触摸可能无效）：\n\
  \n![](img/as_4_1_motion_event_running.jpg)\n图 27-3\n\n### 2.9 总结\n\nActivity 通过注册\
  \ `onTouchListener` 并实现 `onTouch()` 回调方法来接收触摸事件通知，当该方法被 Android 运行时调用时，它会被传递一个 `MotionEvent`\
  \ 对象。该对象包含了有关触摸的信息，例如触摸事件的类型、触摸坐标以及当前与视图接触的触摸计数。\n\n当涉及多点触摸时，每个接触点被称为一个指针（pointer），每个指针被分配了一个\
  \ `index` 和一个 `ID`。虽然触摸的 `index` 可能会在事件之间发生变化，但 `ID` 在触摸结束之前将保持不变。\n\n本章完成了一个 Android\
  \ 应用程序示例的创建，旨在显示设备屏幕上多达两个同时触摸的坐标和动作类型。\n\n### # 使用 Android Detector 类检测常见手势\n\n\
  “手势”（gesture）一词用于定义触摸屏与用户之间连续的交互序列。一个典型的手势开始于屏幕首次触摸的点，结束于最后一个手指或指针设备离开显示表面。当被正确利用时，手势可以实现用户与应用程序之间的一种通信形式。用于翻电子书页码的滑动动作，或涉及两次触摸以放大或缩小图像的捏合动作，都是使用手势与应用程序交互的典型示例。\n\
  \nAndroid SDK 提供了在应用程序内检测常见和自定义手势的机制。常见手势涉及点击（tap）、双击、长按或水平/垂直方向的滑动（在 Android 术语中称为\
  \ `fling`）。\n\n本章的目标是探索使用 `GestureDetector` 类检测 Android 设备上的常见手势。\n\n### 28.1 实现常见手势检测\n\
  \n当用户与 Android 设备的屏幕交互时，系统会调用当前活动应用程序的 `onTouchEvent()` 方法，并传递包含用户接触屏幕数据的 `MotionEvent`\
  \ 对象。这些数据可以被解释以识别屏幕上的动作是否匹配点击或滑动等常见手势。通过使用 `GestureDetectorCompat` 类，只需少量编程工作即可实现。该类专门设计用于接收应用程序的运动信息，并根据检测到的任何常见手势触发方法调用。\n\
  \n检测常见手势的基本步骤如下：\n\n1. 声明一个实现 `GestureDetector.OnGestureListener` 接口的类，包括 `onFling()`、`onDown()`、`onScroll()`、`onShowPress()`、`onSingleTapUp()`\
  \ 和 `onLongPress()` 回调方法。注意，这可以是全新的类，也可以是封装 Activity 类。如果需要检测双击手势，该类还必须实现 `OnDoubleTapListener`\
  \ 接口并包含相应的 `onDoubleTap()` 方法。\n\n2. 创建 `GestureDetectorCompat` 实例，并将创建的实例作为参数传递。\n\
  \n3. 可选调用 `GestureDetectorCompat` 实例的 `setOnDoubleTapListener()` 方法启用双击检测（如果需要）。\n\
  \n4. 在封装 Activity 中实现 `onTouchEvent()` 回调方法，该方法反过来调用 `GestureDetectorCompat` 实例的\
  \ `onTouchEvent()` 方法，并将当前的运动事件对象作为参数传递给该方法。\n\n\n\n\n\n一旦实现，结果就是应用程序代码中的一组方法，这些方法会在检测到特定类型的手势时被调用。随后，可以实现这些方法内部的逻辑，以执行任何响应相应手势时需要执行的任务。\n\
  \n在本章的剩余部分中，我们将通过创建一个示例项目来将上述步骤付诸实践。\n\n## 28.2 创建示例手势检测项目\n\n该项目的目标是检测 `GestureDetectorCompat`\
  \ 类当前支持的全范围内常用手势，并向用户显示状态信息，以指示检测到的手势类型。\n\n从欢迎界面选择`New Project`（新建项目）选项，在弹出的新项目对话框中，点击`Next`按钮之前选择`Empty\
  \ Activity`（空活动）模板。\n\n在`Name`字段中输入`CommonGestures`并指定`com.ebookfrenzy.commongestures`为包名。在点击`Finish`按钮之前，将`Minimum\
  \ API level`（最低 API 级别）设置为`API 26: Android 8.0 (Oreo)`，并将`Language`（语言）菜单设置为`Java`。\n\
  \n按照第 11.8 迁移项目到 View Binding 节中的概述，调整项目以使用 view binding。\n\n创建新项目后，在`Project`工具窗口中导航到`app`\
  \ -> `res` -> `layout` -> `activity_main.xml`文件，并双击它将其加载到`Layout Editor`工具中。\n\n\
  在`Layout Editor`工具中，选择“Hello, World!”`TextView`组件，并在`Attributes`（属性）工具窗口中输入`gestureStatusText`作为\
  \ ID。\n\n## 28.3 实现监听器类\n\n如前所述，有必要创建一个实现`GestureDetector.OnGestureListener`接口的类，如果需要检测双击，则还需要实现`GestureDetector.OnDoubleTapListener`接口。虽然这可以是一个全新的类，但在当前活动类中实现它也是完全有效的。因此，为了本示例的目的，我们将修改`MainActivity`类来实现这些监听器接口。编辑`MainActivity.java`文件，使其内容如下：\n\
  \n```java\npackage com.ebookfrenzy.commongestures;\n\nimport android.view.GestureDetector;\n\
  \n.\n\n.\n\npublic class MainActivity extends AppCompatActivity\n        implements\
  \ GestureDetector.OnGestureListener,\n        GestureDetector.OnDoubleTapListener\n\
  {\n\n.\n\n.\n\n}\n```\n\n声明该类实现了监听器接口要求在类中也实现对应的方法：\n\n```java\npackage com.ebookfrenzy.commongestures;\n\
  \n.\n\n.\n\nimport android.view.MotionEvent;\n\npublic class MainActivity extends\
  \ AppCompatActivity\n        implements GestureDetector.OnGestureListener,\n   \
  \     GestureDetector.OnDoubleTapListener {\n\n.\n\n.\n\n    @Override\n    public\
  \ boolean onDown(MotionEvent event) {\n        binding.gestureStatusText.setText\
  \ (\"onDown\");\n        return true;\n    }\n\n    @Override\n    public boolean\
  \ onFling(MotionEvent event1, MotionEvent event2,\n                            \
  \       float velocityX, float velocityY) {\n        binding.gestureStatusText.setText(\"\
  onFling\");\n        return true;\n    }\n\n    @Override\n    public void onLongPress(MotionEvent\
  \ event) {\n        binding.gestureStatusText.setText(\"onLongPress\");\n    }\n\
  \n    @Override\n    public boolean onScroll(MotionEvent e1, MotionEvent e2,\n \
  \                                  float distanceX, float distanceY) {\n       \
  \ binding.gestureStatusText.setText(\"onScroll\");\n        return true;\n    }\n\
  \n    @Override\n    public void onShowPress(MotionEvent event) {\n        binding.gestureStatusText.setText(\"\
  onShowPress\");\n    }\n\n    @Override\n    public boolean onSingleTapUp(MotionEvent\
  \ event) {\n        binding.gestureStatusText.setText(\"onSingleTapUp\");\n    \
  \    return true;\n    }\n\n    @Override\n    public boolean onDoubleTap(MotionEvent\
  \ event) {\n        binding.gestureStatusText.setText(\"onDoubleTap\");\n      \
  \  return true;\n    }\n\n    @Override\n    public boolean onEvent(MotionEvent\
  \ event) {\n        binding.gestureStatusText.setText(\"onEvent\");\n        return\
  \ true;\n    }\n\n    @Override\n    public boolean onSingleConfirmed(MotionEvent\
  \ event) {\n        binding.gestureStatusText.setText(\"onSingleConfirmed\");\n\
  \        return true;\n    }\n}\n```\n\n## 28.4 创建 GestureDetector 实例\n\n现在活动已更新以实现监听器接口，下一步是创建一个`GestureDetectorCompat`的实例。由于这只需要在活动创建时执行一次，因此此代码的最佳位置是`onCreate()`方法中：\n\
  \n```java\npackage com.ebookfrenzy.commongestures;\n\n.\n\n.\n\nimport android.view.GestureDetector;\n\
  \npublic class MainActivity extends AppCompatActivity\n        implements GestureDetector.OnGestureListener,\n\
  \        GestureDetector.OnDoubleTapListener {\n\n    private ActivityMainBinding\
  \ binding;\n    private GestureDetectorCompat gDetector;\n\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        binding = ActivityMainBinding.inflate(getLayoutInflater());\n        View\
  \ view = binding.getRoot();\n        setContentView(view);\n        this.gDetector\
  \ = new GestureDetectorCompat(this,this);\n        gDetector.setOnDoubleTapListener(this);\n\
  \    }\n}\n```\n\n## 28.5 实现 onTouchEvent 方法\n\n如果此时编译并运行应用程序，在设备上执行手势将什么都不会发生。这是因为还没有添加代码来拦截触摸事件并传递给`GestureDetectorCompat`实例。为了实现这一点，有必要重写活动类中的`onTouchEvent()`方法并实现它以调用`GestureDetectorCompat`实例的`onTouchEvent()`方法。仍在`MainActivity.java`文件中，因此实现此方法使其内容如下：\n\
  \n```java\n@Override\npublic boolean onTouchEvent(MotionEvent event) {\n    this.gDetector.onTouchEvent(event);\n\
  \    // 确保调用父类的实现\n    return super.onTouchEvent(event);\n}\n```\n\n### 28.6 测试应用程序\n\
  \n在物理 Android 设备或 AVD 模拟器上编译并运行应用程序。启动后，尝试尝试滑动、按下、滚动动作以及双击和单击。注意文本视图将更新以反映事件，如图\
  \ 28-1 所示](#Common_Gestures.xhtml__idTextAnchor660):\n\n![](img/Image2425.jpg)\n\
  \n图 28-1\n\n### 28.7 总结\n\n用户与设备触摸屏之间的任何物理接触被称为“手势”。由于缺乏传统系统的物理键盘和鼠标指针，手势被广泛用于用户与应用程序之间的交互方法。虽然手势可以由几乎任何动作序列组成，但有一套触摸屏用户已经熟悉的常用手势。通过使用\
  \ Android 的 GestureDetector 类，可以在应用程序中轻松检测到许多所谓的“常用手势”。在本章中，我们已经从理论和通过示例项目的实现概述了该技术的使用。在本章涵盖了常用手势之后，下一章将查看更广泛的手势类型检测，包括设计和检测自定义手势的能力。\n\
  \n\n\n\n\n上一章涵盖了如何从 Android 应用程序检测所谓的“常用手势”。然而，在实践中，一个手势理论上可能涉及 Android 设备屏幕上几乎任何触摸动作的序列。为了承认这一事实，Android\
  \ SDK 允许应用程序开发者定义几乎任何性质的自定义手势，并在用户执行这些手势时触发事件。这是一个多阶段的过程，其细节正是本章的主题。\n\n## 29.1\
  \ Android 手势生成器应用程序\n\nAndroid SDK 允许开发者设计自定义手势，然后这些手势会被存储在与 Android 包（APK）捆绑的手势文件中。这些自定义手势文件最简单的创建方法是使用作为\
  \ Android SDK 示例包提供的 Gesture Builder 应用程序。创建手势文件涉及在物理设备或模拟器上启动 Gesture Builder 应用程序，并在上面“画出”应用程序需要检测的手势。一旦设计好手势，就可以将包含手势数据的文件从设备或模拟器的\
  \ SD 卡中提取出来，并添加到应用程序项目中。在应用程序代码中，该文件会被加载到 `GestureLibrary` 类的实例中，在该实例可以使用它来搜索用户在设备屏幕上执行的任何手势的匹配项。\n\
  \n### 29.2 GestureOverlayView 类\n\n为了方便在应用程序内检测手势，Android SDK 提供了 `GestureOverlayView`\
  \ 类。这是一个透明视图，可以放置在用户界面其他视图之上，唯一目的是检测手势。\n\n### 29.3 检测手势\n\n手势的检测是通过加载使用 Gesture\
  \ Builder 应用创建的手势文件，然后在 `GestureOverlayView` 类的实例上注册 `GesturePerformedListener`\
  \ 事件监听器来实现的。然后声明外层类同时实现 `OnGesturePerformedListener` 接口以及该接口所需的 `onGesturePerformed`\
  \ 回调方法。如果监听器检测到手势，Android 运行时系统将触发对 `onGesturePerformed` 回调方法的调用。\n\n## 29.4 识别特定手势\n\
  \n当检测到手势时，会调用 `onGesturePerformed` 回调方法，并作为参数传递检测到手势的 `GestureOverlayView` 对象的引用，以及一个包含手势信息的\
  \ `Gesture` 对象。\n\n通过访问 `Gesture` 对象，随后可以使用 `GestureLibrary` 将检测到的手势与之前加载到应用程序的手势文件所包含的手势进行比较。`GestureLibrary`\
  \ 通过为每个手势计算预测分，报告用户执行的手势与手势文件中的条目匹配的概率。通常认为预测分 1.0 或更高即为文件中存储的手势与用户在设备屏幕上执行的手势之间的良好匹配。\n\
  \n## 29.5 安装和运行手势生成器应用程序\n\n创建手势文件最简单的方法是使用允许捕捉和保存手势动作的应用程序。虽然 Google 最初提供过用于此用途的应用程序，但它在较新版本的\
  \ Android 上已没有得到充分维护。幸运的是，可以通过 Gesture Builder Tool App 提供替代方案，它可以通过以下 URL 从 Google\
  \ Play Store 获取：\n\nhttps://play.google.com/store/apps/details?id=migueldp.runeforge\n\
  \n### 29.6 创建手势文件\n\n一旦 Gesture Builder Tool 加载，点击设备屏幕底部的 Create New Gesture（创建新手势）按钮，并在如图\
  \ 29-1 所示的灰色画布上使用圆形轨迹“画出”手势。假设手势显示如预期（由设备屏幕上的黄色线条表示），点击保存按钮将手势添加到手势文件中，在提示输入名称时输入“Circle\
  \ Gesture”：\n\n```\nimage/as_gesture_builder_app.jpg\n```\n图 29-1\n\n手势保存后，Gesture\
  \ Builder Tool 将显示当前定义的手势列表，此时该列表将仅包含新建的 Circle Gesture。\n\n### 29.7 创建示例项目\n\n\
  从欢迎界面选择 New Project（新建项目）选项，在出现的新项目对话框中，点击 Next（下一步）按钮之前选择 Empty Activity 模板。\n\n\
  在 Name（名称）字段中输入 `CustomGestures` 并指定 `com.ebookfrenzy.customgestures` 为包名。在点击 Finish（完成）按钮之前，将\
  \ Minimum API level（最低 API 级别）设置为 API 26: Android 8.0 (Oreo)，并将 Language（语言）菜单设置为\
  \ Java。按照节 11.8 将项目迁移到 View Binding 的所述调整项目以使用 view binding。\n\n### 29.8 从 SD 卡提取手势文件\n\
  \n由于每个手势都是在 Gesture Builder 应用程序中创建的，它们会被添加到位于运行应用程序的模拟器或设备存储中的名为 `gesture.txt`\
  \ 的文件中。然而，在将此文件添加到 Android Studio 项目之前，必须先从设备存储中复制并保存到本地文件系统。这最简单的方法是使用 Android\
  \ Studio 的 Device File Explorer 工具窗口。通过 View -> Tool Windows -> Device File Explorer\
  \ 菜单项显示此工具。显示后，从下拉菜单中选择创建手势文件的设备或模拟器，然后通过文件系统导航到文件夹：\n\n`/storage/emulated/0/Android/data/migueldp.runeforge/files/gestures.txt`\n\
  \n在该文件夹找到 `gesture.txt` 文件，右键点击它，选择 Save As…（另存为……菜单选项并将文件保存到临时位置，命名为 gestures。\n\
  \n```\nimage/as_gesture_file_explorer.jpg\n```\n图 29-2\n一旦手势文件创建并从设备存储中提取，即可作为资源文件添加到\
  \ Android Studio 项目。\n\n## 29.9 将手势文件添加到项目\n\n在 Android Studio 项目窗口中，找到并右键点击 `res`\
  \ 文件夹（位于 `app` 下），选择 New -> Directory（新建目录）。在 New Directory 对话框中输入 `raw` 作为文件夹名称并按回车。使用适用于您操作系统的文件管理器，找到之前从设备存储提取的手势文件，并将其复制粘贴到项目中的新\
  \ `raw` 文件夹。\n\n### 29.10 设计用户界面\n\n此示例应用程序需要一个 `ConstraintLayout` 视图以及叠加在其上的 `GestureOverlayView`，用以拦截用户执行的操作。找到\
  \ `app` -> `res` -> `layout` -> `activity_main.xml` 文件，双击将其加载到布局编辑器并选择删除默认的 `TextView`\
  \ 组件。\n\n切换到布局编辑器的 Code 模式并修改 XML，使其内容如下：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n    xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    android:layout_width=\"\
  match_parent\"\n    android:layout_height=\"match_parent\"\n    tools:context=\"\
  .MainActivity\" >\n\n    <android.gesture.GestureOverlayView\n        android:id=\"\
  @+id/gOverlay\"\n        android:layout_width=\"0dp\"\n        android:layout_height=\"\
  0dp\"\n        app:layout_constraintBottom_toBottomOf=\"parent\"\n        app:layout_constraintEnd_toEndOf=\"\
  parent\"\n        app:layout_constraintStart_toStartOf=\"parent\"\n        app:layout_constraintTop_toTopOf=\"\
  parent\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n```\n\n\n\n\n\
  \n`</androidx.constraintlayout.widget.ConstraintLayout>`\n\n### 29.11 加载手势文件\n\n\
  现在手势文件已经添加到项目中，下一步是编写一些代码，以便在活动启动时加载该文件。为了本项目的目的，实现此目的的代码将添加到位于 `MainActivity.java`\
  \ 源文件中的 `MainActivity` 类中，所示：\n\n```java\npackage com.ebookfrenzy.customgestures;\n\
  \n.\n\n.\n\nimport android.gesture.GestureLibraries;\n\nimport android.gesture.GestureLibrary;\n\
  \nimport android.gesture.GestureOverlayView;\n\nimport android.gesture.GestureOverlayView.OnGesturePerformedListener;\n\
  \npublic class MainActivity extends AppCompatActivity\n    implements OnGesturePerformedListener\
  \ {\n\n    private ActivityMainBinding binding;\n\n    private GestureLibrary gLibrary;\n\
  \n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n    \
  \    super.onCreate(savedInstanceState);\n        binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \        View view = binding.getRoot();\n        setContentView(view);\n       \
  \ gestureSetup();\n    }\n\n    private void gestureSetup() {\n        gLibrary\
  \ =\n            GestureLibraries.fromRawResource(this,\n                R.raw.gestures);\n\
  \        if (!gLibrary.load()) {\n            finish();\n        }\n    }\n.\n.\n\
  \n}\n```\n\n除了一些必要的导入指令外，上述代码还创建了一个名为 `gLibrary` 的 `GestureLibrary` 实例，并将位于原始资源文件夹中的手势文件内容加载到其中。活动类也被修改为实现\
  \ `OnGesturePerformedListener` 接口，这需要实现 `onGesturePerformed` 回调方法（该方法将在章的后续部分中创建）。\n\
  \n# 29.12 注册事件监听器\n\n为了让活动接收到用户在屏幕上执行手势的通知，需要在 `gLayout` 视图上注册 `OnGesturePerformedListener`\
  \ 事件监听器，可以使用下面的代码片段所示的 `findViewById` 方法获取其引用：\n\n```java\nprivate void gestureSetup()\
  \ {\n    gLibrary =\n        GestureLibraries.fromRawResource(this,\n          \
  \  R.raw.gestures);\n    if (!gLibrary.load()) {\n        finish();\n    }\n   \
  \ GestureOverlayView gOverlay = findViewById(R.id.gOverlay);\n    gOverlay.addOnGesturePerformedListener(this);\n\
  }\n```\n\n### 29.13 实现 onGesturePerformed 方法\n\n在对应用程序进行首次测试运行之前剩下的唯一工作就是实现 `OnGesturePerformed`\
  \ 回调方法。该方法会在 `GestureOverlayView` 实例上执行手势时被调用：\n\n```java\npackage com.ebookfrenzy.customgestures;\n\
  \n.\n\n.\n\nimport android.gesture.Prediction;\n\nimport android.widget.Toast;\n\
  \nimport android.gesture.Gesture;\nimport java.util.ArrayList;\n\npublic class MainActivity\
  \ extends AppCompatActivity implements OnGesturePerformedListener {\n\n    private\
  \ GestureLibrary gLibrary;\n.\n.\n\n    public void onGesturePerformed(GestureOverlayView\
  \ overlay, Gesture gesture) {\n        ArrayList<Prediction> predictions =\n   \
  \         gLibrary.recognize(gesture);\n        if (predictions.size() > 0 && predictions.get(0).score\
  \ > 1.0)\n        {\n            String action = predictions.get(0).name;\n    \
  \        Toast.makeText(this, action, Toast.LENGTH_SHORT).show();\n        }\n \
  \   }\n.\n}\n```\n\n### 29.14 测试应用程序\n\n在模拟器或物理设备上构建并运行应用程序，执行手势。注意，当执行时，如果识别出手势，应该会出现\
  \ toast 通知，它在显示器上用亮黄色线条轮勒，而覆盖层不确定的手势将显示为淡黄色线条。\n\n# 29.15 配置 GestureOverlayView\n\
  \n默认情况下，GestureOverlayView 配置为显示黄色线条。用于绘制已识别和未识别手势的颜可以通过可以通过 `gestureColor` 和 `uncertainColor`\
  \ 属性进行定义。例如，要隐藏手势线条，请如下所示修改 `activity_main.xml` 文件：\n\n```xml\n<android.gesture.GestureOverlayView\n\
  \    android:id=\"@+id/gOverlay\"\n    android:layout_width=\"0dp\"\n    android:layout_height=\"\
  0dp\"\n    app:layout_constraintBottom_toBottomOf=\"parent\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\"\n    android:gestureColor=\"#000000\"\n    android:uncertainGestureColor=\"\
  #000000\" />\n```\n\n重新运行应用程序后，手势现在应该是不可见的（因为它们在 `ConstraintLayout` 视图的白色背景上用白色绘制）。\n\
  \n### 29.16 拦截手势\n\n如前所述，`GestureOverlayView` 是一个透明的覆盖层，可以放置在其他视图之上。这引出了问题：当识别出手势后，被手势拦截的事件是否应该传递给底层的视图？这通过\
  \ `GestureOverlayView` 的 `eventsInterceptionEnabled` 属性控制。当设置为 true 时，当识别出手势时，手势事件不会传递给底层视图。当在可能配置为滚动的视图上执行手势时，此设置特别有用。\n\
  \n# 29.17 检测双缩手势\n\n在离开通用的触摸处理特别是手势识别之前，本章的最后一个主题是处理双缩手势（pinch Gestures）。检测双缩手势最简单的方法是使用\
  \ Android 的 `ScaleGestureDetector` 类。\n\n\n\n\n\n# 缩放手势实现\n\n1. 声明一个实现 `SimpleOnScaleGestureListener`\
  \ 接口的新类，包括所需的 `onScale()`、`onScaleBegin()` 和 `onScaleEnd()` 回调方法。\n2. 创建 `ScaleGestureDetector`\
  \ 类的实例，并将步骤 1 中创建的类实例作为参数传递。\n3. 在封装的 activity 中实现 `onTouchEvent()` 回调方法，该方法反过来调用\
  \ `ScaleGestureDetector` 类的 `onTouchEvent()` 方法。\n\n在本章的剩余部分中，我们将创建一个用于演示缩放手势识别实现的示例。\n\
  \n## 29.18 缩放手势示例项目\n\n从欢迎界面选择 `New Project` ，在弹出的新项目对话框中，点击 `Next` 按钮之前选择 `Empty\
  \ Activity` 模板。\n\n在 `Name` 字段输入 `PinchExample` 并指定 `com.ebookfrenzy.pinchexample`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API` 级别设置设置为 `API 26: Android 8.0 (Oreo)`，并将\
  \ `Language` 菜单设置为 `Java`。按照 11.8 Migrating a Project to View Binding 中的步骤将项目转换为使用\
  \ view binding。\n\n在 `activity_main.xml` 文件中，选择默认的 `TextView` 对象并使用 `Attributes`\
  \ 工具窗口将 `ID` 设置为 `myTextView`。\n\n找到并加载 `MainActivity.java` 文件到 Android Studio 编辑器并按如下方式修改文件：\n\
  \n```java\npackage com.ebookfrenzy.pinchexample;\n\nimport android.view.MotionEvent;\n\
  import android.view.ScaleGestureDetector;\nimport android.view.ScaleGestureDetector.SimpleOnScaleGestureListener;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private ActivityMainBinding\
  \ binding;\n    ScaleGestureDetector scaleGestureDetector;\n\n    @Override\n  \
  \  protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        binding = ActivityMainBinding.inflate(getLayoutInflater());\n        View\
  \ view = binding.getRoot();\n        setContentView(view);\n        scaleGestureDetector\
  \ = new ScaleGestureDetector(this,\n                    new MyOnScaleGestureListener());\n\
  \    }\n\n    @Override\n    public boolean onTouchEvent(MotionEvent event) {\n\
  \        scaleGestureDetector.onTouchEvent(event);\n        return true;\n    }\n\
  \n    public class MyOnScaleGestureListener extends SimpleOnScaleGestureListener\
  \ {\n        @Override\n        public boolean onScale(ScaleGestureDetector detector)\
  \ {\n            float scaleFactor = detector.getScaleFactor();\n            if\
  \ (scaleFactor > 1) {\n                binding.myTextView.setText(\"Zooming Out\"\
  );\n            } else {\n                binding.myTextView.setText(\"Zooming In\"\
  );\n            }\n            return true;\n        }\n\n        @Override\n  \
  \      public boolean onScaleBegin(ScaleGestureDetector detector) {\n          \
  \  return true;\n        }\n\n        @Override\n        public void onScaleEnd(ScaleGestureDetector\
  \ detector) {\n        }\n    }\n}\n```\n\n## 30. Fragments 简介\n\n随着章节的深入，你会越来越发现，Android\
  \ 后面的许多设计概念的设计初衷是为了实现不同元素之间的复用和交互。本章将探讨的一个领域就涉及 `Fragments`。本章将从 fragment 是什么以及它们如何运作方面提供基础知识的概述。\n\
  \n### 30.1 什么是 Fragment？\n\nFragment 是应用程序用户界面中一个自包含的模块化部分以及相应的行为，可以嵌入到 activity\
  \ 中。Fragments 可以在设计阶段组合以创建一个 activity，并在运行时添加到或从 activity 中移除，以创建动态变化的用户界面。\n\n\
  Fragments 只能作为 activity 的一部分使用，不能作为独立的应用程序元素进行实例化。尽管如此，一个 fragment 可以被认为是一个“子活动”，它具有与完整\
  \ activity 类似的生命周期。\n\nFragments 以 XML 布局文件的形式存储，可以通过在 activity 的布局文件中放置适当的 `<fragment>`\
  \ 元素，或者直接通过 activity 类中的代码将其添加到 activity 中。\n\n### 30.2 创建 Fragment\n\n构成 fragment\
  \ 的两个组件是 XML 布局文件和对应的 Java 类。fragment 的 XML 布局文件格式与任何其他 activity 的布局格式相同，并且可以包含布局管理器和视图的任何组合和复杂度。例如，下面的\
  \ XML 布局用于一个由具有红色背景且包含单个 `TextView` 的 `ConstraintLayout` 组成的 fragment：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:id=\"@+id/constraintLayout\"\n    android:layout_width=\"match_parent\"\
  \n    android:layout_height=\"match_parent\"\n    android:background=\"@android:color/holo_red_dark\"\
  \n    tools:context=\".FragmentOne\">\n\n    <TextView\n        android:id=\"@+id/textView1\"\
  \n        android:layout_width=\"wrap_content\"\n        android:layout_height=\"\
  wrap_content\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n```\n\n\
  ## 29.1 总结\n\n手势本质上是用户的触摸，可以在屏幕上检测到手势。一旦创建，手势就可以文件的形式保存。缩放手势可以通过 `ScaleGestureDetector`\
  \ 类的实现来检测，该类在本章中也提供了。\n\n\n\n\n\n```xml\n          android:layout_width=\"wrap_content\"\
  \n          android:layout_height=\"wrap_content\"\n          android:text=\"My\
  \ First Fragment\"\n          android:textAppearance=\"@style/TextAppearance.AppCompat.Large\"\
  \n          android:textColor=\"@color/white\"\n          app:layout_constraintBottom_toBottomOf=\"\
  parent\"\n          app:layout_constraintEnd_toEndOf=\"parent\"\n          app:layout_constraintStart_toStartOf=\"\
  parent\"\n          app:layout_constraintTop_toTopOf=\"parent\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n与布局对应的类必须是 `Fragment` 类的子类。该类至少应该重写 `onCreateView()` 方法，该方法负责加载 fragment\
  \ 布局。例如：\n\n```java\npackage com.example.myfragmentdemo;\n\nimport android.os.Bundle;\n\
  import android.view.LayoutInflater;\nimport android.view.View;\nimport android.view.ViewGroup;\n\
  import androidx.fragment.app.Fragment;\n\npublic class FragmentOne extends Fragment\
  \ {\n\n    @Override\n    public View onCreateView(LayoutInflater inflater,\n  \
  \              ViewGroup container,\n                Bundle savedInstanceState)\
  \ {\n        // Inflate the layout for this fragment\n        binding = FragmentTextBinding.inflate(inflater,\
  \ container, false);\n        return binding.getRoot();\n    }\n}\n```\n\n除了 `onCreateView()`\
  \ 方法外，该类还可以重写标准的生命周期方法。一旦 fragment 布局和类创建完成，fragment 就可以在应用程序的活动（activity）中使用。\n\
  \n### 30.3 使用布局 XML 文件向 Activity 添加 Fragment\n\n可以通过编写 Java 代码或将 fragment 嵌入到 activity\
  \ 的 XML 布局文件中将其纳入活动 中。无论使用哪种方法，需要注意的关键点是：当使用支持库来兼容旧版本的 Android 发布时，任何使用 fragment\
  \ 的 activity 必须实现为 `FragmentActivity` 的子类，而不是 `AppCompatActivity` 类：\n\n```java\n\
  package com.example.myfragmentdemo;\n\nimport android.os.Bundle;\nimport androidx.fragment.app.FragmentActivity;\n\
  import android.view.Menu;\n\npublic class MainActivity extends FragmentActivity\
  \ {\n.\n.\n```\n\nfragment 使用 `FragmentContainerView` 类嵌入到 activity 布局文件中。接下来的示例布局将本章上一节创建的\
  \ fragment 嵌入到 activity 布局中：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<androidx.constraintlayout.widget.ConstraintLayout xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\"\n    android:layout_width=\"match_parent\"\n\
  \    android:layout_height=\"match_parent\"\n    tools:context=\".MainActivity\"\
  >\n    <androidx.fragment.app.FragmentContainerView\n        android:id=\"@+id/fragment2\"\
  \n        android:name=\"com.ebookfrenzy.myfragmentdemo.FragmentOne\"\n        android:layout_width=\"\
  0dp\"\n        android:layout_height=\"wrap_content\"\n        android:layout_marginStart=\"\
  32dp\"\n        android:layout_marginEnd=\"32dp\"\n        app:layout_constraintBottom_toBottomOf=\"\
  parent\"\n        app:layout_constraintEnd_toEndOf=\"parent\"\n        app:layout_constraintStart_toStartOf=\"\
  parent\"\n        app:layout_constraintTop_toTopOf=\"parent\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n`androidx.constraintlayout.widget.ConstraintLayout` 中的关键属性是 `android:name`（它必须引用该类）和\
  \ `tools:context`（它必须引用布局）。一旦添加到布局中，就可以在 Android 编辑器中查看。\n\n### 30.4 在代码中添加和管理 Fragment\n\
  \n使用代码向 activity 添加 fragment 非常方便。为了实现对 fragment 的完全控制，可以在运行时对它们进行添加、删除甚至替换。使用代码时，有一套标准的步骤顺序要遵循：\n\
  \n1. 创建 fragment 实例。\n2. 传递任何额外的参数。\n3. 获取管理器的引用。\n4. 在执行器实例上调用 `beginTransaction()`。\n\
  5. 调用 fragment 实例的 `add()` 方法，并将视图 ID 和 fragment 实例作为参数传递。\n6. 调用 `commit()`。\n\n\
  例如，以下代码通过 `FragmentOne` 类添加了 fragment：\n\n```java\nFragmentOne firstFragment = new\
  \ FragmentOne();\nfirstFragment.setArguments(getIntent().getExtras());\nFragmentManager\
  \ fragManager = getSupportFragmentManager();\nFragmentTransaction transaction =\
  \ fragManager.beginTransaction();\ntransaction.add(R.id.LinearLayout1, firstFragment);\n\
  transaction.commit();\n```\n\n上述代码为了清晰起见将每一步拆分为单独的语句。然而，最后四行可以简化为一行代码如下：\n\n```java\n\
  getSupportFragmentManager().beginTransaction().add(R.id.LinearLayout1, firstFragment).commit();\n\
  ```\n\n一旦添加到容器中，随后可以通过调用 fragment 事务实例的 `remove()` 方法将其移除，传递要移除的 fragment 实例：\n\n\
  ```java\ntransaction.remove(firstFragment);\n```\n\n同样，可以通过调用 fragment 事务实例的 `replace()`\
  \ 方法用一个 fragment 替换另一个。它接收的参数是包含 fragment 的视图 ID 和新 fragment 的实例。被替换的 fragment 也可以放在所谓的回退栈（back\
  \ stack）中，以便当用户导航回它时可以快速恢复。这通过在调用 `commit()` 方法之前调用 fragment 事务的 `addToBackStack()`\
  \ 方法来实现：\n\n```java\nFragmentTwo secondFragment = new FragmentTwo();\ntransaction.replace(R.id.LinearLayout1,\
  \ secondFragment);\ntransaction.addToBackStack(null);\ntransaction.commit();\n```\n\
  \n### 30.5 处理 Fragment 事件\n\n如之前讨论过的，fragment 非常像一个子活动，它拥有自己的布局、类和生命周期。fragment\
  \ 内部的视图组件（如按钮和文本视图）能够像普通活动中的一样生成事件。这产生了一个问题：哪个类来接收来自 fragment 中视图的事件？是 fragment\
  \ 本身，还是嵌入 fragment 的活动？问题的答案取决于如何声明事件处理器。第一种方法是在 activity 代码中配置事件监听器和回调方法。例如：\n\n\
  ```java\nbinding.button.setOnClickListener(new Button.OnClickListener() {\n    public\
  \ void onClick(View v) {\n        // 点击时要执行的代码\n    }\n});\n```\n\n\n\n\n\n```java\n\
  // the button is clicked\n        }\n    }\n);\n```\n\n在拦截点击事件时，第二种方法是在 XML 布局文件中设置\
  \ `android:onClick` 属性：\n\n```xml\n<Button\n    android:id=\"@+id/button1\"\n  \
  \  android:layout_width=\"wrap_content\"\n    android:layout_height=\"wrap_content\"\
  \n    android:onClick=\"onClick\"\n    android:text=\"Click me\" />\n```\n\nFragment\
  \ 中 View 生成的事件的通用规则是：如果事件监听器是通过事件监听器和回调方法的方法在 Fragment 类中声明的，那么事件将首先由 Fragment 处理。然而，如果使用了\
  \ `android:onClick` 资源，事件将直接传递给包含该 Fragment 的 Activity。\n\n# 30.6 实现 Fragment 之间的通信\n\
  \n一旦一个或多个 Fragment 被嵌入 Activity 中，很可能需要在 Fragment 与 Activity 之间、以及 Fragment 与 Fragment\
  \ 之间进行某种形式的通信。事实上，良好的实践要求 Fragment 之间不进行直接通信。所有通信都应该通过封装它的 Activity 进行。\n\n为了让 Activity\
  \ 与 Fragment 通信，Activity 必须通过分配给 Fragment 的 ID 来识别 Fragment 对象。一旦获取了该引用，Activity\
  \ 就可以简单地调用 Fragment 对象的公共方法。\n\n反向通信（从 Fragment 到 Activity）稍微复杂一些。首先，Fragment 必须定义一个监听接口，然后在\
  \ Activity 类中实现该接口。例如，以下代码在名为 `ToolbarFragment` 的 Fragment 类上声明了一个名为 `ToolbarListener`\
  \ 的接口。代码还声明了一个变量，稍后将存储对 Activity 的引用：\n\n```java\npublic class ToolbarFragment extends\
  \ Fragment {\n    ToolbarListener activityCallback;\n    public interface ToolbarListener\
  \ {\n        public void onButtonClick(int position, String text);\n    }\n.\n.\n\
  }\n```\n\n上述代码规定，任何实现 `ToolbarListener` 接口的类都必须实现名为 `onButtonClick` 的回调方法，该方法接受一个整数和一个\
  \ `String` 作为参数。\n\n接下来，需要重写并实现 Fragment 类的 `onAttach()` 方法。当 Fragment 初始化并与 Activity\
  \ 关联时，Android 系统会自动调用此方法。该方法会接收一个包含该 Fragment 的 Activity 引用。该方法必须存储该 Activity 的本地引用，并验证它是否实现了\
  \ `ToolbarListener` 接口：\n\n```java\n@Override\npublic void onAttach(Context context)\
  \ {\n    super.onAttach(context);\n    try {\n        activityCallback = (ToolbarListener)\
  \ activity;\n    } catch (ClassCastException e) {\n        throw new ClassCastException(activity.toString()\n\
  \            + \" must implement ToolbarListener\");\n    }\n}\n```\n\n执行此示例后，Activity\
  \ 的引用将存储在本地变量 `activityCallback` 中，如果该 Activity 没有实现 `ToolbarListener` 接口，则会抛出异常。\n\
  \n下一步是从 Fragment 内部调用 Activity 的回调方法。何时以及如何发生这种情况完全取决于 Fragment 需要联系 Activity 的情况。例如，以下代码在点击按钮时调用\
  \ Activity 的回调方法：\n\n```java\npublic void buttonClicked (View view) {\n    activityCallback.onButtonClick(arg1,\
  \ arg2);\n}\n```\n\n剩下的工作是修改 Activity 类，使其实现 `ToolbarListener` 接口。例如：\n\n```java\n\
  public class MainActivity extends FragmentActivity\n    implements ToolbarFragment.ToolbarListener\
  \ {\n    public void onButtonClick(String arg1, int arg2) {\n        // 实现回调方法的代码\n\
  \    }\n.\n.\n}\n```\n\n从上述代码中可以看到，Activity 声明它实现了 `ToolbarFragment` 类的 `ToolbarListener`\
  \ 接口，然后按照接口的要求实现了 `onButtonClick()` 方法。\n\n### 30.7 总结\n\nFragment 提供了一种创建可重用用户界面布局模块和应用程序行为模块的强大机制，这些模块一旦创建，就可以嵌入到\
  \ Activity 中。\n\n# 31. 在 Android Studio 中使用 Fragments - 示例\n\n正如上一章所述，Fragment 提供了一种创建可重用用户界面布局模块和应用程序行为模块的强大机制，这些模块一旦创建，就可以嵌入到\
  \ Activity 中。\n\n在上一章探索了 Fragment 的整体理论后，本章的目标是使用 Android Studio 创建一个示例应用程序，旨在演示创建和使用\
  \ Fragment 的实际步骤，并实现一个 Fragment 与另一个 之间的通信。\n\n## 31.1 关于示例 Fragment 应用\n\n本章创建的应用程序将由一个\
  \ Activity 和两个 Fragment 组成。第一个 Fragment 的用户界面将包含某种类型的工具栏，由 `EditText` 视图、一个 `SeekBar`\
  \ 和一个 `Button` 组成，所有内容包含在 `ConstraintLayout` 中。第二个 Fragment 将仅包含一个 `TextView` 对象，同样包含在\
  \ `ConstraintLayout` 中。\n\n这两个 Fragment 将嵌入应用程序的主 Activity 中，并实现通信逻辑：使得当第一个 Fragment\
  \ 中的按钮被按下时，输入到 `EditText` 中的文本将显示在第二个 Fragment 的 `TextView` 上，字体大小由第一个 Fragment\
  \ 中 `SeekBar` 的位置决定。\n\n由于此应用程序旨在运行在旧版本的 Android 上，因此也有必要使用适当的支持库。\n\n### 31.2 创建示例项目\n\
  \n在欢迎屏幕上选择 New Project 选项，在出现的新项目对话框中选择 Empty Activity 模板，然后点击 Next 按钮。\n\n在 Name\
  \ 字段中输入 `FragmentExample` 并指定 `com.ebookfrenzy.fragmentexample` 为包名。在点击 Finish 按钮之前，将\
  \ Minimum API level 设置为 `API 26: Android 8.0 (Oreo)`并将 Language 设置为 Java。按照第 11.8\
  \ 节迁移项目到 View Binding 的步骤修改项目以使用 view binding。\n\n返回 Gradle Scripts -> `build.gradle\
  \ (Module :app)` 文件，并在 dependencies 部分添加以下指令（请注意现在可能会有更高版本的库）：\n\n```\nimplementation\
  \ 'androidx.navigation:navigation-fragment:2.5.2'\n```\n\n## 31.3 创建第一个 Fragment\
  \ 布局\n\n下一步是为将在我们的 Activity 中使用的第一个 Fragment 创建用户界面。\n\n\n\n\n\n此用户界面将由一个 XML 布局文件和一个\
  \ fragment 类组成。虽然可以手动添加它们，但让 Android Studio 为我们创建会更快。在项目工具窗口中，找到 `app -> java ->\
  \ com.ebookfrenzy.fragmentexample` 条目并右键点击它。在弹出的菜单中，选择 `New -> Fragment -> Gallery...`\
  \ 选项，显示下方图 31-1 所示的对话框：\n\n![](img/as_4.2_fragment_gallery.jpg)\n图 31-1\n\n在点击 `Next`\
  \ 按钮之前，选择 `Fragment (Blank)` 模板。在后续屏幕上，将 fragment 命名为 `ToolbarFragment`，布局文件命名为\
  \ `fragment_toolbar`：\n\n![](img/as_4.2_new_fragment_java.jpg)\n图 31-2\n\n使用 `Design`\
  \ 模式将 `fragment_toolbar.xml` 文件加载到布局编辑器中，并确保启用 `Autoconnect`（自动连接）模式。接下来，在 `Component\
  \ Tree`（组件树）面板中右键点击 `FrameLayout` 条目，选择 `Convert FrameLayout to ConstraintLayout`\
  \ 菜单选项，并在确认对话框中接受默认设置。将 `id` 从空改为 `constraintLayout`。选择并删除默认的 `TextView`，并向布局添加\
  \ `Plain Text`、`Seekbar` 和 `Button` 控件，使其位置与图 31-3 所示的。最后，将视图 id 分别更改为 `editText1`、`seekBar1`\
  \ 和 `button1`。\n\n将按钮上的文本更改为“Change Text”，将文本提取为名为 `change_text` 的字符串资源，并移除 `EditText`\
  \ 视图中的 `Name` 文本。最后，将 `Seekbar` 的 `layout_width` 属性设置为 `match_constraint`，并设置左右边缘边距为\
  \ `16dp`。\n\n使用 `Infer`（推断）约束工具栏按钮添加任何缺失的约束，此时布局应与下方的图 31-3 所示：\n\n![](img/as_4.1_toolbar_fragment_ui.jpg)\n\
  图 31-3\n\n### 31.4 将 Fragment 迁移到 View Binding\n\n与 `Empty Activity` 模板一样，当向项目中添加新\
  \ fragment 时，Android Studio 不启用 view binding 支持。因此，在继续本教程的下一步之前，我们需要执行此迁移。首先编辑 `ToolbarFragment.java`\
  \ 文件，并如下所示导入该 fragment 的绑定：\n\n```java\nimport com.ebookfrenzy.fragmentexample.databinding.FragmentToolbarBinding;\n\
  ```\n\n接下来，找到 `onCreateView()` 方法并进行以下声明和更改（这包括添加 `onDestroyView()` 方法以确保在 fragment\
  \ 销毁时移除绑定引用）：\n\n```java\nprivate FragmentToolbarBinding binding;\n\n@Override\n\
  public View onCreateView(LayoutInflater inflater, ViewGroup container,\n       \
  \                  Bundle savedInstanceState) {\n    // 加载此 fragment 的布局\n    return\
  \ inflater.inflate(R.layout.fragment_toolbar, container, false);\n    binding =\
  \ FragmentToolbarBinding.inflate(inflater, container, false);\n    return binding.getRoot();\n\
  }\n\n@Override\npublic void onDestroyView() {\n    super.onDestroyView();\n    binding\
  \ = null;\n}\n```\n\n完成这些更改后，该 fragment 已准备好使用 view binding。\n\n### 31.5 添加第二个 Fragment\n\
  \n重复创建工具栏 fragment 的步骤，添加另一个名为 `TextFragment` 的空 fragment，布局文件命名为 `fragment_text`。再次将\
  \ `FrameLayout` 容器转换为 `ConstraintLayout`（将 `id` 改为 `constraintLayout2`）并删除默认的 `TextView`。\n\
  \n从调色板中拖入 `TextView` 控件并将其放在布局中心，使用 `Infer` 约束按钮添加任何缺失的约束。将 `TextView` 的 `id` 更改为\
  \ `textView2`，文本更改为“Fragment Two”，并修改 `textAppearance` 属性为 `Large`。\n\n完成后，布局应与图\
  \ 31-4 所示：\n\n![](img/as_4.0_fragment_text_layout.jpg)\n图 31-4\n\n重复上一节中执行的步骤，将\
  \ `TextFragment` 类迁移到使用 view binding，如下：\n\n```java\nimport com.ebookfrenzy.fragmentexample.databinding.FragmentTextBinding;\n\
  \nprivate FragmentTextBinding binding;\n\n@Override\npublic View onCreateView(LayoutInflater\
  \ inflater, ViewGroup container,\n                         Bundle savedInstanceState)\
  \ {\n    // 加载此 fragment 的布局\n    return inflater.inflate(R.layout.fragment_text,\
  \ container, false);\n    binding = FragmentTextBinding.inflate(inflater, container,\
  \ false);\n    return binding.getRoot();\n}\n\n@Override\npublic void onDestroyView()\
  \ {\n    super.onDestroyView();\n    binding = null;\n}\n```\n\n### 31.6 将 Fragments\
  \ 添加到 Activity\n\n应用程序的主 activity 关联了一个名为 `activity_main.xml` 的 XML 布局文件。在本例中，将使用该文件内的\
  \ `<fragment>` 元素将 fragments 添加到 activity。使用 `Project` 工具窗口，导航到 FragmentExample\
  \ 项目的 `app -> res -> layout` 部分，双击 `activity_main.xml` 文件将其加载到 Android Studio 布局编辑器工具中。\n\
  \n使用 `Design` 模式下的 `Layout Editor` 工具，选择并删除布局中的默认 `TextView` 对象，并在调色板中选择 `Common`\
  \ 类别。从列表中拖出 `FragmentContainerView` 组件并将其拖到布局上，使其水平居中，并放置使得虚线指示顶部布局边距：\n\n![](img/as_3.5_fragment_example_add_fragment.jpg)\n\
  图 31-5\n\n将 fragment 拖到布局上时，会出现一个对话框，显示当前项目中可用的 Fragments 列表，如图 31-6 所示：\n\n![](img/as_4.1_fragment_list.jpg)\n\
  图 31-6\n\n从列表中选择 `ToolbarFragment` 条目并点击 `OK` 按钮关闭对话框。添加后，点击布局编辑器右上角的红色警告按钮显示 `Problems`\
  \ 工具窗口。一条未知 fragment 的消息表明 `Layout Editor` 需要在预览期间知道显示哪个 fragment。选择 `Unknown` 项，然后点击右侧面板中的\
  \ `Pick Layout...` 链接，如图 31-7 所示：\n\n![](img/as_pick_layout.jpg)\n图 31-7\n\n在结果对话框中（图\
  \ 31-8）选择 `fragment_toolbar` 条目，然后点击 `OK` 按钮：\n\n![](img/as_choose_fragment.jpg)\n\
  图 31-8\n\n选中 fragment 后，将 `layout_width` 属性设置为 `match_constraint`，使其占据全屏。从调色板中点击并拖入另一个\
  \ `FragmentContainerView` 条目，并将其放置，使其水平居中并位于第一个 fragment 边缘下方。在提示时，从 fragment 对话框中选择\
  \ `TextFragment` 条目，然后点击 `OK` 按钮。显示 `Problems` 工具窗口并重复之前的步骤，这次选择 `fragment_text`\
  \ 布局。使用 `Infer` 按钮建立任何的的约束。\n\n注意现在布局中可以看到这些 fragments，如图 31-9 所示：\n\n![](img/as_4.1_fragments_added.jpg)\n\
  图 31-9\n\n在继续下一步之前，选择布局中的 `TextFragment` 实例，并在 `Attributes` 工具窗口中将 fragment 的 `ID`\
  \ 更改为 `text_fragment`。\n\n### 31.7 让 Toolbar Fragment 与 Activity 通信\n\n\n\n\n\n\
  当用户点击工具栏片段（toolbar fragment）中的按钮时，该片段类需要从 `EditText` 视图获取文本以及 `SeekBar` 的当前值，并将它们发送给文本片段（text\
  \ fragment）。如 \"Android Fragments 简介\"所述，片段之间不应直接通信，而应该使用嵌入它们的片段的 activity 作为中介。\n\
  \n此过程的第一步是确保工具栏片段对按钮点击有响应。我们还需要实现一些代码来跟踪 `SeekBar` 视图的值。为了本示例的考虑，我们将在 `ToolbarFragment`\
  \ 类中实现这些监听器。选择 `ToolbarFragment.java` 文件并对其修改，使其读取内容如下列表所示：\n\n```java\npackage\
  \ com.ebookfrenzy.fragmentexample;\n\nimport androidx.annotation.NonNull;\nimport\
  \ androidx.annotation.Nullable;\nimport android.content.Context;\nimport android.widget.SeekBar;\n\
  \npublic class ToolbarFragment extends Fragment implements SeekBar.OnSeekBarChangeListener\
  \ {\n\n    private static int seekvalue = 10;\n\n    @Override\n    public void\
  \ onViewCreated(@NonNull View view,\n                             @Nullable Bundle\
  \ savedInstanceState) {\n        super.onViewCreated(view, savedInstanceState);\n\
  \        binding.seekBar1.setOnSeekBarChangeListener(this);\n        binding.button1.setOnClickListener(new\
  \ View.OnClickListener() {\n            public void onClick(View v) {\n        \
  \        buttonClicked(v);\n            }\n        });\n    }\n\n    public void\
  \ buttonClicked (View view) {\n    }\n\n    @Override\n    public void onProgressChanged(SeekBar\
  \ seekBar, int progress,\n                                   boolean fromUser) {\n\
  \        seekvalue = progress;\n    }\n\n    @Override\n    public void onStartTrackingTouch(SeekBar\
  \ arg0) {\n    }\n\n    @Override\n    public void onStopTrackingTouch(SeekBar arg0)\
  \ {\n    }\n}\n```\n\n在继续之前，我们需要花时间解释上述代码更改。首先，该类声明为实现了 `OnSeekBarChangeListener`\
  \ 接口。这是因为用户界面包含一个 `SeekBar` 实例，并且当用户滑动条以更改字体大同时，片段需要接收通知。实现 `OnSeekBarChangeListener`\
  \ 接口要求实现 `onProgressChanged()`、`onStartTrackingTouch()` 和 `onStopTrackingTouch()`\
  \ 方法。这些方法已经实现，但实际上只需要 `onProgressChanged()` 方法来执行任务，在此情况下是将新值存储在类开始处声明的名为 `seekvalue`\
  \ 的变量中。还声明了一个变量，用于存储对 `EditText` 对象的引用。\n\n添加了 `onViewCreated()` 方法以便在按钮上设置 `OnClickListener`，该监听器配置为在检测到点击事件时调用名为\
  \ `buttonClicked()` 的方法。该方法随后也被实现了，尽管在此时它什么都不做。\n\n此过程的下一阶段是设置监听器，允许片段在按钮被点击时调用\
  \ activity。这遵循了上一章中概述的机制：\n\n```java\npublic class ToolbarFragment extends Fragment\
  \ implements SeekBar.OnSeekBarChangeListener {\n\n    private static int seekvalue\
  \ = 10;\n    private FragmentToolbarBinding binding;\n    ToolbarListener activityCallback;\n\
  \n    public interface ToolbarListener {\n        public void onButtonClick(int\
  \ position, String text);\n    }\n\n    @Override\n    public void onAttach(Context\
  \ context) {\n        super.onAttach(context);\n        try {\n            activityCallback\
  \ = (ToolbarListener) context;\n        } catch (ClassCastException e) {\n     \
  \       throw new ClassCastException(context.toString() + \" must implement ToolbarListener\"\
  );\n        }\n    }\n\n    public void buttonClicked (View view) {\n        activityCallback.onButtonClick(seekvalue,\
  \ binding.editText1.getText().toString());\n    }\n}\n```\n\n上述实现将导致当用户点击按钮时，调用属于\
  \ activity 类的名为 `onButtonClick()` 的方法。因此，剩下的工作就是声明 activity 类实现了新创建的 `ToolbarListener`\
  \ 接口并实现 `onButtonClick()` 方法。\n\n由于在早期版本中使用 Android Support Library 来支持片段，因此 activity\
  \ 也需要更改为继承自 `FragmentActivity` 而不是 `AppCompatActivity`。将这些要求结合得到了修改后的 `MainActivity.java`\
  \ 文件：\n\n```java\npackage com.ebookfrenzy.fragmentexample;\nimport androidx.appcompat.app.AppCompatActivity;\n\
  import androidx.fragment.app.FragmentActivity;\nimport android.os.Bundle;\n\npublic\
  \ class MainActivity extends FragmentActivity implements ToolbarFragment.ToolbarListener\
  \ {\n\n    public void onButtonClick(int fontsize, String text) {\n    }\n}\n```\n\
  \n按照目前代码更改，工具栏片段将检测用户何时点击按钮，并调用 activity 上的方法，传递 `EditText` 字段的内容和 `SeekBar` 视图的当前设置。现在轮到\
  \ activity 的任务与文本片段通信并传递这些值，以便片段可以更新 `TextView` 对象。\n\n### 31.8 让 Activity 与文本片段通信\n\
  \n如 \"Android Fragments 简介\"所述，activity 可以通过获取片段类实例的引用然后调用该对象上的公共方法来与片段通信。因此，在 `TextFragment`\
  \ 类中，我们现在实现一个名为 `changeTextProperties()` 的公共方法，该方法接受一个字体大小整数和一个要显示的新文本字符串作为参数。该方法将使用这些值来修改\
  \ `TextView` 对象。在 Android 编辑面板中，找到并修改 `TextFragment.java` 文件以添加此新方法：\n\n```java\n\
  package ebookfrenzy.fragmentexample;\n\npublic class TextFragment extends Fragment\
  \ {\n\n    public void changeTextProperties(int fontsize, String text) {\n     \
  \   binding.textView2.setTextSize(fontsize);\n        binding.textView2.setText(text);\n\
  \    }\n}\n```\n\n当 `TextFragment` 片段放置在 activity 的布局中，它被赋予了 ID `text_fragment`。使用此\
  \ ID，activity 现在可以获取片段的引用并调用对象上的 `changeTextProperties()` 方法。编辑 `MainActivity.java`\
  \ 文件并如下所示修改 `onButtonClick()` 方法：\n\n```java\npublic void onButtonClick(int fontsize,\
  \ String text) {\n    TextFragment textFragment = (TextFragment) getSupportFragmentManager().findFragmentById(R.id.text_fragment);\n\
  \    textFragment.changeTextProperties(fontsize, text);\n}\n```\n\n### 31.9 测试应用程序\n\
  \n随着此项目的编码完成，最后的任务是运行应用程序。当应用程序启动时，主 activity 将启动并创建创建显示两个片段。当用户触摸工具栏片段中的按钮时，activity\
  \ 的 `onButtonClick()` 方法将被工具栏片段调用，并传递来自 `EditText` 视图的文本和 `SeekBar` 视图的当前值。随后 activity\
  \ 调用第二个片段的 `changeTextProperties()` 方法，该方法将修改 `TextView` 以反映新的文本和字体大小：\n\n![](img/as_fragment_example_running.jpg)\n\
  \n图 31-10\n\n### 31.10 总结\n\n\n\n\n本章的目标是完成一个示例项目的创建，专门用于演示在 Android 应用中使用片段（fragments）的步骤。涵盖的主题包括使用\
  \ Android Support Library 以兼容在片段引入之前的 Android 版本、在 Activity 布局中包含片段，以及实现片段间的通信。\n\
  \n# 32 使用 Jetpack 构建现代 Android 应用程序架构\n\n多年来，Google 并不推荐构建 Android 应用的特定方法，而是提供工具和开发工具包（SDKs），让开发者自行决定哪种方法对于特定项目或个人编程风格最有效。这种情况在\
  \ 2017 年随着 Android 架构组件（Android Architecture Components）的引入发生了改变，这些组件随后在 2018 年发布时成为了\
  \ Android Jetpack 的一部分。\n\n本章的目的是提供 Jetpack 概念、Android 应用架构建议以及一些关键架构组件的概述。在介绍基础知识后，将在后续章节中更详细地讨论这些主题并通过实际示例进行演示。\n\
  \n## 32.1 什么是 Android Jetpack？\n\nAndroid Jetpack 由 Android Studio、Android 架构组件和\
  \ Android Support Library，以及一套建议 Android 应用 应该如何构建的指南组成。Android 架构组件旨在让开发 Android\
  \ 应用时的常用任务执行变得更快、更简单，同时也符合架构指南的核心原则。\n\n虽然本书将涵盖所有的 Android 架构组件，但本章的目标是介绍关键的架构指南，以及\
  \ `ViewModel`、`LiveData`、`Lifecycle` 组件，同时介绍数据绑定（Data Binding）和仓库（Repositories）的使用。\n\
  \n在继续之前，理解 Jetpack 的应用开发方法并非强制性的至关重要。尽管它强调了一些多年来受欢迎的其他技术的缺点，但 Google 并没有完全谴责那些应用开发方法。Google\
  \ 似乎采取了这样的立场：虽然开发应用没有绝对的对错，但存在一种被推荐的方法。\n\n### 32.2 “旧”架构\n\n在标题为“在 Android Studio\
  \ 中创建 Android 示例应用”的章节中，创建了一个由单个 Activity 组成的 Android 项目，该 Activity 包含了显示和管理用户界面的所有代码，以及应用的后端逻辑。在\
  \ Jetpack 引入之前，最常见的架构遵循这种范式，应用由多个 Activity （应用内的每个屏幕对应一个）组成，每个 Activity 类在某种程度上都混合了用户界面和后端代码。\n\
  \n这种方法导致了一系列与应用生命周期相关的问题（例如，用户每次旋转设备时 Activity 都会销毁并重建，导致任何未保存到持久化存储形式的应用数据丢失），以及诸如导航效率低下的问题（为用户访问的每个应用屏幕启动一个新的\
  \ Activity）。\n\n### 32.3 现代 Android 架构\n\n在最基础的层，Google 现在提倡单 Activity 应用，其中不同的屏幕作为内容加载到同一个\
  \ Activity 中。\n\n现代架构指南还建议将应用内不同的责任区域划分到完全独立的模块中（Google 将此称为“关注点分离”）。这种方法的关键之一是\
  \ `ViewModel` 组件。\n\n### 32.4 ViewModel 组件\n\n`ViewModel` 的目的是将应用中用户界面相关的数据模型和逻辑与负责实际显示、管理用户界面以及与操作系统交互的代码分离。按照这种方式设计时，应用将由一个或多个\
  \ UI 控制器（如 Activity）以及负责处理这些控制器所需数据的 `ViewModel` 实例组成。\n\n实际上，`ViewModel` 只知道数据模型和相应的逻辑。它对用户界面一无所知，也不会尝试直接访问或响应与用户界面内视图相关的事件。当\
  \ UI 控制器需要数据进行显示时，它只需请求 `ViewModel` 提供。同样，当用户在用户界面内的视图中输入数据时，UI 控制器将其传递给 `ViewModel`\
  \ 处理。\n\n这种责任分离解决了与 UI 控制器生命周期相关的问题。无论 UI 控制器在应用生命周期内重建多少次，`ViewModel` 实例都会保留在内存中，从而保持数据的一性。例如，Activity\
  \ 使用的 `ViewModel` 将一直留在内存中，直到 Activity 完全结束（在单 Activity 应用中，这意味着直到应用退出）。\n\n![](img/jetpack_diagram_1.jpg)\n\
  \n图 32-1\n\n### 32.5 LiveData 组件\n\n考虑一个显示实时数据（如金融股票的当前价格）的应用。该应用可能会使用某种形式的股票价格网络服务，用最新信息持续更新\
  \ `ViewModel` 内部的数据模型。显然，如果这些实时数据不及时显示给用户，它们将几乎毫无用处。UI 控制器确保用户界面显示最新数据的方法只有两种。一种方案是控制器持续检查\
  \ `ViewModel`，以发现数据自上次显示以来是否发生了变化。然而，这种方法的问题是效率低下。为了维持数据馈送的实时性，UI 控制器必须在循环中运行，持续检查数据变化。\n\
  \n更好的解决方案是让 UI 控制器在 `ViewModel` 某个特定数据项发生变化时接收通知。这通过使用 `LiveData` 组件实现。`LiveData`\
  \ 是一个数据持有者，允许一个值变为可观察的。简单来说，可观察对象具有在数据发生变化时通知其他对象的能力，从而解决了确保用户界面始终与 `ViewModel`\
  \ 中的数据匹配的问题。\n\n这意味着，例如，对某个 `ViewModel` 值感兴趣的 UI 控制器可以设置一个观察者，该观察者反而在值变化时收到通知。例如，在我们假设的应用中，股票价格将封装在\
  \ `ViewModel` 内部的 `LiveData` 对象中，UI 控制器将为该值分配观察者，声明在值变化时要调用的方法。该方法在数据更改触发时将从 `ViewModel`\
  \ 读取更新后的值并用其更新用户界面。\n\n![](img/Jetpack_diagram_2.jpg)\n\n图 32-2\n\n`LiveData` 实例也可以被声明为可变的，允许观察实体更新\
  \ `LiveData` 对象中持有的底层值。例如，用户可能会在用户界面输入一个需要覆盖存储在 `ViewModel` 中的值。\n\n\n\n使用 `LiveData`\
  \ 的另一个关键优势是它能够感知观察者的生命周期状态。例如，如果一个 activity 包含一个 `LiveData` 观察者，那么对应的 `LiveData`\
  \ 对象将知道 activity 生命周期状态何时的变化，并做出相应的响应。如果 activity 被暂停（可能由于 app 被置于后台），`LiveData`\
  \ 对象将停止向观察者发送事件。如果 activity 刚刚启动或在暂停后恢复，`LiveData` 对象将向观察者发送一个 `LiveData` 事件，以确保\
  \ activity 拥有最新的值。同样地，`LiveData` 实例也会在 activity 被销毁时知道并移除观察者以释放资源。\n\n到目前为止，我们只讨论了\
  \ UI 控制器使用观察者的情况。在实践中，观察者可以用于任何符合 Jetpack 生命周期周期管理方法的对象中。\n\n## 32.6 ViewModel 状态保存\n\
  \nAndroid 允许用户将正在运行的 app 置于后台，并在在设备上执行其他任务（包括运行其他应用）后返回该应用。当设备资源不足时，操作系统将通过终止后台\
  \ app 进程来解决这个问题，从最近最未使用的 app 开始。然而，当用户返回被终止的后台 app 时，它应该以其进入后台时的相同状态出现，无论它是否被终止。在与\
  \ `ViewModel` 关联的数据方面，可以通过利用 `ViewModel Saved State` 模块来实现。该模块允许将值存储在 app 的保存状态中，并在系统发起的进程终止时恢复，该主题将在本章标题为\
  \ \"Android ViewModel 状态保存教程\" 的章节中介绍。\n\n### 32.7 LiveData 与数据绑定\n\nAndroid Jetpack\
  \ 包含了数据绑定库（Data Binding Library），它允许将 `ViewModel` 中的数据直接映射到 XML 用户界面布局文件中的特定视图。在之前创建的\
  \ `AndroidSample` 项目中，必须编写代码来获取 `EditText` 和 `TextView` 视图的引用，并设置和获取文本属性以反映数据变化。数据绑定允许在\
  \ `ViewModel` 中存储的 `LiveData` 值直接在 XML 布局文件中中被引用，从而避免了编写代码来更新布局视图的需求。\n\n![](img/Jetpack_diagram_3.jpg)\n\
  \n图 32-3\n\n数据绑定将从标题为 \"Android Jetpack 数据绑定概览\" 的章节开始进行详细介绍。\n\n## 32.8 Android\
  \ 生命周期\n\n从一个 Android 组件创建到其被销毁的时间被称为生命周期。在生命周期期间，组件将在不同的生命周期状态之间切换，通常在操作系统的控制下并响应用户操作。例如，一个\
  \ activity 将从初始化状态开始，然后过渡到创建状态。一旦 activity 开始运行，它将切换到启动状态，并从那里循环经过包括创建、启动、恢复和销毁在内的各种状态。\n\
  \n许多 Android Framework 类和组件允许其他对象访问它们的当前状态。也可以使用生命周期观察者（Lifecycle observers），使得对象在另一个对象的生命周期状态改变时接收通知。这是\
  \ `ViewModel` 组件在背后使用的技术，用于识别观察者何时重新启动或被销毁。此功能不仅限于 Android 框架和架构组件，也可以构建在任何使用架构组件包含的一组生命周期组件的类中。\n\
  \n能够检测并响应其他对象生命周期状态变化的对象被称为生命周期感知（lifecycle-aware），而提供其生命周期状态访问的对象则被称为生命周期所有者（lifecycle-owners）。生命周期将在标题为\
  \ \"使用 Android 生命周期感知组件\" 的章节中进行详细介绍。\n\n## 32.9 Repository 模块\n\n如果 `ViewModel`\
  \ 从一个或多个外部源（如数据库或网络服务）获取数据，那么将处理这些数据源的代码与 `ViewModel` 类分离是非常重要的。毕竟，不这样做将违反关注点分离的准则。为了避免将此功能与\
  \ `ViewModel` 混合，Google 的架构指南建议将此代码放在单独的 `Repository` 模块中。\n\nRepository 不是 Android\
  \ 架构组件，而是由应用开发者创建的 `Java` 类，负责与各种数据源建立接口。该类随后为 `ViewModel` 提供接口，允许将数据存储在模型中。\n\n\
  ![](img/Jetpack_diagram_4.jpg)\n\n图 32-4\n\n## 32.10 总结\n\n直到最近，Google 倾向于不推荐构建\
  \ Android app 的特定方法。随着 Android Jetpack 的引入，这种情况现在发生了变化，Jetpack 由一套工具、组件、库和架构指南组成。Google\
  \ 现在建议将一个应用项目分成不同的模块，每个模块负责特定的功能区域，即所谓的“关注点分离”。\n\n特别地，指南建议将应用的视图数据模型与负责处理用户界面的代码分离。此外，负责从网络服务或数据库等数据源收集代码应该被构建在单独的\
  \ repository 模块中，而不是与 view model 绑定。\n\nAndroid Jetpack 包含了 Android 架构组件，这些组件专门设计用于以便更容易开发符合推荐准则的应用程序。本章介绍了\
  \ `ViewModel`、`LiveData` 和 `Lifecycle` 组件。这些将从下一章开始进行更详细介绍。在本章中未提到的其他组件将在本书的后部分介绍。\n\
  \n# 33. 一个 Android Jetpack ViewModel 教程\n\n上一章介绍了 Android Jetpack 的核心概念，并概述了现代 Android\
  \ 应用架构的基础。Jetpack 本质上定义了一套建议，描述了 Android 应用项目应该如何构建结构，同时提供了一套库和组件，使其更容易符合这些准则，目标是用更少的代码和更少的错误开发可靠的应用。\n\
  \n为了帮助强化和澄清上一章提供的信息，本章将逐步演示创建一个使用 `ViewModel` 组件的示例应用项目。该示例将在下一章通过引入 `LiveData`\
  \ 和数据绑定支持进一步增强。\n\n## 33.2 创建 ViewModel 示例项目\n\n此练习的第一步是创建新项目。首先启动 Android Studio，如果有必要，使用\
  \ File -> Close Project 菜单选项关闭当前打开的项目，以便显示欢迎界面。\n\n\n\n\n在创建 AndroidSample 项目时，选择了\
  \ **Empty Activity** 模板作为项目的基础。然而，对于本项目，将使用 **Fragment + ViewModel** 模板。这将生成一个结构符合架构指南的\
  \ Android Studio 项目。\n\n从欢迎界面上选择 **New Project**（新建项目）选项，在弹出的新项目对话框中，点击 **Next**（下一步）按钮之前，选择\
  \ **Fragment + ViewModel** 模板。\n\n在 `Name` 字段中输入 `ViewModelDemo` 并指定 `com.ebookfrenzy.viewmodeldemo`\
  \ 为包名。在点击 **Finish**（完成）按钮之前，将 **Minimum API level** 设置更改为 `API 26`: Android 8.0\
  \ (Oreo)，并将 **Language** 菜单更改为 `Java`。编辑 `build.gradle (Module :app)` 文件，启用 view\
  \ binding 并点击编辑器面板顶部的 **Sync Now**（立即同步）链接：\n\n```gradle\nandroid {\n    buildFeatures\
  \ {\n        viewBinding true\n    }\n}\n```\n\n# 33.3 审查项目\n\n使用 **Fragment + ViewModel**\
  \ 模板创建项目时，其结构在许多方面与创建 AndroidSample 项目时使用的 **Empty Activity** 有不同。项目的关键组件如下：\n\n\
  ## 33.3.1 主 Activity\n\n首先需要注意的是，主 Activity 的用户界面已经过结构化，允许单个活动充当最终完成的应用所需的所有屏幕的容器。该活动的主用户界面布局包含在\
  \ `app -> res -> layout -> activity_main.xml` 文件中，并以 `FrameLayout` 的形式提供了一个空容器（在图\
  \ 33-1 中突出显示），屏幕内容将出现在其中：\n\n![](img/android_studio_view_model_container_area.jpg)\n\
  \n图 33-1\n\n## 33.3.2 内容 Fragment\n\n`FrameLayout` 容器只是一个占位符，它将在运行时被应用启动时要显示的第一个屏幕的内容替换。该内容通常以\
  \ `Fragment` 的形式存在，由一个 XML 布局资源文件和相应的类文件组成。事实上，在创建项目时，Android Studio 已为此目的创建了一个初始\
  \ fragment。该 fragment 的布局资源文件可以在 `app -> res -> layout -> fragment_main.xml` 找到，当加载到布局编辑器时，它将如图\
  \ 33-2 所示：\n\n![](img/as_3.5_viewmodel_main_fragment.jpg)\n\n图 33-2\n\n默认情况下，该 fragment\
  \ 仅包含一个显示文本“MainFragment”的 `TextView`，但其他已准备好修改以包含第一个应用屏幕的布局。此时，值得花一点时间查看 Android\
  \ Studio 已生成的代码，以便在活动容器区域内显示此 fragment。\n\n将 `FrameLayout` 占位符替换为 fragment 的过程从\
  \ `MainActivity` 类文件（`app -> java -> <package name> -> MainActivity`）开始。关键代码出现在该类的\
  \ `onCreate()` 方法中，并将容器的 id（已分配给 `FrameLayout` 占位符视图）替换为 `MainFragment` 类：\n\n```java\n\
  @Override\nprotected void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    setContentView(R.layout.activity_main);\n    if (savedInstanceState == null)\
  \ {\n        getSupportFragmentManager().beginTransaction()\n                  \
  \  .replace(R.id.container, MainFragment.newInstance())\n                    .commitNow();\n\
  \    }\n}\n```\n\n伴随 fragment 的代码可以在 `MainFragment.java` 文件（`app -> <package name>\
  \ -> ui.main -> MainFragment`）中找到。在该类文件中是 `onCreateView()` 方法，它在 fragment 创建时被调用。此方法加载\
  \ `fragment_main.xml` 布局文件，使其显示在主活动布局的容器区域内：\n\n```java\n@Override\npublic View\
  \ onCreateView(@NonNull LayoutInflater inflater, @Nullable ViewGroup container,\
  \ @Nullable Bundle savedInstanceState) {\n    return inflater.inflate(R.layout.fragment_main,\
  \ container, false);\n}\n```\n\n#### 33.3.3 ViewModel\n\n活动的 `ViewModel` 包含位于 `app\
  \ -> java -> ui.main -> MainViewModel` 的 `MainViewModel.java` 类文件中。它被声明为 `ViewModel`\
  \ Android 架构组件类的子类，并已准备好修改以存储应用的数据模型：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\
  \nimport androidx.lifecycle.ViewModel;\n\npublic class MainViewModel extends ViewModel\
  \ {\n    // TODO: Implement the ViewModel\n}\n```\n\n### 33.4 设计 Fragment 布局\n\n\
  下一步是设计 fragment 的布局。在 Project 工具窗口中找到 `fragment_main.xml` 文件并双击它将其加载到布局编辑器中。一旦加载完成，选择现有的\
  \ `TextView` 小部件并使用 Attributes 工具窗口将 `id` 属性更改为 `resultText`。\n\n从调色板拖入一个 `Number\
  \ (Decimal)` 视图并将其置于现有 `TextView` 之上。选中该视图后，参考 Attributes 工具窗口并将 id 更改为 `dollarText`。\n\
  \n将一个 `Button` 小部件拖到布局中，使其置于 `TextView` 下方，并将文本属性更改为“Convert”。选中按钮后，将 id 更改为 `convertButton`。此时，布局应该类似于图\
  \ 33-3 所示：\n\n![](img/as_4.2_viewmodeldemo_ui.jpg)\n\n图 33-3\n\n最后，点击布局编辑器右上角的警告图标，并将硬编码字符串转换为资源。\n\
  \n### 33.5 实现 ViewModel\n\n完成用户界面布局后，需要在 view model 中创建应用的数据模型。在 Project 窗口中，找到\
  \ `MainViewModel.java` 文件，双击将其加载到代码编辑器并修改该类如下：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\
  \nimport androidx.lifecycle.ViewModel;\n\npublic class MainViewModel extends ViewModel\
  \ {\n    private static final Float rate = 0.74F;\n    private String dollarText\
  \ = \"\";\n    private Float result = 0F;\n\n    public void setAmount(String value)\
  \ {\n        this.dollarText = value;\n        result = Float.parseFloat(dollarText)*rate;\n\
  \    }\n\n    public Float getResult()\n    {\n        return result;\n    }\n}\n\
  ```\n\n该类声明了变量来存储当前的美元字符串值和转换后的金额，并提供了访问这些数据值的 getter 和 setter 方法。调用时，`setAmount()`\
  \ 方法接收美元金额并存储在本地 `dollarText` 变量中。将美元字符串值转换为浮点数，乘以虚拟汇率，并将生成的欧元金额存储在 `result` 变量中。另一方面，`getResult()`\
  \ 方法简单返回赋值给 `result` 变量的当前值。\n\n### 33.6 将 Fragment 与 ViewModel 关联\n\n显然，fragment\
  \ 需要某种方式来获取 `ViewModel` 的引用，以便访问模型并观察数据变化。Fragment 或活动使用 `ViewModelProvider` 类的实例来维护其依赖的\
  \ ViewModels。\n\n在 Fragment 内部使用 `ViewModelProvider` 类创建 `ViewModelProvider` 实例。调用时，类初始化器传递了当前\
  \ Fragment 或活动的引用，并返回如下的 `ViewModelProvider` 实例：\n\n```java\nViewModelProvider viewModelProvider\
  \ = new ViewModelProvider(this);\n```\n\n\n\n一旦创建了 `ViewModelProvider` 实例，就可以在该实例上调用\
  \ `get()` 方法，并传递所需的特定 `ViewModel` 类。该提供程序将随后创建该 `ViewModel` 类的新实例，或者返回一个已存在的实例：\n\
  \n```java\nViewModel mviewModel = viewModelProvider.get(MainViewModel.class);\n\
  ```\n\n编辑 `MainFragment.java` 文件，并验证 Android Studio 已在 `onCreate()` 方法中包含了此步骤（为了简洁起见，通过单行代码操作）：\n\
  \n```java\nmViewModel = new ViewModelProvider(this).get(MainViewModel.class);\n\
  ```\n\n访问模型视图后，现在可以在 `Fragment` 中添加代码以开始处理数据。\n\n### 33.7 修改 Fragment\n\n现在需要更新\
  \ fragment 类以响应按钮点击并与 `ViewModel` 中存储的数据进行交互。该类还需要布局中视图的引用，以便响应按钮点击、提取当前的美元值并显示转换后的金额。\n\
  \n在“在 Android Studio 中创建应用程序”章节中，`Button` 控件的 `onClick` 属性用于指定用户点击按钮时调的方法。遗憾的是，此属性只能在\
  \ `Activity` 中调用方法，而不能在 `Fragment` 中调用方法。为了解决这一局限性，我们需要在 `Fragment` 类中添加一些代码来设置按钮的\
  \ `onClick` 监听器可以通过重写 `MainFragment.java` 文件中的 `onViewCreated()` 方法来实现。在进行这些更改时，我们将\
  \ fragment 使用视图绑定（binding）：\n\n```java\nimport com.ebookfrenzy.viewmodel.databinding.FragmentMainBinding;\n\
  \npublic class MainFragment extends Fragment {\n\n    private MainViewModel mViewModel;\n\
  \n    private FragmentMainBinding binding;\n\n    public static MainFragment newInstance()\
  \ {\n        return new MainFragment();\n    }\n\n    @Nullable\n    @Override\n\
  \    public View onCreateView(LayoutInflater inflater,\n                       \
  \      @Nullable ViewGroup container,\n                             @Nullable Bundle\
  \ savedInstanceState) {\n        return inflater.inflate(R.layout.fragment_main,\
  \ container, false);\n        binding = FragmentMainBinding.inflate(inflater, container,\
  \ false);\n        return binding.getRoot();\n    }\n\n    @Override\n    public\
  \ void onDestroyView() {\n        super.onDestroyView();\n        binding = null;\n\
  \    }\n\n    @Override\n    public void onViewCreated(@NonNull View view, @Nullable\
  \ Bundle savedInstanceState) {\n        super.onViewCreated(view, savedInstanceState);\n\
  \        binding.convertButton.setOnClickListener(v -> {\n        });\n    }\n}\n\
  ```\n\n添加监听器后，每当用户点击按钮时，都会调用 `onClick()` 方法中的任何代码。\n\n### 33.8 访问 ViewModel 数据\n\
  \n点击按钮时，`onClick()` 方法需要从 `EditText` 读取当前值，确认字段为空，然后调用 `ViewModel` 实例的 `setAmount()`\
  \ 方法并在 `TextView` 控件上显示转换后的值。\n\n由于项目尚未使用 `LiveData`，因此每次创建 `Fragment` 时都需要从 `ViewModel`\
  \ 获取最新的结果。\n\n在 `MainFragment.java` 文件中，按照如下方式在 `onViewCreated()` 方法中实现这些需求：\n\n\
  ```java\nimport java.util.Locale;\n\n@Override\npublic void onViewCreated(@NonNull\
  \ View view, @Nullable Bundle savedInstanceState) {\n    super.onViewCreated(view,\
  \ savedInstanceState);\n    binding.resultText.setText(String.format(Locale.ENGLISH,\"\
  %.2f\",\n            mViewModel.getResult()));\n    binding.convertButton.setOnClickListener(v\
  \ -> {\n        if (!binding.amountEditText.getText().toString().equals(\"\")) {\n\
  \            mViewModel.setAmount(Double.parseDouble(binding.amountEditText.getText().toString()));\n\
  \            binding.resultText.setText(String.format(Locale.ENGLISH,\"%.2f\", mViewModel.getResult()));\n\
  \        } else {\n            binding.resultText.setText(\"No Value\");\n     \
  \   }\n    });\n}\n```\n\n### 33.9 测试项目\n\n完成项目的阶段后，在模拟器上构建并运行应用，输入美元值并点击 Convert\
  \ 按钮。转换后的金额出现在 `TextView` 上，表明 ViewModel 正在工作。运行原始的 AndroidSample 应用时，旋转设备会导致 `TextView`\
  \ 显示的值丢失。现在使用 ViewModel 应用重复此测试，注意旋转后值仍然保留。这是因为当 Fragment 被销毁和重建时，ViewModel 仍然留在内存中。\n\
  \n### 33.10 总结\n\n在本章中，我们回顾了之前创建的 AndroidSample 项目，并创建了一个符合 Jetpack 架构指南的新版本项目。章节概述了\
  \ Fragment + ViewModel 项目模板的结构，并解释了基于单一 Activity 并使用 Fragments 显示不同屏幕的概念。示例项目还演示了使用\
  \ ViewModels 将数据处理与用户界面相关的代码分离。\n\n## 34. Android Jetpack LiveData 教程\n\n上一章（等一下，“上一章”）开始了设计符合推荐\
  \ Jetpack 架构指南的应用的过程。这些初始步骤涉及选择 Fragment+ViewModel 项目模板，并在 ViewModel 实例中实现应用用户界面的数据模型。\n\
  \n本章将通过使用 `LiveData` 架构组件进一步增强应用设计。一旦在本章中向项目添加 `LiveData` 支持，接下来的章节（从“Android Jetpack\
  \ Data Binding 概述”开始）将利用 Jetpack Data Binding 库从项目中消除更多多的代码。\n\n### 34.1 LiveData\
  \ - 回顾\n\n`LiveData` 之前在名为“使用 Jetpack 构建现代 Android 架构”的章节中介绍。如之前所述，`LiveData` 组件可以作为\
  \ ViewModel 内部数据值的封装。一旦包含在 `LiveData` 实例中，这些变量就可以被应用内的其他对象（通常是 `Activity` 和 `Fragment`\
  \ 等 UI 控制器）观察到。这允许 UI 控制器在底层 `LiveData` 值发生变化时接收通知。通过创建 `Observer` 类的实例并定义在 `LiveData`\
  \ 值变化时调用的 `onChange()` 方法来设置观察者。一旦创建了 `Observer` 实例，就会调用 `LiveData` 对象的 `observe()`\
  \ 方法将其附加到 `LiveData` 对象上。`LiveData` 实例可以使用 `MutableLiveData` 类声明为可变的，允许 `ViewModel`\
  \ 和 UI 控制器对底层数据值进行更改。\n\n### 34.2 为 ViewModel 添加 LiveData\n\n\n\n\n\n启动 `Android\
  \ Studio`，打开上一章创建的 `ViewModelDemo` 项目，并打开 `MainViewModel.java` 文件，其目前的内容如下：\n\n\
  ```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\nimport androidx.lifecycle.ViewModel;\n\
  \npublic class MainViewModel extends ViewModel {\n    private static final Float\
  \ rate = 0.74F;\n\n    private String dollarText = \"\";\n\n    private Float result\
  \ = 0F;\n\n    public void setAmount(String value) {\n        this.dollarText =\
  \ value;\n        result = Float.parseFloat(dollarText)*rate;\n    }\n\n    public\
  \ Float getResult()\n    {\n        return result;\n    }\n}\n```\n\n本章此阶段的目标是将\
  \ `result` 变量封装在一个 `MutableLiveData` 实例中（该对象需要是可变的，以便在用户每次请求货币转换时都能更改值）。首先修改该类，使其内容如下所示所示，请注意在使用\
  \ `LiveData` 时需要导入额外的包：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\
  \nimport androidx.lifecycle.MutableLiveData;\n\nimport androidx.lifecycle.ViewModel;\n\
  \npublic class MainViewModel extends ViewModel {\n    private static final Float\
  \ rate = 0.74F;\n\n    private String dollarText = \"\";\n\n    private Float result\
  \ = 0F;\n    final private MutableLiveData<Float> result = new MutableLiveData<>();\n\
  \n    public void setAmount(String value) {\n        this.dollarText = value;\n\
  \        result = Float.parseFloat(dollarText)*rate;\n    }\n\n    public Float\
  \ getResult()\n    {\n        return result;\n    }\n}\n```\n\n既然 `result` 变量已包含在可变的\
  \ `LiveData` 实例中，那么 `setAmount()` 和 `getResult()` 方法都需要进行修改。在 `setAmount()` 方法中，不能再使用赋值运算符（`=`）为\
  \ `result` 变量赋值了。相反，必须调用 `LiveData setValue()` 方法，并将新值作为参数传递。按照目前的实现，`getResult()`\
  \ 方法声明为返回 `Float` 值，现在需要更改为返回 `MutableLiveData` 对象。完成这些剩余更改后，得到如下类文件：\n\n```java\n\
  package com.ebookfrenzy.viewmodeldemo.ui.main;\n\nimport androidx.lifecycle.MutableLiveData;\n\
  \nimport androidx.lifecycle.ViewModel;\n\npublic class MainViewModel extends ViewModel\
  \ {\n    private static final Float rate = 0.74F;\n\n    private String dollarText\
  \ = \"\";\n    final private MutableLiveData<Float> result = new MutableLiveData<>();\n\
  \n    public void setAmount(String value) {\n        this.dollarText = value;\n\
  \        result = Float.parseFloat(dollarText)*rate;\n        result.setValue(Float.parseFloat(dollarText)*rate);\n\
  \    }\n\n    public Float getResult()\n    public MutableLiveData<Float> getResult()\n\
  \    {\n        return result;\n    }\n}\n```\n\n### 34.3 实现观察者\n\n现在转换结果已包含在 `LiveData`\
  \ 实例中，下一步是在 UI 控制器中配置一个观察者，在本例中，它就是 `MainFragment` 类。找到 `MainFragment.java` 类（`app`\
  \ -> `java` -> `<package name>` -> `MainFragment`），双击将其加载到编辑器，并修改 `onViewCreated()`\
  \ 方法创建一个名为 `resultObserver` 的新 `Observer` 实例：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\
  \nimport androidx.lifecycle.Observer;\n\n.\n.\n\n@Override\npublic void onViewCreated(@NonNull\
  \ View view, @Nullable Bundle savedInstanceState) {\n    super.onViewCreated(view,\
  \ savedInstanceState);\n    binding.resultText.setText(String.format(Locale.ENGLISH,\"\
  %.2f\",\n            mViewModel.getResult()));\n    final Observer<Float> resultObserver\
  \ = new Observer<Float>() {\n        @Override\n        public void onChanged(Float\
  \ result) {\n            binding.resultText.setText(String.format(Locale.ENGLISH,\"\
  %.2f\",\n                result));\n        }\n    };\n.\n```\n\n`resultObserver`\
  \ 实例声明了 `onChanged()` 方法，当该方法被调用时，会传入当前值并将其转换并显示在 `TextView` 上。下一步是将观察者添加到 `LiveData`\
  \ 对象中，可以通过调用 `ViewModel` 的 `getResult()` 方法获取引用。由于更新 `TextView` 现在是 `onChanged()`\
  \ 回调的职责，现在可以删除执行此任务的现有代码行了：\n\n```java\n@Override\npublic void onViewCreated(@NonNull\
  \ View view, @Nullable Bundle savedInstanceState) {\n    super.onViewCreated(view,\
  \ savedInstanceState);\n    binding.resultText.setText(String.format(Locale.ENGLISH,\"\
  %.2f\",\n            mViewModel.getResult()));\n    final Observer<Float> resultObserver\
  \ = new Observer<Float>() {\n        @Override\n        public void onChanged(Float\
  \ result) {\n            binding.resultText.setText(String.format(Locale.ENGLISH,\"\
  %.2f\",\n                result));\n        }\n    };\n\nmmViewModel.getResult().observe(getViewLifecycleOwner(),\
  \ resultObserver);\n\nbinding.convertButton.setOnClickListener(v -> {\n    if (!binding.dollarText.toString().equals(\"\
  \")) {\n        mViewModel.setAmount(String.format(Locale.ENGLISH,\"%s\",\n    \
  \        binding.dollarText.getText()));\n        binding.resultText.setText(String.format(Locale.ENGLISH,\"\
  %.2f\",\n            mViewModel.getResult()));\n    } else {\n        binding.resultText.setText(\"\
  No Value\");\n    }\n});\n}\n```\n\n### 34.4 总结\n\n本章演示了如何使用 Android LiveData 组件来确保显示给用户的数据始终与\
  \ ViewModel 中存储的数据一致。这一简单过程包括将 ViewModel 数据值封装在 `LiveData` 对象中，并在 UI 控制器中设置该 `LiveData`\
  \ 值的观察者。每当 `LiveData` 值发生变化时，观察者就会收到通知并调用 `onChanged()` 方法传入更新后的值。\n\n向项目中添加 LiveData\
  \ 支持已经在某种程度上简化了项目设计。通过使用 Data Binding 库还可以实现进一步的重大改进，细节将在下一章中介绍。\n\n### 35. Android\
  \ Jetpack Data Binding 概述\n\n\n\n\n\n在“使用 Jetpack 构建现代 Android 应用架构”章节中，我们介绍了 Android\
  \ 数据绑定（Data Binding）的概念，并简要解释了它如何在无需编写代码的情况下，将用户界面布局中的视图直接连接到应用内其他对象的方法和数据。本章将提供更多关于数据绑定的细节，重点解释如何在\
  \ Android Studio 项目中实现数据绑定。在下一章的教程（“Android Jetpack 数据绑定教程”）将提供数据绑定的实际操作示例。\n\n\
  ### 35.1 数据绑定概述\n\n数据绑定支持由 Android Jetpack Data Binding 库提供，其主要目的是提供一种简单的方法，将用户界面布局中的视图与存储在应用代码中的数据（通常在\
  \ `ViewModel` 实例中）连接起来。数据绑定还提供了一种方便的方法，将 `Button` 组件等用户界面控件映射到其他对象（如 UI 控制器和 `ViewModel`\
  \ 实例）中的事件和监听方法。\n\n当数据绑定与 `LiveData` 组件结合使用时，会变得格外强大。例如，考虑使用数据绑定绑定到 `ViewModel`\
  \ 中 `LiveData` 变量的 `EditText` 视图。通过这种连接，`ViewModel` 中数据值的任何变化都将自动显示在 `EditText`\
  \ 视图中；在使用双向绑定时，输入到 `EditText` 中的任何数据都将自动用于更新 `LiveData` 值。最令人印象深刻的是，这除了初始设置绑定所需的代码外，不需要任何额外的代码即可。\n\
  \n传统上，将 `Button` 组件等交互式视图连接到 UI 控制器中的方法，需要开发者编写代码来实现监听方法，以便在点击按钮时调用。数据绑定使得这一切变得非常简单，只需在布局\
  \ XML 文件的 `Button` 元素中引用要调用的方法即可。\n\n### 35.2 数据绑定的关键组件\n\n默认情况下，Android Studio\
  \ 项目未配置数据绑定支持。事实上，在应用开始使用数据绑定之前，需要组合多个不同的元素。这些涉及项目构建配置、布局 XML 文件、数据绑定类以及数据绑定表达式语言的使用。虽然这初看起可能有些复杂，但分离开来看，这些步骤实际上是非常简单的，一旦完成，在节省代码工作量方面是非常值得的。在本章的剩余部分，将详细介绍这些元素中的每一个。完成这些基础知识后，下一章将通过详细的教程以实际方式演示这些步骤。\n\
  \n#### 35.2.1 项目构建配置\n\n在项目可以使用数据绑定之前，必须先配置使用 Android Data Binding 库，并启用对数据绑定类和绑定表达式语法的支持。幸运的是，这只需要在模块级\
  \ `build.gradle` 文件添加几行代码（项目工具窗口 Gradle Scripts 下列出的 `build.gradle (Module: app)`）即可。以下列出了启用了数据绑定的部分构建文件：\n\
  \n```gradle\nandroid {\n    buildFeatures {\n        dataBinding = true\n    }\n\
  }\n```\n\n#### 35.2.2 数据绑定布局文件\n\n正如我们在之前的章节看到的，应用的用户界面通常包含在 XML 布局文件中。在这些布局文件中的视图利用数据绑定之前，必须先将布局文件转换为数据绑定布局文件。\n\
  \n如书前面所述，XML 布局文件定义了布局组件的层次结构，从顶层或根视图开始。根视图总是以布局容器的形式出现，例如 `ConstraintLayout`、`FrameLayout`\
  \ 或 `LinearLayout` 实例，正如 `ViewModelDemo` 项目中的 `fragment_main.xml` 文件所示：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:id=\"@+id/main\"\n    android:layout_width=\"match_parent\"\n    android:layout_height=\"\
  match_parent\"\n    tools:context=\".ui.main.MainFragment\">\n\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n为了能够使用数据绑定，布局层次结构必须有一个布局组件作为根视图，而该组件又成为当前根视图的父视图。\n\n在上述示例中，需要对现有布局文件进行以下更改：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<layout xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  >\n    <androidx.constraintlayout.widget.ConstraintLayout\n        xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n        xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n        xmlns:tools=\"http://schemas.android.com/tools\"\n        android:id=\"\
  @+id/main\"\n        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  match_parent\"\n        tools:context=\".ui.main.MainFragment\">\n\n    </androidx.constraintlayout.widget.ConstraintLayout>\n\
  </layout>\n```\n\n## 35.2.3 布局文件数据\n\n数据绑定布局文件需要某种方式来声明项目中要绑定的类（例如 `ViewModel` 或\
  \ UI 控制器）。声明这些类后，布局文件还需要一个变量来引用这些实例。这是通过使用 `data` 实现的，示例所示：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<layout xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  >\n    <data>\n        <variable\n            name=\"myViewModel\"\n           \
  \ type=\"com.ebookrenzy.myapp.ui.main.MainViewModel\" />\n    </data>\n    <androidx.constraintlayout.widget.ConstraintLayout\n\
  \        android:id=\"@+id/main\"\n        android:layout_width=\"match_parent\"\
  \n        android:layout_height=\"match_parent\"\n        tools:context=\".ui.main.MainFragment\"\
  >\n\n</layout>\n```\n\n上述 `data` 元素声明了一个类型为 `MainViewModel` 的新变量 `myViewModel`（注意声明变量时必须使用\
  \ `MainViewModel` 类的完整包名）。\n\n`data` 元素还可以导入其他类，这些类可以在布局文件的其他地方通过绑定表达式引用。例如，如果你有一个类包含在显示给用户之前需要调用的方法，可以如下所示导入该类：\n\
  \n```xml\n<data>\n    <import type=\"com.ebookrenzy.MyFormattingTools\" />\n   \
  \ <variable\n        name=\"viewModel\"\n        type=\"com.ebookrenzy.myapp.ui.main.MainViewModel\"\
  \ />\n</data>\n```\n\n## 35.2.4 绑定类\n\n\n\n\n\n对于绑定布局文件中数据元素（data element）中引用的每个类，Android\
  \ Studio 会自动生成一个对应的绑定类。它是 `AndroidDataBinding` 类的子类，并将根据布局文件名使用单词大写字母和 `Binding`\
  \ 后缀进行命名。因此，名为 `fragment_main.xml` 的布局文件的绑定类将被命名为 `FragmentMainBinding`。该绑定类包含了布局文件中指定的绑定，并将它们映射到绑定对象内部的变量和方法。\n\
  \n尽管绑定类是自动生成的，但仍需要编写代码来根据对应的数据绑定布局文件创建该类的实例。幸运的是，这可以通过利用 `DataBindingUtil` 类来实现。\n\
  \n`Activity` 或 `Fragment` 的初始化代码通常会设置内容视图或“填充”（inflate）用户界面布局文件。这仅意味着代码打开布局文件、解析\
  \ XML 并在内存中创建并配置所有的视图对象。对于现有的 Activity 类，实现此目的代码可以在 `onCreate()` 方法找到，内容如下：\n\n\
  ```java\nsetContentView(R.layout.activity_main);\n```\n\n对于 `Fragment`，这发生在 `onCreateView()`\
  \ 方法中：\n\n```java\nreturn inflater.inflate(R.layout.fragment_main, container, false);\n\
  ```\n\n在 `Activity` 类中创建绑定类实例只需要按照如下所示修改此初始化代码：\n\n```java\nActivityMainBinding\
  \ binding;\n\nbinding = DataBindingUtil.setContentView(this, R.layout.activity_main,\
  \ false);\n```\n\n对于 `Fragment`，代码如下：\n\n```java\nFragmentMainBinding binding;\n\
  \nbinding = DataBindingUtil.inflate(\n      inflater, R.layout.fragment_main, container,\
  \ false);\n\nbinding.setLifecycleOwner(this);\n\nView view = binding.getRoot();\n\
  \nreturn view;\n```\n\n#### 35.2.5 数据绑定变量配置\n\n如上所述，数据绑定布局文件包含数据元素，该元素包含变量元素，变量元素由变量名和要建立绑定的类型组成。例如：\n\
  \n```xml\n<data>\n    <variable\n        name=\"viewModel\"\n        type=\"com.ebookfrenzy.viewmodeldemo.ui.main.MainViewModel\"\
  \ />\n    <variable\n        name=\"uiController\"\n        type=\"com.ebookfrenzy.viewmodeldemo_databinding.ui.main.MainFragment\"\
  \ />\n</data>\n```\n\n在上面的示例中，第一个变量知道它将绑定到类型为 `MainViewModel` 的 ViewModel 类实例，但尚未连接到实际的\
  \ `MainViewModel` 对象实例。这需要额外的步骤，将应用内部使用的 `MainViewModel` 实例分配给布局文件中声明的变量。这是通过调用数据绑定实例的\
  \ `setVariable()` 方法实现的，该实例的引用在上一章中已获取：\n\n```java\nMainViewModel mViewModel = new\
  \ ViewModelProvider(this).get(MainViewModel.class);\n\nbinding.setVariable(viewModel,\
  \ mViewModel);\n```\n\n上述数据元素中的第二个变量以名为 `MainFragment` 的 `Fragment` 形式引用 UI 控制器类。在这种情况下，UI\
  \ 控制器（无论是 `Activity` 还是 `Fragment`）中的代码只需要如下所示将自身赋值给变量：\n\n```java\nbinding.setVariable(uiController,\
  \ this);\n```\n\n### 35.2.6 绑定表达式（单向）\n\n绑定表达式定义了特定视图如何与绑定对象交互。例如，`Button` 上的绑定表达式可能会声明响应点击时调用对象上的哪种方法。或者，绑定表达式可能会定义存储在\
  \ `ViewModel` 中的哪个数据值显示在 `TextView` 中，以及它如何被呈现和格式化。\n\n绑定表达式使用声明式语言，允许在决定如何使用绑定数据时使用逻辑以及对其他类和方法的访问。例如，表达式可以包含数学表达式、方法调用、字符串拼接、对数组元素的访问和比较操作。此外，所有标准的\
  \ Java 语言库都会默认导入，因此在 Java 中可以实现的许多工作也可以在绑定表达式中完成。正如已经过的，数据元素还可以用于导入自定义类，以为表达式添加更多功能。\n\
  \n绑定表达式以 `@` 符号开头，随后是用大括号 `{}` 包围的表达式。\n\n例如，考虑一个包含名为 `result` 变量的 `ViewModel` 实例。假设该类已分配给数据绑定布局文件中名为\
  \ `viewModel` 的变量，并需要绑定到 `TextView` 对象，以便视图始终显示最新的结果值。如果此值被存储为 `String` 对象，则在布局文件中的声明如下：\n\
  \n```xml\n<TextView\n    android:id=\"@+id/resultText\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:text=\"\
  @{viewModel.result}\"\n    app:layout_constraintBottom_toBottomOf=\"parent\"\n \
  \   app:layout_constraintEnd_toEndOf=\"parent\"\n    app:layout_constraintStart_toStartOf=\"\
  parent\"\n    app:layout_constraintTop_toTopOf=\"parent\" />\n```\n\n\n\n\n另一方面，双向绑定允许数据模型响应布局的变化进行更新。例如，`EditText`\
  \ 视图可以配置为双向绑定，这样当用户输入不同的值时，该值将用于更新对应的数据模型值。在声明双向表达式时，语法与单向表达式相似，不同之处它以 `@=` 开头。例如：\n\
  \n```xml\nandroid:text=\"@={myViewModel.result}\"\n```\n\n### 35.2.8 事件和监听器绑定\n\n\
  绑定表达式也可以用于响应视图上的事件来触发方法调用。例如，`Button` 视图可以配置为在点击时调用某个方法。在标题为在 Android Studio 中创建一个示例\
  \ Android 应用的章节中，例如，按钮的 `onClick` 属性被配置为调用应用主 Activity 中名为 `convertCurrency()` 的方法。在\
  \ XML 文件中，这表示如下：\n\n```xml\nandroid:onClick=\"convertCurrency\"\n```\n\n`convertCurrency()`\
  \ 方法在以下行进行了声明：\n\n```java\npublic void convertCurrency(View view) {\n.\n.\n}\n```\n\
  \n注意，这种类型的方法调用总是会传递一个发生事件的视图引用。在数据绑定中，可以使用以下表达式实现相同的效果（假设布局已绑定到一个变量名为 `uiController`\
  \ 的类）：\n\n```xml\nandroid:onClick=\"@{uiController::convertCurrency}\"\n```\n\n\
  另一个选项（也是一个提供了向方法传递参数的选项）被称为监听器绑定。以下表达式使用这种方法调用同一个 `viewModel` 实例上的方法，且不带参数：\n\n\
  ```xml\nandroid:onClick='@{() -> myViewModel.methodOne()}'\n```\n\n以下表达式调用了一个需要三个参数的方法：\n\
  \n```xml\nandroid:onClick='@{() -> myViewModel.methodTwo(viewModel.result, 10, \"\
  A String\")}'\n```\n\n绑定表达式提供了一种丰富且灵活的语言，用于将用户界面视图绑定到其他对象中的数据和方法，本章仅涵盖了最常见的用例。要了解更多关于绑定表达式的知识，请查看\
  \ Android 在线文档：\n\nhttps://developer.android.com/topic/libraries/data-binding/expressions\n\
  \n### 35.3 总结\n\nAndroid 数据绑定提供了一个系统，用于在界面布局中的视图与应用架构中其他对象的数据和方法之间建立连接，而无需编写代码。一旦完成了一些初始配置步骤，数据绑定只需涉及在布局文件的视图元素中使用绑定表达式。这些绑定表达式可以是单向的，也可以是双向的，还可以用于绑定响应用户界面内按钮点击等事件的调用方法。\n\
  \n## 36. Android Jetpack 数据绑定教程\n\n到目前为止，我们在书中已经涵盖了现代 Android 应用架构的基本概念，并详细地查看了\
  \ `ViewModel` 和 `LiveData` 组件。数据绑定的概念在上一章中也有过，现在将在本章中使用它来进一步修改 `ViewModelDemo` 应用。\n\
  \n### 36.1 移除冗余代码\n\n如果你还没有这样做，请复制 `ViewModelDemo` 项目文件夹并将其保存为 `ViewModelDemo_LiveData`，这样它可以在下一章中再次使用。复制完成后，打开原始的\
  \ `ViewModelDemo` 项目，准备实现数据绑定。\n\n在 `ViewModelDemo` 应用中实现数据绑定之前，将通过删除项目内到在本章结束时不再需要的全部代码，来演示数据绑定的威力。\n\
  \n启动 Android Studio，打开 `ViewModelDemo` 项目，编辑 `MainFragment.java` 文件并按如下方式修改代码：\n\
  \n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n.\n.\nimport android.arch.lifecycle.Observer;\n\
  .\n.\npublic class MainFragment extends Fragment {\n    private MainViewModel mViewModel;\n\
  .\n.\n    @Override\n    public void onViewCreated(@NonNull View view,\n       \
  \                      @Nullable Bundle savedInstanceState) {\n        super.onViewCreated(view,\
  \ savedInstanceState);\n        final Observer<Float> resultObserver = new Observer<Float>()\
  \ {\n            @Override\n            public void onChanged(@Nullable final Float\
  \ result) {\n                binding.resultText.setText(String.format(Locale.ENGLISH,\n\
  \                            \"%.2f\", result));\n            }\n        };\n  \
  \      mViewModel.getResult().observe(getViewLifecycleOwner(), resultObserver);\n\
  \        binding.convertButton.setOnClickListener(v -> {\n            if (!binding.dollarText.toString().equals(\"\
  \")) {\n                mViewModel.setAmount(String.format(Locale.ENGLISH,\"%s\"\
  ,\n                            binding.dollarText.getText()));\n            } else\
  \ {\n                binding.resultText.setText(\"No Value\");\n            }\n\
  \        });\n    }\n.\n```\n\n接下来，编辑 `MainViewModel.java` 文件并继续按如下方式删除代码（同样注意 `dollarText`\
  \ 转换为 `LiveData`）：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\
  import android.arch.lifecycle.MutableLiveData;\nimport android.arch.lifecycle.ViewModel;\n\
  public class MainViewModel extends ViewModel {\n    private static final rate =\
  \ 0.7F;\n    final MutableLiveData<String> dollarValue = new MutableLiveData<>();\n\
  \    private String dollarText = \"\";\n    final MutableLiveData<Float> result\
  \ = new MutableLiveData<>();\n    public void setAmount(String value) {\n      \
  \  this.dollarText = value;\n        result.setValue(Float.valueOf(dollarText));\n\
  \    }\n    public MutableLiveData<Float> getResult() {\n        return result;\n\
  \    }\n}\n```\n\n虽然在数据过程中过程中添加一些额外的代码，但数据绑定显著减少了需要编写的代码。\n\n### 36.2 启用数据绑定\n\n\
  使用数据绑定的第一步是在 Android Studio 项目中启用它。这需要在 `Gradle Scripts -> build.gradle (:app)`\
  \ 文件中添加一个新属性。在 `build.gradle` 文件中，添加以下元素以在项目中启用数据绑定：\n\n```gradle\nplugins {\n \
  \   id 'com.android.application'\n}\nandroid {\n    buildFeatures {\n        viewBinding\
  \ true\n        dataBinding true\n    }\n}\n```\n\n添加条目后，编辑器顶部会出现一个包含 `Sync Now`\
  \ 链接的栏。点击它以与新的构建设置同步项目。\n\n### 36.3 添加布局元素\n\n正如 Android Jetpack 数据绑定概述所示，为了能够使用数据绑定，布局层次必须有一个\
  \ `layout` 组件作为根视图。这需要对 `fragment_main.xml` 布局文件（`app -> res -> layout -> fragment_main.xml`）进行更改。在布局编辑器工具中打开此文件，切换到\
  \ `Code` 并进行这些更改：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<layout\
  \ xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <androidx.constraintlayout.widget.ConstraintLayout\n\
  \        xmlns:android=\"http://schemas.android.com/apk/res/android\"\n        xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n        xmlns:tools=\"http://schemas.android.com/tools\"\
  \n        android:id=\"@+id/main\"\n        android:layout_width=\"match_parent\"\
  \n        android:layout_height=\"match_parent\"\n        tools:context=\".ui.main.MainFragment\"\
  >\n\n.\n.\n    </androidx.constraintlayout.widget.ConstraintLayout>\n</layout>\n\
  ```\n\n\n\n\n完成这些更改后，切换回设计模式。注意新的根视图虽然在布局画布上不可见，但它现在已列在组件树中，如图 36-1 所示：\n\n![](img/as_3.5_databinding_layout.jpg)\n\
  \n图 36-1\n\n构建并运行应用，验证添加布局元素没有以任何方式改变用户界面的外观。\n\n## 36.4 在布局文件中添加数据元素\n\n将布局文件转换为数据绑定布局文件的下一步是添加\
  \ `<data>` 元素。在本例中，布局将绑定到 `MainViewModel`，因此编辑 `fragment_main.xml` 文件并如下所示添加 `<data>`\
  \ 元素：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<layout xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <data>\n\
  \        <variable\n            name=\"myViewModel\"\n            type=\"com.ebookfrenzy.viewmodeldemo.ui.main.MainViewModel\"\
  \ />\n    </data>\n    <androidx.constraintlayout.widget.ConstraintLayout\n    \
  \    android:id=\"@+id/main\"\n        android:layout_width=\"match_parent\"\n \
  \       android:layout_height=\"match_parent\"\n        tools:context=\".ui.main.MainFragment\"\
  >\n.\n</layout>\n```\n\n再次构建并运行应用，以确保这些更改生效。\n\n### 36.5 使用绑定类\n\n下一步是修改 `MainFragment.java`\
  \ 文件中的代码以载入数据绑定。实现此点的最佳方法是重写 `onCreateView()` 方法：\n\n```java\nimport androidx.databinding.DataBindingUtil;\n\
  import com.ebookfrenzy.viewmodeldemo.R\n\npublic class MainFragment extends Fragment\
  \ {\n    @Override\n    public View onCreateView(@NonNull LayoutInflater inflater,\
  \ @Nullable ViewGroup container,\n                             @Nullable Bundle\
  \ savedInstanceState) {\n        binding = FragmentMainBinding.inflate(inflater,\
  \ container, false);\n        binding = DataBindingUtil.inflate(\n            inflater,\
  \ R.layout.fragment_main, container, false);\n        binding.setLifecycleOwner(this);\n\
  \        return binding.getRoot();\n    }\n}\n```\n\n旧代码只是载入了 `fragment_main.xml`\
  \ 布局文件（换句话说，创建了包含所有视图对象的布局）并返回根视图的引用（顶层布局容器）。数据绑定库包含一个工具类，它提供了一个特殊的载入方法，该方法在构建 UI\
  \ 的同时，还会初始化并返回布局绑定类的实例。新代码调用此方法并将绑定类实例的引用存储在变量中：\n\n```java\nbinding = DataBindingUtil.inflate(\n\
  \    inflater, R.layout.fragment_main, container, false);\n```\n\n绑定对象只需要在 fragment\
  \ 存在期间保留在内存中。为了确保在 fragment 消失时销毁该实例，将当前 fragment 声明为绑定对象的生命周期所有者。\n\n```java\n\
  binding.lifecycleOwner = this;\nreturn binding.getRoot();\n```\n\n## 36.6 将 ViewModel\
  \ 实例分配给数据绑定变量\n\n此时，数据绑定知道它将绑定到类型为 `MainViewModel` 的类实例，但尚未连接到实际的 `MainViewModel`\
  \ 对象。这需要额外的步骤，将应用内部使用的 `MainViewModel` 实例分配给布局文件中声明的 `viewModel` 变量。在 `MainFragment.java`\
  \ 文件的 `onViewCreated()` 方法中添加以下代码：\n\n```java\nimport static com.ebookfrenzy.viewmodeldemo.BR.myViewModel;\n\
  \n@Override\npublic void onViewCreated(@NonNull View view, @Nullable Bundle savedInstanceState)\
  \ {\n    super.onViewCreated(view, savedInstanceState);\n    binding.setVariable(myViewModel,\
  \ mViewModel);\n}\n```\n\n如果 Android Studio 报告 `myViewModel` 未定义，请使用 `Build -> Make\
  \ Project` 菜单重新构建项目以强制生成类。完成这些更改后，下一步开始向数据绑定文件的视图插入一些绑定表达式。\n\n## 36.7 添加绑定表达式\n\
  \n第一个绑定表达式将 `resultText` `TextView` 绑定到模型中的结果值。编辑 `fragment_main.xml` 文件，找到 `resultText`\
  \ 元素并修改 `text` 属性，使元素内容如下：\n\n```xml\n<TextView\n    android:id=\"@+id/resultText\"\
  \n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"wrap_content\"\
  \n    android:text=\"MainFragment\"\n    android:text='@{safebox(myViewModel.result)\
  \ == 0.0 ? \"Enter value\" : String.valueOf(safebox(myViewModel.result)) + \" euros\"\
  }'\n    android:layout_toBottomOf=\"parent\"\n    android:layout_constraintEnd_toEndOf=\"\
  parent\"\n    android:layout_constraintStart_toOf=\"parent\"\n    android:layout_constraintTop_toTopOf=\"\
  parent\" />\n```\n\n该表达式首先检查结果值是否当前为零，如果是，则显示一条指示用户输入值的消息。然而，如果结果不为零，则将值转换为字符串并与单词“euros”拼接，然后显示给用户。\n\
  \n`result` 值在布局中仅需要单向绑定，不需要更新 `ViewModel` 中的值。相反，`dollarValue` `EditText` 需要使用双向绑定，以便数据模型可以使用用户输入的最新值进行更新，并允许在发生设备旋转等生命周期事件时将当前值重新显示在视图中。`dollarText`\
  \ 元素现在应声明如下：\n\n```xml\n<EditText\n    android:id=\"@+id/dollarText\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:layout_marginTop=\"\
  96dp\"\n    android:ems=\"10\"\n    android:importantForAutofill=\"no\"\n    android:inputType=\"\
  numberDecimal\"\n    android:text=\"@={myViewModel.dollarValue}\"\n    android:layout_constraintEnd_toEndOf=\"\
  parent\"\n    android:layout_constraintHorizontal_bias=\"0.502\"\n    android:layout_constraintStart_toOf=\"\
  parent\"\n    android:layout_constraintTop_toTopOf=\"parent\" />\n```\n\n添加了这些绑定表达式后，现在需要编写一个方法，在用户点击按钮时执行转换。\n\
  \n## 36.8 添加转换方法\n\n当点击 `Convert` 按钮时，它将调用 `ViewModel` 上的方法进行转换计算并将欧元值放入 `result`\
  \ `LiveData` 变量中。在 `MainViewModel.java` 文件中添加此方法：\n\n```java\npublic class MainViewModel\
  \ extends ViewModel {\n    private static final Float usd_to_eu_rate = 0.74F;\n\
  \    final public MutableLiveData<String> dollarValue = new MutableLiveData<>();\n\
  \    final public MutableLiveData<Float> result = new MutableLiveData<>();\n   \
  \ public void convertValue() {\n        if ((dollarValue.getValue() != null) &&\n\
  \            (!dollarValue.getValue().equals(\"\")) {\n            result.setValue(Float.parseFloat(dollarValue.getValue())\
  \ * usd_to_eu_rate);\n        } else {\n            result.setValue(0F);\n     \
  \   }\n    }\n}\n```\n\n注意，在没有有效的美元值的情况下，为 `result` `LiveData` 分配了一个零值。这确保了如果用户没有输入值，分配给\
  \ `resultText` `TextView` 的绑定表达式将显示提示消息。\n\n## 36.9 添加监听绑定\n\n测试项目之前的最后一步是在布局文件中的\
  \ `Button` 元素添加监听绑定表达式，以便在点击按钮时调用 `convertValue()` 方法。再次以代码模式编辑 `fragment_main.xml`\
  \ 文件，找到 `convertButton` 元素并如下所示添加 `onClick` ：\n\n```xml\n<Button\n    android:id=\"\
  @+id/convertButton\"\n    android:layout_width=\"wrap_content\" />\n```\n\n\n\n\n\
  \n```xml\nandroid:layout_height=\"wrap_content\"\n    android:onClick=\"@{() ->\
  \ myViewModel.convertValue()}\"\n    android:text=\"@string/convert_text\"\n   \
  \ app:layout_constraintBottom_toBottomOf=\"parent\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintHorizontal_bias=\"0.5\"\n    app:layout_constraintStart_toStartOf=\"\
  parent\"\n    app:layout_constraintTop_toBottomOf=\"@+id/resultText\" />\n```\n\n\
  ### 36.10 测试应用\n\n编译并运行应用，测试在美元输入框中输入值并点击 `Convert` 按钮后，是否会在 `TextView` 上显示正确的结果（带有“euros”后缀），以及在美元输入框为空时尝试转换时，是否会出现“Enter\
  \ value”提示。此外，验证在设备旋转时，用户界面中显示的信息是否仍然保留。\n\n### 36.11 总结\n\n本章的主要目标是完成配置一个使用数据绑定（data\
  \ binding）项目的步骤，并演示单向、双向和监听器绑定表达式的使用。本章还提供了一个实际示例，展示了通过将数据绑定结合 `LiveData` 连接用户界面视图与应用的后端数据及逻辑，可以节省多少代码编写。\n\
  \n### 37. Android ViewModel 状态保存教程\n\n应用状态的保留与恢复，在于当应用被置于后台后，能够从外观和行为上为用户提供连续性。用户已经习惯了可以在不同应用之间切换，并在返回原始应用时，发现它正处于切换之前的完全相同的状态。\n\
  \n正如标题为 \"理解 Android 应用和 Activity 生命周期\"的章节所概述的，当用户将应用置于后台时，如果资源受限，该应用将具备被操作系统终止的资格。当用户尝试将已终止的应用返回到前台时，Android\
  \ 会简单地在新进程中重新启动该应用。由于这一切对用户来说是不可见的，因此应用有责任将自己恢复到最初进入后台时的相同状态，而不是以其“初始启动”状态呈现。对于基于\
  \ `ViewModel` 的应用，这部分许多行为可以使用 `ViewModel Saved State` 模块来实现。\n\n#### 37.1 理解 ViewModel\
  \ 状态保存\n\n正如前面的章节所述，`ViewModel` 为应用开发带来了许多好处，包括在设备旋转等配置更改时恢复 UI 状态。要亲眼观察这一过程，请运行\
  \ `ViewModelDemo` 应用（如果你尚未创建该项目，请从随书的示例代码下载中向 Android Studio 加载 `ViewModelDemo_LiveData`\
  \ 项目）。\n\n运行后，输入一个美元值并将其转换为欧元。在同时显示美元和欧元值的情况下，旋转设备或模拟器，并注意：一旦应用响应了方向变化，两个值仍然可见。\n\
  \n遗憾的是，这种行为并不延伸到后台应用进程的终止上。在应用仍在运行的情况下，点击设备主页将 `ViewModelDemo` 应用置于后台，然后通过打开终端或命令提示符窗口并运行以下命令来终止它（其中\
  \ `<package name>` 是你在创建项目时使用的名称，例如，`com.ebookfrenzy.viewmodeldemo`）：\n\n`adb shell\
  \ am kill <package name>`\n\n如果未找到 `adb` 命令，请参阅标题为 \"设置 Android Studio 开发环境\"的章节，了解设置\
  \ Android Studio 环境的步骤。\n\n一旦应用被终止，返回设备或模拟器并从启动器中选择该应用（不要直接从 Android Studio 内部重新运行应用）。一旦应用出现，它看起来就像刚刚启动的一样，之前的美元和欧元值都丢失了。然而，从用户的角度来看，应用仅仅是从后台恢复的，本应该仍然包含原始数据。在这种情况下，应用未能提供用户对\
  \ Android 应用所期待连续性。\n\n#### 37.2 实现 ViewModel 状态保存\n\n基础的 `ViewModel` 状态保存通过引入 `ViewModel\
  \ Saved State` 库成为可能。该库本质上扩展了 `ViewModel` 类，以支持在后台进程终止及随后的重新启动期间维护状态。\n\n保存状态的关键是\
  \ `SavedStateHandle` 类，它用于保存和恢复 view model 实例的状态。`SavedStateHandle` 对象包含一个键值映射，允许通过引用相应的键来保存和恢复数据值。\n\
  \n为了支持保存状态，需要声明一种不同的 `ViewModel` 子类，在这种情况下，该类应包含一个可以接收 `SavedStateHandle` 实例的构造函数。一旦声明，就可以在创建时包含一个\
  \ `SavedStateViewModelFactory` 对象来创建此类类型的 `ViewModel` 实例。考虑以下来自标准 `ViewModel` 声明的代码片段：\n\
  \n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\nimport androidx.lifecycle.ViewModel;\n\
  import androidx.lifecycle.MutableLiveData;\n\npublic class MainViewModel extends\
  \ ViewModel {\n\n.\n.\n}\n```\n\n创建此类类实例的代码可能类似于：\n\n```java\nprivate MainViewModel\
  \ mViewModel;\n\nmViewModel = new ViewModelProvider(this).get(MainViewModel.class);\n\
  ```\n\n另一方面，一个设计用于支持保存状态的 `ViewModel` 子类需要如下声明：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\
  \nimport androidx.lifecycle.ViewModel;\nimport androidx.lifecycle.MutableLiveData;\n\
  import androidx.lifecycle.SavedStateHandle;\n\npublic class MainViewModel extends\
  \ ViewModel {\n    private SavedStateHandle savedStateHandle;\n\n    public MainViewModel(SavedStateHandle\
  \ savedStateHandle) {\n        this.savedStateHandle = savedStateHandle;\n    }\n\
  \n}\n```\n\n在创建上述 `ViewModel` 的实例时，`ViewModelProvider` 类初始化器必须传递一个 `SavedStateViewModelFactory`\
  \ 实例，如下：\n\n```java\nSavedStateViewModelFactory factory = new SavedStateViewModelFactory(getActivity().getApplication(),this);\n\
  \nmViewModel = new ViewModelProvider(this).get(MainViewModel.class);\n```\n\n####\
  \ 37.3 保存与恢复状态\n\n在 `ViewModel` 内部，可以通过 `SavedStateHandle` 实例的 `set()` 方法保存对象或值，并提供执行检索时引用的键字符串：\n\
  \n```java\nprivate static final String NAME_KEY = \"Customer Name\";\n\nsavedStateHandle.set(NAME_KEY,\
  \ customerName);\n```\n\n当配合 `LiveData` 对象时，可以使用 `SavedStateHandle` 实例的 `getLiveData()`\
  \ 方法恢复之前的值，再次引用相应的键如下：\n\n```java\nMutableLiveData<String> restoredName = savedStateHandle.getLiveData(NAME_KEY);\n\
  ```\n\n要恢复普通的（非 LiveData）对象，只需使用 `SavedStateHandle.get()` 方法：\n\n```java\nString\
  \ restoredName = savedStateHandle.get(NAME_KEY);\n```\n\n其他用的 `SavedStateHandle`\
  \ 方法包括：\n\n- `contains(String key)` - 返回布尔值，指示保存状态是否包含指定键的值。\n- `remove(String key)`\
  \ - 从保存状态中移除该值和键。返回被移除的值。\n- `keys()` - 返回包含保存状态中所有键的字符串集合。\n\n#### 37.4 为 ViewModelDemo\
  \ 项目添加状态保存支持\n\n\n\n\n\n在涵盖了 `ViewModel Saved State` 的基础知识后，可以将 `ViewModelDemo`\
  \ 应用扩展以包含此支持。首先，将“Android Jetpack LiveData 教程`中创建的 `ViewModelDemo_LiveData` 项目导入\
  \ Android Studio（示例代码中也有项目的副本），打开 `build.gradle` (Module :app) 文件并添加 Saved State\
  \ 库依赖（如既往，检查是否有更新的库版本）：\n\n```gradle\ndependencies {\n    implementation \"androidx.savedstate:savedstate:1.2.0\"\
  \n    implementation \"androidx.lifecycle:lifecycle-viewmodel-savedstate:2.5.1\"\
  \n}\n```\n\n接下来，修改 `MainViewModel.java` 文件，使构造函数接收并存储 `SavedStateHandle` 实例。同时导入\
  \ `androidx.lifecycle.SavedStateHandle`，声明一个字符串常量，并修改结果 `LiveData` 变量，以便现在从构造函数中的保存状态中获取值：\n\
  \n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\nimport androidx.lifecycle.ViewModel;\n\
  import androidx.lifecycle.MutableLiveData;\nimport androidx.lifecycle.SavedStateHandle;\n\
  \npublic class MainViewModel extends ViewModel {\n    private static final String\
  \ RESULT_KEY = \"Euro Value\";\n    private static final Float rate = 0.74F;\n \
  \   private String dollarText = \"\";\n\n    final private SavedStateHandle savedStateHandle;\n\
  \    final private MutableLiveData<Float> result = new MutableLiveData<>();\n\n\
  \    public MainViewModel(SavedStateHandle savedStateHandle) {\n        this.savedStateHandle\
  \ = savedStateHandle;\n        result = savedStateHandle.getLiveData(RESULT_KEY);\n\
  \    }\n}\n```\n\n在 `MainViewModel.java` 文件中继续，修改 `setAmount()` 方法，包含代码以在每次计算新的欧元金额时保存结果值：\n\
  \n```java\npublic void setAmount(String value) {\n    this.dollarText = value;\n\
  \    result.setValue(Float.valueOf(dollarText)* rate);\n    Float convertedValue\
  \ = Float.parseFloat(dollarText)* rate;\n    result.setValue(convertedValue);\n\
  \    savedStateHandle.set(RESULT_KEY, convertedValue);\n}\n```\n\n`ViewModel` 的更改完成后，打开\
  \ `MainFragment.java` 文件并进行以下更改，以便在 `ViewModel` 创建过程中包含一个 Saved State 工厂实例：\n\n\
  ```java\nimport androidx.lifecycle.SavedStateViewModelFactory;\n\n@Override\npublic\
  \ void onCreate(@Nullable Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    SavedStateViewModelFactory factory =\n            new SavedStateViewModelFactory(\n\
  \                    getActivity().getApplication(),this);\n    mViewModel = new\
  \ ViewModelProvider(this, factory).get(MainViewModel.class);\n    // TODO: Use the\
  \ ViewModel\n}\n```\n\n注意，上述代码中对 `ViewModelProvider` 用的更改可能会导致 Android Studio 生成以下语法错误：\n\
  \nCannot resolve constructor ‘ViewModelProvider(MainFragment, SavedStateViewModelFactory)’\n\
  \n此语法错误是错误的，可以忽略。应用程序仍然可以成功编译并运行。\n\n完成更改后，构建并运行应用，然后进行货币转换。当屏幕 UI 填充了美元和欧元值时，将应用置于后台，使用\
  \ `adb` 工具终止它，然后从设备或模拟器屏幕上重新启动它。重启后，之前的货币金额仍然显示在 `TextView` 和 `EditText` 组件中，这证明了状态已成功保存并恢复。\n\
  \n## 37 总结\n\n一个设计良好的应用程序在从后台恢复时，始终应该向用户呈现相同的状态，无论包含应用程序的进程在此期间是否被操作系统终止。处理 `ViewModels`\
  \ 时，可以通过利用 `ViewModel Saved State` 模块来实现这一点。这涉及修改 `ViewModel` 构造函数以接收 `SavedStateHandle`\
  \ 实例，该实例可以通过一系列方法调用来保存和恢复数据值。在创建 `ViewModel` 实例时，必须传递一个 `SavedStateViewModelFactory`\
  \ 实例。一旦实现了这些步骤，应用程序将在后台终止期间自动保存并恢复状态。\n\n## 38 与感知生命周组件工作\n\n之前名为“理解 Android 应用和\
  \ Activity 生命周期`的章节描述了使用生命周期方法来跟踪 UI 控制器（如 activity 或 fragment）内部生命周期状态的变化。这些方法的主要问题之一是它们将处理生命周期变化的负担交给了\
  \ UI 控制器。从表面上看，这似乎是逻辑方法，因为 UI 控制器毕竟是经历状态更改的对象。但事实上，通常受状态更改影响的代码始终位于应用中的其他类中。这导致了\
  \ UI 控制器代码变得复杂。本章引入了使 Android 应用能够构建生命周期感知能力的术语和关键组件。\n\n### 38.1 生命周期感知\n\n如果一个对象能够检测并响应其他对象生命周期状态的变化，则说它是感知生命周期的。某些\
  \ Android 组件（以 `LiveData` 为一个主要的例子）已经是感知生命周期的。通过实现 `LifecycleObserver` 接口，也可以配置任何类为感知生命周期。\n\
  \n### 38.2 生命周期所有者\n\n感知生命周期组件只能观察作为生命所有者的对象的状态。生命所有者实现 `LifecycleOwner` 接口，并被分配一个伴的\
  \ `Lifecycle` 对象，该对象负责存储组件的当前状态并向生命周期观察者提供状态信息。大多数标准的 Android Framework 组件（如 activity\
  \ 和 fragment 类）都是生命所有者。自定义类也可以通过使用 `LifecycleRegistry` 类并实现 `LifecycleOwner` 接口来配置为生命所有者。例如：\n\
  \n```java\npublic class SampleOwner implements LifecycleOwner {\n    private LifecycleRegistry\
  \ lifecycleRegistry;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        lifecycleRegistry = new\
  \ LifecycleRegistry(this);\n    }\n\n    @NonNull\n    @Override\n    public Lifecycle\
  \ getLifecycle() {\n        return lifecycleRegistry;\n    }\n}\n```\n\n除非生命所有者是另一个感知生命周期组件的子类，否则该类需要通过调用\
  \ `LifecycleRegistry` 类的方法自己触发生命周期状态更改。可以使用 `markState()` 方法通过传递新的状态值来触发生命周期状态更改：\n\
  \n```java\npublic void resuming() {\n    lifecycleRegistry.markState(Lifecycle.State.RESUMED);\n\
  }\n```\n\n\n\n\n\n上述调用将导致调用相应的事件处理程序。或者，也可以调用 `LifecycleRegistry.handleLifecycleEvent()`\
  \ 方法并传递要触发的生命周期事件（这将导致生命周期状态改变）。\n\n```\nlifecycleRegistry.handleLifecycleEvent(Lifecycle.Event.ON_START);\n\
  ```\n\n## 38.3 生命周期周期观察者 (Lifecycle Observers)\n\n为了让感知生命周期的组件观察生命周期所有者的状态，它必须实现\
  \ `DefaultLifecycleObserver` 接口，并对它需要观察的任何生命周期变化事件重写方法。\n\n```java\npublic class\
  \ SampleObserver implements DefaultLifecycleObserver {\n    // 生命周期事件方法重写在这里\n}\n\
  ```\n\n随后，创建该观察者类的实例，并将其添加到由 `Lifecycle` 对象维护的观察者列表中。\n\n```java\ngetLifecycle().addObserver(new\
  \ SampleObserver());\n```\n\n如果观察者不再需要跟踪生命周期状态，也可以随时从 `Lifecycle` 对象中移除。\n\n图 38-1\
  \ 展示了提供生命周期感知能力的关键元素之间的关系：\n\n![](img/lifecycle_component_diagram.jpg)\n\n图 38-1\n\
  \n## 38.4 生命周期状态与事件\n\n当生命周期所有者的状态发生变化时，指定的 `Lifecycle` 对象将更新为新状态。在任何时刻，生命周期所有者都处于以下五种状态之一：\n\
  \n- `Lifecycle.State.INITIALIZED`\n- `Lifecycle.State.CREATED`\n- `Lifecycle.State.STARTED`\n\
  - `Lifecycle.State.RESUMED`\n- `Lifecycle.State.DESTROYED`\n\n随着组件在不同状态之间转换，`Lifecycle`\
  \ 对象将对任何已添加到列表的观察者触发事件。在生命周期观察者中，可以重写以下可用事件方法：\n\n- `onCreate()`\n- `onResume()`\n\
  - `onPause()`\n- `onStop()`\n- `onStart()`\n- `onDestroy()`\n\n例如，以下代码重写了 `DefaultLifecycleObserver.onResume()`\
  \ 方法：\n\n```java\n@Override\npublic void onResume(@NonNull LifecycleOwner owner)\
  \ {\n    // 执行响应 Resume 状态事件的任务\n}\n```\n\n在图 38-2 中的流程图说明了生命周期所有者的状态变化序列，以及在每次状态转换之间触发在观察者上的生命周期事件：\n\
  \n![](img/android_lifecycle_states_diagram.jpg)\n\n图 38-2\n\n## 38.5 总结\n\n本章介绍了生命周期感知的基础，以及包含在\
  \ Android Jetpack 中的 Android Lifecycle 包类和接口。该包包含许多用于创建生命周期所有者、生命周期观察者和感知生命周期组件的类和接口。生命周期所有者分配了一个\
  \ `Lifecycle` 对象，该对象维护所有者状态的记录和订阅观察者列表。当所有者的状态发生变化时，会通过生命周期事件方法通知观察者，以便其对变化做出响应。\n\
  \n下一章将创建一个 Android Studio 项目，演示如何使用和创建感知生命周期的组件，包括创建生命周期观察者和所有者，以及对生命周期状态变化和事件的处理。\n\
  \n## 39. Android Jetpack 生命周期周期感知教程\n\n上一章提供了生命周期感知的概述，并概述了在 Android 应用项目内实现此点的关键类和接口。本章将基于这些知识基础，通过构建一个\
  \ Android Studio 项目，旨在突出生命周期感知的实际应用。\n\n### 39.1 创建示例生命周期项目\n\n从欢迎屏幕选择“New Project”快速启动选项，在弹出的新项目对话框中，点击“Next”按钮之前，选择\
  \ `Fragment + ViewModel` 模板。\n\n在 `Name` 字段中输入 `LifecycleDemo`，并指定 `com.ebookfrenzy.lifecycledemo`\
  \ 为包名。在点击“Finish”按钮之前，将“Minimum API level”设置设置为 `API 26: Android 8.0 (Oreo)`，并将语言菜单设置为\
  \ `Java`。\n\n### 39.2 创建生命周期观察者\n\n如之前讨论的，activity 和 fragment 已经实现了 `LifecycleOwner`\
  \ 接口，并准备好被其他对象观察。为了在实践中看到这一点，教程的下一步是向项目中添加新类，该类能够观察 `MainFragment` 实例。\n\n要添加新类，在\
  \ Project 工具窗口中右键点击 `app` -> `java` -> `com.ebookfrenzy.lifecycledemo`，并从菜单中选择 `New`\
  \ -> `Java Class...`。在新类对话框中，将类命名为 `DemoObserver` 并按键盘回车键创建 `DemoObserver.java`\
  \ 文件。新文件应自动在编辑器中打开，其内容如下：\n\n```java\npackage com.ebookfrenzy.lifecycledemo;\n\n\
  public class DemoObserver {\n}\n```\n\n留在编辑器中，修改类文件以声明它将实现 `DefaultLifecycleObserver`\
  \ 接口：\n\n```java\npackage com.ebookfrenzy.lifecycledemo;\n\nimport androidx.lifecycle.DefaultLifecycleObserver;\n\
  \npublic class DemoObserver implements DefaultLifecycleObserver {\n}\n```\n\n下一步是重写\
  \ `DefaultLifecycleObserver` 类的生命周期方法。在本示例中，所有事件都将进行处理，每个事件向 Logcat 面板输出一条消息显示事件类型。按照以下列表更新观察者类：\n\
  \n```java\npackage com.ebookfrenzy.lifecycledemo;\n\nimport android.util.Log;\n\
  import androidx.annotation.NonNull;\nimport androidx.lifecycle.LifecycleOwner;\n\
  \n...\n\npublic class DemoObserver implements DefaultLifecycleObserver {\n    private\
  \ String LOG_TAG = \"DemoObserver\";\n\n    @Override\n    public void onCreate(@NonNull\
  \ LifecycleOwner owner) {\n        Log.i(LOG_TAG, \"onCreate\");\n    }\n\n    @Override\n\
  \    public void onResume(@NonNull LifecycleOwner owner) {\n        Log.i(LOG_TAG,\
  \ \"onResume\");\n    }\n\n    @Override\n    public void onPause(@NonNull LifecycleOwner\
  \ owner) {\n        Log.i(LOG_TAG, \"onPause\");\n    }\n\n    @Override\n    public\
  \ void onStart(@NonNull LifecycleOwner owner) {\n        Log.i(LOG_TAG, \"onStart\"\
  );\n    }\n\n    @Override\n    public void onStop(@NonNull LifecycleOwner owner)\
  \ {\n        Log.i(LOG_TAG, \"onStop\");\n    }\n\n    @Override\n    public void\
  \ onDestroy(@NonNull LifecycleOwner owner) {\n        Log.i(LOG_TAG, \"onDestroy\"\
  );\n    }\n}\n```\n\n完成 DemoObserver 类后，下一步是将其作为观察者添加到 `MainFragment` 类中。\n\n###\
  \ 39.3 添加观察者\n\n观察者通过调用所有者 `Lifecycle` 对象的 `addObserver()` 方法添加到生命周期所有者，该对象通过调用\
  \ `getLifecycle()` 方法获取。编辑 `MainFragment.java` 类文件并重写 `onViewCreated()` 生命周期方法以添加观察者：\n\
  \n```java\n...\nimport com.ebookfrenzy.lifecycledemo.DemoObserver;\n...\n\n@Override\n\
  public void onViewCreated(@NonNull View view, @Nullable Bundle savedInstanceState)\
  \ {\n    super.onViewCreated(view, savedInstanceState);\n    getLifecycle().addObserver(new\
  \ DemoObserver());\n}\n```\n\n创建观察者类并添加到生命周期所有者对象后，应用已准备好进行测试。\n\n### 39.4 测试观察者\n\
  \n由于 DemoObserver 类将诊断信息输出到 Logcat 控制台，如果配置过滤器只显示 DemoObserver 消息，将更容易看到输出。按照之前在“Android\
  \ Activity 状态变化示例中概述的步骤，显示 Logcat 面板并在过滤器字段中输入以下键：\n\n`package:mine tag:DemoObserver`\n\
  \n成功启动应用后，Logcat 输出应指示以下生命周期状态变化和事件：\n\n- onCreate\n- onStart\n- onResume\n\n在应用运行时，执行设备旋转以触发\
  \ fragment 的销毁和重建，产生以下额外的输出：\n\n- onPause\n- onStop\n\n\n\n\n\n`onDestroy`\n`onCreate`\n\
  `onStart`\n`onResume`\n\n在进入本章的下一节之前，请花些时间将应用程序的输出与上一章中图 38-2 的流程图进行对比。\n\n## 39.5\
  \ 创建生命周期所有者 (Lifecycle Owner)\n\n本章最后一个任务是创建一个自定义生命周期所有者类，并演示如何在该类内部触发事件并修改生命周期状态。\n\
  \n在项目窗口中右键点击 app -> `java` -> `com.ebookfrenzy.lifecycledemo` 条目，选择 `New` -> `Java\
  \ Class...` 菜单选项。在 `Create Class` 对话框中将类命名为 `DemoOwner`，然后按回车键。当新的 `DemoOwner.java`\
  \ 文件加载到代码编辑器后，对其进行如下修改：\n\n```java\npackage com.ebookfrenzy.lifecycledemo;\n\nimport\
  \ androidx.lifecycle.Lifecycle;\n\nimport androidx.lifecycle.LifecycleOwner;\n\n\
  import androidx.lifecycle.LifecycleRegistry;\n\nimport androidx.annotation.NonNull;\n\
  \npublic class DemoOwner implements LifecycleOwner {\n\n}\n```\n\n该类需要一个用自身引用初始化的\
  \ `LifecycleRegistry` 实例，以及一个配置为返回 `LifecycleRegistry` 实例的 `getLifecycle()` 方法。声明一个变量来存储\
  \ `LifecycleRegistry` 引用，一个初始化 `LifecycleRegistry` 实例的构造函数并添加 `getLifecycle()` 方法：\n\
  \n```java\npublic class DemoOwner implements LifecycleOwner {\n\n    private final\
  \ LifecycleRegistry lifecycleRegistry;\n\n    public DemoOwner() {\n        lifecycleRegistry\
  \ = new LifecycleRegistry(this);\n    }\n\n    @NonNull\n    @Override\n    public\
  \ Lifecycle getLifecycle() {\n        return lifecycleRegistry;\n    }\n}\n```\n\
  \n接下来，该类需要通知注册表生命周期状态的变化。这可以通过使用 `LifecycleRegistry` 对象的 `markState()` 方法标记状态，或者通过\
  \ `handleLifecycleEvent()` 方法触发生命周期事件来实现。自定义类的状态变化取决于类的用途。在本示例中，我们将添加一些方法，在调用时简单地触发生命周期事件：\n\
  \n```java\nprivate final LifecycleRegistry lifecycleRegistry;\n\n    public void\
  \ startOwner() {\n        lifecycleRegistry.handleLifecycleEvent(Lifecycle.Event.ON_START);\n\
  \    }\n\n    public void stopOwner() {\n        lifecycleRegistry.handleLifecycleEvent(Lifecycle.Event.ON_STOP);\n\
  \    }\n\n    @NonNull\n    @Override\n    public Lifecycle getLifecycle() {\n \
  \       return lifecycleRegistry;\n    }\n```\n\n`DemoOwner` 类中的最后一个更改是添加 `DemoObserver`\
  \ 类作为观察者。此调用通过向类中添加以下构造函数来实现：\n\n```java\npublic DemoOwner() {\n    lifecycleRegistry\
  \ = new LifecycleRegistry(this);\n    getLifecycle().addObserver(new DemoObserver());\n\
  }\n```\n\n将 `MainFragment.java` 文件加载到代码编辑器，找到 `onViewCreated()` 方法并添加代码创建 `DemoOwner`\
  \ 类的实例并调用 `startOwner()` 和 `stopOwner()` 方法。同时注意，添加 `DemoObserver` 作为观察者的调用已被移除。虽然单个观察者可以用于多个所有者，但在情况下将其移除是为了避免在\
  \ Logcat 工具窗口中产生重复且混淆的输出：\n\n```java\nimport com.ebookfrenzy.lifecycledemo.DemoOwner;\n\
  \nprivate DemoOwner demoOwner;\n\n@Override\npublic void onViewCreated(@NonNull\
  \ View view, @Nullable Bundle savedInstanceState) {\n    super.onViewCreated(view,\
  \ savedInstanceState);\n    demoOwner = new DemoOwner();\n    demoOwner.startOwner();\n\
  \    demoOwner.stopOwner();\n    getLifecycle().addObserver(new DemoObserver());\n\
  }\n```\n\n## 39.6 测试自定义生命周期所有者\n\n构建并运行应用，查看 Logcat 工具窗口以确认观察者检测到的创建、启动和停止生命周期事件顺序：\n\
  \n`onCreate`\n`onStart`\n`onStop`\n\n注意，“创建”状态即使没有手动添加到 `DemoOwner` 类也触发了。事实上，这些是在\
  \ `ON_STOP` 事件处理触发的。\n\n### 39.7 总结\n\n本章演示了在 Android 应用中实现生命周期感知的步骤。这包含了生命周期观察者的创建以及基础生命周期所有者类的设计与实现。\n\
  \n## 40. 导航组件概述\n\n如今的 Android 应用很少由单个屏幕组成。事实上，大多数应用包含多个屏幕，用户通过手势和点击在屏幕间导航。在引入 Android\
  \ Jetpack 之前，应用内部的导航很大程度上是一个手动过程。然而，随着导航图的引入，这种情况得到了显著改善。\n\n### 40.1 理解导航\n\n每个应用都有主屏幕（启动屏是应用加载时临时显示的屏幕）。从主屏幕开始，用户通常会执行会导致其他屏幕的任务。这些屏幕通常以其他\
  \ Activity 的形式存在。例如，一个消息应用可能有一个列出当前消息的主屏幕，用户可以导航到联系人列表或设置屏幕。联系人列表屏幕允许用户导航到可以添加新用户或更新现有联系人的屏幕。应用的导航可以如图\
  \ 40-1 所示：\n\n(image/navigation_graph_diagram.jpg)\nFigure 40-1\n\n构成应用的每个屏幕被称为目的地，通常是\
  \ Fragment 或 Activity。导航架构使用导航栈来跟踪用户通过目的地的路径。当应用首次启动时，主屏幕是第一个放入栈中的目的地并成为当前目的地。当用户导航到另一个目的地时，该屏幕成为当前目的地并推入栈。图\
  \ 40-2 展示了假设消息应用在用户启动应用并导航到“添加联系人”屏幕后导航栈的当前状态：\n\n(image/navigation_stack_diagram.jpg)\n\
  Figure 40-2\n\n当用户使用系统返回键导航回屏幕时，每个目的地都会从栈中弹出，直到主屏幕再次成为栈上的唯一目的地。在图 40-3 中，用户已从添加联系人屏幕返回，将其从栈中弹出并使联系人列表屏幕成为当前目的地：\n\
  \n(image/navigation_stack_pop_diagram.jpg)\nFigure 40-3\n\n在目的地之间导航和管理导航栈的所有工作都由导航控制器处理，由\
  \ `NavController` 类表示。\n\n### 40.2 声明导航主机\n\n\n\n\n\n导航宿（Navigation host）仅仅是一个特殊的片段（`NavHostFragment`），它嵌入到\
  \ activity 的用户界面布局中，作为用户导航的目的地的占位符。例如，图 40-4 显示了一个典型的 activity 屏幕，并突出了由导航宿片段代表的区域：\n\
  \n![](img/jetpack_navigation_navhost.jpg)\n\n图 40-4\n\n可以通过 Android Studio 布局编辑器从调面板的容器（Containers）部分拖放实例，或者通过如下方式手动编辑\
  \ XML，将 `NavHostFragment` 放入 activity 布局中：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<FrameLayout xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\"\n    android:id=\"@+id/container\"\n    android:layout_width=\"\
  match_parent\"\n    android:layout_height=\"match_parent\"\n    tools:context=\"\
  .MainActivity\" >\n    <androidx.fragment.app.FragmentContainerView\n        android:id=\"\
  @+id/demo_nav_host_fragment\"\n        android:name=\"androidx.navigation.fragment.NavHostFragment\"\
  \n        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  match_parent\"\n        app:defaultNavHost=\"true\"\n        app:navGraph=\"@navigation/navigation_graph\"\
  \ />\n</FrameLayout>\n```\n\n上述导航宿片段元素中的注意点是：`name` 属性对 `NavHostFragment` 的引用、`defaultNavHost`\
  \ 设置为 `true` 以及将包含导航图的文件分配给 `navGraph` 属性。\n\n当 activity 启动时，此导航宿片段将被导航图中指定的首页目的地替换。当用户在应用屏幕之间进行时时，宿片段将被对应目的地的相应片段替换。\n\
  \n## 40.3 导航图\n\n导航图是一个 XML 文件，包含了将包含应用导航中的目的地。除了这些目的地外，该文件还包含了定义目的地之间导航的导航动作（actions），以及用于从一个目的地传递数据到另一个目的地的可选参数。Android\
  \ Studio 包含一个导航图编辑器，可用于可视化地设计图或通过手动编辑 XML 来实现动作。\n\n图 40-5 显示了设计模式下的 Android Studio\
  \ 导航图编辑器：\n\n![](img/as_4.1_navigation_graph_editor.jpg)\n\n图 40-5\n\n目的地列表 (A)\
  \ 提供了图中当前包含的所有目的地的列表。从列表中选择一个目的地将定位并选中图中对应的目的地（这对于在大型图中定位特定目的地特别有用）。导航图面板 (B) 包含每个目的地的一个对话框，显示了用户界面布局的表示。在示例中，此图包含两个命名为\
  \ `mainFragment` 和 `secondFragment` 的目的地。目的地之间的箭头 (C) 代表导航动作连接。可以通过将鼠标指针悬停在起点边缘直到出现一个圆圈，然后点击并从圆圈拖动到目的地来添加动作。属性面板\
  \ (D) 允许查看和修改当前所选目的地或动作连接的属性。在上面的图中，显示了动作的属性。通过点击标记为 E 的按钮并从菜单中选择选项可以添加新目的地。提供的选项可以将现有的片段或\
  \ activity 作为目的地，或者创建新的空白片段目的地。组件树面板 (F) 提供了导航图的层级概览。\n\n通过将编辑器切换到代码模式可以查看和修改导航图的底层\
  \ XML。以下 XML 列表表示了上方 图 40-5 所示目的地和动作连接的导航图：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<navigation xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\"\n    android:id=\"@+id/navigation_graph\"\n \
  \   app:startDestination=\"@id/mainFragment\">\n    <fragment\n        android:id=\"\
  @+id/mainFragment\"\n        android:name=\"com.ebookfrenzy.navigationdemo.ui.main.MainFragment\"\
  \n        android:label=\"fragment_main\"\n        tools:layout=\"@layout/fragment_main\"\
  >\n        <action\n            android:id=\"@+id/goToSecond\"\n            app:destination=\"\
  @id/secondFragment\" />\n    </fragment>\n    <fragment\n        android:id=\"@+id/secondFragment\"\
  \n        android:name=\"com.ebookfrenzy.navigationdemo.ui.second.SecondFragment\"\
  \n        android:label=\"fragment_second\"\n        tools:layout=\"@layout/fragment_second\"\
  \ />\n</navigation>\n```\n\n## 40.4 访问导航控制器\n\n从一个目的地到另一个目的地的导航通常是为了响应应用内的某种事件，例如按钮点击或菜单选择。在触发导航动作之前，代码必须先获取导航控制器实例的引用。这需要调用\
  \ `Navigation` 或 `NavHostFragment` 类的 `findNavController()` 方法。例如，以下代码可以用于访问 activity\
  \ 的导航控制器。注意，为了使代码生效，activity 必须包含一个导航宿：\n\n```java\nNavController controller = Navigation.findNavController(activity,\
  \ R.id.demo_nav_host_fragment);\n```\n\n在这种情况下，方法传递了 activity 的引用和嵌入在 activity 布局中的\
  \ `NavHostFragment` 的 ID。\n\n或者，可以通过将任何视图传递给方法来识别与视图关联的导航控制器：\n\n```java\nNavController\
  \ controller = Navigation.findNavController(binding.button);\n```\n\n最后一种选项通过调用\
  \ `NavHostFragment` 类的 `findNavController()` 方法并传递片段的引用来查找片段的导航控制器：\n\n```java\n\
  NavController controller = NavHostFragment.findNavController(fragment);\n```\n\n\
  ## 40.5 触发导航动作\n\n一旦找到控制器，就可以调用控制器的 `navigate()` 方法并传递要执行动作的资源 ID 来触发动作。例如：\n\n\
  ```java\ncontroller.navigate(R.id.goToContactsList);\n```\n\n动作的 ID 在选择动作连接时在导航图编辑器的属性面板中定义。\n\
  \n## 40.6 传递参数\n\n在导航动作期间，可以使用导航图文件中定义的参数将数据从一个目的地传递到另一个目的地。参数由名称、类型和可选的默认值组成，可以在\
  \ XML 中手动添加，也可以在图中选择动作箭头或目的地时使用属性面板添加。例如，在图 40-6 中，定义了一个命名为 `contactsCount` 默认值为\
  \ 0 的整数参数：\n\n![](img/jetpack_navigation_action.jpg)\n\n图 40-6\n\n\n\n\n一旦添加，参数将放置在接收端的\
  \ XML 元素中，例如：\n\n```xml\n<fragment\n    android:id=\"@+id/secondFragment\"\n   \
  \ android:name=\"com.ebookfrenzy.navigationdemo.SecondFragment\"\n    android:label=\"\
  fragment_second\"\n    tools:layout=\"@layout/fragment_second\" >\n    <argument\n\
  \        android:name=\"contactsCount\"\n        android:defaultValue=0\n      \
  \  app:type=\"integer\" />\n</fragment>\n```\n\n导航架构组件（Navigation Architecture Component）提供了两种在目的地之间传递数据的技术。一种方法是将数据放入一个\
  \ `Bundle` 对象中，并在操作（action）期间将其传递给目的地，然后在那里进行解包（unbundled）并提取参数。\n\n这种特定方法的主要缺点是它不是“类型安全的”（type\
  \ safe）。换句话说，如果接收端将参数处理为与声明不同的类型（例如，将字符串视为整数），编译器将不会捕获此种错误，并且可能会在运行时引起问题。\n\n更好的选项（也是本书中所采用的方法）是使用\
  \ `safeargs`。`safeargs` 是 Android Studio Gradle 构建系统的一个插件，它可以自动生成特殊的类，允许以类型安全的方式传递参数。`safeargs`\
  \ 的参数传递方法将在下一章中描述和演示（“Android Jetpack 导航组件教程”）。\n\n### 40.7 总结\n\n在 Android 应用用户界面背景下，“导航”（Navigation）一词指的是用户在不同屏幕之间来回移动的能力。曾经这种实现非常耗时且难以组织，而\
  \ Android Studio 和导航架构组件现在使得在 Android 应用项目中实现和管理导航变得更加简单。\n\n应用内部的不同屏幕被称为目的地（destinations），通常由片段（fragments）或活动（activities）表示。所有应用都有一个主页（home\
  \ destination），包括应用首次加载时显示的屏幕。该布局的内容区域被导航宿主片段（navigation host fragment）取代，当用户导航应用时，该片段会切换为其他目的地片段。导航路径由导航图文件定义，该文件由目的地以及连接它们的操作（actions）组成，并包含要在在目的地之间传递的任何参数。导航由导航控制器（navigation\
  \ controllers）处理，它们除了管理导航栈外，还提供了从应用代码内部启动导航操作的方法。\n\n## 41. Android Jetpack 导航组件教程\n\
  \n上一章描述了 Android Jetpack 导航组件以及它如何与 Android Studio 的导航绘图功能集成，从而为实现 Android 应用屏幕之间的导航提供了一种简单的方法。在本章中，将创建一个新的\
  \ Android Studio 项目，利用这些导航功能来实现一个包含多个屏幕的示例应用。除了演示 Android Studio 导航图编辑器的使用外，示例项目还将实现使用类型安全参数在源屏幕和目的地屏幕之间传递数据。\n\
  \n### 41.1 创建 NavigationDemo 项目\n\n从欢迎界面选择新建项目（New Project）选项，在出现的新项目对话框中，点击下一步（Next）按钮之前，选择\
  \ Fragment + ViewModel 模板。\n\n在 Name 字段中输入 `NavigationDemo` 并指定 `com.ebookfrenzy.navigationdemo`\
  \ 为包名。在点击完成（Finish）按钮之前，将最低 API 级别设置改为 `API 26`：Android 8.0 (Oreo)，并将语言菜单设置为 Java。\n\
  \n### 41.2 向构建配置中添加导航\n\n新的 Android Studio 项目默认不会在构建配置文件中包含导航组件库。因此，在执行任何其他任务之前，第一步是修改应用层级的\
  \ `build.gradle` 文件。在项目工具窗口中找到此文件（Gradle Scripts -> `build.gradle (Module :app)`），双击它将其加载到代码编辑器中，并修改依赖部分以添加导航库。同时也利用此机会为此模块启用视图绑定（view\
  \ binding）：\n\n```gradle\nandroid {\n    buildFeatures {\n        viewBinding true\n\
  \    }\n}\n\ndependencies {\n    implementation 'androidx.navigation:navigation-fragment:2.5.3'\n\
  \    implementation 'androidx.navigation:navigation-ui:2.5.3'\n}\n```\n\n注意，自本书出版以来，这些库可能已发布更新版本。在文件中添加导航依赖项后，点击\
  \ Sync Now 链接以重新同步项目的构建配置。\n\n### 41.3 创建导航图资源文件\n\n在构建配置中添加了导航库后，现在可以向项目添加导航图资源文件了。正如“导航架构组件概述”所述，这是一个\
  \ XML 文件，包含了用户将能够导航的片段和活动，以及执行转换的操作和在目的地之间传递的任何数据。\n\n在 Project 工具窗口中，找到 `res` 文件夹（app\
  \ -> res），右键点击它并选择 New -> Android Resource File 菜单项：\n\n![](img/as_3.2_navigation_new_resource_menu.jpg)\n\
  \n图 41-1\n\n选择菜单项后，会出现 New Resource File 对话框。在此对话框中，将文件命名为 `navigation_graph`，并在图\
  \ 41-2 所示将 Resource type 菜单改为 Navigation，然后点击 OK 按钮创建文件。\n\n![](img/as_3.2_navigation_resource_file.jpg)\n\
  \n图 41-2\n\n将导航图资源文件添加到项目后，它将出现在主面板中，准备添加新的目的地。将编辑器切换到 Code 模式，并在添加任何目的地之前检查图的 XML：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<navigation xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    android:id=\"@+id/navigation_graph\">\n\n</navigation>\n```\n\n切换回编辑器的 Design\
  \ 模式，注意 Destinations 面板的 Host 部分显示项目内未检测到任何宿主片段：\n\n![](img/as_4.1_navigation_hosts.jpg)\n\
  \n图 41-3\n\n在向导航图添加任何目的地之前，下一步是向项目添加一个导航宿主片段（navigation host fragment）。\n\n### 41.4\
  \ 声明导航宿主\n\n对于此项目而言，导航宿主片段将包含在主活动的用户界面布局中。这意味着导航图中的目的地片段将出现在主活动的内容区域，该区域目前由 `fragment_main.xml`\
  \ 布局占据。在 Project 工具窗口中找到主活动布局文件（app -> res -> layout -> `activity_main.xml`）并将其加载到布局编辑器工具中。\n\
  \n在布局器的 Design 模式下，从调色板（Palette）的 Containers 部分拖出一个 `NavHostFragment` 元素，并将其丢到活动布局的内容区域，如图\
  \ 41-4 中的箭头所示：\n\n![](img/as_3.6_add_navhostfragment.jpg)\n\n图 41-4\n\n选择菜单项后，在出现的\
