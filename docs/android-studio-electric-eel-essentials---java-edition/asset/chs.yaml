  \ `BoundService` 类当前实例的引用。创建了 `MyLocalBinder` 类的新实例并将其赋值给 `myBinder` `IBinder` 引用（由于\
  \ `Binder` 是 `IBinder` 的子类，因此在此赋值中不存在类型不匹配的问题）。\n\n接下来，需要修改 `onBind()` 方法以返回 `myBinder`\
  \ 对象的引用，并实现一个新的公共方法，以便在任何绑定到服务的客户端调用它时能够返回当前时间：\n\n```java\npackage com.ebookfrenzy.localbound;\n\
  \nimport java.text.SimpleDateFormat;\nimport java.util.Date;\nimport java.util.Locale;\n\
  import android.app.Service;\nimport android.content.Intent;\nimport android.os.IBinder;\n\
  import android.os.Binder;\n\npublic class BoundService extends Service {\n    private\
  \ final IBinder myBinder = new MyLocalBinder();\n\n    public BoundService() {\n\
  \    }\n\n    @Override\n    public IBinder onBind(Intent intent) {\n        return\
  \ myBinder;\n    }\n\n    public String getCurrentTime() {\n        SimpleDateFormat\
  \ dateformat =\n                new SimpleDateFormat(\"HH:mm:ss MM/dd/yyyy\",\n\
  \                        Locale.US);\n        return (dateformat.format(new Date()));\n\
  \    }\n\n    public class MyLocalBinder extends Binder {\n        BoundService\
  \ getService() {\n            return BoundService.this;\n        }\n    }\n}\n```\n\
  \n此时，绑定的服务已经完成，并准备好添加到项目清单文件中。在项目（Project）工具窗口中找到并双击 `LocalBound` 项目的 `AndroidManifest.xml`\
  \ 文件，一旦加载到清单编辑器（Manifest Editor）中，请验证 Android Studio 是否已按照所示方式为该服务添加了 `<service>`\
  \ 条目：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    package=\"com.ebookfrenzy.localbound.localbound\"\
  \ >\n    <application\n        android:allowBackup=\"true\"\n        android:icon=\"\
  @mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\n        android:theme=\"\
  @style/AppTheme\" >\n        <service\n            android:name=\".BoundService\"\
  \n            android:enabled=\"true\"\n            android:exported=\"true\" >\n\
  \        </service>\n        <activity\n            android:name=\".MainActivity\"\
  \ >\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\"\
  \ />\n                <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n            </intent-filter>\n        </activity>\n</application>\n</manifest>\n\
  ```\n\n下一阶段是在 activity 中实现必要的代码，以绑定到服务并调用 `getCurrentTime()` 方法。\n\n### 57.6 将客户端绑定服务\n\
  \n对于本教程而言，客户端是运行应用程序的 `MainActivity` 实例。如前所述，为了成功绑定到服务并接收服务 `onBind()` 方法返回的 `IBinder`\
  \ 对象，有必要创建一个 `ServiceConnection` 子类并实现 `onServiceConnected()` 和 `onServiceDisconnected()`\
  \ 方法。编辑 `MainActivity.java` 文件并进行如下修改：\n\n```java\npackage com.ebookfrenzy.localbound;\n\
  import androidx.appcompat.app.AppCompatActivity;\nimport android.os.Bundle;\nimport\
  \ android.os.IBinder;\nimport android.content.Context;\nimport android.content.Intent;\n\
  import android.content.ComponentName;\nimport android.content.ServiceConnection;\n\
  import com.ebookfrenzy.localbound.BoundService.MyLocalBinder;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    BoundService myService;\n    boolean isBound\
  \ = false;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \    }\n\n    final ServiceConnection myConnection = new ServiceConnection() {\n\
  \        @Override\n        public void onServiceConnected(ComponentName className,\
  \ IBinder service) {\n            MyLocalBinder binder = (MyLocalBinder) service;\n\
  \            myService = binder.getService();\n            isBound = true;\n   \
  \     }\n\n        @Override\n        public void onServiceDisconnected(ComponentName\
  \ name) {\n            isBound = false;\n        }\n    };\n}\n```\n\n当客户端成功绑定到服务时，将调用\
  \ `onServiceConnected()` 方法。该方法通过参数传递由服务的 `onBind()` 方法返回的 `IBinder` 对象。该参数被强制转换为\
  \ `MyLocalBinder` 类型，然后调用 binder 对象的 `getService()` 方法以获取服务实例的引用，该引用随后被赋值给 `myService`。使用一个布尔标志来指示连接已成功建立。\n\
  \n当连接结束时，会调用 `onServiceDisconnected()` 方法，它仅简单将布尔标志设置为 `false`。\n\n建立连接后，下一步是修改\
  \ activity 以绑定到服务。这涉及创建一个 `intent` 并调用 `bindService()` 方法，这些操作可以在 activity 的 `onCreate()`\
  \ 方法中完成：\n\n```java\n@Override\npublic void onCreate(Bundle savedInstanceState)\
  \ {\n    super.onCreate(savedInstanceState);\n    setContentView(R.layout.activity_main);\n\
  \    Intent intent = new Intent(this, BoundService.class);\n    bindService(intent,\
  \ myConnection, Context.BIND_AUTO_CREATE);\n}\n```\n\n### 57.7 完成示例\n\n剩下的实现调用 `getCurrentTime()`\
  \ 方法并将结果显示给用户的机制。按照惯例，Android Studio 为 activity 创建了一个仅包含 `TextView` 的模板 `activity_main.xml`\
  \ 文件。将此文件加载到布局编辑器中，使用设计模式选择 `TextView` 组件并将 ID 更改为 `myTextView`。在 `TextView` 下方添加一个\
  \ `Button` 视图并将按钮文本更改为“Show Time”，将其提取为名为 `show_time` 的字符串资源。完成这些更改后，布局应类似于图所示。如果缺少任何约束，点击布局编辑器工具栏上的“推断约束”按钮。\n\
  \n![](img/as_4.1_local_bound_ui.jpg)\n\n图 57-1\n\n通过选择 `Button` 并配置 `onClick` 属性调用名为\
  \ `showTime` 的方法来完成用户界面设计。\n\n最后，编辑 `MainActivity.java` 文件中的代码以实现 `showTime()` 方法。该方法简单地调用服务的\
  \ `getCurrentTime()` 方法（由于 `onServiceConnected()` 方法，现在可以通过 `myService` 引用从 activity\
  \ 调用），并将结果字符串赋值给 `TextView`：\n\n```java\npackage com.ebookfrenzy.localbound;\n//\
  \ ...\nimport android.widget.TextView;\nimport android.view.View;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n    BoundService myService;\n    boolean\
  \ isBound = false;\n\n    public void showTime(View view) {\n        String currentTime\
  \ = myService.getCurrentTime();\n        TextView myTextView = findViewById(R.id.myTextView);\n\
  \        myTextView.setText(currentTime);\n    }\n}\n```\n\n### 57.8 测试应用程序\n\n\n\
  \n\n代码更改完成后，对应用程序进行测试运行。界面显示后，点击按钮并注意文本视图更改为显示当前日期和时间。示例已成功启动并绑定到服务，然后调用了该服务的方法以执行任务并将结果返回给\
  \ activity。\n\n### 57.9 总结\n\n当绑定的服务是本地的且对某个应用程序私有时，该应用程序内的组件就可以与服务进行交互，而无需诉助于进程间通信（IPC）。通常情况下，服务的\
  \ `onBind()` 方法返回一个 `IBinder` 对象，该对象包含指向正在运行的服务实例的引用。客户端组件实现一个 `ServiceConnection`\
  \ 子类，该子类包含回调方法，这些方法会在服务连接和断开时被调用。前一个方法接收由 `onBind()` 方法返回的 `IBinder` 对象，从而允许调用服务中的公共方法。\n\
  \n在介绍了本地绑定服务的实现后，下一章将重点关注如何使用 IPC 与远程绑定服务进行交互。\n\n## 58. Android 远程绑定服务 – 示例\n\n\
  在本章关于 Android 服务的最后一章中，将开发一个示例应用程序，演示如何使用 `messenger` 和 `handler` 配置来促进客户端与远程绑定服务之间的交互。\n\
  \n### 58.1 客户端到远程服务的通信\n\n如上一章所述，客户端与本地服务之间的交互可以通过向客户端返回一个包含服务对象引用的 `IBinder` 对象来实现。然而，对于远程服务，这种方法并不行，因为远程服务运行在不同的进程中，因此无法从客户端直接访问。\n\
  \n对于远程服务，必须创建一个 `Messenger` 和 `Handler` 配置，允许消息跨越客户端和服务之间的进程边界进行传递。\n\n具体来说，服务会创建一个\
  \ `Handler` 实例，该实例在接收到来自客户端的消息时会被调用。在初始化方面，由 `Handler` 的职责是创建一个 `Messenger` 对象，该对象反过来又创建一个\
  \ `IBinder` 对象并在 `onBind()` 方法中返回给客户端。客户端使用此 `IBinder` 对象来创建 `Messenger` 对象的实例，随后将消息发送给服务处理器。客户端每发送一次消息，处理器的\
  \ `handleMessage()` 方法就会被调用，并传递该消息对象。\n\n本章中创建的示例将包含一个运行在单独进程中的 activity 和一个绑定服务。将使用\
  \ `Messenger/Handler` 机制向服务发送一个字符串，服务随后将在 `Logcat` 输出中显示该字符串。\n\n### 58.2 创建示例应用程序\n\
  \n从欢迎界面选择 `New Project` 选项，在生成的新项目对话框中选择 `Empty Activity` 模板，然后点击 `Next` 按钮。\n\n\
  在 `Name` 字段中输入 `RemoteBound` 并指定 `com.ebookfrenzy.remotebound` 为包名。在点击 `Finish`\
  \ 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将语言菜单更改为 `Java`。\n\
  \n### 58.3 设计用户界面\n\n在 Project 工具窗口中找到 `activity_main.xml` 文件并双击它将其加载到 Layout Editor\
  \ 工具中。在 Layout Editor 工具的 Design（设计）模式下，右键点击默认的 `TextView` 实例，选择 `Convert view...`\
  \ 菜单选项，从弹出的对话框中选择 `Button` 视图并点击 Apply。将按钮的 `text` 属性更改为“Send Message”，并将该字符串提取到名为\
  \ `send_message` 的新资源中。\n\n最后，配置 `onClick` 属性以调用名为 `sendMessage` 的方法。\n\n### 58.4\
  \ 实现远程绑定服务\n\n为了为此示例实现远程绑定服务，在 Project 工具窗口中右键点击包名（位于 `app -> java` 下）并选择 `New ->\
  \ Service -> Service` 菜单选项。指定 `RemoteService` 为类名，并在点击 `Finish` 创建类之前，确保勾选了 `Exported`\
  \ 和 `Enabled` 选项。\n\n下一步是为新服务实现处理器类（handler class）。这通过扩展 `Handler` 类并实现 `handleMessage()`\
  \ 方法来实现。该方法会在接收到来自客户端的消息时被调用。它将接收一个 `Message` 对象作为参数，包含客户端需要传递给服务的任何数据。在本例中，这将包含一个要显示给用户的字符串的\
  \ `Bundle` 对象。实现此后，`RemoteService.java` 文件中修改后的类应如下：\n\n```java\npackage com.ebookfrenzy.remotebound;\n\
  \nimport android.app.Service;\nimport android.content.Intent;\nimport android.os.IBinder;\n\
  import android.os.Bundle;\nimport android.os.Handler;\nimport android.os.Looper;\n\
  import android.os.Message;\nimport android.os.Messenger;\nimport android.util.Log;\n\
  \npublic class RemoteService extends Service {\n    public RemoteService() {\n\n\
  \    }\n\n    static class IncomingHandler extends Handler {\n        String TAG\
  \ = \"RemoteService\";\n\n        public IncomingHandler() {\n            super(Looper.getMainLooper());\n\
  \        }\n\n        @Override\n        public void handleMessage(Message msg)\
  \ {\n            Bundle data = msg.getData();\n            String dataString = data.getString(\"\
  Message\");\n            Log.i(TAG, \"Message = \" + dataString);\n        }\n\n\
  \        @Override\n        public IBinder onBind(Intent intent) {\n           \
  \ // Return the communication\n            throw new UnsupportedException(\"Not\
  \ implemented\");\n        }\n    }\n\n    final Messenger myMessenger = new Messenger(new\
  \ IncomingHandler());\n\n    @Override\n    public IBinder onBind(Intent intent)\
  \ {\n        return myMessenger.getBinder();\n    }\n}\n```\n\n上述代码的第一行创建了 handler\
  \ 的实例并将其传递给 `Messenger` 的构造函数。在 `onBind()` 方法中，调用 messenger 的 `getBinder()` 方法以返回\
  \ `IBinder` 对象。\n\n### 58.5 在 Manifest 中配置远程服务\n\n为了准确描述客户端与服务之间的通信，有必要将服务配置在单独进程中运行。这是通过在清单文件的\
  \ `<service>` 标签内添加 `android:process` 属性实现的。为了启动远程服务，还需要为服务提供 intent-filter。实现此更改，请修改\
  \ `AndroidManifest.xml` 添加所需的条目：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\n   \
  \ package=\"com.ebookfrenzy.remotebound\">\n    <application\n        android:allowBackup=\"\
  true\"\n        android:icon=\"@mipmap/launcher\"\n        android:label=\"@string/app_name\"\
  \n        android:supportsRtl=\"true\"\n        android:theme=\"@style/AppTheme\"\
  >\n        <service\n            android:name=\".RemoteService\"\n            android:enabled=\"\
  true\"\n            android:exported=\"true\"\n            android:process=\":my_process\"\
  \ >\n        <activity android:name=\".MainActivity\" >\n            <intent-filter>\n\
  \                <action android:name=\"android.intent.action.MAIN\" />\n      \
  \          <category android:name=\"android.intent.category.LAUNCHER\" />\n    \
  \        </intent-filter>\n        </activity>\n    </application>\n</manifest>\n\
  ```\n\n\n\n\n\n### 58.6 启动并绑定远程服务\n\n与本地绑定服务一样，客户端组件需要实现 `ServiceConnection` 类的实例，并包含\
  \ `onServiceConnected()` 和 `onServiceDisconnected()` 方法。此外，与本地服务相同，`onServiceConnected()`\
  \ 方法将接收由远程服务的 `onBind()` 方法返回的 `IBinder` 对象，它将用于向服务器处理程序发送消息。在本例中，客户端是 `MainActivity`，其代码位于\
  \ `MainActivity.java` 中。加载此文件并进行修改，以添加 `ServiceConnection` 类以及一个用于存储接收到的 `Messenger`\
  \ 对象引用的变量，以及一个用于指示连接是否建立的 `Boolean` 标志位：\n\n```java\npackage com.ebookfrenzy.remotebound;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\n\nimport android.os.Bundle;\n\
  \nimport android.os.IBinder;\n\nimport android.os.Message;\nimport android.os.Messenger;\n\
  import android.os.RemoteException;\n\nimport android.content.ComponentName;\nimport\
  \ android.content.Context;\nimport android.content.Intent;\nimport android.os.ServiceConnection;\n\
  \nimport android.view.View;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    Messenger myService = null;\n    boolean isBound;\n\n    @Override\n  \
  \  protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.activity_main);\n    }\n\n    final private ServiceConnection\
  \ myConnection =\n            new ServiceConnection() {\n                public\
  \ void onServiceConnected(\n                              ComponentName className,\n\
  \                                                             IBinder service) {\n\
  \                    myService = new Messenger(service);\n                    isBound\
  \ = true;\n                }\n                public void onServiceDisconnected(\n\
  \                              ComponentName className) {\n                    myService\
  \ = null;\n                    isBound = false;\n                }\n           \
  \ };\n}\n```\n\n接下来，需要添加一些代码来绑定到远程服务。这涉及创建一个与文件中声明的服务意图过滤器匹配的 `intent`，然后调用 `bindService()`\
  \ 方法，并将 `intent` 和 `ServiceConnection` 实例的引用作为参数传递。为了本例，这些代码将在 Activity 的 `onCreate()`\
  \ 方法中实现：\n\n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState)\
  \ {\n    super.onCreate(savedInstanceState);\n    setContentView(R.layout.activity_main);\n\
  \    Intent intent = new Intent(getApplicationContext(),\n                     \
  \             RemoteService.class);\n    bindService(intent, myConnection, Context.BIND_AUTO_CREATE);\n\
  }\n```\n\n### 58.7 向远程服务发送消息\n\n在测试应用程序之前，剩下的工作是在 `MainActivity` 类中实现 `sendMessage()`\
  \ 方法。该方法需要检查服务是否已连接，创建一个包含字符串的 `bundle`，并将其发送到服务器：\n\n```java\npublic void sendMessage(View\
  \ view) {\n    if (isBound) {\n        Message msg = Message.obtain();\n       \
  \ Bundle bundle = new Bundle();\n        bundle.putString(\"MyString\", \"Message\
  \ Received\");\n        msg.setData(bundle);\n        try {\n            myService.send(msg);\n\
  \        } catch (RemoteException e) {\n            e.printStackTrace();\n     \
  \   }\n    }\n}\n```\n\n### 58.8 总结\n\n要实现客户端与绑定服务之间的通信，必须实现一个处理器（handler）。该技术背的基本概念已在本章中结合示例进行了介绍。\n\
  \n## 59. 线程、处理器和执行器概述\n\n线程是任何多任务系统的基石，可以被视为运行在内部的微进程。在本章中，我们将探索使用线程的重要性，并演示如何创建和管理它们。\n\
  \n### 59.1 主线程\n\n当 Android 首次启动时，运行时系统会创建一个线程，所有组件都在该线程运行。这个线程通常被称为主线程。主线程的主要作用是处理用户界面。在应用程序内启动的任何额外组件默认情况下也会运行在主线程上。\n\
  \n任何在主线程上执行耗时任务的组件都会导致整个应用程序锁定，直到任务完成。这通常会导致操作系统显示“应用程序未响应”的警告。显然，这远不是我们想要的行为。这可以通过简单将要执行的任务启动在独立的线程中来避免，让主线程能够不受阻地继续。\n\
  \n### 59.2 线程处理器（Thread Handlers）\n\n显然，Android 开发的核心准则之一是永远不要在主线程上执行耗时操作。第二个同样重要的规则是，独立线程中的代码绝不能直接更新用户界面的任何部分。\n\
  \n对用户界面的任何更改必须在主线程内部进行。这是因为 Android UI 工具包不是线程安全的。尝试在多个线程中处理非线程安全的代码，通常会导致间歇性问题和不可预测的应用程序行为。\n\
  \n如果执行在线程中的代码需要与用户界面交互，它必须通过与主 UI 线程同步来实现。这通过在主线程中创建一个 handler 实现，该 handler 接收来自另一个线程的消息并相应地更新用户界面。\n\
  \n### 59.3 线程示例\n\n本章的剩余部分将通过一些简单的示例来提供对线程的基础介绍。第一步将强调在离开主线程的独立线程中执行耗时任务的重要性。\n\n\
  启动 Android Studio，在欢迎界面上选择 New Project（新建项目）选项，在弹出的新项目对话框中选择 Empty Activity 模板，然后点击\
  \ Next 按钮。\n\n在 Name 字段输入 ThreadExample，并指定 `com.ebookfrenzy.threadexample` 为包名。在点击\
  \ Finish 按钮之前，将 Minimum API level 设置更改为 API 26: Android 8.0 (Oreo)，并将 Language 菜单改为\
  \ Java。\n\n### 59.4 构建应用程序\n\n在布局编辑器工具中加载项目的 `activity_main.xml` 文件。选择默认的 `TextView`\
  \ 组件，并在属性工具窗口中将视图 ID 更改为 `myTextView`。\n\n\n\n\n\n在用户界面上添加一个 `Button` 视图，其位置直接位于现有\
  \ `TextView` 对象下方，如图图 59-1 所示。添加按钮后，点击工具栏上的 `Infer Constraints`（推断约束）按钮以添加缺失的约束条件。\n\
  \n将文本更改为“Press Me”，并将该字符串提取为名为 `press_me` 的资源。在布局中仍选中按钮视图的情况下，找到 `onClick` 属性并输入\
  \ `buttonClick` 作为方法名。\n\n![](img/as_4.2_threadexample_ui.jpg)\n图 59-1\n\n接下来，将\
  \ `MainActivity.java` 文件加载到编辑面板中，并为 `buttonClick()` 方法添加代码，该方法将在用户点击 `Button` 视图时被调用。由于这里的目标是演示在主线程上执行耗时任务的问题，代码将在向\
  \ `TextView` 对象显示不同文本之前简单地暂停 20 秒：\n\n```java\npublic void buttonClick(View view)\
  \ {\n    long endTime = System.currentTimeMillis() + 20 * 1000;\n    while (System.currentTimeMillis()\
  \ < endTime) {\n        synchronized (this) {\n            try {\n             \
  \   wait(endTime - System.currentTimeMillis());\n            } catch (Exception\
  \ e) {\n            }\n        }\n    }\n    binding.myTextView.setText(\"Button\
  \ Pressed\");\n}\n```\n\n代码更改完成后，在物理设备或模拟器上运行应用程序。一旦应用程序运行，点击按钮，此时应用程序将看起来像冻结了。例如，将无法第二次触摸按钮，并且在某些情况下，操作系统会报告应用程序无响应，如图图\
  \ 59-2 所示。\n\n![](img/as_4.2_threadexample_not_responding.jpg)\n图 59-2\n\n显然，`buttonClick()`\
  \ 方法中任何需要时间完成的任务都需要应该在单独的线程中执行。\n\n## 59.5 创建新线程\n\n要创建一个新线程，需要将要在该线程中执行的代码放置在 `Runnable`\
  \ 实例的 `run()` 方法中。然后需要创建一个新的 `Thread` 对象，并在构造函数中传递 `Runnable` 实例的引用。最后，需要调用线程对象的\
  \ `start()` 方法来启动线程运行。因此，为了执行 `buttonClick()` 方法中的任务，需要进行以下更改：\n\n```java\npublic\
  \ void buttonClick(View view) {\n    Runnable runnable = new Runnable() {\n    \
  \    public void run() {\n            long endTime = System.currentTimeMillis()\
  \ + 20 * 1000;\n            while (System.currentTimeMillis() < endTime) {\n   \
  \             synchronized (this) {\n                    try {\n               \
  \         wait(endTime - System.currentTimeMillis());\n                    } catch\
  \ (Exception e) {\n                    }\n                }\n            }\n   \
  \     }\n        binding.myTextView.setText(\"Button Pressed\");\n    };\n    Thread\
  \ myThread = new Thread(runnable);\n    myThread.start();\n}\n```\n\n事实上，如果需要，可以使用\
  \ Java Lambda 表达式来简化 `runnable` 的声明。此更改将导致如下声明：\n\n```java\nRunnable runnable =\
  \ () -> {\n    long endTime = System.currentTimeMillis() + 20 * 1000;\n    while\
  \ (System.currentTimeMillis() < endTime) {\n        synchronized (this) {\n    \
  \        try {\n                wait(endTime - System.currentTimeMillis());\n  \
  \          } catch (Exception e) {\n            }\n        }\n    }\n};\nThread\
  \ myThread = new Thread(runnable);\nmyThread.start();\n```\n\n现在运行应用程序时，触摸按钮会导致延迟在新的线程中执行，从而让主线程继续处理用户界面。事实上，每次触摸按钮，都会创建一个新线程，允许任务被执行多次。\n\
  \n仔细检查 `buttonClick()` 方法的更新代码将会发现更新 `TextView` 的代码已被移除。如所述，从主线程以外的线程更新用户界面元素违反了\
  \ Android 开发的一项关键规则。因此，为了更新用户界面，有必要为线程实现一个 `Handler`。\n\n## 59.6 实现线程处理器 (Thread\
  \ Handler)\n\n线程处理器在应用程序的主线程中实现，主要用于响应由应用程序进程内其他线程发送的消息来更新用户界面。Handler 是继承自 `Handler`\
  \ 类的子类，可以通过指定要由线程执行的 `Runnable`，或者通过重写 `Handler` 子类中的 `handleMessage()` 回调来使用（当线程向处理器\
  \ get 送消息时，该回调将被调用）。\n\n出于本示例的目的，将实现一个处理器以从之前创建的线程更新用户界面。将 `MainActivity.java` 文件加载到\
  \ Android Studio 编辑器中并修改代码，向 activity 添加一个 `Handler` 实例：\n\n```java\nimport android.os.Handler;\n\
  import android.os.Message;\nimport android.os.Looper;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    Handler handler = new Handler(Looper.getMainLooper())\
  \ {\n        @Override public void handleMessage(Message msg) {\n            binding.myTextView.setText(\"\
  Message Received\");\n        }\n    };\n}\n```\n\n上述代码更改声明了一个处理器，并在该处理器内部实现了线程向处理器发送消息时会被调用的\
  \ `handleMessage()` 回调。在此实例中，代码只需在 `TextView` 对象上显示字符串。\n\n剩下的工作是修改创建的线程，在延迟完成后向处理器发送消息：\n\
  \n```java\npublic void buttonClick(View view) {\n    Runnable runnable = () -> {\n\
  \        long endTime = System.currentTimeMillis() + 20 * 1000;\n        while (System.currentTimeMillis()\
  \ < endTime) {\n            synchronized (this) {\n                try {\n     \
  \               wait(endTime - System.currentTimeMillis());\n                } catch\
  \ (Exception e) {\n                }\n            }\n        }\n        handler.sendEmptyMessage(0);\n\
  \    };\n    Thread myThread = new Thread(runnable);\n    myThread.start();\n}\n\
  ```\n\n注意，唯一的更改是调用了处理器的 `sendEmptyMessage()` 方法。因为处理器目前对收到的任何空消息都没有执行任何操作。\n\n编译并运行应用程序，并在执行时触摸按钮。20\
  \ 秒后，新文本将出现在用户界面的 `TextView` 对象中。\n\n## 59.7 向处理器传递消息\n\n虽然之前的示例触发了 `handleMessage()`处理器回调，但它没有利用消息对象向处理器传递数据。在教程阶段，将进一步修改示例以在线程和处理器之间传递数据。首先，`buttonClick()`\
  \ 方法中更新的线程将从系统获取字符串格式的日期时间，并将信息存储在 `Bundle` 对象中。然后调用处理器对象的 `obtainMessage()` 方法从消息池中获取消息对象。最后在通过调用处理对象的\
  \ `sendMessage()` 方法发送之前，将该 bundle 添加到消息对象中：\n\n```java\npublic void buttonClick(View\
  \ view) {\n    Runnable runnable = () -> {\n        long endTime = System.currentTimeMillis()\
  \ + 20 * 1000;\n        while (System.currentTimeMillis() < endTime) {\n       \
  \     synchronized (this) {\n                try {\n                    wait(endTime\
  \ - System.currentTimeMillis());\n                } catch (Exception e) {\n    \
  \            }\n            }\n        }\n```\n\n\n\n\n\n```java\nwait(endTime -\
  \ System.currentTimeMillis());\n} catch (Exception e) {\n}\n}\n}\nMessage msg =\
  \ handler.obtainMessage();\nBundle bundle = new Bundle();\nbundle.putString(\"myKey\"\
  , \"Thread Completed\");\nmsg.setData(bundle);\nhandler.sendMessage(msg);\n};\n\n\
  Thread myThread = new Thread(runnable);\nmyThread.start();\n}\n```\n\n接下来，更新 `handler`\
  \ 的 `handleMessage()` 方法，从 `message` 中的 `bundle` 对象中提取日期和时间字符串，并将其显示在 `TextView`\
  \ 对象上：\n\n```java\nHandler handler = new Handler(Looper.getMainLooper()) {\n   \
  \ @Override\n    public void handleMessage(Message msg) {\n        Bundle bundle\
  \ = msg.getData();\n        String string = bundle.getString(\"myKey\");\n     \
  \   binding.myTextView.setText(string);\n    }\n};\n```\n\n最后，编译并运行应用程序，测试点击按钮后是否会在线程完成后在\
  \ `TextView` 对象上显示“Thread Complete”消息。\n\n# 59.8 Java Executor 并发\n\n到目前为止，在本章中我们专门查看了直接创建和管理\
  \ Java 线程。虽然对于简单的多线程任务是可以接受的，但在处理涉及大量线程的复杂情况时，这可能证明是不够的。例如，启动和停止线程涉及系统开销。因此，一个创建和销毁大量线程的应用程序可能会面临性能下降的风险。基本的线程\
  \ API 也没有提供用于调度或重复任务执行的预构建选项，也没有提供从任务返回结果的方法。\n\n通过使用 Java 并发框架中的 `Executor` 类（属于\
  \ `java.util.concurrent` 包的一部分），可以克服直接处理线程的缺点。该框架允许创建一个活动线程池，并管理如何将任务分配给这些线程。这使得现有线程可以用于其他任务，而无需不断创建新线程。\n\
  \n该框架还提供了额外的功能，包括在任务完成后返回结果（称为 `Callable task`）的能力、检查线程状态以及调度任务在超时后或按重复的时间间隔运行。\n\
  \n# 59.9 使用 Runnable 任务\n\n探索此框架的第一步是修改 `buttonClicked()` 方法，使用并发框架 `Executor` 在单独线程中运行任务：\n\
  \n```java\nimport java.util.concurrent.ExecutorService;\nimport java.util.concurrent.Executors;\n\
  \npublic void buttonClick(View view) {\n    ExecutorService executor = Executors.newSingleThreadExecutor();\n\
  \    executor.submit(new Runnable() {\n        public void run() {\n           \
  \ long endTime = System.currentTimeMillis() + 10 * 1000;\n            while (System.currentTimeMillis()\
  \ < endTime) {\n                synchronized (this) {\n                    try {\n\
  \                        wait(endTime - System.currentTimeMillis());\n         \
  \           } catch (Exception e) {\n                    }\n                }\n\
  \            }\n            Message msg = handler.obtainMessage();\n           \
  \ Bundle bundle = new Bundle();\n            bundle.putString(\"myKey\", \"Button\
  \ Pressed\");\n            msg.setData(bundle);\n            handler.sendMessage(msg);\n\
  \        }\n    });\n    executor.shutdown();\n}\n```\n\n当执行上述代码时，超时将像以前一样在单独线程上执行。然而，对方法的更改需要一些解释。首先，从\
  \ `Executors` 实例获取 `ExecutorService` 实例的引用：\n\n```java\nExecutorService executor\
  \ = Executors.newSingleThreadExecutor();\n```\n\n在这种情况下，请求了一个只包含一个线程的池。也可以按照如下方式请求包含指定数量线程的池：\n\
  \n```java\nExecutorService executor = Executors.newThreadPool(10);\n```\n\n接下来，通过调用\
  \ `executor` 服务的 `submit()` 方法在线程上启动 `Runnable` 任务：\n\n```java\nexecutor.submit(new\
  \ Runnable(){\n    public void run() {\n        long endTime = System.currentTimeMillis()\
  \ + 20 * 1000;\n    }\n});\n```\n\n注意，上述声明可以通过将其转换为如下 lambda 表达式来简化：\n\n```java\n\
  executor.submit(() -> {\n    long endTime = System.currentTimeMillis() + 20 * 1000;\n\
  });\n```\n\n从现在开始，该任务将一直运行到完成。然而，一旦完成，`executor` 服务将继续运行。如果你不再需要该服务，则应该对其调用 `shutdown`。\n\
  \n# 59.10 关闭 Executor 服务\n\n`ExecutorService` 提供了几种用于启动关闭的技术。要通知服务在当前正在运行的任务完成后后自动关闭，应该如下所示调用\
  \ `shutdown()` 方法：\n\n```java\nexecutor.shutdown();\n```\n\n另一方面，调用 `shutdownNow()`\
  \ 方法会停止服务上运行的所有任务，并取消待处理任务的处理：\n\n```java\nexecutor.shutdownNow();\n```\n\n# 59.11\
  \ 使用 Callable 任务和 Future\n\n如前所述，`ExecutorService` 支持被称为“Callable”的任务，这些任务可以在任务完成后返回结果。运行在单独线程上的任务预计需要一些时间才能完成（否则它们可能根本不需要运行在单独线程上）。这引出了一个问题：如何将结果返回给启动任务的线程代码。这是通过使用\
  \ `Future` 类型实现的，它代表未来某个时刻将提供的值。\n\n当执行 `callable` 任务时，它会返回一个 `Future` 实例，可以使用它获取任务完成的结果。要查看此效果，首先编辑\
  \ `activity_main.xml` 文件添加一个标记为“Status”的按钮，其 `onClick` 属性配置为调用方法 `statusClick`：\n\
  \n![](img/4.2_threadexample_status_button) 图 59-3\n\n接下来，修改 `buttonClick()` 方法以执行\
  \ `Callable` 任务，并通过 `Future` 变量返回字符串：\n\n```java\nimport java.util.concurrent.Callable;\n\
  import java.util.concurrent.Future;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    Future<String> future;\n\n    public void buttonClick(View view) {\n  \
  \      ExecutorService executor = Executors.newSingleThreadExecutor();\n       \
  \ future = executor.submit(new Callable<String>() {\n            public String call()\
  \ {\n                long endTime = System.currentTimeMillis() + 10 * 1000;\n  \
  \              while (System.currentTimeMillis() < endTime) {\n                \
  \    synchronized (this) {\n                        try {\n                    \
  \        wait(endTime - System.currentTimeMillis());\n                        }\
  \ catch (Exception e) {\n                        }\n                    }\n    \
  \            }\n                return(\"Task Completed\");\n            }\n   \
  \     });\n        executor.shutdown();\n    }\n}\n```\n\n注意，除了导入 `java.util.concurrent.Future`\
  \ 包并声明一个存储字符串值的 `Future` 变量外，启动任务的方式也发生了更改：\n\n```java\nfuture = executor.submit(new\
  \ Callable<String>() {\n```\n\n这里的关键在于，我们现在不是向执行器提交 `Runnable` 任务，而是传递了一个 `Callable`\
  \ 任务（声明为返回 `String` 值）。同样注意，任务的结果被分配给了 `Future` 变量。此外，使用 `call()` 代替之前提交 `Runnable`\
  \ 任务时使用的 `run()` 方法。\n\n```java\nreturn(\"Task Completed\")\n```\n\n# 59.12 处理 Future\
  \ 结果\n\n\n\n\n\n`buttonClick()` 方法现在已配置为启动一个 `Callable` 任务，并将返回值赋值给 `Future` 变量。现在应用程序需要知道任务何时完成以及结果何时可用。其中一种方案是调用\
  \ `Future` 变量的 `get()` 方法。由于该方法在执行失败或被中断时可能会抛出异常，因此必须在如下的 `try/catch` 语句中执行：\n\n\
  ```java\nString result = null;\n\ntry {\n    result = future.get();\n} catch (ExecutionException\
  \ | InterruptedException e) {\n    e.printStackTrace();\n}\n```\n\n遗憾的是，`get()`\
  \ 方法将阻塞当前线程，直到线程中运行的任务完成，这违背了最初在单独线程中运行任务的初衷。另一个方案是为 `get()` 方法调用提供一个超时时间，超时后它会将控制权返回给当前线程。例如，以下代码将导致\
  \ `get()` 调用在 3 秒后超时：\n\n```java\nresult = future.get(3, TimeUnit.SECONDS);\n```\n\
  \n然而，更好的替代方案是调用 `Future` 实例的 `isDone()` 方法来检查线程的状态，并且在任务完成后再调用 `get()` 方法。要实现此行为，请在\
  \ `MainActivity.java` 文件中添加如下 `statusClick()` 方法：\n\n```java\nimport java.util.concurrent.ExecutionException;\n\
  import java.util.concurrent.TimeUnit;\nimport java.util.concurrent.TimeoutException;\n\
  \npublic void statusClick(View view) {\n    if ((future != null && future.isDone())\
  \ {\n        String result = null;\n        try {\n            result = future.get(3,\
  \ TimeUnit.SECONDS);\n        } catch (ExecutionException | InterruptedException\n\
  \                    | TimeoutException e) {\n            e.printStackTrace();\n\
  \        }\n        binding.myTextView.setText(result);\n    } else {\n        binding.myTextView.setText(\"\
  Waiting\");\n    }\n}\n```\n\n完成更改后，运行应用程序并点击“Press Me”按钮。在任务运行期间，点击“Status”按钮。只要任务仍在运行，TextView\
  \ 中就会显示“Waiting”消息。然而，一旦任务完成，`isDone()` 方法将返回 `true` 值，`get()` 方法将被调用，任务返回的字符串（“Task\
  \ Complete”）将显示在 TextView 上。\n\n### 59.13 调度任务\n\n最后涵盖的领域涉及使用 `ExecutorService`\
  \ 来调度任务执行。这涉及到使用 `ScheduledExecutorService` 实例，并在实例上调用 `schedule()` 方法，同时传递要执行的\
  \ `Runnable` 任务以及时间延迟。`schedule()` 调用将返回一个 `ScheduledFuture` 实例，该实例可用于识别任务到期开始前的剩余时间。\n\
  \n例如，以下代码调度了一个任务在 30 秒后运行，并访问了剩余的延迟时间：\n\n```java\nScheduledExecutorService executor\
  \ = Executors.newScheduledThreadPool(1);\nRunnable task = () -> {\n    // 在此处执行任务代码\n\
  };\nScheduledFuture<?> future = executor.schedule(task, 30, TimeUnit.SECONDS);\n\
  long delayRemaining = future.getDelay(TimeUnit.SECONDS);\n```\n\n同样，`ScheduledExecutorService`\
  \ 可用于在可选的初始延迟后每隔固定间隔重复执行任务。例如，以下代码导致任务在 30 秒的初始延迟后每 10 秒执行一次：\n\n```java\nexecutor.scheduleAtFixedRate(task,\
  \ 30, 10, TimeUnit.SECONDS);\n```\n\n`scheduleAtFixedRate()` 方法无论上一个调定的任务是否完成，都会启动任务的下一个实例。要指定任务执行结束与下一次执行开始之间的固定时间间隔，请使用\
  \ `scheduleWithFixedDelay()` 方法。在以下示例中，第一个任务在 0 秒延迟后调度，随后的每次执行都在上一个任务完成 10 秒后进行：\n\
  \n```java\nexecutor.scheduleWithFixedDelay(task, 0, 10, TimeUnit.SECONDS);\n```\n\
  \n### 59.14 总结\n\n本章的目标是提供 Android 中线程的概述。当应用程序在进程中首次启动时，运行时系统会创建一个主线程，所有随后启动的应用程序组件默认在该线程中运行。主线程的主要作用是处理用户界面，因此在该线程中执行的任何耗时任务都会导致应用程序看起来像卡死了一样。因此，可能需要时间完成的任务在单独线程中启动是至关重要的。\n\
  \n由于 Android 用户界面工具包不是线程安全的，不应在主线程之外的任何线程对用户界面进行更改。可以通过在主线程中创建一个 handler 来实现用户界面更改，从其他非主线程向该\
  \ handler 发消息。\n\n## 60 在 Android 中请求运行时权限\n\n在前面的章节创建的多个项目中，已对 `AndroidManifest.xml`\
  \ 进行了更改以请求应用执行特定任务的权限。在每个情况下，例如都请求了网络访问权限以下载和显示网页。\n\n然而，在运行 Android 6 时，某些权限需要额外的步骤。第一种此类所谓的“危险”权限将在下一章中遇到。在到达这一点之前，本章将概述在运行时请求此类权限的步骤。\n\
  \nAndroid 通过要求用户授予应用执行某些任务的权限来强制安全。在 Android 6 引入之前，权限总是在应用安装时获取的。例如，图 60-1 显示了通过\
  \ Google Play 安装期间寻求各种权限的典型界面。\n\n### 60.1 理解普通权限和危险权限\n\n对于 Android 6 或更高版本的应用，许多类型的权限仍然适用此场景。这些权限被称为“普通权限”，仍然要求用户在安装时接受。第二类权限被称为“危险权限”，它们也必须像普通权限一样在清单文件中声明，但必须在应用程序首次启动时向用户请求。当进行此类请求时，它将以图\
  \ 60-2 所示的对话框形式出现。\n\n属于危险类别的权限完整列表包含在表 60-1 中：\n\n| 分组 | 权限 |\n| :--- | :--- |\n\
  | 日历 | READ_CALENDARWRITE_CALENDAR |\n| 相机 | CAMERA |\n| 联系人 | READ_CONTACTSWRITE_CONTACTSGET_ACCOUNTS\
  \ |\n| 位置 | ACCESS_FINE_LOCATIONACCESS_COARSE_LOCATION |\n| 麦克风 | RECORD_AUDIO |\n\
  | 通知 | POST_NOTIFICATIONS |\n| 电话 | READ_PHONE_STATECALL_PHONEREAD_CALL_LOGWRITE_CALL_LOGADD_VOICEMAILUSE_SIPPROCESS_OUTGOING_CALLS\
  \ |\n| 传感器 | BODY_SENSORS |\n| 短信 | SEND_SMSRECEIVE_SMSREAD_SMSRECEIVE_WAP_PUSHRECEIVE_MMS\
  \ |\n| 存储 | MANAGE_EXTERNAL_STORAGEREAD_EXTERNAL_STORAGEWRITE_EXTERNAL_STORAGE |\n\
  \n\n\n\n\n`MANAGE_EXTERNAL_STORAGE` 权限允许应用访问设备外部存储器上的所有文件，包括属于其他应用的文件。因此，只有当 Google\
  \ 在审核过程中验证您的应用需要此级别的访问权限后，该权限才会为您的应用启用。为了在将应用提交到 Google Play 商店之前进行测试，可以执行以下 `adb`\
  \ 命令来临时在测试设备上为应用启用访问权限：\n\n```bash\nadb shell appops set --uid <package name> MANAGE_EXTERNAL_STORAGE\
  \ allow\n```\n\n可以通过以下方式禁用此模式：\n\n```bash\nadb shell appops set --uid <package name>\
  \ MANAGE_EXTERNAL_STORAGE default\n```\n\n## 60.2 创建权限示例项目\n\n从欢迎屏幕上选择 `New Project`\
  \ 选项，在弹出的新项目对话框中，点击 `Next` 按钮之前选择 `Empty Activity` 模板。\n\n在 `Name` 字段中输入 `PermissionDemo`，并指定\
  \ `com.ebookfrenzy.permissiondemo` 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为\
  \ `API 26: Android 8.0 (Oreo)`，并将 `Language` 菜单改为 `Java`。\n\n### 60.3 检查权限\n\nAndroid\
  \ Support Library 包含许多方法，可以在 Android 应用代码中查找和管理危险权限。无论应用运行的 Android 版本如何，这些 API\
  \ 调用都是都是安全的，但只有在在 Android 6.0 或更高版本上执行时，它们才会执行有意义的任务。\n\n在应用尝试使用需要批准危险权限的功能之前，无论之前是否已授予权限，代码都必须检查该权限是否已授予。这可以通过调用\
  \ `ContextCompat` 类的 `checkSelfPermission()` 方法来实现，并将当前活动的引用和请求的权限作为参数传递。该方法将检查之前是否已授予了权限，并返回与\
  \ `PackageManager.PERMISSION_GRANTED` 或 `PackageManager.PERMISSION_DENIED` 匹配的整数值。\n\
  \n在示例项目的 `MainActivity.java` 文件中，修改代码以检查是否已授予该应用录音的权限：\n\n```java\npackage com.ebookfrenzy.permissiondemoactivity;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\nimport androidx.core.content.ContextCompat;\n\
  import androidx.annotation.NonNull;\nimport android.os.Bundle;\nimport android.Manifest;\n\
  import android.content.pm.PackageManager;\nimport android.util.Log;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n    private static final String TAG\
  \ = \"PermissionDemo\";\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_permission_demo);\n\
  \        setupPermissions();\n    }\n\n    private void setupPermissions() {\n \
  \       int permission = ContextCompat.checkSelfPermission(this,\n             \
  \   Manifest.permission.RECORD_AUDIO);\n        if (permission != PackageManager.PERMISSION_GRANTED)\
  \ {\n            Log.i(TAG, \"Permission to record denied\");\n        }\n    }\n\
  }\n```\n\n在运行 Android 6.0 之前的版本的设备或模拟器上运行应用，并检查 Android Studio 中的 Logcat 输出。应用启动后，Logcat\
  \ 输出应包含“Permission to record denied”消息。\n\n编辑 `AndroidManifest.xml` 文件（位于 Project\
  \ 窗口的 `app -> manifests` 下），并添加如下行代码以请求录音权限：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.permissiondemoactivity\" >\n    <uses-permission\
  \ android:name=\"android.permission.RECORD_AUDIO\" />\n    <application\n      \
  \  android:allowBackup=\"true\"\n        android:icon=\"@mipmap/ic_launcher\"\n\
  \        android:label=\"@sxtring/app_name\"\n        android:supportsRtl=\"true\"\
  \n        android:theme=\"@style/AppTheme\" >\n        <activity android:name=\"\
  .MainActivity\" >\n            <intent-filter>\n                <action android:name=\"\
  android.intent.action.MAIN\" />\n                <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n\
  ```\n\n编译并运行应用一次，注意此时没有出现权限拒绝的提示。显然，在旧版本的 Android 上请求此权限所需的所有工作都已完成。在运行 Android\
  \ 6.0 或更高版本的设备或模拟器上运行应用，并注意尽管权限已添加到 manifest 文件中，检查仍然报告权限被拒绝。这是因为 Android 6 及更高版本要求应用在运行时也请求权限。\n\
  \n## 60.4 在运行时请求权限\n\n权限请求是通过调用 `ActivityCompat` 类的 `requestPermissions()` 方法发出的。当调用此方法时，权限请求将进行异步处理，并在任务完成后将调用一个名为\
  \ `onRequestPermissionsResult()` 的方法。`requestPermissions()` 方法的参数是当前活动的引用，以及所请求权限的标识符和请求代码。请求代码可以是任意整数，用于标识是哪一个请求触发了\
  \ `onRequestPermissionsResult()` 方法的调用。修改 `MainActivity.java` 文件以声明请求代码，并在权限检查失败时请求录音权限：\n\
  \n```java\nimport androidx.core.app.ActivityCompat;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private static final String TAG = \"PermissionDemo\"\
  ;\n\n    @Override\n    private void setupPermissions() {\n        int permission\
  \ = ContextCompat.checkSelfPermission(this,\n                Manifest.permission.RECORD_AUDIO);\n\
  \        if (permission != PackageManager.PERMISSION_GRANTED) {\n            Log.i(TAG,\
  \ \"Permission to record denied\");\n            makeRequest();\n        }\n   \
  \ }\n\n    protected void makeRequest() {\n        ActivityCompat.requestPermissions(this,\n\
  \                new String[]{Manifest.permission.RECORD_AUDIO},\n             \
  \   RECORD_REQUEST_CODE);\n    }\n\n    private static final int RECORD_REQUEST_CODE\
  \ = 101;\n}\n```\n\n接下来，实现 `onRequestPermissionsResult()` 方法，内容如下：\n\n```java\n\
  @Override\npublic void onRequestPermissionsResult(int requestCode,\n        @NonNull\
  \ String[] permissions, @NonNull int[] grantResults) {\n    super.onRequestPermissionsResult(requestCode,\
  \ permissions, grantResults);\n    if (requestCode == RECORD_REQUEST_CODE) {\n \
  \       if (grantResults.length == 0 || grantResults[0] !=\n                PackageManager.PERMISSION_GRANTED)\
  \ {\n            Log.i(TAG, \"Permission has been denied by user\");\n        }\
  \ else {\n            Log.i(TAG, \"Permission has been granted by user\");\n   \
  \     }\n    }\n}\n```\n\n在 Android 6 或更高版本的模拟器或设备上编译并运行应用，注意会出现一个请求录音权限的对话框，如图\
  \ 60-3 所示：\n\n![](img/android_permission_request.jpg)\n\n图 60-3\n\n点击`While using\
  \ the app`按钮，并检查 Logcat 面板出现了“Permission has been granted by user”消息。\n\n一旦用户授予了所请求的权限，在用户卸载并重新安装应用或在设置中更改应用权限之前，未来的应用调用将使\
  \ `checkSelfPermission()` 方法返回 `PERMISSION_GRANTED` 结果。\n\n## 60.5 为权限请求提供理由\n\n\
  \n\n\n\n如图 60-3 所示，用户有权拒绝请求的权限。在这种情况下，除非用户在点击“拒绝”按钮之前选择了“不再询问”选项，否则应用在每次由用户启动时都会继续请求该权限。用户多次拒绝可能表明用户不理解为什么应用需要该权限。因此，如果在发出请求时解释需要该权限的原因，用户更有可能授予权限。遗憾的是，无法更改请求对话框的内容以包含此类解释。\n\
  \n最好的做法是将解释内容包含在一个独立的对话框中，该对话框可以在请求对话框显示给用户之前显示。这引出了何时显示此解释对话框的问题。Android 文档建议，仅在用户之前拒绝过权限时才显示解释对话框，并提供了一种方法来识别何时出现这种情况。\n\
  \n调用 `ActivityCompat` 类的 `shouldShowRequestPermissionRationale()` 方法，如果用户之前拒绝过对特定权限的请求，将返回\
  \ `true` 结果；如果之前没有发出过请求，则返回 `false` 结果。在结果为 `true` 的情况下，应用应该显示包含需要权限理由的对话框，一旦用户阅读并关闭了对话框，就应重复请求权限。\n\
  \n为了在示例应用中添加此功能，请修改 `onCreate()` 方法，使其内容如下：\n\n```java\nimport android.app.AlertDialog;\n\
  \nprivate void setupPermissions() {\n    int permission = ContextCompat.checkSelfPermission(this,\n\
  \            Manifest.permission.RECORD_AUDIO);\n    if (permission != PackageManager.PERMISSION_GRANTED)\
  \ {\n        Log.i(TAG, \"Permission to record denied\");\n        if (ActivityCompat.shouldShowRequestPermissionRationale(this,\n\
  \                Manifest.permission.RECORD_AUDIO)) {\n            AlertDialog.Builder\
  \ builder =\n                    new AlertDialog.Builder(this);\n            builder.setMessage(\"\
  Permission to access the microphone is required for this app to record audio.\"\
  )\n                    .setTitle(\"Permission required\");\n            builder.setPositiveButton(\"\
  OK\",\n                    (dialog, id) -> makeRequest());\n            AlertDialog\
  \ dialog = builder.create();\n            dialog.show();\n        } else {\n   \
  \         makeRequest();\n        }\n    }\n}\n```\n\n该方法仍然检查权限是否已授予，但现在还会识别是否需要显示理由。如果用户之前拒绝过请求，则会显示一个包含解释和\
  \ OK 按钮的对话框，并在按钮上配置了监听器，在点击按钮时调用 `makeRequest()` 方法。如果之前没有发出过权限请求，代码将直接跳转到请求权限。\n\
  \n## 60.6 测试权限应用\n\n在进行测试的 Android 6 或更高版本的设备或模拟器会话上，启动“设置”应用，选择“应用”选项，滚动并选择“PermissionDemo”应用。在应用设置屏幕上，点击“卸载”按钮从设备中移除该应用。\n\
  \n再次运行应用，当权限请求对话框出现时，点击“不允许”按钮。停止并重启应用，验证理由对话框是否出现。点击“确定”按钮，当权限请求对话框出现时，点击“在使用应用时”。\n\
  \n返回“设置”应用，选择“应用”选项并再次从列表中选择“PermissionDemo”应用。一旦列出应用设置，请验证权限部分是否列出了麦克风权限：\n\n![](img/as_permission_microphone.jpg)\n\
  \n图 60-4\n\n### 60.7 总结\n\n在 Android 6.0 引入之前，应用请求访问某些功能的唯一步骤是在应用程序的清单文件中添加适当的行。用户将在应用安装时被提示批准权限。对于大多数权限来说仍然如此，但危险权限除外。Android\
  \ 6 或更高版本现在必须从清单文件中请求权限。\n\n## 61. Android 通知教程\n\n通知提供了一种方法，让应用在未运行或当前处于后台时向用户传达消息。通知可以分为本地通知和远程通知。本地通知是由设备上的应用本身触发的。相反，远程通知由服务器发起并递送到设备。\n\
  \n本章的目标是概述并演示本地通知的实现。下一章（Android 直接回复通知）将涵盖直接回复的实现。\n\n### 61.1 通知概述\n\n当在 Android\
  \ 设备上启动通知时，它将作为状态栏中的一个图标出现。例如，图 61-1 显示了带有多个通知图标的状态栏：\n\n![](img/Image2454.jpg)\n\
  \n图 61-1\n\n要查看通知，用户需要从状态栏开始向下滑动，以拉下通知抽屉，如图图 61-2 所示：\n\n![](img/as_4.1_android_11_notifications.jpg)\n\
  \n图 61-2\n\n在运行 Android 8 或更高版本的设备上，长按应用启动器图标将显示与该应用相关的任何待处理通知，如图图 61-3 所示：\n\n\
  ![](img/Image2442.jpg)\n\n图 61-3\n\nAndroid 8 及更高版本还支持通知点，当有通知等待用户查看时，该点出现在应用启动器图标上。\n\
  \n典型的通知将仅显示消息，并在点击时启动发布该通知的应用。通知还可能包含操作按钮，点击这些按钮可以执行对应应用的特定任务。例如，图 61-4 显示了一个包含两个操作按钮的通知，允许用户删除或保存接收的消息。\n\
  \n![](img/Image2450.jpg)\n\n图 61-4\n\n用户还可以在通知中输入内联文本回复并发送给应用，如下方的图 61-5 所示。这允许用户无需将相应的应用调前台即可响应通知。\n\
  \n![](img/Image2458.jpg)\n\n图 61-5\n\n\n\n\n本章的剩余部分将介绍创建和发布包含操作的简单通知的步骤。关于直接回复支持的主题将在下一章介绍，标题为“Android\
  \ 直接回复通知教程”。\n\n## 61.2 创建 NotifyDemo 项目\n\n从欢迎界面选择 `New Project`选项，在弹出的新项目对话框中，点击\
  \ `Next` 按钮之前选择 `Empty Activity` 模板。\n\n在 `Name` 字段中输入 `NotifyDemo`，并指定 `com.ebookfrenzy.notifydemo`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置更改为 `API 33`：`Android 13 (Tiramisu)`，并将\
  \ `Language` 菜单更改为 `Java`。\n\n### 61.3 设计用户界面\n\n主活动将包含一个按钮，其目的是创建并发布一个意图（intent）。找到\
  \ `activity_main.xml` 文件，并将其加载到 `Layout Editor` 工具中，然后删除默认的 `TextView` 小部件。\n\n\
  在启用 `Autoconnect` 的情况下，将 `Button` 对象从面板拖动到布局画布的中心，如图 61-6 所示。\n\n在布局中选中 `Button`\
  \ 小部件后，使用 `Attributes` 面板配置 `onClick` 属性以调用名为 `sendNotification` 的方法。\n\n![](img/as_4.1_notify_demo_ui.jpg)\n\
  \n图 61-6\n\n选择 `Button` 小部件，在 `Attributes` 工具窗口中将 `text` 属性更改为“Notify”，并将属性值提取到字符串资源。\n\
  \n### 61.4 创建第二个 Activity\n\n出于本示例的目的，应用程序将包含第二个活动，用户将可以从通知内部启动该活动。通过右键点击 `app ->\
  \ java` 下的 `com.ebookfrenzy.notifydemo` 包名，选择 `New -> Activity -> Empty Activity`\
  \ 菜单选项显示 `New Android Activity` 对话框，从而添加新活动。\n\n在 `Activity Name` 字段中输入 `ResultActivity`，并将布局文件命名为\
  \ `activity_result`。由于此活动不会在应用程序启动时启动（它将通过通知内部的意图启动），因此在点击 `Finish` 按钮之前确保禁用 `Launcher\
  \ Activity` 选项是非常重要的。\n\n打开第二个活动的布局（`app -> res -> layout -> activity_result.xml`），并拖放一个\
  \ `TextView` 小部件使其位于布局中心。编辑 `TextView` 的文本使其显示为“Result Activity”，并将属性值提取到字符串资源。\n\
  \n## 61.5 创建通知通道\n\n在应用程序可以发送通知之前，它必须先创建一个通知通道。通知通道由一个 `ID`（用于在应用内唯一标识通道）、一个 `channel\
  \ name` 和一个 `channel description`（只有后两个会被用户看到）组成。通道是通过配置 `NotificationChannel` 实例并将该对象传递给\
  \ `NotificationManager` 类的 `createNotificationChannel()` 方法来创建的。对于此示例，应用程序将包含一个名为“NotifyDemo\
  \ News”的单一通知通道。编辑 `MainActivity.java` 文件并实现在应用启动时创建通道的代码：\n\n```java\n.\n\n.\n\n\
  import android.app.NotificationManager;\nimport android.app.NotificationChannel;\n\
  import android.content.Context;\nimport android.graphics.Color;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n    NotificationManager notificationManager;\n\
  \n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n    \
  \    super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \        notificationManager =\n            (NotificationManager)\n            \
  \    getSystemService(Context.NOTIFICATION_SERVICE);\n        createNotificationChannel(\n\
  \            \"com.ebookfrenzy.notifydemo.news\",\n            \"NotifyDemo News\"\
  ,\n            \"Example News Channel\");\n    }\n    protected void createNotificationChannel(String\
  \ id, String name,\n            String description) {\n        int importance =\
  \ NotificationManager.IMPORTANCE_LOW;\n        NotificationChannel channel =\n \
  \           new NotificationChannel(id, name, importance);\n        channel.setDescription(description);\n\
  \        channel.enableLights(true);\n        channel.setLight(Color.RED);\n   \
  \     channel.enableVibration(true);\n        channel.setVibrationPattern(\n   \
  \         new long[]{100, 200, 300, 400, 500, 400, 300, 200});\n        notificationManager.createNotificationChannel(channel);\n\
  \    }\n}\n```\n\n该代码声明并初始化了 `NotificationManager` 实例，然后使用名称和描述属性创建了一个低重要性（其他选项有高、最高、无）的通道。通道还添加了一系列可选设置，以自定义用户接收通知到达提醒的方式。最后，通过通知实例创建通道。\n\
  \n## 61.6 请求通知权限\n\n在测试应用程序之前，务必在应用程序的清单文件中请求恰当的权限。具体而言，应用程序将需要发布通知的权限。在 Project\
  \ 窗口中，找到并双击 `AndroidManifest.xml` 文件将其加载到编辑器，并修改 XML 添加权限：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.audioapp\">\n    <uses-permission android:name=\"\
  android.permission.POST_NOTIFICATIONS\" />\n</manifest>\n```\n\n对于 Android 6.0 之前的设备，上述步骤足以确保用户在安装应用时启用通知。通知访问在\
  \ Android 中被归类为危险权限，因为它可能损害用户的隐私。因此，为了让示例应用在 Android 6 或更高设备上运行，需要添加代码在运行时请求权限。\n\
  \n编辑 `MainActivity.java` 文件，首先添加一些额外的导入指令和常量作为所请求权限的标识代码：\n\n```java\n.\n\n.\n\n\
  import androidx.core.app.ActivityCompat;\nimport androidx.core.content.ContextCompat;\n\
  import androidx.annotation.NonNull;\nimport android.widget.Toast;\nimport android.Manifest;\n\
  import android.content.pm.PackageManager;\n\n..\n\npublic class MainActivity extends\
  \ AppCompatActivity {\n    private static final int NOTICATION_REQUEST_CODE = 101;\n\
  \n...\n```\n\n接下来，需要在类中添加一个方法，其目的是接收要请求的权限和对应的请求标识代码作为参数。继续使用 `MainActivity.java`\
  \ 类文件，如下实现该方法：\n\n```java\nprotected void requestPermission(String permissionType,\
  \ int requestCode) {\n    int permission = ContextCompat.checkSelfPermission(this,\n\
  \            permissionType);\n    if (permission != PackageManager.PERMISSION_GRANTED)\
  \ {\n        ActivityCompat.requestPermissions(this,\n            new String[]{permissionType},\
  \ requestCode);\n    }\n}\n```\n\n使用本书书中“在 Android 中进行运行时权限”章节概述的步骤，上述方法在请求之前会验证指定的权限是否已授予，并将标识代码作为参数传递。\n\
  \n\n\n\n当请求被处理后，活动上将调用 `onRequestPermissionsResult()` 方法，并传递识别码和请求结果。因此，下一步是在 `MainActivity.java`\
  \ 文件中按如下实现此方法：\n\n```java\n@Override\npublic void onRequestPermissionsResult(int\
  \ requestCode,\n            @NonNull String[] permissions, @NonNull int[] grantResults)\
  \ {\n    super.onRequestPermissionsResult(requestCode, permissions, grantResults);\n\
  \    if (requestCode == NOTIFICATION_REQUEST_CODE) {\n        if (grantResults.length\
  \ == 0\n                || grantResults[0] !=\n                PackageManager.PERMISSION_GRANTED)\
  \ {\n            Toast.makeText(this,\n                            \"Notification\
  \ permission required\",\n                            Toast.LENGTH_LONG).show();\n\
  \        }\n    }\n}\n```\n\n上述代码通过检查请求标识码来识别是哪个权限请求返回了结果，然后检查是否授予了相应的权限。如果权限被拒绝，将向用户显示一条消息，指示应用将无法运行且记录按钮将被禁用。\n\
  \n在测试应用之前，剩下的工作是在应用启动时调用新添加的 `requestPermission()` 方法。在 `MainActivity.java` 文件中，按如下修改\
  \ `onCreate()` 方法：\n\n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState)\
  \ {\n    super.onCreate(savedInstanceState);\n    setContentView(R.layout.activity_main);\n\
  \    requestPermission(Manifest.permission.POST_NOTIFICATIONS,\n            NOTIFICATION_REQUEST_CODE);\n\
  }\n```\n\n代码更改完成后，编译并在运行 Android 13 或更高版本的设备或模拟器上运行应用。当显示的图 61-7 对话框出现时，点击“允许”按钮以启用通知：\n\
  \n![](img/as_enable_notifications.jpg)\n\n图 61-7\n\n应用启动后，将其放入后台并打开“设置”应用。在设置中，选择“应用”选项，选择\
  \ NotifyDemo 项目，并在随后的屏幕上点击“通知”项。通知屏幕应该显示 NotifyDemo News 类别对用户处于激活状态：\n\n![](img/as_app_notifications_enabled.jpg)\n\
  \n图 61-8\n\n在继续之前，确保已为该应用启用通知点。\n\n虽然本示例并非强制要求，但值得注意的是，可以通过调用通知管理器的 `deleteNotificationChannel()`\
  \ 方法从应用内删除通道，并传递要删除的通道 ID：\n\n```java\nString channelID = \"com.ebookfrenzy.notifydemo.news\"\
  ;\nnotificationManager.deleteNotificationChannel(channelID);\n```\n\n## 61.7 创建和发布通知\n\
  \n通知使用 `Notification.Builder` 类创建，并且必须包含图标、标题和内容。打开 `MainActivity.java` 文件并按如下实现\
  \ `sendNotification()` 方法以构建基础通知：\n\n.\n\n.\n\n```java\nimport android.app.Notification;\n\
  import android.view.View;\n```\n\n```public void sendNotification(View view) {\n\
  \    String channelID = \"com.ebookfrenzy.notifydemo.news\";\n    Notification notification\
  \ =\n            new Notification.Builder(MainActivity.this,\n                 \
  \                    channelID)\n            .setContentTitle(\"Example Notification\"\
  )\n            .setContentText(\"This is an example notification.\")\n         \
  \   .setSmallIcon(android.R.drawable.ic_dialog_info)\n            .setChannelId(channelID)\n\
  \            .build();\n}\n```\n\n一旦构建了通知，就需要需要使用 `NotificationManager` 的 `notify()`\
  \ 方法进行发布。访问 `NotificationManager` 并发布通知的代码需要按如下添加到 `sendNotification()` 方法中：\n\n\
  ```java\nprotected void sendNotification(View view) {\n    int notificationID =\
  \ 101;\n    String channelID = \"com.ebookfrenzy.notifydemo.news\";\n    Notification\
  \ notification =\n            new Notification.Builder(MainActivity.this, channelID)\n\
  \            .setContentTitle(\"New Message\")\n            .setContentText(\"You've\
  \ received new messages.\")\n            .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \            .setChannelId(channelID)\n            .build();\n    notificationManager.notify(notificationID,\
  \ notification);\n}\n```\n\n注意，当发布通知时，它会被分配一个通知 ID。该值可以是任何整数，并在稍后更新通知时使用。编译并运行应用，点击主活动上的按钮。当通知图标出现在状态栏中时，从状态栏向下拖动以查看完整通知：\n\
  \n![](img/as_notification.jpg)\n\n图 61-9\n\n点击并按住通知以查看更多信息：\n\n![](img/as_notification_details.jpg)\n\
  \n图 61-10\n\n接下来，将应用放入后台，导航到显示所有应用启动器图标的主屏幕，并注意到 NotifyDemo 启动器图标上了一个通知点，如图 61-11\
  \ 箭头所示：\n\n![](img/as_notification_dot.jpg)\n\n图 61-11\n\n如果未显示该点，请检查设置应用中 NotifyDemo\
  \ 的通知选项，以确认如前所述已启用通知点。如果该点仍未出现，长按设备主屏幕的空白区域，从弹出的菜单中选择“主屏幕设置”并启用“通知点”选项。\n\n在启动器图标上长按将显示一个包含通知的弹出窗口：\n\
  \n![](img/as_app_dot_detail.jpg)\n\n图 61-12\n\n如果一个应用有多个待处理通知，长按菜单将包含通知数量的计数（在上图中高亮显示）。该数字可以通过在构建通知时调用\
  \ `setNumber()` 方法在应用内进行配置：\n\n```java\nNotification notification = new Notification.Builder(MainActivity.this,\
  \ CHANNEL_ID)\n        .setContentTitle(\"Example Notification\")\n        .setContentText(\"\
  This is an example notification.\")\n        .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \        .setChannelId(CHANNEL_ID)\n        .setNumber(10)\n        .build();\n\
  ```\n\n按照目前的实现，点击通知无论在何处访问都没有效果。下一步是配置通知以便在点击时启动一个活动。\n\n## 61.8 从通知启动活动\n\n通知理想情况下应该允许用户执行某种形式的操作，例如启动相应的应用，或响应通知采取其他形式的操作。一个常见需求是在用户点击通知时简单地启动该应用的活动。\n\
  \n这种方法需要启动一个活动并配置一个启动该活动的 `Intent`。假设应用包含一个名为 `ResultActivity` 的活动，意图创建方式如下：\n\n\
  ```java\nIntent resultIntent = new Intent(this, ResultActivity.class);\n```\n\n\
  然后需要将此意图封装在 `PendingIntent` 实例中。`PendingIntent` 设计用于将 `intent` 传递其他应用程序，从而授予这些应用程序在未来某个时刻执行该意图的权限。在这种情况下，`PendingIntent`\
  \ 对象被用于为通知系统提供一种在用户点击通知面板时启动 `ResultActivity` 活动的方式：\n\n```java\nPendingIntent pendingIntent\
  \ =\n    PendingIntent.getActivity(\n        this,\n        0,\n        resultIntent,\n\
  \        PendingIntent.FLAG_IMMUTABLE);\n```\n\n剩下的工作是在构建通知过程中使用 `setContentIntent()`\
  \ 方法分配 `PendingIntent` 对象。\n\n将这些更改结合后，修改后的 `sendNotification()` 方法如下：\n\n.\n\n\
  .\n\n\n\n\n```java\nimport android.app.PendingIntent;\nimport android.content.Intent;\n\
  import android.graphics.drawable.Icon;\n\nprotected void sendNotification(View view)\
  \ {\n    int notificationId = 101;\n    Intent resultIntent = new Intent(this, ResultActivity.class);\n\
  \    PendingIntent pendingIntent =\n            PendingIntent.getActivity(\n   \
  \             this,\n                0,\n                resultIntent,\n       \
  \         PendingIntent.FLAG_IMMUTABLE\n            );\n    String CHANNEL_ID =\
  \ \"com.ebookfrenzy.notifydemo.news\";\n    Notification notification = new Notification.Builder(MainActivity.this,\n\
  \                        CHANNEL_ID)\n            .setContentTitle(\"Example Notification\"\
  )\n            .setContentText(\"This is an example notification.\")\n         \
  \   .setSmallIcon(android.R.drawable.ic_dialog_info)\n            .setChannelId(channelID)\n\
  \            .setContentIntent(pendingIntent)\n            .build();\n    notificationManager.notify(notificationId,\
  \ notification);\n}\n```\n\n再次编译并运行应用，点击按钮并显示通知栏。然而，这次点击通知将导致 `ResultActivity` 启动。\n\
  \n## 61.9 为通知添加操作\n\n为通知添加交互性的另一种方法是创建操作（Actions）。这些操作以按钮的形式出现在通知消息下方，并被设计为用户点击时触发特定的意。如果将以下代码添加到\
  \ `sendNotification()` 方法中，将添加一个标记为“Open”get 操作按钮，选择时将启动引用的 pending intent：\n\n\
  ```java\nfinal Icon icon = Icon.createWithResource(MainActivity.this,\n        android.R.drawable.ic_dialog_info);\n\
  Notification.Action action =\n    new Notification.Action.Builder(icon, \"Open\"\
  , pendingIntent)\n            .build();\nNotification notification = new Notification.Builder(MainActivity.this,\
  \ CHANNEL_ID)\n        .setContentTitle(\"Example Notification\")\n        .setContentText(\"\
  This is an example notification.\")\n        .setSmallIcon(R.drawable.ic_info_24dp)\n\
  \        .setChannelId(channelID)\n        .setContentIntent(pendingIntent)\n  \
  \      .setActions(action)\n        .build();\nnotificationManager.notify(notificationId,\
  \ notification);\n```\n\n将上述代码添加到方法中并运行应用。发布通知并注意通知中出现的 Open 操作（取决于 Android 版本，可能需要在通知面板上向下滑动以显示\
  \ Open 操作）：\n\n![](img/as_notification_action.jpg)\n\n图 61-13\n\n点击操作将触发 pending\
  \ intend 并启动 `ResultActivity`。\n\n## 61.10 合并通知（Bundled Notifications）\n\n如果一个应用倾向于定期发布通知，可能会导致这些通知迅速占满状态栏和通知栏，从而为用户提供欠佳的体验。对于每当有新闻故事或联系人新消息时就会发送通知的新闻或消息应用来说尤为如此。例如图\
  \ 6-14 中的通知：\n\n![](img/as_3.2_unbundled_notifications.jpg)\n\n图 6-14\n\n现在想象如果有十条甚至二十条新消息。为了避免这类问题，Android\
  \ 允许将通知合并。要合并通知，必须通过 `setGroup()` 方法指定每个通知属于同一个组，并且必须发布并配置一个额外的通知作为摘要（Summary）。例如，以下代码创建并发布了上方图\
  \ 6-14 所示的三个通知，但它们合并到了同一个组中。代码还发布了一个作为摘要的通知：\n\n```java\nfinal String GROUP_KEY_NOTIFY\
  \ = \"group_key_notify\";\nNotification.Builder builderSummary =\n    new Notification.Builder(this,\
  \ channelID)\n            .setSmallIcon(android.R.drawable.ic_dialog_info)\n   \
  \         .setContentTitle(\"A Bundle\")\n            .setContentText(\"You have\
  \ 3 new messages\")\n            .setGroup(GROUP_KEY_NOTIFY)\n            .setGroupSummary(true);\n\
  Notification.Builder builder1 =\n    new Notification.Builder(this, channelID)\n\
  \            .setSmallIcon(android.R.drawable.ic_dialog_info)\n            .setContentTitle(\"\
  New Message\")\n            .setContentText(\"You have a new message from Kassidy\"\
  )\n            .setGroup(GROUP_KEY_NOTIFY);\nNotification.Builder builder2 =\n \
  \   new Notification.Builder(this, channelID)\n            .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \            .setContentTitle(\"New Message\")\n            .setContentText(\"You\
  \ have a new message from Caitlyn\")\n            .setGroup(GROUP_KEY_NOTIFY);\n\
  Notification.Builder builder3 =\n    new Notification.Builder(this, channelID)\n\
  \            .setSmallIcon(android.R.drawable.ic_dialog_info)\n            .setContentTitle(\"\
  New Message\")\n            .setContentText(\"You have a new message from Jason\"\
  )\n            .setGroup(GROUP_KEY_NOTIFY);\nint notificationId0 = 100;\nint notificationId1\
  \ = 101;\nint notificationId2 = 102;\nint notificationId3 = 103;\nnotificationManager.notify(notificationId1,\
  \ builder1.build());\nnotificationManager.notify(notificationId2, builder2.build());\n\
  notificationManager.notify(notificationId3, builder3.build());\nnotificationManager.notify(notificationId0,\
  \ builderSummary.build());\n```\n\n当代码执行时，尽管实际上发布了四个通知，状态栏中只会出现一个通知图标。在通知栏中，会显示单个摘要通知，列出每个合并通知的信息：\n\
  \n![](img/2528.jpg)\n\n图 61-15\n\n进一步向下滑动通知条目将展开面板，显示每个合并通知的详情：\n\n![](img/2536.jpg)\n\
  \n图 61-16\n\n\n\n\n\n在 `Name` 字段中输入 `DirectReply`，并指定 `com.ebookfrenzy.directreply`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 33`（Android 12），并将 `Language`\
  \ 菜单设置为 `Java`。按照 11.8 将项目迁移到 View Binding 节列出的步骤修改项目以支持 view binding。\n\n### 62.2\
  \ 设计用户界面\n\n将 `activity_main.xml` 布局文件加载到布局工具中。启用 `Autoconnect` 的情况下，在现有的“Hello\
  \ World!”标签下方添加一个 `Button` 对象，如图图 62-1 所示。在布局中选中 `Button` 组件后，使用 `Attributes` 工具窗口将\
  \ `onClick` 属性设置为调用名为 `sendNotification` 的方法。如有必要，使用 `Infer Constraints` 按钮为布局添加任何缺失的约束。在继续之前，选择“Hello\
  \ World!” `TextView`，并将 `id` 属性更改为 `textView`，并将按钮文本修改为“Notify”。\n\n![](img/as_4.1_direct_reply_ui.jpg)\n\
  \n图 62-1\n\n## 62.3 请求通知权限\n\n在 `Project` 工具窗口中，找到并双击 `AndroidManifest.xml` 文件将其加载到编辑器，并修改\
  \ XML 添加 `permission` 元素：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n\
  <manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    package=\"\
  com.ebookfrenzy.audioapp\" >\n    <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\"\
  \ />\n</manifest>\n```\n\n编辑 `MainActivity.java` 文件，首先添加一些额外的导入指令和常量，用作所请求权限的识别代码：\n\
  \n```java\nimport androidx.annotation.NonNull;\nimport androidx.core.app.ActivityCompat;\n\
  import androidx.core.content.ContextCompat;\nimport android.widget.Toast;\nimport\
  \ android.Manifest;\nimport android.content.pm.PackageManager;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private static final int NOTIFICATION_REQUEST_CODE\
  \ = 101;\n}\n```\n\n接下来，需要在类中添加一个方法，其目的是将要请求的权限和相应的请求识别代码作为参数。留在 `MainActivity.java`\
  \ 类文件中，如下实现该方法：\n\n```java\nprotected void requestPermission(String permissionType,\
  \ int requestCode) {\n    int permission = ContextCompat.checkSelfPermission(this,\n\
  \            permissionType);\n    if (permission != PackageManager.PERMISSION_GRANTED)\
  \ {\n        ActivityCompat.requestPermissions(this,\n                new String[]{permissionType},\
  \ requestCode\n        );\n    }\n}\n```\n\n当请求被处理后，活动上将调用 `onRequestPermissionsResult()`\
  \ 方法，并传递识别代码和请求结果。因此，一步是在 `MainActivity.java` 文件中如下实现此方法：\n\n```java\n@Override\n\
  public void onRequestPermissionsResult(int requestCode,\n            @NonNull String[]\
  \ permissions, @NonNull int[] grantResults) {\n    super.onRequestPermissionsResult(requestCode,\
  \ permissions, grantResults);\n    if (requestCode == NOTIFICATION_REQUEST_CODE)\
  \ {\n        if (grantResults.length == 0\n                || grantResults[0] !=\n\
  \                PackageManager.PERMISSION_GRANTED) {\n            Toast.makeText(this,\n\
  \                    \"Notification permission required\",\n                   \
  \ Toast.LENGTH_LONG).show();\n        }\n    }\n}\n```\n\n在测试应用之前，剩下的工作是在应用启动时调用新添加的\
  \ `requestPermission()` 方法。在 `MainActivity.java` 文件中，如下修改 `onCreate()` 方法：\n\n```java\n\
  @Override\nprotected void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    setContentView(R.layout.activity_main);\n    binding = ActivityMainBinding.inflate(getLayoutInflater());\n\
  \    View view = binding.getRoot();\n    setContentView(view);\n    requestPermission(Manifest.permission.POST_NOTIFICATIONS,\n\
  \            NOTIFICATION_REQUEST_CODE);\n}\n```\n\n## 62.4 创建通知通道\n\n与上一章的示例一样，在发送通知之前必须创建一个通道。编辑\
  \ `MainActivity.java` 文件并添加代码来创建一个新通道：\n\n```java\nimport android.app.NotificationChannel;\n\
  import android.app.NotificationManager;\nimport android.content.Context;\n\npublic\
  \ class MainActivity extends AppCompatActivity {\n    private NotificationManager\
  \ notificationManager;\n    private final String channelID = \"com.ebookfrenzy.direct.reply\"\
  ;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n \
  \       notificationManager = (NotificationManager)\n                getSystemService(Context.NOTIFICATION_SERVICE);\n\
  \        createNotificationChannel(channelID, \"DirectReply News\", \"Example Channel\"\
  );\n    }\n\n    protected void createNotificationChannel(String id,\n         \
  \   String name, String description) {\n        int importance = NotificationManager.IMPORTANCE_HIGH;\n\
  \        NotificationChannel channel =\n            new NotificationChannel(id,\
  \ name, importance);\n        channel.setDescription(description);\n        channel.enableLights(true);\n\
  \        channel.setLightColor(Color.RED);\n        channel.enableVibration(true);\n\
  \        channel.setVibrationPattern(new long[]{100, 200, 300, 400,\n          \
  \      500, 400, 300, 200, 400});\n        notificationManager.createNotificationChannel(channel);\n\
  \    }\n}\n```\n\n### 62.5 构建 RemoteInput 对象\n\n在通知中实现内联直接回复的关键元素是 `RemoteInput`\
  \ 类。之前的章节介绍了 `PendingIntent` 类，并解释了它如何允许应用程序创建一个意图，然后授予其他应用程序启动该意图的能力。在标题为 Android\
  \ 通知教程的章节中，创建允许从通知内部启动原始应用的 pending intent。`RemoteInput` 类允许将用户请求包含在 `PendingIntent`\
  \ 对象中。当 `PendingIntent` 对象中的被触发时（例如启动活动），该活动还将接收用户提供的任何输入。\n\n在通知中实现直接回复的第一步是创建\
  \ `RemoteInput` 对象。这是通过使用 `RemoteInput.Builder()` 方法实现的。构建 `RemoteInput` 对象需要一个字符串，用于从结果意图中提取输入。该对象还需要一个标签字符串，显示在通知的输入字段中。编辑\
  \ `MainActivity.java` 文件并开始实现 `sendNotification()` 方法。注意还添加了一些后续章节将使用的导入指令和变量：\n\
  \n```java\npackage com.ebookfrenzy.directreply;\n\nimport android.app.PendingIntent;\n\
  import android.app.RemoteInput;\nimport android.content.Intent;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n    private static final int notificationId\
  \ = 101;\n    private static final String KEY_TEXT_REPLY = \"key_text_reply\";\n\
  \    private NotificationManager notificationManager;\n    private static final\
  \ String channelID = \"com.ebookfrenzy.directreply.news\";\n\n    public void sendNotification(View\
  \ view) {\n        String replyLabel = \"Enter your reply here\";\n        RemoteInput\
  \ remoteInput =\n            new RemoteInput.Builder(KEY_TEXT_REPLY)\n         \
  \       .setLabel(replyLabel)\n                .build();\n    }\n}\n```\n\n\n\n\n\
  \n既然 `RemoteInput` 对象已经创建并使用键和标签字符串完成了初始化，它需要被放置在通知动作对象内部。在执行该步骤之前，需要先创建 `PendingIntent`\
  \ 实例。\n\n### 62.6 创建 PendingIntent\n\n创建 `PendingIntent` 的步骤与 Android 消息教程章节中概述的步骤相同，不同之处在于意图将配置为启动\
  \ `MainActivity`。留在 `MainActivity.java` 文件中，添加以下代码创建 `PendingIntent`：\n\n```java\n\
  public void sendNotification(View view) {\n    String replyLabel = \"Enter your\
  \ reply here\";\n    RemoteInput remoteInput =\n            new RemoteInput.Builder(KEY_TEXT_REPLY)\n\
  \            .setLabel(replyLabel)\n            .build();\n    Intent resultIntent\
  \ = new Intent(this, MainActivity.class);\n    PendingIntent resultPendingIntent\
  \ =\n            PendingIntent.getActivity(\n                this,\n           \
  \     0,\n                resultIntent,\n                PendingIntent.FLAG_MUTABLE\n\
  \            );\n}\n```\n\n## 62.7 创建回复动作\n\n内联回复将通过通知中的动作按钮访问。现在需要创建此动作，并为其配置图标、显示在按钮上的标签、`PendingIntent`\
  \ 对象以及 `RemoteInput` 对象。修改 `sendNotification()` 方法以添加创建此动作的代码：\n\n```java\nimport\
  \ android.graphics.drawable.Icon;\nimport android.app.Notification;\n\npublic void\
  \ sendNotification(View view) {\n    String replyLabel = \"Enter your reply here\"\
  ;\n    RemoteInput remoteInput =\n            new RemoteInput.Builder(KEY_TEXT_REPLY)\n\
  \            .setLabel(replyLabel)\n            .build();\n    Intent resultIntent\
  \ = new Intent(this, MainActivity.class);\n    PendingIntent resultPendingIntent\
  \ =\n            PendingIntent.getActivity(\n                this,\n           \
  \     0,\n                resultIntent,\n                PendingIntent.FLAG_MUTABLE\n\
  \            );\n    final Icon icon =\n            Icon.createWithResource(MainActivity.this,\n\
  \                android.R.drawable.ic_dialog_info);\n    Notification.Action replyAction\
  \ =\n            new Notification.Action.Builder(\n                icon,\n     \
  \           \"Reply\", resultPendingIntent)\n            .addRemoteInput(remoteInput)\n\
  \            .build();\n}\n```\n\n在教程的这一阶段，我们已经构建了可以使用的 `RemoteInput`、`PendingIntent`\
  \ 和 `Action` 对象。下一阶段是构建并发布通知：\n\n```java\npublic void sendNotification(View view)\
  \ {\n    String replyLabel = \"Enter your reply here\";\n    RemoteInput remoteInput\
  \ =\n            new RemoteInput.Builder(KEY_TEXT_REPLY)\n            .setLabel(replyLabel)\n\
  \            .build();\n    Intent resultIntent = new Intent(this, MainActivity.class);\n\
  \    PendingIntent resultPendingIntent =\n            PendingIntent.getActivity(\n\
  \                this,\n                0,\n                resultIntent,\n    \
  \            PendingIntent.FLAG_IMMUTABLE\n            );\n    final Icon icon =\n\
  \        Icon.createWithResource(MainActivity.this,\n            android.R.drawable.ic_dialog_info);\n\
  \    Notification.Action replyAction =\n        new Notification.Action.Builder(\n\
  \            icon,\n            \"Reply\", resultPendingIntent)\n        .addRemoteInput(remoteInput)\n\
  \        .build();\n    Notification newMessageNotification =\n        new Notification.Builder(this,\
  \ channelID)\n            .setColor(ContextCompat.getColor(this,\n             \
  \   android.R.color.holo_blue_dark))\n            .setSmallIcon(\n             \
  \   android.R.drawable.ic_dialog_info)\n            .setContentTitle(\"My Notification\"\
  )\n            .setContentText(\"This is a test message\")\n            .addAction(replyAction).build();\n\
  \    NotificationManager notificationManager =\n        (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);\n\
  \    notificationManager.notify(notificationId, newMessageNotification);\n}\n```\n\
  \n完成更改后，编译并运行应用，允许通知，并测试点击按钮是否会发布通知。当查看通知栏时，通知应该如图 62-2 所示：\n\n![](img/as_direct_reply.jpg)\n\
  图 62-2\n\n点击“回复”（Reply）动作，使文本输入框，并显示在创建 `RemoteInput` 对象时嵌入的回复标签。\n\n![](img/as_direct_reply_enter.jpg)\n\
  图 62-3\n\n输入一些文本并点击位于输入字段末尾的发送按钮。\n\n### 62.8 接收直接回复\n\n现在通知已成功向用户索取输入，应用需要对该输入进行处理。本教程的目标是让用户输入的文本显示在活动界面的\
  \ `TextView` 控件上。\n\n当用户输入文本并点击发送按钮时，`MainActivity` 将通过 `PendingIntent` 对象中包含的 `intent`\
  \ 启动。该意图中包含了用户通过通知输入的文本。在 的 `onCreate()` 方法中，调用 `getIntent()` 方法将返回启动该启动的 `intent`\
  \ 副本。将其传递给 `RemoteInput.getResultsFromIntent()` 方法，反将返回一个包含回复文本的 `Bundle` 对象，该文本可以被提取并赋值给\
  \ `TextView` 控件。这导致 `MainActivity.java` 文件中的 `onCreate()` 方法被修改为：\n\n```java\n@Override\n\
  protected void onCreate(Bundle savedInstanceState) {\n    createNotificationChannel(channelID,\
  \ \"Direct Reply\", \"Example News Channel\");\n    handleIntent();\n}\n\nprivate\
  \ void handleIntent() {\n    Intent intent = this.getIntent();\n    Bundle remoteInput\
  \ = RemoteInput.getResultsFromIntent(intent);\n    if (remoteInput != null) {\n\
  \        String inputString = remoteInput.getCharSequence(KEY_TEXT_REPLY).toString();\n\
  \        binding.textView.setText(inputString);\n    }\n}\n```\n\n完成代码更改后，再次构建并运行应用。点击按钮发布通知，并在通知面板内输入并发送文本。注意\
  \ `MainActivity` 中的 `TextView` 控件已更新以显示内联文本。\n\n### 62.9 更新通知\n\n在通知中回复后，你可能注意到通知面板中的进度指示如图\
  \ 62-4 所示继续旋转：\n\n![](img/as_direct_reply_progress.jpg)\n图 62-4\n\n通知显示此指示是因为它正在等待活动确认接收到发送的文本。执行此任务的建议方法新消息更新通知，指示回复已接收并处理。由于原始通知在发布时已分配了\
  \ ID，可以再次使用它执行更新。将以下代码添加到 `handleIntent()` 方法中以执行此任务：\n\n```java\nprivate void handleIntent()\
  \ {\n    Intent intent = this.getIntent();\n    Bundle remoteInput = RemoteInput.getResultsFromIntent(intent);\n\
  \    if (remoteInput != null) {\n        String inputString = remoteInput.getCharSequence(KEY_TEXT_REPLY).toString();\n\
  \        binding.myTextView.setText(inputString);\n        Notification repliedNotification\
  \ =\n```\n\n\n\n\n\n```java\nnew Notification.Builder(this, channelID)\n    .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \    .setContentText(\"Reply received\")\n    .build();\nnotificationManager.notify(notificationId,\
  \ repliedNotification);\n}\n```\n\n最后再次测试应用，并验证在发送内联回复文本后，进度指示器会消失，并且会出现一个新面板显示回复已收到：\n\
  \n![](img/as_direct_reply_received.jpg)\n图 62-5\n\n### 62.10 总结\n\n直接回复通知功能允许用户在通知内输入文本，并通过意图（intent）传递给相应应用程序的活动（activity）。直接回复功能是通过\
  \ `RemoteInput` 类实现的，该类的实例可以嵌入到操作（action）中并与通知一起打包。在处理直接回复通知时，让 `NotificationManager`\
  \ 服务知道已接收并处理了回复是非常重要的。实现这一点的最佳方法是使用首次发布通知时提供的 `notification ID` 简单更新通知消息。\n\n##\
  \ 63. 折叠屏设备与多窗口支持\n\n无论我们是否准备好，折叠屏设备都会到来（对于第一代三星 Galaxy Fold 来说，甚至在设备本身准备好之前就出现了）。为了准备这一类新设备，了解应该采取的某些额外步骤，以确保你的应用在折叠屏设备上运行正常是非常重要的。\n\
  \n幸运的是，支持折叠屏设备的大部分行为已经以多窗口支持的形式存在于 Android 中。\n\n### 63.1 折叠屏与多窗口支持\n\n当应用在折叠屏设备上运行时，它可能会与其他应用共享屏幕，并遇到重大的配置更改（例如当用户折叠或展开显示器时屏幕发生变化）。如果你的应用已经设计为可以处理设备方向变化，那么它很可能也能处理由屏幕折叠引起的变化，尽管建议进行彻底测试。\n\
  \n多窗口支持最初是在 Android 7 中引入的。与之前的 Android 版本不同，Android 7 中的多窗口支持允许在设备屏幕上同时显示多个活动。\n\
  \nAndroid 中的多窗口支持提供了三种不同的窗口支持形式。分屏模式（Split-screen mode）适用于大多数手机、折叠屏和平板设备，它提供了一个分屏环境，其中两个活动并排或上下排列显示。系统提供了一个可移动的分割线，用户拖动它时可以调整分配给相邻两个活动的屏幕百分比：\n\
  \n![](img/Image24272.jpg)\n图 63-1\n\n自由窗口模式（Freeform mode）为大屏幕设备提供了一种窗口化环境，目前由设备制造商决定是否启用。自由窗口与分屏模式的区别在于，它允许每个活动在独立的、可调整大小的窗口中出现，并且不限于同时显示两个活动。例如，[图\
  \ 63-2] 显示了一个处于自由窗口模式的设备，其中计算器和第二个应用显示在独立的窗口中：\n\n![](img/Image24362.jpg)\n图 63-2\n\
  \n画中画支持（Picture-in-picture support）正如其名所言，它允许视频播放在用户执行其他任务时在较小的窗口中继续运行，该主题将从名为[Android\
  \ 画中画模式]的章节开始介绍。\n\n### 63.2 使用折叠屏模拟器\n\n尽管在编写本文时，市场上还没有可以进行应用测试的折叠屏设备，但 Android\
  \ SDK 包含了折叠屏模拟器。要创建一个折叠屏模拟器，选择 `Android Studio Tools -> AVD Manager` 菜单选项，点击 `Create\
  \ Virtual Device` 按钮，并在硬件选择屏幕上从下方[图 63-3]所示的 `Foldable` 选项中选择一个：\n\n![](img/as_foldable_device_template.jpg)\n\
  图 63-3\n\n在选择折叠屏选项后，继续创建过程，选择 `Android 10 API 29` 或更高版本作为系统镜像。\n\n一旦模拟器启动运行，工具栏中会出现一个额外的按钮，允许模拟器在折叠和展开的配置之间进行切换：\n\
  \n![](img/as_3.5_foldable_emulator_fold_button.jpg)\n图 63-4\n\n### 63.3 进入多窗口模式\n\
  \n可以通过显示概览（Overview）屏幕、长按应用图标并选择如图 63-5 所示的分屏模式（Split screen）菜单进入分屏模式：\n\n![](img/as_3.5_split_screen_button.jpg)\n\
  图 63-5\n\n进入分屏模式后，概览按钮将变为显示两个矩形（图 63-6 中标记为 A），当前活动将占据屏幕的一部分 (B)，概览屏幕允许选择第二个活动 (C)：\n\
  \n![](img/as_3.5_select_screen.jpg)\n图 63-6\n\n一旦选择了第二个应用，屏幕将被平分。要退出分屏模式，只需将分离两个活动的分割线拖动到远端，使其中一个活动占据整个屏幕。\n\
  \n### 63.4 启用并使用自由窗口支持\n\n虽然在所有设备上都未获得官方支持，但在大型设备和模拟器上启用自由窗口多窗口模式。要启用此模式，请在模拟器运行或设备已连接时运行以下\
  \ `adb` 命令：\n\n```\nadb shell settings put global enable_freeform_support 1\n```\n\
  \n在进行此更改后，可能需要重启设备设置才会生效。\n\n一旦启用，在概览屏幕上长按应用图标时，会出现一个额外的选项，如图 63-7 所示：\n\n![](img/as_3.5_freeform_button.jpg)\n\
  图 63-7\n\n### 63.5 检查自由窗口支持\n\n正如本章节前面提到的，Google 将启用自由窗口多窗口模式的选择权交给了各个 Android 设备制造商。由于自由窗口只在大屏幕设备上才有意义，因此无法保证应用可能运行的每个设备上都有自由窗口。幸运的是，如果设备不支持自由窗口，系统所有特定的自由窗口的方法和属性都会被忽略，因此使用它们不会导致应用在非自由窗口设备上崩溃。然而，在某些情况下，可能需要检测设备是否支持自由窗口多窗口模式。可以通过在包管理器中检查自由窗口管理功能来实现。以下代码示例检查自由窗口支持并根据测试结果返回\
  \ `Boolean` 值：\n\n```java\npublic Boolean checkFreeform() {\n    return getPackageManager().hasSystemFeature(\n\
  \        PackageManager.FEATURE_FREEFORM_WINDOW_MANAGEMENT);\n}\n```\n\n### 63.6\
  \ 在应用中启用多窗口支持\n\n清单文件中的 `android:resizableActivity` 设置控制应用是否支持多窗口行为。此设置可以在应用程序级或单个活动级进行。例如，以下片段配置了名为\
  \ `MainActivity` 的活动以支持分屏和自由窗口多窗口模式：\n\n```xml\n<activity\n```\n\n\n\n\n\n```xml\n\
  <activity\n    android:name=\".MainActivity\"\n    android:resizeableActivity=\"\
  true\"\n    android:label=\"@string/app_name\"\n    android:theme=\"@style/AppTheme.NoActionBar\"\
  >\n    <intent-filter>\n        <action android:name=\"android.intent.action.MAIN\"\
  \ />\n        <category android:name=\"android.intent.category.LAUNCHER\" />\n \
  \   </intent-filter>\n</activity>\n```\n\n将该属性设置为 `false` 将防止 Activity 出现在分屏或自由窗口（freeform）模式中，并且相应的按钮将不会出现在应用的概览菜单中。如果在分屏配置中选择一个禁用了多窗口支持的\
  \ Activity 作为第二个 Activity，将显示一条消息，指示该应用可能不支持多窗口模式。\n\n### 63.7 指定多窗口属性\n\n`<layout>`\
  \ 元素提供了若干属性，用于指定 Activity 在多窗口模式下启动时的尺寸和位置。当在自由窗口模式下启动时，Activity 的初始高度、宽度和位置可以使用以下属性指定：\n\
  \n* `android:defaultWidth` – 指定 Activity 的默认宽度。\n* `android:defaultHeight` – 指定\
  \ Activity 的默认高度。\n* `android:gravity` – 指定 Activity 的初始位置（start、end、left、right、top\
  \ 等）。\n\n注意，上述属性仅在 Activity 在自由窗口模式下显示时生效。以下示例配置了 Activity 在屏幕起始边缘的顶部以特定的高度和宽度显示：\n\
  \n```xml\n<activity android:name=\".MainActivity \">\n    <layout\n        android:defaultHeight=\"\
  350dp\"\n        android:defaultWidth=\"450dp\"\n        android:gravity=\"start|end\"\
  \ />\n</activity>\n```\n\n以下 `<layout>` 属性可指定 Activity 在分屏视图或自由窗口模式下可以缩小的最小宽度和高度：\n\
  \n* `android:minimalHeight` – 指定 Activity 在分屏或自由窗口模式下可以缩减的最小高度。\n* `android:minimalWidth`\
  \ - 指定 Activity 在分屏或自由窗口模式下可以缩减的最小宽度。\n\n当用户将分屏分割线滑出最小高度或宽度边界时，系统将停止调整收缩 Activity\
  \ 的布局，并简单地裁剪用户界面以为相邻的 Activity 留出空间。\n\n以下 Manifest 文件片段为 Activity 实现了最小宽度和高度属性：\n\
  \n```xml\n<activity android:name=\".MainActivity \">\n    <layout\n        android:minimalHeight=\"\
  400dp\"\n        android:minimalWidth=\"290dp\" />\n</activity>\n```\n\n## 63.8\
  \ 在 Activity 中检测多窗口模式\n\n可能会出现这种情况：Activity 需要检测其当前是否正以多窗口模式显示给用户。可以通过调用 `Activity`\
  \ 类的 `isInMultiWindowMode()` 方法获取当前状态。调用时，该方法返回 `true` 或 `false` 值，取决于 Activity\
  \ 当前是否为全屏：\n\n```java\nif (this.isInMultiWindowMode()) {\n    // Activity 正在多窗口模式运行\n\
  } else {\n    // Activity 不在多窗口模式\n}\n```\n\n### 63.9 接收多窗口通知\n\n如果 Activity 重写了\
  \ `onMultiWindowModeChanged()` 回调方法，将收到进入或退出多窗口模式的通知。传递给方法的第一个参数在进入多窗口模式时为 `true`，在\
  \ Activity 退出该模式时为 `false`。新的配置设置包含在作为第二个参数传递的 `Configuration` 对象中：\n\n```java\n\
  @Override\npublic void onMultiWindowModeChanged(boolean isInMultiWindowMode,\n \
  \                                    Configuration newConfig) {\n    super.onMultiWindowModeChanged(isInMultiWindowMode,\
  \ newConfig);\n    if (isInMultiWindowMode) {\n        // Activity 已进入多窗口模式\n  \
  \  } else {\n        // Activity 已退出多窗口模式\n    }\n}\n```\n\n正如名为“处理 Android Activity\
  \ 状态变化”的章节概述的那样，Android 10 及更高版本允许多个 Activity 同时处于恢复（resumed）状态（也称为多恢复，multi-resume）。用户最近交互的\
  \ Activity 被称为最顶层恢复 Activity（topmost resumed activity）。为了跟踪 Activity 获得和丢失顶层恢复状态的过程，可以实现\
  \ `onTopmostResumedChanged()` 方法，例如：\n\n```java\n@Override\npublic void onTopmostResumedChanged(boolean\
  \ isTopmostResumed) {\n    if (isTopmostResumed) {\n        // Activity 现在是顶层恢复状态\n\
  \    } else {\n        // Activity 不再是顶层恢复状态\n    }\n}\n```\n\n在运行 Android 9 的设备上，也可以通过在\
  \ manifest 中启用以下属性来利用多恢复功能：\n\n```xml\n<meta-data android:name=\"android.allow_multiple_resumed\"\
  \ android:value=\"true\" />\n```\n\n## 63.10 在多窗口模式下启动 Activity\n\n在本书的“Android\
  \ Intents – 一个工作示例”章节中，创建了一个示例，其中 Activity 使用 intent 启动第二个 Activity。默认情况下，通过 intent\
  \ 启动的 Activity 被认为与源 Activity 位于同一个栈中。然而，通过向 intent 传递适当的标志，可以将 Activity 启动到一个新的任务（task）。要将\
  \ Activity 启动到新任务中，必须在启动前对 intent 设置以下标志：\n\n* `Intent.FLAG_ACTIVITY_ADJACENT`\n\
  * `Intent.FLAG_ACTIVITY_MULTIPLE_TASK`\n* `Intent.FLAG_ACTIVITY_NEW_TASK`\n\n以下代码配置并启动了一个设计为窗口显示的第二个\
  \ Activity：\n\n```java\nIntent i = new Intent(this, SecondActivity.class);\ni.addFlags(Intent.FLAG_ACTIVITY_ADJACENT\
  \ |\n           Intent.FLAG_ACTIVITY_MULTIPLE_TASK |\n           Intent.FLAG_ACTIVITY_NEW_TASK);\n\
  startActivity(i);\n```\n\n## 63.11 配置自由窗口 Activity 的尺寸和位置\n\n默认情况下，在自由窗口模式下启动到不同任务栈的\
  \ Activity 将根据系统指定的尺寸在屏幕中心定位。此窗口的位置和维度可以通过 `ActivityOptions` 类向 intent 传递启动边界（launch\
  \ bounds）设置来控制。此过程的第一步是创建一个 `Rect` 对象，配置 Activity 窗口的左(X)、顶部(Y)、右侧(X)和底部(Y)坐标。以下示例创建了一个\
  \ `Rect` 对象，其左上角位于坐标 (0, 0)，右下角位于 (100, 100)：\n\n```java\nRect rect = new Rect(0,\
  \ 0, 100, 100);\n```\n\n下一步是创建 `ActivityOptions` 类的基础实例，并通过 `setLaunchBounds()`\
  \ 方法使用 `Rect` 设置进行初始化：\n\n```java\nActivityOptions options = ActivityOptions.makeBasic();\n\
  ActivityOptions bounds = options.setLaunchBounds(rect);\n```\n\n最后，将 `ActivityOptions`\
  \ 实例转换为 `Bundle` 对象，并与 `Intent` 对象一起传递给 `startActivity()` 方法：\n\n```java\nstartActivity(i,\
  \ bounds.toBundle());\n```\n\n结合这些步骤后，代码序列如下：\n\n\n\n\n\n```java\nIntent i = new\
  \ Intent(this, SecondActivity.class);\n\ni.addFlags(Intent.FLAG_ACTIVITY_LAUNCH_ADJACENT|\n\
  \           Intent.FLAG_ACTIVITY_MULTIPLE_TASK|\n           Intent.FLAG_ACTIVITY_NEW_TASK);\n\
  \nRect rect = new Rect(100, 800, 900, 700);\n\nActivityOptions options = ActivityOptions.makeBasic();\n\
  \nActivityOptions bounds = options.setLaunchBounds(rect);\n\nstartActivity(i, bounds.toBundle());\n\
  ```\n\n当源 Activity 处于自由窗口（freeform）模式时通过意图启动第二个 Activity，新的活动窗口将按照 `Rect` 对象定义的位置和尺寸出现。\n\
  \n### 63.12 总结\n\nAndroid 7 引入了多窗口支持，这是一种允许在屏幕上同时显示多个 Activity 的系统。这一功能现在形成了为折叠设备提供支持的基础。多窗口支持提供了三种模式：分屏（split-screen）、自由窗口（freeform）和画中画（picture-in-picture）。在分屏模式下，屏幕被水平或垂直分为两个窗格，每个窗格中显示一个\
  \ Activity。自由窗口模式仅支持某些 Android 设备，它允许每个 Activity 出现在独立的、可移动且可调整大小的窗口中。正如本章概述，Android\
  \ SDK 提供了许多方法和属性设置，用于检测、响应和控制应用内部的多窗口行为。\n\n### 64. Android SQLite 数据库概览\n\n那些不需要存储至少某些持久化数据的移动应用程序寥寥无几。数据库的使用是大多数应用程序不可或缺的方面，从几乎完全由数据驱动的应用，到只需要存储少量数据（如游戏的当前得分）的应用比不一。\n\
  \n考虑到典型 Android 应用生命周期具有某种瞬态性，持久化数据存储的重要性变得更加显现。由于 Android 运行时系统随时可能终止应用程序组件以释放资源，制定一个全面的数据存储策略以避免数据丢失，是任何应用开发策略设计和实现的关键因素。\n\
  \n本章将概述 Android 操作系统捆绑的 SQLite 数据库管理系统，并列出用于方便在 Android 内部实现基于 SQLite 的持久化数据库存储的\
  \ Android SDK 类。然而，在深入探讨 Android 开发背景下的 SQLite 细节之前，将对数据库和 SQL 进行简要概述。\n\n### 64.1\
  \ 理解数据库表\n\n数据库表（Database Tables）提供了数据库中最基础的数据结构级别。每个数据库可以包含多个表，每个表都设计用于存储特定类型的信息。例如，数据库可能包含一个客户表（customer\
  \ table），其中包含特定业务每位客户的姓名、地址和电话。同一个数据库可能还包含一个产品表（products table），用于存储该业务销售商品的产品描述以及相关的产品代码。\n\
  \n数据库中的每个表都分配有一个名称，该名称在该特定数据库中必须是唯一的。表名一旦分配给某个数据库中的表，除非在另一个数据库的范围内，否则不能用于另一个表。\n\
  \n#### 64.2 引入数据库模式（Database Schema）\n\n数据库模式（Database Schemas）定义了存储在数据库表中的数据的特征。例如，客户数据库表的模式可能定义客户名称为长度不超过\
  \ 20 个字符的字符串，客户电话为特定格式的数值数据字段。\n\n模式还用于定义整个数据库的结构以及每个数据库中包含各种表之间的关系。\n\n### 64.3\
  \ 列与数据类型\n\n在此阶段，将数据库表视为类似于电子表格（spreadsheet），数据存储在行和列中是有帮助的。\n\n每一列代表对应表中的一个数据字段。例如，表中的姓名、地址和电话数据字段都是列。\n\
  \n每一列又被定义为包含特定类型的数据。因此，设计用于存储数字的列将被定义为包含数值数据。\n\n#### 64.4 数据库行（Database Rows）\n\
  \n保存到表中的每个新记录都存储在行中。每一行又由与保存记录关联的数据列组成。\n\n再次考虑本章较早描述的电子表格类比。客户表中的每个条目都等于电子表格中的某行，每一列都包含每位客户的数据（姓名、地址、电话等）。当向表中添加新客户时，会创建一个新行，并将该客户的数据存储在该行的行的对应列中。\n\
  \n行有时也被称为记录（records）或条目（entries），这些术语通常可以互换使用。\n\n#### 64.5 引入主键（Primary Keys）\n\
  \n每个数据库表都应该包含一个或多个列，用于唯一地标识表中的每一行。这在数据库术语中被称为主键（Primary Key）。例如，一个表可以使用银行账户号列作为主键。或者，客户表可以使用客户的社会安全码作为主键。\n\
  \n主键允许数据库管理系统唯一地标识表中的特定行。如果没有主键，将无法检索或删除表中的特定行，因为无法确定是否选择了正确的行。例如，假设存在一个表，客户的姓氏被定义为主键。想象一下，如果数据库中记录了多个姓为“Smith”的客户，可能会出现什么问题。如果没有某种保证的方法来唯一地标识特定行，就无法确保在任何给定时间都访问了正确的数据。\n\
  \n主键可以由表中的单列或多列组成。要符合单列主键的标准，任意行不能包含相同的主键值。当使用多个列构造主键时，单个列的值不需要唯一，但所有列的值组合起来必须是唯一的。\n\
  \n#### 64.6 什么是 SQLite？\n\nSQLite 是一种嵌入式关系数据库管理系统（RDBMS）。大多数关系数据库（Oracle、SQL Server\
  \ 和 MySQL 是主要示例）都是独立运行并与需要数据库访问的应用协作的服务器进程。SQLite 被称为嵌入式是因为是以库的形式链接到应用程序中的。因此，后台没有运行独立的数据库服务器。所有的数据库操作都通过调用\
  \ SQLite 库包含的函数在应用程序内部处理。\n\nSQLite 的开发者已将该技术置于公有领域，结果是它现在是一个广泛部署的数据库解决方案。\n\nSQLite\
  \ 使用 C 语言编写，因此，Android SDK 提供了一个围绕底层数据库接口的 Java 包装器（wrapper）。这本质上由一组可以在应用程序的 Java\
  \ 或 Kotlin 代码中用于创建和管理基于 SQLite 的数据库的类组成。\n\n有关 SQLite 的更多信息请参考 [`www.sqlite.org`](https://www.sqlite.org)。\n\
  \n64.7 结构化查询语言 (SQL)\n\n在 SQLite 数据库中使用名为结构化查询语言的高级语言访问数据。这通常缩写为 SQL 并读作 sequel。SQL\
  \ 是大多数关系数据库管理系统使用的标准语言。SQLite 大部分符合 SQL-92 标准。\n\n\n\n\nSQL 本质上是一种非常简单且易于使用的语言，专为实现数据库数据的读写而设计。由于\
  \ `SQL` 包含一组较小的关键字，因此可以快速学习。此外，大多数 DBMS 实现之间的 `SQL` 语法在很大程度上是相同的，因此在为某个系统学习了 `SQL`\
  \ 后，你的技能很可能会迁移到其他数据库管理系统中。\n\n虽然本章将使用一些基础的 `SQL` 语句，但对 `SQL` 的详细概述超出了本书的范范围。然而，还有许多其他资源可以提供比我们在此章节中能提供的要详尽得多的\
  \ `SQL` 概述。\n\n### 64.8 在 Android 虚拟设备 (AVD) 上尝试 SQLite\n\n对于对通用数据库（尤其是 `SQLite`）不熟悉的读者来说，直接开始创建一个使用\
  \ `SQLite` 的 Android 应用程序可能有些令人生畏。幸运的是，Android 自带预装了 `SQLite`，其中包含一个交互式环境，允许在连接到运行中的\
  \ Android AVD 模拟器实例的 `adb` shell 会话中直接发布 `SQL` 命令。这既是学习 `SQLite` 和 `SQL` 的有效方法，也是识别运行在模拟器的应用程序所创建的数据库问题的价值工具。\n\
  \n要启动交互式 `SQLite` 会话，首先要运行 AVD 会话。这可以在 Android Studio 中通过启动 Android 虚拟设备管理器（`Tools\
  \ -> AVD Manager`），选择一个之前配置过的 AVD 并点击启动按钮来实现。\n\n一旦 AVD 启动并运行，打开终端或命令提示符窗口，并使用以下\
  \ `adb` 命令行工具连接到模拟器（注意 `-e` 标志指示工具查找一个可以连接的模拟器，而不是物理设备）：\n\n```bash\nadb –e shell\n\
  ```\n\n连接后，shell 环境将提供一个命令提示符，可以在其中输入命令。首先使用 `su` 命令获取超级用户权限：\n\n```bash\nGeneric_x86:/\
  \ su\nroot@android:/ #\n```\n\n如果出现显示不允许超级用户权限的消息，很可能是因为该 AVD 实例包含了 Google Play\
  \ 支持。要解决这个问题，请创建一个新的 AVD，并在“选择设备定义”屏幕上，选择一个在“Play Store”列中没有标记的设备。\n\n存储在 `SQLite`\
  \ 数据库中的数据实际上存储在运行应用程序的 Android 设备文件系统的数据库文件中。默认情况下，这些数据库文件的文件系统路径如下：\n\n`/data/data/<package\
  \ name>/databases/<database filename>.db`\n\n例如，如果一个包名为 `com.example.MyDBApp` 的应用程序创建一个名为\
  \ `mydatabase.db` 的数据库，则设备上的文件路径将如下：\n\n`/data/data/com.example.MyDBApp/databases/mydatabase.db`\n\
  \n因此，为了进行练习，请在 `adb` shell 中切换目录到 `/data/data` 并创建一个适用于某些 `SQLite` 实验的子目录结构：\n\n\
  ```bash\ncd /data/data\nmkdir com.example.dbexample\ncd com.example.dbexample\n\
  mkdir databases\ncd databases\n```\n\n为数据库文件创建合适的位置后，按照如下方式启动交互式 `SQLite` 工具：\n\n\
  ```bash\nroot@android:/data/data/databases # sqlite3 ./mydatabase.db\nsqlite3 ./mydatabase.db\n\
  SQLite version 3.8.10.2 2015-05-20 18:17:19\nEnter \".help\" for usage hints.\n\
  sqlite>\n```\n\n在 `sqlite>` 提示符下，可以输入命令来执行诸如创建表、插入和检索数据等任务。例如，要在我们的数据库中创建一个包含存储\
  \ ID、名称、地址和电话号码字段的新表，需要以下语句：\n\n```sql\ncreate table contacts (_id integer primary\
  \ key autoincrement, name text, address text, phone text);\n```\n\n注意，表中的每一行都应该有一个对该行唯一的主键。在上面的示例中，我们指定\
  \ `_id` 字段为主键，将其声明为 `integer` 类型，并要求 `SQLite` 在每次添加新行时自动增加该数字。这是确保每行都有唯一主键的常用方法。在大多数其他平台上，主键名称的选取是任意的。然而，在\
  \ Android 的情况下，该键必须命名为 `_id`，以便能够使用所有的 Android 数据库相关类完全访问数据库。其余字段每个都被声明为 `text`\
  \ 类型。\n\n要列出当前所选数据库中的表，请使用 `.tables` 语句：\n\n```sql\nsqlite> .tables\ncontacts\n\
  ```\n\n向表中插入记录：\n\n```sql\nsqlite> insert into contacts (name, address, phone) values\
  \ (\"Bill Smith\", \"123 Main Street, California\", \"123-555-2323\");\nsqlite>\
  \ insert into contacts (name, address, phone) values (\"Mike Parks\", \"10 Upping\
  \ Street, Idaho\", \"444-444-1212\");\n```\n\n从表中检索所有行：\n\n```sql\nsqlite> select\
  \ * from contacts;\n1|Bill Smith|123 Main Street, California|123-555-2323\n2|Mike\
  \ Parks|10 Upping Street, Idaho|444-444-1212\n```\n\n提取符合特定标准的行：\n\n```sql\nsqlite>\
  \ select * from contacts where name=\"Mike Parks\";\n2|Mike Parks|10 Upping Street,\
  \ Idaho|444-444-1212\n```\n\n退出 `sqlite3` 交互环境：\n\n```sql\nsqlite> .exit\n```\n\n\
  \n\n`Room` 持久化库包含在 Android Architecture Components 中，专门设计用于让为 Android 应用添加数据库存储支持变得更加容易，且这种方式符合\
  \ Android 架构指南。在上一章涵盖了 SQLite 数据库基础知识之后，本章将探索基于 `Room` 的数据库管理背后的基本概念、在 Android 应用中实现\
  \ `Room` 支持的协作工作关键元素，以及这些元素在架构和编码方面是如何实现的。在涵盖这些主题后，接下来的两章通过示例 `Room` 数据库项目的形式将这些理论付诸实践。\n\
  \n## 65.1 重新审视现代应用架构\n\n名为[使用 Jetpack 构建现代 Android 应用架构]的章节介绍了现代应用架构的概念，并强调了分离应用内不同职责区域的重要性。[图\
  \ 65-1] 所示的图表概述了典型 Android 应用的推荐架构：\n\n![](img/room_diagram_1.jpg)\n\n图 65-1\n\n\
  在本书的前几个章节中已经详细介绍了了该架构的顶部三层，现在是时候在 `Room` 持久化库的背景下，开始探索存储库（repository）和数据库架构层了。\n\
  \n### 65.2 Room 数据库持久化的关键元素\n\n在章节稍后进入详细讨论之前，首先值得总结使用 `Room` 持久化库处理 SQLite 数据库涉及的关键元素：\n\
  \n### 65.2.1 存储库 (Repository)\n\n如之前所述，存储库模块包含了直接处理应用使用的所有数据源所需代码。这避免了 UI 控制器和 `ViewModel`\
  \ 包含直接访问数据库或网络服务的代码。\n\n### 65.2.2 Room Database\n\n`room` 数据库对象提供了指向底层 SQLite 数据库的接口。它还为存储库提供了访问数据访问对象\
  \ (`DAO`) 的应用程序应该只有一个 `room` 数据库实例，该实例可以用于访问多个数据库表。\n\n#### 65.2.3 数据访问对象 (DAO)\n\
  \n`DAO` 包含了存储库在 SQLite 数据库中插入、检索和删除数据所需的 SQL 语句。这些 SQL 语句映射到方法，然后从存储库内部调用这些方法来执行相应的查询。\n\
  \n#### 65.2.4 实体 (Entities)\n\n实体是定义数据库中表模式的类，它定义了表名、列名和数据类型，并指定哪一列作为主键。除了声明表模式外，实体类还包含提供对这些数据字段访问的\
  \ getter 和 setter 方法。由 `DAO` 响应 SQL 查询方法调用返回给存储库的数据将以这些实体类实例的形式存在。然后将调用 getter 方法从实体对象中提取数据。同样，当存储库需要向数据库写入新记录时，它会创建一个实体实例，通过\
  \ setter 调用配置对象上的值，然后调用在 `DAO` 中声明的 `insert` 方法，传递要保存的实体实例。\n\n#### 65.2.5 SQLite\
  \ 数据库\n\n负责存储和提供数据访问的 SQLite 数据库。应用代码（包括存储库）绝不直接访问此底层数据库。所有的数据库操作都通过 `room` 数据库、`DAOs`\
  \ 和实体的组合来完成。\n\n[图 65-2] 中的架构图说明了这些不同元素如何交互，以便在 Android 应用中提供基于 `Room` 的数据库存储：\n\
  \n![](img/room_architecture_diagram.jpg)\n\n图 65-2\n\n上述架构图中的带数字的连接可以总结如下：\n\n1.\
  \ 存储库与 `Room` 数据库交互以获取数据库实例，反过来，该实例用于获取 `DAO` 实例的引用。\n2. 存储库创建实体实例并使用数据配置它们，然后将它们传递给\
  \ `DAO` 用于搜索和插入操作。\n3. 存储库调用 `DAO` 上的方法并传递要插入数据库的实体，并在响应搜索查询时返回实体实例。\n4. 当 `DAO`\
  \ 有结果要返回给存储库时，它将这些结果封装成实体对象。\n5. `DAO` 与 `Room` 数据库交互以启动数据库操作并处理结果。\n6. `Room` 数据库处理所有与底层\
  \ SQLite 数据库的低级交互，提交查询并接收结果。\n\n在涵盖了使用 `Room` 持久库访问数据库的关键元素的基本大纲后，现在是时候详细地探索实体、`DAOs`、`room`\
  \ 数据库和存储库了。\n\n### 65.3 理解实体\n\n每个数据库表都将关联一个实体类。该类定义了表的模式，并表现为标准的 Java 类，其中穿插了一些特殊的\
  \ Room 注解。一个声明要存储在数据库表中的数据的 Java 类示例可能如下：\n\n```java\npublic class Customer {\n\n\
  \    private int id;\n    private String name;\n    private string address;\n\n\
  \    public Customer(String name, String address) {\n        this.id = id;\n   \
  \     this.name = name;\n        this.address = address;\n    }\n\n    public int\
  \ getId() {\n        return this.id;\n    }\n\n    public String getName() {\n \
  \       return this.name;\n    }\n\n    public int getAddress() {\n        return\
  \ this.address;\n    }\n\n    public void setId(int id) {\n        this.id = id;\n\
  \    }\n\n    public void setName(String name) {\n        this.name = name;\n  \
  \  }\n\n    public void setAddress(int quantity) {\n        this.address = address;\n\
  \    }\n}\n```\n\n按照目前的实现，上述代码声明了一个基础 Java 类，包含若干代表数据库表字段的变量和一组 getter 和 setter\
  \ 方法。然而，该类尚未成为实体。为了使该类成为实体并使其在 SQL 语句中可用，需要添加一些 Room 注解：\n\n```java\n@Entity(tableName\
  \ = \"customers\")\npublic class Customer {\n\n    @PrimaryKey(autoGenerate = true)\n\
  \    @NonNull\n    @ColumnInfo(name = \"customerId\")\n    private int id;\n\n \
  \   @NonNull\n    @ColumnInfo(name = \"customerName\")\n    private String name;\n\
  \n    private String address;\n\n    public Customer(String name, String address)\
  \ {\n        this.id = id;\n        this.name = name;\n        this.address = address;\n\
  \    }\n\n    public int getId() {\n        return this.id;\n    }\n\n    public\
  \ String getName() {\n        return this.name;\n    }\n\n    public int getAddress()\
  \ {\n        return this.address;\n    }\n\n    public void setId(@NonNull int id)\
  \ {\n        this.id = id;\n    }\n\n    public void setName(String name) {\n  \
  \      this.name = name;\n    }\n\n    public void setAddress(int quantity) {\n\
  \        this.address = address;\n    }\n}\n```\n\n上述注解首先声明该类表示一个实体，并分配了表名为“customers”。这是在\
  \ `DAO` SQL 语句中被引用的表名。每个数据库表都需要一列作为主键。在这种情况下，客户 ID 被声明为主键。此外还添加了注解以分配一个在 SQL 查询中引用的列名，并指示该字段不能用于存储空值。最后，id\
  \ 值被配置为自动生成。这意味着分配给新记录的 id 将由系统自动生成，以避免键冲突。\n\n\n\n\n客户名称字段也分配了一个列名。但请注意，地址字段没有分配列名。这意味着地址数据仍然存储在数据库中，但在\
  \ SQL 语句中不需要引用它。如果实体中的某个字段不需要存储在数据库中，只需使用 `@Ignore` 注解即可：\n\n```java\n@Ignore\n\
  private String myString;\n```\n\n最后，修改了 `id` 变量的 setter 方法以防止尝试分配 `null` 值：\n\n\
  ```java\npublic void setId(@NonNull int id) {\n    this.id = id;\n}\n```\n\n注解也可以包含在实体类中，用以使用被称为“外键”的关系型数据库概念来与其他实体建立关系。外键允许一个表引用另一个表中的主键。例如，可以在名为\
  \ `Purchase` 的实体与我们现有的 `Customer` 实体之间建立如下关系：\n\n```java\n@Entity(foreignKeys =\
  \ {@ForeignKey(entity = Customer.class,\n        parentColumns = \"customerId\"\
  ,\n        childColumns = \"buyerId\",\n        onDelete = ForeignKey.CASCADE,\n\
  \        onUpdate = ForeignKey.RESTRICT})\npublic class Purchase {\n    @PrimaryKey(autoGenerate\
  \ = true)\n    @ColumnInfo(name = \"purchaseId\")\n    private int purchaseId;\n\
  \    @ColumnInfo(name = \"buyerId\")\n    private int buyerId;\n}\n```\n\n注意，外键声明还指定了当父记录被删除或更新时要采取的操作。可用选项有\
  \ `CASCADE`、`NO_ACTION`、`RESTRICT`、`SET_DEFAULT` 和 `SET_NULL`。\n\n### 65.4 数据访问对象\n\
  \n数据访问对象（DAO）提供了访问存储在 SQLite 数据库中的数据的方法。`DAO` 被声明为标准的 Java 接口，并带有一些额外的注解，将特定的 SQL\
  \ 语句映射到随后可以被仓库调用的方法。\n\n第一步是创建接口并使用 `@Dao` 注解将其声明为 DAO：\n\n```java\n@Dao\npublic\
  \ interface CustomerDao {\n}\n```\n\n接下来，添加包含 SQL 语句和对应方法名的条。例如，下面的声明允许通过调用名为 `getAllCustomers()`\
  \ 的方法检索 `customers` 表中的所有行：\n\n```java\n@Dao\npublic interface CustomerDao {\n \
  \   @Query(\"SELECT * FROM customers\")\n    LiveData<List<Customer>> getAllCustomers();\n\
  }\n```\n\n注意，`getAllCustomers()` 方法返回一个 `List` 对象，其中包含从数据库表中检索到的每条记录的 `Customer`\
  \ 实体对象。`DAO` 同样使用了 `LiveData`，以便仓库能够观察数据库的变化。\n\n参数也可以传递给方法并在相应的 SQL 语句中被引用。考虑以下\
  \ DAO 声明，它会搜索与客户名称匹配的数据库记录（注意 `WHERE` 条件中引用的列名是分配给实体类中列的名字）：\n\n```java\n@Query(\"\
  SELECT * FROM customers WHERE name = :customerName\")\nList<Customer> findCustomer(String\
  \ customerName);\n```\n\n在此示例中，方法传递了一个字符串值，该值通过在变量名前面加上冒号（`:`）包含在 SQL 语句中。\n\n可以使用\
  \ `@Insert` 方便注解如下声明一个基本的插入操作：\n\n```java\n@Insert\nvoid addCustomer(Customer customer);\n\
  ```\n\n这被称为方便注解，因为 Room 持久化库可以推导出传递给 `addCustomer()` 方法的 `Customer` 实体要插入数据库中，而无需提供\
  \ SQL 插入语句。也可以在一个事务中插入多条数据库记录，如下：\n\n```java\n@Insert\npublic void insertCustomers(Customer...\
  \ customers);\n```\n\n下面的 DAO 声明删除了所有与提供的客户匹配的记录：\n\n```java\n@Query(\"DELETE FROM\
  \ customers WHERE name = :name\")\nvoid deleteCustomer(String name);\n```\n\n作为使用\
  \ `@Query` 注解执行删除的替代，也可以使用 `@Delete` 方便注解。在以下示例中，所有与传递给 `deleteCustomers()` 方法的实体集匹配的\
  \ `Customer` 记录将从数据库中删除：\n\n```java\n@Delete\npublic void deleteCustomers(Customer...\
  \ customers);\n```\n\n`@Update` 方便注解在更新记录时提供类似的行为：\n\n```java\n@Update\npublic void\
  \ updateCustomers(Customer... customers);\n```\n\n此类数据库操作的 `DAO` 方法也可以声明返回一个 `int`\
  \ 值，表示受事务影响的行数，例如：\n\n```java\n@Delete\npublic int deleteCustomers(Customer... customers);\n\
  ```\n\n### 65.5 Room 数据库\n\nRoom 数据库类通过扩展 `RoomDatabase` 类创建，作为嵌入 Android 操作系统的实际\
  \ SQLite 数据库之层。该类负责创建并返回一个新的 Room 数据库实例，并提供对与数据库相关的 `DAO` 实例的访问。\n\nRoom 持久化库提供了一个数据库构建器来创建数据库实例。每个\
  \ Android 应用应该只有一个 Room 数据库实例，因此最好在类内部实现防御性代码以防止创建多个实例。\n\n下面的代码列表列出了用于示例客户表的 Room\
  \ 数据库实现示例：\n\n```java\nimport android.content.Context;\nimport android.arch.persistence.room.Database;\n\
  import android.arch.persistence.room.Room;\nimport android.arch.persistence.room.RoomDatabase;\n\
  \n@Database(entities = {Customer.class}, version = 1)\npublic class CustomerRoomDatabase\
  \ extends RoomDatabase {\n    public abstract CustomerDao dao();\n    private static\
  \ CustomerRoomDatabase INSTANCE;\n\n    static CustomerRoomDatabase getDatabase(final\
  \ Context context) {\n        if (INSTANCE == null) {\n            synchronized\
  \ (CustomerRoomDatabase.class) {\n                if (INSTANCE == null) {\n    \
  \                INSTANCE = Room.databaseBuilder(context.getApplicationContext(),\n\
  \                            CustomerRoomDatabase.class, \"customer_database\")\n\
  \                            .build();\n                }\n            }\n     \
  \   }\n        return INSTANCE;\n    }\n}\n```\n\n上述示例中需要注意的重要区域是类上方声明数据库要处理的实体注解、检查类实例是否已创建的代码以及名称\
  \ `customer_database` 的赋值。\n\n### 65.6 仓库\n\n仓库负责获取 Room 数据库实例，使用该实例访问关联的 DAO，然后调用\
  \ DAO 方法执行数据库操作。一个旨在与 Room 数据库工作的典型仓库构造函数可能如下：\n\n```java\npublic class CustomerRepository\
  \ {\n    private CustomerDao customerDao;\n    private CustomerRoomDatabase db;\n\
  \n    public CustomerRepository(Application application) {\n        db = CustomerRoomDatabase.getDatabase(application);\n\
  \        customerDao = db.customerDao();\n    }\n    \n}\n```\n\n一旦仓库获取了 DAO 的访问权限，就可以调用数据访问方法。例如，下面的代码调用了\
  \ `getAllCustomers()` DAO 方法：\n\n```java\nprivate LiveData<List<Customer>> allCustomers;\n\
  allCustomers = customerDao.getAllCustomers();\n```\n\n在调用 DAO 方法时，重要的是，除非该方法返回 `LiveData`\
  \ 实例（它会自动在单独线程上运行查询），否则不能在应用程序的主线程上执行该操作。事实上，尝试这样做会导致应用程序崩溃，并输出如下诊断信息：\n\n```\n\
  Cannot access database on the main thread since it may potentially lock the UI for\
  \ a long period of time\n```\n\n\n\n\n\n由于某些数据库事务可能需要较长时间才能完成，在单独的线程上运行操作可以避免应用出现假死现象。正如“Android\
  \ Room 数据库和仓库教程章节将演示的那样，这个问题可以通过使用 Java 线程来轻松解决（如需了解更多信息或回顾如何使用线程，请参阅标题为 Java 线程、处理器和执行器基础概述章节）。\n\
  \n### 65.7 内存数据库\n\n本章概述的示例使用了 SQLite 数据库，该数据库以文件的形式存在于 Android 设备的持久性存储中。这确保了即使在应用进程终止后数据依然存在。\n\
  \nRoom 数据库持久化库也支持内存数据库。这些数据库完全驻留在内存中，并在应用终止时丢失。使用内存数据库唯一需要的更改是调用 `Room Database`\
  \ 类的 `Room.inMemoryDatabaseBuilder()` 方法，而不是 `Room.databaseBuilder()`。以下代码显示了方法调用之间的区别（注意内存数据库不需要数据库名称）：\n\
  \n```java\n// 创建一个基于文件存储的数据库\nINSTANCE = Room.databaseBuilder(context.getApplicationContext(),\n\
  \                               CustomerRoomDatabase.class, \"customer_database\"\
  )\n                                   .build();\n\n// 创建一个内存数据库\nINSTANCE = Room.inMemoryDatabaseBuilder(context.getApplicationContext(),\n\
  \                                         CustomerRoomDatabase.class)\n        \
  \                             .build();\n```\n\n## 65.8 数据库检查器\n\nAndroid Studio\
  \ 包含一个 Database Inspector（数据库检查器）工具窗口，允许查看、搜索和修改与运行应用相关的 Room 数据库，如图 65-3 所示：\n\n\
  ![](img/as_database_inspector_window.jpg)\n\n图 65-3\n\nDatabase Inspector 的用法将在“Android\
  \ Room 数据库和仓库教程章节中介绍。\n\n### 65.9 总结\n\nAndroid Room 持久化库包含在 Android 架构组件中，并作为底层\
  \ SQLite 数据库之上的抽象层。该库的设计旨在符合 Android 架构指南的同时，使数据库操作变得更容易。本章介绍了构建 Android 应用项目中 Room\
  \ 数据库存储的相互作用的不同元素，包括实体（entities）、仓库（repositories）、数据访问对象（daos）、注解（annotations）和\
  \ Room Database 实例。\n\n涵盖了 SQLite 和 Room 架构组件的基础之后，下一步是创建一个将这些理论付诸的示例应用。由于示例应用的用户界面需要基于表单的布局，下一章标题为“Android\
  \ TableLayout 和 TableRow 教程它将稍微偏离核心主题，介绍 TableLayout 和 TableRow 视图的基础知识。\n\n## 66.\
  \ Android TableLayout 和 TableRow 教程\n\n在开始本书的下一章（“Android Room 数据库和仓库教程）的工作时，最初计划包含为\
  \ Room 数据库示例应用设计用户界面布局的步骤。然而，很快发现实现用户界面的最佳方法是使用 Android 的 `TableLayout` 和 `TableRow`\
  \ 视图，而且该主题值得作为一个独立的章节。因此，本章将专门关注下一章要完成的数据库应用程序的用户界面设计，并在此过程中花一些时间介绍 Android Studio\
  \ 中表格布局的基本概念。\n\n### 66.1 TableLayout 和 TableRow 布局视图\n\n`TableLayout` 容器视图的目的是允许用户界面元素以行和列组成的表格格式在屏幕上进行组织。`TableLayout`\
  \ 中的每一行由一个 `TableRow` 实例占据，而 `TableRow` 又被划分为单元格，每个单元格包含一个子视图（该单元格本身可以是包含多个子视图的容器）。\n\
  \n表格中的列数由列数最多的行决定，默认情况下，每列的宽度由该列中最宽的单元格定义。列可以配置为可收缩或可伸（或两者兼有），以便相对于父 `TableLayout`\
  \ 改变大小。此外，单个单元格可以配置为跨越多个列。\n\n考虑图 66-1 所示的用户界面布局：\n\n![](img/as_4.1_room_demo_ui.jpg)\n\
  \n图 66-1\n\n从布局的外观来看，很难识别用于设计它的 `TableLayout` 结构。然而，图 66-2 中的层级树使得结构变得稍微容易理解：\n\n\
  ![](img/as_tree.jpg)\n\n图 66-2\n\n显然，该布局由一个父 `LinearLayout` 视图和 `TableLayout`、`RecyclerView`\
  \ 子视图组成。`TableLayout` 包含三个 `TableRow` 子视图，代表表格中的三行。`TableRow` 两个两个视图，每个子视图代表表格单元格的内容。`LinearLayout`\
  \ 子视图包含三个 `Button` 子视图。这正是数据库示例所需的布局。\n\n### 66.2 创建 Room 数据库项目\n\n从欢迎界面选择 New Project（新建项目）菜单选项，在弹出的新项目对话框中，点击\
  \ Next（下一步）按钮之前，选择 Fragment + ViewModel 模板。\n\n在 Name 字段中输入 `RoomDemo` 并指定 `com.ebookrenzy.roomdemo`\
  \ 为包名。在点击 Finish（完成）按钮之前，将 Minimum API level 设置更改为 26：Android 8.0 (Oreo)，并将 Language\
  \ 菜单设置为 Java。\n\n### 66.3 转换为 LinearLayout\n\n在 Project（项目）窗口（app -> res -> layout）中找到\
  \ `fragment_main.xml` 文件并双击将其加载到 Layout Editor（布局编辑器）工具中。默认情况下，Android Studio 使用\
  \ `ConstraintLayout` 作为用户界面的根布局元素。这需要转换为垂直方向的 `LinearLayout`。在 Design（设计）模式下的 Layout\
  \ Editor 工具中，在 Component tree（组件树）中找到主 `ConstraintLayout` 组件并右键点击它显示图 66-3 所示的菜单，并选择\
  \ Convert view...（转换视图...）选项：\n\n![](img/as_menu.jpg)\n\n图 66-3\n\n在结果对话框（图 66-4）中，选择转换为\
  \ `LinearLayout` 的选项，然后点击 Apply（应用）按钮：\n\n![](img/as_convert_linear.jpg)\n\n图 66-4\n\
  \n默认情况下，布局编辑器会将 `ConstraintLayout` 转换为水平 `LinearLayout`，因此在 Component Tree 窗口中选择布局组件，参考\
  \ Attributes（属性）工具窗口并将 orientation 属性更改为 vertical：\n\n![](img/as_orientation.jpg)\n\
  \n图 66-5\n\n转换完成后，从布局中删除默认的 `TextView` 小部件。\n\n### 66.4 向用户界面添加 TableLayout\n\n\
  继续留在 `fragment_main.xml` 文件中并参考 Palette（调色板）中的 Layouts 类别，拖放一个 `TableLayout` 视图，使其位于\
  \ `LinearLayout` 画布区域的顶部。\n\n\n\n\n一旦完成这些初始步骤，布局的 `Component Tree` 应该类似于 图 66-6\
  \ 所示。\n\n![](img/as3.2_tablelayout_in_tree.jpg)\n\n图 66-6\n\n很明显，Android Studio\
  \ 已自动为 `TableLayout` 添加了四个 `TableRow` 实例。由于此示例只需要三行，请选择并删除第四个 `TableRow` 实例。你可以随时通过从调板中拖动\
  \ `TableRow` 对象并将其置于 `Component Tree` 工具窗口中的 `TableLayout` 上，向 `TableLayout` 添加额外的行。\n\
  \n在选中 `TableLayout` 的情况下，使用 `Attributes` 工具窗口将 `layout_height` 属性更改为 `wrap_content`，并将\
  \ `layout_width` 更改为 `match_parent`。\n\n### 66.5 配置 TableRows\n\n从调板的 `Text` 区域，将两个\
  \ `TextView` 对象拖到 `Component Tree` 中最顶部的 `TableRow` 条目上（图 66-7）：\n\n![](img/as3.2_tablerow_textviews.jpg)\n\
  \n图 66-7\n\n选择屏幕布局中最左侧的 `TextView`，并在 `Attributes` 工具窗口中将 `text` 属性更改为“Product ID”。对右侧的\
  \ `TextView` 重复此步骤，这次将文本更改为“Not assigned”，并指定 `ID` 值为 `productID`。\n\n将另一个 `TextView`\
  \ 拖放到 `Component Tree` 中的第二个 `TableRow` 条目上，并将视图上的 `text` 更改为“Product Name”。在调板中找到\
  \ `Plain Text` 对象并将其拖放，使其如 图 66-8 所示，置于 `Component Tree` 中 `Product Name` `TextView`\
  \ 的下方。选中 `EditText` 对象，通过点击图标、勾选“None”复选框并点击 `Apply` 按钮，将 `Attributes` 面板中的 `inputType`\
  \ 属性从 `textPersonName` 更改为 `none`。接下来，从 `text` 属性中删除“Name”字符串并将 `ID` 设置为 `productName`。\n\
  \n![](img/as_3.6_tablelayout_produnt_name_row.jpg)\n\n图 66-8\n\n将另一个 `TextView`\
  \ 和一个 `Number (Decimal) Text Field` 拖放到第三个 `TableRow` 上，使 `TextView` 在层级结构中位于 `EditText`\
  \ 之上。将 `TextView` 的 `text` 更改为 Product Quantity，并将 `EditText` 对象的 `ID` 更改为 productQuantity。\n\
  \n通过按住 Shift 键点击布局中的所有组件（如下所示 图 66-9 所示），并使用 `Attributes` 工具窗口将所有对象的 `textSize`\
  \ 属性设为 `18sp`：\n\n![](img/as_4.1_room_demo_views_selected.jpg)\n\n图 66-9\n\n在继续之前，请确保将上述步骤中添加的所有\
  \ `text` 属性提取到字符串资源中。\n\n## 66.6 为布局添加按钮栏\n\n下一步是向父级 `LinearLayout` 视图添加一个 `LinearLayout\
  \ (Horizontal)` 视图，并将其置于 `TableLayout` 视图下方。首先点击 `Component Tree` 中 `TableLayout`\
  \ 条目左侧的小展开箭头，使 `TableRows` 折叠隐藏。从 `Layout Editor` 调板的 `Layouts` 区域拖出一个 `LinearLayout\
  \ (horizontal)` 实例，将其直接置于 `Component Tree` 面板中的 `TableLayout` 条目正下方，并将 `layout_height`\
  \ 属性更改为 `wrap_content`：\n\n![](img/as3.2_tablelayout_add_linearlayout.jpg)\n\n图\
  \ 66-10\n\n将三个 `Button` 对象拖入新的 `LinearLayout` 中，并为每个按钮分配对应为“Add”、“Find”和“Delete”的字符串资源。此类按钮栏布局中的按钮通常应该显示为无边框样式。对于每个按钮，使用\
  \ `Attributes` 工具窗口将样式设置更改为 `Widget.AppCompat.Button.Borderless`并将 `textColor` 属性更改为\
  \ `?attr/colorPrimary`。将按钮的 `IDs` 分别更改为 `addButton`、`findButton` 和 `deleteButton`。\n\
  \n![](img/as_3.4_change_button_style.jpg)\n\n图 66-11\n\n在 `Component Tree` 中选中新的水平\
  \ `LinearLayout` 视图，将 `gravity` 属性更改为 `center_horizontal`，以便按钮在显示区域内水平居中。\n\n###\
  \ 66.7 添加 RecyclerView\n\n在 `Component Tree` 中，点击新添加的水平 `LinearLayout` 条目左侧的展开箭头，以折叠所有子项。\n\
  \n从调板的 `Containers` 区域拖出一个 `RecyclerView` 实例并将其拖放到 `Component Tree` 上，使其位于按钮栏 `LinearLayout`\
  \ 下方，如 图 66-12 所示。注意确保 `RecyclerView` 是垂直 `LinearLayout` 视图的直接子级，而不是水平按钮栏 `LinearLayout`\
