  md: 'When an applet is terminated, the following sequence of method calls takes
    place:


    ```

    stop()

    destroy()

    ```


    Let''s look more closely at these methods.


    ) : The ) method is the first method to be called. This is where you should initialize
    variables. This method is called only once during the run time of your applet.


    start() : The start( ) method is called after It is also called to restart an
    applet after it has been stopped. Note that ) is called once i.e. when the first
    time an applet is loaded whereas start() is called each time an applet''s HTML
    document is displayed onscreen. So, if a user leaves a web page and comes back,
    the applet resumes execution at start(


    paint( ) : The paint( ) method is called each time an AWT-based applet''s output
    must be redrawn. This situation can occur for several reasons. For example, the
    window in which the applet is running may be overwritten by another window and
    then uncovered. Or the applet window may be minimized and then restored. paint(
    ) is also called when the applet begins execution. Whatever the cause, whenever
    the applet must redraw its output, paint( ) is called.


    The paint( ) method has one parameter of type This This parameter will contain
    the graphics context, which describes the graphics environment in which the applet
    is running. This context is used whenever output to the applet is required.'
