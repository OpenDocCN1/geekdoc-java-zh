    during the deserialization of an object, it throws a ClassNotFoundException.


    Notice that the return value of readObject() is cast to an Employee reference.


    The value of the SSN field was 11122333 when the object was serialized, but because
    the field is transient, this value was not sent to the output stream. The SSN
    field of the deserialized Employee object is 0.'
