  md: '# Generics


    It would be nice if we could write a single sort method that could sort the elements
    in an Integer array, a String array, or an array of any type that supports ordering.


    Java Generic methods and generic classes enable programmers to specify, with a
    single method declaration, a set of related methods, or with a single class declaration,
    a set of related types, respectively.


    Generics also provide compile-time type safety that allows programmers to catch
    invalid types at compile time.


    Using Java Generic concept, we might write a generic method for sorting an array
    of objects, then invoke the generic method with Integer arrays, Double arrays,
    String arrays and so on, to sort the array elements.


    # Generic Methods


    You can write a single generic method declaration that can be called with arguments
    of different types. Based on the types of the arguments passed to the generic
    method, the compiler handles each method call appropriately. Following are the
    rules to define Generic Methods:


    All generic method declarations have a type parameter section delimited by angle
    brackets (< and >) that precedes the method’s return type (< E > in the next example).'
