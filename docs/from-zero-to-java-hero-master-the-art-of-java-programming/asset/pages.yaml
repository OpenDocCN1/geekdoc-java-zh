  md: 'The server instantiates a ServerSocket object, denoting which port number communication
    is to occur on.


    The server invokes the accept() method of the ServerSocket class. This method
    waits until a client connects to the server on the given port.


    After the server is waiting, a client instantiates a Socket object, specifying
    the server name and the port number to connect.


    The constructor of the Socket class attempts to connect the client to the specified
    server and the port number. If communication is established, the client now has
    a Socket object capable of communicating with the server.


    On the server side, the accept() method returns a reference to a new socket on
    the server that is connected to the client’s socket.


    After the connections are established, communication can occur using I/O streams.
    Each socket has both an OutputStream and an InputStream. The client’s OutputStream
    is connected to the server’s InputStream, and the client’s InputStream is connected
    to the server’s OutputStream.


    TCP is a two-way communication protocol, hence data can be sent across both streams
    at the same time. Following are the useful classes providing complete set of methods
    to implement sockets.


    # ServerSocket Class Methods


    The class is used by server applications to obtain a port and listen for client
    requests.


    The ServerSocket class has four constructors:


    Methods with Description'
