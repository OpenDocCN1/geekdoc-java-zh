  md: '# Character Class


    Normally, when we work with characters, we use primitive data types

    char.


    Example


    ```

    char ch = ''a'';

    // Unicode for uppercase Greek omega character charChar = "\u039A";

    // an array of chars

    char[] charArray={''a'', ''b'', ''c'', ''d'', ''e''};

    ```


    However in development, we come across situations where we need to use

    objects instead of primitive data types. In order to achieve this, Java provides

    wrapper class Character for primitive data type char.


    The Character class offers a number of useful class (i.e., static) methods

    for manipulating characters. You can create a Character object with the

    Character constructor:


    ```

    Character ch = newCharacter(''a'');

    ```


    The Java compiler will also create a Character object for you under some

    circumstances. For example, if you pass a primitive char into a method that

    expects an object, the compiler automatically converts the char to a Character

    for you. This feature is called auto boxing or unboxing, if the conversion goes

    the other way.'
