    to deal with deadlock situations.


    # Thread Control


    Core Java provides complete control over multithreaded program. You can develop
    a multithreaded program which can be suspended, resumed, or stopped completely
    based on your requirements. There are various static methods which you can use
    on thread objects to control their behavior. Following table lists down those
    methods:


    # Methods with Description


    public void suspend() This method puts a thread in the suspended state and can
    be resumed using resume() method.


    public void stop() This method stops a thread completely.

    public void resume() This method resumes a thread, which was suspended using suspend()method.'
