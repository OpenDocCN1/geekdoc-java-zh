  md: 'public void timeout() Sets the time-out value for how long the server socket
    waits for a client during the accept().


    public void host(int, int backlog) Binds the socket to the specified server and
    port in the SocketAddress object. Use this method if you have instantiated the
    ServerSocket using the no argument constructor.


    When the ServerSocket invokes accept(), the method does not return until a client
    connects. After a client does connect, the ServerSocket creates a new Socket on
    an unspecified port and returns a reference to this new Socket. A TCP connection
    now exists between the client and the server, and communication can begin.


    # Socket Class Methods


    The java.net.Socket class represents the socket that both the client and the server
    use to communicate with each other. The client obtains a Socket object by instantiating
    one, whereas the server obtains a Socket object from the return value of the accept()
    method.


    The Socket class has five constructors that a client uses to connect to a server:


    # Methods with Description


    public Socket(String host, int port) throws This method attempts to connect to
    the specified server at the specified port. If this constructor does not throw
    an exception, the connection is successful and the client is connected to the
    server.'
