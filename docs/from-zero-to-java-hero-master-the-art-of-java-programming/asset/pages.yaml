  md: 'URL stands for Uniform Resource Locator and represents a resource on the World
    Wide Web, such as a Web page or FTP directory.


    This chapter shows you how to write Java programs that communicate with a URL.
    A URL can be broken down into parts, as follows:


    protocol://host:port/path?query#ref


    Examples of protocols include HTTP, HTTPS, FTP, and File. The path is also referred
    to as the filename, and the host is also called the authority.


    The following is a URL to a web page whose protocol is HTTP:


    http://www.am로드.com/index.htm?language=en#j2se


    Notice that this URL does not specify a port, in which case the default port for
    the protocol is used. With HTTP, the default port is 80.


    # URL Class Methods


    The java.net.URL class represents a URL and has a complete set of methods to manipulate
    URL in Java.


    The URL class has several constructors for creating URLs, including the following:


    Methods with Description'
