  md: '# Thread Methods


    Following is the list of important methods available in the Thread class.


    Methods with Description


    public void start() Starts the thread in a separate path of execution, then invokes
    the run() method on this Thread object.


    public void run() If this Thread object was instantiated using a separate Runnable
    target, the run() method is invoked on that Runnable object.


    public final void setName(String name) Changes the name of the Thread object.
    There is also a getName() method for retrieving the name.


    public final void priority() Sets the priority of this Thread object. The possible
    values are between 1 and


    public final void setDaemon(boolean on) A parameter of true denotes this Thread
    as a daemon thread.


    public final void wait(long millis) The current thread invokes this method on
    a second thread, causing the current thread to block until the second thread terminates
    or the specified number of milliseconds passes.


    public void interrupt() Interupts this thread, causing it to continue execution
    if it was blocked for any reason.


    public final boolean isAlive() Returns true if the thread is alive, which is any
    time after the thread has been started but before it runs to completion.


    The previous methods are invoked on a particular Thread object. The following
    methods in the Thread class are static. Invoking one of the static methods performs
    the operation on the currently running thread.


    Methods with Description'
