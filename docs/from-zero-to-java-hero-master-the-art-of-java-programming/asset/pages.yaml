  md: '# How to use Java comments


    To use Java comments effectively, follow these steps:


    If the comment describes how to use the code, use JavaDoc comments

    /** */


    If the comment only spans one line, use an inline comment //

    If the comment spans multiple lines, use a block comment /* */


    There’s an old saying: good code comments itself. This sentiment has some merit.
    But at the same time, good programmers comment their code.

    Add Java comments to your code judiciously, when and where makes sense. This helps
    others understand the code you write.'
