  md: '# Collections Framework


    Prior to Java 2, Java provided ad hoc classes such as Dictionary, Vector, and
    Properties to store and manipulate groups of objects. Although these classes were
    quite useful, they lacked a central, unifying theme. Thus, the way that you used
    Vector was different from the way that you used Properties.


    The collections framework was designed to meet several goals, such as:


    +   The framework had to be high-performance. The implementations for the fundamental
    collections (dynamic arrays, linked lists, trees, and hashtables) were to be highly
    efficient.


    +   The framework had to allow different types of collections to work in a similar
    manner and with a high degree of interoperability.

    The framework had to extend and/or adapt a collection easily.


    Towards this end, the entire collections framework is designed around a set of
    standard interfaces. Several standard implementations such as and of these interfaces
    are provided that you may use as-is and you may also implement your own collection,
    if you choose.


    A collections framework is a unified architecture for representing and manipulating
    collections. All collections frameworks contain the following:'
