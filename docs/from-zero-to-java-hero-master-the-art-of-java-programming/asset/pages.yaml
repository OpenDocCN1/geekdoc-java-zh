    # The Hashtable Class


    Hashtable was part of the original java.util and is a concrete implementation
    of a Dictionary.


    However, Java 2 re-engineered Hashtable so that it also implements the Map interface.
    Thus, Hashtable is now integrated into the collections framework. It is similar
    to HashMap, but is synchronized.


    Like HashMap, Hashtable stores key/value pairs in a hash table. When using a Hashtable,
    you specify an object that is used as a key, and the value that you wanted to
    link to that key. The key is then hashed, and the resulting hash code is used
    as the index at which the value is stored within the table.


    Following is the list of constructors provided by the HashTable class.


    Constructor and Description


    ) This is the default constructor of the hash table it instantiates the Hashtable
    class.


    size) This constructor accepts an integer parameter and creates a hash table that
    has an initial size specified by integer value size.


    size, float This creates a hash table that has an initial size specified by size
    and a fill ratio specified by fillRatio. This ratio must be between 0.0 and 1.0,
    and it determines how full the hash table can be before it is resized upward.'
