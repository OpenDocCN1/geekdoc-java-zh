    # Major Java Multithreading Concepts


    While doing Multithreading programming in Java, you would need to have the following
    concepts very handy:


    +   - What is thread synchronization?

    - Handling interthread communication

    - Handling thread deadlock

    - Major thread operations


    # Thread Synchronization


    When we start two or more threads within a program, there may be a situation when
    multiple threads try to access the same resource and finally they can produce
    unforeseen result due to concurrency issues. For example, multiple threads try
    to write within a same file they may corrupt the data because one of the threads
    can override data or while one thread is opening the same file at the same time
    another thread might be closing the same file.


    So there is need to synchronize the action of multiple threads and make sure that
    only one thread can access the resource at a given point in time. This is implemented
    using a concept called Each in Java is associated with a monitor, which a thread
    can lock or unlock. Only one thread at a time may hold a lock on a monitor.'
