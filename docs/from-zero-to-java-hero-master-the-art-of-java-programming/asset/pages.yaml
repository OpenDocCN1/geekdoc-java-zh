  md: '# Networking


    The term network programming refers to writing programs that execute across multiple
    devices (computers), in which the devices are all connected to each other using
    a network.


    The java.net package of the J2SE APIs contains a collection of classes and interfaces
    that provide the low-level communication details, allowing you to write programs
    that focus on solving the problem at hand.


    The java.net package provides support for the two common network protocols:


    TCP stands for Transmission Control Protocol, which allows for reliable communication
    between two applications. TCP is typically used over the Internet Protocol, which
    is referred to as TCP/IP.


    UDP stands for User Datagram Protocol, a connection-less protocol that allows
    for packets of data to be transmitted between applications.


    This chapter gives a good understanding on the following two subjects:


    Socket This is the most widely used concept in Networking and it has been explained
    in very detail.


    URL Processing'
