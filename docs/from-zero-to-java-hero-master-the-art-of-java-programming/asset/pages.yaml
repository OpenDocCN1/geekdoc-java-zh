    # The WeakHashMapClass


    WeakHashMap is an implementation of the Map interface that stores only weak references
    to its keys. Storing only weak references allows a key-value pair to be garbage-collected
    when its key is no longer referenced outside of the WeakHashMap.


    This class provides the easiest way to harness the power of weak references. It
    is useful for implementing “registry-like” data structures, where the utility
    of an entry vanishes when its key is no longer reachable by any thread.


    The WeakHashMap functions identically to the HashMap with one very important exception:
    if the Java memory manager no longer has a strong reference to the object specified
    as a key, then the entry in the map will be removed.'
