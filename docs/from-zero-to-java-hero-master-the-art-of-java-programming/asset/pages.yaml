    # The IdentityHashMap Class


    This class implements AbstractMap. It is similar to HashMap except that it uses
    reference equality when comparing the elements.


    This class is not a general-purpose Map implementation. While this class implements
    the Map interface, it intentionally violates Map''s general contract, which mandates
    the use of the equals method when comparing objects.


    This class is designed for use only in rare cases wherein reference-equality semantics
    are required. This class provides constant-time performance for the basic operations
    (get and put), assuming the system identity hash function (System.identityHashCode(Object))
    disperses elements properly among the buckets.'
