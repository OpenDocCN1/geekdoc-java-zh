  md: '# Abstract Methods


    If you want a class to contain a particular method but you want the actual implementation
    of that method to be determined by child classes,

    you can declare the method in the parent class as an abstract.


    abstract keyword is used to declare the method as abstract.

    You have to place the abstract keyword before the method name in the

    method declaration.


    An abstract method contains a method signature, but no method body.

    Instead of curly braces, an abstract method will have a semi colon (;) at

    the.


    Following is an example of the abstract method.


    ```

    public abstract class Employee

    {

    private String name; private String address; private int number;

    public abstract double computePay();

    //Remainder of class definition

    }

    ```


    Declaring a method as abstract has two consequences:


    The class containing it must be declared as abstract.

    Any class inheriting the current class must either override the abstract

    method or declare itself as abstract.'
