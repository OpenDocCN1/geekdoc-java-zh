    \ |\n| \\\" | Inserts a double quote character in the text at this point. |\n\
    | \\\\ | Inserts a backslash character in the text at this point. |\n\nWhen an\
    \ escape sequence is encountered in a print statement, the compiler interprets\
    \ it accordingly.\n\n# Example\n\nIf you want to put quotes within quotes, you\
    \ must use the escape sequence, \\\\\", on the interior quotes:\n\n```\npublic\
    \ class Test {\n    public static void main(String args[]) {\n        System.out.println(\"\
