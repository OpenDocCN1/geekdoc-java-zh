  md: '# Regular Expressions


    Java provides the java.util.regex package for pattern matching with regular expressions.
    Java regular expressions are very similar to the Perl programming language and
    very easy to learn.


    A regular expression is a special sequence of characters that helps you match
    or find other strings or sets of strings, using a specialized syntax held in a
    pattern. They can be used to search, edit, or manipulate text and data.


    The java.util.regex package primarily consists of the following three classes:


    Pattern Class: A Pattern object is a compiled representation of a regular expression.
    The Pattern class provides no public constructors. To create a pattern, you must
    first invoke one of its public static compile() methods, which will then return
    a Pattern object. These methods accept a regular expression as the first argument.


    Matcher Class: A Matcher object is the engine that interprets the pattern and
    performs operations against an input string. Like the Perl class, Matcher defines
    no public constructors. You obtain a Matcher object by invoking the method on
    a Pattern object.


    A PatternSyntaxException object is an unchecked exception that indicates a syntax
    error in a regular expression pattern.


    # Capturing Groups'
