    \n# Chapter 9 Public Class and File Name\n\n### Introduction\n- Public Class in\
    \ a Program\n- Summary\n\nIn this chapter we will discuss about rules of naming\
    \ a java program and classes that are in it.\n\n### Public Class in a Program\n\
    A class can only have one of two access specifiers i.e. a class can be declared\
    \ with `public` or `default` (package level) access specifier.A class cannot be\
    \ declared as `private` or `protected`.\n\nThere are rules that have to be followed\
    \ when declaring class or giving name to Java program(file).\n1. There can only\
    \ be one `public` class per java file.\n2. The `public` class name and java file\
