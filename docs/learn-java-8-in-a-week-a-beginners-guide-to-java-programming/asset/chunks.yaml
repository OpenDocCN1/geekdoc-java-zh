    Introduction


    In this chapter I will discuss about how to use Switch.. case statement. Switch..case
    is used for executing code based on a condition.


    Using Switch..case Statement


    Switch.. case is alternative to ‘if .. else’ statement. Switch statement can have
    any number of possible execution paths. A switch..case works with the following
    primitive types


    *   byte


    *   short


    *   char


    *   int


    The ‘case’ has to have break statement else the control will fall through to next
    case. A switch..case can also have ‘default’ statement that will be executed when
    none of the case condition match.


    Let’s understand switch.. case with the help of an example.


    In this example I show how to use integer with switch..case


    //Prg.java


    //Description : Using Switch..case with integer


    class Program {


    public static void switchOps() {


                  int day=1;


                  switch(day) {


                                case 1:


                                              System.out.println("Sunday");


                                              break;


                                case 2:


                                              System.out.println("Monday");


                                              break;


                                case 3:


                                              System.out.println("Tuesday");


                                              break;


                                case 4:


                                              System.out.println("Wednesday");


                                              break;


                                case 5:


                                              System.out.println("Thursday");


                                              break;


                                case 6:


                                              System.out.println("Thursday");


                                              break;


                                case 7:


                                              System.out.println("Thursday");


                                              break;


                                default:


                System.out.println("Invalid day");                           


                  }


    }


    public static void main(String args[]) {


       switchOps();


    }


    }


    Output:


    ![](images/00052.gif)


    If the value of ‘day’ variable is 9 then ‘default’ case will be executed.


    Output:


    ![](images/00053.gif)


    If the value of the ‘day’ variable is 1 and ‘case 1:’  does not have break statement
    then the control will fall throught and code for ‘case 2:’ will also be executed.


    Output:


    ![](images/00054.gif)


    The next example demonstrate how to use char and String types inside swith..case.


    //Prg2.java


    //Description : Using Switch..case with char & String


    class Program {


    public static void switchOps() {


                  char day=''i'';


                  switch(day) {


                                case ''i'':


                                              System.out.println("One");


                                              break;


                                case ''x'':


                                              System.out.println("Ten");


                                              break;


                                default:


                System.out.println("Invalid number");                           


                  }


    }


                  public static void switchOps2() {


                    String state="TN";


                  switch(state) {


                                case "KA":


                                              System.out.println("Karnataka");


                                              break;


                                case "TN":


                                              System.out.println("Tamil Nadu");


                                              break;


                                default:


                System.out.println("Invalid state");                           


                  }


    }


    public static void main(String args[]) {


       switchOps();


       switchOps2();


    }


    }


    Output:


    ![](images/00055.gif)


    Now let’s learn about how to use enum inside switch..case.


    //Prg3.java


    //Description : Using enum with switch... case


    enum Metro {


                  Delhi,


                  Kolkata,


                  Mumbai,


                  Bengaluru


    }


    class Program {


                  static void switchOps() {


                                Metro city;


                                city = Metro.Mumbai;


                                switch(city) {


                                              case Delhi:


                                                            System.out.println("Delhi
    is in north of India");


                                                            break;


                                              case Mumbai:


                                                            System.out.println("Mumbai
    is in west of India");


                                                            break;


                                              case Kolkata:


                                                            System.out.println("Kolkata
    is in east of India");


                                                            break;


                                              case Bengaluru:


                                                            System.out.println("Bengaluru
    is in south of India");


                                                            break;


                                              default:


                                                            System.out.println("This
    is not a metro city");


                                }


                  }


                  public static void main(String args[]) {


                                switchOps();


                  }


    }


    Output:


    ![](images/00056.gif)


    Summary


    Switch.. case can work with primitives and reference types. ''break'' keyword 
    has to be used in “case” else logic will fall through. Enum can be used in switch
    case.


