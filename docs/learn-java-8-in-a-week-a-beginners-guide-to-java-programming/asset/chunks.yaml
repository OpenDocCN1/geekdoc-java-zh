    \ 还可以 `default` 语句，当没有 case 条件匹配时将执行该语句。\n\n让我们通过一个示例来理解 `switch.. case`。\n\n\
    在这个示例中，我展示了如何在 `switch..case` 中使用整数。\n\n```java\n//Prg.java\n//Description : Using\
