    Introduction


    In this chapter I will discuss about how to use arithmetic and relational operators.Arithmetic
    and relational operators form the backbone of mathematical computation in Java.


    What are Operators?


    They are special symbols that perform specific operation. Operator can work with
    multiple operands.


    Java has support for 5 types of operators


    *   Arithmetic


    *   Relational


    *   Bitwise


    *   Logical


    *   Assignment


    Using Arithmetic Operators


    They are used for creating mathematical expressions.Some of the arithmetic operators
    are


    *   + : Addition  (Works with 2 operands)


    *   - : Subtraction (Works with 2 operands)


    *   / : Division (Works with 2 operands)


    *   *: Multiplication (Works with 2 operands)


    *   % : Modulus (Reminder- Works with 2 operands)


    *   ++ : Unary Increment (Works with 1 operand)


    *   -- : Unary Decrement (Works with 2 operand)


    Let’s understand arithmetic operators with help of an example.


    //Prg.java


    //Description : Working with arithmetic operators


    class Program {


                  static void ariOps() {


                                int i=20,j=10;


                                int sum = i+j;


                                int subs = i-j;


                                int prod = i*j;


                                int div = i/j;


                                int rem = i % j;


                                i++;


                                --j;


                                System.out.println(" The sum is :"+ sum);


                                System.out.println(" The substraction is :"+ subs);


                                System.out.println(" The multiplication is :"+ prod);


                                System.out.println(" The division is :"+ div);


                                System.out.println(" The remainder is :"+ rem);


                  }


                  public static void main(String args[]) {


                                ariOps();


                  }


    }


