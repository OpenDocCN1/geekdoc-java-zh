  trans: "\n字节码是只有 Java 解释器才能理解的二进制代码。在编辑器中打开 `Prg2.class` 文件进行检查。\n\n![](img/00009.jpeg)\n\
    \n## 注释\nJava 程序中的注释有两种方式：\n\n1. 单行注释 - `// This is a comment`\n2. 多行注释 –\n```java\n\
    /*\n此注释跨越了\n多\n行\n*/\n```\n\n## 总结\nJava 程序的扩展名为为 `.java`。Java 程序编译成字节码。字节码由 Java\
    \ 解释器处理。\n\n![](img/00001.jpeg)\n\n# 第 6 章：HelloWorld 程序\n\n## 话题\n- 引言\n- HelloWorld\
    \ 程序\n- 总结\n\n## 引言\n一个可执行的 Java 程序具有具有有效签名格式的 `main` 方法，该方法作为程序的入口。`main` 方法必须封装在一个类中。\n\
    \n## HelloWorld 程序\n让我们写一个 HelloWorld 程序。写好程序后，使用 `Javac.exe`（编译器）对其进行编译，并使用 `Java.exe`（解释器）执行它。\n\
    \n```java\n//Prg.java\n// Description: HelloWorld Program\nclass Program {\n \
    \   public static void main(String args[]) {\n        System.out.println(\"Namaskar\
    \ - HelloWorld - Java\");\n    }\n}\n```\n\n命令行中的命令：\n1. `Javac Prg.java`\n2.\
    \ `Java Program`\n\n输出：\n![](img/00010.gif)\n\n### 尝试：\n1. 将 `main` 方法改为大写。\n\
    结果：编译器错误。\n\nJava 中可以使用的有效 `main` 方法有：\n1. `public static void main(String[] args)`。\n\
    2. `public static void main(String args[])`。\n3. `public static void main(String\
    \ ...a)`。\n\n类中一次只能使用上述其中一个 `main` 方法。\n\n让我们通过示例来验证上述内容。\n\n```java\n//Prg2.java\n\
    //Description: Helloworld program using “main(String[] args)” method as entry\
    \ point\nclass Program {\n    public static void main(String args[]) {\n     \
    \   System.out.println(\"Namaskar - HelloWorld - Java\");\n    }\n}\n```\n输出：\n\
    ![](img/00010.gif)\n\n```java\n//Prg3.java\n//Description : Using “main(String\
    \ …a)” method as entry point.\nclass Program {\n    public static void main(String\
    \ ...a) {\n        System.out.println(\"Namaskar - HelloWorld - Java\");\n   \
    \ }\n}\n```\n输出：\n![](img/00010.gif)\n\n### 解释：\n1. `main(String …a)` 代表 Java\
    \ 语法，告知编译器允许向 `main` 方法传递任意数量的字符串参数。\n\n 尝试：\n1. 创建一个没有有效签名的 `main` 方法。\n结果：程序将编译但不会执行。\n\
    \n## 总结\n`main` 方法只有在它具有有效签名时才是程序的入口，否则它的行为就像类中的普通方法一样。\n\n![](img/00001.jpeg)\n\
    \n# 第 7 章：HelloWorld 程序的内部结构\n\n## 话题\n- 引言\n- 命令行参数\n- Main 方法\n- `System.out.println()`\
    \ 的内部结构\n- 总结\n\n## 引言\n在本章中，你将理解 HelloWorld 程序的内部结构。\n\n## 命令行参数\n`main` 方法是一个入口，它接收字符串数组作为参数。在\
    \ Java 中对数组会进行边界检查。程序员可以在命令行向 `main` 方法传递任何类型的数据。传递的数据将被捕获为字符串。程序员必须对该数据进行类型转换以进行后续处理。\n\
    \n让我们了解如何在程序中传递命令行参数并捕获它们。\n\n```java\n//Prg.java\n//Description: Passing and\
    \ capturing command line arguments\nclass Program {\n    public static void main(String\
    \ args[]) {\n        System.out.println(\"HelloWorld :\" + args[0]); \n      \
    \  System.out.println(\"HelloWorld \" + args[0] + \",\" + args[1]);\n    }\n}\n\
    ```\n输出：\n![](img/00011.gif)\n\n当程序员只传递 \"Ram\" 作为参数时，Java 解释器会抛出 `Array Exception`，因为数组经过了边界检查，即程序预期有两个参数。\n\
    \n输出：\n![](img/00012.jpeg)\n\n现在让我们通过传递整数来更好地理解 `main` 方法的行为。传递给 `main` 方法的所有参数都被接受为字符串。如果传递了整数，则必须进行转换以供后续处理。下一个程序解释了如何实现这一点。\n\
    \n```java\n//Prg2.java\n//Description: Passing integers at command line\nclass\
    \ Program {\n    public static void main(String args[]) {\n        int i = Integer.parseInt(args[0]);\
    \ // 字符串转换为整数\n        int j = Integer.parseInt(args[1]);\n        System.out.println(\"\
    The sum is :\" + (i+j)); \n    }\n}\n```\n输出：\n![](img/00013.gif)\n\n如果传递的参数之一是字符，Java\
    \ 解释器将抛出异常。这是因为字符无法转换为整数。\n\n输出：\n![](img/00014.jpeg)\n\n## Main 方法\n`main` 方法的签名不能更改，即“void”不能放在“static”之前。`main`\
    \ 方法的修饰只能是 `public`，即不能是 `protected` 或 `default`。\n\n```java\n//Prg3.java\n//Description:\
    \ Using main signature\nclass Program {\n    public void main(String args[]){\
    \ // 错误\n        System.out.println(\"Namaskar\");\n}\n```\n输出：\n![](img/00015.jpeg)\n\
    \n当 `main` 方法不是 `public` 时，它将不是入口。如果 `main` 非公开的，编译器将报告错误。\n\n```java\n//Prg4.java\n\
    //Description: Using main specifier\nclass Program {\n    protected void main(String\
    \ args[]){\n        System.out.println(\"Namaskar\");\n}\n```\n输出：\n![](img/00016.jpeg)\n\
    \n### System.out.println() 的内部结构\n`System` 是属于 `java.lang` 包的类。`java.lang` 是默认包，因此不需要导入。`out`\
    \ 是 `PrintStream` 类的一个静态对象。`println` 是属于该类的方法，用于在标准输出上打印数据。\n\n## 总结\n`main` 方法接收字符串数组作为参数。`main`\
    \ 方法必须是 `public`。\n`java.lang` 是默认包。\n\n![](img/00001.jpeg)\n\n# 第 8 章：多个 main\
    \ 方法\n\n## 话题\n- 引言\n- 单类中的多个 main 方法\n- 多个类与方法\n\n## 引言\n一个 Java 程序可以包含多个类。当包含多个类的\
    \ Java 程序被编译时，它会产生许多 `.class` 文件，即 Java 中的每个类都会编译成特定的类。`.class` 文件名与程序中的类名相同。由于\
    \ Java 支持方法重载（类中可以有许多名称相同但签名不同的方法），一个类可以包含多个类，且其中一个将是入口。\n\n## 单类中的多个 main 方法\n\
    Java 类可以拥有任意数量的 `main` 方法，因为 Java 支持方法重载，但只能有一个具有特定签名的入口（参阅第 6 章）。让我们通过示例了解如何在单类中创建多个\
    \ `main` 方法。\n\n```java\n//Prg.java\n//Description: Multiple Main methods in a\
    \ single class\nclass Program {\n    // 这是入口\n    public static void main(String\
    \ args[]) {\n        System.out.println(\"Namaskar - Helloworld - Java\");\n \
    \   }\n\n    /* \n    public static void main(String ... args) {\n        System.out.println(\"\
    \");\n    }\n    */\n\n    // 这不是入口\n    public static void main() { \n}\n```\n"
