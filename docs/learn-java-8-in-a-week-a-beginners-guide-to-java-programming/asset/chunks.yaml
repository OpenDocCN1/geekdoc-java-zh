    ![](img/00001.jpeg)\n\n# 第 25 章：算术运算符和关系运算符\n\n## 目录\n- 引言\n- 什么是运算符？\n- 使用算术运算符\n\
    - 使用关系运算符\n- 总结\n\n## 引言\n在本章中，我将讨论如何使用算术运算符和关系运算符。算术运算符和关系运算符构成了 Java 数学计算的核心。\n\
    \n## 什么是运算符？\n它们是执行特定操作的特殊符号。运算符可以与多个操作数一起工作。\n\nJava 支持 5 类运算符：\n- 算术\n- 关系\n\
    - 位运算\n- 逻辑\n- 赋值\n\n## 使用算术运算符\n它们用于创建数学表达式。一些算术运算符包括：\n\n- `+` : 加法（作用于 2 个操作数）\n\
    - `-` : 减法（作用于 2 个操作数）\n- `/` : 除法（作用于 2 个操作数）\n- `*` : 乘法（作用于 2 个操作数）\n- `%`\
    \ : 取模（取余-作用于 2 个操作数）\n- `++` : 一元递增（作用于 1 个操作数）\n- `--` : 一元递减（作用于 1 个操作数）\n\n\
    让我们通过示例来理解算术运算符。\n\n```java\n//Prg.java\n//Description :使用算术运算符\nclass Program\
    \ {\n    static void ariOps() {\n        int i=20,j=10;\n        int sum = i+j;\n\
    \        int subs = i-j;\n        int prod = i*j;\n        int div = i/j;\n  \
    \      int rem = i % j;\n        i++;\n        --j;\n        System.out.println(\"\
    \ The sum is :\"+ sum);\n        System.out.println(\" The substraction is :\"\
    + subs);\n        System.out.println(\" The multiplication is :\"+ prod);\n  \
    \      System.out.println(\" The division is :\"+ div);\n        System.out.println(\"\
    \ The remainder is :\"+ rem);\n    }\n    public static void main(String args[])\
    \ {\n        ariOps();\n    }\n}\n```\nOutput:\n![](img/0067.gif)\n\n## 关系运算符\n\
    关系运算符作用于 2 个操作数。它用于判断两者之间的关系。它们用于控制结构，例如 `if`、`while` 等。关系表达式的结果是布尔值。\n\n关系运算符列表如下：\n\
    \n| 表达式 | 结果 |\n| :--- | :--- |\n| `op > op2` | `op` 大于 `op2` |\n| `op >= op2`\
    \ | `op` 大于或等于 `op2` |\n| `op < op2` | `op` 小于 `op2` |\n| `op <= op2` | `op` 小于或等于\
    \ `op2` |\n| `op == op2` | `op` 和 `op2` 相等 |\n| `op != op2` | `op` 和 `op2` 不相等\
    \ |\n\n让我们通过示例来理解关系运算符的使用。\n\n```java\n//Prg2.java\n//Description :关系表达式\nclass\
    \ Program {\n    static void relOps() {\n        int i=10;\n        int j=20;\n\
    \        if ( i == j ) {\n            System.out.println(\"i is equal to j\");\n\
    \        }\n        if (i > j) {\n            System.out.println(\"i is greater\
    \ than j\");\n        }\n        if (i < j) {\n            System.out.println(\"\
    i is less than j\");\n        }\n        System.out.println(\"i==j \"+(i==j));\n\
    \        System.out.println(\"i > j \"+(i>j));\n        System.out.println(\"\
    i < j \"+(i<j));\n    }\n    public static void main(String args[]) {\n      \
    \  relOps();\n    }\n}\n```\nOutput:\n![](img/0068.gif)\n\n## 总结\n运算符是执行特定操作的特殊符号。关系表达式的结果是布尔值。算术运算符用于数学运算。\n\
    \n![](img/0001.jpeg)\n\n# 第 26 章：逻辑运算符和三元运算符\n\n## 目录\n- 引言\n- 使用逻辑运算符\n- 使用三元运算符\n\
    - 使用 instanceof 运算符\n- 总结\n\n## 引言\n在本章中，我将讨论如何使用逻辑运算符、三元运算符和 instanceof 运算符。\n\
    \n## 使用逻辑运算符\n它们用于将多个条件绑定在一起。关系运算符通过逻辑运算符结合在一起。Java 中有 4 种逻辑运算符。\n\n| 运算符符号 |\
    \ 运算符名称 |\n| :--- | :--- |\n| `&&` | 与 (AND) |\n| `||` | 或 (OR) |\n| `!` | 非 (NOT)\
    \ |\n| `^` | 异或 (XOR) |\n\n逻辑运算符描述：\n1. `与` 运算符 (`&&`) - 当两个条件都为真时返回真。\n2. `或`\
    \ 运算符 (`||`) - 当任意一个条件为真时返回真。\n3. `非` 运算符 (`!`) - 反转布尔值。\n4. `异或` 运算符 (`^`) -\
    \ 当两个条件不同时返回真。\n\n让我们通过示例来理解逻辑运算符。\n\n```java\n//Prg.java\n//Description:使用“与”运算符\n\
    class Program {\n    static void andOps() {\n        int a=10;\n        int b=20;\n\
    \        if (a > 5 && b < 25) // 当两个条件都为真时执行\n            System.out.println(\"\
    Value of a,b is greater than 5 and less than 25\");\n        else {\n        \
    \    System.out.println(\"Value of a:\" + a);\n            System.out.println(\"\
    Value of b:\" + b);\n        }\n    }\n    public static void main(String args[])\
    \ {\n        andOps();\n    }\n}\n```\nOutput:\n![](img/0069.gif)\n\n```java\n\
    //Prg2.java\n//Description:使用“或”运算符和“非”运算符\nclass Program {\n    static void orOps()\
    \ {\n        int a=10;\n        int b=20;\n        if (a > 5 || b < 25) // 当任意一个条件为真时执行\n\
    \            System.out.println(\"Value of a,b is greater than 5 and less than\
    \ 25\");\n        else {\n            System.out.println(\"Value of a:\" + a);\n\
    \            System.out.println(\"Value of b:\" + b);\n        }\n    }\n    static\
    \ void notOps() {\n        boolean b=true;\n        if (!b)\n            System.out.println(\"\
    Value of b is false\");\n        else\n            System.out.println(\"Value\
    \ of b is true\");\n    }\n    public static void main(String args[]) {\n    \
    \    orOps();\n        notOps();\n    }\n}\n```\nOutput:\n![](img/0070.gif)\n\n\
    ## 使用三元运算符\n它用于根据布尔表达式为变量赋值。它可以作为 if/else 语句的替代方案。\n\n语法：\n`result = 某些条件 ? value1\
    \ : value2;`\n\n如果条件为真，则返回 `value1`，否则返回 `value2` 并存储在 `result` 变量中。\n\n让我们通过示例更好地理解三元运算符。\n\
    \n```java\n//Prg3.java\n//Description :使用三元运算符\nclass Program {\n    static void\
    \ terOps() {\n        int j=10;\n        String result = false ? \"Superman is\
    \ the greatest\" : \"Batman is better\";\n    }\n}\n```\n\n"
