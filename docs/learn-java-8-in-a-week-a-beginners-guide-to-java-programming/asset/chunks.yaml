    ## 使用 StringBuilder 类\n它是一个可变的字符序列。`StringBuilder` 类不像 `String` 类那样不可变。\n\n`StringBuilder`\
    \ 类的主要方法有：\n- `Append()`\n- `Insert()`\n\n`StringBuilder` 位于 `java.io` 包中，因此必须进行导入。\n\
    \n让我们通过示例来理解 `StringBuilder` 类的用法。\n\n```java\n//Prg.java\n//Description: Using\
    \ StringBuilder class\n\nimport java.lang.*;\n\nclass Program {\n  public static\
    \ void main(String[] args) {\n    StringBuilder str = new StringBuilder(\"Namaste\"\
    );\n    str.append(\" Java\");\n    System.out.println(\"Using Append() method:\"\
    \ + str);\n    str.insert(5,\" Vanakkam\");\n    System.out.println(\"Using Insert()\
    \ method:\" + str);\n    str.delete(2,5);\n    System.out.println(\"Using Delete()\
    \ method: \"+ str);\n  }\n}\n```\n\nOutput:\n\n![](img/00046.gif)\n\n## 总结\nStringBuilder\
    \ 是可变的。`Delete()` 方法用于从字符串中删除字符。\n\n![](img/00001.jpeg)\n\n# 第 18 章：包装类\n\n##\
    \ \n- 引言\n- 使用包装类\n- 自动装箱和拆箱\n- 总结\n\n## 引言\n在本章中，你将学习如何将原始数据类型转换为对象。这种转换是通过包装类实现的。在本章中，我还将讨论自动装箱（Autoboxing）和拆箱（Unboxing）的概念。\n\
    \n## 使用包装类\n包装类用于将核心数据类型转换为对象。8 种数据类型对应 8 种包装类。包装类列表如下：\n\n| 原始类型 | 包装类 |\n| :---\
    \ | :--- |\n| boolean | Boolean |\n| char | Character |\n| byte | Byte |\n| short\
    \ | Short |\n| int | Integer |\n| long | Long |\n| float | Float |\n| double |\
    \ Double |\n\n包装类主要用于：\n1. 在需要时将数据表示为 `null`\n2. 在集合中使用数据\n\n让我们通过示例来理解包装类的用法。\n\
    \n```java\n//Prg.java\n//Description : Wrapper class\nclass Program {\n  static\
    \ void wrapperOps() {\n    int i=10;\n    Integer iw = Integer.valueOf(i); //\
    \ int to Integer\n    System.out.println(\"After(primitive to wrapper) :\"+ iw);\n\
    \    int j = iw.intValue();\n    System.out.println(\"After(wrapper to primitive)\
    \ :\"+j);\n  }\n  public static void main(String args[]) {\n    wrapperOps();\n\
    \  }\n}\n```\n\nOutput:\n\n![](img/00047.gif)\n\n## 自动装箱和拆箱\n编译器将原始类型转换为等效包装类型的自动转换称为自动装箱（Autoboxing）。\n\
    例如：\n`int i=10;`\n`Integer j=i;`\n\n编译器将包装类型转换为等效原始类型的自动转换称为拆箱（Unboxing）。\n例如：\n\
    `Integer j= new Integer(50);`\n`int i=j;`\n\n让我们通过示例更好地理解这一点。\n\n```java\n//Prg2.java\n\
    //Description : Autoboxing and Unboxing\nclass Program {\n  static void boxOps()\
    \ {\n    int i=20;\n    Integer j=i; // Autoboxing\n    Integer m = new Integer(77);\n\
    \    int k=m; // Unboxing\n    System.out.println(\"Value of i(primitive) :\"\
    +i);\n    System.out.println(\"Value of j(wrapper - Autoboxing) :\"+j);\n    System.out.println(\"\
    Value of k(primitive- Unboxing) :\"+k);\n  }\n  public static void main(String\
    \ args[]) {\n    boxOps();\n  }\n}\n```\n\nOutput:\n\n![](img/00048.gif)\n包装类只能自动转换为等效类型。如果我们尝试转换为任何其他类型，编译器将报错。\n\
    \n```java\n// snapshot\nInteger m = new Integer(77);\nint k=m; // Unboxing\nshort\
    \ sh = m; // 编译错误\n```\n\nOutput:\n\n![](img/00049.jpeg)\n\n## 总结\n包装类用于在集合中表示数据。从原始类型到包装类的自动转换是自动装箱，从包装类到原始类型的自动转换被称为拆箱。\n\
    \n![](img/0051.jpeg)\n\n# 第 19 章：If...else\n\n## \n- 引言\n- 使用 Else 语句\n- 总结\n\n\
    ## 引言\n在本章中，你将学习如何使用 `if` 语句。`if` 语句用于检查条件并据此做出决策。\n\n## 使用 Else 语句\n`if` 是 Java\
    \ 中基础且重要的结构。它用于根据条件做决策。`if` 结构有三种形式：\n- `if(condition)`\n- `if(condition) else`\n\
    - `if(condition) elseif else`\n\n`condition` 必须求值为布尔 `true`。当匹配多个条件时，执行第一个匹配的代码，其他匹配的代码将不会执行。让我们通过示例来理解。\n\
    \n```java\n//Prg.java\n//Description: Using 'if' condition\nclass Program {\n\
    \  static void ifOps() {\n    int i=10;\n    if (i > 5) System.out.println(\"\
    i is greater than 5\");\n  }\n  static void ifOps2() {\n    boolean b=true;\n\
    \    if (b) System.out.println(\"b is true\");\n    else System.out.println(\"\
    b is false\");\n  }\n  static void ifOps3() {\n    int i=8;\n    if (i == 5) //\
    \ == 是相等运算符\n      System.out.println(\"i value is 5\");\n    else if(i==6)\n\
    \      System.out.println(\"i value is 5\");\n    else if(i==7)\n      System.out.println(\"\
    i is 7\");\n    else\n      System.out.println(\"The value of i \"+i);\n  }\n\
    \  public static void main(String args[]) {\n    ifOps();\n    ifOps2();\n   \
    \ ifOps3();\n  }\n}\n```\n\nOutput:\n\n![](img/00050.gif)\n`if` 结构只能接受布尔条件，如果条件不是布尔值，将产生编译错误。以下代码将产生编译错误：\n\
    \n```java\n// Code snapshot\nint i=8;\nif (i) // 不是布尔条件\n  System.out.println(\"\
    i value is 5\");\n```\n\n"
