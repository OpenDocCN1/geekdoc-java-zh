    Introduction


    A Java program can have multiple classes. When a Java program that has multiple
    classes is compiled it will produce many .class files i.e. each class in Java
    program will compile to a specific class file. The name of .class file will be
    same as the name of the class in the program.


    Since Java has support for method overloading (mechanism where a class can have
    many methods with same name but which differ in signature) a class can have any
    number of main methods but one and only one main method will be the entry point
    for that class. Basically we can have many classes and each class can have one
    main method as entry point.


