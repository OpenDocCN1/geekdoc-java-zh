    Chapter 7


    Anatomy of HelloWorld Program


    Topics


     Introduction


     Command Line Arguments


     Main Method


     Anatomy of System.out.println()


     Summary


    Introduction


    In this chapter you will understand the anatomy of the HelloWorld program.


    Command Line Arguments


    The main method is an entry point which take a string array as an argument. The
    arrays are bounds checked in Java. The programmer can pass any type of data at
    command line to main method. The data passed will be captured as string. Programmer
    has to perform type conversion for further processing on that data.


    Let’s understand how to pass command line arguments and capture them in our program.


    //Prg.java


    //Description: Passing and capturing command line arguments


    class Program {


    public static void main(String args[]) {


       System.out.println("HelloWorld :" + args[0]); 


       System.out.println("HelloWorld " + args[0] +"," + args[1]);


    }


    }


    Output:


    ![](images/00011.gif)


    When the programmer passes just “Ram” as an argument. The Java interpreter throws
    Array Exception because array is bounds checked i.e. the program is anticipating
    2 arguments.


    Output:


    ![](images/00012.jpeg)


    Now let’s understand the behavior of main method better by passing Integers. All
    arguments passed to main method are accepted as String. If integer is passed then
    it has to be converted for further processing. The next program explain how to
    accomplish this.


    //Prg2.java


    //Description: Passing integers at command line


    class Program {


    public static void main(String args[]) {


                  int i = Integer.parseInt(args[0]); // conversion of string to integer


                  int j = Integer.parseInt(args[1]);


              System.out.println("The sum is :" + (i+j)); 


    }


    }


    Output:


    ![](images/00013.gif)


    If one of the argument that is passed is character then Java interpreter raises
    an exception.


    This is because character cannot be converted to integer


    Output:


    ![](images/00014.jpeg)


    Main Method


    The signature of the main method cannot be changed i.e “void” cannot precede “static”
    keyword if void appears before static compiler will report an error.


    The access specifier of “main” method can only be public i.e. it cannot be protected,private
    or default. Let’s understand the behaviour of main method with help of an example.


    //Prg3.java


    //Desription: Using main method signature


    class Program { // Compiler Error


    public void static main(String args[]){  // static should precede void


      System.out.println("Namaskar Helloworld Java");


    }


    }


    Output:


    ![](images/00015.jpeg)


    When a main method is not public then it won’t be an entry point in the program.
    If main method is non-public the compiler won’t report any error but interpreter
    will raise an exception this is because interpreter does not find any entry point
    hence it cannot execute the program.


    //Prg4.java


    //Description: Using main method signature - access specifier


    class Program {


    protected static void main(String args[]){


      System.out.println("Namaskar Helloworld Java");


    }


    }


    Output:


    ![](images/00016.jpeg)


    Anatomy of System.out.println()


    The System is a class which belong to “java.lang” package. A package is a repositry
    of reusable, organized Java code. The “java.lang” is the default package hence
    it is not required to be imported.


    The “out” is a pubic static object of PrintStream class. Static objects are class
    level hence can be accessed without an instance of the class.


    The “println” is a method that belong to PrintStream class that prints data on
    Stanard Output i.e Visual Display Unit (Monitor).


    Summary


    Main method takes string array as an argument.Main method has to be public only.


    The “java.lang” is the default package in Java.


