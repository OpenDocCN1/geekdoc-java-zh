    Introduction


    In this chapter I will discuss about break and continue keyword. Both these keywords
    are used in loops such as for, while and do...while loops and break keyword is
    used in switch...case as well.


    Using Break Keyword


    It is used for exiting a loop or a case statement from a switch. The break keyword
    can be


    1.  Labelled:  A means to identify area within a code block.


    2.  Unlabeled: No identifier associated.


    Let’s understand break keyword with the help of an example


    //Prg.java


    //Description: Using break statement


    class Program {


                  static void breakOps() {


                                int k=0;


                                while (k<10) {


                                              if (k==5)


                                                            break;


                                              k++;


                                }


                                System.out.println("The value of ''k'' after break
    is:"+ k);


                  }


                  static void breakOps2() {


                  first: // Label


                                for( int i = 0; i < 3; i++) {


                                second: // label


                                              for(int j = 0; j < 4; j ++ )


                                              {


                                                            System.out.println("Value
    of i:"+i);


                                                            System.out.println("Value
    of j:"+j);


                                                            break first;


                                              }


                                }


                  third: // Label


                                for( int a = 0; a < 4; a++) {


                                              System.out.println("The value of a:"+a);


                                }


                  }


                  public static void main(String args[]) {


                                breakOps();


                                breakOps2();


                  }


    }


    Output:


    ![](images/00061.gif)


    Using Continue Keyword


    The continue statement skips the current iteration of a loop. The control is return
    back at the starting of the loop after continue statement is executed. It can
    be of 2 types


    1.  Labeled


    2.  Unlabeled


    Let’s understand Continue keyword with the help of an example.


    //Prg2.java


    //Description: Using continue - labeled and unlabeled


    class Program {


                  static void contiOps() {


         int limit = 10;


        int facto = 1;


        OutLoop: for (int i = 1; i <= limit; i++) {


          facto = 1;


          for (int j = 2; j <= i; j++) {


            if (i > 10 && i % 2 == 1) {


              continue OutLoop;


            }


            facto *= j;


          }


          System.out.println(i + " factorial is " + facto);


        }


                  }


                  public static void main(String args[]) {


                                contiOps();


                  }


    }


