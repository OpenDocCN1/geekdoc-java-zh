    Using Relational Operators


    Relational operators work with 2 operands.It is used for determining relationship
    that one operand has with another. They are used in control and looping constructs.
    e.g if,for,while etc. The outcome of relational expression is a boolean.


    The List of relational operators is as follows


    | Expression | Result |


    | op > op2 | op is greater than op2 |


    | op >= op2 | op is greater than or equal to op2 |


    | op < op2 | op is less than to op2 |


    | op <= op2 | op is less than or equal to op2 |


    | op == op2 | op and op2 are equal |


    | op != op2 | op and op2 are not equal |


