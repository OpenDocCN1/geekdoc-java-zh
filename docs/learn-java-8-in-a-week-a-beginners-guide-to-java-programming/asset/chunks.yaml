    Introduction


    In this chapter we will discuss about behaviour of program during runtime i.e.
    when the program is executing. We will also discuss about the role of interpreter.Understand
    what is JIT and learn about what makes Java platform independent.


    Role of Java Interpreter


    The interpreter can be activated by executing the command “Java.exe” from command
    line. The interpreter is also called as JVM (Java Virtual Machine). The responsibility
    of the interpreter are as follows:


    1.  Taking bytecode as an input.


    2.  Processing bytecode to native code(executable code for specific OS).


    3.  Executing the native code.


    What is JIT Compilation?


    JIT stands for Just In Time compilation.It is an action performed by JVM where
    Bytecode is converted to Native code. Since it occur on demand hence it is called
    as Just In Time.


    A diagram representing Just In Time Compilation.


    ![](images/00024.gif)


    Platform Independence


    A program is called platform independent when the binary code is not native and
    does not target a specific OS. Since Java Program is compiled into bytecode which
    does not target any OS but the bytecode is processed only by JVM and there are
    JVMs that are available for different OS. This is what make Java program platform
    independent.


    A diagram representing how Java is platform independent.


    ![](images/00025.jpeg)


    Summary


    Java Virtual Machine is also called as pseudo OS.JVM convert bytecode to nativecode.Conversion
    of Bytecode to Nativecode is called JIT.


    ![](images/00001.jpeg)


