    Introduction


    In this chapter I will discuss about the concept of Immutability and after that
    we will learn about how string data type is immutable.


    What is Immutability?


    The state of an object cannot be changed after initialization is called as Immutability.
    It should be very clear that immutablility does not mean constant an entity. An
    immutable object is an object where the internal fields cannot be changed after
    constructor call.Objects which are immutable cannot have their state changed after
    they have been created.


    Using String Type


    String is a reference type (it is not primitive).String is immutable.Once value
    is assigned to string variable it cannot be changed.If a string is assigned a
    new value then JVM will create a new string on heap memory.


    Let’s understand string immutablility with help of an example.


    //Prg.java


    //Description : String Immutable behaviour


    class Program {


                  static void immOps() {


                    String s = "Namaste";


                    s.concat(" Java"); // The new string is not concatenated


                    System.out.println("Value of string after concat() :"+s);


                  }


                  static void immOps2() {


