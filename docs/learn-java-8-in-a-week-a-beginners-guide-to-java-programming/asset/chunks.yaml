    \n![](images/00001.jpeg)\n\n# Chapter 27: Arrays\n\n### Topics\n- Introduction\n\
    - What is an Array?\n- Using Single Dimension Array\n- Using Multi Dimension Array\n\
    - Summary\n\n## Introduction\n\nIn this chapter you will learn about how to operate\
    \ on arrays. Array is used as a storage entity for large data in memory. I will\
    \ also discuss about single and multi dimension arrays.\n\n## What is an Array?\n\
    \nIt is a data container which is used for storing data at runtime within memory.\
    \ The attributes of an array are as follows:\n\n1. Fixed size – Size in bytes\
    \ is known before usage.\n2. Single type – It can only be of a single type.\n\
    3. Accessed using an index.\n4. Index start with 0.\n\nSo the array can be defined\
    \ as a container of data located in memory which of a fixed size and is of a given\
    \ data type. Java arrays are safe i.e they are bounds checked. If the user accesses\
    \ beyond the bounds the `JVM` raises an exception.\n\nSyntax of array definition:\n\
    `Datatype arobj=new Datatype[size];`\n\nArray are used for quick and easy access\
    \ to data. It eliminate the need for creating many variables. The data located\
    \ in an array can be accessed using an index.\n\nThere are 2 types of arrays i.e:\n\
    1. Single dimension.\n2. Multi dimension.\n\n## Using Single Dimension Array\n\
    \nThey have one row and fixed number of columns. `Length` property is used for\
    \ getting the length of an array.\n\n### Array Declaration\n- `Datatype ar[];`\n\
    - `Datatype []ar;`\n\n### Array Definition\n- `Datatype obj[]=new Datatype[size];`\n\
    - `Datatype []obj=new Datatype[size];`\n\nLet’s understand usage of single dimension\
    \ array with an example.\n\n```java\n//Prg.java\n//Description : Working with\
    \ dimension arrays\n\nclass Program {\n    static void sdOps() {\n        int\
    \ []ar2;\n        int ar3[] = {1,2,5,6,7,8};\n    }\n    static void sd2() {\n\
    \        int []ar = new int [5];\n        ar[0]= 20;\n        ar[1]=40;\n    \
    \    ar[2]=50;\n        ar[3]=60;\n        ar[4]=70;\n        System.out.println(\"\
    The length of the array is:\"+ ar.length);\n        for (int i=0;i< ar.length;i++)\n\
    \            System.out.println(\"The location : \"+ i + \" has value:\"+ ar[i]);\n\
    \    }\n    static int[] sqArray(int ar[]) {\n        for (int i=0;i<ar.length;i++)\n\
    \            ar[i]= ar[i]*ar[i];\n        return ar;\n    }\n    static void show(int\
    \ ar[]) {\n        System.out.println(\"\\n\");\n        for (int i=0;i< ar.length;i++)\n\
    \            System.out.println(\"The location : \"+ i + \" has value:\"+ ar[i]);\n\
    \    }\n    public static void main(String args[]) {\n        sdOps();\n     \
    \   sd2();\n        int ar[] = {1,2,5,6,7};\n        int sq[] = sqArray(ar);\n\
    \        show(sq);\n    }\n}\n```\n\nOutput:\n![](images/00074.gif)\n\nIf the\
    \ array is accessed beyond it’s bound then `JVM` throws an exception.\n\n```java\n\
    // code snapshot\nint []ar = new int [5];\nar[0]= 20;\nar[1]=40;\nar[2]=50;\n\
    ar[3]=60;\nar[4]=70;\nar[5]=90;\n```\n\nOutput:\n![](images/00075.jpeg)\n\n##\
    \ Multi Dimension Array\n\nThe data is stored in combination of rows and columns.\
