    In this chapter you will learn about how to use ‘if’ condition statement. The
    ‘if’ statement is used for checking conditions and making decision based on it.


    Using If..else Statement


    ‘If’ is an fundamental and important construct in Java. It is used for making
    decision based on condition .


    There are 3 flavours of ''if'' construct


    *   if(condition)


    *   if(condition) <instructions> else <instructions>


    *   if(condition) <instructions> elseif <instructions> else <instructions>


    The <condition> has to evaluate to a boolean ‘true’. When more than one condition
    matches the execution the first matching conditon code is only executed other
    matching condition code will not be executed. Let’s understand this with the help
    of an example.


    //Prg.java


    //Description: Using ''if'' condition


