    \n## Using Instanceof Operator\n\nIt is used to check if a given variable is of\
    \ a given type. It is also called as comparison operator i.e. it compares variable\
    \ with type.\n\nLet’s understand `instanceof` operator with an example.\n\n```java\n\
    //Prg4.java\n//Description : Using instanceof operator\n\nclass Program {\n  \
    \  static void instOps() {\n        Program obj = new Program();\n        if (obj\
    \ instanceof Program)\n            System.out.println(\"obj is typeof Program\"\
    );\n        else\n            System.out.println(\"obj is not typeof Program\"\
    );\n    }\n\n    public static void main(String args[]) {\n        instOps();\n\
    \    }\n}\n```\n\nOutput:\n![](images/00072.gif)\n\nIf used with a null value\
    \ it will return false.\n\n```java\n//Prg5.java\n//Description : Using instanceof\
