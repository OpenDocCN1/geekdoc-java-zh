    Int :\"+ i);\n      System.out.println(\"Long :\"+ l);\n      System.out.println(\"\
    Float :\"+f);\n      System.out.println(\"Double :\"+ d);\n    }\n    public static\
    \ void main(String args[]) {\n      Program obj = new Program();\n      obj.show();\n\
    \    }\n}\n```\n\nOutput:\n![](images/00035.gif)\n\nSummary: Java is statically\
    \ typed. DataTypes can be divided into 2 categories i.e. Primitive and Reference\
    \ types. The default floating type is `double`.\n\n![](images/0001.jpeg)\n\n#\
    \ Chapter 13 Non Numeric DataTypes\n\n## Topics\n* Introduction\n* Non Numeric\
    \ Primitive Types\n* Non Numeric Reference Types\n* Summary\n\n### Introduction\n\
    In this chapter I will discuss how to use nonnumeric data types. You will learn\
    \ about `boolean`, `char` and reference(non primitive) types.\n\n### Non Numeric\
    \ Primitive Types\nThere two non primitive types i.e. `char` and `boolean`.\n\n\
    | Data Type | Size(Bytes) |\n| :--- | :--- |\n| `char` | 2 |\n| `boolean` | 1\
    \ |\n\nLet’s understand this with help of an example.\n\n```java\n//Prg.java\n\
    //Description: Using char and boolean\nclass Program {\n  char c;\n  boolean b;\n\
    \  public void defValue() {\n    System.out.println(\"Default Character value\
    \ :\"+ c);\n    System.out.println(\"Default Boolean value :\" b);\n  }\n  public\
    \ void show() {\n    char i='a';\n    boolean b = true;\n    System.out.println(\"\
    Character value :\"+ i);\n    System.out.println(\"Boolean value :\" b);\n  }\n\
    \  public static void main(String args[]) {\n    Program obj = new Program();\n\
    \    obj.defValue();\n    obj.show();\n  }\n}\n```\n\nOutput:\n![](images/00036.gif)\n\
    \n### Non Numeric Reference Type\nNon Numeric reference type supported in Java\
    \ are `String` and `Object`. `String` is aggregation of characters. `Object` is\
    \ the mother class of all classes directly or indirectly. Let’s understand this\
    \ better with help of an example.\n\n```java\n//Prg2.java\n//Description : Non\
    \ Numeric reference type behaviour\nclass Program {  // Program class inherit\
    \ from Object class implicitly\n  static void dataOps() {\n    String str=\"Namaskar\"\
    ;\n    Object obj=\"Vanakkam\"; // Object is the mother class of all classes in\
    \ java\n    System.out.println (\"String :\" + str);\n    System.out.println (\"\
    Object(String) :\" + obj);\n    obj = 234; // Object can be assigned with any\
    \ value because it is the Mother class of all classes.\n    System.out.println\
    \ (\"Object(String) :\" + obj);\n    obj = false;\n    System.out.println (\"\
    Object(boolean) :\" + obj);\n    obj = 234.7899;\n    System.out.println (\"Object(double)\
    \ :\" + obj);\n  }\n}\n```\n"
