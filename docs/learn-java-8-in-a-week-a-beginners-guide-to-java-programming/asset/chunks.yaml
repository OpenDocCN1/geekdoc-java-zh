    ```\n\n上述程序编译并执行时没有任何错误。\n\n输出：\n\n![](img/00017.gif)\n\n如果取消注释代码的注释，编译器将产生错误，因为一个类中只能有一个入口点。\n\
    \n输出：\n\n![](img/00018.jpeg)\n\n# 多个类与 main 方法\n\n一个 Java 程序可以有多个类，每个类只能有一个入口点，但类可以有许多不作为入口点的\
    \ `main` 方法。程序中的每个类都会被编译成一个 `.class` 文件。\n\n要执行特定的 `main` 方法，请执行命令 `“Java <classname>`。\n\
    \n让我们了解如何在多个类中创建 `main` 方法。\n\n```java\n//Prg2.java\n\n//Description：程序中的多个类\n\
    \nclass Program {\n\npublic static void main(String args[] ) { // 这是入口点\n\n  \
    \  System.out.println(\"Program class - Main method\");\n\n}\n\npublic static\
    \ void main() { // 这不是入口点\n\n             System.out.println (\"Program class\
    \ - Main() method\");\n\n}\n\npublic void main(String ar) { // 这不是入口点\n\n    \
    \         System.out.println(\"Program class - String argument-main\");\n\n}\n\
    \n}\n\nclass Test {\n\n             public static void main(String[] args) { //\
    \ 这是入口点\n\n                               System.out.println(\"Test class - Main\
    \ method\");\n\n             }\n\n             public static void main() { //\
    \ 这不是入口点\n\n                               System.out.println (\"Test class-Main()\
    \ method\");\n\n             }\n\n             public void main(String ar) { //\
    \ 这不是入口点\n\n                               System.out.println(\"Test2 class-String\
    \ argument-main\");\n\n             }\n}\n\nclass Test2 {\n\n      public static\
    \ void main(String[] args) { // 这是入口点\n\n                             System.out.println(\"\
    Test2 class - Main method\");\n\n             }\n\n             public static\
    \ void main() { // 这不是入口点\n\n                             System.out.println (\"\
    Test2 class - Main() method\");\n\n             }\n\n             public void\
    \ main(String ar) { // 这不是入口点\n\n                             System.out.println(\"\
    Test2 class-String argument-main\");\n\n             }\n}\n```\n\n要执行所需的 `main`\
    \ 方法，请使用命令 `Java <classname>`。\n\n输出：\n\n1. `Java Program`![](img/00019.gif)\n\
    2. `Java Test`![](img/00020.gif)\n3. `Java Test2`![](img/00021.gif)\n\n### 总结\n\
    一个类只能有一个入口点。程序可以包含多个类，每个类可以有自己的入口点。每个类都编译成独立的类文件。![](img/00001.jpeg)\n\n# 第 9\
    \ 章 公有类与文件名\n\n### 引言\n- 程序中的公有类\n- 总结\n\n在本章中，我们将讨论 Java 程序以及其中类的类的命名规则。\n\n\
    ### 程序中的公有类\n一个类只能有两种访问修饰符之一，即类可以声明为 `public` 或 `default`（包级）访问修饰符。类不能被声明为 `private`\
    \ 或 `protected`。\n\n在声明类或为 Java 程序（文件）命名时，必须遵循以下规则：\n1. 每个 Java 文件中只能有一个 `public`\
    \ 类。\n2. `public` 类名与 Java 文件名必须相同。\n3. Java 文件（名）与类（名）之间的大小写必须匹配。\n\n让我们通过程序来理解这些规则。\n\
    \n```java\n//Prg.java\n//Description：类不能声明为 private 或 protected\n\npublic class\
    \ Prg { // 公有类名和文件名必须相同\n// 程序的名称将是 Prg.java\npublic static void main(string args[])\
    \ {\n  System.out.println(\"Namaste Java\");\n}\n\nclass Test {\n\n    public\
    \ static void main(string args[]) {\n             System.out.println(\"Test class\"\
    );\n             }\n}\n```\n\n命令：`Java Prg`\n\n输出：![](img/00022.gif)\n\n如果将 `Test`\
    \ 类声明为 `private`，编译器将报告一个错误。\n\n输出：![](img/00023.jpeg)\n\n### 总结\n类不能被声明为 `private`\
    \ 或 `protected`。每个 Java 文件中只能有一个 `public` 类。![](img/00001.jpeg)\n\n# 第 10 章 运行时\n\
    \n### 引言\n- Java 解释器的角色\n- 什么是 JIT 编译？\n- 平台无关性\n- 总结\n\n在本章中，我们将讨论程序在运行时的行为，即程序正在执行时的状态。我们还将讨论解释器的作用。了解什么是\
    \ `JIT` 并学习什么让 Java 具有平台无关性。\n\n### Java 解释器的角色\n可以通过从命令行执行 `Java.exe` 命令来激活解释器。解释器也被称为\
    \ `JVM`（Java 虚拟机）。解释器的职责如下：\n1. 接收 `bytecode` 作为输入。\n2. 将 `bytecode` 处理为原生代码（针对特定操作系统的可执行代码）。\n\
    3. 执行原生代码。\n\n### 什么是 JIT 编译？\n`JIT` 代表 Just In Time compilation（即时编译）。它是 `JVM`\
    \ 执行的一项操作，其中 `bytecode` 被转换为原生代码。由于它是按需执行的，因此被称为即时编译。\n\n代表即时编译的图示![](img/images24.gif)\n\
    \n### 平台无关性\n当二进制代码不是原生的且不针对特定操作系统时，程序被称为平台无关的。因为 Java 程序被编译成 `bytecode`，而不同的操作系统都有相应的\
    \ `JVM`。这使得 Java 程序具有平台无关性。\n\n代表 Java 平台无关性的图示![](img/images25.jpeg)\n\n### 总结\n\
    Java 虚拟机也被称为伪操作系统。JVM 将 `bytecode` 转换为原生代码。`bytecode` 到原生代码的转换被称为 `JIT`。![](img/images00001.jpeg)\n\
    \n# 第 11 章 HelloWorld 程序\n\n### 引言\n- 使用 PrintStream 类\n- 总结\n\n在本章中，我们将讨论在屏幕上打印数据的替代方法，即不使用\
    \ `System.out.println()` 方法打印数据。为了实现这一点，我将使用 `PrintStream` 类。\n\n### 使用 PrintStream\
    \ 类\n要创建 `PrintStream` 类对象，我们需要将 `OutputStream` 对象传递给 `PrintStream` 类的构造函数。输出流句柄是通过\
    \ `FileDescriptor` 类的 `out` 字段建立的，它是作为 `FileInputStream`OutputStream 类的子类）构造函数的参数传递的。让我们通过示例来理解。由于使用的类位于\
    \ `java.io` 包中，因此需要导入该包。\n\n```java\n//Prg.java\n//Description：替代 World 程序\n\n\
    import java.io.*;\n\nclass Program {\n\npublic static void main(String args[])\
    \ {\n             FileOutputStream obj = new FileOutputStream(FileDescriptor.out);\n\
    \             PrintStream obj2 = new PrintStream(obj);\n             obj2.println(\"\
    Alternative Namaste Java\");\n\n}\n\n}\n```\n\n输出：![](img/00026.gif)\n\n### 总结\n\
    `FileDescriptor.out` 属性标识标准输出。`PrintStream` 在创建时接收 `OutputStream` 类对象![](img/00001.jpeg)\n\
    \n# 第 12 章 数字数据类型\n\n### 引言\n- 什么是变量？\n- 数据类型的分类\n- 整数类型\n- 浮点类型\n- 总结\n\n在本章中，将讨论如何创建和使用数值变量。由于\
    \ Java 是静态类型语言，变量的类型在编译时已知，因此变量具有类型。核心数据类型也被称为原始类型。Java 支持的原始数据类型为\n\n"
- fmt: "\n# Data Types\n\n1. `char`\n2. `byte`\n3. `short`\n4. `int`\n5. `long`\n\
    6. `float`\n7. `double`\n8. `boolean`\n\nBased on the data type of the variable,\
    \ memory will be allocated by the `JVM`.\n\n## Category Of DataTypes\n\nBroadly\
    \ Java support two kinds of types:\n\n* Primitive data types – They are core data\
    \ types.\n* Reference/Object data types – They derive from `Object` class directly\
    \ or indirectly.\n\n## Integer Types\n\nSince Java is statically typed, a variable\
    \ has to be declared before usage. `Integer` type can only contain a whole number.\
    \ The default integer type is `'int'`. Supported integer types are:\n\n| Data\
    \ Type | Size(Bytes) | Sign |\n| :--- | :--- | :--- |\n| `Byte` | 1 | Signed |\n\
    | `Short` | 2 | Signed |\n| `Int` | 4 | Signed |\n| `long` | 8 | Signed |\n\n\
    Let’s understand how to use integer types with help of an example.\n\n```java\n\
    //Prg.java\n//Description : Integer data type behaviour\nclass Program {\n   \
    \ public static void show() {\n      byte b=12;\n      short sh= 124;\n      int\
    \ i = 256;\n      long l = 459;\n      System.out.println(\"Byte value :\"+b);\n\
    \      System.out.println(\"Short value :\"+sh);\n      System.out.println(\"\
    Int value :\"+ i);\n      System.out.println(\"Long value :\" + l);\n    }\n \
    \   public static void main(String args[]){\n      show();\n    }\n}\n```\n\n\
    Output:\n![](images/00027.gif)\n\n```java\n//Prg2.java\n//Description : Checking\
    \ integer data type value range\nclass Program {\n    public static void show()\
    \ {\n      byte b=-128;  // -128 to 127 (inclusive)\n      short sh= 124; // \
    \ -32,768 to 32,767\n      int i = 256; //  -2^31 and a maximum value of 2^31-1\n\
    \      long l = 459; //  -2^63 to 2^63-1\n      System.out.println(\"Byte value\
    \ :\"+b);\n      System.out.println(\"Short value :\"+sh);\n      System.out.println(\"\
    Int value :\"+ i);\n      System.out.println(\"Long value :\" + l);\n    }\n \
    \   public static void main(String args[]){\n      show();\n    }\n}\n```\n\n\
    Output:\n![](images/00028.gif)\n\nIf `byte` variable is assigned value of `-129`\
    \ it will generate a compiler output.\n\n![](images/00029.jpeg)\n\n## Floating\
    \ Types\n\nThe floating numeric types can hold fractional number. Java has support\
    \ for 2 floating types i.e. `float` and `double`. The `float` type has to be suffixed\
    \ with `'f'` because default floating type is `double`.\n\n| Data Type | Size(Bytes)\
    \ | Sign |\n| :--- | :--- | :--- |\n| `Float` | 4 | Signed |\n| `Double` | 8 |\
    \ Signed |\n\nLet’s understand the usage of floating types with help of examples.\n\
    \n```java\n//Prg3.java\n//Description : Checking floating data type\nclass Program\
    \ {\n    public static void show() {\n      float f = 10.10f; // identify a floating\
    \ value by a suffix 'f'\n      double d = 20.20d; // suffix 'd' for double is\
    \ optional\n      System.out.println(\"Byte value :\"+f);\n      System.out.println(\"\
    Short value :\"+d);\n    }\n    public static void main(String args[]){\n    \
    \  show();\n    }\n}\n```\n\nOutput:\n![](images/00030.gif)\n\nIf floating variable\
    \ value is not suffixed with `'f'`, compiler will generate an error.\n\nOutput:\n\
    ![](images/00031.jpeg)\n\n### Using floating and integer types together.\n\n```java\n\
    //Prg4.java\n//Description: Using float and integer type together\nclass Program\
    \ {\n    public static void intOps() {\n      int i=10;\n      byte b=34;\n  \
    \    i= i*b;\n      System.out.println(\"i= i*b :\" + i);\n    }           \n\
    \    public static void fltOps() {\n      float f = 10.45f;\n      double d =\
    \ 45.5d;\n      d = f*d;\n      System.out.println(\"d = f*d :\" + d);\n    }\n\
