    Introduction


    In this chapter we will discuss about how to iterate over arrays using For Each
    loop. It better and simplier to use for each loop over other loops for aggregates.


    Using For Each Loop


    This was introduced in Java 5\. For each loop is used for iterating over arrays
    and collections i.e it is a loop that is exclusively to used for against aggregates.
    For each loop is less error prone compared to for,while and do..while loops because
    there is no condition check involved hence is simplier and safer to use.


    Salient features


    1.  No increment required


    2.  No Condition check required


    Syntax :


                    for(data_type variable : array | collection)   { }


    Let’s understand the usage of for each loop with help of an example.


    Using for each with single dimension array.


    //Prg.java


    //Description : for.. each loop with single dimension array


    class Program {


                  static void foreachOps() {


                                int ar[] = {1,2,3,4,5,6,7};


                                for(int i : ar)


                                   System.out.print(i+" ");


                  }


                  public static void main(String args[]) {


                                foreachOps();


                  }


    }


