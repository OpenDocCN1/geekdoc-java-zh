    - 第一个程序

    - 注释

    - 总结


    ### 简介

    Java 程序以 .java 扩展名保存。扩展名区分大小写。Java 程序使用 Java 编译器 (`javac.exe`) 编译，使用 Java 解释器
    (`java.exe`) 执行。


    ###第一个程序

    让我们编写第一个 Java 程序并将其保存为 `Prg.ca`。没有有效扩展名 (.java) 的 Java 程序会导致 编译器产生错误。


    // 名称：`Prg.ca`

    // 描述：有效的 Java 程序具有 .java 扩展名

    ```java

    class Program {

    }

    ```

    `javac Prg.ca`


    ![](img/00007.jpeg)


    如果 Java 程序以 `.jAva` 扩展名保存，编译器也会产生错误，因为文件扩展名区分大小写。


    // 名称：`Prg.jAva`

    // 描述：Java 程序的扩展名区分大小写。

    // 正确的扩展名是 .java

    ```java

    class Program {

    }

    ```

    `javac Prg.jAva`


    ![](img/00008.jpeg)


    Java 程序的有效扩展名是 .java。编译器在编译过程中生成 .class 文件。.class 文件包含由 Java 解释器解释的字节码。现在让我们编写一个命名正确的
    Java 程序并研究字节码。


    // 描述：有效的 java 程序具有 .java 扩展名。

    // 字节码是二进制 java 指令。

    // 将此程序保存为 `Prg2.java`

    ```java

    class Program {

    }

    ```

    上述程序编译后将生成一个名为 `Prg2.class` 的 .class 文件。此代码无法执行，因为它没有 `main` 方法，而 `main` 方法是程序的入口。


