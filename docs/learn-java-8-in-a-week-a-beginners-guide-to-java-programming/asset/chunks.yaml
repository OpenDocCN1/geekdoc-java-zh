    \n# Chapter 20: Switch.. Case\n\n## Topics\n* Introduction\n* Using Switch…case\
    \ Statement\n* Summary\n\n## Introduction\nIn this chapter I will discuss about\
    \ how to use `Switch.. case` statement. `Switch..case` is used for executing code\
    \ based on a condition.\n\n## Using Switch..case Statement\n`Switch.. case` is\
    \ alternative to `if .. else` statement. `Switch` statement can have any number\
    \ of possible execution paths. A `switch..case` works with the following primitive\
    \ types:\n* `byte`\n* `short`\n* `char`\n* `int`\n\nThe `case` has to have `break`\
    \ statement else the control will fall through to next `case`. A `switch..case`\
    \ can also have `default` statement that will be executed when none of the case\
    \ condition match.\n\nLet’s understand `switch.. case` with the help of an example.\n\
    \nIn this example I show how to use integer with `switch..case`.\n\n```java\n\
    //Prg.java\n//Description : Using Switch..case with integer\n\nclass Program {\n\
    \    public static void switchOps() {\n        int day=1;\n        switch(day)\
    \ {\n            case 1:\n                System.out.println(\"Sunday\");\n  \
    \              break;\n            case 2:\n                System.out.println(\"\
    Monday\");\n                break;\n            case 3:\n                System.out.println(\"\
    Tuesday\");\n                break;\n            case 4:\n                System.out.println(\"\
    Wednesday\");\n                break;\n            case 5:\n                System.out.println(\"\
    Thursday\");\n                break;\n            case 6:\n                System.out.println(\"\
    Thursday\");\n                break;\n            case 7:\n                System.out.println(\"\
    Thursday\");\n                break;\n            default:\n                System.out.println(\"\
    Invalid day\");\n        }\n    }\n    public static void main(String args[])\
    \ {\n        switchOps();\n    }\n}\n```\nOutput:\n![](images/0052.gif) If the\
    \ value of `day` variable is 9 then `default` case will be executed.\nOutput:\n\
    ![](images/0053.gif) If the value of the `day` variable is 1 and `case 1:` does\
    \ not have `break` statement then the control will fall through and code for `case\
    \ 2:` will also be executed.\nOutput:\n![](images/0054.gif) The next example demonstrate\
    \ how to use `char` and `String` types inside `switch..case`.\n\n```java\n//Prg2.java\n\
    //Description : Switch..case with char & String\nclass Program {\n    static void\
    \ switchOps() {\n        char day='i';\n        switch(day) {\n            case\
    \ 'i':\n                System.out.println(\"One\");\n                break;\n\
    \            case 'x':\n                System.out.println(\"Ten\");\n       \
    \         break;\n            default:\n                System.out.println(\"\
    Invalid number\");\n        }\n    }\n    public static void switchOps2() {\n\
    \        String state=\"TN\";\n        switch(state) {\n            case \"KA\"\
    :\n                System.out.println(\"Karnataka\");\n                break;\n\
    \            case \"TN\":\n                System.out.println(\"Tamil Nadu\");\n\
    \                break;\n            default:\n                System.out.println(\"\
    Invalid state\");\n        }\n    }\n    public static void main(String args[])\
    \ {\n        switchOps();\n        switchOps2();\n    }\n}\n```\nOutput:\n![](images/0055.gif)\
    \ Now let’s learn how to use `enum` inside `switch..case`.\n\n```java\n//Prg3.java\n\
    //Description : Using enum with switch case\nenum Metro {\n    Delhi,\n    Kolkata,\n\
    \    Mumbai,\n    Bengaluru\n}\nclass Program {\n    static void switchOps() {\n\
    \        Metro city;\n        city = Metro.Mumbai;\n        switch(city) {\n \
    \           case Delhi:\n                System.out.println(\"Delhi is in north\
    \ of India\");\n                break;\n            case Mumbai:\n           \
    \     System.out.println(\"Mumbai is in west of India\");\n                break;\n\
    \            case Kolkata:\n                System.out.println(\"Kolkata is in\
    \ east of India\");\n                break;\n            case Bengaluru:\n   \
    \             System.out.println(\"Bengaluru is in south of India\");\n      \
    \          break;\n            default:\n                System.out.println(\"\
    This is not a metro city\");\n        }\n    }\n    public static void main(String\
    \ args[]) {\n        switchOps();\n    }\n}\n```\nOutput:\n![](images/0056.gif)\n\
    \n## Summary\n`Switch case` can work with primitives and reference types. `break`\
    \ keyword has to be used in `case` else logic will fall through. `Enum` can be\
    \ used in `switch case`.\n\n![](images/0001.jpeg)\n\n# Chapter 21: For Loop\n\n\
    ## Topics\n* Introduction\n* Using for. Loop\n* Summary\n\n## Introduction\nIn\
    \ this chapter we will discuss about how to use `for loop`. The `for loop` helps\
    \ in executing and iterating over instructions for a know number of times.\n\n\
    ## Using for…loop\nIt is used for executing a block of code multiple times(fixed).\n\
    \n### Syntax\n```\nfor (initialization; condition; increment) {\n   instructions;\n\
    }\n```\nIt has 3 parts:\n* **Initialization**: Is executed once at the beginning\
    \ of the loop.\n* **Condition**: Loop is executed only when condition evaluate\
    \ to true.\n* **Increment**: Variable can be incremented or decremented.\n\nLet’s\
    \ understand this better with the help of an example.\n\n```java\n//Prg.java\n\
    //Description : Behaviour of for Loop\nclass Program {\n    static void forOps()\
    \ {\n        for(int i=10; i>0;i--) {\n            System.out.println(\"Value\
    \ of i :\"+ i);\n        }\n    }\n    static void forOps2() {\n        for(;;)\
    \ {\n            System.out.println(\"Infinite loop\");\n        }\n    }\n  \
    \  public static void main(String args[]) {\n        forOps();\n        //forOps2();\n\
    \    }\n}\n```\nIt is not mandatory to supply all values for 3 parts for a `for`\
    \ loop. If the condition is missing then the loop will become infinite. Uncomment\
    \ the `forOps2()` method to see execution of infinite for loop.\n\nOutput:\n![](images/0057.jpeg)\n\
    \nWe can write any legal java instructions inside any of the 3 parts of the for\
    \ loop.\n\nThe next program demonstrates this behaviour.\n\n```java\n//Prg2.java\n\
    //Description : Using for loop\nclass Program {\n    static void forOps() {\n\
    \        for (int i=0;i < 10 ; i++,System.out.println(\"In loop\"))\n    }\n}\n\
    ```\n"
