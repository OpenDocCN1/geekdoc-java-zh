    # Chapter 3

    ## Setting PATH Variable

    ### Topics

    - Introduction

    - What is PATH variable?

    - Summary


    ### Introduction

    Environment variables are special Windows OS variables that are dynamic in nature.
    They contain values that can be used by programs. Environment variables are used
    for identify installation directory, location of temporary files, tools and profile
    settings. The value of environment variable is changeable and updateable therefore
    environment variable is called as dynamic.


    Some of the common environment variables are:

    1. `%appdata%`: Location of Application Data folder for your user profile.

    2. `%commonprogramfiles%`: Location of Common Files folder, within the main Program
    Files folder.

    3. `%path%`: Location of various tools e.g. Java tools.

    4. `%programfiles%`: Location of where programs are installed.

    5. `%temp%`: Location of temporary files.

    6. `%windir%`: Location of windows system files.


    `SET` command provide a complete list of all environment variables from command
    line.


    ![](images/00002.jpeg)


    `SET` followed by environment variable will show value for that variable only.


    ![](images/00003.jpeg)


    ### Setting “PATH” Variable

    The `PATH` variable contain the location of tools, specifically it identifies
    the location of java interpreter (`Java.exe`), Java compiler (`Javac.exe`) and
    Java tool chain.


    PATH variable can be set in two ways using:

    1. Command Line

    2. Control Panel


    #### Command Line Setting

    The PATH variable can be set using `SET` command. The `SET` command is not case
    sensitive.


    This technique will apply only for the current command line session. Let’s see
    how to set PATH variable at command line.


    e.g.

    `Set path="C:\Program Files\Java\jdk1.8.0_65\bin"`

    Explanation: The above command will overwrite the `PATH` variable with the location
    of JDK 1.8.Use double quotes for directory that contain space. When setting PATH
    variable do not specify the name of tool only identify the location.


    `Set PATH = "C:\Program Files\Java\jdk1.8.0_65\bin"`

    Explanation: Path variable is case insensitive. The directory is also case sensitive.


    `Set PATH = %path%; "C:\Program Files\Java\jdk1.8.0_65\bin"`

    Explanation: The above command will append the location of PATH variable.


    #### Setting PATH Using Control Panel

    This is a superior way of setting PATH variable because it will be permanent.


    To set the PATH variable using control panel follows the steps below:

    1. Start control panel -> Choose System applet.

    2. Click Advanced System Settings.

    3. Choose advanced tab from environment variables dialog box.

    4. Click on Environment variables button.

    5. Goto Path variable in System Variables container and edit values to it.

    6. If PATH variable is not available then create a new PATH variable and add value
    to it.


    ![](images/00004.jpeg)


    ### Summary

    Path environment variable identifies the location of Java compiler and Java interpreter.
    Path can be set from command line or control panel. Control panel technique is
    better than command line because it is permanent.


    ![](images/00001.jpeg)


    # Chapter 4

    ## Java Compiler and Java Interpreter

    ### Topics

    - Introduction

    - Java Compiler

    - Java Interpreter

    - Summary


    ### Introduction

    The most fundamental tools that a Java programmer use are the Java compiler (`Javac.exe`)
    and Java interpreter (`Java.exe`). The PATH environment should be set to the location
    of the JDK bin folder which contain the compiler and the interpreter. If you not
    sure that your PATH is not set, refer to the previous chapter on PATH environment
    variable.


    ### Java Compiler

    The Java compiler is used for compiling Java programs. The compilation process
    generate bytecode. Bytecode is binary code that is understood by Java Virtual
    Machine (`JVM`).


    The Java compiler can be activated by using `Javac.exe` command at command line.


    Some of compiler options are:

    1. `-help`: Display all the compiler.

    2. `-version`: Returns the compiler version.

    3. `-verbose`: Output compiler messages.

    4. `-deprecation`: Identify retired APIs.

    5. `-nowarn`: Generate no warnings.


    The compiler options are case sensitive.

    A snapshot of Java options.


    ![](images/00005.jpeg)


    ### Java Interpreter

    It is used for executing Java programs i.e. the interpreter take bytecode as an
    input and execute that code by native code. The Java interpreter is identified
    by `Java.exe` command.


    Some of the command Java interpreter options are:

    1. `-version`: display interpreter version.

    2. `-verbose`: display interpreter information.

    3. `-help`: display interpreter options.


    The interpreter options are case sensitive.

    A snapshot of Java options


    ![](images/00006.jpeg)


    ### Summary

    The Java compiler is activted using `Javac.exe` command.It is used for compiling
    Java programs.The Java interpreter is called using `Java.exe` command. It is used
    for executing Java programs.


    ![](images/00001.jpeg)


