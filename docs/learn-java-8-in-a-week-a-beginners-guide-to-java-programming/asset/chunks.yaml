    \ ar;`\n- `dataType [][]ar;`\n- `dataType ar[][];`\n- `dataType []ar[];`\n\nLet’s\
    \ understand how to create and access 2 dimension array.\n\n```java\n//Prg2.java\n\
    //Description : Working with multidimension array\n\nclass Program {\n    static\
