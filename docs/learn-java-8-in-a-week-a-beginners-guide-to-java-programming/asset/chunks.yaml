    \n## 使用 instanceof 运算符\n\n它用于检查给定的变量是否属于给定的类型。它也被称为比较运算符，即它将变量与类型进行比较。\n\n让我们通过示例来理解\
    \ `instanceof` 运算符。\n\n```java\n//Prg4.java\n//Description : Using instanceof\
    \ operator\n\nclass Program {\n    static void instOps() {\n        Program obj\
