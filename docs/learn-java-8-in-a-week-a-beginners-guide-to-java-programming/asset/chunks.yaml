    \ Program obj=null;\n        if (obj instanceof Program)\n            System.out.println(\"\
    obj is typeof Program\");\n        else\n            System.out.println(\"obj\
    \ is not typeof Program\");\n    }\n\n    public static void main(String args[])\
    \ {\n        instOps();\n    }\n}\n```\n\nOutput:\n![](images/00073.gif)\n\n##\
    \ Summary\n\nLogical operators are used for checking multiple conditions together.\
