    Chapter 1


    What is Java?


    Topics


     Introduction


     Java as Software Platform


     Java as Programming Language


     Languages That Influenced Java


     Languages Influenced by Java


     Summary


    Introduction


    The current (Latest) version of Java is 8. Java can be classified and defined
    into two categories.


    1.  Software Platform.


    2.  Programming Language.


    Java as Software Platform


    Java platform is a collection of software components which allow development and
    execution of bytecode based languages. Bytecode is binary code that Java platform
    interpret. The Java platform is composed of


    1.  Compiler – It generate bytecode from source code


    2.  Java Virtual Machine – It provide runtime execution environment for bytecode.


    3.  Libraries – It contain Java API.


    4.  Tools – Various Java Tools.


    The Java bytecode has two important characteristics


    1.  It is processor independent i.e. the program can run on any processor architecture.


    2.  It is Operating System independent i.e. bytecode does not target any Operating
    System such as Windows or Linux.


    The Java platform is available in four flavors based upon device type.


    1.  Java Card – It is used in smart cards and small memory devices.


    2.  Java ME (Micro Edition) – It is used in Personnel Digital Assistants, Setup
    Box and printers application.


    3.  Java SE (Standard Edition) – It is used in development of desktop, communication
    and User Interface based applications.


    4.  Java EE (Enterprise Edition) – It is used in development of web based, messaging,
    distributed and enterprise applications.


    The Java Platform has support for many languages such as


    1.  Java


    2.  Jython


    3.  Jruby


    4.  Scala


    5.  Groovy


    6.  Rakudo Perl 6


    7.  Kotlin


    Java as Programming Language


    Java is multi paradigm programming language. It is one of the most used programming
    language for development of various types of software such as desktop, enterprise,
    web based and mobile applications.


    Some of important attributes of Java Language are


    1.  Statically typed – The type of the variable is known at compile time.


    2.  Object oriented – Object centered programming.


    3.  Concurrent – Support for multithreading programming.


    4.  Reflective – Allows inspection of class, method, interface, fields.


    Languages That Influenced Java


    Java language falls in ‘C’ family of language category. It has taken inspiration
    from many languages including languages which were released after Java. Some of
    the major languages that have influenced Java are:


    1.  C++


    2.  Oberon


    3.  Ada 83


    4.  C#


    5.  Object Pascal


    Languages Influenced by Java


    As per tiobe index Java is the No.1 Programming language today. Java has influenced
    many


    Modern languages such as:


    1.  C#


    2.  Clojure


    3.  Python


    4.  JavaScript


    5.  PHP


    6.  Scala


    7.  Groovy


    Summary


    Java is a programming language and a platform. Java platform is divided into 4
    parts – SE, ME, EE and Card. Java is multi-paradigm programming language.


    ![](images/00001.jpeg)


    Chapter 2


    Java Development Kit and Java Runtime Engine


    Topics


     Introduction


     Java Runtime Engine


     Java Development Kit


     Installing JDK


     Installing Notepad++


     Summary


    Introduction


    The minimum environment required for a java program to run is called JRE (Java
    Runtime Engine). JDK is the minimum environment required for development of Java
    Applications.


    Java Runtime Engine (JRE)


    It is an environment that is required for executing a java application. A very
    popular usage of JRE is with a browser where it is available as a plugin to allow
    applet (client side program) to execute. JRE is composed of following components:


    1.  Interpreter: It understand binary java code (e.g.: java.exe).


    2.  Tools: They provide various functionality such as security, core services,
    internationalization, RMI etc.


    (e.g.: keytool, rmiregistry, javacpl etc)


                  c. Library: Java Application Programming Interface (rt.jar, jce.jar,
    jsse.jar etc.)


    JRE cannot be used for development of Java application but it is used for executing
    them.


    Java Development Kit (JDK)


    It is an environment that is targeted for developers who desire to develop Java
    applications.


    JDK is nothing but Java Standard Edition which is used for development of desktop,
    user interface, communication and applet types of applications. JDK is composed
    of following components:


    1.  Compiler: It is used to compile java code to bytecode (e.g Javac.exe).


    2.  Interpreter: It processes bytecode to native code (e.g.  java.exe).'
