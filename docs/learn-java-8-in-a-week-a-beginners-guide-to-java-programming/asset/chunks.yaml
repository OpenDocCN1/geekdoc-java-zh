    \n### 使用 Continue 关键字\n`continue` 语句跳过循环的当前迭代。执行 `continue` 语句后，控制将返回到循环的开始。它可以有两种类型：\n\
    1. 带标签的\n2. 无标签的\n\n让我们通过示例来理解 `Continue` 关键字。\n\n//Prg2.java\n//Description：使用\
    \ continue - 带标签和无标签\n```java\nclass Program {\n    static void contiOps() {\n\
    \        int limit = 10;\n        int facto = 1;\n        OutLoop: for (int i\
    \ = 1; i <= limit; i++) {\n            facto = 1;\n            for (int j = 2;\
    \ j <= i; j++) {\n                if (i > 10 && i % 2 == 1) {\n              \
    \      continue OutLoop;\n                }\n                facto *= j;\n   \
    \         }\n            System.out.println(i + \" factorial is \" + facto);\n\
    \        }\n    }\n\n    public static void main(String args[]) {\n        contiOps();\n\
    \    }\n}\n```\nOutput:\n![](img/0062.gif)\n\n### 总结\n`Break` 语句用于终止循环。`Continue`\
    \ 语句用于跳过循环的后续指令。\n\n![](img/00001.jpeg)\n\n# 第 24 章：类型转换\n\n## 话题\n- 引言\n- 什么是类型转换？\n\
    - 什么是强制转换（转型）？\n- 总结\n\n### 引言\n在本章中，你将学习类型转换和强制转换。当所需的数据格式不是当前格式时，则必须进行转换或强制转换。\n\
    \n### 什么是类型转换？\n将某种类型变量的值赋值给兼容类型的变量被称为类型转换。例如 `byte` 到 `int`、`int` 到 `long`、`int`\
    \ 到 `double`。类型转换不会发生在不兼容类型之间。例如 `boolean` 到 `int`，或者 `string` 无法转换为 `int`。\n\n\
    类型转换具有扩大的性质，即它发生在小内存类型到大内存类型之间，例如 `byte` 到 `int` 或 `int` 到 `long`。\n\n让我们通过示例来理解类型转换。\n\
    \n//Prg.java\n//Description：关于类型的操作\n```java\nclass Program {\n    static void\
    \ tcOps() { // 小到大\n        byte b=5;\n        int i=b; // 自动\n        float f=b;\n\
    \        double d=b;\n        System.out.println(\"The value after int :\" + i);\n\
    \        System.out.println(\"The value after double :\" + d);\n    }\n\n    public\
    \ static void main(String args[]) {\n        tcOps();\n    }\n}\n```\nOutput:\n\
    ![](img/0063.gif) 如果在大类型到小类型之间进行转换将会导致编译错误。\n![](img/0064.jpeg)\n\n### 什么是强制转换？\n\
    如果目标类型小于源类型，则必须显式转换，这被称为强制转换。例如 `int i=10; byte b = (byte) i;`。\n\n让我们通过示例来理解强制转换。\n\
    \n//Prg2.java\n//Description：关于强制转换的操作\n```java\nclass Program {\n    static void\
    \ tcOps() { // 大到小\n        double d= 45.7899;\n        float f = (float)d;\n\
    \        int i = (int) d;\n        long l = (long) d;\n        //boolean b = (boolean)\
    \ d; // 编译错误\n        System.out.println(\"The value after type casting(double\
    \ to float) \"+ f);\n        System.out.println(\"The value after type casting(double\
    \ to int) \"+ i);\n    }\n}\n```\n\n"
