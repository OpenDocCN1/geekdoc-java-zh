  数组是内存中的数据容器。它是固定大小且具有特定数据类型的。`Length` 属性返回当前维度的大小。\n\n![](img/00001.jpeg)\n\n# 第\
  \ 28 章: 锯齿数组 (Jagged Arrays)\n\n## 主题\n- 引言\n- 使用锯齿数组\n- 总结\n\n## 引言\n在本章中，我将讨论如何创建和使用锯齿数组。锯齿数组通过允许创建用户需要的数组来更好地利用内存。\n\
  \n## 使用锯齿数组\n这是一种多维数组，其中每一行的列数可以不同。首先标识行，然后为每行标识列。这有助于根据需求分配内存，从而减少内存浪费。\n\n###\
  \ 语法\n```java\nint ar[][] = new int[2][];\n\nar[0] = new int[2];  // 第一行将有 2 列\n\
  \nar[1] = new int[3];  // 第二行将有 3 列\n```\n\n让我们通过示例来理解锯齿数组。\n\n```java\n//Prg.java\n\
  //Description : 锯齿数组操作\n\nclass Program {\n    static void jaggOps() {\n       \
  \ int ar[][] = new int[3][];\n        ar[0]=new int [1];\n        ar[1] = new int[2];\n\
  \        ar[2] = new int [3];\n        for(int i=0;i<ar.length;i++)\n          \
  \  for(int j=0;j<ar[i].length;j++)\n                ar[i][j] = i*j;\n        for(int\
  \ i=0;i<ar.length;i++)\n            for(int j=0;j<ar[i].length;j++)\n          \
  \      System.out.println(\"The value at location :ar[\"+i+\"]+\"[\"+j+\"] is :\"\
  \ + ar[i][j]);\n    public static void main(String args[]) {\n        jaggOps();\n\
  \    }\n}\n```\n\n![](img/00078.gif)\n行数为 2。第一行有 2 列，第二行有 3 列。\n\n## 总结\n在锯齿数组中，列数可以不同。锯齿数组有助于优化内存。\n\
  \n![](img/00001.jpeg)\n\n# 第 29 章: For Each 循环 (For Each Loop)\n\n## 主题\n- 引言\n\
  - 使用 For Loop\n- 总结\n\n## 引言\n在本章中，我们将讨论如何使用 For Each 循环遍历数组。对于聚合类型，for each 循环比\
  \ for 循环更好且简单。\n\n## 使用 For Loop\n这是在 Java 5 中引入的。for each 循环用于遍历数组和集合，即它是专门用于聚合类型的循环。与\
  \ `for`、`while` 和 `do..while` 循环相比，for each 循环不容易出错，因为没有条件检查，因此使用起来更简单更安全。\n\n####\
  \ 主要特性\n1. 不需要递增\n2. 无条件检查\n\n### 语法\n```java\nfor(data_type variable : array) {\
  \ }\n```\n\n让我们通过示例来理解 for each 循环的使用。\n\n### 在单维数组上使用 each\n```java\n//Prg.java\n\
  //Description : 单维数组的 for.. each 循环\n\nclass Program {\n    static void foreachOps()\
  \ {\n        int ar[] = {1,2,3,4,5,6,7};\n        for(int i : ar)\n            System.out.print(i+\"\
  \ \");\n    }\npublic static void main(String args[]) {\n        foreachOps();\n\
  \    }\n}\n```\n\n输出:\n\n![](img/00079.gif)\n\nfor each 循环也可以用于多维数组。外层循环遍历行，内层循环遍历列。\n\
  \n```java\n//Prg2.java\n//Description 使用多维数组的 for.. each 循环\n\nclass Program {\n\
  \    static void foreachOps() {\n        int ar[][] = {{13,22},{36,43},{56,68},{71,83}};\n\
  \        for(int i[] : ar)\n            for (int j : i)\n                System.out.print(j+\"\
  \ \");\n    }\npublic static void main(String args[]) {\n        foreachOps();\n\
  \    }\n}\n```\n"
