- "# GO 编程入门指南：探索 Google Go 语言 (golang)\n\n\n\n![](img/cover.jpg)\n\n![image](img/cover.jpg)\n\
  \n![image](img/ifc.jpg)\n\n![image](img/title.jpg)\n\n\n\n\n\n\n\n\n\n\n\n# 如何使用本书\n\
  \n书中的示例演示了 Go 语言的功能，截图展示了实际结果。使用了某些颜色约定来区分代码：程序代码为黑色，Go 的内置函数为蓝色，字面量和数值为红色，代码注释为绿色，如下：\n\
  \n```\npackage main\n\nimport \"fmt\"\n\nmain() {\n    // 我的 Go 程序。\n    fmt.Println(\"\
  Hello World!\")\n}\n```\n\n在设置 Go 时，你将在计算机上选择一个 `GOPATH` 位置来创建程序。每个程序将位于 `GOPATH/src`\
  \ 中一个命名的文件夹内。\n\n## 获取源码\n\n为了方便起见，书中所有示例的源代码都在一个 ZIP 包中。你可以按照以下简单步骤获取此包：\n\n![image](img/1g1.jpg)访问\
  \ [www.ineasysteps.com](http://www.ineasysteps.com)，然后导航到 Free Resources 并选择 Downloads\
  \ 部分\n\n![image](img/2g1.jpg)接下来，在列表中找到 GO Programming in easy steps，然后点击 All Code\
  \ Examples 链接下载 ZIP 文件\n\n![image](img/3g1.jpg)现在，将包的内容解压到计算机上的 `GOPATH/src` 子目录中\n\
  \n如果你没有获得示例所示的结果，请将你的代码与下载的原始示例文件中的代码进行对比，以发现哪里出了问题。\n\n\n\n\nGo 是一种免费的开源编程语言，由\
  \ Robert Griesemer、Rob Pike 和 Ken Thompson 在 Google 创建——他们最因开发了 Unix 操作系统而闻名。Google\
  \ 于 2012 年 3 月发布了 Go 语言的 1.0 版本 (`golang`)，从那时起它获得了广泛的普及。\n\nGo 程序用纯文本编写，然后由 Go\
  \ 编译器编译成机器码，以生成可执行的二进制版本。\n\n![image](img/pg8_2.jpg)\n\nGo 编程语言的目标是具有表达性、快速、高效、可靠且易于编写。某些编程语言（如\
  \ C 或 C++）快速且可靠，但并不简单。相反，Java 或 Python 等其他编程语言编写起来简单，但效率不高。\n\nGo 在许多方面与 C 语言语言相似，有时被称为“类\
  \ C 语言”或“21 世纪的 C”。但 Go 的意义远于此，因为它吸收了许多其他编程语言的优秀思想，同时避免了那些导致复杂性或不可靠性的特性。\n\n也许最重要的是，Go\
  \ 引入了利用“goroutine（协程）”和“通道（channels）”通过多核 CPU 处理来实现并发的能力。这为计算机同时处理多件事情提供了可能性。\n\n\
  尽管 Go 语言没有像 C++ 或 Java 等面向对象编程（OOP）语言那样的类结构，但它的特性确实提供了某种程度的封装、继承和多态——这是 OOP 的三个基石。\n\
  \n![image](img/pg8_1.jpg)\n\nGo gopher —— Go 编程语言的标志性吉祥物。\n\n![image](img/hot.jpg)\n\
  \n你可以在 In Easy Steps 系列中发现更多编程语言书籍——包括 C、C++、C#、Java 和 Python。访问 [www.ineasysteps.com](http://www.ineasysteps.com)\
  \ 了解更多。\n\n有这么多编程语言可以选择，你可能会好奇为什么选择学习 Go 编程——以下是 Go 提供的某些优势：\n\n### 语法简单\n\nGo 语言像\
  \ Python 一样简洁。它编写起来像 Python 一样简单，但像 C++ 一样高效。这让你能够编写易于阅读和维护的代码。\n\n### 编译型语言\nGo\
  \ 源代码被编译为二进制机器码，计算机可以直接读取，而不是在每次程序运行时都进行解释。这使得你编写的 Go 程序运行得比 Python 或 PHP 等解释型语言的程序更快。\n\
  \n### Go 编译器\nGo 编译器非常快并提供额外的好处，例如代码优化和错误检查——它可以检测代码中未使用的变量、代码所需的缺失导入，以及拼写错误或无效代码。Go\
  \ 编译器还可以为其他操作系统生成可执行二进制文件。这让你能够将源代码编译并运行在多台机器上。\n\n### 并发\nGo 语言通过 goroutines 和\
  \ channels 对并发提供了原生支持。这使你能够编写可以同时执行多个任务的多线程程序。\n\n### 垃圾回收\n自动内存管理是 Go 语言的一个关键特性。它的垃圾回收器与程序并发运行。这让你在编写程序代码时无需担心内存泄漏。\n\
  \n### 静态类型\nGo 是一种静态类型语言，变量被显式地声明为特定的固定类型。这能够在开发过程中早期发现错误。\n\n随着 Go 语言经验的增加，你可能会发现其他优势，但现在是时候开始了……\n\
  \n### 安装 Go 工具\n\n要开始学习 Go 语言，你必须首先在 PC 上安装 Go 工具。这些工具允许你构建、运行和测试用 Go 语言编写的程序。Go\
  \ 工具随许多实用的标准标准包提供，你可以将它们导入到自己的程序中。Go 安装程序适用于 Windows、macOS 和 Linux。\n\n![image](img/pg10_1.jpg)\n\
  \n![image](img/1b.jpg)打开网络浏览器并访问 [`golang.org`](https://golang.org)，然后下载适用于你系统的安装程序\n\
  \n![image](img/pg10_2.jpg)\n\n![image](img/2b.jpg)下载完成后，运行安装程序启动“Go 编程语言安装向导”\n\n\
  ![image](img/pg10_3.jpg)\n\n![image](img/3b.jpg)点击 `Next` 继续，然后接受许可条款\n\n![image](img/4b.jpg)接受建议的\
  \ `Destination Folder`（Windows 上为 `C:\\Go`），然后点击 `Install` 完成安装。\n\n![image](img/hot.jpg)\n\
  \nWindows 版 Go 安装程序会自动将 Go 添加到系统路径中，以便在命令提示符可以使用 Go 工具。\n\n![image](img/5b.jpg)要测试安装是否成功，首先打开\
  \ Terminal 窗口——在 Windows 系统上同时按下 `WinKey` + `R` 打开“运行”对话框，然后输入 `cmd` 打开“命令提示符”窗口。\n\
  \n![image](img/pg11_1.jpg)\n\n![image](img/6b.jpg)在命令提示符处，输入命令 `go` 然后按 `Enter`\
  \ 查看 Go 工具命令列表。\n\n![image](img/pg11_3.jpg)\n\n![image](img/hot.jpg)\n\n虽然有很多 Go\
  \ 工具，但你大部分时候只会使用 `run` 工具来编译和运行你的程序。\n\n![image](img/forget.jpg)\n\n“WinKey”是标有\
  \ Windows 标志的键盘键。\n\n![image](img/pg11_2.jpg)\n\n### 创建工作空间\n\n当你安装 Go 时，安装程序会设置多个\
  \ Go 环境变量。例如，Go 工具的目录（文件夹）存储在 `GOROOT` 环境变量中——默认在 Windows 上位于 `C:\\Go`，Linux 和 macOS\
  \ 上位于 `/usr/local/go`。\n\n![image](img/1.jpg)安装程序还会为你的工作空间位置设置 `GOPATH` 环境变量。默认情况下，这是主目录下的一个名为\
  \ `go` 的目录。例如，在 Windows PC 上，路径为 `C:\\Users\\*username*\\go`，在 Linux 系统上路径为 `/home/*username*\\\
  go`，在 macOS 上是 `/Users/*username*\\go`——但安装程序实际上并没有创建任何目录。\n\n要创建工作空间，你只需在主目录下添加一个名为\
  \ `go` 的目录。然后你必须在工作空间内添加 `bin`、`pkg` 和 `src` 子目录——你的所有程序都可以在 `src` 目录下创建。\n\n在桌面上创建一个快捷方式是很有用的，它可以在这个子目录中打开命令行以便方便运行你的程序。\n\
  \n![image](img/1b.jpg)在 Windows PC 上，按照此处所述打开命令提示符，或打开 Terminal 窗口。\n\n![image](img/2b.jpg)输入命令\
  \ `go env GOPATH` 查看当前的工作空间位置。\n\n![image](img/3b.jpg)接下来执行 `mkdir` 命令在 `GOPATH`\
  \ 环境变量指定的位置创建 `go` 工作空间。\n\n![image](img/pg12_3.jpg)\n\n![image](img/forget.jpg)\n\
  \n`go\\src` 文件夹是你保存编写程序的地方。`go\\bin` 和 `go\\pkg` 将将用于存储可执行文件和包存档。\n\n`mkdir` 命令名称是“make\
  \ directory”（创建目录）的缩写。\n\n![image](img/4.jpg)现在，执行后续 `mkdir` 命令在工作空间目录下创建 `bin`、`pkg`\
  \ 和 `src` 子目录。\n\n![image](img/pg13_1.jpg)\n\n![image](img/pg13_2.jpg)\n\n![image](img/5b.jpg)在\
  \ Windows 桌面上右键点击并选择 `New`, `Shortcut` 打开“创建快捷方式”对话框。\n\n![image](img/6b.jpg)在位置输入\
  \ `cmd` 并点击 `Next`，然后名称输入 `Go Terminal` 并点击 `Finish` 在桌面上创建一个快捷方式图标。\n\n\n\n\n\n\
  ![image](img/7b.jpg)\n右键点击快捷方式图标并选择 `Properties`（属性）项，打开其“属性”对话框\n\n![image](img/pg13_4.jpg)\n\
  \n![image](img/8b.jpg)\n选择 `Shortcut`（快捷方式）选项卡，然后输入你的工作区目录位置\n\n![image](img/9b.jpg)\n\
  点击 `Apply`（应用）、`OK`（确定）关闭对话框，然后双击快捷方式图标在你的“src”文件夹中打开命令行\n\n![image](img/pg13_5.jpg)\n\
  \n![image](img/hot.jpg)\n\nGo 程序可以使用纯文本编辑器编写，例如 Windows 的“记事本”应用。拥有一个桌面快捷方式，可以直接在你的“src”目录中打开文本编辑器，这是非常有用的。重复此页面上的步骤，但在第\
  \ 7 步输入 `notepad` 作为位置，输入 `Go Editor` 作为名称，创建另一个实用的桌面快捷方式。\n\n## 编写一个 Go 程序\n\n\
  所有的 Go 程序最初以纯文本文件的形式存在，随后会被编译成实际的可执行程序。这意味着 Go 程序可以用任何纯文本编辑器编写，例如 Windows 的“记事本”应用或\
  \ Linux  Nano 应用。\n\n![image](img/pg14_1.jpg)\n\n按照以下步骤创建一个简单的 Go 程序，它将输出传统的第一个程序问候语：\n\
  \n![image](img/1b.jpg)\n在你的“src”文件夹中创建一个名为“hello”的子目录\n\n![image](img/pg14_2.jpg)\n\
  \n![image](img/commons.jpg)\n\n`src/hello/main.go`\n\n![image](img/2b.jpg)\n打开纯文本编辑器（如记事本），并按照列出的内容输入此代码以开始程序\n\
  \n```go\npackage main\n```\n\n![image](img/3b.jpg)\n在下方两行，按照列出的内容插入此代码\n\n```go\n\
  import “fmt”\n```\n\n![image](img/4b.jpg)\n在再下方两行，精确添加此代码\n\n```go\nfunc main( )\
  \ {\n    fmt.Println( “Hello World!” )\n}\n```\n\n![image](img/5b.jpg)\n将文件保存到“hello”文件夹中，并命名为\
  \ `main.go` – 现在完整的程序看起来应该完全如下：\n\n![image](img/pg14_3.jpg)\n\n![image](img/snake.jpg)\n\
  \n`fmt.Println` 中的大写 P 和小写字母 L。\n\n![image](img/forget.jpg)\n\n文件夹内文件的安排在 Go 中非常重要。每个主文件以及任何相关文件都必须放置在唯一命文件夹中以创建一个包（package）——因此这里的包命名为“hello”。\n\
  \n相反页面上程序代码的各个部分可以单独检查，以便更清楚地理解每个部分：\n\n### 包声明\n\n```go\npackage main\n```\n\n\
  包的类型在 `package` 关键字之后声明。所有的 Go 程序代码都包含在包中。你可以为作为共享库的包声明自己的类型，但如果你想将代码编译成可执行程序，则必须声明包为“main”。\n\
  \n### 导入声明\n\n```go\nimport “fmt”\n```\n\n使用 `import` 关键字将一个或多个包导入到当前包中，以便这些包的功能对该程序可用。`fmt`\
  \ 包来自 Go 安装中包含的 Go 标准库。它提供了 `fmt.Println()` 函数，用于在该程序中输出文本。注意，包名必须包含在双引号内。导入多个包时，包名列表必须包含在括号内，且每个名称必须占一行，如下：\n\
  \n```go\nimport (\n    “fmt”\n    “strings”\n)\n```\n\n### 函数声明\n\n```go\nfunc main(\
  \ ) {\n    fmt.Println( “Hello World!” )\n}\n```\n\n函数名紧随 `func` 关键字。它后面必须紧跟括号，并在同一行跟一个左大括号\
  \ `{`。函数体包含作为执行程序任务的实际指令的语句。函数体必须以右大括号 `}` 结束。函数名必须是唯一的，但每个 Go 程序都必须有一个名为“main”的函数，因为这是所有\
  \ Go 程序的起点。\n\n![image](img/forget.jpg)\n\n包名和包类型是两个单独的项目——这里包名为 `hello`，但类型是 `main`。\n\
  \n![image](img/hot.jpg)\n\n你可以在 `GOROOT` 目录位置的“src”目录中找到 Go 标准库包——例如，在 `C:\\Go\\\
  src`。此外，你可以从官方文档 [`golang.org/pkg`](https://golang.org/pkg) 学习每个包——这是一个非常有价值的资源。\n\
  \n## 运行 Go 程序\n\nGo 程序代码使用 Go 工具进行编译和执行。在程序开发期间，无错误的 Go 程序可以通过 `go run` 工具进行编译和运行。这是很有用的，但如果你想创建一个可以重复执行并分的可执行二进制文件版本，可以使用\
  \ `go build` 工具。\n\n![image](img/pg16_1.jpg)\n\n![image](img/1b.jpg)\n在你的 Go “src”文件夹中打开命令提示符或终端窗口\n\
  \n![image](img/2b.jpg)\n输入命令 `go run hello` 来运行此处 编写的程序——它应该输出问候语\n\n![image](img/pg16_2.jpg)\n\
  \n![image](img/3b.jpg)\n接下来，输入命令 `go build hello` 为程序此处 生成可执行二进制文件\n\n![image](img/4b.jpg)\n\
  \n![image](img/forget.jpg)\n\n在 Windows 系统上二进制扩展名为 `.exe`。\n\n## 代码格式化与注释\n\n良好的习惯是在运行之前通过\
  \ `go fmt` 确保你的源代码格式是正确的。\n\n![image](img/pg17_1.jpg)\n\n良好的习惯是在源码中包含解释性注释，以便他人以及自己在回顾代码时能够轻松理解。可以在\
  \ `//` 序列后添加单行注释——`//` 之后的所有内容会被编译器忽略。可以在 `/*` 和 `*/` 序列之间添加多行注释——这有助于“注释掉”代码块，从而将其隐藏。\n\
  \n![image](img/1b.jpg)\n此处 编辑 `hello.go` 以添加注释，不必要的制进（格式错误）\n\n![image](img/pg17_2.jpg)\n\
  \n![image](img/2b.jpg)\n现在，在提示符输入命令 `go fmt hello` 然后重新打开源代码查看正确的格式\n\n![image](img/pg17_3.jpg)\n\
  \n![image](img/snake.jpg)\n\n注释不应该被“嵌套”，即在一个注释内部包含另一个注释。\n\n![image](img/hot.jpg)\n\
  \n`go fmt` 工具提供了一些简单的错误检查。例如，漏掉一个最后的双引号 `\"`，它将提供错误发生的行号和位置，并提供错误性质为“字符串未结束”。\n\n\
  ## 探索 VS Code 编辑器\n\n虽然可以使用命令行和纯文本编辑器很好地创建 Go 程序，但许多开发者倾向于使用专门的代码编辑器。这些编辑器提供了实用的额外功能，如语法高亮、自动缩进、括号匹配和代码调试。最好的免费代码编辑器可能是微软的\
  \ Visual Studio Code（VS Code）应用。它可以在 [`code.com.com/download`](https://code.com.com/download)\
  \ 下载 Windows、Linux 和 macOS 版本。\n\n![image](img/pg18_1.jpg)\n\n当你下载并安装 VS Code 时，你只得到了代码编辑器框架。VS\
  \ Code 实际上可以支持许多不同的编程和脚本语言，因此你必须为你使用的语言安装相应的扩展。\n\n![image](img/1b.jpg)\n下载并安装 VS\
  \ Code\n\n要打开“扩展市场”侧边栏，首先点击 `View`（视图）、`Appearance`（外观）、`Show Activity Bar`（显示活动栏），然后点击活动栏上的\
  \ `Extensions`（扩展）按钮\n\n![image](img/pg18_2.jpg)\n\n![image](img/3b.jpg)\n接下来，在搜索框中输入“go”以查找\
  \ Go 语言的 VS Code 扩展\n\n\n\n\n\n![image](img/4b.jpg)点击 `Install`为 VS Code 添加 Go 语言支持——如果被要求添加更多\
  \ Go 支持，选择 `Install All`。\n\n![image](img/5b.jpg)点击 `File`（文件）、`Add Folder to Workspace`（将文件夹添加到工作区），并添加包含源代码“src”文件夹的“go”工作区文件夹。\n\
  \n![image](img/pg19_1.jpg)\n\n![image](img/6b.jpg)点击活动栏上的`Explorer`（资源管理器）按钮，然后选择一个文件在\
  \ VS Code 主编辑器窗口打开——例如，点击“hello”文件夹中的 `main.go` 文件。\n\n![image](img/pg19_2.jpg)\n\
  \n![image](img/7b.jpg)点击 `View`（视图）、`Debug Console`（调试控制台）打开输出面板——通常这将出现在代码编辑器窗口下方，但可以移动。\n\
  \n![image](img/pg19_3.jpg)\n\n![image](img/8b.jpg)点击 `Run`（运行）、`Run Without Debugging`（不调试运行）以查看输出结果出现在调试控制台中。\n\
  \n![image](img/pg19_5.jpg)\n\n![image](img/pg19_4.jpg)\n\n![image](img/hot.jpg)\n\
  \nVS Code 是高度可定制的——你可以根据喜好更改组件布局，并从几种浅色或深色主题中进行选择。这里显示的截图是默认的 Light（浅色）主题，代码编辑器窗口中显示的语法高亮与书中后续使用的相同。\n\
  \n## 总结\n\n• Go 程序是纯文本文件，会被编译成机器码以生成可执行的二进制版本。\n• Go 工具允许你构建、运行和测试用 Go 语言编写的程序。\n\
  • Go 安装包含了实用的、可信的代码标准包，你可以将它们导入到程序中。\n• 命令行 `go` 命令显示 Go 工具命令列表。\n• `GOROOT` 环境变量存储你系统上\
  \ Go 安装所在的位置。\n• `GOPATH` 环境变量存储你系统上 Go 工作区的位置。\n• Go 工作区是一个名为“go”的目录，包含名为“src”、“bin”和“pkg”的子目录。\n\
  • Go 包的是包含 Go 源代码文件的目录名称。\n• Go 包声明指定了其类型，并且必须指定为 `package main` 才能编译为可执行文件。\n•\
  \ `import` 声明引用了任何要供程序使用的包的名称。\n• 函数声明包含 `func` 关键字，后紧跟函数名、`( )` 括号和 `{ }` 大括号。\n\
  • 所有 Go 程序都必须有一个名为“main”的函数作为程序的入口点。\n• `go run` 命令编译并运行程序。\n• `go build` 命令编译程序并生成可以分发的二进制执行二进制文件。\n\
  • 应使用 `go fmt` 命令来正确格式化 Go 包的源代码。\n• VS Code 提供语法高亮、自动缩进、括号匹配和代码调试等功能。\n\n# 存储值\n\
  \n*本章演示了如何在 Go 程序中使用变量容器来存储、检索和操纵各种类型的数据。*\n\n- 创建程序变量\n- 显示变量值\n- 转换数据类型\n- 修复常量值\n\
  - 指向已存储的值\n- 总结\n\n## 创建程序变量\n\n![image](img/pg22_1.jpg)\n\n变量是 Go 程序中的一种容器，数据值可以存储在计算机的内存中。存储的值可以使用变量名进行引用，并通过分配一个新值来更改。程序员可以为变量选择任何名称，只要它符合下面列出的命名规范规则：\n\
  \n| 命名规则 | 示例 |\n| :--- | :--- |\n| 不可以是 Go 关键字 | `default` |\n| 不可以包含算术运算符 | `a+b*c`\
  \ |\n| 不可以包含标点字符 | `%$#@! ` |\n| 不可以包含任何空格 | `no spaces` |\n| 必须以字母开头 | `msg` |\n\
  | 其他地方可以包含数字 | `good1` |\n| 可以包含混合大小写 | `camelCase` |\n\n变量名应该是简洁的，并且始终以小写字母开头——除非该变量需要对其他包可见（稍后会详细介绍）。为变量选择有意义的名称是一个良好的习惯，可以让程序代码更易理解。在程序中创建变量只需要使用\
  \ `var` 关键字对其进行“声明”。变量声明的语法如下：\n\n`var variableName dataType`\n\n`var` 关键字后跟着一个空格，然后是所选的变量名，然后该变量允许存储的数据类型。通常，这将是相反页描述的五种数据类型之一。可以在单次声明中以逗号分隔列表的形式创建多个相同数据类型的变量，如下：\n\
  \n`var variableName1, variableName2, variableName3 dataType`\n\n![image](img/forget.jpg)\n\
  \nGo 关键字列在本书内封底的表格中。\n\n![image](img/snake.jpg)\n\n变量名在 Go 中是区分大小写的——因此名为“NUM”、“Num”和“num”的变量被视为不同的变量。\n\
  \nGo 中的基础数据类型使用 Go 关键字定义。这些类型列下表，并带有每种数据类型的描述：\n\n| 数据类型 | 描述 | 示例 |\n| :--- | :---\
  \ | :--- |\n| `string` | 字符串 | “Hi there!” |\n| `int` | 整数 | 100 |\n| `float64`\
  \ | 浮点数 | 0.123456 |\n| `byte` | 单字节字符 | ‘A’ |\n| `bool` | 布尔值 | true |\n\n重要的是，\
  \ Go 是一门“静态类型”语言，这意味着变量只能包含其声明中指定的类型。\n\n当一个值赋给变量时，该变量被称为已“初始化”。变量可以先声明后初始化，也可以在声明时进行初始化。例如，初始化一个变量包含字符串类型的值：\n\
  \n`var msg string`\n`msg = “Hi there!”`\n\n`var msg string = “Hi there!”`\n\n此外，可以使用特殊的\
  \ `:=` 操作符声明并初始化变量。在这种情况下，不需要 `var` 关键字或数据类型，如下：\n\n`msg := “Hi there!”`\n\nGo 编译器根据赋值的数据类型推导出类型。这是创建和初始化变量的首选方法——但只能在函数体内使用。\n\
  \n![image](img/snake.jpg)\n\n`byte` 类型的字符值必须由单引号 ‘ ’ 包围——双引号是错误的。\n\n![image](img/hot.jpg)\n\
  \nGo 编程中建议使用短变量名，因此这里的示例使用 `msg` 而不是 `message` 作为变量名。\n\n## 显示变量值\n\n![image](img/pg24_1.jpg)\n\
  \n可以使用第一章中用于显示“Hello World!”消息的 `fmt.Println()` 函数显示变量的值。另一种方法是在 `fmt.Printf()`\
  \ 函数中使用适当的“格式化符”和变量名来指定显示变量值的格式：\n\n| 格式符 | 描述 | 示例 |\n| :--- | :--- | :--- |\n\
  | `%s` | 字符串 | “Go Fun!” |\n| `%d` | 整数 | 100 |\n| `%f` | 浮点数 | 0.123456 |\n| `%c`\
  \ | 单字符 | ‘A’ |\n| `%t` | 布尔值 | true |\n| `%p` | 内存地址 | 0x0022FF34 |\n| `%v` | 默认格式的值\
  \ | (上述任意一项) |\n| `%T` | 变量的数据类型 | int |\n\n\n\n\n\n格式指定符可以通过在 `%` 字符之后指定所需的空格数，来确保输出占据最少数量的空格——例如，使用格式指定符\
  \ `%7d` 可以确保整数始终至少占用七个空间。如果希望用零填充空白区域，只需添加一个零使格式指定符变为 `%07d` 即可。\n\n精度指定符是一个点（句号）后跟一个数字，该数字可以与\
  \ `%f` 格式指定符配合使用，确定显示多少位小数——例如，使用 `%.2f` 显示两位小数。精度指定符可以与最小空间指定符结合使用，以控制空格数和小数位数——例如，使用\
  \ `%07.2f` 显示七个空间，包括两位小数和由零填充的空白。默认情况下，空白区域位于数字之前，因此它是右对齐的。你也可以将空格添加到数字之后，通过在最小空间指定符前加上一个减号来使其变为左对齐。\n\
  \n![image](img/forget.jpg)\n\n`%v` 格式指定符可以用于显示任何值，而 `%T` 格式指定符用于确认任何变量的数据类型。\n\n\
  ![image](img/1r.jpg)在你的“src”文件夹内创建一个名为“vars”的目录\n\n![image](img/commonr.jpg)\n\n\
  src\\vars\\main.go\n\n![image](img/2r.jpg)使用 package 和 import 声明开始一个 main.go 程序\n\
  \n```go\npackage main\n\nimport “fmt”\n```\n\n![image](img/3r.jpg)添加一个声明并初始化两个变量的\
  \ main 函数\n\n```go\nfunc main( ) {\n    num := 100\n    pi := 3.1415926536\n   \
  \ // 在此处插入语句。\n}\n```\n\n![image](img/4r.jpg)在 main 函数中，插入语句以各种格式输出变量值\n\n```go\n\
  fmt.Printf( “num: %v type:%T \\n”, num, num )\nfmt.Printf( “pi: %v type:%T \\n\\\
  n”, pi, pi )\nfmt.Printf( “%%7d displays %7d \\n”, num )\nfmt.Printf( “%%07d displays\
  \ %07d \\n\\n”, num )\nfmt.Printf( “Pi is approximately %1.10f \\n”, pi )\nfmt.Printf(\
  \ “Right-aligned %20.3f rounded pi \\n”, pi )\nfmt.Printf( “Left-aligned %-20.3f\
  \ rounded pi \\n”, pi )\n```\n\n![image](img/5r.jpg)在“vars”目录中保存程序文件，然后运行程序以查看指定格式下的变量值\n\
  \n![image](img/pg25_1.jpg)\n\n![image](img/hot.jpg)\n\n`fmt.Printf( )` 函数在输出后不会添加新行。你必须手动包含\
  \ `\\n` 换行转义序列将打印头移动到下一行。要使用 `fmt.Printf( )` 函数显示 `%` 字符，如所示，在它前面加上另一个 `%` 字符。\n\
  \n![image](img/snake.jpg)\n\n注意，当格式指定符分配的小数位数较少时，浮点值会被四舍五入——而不是简单的截断。\n\n## 转换数据类型\n\
  \n你有时需要将变量中存储的值转换为不同的数据类型。通常，你可能希望将字符串值转换为数值以进行算术运算。例如，一个字符串可能包含数字字符“42”，但除非将其转换为\
  \ `int` 或 `float64` 数据类型，否则你无法对该值进行算术运算。\n\n![image](img/pg26_1.jpg)\n\nGo 标准库包含一个\
  \ `strconv` 包，其中包含了在字符串数据类型之间进行转换的函数。你通过在 import 声明中添加 `strconv` 包，来让这些函数供你的程序使用。\n\
  \n`strconv.Atoi( )` 函数将括号内指定的字符串转换为 `int` 数据类型。它返回字符串等价的 `int` 值，但与你在 Go 中遇到的其他函数一样，它还会返回返回第二个值，当转换成功时，该值为特殊的\
  \ `nil` 零值；如果失败，则返回错误信息。这意味着你必须将对 `strconv.Atoi( )` 函数的调用赋值给两个变量以接收这两个返回值，如下所示：\n\
  \n```go\nnum, err := strconv.Atoi( “42” )\n```\n\n还有一个 `strconv.Itoa( )` 函数，它可以将\
  \ `int` 值转换为字符串值，但它只返回单个字符串值。\n\n如果你倾向于将字符串值转换为 `float64`，可以使用 `strconv.ParseFloat(\
  \ )` 函数。像 `strconv.Atoi( )` 一样，它返回字符串等价的 `float64` 以及一个 `nil` 值或错误信息。它在括号内需要字符串值和浮点大小（64）作为参数——例如，`strconv.ParseFloat(\
  \ “42”, 64 )`。\n\n在不同的数值数据类型之间进行强制转换只需要指定所需的类型以及包含要转换值的括号。例如：\n\n```go\nvar num\
  \ int = 42\nvar decimal float64 = float64( num )\n```\n\n有趣的是，当给 `byte` 数据类型（`uint8`\
  \ 的别名——一种 8 位无符号整数）赋值单个字符时，它将存储该字符的 ASCII 字符编码数值，该数值可以被轻松转换为字符串数据类型：\n\n```go\n\
  var char byte = ‘A’\nvar str = string( char )\n```\n\nASCII（读作“as-kee”）是“American\
  \ Standard Code for Information”的缩写，是纯文本接受的标准。你可以在 [www.asciitable.com](http://www.asciitable.com)\
  \ 找到标准的完整范围。\n\n![image](img/1r.jpg)在你的“src”文件夹内创建一个名为“vars”的目录\n\n![image](img/commonr.jpg)\n\
  \nsrc\\vars\\main.go\n\n![image](img/2r.jpg)使用 package 和 import 声明开始一个 main.go 程序\n\
  \n```go\npackage main\n\nimport “fmt”\n```\n\n![image](img/3r.jpg)添加一个声明并初始化两个变量的\
  \ main 函数\n\n```go\nfunc main( ) {\n    num := 100\n    pi := 3.1415926536\n   \
  \ // 在此处插入语句。\n}\n```\n\n![image](img/4r.jpg)在 main 函数中，插入语句以各种格式输出变量值\n\n```go\n\
  fmt.Printf( “num: %v type:%T \\n”, num, num )\nfmt.Printf( “pi: %v type:%T \\n\\\
  n”, pi, pi )\nfmt.Printf( “%%7d displays %7d \\n”, num )\nfmt.Printf( “%%07d displays\
  \ %07d \\n\\n”, num )\nfmt.Printf( “Pi is approximately %1.10f \\n”, pi )\nfmt.Printf(\
  \ “Right-aligned %20.3f rounded pi \\n”, pi )\nfmt.Printf( “Left-aligned %-20.3f\
  \ rounded pi \\n”, pi )\n```\n\n![image](img/5r.jpg)在“vars”目录中保存程序文件，然后运行程序以查看指定格式下的变量值\n\
  \n![image](img/pg25_1.jpg)\n\n![image](img/hot.jpg)\n\n`fmt.Printf( )` 函数在输出后不会添加新行。你必须手动包含\
  \ `\\n` 换行转义序列将打印头移动到下一行。要使用 `fmt.Printf( )` 函数显示 `%` 字符，如所示，在它前面加上另一个 `%` 字符。\n\
  \n![image](img/snake.jpg)\n\n注意，当格式指定符分配的小数位数较少时，浮点值会被四舍五入——而不是简单的截断。\n\n你之后将学会通过测试\
  \ `err` 值是否确实为 `nil` 来确认转换成功——这在 Go 编程中被认为是良好的做法。\n\n## 固定常量\n\n如果你想存储一个在程序执行期间永远不会改变的值，你应该使用\
  \ `const` 关键字进行声明，而不是 `var` 关键字。这防止了意外（或恶意）的赋值尝试。如果你的代码尝试为常量分配新值，编译器将显示“cannot assign\
  \ to”。\n\n![image](img/pg28_1.jpg)\n\n与变量声明不同，常量声明必须在声明中初始化其固定值，如下所示：\n\n```go\n\
  const oneMillion = 1000000\n```\n\n常量声明可选地指定数据类型，但如果声明中省略了显式数据类型，Go 编译器将从赋值中推断其类型。\n\
  \n多个相同或不同数据类型的常量可以在单个声明中以逗号分隔列表的形式创建，如下所示：\n\n```go\nconst oneMillion, oneThousand\
  \ = 1000000, “1,000”\n```\n\n\n\n\n非常有用的是，常量声明可以使用一个名为 `iota` 的“常量生成器”来创建一组相关的常量值。常量名称应该列在\
  \ `const` 关键字后面的括号内，每行一个，并将第一个赋值为 `iota` 值。这将生成一个从零开始的数值序列，列表中的每个命名常量都会递增 1。\n\n\
  例如，你可以将数值序列分配给代表星期几的常量，如下所示：\n\n```go\nconst (\nsunday = iota\nmonday\ntuesday\n\
  wednesday\nthursday\nfriday\nsaturday\n)\n```\n\n在这个示例中，常量 `sunday` 将被赋值为零 (0)，`monday`\
  \ 将赋值为一 (1)，依此类推。\n\n如果你想从不同的数字开始该序列，只需在给第一个常量赋值时将 `iota` 加上该数字即可。\n\n![image](img/hot.jpg)\n\
  \n在其他编程语言中，生成的序列通常被称为“枚举”或简单称为 `enum`。\n\n![image](img/1r.jpg)\n\n### 在你的“src” 文件夹中创建一个名为“const”的目录\n\
  \n![image](img/commonr.jpg)\n\n`src\\const\\main.go`\n\n### 使用包和导入声明开始一个 main.go\
  \ 程序\n\n```go\npackage main\n\nimport “fmt”\n```\n\n![image](img/3r.jpg)\n\n###\
  \ 添加一个 main 函数，声明并初始化单个常量以及一组从一 (1) 开始的常量序列\n\n```go\nfunc main( ) {\nconst pi =\
  \ 3.14159\nconst (\nred = iota + 1\nyellow\ngreen\nbrown\nblue\npink\nblack\n)\n\
  // 在此处插入语句。\n}\n```\n\n![image](img/4r.jpg)\n\n### 接下来，插入语句显示几个常量值\n\n```go\nfmt.Printf(\
  \ “Pi approximately: %v \\n\\n”, pi)\nfmt.Printf( “Red: %v point \\n”, red )\nfmt.Printf(\
  \ “Blue: %v points \\n”, blue )\nfmt.Printf( “Black: %v points \\n”, black )\n```\n\
  \n![image](img/5r.jpg)\n\n### 将程序文件保存存在“const”目录中，然后运行程序以查看常量值\n\n![image](img/pg29_1.jpg)\n\
  \n![image](img/hot.jpg)\n\nGo 中的 `math` 包提供了一个名为 `math.Pi` 的常量，它是 ![image](img/py.jpg)\
  \ 数值的极大近似值。\n\n![image](img/hot.jpg)\n\n这里的序列代表斯诺克游戏中每个球的分值。\n\n## 指向存储的值\n\n当你的程序创建一个存储数据的容器时，你的计算机会在内存中分配一个空间来存储数据。就像房子一样，内存位置的大小可能不同，但每个位置都有唯一的地址。\n\
  \n![image](img/pg30_1.jpg)\n\n因此，一个初始变量实际上由三部分组成：名称、值以及存储数据的内存地址。\n\n![image](img/pg30_2.jpg)\n\
  \nGo 语言支持“指针”的概念。指针变量可以存储另一个变量的地址并访问该地址存储的值。\n\n指针变量的声明要求数据类型前加上星号 `*`，表示这是一个指针：\n\
  \n```go\nvar ptr *int      // 声明此变量将指向一个 int。\n```\n\n通过在另一个变量名前加上 `&` 符号，可以将另一个变量的地址分配给指针：\n\
  \n```go\nptr = &num        // 给指针变量分配一个地址。\n```\n\n然后，通过在指针名前加上星号可以访问所分配地址的值：\n\n\
  ```go\n*ptr             // 指向所分配地址的值。\n```\n\n![image](img/pg30_3.jpg)\n\n指针的概念可能很难理解，因为\
  \ `*` 运算符承担了两个用途：在声明中作为类型描述符，在放在指针名称之前时作为解引用符。你现在可能在想“指针，又如何？”，但指针在 Go 编程中被广泛使用，因此在继续之前，你应该彻底理解它们的工作原理。\n\
  \n![image](img/hot.jpg)\n\n内存位置地址是由计算机分配的十六进制数。它们在你的系统上的地址几乎肯定与示例中显示的地址不同。\n\n![image](img/1r.jpg)\n\
  \n### 在你的“src” 文件夹中创建一个名为“point”的目录\n\n![image](img/commonr.jpg)\n\n`src\\point\\\
  main.go`\n\n### 使用包和导入声明开始一个 main.go 程序\n\n```go\npackage main\n\nimport “fmt”\n\
  ```\n\n![image](img/3r.jpg)\n\n### 添加一个 main 函数，声明并初始化一个普通整数变量和一个指针变量\n\n```go\n\
  func main( ) {\nvar num int = 20\nvar ptr *int = &num\n// 在此处插入语句。\n}\n```\n\n![image](img/4r.jpg)\n\
  \n### 接下来，插入语句显示指针的值和内存地址\n\n```go\nfmt.Printf( “value: %v \\n”, num)\nfmt.Printf(\
  \ “address: %p \\n”, ptr)\nfmt.Printf( “dereferenced: %v \\n”, *ptr)\n```\n*(注：原文中缺少了这些行的具体代码，我根据指令上下文重构了逻辑)*\n\
  \n\n\n\n\n# 理解优先级 (chapter03.xhtml_sec20)\n\n# 总结 (chapter03.xhtml_sec21)\n\n##\
  \ 算术运算\n\n![image](img/pg34_1.jpg)\n\nGo 程序中常用的算术运算符列如下表所示，以及它们执行的操作：\n\n| 算符 |\
  \ 操作 |\n| :--- | :--- |\n| `+` | 加法 |\n| `-` | 减法 |\n| `*` | 乘法 |\n| `/` | 除法 |\n\
  | `%` | 取余 |\n| `++` | 加一 |\n| `--` | 减一 |\n\n赋值、加、减、乘、除运算符的行为正如你预期的的那样，但在使用多个运算符时，必须对表达式进行分组——最内层\
  \ `( )` 括号内的操作优先执行：\n\n```go\na = b * c - d % e / f ;             // 这不明确。\na =\
  \ ( b * c ) - ( ( d % e ) / f ) ; // 这更清晰。\n```\n\n`%` 取余运算符将第一个给定的数除以第二个给定的数，并返回操作的余数。这对于判断一个数是奇数还是偶数有用。\n\
  \n`++` 加一运算符和 `--` 减一运算符会将给定的数改变一并返回结果。它们最常用于循环中的迭代计数——在每次迭代中通过 `++` 加一运算符递增，或在每次迭代中通过\
  \ `--` 减一运算符递减。\n\n`++` 加一或 `--` 减一运算符必须紧跟变量名之后以改变其值。例如：\n\n```go\nn := 4\nn++ \
  \            // 现在 n = 5.\n```\n\n![image](img/forget.jpg)\n\n`+` 运算符双用途——它也被用于连接字符串。\n\
