  \nGo 编程中常用于比较两个数值的运算符列如下表所示：\n\n| 运算符 | 比较测试 |\n| :--- | :--- |\n| `==` | 等于 |\n\
  | `!=` | 不相等 |\n| `>` | 大于 |\n| `<` | 小于 |\n| `>=` | 大于等于 |\n| `<=` | 小于等于 |\n\n\
  `==` 等于运算符比较两个操作数，如果两者的值相等则返回 true，否则 `==` 运算符将返回 false。如果两者都是数字，则它们相等；如果两者都是字符，则对它们的\
  \ ASCII 值进行数值比较。\n\n相反，`!=` 不相等运算符在两个操作数不相等时返回 true，使用与 `==` 等于运算符相同的规则，否则返回 false。\n\
  \n\n\n\n\n`>` “大于”运算符比较两个操作数，如果第一个操作数的值大于第二个，则返回 `true`；如果它的值等于或小于第二个，则返回 `false`。`<`\
  \ “小于”运算符执行相同的比较，但如果第一个操作数的值小于第二个操作数，它则返回 `true`，否则返回 `false`。通常，`>` “大于”运算符或 `<`\
  \ “小于”运算符用于测试循环结构中迭代计数器的值。\n\n在 `>` “大于”运算符或 `<` “小于”运算符后添加 `=` 赋值运算符，可以使它们在两个操作数的值完全相等时也返回\
  \ `true`。\n\n![image](img/hot.jpg)\n\n比较运算符也称为“关系运算符”。\n\n![image](img/1g.jpg)在你的“src”\
  \ 文件夹内创建一个名为“comp”的目录\n\n![image](img/commong.jpg)\n\n`src\\comp\\main.go`\n\n![image](img/2g.jpg)带有\
  \ package 和 import 声明开始一个 main.go 程序\n\n```go\npackage main\n\nimport “fmt”\n```\n\
  \n![image](img/3g.jpg)添加一个声明并初始化五个变量的 main 函数\n\n```go\nfunc main( ) {\n    var\
  \ zero, num, max int = 0, 0, 1\n    var up, dn byte = ‘A’, ‘a’\n    // Statements\
  \ to be inserted here.\n}\n```\n\n![image](img/4g.jpg)在 main 函数中，插入语句以输出几次比较的结果\n\
  \n```go\nresult := ( num == zero )             // 0 == 0.\nfmt.Println( “Equality:\\\
  tnum == zero\\t”, result )\nresult = ( up == dn )                 // A == a.\nfmt.Println(\
  \ “Equality:\\tup == dn\\t”, result )\nresult = ( max != zero )              //\
  \ 1 != 0.\nfmt.Println( “Inequality:\\tmax != zero\\t”, result )\nresult = ( zero\
  \ > max )               // 0 > 1.\nfmt.Println( “Greater:\\tzero > max\\t”, result\
  \ )\nresult = ( max <= zero )              // 1 <= 0.\nfmt.Println( “Less or Equal:\\\
  tmax <= zero\\t”, result )\n```\n\n![image](img/5g.jpg)将程序文件保存在“comp”目录中，然后运行程序以查看每次比较的结果\n\
  \n![image](img/pg39_1.jpg)\n\n![image](img/forget.jpg)\n\n大写字母‘A’的 ASCII 值为 65，但小写字母‘a’的值是\
  \ 97——因此它们在这里比较返回 `false`。\n\n![image](img/snake.jpg)\n\n比较数字时，记住要测试相等性，也要测试高低值情况。\n\
  \n## 评估逻辑\n\n![image](img/pg40_1.jpg)\n\nGo 编程中最常用的逻辑运算符如下表所示：\n\n| 运算符 | 操作 |\n\
  | :--- | :--- |\n| && | 逻辑与 |\n| || | 逻辑或 |\n| ! | 逻辑非 |\n\n逻辑运算符用于具有布尔值 `true`\
  \ 或 `false` 的操作数，或者可以转换为 true 或 false 的值。\n\n`&&` 逻辑与运算符将评估两个操作数，只有当两个操作数本身都为 true\
  \ 时，才会返回 `true`。否则，`&&` 逻辑与运算符将返回 `false`。这用于条件分支，通过测试两个条件来决定程序的运行方向——如果两个条件都满足，程序将向某个方向运行，否则它将采取另一个方向。\n\
  \n与需要两个操作数都为 true 的 `&&` 逻辑与运算符不同，`||` 逻辑或运算符将评估其两个操作数，如果其中任一个操作数本身返回 true，它将返回\
  \ `true`。然而，如果两个操作数都不返回 true，那么 `||` 逻辑或运算符将返回 `false`。这在 Go 编程中非常用，用于在两个操作数（两个测试条件）中的任一条件被满足时执行某项操作。\n\
  \n`!` 逻辑非运算符是一个一元运算符，用在单个操作数之前。它返回给定操作数的反反值，因此如果变量 `a` 的值为 `true`，那么 `!a` 的值就是 `false`。`!`\
  \ 逻辑非运算符在 Go 程序中非常有用，可以使用像 `a = !a` 这样的语句在连续的循环迭代中切换变量的值。这确保了每次通过时值都会发生变化，就像开关灯一样。\n\
  \n![image](img/pg40_2.jpg)\n\n“布尔”（boolean）一词是指英国数学家乔治·布尔（George Boole，1815-1864）开发的逻辑思维体系。\n\
