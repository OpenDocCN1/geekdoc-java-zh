  \ `rand.Seed()` 函数，该种子在每次程序运行时都应该是唯一的。一种方便的方法是使用当前系统时间，通过调用 `time.Now()` 函数并使用 `Time`\
  \ 数据类型的 `UnixNano()` 方法提取自 Unix 纪（Epoch）以来经过的纳秒整数计数。此值在每次程序运行时都会不同，因此将此整数作为 `rand.Seed()`\
  \ 函数的参数，将可以确保每次程序运行时都会生成不同的伪随机顺序。\n\n![image](img/1r.jpg)在程序中导入 Go 标准库 `math/rand`\
  \ 包，以及用于设置随机种子的 `time` 包和用于转换随机数的 `strconv` 包。\n\n```go\nimport ( \"fmt\"\n\t\"\
  math/rand\"\n\t\"strconv\"\n\t\"time\"\n)\n```\n\n![image](img/commonr.jpg)\n\n\
  src\\lotto\\main.go\n\n![image](img/2r.jpg)接下来，为随机生成器指定一个唯一的种子\n\n```go\nrand.Seed(\
  \ time.Now().UnixNano() )\n```\n\n![image](img/3r.jpg)现在，生成一个从零到 58 的整数切片\n\n```go\n\
  nums := rand.Perm( 59 )\n```\n\n![image](img/4r.jpg)然后，增加范围变为包含 1-59 \n\n```go\n\
  for i := 0 ; i < len( nums ) ; i++ {\n\tnums[ i ]++\n}\n```\n\n![image](img/hot.jpg)\n\
  \n在计算领域中，Epoch（纪元）是指 1970 年 1 月 1 日午夜的时间。\n\n![image](img/5r.jpg)在格式化字符串中，在连字符周围按伪随机顺序分配前六个数字\n\
  \n```go\nstr := \"\\nYour Six Lucky Numbers: \"\nfor i := 0 ; i < 6 ; i++ {\n\t\
  str += strconv.Itoa( nums[ i ] )\n\tif i != 5 {\n\t\tstr += \" - \"\n\t}\n}\n```\n\
  \n![image](img/6r.jpg)最后，显示格式化字符串\n\n```go\nfmt.Println( str )\n```\n\n![image](img/7r.jpg)将程序文件保存在“lotto”目录，然后反复运行程序以查看不同的随机数\n\
  \n![image](img/pg141_1.jpg)\n\n![image](img/pg141_2.jpg)\n\n这里的随机数在 1 到 59 之间——用于玩英国彩票游戏或美国纽约彩票游戏。\n\
  \n![image](img/pg141_3.jpg)\n\n![image](img/forget.jpg)\n\n`int` 数字必须转换为 `string`\
  \ 数据类型以便拼接。\n\n## 总结\n\n- 字符串是字符的集合，类似于数组中的元素。\n- 内置函数 `len()` 返回作为参数的指定字符串中的字符数量。\n\
  - `strings` 包包含用于字符串操作的函数，例如 `Join()` 拼接函数。\n- `Fields()` 和 `Split()` 函数分别从从指定字符串参数返回的子字符串数组。\n\
  - `Contains()` 和 `Index()` 函数可用于在字符串参数中查找指定的子字符串。\n- `Count()` 函数报告子字符串在指定字符串参数中出现的次数。\n\
  - `HasPrefix()` 和 `HasSuffix()` 函数可用于识别字符串参数的开头和结尾。\n- `Replace()` 函数可以替换子字符串。\n\
  - 使用 `ToUpper()`、`ToLower()` 和 `ToTitle()` 函数更改字符大小写。\n- `Trim()` 函数可以移除首尾空格。\n\
  - `strconv` 包包含 `Atoi()` 和 `Itoa()` 函数，它们可以在字符串和 `int` 数据类型之间转换。\n- `math` 包包含数学函数，如\
  \ `math.Pow()`，以及数学常数，如 `math.Pi`。\n- 小数位值可以使用 `math.Floor()`、`math.Ceil()`、`math.Round()`\
  \ 和 `math.Trunc()` 舍入为接近的整数。\n- `math/rand` 包提供了生成伪随机数的函数。\n- `rand.Perm()` 函数返回从零到指定的参数指定的数字的随机整数序列。\n\
  - `rand.Seed()` 函数可以为随机数生成器指定自定义的种子整数。\n- 通过调用 `time.Now().UnixNano()` 函数，可以在每次程序运行时指定一个唯一的随机种子。\n\
  \n# 10 处理输入\n\n*本章演示了如何处理用户输入，以及如何使用 Go 标准库 `os`、`bufio` 和 `io/ioutil` 包读取和写入文本文件。*\n\
  \n- 获取用户输入\n- 缓冲区输入\n- 命令行标记\n- 读取文件\n- 写入文件\n- 使用临时文件\n- 总结\n\n## 获取用户输入\n\n之前的示例说明了如何使用变量来存储文本字符串。猜数字游戏可以使用\
  \ `Scan()`、`Scanln()` 和 `Scanf()` 从标准输入读取。\n\n```go\nimport (\n\t\"fmt\"\n\t\"math/rand\"\
  \n\t\"time\"\n)\n\nfunc main() {\n\trand.Seed( time.Now().UnixNano() )\n\tvar num\
  \ int = rand.Intn( 20 ) + 1\n\tvar guess int = 0\n\tvar flag bool = true\n\n\tfmt.Print(\"\
  \\nGuess My Number 1-20: \")\n\n\tfor flag {\n\t\t_, err := fmt.Scan(&guess)\n\t\
  \tif err != nil {\n\t\t\tfmt.Println(err)\n\t\t} else if guess > num {\n\t\t\tfmt.Print(\"\
  太大了，再次尝试: \")\n\t\t} else if guess < num {\n\t\t\tfmt.Print(\"太小了，再次尝试: \")\n\t\t\
  } else if guess == num {\n\t\t\tfmt.Println(\"正确 - 我的数字是\", num)\n\t\t\tflag = false\n\
  \t\t}\n\t}\n}\n```\n\n注意使用 `_` 空白标识符忽略返回的扫描项目数，并记住将输入值赋值给接口变量时使用 `&` 地址运算符。\n\n\
  ## 缓冲区输入\n\n当你想向程序中收集较大的数据项时，通常将数据流存储在内存缓冲区中会更好。Go 标准库 `bufio`（缓冲输入输出）包提供了一个 `Scanner`\
  \ 类型，它是一个具有多个处理数据流的有用方法的内存缓冲区。你可以通过导入 `bufio` 包使其在你的程序可用。\n\n\n\n\n首先，通过向 `bufio`\
  \ 包的 `NewScanner()` 传递一个作为读取数据源的参数，来创建一个 `Scanner` 实例。如果数据源是用户输入，你可以导入 Go 标准库中的\
  \ `os` 包，并指定 `os.Stdin`（标准输入）作为 `NewScanner()` 的参数。\n\n`Scanner` 实例有一个 `Scan()`\
  \ 方法，用于读取所有用户输入，以及一个 `Text()` 方法，用于将读取到的输入作为单个字符串值返回。\n\n`Scanner` 实例还有一个 `Err()`\
  \ 方法，它将返回任何读取错误。如果没有遇到错误，错误值将如往常地为 `nil`。在调用 `Scan()` 和 `Text()` 方法后检查错误是有用的。\n\n\
  如果你想将输入分成单独的字符串项，可以导入 Go 标准库的 `strings` 包，并将输入传递给它的 `Fields()` 函数，将字符串分成单词。\n\n\
  ![image](img/1g.jpg)首先在程序中导入 Go 标准库的 `bufio`、`os` 和 `strings` 包以处理输入\n\n```go\n\
  import (\n\t\"fmt\"\n\t\"bufio\"\n\t\"os\"\n\t\"strings\"\n)\n```\n\n![image](img/commong.jpg)\n\
  \nsrc\\buffer\\main.go\n\n![image](img/2g.jpg)接下来，请求用户输入\n\n```go\nfmt.Print(\"\\\
  nEnter Text:\" )\n```\n\n![image](img/3g.jpg)现在，创建一个 `Scanner` 实例将用户输入存储在内存缓冲区中，然后读取用户输入\n\
  \n```go\nscanner := bufio.NewScanner(os.Stdin)\nscanner.Scan()\n```\n\n![image](img/4g.jpg)然后，如果发生错误则输出错误，否则输出存储的数据\n\
  \n```go\nif scanner.Err() != nil {\n    fmt.Println(scanner.Err())\n} else {\n \
  \   fmt.Println(scanner.Text())\n}\n```\n\n![image](img/5g.jpg)接下来，创建一个新的 `Scanner`\
  \ 实例将其他用户输入存储在内存缓冲区中\n\n```go\nfmt.Print(\"\\nEnter Text:\" )\nscanner = bufio.NewScanner(os.Stdin)\n\
  scanner.Scan()\n```\n\n![image](img/6g.jpg)然后，将用户输入的各个项存储在切片的各个元素中\n\n```go\nwords\
  \ := strings.Fields(scanner.Text())\n```\n\n![image](img/7g.jpg)最后，如果发生错误则输出错误，或者列出用户输入的各个项\n\
  \n```go\nif scanner.Err() != nil {\n    fmt.Println(scanner.Err())\n} else {\n \
  \   for i, v := range words {\n        fmt.Printf(\"%v: %v \\n\", i, v)\n    }\n\
  }\n```\n\n![image](img/8g.jpg)将程序文件保存在“buffer”目录中，然后运行程序查看用户输入\n\n![image](img/pg147_1.jpg)\n\
  \n![image](img/hot.jpg)\n\n`if` 条件测试的执行是因为 `Scan()` 方法在读取输入时返回布尔值 `true`，当到达输入末尾时返回\
  \ `false`。\n\n## 命令标志 (Command Flags)\n\n运行程序的命令可以识别任意数量的参数，因此可以在运行程序运行时向程序传递一个空格分隔的参数值列表。Go\
  \ 标准库 `os`（操作系统）包提供了一个 `Args` 切片，它将这些参数值存储在各个元素中。你可以通过导入 `os` 包让你的程序可以使用这些功能。\n\n\
  ![image](img/pg148_1.jpg)\n\n注意的是，`os.Args` 中的第一个元素始终包含你的程序路径——参数值随后按顺序存储在后续元素中。你可以像处理任何其他切片一样使用\
  \ `[]` 方括号来引用参数值——例如，第一个参数值可以使用 `os.Args[1]`。\n\n![image](img/1g.jpg)首先在程序中导入 Go\
  \ 标准库 `os` 包以存储命令行参数\n\n```go\nimport (\n\t\"fmt\"\n\t\"os\"\n)\n```\n\n![image](img/commong.jpg)\n\
  \nsrc\\params\\main.go\n\n![image](img/2g.jpg)接下来，添加一个循环来显示程序在系统上的默认位置，以及任何传入的参数\n\
  \n```go\nfor i, v := range os.Args {\n    fmt.Printf(\"Argument %v: %v \\n\", i,\
  \ v)\n}\n```\n\n![image](img/3g.jpg)现在，显示最后一个传入的参数\n\n```go\nfmt.Println(\"\\nLast\
  \ Argument:\", os.Args[len(os.Args)-1])\n```\n\n![image](img/4g.jpg)将程序文件保存在“params”目录中，然后带有命令行参数运行程序查看输出\n\
  \n![image](img/pg148_2.jpg)\n\n![image](img/hot.jpg)\n\n运行 `go build params` 编译程序，然后使用命令\
  \ `params a b c` 运行它，查看本地程序路径而不是默认系统位置。\n\nGo 标准库 `flag` 包提供了用于更高级命令行处理的函数。你可以通过导入\
  \ `flag` 包让你的程序可以使用这些。\n\n![image](img/pg149_1.jpg)\n\n你使用 `flag` 包的 `String()`、`Int()`\
  \ 或 `Bool()` 函数来定义标志。这些函数都需要三个参数：名称、默认值和帮助信息。（注：原文此处有大量重复描述，已提取核心逻辑）。\n\n`Parse()`\
  \ 函数应用命令行标志。\n\n![image](img/pg149_1.jpg)\n\n![image](img/1g.jpg)首先在程序中导入 Go 标准库\
  \ `flag` 包以解析标志\n\n```go\nimport (\n\t\"fmt\"\n\t\"flag\"\n)\n```\n\n![image](img/commong.jpg)\n\
  \nsrc\\flags\\main.go\n\n![image](img/2g.jpg)接下来，定义三个标志\n\n```go\ntxt := flag.String(\"\
  txt\", \"\", \"A string\")\nnum := flag.Int(\"num\", 8, \"Number\")\nsta := flag.Bool(\"\
  sta\", false, \"Status\")\n```\n\n![image](img/3g.jpg)现在，处理标志并显示它们的值\n\n```go\n\
  flag.Parse()\nfmt.Println(\"\\nText:\", *txt)\nfmt.Println(\"Number:\", *num)\n\
  fmt.Println(\"Status:\", *sta)\n```\n\n![image](img/4g.jpg)将程序文件保存在“flags”目录中，然后不带输入运行程序查看标志\n\
  \n## 读取文件 (Read Files)\n\nGo 标准库 `io` 包包含 `ioutil` 工具包，提供了读取文件的函数。\n\n![image](img/pg150_1.jpg)\n\
  \n`ioutil` 包的 `ReadFile()` 函数接收文件路径作为参数，并返回整个文件内容和任何读取错误。如果没有遇到错误，错误值将为 `nil`。在每次操作后检查错误是良好的做法。\n\
  \n为了在读取文件时进行更精细的控制，可以使用 `os` 包的 `Open()` 函数打开文件。`os.File` 类型具有 `Read()`、`Seek()`\
  \ 和 `Close()` 方法，允许你处理文件内容。`Seek()` 方法确定从文件开始读取的位置。它需要两个参数：偏移量和起始位置（0 表示相对于文件开头，1\
  \ 表示相对于当前位置）。`Read()` 方法需要一个字节切片来指定从指定位置读取的字节数。该方法返回读取的字节数。`Close()` 方法在完成其他操作后必须被调用。为了不忘记这一点，可以在打开文件后立即使用\
  \ `defer` 关键字，在函数结束时自动关闭文件。\n\n```go\nfunc check(err error) {\n    if err != nil\
  \ {\n        fmt.Println(err)\n    }\n}\n```\n\n\n\n\n# 写入文件\n\nGo 标准库包含了 `ioutil`（输入/输出实用）包，该包提供了写入文本文件的函数。你可以通过导入\
  \ `io/ioutil` 来在程序中使用该包。\n\n`ioutil` 包的 `WriteFile()` 函数接受三个参数：指定要写入的文件路径、一个包含写入文本的\
  \ `[]byte` 切片，以及数值型文件权限。如果写入尝试失败，该函数将返回一个错误信息；如果文件成功成功，则返回 `nil` 值。\n\n为了在写入文本文件时进行更精细的控制，你可以使用\
  \ `os` 包的 `OpenFile()` 函数。这需要三个参数：指定要写入的文件路径、一个指定操作类型的标志位以及数值型文件权限。指定操作类型的标志位是 `os`\
  \ 包中的常量。例如：\n- `os.O_RDWR` 用于读和写\n- `os.O_APPEND` 用于追加文本\n- `os.O_CREATE` 如果文件不存在则创建一个新文件\n\
  \n`OpenFile()` 函数返回一个 `os.File` 类型和任何读取错误。该文件类型具有 `Write()` 和 `Close()` 方法，允许你处理文件内容。`Write()`\
  \ 方法需要一个包含写入文本的 `[]byte` 参数。该方法返回读取的字节数和任何读取错误。`Close()` 方法可以在打开文件后立即使用 `defer`\
  \ 关键字调用，以便在文件操作完成后封装函数结束后关闭文件。\n\n## 实现\n\n首先在程序中导入 Go 标准库的 `ioutil` 和 `os` 包以写入文本文件：\n\
  \n```go\nimport (\n    \"fmt\"\n    \"io/ioutil\"\n    \"os\"\n)\n```\n\n### src\\\
  write\\main.go\n\n接下来，添加一个检查写入错误的函数：\n\n```go\nfunc check(err error) {\n    if err\
  \ != nil {\n        fmt.Println(err)\n    }\n}\n```\n\n有多种操作类型标志位，可以向 `OpenFile()`\
  \ 函数指定多个标志位。更多细节请参考 [golang.org/pkg/os/#OpenFile](http://www.golang.org/pkg/os/#OpenFile)\
  \ 上的文档。\n\n现在，在 `main` 函数中写入整个整个文本文件，然后检查错误：\n\n```go\ntxt := []byte(\"\\nA thousand\
  \ suns will stream on thee,\\nA thousand moons will quiver.\\n\")\nerr := ioutil.WriteFile(\"\
  C:/Textfiles/Farewell.txt\", txt, 0644)\ncheck(err)\n```\n\n接下来，打开同一个文本文件进行追加操作，然后检查错误并记住关闭文件：\n\
  \n```go\nfile, err := os.OpenFile(\"C:/Textfiles/Farewell.txt\", os.O_APPEND, 0644)\n\
  check(err)\ndefer file.Close()\n```\n\n现在，向现有文件内容追加文本并检查错误：\n\n```go\nslice := []byte(\"\
  by Alfred Lord Tennyson.\\n\")\nnb, err := file.Write(slice)\ncheck(err)\n```\n\n\
  最后，显示起始位置、读取的字符数以及已读取的文本：\n\n```go\nfmt.Printf(\"\\n%v bytes @ %v: \", nb, pos)\n\
  fmt.Printf(\"%v\\n\", string(slice))\n```\n\n## 临时文件\n\n在执行期间创建临时文件有时是有用的。`ioutil`\
  \ 包提供了 `TempFile()` 用于此目的。你可以指定一个空字符串作为默认目录，并指定一个文件名模式。如果模式包含 `*` 通配符字符，生成的字符串将替换该字符。\n\
  \n当 `TempFile()` 成功创建临时文件时，它会自动打开该文件并准备读写。返回的文件类型具有 `Name()` 方法，可以通过它引用其路径（包括随机字符串）。你可以使用它的\
  \ `Write()` 和 `WriteString()` 方法添加文本内容。`Close()` 方法可以在打开文件后立即使用 `defer` 关键字调用，以便在封装函数结束后关闭文件。\n\
  \n与其他文件一样，可以使用 `ioutil.ReadFile()` 函数读取临时文件的内容。当不再需要临时文件时，可以通过将文件名作为 `os.Remove()`\
  \ 函数的参数来删除它。你也可以通过将文件名作为 `os.Stat()` 函数的参数来检查临时文件（或其他文件）。该函数返回一个 `info` 类型以及错误信息或\
  \ `nil`。\n\n### src\\temp\\main.go\n\n首先在程序中导入 Go 标准库的 `ioutil` 和 `os` 包以处理临时文件：\n\
  \n```go\nimport (\n    \"fmt\"\n    \"io/ioutil\"\n    \"os\"\n)\n```\n\n接下来，添加一个检查错误的函数：\n\
  \n```go\nfunc check(err error) {\n    if err != nil {\n        fmt.Println(err)\n\
  \    }\n}\n```\n\n现在，在 `main` 函数中创建一个临时文本文件，然后检查错误并确认文件存在：\n\n```go\ntmpFile, err\
  \ := ioutil.TempFile(\"\", \"Data-*\")\ncheck(err)\nfmt.Printf(\"\\nCreated File:\\\
  n%v \\n\", tmpFile.Name())\n```\n\n向临时文件写入文本，然后检查错误：\n\n```go\nnb, err := tmpFile.WriteString(\"\
  Go Programming Fun!\\n\")\ncheck(err)\n```\n\n\n\n\n\n![image](img/5g.jpg)接下来，从临时文件中读取文本并检查错误，然后显示读取的字符数\n\
  \n```go\ntxt, err := ioutil.ReadFile( tmpFile.Name( ) )\ncheck( err )\nfmt.Printf(\
  \ “\\nRead: %v bytes - %v \\n”, nb, string( txt ) )\n```\n\n![image](img/6g.jpg)记得在处理完成后关闭文件\n\
  \n```go\ntmpFile.Close( )\n```\n\n![image](img/7g.jpg)然后，删除临时文件\n\n```go\nos.Remove(\
  \ tmpFile.Name( ) )\n```\n\n![image](img/8g.jpg)最后，尝试检查（已删除的）临时文件并检查错误\n\n```go\n\
  _, err = os.Stat( tmpFile.Name( ) )\ncheck( err )\n```\n\n![image](img/9g.jpg)将程序保存在“temp”目录中，并运行程序以创建、写入、读取和删除临时文件\n\
  \n![image](img/pg155_1.jpg)\n\n![image](img/forget.jpg)\n\n`_` 空白标识符表示程序中未使用的类型信息。\n\
  \n## 总结\n\n- Go 标准库 `fmt` 包提供了 `Scan()`、`Scanln()` 和 `Scanf()` 函数用于从标准输入读取内容。\n\
  - `Scan()`、`Scanln()` 和 `Scanf()` 函数各返回两个值，分别是已扫描的项数和任何读取错误。\n- 如果在从标准输入读取时没有遇到错误，返回的错误值将为\
  \ `nil`。\n- Go 标准库 `bufio` 包提供了 `Scanner` 类型，它是用于数据流的内存缓冲区。\n- `Scanner` 拥有一个用于读取输入的\
  \ `Scan()` 方法、一个返回文本的 `Text()` 方法以及一个用于返回错误的 `Err()` 方法。\n- Go 标准库 `strings` 包提供了\
  \ `Fields()` 函数，它可以将字符串拆分为单个单词。\n- Go 标准库 `os` 包提供了 `Args` 切片（slice），它在元素中存储命令行参数值。\n\
  - Go 标准库 `flag` 包拥有 `String()`、`Int()` 和 `Bool()` 函数，每个函数都指定了标志名称、默认值和帮助信息。\n- `flag`\
  \ 包的 `Parse()` 函数将用户的值应用到标志上。\n- Go 标准库 `io` 包包含一个 `ioutil` 包，该包提供了 `ReadFile()`\
  \ 函数来读取整个文本文件。\n- Go 标准库 `os` 包拥有 `Open()`、`Read()`、`Seek()` 和 `Close()` 方法来处理文件内容。\n\
  - 可以配合 `defer` 关键字调用 `Close()` 方法，以便在所有文件操作完成后后关闭文件。\n- Go 标准库 `io/ioutil` 包提供了\
  \ `TempFile()` 函数来创建临时文件。\n- `TempFile()` 函数返回一个 `os.File` 类型，该类型拥有 `Name()`、`Write()`、`WriteString()`\
  \ 和 `Close()` 方法，用于向临时文件添加内容。\n- `os.Remove()` 函数可以删除文件，而 `os.Stat()` 函数可以检查文件信息。\n\
  \n11\n\n# 使用并发\n\n*本章演示了如何使用 goroutine（协程）和通道（channels）在 Go 程序中执行任务的并发执行。*\n\n-\
  \ 创建 goroutine\n- 持续等待\n- 制作通道\n- 缓冲通道\n- 选择通道\n- 同步 goroutine\n- 使用工作池\n- 总结\n\n\
  ## 创建 goroutine\n\nGo 程序像用其他编程语言编写的程序一样，通常按顺序逐行执行代码。但 Go 编程还支持“goroutine”，它允许代码行能够并发地、并排地执行。这是许多人选择\
  \ Go 编程的重要原因之一。\n\n![image](img/pg158_1.jpg)\n\n并发提供了利用多核处理器的潜力，但区分并发（concurrency）与并行（parallelism）的区别至关重要：\n\
  \n- **并行**是指两个任务在完全同一时刻执行。例如，在多核处理器上，当一个核心正在执行某个任务，而另一个核心同时执行另一个不同的任务。然而，这对于逐行执行的程序代码来说很难实现的。\n\
  \n![image](img/pg158_2.jpg)\n\n- **并发**是将程序代码拆分为多个独立执行的任务，这些任务可能同时运行并产生正确的最终结果。因此，一个并发程序是可以被并行化的程序。Goroutine\
  \ 在 Go 程序代码中提供了这种能力。\n\n![image](img/pg158_3.jpg)\n\n![image](img/pg158_4.jpg)\n\
  \nGoroutine 是可以并发执行的轻量级线程。带有多个函数调用的顺序执行程序会按顺序执行每个函数，但带有 goroutine 的并发程序允许多个函数同时处于激活状态。\n\
  \n通过在普通函数调用或方法调用之前插入 `go` 关键字即可创建一个 goroutine。任务执行的顺序由 Go 调度器内部决定。\n\n![image](img/1p.jpg)从开始向程序导入标准库\
  \ `time` 包，允许 goroutine 执行\n\n```go\nimport (\n\"fmt\"\n\"time\"\n)\n```\n\n![image](img/common.jpg)goroutine.main\n\
  \n```go\nfunc count(item string) {\n    for i := 1; i <= 3; i++ {\n        fmt.Printf(\"\
  %v \", i, item)\n        time.Sleep(1 * time.Second)\n    }\n}\n```\n\n![image](img/2p.jpg)现在，在\
  \ main 函数中添加函数调用以顺序执行\n\n```go\nfmt.Println(\"\\nLine-by-Line Execution...\")\n\
  count(\"moose\")\ncount(\"sheep\")\n```\n\n![image](img/3p.jpg)然后，在 main 函数中添加 goroutine\
  \ 和普通函数调用以并发执行\n\n```go\nfmt.Println(\"\\nConcurrent Execution...\")\ngo count(\"\
  moose\")\ncount(\"sheep\")\n```\n\n![image](img/4p.jpg)将程序保存在“goroutine”目录中，然后运行程序查看不同的输出\n\
  \n![image](img/pg159_1.jpg)\n\n![image](img/hot.jpg)你也可以从自身函数启动 goroutine\n\n![image](img/snake.jpg)\n\
  \n默认情况下，程序会在主 goroutine 完成时退出——无论是否有任何 goroutine 尚未完成。\n\n## 持续等待\n\nGo 程序经常包含 goroutine，因此\
  \ Go 标准库 `sync` 包提供了一个 `WaitGroup` 类型，用于等待一组 goroutine 完成。\n\n![image](img/pg160_1.jpg)\n\
  \nWaitGroup 实例以通常的方式创建，使用如下语法：\n\n```go\nvar waitgroupName sync.WaitGroup\n```\n\
  \nWaitGroup 只是一个计数器，可以记录运行中的 goroutine 总数。它拥有以下方法用于阻塞程序直到所有 goroutine 完成：\n\n- `Add()`\
  \ 根据指定的参数增加 WaitGroup 计数器。每向程序添加一个新的 goroutine，计数器应该加一。\n- `Done()` 自动将 WaitGroup\
  \ 计数器减一，不需要参数。当每个 goroutine 完成时，计数器减一。\n- `Wait()` 阻塞程序直到 WaitGroup 计数器变为零，不需要参数。当最后一个运行的\
  \ goroutine 将计数器减为零时，阻塞会自动移除。\n\n将 WaitGroup 作为参数传递给函数时，必须以指针传递。这意味着参数将指定其内存地址（使用\
  \ `&` 取地址运算符），函数参数将使用 `*` 前缀运算符将其标记为指针。接收函数可以使用指针参数调用 WaitGroup 的 `Done()` 方法。\n\
  \n在实际创建 goroutine 的语句之前，应该调用 `Add()` 方法来增加 WaitGroup 计数器。\n\n\n\n\n\n可选地，`Add()`\
  \ 方法的参数可以指定集合中 goroutine 的总数，而不是逐个为每个添加的 goroutine 增加 `WaitGroup`计数计数。\n\n你可以复用\
  \ `WaitGroup` 来控制后续一组 goroutine 的执行，但只有在之前一组 goroutine 的 `Wait()` 方法达到零后，你才能为它们调用\
  \ `Add()` 方法。\n\n![image](img/forget.jpg)\n\ngoroutine 的执行顺序由 Go 调度器控制，并且每次程序运行时都可能有所不同。\n\
  \n![image](img/1p.jpg)首先导入 Go 标准库 `sync` 和 `time` 包，用于等待 goroutine 并允许延迟。\n\n```go\n\
  import (\n\t\"fmt\"\n\t\"sync\"\n\t\"time\"\n)\n```\n\n![image](img/commonp.jpg)\n\
  \n`src\\waitgroup\\main.go`\n\n![image](img/2p.jpg)接下来，在 `main` 函数中，创建一个 `WaitGroup`\
  \ 实例\n\n```go\nvar wg sync.WaitGroup\n```\n\n![image](img/3p.jpg)现在，添加一个循环来增加计数器，并将\
  \ `WaitGroup` 的地址作为函数参数传递\n\n```go\nfor i := 1 ; i <= 3 ; i++ {\n\twg.Add( 1 )\n\
  \tgo report ( i, &wg )\n}\n```\n\n![image](img/4p.jpg)最后，在 `main` 函数中阻塞直到 `WaitGroup`\
  \ 计数器达到零\n\n```go\nwg.Wait()\n```\n\n![image](img/5p.jpg)现在，添加一个函数来确认每个 goroutine\
  \ 的开始和结束，然后通知 `WaitGroup` 停止等待\n\n```go\nfunc report( i int, wg *sync.WaitGroup)\
  \ {\n\tfmt.Printf( \"\\nGoroutine %v Started\", i )\n\ttime.Sleep( 1 * time.Second\
  \ )\n\tfmt.Printf( \"\\n\\t\\t\\tGoroutine %v Ended\", i )\n\twg.Done()\n}\n```\n\
  \n![image](img/6p.jpg)将程序文件保存在“waitgroup”目录中，然后运行程序查看程序等待 goroutine 的情况。\n\n![image](img/pg161_1.jpg)\n\
  \n![image](img/hot.jpg)\n\n你也可以在函数开始处使用 `defer wg.Done()` 来确保 Waitgroup 收到完成。\n\n\
  ### 创建通道 (Channels)\n\ngoroutine 允许代码以独立的方式并发执行，但你可以通过使用“通道”让 goroutine 之间进行通信。\n\
  \n![image](img/pg162_1.jpg)\n\nGo 的 `channel` 就像一个管道，你可以通过它发送或接收消息。重要的是要意识到发送和接收操作是“阻塞”操作——当发送消息时，通道将等待直到接收者准备好接受消息；当接收消息时，通道将等待直到发送者实际交付消息。\n\
  \n通过指定 `chan` 关键字并将数据类型作为内置 `make()` 函数的参数来创建通道，如下所示：\n\n```go\nchannelName := make(\
  \ chan *dataType )\n```\n\n你可以使用 `<-` 运算符将值发送到通道以将值导入通道，语法如下：\n\n```go\nchannelName\
  \ <- message\n```\n\n相反，你可以使用 `<-` 运算符从通道接收值并将值定向到变量中，语法如下：\n\n```go\nvariableName\
  \ <- channelName\n```\n\n确保接收者不会等待一个永远不会到达的消息非常重要。这会导致一个被称为“死锁”的致命错误——程序永远无法继续执行。为了避免这种情况，发送者可以将通道名称作为内置\
  \ `close()` 函数的参数，在不再发送任何更多消息时显式地关闭通道。\n\n接收者可以可选地接收第二个值，这是一个布尔值，当通道打开时为 true，当通道关闭时为\
  \ false。\n\n```go\nvariableName, channelOpenState <- channelName\n```\n\n```\n\n\
  这可以用来检查通道状态，并对于在通道确定关闭后退出包含接收者的循环有用。\n\n![image](img/snake.jpg)\n\n只有发送者应该关闭通道——永远不要使用接收者来关闭通道，以防发送者尚未完成。\n\
  \n![image](img/1p.jpg)首先导入 Go 标准库 `time` 包，允许延迟并获取当前时间。\n\n```go\nimport (\n\t\"\
  fmt\"\n\t\"time\"\n)\n```\n\n![image](img/commonp.jpg)\n\n`src\\channel\\main.go`\n\
  \n![image](img/2p.jpg)接下来，在 `main` 函数中，创建一个字符串类型的通道\n\n```go\nc := make( chan string\
  \ )\n```\n\n![image](img/3p.jpg)添加一个传递字符串值和通道的 goroutine\n\n```go\ngo count( \"\
  Message\", c )\n```\n\n![image](img/4p.jpg)现在，添加一个包含通道接收者的循环，它将打印接收到的消息直到通道关闭。\n\
  \n```go\nfor {\n\tmsg, open := <- c\n\tif !open {\n\t\tbreak\n\t}\n\tfmt.Println(\
  \ msg )\n}\n```\n\n![image](img/5p.jpg)现在，添加带有通道发送者的循环函数，该循环将每隔 1 秒发送一次消息，然后在循环结束时关闭通道\n\
  \n```go\nfunc count( msg string, c chan string ) {\n\tfor i := 0; i < 3; i++ {\n\
  \t\tc <- msg + \" \" + time.Now().Format(\"15:04:05\")\n\t\ttime.Sleep( 1 * time.Second\
  \ )\n\t}\n\tclose(c )\n}\n```\n\n![image](img/6p.jpg)\n\n### 缓冲通道\n\n通道默认是“无缓冲”的。这意味着只有当存在相应的接收者时，你才能发送消息；如果接收者仅在同一个函数中，发送者将阻塞。\n\
  \n关于缓冲更多信息可以参考此处。\n\n你可以通过在 `make()` 函数中包含第二个参数来指定缓冲区大小，克服这一限制。这允许你像队列一样向通道发送多个项目，并且只有当超出缓冲区时才会阻塞。\n\
  \n可以使用 `range` 关键字在循环中接收发送的每条消息，直到通道关闭。\n\n**选择通道 (Select Channels)**\n\n\n\n\n\n\
  当多个 goroutine 在不同的时间向通道发送消息时，程序可能会在等待从较的通道接收消息时阻塞进度。Go 提供了一种解决这种阻塞操作的方法，通过在 `select`\
  \ 语句中同时监听多个通道的消息。这种语法与这里描述的 `switch` 语句相似，但 `select` 语句会阻塞直到其中一个 `case` 语句找到匹配项。一旦找到匹配，与该\
  \ `case` 语句关联的语句将被执行。这种组合 goroutine 和通道的能力是 Go 语言的一项强大特性。\n\n![image](img/pg166_1.jpg)\n\
  \n为了持续监听通道消息，可以将 `select` 语句放在一个无限 `for` 循环中。可以通过包含一个带有关联语句（该语句将跳出循环到外部标签）的 `case`\
  \ 语句来退出循环。\n\nGo 标准库 `time` 包提供了一个实用的 `After()` 函数，可以用于创建一个“超时”来限制监听循环的执行时间。它需要一个持续时间作为参数，并返回一个\
  \ `time.Time` 类型的通道——这将是当前时间加上持续时间后的未来时间。使用 `case` 语句测试当前时间何时匹配超时通道可用于退出监听循环。\n\n\
  ![image](img/1p.jpg)首先导入 Go 标准库 `time` 包，以等待 goroutine 并创建超时\n\n```go\nimport (\n\
  \t\"fmt\"\n\t\"time\"\n)\n```\n\n![image](img/commonp.jpg)\n\nsrc\\select\\main.go\n\
  \n![image](img/2p.jpg)接下来，在 main 函数中创建一个超时通道和两个空通道\n\n```go\nc0 := time.After( 7\
  \ * time.Second )\nc1 := make( chan string )\nc2 := make( chan string )\n```\n\n\
  ![image](img/3p.jpg)现在，添加两个 goroutine 调用，每个调用传递一个通道\n\n```go\ngo fastCount( c1 )\n\
  go slowCount( c2 )\n```\n\n![image](img/4p.jpg)在 main 函数之后，添加两个被调用的函数，它们将以不同的间隔发送通道消息\n\
  \n```go\nfunc fastCount( c1 chan string ) {\n\tfor {\n\t\ttime.Sleep( 1 * time.Second\
  \ )\n\t\tc1 <- time.Now( ).Format( “04:05” )\n\t}\n}\n\nfunc slowCount( c2 chan\
  \ string ) {\n\tfor {\n\t\ttime.Sleep( 2 * time.Second )\n\t\tc2 <- time.Now( ).Format(\
  \ “04:05” )\n\t}\n}\n```\n\n![image](img/5p.jpg)现在，回到 main 函数，添加一个无限循环来接收来自三个通道中任何一个通道的消息\n\
  \n![image](img/pg167_2.jpg)\n\n![image](img/6p.jpg)将程序文件保存在“select”目录中，然后运行程序查看通道消息\n\
  \n![image](img/pg167_1.jpg)\n\n![image](img/snake.jpg)\n\n一个无标签的 `break` 语句只会跳出\
  \ `select` 语句——允许 `for` 循环继续！带标签的 `break` 语句会同时跳出 `select` 语句和无限 `for` 循环。\n\n###\
  \ 同步 Goroutine\n\n无缓冲通道的阻塞操作（发送操作会阻塞发送端 goroutine 直到另一个 goroutine 在同一通道上接收交付）会导致发送和接收的\
  \ goroutine 实现同步。事实上，无缓冲通道有时被称为“同步通道”。\n\n![image](img/pg168_1.jpg)\n\n因此，通道可以用于将\
  \ goroutine 连接到“流水线”中，其中从一个 goroutine 发送的项目是另一个 goroutine 接收到的项目。流水线中的每个 goroutine\
  \ 都会等待通道被“排空”后，再沿流水线发送下一个项目。\n\n默认情况下，通道既可以发送也可以接收，但当你将通道传递给 goroutine 时，你可以在函数参数中指定该通道是仅可发送还是仅用于接收项目。只发送通道通过在参数中\
  \ `chan` 关键字前加上 `<-` 操作符来指定，如下所示：\n\n```go\nfunc funcName ( paramName <-chan dataType\
  \ )\n```\n\n相反，只接收通道通过在参数中 `chan` 关键字后加上 `<-` 操作符来指定，如下所示：\n\n```go\nfunc funcName\
  \ ( paramName chan<- dataType )\n```\n\n建议指定单一允许的方向，以减少程序出现 bug 的可能性。\n\n![image](img/1p.jpg)开始一个\
  \ main 函数，创建两个用于整数项目的无缓冲通道\n\n```go\nnums := make( chan int )\nsqrs := make( chan\
  \ int )\n```\n\n![image](img/commonp.jpg)\n\nsrc\\synchronize\\main.go\n\n![image](img/2p.jpg)接下来，添加一个传递通道的\
  \ goroutine 调用，这将开始一个流水线\n\n```go\ngo count( nums )\n```\n\n![image](img/3p.jpg)现在，添加一个传递两个通道的\
  \ goroutine 调用，这将继续流水线\n\n```go\ngo square( nums, sqrs )\n```\n\n![image](img/4p.jpg)在\
  \ main 函数之后，添加第一个调用的函数，它带有一个只接收通道，当流水线空闲时，它将逐个发送 10 个独立的整数\n\n```go\nfunc count(\
  \ nums chan<- int ) {\n\tfor i := 1 ; i <= 10 ; i++ {\n\t\tnums <- i\n\t}\n}\n```\n\
  \n![image](img/5p.jpg)现在，回到 main 函数，添加第二个被调用的函数，它带有一个只接收通道，当流水线空闲时它将逐个发送 10 个结果\n\
  \n```go\nfunc square( nums <-chan int, sqrs chan<- int ) {\n\tfor i := 1 ; i <=\
  \ 10 ; i++ {\n\t\tnum := <- nums\n\t\tsqrs <- num\n\t}\n}\n```\n\n![image](img/6p.jpg)现在，在\
  \ main 函数中，添加一个循环来接收流水线末尾的结果\n\n```go\nfor i := 1 ; i <= 10 ; i++ {\n\tnum := <-\
  \ sqrs\n\tfmt.Printf( “%v x %v = %v \\n”, i, num )\n}\n```\n\n![image](img/7p.jpg)将程序文件保存在“synchronize”目录中，然后运行程序查看流水线\n\
  \n![image](img/pg69_1)\n\n![image](img/pg170_1.jpg)\n\n工作池允许你从多个并发调用发送任务到 goroutine，由\
  \ Go 调度器决定完成顺序。你可以使用 WaitGroup 等待 goroutine 完成，或者简单排空通道以确保所有 goroutine 都已完成。\n\n\
  ![image](img/1p.jpg)首先导入 Go 标准库 `time` 包，以延迟 goroutine 函数\n\n```go\nimport (\n\t\
  \"fmt\"\n\t\"time\"\n)\n```\n\n![image](img/commonp.jpg)\n\nsrc\\workers\\main.go\n\
  \n![image](img/2p.jpg)接下来，在 main 函数中初始化 jobs 变量，并创建两个大小为总数的缓冲通道\n\n```go\nnumJobs\
  \ := 10\njobs := make( chan int, numJobs )\nresults := make( chan int, numJobs )\n\
  ```\n\n![image](img/3p.jpg)现在，添加三个 worker goroutine 调用，每个调用传递一个 ID 数字和两个通道\n\n```go\n\
  go worker( 1, jobs, results )\ngo worker( 2, jobs, results )\ngo worker( 3, jobs,\
  \ results )\n```\n\n![image](img/4p.jpg)为 10 个任务中的每一个发送一个整数，然后关闭该通道以指示队列中已无任务\n\n\
  ```go\nfor i := 1 ; i <= numJobs ; i++ {\n\tjobs <- i\n}\nclose( jobs )\n```\n\n\
  ![image](img/5p.jpg)在 main 函数之后，添加调用的 worker 函数，它接受 worker ID 数字，有一个只发送通道用于接收任务号，并有一个只接收通道用于发送结果\n\
  \n```go\nfunc worker( id int, jobs <-chan int, results chan<- int ) {\n\tfor job\
  \ := range jobs {\n\t\tfmt.Print( “Worker “, id, “ ran Job “, job )\n\t\tfmt.Printf(\
  \ “ …%v x %v = %v \\n”, job, job, job*job )\n\t\ttime.Sleep( 1 * time.Second )\n\
  \t\tresults <- job\n\t}\n}\n```\n\n![image](img/6p.jpg)现在，回到 main 函数中，添加一个循环来接收结果\n\
  \n```go\nfor i := 1 ; i <= numJobs ; i++ {\n\tnum := <- results\n}\n```\n\n\n\n\n\
  \n![image](img/6p.jpg)现在，回到 `main` 函数，添加一个循环来收集结果并确保所有工作线程已完成\n\n```go\nfor i :=\
  \ 1 ; i <= numJobs ; i++ {\n    <- results\n}\nclose( results )\n```\n\n![image](img/7p.jpg)将程序文件保存在“workers”目录中，然后运行程序以查看工作池结果\n\
  \n![image](img/pg171_1.jpg)\n\n![image](img/hot.jpg)\n\n此示例中的 1 秒延迟仅仅是为了模拟执行更耗时任务所花费的时间。\n\
  \n![image](img/hot.jpg)\n\n“工作池”（Worker Pools）也被称为“线程池”。它们可以带来更好的性能，因为它们不需要为每个任务都创建一个新线程。\n\
  \n## 总结\n\n-   并行性（Parallelism）是指同时执行两个任务。\n-   并发（Concurrency）是将程序代码拆分为多个可能被同时执行的独立任务。\n\
  -   Goroutine 提供了代码行并发执行的能力。\n-   通过在普通函数调用或方法调用之前插入 `go` 关键字来创建一个 goroutine。\n\
  -   Go 标准库 `sync` 包提供了 `WaitGroup` 类型，可以等待多个 goroutine 完成。\n-   `WaitGroup` 具有一个\
  \ `Add()` 递增方法、一个 `Done()` 递减方法和一个 `Wait()` 阻塞方法。\n-   当将 `WaitGroup` 作为参数传递给函数时，必须以指针的形式传递。\n\
  -   Go 通道（channel）就像一根管道，程序可以通过它来发送和接收消息。\n-   通道是通过在内置的 `make()` 函数中指定 `chan` 关键字和数据类型作为参数来创建的。\n\
  -   死锁（Deadlock）是程序无法继续运行的致命错误。\n-   内置函数 `close()` 可以显式地关闭通道。\n-   在 `make()` 函数中添加缓冲区大小参数，可以将多个项目作为队列发送到通道中。\n\
  -   `select` 语句块可以同时监听来自多个通道的消息。\n-   将 `select` 语句块封装在无限 `for` 循环中，允许程序持续监听通道消息。\n\
  -   通道可以在流水线中连接 goroutine，通过发送和接收消息来同步这些 goroutine。\n-   `<-` 箭头运算符可以在函数参数中使用，指定通道是否仅允许发送或仅接收。\n\
  -   工作池可以将从多个并发调用产生的任务发送给 goroutine，按随机设置的顺序进行完成。\n\n# 12 请求响应\n\n*本章演示了如何创建一个 Web\
  \ 服务器，以及如何使用 Go 标准库中的 `net/http` 和 `io` 包处理提交的表单数据。*\n\n### 监听请求\n### 处理请求\n## 添加待提供的文件\n\
  ## 交付静态页面\n### 记录接收到的数据\n### 交付动态响应\n## 总结\n\n## 12.1 监听请求\n\nGo 标准库 `net` 包包含一个\
  \ `http` 包，它提供了可以方便创建 Web 服务器的实用工具。通过导入 `net/http` 包，可以让这些实用工具对你的程序可用。\n\n![image](img/pg174_1.jpg)\n\
  \n`http.ListenAndServe()` 函数允许程序启动并运行一个 Web 服务器。它需要两个参数：指定 TCP 网络地址字符串和请求处理程序。地址字符串指定了\
  \ Web 服务器应该监听传入请求的端口号。端口号在字符串内必须以 `:` 冒号字符为前缀——例如，“:8000”表示监听来自本地端口 8000 的传入请求。通常通过将第二个参数指定为\
  \ `nil` 来使用默认处理程序。\n\n`http.ListenAndServe()` 函数始终返回一个非空的 `error` 并永久阻塞。这意味着调用此函数之后的代码行将永远不会执行。Web\
  \ 服务器将继续监听传入的请求，直到程序终止。\n\n![image](img/1o.jpg)通过导入 `net/http` 包开始程序\n\n```go\n\
  import (\n    \"fmt\"\n    \"net/http\"\n)\n```\n\n![image](img/commono.jpg)接下来，添加一个\
  \ `main` 函数来输出消息并启动 Web 服务器\n\n```go\nfunc main() {\n    fmt.Println(\"Starting\
  \ web server on 8000\")\n    http.ListenAndServe(\":8000\", nil)\n}\n```\n\n![image](img/3.jpg)将程序文件保存在“server”目录中\n\
  \n![image](img/5.jpg)server.go\n\n本地地址通过回环地址 `127.0.0.1` 引用 `localhost`。\n\n![image](img/hot.jpg)如果出现防火墙警告，确认你希望访问\n\
  \n![image](img/pg75.jpg)现在，启动浏览器并访问 `localhost:8000`\n\n![image](img/hot.jpg)你可以按\
  \ `Ctrl + C` 终止运行的程序。\n\nWeb 服务器还不知道如何响应\n\n## 12.2 处理请求\n\n为了让 Go Web 服务器处理传入请求，程序需要注册指定如何响应的“路由处理程序”。\n\
  \n![image](img/pg76.jpg)\n\n`net/http` 包提供了 `http.HandleFunc()` 函数来注册处理程序。该函数需要两个参数：描述路径的字符串模式，以及将被调用的函数名称。字符串模式将以\
  \ `/` 斜杠字符开头——例如，“/hello”。这指定了 Web 服务器监听来自 localhost:8000/hello 的请求。\n\n请求处理函数默认总是包含一个用于向请求写入响应的\
  \ `ResponseWriter` 对象，以及包含请求信息（例如其 `URL.Path`）的 `http.Request` 对象指针。通常，`http.ResponseWriter`\
  \ 对象被命名为 `w`，`http.Request` 对象被命名为 `r`。\n\n`http.ResponseWriter` 对象有一个 `Write()`\
  \ 方法，接受要发送响应的字符字节切片参数。字符可以转换为字符串，如下：\n\n```go\nw.Write( []byte(\"response string\"\
  ) )\n```\n\n然而，更方便的方法是使用 Go 标准库 `io` 包中包含的 `WriteString()` 函数将字符串传递给 `ResponseWriter`\
  \ 对象。这可以通过导入 `io` 包来实现。\n\n`io.WriteString()` 函数需要两个参数：指定 `ResponseWriter` 对象以及要作为响应发送的字符串。\n\
  \n![image](img/1o.jpg)在之前的程序导入中添加 Go 标准库 `io` 包\n\n```go\nimport (\n    \"fmt\"\n\
  \    \"io\"\n    \"net/http\"\n)\n```\n\n![image](img/2o.jpg)server.go\n\n接下来，在\
  \ `main` 函数开始处插入一个语句来注册路由处理程序\n\n```go\nhttp.HandleFunc(\"/hello\", helloHandler)\n\
  ```\n\n![image](img/3o.jpg)现在，在 `main` 函数之后，添加写入两个字符串作为请求响应的处理器函数\n\n```go\nfunc\
  \ helloHandler(w http.ResponseWriter, r *http.Request) {\n    io.WriteString(w,\
  \ \"Response from the helloHandler!\\n\")\n    io.WriteString(w, \"URL.Path = \"\
  \ + r.URL.Path)\n}\n```\n\n\n\n\n\n![image](img/5o.jpg)如果出现防火墙安全警告，请确认你希望允许 Web\
  \ 服务器访问\n\n![image](img/6o.jpg)启动浏览器并访问 `localhost:8000/hello` 查看 Web 服务器对此请求的响应\n\
  \n![image](img/pg177_2.jpg)\n\n## 添加待提供的文件\n\n既然已经确认服务器程序可以响应示例此处中的请求，就可以向程序添加服务器响应请求交付的文件。\n\
  \n![image](img/pg178_1.jpg)\n\nWeb 服务器文件通常包含在一个名为 `htdocs`（超文本文档）或类似名称的根目录下。这通常包含\
  \ HTML 文件，可能还有一个 `favicon.ico` 图像用于在浏览器的标题栏中标识网站。根目录通常还包含子目录以对关联文件分组——例如 `img` 文件夹中的图像、`css`\
  \ 文件夹中的样式表等。\n\n在我们的服务器示例中，根 `htdocs` 目录下添加了两个 HTML 文档和一个 `favicon.ico` 。一个样式表位于\
  \ `htdocs/css` 目录，几张图像包含 `htdocs/img` 目录中。整个服务器程序树现在如下：\n\n![image](img/pg178_2.jpg)\n\
  \n![image](img/pg178_3.jpg)\n\nfavicon.ico\n\n32px x 32px\n\n![image](img/pg178_4.jpg)\n\
  \npower.png 100px x 25px\n\n其中几个图像文件是各种书籍的封面，其 ISBN（国际标准书号）被用作相应的封面图像文件名。`img` 目录还包含一个公司\
  \ Logo 图像和一个标识 Web 服务器的标签。\n\n样式表包含规则，用于指定程序动态写入的网页响应的样式：\n\n| `img, p` | `{ float:\
  \ left }` |\n\n| `p` | `{ width: 320px ; text-align: center ; font-size: 1.5em }`\
  \ |\n\n![image](img/pg179_1.jpg)\n\nstyle.css\n\n名为 `index.html` 的 HTML 文档是一个简单的静态网页，显示了网站图标、页面标题和标签：\n\
  \n```html\n<!DOCTYPE HTML>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\"\
  >\n<title>Index</title>\n<link rel=\"shortcut icon\" href=\"favicon.ico\">\n</head>\n\
  <body>\n<h1>Static Web Page</h1>\n<img src=\"img/power.png\" alt=\"Power\">\n</body>\n\
  </html>\n```\n\n![image](img/pg179_2.jpg)\n\nindex.html\n\n名为 `form.html` 的 HTML\
  \ 文档允许用户向 Web 服务器提交单条文本值：\n\n```html\n<!DOCTYPE HTML>\n<html lang=\"en\">\n<head>\n\
  <meta charset=\"UTF-8\">\n<title>Submission Form</title>\n<link rel=\"shortcut icon\"\
  \ href=\"favicon.ico\">\n</head>\n<body>\n<fieldset>\n  <legend>Book Lookup</legend>\n\
  \  <form method=\"POST\" action=\"lookup\">\n  <label>Programming Language</label>\n\
  \    <input name=\"Language\" type=\"text\" value=\"\">\n    <input type=\"submit\"\
  \ value=\"Submit\" >\n  </form>\n</fieldset>\n<img src=\"img/power.png\" alt=\"\
  Power\">\n</body>\n</html>\n```\n\n![image](img/pg179_2.jpg)\n\nform.html\n\n![image](img/hot.jpg)\n\
  \n服务器将测试 `POST` 方法；`lookup` 值将标识表单处理函数；而 `Language` 值将标识提交的值。\n\n## 交付静态页面\n\nGo\
  \ 标准库 `net/http` 包提供了三个函数，允许 Web 服务器通过指定的文件系统内容轻松地响应所有 HTTP 请求。\n\n![image](img/pg180_1.jpg)\n\
  \n首先将根文件目录的路径作为 `http.Dir()` 函数的参数指定。它返回一个 `Dir` 类型，然后该类型被作为 `http.FileServer()`\
  \ 函数的参数。这又返回一个处理器，用于用指定的根文件目录的内容响应所有 HTTP 请求。\n\n最后，使用 `http.Handle()` 函数来注册该处理器。这需要两个参数来指定路由模式和处理器的名称。通常使用\
  \ `/` 作为第一个参数——以匹配所有请求路径。\n\n浏览器现在可以从指定的根文件目录内按名称请求任何文档。如果请求中省略了文件名，服务器将自动查找名为 `index.html`\
  \ 的文档并交付给浏览器。\n\n![image](img/1o.jpg)在 `main` 函数开始处，插入一条语句指定要提供的文件根目录 `dir := http.Dir(\"\
  C:/Users/mike_/go/src/server/htdocs\")`\n\n![image](img/commono.jpg)\n\nsrc\\server\\\
  main.go\n\n![image](img/2o.jpg)接下来，为该文件系统创建一个请求处理器\n\n```go\nfileServer := http.FileServer(dir)\n\
  ```\n\n![image](img/3o.jpg)现在，为所有 HTTP 请求注册处理器\n\n```go\nhttp.Handle(\"/\", fileServer)\n\
  ```\n\n![image](img/4o.jpg)保存更新后的程序，然后启动服务器并访问 `localhost:8000/index.html`\n\n![image](img/5o.jpg)\n\
  \n## 日日志\n\n成功交付静态页面后，`http.Request` 对象拥有用于填充表单值的 `ParseForm()` 方法。\n\n![image](img/pg181.jpg)通过向程序引入\
  \ Go `strings`、`os` 和 `log` 包开始：\n\n```go\nimport (\n\t\"fmt\"\n\t\"io\"\n\t\"log\"\
  \n\t\"net/http\"\n\t\"os\"\n\t\"strings\"\n)\n```\n\n![image](img/commono.jpg)\n\
  \nsrc\\server\\main.go\n\n接下来，在 `main` 函数中注册一个表单处理器，其路由参数将识别赋值给表单 action 属性的名字\n\
  \n```go\nhttp.HandleFunc(\"/lookup\", formHandler)\n```\n\n![hot.jpg\n\nGo 为每个 HTTP\
  \ 状态码提供了常量，例如对应 200 的 `http.StatusOk`。访问 [golang.org/pkg/net/http](http://www.golang.org/pkg/net/http)\
  \ 文档查看完整的列表。\n\n![image](img/3o.jpg)在 `main` 函数之后，开始带有检查提交方法的表单处理器\n\n```go\n{\n\
  \tif r.Method != \"POST\" {\n\t\thttp.Error(w, \"Method Not Allowed\", 405)\n\t\t\
  return\n\t}\n\t// 此处将插入语句\n}\n```\n\n接下来，在表单处理器中，插入解析表单数据或向浏览器返回错误信息的语句\n\n```go\n\
  err := r.ParseForm()\nif err != nil {\n\thttp.Error(w, \"Bad Request\", 400)\n\t\
  return\n}\n```\n\n提交的表单值可以使用 Go `strings` 包进行格式化，去除空格并更改大小写\n\n```go\nlang := r.FormValue(\"\
  Language\")\nlang = strings.ToLower(strings.Trim(lang, \" \"))\n```\n\n\n\n\n\n\
  ![image](img/6o.jpg)\n然后，在表单处理器中，插入语句将格式化后的值写入日志文件\n\n```go\nfile, err := os.OpenFile(\
  \ “htdocs/data.log”, os.O_CREATE|os.O_APPEND|os.O_WRONLY, 0644 )\nif err != nil\
  \ {\n    log.Print( err )\n}\ndefer file.Close( )\nlog.SetOutput( file )\nlog.Print(\
  \ lang )\n```\n\n![image](img/7o.jpg)\n保存更新后的程序文件，然后启动 Web 服务器并访问 localhost:8000/form.html\
  \ 查看表单出现\n\n![image](img/8o.jpg)\n在输入字段中输入编程语言的名称，然后点击 Submit 按钮提交表单数据\n\n![image](img/hot.jpg)\n\
  \n最常用的请求方法是 `GET` 和 `POST`。`GET` 方法将数据添加到 URL 字符串中。`POST` 方法在请求体中携带数据，因此更安全，并且是从浏览器传输数据到服务器时的首选方法。\n\
  \n![image](img/pg183_1.jpg)\n![image](img/9o.jpg)\n现在，点击浏览器的 `Back` 按钮并重复提交过程以发送多个请求——每个请求对应不同的编程语言\n\
  \n![image](img/pg183_2.jpg)\n![image](img/pg183_3.jpg)\n![image](img/10o.jpg)\n\
  然后，访问 localhost:8000/data.log 查看文件中每个提交的表单值\n\n![image](img/pg183_4.jpg)\n![image](img/pg183_5.jpg)\n\
  data.log\n\n![image](img/hot.jpg)\n\n为了简单起见，此示例仅提交一项，通过请求对象的 `FormValue()` 方法和 HTML\
  \ `name` 属性值进行引用。对于提交多个项的表单，可以使用 `range` 关键字遍历它们，以引用每个项的键（HTML `name` 属性）和值（HTML\
  \ `value` 属性）。\n\n## 动态响应\n\n接收并记录了请求数据后，按照此处的步骤操作，程序现在可以评估请求并向 Web 浏览器发送适当的响应\n\
  \n![image](img/1o.jpg)\n在表单处理器的日志语句之后，初始化两个带有默认响应字符串值的变量\n\n```go\ntitle := “<a\
  \ href=’http://www.ineasysteps.com’>See all titles online</a>”\nisbn := “logo”\n\
  ```\n\n![image](img/commono.jpg)\nsrc\\server\\main.go\n\n![image](img/2o.jpg)\n\
  接下来，检查提交的请求值，如果匹配，则分配适当的响应值\n\n```go\nswitch lang {\ncase “c” :\n    title = “C\
  \ Programming”\n    isbn = “978-1-84078-840-2”\ncase “go” :\n    title = “Go Programming”\n\
  \    isbn = “978-1-84078-919-5”\ncase “java” :\n    title = “Java”\n    isbn = “978-1-84078-873-0”\n\
  case “python” :\n    title = “Python”\n    isbn = “978-1-84078-812-9”\ncase “sql”\
  \ :\n    title = “SQL”\n    isbn = “978-1-84078-902-7”\n}\n```\n\n![image](img/3o.jpg)\n\
  现在，构建一个包含响应值的 HTML 字符串\n\n```go\nresponse := “<!DOCTYPE HTML><title>Web Server Response</title>”\n\
  response += “<link rel=’shortcut icon’ href=’favicon.ico’>”\nresponse += “<link\
  \ rel=’stylesheet’ href=’css/style.css’>”\nresponse += “<p>” + title + “<br>in easy\
  \ steps”\nif isbn != “logo” {\n    response += “<br>ISBN:” + isbn\n}\nresponse +=\
  \ “</p><img src=’img/” + isbn + “.png’ alt=’Cover’>”\nresponse += “<img src=’img/power.png’\
  \ alt=’Power’>”\n```\n\n![image](img/hot.jpg)\n\n注意字符串内部使用了单引号以区分外部的双引号，从而避免过早终止字符串。\n\
  \n![image](img/4o.jpg)\n最后，添加一条语句发送响应\n\n```go\nio.WriteString( w, response )\n\
  ```\n\n![image](img/pg185_1.jpg)\n![image](img/5o.jpg)\n再次保存更新后的程序文件并启动 Web 服务器，然后访问\
  \ localhost:8000/form.html 发送请求并接收响应\n\n![image](img/pg185_2.jpg)\n![image](img/pg185_3.jpg)\n\
