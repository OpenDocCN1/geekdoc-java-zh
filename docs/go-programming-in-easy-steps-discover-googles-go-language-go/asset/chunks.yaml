    \n![image](images/pg131_1.jpg)\n\n## Convert Strings\n\n![image](images/pg132_1.jpg)\n\
    \nThe Go standard library strings package provides functions to convert the character\
    \ case of strings.\n\nThe `strings` package has a `ToUpper()` function that requires\
    \ a single string argument. This function will simply return a copy of the string\
    \ with all its characters converted to uppercase letters.\n\nSimilarly, the `strings`\
    \ package’s `ToLower()` function requires a single string argument, and will return\
