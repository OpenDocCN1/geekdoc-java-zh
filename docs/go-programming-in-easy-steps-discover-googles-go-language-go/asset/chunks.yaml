  trans: "\n此外，时间组件可以格式化为 24 小时制，通过指定“15:04”将自动在单数字小时前补零。\n\n12 小时格式和 24 小时格式都会自动在单数字分钟前补零。\n\
    \n![image](img/hot.jpg)\n\nANSIC 指的是美国国家标准学会 C 语言的标准日期/时间格式。RFC 3339 指的是互联网工程任务组（IETF）的日期/时间文档。\n\
    \n![image](img/1b.jpg)首先在程序中导入 Go 标准库 time 包\n\n```go\nimport (\n\t\"fmt\"\n\t\
    \"time\"\n)\n```\n\n![image](img/commons.jpg)\n\nsrc\\format\\main.go\n\n![image](img/2b.jpg)接下来，创建一个\
    \ Time 类型的日期/时间实例，用当前日期和时间初始化，然后以各种格式显示其组件\n\n```go\ndt := time.Now()\nfmt.Println(\"\
    \\nDefault Format:\", dt)\nfmt.Println(\"Unix Format:\", dt.Format(time.UnixDate))\n\
    fmt.Println(\"ANSIC Format:\", dt.Format(time.ANSIC))\nfmt.Println(\"RFC3339 Format:\"\
    , dt.Format(time.RFC3339))\nfmt.Println(\"Custom Format:\", dt.Format(\"January\
    \ 2, 2006 [Monday]\"))\n```\n\n![image](img/3b.jpg)现在，仅显示格式化为两种地区格式的日期组件\n\n```go\n\
    fmt.Println(\"\\nUS Format:\", dt.Format(\"January 2, 2006\"))\nfmt.Println(\"\
    UK Format:\", dt.Format(\"2 January, 2006\"))\n```\n\n![image](img/4b.jpg)然后，仅显示\
    \ 12 小时制和 24 小时制的时间组件\n\n```go\nfmt.Println(\"\\nTime 12-Hour:\", dt.Format(time.Kitchen))\n\
    fmt.Println(\"Time 24-Hour:\", dt.Format(\"15:04\"))\n```\n\n![image](img/5b.jpg)将程序文件保存到“format”目录中，然后运行程序以查看格式化的日期和时间字段值\n\
    \n![image](img/pg117_1.jpg)\n\n![image](img/hot.jpg)\n\n`time.Kitchen` 常量等于指定布局格式为“15:04PM”。\n\
    \n## 设置日期和时间\n\n你可以使用 Go 标准库 time 包的 `Date()` 函数创建自定义的 Time 数据类型。这需要八个参数来指定（按顺序）年、月、日、时、分、秒、纳秒和位置。\n\
    \n![image](img/pg116_1.jpg)\n\n除了月份和位置外，所有参数都以整数值指定。\n\n月份可以使用 time 包预定义的 1 月至\
    \ 12 月的全称月份常量之一来指定，例如 `time.January`。\n\n位置可以使用 time 包预定义的位置常量之一指定，如 `time.UTC`（协调世界时）或\
    \ `time.Local`（你的系统时钟）。\n\n任何 Time 数据类型中的日期字段都可以使用 Go 标准库 time 包的 `AddDate()`\
    \ 方法进行修改，以指定年、月、日的三个参数。正值将推进日期，负值将推迟日期。例如，`time.AddDate(1, 0, 0)` 将日期推后一年。\n\n\
    同样，time 包的 `Add()` 方法可以通过指定单个持续时间参数来修改日期/时间。该值可以是一个表示修改日期/时间的纳秒数的 `int64` 值。更方便的是，可以使用常量\
    \ `time.Hour`、`time.Minute`、`time.Second` 或 `time.Millisecond` 来修改 Time 数据类型的各个时间字段。例如，`time.Add(10\
    \ * time.Hour)` 将时间推进 10 小时。\n\n你还可以使用 Go 标准库 time 包的 `Parse()` 函数从字符串创建自定义 Time\
    \ 数据类型。这需要两个参数来指定布局和日期/时间字符串。有用的是，此函数返回两个值：一个 Time 数据类型和一个错误。如果函数返回 Time 数据类型，错误值将为\
    \ `nil`，否则它将是一个错误消息。\n\n布局应仅使用 Go 引用字符串中的值：\n\n**Mon Jan 2 15:04:05 2006 MST**\n\
    \n除非在日期/时间字符串中指定了时区偏移值（例如 `-0500`），否则生成的 Time 数据类型将假设为 UTC 时间。\n\n![image](img/forget.jpg)\n\
    \n`Time` 数据类型可以使用此处描述的 `Format()` 方法进行格式化。\n\n![image](img/1b.jpg)首先在程序中导入 Go\
    \ 标准库 time 包\n\n```go\nimport (\n\t\"fmt\"\n\t\"time\"\n)\n```\n\n![image](img/commons.jpg)\n\
    \nsrc\\setdate\\main.go\n\n![image](img/2b.jpg)接下来，创建并显示 Time 类型的日期/时间实例，初始化为元旦一的正午\n\
    \n```go\ndt := time.Date(2025, time.January, 1, 12, 0, 0, 0, time.Local)\nfmt.Printf(\"\
    \\nDateTime: %v\\n\", dt)\n\ndt = dt.AddDate(2, 0, 0)\nfmt.Printf(\"\\nDateTime:\
    \ %v\\n\", dt)\n\nlayout := \"2006-Jan-02 15:04PM\"\nstr := \"2030-Dec-25 12:30AM\"\
    \nt, err := time.Parse(layout, str)\nif err != nil {\n\tfmt.Println(err)\n} else\
    \ {\n\tfmt.Printf(\"Parsed DateTime: %v\\n\", t)\n}\n```\n"
- fmt: "\n![image](images/2b.jpg)Next, create and initialize variables with a default\
    \ string value and a Time data type in a specified location\n\n`zone := “All”`\n\
    \n`loc, _ := time.LoadLocation( “America/New_York” )`\n\n`dt := time.Now( ).In(\
    \ loc )`\n\n![image](images/3b.jpg)Ascertain the time zone abbreviation and offset\
    \ seconds, then convert the offset to a positive minute number\n\n`abbr, offset\
    \ := dt.Zone( )`\n\n`if offset < 1 {`\n\n`offset = offset * -1`\n`}`\n\n`offset\
    \ /= 60`\n\n![image](images/4b.jpg)Now, evaluate the abbreviation and offset values\n\
    \n`switch {`\n`case abbr == “EST” && offset == 300 :`\n`zone = “East Coast”`\n\
    `case abbr == “EDT” && offset == 240 :`\n`zone = “East Coast”`\n`}`\n\n![image](images/5b.jpg)Display\
    \ the time zone details and an appropriate message\n\n`fmt.Printf( “\\nTZ: %v\
    \ Offset Minutes: %v \\n”, abbr, offset )`\n`fmt.Println( “Welcome to”, zone,\
    \ “Visitors!” )`\n\n![image](images/6b.jpg)Save the program file in a “zone” directory,\
    \ then run the program to see the time zone values\n\n![image](images/pg121_1.jpg)\n\
    \n![image](images/forget.jpg)\n\nA `_` blank identifier is used here to ignore\
    \ the returned error value due to space constraints, but you should ideally include\
    \ an error-handler.\n\n### Delay Time\n\nThe Go standard library `time` package\
    \ provides a `Sleep( )` function that allows you to delay progress of a program\
    \ by a specified duration period. The duration is supplied as an argument to the\
    \ `Sleep( )` function, and can be expressed as a multiplication of a time package\
    \ constant. For example, `5 * time.Second` expresses a duration of five seconds.\n\
    \n![image](images/pg122_1.jpg)\n\nThe Go standard library `time` package also\
    \ provides three methods that compare an instance of the `Time` data type with\
    \ another time specified as their argument. These methods will each return a boolean\
    \ true or false value according to the result of the time comparison:\n\n| Method\
    \ | Returns |\n| :--- | :--- |\n| `Before(time)` | A boolean `true` value if the\
    \ instance time is earlier than its argument time |\n| `After(time)` | A boolean\
    \ `true` value if the instance time is later than its argument time |\n| `Equal(time)`\
    \ | A boolean `true` value if the instance time and argument time represent the\
    \ same instant – even in different time zones |\n\nIf you would like to see the\
    \ difference between two instances of the `Time` data type, you can use a `Sub(\
    \ )` method of a time instance to specify another time instance as its argument.\
    \ This method will return the elapsed duration between the two instants as an\
    \ `int64` data type value of nanosecond precision.\n\nIt is often preferable to\
    \ present duration periods with less than nanosecond precision, so the Go standard\
    \ library `time` package includes a `Round( )` method to specify more concise\
    \ precision. This method requires one argument to determine your preferred rounding\
    \ behavior. Typically, the argument is supplied as one of the time package constants.\
    \ For example, calling the method with `Round( time.Millisecond )` will round\
    \ a nanosecond precision duration to the nearest millisecond, `Round( time.Second\
    \ )` will round a nanosecond precision duration to the nearest second, and so\
    \ on.\n\n![image](images/1b.jpg)Begin by importing the Go standard library time\
    \ package into a program\n\n```go\nimport (\n\t“fmt”\n\t“time”\n)\n```\n\n![image](images/commons.jpg)\n\
    \nsrc\\delay\\main.go\n\n![image](images/2b.jpg)Next, create and display components\
    \ of a Time data type\n\n`start := time.Now( )`\n\n`fmt.Println( “\\nStarted At:”,\
    \ start.Format( “03:04:05” ) )`\n\n![image](images/3b.jpg)Now, delay the program’s\
    \ progress for five seconds\n\n`time.Sleep( 5 * time.Second )`\n\n![image](images/4b.jpg)Then,\
    \ create and display a second Time data type\n\n`finish := time.Now( )`\n\n`fmt.Println(\
    \ “\\nFinished At:”, finish.Format( “03:04:05” ) )`\n\n![image](images/5b.jpg)Compare\
    \ the start and finish times\n\n`fmt.Println( “\\nStart First?:”, start.Before(\
    \ finish ) )`\n`fmt.Println( “Finish First?:”, finish.Before( start ) )`\n\n![image](images/6b.jpg)Finally,\
    \ display the length of the delay\n\n`diff := finish.Sub( start )`\n\n`fmt.Println(\
    \ “\\nTime Elapsed:”, diff.Round( time.Second ) )`\n\n![image](images/7b.jpg)Save\
    \ the program file in a “delay” directory, then run the program to see the time\
    \ delay\n\n![image](images/pg123_1.jpg)\n\n![image](images/hot.jpg)\n\nThe ability\
    \ to delay execution is particularly useful in pausing individual “goroutines”\
    \ – see the example [here](#chapter11.xhtml_package) for more details.\n\n###\
    \ Summary\n\n- The Go standard library `time` package contains functions to create\
    \ `Time` data types comprising date, time, and zone fields.\n- A `Time` data type\
    \ is not a string, but can be converted to a string using its `String( )` method.\n\
    - The `time.Now( )` function returns the current date, time, and zone from the\
    \ system time at the current locale.\n- Date components can be extracted from\
    \ a `Time` data type using its `Year( )`, `Month( )`, `Day( )`, and `Weekday(\
    \ )` methods.\n- The `Date( )`, `ISOWeek( )`, and `YearDay( )` methods return\
    \ date values that can usefully be assigned to variables.\n- Time components can\
    \ be extracted from a `Time` data type using its `Hour( )`, `Minute( )`, `Second(\
    \ )`, and `Nanosecond( )` methods.\n- The `Clock( )`, `Unix( )`, and `UnixNano(\
    \ )` methods return time values that can usefully be assigned to variables.\n\
    - The `Format( )` method takes a layout string or predefined constant as its argument\
    \ to format dates and times.\n- The Go reference string for date/time layouts\
    \ is `Mon Jan 2 15:04:05 2006 MST`.\n- The `time.Date( )` function is used to\
