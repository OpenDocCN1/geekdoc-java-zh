    **c2 := make( chan string )**


    ![image](images/3p.jpg)Now, add two goroutine calls that each pass a channel


    **go fastCount( c1 )**


    **go slowCount( c2 )**


    ![image](images/4p.jpg)After the main function, add the two called functions that
    will send channel messages at different intervals


    **func fastCount( c1 chan string ) {**


    **for {**


    **time.Sleep( 1 * time.Second )**


    **c1 <- time.Now( ).Format( “04:05” )**


    **}**


    **}**


    **func slowCount( c2 chan string ) {**


    **for {**


    **time.Sleep( 2 * time.Second )**


    **c2 <- time.Now( ).Format( “04:05” )**


    **}**


    **}**


    ![image](images/5p.jpg)Now, back in the main function, add an infinite loop to
    receive messages from any of the three channels


    ![image](images/pg167_2.jpg)


    ![image](images/6p.jpg)Save the program file in a “select” directory, then run
    the program to see the channel messages


    ![image](images/pg167_1.jpg)


    ![image](images/snake.jpg)


    An unlabeled **break** statement would only break out of the **select** statement
    – allowing the **for** loop to continue! A labeled **break** statement breaks
    out of both the **select** statement and the infinite **for** loop.


    **Synchronize Goroutines**


    The blocking action of unbuffered channels, where the sending action blocks a
    sending goroutine until another goroutine receives the delivery on the same channel,
    causes the sending and receiving goroutines to synchronize. In fact, unbuffered
    channels are sometimes referred to as “synchronous channels”.


    ![image](images/pg168_1.jpg)


    Channels can, therefore, be used to connect goroutines together in a “pipeline”,
    in which an item sent from one goroutine is the item received by another goroutine.
    Each goroutine in the pipeline will wait until the channel has been “drained”
    before sending the next item along the pipeline.


    By default, channels can both send and receive, but when you pass a channel to
    a goroutine you can specify in the function parameter whether the channel may
    only send items, or only receive items. A send-only channel is specified in the
    parameter by prefixing the chan keyword with the <- arrow operator, like this:


    **func *funcName* ( *paramName* <-chan *dataType* )**


    Conversely, a receive-only channel is specified in the parameter by suffixing
    the chan keyword with the <- arrow operator, like this:


    **func *funcName* ( *paramName* chan<- *dataType* )**


    Specifying a single permissible direction is recommended to reduce the possibility
    of bugs in your programs.


    ![image](images/1p.jpg)Begin a main function by creating two unbuffered channels
    for integer items


    **nums := make( chan int )**


    **sqrs := make( chan int )**


    ![image](images/commonp.jpg)


    src\synchronize\main.go


    ![image](images/2p.jpg)Next, add a goroutine call that passes one channel, which
    will begin a pipeline


    **go count( nums )**


    ![image](images/3p.jpg)Now, add a goroutine call that passes two channels, which
    will continue the pipeline


    **go square( nums, sqrs )**


    ![image](images/4p.jpg)After the main function, add the first called function,
    with a receive-only channel to which it will send 10 individual integers one-by-one
    when the pipeline is clear


    **func count( nums chan<- int ) {**


    **for i := 1 ; i <= 10 ; i++ {**


    **nums <- i**


    **}**


    **close( nums )**


    **}**


    ![image](images/5p.jpg)Add the second called function with a send-only channel,
    and a receive-only channel to which it will send 10 individual results one-by-one
    when the pipeline is clear


    **func square( nums <-chan int, sqrs chan<- int ) {**


    **for i := 1 ; i <= 10 ; i++ {**


    **num := <- nums**


    **sqrs <- num * num**


    **}**


    **close( sqrs )**


    **}**


    ![image](images/6p.jpg)Now, back in the main function, add a loop to receive the
    results at the end of the pipeline


    **for i := 1 ; i <= 10 ; i++ {**


    **num := <- sqrs**


    **fmt.Printf( “%v x %v = %v \n”, i, i, num )**


    **}**


    ![image](images/7p.jpg)Save the program file in a “synchronize” directory, then
    run the program to see the pipeline results


    ![image](images/pg169_1.jpg)


    ![image](images/hot.jpg)


    If the sender knows that no further values will be sent to the receiving channel,
    it can usefully close that channel.


    **Use Worker Pools**


    If your program has a queue of tasks to perform where the order in which the results
    are produced is not important, you can employ a “worker pool” – using goroutines
    and channels.


    ![image](images/pg170_1.jpg)


    A worker pool lets you send tasks from multiple concurrent calls to a goroutine
    that completes each task in a random order determined by the Go scheduler. You
    can use a WaitGroup to wait for the multiple goroutines to complete, or simply
    send the task results to nothing – to drain the channel and ensure that all worker
    goroutines have finished.


    ![image](images/pg170_2.jpg)


    ![image](images/1p.jpg)Begin by importing the Go standard library **time** package,
    to delay a worker goroutine function


    **import (**


    **“fmt”**


    **“time”**


    **)**


    ![image](images/commonp.jpg)


    src\workers\main.go


    ![image](images/2p.jpg)Next, in the main function, initialize a jobs total number
    variable, and create two buffered channels of the total size


    **numJobs := 10**


    **jobs := make( chan int, numJobs )**


    **results := make( chan int, numJobs )**


    ![image](images/3p.jpg)Now, add three worker goroutine calls that each pass an
    ID number and the two channels


    **go worker( 1, jobs, results )**


    **go worker( 2, jobs, results )**


    **go worker( 3, jobs, results )**


    ![image](images/4p.jpg)Send an integer for each of 10 jobs, then close that channel
    to indicate that is all the jobs in the queue


    **for i := 1 ; i <= numJobs ; i++ {**


    **jobs <- i**


    **}**


    **close( jobs )**


    ![image](images/5p.jpg)After the main function, add the called worker function
    that accepts the worker ID number, has a send-only channel from which to receive
    the job numbers, and a receive-only channel to which it will send 10 results


    **func worker( id int, jobs <-chan int, results chan<- int ) {**


    **for job := range jobs {**


    **fmt.Print( “Worker “, id, “ ran Job “, job )**


    **fmt.Printf( “ …%v x %v = %v \n”, job, job, job*job )**


    **time.Sleep( 1 * time.Second )**


    **results <- job**


    **}**


    **}**'
