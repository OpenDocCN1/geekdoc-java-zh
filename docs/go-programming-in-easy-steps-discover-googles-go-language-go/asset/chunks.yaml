  trans: '

    Go 是一种免费的开源编程语言，由 Robert Griesemer、Rob Pike 和 Ken Thompson 在 Google 创建——他们最因开发了
    Unix 操作系统而闻名。Google 于 2012 年 3 月发布了 Go 语言的 1.0 版本 (`golang`)，从那时起它获得了广泛的普及。


    Go 程序用纯文本编写，然后由 Go 编译器编译成机器码，以生成可执行的二进制版本。


    ![image](img/pg8_2.jpg)


    Go 编程语言的目标是具有表达性、快速、高效、可靠且易于编写。某些编程语言（如 C 或 C++）快速且可靠，但并不简单。相反，Java 或 Python 等其他编程语言编写起来简单，但效率不高。


    Go 在许多方面与 C 语言语言相似，有时被称为“类 C 语言”或“21 世纪的 C”。但 Go 的意义远于此，因为它吸收了许多其他编程语言的优秀思想，同时避免了那些导致复杂性或不可靠性的特性。


    也许最重要的是，Go 引入了利用“goroutine（协程）”和“通道（channels）”通过多核 CPU 处理来实现并发的能力。这为计算机同时处理多件事情提供了可能性。


    尽管 Go 语言没有像 C++ 或 Java 等面向对象编程（OOP）语言那样的类结构，但它的特性确实提供了某种程度的封装、继承和多态——这是 OOP 的三个基石。


    ![image](img/pg8_1.jpg)


    Go gopher —— Go 编程语言的标志性吉祥物。


    ![image](img/hot.jpg)


    你可以在 In Easy Steps 系列中发现更多编程语言书籍——包括 C、C++、C#、Java 和 Python。访问 [www.ineasysteps.com](http://www.ineasysteps.com)
    了解更多。


    有这么多编程语言可以选择，你可能会好奇为什么选择学习 Go 编程——以下是 Go 提供的某些优势：


    ### 语法简单


    Go 语言像 Python 一样简洁。它编写起来像 Python 一样简单，但像 C++ 一样高效。这让你能够编写易于阅读和维护的代码。


    ### 编译型语言

    Go 源代码被编译为二进制机器码，计算机可以直接读取，而不是在每次程序运行时都进行解释。这使得你编写的 Go 程序运行得比 Python 或 PHP 等解释型语言的程序更快。


    ### Go 编译器

    Go 编译器非常快并提供额外的好处，例如代码优化和错误检查——它可以检测代码中未使用的变量、代码所需的缺失导入，以及拼写错误或无效代码。Go 编译器还可以为其他操作系统生成可执行二进制文件。这让你能够将源代码编译并运行在多台机器上。


    ### 并发

    Go 语言通过 goroutines 和 channels 对并发提供了原生支持。这使你能够编写可以同时执行多个任务的多线程程序。


    ### 垃圾回收

    自动内存管理是 Go 语言的一个关键特性。它的垃圾回收器与程序并发运行。这让你在编写程序代码时无需担心内存泄漏。


    ### 静态类型

    Go 是一种静态类型语言，变量被显式地声明为特定的固定类型。这能够在开发过程中早期发现错误。


    随着 Go 语言经验的增加，你可能会发现其他优势，但现在是时候开始了……


    ### 安装 Go 工具


    要开始学习 Go 语言，你必须首先在 PC 上安装 Go 工具。这些工具允许你构建、运行和测试用 Go 语言编写的程序。Go 工具随许多实用的标准标准包提供，你可以将它们导入到自己的程序中。Go
    安装程序适用于 Windows、macOS 和 Linux。


    ![image](img/pg10_1.jpg)


    ![image](img/1b.jpg)打开网络浏览器并访问 [`golang.org`](https://golang.org)，然后下载适用于你系统的安装程序


    ![image](img/pg10_2.jpg)


    ![image](img/2b.jpg)下载完成后，运行安装程序启动“Go 编程语言安装向导”


    ![image](img/pg10_3.jpg)


    ![image](img/3b.jpg)点击 `Next` 继续，然后接受许可条款


    ![image](img/4b.jpg)接受建议的 `Destination Folder`（Windows 上为 `C:\Go`），然后点击 `Install`
    完成安装。


    ![image](img/hot.jpg)


    Windows 版 Go 安装程序会自动将 Go 添加到系统路径中，以便在命令提示符可以使用 Go 工具。


    ![image](img/5b.jpg)要测试安装是否成功，首先打开 Terminal 窗口——在 Windows 系统上同时按下 `WinKey` + `R`
    打开“运行”对话框，然后输入 `cmd` 打开“命令提示符”窗口。


    ![image](img/pg11_1.jpg)


    ![image](img/6b.jpg)在命令提示符处，输入命令 `go` 然后按 `Enter` 查看 Go 工具命令列表。


    ![image](img/pg11_3.jpg)


    ![image](img/hot.jpg)


    虽然有很多 Go 工具，但你大部分时候只会使用 `run` 工具来编译和运行你的程序。


    ![image](img/forget.jpg)


    “WinKey”是标有 Windows 标志的键盘键。


    ![image](img/pg11_2.jpg)


    ### 创建工作空间


    当你安装 Go 时，安装程序会设置多个 Go 环境变量。例如，Go 工具的目录（文件夹）存储在 `GOROOT` 环境变量中——默认在 Windows 上位于
    `C:\Go`，Linux 和 macOS 上位于 `/usr/local/go`。


    ![image](img/1.jpg)安装程序还会为你的工作空间位置设置 `GOPATH` 环境变量。默认情况下，这是主目录下的一个名为 `go` 的目录。例如，在
    Windows PC 上，路径为 `C:\Users\*username*\go`，在 Linux 系统上路径为 `/home/*username*\go`，在
    macOS 上是 `/Users/*username*\go`——但安装程序实际上并没有创建任何目录。


    要创建工作空间，你只需在主目录下添加一个名为 `go` 的目录。然后你必须在工作空间内添加 `bin`、`pkg` 和 `src` 子目录——你的所有程序都可以在
    `src` 目录下创建。


    在桌面上创建一个快捷方式是很有用的，它可以在这个子目录中打开命令行以便方便运行你的程序。


    ![image](img/1b.jpg)在 Windows PC 上，按照此处所述打开命令提示符，或打开 Terminal 窗口。


    ![image](img/2b.jpg)输入命令 `go env GOPATH` 查看当前的工作空间位置。


    ![image](img/3b.jpg)接下来执行 `mkdir` 命令在 `GOPATH` 环境变量指定的位置创建 `go` 工作空间。


    ![image](img/pg12_3.jpg)


    ![image](img/forget.jpg)


    `go\src` 文件夹是你保存编写程序的地方。`go\bin` 和 `go\pkg` 将将用于存储可执行文件和包存档。


    `mkdir` 命令名称是“make directory”（创建目录）的缩写。


    ![image](img/4.jpg)现在，执行后续 `mkdir` 命令在工作空间目录下创建 `bin`、`pkg` 和 `src` 子目录。


    ![image](img/pg13_1.jpg)


    ![image](img/pg13_2.jpg)


    ![image](img/5b.jpg)在 Windows 桌面上右键点击并选择 `New`, `Shortcut` 打开“创建快捷方式”对话框。


    ![image](img/6b.jpg)在位置输入 `cmd` 并点击 `Next`，然后名称输入 `Go Terminal` 并点击 `Finish` 在桌面上创建一个快捷方式图标。


    '
- fmt: "\n![image](images/7b.jpg)\nRight-click on the shortcut icon and select the\
    \ `Properties` item, to open its “Properties” dialog\n\n![image](images/pg13_4.jpg)\n\
    \n![image](images/8b.jpg)\nChoose the `Shortcut` tab, then enter the location\
    \ of your workspace directory\n\n![image](images/9b.jpg)\nClick `Apply`, `OK`\
    \ to close the dialog, then double-click the shortcut icon to open a command-line\
    \ in your “src” folder\n\n![image](images/pg13_5.jpg)\n\n![image](images/hot.jpg)\n\
    \nGo programs can be written in a plain text editor, such as Windows’ Notepad\
    \ app. It’s useful to have a desktop shortcut that opens a text editor in your\
    \ “src” directory folder. Repeat the steps on this page, but in Step 7 enter `notepad`\
    \ as the location and `Go Editor` as the name, to create another useful desktop\
    \ shortcut.\n\n## Write a Go Program\n\nAll Go programs start as plain text files\
    \ that are later compiled into actual executable programs. This means that Go\
    \ programs can be written in any plain text editor, such as the Windows’ Notepad\
    \ app or the Nano app on Linux.\n\n![image](images/pg14_1.jpg)\n\nFollow these\
    \ steps to create a simple Go program that will output the traditional first program\
    \ greeting:\n\n![image](images/1b.jpg)\nCreate a sub-directory named “hello” in\
    \ your “src” folder\n\n![image](images/pg14_2.jpg)\n\n![image](images/commons.jpg)\n\
    \n`src/hello/main.go`\n\n![image](images/2b.jpg)\nOpen a plain text editor, like\
    \ Notepad, and type this code exactly as it is listed to begin a program\n\n```go\n\
    package main\n```\n\n![image](images/3b.jpg)\nTwo lines below, insert this code\
    \ exactly as it is listed\n\n```go\nimport “fmt”\n```\n\n![image](images/4b.jpg)\n\
    Two further lines below, precisely add this code\n\n```go\nfunc main( ) {\n  \
    \  fmt.Println( “Hello World!” )\n}\n```\n\n![image](images/5b.jpg)\nSave the\
    \ file in the “hello” folder, and name it `main.go` – the complete program should\
    \ now look exactly like this:\n\n![image](images/pg14_3.jpg)\n\n![image](images/snake.jpg)\n\
    \nCapital P and lowercase L in `fmt.Println`.\n\n![image](images/forget.jpg)\n\
    \nThe arrangement of files within folders is important in Go. Each main file,\
    \ and any related files, must be placed in a uniquely named folder to create a\
    \ package – so here the package is named “hello”.\n\nThe separate parts of the\
    \ program code on the opposite page can be examined individually to understand\
    \ each part more clearly:\n\n### The Package Declaration\n\n```go\npackage main\n\
    ```\n\nThe package type is declared following the package keyword. All Go program\
    \ code is contained in packages. You may declare your own type for a package that\
    \ will be a shared library, but you must declare the package “main” if you want\
    \ the code to be compiled into an executable program.\n\n### The Import Declaration\n\
    \n```go\nimport “fmt”\n```\n\nThe keyword `import` is used to import one, or more,\
    \ packages into this package to make their features available to this program.\
    \ The package `fmt` comes from the Go standard library that is included in your\
    \ Go installation. It provides the `fmt.Println()` function that is used to output\
    \ text in this program. Note that the package name must be enclosed in double\
    \ quote characters. When importing multiple packages, the list of package names\
    \ must be enclosed within parentheses and each name must appear on its own line,\
    \ like this:\n\n```go\nimport (\n    “fmt”\n    “strings”\n)\n```\n\n### The Function\
    \ Declaration\n\n```go\nfunc main( ) {\n    fmt.Println( “Hello World!” )\n}\n\
    ```\n\nThe function name follows the `func` keyword. It must be followed by parentheses\
    \ and an `{` opening curly bracket on the same line. The function body contains\
    \ statements that are the actual instructions to perform program tasks. The function\
