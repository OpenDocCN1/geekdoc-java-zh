    Only split methods that contain the word “After” in their name will retain the
    separators.


    Find Characters


    ![image](images/pg130_1.jpg)


    The Go standard library strings package provides several functions that allow
    a specified string to be searched to find a specified character or substring (pattern).
    These functions treat the string as an array in which each element contains a
    character or a space.


    The strings package has a Contains( ) function that requires two arguments to
    specify a string and a pattern to find. This function will simply return true
    or false to indicate the result of a (case-sensitive) search. For example, to
    search for a “Pro” pattern:


    **strings.Contains( “Go Programming in easy steps”, “Pro” )**


    The strings package also has an Index( ) function that requires two arguments
    to specify a string and a pattern to find. This function will return an integer
    that is the index position of the first instance of the pattern in the searched
    string if the search succeeds, otherwise it will return -1 when the search fails.


    The strings package’s Count( ) function requires two arguments to specify a string
    and a pattern to find. You can use this function to discover how many non-overlapping
    instances of a pattern occur in a searched string. If the pattern is an empty
    string, this function will normally return 1 plus the number of characters in
    the searched string. This allows you to determine the number of characters in
    a searched string by deducting 1 from the returned integer.


    The strings package’s HasPrefix( ) function requires two arguments to specify
    a string and a pattern to find. This function will return **true** or **false**
    to indicate whether the searched string begins with the specified pattern.'
