  trans: "\n\n当多个 goroutine 在不同的时间向通道发送消息时，程序可能会在等待从较的通道接收消息时阻塞进度。Go 提供了一种解决这种阻塞操作的方法，通过在\
    \ `select` 语句中同时监听多个通道的消息。这种语法与这里描述的 `switch` 语句相似，但 `select` 语句会阻塞直到其中一个 `case`\
    \ 语句找到匹配项。一旦找到匹配，与该 `case` 语句关联的语句将被执行。这种组合 goroutine 和通道的能力是 Go 语言的一项强大特性。\n\n\
    ![image](img/pg166_1.jpg)\n\n为了持续监听通道消息，可以将 `select` 语句放在一个无限 `for` 循环中。可以通过包含一个带有关联语句（该语句将跳出循环到外部标签）的\
    \ `case` 语句来退出循环。\n\nGo 标准库 `time` 包提供了一个实用的 `After()` 函数，可以用于创建一个“超时”来限制监听循环的执行时间。它需要一个持续时间作为参数，并返回一个\
    \ `time.Time` 类型的通道——这将是当前时间加上持续时间后的未来时间。使用 `case` 语句测试当前时间何时匹配超时通道可用于退出监听循环。\n\
    \n![image](img/1p.jpg)首先导入 Go 标准库 `time` 包，以等待 goroutine 并创建超时\n\n```go\nimport\
    \ (\n\t\"fmt\"\n\t\"time\"\n)\n```\n\n![image](img/commonp.jpg)\n\nsrc\\select\\\
    main.go\n\n![image](img/2p.jpg)接下来，在 main 函数中创建一个超时通道和两个空通道\n\n```go\nc0 := time.After(\
    \ 7 * time.Second )\nc1 := make( chan string )\nc2 := make( chan string )\n```\n\
    \n![image](img/3p.jpg)现在，添加两个 goroutine 调用，每个调用传递一个通道\n\n```go\ngo fastCount(\
    \ c1 )\ngo slowCount( c2 )\n```\n\n![image](img/4p.jpg)在 main 函数之后，添加两个被调用的函数，它们将以不同的间隔发送通道消息\n\
    \n```go\nfunc fastCount( c1 chan string ) {\n\tfor {\n\t\ttime.Sleep( 1 * time.Second\
    \ )\n\t\tc1 <- time.Now( ).Format( “04:05” )\n\t}\n}\n\nfunc slowCount( c2 chan\
    \ string ) {\n\tfor {\n\t\ttime.Sleep( 2 * time.Second )\n\t\tc2 <- time.Now(\
    \ ).Format( “04:05” )\n\t}\n}\n```\n\n![image](img/5p.jpg)现在，回到 main 函数，添加一个无限循环来接收来自三个通道中任何一个通道的消息\n\
    \n![image](img/pg167_2.jpg)\n\n![image](img/6p.jpg)将程序文件保存在“select”目录中，然后运行程序查看通道消息\n\
    \n![image](img/pg167_1.jpg)\n\n![image](img/snake.jpg)\n\n一个无标签的 `break` 语句只会跳出\
    \ `select` 语句——允许 `for` 循环继续！带标签的 `break` 语句会同时跳出 `select` 语句和无限 `for` 循环。\n\n\
    ### 同步 Goroutine\n\n无缓冲通道的阻塞操作（发送操作会阻塞发送端 goroutine 直到另一个 goroutine 在同一通道上接收交付）会导致发送和接收的\
    \ goroutine 实现同步。事实上，无缓冲通道有时被称为“同步通道”。\n\n![image](img/pg168_1.jpg)\n\n因此，通道可以用于将\
    \ goroutine 连接到“流水线”中，其中从一个 goroutine 发送的项目是另一个 goroutine 接收到的项目。流水线中的每个 goroutine\
    \ 都会等待通道被“排空”后，再沿流水线发送下一个项目。\n\n默认情况下，通道既可以发送也可以接收，但当你将通道传递给 goroutine 时，你可以在函数参数中指定该通道是仅可发送还是仅用于接收项目。只发送通道通过在参数中\
    \ `chan` 关键字前加上 `<-` 操作符来指定，如下所示：\n\n```go\nfunc funcName ( paramName <-chan dataType\
    \ )\n```\n\n相反，只接收通道通过在参数中 `chan` 关键字后加上 `<-` 操作符来指定，如下所示：\n\n```go\nfunc funcName\
    \ ( paramName chan<- dataType )\n```\n\n建议指定单一允许的方向，以减少程序出现 bug 的可能性。\n\n![image](img/1p.jpg)开始一个\
    \ main 函数，创建两个用于整数项目的无缓冲通道\n\n```go\nnums := make( chan int )\nsqrs := make( chan\
    \ int )\n```\n\n![image](img/commonp.jpg)\n\nsrc\\synchronize\\main.go\n\n![image](img/2p.jpg)接下来，添加一个传递通道的\
    \ goroutine 调用，这将开始一个流水线\n\n```go\ngo count( nums )\n```\n\n![image](img/3p.jpg)现在，添加一个传递两个通道的\
    \ goroutine 调用，这将继续流水线\n\n```go\ngo square( nums, sqrs )\n```\n\n![image](img/4p.jpg)在\
    \ main 函数之后，添加第一个调用的函数，它带有一个只接收通道，当流水线空闲时，它将逐个发送 10 个独立的整数\n\n```go\nfunc count(\
    \ nums chan<- int ) {\n\tfor i := 1 ; i <= 10 ; i++ {\n\t\tnums <- i\n\t}\n}\n\
    ```\n\n![image](img/5p.jpg)现在，回到 main 函数，添加第二个被调用的函数，它带有一个只接收通道，当流水线空闲时它将逐个发送\
    \ 10 个结果\n\n```go\nfunc square( nums <-chan int, sqrs chan<- int ) {\n\tfor i\
    \ := 1 ; i <= 10 ; i++ {\n\t\tnum := <- nums\n\t\tsqrs <- num\n\t}\n}\n```\n\n\
    ![image](img/6p.jpg)现在，在 main 函数中，添加一个循环来接收流水线末尾的结果\n\n```go\nfor i := 1 ; i <=\
    \ 10 ; i++ {\n\tnum := <- sqrs\n\tfmt.Printf( “%v x %v = %v \\n”, i, num )\n}\n\
    ```\n\n![image](img/7p.jpg)将程序文件保存在“synchronize”目录中，然后运行程序查看流水线\n\n![image](img/pg69_1)\n\
    \n![image](img/pg170_1.jpg)\n\n工作池允许你从多个并发调用发送任务到 goroutine，由 Go 调度器决定完成顺序。你可以使用\
    \ WaitGroup 等待 goroutine 完成，或者简单排空通道以确保所有 goroutine 都已完成。\n\n![image](img/1p.jpg)首先导入\
    \ Go 标准库 `time` 包，以延迟 goroutine 函数\n\n```go\nimport (\n\t\"fmt\"\n\t\"time\"\n\
    )\n```\n\n![image](img/commonp.jpg)\n\nsrc\\workers\\main.go\n\n![image](img/2p.jpg)接下来，在\
    \ main 函数中初始化 jobs 变量，并创建两个大小为总数的缓冲通道\n\n```go\nnumJobs := 10\njobs := make( chan\
    \ int, numJobs )\nresults := make( chan int, numJobs )\n```\n\n![image](img/3p.jpg)现在，添加三个\
    \ worker goroutine 调用，每个调用传递一个 ID 数字和两个通道\n\n```go\ngo worker( 1, jobs, results\
    \ )\ngo worker( 2, jobs, results )\ngo worker( 3, jobs, results )\n```\n\n![image](img/4p.jpg)为\
    \ 10 个任务中的每一个发送一个整数，然后关闭该通道以指示队列中已无任务\n\n```go\nfor i := 1 ; i <= numJobs ; i++\
    \ {\n\tjobs <- i\n}\nclose( jobs )\n```\n\n![image](img/5p.jpg)在 main 函数之后，添加调用的\
    \ worker 函数，它接受 worker ID 数字，有一个只发送通道用于接收任务号，并有一个只接收通道用于发送结果\n\n```go\nfunc worker(\
    \ id int, jobs <-chan int, results chan<- int ) {\n\tfor job := range jobs {\n\
    \t\tfmt.Print( “Worker “, id, “ ran Job “, job )\n\t\tfmt.Printf( “ …%v x %v =\
    \ %v \\n”, job, job, job*job )\n\t\ttime.Sleep( 1 * time.Second )\n\t\tresults\
    \ <- job\n\t}\n}\n```\n\n![image](img/6p.jpg)现在，回到 main 函数中，添加一个循环来接收结果\n\n```go\n\
    for i := 1 ; i <= numJobs ; i++ {\n\tnum := <- results\n}\n```\n\n"
- fmt: "\n![image](images/6p.jpg)Now, back in the main function, add a loop to collect\
    \ the results and ensure that all the workers have completed\n\n```go\nfor i :=\
    \ 1 ; i <= numJobs ; i++ {\n    <- results\n}\nclose( results )\n```\n\n![image](images/7p.jpg)Save\
    \ the program file in a “workers” directory, then run the program to see the worker\
    \ pool results\n\n![image](images/pg171_1.jpg)\n\n![image](images/hot.jpg)\n\n\
    The 1-second delay in this example merely simulates the time taken to perform\
    \ a more lengthy task.\n\n![image](images/hot.jpg)\n\n“Worker Pools” are also\
    \ known as “Thread Pools”. They can result in better performance as they don’t\
    \ need to create a new thread for each task.\n\n## Summary\n\n- Parallelism is\
    \ when two tasks are performed simultaneously.\n- Concurrency is the separation\
    \ of program code into separate tasks that could potentially be performed simultaneously.\n\
    - Goroutines provide the ability for lines of code to be executed concurrently.\n\
    - A goroutine is created by inserting the `go` keyword before an ordinary function\
    \ call or method call.\n- The Go standard library `sync` package provides a `WaitGroup`\
    \ type that can wait for multiple goroutines to finish.\n- A `WaitGroup` has an\
    \ `Add()` incrementing method, a `Done()` decrementing method, and a `Wait()`\
    \ blocking method.\n- When passing a `WaitGroup` as an argument to a function,\
    \ it must be passed as a pointer.\n- A Go channel is like a pipe through which\
    \ the program can send and receive messages.\n- A channel is created by specifying\
    \ the `chan` keyword and a data type as arguments to the built-in `make()` function.\n\
    - Deadlock is a fatal error where the program cannot proceed.\n- The built-in\
    \ `close()` function can explicitly close a channel.\n- Adding a buffer size argument\
    \ to the `make()` function enables multiple items to be sent as a queue to a channel.\n\
    - A `select` statement block can be used to simultaneously listen for messages\
    \ from multiple channels.\n- Enclosing a `select` statement block within an infinite\
    \ `for` loop allows a program to continuously listen for channel messages.\n-\
    \ Channels can connect goroutines in a pipeline that sends and receives messages\
    \ to synchronize the goroutines.\n- The `<-` arrow operator can be used in function\
    \ parameters to specify whether channels may only send or only receive.\n- A worker\
    \ pool can send tasks from multiple concurrent calls to a goroutine for completion\
    \ in a random order set.\n\n# 12 Request Responses\n\n*This chapter demonstrates\
    \ how to create a web server and how to process submitted form data using the\
    \ Go standard library `net/http` and `io` packages.*\n\n### Listen for Requests\n\
    ### Handle a Request\n### Add Files to Serve\n### Deliver a Static Page\n### Log\
    \ Received Data\n### Deliver a Dynamic Response\n### Summary\n\n## 12.1 Listen\
    \ for Requests\n\nThe Go standard library `net` package contains an `http` package\
    \ that provides utilities that make it easy to create a web server. These utilities\
    \ can be made available to your program by importing the `net/http` package.\n\
    \n![image](images/pg174_1.jpg)\n\nThe `http.ListenAndServe()` function enables\
    \ the program to start a web server running. It requires two arguments to specify\
    \ a TCP network address string and a request handler. The address string specifies\
    \ a port number to which the web server should listen for incoming requests. The\
    \ port number must be prefixed by a `:` colon character within the string – for\
    \ example, “:8000” to listen for incoming requests on local port 8000. The default\
    \ handler is typically used by specifying a `nil` second argument.\n\nThe `http.ListenAndServe()`\
    \ function always returns a non-nil `error`, and blocks forever. This means that\
    \ lines of code below the call to this function will never be executed. The web\
    \ server will continue to listen for incoming requests until the program gets\
    \ terminated.\n\n![image](images/1o.jpg)Begin by importing the Go standard library\
    \ `net/http` package into a program\n\n```go\nimport (\n    \"fmt\"\n    \"net/http\"\
    \n)\n```\n\n![image](images/commono.jpg)\n\nsrc\\server\\main.go\n\n![image](images/2o.jpg)Next,\
    \ add a `main` function that will output a startup message and start a web server\
    \ listening to local port 8000 on your system\n\n```go\nfunc main() {\n    //\
    \ Statements to be inserted here later.\n    fmt.Println( \"Starting web server\
    \ on port 8000\" )\n    http.ListenAndServe( \":8000\", nil )\n}\n```\n\n![image](images/3o.jpg)Save\
    \ the program file in a “server” directory, then run the program to start the\
    \ web server\n\n![image](images/hot.jpg)\n\nLocal system addresses are referenced\
    \ via the loopback network `http` interface using the hostname `localhost`. This\
    \ normally resolves to the IP address `127.0.0.1`.\n\n![image](images/pg175_1.jpg)\n\
    \n![image](images/4o.jpg)If a firewall security warning appears, confirm that\
    \ you wish to allow access for the web server\n\n![image](images/pg175_2.jpg)\n\
    \n![image](images/5o.jpg)Now, launch a web browser and visit `localhost:8000`\n\
    \n![image](images/hot.jpg)You can hit `Ctrl` + `C` to terminate a running program.\n\
    \n![image](images/hot.jpg)\n\nThe web server does not yet know how to respond\n\
    \n## 12.2 Handle a Request\n\nIn order for a Go web server to handle incoming\
    \ requests, the program needs to register “route handlers” that specify how to\
    \ respond.\n\n![image](images/pg176_1.jpg)\n\nThe `net/http` package provides\
    \ an `http.HandleFunc()` function that will register a route handler. This function\
    \ requires two arguments: a string pattern describing the path to listen for,\
    \ and the name of the function that will be called to provide a response. The\
    \ string pattern will begin with a `/` forward slash character – for example,\
    \ “/hello”. This specifies that the web server should listen for incoming requests\
    \ from localhost:8000/hello.\n\nA request handler function will, by default, always\
    \ have parameters for an `http.ResponseWriter` object, to write a response to\
    \ the request, and a pointer to an `http.Request` object containing information\
    \ about the request – for example, its `URL.Path` contains the string pattern\
    \ specified to the `http.HandleFunc()` function. Typically, the `http.ResponseWriter`\
    \ object is simply given the name `w`, and the `http.Request` object is given\
    \ the name `r`.\n\nThe `http.ResponseWriter` object has a `Write()` method that\
    \ accepts a byte slice argument of characters to be sent in a response. The characters\
    \ can be converted into a string, like this:\n\n```go\nw.Write( []byte(\"response\
    \ string\") )\n```\n\nIt is, however, more convenient to pass a string to the\
    \ `http.ResponseWriter` object using a `WriteString()` function contained in the\
    \ Go standard library `io` (input/output) package. This can be made available\
    \ by importing the `io` package.\n\nThe `io.WriteString()` function requires two\
    \ arguments to specify the `http.ResponseWriter` object, and the string to be\
    \ sent in response to a request.\n\n![image](images/1o.jpg)Begin by adding the\
    \ instruction to import the Go standard library `io` package into the previous\
    \ program import\n\n```go\nimport (\n    \"fmt\"\n    \"io\"\n    \"net/http\"\
    \n)\n```\n\n![image](images/commono.jpg)\n\nsrc\\server\\main.go\n\n![image](images/2o.jpg)Next,\
    \ at the start of the `main` function, insert a statement to register a route\
    \ handler\n\n```go\nhttp.HandleFunc(\"/hello\", helloHandler)\n```\n\n![image](images/3o.jpg)Now,\
    \ after the `main` function, add the handler function that will write two strings\
    \ as a request response\n\n```go\nfunc helloHandler(w http.ResponseWriter, r *http.Request)\
    \ {\n    io.WriteString(w, \"Response from the helloHandler!\\n\")\n    io.WriteString(w,\
    \ \"URL.Path = \" + r.URL.Path)\n}\n```\n\n![image](images/4o.jpg)\n"
