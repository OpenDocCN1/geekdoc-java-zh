    ![image](images/5r.jpg)Save the program file in the “const” directory, then run
    the program to see the constant values


    ![image](images/pg29_1.jpg)


    ![image](images/hot.jpg)


    The **math** package in Go provides a constant named **math.Pi** that is a far
    better approximation of the value of ![image](images/py.jpg)


    ![image](images/hot.jpg)


    The sequence here represents the points value of each ball in the game of snooker.


    **Point to Stored Values**


    Whenever your program creates a container to store data, your computer allocates
    a space in memory at which to store the data. Like houses, memory locations may
    be of different size but each one has a unique address.


    ![image](images/pg30_1.jpg)


    An initialized variable therefore actually consists of three parts – name, value,
    and the memory address where the data is stored.


    ![image](images/pg30_2.jpg)


    Go programming supports the concept of “pointers”. A pointer variable can store
    the address of another variable and can access the value stored at that address.


    The declaration of a pointer variable requires the data type to be prefixed by
    an * asterisk, to indicate that this will be a pointer:


    **var ptr *int        // Declares this variable will point to an int.**


    The address of another variable can be assigned to the pointer by prefixing the
    other variable’s name with an **&** ampersand:


    **ptr = &num        // Assigns an address to the pointer variable.**


    The value at the assigned address can then be accessed by prefixing the pointer
    name with an ***** asterisk:


    ***ptr                    // Points to the value at the assigned address.**


    ![image](images/pg30_3.jpg)


    The concept of pointers can be difficult to grasp because the * asterisk operator
    performs two purposes – as a type descriptor in a declaration, and as a dereferencer
    when placed before a pointer name. You may at this moment be thinking “Pointers,
    so what?” but pointers are widely used in Go programming, so you should thoroughly
    understand how they work before proceeding further.


    ![image](images/hot.jpg)


    Memory location addresses are hexadecimal numbers that are allocated by your computer.
    They will almost certainly differ on your system from the addresses shown in this
    example.


    ![image](images/1r.jpg)Create a directory named “point” inside your “src” folder


    ![image](images/commonr.jpg)


    src\point\main.go


    ![image](images/2r.jpg)Begin a main.go program with package and import declarations


    **package main**


    **import “fmt”**


    ![image](images/3r.jpg)Add a main function that declares and initializes a regular
    integer variable and a pointer variable


    **func main( ) {**


    **var num int = 20**


    **var ptr *int = &num**


    **// Statements to be inserted here.**


    **}**


    ![image](images/4r.jpg)Next, insert statements to display the value and memory
    address of the regular integer variable


    **fmt.Printf( “num value: %v type: %T \n”, num, num )**


    **fmt.Printf( “num address: %v type: %T \n\n”, ptr, ptr )**


    ![image](images/5r.jpg)Now, insert statements to display the dereferenced value
    and memory address of the pointer variable


    **fmt.Printf( “num via pointer: %v type: %T \n”, *ptr, *ptr )**


    **fmt.Printf( “ptr address: %v type: %T \n\n”, &ptr, &ptr )**


    ![image](images/6r.jpg)Finally, insert statements to change the value stored in
    the integer variable – by assignment to the pointer variable


    ***ptr = 100**


    **fmt.Printf( “new num value: %v type: %T \n”, num, num )**


    ![image](images/7r.jpg)Save the program file in the “point” directory, then run
    the program to see the variable values and addresses


    ![image](images/pg31_1.jpg)


    ![image](images/hot.jpg)


    The most important feature to recognize here is that the pointer changes the original
    value stored in the variable to which it points, not a copy of that value. This
    becomes significant when passing variables to functions – see [here](#chapter05.xhtml_sec30).


    **Summary**


    •A variable stores data that can be referenced via the variable’s given name,
    and its value can be changed.


    •An explicit variable declaration uses the var keyword and states the type of
    data that variable can contain.


    •An implicit variable declaration can be made inside a function body using the
    := operator to infer the data type.


    •Go is a statically typed language in which a variable can only ever contain data
    of the type specified in its declaration.


    •The fmt.Printf( ) function can use format specifiers, variable names and \n newline
    escape sequences to format output.


    •The strconv.Atoi( ) function returns the int data type equivalent of a string
    value specified within its parentheses, and a second value that will be nil or
    an error message.


    •The strconv.Itoa( ) function returns the string data type equivalent of an int
    value specified within its parentheses.


    •The strconv.ParseFloat( ) function returns the float64 data type equivalent of
    a string value specified within its parentheses, and a second value that will
    be nil or an error message.


    •When a variable of the byte data type is assigned a character, it stores the
    ASCII character code number of that character.


    •Casting between numeric data types states the required type followed by parentheses
    containing the value to be converted.


    •A constant declaration uses the const keyword, and must be initialized with the
    fixed value it will contain.


    •A pointer variable can store the memory address of another variable, and can
    access the value stored at that address.


    •The * asterisk operator prefixes the data type in a pointer variable declaration
    to indicate that variable will be a pointer.


    •The & ampersand operator prefixes the name of a regular variable to reference
    that variable’s memory address.


    •The * asterisk operator prefixes the name of a pointer variable to reference
    the value stored at the address it points to.


    3


    Perform Operations


    ***This chapter introduces Go operators and demonstrates the operations they can
    perform.***


    [**Do Arithmetic**](#chapter03.xhtml_sec15)


    [**Assign Values**](#chapter03.xhtml_sec16)


    [**Make Comparisons**](#chapter03.xhtml_sec17)


    [**Assess Logic**](#chapter03.xhtml_sec18)


    [**Juggle Bits**](#chapter03.xhtml_sec19)'
