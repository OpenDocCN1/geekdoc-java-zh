  trans: "\n\n![image](img/6p.jpg)现在，回到 `main` 函数，添加一个循环来收集结果并确保所有工作线程已完成\n\n```go\n\
    for i := 1 ; i <= numJobs ; i++ {\n    <- results\n}\nclose( results )\n```\n\n\
    ![image](img/7p.jpg)将程序文件保存在“workers”目录中，然后运行程序以查看工作池结果\n\n![image](img/pg171_1.jpg)\n\
    \n![image](img/hot.jpg)\n\n此示例中的 1 秒延迟仅仅是为了模拟执行更耗时任务所花费的时间。\n\n![image](img/hot.jpg)\n\
    \n“工作池”（Worker Pools）也被称为“线程池”。它们可以带来更好的性能，因为它们不需要为每个任务都创建一个新线程。\n\n## 总结\n\n\
    -   并行性（Parallelism）是指同时执行两个任务。\n-   并发（Concurrency）是将程序代码拆分为多个可能被同时执行的独立任务。\n\
    -   Goroutine 提供了代码行并发执行的能力。\n-   通过在普通函数调用或方法调用之前插入 `go` 关键字来创建一个 goroutine。\n\
    -   Go 标准库 `sync` 包提供了 `WaitGroup` 类型，可以等待多个 goroutine 完成。\n-   `WaitGroup` 具有一个\
    \ `Add()` 递增方法、一个 `Done()` 递减方法和一个 `Wait()` 阻塞方法。\n-   当将 `WaitGroup` 作为参数传递给函数时，必须以指针的形式传递。\n\
    -   Go 通道（channel）就像一根管道，程序可以通过它来发送和接收消息。\n-   通道是通过在内置的 `make()` 函数中指定 `chan`\
    \ 关键字和数据类型作为参数来创建的。\n-   死锁（Deadlock）是程序无法继续运行的致命错误。\n-   内置函数 `close()` 可以显式地关闭通道。\n\
    -   在 `make()` 函数中添加缓冲区大小参数，可以将多个项目作为队列发送到通道中。\n-   `select` 语句块可以同时监听来自多个通道的消息。\n\
    -   将 `select` 语句块封装在无限 `for` 循环中，允许程序持续监听通道消息。\n-   通道可以在流水线中连接 goroutine，通过发送和接收消息来同步这些\
    \ goroutine。\n-   `<-` 箭头运算符可以在函数参数中使用，指定通道是否仅允许发送或仅接收。\n-   工作池可以将从多个并发调用产生的任务发送给\
    \ goroutine，按随机设置的顺序进行完成。\n\n# 12 请求响应\n\n*本章演示了如何创建一个 Web 服务器，以及如何使用 Go 标准库中的\
    \ `net/http` 和 `io` 包处理提交的表单数据。*\n\n### 监听请求\n### 处理请求\n### 添加待提供的文件\n### 交付静态页面\n\
    ### 记录接收到的数据\n### 交付动态响应\n### 总结\n\n## 12.1 监听请求\n\nGo 标准库 `net` 包包含一个 `http`\
    \ 包，它提供了可以方便创建 Web 服务器的实用工具。通过导入 `net/http` 包，可以让这些实用工具对你的程序可用。\n\n![image](img/pg174_1.jpg)\n\
    \n`http.ListenAndServe()` 函数允许程序启动并运行一个 Web 服务器。它需要两个参数：指定 TCP 网络地址字符串和请求处理程序。地址字符串指定了\
    \ Web 服务器应该监听传入请求的端口号。端口号在字符串内必须以 `:` 冒号字符为前缀——例如，“:8000”表示监听来自本地端口 8000 的传入请求。通常通过将第二个参数指定为\
    \ `nil` 来使用默认处理程序。\n\n`http.ListenAndServe()` 函数始终返回一个非空的 `error` 并永久阻塞。这意味着调用此函数之后的代码行将永远不会执行。Web\
    \ 服务器将继续监听传入的请求，直到程序终止。\n\n![image](img/1o.jpg)通过导入 `net/http` 包开始程序\n\n```go\n\
    import (\n    \"fmt\"\n    \"net/http\"\n)\n```\n\n![image](img/commono.jpg)接下来，添加一个\
    \ `main` 函数来输出消息并启动 Web 服务器\n\n```go\nfunc main() {\n    fmt.Println(\"Starting\
    \ web server on 8000\")\n    http.ListenAndServe(\":8000\", nil)\n}\n```\n\n![image](img/3.jpg)将程序文件保存在“server”目录中\n\
    \n![image](img/5.jpg)server.go\n\n本地地址通过回环地址 `127.0.0.1` 引用 `localhost`。\n\n![image](img/hot.jpg)如果出现防火墙警告，确认你希望访问\n\
    \n![image](img/pg75.jpg)现在，启动浏览器并访问 `localhost:8000`\n\n![image](img/hot.jpg)你可以按\
    \ `Ctrl + C` 终止运行的程序。\n\nWeb 服务器还不知道如何响应\n\n## 12.2 处理请求\n\n为了让 Go Web 服务器处理传入请求，程序需要注册指定如何响应的“路由处理程序”。\n\
    \n![image](img/pg76.jpg)\n\n`net/http` 包提供了 `http.HandleFunc()` 函数来注册处理程序。该函数需要两个参数：描述路径的字符串模式，以及将被调用的函数名称。字符串模式将以\
    \ `/` 斜杠字符开头——例如，“/hello”。这指定了 Web 服务器监听来自 localhost:8000/hello 的请求。\n\n请求处理函数默认总是包含一个用于向请求写入响应的\
    \ `ResponseWriter` 对象，以及包含请求信息（例如其 `URL.Path`）的 `http.Request` 对象指针。通常，`http.ResponseWriter`\
    \ 对象被命名为 `w`，`http.Request` 对象被命名为 `r`。\n\n`http.ResponseWriter` 对象有一个 `Write()`\
    \ 方法，接受要发送响应的字符字节切片参数。字符可以转换为字符串，如下：\n\n```go\nw.Write( []byte(\"response string\"\
    ) )\n```\n\n然而，更方便的方法是使用 Go 标准库 `io` 包中包含的 `WriteString()` 函数将字符串传递给 `ResponseWriter`\
    \ 对象。这可以通过导入 `io` 包来实现。\n\n`io.WriteString()` 函数需要两个参数：指定 `ResponseWriter` 对象以及要作为响应发送的字符串。\n\
    \n![image](img/1o.jpg)在之前的程序导入中添加 Go 标准库 `io` 包\n\n```go\nimport (\n    \"fmt\"\
    \n    \"io\"\n    \"net/http\"\n)\n```\n\n![image](img/2o.jpg)server.go\n\n接下来，在\
    \ `main` 函数开始处插入一个语句来注册路由处理程序\n\n```go\nhttp.HandleFunc(\"/hello\", helloHandler)\n\
    ```\n\n![image](img/3o.jpg)现在，在 `main` 函数之后，添加写入两个字符串作为请求响应的处理器函数\n\n```go\nfunc\
    \ helloHandler(w http.ResponseWriter, r *http.Request) {\n    io.WriteString(w,\
    \ \"Response from the helloHandler!\\n\")\n    io.WriteString(w, \"URL.Path =\
    \ \" + r.URL.Path)\n}\n```\n\n"
- fmt: "\n![image](images/5o.jpg)If a firewall security warning appears, confirm that\
    \ you wish to allow access for the web server\n\n![image](images/6o.jpg)Launch\
    \ a web browser and visit `localhost:8000/hello` to see the web server respond\
    \ to this request\n\n![image](images/pg177_2.jpg)\n\n## Add Files to Serve\n\n\
    Having established that the server program can respond to requests with the example\
    \ [here](#chapter12.xhtml_register), files can be added to the program that the\
    \ server can deliver in response to requests.\n\n![image](images/pg178_1.jpg)\n\
    \nWeb server files are typically contained within a root directory named `htdocs`\
    \ (hypertext documents) or a similar name. This will generally contain HTML files\
    \ and perhaps a `favicon.ico` image to identify the website in the browser’s title\
    \ bar. The root directory will also often contain sub-directories to group associated\
    \ files – such as images in an `img` folder, style sheets in a `css` folder, etc.\n\
    \nIn our server example, two HTML documents have been added to a root `htdocs`\
    \ directory alongside a `favicon.ico` image. A single style sheet resides within\
    \ an `htdocs/css` directory, and several images are contained in an `htdocs/img`\
    \ directory. The entire server program tree now looks like this:\n\n![image](images/pg178_2.jpg)\n\
    \n![image](images/pg178_3.jpg)\n\nfavicon.ico\n\n32px x 32px\n\n![image](images/pg178_4.jpg)\n\
    \npower.png 100px x 25px\n\nSeveral of the image files are cover shots of various\
    \ books whose ISBN (International Standard Book Number) is used as the respective\
    \ cover image file name. The `img` directory also contains a company logo image,\
    \ and a label to identify the web server.\n\nThe style sheet contains rules to\
    \ specify the appearance of a web page response that will be written dynamically\
    \ by the program:\n\n| `img, p` | `{ float: left }` |\n\n| `p` | `{ width: 320px\
    \ ; text-align: center ; font-size: 1.5em }` |\n\n![image](images/pg179_1.jpg)\n\
    \nstyle.css\n\nThe HTML document named `index.html` is a simple static web page\
    \ displaying the website icon, a page heading and a label:\n\n```html\n<!DOCTYPE\
    \ HTML>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<title>Index</title>\n\
    <link rel=\"shortcut icon\" href=\"favicon.ico\">\n</head>\n<body>\n<h1>Static\
    \ Web Page</h1>\n<img src=\"img/power.png\" alt=\"Power\">\n</body>\n</html>\n\
    ```\n\n![image](images/pg179_2.jpg)\n\nindex.html\n\nThe HTML document named `form.html`\
    \ allows the user to submit a single text value to the web server:\n\n```html\n\
    <!DOCTYPE HTML>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<title>Submission\
    \ Form</title>\n<link rel=\"shortcut icon\" href=\"favicon.ico\">\n</head>\n<body>\n\
    <fieldset>\n  <legend>Book Lookup</legend>\n  <form method=\"POST\" action=\"\
    lookup\">\n  <label>Programming Language</label>\n    <input name=\"Language\"\
    \ type=\"text\" value=\"\">\n    <input type=\"submit\" value=\"Submit\" >\n \
    \ </form>\n</fieldset>\n<img src=\"img/power.png\" alt=\"Power\">\n</body>\n</html>\n\
    ```\n\n![image](images/pg179_2.jpg)\n\nform.html\n\n![image](images/hot.jpg)\n\
    \nThe `POST` method will be tested by the server; the `lookup` value will identify\
    \ a form handler function; and the `Language` value will identify the submitted\
    \ value.\n\n## Deliver a Static Page\n\nThe Go standard library `net/http` package\
    \ provides three functions that allow a web server to easily respond to all HTTP\
    \ requests with the contents of a nominated file system.\n\n![image](images/pg180_1.jpg)\n\
    \nThe path of the root file directory is first specified as the argument to an\
    \ `http.Dir()` function. This returns a `Dir` type that is then specified as the\
    \ argument to an `http.FileServer()` function. This, in turn, returns a handler\
    \ to respond to all HTTP requests with contents from the nominated root file directory.\n\
    \nFinally, an `http.Handle()` function is used to register the handler. This requires\
    \ two arguments to specify a route pattern and the handler’s name. Typically,\
    \ the pattern `/` is used as the first argument – to match all request paths.\n\
    \nThe web browser can now request any document by name from within the nominated\
    \ root file directory. If the file name is omitted from the request, the server\
    \ will automatically seek a document named `index.html` to deliver to the browser.\n\
    \n![image](images/1o.jpg)At the start of the main function, insert a statement\
    \ to nominate the root directory of files to serve `dir := http.Dir(\"C:/Users/mike_/go/src/server/htdocs\"\
    )`\n\n![image](images/commono.jpg)\n\nsrc\\server\\main.go\n\n![image](images/2o.jpg)Next,\
    \ create a request handler for that file system\n\n```go\nfileServer := http.FileServer(dir)\n\
    ```\n\n![image](images/3o.jpg)Now, register the handler for all HTTP requests\n\
    \n```go\nhttp.Handle(\"/\", fileServer)\n```\n\n![image](images/4o.jpg)Save the\
    \ updated program, then start the server and visit `localhost:8000/index.html`\n\
    \n![image](images/5o.jpg)\n\n## Log Data\n\nHaving successfully delivered a static\
    \ page, the `http.Request` object has `ParseForm()` method that populates form\
    \ values.\n\n![image](images/pg181.jpg)Begin by adding instructions to import\
    \ the Go library strings, os, and log packages into the program\n\n```go\nimport\
    \ (\n\t\"fmt\"\n\t\"io\"\n\t\"log\"\n\t\"net/http\"\n\t\"os\"\n\t\"strings\"\n\
    )\n```\n\n![image](images/commono.jpg)\n\nsrc\\server\\main.go\n\nNext, in the\
    \ main function, register a form handler with a route argument that will recognize\
    \ the name assigned to the form’s action attribute\n\n```go\nhttp.HandleFunc(\"\
    /lookup\", formHandler)\n```\n\n![image](images/hot.jpg)Go provides constants\
    \ for each HTTP status code, such as 200 with `http.StatusOk`. See the documentation\
    \ at [golang.org/pkg/net/http](http://www.golang.org/pkg/net/http) for the full\
    \ list of codes.\n\n![image](images/3o.jpg)After the main function, begin the\
    \ form handler with validation that checks the submission method\n\n```go\n{\n\
    \tif r.Method != \"POST\" {\n\t\thttp.Error(w, \"Method Not Allowed\", 405)\n\t\
    \treturn\n\t}\n\t// Statements to be inserted here\n}\n```\n\nNext, in the form\
    \ handler, insert statements to parse the form data or return an error message\
    \ to the browser\n\n```go\nerr := r.ParseForm()\nif err != nil {\n\thttp.Error(w,\
    \ \"Bad Request\", 400)\n\treturn\n}\n```\n\nSubmitted form values can be formatted\
    \ using the Go strings package to trim spaces and change case\n\n```go\nlang :=\
    \ r.FormValue(\"Language\")\nlang = strings.ToLower(strings.Trim(lang, \" \"))\n\
    ```\n"
