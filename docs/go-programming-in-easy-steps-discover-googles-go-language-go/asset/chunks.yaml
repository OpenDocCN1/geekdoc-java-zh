    \nThe `strings` package also has a `ToTitle()` function that requires a single\
    \ string argument. This function will return a copy of the string with the first\
    \ character of each word converted to an uppercase letter – but only when the\
    \ string argument is all lowercase. If you want to convert a string of mixed-case\
    \ letters to title case you must first convert it to lowercase using the `strings`\
    \ package’s `ToLower()` function.\n\nWhen a program receives user input following\
