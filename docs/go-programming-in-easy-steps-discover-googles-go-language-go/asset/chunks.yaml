    \ operator after the block.\n- A closure is a function nested inside an outer\
    \ function that retains access to variables declared in the outer function.\n\
    - The `type` keyword followed by a name and function signature can be used to\
    \ create a custom function type.\n- Passing functions to other functions allows\
    \ actions to be modified without repeating existing lines of code.\n- Go programming\
    \ allows you to handle errors that arise in functions by returning separate values.\n\
    - Only imported functions and variables whose names begin with a capital letter\
    \ will be accessible to the importing file.\n\n# 6 Build Structures\n\nThis chapter\
    \ demonstrates how data and functions can be contained in a “struct” that can\
    \ represent object-oriented programming in the Go language.\n\n- [Group Data]\n\
    - [Attach Methods]\n- [Embed Structs]\n- [Encapsulate Features]\n- [Compose Elements]\n\
    - [Satisfy Interfaces]\n- [Embed Interfaces]\n- [Summary]\n\n## Group Data\n\n\
    Multiple related items of any data type can be grouped together in a Go language\
    \ “struct” (structure) type. This is useful to create records, similar to those\
    \ you might find in a database.\n\n![image](images/pg82_1.jpg)\n\nA struct is\
    \ created using the `type` keyword, followed by a name of your choice, and the\
    \ `struct` keyword followed by `{}` curly brackets. The curly brackets contain\
    \ a list of variable name and data type pairs on individual lines. These are known\
    \ as the “fields” of the struct and define what the struct will contain, with\
    \ this syntax:\n\n```go\ntype structName struct {\n    fieldName dataType\n  \
    \  fieldName dataType\n}\n```\n\nHaving defined a struct type, instances of the\
    \ struct can be created as variables declared with the name of the struct as their\
    \ type:\n\n```go\nvar instanceName structName\n```\n\nIndividual fields of a struct\
    \ are addressed by appending the field name to the struct name using dot-suffixing.\
    \ Data can be assigned to individual fields of the struct instance in several\
    \ ways. Firstly, you can assign values to individual fields, like this:\n\n```go\n\
    instanceName.fieldName = value\ninstanceName.fieldName = value\n```\n\nAlternatively,\
    \ you can initialize all its fields in a single statement that assigns a “struct\
    \ literal” to an instance, like this:\n\n```go\ninstanceName = structName { value,\
    \ value }\n```\n\nUsing this technique requires the values to be listed in the\
    \ same order as the fields in the struct, but you can include field names in the\
    \ struct literal so the values may appear in any order, like this:\n\n```go\n\
    instanceName = structName { fieldName: value, fieldName: value }\n```\n\nAdditionally,\
    \ you can create a struct instance and initialize all its fields in a single statement\
    \ that assigns a “struct literal” to a variable, like this:\n\n```go\ninstanceName\
    \ := structName { fieldName: value, fieldName: value }\n```\n\nEmpty fields in\
    \ a struct get a zero value by default.\n\n![image](images/hot.jpg)\n\nYou can\
    \ think of a struct as a template whose instances are copies that can hold actual\
    \ data.\n\n![image](images/snake.jpg)\n\nAlthough these two statements are similar,\
    \ notice that the `:=` operator is used only when creating an instance and initializing\
    \ the struct fields in a single statement.\n\n![image](images/1bl.jpg) Start a\
    \ program by creating a struct type\n\n```go\ntype employee struct {\n    id int\n\
    \    name string\n    dept string\n}\n```\n\n![image](images/commonb.jpg)\n\n\
    `src\\group\\main.go`\n\n![image](images/2bl.jpg) Next, begin the main function\
    \ by creating an instance of the struct type\n\n```go\nvar coder employee\n```\n\
    \n![image](images/3bl.jpg) Now, assign values to each field of the struct instance\n\
    \n```go\ncoder.id = 001\ncoder.name = \"Alice\"\ncoder.dept = \"I.T.\"\n```\n\n\
    ![image](images/4bl.jpg) Create a second instance of the struct, which initializes\
    \ each field of the struct using a struct literal and field names\n\n```go\nclerk\
    \ := employee{ name: \"Burt\", dept: \"Payroll\", id: 002 }\n```\n\n![image](images/5bl.jpg)\
    \ Add statements to display all values in struct\n\n```go\nfmt.Println(coder)\n\
    fmt.Println(clerk)\n```\n\n![image](images/6bl.jpg) Finally, add statements to\
    \ display individual field values in a string\n\n```go\nfmt.Printf(\"%v works\
    \ in %v\\n\", coder.name, coder.dept)\nfmt.Printf(\"%v works in %v\\n\", clerk.name,\
    \ clerk.dept)\n```\n\n![image](images/7bl.jpg) Note that the statement in Step\
    \ 4 does not assign field values in the same order the fields are listed in struct.\n\
    \n## Attach Methods\n\n![image](images/pg84_1.jpg)\n\nIn Go programming, functions\
    \ can be attached to structs by adding a “receiver” to the function signature,\
    \ which specifies a parameter name and the struct name as its type:\n\n```go\n\
    func (paramName structName) funcName()\n```\n\nA function that is attached to\
    \ a struct is referred to as a “method” of that struct. The method can be specified\
    \ as a value receiver, which operates on a copy of the struct, or as a pointer\
    \ receiver that operates on the original struct:\n\n```go\nfunc (paramName structName)\
    \ funcName()\n```\n\nThis ability enables structs to represent real-world objects\
    \ that have attributes and behaviors:\n\n- Attributes describe the features an\
    \ object has.\n- Behaviors describe actions that an object can perform.\n\nFor\
    \ example, a car might be described with attributes of “blue” and “coupe”, along\
    \ with an “accelerate” behavior. These features could be represented in Go programming\
    \ with a `car` struct containing field properties of color and body, along with\
    \ an attached `accelerate()` method.\n\n![image](images/pg84_2.jpg) Objects are\
    \ created in Go programming by defining a struct as a template from which different\
    \ copies, or “instances”, can be made. Each instance of the struct can be customized\
    \ by assigning attribute values and behaviors to describe that object.\n\n![image](images/forget.jpg)\
    \ Unlike some other programming languages, Go does not have classes, but can represent\
    \ objects using structs instead.\n\n![image](images/1bl.jpg) Start a program by\
    \ creating a struct type\n\n```go\ntype car struct {\n    color string\n    body\
    \ string\n}\n```\n\n![image](images/commonb.jpg)\n\n`src\\method\\main.go` Next,\
    \ attach a method to the struct type\n\n```go\nfunc (c car) accelerate() string\
    \ {\n    return \"accelerating-->\"\n}\n```\n\n![image](images/3bl.jpg) Now, begin\
    \ the main function by creating two instances of the struct type\n\n```go\nporsche\
    \ := car{ color: \"blue\", body: \"coupe\" }\n```\n"
  raw: '•A function can be declared using the func keyword followed by a name that
    adheres to the Go naming conventions.


    •A function declaration contains ( ) parentheses, followed by { } curly brackets
    to surround the statements to be executed.


    •The parentheses in a function declaration may contain a parameters list that
    specifies the type of each parameter.


    •Arguments passed to a function are, by default, passed by value – a copy of the
    original value.


    •Pointer arguments passed to a function are a reference to a memory address that
    is the location of the original value.


    •The return keyword allows one, or more, values to be returned to the caller after
    a function has executed its statements.


    •If a function returns values to the caller, each return type must be listed after
    the parameter list in the function declaration.


    •A function can call itself recursively to emulate a loop structure, but must
    test a condition to exit at some point.


    •Go supports first class functions that can be assigned to variables, passed as
    arguments, and returned from functions.


    •An anonymous function has no name and can be made self-invoking by appending
    the ( ) call operator after the block.


    •A closure is a function nested inside an outer function that retains access to
    variables declared in the outer function.


    •The type keyword followed by a name and function signature can be used to create
    a custom function type.


    •Passing functions to other functions allows actions to be modified without repeating
    existing lines of code.


    •Go programming allows you to handle errors that arise in functions by returning
    separate values.


    •Only imported functions and variables whose names begin with a capital letter
    will be accessible to the importing file.


    6


    Build Structures


    ***This chapter demonstrates how data and functions can be contained in a “struct”
    that can represent object-oriented programming in the Go language.***


    [**Group Data**](#chapter06.xhtml_sec39)


    [**Attach Methods**](#chapter06.xhtml_sec40)


    [**Embed Structs**](#chapter06.xhtml_sec41)


    [**Encapsulate Features**](#chapter06.xhtml_sec42)


    [**Compose Elements**](#chapter06.xhtml_sec43)


    [**Satisfy Interfaces**](#chapter06.xhtml_sec44)


    [**Embed Interfaces**](#chapter06.xhtml_sec45)


    [**Summary**](#chapter06.xhtml_sec46)


    **Group Data**


    Multiple related items of any data type can be grouped together in a Go language
    “struct” (structure) type. This is useful to create records, similar to those
    you might find in a database.


    ![image](images/pg82_1.jpg)


    A struct is created using the type keyword, followed by a name of your choice,
    and the struct keyword followed by **{ }** curly brackets. The curly brackets
    contain a list of variable name and data type pairs on individual lines. These
    are known as the “fields” of the struct and define what the struct will contain,
    with this syntax:


    type ***structName*** struct **{**


    ***fieldName dataType***


    ***fieldName dataType***


    **}**


    Having defined a struct type, instances of the struct can be created as variables
    declared with the name of the struct as their type:


    var ***instanceName structName***


    Individual fields of a struct are addressed by appending the field name to the
    struct name using dot-suffixing. Data can be assigned to individual fields of
    the struct instance in several ways. Firstly, you can assign values to individual
    fields, like this:


    ***instanceName*.*fieldName* = *value***


    ***instanceName*.*fieldName* = *value***


    Alternatively, you can initialize all its fields in a single statement that assigns
    a “struct literal” to an instance, like this:


    ***instanceName* = *structName* { *value*, *value* }**


    Using this technique requires the values to be listed in the same order as the
    fields in the struct, but you can include field names in the struct literal so
    the values may appear in any order, like this:


    ***instanceName* = *structName* { *fieldName* : *value*, *fieldName* : *value*
    }**


    Additionally, you can create a struct instance and initialize all its fields in
    a single statement that assigns a “struct literal” to a variable, like this:


    ***instanceName* := *structName* { *fieldName* : *value*, *fieldName* : *value*
    }**


    Empty fields in a struct get a zero value by default.


    ![image](images/hot.jpg)


    You can think of a struct as a template whose instances are copies that can hold
    actual data.


    ![image](images/snake.jpg)


    Although these two statements are similar, notice that the **:=** operator is
    used only when creating an instance and initializing the struct fields in a single
    statement.


    ![image](images/1bl.jpg)Start a program by creating a struct type


    **type employee struct {**


    **id int**


    **name string**


    **dept string**


    **}**


    ![image](images/commonb.jpg)


    src\group\main.go


    ![image](images/2bl.jpg)Next, begin the main function by creating an instance
    of the struct type


    **var coder employee**


    ![image](images/3bl.jpg)Now, assign values to each field of the struct instance


    **coder.id = 001**


    **coder.name = “Alice”**


    **coder.dept = “I.T.”**


    ![image](images/4bl.jpg)Create a second instance of the struct, which initializes
    each field of the struct using a struct literal and field names


    **clerk := employee{ name: “Burt”, dept: “Payroll”, id: 002 }**


    ![image](images/5bl.jpg)Add statements to display all values in each struct group


    **fmt.Println( coder )**


    **fmt.Println( clerk )**


    ![image](images/6bl.jpg)Finally, add statements to display individual field values
    in a string


    **fmt.Printf( “\n%v works in %v \n”, coder.name, coder.dept )**


    **fmt.Printf( “\n%v works in %v \n”, clerk.name, clerk.dept )**


    ![image](images/7bl.jpg)Save the program file in a “group” directory, then run
    the program to see the struct field values


    ![image](images/pg83_1.jpg)


    ![image](images/forget.jpg)


    Note that the statement in Step 4 does not assign field values in the same order
    the fields are listed in the struct, but using field names ensures that values
    get assigned to the correct field.


    **Attach Methods**


    ![image](images/pg84_1.jpg)


    In Go programming, functions can be attached to structs by adding a “receiver”
    to the function signature, which specifies a parameter name and the struct name
    as its type:


    func **( *paramName structName* ) *funcName*( )**


    A function that is attached to a struct is referred to as a “method” of that struct.
    The method can be specified as a value receiver, which operates on a copy of the
    struct, or as a pointer receiver that operates on the original struct fields:


    ***func* ( *paramName* **structName* ) *funcName*( )**


    This ability enables structs to represent real-world objects that have attributes
    and behaviors:


    •Attributes describe the features that an object has.


    •Behaviors describe actions that an object can perform.


    For example, a car might be described with attributes of “blue” and “coupe”, along
    with an “accelerate” behavior.


    These features could be represented in Go programming with a **car** struct containing
    field properties of color and body, along with an attached accelerate( ) method.


    ![image](images/pg84_2.jpg)


    Objects are created in Go programming by defining a struct as a template from
    which different copies, or “instances”, can be made.


    Each instance of the struct can be customized by assigning attribute values and
    behaviors to describe that object.


    ![image](images/forget.jpg)


    Unlike some other programming languages, Go does not have classes, but can represent
    objects using structs instead.


    ![image](images/1bl.jpg)Start a program by creating a struct type


    **type car struct {**


    **color string**


    **body string**


    **}**


    ![image](images/commonb.jpg)


    src\method\main.go


    ![image](images/2bl.jpg)Next, attach a method to the struct type


    **func ( c car ) accelerate( ) string {**


    **return “accelerating-->”**


    **}**


    ![image](images/3bl.jpg)Now, begin the main function by creating two instances
    of the struct type


    **porsche := car{ color: “blue”, body: “coupe” }**'
