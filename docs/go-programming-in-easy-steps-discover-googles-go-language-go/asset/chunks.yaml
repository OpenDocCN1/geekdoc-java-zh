  trans: "\n\n![image](img/2b.jpg)接下来，在指定位置创建并初始化带有默认字符串值和 `Time` 数据类型的变量\n\n`zone\
    \ := “All”`\n\n`loc, _ := time.LoadLocation( “America/New_York” )`\n\n`dt := time.Now(\
    \ ).In( loc )`\n\n![image](img/3b.jpg)确定时区缩写和偏移量秒数，然后将偏移量转换为正分钟数\n\n`abbr, offset\
    \ := dt.Zone( )`\n\n`if offset < 1 {`\n\n`offset = offset * -1`\n`}`\n\n`offset\
    \ /= 60`\n\n![image](img/4b.jpg)现在，评估缩写和偏移量值\n\n`switch {`\n`case abbr == “EST”\
    \ && offset == 300 :`\n`zone = “East Coast”`\n`case abbr == “EDT” && offset ==\
    \ 240 :`\n`zone = “East Coast”`\n`}`\n\n![image](img/5b.jpg)显示时区详情和适当的消息\n\n`fmt.Printf(\
    \ “\\nTZ: %v Offset Minutes: %v \\n”, abbr, offset )`\n`fmt.Println( “Welcome\
    \ to”, zone, “Visitors!” )`\n\n![image](img/6b.jpg)在“zone”目录中保存程序文件，然后运行程序查看时区值\n\
    \n![image](img/pg121_1.jpg)\n\n![image](img/forget.jpg)\n\n这里使用 `_` 空白标识符是为了由于空间限制忽略返回的错误值，但理想情况下你应该包含一个错误处理器。\n\
    \n### 延迟时间\n\nGo 标准库 `time` 包提供了一个 `Sleep( )` 函数，允许你通过指定的持续时间延迟程序的进度。持续时间作为参数传递给\
    \ `Sleep( )` 函数，并可以表示为 `time` 包常量的乘法。例如，`5 * time.Second` 表示五秒钟的持续时间。\n\n![image](img/pg122_1.jpg)\n\
    \nGo 标准库 `time` 包还提供了三个方法，用于将 `Time` 数据类型的实例与作为参数指定的另一个时间进行比较。这些方法将根据时间比较的结果分别返回布尔值\
    \ true 或 false：\n\n| 方法 | 返回 |\n| :--- | :--- |\n| `Before(time)` | 如果实例时间早于其参数时间，返回布尔值\
    \ `true` |\n| `After(time)` | 如果实例时间晚于其参数时间，返回布尔值 `true` |\n| `Equal(time)` |\
    \ 如果实例时间和参数时间代表同一时刻（即使在不同的时区），则返回布尔值 `true` |\n\n如果你想查看两个 `Time` 数据类型实例之间的差异，可以使用时间实例的\
    \ `Sub( )` 方法并指定另一个时间实例作为其参数。该方法将两个瞬间之间的经过持续时间以纳秒精度的 `int64` 数据类型值的形式返回。\n\n通常更倾向于展示精度小于纳秒的持续时间段，因此\
    \ Go 标准库 `time` 包包含一个 `Round( )` 方法来指定更简洁的精密度。该方法需要一个参数来确定你偏好的舍入行为。通常，该参数作为 `time`\
    \ 包常量之一进行提供。例如，调用 `Round( time.Millisecond )` 方法将把纳秒精度的持续时间舍入到最近的毫秒，`Round( time.Second\
    \ )` 将把纳秒精度的持续时间舍入到最近的秒，依此类推。\n\n![image](img/1b.jpg)首先在程序中导入 Go 标准库 `time` 包\n\
    \n```go\nimport (\n\t“fmt”\n\t“time”\n)\n```\n\n![image](img/commons.jpg)\n\n\
    src\\delay\\main.go\n\n![image](img/2b.jpg)接下来，创建并显示 `Time` 数据类型的组件\n\n`start\
    \ := time.Now( )`\n\n`fmt.Println( “\\nStarted At:”, start.Format( “03:04:05”\
    \ ) )`\n\n![image](img/3b.jpg)现在，延迟程序的进度五秒\n\n`time.Sleep( 5 * time.Second )`\n\
    \n![image](img/4b.jpg)然后，创建并显示第二个 `Time` 数据类型\n\n`finish := time.Now( )`\n\n`fmt.Println(\
    \ “\\nFinished At:”, finish.Format( “03:04:05” ) )`\n\n![image](img/5b.jpg)比较开始和结束时间\n\
    \n`fmt.Println( “\\nStart First?:”, start.Before( finish ) )`\n`fmt.Println( “Finish\
    \ First?:”, finish.Before( start ) )`\n\n![image](img/6b.jpg)最后，显示延迟的长度\n\n`diff\
    \ := finish.Sub( start )`\n\n`fmt.Println( “\\nTime Elapsed:”, diff.Round( time.Second\
    \ ) )`\n\n![image](img/7b.jpg)在“delay”目录中保存程序文件，然后运行程序查看时间延迟\n\n![image](img/pg123_1.jpg)\n\
    \n![image](img/hot.jpg)\n\n延迟执行的能力在暂停单个“goroutine”（协程）时特别有用——更多详情请参见示例此处 。\n\n\
    ### 总结\n\n- Go 标准库 `time` 包包含创建由日期、时间和时区字段构成的 `Time` 数据类型的函数。\n- `Time` 实例可以与作为参数指定的另一个时间进行比较。\n\
    - `time` 包提供了用于创建包含日期、时间、时区字段的 `Time` 数据类型的函数。\n- `Sub( )` 方法返回两个瞬间之间的经过持续时间，以纳秒精度的\
    \ `int64` 数据类型值返回。\n- `Round( )` 方法用于指定更简洁的精密度。\n- `Sleep( )` 函数允许你通过指定的持续时间延迟程序的进度。\n\
    - `time` 包提供了 `Before(time)`、`After(time)` 和 `Equal(time)` 方法来比较时间实例。\n- `Time`\
    \ 数据类型包含日期、时间和时区字段。\n- 使用 `time` 包的常量（如 `time.Second`）可以表示持续时间。\n- `LoadLocation(\
    \ )` 函数用于加载位置信息。\n- `Zone( )` 方法返回时区缩写和偏移量。\n- `Format( )` 方法用于格式化时间输出。\n\n"
- fmt: "\nThe Go standard library strings package contains useful functions for string\
    \ manipulation. Its `Join() ` function joins (concatenates) all elements of a\
    \ string array to create a single united string. This function requires two arguments\
    \ to specify the name of a string array and a separator value to be placed between\
    \ each string element in the united string. Typically, you will specify a single\
    \ space as the separator to create a space-separated united string.\n\nThe `fmt.Printf()`\
    \ and `fmt.Println()` functions that write to standard output can add spaces and\
    \ newline characters to output, but do not change the actual strings. They do,\
    \ however, both return two values, which are the number of bytes written and any\
    \ write error. If no error is encountered, the error value will be `nil` as usual.\
    \ With the English language, the number of bytes written will normally represent\
    \ the number of characters output – including non-printing characters contained\
    \ within the string.\n\n![image](images/hot.jpg)\n\nThe ASCII code number for\
    \ a non-printing `\\t` tab character is 9, and for a non-printing `\\n` newline\
    \ character is 10.\n\n![image](images/1r.jpg)Begin by importing the Go standard\
    \ library strings package into a program\n\n```go\nimport (\n\t\"fmt\"\n\t\"strings\"\
    \n)\n```\n\n![image](images/commonr.jpg)\n\n`src\\join\\main.go`\n\n![image](images/2r.jpg)Initialize\
    \ two string variables and a concatenated string\n\n```go\ns1, s2 := \"The Truth\
    \ is rarely Pure \", \"and never Simple.\"\nstr := s1 + s2\n```\n\n![image](images/3r.jpg)Next,\
    \ output the concatenated string and its length\n\n```go\nchars, err := fmt.Printf(\"\
    \\n%v \\n\", str)\nif err != nil {\n\tfmt.Println(err)\n} else {\n\tfmt.Println(\"\
    Bytes Written: \", chars)\n\tfmt.Println(\"String Length:\", len(str))\n}\n```\n\
    \n![image](images/4r.jpg)Initialize a string array and a joined string\n\n```go\n\
    arr := []string {\"\\n\\tStrive\", \"For\", \"Greatness!\"}\nast := strings.Join(arr,\
    \ \" \")\n```\n\n![image](images/5r.jpg)Now, output the joined string and first\
    \ two characters\n\n```go\nfmt.Println(ast)\nif ast[0] == 10 && ast[1] == 9 {\n\
    \tfmt.Printf(\"1st Char: ASCII %v Newline\\n\", ast[0])\n\tfmt.Printf(\"2nd Char:\
    \ ASCII %v Tab\\n\", ast[1])\n}\n```\n\n![image](images/6r.jpg)Save the program\
    \ file in a “join” directory, then run the program to see the united strings\n\
    \n![image](images/pg127_1.jpg)\n\n![image](images/forget.jpg)\n\nThe number of\
    \ bytes written here exceeds the string length because the `fmt.Printf()` method\
    \ adds two newline characters and one space character.\n\n# Split Strings\n\n\
    ![image](images/pg128_1.jpg)\n\nThe Go standard library strings package provides\
    \ several functions that allow a specified string to be separated into substrings.\
    \ These functions treat the string like an array in which each element contains\
    \ a character or a space.\n\nFrequently, you may want to separate a space-separated\
    \ sentence into an array of substrings that are each individual words. The strings\
    \ package conveniently provides a `Fields()` function that will perform that very\
    \ task. This function requires the string sentence as its sole argument, and will\
    \ return an array of substrings containing each individual word from that string.\n\
    \nThe strings package has a `Split()` function that requires two arguments to\
    \ specify a string and a separator. This function will return an array of substrings\
    \ that exist between occurrences of the specified separator. For example, when\
    \ the string is a space-separated sentence and the separator is a space character,\
    \ the `Split()` function will return an array of words within that sentence.\n\
    \nThe strings package also has a `SplitN()` function that works just like the\
    \ `Split()` function, but accepts a third argument to specify how many substrings\
    \ to return. Subsequent occurrences of the specified separator will simply be\
    \ returned in the final substring if the specified number of substrings exceeds\
    \ the number of separators. For example, when the string is a space-separated\
    \ sentence, the separator is a space character, and only two substrings are specified,\
    \ the `SplitN()` function will return a substring containing the first word in\
    \ the sentence and a substring containing the entire remainder of that sentence\
    \ including spaces.\n\nIt is important to recognize that the `Fields()`, the `Split()`,\
    \ and the `SplitN()` functions discard the specified separator and only include\
    \ the characters around the separator in the returned substrings. There are, however,\
    \ two further functions that allow you to also include the separators in the returned\
    \ substrings.\n\nThe strings package’s `SplitAfter()` function works like the\
    \ `Split()` function, but includes the separator in the returned substrings. Similarly,\
    \ the strings package’s `SplitAfterN()` function works like the `SplitN()` function,\
    \ but includes the separator in the returned substrings.\n\n![image](images/hot.jpg)\n\
    \nData is often stored as Comma-Separated Values in CSV files, which can be usefully\
    \ split into individual values.\n\n![image](images/1r.jpg)Begin by importing the\
    \ Go standard library strings package into a program\n\n```go\nimport (\n\t\"\
    fmt\"\n\t\"strings\"\n)\n```\n\n![image](images/commonr.jpg)\n\n`src\\split\\\
    main.go`\n\n![image](images/2r.jpg)Start the main function by initializing a string\n\
    \n```go\nstr := \"I can, and I will.\"\n```\n\n![image](images/3r.jpg)Next, add\
    \ statements to pass a description and substrings of the variable to a listing\
    \ function\n\n```go\nlist(\"Fields\", strings.Fields(str))\nlist(\"Split\", strings.Split(str,\
    \ \",\"))\nlist(\"SplitN\", strings.SplitN(str, \",\", 2))\nlist(\"SplitAfter\"\
    , strings.SplitAfter(str, \",\"))\nlist(\"SplitAfterN\", strings.SplitAfterN(str,\
    \ \",\", 2))\n```\n\n![image](images/4r.jpg)After the main function, add the function\
    \ to list the description and all substrings upon call\n\n```go\nfunc list(desc\
    \ string, subs []string) {\n\tfmt.Print(\"\\n\", desc, \": \")\n\tfor _, v :=\
    \ range subs {\n\t\tfmt.Print(\"[\", v, \"] \")\n\t}\n\tfmt.Print(\"\\n\")\n}\n\
    ```\n\n![image](images/5r.jpg)Save the program file in a “split” directory, then\
    \ run the program to see the substrings\n\n![image](images/pg129_1.jpg)\n\n![image](images/forget.jpg)\n\
    \nOnly split methods that contain the word “After” in their name will retain the\
    \ separators.\n\n# Find Characters\n\n![image](images/pg130_1.jpg)\n\nThe Go standard\
    \ library strings package provides several functions that allow a specified string\
    \ to be searched to find a specified character or substring (pattern). These functions\
    \ treat the string as an array in which each element contains a character or a\
    \ space.\n\nThe strings package has a `Contains()` function that requires two\
    \ arguments to specify a string and a pattern to find. This function will simply\
    \ return true or false to indicate the result of a (case-sensitive) search. For\
    \ example, to search for a “Pro” pattern:\n\n`strings.Contains(\"Go Programming\
    \ in easy steps\", \"Pro\")`\n\nThe strings package also has an `Index()` function\
    \ that requires two arguments to specify a string and a pattern to find. This\
    \ function will return an integer that is the index position of the first instance\
    \ of the pattern in the searched string if the search succeeds, otherwise it will\
    \ return -1 when the search fails.\n\nThe strings package’s `Count()` function\
    \ requires two arguments to specify a string and a pattern to find. You can use\
    \ this function to discover how many non-overlapping instances of a pattern occur\
    \ in a searched string. If the pattern is an empty string, this function will\
    \ normally return 1 plus the number of characters in the searched string. This\
    \ allows you to determine the number of characters in a searched string by deducting\
    \ 1 from the returned integer.\n\nThe strings package’s `HasPrefix()` function\
    \ requires two arguments to specify a string and a pattern to find. This function\
    \ will return **true** or **false** to indicate whether the searched string begins\
    \ with the specified pattern.\n"
