    7


    Create Arrays


    ***This chapter demonstrates how to store multiple items of data in indexed elements
    within a Go program.***


    [**Create a Basic Array**](#chapter07.xhtml_sec47)


    [**Loop Through Elements**](#chapter07.xhtml_sec48)


    [**Slice Arrays**](#chapter07.xhtml_sec49)


    [**Make Slices**](#chapter07.xhtml_sec50)


    [**Slices Versus Arrays**](#chapter07.xhtml_sec51)


    [**Map Keys and Values**](#chapter07.xhtml_sec52)


    [**Summary**](#chapter07.xhtml_sec53)


    **Create a Basic Array**


    An array is a variable that can store multiple items of data – unlike a regular
    variable, which can only store one piece of data. The pieces of data are stored
    sequentially in array “elements” that are numbered, starting at zero. So, the
    first value is stored in element zero, the second value is stored in element one,
    and so on.


    ![image](images/pg98_1.jpg)


    An empty array can be declared using the var keyword followed by a name of your
    choice, followed by [ ] square brackets surrounding an integer specifying the
    number of required elements. These must then be followed by the data type the
    elements can contain. The syntax of the declaration looks like this:


    **var *arrayName* [ *nElements* ] *dataType***


    Values can then be individually assigned to each available element by stating
    the element number in square brackets:


    ***arrayName* [ *elementNumber* ] = *value***


    Alternatively, an array can be declared and initialized with values by stating
    values for each element in an “array literal” – a comma-separated list, grouped
    within braces:


    ***arrayName* := [ *nElements* ] *dataType* { *value*, *value*, *value* }**


    Any individual element’s value can be referenced using the array name followed
    by square brackets containing the element number. For example, to reference the
    value within the first element:


    ***arrayName* [ 0 ]**


    Collectively, the elements of an array are known as an “index”. Arrays can have
    more than one index – to represent multiple dimensions, rather than the single
    dimension of a regular array. Multi-dimensional arrays of three indices and more
    are uncommon, but two-dimensional arrays are useful to store grid-based information,
    such as coordinates.


    To create a two-dimensional array, simply add a second pair of [ ] square brackets
    specifying the number of required elements, like this:


    **var *arrayName* [ *nElements* ] [ *nElements* ] *dataType***


    Values can then be individually assigned to each available element by stating
    the element numbers in square brackets:


    ***arrayName* [ *elementNumber* ] [ *elementNumber* ] = *value***


    ![image](images/forget.jpg)


    Array numbering starts at zero – so the final element in an array of six elements
    is number five, not number six. This numbering is known as a “zero-based index”.


    ![image](images/snake.jpg)


    You can only store data within array elements of the data type specified in the
    array declaration.


    Alternatively, a two-dimensional array can be initialized and values assigned
    to each element when it is declared by stating values for each index in array
    literals:


    ***arrayName* := [ *nElements* ] [ *nElements* ] *dataType***


    **{ { *value* , *value* , *value* } , { *value* , *value* , *value* } }**


    Any individual element’s value can be referenced using the array name followed
    by square brackets containing the element numbers for each index. For example,
    the first element of the second index:


    ***arrayName* [ 0 ] [ 1 ]**


    ![image](images/1v.jpg)Create an empty array of three elements that can each only
    contain string values


    **var cars [ 3 ]string**


    ![image](images/commonv.jpg)


    src\array\main.go


    ![image](images/2v.jpg)Next, add statements to initialize each array element


    **cars[ 0 ] = “BMW”**


    **cars[ 1 ] = “Ford”**


    **cars[ 2 ] = “Opel”**


    ![image](images/3v.jpg)Now, declare and initialize a two-dimensional array


    **coords := [ 2 ][ 3 ]int { { 1, 2, 3 } , { 4, 5, 6 } }**


    ![image](images/4v.jpg)Then, add statements to display output containing stored
    array element values


    **fmt.Println( “Cars:”, cars )**


    **fmt.Println( “Second Car:”, cars[ 1 ] )**


    **fmt.Println( “X1,Y1:”, coords[ 0 ] [ 0 ] )**


    **fmt.Println( “X2,Y3:”, coords[ 1 ] [ 2 ] )**


    ![image](images/pg99_2.jpg)


    ![image](images/5v.jpg)Save the program file in a “array” directory, then run
    the program to see the values stored within array elements


    ![image](images/pg99_3.jpg)


    ![image](images/snake.jpg)


    An array in Go programming is of a fixed size – once created, you cannot add or
    remove elements.


    **Loop Through Elements**


    Loops and arrays are perfect partners. A loop can be used to fill each element
    in an empty array with a value, and can iterate through each element in an array
    to reference the stored values.


    ![image](images/pg100_1.jpg)


    A traditional incrementing for loop can set an initial counter variable value
    at zero, and place that variable within an array variable’s [ ] square brackets
    to represent the index number of each element as the loop proceeds.


    Go has a built-in len( ) function that accepts an array variable as its argument,
    and returns an integer that is the number of elements contained in the array.
    This can be used in a traditional for loop to exit the loop when it reaches the
    array’s final element.


    ![image](images/1v.jpg)Create an empty integer array of five elements


    **var arr [ 5 ]int**


    ![image](images/commonv.jpg)


    src\elems\main.go


    ![image](images/2v.jpg)Next, add a statement to confirm the array size


    **fmt.Println( “No. of Elements:”, len( arr ) )**


    ![image](images/3v.jpg)Now, add a loop to fill each element


    **for i := 0 ; i < len( arr ) ; i++ {**


    **arr[ i ] = i * i**


    **}**


    ![image](images/4v.jpg)Then, add a loop to reference each array element value


    **for i := 0 ; i < len( arr ) ; i++ {**


    **fmt.Printf( “Index: %v Value: %v \n”, i, arr[ i ] )**


    **}**


    ![image](images/5v.jpg)Save the program file in an “elems” directory, then run
    the program to see the values stored within array elements


    ![image](images/pg100_2.jpg)


    ![image](images/forget.jpg)


    An array index is zero-based, so the final fifth element here is index number
    4.


    Go provides a couple of special features that you can use with arrays. Firstly,
    when declaring an array variable with an array literal, you can use the … wildcard
    operator to set the number of elements equal to the number of values in the array
    literal:


    **arr := [ … ]int { 10, 20, 30 }                 // len( arr ) == 3.**


    You can even specify which element each value should be stored in by stating the
    index number for each value, like this:


    **arr := [ … ]int { 2: 10, 0: 20, 1: 30 }      // arr == [ 20, 30, 10 ].**


    Secondly, you can use the range keyword in a loop to iterate over an array and
    return the index number and value of each element.'
