    | `math.SqrtPi` | The square root of Pi, with an approximate value of 1.77246\
    \ |\n| `math.SqrtPhi` | The square root of Phi, with an approximate value of 1.27202\
    \ |\n| `math.Ln2` | The natural logarithm of 2, with an approximate value of 0.69315\
    \ |\n| `math.Log2E` | The base-2 logarithm of constant *e*, with an approximate\
    \ value of 1.44269 |\n| `math.Ln10` | The natural logarithm of 10, with an approximate\
    \ value of 2.30259 |\n| `math.Log10E` | The base-10 logarithm of constant *e*,\
    \ with an approximate value of 0.43429 |\n\nThe math constants are mostly used\
    \ in Go programs that have a particular mathematical purpose, but all the math\
