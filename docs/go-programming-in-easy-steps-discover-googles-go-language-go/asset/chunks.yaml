    \n11\n\n# 使用并发\n\n*本章演示了如何使用 goroutine（协程）和通道（channels）在 Go 程序中执行任务的并发执行。*\n\n\
    - 创建 goroutine\n- 持续等待\n- 制作通道\n- 缓冲通道\n- 选择通道\n- 同步 goroutine\n- 使用工作池\n- 总结\n\
    \n## 创建 goroutine\n\nGo 程序像用其他编程语言编写的程序一样，通常按顺序逐行执行代码。但 Go 编程还支持“goroutine”，它允许代码行能够并发地、并排地执行。这是许多人选择\
    \ Go 编程的重要原因之一。\n\n![image](img/pg158_1.jpg)\n\n并发提供了利用多核处理器的潜力，但区分并发（concurrency）与并行（parallelism）的区别至关重要：\n\
    \n- **并行**是指两个任务在完全同一时刻执行。例如，在多核处理器上，当一个核心正在执行某个任务，而另一个核心同时执行另一个不同的任务。然而，这对于逐行执行的程序代码来说很难实现的。\n\
    \n![image](img/pg158_2.jpg)\n\n- **并发**是将程序代码拆分为多个独立执行的任务，这些任务可能同时运行并产生正确的最终结果。因此，一个并发程序是可以被并行化的程序。Goroutine\
    \ 在 Go 程序代码中提供了这种能力。\n\n![image](img/pg158_3.jpg)\n\n![image](img/pg158_4.jpg)\n\
    \nGoroutine 是可以并发执行的轻量级线程。带有多个函数调用的顺序执行程序会按顺序执行每个函数，但带有 goroutine 的并发程序允许多个函数同时处于激活状态。\n\
    \n通过在普通函数调用或方法调用之前插入 `go` 关键字即可创建一个 goroutine。任务执行的顺序由 Go 调度器内部决定。\n\n![image](img/1p.jpg)从开始向程序导入标准库\
    \ `time` 包，允许 goroutine 执行\n\n```go\nimport (\n\"fmt\"\n\"time\"\n)\n```\n\n![image](img/common.jpg)goroutine.main\n\
    \n```go\nfunc count(item string) {\n    for i := 1; i <= 3; i++ {\n        fmt.Printf(\"\
    %v \", i, item)\n        time.Sleep(1 * time.Second)\n    }\n}\n```\n\n![image](img/2p.jpg)现在，在\
    \ main 函数中添加函数调用以顺序执行\n\n```go\nfmt.Println(\"\\nLine-by-Line Execution...\")\n\
    count(\"moose\")\ncount(\"sheep\")\n```\n\n![image](img/3p.jpg)然后，在 main 函数中添加\
    \ goroutine 和普通函数调用以并发执行\n\n```go\nfmt.Println(\"\\nConcurrent Execution...\"\
    )\ngo count(\"moose\")\ncount(\"sheep\")\n```\n\n![image](img/4p.jpg)将程序保存在“goroutine”目录中，然后运行程序查看不同的输出\n\
    \n![image](img/pg159_1.jpg)\n\n![image](img/hot.jpg)你也可以从自身函数启动 goroutine\n\n\
    ![image](img/snake.jpg)\n\n默认情况下，程序会在主 goroutine 完成时退出——无论是否有任何 goroutine 尚未完成。\n\
    \n## 持续等待\n\nGo 程序经常包含 goroutine，因此 Go 标准库 `sync` 包提供了一个 `WaitGroup` 类型，用于等待一组\
    \ goroutine 完成。\n\n![image](img/pg160_1.jpg)\n\nWaitGroup 实例以通常的方式创建，使用如下语法：\n\
    \n```go\nvar waitgroupName sync.WaitGroup\n```\n\nWaitGroup 只是一个计数器，可以记录运行中的 goroutine\
    \ 总数。它拥有以下方法用于阻塞程序直到所有 goroutine 完成：\n\n- `Add()` 根据指定的参数增加 WaitGroup 计数器。每向程序添加一个新的\
    \ goroutine，计数器应该加一。\n- `Done()` 自动将 WaitGroup 计数器减一，不需要参数。当每个 goroutine 完成时，计数器减一。\n\
    - `Wait()` 阻塞程序直到 WaitGroup 计数器变为零，不需要参数。当最后一个运行的 goroutine 将计数器减为零时，阻塞会自动移除。\n\
    \n将 WaitGroup 作为参数传递给函数时，必须以指针传递。这意味着参数将指定其内存地址（使用 `&` 取地址运算符），函数参数将使用 `*` 前缀运算符将其标记为指针。接收函数可以使用指针参数调用\
    \ WaitGroup 的 `Done()` 方法。\n\n在实际创建 goroutine 的语句之前，应该调用 `Add()` 方法来增加 WaitGroup\
    \ 计数器。\n\n"
- fmt: "\nOptionally, the `Add() ` method argument can specify the total number of\
    \ goroutines in a collection, rather than incrementing each added goroutine to\
    \ the `WaitGroup` counter individually.\n\nYou can reuse a `WaitGroup` to control\
    \ execution of a subsequent collection of goroutines, but you can only call the\
    \ `Add() ` method for these after the `Wait() ` method for the previous collection\
    \ has reached zero.\n\n![image](images/forget.jpg)\n\nThe order in which goroutines\
    \ get executed is controlled by the Go scheduler, and can vary each time the program\
    \ runs.\n\n![image](images/1p.jpg)Begin by importing the Go standard library `sync`\
    \ and `time` packages, to wait for goroutines and to allow a delay\n\n```go\n\
    import (\n\t\"fmt\"\n\t\"sync\"\n\t\"time\"\n)\n```\n\n![image](images/commonp.jpg)\n\
    \n`src\\waitgroup\\main.go`\n\n![image](images/2p.jpg)Next, in the `main` function,\
    \ create a `WaitGroup` instance\n\n```go\nvar wg sync.WaitGroup\n```\n\n![image](images/3p.jpg)Now,\
    \ add a loop to increment the counter and pass the address of the `WaitGroup`\
    \ as a function argument\n\n```go\nfor i := 1 ; i <= 3 ; i++ {\n\twg.Add( 1 )\n\
    \tgo report ( i, &wg )\n}\n```\n\n![image](images/4p.jpg)Finally, in the `main`\
    \ function, block until the `WaitGroup` counter reaches zero\n\n```go\nwg.Wait()\n\
    ```\n\n![image](images/5p.jpg)Now, add a function to confirm the start and end\
    \ of each goroutine, then notify the `WaitGroup` to stop waiting\n\n```go\nfunc\
    \ report( i int, wg *sync.WaitGroup) {\n\tfmt.Printf( \"\\nGoroutine %v Started\"\
    , i )\n\ttime.Sleep( 1 * time.Second )\n\tfmt.Printf( \"\\n\\t\\t\\tGoroutine\
    \ %v Ended\", i )\n\twg.Done()\n}\n```\n\n![image](images/6p.jpg)Save the program\
    \ file in a “waitgroup” directory, then run the program to see the program wait\
    \ for the goroutines\n\n![image](images/pg161_1.jpg)\n\n![image](images/hot.jpg)\n\
    \nYou could instead use `defer wg.Done()` at the start of the function to ensure\
    \ the Waitgroup gets notified of completion.\n\n### Make Channels\n\nGoroutines\
    \ allow code to be executed concurrently in an independent manner, but you can\
    \ enable goroutines to communicate with each other by the use of “channels”.\n\
    \n![image](images/pg162_1.jpg)\n\nA Go `channel` is like a pipe through which\
    \ you can send a message or receive a message. It is important to recognize that\
    \ the sending and receiving actions are “blocking” operations – when sending a\
    \ message, the channel will wait until the receiver is ready to accept the message,\
    \ and when receiving a message, the channel will wait until the sender actually\
    \ delivers the message.\n\nChannels are created by specifying the `chan` keyword\
    \ and a data type as arguments to the built-in `make()` function, like this:\n\
    \n```go\nchannelName := make( chan *dataType )\n```\n\nYou can send a value to\
    \ the channel using an `<-` operator to direct a value into the channel, with\
    \ this syntax:\n\n```go\nchannelName <- message\n```\n\nConversely, you can receive\
    \ a value from a channel using the `<-` operator to direct a value into a variable,\
    \ with this syntax:\n\n```go\nvariableName <- channelName\n```\n\nIt is important\
    \ to ensure that a receiver is not left waiting for a message that will never\
    \ arrive. This would cause a fatal error called “deadlock” – where the program\
    \ can never proceed. To avoid this situation, the sender can specify the channel\
    \ name as an argument to a built-in `close()` function to explicitly close the\
    \ channel when it will not send any more messages.\n\nThe receiver can, optionally,\
    \ receive a second value that is a boolean that is true when the channel is open,\
    \ and false when the channel is closed.\n\n```go\nvariableName, channelOpenState\
    \ <- channelName\n```\n\nThis can be used to examine the channel state, and is\
    \ useful to exit a loop containing a receiver after a channel has definitely closed.\n\
    \n![image](images/snake.jpg)\n\nOnly a sender should close a channel – never use\
    \ a receiver to close a channel in case the sender hasn’t finished.\n\n![image](images/1p.jpg)Begin\
    \ by importing the Go standard library `time` package, to allow a delay and get\
    \ a current time\n\n```go\nimport (\n\t\"fmt\"\n\t\"time\"\n)\n```\n\n![image](images/commonp.jpg)\n\
    \n`src\\channel\\main.go`\n\n![image](images/2p.jpg)Next, in the `main` function,\
    \ create a channel for strings\n\n```go\nc := make( chan string )\n```\n\n![image](images/3p.jpg)Add\
    \ a goroutine that passes a string value and channel\n\n```go\ngo count( \"Message\"\
    , c )\n```\n\n![image](images/4p.jpg)Now, add a loop containing a channel receiver\
    \ that will print received messages until the channel gets closed\n\n```go\nfor\
    \ {\n\tmsg, open := <- c\n\tif !open {\n\t\tbreak\n\t}\n\tfmt.Println( msg )\n\
    }\n```\n\n![image](images/5p.jpg)Now, add the function with a loop containing\
    \ a channel sender that will send messages at 1-second intervals, then close the\
    \ channel when the loop ends\n\n```go\nfunc count( msg string, c chan string )\
    \ {\n\tfor i := 0; i < 3; i++ {\n\t\tc <- msg + \" \" + time.Now().Format(\"15:04:05\"\
    )\n\t\ttime.Sleep( 1 * time.Second )\n\t}\n\tclose(c )\n}\n```\n\n![image](images/6p.jpg)\n\
    \n### Buffer Channels\n\nChannels are, by default, “unbuffered”. This means that\
    \ you can only send a message if there exists a corresponding receiver; if the\
    \ receiver is simply in the same function, the sender will block.\n\nYou can refer\
    \ [here](#chapter8) for more on buffering.\n\nYou can overcome this limitation\
    \ by including a second argument to the `make()` function, to specify a buffer\
    \ size. This allows you to send multiple items to the channel as a queue, and\
    \ it will only block when the buffer is exceeded.\n\nThe `range` keyword can be\
    \ used in a loop to receive each message sent until the channel is closed.\n\n\
    **Select Channels**\n"
