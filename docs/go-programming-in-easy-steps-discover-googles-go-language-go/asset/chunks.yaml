    type parrot struct { }\nfunc ( parrot ) speak( ) string {\n    return “Squawk,\
    \ squawk!”\n}\nfunc ( parrot ) move( ) string {\n    return “A parrot flies away.”\n\
    }\n```\n\n![image](img/hot.jpg)\n\n注意，你可以省略接收者中的参数名称，只需说明结构体名称，除非你需要在方法语句中使用参数名称。\n\
    \n![image](img/3bl.jpg)现在，创建另一个空结构体并附加同样满足接口的方法\n\n```go\ntype chicken struct\
    \ { }\nfunc ( chicken ) speak( ) string {\n    return “Cluck, cluck!”\n}\nfunc\
    \ ( chicken ) move( ) string {\n    return “Chickens cannot fly.”\n}\n```\n\n\
    ![image](img/4bl.jpg)添加一个接收接口的函数并调用实现的方法\n\n```go\nfunc nudge( b ) {\n    fmt.Printf(\
    \ “\\n%v \\n”, b.speak( ) )\n    fmt.Printf( “%v \\n\\n”. b.move( ) )\n}\n```\n\
    \n![image](img/5bl.jpg)添加一个 main 函数，创建每个结构体的实例，然后调用它们同名的方法\n\n```go\nfunc main(\
    \ ) {\n    var bird1 parrot\n    var bird2 chicken\n    nudge( bird1 )\n    nudge(\
    \ bird2 )\n}\n```\n\n![image](img/6bl.jpg)将程序文件保存在“poly”目录中，然后运行程序查看不同的输出\n\n\
    ![image](img/pg93_1.jpg)\n\n![image](img/pg93_2.jpg)\n\nGo 自动识别接口的实现。\n\n### 嵌入接口\n\
    \n正如结构体可以嵌入，接口也可以。理解接口嵌入很有帮助，许多标准库都使用了这种技术。例如，`io` 包包含一个 `ReadCloser` 接口，它嵌入了\
    \ `Reader` 和 `Closer` 接口。\n\n```go\ntype bird interface {\n    speak( ) string\n\
    \    move( ) string\n}\n\ntype human interface {\n    speak( ) string\n    move(\
    \ ) string\n}\n\ntype creature interface {\n    bird\n    human\n}\n```\n\nsrc\\\
    abstr\\main.go\n\n接下来，创建一个嵌入前两个接口的接口\n\n```go\ntype parrot struct { }\nfunc (\
    \ parrot ) speak( ) string {\n    return “Squawk, squawk!”\n}\nfunc ( parrot )\
    \ move( ) string {\n    return “A parrot flies away.”\n}\n```\n\n**parrot** 类型的实例将调用第\
    \ 3 步的方法。\n\n现在，添加另一个空结构体并附加满足（第一个和）第二个接口——因此满足第三个接口\n\n```go\ntype person struct\
    \ { }\nfunc ( person ) speak( ) string {\n    return “Hi, there!”\n}\nfunc ( )\
    \ move( ) string {\n    return “A person walks away.”\n}\n```\n\n```go\nfunc nudge(\
    \ c creature ) {\n    fmt.Printf( “\\n%v \\n”, c.speak( ) )\n    fmt.Printf( “%v\
