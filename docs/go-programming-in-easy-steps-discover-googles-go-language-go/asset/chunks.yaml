    reference pointing to an underlying array element


    **fmt.Printf( “Pointer weekend: %p \n”, weekend )**


    **fmt.Printf( “Address days[0]: %p \n”, &days[ 5 ] )**


    ![image](images/6v.jpg)Save the program file in a “slice” directory, then run
    the program to see the features of a slice


    ![image](images/pg103_1.jpg)


    ![image](images/hot.jpg)


    See that the type of a slice is described by empty [ ] square brackets followed
    by the type each element may contain.


    **Make Slices**


    ![image](images/pg104_1.jpg)


    A slice can be created in the same way as an array, except without specifying
    any number of elements between [ ] square brackets, and can be initialized with
    a “slice literal”, using this syntax:


    ***sliceName* := [ ] *dataType* { *value*, *value*, *value* }**


    You can also create an empty slice using a built-in make( ) function, whose arguments
    specify the slice type, slice length, and (optionally) the slice capacity. Values
    can then be assigned to individual elements, like this:


    **fruitSlice := make( [ ]string , 3 )**


    **fruitSlice[ 0 ] = “Apple”**


    **fruitSlice[ 1 ] = “Banana” fruitSlice[ 2 ] = “Cherry”**


    In either case, Go will internally create an underlying array of the appropriate
    length and capacity. You can add elements to a slice using a built-in append(
    ) function. This requires at least two arguments that specify the name of the
    slice and one or more additional element values. The function returns a new slice
    containing one or more additional elements, like this:


    **fruitSlice = append( fruitSlice, “Damson” )**


    Most importantly, when the length of the enlarged slice exceeds the capacity of
    the underlying array, Go will automatically increase the capacity of the underlying
    array to accommodate the elements.


    There is also a built-in copy( ) function that allows you to copy one slice into
    another. This requires two arguments that specify the name of the slice to copy
    into, and the name of the slice to copy from. It is useful to create an empty
    slice of the same length as the source slice, then copy content into it, like
    this:


    **jamSlice = make( [ ]string , len( fruitSlice ) )**


    **copy( jamSlice, fruitSlice )**


    If you want to remove an element from a slice, and preserve the order of the remaining
    elements, the copy( ) function can be used to slide all elements above a specified
    index number down by one position. Slices can be passed as arguments to functions
    by specifying a name and the slice type in the function signature.


