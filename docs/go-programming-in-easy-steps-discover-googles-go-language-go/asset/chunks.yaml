    ![image](images/pg11_2.jpg)


    **Create the Go Workspace**


    When you install Go, the installer sets a number of Go environment variables.
    For example, the directory (folder) location of the Go tools is stored in a GOROOT
    environment variable – by default, at C:\Go on a Windows PC, and at /usr/local/go
