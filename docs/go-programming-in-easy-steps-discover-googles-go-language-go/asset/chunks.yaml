    \ 函数将返回该句子中的单词数组。\n\nstrings 包还了 `SplitN()` 函数，它的工作方式与 `Split()` 函数相同，但接受第三个参数来指定返回多少个子字符串。如果指定的子字符串数量超过了分隔符的数量，则指定分隔符的后续出现将简单地位于最后一个子字符串中。例如，当字符串是一个由空格分隔的句子、分隔符是空格字符且仅指定了两个子字符串时，`SplitN()`\
    \ 函数将返回一个包含句子第一个单词的子字符串，以及一个包含句子剩余所有部分（包括空格）的子字符串。\n\n重要的是，`Fields()`、`Split()`\
    \ 和 `SplitN()` 函数会丢弃指定的分隔符，并在返回的子字符串中包含分隔符周围的字符。然而，还有两个额外的函数允许你在返回的子字符串中也包含分隔符。\n\
    \nstrings 包的 `SplitAfter()` 函数工作方式类似于 `Split()` 函数，但在返回的子字符串中包含了分隔符。同样，strings\
    \ 包的 `SplitAfterN()` 函数工作方式类似于 `SplitN()` 函数，但在返回的子字符串中包含了分隔符。\n\n![image](img/hot.jpg)\n\
    \n数据通常以逗号分隔值（CSV）的形式存储在 CSV 文件中，可以很好地拆分为单个值。\n\n![image](img/1r.jpg)首先在程序中导入 Go\
    \ 标准库 strings 包\n\n```go\nimport (\n\t\"fmt\"\n\t\"strings\"\n)\n```\n\n![image](img/commonr.jpg)\n\
    \n`src\\split\\main.go`\n\n![image](img/2r.jpg)通过初始化字符串来开始主函数\n\n```go\nstr :=\
    \ \"I can, and I will.\"\n```\n\n![image](img/3r.jpg)接下来，添加语句将描述和变量的子字符串传递给函数\n\
    \n```go\nlist(\"Fields\", strings.Fields(str))\nlist(\"Split\", strings.Split(str,\
    \ \",\"))\nlist(\"SplitN\", strings.SplitN(str, \",\", 2))\nlist(\"SplitAfter\"\
    , strings.SplitAfter(str, \",\"))\nlist(\"SplitAfterN\", strings.SplitAfterN(str,\
    \ \",\", 2))\n```\n\n![image](img/4r.jpg)在主函数之后，添加函数来列出描述和子字符串\n\n```go\nfunc\
    \ list(desc string, subs []string) {\n\tfmt.Print(\"\\n\", desc, \": \")\n\tfor\
    \ _, v := range subs {\n\t\tfmt.Print(\"[\", v, \"] \")\n\t}\n\tfmt.Print(\"\\\
    n\")\n}\n```\n\n![image](img/5r.jpg)将程序文件保存在“split”目录，然后运行程序查看子字符串\n\n![image](img/pg129_1.jpg)\n\
    \n![image](img/forget.jpg)\n\n只有名称中包含“After”的分割方法才会保留分隔符。\n\n# 查找字符\n\n![image](img/pg130_1.jpg)\n\
    \nGo 标准库 strings 包提供了几个函数，允许搜索指定的字符串以查找指定的字符或子字符串（模式）。这些函数将字符串视为一个数组，其中每个元素包含一个字符或空格。\n\
    \nstrings 包有一个 `Contains()` 函数，它需要两个参数来指定一个字符串和一个模式。该函数简单地返回 true 或 false 以表示（区分大小写的）搜索结果。例如，搜索“Pro”模式：\n\
    \n`strings.Contains(\"Go Programming in easy steps\", \"Pro\")`\n\nstrings 包还有一个\
    \ `Index()` 函数，需要两个参数。如果搜索成功，该函数将返回模式在搜索字符串中首次出现的索引位置整数；否则在搜索失败时将返回 -1。\n\nstrings\
    \ 包的 `Count()` 函数需要两个参数来指定一个字符串和一个模式。你可以使用此函数发现模式在搜索字符串中出现了多少次非重叠实例。如果模式为空字符串，此函数通常返回\
