    ![image](images/commong.jpg)


    src\arith\main.go


    ![image](images/2g.jpg)Begin a main.go program with package and import declarations


    **package main**


    **import “fmt”**


    ![image](images/3g.jpg)Add a main function that declares and initializes two variables


    **func main( ) {**


    **a := 8**


    **b := 4**


    **// Statements to be inserted here.**


    **}**


    ![image](images/4g.jpg)In the main function, insert statements to output the sum
    resulting value after each arithmetical operation


    **fmt.Println( “Addition:\t”, ( a + b ) )**


    **fmt.Println( “Subtraction:\t”, ( a - b ) )**


    **fmt.Println( “Multiplication:\t”, ( a * b ) )**


    **fmt.Println( “Division:\t”, ( a / b ) )**


    **fmt.Println( “Remainder:\t”, ( a % b ) )**


    ![image](images/5g.jpg)Now, insert statements to change the stored values and
    display their new value


    **a++**


    **fmt.Println( “Increment:\t”, a )**


    **b--**


    **fmt.Println( “Decrement\t”, b )**


    ![image](images/6g.jpg)Save the program file in the “arith” directory, then run
    the program to see the results of each operation


    ![image](images/pg35_2.jpg)


    ![image](images/forget.jpg)


    Here, the **\t** escape sequence is used to output a tab space to align the results.


    **Assign Values**


    ![image](images/pg36_1.jpg)


    The operators that are used in Go programming to assign values are listed in the
    table below. All except the simple **=** assignment operator are a shorthand form
    of a longer expression, so each equivalent is given for clarity:


    | **Operator** | **Example** | **Equivalent** |


    | **=** | **a = b** | **a = b** |


    | **+=** | **a += b** | **a = ( a + b )** |


    | **-=** | **a -= b** | **a = ( a - b )** |


    | ***=** | **a *= b** | **a = ( a * b )** |


    | **/=** | **a /= b** | **a = ( a / b )** |


    | **%=** | **a %= b** | **a = ( a % b )** |


    In the assignment example above, where a = b, the variable named “a” is assigned
    the value that is contained in the variable named “b” – so that is then the value
    stored in the a variable. Technically speaking, the assignment operator stores
    the value of the right-hand operand in the memory location denoted by the left-hand
    operand, then returns the value as a result.


    The += combined operator is useful to add a value onto an existing value that
    is stored in a variable. In the example above, where a += b, the value in variable
    b is added to that in variable a – so the total is then the value stored in the
    a variable. The arithmetic operation is performed first with the grouped operands.
    The result is then stored in the memory location denoted by the first variable
    and returned.


    All the other combined operators work in the same way by performing the arithmetical
    operation between the two values first, then assigning the result of that operation
    to the first variable – to become its new stored value.


    With the %= combined operator, the grouped left-hand operand a is divided by the
    grouped right-hand operand b, then the remainder of that operation is assigned
    to the a first variable.


    ![image](images/forget.jpg)


    The **+=** combined operator is dual-purpose – it can also be used to concatenate
    strings.


    ![image](images/snake.jpg)


    It is important to regard the **=** operator to mean “assign” rather than “equals”
    to avoid confusion with the **==** equality operator that is described [here](#chapter03.xhtml_sec17).


