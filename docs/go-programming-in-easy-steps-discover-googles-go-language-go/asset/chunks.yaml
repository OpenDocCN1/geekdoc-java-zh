  trans: "\n`else` 关键字和左大括号 `{` 必须与上一个语句块的右大括号 `}` 出现在同一行。\n\n![image](img/1p.jpg)用一个测试两个字符是否匹配的语句开始一个\
    \ main 函数。\n\n```go\nfunc main( ) {\n    if ‘A’ == ‘A’ {\n        fmt.Println(\
    \ “\\nCharacters Match” )\n    }\n    // 在此处插入语句。\n}\n```\n\n![image](img/commonp.jpg)\n\
    \nsrc\\ifelse\\main.go\n\n![image](img/2p.jpg)接下来，在 main 函数中插入嵌套语句来测试两个数值表达式。\n\
    \n```go\nif 5 > 1 {\n    if 7 > 2 {\n        fmt.Println( “\\nBoth expressions\
    \ are true” )\n    }\n}\n```\n\n![image](img/3p.jpg)现在，插入语句来测试数值表达式，并测试两个字符是否不匹配。\n\
    \n```go\nif 5 < 1 {\n    fmt.Println( “\\n1st Condition is true” )\n} else if\
    \ ‘A’ != ‘A’ {\n    fmt.Println( “\\n2nd Condition is true” )\n} else {\n    fmt.Println(\
    \ “\\nBoth Conditions are false” )\n}\n```\n\n![image](img/4p.jpg)将程序文件保存到“ifelse”目录中，然后运行程序以查看条件测试的结果。\n\
    \n![image](img/pg49_1.jpg)\n\n![image](img/forget.jpg)\n\n为了避免重复，从现在起列出的步骤代码假设你已经在每个程序的开头声明了\
    \ `package main` 和 `import “fmt”`。\n\n![image](img/hot.jpg)\n\n注意，如果第一个测试为 `false`，你可以使用\
    \ `else if` 来评估第二个表达式。\n\n### Switch Cases\n\n当测试表达式仅评估单个条件时，通过多个 `if else` 语句执行条件分支通常可以通过\
    \ `switch` 语句更高效地完成。\n\n![image](img/pg50_1.jpg)\n\n`switch` 语句的工作方式特殊。它接受一个给定值作为参数参数，然后从多个\
    \ `case` 语句中匹配该值。找到匹配时执行的代码包含在每个 `case` 语句中。\n\n每个要执行的语句必须单独出现在一行，从 `case` 语句下方的行开始。\n\
    \n可选情况下，`case` 语句列表后面可以跟一个最终的 `default` 语句，以指定在任何 `case` 语句中未找到匹配项时执行的代码。因此，`switch`\
    \ 语句的语法通常如下：\n\n```go\nswitch *test-value* {\ncase *match-value* :\n    statements-to-execute-when-matched\n\
    case *match-value* :\n    statements-to-execute-when-matched\ndefault:\n    statements-to-execute-if-no-match\n\
    }\n```\n"
- fmt: "\nAn alternative to the for loop described in the previous example [here](#chapter04.xhtml_iteration)\
    \ only contains a test expression after the `for` keyword – it does not include\
    \ an initializer or incrementer at the beginning of the loop statement. Instead,\
    \ it uses a counter variable that has already been initialized, and increments\
    \ the counter within the body of the loop. This is the Go equivalent of a “while”\
    \ loop in other programming languages, as the loop will continue iterating while\
    \ the test expression remains true. The incrementer must at some point render\
    \ the test expression false to end the loop, or an infinite loop will have been\
    \ created that will never end. The syntax of this type of for loop looks like\
    \ this:\n\n```\ninitializer\nfor test-expression {\n    statements-to-be-executed\n\
    \    incrementer\n}\n```\n\nA further variation of a loop structure in Go programming\
    \ allows you to even omit the test expression from the beginning statement and\
    \ use an infinite loop with a test expression contained in the loop body. It too\
    \ uses a counter variable that has already been initialized, and increments the\
    \ counter within the body of the loop. This is the Go equivalent of a “do-while”\
    \ loop in other programming languages, as the loop will execute its statements\
    \ and continue iterating while the test expression remains true. When the test\
    \ expression becomes false, the loop can be terminated using the `break` keyword,\
    \ so the syntax of this type of for loop looks like this:\n\n```\ninitializer\n\
    for {\n    statements-to-be-executed\n    incrementer\n    if test-expression\
    \ {\n        statements-to-be-executed\n        break\n    }\n}\n```\n\nNotice\
    \ that a “while” loop will not make a single iteration if the test expression\
    \ is false on its first evaluation, whereas a “do-while” loop will always make\
    \ at least one iteration because its statements are executed before the evaluation\
    \ is made.\n\n![image](images/hot.jpg)\n\nIn the event that a program runs an\
    \ infinite loop, on Windows or Linux systems press the `Ctrl` + `C` keyboard keys\
    \ to halt the loop execution.\n\n![image](images/1p.jpg)Begin a main function\
    \ with a loop that performs five iterations\n\n```\nfunc main( ) {\n    counter\
    \ := 1\n    for counter <= 5 {\n        fmt.Println( “Loop Iteration”, counter\
    \ )\n        counter++\n    }\n    // Statements to be inserted here.\n}\n```\n\
    \n![image](images/commonp.jpg)\n\nsrc\\while\\main.go\n\n![image](images/2p.jpg)Next,\
    \ insert an infinite loop statement\n\n```\ni := 10\nfor {\n    fmt.Println( “\\\
    t\\t\\tCountdown”, i )\n    i--\n    // Test expression to be inserted here.\n\
    }\n```\n\n![image](images/3p.jpg)Now, insert a test expression to end the loop\n\
    \n```\nif i < 1 {\n    fmt.Println( “\\t\\t\\t\\t\\tLift Off!” )\n    break\n\
    }\n```\n\n![image](images/4p.jpg)Save the program file in a “while” directory,\
    \ then run the program to see the output on each loop iteration\n\n![image](images/pg55_1.jpg)\n\
    \n![image](images/pg55_2.jpg)\n\n![image](images/forget.jpg)\n\nChange the initial\
    \ value of the `i` variable to `0` (zero) and run the program again to see the\
    \ first iteration of the loop get executed.\n\n### Break Out of Loops\n\nThe `break`\
    \ keyword can be used to prematurely terminate any loop when a specified condition\
    \ is met. The `break` statement is situated inside the loop statement block and\
    \ is preceded by a test expression. When the test returns true, the loop ends\
    \ immediately and the program proceeds on to the next task. For example, in a\
    \ nested inner loop it proceeds to the next iteration of the outer loop.\n\n![image](images/pg56_1.jpg)\n\
    \nThe `continue` keyword can be used to skip a single iteration of a loop when\
    \ a specified condition is met. The `continue` statement is situated inside the\
    \ loop statement block and is preceded by a test expression. When the test returns\
    \ true, that single iteration ends.\n\n![image](images/1p.jpg)Begin a main function\
    \ with a loop that performs three iterations\n\n```\nfunc main( ) {\n    for i\
    \ := 1 ; i <= 3 ; i++ {\n        // Inner Loop to be inserted here.\n    }\n}\n\
    ```\n\n![image](images/commonp.jpg)\n\nsrc\\break\\main.go\n\n![image](images/2p.jpg)Insert\
    \ an inner loop that performs three iterations\n\n```\n// Statements to be inserted\
    \ here.\nfor j := 1 ; j <= 3 ; j++ {\n    fmt.Println( “Running i=”, i, “j=”,\
    \ j )\n}\n```\n\n![image](images/3p.jpg)Save the program file in a “break” directory,\
    \ then run the program to see the output on each loop iteration\n\n![image](images/pg56_2.jpg)\n\
    \n![image](images/hot.jpg)\n\nYou can also `break` to a label at a specific point\
    \ outside of nested code blocks – see an example of this [here](#chapter11.xhtml_sec81).\n\
    \n![image](images/4p.jpg)Next, insert this break statement at the very beginning\
    \ of the inner loop block, to break out of the inner loop\n\n```go\nif i == 2\
    \ && j == 2 {\n    fmt.Println( “Breaks When i=”, i, “and j=”, j )\n    break\n\
    }\n```\n\n![image](images/5p.jpg)Save the updated file, then run the program again\
    \ to see the inner loop terminate on its second iteration\n\n![image](images/pg57_1.jpg)\n\
    \n![image](images/6p.jpg)Now, insert this continue statement before the break\
    \ statement – to skip the second iteration of the inner loop\n\n```go\nif i ==\
    \ 3 && j == 2 {\n    fmt.Println( “Continues When i=”, i, “and j=”, j )\n    continue\n\
    }\n```\n\n![image](images/7p.jpg)Save the updated file, then run the program once\
    \ more to see only the second iteration of the inner loop skipped\n\n![image](images/pg57_1.jpg)\n\
    \n![image](images/forget.jpg)\n\nHere, the `break` statement halts the second\
    \ and third iterations of the inner loop when the outer loop tries to run it for\
    \ the second time.\n\n![image](images/forget.jpg)\n\nHere, the `continue` statement\
    \ just skips the second iteration of the inner loop when the outer loop tries\
    \ to run it for the third time.\n\n### Go to Labels\n\nThe `goto` keyword at first\
    \ glance seems like a great feature, as it allows the program flow to jump to\
    \ a label at any position, much like a hyperlink on a web page. However, in reality\
    \ this can cause errors, its use is frowned upon, and it is generally considered\
    \ bad programming practice.\n\n![image](images/pg58_1.jpg)\n\nThe `goto` keyword\
    \ jump is a powerful feature that has existed in computer programs for decades,\
    \ but its power was abused by early programmers who created programs that jumped\
    \ around in an unfathomable manner. This produced unreadable program code, so\
    \ the use of goto became unpopular.\n\nTypically, the program might execute a\
    \ sequence of statements, then a `goto` statement would jump back to a label at\
    \ the beginning of the sequence to repeat their execution. Additionally, a condition\
    \ might be tested at some point during the sequence, and a further `goto` statement\
    \ might jump to a point after the sequence if the tested condition was not met.\
    \ In this way, the program code quickly gained lots of goto statements and labels.\n\
    \nOne possible valid use of the `goto` keyword is to break cleanly from an inner\
    \ nested loop by jumping to a label just after the end of its outer loop block.\
    \ This immediately exits both loops so no further iterations of either loop are\
    \ executed.\n\n![image](images/1p.jpg)Begin a main function with a loop that performs\
    \ three iterations\n\n```go\nfunc main( ) {\n    for i := 1 ; i <= 3 ; i++ {\n\
    \        // Inner Loop to be inserted here.\n    }\n}\n```\n\n![image](images/commonp.jpg)\n\
    \nsrc\\jump\\main.go\n\n![image](images/2p.jpg)Insert an inner loop that performs\
    \ three iterations\n\n```go\nfor j := 1 ; j <= 3 ; j++ {\n    fmt.Println( “Running\
    \ i=”, i, “j=”, j )\n}\n```\n\n![image](images/3p.jpg)Save the program file in\
    \ a “jump” directory, then run the program to see the output on each loop iteration\n\
    \n![image](images/pg59_1.jpg)\n\n![image](images/4p.jpg)Insert a statement as\
    \ the first line of the inner nested loop, to jump to a label named “end” at a\
    \ specified counter value\n\n```go\nif i == 2 && j == 2 {\n    goto end\n}\n```\n\
    \n![image](images/5p.jpg)Now, add the label on the next line after the closing\
    \ **}** brace of the outer loop\n\n```go\nend:\n```\n"
