  trans: "\n同样，`strings` 包的 `HasSuffix()` 函数需要两个参数，分别指定一个字符串和一个要查找的模式，并返回 true 或 false\
    \ 以表示搜索的字符串是否以指定的模式结尾。\n\n你可以使用 `strings` 包的 `Replace()` 函数通过将指定的模式替换为替换子字符串来修改搜索字符串。该函数需要四个参数，分别指定要搜索的字符串、要查找的模式、替换子字符串以及一个表示要替换次数的整数。如果你想替换搜索字符串中所有的模式实例，只需将替换次数指定为\
    \ `-1`。\n\n![image](img/forget.jpg)\n\n`strings.Index()` 函数在在搜索字符串中找到模式的第一个实例时停止搜索。\n\
    \n![image](img/1r.jpg)从向程序中导入 Go 标准库的 `strings` 包开始。\n\n```go\nimport (\n\t\"\
    fmt\"\n\t\"strings\"\n)\n```\n\n![image](img/commonr.jpg)\n\n`src\\find\\main.go`\n\
    \n![image](img/2r.jpg)通过初始化字符串变量来启动 main 函数。\n\n```go\nstr := \"I can resist everything\
    \ except temptation\"\n```\n\n![image](img/3r.jpg)接下来，测试子字符串是否存在于字符串，然后找到第一个实例的位置。\n\
    \n```go\nfmt.Printf(\"\\nFound ‘an’: %v \\n\", strings.Contains(str, \"an\"))\n\
    fmt.Printf(\"Found ‘an’ at: %v \\n\", strings.Index(str, \"an\"))\n```\n\n![image](img/4r.jpg)现在，统计字符串中某个字母出现的次数。\n\
    \n```go\nfmt.Printf(\"Count of ‘e’: %v \\n\", strings.Count(str, \"e\"))\n```\n\
    \n![image](img/5r.jpg)然后，测试字符串是否以特定的子字符串开头或结尾。\n\n```go\nfmt.Printf(\"Prefix ‘ion’:\
    \ %v \\n\", strings.HasPrefix(str, \"ion\"))\nfmt.Printf(\"Suffix ‘ion’: %v \\\
    n\", strings.HasSuffix(str, \"ion\"))\n```\n\n![image](img/6r.jpg)最后，替换字符串中的子字符串。\n\
    \n```go\nfmt.Println(strings.Replace(str, \"temptation\", \"chocolate\", 1))\n\
    ```\n\n![image](img/7r.jpg)将程序文件保存在“find”目录中，然后运行程序查看搜索结果。\n\n![image](img/pg131_1.jpg)\n\
    \n## 转换字符串\n\n![image](img/pg132_1.jpg)\n\nGo 标准库 strings 包提供了转换字符串字符大小的函数。\n\n\
    `strings` 包有一个 `ToUpper()` 函数，它需要一个字符串参数。该函数将简单地返回字符串的副本，将其所有字符都转换为大写字母。\n\n同样，`strings`\
    \ 包的 `ToLower()` 函数需要一个字符串参数，并返回字符串的副本，将其所有字符都转换为小写字母。\n\n`strings` 包还有一个 `ToTitle()`\
    \ 函数，它需要一个字符串参数。该函数将返回字符串的副本，将每个单词的首字母转换为大写字母——但仅当字符串参数全为小写时才有效。如果你想将一个大小写混合的字符串转换为标题格式，必须先使用\
    \ `strings` 包的 `ToLower()` 函数将其转换为小写。\n\n当程序在请求数值后接收到用户输入时，输入可能是字符串数据类型，并可能包含用户无意输入的空格。你可以使用\
    \ `strings` 包的 `Trim()` 函数删除字符串开头和结尾的空格。这需要两个参数来指定要删除的字符串和字符。要删除所有开头和结尾的空格，第二个参数将是\
    \ `\" \"` 以指定单个空格字符。\n\n一旦从包含输入数字的字符串中删除了不必要的空格，在程序可以在算运算中使用输入之前，必须将数据类型转换为数值类型。这可以通过导入\
    \ Go 标准库 `strconv` 包来实现。该包包含一个 `Atoi()` 函数（ASCII 转整数），它需要一个字符串参数，并返回一个整数和任何错误。如果没有遇到错误，错误值将为\
    \ `nil`；如果该方法无法返回整数数据类型，它将包含一个描述性错误消息。\n\n同样，`strconv` 包包含一个 `Itoa()` 函数，可以将整数转换为字符串数据类型。该方法只需要一个整数参数，并将返回一个字符串副本。\n\
    \n![image](img/hot.jpg)\n\n`strconv.ParseInt()` 方法也可用于将字符串类型转换为整数。`strconv.Atoi()`\
    \ 方法等于调用 `strconv.ParseInt(str, 10, 0)`。\n\n![image](img/1r.jpg)从向程序中导入 Go 标准库的\
    \ `strings` 包和 `strconv` 包开始。\n\n```go\nimport (\n\t\"fmt\"\n\t\"strings\"\n\t\
    \"strconv\"\n)\n```\n\n![image](img/commonr.jpg)\n\n`src\\conv\\main.go`\n\n![image](img/2r.jpg)通过初始化字符串变量启动\
    \ main 函数，然后显示不同字符大小的字符串。\n\n```go\nstr := \"I have Nothing to declare except\
    \ My Genius\"\nfmt.Println(strings.ToUpper(str))\nfmt.Println(strings.ToLower(str))\n\
    fmt.Println(strings.Title(strings.ToLower(str)))\n```\n\n![image](img/3r.jpg)现在，给变量赋值数字和空格。\n\
    \n```go\nstr = \" 42 \"\nfmt.Printf(\"%v Type: %T\\n\", str, str)\n```\n\n![image](img/4r.jpg)然后，从字符串中移除空格。\n\
    \n```go\nstr = strings.Trim(str, \" \")\n```\n\n![image](img/5r.jpg)最后，尝试将数据类型转换为整数。\n\
    \n````go\nnum, err := strconv.Atoi(str)\nif err != nil {\n\tfmt.Println(err)\n\
    } else {\n\tfmt.Printf(\"%v Type: %T\\n\", num, num)\n}\n```\n\n![image](img/6r.jpg)将程序文件保存在“conv”目录中，然后运行程序查看结果。\n\
    \n![image](img/pg133_1)\n\n## 计算面积\n\n![image](img/pg134.1)Go 标准库 math 包提供了许多实用的函数和常量。常量列在下表中，并带有它们的近似值：\n\
    \n| 常量 | 描述 |\n| :--- | :--- |\n| `math.E` | 常数 *e*，自然对数的底，近似值为 2.71828 |\n| `math.Pi`\
    \ | 常数 Pi，近似值为 3.14159 |\n| `math.Phi` | 常数 Phi（黄金比例），近似值为 1.61803 |\n| `math.Sqrt2`\
    \ | 2 的平方根，近似值为 1.41421 |\n| `math.SqrtE` | 常数 *e* 的平方根，近似值为 1.64872 |\n| `math.SqrtPi`\
    \ | Pi 的平方根，近似值为 1.77246 |\n| `math.SqrtPhi` | Phi 的平方根，近似值为 1.27202 |\n| `math.Ln2`\
    \ | 2 的自然对数，近似值为 0.69315 |\n| `math.Log2E` | 常数 *e* 的底为 2 对数，近似值为 1.44269 |\n\
    | `math.Ln10` | 10 的自然对数，近似值为 2.30259 |\n| `math.Log10E` | 常数 *e* 的底为 10 对数，近似值为\
    \ 0.43429 |\n\nmath 常量用于具有特定数学目的的 Go 程序，但为了完整性，上面列出了所有的 math 包常量。\n\n![image](img/hot.jpg)\n\
    \n黄金比例在几何和艺术中多次出现。它是被分成两个不同长度的线段的比例，其中长段与短段的长度之比等于全段与长段的长度之比。\n\n![image](img/pg134_2)\n"
- fmt: "\n![image](images/1r.jpg)Begin by importing the Go standard library math package\
    \ into a program\n\n```go\nimport (\n    \"fmt\"\n    \"math\"\n)\n```\n\n![image](images/commonr.jpg)\n\
    \nsrc\\area\\main.go\n\n![image](images/2r.jpg)Declare three floating-point variables\n\
    \n```go\nvar rad, area, perim float64\n```\n\n![image](images/3r.jpg)Next, initialize\
    \ the first variable and display its value to two decimal places\n\n```go\nrad\
    \ = 4\nfmt.Printf( \"\\nRadius of Circle: %.2f \\n”, rad )\n```\n\n![image](images/4r.jpg)Now,\
    \ calculate the area of a circle based on the given radius, then display the area\
    \ to two decimal places\n\n```go\narea = math.Pi * ( rad * rad )\nfmt.Printf(\
    \ \"\\nArea of Circle: %.2f \\n”, area )\n```\n\n![image](images/5r.jpg)Then,\
    \ calculate the perimeter of a circle based on the given radius, and display the\
    \ perimeter to two decimal places\n\n```go\nperim = 2 * ( math.Pi * rad )\nfmt.Printf(\
    \ \"\\nPerimeter of Circle: %.2f \\n”, perim )\n```\n\n![image](images/6r.jpg)Save\
    \ the program file in an “area” directory, then run the program to see the calculated\
    \ values\n\n![image](images/pg135_1.jpg)\n\n![image](images/forget.jpg)\n\nRefer\
    \ back [here](#chapter02.xhtml_sec10) for more on formatting decimal places in\
    \ output.\n\n# Evaluate Numbers\n\n![image](images/pg136_1.jpg)\n\nThe Go `math`\
    \ package provides these useful functions that can be used to evaluate `float64`\
    \ arguments:\n\n| **Function** | **Returns** |\n| :--- | :--- |\n| `math.Abs(\
    \ )` | An absolute value |\n| `math.Acos( )` | An arc cosine value |\n| `math.Asin(\
    \ )` | An arc sine value |\n| `math.Atan( )` | An arc tangent value |\n| `math.Atan2(\
    \ )` | An angle from an X-axis point |\n| `math.Ceil( )` | A rounded-up value\
    \ |\n| `math.Cos( )` | A cosine value |\n| `math.Exp( )` | An exponent of constant\
    \ *e* |\n| `math.Floor( )` | A rounded-down value |\n| `math.IsNaN( )` | A boolean\
    \ true or false value |\n| `math.Log( )` | A natural logarithm value |\n| `math.Max(\
    \ )` | The larger of two numbers |\n| `math.Min( )` | The smaller of two numbers\
    \ |\n| `math.Pow( )` | A power value |\n| `math.Round( )` | The nearest integer\
    \ value |\n| `math.Sin( )` | A sine value |\n| `math.Sqrt( )` | A square root\
    \ value |\n| `math.Tan( )` | A tangent value |\n\n![image](images/hot.jpg)\n\n\
    The `math.IsNan( )` function (Is-Not-a-number) is useful to discover whether a\
    \ value cast to the `float64` data type is indeed a number.\n\n![image](images/hot.jpg)\n\
    \nThe `math` package contains lots more functions but those listed here are useful\
    \ for many mathematical operations. Discover more in the Go documentation at [golang.org/pkg/math](http://www.golang.org/pkg/math)\n\
    \n![image](images/1r.jpg)Begin by importing the Go standard library math package\
    \ into a program\n\n```go\nimport (\n    \"fmt\"\n    \"math\"\n)\n```\n\n![image](images/commonr.jpg)\n\
    \nsrc\\maxmin\\main.go\n\n![image](images/2r.jpg)Next, initialize two variables\n\
    \n```go\nsquare := math.Pow( 5, 2 )// 5 to power 2 ( 5 x 5 ).\ncube := math.Pow(\
    \ 4, 3 )// 4 to power 3 ( 4 x 4 x 4 ).\n```\n\n![image](images/3r.jpg)Now, compare\
    \ the positive value of the variables and display the largest and smallest numbers\n\
    \n```go\nfmt.Println( \"\\nLargest Positive:\", math.Max( square, cube ) )\nfmt.Println(\
    \ \"\\nSmallest Positive:\", math.Min( square, cube ) )\n```\n\n![image](images/4r.jpg)Then,\
    \ add statements to reverse the numerical polarity of each variable – making positive\
    \ values into negative values\n\n```go\nsquare *= -1\ncube *= -1\n```\n\n![image](images/5r.jpg)Finally,\
    \ compare the negative value of the variables and display the largest and smallest\
    \ numbers\n\n```go\nfmt.Println( \"\\nLargest Negative:\", math.Max( square, cube\
    \ ) )\nfmt.Println( \"\\nSmallest Negative:\", math.Min( square, cube ) )\n```\n\
    \n![image](images/6r.jpg)Save the program file in a “maxmin” directory, then run\
    \ the program to see the compared values\n\n![image](images/pg137_1.jpg)\n\n![image](images/forget.jpg)\n\
    \nThe largest negative value is the one closest to zero.\n\n# Round Decimals\n\
    \n![image](images/pg138_1.jpg)\n\nThe Go standard library math package provides\
    \ a number of useful functions for rounding a decimal value to a near integer.\
    \ These functions are listed in the table below, together with a brief description\
    \ of each one:\n\n| **Function** | **Returns** |\n| :--- | :--- |\n| `math.Floor(\
    \ )` | The greatest integer less than *x* |\n| `math.Ceil( )` | The least integer\
    \ greater than *x* |\n| `math.Round( )` | The nearest integer to *x* |\n| `math.Trunc(\
    \ )` | The integer part of *x* |\n\nIf you want to reduce a floating-point value\
    \ to just two places, first multiply the value by 100, then use `math.Round( )`\
    \ to remove decimal places, then divide by 100. The Go language has a strong type\
    \ system that unlike other languages, does not support implicit casting. You can,\
    \ however, perform explicit type conversion, such as `float64` and `int`, using\
    \ the syntax `int(value)`. The `math.Round( )` function will round up from the\
    \ mid-point, so `Round( 7.5 )` returns `8`, not `7`.\n\n![image](images/1r.jpg)Begin\
    \ by importing the Go standard library math package into a program\n\n```go\n\
    import (\n    \"fmt\"\n    \"math\"\n)\n```\n\n![image](images/commonr.jpg)\n\n\
    src\\round\\main.go\n\n![image](images/2r.jpg)Initialize a floating-point variable\
    \ and display its value\n\n```go\nvar pi float64 = math.Pi\nfmt.Println( \"Pi:\"\
    , pi )\n```\n\n![image](images/3r.jpg)Next, display nearest integers to the floating-point\
    \ value\n\n```go\nfmt.Println( \"\\nFloor:\", math.Floor( pi ) )\nfmt.Println(\
    \ \"Ceiling:\", math.Ceil( pi ) )\nfmt.Println( \"Round:\", math.Round( pi ) )\n\
    fmt.Println( \"Truncated:\", math.Trunc( pi ) )\n```\n\n![image](images/4r.jpg)Now,\
    \ reduce the floating-point value to two places\n\n```go\nfmt.Println( \"\\nShort\
    \ Pi:\", math.Round( pi * 100 ) / 100 )\n```\n\n![image](images/5r.jpg)Finally,\
    \ initialize another floating-point variable and cast its value to an integer\
    \ variable\n\n```go\nvar e1 float64 = math.E\nfmt.Printf( \"\\nE: %v %T \\n\"\
    , e1, e1 )\nvar e2 int = int( e1 )\nfmt.Printf( \"Cast: %v %T \\n\", e2, e2 )\n\
    ```\n\n![image](images/6r.jpg)Save the program file in a “round” directory, then\
    \ run the program to see the rounded decimals\n\n# Generate Randoms\n\nThe Go\
    \ standard library math package contains a rand package that provides functions\
    \ to generate pseudo-random numbers. You can make this available to your program\
    \ by importing math/rand.\n\n![image](images/pg140_1.jpg)\n\nThe `rand.Intn( )`\
    \ function returns a random number from zero up to the number specified as its\
    \ argument. The `rand.Perm( )` function returns a sequence of integers, from zero\
    \ up to the number specified as its argument, in a pseudo-random order.\n"
