    ![image](images/pg135_1.jpg)


    ![image](images/forget.jpg)


    Refer back [here](#chapter02.xhtml_sec10) for more on formatting decimal places
    in output.


    Evaluate Numbers


    ![image](images/pg136_1.jpg)


    The Go **math** package provides these useful functions that can be used to evaluate
    **float64** arguments:


    | **Function** | **Returns** |


    | **math.Abs( )** | An absolute value |


    | **math.Acos( )** | An arc cosine value |


    | **math.Asin( )** | An arc sine value |


    | **math.Atan( )** | An arc tangent value |


    | **math.Atan2( )** | An angle from an X-axis point |


    | **math.Ceil( )** | A rounded-up value |


    | **math.Cos( )** | A cosine value |


    | **math.Exp( )** | An exponent of constant *e* |


    | **math.Floor( )** | A rounded-down value |


    | **math.IsNaN( )** | A boolean true or false value |


    | **math.Log( )** | A natural logarithm value |


    | **math.Max( )** | The larger of two numbers |


    | **math.Min( )** | The smaller of two numbers |


    | **math.Pow( )** | A power value |


    | **math.Round( )** | The nearest integer value |


    | **math.Sin( )** | A sine value |


    | **math.Sqrt( )** | A square root value |


    | **math.Tan( )** | A tangent value |


    ![image](images/hot.jpg)


    The **math.IsNan( )** function (Is-Not-a-number) is useful to discover whether
    a value cast to the **float64** data type is indeed a number.


    ![image](images/hot.jpg)


    The **math** package contains lots more functions but those listed here are useful
    for many mathematical operations. Discover more in the Go documentation at **[golang.org/pkg/math](http://www.golang.org/pkg/math)**


    ![image](images/1r.jpg)Begin by importing the Go standard library math package
    into a program


    **import (**


    **“fmt”


    “math”**


    **)**


    ![image](images/commonr.jpg)


    src\maxmin\main.go


    ![image](images/2r.jpg)Next, initialize two variables


    **square := math.Pow( 5, 2 )// 5 to power 2 ( 5 x 5 ).**


    **cube := math.Pow( 4, 3 )// 4 to power 3 ( 4 x 4 x 4 ).**


    ![image](images/3r.jpg)Now, compare the positive value of the variables and display
    the largest and smallest numbers


    **fmt.Println( “\nLargest Positive:”, math.Max( square, cube ) )**


    **fmt.Println( “\nSmallest Positive:”, math.Min( square, cube ) )**


    ![image](images/4r.jpg)Then, add statements to reverse the numerical polarity
    of each variable – making positive values into negative values


    **square *= -1**


    **cube *= -1**


    ![image](images/5r.jpg)Finally, compare the negative value of the variables and
    display the largest and smallest numbers


    **fmt.Println( “\nLargest Negative:”, math.Max( square, cube ) )**


    **fmt.Println( “\nSmallest Negative:”, math.Min( square, cube ) )**


    ![image](images/6r.jpg)Save the program file in a “maxmin” directory, then run
    the program to see the compared values


    ![image](images/pg137_1.jpg)


    ![image](images/forget.jpg)


    The largest negative value is the one closest to zero.


    Round Decimals


    ![image](images/pg138_1.jpg)


    The Go standard library math package provides a number of useful functions for
    rounding a decimal value to a near integer. These functions are listed in the
    table below, together with a brief description of each one:


    | **Function** | **Returns** |


    | **math.Floor( *x* )** | The greatest integer less than ***x*** |


    | **math.Ceil( *x* )** | The least integer greater than ***x*** |


    | **math.Round( *x* )** | The nearest integer to ***x*** |


    | **math.Trunc( *x* )** | The integer part of ***x*** |


    If you want to reduce a long floating-point value to just two decimal places,
    first multiply the floating-point value by 100, then use math.Round( ) to remove
    any remaining decimal places, then divide by 100 to return two decimal places.


    Procedures that multiply, operate, then divide can be written as individual steps,
    or parentheses can be used to determine the order in a single succinct expression.
    For example, commuting a long floating point value in a variable named “num” can
    be written as:


    **num = num * 100**


    **num = math.Round( num )**


    **num = num / 100**


    or alternatively as:


    **num = math.Round( num * 100 ) / 100**


    The Go programming language has a strong type system that unlike other programming
    languages, does not support type conversion (a.k.a. “casting”) implicitly. You
    can, however, perform explicit type conversion between compatible data types,
    such as float64 and int types using the syntax ***dataType*( *value* )** to convert
    a value to another data type. In converting a floating-point value to an integer,
    the value is truncated, losing the decimal places.


    ![image](images/hot.jpg)


    The **math.Round( )** function will round up from the mid-point, so **math.Round(
    7.5 )** returns **8**, not **7**.


    ![image](images/1r.jpg)Begin by importing the Go standard library math package
    into a program


    **import (**


    **“fmt”**


    **“math”**


    **)**


    ![image](images/commonr.jpg)


    src\round\main.go


    ![image](images/2r.jpg)Initialize a floating-point variable and display its value


    **var pi float64 = math.Pi**


    **fmt.Println( “Pi:”, pi )**


    ![image](images/3r.jpg)Next, display nearest integers to the floating-point value


    **fmt.Println( “\nFloor:”, math.Floor( pi ) )**


    **fmt.Println( “Ceiling:”, math.Ceil( pi ) )**


    **fmt.Println( “Round:”, math.Round( pi ) )**


    **fmt.Println( “Truncated:”, math.Trunc( pi ) )**


    ![image](images/4r.jpg)Now, reduce the floating-point value to two places


    **fmt.Println( “\nShort Pi:”, math.Round( pi * 100 ) / 100 )**


    ![image](images/5r.jpg)Finally, initialize another floating-point variable and
    cast its value to an integer variable


    **var e1 float64 = math.E**


    **fmt.Printf( “\nE: %v %T \n”, e1, e1 )**


    **var e2 int = int( e1 )**


    **fmt.Printf( “Cast: %v %T \n”, e2, e2 )**


    ![image](images/6r.jpg)Save the program file in a “round” directory, then run
    the program to see the rounded decimals


    ![image](images/pg139_1.jpg)


    Generate Randoms


    The Go standard library math package contains a rand package that provides functions
    to generate pseudo-random numbers. You can make this available to your program
    by importing math/rand.


    ![image](images/pg140_1.jpg)


    The rand.Intn( ) function returns a random number from zero up to the number specified
    as its argument. The rand.Perm( ) function returns a sequence of integers, from
    zero up to the number specified as its argument, in a pseudo-random order.'
