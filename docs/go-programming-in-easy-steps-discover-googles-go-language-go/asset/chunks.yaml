  trans: "\n本章演示了如何使用 Go 标准库中的 `time` 包处理日期和时间。\n\n## 获取日期\n\nGo 标准库的 `time` 包提供了功能，可以从\
    \ `Time` 数据类型中提取描述特定时间点的特定字段。通过导入 `time` 包，程序可以使用这些功能。\n\n![image](img/pg112_1.jpg)\n\
    \n可以使用 `time.Now()` 函数创建一个新的 `Time` 数据类型的日期/时间实例，其字段描述了当前的日期和时间。这些字段是根据设备上当前区域的系统时钟初始化的。\n\
    \n可以使用 `Time` 数据类型的相应方法来获取单个字段的值。例如，可以使用 `Year()` 方法获取年份字段的值。同样，还有 `Month()`、`Day()`\
    \ 和 `Weekday()` 方法，用于获取 `Time` 数据类型的其他单个字段。\n\n| **方法** | **返回** |\n| :--- | :---\
    \ |\n| `Now()` | 包含当前日期、时间和时区字段的 `time.Time` 数据类型 |\n| `Year()` | 4 位数字年份 (YYYY)\
    \ |\n| `Month()` | 年份的月份名称 |\n| `Day()` | 月份中的数字 |\n| `Weekday()` | 星期几名称 |\n\n\
    还有这三个方法返回的 `Time` 数据类型值可以很好地赋值给变量：\n\n| **方法** | **返回** |\n| :--- | :--- |\n|\
    \ `Date()` | 4 位数字年份 (YYYY)、年份的月份名称和月份中的数字 |\n| `ISOWeek()` | 年的周数 (1-53) 和 4\
    \ 位数字年份 (YYYY) |\n| `YearDay()` | 年中的天数 (1-365/366) |\n\n需要注意的是，`Time` 数据类型包含单个字段，因此它不是字符串。不过，你可以使用它的\
    \ `String()` 方法将其转换为字符串：\n\n![image](img/snake.jpg)\n\n`Time` 类型方法返回的值不是字符串。\n\
    \n![image](img/1b.jpg)首先在程序中导入 Go 标准库的 `time` 包\n\n```go\nimport (\n\t\"fmt\"\n\
    \t\"time\"\n)\n```\n\n![image](img/commons.jpg)\n\nsrc\\date\\main.go\n\n![image](img/2b.jpg)接下来，创建一个\
    \ `Time` 数据类型的日期/时间实例，用当前日期和时间初始化\n\n```go\ndt := time.Now()\n```\n\n![image](img/3b.jpg)添加语句输出日期/时间实例的所有字段，并确认其数据类型\n\
    \n```go\nfmt.Printf(\"DateTime: %v \\n\", dt)\nfmt.Printf(\"DateTime Type: %T\
    \ \\n\", dt)\n```\n\n![image](img/4b.jpg)接下来，添加一条语句输出今天的星期名称\n\n```go\nfmt.Printf(\"\
    Today is: %v \\n\", dt.Weekday())\n```\n\n![image](img/5b.jpg)现在，添加语句显示今天的日期、本周以及一年的天数\n\
    \n```go\ny, m, d := dt.Date()\nfmt.Printf(\"Date: %v %v, %v \\n\", m, d, y)\n\
    yr, wk := dt.ISOWeek()\nfmt.Printf(\"Week No.: %v in %v \\n\", wk, yr)\ndy :=\
    \ dt.YearDay()\nfmt.Printf(\"Day No.: %v \\n\", dy)\n```\n\n![image](img/6b.jpg)将程序文件保存在“date”目录中，然后运行程序查看日期字段的值\n\
    \n![image](img/pg113_1.jpg)\n\n![image](img/hot.jpg)\n\n时区值指定了相对于 UTC（通用时间）的偏移量以及时区缩写——有关时区的更多信息请参阅此处。\n\
    \n## 获取时间\n\n`Time` 数据类型单个字段中的时间值可以使用相应的方法获取。例如，可以使用 `Hour()` 方法获取小时字段的值。同样，还有\
    \ `Minute()`、`Second()` 和 `Nanosecond()` 方法，用于获取 `Time` 数据类型的其他单个字段。\n\n![image](img/pg114_1.jpg)\n\
    \n| **方法** | **返回** |\n| :--- | :--- |\n| `Hour()` | 当天的小时 (0-23) |\n| `Minute()`\
    \ | 小时内的分钟 (0-59) |\n| `Second()` | 分钟内的秒数 (0-59) |\n| `Nanosecond()` | 秒内的纳秒\
    \ (0-999999999) |\n\n与其他编程语言不同，Go 的 `time` 包没有提供从 `Time` 数据类型返回毫秒值的方法。不过，你可以将纳秒值除以一百来产生等等的毫秒值。还有这三个方法返回的数据类型值可以很好地赋值给变量：\n\
    \n| **方法** | **返回** |\n| :--- | :--- |\n| `Clock()` | 当天的小时、分、秒 |\n| `Unix()`\
    \ | 自纪元（1970 年 1 月 1 日）开始的秒数 |\n| `UnixNano()` | 自纪元（1970 年 1 月 1 日）开始的纳秒数 |\n\
    \n![image](img/1b.jpg)首先在程序中导入 Go 标准库的 `time` 包\n\n```go\nimport (\n\t\"fmt\"\n\
    \t\"time\"\n)\n```\n\n![image](img/commons.jpg)\n\nsrc\\main.go\n\n![image](img/2b.jpg)接下来，创建一个\
    \ `Time` 数据类型的日期/时间实例，用当前日期和时间初始化\n\n```go\ndt := time.Now()\n```\n\n![image](img/3b.jpg)添加语句输出日期/时间实例的所有字段，并确认其数据类型\n\
    \n```go\nfmt.Printf(\"DateTime: %v \\n\", dt)\nfmt.Printf(\"DateTime Type: %T\
    \ \\n\", dt)\n```\n\n![image](img/4b.jpg)接下来，添加一条语句输出今天的星期名称\n\n```go\nhr := dt.Hour()\n\
    switch {\ncase hr < 12:\n\tfmt.Println(\"Good Morning!\")\ncase hr < 18:\n\tfmt.Println(\"\
    Good Afternoon!\")\ndefault:\n\tfmt.Println(\"Good Evening!\")\n}\n```\n\n![image](img/5b.jpg)现在，添加语句显示今天的日期、本周以及一年的天数\n\
    \n```go\ny, m, d := dt.Date()\nfmt.Printf(\"Date: %v %v, %v \\n\", m, d, y)\n\
    yr, wk := dt.ISOWeek()\nfmt.Printf(\"Week No.: %v in %v \\n\", wk, yr)\n```\n\n\
    ![image](img/6b.jpg)最后，添加语句显示当前时间及其毫秒值\n\n```go\ndt, mn, s := dt.Clock()\nfmt.Printf(\"\
    Time: %v:%v:%v \\n\", mn, s)\nns := dt.UnixNano()\nms := ns / 1000000\nfmt.Println(\"\
    Nanoseconds:\", ns)\nfmt.Println(\"Milliseconds:\", ms)\n```\n\n![image](img/7b.jpg)将程序文件保存在“times”目录中，然后运行程序查看时间字段的值\n\
    \n![image](img/pg115_1.jpg)\n\n![image](img/snake.jpg)\n\n单数字的小、分、秒不带前导零。\n\n\
    ## 格式化日期和时间\n\n![image](img/pg116_1.jpg)\n\n`Time` 数据类型单个字段中的日期和时间可以使用其 `Format()`\
    \ 方法以多种方式格式化。该方法接受一个作为“布局”字符串的参数，该格式必须通过精确使用此引用字符串的元素来指定：\n\n`Mon Jan 2 15:04:05\
    \ 2006 MST`\n\n由于 MST（山地标准时间）比 UTC（协调世界时）晚 7 小时，引用字符串也可以从数值角度考虑为如下：\n\n`01 02\
    \ 03:04:05PM '06 -0700`\n\n如果你想让 `Format()` 方法只返回日期、月份和 hh:mm 格式的时间，可以将布局指定为：\n\
    \n`Jan 2 15:04`\n\n或数值指定为：\n\n`01/02 03:04`\n\n通过在布局中指定长时间版本，可以让星期和月份返回全称：\n\n\
    `Monday January 2 15:04`\n\n`time` 包包含了预定义的 `UnixDate`、`ANSIC` 和 `RFC3339` 常量，你可以作为日期/时间布局格式。\n\
    \n自定义布局可以任意顺序指定组件以适应不同的区域——例如，用于日期格式化。\n"
- fmt: "\nAdditionally, the time components can be formatted to be displayed in a\
    \ 24-hour format that will automatically prefix single-digit hours with a zero\
    \ by specifying “15:04”.\n\nBoth 12-hour format and 24-hour format will automatically\
    \ prefix single-digit minutes with a zero.\n\n![image](images/hot.jpg)\n\nANSIC\
    \ refers to the American National Standards Institute standard date/time format\
    \ for the C programming language. RFC 3339 refers to the Request For Comment date/time\
    \ document of the Internet Engineering Taskforce (IETF).\n\n![image](images/1b.jpg)Begin\
    \ by importing the Go standard library time package into a program\n\n```go\n\
