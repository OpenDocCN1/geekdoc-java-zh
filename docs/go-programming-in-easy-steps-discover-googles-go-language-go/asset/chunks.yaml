    \ package and import declarations\n\n```go\npackage main\n\nimport “fmt”\n```\n\
    \n![image](images/3g.jpg)Add a main function that declares and initializes five\
    \ variables\n\n```go\nfunc main( ) {\n    var zero, num, max int = 0, 0, 1\n \
    \   var up, dn byte = ‘A’, ‘a’\n    // Statements to be inserted here.\n}\n```\n\
    \n![image](images/4g.jpg)In the main function, insert statements to output the\
    \ result of several comparisons\n\n```go\nresult := ( num == zero )          \
    \   // 0 == 0.\nfmt.Println( “Equality:\\tnum == zero\\t”, result )\nresult =\
    \ ( up == dn )                 // A == a.\nfmt.Println( “Equality:\\tup == dn\\\
    t”, result )\nresult = ( max != zero )              // 1 != 0.\nfmt.Println( “Inequality:\\\
    tmax != zero\\t”, result )\nresult = ( zero > max )               // 0 > 1.\n\
    fmt.Println( “Greater:\\tzero > max\\t”, result )\nresult = ( max <= zero )  \
    \            // 1 <= 0.\nfmt.Println( “Less or Equal:\\tmax <= zero\\t”, result\
    \ )\n```\n\n![image](images/5g.jpg)Save the program file in the “comp” directory,\
    \ then run the program to see the results of each comparison\n\n![image](images/pg39_1.jpg)\n\
    \n![image](images/forget.jpg)\n\nThe ASCII code value for uppercase ‘A’ is 65\
    \ but for lowercase ‘a’ it’s 97 – so their comparison here returns `false`.\n\n\
    ![image](images/snake.jpg)\n\nWhen comparing numbers, remember to test for equality\
