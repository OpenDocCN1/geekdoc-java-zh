  trans: "\n随机化模式基于一个的“种子”，该种子在每次程序运行时都会返回相同的伪随机顺序。这可能正是你所需要的，但通常情况下，在每次程序运行时生成不同的顺序会更好。为了实现这一点，你必须将一个自定义的种子作为整数参数传递给\
    \ `rand.Seed()` 函数，该种子在每次程序运行时都应该是唯一的。一种方便的方法是使用当前系统时间，通过调用 `time.Now()` 函数并使用\
    \ `Time` 数据类型的 `UnixNano()` 方法提取自 Unix 纪（Epoch）以来经过的纳秒整数计数。此值在每次程序运行时都会不同，因此将此整数作为\
    \ `rand.Seed()` 函数的参数，将可以确保每次程序运行时都会生成不同的伪随机顺序。\n\n![image](img/1r.jpg)在程序中导入\
    \ Go 标准库 `math/rand` 包，以及用于设置随机种子的 `time` 包和用于转换随机数的 `strconv` 包。\n\n```go\nimport\
    \ ( \"fmt\"\n\t\"math/rand\"\n\t\"strconv\"\n\t\"time\"\n)\n```\n\n![image](img/commonr.jpg)\n\
    \nsrc\\lotto\\main.go\n\n![image](img/2r.jpg)接下来，为随机生成器指定一个唯一的种子\n\n```go\nrand.Seed(\
    \ time.Now().UnixNano() )\n```\n\n![image](img/3r.jpg)现在，生成一个从零到 58 的整数切片\n\n\
    ```go\nnums := rand.Perm( 59 )\n```\n\n![image](img/4r.jpg)然后，增加范围变为包含 1-59 \n\
    \n```go\nfor i := 0 ; i < len( nums ) ; i++ {\n\tnums[ i ]++\n}\n```\n\n![image](img/hot.jpg)\n\
    \n在计算领域中，Epoch（纪元）是指 1970 年 1 月 1 日午夜的时间。\n\n![image](img/5r.jpg)在格式化字符串中，在连字符周围按伪随机顺序分配前六个数字\n\
    \n```go\nstr := \"\\nYour Six Lucky Numbers: \"\nfor i := 0 ; i < 6 ; i++ {\n\t\
    str += strconv.Itoa( nums[ i ] )\n\tif i != 5 {\n\t\tstr += \" - \"\n\t}\n}\n\
    ```\n\n![image](img/6r.jpg)最后，显示格式化字符串\n\n```go\nfmt.Println( str )\n```\n\n![image](img/7r.jpg)将程序文件保存在“lotto”目录，然后反复运行程序以查看不同的随机数\n\
    \n![image](img/pg141_1.jpg)\n\n![image](img/pg141_2.jpg)\n\n这里的随机数在 1 到 59 之间——用于玩英国彩票游戏或美国纽约彩票游戏。\n\
    \n![image](img/pg141_3.jpg)\n\n![image](img/forget.jpg)\n\n`int` 数字必须转换为 `string`\
    \ 数据类型以便拼接。\n\n### 总结\n\n- 字符串是字符的集合，类似于数组中的元素。\n- 内置函数 `len()` 返回作为参数的指定字符串中的字符数量。\n\
    - `strings` 包包含用于字符串操作的函数，例如 `Join()` 拼接函数。\n- `Fields()` 和 `Split()` 函数分别从从指定字符串参数返回的子字符串数组。\n\
    - `Contains()` 和 `Index()` 函数可用于在字符串参数中查找指定的子字符串。\n- `Count()` 函数报告子字符串在指定字符串参数中出现的次数。\n\
    - `HasPrefix()` 和 `HasSuffix()` 函数可用于识别字符串参数的开头和结尾。\n- `Replace()` 函数可以替换子字符串。\n\
    - 使用 `ToUpper()`、`ToLower()` 和 `ToTitle()` 函数更改字符大小写。\n- `Trim()` 函数可以移除首尾空格。\n\
    - `strconv` 包包含 `Atoi()` 和 `Itoa()` 函数，它们可以在字符串和 `int` 数据类型之间转换。\n- `math` 包包含数学函数，如\
    \ `math.Pow()`，以及数学常数，如 `math.Pi`。\n- 小数位值可以使用 `math.Floor()`、`math.Ceil()`、`math.Round()`\
    \ 和 `math.Trunc()` 舍入为接近的整数。\n- `math/rand` 包提供了生成伪随机数的函数。\n- `rand.Perm()` 函数返回从零到指定的参数指定的数字的随机整数序列。\n\
    - `rand.Seed()` 函数可以为随机数生成器指定自定义的种子整数。\n- 通过调用 `time.Now().UnixNano()` 函数，可以在每次程序运行时指定一个唯一的随机种子。\n\
    \n# 10 处理输入\n\n*本章演示了如何处理用户输入，以及如何使用 Go 标准库 `os`、`bufio` 和 `io/ioutil` 包读取和写入文本文件。*\n\
    \n- 获取用户输入\n- 缓冲区输入\n- 命令行标记\n- 读取文件\n- 写入文件\n- 使用临时文件\n- 总结\n\n## 获取用户输入\n\n\
    之前的示例说明了如何使用变量来存储文本字符串。猜数字游戏可以使用 `Scan()`、`Scanln()` 和 `Scanf()` 从标准输入读取。\n\n\
    ```go\nimport (\n\t\"fmt\"\n\t\"math/rand\"\n\t\"time\"\n)\n\nfunc main() {\n\t\
    rand.Seed( time.Now().UnixNano() )\n\tvar num int = rand.Intn( 20 ) + 1\n\tvar\
    \ guess int = 0\n\tvar flag bool = true\n\n\tfmt.Print(\"\\nGuess My Number 1-20:\
    \ \")\n\n\tfor flag {\n\t\t_, err := fmt.Scan(&guess)\n\t\tif err != nil {\n\t\
    \t\tfmt.Println(err)\n\t\t} else if guess > num {\n\t\t\tfmt.Print(\"太大了，再次尝试:\
    \ \")\n\t\t} else if guess < num {\n\t\t\tfmt.Print(\"太小了，再次尝试: \")\n\t\t} else\
    \ if guess == num {\n\t\t\tfmt.Println(\"正确 - 我的数字是\", num)\n\t\t\tflag = false\n\
    \t\t}\n\t}\n}\n```\n\n注意使用 `_` 空白标识符忽略返回的扫描项目数，并记住将输入值赋值给接口变量时使用 `&` 地址运算符。\n\n\
    ## 缓冲区输入\n\n当你想向程序中收集较大的数据项时，通常将数据流存储在内存缓冲区中会更好。Go 标准库 `bufio`（缓冲输入输出）包提供了一个 `Scanner`\
    \ 类型，它是一个具有多个处理数据流的有用方法的内存缓冲区。你可以通过导入 `bufio` 包使其在你的程序可用。\n\n"
- fmt: "\nA `Scanner` instance is first created by specifying a source from which\
    \ to read data as an argument to the `bufio` package’s `NewScanner()`. When the\
    \ source is to be user input, you can import the Go standard library `os` package\
    \ and specify `os.Stdin` (standard input) as the argument to `NewScanner()`.\n\
    \nThe `Scanner` instance has a `Scan()` method that reads all the user input and\
    \ a `Text()` method that returns the input that has been read as a single string\
    \ value.\n\nThe `Scanner` instance also has an `Err()` method that will return\
    \ any read error. If no error is encountered, the error value will be `nil` as\
    \ usual. It is useful to check for errors after calling the `Scan()` and `Text()`\
    \ methods.\n\nIf you want to separate the input into individual string items,\
    \ you can import the Go standard library `strings` package and specify the input\
    \ to its `Fields()` function, to split the string into words.\n\n![image](images/1g.jpg)Begin\
    \ by importing the Go standard library `bufio`, `os`, and `strings` packages into\
    \ a program, to handle input\n\n```go\nimport (\n\t\"fmt\"\n\t\"bufio\"\n\t\"\
    os\"\n\t\"strings\"\n)\n```\n\n![image](images/commong.jpg)\n\nsrc\\buffer\\main.go\n\
    \n![image](images/2g.jpg)Next, request user input\n\n```go\nfmt.Print(\"\\nEnter\
    \ Text:\" )\n```\n\n![image](images/3g.jpg)Now, create a `Scanner` instance to\
    \ store the user input in a memory buffer, then read the user input\n\n```go\n\
    scanner := bufio.NewScanner(os.Stdin)\nscanner.Scan()\n```\n\n![image](images/4g.jpg)Then,\
    \ output an error if one occurred or the stored data\n\n```go\nif scanner.Err()\
    \ != nil {\n    fmt.Println(scanner.Err())\n} else {\n    fmt.Println(scanner.Text())\n\
    }\n```\n\n![image](images/5g.jpg)Next, create a new `Scanner` instance to store\
    \ other user input in a memory buffer\n\n```go\nfmt.Print(\"\\nEnter Text:\" )\n\
    scanner = bufio.NewScanner(os.Stdin)\nscanner.Scan()\n```\n\n![image](images/6g.jpg)Then,\
