    ### Pass References


    The example [here](#chapter05.xhtml_demonstrates) demonstrates that in Go programming
    arguments are, by default, passed “by value” – the function receives a copy of
    the argument, not the original argument. But quite often you may wish a function
    to modify the original argument. This can be achieved by passing an argument to
    the function that is a reference to the original, rather than a copy of its value.


    ![image](images/pg66_1.jpg)


    Remember that pointers are a reference to the memory address on your system where
    a value has been stored. This means that if you pass a pointer argument to a function,
    it will be able to modify the original value residing at the address provided
    by the pointer.


    When declaring a function that can receive pointer arguments, a data type specified
    in its parameter list must be prefixed by an asterisk, to indicate that this parameter
    will be a pointer, like this:


    ```go

    func *functionName* ( *paramName* *type* ) {

    *statements-to-be-executed*

    }

    ```


    The parameter will then be able to store a location address.


    The function statements can access and modify a value at the address provided
    by the pointer, by prefixing the parameter name with an asterisk as a dereferencer.


    When calling a function that accepts a pointer argument, the argument must be
    prefixed with an `&` ampersand character to reference the memory address at which
    the value is stored.


    This technique can be used with the `int`, `float64`, `string`, and `bool` data
    types, and also with the `struct` type that will be introduced in the next chapter.
    These are all “value types”, so pointers are required to access the original values
    they contain when passing them to functions.


    This technique cannot be used with pointer or function types (yes, functions are
    types in Go) nor with the slice, map, or channel types that are demonstrated later
    in this book. These are all already “reference types”, so pointers are not required
    to access the original values they contain when passing them to functions.


    ![image](images/hot.jpg)


    Refer back [here](#chapter02.xhtml_sec13) for a refresher on how pointers work.


