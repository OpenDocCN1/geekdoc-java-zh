  trans: "\n\n![image](img/5o.jpg)如果出现防火墙安全警告，请确认你希望允许 Web 服务器访问\n\n![image](img/6o.jpg)启动浏览器并访问\
    \ `localhost:8000/hello` 查看 Web 服务器对此请求的响应\n\n![image](img/pg177_2.jpg)\n\n##\
    \ 添加待提供的文件\n\n既然已经确认服务器程序可以响应示例此处中的请求，就可以向程序添加服务器响应请求交付的文件。\n\n![image](img/pg178_1.jpg)\n\
    \nWeb 服务器文件通常包含在一个名为 `htdocs`（超文本文档）或类似名称的根目录下。这通常包含 HTML 文件，可能还有一个 `favicon.ico`\
    \ 图像用于在浏览器的标题栏中标识网站。根目录通常还包含子目录以对关联文件分组——例如 `img` 文件夹中的图像、`css` 文件夹中的样式表等。\n\n\
    在我们的服务器示例中，根 `htdocs` 目录下添加了两个 HTML 文档和一个 `favicon.ico` 。一个样式表位于 `htdocs/css`\
    \ 目录，几张图像包含 `htdocs/img` 目录中。整个服务器程序树现在如下：\n\n![image](img/pg178_2.jpg)\n\n![image](img/pg178_3.jpg)\n\
    \nfavicon.ico\n\n32px x 32px\n\n![image](img/pg178_4.jpg)\n\npower.png 100px x\
    \ 25px\n\n其中几个图像文件是各种书籍的封面，其 ISBN（国际标准书号）被用作相应的封面图像文件名。`img` 目录还包含一个公司 Logo 图像和一个标识\
    \ Web 服务器的标签。\n\n样式表包含规则，用于指定程序动态写入的网页响应的样式：\n\n| `img, p` | `{ float: left }`\
    \ |\n\n| `p` | `{ width: 320px ; text-align: center ; font-size: 1.5em }` |\n\n\
    ![image](img/pg179_1.jpg)\n\nstyle.css\n\n名为 `index.html` 的 HTML 文档是一个简单的静态网页，显示了网站图标、页面标题和标签：\n\
    \n```html\n<!DOCTYPE HTML>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\"\
    >\n<title>Index</title>\n<link rel=\"shortcut icon\" href=\"favicon.ico\">\n</head>\n\
    <body>\n<h1>Static Web Page</h1>\n<img src=\"img/power.png\" alt=\"Power\">\n\
    </body>\n</html>\n```\n\n![image](img/pg179_2.jpg)\n\nindex.html\n\n名为 `form.html`\
    \ 的 HTML 文档允许用户向 Web 服务器提交单条文本值：\n\n```html\n<!DOCTYPE HTML>\n<html lang=\"en\"\
    >\n<head>\n<meta charset=\"UTF-8\">\n<title>Submission Form</title>\n<link rel=\"\
    shortcut icon\" href=\"favicon.ico\">\n</head>\n<body>\n<fieldset>\n  <legend>Book\
    \ Lookup</legend>\n  <form method=\"POST\" action=\"lookup\">\n  <label>Programming\
    \ Language</label>\n    <input name=\"Language\" type=\"text\" value=\"\">\n \
    \   <input type=\"submit\" value=\"Submit\" >\n  </form>\n</fieldset>\n<img src=\"\
    img/power.png\" alt=\"Power\">\n</body>\n</html>\n```\n\n![image](img/pg179_2.jpg)\n\
    \nform.html\n\n![image](img/hot.jpg)\n\n服务器将测试 `POST` 方法；`lookup` 值将标识表单处理函数；而\
    \ `Language` 值将标识提交的值。\n\n## 交付静态页面\n\nGo 标准库 `net/http` 包提供了三个函数，允许 Web 服务器通过指定的文件系统内容轻松地响应所有\
    \ HTTP 请求。\n\n![image](img/pg180_1.jpg)\n\n首先将根文件目录的路径作为 `http.Dir()` 函数的参数指定。它返回一个\
    \ `Dir` 类型，然后该类型被作为 `http.FileServer()` 函数的参数。这又返回一个处理器，用于用指定的根文件目录的内容响应所有 HTTP\
    \ 请求。\n\n最后，使用 `http.Handle()` 函数来注册该处理器。这需要两个参数来指定路由模式和处理器的名称。通常使用 `/` 作为第一个参数——以匹配所有请求路径。\n\
    \n浏览器现在可以从指定的根文件目录内按名称请求任何文档。如果请求中省略了文件名，服务器将自动查找名为 `index.html` 的文档并交付给浏览器。\n\
    \n![image](img/1o.jpg)在 `main` 函数开始处，插入一条语句指定要提供的文件根目录 `dir := http.Dir(\"C:/Users/mike_/go/src/server/htdocs\"\
    )`\n\n![image](img/commono.jpg)\n\nsrc\\server\\main.go\n\n![image](img/2o.jpg)接下来，为该文件系统创建一个请求处理器\n\
    \n```go\nfileServer := http.FileServer(dir)\n```\n\n![image](img/3o.jpg)现在，为所有\
    \ HTTP 请求注册处理器\n\n```go\nhttp.Handle(\"/\", fileServer)\n```\n\n![image](img/4o.jpg)保存更新后的程序，然后启动服务器并访问\
    \ `localhost:8000/index.html`\n\n![image](img/5o.jpg)\n\n## 日日志\n\n成功交付静态页面后，`http.Request`\
    \ 对象拥有用于填充表单值的 `ParseForm()` 方法。\n\n![image](img/pg181.jpg)通过向程序引入 Go `strings`、`os`\
    \ 和 `log` 包开始：\n\n```go\nimport (\n\t\"fmt\"\n\t\"io\"\n\t\"log\"\n\t\"net/http\"\
    \n\t\"os\"\n\t\"strings\"\n)\n```\n\n![image](img/commono.jpg)\n\nsrc\\server\\\
    main.go\n\n接下来，在 `main` 函数中注册一个表单处理器，其路由参数将识别赋值给表单 action 属性的名字\n\n```go\nhttp.HandleFunc(\"\
    /lookup\", formHandler)\n```\n\n![hot.jpg\n\nGo 为每个 HTTP 状态码提供了常量，例如对应 200 的 `http.StatusOk`。访问\
    \ [golang.org/pkg/net/http](http://www.golang.org/pkg/net/http) 文档查看完整的列表。\n\n\
    ![image](img/3o.jpg)在 `main` 函数之后，开始带有检查提交方法的表单处理器\n\n```go\n{\n\tif r.Method\
    \ != \"POST\" {\n\t\thttp.Error(w, \"Method Not Allowed\", 405)\n\t\treturn\n\t\
    }\n\t// 此处将插入语句\n}\n```\n\n接下来，在表单处理器中，插入解析表单数据或向浏览器返回错误信息的语句\n\n```go\nerr :=\
    \ r.ParseForm()\nif err != nil {\n\thttp.Error(w, \"Bad Request\", 400)\n\treturn\n\
    }\n```\n\n提交的表单值可以使用 Go `strings` 包进行格式化，去除空格并更改大小写\n\n```go\nlang := r.FormValue(\"\
    Language\")\nlang = strings.ToLower(strings.Trim(lang, \" \"))\n```\n\n"
- fmt: "\n![image](images/6o.jpg)\nThen, in the form handler, insert statements to\
    \ write the formatted value into a log file\n\n```go\nfile, err := os.OpenFile(\
    \ “htdocs/data.log”, os.O_CREATE|os.O_APPEND|os.O_WRONLY, 0644 )\nif err != nil\
    \ {\n    log.Print( err )\n}\ndefer file.Close( )\nlog.SetOutput( file )\nlog.Print(\
    \ lang )\n```\n\n![image](images/7o.jpg)\nSave the updated program file, then\
    \ start the web server and visit localhost:8000/form.html to see the form appear\n\
    \n![image](images/8o.jpg)\nEnter the name of a programming language in the input\
    \ field, then hit the Submit button to submit the form data\n\n![image](images/hot.jpg)\n\
    \nThe most used request methods are `GET` and `POST`. The `GET` method appends\
    \ data to the URL string. The `POST` method carries data in the request body,\
    \ so is more secure and is the preferred method when transferring data from a\
    \ browser to the server.\n\n![image](images/pg183_1.jpg)\n![image](images/9o.jpg)\n\
    Now, hit the browser’s `Back` button and repeat the submission process to send\
    \ multiple requests – each for a different programming language\n\n![image](images/pg183_2.jpg)\n\
    ![image](images/pg183_3.jpg)\n![image](images/10o.jpg)\nThen, visit localhost:8000/data.log\
    \ to see each one of the submitted form values in the log file\n\n![image](images/pg183_4.jpg)\n\
    ![image](images/pg183_5.jpg)\ndata.log\n\n![image](images/hot.jpg)\n\nFor simplicity,\
    \ this example submits only one item, which is referenced using the request object’s\
    \ `FormValue()` method and HTML `name` attribute value. For forms that submit\
    \ multiple items, you can loop through them using the `range` keyword to reference\
    \ the key (HTML `name` attribute) and value (HTML `value` attribute) of each item.\n\
    \n## Deliver a Dynamic Response\n\nHaving received and logged the request data,\
    \ following the steps [here](#chapter12.xhtml_handler), the program can now evaluate\
    \ the request and send an appropriate response to the web browser.\n\n![image](images/1o.jpg)\n\
    After the log statements in the form handler, initialize two variables with default\
    \ response string values\n\n```go\ntitle := “<a href=’http://www.ineasysteps.com’>See\
    \ all titles online</a>”\nisbn := “logo”\n```\n\n![image](images/commono.jpg)\n\
    src\\server\\main.go\n\n![image](images/2o.jpg)\nNext, examine the submitted request\
    \ value and, if matched, assign appropriate response values\n\n```go\nswitch lang\
    \ {\ncase “c” :\n    title = “C Programming”\n    isbn = “978-1-84078-840-2”\n\
    case “go” :\n    title = “Go Programming”\n    isbn = “978-1-84078-919-5”\ncase\
    \ “java” :\n    title = “Java”\n    isbn = “978-1-84078-873-0”\ncase “python”\
    \ :\n    title = “Python”\n    isbn = “978-1-84078-812-9”\ncase “sql” :\n    title\
    \ = “SQL”\n    isbn = “978-1-84078-902-7”\n}\n```\n\n![image](images/3o.jpg)\n\
    Now, build an HTML string that incorporates the response values\n\n```go\nresponse\
    \ := “<!DOCTYPE HTML><title>Web Server Response</title>”\nresponse += “<link rel=’shortcut\
    \ icon’ href=’favicon.ico’>”\nresponse += “<link rel=’stylesheet’ href=’css/style.css’>”\n\
    response += “<p>” + title + “<br>in easy steps”\nif isbn != “logo” {\n    response\
    \ += “<br>ISBN:” + isbn\n}\nresponse += “</p><img src=’img/” + isbn + “.png’ alt=’Cover’>”\n\
    response += “<img src=’img/power.png’ alt=’Power’>”\n```\n\n![image](images/hot.jpg)\n\
    \nNotice that single quotes are used inside the string to distinguish between\
    \ the outer double quotes, and so avoid prematurely terminating the string.\n\n\
    ![image](images/4o.jpg)\nFinally, add a statement to send the response\n\n```go\n\
    io.WriteString( w, response )\n```\n\n![image](images/pg185_1.jpg)\n![image](images/5o.jpg)\n\
    Save the updated program file once more and start the web server, then visit localhost:8000/form.html\
    \ to send requests and receive responses\n\n![image](images/pg185_2.jpg)\n![image](images/pg185_3.jpg)\n\
    ![image](images/pg185_4.jpg)\n![image](images/pg185_5.jpg)\n![image](images/hot.jpg)\n\
    \nYou can discover many more programming language books in this series – including\
    \ R for Data Analysis that covers the R language – at [www.ineasysteps.com](http://www.ineasysteps.com)\n\
    \n## Summary\n\n- The Go standard library `net/http` package provides utilities\
    \ to create a web server.\n- The `http.ListenAndServe()` function specifies an\
    \ address at which to listen, and the name of a request handler.\n- A web server\
    \ program must register route handlers that specify how to respond to particular\
    \ requests.\n- The `http.HandleFunc()` function specifies a route to listen for,\
    \ and the name of a function that will handle that request.\n- A request handler\
    \ function signature always has parameters for `http.ResponseWriter` and `http.Request`.\n\
    - An `http.ResponseWriter` object has a `Write()` method that can accept a `[]byte`\
    \ to send in a response.\n- The `io` package provides a `WriteString()` function\
    \ that can pass a string to an `http.ResponseWriter` object for a response.\n\
    - Files can be added to a web server program to be delivered to the browser in\
    \ response to its requests.\n- The `http.Dir()` function nominates a root file\
    \ system path.\n- The `http.FileServer()` function returns a handler for the contents\
    \ of the file system specified as its argument.\n- The `http.Handle()` function\
    \ specifies a route and the name of a handler for requests made to the nominated\
    \ file system.\n- The `http.Request.ParseForm()` method populates an `http.Request.Form`\
    \ object with submitted form data.\n- The `http.Request.Method` object contains\
    \ the value assigned to the HTML form’s method attribute.\n- The `http.Error()`\
    \ function can use an `http.ResponseWriter` object to send an error message and\
    \ status to the browser.\n- The Go standard library `log` package has `SetOutput()`\
    \ and `Print()` functions to write time-stamped items to a log file.\n- A web\
    \ server program can build an HTML string to send a dynamic response to the web\
    \ browser.\n"
