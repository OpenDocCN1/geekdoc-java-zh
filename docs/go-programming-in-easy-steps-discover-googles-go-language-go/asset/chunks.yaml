    \n![image](img/hot.jpg)\n\n在表达式中使用括号以避免意外结果。\n\n## 总结\n\n- 算术运算符可以形成包含两个操作数的表达式，包括加法\
    \ `+`、减法 `-`、乘法 `*`、除法 `/` 和取模 `%`。\n- 递增 `++` 和递减 `--` 运算符通过 1 修改单个操作数。\n- 赋值\
    \ `=` 运算符可以与算术运算符结合，执行算术计算然后赋值其结果。\n- 比较运算符可以形成比较两个操作数的表达式：相等 `==`、不等 `!=`、大于\
    \ `>`、小于 `<`、大于等于 `>=`、小于等于 `<=`。\n- 逻辑 `&&` 和逻辑 `||` 运算符形成两个操作数的表达式。\n- 逻辑 `!`\
    \ 运算符返回操作数的反。\n- 位运算符 `|`、`&`、`~` 和 `^` 均返回一组位。\n- 移位 `<<` 和移位 `>>` 运算符移动位。\n\
    - 位运算符常用的用法是确定是否执行后续语句。\n\n## 控制流\n\n*本章演示了语句如何通过评估表达式来确定 Go 执行的方向。*\n\n### 测试条件\n\
    \n![image](img/48_1.jpg)\n\n`if` 关键字用于执行基础条件测试，对给定的表达式进行布尔值求值。位于后的 `{ }` 大括号内的语句仅在求值结果为真时执行。`if`\
    \ 语句的语法如下：\n\n```go\nif test-expression {\n    statements-to-execute-when-the-condition-is-true\n\
    }\n```\n\n当测试为真时可能有多个语句需要执行，但每个语句必须独占一行。有时需要评估多个表达式以确定是否执行后续语句。这可以使用逻辑 `&&` 运算符通过以下语法实现：\n\
    \n```go\nif test-expression && test-expression {\n    statements-to-execute-when-all-conditions-are-true\n\
    }\n```\n\n或者，可以将多个 `if` 语句“嵌套”在另一个内部来评估多个表达式，如下：\n\n```go\nif test-expression\
    \ {\n    if test-expression {\n        statements-to-execute-when-all-conditions-are-true\n\
    \    }\n}\n```\n\n当 `if` 测试语句的一个或多个表达式求值结果为假时，其后续大括号中的语句不执行，程序继续执行后续代码。通常通过附加\
    \ `else` 语句来扩展 `if` 语句，指定当 `if` 语句评估的表达式为假时执行的大括号内语句，语法如下：\n\n```go\nif test-expression\
    \ {\n    statements-to-execute-when-the-condition-is-true\n} else {\n    statements-to-execute-when-the-condition-is-false\n\
    }\n```\n\n测试表达式和左大括号 **{** 必须与 **if** 关键字出现在同一行。\n\n"
