  trans: "\n\n# 写入文件\n\nGo 标准库包含了 `ioutil`（输入/输出实用）包，该包提供了写入文本文件的函数。你可以通过导入 `io/ioutil`\
    \ 来在程序中使用该包。\n\n`ioutil` 包的 `WriteFile()` 函数接受三个参数：指定要写入的文件路径、一个包含写入文本的 `[]byte`\
    \ 切片，以及数值型文件权限。如果写入尝试失败，该函数将返回一个错误信息；如果文件成功成功，则返回 `nil` 值。\n\n为了在写入文本文件时进行更精细的控制，你可以使用\
    \ `os` 包的 `OpenFile()` 函数。这需要三个参数：指定要写入的文件路径、一个指定操作类型的标志位以及数值型文件权限。指定操作类型的标志位是\
    \ `os` 包中的常量。例如：\n- `os.O_RDWR` 用于读和写\n- `os.O_APPEND` 用于追加文本\n- `os.O_CREATE`\
    \ 如果文件不存在则创建一个新文件\n\n`OpenFile()` 函数返回一个 `os.File` 类型和任何读取错误。该文件类型具有 `Write()`\
    \ 和 `Close()` 方法，允许你处理文件内容。`Write()` 方法需要一个包含写入文本的 `[]byte` 参数。该方法返回读取的字节数和任何读取错误。`Close()`\
    \ 方法可以在打开文件后立即使用 `defer` 关键字调用，以便在文件操作完成后封装函数结束后关闭文件。\n\n## 实现\n\n首先在程序中导入 Go\
    \ 标准库的 `ioutil` 和 `os` 包以写入文本文件：\n\n```go\nimport (\n    \"fmt\"\n    \"io/ioutil\"\
    \n    \"os\"\n)\n```\n\n### src\\write\\main.go\n\n接下来，添加一个检查写入错误的函数：\n\n```go\n\
    func check(err error) {\n    if err != nil {\n        fmt.Println(err)\n    }\n\
    }\n```\n\n有多种操作类型标志位，可以向 `OpenFile()` 函数指定多个标志位。更多细节请参考 [golang.org/pkg/os/#OpenFile](http://www.golang.org/pkg/os/#OpenFile)\
    \ 上的文档。\n\n现在，在 `main` 函数中写入整个整个文本文件，然后检查错误：\n\n```go\ntxt := []byte(\"\\nA thousand\
    \ suns will stream on thee,\\nA thousand moons will quiver.\\n\")\nerr := ioutil.WriteFile(\"\
    C:/Textfiles/Farewell.txt\", txt, 0644)\ncheck(err)\n```\n\n接下来，打开同一个文本文件进行追加操作，然后检查错误并记住关闭文件：\n\
    \n```go\nfile, err := os.OpenFile(\"C:/Textfiles/Farewell.txt\", os.O_APPEND,\
    \ 0644)\ncheck(err)\ndefer file.Close()\n```\n\n现在，向现有文件内容追加文本并检查错误：\n\n```go\n\
    slice := []byte(\"by Alfred Lord Tennyson.\\n\")\nnb, err := file.Write(slice)\n\
    check(err)\n```\n\n最后，显示起始位置、读取的字符数以及已读取的文本：\n\n```go\nfmt.Printf(\"\\n%v bytes\
    \ @ %v: \", nb, pos)\nfmt.Printf(\"%v\\n\", string(slice))\n```\n\n## 临时文件\n\n\
    在执行期间创建临时文件有时是有用的。`ioutil` 包提供了 `TempFile()` 用于此目的。你可以指定一个空字符串作为默认目录，并指定一个文件名模式。如果模式包含\
    \ `*` 通配符字符，生成的字符串将替换该字符。\n\n当 `TempFile()` 成功创建临时文件时，它会自动打开该文件并准备读写。返回的文件类型具有\
    \ `Name()` 方法，可以通过它引用其路径（包括随机字符串）。你可以使用它的 `Write()` 和 `WriteString()` 方法添加文本内容。`Close()`\
    \ 方法可以在打开文件后立即使用 `defer` 关键字调用，以便在封装函数结束后关闭文件。\n\n与其他文件一样，可以使用 `ioutil.ReadFile()`\
    \ 函数读取临时文件的内容。当不再需要临时文件时，可以通过将文件名作为 `os.Remove()` 函数的参数来删除它。你也可以通过将文件名作为 `os.Stat()`\
    \ 函数的参数来检查临时文件（或其他文件）。该函数返回一个 `info` 类型以及错误信息或 `nil`。\n\n### src\\temp\\main.go\n\
    \n首先在程序中导入 Go 标准库的 `ioutil` 和 `os` 包以处理临时文件：\n\n```go\nimport (\n    \"fmt\"\n\
    \    \"io/ioutil\"\n    \"os\"\n)\n```\n\n接下来，添加一个检查错误的函数：\n\n```go\nfunc check(err\
    \ error) {\n    if err != nil {\n        fmt.Println(err)\n    }\n}\n```\n\n现在，在\
    \ `main` 函数中创建一个临时文本文件，然后检查错误并确认文件存在：\n\n```go\ntmpFile, err := ioutil.TempFile(\"\
    \", \"Data-*\")\ncheck(err)\nfmt.Printf(\"\\nCreated File:\\n%v \\n\", tmpFile.Name())\n\
    ```\n\n向临时文件写入文本，然后检查错误：\n\n```go\nnb, err := tmpFile.WriteString(\"Go Programming\
    \ Fun!\\n\")\ncheck(err)\n```\n\n"
