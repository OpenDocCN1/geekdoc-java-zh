- fmt: "\nUsefully, a constant declaration can employ a “constant generator” named\
    \ `iota` to create a sequence of related constant values. The constant names should\
    \ be listed one-per-line within parentheses after the `const` keyword, and the\
    \ first one assigned the `iota` value. This generates a numerical sequence, beginning\
    \ at zero, that increments by one for each named constant in the list.\n\nFor\
    \ example, you could assign a numeric sequence to constants representing days\
    \ of the week, like this:\n\n```go\nconst (\nsunday = iota\nmonday\ntuesday\n\
    wednesday\nthursday\nfriday\nsaturday\n)\n```\n\nIn this example, the constant\
    \ `sunday` would be assigned zero (0), `monday` would be assigned one (1), and\
    \ so on.\n\nIf you want to begin the sequence at at a different number, simply\
    \ add that number to `iota` in the assignment to the first constant.\n\n![image](images/hot.jpg)\n\
    \nIn other programming languages, the generated sequence is often called an “enumeration”\
    \ or simply `enum`.\n\n![image](images/1r.jpg)\n\n### Create a directory named\
    \ “const” inside your “src” folder\n\n![image](images/commonr.jpg)\n\n`src\\const\\\
    main.go`\n\n### Begin a main.go program with package and import declarations\n\
    \n```go\npackage main\n\nimport “fmt”\n```\n\n![image](images/3r.jpg)\n\n### Add\
    \ a main function that declares and initializes a single constant and a sequence\
    \ of constants, starting at one (1)\n\n```go\nfunc main( ) {\nconst pi = 3.14159\n\
    const (\nred = iota + 1\nyellow\ngreen\nbrown\nblue\npink\nblack\n)\n// Statements\
    \ to be inserted here.\n}\n```\n\n![image](images/4r.jpg)\n\n### Next, insert\
    \ statements to display several constant values\n\n```go\nfmt.Printf( “Pi approximately:\
    \ %v \\n\\n”, pi)\nfmt.Printf( “Red: %v point \\n”, red )\nfmt.Printf( “Blue:\
    \ %v points \\n”, blue )\nfmt.Printf( “Black: %v points \\n”, black )\n```\n\n\
    ![image](images/5r.jpg)\n\n### Save the program file in the “const” directory,\
    \ then run the program to see the constant values\n\n![image](images/pg29_1.jpg)\n\
    \n![image](images/hot.jpg)\n\nThe `math` package in Go provides a constant named\
    \ `math.Pi` that is a far better approximation of the value of ![image](images/py.jpg)\n\
    \n![image](images/hot.jpg)\n\nThe sequence here represents the points value of\
    \ each ball in the game of snooker.\n\n## Point to Stored Values\n\nWhenever your\
    \ program creates a container to store data, your computer allocates a space in\
    \ memory at which to store the data. Like houses, memory locations may be of different\
    \ size but each one has a unique address.\n\n![image](images/pg30_1.jpg)\n\nAn\
    \ initialized variable therefore actually consists of three parts – name, value,\
    \ and the memory address where the data is stored.\n\n![image](images/pg30_2.jpg)\n\
    \nGo programming supports the concept of “pointers”. A pointer variable can store\
    \ the address of another variable and can access the value stored at that address.\n\
    \nThe declaration of a pointer variable requires the data type to be prefixed\
    \ by an asterisk, to indicate that this will be a pointer:\n\n```go\nvar ptr *int\
    \      // Declares this variable will point to an int.\n```\n\nThe address of\
    \ another variable can be assigned to the pointer by prefixing the other variable’s\
    \ name with an `&` ampersand:\n\n```go\nptr = &num        // Assigns an address\
    \ to the pointer variable.\n```\n\nThe value at the assigned address can then\
    \ be accessed by prefixing the pointer name with an asterisk:\n\n```go\n*ptr \
    \            // Points to the value at the assigned address.\n```\n\n![image](images/pg30_3.jpg)\n\
    \nThe concept of pointers can be difficult to grasp because the `*` operator performs\
    \ two purposes – as a type descriptor in a declaration, and as a dereferencer\
    \ when placed before a pointer name. You may at this moment be thinking “Pointers,\
    \ so what?” but pointers are widely used in Go programming, so you should thoroughly\
    \ understand how they work before proceeding further.\n\n![image](images/hot.jpg)\n\
    \nMemory location addresses are hexadecimal numbers that are allocated by your\
    \ computer. They will almost certainly differ on your system from the addresses\
    \ shown in this example.\n\n![image](images/1r.jpg)\n\n### Create a directory\
    \ named “point” inside your “src” folder\n\n![image](images/commonr.jpg)\n\n`src\\\
    point\\main.go`\n\n### Begin a main.go program with package and import declarations\n\
    \n```go\npackage main\n\nimport “fmt”\n```\n\n![image](images/3r.jpg)\n\n### Add\
