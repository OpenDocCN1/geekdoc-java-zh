    **Test a Condition**


    ![image](images/pg48_1.jpg)


    The if keyword is used to perform the basic conditional test that evaluates a
    given expression for a boolean value of true or false. Statements within { } curly
    brackets following the evaluation will only be executed when the expression’s
    condition is found to be true. The syntax of an if test statement looks like this:


    **if *test-expression* {**


    ***statements-to-execute-when-the-condition-is-true***


    **}**


    There may be multiple statements to be executed when the test is true but each
    statement must be on its own line. Sometimes it may be desirable to evaluate multiple
    expressions to determine whether following statements should be executed. This
    can be achieved using the logical && AND operator with this syntax:


    if ***test-expression* && *test-expression* {**


    ***statements-to-execute-when-all-conditions-are-true***


    **}**


    Alternatively, multiple if statements can be “nested”, one inside another, to
    evaluate multiple expressions, like this:


    **if *test-expression* {**


    **if *test-expression* {**


    ***statements-to-execute-when-all-conditions-are-true***


    **}**


    **}**


    When one or more expressions evaluated by an if test statement are found to be
    false, the statements in its following curly brackets are not executed and the
    program proceeds to subsequent code. It is often preferable to extend an if statement
    by appending an else statement specifying statements within curly brackets to
    be executed when the expressions evaluated by the if statement are found to be
    false, with this syntax:


    **if *test-expression* {**


    ***statements-to-execute-when-the-condition-is-true***


    **} else {**


    ***statements-to-execute-when-the-condition-is-false***


    **}**


    This is a fundamental programming technique that offers the program two directions
    in which to proceed, depending on the result of the evaluation, and is known as
    “conditional branching”.


    ![image](images/snake.jpg)


    The test expression and opening **{** curly bracket must appear on the same line
    as the **if** keyword.


