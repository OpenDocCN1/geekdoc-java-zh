    \ 找到标准的完整范围。\n\n![image](img/1r.jpg)在你的“src”文件夹内创建一个名为“vars”的目录\n\n![image](img/commonr.jpg)\n\
    \nsrc\\vars\\main.go\n\n![image](img/2r.jpg)使用 package 和 import 声明开始一个 main.go\
    \ 程序\n\n```go\npackage main\n\nimport “fmt”\n```\n\n![image](img/3r.jpg)添加一个声明并初始化两个变量的\
    \ main 函数\n\n```go\nfunc main( ) {\n    num := 100\n    pi := 3.1415926536\n \
    \   // 在此处插入语句。\n}\n```\n\n![image](img/4r.jpg)在 main 函数中，插入语句以各种格式输出变量值\n\n```go\n\
    fmt.Printf( “num: %v type:%T \\n”, num, num )\nfmt.Printf( “pi: %v type:%T \\\
    n\\n”, pi, pi )\nfmt.Printf( “%%7d displays %7d \\n”, num )\nfmt.Printf( “%%07d\
    \ displays %07d \\n\\n”, num )\nfmt.Printf( “Pi is approximately %1.10f \\n”,\
    \ pi )\nfmt.Printf( “Right-aligned %20.3f rounded pi \\n”, pi )\nfmt.Printf( “Left-aligned\
    \ %-20.3f rounded pi \\n”, pi )\n```\n\n![image](img/5r.jpg)在“vars”目录中保存程序文件，然后运行程序以查看指定格式下的变量值\n\
    \n![image](img/pg25_1.jpg)\n\n![image](img/hot.jpg)\n\n`fmt.Printf( )` 函数在输出后不会添加新行。你必须手动包含\
    \ `\\n` 换行转义序列将打印头移动到下一行。要使用 `fmt.Printf( )` 函数显示 `%` 字符，如所示，在它前面加上另一个 `%` 字符。\n\
    \n![image](img/snake.jpg)\n\n注意，当格式指定符分配的小数位数较少时，浮点值会被四舍五入——而不是简单的截断。\n\n你之后将学会通过测试\
    \ `err` 值是否确实为 `nil` 来确认转换成功——这在 Go 编程中被认为是良好的做法。\n\n## 固定常量\n\n如果你想存储一个在程序执行期间永远不会改变的值，你应该使用\
    \ `const` 关键字进行声明，而不是 `var` 关键字。这防止了意外（或恶意）的赋值尝试。如果你的代码尝试为常量分配新值，编译器将显示“cannot\
    \ assign to”。\n\n![image](img/pg28_1.jpg)\n\n与变量声明不同，常量声明必须在声明中初始化其固定值，如下所示：\n\
    \n```go\nconst oneMillion = 1000000\n```\n\n常量声明可选地指定数据类型，但如果声明中省略了显式数据类型，Go 编译器将从赋值中推断其类型。\n\
