    \ method returns a boolean `true` value while reading input, but returns `false`\
    \ when it reaches the end on input.\n\n## Command Flags\n\nThe command to run\
    \ your program can recognize any number of parameters, so you can pass a space-separated\
    \ list of argument values to the program when you run it. The Go standard library\
    \ `os` (operating system) package provides an `Args` slice, which stores these\
    \ argument values in individual elements. You can make this available to your\
    \ program by importing the `os` package.\n\n![image](images/pg148_1.jpg)\n\nIt\
    \ is important to note that the very first element in `os.Args` will always contain\
    \ the path to your program – argument values are then stored sequentially in subsequent\
    \ elements. You can reference the argument values using `[]` square brackets as\
    \ you would with any other slice – for example, the first argument value as `os.Args[1]`.\n\
    \n![image](images/1g.jpg)Begin by importing the Go standard library `os` package\
