    \n### 满足接口\n\n面向对象编程的第三大基石是“多态”——这是一个源自希腊语的术语，意思是“多种形式”，描述了根据上下文赋予实体不同含义或目的的能力。\n\
    \n![image](img/pg92_1.jpg)\n\nGo 语言通过使用 `type` 关键字创建“接口”类型来支持多态，后面跟着你选择的名称以及接口关键字，然后是\
    \ `{ }` 大括号。接口体只包含方法签名列表：\n\n```go\ntype interfaceName interface {\n    methodName\
    \ returnType\n    methodName returnType\n}\n```\n\n任何具有与接口中列出的所有方法名称和签名精确匹配的方法结构体都会实现该接口。在\
    \ Go 语言术中，它们被认为“满足”了接口。这样做的好处是允许程序拥有具有相同名称附加方法的各种结构体，每个方法都执行不同的任务——即它们是多态的。\n\n\
    ![image](img/1bl.jpg)通过创建一个接口来启动程序，该接口列出了两个方法签名，每个方法都不需要参数且都返回字符串\n\n```go\ntype\
