    Go 标准库 strings 包提供了几个函数，允许将指定的字符串拆分为子字符串。这些函数将字符串视为一个数组，其中每个元素包含一个字符或空格。\n\n通常，你可能希望将一个由空格分隔的句子拆分为子字符串数组，其中每个子字符串都是独立的单词。strings\
