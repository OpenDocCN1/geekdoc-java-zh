    \ and will return a string copy.\n\n![image](images/hot.jpg)\n\nA `strconv.ParseInt()`\
    \ method can also be used to convert a string data type to an integer. The `strconv.Atoi()`\
    \ method is equivalent to calling `strconv.ParseInt(str, 10, 0)`.\n\n![image](images/1r.jpg)Begin\
    \ by importing the Go standard library strings package and `strconv` package into\
    \ a program.\n\n```go\nimport (\n\t\"fmt\"\n\t\"strings\"\n\t\"strconv\"\n)\n\
    ```\n\n![image](images/commonr.jpg)\n\n`src\\conv\\main.go`\n\n![image](images/2r.jpg)Start\
    \ the main function by initializing a string variable, then display the string\
    \ with different character cases.\n\n```go\nstr := \"I have Nothing to declare\
    \ except My Genius\"\nfmt.Println(strings.ToUpper(str))\nfmt.Println(strings.ToLower(str))\n\
    fmt.Println(strings.Title(strings.ToLower(str)))\n```\n\n![image](images/3r.jpg)Now,\
    \ assign a number and spaces to the variable.\n\n```go\nstr = \" 42 \"\nfmt.Printf(\"\
    %v Type: %T\\n\", str, str)\n```\n\n![image](images/4r.jpg)Then, remove leading\
    \ and trailing spaces from the string.\n\n```go\nstr = strings.Trim(str, \" \"\
    )\n```\n\n![image](images/5r.jpg)Finally, attempt to change the data type to an\
    \ integer.\n\n``````go\nnum, err := strconv.Atoi(str)\nif err != nil {\n\tfmt.Println(err)\n\
    } else {\n\tfmt.Printf(\"%v Type: %T\\n\", num, num)\n}\n```\n\n![image](images/6r.jpg)Save\
    \ the program file in a “conv” directory, then run the program to see the search\
    \ results.\n\n![image](images/pg133_1.jpg)\n\n## Calculate Areas\n\n![image](images/pg134.1)The\
    \ Go standard library math package provides a number of useful functions and constant\
    \ values. The constants are listed in the table below with their approximate value:\n\
    \n| Constant | Description |\n| :--- | :--- |\n| `math.E` | Constant *e*, base\
    \ of the natural logarithm, with an approximate value of 2.71828 |\n| `math.Pi`\
    \ | The constant Pi, with an approximate value of 3.14159 |\n| `math.Phi` | The\
