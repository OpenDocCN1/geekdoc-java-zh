    You can modify a searched string by replacing a specified pattern with a replacement
    substring using the strings package’s Replace( ) function. This function requires
    four arguments to specify the string to search, the pattern to find, the replacement
    substring, and an integer denoting the number of instances to be replaced. If
    you want to replace all instances of the pattern within the searched string, simply
    specify -1 as the number of replacements.


    ![image](images/forget.jpg)


    The **strings.Index( )** function stops searching when it finds the first instance
    of the pattern in the searched string.


    ![image](images/1r.jpg)Begin by importing the Go standard library strings package
    into a program


    **import (**


    **“fmt”**


    **“strings”**


    **)**


    ![image](images/commonr.jpg)


    src\find\main.go


    ![image](images/2r.jpg)Start the main function by initializing a string variable


    **str := “I can resist everything except temptation”**


    ![image](images/3r.jpg)Next, test whether a substring exists within the string,
    then find the index position of the first instance


    **fmt.Printf( “\nFound ‘an’: %v \n”, strings.Contains( str, “an” ) )**


    **fmt.Printf( “Found ‘an’ at: %v \n”, strings.Index( str, “an” ) )**


    ![image](images/4r.jpg)Now, count how many instances of a particular letter appear
    in the string


    **fmt.Printf( “Count of ‘e’: %v \n”, strings.Count( str, “e” ) )**


    ![image](images/5r.jpg)Then, test whether the string begins or ends with a particular
    substring


    **fmt.Printf( “Prefix ‘ion’: %v \n”, strings.HasPrefix( str, “ion” ) )**


    **fmt.Printf( “Suffix ‘ion’: %v \n”, strings.HasSuffix( str, “ion” ) )**


    ![image](images/6r.jpg)Finally, replace a substring within the string


    **fmt.Println( strings.Replace( str, “temptation”, “chocolate”, 1 ) )**


    ![image](images/7r.jpg)Save the program file in a “find” directory, then run the
    program to see the search results


    ![image](images/pg131_1.jpg)


    **Convert Strings**


    ![image](images/pg132_1.jpg)


    The Go standard library strings package provides functions to convert the character
    case of strings.


    The strings package has a ToUpper( ) function that requires a single string argument.
    This function will simply return a copy of the string with all its characters
    converted to uppercase letters.


    Similarly, the strings package’s ToLower( ) function requires a single string
    argument, and will return a copy of the string with all its characters converted
    to lowercase letters.


    The strings package also has a ToTitle( ) function that requires a single string
    argument. This function will return a copy of the string with the first character
    of each word converted to an uppercase letter – but only when the string argument
    is all lowercase. If you want to convert a string of mixed-case letters to title
    case you must first convert it to lowercase using the strings package’s ToLower(
    ) function.


    When a program receives user input following a request for a numeric value, the
    input might be of a string data type and may include spaces that the user has
    inadvertently entered. You can remove spaces from the beginning and end of a string
    using the strings package’s Trim( ) function. This requires two arguments to specify
    the string and character to be removed. To remove all leading and trailing spaces,
    the second argument will be **“ “** to specify a single space character.


    Once unnecessary spaces have been removed from a string containing an input number,
    the data type must be converted to a numeric type before the program can use the
    input in arithmetical operations. This can be achieved by importing the Go standard
    library strconv package. This package contains an Atoi( ) function (ASCII to Integer)
    that requires a single string argument, and will return an integer and any error.
    If no error is encountered, the error value will be nil or it will contain a descriptive
    error message if the method cannot return an integer data type.


    Similarly, the strconv package contains an Itoa( ) function that can convert an
    integer to a string data type. This method simply requires an integer argument,
    and will return a string copy.


    ![image](images/hot.jpg)


    A **strconv.ParseInt( )** method can also be used to convert a string data type
    to an integer. The **strconv.Atoi( )** method is equivalent to calling **strconv.ParseInt(
    str, 10, 0)**.


    ![image](images/1r.jpg)Begin by importing the Go standard library strings package
    and **strconv** package into a program


    **import (**


    **“fmt”**


    **“strings”**


    **“strconv”**


    **)**


    ![image](images/commonr.jpg)


    src\conv\main.go


    ![image](images/2r.jpg)Start the main function by initializing a string variable,
    then display the string with different character cases


    **str := “I have Nothing to declare except My Genius”**


    **fmt.Println( strings.ToUpper( str ) )**


    **fmt.Println( strings.ToLower( str ) )**


    **fmt.Println( strings.Title( strings.ToLower( str ) ) )**


    ![image](images/3r.jpg)Now, assign a number and spaces to the variable


    **str = “ 42 “**


    **fmt.Printf( “\n%v Type: %T, Length: %v \n”, str, str, len( str ) )**


    ![image](images/4r.jpg)Then, remove leading and trailing spaces from the string


    **str = strings.Trim( str, “ “ )**


    **fmt.Printf( “\n%v Type: %T, Length: %v \n”, str, str, len( str ) )**


    ![image](images/5r.jpg)Finally, attempt to change the data type to an integer


    **num, err := strconv.Atoi( str )**


    **if err != nil {**


    **fmt.Println( err )**


    **} else {**


    **fmt.Printf( “%v Type: %T \n”, num, num )**


    **}**


    ![image](images/6r.jpg)Save the program file in a “conv” directory, then run the
    program to see the string conversions


    ![image](images/pg133_1.jpg)


    ![image](images/hot.jpg)


    Change the string assignment to **“ $42 “** in Step 3, then save and run the program
    to see a parsing error message appear as the conversion to an integer fails.


    Calculate Areas


    ![image](images/pg134_1.jpg)


    The Go standard library math package provides a number of useful functions and
    constant mathematical values. The constants are listed in the table below together
    with their approximate value:


    | **Constant** | **Description** |


    | **math.E** | Constant *e*, base of the natural logarithm, with an approximate
    value of 2.71828 |


    | **math.Pi** | The constant ![image](images/pg134_3.jpg) Pi, with an approximate
    value of 3.14159 |


    | **math.Phi** | The constant ![image](images/pg134_4.jpg) Phi (the “Golden Ratio”),
    with an approximate value of 1.61803 |


    | **math.Sqrt2** | The square root of 2, with an approximate value of 1.41421
    |


    | **math.SqrtE** | The square root of constant *e*, with an approximate value
    of 1.64872 |


    | **math.SqrtPi** | The square root of constant ![image](images/pg134_3.jpg) Pi,
    with an approximate value of 1.77246 |


    | **math.SqrtPhi** | The square root of constant ![image](images/pg134_4.jpg)
    Phi,with an approximate value of 1.27202 |


    | **math.Ln2** | The natural logarithm of 2, with an approximate value of 0.69315
    |


    | **math.Log2E** | The base-2 logarithm of constant *e*, with an approximate value
    of 1.44269 |


    | **math.Ln10** | The natural logarithm of 10, with an approximate value of 2.30259
    |


    | **math.Log10E** | The base-10 logarithm of constant *e*, with an approximate
    value of 0.43429 |


    The math constants are mostly used in Go programs that have a particular mathematical
    purpose, but all the math package constants are listed above for completeness.


    ![image](images/hot.jpg)


    The Golden Ratio appears many times in geometry and art. It is the ratio of a
    line segment cut into two pieces of different lengths, where the length ratio
    of the long piece to the short piece is equal to the length ratio of the whole
    segment to the long piece.


