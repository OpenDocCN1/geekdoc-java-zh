    ```go\ntmpFile, err := ioutil.TempFile(\"\", \"Data-*\")\ncheck(err)\nfmt.Printf(\"\
    \\nCreated File:\\n%v \\n\", tmpFile.Name())\n```\n\nWrite text into the temporary\
    \ file, then check for errors:\n\n```go\nnb, err := tmpFile.WriteString(\"Go Programming\
    \ Fun!\\n\")\ncheck(err)\n```\n"
