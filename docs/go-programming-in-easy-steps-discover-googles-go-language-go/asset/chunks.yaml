  trans: "\n\n格式指定符可以通过在 `%` 字符之后指定所需的空格数，来确保输出占据最少数量的空格——例如，使用格式指定符 `%7d` 可以确保整数始终至少占用七个空间。如果希望用零填充空白区域，只需添加一个零使格式指定符变为\
    \ `%07d` 即可。\n\n精度指定符是一个点（句号）后跟一个数字，该数字可以与 `%f` 格式指定符配合使用，确定显示多少位小数——例如，使用 `%.2f`\
    \ 显示两位小数。精度指定符可以与最小空间指定符结合使用，以控制空格数和小数位数——例如，使用 `%07.2f` 显示七个空间，包括两位小数和由零填充的空白。默认情况下，空白区域位于数字之前，因此它是右对齐的。你也可以将空格添加到数字之后，通过在最小空间指定符前加上一个减号来使其变为左对齐。\n\
    \n![image](img/forget.jpg)\n\n`%v` 格式指定符可以用于显示任何值，而 `%T` 格式指定符用于确认任何变量的数据类型。\n\
