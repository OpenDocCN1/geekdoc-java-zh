    A _ blank identifier is used here to ignore the returned error value due to space
    constraints, but you should ideally include an error-handler.


    **Delay Time**


    The Go standard library time package provides a Sleep( ) function that allows
    you to delay progress of a program by a specified duration period. The duration
    is supplied as an argument to the Sleep( ) function, and can be expressed as a
    multiplication of a time package constant. For example, 5 * time.Second expresses
    a duration of five seconds.


    ![image](images/pg122_1.jpg)


    The Go standard library time package also provides three methods that compare
    an instance of the Time data type with another time specified as their argument.
    These methods will each return a boolean true or false value according to the
    result of the time comparison:


    | **Method** | **Returns** |


    | **Before(** *time* **)** | A boolean **true** value if the instance time is
    earlier than its argument time |


    | **After(** *time* **)** | A boolean **true** value if the instance time is later
    than its argument time |


    | **Equal(** *time* **)** | A boolean **true** value if the instance time and
    argument time represent the same instant – even in different time zones |


    If you would like to see the difference between two instances of the Time data
    type, you can use a Sub( ) method of a time instance to specify another time instance
    as its argument. This method will return the elapsed duration between the two
    instants as an int64 data type value of nanosecond precision.


    It is often preferable to present duration periods with less than nanosecond precision,
    so the Go standard library time package includes a Round( ) method to specify
    more concise precision. This method requires one argument to determine your preferred
    rounding behavior. Typically, the argument is supplied as one of the time package
    constants. For example, calling the method with Round( time.Millisecond ) will
    round a nanosecond precision duration to the nearest millisecond, Round( time.Second
    ) will round a nanosecond precision duration to the nearest second, and so on.


    ![image](images/1b.jpg)Begin by importing the Go standard library time package
    into a program


    **import (**


    **“fmt”


    “time”**


    **)**


    ![image](images/commons.jpg)


    src\delay\main.go


    ![image](images/2b.jpg)Next, create and display components of a Time data type


    **start := time.Now( )**


    **fmt.Println( “\nStarted At:”, start.Format( “03:04:05” ) )**


    ![image](images/3b.jpg)Now, delay the program’s progress for five seconds


    **time.Sleep( 5 * time.Second )**


    ![image](images/4b.jpg)Then, create and display a second Time data type


    **finish := time.Now( )**


    **fmt.Println( “Finished At:”, finish.Format( “03:04:05” ) )**


    ![image](images/5b.jpg)Compare the start and finish times


    **fmt.Println( “\nStart First?:”, start.Before( finish ) )**


    **fmt.Println( “Finish First?:”, finish.Before( start ) )**


    ![image](images/6b.jpg)Finally, display the length of the delay


    **diff := finish.Sub( start )**


    **fmt.Println( “\nTime Elapsed:”, diff.Round( time.Second ) )**


    ![image](images/7b.jpg)Save the program file in a “delay” directory, then run
    the program to see the time delay


    ![image](images/pg123_1.jpg)


    ![image](images/hot.jpg)


    The ability to delay execution is particularly useful in pausing individual “goroutines”
    – see the example [here](#chapter11.xhtml_package) for more details.


    **Summary**


    •The Go standard library time package contains functions to create Time data types
    comprising date, time, and zone fields.


    •A Time data type is not a string, but can be converted to a string using its
    String( ) method.


    •The time.Now( ) function returns the current date, time, and zone from the system
    time at the current locale.


    •Date components can be extracted from a Time data type using its Year( ), Month(
    ), Day( ), and Weekday( ) methods.


    •The Date( ), ISOWeek( ), and YearDay( ) methods return date values that can usefully
    be assigned to variables.


    •Time components can be extracted from a Time data type using Hour( ), Minute(
    ), Second( ), and Nanosecond( ) methods.


    •The Clock( ), Unix( ), and UnixNano( ) methods return time values that can usefully
    be assigned to variables.


    •The Format( ) method takes a layout string or predefined constant as its argument
    to format dates and times.


    •The Go reference string for date/time layouts is Mon Jan 2 15:04:05 2006 MST


    •The time.Date( ) function is used to create a Time data type and requires arguments
    to specify year, month, day, hour, minute, second, nanosecond, and location.


    •The time package contains predefined constants for month names, hour, minute,
    second, millisecond, and location.


    •The AddDate( ) method can modify date components and the Add( ) method can modify
    time components.


    •The time.LoadLocation( ) function requires an IANA location name argument, and
    the In( ) function applies a location.


    •The time.Sleep( ) function delays execution of a program by the duration specified
    as its argument.


    •The Sub( ) method returns elapsed duration between two times, and the Round(
    ) method can specify its precision.


    9


    Manage Data


    ***This chapter demonstrates how to manipulate text and numbers using the Go standard
    library math, string, and strconv packages.***


    [**Unite Strings**](#chapter09.xhtml_sec61)


    [**Split Strings**](#chapter09.xhtml_sec62)


    [**Find Characters**](#chapter09.xhtml_sec63)


    [**Convert Strings**](#chapter09.xhtml_sec64)


    [**Calculate Areas**](#chapter09.xhtml_sec65)


    [**Evaluate Numbers**](#chapter09.xhtml_sec66)


    [**Round Decimals**](#chapter09.xhtml_sec67)


    [**Generate Randoms**](#chapter09.xhtml_sec68)


    [**Summary**](#chapter09.xhtml_sec69)


    Unite Strings


    ![image](images/pg126_1.jpg)


    In Go programming, a string is zero or more characters enclosed within double
    quote marks. So, these are all valid string values:


    **s1 := “My First String”**


    **s2 := “”**


    **s3 := “2”**


    **s4 = “nil”**


    The empty quotes of s2 initialize the variable as an empty string value. The numeric
    value assigned to s3 is a string representation of the number. The Go nil zero
    value, which normally represents the absence of any value, is simply a string
    literal when it is enclosed within quotes.


    Essentially, a string is a collection of characters; each character containing
    its own data – just like elements in a defined array. It is, therefore, logical
    to regard a string as an array of characters and apply array characteristics when
    dealing with string values. The built-in len( ) function will return the number
    of characters in a string, much like it returns the number of elements in an array.


    The + operator, which can be used to add numeric values, doubles as a concatenation
    operator for joining string values together to create a single united string.'
