  trans: "\n\n这里的容量增量大小为 10，但在其他平台上可能会有所不同。请注意，当元素被删除时，容量不会恢复到原始大小。\n\n## 切片与数组\n\n\
    数组包含一个值的序列，而切片包含对一个值序列的引用。这是 Go 编程中一个重要的区别，适用于它的许多类型。最重要的是，当将类型传递给函数时，基于值的类型将接收原始值的副本，而那些是引用的类型将指向实际的原始值。因此，为了让函数在原始值上进行操作，在将基于值的类型传递给函数时你需要使用指针，但在传递引用类型时则不需要指针。\n\
    \n![image](img/pg106_1.jpg)\n\n![image](img/pg106_2.jpg)\n\n数组和切片的另一个区别涉及“变长参数”函数，这种函数可以使用任意数量的参数进行调用。除非你通过将数组元素值复制到切片元素并将数组“转换”为切片，否则你无法将数组元素值传递给变长函数。\n\
    \n你可以通过在函数签名的最后一个参数的数据类型前加上 `…` 通配符运算符来简单地创建一个变长函数，使用这种语法：\n\n`func *funcName*\
    \ (*paramName…dataType)`\n\n变长函数可以像通常一样调用，在 `()` 括号内包含用逗号分隔的参数列表。\n\n变长函数在将切片元素的值传递给函数时特别有用，因为切片的长度在程序执行过程中可能会变化。无论切片的长度如何，都可以通过在函数调用的括号内指定切片名称后跟\
    \ `…` 通配符运算符，将它的元素值传递给变长函数：\n\n`*funcName*(sliceName…)`\n\n![image](img/hot.jpg)\n\
    \n`fmt.Printf()` 函数是一个变长函数——它在开头需要一个固定参数，然后接受任意数量的后续参数。\n\n![image](img/1v.jpg)创建一个三个字符串的数组\n\
    \n```go\narray := [ 3 ]string{ “BMW”, “Ford”, “Opel” }\n```\n\n![image](img/commonv.jpg)\n\
    \n`src\\versus\\main.go`\n\n![image](img/2v.jpg)将数组元素复制到切片中进行“转换”\n\n```go\nslice\
    \ := array[ : ]\n```\n\n![image](img/3v.jpg)接下来，调用变长函数传递切片中每个元素的值用于显示\n\n```go\n\
    list( slice…)\n```\n\n![image](img/4v.jpg)现在，向切片追加另外两个值\n\n```go\nslice = append(\
    \ slice, “Porsche”, “Ferrari” )\n```\n\n![image](img/5v.jpg)再次调用变长函数传递切片中每个元素的值用于显示\n\
    \n```go\nlist( slice…)\n```\n\n![image](img/6v.jpg)在 main 函数之后，添加变长函数来列出传递的切片元素值\n\
    \n```go\nfunc list( autos …string ) {\n    for i, v := range autos {\n       \
    \ fmt.Printf( “\\n%v. %v”, i, v )\n    }\n    fmt.Println( )\n}\n```\n\n![image](img/7v.jpg)将程序文件保存在“versus”目录中，然后运行程序查看参数值\n\
    \n![image](img/pg107_1.jpg)\n\n![image](img/forget.jpg)\n\n调用变长函数时，你并不是在传递切片本身——你仅仅是在传递切片元素的值。\n\
    \n## Map 的键和值\n\n哈希表可以使用关联的键存储多个数据项，这样你就可以通过其关联的键引用存储的值。在 Go 编程中，这种数据结构被称为“map”，但其他编程语言将其称为关联数组或字典。\n\
    \n![image](img/pg108_1.jpg)\n\nmap 中的所有键必须是唯一的且具有相同的数据类型。map 中的所有值必须具有相同的数据类型，但不一定与键的数据类型相同。\n\
    \n可以使用 `var` 和 `map` 关键字，并使用这种语法指定键和值的数据类型来创建 map：\n\n`var *mapName = map [ *keyDataType\
    \ ] *valueDataType`\n\n然后可以将单独的键/值对赋值给 map，如下：\n\n```go\n*mapName[ “*keyName*”\
    \ ] = *value*\n```\n\n或者，你可以使用内置的 `make()` 函数来创建 map：\n\n```go\n*mapName := make(\
    \ map [ *keyDataType ] *valueDataType* )\n```\n\n此外，你可以通过使用这种语法赋值“map 字面量”来创建并初始化\
    \ map：\n\n```go\n*mapName := map [ *keyDataType ] *valueDataType {\n    *key*\
    \ : *value* , *key* : *value* , *key* : *value ,\n}\n```\n\n与数组和切片不同，键/值对是以无序方式存储的，因此你不能使用元素索引来引用存储的值——你必须使用其关联的键。\n\
    \n你可以随时向 map 添加键/值对，并可以使用内置的 `delete()` 函数删除键/值对。这需要两个参数来指定 map 名称和要删除的键名。\n\n\
    与数组和切片一样，你可以使用 `range` 关键字遍历 map 的所有元素。在这种情况下，循环将返回键和值。\n\n![image](img/snake.jpg)map\
    \ 不是切片，所以你无法对其地址。\n\n![image](img/1v.jpg)创建一个字符串键的 map\n\n```go\ncolors := make(\
    \ map [ string ] string )\n```\n\n![image](img/2v.jpg)初始化 map 三\n\n```go\ncolors[\
    \ “Red” ] = “FF0”\n```\n\n![image](img/3v.jpg)添加另一个键\n\n```go\ncolors[ “Green”\
    \ ] = “00FF”\n```\n\n![image](img/4v.jpg)接下来，显示所有 map 条目\n\n```go\nfmt.Printf(\
    \ “Colors: %v \\n”, colors )\n```\n\n![image](img/5v.jpg)现在，添加键/值对\n\n```go\n\
    colors[ “Yellow” ] = “FFFF00”\n```\n\n![image](img/6v.jpg)然后删除添加的键\n\n```go\n\
    delete( colors, “Yellow” )\n```\n\n![image](img/7v.jpg)最后，添加循环列出 map 中所有的键/值对\n\
    \n```go\nfor k, v := range colors {\n    fmt.Printf( “\\n%v is %v \\n”, k, v )\n\
    }\n```\n\n## 总结\n\n- 数组是顺序存储元素的固定长度结构。\n- 数组声明必须在 [ ] 中指定元素数量。\n- 数组或切片元素存储的值可以通过指定索引数字来引用。\n\
    - 空数组可以使用 `var` 关键字创建，也可以通过赋值数组字面量创建并初始化。\n- `len()` 函数返回数组或切片的长度。\n- 可以使用 `range`\
    \ 关键字遍历元素。\n- 切片是顺序存储在底层数组元素的可变长度结构。\n- 切片包含一个指针、长度和容量。\n- `cap()` 函数返回切片的容量。\n\
    - 切片声明不需要在 [ ] 中指定元素数量。\n- 元素序列的上下边界可以在 [ ] 内的 `:` 字符周围进行指定。\n- 空切片可以使用 `make()`\
    \ 函数创建，也可以通过赋值切片字面量创建并初始化。\n- 可以 `append()` 函数向切片添加元素。\n- 切片可以通过 `copy()` 函数复制到另一个切片中。\n\
    - 将引用传递给函数时不需要指针。\n- 变长函数可以使用任意数量的参数调用。\n- map 是包含关联键/值对的可变长度结构。\n- 空 map 可以使用\
    \ `make()` 函数创建，也可以通过赋值 map 字面量创建并初始化。\n- map 元素存储的值可以通过指定 [ ] 中的关联键来引用。\n\n"
- fmt: "\nThis chapter demonstrates how to manipulate dates and time using the Go\
    \ standard library time package.\n\n## Get Dates\n\nThe Go standard library time\
    \ package provides functionality to extract specific fields from a `Time` data\
    \ type that describe a particular point in time. These can be made available to\
    \ a program by importing the `time` package.\n\n![image](images/pg112_1.jpg)\n\
    \nA date/time instance of a new `Time` data type can be created with fields describing\
    \ the current date and time using a `time.Now()` function. The fields are initialized\
    \ from the system clock on your device for the current locale.\n\nThe value within\
    \ an individual field can be retrieved using an appropriate method of the `Time`\
    \ data type. For example, the value of the year field can be retrieved using its\
    \ `Year()` method. Similarly, there are `Month()`, `Day()`, and `Weekday()` methods\
    \ that retrieve other individual fields of a `Time` data type.\n\n| **Method**\
    \ | **Returns** |\n| :--- | :--- |\n| `Now()` | A `time.Time` data type comprising\
    \ current date, time, and time zone fields |\n| `Year()` | Year with 4 digits\
    \ (YYYY) |\n| `Month()` | Month name of the year |\n| `Day()` | Day number of\
    \ the month |\n| `Weekday()` | Day name of the week |\n\nThere are also these\
    \ three methods whose returned `Time` data type values can usefully be assigned\
    \ to variables:\n\n| **Method** | **Returns** |\n| :--- | :--- |\n| `Date()` |\
    \ Year with 4 digits (YYYY), month name of the year, and day number of the month\
    \ |\n| `ISOWeek()` | Week number of the year (1-53) and year with 4 digits (YYYY)\
    \ |\n| `YearDay()` | Day number of the year (1-365/366) |\n\nIt is important to\
    \ recognize that a `Time` data type contains individual fields and so is not a\
    \ string. You can, however, convert it to a string using its `String()` method:\n\
    \n![image](images/snake.jpg)\n\nThe values returned by the `Time` data type methods\
    \ are not strings.\n\n![image](images/1b.jpg)Begin by importing the Go standard\
    \ library time package into a program\n\n```go\nimport (\n\t\"fmt\"\n\t\"time\"\
    \n)\n```\n\n![image](images/commons.jpg)\n\nsrc\\date\\main.go\n\n![image](images/2b.jpg)Next,\
    \ create a date/time instance of the `Time` data type, initialized with the current\
    \ date and time\n\n```go\ndt := time.Now()\n```\n\n![image](images/3b.jpg)Add\
    \ statements to output all fields of the date/time instance and to confirm its\
    \ data type\n\n```go\nfmt.Printf(\"DateTime: %v \\n\", dt)\nfmt.Printf(\"DateTime\
    \ Type: %T \\n\", dt)\n```\n\n![image](images/4b.jpg)Next, add a statement to\
    \ output today’s day name\n\n```go\nfmt.Printf(\"Today is: %v \\n\", dt.Weekday())\n\
    ```\n\n![image](images/5b.jpg)Now, add statements to display today’s date, current\
    \ week, and day number of the year\n\n```go\ny, m, d := dt.Date()\nfmt.Printf(\"\
    Date: %v %v, %v \\n\", m, d, y)\nyr, wk := dt.ISOWeek()\nfmt.Printf(\"Week No.:\
    \ %v in %v \\n\", wk, yr)\ndy := dt.YearDay()\nfmt.Printf(\"Day No.: %v \\n\"\
    , dy)\n```\n\n![image](images/6b.jpg)Save the program file in a “date” directory,\
    \ then run the program to see the date field values\n\n![image](images/pg113_1.jpg)\n\
    \n![image](images/hot.jpg)\n\nThe time zone values specify the offset from the\
    \ UTC (Universal Time Clock) and a time zone abbreviation – see [here](#chapter08.xhtml_sec58)\
    \ for more on time zones.\n\n## Get Times\n\nThe time values within individual\
    \ fields of a `Time` data type can be retrieved using appropriate methods. For\
    \ example, the value of the hour field can be retrieved using its `Hour()` method.\
    \ Similarly, there are `Minute()`, `Second()`, and `Nanosecond()` methods that\
    \ retrieve other individual fields of a `Time` data type.\n\n![image](images/pg114_1.jpg)\n\
    \n| **Method** | **Returns** |\n| :--- | :--- |\n| `Hour()` | Hour number of the\
    \ day (0-23) |\n| `Minute()` | Minute number of the hour (0-59) |\n| `Second()`\
    \ | Second number of the minute (0-59) |\n| `Nanosecond()` | Nanosecond of the\
    \ second (0-999999999) |\n\nUnlike other programming languages, the `time` package\
    \ in Go does not provide a method to return a millisecond value from a `Time`\
    \ data type. You can, however, divide the nanosecond value by one million to produce\
    \ its millisecond equivalent. There are also these three methods whose returned\
    \ data type values can usefully be assigned to variables:\n\n| **Method** | **Returns**\
    \ |\n| :--- | :--- |\n| `Clock()` | Hour, minute, and second within the day |\n\
    | `Unix()` | Number of seconds since the epoch (January 1, 1970) |\n| `UnixNano()`\
    \ | Number of nanoseconds since the epoch (January 1, 1970) |\n\n![image](images/1b.jpg)Begin\
    \ by importing the Go standard library time package into a program\n\n```go\n\
    import (\n\t\"fmt\"\n\t\"time\"\n)\n```\n\n![image](images/commons.jpg)\n\nsrc\\\
    main.go\n\n![image](images/2b.jpg)Next, create a date/time instance of the `Time`\
    \ data type, initialized with the current date and time\n\n```go\ndt := time.Now()\n\
    ```\n\n![image](images/3b.jpg)Add statements to output all fields of the date/time\
    \ instance and to confirm its data type\n\n```go\nfmt.Printf(\"DateTime: %v \\\
    n\", dt)\nfmt.Printf(\"DateTime Type: %T \\n\", dt)\n```\n\n![image](images/4b.jpg)Next,\
    \ add a statement to output today’s day name\n\n```go\nhr := dt.Hour()\nswitch\
    \ {\ncase hr < 12:\n\tfmt.Println(\"Good Morning!\")\ncase hr < 18:\n\tfmt.Println(\"\
    Good Afternoon!\")\ndefault:\n\tfmt.Println(\"Good Evening!\")\n}\n```\n\n![image](images/5b.jpg)Now,\
    \ add statements to display today’s date, current week, and day number of the\
    \ year\n\n```go\ny, m, d := dt.Date()\nfmt.Printf(\"Date: %v %v, %v \\n\", m,\
    \ d, y)\nyr, wk := dt.ISOWeek()\nfmt.Printf(\"Week No.: %v in %v \\n\", wk, yr)\n\
    ```\n\n![image](images/6b.jpg)Finally, add statements to display the current time\
    \ and its millisecond value\n\n```go\nh, mn, s := dt.Clock()\nfmt.Printf(\"Time:\
    \ %v:%v \\n\", h, mn, s)\nns := dt.UnixNano()\nms := ns / 1000000\nfmt.Println(\"\
    Nanoseconds:\", ns)\nfmt.Println(\"Milliseconds:\", ms)\n```\n\n![image](images/7b.jpg)Save\
    \ the program file in a “times” directory, then run the program to see the time\
    \ field values\n\n![image](images/pg115_1.jpg)\n\n![image](images/snake.jpg)\n\
    \nSingle-digit hour, minute, and second values are not returned with a leading\
    \ zero.\n\n## Format Date and Time\n\n![image](images/pg116_1.jpg)\n\nThe date\
    \ and time values within individual fields of a `Time` data type can be formatted\
    \ in a variety of ways using its `Format()` method. This takes a single argument\
    \ that is a “layout” string, which specifies how to format a date/time value.\
    \ The format must only be specified by exactly using elements of this reference\
    \ string:\n\n`Mon Jan 2 15:04:05 2006 MST`\n\nSince MST (Mountain Standard Time)\
    \ is 7 hours behind UTC (Universal Time Coordinated), the reference string can\
    \ alternatively be considered numerically to look like this:\n\n`01 02 03:04:05PM\
    \ '06 -0700`\n\nIf you want the `Format()` method to return only the day, month,\
    \ and time in hh:mm format, the layout can be specified as:\n\n`Mon Jan 2 15:04`\n\
    \nor numerically as:\n\n`01/02 03:04`\n\nYou can have the day name and month name\
    \ returned as full names by specifying the long name versions in the layout:\n\
    \n`Monday January 2 15:04`\n\nThe `time` package includes predefined `UnixDate`,\
    \ `ANSIC`, and `RFC3339` constants that you can use as date/time layout formats.\n\
    \nA custom layout can specify the components in any order to suit different locales\
    \ – for example, for appropriate date formatting.\n\nThe `time` package also includes\
    \ a predefined `Kitchen` constant that you can use as a time layout format. This\
    \ will display the time in a 12-hour format and append “AM” or “PM” as appropriate.\n"
  raw: '***This chapter demonstrates how to manipulate dates and time using the Go
    standard library time package.***


    [**Get Dates**](#chapter08.xhtml_sec54)


    [**Get Times**](#chapter08.xhtml_sec55)


    [**Format Date and Time**](#chapter08.xhtml_sec56)


    [**Set Date and Time**](#chapter08.xhtml_sec57)


    [**Recognize Zones**](#chapter08.xhtml_sec58)


    [**Delay Time**](#chapter08.xhtml_sec59)


    [**Summary**](#chapter08.xhtml_sec60)


    Get Dates


    The Go standard library time package provides functionality to extract specific
    fields from a Time data type that describe a particular point in time. These can
    be made available to a program by importing the time package.


    ![image](images/pg112_1.jpg)


    A date/time instance of a new Time data type can be created with fields describing
    the current date and time using a time.Now( ) function. The fields are initialized
    from the system clock on your device for the current locale.


    The value within an individual field can be retrieved using an appropriate method
    of the Time data type. For example, the value of the year field can be retrieved
    using its Year( ) method. Similarly, there are Month( ), Day( ), and Weekday(
    ) methods that retrieve other individual fields of a Time data type.


    | **Method** | **Returns** |


    | **Now( )** | A **time.Time** data type comprising current date, time, and time
    zone fields |


    | **Year( )** | Year with 4 digits (YYYY) |


    | **Month( )** | Month name of the year |


    | **Day( )** | Day number of the month |


    | **Weekday( )** | Day name of the week |


    There are also these three methods whose returned Time data type values can usefully
    be assigned to variables:


    | **Method** | **Returns** |


    | **Date( )** | Year with 4 digits (YYYY), month name of the year, and day number
    of the month |


    | **ISOWeek( )** | Week number of the year (1-53) and year with 4 digits (YYYY)
    |


    | **YearDay( )** | Day number of the year (1-365/366) |


    It is important to recognize that a Time data type contains individual fields
    and so is not a string. You can, however, convert it to a string using its String(
    ) method:


    ![image](images/snake.jpg)


    The values returned by the **Time** data type methods are not strings.


    ![image](images/1b.jpg)Begin by importing the Go standard library time package
    into a program


    **import (**


    **“fmt”


    “time”**


    **)**


    ![image](images/commons.jpg)


    src\date\main.go


    ![image](images/2b.jpg)Next, create a date/time instance of the Time data type,
    initialized with the current date and time


    **dt := time.Now( )**


    ![image](images/3b.jpg)Add statements to output all fields of the date/time instance
    and to confirm its data type


    **fmt.Printf( “DateTime: %v \n”, dt )**


    **fmt.Printf( “DateTime Type: %T \n”, dt )**


    ![image](images/4b.jpg)Next, add a statement to output today’s day name


    **fmt.Printf( “Today is: %v \n”, dt.Weekday( ) )**


    ![image](images/5b.jpg)Now, add statements to display today’s date, current week,
    and day number of the year


    **y, m, d := dt.Date( )**


    **fmt.Printf( “Date: %v %v, %v \n”, m, d, y )**


    **yr, wk := dt.ISOWeek( )**


    **fmt.Printf( “Week No.: %v in %v \n”, wk, yr )**


    **dy := dt.YearDay( )**


    **fmt.Printf( “Day No.: %v \n”, dy )**


    ![image](images/6b.jpg)Save the program file in a “date” directory, then run the
    program to see the date field values


    ![image](images/pg113_1.jpg)


    ![image](images/hot.jpg)


    The time zone values specify the offset from the UTC (Universal Time Clock) and
    a time zone abbreviation – see [here](#chapter08.xhtml_sec58) for more on time
    zones.


    **Get Times**


    The time values within individual fields of a Time data type can be retrieved
    using appropriate methods. For example, the value of the hour field can be retrieved
    using its Hour( ) method. Similarly, there are Minute( ), Second( ), and Nanosecond(
    ) methods that retrieve other individual fields of a Time data type.


    ![image](images/pg114_1.jpg)


    | **Method** | **Returns** |


    | **Hour( )** | Hour number of the day (0-23) |


    | **Minute( )** | Minute number of the hour (0-59) |


    | **Second( )** | Second number of the minute (0-59) |


    | **Nanosecond( )** | Nanosecond of the second (0-999999999) |


    Unlike other programming languages, the time package in Go does not provide a
    method to return a millisecond value from a Time data type. You can, however,
    divide the nanosecond value by one million to produce its millisecond equivalent.


    There are also these three methods whose returned Time data type values can usefully
    be assigned to variables:


    | **Method** | **Returns** |


    | **Clock( )** | Hour, minute, and second within the day |


    | **Unix( )** | The number of seconds elapsed since the epoch (January 1, 1970
    00:00:00 UTC) |


    | **UnixNano( )** | The number of nanoseconds elapsed since the epoch (January
    1, 1970 00:00:00 UTC) |


    ![image](images/1b.jpg)Begin by importing the Go standard library time package
    into a program


    **import (**


    **“fmt”


    “time”**


    **)**


    ![image](images/commons.jpg)


    src\times\main.go


    ![image](images/2b.jpg)Next, create a date/time instance of the Time data type,
    initialized with the current date and time


    **dt := time.Now( )**


    ![image](images/hot.jpg)


    The **UnixNano( )** method is useful to seed the Go random number generator –
    see the example [here](#chapter09.xhtml_sec68).


    ![image](images/3b.jpg)Add statements to output all fields of the date/time instance
    and to confirm its data type


    **fmt.Printf( “DateTime: %v \n”, dt )**


    **fmt.Printf( “DateTime Type: %T \n\n”, dt )**


    ![image](images/4b.jpg)Next, add statements to evaluate the current hour and display
    an appropriate greeting


    **hr := dt.Hour( )**


    **switch {**


    **case hr < 12 :**


    **fmt.Println( “Good Morning!” )**


    **case hr < 18 :**


    **fmt.Println( “Good Afternoon!” )**


    **default :**


    **fmt.Println( “Good Evening!” )**


    **}**


    ![image](images/5b.jpg)Now, add statements to display the current time


    **h, mn, s := dt.Clock( )**


    **fmt.Printf ( “Time: %v:%v,:%v \n”, h, mn, s )**


    ![image](images/6b.jpg)Finally, add statements to display the current time field
    for nanoseconds and its equivalent millisecond value


    **ns := dt.UnixNano( )**


    **ms := ns / 1000000**


    **fmt.Println( “Nanoseconds:”, ns )**


    **fmt.Println( “Milliseconds:”, ms )**


    ![image](images/7b.jpg)Save the program file in a “times” directory, then run
    the program to see the time field values


    ![image](images/pg115_1.jpg)


    ![image](images/snake.jpg)


    Single-digit hour, minute, and second values are not returned with a leading zero
    by default.


    **Format Date and Time**


    ![image](images/pg116_1.jpg)


    The date and time values within individual fields of a Time data type can be formatted
    in a variety of ways using its Format( ) method. This takes a single argument
    that is a “layout” string, which specifies how to format a date/time value. The
    format must only be specified by exactly using elements of this reference string:


    **Mon Jan 2 15:04:05 2006 MST**


    Since MST (Mountain Standard Time) is 7 hours behind UTC (Universal Time Coordinated),
    the reference string can alternatively be considered numerically to look like
    this:


    **01 02 03:04:05PM ‘06 -0700**


    If you want the Format( ) method to return only the day, month, and time in hh:mm
    format, the layout can be specified as:


    **“Mon Jan 2 15:04”**


    or numerically as:


    **“01/02 03:04”**


    You can have the day name and month name returned as full names by specifying
    the long name versions in the layout:


    **“Monday January 2 15:04”**


    The time package includes predefined UnixDate, ANSIC, and RFC3339 constants that
    you can use as date/time layout formats.


    A custom layout can specify the components in any order to suit different locales
    – for example, for appropriate date formatting.


    The time package also includes a predefined Kitchen constant that you can use
    as a time layout format. This will display the time in a 12-hour format and append
    “AM” or “PM” as appropriate.'
