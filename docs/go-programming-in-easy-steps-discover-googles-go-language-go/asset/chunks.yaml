    ![image](images/2r.jpg)Declare three floating-point variables


    **var rad, area, perim float64**


    ![image](images/3r.jpg)Next, initialize the first variable and display its value
    to two decimal places


    **rad = 4**


    **fmt.Printf( “\nRadius of Circle: %.2f \n”, rad )**


    ![image](images/4r.jpg)Now, calculate the area of a circle based on the given
    radius, then display the area to two decimal places


    **area = math.Pi * ( rad * rad )**


    **fmt.Printf( “\nArea of Circle: %.2f \n”, area )**


    ![image](images/5r.jpg)Then, calculate the perimeter of a circle based on the
