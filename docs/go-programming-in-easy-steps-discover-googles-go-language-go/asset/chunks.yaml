    **import (**


    **“fmt”**


    **“sync”**


    **“time”**


    **)**


    ![image](images/commonp.jpg)


    src\waitgroup\main.go


    ![image](images/2p.jpg)Next, in the main function, create a WaitGroup instance


    **var wg sync.WaitGroup**


    ![image](images/3p.jpg)Now, add a loop to increment the counter and pass the address
    of the WaitGroup as a function argument


    **for i := 1 ; i <= 3 ; i++ {**


    **wg.Add( 1 )**


    **go report ( i, &wg )**


    **}**


    ![image](images/4p.jpg)Finally, in the main function, block until the WaitGroup
    counter reaches zero


    **wg.Wait( )**


    ![image](images/5p.jpg)Now, add a function to confirm the start and end of each
    goroutine, then notify the WaitGroup to stop waiting


    **func report( i int, wg *sync.WaitGroup) {**


    **fmt.Printf( “\nGoroutine %v Started”, i )**


    **time.Sleep( 1 * time.Second )**


    **fmt.Printf( “\n\t\t\tGoroutine %v Ended”, i )**


    **wg.Done( )**


    **}**


    ![image](images/6p.jpg)Save the program file in a “waitgroup” directory, then
    run the program to see the program wait for the goroutines


    ![image](images/pg161_1.jpg)


    ![image](images/hot.jpg)


    You could instead use **defer wg.Done( )** at the start of the function to ensure
    the Waitgroup gets notified of completion.


    **Make Channels**


    Goroutines allow code to be executed concurrently in an independent manner, but
    you can enable goroutines to communicate with each other by the use of “channels”.


    ![image](images/pg162_1.jpg)


    A Go channel is like a pipe through which you can send a message or receive a
    message. It is important to recognize that the sending and receiving actions are
    “blocking” operations – when sending a message, the channel will wait until the
    receiver is ready to accept the message, and when receiving a message, the channel
    will wait until the sender actually delivers the message.


    Channels are created by specifying the chan keyword and a data type as arguments
    to the built-in make( ) function, like this:


    ***channelName* := make( chan *dataType* )**


    You can send a value to the channel using an <- arrow operator to direct a value
    into the channel, with this syntax:


    ***channelName* <- *message***


    Conversely, you can receive a value from a channel using the <- arrow operator
    to direct a value into a variable, with this syntax:


    ***variableName* <- *channelName***


    It is important to ensure that a receiver is not left waiting for a message that
    will never arrive. This would cause a fatal error called “deadlock” – where the
    program can never proceed. To avoid this situation, the sender can specify the
    channel name as an argument to a built-in close( ) function to explicitly close
    the channel when it will not send any more messages.


    The receiver can, optionally, receive a second value that is a boolean that is
    true when the channel is open, and false when the channel is closed.


    ***variableName***, ***channelOpenState* <- *channelName***


    This can be used to examine the channel state, and is useful to exit a loop containing
    a receiver after a channel has definitely closed.


    ![image](images/snake.jpg)


    Only a sender should close a channel – never use a receiver to close a channel
    in case the sender hasn’t finished.


    ![image](images/1p.jpg)Begin by importing the Go standard library time package,
    to allow a delay and get a current time


    **import (**


    **“fmt”**


    **“time”**


    **)**


    ![image](images/commonp.jpg)


    src\channel\main.go


    ![image](images/2p.jpg)Next, in the main function, create a channel for strings


    **c := make( chan string )**


    ![image](images/3p.jpg)Add a goroutine that passes a string value and channel


    **go count( “Message”, c )**


    ![image](images/4p.jpg)Now, add a loop containing a channel receiver that will
    print received messages until the channel gets closed


    **for {**


    **msg, open := <- c**


    **if !open {**


    **break**


    **}**


    **fmt.Println( msg )**


    **}**


    ![image](images/5p.jpg)Now, add the function with a loop containing a channel
    sender that will send messages at 1-second intervals, then close the channel when
    the loop ends


    **func count( msg string, c chan string ) {**


    **for i := 0; i < 3; i++ {**


    **c <- msg + “ at “ + time.Now( ).Format( “04:05” )**


    **time.Sleep( 1 * time.Second )**


    **}**


    **close( c )**


    **}**


    ![image](images/6p.jpg)Save the program file in a “channel” directory, then run
    the program to see the channel messages


    ![image](images/pg163_1.jpg)


    ![image](images/hot.jpg)


    You can refer back [here](#chapter08.xhtml_sec56) for more on time formatting.


    **Buffer Channels**


    Channels are, by default, “unbuffered”. This means that you can only send a message
    into the channel if there exists a corresponding receiver to which the message
    can be delivered.


    ![image](images/pg164_1.jpg)


    As the message sending action is a blocking operation, the message may not be
    deliverable to a corresponding receiver unless the sender is in a separate goroutine
    from the receiver.


    If the receiver is simply listed within the same function block, the blocking
    action of the sender will prevent the program progressing to the receiver – so
    deadlock will occur:


    ![image](images/1p.jpg)Begin a main function by creating a channel for strings


    **c := make( chan string )**


    ![image](images/commonp.jpg)


    src\unbuf \main.go


    ![image](images/2p.jpg)Next, send a message to the channel


    **c <- “Go Programming”**


    ![image](images/3p.jpg)Now, add a receiver and output the message


    **msg := <- c**


    **fmt.Println( msg )**


    ![image](images/4p.jpg)Save the program file in an “unbuf” directory, then run
    the program to see a fatal error deadlock message


    ![image](images/pg164_2.jpg)


    You can overcome this limitation by including a second argument to the built-in
    make( ) function, to specify a buffer size. This allows you to send multiple items
    to the channel as a queue, and it will only block when the buffer capacity is
    exceeded.


    The range keyword can be used in a loop to receive each channel item until the
    channel gets closed.


    ![image](images/forget.jpg)


    The sender in Step 2 blocks, so the program never reaches the receiver in Step
    3.


    ![image](images/1p.jpg)Begin a main function by creating a channel for strings,
    with an arbitrary buffer capacity for 10 string items


    **c := make( chan string, 10 )**


    ![image](images/commonp.jpg)


    src\chanbuf\main.go


    ![image](images/2p.jpg)Next, send one message to the channel


    **c <- “Go Programming”**


    ![image](images/3p.jpg)Now, add a receiver and output the message


    **msg := <- c**


    **fmt.Printf( “\n%v \n\n”, msg )**


    ![image](images/4p.jpg)Then, send several messages to the channel


    **c <- “Go Programming”**


    **c <- “in “**


    **c <- “easy “**


    **c <- “steps”**


    ![image](images/5p.jpg)Now, close the channel after all the messages have been
    sent to the channel


    **close( c )**


    ![image](images/6p.jpg)Add a loop that receives and prints each message sent to
    the channel


    **for msg := range c {**


    **fmt.Println( msg )**


    **}**


    ![image](images/7p.jpg)Save the program file in a “chanbuf” directory, then run
    the program to see the messages sent and received


    ![image](images/pg165_1.jpg)


    ![image](images/hot.jpg)


    You can choose any buffer size – but deadlock will occur if the chosen size is
    exceeded.


    **Select Channels**'
