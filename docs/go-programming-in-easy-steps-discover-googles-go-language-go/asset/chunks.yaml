    **<fieldset>**


    **<legend>Book Lookup</legend>**


    **<form method=”POST” action=”lookup”>**


    **<label>Programming Language</label>**


    **<input name=”Language” type=”text” value=””>**


    **<input type=”submit” value=”Submit” >**


    **</form>**


    **</fieldset>**


    **<img src=”img/power.png” alt=”Power”>**


    **</body>**


    **</html>**


    ![image](images/pg179_2.jpg)


    form.html


    ![image](images/hot.jpg)


    The **POST** method will be tested by the server; the **lookup** value will identify
    a form handler function; and the **Language** value will identify the submitted
    value.


    **Deliver a Static Page**


    The Go standard library net/http package provides three functions that allow a
    web server to easily respond to all HTTP requests with the contents of a nominated
    file system.


    ![image](images/pg180_1.jpg)


    The path of the root file directory is first specified as the argument to an http.Dir(
    ) function. This returns a Dir type that is then specified as the argument to
    an http.FileServer( ) function. This, in turn, returns a handler to respond to
    all HTTP requests with contents from the nominated root file directory.


    Finally, an http.Handle( ) function is used to register the handler. This requires
    two arguments to specify a route pattern and the handler’s name. Typically, the
    pattern “/” is used as the first argument – to match all request paths.


    The web browser can now request any document by name from within the nominated
    root file directory. If the file name is omitted from the request, the server
    will automatically seek a document named index.html to deliver to the browser.


    ![image](images/1o.jpg)At the start of the main function, insert a statement to
    nominate the root directory of files to serve dir := http.Dir( “C:/Users/mike_/go/src/server/htdocs”
    )


    ![image](images/commono.jpg)


    src\server\main.go


    ![image](images/2o.jpg)Next, create a request handler for that file system


    **fileServer := http.FileServer( dir )**


    ![image](images/3o.jpg)Now, register the handler for all HTTP requests


    **http.Handle( “/”, fileServer )**


    ![image](images/4o.jpg)Save the updated program file, then start the web server
    and visit localhost:8000/index.html (or simply visit localhost:8000) to see a
    static index web page


    ![image](images/pg180_2.jpg)


    ![image](images/forget.jpg)


    You will need to edit the path to the root file directory to its location on your
    own system.


    **Log Received Data**


    Having successfully delivered a static index web page, the program can now supply
    a form page for the submission of data.


    ![image](images/pg181_1.jpg)


    The http.Request object has a ParseForm( ) method that populates an http.Request.Form
    object with submitted form input values. A submitted value can then be retrieved
    by specifying the form input name as an argument to an http.Request.FormValue(
    ) method.


    There is also an http.Request.Method object containing the value assigned to the
    form’s HTML method attribute. The “POST” method is preferred for the submission
    of form data.


    If a form submission cannot be parsed, or if the form is using the wrong submission
    method, an error message can be sent to the browser by the http.Error( ) function.
    This requires three arguments to specify the http.ResponseWriter name, an error
    string message, and an HTTP status code – such as 400 (bad request) or 405 (method
    not allowed).


    Submitted form values can be formatted using the Go standard library strings package
    to trim spaces and change case. These values can then be written into a log file
    created using the OpenFile( ) function in the Go os package. The Go standard library
    log package provides a SetOutput( ) function, to specify the log file to write
    to, and a Print( ) function to specify what should be written into the log file.
    This usefully prefixes each item logged with the date and time of writing.


    ![image](images/1o.jpg)Begin by adding instructions to import the Go standard
    library strings, os, and log packages into the previous program


    **import (**


    **“fmt”**


    **“io”**


    **“log”**


    **“net/http”**


    **“os”**


    **“strings”**


    **)**


    ![image](images/commono.jpg)


    src\server\main.go


    ![image](images/2o.jpg)Next, in the main function, register a form handler with
    a route argument that will recognize the name assigned to the form’s HTML action
    attribute


    **http.HandleFunc( “/lookup”, formHandler )**


    ![image](images/hot.jpg)


    Go provides constants for each HTTP status code, such as 200 with **http.StatusOk**.
    See the documentation at [golang.org/pkg/net/http](http://www.golang.org/pkg/net/http)
    for the full list of codes.


    ![image](images/3o.jpg)After the main function, begin the form handler with validation
    that checks the submission method as


    **{**


    **if r.Method != “POST” {**


    **http.Error( w, “Method Not Allowed”, 405 )**


    **return**


    **}**


    **// Statements to be inserted here**.


    **}**


    ![image](images/commono.jpg)


    src\server\main.go


    ![image](images/4o.jpg)Next, in the form handler, insert statements to parse the
    form data or return an error message to the browser


    **err := r.ParseForm( )**


    **if err != nil {**


    **http.Error( w, “Bad Request”, 400 )**


    **return**


    **}**


    ![image](images/5o.jpg)Now, in the form handler, insert statements to format a
    submitted value by removing spaces and changing case


    **lang := r.FormValue( “Language” )**


    **lang = strings.ToLower( strings.Trim( lang, “ “ ) )**'
