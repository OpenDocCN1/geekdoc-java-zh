  trans: "\n上一个示例这里中描述的 for 循环的替代方案在 `for` 关键字之后只包含一个测试表达式 – 它在循环语句的开头不包含初始化器或递增器。相反，它使用一个已经初始化的计数器变量，并在循环体内增加计数器。这是\
    \ Go 对其他编程语言中“while”循环的等实现，因为只要测试表达式为真，循环就会继续迭代。递增器必须在某个时刻使测试表达式变为为假以结束循环，否则将创建一个永远不会结束的死循环。这种类型\
    \ for 循环的语法如下：\n\n```\ninitializer\nfor test-expression {\n    statements-to-be-executed\n\
    \    incrementer\n}\n```\n\nGo 编程中循环结构的另一种变体，允许你甚至从起始语句中省略测试表达式，并使用包含在循环体内的测试表达式的无限循环。它同样使用一个已经初始化的计数器变量，并在循环体内增加计数器。这是\
    \ Go 对其他编程语言中“do-while”循环的等实现，因为只要测试表达式为真，循环就会执行其语句并继续迭代。当测试表达式变为假时，可以使用 `break`\
    \ 关键字终止循环，因此这种类型 for 循环的语法如下：\n\n```\ninitializer\nfor {\n    statements-to-be-executed\n\
    \    incrementer\n    if test-expression {\n        statements-to-be-executed\n\
    \        break\n    }\n}\n```\n\n注意，如果测试表达式在第一次求值时为假，“while”循环将不会进行任何迭代，而“do-while”循环将至少进行一次迭代，因为它的语句在评估之前就已经执行了。\n\
    \n![image](img/hot.jpg)\n\n如果程序运行了无限循环，在 Windows 或 Linux 系统上按下 `Ctrl` + `C` 键盘键来停止循环执行。\n\
    \n![image](img/1p.jpg)开始一个执行五次迭代的 main 函数\n\n```\nfunc main( ) {\n    counter\
    \ := 1\n    for counter <= 5 {\n        fmt.Println( “Loop Iteration”, counter\
    \ )\n        counter++\n    }\n    // 在此处插入语句。\n}\n```\n\n![image](img/commonp.jpg)\n\
    \nsrc\\while\\main.go\n\n![image](img/2p.jpg)接下来，插入一个无限循环语句\n\n```\ni := 10\n\
    for {\n    fmt.Println( “\\t\\t\\tCountdown”, i )\n    i--\n    // 在此处插入测试表达式。\n\
    }\n```\n\n![image](img/3p.jpg)现在，插入一个结束循环的测试表达式\n\n```\nif i < 1 {\n    fmt.Println(\
    \ “\\t\\t\\t\\t\\tLift Off!” )\n    break\n}\n```\n\n![image](img/4p.jpg)将程序文件保存到“while”目录中，然后运行程序以查看每次循环迭代的输出\n\
    \n![image](img/pg55_1.jpg)\n\n![image](img/pg55_2.jpg)\n\n![image](img/forget.jpg)\n\
    \n将变量 `i` 的初始值改为 `0`（零）并再次运行程序，查看循环的第一次迭代执行执行。\n\n### 跳出循环\n\n当满足指定条件时，可以使用 `break`\
    \ 关键字提前终止任何循环。`break` 语句位于循环语句块内部，其前面有一个测试表达式。当测试返回真时，循环立即结束，程序继续执行下一个任务。例如，在嵌套内部循环中，它将进入外层循环的下一次迭代。\n\
    \n![image](img/pg56_1.jpg)\n\n当满足指定条件时，可以使用 `continue` 关键字跳过循环的单次迭代。`continue`\
    \ 语句循环语句块内部，其前面有一个测试表达式。当测试返回真时，该迭代结束。\n\n![image](img/1p.jpg)开始一个执行三次迭代的 main\
    \ 函数\n\n```\nfunc main( ) {\n    for i := 1 ; i <= 3 ; i++ {\n        // 在此处插入内部循环。\n\
    \    }\n}\n```\n\n![image](img/commonp.jpg)\n\nsrc\\break\\main.go\n\n![image](img/2p.jpg)插入一个执行三次迭代的内部循环\n\
    \n```\n// 在此处插入语句。\nfor j := 1 ; j <= 3 ; j++ {\n    fmt.Println( “Running i=”,\
    \ i, “j=”, j )\n}\n```\n\n![image](img/3p.jpg)将程序文件保存到“break”目录中，然后运行程序以查看每次循环迭代的输出\n\
    \n![image](img/pg56_2.jpg)\n\n![image](img/hot.jpg)\n\n你也可以 `break` 到嵌套代码块之外特定点的标签——请查看此处的示例。\n\
    \n![image](img/4p.jpg)接下来，将此 break 语句插入内部循环块的最开始，以跳出内部循环\n\n```go\nif i == 2 &&\
    \ j == 2 {\n    fmt.Println( “Breaks When i=”, i, “and j=”, j )\n    break\n}\n\
    ```\n\n![image](img/5p.jpg)保存更新后的文件，然后运行程序以查看内部循环终止\n\n![image](img/pg57_1.jpg)\n\
    \n![image](img/6p.jpg)现在在 break 语句之前插入 continue 语句——跳过内部循环的第二次迭代\n\n```go\nif\
    \ i == 3 && j == 2 {\n    fmt.Println( “Continues When i=”, i, “and j=”, j )\n\
    \    continue\n}\n```\n\n![image](img/7p.jpg)保存更新后的文件，然后再次运行程序以查看内部循环跳过第二次迭代\n\
    \n![image](img/pg57_1)\n\n![image](img/forget.jpg)\n\n当外层循环尝试执行第三次时，continue 语句跳过了内部循环。\n\
    \n![image](img/forget.jpg)\n\n### 跳转标签\n\n`goto` 关键字乍看起来是一个很棒的功能，因为它允许程序流跳转到任何位置的标签，就像网页上的超链接一样。然而，实际上这会导致错误，这种用法是不受欢迎的。\n\
    \n![image](img/pg58_1.jpg)\n\n`goto` 关键字是一个存在几十年的强大功能，但被早期程序员滥用，创建了难以理解的程序。这产生了不可读的代码，因此\
    \ goto 的使用不再流行。通常，程序可能会执行一组语句，然后通过 goto 语句跳转回语句开头的标签以重复执行。此外，在语句执行的某处可能会测试条件，如果未满足条件，另一个\
    \ goto 语句可能会跳转到语句之后。通过这种方式，程序代码迅速获得了大量的 goto 语句和标签。\n\n`goto` 关键字的一种可能的合法用法是跳转到外层循环块结束之后的标签，从而干净地跳出嵌套循环。这会立即退出两个循环，不再执行任何循环的后续迭代。\n\
    \n![image](img/1p.jpg)开始一个执行三次迭代的 main 函数\n\n```go\nfunc main( ) {\n    for i\
    \ := 1 ; i <= 3 ; i++ {\n        // 在此处插入内部循环。\n    }\n}\n```\n\n![image](img/commonp.jpg)\n\
    \nsrc\\jump\\main.go\n\n![image](img/2p.jpg)插入一个执行三次迭代的内部循环\n\n```go\nfor j :=\
    \ 1 ; j <= 3 ; j++ {\n    fmt.Println( “Running i=”, i, “j=”, j )\n}\n```\n\n\
    ![image](img/3p.jpg)将程序文件保存到“jump”目录中，然后运行程序以查看每次循环迭代的输出\n\n![image](img/pg59_1.jpg)\n\
    \n![image](img/4p.jpg)在内部嵌套循环的第一行插入语句，在指定的计数器值跳转到名为“end”的标签\n\n```go\nif i ==\
    \ 2 && j == 2 {\n    goto end\n}\n```\n\n![image](img/5p.jpg)现在，在外层循环闭合括号 **}**\
    \ 之后的下一行添加标签\n\n```go\nend:\n```\n"
