    \ `nil`。对于英语语言来说，写入的字节数通常代表输出的字符数——包括字符串中包含的不可打印字符。\n\n![image](img/hot.jpg)\n\
    \n非打印字符 `\\t` 制表符的 ASCII 码为 9，非打印字符 `\\n` 换行符的 ASCII 码为 10。\n\n![image](img/1r.jpg)首先在程序中导入\
    \ Go 标准库 strings 包\n\n```go\nimport (\n\t\"fmt\"\n\t\"strings\"\n)\n```\n\n![image](img/commonr.jpg)\n\
    \n`src\\join\\main.go`\n\n![image](img/2r.jpg)初始化两个字符串变量和一个拼接字符串\n\n```go\ns1,\
