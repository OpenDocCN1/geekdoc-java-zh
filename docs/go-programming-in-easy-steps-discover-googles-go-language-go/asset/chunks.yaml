    \ – an invaluable resource.\n\n## Run a Go Program\n\nGo program code is compiled\
    \ and executed using the Go tools. During program development, an error-free Go\
    \ program can be compiled and run by the `go run` tool. This is useful, but if\
    \ you want to create an executable binary file version that can be executed repeatedly\
