- fmt: "\n# Write Files\n\nThe Go standard library contains the `ioutil` (input/output\
    \ utility) package that provides functions to write text files. You make this\
    \ available to your program by importing `io/ioutil`.\n\nThe `ioutil` package’s\
    \ `WriteFile()` function takes three arguments: specify the path to the file to\
    \ be written, a `[]byte` slice of text to be written, and numerical file permissions.\
    \ This function returns an error message if the attempt to write fails, or `nil`\
    \ value if the file gets successfully written.\n\nFor finer control when writing\
    \ text files, you can use the `os` package’s `OpenFile()` function. This requires\
    \ three arguments: specify the path of the file to be written, a flag specifying\
    \ the operation type, and numerical file permissions. The flags specifying the\
    \ operation type are `os` package constants. For example: \n- `os.O_RDWR` to read\
    \ and write\n- `os.O_APPEND` to append text\n- `os.O_CREATE` to create a new file\
    \ if none exists\n\nThe `OpenFile()` function returns an `os.File` type and any\
    \ read error. The file type has `Write()` and `Close()` methods that allow you\
    \ to process the file’s content. The `Write()` method requires a `[]byte` argument\
    \ containing the text to be written. This method returns the number of bytes read\
    \ and any read error. The `Close()` method can be called with the `defer` keyword\
    \ immediately after opening a file, to close the file at the end of the enclosing\
    \ function after file operations complete.\n\n## Implementation\n\nBegin by importing\
    \ the Go standard library `ioutil` and `os` packages into a program to write a\
    \ text file:\n\n```go\nimport (\n    \"fmt\"\n    \"io/ioutil\"\n    \"os\"\n\
    )\n```\n\n### src\\write\\main.go\n\nNext, add a function to check for write errors:\n\
    \n```go\nfunc check(err error) {\n    if err != nil {\n        fmt.Println(err)\n\
    \    }\n}\n```\n\nThere are several operation type flags, and multiple flags can\
    \ be specified to the `OpenFile()` function. For more details, refer to the documentation\
    \ at [golang.org/pkg/os/#OpenFile](http://www.golang.org/pkg/os/#OpenFile).\n\n\
    Now, in the `main` function, write an entire text file, then check for errors:\n\
    \n```go\ntxt := []byte(\"\\nA thousand suns will stream on thee,\\nA thousand\
    \ moons will quiver.\\n\")\nerr := ioutil.WriteFile(\"C:/Textfiles/Farewell.txt\"\
    , txt, 0644)\ncheck(err)\n```\n\nNext, open the same text file for an append operation,\
    \ then check for errors and remember to close the file:\n\n```go\nfile, err :=\
    \ os.OpenFile(\"C:/Textfiles/Farewell.txt\", os.O_APPEND, 0644)\ncheck(err)\n\
    defer file.Close()\n```\n\nNow, append text to the existing file content and check\
    \ for errors:\n\n```go\nslice := []byte(\"by Alfred Lord Tennyson.\\n\")\nnb,\
    \ err := file.Write(slice)\ncheck(err)\n```\n\nFinally, display the starting position,\
    \ the number of characters read, and the text that has read:\n\n```go\nfmt.Printf(\"\
    \\n%v bytes @ %v: \", nb, pos)\nfmt.Printf(\"%v\\n\", string(slice))\n```\n\n\
    ## Temporary Files\n\nIt is sometimes useful to create a temporary file during\
    \ execution. The `ioutil` package has `TempFile()` for this purpose. You specify\
    \ the directory as an empty string for the default directory, and a filename pattern.\
    \ If the pattern includes a `*` wildcard character, the generated string will\
    \ replace that character.\n\nWhen `TempFile()` successfully creates a temporary\
    \ file, it automatically opens that file ready to write and read. The returned\
    \ file type has `Name()` method with which to reference its path, including random\
    \ string. You can employ its `Write()` and `WriteString()` methods to add text\
    \ content. The `Close()` method can be called with the `defer` keyword immediately\
    \ after opening a file, to close the file at the end of the enclosing function.\n\
    \nAs with other files, the temporary file’s content can be read using the `ioutil.ReadFile()`\
    \ function. You can delete a temporary file when it is no longer required by specifying\
    \ its file name as the argument to `os.Remove()` function. You can also examine\
    \ the temporary file (and other files) by specifying a file name as the argument\
    \ to the `os.Stat()` function. This returns an `info` type, plus an error message\
    \ or `nil`.\n\n### src\\temp\\main.go\n\nBegin by importing the Go standard library\
    \ `ioutil` and `os` packages into a program to process a temporary file:\n\n```go\n\
    import (\n    \"fmt\"\n    \"io/ioutil\"\n    \"os\"\n)\n```\n\nNext, add a function\
    \ to check for errors:\n\n```go\nfunc check(err error) {\n    if err != nil {\n\
    \        fmt.Println(err)\n    }\n}\n```\n\nNow, in the `main` function, create\
