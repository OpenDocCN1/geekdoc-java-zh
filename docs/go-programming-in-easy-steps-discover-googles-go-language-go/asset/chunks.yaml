    that your code requires, and mistyped or invalid code. The Go compiler can also
    generate executable binaries for other operating systems. This enables you to
    compile your source code to run on multiple machines.


    **Concurrency**


    The Go language provides inherent support for concurrency with goroutines and
    channels. This enables you to write multi-threaded programs that could perform
    multiple tasks at the same time.


    **Garbage Collection**


    Automatic memory management is a key feature of the Go language. Its garbage collector
    runs concurrently with the program. This enables you to write program code without
    any concern for memory leakage.


    **Static Typing**


    Go is a statically typed language in which variables are explicitly declared to
    be of a particular fixed type. This enables errors to be caught early in the development
    process.


    You may well recognize other advantages as you gain experience with the Go language,
    but right now it’s time to get started…


    **Install the Go Tools**


    To get started with the Go programming language, you must first install the Go
    tools on your PC. These allow you to build, run, and test programs written in
    the Go language. The Go tools are supplied together with lots of standard packages
    of useful trusted code that you can import into your own programs. The Go language
    installers are available for Windows, macOS and Linux.


    ![image](images/pg10_1.jpg)


    ![image](images/1b.jpg)Open a web browser and visit **[https://golang.org](https://golang.org)**
    then download the appropriate installer for your system


    ![image](images/pg10_2.jpg)


    ![image](images/2b.jpg)When the download has completed, run the installer to launch
    the “Go Programming Language Setup Wizard”


    ![image](images/pg10_3.jpg)


    ![image](images/3b.jpg)Click **Next** to continue, then accept the license terms


    ![image](images/4b.jpg)Accept the suggested **Destination Folder** (at C:\Go on
    Windows), then click **Install** to complete the installation


