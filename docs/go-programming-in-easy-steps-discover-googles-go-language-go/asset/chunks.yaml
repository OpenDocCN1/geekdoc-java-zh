    ![image](img/hot.jpg)\n\nGo 标准库还有一个 `errors` 包，可以用于操作自定义错误。\n\n![image](img/1o.jpg)创建一个需要整数参数并返回整数值和错误的函数\n\
    \n```go\nfunc isPosInt( num int ) ( int, error ) {\n    // 在此处插入语句。\n}\n```\n\n\
    ![image](img/commono.jpg)\n\n`src\\err\\main.go`\n\n![image](img/2o.jpg)接下来，插入一个条件测试，根据参数的值返回错误或参数值\n\
    \n```go\nif num < 1 {\n    err := fmt.Errorf( “%v not a positive integer”, num\
    \ )\n    return -1, err\n}\nreturn num, nil\n```\n\n![image](img/3o.jpg)现在，添加一个\
    \ main 函数，该函数包含一个递减循环，用于打印参数值或错误消息\n\n```go\nfunc main( ) {\n    for i := 2 ;\
    \ i >= -2 ; i-- {\n        res, err := isPosInt( i )\n        if err != nil {\n\
    \            fmt.Println( “Failed:”, err )\n        } else {\n            fmt.Println(\
    \ res, “Passed!” )\n        }\n    }\n}\n```\n\n![image](img/4o.jpg)将程序文件保存到 “err”\
    \ 目录中，然后运行程序以查看测试失败时的错误消息\n\n![image](img/pg77_1.jpg)\n\n![image](img/forget.jpg)\n\
    \n# 分离文件\n\n随着程序规模增大，将代码部分划分到单独文件中通常是明智的。在创建可能实用的自定义包时，将它们存储在与包同名的目录中。要使用导入包的函数，其名称必须以大字母开头。\n\
    \n![image](img/1o.jpg)首先，编写带有包声明的 verify.go 文件\n\n```go\npackage verify\n\nimport\
    \ “fmt”\n```\n\n![image](img/commono.jpg)\n\n`src\\verify\\verify.go`\n\n![image](img/2o.jpg)添加验证函数——但将其名称改为大字母开头\n\
    \n```go\n// IsPosInt 测试正整数\nfunc IsPosInt( num int ) ( int, error ) {\n    if\
    \ num < 1 {\n        err := fmt.Errorf( “%v not a positive integer”, num )\n \
    \       return -1, err\n    }\n    return num, nil\n}\n```\n\n![image](img/3o.jpg)将文件保存在\
    \ src 文件夹内的 verify 目录中\n\n执行命令 `go install verify` 在你的 `go/pkg` 文件夹中创建一个名为 `verify.a`\
    \ 的编译存档文件\n\n![image](img/4o.jpg)\n\n创建 Go 存档包意味着每次编译导入文件时，工具文件都不重新编译\n\n![image](img/5o.jpg)接下来，编写带有包和导入声明的\
    \ main.go 程序\n\n```go\npackage main\n\nimport (\n    “fmt”\n    “verify”\n)\n\
    ```\n\n![image](img/commono.jpg)\n\n`src\\prog\\main.go`\n\n![image](img/6o.jpg)现在，添加\
    \ main 函数，在导入的函数名前前加上包名\n\n```go\nfunc main( ) {\n    for i := 2 ; i >= -2 ; i--\
    \ {\n        res, err := verify.IsPosInt( i )\n        if err != nil {\n     \
    \       fmt.Println( “Failed:”, err )\n        } else {\n            fmt.Println(\
    \ res, “Passed!” )\n        }\n    }\n}\n```\n\n![image](img/7o.jpg)将程序文件保存到 “prog”\
    \ 目录中，然后执行命令 `go build prog` 在你的 `go/src` 文件夹中创建一个名为 `prog.exe`（Windows 上）的编译可执行文件\n\
    \n![image](img/8o.jpg)最后，输入命令 `prog`（Linux 上为 `./prog`）运行程序并查看测试失败时的错误消息\n\n**总结**\n\
    \n导入多个包时，导入声明必须在括号内逐行列出这些包。\n\n"
