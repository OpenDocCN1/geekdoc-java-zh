    \ - %v \\n”, nb, string( txt ) )\n```\n\n![image](images/6g.jpg)Remember to close\
    \ the file after processing completes\n\n```go\ntmpFile.Close( )\n```\n\n![image](images/7g.jpg)Then,\
    \ delete the temporary file\n\n```go\nos.Remove( tmpFile.Name( ) )\n```\n\n![image](images/8g.jpg)Finally,\
    \ attempt to examine the (now removed) temporary file and check for errors\n\n\
    ```go\n_, err = os.Stat( tmpFile.Name( ) )\ncheck( err )\n```\n\n![image](images/9g.jpg)Save\
    \ the program file in a “temp” directory, and run the program to create, write,\
    \ read, and delete a temporary file\n\n![image](images/pg155_1.jpg)\n\n![image](images/forget.jpg)\n\
    \nThe `_` blank identifier represents the info type that is not used in this program.\n\
    \n### Summary\n\n- The Go standard library `fmt` package provides `Scan()`, `Scanln()`,\
    \ and `Scanf()` functions to read from standard input.\n- The `Scan()`, `Scanln()`,\
    \ and `Scanf()` functions each return two values of the number of items scanned\
    \ and any read error.\n- If no error is encountered when reading from standard\
    \ input, the returned error value will be `nil`.\n- The Go standard library `bufio`\
    \ package provides a `Scanner` type, which is a memory buffer for data streams.\n\
    - A `Scanner` has a `Scan()` method to read input, a `Text()` method to return\
    \ text, and an `Err()` method to return errors.\n- The Go standard library `strings`\
    \ package provides a `Fields()` function that can split a string into individual\
    \ words.\n- The Go standard library `os` package provides an `Args` slice, which\
    \ stores command-line argument values in elements.\n- The Go standard library\
    \ `flag` package has `String()`, `Int()`, and `Bool()` functions that each specify\
    \ a flag name, default value, and a help message.\n- The `flag` package’s `Parse()`\
    \ function applies the user’s values to a flag.\n- The Go standard library `io`\
    \ package contains an `ioutil` package that provides a `ReadFile()` function to\
    \ read an entire text file.\n- The Go standard library `os` package has `Open()`,\
    \ `Read()`, `Seek()`, and `Close()` methods to process a text file’s content.\n\
    - The `Close()` method can be called with the `defer` keyword to close a file\
    \ later, after all file operations complete.\n- The Go standard library `io/ioutil`\
    \ package provides a `TempFile()` function to create temporary files.\n- The `TempFile()`\
    \ function returns an `os.File` type that has `Name()`, `Write()`, `WriteString()`,\
    \ and `Close()` methods to add content to a temporary file.\n- The `os.Remove()`\
    \ function can delete files, and the `os.Stat()` function can examine file information.\n\
    \n11\n\n# Employ Concurrency\n\n*This chapter demonstrates how to use goroutines\
    \ and channels to perform concurrent execution of tasks in Go programs.*\n\n-\
    \ [Create Goroutines](#chapter11.xhtml_sec77)\n- [Keep Waiting](#chapter11.xhtml_sec78)\n\
    - [Make Channels](#chapter11.xhtml_sec79)\n- [Buffer Channels](#chapter11.xhtml_sec80)\n\
    - [Select Channels](#chapter11.xhtml_sec81)\n- [Synchronize Goroutines](#chapter11.xhtml_sec82)\n\
    - [Use Worker Pools](#chapter11.xhtml_sec83)\n- [Summary](#chapter11.xhtml_sec84)\n\
    \n## Create Goroutines\n\nGo programs, like those written in other programming\
    \ languages, generally execute their code line-by-line in a sequential manner.\
    \ But Go programming also supports “goroutines” that provide the ability for lines\
    \ of code to be executed concurrently, side-by-side. This is a big reason why\
    \ many people choose Go programming.\n\n![image](images/pg158_1.jpg)\n\nConcurrency\
    \ provides the potential to take advantage of multi-core processors, but it is\
    \ important to distinguish the difference between concurrency and parallelism:\n\
    \n- **Parallelism** is when two tasks are performed at exactly the same time.\
    \ For example, on a multi-core processor when one core is performing a task and\
    \ another core is performing a different task – simultaneously. This, however,\
    \ is difficult to achieve with program code that is executed line-by-line.\n\n\
    ![image](images/pg158_2.jpg)\n\n- **Concurrency** is the separation of program\
    \ code into independently-executing tasks that could potentially run simultaneously\
    \ and produce a correct final result. So a concurrent program is one that can\
    \ be parallelized. Goroutines provide this ability in Go program code.\n\n![image](images/pg158_3.jpg)\n\
    \n![image](images/pg158_4.jpg)\n\nGoroutines are lightweight threads that can\
    \ execute concurrently. A sequential program with multiple function calls will\
    \ execute each function in turn, but a concurrent program with goroutines allows\
    \ multiple functions to be active at the same time.\n\nA goroutine is created\
    \ by inserting the `go` keyword before an ordinary function call or method call.\
    \ The order in which tasks are executed is determined internally by the Go scheduler.\n\
    \n![image](images/1p.jpg)Begin by importing the Go standard library `time` package\
    \ into a program, to allow delay for a goroutine to execute\n\n```go\nimport (\n\
    \"fmt\"\n\"time\"\n)\n```\n\n![image](images/common.jpg)src\\goroutine.main\n\n\
    ![image](images/2p.jpg)\n\n```go\nfunc count(item string) {\n    for i := 1; i\
    \ <= 3; i++ {\n        fmt.Printf(\"%v %v \", i, item)\n        time.Sleep(1 *\
    \ time.Second)\n    }\n}\n```\n\n![image](images/3p.jpg)Now, in the main function,\
    \ add function calls to execute sequentially\n\n```go\nfmt.Println(\"\\nLine-by-Line\
    \ Execution...\")\ncount(\"moose\")\ncount(\"sheep\")\n```\n\n![image](images/4p.jpg)Then,\
    \ in the main function, add a goroutine and an ordinary function call to execute\
    \ concurrently\n\n```go\nfmt.Println(\"\\nConcurrent Execution...\")\ngo count(\"\
    moose\")\ncount(\"sheep\")\n```\n\n![image](images/5p.jpg)Save the program file\
    \ in a “goroutine” directory, then run the program to see the differing output\n\
    \n![image](images/pg159_1.jpg)\n\n![image](images/hot.jpg)\n\nYou can also start\
    \ goroutines from self-invoking functions.\n\n![image](images/snake.jpg)\n\nBy\
    \ default, a program will exit when the main goroutine completes – regardless\
