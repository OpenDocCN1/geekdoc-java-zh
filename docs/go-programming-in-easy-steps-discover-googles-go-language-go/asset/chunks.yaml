    \ |\n| `%` | 取余 |\n| `++` | 加一 |\n| `--` | 减一 |\n\n赋值、加、减、乘、除运算符的行为正如你预期的的那样，但在使用多个运算符时，必须对表达式进行分组——最内层\
    \ `( )` 括号内的操作优先执行：\n\n```go\na = b * c - d % e / f ;             // 这不明确。\na\
    \ = ( b * c ) - ( ( d % e ) / f ) ; // 这更清晰。\n```\n\n`%` 取余运算符将第一个给定的数除以第二个给定的数，并返回操作的余数。这对于判断一个数是奇数还是偶数有用。\n\
    \n`++` 加一运算符和 `--` 减一运算符会将给定的数改变一并返回结果。它们最常用于循环中的迭代计数——在每次迭代中通过 `++` 加一运算符递增，或在每次迭代中通过\
    \ `--` 减一运算符递减。\n\n`++` 加一或 `--` 减一运算符必须紧跟变量名之后以改变其值。例如：\n\n```go\nn := 4\nn++\
    \             // 现在 n = 5.\n```\n\n![image](img/forget.jpg)\n\n`+` 运算符双用途——它也被用于连接字符串。\n\
    \n![image](img/hot.jpg)\n\n用于与运算符组合形成表达式的值被称为“操作数”——在表达式 `2 + 3` 中，数值 `2` 和 `3`\
    \ 就是操作数。\n\n![image](img/1g.jpg) 在你的“src” 文件夹内创建一个名为“arith”的目录\n\n![image](img/commong.jpg)\n\
    \n`src\\arith\\main.go`\n\n![image](img/2g.jpg) 开始一个带有包声明和导入的 main.go 程序\n\n```go\n\
    package main\nimport \"fmt\"\n```\n\n![image](img/3g.jpg) 添加一个声明并初始化两个变量的 main\
    \ 函数\n\n```go\nfunc main( ) {\n    a := 8\n    b := 4\n    // 在此处插入语句。\n}\n```\n\
    \n![image](img/4g.jpg) 在 main 函数中，插入语句以输出每次算术运算后的结果总值\n\n```go\nfmt.Println( \"\
    Addition:\\t\", ( a + b ) )\nfmt.Println( \"Subtraction:\\t\", ( a - b ) )\nfmt.Println(\
    \ \"Multiplication:\\t\", ( a * b ) )\nfmt.Println( \"Division:\\t\", ( a / b\
    \ ) )\nfmt.Println( \"Remainder:\\t\", ( a % b ) )\n```\n\n![image](img/5g.jpg)\
    \ 现在，插入语句来更改存储的值并显示它们的新值\n\n```go\na++\nfmt.Println( \"Increment:\\t\", a )\n\
    b--\nfmt.Println( \"Decrement\\t\", b )\n```\n\n![image](img/6g.jpg) 将程序文件保存到“arith”目录中，然后运行程序查看每次操作的结果\n\
    \n![image](img/pg35_2.jpg)\n\n![image](img/forget.jpg)\n\n在这里，使用转义序列 `\\t` 输出制表符以对齐结果。\n\
    \n## 赋值\n\n![image](img/pg36_1.jpg)\n\nGo 编程中用于赋值的运算符列如下所示。除了简单的 `=` 赋值运算符外，所有运算符都是较长表达式的简写形式，因此为了清晰起见，给出了等效形式：\n\
    \n| 运算符 | 示例 | 等效于 |\n| :--- | :--- | :--- |\n| `=` | `a = b` | `a = b` |\n| `+=`\
    \ | `a += b` | `a = ( a + b )` |\n| `-=` | `a -= b` | `a = ( a - b )` |\n| `*=`\
    \ | `a *= b` | `a = ( a * b )` |\n| `/=` | `a /= b` | `a = ( a / b )` |\n| `%=`\
    \ | `a %= b` | `a = ( a % b )` |\n\n在上面的赋值示例中，`a = b`，名为“a”的变量被赋值为名为“b”的变量包含的值——这样该值就存储在\
    \ `a` 变量中。从技术上讲，赋值运算符将右操作数的值存储在左操作数所指定的内存位置中，然后返回该值作为结果。\n\n`+=` 复合运算符用于将一个值加到变量存储的现有值上。在上面的示例中，`a\
    \ += b`，变量 `b` 的值加到变量 `a` 中——总和就是存储在 `a` 变量中的值。\n\n`%` 复合运算符将第一个给定的数除以第二个给定的数并返回操作的余数。这对于判断一个数是奇数还是偶数有用。\n\
    \n`++` 加一运算符和 `--` 减一运算符会将给定的数改变一并返回结果。它们最常用于循环中的迭代计数——在每次迭代中通过 `++` 加一运算符递增，或在每次迭代中通过\
    \ `--` 减一运算符递减。\n\n`++` 加一或 `--` 减一运算符必须紧跟变量名之后以改变其值。例如：\n\n```go\nn := 4\nn++\
    \             // 现在 n = 5.\n```\n\n（注：此处后续原文存在大量重复的描述性文本，已根据要求保留核心逻辑翻译并去重）\n\n\
    ...在表达式 `2 + 3` 中，数值 `2` 和 `3` 是操作数。`+=` 复合运算符用于将一个值加到变量存储的现有值上...（重复内容略）\n\n\
    等待，![image](img/1g.jpg) 在你的“src” 文件夹内创建一个名为“arith”的目录\n\n![image](img/commong.jpg)\n\
    \n`src\\arith\\main.go`\n\n![image](img/2g.jpg) 开始一个带有包声明和导入的 main.go 程序\n\n```go\n\
    package main\nimport \"fmt\"\n```\n\n![image](img/3g.jpg) 添加一个声明并初始化两个变量的 main\
