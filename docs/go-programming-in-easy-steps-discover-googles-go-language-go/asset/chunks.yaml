    11


    **Employ Concurrency**


    ***This chapter demonstrates how to use goroutines and channels to perform concurrent
    execution of tasks in Go programs.***


    [**Create Goroutines**](#chapter11.xhtml_sec77)


    [**Keep Waiting**](#chapter11.xhtml_sec78)


    [**Make Channels**](#chapter11.xhtml_sec79)


    [**Buffer Channels**](#chapter11.xhtml_sec80)


    [**Select Channels**](#chapter11.xhtml_sec81)


    [**Synchronize Goroutines**](#chapter11.xhtml_sec82)


    [**Use Worker Pools**](#chapter11.xhtml_sec83)


    [**Summary**](#chapter11.xhtml_sec84)


    Create Goroutines


    Go programs, like those written in other programming languages, generally execute
    their code line-by-line in a sequential manner. But Go programming also supports
    “goroutines” that provide the ability for lines of code to be executed concurrently,
    side-by-side. This is a big reason why many people choose Go programming.


    ![image](images/pg158_1.jpg)


    Concurrency provides the potential to take advantage of multi-core processors,
    but it is important to distinguish the difference between concurrency and parallelism:


    •**Parallelism** is when two tasks are performed at exactly the same time. For
    example, on a multi-core processor when one core is performing a task and another
    core is performing a different task – simultaneously. This, however, is difficult
    to achieve with program code that is executed line-by-line.


    ![image](images/pg158_2.jpg)


    •**Concurrency** is the separation of program code into independently-executing
    tasks that could potentially run simultaneously and produce a correct final result.
    So a concurrent program is one that can be parallelized. Goroutines provide this
    ability in Go program code.


    ![image](images/pg158_3.jpg)


    ![image](images/pg158_4.jpg)


    Goroutines are lightweight threads that can execute concurrently. A sequential
    program with multiple function calls will execute each function in turn, but a
    concurrent program with goroutines allows multiple functions to be active at the
    same time.


    A goroutine is created by inserting the go keyword before an ordinary function
    call or method call. The order in which tasks are executed is determined internally
    by the Go scheduler.


    ![image](images/1p.jpg)Begin by importing the Go standard library **time** package
    into a program, to allow delay for a goroutine to execute


    **import (**


    **“fmt”**


    **“time”**


    **)**


    ![image](images/commonp.jpg)


    src\goroutine\main.go


    ![image](images/2p.jpg)Add a function containing a loop to print the iteration
    number and a string argument at 1-second intervals


    **func count( item string ) {**


    **for i := 1 ; i <= 3 ; i++ {**


    **fmt.Printf( “%v %v “, i, item )**


    **time.Sleep( 1 * time.Second )**


    **}**


    **fmt.Println( )**


    **}**


    ![image](images/3p.jpg)Now, in the main function, add ordinary function calls
    to execute sequentially


    **fmt.Println( “\nLine-by-Line Execution…” )**


    **count( “moose” )**


    **count( “sheep” )**


    ![image](images/4p.jpg)Then, in the main function, add a goroutine and an ordinary
    function call to execute concurrently


    **fmt.Println( “\nConcurrent Execution…” )**


    **go count( “moose” )**


    **count( “sheep” )**


    ![image](images/5p.jpg)Save the program file in a “goroutine” directory, then
    run the program to see the differing output


    ![image](images/pg159_1.jpg)


    ![image](images/hot.jpg)


    You can also start goroutines from self-invoking functions.


    ![image](images/snake.jpg)


    By default, a program will exit when the main goroutine completes – regardless
    of whether there are any other goroutines that have yet to complete.


    **Keep Waiting**


    Go programs might often include multiple goroutines, so the Go standard library
    sync package provides a WaitGroup type that can be used to wait for a collection
    of goroutines to finish execution.


    ![image](images/pg160_1.jpg)


    An instance of a WaitGroup is created in the usual way, as a variable with this
    syntax:


    **var *waitgroupName* sync.WaitGroup**


    The WaitGroup is simply a counter that can keep a total of the number of running
    goroutines. It has these methods that you use to block the program until all the
    goroutines have completed:


    •**Add( )** – Increments the WaitGroup counter by the number specified as its
    argument. For each new goroutine added to the program, the counter should be increased
    by one.


    •**Done( )** – Decrements the WaitGroup counter by one automatically, so no argument
    is required. The counter should by decreased by one when each goroutine completes.


    •**Wait( )** – Blocks the program until the WaitGroup counter reaches zero, so
    no argument is required. When the final running goroutine decrements the counter
    to zero, blocking is automatically removed.


    When passing a WaitGroup as an argument to a function, it must be passed as a
    pointer. This means that the argument will specify its memory address, using the
    & address-of operator, and the function parameter will denote it as a pointer
    using the * prefix operator. The receiving function can then call the Done( )
    method of the WaitGroup using the pointer argument.


    The Add( ) method should be called to increment the WaitGroup counter before the
    statement that actually creates the goroutine.'
