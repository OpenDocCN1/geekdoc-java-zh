    ...（重复内容略）\n\n## 比较\n\n![image](img/pg38_1.jpg)\n\nGo 编程中常用于比较两个数值的运算符列如下表所示：\n\
    \n| 运算符 | 比较测试 |\n| :--- | :--- |\n| `==` | 等于 |\n| `!=` | 不相等 |\n| `>` | 大于 |\n\
    | `<` | 小于 |\n| `>=` | 大于等于 |\n| `<=` | 小于等于 |\n\n`==` 等于运算符比较两个操作数，如果两者的值相等则返回\
    \ true，否则 `==` 运算符将返回 false。如果两者都是数字，则它们相等；如果两者都是字符，则对它们的 ASCII 值进行数值比较。\n\n相反，`!=`\
