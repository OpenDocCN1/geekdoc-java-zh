    # LANGUAGE HISTORY


    # Introduction


    The Java language was created in the early 90''s as part of a software development
    project for consumer electronic devices. The original new object-oriented programming
    language was named Oak (oak). With the development of network Internet language
    Oak was used to create Internet-applications (eg, n and this java language was
    written Oak-browser "WebRunner"). In 1995, Sun Microystems decided to announce
    a new product, renaming it Java (the only reasonable explanation for the name
    is the love of coffee programmers), and WebRunner renamed HotJava.


    The Java language is now increasingly used to create "middleware" that maintains
    communication between clients and server resources. In addition, the Java language
    has taken over the leadership in embedded systems, becoming the de facto standard
    for portable devices, on-board car computers, and so on.


    One of the main advantages of the Java language is independence from the platform
    on which programs are executed: the same code can be run under Windows, Solaris,
    Linux, Macintosh, etc. operating systems. Another advantage is that the syntax
    of the Java language is similar to the syntax language C++ and C. In addition,
    Java is a completely object-oriented language, even more so than C++. All entities
    in the Java language are objects, with the exception of a few primitive types,
    such as numbers.


    - The possibility of explicit allocation and freeing of memory has been excluded.
    Java memory is automatically reclaimed by garbage collection. The programmer is
    guaranteed against errors related to misuse of memory;

    - Introduced true arrays and disallowed pointer arithmetic. Now programmers, in
    principle, cannot erase data from memory due to improper use of pointers;

    - Eliminated the possibility of confusing the assignment operator with the equality
    comparison operator. Now you can not even compile the expression of the if (a
    = 3) { ... } (this error - the source of most confusion in the languages C and
    C++).

    - Multiple inheritance is excluded. It has been replaced by the concept of interface,
    borrowed from Objective C. An interface gives the programmer almost everything
    a programmer can get from multiple inheritance, avoiding the complexity of managing
    class hierarchies.


    # Java Program Execution


    A program written in a high-level language (called a source module) cannot be
    executed immediately. From the beginning it must be compiled, that is, translated
    into a sequence of machine instructions - an object module. For both the Unit
    I of every module the libraries used in the module and enable the cross-references
    between the object module sections.


    The source module written in the language of the Java, could not avoid these procedures,
    but here is shown the main feature of the technology the Java - the program is
    compiled directly into machine instructions, but does not command a particular
    processor, and in the team''s called it turn machine Java (JVM, Java Virtual Machine).
    The Java Virtual Machine is a collection of machines along with their execution
    system. Not that the virtual machine Java completely stack, and therefore does
    not require complex the adding of memory cells and a large of quantity and registers.
    By A team JVM short, most of it has a length of 1 byte, so the JVM command called
    a byte-code (bytecodes), although there are teams of length 2 and 3 bytes. Full
    description of the commands and the entire JVM architecture is contained in a
    virtual machine specification the Java (the VMS, Virtual Machine specification
    of).


    Another feature of Java is that all standard functions that are called in a program
    are connected to it only at run time, and are not included in the bytecode. In
    other words, there is dynamic linking (dynamic binding), which significantly reduces
    the amount of the compiled program.


    Since a program written in Java is translated by the compiler into the bytecode
    of the Java Virtual Machine, it is independent of the type of processor and architecture
    of the computer being used. Therefore, bytecode can be performed and be on any
    computer with a system that implements the JVM. In this case, neither the type
    of processor nor the architecture of the computer is important. The language.
    The Java-machine-independent. (Obviously, the implementation of the Java virtual
    machine is platform dependent).


    Byte interpretation and dynamic linking slow down program execution significantly.
    It does not matter when the before ea on the network - network slower than any
    interpretation; however, other situations require a powerful and fast computer.
    To increase the speed of interpretation p azarabony JIT-compiler ("timely" compilers
    - the Just with In-Time compiler), memories have interpreted sections of code
    to machine CPU and simply performing these areas when re-treatment, for example,
    in cycles. Only a specialized processor can provide the highest speed of bytecode
    execution. The company of SUN Microsystems released the microprocessors picojava,
    running on the system JVM command, ce and Java-processors of other companies.
    These processors directly execute bytecode.


    And nperti JVM commands in a specific processor instructions designed for virtually
    all computing platforms. More and more operating systems and database management
    systems include JVM implementation in their core. A special JavaOS operating system
    has also been created, which is used in electronic devices. Most browsers have
    a built-in Java virtual machine to run applets.


    The company of SUN Microsystems - the creator of technology Java - distributes
    a set of software tools required for a full cycle of software development on the
    language ie under the name of the JDK (Java Development Kit). There are toolkits
    from other companies.


    The JDK suite of programs and classes contains:


    - javac - source to bytecode compiler;

    - java - the interpreter containing the JVM implementation;

    - appietviewer - browser-replacement applet

    - jdt - debugger;

    - javap - disassembler;

    - jar pro gram archiving and compression (using the format zip - files);

    - the javadoc - prog Ranma to generate documentation from comments ;

    - javah - generating program language header file C ;

