    ## 完整的流家族


    与只有一种类型 FILE 的 C 语言不同，Java 有大约 60 种流（见图 3 和图 4）。


    Java 提供了用于缓冲、播放、随机访问、文本和二进制数据格式化的等独立类。


    该家族的顶端是四个抽象类：InputStream、OutputStream、Reader 和 Writer。无法创建这些类的对象，但其他方法可以返回它们。


    如前所述


    另一方面


    ```java

    abstract int read ()

    abstract void write (int b)

    ```


    它们的工作方式与 `InputStream` 和 `OutputStream` 类中的对应方法相同，不同之处在于该方法读取的是字节或字符编码的 Unicode（范围从
    0 到 65535 之间的整数），或者在检测到文件末尾时返回 -1。


    总结


    ## 流过滤器 (Stream filters)


    `FileInputStream` 和 `FileOutputStream` 允许从文件中读取数据并将记录写入文件。文件名或其路径在构造函数中指定。例如，使用以下语句，你可以在当前目录下找到名为
    "student.txt" 的文件。


    ```java

    File inputstream = new FileInputStream ("student.dat");

    ```


    由于 Java 语言中的符号 `"` 是控制字符，在 Windows 环境下放置记录时，请使用字符 `\`。例如 "C:\Windows\win.ini"。为了确保平台无关性，程序可以使用
    `file.separator`，它存储在 `File.separator` 常量行中。


    图 3：输入和输出流的层级结构（每个箭头指向其父类，虚线箭头指向类实现的接口）


    图 4：Reader 和 Writer 类的层级结构


    此外，你还可以使用 `File` 类的对象（下文将详细描述）。


    ```java

    File f = new File ("student.dat");

    File inputStream fin = new FileInputStream (f);

    ```


    与抽象类 `InputStream` 和 `OutputStream` 一样，这些类仅支持字节级的读写。因此，只能从 `fin` 对象读取单个字节或字节数组：


    ```java

    byte b = (byte)fin.read ();

    ```


    由于 `java.io` 包中的所有类都将从工作目录的相对路径解释为起点，你可能需要确定该目录的的确切名称。要做到这一点，调用 `System` 对象的方法：


    ```java

    System.getProperty("user.dir");

    ```


    创建 `DataInputStream` 类的对象后，你可以读取数值数据（它们必须以适当的格式呈现而非文本）：


    ```java

    DataInputStream din = new DataInputStream (...);

    double s = din.readDouble ();

    ```


    然而，与 `FileInputStream` 类类似（它没有读取数值数据的方法），`DataInputStream` 类也没有从文件读取数据的方法。


