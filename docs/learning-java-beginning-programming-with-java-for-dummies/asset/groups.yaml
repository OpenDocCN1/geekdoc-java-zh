- md: "\nhandy if you need to apply the same code to process both strings and data\
    \ in a stream.\n\n## Working with the file system\n\nWorking with files is not\
    \ limited to reading and writing data. Broader functionality allows you to work\
    \ with the file system on a user's computer is encapsulated in the File class.\
    \ For example, using this class, you can find out when the last modification of\
    \ a file occurred, as well as when it was deleted or renamed. In other words,\
    \ the stream classes focus on the content of the file and the class of the File\
    \ - on the features of storing files on the disk.\n\nAs is often the case in Java,\
    \ the File class represents the \"lowest common denominator\". For example, on\
    \ Windows, you can recognize (or select) the read-only option box. Although you\
    \ can declare a file hidden in this way, it is actually impossible to hide it\
    \ using system-dependent methods (seeks [2]).\n\nThe simplest constructor for\
    \ a File object gets the fully qualified filename. The full path to the file is\
    \ not specified, the search is performed in the current directory. For example,\
    \ calling\n\n```java\nFile f = new File (\"text.txt\");\n```\n\nreturns an object\
    \ of the File class with the specified name. (The current directory is the directory\
    \ from which the program is launched.) If a file with this name does not exist,\
    \ the object is not created. In fact, creating a file from an object of the File\
    \ class is done using one of the stream class constructors or the createFile method\
    \ of the File class. This method creates a new file if a file with the name did\
    \ not exist, returning a Boolean value (to true - if the work has been completed\
    \ successfully and to false - in the opposite case).\n\nOn the other hand, given\
    \ an object of File class, you can call the exists method, which determines whether\
    \ a file with that name exists. For example, in the program below, on almost any\
    \ computer, this method will return false and even print the path to a nonexistent\
    \ file.\n\n```java\nimport java.io.*;\n\npublic class Test\n{\n    public static\
    \ void main(String args[])\n    {\n      File f = new File(\"afilethatprobablydoesnextist\"\
    );\n      System.out.println(f.getAbsolutePath());\n      System.out.println(f.exists());\n\
    \    }\n}\n```\n\nThere are two more constructors in the File class. The File\
    \ (String path, String name) creates an object of the File class with the specified\
    \ name in the directory specified by the path parameter. (If the parameter is\
    \ null, the constructor creates an object of the File class in the current directory.)\
    \ The File (File dir, String name) constructor allows you to use an existing file\
    \ in the directory named by the dir parameter. If this parameter is null, the\
    \ constructor creates an object of the File class in the current directory.\n\n\
    About the Class File can be either a file or a directory (perhaps because the\
    \ operating system is that it is best to know the Java language developers, catalogs\
    \ can be implemented in the form of files). To determine what is the object class\
    \ File - the file or the directory, it is possible with the help of methods isDirectory\
    \ and isfile.\n\nTo create an object representing a directory, you just need to\
    \ specify the directory name in the constructor of the File class.\n\n```java\n\
    File tempDir = new File(File.separator + \"temp\");\n```\n\nIf there was no directory\
    \ with this name, it can be created using the mkdir.\n```java\ntempDir.mkdir();\n\
    ```\n\nIf the File object is a directory, an array of the files in it can be obtained\
    \ by calling the list method. PROGRAMME, given below, use these methods to print\
    \ the directory structure, the name of which is specified on the command line.\
    \ (It's easy to create a helper class based on this program to get a vector of\
    \ subdirectories for further processing.)\n\nWhen manipulating files or directories,\
    \ always be spol access class the File. For example, the equals method of the\
    \ File class knows that some systems do not distinguish between uppercase and\
    \ lowercase letters, and that it is pointless to end a directory name with /.\n\
    \n```java\nimport java.io.*;\n\npublic class FindDirectories\n{\n    public static\
    \ void main (String [] args)\n    {\n        // If no arguments are specified,\
    \ the current directory is used\n        if (args.length == 0)\n            args\
    \ = new String [] { \".\" };\n        try {\n            File fileName = new File(args[0]);\n\
    \            String [ ] fileNames = fileName.list();\n\n            // List all\
    \ files in the directory\n            for (int i = 0; i<fileNames.length; i++)\
    \ {\n                File f = new File(fileName.getPath(), fileNames[i]);\n\n\
    \                // If the object is again a directory,\n                // recursively\
    \ call the main method\n                if ( f . isDirectory()) {\n          \
    \          System.out.println(f.getCanonicalPath());\n                    main\
    \ (new String [] {f.getPath() });\n                }\n            }\n        }\
    \ catch (IOException e) {\n            e.printStackTrace ();\n        }\n    }\n\
    }\n```\n\nAll files do not need to be listed at once. Instead\n\nAll classes that\
    \ implement the FileNameFilter interface must have an accept method. Let's look\
    \ at a simple example of a FilenameFilter class that recognizes only files with\
    \ the specified extension.\n\n```java\npublic class ExtensionFilter implements\
    \ FilenameFilter\n{\n    private String extension;\n\n    public ExtensionFilter(String\
    \ ext)\n    {\n        extension = \".\" + ext;\n    }\n    public boolean accept(File\
    \ dir, String name)\n    {\n        return name.endsWith(extension);\n    }\n\
    }\n```\n\nFor platform independent programs, subdirectories are a bit tricky.\
    \ As stated, different operating systems use different file separators. For example,\
    \ the forward slash is used on UNIX and Windows systems, but it may not be recognized\
    \ on other systems. Therefore, it should not be applied.\n\nThe best way to separate\
    \ subdirectories is to use the current directory separator, which is stored in\
    \ the File class in a static separator field. On Windows it is a backslash \\\
    , and on UNIX it is a regular slash /.\n\n```java\nFile file = new File(\"Documents\"\
    , File.separator + \"data.txt\");\n```\n\nWhen using the class constructor File\
    \ System Java will determine the correct separator file:\n\n```java\nFile file\
    \ = new File(\"Documents\", \"data.txt\");\n```\n\nThe following are the most\
    \ important methods of the File class.\n\n| java.io.File 1.0 | Description |\n\
    | :--- | :--- |\n| boolean canWrite() | Indicates if the file can be written or\
    \ is it only for |\n| static boolean createTempFile(String prefix, String suffix)\
    \ | 1.2 |\n| static boolean createTempFile(String prefix, String suffix, | |\n\
    \n## File directory 1.2\n\nCreates a temporary file in a temporary directory specified\
    \ by the system by default, or in a directory specified by the user. Suffix and\
    \ Prefix are used to create a temporary filename.\n\nParameters: prefix A of at\
    \ least three symbols.\n\n- suffix optional. If reference is null, the tmp extension\
    \ is used.\n- The directory in which the file is created. If given parameter null,\
    \ the current directory is used.\n\n## boolean delete()\n\nAttempts to delete\
    \ a file. If the file was successfully deleted, it returns true, otherwise false.\n\
    \n## void onDelete()\n\nAsks whether delete a file when the virtual machine shuts\
    \ down.\n\n## boolean exists()\n\nReturns true if the file or directory exists,\
    \ otherwise case it returns false.\n\n## String getAbsolutePath()\n\nReturns a\
    \ string containing the absolute pathname of the file. Recommendation: the getCanonicalFile\
    \ method should be used instead.\n\n## getCanonicalFile() 1.2\n\nReturns a string\
    \ containing the canonical path name. In hastuni, unnecessary directories \"\"\
    \ is used correct directory separator and uppercase letters.\n\n## String getCanonicalPath()\
    \ 1.1\n\nReturns a string containing the canonical pathname. In particular, removes\
    \ optional directories \"\", the correct one is used directory separator and uppercase\
    \ letters.\n\n## String getName()\n\nReturns a string containing the name of the\
    \ File object ( path information not into account).\n\n## String getParent()\n\
    \nReturns a string containing the name of the parent of the File class . If the\
    \ object is a file, then the parent object is a directory, containing the file.\
    \ If the object is a directory, then the parent is the parent directory, If there\
    \ is no parent directory, a null reference is returned.\n\n## File getParent()\
    \ 1.2\n\nReturns a File object for the parent directory. Defines the concept of\
    \ \"parent\" in the getParent class description.\n\n## String getPath()\n\nReturns\
    \ a string containing the name of the file path.\n\n## boolean isDirectory()\n\
    \nReturns true if the File object is directory, otherwise false.\n\n## boolean\
    \ isFile()\n"
  mdcn: "\n如果你需要使用相同的代码来处理流中的字符串和数据，那么这会非常方便。\n\n## 与文件系统交互\n\n处理文件不仅限于读取和写入数据。更广泛的功能允许你操作用户计算机上的文件系统，这些功能被封装在\
    \ `File` 类中。例如，使用该类，你可以找到文件最后一次修改的时间，以及它是何时被删除或重命的。换句话说，流类侧重于文件的内容，而 `File` 类则侧重于磁盘上存储文件的特性。\n\
    \n正如 Java 中常见的情况，`File` 类代表了“最小公约数”。例如，在 Windows 上，你可以识别（或选择）只读复选框。虽然你可以通过这种方式声明文件为隐藏，但实际上无法使用依赖于系统的方法来隐藏它（参见\
    \ [2]）。\n\n`File` 对象的的最简单构造函数获取完全限定的文件名。由于未指定文件的完整路径，将在当前目录中进行搜索。例如，调用\n\n```java\n\
    File f = new File (\"text.txt\");\n```\n\n返回一个具有指定名称的 `File` 类对象。（当前目录是启动程序时的目录。）如果不存在此名称的文件，则不会创建该对象。事实上，从\
    \ `File` 类对象创建文件是使用流类构造函数之一或 `File` 类的 `createFile` 方法完成的。如果没有该名称的文件，此方法将创建一个新文件并返回一个布尔值（true\
    \ 表示工作成功完成，false 表示相反）。\n\n相反，给定一个 `File` 类对象，你可以调用 `exists` 方法，该方法判断是否存在该名称的文件。例如，在下面的程序中，在几乎任何计算机上，此方法都将返回\
    \ false，甚至会打印指向不存在的文件路径。\n\n```java\nimport java.io.*;\n\npublic class Test\n\
    {\n    public static void main(String args[])\n    {\n      File f = new File(\"\
    afilethatprobablydoesnextist\");\n      System.out.println(f.getAbsolutePath());\n\
    \      System.out.println(f.exists());\n    }\n}\n```\n\n`File` 类中还有两个构造函数。`File\
    \ (String path, String name)` 在 `path` 参数指定的目录中创建一个具有指定名称的 `File` 类对象。（如果参数为 `null`，则构造函数在当前目录中创建\
    \ `File` 类对象。）`File (File dir, String name)` 构造函数允许你使用 `dir` 参数命名目录中的现有文件。如果此参数为\
    \ `null`，则构造函数在当前目录中创建 `File` 类对象。\n\n`File` 类可以是文件，也可以是目录（可能是因为操作系统规定为了让 Java\
    \ 语言开发者知道这是最好的，目录可以以文件的形式实现）。要确定 `File` 对象的类型——是文件还是目录——可以通过 `isDirectory` 和 `isFile`\
    \ 方法来实现。\n\n要创建一个表示目录的对象，你只需要在 `File` 类的构造函数中指定目录名。\n\n```java\nFile tempDir =\
    \ new File(File.separator + \"temp\");\n```\n\n如果不存在此名称的目录，可以使用 `mkdir` 创建它。\n\
    ```java\ntempDir.mkdir();\n```\n\n如果 `File` 对象是一个目录，可以通过调用 `list` 方法获取其中的文件数组。下方的程序\
    \ `PROGRAMME` 使用这些方法打印在命令行中指定的目录结构。（基于此程序可以很容易创建一个辅助类，以获取子目录向量以便进一步处理。）\n\n在操作文件或目录时，始终要使用\
    \ `File` 访问类。例如，`File` 类的 `equals` 方法知道某些系统不区分大小写，并且在目录名以 `/` 结尾是没有意义的。\n\n```java\n\
    import java.io.*;\n\npublic class FindDirectories\n{\n    public static void main\
    \ (String [] args)\n    {\n        // 如果没有指定参数，则使用当前目录\n        if (args.length\
    \ == 0)\n            args = new String [] { \".\" };\n        try {\n        \
    \    File fileName = new File(args[0]);\n            String [ ] fileNames = fileName.list();\n\
    \n            // 列出目录中的所有文件\n            for (int i = 0; i<fileNames.length; i++)\
    \ {\n                File f = new File(fileName.getPath(), fileNames[i]);\n\n\
    \                // 如果对象又是目录，\n                // 递归调用 main 方法\n             \
    \   if ( f . isDirectory()) {\n                    System.out.println(f.getCanonicalPath());\n\
    \                    main (new String [] {f.getPath() });\n                }\n\
    \            }\n        } catch (IOException e) {\n            e.printStackTrace\
    \ ();\n        }\n    }\n}\n```\n\n不需要一次性列出所有文件。相反，\n\n所有实现 `FilenameFilter` 接口的类都必须有一个\
    \ `accept` 方法。让我们来看简单的 `FilenameFilter` 类示例，它只识别具有指定扩展名的文件。\n\n```java\npublic\
    \ class ExtensionFilter implements FilenameFilter\n{\n    private String extension;\n\
    \n    public ExtensionFilter(String ext)\n    {\n        extension = \".\" + ext;\n\
    \    }\n    public boolean accept(File dir, String name)\n    {\n        return\
    \ name.endsWith(extension);\n    }\n}\n```\n\n对于平台无关的程序，子目录有点棘手。如所述，不同的操作系统使用不同的文件分隔符。例如，UNIX\
    \ 和 Windows 系统使用正斜杠，但在某些系统上可能不适用。区分子目录的最佳方法是使用分隔符。\n\n在 `File` 类中存储的 `File.separator`\
    \ 是正确的分隔符。在 Windows 上是反斜杠 `\\`，在 UNIX 上是正斜杠 `/`。\n\n```java\nFile file = new File(File.separator\
    \ + \"data.txt\");\n```\n\n使用 `File` 类构造函数时，Java 将确定正确的分隔符：\n\n```java\nFile file\
    \ = new File(\"Documents\", \"data.txt\");\n```\n\n以下是 `File` 类最重要的方法。\n\n| java.io.File\
    \ 1.0 | 说明 |\n| :--- | :--- |\n| `boolean canWrite()` | 指明是否可以写入 |\n| `static\
    \ boolean createTempFile(String prefix, String suffix)` | 1.2 |\n| `File directory\
    \ 1.2` | 在系统指定的临时目录中或用户指定的目录中创建临时文件。参数：`prefix` 至少三个符号。- `suffix` 可选。如果引用为 `null`，则使用\
    \ `.tmp` 扩展名。- 创建文件的目录。如果参数为 `null`，则使用当前目录。 |\n| `boolean delete()` | 尝试删除文件。如果文件成功删除，则返回\
    \ true，否则返回 false |\n| `void onDelete()` | 在虚拟机关闭时请求删除文件 |\n| `boolean exists()`\
    \ | 如果文件或目录存在，则返回 true，否则返回 false |\n| `String getAbsolutePath()` | 返回文件绝对路径的字符串。建议：应使用\
    \ `getCanonicalFile` 方法。 |\n| `getCanonicalFile() 1.2` | 返回规范路径名称的字符串。特别地，它会移除不必要的目录\
    \ `\"\"`，使用正确的分隔符和大小写。 |\n| `String getCanonicalPath() 1.1` | 返回规范路径的字符串。特别是，它会移除可选目录\
    \ `\"\"`，使用正确的分隔符和大小写。 |\n| `String getName()` | 返回 `File` 对象名称的字符串（不考虑路径信息）。\
    \ |\n| `String getParent()` | 返回 `File` 类父级的名称字符串。如果对象是文件，则父对象是包含该文件的目录。如果对象是目录，则父级是父目录。如果没有父目录，则返回空引用。\
    \ |\n| `File getParent() 1.2` | 返回父目录的 `File` 对象。在 `getParent` 类描述中定义了“父级”的概念。\
    \ |\n| `String getPath()` | 返回文件路径名称的字符串 |\n| `boolean isDirectory()` | 如果 `File`\
    \ 对象是目录，则返回 true，否则返回 false |\n| `boolean isFile()` | |\n"
