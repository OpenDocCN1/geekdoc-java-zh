    # Introduction to Object Oriented Programming


    Object-oriented programming (OOP) has become the dominant programming paradigm,
    supplanting the "structured", procedural programming techniques developed in the
    early 1970s. The Java language is a fully object-oriented language.


    Traditional structured programming consists of developing a set of functions (algorithms)
    to solve a given problem. Having defined these functions, the programmer must
    define an appropriate way to store the data. T . E first decided Xia question
    , how to manipulate the data , and then - what structure to use for the organization
    of the data. OOP has reversed the order of these actions by putting data first
    and making the algorithms for processing it a secondary issue.


    In OOP, any program consists of objects. The basic principle behind the high performance
    of OOP is that each object is designed to perform specific tasks. If an object
    is faced with a task for which it is not intended, it must have access to another
    object that can solve this task. Another object is accessed by *calling a method*
    on that object. This is a generalized version of function used in procedural programming.


    An object should not directly manipulate the internal data of another object,
    nor should it provide other objects with direct access to its data. All communications
    between them are provided by calling a methods.


