    \ The more advantage the corresponding group of operations is, the higher it is\
    \ located in the table. The order of operations can be adjusted using parentheses.\n\
    \n# Conversion numeric types\n\nSolid ones with arrows denote transformations\
    \ that are performed without loss of information. The dashed arrows indicate transformations\
    \ that may result in loss of precision. For example, the number converted to float:\n\
    \n```java\nint n = 123456789;\nfloat f = n; // Potential loss of precision\n```\n\
    \nFigure: 1. Allowed conversions\n\n# Reduction type s\n\nThe language Java automatic\
    \ conversion ( in the case of the numeric types ) is possible only in the case\
    \ where the accuracy of number representation enough for storing the initial value.\
    \ Such a conversion occurs, for example, when a character constant or the value\
    \ of a variable of byte or short is entered into a variable of type int . The\
    \ of the int type is sufficient to store numbers in the range allowed for the\
    \ byte type , so in situations, an explicit cast is not required. The converse\
    \ in most cases is not true, however for entering a value of type int variable\
    \ type use operation actuation ( type casting ), to the variable int fits into\
    \ a variable desired type.\n\nTo cast a value to a specific type, you need to\
    \ specify this type, enclosed in parentheses, the code snippet below demonstrates\
    \ casting from a source (variable of type int ) to the type of destination (variable\
    \ of type byte ).\n\n```java\nint a = 100;\nbyte b = (byte) a;\n```\n\nAutomatic\
    \ conversion type and in expressions can sometimes be the cause of error messages\
