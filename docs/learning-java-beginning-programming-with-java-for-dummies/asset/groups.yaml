    a subdirectory of the programs directory. However, this location is not very convenient.
    Typically, many programs need access to package files. So to share packages with
    them, you need to do the following:


    - 1. Place classes in one or more special directories, for example c\classes.
    Note that this directory is the base of respect to the tree package. If you need
    to add the ru.karelia.dfe.Student, then the class file should be placed in the
    c\classes\ru\karelia\dfe\subdirectory.

    - 2. Set the classpath (classpath). Classpath - it includes all of the base to
    the that can contain class files.


    Setting the classpath depends on the environment in which the program is compiled.
    If you are using a package the Java SDK, there are two possibilities: the compiler
    and bytecode interpreter as an option - the classpath or set the environment variable
    to the CLASPATH Windows path separates the points of the second-colon :

    c\classes;;c\archives\archive.jar


    The . point means the current directory (it must be specified).


    For example, when compiling a program, the path to your own classes can be set
    as follows:

    javac -classpath c\classes;;c\archives\archive.jar MyProgram.java


    The classpath lists all directories and archive files in which to look for classes.
    The search order is determined by the order in which directories and archive files
    are specified.


    We emphasize that compiler javac always looks for files in the current directory,
    and the interpreter java refers to the current directory only in case the classpath
    contains the point . If the classpath is not specified, the path is used by default,
    which includes the designation of the current directory. But if the path to the
    classes is still specified, and there is no point in the path, the program will
    be compiled without errors, but will not be able to execute.


    # Package scope


    We have already seen the public and private access modifiers. Essence (element.
    Class, method or field), marked keyword public, can be used by any class of any
    packet. Private entities can only be used by the class that defines them. If no
    access modifier is specified, then the entity is available to all methods in the
    same package.


    # JAR files


    Language Java allowing all the necessary classes into a single file. So-called
    jar-files (the Java Archive). The jar-file can contain not only class files, but
    also files of other types, for example, graphic images, audio recordings, text
    and binary files. Jar utility.exe uses ZIP format.


    - Create a new jar-file Ayla uses the following syntax:

    jar cvf fileName.jar File1 File2 ...


    For example,

    jar cvf CalculatorClasses.jar *.class icon.gif


    Table 3. Jar archiver


    | Options | Description |

    | :--- | :--- |

    | f | Creates a new or empty archive and adds files to it. If the filename is
    a directory name, the jar program parses it recursively |

    | t | Displays the contents of the archive on the screen |

    | u | Updates an existing jar file |

    | x | Extracts files. If multiple filenames are specified, only those are retrieved.
    Otherwise all jar files are extracted |

    | f | Specifies the name of the jar as the second command line argument. If this
    parameter is omitted, the jar program will write the result to standard output
    (when creating a jar file) or read it from standard input (when extracting or
    viewing a jar file) |

    | v | Generates a detailed file report |

    | m | Adds a jar-file manifest (manifest), which is a file content description
    and its origin. Each archive has a manifest by default, but you can create your
    own manifest to describe the contents of the archive in detail |

    | O | Does not compress the original file (ZIP format) |

    | M | Cancels the creation of the manifest |

    | i | Creates an index file (when used in applets) |

    | C | Changes the directory temporarily. For example, the command jar cvf FileName.jar
    -C classes *.class directs files to classes subdirectory |


    Jar-file is a standard ZIP-file containing the classes, files, needed for operation
    of the program (eg, an icon) and the manifest file (the manifest file), describing
    the features of the architecture.


    The manifest file is named MANIFEST.MF and is located in a special META subdirectory-INF.
    The minimum valid manifest is automatically generated. For example:


    - Manifest-Version: 1.0

    - Created-By: 1.6.0_07 (Sun Microsystems Inc.)


    Complex manifests contain many descriptions, which are grouped into sections.
    The first section of the manifesto called main (main section called). It applies
    to the entire jar file. The rest of the descriptions refer to named entities,
    that is, to individual files, packages, or URLs. These entries (sections) must
    begin with the word Name. Sections are separated from each other by a blank line.


    - Manifest-Version: 1.0

    - Description lines for this archive

    - Name: Woozle.class

    - Description lines for this file

    - Name: foo/bar

    - Description lines for this package.


    In the first section of the manifest, you need to add an entry pointing to the
    main class of the program for the interpreter and java:


    - Manifest-Version: 1.0

    - Created-By: 1.6.0_07 (Sun Microsystems Inc.)

    - Main-Class: Calculator


    The last line of the manifest must end with a newline character. Otherwise, the
    manifest will not be read correctly. Not should point out a space.class after
    the name of the main class.


    To create a file with the edited manifesto the need to fulfill:

    jar cvfm FileName.jar MANIFEST.MF *.class other files and directories


    Using jar-files allowed to avoid confusion in the user file system under propagation
    and applications.


    To start the application simply execute:

    java -jar FileName.jar


    Depending on the operating system configuration, the application can be launched
    by double-clicking the jar file icon.


    Unfortunately, only the class files automatically to extract the archive to be
    found in the image files and others. in the Java program itself, you must use
    the appropriate library methods (methods, for example, [1], p. 612)


    # Class design guidelines


    - 1. Fields of classes should be closed (in the violation of encapsulation)

    - 2. Data should always be initialized.


    The Java language does not require the initialization of local variables, but
    the fields in objects must be initialized. Not worth playing with me the default
    settings, it is desirable initializes all variables explicitly by constructors.


    - 3. Not worth using class too many basic types.


    Several related fields of basic types should be combined into a new class. Such
    classes are easier to understand and modify. For example, the four basic types
    of fields in the Customer class:


    ```java

    private String street;

    private String city;

    private String state;

    private int zip;

    ```


    should be merged into a new class Address. This makes it easier to change addresses.


    - 4. Not all fields need to have individual access and modification methods. Quite
    often, objects contain fields that no one else accesses or changes their content.
    Such objects, for example, include the array of US state abbreviations in the
    Address class.


    - 5. The standard form of class definition should be used.


    The contents of a class is always listed in the following order (from The Style
    of programming in the Java, passed in the company of Sun Microsystems):


    - fields

    - static fields;

    - constructors;

    - methods;

    - static methods.


    - 6. Not to try to create too big classes.

    - 7. Classes and methods must have meaningful names.


    Classes, like variables, should be named with names that reflect their meaning.
    (There are, of course, ambiguous examples in the standard library, say the Date
    class describes a time, not a date.)


    It is convenient to accept the following convention: the class name must be a
    noun or a noun preceded by an adjective, or a gerund (a word ending in "ing" such
    as BillingAddress). As a rule, access methods must begin with the words and the
    get, dialed th lowercase letters (the get the Name), and modifying techniques
    - with words and set, dialed th lowercase letters (the setName).

