    \ group of operations is, the higher it is located in the table. The order of\
    \ operations can be adjusted using parentheses.\n\n# Table 2. Java Operations\n\
    \n| Operation sign | Purpose of operation |\n|---|---|\n| ! | Logical negation\
    \ |\n| ~ | Bitwise negation |\n| , + | Sign change |\n| ++ | Increase by one |\n\
    | - | Decrease by one |\n| (type) | Cast to type (e.g., (float) a) |\n| * | Multiplication\
    \ |\n| / | Division |\n| % | Determination of the remainder of division |\n| +\
    \ | Addition |\n| - | Subtraction |\n| << | Shift left |\n| >> | Shift Right (Arithmetic)\
    \ |\n| >>> | Shift right (boolean) |\n| < | Less than |\n| <= | Less or equal\
    \ |\n| > | More than |\n| >= | More or equal |\n| instanceof | instance of |\n\
    | == | Equal |\n| != | Not equal |\n| & | Bitwise AND |\n| ^ | Bitwise XOR |\n\
    | | | Bitwise OR |\n| && | Logical AND |\n| || | Logical OR |\n| ?: | Conditional\
    \ (ternary) |\n| = | Assignment |\n| +=, -=, *=, /=, %, <<=, >>=, >>>, &=, ^=,\
    \ |= | Compound assignment |\n\nAny language expression consists of operands (variables,\
    \ constants, etc.), connected by operation signs. An operation sign is a symbol\
    \ or group of symbols that tells the compiler perform certain arithmetic, logical,\
    \ or other operations.\n\nOperations are performed in a strict sequence. The value\
