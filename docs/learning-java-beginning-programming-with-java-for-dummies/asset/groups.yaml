    with the equality comparison operator . Now you can not even compile the expression
    of the if ( a = 3 ) { ... } (this error - the source of most confusion in the
    languages C and C++).


    +   - Multiple inheritance is excluded. It has been replaced by the concept of
    interface a , borrowed from Objective C. An interface gives the programmer almost
    everything a programmer can get from multiple inheritance, avoiding the complexity
    of managing class hierarchies.


