    \ Variable name length is not limited. You cannot use reserved words as variable\
    \ names.\n\nIn the language of Java size ad is, and determining the variables\
    \ do not differ.\n\nAfter declaring a variable, you must explicitly initialize\
    \ it using the assignment operator. For example:\n\n```java\nint vacationDays;\
    \ // This is a declaration\nvacationDays = 12; // This is an assignment operator\n\
    index = 0xffffff; // -1\nlong number = 25L;\n\nfloat result = 2.5F;\ndouble pi\
    \ = 3.14159;\nchar c1 = 0xf132;\nchar c2 = 'a';\nchar c3 = '\\n';\nchar c4 = '\\\
    u2122';\n\nboolean done = false;\n```\n\nThe basic form of a variable declaration\
    \ is as follows:\n\n```\ntype identifier [= value] [, [= value 2 ...];\n```\n\n\
    Type is either one of the built-in types such as byte, short, int, long, char,\
    \ float, double, boolean, or the name of a class or interface.\n\n# Constants\n\
    \nThe Java language uses the final keyword to denote constants, for example:\n\
    ```java\npublic class Constants\n{\n    public static void main(String [] args)\n\
    \    {\n        final double CM_PER_INCH = 2.54;\n\n        double paperWidth\
    \ = 8.5;\n        double paperHeight = 11;\n\n        System.out.println(\"The\
    \ size of the page in inches \" + paperWidth * CM_PER_INCH + \" on \" + paperHeight\
    \ * CM_PER_INCH);\n    }\n}\n```\n\nThe final keyword mean that you can assign\
    \ a value to a given variable only once. It is not necessary to use only uppercase\
    \ letters in constant names.\n\nIn the Java language, you often need constants\
    \ that are available to multiple methods within the same class. They are usually\
    \ called class constants. Class constants are declared using the static final\
    \ keywords. Here's an example using a class constant:\n\n```java\npublic class\
    \ Constants2\n{\n    public static final double CM_PER_INCH = 2.54;\n    public\
    \ static void main(String [] args)\n    {\n        ...\n    }\n}\n```\n\nNote\
    \ the fact that the class constant is defined outside the main method.\nThus,\
    \ it can be used in other methods of the same class. Moreover, (as in this example)\
    \ a constant is declared public, methods from other classes can also access it.\
    \ In our example, this can be done using the expression Constants2.CM_PER_INCH.\n\
    \n# Big numbers\n\nIf the precision of the built-in integer and floating point\
    \ types is not sufficient, you can refer to the two classes in the Java package\
    \ math called BigInteger and BigDecimal. These classes are designed to manipulate\
    \ numbers consisting of an arbitrary number of digits. The BigInteger and BigDecimal\
    \ classes implement arbitrary precision arithmetic on integers and real numbers,\
    \ respectively.\n\nTo convert an ordinary number to \"large\", use the method\
    \ valueOf.\n`BigInteger a = BigInteger.valueOf(100);`\n\nThe usual mathematical\
    \ operators \"+\" and \"*\" cannot be applied to large numbers. Instead, you need\
    \ to use the add and multiply methods to work with large numbers:\n\n```java\n\
    BigInteger i = a.add(b); // c = a+b\nBigInteger d = c.multiply(b.add(BigInteger.valueOf(2)));\
    \ // d = c*(b+2)\n```\n\n# Methods for working with large numbers\n\njava.math.BigInteger\
    \ 1.1\n\n- BigInteger add(BigInteger other)\n- BigInteger subtract(BigInteger\
    \ other)\n- BigInteger multiply(BigInteger other)\n- BigInteger divide(BigInteger\
    \ other)\n- BigInteger mod(BigInteger other)\n\nThese functions return the sum,\
    \ difference, product, quotient, and remainder of a given large by the value of\
    \ other.\n\nint compareTo(BigInteger other)\n\nReturns 0 if the given number is\
    \ equal to the value of other, a negative number if the large number is less than\
    \ the value of other, and positive otherwise.\n\nstatic BigInteger valueOf(long\
    \ x)\n\nReturns a large number equal to the value of x.\n\njava.math.BigDecimal\
    \ 1.1\n\n- BigDecimal add(BigDecimal other)\n- BigDecimal subtract(BigDecimal\
    \ other)\n- BigDecimal multiply(BigDecimal other)\n- BigDecimal divide(BigDecimal\
    \ other, int roundingMode)\n\nThe functions return the sum, difference, product,\
    \ and quotient of a large decimal by the value of other.\nTo calculate the quotient,\
    \ you need to support the rounding mode. BigDecimal ROUND_HALF_UP means normal\
    \ rounding (that is, downwards if the last digit is less than 5, and upward if\
    \ it is greater than 5). This is sufficient for ordinary calculations. Other rounding\
    \ modes are described in the API documentation.\n\nint compareTo(BigDecimal other)\n\
    \nReturns 0 if this number is equal to the value type BigDecimal other, a negative\
    \ number if this number is less than the value of the other variable, and a positive\
    \ otherwise.\n\nstatic BigDecimal valueOf(long x)\nstatic BigDecimal valueOf(long\
    \ x, int scale)\n\nReturns a large decimal number equal to the value of x or x\
    \ / 10^scale.\n\n# Operations\n\nAny language expression consists of operands\
    \ (variables, constants, etc.), connected by operation signs. An operation sign\
    \ is a symbol or group of symbols that tells the compiler to perform certain arithmetic,\
    \ logical, or other operations.\n\nOperations are performed in a strict sequence.\
    \ The value that determines the preemptive right to perform a particular operation\
    \ is called priority. Table 2 lists the various Java operations. Their priorities\
    \ are the same for each group (the group is located between two adjacent horizontal\
    \ lines). The more advantage the corresponding group of operations is, the higher\
    \ it is located in the table. The order of operations can be adjusted using parentheses.\n\
    \n# Table 2. Java Operations\n\n| Operation sign | Purpose of operation |\n|---|---|\n\
    | ! | Logical negation |\n| ~ | Bitwise negation |\n| , + | Sign change |\n| ++\
    \ | Increase by one |\n| - | Decrease by one |\n| (type) | Cast to type (e.g.,\
    \ (float) a) |\n| * | Multiplication |\n| / | Division |\n| % | Determination\
    \ of the remainder of division |\n| + | Addition |\n| - | Subtraction |\n| <<\
    \ | Shift left |\n| >> | Shift Right (Arithmetic) |\n| >>> | Shift right (boolean)\
    \ |\n| < | Less than |\n| <= | Less or equal |\n| > | More than |\n| >= | More\
    \ or equal |\n| instanceof | instance of |\n| == | Equal |\n| != | Not equal |\n\
    | & | Bitwise AND |\n| ^ | Bitwise XOR |\n| | | Bitwise OR |\n| && | Logical AND\
    \ |\n| || | Logical OR |\n| ?: | Conditional (ternary) |\n| = | Assignment |\n\
    | +=, -=, *=, /=, %, <<=, >>=, >>>, &=, ^=, |= | Compound assignment |\n\nAny\
    \ language expression consists of operands (variables, constants, etc.), connected\
    \ by operation signs. An operation sign is a symbol or group of symbols that tells\
    \ the compiler perform certain arithmetic, logical, or other operations.\n\nOperations\
    \ are performed in a strict sequence. The value that determines the preemptive\
