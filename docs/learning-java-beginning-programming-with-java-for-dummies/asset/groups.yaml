    \ `static` 关键字，`PI` 常量将是 `Math` 类实例的一个普通常量字段。这意味着，若要访问此类常量，将需要创建一个 `Math` 类的对象，并且每个此类对象都拥有自己的\
    \ `PI` 常量副本。\n\n如上述所示，你不应该使用 `public` 字段，因为任何人都可以在不使用对象方法的情况下更改它们的值。然而，`public`\
    \ 量应该使用 `final` 关键字。\n\n# 静态方法\n\n你永远不要使用 `public` 字段，因为任何人都可以在不使用对象方法的情况下更改它们的值。然而，`public`\
    \ 常量应该使用 `final` 关键字。这些 静态方法\n\n不需要创建对象即可调用静态方法。例如，`pow` 方法是静态的。\n\n```java\n\
    double x;\ndouble y;\nx = Math.pow(x, y);\n```\n\n静态方法是不属于任何对象的类方法。在这种情况下，`this`\
    \ 参数没有意义。例如：\n\n```java\nprivate int id;\nprivate static int nextId;\n\n// 对象初始化块\n\
    {\n    id = nextId;\n    nextInt++;\n}\n```\n\n在这个例子中，`id` 字段的初始值是在初始化块中指定的，无论使用哪个构造函数创建对象。初始化块首先执行，构造函数体之后执行。这种机制是完全可选的，通常不使用。主要在构造函数内部使用更清晰的方法来指定字段的初始值。\n\
    \n考虑调用构造函数时发生什么：\n\n- 1. 所有数据字段都被初始化为默认值（`0`、`false` 或 `null`）。\n- 2. 所有字段初始化器和初始化块按照它们在类声明中的顺序执行。\n\
    - 3. 如果构造函数的第一行调用了另一个构造函数，则先执行调用的构造函数。\n- 4. 执行构造函数体。\n\n静态方法应该在两种情况下使用：\n\n-\
    \ 1. 方法不需要访问对象状态，例如 `Math.pow`。\n- 2. 方法需要访问类的静态字段，例如 `Student.getId()`。\n\n“static”一词是一个历史遗留。首先，`static`\
    \ 关键字在 C 语言中引入，标记退出块时不会销毁的局部变量。在这种语境下，“static”是有意义的：变量在退出块后继续存在。\n\n然后“static”在\
    \ C 中获得了第二个值——无法从其他文件访问的全局变量和函数。`static` 关键字被复用以避免引入新的。\n\n在 C++ 中，这个关键字被使用了第三次，具有全新的解释——表示属于类但不属于任何对象的变量和函数。这正是\
    \ Java 语言中的含义。\n\n此外记住 `main` 方法是静态的，这就是为什么它可以在程序执行开始时（此时还没有对象）时被调用。\n"
