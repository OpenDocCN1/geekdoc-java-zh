    # 语言历史


    # 导言


    Java 语言创建于 20 世纪 90 年代初，消费电子设备软件开发项目的一部分。最初的面向对象语言命名为 Oak（橡树）。随着网络语言的发展，Oak 被用于创建互联网应用程序（例如，Java
    语言就是用 Oak 编写的 Oak 浏览器“WebRunner”）。1995 年，太阳微系统（Sun Microystems）决定宣布一款新产品，将其重命名为
    Java（这个名字唯一合理的解释是程序员对咖啡的热爱），并将 WebRunner 改名为 HotJava。


    Java 语言现在越来越多地用于创建维护客户端与服务器资源之间通信的“中间件”。此外，Java 语言已接管了嵌入式系统的领导地位，成为便携式设备、车载计算机等等的事实标准。


    Java 语言的主要优势之一是不依赖于运行程序的平台：相同的代码可以在 Windows、Solaris、Linux、Macintosh 等操作系统上运行。另一个优势是
    Java 语言的语法与 C++ 和 C 语言语法相似。此外，Java 是一门完全面向对象的语言，比 C++ 更为。Java 语言中的所有实体都是对象，只有少数基本类型（如数字）。


    - 排除了显式分配和释放内存的可能性。Java 内存由垃圾回收机制自动回收。保证程序员不会出现与误用内存相关的错误；

    - 引入了真正的数组并禁止了指针算术。现在程序员在原则上无法因指针使用不当从内存中删除数据；

    - 消除了将赋值运算符与相等比较运算符混淆的可能性。现在你甚至无法编译 `if (a = 3) { ... }` 表达式（这个错误是 C 和 C++ 语言中大多数混乱的根源）。

    - 排除了多重继承。它被接口的概念所取代，这是从 C 语言借鉴的。


