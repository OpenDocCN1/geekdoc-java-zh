- md: "\n# Inheritance\n\nThe idea behind inheritance is that new classes can be created\
    \ based on existing classes. When inheriting...\n\nNote that the inheritance mechanisms\
    \ implemented in Java and in other object-oriented languages differ significantly\
    \ from each other.\n\n## Extending classes\n\nLet's go back to the Student class.\
    \ Obviously, the university trains specialists in a number of specialties, as\
    \ well as bachelors and masters in a number of areas (for example, \"Informatics\
    \ and Computer Engineering\"). Of course, those are students. However, they differ\
    \ in programs and years of study at the university. In this situation, it seems\
    \ reasonable to define new Specialist, Bachelor, and Master classes, adding these\
    \ new methods and fields. However, some methods and fields have already been defined\
    \ in the class Student, and all the fields are suitable for Specialist, Bachelor,\
    \ and Master.\n\nBelow example of the class Master, derived from the class Student.\
    \ As noted, the Java language uses the extends keyword to denote inheritance.\n\
    \n```java\nclass Master extends Student {\n    // Additional methods and fields\n\
    }\n```\n\nThe extends keyword means that a new class is created, derived from\
    \ the existing one. The existing class is called the superclass, base, or parent,\
    \ and the newly created is called the subclass or child. Among programmers, the\
    \ most widespread terms are \"superclass\" and \"subclass\", though some experts\
    \ prefer to use \"parent/child\" to be more closely associated with the theme\
    \ \"inheritance\".\n\nThe Student class is the superclass. This does not mean\
    \ that it has superiority or has more functionality. In fact, the opposite is\
    \ true: the subclass is wider than the superclass. A subclass encapsulates more\
    \ data and methods than its superclass. The prefixes super and sub come from programming\
    \ theory. Master has a new field, which stores the name of training, and a new\
    \ method poses this value:\n\n```java\nclass Master extends Student {\n    private\
    \ String MasterTitle = \"Computer Science\";\n    public void getTitle() {\n \
    \       return MasterTitle;\n```\n\nOf course, using an object of the Student\
    \ class, the get method cannot be called - it is not among the methods defined\
    \ in this class. However, getName and getMatriculationDay can be called using\
    \ objects of the Master class since they automatically inherit from the superclass.\
    \ Similarly, name, matriculationDay and course fields are also inherited from\
    \ the superclass. When defining a subclass, you only need to specify the differences\
    \ between the subclass and superclass. General-purpose properties should be placed\
    \ in the superclass, and more specific methods - in the class. This separation\
    \ is widespread in object-oriented programming.\n\n## Overriding (overriding)\
    \ methods\n\nSuppose some superclass methods are not suitable for the subclass.\
    \ In particular, if instead of the general course it is required to return the\
    \ number of the master's course (distinguishing between masters of first and second\
    \ years of study), then you need to implement a new method that replaces (*overriding*)\
    \ the getCourse method of the superclass (see page 41):\n\n```java\nclass Master\
    \ extends Student {\n    public int getCourse() // Doesn't work!\n        switch\
    \ (course) {\n            case 5:\n                return 1; // Master of the\
    \ first year of study\n            case 6:\n                return 2; // Master\
    \ of the second year of study\n            default:\n                return 0;\n\
    \        }\n    }\n}\n```\n\nWhy doesn't it work? The class Master has no direct\
    \ access to the fields of the superclass, although each object Master inherits\
    \ from the superclass. Only methods of the Student class have access to the private\
    \ fields of the superclass. Therefore, to fix this, you need to explicitly call\
    \ the getCourse method from the superclass, not from the current class. For this\
    \ purpose, a special keyword super is used. Operator super.getCourse() calls the\
    \ getCourse method from the Student class. This is the correct version of the\
    \ getCourse method of the Master class looks like:\n\n```java\npublic int getCourse()\
    \ // To earn\n    switch (super.getCourse()) {\n        case 5:\n            return\
    \ 1; // Master of the first year of study\n        case 6:\n            return\
    \ 2; // Master of the second year of study\n        default:\n            return\
    \ 0;\n    }\n```\n\nNote that the value is not closed by the second year, and\
    \ the value of course in Master is inherited from the class Student. Some programmers\
    \ consider the super keyword to be analogous to \"this\" reference. However, this\
    \ analogy is not entirely accurate - super is not an object reference. For example,\
    \ it cannot be assigned to another object variable. This word simply tells the\
    \ compiler to call the superclass method.\n\nTo execute the new method, you need\
    \ to initialize the fields of the Master object with initial values. But since\
    \ the constructor of the Master class does not have access to the private fields\
    \ inherited from the Student class, it must initialize them by calling the constructor\
    \ of the Student class using the super keyword. A call containing the word super\
    \ must be the first statement in the constructor of the subclass.\n\n```java\n\
    import java.util.*;\npublic class Master extends Student {\n    // Constructor\n\
    \    public Master(String n, int aCourse, int year, int month, int day) {\n  \
    \      // Call the superclass constructor\n        super(n, aCourse, year, month,\
    \ day);\n    }\n    public int getCourse() {\n        switch (super.getCourse())\
    \ {\n            case 5:\n                return 1; // Master of the first year\
    \ of study\n            case 6:\n                return 2; // Master of the second\
    \ year of study\n            default:\n                return 0;\n        }\n\
    \    }\n    public static void main(String[] args) {\n        Master c = new Master(\"\
    Petrov E. A.\", 5, 2002, 8, 30);\n        System.out.println(c.getCourse());\n\
    \    }\n}\n```\n\nA subclass can add fields, as well as add and replace methods\
    \ of the superclass, and during inheritance, no field or method is removed from\
    \ the classes. The super keyword is used to invoke a superclass method in Java.\
    \ To set and modify private fields of the class Student one need to explicitly\
    \ create an object of class Student and work with its fields.\n\nLet’s look at\
    \ another example:\n\n```java\nimport java.util.*;\npublic class MasterTest {\n\
    \    public static void main(String[] args) {\n        // Create an object of\
    \ Master\n        Master master = new Master(\"Petrov E. A.\", 5, 2002, 8, 30);\n\
    \n        // fill array of three objects of Student\n        Student[] staff =\
    \ new Student[3];\n        staff[0] = new Student(\"Ivanov P.\", 4, 2003, 8, 27);\n\
    \        staff[1] = master; // to - subclass of the Student class\n        staff[2]\
    \ = new Student(\"Sidorov. N.\", 2, 2005, 8, 26);\n\n        // output to print\
    \ information about the students\n        for (int i = 0; i < staff.length; i++)\
    \ {\n            Student e = staff[i];\n            System.out.println(\"Name\
    \ = \" + e.getName() + \", course = \" + e.getCourse());\n        }\n    }\n}\n\
    ```\n"
