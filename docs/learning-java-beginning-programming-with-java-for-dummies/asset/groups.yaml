    \n# Packages\n\nLanguage Java allows you to combine classes in the collection,\
    \ called packages (packages). Packages make it easier to organize your work and\
    \ allow you to separate your classes from those developed by other programmers.\n\
    \nThe Java Standard Library is distributed in a large number of packages, including\
    \ java.lang, java.util, java.io, java.net, etc. Java standard packages are hierarchical.\
    \ Like directories on a hard disk, packages can be nested within one another.\
    \ All standard packages included in the hierarchy of the package java and javax.\n\
    \nMostly packages are used to ensure that class names are unique. If classes with\
    \ the same name are in different packages, there will be no conflict. To ensure\
    \ that the package name is completely unique, Sun Microsystems recommends using\
    \ the developer's Internet domain name (which is unique by definition) written\
    \ in reverse order. For example, ru.karelia.dfe. In the future, this package can\
    \ be divided into subpackages, for example ru.karelia.dfe.core.\n\nFrom the compiler's\
    \ point of view, there is absolutely no relationship between nested packages.\
    \ For example, the packages java.util and java.lang are not related to each other\
    \ in any way. Each of them is an independent collection of classes.\n\n# Using\
    \ packages\n\nA class can use all classes from its own package and all public\
    \ classes from other packages.\n\nPublic classes from other packages can be accessed\
    \ in two ways.\n- First, you can add any full package name before the name of\
    \ each class. For example,\n\n```java\njava.util.Date today = new java.util.Date\
    \ ();\n```\n\nObviously, this method is too tedious. An easier and more common\
    \ way is to use the import keyword. The import statement allows shorter names\
    \ for references to classes found in the package. In this case, you do not need\
    \ to specify fully qualified class names.\n\nYou can import one specific class\
    \ or the entire package. Import statements should be placed at the beginning of\
    \ the source file (but after all package statements ). For example, all classes\
    \ from the java.util package can be imported using the operator\n\n```java\nimport\
    \ java.util.*;\n```\n\n(Note that the java.lang package is imported by default\
    \ )\n\nYou can then use the following statement without specifying a prefix that\
    \ specifies the package name :\n\n```java\nDate today = new Date ();\n```\n\n\
    You can also import a single class from a package :\n\n```java\nimport java.util.Date;\n\
    ```\n\nIt is easier to import all classes from a package without increasing the\
    \ code size. \n\nHowever, it should be noted that the operator of import with\
    \ an asterisk * can be applied to the importing only one package. You cannot use\
    \ the import java.* or import java..* to import all packages whose names contain\
    \ the java.\n\nIn most cases, the entire package is imported, regardless of its\
    \ size. The only way you should pay special attention to a package is name conflicts.\
    \ For example, both the java.util package and java.sql package contain the Date\
    \ class. Therefore, if we need Date from the java.util package , then we need\
    \ to specify this explicitly:\n\n```java\nimport java.util.*;\nimport java.sql.*;\n\
    ```\n\nIf your program needs Date classes, you have to specify the full package\
    \ name for each:\n\n```java\njava.util.Date today = new java.util.Date ();\njava.sql.Date\
    \ today = new java.sql.Date ();\n```\n\n# Adding a class to a package\n\nTo place\
    \ a class in a package, you must include the package name at the beginning of\
