  mdcn: "\n数字。禁止在标识符与其他字符。变量名中的所有字符都是重要的，且键盘的大小写也很重要。变量名的长度没有限制。你不能使用关键字作为变量名。\n\n\
    在 Java 语言中，大小是这样的，确定变量也没有区别。\n\n在声明变量后，你必须使用赋值运算符显式地初始化它。例如：\n\n```java\nint vacationDays;\
    \ // 这是一个声明\nvacationDays = 12; // 这是一个赋值运算符\nindex = 0xffffff; // -1\nlong number\
    \ = 25L;\n\nfloat result = 2.5F;\ndouble pi = 3.14159;\nchar c1 = 0xf132;\nchar\
    \ c2 = 'a';\nchar c3 = '\\n';\nchar c4 = '\\u2122';\n\nboolean done = false;\n\
    ```\n\n变量声明的基本形式如下：\n\n```\ntype 标识 [= value] [, [= value 2 ...];\n```\n\n类型可以是内置类型之一（如\
    \ byte, short, int, long, char, float, double, boolean），或者是类或接口的。\n\n# 常量\n\n\
    Java 语言使用 `final` 关键字来表示常量，例如：\n```java\npublic class Constants\n{\n    public\
    \ static void main(String [] args)\n    {\n        final double CM_PER_INCH =\
    \ 2.54;\n\n        double paperWidth = 8.5;\n        double paperHeight = 11;\n\
    \n        System.out.println(\"The size of the page in inches \" + paperWidth\
    \ * CM_PER_INCH + \" on \" + paperHeight * CM_PER_INCH);\n    }\n}\n```\n\n`final`\
    \ 关键字意味着你只能给定的变量赋值一次。常量名没有必须使用大写字母。\n\n在 Java 语言中，你通常需要同一个类内的多个方法可以使用常量。它们通常被称为类常量。类常量使用\
    \ `static final` 关键字声明。这里是一个使用类常量的示例：\n\n```java\npublic class Constants2\n{\n\
    \    public static final double CM_PER_INCH = 2.54;\n    public static void main(String\
    \ [] args)\n    {\n        ...\n    }\n}\n```\n\n注意类常量定义在 main 方法之外。\n因此，它可以在同类的其他方法中使用。此外（如此示例所示），常量被声明为\
    \ `public`，其他类中的方法也可以访问它。在我们的示例中，可以使用表达式 `Constants2.CM_PER_INCH` 来完成。\n\n# 大数\n\
    \n如果内置整数和浮点类型的精度不够，你可以参考 Java `math` 包中的两个类：`BigInteger` 和 `BigDecimal`。这些类被设计用于处理由任意位数组成的数字。`BigInteger`\
    \ 和 `BigDecimal` 类分别对整数和实数实现了任意精度算术。\n\n要将普通数字转换为“大数”，请使用 `valueOf` 方法。\n`BigInteger\
    \ a = BigInteger.valueOf(100);`\n\n通常的数学运算符 `+` 和 `*` 不能应用于大数。相反，你需要使用 `add` 和\
    \ `multiply` 方法来处理大数：\n\n```java\nBigInteger i = a.add(b); // c = a+b\nBigInteger\
    \ d = c.multiply(b.add(BigInteger.valueOf(2))); // d = c*(b+2)\n```\n\n# 处理大数的方法\n\
    \njava.math.BigInteger 1.1\n\n- BigInteger add(BigInteger other)\n- BigInteger\
    \ subtract(BigInteger other)\n- BigInteger multiply(BigInteger other)\n- BigInteger\
    \ divide(BigInteger other)\n- BigInteger mod(BigInteger other)\n\n这些函数返回给定大数与\
    \ `other` 之值的和、差、积、商和余数。\n\nint compareTo(BigInteger other)\n\n如果给定数字等于 `other`\
    \ 的值，返回 0；如果大数小于 `other` 的值，返回负数；否则返回正数。\n\nstatic BigInteger valueOf(long x)\n\
    \n返回等于 `x` 值的大数。\n\njava.math.BigDecimal 1.1\n\n- BigDecimal add(BigDecimal other)\n\
    - BigDecimal subtract(BigDecimal other)\n- BigDecimal multiply(BigDecimal other)\n\
    - BigDecimal divide(BigDecimal other, int roundingMode)\n\n这些函数返回大小数与 `other`\
    \ 之值的和、差、积和商。\n要计算商，你需要支持舍入模式。`BigDecimal ROUND_HALF_UP` 表示普通的四舍五入（即最后一位小于 5 则向下舍入，大于\
    \ 5 则向上舍入）。这对于普通计算是足够的。其他舍入模式在 API 文档中描述。\n\nint compareTo(BigDecimal other)\n\
    \n如果此数字等于类型 `BigDecimal other` 值，返回 0；如果此数字小于变量 `other` 的值，返回负数；否则返回正数。\n\nstatic\
    \ BigDecimal valueOf(long x)\nstatic BigDecimal valueOf(long x, int scale)\n\n\
    返回等于 `x` 值或 `x / 10^scale` 的大小数。\n\n# 操作\n\n任何语言表达式都由操作数（变量、常量等）通过运算符符号连接。运算符符号是一个符号或一组符号，告诉编译器执行特定的算术、逻辑或其他操作。\n\
    \n操作是严格按顺序执行的。决定执行特定操作的优先权的值称为优先级。表 2 列出了各种 Java 操作。每组操作的优先级相同（组位于两条相邻的水平线之间）。相应的操作组优势越大，它们在表中的位置就越高。可以使用括号调整操作顺序。\n\
    \n# 表 2. Java 操作\n\n| 运算符符号 | 操作目的 |\n|---|---|\n| ! | 逻辑取反 |\n| ~ | 位取反 |\n|\
    \ , + | 符号改变 |\n| ++ | 加一 |\n| - | 减一 |\n| (type) | 强制转换类型（例如 (float) a） |\n|\
    \ * | 乘法 |\n| / | 除法 |\n| % | 取余数 |\n| + | 加法 |\n| - | 减法 |\n| << | 左移 |\n| >>\
    \ | 右移（算术） |\n| >>> | 右移（布尔） |\n| < | 小于 |\n| <= | 小于等于 |\n| > | 大于 |\n| >= |\
    \ 大于等于 |\n| instanceof | 实例属于 |\n| == | 等于 |\n| != | 不等于 |\n| & | 位与 |\n| ^ |\
    \ 位异或 |\n| | | 位或 |\n| && | 逻辑与 |\n| || | 逻辑或 |\n| ?: | 三元运算符 |\n| = | 赋值 |\n\n\
    \ 任何语言表达式都由操作数（变量、常量等）通过运算符符号连接。运算符符号是一个符号或一组符号，告诉编译器执行特定的算术、逻辑或其他操作。\n\n操作是严格按顺序执行的。决定执行特定操作的优先权的值称为优先级。表\
