  md: '# Objects and Classes


    # Introduction to Object Oriented Programming


    Object-oriented programming (OOP) has become the dominant programming paradigm,
    supplanting the "structured", procedural programming techniques developed in the
    early 1970s. The Java language is a fully object-oriented language.


    Traditional structured programming consists of developing a set of functions (algorithms)
    to solve a given problem. Having defined these functions, the programmer must
    define an appropriate way to store the data. T . E first decided Xia question
