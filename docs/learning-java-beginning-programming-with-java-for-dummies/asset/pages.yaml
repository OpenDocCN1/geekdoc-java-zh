  md: '# Introduction


    The Java language was created in the early 90''s as part of a software development
    project for consumer electronic devices. The original new object-oriented programming
    language was named Oak (oak) . With the development of network Internet language
    Oak was used to create Internet-applications ( eg , n and this java language was
    written Oak-browser " WebRunner " ). In 1995, Sun Microystems decided to announce
    a new product, renaming it Java (the only reasonable explanation for the name
    is the love of coffee programmers), and WebRunner renamed HotJava.


    The Java language is now increasingly used to create " middleware " that maintains
    communication between clients and server resources . In addition, the Java language
    has taken over the leadership in embedded systems , becoming the de facto standard
    for portable devices, on-board car computers, and so on.


    One of the main advantages of the Java language is independence from the platform
    on which programs are executed: the same code can be run under Windows , Solaris
    , Linux , Macintosh , etc. Operating systems . Another advantage is that the syntax
    of the Java language is similar to the syntax language s C ++ and C . In addition,
    Java is a completely object-oriented language, even more so than C++. All entities
    in the Java language are objects, with the exception of a few primitive types,
    such as numbers.


    +   * The possibility of explicit allocation and freeing of memory has been excluded.
    Java memory is automatically reclaimed by garbage collection. The programmer is
    guaranteed against errors related to misuse of memory ;

    * Introduced true arrays and disallowed pointer arithmetic. Now programmers, in
    principle, cannot erase data from memory due to improper use of pointers ;

    * Eliminated the possibility of confusing the assignment operator'
