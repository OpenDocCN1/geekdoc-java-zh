  md: '# JAVA 17: MORE ABOUT JAVA AND ANDROID: SOFTWARE DEVELOPMENT


    The version number specifies a threshold for the Android version, which is tested
    when the application is installed and an Android release later masSdkVersion will
    simply ignore a permission request. The intention is not to ignore the permission
    requirements, but to solve the issue of the permission check for requirements
    from version to version. For example, an app from version 19 onwards will no longer
    require a WRITE_EXTERNAL_STORAGE to write to a file as security is resolved in
    another way.


    # 11.2 MARSHMALLOW AND BEYOND


    From Android 6.0 Marshmallow, you can solve security in a more flexible way, where
    the user explicitly allows permission to use a particular feature such as the
    phone’s camera, GPS, and so forth. Earlier it appeared to all features when the
    application was installed based on the information in the manifest, but it is
    not very flexible. Now, if it is the first time that the feature in question is
    used, where you get a simple dialog box where you can allow or reject it for each
    feature, and you can go back to Settings under Settings | Apps and remove that
    permission. It requires a bit more of the programmer, and although I have already
    shown how, I will illustrate how to do with an example.


