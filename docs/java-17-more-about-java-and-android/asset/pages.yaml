    \                ++prime;\n            } catch (Exception e) {\n            }\n\
    \        }\n    }\n```\n\n```\nprivate boolean isPrime(long t) {\n    if (t ==\
    \ 2 || t == 3 || t == 5 || t == 7) return true;\n    if (t < 11 || t % 2 == 0)\
    \ return false;\n    for (long n = 3, m = (long)Math.sqrt(t) + 1; n <= m; n +=\
    \ 2)\n        if (t % n == 0) return false;\n    return true;\n}\n```\n\nonStartCommand()\
    \ creates a thread and starts it. That runs for as long as the variable running\
    \ is true (until the method terminate() is performed). For each iteration, the\
