  md: '# INTRODUCTION


    In the previous book, I have dealt with how to write Java applications to an Android
    device and here primarily a mobile phone. Like so much else, it''s a big area
    with many special issues, and compared to what has been said in the previous book,
    there''s a lot left, and the goal of the following is to mention something of
    what''s missing.


    A mobile phone (or Android devices such as a tablet) is a computer and is programmed
    in the same principle as any other PC, but there are two important differences:


    +   1. It is a very small computer, both physically and in terms of capacity.

    2. The device has other and more features than a traditional PC.


    Slightly simplified, you can say that the previous book deals with what is special
    because of the first of the above differences, while this book deals with the
    last difference. For any computer program with a user interaction, the two keys
    issues are:


    +   1. How to program the application''s user interface and for a mobile phone
    it is to program an activity and navigates between the program''s activities.

    2. How to persist data, and for a mobile phone, it is done using a SQLite database
    that provides many of the same facilities as known from traditional database systems.


    These two issues are addressed in the previous book, but compared to a conventional,
    a mobile phone provides other features as


    +   - that you can make and receive phone calls

    - that you send and receive SMS messages

    - that using the GPS system you can determine the location

    - that the device has a camera and you can take a picture

    - that you invoke the user''s attention by vibrating the phone

    - and certainly many others


    That are features that are also available to the programmer. Compared to the finished
    program, it offers some new possibilities, but it also means how to use these
    features. Android makes it available in the form of classes, and for the most,
    it''s a matter of seeing what to write. This book provides typical examples of
    how the particular features can be used.


    However, the book starts with fragments, which is the solution to develop applications
    that are flexible and customize the user interface to the screen of the current
    device. An activity should use the screen if the device is a tablet rather than
    a smaller phone. Finally, the current book has more about services that are extremely
    important in terms of developing applications for Android devices as a phone.'
