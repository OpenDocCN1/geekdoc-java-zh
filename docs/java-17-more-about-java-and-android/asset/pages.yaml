  md: '# JAVA 17: ABOUT JAVA AND ANDROID: SOFTWARE DEVELOPMENT


    Before you can publish an app to an app store so it can be downloaded and installed
    on an Android device, it must be signed with a certificate. Such a certificate
    must be purchased from a PKI (such as Verisign or Thawte), and this certificate
    allows you to sign the project''s .apk file (which contains everything it consists).
    A certificate is stored in a keystore, and for that purpose you can use a tool
    called keytool that comes with JDK. If you''ve developed an app and tested it
    on your phone, you''ve actually already used a certificate and a keystore, as
    Android Studio creates a keystore (Debug Keystore) and signs your apps with a
    so-called self-signed certificate. Such a certificate is, of course, a certificate
    that no one trusts and therefore it is necessary to purchase a certificate from
    an authority (Verisign or Thawte), which others trust.


    Once you have the certificate, you can sign your apps (that is your .apk files),
    and for that you can use another tool called jarsigner. Then your app is ready
    to be uploaded to an app store such as Google Play.


    ![](img/dfa4439d1c62650bb2a6b471e62c51e8_142_0.png)'
