    FRAGMENTS


    # 2 FRAGMENTS


    I want to start this book with fragments, which was actually something of what
    I lacked in the last example of the previous book. Just like an activity, a fragment
    is a layout, which is an XML document, that defines the layout and content of
    a window (part of a window = a fragment) and a Java class. A window (activity)
    can consist of several fragments, each fragment defining a part of the window.
    The use is that at time you can replace a fragment with another fragment, and
    the window can get a different layout, and fragments can often be used as an alternative
    to having more activities. Even more important the application, however, is a
    better use of the screen, which is particularly interested in larger screens like
    tablets of similar. Here the screen can accommodate more activities, and if this
    is not possible, you can instead view multiple fragments side by side. Finally,
    fragments are used for tablet displays, list displays and better dialog boxes
    than what is shown in the previous book.


    You should be aware that fragments are by means no alternative to activities,
    but fragments can simplify design of an application''s layout and facilitate easier
    reuse of a layout in multiple activities. An activity can consist of multiple
    fragments, but a particular fragment object can only be associated with one activity.
    You can also say that fragments group components of the user interface together
    with the associated logic.


    I want to start with a simple example called TheBooks that is an application that
    does not use fragments. The program opens the following window:


