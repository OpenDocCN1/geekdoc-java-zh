    LOCATIONS


    # 5 LOCATIONS


    An important use of phones is to decide where you are and thus the geographical
    location

    possibly display this location on a map. A map is provided by the producer with

    programs that can do that, but it may also be of interest for the programmer,
    either to

    determine the location in their own apps and to display a map, where given location

    is shown. Both parts are quite easy, if at least you use a API provided by

    Google (Google Play Services). However, this API is not part of the Android SDK,
    so you

    eed to download the API and refer to it in the current project. It''s also simple
    enough,

    as long as you want to decide on your location, but if you also want to use Google
    Maps,

    need a little more because you must be registered and have a key from their Google

    Account, and you cannot freely quote its applications as there is license conditions
    for

    Google Maps. It should be added that other maps Google are available, but here
    are

    similar / other challenges. Therefore, I would like to show you how to determine
    the

    location without using Google Play Services, and for developing your own applications
    it

    may also be what you typically need.


    You can determine your location from three different location providers:


    +   - GPS_PROVIDER, which is the provider that delivers the most accurate result
    and

    uses the device''s built-in GPS receiver.

    - NETWORK_PROVIDER, which determines the location using data collected from

    t phone network or WiFi access points. This provider is not as accurate as the

    previous one, but for most applications exactly enough.

    - PASSIVE_PROVIDER, which means the device itself does not want to

    determine the location, but instead uses locations determined by other applications

    or services. The goal is to save power.


    The application TheLocation is the first of two above providers to determine

    t location of the device (see the window below). The program opens a window that

    determines the coordinates of the device location (longitude and latitude). The
    window has

    two buttons, both from start showing the text Start. Clicking on the top button
    changes the

    text to Stop, and the program will periodically update the values for Longitude
    and Latitude

    with the current location using the GPS provider. The bottom button works the
    same way,

    but instead, the network provider is used.


