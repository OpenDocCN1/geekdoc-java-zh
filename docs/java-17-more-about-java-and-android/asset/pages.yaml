    # 8.2 CONNECT TO AN URL


    A WebView component can be used to display a website, but when relation to apps
    on a phone it is far from the typical use of the Internet. Far more often, you
    are interested in retrieving data to your phone by connecting to a URL. It could
    be a web service that returns data in format, and there are actually many kinds
    of services that are public and directly available to anyone who wants to apply
    them. Many of these services return JSON data, which does not matter a lot, and
    there are standard parsers, so are easy to use. In this section I will show an
    application that connects to a service and retrieves the service''s data. The
    application does not use the data in question (does not interpret data), but after
    the data is retrieved, a *Toast* tells how many characters are retrieved.


    The service in question has the:


