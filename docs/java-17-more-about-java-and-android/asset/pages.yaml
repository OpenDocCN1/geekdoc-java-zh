    FOREWORD


    # FOREWORD


    The current book is the seventeenth in this series of books on software development
    in Java, and it is a continuation of the previous book on mobile phone applications
    development.

    The book requires knowledge about Java and Android corresponding to what is dealt
    with the book Java 16, and the goal is to introduce topics that were not available
    in this book. Among other things, the book will introduce how use fragments that
    are important for developing larger applications and ensuring independence of
    the current device. Other important topics are to introduce how to use the facilities
    (such as GPS and Camera) as a telephone relative to a conventional PC makes available.
    Finally, the book will expand the substance regarding services and present solutions
    to some of the shortcomings mentioned at the end of the previous book. The goal
    is that make the reader after the previous book and this book able to practice
    develop Android applications in Java.


    As the title says this series of books deals with software development, and the
    goal is to teach the reader how to develop applications in Java. It can be learned
    by reading the subject and by studying complete programs, but most importantly
    by yourself to it and write your own programs from scratch. Therefore, an important
    part of the books is exercises and problems, where the reader has to write programs
    that correspond to the skeleton and will consist of text and examples and exercises
    and problems that are placed in the text where they naturally belongs. The difference
    between exercises and problems is that the exercises largely deals with repetitions
    of the substance that is presented in the text, and furthermore it relatively
    accurately described what to do. Problems are in turn loosely described, and are
    a little bigger and there is rarely any clear best solution. These books are to
    read from start to finish, and many code examples, including exercises and problems
    play a central role, and it is important that the reader predict in detail studying
    the code to the many examples and also solves the exercises and possibly just
    studying the recommended solutions.


    All books end with one or two larger sample programs, which focus primarily is
    on process and an explanation of how the program is written. On the other hand
    the code only to a limited extent – if at all – and the reader should study the
    finished program code perhaps while testing the program. In addition to show the
    development of programs that are larger than the examples, which otherwise is
    presented, the aim of the concluding examples also to show program examples from
    varying fields of application.


    Most books also end with an appendix dealing with a subject that would not be
    treated in the books. It may be issues on the installation of software or other
    topics in computer'
