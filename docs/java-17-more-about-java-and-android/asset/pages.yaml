  md: '# 11 ANDROID AND SECURITY


    When writing programs, security plays an increasing role, and it also applies
    to applications for mobile phones and other Android devices, and even more than
    is the case with PC applications, as you constantly download and install apps
    on your device. Android has a relatively short history and the security issue
    has been part of Android right the start, but nevertheless, the security of Android
    devices has always been challenged and has constantly caused Google to strengthen
    the security requirements, and they have all the time changed the requirements
    for the applications that you can download and install on the phone. Therefore,
    I would like to close this book on developing mobile phone applications with some
    remarks about the security requirements and what an application can do.


    As long as it''s all about developing apps as it has been done in and the previous
    book, where an app is tested in the emulator, or possibly installed and tested
    on a physical device using an USB cable, there are no problems, and at least is
    the developer who takes responsibility for his programs. If, on the other hand,
    downloading apps from an app store (as is what ordinary users do), there is a
    whole different case, because you do not know how and what they do in the hidden,
    being installed and running on your own machine. Here is trust enough, but procedures
    and controls are required to ensure that these apps do not damage the device and
    the user''s data and possibly steal the user''s data — if that is possible and
    if not, at least minimize the risk. All that''s not simple and it complicates
    the development of programs considerably.


    # 11.1 THE ANDROIDMANIFEST.XML


    As already shown in many examples, an app cant immediately use many of the device''s
    features, such as making a phone call, writing to a file, opening a website, and
    Here it is the developer who should give permission using a permission element
    in the manifest:


    ```

    <uses-permission android:name="name"> android:maxSdkVersion="number">

    ```


    and you can have all the permission elements that are needed. The name is a constant
    defined in a package android.permission, and an example could be:


    ```

    android.permission.INTERNET

    ```'
