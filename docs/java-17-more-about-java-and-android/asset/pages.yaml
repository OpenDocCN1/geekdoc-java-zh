    The class has in addition to a single constant 6 variables, and here are the last
    4 references to the 4 TextView components in the user interface that need to be
    updated. The variable permission is used to test whether the program is entitled
    to determine the location, and finally it is the last one that has the type LocationManager
    and represent an object that is used to process locations, or of course it is
    the use of this as is the most important thing.


    In onCreate(), the LocationManager object is created, and the 4 variables to refer
    to the components in the user interface are initialized. The manifest has defined
    that the program may use the GPS system, for security reasons, the user must explicitly
    give permission for it and it happens the same as I have shown in the previous
    program, where the necessary statements have been placed in a method requestPermission().
    Viewed from this program, it is important that the variable permission is initialized.


    The method gpsOff is the event handler for the top button. First, the variable
    permission is tested and if it is true, the button''s text is used to determine
    if you want to start reading GPS locations, or the opposite. Eventually an event
    handler is removed from the LocationManager object, and otherwise is requestLocationUpdates()
    called to start reading locations. Here, first it is that a GPS provider must
    be used, and then the time (at least 30 seconds) between each reading. The next
    parameter indicates the minimum distance in meters for a new reading to be done
    and finally the parameter is the event handler that is to be performed for each
    reading. It is called gpsListener and is defined as an object created based on
    an anonymous class type LocationListener, which is an interface that defines 4
    methods. In this case, only one is called for each reading. The method''s parameter
    is a Location object, which includes, among other things, longitude and latitude,
    but the object actually contains some other values. The method is simple, but
    you should note that the use of runOnUiThreadThread() as the method is called
    from another thread.


    There is similar to an event handler for the other button, and an associated listener
    class, but I do not want to display the code here as it is in principle identical.'
