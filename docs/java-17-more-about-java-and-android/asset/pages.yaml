  md: '# MORE ON SERVICES


    In the previous book I have treated services, but there is more to add, and especially
    how an activity can communicate with a service. This is the subject of this chapter.


    If a component starts a service by calling startActivity(), the service will run
    until it stops itself with stopSelf() or another component stops it by calling
    stopService(). If a component starts a service by calling bindService(), the service
    will run as long as there are components that are bound to it and only when the
    service is no longer bound to clients, Android will shut it down. However, a service
    can also be stopped if the system is missing memory, and it is necessary to obtain
    resources for the activity that the user is working with.


    If a service is started with startActivity(), there is no direct communication
    between the starting activity and the service. The service carries out its work,
    and it is not possible to send a message to it (in addition to stopping it) and
    the service cannot call a method on the starting activity, but you can only get
