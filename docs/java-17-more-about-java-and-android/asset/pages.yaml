    EXTERNAL STORAGE


    # 7 EXTERNAL STORAGE


    In the previous book on files, I only showed examples of using internal storage,
    which is

    storage associated with the single application. In this chapter, I will show an
    example that

    shows how to use external storage, which is storage that may contain data that
    can be used

    by multiple applications.


    There are actually two types of external storage


    +   1. Primary External Storage, which physically is part of the phone and whose
    size is

    determined by the phone''s producer.

    2. Secondary External Storage, which is typically a SD card, but may also be a
    device

    connected to the phone with a cable.


    The following example relates only to the first type of external storage, as it
    is the most

    effective form of external storage, and since the device does not necessarily
    have a SD card.

    From Android version 6, it is quite simple to use external storage on a SD card,
    but the

    supplier may not have opened up the possibility. The reason is lacking security,
    and Android

    actually recommends not using a SD card as external storage.


    When I in the following refer to external storage, it means primary external storage,
    or

    otherwise, the use of external storage is in principle similar to that shown for
    internal storage

    in the previous book. The project TheStorage opens a window


