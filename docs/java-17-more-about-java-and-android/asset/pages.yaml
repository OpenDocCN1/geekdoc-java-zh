  md: "# JAVA 17: MORE ABOUT JAVA AND\nANDROID: SOFTWARE DEVELOPMENT FRAGMENTS\n\n\
    # 2.2 THE SCREEN SIZE\n\nAbove I have shown how to get Android to apply a particular\
    \ layout depending on the\nphone's orientation, where Android, based on a particular\
    \ name convention, decides which\nresource to use. You can do the same with regard\
    \ to the screen size. However, it is not quite\nsimple as today there are many\
    \ different screen sizes, among other things you\nhave to take into account tablets.\n\
    \nI will start with a copy of the above project, which I have called TheBooks3.\
    \ I will first\nimplement the solution with regard to the rotation of the phone\
    \ in a different way. I have\nchanged the name of the version of activity_main.xml\
    \ found under the directory layout-land\nto activity_main_wide.xml, and then I\
    \ copied the file to the directory layout and then\ndeleted the directory layout-land\
    \ again. The result is that the directory layout now contains\four files:\n\n\
    ![](img/dfa4439d1c62650bb2a6b471e62c51e8_21_0.png)\n\nAs the next step, I have\
    \ the same way as shown above (with the same wizard) added a\nresource directory:\n\
    \nNew | Android resource directory\n\nwith the name values-land. For this directory,\
    \ I have added the following XML file, which\n I called refi.xml.\n\n```\n<resources>\n\
    \  <item type=\"layout\" name=\"activity_main\">\n@layout/activity_main_wide\n\
    \  </item>\n</resources>\n```\n\nIt is a resource in a land directory, and the\
    \ result is that if the device is held horizontal,\nAndroid will use it layout\
    \ as references for activity_main.xml it\nmust use activity_main_wide.xml instead\
    \ of activity_main.xml. If you try the application now,\ny will see that it all\
    \ works and that the phone uses a different layout depending\nwhether it is vertical\
    \ or horizontal. For the time, there is no benefit in this\nsolution compared\
    \ with the previous example. The technique is called layout aliasing,\nand the\
    \ advantage is that you can easily expand the solution to include devices with\
    \ a different\nscreen size."
