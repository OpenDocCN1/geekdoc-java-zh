    reasons are many and range from simple tasks that suddenly take longer than expected
    to that during the development process new demands arise. Particular attention
    should be paid to the latter, where new demands must be estimated for the time
    consumed and included in the project plan.


    In addition to estimating the time to solve the individual tasks, one should also
    pay attention to how much time each project participant can add to the project.
    The time estimate and project participants are ultimately important for the delivery
