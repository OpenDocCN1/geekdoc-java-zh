    Please first note that it is a service as the class inherits Service. Then that
    the class Service has two inner classes. The class starts by defining 6 constants,
    which are used to define parameters associated with Intent objects, as well as
    for the operations that the service must perform. The only requirement is that
    you have strict identities, but the actual values do not really matter — only
    connection in debug.


    After the 6 constants, three variables are defined, the first representing a receiver
    — has the type Receiver — so the application can send messages to the service.
    The next represents a thread that every second increments a counter with 1 and
    the last variable is the counter.


    The receiver object is created in onCreate and is an object whose type is Receiver,
    which is an inner class. You should note that the class inherits BroadcastReceiver
    and therefore you must implement the method onError(). It has two parameters,
    where the first is the Context object sent a message while the last is the message
    passed into an Intent object. The method determines the value of getAction() from
    the Intent object, and if this value is one of the 6 constants, a parameter is
    determined by the key KEY_MESSAGE_SERVICE. The value of this parameter is converted
    to uppercase letters and packed into an Intent object named GET_MESSAGE_CLIENT,
    which after it is sent using the method sendBroadcast(). You should note that
    it is a method in the class Context. The relevant message is sent to the receiver
    objects, which are registered as listeners for this message.


    onStartCommand() creates an IntentFilter and registers the receiver that listens
    for messages named GET_MESSAGE_SERVICE. Then, the method creates a Thread object
    (also an inner class) that starts a thread, which every second updates the variable
    counter. In addition, the thread creates an Intent identified by GET_COUNTER_CLIENT
    and adds the counter as a parameter, and that Intent is sent with sendBroadcast()
    to any registered activity. You should note that the service does not know if
    there are registered listeners for the actual action, but it is also not the idea
    that the service should know it.


