  md: 'JAVA 17: MORE JAVA AND

    ANDROID: SOFTWARE DEVELOPMENT FRAGMENTS


    # 2.5 THE FRAGMENT LIFE CYCLE


    In the book Java 16 (section 4.4) I have mentioned the activities life cycle and
    the callback methods performed in conjunction with a state shift. There is something
    similar for fragments, and since fragments are linked to activities, there is
    of course a close connection. Here it is worth noting that it is often the case,
    that an activity is created, closed and re-created many times, and a good example
    of an event is if the phone is rotated.


    Just as there is for an activity associated with a number of callback methods,
    the same applies to fragments, and of course, there is a connection to as these
    methods are performed. When a fragment is initialized, the following callback
    methods are performed, where the methods on the left relate to the activity, while
    the methods on the right relate to the fragment:


    ```

    onCreate()

    onAttach()

    onAttachFragment()

    onCreate()

    onCreateView()

    ActivityCreate()

    onStart()

    onResume()

    onResume()

    ```


    The most important method is onCreateView() as illustrated in the previous examples.
    When a fragment is associated with an activity, a method onAttach() is performed,
    and then the activity is known in the fragment and you can use the method getActivity().
    Then the fragment sends a notification to the activity, after onCreate() and onCreateView()
    are executed, where the layout is created in the last. The two methods are the
    most important and for many fragments they are the only callback methods that
    are overridden. The difference is if the initialization has actions that takes
    time to connect to a data source, complex calculations and allocation of resources
    it should be performed in onCreate() and the rest and the primary initialization
    of the layout should be done in onCreateView(). The reason is that it often only
    the fragment view hierarchy is shut down and therefore it is not necessary to
    perform time-consuming initialization every time something happens to the phone.


    The four methods


    +   1. onAttach()

    2. onAttachFragment()

    3. onCreate()

    4. onCreateView()


