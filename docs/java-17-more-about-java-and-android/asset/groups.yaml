  mdcn: "\n\n# JAVA 17：更多关于 JAVA 和安卓：软件开发片段（Fragments）\n\n当手机垂直握持时，MainActivity 的结果是将整个屏幕提供给列表。如果你的手机是水平持持或者是平板电脑，程序将像以前一样工作，并使用\
    \ `activity_main_wide.xml` 布局。\n\n以下是显示的 `BookActivity extends Activity` 类：\n\n\
    ```\npublic class BookActivity extends Activity {\n    @Override\n    protected\
    \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
    \        setContentView(R.layout.activity_book);\n        Intent intent = getIntent();\n\
    \        int id = intent.getIntExtra(\"bookIndex\", -1);\n        if (id != -1)\
