    # JAVA 17: MORE JAVA AND

    ANDROID: SOFTWARE DEVELOPMENT


    First, note that the class inherits DialogFragment. This means that the class
    is a Fragment

    and it is a fragment that is a wrapper of a Dialog object. A DialogFragment has
    a style

    that can be


    +   1. STYLE_NORMAL (default)

    2. STYLE_NO_TITLE

    3. STYLE_NO_FRAME

    4. STYLE_NO_INPUT


    A dialog box consists of three parts, which are the layout area itself, a title
    and a frame.

    The first style constant indicates that all three parts must be displayed, the
    other that

    should be no title, the third that should be neither a title nor a frame, and
    finally

    the last that should be neither a title nor a frame, and the dialog box should
    not

    receive input events. In this case, the style is STYLE_NORMAL, and you must define
    it

    in onCreate() with setStyle(). The parameter to setStyle is 0 and indicates that
    Android

    decide which dialog to theme, and it is possible to set your own. When the dialog

    opens and onCreate() is executed, a Person object is transferred, and you should
    notice how to make a reference to this object with getArguments().


    Then there is onCreateView(), which this time is extensive. First of all, there
    must

    associate event handlers with the three buttons. For the Cancel button, it''s
    a simple

    handler, which should not do anything other to close the dialog. This happens
    with the

    method dismiss(). For the OK button, the handler of the type OkHandler is assigned,
    as

    in inner class. Finally, there is the button Remove where the handler is created
    as an object

    of an anonymous class. The handler tests whether the person has a last name (and
    thus

    a new person). If this is the case, the activity for the fragment is determined
    and if

    has the type OnDialogClickListener (an interface defined as an internal interface
    in the

    Person Dialog), a method onClick() is called with the constant CMD_REMOVE

    as parameter. The goal is that the activity containing the fragment (and that,
    is displaying,

    didalog) will receive a notification that this button has been clicked.


    After the three event handlers are attached to the buttons, the three EditText
    components

    are initialized with the values of the Person object that has been transferred.
    As the final

    step, a reference is made to the Dialog object that the DialogFragment is a wrapper
    for. It

    is used to define the title of the title. In a dialog box closes if you click
    somewhere

    outside the dialog box. If you do not want it, you can say that it should not
    be the case,

    which happens with the statement:


    ```

    dialog.setanceledOnTouchOutside(false);

    ```'
