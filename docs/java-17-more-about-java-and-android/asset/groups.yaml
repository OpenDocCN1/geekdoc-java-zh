    该项目名为 WineApp，但我不想描述项目过程。我只想提到项目已经按照上述任务拆分完成。当我不想描述开发过程时，是因为会有很多废话，实际上它们并不能告诉你太多信息。另一方面，鼓励你学习该项目并尝试它，如果不在模拟器中运行，就在手机上运行。该程序相对于本书和前一本书显示的内容，是一个主要的程序，并且使用的安卓功能比其他提到的要多。


    通过这个项目新增的新内容（可能它仅仅是一部分），这两本书为移动应用开发提供了基础，但实际上这还有很多内容要学，特别是你应该意识到手机领域的发展仍在移动中，新事物在不断演变，新的方法在不断被开发。前本书完全专注于使用
    Java 编写的应用开发，通过练习，你可以成为一名优秀的安卓 设备应用开发者。然而，还有其他工具，如果你打算使用这些工具，有充分的理由关注它们，它们有时可能比用
    Java 编写应用程序更有效。总的来说，你应该预计在移动应用开发组织中会遇到其他工具，这是件好事，因为毕竟差异并不大。

