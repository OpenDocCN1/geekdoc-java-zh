- md: "\nJAVA 17: MORE ABOUT JAVA AND ANDROID: SOFTWARE DEVELOPMENT\n\n## 9.2 A NEVER\
    \ ENDING SERVICE\n\nAs the last thing services, I will show an example consisting\
    \ of two programs:\n\n- 1. A program, that starts a service and stops is still\
    \ running and generates the primes, and for every prime the service broadcasts\
    \ the prime.\n- 2. A program, that is registered as listener for the primes, and\
    \ shows every new prime on the screen.\n\nIn principle, it is quite simple, but\
    \ there is a simple challenge, which consists in keeping the service alive after\
    \ starting the activity is completed. The service is of project TheService3, and\
    \ there are three Java files that you should notice.\n\nThe first is PrimesStarter\
    \ and is a quite simple receiver class:\n\n```java\npackage dk.data.torus.theservices;\n\
    \nimport android.content.BroadcastReceiver;\nimport android.content.Context;\n\
    import android.content.Intent;\n\npublic class PrimesStarter extends BroadcastReceiver\
    \ {\n    @Override\n    public void onReceive(Context context, Intent intent)\
    \ {\n        context.startService(new Intent(context, PrimesService.class));\n\
    \    }\n}\n```\n\nAs you can see, nothing happens in onCreate() a service is started.\
    \ For the time being, it's not easy to see what is going on with this class, but\
    \ it should solve the problem that if an application starts a service, and afterwards\
    \ the application closes, then terminates the service.\n\nThe service is called\
    \ PrimesService:\n\n```java\npackage dk.data.torus.theservices;\n\nimport android.app.Service;\n\
    import android.content.Intent;\nimport android.os.IBinder;\n\npublic class PrimesService\
    \ extends Service {\n    private long prime = 0;\n    private TheThread theThread;\n\
    ```\n\n```java\n@Override\npublic int onStartCommand(Intent intent, int flags,\
    \ int startID) {\n  super.onStartCommand(intent, flags, startID);\n  theThread\
    \ = new Thread();\n  theThread.start();\n  return START_STICKY;\n}\n```\n\n```java\n\
    @Override\npublic void onDestroy() {\n  super.onDestroy();\n  sendBroadcast(new\
    \ Intent(\"dk.data.torus.RestartPrimes\"));\n  theThread.terminate();\n}\n```\n\
    \n```java\n@Override\npublic IBinder onBind(Intent intent) {\n  return null;\n\
    }\n```\n\n![](img/dfa4439d1c62650bb2a6b471e62c51e8_127_0.png)\n\n```java\nprivate\
    \ class TheThread extends Thread {\n    private boolean running;\n    public void\
    \ terminate() {\n        running = false;\n    }\n    @Override\n    public void\
    \ run() {\n        running = true;\n        while (running) {\n            try\
    \ {\n                while (!isPrime(prime)) {\n                    ++prime;\n\
    \                    if (prime == Long.MAX_VALUE) prime = 0;\n               \
    \ }\n                Intent tosend = new Intent();\n                tosend.putExtra(\"\
    PRIME\", prime);\n                sendBroadcast(tosend);\n                ++prime;\n\
    \            } catch (Exception e) {\n            }\n        }\n    }\n}\n```\n\
    \n```java\nprivate boolean isPrime(long t) {\n    if (t == 2 || t == 3 || t ==\
    \ 5 || t == 7) return true;\n    if (t < 11 || t % 2 == 0) return false;\n   \
    \ for (long n = 3, m = (long)Math.sqrt(t) + 1; n <= m; n += 2)\n        if (t\
    \ % n == 0) return false;\n    return true;\n}\n```\n\nonStartCommand() creates\
    \ a thread and starts it. That runs for as long as the variable running is true\
    \ (until the method terminate() is performed). For each iteration, the next prime\
    \ is determined and broadcast of that number is performed. The idea is, of course,\
    \ if the service is allowed to run for a long time, it starts taking time to determine\
    \ the next prime numbers, and from a client you will find that there is time between\
    \ each number is displayed.\n\nThere is onDestroy() and it sends a broadcast with\
    \ the value dk.torus.data.RestartPrimes. This means that the method onDestroy\
    \ in the above class PrimesRestarter is performed and restarts the service. It\
    \ ensures that, the service is still running after the activity is closed.\n\n\
    Then there is MainActivity, which this is trivial:\n\n```java\npackage dk.data.torus.services;\n\
    \nimport android.content.Intent;\nimport android.os.Bundle;\nimport android.support.v7.app.AppCompatActivity;\n\
    \npublic class MainActivity extends AppCompatActivity {\n    @Override\n    protected\
    \ void onCreate(Bundle savedInstanceState) {\n      super.onCreate(savedInstanceState);\n\
    \      startService(new Intent(this, PrimesService.class));\n      finish();\n\
    \    }\n}\n```\n\nonCreate starts the service, after which the activity closes\
    \ itself. You should note that there is no content view – the application does\
    \ not have a user interface. The project has an activity_main.xml and can be easily\
    \ deleted. It is automatically generated by Android Studio and may be useful for\
    \ testing.\n\nThen the application that creates and starts the service is almost\
    \ complete. What is missing is the manifest that will tie it together:\n\n```xml\n\
    <xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns=\"http://schemas.android.com/apk/res/android\"\
    \n    package=\"dk.data.torus.services3\">\n    <application\n        android:allowBackup=\"\
    true\"\n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"\
    @string/app_name\"\n        android:roundIcon=\"@mipmap/ic_launcher_round\"\n\
    \        android:supportsRtl=\"true\"\n        android:theme=\"@style/AppTheme\"\
    >\n        <activity android:name=\".MainActivity\">\n            <intent-filter>\n\
    \              <action android:name=\"android.intent.action.MAIN\" />\n      \
    \        <category android:name=\"android.intent.category.LAUNCHER\" />\n    \
    \        </intent-filter>\n        </activity>\n        <service\n           \
    \ android:name=\"dk.data.torus.services3.PrimesService\"\n            android:enabled=\"\
    true\" />\n    </application>\n</manifest>\n```\n\n```xml\n<receiver\n  android:name=\"\
    dk.data.torus.webservices3.PrimesRestarter\"\n  android:enabled=\"true\"\n  android:exported=\"\
    true\"\n  android:label=\"RestartServiceWhenStopped\">\n  <intent-filter>\n  \
    \  <action android:name=\"dk.data.torus.RestartPrimes\"/>\n  </intent-filter>\n\
    </receiver>\n```\n\nHere is not much new and you should primarily receive the\
    \ note receiver class, with the method onReceive() is performed every time the\
    \ service generates a new prime number – provided that the service is running.\
    \ If it's first started (by the application TheServices3), it will in principle\
    \ run forever or until the phone goes out, but you can of course always stop services.\n"
  mdcn: "\n\nJAVA 17: 关于 JAVA 和 ANDROID：软件开发\n\n## 9.2 一个永不停的服务\n\n作为最后一个部分，关于服务，我将展示一个包含两个程序的示例：\n\
    \n- 1. 一个程序，它启动一个服务并在后台持续运行的同时生成质数，并且对于每一个质数服务都会广播该质数。\n- 2. 一个程序，注册为质数的监听器，并在屏幕上显示每一个新质数。\n\
    \n原则上，这非常简单，但有一个简单的挑战，即如何在活动完成后仍保持服务运行。该服务属于项目 TheService3，其中有三个 Java 文件需要你注意。\n\
    \n第一个是 `PrimesStarter`，这是一个非常简单的接收器类：\n\n```java\npackage dk.data.torus.theservices;\n\
    \nimport android.content.BroadcastReceiver;\nimport android.content.Context;\n\
    import android.content.Intent;\n\npublic class PrimesStarter extends BroadcastReceiver\
    \ {\n    @Override\n    public void onReceive(Context context, Intent intent)\
    \ {\n        context.startService(new Intent(context, PrimesService.class));\n\
    \    }\n}\n```\n\n如你所见，`onCreate()` 中什么都没有发生，只是启动了服务。目前，还很难看出这个类在做什么，但它应该能解决这样一个问题：如果应用程序启动了服务，随后应用程序关闭，则终止该服务。\n\
    \n该服务名为 `PrimesService`：\n\n```java\npackage dk.data.torus.theservices;\n\nimport\
    \ android.app.Service;\nimport android.content.Intent;\nimport android.os.IBinder;\n\
    \npublic class PrimesService extends Service {\n    private long prime = 0;\n\
    \    private TheThread theThread;\n```\n\n```java\n@Override\npublic int onStartCommand(Intent\
    \ intent, int flags, int startID) {\n  super.onStartCommand(intent, flags, startID);\n\
    \  theThread = new Thread();\n  theThread.start();\n  return START_STICKY;\n}\n\
    ```\n\n```java\n@Override\npublic void onDestroy() {\n  super.onDestroy();\n \
    \ sendBroadcast(new Intent(\"dk.data.torus.RestartPrimes\"));\n  theThread.terminate();\n\
    }\n```\n\n```java\n@Override\npublic IBinder onBind(Intent intent) {\n  return\
    \ null;\n}\n```\n\n![](img/dfa4439d1c62650bb2a6b471e62c51e8_127_0.png)\n\n```java\n\
    private class TheThread extends Thread {\n    private boolean running;\n    public\
    \ void terminate() {\n        running = false;\n    }\n    @Override\n    public\
    \ void run() {\n        running = true;\n        while (running) {\n         \
    \   try {\n                while (!isPrime(prime)) {\n                    ++prime;\n\
    \                    if (prime == Long.MAX_VALUE) prime = 0;\n               \
    \ }\n                Intent tosend = new Intent();\n                tosend.putExtra(\"\
    PRIME\", prime);\n                sendBroadcast(tosend);\n                ++prime;\n\
    \            } catch (Exception e) {\n            }\n        }\n    }\n}\n```\n\
    \n```java\nprivate boolean isPrime(long t) {\n    if (t == 2 || t == 3 || t ==\
    \ 5 || t == 7) return true;\n    if (t < 11 || t % 2 == 0) return false;\n   \
    \ for (long n = 3, m = (long)Math.sqrt(t) + 1; n <= m; n += 2)\n        if (t\
    \ % n == 0) return false;\n    return true;\n}\n```\n\n`onStartCommand()` 创建了一个线程并启动它。只要变量\
    \ `running` 为 `true`，它就会一直运行（直到执行 `terminate()` 方法）。在每次迭代中，都会确定下一个质数并广播该数字。其想法是，如果允许服务运行长时间，确定下一个质数将花费时间，从客户端你会发现每个数字显示之间存在时间间隔。\n\
    \n有一个 `onDestroy()`，它发送一个值为 `dk.torus.data.RestartPrimes` 的广播。这意味着上述类 `PrimesRestarter`\
    \ 中的 `onDestroy` 方法将被执行并重启服务。这确保了在活动关闭后，服务仍在运行。\n\n然后是 `MainActivity`，它是显而易见的：\n\
    \n```java\npackage dk.data.torus.services;\n\nimport android.content.Intent;\n\
    import android.os.Bundle;\nimport android.support.v7.app.AppCompatActivity;\n\n\
    public class MainActivity extends AppCompatActivity {\n    @Override\n    protected\
    \ void onCreate(Bundle savedInstanceState) {\n      super.onCreate(savedInstanceState);\n\
    \      startService(new Intent(this, PrimesService.class));\n      finish();\n\
    \    }\n}\n```\n\n`onCreate` 启动服务，之后活动将自关闭。你应该注意这里没有 `setContentView` —— 应用程序没有用户界面。项目有一个\
    \ `activity_main.xml`，可以轻松删除。它是由 Android Studio 自动生成的，可能对测试有用。\n\n现在，这个创建并启动服务的应用程序几乎完成了。缺少的是将它们整合在一起的清单文件（manifest）：\n\
    \n```xml\n<xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns=\"http://schemas.android.com/apk/res/android\"\
    \n    package=\"dk.data.torus.services3\">\n    <application\n        android:allowBackup=\"\
    true\"\n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"\
    @string/app_name\"\n        android:roundIcon=\"@mipmap/ic_launcher_round\"\n\
    \        android:supportsRtl=\"true\"\n        android:theme=\"@style/AppTheme\"\
    >\n        <activity android:name=\".MainActivity\">\n            <intent-filter>\n\
    \              <action android:name=\"android.intent.action.MAIN\" />\n      \
    \        <category android:name=\"android.intent.category.LAUNCHER\" />\n    \
    \        </intent-filter>\n        </activity>\n        <service\n           \
    \ android:name=\"dk.data.torus.services3.PrimesService\"\n            android:enabled=\"\
    true\" />\n    </application>\n</manifest>\n```\n\n```xml\n<receiver\n  android:name=\"\
    dk.data.torus.webservices3.PrimesRestarter\"\n  android:enabled=\"true\"\n  android:exported=\"\
    true\"\n  android:label=\"RestartServiceWhenStopped\">\n  <intent-filter>\n  \
    \  <action android:name=\"dk.data.torus.RestartPrimes\"/>\n  </intent-filter>\n\
    </receiver>\n```\n\n"
