- md: "\n# JAVA 17: MORE ABOUT JAVA AND ANDROID: SOFTWARE DEVELOPMENT FRAGMENTS\n\n\
    ## 2.2 THE SCREEN SIZE\n\nAbove I have shown how to get Android to apply a particular\
    \ layout depending on the\nphone's orientation, where Android, based on a particular\
    \ name convention, decides which\nresource to use. You can do the same with regard\
    \ to the screen size. However, it is not quite\nsimple as today there are many\
    \ different screen sizes, among other things you\nhave to take into account tablets.\n\
    \nI will start with a copy of the above project, which I have called TheBooks3.\
    \ I will first\nimplement the solution with regard to the rotation of the phone\
    \ in a different way. I have changed the name of the version of activity_main.xml\
    \ found under the directory layout-land\nto activity_main_wide.xml, and then I\
    \ copied the file to the directory layout and then\ndeleted the directory layout-land\
    \ again. The result is that the directory layout now contains our files:\n\n![](img/dfa4439d1c62650bb2a6b471e62c51e8_21_0.png)\n\
    \nAs the next step, I have the same way as shown above (with the same wizard)\
    \ added a\nresource directory:\n\nNew | Android resource directory\n\nwith the\
    \ name values-land. For this directory, I have added the following XML file, which\n\
    I called refi.xml.\n\n```xml\n<resources>\n  <item type=\"layout\" name=\"activity_main\"\
    >\n    @layout/activity_main_wide\n  </item>\n</resources>\n```\n\nIt is a resource\
    \ in a land directory, and the result is that if the device is held horizontal,\n\
    Android will use it layout as references for activity_main.xml it must use activity_main_wide.xml\
    \ instead of activity_main.xml. If you try the application now,\nyou will see\
    \ that it all works and that the phone uses a different layout depending\nwhether\
    \ it is vertical or horizontal. For the time, there is no benefit in this\nsolution\
    \ compared with the previous example. The technique is called layout aliasing,\n\
    and the advantage is that you can easily expand the solution to include devices\
    \ with a different\nscreen size.\n\n# JAVA 17: ABOUT JAVA AND ANDROID: SOFTWARE\
    \ DEVELOPMENT\n\nToday, as mentioned, there are many screen sizes that vary in\
    \ terms of physical size and resolution. Similarly, Android uses a measurement\
    \ unit called density independent pixel and is dp, and it is the unit of measurement\
    \ that I have used throughout the previous book. 1 dp is defined as the physical\
    \ size of 1 pixel on a 160 dpi device and is therefore independent of the screen's\
    \ physical pixel size. For example, if you consider a 7 inch screen on a 160 dpi\
    \ device, there are 1120 pixels along the diagonal. The screen format 16 x 9 it\
    \ gives with a slightly rounding of a resolution of 1000 x 600 dp.\n\nAndroid\
    \ defines screen sizes using resource screen size qualifiers, and here are three\
    \ options that are defined using a resource directory:\n\n- Smallest width screen\
    \ size qualifier. It corresponds to the number of dp for the screen's newest point\
    \ independent of the device orientation. The name of a resource directory is sw,\
    \ followed by the desired screen size. For an example a layout resource directory\
    \ for devices with a smallest width of at least 600 dp is called layout-sw-600dp.\n\
    - Available width screen size qualifier. It corresponds to the number of dp measured\
    \ to left for the device's current orientation. If you change the device orientation\
    \ you also change the available width. The name of a resource directory is w,\
    \ followed by the width. For an example, a layout resource directory for devices\
    \ with available width of at least 600 dp is called layout-w-600dp.\n- Available\
    \ height screen size qualifier. It corresponds to and behaves identically to the\
    \ available width screen size qualifier, except that h is used instead of w and\
    \ measured dp from top to bottom for the device's current orientation. A layout\
    \ resource directory for devices with an available height for at least 600 dp\
    \ is called layout-h-600dp.\n\nInstead of specifying resource directories using\
    \ resource screen size qualifiers, you use an older way of splitting devices into\
    \ groups: small, normal, large, or xlarge, and a resource directory name may,\
    \ for example, layout-large.\n\nIn the present case, I have added a resource directory\
    \ values-large in the same way as above to select\n\nNew | Android resource directory\n\
    \nIn the present case, I have added a resource directory values-large in the same\
    \ way as above to select\n\n# JAVA 17: MORE ABOUT JAVA AND ANDROID: SOFTWARE DEVELOPMENT\
    \ FRAGMENTS\n\n![](img/dfa4439d1c62650bb2a6b471e62c51e8_23_0.png)\n\n# JAVA 17:\
    \ MORE ABOUT JAVA AND ANDROID: SOFTWARE DEVELOPMENT\n\n![](img/dfa4439d1c62650bb2a6b471e62c51e8_23_1.png)\n\
    \n![](img/dfa4439d1c62650bb2a6b471e62c51e8_23_2.png)\n\n# JAVA 17: MORE ABOUT\
    \ JAVA AND ANDROID: SOFTWARE DEVELOPMENT\n\n![](img/dfa4439d1c62650bb2a6b471e62c51e8_24_0.png)\n\
    \n# JAVA 17: MORE ABOUT JAVA AND ANDROID: SOFTWARE DEVELOPMENT\n\n![](img/dfa4439d1c62650bb2a6b471e62c51e8_24_1.png)\n\
    \n## 2.3 COMMUNICATION BETWEEN FRAGMENTS\n"
  mdcn: "\n\n# JAVA 17：更多关于 Java 和 Android：软件开发片段\n\n## 2.2 屏幕尺寸\n\n在上面我向你们展示了如何让\
    \ Android 根据手机的取向应用特定的布局，其中 Android 根据特定的命名约定来决定使用哪种资源。你也可以针对屏幕尺寸进行同样的操作。然而，这并不完全简单，因为现在有许多不同的屏幕尺寸，此外你还必须考虑平板电脑。\n\
    \n我将从上面项目的一个副本开始，我将其命名为 TheBooks3。首先，我将以一种不同的方式实现针对手机旋转的解决方案。我将位于 `layout-land`\
    \ 目录下的 `activity_main.xml` 版本重命名为 `activity_main_wide.xml`，然后将该文件复制到 `layout`\
    \ 目录，并再次删除了 `layout-land` 目录。结果是 `layout` 目录现在包含了我们的文件：\n\n![](img/dfa4439d1c62650bb2a6b471e62c51e8_21_0.png)\n\
    \n下一步，我按照上面所示的方法（使用相同的向导）添加了资源目录：\n\nNew | Android resource directory\n\n名为 `values-land`。对于此目录，我添加了以下\
    \ XML 文件，我将其命名为 `refi.xml`。\n\n```xml\n<resources>\n  <item type=\"layout\" name=\"\
    activity_main\">\n    @layout/activity_main_wide\n  </item>\n</resources>\n```\n\
    \n它是 land 目录中的一个资源，结果是：如果设备水平放置，Android 将使用它作为 `activity_main.xml` 的引用，它必须使用 `activity_main_wide.xml`\
    \ 而不是 `activity_main.xml`。如果你现在尝试应用程序，你会发现一切运行正常，并且手机会根据是竖直还是水平使用不同的布局。与之前的示例相比，这种解决方案目前还没有什么益处。这种技术被称为布局别名（layout\
    \ aliasing），其优势是你可以轻松扩展解决方案以包含具有不同屏幕尺寸的设备。\n\n# JAVA 17：关于 Java 和 Android：软件开发\n\
    \n正如前面提到的，今天有许多物理尺寸和分辨率上各不相同的屏幕尺寸。同样，Android 使用名为密度无关像素（density independent pixel）的测量单位，简称\
    \ `dp`，这是我在上一本书中使用的测量单位。`1 dp` 定义为在 160 dpi 设备上 1 个像素的物理尺寸，因此它独立于屏幕的物理像素尺寸。例如，如果你考虑\
    \ 160 dpi 设备上的 7 英寸屏幕，对角线上有 1120 个像素。16 x 9 的屏幕格式通过略微舍入给出的分辨率为 1000 x 600 dp。\n\
    \nAndroid 使用资源屏幕尺寸限定符（resource screen size qualifiers）定义屏幕尺寸，这里是使用资源目录定义的三个选项：\n\
    \n- 最小宽度尺寸限定符（Smallest width screen size qualifier）。它对应于不取决于设备取向的屏幕最短 dp 数。资源目录的名称为\
    \ `sw`，后跟所需的屏幕尺寸。例如，针对最小宽度至少为 600 dp 的设备的布局资源目录称为 `layout-sw-600dp`。\n- 可用宽度尺寸限定符（Available\
    \ width screen size qualifier）。它对应于根据设备当前取向测量的 dp 数。如果你更改设备取向，可用宽度也会改变。资源目录的名称为\
    \ `w`，后跟宽度。例如，针对可用宽度至少为 600 dp 的设备的布局资源目录称为 `layout-w-600dp`。\n- 可用高度尺寸限定符（Available\
    \ height screen size qualifier）。它的行为与可用宽度尺寸限定符相同，不同的是使用 `h` 代替 `w`，并测量设备当前取向从顶部到底部的\
    \ dp。针对可用高度至少为 600 dp 的设备的布局资源目录称为 `layout-h-600dp`。\n\n与其使用资源屏幕尺寸限定符指定资源目录，不如使用较旧的方法将设备分组：`small`、`normal`、`large`\
    \ 或 `xlarge`，资源目录的名称可能是 `layout-large`。\n\n在当前情况下，我按照上面的方法添加了名为 `values-large`\
    \ 的资源目录：\n\nNew | Android resource directory\n\n在当前情况下，我按照上面的方法添加了名为 `values-large`\
    \ 的资源目录：\n\n"
