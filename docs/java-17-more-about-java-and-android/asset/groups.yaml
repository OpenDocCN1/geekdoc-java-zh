    # 12 A FINAL EXAMPLE: THE WINEAPP


    The final example of the book Java 6 is a program for managing a private wine
    cell. The program is therein excellent in the light of its functions and what
    it can, but for practical use, there is a big problem, namely that it is a PC
    program which means you have to sit at the computer for access (purchase) of the
    wines, and correspondingly every time you use a bottle of wine, and especially
    the last is a program. You will not get it done. If you postpone it for a time
    when you are at the computer. It is therefore natural to think of a solution like
    an app for a mobile phone, which would mean that you have the program "on you".
    Then, the chance of using the program would be de far greater, and the following
    is about implementing a version of the program WineApp as an app for a mobile
    phone. You can therefore think of the task of migrating a program from one platform
    to another.


    The program would basically be the same and in the work as the previous version,
    but the program must use SQLite instead of MySQL. In addition, it should be considered
    whether there are functions that need to be changed and as the last with a view
    on how to simplify the application''s use. In addition, you should use the phone''s
    camera so that you can save a picture of a bottle.


