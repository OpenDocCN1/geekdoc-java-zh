    \ staff of education and e-learning experts, and business professionals from around\
    \ the world committed to making a difference in children lives through funding,\
    \ volunteers, sponsors and generous developers. For more information, please visit\
    \ www.e-learningforkids.org.\n\n- The number 1 MOOC for Primary Education\n- Free\
    \ Digital Learning for Children 5-12\n- 15 Million Children Reached\n\nBasically,\
    \ it is the same as for an activity, but after onDestroy(), for each fragment\
    \ three methods are performed:\n\n1. onDestroy()\n2. onDestroyView()\n3. onDetach()\n\
    \nand they are performed together. Then the fragment is no longer associated with\
    \ an activity and you can no longer perform getActivity().\n\nThere are several\
    \ reasons for this separation and how to close a fragment and, among other things,\
    \ utilized if a fragment is hidden, it is only onDestroyView() that is executed\
    \ and once the fragment is visible, it is only onCreateView() that is performed.\n\
    \nYou should also be aware of the method onSaveInstanceState(), which has the\
    \ same function for an activity and is used to persist a fragment's state before\
    \ it is closed.\n\n## 2.6 A LISTFRAGMENT\n\nIf you look at the example that I\
    \ have used in this chapter, the overview of books are with radio buttons. Here\
    \ it would be more obvious to use a ListView in the fragment with the overview,\
    \ and it would also be more flexible if the program could be expanded with new\
