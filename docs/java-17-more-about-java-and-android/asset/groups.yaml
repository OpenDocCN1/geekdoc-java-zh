    ## JAVA 17：更多关于 Java 和 Android：软件开发偏好


    ## 偏好 (Preferences)


    手机（任何其他 Android 设备）都有名为“设置”的应用，用于手机设置。你选择的设置在设备重启后仍然有效，必须存储在某处。这可以通过数据库或文件实现，但由于数据量很小，Android
    使用一种名为偏好（preferences）的特殊系统以键值对（key/value pairs）的形式保存此类信息。与设备本身一样，你通常需要为自己的应用程序保存设置，与其使用文件或数据库，你可以使用偏好系统。


    原则上，偏好可以用于其他设置，因为这仅仅是保存键值对的问题，唯一的限制是值必须是字符串或简单类型的值。然而，偏好不仅仅是存储数据的方式，它还包含了用于维护这些组件，如下例所示。


    偏好可以分配给一个 Activity，而 Activity 对象有一个方法 `getPreferences()`，该方法返回一个 `SharedPreference`
    对象。偏好也可以与应用程序关联，通过 `getSharedPreferences()` 方法，你可以获取一个由名称标识的 `SharedPreferences`
    对象，因此同一个应用程序可能附加多个偏好。最后，还有针对整个设备的偏好，使用 `PreferenceManager` 对象维护，你可以使用 `getDefaultPreferences()`
    方法获取 `SharedPreferences` 对象。该方法的参数是 `Context` 并返回该对象的偏好。你可以使用这三种方法中的哪种最合适，大多数情况下你会使用最后一种方法。


    `SharedPreferences` 对象具有用于确定值的 `get` 方法，例如方法：


    - `getString()`

    - `getInt()`


    以及其他方法，这些方法有两个参数，第一个是键（key），另一个是默认值。你可以（自然地）为 `SharedPreference` 对象创建并修改值，这通过类似的
    `set` 方法实现，其参数是键和值。然而，这与正常情况有些不同，因为 `Preference` 对象有一个 `edit()` 方法，它返回一个 `Editor`
    对象，而方法被分配给该对象。要使更改生效，请通过 `Editor` 对象完成更改并执行 `commit()` 方法（或 `apply()` 方法）。`Editor`
    对象还有一个 `remove()` 方法，可用于删除单个偏好，以及一个删除所有偏好的 `clear()` 方法。


    ## JAVA 17：更多关于 Java 和 Android：软件开发偏好


    如果应用程序需要维护设置，你可以专门为此目的定义自己的 Activity，这些 Activity 可以是全面的。Android 提供了一个特殊的 Activity
    `PreferenceActivity` 和片段 `PreferenceFragment`，可以用于实现应用程序的设置，除了使其更容易之外，最重要的是，这种方式的设置对每个应用程序来说工作都是相同的。在接下来，我将通过示例
    `ThePreferences` 向你展示如何操作。如果你打开应用程序，将看到以下窗口：


    ![](img/dfa4439d1c62650bb2a6b471e62c51e8_85_0.png)


    ## JAVA 17：更多关于 Java 和 Android：软件开发偏好


    ![](img/dfa4439d1c62650bb2a6b471e62c51e8_86_0.png)


    这仅仅是一个简单的 Hello World Activity，但带有一个有两个菜单项的菜单。如果你选择第一个，你将收到一个显示程序设置标题的窗口：


    ![](img/dfa4439d1c62650bb2a6b471e62c51e8_86_1.png)


    有两个设置需要配置，第一个设置涉及颜色和文本的显示方式（见下窗口），而另一个选项是开启或关闭设置。在第一种情况下，你可以选择文本应该是**粗体**还是*斜体*（或两者都是），并且你可以选择字体大小。如果你选择字体大小，你将得到一个带有单选按钮的对话框，你可以点击所需字体大小的按钮。你也可以选择输入文本，结果是一个用于文本文本的对话框。最后，你可以选择文本颜色和背景颜色，在这两种情况下，你都会得到一个带有单选按钮的对话框。


    ## JAVA 17：关于 Java 和 Android：软件开发偏好


    ![](img/dfa4439d1c62650bb2a6b471e62c51e8_87_0.png)


    在最后一个设置窗口中，两个开关组件允许你设置这两个设置的开启和关闭：


    ![](img/dfa4439d1c62650bb2a6b471e62c51e8_87_1.png)


    ## JAVA 17：更多关于 Java 和 Android：软件开发偏好


    在这种情况下，除了作为典型设置的之外没有太大意义。下面是两个开关组件都开启且在第一个设置窗口中选择值后的窗口：


