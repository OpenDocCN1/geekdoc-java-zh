    ## JAVA 17: MORE ABOUT JAVA AND ANDROID: SOFTWARE DEVELOPMENT PREFERENCES


    ## PREFERENCES


    A phone (any other Android device) has an application called Settings, which is
    used for the phone’s settings. The settings you choose are still valid after the
    device is restarted and must be stored somewhere. This could be done in a database
    or a file, but it is small amounts of data, and Android saves these kind of information
    as key/value pairs using a special system called preferences. In the same way
    as the device itself, you often need to save settings for your own applications,
    and instead of using files or databases, you can use the preference system.


    Preferences can in principle be used for other settings, as it is just a matter
    of saving key/value pairs, and the only limitation is that the value must be a
    string or a value of a simple type. Preferences, however, are more than just a
    way to store data, but it also includes components that are used to maintain this
    data, as illustrated in the following example.


    Preferences can be assigned to an Activity, and an Activity object has a method
    getPreferences()`, which returns a SharedPreference object. Preferences can also
    be associated with the application, and by the method getSharedPreferences()`,
    you can get a SharedPreferences object identified by a name, so there may be several
    preferences attached to the same application. Finally, there are preferring to
    the entire device and maintained using a PreferenceManager object, where you can
    get a SharedPreferences object using a method getDefaultPreferences()`. The method
    has as a parameter a Context and returns preferences for this object. You can
    use which of the three ways you find the most appropriate, in most cases you use
    the last way.


    A SharedPreferences object has get methods that can be used to determine a value,
    that is, methods like:


    - getString()

    - getInt()


    and others, and the methods have two parameters, where the first is the key, while
    the other is a default value. You can (naturally) create and modify values for
    a SharedPreference object, which occurs with similarly set methods, where the
    parameters are the key and the value. However it takes a bit different from normal,
    since a Preference object has a method edit()`, that returns an Editor object,
    and the methods are assigned to this object. For the changes to have effect, finish
    the changes by the Editor object and execute the method commit() (or the method
    apply()). The Editor object also has a method remove()`, that can be used to remove
    a single preference, as well as a method clear() that removes all preferences.


    ## JAVA 17: MORE ABOUT JAVA AND ANDROID: SOFTWARE DEVELOPMENT PREFERENCES


    If an application needs to maintain settings, you of care define your own activities
    for the purpose, which can be comprehensive. Android offers a special activity
    PreferenceActivity and a fragment PreferenceFragment that can be used to implement
    settings for an application, and in addition to making it easier, the most important
    is, that settings in this way work the same to every application. In the following,
    I will with an example ThePreferences show you how to do. If you open the application,
    you get the following window:


    ![](img/dfa4439d1c62650bb2a6b471e62c51e8_85_0.png)


    ## JAVA 17: MORE JAVA AND ANDROID: SOFTWARE DEVELOPMENT PREFERENCES


    ![](img/dfa4439d1c62650bb2a6b471e62c51e8_86_0.png)


    which is nothing but a simple Hello World activity, but with a menu with two menu
    items. If you select the top one, you will receive a window that shows the headings
    for the program’s settings:


    ![](img/dfa4439d1c62650bb2a6b471e62c51e8_86_1.png)


    There are two things to set, where the first setting concerns colors and how the
    text should appear (see the window below), while the other option is to turn the
    settings on and off. In the first case, you can choose whether the text should
    be bold or italic (or both), and you can choose the font size. If you select the
    font size, you get a dialog box with radio buttons, and you can click the button
    for the desired font size. You can also choose to enter the text, and the result
    is a dialog box for text entering. Finally, you can choose text color and background
    color, and in both cases you get a dialog box with radio buttons.


