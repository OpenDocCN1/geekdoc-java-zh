    \  Intent intent = new Intent(this, MainActivity.class);\n    startActivity(intent);\n\
    \    finish();\n}\n```\n\n在 `onCreate()` 中，程序测试是否传递了参数（如果有，则是某个书籍的索引），如果是，则使用\
    \ `FragmentManager` 找到 Fragment 对象的引用，并调用 `setBook()` 方法。\n\n回到 `MainActivity`\
    \ 类，那里需要更新 `onSelectedIndexChanged` 的事件处理器：\n\n```\npublic class MainActivity\
    \ extends Activity implements SelectBookListener {\n    @Override\n    protected\
    \ void onCreate(Bundle savedInstanceState)\n    {\n        super.onCreate(savedInstanceState);\n\
    \        setContentView(R.layout.activity_main);\n    }\n\n    @Override\n   \
    \ public void onSelectedChanged(int id) {\n        FragmentManager fm = getFragmentManager();\n\
    \        BookFragment bookFragment = (BookFragment) fm.findFragmentById(R.id.fragmentBook);\n\
    \        if (bookFragment == null || !bookFragment.isVisible()) {\n          \
    \  Intent intent = new Intent(this, MainActivity.class);\n            intent.putExtra(\"\
    bookIndex\", id);\n            startActivity(intent);\n        } else\n      \
    \      bookFragment.setBook(id);\n        }\n    }\n}\n```\n\n与之前一样，程序尝试确定 `BookFragment`\
    \ 的引用。如果无法实现（或 fragment 不可见），则 activity 将以书籍索引作为参数打开，否则除了 fragment 更新外，将不会发生任何其他事情。\n\
    \n当你尝试运行该程序时，请注意，如果是平板电脑或你水平握持手机，它将像以前一样工作。\n\n# JAVA 17：更多关于 JAVA 和安卓：软件开发片段\n\
    \n## 2.5 片段（Fragment）生命周期\n\n在书籍 Java 16（第 4.4 节）中，我提到了 Activity 的生命周期以及结合状态切换执行的回调方法。Fragment\
    \ 也有类似的情况，由于 Fragment 与 Activity 关联，它们之间当然有密切的联系。这里值得注意的是，Activity 经常会被创建、关闭和重新创建多次，手机旋转就是一个很好的事件示例。\n\
    \n与关联了多个回调方法的 Activity 一样，Fragment 也是如此，而且当执行这些方法时，它们之间显然存在联系。当 Fragment 初始化时，会执行以下回调方法，其中左侧的方法与\
    \ Activity 相关，而右侧的方法与 Fragment 相关：\n\n```\nonCreate()\nonAttach()\nonAttachFragment()\n\
    onCreate()\nonCreateView()\nActivityCreate()\nonStart()\nonResume()\nonResume()\n\
    ```\n\n最重要的方法是 `onCreateView()`，如之前的示例所示。当 Fragment 与 Activity 关联时，会执行 `onAttach()`\
    \ 方法，然后 Fragment 就知道了该 Activity，你可以使用 `getActivity()` 方法。然后在 `onCreate()` 和 `onCreateView()`\
    \ 执行后，Fragment 向 Activity 发送通知，其中布局在最后创建。这两个方法最重要的，对于许多 Fragment 来说，它们是唯一重写的回调方法。区别在于，如果初始化包含耗时连接数据源的操作、复杂计算和资源分配，那么它们应该在\
    \ `onCreate()` 中执行，而其他部分和布局的主要初始化应该在 `onCreateView()` 中完成。原因是通常只有 Fragment 的视图层级会被关闭，因此没有在每次手机发生某些变化时都执行耗时的初始化。\n\
    \n这四个方法：\n\n1. onAttach()\n2. onAttachFragment()\n3. onCreate()\n4. onCreateView()\n\
    \n总是一起执行的，如果一个 Activity 关联了多个 Fragment，这非常重要。当所有 Fragment 都执行此方法序列时，是技能。因为剩余的回调方法可以单独执行。这里\
    \ `onCreate()` 调用 Fragment，当 Activity 创建时，`onStart()` 和 `onResume()` 对于 Fragment\
    \ 来说具有相同的功能。\n\n当 Fragment 隐藏或关闭时，类似于 Activity 的：\n\n| | |\n| :--- | :--- |\n\
    | onPause() | onPause() |\n| onSaveInstanceState() | onSaveInstanceState() |\n\
    | onStop | onStop |\n| onDestroy | onDestroy() |\n| onDestroy | onDetach() |\n\
    \n![](img/dfa4439d1c62650bb2a6b471e62c51e8_35_0.png)\n\n关于 e-Learning for Kids。成立于2004\
    \ 年的全球非营利基金会，致力于为 5-12 岁的儿童提供互联网学习，涵盖数学、科学、语言、艺术、计算机、健康和环境。自 2005 年以来，来自 190 个国家的\
    \ 1500 万儿童受益于来自资金、志愿者、赞助者和慷慨开发者的 e-learning。更多信息请访问 www.elearningforkids.org。\n\
    \n- 1 个基础教育 MOOC\n- 5-12 岁儿童免费数字学习\n- 已覆盖 1500 万儿童\n\n基本上，这与 Activity 相同，但在 `onDestroy()`\
    \ 之后，每个 Fragment 会执行三个方法：\n\n1. onDestroy()\n2. onDestroyView()\n3. onDetach()\n\
    \n然后 Fragment 不再与 Activity 关联，你无法再执行 `getActivity()`。\n\n你应该注意 `onSaveInstanceState()`\
    \ 方法，它与 Activity 功能相同，用于在关闭之前持久 Fragment 的状态。\n\n## 2.6 LISTFRAGMENT\n\n如果你查看本章使用的示例，书籍概述使用的是单选按钮。在这里，在概述\
    \ Fragment中使用 `ListView` 会更明显，如果程序可以扩展新书籍，也会更灵活。本节的主题是将单选按钮替换为 `ListView`。这看起来很简单，你只需要更改\
    \ `fragment_books.xml` 布局并将所有的 `RadioButton` 组件替换为 `ListView`。此外，需要将 `BooksFragment`\
    \ 类改为 `ListFragment`，但也相当简单。\n\n我从一个名为 `Books4` 的类开始，并将其复制为 `Books6`。然而，我将从修改数据源开始，使\
    \ `Book` 对象获得额外的字段：\n\n```\npublic class Book\n{\n    private String name;\n \
    \   private String title;\n    private String text;\npublic Book(String name,\
    \ String title, String text)\n{\n    this.name = name;\n    this.title = title;\n\
    \    this.text = text;\n}\n}\n```\n\n"
