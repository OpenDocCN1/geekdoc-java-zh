    2. MySQL to the extent there is a need for a database server (from the book Java
    6 onward)

    3. GlassFish as a web server and application server (from the book Java 11 onward)

    4. Android Studio, that is a tool to development of apps to mobile phones


    It is products that are free of charge and free to install, and there is even
    talk about products, where the installation is progressing by it itself and without
    major efforts and challenges. In addition, there are on the well detailed installation
    instructions for all the three products. The products are available on Windows
    and Linux, and therefore plays no special role if you use Linux or Windows.


    All sample programs are developed and tested on machines running Linux. In fact,
    it plays no major role, as both Java and other products work in exactly the same
    whether the platform is one or the other. Some places will be in the books where
    you could see that the platform is Linux, and this applies primarily commands
    concerning the file system. Otherwise it has no meaning to the reader that programs
    are developed on a Linux machine, and they can immediately run under Windows unless
    a program refers to the file system where it may be necessary to change the name
    of a file.


    Finally a little about what the books are not. It is not "how to write" or for
    that matter reference manuals in Java, but it is the title books on software development.
    It is my hope that the reader when reading the books and through the many examples
