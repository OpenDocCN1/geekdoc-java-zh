  mdcn: "\n\n## JAVA 17：更多关于 Java 和 Android：软件开发片段\n\n## 2 个片段 (Fragments)\n\n我想从片段（fragments）开始这本书，这实际上是我在上一本书的上一个示例中所缺乏的内容。就像活动（activity）一样，片段是一个布局，它是一个\
    \ XML 文档，定义了窗口（窗口的一部分 =片段）的布局和内容以及一个 Java 类。一个窗口（活动）可以包含多个片段，每个片段定义窗口的一个部分。其作用是，你可以用另一个片段替换当前片段，窗口就可以获得不同的布局，而且片段通常可以作为创建更多活动的替代方案。然而，更重要的应用意义是对屏幕的更好利用，这在平板电脑等较大的屏幕上尤为受到关注。在这里，屏幕可以容纳更多的活动，如果无法实现，你也可以并排查看多个片段。最后，片段用于平板电脑显示、列表显示以及比上一本书中显示的更好的对话框。\n\
    \n你应该意识到，片段并不是活动的绝对替代品，但片段可以简化应用程序布局的设计，并有助于在多个活动中更方便地复用布局。一个活动由多个片段组成，但特定的片段对象只能与一个活动关联。你也可以说，片段将用户界面的组件与其相关的逻辑组合在一起。\n\
