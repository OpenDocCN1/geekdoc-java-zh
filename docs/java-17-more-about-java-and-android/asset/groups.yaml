    android.intent.category.LAUNCHER\" />\n      </intent-filter>\n    </activity>\n\
    \  </application>\n</manifest>\n```\n\n列出了两个 `uses-permission` 元素。在这里，`WRITE_STORAGE`\
    \ 自动提供了 `READ_STORAGE` 权限，因此如果你只想读取，则最后一个是必要的。关于布局，我们不显示 XML，但后续是 Java 代码：\n\n\
    ```java\npublic class MainActivity extends AppCompatActivity {\n    private static\
    \ final int REQUEST_READ_PERMISSION = 100;\n    private static final int REQUEST_WRITE_PERMISSION\
