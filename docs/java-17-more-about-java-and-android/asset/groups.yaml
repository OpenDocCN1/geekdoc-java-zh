    Android version 23, an application had write permission for external storage,
    as long as it was stated in the manifest, but from version 23 and later, the requirements
    have been sharpened so that the user must now actively grant permission in a simple
    dialog box (this is only the first time, where the user performs the program and
    see also chapter 11). The method askWritePermission() calls the method askPermission()
    with two parameters, the first one of the two constants defined at the start of
    the program while the other is the permission that the user may allow.


    In askPermission(), first the Android version is tested, and if it is less than
    23, nothing happens and the method returns true. Otherwise, the following method
    is used


