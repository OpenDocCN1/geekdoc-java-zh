    JAVA 17: MORE ABOUT JAVA AND ANDROID: SOFTWARE DEVELOPMENT


    # FOREWORD


    The current book is the seventeenth in this series of books on software development
    in Java, and it is a continuation of the previous book on mobile phone applications
    development.


    The book requires knowledge about Java and Android corresponding to what is dealt
    with in the book Java 16, and the goal is to introduce topics that were not available
    in this book. Among other things, the book will introduce how to use fragments
    that are important for developing larger applications and ensuring independence
    of the current device. Other important topics are to introduce how to use the
    facilities (such as GPS and Camera) as a telephone relative to a conventional
    PC makes available. Finally, the book will expand the substance regarding services
    and present solutions to some of the shortcomings mentioned at the end of the
    previous book. The goal is to make the reader after the previous book and this
    book able to practice developing Android applications in Java.


    As the title says this series of books deals with software development, and the
    goal is to teach the reader how to develop applications in Java. It can be learned
    by reading the subject and by studying complete programs, but most importantly
    by doing it yourself and writing your own programs from scratch. Therefore, an
    important part of the books is exercises and problems, where the reader has to
    write programs that correspond to the skeleton and which will consist of text
    and examples and exercises and problems that are placed in the text where they
    naturally belong. The difference between exercises and problems is that the exercises
    largely deal with repetitions of the substance that is presented in the text,
    and furthermore it is relatively accurately described what to do. Problems are
    in turn loosely described, and are a little bigger and there is rarely any clear
    best solution. These books are to be read from start to finish, and many code
    examples, including exercises and problems play a central role, and it is important
    that the reader predicts in detail studying the code of the many examples and
    also solves the exercises and possibly just studying the recommended solutions.


    All books end with one or two larger sample programs, which focus primarily on
    the process and an explanation of how the program is written. On the other hand,
    the code only to a limited extent – if at all – and the reader should study the
    finished program code perhaps while testing the program. In addition to show the
    development of programs that are larger than the examples, which otherwise is
    presented, the aim of the concluding examples is also to show program examples
    from varying fields of application.


    Most books also end with an appendix dealing with a subject that would not be
    treated in the books. It may be issues on the installation of software or other
    topics in technology, which are not software development, but where it is necessary
    to have an introductory knowledge. If the reader is already familiar with the
    subject, the current appendix can be skipped.


    The programming language is, as mentioned Java, and besides the books use the
    following products:


    1. NetBeans as IDE for application development

    2. MySQL to the extent there is a need for a database server (from the book Java
    6 onward)

    3. GlassFish as a web server and application server (from the book Java 11 onward)

    4. Android Studio, that is a tool for the development of apps to mobile phones


    These are products that are free of charge and free to install, and there is even
    talk about products where the installation is progressing by itself and without
    major efforts and challenges. In addition, there are well-detailed installation
    instructions for all the three products. The products are available on Windows
    and Linux, and therefore play no special role if you use Linux or Windows.


    All sample programs are developed and tested on machines running Linux. In fact,
    it plays no major role, as both Java and other products work in exactly the same
    whether the platform is one or the other. Some places will be in the books where
    you could see that the platform is Linux, and this applies primarily to commands
    concerning the file system. Otherwise it has no meaning to the reader that programs
    are developed on a Linux machine, and they can immediately run under Windows unless
    a program refers to the file system where it may be necessary to change the name
    of a file.


    Finally a little about what the books are not. It is not "how to write" or for
    that matter reference manuals in Java, but they are title books on software development.
    It is my hope that the reader, when reading the books and through the many examples,
    can find inspiration for how to write.


    # INTRODUCTION


    In the previous book, I have dealt with how to write applications for an Android
    device and primarily a mobile phone. Like so else, it is a big area and compared
    to what has been said in the previous book, there is a lot left, and the goal
    of the following is to mention what is missing.


    A mobile phone (or Android devices such as a tablet) is a computer and is programmed
    in the same principle as any other, but there are two important differences:


    1. It is a very small computer, both physically and in capacity.

    2. The device has other features than a traditional PC.


    Slightly simplified, you can say that the previous book deals with what is special
    because of the first of the above differences, while this book deals with the
    last difference. For any computer program with user interaction, the two key issues
    are:


    - How to program the application''s user interface and for a mobile phone it is
    to program activities and navigate between activities.

    - How to persist data, and for a mobile phone, it is done using a SQLite database
    that provides many of the same facilities as known from traditional database systems.

