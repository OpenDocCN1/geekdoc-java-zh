    JAVA 17：关于 Java 和安卓的更多：软件开发


    # 12 最后一个示例：WineApp（葡萄酒管理应用）


    Java 6 这本书的最后一个示例是一个用于管理私人酒窖的程序。该程序从功能和实现上来看非常出色，但对于实际使用来说，存在一个大问题，即它是一个 PC 程序，这意味着你必须坐在电脑前才能访问（购买）葡萄酒，相应地，每当你使用一瓶酒（尤其是最后一瓶时，都要运行程序。如果你把它推迟到你在电脑前时再做，你就无法完成。因此，考虑一个像手机
    App 这样的解决方案是理所当然的，这意味着程序“随身携带”。这样，使用该程序的几将会大大增加，以下是关于如何将 WineApp 程序实现为手机 App。因此，你可以将此任务视为将程序从一个平台迁移到另一个平台。


    该程序在逻辑和工作上与之前的版本基本相同，但程序必须使用 SQLite 代替 MySQL。此外，还应该考虑是否有功能需要更改，最后是考虑如何简化应用程序的使用。此外，你应该使用手机摄像头，这样你就可以保存酒瓶的照片。


    将应用程序迁移到手机的挑战之一就是屏幕太小。应用程序的用户界面必须分别为手机和平板电脑进行定制，但由于手机没有适当的用户界面（由于虚拟键盘的原因），已决定程序不支持横屏模式。


    # 12.1 开发计划


    应用程序的开发计划包括以下迭代，其中每次迭代的结果都是上一次迭代结果的扩展。


    | 任务 | 天数 |

    | :--- | :---: |

    | MainActivity。启动活动中应该包含什么，特别是如何在应用程序功能之间进行导航。 | 2 |

    | 程序架构、设计以及数据库的实现。 | 2 |

    | 葡萄酒属性维护：生产者。 | 1 |

    | 葡萄酒属性维护：供应商。 | 1 |

    | 葡萄酒属性维护：国家。 | 1 |

    | 葡萄酒属性维护：地区。 | 1 |

    | 葡萄酒属性维护：分类。 | 1 |

    | 葡萄酒属性维护：葡萄品种。 | 1 |

    | 葡萄酒属性维护：葡萄酒类型。 | 1 |

    | 葡萄酒属性维护：类别。 | 1 |

    | 葡萄酒属性维护：瓶 / 包装。 | 1 |

    | 创建葡萄酒。也包括拍照。 | 4 |

    | 维护葡萄酒。也包括照片的维护。 | 3 |

    | 购买葡萄酒。 | 3 |

    | 消费葡萄酒。 | 3 |

    | 搜索葡萄酒。 | 4 |

    | 关注准备好饮用的葡萄酒。 | 3 |

    | 重构与测试。 | 4 |

    | 部署 | 2 |


    右列的数字表示迭代的复杂度。它们没有给出具体的估值，但反映了复杂程度以及在哪里会遇到特殊挑战。假设 1 = 一个工作日，这意味着预计工作量约为 20 个工作日。经验表明某些任务比预计的要长，因此建议将估计时间延长
    25%，如果是这样，我估计时间大约为 25 个工作日，如果程序由一个开发者编写，大约需要 1 个月。


    最后，开发过程中可能会出现新功能，如果是这样，显然需要扩展估值。


    查看上述估值，它们并不精确，可以预计某些预估任务可能会比预计更长，但可能另一些任务花费的时间少于预估时间，其他情况是因为由于几次迭代是相似的，因此在某种程度上它们是相互重复的。如果事实证明你节省了时间并提前完成，在原则上是好的，但你应该在项目早期谨慎调整预期的耗时，因为有高风险其他迭代可能被低估，而如果其他迭代产生了时间储备，那是好事，因为你以后在流程中可能需要这些时间。


    时间估计是软件开发中最困难的预测之一，软件开发者往往倾向于低估（或出于政治/业务原因故意这样做）。方法是将任务分解为许多许多小的子任务，每个子任务都很小，且复杂度使你能够评估任务所需的时间。即使你得到了时间，时机也具有巨大的不确定性，因为实践表明，总有一些任务因为某些原因比预计的要长。原因有很多，从简单到……由于在项目期间的……（包括微小任务）。


