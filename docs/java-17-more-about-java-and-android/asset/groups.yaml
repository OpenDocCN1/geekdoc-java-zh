    \        setContentView(R.layout.activity_main);\n        editText = findViewById(R.id.txtEdit);\n\
    \        textView = findViewById(R.id.txtView);\n\n        findViewById(R.id.cmdSave).setOnClickListener(new\
    \ OnClickListener() {\n            @Override\n            public void onClick(View\
    \ v) {\n                askWritePermission();\n            }\n        });\n\n\
    \        findViewById(R.id.cmdRead).setOnClickListener(new OnClickListener() {\n\
    \            @Override\n            public void onClick(View v) {\n          \
    \      askReadPermission();\n            }\n        });\n\n        findViewById(R.id.cmdShow).setOnClickListener(new\
    \ OnClickListener() {\n            @Override\n            public void onClick(View\
    \ v) {\n                showStorage();\n            }\n        });\n    }\n\n\
    \    private void askWritePermission() {\n      if (askPermission(REQUEST_WRITE_PERMISSION,\
    \ Manifest.permission.WRITE_STORAGE)) writeFile();\n    }\n\n    private void\
    \ askReadPermission() {\n      if (askPermission(REQUEST_READ_PERMISSION, Manifest.permission.READ_STORAGE))\
    \ readFile();\n    }\n\n    private boolean askPermission(int requestId, String\
    \ permission) {\n      if (android.Build.VERSION.SDK_INT >= 23) {\n        if\
    \ (ActivityCompat.checkSelfPermission(this, permission) != PackageManager.PERMISSION_GRANTED)\n\
    \          requestPermissions(new String[] { permission }, requestId);\n     \
    \   return false;\n      }\n      return true;\n    }\n\n    @Override\n    public\
    \ void onRequestPermissionsResult(int requestCode, String[] permissions, int[]\
