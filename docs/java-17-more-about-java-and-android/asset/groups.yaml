    # JAVA 17: ABOUT JAVA AND

    ANDROID: SOFTWARE DEVELOPMENT


    Today, as mentioned, there are many screen sizes that vary in terms of physical
    size and resolution. Similarly, Android uses a measurement unit called density
    independent pixel and is dp, and it is the unit of measurement that I have used
    throughout the previous book. 1 dp is defined as the physical size of 1 pixel
    on a 160 dpi device and is therefore independent of the screen''s physical pixel
    size. For example, if you consider a 7 inch screen on a 160 dpi device, there
    are 1120 pixels along the diagonal. The screen format 16 x 9 it gives with a slightly
    rounding of a resolution of 1000 x 600 dp.


    Android defines screen sizes using resource screen size qualifiers, and here are
    three options that are defined using a resource directory:


    +   Smallest width screen size qualifier. It corresponds to the number of dp for
    the screen''s newest point independent of the device orientation. The name of
    a resource directory is sw, followed by the desired screen size. For an example
    a layout resource directory for devices with a smallest width of at least 600
    dp is called layout-sw-600dp.

    Available width screen size qualifier. It corresponds to the number of dp measured
    to left for the device''s current orientation. If you change the device orientation
    you also change the available width. The name of a resource directory is w, followed
    by the width. For an example, a layout resource directory for devices with available
    width of at least 600 dp is called layout-w-600dp.

    Available height screen size qualifier. It corresponds to and behaves identically
    to the available width screen size qualifier, except that h is used instead of
    w and measured dp from top to bottom for the device''s current orientation. A
    layout resource directory for devices with an available height for at least 600
    dp is called layout-h-600dp.


    Instead of specifying resource directories using resource screen size qualifiers,
    you use an older way of splitting devices into groups: small, normal, large, or
    xlarge, and a resource directory name may, for example, layout-large.


    In the present case, I have added a resource directory values-large in the same
    way as above to select


    New | Android resource directory


    In the following window I have selected values for Resource Type and selected
    Size, and when I click on the >> button I will select large. When you click OK
    then Android Studio creates the appropriate resource directory.'
