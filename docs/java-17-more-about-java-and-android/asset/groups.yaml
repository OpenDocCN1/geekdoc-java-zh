    \ In fact, it is only necessary to change the class HighscoreList.\n\n![](img/dfa4439d1c62650bb2a6b471e62c51e8_97_0.png)\n\
    \n## JAVA 17: MORE ABOUT JAVA AND ANDROID: SOFTWARE DEVELOPMENT\n\n## 7 EXTERNAL\
    \ STORAGE\n\nIn the previous book on files, I only showed examples of using internal\
    \ storage, which is storage associated with the single application. In this chapter,\
    \ I will show an example that shows how to use external storage, which is storage\
    \ that may contain data that can be used by multiple applications.\n\nThere are\
    \ actually two types of external storage:\n\n- 1. Primary External Storage, which\
    \ physically is part of the phone and whose size is determined by the phone's\
    \ producer.\n2. Secondary External Storage, which is typically a SD card, but\
    \ may also be a device connected to the phone with a cable.\n\nThe following example\
    \ relates only to the first type of external storage, as it is the most effective\
    \ form of external storage, and since the device does not necessarily have a SD\
    \ card. From Android version 6, it is quite simple to use external storage on\
    \ a SD card, but the supplier may not have opened up the possibility. The reason\
    \ is lacking security, and Android actually recommends not using a SD card as\
    \ external storage.\n\nWhen I in the following refer to external storage, it means\
    \ primary external storage, or otherwise, the use of external storage is in principle\
    \ similar to that shown for internal storage in the previous book. The project\
    \ TheStorage opens a window\n\n![](img/dfa4439d1c62650bb2a6b471e62c51e8_98_0.png)\n\
    \n## JAVA 17: MORE JAVA AND ANDROID: SOFTWARE DEVELOPMENT\n\nwhere at the top\
    \ there is a EditText component for entering a text. Below is a TextView component\
    \ to display a text and finally there are three buttons in which the first button\
    \ is to save the input text into a file system, while the next is used to load\
    \ the content of the file and show it in the TextView component. Finally, the\
    \ last button is to display information about the file system.\n\nFirst step is\
    \ to modify the manifest, where you have to give the right to use external storage:\n\
    \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
    http://schemas.android.com/apk/res/android\"\n    package=\"dk.data.torus.preferences\"\
    >\n  <application\n    android:allowBackup=\"true\"\n    android:icon=\"@mipmap/ic_launcher\"\
    \n    android:label=\"@string/app_name\"\n    android:roundIcon=\"@mipmap/ic_launcher_round\"\
    \n    android:supportsRtl=\"true\"\n    android:theme=\"@style/AppTheme\">\n \
    \   <activity android:name=\".MainActivity\">\n      <intent-filter>\n       \
    \ <action android:name=\"android.intent.action.MAIN\" />\n        <category android:name=\"\
    android.intent.category.LAUNCHER\" />\n      </intent-filter>\n    </activity>\n\
    \  </application>\n</manifest>\n```\n\nThere are two uses-permission elements\
    \ listed. Here, WRITE_STORAGE automatically provides READ_STORAGE permission,\
    \ so the last is only necessary if you just want to read. Regarding the layout,\
    \ we will not display the XML but the Java code follows:\n\n```java\npublic class\
    \ MainActivity extends AppCompatActivity {\n    private static final int REQUEST_READ_PERMISSION\
    \ = 100;\n    private static final int REQUEST_WRITE_PERMISSION = 101;\n    private\
