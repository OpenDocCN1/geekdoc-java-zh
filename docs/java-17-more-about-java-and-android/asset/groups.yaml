    \ {\n      if (askPermission(REQUEST_WRITE_PERMISSION, Manifest.permission.WRITE_STORAGE))\
    \ writeFile();\n    }\n\n    private void askReadPermission() {\n      if (askPermission(REQUEST_READ_PERMISSION,\
    \ Manifest.permission.READ_STORAGE)) readFile();\n    }\n\n    private boolean\
    \ askPermission(int requestId, String permission) {\n      if (android.Build.VERSION.SDK_INT\
