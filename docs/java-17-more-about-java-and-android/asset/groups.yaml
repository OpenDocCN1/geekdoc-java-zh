    \n## JAVA 17：更多关于 JAVA 和 Android：软件开发\n\n## 7 外部存储\n\n在之前关于文件的书中，我只展示了使用内部存储的示例，这是与单个应用程序相关的存储。在本章中，我将展示一个示例，说明如何使用外部存储，外部存储可能包含可以被多个应用程序使用的数据。\n\
    \n实际上有两种类型的外部存储：\n\n- 1. 主外部存储，物理上是手机的一部分，其大小由手机制造商决定。\n- 2. 次级外部存储，通常是 SD 卡，但也可能是通过线连接到手机的设备。\n\
    \n以下示例仅涉及第一种外部存储，因为它是最有效的外部存储形式，而且设备并不一定有 SD 卡。从 Android 版本 6 开始，使用 SD 卡上的外部存储非常简单，但供应商可能没有开启这种可能性。由于是缺乏安全性，Android\
    \ 实际上建议不要将 SD 卡作为外部存储。\n\n当我在后续内容提到外部存储时，指的是主外部存储；否则，外部存储的使用在原则上与上一书中所示的内部存储使用方式相似。`TheStorage`\
    \ 项目打开了一个窗口\n\n![](img/dfa4439d1c62650bb2a6b471e62c51e8_98_0.png)\n\n## JAVA 17：更多\
    \ JAVA 和 Android：软件开发\n\n在顶部有一个用于输入文本的 `EditText` 组件。下方是一个用于显示文本的 `TextView` 组件，最后有三个按钮，其中第一个按钮用于将输入文本保存到系统中，下一个用于加载文件内容并显示在\
    \ `TextView` 组件中。最后，最后一个按钮用于显示关于文件系统的信息。\n\n第一步是修改 manifest，在其中你赋予使用外部存储的权限：\n\
    \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
    http://schemas.android.com/apk/res/android\"\n    package=\"dk.data.torus.preferences\"\
    >\n  <application\n    android:allowBackup=\"true\"\n    android:icon=\"@mipmap/ic_launcher\"\
