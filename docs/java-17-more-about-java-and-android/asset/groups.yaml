  mdcn: "\n\n## JAVA 17：更多关于 Java 和安卓：软件开发\n\n应用程序的用户界面仅包含一个可以开始下载文件的按钮。文件下载是使用 `DownloadManager`\
    \ 类完成的，该类提供了所需的功能。我不想在这里显示 `MainActivity` 的代码，但鼓励你查看一下代码。在这种情况下，要下载的文件是硬编码的，当然这不一定如此。\n\
    \n![](img/dfa4439d1c62650bb2a6b471e62c51e8_114_0.png)\n\n## 关于服务（Services）\n\n\
    在前本书中我介绍过 Service，但还有更多需要补充，特别是 Activity 如何与 Service 通通信。这是本章的主题。\n\n如果组件通过调用\
    \ `startActivity()` 启动 Service，该 Service 将一直运行，直到它调用 `stopSelf()` 停止，或者另一个组件调用\
    \ `stopService()` 停止。如果组件通过调用 `bindService()` 启动 Service，只要有组件绑定到它，Service 就会运行；只有当\
    \ Service 不再被绑定时，Android 才会将其关闭。然而，如果系统内存不足且需要为用户正在操作的 Activity 获取资源，Service 也可以被停止。\n\
    \n如果通过 `startActivity()` 启动 Service，则启动的 Activity 与 Service 之间没有直接通信。Service 执行其工作，无法向它发送消息（停止它除外），且\
    \ Service 无法调用启动 Activity 的方法，你只能通过 Toast 或通知的形式获取它的消息。如果有直接通信的需求，则需要放置一个名为接收器（receiver）的中介。如果\
    \ Service 能够接收来自 Activity 的消息，则 Service 必须实例化接收器对象（这是一个 `BroadcastReceiver` 对象），并将该对象注册为想要接收特定\
    \ ID 消息的接收者。想要接收 Service 消息的 Activity 也是如此，它也必须创建并注册接收器对象。\n\n应用程序的 Services 打开了以下窗口：\n\
    \n![](img/dfa4439d1c62650bb2a6b471e62c51e8_115_0.png)\n\n## JAVA 17：关于 Java 和安卓：软件开发——更多关于服务\n\
    \n如果你点击 START 按钮，会启动一个 Service，每秒发送一条消息，计数器加 1，这意味着 Activity 每秒都会收到来自 Service\
    \ 的消息。点击 STOP 按钮会停止 Service。最后，最后一个按钮用于向 Service 发送消息，即输入字段中输入的文本，之后 Service 将该文本转换为大写字母并回传给\
    \ Activity。这意味着 Activity 也也必须实例化一个接收器对象，以便接收来自 Service 的消息。当 Service 将收到的消息转换为大写时，仅仅是为了显示\
    \ Service 已执行了某些操作。以下是点击 START 按钮、输入文本并点击 SEND 按钮后的应用程序窗口：\n\n![](img/dfa4439d1c62650bb2a6b471e62c51e8_116_0.png)\n\
    \n在布局方面，没有新内容，只是关于在窗口中放置 6 个组件。该 Service 被命名为 *TheService*，代码如下：\n\n```java\n\
    package dk.data.torus.theservice;\n\nimport android.app.Service;\nimport android.content.*;\n\
    import android.os.IBinder;\nimport android.widget.Toast;\n```\n\n```java\npublic\
    \ class TheService extends Service {\n    public final static String KEY_COUNTER_CLIENT\
    \ = \"KEY_COUNTER_CLIENT\";\n    public final static String KEY_RECEIVE_CLIENT\
    \ = \"KEY_RECEIVE_CLIENT\";\n    public final static String GET_COUNTER_CLIENT\
    \ = \"GET_COUNTER_CLIENT\";\n    public final static String GET_MESSAGE_CLIENT\
    \ = \"GET_MESSAGE_CLIENT\";\n    public final static String GET_MESSAGE_SERVICE\
    \ = \"KEY_MESSAGE_SERVICE\";\n    private TheReceiver getReceiver();\n    private\
    \ TheThread getThread();\n    private int counter = 0;\n```\n\n```java\n@Override\n\
    public IBinder onBind(Intent intent) {\n    return null;\n}\n```\n\n```java\n\
    @Override\npublic void onCreate(getApplicationContext()) {\n    Toast.makeText(getApplicationContext(),\"\
    Service created\",\n    Toast.LENGTH_LONG).show();\n    theReceiver = new TheReceiver();\n\
    \    super.onCreate();\n}\n```\n\n```java\n@Override\npublic int onStartCommand(Intent\
    \ intent, int flags, int startId) {\n    Toast.makeText(getApplicationContext(),\
    \ \"Service started\",\n    Toast.LENGTH_LONG).show();\n    IntentFilter intentFilter\
    \ = new IntentFilter();\n    intentFilter.addAction(GET_MESSAGE_SERVICE);\n  \
    \  registerReceiver(theReceiver, intentFilter);\n    theThread = new TheThread();\n\
    \    theThread.start();\n    return super.onStartCommand(intent, flags, startId);\n\
    }\n```\n\n```java\n@Override\npublic void onDestroy() {\n    Toast.makeText(getApplicationContext(),\"\
    Service destroyed\",\n    Toast.LENGTH_LONG).show();\n    theThread.terminate();\n\
    \    unregisterReceiver(theReceiver);\n    super.onDestroy();\n}\n```\n\n```java\n\
    public class TheReceiver extends BroadcastReceiver {\n    @Override\n    public\
    \ void onReceive(Context context, Intent intent) {\n        String action = intent.getAction();\n\
    \        if(action.equals(GET_MESSAGE_SERVICE)) {\n            String msg = intent.getString(KEY_MESSAGE_SERVICE);\n\
    \            Intent tosend = new Intent();\n            tosend.setAction(GET_MESSAGE_CLIENT);\n\
    \            tosend.putExtra(KEY_RECEIVE_CLIENT, msg.toUpperCase());\n       \
    \     sendBroadcast(tosend);\n        }\n    }\n}\n```\n\n```java\nprivate class\
    \ TheThread extends Thread {\n    private boolean running;\n    public void terminate()\
    \ {\n        running = false;\n    }\n    @Override\n    public void run() {\n\
    \        while(running) {\n            try {\n                Thread.sleep(1000);\n\
    \                Intent intent = new Intent();\n                intent.setAction(GET_COUNTER_CLIENT);\n\
    \                intent.putExtra(KEY_COUNTER_CLIENT, counter);\n             \
    \   sendBroadcast(intent);\n                counter++;\n            } catch (InterruptedException\
    \ e) {\n            }\n        }\n    }\n}\n```\n\n"
