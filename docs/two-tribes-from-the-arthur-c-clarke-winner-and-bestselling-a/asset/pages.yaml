  md: '# THIRTY-THREE


    The woman in the Mao suit climbs back into her eight-wheeled car and, having settled
    into her seat, she turns to the window to wave goodbye.

    Then her driver releases the brake and the vehicle begins to move off towards
    London, soundless but for the soft crunch of its tyres.


    The people around us look at each other but remain oddly silent, glancing uneasily
    at Cally and me. There are things they''d saying to each other, I realize, if
    there weren''t two strangers present whose role they''re unsure of, but whose
    allegiances are almost certainly different to their own.


    ''Chinky!'' the little boy calls out after the car in his loud cheerful voice.
    Which seems a little ironic, given that his own features are quite definitely
    more Chinese than those of the woman in the back seat. But of course these days
    the word is not so much a racial epithet as a general-purpose term for members
    of the regime that our Chinese helped to put in place.


    The little boy''s grandfather reproaches him, sharply, and a little theatrically,
    with an uneasy glance in our direction: not so much telling off the child, as
    performing the act of telling him off for our benefit. ''That''s a bad word, Arnie.
    Your mother will be very angry with you.''


    I shrug and smile to show that I''m not in the least troubled, and thanking them
    for their time, Cally and I pass back out through the gate and on to the road
    along the riverbank.'
