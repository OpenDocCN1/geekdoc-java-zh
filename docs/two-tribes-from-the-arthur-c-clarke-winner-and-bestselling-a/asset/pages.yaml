  md: 'We continue our walk along the edge of the camp. Parrots screech above our
    head. Boats pass by on the water. As we brush away the flies from our sweaty faces,
    Cally talks about the final stage of the battle, when the Liberal besiegers suddenly
    found themselves hemmed in by new Patriot fighters, and realized they were very
    close to defeat.


    It was at this point that they struck the historic bargain under which Chinese
    forces would invade, establish a Protectorate, and then help them put in place
    the self-perpetuating Guiding Body of qualified, able and scientifically minded
    people the Liberals now regarded as the correct way to govern a country. You can
    see how the Chinese found the idea congenial. The Guiding Body as an idea was
    really quite similar to what China''s ruling Party had become, and it fitted well
    with Confucian notions of order and hierarchy that had been reintroduced in Shuang
    Hu''s Great Synthesis.


    After striking the agreement, the Liberal leadership withdrew all their forces
    from the area. Imagining that they''d won, the Patriots celebrated in their towers,
    hanging out St George''s flags and their Three Lion emblem, until Chinese jets
    came from the east, wave after wave of them, to pound the towers and their garrison
    into the expanse of rumble that formed the base of the huge refugee camp beside
    us.


    > “I suppose China was always going to back to the Liberals in the end,’’ I say.


    Cally''s not so sure. ‘They did talk with the Patriots as well, you know. I wonder
    what would have been like now if they''d taken the Patriot side?’


    I’m to answer when two armed militiamen stride out from the waren of the camp,
    suddenly and unexpectedly that we both gasp. Their goggles eyes linger on us for
    a moment. They can see your heartbeat if they want to. They can see where you''ve
    been over the past month, or year, or decade. They can call up a list of all the
    people you know. And they don''t just see; they record as well. They''re part
    of a unified system that, whenever you come to its attention, notes down where
    you you''re with, and all the various metrics that indicate your current emotional
    state,'
