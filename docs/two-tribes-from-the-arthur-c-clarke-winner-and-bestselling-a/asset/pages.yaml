  md: '# TWO


    T he day after my return to London, I walk, as usual, the three miles from my
    watery home to the offices of the Cultural Institute where I am a historian and
    archivist. In my small, stuffy cubicle with its yellow cardboard walls, boxes
    of old notebooks are stacked on the floor and the desk. They are a collection
    of old diaries from the early twenty-first century, assembled many years ago by
    another historian for a project he never completed. The entire collection was
    recently sold to the Institute by one of the historian''s grandchildren, and I
    have the task of going through them and recording the dates they cover, the circumstances
    of the writer, a summary of their contents and an assessment of their authenticity.
    (It seems the historian paid quite generously for these old notebooks at a time
    when many people were struggling to find enough to eat, and there are a number
    of obvious figuring among them)


