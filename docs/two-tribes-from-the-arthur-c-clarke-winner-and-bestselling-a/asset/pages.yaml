  md: '‘Please, Michelle!’ He put his arm in the door and followed her into the lift.
    The brilliant city shone all round them as they descended.


    ‘This isn’t going to work, Harry,’ she said as they passed the concierge’s station.
    ‘We need to end it now. You’re a nice man, but like you said yourself, we haven’t
    got time to keep trying if we can see it’s not really going to happen.’


    ‘Michelle, I love you! I want to marry you! I want to have babies with you!’


    ‘You like the idea of it, Harry, but you know I won’t fit into your world.’


    ‘Fuck my world!’ he told her. ‘Fuck them all. I don’t even like fucking like Richard
    and Karina and their ghastly stuck-up daughter! I don’t even like my own tribe.
    If you don’t want to live in London, that’s fine. I don’t want to live in fucking
    London. I’ll come and live in Breckham instead!’


    They were outside the building now at the top of a short flight of marble steps.
    The city hummed all around them. An emergency vehicle rushed along the north side
    of the river, its siren sounding, its light casting brilliant splashes of blue
    across the water, so that solitary seagull flying just above the surface turned
    from shadowy silhouette to neon blue, and back to shadow again.


    Michelle smiled and shook her head. ‘Oh come on, Harry. You wouldn’t last a week
    in Breckham. I saw how you were at my mum’s. You looked like you were being very
    good and brave and grown-up while someone pulled your teeth out one by one. It’s
    like you’ve always said: we come from two different tribes.’


    *


    Michelle started down the steps. She wanted to be alone so she could find somewhere
    dark and quiet to sit down and work out what to do next. She was full of tears,
    but she was determined not to let them out until there was no one there to see
    them.'
