  md: 'The room was beautifully laid out, thought Harry, looking about him with a
    professional eye. Modern design had been cleverly married with many of the original
    features of the three separate workmen''s cottages that this had once been: the
    black wooden beams, the uneven floor.


    There was a pleasing smell that mingled wood polish and old woodsmoke with the
    warm scented fat of a lamb dish cooking in the kitchen.


    *


    The two largest bedrooms, each with its own bathroom, had been allocated to the
    couples, but there were two smaller bedrooms, and Harry had been given one of
    these, at the back, which had a bathroom right next to it. (This all seemed quite
    opulent to Harry, given that this was Richard and Karina''s second home, but it
    wouldn''t have seemed luxurious to him as it does to us, for this was a time when
    almost English homes had at least one bathroom with hot and cold running water.)
    He unpacked his bag, laid the notebook he used as a diary on the bedside table
    and checked his hair in a mirror that hung over a chest of drawers. He had a pleasant,
    nicely proportioned face, open and friendly even in repose or sadness. Harry smiled
    at his reflection. Outside the bedroom window, the pleasantly rolling Suffolk
    fields glowed in the evening sun.


    Downstairs the others were talking about their teenage children tactfully when
    he came to join them. (Harry had learnt from his sister that the two couples had
    become friends because of their children: Ellie and Phil''s older son, Nathan,
    playing in the same room back as Richard and Karina''s son Greg.) Karina asked
    him about his work and where she lived. She was a very attentive host. Having
    put a question to him, she would compose herself into the optimal posture for
    conveying attention. Richard, on the other hand, rapped out his questions, one
    after another, absorbing the answers with a slight frown, as if continually puzzled
    by Harry''s reasoning.'
