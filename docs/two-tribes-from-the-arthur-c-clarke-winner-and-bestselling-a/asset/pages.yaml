  md: 'sibling, Ellie. Ellie and her husband were also going to be there, and it had
    been Ellie’s idea that Harry should join them. ‘You spend much too much moping
    around on your own, bro.’


    Crawling his way out of London, whose streets at that time of day were packed
    with several hundred thousand crawling lumps of metal (each one of them burning
    a litre or so of fuel ten minutes, and emitting the acid residue into the air),
    Harry had been resenting Ellie’s interference, her attempts to organize him and
    make him conform to her idea of what a person in his situation ought to be doing.
    Why on earth would he want to waste a whole weekend with her friends, he’d been
    thinking, when after all he had friends of his own? But now, he had to admit,
    he was looking forward to it.


    Karina and Ellie came out to meet Harry as he pulled up into the drive of the
    half-timbered cottage. Karina was tall and imposing, dark-haired and dark-eyed,
    and wearing white; Ellie was a short, lively woman in a pretty red dress, who
    observed her twin brother with her characteristic combination of affection, pride
    and exasperation. She’d worried about him a great deal during the months after
    Janet left, and he knew he found his passivity irritating. There were things a
    person could do to move on from a setback like that, and Harry seemed to stubbornly
    refuse to do any of them.


    Karina led them through the house. In the living room Richard, Karina’s husband,
    and Phil, Harry’s brother-in-law, stood up to greet him from one of three elegant
    grey sofas. While Karina was very good-looking in a dark way, Richard, with his
    untidy red hair, short legs and slight pot belly, could almost be described as
    ugly if it not for a smouldering energy which was apparent as soon as you met
    him. Phil, who’d been a friend of Harry’s even before he’d got together with Ellie,
    was a tall thin man, rather intense, with large hands and a pointed head that
    he kept completely shaved.'
