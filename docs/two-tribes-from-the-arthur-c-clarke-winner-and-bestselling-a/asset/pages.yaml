  md: 'so that the next time a pair of goggles looks in your direction, or someone
    in authority chooses to look up your name, that new information will have been
    added to your file. It was the Chinese authorities’ parting gift when they finally
    handed over to the Guiding Body.


    The militiamen head east along the river. In subdued silence, we walk another
    kilometre in the opposite direction until we reach the first building to the west
    that wasn''t destroyed by the Chinese onslaught. The paintbrush is fading and
    most of the faces are barely visible, but on its east-facing wall is the faint
    remnant of one of those old stencilled murals from the days of the Protectorate.
    Charles Darwin, Marie Curie and Isaac Newton can just be made looking out with
    wise serenity at the sprawling shanty town stretching away in front of them to
    the east and the south.


    ‘Support the work of our Guiding Body!’ they are saying. ‘Study and apply the
    Nine Principles!’


    ‘In answer to your question,’ I say, ‘it would have been absolutely awful if the
    Patriots won. They didn’t really care for the poor; they just cynically exploited
    their tribal instincts for their own ends. So there’d be a ruling class living
    in comfort in gated areas, with the poor left to fend for themselves and some
    sort of Chinese surveillance system watching over them to be sure of keeping them
    in their place. It is really too painful to contemplate.’


    Cally laughs at this, and then she stops and takes my hand. Her eyes search my
    face for a moment, and then suddenly pulls me against her and kisses me on the
    mouth.'
