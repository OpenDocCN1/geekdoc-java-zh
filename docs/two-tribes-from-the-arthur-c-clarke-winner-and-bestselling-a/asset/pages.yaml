  md: 'When the evening meal was ready, Richard sat at the end of the table, with
    Ellie and Phil on one side and Harry on the other. By the time Karina brought
    out the lamb dish – her being a food writer, it was of course exquisite – they
    were talking about ‘Brexit’. Britain was in those days a member of a supranational
    body called the European Union, while not a federal state, had acquired many of
    the characteristics of such a state – a currency, a parliament, a court, a legal
    system, a president, free movement within its borders and so on – and it was unpopular
    with a substantial section of the population for that and other reasons. Strange
    as it seems now, this was a time in which virtually the entire population of the
    country was entitled to choose the government. Very occasionally other specific
    matters were also put to the public in a kind of vote known as a referendum. Recently,
    and against the advice of almost all of the major British institutions that embodied
    authority and expertise, the country had voted in such a referendum to leave the
    European Union. British Exit.


    From our perspective, the European Union and the British state no longer exist,
    this all seems pretty trivial by comparison with what was to come, but it was
    a big thing, and the five of them on round table that were members of a class
    in shock. They’d been unhappy about political developments before, of course,
    but this was completely different. It felt personal somehow, as if they themselves
    were under attack. And so they grieved and raged, obsessively itemizing, over
    and over again, all the precious things that would be destroyed by this reckless
    vote, all the reasons why the vote should not have happened, all the ways in which
    it had been unfair.


    Phil and Richard, in particular, were very agitated. In fact, they were almost
    shouting. Everyone in the room had some version of the received pronunciation
    accent, ‘RP’, characteristic of the professional middle class at the time, which
    lacked the marked regional variations in the speech of less educated people. (It
    was the rough equivalent, I suppose, of the somewhat Sinified English pronunciation
    of our own more educated classes.) In the earlier conversation, before they got
    on to Brexit, all five of'
