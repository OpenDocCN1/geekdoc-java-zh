    But Michelle’s bloodstream was full of adrenaline and ethanol, and she had no
    intention of leaving it there. ‘We’ve got through worse, haven’t we?’ she persisted.


    ‘You mean, like the Blitz?’ Lucy said, glancing round the rest of the company
