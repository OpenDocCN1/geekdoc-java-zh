    EU for forty years and our economy is closely integrated with Europe’s. A large
    proportion of British manufacturers have factories all over the Continent, and
    they depend on frictionless borders to be able to shift components back and forth
    between one factory and another precisely when they’re needed. In tariff barriers
    and customs checks, and their costs will go up. And since they have to compete
    against the rest of the world, those additional costs will make it harder, and
    in many cases impossible, to stay ahead of the game. So they’ll have no choice
    to close down the parts of their operation that are now in the UK and move them
