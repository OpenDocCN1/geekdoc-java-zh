  md: '# ONE


    Herry Roberts describes a shallow valley, like an indentation in a quilt with
    green pastures and trees on either side. A pair of crows cross the sky ahead of
    him, three women outside a bus shelter to watch him pass.


    I managed to obtain a permit to visit the area. The shallow valley is still there,
    of in place of pasture there are sunflowers and maize growing out of bare earth.
    There are shacks by the roadside and on the low ridge to the south stands an automated
    watchtower built during the Chinese Protectorate and still in use, a steep cone
    of stained concrete the height of a ten-storey building rising out of the sunflowers
    to bring forth its strange flowers in the form of satellite dishes, cameras and
    remote-controlled cannons. Beside the road is an old sign, so rusty as to be almost
    completely unreadable apart from the initial letter W, and pierced by multiple
    bullet holes from the time of the Waring Factions.(Give guns to a bunch of barely
    trained young men and they want to play with them.) We what now call the Eastern
    Prefecture was then a stronghold of the Patriotic League.


    I feel the holes with my fingertips: Thomas testing the wounds of Christ. The
    past is so tenuous, so small and far away, that it always seems miraculous to
    me that pieces of it are still around. Driving through that soft quilted landscape
    two and a half centuries ago, Harry passed the very same sign that I saw and touched.
    ‘Welcome to Suffolk’, it read and he reached it at half past six. He doesn’t mention
    bullet holes. The Warring Factions were still in the future and, though thought'
