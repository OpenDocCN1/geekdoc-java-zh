  md: 'of the time he lived in as a troubled one, the idea that British politics might
    degenerate into civil war would have seemed to him far-fetched.


    I look back across the old county boundary into Essex and towards London and close
    my eyes to make the fields green again, with big green billowy trees, and crows
    high up in the cool blue sky. And I imagine his car approaching from the Essex
    side, billowing its invisible fumes. It was a fairly small red car, somewhat old
    and scratched, and though it had four seats, Harry Roberts was the only person
    inside it. He was forty-six years old. It was 26 August 2016, 250 years ago, before
    the Protectorate, before the Warring Factions and, I suppose, before the Catastrophe,
    though 2014, 2015 and 2016 each in turn been the hottest year yet recorded and
    far off in the Arctic regions, the ice was already breaking up.


    Something shifted when Harry crossed into Suffolk.


    The way he puts it in his diary is he''d been experiencing life as ‘hollow’, like
    the toy food that was made at the time for children to play with: hollow oranges
    and apples and hamburgers, moulded from plastic. And as he crossed the county
    boundary, he suddenly noticed the world had become nourishing once more: the trees,
    the fields, the winding road, the women chatting at the bus stop in the evening
    sun . . . It was sufficient again, he was savouring the feeling of being alive.


    Harry was an architect. Janet, his wife of many years, had left him eight months
    previously. They had no children, their only son Danny having died five years
    previously of meningitis at the age of two. Harry was driving himself, as people
    did then, in a metal car with an internal combustion engine that consumed a litre
    of refined oil every ten minutes, to the weekend retreat of a couple called Karina
    and Richard. Karina was what was called a ‘food writer’ – strange as it seems
    now, she made a living by describing the food in restaurants – and Richard ran
    his own ‘actuar consultancy’ in London, which was at that time a global centre
    for lending and borrowing money. They were friends of Harry’s twin sister and
    only'
