  md: '‘Apart from anything else,’ Karina said, ‘where we are going to find a decent
    plumber? Most of the British ones are either incompetent or crooks. And that’s
    assuming you can even get hold of one.’


    The group shared stories for a while about various impressive services they’d
    received from bright, courteous, hard-working migrants from Eastern Europe until
    Richard moved the conversation on again suggesting there may have been some Russian
    interference in the election: a relatively new theme, but that one was to become
    more prominent and better substantiated in the months ahead.


    Then they returned, as if to the chorus of some long and tragic folk song, to
    a vote that had happened at all. Why, why, why had a decision of such great importance
    entrusted to people who were simply not qualified to understand its complexities?


    They were still at the early stage, this little group, still reeling, still trying
    to construct a shared narrative about what had gone wrong. But they were also,
    though they were not aware of it, constructing a new story about themselves and
    their relationship to the world.


