  \ `split()` 方法分割字符串时，它是根据指定的标准进行分割的，但在分割后，它将其存储在字符串数组中，这会不必要的创建 n 个对象。\n*   当创建了不必要的\
  \ `String` 对象时，可能会导致堆内存相关的问题。\n*   因此，始终建议不要使用 `split()` 方法。\n\n# 示例\n```java\n\
