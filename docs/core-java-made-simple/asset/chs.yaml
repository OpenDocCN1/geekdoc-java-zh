  ```\n\n# 14.1.2 java.lang.String 类\n\n*   `java.lang.String` 不是一个数据类型，它是一个位于 `java.lang`\
  \ 包中的特殊类。\n*   `String` 是一个 `final` 类，它不能被扩展到其他类。\n\n\n\n\n\n*   `String` 对象在本质上是不可变的，无法对其进行任何更改。\n\
  *   每当你将任何字符串与另一个字符串拼接时，始终会创建一个新对象。\n*   `String` 使用特殊的内存位置，即 `String-Constant-Pool`（字符串常量池），为了实现\
  \ `String` 对象的重用。\n*   `String` 对象可以通过两种不同的方式创建：\n    1.  不使用 `new` 操作符\n    2.\
  \  使用 `new` 操作符\n\n# 不使用 new 操作符创建 String 对象\n\n*   当我们不使用 `new` 操作符创建 `String`\
  \ 对象时，它首先会检查该字符串字面量是否存在于 `string-constant-pool` 中。\n*   如果 `string-constant-pool`\
  \ 中不存在，它将在 `string-constant-pool` 内部创建一个新的字符串字面量，并指向对应的引用变量。\n*   如果该字符串字面量已经存在于\
  \ `string-constant-pool` 中，则不会创建新的字符串字面量，而是指向同一个对象。\n\n# 示例\n\n```java\npackage\
  \ com.jtc4;\n\npublic class Jtc124{\n    public static void main(String arg[]){\n\
  \        String s1=”jtc\";\n        String s2=”jtc\";\n        String s3=”jtc1\"\
  ;\n        String s4=”jtc1\";\n        System.out.println(s1==s2); //true\n    \
  \    System.out.println(s1==s3); //false\n        System.out.println(s3==s4); //true\n\
  \    }\n}\n```\n\n![](img/280.jpg)\n\n# 使用 new 操作符创建 String 对象\n\n*   当你使用 `new`\
  \ 操作符创建 `String` 对象时，它首先会检查 `SCP` 内部该字符串字面量是否存在于 `SCP` 中。\n*   如果 `SCP` 中不存在，它会在\
  \ `SCP` 中创建一个新的字面量，然后离开 `SCP` 并在 `SCP` 外部创建一个新的字面量并指向它。\n*   如果 `String` 字面量已存在于\
  \ `SCP`（`String-Constant-Pool`）中，则它不会在 `SCP` 内部创建任何新字面量；它会离开 `SCP` 并在 `Heap`（堆）内部创建一个\
  \ `String` 字面量并指向它；\n\n# 示例\n\n```java\npackage com.jtc5;\n\npublic class Jtc125{\n\
  \    public static void main(String arg[]){\n        String s1=new String(“jtc”);\n\
  \        String s2=new String(“jtc”);\n        String s3=new String(“jtcindia”);\n\
  \        String s4=new String(“india”);\n        String s5=s1+s4;\n        System.out.println(s1==s2);\n\
  \        System.out.println(s2==d3);\n        System.out.println(s3==s5);\n    }\n\
  }\n```\n\n```java\npackage com.Jtc6;\n\npublic class Jtc126{\n    public static\
  \ void main(String arg[]){\n        String s1=”jtc\";\n        String s2=”jtc\"\
  ;\n        String s3=”jtcnoida\";\n        String s4=new String(“jtc”);\n      \
  \  ![](img/281.jpg)\n        String s5=new String(“jtcnoida”);\n        System.out.println(s1==s2);\n\
  \        System.out.peintln(s1==s3);\n        System.out.println(s3==s5);\n    }\n\
  }\n```\n\n```java\npackage com.jtc7;\n\npublic class Jtc127{\n    public static\
