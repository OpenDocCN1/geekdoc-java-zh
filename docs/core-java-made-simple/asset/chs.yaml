  总共有 38 (= 6*6+1+1) 个可能的 `xxxValue()` 方法。\n\n# 15.2.3 parseXxx() 方法\n\n我们可以使用此方法将\
  \ `String` 转换为对应的原始类型。\n\n## 格式 1\n\n*   除 `Character` 类外的所有包装类都包含一个静态的 `parseXxx()`\
  \ 方法，将 `String` 转换为对应的原始类型。\n\n### 示例\n\n```java\nclass WrapperClassDemo{\n    public\
  \ static void main(String[] args){\n        int i=Integer.parseInt(“10”);\n    \
  \    boolean b=Boolean.parseBoolean(“som”);\n        double d=Double.parseDouble(“10.5”);\n\
  \        System.out.println(i);//10\n        System.out.println(b);//false\n   \
  \     System.out.println(d);//10.5\n    }\n}\n```\n\n### 格式 2\n\n整型包装类 (`Byte`,\
  \ `Short`, `Integer`, `Long`) 包含以下 `parseXxx()` 方法，用于将指定的进制格式的字符串转换为对应的原始类型。\n\n\
  ### public static primitive parseXxx(String s,int radix);\n\n进制（radix）的允许范围是：2 到\
  \ 36\n\n### 示例\n\n```java\nclass WrapperClassDemo{\n    public static void main(String[]\
  \ args){\n        int i=Integer.parseInt(“100”,2);\n        System.out.println(i);//4\n\
  \    }\n}\n```\n\n# 15.2.4 toString() 方法\n\n我们可以使用 `toString()` 方法将包装对象（或）原始类型转换为\
  \ `String`。\n\n## 格式 1\n\n`public String toString();`\n\n![](img/ent.jpg) 每一个包装类（包括\
  \ `Character` 类）都包含上述 `toString()` 方法，将包装对象转换为 `String`。\n\n![](img/ent.jpg) 它是\
  \ `Object` 类 `toString()` 方法的重写版本。\n\n![](img/ent.jpg) 每当我们尝试打印包装对象的引用时，内部只会执行这个\
  \ `toString()` 方法。\n\n### 示例\n\n```java\nclass WrapperClassDemo {\n    public static\
  \ void main(String[] args) {\n        Integer i=Integer.valueOf(“10”);\n       \
  \ System.out.println(i);//10\n        System.out.println(i.toString());//10\n  \
  \  }\n}\n```\n\n## 格式 2\n\n每一个包装类都包含一个静态的 `toString()` 方法，将原始类型转换为 `String`。\n\n\
  ### public static String toString(primitive p);\n\n### 示例\n\n```java\nclass WrapperClassDemo{\n\
  \    public static void main(String[] args){\n        String s1=Integer.toString(10);\n\
  \        String s2=Boolean.toString(true);\n        String s3=Character.toString(‘a’);\n\
  \        System.out.println(s1); //10\n        System.out.println(s2); //true\n\
  \        System.out.println(s3); //a\n    }\n}\n```\n\n## 格式 3\n\n`Integer` 和 `Long`\
  \ 类包含以下静态 `toString()` 方法，将原始类型转换为指定的进制格式的字符串。\n\n### public static String toString(primitive\
  \ p, int radix);\n\n### 示例\n\n```java\nclass WrapperClassDemo{\n    public static\
  \ void main(String[] args){\n        String s1=Integer.toString(7,2);\n        String\
  \ s2=Integer.toString(17,2);\n        System.out.println(s1);//111\n        System.out.println(s2);//10001\n\
  \    }\n}\n```\n\n## 格式 4\n\n`Integer` 和 `Long` 类包含以下 `toXxxString()` 方法。\n\n`public\
  \ static String toBinaryString(primitive p);`\n\n`public static String toOctalString(primitive\
  \ p);`\n\n`public static String toHexString(primitive p);`\n\n### 示例\n\n```java\n\
  class WrapperClassDemo {\n    public static void main(String[] args) {\n       \
  \ String s1=Integer.toBinaryString(7);\n        String s2=Integer.toOctalString(10);\n\
