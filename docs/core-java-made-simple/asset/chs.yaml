  # 反序列化 (De-Serialization)\n\n反序列化是对对象进行反序列化的过程，意味着从持久化存储中检索二进制格式序列化的对象并将其转换为实际的对象类型，这被称为反序列化，也称为膨胀或解包化。Java\
  \ 中的 `ObjectInputStream` 类包含了用于反序列化对象的方法。\n\n给定的程序展示了如何从序列化对象或文件中读取任何数据或内容。它接收文件名并将其转换为\
  \ Java 对象。如果在读取序列化文件期间发生任何异常，将在 catch 块中捕获。\n\n`ObjectInputStream` 扩展 `java.io.InputStream`\
  \ 并实现 `ObjectInput` 接口。它从输入流中反序列化对象、数组和其他值。因此，`ObjectInputStream` 的构造函数写如下：\n\n\
  ```\nObjectInputStream obj = new ObjectInputStream(new FileInputStream(f));\n```\n\
  \n上述代码创建了 `ObjectInputStream` 类的实例，用于反序列化由 `ObjectOutputStream` 类序列化的文件。上述代码使用 `FileInputStream`\
  \ 类实例创建实例，该实例持有必须被反序列化的指定文件对象，因为 `ObjectOutputStream()` 构造函数需要输入流。\n\n`readObject()`::\n\
  \n`readObject( )` 方法读取对象并恢复对象的状态。这是 `ObjectInputStream` 类中的方法，有助于遍历对象。\n\n# 示例\n\
  \n```java\nimport java.io.FileInputStream;\nimport java.io.ObjectInputStream;\n\n\
  public class Jtc209 {\n    public static void main(String[] args) {\n        try{\n\
  \            ObjectInputStream osi=new ObjectInputStream(new FileInputStream“abc.\
  \ txt”));\n            Object o=osi.readObject(); \n            System.out.println(o.getClass().getName());\
  \ \n            System.out.println(o);\n        }catch(Exception e){\n         \
  \   e.printStackTrace();\n        }\n    }\n}\n```\n\n# Transient 修饰符\n\n- `transient`\
  \ 是修饰符仅适用于变量，而不适用于方法和类。\n- 在序列化时，如果为了满足安全约束我们不想序列化某个变量的值，那么我们应该使用 `transient` 修饰符声明该变量。\n\
  - 在序列化时，JVM 会忽略 `transient` 变量的原始值并保存默认值，`transient` 意味着“不序列化”。\n- 静态变量不是对象状态的一部分，因此序列化概念不适用于静态变量，所以将静态变量声明为\
  \ `transient` 没有意义的。\n- `final` 变量将通过其值直接参与序列化，因此将 `final` 变量声明为 `transient` 没有影响。\n\
  \n# Static Vs Transient\n\n`static` 变量不是对象状态的一部分，因此它们不会参与序列化，所以将静态变量声明为 `transient`\
  \ 没有意义的。\n\n# Transient Vs Final\n\n`final` 变量将通过其值直接参与序列化。因此将 `final` 变量声明为 `transient`\
  \ 没有意义的。\n// 编译器将值赋值给 final 变量\n\n## 28.8 自定义序列化\n\n在默认序列化期间，可能会由于 `transient` 关键字导致信息丢失的情况。（例：money,\
  \ box）\n\n# 示例\n\n```java\nimport java.io.*;\n\nclass Account implements Serializable{\n\
  \    String userName=”Som”;\n    transient String pwd=”Prakash”;\n}\n\nclass CustomizedSerializeDemo{\n\
  \    public static void main(String[] args)throws Exception{\n        Account a1=new\
  \ Account();\n        System.out.println(a1.userName+”..... ”+a1.pwd);\n       \
  \ FileOutputStream fos=new FileOutputStream(“abc.ser”);\n        ObjectOutputStream\
  \ oos=new ObjectOutputStream(fos);\n        oos.writeObject(a1);\n        FileInputStream\
  \ fis=new FileInputStream(“abc.ser”);\n        ObjectInputStream ois=new ObjectInputStream(fis);\n\
  \        Account a2=(Account)ois.readObject();\n        System.out.println(a2.userName+”.....\
  \ ”+a2.pwd);\n    }\n}\n```\n\n在上述示例中，序列化之前的 Account 对象可以提供用户名和密码。但反序列化后 Account\
  \ 对象只能提供用户名。这是由于密码被声明为 `transient`。因此在进行默认序列化时可能会出现信息丢失。\n\n我们可以通过自定义序列化来恢复这种信息的丢失。\n\
  \n# 我们可以通过以下方法实现自定义序列化\n\n```java\nprivate void writeObject(ObjectOutputStream os)\
  \ throws Exception\n```\n\n该方法将在序列化期间由 JVM 自动执行。它是一个回调方法。因此在序列化期间，如果我们想执行任何额外工作，必须在该方法中定义。（准备加密密码并将加密后的密码单独写入文件）\n\
  \n```java\nprivate void readObject(ObjectInputStream is) throws Exception\n```\n\
  \n该方法将在反序列化期间由 JVM 自动执行。因此在反序列化期间，如果我们想执行任何额外活动，必须在该方法中定义。（读取加密密码，解密并将解密后的密码赋值给对象变量）\n\
  \n## 28.9 关于继承的序列化\n\n**情况 1**\n\n如果父类实现了 `Serializable`，那么每个子类默认都实现了 `Serializable`。这就是序列化特性从父类继承到子类。\n\
  \n因此，即使子类没有实现 `Serializable`，只要父类实现了 `Serializable` 接口，我们就可以序列化子类对象。\n\n# 示例\n\n\
  ```java\nimport java.io.*;\n\nclass Animal implements Serializable{\n    int i=10;\n\
  }\n\nclass Dog extends Animal{\n    int j=20;\n}\n\nclass SerializableWRTInheritance{\n\
  \    public static void main(String[] args)throws Exception{\n        Dog d1=new\
  \ Dog(); \n        System.out.println(d1.i+”..... ”+d1.j);\n        FileOutputStream\
  \ fos=new FileOutputStream(“abc.ser”);\n        ObjectOutputStream oos=new ObjectOutputStream(fos);\n\
  \        oos.writeObject(d1);\n        FileInputStream fis=new FileInputStream(“abc.ser”);\n\
  \        ObjectInputStream ois=new ObjectInputStream(fis);\n        Dog d2=(Dog)ois.readObject();\n\
  \        System.out.println(d2.i+”........................................... ”+d2.j);\n\
  \    }\n}\n```\n\n\n\n尽管 `Dog` 类没有显式实现 `Serializable` 接口，但我们可以序列化 `Dog` 对象，因为它的父类\
  \ `animal` 已经实现了 `Serializable` 接口。\n\n注意：`Object` 类没有实现 `Serializable` 接口。\n\n\
  # 案例 2\n\n- 即使父类没有实现 `Serializable`，如果子类实现了 `Serializable` 接口，我们也可以序列化子对象。\n- 在序列化时，`JVM`\
  \ 会忽略来自非 `Serializable` 父类的实例变量值，此时 `JVM` 不会保存原始值，而是为这些变量保存默认到文件中。\n- 在反序列化时，`JVM`\
  \ 会检查是否有任何父类未实现 `Serializable`。如果有任何父类未实现 `Serializable`，`JVM` 会为每个不可序列化的父类创建一个单独的对象，并将其实例变量共享给当前对象。\n\
  - 为了为不可序列化的父类创建对象，`JVM` 总是调用该非 `Serializable` 父类的无参构造函数（默认构造函数），因此每个非 `Serializable`\
  \ 父类都必须包含无参构造函数，否则我们将得到运行时异常“InvalidClassException”。\n- 如果不可序列化的父类是抽象类，则仅将执行实例控制流并将其实例变量共享给当前对象。\n\
  \n# Example\n\n```java\nimport java.io.*;\n\nclass Animal{\n    int i=10;\n    Animal(){\n\
  \        System.out.println(\"Animal constructor called\");\n    }\n}\n\nclass Dog\
  \ extends Animal implements Serializable{\n    int j=20;\n    Dog(){\n        System.out.println(\"\
  Dog constructor called\");\n    }\n}\n\nclass SerializableWRTInheritance{\n    public\
  \ static void main(String[] args)throws Exception{\n        Dog d1=new Dog();\n\
  \        d1.i=888;\n        d1.j=999;\n        FileOutputStream fos=new FileOutputStream(\"\
  abc.ser\");\n        ObjectOutputStream oos=new ObjectOutputStream(fos);\n     \
  \   oos.writeObject(d1);\n        System.out.println(\"Deserialization started\"\
  );\n        FileInputStream fis=new FileInputStream(\"abc.ser\");\n        ObjectInputStream\
  \ ois=new ObjectInputStream(fis);\n        Dog d2=(Dog)ois.readObject();\n     \
  \   System.out.println(d2.i+”+d2.j);\n    }\n}\n```\n\n## 28.10 外部化\n\n- 在默认序列化中，一切都由\
  \ `JVM` 处理，程序员没有任何控制权。\n- 在序列化中，整个对象总是被保存，无法保存对象的部分，这在某些点会产生性能问题。\n- 为了克服这些问题，我们应该采用外部化（externalization），其中一切都由程序员处理，`JVM`\
  \ 不具备任何控制权。\n- 外部化相对于序列化的主要优势是，我们可以根据需求保存整个对象或对象的一部分。\n- 要为任何对象提供 `Externalizable`\
  \ 能力，相应的类必须实现 `externalizable` 接口。\n- `Externalizable` 接口是 `serializable` 接口的子接口。\n\
  \n`Externalizable` 接口定义了 2 个方法：\n\n`writeExternal( )`\n`readExternal( )`\n\n## public\
  \ void writeExternal(ObjectOutput out) throws IOException\n\n该方法会在序列化时自动执行，在此方法内部，我们必须编写代码将所需的变量保存到文件中。\n\
  \n## public void readExternal(ObjectInput in) throws IOException ClassNotFoundException\n\
  \n- 该方法会在反序列化时自动执行，在此方法内部，我们必须编写代码从文件中读取所需的变量并将其赋值给当前对象。\n- 在反序列化时，`Jvm` 会通过执行该对象上的公共无参构造函数创建一个单独的新对象，`JVM`\
  \ 将调用 `readExternal()` 方法。\n- 每个 `Externalizable` 类都必须包含公共无参构造函数，否则我们将得到提示“InvaidClassException”的运行时异常。\n\
  \n# Example\n\n```java\nimport java.io.*;\n\nclass ExternalDemo implements Externalizable{\n\
  \    String s;\n    int i ;\n    int j ;\n    public ExternalDemo(){\n        System.out.println(\"\
  public no-arg constructor\");\n    }\n    public ExternalDemo(String s, int i, int\
  \ j){\n        this.s=s ;\n        this.i=i;\n        this.j=j;\n    }\n    public\
  \ void writeExternal(ObjectOutput out) throws IOException{\n        out.writeObject(s);\n\
  \        out.writeInt(i);\n    }\n    public void readExternal(ObjectInput in) throws\
  \ IOException, ClassNotFoundException{\n        s=(String)in.readObject();\n   \
  \     i= in.readInt();\n    }\n}\n\npublic class Externalizable1{\n    public static\
  \ void main(String[] args)throws Exception{\n        ExternalDemo t1=new ExternalDemo(\"\
  som”, 10, 20);\n        FileOutputStream fos=new FileOutputStream(\"abc.ser\");\n\
  \        ObjectOutputStream oos=new ObjectOutputStream(fos);\n        oos.writeObject(t1);\n\
  \        FileInputStream fis=new FileInputStream(\"abc.ser\");\n        ObjectInputStream\
  \ ois=new ObjectInputStream(fis);\n        ExternalDemo t2=(ExternalDemo)ois.readObject();\n\
  \        System.out.println(t2.s+”-------”+t2.i+”---- ”+t2.j);\n    }\n}\n```\n\n\
  在外部化中 `transient` 关键字不起任何作用，因此不需要 `transient` 关键字。\n\n## 28.11 序列化与外部化的区别\n\n##\
  \ 28.12 SerialVersionUID\n\n- 为了在内部执行序列化与反序列化，`JVM` 将使用一个唯一标识符，即 `serialVersionUID`。\n\
  - 在序列化时，`JVM` 会保存 `serialVersionUID`。\n- 在反序列化时，`JVM` 会检查 `serialVersionUID`，如果匹配则对象将反序列化，否则我们将得到提示“InvalidClassException”的运行时异常。\n\
  \n该过程依赖于默认的 `serialVersionUID`。在序列化对象后更改 `.class` 文件，我们将无法反序列化，因为本地类与序列化对象之间的 `serialVersionUID`\
  \ 不匹配，在这种情况下，反序列化时接收方将得到提示“InvalidClassException”的运行时异常。\n\n如果 `JVM` 版本之间存在不兼容，发送方和接收方应该使用相同版本的\
  \ `JVM`。\n\n我们可以通过配置自己的 `serialVersionUID` 来解决上述问题。我们可以如下配置 `serialVersionUID`：\n\
  \n`private static final serialVersionUID = 1L;`\n\n# Example\n\n```java\nclass Dog\
  \ implements Serializable {\n    private static final serialVersionUID = 1L;\n \
  \   int i=10;\n    int j=20;\n}\n\nclass Sender{\n    public static void main(String[]\
  \ args) throws Exception{\n        Dog d1=new Dog();\n        FileOutputStream fos=new\
  \ FileOutputStream(\"abc.ser\");\n        ObjectOutputStream oos=new ObjectOutputStream(fos);\n\
  \        oos.writeObject(d1);\n    }\n}\n\nclass Receiver{\n    public static void\
  \ main(String[] args) throws Exception{\n        FileInputStream fis=new FileInputStream(\"\
  abc.ser\");\n        ObjectInputStream ois=new ObjectInputStream(fis);\n       \
  \ Dog d2=(Dog)ois.readObject();\n        System.out.println(d2.i+”++d2.j);\n   \
  \ }\n}\n```\n\n\n\n当你重新读入每一行时，你需要对标记（tokens）进行拆分。每一行可能代表一个名称和地址，例如在邮件合并文件中。我们希望将该行拆分为各个单独的部分，例如名称、街道、城市、州和邮政编码。\n\
  \n实现这一点的方法是使用 `StringTokenizer` 类。尽管它不是 I/O 层次结构的一部分，但我们在这里介绍它，因为它在读取带分隔符流时非常有用。以下是该类的工作原理。\n\
  \n# 构建 `StringTokenizer` 对象\n\n你通过构造一个 `StringTokenizer` 对象，并给它提供你想要拆分的字符串以及分隔符（delimiters）。也就是说，你告诉它将使用哪些字符来拆分字符串中的标记。在我们构建了该类型的对象后，可以向它提几个问题：\n\
  \n*   这个字符串中有多少个标记？\n*   我是否用完了这个字符串中的所有标记？\n*   给我字符串中的下一个标记。\n\n`StringTokenizer`\
  \ 将拆分字符串并以 `String` 的形式向你返回直到下一个分隔符之前的字符。如果没有更多标记，它的方法将抛出 `NoSuchElementException`。由于该异常派自\
  \ `RuntimeException`，因此它没有在 `throws` 子句中声明，你不需要捕获它。\n\n还有一点：你可以为每个标记切换分隔符。换句话说，尽管你创建了一个寻找特定分隔符的\
  \ `StringTokenizer` 对象，你可以说：“对于下一个标记，更改分隔符。”\n\n# `StringTokenizer`：示例代码\n\n看下面的代码。注意我们的字符串中有一个竖线和一个问号。这些就是我们的分隔符。我们将创建一个新的\
  \ `StringTokenizer`，并向它传递字符串 `abc`（竖线）`def`（问号）`ghi`。我们将使用竖线和问号作为我们的分隔符。\n\n`StringTokenizer.hasMoreTokens()`\
  \ 在仍有更多标记时返回 true。如果是 true，我们将调用 `nextToken()`。这返回一个 `String`，并且在第一次运行 `while` 循环时，`s`\
  \ 的值将是 `abc`。第二次进入循环时，`hasMoreTokens()` 仍然为 true。现在当我们获取下一个标记时，`def` 是返回字符串的值。第三次进入循环时，`hasMoreTokens()`\
  \ 仍然为 true；返回 `ghi`。\n\n现在再循环一次，`hasMoreTokens()` 为 false。此时，我们退出了循环。所以我们没有费太大力气就拆分了字符串。\n\
  \n# 示例\n\n```java\nimport java.io.*;\nimport java.util.*;\n\npublic class StringTokenizerExample{\n\
  \    public static void main(String args[]){\n        String line = \"abc|def?ghi\"\
  ;\n        StringTokenizer st = new StringTokenizer(line, \"|?\");\n        while\
  \ (st.hasMoreTokens()){\n            String s = st.nextToken();\n            System.out.println(\"\
  Token is \" + s);\n        }\n    }\n}\n```\n\n# 29.1.2 `StreamTokenizer`\n\n你可以解析整个输入流。与解析\
  \ `String` 的 `StringTokenizer` 不同，`StreamTokenizer` 从 `Reader` 读取并将流拆分为标记。解析过程由语法表和标志位（flags）控制。\n\
  \n每个被解析的标记都被放置在一个类别中。这些类别包括标识符、数字、引号字符串和各种注释样式。执行的解析适用于将 Java、C 或 C++ 源文件拆分为它的标记。`StreamTokenizer`\
  \ 不在 I/O 层次结构中，但由于它是与流一起使用的，我们在这里介绍了它。\n\n`StreamTokenizer` 识别 `\\u0000` 到 `\\u00FF`\
  \ 范围内的字符。每个字符值可以有多多五种可能的属性。这些属性是空白字符、字母、数字、字符串引号和注释字符。\n\n*   空白字符用于分隔标记。\n*   字母字符是标识符的一部分。\n\
  *   数字字符可以是标识符或数字的一部分。\n*   字符串引号字符包围引号字符串。\n*   注释字符位于注释之前或包围注释。\n*   不具有任何这些属性的字符是普通字符。当遇到普通字符时，它被视为单个字符标记。\n\
  \n可以设置标志位来更改解析。行终止符既可以是标记，也可以是分隔标记的空白。C 风格和 C++ 风格的注释可以被识别并跳过。标识符被转换为小写或保持原样。\n\n\
  # `StreamTokenizer` 的用法\n\n要使用 `StreamTokenizer`，你用底层的 `Reader` 构造它。然后设置语法表和标志位。接下来，对标记进行循环，调用\
  \ `nextToken()` 直到它返回 `TT_EOF`。\n\n`nextToken()` 方法解析下一个标记。该类型既由方法返回，也存放在 `type`\
  \ 字段中。如果标记是一个单词，则标记的值存放在 `sval` 字段（字符串值）中；如果标记是一个数字，则存放在 `nval` 字段（数值）中。\n\n标记类型可以是字符或值，代表标记的类型。如果标记由单个字符组成，则类型的值就是该字符的值。如果标记是引号字符串，则值就是引号字符的值。否则，它是以下值之一：\n\
  \n*   `TT_EOF` 表示已读取到流的结束。\n*   `TT_EOL` 表示已读取到行结束。\n*   `TT_NUMBER` 表示一个数字标记已被读取。\n\
  *   `TT_WORD` 表示一个单词标记已被读取。\n\n# `StreamTokenizer` 的方法\n\n`StreamTokenizer` 有许多方法来设置语法表。我们只提到两个。第一个是\
  \ `resetSyntax()`，它将所有字符设置为普通。第二个是 `wordChars()`，赋予一组字符字母属性。\n\n# StreamTokenizer：示例代码\n\
  \n这个示例是一个展示 `StreamTokenizer` 的简单示例。它将文件拆分为由小写或大写字母组成的单词。当遇到普通字符时（在本例中是任何设置为字母的字符），`nextToken()`\
  \ 返回该字符的值。\n\n```java\nimport java.io.*;\nimport java.util.*;\n\npublic class StreamTokenizerExample{\n\
  \    public static void main(String args[]){\n        try{\n            FileReader\
  \ fr = new FileReader(\"t.txt\");\n            BufferedReader br = new BufferedReader(fr);\n\
  \            StreamTokenizer st = new StreamTokenizer(br);\n            st.resetSyntax();\n\
  \            st.wordChars('A', 'Z');\n            st.wordChars('a', 'z');\n    \
  \        int type;\n            while ((type = st.nextToken()) != StreamTokenizer.TT_EOF){\n\
  \                if(type==StreamTokenizer.TT_WORD) System.out.println(st.sval);\n\
  \            }\n        } catch (IOException e){\n            System.out.println(e);\n\
  \        }\n    }\n}\n```\n\n\n\n\n在 Java 中显示屏幕输出是使用 `System.out` 对象完成的。你不需要创建 `System.out`\
  \ 对象。它在 Java 程序中始终可用。有 3 个方法可以用于显示输出：`print()`、`printf()` 和 `println()`。\n\n- `print()`\
  \ 方法通常用于显示提示符或行的一部分。它不会自动将光标移动到新行的开头。\n- `println()` 方法的输出效果与 `print()` 方法完全相同，不同在于它在执行最后一个操作时，总是将光标移动到新行的开头。\n\
  - `printf()` 方法用于输出格式化后的文本和数字。与 `print()` 方法一样，它不会自动将光标移动到新行的开头。\n\n# 键盘输入 [ 标准输入\
  \ ]\n\n在 Java 中接收键盘输入是使用 `Scanner` 对象完成的。Java 中有一个 `System.in` 对象可以用于获取输入，但它的功能并不强大。相反，Java\
  \ 程序员通常更倾向于使用一个“映射”到 `System.in` 对象的 `Scanner` 对象。`System.in` 对象（类似于 `System.out`\
  \ 对象）已经存在且可以直接使用。但是，你必须手动创建一个 `Scanner` 对象。\n\n一旦你创建了 `Scanner` 对象并将其“映射”到 `System.in`\
  \ 对象，就可以使用以下方法来测试和获取输入。输入始终以字符字符串（`String` 类型）的形式进入 Java 程序。可以使用一些方法将 `String` 转换为字符、整数、浮点数等。以下是常用的\
  \ `Scanner` 方法：\n- `hasNext()` // 是否有可读的内容的内容？返回 true 或 false。\n- `nextInt()` //\
  \ 获取一个 int\n- `nextDouble()` // 获取一个 double\n- `next()` // 获取一个 String（以空白符分隔）\n\
  - `nextLine()` // 获取整行的剩余内容作为 String\n\n**注意：** 没有读取单个字符的方法！请改用读取字符串。\n\n## 30.3\
  \ Java 交互式输入/输出示例\n\n使用“映射”到 `System.in` 对象的 `Scanner` 对象进行输入，并使用标准输出对象 `System.out`\
  \ 进行输出。\n\n# 输入\n\n1. 使用 `Scanner` 类通过 `System` 类中的标准输入对象（`System.in`）创建一个输入对象。`Scanner`\
  \ 类位于 `java.util` 包中。\n```java\nScanner input = new Scanner( System.in ); // input\
  \ 对象非正式地称为“input”\n```\n2. 使用 `Scanner` 类的方法获取用户通过键盘输入的值。\n```java\nint num1;\n\
  double num2;\nString str;\n\nnum1 = input.nextInt(); // 获取一个整数并赋值给 num1\nnum2 =\
  \ input.nextDouble(); // 获取一个实数并赋值给 num2\nstr = input.nextLine(); // 获取一个字符串并赋值给\
  \ str\n```\n\n# 输出：\n\n1. 使用 `System` 类中的标准输出对象（`System.out`）。\n2. 使用 `PrintStream`\
  \ 类的方法（`printf()`、`print()`、`println()`）通过 `System.out` 对象将输出显示在屏幕上。`System.out`\
  \ 对象是一个 `PrintStream` 类型的对象。\n\n```java\nSystem.out.print(“What is your name? “);\n\
  String name = input.nextLine();\nSystem.out.println(“Hello there “ + name + “, nice\
  \ to meet you!\");\ndouble purchasePrice = 178.34;\nSystem.out.printf(“Your total\
  \ is $%.2f\\n”, purchasePrice);\n```\n\n## 30.4 类构造函数\n\n## Scanner 类构造函数与描述\n\n\
  | 构造函数 | 描述 |\n| :--- | :--- |\n| 1 ScannerFilesource | 构造一个新的 Scanner，从指定文件扫描产生值。\
