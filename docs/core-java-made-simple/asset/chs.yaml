  \ log);\n\nSystem.out.println(st);\n\nStudent stud = (Student) st.clone();\n\nSystem.out.println(“\\\
  n*****克隆对象后*****”);\n\nSystem.out.println(st == stud);\n\nSystem.out.println(st.studAdd\
