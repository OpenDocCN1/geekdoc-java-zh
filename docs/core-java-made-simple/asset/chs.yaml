  \ by som”);\n    }\n}\n```\n\n# 18.19 Queue\n\n*   `Queue` 是 `Collection` 的子类。\n\
  *   `Queue` 是一个接口。 \n*   `PriorityQueue` 是实现 `Queue` 的类。\n*   `PriorityQueue` 遵循优先级顺序。\n\
  *   `PriorityQueue` 元素必须是 `Comparable`。\n*   `PriorityQueue` 不允许 `null`。\n*   `PriorityQueue`\
  \ 不允许重复元素。\n*   `PriorityQueue` 使用 `Comparator` 进行自定义排序。\n*   `peek()` 返回头元素，如果为空则返回\
  \ `null`。\n*   `poll()` 并返回头元素，如果为空则返回 `null`。\n*   `element()` 如果为空则抛出 `NoSuchElementException`。\n\
  *   `remove(Object o)` 如果未找到则抛出 `NoSuchElementException`。\n\n```java\nimport java.util.*;\n\
  import java.io.*;\nimport java.util.*;\n\npublic class Jtc18 {\n    public static\
  \ void main(String[] args) {\n        Scanner sc = new Scanner(System.in);\n   \
  \     PriorityQueue<Integer> pq = new PriorityQueue<>();\n        while (true) {\n\
  \            int val = sc.nextInt();\n            if (val == 0) break;\n       \
  \     pq.offer(val);\n        }\n        System.out.println(“--”);\n        System.out.println(“Size\\\
  t:” + pq.size());\n        System.out.println(pq.peek());\n        System.out.println(“Size\\\
  t:” + pq.size());\n        System.out.println(pq.poll());\n        System.out.println(“Size\\\
  t:” + pq.size());\n        System.out.println(“Remaining Values in PQ1”);\n    \
  \    for (Integer in : pq) {\n            System.out.println(in);\n        }\n \
  \   }\n}\n\nclass PQSort implements Comparator<Integer> {\n    public int compare(Integer\
  \ i1, Integer i2) {\n        return i1 - i2;\n    }\n}\n```\n\n**Note:** 某些平台可能未为\
  \ `PriorityQueue` 提供适当支持 [windows]。\n\n## 18.21 NavigableSet\n\n* 它是 `SortedSet`\
  \ 的子接口。\n* 它提供了多种用于导航的方法。`NavigableSet` 接口定义了以下方法：\n\n`ceiling(e)`\n\n返回 `>=e` 的最小元素。\n\
  \n`higher(e)`\n\n返回 `>e` 的最小元素。\n\n`floor(e)`\n\n返回 `<=e` 的最大元素。\n\n`lower(e)`\n\
  \n返回 `<e` 的最大元素。\n\n`pollFirst()`\n\n移除并返回第一个元素。\n\n`pollLast()`\n\n移除并返回最后一个元素。\n\
  \n`descendingSet()`\n\n返回反序排列的 `SortedSet`\n\n# Example\n\n```java\nimport java.util.*;\n\
  class NavigableSetDemo{\n    public static void main(String[] args){\n        TreeSet<Integer>\
  \ t=new TreeSet<Integer>();\n        t.add(1000);\n        t.add(2000);\n    }\n\
  }\n```\n\n\n\n\n```java\nt.add(3000);\nt.add(4000);\nt.add(5000);\n\nSystem.out.println(t);//[1000,\
  \ 2000, 3000, 4000,5000]\nSystem.out.println(t.ceiling(2000));//2000\nSystem.out.println(t.higher(2000));//3000\n\
  System.out.println(t.floor(3000));//3000\nSystem.out.println(t.lower(3000));//2000\n\
  System.out.println(t.pollFirst());//1000\nSystem.out.println(t.pollLast());//5000\n\
  System.out.println(t.descendingSet());//[4000, 3000, 2000]\nSystem.out.println(t);//[2000,\
  \ 3000, 4000] }\n}\n```\n\n## 18.22 NavigableMap\n\n它是 `SortedMap` 的子接口，定义了几个用于导航目的的方法。\n\
  \n`NavigableMap` 接口定义了以下方法：\n- `ceilingKey(e)`\n- `higherKey(e)`\n- `floorKey(e)`\n\
  - `lowerKey(e)`\n- `pollFirstEntry()`\n- `pollLastEntry()`\n- `descendingMap()`\n\
  \n# 示例\n\n```java\nimport java.util.*;\n\nclass NavigableMapDemo{\npublic static\
  \ void main(String[] args){\nTreeMap<String,String> t=new TreeMap<String,String>();\n\
  t.put(“b”,”banana”);\nt.put(“b”,”banana”);\nt.put(“c”,”cat”);\nt.put(“a”,”apple”);\n\
  t.put(“d”,”dog”);\nt.put(“g”,”gun”);\nSystem.out.println(t);\nSystem.out.println(t.ceilingKey(“c”));\n\
  System.out.println(t.higherKey(“e”));\nSystem.out.println(t.floorKey(“e”));\nSystem.out.println(t.lowerKey(“e”));\n\
  System.out.println(t.pollFirstEntry());\nSystem.out.println(t.pollLastEntry());\n\
  System.out.println(t.descendingMap());\nSystem.out.println(t);\n}}\n```\n\n# Collections\n\
  \n- `Collections` 类定义了多个用于集合对象的实用方法。\n- 排序 `List` 元素：\n  - `Collections` 类定义了以下方法来执行\
  \ `List` 元素的排序。\n\n## public static void sort(List l);\n\n按照默认的自然排序顺序对 `List` 元素进行排序，在这种情况下元素应该是同类型且可比较的，否则我们将得到\
  \ `ClassCastException`。\n`List` 不应包含 `null`，否则我们将得到 `NullPointerException`。\n\n\
  ## public static void sort(List l,Comparator c);\n\n按照自定义的排序顺序对 `List` 元素进行排序。\n\
  \n# 示例\n\n```java\nimport java.util.*;\n\nclass Student implements Comparable{\n\
  int sid;\nString sname;\nString email;\nStudent(int sid,String sname,String email){\n\
  this.sid=sid;\nthis.sname=sname;\nthis.email=email;\n}\npublic String toString(){\n\
  return “”+sid+”\\t”+sname+”\\t”+email;\n}\npublic boolean equals(Object o){\nStudent\
  \ s=(Student)o;\nif(this.sid==s.sid)\nreturn true;\nreturn false;\n}\npublic int\
  \ compareTo(Object o){\nStudent s=(Student)o;\nreturn this.sid-s.sid;\n}\n}\n\n\
  class SnameComparator implements Comparator{\npublic int compare(Object o1,Object\
  \ o2){\nStudent s1=(Student)o1;\nStudent s2=(Student)o2;\nreturn s1.sname.compareTo(s2.sname);\n\
  }}\n\nclass EmailComparator implements Comparator{\npublic int compare(Object o1,Object\
  \ o2){\nStudent s1=(Student)o1;\nStudent s2=(Student)o2;\nreturn s1.email.compareTo(s2.email);\n\
  }\n}\n```\n\n# 示例\n\n```java\nclass Jtc7{\npublic static void main(String as[]){\n\
  ArrayList al=new ArrayList();\nStudent s1=new Student(22,”dd”,”cc@jtc”);\nStudent\
