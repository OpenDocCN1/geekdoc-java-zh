  \   sum += sc.nextDouble();\n                count++;\n            }\n         \
  \   else {\n                String str = sc.next();\n                if (str.equals(\"\
  *\")) break;\n            }\n        }\n        System.out.printf(\"Sum of given\
  \ %d numbers id %d\", count, sum);\n    }\n}\n```\n\n# 第 31 章\n# 注解 (Annotations)\n\
  \n## 31.1 引言\n注解提供了一种在 Java 类内部指定元数据（Metadata）特殊方式，而不是写在 XML 文件中。\n\n当你使用 Struts、Hibernate、Spring、EJB\
  \ 等开发基于 J2EE 的应用程序时，你需要编写许多特定于相应框架或技术的 XML 文档。\n\n在 jdk 1.5 中，你可以通过在类内部指定与 Struts、Hibernate、Spring\
  \ 相关的元数据来避免这种 XML。\n\n### 注解的实现和使用主要有三项任务：\n1. 定义注解。\n2. 提供 `APT`（注解处理工具）。\n3. 使用注解。\n\
  \n通常情况下，技术或框架厂商负责定义注解并提供注解处理工具（`APT`）。作为开发者，你只需要负责使用注解。\n\n### 如果你愿意，可以使用以下语法创建自定义注解：\n\
  1) 定义注解\n语法：\n```java\n@interface Anno_Name{\n    datatype member_name();\n    datatype\
  \ member_name();\n}\n```\n\n## 示例\n1. 定义注解\n```java\n@interface Author{\n    String\
  \ aname();\n    int age();\n}\n```\n2. 使用注解\n```java\n@Author(aname=\"Som\",age=106)\n\
  class Hello {\n    ...\n}\n```\n\n## 示例\n1. 定义注解\n```java\n@interface Servlet{\n\
  \    String name();\n    String url();\n    int load();\n}\n```\n2. 使用注解\n```java\n\
  @Servlet(name=\"login\",url=\"/login\",load=1)\nclass Hello { }\n```\n这里不需要继承 `HttpServlet`。你定义的每个注解都是\
  \ `java.lang.Annotation` 的子类型，且它是默认的父类型。所有注解成员都将由 JVM 在内部实现。如果你想处理注解，可以使用以下类及其方法来获取信息：\n\
  \n### java.lang.Class\n`boolean isAnnotationPresent(Class cls)`\n`class getAnnotation(Class\
  \ cls)`\n`class[] getAnnotations()`\n\n## 31.2 注解的类型\n1. 标记注解 (Marker Annotations)\n\
  2. 单值注解 (Single Valued Annotations)\n3. 多值注解 (Multi-Valued Annotations)\n\n### 标记注解\n\
  在定义任何成员的情况下定义的注解称为标记注解。\n\n#### 示例\n```java\n@interface Serializable{ }\n```\n用法：\n\
  ```java\n@Serializable\nclass Hello { }\n```\n\n### 单值注解\n只定义了一个成员的注解称为单值注解。\n\n\
  #### 示例\n```java\n@interface Author{\n    String value();\n}\n```\n用法：\n```java\n\
  @Author(value=\"som\")\n或\n@Author(\"som\")\nclass Hello { }\n```\n\n### 多值注解\n\
  定义了两个或多个成员的注解称为多值注解。\n\n#### 示例\n```java\n@interface Employee{\n    int eid();\n\
  \    String ename();\n    long phone();\n}\n```\n用法：\n```java\n@Employee(eid=101,ename=\"\
  Som\",phone=3333333)\nclass Hello { }\n```\n如果你定义自定义注解，可能需要使用一些预定义的注解。\n\n## 31.3\
  \ 内置注解\n1. `@Retention`\n2. `@Target`\n3. `@Inherited`\n4. `@Deprecated`\n5. `@Override`\n\
  6. `@SuppressWarnings` 等。\n\n### @Retention\n此注解用于指定注解的留存策略（Retention policy）。留存策略指示了注解的作用范围。你可以定义以下留存策略：\n\
  \n#### 任何注解的策略\n- `SOURCE`\n- `CLASS`\n- `RUNTIME`\n\n###这三个留存策略定义在名为 `RetentionPolicy`\
  \ 的枚举常量中。\n\n用法：\n```java\n@Retention\n```\n\n\n\n(`RetentionPolicy.CLASS/SOURCE/RUNTIME`)\n\
  \n```java\n@interface Author{\n\n}\n```\n\n# SOURCE\n\n当 `RetentionPolicy` 为 `SOURCE`\
  \ 时，注解将仅在源代码可用，而不会在字节码（Byte Code）和原生代码中使用。`Source` 是默认的 `RetentionPolicy`。\n\n#\
  \ CLASS\n\n当 `RetentionPolicy` 为 `CLASS` 时，注解在源代码和字节码中可用，但不会在原生代码中使用。\n\n# RUNTIME\n\
  \n当 `RetentionPolicy` 为 `RUNTIME` 时，注解在源代码、字节码和原生代码中可用。\n\n# @Target\n\n此注解用于指定目标`Target`），即指定注解应该用于类、方法、字段、构造函数还是所有。\n\
  \n所有目标都定义在名为 `ElementType` 的枚举常量中。\n\n例如：\n\n```java\n@Target(ElementType.Type)\n\
  @interface Author{\n\n}\n```\n\n```java\n@Target(ElementType.Method)\n@interface\
  \ Author{\n\n}\n```\n\n# @Inherited\n\n如果你定义任何自定义注解，默认情况下，该注解不会被子类继承。\n\n如果你想将父类的注解继承到子类，则注解定义必须标记为\
  \ `@Inherited`。\n\n# @Deprecated\n\n此注解将用于将自定义方法标记为已弃用。\n\n如果你正在定义一个实现不可用或可能在未来版本中发生更改的方法，你可以将该方法定义为\
  \ `@Deprecated`。\n\n# @Override\n\n它将用于方法。它强制编译器去匹配父类中的方法签名。\n\n如果父类中不存在该方法签名，编译器将给出编译错误。\n\
  \n# @SuppressWarning\n\n通过使用此注解，你可以抑制警告消息。在编译源文件时，如果警告被抑制，编译器将不会显示任何警告消息。\n\n# Example\n\
  \n```java\npackage com.JTC.anno;\n\nimport java.lang.annotation.*;\n\n@Inherited\
  \ @Target(ElementType.TYPE)\n@Retention(RetentionPolicy.RUNTIME)\n@interface Author{\n\
  \nString aname();\n\nint age();\n}\n\n@Author(aname=”Som”,age=88)\nclass Hai{\n\
  @Deprecated void m1(){\n\n}}\n\nclass A extends Hai{ void m1(){}\n}\n\npublic class\
  \ Test5{\npublic static void main(String args[]){\ntry{\nClass cls=Class.forName(“com.JTC.anno.A”);\n\
  boolean b=cls.isAnnotationPresent (Author.class);\nSystem.out.println(b);\nif(b){\n\
  Author a =(Author)cls.getAnnotation (Author.class);\nSystem.out.println(a.aname()+”\\\
  t”+a.age());\n}\n}\ncatch(Exception e){\ne.printStackTrace();\n}\n}\n}\n```\n\n\
