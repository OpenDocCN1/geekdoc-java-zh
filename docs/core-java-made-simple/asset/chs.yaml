- "# Core Java 入门指南\n\n\n\n![](img/cover.jpg)\n\n![image](img/cover.jpg)\n\n\n![](img/logo.jpg)\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n# 前言\n\n作者坚信，本书将为那些希望通过通俗易懂的语言来全面理解 Java 概念的学生提供帮助，书中提供了多种类比理解方式和代码段。\n\
  \n本书有望成为初学者的一个非常好的起点，也是进阶用户的一宝财富。核心 Java 的复杂概念以简单易懂的方式给出，以便学生能够高效地理解它们。\n\n俗话说：“人非完人，孰错由常”。从这个角度来看，我们希望不足之处能得到原谅。同时，作者欢迎任何形式的建设性批评和改进建议。我们欢迎所有明智的建议，作者将尽力在书的后续版本中纳入这些宝贵的建议。\n\
  \n# 第 1 章：核心 Java 简介\n\n## 1.1 简介\n\nJava 是一门高级编程语言，最初由 Sun Microsystems 开发，由 James\
  \ Gosling 发起并于 1995 年作为 Sun Microsystems Java 平台的核心组件（Java 1.0 [J2SE]）发布。它运行在多种平台上，如\
  \ Windows、Mac OS 以及各种版本的 UNIX。Java 标准版的最新发布版本是 Java SE 9。随着 Java 的进步及其广泛普及，已经构建了多种配置以适应各种类型的平台。\n\
  \n## 1.2 C 语言编程与 Java 编程的区别\n\n![](img/1.1.jpg)\n\n**图 1.1:** C 编程与 Java 编程\n\n\
  C 程序以 `.c` 扩展名保存。成功编译‘c’程序后，将生成原生代码或 `.exe` 文件，该文件依赖于平台，无法在任何其他平台上使用。此 `.exe` 文件是平台相关的，因为会包含与相应平台兼容性相关的兼容问题。当我们编写\
  \ java 程序时，必须以 `java` 扩展名保存。成功编译 java 程序后，将生成 `.class` 文件，这被称为字节码（byte code），无论是否有相应的平台\
  \ JDK/JRE，它都是跨平台的。（图 1.1）\n\n**问题 1：为什么在‘C’语言编程中可以获得原生代码，而在 Java 中无法获得原生代码？**\n\n\
  **回答：** ‘C’语言编程支持静态加载，这意味着如果后续程序需要程序的相应成员，则所有内容都不会加载到主内存中；而 Java 支持动态加载，这意味着如果需要任何方法，它将被分配到主内存中并在使用后立即销毁。\n\
  \n## 1.3 需要记忆的重要术语\n\n1.  **源代码 (Source Code)：** 开发者编写程序（人类可读格式）。\n2.  **字节码 (Byte\
  \ Code)：** 成功编译 java 程序后将生成字节码，即 `.class` 文件，被称为字节码。该字节码在运行程序时会被进一步处理。\n3.  **Java\
  \ 编译器 (Java Compiler)：** 这是一个名为 `javac.exe` 的程序，主要负责检查程序语言的语法。它还会生成字节码。\n4.  **解释器\
  \ (Interpreter)：** 它读取字节码并逐行执行。\n5.  **JIT (即时)编译器：** 用于在运行时将字节码转换为原生代码以提高性能。\n\
  6.  **JVM (Java 虚拟机)：** 它为执行程序提供跨平台的环境。\n7.  **JRE (Java 运行环境)：** 它为运行 Java 提供环境。\n\
  8.  **JDK (Java 开发工具包)：** 它包含开发 Java 应用所需的工具。\n\n## 1.4 安装 JDK\n\n**步骤**\n\n1. \
  \ 打开 DVD。\n2.  打开 Java8 文件夹。\n3.  双击安装程序。（图 1.2）\n\n    ![](img/1.2.jpg)\n\n   \
  \ **图 1.2:** Java SE 开发工具包 安装\n\n4.  点击“下一步”。\n5.  提供你想要安装 JDK 1.8 的目标文件夹，否则不想指定特定位置，请点击“下一步”。图\
  \ 1.3, 1.4）\n\n    ![](img/1.3.jpg)\n\n    **图 1.3:** 自定义设置\n\n    ![](img/1.4.jpg)\n\
  \n    **图 1.4:** 进度\n\n6.  点击“下一步”。图 1.5, 1.6）\n\n    ![](img/1.5.jpg)\n\n    **图\
  \ 1.5:** 目标文件夹\n\n    ![](img/1.6.jpg)\n\n    **图 1.6:** Java 安装进度\n\n7.  点击“完成”。图\
  \ 1.7）\n\n    ![](img/1.7.jpg)\n\n    **图 1.7:** Java SE 开发工具包 8 安装完成\n\n成功安装 JDK\
  \ 后，你需要为 JDK 的 `bin`目录设置路径。仅仅在机器上安装 JDK 是不够的，同时还需要设置 JDK 的 `bin` 目录。\n\n### 1.4.1\
  \ 设置路径\n\n路径可以通过两种不同的方式设置：\n\n1.  临时路径设置。\n\n# 设置临时路径\n\n\n\n\n\n1. 在命令提示符中进入相应的工作目录。\n\
  \n2. 复制 `JDK/Bin` 文件夹的路径。\n\n3. 在命令提示符中输入。（图 1.8）\n\n```bash\nset path =%path%;C:\\\
  Java\\Jdk1.7\\bin\n```\n\n![](img/1.8.jpg)\n\n*图 1.8：命令提示符*\n\n当你临时设置 `path` 时，每次尝试编译运行\
  \ Java 程序或打开命令提示符时，都需要重新设置路径，这是一个耗时的过程。\n\n为了避免临时设置路径带来的问题，我们可以永久设置路径。\n\n## 2.\
  \ 永久路径设置。\n\n**设置永久路径：**\n\n1. 右键点击“我的电脑”图标。\n2. 点击“属性”。\n3. 点击“高级”选项卡。（图 1.9）\n\
  \n   ![](img/1.9.jpg)\n\n*图 1.9：高级系统设置*\n\n4. 点击“环境变量。（图 1.10）\n\n   ![](img/1.10.jpg)\n\
  \n*图 1.10：环境变量*\n\n5. 点击“用户变量”下的“新建”。。（图 1.11）\n\n   ![](img/1.11.jpg)\n\n*图 1.11：新建变量*\n\
  \n6. 变量名提供 `path`，变量值为 `path%;C:\\Java\\Jdk1.7\\bin`（bin 文件夹路径）。\n7. 点击“确定”。图 1.12）\n\
  \n   ![](img/1.12.jpg)\n\n*图 1.12：编辑用户变量*\n\n设置永久路径后，你就不需要反复设置路径了。\n\n## 1.4.2 如何编译\
  \ Java 程序(#toc.xhtml_s6a)\n\n1. 编写你的 Java 程序并以 `.java` 扩展名保存程序。\n2. 成功编译 Java 程序后，将生成一个以类命名的\
  \ `.class` 文件，该文件被称为“字节码”。\n3. 整个 Java 程序必须写在 `class` 内部。\n4. 要编译 Java 程序，请打开命令提示符。\n\
  5. 进入相应的工作目录。\n\n**语法：** `javac filename`（你保存 Java 程序的文件名）。例如：`javac Jtc1.java`\n\
  6. 在编译 Java 程序时，你需要提供保存 Java 程序的文件名。\n7. 你可以使用任何名称后接 `.java` 扩展名来保存 Java 程序。\n8.\
  \ `.class` 文件将以类名命名，而不是文件名命名。\n9. 始终建议将 Java 程序保存为包含 `main` 方法的类名。\n\n## 1.4.3 运行\
  \ Java 程序(#toc.xhtml_s7a)\n\n在运行 Java 程序时，你需要提供包含 `main` 方法的 `.class` 文件名。例如：`java\
  \ Jtc1`\n\n![](img/9.jpg)\n\n### 程序 1.1\n\n```java\nclass Hello{\n    void m1(){\n\
  \        System.out.println(\"m1 in Hello\");\n    }\n}\n\npublic class Jtc2 {\n\
  \    public static void main(String[] args) {\n        Hello h1=new Hello();\n \
  \       h1.m1();\n    }\n}\n```\n\n![](img/10.jpg)\n\n### 输出：\n\n编译：`javac Jtc2.java`\
  \ - 首先会生成两个 .class 文件，第一个是 Hello，第二个是 Jtc2。\n运行：`java Jtc2`\nM1 in Hello - 输出\n\n\
  运行：`java Hello`\n错误：在类 Hello 中未找到 main 方法，请定义 main 方法为：Public static void main(String\
  \ args[])\n\n上述程序可以使用任何名称后接 `.java` 扩展名进行保存，在编译程序时，你需要提供保存程序的文件名。\n\n成功编译上述程序后，将生成两个\
  \ `.class` 文件，即 `Jtc2` 和 `Hello`。\n\n#### 注意\n\n* `.class` 文件的生成不取决于你是如何保存程序或 `main`\
  \ 方法的。源文件中有多少个类，就会生成多少个 `.class` 文件。\n* 运行程序时，你需要提供包含 `main` 方法的 (.class) 文件名，即\
  \ `Jtc2`。\n\n**问 3：假设你用某个名称后接 .java 扩展名保存了一个 Java 程序，但在编辑器中没有写任何内容，那么编译它时会发生什么？它会被视为\
  \ Java 程序吗？**\n\n**答：** 它会被视为 Java 程序，但为了成功编译，内部必须包含某些内容。如果相应的编辑器没有任何内容，就无从编译程序了。因此，我们甚至无法预期生成任何\
  \ `.class` 文件。\n\n**问 4：我们是否可以通过键盘对字节码进行任何种的更改或替换？**\n\n**答：** 不可以。如果你对现有的字节码进行任何更改，你将无法成功运行该程序，因为你从键盘提供的任何输入将以输入流的形式存在，其含义与原有含义不同。\n\
  \n## 第 2 章(#toc.xhtml_c02)\n\n### 2.1 语言(#toc.xhtml_c02)\n\n### 字符集(#toc.xhtml_s8a)\n\
  \n主要类型：\n1. A 到 Z\n2. a 到 z\n3. 0 到 9\n基本上这些在键盘上都是可用的。因此，Java 通过国际化或本地化支持多种语言。\n\
  \n### 数据类型(#toc.xhtml_s9a)\n\n主要有两种类型：\n\n### a) 原始类型\n\n```java\nclass Hello{\n\
  \    int a;\n    int ab;\n    int ab1;\n    int a1b;\n    int a_b;\n    int ab_;\n\
  \    int _ab;\n    int a$b;\n\n    void m1(){\n        System.out.println(\"m1 in\
  \ Hello\");\n    }\n    void m2(){\n        // m2 逻辑\n    }\n}\n\npublic class Jtc5\
  \ {\n    public static void main(String[] args) {\n        Hello h1=new Hello();\n\
  \        h1.m1();\n        h1.m2();\n    }\n}\n```\n\n### b) 自定义类型\n\n自定义类型主要有两种：\n\
  1. Class\n2. Interface\n\n从 JDK 1.5 开始引入了两种新的数据类型：\n1. Enum\n2. Annotation\n\n##\
  \ 2.3 关键字(#toc.xhtml_s10a)\n\n关键字具有预定义的含义，在程序中不能作为标识符或自定义单词。\n\n### 关键字列表：\n\n![](img/15.jpg)\n\
  \n## 2.4 标识符或自定义单词(#toc.xhtml_s11a)\n\n标识符将用于类变量等。在命名标识符或自定义单词时，请记住以下规则：\n\n1. 关键字不能作为标识符。\n\
  2. 标识符不能以数字开头，通常建议用小写字母开头标识符。\n3. 它不能包含除 `_` 或 `$` 之外的特殊符号。\n4. 标识符中间不能包含任何空格。\n\
  5. 标识符可以包含数字，但不应在开头。\n\n   例如：\n   `int ab;` // 可以\n   `int a_b;` // 可以\n   `int\
  \ a b;` // 不可以\n\n### 程序 2.2\n\n```java\nclass Hello{\n    int a;\n    int ab;\n\
  \    int ab1;\n    int a1b;\n    int a_b;\n    int ab_;\n    int _ab;\n    int a$b;\n\
  }\n```\n\n\n\n\n\n```java\n//int _; -标识符在 Java SE 8 之后的版本中可能不受支持\n\nint _$;\n\n\
  //int ab*; - 不可以\n\n//int ()_; - 不可以\n\n//int for; - 不可以\n\n//int true; - 不可以\n\n\
  int Integer;\n\nint INT;\n\nint For;\n\nvoid m1(){\n\n    System.out.println“m1\
  \ in Hello”);\n    System.out.println(Integer);\n    System.out.println(INT);\n\
  }\n\n}\n\npublic class Jtc6 {\n    public static void main(String[] args) {\n  \
  \      Hello h1=new Hello();\n        h1.m1();\n    }\n}\n```\n\n# 输出:\n\n![](img/16.jpg)\n\
  \n**注意：** `int Integer;` `Integer INT;` `int java.lang.Integer;`\n\n- 当我们写 `int\
  \ Integer` 时，它被视为 `int` 类型的变量。这个 `Integer` 不被视为关键字。\n- 当我们写 `java.lang.Integer`\
  \ 时，在这种情况下它是无效的声明，因为标识符名称中不允许出现特殊符号。\n- 在 Java 中，对应于原始数据类型设计了包装类，它们位于 `java` 包中。因此在\
  \ `Integer int` 中，`Integer` 将被视为包装类，而 `int` 将被视为 `Integer` 类型的引用变量。\n\n# 2.5 变量\n\
  \n变量将具有某些特定的数据类型，并根据相应数据类型的兼容性包含某些值。变量的值在后续程序中可以更改。赋值给任何变量的值将与该特定的内存位置松耦合。\n\n![](img/17.jpg)\n\
  \n# 变量主要分为两种类型\n\n1. **类级变量：** 可以在类内的任何地方访问。如果你没有为对应数据类型的类级变量赋值任何值，它将由 `JVM` 在内部进行赋值。\n\
  \    - 两个类级变量不能同名。\n    - 直接定义在类内部的变量称为类级变量。\n\n2. **局部变量：** 定义在任何块、方法、构造函数内部或任何局部上下文中的变量称为局部变量。局部变量不会由\
  \ `JVM` 隐式初始化，也就是说该局部变量在使用之前必须由开发者显式地初始化。\n    局部变量的内存仅在相应的上下文被处理时分配，并在处理完该上下文后立即销毁。也就是说，你无法在上下文之外访问局部变量。\n\
  \    你可以为局部变量和类级变量命名相同的名称，但当在该上下文中访问该局部变量时，只有该局部变量会被访问。为了在该局部上下文中访问类级变量，你需要使用 `this`\
  \ 关键字。\n\n# 程序 2.3\n\n```java\nclass Hello{\n    int a=10;\n    int b;\n    int\
  \ Hello;\n    Hello h1;\n    void m1(){\n        int ab=100;\n        int bc;\n\
  \        int a=101;\n        //int b;\n        System.out.println“m1 in Hello”);\n\
  \        System.out.println(a); System.out.println(b);\n        System.out.println(Hello);\n\
  \        System.out.println(h1);\n        System.out.println(ab);\n        //System.out.println(bc);\n\
  \    }\n}\n\npublic class Jtc7 {\n    public static void main(String[] args) {\n\
  \        Hello h1=new Hello();\n        h1.m1();\n    }\n}\n```\n\n# 输出:\n\n![](img/18.jpg)\n\
  \n# 2.6 常量\n\n如果你想声明一个固定值的变量，且该值在后续程序中不能更改，请将该变量声明为 `final`。\n\n1. `final int in\
  \ tab=20;`\n2. `static final int ab1=20;`\n3. `static final int AB=30;`\n\n# 程序\
  \ 2.4\n\n![](img/19.jpg)\n\n```java\nclass Hello{\n    int a=10;\n    final int\
  \ ab=20;\n    static final int AB=30;\n}\n\nHello h1= new Hello();\nHello h2= new\
  \ Hello();\n```\n\n当你写 `final int ab` 时，对于 `ab`，内存分配取决于对象的创建数量。（图 2.1）。在 `static\
  \ final` 的情况下，`int AB` 的内存对于 n 个对象也只分配一次。\n根据 JLS（Java 语言规范），`static final` 变量必须大写。\n\
  Final 变量不会不会由 `JVM` 显式自动初始化，你必须初始化 final 变量。\n\n**问题 1：我们可以更改 final 变量的值吗？**\n\n\
  **回答：** 在更改 final 变量的值之前有一些条件，例如，如果它是实例 final 变量且在声明时已经在那里进行了初始化，那么你无法更改该 final\
  \ 变量的值；如果它是实例 final 变量且在声明时没有初始化，那么在不同的对象上下文中，你可以为同一个 final 变量拥有不同的值。\n\n**问题 2：是否始终必须在声明时初始化\
  \ final 变量的值？**\n\n**回答：** 不，没有必要在声明时初始化 final 变量的值。可以通过以下不同的方式进行初始化：\n\n1. 在声明时，通过块的帮助（如果是实例变量，则我们需要使用实例块来初始化它，而在静态的情况下使用静态块）。\n\
  2. 通过构造函数进行初始化。\n\n# 2.7 字面量 (Literals)\n\n字面量是可以赋值给数据类型的值。主要类型有：\n\n1. **整数字面量：**\
  \ 整数字面量：\n    - 十进制字面量：十进制字面量必须以 0-9 开头。\n    - 二进制字面量：二进制字面量必须以 `0b` 开头。例如：`int\
  \ a=0b110;`。\n    - 十六进制字面量：十六进制字面量必须以 `0x` 或 `0X` 开头。例如：`int b=0x1A;`。\n\nb. **浮点数字面量：**\
  \ 为了增加可读性，JDK 1.7 引入了 `_`。这个 `_` 可以增加数字字面量的可读性。在使用数字字面量 `_` 时记住以下几点：\n\n1. 下划线 `_`\
  \ 不能用于任何数字字面量，字面量不能以 `_` 开头，也不能以 `_` 结尾。\n2. 下划线不能紧贴小数点之前或之后。\n**注意：** 这个下划线仅供开发者查看，不会反映在输出中。\n\
  \n# 程序 2.5 \n\n```java\nclass Hello1{\n    int i1=1234;\n    int i2=5678;\n    int\
  \ i3=214743647;\n    int i4=-2147483648;\n    //int i5=_1234;\n    //int i6=1234_;\n\
  \    int i7=0101;\n    //int i8\n    int i9=0;\n    int i10=0x123;\n    int i11=0X123;\n\
  \    int i12=0ABCF;\n    //int i13=1230;\n    long l1=2147483648L;\n\n    void m1(){\n\
  \        System.out.println“m1 in Hello”);\n        System.out.println(i1);\n  \
  \      System.out.println(i2);\n        System.out.println(i3);\n        System.out.println(i4);\n\
  \        System.out.println(i6);\n        System.out.println(i7);\n        System.out.println(i9);\n\
  \        System.out.println(i10);\n        System.out.println(i11);\n        System.out.println(i12);\n\
  \        System.out.println(l1);\n    }\n}\n\npublic class Jtc9 {\n    public static\
  \ void main(String[] args) {\n        Hello1 h1=new Hello1();\n        h1.m1();\n\
  \    }\n}\n```\n\n# 程序 2.6\n\n```java\nclass Hello2{\n    int i1=11234;\n    int\
  \ i2=11_234;\n    int i3=11__234;\n    int i4=11_23_353_3;\n    //int i5=_1234;\n\
  \    //int i6=1234_;\n    int i7=0x123_a;\n    //int i8=0x_123_A;\n    int i9=01_01_01_01_0;\n\
  \    //int i10=0_X12233A; int i11=0_101010;\n\n    void m1(){\n        System.out.println“m1\
  \ in Hello”);\n        System.out.println(i1);\n        System.out.println(i2);\n\
  \        System.out.println(i3);\n        System.out.println(i4);\n    }\n}\n```\n\
  \n\n\n\n\n```java\nSystem.out.println(i7);\n//System.out.println(i8);\nSystem.out.println(i9);\n\
  //System.out.println(i10);\nSystem.out.println(i11);\n}\n}\n\npublic class Jtc10\
