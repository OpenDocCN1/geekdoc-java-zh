  \n# 8.4 VAR-ARG 方法\n\n- `VAR-ARG` 方法从 `JDK15` 开始引入。\n- `VAR-ARG` 指可变参数。\n- `VAR-ARG`\
  \ 在单维数组上实现。\n- 编写 `VAR-ARG` 方法时请记住以下几：\n    - `VAR-ARG` 必须是方法的最后一个参数。\n    - 方法不能包含多个\
  \ `VAR-ARG`。\n    - `VAR-ARG` 不能是第一个参数。\n    - 调用 `VAR-ARG` 方法时，将优先考虑 `VAR-ARG`\
  \ 方法。\n    - 如果没有精确匹配的方法，则将考虑 `VAR-ARG` 方法。\n    - 在没有参数方法的情况下，将只考虑 `VAR-ARG` 方法。\n\
  \n### 语法\n```\n1) void m1(int... a){OK}\n2) void m1(int ...a){OK}\n3) void m1(int\
  \ ... a){OK}\n4) void m1(int...a){OK}\n5) void m1(int ..a){NOT OK}\n6) void m1(int\
  \ ...a,double d){NOT OK}\n7) void m1(double d, int ...a){OK}\n8) void m1(double...d,int...a){NOT\
  \ OK}\n```\n\n# 程序 8.5\n\n```java\nclass Hello {\n    int a = 10;\n    int b = 20;\n\
