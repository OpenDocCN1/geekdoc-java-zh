  \n## 创建 jar 文件\n\n### 创建 jar 文件\n- `jar -cvf som.jar abc`\n- `jar -cf som.jar *.java`\n\
  \n### 提取 jar 文件\n- `jar -xvf som.jar`\n- `jar -xf som.jar`\n\n为了创建 jar 文件，链接代表你想要创建\
  \ jar 文件的名称，源文件名是要包含在 jar 文件内部的内容。\n\n在这里，如果你写 `cvf` 来创建 jar 文件，它将显示创建 jar 文件所采取的所有内部步骤。如果你没有写\
  \ `v`，jar 文件仍然会被创建，但不会显示创建 jar 文件时执行的步骤。\n\n为了提取 jar 文件，我们写 `xvf`，它会显示提取的所有内部过程，即使在这种情况下你没有写\
  \ `v`，它也不会显示正在采取的内部步骤。\n\n\n\n\n\n![](img/246.jpg)![](img/247.jpg)\n\n`package com.p2`\n\
  \n![](img/247a.jpg)\n\n# 第 14 章\n\n## Java.Lang 包\n\n## 14.1 引言\n\n`java.lang` 包是默认包，你的类在无需导入的情况下即可自动使用。即使是\
  \ `java.lang` 包中的成员也可以直接访问，而无需使用任何导入语句。\n\n`java.lang` 包包含许多类：\n\n1. `java.lang.Object`\n\
  2. `java.lang.String`\n3. `java.lang.StringBuffer`\n4. `java.lang.StringBuilder`\n\
  5. `java.lang.Byte`\n6. `java.lang.Short`\n7. `java.lang.Integer` 包装类\n8. `java.lang.Lomg`\n\
  9. `java.lang.Float`\n10. `java.lang.Double`\n11. `java.lang.Boolean`\n12. `java.lang.Character`\n\
  13. `java.lang.Class`\n14. `java.lang.System`\n15. `java.lang.Runtime`\n16. `java.lang.Math`\n\
  \n![](img/248.jpg)\n\n## 14.1.1 java.lang.Object 类\n\n`Object` 是 `java.lang` 包中的一个类。默认情况下它是一个普通的类，例如没有显式继承。默认情况下，它是\
  \ `java` 中所有类型类的直接父类。由于它是所有类的父类，因此对象类的所有成员可以在任何类中被访问。\n\n![](img/249.jpg)\n\n##\
  \ public final native class getClass() 方法\n\n* `getClass()` 是 `java.lang.Object`\
  \ 类中的一个方法。`getClass()` 方法是一个原生方法（native method），意味着它不是 Java 编程实现。\n* 它不能在子类中被重写，因为它是一个\
  \ `final` 方法。它是一个公共方法，可以在包内或包外访问。该类方法用于获取相应引用变量中对象引用的类名。\n* 该方法的返回类型为 `java.lang.Class`\n\
  \n## 示例\n\n```java\npackage com.p1;\n\nclass Hello {\n\n}\n\nclass A {\n\n}\n\n\
  class B extends A {\n\n}\n\npublic class Jtc {\n    public static void main(String\
  \ arg[]) {\n        System.out.println(“in main”);\n        Hello h1 = new Hello();\n\
  \        Class cls = h1.getClass();\n        System.out.println(cls);\n        String\
  \ cname = cls.getName();\n        System.out.println(cname);\n        Hello h2 =\
  \ null;\n        // System.out.printlnh2.getClass().getNmae());\n        System.out.println(“*******\\\
  n”);\n        A a1 = new A();\n        A a2 = new B();\n        Object o = new String(“abc”);\n\
  \        System.out.println(a1.getClass().getName());\n        System.out.println(a2.getClass().getName());\n\
  \        System.out.println(o.getClass().getName());\n    }\n}\n```\n\n## public\
  \ native int hashCode() 方法\n\n* 当你创建任何对象时，所有对象的哈希码都会由 JVM 内部分配。根据该哈希码，JVM 唯一地识别每个对象。对于每个对象，都会唯一地生成\
  \ `hashCode()`，该方法主要负责生成 `hashCode()` 并以整数形式返回。根据需要，你可以在类中重写 `hashCode` 方法并提供你自己的实现来生成\
  \ `hashCode()`。\n* 如果你想更改哈希码的生成算法，可以使用你自己的算法，通过以下签名在类中重写 `hashCode()` 方法：\n\n###\
  \ 语法\n\n`public int hashCode()`\n\n```java\npublic int hashCode()\n{\n    // 自己的实现\n\
  \    return… ;\n}\n```\n\n`hashCode()` 方法的实现可以通过两种方式给出：\n\n1. 总是返回唯一的 `hashCode`。\n\
  2. 静态实现，反复返回相同的 `hashCode`。\n\n始终建议以这种方式编写 `hashCode()` 方法实现，即为每个对象返回一个唯一的 `hashCode`。\n\
  \n### public equals(Object) 方法\n\n* `Equals()` 方法是 `java.lang.Object` 类中的一个方法。它用于以以下方式比较两个对象：\n\
  \    a) 基于引用\n    b) 基于内容\n* 如果你使用 `java.lang.Object` 类中提供的默认 `equals(Object)` 方法实现，那么它将基于引用进行比较。\n\
  * 但如果你想根据内容比较两个对象，请在类中使用以下**签名**重写 `equals(Object)` 方法并提供你自己的实现：\n\n```java\npublic\
  \ boolean equals(Object o)\n{\n    return… ;\n}\n```\n\n## equals() 方法与 hashCode()\
  \ 方法之间的约定：\n\n1. 两个等效的对象应该放在同一个桶中，但位于同一个桶中的所有对象并不一定相等。\n2. 两个等效的对象：必须具有相同的 `hashCode()`，即如果\
  \ `h1.equals (h2)` 为 true，则 `h1.hashCode()==h2.hashCode()` 应该返回 true。\n3. 如果两个对象通过\
  \ `equals(..)` 方法不相等，则对它们的 `hashCode` 没有限制，可能相同也可能不同。\n4. 如果两个对象的 `hashcode` 相同，则这些对象通过\
  \ `.equals` 方法可能相等也可能相等。\n5. 如果两个对象的 `hashCode` 不相等，则这些对象通过 `.equals` 方法一定不相等。\n\
  \n\n\n\n资源清理可以在 `finalize()` 方法完成，通过重写具有以下签名的方法来实现：\n\n```java\npublic void finalize(){\n\
  \n}\n```\n\n垃圾回收（Garbage Collection）是一个用于为主线程提供服务的辅助线程。垃圾回收的任务是回收由未使用或未引用的对象所分配的内存。JVM\
  \ 通过以下方式识别未使用或未引用的对象：\n\ni. 当你在任何局部上下文中创建对象，并立即处理该局部上下文对象引用时，存储在未引用状态中的该引用将符合垃圾回收的条件。\n\
  \n```java\nclass Hello{\n}\n\nclass Jtc{\n    static void m1(){\n        Hello h1=new\
  \ Hello();\n        Hello h2=new Hello();\n    }\n\n    public static void main(String[]\
  \ args){\n        m1();\n    }\n}\n```\n\n在上述程序中，一旦 `m1()` 处理完成，局部引用变量 `h1` 和 `h2`\
  \ 的内存将被销毁，随后对应的引用对象将未被引用或未使用，从而符合垃圾回收条件。\n\n![](img/255.jpg)\n\n当你创建一个对象并将该对象引用存储在对应的引用变量中，稍后在该引用变量中赋值了另一个对象引用，那么之前被引用的对象将未被引用并符合垃圾回收条件。\n\
  \n此时，被左侧引用变量引用的对象将未被引用。\n\n```java\nclass Hello{\n}\n\nclass Jtc{\n    ![](img/255a.jpg)\n\
  \n    public static void main(String[] args){\n        Hello h1=new Hello();\n \
  \       Hello h2=new Hello();\n        Hello h3=new Hello();\n        Hello h4=new\
  \ Hello();\n        h1=h2;\n        h3=h4;\n    }\n}\n```\n\n当你创建一个对象并在该引用变量中赋值\
  \ `null` 时，由该对应引用变量引用的对象将符合垃圾回收条件。\n\n```java\nclass Hello{\n}\n\nclass Jtc{\n \
  \   public static void main(String[] args){\n        Hello h1=new Hello();→for GC\n\
  \        h1=null;\n        new Hello(); →for GC\n    }\n}\n```\n\n内部 JVM 任务：JVM\
  \ 会准备一个未使用或未引用的对象列表。每当 JVM 感到任何堆内存相关问题时，它就会调用垃圾回收来回收或清理由未使用或未引用对象所分配的内存。在调用垃圾回收时，JVM\
  \ 会准备未使用的对象列表并将其交给 `gc()`。`gc()` 尝试回收由未使用对象分配的内存，但在此过程中，某些对象可能会拒绝 `gc()` 的回收，因为这些对象持有某些资源连接或文件连接等；因此，为了回收这些对应对象分配的内存，我们需要确保分配的资源是未使用的并进行资源清理。\n\
  \n# JVM 任务\n\n*   JVM 准备一个未使用或未引用的对象列表。\n*   每当 JVM 感到任何堆内存相关问题时，它就会调用 GC 来回收或清理由未使用或未引用对象所分配的内存：\n\
  \    *   `System.runFinalization();`\n    *   `System.gc();`\n*   无法保证 `gc` 何切何时会被调用。`gc()`\
  \ 的调用取决于 CPU 调度器。\n\n# System.gc()\n\n`gc()` 方法是 `System` 类内部的一个静态方法。当你显式调用或编写 `System.gc()`\
  \ 时，`gc()` 将尝试调用垃圾收集器。\n\n# 克隆 (Cloning)\n\n克隆是创建现有对象拷贝的过程。任何对象都可以通过两种方式进行克隆：\n\n\
  1.  浅克隆 / 浅拷贝\n2.  深克隆 / 深拷贝\n\n当你尝试克隆任何对象时，对应的类类对象必须实现 `Cloneable 接口`。\n\n# 浅克隆\n\
  \n*   在浅拷贝的情况下，只有顶层对象会被克隆，所有的深层对象都将原样使用。`Object` 类中提供的 `clone` 方法的默认实现用于浅拷贝，它会以浅方式克隆对象。为了克隆任何类对象，该类对象必须实现\
  \ `Cloneable 接口`。现有对象和克隆对象必须具有不同的地址（仅限顶层）。（`clone()` 方法是实例方法，不能在静态上下文中调用）（图 14.1）\n\
  \n# 示例\n\n```java\npackage com.jtc2;\n\nclass A {\n    int p;\n    A(int p) {\n\
  \        this.p = p;\n    }\n}\n\nclass B {\n    int q;\n    A a1;\n    B(int q,\
  \ A a1) {\n        this.q = q;\n        this.a1 = a1;\n    }\n}\n\nclass C {\n \
  \   int r;\n    B b1;\n    C(int r, B b1) {\n        this.r = r;\n        this.b1\
  \ = b1;\n    }\n    {\n        System.out.println(“IB in C”);\n    }\n}\n\nclass\
  \ Hello implements Cloneable {\n    int x;\n    C c1;\n    {\n        System.out.println(“IB\
  \ in Hello”);\n    }\n    Hello(int x,C c1){\n        this.x=x;\n        this.c1=c1;\n\
  \    }\n\n    public Object myClone() {\n        Hello h1 = null;\n        try {\n\
  \            h1 = (Hello) this.clone();\n        } catch (CloneNotSupportedException\
  \ e) {\n            e.printStackTrace();\n        }\n        return h1;\n    }\n\
  \n    void show() {\n        System.out.println(“show in Hello”);\n        System.out.println(x);\n\
  \        System.out.println(c1.r);\n        System.out.println(c1.b1.q);\n     \
  \   System.out.println(c1.b1.a1.p);\n    }\n}\n\npublic class Jtc {\n    public\
  \ static void main(String[] args){\n        A a1 = new A(10);\n        B b1 = new\
  \ B(20, a1);\n        C c1 = new C(30, b1);\n        Hello h1 = new Hello(40, c1);\n\
  \        Hello h2 = (Hello) h1.myClone();\n        System.out.println(h1 == h2);\n\
  \        System.out.println(h1.c1 == h2.c1);\n        System.out.println(h1.c1.b1\
  \ == h2.c1.b1);\n        System.out.println(h1.c1.b1.a1 == h2.c1.b1.a1);\n    }\n\
  }\n```\n\n\n\n\n```java\nSystem.out.println(“\\n--------------------- ”);\n\nLoginInfo\
