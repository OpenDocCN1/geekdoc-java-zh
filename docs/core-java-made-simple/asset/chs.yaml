  # 输出:\n\n![](img/99.jpg)\n\n## 6.6 JVM 内部工作机制\n\n*   当你通过包含 `main` 方法的类名运行程序时，内部\
  \ `JVM` 将会获取该类名，并并在该类名的帮助下来调用 `main` 方法。\n*   当 `JVM` 访问类的静态成员时，它首先会检查相应的类（`Jtc56`）是否已加载到主内存中。如果尚未加载，它会首先为\
  \ `Jtc56` 类的静态变量分配内存。![](img/99a.jpg)\n*   然后如果存在任何静态代码块（static block），该代码块将被处理。\n\
  *   如果你直接访问类的实例变量，将会报错，因为在处理静态块时尚未为该实例变量分配内存。\n*   在处理完静态块之后，将访问 `main` 方法。在 `main`\
  \ 方法中，你通过类名直接访问静态变量，例如 `Hello.c`。\n*   在访问静态变量时，它会检查 `Hello` 类是否已加载到主内存中。如果 `Hello`\
  \ 类未加载到主内存中，它会在加载类时首先为静态变量分配内存，然后处理静态块。这一过程只会发生一次。\n*   如果你不创建任何对象，任何实例变量或实例代码块都不会被处理。\n\
  \n**使用 `Class.forName()` 动态加载类** \n\n# 程序 6.7\n\n```java\nclass Hello{\n    int\
  \ a;\n    static int b;\n    {\n        System.out.println(“IB in Hello”);\n   \
  \ }\n    static{\n        System.out.println(“Sb in Hello”);\n    }\n    void m1(){\n\
  \        System.out.println(“m1 in Hello”);\n    }\n    static void m2(){\n    \
  \    System.out.println(“m2 in Hello”);\n    }\n}\n\nclass Jtc57{\n    {\n     \
  \   System.out.println(“IB in Jtc57”);\n    }\n    static {\n        System.out.println(“Sb\
  \ in Hello”);\n        try{\n            Jtc57 j57=(Jtc57)Class.forName(“Jtc57”).newInstance();\n\
  \        }\n        catch(Exception e){\n        }}\n    }\n    public static void\
  \ main(String args[])throws Exception{\n        Class cls=Class.forName(“Hello”);\n\
  \        String str=cls.getName();\n        System.out.println(str);\n        if(str.equals(“Hello”)){\n\
  \            System.out.println(“Hello is loaded”);\n        }\n        else{\n\
  \            System.out.println(“Hello is not found”);\n        }\n        Hello\
  \ h1=(Hello)cls.newInstance();\n        System.out.println(Hello.b);\n        //Hello\
  \ h1= new Hello();\n    }\n}\n```\n\n# 输出:\n\n![](img/101.jpg)\n\n## 6.7 类加载概念\n\
  \n```java\nclass Hello{\n    int a=10;\n    static int b=20;\n    {\n        System.out.println(“IB\
  \ in Hello”);\n    }\n    static{\n        System.out.println(“SB in Hello”);\n\
  \    }\n}\n\nclass hai{\n    int a1=111;\n    static int b1=222;\n    {\n      \
  \  System.out.println(“Ib in Hai”);\n    }\n    static{\n        System.out.println(“SB\
  \ in Hai”);\n    }\n}\n\nclass hai1{\n    {\n        System.out.println(“IB in Hai1”);\n\
  \    }\n    static{\n        System.out.println(“SB in Hello”);\n    }\n}\n\npublic\
  \ class Jtc58{\n    public static void main(String args[])throws Exception{\n  \
  \      Class cls=Class.forName(“Hello”);\n        Class cls1=Class.forName(“Hai”,true,cls.getClassloader());\n\
