  （注：当源代码重复时，为了简洁省略了逻辑，但结构遵循所要求的规则）\n\n## 18.5 Map\n\n`Map` 是一个没有继承 `collection` 接口的接口。`Map`\
  \ 被 `HashMap` 和 `HashTable` 进一步实现，并被 `SortedMap` 扩展。\n\n\n\n\n## HashMap\n\n- `HashMap`\
  \ 根据 `key` 以无序的方式存储元素。\n- `HashMap` 对象支持被序列化和克隆。\n- `value()`：在 `HashMap` 内部可用，返回集合的类型，并提供该\
  \ map 关联的所有值。我们甚至可以通过使用 `entrySet()` 来访问 `HashMap` 的值。\n- `Map.Entry`：这是一个接口，提供了\
  \ `getKey()` 和 `getValue()` 方法，我们可以根据 `getKey()` 和 `getValue()` 使用 `Map.Entry` 引用相应地获取元素。\n\
  \n## LinkedHashMap\n\n1. 它是 `java.util` 包中可用 的一个类。\n2. `LinkedHashMap` 继承了 `HashMap`\
  \ 并实现了 `Map` 接口。\n3. `LinkedHashMap` 使用节点表示来存储元素。\n4. 它也根据键值对的形式存储值。\n5. 在 `LinkedHashSet`\
  \ 的情况下，我们可以存储不同类型的键和值。\n6. 键不能重复，但值可以重复。\n7. 允许 `Null` 作为键和值。\n8. `LinkedHashMap`\
  \ 元素可以按顺序方式访问。\n9. `LinkedHashMap` 的成员没有同步机制。因此它也不是同步的。\n10. 它支持被序列化和克隆。\n11. 它按照添加的顺序存储元素。\n\
  \n## Hashtable\n\n1. 它是一个遗留类，经过了重新工程并包含在集合框架中。\n2. 它继承 `Dictionary` 类并实现了 `Map`、`Serializable`\
  \ 和 `Cloneable` 接口。\n3. `HashTable` 也以键值对的形式存储元素。\n4. `HashTable` 以无序的方式存储元素。\n\
  5. 它允许键值使用不同类型的元素。\n6. 键值格式不允许 `Null`。\n7. `HashTable` 的几乎所有成员都是同步的。因此这会影响应用程序的并发性。\n\
  \n## TreeMap\n\n- 根据 `key` 以排序顺序存储元素。\n- 允许相同类型的键，而值可以是不同的类型。\n- 键和值都不允许 `Null`。\n\
  - `TreeMap` 成员没有同步的，因此它不会影响应用程序的并发性。\n\n![](img/410.jpg)![](img/411.jpg)\n\n## 18.6\
