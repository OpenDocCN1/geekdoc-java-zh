  \n# 4.2 循环语句\n\n循环语句用于根据某些条件重复执行某些任务。主要有以下类型的循环语句：\n\n## for 循环\n\nFor 用于根据某些条件指定的次数迭代循环。\n\
  \n**语法：** `for(初始化; 条件; 增/减 ) { 语句; }`\n\n**for 循环的处理：** for 循环首先执行初始化，然后评估条件，如果返回真，则处理循环内部的语句，然后执行增或减。这个过程会一直持续，直到条件部分返回假。\n\
  \n# 程序 4.9\n\n```java\npublic class Jtc42 {\n    public static void main(String[]\
  \ args) {\n        for(int i=0;i<10;i++){\n            System.out.println(i);\n\
  \        }\n        int i=0;\n        for(;i<10;){\n            System.out.println(i);\n\
  \            i++;\n        }\n        /*for(System.out.println(i);i++){\n      \
  \  for(i<10){\n            System.out.println(i);\n        }*/\n        for(int\
  \ j=0;j<20;j++){\n            System.out.println(“IN FOR :+j);\n            if(i==3)\n\
  \                break;\n            System.out.println(“After Loop”);\n       \
  \ }\n        for(int j=0;j<20;j++){\n            System.out.println(“IN FOR :+j);\n\
  \            if(i==3)\n                System.exit(0);\n            System.out.println(“After\
  \ Loop”);\n        }\n        for(int j=0;j<10;j++){\n            if(i==3)\n   \
  \         {\n                System.out.println(“In LOOP If “+i);\n            \
  \    System.exit(0);\n            }\n            System.out.println(i);\n      \
  \  }\n        int k=0;\n        for(k=0;k<10;k++)\n            i=i++;\n        \
  \    System.out.println(i);\n    }\n}\n```\n\n# 输出:\n\n![](img/69.jpg)\n\n## 2.\
  \ while 循环\n\nwhile 循环是 for 循环的形式。在 while 循环中，首先评估条件，如果返回真，则处理封装的语句，然后执行增或减。它会重复相同的过程，直到条件不满足或返回假。\n\
  \n**语法：**\n```java\nwhile(Condition){\n    语句;\n    增/减;\n}\n```\n\n## 3. do-while\
  \ 循环\n\n**语法：**\n```java\ndo{\n    语句;\n    增/减;\n} while(Condition);\n```\n\n在\
  \ do-while 中，在不检查条件本身的情况下，它会处理一次语句，第二次迭代时检查 while 中指定的条件。如果返回真，则循环继续，否则退出 do-while\
  \ 循环。\n\n### Q4: 与 while 和 do-while 相比，从更好的控制角度我们应该主要使用哪一个？\n\n**答：** 相比于 do-while，总是建议使用\
  \ while 循环，因为通过 `while` 我们可以获得更好的控制。\n\n# 示例\n\n```java\npublic class Jtcloop1 {\n\
  \    public static void main(String[] args) {\n        for(byte b=Byte.MIN_VALUE;b<Byte.MAX_VALUE;b++){\n\
  \            if(b==0x90)\n                System.out.println(“JTC!”);\n        }\n\
  \    }\n}\n\npublic class Jtcincr {\n    public static void main(String[] args)\
