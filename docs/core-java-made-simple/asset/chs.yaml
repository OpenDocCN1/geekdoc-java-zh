  \ 包中的一个类。你不能创建 `Runtime` 类对象，因为 `Runtime` 类的默认构造函数被声明为私有。因此你不能在类外部创建任何对象。`Runtime`\
  \ 类主要基于单例设计模式实现。因此，你无法创建多个 `Runtime` 类对象。\n\n* `Runtime rt=new Runtime();` // 不可以\n\
  \n* 可以可以通过以下方式创建 `Runtime` 类对象：\n    `Runtime rt=Runtime.getRuntime();` // 正确\n\n\
  * `Runtime` 对象的创建过程：\n\n```java\nclass Runtime{\n    private Runtime(){\n    }\n\
  \    private static Runtime rt=null;\n    static{\n        rt=new Runtime();\n \
  \   }\n    public static Runtime getRuntime(){\n        return rt;\n    }\n}\n```\n\
  \n`Runtime rt=Runtime.getRuntime();` // 正确\n\n`Runtime rt=new Runtime();` // 不可以\n\
