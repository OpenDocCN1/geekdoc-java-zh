  \n## 7.1 什么是构造函数\n\n* 它是一种与类名相同的特殊类型方法。\n* 构造函数的主要任务是初始化类的实例变量。即使我们可以初始化静态变量，但并不建议这样做。\n\
  * 构造函数不能像方法那样有任何返回类型（甚至不能是 `void`）。\n* 构造函数可以有参数，也可以没有参数。\n* 构造函数会在对象创建时自动处理；你不能显式地调用构造函数。\n\
  * 如果构造函数有任何返回类型，那么它将被视为一个普通方法，即它只在你调用它时才会被处理，否则在对象创建时不会被自动处理。\n* 你可以编写多个构造函数，但它们在以下方面必须有所不同：\n\
  \    1. 参数的数量\n    2. 参数的类型\n    3. 参数的顺序\n\n# 示例\n\n```java\nclass Hello{ \n  \
  \  Hello(){\n        // 默认构造函数\n    }\n}\n```\n\n# 程序 7.1\n\n```java\nclass Hello\
  \ {\n    int a;\n    int b;\n    static int c = 30;\n    Hello() {\n        System.out.println“Default\
  \ constructor in Hello”);\n    }\n    Hello(int a1) {\n        System.out.println“1\
  \ param constructor in Hello”);\n        a = a1;\n    }\n    Hello(int a1, int b1)\
  \ {\n        System.out.println“2 param constructor in Hello”);\n        a = a1;\n\
  \        b = b1;\n    }\n    void m1() {\n        System.out.println“m1 in Hello”);\n\
  \        System.out.println(a);\n        System.out.println(b);\n    }\n}\n\nclass\
