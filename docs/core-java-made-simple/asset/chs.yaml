  ```\n\n# 第 17 章\n\n## 多线程\n\n## 17.1 什么是多任务处理？\n\n性能或同时执行多个任务被称为多任务处理。\n\n**注意：**\
  \ 到目前还没有任何机器或处理器可以同时执行多个任务，但完成任务所需的时间非常短，我们可能无法判断任务是在同一时间还是在不同时间执行的。\n\n**多任务处理主要有两种类型：**\n\
  \n1) 基于进程的多任务处理。\n2) 基于线程的多任务处理。\n\n![](img/349.jpg)\n\n**注意**\n\n线程将共享资源，这由由 CPU\
  \ 调度算法决定并由线程生命周期管理。\nJava 中的每个线程将由一个特殊的生命周期机制管理，而所有这些处理完全依赖于调度算法。\n\n## 17.2 Java\
  \ 线程\n\nSun 提供了以下 API 来管理线程：\n\n1) `Java.lang.Thread`\n2) `Java.lang.ThreadGroup`\n\
  3) `Java.lang.Runnable` 接口\n\n每当 JVM 启动时，内部都会创建一个名为 `‘main’` 的 `ThreadGroup`，在该\
  \ `ThreadGroup` 下还会创建一个名为 `‘main’` 的线程。\n\nJava 中的每个线程都将被分配特定的任务，并在完成后移动到死亡状态。\n\
  在 Java 中，几乎所有工作都是基于线程完成的。\n\n# 示例\n\n```java\npublic class Jtc181 {\n    public\
  \ static void main(String[] args) {\n        Thread th1 = new Thread();\n      \
  \  System.out.println(th1);\n        String name = th1.getName();\n        System.out.println(name);\n\
  \        int p = th1.getPriority();\n        System.out.println(p);\n        th1.setName(“Jtc-th1”);\n\
  \        System.out.println(th1.getName());\n        th1.setPriority(9);\n     \
  \   // th1.setPriority(11);\n        // th1.setPriority(0);\n        System.out.println(th1.getPriority());\n\
  \        Thread th2 = new Thread();\n        System.out.println(th2);\n        Thread\
  \ th3 = new Thread(“Jtc”);\n        System.out.println(th3);\n        for (int i\
  \ = 0; i < 5; i++) {\n            System.out.println(Thread.currentThread().getName()\
  \ + “ under the thread group of :” + Thread.currentThread().getThreadGroup());\n\
  \            try{\n                Thread.sleep(500);\n            }catch(Exception\
  \ e){\n                e.printStackTrace();\n            }\n        }\n    }\n}\n\
  ```\n\n# 以下是主线程的任务\n\n1. 主线程内部会获取名称。\n2. 主线程内部会创建一个 `ClassNotFound` 类型的对象。\n3. 它为了作为参数传递创建一个字符串对象。\n\
  4. 为主线程设置命令行参数。\n5. 它通过传递字符串来调用主方法。\n6. 所有子线程都是从主线程创建的。\n\n## 17.3 用户线程\n\n用户也可以开发或编写自己的线程。用户线程主要有两种创建方式：\n\
  \n1) 通过继承 `java.lang.Thread` 类。\n\n**通过继承 Thread 类编写用户线程**\n\n1. 通过继承 Thread 类编写用户线程。\n\
  2. 在 Thread 类内部声明实例变量。\n3. 在 Thread 类内部声明构造函数。\n4. 为了从线程类中调用构造函数，需要使用 `super` 语句，之后我们需要通过编写\
  \ `start()` 来启动线程。\n5. 为了处理线程，需要在类中编写 `run()` 方法实现，当你通过继承 Thread 类创建用户线程时，不需要强制覆盖\
  \ `run()` 方法。\n\n# 示例\n\n```java\nclass HelloThread extends Thread{\n    public\
  \ HelloThread(){\n        super();\n        start();\n    }\n    public HelloThread(String\
  \ tname){\n        super(tname);\n        start();\n    }\n    HelloThread(ThreadGroup\
  \ tg,String tname){\n        super(tg,tname);\n        start();\n    }\n    public\
  \ void run() {\n        for (int i = 0; i < 5; i++) {\n            System.out.println(Thread.currentThread().getName()\
  \ + “ under the thread group of :” + Thread.currentThread().getThreadGroup().getName());\n\
  \            try{\n                Thread.sleep(500);\n            }catch(Exception\
  \ e){\n                e.printStackTrace();\n            }\n        }\n    }\n}\n\
  }\n\npublic class Jtc183 {\n    public static void main(String[] args) {\n     \
  \   ThreadGroup tg=Thread.currentThread().getThreadGroup();\n        HelloThread\
  \ th1=new HelloThread();\n        HelloThread th2=new HelloThread(“Jtc-1”);\n  \
  \      HelloThread th3=new HelloThread(tg, “Jtc-2”);\n        for (int i = 0; i\
  \ < 5; i++) {\n            System.out.println(Thread.currentThread().getName() +\
  \ “ under the thread group of :” + Thread.currentThread().getThreadGroup().getName());\n\
  \            try{\n                Thread.sleep(500);\n            }catch(Exception\
  \ e){ \n                e.printStackTrace(); \n            }\n        }\n    }\n\
  }\n```\n\n**Q1 : 为什么在继承线程类时没有必要覆盖 run () 方法？**\n\n\n\n\n\n**答案：** 因为 `run()` 方法在\
  \ `thread` 类中已经被重写，且没有具体实现，但如果你想按照自己的要求来处理线程，则需要重写 `run()` 方法。\n\n## 2) 通过实现 `java.lang.Runnable`\
  \ 接口。\n\n### 通过实现 `Runnable` 接口编写自定义线程的步骤：\n\n1. 通过实现 `runnable` 接口编写你的线程类。\n2.\
  \ 如果需要，定义一些实例变量。\n3. 在你的线程类内部编写构造函数。\n4. 尝试从 `java.lang.Thread` 类中调用相应的构造函数。\n5.\
  \ 通过编写 `start()` 来启动每个线程。\n6. 你的类必须强制重写 `Runnable` 接口中提供的 `run()` 方法。\n\n# 示例\n\n\
  ```java\nclass HelloThread implements Runnable{\n    HelloThread() {\n        Thread\
  \ t1=new Thread(this);\n        t1.start();\n    }\n\n    HelloThread(String tname){\n\
  \        Thread t2=new Thread(this,tname);\n        t2.start();\n    }\n\n    HelloThread(String\
  \ tname,ThreadGroup tg){\n        Thread t3=new Thread(tg,this,tname);\n       \
  \ t3.start();\n    }\n\n    public void run(){\n        for (int i = 0; i < 5; i++)\
  \ {\n            System.out.println(Thread.currentThread().getName() + “ under the\
  \ thread group of : “+ Thread.currentThread().getThreadGroup().getName());\n   \
  \         try{\n                Thread.sleep(500);\n            }catch(Exception\
  \ e){\n                e.printStackTrace();\n            }\n        }\n    }\n}\n\
  \npublic class Jtc103 {\n    public static void main(String[] args) {\n        ThreadGroup\
  \ tg1=new ThreadGroup(“Jtc-pg”);\n        HelloThread t1=new HelloThread(“Jtc-TG”);\n\
  \        HelloThread t2=new HelloThread(“Jtc-1”);\n    }\n}\n\nclass MyThread extends\
  \ Thread implements Runnable{\n    void m1(){\n        System.out.println(“M1 in\
  \ MyThread”);\n        String tname=”Jtc-ch”;\n        Thread t1=new Thread(this);\n\
  \        Thread t2=new Thread(this,tname);\n        t1.start();\n        t2.start();\n\
  \    }\n\n    public void run(){\n        for(int i=0;i<5;i++){\n            System.out.println(Thread.currentThread().getName());\n\
  \            try{\n                sleep(1000);\n            }catch(Exception e){\n\
  \                e.printStackTrace();\n            }\n        }\n    }\n}\n\npublic\
  \ class Jtc184 {\n    public static void main(String[] args) {\n        MyThread\
  \ mt=new MyThread();\n        mt.m1();\n    }\n}\n```\n\n# 示例\n\n```java\ninterface\
  \ I1{\n    void run();\n    void start();\n}\n\nclass Hello extends Thread implements\
  \ I1{\n    public Hello(){\n        super();\n        run();\n    }\n\n    public\
  \ void start(){\n        System.out.println(“Run in Hello”);\n        System.out.println(Thread.currentThread().getName());\n\
  \    }\n\n    void m1(){\n        System.out.println(“m1 in Hello”);\n        Thread\
  \ t1=new Thread(this); t1.start();\n    }\n}\n\npublic class Jtc185 {\n    public\
  \ static void main(String[] args) {\n        Hello h1=new Hello();\n        h1.m1();\n\
  \        //h1.run();\n    }\n}\n```\n\n## 17.4 线程优先级\n\n这是一个由 `JVM` 分配给每个线程的数字。主要定义了三个\
  \ `Thread` 优先级：\n\n1. **MIN_PRIORITY（最低优先级）**\n2. **MAX_PRIORITY（最高优先级）**\n3. **NORM_PRIORITY（普通优先级）**\n\
  \n任何线程的最小优先级为 1。任何线程的普通优先级为 5。任何线程的最大优先级为 10。\n\n这种线程优先级将由 `JVM` 用于在 CPU 调度器遵循基于优先级的算法时分配\
  \ CPU 时间。如果 CPU 调度器不遵循任何基于优先级的算法，那么线程优先级就没有意义。\n\n`final void setPriority(int)`：通过使用\
  \ `setPriority()` 方法我们可以更改线程优先级，但你提供的线程优先级不能大于 10 或小于 1。\n\n`final int getPriority()`：通过此方法我们可以获取线程的优先级。`getPriority()`\
  \ 是一个 final 方法，无法在你的类中重写。\n\n**Q2：我可以调用 `run()` 吗？**\n\n**答案：** 是的，我们可以显式地调用 `run()`，但这个\
  \ `run()` 的行为不像由 CPU 调度器控制的正常 `run()`。\n\n**Q3：我可以重载 `run()` 吗？**\n\n**答案：** 是的，我们可以重载\
  \ `run()`，但重载后的 `run()` 不是真正的 `run()`，它不会被线程调度算法或线程自动调用。\n\n**Q4：我可以启动多次线程吗？**\n\
  \n**答案：** 我们可以多次 `start()`，但会抛出异常 `java.lang.IllegalThreadStateException`。\n\n**Q5：假设你被要求通过实现\
  \ `Runnable` 接口或扩展 `Thread` 类来开发自定义线程，倾向于哪一种？为什么？**\n\n**答案：** 总是建议通过实现 `Runnable`\
  \ 接口编写自定义线程，这样你可以实现更好的解耦。如果你通过扩展 `Thread` 类开发，就限制了 Java 的单继承机制。\n\n`yield()`：使用\
  \ `yield()`，当 CPU 调度器遵循基于优先级的算法时，它会对处于就绪状态的线程提供优先级。但在开发线程时并不建议使用 `yield()`。\n\n\
  ## 17.5 线程生命周期\n\n众所周知每个线程都会被处理。\n\n## 1) 启动到就绪\n\n当我们启动线程时，它会进入就绪状态。\n\n## 就绪到运行\n\
  \n当我们启动线程时，它会进入就绪状态。\n\n**注意**\n\n当我们启动线程时意味着直接进入运行状态。\n\n## 运行状态\n\nCPU 调度器实现了许多不同的算法，但我们不知道当前运行的是哪种算法，因此线程进入运行状态。运行状态意味着执行指定的任务或获得\
  \ CPU 时间。\n\n**Q6：`run()` 到底什么时候被调用？**\n\n**答案：** `run()` 在启动线程时被调用，每当 CPU 调度器为该线程分配\
  \ CPU 时间时，它会被自动调用。\n\n**Q7：我可以显式调用 `run()` 吗？**\n\n**答案：** 是的，我们可以显式调用 `run()`，但这样做没有意义，因为根据\
  \ `JLS`（Java 语言规范），`run()` 会在线程获得 CPU 时间时被自动调用。\n\n**Q8：假设两个线程处于就绪状态且优先级相同，恰好 CPU\
  \ 调度器正在处理基于优先级的调度算法，那么这两个线程中哪一个会被处理？**\n\n**答案：** 在这种情况下，当多个线程进入调度算法时，它会尝试切换到另一种调度算法。基于此可以处理某些特定的线程。\n\
  \n 2) 如果线程处于运行状态，当我们调用指定某些参数的 `sleep()` 时，该运行线程将进入睡眠状态持续指定的时间，在睡眠期间没有人可以中断该线程。完成睡眠后，线程会自动移动到就绪运行状态并等待\
  \ CPU 时间。\n\n`public static void sleep(long) throws InterruptedException`\n\n`public\
  \ static void sleep(long, int) throws InterruptedException`\n\nSleep (long) 以毫秒表示的时间。\n\
  \n`sleep()` 位于 `Thread` 类中。当你调用此方法时，指定的线程将进入睡眠状态持续指定的时间，在此段时间内线程无法被打扰。\n\n\n\n\n\
  在 `sleep()` 的情况下，第一个 `long` 参数将被视为毫秒，第二个 `int` 参数被视为纳秒，通过相加毫秒和纳秒得到的最终时间为睡眠持续时间，完成该时长后，它将移动到运行状态。为了重新获得\
  \ CPU 时间，它必须遵循 CPU 调度器。\n\n# 4)\n\n![](img/360.jpg)\n\n## 当线程移动到等待状态时，你应该记住以下几点：\n\
  \n* `Wait()`：当一个线程处于运行状态且对该线程调用 `wait()` 时，该线程将移动到等待状态。\n* `Wait()`：当你在不带参数的情况下调用\
  \ `wait` 时，线程将进入等待状态，并持续不指定的时间，直到你调用 `notify()` 或 `notifyAll()` 为止。\n* `Wait(long)`：然后该运行线程将进入等待状态并持续指定的时间，一旦指定的持续时间完成，线程将自动移动到就绪待运行状态。但如果你想在指定的持续时间完成之前将等待线程移动到就绪运行状态，你可以通知该线程进入就绪运行状态。\n\
  * `Wait(long, int)`：当你调用方法 `(long, int)` 毫秒和纳秒时，通过相加该时长得到的最终时间将会在等待状态中等待，完成时间持续后，它将自动移动到就绪运行状态。\n\
  \n### Q9：我可以在给定时间持续完成之前通知等待的线程吗？\n\n**Ans：** 是的，我们可以通过使用 `notify()` 和 `notifyAll()`\
  \ 做到。我们可以将线程移动到就绪运行状态。\n\n### Q10：我可以要求特定的线程等待或睡眠吗？\n\n**Ans：** 不可以，我们不能要求任何线程等待或睡眠，因为没有这种类型指定来说明哪个线程正在处理中。\n\
  \n### Q 11：假设有以下处于等待状态的线程，例如 t1, t2, t3, t4。我可以通知其中的某一个特定线程吗？\n\n**Ans：** 不可以，我们不能。\n\
  \n`notify()`：`notify()` 用于通知处于等待状态时间最长的线程。\n`notifyAll()`：当我们使用 `notifyAll()` 时，所有处于等待状态的线程将按照特定的顺序移动到就绪运行状态，等待时间最长的先移动。\n\
  \n# 5)\n\n当线程为了处理某些任务而移动到运行状态，或者当线程请求任何特定资源而该资源不可用时，线程将移动到阻塞状态，直到请求的资源可用。处于阻塞状态的线程只有在请求的资源可用时才会移动到就绪运行状态，在这种情况下也可能导致死锁条件。\n\
  \n![](img/361.jpg)\n\n# 死锁条件\n\n假设一种情况：有两个线程 `t1` 和 `t2` 分别持有资源 `R1` 和 `R2`。线程 `t1`\
  \ 正在请求资源 `R2`，线程 `t2` 正在请求资源 `R1`。线程 `t1` 只在获得资源 `R2` 后才会释放资源 `R1`，而线程 `t2` 只有在获得资源\
  \ `R1` 后才会释放 `R2`。\n\n![](img/362.jpg)\n\n# 6 )\n\n![](img/362a.jpg)\n\n当我们调用 `destroy()`\
  \ 或 `stop()` 时，该线程将移动到死亡状态，一旦线程死亡它就无法重启，或者一旦线程移动到死亡状态，它就不能再次回到就绪运行状态。当某些任务分配给线程时，如果该线程完成了任务，线程将自动移动到死亡状态。\n\
  \n`Join()`：当使用 `join()` 方法并针对特定线程调用此方法时，当前运行的线程将移动到等待状态，并为我们调用 `join()` 的线程提供运行的机会。\n\
  `Join(long)`：当我们通过提供参数或指定参数调用 `join()` 时，该线程将等待指定的时间以完成运行线程，并在之后立即将移动到等待状态。\n\n\
