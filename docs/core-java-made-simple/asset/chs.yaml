  \ 并返回 `Future` 对象。可以提交多个 `Runnable` 对象并返回 `Future` 对象。此外，还有用于关闭 `ExecutorService`\
  \ 以及允许或禁止已提交任务完成的方法。\n\n线程池允许创建一个具有预定义大小的可复用线程池，以并发执行任务。\n\nfork/join 框架被添加到 Java\
  \ 7 中，以支持硬件并行。它的目的是将较大的任务拆分为可以并行执行的小型任务，并在完成后合并各个任务的结果。\n\nfork/join 框架通过评估待执行任务的大小来工作：如果任务不够大无法拆分，则将按顺序执行；如果足够大，则会拆分任务直到它们小到可以顺序执行为止。\n\
  \n当每个任务完成后，结果将合并回分生该线程的线程。\n\n`ForkJoinPool` 是 fork/join 框架的一个具体实现，实现了 `ExecutorService`\
  \ 接口。fork/join 框架维护一个提交用于执行的任务队列，但实现了工作窃取算法。一旦某个线程队列中不再有任何任务，它将从其他线程队列中窃取任务。这防止了等待线程的阻塞。\n\
  \n在使用 fork/join 框架时，任何必须进行处理的用户自定义类都应该扩展抽象类 `ForkJoinTask`，以便在 `ForkJoinPool` 中执行。\n\
  \n`ForkJoinTask` 被两个类扩展 - `RecursiveAction` 用于不返回结果的计算，`RecursiveTask` 用于返回结果的计算。\n\
