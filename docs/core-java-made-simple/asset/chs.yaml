  );\n    }\n}\n```\n\n# 第 16 章\n\n## 异常处理 (Exception Handling)\n\n## 16.1 引言\n\n\
  当你编写任何 Java 程序时，你可能会遇到以下类型的问题：\n\n1.  **错误 (Error)**\n2.  **异常 (Exception)**\n\n\
  **1. 错误 (ERROR)：** 主要有以下类型的错误：\n\n### a. 编译时错误 (Compile-time error)\n\n*   在编译时错误的情况下，如果存在任何语法错误，则它被称为编译时错误，将在编译期间被识别。\n\
  *   编译时错误表明编译器在不修正这些错误的情况下，无法编译该特定程序。\n\n### b. 运行时错误 (Runtime Error)\n\n*   在 JVM\
  \ 帮助下于运行时识别出的错误被称为运行时错误。\n*   运行时错误显示了 JVM 的低效率。\n\n**例如：**\n\n*   不存在 main 方法（编译器可以在没有\
  \ main 方法的情况下编译）。\n*   如果识别出任何栈内存相关问题，将表示为 `java.lang.StackOverflowError`（JVM 处理所需的内存）。\n\
  \n## 16.2 异常 (Exception)\n\n*   程序运行过程中发生的某些意外操作被称为异常。\n\n\n\n\n\n*   异常分为两种类型：\n\
  \    1. 编译时异常 / 检查异常 (Checked exception)\n    2. 运行时异常 / 未检查异常 (Unchecked exception)\n\
  \n# 示例\n\n```java\nclass Jtc103{\n    public static void main(String arg[]){\n \
  \       System.out.println(“in Jtc103”);\n        int i=Integer.parseInt(arg[0]);\n\
  \        int i1=10/i; \n        System.out.println(i1);\n    }\n}\n```\n\n```java\n\
  /* errors:\n1. java Jtc103 (enter)\n    In Jtc103\n    Exception in thread “main”\n\
  \    Java.lang.ArrayIndexOutOfBoundsException : 0\n\n2. java Jtc103 abc (enter)\n\
  \    In Jtc103\n    Exception in thread “main”\n    java.lang.NumberFormatException\
  \ : for input string “abc”\n\n3. java Jtc103 0 (enter)\n    in Jtc103\n    Exception\
  \ in thread “main”\n    java.lang.ArithmeticException : 1 by zero */\n```\n\n* \
  \  对于所有类型的异常和错误，`java.lang.Throwable` 是父类型。\n*   对于所有类型的异常，`java.lang.Exception`\
  \ 是父类。\n*   对于所有类型的运行时异常 (Runtime Exceptions)，`java.lang.RuntimeException` 是父类。\n\
  \n![](img/321.jpg)\n\n# 示例\n\n```java\nclass Jtc104{\n    public static void main(String\
  \ arg[]){\n        System.out.println(“in Jtc104”);\n        try{\n            int\
  \ i=Integer.parseInt(arg[0]);\n            int i1=10/i;\n            System.out.println(i);\n\
  \        }\n        catch(Exception e){\n            System.out.println(“in catch…\
  \ ”);\n            if(e instanceof ArrayIndexOutOfBoundsException){\n          \
  \      System.out.println(“plz provide the value..”+e);\n            }\n       \
  \     else if(e instanceof NumberFormantException){\n                System.out.println(“plz\
  \ provide numeric value..”+e);\n            }\n        }\n    }\n}\n```\n\n# 输出：\n\
  \n1.  `java Jtc104` (enter)\n    in Jtc104\n    in catch…\n    plz provide the value..:ArrayIndexOutOfBoundsException:0\n\
  2.  `java Jtc104 2abc` (enter)\n    in Jtc104\n    in catch…\n    plz provide numeric\
  \ value..:NumberFormatException:for input string “2abc”\n\n![](img/322.jpg)\n\n\
  # 工作原理\n\n*   当识别出任何问题时，JVM 将在内部执行以下操作：\n    1. 如果识别出任何问题，控制权立即转移到 JVM。\n    2.\
  \ 现在，JVM 将识别问题的具体类型。\n    3. 在识别出具体类型后，它将创建该对象并将其抛给程序。\n    4. 在程序中，它将尝试寻找匹配的 catch\
  \ 块。\n    5. 如果找到了匹配的 catch 块，则将处理相应的 catch 块。\n\n# 16.2.1 通过编写多个 try 和 catch 来处理异常\n\
  \n1.  将你想监控的代码段封装在 `try` 块中。\n2.  编写与该 `try` 关联的具有适当异常类型的 `catch` 块。\n3.  通过使用 `catch`，你一次只能处理一个异常。\n\
  4.  你可以编写多个与 `try` 关联的 `catch` 来处理多种类型的异常。\n\n*   ****在编写多个 try 和 catch 时，请记住以下几点**\n\
  \    1.  `try` 和 `catch` 之间不能有任何语句。\n    2.  `catch` 和 `catch` 之间不能有任何语句。\n    3.\
  \  你可以写不带 `catch` 的 `try`，但不能写不带 `try` 的 `catch`。\n    4.  当你编写 `catch` 块时，`catch`\
  \ 参数应该是子类到父类的类型。它不能有从父类到子类的参数。\n\n# 示例\n\n```java\npackage com.jtc.p1;\n\npublic\
  \ class Jtc105{\n    public static void main(String arg[]){\n        int i1=10;\n\
  \        try{\n            int i2=Integer.parseInt(arg[0]);\n            int ii=i1/i2;\n\
  \        }\n        /*catch(exception e){ … }\n        Catch(Throwable e){ … }\n\
  \        */\n        Catch(NumberFormatException e){\n            System.out.println(“plz\
  \ provide number value… ”+e);\n        }\n        catch(ArithmeticException e){\n\
  \            System.out.println(“plz provide non zero value… ”+e);\n        }\n\
  \        catch(ArrayOutOfBoundsException e){\n            System.out.println(“plz\
  \ provide some value… ”+e);\n        }\n        catch(NullPointerException e){\n\
  \            System.out.println(“trying exception type… ”+e);\n        }\n     \
  \   catch(Exception e){\n            System.out.println(“boss of all exceptions…\
  \ ”+e);\n        }\n    }\n}\n```\n\n# 示例\n\n```java\npackage com.jtc.p2;\n\npublic\
  \ class Jtc106{\n    public static void main(String arg[]){\n        int i1=10;\n\
  \        try{\n            int i2=Integer.parseInt(arg[0]);\n            int ii=10/i2;\n\
  \        }\n        catch(Exception e) {\n            System.out.println(“in catch”);\n\
  \        }\n    }\n}\n```\n\n*   `java.lang.Exception` 是所有异常的父类。\n*   对于所有类型的运行时异常，`java.lang.RuntimeException`\
  \ 是父类。\n*   多个 `try` 和 `catch` 允许处理多种异常。\n*   `catch` 必须是从子类到父类的顺序。\n*   `finally`\
  \ 块可以跟在 `try` 后面（没有 `catch`），也可以跟在 `catch` 后面。\n*   `catch` 块必须按照子类到父类的顺序排列。\n*\
  \   `finally` 块在异常未被捕获的情况下，都会在 `return` 之前执行。\n\n## 16.3 Finally 块\n\n*   每当识别出任何问题时，控制权立即转移到\
  \ JVM。\n*   无论是否捕获了异常，`finally` 块都会执行。\n*   如果在 `try` 或 `catch` 中存在 `return` 语句，`finally`\
  \ 块会在方法实际返回之前执行。\n*   如果调用了 `System.exit()`，`finally` 块将不会执行。\n\n# 示例\n\n```java\n\
  package com.jtc.p3;\n\nclass Hello{\n    int m1(){\n        System.out.println(“m1\
  \ in Hello”);\n        try{\n            int x=10/0;\n            return 10;\n \
  \       }\n        catch(Exception e){\n            System.out.println(“in catch\
  \ m1”);\n            e.printStackTrace();\n            return 20;\n        }\n \
  \       finally{\n            System.out.println(“in finally”);\n            return\
  \ 30;\n        }\n    }\n\n    int m2(int a){\n        System.out.println(“m2 in\
  \ Hello”);\n        try{\n            int x=10/a;\n            System.out.println(“in\
  \ try”);\n            return 10;\n        }\n        catch(ArithmeticException e){\n\
  \            System.out.println(“in catch m2”);\n            e.printStackTrace();\n\
  \            return 20;\n        }\n        finally{\n            System.out.println(“in\
  \ finally”);\n            return 30;\n        }\n    }\n}\n\npublic class Jtc107{\n\
  \    public static void main(String arg[]){\n        Hello h1=new Hello();\n   \
  \     h1.m1();\n        h1.m2(Integer.parseInt(arg[0]));\n    }\n}\n```\n\n# 使用\
  \ finally 块的示例\n\n```java\nclass Window{\n    public Window(){\n        System.out.println(“Open\
  \ Window”);\n    }\n    public void close(){\n        System.out.println(“close\
  \ window”);\n    }\n}\n\nclass Door{\n    Door(){\n        System.out.println(“open\
  \ door”);\n    }\n}\n```\n\n\n\n\n\n```java\npublic void close(){\n    System.out.println(“close\
  \ door”);\n}\n\nclass UseRes{\n    int m1(){\n        Door dr=null;\n        Window\
  \ wn=null; \n        try{\n            dr=new Door();\n            wn=new Window();\n\
  \            System.out.println(“perform your task”);\n        }\n        catch(Exception\
  \ e){\n            e.printStackTrace();\n        }\n        finally{\n         \
  \   dr.close();\n            wn.close();\n        }\n        return 20;\n    }\n\
  }\n\nclass Jtc109{\n    public static void main(String arg(){\n        UseRes ur=new\
  \ UseRes();\n        ur.m1();\n    }\n}\n```\n\n# 自动关闭资源接口（来自 JDK1.7）\n\n```java\n\
  class Window implements AutoCloseable{\n    public Window(){\n        System.out.println(“Open\
  \ Window”);\n    }\n    public void close(){\n        System.out.println(“Close\
  \ Window”);\n    }\n}\n\nclass Door implements AutoCloseable{\n    Door(){\n   \
  \     System.out.println(“Open Door”);\n    }\n    public void close(){\n      \
  \  System.out.println(“Close Door”);\n    }\n}\n\npublic class Jtc110{\n    public\
  \ static void main(String arg[]){\n        try(Door dr=new Door();\n        Window\
  \ wn=new Window()){\n            System.out.println(“Use Resource”);\n        }\n\
  \        catch(Exception e){\n            e.printStackTrace();\n        }\n    }\n\
  }\n```\n\n# 更多示例\n\n```java\nimport java.io.*;\n\npublic class Jtc111{\n    public\
  \ static void main(String arg[]){\n        System.out.println(“in main”);\n    \
  \    try(FileOutputStream fos=new FileOutputStream(“abc.txt”);\n        BufferedOutputStream\
  \ bos=new BufferedOutputStream(fos);\n        DataOutputStream dos=new DataOutputStream(bos))\n\
  \        {\n            dos.writeUTF(“HELLO JTC”);\n        }\n        catch(Exception\
  \ e){\n            e.printStackTrace();\n        }\n    }\n}\n```\n\n```java\nimport\
  \ java.io.*;\n\npublic class Jtc112{\n    public static void main(String arg[]){\n\
  \        FileOutputStream fos=null;\n        BufferedOutputStream bos=null;\n  \
  \      DataOutputStream dos=null;\n        try{\n            fos=new FileOutputStream“abc.txt”);\n\
  \            bos=new BufferedOutputStream(fos);\n            dos=new DataOutputStream(bos);\n\
  \            dos.writeUTF“HELLO JTC STUDENTS”);\n        }\n        catch(Exception\
  \ e){\n            e.printStackTrace();\n        }\n        finally{\n         \
  \   try{\n                fos.close();\n                bos.close();\n         \
  \       dos.close();\n            }\n            catch(Exception e){\n         \
  \   }\n        }\n    }\n}\n```\n\n- 如果你想开发自定义的资源，请通过实现 `AutoCloseable` 接口来编写你的资源类。\n\
  - `AutoCloseable` 接口中只有一个方法，即 `close()`。\n- 根据资源需求，必须在你的类中重写该 `close()` 方法。\n- 如果你在\
  \ `try with resource` 语句中使用资源，那么你的资源必须实现 `AutoCloseable` 接口，否则将导致编译时错误。\n- 如果我们使用\
  \ `try with resource` 且它满足所有约束条件，则不需要编写任何 `finally` 块，你可以轻松地完成。\n\n## 16.4 异常的类型\n\
  \n- 异常主要分为两种：\n    1. 检查异常 (Checked exception) / 编译时异常\n    2. 非检查异常 (Unchecked\
  \ exception) / 运行时异常 (Runtime exception)\n\n# 检查异常或编译时异常\n\n- 在编译时被编译器捕获或由编译器捕获的异常称为编译时异常。\n\
  - 此外，除 `java.lang.RuntimeException` 以外的 `java.lang.Exception` 的子类都称为编译时异常。\n- **注意：**\n\
  \    编译时异常分为两种：\n    1. 用户定义\n    2. 内置类型\n- 编译时异常必须通过编写 `try` 和 `catch` 或者通过传播来被处理或报告。\n\
  - 例如：`java.lang.IOException`、`FileNotFoundException`、`SQLException`、`JSPException`。\n\
  \n# 非检查异常或运行时异常\n\n- `java.lang.RuntimeException` 的子类称为非检查异常或运行时异常。\n- 这些异常将由 JVM\
  \ 调用。\n- 它不需要通过编写 `try` 和 `catch` 或通过传播来报告。即使你想处理，也可以处理它。\n- **运行时异常也分为两种：**\n \
  \   **用户定义：** 根据应用程序需求由开发者创建的异常称为用户定义异常。例如：`InsufficientFoundException`、`AccountNumberDoesNotExist`。\n\
  \    **内置：** 技术厂商提供的异常称为内置异常。这些也可以是检查和非检查类型。例如：`ServletException`、`JSPException`、`EJBException`。\n\
  \n# 编写自定义异常的步骤\n\n1. 通过扩展 `java.lang.Exception` 或 `java.lang.RuntimeException` 来编写你的异常类。\n\
  2. 在异常类内部声明一些实例变量。\n3. 在异常类内部编写默认构造函数。\n4. 如果需要，编写一个带参数的构造函数。\n5. 重写 `toString()`\
  \ 方法（内部会调用 `getMessage()` 方法）。\n6. 重写 `getMessage()` 方法（它在 `throwable` 类内部可用，并提供异常的具体原因）。\n\
  \n# `printStackTrace()` 提供以下信息\n\n=> 异常的类型\n=> 异常的原因\n=> 异常的位置\n\n- 异常被传递到下一层\n\
  => 异常的类型\n\n- 使用 `throw` 将异常传递到下一层\n* 检查异常必须通过 `try` 和 `catch` 块处理\n* 或者传递\n* 非检查异常由\
  \ JVM 处理\n\n# 示例\n\n```java\nclass InvalidAcc extends RuntimeException{\n}\n\npublic\
  \ class Jtc13{\n    public static void main(String arg[]){\n        try{\n     \
  \       int i=Integer.parseInt(arg[0]);\n        }\n        catch(Exception e){\n\
  \            e.printStackTrace();\n        }\n    }\n}\n```\n\n```java\nimport java.io.IOException;\n\
  import java.sql.SQLException;\n\nclass Hello{\n    void m1(int a) throws ArithmeticException{\n\
  \        System.out.println(“in m1”);\n        throw new ArithmeticException();\n\
  \    }\n    void m2(boolean b) throws IOException,InstantiationException{\n    \
  \    System.out.println(“in m2”);\n        if(!b){\n            throw new IOException();\n\
  \        }\n        else{\n            throw new InstantiationException();\n   \
  \     }\n    }\n    void m3(){\n        System.out.println(“in m3”);\n        try{\n\
  \            throw new SQLException();\n        }\n        catch(SQLException e){\n\
  \        }\n    }\n    void m4() throws IOException{\n        System.out.println(“in\
  \ m4”);\n        try{\n            m2(true);\n        }\n        catch(InstantiationException\
  \ e){\n        }\n    }\n    void m5(){\n        System.out.println(“in m5”);\n\
  \        m3();\n    }\n}\n\npublic class Jtc14{\n    public static void main(String\
  \ arg[]) throws IOException{\n        Hello h1=new Hello();\n        h1.m4();\n\
  \        h1.m5();\n    }\n}\n```\n\n## 16.5 “throw”关键字\n\n- `throw` 关键字用于从方法体中抛出异常。\n\
  - 如果你抛出任何非检查异常，并没有硬性规定必须通过 `try` 和 `catch` 或传播来报告它。\n- 但始终建议使用 `try` 和 `catch` 在方法体中处理\
  \ `throw`。\n\n**语法**\n\n```java\nvoid m1(){\n    ArithmeticException ae=new ArithmeticException();\n\
  \    throw ae;\n} OR\nvoid m1(){\n    throw new ArithmeticException();\n}\n```\n\
  \n![](img/ent.jpg) 如果你从方法体中抛出任何检查异常，你必须通过编写 `try` 和 `catch` 或在方法头部传播来报告该异常。\n\n\
  ## 16.6 “throws”关键字\n\n- `throws` 用于从方法头部抛出异常。\n- 每当你通过编写 `throws` 关键字抛出任何异常时，意味着你正在指导方法的调用者以自己的方式来报告异常（即通过使用\
  \ `try` 和 `catch` 或通过传播）。\n- 如果你抛出任何检查异常，方法的调用者必须通过编写 `try` 和 `catch` 或通过传播来报告该异常。\n\
  - 如果你没有这样做，会导致编译错误。\n- 如果你通过编写 `throws` 关键字抛出任何非检查异常，你可以处理也可以不处理它。\n- 如果你不处理它，它将由\
  \ JVM 自动处理。\n\n（ eg: void m1() throws IOException\n\n{\n\ntry{\nthrow new IOException();\n\
  }\n\ncatch(Exception e){\n//…\n}\n}\n```\n\n\n\n同时使用 `throws` 和 `throw` 不会导致任何编译错误，但\
  \ `m1()` 的调用者必须通过使用 `try` 和 `catch` 或通过向上传播来报告 `IOException`。\n\n- **注意：** 始终建议使用\
  \ `try` 和 `catch` 处理异常。\n\n# 示例\n\n```java\nimport java.io.FileNotFoundException;\n\
