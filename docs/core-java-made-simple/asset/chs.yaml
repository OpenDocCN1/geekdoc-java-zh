  \n# 18.11 addElements()\n\n通过使用 `addElenents()`，我们可以向那些重构并包含在集合框架中的旧版类添加元素。因为 `addElements()`\
  \ 用于将元素添加到旧版类中。`addElements()` 和 `add()` 之间的处理顺序没有区别。\n\n# 18.12 Timer 和 TimerTask\n\
  \n- `TimerTask` 是一个实现 `Runnable` 接口的抽象类。\n- `TimerTask` 类位于 `java.util` 包中。\n- `TimerTask`\
  \ 类没有它自己的抽象方法。它只是拥有 `Runnable` 接口的抽象方法，该方法没有在 `TimerTask` 类内部被重写。这留给了开发者相应地编写 `run()`\
  \ 方法实现。\n- `Timer` 类：它是 `java.util` 包中的一个类。\n- `Timer` 类有许多方法可以相应地调度任务。\n- 这两种情况将用于相应地调度任务。\n\
  \n# 18.13 方法\n\n`addElements()`：通过使用 `addElement()`，我们可以向那些重构并包含在集合框架中的旧版类添加元素。因为\
  \ `addElement` 用于将元素添加到旧版类中。\n`addElement()` 和 `add()` 之间的处理顺序没有区别。\n\n## 方法\n\n\
  - `public void Schedule(TimerTask task,Date time);`\n- `public void Schedule(TimerTask\
  \ task,Date firstTime,long period);`\n- `public void Schedule(TimerTask task,long\
  \ delay);`\n- `public void Schedule(TimerTask task,long delay,long period);`\n-\
  \ `public void ScheduleAtFixedRate(TimerTask task,long delay,long period);`\n- `public\
  \ void ScheduleAtFixedRate(TimerTask task,Date firstTime,long period);`\n\n## schedule\
  \ 方法的内部实现\n\n### 示例\n\n```java\nimport java.util.*;\n\nclass Reminder {\n    Timer\
  \ timer;\n\n    public Reminder(int seconds) {\n        timer = new Timer();\n \
  \       timer.schedule(new RemindTask(), seconds * 1000); \n    }\n    class RemindTask\
  \ extends TimerTask {\n        public void run() {\n            System.out.println(“Time's\
  \ up!”);\n            timer.cancel();\n        }\n    }\n}\n\npublic class Jtc13\
  \ {\n    public static void main(String args[])\n    {\n        System.out.println(“About\
  \ to schedule task.”);\n        new Reminder(5);\n        System.out.println(“Task\
  \ scheduled.”);\n    }\n}\n```\n\n如果定时器任务执行线程意外终止，例如因为它的 stop 方法被调用，任何进一步尝试都会抛出\
  \ `IllegalStateException`，就像定时器的 cancel 方法被调用一样。\n\n# 18.13.1 Stack\n\n- 它是 `Vector`\
  \ 的子类。\n- 每需要后进先出 (LIFO) 顺序时，我们应该使用 `Stack`。`Stack s= new Stack();`\n\n## Stack\
  \ 中的方法\n\n`Object push(Object o);`\n将对象插入到栈中。\n\n`Object pop();`\n移除并返回栈顶元素。\n\n\
  `Object peek();`\n返回栈顶元素但不移除。\n\n`boolean empty();`\n如果 `Stack` 为空则返回 true。\n\n\
  `Int search(Object o);`\n如果元素可用则返回偏移量，否则返回“-1”\n\n# 18.13.2 空值接受性\n\n对于 `TreeSet`，如果尝试插入\
  \ null，会抛出 `NullPointerException`。但 `HashMap` 允许 null key。\n\n## 示例\n\n```java\n\
  import java.util.*;\n\nclass Reminder {\n    Timer timer;\n\n    public Reminder(int\
  \ seconds) {\n        timer = new Timer();\n        timer.schedule(new RemindTask(),\
  \ seconds * 1000); \n    }\n    class RemindTask extends TimerTask {\n        public\
  \ void run() {\n            System.out.println(“Time's up!”);\n            timer.cancel();\n\
  \        }\n    }\n}\n\npublic class Jtc13 {\n    public static void main(String\
  \ args[])\n    {\n        System.out.println(“About to schedule task.”);\n     \
  \   new Reminder(5);\n        System.out.println(“Task scheduled.”);\n    }\n}\n\
  ```\n\n- 注意：如果 `TreeSet` 类没有实现 `Comparable`，则抛出 `ClassCastException`。\n- 只有当类实现了\
  \ `Comparable` 时，才能进行自然排序排序。\n- 如果没有实现 `Comparable`，会抛出 `ClassCastException`。\n\
  - 只有当类实现了 `Comparable` 时，才能进行 `自然 `。\n\n# 18.14 Entry\n\n每个键值对都被视为 entry。在 `Map`\
  \ 内部，entry 是这样定义的。\n\n# 18.15 IdentityHashMap\n\n- 与 `HashMap` 基本相同，但区别在于：\n- 在\
  \ `HashMap` 的情况下，它使用 `equals()` 方法来识别重复键。\n- 在 `IdentityHashMap` 的情况下，它使用 `==` 来识别重复键。\n\
  - 因此在 `IdentityHashMap` 中，即使两个对象相等，如果它们不是同一个实例，也不会被视为相同的键。\n\n## 示例\n\n```java\n\
  import java.util.*;\n\nclass HashMapDemo{\n    public static void main(String args){\n\
  \        HashMap m=new HashMap();\n        Integer i1=new Integer(10);\n       \
  \ Integer i2=new Integer(10);\n        m.put(i1,”som”);\n        m.put(i2,”prakash”);\n\
  \        System.out.println(m);\n    }\n}\n```\n\n在上面的程序中 `i1` 和 `i2` 是重复键，因为 `i1.equals(i2)`\
  \ 返回 true。\n如果将 `HashMap` 替换为 `IdentityHashMap`，则 `i1` 和 `i2` 将不是重复键，因为 `i1==i2`\
  \ 为 false。输出为 `{10=som, 10=prakash}`。\n\n# 18.16 WeakHashMap\n\n- 与 `HashMap` 基本相同，但区别在于：\n\
  - 在普通 `HashMap` 的情况下，即使对象没有任何引用，它也不会被垃圾回收。\n- 在 `WeakHashMap` 的情况下，如果对象没有任何引用，它总是可以被垃圾回收的。\n\
  \n## 示例\n\n```java\nimport java.util.*;\n\nclass WeakHashMapDemo{\n    public static\
  \ void main(String[] args)throws Exception { \n        WeakHashMap m=new WeakHashMap();\n\
  \        Temp t=new Temp();\n        m.put(t,”som”);\n        System.out.println(m);\n\
  \        t=null;\n        System.gc();\n        Thread.sleep(5000);\n        System.out.println(上面的程序中，由于\
  \ `t` 被置为 `null`，所以 `Temp` 对象可以被回收，因此 `m` 输出为空 `{}`。);\n    }\n}\n\nclass Temp{\n\
  \    public String toString(){\n        return “Temp”;\n    }\n    public void finalize(){\n\
  \        System.out.println(“finalize() 方法调用”);\n    }\n}\n```\n\n# 18.17 SortedMap\n\
  \n- 它是 `Map` 的子接口。\n- 如果我们需要根据键的某种排序顺序来表示一组键值对，我们应该选择 `SortedMap`。\n- 排序仅基于键进行，而不基于值。`SortedMap`\
  \ 接口定义了以下 6 个特定方法。\n\n\n\n\n\n*   `Object firsyKey();`\n*   `Object lastKey();`\n\
  *   `SortedMap headMap(Object key);`\n*   `SortedMap tailMap(Object key);`\n*  \
  \ `SortedMap subMap(Object key1,Object key2);`\n*   `Comparator comparator();`\n\
  \n# 18.18 Properties\n\n`Properties` 类是 `Hashtable` 的子类。\n\n* 在我们的程序中，对于像 `DBUserName`、`Password`\
  \ 等频繁变化的值，不建议将此类值硬编码在 Java 应用程序中，因为每次更改都必须重新编译、构建和部署应用程序，甚至还需要重启服务器，这会对客户产生巨大的业务影响。\n\
  * 这类变量我们必须将其硬编码在属性文件中，并从属性文件中读取值到 Java 应用程序中。\n* 这种方法的主要优点是，如果属性文件发生任何更改，这些更改会自动对\
  \ Java 程序生效，只需重新部署即可。\n* 通过使用 `Properties` 对象，我们可以从属性文件中读取并保持属性在 Java 程序中。\n\n`Properties\
  \ p=new Properties();`\n\n在属性中，键和值“都应该是 String 类型”。\n\n# Properties 类中的方法\n\n`String\
  \ getPrperty(String propertyname);`\n\n返回与指定属性关联的值。\n\n`String setproperty(String\
  \ propertyname,String propertyvalue);`\n\n设置新属性。\n\n`Enumeration propertyNames();\
  \ void load(InputStream is);`\n\n// 可以传递任何 `InputStream`。用于从属性文件加载属性到 Java `Properties`\
  \ 对象中。\n\n`void store(OutputStream os,String comment);`\n\n// 可以传递任何 `OutputStream`。用于将\
  \ `Properties` 对象中的属性存储到属性文件中。\n\n# Example\n\n```java\nimport java.util.*;\nimport\
  \ java.io.*;\n\nclass PropertiesDemo{\n    public static void main(String[] args)throws\
  \ Exception{\n        Properties p=new Properties();\n        FileInputStream fis=new\
  \ FileInputStream(“abc.properties”);\n        p.load(fis);\n        System.out.println(p);\n\
  \        String s=p.getProperty(“som”);\n        System.out.println(s);//8888 p.setProperty(“abh”,”9999999”);\n\
  \        Enumeration e=p.propertyNames();\n        while(e.hasMoreElements()){\n\
  \            String s1=(String)e.nextElement();\n            System.out.println(s1);\n\
  \        }\n        FileOutputStream fos=new FileOutputStream(“abc.properties”);\n\
  \        p.store(fos,”updated by som”);\n    }\n}\n```\n\n# Example\n\n```java\n\
  import java.util.*;\nimport java.io.*;\n\nclass PropertiesDemo{\n    public static\
