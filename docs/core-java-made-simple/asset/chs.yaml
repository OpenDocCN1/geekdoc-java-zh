  \       if (str.equals(\"*\")) break;\n            }\n        }\n        System.out.printf(\"\
  Sum of given %d numbers id %f\", count, sum);\n    }\n}\n```\n\n## 示例\n```java\n\
  import java.io.FileReader;\nimport java.io.FileWriter;\nimport java.util.Scanner;\n\
