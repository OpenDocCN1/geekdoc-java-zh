  \n包装类的主要目标是：\n\n* 将基本类型封装成对象形式，以便我们可以像处理对象一样处理基本类型。\n* 为基本类型所需的若干实用函数定义。\n* 几乎所有的包装类都定义了以下两个构造函数：一个可以接受对应的基本类型作为参数，另一个可以接受\
  \ String 作为参数。\n\n### 示例\n\n`Integer i=new Integer(10);`\n\n`Integer i=new Integer(“10”);`\n\
  \n如果 `String` 格式不正确（即如果它不代表数字），我们将得到一个名为“NumberFormatException”的运行时异常。\n\n### 示例\n\
  \n```java\nclass WrapperClassDemo{\n    public static void main(String[] args)throws\
  \ Exception{\n        Integer i=new Integer(“ten”);\n        System.out.println(i);//NumberFormatException\n\
  \    }\n}\n```\n\n`Float` 类定义了三个带有 `float`、`String` 和 `double` 参数的构造函数。`Float f=new\
  \ Float (10.5f);`\n\n`Float f=new Float (“10.5f”);`\n\n`Float f=new Float(10.5);`\n\
  \n`Float f=new Float (“10.5”);`\n\n`Character` 类只定义了一个构造函数，可以接受 `char` 基本类型作为参数，没有接受\
