  \ Character(“a”);//无效`\n\n* `Boolean` 类定义了两个带有 `boolean` 基本类型和 `String` 参数的构造函数。\n\
  * 如果我们传递 `boolean` 基本类型，唯一允许的值是 `true` 和 `false`，其中字母应该是小写。\n\n### 示例\n\n`Boolean\
