  ![](img/44a.jpg)\n\n**逻辑与 (&&) 和按位与 (&) 的区别：**\n\n1. 逻辑与只能应用于关系表达式之间，而按位与既可以应用于数值表达式也可以应用于关系表达式。\n\
  \   例如：`(i1 <i2) && (i2>i1)` `(i1<i2) & (i2>i1)`\n2. 当你在两个关系表达式之间应用逻辑与(`&&`）时，如果第一个表达式返回\
  \ true，则才会求值第二个表达式，否则不会，即第二个表达式的求值取决于第一个表达式的结果。而在按位与 (`&`）的情况下，第二个表达式的求值与第一个是相互独立的。\n\
  3. 在表达式求值时，始终建议使用逻辑与(`&&`）。\n   `jtc26: java:8 error: bad operand type for binary\
