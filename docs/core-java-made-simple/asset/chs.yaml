  * 同时执行多个 `Threads` 并导致数据不一致问题就是竞态条件。\n* 我们可以使用 `synchronized` 关键字来解决竞争条件。\n\n# 17.13\
  \ ThreadLocal (1.2 v)\n\n* 我们可以使用 `ThreadLocal` 来定义特定 `Thread` 需要的本地资源，如 `DBConnections`、`counterVariables`\
  \ 等。\n* 我们可以使用 `ThreadLocal` 定义线程作用范围，如 Servlet 范围（`page`、`request`、`session`、`application`）。\n\
  \n# 17.14 线程 (GreenThread)\n\n* Java 多线程概念通过使用以下 2 模式实现：\n    * `GreenThread Model`（绿色线程模型）\n\
  \    * `Native OS Model`（原生操作系统模型）\n\n## GreenThread Model\n\n* 完全由 `JVM` 管理而不需要底层操作系统支持的线程，这类线程被称为绿色线程（Green\
  \ Threads）。\n\n## Native OS Model\n\n* 通过底层操作系统帮助管理的线程被称为原生线程（Native Threads）。\n\
  * 基于 Windows 的操作系统提供 `Native OS Model` 的支持。\n* 极少数操作系统如 `SunSolaries` 提供 `GreenThread\
  \ Model` 的支持。\n* 无论如何，`GreenThread model` 已过时，不建议使用。\n\n# 17.15 线程本地 (Thread Local)\n\
  \n* `ThreadLocal` 提供了 `ThreadLocal Variables`。\n* `ThreadLocal` 类按线程为基础维护值。\n* 每个\
  \ `ThreadLocal Object` 为每个访问该对象的 `Thread` 维护一个独立的值，如 `userID`、`transactionID` 等。\n\
  * `Thread` 可以访问其本地值，可以操作其值，甚至可以移除其值。\n* 在 `Thread` 执行的代码每个部分中，我们都可以访问其本地变量。\n\n\
  ## 示例\n\n* 考虑一个调用某些业务方法的 `Servlet`。我们需要为每个请求生成一个唯一的 `transactionID`，并且必须将此 `transactionID`\
  \ 传递给业务方法用于记录。\n* 对于此需求，我们可以使用 `ThreadLocal` 为每个请求和每个线程维护一个独立的 `transactionID`。\n\
  \n### 注意事项\n\n* `ThreadLocal` 类在 1.2 版本中引入。\n* `ThreadLocal` 可以与线程作用范围相关联。\n* 所有由\
  \ `Thread` 执行的代码都可以访问相应的 `ThreadLocal Variables`。\n* 一个 `Thread` 可以访问自己的本地变量，但无法访问其他线程的本地变量。\n\
  * 一旦 `Thread` 进入死锁状态（Dead State），所有本地变量默认都符合垃圾回收的条件。\n\n# 17.16 构造函数 (Constructor)\n\
  \n`ThreadLocaltl = new ThreadLocal();` 创建一个 `ThreadLocal Variable`。\n\n# 方法\n\n\
  1) `Object get();` 返回与当前线程关联 `ThreadLocal Variable` 的值。\n\n2) `Object initialValue();`\
  \ 返回当前线程 `ThreadLocal Variable` 的 `initialValue`。`initialValue()` 的默认实现返回 `null`。\n\
  要自定义我们的 `initialValue`，我们必须重写 `initialValue()`。\n\n3) `void set(Object newValue);`\
  \ 设置新值。\n\n4) `void remove();` 移除当前线程的本地变量值。\n`Remove` 之后如果尝试访问它，它将通过再次调用 `initialValue()`\
  \ 重新初始化。\n此方法在 1.5 版本中新增。\n\n## 示例\n\n```java\nclassThreadLocalDemo {\n    public\
  \ static void main(String[] args) {\n        ThreadLocaltl = new ThreadLocal();\n\
  \        System.out.println(tl.get()); //null\n        tl.set(\"JTC\");\n      \
  \  System.out.println(tl.get()); //JTC\n        tl.remove();\n        System.out.println(tl.get());\
  \ //null\n    }\n}\n```\n\n```java\n//Overriding of initialValue()\nclassThreadLocalDemo\
  \ {\n    public static void main(String[] args) {\n        ThreadLocaltl = new ThreadLocal()\
  \ {\n            protected Object initialValue() {\n                return \"abc\"\
  ;\n            }\n        };\n        System.out.println(tl.get()); //abc\n    \
  \    tl.set(\"JTC\");\n        System.out.println(tl.get()); //JTC\n        tl.remove();\n\
  \        System.out.println(tl.get()); //abc\n    }\n}\n```\n\n# 17.17 Java.util.concurrent.locks\
  \ 包\n\n### 传统 synchronized 关键字的问题\n\n* 如果一个 `Thread` 释放了锁，哪个等待的线程将获得该锁，我们没有任何控制权。\n\
  * 我们无法为 `Thread` 获取锁指定最大等待时间，导致它会一直等到获取锁，这可能会影响系统性能并导致死锁。\n* 我们没有在不等待的情况下尝试获取的灵活性。没有\
  \ API 可以列出等待某个锁的所有线程。\n* `synchronized` 关键字强制必须在方法内定义，无法在多个方法之间声明。\n* 为了解决上述问题，SUN\
  \ 公司在 1.5 版本中引入了 `java.util.concurrent.locks` 包。\n* 它还为程序员提供了若干增强功能，以对并发提供更多控制。\n\
  \n# 17.18 锁 (Lock)\n\n* `Lock Object` 类似于 `Thread` 在执行 `synchronized Method` 或 `synchronized\
  \ Block` 时获取的隐式锁。\n* `Lock Implementations` 比传统的隐式锁提供更广泛的操作。\n\n## Lock Interface\
  \ 的重要方法\n\n1) `void lock();` 锁定锁对象。如果 `Lock Object` 已被其他 `Thread` 锁定，它将等待直到被解锁。\n\
  \n2) `booleantryLock();` 如果锁可用则获取锁。如果 `Lock` 可用，`Thread` 获取锁并返回 `true`。如果 `Lock`\
  \ 不可用，则该方法返回 `false` 并继续执行。在这种情况下，`Thread` 永远不会阻塞。\n\n```java\nif (l.tryLock())\
  \ {\n    Perform Safe Operations\n}\nelse {\n    Perform Alternative Operations\n\
  }\n```\n\n3) `boolentryLock(long time, TimeUnit unit);`\n* 如果锁可用则获取锁。\n* 如果 `Lock`\
  \ 不可用，`Thread` 可以等待指定的时间。如果此时 `Lock` 仍不可用，`Thread` 可以继续执行。\n**例：** `if (l.tryLock(1000,\
  \ TimeUnit.SECONDS)) {}`\n\n**TimeUnit:** `TimeUnit` 是存在于 `java.util.concurrent`\
  \ 中的枚举。\n```java\nenumTimeUnit {\n    DAYS, HOURS, MINUTES, SECONDS, MILLISECONDS,\
  \ MICROSECONDS, NANOSECONDS;\n}\n```\n\n4) `void lockInterruptedly();`\n* 除非当前 `Thread`\
  \ 被中断，否则获取锁。如果锁可用则立即获取。\n* 如果不可用，线程将等待，如果被中断则不会获取锁。\n\n5 `void unlock();` 释放锁。\n\
  \n# 17.19 重入锁 (ReentrantLock)\n\n* 它实现了 `Lock Interface` 并且是 `Object` 的直接子类。\n*\
  \ 重入意味着 `Thread` 可以多次获取同一个锁而不会产生问题。\n* `ReentrantLock` 在每次调用 `lock()` 时增加线程计数，在每次调用\
  \ `unlock()` 时减少计数器，当计数达到 ‘0’ 时释放锁。\n\n1 `ReentrantLockrl = new ReentrantLock();`\
  \ 创建 `ReentrantLock` 实例。\n\n2) `ReentrantLockrl = new ReentrantLock(boolean fairness);`\n\
  * 根据给定的公平策略创建 `ReentrantLock` 实例。\n* 如果公平性为 `true`，则最长等待的线程在锁可用时可以获取锁，即遵循先先出。\n\
  * 如果公平性为 `false`，则我们无法保证哪个线程会在锁可用时获取锁。\n\n**注意：** 如果我们没有指定任何公平性属性，默认是不公平的。\n\n**以下两行代码相等？**\n\
  `ReentrantLockrl = new ReentrantLock();`\n`ReentrantLockrl = new ReentrantLock(true);`\n\
  `ReentrantLockrl = new ReentrantLock(false);`\n\n### ReentrantLock 的重要方法\n\n1. `void\
  \ lock();`\n2. `booleantryLock();`\n3. `booleantryLock(long l, TimeUnit t);`\n4.\
  \ `void lockInterruptedly();`\n5. `void unlock();` 释放锁。\n\n如果当前 `Thread` 不是 `Lock`\
  \ 的所有者，我们将得到名为 `IllegalMonitorStateException` 的运行时异常。\n\n\n\n\n6. `intgetHoldCount();`\
  \ 返回当前线程持有此锁的次数。\n\n7. `booleanisHeldByCurrentThread();` 如果且仅当锁被当前线程持有时，返回 true。\n\
  \n8. `intgetQueueLength();` 返回等待该锁的线程数。\n\n9. `Collection getQueuedThreads();` 返回一个包含等待获取锁的\
  \ Thread 对象的集合。\n\n10. `booleanhasQueuedThreads();` 如果有任何线程等待获取锁，则返回 true。\n\n11.\
  \ `booleanisLocked();` 如果锁被任何线程获取，则返回 true。\n\n12. `booleanisFair();` 如果锁的公平设置为\
  \ true，则返回 true。\n\n13. `Thread getOwner();` 返回获取锁的线程。\n\n# 示例\n\n```java\nimport\
  \ java.util.concurrent.locks.ReentrantLock;\n\nclass Test {\n    public static void\
  \ main(String[] args) {\n        ReentrantLock l = new ReentrantLock();\n      \
  \  l.lock();\n        l.lock();\n        System.out.println(l.isLocked()); //true\n\
  \        System.out.println(l.isHeldByCurrentThread()); //true\n        System.out.println(l.getQueueLength());\
  \ //0 l.unlock();\n        System.out.println(l.getHoldCount()); //1\n        System.out.println(l.isLocked());\
  \ //true l.unlock();\n        System.out.println(l.isLocked()); //false\n      \
  \  System.out.println(l.isFair()); //false\n    }\n}\n```\n\n# 程序 17.3\n\n```java\n\
