  \ 类 `binarySearch()` 方法的所有规则与 `Collections` 类 `binarySearch()` 方法完全相同。\n\n# 18.23\
  \ 将数组转换为 List\n\n`Arrays` 类定义了以下方法将数组视为 `List`。\n\n`public static List asList (Object[]\
  \ o);`\n\n严格来说，我们并没有创建一个独立的 `List` 对象，而仅仅是以 `List` 的形式来查看该数组。\n\n*   如果我们通过 `List`\
  \ 引用执行了任何更改，这些更改将自动反映到数组引用上；同理，如果我们通过数组引用执行了任何更改，这些更改将自动反映到 `List` 引用上。\n*   如果我们通过\
  \ `List` 引用尝试执行任何改变大小的操作，我们将得到一个提示为 `UnsupportedOperationException` 的运行时异常。\n* \
  \  如果我们通过 `List` 引用尝试插入异质对象，我们将得到一个提示为 `ArrayStoreException` 的运行时异常。\n\n# 示例\n\n\
  ```java\nimport java.util.Calendar;\nimport java.util.Formatter;\npublic class Jtc15\
