  此方法将此扫描器的默认基数设置为指定的基数。\n\n## Scanner 示例\n```java\nimport java.util.Scanner;\n\n\
  public class Jtc16 {\n    public static void main(String[] args) {\n        Scanner\
  \ sc = new Scanner(System.in);\n        int count = 0;\n        double sum = 0.0;\n\
  \        System.out.println(\"Enter Numbers:\");\n        while (sc.hasNext()) {\n\
