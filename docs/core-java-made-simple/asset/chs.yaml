  \    {\n        System.out.println(“Name :” + name + “: Rooms : “ + rooms + “: at\
  \ :” + location+ “:”);\n    }\n\n    static int to_int(String value)\n    {\n  \
  \      int i = 0;\n        try\n        {\n            i = Integer.parseInt(value);\n\
  \        }\n        catch(NumberFormatException e)\n        {}\n        return i;\n\
  \    }\n}\n```\n\n# FileReader 和 FileWriter\n\n`FileReader` 是 `InputStreamReader`\
  \ 的一个便利子类。当你想要从文件中读取字符时，`FileReader` 非常有用。`FileReader` 的构造函数假设了默认字符编码和缓冲区大小。`FileReader`\
  \ 构造函数使用 `InputStreamReader` 的功能，利用本地编码将字节转换为 Java 代码使用的 Unicode 字符。\n\n如果你想从一个使用默认以外编码的文件读取\
  \ Unicode 字符，你必须在 `FileInputStream` 之上构建你自己的 `InputStreamReader`。\n\n`FileWriter`\
  \ 是 `OutputStreamWriter` 的一个便利子类，用于写入字符文件。`FileWriter` 的构造函数也假设默认编码和缓冲区大小。如果你想使用默认以外的编码，必须在\
  \ `FileOutputStream` 之上创建你自己的 `OutputStreamWriter`。\n\n# 第 25 章\n\n## 缓冲 (Buffering)\n\
  \n## 25.1 什么是缓冲？\n\n向文件读写数据，每次获取一个字节是非常缓慢且辛苦的。加速过程的一种方法是给文件创建一个包装器，并在上面放置一个缓冲区。\n\
  \n我们的 `BufferedInputStream` 将构造函数中指定的 `InputStream` 上放置一个缓冲区。实际的数据源是你作为 `InputStream`\
  \ 传递给它的。`BufferedInputStream` 从 `InputStream` 读取大块数据。然后你从 `BufferedInputStream`\
  \ 读取单个字节或小块字节。默认缓冲区大小为 512 字节，但也有一个构造函数允许在有特殊需求时指定缓冲区大小。\n\n为了提高效率，你从 `BufferedInputStream`\
  \ 对象中读取，而不是直接从底层的 `InputStream` 读取。这样你就不需要反复返回操作系统来读取单个字节了。\n\n# BufferedOutputStream\
  \ (带缓冲输出流)\n\n`BufferedOutputStream` 继承自 `FilterOutputStream`。当你将其应用到 `OutputStream`\
  \ 时，你就获得了一个带缓冲输出流。你不需要为写入的每个字节都去操作系统，而是有了一个提供缓冲区的中间层，你向该中间层写入即可。\n\n当缓冲区满时，它将一次性写入操作系统。如果缓冲区满、流满或使用了\
  \ `flush()` 方法，它将自动写入。`flush()` 方法强制将流中缓冲的任何输出写入其目标地。因此，对于 `BufferedOutputStream`，你需要告诉它：\n\
  \n*   你将要使用的输出流\n*   如果你不喜欢默认值，则指定缓冲区大小\n\n## 25.2 BufferedReader 和 BufferedWriter\n\
  \n`BufferedReader` 和 `BufferedWriter` 的作用类似于 `BufferedOutputStream` 和 `BufferedInputStream`，区别在于它们处理的是字符的读写。对于\
  \ `BufferedReader`，你指定一个底层的 `Reader` 和可选的缓冲区大小。对于 `BufferedWriter`，你指定一个底层的 `Writer`\
  \ 和可选的缓冲区大小。\n\n`BufferedReader` 有一个额外的方法，叫做 `readLine()`，它允许我们简单地从底层的 `Reader`\
  \ 读取一整行字符。\n\n# BufferedReader: 示例代码\n\n如果你一直在使用 Java 1.0，`readLine()` 方法实际上是 `DataInputStream`\
  \ 的一部分。现在，你应该使用 `BufferedReader` 来调用 `readLine()`，即使你仍然可以通过 `DataInputStream` 实现它。\n\
  \n`DataInputStream` 读取字节，但当你读取行时，你实际上是在读取字符，因此使用 `readLine()` 和 `BufferedReader`\
  \ 是首选的方法。\n\n# 示例\n\n```java\nimport java.io.*;\nimport java.util.*;\n\nclass TextReaderExample\n\
  {\n    public static void main(String argv[])\n    {\n        // 创建\n        {\n\
  \            try\n                BufferedReader br = new BufferedReader(new FileReader(text.dat));\n\
  \                // 现在读取\n                {\n                    try\n         \
  \           {\n                        FileOutputStream fos = new FileOutputStream(text.dat);\n\
  \                        PrintWriter pw = new PrintWriter(fos);\n              \
  \          for (int i = 0; i < 3; i++)\n                        {\n            \
  \                Hotel a_hotel = new Hotel();\n                            if (a_hotel.read_from_br(br))\n\
  \                            {\n                                a_hotel.debug_print();\n\
  \                            }\n                        }\n                    }\n\
  \                    catch (IOException e)\n                    {\n            \
  \            System.err.println(e);\n                    }\n                }\n\
  \                catch (IOException e)\n                {\n                    System.err.println(e);\n\
  \                }\n                br.close();\n            }\n        }\n    }\n\
  }\n\nclass Hotel\n{\n    private String name;\n    private int rooms;\n    private\
  \ String location;\n\n    boolean input(BufferedReader in)\n    {\n        try\n\
  \        {\n            System.out.println(“Name: “);\n            name = in.readLine();\n\
  \            System.out.println(“Rooms:”;\n            String temp = in.readLine();\n\
  \            rooms = to_int(temp);\n            System.out.println(“Location: “);\n\
  \            location = in.readLine();\n        }\n        catch(IOException e)\n\
  \        {\n            System.err.println(e);\n            return false;\n    \
  \    }\n        return true;\n    }\n\n    boolean write_to_fos(FileOutputStream\
  \ fos)\n    {\n        try\n        {\n            fos.write(name.getBytes());\n\
  \            Integer i = new Integer(rooms);\n            fos.write(i.toString().getBytes());\n\
  \            fos.write(location.getBytes());\n            fos.write(‘ ‘);\n    \
  \    }\n        catch (IOException e)\n        {\n            System.err.println(e);\n\
  \            return false;\n        }\n        return true;\n    }\n\n    void debug_print()\n\
  \    {\n        System.out.println(“Name :” + name + “: Rooms : “ + rooms + “: at\
  \ :” + location+ “:”);\n    }\n\n    static int to_int(String value)\n    {\n  \
  \      int i = 0;\n        try\n        {\n            i = Integer.parseInt(value);\n\
  \        }\n        catch(NumberFormatException e)\n        {}\n        return i;\n\
  \    }\n\n    boolean read_from_br(BufferedReader br)\n    {\n        try\n    \
  \    {\n            String line = br.readLine();\n            if (line == null)\n\
  \            return false;\n            StringTokenizer st = new StringTokenizer(line,\
  \ “|”);\n            int count = st.countTokens();\n            if (count < 3) return\
  \ false;\n            name = st.nextToken();\n            String temp = st.nextToken();\n\
  \            rooms = to_int(temp);\n            location = st.nextToken();\n   \
  \     }\n        catch(IOException e)\n        {\n            System.err.println(e);\n\
  \            return false;\n        }\n        return true;\n    }\n}\n```\n\n#\
  \ BufferedWriter\n\n正如我们提到的，`BufferedWriter` 允许我们写入缓冲区。它对字符输出流进行缓冲，通过将许多小的写入请求合并为一个较大的请求来提高输出效率。\n\
  \n这个类有一个有趣的额外方法，使 Java 代码具有可移植性。大多数情况下，换行由 \\n 表示，但在所有操作系统中可能并非如此。由于这种原因，Java 语言增加了一个名为\
  \ `newLine()` 的方法。\n\n与其输出字符 \\n，不如调用 `newLine()`，它会输出适用于特定操作系统的相应换行符。写入的换行符是通过将\
  \ `line.separator` 传递给 `System` 类中的 `getProperty()` 方法得到的。\n\n\n\n\nJava `newLine()`\
  \ 方法会询问系统：“你的换行符是什么？”在 Java 语言中，这被称为系统属性（system property）。有一个包含这些属性的 `System` 类。当你通过将\
  \ `line.separator` 传递给 `System` 类中的 `getProperty()` 方法并询问“你的换行符是什么？”时，你会得到一个答复。根据平台的不同，换行符可以是换行符、回车符，或者两者兼有。\n\
  \n`newLine()` 方法是 `BufferedWriter` 的一部分，它通过这种调用将依赖平台的行分隔符输出到流中。\n\n# 何时使用 BufferedWriter\n\
  \n你通常使用 `BufferedWriter` 进行输出。唯一你不希望使用缓冲输出的情况是你正在为用户编写一个提示信息（prompt）。提示只有在缓冲区填满后才会出现，因此对于这类操作，你希望希望使用缓冲。\n\
  \n### `PrintWriter()` API:\n\n```java\nPrintWriter out = new PrintWriter (new BufferedWriter\
  \ (new FileWriter (“file.out”));\n```\n\n# 输入输出流的缓冲：示例代码\n\n这里有一个显示缓冲效率的示例代码。通常，`InputStreamReader`\
  \ 或 `FileReader` 上的 `read()` 方法执行从底层流的读取。\n\n在这些 `Readers` 之上封装一个 `BufferedReader`\
  \ 可能会更高效。通过缓冲，从字节到字符的转换比直接调用 `InputStreamReader.read()` 方法具有更少的方法调用。\n\n同样，`OutputStreamWriter`\
  \ 或 `FileWriter` 上的 `write()` 方法执行到底层流的写入。在这些 `Writers` 之上封装一个 `BufferedWriter`\
  \ 可能会更高效。\n\n# 示例\n\n```java\nBufferedReader in=new BufferedReader(new inputStreamReader(System.in));\
  \ Writer out=new BufferedWriter(new FileWriter(“file.out”);\n```\n\n# 第 26 章：过滤\n\
  \n## 26.1 什么是过滤？\n\n使用过滤是从更大的输入或输出流读取或写入数据的集。过滤可以独立于数据格式（例如，你需要计算列表的项目数），也可以与数据格式直接相关（例如，你需要获取表格某行的所有数据）。你将过滤流附加到输入或输出流上以过滤数据。\n\
  \n`FilterInputStream` 和 `FilterOutputStream` 过滤输入和输出字节。创建 `FilterInputStream` 时，会为它指定一个\
  \ `InputStream` 进行过滤。同样，在创建 `FilterOutputStream` 时，你会指定一个要过滤的 `OutputStream`。它们封装了现有的\
  \ `InputStream` 或 `OutputStream` 以提供缓冲、校验和等功能。\n\n对于字符 I/O，我们有抽象类 `FilterWriter`\
  \ 和 `FilterReader`。`FilterReader` 作为字符输入流的超类，从某个其他字符输入流读取数据，对其进行过滤，并在调用自己的 `read()`\
  \ 方法时返回过滤后的数据。`FilterWriter` 用于字符输出流，在将数据写入其他字符输出流之前，对其写入的数据进行过滤。\n\n# Pushback\
  \ APIs\n\n`PushbackInputStream(InputStream is)`\n\n`void unread(int byte)`\n`void\
  \ unread(byte [] array)`\n\n`PushbackReader(Reader in)`\n`void unread(int character)`\n\
  `void unread(char [] buffer)`\n\n## 26.2 Pushback\n\n你使用 `PushbackInputStream` 实现单字节的回退缓冲区或指定长度的回退缓冲区。它可以用于解析数据。你什么时候需要它？\n\
  \n有时当你从 `InputStream` 读取一个字节时，它意味着一个新数据块的开始（例如，一个新的标记）。你可能会说：“我已经读了这个字节，但我现在真的无法处理它。我想把它推回\
  \ `InputStream` 中。当我以后回来读取 `InputStream` 时，我想再次获取同一个字节。”\n\n你使用 `unread()` 方法将字节推回流中。当你再次读取它时，你将读到之前推回的数据。你可以\
  \ `unread()` 单个字节、字节数组，或者带有偏移量和长度的字节数组。\n\n如果你正在读取字符，你可以推回一个字符而不是字节。你将使用 `PushbackReader`，它的工作方式与\
  \ `PushbackInputStream` 相同。\n\n使用 `unread()` 方法推回单个字符、字符数组，或带有偏移量和长度的字符数组。\n\n###\
  \ LineNumberReader 对比 LineNumberInputStream\n\n`LineNumberReader` 是一种字符输入流，它可以跟踪从它处读取的文本行数。一行被认为由换行符（`\\\
  n`）、回车符或回车加换行符终止。`readLine()` 方法返回行中所有不包含终止符的字符。`getLineNumber()` 方法返回已读取的行数。\n\n\
  如果由于某种原因你想重置行号，可以通过 `setLineNumber()` 实现，并从该点重新开始行计数。\n\n`LineNumberInputStream`\
  \ 也会跟踪已读取的数据行数，但该类在 Java 1.1 中被废弃了，因为它读取的是字节而不是字符。随后引入了读取字符的 `LineNumberReader`。\n\
  \n#### LineNumberReader APIs\n\n`LineNumberReader(Reader r)`\n`LineNumberReader(Reader\
  \ r,int buffer_size)`\n`String readLine()`\n`int getLineNumber()`\n`void setLineNumber(int\
  \ line_num)`\n\n### PrintStream 对比 PrintWriter\n\n`PrintStream` 用于将 Java 数据输出为文本。它实现了许多用于原始数据类型文本表示的方法。\n\
  \n你可能从早期编程开始就开始使用 `PrintStream` 对象。`System.out` 就是一个 `PrintStream` 对象。尽管如此，`PrintStream`\
  \ 在 1.1 中被 `PrintWriter` 取代。该类的构造函数已被废弃，但类本身仍然仍然被 `System.out` 和 `System.err` 输出流使用。\n\
  \n`PrintStream` 和 `PrintWriter` 的方法非常相似。`PrintWriter` 没有写入原始字节的方法，而 `PrintStream`\
  \ 有。\n\n# 刷新 (Flushing)\n\n`PrintStream` 和 `PrintWriter` 类都采用刷新，将数据从内部缓冲区移动到输出流。刷新有两种实现方式：\n\
  \n*   自动刷新：当调用 `println` 时触发刷新\n*   不自动刷新：只有在调用 `flush()` 方法时才刷新\n\n在 `PrintStream`\
  \ 类中，如果写入了换行符，就会进行刷新。在 `PrintWriter` 类中，如果你启用了自动刷新，只有在调用 `println()` 方法时才会刷新。`PrintWriter`\
  \ 的 `println()` 方法使用系统属性 `line.separator`，而不是 `PrintStream` 使用的换行符（`\\n`）。\n\n#\
  \ \n\n你可以给 `PrintWriter` 构造函数一个 `Writer`，也可以给它一个 `OutputStream`。对于后者，会透明地创建一个 `OutputStreamWriter`，它使用默认字符编码执行字符到字节的转换。\n\
  \n你可以选择两种刷新选项之一：自动刷新或不刷新。你可以使用 `print()` 方法不换行打印整数、字符串和字符，使用 `println()` 方法带换行打印。\n\
  \n# PrintWriter() APIs\n\n`PrinterWriter (Writer w)`\n`PrinterWriter (Writer w,\
  \ Boolean autoflush)`\n`PrinterWriter (OutputStream os)`\n`PrinterWriter (OutputStream\
  \ os, Boolean autoflush)`\n\n## 26.3 校验和 (Checksumming)\n\n本节探讨了校验和。`Checksum` 是多个不同类实现的接口。让我们看看本节涵盖的内容：\n\
  \n*   什么是校验和？它是如何工作的？\n*   什么是消息摘要（message digest）？它是如何工作的？\n*   校验和与消息摘要的对比\n\n\
  \n\n什么是校验和（Checksum）？`Checksum` 接口定义了在组数据上计算校验和所需的方法。校验和的计算方式是：如果数据中的单个位或两个位发生变化，校验和的值就会发生变化。\n\
  \n校验和是基于提供给 `update()` 方法的数据字节计算的。`update()` 方法通过将字节数组加到最终值中，来更新当前的校验和。\n\n此外，可以任何时候通过\
  \ `getValue()` 方法获取校验和的当前值。使用 `reset()` 方法可以将默认值重置为其初始值（通常为 0）。\n\n校验和有两种类型。最常见的是\
  \ `CRC32`，即循环冗余校验检查（Cycle Redundancy Check）。另一种类型的校验和是 `Adler32`，用于计算 `Adler32`\
  \ 校验和。`Adler32` 的计算速度更快，可靠性几乎与 `CRC32` 相当。\n\n## Checksum 方法\n\n```\nlong getValue()\n\
  \nvoid reset()\n\nvoid update(byte [] array, in offset, int length)\n```\n\n## CheckedInputStream\
  \ 和 CheckedOutputStream\n\n让我们创建一个 `Checksum` 对象并用它来过滤输入或输出流。当向 `CheckedOutputStream`\
  \ 写入字节时，校验和会自动计算。\n\n`CheckedOutputStream` 调用 `Checksum` 对象中的 `update()` 方法。然后该字节就会发送到其最终目的地。在任何时刻，你都可以向\
  \ `Checksum` 对象请求当前的校验和。你可以写出所有的字节，并将该校验和添加到你已写的内容中。\n\n*   `CheckedInputStream`\
  \ 实现了 `FilterInputStream` 并在每次读取时维护校验和。\n*   `CheckedOutputStream` 实现了 `FilterOutputStream`\
  \ 并在每次写入时维护校验和。\n\n## 添加校验和\n\n使用校验和来确保数据已正确传输。使用一个 `OutputStream` 和 `Checksum`\
  \ 类型的对象构造一个 `CheckedOutputStream`。`CRC32` 和 `Adler32` 是你可以选择的两种校验和类型，你也可以创建自己的。每隔一段时间（例如每\
  \ 512 字节），获取校验和的当前值，并通过流发送这四个字节。\n\n在接收端，你使用 `InputStream` 和与为 `CheckedOutputStream`\
  \ 使用的相同类型的对象构造一个 `CheckedInputStream`。在读取 512 字节后，获取校验和的当前值，并将其与从流中读取的下四个字节进行比较。\n\
  \n## CheckedOutputStream：示例代码\n\n让我们来看示例代码。我们将打开一个指向 `Temp1.tmp` 的 `FileOutputStream`。构造一个\
  \ `CRC32` 类型的对象，并用它创建一个 `CheckedOutputStream`。在向文件每次写入字节时，会计算校验和。最后，向 `Checksum`\
  \ 对象请求校验和的当前值。\n\n校验和只提供一个 32 位的值。如果一个位发生变化，你会注意到；但如果很多位发生变化，你可能会得到相同的校验和。\n\n以下是示例代码：\n\
  \n```\nFileOutputputStream os =new FileOutputStream“Temp1.tmp”);\n\nCRC32 crc32\
  \ = new CRC32(); CheckedOutputStream cos =new CheckedOutputStream(os, crc32);\n\n\
  cos.write(1);\n\ncos.write(2);\n\nlong crc = crc32.getValue();\n```\n\n## 26.4 摘要\n\
  \n让我们创建一个比 `Checksum` 更大的东西。代表字节序列的较大位集称为消息摘要（message digest）。消息摘要的工作原理类似于校验和。它是一个单向哈希，接受变长度的数据并创建一个固定长度的哈希值。这被称为数字指纹。\n\
  \n如果有人对原始序列进行了更改并操纵了内容，消息摘要将不再相同。这就是我们实现安全的方式。虽然存在可能，但概率极小，如果消息被更改，你可能会得到相同的消息摘要。\n\
  \n字节序列被转换为摘要。在 `MessageDigest` 类中，我们有一个名为 `getInstance` 的静态函数。给 `getInstance` 传递我们想要使用的\
  \ `MessageDigest` 的名称。你可以向它传递两个字符串：`SHA1` 和 `MD5`。它们的细节请见算法类书籍。\n\n此外，`update()`\
  \ 方法通过字节或字节数组更新摘要。`digest()` 方法计算并返回 `digest` 的值。然后 `Digest` 会被重置。\n\n## 摘要方法\n\n\
  ```\nstatic MessageDigest getInstance(String algorithm)\n\nvoid update (byte []\
  \ array)\n\nbyte [] digest()\n```\n\n## DigestInputStream 和 DigestOutputStream\n\
  \n我们有两种等效的摘要方法：`DigestInputStream` 和 `DigestOutputStream`。给 `DigestInputStream`\
  \ 提供一个输入流和一个将进行计算的 `MessageDigest`。你可以为流开启或关闭摘要功能。你可能想要输入或输出某些数据，但不想将其计算为 `MessageDigest`\
  \ 的一部分。\n\n`read()` 和 `write()` 方法分别更新 `DigestInputStream` 和 `DigestOutputStream`\
  \ 中的 `MessageDigest`。\n\n## MessageDigest：示例代码\n\n第一行创建了一个指向文件 `temp.tmp` 的 `FileOutputStream`。创建一个\
  \ `MessageDigest` 对象。如代码 `md = MessageDigest.getInstance()` 所示，你正在向它传递你想要使用的摘要算法的名称。它向你返回一个\
  \ `MessageDigest` 类型的对象。如果你传递的字符串不是摘要名称，它将抛出 `NoSuchAlgorithmException`。\n\n获取 `MessageDigest`\
  \ 后，使用它来构造 `DigestOutputStream`。字节被写入底层的 `OutputStream` 并添加到摘要中。通过调用 `md.digest()`\
  \ 获取摘要或字节数组。现在你可以将其存储或发送。\n\n## 示例\n\n```\nFileOutputStream os = new FileOutputStream“Temp.tmp”);\
  \ MessageDigest md = null;\n\ntry\n{\n\nmd = MessageDigest.getInstance(“SHA”);\n\
  \n}\n\ncatch(NoSuchAlgorithmException e)\n\n{\n\nSystem.out.println(e);\n}\n\nDigestOutputStream\
  \ dos = new DigestOutputStream(os, md);\n\ndos.write(1);\n\ndos.write(2);\n\nbyte\
  \ [] digest = md.digest();\n```\n\n## 26.5 校验和与消息摘要\n\n记住，校验和很小。校验和通常用于验证传输数据的完整性，或验证文件是否包含相同的数据。相反，消息摘要大得多。它更多用于安全，确保消息没有被篡改。\n\
  \n## 26.6 解胀与压缩\n\n本节探讨了 Java 代码中的解胀（inflating）和压缩（deflating）。这些术语与压缩和解压缩的意思相同。本节的一些要点包括：\n\
  \n*   DeflaterInputStream 和 DeflaterOutputStream\n*   ZipInputStream 和 ZipOutputStream\n\
  *   ZipFile\n\n## Deflater\n\n让我们进入压缩领域。Deflater 将字节的压缩表示写入输出流。Inflater 则从输入流接收这些压缩字节，读取它们并自动解压缩。这个过程类似于实时的压缩和解压缩。\n\
  \n`Deflater` 的算法应用于输出到流的字节，相应的 `Inflater` 算法应用于从流输入的字节。默认的 `Deflater` 和 `Inflater`\
  \ 使用 ZLIB 压缩库进行压缩和解压缩。另一种构造函数允许使用 GZIP 和 PKZIP 压缩。\n\n## DeflaterOutputStream\n\n\
  让我们进入输出流。你可以简单地用输出口创建一个 `DeflaterOutputStream`。当我们向 `DeflaterOutputStream` 写入时，字节使用\
  \ `Deflater` 算法进行压缩，仅将压缩字节发送到底层的输出流。`DeflaterOutputStream` 的默认构造函数使用带有默认缓冲区的 ZLIB\
  \ 压缩。通过其他构造函数，你可以指定不同的 `Deflater` 和不同大小缓冲区。\n\n![](img/501.jpg)\n\n## InflaterInputStream\n\
  \n\n\n在接收端，实现了一个 `InflaterInputStream`。当我们构造它时，需要指定一个输入源。它会在你处理的过程中从该源中解压缩字节。再次，如果你使用不同的压缩方案，可以指定自己的\
  \ `Inflater`。\n\n如果你决定使用自己的 `Deflater` 或 `Inflater` 而不是默认的，那么确保 `Inflater` 和 `Deflater`\
  \ 匹配并能够相互理解就由你决定了。\n\n![](img/501a.jpg)\n\n# GZIP 输入和输出流\n\n`GZIPOutputStream` 将压缩后的字节以\
  \ GZIP 格式输出到底层流中。它继承自 `DeflaterOutputStream`。构造函数接收一个 `OutputStream`。相应地，`GZIPInputStream`\
  \ 从 GZIP 格式的源输入数据。它继承自 `InflaterInputStream`，构造函数接收一个 `InputStream`。\n\n在单个流（可以是文件）上使用\
  \ `GZIPInputStream` 和 `GZIPOutputStream`。然而，它比 zip 流更高效，因为不需要创建压缩文件的目录。\n\n# ZipFile:\
  \ 示例代码\n\n让我们深入一下 `ZipFile` 和 `ZipEntry` 类。这些类实际上不在 I/O 层次结构中，但了解它们是有好处的，因为许多人都有\
  \ zip 文件。\n\n`ZipFile` 类允许我们读取 zip 文件。一个 zip 文件由两部分组成：已压缩内容的条目列表和数据本身。你使用 `entries()`\
  \ 读取条目集，并挑选其中某一个进行解压缩。`ZipEntry` 对象代表你选择要解压缩的文件。对于那个特定的 `ZipEntry`，你可以使用 `getInputStream()`\
  \ 获取一个 `InputStream`，在读取它时，它会返回解压后的数据。Java 库保留在一个 jar 文件中，该 jar 文件是 zip 格式。如果你想，可以使用\
  \ `ZipFile` 来读取 jar 文件。\n\n# 示例\n\n```java\nimport java.util.zip.*;\nimport java.util.*;\n\
  import java.io.*;\n\nclass ZipFileExample {\n    public static void main(String\
  \ argv[]){\n        try{\n            ZipFile zf = new ZipFile(“test.zip”);\n  \
  \          // 遍历举条目\n            Enumeration zip_entries = zf.entries();\n     \
  \       String last_name = null;\n            while(zip_entries. hasMoreElements()){\n\
  \                ZipEntry ze = (ZipEntry) zip_entries.nextElement();\n         \
  \       System.out.println(“Entry “ + ze.getName());\n                last_name\
  \ = ze.getName();\n            }\n            // 让我们作为示例解压最后一个\n            // 它的名字在\
  \ last_name 中\n            ZipEntry ze = zf.getEntry(last_name);\n            if\
  \ (ze == null)\n                System.out.println(“Cannot find entry”);\n     \
  \       else{\n                BufferedReader r =new BufferedReader(new InputStreamReader(zf.\
  \ getInputStream(ze)));\n                long size = ze.getSize();\n           \
  \     if (size > 0){\n                    System.out.println(“File is “ + size);\n\
  \                    String line = r.readLine();\n                    if (line !=\
  \ null)\n                        System.out.println(“First line is “ + line);\n\
  \                }\n                r.close();\n            }\n        }\n     \
  \   catch(IOException e){\n            System.out.println(e);\n        }\n    }\n\
  }\n```\n\n## 26.7 ZipInputStream\n\n`ZipInputStream` 是我们的下一个站。。你可以使用这个类以流的形式读取 zip\
  \ 文件。你会获取已压缩内容目录中的第一个条目。然后你可以读取第一个条目的的数据，它是被自动解压缩的。接着你获取下一个条目并解压缩它，以此此类推。`ZipInputStream`\
  \ 扩展了 `InflaterInputStream`。这些方法包括从表中获取下一个条目以及关闭条目。关闭条目允许读取下一个条目，而无需完成当前条目数据的读取。`ZipInputStream`\
  \ 中的 `read()` 方法在读取最后一个条目时将返回 -1。\n\n# ZipInputStream 方法\n\n- `getNextEntry()`\n\
  - `closeEntry()`\n- `read()`\n\n# ZipInputStream: 示例代码\n\n下面的代码是一个解压缩文件的示例。你将打开\
  \ `test.zip`，这是我们的 zip 文件。该文件是 `ZipInputStream` 的源。因此， `zis` 指向 `test.zip`。`getNextEntry()`\
  \ 方法最初返回 zip 文件表中的第一个条目。现在可以获取该条目的引用。\n\n如果条目为 null，则意味着已到达文件末尾。从此开始从 zip 文件读取时，读取的数据对应于该条目并自动解压缩。在这种情况下，包装并使用\
  \ `DataInputStream` 来读取它。`dis` 对象将只是从 zip 文件中的相应位置读取并关闭它。下一个条目将打开文件并再次从 zip 文件开始读取，读取下一个条目。\n\
  \n# 示例\n\n```java\nimport java.util.zip.*;\nimport java.io.*;\n\nclass ZipInputStreamExample{\n\
  \    public static void main(String argv[]){\n        try{\n            FileInputStream\
  \ fis = new FileInputStream(“test.zip”);\n            ZipInputStream zis = new ZipInputStream(fis);\n\
  \            ZipEntry ze;\n            // 获取第一个条目 ze = zis.getNextEntry();\n   \
  \         if (ze == null)\n                System.out.println (“End entries”);\n\
  \            else{\n                // 将其作为流或读取器\n                DataInputStream\
  \ dis = new DataInputStream(zis);\n                int i = dis.readInt();\n    \
  \            System.out.println(“File contains “ + i);\n                ze.closeEntry();\n\
  \            }\n            zis.close();\n        }catch(Exception e){\n       \
  \     System.out.println(e);\n        }\n    }\n}\n```\n\n## 26.8 ZipOutputStream\n\
  \n`ZipInputStream` 读取 zip 格式流；`ZipOutputStream` 写入 zip 格式流。这个类允许我们创建 zip 文件。`ZipOutputStream`\
  \ 继承自 `DeflaterOutputStream`。`ZipOutputStream` 的一个方法是 `putNextEntry()`，它会将下一个条目放入流。与其它类类似，`close()`\
  \ 关闭一个条目。\n\n# ZipOutputStream 方法\n\n- `putNextEntry()`\n- `closeEntry()`\n- `write()`\n\
  \n# ZipOutputStream: 示例代码\n\n下面的代码是一个解压缩文件的示例。你将打开 `test.zip`，这是我们的 zip 文件。该文件是\
  \ `ZipInputStream` 的源。因此， `zis` 指向 `test.zip`。`getNextEntry()` 方法最初返回 zip 文件表中的第一个条目。现在可以获取该条目的引用。\n\
  \n如果条目为 null，则意味着已到达文件末尾。从此开始从 zip 文件读取时，读取的数据对应于该条目并自动解压缩。在这种情况下，包装并使用 `DataInputStream`\
  \ 来读取它。`dis` 对象将只是从 zip 文件中的相应位置读取并关闭它。下一个条目将打开文件并再次从 zip 文件开始读取，读取下一个条目。\n\n# 示例\n\
  \n```java\nimport java.util.zip.*;\nimport java.io.*;\n\nclass ZipOutputStreamExample{\n\
  \    public static void main(String argv[]){\n        try{\n            FileOutputStream\
  \ fos = new FileOutputStream(“test.zip”);\n            ZipOutputStream zos = new\
  \ ZipOutputStream(fos);\n            ZipEntry ze = new ZipEntry(“test.txt”);\n \
  \           zos.putNextEntry(ze);\n            // 将其作为输出\n            DataOutputStream\
  \ dos = new DataOutputStream(zos);\n            dos.writeInt(1);\n            zos.closeEntry();\n\
  \            // 另一个条目或关闭它 zos.close();\n        }\n        catch(Exception e){\n\
  \            System.out.println(e);\n        }\n    }\n}\n```\n\n# 第 27 章 Data I/O\n\
  \n# Data I/O 引言\n\n## 27.1 什么是 Data I/O?\n\n有几个类实现了 `DataInput` 和 `DataOutput` 接口。让我们谈谈它们是如何工作的。\n\
  \n原始数据类型（如 `int`）在运行 Java 代码的各种平台上表示可能不同。例如，`int` 可能以最高有效字节在前（称为大端）表示，如在 IBM 主机上一样；或者以最低有效字节在前（称为小端）表示，如在\
  \ IBM PC 上一样。如果你在一个平台上用 C 程序以二进制形式写出一个 `int`，然后在另一个平台上读取它，其值将不一致。\n\n这就是 `DataInput`\
  \ 和 `DataOutput` 发挥用场。现在你可以获取一个原始类型（如 `int`）并将其写出。它是以平台无关的形式写入的。你可以在任何其他 Java 虚拟机上读回它，无论它是在哪里生成的，它都会被转回正确值的\
  \ `int`。\n\n\n\n\n\n所有的基本类型，如 `doubles`、`ints`、`shorts`、`longs` 等，都可以使用 `DataOutput`\
  \ 中的方法以与平台无关的方式写入。同样，它们可以使用 `DataInput` 中的方法进行读取。\n\n# 27.2 Unicode 文本格式\n\n`String`\
  \ 对象以 Unicode 文本格式（简称为 `UTF`）写入。字符串由双字节的 Unicode 字符组成。`UTF` 是一种压缩最常用 Unicode 值的方法。如果\
  \ `String` 仅包含 ASCII 字符，则 1 到 127 之间的值将以单字节写入。128 - 2047 之间的值用两个字节写入。对于某些不常见的 Unicode\
  \ 值，则使用三个字节来表示其值。这种某些值的扩展比 ASCII 值的压缩要稀得多，因此使用 `UTF` 来表示 `String` 在整体上是有益的。\n\n\
  # Unicode 方法\n\n```java\nvoid writeUTF(String s)\n\nString readUTF()\n```\n\n##\
  \ DataInputStream 和 DataOutputStream: 示例代码\n\n两个类 `DataInputStream` 和 `DataOutputStream`\
  \ 实现了 `DataInput` 和 `DataOutput`。它们的方法包括对 `readInt()`、`writeInt()` 以及接口中其他方法的实现。你对\
  \ `InputStream` 封装一个 `DataInputStream`。当调用 `readInt()` 时，会从底层流中读取四个字节并返回结果 `int`。相应地，你对\
  \ `OutputStream` 封装一个 `DataOutputStream`。\n\n下面的代码示例显示了一个使用 `FileOutputStream` 作为底层流的\
  \ `DataOutputStream`。该文件使用 `FileInputStream` 打开，并在其周围包装了一个 `DataInputStream`。`data.dat`\
  \ 文件可以被写在 PC 上。\n\n# 示例\n\n```java\nimport java.io.*;\n\nclass DataInputOutputExample{\n\
  \    static BufferedReader system_in = new BufferedReader(new InputStreamReader(System.in));\n\
  \n    public static void main(String argv[]){\n        // 创建\n        {\n      \
  \      try{\n                FileOutputStream fos = new FileOutputStream(\"data.dat\"\
  );\n                DataOutputStream dos = new DataOutputStream(fos);\n        \
  \        // 读取三家酒店为 (int i = 0; i < 3; i++){\n                    Hotel a_hotel\
  \ = new Hotel();\n                    a_hotel.input(system_in);\n              \
  \      a_hotel.write_to_dos(dos);\n                }\n                dos.close();\n\
  \            } catch(IOException e){\n                System.err.println(e);\n \
  \           }\n        }\n        // 现在读取\n        {\n            try{\n       \
  \         FileInputStream fis = new FileInputStream(\"data.dat\");\n           \
  \     DataInputStream dis = new DataInputStream(fis);\n                Hotel a_hotel\
  \ = new Hotel();\n                while (a_hotel.read_from_dis(dis)){\n        \
  \            a_hotel.debug_print();\n                }\n                dis.close();\n\
  \            } catch(IOException e){\n                System.err.println(e);\n \
  \           }\n        }\n    }\n}\n\nclass Hotel{\n    private String name; private\
  \ int rooms; private String location;\n\n    boolean input(BufferedReader in){\n\
  \        try{\n            System.out.println(\"Name: \");\n            name = in.readLine();\n\
  \            System.out.println(\"Rooms: \");\n            String temp = in.readLine();\n\
  \            rooms = to_int(temp);\n            System.out.println(\"Location: \"\
  );\n            location = in.readLine();\n        } catch(IOException e){\n   \
  \         System.err.println(e);\n            return false;\n        }\n       \
  \ return true;\n    }\n\n    boolean write_to_dos(DataOutputStream dos){\n     \
  \   try{\n            dos.writeUTF(name);\n            dos.writeInt(rooms);\n  \
  \          dos.writeUTF(location);\n        } catch(IOException e){\n          \
  \  System.err.println(e);\n            return false;\n        }\n        return\
  \ true;\n    }\n\n    boolean read_from_dis(DataInputStream dis){\n        try{\n\
  \            name = dis.readUTF();\n            rooms = dis.readInt();\n       \
  \     location = dis.readUTF();\n        } catch(EOFException e){\n            return\
  \ false;\n        } catch(IOException e){\n            System.err.println(e);\n\
  \            return false;\n        }\n        return true;\n    }\n\n    void debug_print(){\n\
  \        System.out.println(\"Name :\" + name + \": Rooms : \" + rooms + \": at\
  \ :\" + location+ \":\");\n    }\n\n    static int to_int(String value){\n     \
  \   int i = 0;\n        try{\n            i = Integer.parseInt(value);\n       \
  \ } catch(NumberFormatException e){}\n        return i;\n    }\n}\n```\n\n# 27.3\
  \ RandomAccessFile: 示例代码\n\n`RandomAccessFile` 同时实现了 `DataInput` 和 `DataOutput`。你使用文件名来构造\
  \ `RandomAccessFile`。然后你就可以在 `RandomAccessFile` 上使用 `read` 和 `write` 方法，例如 `readInt()`\
  \ 和 `writeInt()`。\n\n随机访问意味着你可以将下一次读取或写入定位在文件中的特定字节位置。你可以通过 `getFilePointer()` 获取当前位置。稍后，你可以通过将其传递给\
  \ `seek()` 返回相同的位置。\n\n下面的代码示例显示了向文件写入三个 `ints`。第二次写入之前的文件位置存储在指针中。在写入接两个 `ints`\
  \ 之后，位置恢复到该指针。`readInt()` 返回值 15。\n\n# 示例\n\n```java\nimport java.io.*;\n\nclass\
  \ RandomAccessFileExample{\n    public static void main(String argv[]){\n      \
  \  try{\n            RandomAccessFile raf =new RandomAccessFile(\"random.dat\",\
  \ \"rw\");\n            raf.writeInt(12);\n            long pointer = raf.getFilePointer();\n\
  \            raf.writeInt(15);\n            raf.writeInt(16);\n            // 现在回读第二个一个\n\
  \            raf.seek(pointer);\n            int i = raf.readInt();\n          \
  \  System.out.println(\"Read \" + i);\n        } catch (IOException e){\n      \
  \      System.out.println(e);\n        }\n    }\n}\n```\n\n\n\n\n\n```java\nFileOutputStream\
  \ fos = new FileOutputStream(\"object.dat\");\nObjectOutputStream oos = new ObjectOutputStream(fos);\n\
  YourClass yc = new YourClass();\noos.writeObject(yc);\n```\n\n# 28.3 从文件中读取对象：示例代码\n\
  \n现在，让我们从文件中读取该对象。使用上一个面板中写入的 `object.dat` 文件创建一个 `FileInputStream`。该文件被用作 `ObjectInputStream`\
  \ 的数据源。你需要读取该对象，因此我们调用 `readObject()`，对象就会从文件中被读取。`YourClass` 对象的属性将用我们存储的数据填充。\n\
  \n`readObject()` 方法返回一个指向 `Object` 类对象的引用。你写出了一个 `YourClass` 对象，所以你必须将该引用强制转换为 `YourClass`。你必须记住写入内容的顺序。如果你先存储了一个\
  \ `YourClass` 对象，然后存储了一个 `AnotherClass` 对象，那么你必须按照相同的顺序将它们读回来。\n\n通常情况下，你会按顺序写入内容，然后按相同的顺序读回来。然而，在下一个面板中将讨论另一些替代方法。\n\
  \n## 示例\n\n```java\nFileInputStream fis = new FileInputStream(\"object.dat\");\n\
  ObjectInputStream ois = new ObjectInputStream(fis);\nYourClass yc;\nyc = (YourClass)\
  \ ois.readObject();\n```\n\n# 28.4 读回的替代方法：示例代码\n\n如果你不知道存储对象的顺序，可以使用 `instanceof`\
  \ 测试由 `readObject()` 返回的对象的类型，或者使用 `getClass()` 方法来确定对象的类。然后你可以通过强制类型转换将返回的值分配给适当的对象。在读回对象时，你可以进行更复杂的读写操作：测试它是什么，然后进行适当的强制转换。\n\
  \n这就是在文件中存储对象需要做的所有工作。现在，你想通过 socket 传输它。如果你使用了来自 socket 对象的输入输出流，该对象中的所有值都将通过 socket\
  \ 传输。远程方法调用（RMI）通过对象序列化通过 socket 传递对象。\n\n# 示例\n\n```java\nFileInputStream fis =\
  \ new FileInputStream(\"object.dat\");\nObjectInputStream ois = new ObjectInputStream(fis);\n\
  Object object;\nobject = ois.readObject();\n\nif (object instanceof YourClass) {\n\
  \    YourClass yc = object;\n    // 对 yc 执行操作；\n} else if (object instanceof AnotherClass)\
  \ {\n    AnotherClass ac = object;\n    // 对 ac 执行操作\n}\n```\n\n# 28.5 添加可序列化：示例代码\n\
  \n我们之前提到，如果基类实现了 `Serializable`，你只需要将你的派生类标记为 `Serializable`。。但如果你的基类没有实现它呢？你仍然可以在派生类中实现\
  \ `Serializable`。\n\n如果基类没有实现 `Serializable` 但你想使用序列化，你只需要从基类中提取所有属性并将其存储起来。你的额外属性会自动存储，但基类属性不会。你必须使用\
  \ `get()` 方法，如果基类没有为它的属性提供 get 和 set 方法，那么你将无法序列化基类。你需要定义自己的 `readObject()` 和 `writeObject()`\
  \ 方法，我们将在接下来描述它们。\n\n## 示例\n\n```java\nclass ABaseClass {\n    private int value;\n\
  \    int getValue() {\n        return value;\n    }\n    void setValue(int value)\
  \ {\n        this.value = value;\n    }\n}\n\nclass YourClass extends ABaseClass\
  \ implements Serializable {\n    //..\n}\n```\n\n# 28.6 自定义序列化：示例代码\n\n如果基类不支持序列化，且出于某些原因你不喜欢默认的自定义，你可能想要使用自定义序列化。定义自己的\
  \ `readObject()` 和 `writeObject()` 方法。如果你定义了这些方法，字段或属性将不再自动序列化。你必须负责保存和恢复每个属性。\n\
  \n要存储每个对象的非 transient 且非静态的属性，请调用 `defaultWriteObject()`。属性可以使用 `defaultReadObject()`\
  \ 加载。你可以在你的方法中存储和加载额外的值，例如你声明为 `transient` 的值。如果你派生的类是可序列化的，那么父类的数据已经被处理好了。这时，你只需要添加自己的自定义代码即可。\n\
  \n下面的示例代码展示了 `readObject()` 和 `writeObject()` 是如何编码的。注意 `ABaseClass` 没有实现 `Serializable`，但它确实有\
  \ `getValue()` 和 `setValue()`。\n\n## 示例\n\n```java\nclass ABaseClass {\n    private\
  \ int value;\n    int getValue() {\n        return value;\n    }\n    void setValue(int\
  \ value) {\n        this.value = value;\n    }\n}\n\nclass YourClass extends ABaseClass\
  \ implements Serializable {\n    int another;\n    private void readObject(ObjectInputStream\
  \ ois) throws IOException, ClassNotFoundException {\n        ois.defaultReadObject();\n\
