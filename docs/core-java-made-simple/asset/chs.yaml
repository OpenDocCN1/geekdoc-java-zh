  \n在创建对象时。\n\n* 当使用类名访问类的任何静态成员时。\n* 当使用包含 `null` 的引用变量访问类的任何静态成员时。\n* 在加载类时，它会首先检查相应的类是否已经加载到主内存中。如果类尚未加载，则首先会加载它。在加载过程中，它为类的静态变量分配内存并处理静态块。\n\
