  \ 内部的字符串字面量，前提是该字符串字面量存在于 `SCP` 中。\n*   如果不存在，它将在池中创建一个新的字面量并指向它。\n\n# 示例\n\n```java\n\
  package com.jtc8;\n\npublic class Jtc128{\n    public static void main(String arg[]){\n\
  \        String s1=new String(“som”);\n        String s2=new String(“som”);\n  \
  \      String s3=”som”;\n        System.out.println(s1==s2);\n        System.out.println(s2==s3);\n\
  \        System.out.println(s3==s1.intern());\n        System.out.println(s3==new\
  \ String(“abc”);\n        System.out.println(“som”.intern());\n        System.out.println(“*******”);\n\
  \        System.out.println(“Checking:”);\n    }\n}\n```\n\n![](img/283.jpg\n\n\
  `intern()` method is used to point the string literal inside the `String-Constant-Pool`,\
  \ if that string literal is available inside the `SCP`.\nIf it is not available\
  \ then it will create a new literal inside the pool and it will point to that.\n\
  \nTo create immutable class:\n1. Make fields `final`.\n2. Make the class `final`.\n\
  3. Do not provide setter methods.\n4. If the class contains mutable objects, return\
  \ a copy of the object in the getter.\n\n* Immutable class means the state cannot\
  \ be changed after it is created.\n* Immutable class should be thread-safe.\n\n\
  # Example:\n\n```java\npackage com.jtc9;\n\nfinal class Address {\n    final int\
