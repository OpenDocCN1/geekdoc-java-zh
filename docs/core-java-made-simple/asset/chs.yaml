  \n# 21 正则表达式\n\n## 21.1 简介\n\n正则表达式是一种特定模式表示字符串组的表达式。\n\n## 示例\n\n我们可以编写正则表达式来表示所有有效的电子邮件。\n\
  我们可以编写正则表达式来表示所有有效的手机号。\n\n## 正则表达式的主要应用领域包括：\n\n*   实现验证逻辑。\n*   开发模式匹配应用程序。\n\
  *   开发编译器、解释器等翻译器。开发数字电路。\n*   开发通信协议，如 TCP/IP、UDP 等。\n\n## 示例\n\n```java\nimport\
  \ java.util.regex.*;\nclass RegularExpressionDemo{\n    public static void main(String[]\
  \ args){\n        int count=0;\n        Pattern p=Pattern.compile(“ab”);\n    }\n\
  }\n```\n\n\n\n```java\nMatcher m=p.matcher(“abbbabbaba”);\nwhile(m.find()){\n  \
  \  count++;\n    System.out.println(m.start()+”------”+m.end()+”-- ”+m.group());\n\
  }\nSystem.out.println(“The no of occurences:”+count);\n```\n\n## 21.2 Pattern 类\n\
  \n`Pattern` 对象代表“正则表达式的编译版本”。\n\n我们可以通过使用 `Pattern` 类的 `compile()` 方法创建一个 `Pattern`\
  \ 对象。\n\n```java\npublic static Pattern compile(String regex);\n```\n\n## 示例\n\n\
  ```java\nPattern p=Pattern.compile(“ab”);\n```\n\n注意：如果我们参考 API，将获得更多关于 `pattern`\
  \ 类的信息。\n\n# 21.3 Matcher\n\n`Matcher` 对象可以用于根据正则表达式匹配字符序列。\n\n我们可以通过使用 `Pattern`\
  \ 类的 `matcher()` 方法创建一个 `Matcher` 对象。`public Matcher matcher(String target);`\n\n\
  ```java\nMatcher m=p.matcher (“abbbabbaba”);\n```\n\n## Matcher 类的重要方法：\n\n`boolean\
  \ find();`\n\n它尝试找到下一个匹配项，如果可用则返回 true，否则返回 false。\n\n`int start();`\n\n返回匹配项的起始索引。\n\
  \n`int end();`\n\n返回最后一个匹配字符之后的偏移量（等齐位置）。（或）返回匹配项的“结束+1”索引。\n\n`String group();`\n\
  \n返回匹配的 `Pattern`。\n\n注意：`Pattern` 和 `Matcher` 类在 `java.util.regex` 包中可用，并于 1.4\
  \ 版本中引入。\n\n## 21.4 字符类\n\n![](img/459.jpg)\n\n## 示例\n\n```java\nimport java.util.regex.*;\n\
  class RegularExpressionDemo{\n    public static void main(String[] args){\n    \
  \    Pattern p=Pattern.compile(“x”);\n        Matcher m=p.matcher(“a1b7@z#”);\n\
  \        while(m.find()){\n            System.out.println(m.start()+”---- ”+m.group());\n\
  \        }\n    }\n}\n```\n\n## 21.5 量词\n\n量词可以用于指定匹配的字符数量。\n\n`a` 恰好一个 ‘a’\n`a+`\
  \ 至少一个 ‘a’\n`a*` 任意数量的 a，包括零个\n`a?` 最多一个 ‘a’\n\n## 示例\n\n```java\nimport java.util.regex.*;\n\
  class RegularExpressionDemo{\n    public static void main(String[] args){\n    \
  \    Pattern p=Pattern.compile(“x”);\n        Matcher m=p.matcher(“abaabaaab”);\n\
  \        while(m.find()){\n            System.out.println(m.start()+”---- ”+m.group());\n\
  \        }\n    }\n}\n```\n\n## 21.6 Pattern 类的 split() 方法\n\n`Pattern` 类包含 `split()`\
  \ 方法，用于根据正则表达式分割给定字符串。\n\n## 示例\n\n```java\nimport java.util.regex.*;\nclass RegularExpressionDemo{\n\
  \    public static void main(String[] args){\n        Pattern p=Pattern.compile(\"\
  \\\\s”);\n        String[] s=p.split(“java training center”);\n        for(String\
  \ s1:s){\n            System.out.println(s1);\n            //software\n        \
  \    //solutions\n        }\n    }\n}\n```\n\n# 第 22 章\n\n## IO 包\n\n## 22.1 简介\n\
  \nIO 代表输入输出（input output）。在 Java 中，我们可以编写不同类型的程序，但 Sun 提供了非常强大的 API 来处理输入和显示相应的输出。这里是关于\
  \ I/O 的一些基本点：\n\n* 系统文件中的数据被称为持久化数据，因为它们在程序运行后仍然存在。\n* 文件是通过 Java 代码中的流（streams）创建的。\n\
  * 流是输入或输出数据字节的线性的、顺序的流。\n* 流被写入文件系统以创建文件。\n* 流也可以通过互联网传输。\n* 系统自动为我们创建了三个流：\n  \
  \  * `System.out` - 标准输出流\n    * `System.in` - 标准输入流\n    * `System.err` - 标准错误流\n\
  \n![](img/462.jpg)\n\n## 22.2 流\n\n流是一种管道，通过它你可以将数据从一个地方传输到另一个地方。根据你正在执行的操作，这些操作分为两种类型：\
  \ -\n\n1) 读取数据\n2) 写入数据\n\n现在，根据数据的类型，这些操作被分为两类：\n\n1) 字节流\n2) 字符流\n\n字节输入流：以字节形式读取的数据被称为字节输入流。对于所有字节输入流，`java.io.InputStream`\
  \ 是基类。\n\n## 示例\n\n```java\nimport java.io.*;\npublic class CopyFile {\n    public\
  \ static void main(String args[]) throws IOException {\n        FileInputStream\
  \ in = null;\n        FileOutputStream out = null; \n        try {\n           \
  \ in = new FileInputStream(“input.txt”);\n            out = new FileOutputStream(“output.txt”);\n\
  \            int c;\n            while ((c = in.read()) != -1) {\n             \
  \   out.write(c);\n            }\n        }finally {\n            if (in != null)\
  \ {\n                in.close();\n            } \n            if (out != null) {\n\
  \                out.close();\n            } \n        } \n    }\n}\n```\n\n字节输出流：以字节形式写入某些输出设备的数据被称为字节输出流。对于所有字节输出流，`java.io.OutputStream`\
  \ 是基类。\n\n*注：此处示例代码误用了 FileReader/Writer，根据上下文描述应为 FileInputStream/OutputStream。*\n\
  \n## 示例\n\n```java\nimport java.io.*;\npublic class CopyFile {\n    public static\
  \ void main(String args[]) throws IOException {\n        FileReader in = null;\n\
  \        FileWriter out = null; \n        try {\n            in = new FileReader(“input.txt”);\n\
  \            out = new FileWriter(“output.txt”);\n            int c;\n         \
  \   while ((c = in.read()) != -1) {\n                out.write(c);\n           \
  \ }\n        }finally {\n            if (in != null) {\n                in.close();\n\
  \            }\n            if (out != null) {\n                out.close();\n \
  \           } \n        }\n    }\n}\n```\n\n以字符集形式读取和写入的数据被称为字符输入/输出流。\n\n字符输入流：以字符形式读取的数据被称为字符输入流。对于所有字符输入流，`java.io.Reader`\
  \ 是基类。\n\n字符输出流：以字符形式写入某些输出设备的数据被称为字符输出流。对于所有字符输出流，`java.io.Writer` 是基类。\n\n## 示例\n\
  \n```java\nimport java.io.*;\npublic class Jtc27 {\n    public static void main(String[]\
  \ args) {\n        InputStream is=new BufferedInputStream(System.in);\n        PrintStream\
  \ ps=System.out;\n        System.out.println(“Enter the char :”);\n        char\
  \ ch=’ ‘\n        do{\n            try{\n                int i=is.read();\n    \
  \            ch=(char)i;\n                ps.write(ch);\n            }catch(Exception\
  \ e) {\n                e.printStackTrace();\n            }\n        }while(ch!=‘\\\
  n’);\n    }\n}\n```\n\n## 22.3 选择\n\n在处理 `java.io` 包时，有许多问题需要考虑：\n\n* 你的格式是文本还是二进制？\n\
  * 是否需要随机访问能力？\n* 你在处理对象还是非对象？\n* 你的数据源和汇是什么？\n* 是否需要过滤？\n\n## 文本或二进制\n\n你存储或传输数据的格式是什么？你会使用文本还是二进制数据？\n\
  \n* 如果你使用二进制数据（例如整数或双精度浮点数），使用 `InputStream` 和 `OutputStream` 类。\n* 如果你使用文本数据，`Reader`\
  \ 和 `Writer` 类是正确的。\n\n## 随机访问\n\n* 是否需要对记录进行随机访问？随机访问允许访问文件的任何位置并将其视为记录集合。\n* `RandomAccessFile`\
  \ 类允许随机访问。数据以二进制格式存储。\n\n# 对象或非对象\n\n你是否正在输入或输出对象的属性？如果数据本身是对象，请使用 `ObjectInputStream`\
  \ 和 `ObjectOutputStream` 类。\n\n# 源和汇\n\n你的数据源是什么？什么将消耗你的输出数据，即作为汇？\n\n\n\n\n\n数据记录是多个元素的集合，例如名称或地址。存储数据记录有三种方法：\n\
  \n- 使用分隔符分隔的记录（例如邮件合并风格的记录）来存储值。在输出时，数据值被转换为由由分隔符（如制表符）分隔的字符串，并以换行符结束。要将数据读回 Java\
  \ 代码中，需要读取整行内容，然后使用 `StringTokenizer` 类对其进行拆分。\n- 使用固定大小的记录来存储数据记录。使用 `RandomAccessFile`\
  \ 类存储一个或多个记录。使用 `seek()` 方法找到特定的记录。如果你选择此选项来存储数据记录，则必须确保字符串被设置为固定的最大长度。\n- 此外，如果你使用辅助文件来存储每个记录的长度，可以使用变变长度记录。使用对象流（object\
  \ streams）存储数据记录。如果使用对象流，则不允许进行跳转操作，所有对象都以顺序方式写入文件。\n\n# [22.6 异常]\n\n几乎每个输入或输出方法都会抛出异常。因此，每当你进行\
  \ I/O 操作时，都需要捕获异常。有一个派自 `IOException` 的庞大 I/O 异常层次结构。通常你只需要捕获 `IOException`，它就能捕获所有派生异常。然而，某些\
  \ I/O 方法抛出的异常并不在 `IOException` 体系中。其中一个异常是 `java.util.zip.DataFormatException`。当从\
  \ zip 文件读取数据并解压缩时发现无效或损坏的数据，就会抛出此异常。`java.util.zip.DataFormatException` 必须显式捕获，因为它不在\
  \ `IOException` 层次结构中。\n\n**记住，Java 代码中的异常在发生意外情况时会被抛出。**\n\n# 异常列表\n\n![](img/467.jpg)\n\
  \n此图显示了异常列表：\n\n- `EOFException` 在意外到达文件末尾时发出信号。\n- `UnknownHostException` 信号你正尝试连接到一个不存在的远程主机。\n\
  - `ZipException` 表示在读取或写入 zip 文件时发生了错误。\n\n通常，在 `try` 块中捕获 `IOException`，并至少打印出\
  \ `IOException` 中 `Object` 类 `toString()` 方法的值。你应该以适用于应用程序的方式处理异常。\n\n# 输入流类\n\n\
  在 `InputStream` 类中，字节可以从三个不同的源读取：\n\n- 字节数组\n- 文件\n- 管道\n\n诸如 `ByteArrayInputStream`\
  \ 和 `FilterInputStream` 等源都是 `InputStream` 类的子类。`InflatorInputStream` 和 `FilterInputStream`\
  \ 下的子类如图所示。\n\n![](img/468.jpg)\n\n# InputStream 方法\n\n`InputStream` 类包含了各种方法。\n\
  \n- `abstract int read()` 读取单个字节、字节数组或字节子数组。它返回读取的字节、、读取的字节数，或者在到达文件末尾时返回 -1。\n\
  - `read()` 接收字节数组，读取一个字节数组或字节子数组，并在到达文件末尾时返回 -1。\n- `skip()` 接收 `long` 类型，跳过指定数量的输入字节，并返回实际跳过的字节数。\n\
  - `available()` 返回在不阻塞的情况下可以读取的字节数。输入和输出都可以阻塞线程，直到字节被读取或写入为止。\n- `close()` 关闭输入流以释放系统资源。\n\
  \n# InputStream 标记\n\n- 并非所有的 `InputStreams` 都支持标记（marking）。标记允许你回到流中的标记位置，就像书签以便将来参考。记住，并不是所有的\
  \ `InputStreams` 都支持标记。要测试流是否支持 `mark()` 和 `reset()` 方法，请使用布尔方法 `markSupported()`。\n\
  - `mark()` 方法接收一个整数 `read_limit`，标记输入流中的当前位置，只要在 `mark()` 和 `reset()` 之间读取的字节数不超过指定数量，`reset()`\
  \ 就可以返回该位置。\n\n# OutputStream 类\n\n字节可以三种不同类型的接收器：\n\n- 字节数组\n- 文件\n- 管道\n\n![](img/469.jpg)\n\
  \n下图显示了 `OutputStream` 类。\n\n让我们来看一些 `OutputStream` 类的示例。在将 `OutputStream` 发送到最终目的地之前，你可以对其进行过滤。例如，`BufferedOutputStream`\
  \ 是 `FilterOutputStream` 的子类，它将要写入的值存储在缓冲区中，只有在缓冲区满时才将其写入。\n\n- `CheckedOutputStream`\
  \ 和 `DigestOutputStream` 是 `FilterOutputStream` 类的一部分。它们在输出上计算校验和或消息摘要。\n- `DeflatorOutputStream`\
  \ 写入 `OutputStream` 并创建 zip 文件。该类进行即时压缩。\n- `PrintStream` 类也是 `FilterOutputStream`\
  \ 的子类，它实现了许多用于显示 Java 原生类型文本表示的方法。\n- 示例\n    - `println(long)`\n    - `println(int)`\n\
  \    - `println(float)`\n    - `println(char)`\n\n`DataOutputStream` 实现了 `DataOutput`\
  \ 接口。`DataOutput` 定义了以机器无关的二进制格式写入 Java 原生数据类型所需的方法。\n\n# OutputStream 方法\n\n`OutputStream`\
  \ 类提供了几个方法：\n\n- `abstract void write()` 方法接收一个整数字节并写入单个字节。\n- `void write()` 方法接收字节数组并写入一个字节数组或字节子数组。\n\
  - `void flush()` 方法强制写入任何缓冲输出。\n- `void close()` 方法关闭流并释放系统资源。\n\n关闭输出文件是非常重要的，因为有时缓冲区不会完全刷新，导致数据丢失。\n\
  \n# DataInput 和 DataOutput\n\n`DataInput` 和 `DataOutput` 类定义了以机器无关的二进制格式读写 Java\
  \ 原生数据类型所需的方法。它们由 `RandomAccessFile` 实现。\n\n`ObjectInput` 接口扩展了 `DataInput` 接口，增加了反序列化对象以及读取字节和字节数组的方法。\n\
  \n`ObjectOutputStream` 类创建一个可以被 `ObjectInputStream` 反序列化的对象流。\n\n`ObjectOutput`\
  \ 接口扩展了 `DataOutput` 接口，增加了序列化对象以及写入字节和字节数组的方法。\n\n`ObjectOutputStream` 用于将对象、数组和其他值序列化到流中。\n\
  \n# [22.7 Readers]\n\nReaders 是基于字符的输入流，读取 Unicode 字符。\n\n- `read()` 读取单个字符并返回范围在\
  \ 0 到 65535 之间的整数，如果到达流末尾则返回 -1。\n- `abstract read()` 将字符读入数组的一部分（从 offset 开始，长度为\
  \ length），并返回读取的字符数，如果到达流末尾则返回 -1。\n\nRead() API：\n\n```\nint read()\nread (char[]\
  \ buffer, int offset, int length)\n```\n\n# 字符输入流\n\n让我们看看 `java.io` 包中不同的字符输入流。\n\
  \n- 字符串\n- 字符数组\n- 管道\n\n`InputStreamReader` 是一种使用字节输入流作为数据源并转换为 Unicode 字符的字符输入流。\n\
  \n`LineNumberReader` 是 `BufferedReader` 的子类，是一种字符输入流，它可以跟踪从它读取的文本行数。\n\n`PushbackReader`\
  \ 是 `FilterReader` 的子类，是一种使用另一个输入流作为输入源的字符输入流，并增加了字符推回流中的功能。\n\n# [22.8 Writers]\n\
  \nWriters 是基于字符的输出流，写入字符字节并将 Unicode 转换为字节。基类包含以下方法：\n\n\n\n\n\n-   `void write()`\
  \ 方法，接收一个字符并将单个字符写入 16 个低位位中。\n-   抽象的 `void write()` 方法，接收一个字符数组并写入字符数组的一部分部分。\n\
  \n### `Write()` API:\n\n```java\nvoid write(int character)\nvoid write(char[] buffer,\
  \ int offset, int length)\n```\n\n# 字符输出流\n\n让我们来看 `java.io` 包中不同的字符输出流。该继承树有几个分支可以供探索。就像\
  \ `Readers` 一样，任何分支都是可用的。`Writer` 输出的汇点（Sinks）可以是：\n\n-   `Strings`（字符串）\n-   `CharArray`（字符数组）\n\
  -   `Pipes`（管道）\n\n`OutputStreamWriter` 使用字节输出流作为其数据的目的地。\n\n`BufferedWriter` 对字符输出流应用了缓冲，通过将许多较小的写入请求合并为一个大的请求，从而提高输出效率。\n\
  \n`FilterWriter` 是一个抽象类，作为字符输出流的超类。这些流在将数据写入其他字符输出流之前，会对对其写入的数据进行过滤。\n\n`PrintWriter`\
  \ 是一种字符输出流，实现了 `print()` 和 `println()` 方法，这些方法可以输出原始值和对象的文本表示。\n\n# 第 23 章\n\n#\
  \ 源与汇点\n\n## 23.1 引言\n\n本节重点关注源（sources）和汇点（sinks）。代码示例可以帮助你可视化这些某些类是如何工作的：\n\n\
  -   `Byte arrays`（字节数组）\n-   `Pipes`（管道）\n-   `Sequences`（序列）\n-   `Char arrays`（字符数组）\n\
  \n## 23.2 字节数组\n\n进入字节数组领域。字节会来自字节数组吗？当创建一个 `ByteArrayInputStream` 对象时，会传递一个数组。然后你可以作为\
  \ `InputStream` 从该数组读取字节。\n\n`ByteArrayOutputStream` 写入字节数组。写入输出流的字节被添加到一个内部数组中。你可能好奇如何获取该字节数组。`toByteArray()`\
  \ 方法可以在任何时间点返回字节数组。此外，还可以用 `toString()` 方法，它将字节数组作为 `String` 返回。因此，字节数组既可以是源也可以是汇点。\n\
  \n![](img/473.jpg)\n\n# 23.3 Java 代码中的管道\n\n什么是管道？管道是 Java 程序中两个线程之间的通信手段。一个线程写入管道输出流，另一个线程从连接到该管道输出流的管道输入流读取。\n\
  \n两个线程之间的管道工作方式类似于 UNIX 和 MS-DOS 中两个进程之间的管道工作方式。在这些操作系统中，一个进程的输出可以管道到另一个进程的输入。例如，在\
  \ MS-DOS 中，`dir | more` 命令将 `dir` 命令的输出管道到 `more` 程序的输入。\n\n# 管道示例代码\n\n尽管管道通常与线程一起，但此示例简单地将数据写入管道，稍后将其读回。首先构造一个\
  \ `PipedReader`，然后是一个写入到该 `PipedReader` 的 `PipedWriter`。属性以字符串的形式写入管道，用竖线作为分隔符，并在末放置一个换行符。`PipedReader`\
  \ 的所有内容作为 `String` 读取并显示。\n\n我们稍后将在“分词（Tokenizing）”中展示如何使用 `StringTokenizer` 将一个被分隔符划分的字符串拆分成各个值。\n\
  \n# 示例\n\n```java\nimport java.io.*;\nimport java.util.*;\n\nclass PipedExample{\n\
  \    static BufferedReader system_in = new BufferedReader(new InputStreamReader(System.in));\n\
  \n    public static void main(String argv[]){\n        PipedReader pr = new PipedReader();\n\
  \        PipedWriter pw = null;\n        try {\n            pw = new PipedWriter(pr);\n\
  \        } catch (IOException e) {\n            System.err.println(e);\n       \
  \ }\n        // Create it {\n        // Read in three hotels for (int i = 0; i <\
  \ 3; i++){\n        Hotel a_hotel = new Hotel();\n        a_hotel.input(system_in);\n\
  \        a_hotel.write_to_pw(pw);\n        }\n    }\n    // Print it\n    {\n  \
  \      char [] buffer = new char[1000];\n        int length = 0;\n        try {\n\
  \            length = pr.read(buffer);\n        } catch (IOException e) {\n    \
  \        System.err.println(e);\n        }\n        String output =new String(buffer,\
  \ 0, length);\n        System.out.println(“String is “);\n        System.out.println(output);\n\
  \    }}\n}\n\nclass Hotel{\n    private String name; private int rooms; private\
  \ String location;\n    boolean input(BufferedReader in) {\n        try {\n    \
  \        System.out.println(“Name: “);\n            name=in.readLine();\n      \
  \      System.out.println(“Rooms: “);\n            String temp = in.readLine();\n\
  \            rooms = to_int(temp);\n            System.out.println(“Location: “);\n\
  \            location = in.readLine();\n        } catch(IOException e){\n      \
  \      System.err.println(e);\n            return false;\n        }\n        return\
  \ true;\n    }\n    boolean write_to_pw(PipedWriter pw){\n        try {\n      \
  \      pw.write(name);\n            Integer i = new Integer(rooms);\n          \
  \  pw.write(i.toString());\n            pw.write(location);\n            pw.write('backslash\
  \ n’);\n            // red font indicates that an actual backslash n (carriage return)\n\
  \            // should be inserted into the code.\n        } catch (IOException\
  \ e) {\n            System.err.println(e);\n            return false;\n        }\n\
  \        return true;\n    }\n    void debug_print() {\n        System.out.println(“Name\
  \ :” + name + “: ” + rooms + “: ”);\n    }\n    static int to_int(String value)\
  \ {\n        int i = 0;\n        try {\n            i = Integer.parseInt(value);\n\
  \        } catch (NumberFormatException e) {}\n        return i;\n    }\n}\n```\n\
  \n## 序列\n\n`SequenceInputStream` 组合多个输入流，并将它们视为一个。你可以使用 `SequenceInputStream` 指定两个流或一个\
  \ `Enumeration`，它表示一个流集合。类似 UNIX 中的 “cat” 程序就会这样使用。\n\n`SequenceInputStream` 从第一个输入流读取。当第一个流耗尽时，它打开下一个流。\n\
  \n## 23.4 字符数组\n\n现在让我们探索 `Readers` 和 `Writers`。`read` 和 `write` 方法输入输出字符。与 `ByteArrayOutputStream`\
  \ 类似，`CharArrayWriter` 将字符写入数组。当字符写入 `CharArrayWriter` 对象时，它被添加到一个自动增长的字符数组中。\n\n\
  在任何时间点，我们都可以获取填充好的字符数组。`toCharArray()` 方法返回数组。`CharArrayReader` 使用字符数组作为源。通常，该数组是用\
  \ `CharArrayWriter` 对象创建的。通过替代构造函数，你不仅可以指定数组，还可以指定从数组的起始位置（`offset`）以及在返回 EOF 字符之前读取的字节数（`length`）。\n\
  \n![](img/477.jpg)\n\n# String 示例代码\n\n`StringWriter` 类似于 `CharArrayWriter`。一个内部的\
  \ `StringBuffer` 对象是写入字符的目的。与类关联的方法有 `getBuffer()`，它返回 `StringBuffer` 本身，以及 `toString()`，它返回字符串的当前值。\n\
  \n`StringReader` 类似于 `CharArrayReader`。它使用 `String` 对象作为其返回字符的源。创建一个 `StringReader`\
  \ 时，必须指定它从中读取的 `String`。\n\n在此示例中，我们不是写入管道，而是写入 `String`。构造一个 `StringWriter` 对象。在输出完成后，我们通过\
  \ `toString()` 获取内容并打印。这与之前使用 `PipedReader` 和 `PipedWriter` 的示例相似，只是使用了一个 `String`\
  \ 来包含数据。\n\n# 示例\n\n```java\nimport java.io.*;\nimport java.util.*;\n\nclass StringExample{\n\
  \    static BufferedReader system_in = new BufferedReader(new InputStreamReader(System.in));\n\
  \n    public static void main(String argv[]){\n        StringWriter sw = new StringWriter();\n\
  \        // Create it\n        {\n```\n\n\n\n\n\n```java\n// Read in three hotels\
  \ for (int i = 0; i < 3; i++)\n{\n    Hotel a_hotel = new Hotel();\n    a_hotel.input(system_in);\n\
  \    a_hotel.write_to_string(sw);\n}\n\n// Print it\n{\n    String output = sw.toString();\n\
  \    System.out.println(“String is “);\n    System.out.println(output);\n}\n\nclass\
  \ Hotel {\n    private String name;\n    private int rooms;\n    private String\
  \ location;\n\n    boolean input(BufferedReader in) {\n        try {\n         \
  \   System.out.println(“Name: “);\n            name = in.readLine();\n         \
  \   System.out.println(“Rooms: “);\n            String temp = in.readLine();\n \
  \           rooms = to_int(temp);\n            System.out.println(“Location: “);\n\
  \            location = in.readLine();\n        } catch (IOException e) {\n    \
  \        System.err.println(e);\n            return false;\n        }\n        return\
  \ true;\n    }\n\n    boolean write_to_string(StringWriter sw) {\n        sw.write(name);\n\
  \        Integer i = new Integer(rooms);\n        sw.write(i.toString());\n    \
  \    sw.write(location);\n        sw.write(‘backslash n’);\n        // red font\
  \ indicates that an actual backslash n (carriage return character)\n        // should\
  \ be inserted in the code.\n        return true;\n    }\n\n    void debug_print()\
  \ {\n        System.out.println(“Name :” + na “: Rooms : “ + rooms + “: at :” +\
  \ location + “:”);\n    }\n\n    static int to_int(String value) {\n        int\
  \ i = 0;\n        try {\n            i = Integer.parseInt(value);\n        } catch\
  \ (NumberFormatException e) {\n        }\n        return i;\n    }\n}\n```\n\n#\
  \ InputStreamReader\n`InputStreamReader` 从 `InputStream` 读取字节并将其转换为字符。`InputStreamReader`\
  \ 使用字节的默认字符编码进行处理，这通常是 ASCII。如果读取的字节是 ASCII 字节，则每次使用一个字节来形成一个字符。\n\n如果字节不是 ASCII（例如中文或其他语言），你可能希望将其转换为\
  \ Unicode。字节流的特定编码是必要的，`InputStreamReader` 会将其转换为 Unicode。通过一个备用构造函数，你可以指定 `InputStream`\
  \ 上字节的编码。\n\n# OutputStreamReader\n`OutputStreamWriter` 与 `InputStreamReader` 类似。输出字符是\
  \ Unicode 格式通过 `OutputStreamWriter` 转换为机器的底层格式。转换后的字符被写入 `OutputStream`。底层的默认格式通常是\
  \ ASCII。但是，你可以通过备用构造函数指定特定的编码方案。\n\n# 第 24 章\n## 文件\n\n## 24.1 引言\n本节介绍了 `File`\
  \ 类，这是一个重要的非流类，以一种独立于系统的方式表示文件或目录名称。`File` 类提供了以下方法：\n* 列出目录\n* 查询文件属性\n* 重命名和删除文件\n\
  \n## 24.2 File 类\n`File` 类操作磁盘文件，并用于构建 `FileInputStream` 和 `FileOutputStream`。File\
  \ I/O 类的某些构造函数接受 `File` 类型的对象作为参数。当我们构造一个 `File` 对象时，它代表磁盘上的该文件。当我们调用它的方法时，我们就在操作底层的磁盘文件。\n\
  \n`File` 对象的方法有：\n* 构造函数\n* 测试方法\n* 操作方法\n* 列表方法\n\n## 24.3 构造函数\n构造函数允许 Java 代码指定对象的初始值。因此，当你使用构造函数时，初始化成为了对象创建步骤的一部分。`File`\
  \ 类的构造函数有：\n* `File(String filename)`\n* `File(String pathname, String filename)`\n\
  * `File(File directory, String filename)`\n\n## 24.4 测试方法\n`File` 类中的公共方法对指定的文件进行测试。例如：\n\
  * `exists()` 方法询问文件是否存在。\n* `canRead()` 方法询问文件是否可读。\n* `canWrite()` 方法询问文件是否可以写入。\n\
  * `isFile()` 方法询问它是否是一个文件（相对于目录）。\n* `isDirectory()` 方法询问它是否是一个目录。\n\n这些方法类型都是 `boolean`\
  \ 类型，因此它们返回 `true` 或 `false`。\n\n## 24.5 操作方法\n`File` 类中的公共实例方法对指定的文件执行操作。让我们来看一下：\n\
  * `renameTo()` 方法重命名文件或目录。\n* `delete()` 方法删除文件或目录。\n* `mkdir()` 方法创建由 `File` 对象指定的目录。\n\
  * `mkdirs()` 方法创建 `File` 指定中所有的目录和必要的父目录。\n\n所有这些方法的返回类型均为 `boolean`，用于指示操作是否成功\n\
  \n## 24.6 列表方法\n`list()` 方法返回目录中所有未被可选的 `FilenameFilter` 拒绝的条目名称。如果 `File` 是普通文件，`list()`\
  \ 方法将返回 `null`，或者返回目录中的名称。`list()` 方法可以接受一个 `FilenameFilter` 过滤器并返回符合该过滤器的目录名称。\n\
  \n# FilenameFilter 接口\n`FilenameFilter` 接口用于过滤文件名。你只需要创建一个实现 `FilenameFilter` 的类即可。`accept()`\
  \ 方法决定该名称是否应该包含在文件中。它接收目录和名称。如果名称应该包含在列表中，该方法返回 `true`。\n\n# File 类：示例\n此示例展示了对文件进行存在性测试以及列出\
  \ `C:\\Windows`。\n\n```java\nimport java.io.*;\nimport java.util.*;\n\nclass FileExample\
  \ {\n    static BufferedReader system_in = new BufferedReader(new InputStreamReader(System.in));\n\
  \n    public static void main(String argv[]) {\n        // 创建它\n        {\n    \
  \        try {\n                FileOutputStream fos = new FileOutputStream(“file.dat”);\n\
  \                // 读取三个酒店对于 (int i = 0; i < 3; i++)\n                {\n      \
  \              Hotel a_hotel = new Hotel();\n                    a_hotel.input(system_in);\n\
  \                    a_hotel.write_to_fos(fos);\n                }\n           \
  \     fos.close();\n            } catch (IOException e) {\n                System.out.println(e);\n\
  \            }\n        }\n\n        // 现在显示它\n        {\n            byte [] buffer\
  \ = null;\n```\n\n\n\n\n\n```java\nFile a_file = new File(“file.dat”);\n\nSystem.out.println(“Length\
  \ is “ + a_file.length());\n\nSystem.out.println(“ Can read “ + a_file.canRead());\n\
  \ntry\n{\n    FileInputStream fis = new FileInputStream(a_file);\n    int length\
  \ = (int) a_file.length();\n    buffer = new byte[length];\n    fis.read(buffer);\n\
  \    fis.close();\n}\ncatch(IOException e)\n{\n    System.out.println(e);\n}\nString\
  \ s = new String(buffer);\nSystem.out.println(“Buffer is “ + s);\n}\n\nclass Hotel\n\
  {\n    private String name;\n    private int rooms;\n    private String location;\n\
  \n    boolean input(BufferedReader in)\n    {\n        try\n        {\n        \
  \    System.out.println(“Name: “);\n            name = in.readLine();\n        \
  \    System.out.println(“Rooms:”;\n            String temp = in.readLine();\n  \
  \          rooms = to_int(temp);\n            System.out.println(“Location: “);\n\
  \            location = in.readLine();\n        }\n        catch(IOException e)\n\
  \        {\n            System.err.println(e);\n            return false;\n    \
  \    }\n        return true;\n    }\n\n    boolean write_to_fos(FileOutputStream\
  \ fos)\n    {\n        try\n        {\n            fos.write(name.getBytes());\n\
  \            Integer i = new Integer(rooms);\n            fos.write(i.toString().getBytes());\n\
  \            fos.write(location.getBytes());\n            fos.write(‘ ‘);\n    \
