  Student s4=new Student(33,”bb”,”aa@jtc”);\nal.add(s1);\nal.add(s2);\nal.add(s3);\n\
  System.out.println(“No Sorting”);\nIterator it=al.iterator();\nwhile(it.hasNext()){\n\
  Student s=(Student)it.next();\nSystem.out.println(s);\n} al.add(s4);\nSystem.out.println(“Sorting\
  \ by Sid”);\nCollections.sort(al);\nit=al.iterator();\nwhile(it.hasNext()){\nStudent\
  \ s=(Student)it.next();\nSystem.out.println(s);\n}\nSystem.out.println(“Sorting\
  \ by Sname”);\nCollections.sort(al);\n- 修正：此处原文逻辑应为 Collections.sort(al, new SnameComparator())\n\
  - 按照原文翻译：\nCollections.sort(al,new SnameComparator());\nit=al.iterator();\nwhile(it.hasNext()){\n\
  Student s=(Student)it.next();\nSystem.out.println(s);\n}\n```\n\n# 搜索 List 元素\n\n\
  `Collections` 类定义了以下方法来搜索 `List`：\n- `public static int search(List l,Object obj)`：按照自然排序顺序搜索\
  \ `List`。\n- `public static int search(List l,Object obj,Comparator c)`：按照指定的 `Comparator`\
  \ 搜索 `List`。\n\n# 程序 18.1\n\n```java\nimport java.util.*;\n\nclass Jtc7{\npublic\
