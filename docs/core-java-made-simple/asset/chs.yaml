  \n- `StringBuffer` 中存在的每个方法都声明为同步的，因此一次只允许一个线程操作 `StringBuffer` 对象。StringBuilder\
  \ 不使用同步方法。为了克服这个问题，人们在 1.5v 中引入了 StringBuilder 概念。\n\n## StringBuffer VS StringBuilder\n\
  \n![](img/299a.jpg)\n\n**String VS StringBuffer VS StringBuilder**\n\n- 如果内容固定且不频繁变化，我们应该使用\
  \ `String`。\n- 如果内容频繁变化但需要线程安全，我们应该使用 `StringBuffer`。\n\n\n\n\n\n- 如果内容会频繁变化且不需要线程安全，那么我们应该使用\
  \ `StringBuilder`。\n\n# 方法链\n\n对于 `String`、`StringBuffer` 和 `StringBuilder` 中的大多数方法，其返回类型都是该类型本身。因此，在结果上应用方法后，我们可以调用另一个方法，从而形成方法链。\n\
  \n# 示例\n\n`sb.m1().m2().m3()...............`\n\n在方法链中，所有方法将从左到右求值。\n\n# 示例\n\n```java\n\
  class StringBufferDemo{\n    public static void main(String[] args){\n        sb.append(“som”).insert(5,”prakash”).delete(11,13)reverse()\n\
  \        .append(“java”).insert(18,”abcdf”).reverse();\n        System.out.println(sb);\n\
  \    }\n}\n```\n\n# 单例设计模式\n\n- 通常，你不能为一个类创建任意数量的对象，也就是说在创建对象时存在此类限制，但在某些情况下这可能会导致堆内存相关的问题。\n\
  - 为了避免创建过多对象，我们可以实现单例设计模式。\n- 当我们编写单例设计模式时，该类只能被创建一个对象。\n\n# 实现单例设计模式的步骤\n\n- 将类的默认构造函数声明为\
  \ `private`，这样就从类外部创建该类的对象。\n- 声明一个静态引用变量。\n- 声明一个静态块并在块内部创建类的对象。\n- 编写一个返回类型为该类的静态\
  \ `getter()` 方法。\n\n# 示例\n\n```java\npackage com.jtc13;\n\nclass Hello{\n    //1\\\
  . 将类的默认构造函数声明为私 \n    private Hello(){\n    }\n\n    //2\\. 静态引用变量 \n    static\
  \ Hello h1=null;\n\n    //3\\. 静态块 \n    static{\n        h1=new Hello();\n    }\n\
  \n    //4\\. 静态 getter 方法 \n    static Hello getHello(){ \n        return h1;\n\
  \    }\n\n    void m1(){ \n        System.out.println(“m1 in Hello”);\n    }\n}\n\
  \npublic class Jtc134{\n    public static void main(String arg[]){\n        //Hello\
  \ h1=new Hello();\n        Hello h1=Hello.getHello();\n        h1.m1();\n      \
  \  Hello h2=Hello.getHello();\n        h2.m1();\n        System.out.println(h1);\n\
  \        System.out.println(h2);\n        System.out.println(h1.hashCode());\n \
  \       System.out.println(h2.hashCOde());\n    }\n}\n```\n/* 当类加载时，会创建 `Hello`\
  \ 类的对象 `h1`。引用变量会先处理处理，然后是静态块。*/\n\n# 14.1.4 java.lang.System 类\n\n`System` 是 `java.lang`\
  \ 包中的一个最终类（final class）。`System` 类的默认构造函数被声明为 `private`，而且你不会创建 `System` 类对象的需求，因为\
  \ `System` 类几乎所有的成员都是静态的。因此，可以通过类名直接访问它们。\n\n# 变量\n\n1. `public static final java.io.InputStream\
  \ in;`\n2. `public static final java.io.PrintStream out;`\n3. `public static final\
  \ java.io.PrintStream err;`\n\n![](img/302.jpg)\n\n# 方法\n\n1. `public static void\
  \ setIn(java.io.InputStream)`\n2. `public static void setOut(java.io.PrintStream)`\n\
  3. `public static void setErr(java.io.PrintStream)`\n\n`System.in` 的默认实现是输入设备，即键盘，因此提供你的\
  \ Java 程序的输入将由“in”提供。\n\n`in` 是“输入流”的引用变量，而不是从键盘获取输入。如果你想从其他输入设备获取输入，那么你需要更改 `in`\
  \ 的实现。由于 `in` 是 `static final` 变量，它无法这样更改值，但在机器层面我们可以更改它的值。\n\n# PrintStream out:\n\
  \n`out` 也是一个 `static final` 变量，其实现不能被更改。`out` 的默认实现是你的输出设备，即控制台。如果你想更改这一点，也可以指定。\n\
  \n# java.io.PrintStream err\n\n`err` 也是 `PrintStream.err` 的引用。默认实现与 `out` 相同都是控制台。\n\
