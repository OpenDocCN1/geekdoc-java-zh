  ![](img/ent.jpg) 反射是在不看到类的情况下分析类过程。\n\n![](img/ent.jpg) 通过使用 sun microsystems 提供的反射\
  \ API，即 `java.lang.reflect` API。我们可以在运行时了解大多数类级别的属性，如类、接口、字段和方法，而无需在编译时知道对应的实体和操作名称。这里实体对应类，操作对应方法。此外，我们还可以实例化新对象、调用方法并注入值。\n\
  \n反射 API 是非常强大的，虽然在通用编程或基础编程中没有用，但 Java 和 J2EE 的许多概念都是基于反射设计的。有很多框架和工具恰恰地使用了反射。\n\
  \n* Struts\n* Hibernate\n* Spring\n* JUnit\n* Tomcat\n* Eclipse\n* 以及更多……\n\n![](img/ent.jpg)\
  \ 由于某些问题，建议不要在通用编程中使用反射。\n\n* 性能差\n* 安全限制\n* 安全隐患\n* 维护成本高\n\n# 程序 14.1\n\n```java\n\
