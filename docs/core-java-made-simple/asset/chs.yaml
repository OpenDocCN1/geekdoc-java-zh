  \ 修饰符仅适用于变量，而不适用于类和方法。如果变量的值经常变化，则必须使用 `volatile` 修饰符。\n\n如果一个变量被声明为 `volatile`，那么对于每个线程都会创建一个单独的副本，线程的所有中间修改都在该副本中进行，而不是主副本。一旦线程结束，该值将更新到主副本。\n\
  \n`volatile` 修饰符的优点是可以解决数据不一致的问题，但为每个线程创建单独副本会增加复杂性并影响性能。因此，如果没有特殊需求，我们不使用 `volatile`\
  \ 修饰符。`final` 则意味着值不变。\n\n## 6.10 方法重载\n\n在类内部编写多个同名的方法被称为方法重载。当你在一个类中编写多个同名的方法时，这些方法将执行不同的任务。在重载方法时请记住以下几点：\n\
  \n- 方法名必须相同。\n- 方法返回值可以是任意类型。\n- 方法必须不同：\n    1. 参数的类型\n    2. 参数的顺序\n    3. 参数的数量\n\
