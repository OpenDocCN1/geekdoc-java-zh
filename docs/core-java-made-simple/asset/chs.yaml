  \n# 第 32 章\n\n## java.util.concurrent 包\n\n### 32.1 java.util.concurrent\n\n该包包含许多并发集合类，其目的是消除内存不一致性。Java\
  \ 通过在向集合中添加项的操作与任何尝试读取或从集合中移除该项的操作之间定义一个“先发生于”（happens-before）关系来来实现这一点。\n\n`java.util.concurrent`\
  \ 包为集合框架添加了许多类。额外的集合类包括：\n\n* `BlockingQueue`：先先进先出（FIFO）队列，在向满队列添加元素或从空队列检索元素时会阻塞或超时。\n\
  * `ConcurrentMap`：`java.util.Map` 的子接口，包含许多额外的原子操作。\n* `ConcurrentNavigableMap`：`ConcurrentMap`\
  \ 的子接口，支持近似匹配。\n\n`BlockingQueue` 在多线程环境下使用是安全的，并定义了不可更改的初始容量。可以向队列中添加和移除项，但一旦队列满了其容量，它将阻塞任何添加新元素的尝试。此外，队列还将阻塞任何从队列中移除项的尝试。\n\
  \n`BlockingQueues` 用于实现生产者-消费者设计模式。这种设计模式中，单个或多个生产者线程可以将项添加到队列中，由许多其他线程进行消费。在这里使用队列允许生产者以其任何喜欢的速度向集合中添加项，而无需担心消费者是否能以相同的速率消费这些项。\n\
  \n`ConcurrentMap` 定义了某些方法，可以在键已存在时替换或移除键值对，或者在键未关联任何值时添加值。\n\n`ConcurrentHashMap`\
  \ 是 `ConcurrentMap` 接口的一个具体实现，类比于 `HashMap` 类的并发版本。当使用多个线程访问 `HashMap` 时，可以对其访问进行同步，但这会对性能产生影响，因为整个对象将被锁定，这意味着读取和写入操作在当前操作完成之前都将被阻塞。\n\
  \n`ConcurrentHashMap` 通过允许多个线程并发读取，同时限制多个线程的修改操作，提供了更好的性能。\n\n由于 `ConcurrentHashMap`\
  \ 允许多个并发读取，因此迭代器不会抛出 `ConcurrentModificationException`，因为在遍历元素时集合不需要被锁定。\n\n问题随之而来：在开始对映射进行迭代后，添加到\
  \ `ConcurrentHashMap` 中的项会发生什么事情？映射可能会遍历迭代器创建时已经存在的项，但在某些平台上，迭代器可能包含新添加的项。然而，这并不是有保证的。\n\
  \n由于在修改元素时集合不是锁定的（未被锁定的），因此某些方法在被多个线程调用时可能不会返回准确的值。`size()` 方法就是一个例子，可能不会返回映射的准确大小。\n\
  \n`ConcurrentMap` 接口添加了许多方法，将先前的操作封装进单个原子操作中。在使用 `HashMap` 时，通常的做法是检查键是否存在于映射中，如果不存在，则将键值对放入映射中。\n\
  \n`ConcurrentHashMap` 将这两个操作都封装进单个 `replace` 方法中。这防止了在多个线程中进行这两个方法调用时发生任何竞态条件的可能性。\n\
  \n在执行同步块时，会在对象上获取一个隐式锁。Java 提供了许多 `Lock` 对象，提供了更高水平的锁定控制。`Lock` 对象可以定义等待获取对象锁的时间跨以及锁轮询。\n\
  \n`lock()` 方法尝试在 `Lock` 对象上获取锁，如果无法获取锁则等待。当不再需要锁时，必须调用 `unlock()` 来释放此锁。此调用应该在 `finally`\
  \ 块中进行，以确保在发生异常时执行。\n\n尝试获取锁的隐式锁无法退出，与之相反，显式锁可以尝试获取锁且调用会立即返回。在锁对象上调用方法 `tryLock()`\
  \ 会立即返回一个布尔值，定义是否可以锁定对象。\n\n获取显式锁的线程永远不会死锁，而获取隐式锁的线程有时会发生死锁，形成相反。\n\n完成对锁定资源的使用后，调用\
  \ `unlock()` 方法释放该对象上的锁。\n\n如果我们不想等待超过指定的时间，可以调用带参数的 `tryLock()` 方法，指定在我们放弃尝试获取锁之前想要等待多久。我们向此方法传递两个参数：一个代表时间值的\
  \ `long` 值和一个 `TimeUnit` 对象。\n\n还可以声明线程在等待锁时是可以被中断的。`lockInterruptibly()` 方法将尝试在对象上获取锁，除非它被中断，在被中断时会抛出一个\
  \ `InterruptedException`。\n\n隐式锁不能跨越多个代码块，锁在 `synchronized` 块结束时释放。然而，显式锁对象可以跨越多个方法。\n\
  \n`ReadWriteLock` 接口维护一对锁，一个用于读取（只要没有正在进行的写入操作，就可以被多个线程获取），另一个是写锁（一次只能由单个线程获取）。要获取读锁，必须调用\
  \ `readLock()`。必须调用 `writeLock()` 方法来获取写锁。\n\n`ReentrantReadWriteLock` 是实现 `ReadWriteLock`\
  \ 接口的类。\n\n\n\n实现 `Executor` 接口时，只需要实现一个方法 - `execute()`。通过此方法，我们可以决定如何执行 `Runnable`（`Runnable`\
  \ 接口）任务，包括任务的执行顺序、可并发执行的任务数量以及可以放入队列的任务数量。\n\n`Callable` 接口与 `Runnable` 接口的区别仅在于于其方法的签名：首先，该接口的唯一方法名为\
  \ `call`，且与 `Runnable` 接口不同，它的方法可以返回值并能够抛出受检异常（checked exception）。\n\n此外，`Callable`\
  \ 接口是一个泛型接口，其类型参数定义了 `call()` 方法可以返回的值类型。\n\n如果 `call` 方法不需要返回值，我们可以将类型参数定义为 `Void`。\n\
  \n`Callable` 对象不能像 `Runnable` 对象那样传递给线程进行执行，因此在执行 `Callable` 对象时，我们必须使用 `ExecutorService`\
  \ 接口。\n\n`ExecutorService` 定义了管理任务进度和终止的方法。可以将单个的 `Runnable` 或 `Callable` 对象提交给\
  \ `ExecutorService` 并返回 `Future` 对象。可以提交多个 `Runnable` 对象并返回 `Future` 对象。此外，还有用于关闭\
  \ `ExecutorService` 以及允许或禁止已提交任务完成的方法。\n\n线程池允许创建一个具有预定义大小的可复线程池，以并发执行任务。\n\nfork/join\
  \ 框架被添加到 Java 7 中，以支持硬件并行。它的目的是将较大的任务拆分为可以并行执行的小型任务，并在完成后合并各个任务的结果。\n\nfork/join\
  \ 框架通过评估待执行任务的大小来工作：如果任务不够大无法拆分，则将按顺序执行；如果足够大，则会拆分任务直到它们小到可以顺序执行为止。\n\n当每个任务完成后，结果将合并回分生该线程的线程。\n\
  \n`ForkJoinPool` 是 fork/join 框架的一个具体实现，实现了 `ExecutorService` 接口。fork/join 框架维护一个提交用于执行的任务队列，但实现了工作窃取（work-stealing）算法。一旦某个线程队列中不再有任何任务，它将从其他线程队列中窃取任务。这防止了等待线程的阻塞。\n\
  \n在使用 fork/join 框架时，任何必须进行处理的用户自定义类都应该扩展抽象类 `ForkJoinTask`，以便在 `ForkJoinPool` 中执行。\n\
  \n`ForkJoinTask` 被两个类扩展 - `RecursiveAction` 用于不返回结果的计算，`RecursiveTask` 用于返回结果的计算。\n\
  \n# 示例\n\n### CarHire.java\n```java\npublic class CarHire implements Runnable {\n\
  \    String carReg;\n\n    public CarHire(String carReg) {\n        this.carReg\
  \ = carReg;\n    }\n\n    public void run() {\n        System.out.println(“Completed\
  \ hire of “ + this.carReg);\n    }\n}\n```\n\n# 示例\n\n### CarHireCallable.java\n\
  ```java\nimport java.util.Map;\nimport java.util.HashMap;\nimport java.util.concurrent.Callable;\n\
