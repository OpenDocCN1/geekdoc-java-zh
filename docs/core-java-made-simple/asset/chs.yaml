  \n### 注意事项\n1. `import static java.*;`\n2. `import static java.lang.System.*;`\n\
  3. `import static java.lang.System.out;`\n\n1. 当你编写第一个 `import` 语句时，因为它尝试从 `java.lang`\
  \ 包中导入包中的静态成员 `*`。由于有很多类，且一个类不能是静态的，这会导致错误。\n2. 当你编写第二个 `import` 语句时，`java.lang.System`\
  \ 的所有静态成员都将可用。\n3. 当你编写第三个 `import` 语句时，对于 `import static java.lang.System.out`\
  \ 后的类，只有 `out` 可用\n\n## 静态导入程序\n\n### 1) Hello.java\n```java\npackage com.jtc.p1;\n\
