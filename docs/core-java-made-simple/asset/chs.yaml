  \ `extends` 关键字。\n\n![](img/6.1.jpg)\n\n***图 6.1:** 继承*\n\n# 4. 多态\n\n多态是指一种形式在不同情况下表现出不同行为的过程。多态主要有两种类型：\n\
  \n1. 静态多态或（编译时多态）\n2. 动态多态或（运行时多态）\n\n## 6.2 类\n\n在 Java 中，类是用户定义的数据类型，我们可以在其中编写以下不同的成员：\n\
  \n* `class`\n* `Variables`（变量）\n* `Block`（块）\n* `Method`（方法）\n* `Constant`（常量）\n\
  * `class`\n* `Enum`（枚举）\n* `Interface`（接口）\n\n**注意：** `class` 是关键字，而 `java.lang.Class`\
  \ 是一个类\n\n## 6.3 对象\n\n对象是类的蓝图。换句话说，对象包含了关于类的信息。\n\n# 示例\n\n```\nclass Hello{\n\
  int a=10;\nint b=20;\n}\n```\n\n![](img/6.2.jpg)\n\n***图 6.2:** 对象*\n\n**步骤：** 对于引用变量\
  \ `h1`，将分配 8 字节内存，并赋值为 `null`。\n\n![](img/88.jpg)\n\n将创建对象，其中类级变量（即实例变量或静态变量）将获得内存。\n\
  \n![](img/88a.jpg)\n\n对象引用将在原本 `null` 的位置赋值给引用变量 `h1`。\n\n# 注意\n\n* 对于任何类型的引用变量，都将分配\
  \ 8 字节内存。\n* 对于所有类型的引用变量，默认值均为 `null`。\n\n## 6.4 变量\n\n变量将是某种特定数据类型，包含一个在程序中可以进一步更改的值。变量主要有两种类型：\n\
  \n1. **实例变量：** 直接定义在类内部且没有任何 `static` 关键字的变量。\n\n```java\nclass Hello{\nint a=10;\
  \ //实例变量\nint b=20;\n}\n```\n\n2. **静态变量：** 直接定义在类内部并带有 `static` 关键字的变量。\n\n```java\n\
  class Hello{\nint a=10; //实例变量\nint b=20; //实例变量\nstatic int c=30; //静态变量\n}\n``````\n\
