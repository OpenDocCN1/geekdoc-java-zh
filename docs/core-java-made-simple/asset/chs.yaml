  ```\n\n# charValue() 方法\n\n`Character` 类包含 `charValue()` 方法，用于将 `Character` 对象转换为\
  \ `char` 原始类型。\n\n# 示例\n\n```java\nclass WrapperClassDemo{\n    public static void\
