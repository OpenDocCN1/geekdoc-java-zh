  \ SCP 上，此规则都是相同的。\n\n# 14.1.3 java.lang.StringBuffer 类\n\n- `StringBuffer` 是 `java.lang`\
  \ 包中的一个类。它是一个 final 类，不能被扩展为子类。`StringBuffer` 对象在本质上是可变的，也就是说，如果你执行任何拼接或其他操作，它将修改源内容。`stringBuffer`\
  \ 的几乎所有成员都是同步的，因此这会影响应用的并发性。（使用 `StringBuffer` 成员会影响应用的并发性）。`StringBuffer` 对象可被序列化。`StringBuffer`\
  \ 不像 `String` 那样使用任何特殊的内存位置。`String` 为了对象的重用性具有常量池。\n\n`String buffer` 使用容量概念来存储\
  \ `String`（`capacity=16`）。没有使用“new”操作符就无法创建 `StringBuffer` 对象。\n- 如果内容频繁变化，则永远不建议使用\
  \ `String` 对象，因为每次更改都会在内部创建一个新对象。\n- 为了处理这类需求，我们应该使用 `StringBuffer` 概念。\n- `StringBuffer`\
  \ 相比 `String` 的主要优势是，所有更改都将在现有对象上执行，而不是创建新对象。（不会创建新对象）\n- `StringBuffer` 不使用任何 SCP\
  \ 或任何特殊的内存位置来重用字符串字面量。\n- 创建一个具有默认初始容量“16”的空 `StringBuffer` 对象。一旦 `StringBuffer`\
  \ 对象达到最大容量，将创建一个新的 `StringBuffer` 对象。![](img/295.jpg)\n- `StringBuffer` 使用“容量概念”来存储字符串字面量。\n\
  \n```java\nStringBuffer sb1=”ABC”;\nsb1.append(“xyz”);\n```\n![](img/296.jpg)\n\n\
  ```java\npublic class Jtc132{\n    public static void main(String arg[]){\n    \
  \    StringBuffer sb1=new StringBuffer();\n        System.out.println(sb1.capacity());\
  \ //16\n        System.out.println(sb1.length()); //0\n        sb1.append(“jtcindia”);\n\
  \        System.out.println(sb1.capacity()); //16\n        System.out.println(sb1.length());\
  \ //8\n        sb1.append(“jtcindia1”);\n        System.out.println(sb1.capacity());\
  \ //34\n        System.out.println(sb1.length()); //17\n    }\n}\n```\n![](img/296a.jpg)\n\
  \n# StringBuffer 的重要方法\n\n- `public int length();`\n    返回 `StringBuffer` 中字符的数量。\n\
  - `public int capacity();`\n    返回 `StringBuffer` 能够容纳（持有）的字符总数。\n- `public char\
  \ charAt(int index);`\n    返回指定索引处的字符。\n- `public void setCharAt(int index, char\
  \ ch);`\n    在指定位置设置字符。\n- `public StringBuffer append(String s);`\n- `public StringBuffer\
  \ insert(int index, String s);`\n- `public StringBuffer delete(int start, int end);`\n\
  \    从 start 到 end 删除指定的字符。\n- `public StringBuffer deleteCharAt(int index);`\n\
  \    删除指定索引处的字符。\n- `public void setLength(int newLength);`\n    设置长度。\n- `public\
  \ void trimToSize();`\n    修剪大小。\n- `public void ensureCapacity(int minCapacity);`\n\
  \    确保足够的容量。\n\n### 注意\n`StringBuffer` 是同步的，因此由于此，一次只允许一个线程操作 `StringBuffer` 对象。\n\
