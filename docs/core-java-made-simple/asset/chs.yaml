  \ os) throws IOException\n```\n\n# 序列化\n\n序列化是将对象状态写入文件、文本文件或标志文件的过程。当你使用任何分布式技术（如\
  \ Hibernate、RMI、JPA、EJB 等）工作时，你可能需要在文件中存储对象的状态。`String` 类和所有包装类默认实现了 `java.io.Serializable`\
  \ 接口。序列化主要用于在网络上传输对象。序列化对象独立于 JVM，可以被任何 JVM 重新序列化。在这种情况下，内存中的 Java 对象状态被转换为字节流。这种类型的文件用户无法理解。它是被\
  \ JVM（Java 虚拟机）使用的特殊类型对象。这种序列化的过程也被称为压缩（deflating）或封化（marshalling）。\n\n给出的示例展示了对象序列化的实现。该程序获取机器可理解的文件名，然后序列化对象。要序列化的对象必须实现\
