    individuate the function or functions served by the attitude. Due to difficulties
    in measurement and taxonomy, the functional approach to the study of attitudes
    is not universally shared. I adopt it here because the classification of attitudes
    in terms of their functions is especially fruitful when explaining the effects
    of attitudes on information processing and other inquiry-relevant cognitive activities.


    There are several taxonomies of attitude functions currently in use. Although
    they are different, there are significant areas of agreement and overlap among
    them. Broadly speaking, six functions have gained wide-spread acceptance: object
    appraisal, knowledge, instrumental, ego-defensive, social adaptive, and value
    expressive. The object appraisal function is defined somewhat trivially as the
    function, shared by all attitudes, that serves the need to evaluate (Fazio, 2000).
    I mention here largely to set aside in favor of another function which is thought
    to be one of its constituents: knowledge (Katz, 1960). Attitudes are classified
    as serving this function if they are formed and revised to satisfy the need to
    make sense of the world. This point could be couched in motivational terms (Marsh
    & Julka, 2000). When the motive of having an accurate account of the target guides
    the formation and revision of an attitude, that is said to have a knowledge function.


    Instrumental attitudes satisfy the need to maximize rewards. Ego-defensive attitudes
    are those that are formed in response to a need to defend the ego against real
    or presumed threats. Those attitudes that respond to the need to belong to one''s
    elective social group are said to serve a social-adaptive function. Finally, attitudes
    that satisfy the need to give expression to one''s values have a value-expressive
    function (Maio & Haddock, 2004; Maio & Olson, 2000b). The target of a value-expressive
    function need itself be a value. For example, I have a positive attitude toward
    my walking boots. They remind me of great outdoors and feelings of freedom, autonomy,
    and awe. Thus, it is plausible to conclude that in my case this attitude satisfies
    the need to give expression to a set of values.


    A single attitude may serve more than one function. For instance, it is plausible
    that ambivalent attitudes towards chocolate of the kind I have described satisfy
    more than one need. A person''s attitude towards chocolate may be negative without
    avoiding the stuff contributes to satisfying the need for social acceptance (since
    indulgent eating is frowned upon) but also positive since eating chocolate satisfies
    a hedonistic need (Maio & Olson, 2000a, pp. 429–430).'
