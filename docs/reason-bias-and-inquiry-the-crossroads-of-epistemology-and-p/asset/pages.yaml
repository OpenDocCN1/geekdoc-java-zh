    We have noted that a person (or a source of information or a process) might be
    unreliable even if they are unbiased, in the case of the unbiased but incompetent
    basketball referee. One common explanation for why someone might be unreliable
    that they are biased, but the person might be unreliable for reasons that having
    nothing to do with bias. In general, reliability does not entail bias.


    What about the other way around? Does being biased entail unreliability? We maintain
    that the correct answer to this question is not straightforward. On the one hand,
    we hold that certain generalizations such as “biased thinkers are unreliable”
    are true, at least when they are suitably interpreted. On the other hand, claims
    of this sort have to be interpreted so that they are consistent with the following
    facts. Most cognitive processes are such that whether they are reliable or unreliable
    depends on the environment in which they are operating. Typically, the same process
    will be reliable in some environments but unreliable in others—a point familiar
    from discussions of relativism in epistemology¹³ and the “rationality wars” in
    psychology. (See, e.g., Gigeren [1991] on the reliability of heuristics in adaptive
    circumstances.)


    Suppose that an individual is biased against a group of people. In particular,
    they are disposed to conclude that people of group F are likely to be G, where
    G is some negative trait. (We are assuming there is no a priori reason to think
    that people of group F are more likely to be G; nor does the individual have any
    significant empirical evidence that they are. It’s just a bias that F infer when
    they encounter a person who belongs to group F, they infer that the person is
    G or that it is likely that the person is G.) Of course, whether that pattern
    of inference leads the person to mostly true or false beliefs will depend on the
    environment that they are in. In particular if they happen to be in an environment
    where the people of group F whom they encounter tend to have feature G, then the
    biased pattern of reasoning (and the biased person who employs it) will be reliable,
    at least if we measure reliability in terms of actual frequencies of true beliefs
    among total beliefs. Indeed, the biased person might be more reliable than the
    unbiased person (who waits for evidence before concluding that this person of
    group F is G), with respect to the beliefs that they end up with.


