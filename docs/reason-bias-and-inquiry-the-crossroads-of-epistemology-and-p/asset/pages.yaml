    on the majority of the paper, but pressed far against the right edge are words,
    printed in black block letters, “You’re seeing less than half the picture"


    As this protest makes clear, it is a misrepresentation—of art and reality—when
    the mental image formed fails to include parts of what is reality. But more than
    the systematic exclusion of some from the public eye, Guerrilla Girls protested
    the lack of recognition of this bias. The art world failed to recognize its own
    blindness.


    Far beyond the confines of high culture, people of all sorts hold a deepseated
    faith in the reliability of their visual experiences, believing what they see
    to always be an accurate and complete representation of the world. The trust and
    confidence people in visual experience can be particularly problematic in the
    court of law. The adversarial legal system is predicated on the idea that a jury
    of peers, each with potential biases they bring to in interpreting evidence, as
    a whole reach a verdict approaching the truth as a result of an open deliberation
    processes (Swift, 2003). Yet the very principles of naive realism undermine the
    basis for this tenet of due process. Not only do people consider their perceptions
    to be accurate and veridical, but they also consider their perceptions to be more
    objective than others’ perceptions. People tend to underweight the input of others
    about the same information (Liberman et al., 2012). As a result, even deliberation
    among a jury of peers be unlikely to compel people to consider or “see” new information
    or alternatives in visual evidence.


    Moreover, the unwavering belief in one’s perceptual experiences coupled with the
    bias in those perceptions that arise as a result of individuals’ unique experiences
    can undermine faith in the legal system. The perceived and actual legitimacy of
    the legal system rests on verdicts aligning with the actual facts of the case.
    Legal scholars distinguish substantive truth—the facts of the case and reality
    of events—from legal truth—the facts as decided by judges and the courts through
    legal proceedings (Summings, 1999). When factors shift how and to what individuals
    attend, the potential for greater divergence between substantive and formal truth
    emerges. As a result, the legitimate standing of the courts erodes. When ultimate
