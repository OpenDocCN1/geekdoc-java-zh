    # Implications for Self and Society


    Naturally, all these difficulties in identifying the shape and scope of one''s
    ignorance carry many implications for human life. Some of them are personal and
    affect the individual. Some of them ultimately affect society at large. Many of
    them, interestingly, intersect with philosophical topics and issues.


    # Self


    Take the issue, for example, of rational ignorance (Downs, 1957). It is possible
    for a person to know everything there is to know about the world. Much too much
    information now exists to allow a person to become a temporary renaissance person.
    Further, it is imprudent to try to be that renaissance person, in that its not
    worth the effort to become expert in some topics. My life is not diminished, for
    example, by not knowing the history of the Baltic States or basic ballistics or
    the poems of Middle English. As such, one can make the argument that there are
    clear circumstances where it is rational to be ignorant of a topic, times when
    the person is better off being uninformed than expending the effort to become
    well informed.


    No doubt, there is some truth to this argument, but the invisibility of personal
    ignorance makes it intrinsically difficult to know whether one is achieving rational
    ignorance or not. Essentially, blind to an area, we do not know enough to know
    if we are better off being blind. To make such a proper call whether we can remain
    undetected about an area, we have to put in the effort of gaining an education
    in that area. As such, we are not in a position to make a call about whether our
    ignorance is adaptive or maladaptive.


    To be sure, in some areas, one could imagine the world would be easy to make.
    If I spent a few years studying the science and aesthetics of different typefaces.
    But how does one really know? For example, in my line of psychology, it would
    seem clear that I would never have to learn Bose-Einstein statistics, an esoteric
    strand of analysis developed'
  merge: -1
