    # Recognizing One’s Own Ignorance


    Here, however, is Confucius (2015) enters the picture again. Wise knowledge is
    not only knowing what we know—it also and importantly requires a reasonable grasp
    of what we are ignorant of. This chapter is a discussion of how well people have
    grasp. Its central contention is knowing what one doesn''t know, having a reasonable
    understanding of the shape and scope of one''s ignorance, makes knowing a hard
