    # Conclusion


    In this chapter I have advanced a new account of virtues and vices that sees them
    as underpinned by attitudes. I have first highlighted some key features of these
    character traits. Subsequently, I have introduced the attitude construct and why
    attitudes possess the qualities traditionally attributed to virtues and vices.
    I have concluded that the congruence offers support for the hypothesis that attitudes
    are the psychological states responsible for virtues and vices. However, the strongest
    argument in favor of this account is provided by its ability to throw light on
    the nature and characteristic expressions of specific virtues or vices. The analyses
    of intellectual arrogance and obsequiousness presented in the final section of
    this chapter exemplify the explanatory power of the theory defended here.


