  md: '# NOT KNOWING WHAT YOU DO NOT KNOW 219


    in physics to account for the quantum behavior of small particles in various energy
    states. However, such a call might be preliminary and wrong—in that other psychological
    researchers have begun successfully applying such status- tics to the errors people
    make in everyday decisions (Buseymeyer et al., 2011).


    # Asking for Advice


    Beyond deciding when it might appropriate to be ignorant, people often face a
    much simpler question: Are they ignorant, and should they turn to the expertise
    of others. It is inefficient for each person to know or to learn eve- rything.
    A society benefits if people trade off which areas they will be expert in so that
    everyone can gain necessary expertise when they need it.


    The problem is that the invisibility of ignorance suggests that people have substantial
    trouble knowing when they need to rely on someone else’s ex- pertise rather than
    their own. Any academic instructor who has advised advises students with the most
    need of advice never come into the office to get it until it is too late. Work
    in our lab demonstrates this advisor’s paradox, in that people with the most need
    for advice are no more likely to seek it than those who do not need it.


    In these studies, we give participants a quiz that should be of some interest
    and familiarity to them. For example, it may be a survey about household hazards
    given to parents with at least one child under the age of 6 at home. They are
    given small monetary bonuses for every correct answer, but they can also ask for
    advice—to see how another person has responded to the same question (with no guarantee
    that this other person got the question right)—for a reduced bonus. We find that
    respondents rarely ask for advice (13%) of the time for the household safety questionnaire)
    and that poor performers ask for no more advice than top performers (Yan & Dunning,
    2018).


    # Judging Others


    There is a further problem, however, that follows from the Dunning-Kruger effect:
    Flawed expertise not only prevents people from seeing their own igno ranc; it
    also prevents them from recognizing superior competence in others. We have termed
    this problem the Cassandra quandary, after the Greek myth of the princess who
    was given the gift of true prophecy but also cursed by'
  merge: -1
  pgno: 217
- img_proc: true
  md: 'the gods to be disieved by all other humans. This inability to evaluate the
    expertise of others is more severe among poor performers, who cannot accurately
    identify which individuals are best to approach for advice. In one demonstration
    of this, we gave participants the answers that other people had given to a quiz
    on financial literacy. We asked who they would want to approach for financial
    advice. Those with perfect scores on the quiz themselves, 91% chose the other
    person with a perfect score. Only 9% of those posting the worst score on the quiz
    chose similarly (Dunning & Cone, 2018).


    # Society


    This theme of expertise carries over when thinking about societal implications.
    If people cannot identify either the expert or the worth of their expertise, society
    will be worse off in the aggregate.


    # Dismissing Expertise


    The invisibility of ignorance promotes problems in dealing with expertise in two
    ways, which on the surface may seem contradictory. On the one hand, not being
    able to identify expertise may cause the less able to miss or discount it. At
    an extreme, nonexperts may mistakenly think their knowledge rivals that of experts.
    A recent Pew survey showed that 83% of Americans felt ''understood the challenges
    police face on the job,'' but only 13% of police officers agreed that citizens
    had sufficient understanding. It is likely that the public does not know how often
    the police have to deal with verbal abuse (two-thirds of officers reported such
    abuse within the last month) or how often they enter situations of uncertain safety
    (Morin et al., 2017).


    Or, in the area of medicine, people may substitute their judgment for that of
    the doctor, an action called epistemic trespassing (Ballantyne, 2019). A study
    that examined 50 years of data revealed that patients failed to substantially
    adhere to their doctor''s instructions in roughly 45% of cases, depending mostly
    on the specific malady in question (DiMatteo, 2004). In the case of high chronic
    blood pressure, disbelief and ignorance are the'
  merge: -1
  pgno: 218
- img_proc: true
  md: '# NOT KNOWING WHAT YOU DO NOT KNOW 221


    main reasons people fail to adhere to the regimen their physician gives them.
    Patients may misunderstand the rationale for the treatment, misunderstand their
    condition, or overestimate their skill at controlling their blood pressure without
    medication (Kirsch & Rosenstock, 1977; Patel & Taylor, 2002; Svensson et al.,
    2000).


    Ignorance and misunderstanding may also underlie, at least in part, distrust of
    scientific expertise. A significant proportion of the American public distrusts
    scientific conclusions, for example, about climate change and the safety of vaccines.
    Underlying this distrust is a belief that scientists are free to conclude and
    say whatever they wish, but whatever scientific knows is not the case. To make
    a statement to scientific standards, one must follow the strict and constraining
    rules of the scientific method and generate data that support the scientist''s
    conclusion. If the data fail to coincide, the scientist cannot make the claim.


    In our work, we have shown that people who believe scientists can say whatever
    they fail to show adequate knowledge of the scientific method, its constraining
    rules, and how those limit scientific claims. In short, hypognitive of the scientific
    method, people misunderstand the basis for scientific claims. Those with fuller
    knowledge of scientific rules and their constraints turn out to trust scientists
    more (De Oliveira Chen & Dunning, 2018).


    # Gullibility to False Information


    The invisibility of ignorance leads to improper dismissal of true and valuable
    expertise, it also creates a cross-cutting problem—a gullibility to false information
    that purports to be fact or expertise. Upon its release, a deeply flawed 2014
    study linking water fluoridation to lower IQs in children generated Twitter views
    and shares numbering in the tens of thousands (Vogel, 2017). The National Science
    Foundation has recently published a report that it was running a child prostitution
    ring on Mars (Holley, 2017).


    The human inability to tell true from false but plausible information may lead
    people to be too credulous to such fake news and false information. Actually,
    the psychological situation may be worse than that. People show a *truth bias*,
    assuming that any new information they encounter is more likely to be true than
    false (DePaulo et al., 1997; Vrij, 2000; Zuckerman et al., 1981).'
