    # Reducing the Bias Blind Spot


    The problems posed by the bias blind spot, a pressing question is, how the bias
    blind spot be reduced? In this section, we highlight three po-tential strategies
    to help overcome the failure to see bias in oneself. One ap-pro to reducing the
    bias blind spot is “exposure control” (Gilbert, 2002; Wilson & Brekke, 1994)—that
    is, trying to prevent bias from occurring in the first place by removing the presence
    of biasing influences. Double-blind peer review, for example, attempts to reduce
    the possible influence of author identity to prevent bias from taking place. This
    approach has strong merits; after all, the problem of blindness only exists when
    bias itself exists; thus, eliminating the opportunity to be biased also eliminates
    the problem of blindness. In many situations, however, it may be impossible or
    unfeasible to fully remove biasing influences, and thus other approaches are needed
    well.


    A Tempting additional approach to reducing the bias blind spot would be simply
    educate people about implicit biases, emphasizing that they are common, frequent,
    and can occur outside awareness. The ironic problem posed by the bias blind spot,
    however, is that it results from the failure to rec-ognize bias in oneself; hence
    education about biases cannot reduce it. Indeed, people may respond to education
    about biases by noting frequently they see those around such tendencies, while
    neglecting those same tendencies in themselves as a result of relying on in-rospection.
    Thus, the topic of education should not just be bias itself but rather the limitations
    of introspection as a strategy to assess bias. Pronin and Kugler (2007) tested
    such an approach by giving one group of participants (fabricated) article about
