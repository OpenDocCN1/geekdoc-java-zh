  md: '# Conclusion


    Strawsonian epistemologists are thus mistaken in thinking that there are benefits
    to be had by taking a participant perspective on testimony, self-knowledge, or
    the activities of promising or resolving and refusing to occupy the objective
    perspective. To the extent that the participant perspective differs from the objective
    perspective, either by leaving things out which the objective perspective includes
    or by virtue of elements which are incompatible with an objective view of one''s
    self and one''s situation, the participant perspective is inferior to an objective
    view of matters. Strawson himself, and Strawsonian epistemologists, exaggerate
    to an extent an objective perspective will result in alienation, from others,
    from one''s own beliefs, or from one''s agency. Surprisingly, departures from
    the objective perspective are not conducive to believing as one ought.


