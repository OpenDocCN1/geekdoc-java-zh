    The second is clarity, which measures the subject'' certainty that a statement
    expresses their attitude (Petrocelli et al., 2007). Attitude certainty as opposed
    to feelings of doubt about the rightness or truth of one''s attitude. Often, all
    or some of these diverse kinds of strength are measured before being aggregated.
    Hence, empirical work on the moderating role of attitude strength on information
    processing often treats strength as an aggregate measure of several distinct factors.


