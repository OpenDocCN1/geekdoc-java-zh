  md: '# 13


    # A Paradox of Information Aggregation


    We Do It Well but Think About It Poorly, and Why This Is a Problem for Institutions


    Hugo Mercier


    How good are we taking other people''s opinion into account? Are we too easily
    swayed by authority figures or the majority opinion? Or, on the contrary, are
    we too pigheaded to change our minds even in the face of cogent arguments? In
    other words, how well do we take into account—aggregate—communicated information?
    (Throughout this chapter, I will refer to cases in which we take communicated
    information into account—by contrast with non-social sources of information—simply
    as information aggregation).


    After briefly exposing the great benefits that can be derived from information
    aggregation, I will make the case that there is a paradox in humans we deal with:
    We are good at aggregating information but bad at thinking about it. More specifically,
    we are endowed with a suite of cognitive mechanisms that allow us to make the
    best of communicated information in a wide variety of contexts. These are naturally
    developing learning mechanisms of which we can already find roots in very young
    children. On the other hand, we are equipped with no such mechanisms when it comes
    to thinking about how information aggregation works or how it works. Although
    we can learn—by reading chapters as this one, say—how information aggregation
    works, this remains explicit knowledge, distinct from intuitive mechanisms with
    which we spontaneously aggregate information. Moreover, I argue the vast majority
    of people who do not learn such explicit knowledge rely instead on a variety of
    heuristics that happen to make them overly pessimistic about the prospects of
    information aggregation. To conclude, I delineate some of the consequences this
    pessimism might have for we who live with modern information environments.'
  merge: -1
  pgno: 297
- img_proc: true
  md: '# The Promise of Information Aggregation


    That we can benefit from information aggregation is, in a sense, trivial: Other
    people know things we don''t; more people are bound to know more things than any
    single individual. Yet the first mathematical demonstration of the power of information
    aggregation was only offered by Condorcet in the 18th century (Condorcet, 1785).
    What came to be known as the Condorcet jury theorem bears on the simple case of
    an assembly having to decide two options, one of which is superior to the other.
    Condorcet demonstrated that the odds of the majority supporting the best option
    increase with the size of the assembly and that they converge to one for a sufficiently
    large assembly.


    Because a series of conditions have to be met for the Condorcet jury theorem to
    hold, it seems to offer an upper bound on the power of information aggregation.
    The conditions are as follows. The choice to be between two options, the assembly
    members must be at least competent (i.e., have better than chance of selecting
    the correct option on their own), they must reveal their true preferences in their
    votes (i.e., no strategic voting), and they must have acquired their opinion independently
    of each other. However, subsequent mathematical analyses and modeling work have
    revealed even when these assumptions are relaxed, the majority remains more likely
    than not to select the best option (Estlund, 1994; Federsen & Pesonder, 1998;
    Hastie & Kameda, 2005; Ladha, 1992; Owen et al., 1989; Romeij & Atkinson, 2011).
    The main result of the Condorcet jury theorem is quite robust.


    Given its robustness, we can start thinking the Condorcet jury theorem as being,
    in many cases, a lower bound on the power of information aggregation. The two
    main ways in which the Condorcet jury theorem offers only a lower bound to the
    power of information aggregation is that it grants each voice the same weight,
    regardless of its likelihood of being correct, and that it offers no opportunity
    to add new, potentially superior, options. Fortunately, in many cases of actual
    information aggregation, more weight can be put on some voices than others—for
    instance, because we are able to track their past performance or evaluate the
    reasons they provided to defend their opinion. This has the potential to greatly
    enhance the power of information aggregation. Likewise, the aggregation of information
    can allow the creation of new ideas and solutions that no individual could have
    thought of on their own (e.g., Page, 2007). It thus seems that information aggregation'
  merge: -1
  pgno: 298
- img_proc: true
  md: '# A PARADOX OF INFORMATION AGGREGATION 303


    has a huge potential to improve on individual decision-making (for review, see,
    e.g., Landemore, 2013).


    # We Are Good at Information Aggregation


    That information aggregation has a lot of potential does not mean that people
    can make the best of it. In some cases, information aggregation cannot be performed
    optimally simply because people do not have the relevant information—they do not
    know which opinion is held by the majority, or they cannot learn of the reasons
    why different people hold different opinions. Here, we will look at cases when
    the relevant information is available. This review focuses on work in experimental
    psychology, looking at two questions in turn: Are people able to take reliable
    cues into account the way they aggregate information? Does this yield consistent
    improvements in their decision-making? (For in-depth reviews, see Mercier [2016,
    2017, 2021]; Mercier & Morin [2021]; Mercier & Sperber [2011, 2017]; Sperber et
    al. [2010]).


    # Plausibility


    People use their prior knowledge to evaluate the plausibility of communicated
    information. Information that is more coherent with our prior knowledge is more
    likely to be accepted (e.g., Bonaccio & Dalal, 2006; March et al., 2012; Petty
    & Cacioppo, 1979; Yaniv, 2004).


    # Majority


    Do people know when they should follow majority opinion? On the whole, yes. People
    put more weight on the majority opinion when the majority is stronger and when
    the group to the majority belongs is larger (R. Bond, 2005; Gerard et al., 1968;
    McEbreath et al., 2005; Morgan et al., 2012). People are also able to discount
    majority opinions when the opinions clearly not been acquired independently by
    the members of the majority (Mercier & Miton, 2021). However, there are also cases
    in which people do not weigh majority opinion properly. This is most likely to
    happen when'
  merge: -1
  pgno: 299
- img_proc: true
  md: 'information is presented in a somewhat abstract format. For instance, knowing
    that a given percentage of a population supports an opinion has less effect than
    seeing a number of individuals holding the same opinion (Mutz, 1998). Similarly,
    knowing that several individuals tend to have highly correlated opinions doesn''t
    lead to their opinion being discounted (Kroll et al., 1988; Maines, 1990).


    # Benevolence


    One of the dangers inherent in the aggregation of social information lies in the
    conflicts of interests between senders and receivers. Through their communication,
    senders might seek to manipulate receivers in ways that serve senders'' interests
    but not receivers''—for instance, they can lie. One reading of the literature
    on lie detection suggests that people cannot readily discern from honest statements
    (e.g., Global Deception Research Team, 2006). This pessimistic conclusion, however,
    largely stems from a combination of two factors. First is an over-reliance on
    explicit judgments about what cues people think are related to deception—for instance,
    averted gaze, which is not a reliable cue to deception. In fact, people do not
    so much rely on the cues they explicitly think are valid. Instead, they rely on
    more reliable cues, such as inconsistency or vagueness in the statements being
    evaluated (Hartwig & Bond, 2011). The second factor is that most lie-detection
    experiments require people to detect lies in the absence of any reliable cue to
    deception, such as background information (e.g., who has a motivation to lie).
    When such information is available, people make good use of it (C. F. Bond et
    al., 2013). On the whole, the experimental literature suggests that people are
    quite apt at detecting who is likely to attempt to deceive and to discount their
    statements appropriately. However, they do not so using the cues on which most
    work has focused—behavioral cues—relying on more reliable cues, such as senders''
    incentives.


    # Confidence


    In order to make sound decisions, people must be able to judge the degree of certainty
    with which they hold different beliefs (even if they do so using rough heuristics
    [Koriat, 2018]). It is likely that humans, along'
  merge: -1
  pgno: 300
- img_proc: true
  md: 'A PARADOX OF INFORMATION AGGREGATION 305


    with many cognitively complex animals, are endowed with mechanisms that track
    levels of confidence in their beliefs. Humans are arguably endowed with mechanisms
    that allow them to communicate these degrees of confidence (Shea et al., 2014).
    To the extent that people are truthful, it would then make sense to take these
    communicated levels of confidence into account when aggregating information. Indeed,
    people seem to communicate degrees of confidence optimally (Bahrami et al., 2010).
    Moreover, people quickly become wary of speakers who abuse confidence signals
    by being consistently overconfident (Vullioid et al., 2016).


    # Competence


    People can take a variety of cues to competence when deciding how much to put
    on an individual’s opinion. They can look at past performance or social markers
    of competence (e.g., believing a doctor’s medical opinions) (e.g., Harvey & Fischer,
    1997; Petty & Wegener, 1998). It has been suggested, however, people tend to be
    too generous in their attribution of competence, following a kind of halo effect
    (Cooper, 1981) or prestige bias (Henrich & Gil-White, 2001). In either case, people
    would be deferential towards sources whose competence is suggested only by weak
    or irrelevant cues, from how admired someone is to how beautiful they are. Some
    experiments suggest that people might be weakly influenced by such cues but only
    when the decision is inconsequential and when more reliable cues are not available
    (e.g., Chaiken & Maheswaran, 1994). On the whole, people seem to appropriately
    restrict attributes of expertise to the proper domain of expertise (e.g., a doctor’s
    medical opinion will be weighted more than their opinion in other domains). If
    anything, given the enormous differences in expertise we encounter, we tend to
    underestimate the competence of experts, relative to ours, and thus to not put
    enough weight on their opinions (e.g., Motta et al., 2018).


