    novel skeptical argument based on the problem of what we''ll "bad bias." This
    skeptical argument, we believe, raises a serious challenge to the possibility
    of reasonable public discourse. Even so, reflection on the argument also points
    toward new ways of confronting this challenge—a challenge that arguably goes to
    the heart of democracy itself.


