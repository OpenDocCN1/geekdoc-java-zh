    # Bias and Reliability


    In this section, we address a topic that has already been broached, viz. the connections
    between being biased and unbiased and being reliable and unreliable. It’s natural
    to think that there are straightforward connections between these notions. After
    all, claims such as “biased sources of information are unreliable sources of information”
    or “biased sampling procedures are unreliable” seem like platitudes. However,
    we think that the connections here are less straightforward than one might initially
    think, in ways that are philosophically interesting.'
