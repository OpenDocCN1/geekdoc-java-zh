    # Popularizing the Wisdom of Crowds


    I have argued that people are endowed with a set of cognitive mechanisms that
    allow them to efficiently aggregate information in a range of contexts. Unfortunately,
    people increasingly function within institutional frameworks that put stringent
    limits on their ability to aggregate information (e.g., limiting students'' ability
    to work in groups). Many of our institutions are thus far from making an optimal
    use of our abilities to aggregate information. This failure stems from a combination
    of many factors. One factor might be the apparent difficulty in grasping the power
    of information aggregation and the widespread pessimism regarding others'' ability
    to make good use of information aggregation.


    In recent years, mounting evidence has started to buck the trend. In some countries
    at increasingly more on collaborative learning. We find analogous moves in other
    domains, for instance, the increased use of teams in decision-making and forecasting.
    We might even hope that this evidence-based optimism toward the power of information
    aggregation spreads further. The popular success of books such as Surowie''s The
