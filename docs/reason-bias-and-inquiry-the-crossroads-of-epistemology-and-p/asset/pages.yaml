    Like expert rationalizers, expert bullshitters exercise skill in crafting their
    bullshit so it is not easily detected and not easily debunked. Both figures can
    be understood as engaging in a kind of pretense (although only the bullshitter
    requires an audience apart from themselves). The bullshitter succeeds if they
