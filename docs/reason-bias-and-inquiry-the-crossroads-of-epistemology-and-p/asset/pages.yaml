    # Learning Potential and Knowledge Futures


    Even if children are relatively calibrated in terms of what is knowable through
    direct and indirect experience, they still might make systematic errors when estimating
    how much they currently know and how much they could know in the future. It is
    well documented that young children are much more optimistic about their futures
    in traits and abilities (Boseovski, 2010; Lockhart et al., 2002, 2008). Thus,
    younger children think it much more likely that they, and their peers, will end
    up as adults with above-average levels in traits such as intelligence, attractiveness,
    and athletic ability. Could this extend to their views about their future knowledge
    in terms of learning potential? There are at least two reasons to think it might
    not. First, even preschoolers are sensitive to the fact that adults can vary in
    their degrees of expertise (Kushnir et al., 2013; Lutz & Keith, 2012). If children
    see this variability in knowledge as greater than that for physical and psychological
    traits, they might not think it is likely that most people''s futures will be
    greater than average in all areas. Second, knowledge can be more transient than
    most physical traits. One can always forget, learn new bits of information, and
    change one''s mind. This greater instability of knowledge compared to traits might
    reduce optimism about what can be learned.'
