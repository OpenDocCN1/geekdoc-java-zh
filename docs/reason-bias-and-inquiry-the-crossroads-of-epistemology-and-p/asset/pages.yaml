    to the shooting varied wildly. As Brown could not speak for himself, investigators
    relied lately on witness statements, which portrayed a struggle in which Wilson
    chased and shot Brown. In the courtroom, much of the weight of the evidence turned
    on the testimony of Officer Wilson. Wilson described grappling with Brown, who
