    leading to attributions of conformity to others alongside denials of conformity
    in oneself.


    # Summary


    The different strategies people use when seeking information about themselves
    versus others have important implications for the conclusions they reach. When
    people rely on introspection to learn about themselves, they may overweight their
    intentions and motives and underweight important factors. Yet they rely on introspection
    because it feels directly accessible and accurate, more so than their behavior.
    Indeed, people rate their inner thoughts and emotions as more reflective and informative
    about who they are than their behavior (Andersen & Ross, 1984). This introspection
    illusion was first identified in research on people''s relative blindness to bias
    in themselves versus others, and it is to this line of work we turn now.


