    Also relevant to the question of change is much developmental evidence that reasoning
    improves with age and engagement (Crowell & Kuhn, 2014; Iordanou & Constantinou,
    2015; Iordanou & Kuhn, 2020; Iordanou et al., 2016; Kuhn, 2018; Papathomas & Kuhn,
    2017; Toplak et al., 2021). As well as argumentative reasoning, this improvement
    encompasses causal reasoning both early in life (Walker & Gopnik, 2014) and at
    least into the second decade (Kuhn et al., 2015). Moshman (2018) in fact notes
    this fact as a limitation of Mercer and Spicer''s (2011) account of argumentation
    as a tool to understand only in evolutionary terms. Conceptualizing reason simply
    as an evolved trait, Moshman draws away from its development, which involves both
    individual agency and social transaction.


    Developmental potential, furthermore, exists specifically with respect to the
    cognitive achievement highlighted in this chapter, namely progression beyond a
    univariate model to recognition of multiple variables contributing to an outcome.
    Kuhn et al. (2015) found this progression achievable among young adolescents by
    engaging them over an extended period in inquiry activities involving causal investigation
    and inference with phenomena that can be accounted for adequately in multivariable
    terms. Whether a comparable result is achievable in the case of adults engaged
    individually or with one another in issues in which they may have considered affective
    investment to be seen. The question, nonetheless, seems well worth investigating.


    Finally, not to be neglected is the epistemological dimension (Iordanou, 2016;
    Iordanou et al., 2019). Individuals of any age engage in serious course only because
    they possess a set of intellectual values reflecting a commitment to the belief
    that such discourse was the substantial effort it entails (Kuhn, 2009; Kuhn et
    al., 2011). The roots of this epistemological dimension are to be found early
    in life, with the idea of beliefs as subjective than direct copies of reality
    (Iordanou, 2016).


    Improving reasoning certainly will not by itself remind all that is wrong with
    prevailing modes of discourse. The character of discourse, like the other phenomena
    that have been considered here, is influenced by multiple factors. Still, discourse
    can never be any better than the thinking that goes into it. Nor can it be any
    more productive. Of the two dialogs in Box 14.2, only likely served to enrich
    its participants'' conceptualization of the issue discussed. Enhancing individual
    reasoning as a factor in improving discourse has not received as much attention
    as other factors, but it arguably warrants such attention by educators and more
    broadly. This is perhaps ever'
