  md: '# BIAS 13


    This list is far from a complete inventory. Nevertheless, it suffices to make
    the point that many different things can be biased, at least if one takes ordinary
    thought and talk at face value.


    Moreover, notice that this incomplete list is quite diverse, not only with respect
    to the range of items that it contains but also with respect to the fundamental
    categories to which those items belong. For example, on the one hand, we predicate
    bias of objects or concrete particulars, when we predicate it of particular people
    or coins. But, on the other hand, we are equally happy to predicate bias of things
    that aren''t objects at all. For example, when one says, “The judge arrived in
    a biased manner,” one attributes bias not to an object or a concrete particular
    (at least in the first instance) but to the process or procedure that the judge
    used in arriving at the decision.


    What do we make of that ordinary thought and talk attribute bias to such a diverse
    collection of things? Perhaps its is a big jungle, and there is not much more
    to be said on this front beyond. However we might try to impose some conceptual
    order on the jungle by pursuing another possibility. It might be that many different
    kinds of things can be biased, some of these are more fundamental than others,
    in the following sense: When one of the less fundamental is biased, it has this
    property in virtue of the relationship that it stands in something more fundamental,
    which also has the property of being biased.


    For example, suppose that a particular judge is biased with respect to some issue
    that is presented. Presumably, this is not simply a brute fact about the judge.
    Perhaps it is like this: The reason the judge counts as biased is that the way
    in which they arrive (or the way in which they arrive at it) is itself a biased
    process or procedure. The fact that the judge is biased about a certain question
    is thus grounded in the more fundamental fact that the way in which they arrive
    at a verdict is a biased process.


    Can this kind of analysis be generalized? We suggest that the following is a potentially
    fruitful project for philosophers and others to pursue in this


