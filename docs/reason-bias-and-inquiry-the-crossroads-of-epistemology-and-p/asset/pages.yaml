    # Interplay Between the Two Disciplines


    Each chapter is a distinct contribution, we find some overarching themes and questions
    arising from the volume as a whole. These themes and questions reveal something
    about what epistemology and psychology have to offer one another in conversation
    and collaboration. We offer two examples we as readers. We hope and presume that
    others will see their connections and resonances.


    In our first example, epistemology opens up avenues of inquiry for psychologists
    to pursue. Check and Pron describe perceptions of bias versus other, using a definition
    of bias that comes naturally to psychologists. Devoted to measuring things, psychologists
    deploy a statistical sense of the term bias. They ask whether their measures reveal
    the true statistical value of a variable or miss the target by a systematic amount.
    Bias is thus defined in terms of an outcome. In helpful contrast, Kelly and McGrath
    argue that outcome is secondary and primary for determining bias. So, to find
    bias, we instead need to understand the procedure used, rather than whether the
    outcome varies from the truth. This divergence in definitions of bias raises new
    questions. Could people, in judging their judgments, share Kelly and'
