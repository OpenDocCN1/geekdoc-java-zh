  md: '# What Types of Things Can Be Biased or Unbiased? Are Some of These More Fundamental
    than Others?


    Let’s start with a very general question: What types of things can be biased or
    unbiased?


    Clearly, not everything is of the right type. The number 17 has various properties
    (e.g., the property of being odd as opposed to even). But it doesn''t seem to
    make much sense to claim that the number 17 is biased or unbiased, and the same
    seems true of every other number. Similarly, most of the things that natural scientists
    theorize about, ranging from the very large (e.g., planets and universes) to the
    very small (e.g., subatomic particles), are not the kinds of things that we would
    naturally describe as biased or unbiased.


    On the other hand, it’s striking how many different types of things do routinely
    described in this way. It will be helpful to briefly survey some of the more salient
    categories:


    +   - We predicate bias of people or particular individuals. (We say “He’s biased”
    or “She’s biased” with respect to some issue or cluster of issues.)

    - We predicate bias of particular individuals in their social roles (e.g., “the
    biased judge”).

    - Similarly, we attribute bias to groups or collections of people (e.g., “the
    biased committee”).

    - We attribute bias to paradigmatically inanimate objects (e.g., “the biased coin”).

    - We talk about biased samples or biased data.

    - We attribute bias to temporally extended processes, practices, and procedures,
    as in “a biased admissions process” or “a biased job search.”

    - We attribute bias to sources of information or putative information (e.g., “NBC
    has a liberal bias,” “Fox News has a conservative bias”).

    - An especially important category for both philosophers and psychologists consists
    of mental states: We regularly speak of biased perceptions, biased beliefs, biased
    judgments, biased opinions, and so on.

    - Overlapping with the previous category, we frequently attribute bias to the
    outcomes of deliberative processes; thus, we talk about biased verdicts or biased
    decisions, and so on.'
