    Coupled with the restricted scope of the visual field, attentional resources are
    finite. Visual acuity is highest in the fovea, which is limited to the central
    2 degrees of the visual field (Rayner, 1998). All other input is encoded peripherally
    and therefore has much less precise detail. Because resources are taxed by the
    complexity of the surrounding environment, attention must be selectively oriented
    to some information at the expense of others (Treesman, 2006). As a result, where
    we direct our gaze shapes how acutely we see something and whether we see it all.


    Measures of eye-tracking uncovered systematic differences in attentional patterns
    across individuals. For instance, individuals who suffer from some eating disorder,
    such as anorexia or bulimia, were more likely than healthy individuals to attend
    to areas of their own bodies that they personally considered unattractive (Bauer
    et al., 2017; Roefs et al., 2008). People suffering from schizophrenia, a disorder
    that affects emotional processing, oriented their visual gaze toward emotional
    faces at the expense of attending to neutral faces, but were less than healthy
    controls to spend time attending to angry and sad faces (Jang et al., 2016). Individuals
    in a positive mood attended positively valenced images more than negatively valenced
    images, an attentional preference not present for individuals experiencing a positive
    mood (Wadlinger & Isaacowitz, 2006). Conversely, individuals with major depressive
    disorder attended to sad faces, while healthy individuals did not (Gotlieb et
    al., 2004). Psychological states of the perceiver shift the direction of attention
    and produce a selective and complete representation of the external world.


    Moreover, attentional patterns reliably differ as a function of group membership.
    For instance, individuals whose political ideology was left-wing were more likely
    to direct eye gaze longer to political posters from a liberal party than from
    a conservative party (Marquart et al., 2016). Racial group membership also predicts
    discrepant patterns of attention (Sternisko et al., 2017). Participants watched
    footage of a physical alteration between a White police officer and a White civilian
    on the side of the road. In the struggle, the civilian bit the officer''s head,
    and the officer returned with a blow to the civilian''s head. Eye-tracking results
    revealed that White participants looked significantly less often to the White
    police officer than did Asian participants.


