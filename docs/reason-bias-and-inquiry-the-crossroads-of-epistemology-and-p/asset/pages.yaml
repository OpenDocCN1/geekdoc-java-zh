    # Bias


    # Some Conceptual Geography


    Thomas Kelly and Sarah McGrath


    Our aim in this chapter is to help illuminate the concept of *bias.*¹ In the first
    section, we propose that a potentially fruitful project in this area is to identify,
    from among the many things to which bias is attributed, those that are fundamental
    in the order of explanation (e.g., that bias is frequently attributed to both
    people and their opinions, one of these can be understood in terms of the other?)
    In pursuing this project, we offer and defend a hypothesis, the *priority of processes*,
    according to which facts are made in follows are intended to apply to the phenomenon
    more grounded in more fundamental facts about biased processes and procedures.
    In the second section, we take questions about the relationship between one''s
    being biased and bias among its parts. In the third section, we offer an account
    of the concept of bias as it applies to human beings and other entities. According
    to this account, biases are dispositions to depart from salient symmetry standards
    in systematic, patterned, or predictable ways. In the final two sections, we offer
    some remarks about the way in which the concept of bias interacts with the concepts
    of *reliability* and *knowledge*,.


    ¹ Recent philosophical work on the topic of bias has primarily focused on the
    contested phenomenon of implicit bias. (For a sampling of the literature, see
    Brownstein & Saul [2016]; for an overview, see Brownstein [2017].) The point of
    deposit for this philosophical literature is the explosion of empirical research
    on implicit bias in recent decades within social psychology (e.g., the landmark
    study Greenwald & Banaji [1995] and, for a popular overview, Greenwald & Banaji
    [2013]). In contrast, the claims made in follows are intended to apply to the
    phenomenon of more general, with implicit bias as a possible special case.


    Thomas Kelly and Sarah McGrath. *Bias In Reason: Bias, and Inquiry.* Edited by
    Nathan Ballantyne and David Henning, Oxford University Press. 2022. Oxford University
    Press. DOI: 10.1093/oso/9780197636916.003.0002'
