  md: '# 14


    # Why Do People Argue Past One Another

    Rather than with One Another?


    Deanna Kuhn and Kalypso Iordanou


    Both educators and employers emphasize the importance of proficient thinking

    and learning in today’s rapidly changing contexts, more than one’s accumulated

    knowledge. Yet people do not exchange ideas all well. Serious public discourse

    is at a disturbingly low level in contemporary American society, largely confined

    to echo chambers dominated by sound bites and slogans (Barbera et al., 2015).


    The values of contemporary culture offer one explanation for this state of

    affairs. Here, we consider whether there exist more enduring factors than

    current ones, factors at the level of the individual. One of several possi-

    bilities is the dominance of emotion. T. S. Eliot wrote, “[W]hen we do not know,

    or when we do not know enough, we tend to substitute emotions for thoughts” (Eliot,
    1921/2023). Recent research shows that high effect is as-

    sociated with arguments that are far stronger; it only enhances the belief that

    an argument is more persuasive, what has been called the “illusion of argument

    justification” (Fisher & Keil, 2014).


    A second possibility is socially driven. We are motivated to protect

    beliefs, not exposing them to the views of others who may them.

    So we do not listen unless we already know we. “Tell me something

    i already know” is a regular request to guest by host Jordan Klepper

    Comedy Central’s The Opposition. In a more serious vein, in response to

    reporter’s query, “Do you think talking about millions of illegal votes

    dis dangerous to country without presenting the evidence?” the 45th US

    president said, “No. Not at all. Not at all, because many people feel the same

    we do.”¹ Agreement eliminates the need for any further standards of

    verification.


    ¹ Asked by David Muir, the anchor of ABC’s World News Tonight, of Donald Trump
    in January

    2017 (quoted in Andersen, 2017).


    Deanna Kuhn and Kalypso jordananou, Why Do People Argue Past One Another Rather
    with One Another? In: Reason,

    Blas, and Inquiry: Edited by Nathan Ballannie and David Manning, Oxford University
    Press. © Oxford University Press

    2022. DOI: 10.1093/oso/9780197636916.003_015


    *'
