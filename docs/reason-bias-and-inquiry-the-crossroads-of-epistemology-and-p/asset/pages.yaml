    In this chapter, we call into question these assumptions. Drawing from decades
    of research across the social, cognitive, and vision sciences, we explore the
    limitations of video and the way in which individuals view it. These limitations
    and subjective viewing experiences combine to challenge individuals'' abilities
    to form a complete and accurate understanding of events depicted within. We confine
    our analysis to the impact of selective visual attention and discuss how people
    gather visual information in biased ways. We also describe people''s failure to
    scrutinize their beliefs about what they think they see. As a result, they hold
    a deep-seated faith in the reliability of their visual experiences and the erroneous
    belief that what they see is always an accurate and complete representation of
    the world. These tenets of visual experience do more than undermine lay intuitions
    about how perception functions. When they manifest during legal proceedings, they
    may shake the foundations of justice. We conclude by exploring the ways in which
    biases in visual attention can powerfully undermine a legal system that is currently
    turning to visual evidence for help.


    # The Limitations of Video Evidence


    Video evidence proliferates in legal arenas because of the belief that such material
    can provide a full, immediate account of events. Rulings in highprofile legal
    cases support this concept. For example, in Scott v. Harris (2007), a police officer,
    Timothy Scott, rammed the back of civilian Victor Harris''s car to end a high-speed
    chase, leaving Harris paralgic. Harris claimed the officer''s actions violated
    his Fourth Amendment rights against unreasonable seizure. Officer Scott claimed
    he was protecting the public from Harris''s driving. When the case reached the
    Supreme Court, a majority of justices granted summary judgment in favor of the
