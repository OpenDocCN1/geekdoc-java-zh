    McGr’s intuition and thus assess their bias in terms of the procedure followed
    in their reasoning? Do they instead judge biases in terms of outcome? Do they
    adopt differing definitions for judging the self versus other?


    In our second example, epistemology and psychology cross-pollinate in the opposite
    direction. Some concepts arise only from empirical psychological research. Take,
    for example, notion of naive realism: people’s presumption that they see and understand
    the world as it really is. In the grip of naive realism, a person allows biases
    to exist mainly if not exclusively in other people. Else one own knowledge is
    much more objective than that of others. Its truth is self-evident. The issue,
    known from psychological research, is that presumed self-objectivity is often
    an illusion. People may see the world as it truly is while failing to notice how
    their perceptions and beliefs are based on assumption, interpretation, and bias.
    Pronin and Cheek consider the phenomenon in the realm of opinions whereas Granot,
    Jones, and Balcet show how far naive realism extends to visual perception. But
    what sort of challenges does realism bring for classical issues and arguments
    in philosophy? How many philosophical topics look different in view of naive realism?
    In his chapter, Chris Tucker explores the bearing of empirical findings on one
    epistemological theory, and reassessment for other themes and theories awaits.


    # The Co-Editors’ Peroration


    Reason, Bias, and Inquiry comprises a multidisciplinary meditation for readers
    who are awash in information but also uncertain about how to manage it all properly.
    Struggling through the challenges that await our world and society in the coming
    decades becoming more clearheaded about being cleared. We hope the volume encourages
    productive discussion and new collaboration.


    In sum, gaining insight into reasoning, inquiry, and bias has been an ongoing
    task that each generation throughout history has found to be crucial. The importance
    of that task has never waned, even as scholars achieve more insight into how reasoning
    works and how it ought to work. Indeed, in our generation, making gains in this
    broad area of investigation may be even more critical than it was for our forefathers.
    After all, the stakes have gone up. Humankind presently fights three horsemen—digital
    misinformation, political polarization, and a global pandemic—and one wonders
    if a fourth will'
