    # # Bias in a Biased System


    # ## Visual Perceptual Prejudice


    Jessie Munton


    The term *bias* is used in a variety of ways. We often use *bias* colloquially
    to mean a kind of prejudice against a particular social group. This is the sense
    in which we talk of *implicit bias* grounding discrimination or of a system that
    is unfairly *biased* against a racial minority, for instance. This sense is inherently
    fraught with a negative valence: it has problematic ethical hotspots, and it is
    also assumed to be epistemically flawed, either in inaccurate information or irrational
    cognitive processes or to liberate flawed reasoning downstream of it.¹ We can
    call this kind of bias *prejudicial bias*. Prejudicial bias generally concerns
    demographic groups: people of a particular race, gender, sexual orientation, or
    class.

    But bias also has a thinner, formal sense, meaning any kind of weighting in a
    testing process that systematically skews the outcome. This is what we have in
    mind when we talk of a *confirmation bias*, for instance, when a process is skewed
    toward producing results which confirm a previously endorsed hypothesis. In this
