    # Perceptual Dogmatism versus Naive Realism


    In Chapter 6 of this volume, Granot, Jones, and Balcetis attack a position they
    call “naive realism.” Since both perceptual dogmatism and naive realism are theses
    about perceptual experience, readers of this volume may wonder about their relationship.
    In the rest of this section, I explain naive realism, how an attack on naive realism
    might motivate an objection to perceptual dogmatism, and why Granot et al.''s
    attack fails.


    Naive realism has two components: “our perceptual experiences are unbiased by
    biases, and therefore, true representations of what we lay eyes on” (see Chapter
    6). The first is a claim about a perceptual experience’s causal history: The causal
    processes that produce experience do not systematically privilege any information
    with regard to how quickly it was processed, how frequently it was processed,
    or how intensely it an emotional display (e.g., moderately happy vs. very happy).
    The second is a claim about the accuracy of perceptual experience’s content: All
    contents of the experience are accurate⁷


    Naive realism, then, is a claim about the causal history and accuracy of perceptual
    experience. It is descriptive rather than evaluative. To be sure, the term *bias*
    is often used as a negative evaluation. But that is not the way Granot et al.
    characterize it in their chapter. Whether perceptual processing is biased, by
    how they characterize it, is just the question of whether certain inputs get certain
    kinds of priority in the perceptual processing. It is a separate question whether,
    for example, is it good or rational for these inputs to have these kinds of priority.


    Perceptual dogmatism, in contrast, is an evaluative claim. In saying that perceptual
    experiences count as evidence no matter what, perceptual dogmatism is saying that
    it is rational (a positive evaluation) to trust them in the absence of countervailing
    considerations. I will make the relatively uncontroversial assumption that the
    accuracy of a perceptual experience—the truth/falsity of naive realism’s second
    component—makes no difference to whether an experience counts as evidence. In
    other words, it can be rational to rely on inaccurate perceptual experiences.
    Your perceptual experience


