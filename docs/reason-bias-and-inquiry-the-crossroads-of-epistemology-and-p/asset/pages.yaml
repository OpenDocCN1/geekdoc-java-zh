    # Conclusion


    Dogmatism is the claim that, necessarily, perceptual experiences provide one with
    prima facie justification to believe their contents (equivalently: necessarily,
    perceptual experiences provide one with justification to believe their contents
    in the absence of defeaters). We''ve seen that dogmatism faces a number of different
    challenges. I''ll forgive the psychologists if they conclude that dogmatism faces
    too many to be taken seriously; however, in philosophy, all views face many challenges.
    The goal is to figure out which view is least bad, and dogmatism is in the running
    for the least bad view of perceptual justification.


    The goal was to determine whether covert selection poses a new challenge to dogmatism
    or one of its explanatory ambitions. I''ve argued that it does not. Covert selection
    may raise a direct challenge to dogmatism''s truth. Which direct challenge it
    raises depends on what precisely covert selection is. If covert selection is analogous
    to cognitive penetration, then it raises the cognitive penetration challenge.
    If it is analogous to overt attention, then it raises the bad search challenge.
    Either way, the challenge to dogmatism is old news.'
