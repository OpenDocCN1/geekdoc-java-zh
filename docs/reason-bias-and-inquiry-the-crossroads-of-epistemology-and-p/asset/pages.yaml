    Further interest is the association of these reasoning types with both extremity
    of position and strength of feeling, where high affect could conceivably motivate
    thinking; also, however, it may constrain thinking, reducing attention to the
    possibility of alternative construals, whereas low in contrast may support more
    balanced thinking about an issue.


    A contrasting of causality, from cognition to affect, is also possible. Under
    this interpretation, a simplistic single-factor representation regarding an issue
    allows strong affective endorsement because the cognitive representation includes
    no competing considerations. A more complex multi-factor representation, in contrast,
    tempers high affect due to awareness of additional considerations, especially
    if they weigh upon directions. On similar grounds, more complex, richer cognitive
    representations of an issue should be associated with less extreme positions on
    the issue.


    Our findings were clear-cut. More complex thinking was associated with both less
    extreme positions and lesser affect. All 12 respondents who noted justifications
    on both sides indicated moderate (−1, 0, +1) positions on the issue. Of the larger
    group of single-justification respondents, the large majority, 90%, indicated
    extreme positions, with the multiple one-sided group intermediate (but more likely
    extreme). Extreme positions were also associated with high affect (an average
    of 8.0) compared to moderate positions (an average of 4.79).


    High affect could potentially enhance intellectual investment and thinking, leading
    to more nuanced, comprehensive thought; but there was no evidence that this was
    the case. Those reporting higher affective investment expressed less, not more,
    complex thinking. More likely, the evidence suggests, the potential influence
    of high affective investment is to constrain thinking.


