  md: '# DOGMATISM AND EPISTEMOLOGY OF COVERT SELECTION 153


    # Perceptual Dogmatism


    # Defining Perceptual Dogmatism


    Epistemologists like to annoy people, they invented a technical phrase, "X has
    justification to believe," that is roughly equivalent to more everyday locutions,
    such as "it is reasonable for X to believe" and "it is rational for X to believe."
    So understood, justification is a less demanding status than knowledge. It is
    usually assumed, for example, that you have justification to believe something
    false but that you cannot know something false. You might justifiably, or reasonably,
    believe that Chuck died in a plane crash on the basis of reliable news reports
    and footage of the crash; however, if he miraculously survived, then you do not
    know that he died in the plane crash.


    Some epistemologists like to show off their Latin, they invented another technical
    term, *prima facie justification*. For something to be a prima facie justification
    to believe P is, roughly, for it to be (a piece of) evidence that supports believing
    P. Some prima facie justifications are stronger than others because some pieces
    of evidence are stronger than others. And sometimes the counterevidence is stronger
    than the evidence. In such case, we say that our prima facie justification is
    *defeated*. Mike''s fingerprints on the bloody knife may be evidence that he did;
    however, such evidence might be defeated by a massive body of counterevidence,
