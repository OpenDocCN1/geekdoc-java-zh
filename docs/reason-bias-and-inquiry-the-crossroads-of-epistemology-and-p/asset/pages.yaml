- img_proc: true
  md: '# 228 NATHAN BALLANTYNE


    specifically, I defer to the majority on the basis of my understanding of how
    science works, the distribution of expert opinion, and the financial and political
    pressures have encouraged some scientists to dissent from the consensus.


    As a second example, here''s a story about an unnamed friend of mine. After the
    general election in the United States in November 2016, my friend started reading
    about foreign policy and international relations. He told me he wanted to understand
    the potential implications of an American withdrawal from the North Atlantic Treaty
    Organization and other pertinent questions concerning the threat of nuclear war.
    Touched a little by obsession, he devoured articles and analyses, finding sharp
    disagreements among experts. Insofar as it was possible, he checked the credentials
    and forecasting track records of the rival experts. But he said he couldn''t really
    gauge the credibility of most experts in order to sift out the most trustworthy
    ones. A few weeks after the presidential inauguration in January 2017, I asked
    him what he thought now. He said he wasn''t sure what to make of the complex issues,
    but told me he was ready to quit his foreign policy reading and get on with the
    task of constructing a fallout shelter in his backyard.


    A third example: In the 1970s and 1980s, Linus Pauling, the Nobel-winning chemist,
    asserted that mega-doses of vitamin C could effectively treat cancer. Pauling
    was dismissed by the medical community: High-dose vitamin C therapies didn''t
    work. But many patients and their families knew Pauling''s view and urged doctors
    to prescribe mega-doses of vitamin C. One oncologist remembered how, during Pauling''s
    heyday as supplement guru, families would pressure doctors to prescribe mega-vitamins.
    "We struggled with that," the oncologist recalled. "They would say, ''Doctor,
