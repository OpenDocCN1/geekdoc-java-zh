  md: '# WHY DO PEOPLE ARGUE PAST ONE ANOTHER? 327


    contributory versus alternative possible causes.³ We therefore asked about a specific
    past event: Why did Jane Doe—a middle-aged, working woman from the Midwest—vote
    for Donald Trump in 2016? We encouraged respondents to elaborate the causes they
    identified, asking “What went into her decision?” and “Is there anything else
    you can add?” To remove the possibility that respondents were constrained in their
    ability to envision possible causes, we showed them a list of possible causes
    but emphasized that these were simply for illustration and need not affect their
    response. Respondents were given $5.00 for their time.


    Of 24 respondents, 17 named just one cause, named five causes, and named three
    causes.³ Results differed little when we additionally asked why they themselves
    had voted for the candidate they voted (or would have voted for, if they hadn''t
    voted). Of the 24, 21 named a single cause, despite being prompted for anything
    else they might add.


    # Causal Reasoning and Discourse


    Single causes are not sufficient to account fully for most real-world events.
    Kuhn and Modrek (2018) investigated possible implications of single-cause thinking
    for discourse. If a single cause is regarded as sufficient to explain an outcome,
    we hypothesized, alternative causes may be seen as contradictory, with implications
    for discourse: Either your cause or your cause must be the correct one. To assess
    this possibility, we constructed the simple three-item assessment in Box 14.1
    and administered it to a cross section of 41 community.


    In the three parallel items, option A (see Box 14.1) makes another causal claim,
    failing to address the initial claim and as a result not serving to the stated
    objective of showing this claim to be wrong. Option B cites evidence with respect
    to an alternative sufficient cause; that is, the outcome may appear in the absence
    of the alleged cause due to another cause to


