    # Direct Versus Indirect Knowledge Acquisition


    One critical task is to learn what kinds of knowledge one could reasonably acquire
    on one''s own and what kinds must infer from others. To explore these intuitions,
    we developed a task that contrives a situation in which an individual can learn
    about the world through direct experience (Lockhart et al., 2017). We used a “deserted
    island” scenario: An individual grows up alone on an island that has no other
    people or traces of human activity, a situation that is extremely benign such
    the individual can be reliably nourished and physically comfortable. This scenario
    may seem quite implausible to adults, both child and adult participants found
    it easy to envision and reason about. In essence, we created a situation in which
    a person is a necessary autodidact (i.e., self-teacher), which ironically is the
    way much of early knowledge acquisition was traditionally discussed (Harris, 2001).


    There are several reasons to believe that young children might find it especially
    challenging to make inferences about what kinds of knowledge the deserted island
    person could and not acquire. It is, for example, well documented that young children
    have weaker monitoring abilities, that is, abilities to keep track of the person
    or situation (e.g., a book or museum exhibit) that provided them with new information
