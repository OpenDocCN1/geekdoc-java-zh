    was acquired either first-hand through direct experience or second-hand through
    testimony or supporting artifacts, 5-year-olds were surprisingly sophisticated.
    In terms of optimism about future knowledge states, the second set of studies
    showed that younger children were much more optimistic. Indeed, they were optimistic
    that there were few down effects in the younger ages. At the same time, children
    showed some resemblance to adults in terms of self-enhancement effects, and treating
    moral knowledge differently. Finally, in the studies pitting certainty against
    knowability, children showed the most dramatic shifts of all.


    How can we account for these early versus late abilities? Several factors may
    be involved. First, there appeared to be powerful general biases that apply to
    cognition far beyond epistemic judgments. These would include the early optimism
    bias and executive processing limitations on the ability to integrate information.
    As noted, the optimism has been found for beliefs about physical traits such as
    height, performance traits such as athleticism, and psychological traits such
    as shyness. In addition, the early optimism bias robustly occurs across diverse
    cultures (e.g., Lockhart et al., 2008). Apparently, the motivational value of
    seeing a very positive future is so strong that it trumps other factors.


    Executive processing limitations are evident in many different areas of child
    development. Difficulties in integrating competing sets of information can be
    found in mathematical reasoning (Blair & Razza, 2007), theory of mind tasks (Sabbagh
    et al., 2006), and reading (Sesma et al., 2009), among others. Such challenges
    were especially evident in the virtuous ignorance where younger children found
    it difficult to override confident but impossible-to-know assertions.


    A different way of understanding what develops considers the adaptive value of
    the various biases that were studied. We argued earlier that the optimism bias
    be highly functional because it encourages children not to give up in the face
    of their immediate failures when long-term gains seem so promising. In addition,
    over-optimism may have far fewer effects in young children because of a more protective
    caregiver environment. Indeed, this may be related to the tendency of younger
    children to see'
  merge: -1
  pgno: 349
- img_proc: true
  md: '# 354 FRANK C. KEIL AND KRISTI L. LOCKHART


    boasting behavior as much more benign and for adults to be more tolerant of boasting
    in young children (Lockhart et al., 2018).


    Adaptive or functional value may also explain why, when confidence was pitted
    against plausible knowledge, confidence won out in younger children. In general,
    adults and other seeing experts may be more likely to avoid deception and exaggeration
    when speaking to young children. It may be especially true because most of the
    adults that young children encounter are well-meaning individuals who have a deep
    interest in the child’s welfare. In such situations, a confident assertion may
    be more likely to be true than when a child is older and more likely to have discussions
    with peers and adult strangers who have less vested in the child having a positive
    outcome.


    It is perhaps surprising that young children are able to figure out what people
    know despite so little about how the world actually works. It is certainly possible
    to contrived cases where nuances of cognition and the causal structure of the
    world are elusive to young children; but all our studies, the most reliable result
    was that this did not seem to hinder them very much. Young children do quite well
    with highly fragmentary and incomplete understandings of perception, cognition,
    attention, and how all connect to real-world patterns. Their proficiency may suggest
    that all of them make such judgments quite and without much cognitive load. This
    would certainly be consistent with the ease with which adults and children are
    able to use appropriate markers in evidentiary languages.


    More generally, children’s adeptness at making appropriate epistemological inferences
    with highly incomplete and fragmentary knowledge may presage the surprising extent
    to which adults makes inferences in a similar manner. The “individualistic bias”
    applies to adults as well, albeit to a lesser extent.get of explanatory depth
    (Rosenblit & Keil, 2002) help to obscure the massive extent which our abilities
    to reason about the world are dependent on what others know or external records
    of information created by humans. Instead of viewing young children as having
    epistemological defects, they may be better understood as revealing a framework
    of foundational abilities that enable all of us to make knowledge inferences rapidly
    based on highly incomplete information.


    Early emerging abilities supporting assessments of what others know may be at
    the heart of what makes us human, namely the ability to create and navigate the
    divisions of cognitive labor that occur in all cultures, and indeed define largely
    what it means to have a culture. Given the shallow and'
  merge: -1
  pgno: 350
- img_proc: true
  md: '# KNOWING WHAT IS KNOWN 355


    incomplete nature of our knowledge, especially of the causal-explanatory kind,
    it is critical that we have a sense of what others know. Ideally, sense should
    include intuitions about what kinds of different individuals know as a result
    of their life experiences, the extent of knowledge in other minds, and the degree
    to which others approach maximum plausible knowledge in an area. Even 5-year-olds
    are able to partition communities into different groups of experts who have distinctive
    mastery in understanding causal patterns that underlie broad domains as physical
    mechanics or biology (Keil et al., 2008). Here, we have focused not on intuitions
    about such domains but rather on inferences about what is knowable given real-world
    contingencies. Such inferences are an essential part of mastering the division
    of cognitive labor. To defer to others appropriately, one needs to know whether
    one''s own knowledge is adequate for needs even when the information is in an
    expert''s domain and, if not, whether the expert is likely to have more of the
    relevant knowledge.


    # Conclusions


    By the time they begin formal schooling, children have a diverse set of intuitions
    about what is likely to be knowable by themselves and what is likely to be knowable
    at all. Younger children differ from adults by being more optimistic about how
    they and others will know in the future, and they are much more swayed by high
    levels of unfounded confidence; but they are nonetheless able to assess what knowledge
    is acquired through direct experience and what must be acquired second-hand. In
    addition, the early school years they soon master the abilities to override confidence
    and moderate their intuition, enabling them to benefit more richly from the divisions
    of cognitive labor that are such an essential part of all human cultures.


