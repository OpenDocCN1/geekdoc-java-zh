    ***


    To be sure, none of the considerations offered in this section cast doubt on the
    compelling idea that our biases often constrain what we are in a position to know.
    What they suggest is that a subtler account of the way in which the concept of
    bias interacts with the concept of knowledge will be needed in order to arrive
    at adequate methodological norms, as well as for other purposes.


    # Conclusion


    Especially compared to the amount of attention that bias has received from psychologists
    in recent decades, the topic has relatively underexplored by philosophers. Recently,
    this has begun to change, although it is fair to say, we think, the range of questions
    in this area that philosophers have pursued somewhat limited. In addition to the
    specific proposals offered, here we hope that one contribution of the present
    chapter is to draw attention to the range of broadly conceptual issues about bias
    that philosophers are well suited (even if not uniquely well suited) to address
    about possible relations of explanatory priority among the diverse types of things
    that can be biased or questions about the structural connections that obtain or
    fail to obtain between bias and knowledge). Throughout our discussion, we have
    emphasized how much our specific proposals leave open. Thus, even if these proposals
    are on the right track, much remains to be done—and all the more so if they are
    not.


