    Why should younger children be so much more optimistic about their knowledge futures?
    One concerns the adaptive value of being excessively optimistic early on (Bjorlund
    & Green, 1992; Lockhart et al., 2002). When children are young they learn at a
    very rapid rate and in many areas at the same time (e.g., simple rules of etiquette,
    how to find their way home, healthy foods to eat). They quickly progress from
    near total incompetence to serviceable knowledge or new physical skills. Greater
    optimism about what they can learn help to motivate them in the face of otherwise
    seemingly overwhelming ignorance and incompetence. In addition, given young children
    are usually protected from the consequences of their own ignorance by their caregivers,
    being overconfident as a preschooler about one''s current and future knowledge
    is unlikely to cause much harm. It can be a different story later on.


    A second argument concerns that this is quasi-rational for a young child to believe
    that one''s future knowledge is virtually unlimited. It is very difficult to have
    a sense of future knowledge potential if one knows very little in the present;
    the less one knows, the harder it is to gauge one''s ignorance (Dunning, 2011;
    Dunning et al., 2003). Given the tremendous progress that children make in knowledge
    acquisition (e.g., learning new words) it might seem very reasonable to them that
    such a trajectory would continue for the foreseeable future. But again, one must
    also learn to outgrow this early optimism or risk real-life consequences that
    occur through extreme overconfidence.


