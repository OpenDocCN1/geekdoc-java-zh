    # Covert Selection as Action-Like


    Allport''s account of attention might be taken as a polar opposite of Mole''s
    view. Recall that, on Mole''s view, covert selection is a type of cognitive penetration.
    Deed, covert and overt selection are so disunified that they aren''t analogues
    of each other (Mole, 2015, p. 222). In contrast, Allport treats covert and overt
    attention as deeply unified. He holds that of attention is a phenomenon at the
    level of the whole person (see, e.g., Allport, 2011, pp. 25–26, 49–51).¹9 It is
    a mistake to treat any subpersonal process, such as feature binding, as overt
    attention (covert attention). It is persons who attend, and attention is a relation
    between persons and to that which they attend.


    Once covert attention is thought of as a person-level relation, deeply unified
    with overt attention, covert selection becomes deeply cognitive penetration. Thus,
    you might expect a view like Allport''s to support a challenge to dogmatism that
    is importantly different than the one posed by cognitive penetration. And you''d
    right. But now the challenge posed by covert selection is just the challenge posed
    by overt selection, namely the bad search challenge.


