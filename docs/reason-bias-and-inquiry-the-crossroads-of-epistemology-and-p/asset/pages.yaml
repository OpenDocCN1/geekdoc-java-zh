    involve direct children learning about the distinctive properties of direct versus
    indirectly acquired knowledge. They might need to build up a large set of instances
    of knowledge acquisition as to whether the knowledge was acquired by the self
    or through others. This accumulated set of instances might enable them to notice
    certain commonalities among the two kinds of knowledge and how they contrast with
    each other. For example, they might notice that directly acquired cases tend to
    involve directly perceivable entities that were encountered through interactions
    with the world. Although this is not universally true as one can learn through
    an internal insight, such entities are certainly more central to directly acquired
    knowledge.


    Alternatively, children improve in their ability to engage in a form of problem-solving
    in which one figures out in real time the epistemological logistics of acquiring
    a particular kind of piece of information. epistemological logistics mean the
    coordination of several components of a complex knowledge acquisition scenario,
    such as timing, point of view, working memory load, and information quality. Thus,
    one might realize that something typically happens too fast for a person to notice
