    # Naïve Realism and Biased Solicitation of Visual Information


    Despite ample evidence of discrepancies in visual experience, naïve realism persists.
    People continue to think that what they see is unbiased and accurate. We argue
    that one reason for this is the fact that people solicit visual information in
    biased ways. People form hypotheses about what a scene will be comprised of, what
    an alteration will entail, and how an event will unfold. They selectively scan
    and process resources towards visual elements that allow them to test and, more
    specifically, to confirm these hypotheses. Thus, people less frequently receive
    information that runs contrary to their beliefs and expectations about visual
    stimuli—a sort of visual confirmation bias (as Qu-Lee et al., press). Just as
    people interpret information in line with their pre-existing beliefs and weigh
    evidence more heavily that supports the conclusions they desire (Kunda, 1990),
    so too do people encode their visual surroundings and attend to them in ways that
    support their expectations (see Rajsic et al., 2017). For example, when scanning
    an image, people form a first impression of what the scene depicts. Their visual
    search patterns help inform those first impressions. When'
