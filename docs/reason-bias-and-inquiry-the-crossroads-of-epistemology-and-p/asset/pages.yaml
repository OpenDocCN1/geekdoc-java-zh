    **The Knowledge Latitude**: If you know something that is relevant to a question
    that you are trying to answer, then you should take that information into account
    in arriving at a view.


    In any case in which you know something that aligns with your self-interest, the
    knowledge latitude will instruct you to take that piece of information into account,
    even though the relevant judgment does not satisfy the conditions for being a
    considered judgment, in the semi-technical sense.¹19 Precisely because the relationship
    between bias and knowledge is not as straightforward as one might have initially
    thought, norms of the sort endorsed by Rawls and others threaten to exclude too
    much.


