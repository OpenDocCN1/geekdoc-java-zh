    Can We Be Reasonable?

    Bias, Skepticism, and Public Discourse


    Teresa Allen and Michael Patrick Lynch


    A long-standing and influential thought is that for democracies to function well—or
    perhaps to at all—they need vigorous but reasonable public discourse. The ideal
    is that they should be spaces of reasons—spaces where reasons for policy decisions
    can be exchanged and listened to. Yet there is mounting evidence suggesting that
    we are not only human beings to biases and errors in reasoning but we are also
    particularly bad at spotting when they are affecting us. As a result, one might
    suspect we should be deeply skeptical about whether public discourse can be reasonable.


