    Thinking of perception as a skill has other helpful upshots in endeavor to understand
    the nature of perceptual biases, both foral and prejudicial. In the first place,
    doing so moves us toward an understanding of visual perception as an active process
    that responds dynamically to environmental challenges. In practicing a skill like
    tennis or cookery we build through repetition a set of mental states capable of
    appropriately guiding the activity in question.¹¹⁷ Similarly, by repeatedly seeing
    a particular environment, we build priors that optimally guide our perception
    of that environment.


    This in turn directs attention to the role of the context in which the activity
    is practiced in honing the resultant skill. No matter how gifted an individual
    practitioner, their skills are inevitably limited by the environment they find
    themselves in. Practicing running on one surface hones our skills on running on
    that particular surface. An excessively narrow training environment may limit
    our capacity to flexibly adapt to a new surface. A bias needs not be rooted in
    an individual performance but in the field the game is played on or field consistently
    practiced on.


    Perceptual skill, too, recapitulates the learning environment. One way of avoiding
    prejudicial visual bias is to ensure that the individual “practices” on an appropriately
    varied set of samples. But their opportunities to do so may depend significantly
    on facts about social organization: Practices of segregation limit the learning
    sample and with the flexibility of the resulting skill. In doing so, they give
    rise to manifestations of visual prejudicial bias.¹⁸


