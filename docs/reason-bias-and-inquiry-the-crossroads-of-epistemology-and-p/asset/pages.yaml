  md: '196 JESSIE MUNTON


    I propose a schema for the evaluation of skilled activity of the following form:


    Skill: An individual $S$ is skilled at activity $\Phi$ relative to a goal $g$,
    environment $e$, and over timeframe $t$ if their practice of $\Phi$ in environment
    $e$ within timeframe $t$ is likely to position them to achieve goal $g$.


    ($$\text{is skilled at } \Phi$ = [S\text{ is skilled at } \Phi\text{ relative
    to a goal } g]$, in environment $e$, over timeframe $t$.)


    This general schema applies to the perceptual skill. There is no absolute standard
    of perceptual skill outside of the epistemic and practical goals we have at any
    one particular moment. An individual''s skill at seeing can only be evaluated
    relative to a goal, within a given environment and across some timeframe. The
    specification of the timeframe is closely tied to the delineation of the environment:
    How we delineate the timeframe will determine the quantity of change in the environment
    to which the visual system must adapt. For instance, if the context is to include
    a timeframe during it grows and then light again, a very different perceptual
    profile will be counted as skilled if the timeframe only includes daylight periods.


    For purposes, a crucial upshot of this evaluation of skill is that it will deliver
    competing evaluations relative to multiple goals. What constitutes seeing skilled
    relative to one goal may not constitute seeing skilled relative to another. In
    fact, the goals that perception serves frequently come apart. Even within the
    subset of an organism''s epistemic goals, there will be divergent ends such as
    representing local stimuli or retaining a sensitivity to unexpected novel items.
    We can derive competing evaluations of their perceptual skill relative to these
    different goals. There will be no single verdict on an individual''s perceptual
    skill without an ordering on goals that lets us integrate these competing evaluations.
    Ultimately, verdicts relative to one or another goal may remain more informative
    than any synthesis.


