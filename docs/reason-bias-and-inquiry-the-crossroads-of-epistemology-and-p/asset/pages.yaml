  md: 'A third, recently posed possibility is evolutionary. Humans have developed
    skills of argument not for debating one another but as a tool for promoting individuals
    in social contexts and thereby advancing personal objectives (Mercier & Sperber,
    2011). We do not seek to sharpen these views by means of intellectual exchange,
    nor is argumentation necessarily aimed at truth.


    These three possibilities at the level of the individual—emotional, motivational,
    and evolutionary—are not mutually exclusive and are most likely adaptive or interactive.
    The second and third ones, for example, are consistent with an individual''s concealing
    contradictory arguments or evidence for strategic advantage.


    In the remainder of this chapter, we focus on a fourth potential individual factor,
    one that is likely to interact with the others: an individual''s reasoning capabilities.
    Such capabilities, we know, show an identifiable course of development during
    the first decade or over the human life span and wide individual differences thereafter.
    Could these differences impose limitations on the effectiveness of the discussion
    and argument that people engage in? Although it is by no the only one, we ask
    this question with respect to a particular cognitive limitation to do with multivariable
    causation, which we will argue to be particularly damaging in a context of discourse.


    # Inferring Causes


    Reasoning about cause and effect is the most common form of reasoning humans engage
    in and the form most extensively studied by cognitive psychologists (Sloman, 2005).
    Criteria for inferring causes change during the first decades of life in ways
    that may seem paradoxical. Young children commonly recognize an event as causal
    simply because it co-occurs with an outcome. They later adhere to more rigorous
    criteria and begin to distinguish causality by covariation and may even become
    able to eliminate potential causes via controlled comparison.


    Surprisingly, however, young teens who have mastered controlled comparison are
    likely to attribute an outcome to a single factor, even when they have themselves
    demonstrated that other factors present also affect the outcome (Kuhn, 2007, 2012).
    Moreover, the single factor to which they attribute causal power shifts across
    instances examined, whether or prior'
  merge: -1
  pgno: 321
- img_proc: true
  md: '# 326 DEANNA KUHN AND KALYPSO IORDANOU


    beliefs influence these attributions. In everyday reasoning unconstrained by consideration
    of specific evidence, a single favored cause is likely to suffice to explain a
    phenomenon. Overeating, for example, adequately accounts for obesity.


    Further indication of a preference for single-cause explanations comes from a
    study by Gopnik et al. (2017). These authors studied causal inference patterns
    from age 4 through adulthood, reporting that 90% of 4-year-olds implicate an object
    merely present as causing in a machine light up. By age 12–14 and into adulthood
    this percentage dropped to 40%, even when participants witnessed cases in which
    two objects had been required jointly to produce the effect (and to less than
    10% when they had not noticed such cases). The remaining majority named only a
    single causal object. Gopnik et al. interpret this age difference as reflective
    of greater cognitive flexibility early in life. Yet the evidence noted a tendency
    to attribute an outcome to a single factor among children, Gopnik et al.’s data
    may simply reflect the weak criterion of occurrence to warrant a causal inference
    early in life that age becomes more demanding.


    # How Many Causes Produce an Effect?


    The preceding evidence suggests that by adulthood people have a strong preference
    to explain an event as the result of a single cause. Since most real-world phenomena
    of interest are contributed to multiple causes, such a tendency merits our attention.
    Our objective in what follows is, first to ask how broadly this tendency extends
    to adults’ thinking about everyday phenomena and second, to consider its implications
    for discourse about such phenomena. Toward this end, we describe two impromptu
    studies and one extensive, published study, concluding with a discussion of potential
    remedies.


    The first impromptu study consisted of observing a cross section of people at
    several Donuts coffee shops across a large city that had caused a specific event.
    We found only one previous study that had done anything similar. Strickland et
    al. (2017) asked participants from Mechanical Turk to “list as many causes as
    possible” for events such as “A woman is surprised.” Respondents named a mean
    of 3.65 possible causes (vs. 2.50 for a physical event, e.g., “A window breaks”).
    We can’t be sure, however that these were'
  merge: -1
  pgno: 322
