    # Intellectual Virtues and Vices


    My aim in this section is to provide a broad description of some key features
    of intellectual character virtues and vices. What follows is a list of nine properties
    of intellectual virtues and vices. The first five qualities are common to all
    character traits, including some, such as being tidy, that are not either a virtue
    or a vice. The final four properties instead are distinctive of virtues and vices.


    +   1. Virtues and vices are components of a person''s character. Qualities like
    courage or perseverance are deep features of individuals. They contribute to defining
    who people are; express people''s deeply held commitments and values (Annas, 2011,
    p. 9; Miller, 2013).

    2. Virtues and vices are stable over time and consistent across situations. That
    is, they are psychological qualities that are predictive of behavior across a
    broad range of situations and over extended periods of time. Individuals who display
    the behavior characteristic of a virtue or vice inconsistently or only occasionally
    are not thought to possess the relevant character trait (Miller, 2014).'
