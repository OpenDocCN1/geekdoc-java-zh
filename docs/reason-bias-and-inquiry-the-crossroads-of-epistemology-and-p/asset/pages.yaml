  md: '# 152 CHRIS TUCKER


    made me) wonder whether it raises a distinctive challenge to dogmatism, one that
    is importantly different from the challenges that dogmatism already faces. Epistemological
    issues concerning covert selection cannot be entirely divorced from the metaphysical
    ones (e.g., "No Direct Challenge"); however, I argue that no matter how the metaphysical
    issues get sorted, covert selection fails to provide a distinctive challenge to
    dogmatism. This chapter is good news for dogmatists. The fewer challenges to dogmatism
    there are, the more likely a dogmatist can resolve them all.


    For those who couldn''t care about dogmatism, you will be relieved to hear that
    what I say is of broader interest. For psychologists, perceptual dogmatism is
    a natural place to begin thinking about epistemology. The view is simple and intuitive,
    and yet it is connected to many major disputes in epistemology. By exploring how
    dogmatism can be challenged, you will be introduced to the field of epistemology.
    For philosophers, the epistemology of covert attention is a relatively new area
    with no established positions or overarching framework. A clear exposition of
    how covert assertion is related (or not) to a prominent position in epistemology
    is a natural place to begin understanding the epistemic significance of covert
    selection. By the end of the chapter, we will have a variety of ways in which
    covert selection might be epistemically significant.


    In the second section, I explain (perceptual) dogmatism and the jargon needed
    to state it more precisely. In the third section, I explain how cognitive penetration
    raises a significant challenge to dogmatism. In the fourth section, I explain
    how covert selection raises a distinct, significant challenge to dogmatism. The
    goal in these early sections is to identify a working idea of how covert selection
    would have to challenge dogmatism if it is to be importantly different from dogmatism''s
    other challenges.


    The remaining two sections of chapter admit that covert selection raises various
    challenges for dogmatism, but they contend that the challenges are ones that dogmatism
    already faces. In the fifth section, I argue that if covert selection poses a
    direct challenge to dogmatism''s truth (i.e., if it provides evidence that dogmatism
    is false), it will collapse into the challenge posed by either cognitive penetration
    or covert selection. In the sixth section, I consider whether covert selection
    might raise a new worry for an explanatory ambition of typical dogmatists. If
    so, then covert selection would pose an indirect challenge for dogmatism, removing
    a common motivation for the view. I concede that covert selection can raise such
    a challenge, but even here, the challenge is not new.'
