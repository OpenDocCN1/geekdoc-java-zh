    The third thesis, deliberative weighing, is illustrated by rationalizers with
    subjects who allow belief for reasons that are manifestly arbitrary. Adam Elga
    (2005) offers the example of his friend, Daria, who believes in astrology and
    clings to her belief in defiance of the evidence. When Daria is confronted with
    evidence that her belief in astrology was unfounded, she concedes that she is
    unable to find any contrary evidence to support her belief in astrology. The sole
    reason she provides for sticking to her guns is “Believing in astrology makes
    me happy” (p. 115). Daria''s endorsement of the truth astrology is totally unresponsive
    to her assessment of the evidence. As a result, she feels no pressure to provide
    reasons for endorsement. This distinguishes her case from that of the rationalizer,
    who does feel the pressure to appear responsive and whose rationalization is constructed
    so to cultivate this appearance.


    My proposal for reconciling the three constraints is to model the rationalizer
    as engaging in imaginative pretense. Rationalizers act as if they are guided by
    the aim of truth (believe *p* if *p*), when in fact they are guided by a related
    but distinct aim, the aim of plausibility. This latter aim requires only that
    the considerations that rationalizers adduce in support of their conclusions have
    the appearance—to the rationalizers themselves and sometimes to others—of constituting
    sufficient reason. Deliberative exclusivity is respected because rationalizers
    are modeled not as believers but as pretenders. Guidance by the aim of plausibility
    is compatible with the suspicion that the considerations do not in fact establish
    the relevant conclusion. Rationalizers are not naive. Deliberative weighing is
    satisfied because the product of rationalization bears an essential relation to
    the consideration that the rationalizer adduces. Rationalizers do not believe
    at will; rather, they engage in a pretense that is constrained by the evidence
    indirectly.


