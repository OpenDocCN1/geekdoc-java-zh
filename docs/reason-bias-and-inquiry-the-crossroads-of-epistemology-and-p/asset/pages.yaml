  md: '# 10

    Novices and Expert Disagreement


    Nathan Ballantyne\*


    I always follow orders when they make sense.

    —Colonel John Paul Stapp (1910–1999), US Air Force

    medical doctor, biophysicist, and rocket sled test driver


    When a true genius appears in the world you may know him by this sign; the dunces
    are all in confederacy against him.

    —Jonathan Swift, Thoughts on Various Subjects,

    Moral and Diverting (1706)


    We know little about the world without trusting experts. Experts themselves are
    in a similar predicament because the proliferation and growth of expert knowledge
    requires experts to trust other experts. But when we defer to experts, we sometimes
    encounter a serious challenge: expert disagreement. We novices need to determine
    which experts to trust. That challenge is the focus of this chapter. Here are
    three examples to focus the discussion.


    One recent meta-study is drawn from climate science research shows that 97% of
    climate scientists accept that climate change is caused by human activity. There
    is a consensus on anthropogenic global warming (Cook et al. 2013, 2016). Although
    I have watched my fair share of documentaries and have read scores of popular-articles
    on climate change, I am mostly ignorant about the empirical facts and theoretical
    models behind the consensus. I am neither a climate scientist nor a student of
    climate scientist. And yet I hold a view about the matter by deferring to the
    majority of the experts. A bit more


    * Material in this chapter is drawn from Nathan Ballantyne''s Knowing Our Limits
    (Oxford University Press, 2019) and is reproduced with permission of Oxford University
    Press through PLSear


    Nathan Ballantyne, Novices and Expert Disagreement In: Reason, Bias, and Inquiry.
    Edited

    by: Nathan Ballantyne and David Dunning, Oxford University Press. © Oxford University
    Press 2022.

    DOI: 10.1093/978019736916.003.011'
