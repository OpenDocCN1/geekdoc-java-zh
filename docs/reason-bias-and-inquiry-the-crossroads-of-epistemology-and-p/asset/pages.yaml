    # The Cognitive Penetration Challenge


    # The Challenge''s Distinctive Issue


    Philosophy is more fun than science. Science requires tedious experiments and
    lots of waiting around for results. Note the term necessarily at the beginning
    of dogmatism'' definition. Typical philosophical theories are such that, if they
    are true, they are true necessarily (i.e., no matter what). No matter human beings
    exist. No matter the laws of nature are. No matter. And this means we can gain
    philosophical understanding by thinking about stories or watching movies or imagining
    scenarios. At least, thinking about such things can lead to philosophical understanding
    so long as the story is possible. Because if it''s possible and a philophical
    theory is incorrect in the story, then it''s incorrect period. If the theory is
    true, then it''s no matter what.


    Science may have a central place in philosophy. Perhaps the leading scientific
    theories should contain philosophical theorizing in varying ways. Insofar as philosophy
    is concerned with what is true no matter what, it must go beyond what science
    tells us out about the ways things are—even beyond what science tells us about
    the laws of nature. As we assess the case for dogmatism, then, we need''t limit
    ourselves to what science has demonstrated the actual causes and contents of perceptual
    experience.


    Dogmatism is an equal opportunity employer: It doesn''t discriminate perceptual
    experiences on the basis of their causal history. In the absence of relevant counterevidence,
    it says that a perceptual experience provides justification to believe its content
    no matter how it is caused. In some cases, this'
