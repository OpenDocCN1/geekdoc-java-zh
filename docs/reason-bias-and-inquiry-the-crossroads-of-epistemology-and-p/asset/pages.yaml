    3B. There are other virtues and vices for which the multi-track model is not an
    equal good fit. For instance, some virtues motivate their possessors to bring
    about the circumstances which demand their exercise. Thus, the generous person
    may seek to bring about opportunities to express their generosity. In addition,
    some virtues, such as humility, integrity, and perseverance, fit practically any
    circumstances and thus require continuous exercise (see Webber, 2015).


