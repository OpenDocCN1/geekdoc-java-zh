- img_proc: true
  md: 'Such bias is reasonable for human activities like conversation—imagine a world
    in which people routinely disbelieved every single other person they told them
    chatting—but a truth may lead to costly gullibility in a digital world where the
    other person (if it is another person) shows no concern about maintaining honesty.


    # Concluding Remarks


    Better light a candle than curse the darkness.

    —William L. Watkinson (2009)


    I began this chapter with Confucius. Let me end with the sermons of William L.
    Watkinson. As Confucius initially pointed out, real knowledge involves not only
    awareness of a fact but also the confidence to act on fact. Much of this confidence
    depends on how people evaluate their expertise, but this chapter has pointed out
    all the ways in which evaluation can go awry. Knowing what you intrinsically requires
    knowing what you do not know, but the problem is the inherent invisibility of
    ignorance. People often fail to have a correct and authentic understanding of
    the shape and scope of what they do not.


    I have taken me as my mission in this chapter to light a candle and expose how
    difficult it is to see one''s own ignorance. The candle reveals how much darkness
    there is to curse. A Reader might think exposing all this darkness may not be
    it, but I believe the old master and Pastor Watsonkinson would disagree. As Confucius
    himself further admonished, when you have faults, do not fear to abandon them.
    Learning how difficult it is to recognize one''s ignorance may be an important
    initial step toward achieving knowledge as Confucius defined it. Lighting that
    candle, thus, may be an essential first step for the way.


