    # Knowing What Is Known


    Emerging Insights into the Limits of Individual andnDistributed Knowledge


    Frank C. Keil and Kristi L. Lockhart


    How do children come to understand what is known and what is knowable?

    This question differs from more classical epistemological questions about the

    ature of knowledge, including such issues as when knowledge requires cer-

    tainty and whether it requires evidence. Here, we focus on how children en-

    vision the limits and boundaries of knowledge and how those views change

    with age. In particular, we are interested in what kinds of epistemological\insights
    into knowledge boundaries emerge early in development, what ones

    take time to manifest themselves, and why this developmental pattern

    unfolds as it does. In doing so, we will make the additional claim that this\process
    is closely related to how children learn to master the division of cog-

    nitive labor that is intrinsic to all human cultures.


    It might seem that young children have very limited epistemolog-

    tutions given the classic literature on metacognitive development.

    , young children also have immense difficulties monitoring the

    contents of their own minds. They think they can recall for more items in

    memory in picture tasks that they really can, apparently doing a

    dreadful job tracking what information they have recently acquired through

    experience (Yussen & Levy, 1975). They sometimes report that they have

    ways known something that they have just learned (Taylor et al., 1994). Yet,

    young children also seem to master several nuances of evaluating testimony

    offered by others, showing a sensitivity to confidence, consensus, and prior

    relevant domain competence, among other indicators (e.g., Harris, 2012).

    Thus there seem to be areas where youngsters have epistemolog-

    insights and others where they are much more challenged. Our central

    question focuses on the ways in which children are so impressively com-

    pent and surprisingly limited in terms of what they think is known and'
