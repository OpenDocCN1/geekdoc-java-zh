    associate. This fact alone, does not establish that they tap in different constructs.
    It is possible that implicit measures’ divergence from explicit ones is the result
    of depriving people of the opportunity and motivation to examine their attitudes
    before acting on them (Fazio & Olson, 2003, pp. 303–305).


