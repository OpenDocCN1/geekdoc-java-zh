    # Causes of the Bias Blind Spot


    People’s denial of their own biases likely has a motivational component—people
    are generally motivated to see themselves in a positive light, and being biased
    is generally seen as a shortcoming (e.g., Kunda, 1987). However, the existence
    of a bias blind spot is not fully explained by motivation. In the Pronin et al.
    study, people did not claim to be susceptible to these negative personality limitations,
    such as procrastination or fear of public speaking—if anything, they rated themselves
    as slightly susceptible to these negative tendencies. The crucial difference between
    tendencies such as procrastination or fear of public speaking and the biases people
    deny is their relative cognitive availability: People are readily aware—and lament—their
    procrastination, whereas biases tend to operate unconsciously, leaving little
    trace of their occurrence. Cognitive accessibility is important because the strategies
    people use when assessing biases in themselves: introspect, searching for biases
    in thought processes. This internal search yields little evidence of bias because
    biases operate unconsciously. Although people have access to the outputs of biased
    thinking (e.g., a preference for a White job applicant over a more qualified Black
    applicant), they lack access (Nisbett & Wilson, 1977; Wilson & Nisbett, 1978).
    In contrast, when assessing the biases of others, people rely on extrapolation,
