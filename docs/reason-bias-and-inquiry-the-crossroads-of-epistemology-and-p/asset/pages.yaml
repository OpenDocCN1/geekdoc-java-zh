    # Improving Reasoning as a Factor in Improving Discourse


    A possible implication of the findings we have described here is that it may be
    productive to first seek ways to enrich people''s cognitive representations of
    complex social issues, in contrast, for example, seeking to temper their emotional
    investment. None of the studies that have been described were weigh the relative
    importance of cognition versus affect their effects on reasoning or discourse.
    Yet if thinking is sufficiently complex, it stands to constrain associated effect,
    for the reason the competing considerations are acknowledged and temper one another.


    Related to this claim is the finding that simply asking people to explain the
    function of a common object (such as a toilet) tempers their assessments of this
    thinking, reducing their initial estimates of their understanding of the causal
    mechanisms involved (Rozenblit & Keil, 2002; Sloman & Fernbach, 2017). A similar
    downward adjustment does not occur when people are asked for reasons for their
    sociopolitical views (Fernbach et al., 2013). Something is more required.


    The more common cognition-focused approach to enhancing the quality of people''s
    thinking on a complex issue has been to introduce factors that weigh on the opposing
    side, encouraging them to consider that perspective is already high, however,
    this may meet with resistance and is difficult to do. An alternative we have begun
    to explore is to instead lead individuals to contemplate the implications and
    limits of the position they are already committed to.


    In exploratory work with the immigrant topic, for example, we have explored introducing
    follow-up questions. If the respondent is favorable toward leniency, for instance,
    we ask whether the undocumented parents who brought their children to the United
    States should also be allowed to stay—the most frequent answer being yes. This
    leads to questions about others who might also be allowed to join them and ultimately
    whether US borders need to be limited at all. A parallel set of questions posed
    to participants who are against len in prohibit immigration entirely. Although
    these efforts are at an exploratory stage, we are interested to see what the effects
    will be of engaging people in contemplating the full implications of their positions
    and how doing so may enrich their thinking and even temper their commitment to
    these positions.'
