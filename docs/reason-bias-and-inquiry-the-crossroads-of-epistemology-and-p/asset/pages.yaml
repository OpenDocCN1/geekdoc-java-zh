  md: '# DOGMATISM AND EPISTEMOLOGY OF COVERT SELECTION 151


    To be direct is to be unmediated. If our desires influence our experience at all,
    there is presumably some sort of processing that mediates the influence our desires
    have on experience. For it to be an interesting question of whether our cognitive
    states penetrate our experience, the relevant sort of directness must be compatible
    with some kinds of mediation; otherwise, will be very easy to show that our cognitive
    states don''t penetrate our experience.


    Influence mediated by overt selection is controversially indirect (see Gross,
    2017, p. 3); insofar as influence is overt (cognitive'') selection, it is not
    penetration. It is controversial, however, whether influence mediated by covert
    selection is in the relevant sense, and thus is not clear what the relationship
    between penetration and covert selection. The disparate accounts of covert attention''s
    (and so covert selection''s) ontology only make the relationship more obscure.¹


    Suppose that your perceptual experience represents that the Black guy is holding
    a gun, where the experience from prejudiced selection, covert selection, or penetration.
    How, if at all, would these prejudices affect whether it is rational to believe
    what your experience tells you? With respect to evaluating the rationality of
    believing what your experience tells you, does it matter which of the three kinds
    of influence is it?


    This chapter explores these questions by considering the implications of covert
    selection for a controversial but popular position in epistemology, misleading
    labeled "perceptual dogmatism." Perceptual dogmatism holds, roughly, that a perceptual
    experience is always evidence that its representation is true. If your perceptual
    experience represents that the Black guy is holding a gun, then the experience
    is evidence that the Black guy is holding a gun. Indeed, perceptual dogmatism
    holds that it is evidence that he is holding a gun no matter how it is. If cognitive
    selection or penetration of an experience can make a difference to whether the
    experience is evident, then perceptual dogmatism is false.


    Overt selection (in the guise of bad searches for evidence) and cognitive penetration
    pose well-known challenges to perceptual dogmatism.³ The myriad accounts of attention''s
    metaphysics make one (at least, they)


    > ¹ I generally suppress the cognitive qualifier from here on out.

    ² Attention has been claimed to be, for example, a subpersonal capacity or mechanism,
    a certain kind of subpersonal process, a way processing has, a feature of experience,
    and a person-level relation between a thing and object.

    ³ Traditionally, the bad search challenges target most directly not perceptual
    dogmatism but the thesis that undefeated evidence suffices for justification.
    The challenge extends equally to perceptual dogmatism.'
