    # Strason on Freedom


    Strason draws a distinction between two different sorts of attitudes we might
    take toward others and our interactions with them. He refers to these the objective
    attitude and the participant attitude. When we take the objective attitude toward
    someone, we think about the person and our interactions with them in the way that
    a contemporary social scientist might. We think about what the person might believe,
    say, or in the light of the available-evidence that bears on those matters, and
    we seek to form an accurate opinion as possible. Taking the objective attitude
    involves treating the other person, as one''s beliefs about that person go, as
    an object of theory; and we do the best we can to make sure that our theories
    about other people are true.


    When we adopt the participant attitude, on the other hand, we do not distance
    ourselves from others in the way that the objective attitude requires. And it
    is precisely because we do not always, or typically, distance ourselves from others
    that we are susceptible to the reactive attitudes. We do not merely note that
    someone has betrayed our trust; we resent it. We do not merely note that someone
    has extended themselves to us at great personal expense; we feel gratitude. And
    so on.


