  md: '# Rationalization, Creativity, and Imaginative Resistance


    Jason D''Cruz


    # The Point of Rationalization


    My explanatory target is rationalization in the sense of spurious self-justification.¹¹
    I argue that we should model episodes of rationalization as fictional narratives
    in which the rationalizer plays the starring role. I bring this model of “rationalization
    as pretend” into communication with the philosophical literature on imaginative
    engagement in fiction and imaginative resistance, the phenomenon whereby an otherwise
    competent inquirer experiences difficulty in taking part in an imaginative activity
    (Gendler & Liao, 2016). While rationalization is most often modeled as a motivated
    biased, and thereby faulty, form of belief formation, it is easy to overlook that
    successful rationalization represents a kind of cognitive and creative achievement.
    The achievement consists in crafting a narrative whose rehearsal has the effect
    of eliciting desirable emotions and mitigating feelings of guilt or shame. In
    contrast to the intellectual activities of inquiry or doxastic deliberation, rationalization
    is an inherently creative undertaking. Rationalizing is the process of generating
    and rehearsing narratives that have the credible appearance of genuine inquiry
    but whose narrative aims at exculpation or self-justification.


    The empirical finding that inveterate deceivers tend to be highly creative individuals
    (Gino & Ariely, 2012) fits well with a picture of rationalization as an inherently
    inventive activity rather than a faulty investigative one. Ariely puts, “If the
    key to our dishonesty is our ability to think of ourselves as honest and more
    moral at the same time benefiting from cheating,'
  merge: -1
  pgno: 111
- img_proc: true
  md: '# JASON D''CRUZ


    creativity can help us tell better stories—stories that allow us to be even more
    dishonest but still think of ourselves as wonderfully honest people” (2012, 188).


    Rationalizers pursue aims in tandem. The first is to craft a story that has the
    right kind of narrative arc, most often one that explicitly or implicitly justifies
    behavior. The second aim is for the story to be plausible enough to sustain the
    suspension of disbelief. If things go right, the rationalizer feels little skepticism
    toward the story they connect, despite its inconsistencies. This allows them to
    respond to the imagined content with strongly felt emotion (Holland, 2008). In
    this way successful rationalizers mitigate feelings of guilt or shame and cultivate
    feelings of indignation or selfrighteousness. Successful rationalization is emotion
    regulation well rather than reasoning properly. (Of course, this is not to deny
    that rationalization brings with serious moral and practical liabilities.)


    Rationalization is typically post-directed, as suggested by the post hoc rationalization.
    In expanding our capacity or irrationality, rationalization can make us feel better
    about the things we have done. For example, we may generate a “just so” story
    about why a particular action does not count against our good character or good
    judgment. Everyone else is cheating, so my cheating leaves the playing field.
    Or, the reason I missed the deadline is that I''m a perfectionist about my work.
    But rationalization can also be anticipatory, helping to clear hurdles of conscience
    and conscience when we consider prudentially or morally dubious courses of action.
    Anticipatory rationalization has implications for practical reasoning. The hoc
    in post hoc may refer to decisions or inclinations relating to future actions
    after the actions themselves. Recent work by Shalvi et al. (2015) suggests that
    selfjustifications that take place temporarily to ethical violations enable people
    to continue to feel good about themselves while doing things they know or suspect
    to be immoral. “Previation” rationalizations serve to diffuse the anticipated
    threat to the moral self.


    Effective rationalization is useful, but it is not easy. Rationalizers do not
    simply arrive at their conclusions “will” in the way you could, for example, simply
    decide to imagine a brown bear in the corner of the room. Rather, the rationalizer
    must work skillfully with the available evidence. But since rationalizers do not
    aim at truth or understanding, they have a degree of


