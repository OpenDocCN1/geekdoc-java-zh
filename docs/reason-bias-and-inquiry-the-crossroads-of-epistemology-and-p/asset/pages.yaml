    The context in which the most cues relevant for information aggregation are available
    is that of a group discussion taking place between people who know each other
    (Michaelsen et al., 1989). Group discussion allows group members to express their
    confidence, demonstrate their expertise, and spell out the reasons behind their
    opinions. Reasons can be debated, reasons shot down, and good reasons accepted
    and elaborated on. As a result, the most reliable cues tend to win. For instance,
    when clear reasons are provided for the best answer to a problem, these reasons
    carry the day, even in the face of other cues, such as majority or confidence
    (Trouche et al., 2014). When reasons do not have such a perfect discriminating
    power, they still play a role; they are balanced out by other cues, such as majority
    (Laughlin, 2011). This explains why group discussion leads to consistent improvements
    in performance in a wide range of domains (for reviews, see Mercier, 2016; Sperber,
    2011), as long as some minimal conditions are met (group members must share some
    overarching goal, and there must be some disagreement within the group).


    # We Are Bad at Thinking About Information Aggregation


    The evidence reviewed so far shows that people take a variety of cues into account
    when aggregating information—cues that pertain to the content of the communicated
    information as well as to its source(s). More specifically, the evidence suggests
    that people are equipped with a set of specialized cognitive mechanisms that evaluate
    these cues but not in a way that requires conscious awareness of which cues are
    taken into account and why they are taken into account (with a partial exception
    for arguments). For instance, in the case of lie detection, people mostly take
    into account reliable cues to deception; when asked which to deception are reliable,
    they identify unreliable cues (e.g., gaze aversion). Here, I will briefly review
    some evidence suggesting people do not have accurate beliefs about the advantages
    of information aggregation.


    I have mentioned some studies suggesting that when people hold the same opinion,
    they are more likely to accept it. Other studies, however, suggest that when information
    about majority opinion is presented in a more abstract way (e.g., 90% of people
    surveyed agree with X), it is much less effective (Mutz, 1998). A recent study
    examined more precisely people’s grasp of the main result from the Condorcet jury
    theorem, revealing that'
