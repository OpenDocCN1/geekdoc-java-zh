  md: '# # Introduction


    Epistemology without psychology is like a dinner without food, pure tastes arranged
    in a series of sweets, salts, bitters, and acids.

    —George Boas, “Philosophy and Ritual,” *Proceedings and Addresses of the American
    Philosophical Association* (1951–1952)


    Questions surrounding reasoning, inquiry, and bias are among the most-during in
    human history. Ideas and theories about human reasoning and knowledge can be found
    in ancient philosophical writings, from Greece to China. Yet, to a great extent,
    these questions have never been more pressing—and unsettled—as they are today
    in our information-drenched contemporary society.


    Thus, it is no surprise that questions about reasoning, inquiry, and bias are
    examined in active and emerging discussions in the contemporary fields of epistemology
    and psychology. Despite their shared thematic interests, researchers in epistemology
    and psychology do not often talk together, read each other’s writings, or collaborate.
    This volume arises from the conviction that the separation of the two fields is
    both unfortunate and unnecessary. There are opportunities for real learning between
    the two fields.


    Consider a little thought. Imagine a researcher describes their work in three
    keywords: *knowledge, judgment, overconfidence*. Or suppose another researcher
    uses a different triad of terms: *irrationality, biases, expertise*. On the basis
    of such keywords alone, can you know whether a researcher hails from psychology
    or philosophy? We think not. There are practitioners in both fields who would
    naturally characterize their work along those lines. However, the two groups of
    scholars remain separated by their respective disciplinary boundaries.


    To be sure, the fields have real differences. Epistemologists dwell on normative
    matters, whereas psychologists focus on descriptive ones. Epistemologists often
    theorize in view of what is conceivable and broadly'
  merge: -1
  pgno: 7
- img_proc: true
  md: '# 2 INTRODUCTION


    possible, whereas psychologists tend to be constrained by what is real and measurable.
    Despite this, they often share intellectual curiosity about the same phenomenon.
    And they can bring complementary insights into inquiries—ones that inform across
    disciplinary lines and can combine to educate the non-specialist public.


    We offer this volume as a hint of fascinating and productive conversations that
    can happen when epistemologists and psychologists come together. Its chapters
    examine contemporary perspectives on reason, its pursuit (i.e., inquiry), and
    its potential obstacles (i.e., bias). No volume of its length can offer a comprehensive
    survey, but we bring to you ideas and arguments from one group of active researchers
    on these topics. The volume is structured around engagements between philosophers
    and psychologists, who attempt to characterize reason, inquiry, and bias as well
    as to describe ordinary people engaging in reasoning, inquiry, and bias.


    As we begin by noting, these issues are particularly significant in the present
    moment. While one can debate whether reason is the primary element needed to solve
    modern challenges, we believe our collective surviving and thriving will be impossible
    without it. A tremendous flood of information and argument is available at the
    click of a mouse or swipe of a screen, and the ability to reason what we read,
    see, and hear is indispensable.


    Many challenges underline just how important good reasoning becomes; we will limit
    ourselves to three examples. Consider the first tremendous information available
    to governments and citizens through networked computers. Much of it is accurate
    and valuable, but the internet is rife with misleading information and outright
    lies. The World Economic Forum in 2013 cited internet misinformation and its potential
    to produce “digital wildfires” as a threat to human survival, ako to the threat
    of antibiotic-resistant germs. So much dangerous chaos is mixed in the wheat,
    and it takes deliberation and discernment to separate the two.


    A second challenge is the rise of political polarization, which includes the politicization
    of science. As Theresa Allen and Patrick Lynch Lynch in this volume point out,
    successful democracy requires citizens who can reason together with empathy and
    humility. Some shared understanding of the basic facts on the ground is also important
    for functional debate. But recent surveys indicate that not only are Americans
    sorting themselves into extreme camps, measured by discordant attitudes, but they
    are also doing so emotionally. They do not merely disagree on the issues—they
    also express'
  merge: -1
  pgno: 8
- img_proc: true
  md: '# INTRODUCTION 3


    sheer disple with each other (Iyengar et al., 2019). For example, one-series of
    Pew surveys has tracked how much Americans view their political opponents with
    anger and fear, describing their opponents as threats to the country (Pew Research
    Center, 2016). The numbers have been on the rise for several years. Although this
    sharpening of affective polarization might be particularly pronounced in the United
    States, and so less elsewhere, other nations are on a similar upward path, including
    Canada, New Zealand, and Switzerland (Boxell et al., 2020).


    A third challenge arose late in 2019 when a novel virus began infecting around
    the world. The virus was quickly identified as a coronavirus (and given the formal
    name of SARS-CoV-2, although COVID-19 became the more popular designation), but
    beyond, governments, health authorities, and citizens were at a dead stop of knowledge
    about how the virus wreaks havoc and how it can be combated. What effects does
    it have on the body? How does one inhibit transmission? How can it be treated?
    Can vaccine be developed against it, and how can vaccines be effectively distributed?
    The world over, researchers rushed into a battle of inquiry to combat not just
    the virus but the sheer uncertainty surrounding how to fight it. Here, the importance
    of accurate reasoning and efficient inquiry came sharp relief. The importance
    of getting it right was underlined by a steadily death toll and dire economic
    consequences. At the time of writing, the ultimate outcome is unsettled, but broad
    questions loom over the effectiveness and readiness of certain fields of knowledge
    as well as the public’s understanding of expertise and science. A global health
    crisis helped to reveal an epistemological one.


    # The Volume’s Organization


    The volume is divided into three sections. In the first, "Rationality and Bias,"
    our authors explore the conceptual and empirical geography of reason and bias.
    These two concepts are rich and complex, having been understood in a variety of
    ways by theorists and experimentalists. Philosophers Thomas Kelly and Sarah McGrath
    begin their chapter by noting ways to attribute bias to people, groups, opinions,
    objects, and outcomes. Commonplace of "bias" has an untidy sort of disunity, and
    Kelly and McGrath raise an important question: Is there one type of fact that
    is fundamental, in the sense that other facts can be explained in terms of it?
    Facts about bias, they'
