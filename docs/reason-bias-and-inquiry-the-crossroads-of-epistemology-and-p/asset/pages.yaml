  md: 'We can now define prejudicial bias: An instance of formal bias is an instance
    of prejudicial bias when its effect is to impede a demographically neutral epistemic
    response to other individuals.


    What constitutes such a failure? We do not respond to others in a demographically
    neutral fashion when their demographic status plays a significant role in determining
    how we reason or acquire information about them. Corresponding to others in a
    demographically neutral epistemic fashion is inconsistent with able rates that
    encode social categories. Similarly, it prohibits the adoption of strategies for
    the extraction of information that vary depending on the profile of an individual.
    This leaves us unspecified: What constitutes demographic neutrality will vary
    depending on context.\16 But the definition at least gives us a handle on the
    way in which prejudicial bias is identified relative to a goal. We have a multitude
    of reasons for prizing the suspension of demographic bias in our investigation
    and evaluation of others. Some of these are ethical: Doing so promotes the real
    treatment of others. Some of them are distinctively epistemic: We value neutrality
    because it preserves our capacity to access information across different contexts,
    information that is particularly valuable to us when concerns other people. This
    criterion for distinguishing prejudicial bias is not formal: To apply it we attend
    to the contents of the relevant states. But prejudicial bias is still an epistemic
    significant category because the goal in question is an epistemic one. It determines
    how we gather and use information. We value the capacity to learn about others
    in ways that disregard their demographic status. It is against this goal that
    the category of prejudicial bias is defined.


    Take the case of face perception. The specialization of one’s capacities for facial
    recognition within a particular area of face space is likely to serve us well
    relative to the goal of reading and remembering the faces of those in our immediate
    familial or social circle. But we also value highly the ability to accurately
    read the faces of other individuals who fall outside of that group. This latter
    goal falls under the broader aeg of a demographically neutral epistemic response
    to others. So this specialization, though it constitutes a kind of skilled expertise
    over, is an instance of prejudicial bias.


    16 It might look like this overpredicts instances of prejudicial bias. It identifies
    prejudicial bias, for instance, when a doctor uses information about demographic
    categories to predict risk. I accept that these cases are instances of prejudicial
    bias but instances whose utility relative to other practical and epistemic goals
    outweighs the disutility involved in the loss of neutrality.'
