    2000). The kind of strength that is at issue is here of the associative link between
    two components of the attitude itself: the representation of the target object
    and a valence. The stronger the association, the more likely it is that anything
    triggers the representation of the object will also activate the valence (Fazio
    et al., 1986). So understood, attitude strength is a measure of accessibility.
    In what follows, unless stated otherwise, I will use the term attitude strength
    in this interpretation.


    Often, the term is deployed to signify some rather distinct aspects of attitudes.
    One is attitude extremity. extreme when someone is very positive or very negative
    about the target object. My negative attitude to liquorice, for example, is extreme.
    While there may be correlations between attitude strength and extremity, the two
    are conceptually distinct and have different effects on information processing
    (Brannon et al., 2007). Strength is also used to refer to attitudes that are important
    or central to the subject because they contribute to defining the self and are
    close to one''s values and commitments (Clarkson et al., 2009; Znick et al., 2017).
    Quite often, strength refers to attitude certainty, which concerns the subject''s
    confidence in their attitudes. This notion of attitude certainty, as should be
    clear, is itself ambiguous between two different notions. The first is correctness,
