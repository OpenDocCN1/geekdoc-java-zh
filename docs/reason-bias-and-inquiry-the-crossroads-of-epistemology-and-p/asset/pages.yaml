    # A Skill-Based Account of Visual Prejudicial Bias


    Why are these epistemic norms failing to capture the phenomenon in question? One
    reason is standard forms of epistemic evaluation focus on transitions between
    pieces of information, or the truth of processes that govern such transitions.
    In this way, they apply to processes that operate over a fixed body of information.
    We naturally think of perception as though it were such process: The immediate
    environment is fixed, and that determines the information available to the open
    eye as it views it. But that nature is misleading. Given the perceiving limitations
    on visual perception, it has to be selective even within a fixed environment.
    As a result, a significant part of the perceptual process involves a series of
    subpersonal "decisions" about available stimuli to focus on. What we need in order
    to capture the cases of visual prejudicial bias that have been described in an
    evaluation of the processes by which certain pieces of information, and certain
    interpretations of them, are prioritized others.


    But it is hard to perform such an evaluation in purely formal terms because these
    involve practical payoffs. Expertise and the exploitation of information in one
    area come at the cost of maximal exploitation and expertise elsewhere. Reliance
    on malleable priors inevitably gives to a dilemma between specialization within
    one particular context and flexibility across a range of different environments.
