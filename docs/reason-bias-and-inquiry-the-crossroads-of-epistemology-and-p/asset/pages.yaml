    how “well-informed” they considered themselves about civic and national affairs.
    Not surprisingly, respondents answered our quiz more correctly also rated themselves
    as more informed, as they should. Those who opted to say “I don’t know” more often
    rated themselves as less informed—again, appropriate. What was important, was
    the relationship between giving false answers and self-perception. The more respondents
    gave false answers to our questions, the more they rated themselves as well informed.
