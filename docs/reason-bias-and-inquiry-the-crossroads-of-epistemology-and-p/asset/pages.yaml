    as well.


    Psychological research over the past few decades has repeatedly demonstrated people
    have deep and persistent problems when it comes to recognizing the extent of their
    ignorance. They often fail to see the line where the solid ground of their knowledge
    ends and the shifting and dangerous soil of unknow begins. Real knowledge, the
    way that Confucius defined it, is something that people have much less than they
    realize (Dunning, 2005; D et al., 2004).


