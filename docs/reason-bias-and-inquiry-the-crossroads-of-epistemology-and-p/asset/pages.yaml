    # Reducing Pluralistic Ignorance and the Normalcy Blind Spot


    The normalcy blind spot results from both the fact that people misrepresent their
    internal states in public and the fact that people use extrapolation to assess
    others'' internal states. Thus, one strategy to reduce pluralistic ignorance and
    the normalcy blind spot is to educate people about others'' actual private views
    and experiences. Making private information known and available can decrease the
    deviance assumption and reduce pluralistic ignorance. For example, communicating
    rates of college students seeking treatment for depression and anxiety or of their
    experiencing discomfort with casual sex may help reduce individual students''
    feeling that they are alone having anxiety or that they are uniquely uncomfortable
    with casual sex. In the political realm, exposing citizens to the results of opinion
    polls can provide a novel source of information that is more accurate than extrapolation.


    An alternative strategy is to educate people about the limits of introspection
    as a means to assess others'' true inner states (and, consequently, as a means
    to draw conclusions about one''s own deviance). This approach parallels the strategy
    of reducing the bias blind spot by educating people about the limits of introspection
    (e.g., Pronin & Kugler 2007). For example, Schroeder and Prentice (1998) found
    that undergraduates assigned to participate in a discussion of pluralistic ignorance
    reported less drinking months later to undergraduates assigned to a control discussion.
    Thus, pluralistic ignorance and the normalcy blind spot can be addressed either
    by attempting to provide a better source of evidence of others'' inner states
    or by attempting to expose the limits of relying on extrapolation to seek out
    evidence of others'' inner states.


