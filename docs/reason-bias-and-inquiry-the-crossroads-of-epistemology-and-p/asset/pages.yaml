    # Three Demonstrations Illustrating Ignorance of Ignorance


    Many studies in psychology provide ample evidence that people cannot tell where
    their expertise ends and their ignorance begins. In three different paradigms,
    researchers easily catch people crossing the boundary between knowledge and ignorance
    without their noticing it.


    # Overclaiming Knowledge


    In our own lab, we have demonstrated this unknow step into ignorance by giving
    people simple surveys. We example, we give a list of common financial terms, such
    as stock options, revolving credit, and whole life insurance, and ask them how
    familiar they are with the terms (Atir et al., 2015). People show a good deal
    of familiarity with these terms, which is good.


    However, what is interesting is the familiarity they report with a special class
    of terms, such as fixed-rate deductions or pre-rated stocks. In one survey, over
    90% of respondents reported familiarity with at least one of these items. However,
    this presents a problem: these items are least ones we simply invented among ourselves
    in our office. These concepts do not exist. We have made sure they appear nowhere,
    for example, on the internet. Thus, there is no possible way for respondents to
    have any familiarity with them.


    Yet, respondents report knowledge of and familiarity with items that are impossible
    to know because these items do not exist. This phenomenon is known as overclaiming,
    and its existence has been known for decades in behavioral science (Paulus et
    al., 2003). In our studies, participants overclaim knowledge for “concepts” falling
    into philosophy, biology, and social science (Atir et al., 2015). They report
    familiarity with fictitious cities such as Cashmere, Oregon, and nonexistent politicians
    such as Michael Merrington.'
