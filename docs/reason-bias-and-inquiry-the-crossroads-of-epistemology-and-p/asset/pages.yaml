    # The Epistemology of Promises and Resolutions


    Berislav Marušić (2015) takes a Strawsonian approach to the epistemology of promises
    and resolutions. Marušić points out that people frequently make promises and resolutions
    to do things in cases where they have a good deal of evidence that they might
    not follow through. Thus, for example, a heavy smoker may resolve to quit smoking,
    knowing that they have tried to quit several times, on each occasion going back
    to their old habits fairly quickly. Private resolutions are surely not uncommon.
    By the same token, one may promise a loved one, in the very same situation, that
    one will quit smoking. Marušić is interested in whether one should believe, in
    these sorts of situations, that one will actually follow through one''s resolution
    or promise.


    Following Marušić, let us stipulate that we are dealing with a case in which,
    if one were to take an objective attitude toward one''s behavior, one could not
    reasonably believe that one will follow through. It would be epistemically unjustified
