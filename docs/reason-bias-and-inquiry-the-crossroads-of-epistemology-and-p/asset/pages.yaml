    # The Dunning-Kruger Effect


    The most extensive demonstration, however, that people know not where the geography
    of their ignorance begins from studies on the phenomenon that has come to be known
    as the Dunning-Kruger effect (Dunning, 2011; Kruger & Dunning, 1999). The effect
    asserts that people of poor expertise fail to recognize just how poor their expertise
    is. Actually, the theoretical claim is stronger. The claim is that people with
    poor expertise lack what they need to be able to recognize their shortcomings.
    It is not that they fail to recognize their deficits; instead, they are simply
    not in a position to recognize those deficits and should not be expected to do.


    The logic for this claim is rather transparent. No matter whether they are called
    inept, naïve, untrained or unskilled, people who suffer from the Dunning-Kruger
    effect simply lack the expertise they need to be able to recognize the expertise
    they lack. To recognize it requires the exact knowledge they fail to have. As
    such, they suffer a double curse: Not only are they incompetent but they are also
    too incompetent to recognize how deep their incompetence runs. Thus, poor performers
    often think they are doing just when they are doing anything (Dunning, 2019).


    By now, demonstrations of the Dunning-Kruger effect are varied and numerous. People
    performing badly on tests of logic, grammar, financial literacy, physics, and
    emotional intelligence overestimate how they think they are doing—often being
    most but not quite positive about their performance as top achievers (Kruger &
    Dunning, 1999); Sheldon et al., 2014; Williams et al., 2013; for a review, see
    Dunning, 2011). Students failing or nearly failing an exam in a college course
    and who are in reality performing at only the 13th percentile relative to their
    peers think on average that their performance puts them in the 60th to 65th percentile
    (Dunning et al., 2003; Schlöss et al., 2013). None of this is due to careless
    judgment on the part of respondents. Offering to pay participants up to $100 for
    accurate estimates of performance (in this, a logical reasoning quiz) does nothing
    to enhance how accurately respondents report their performances (Ehrlinger, 2008).


    The Dunning-Kruger effect is also evident outside our laboratory. Gun enthusiasts,
    participating in a trap-and-skeet shooting competition, did badly on a quiz about
    firearm care and safety were just as confident in their skill as those who did
    the best on the quiz (Ehrlinger et al., 2008). In medicine, residents completing
    their rotation in obstetrics/gynecology'
