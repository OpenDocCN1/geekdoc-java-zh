    # Rationalization, Imaginative Engagement, and Emotion


    For an episode of rationalization to mitigate feelings of guilt or cultivate feelings
    of self-righteousness, the content of the rationalization must be believable.
    By believable I do not mean the rationalizer is “able to believe” the story they
    tell. Fanny Dashwood, for example, is far too intelligent and far shrewd to be
    taken in an account that is so flimsy. We can be confident that for some reason
    the conclusion Dashwood reaches no longer valuable to her, she would quickly jettison
    the story. Dashwood''s story is believable in sense which we say that a novel
    or a film’s plot is believable; that is, it is amenable to being richly imagined,
    to being imagined in a way that engages emotion and desire. As the rationalization
    unfolds, Dashwood is able to cultivate felt responses of self-righteousness and
    even of indignation.


    Although most theorists think that there is a cognitive component to emotion,
