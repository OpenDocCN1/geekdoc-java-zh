  trans: "\n\n![](img/cover00115.jpeg)\n\n# JavaScript 快速面试题集\n\n**版权声明**\n\n保留所有权利。未经出版者\
    \ `Sandeep Kumar Patel` 书面许可，不得以任何形式或通过电子或机械手段（包括信息存储和检索系统）对本书进行任何复制——文章或评论中的简短引用除外。\n\
    \n书中使用的所有品牌名称和产品名称均为其所有者的商标、注册商标或商号。我与书中的任何产品或供应商均无关联。\n\n由 `Sandeep Kumar Patel`\
    \ 出版。\n\n## 目录\n\nJavaScript 快速面试题集 目录\n- 第 1 章 继承\n- 第 2 章 事件问题\n- 第 3 章 包\n\
    - 第 5 章 DOM 问题\n- 第 6 章 Date 对象\n- 第 7 章则表达式\n- 第 8 章 Canvas API 问题，第 9 章地理位置\
    \ API\n- 第 10 章 Web Workers\n- 第 11 章本地存储 (Local Storage)\n- 第 12 章 File API\n\
    - 第 13 章 Web RTC\n- 第 14 章拖放 API (Drag & Drop API)\n- 第 15 章 缓存 API\n- 第 16 服务器发送事件\
    \ (Server Sent Events)\n- 第 17 章杂类问题\n关于作者\n最后一点\n\n## 第 1 章 继承\n\n### Q. 如何创建一个类？\n\
    \n**答案**\n\nJavaScript 没有类定义。为了在 JavaScript 中模拟类，可以使用函数来声明。\n\n**示例：**\n\n让我们在\
    \ JavaScript 中创建一个学生类，接收 `name` 和 `roll` 两个参数作为属性。代码如下：\n\n```javascript\nfunction\
    \ Student(name,roll){ \n    this.name = name;\n    this.roll = roll; \n}\n```\n\
    \n### Q. 如何创建一个对象？\n\n**答案**\n\n可以使用两种方式创建 JavaScript 对象：\n\n**使用 `new` 关键字：**\n\
    \n为了从上面的学生类创建一个学生对象，我们可以使用 `new` 关键字调用 `Student` 函数。\n\n```javascript\nvar student1\
    \ = new Student('sandeep’,2)\n```\n\n**匿名对象：**\n\n可以使用包含属性名和值值对的大括号对来创建匿名对象。\n\
    \n```javascript\nVar rose = {'color’: ’red’}\n```\n\n### Q. 如何声明私有成员和公共成员？\n\n\
    私有成员使用 `var` 关键字和构造函数声明。\n\n```javascript\nfunction Student(name,roll){ \n   \
    \ var id= ABCD123;\n    this.name = name;\n    this.roll = roll;\n}\n```\n\n当创建一个\
    \ `Student` 对象时，可以使用点操作符访问 `name` 和 `roll` 属性，但 `id` 将无法访问，因为它表现得私有成员，并在调用时会返回\
    \ `undefined`。\n\n![](img/image00050.jpeg)\n\n上面的 Chrome 控制台显示已创建一个 `student1`\
    \ 对象。`name` 属性是可以访问的，因为在调用 `student1.name` 时显示了 sandeep。因此，`name` 是学生对象的公共属性。但\
    \ `id` 属性无法访问，在调用 `student1.id` 时返回 `undefined`。这表明 `id` 是 `student1` 对象中的私有属性。\n\
    \n### Q. 什么是原型属性 (prototype)？\n\n通过使用 `Prototype`，我们可以向现有对象添加`新成员`。每个 JavaScript\
    \ 对象内部都拥有这个属性。最初它是一个`空`对象。\n\n**示例：**\n\n```javascript\nfunction Student(name,roll){\n\
    \    this.name = name;\n    this.roll = roll;\n}\n\nvar student1 = new Student('sangeeta',30);\
    \ \nStudent.prototype.mark = 100; \n```\n\n查看下方的 Chrome 控制台了解原型的使用。\n\n![](img/image00051.jpeg)\n\
    \n最初 `student1` 对象只有 `name` 和 `roll` 两个属性。通过原型，学生对象添加了一个新属性 `mark`，其值为 `100`。现在控制台显示\
    \ `mark` 属性也被添加到现有的 `student1` 对象中。\n\n### Q. 什么是构造函数属性 (constructor)？\n\n**答案**\n\
    \n对象的构造函数属性维持着其创建函数的引用。\n\n**示例：**\n\n让我们通过创建一个学生对象并调用它的构造函数属性来查看示例。\n\n```javascript\n\
    function Student(name, mark){\n    this.name=name;\n    this.mark =mark;\n}\n\n\
    var student1 = new Student('sandeep',123); \nconsole.log(student1.constructor);\n\
    ```\n\n查看以下截图，在 Chrome 控制台中查看上述代码。控制台日志正在打印由 `student1` 对象引用的函数。\n\n![](img/image00052.jpeg)\n\
    \n### Q. 如何调用其他类的方法？\n\n**答案**\n\n使用 `call()` 和 `apply()` 方法，我们可以将不同上下文的方法应用到当前上下文。这对于代码的可重用和上下文绑定非常有帮助。\n\
    \n`call()`：它用于在给定的 `this` 值下调用函数，并逐个提供参数。\n\n`apply()`：它用于在给定的 `this` 值下调用函数，并以数组形式提供参数。\n\
    \n下面的代码有两个函数 `getTypeOfNumber()` 和 `getTypeOfAllNumber()`。这些函数的细节如下。`getTypeOfNumber`：此方法接收单个数字作为参数，并返回类型\
    \ `Even`（偶数）或 `Odd`（奇数）。\n\n`getTypeOfAllNumber`：此方法接收数字数组作为参数，并返回一个包含 `Even`\
    \ 或 `Odd` 的数组。\n\n```javascript\nvar MyNumber = {\n    getTypeOfNumber : function(number){\n\
    \        var type = (number % 2 === 0) ? \"Even\" : \"Odd\"; \n        return\
    \ type;\n    },\n    getTypeOfAllNumber : function (){\n        var result = [],i=0;\n\
    \        for (; i < arguments.length; i++){\n            var type = MyNumber.getTypeOfNumber.call(null,arguments[i]);\n\
    \            result.push(type)\n        }\n        return result;\n    }\n};\n\
    \nvar typeOfNumber = MyNumber.getTypeOfNumber.call(null,21);\nvar typeOfAllNumber\
    \ = MyNumber.getTypeOfAllNumber.apply(null,[2,4,5,7,8,21]);\n```\n（注：代码逻辑已格式化处理以便清晰）\n\
    \n### 请用示例解释方法覆盖 (method overriding)\n\n**答案**\n\n我们可以通过再次声明定义来覆盖 JavaScript 的任何内置方法。现有的定义可以通过\
    \ `prototype` 属性访问并覆盖。考虑下面的示例，`split()` 是字符串对象的内置方法。它的默认行为是将指定的字符串拆分为数组，它是 `String`\
    \ 类的成员函数。但我们使用其原型属性覆盖了它的定义。\n\n下面的截图显示了 `split()` 方法的内置行为。它将字符串分成了元素数组。\n\n![](img/image00054.jpeg)后续截图显示了\
    \ `split()` 方法的新覆盖定义。它现在返回“I am overriden”。\n\n![](img/image00055.jpeg)\n\n###\
    \ Q. 如何继承一个类？\n\n**答案**\n\n在 JavaScript 中可以使用 `prototype` 属性实现继承。\n\n![](img/image00056.jpeg)我们需要遵循两个步骤来创建继承。\n\
    \n**第 1 步：**\n\n子类原型指向父类对象。\n\n`<ChildClassName>.prototype = new <ParentClass>();`\n\
    \n**第 2 步：**\n\n重置子类的原型构造函数指向自身。\n\n`<ChildClassName>.prototype.constructor=<ChildClassName>`\n\
    \n**示例：**\n\n下面的示例显示 `inputFields` 类是 `Student` 类的子类。因此 `ScienceStudent` 对象可以使用\
    \ `showMyType()` 方法。\n\n```javascript\nfunction Student(name){\n    this.name=name;\n\
    }\n\nStudent.prototype.sayMyType = function(){\n    console.log(\"I am student\
    \ type\")\n}\n\nfunction ScienceStudent(name){\n}\n\ninputFields.prototype = new\
    \ Student();\ninputFields.prototype.constructor = ScienceStudent;\n\nvar student2\
    \ = new ScienceStudent('sangeeta');\nconsole.log(student2.sayMyType());\n```\n\
    \n"
- fmt: "\nDifferential Inheritance is a common prototype-oriented model that uses\
    \ the concept that most objects are derived from other, more generic objects,\
    \ and only differ in a few small aspects. Each object maintains a reference to\
    \ its prototype and a table of properties that are different.\n\n### Q. What is\
    \ `Object.create()` method do?\n\n**ANSWER**\n\nECMAScript 5.1 has this method\
    \ in its specification. This method can be used to create a new object with given\
    \ prototype object and properties. The syntax of this method is listed below.\n\
    \n`Object.create(proto[, propertiesObject])`\n\n**Example:**\n\nBelow code has\
    \ a `Student` class function with `name` property and the prototype object has\
    \ a method `getStudentName()` which return the name of the student. A new `student1`\
    \ object has been creates using `Object.create()` method by passing the prototype\
    \ object of `Student` with value of the name as `sandeep`. Then the `getStudentName()`\
    \ method is called on `student1` object and logged in the console.\n\n```javascript\n\
    function Student(name) {\n  this.name = name;\n}\n\nStudent.prototype = {\n  getStudentName:\
    \ function() {\n    return \"Name of Student is :\" + this.name;\n  }\n};\n\n\
    var student1 = Object.create(Student.prototype);\nstudent1.name = \"Sandeep\"\
    ;\n\nconsole.log(student1.getStudentName());\n```\n\nThe following screenshot\
    \ shows the output of the above code in the developer console.\n\n![](Images/image00059.jpeg)\n\
    \n### Q. Write a polyfill for `Object.create()` method if it is not present in\
    \ the browser?\n\n**ANSWER**\n\nECMAScript 5.1 has this method in its specification.\
    \ If the browser is old then `Object.create()` method is not present. To resolve\
    \ this we need to write a polyfill. Below code shows the polyfill for `Object.create()`\
    \ method.\n\n```javascript\n//check if create method is present inside Object\n\
    if (typeof Object.create != 'function') {\n  //define the create method\n  Object.create\
    \ = (function() {\n    var Object = function() {};\n    return function(prototype)\
    \ {\n      if (arguments.length > 1) {\n        throw Error('Second argument not\
    \ supported');\n      }\n      if (typeof prototype != 'object') {\n        throw\
    \ TypeError('Argument must be an object');\n      }\n      Object.prototype =\
    \ prototype;\n      var result = new Object();\n      Object.prototype = null;\n\
    \      return result;\n    };\n  })();\n}\n```\n\nThe above code checks if the\
    \ `create()` method is already present inside the `Object` using `if` condition\
    \ and comparing its type to `function`. If this condition true it means the `create()`\
    \ method is not present. Then the polyfill code block gets executes and assigns\
    \ the empty object to `Object.create` property.\n\n### Q. What is the purpose\
    \ of `Object.defineProperties()` method? **ANSWER**\n\nECMAScript 5.1 provides\
    \ `Object.defineProperties()` method to create new properties to a defined object.\
    \ It provides many configuration options to initialize these members. Below code\
    \ shows the use of this method.\n\n```javascript\nfunction Student(name) {\n \
    \ this.name = name;\n}\n\nvar student1 = Object.create(Student.prototype),\nproperties\
    \ = {\n  \"subject\": {\n    value: \"Computer\",\n    writable: true,\n    enumerable:\
    \ true\n  },\n  \"marks\": {\n    value: 0,\n    writable: false,\n    enumerable:\
    \ true\n  }\n};\n\nObject.defineProperties(student1, properties);\n\nstudent1.name\
    \ = \"Sandeep\";\nstudent1.subject = \"Mathematics\";\nstudent1.marks = 75;\n\n\
    console.log(student1);\n```\n\nIn the above code a `student1` object created using\
    \ `Object.create()` method. Then some new properties like `subject` and `marks`\
    \ are added to this object. The `enumerable` option decided whether the property\
    \ can be enumerated as own property. `writable` property decides whether the property\
    \ is modifiable or not. The `value` property takes the default value of the property.\
    \ Below screenshot shows the output of the above code in the developer console.\n\
    \n![](Images/image00060.jpeg)\n\n### Q. How can you distinguish scope and context\
    \ in JavaScript? **ANSWER**\n\nScope pertains to the visibility of variables and\
    \ context refers to the object to which a method belongs and can be changed by\
    \ using `call` or `applies`.\n\n### Q. What are two ways in which the variable\
    \ can be assigned to an empty object? **ANSWER**\n\nWhen creating a new empty\
    \ object, you can instantiate the `Object()` constructor or you can simply create\
    \ an empty object literal. In either case, you can then add properties to the\
    \ new object. The syntax of creating empty object is listed below.\n\n```javascript\n\
    var aEmptyObject = new Object();\nvar aEmptyObject = {};\n```\n\n## Chapter 2\
    \ Questions on Event\n\n### Q. How Event works?\n\n**ANSWER**\n\nEvent propagation\
    \ follows two phases: **capturing** and **bubbling** phase.\n\n![](Images/image00061.jpeg)\n\
    \n**Capturing Phase:**\n\nIn this phase, event first makes its way **downwards**\
    \ from the `DOCUMENT` to the `target` element by passing all inner elements.\n\
    \n**Bubbling Phase:**\n\nIn this phase event makes its way back **upwards** from\
    \ the `target` element to `DOCUMENT` by passing all outer wrapped elements.\n\n\
    ### Q. How to attach event to an element?\n\n**ANSWER**\n\nAccording to DOM Level\
    \ 2 Event Specification an event can be attached to an element using `addEventListener()`\
    \ method using **three** arguments.\n\n**Syntax**:\n\n`<element>.addEventListener(<eventname>,<eventcallback>,<booleanphase>)`\n\
    \n**eventname:**\n\nRepresents type of event as String parameter. For Example\
    \ `click`, `mouseover`, `mouseout` etc.\n\n**eventcallback**:\n\nThis represents\
    \ the callback function to be called for the event to be handled.\n\n**booleanphase:**\n\
    \nThis represents the phase of the event where the listener is attached. A `FALSE`\
    \ value represents the bubbling phase and a `TRUE` value represents a capturing\
    \ phase.\n\n**Example:**\n\nA click event listener is added to the document which\
    \ alerts a message when click occur.\n\n```javascript\ndocument.addEventListener('click',\
    \ function () { \n  alert(\"Insider Event Listener\");\n}, false);\n```\n\n###\
    \ Q. How to attach event prior to IE9 browser version? **ANSWER**\n\nIn IE older\
    \ bowser an event can be attached to an element using `attachEvent()` method.\
    \ Only For bubbling phase a listener can be added.\n\n**Syntax:**\n\n`<element>.attachEvent(<eventname>,<eventcallback>)`\n\
    \n**Example:**\n\nA click event listener is added to the document which alerts\
    \ a message when click occur. Below screenshot shows adding a click event in IE\
    \ 10 developer toolbar.\n\n![](Images/image00062.jpeg)\n\nExcept IE, the other\
    \ browser added by `addEventListener()` method. Below screenshot shows the demonstration\
    \ this method in Firebug.\n\n![](Images/image00063.jpeg)\n\n### Q. How to remove\
    \ event listener?\n\n**ANSWER**\n\nAccording to DOM Level 2 Event Specification\
    \ an Event Listener can be removed using `removeEventListener()` method. For IE\
    \ browsers `detachEvent()` method must be used.\n\nThe following screenshot shows\
    \ detaching click event handler from document for IE browser.\n\n![](Images/image00064.jpeg)\n\
    \nThe following screenshot shows removing click event handler from document for\
    \ Firefox browser.\n\n![](Images/image00065.jpeg)\n\n### Q. How setTimeOut() and\
    \ clearTimeOut() function works? **ANSWER**\n\nThe `setTimeout()` method calls\
    \ a function or evaluates an expression **once** after a specified number of milliseconds.\
    \ `clearTimeOut()` method stop the execution of the function specified in the\
    \ `setTimeout()` method.\n\n**Syntax:**\n\n`var timeOut = setTimeout(function,milliseconds,lang)\
    \ clearTimeout(timeOut)`\n\nBelow code shows the demonstration of these time out\
    \ methods.\n\n```javascript\nvar timeOutHandler= function(){\n  console.log(\"\
    inside Time Now \", new Date().getSeconds());\n  clearTimeOut(timeOut);\n}\n\n\
    console.log(\"Time Now \", new Date().getSeconds());\nvar timeOut = setTimeout(timeOutHandler,4000);\n\
    ```\n\nBelow screenshot show the execution of the `timeOutHandler()` method after\
    \ 4 seconds.\n\n![](Images/image00066.jpeg)\n\n### Q. How setInterval() and clearInterval()\
    \ function works? **ANSWER**\n\nThe `setInterval()` method calls a function or\
    \ evaluates an expression in specified **interval** of milliseconds. `clearInterval()`\
    \ method stop the execution of the function specified in the `setInterval()` method.\n\
    \n**Syntax:**\n\n`var timeInterval = setInterval(function, milliseconds) clearInterval(timeInterval)`\n\
    \nBelow code demonstrate these interval handlers.\n\n```javascript\nvar counter\
    \ = 0,\ntimeIntervaltHandler= function(){\n```\n"
