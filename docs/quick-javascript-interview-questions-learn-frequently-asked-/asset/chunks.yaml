    \ 6 Date Object\n\nQ. What is a JavaScript Date Object?\n\n**ANSWER**\n\nJavaScript\
    \ `Date` object returns time in that single moment. It contains the value in number\
    \ of milliseconds since 1 January, 1970 UTC.\n\nQ. What are the different ways\
    \ to create a `Date` object? Or what are the different constructor forms of `Date`\
    \ object?\n\n**ANSWER**\n\nJavaScript `Date` object has 4 overloaded constructors.\
    \ These constructors are listed below.\n\n```\nnew Date()\nnew Date(milliseconds)\n\
    new Date(dateString)\nnew Date(year, month, day, hours, minutes, seconds, milliseconds)\n\
    ```\n\nQ. How to get 1^(st) January 1970 in a date object, the date from where\
    \ time is gets calculated?\n\n**ANSWER**\n\n1st January 1970 is the day from where\
    \ the time is get calculated as number of milliseconds elapsed. It can be calculated\
    \ by creating a new JS object with parameter 0.below screenshot demonstrate the\
    \ date object with parameter `0`.\n\n![](Images/image00079.jpeg)\n\nQ. How JavaScript\
    \ counts months?\n\n**ANSWER**\n\nJavaScript counts months from 0 to 11 for the\
    \ twelve months a year. 0 represents January and 11 represent December. Below\
    \ screenshot shows the code for today’s date that is July 23 and year 2014 and\
    \ `getMonth()` returns 6.\n\n![](Images/image00080.jpeg)\n\nQ. When `RangeError`\
    \ invalid date exception occurs?\n\n**ANSWER**\n\nWhen a date object is created\
    \ with invalid date string and `toISOString()` method is applied to this invalid\
    \ date then this `RangeError` occurs. Below screenshot shows '2014-13-13' string\
    \ which is representing YYYY-MM-DD format where month is out of range produces\
    \ the `RangeError` exception.\n\n![](Images/image00081.jpeg)\n\n## Chapter 7 Regular\
    \ Expression\n\nQ. What is Regular Expression in JavaScript?\n\n**ANSWER**\n\n\
    Regular expressions are used for pattern matching in a string. A regular expression\
    \ in JavaScript can be declared in two ways. Syntax for these two approaches is\
    \ listed below.\n\n```javascript\nvar aRegExpression = new RegExp(pattern,modifiers);\n\
    var aRegExpression = /pattern/modifiers;\n```\n\nThe details of these syntaxes\
    \ are as follows:\n\n- `pattern` : it represents the search string.\n- `modifiers`\
    \ : it represents the conditional switches that will be applied to the pattern\
    \ matching\n\nQ. What are the methods of a regular expression?\n\n**ANSWER**\n\
    \nThere are 3 different methods for regular expressions are listed below.\n\n\
    - `exec()` : scans for a matching string and returns the first matched string\n\
    - `test()` : scans for a matching string and returns boolean value false or true.\n\
    - `toString()` : This method returns the string value of a regular expression.\n\
    \nQ. What is the switch `\\w` represents?\n\n**ANSWER**\n\nThe `\\w` represents\
    \ an alphanumeric character. The following code demonstrate the use of `\\w` switch\
    \ .\n\n```javascript\nvar regEx= /\\wu/;\nvar out1 = regEx.exec(\"sandeep Ku Patel\"\
    ), out2 = regEx.test(\"sandeep Ku Patel\");\nconsole.log(out1);\nconsole.log(out2);\n\
