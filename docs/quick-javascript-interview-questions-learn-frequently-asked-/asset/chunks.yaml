    \ applied to this invalid date then this `RangeError` occurs. Below screenshot\
    \ shows '2014-13-13' string which is representing YYYY-MM-DD format where month\
    \ is out of range produces the `RangeError` exception.\n\n![](Images/image00081.jpeg)\n\
    \n## Chapter 7 Regular Expression\n\nQ. What is Regular Expression in JavaScript?\n\
    \n**ANSWER**\n\nRegular expressions are used for pattern matching in a string.\
    \ A regular expression in JavaScript can be declared in two ways. Syntax for these\
    \ two approaches is listed below.\n\n```javascript\nvar aRegExpression = new RegExp(pattern,modifiers);\n\
    var aRegExpression = /pattern/modifiers;\n```\n\nThe details of these syntaxes\
    \ are as follows:\n\n- `pattern` : it represents the search string.\n- `modifiers`\
    \ : it represents the conditional switches that will be applied to the pattern\
    \ matching\n\nQ. What are the methods of a regular expression?\n\n**ANSWER**\n\
    \nThere are 3 different methods for regular expressions are listed below.\n\n\
    - `exec()` : scans for a matching string and returns the first matched string\n\
    - `test()` : scans for a matching string and returns boolean value false or true.\n\
    - `toString()` : This method returns the string value of a regular expression.\n\
    \nQ. What is the switch `\\w` represents?\n\n**ANSWER**\n\nThe `\\w` represents\
    \ an alphanumeric character. The following code demonstrate the use of `\\w` switch\
    \ .\n\n```javascript\nvar regEx= /\\wu/;\nvar out1 = regEx.exec(\"sandeep Ku Patel\"\
    ), out2 = regEx.test(\"sandeep Ku Patel\");\nconsole.log(out1);\nconsole.log(out2);\n\
    ```\n\nBelow screenshot shows the output of the above code which pattern match\
    \ any substring having alphanumeric character with 2^(nd) character as u.\n\n\
    ![](Images/image00082.jpeg)\n\nQ. Write a Regular expression to reverse the first\
    \ and last name? For example Sandeep Patel becomes Patel Sandeep.\n\n**ANSWER**\n\
    \nTo reverse first and last name we have to use `replace()` function on input\
    \ string with regular expression. The following code shows the method to reverse\
    \ first and last name.\n\n```javascript\nvar reverseFirstLastName = function(nameString){\n\
    var regex = /(\\w+)\\s(\\w+)/,\nresultString = \n```\n(Note: The source text was\
    \ truncated here, I have formatted what was available.)\n"
