    <button id=\"timeButton\">Get Time</button>\n\n< script>\n\nvar *dateWorker* =\
    \ new Worker(\"dateWorker.js\"),\n\n*resultContainer* = document.getElementById(\"\
    resultContainer\"), *timeButton* = document.getElementById(\"timeButton\");\n\n\
    *timeButton* .addEventListener(\"click\",function(){\n\n*dateWorker*.postMessage(null);\n\
    \n});\n\n*dateWorker*.addEventListener(\"message\",function(workerEvent){ var\
