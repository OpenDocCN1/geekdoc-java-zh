    \ of the Attribute.\n\n**attributes**: Represents collection of Attribute objects.\n\
    \n**childNodes** : Represents NodeList collection of node objects.\n\n**data**:\
    \ Represents text stored within a TextNode, CDATASection, or Comment.\n\n**documentElement**:\
    \ It contains root element node of the document.\n\n**firstChild**: This is first\
