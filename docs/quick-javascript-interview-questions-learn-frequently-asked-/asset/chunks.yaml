    self.addEventListener(\"connect\", function (event) {\n  var port = event.ports[0];\n\
    \  port.addEventListener(\"message\", function (event) {\n    var requestData\
    \ = event.data,\n    inputString = requestData.string,\n    stringLength = inputString.length;\n\
    \    port.postMessage({result:stringLength});\n  }, false);\n  port.start(); \n\
    }, false);\n```\n\nThe `lengthWorkerDemo.html` file contains the code for instantiating\
    \ the shared worker and rendering the response in browser. The code content of\
    \ `lengthWorkerDemo.html` file are listed as follows.\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head lang=\"en\">\n<meta charset=\"UTF-8\">\n<title>Shared Web Worker\
    \ Demo</title> \n</head>\n<body> \n<h1 id=\"resultContainer\"></h1>\n<input type=\"\
    text\" id=\"inputString\" value=\"Hello\" placeholder=\"Enter a string\"> <button\
    \ id=\"lengthButton\">Get Length</button>\n<script>\nvar lengthWorker = new SharedWorker(\"\
    calculateLengthWorker.js\"), \n    resultContainer = document.getElementById(\"\
    resultContainer\"), \n    lengthButton = document.getElementById(\"lengthButton\"\
    ), \n    inputString = document.getElementById(\"inputString\");\n\nlengthButton.addEventListener(\"\
    click\", function () {\n  resultContainer.innerText = \"\";\n  lengthWorker.port.postMessage({\n\
    \    string :inputString.value\n  });\n});\n\n//start the worker\nlengthWorker.port.start();\n\
    \n//Success Handler for the worker\nlengthWorker.port.addEventListener(\"message\"\
    , function (workerEvent) {\n  var responseData = workerEvent.data,\n  result =\
    \ responseData.result;\n  resultContainer.innerText = \"Result: \" + result;\n\
    });\n</script>\n</body>\n</</html> \n```\n\nThe output of the preceding code is\
    \ rendered as following screenshot displaying length of the input string.\n\n\
    ![](Images/image00096.jpeg)\n\n## Chapter 11 Local Storage\n\n### Q. What is local\
    \ storage?\n\n**ANSWER**\n\nHTML5 provides a feature to store data locally in\
    \ end user’s browser. Data is stored in the browser as key-value pair. Unlike\
    \ cookie it has average space of 5 MB. This storage comes in 2 different type\
    \ `sessionStorage` and `localStorage`.\n\n`localStorage`: it stores data with\
    \ no expiration date. `sessionStorage`: it stores data with an expiration date.\n\
    \n### Q. Which one is the main Storage interface?\n\n**ANSWER**\n\n`window.Storage()`\
    \ is the main interface from where the `localStorage` and `sessionStorage` are\
    \ implemented. This interface has the below definition.\n\n```javascript\ninterface\
    \ Storage {\n  readonly attribute unsigned long length;\n  DOMString? key(unsigned\
    \ long index);\n  getter DOMString? getItem(DOMString key);\n  setter creator\
    \ void setItem(DOMString key, DOMString value);\n  deleter void removeItem(DOMString\
    \ key);\n  void clear();\n}\n```\n\nThe details of the above code are as follows:\n\
    \n`setItem(key,value)`: this methods stored the value in storage using key-value\
    \ pair.\n`getItem(key)`: this method retrieves the stored object using the key.\n\
    `removeItem(key)`: this methods removes the stored item based on the key.\n`clear()`:\
    \ Deletes all the items from the storage. `length`: this property returns the\
    \ length of the storage, no of elements inside the storage.\n`key(position)`:\
    \ this method returns the key for the value in the given numeric position. \n\n\
    ### Q. How to store and retrieve an object in local storage? **ANSWER**\n\nLocal\
    \ storage provides `setItem()` and `getItem()` for storing and retrieving an object\
    \ from the storage. `setItem(key, value)` method takes 2 input parameter to store\
    \ the object. The `getItem(key)` method retrieves the value using key as input\
    \ parameter. Below code shows the storing “Sandeep Kumar” string in “myName” key\
    \ and then retrieves this string place it in a HTML element.\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<body>\n<div id=\"resultContainer\"></div> \n<script>\nvar container\
    \ = document.getElementById(\"resultContainer\");\nlocalStorage.setItem(\"myName\"\
    , \"Sandeep Kumar\"); \ncontainer.innerHTML = localStorage.getItem(\"myName\"\
    ); \n</script>\n</body>\n</html>\n```\n\nBelow screenshot shows the chrome developer\
    \ storage preview which holds the above object as key and value pair.\n\n![](Images/image00097.jpeg)\n\
    \n### Q. How to attach an event to a local storage?\n\n**ANSWER**\n\nWhen local\
    \ storage objects get modified a storage event is fired. A callback method can\
    \ be attached to window object using `addEventListener()` or `attachEvent()`.\n\
    \n**NOTE:** When `setItem()`, `removeItem()`, and `clear()` are called on the\
    \ storage area a storage event is fired. In simple sentence, a storage event is\
    \ fired on every tab. Below code has a callback method listening to storage.\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<div id=\"resultContainer\"></div>\n\
    <button onclick=\"update()\">Click Me</button>\n<script>\nvar container = document.getElementById(\"\
    resultContainer\"),\nmethodStorageEvent = function(event){ \n  container.innerHTML\
    \ = \"Event Fired\"+localStorage.getItem(\"myName\");\n},\ncounter = 1,\nupdate\
    \ = function(){\n  localStorage.setItem(\"myName\", ++counter);\n  container.innerHTML\
    \ = localStorage.getItem(\"myName\");\n};\nwindow.addEventListener(\"storage\"\
    , methodStorageEvent, false)\n</script>\n</body>\n</html>\n```\n\nBelow screenshot\
    \ demonstrates how the storage event is fired and the other tabs accessing the\
    \ same page receives the storage event and update their content.\n\n![](Images/image00098.jpeg)\n\
