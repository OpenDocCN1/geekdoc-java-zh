    var *squareWorker* = new Worker(\"doSquareWorker.js\"), *resultContainer* = document.getElementById(\"\
    resultContainer\"), *squareButton* = document.getElementById(\"squareButton\"\
    ), *inputNumber*=document.getElementById(\"inputNumber\");\n\n*squareButton* .addEventListener(\"\
    click\",function(){ *squareWorker*.postMessage({number:*inputNumber*.value});\n\
    \n});\n\n*squareWorker*.addEventListener(\"message\",function(workerEvent){ var\
    \ responseData = workerEvent.data,\n\nsquareResult= responseData.result;\n\n*resultContainer*.innerText\
    \ = squareResult;\n\n});\n```\n</script>\n\n</body>\n\n</html> The output of the\
    \ preceding code shown in following screenshot with square of a number is displayed\
    \ from the worker response messages.\n\n![](Images/image00091.jpeg)\n\n## Q. How\
    \ to define an inline web worker? Demonstrate an inline worker for multiplying\
    \ 2 numbers?\n\n**ANSWER**\n\nAn inline web worker can be defined inside a HTML\
    \ markup using `<script>` tag with `type` attribute having value `javascript/worker`.\
    \ **Syntax:**\n\n```html\n<script type=\"javascript/worker\">\n\n//JavaScript\
    \ Code for defining a worker\n\n</script>\n```\n\n**Example:**\n\nThe `inlineWorkerDemo.html`\
    \ file contains the code for defining multiplication worker which listens to the\
    \ messages and calculates the multiplication and post the response. The listener\
    \ to the multiply worker extracts the result and renders in the browser. The following\
    \ code shows the content of `inlineWorkerDemo.html` file.\n\n```html\n<!DOCTYPE\
    \ html>\n\n<html>\n\n<head lang=\"en\">\n\n< meta charset=\"UTF-8\">\n\n<title>Inline\
    \ Web Worker Demo</title>\n\n</head>\n\n<body>\n\n<h1 id=\"resultContainer\"></h1>\n\
    \n<input type=\"number\" id=\"number1\" value=\"8\" placeholder=\"Enter first\
    \ number\"> <input type=\"number\" id=\"number2\" value=\"10\" placeholder=\"\
    Enter second number\">\n\n<button id=\"multiplyButton\">Multiply</button>\n\n\
    <script id=\"multiplyWorker\" type=\"javascript/worker\">\n\nself.addEventListener(\"\
    message\",function(event){\n\nvar requestData = event.data,\n\nnumber1 = requestData.number1,\n\
    \nnumber2 = requestData.number2,\n\nmultiplyResult = number1 * number2;\n\nself.postMessage({result:multiplyResult});\n\
    \n});\n\n</script>\n\n<script>\n\nvar *textContent* = document.querySelector('#multiplyWorker').textContent,\
    \ *workerBlob* = new Blob([*textContent*]),\n\n*workerURL* = window.URL.createObjectURL(*workerBlob*),\
    \ *multiplyWorker* = new Worker(*workerURL*),\n\n*resultContainer* = document.getElementById(\"\
    resultContainer\"), *multiplyButton* = document.getElementById(\"multiplyButton\"\
    ), *number1* = document.getElementById(\"number1\"),\n\n*number2* = document.getElementById(\"\
    number2\");\n\n*multiplyButton*.addEventListener(\"click\", function () {\n\n\
    *multiplyWorker*.postMessage({\n\nnumber1:parseInt(*number1*.value,10),\n\nnumber2:\
    \ parseInt(*number2*.value,10)\n\n});\n\n});\n\n*multiplyWorker*.addEventListener(\"\
    message\", function (workerEvent) {\n\nvar responseData = workerEvent.data,\n\n\
    result = responseData.result;\n\n*resultContainer*.innerText = \"Result: \" +\
    \ result;\n\n});\n\n</script>\n\n</body>\n\n</html>\n```\n\nUser can input two\
    \ numbers in the text box and press the multiply button. The multiply worker calculate\
    \ the multiplication and result is rendered in the browser. The outputs of the\
    \ preceding code are rendered as following screenshot.\n\n![](Images/image00092.jpeg)\n\
    \n## Q. How to handle error in web worker?\n\n**ANSWER**\n\nWe can throw error\
    \ using `throw` keyword from the web worker. A callback method can be attached\
    \ to the `error` event to handle the generated error. The `positiveNoSqaureWorkerDemo.html`\
    \ file contains a worker which takes only positive number as input. If a negative\
