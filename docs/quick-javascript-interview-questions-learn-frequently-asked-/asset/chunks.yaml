    \n```html\n<!DOCTYPE html>\n\n<html>\n\n<head lang=\"en\">\n\n< meta charset=\"\
    UTF-8\">\n\n<title>Web Worker 错误处理器示例</title>\n\n</head>\n\n<body>\n\n<h1 id=\"\
    resultContainer\"></h1>\n\n<input type=\"number\" id=\"number1\" value=\"-4\"\
    \ placeholder=\"输入数字\"> <button id=\"squareResult\">平方</button>\n\n<script id=\"\
    squareWorker\" type=\"javascript/worker\">\n\nself.addEventListener(\"message\"\
    ,function(event){\n\nvar requestData = event.data,\n\nnumber1 = requestData.number1,\n\
    \nsquareResult = 0;\n\nif(number1>0) {\n\nsquareResult = number1 * number1\n\n\
    self.postMessage({result:squareResult});\n\n} else{\n\n// 负数抛出错误\n\nthrow \"It\
    \ is a negative number.Please supply a positive number.\"; }\n\n});\n\n</script>\n\
    \n<script>\n\nvar *textContent* = document.querySelector('#squareWorker').textContent,\n\
    \n*workerBlob* = new Blob([*textContent*]),\n\n*workerURL* = window.URL.createObjectURL(*workerBlob*),\n\
    \n*squareWorker* = new Worker(*workerURL*),\n\n*resultContainer* = document.getElementById(\"\
    resultContainer\"),\n\n*squareResult* = document.getElementById(\"squareResult\"\
    ),\n\n*number1* = document.getElementById(\"number1\");\n\n*multiplyButton*.addEventListener(\"\
    click\", function () {\n\n*multiplyWorker*.postMessage({\n\nnumber1:parseInt(*number1*.value,10),\n\
    \nnumber2: parseInt(*number2*.value,10)\n\n});\n\n});\n\n*multiplyWorker*.addEventListener(\"\
    message\", function (workerEvent) {\n\nvar responseData = workerEvent.data,\n\n\
