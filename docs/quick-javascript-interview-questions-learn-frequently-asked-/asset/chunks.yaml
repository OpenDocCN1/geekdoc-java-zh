  trans: "\n\n- **Text**: 它代表要解析为 JSON 的字符串。\n- **Reviver (转换器)**: 它代表一个函数，规定了在返回之前如何对解析产生的原始值进行转换。\n\
    \n###### Q. 如何将日期对象转换为 JSON？\n\n### 回答\n`toJSON()` 方法可以将日期对象转换为 JSON。下面的截图显示了在\
    \ Chrome 控制台中对日期对象使用 `toJSON()` 方法\n\n![](img/image00074.jpeg)\n\n## 第 5 章 DOM\
    \ 相关问题\n\n### Q. 什么是 DOM？\n\n### 回答\n文档对象模型 (DOM) 是用于 HTML 和 XML 文档的编程 API。JavaScript\
    \ 是最广泛用于访问 DOM API 属性和方法的语言。\n\n### Q. DOM 中涉及哪些对象？\n\n### 回答\n根据 DOM Level 2\
    \ 规范，它包含以下主要对象：\n\n- `Attribute`: 代表一个元素属性。\n- `Attributes`: 代表属性集合。\n- `CDATASection`:\
    \ 代表一个 XML CDATA 区。\n- `Comment`: 代表一个 XML 注释。\n- `Document`: 代表一个 XML 文档。\n-\
    \ `Element`: 代表一个 XML 元素节点。\n- `Node`: 代表 XML 文档中的通用节点对象。\n- `NodeList`: 代表节点对象的有序集合。\n\
    - `ProcessingInstruction`: 代表一个 XML 处理指令。\n- `TextNode`: 代表一个 XML 文本节点。\n\n###\
    \ Q. DOM 中涉及哪些属性？\n\n### 回答\n根据 DOM Level 2 规范，它包含以下主要属性：\n\n- `name`: 拥有 `Attribute`\
    \ 的名称。\n- `namespaceURI`: 代表节点的命名空间 URI。\n- `nextSibling`: 包含文档源顺序中 `Node` 的下一个兄弟节点。\n\
    - `nodeName`: 代表节点的名称。`nodeType`: 代表节点的类型。\n- `nodeValue`: 拥有节点的值。\n- `ownerDocument`:\
    \ 包含该 `Node` 的 `Document` 对象的引用。\n- `ownerElement`: `Attribute` 所属的 `Element`\
    \ 的引用。\n- `parentNode`: 代表节点所属的父 `Node`。\n- `prefix`: 代表节点的命名空间前缀。\n- `previousSibling`:\
    \ 包含文档源顺序中 `Node` 的上一个兄弟节点。\n- `text`: 拥有该 `Node` 及其包含的任何元素节点所包含的所有文本节点的内容。\n\
    - `value`: 拥有 `Attribute` 的值。\n- `attributes`: 代表 `Attribute` 对象的集合。\n- `childNodes`:\
    \ 代表节点对象的 `NodeList` 集合。\n- `data`: 代表存储在 `TextNode`、`CDATASection` 或 `Comment`\
    \ 中的文本。\n- `documentElement`: 包含文档根元素节点。\n- `firstChild`: 是文档源顺序中 `Node` 的第一个孩子。\n\
    - `lastChild`: 是文档源顺序中 `Node` 对象的最后一个孩子。\n- `length`: 代表集合中元素的数量。\n- `localName`:\
    \ 拥有节点的本地名称。\n\n### Q. 什么是 windows load 事件？\n\n### 回答\n加载事件通常在对象完成后触发。Window load\
    \ 事件在图像、脚本文件、CSS 文件和其他依赖项加载时触发。下面的截图显示了 load 事件的使用。\n\n![](img/image00075.jpeg)\n\
    \n### Q. 什么是 DOM ready 事件？\n\n### 回答\nDOM ready 事件在元素加载到浏览器时触发。它不会等待图像和其他文件的加载。我们可以通过挂载回调方法来监听此事件。可以将方法添加到\
    \ `readyStateChange` 或 `DOMContentLoaded`。下面的代码展示了这些事件的使用。\n\n```html\n<!DOCTYPE\
    \ html>\n<html\n<head>\n<title>Window Ready Event Example</title>\n<script>\n\
    var readyHandler = function(){\nvar element = document.querySelector(\"#message1\"\
    ); element.innerHTML = \"Ready Handler Fired : readystatechange <span style='color:blue','\"\
    +new Date()+\"\n</span>\"\n}\ndocument.onreadystatechange = readyHandler; </script>\n\
    <script>\ndocument.addEventListener(\"DOMContentLoaded\",\nfunction(event) {\n\
    var element = document.querySelector(\"#message2\"); element.innerHTML = \" Ready\
    \ Handler Fired :\nDOMContentLoaded <span style='color:red='\"+new\nDate()+\"\
    </span>\";\n});\n</script>\n</head>\n<body>\n<h2 id=\"message1\">\n</h2>\n<h2\
    \ id=\"message2\">\n</h2>\n</body>\n</html> \n```\n下面的截图显示了上述代码的输出。\n\n![](img/image00076.jpeg)\n\
    \n### Q. DOM 中的 query selector（查询选择器）是什么？\n\n### 回答\nDOM 提供了 `querySelector()`\
    \ 和 `querySelectorAll()` 方法来选择 DOM 元素。`querySelector()` 方法返回一个在 DOM 中第一个匹配的元素。`querySelectorAll()`\
    \ 方法返回一个匹配元素的节点列表。下面的代码演示了如何使用这些方法从 DOM 中选择元素。\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n<title>Document Query Selector Example</title>\n</head>\n<body>\n<h5 class=\"\
    name\">Sandeep Kumar Patel</h5>\n<h4 class=\"country\">India</h4>\n<h4 class=\"\
    country\">UK</h4>\n<h5 class=\"name\">Surabhi Patel</h5>\n<h4 class=\"country\"\
    >US</h4>\n<h4 id=\"my-score\">520</h4>\n<script>\nvar element = document.querySelector(\
    \ \"#my-score\" ); element.style.color=\"red\";\nvar elements = document.querySelectorAll(\"\
    h4#my-score,\nh5.name\");\nfor (var item of elements) {\nitem.style.fontStyle\
    \ = \"Italic\";\n}\nvar aElement = document.querySelector( \"h4.country, h4#my-score\"\
    \ );\naElement.style.background=\"orange\";\n</script>\n</body>\n</html> \n```\n\
    下面的截图显示了上述代码的输出。\n\n![](img/image00077.jpeg)\n\n### Q. DOM 的主要数据类型是什么？\n\n###\
    \ 回答\n`Node` 接口是 DOM 的数据类型。它代表 DOM 树中的单项。`Document`、`Element`、`CharacterData`、`ProcessingInstruction`、`DocumentFragment`、`DocumentType`、`Notation`、`EntityReference`\
    \ 都继承自 `Node`。\n\n### Q. DOM 中的 document fragment（文档碎片）是什么？\n\n### 回答\n`DocumentFragment`\
    \ 是 DOM 的轻量版本。它没有父类。开发者通常将其作为 DOM 元素的临时存储。下面的代码展示了创建文档碎片并添加 HTML 元素最后将其放入 body\
    \ 的示例。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>DocumentFragment Example</title>\n\
    </head>\n<body>\n<script>\nvar aFragment = document.createDocumentFragment(),\
    \ aHTMLElement = document.createElement(\"h2\"), aTEXTElement = document.createTextNode(\"\
    SANDEEP\");\naHTMLElement.appendChild(aTEXTElement);\naFragment.appendChild(aHTMLElement);\n\
    document.body.appendChild(aFragment);\n</script>\n</body>\n</html>\n```\n下面的截图显示一个带有\
    \ SANDEEP 值的文本节点的 h2 元素被放置在文档碎片中。最后将文档碎片作为子元素添加到 body 元素中。\n\n![](img/image00078.jpeg)\n\
