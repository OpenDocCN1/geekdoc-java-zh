    \ 第 3 章 闭包\n\n### Q. 什么是闭包？\n\n**答案**\n\n闭包是一个可以外部包装函数变量的内部函数。它具有三个作用域访问权限：\n\n\
    - **自身作用域 (Self-scope):** 它可以访问自身作用域内的属性。\n- **包裹函数作用域 (Wrapped function’s scope):**\
    \ 它可以访问其所在函数中的属性。\n- **全局作用域 (Global Scope):** 它可以访问全局作用域（即 window 作用域）中的属性。\n\
    \n**示例：**\n\n尽管 `prop1` 属于外部函数作用域，内部函数仍然可以访问 `prop1`。\n\n```javascript\nfunction\
    \ myOuterFunction(){ var prop1 = 5;\n\n  return function innerFunction(){\n  return\
    \ prop1;\n  }\n}\nvar res = myOuterFunction(); console.log(res.name);\nconsole.log(res());\
    \ \n```\n\n下面的截图显示了上述代码在控制台中的输出。\n\n![](img/image00068.jpeg)\n\n### Q. 请举例闭包概念的实际应用示例？**答案**\n\
    \n在网页开发中，开发者更频繁地使用闭包。最常见的场景是我们需要某种工厂，返回一个带有不同值的函数对象，该对象可以被应用程序。\n\n**示例：**\n\n\
    以下代码有一个名为 `backgroundColorFactory` 的背景颜色工厂，它返回一个带有输入颜色的函数。使用此工厂，我们创建了 `greenBackground`\
    \ 和 `blueBackground` 函数对象并将其绑定到两个按钮上。当用户点击这些按钮时，body 的背景颜色将变为目标颜色。\n\n```html\n\
    <!DOCTYPE html>\n<html>\n <head>\n<meta charset=\"utf-8\">\n<title>闭包实用示例</title>\n\
    </head>\n<body>\n<button id=\"greenButton\">Green Background</button> <button\
    \ id=\"blueButton\">Blue Background</button> <script>\nvar backgroundColorFactory\
    \ = function(color) { return function() {\ndocument.body.style.background = color;\
    \ };\n};\nvar greenBackground = backgroundColorFactory('green'); var blueBackground\
    \ = backgroundColorFactory('blue');\ndocument.getElementById('greenButton').onclick\
    \ = greenBackground;\ndocument.getElementById('blueButton').onclick = blueBackground;\n\
    </script>\n</</body> \n</html>\n```\n\n上述代码的输出列在下面的截图中。\n\n![](img/image00069.jpeg)\n\
    \n### Q. 如何使用闭包模拟私有数据？\n\n**答案**\n\n以下代码演示了私有变量 `_name` 的声明。这意味着我们可以使用 `new` 关键字通过\
    \ `Student` 构造函数为 `_name`赋值。\n\n```javascript\nfunction Student(name) { var _name\
    \ = name;\n\n  this.getName = function() { return _name;\n  };\n}\nvar student1\
    \ = new Student(\"Sandeep\"); student1 ._name = \"John\";\nconsole.log(student1.getName());\n\
    ```\n\n上述代码的细节如下：\n\n创建了一个 `Student` 对象 `student1`，其 `_name` 为 `Sandeep`。\n\n\
    给 `_name` 赋值了新名称值 `John`，但 `getName()` 方法在控制台中打印的是 `Sandeep`。这证明 `_name` 是私有的。\n\
    \n下面的截图显示了 Chrome 控制台中上一个代码的输出。\n\n![](img/image00070.jpeg)\n\n## 第 4 章 JSON JSON\
    \ 问题\n\n### Q. 什么是 JSON？ \n\n**答案**\n\nJSON 文本格式在语法上与创建 JavaScript 对象的代码相同。JSON\
    \ 仅仅是 JS 对象字面量表示法的子集，但除了看起来相似，它们没有任何共同点。JSON 用作数据交换格式，类似于 XML。JSON 构建在两种结构之上：\n\
    \n1. 键值对集合。在各种语言中，它实现为对象、记录、结构体、字典、哈希表、键列表或关联数组。\n2. 有序的值列表。在大多数语言中，它实现为数组、向量、列表或序列。\n\
    \n### Q. 为什么 Google 在他们的 JSON 响应前面加上 `while (1);`？**答案**\n\n这可以防止 JSON 劫持。这是为了确保其他网站无法进行恶意操作尝试窃取数据。通过替换数组构造函数，并通过\
    \ `<script>` 标签包含此 JSON URL，恶意的第三方网站可以从 JSON 响应中窃取数据。通过在开头放置 `while(1);`，脚本将会崩溃。相反，使用\
    \ `XHR` 和独立 JSON 解析器的同站请求可以轻松地忽略 `while(1);` 前缀。\n\n### Q. 什么是 JSONP？\n\n**答案**\n\
    \nJSONP 代表“带填充的 JSON”（JSON with Padding）。这意味着 JSON 数据被封装在一个函数调用中。在请求远程 JSON 数据时，网页上已经定义了一个回调（处理/填充）函数。\n\
    \n**示例：**\n\n下面的 JavaScript 代码显示了针对远程 URL `//abcdurl` 的回调函数 `paddingFunction()`。\n\
    \n```javascript\nfunction paddingFunction(data){\nconsole.log(\"response data\
    \ processing\")\n}\nvar script = document.createElement('script');\nscript.src\
    \ = '//abcdurl?callback=paddingFunction'\ndocument.getElementsByTagName('head')[0].appendChild(script);\n\
    ```\n\n### Q. 为什么使用 JSON 而不是 XML？\n\n**答案**\n\n- JSON 可以包含整数、字符串、列表、数组。\n- 与 XML\
    \ 相比，JSON 更小、更快、更轻量。\n- JSON 更容易映射到面向系统中。\n- JSON 和 XML 都使用 Unicode，因此支持国际化。\n\
    - JSON 是更好的数据交换格式。XML 是更好的文档交换格式。\n- 由于浏览器缺少 JSON 解析器，JSON 更安全。如果数据是 XML，你可以编写\
    \ XSLT 模板并运行它输出到另一种格式：HTML、SVG、纯文本、逗号分隔，甚至是 JSON。在这里 XML 优于 JSON。\n\n### Q. JSON\
    \ 的 MIME 类型是什么？\n\n**答案**\n\nJSON 的 MIME 类型为 `application/json`。\n\n### Q. JSON\
    \ 支持哪些数据类型？\n\n**答案**\n\nJSON 支持的数据类型有数字、字符串、布尔、数组、对象、null。以下代码显示了一个包含不同类型的 JSON\
    \ 对象：\n\n```json\n { name:\"Sandeep\",\nscore:65,\nisPassed: true,\nsubject: [\"\
    Computer\", \"Algebra\"],\naddress: { city:\"Bangalore\", country:\"India\"},\
    \ email: null \n}\n```\n\n下面的截图显示了开发者工具控制台中上述 JSON 对象，所有属性以键值对列出。\n\n![](img/image00071.jpeg)\n\
    \n### Q. JSON.stringify() 方法的作用是什么？\n\n**答案**\n\nJSON.stringify() 将对象转换为 JSON\
    \ 文本并将 JSON 文本存储在字符串中。下面的截图显示了 `stringify()` 方法的使用：\n\n![](img/image00072.jpeg)\n\
    \n### Q. JSON.parse() 方法的作用是什么？\n\n**答案**\n\n`JSON.parse()` 方法将字符串解析为 JSON，并可以选择转换解析产生的值。下面的截图显示了使用\
    \ `JSON.parse()` 方法将 `student1` JSON 字符串转换为 JSON 对象。\n\n![](img/image00073.jpeg)\n\
    \n"
- fmt: "\n- **Text**: It represents the string to parse as JSON.\n- **Reviver**: It\
    \ represents a function, prescribes how the value originally produced by parsing\
    \ is transformed, before being returned. \n\n###### Q. How to convert date object\
    \ to JSON?\n\n### ANSWER\nThe `toJSON()` method can convert the date object to\
    \ JSON. The following screenshot shows the use of `toJSON()` method for a date\
    \ object in chrome console.\n\n![](Images/image00074.jpeg)\n\n## Chapter 5 Questions\
    \ on DOM\n\n### Q. What is DOM ?\n\n### ANSWER\nDocument Object Model (DOM) is\
    \ a programming API for HTML and XML document. JavaScript is most widely used\
    \ language to access these DOM API properties and methods.\n\n### Q. What are\
    \ the different objects involved in DOM ?\n\n### ANSWER\nAccording to DOM Level\
    \ 2 specification it has following main objects.\n\n- `Attribute`: Represents\
    \ an element attribute.\n- `Attributes`: Represents a collection of attribute.\n\
    - `CDATASection`: Represents an XML CDATA section.\n- `Comment`: Represents an\
    \ XML comment.\n- `Document`: Represents an XML document.\n- `Element`: Represents\
    \ an XML element node.\n- `Node`: Represents a generic node object in an XML document.\n\
    - `NodeList`: Represents an ordered collection of node objects.\n- `ProcessingInstruction`:\
    \ Represents an XML processing instruction.\n- `TextNode`: Represents an XML text\
    \ node.\n\n### Q. What are the different properties involved in DOM ?\n\n### ANSWER\n\
    According to DOM Level 2 specification it has following main properties\n\n- `name`:\
    \ It has the name of the `Attribute`.\n- `namespaceURI`: It represents namespace\
    \ URI of the node.\n- `nextSibling`: It contains the next sibling of the `Node`\
    \ in document source order.\n- `nodeName`: This represents name of the node. `nodeType`:\
    \ It represents type of the node.\n- `nodeValue`: It has value of the node.\n\
    - `ownerDocument`: It has reference to the `Document` object that contains the\
    \ `Node`.\n- `ownerElement`: It has reference of the `Element` to which the `Attribute`\
    \ belongs.\n- `parentNode`: It represents parent `Node` to which the node belongs.\n\
    - `prefix`: It represents namespace prefix of the node.\n- `previousSibling`:\
    \ It has the previous sibling of the `Node` in document source order.\n- `text`:\
    \ It has contents of all the text nodes contained by the `Node` and any element\
    \ nodes that it contains.\n- `value`: It has value of the `Attribute`.\n- `attributes`:\
    \ Represents collection of `Attribute` objects.\n- `childNodes`: Represents `NodeList`\
    \ collection of node objects.\n- `data`: Represents text stored within a `TextNode`,\
    \ `CDATASection`, or `Comment`.\n- `documentElement`: It contains root element\
    \ node of the document.\n- `firstChild`: This is first child of the `Node` in\
    \ document source order.\n- `lastChild`: This is the last child of the `Node`\
    \ object in document source order.\n- `length`: It represents number of elements\
    \ in the collection.\n- `localName`: It has local name of the node..\n\n### Q.\
    \ What is windows load event?\n\n### ANSWER\nLoad event occurs generally fired\
    \ after the object is completely loaded. Window load event is event occurs when\
    \ images, script files, CSS files and other dependencies get loaded. Below screenshot\
    \ shows use of load event.\n\n![](Images/image00075.jpeg)\n\n### Q. What is DOM\
    \ ready event?\n\n### ANSWER\nDOM ready event get fired when elements are get\
    \ loaded to browser. It does not wait for images and other files loaded. We can\
    \ listen to this event by attaching a callback method. A method can be added to\
    \ `readyStateChange` or `DOMContentLoaded`.The below code shows the use of these\
    \ events.\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>Window Ready Event\
    \ Example</title>\n<script>\nvar readyHandler = function(){\nvar element = document.querySelector(\"\
    #message1\"); element.innerHTML = \"Ready Handler Fired : readystatechange <span\
    \ style='color:blue','\"+new Date()+\"\n</span>\"\n}\ndocument.onreadystatechange\
    \ = readyHandler; </script>\n<script>\ndocument.addEventListener(\"DOMContentLoaded\"\
    ,\nfunction(event) {\nvar element = document.querySelector(\"#message2\"); element.innerHTML\
    \ = \" Ready Handler Fired :\nDOMContentLoaded <span style='color:red='\"+new\n\
    Date()+\"</span>\";\n});\n</script>\n</head>\n<body>\n<h2 id=\"message1\">\n</h2>\n\
    <h2 id=\"message2\">\n</h2>\n</body>\n</html> \n```\nThe following screenshot\
    \ shows the output of the above code.\n\n![](Images/image00076.jpeg)\n\n### Q.\
    \ What is query selector in DOM?\n\n### ANSWER\nDOM provides `querySelector()`\
    \ and `querySelectorAll()` methods for selecting DOM elements. `querySelector()`\
    \ method return a single element which matches first in the DOM. `querySelectorAll()`\
    \ method return a node list of matched elements. Below code demonstrates the use\
    \ of these methods in selecting elements from DOM.\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n<title>Document Query Selector Example</title>\n</head>\n<body>\n\
    <h5 class=\"name\">Sandeep Kumar Patel</h5>\n<h4 class=\"country\">India</h4>\n\
    <h4 class=\"country\">UK</h4>\n<h5 class=\"name\">Surabhi Patel</h5>\n<h4 class=\"\
    country\">US</h4>\n<h4 id=\"my-score\">520</h4>\n<script>\nvar element = document.querySelector(\
    \ \"#my-score\" ); element.style.color=\"red\";\nvar elements = document.querySelectorAll(\"\
    h4#my-score,\nh5.name\");\nfor (var item of elements) {\nitem.style.fontStyle\
    \ = \"Italic\";\n}\nvar aElement = document.querySelector( \"h4.country, h4#my-score\"\
    \ );\naElement.style.background=\"orange\";\n</script>\n</body>\n</html> \n```\n\
    The following screenshot shows the output of the above code.\n\n![](Images/image00077.jpeg)\n\
    \n### Q. What is primary Data Type of DOM?\n\n### ANSWER\n`Node` interface is\
    \ the data type of DOM. It represents a single item from DOM tree. `Document`,\
    \ `Element`, `CharacterData`, `ProcessingInstruction`, `DocumentFragment`, `DocumentType`,\
    \ `Notation`, `EntityReference` all inherits from `Node`.\n\n### Q. What is document\
    \ fragment in DOM?\n\n### ANSWER\n`DocumentFragment` is a light weight version\
    \ of DOM. It does not have any parent class. It is generally used by the developer\
    \ as temporary storage of DOM elements. Below code shows an Example of creating\
    \ document fragment and adding HTML element to it and finally placing it to body.\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>DocumentFragment Example</title>\n\
    </head>\n<body>\n<script>\nvar aFragment = document.createDocumentFragment(),\
    \ aHTMLElement = document.createElement(\"h2\"), aTEXTElement = document.createTextNode(\"\
    SANDEEP\");\naHTMLElement.appendChild(aTEXTElement);\naFragment.appendChild(aHTMLElement);\n\
    document.body.appendChild(aFragment);\n</script>\n</body>\n</html>\n```\nBelow\
    \ screenshot shows an h2 element with a child text node containing value SANDEEP\
    \ is place inside document fragment. Finally the document fragment is appended\
    \ as a child to the body element.\n\n![](Images/image00078.jpeg)\n"
