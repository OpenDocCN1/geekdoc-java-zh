    \n可以通过脚本和 CSS 修改。\n\n当对象数量较少 (<10k)、面积较大或两者兼有时性能更好。\n\n## Q. 什么是 canvas 2d context？它是如何创建的？\n\
    \n**答案**\n\n使用 `getContext()` 方法并传入参数 `'2d'` 可以创建一个画布上下文。\n\n该上下文方法是 `CanvasRenderingContext2D`\
    \ 对象的一种。以下代码展示了简单的 2d 上下文创建并打印了对象的构造函数。\n\n```html\n<html\n<body>\n<canvas id=\"\
    myCanvas\"></canvas>\n<script>\nvar canvas = document.getElementById(\"myCanvas\"\
    ), context = canvas.getContext(\"2d\");\nconsole.log(context.constructor);\n</script>\n\
    </body>\n</html>\n```\n\n接下来的截屏显示了上下文对象的构造函数，它是原生对象 `CanvasRenderingContext2D`。\
    \ \n\n![](img/image00086.jpeg)\n\n## Q. 如何在 Canvas 中加载图像？\n\n**答案**\n\n可以使用 `drawImage()`\
    \ 方法加载图像。该方法绘制图像时需要多个输入参数。这些参数是定位和裁剪类型。我们将在后续的问题中讨论这些参数。以下代码展示了如何使用 `drawImage()`\
    \ 方法从 URL 在画布内部加载 PNG 图像。\n\n```html\n<html\n<body>\n<canvas id=\"myCanvas\"></canvas>\n\
    <script>\nvar canvas = document.getElementById(\"myCanvas\"), context = canvas.getContext(\"\
    2d\"),\nimg = new Image();\nimg.src = \"http://www.gravatar.com/avatar/4205261332ff131e971b48db31dcb528.png\"\
    ;\nimg.onload = function() {\ncontext.drawImage(img, 10, 10);\n};\n</script>\n\
    </body>\n</html>\n```\n\n下面的截屏显示了 Gravatar 图像被绘制在 HTML5 canvas 元素内部。该绘制是使用 2d\
    \ context 完成的。\n\n![](img/image00087.jpeg)\n\n## Q. drawImage() 方法有哪些不同的重载签名？\n\
    \n**答案**\n\n`drawImage()` 方法有 3 种不同的签名，列如下：\n\n- `drawImage(img, x, y)` : 该方法将图像放置在画布的\
    \ `<x, y>` 坐标处。\n- `drawImage(img, x, y, width, height)` : 该方法将图像放置在画布的 `<x, y>`\
    \ 坐标处，具有指定的 `height`。\n- `drawImage(img, sx, sy, swidth, sheight, x, y, width,\
    \ height)` : 该方法根据起点 `<sx, sy>`、高度 `sheight` 和宽度 `swidth` 对图像进行裁剪，并将其放置在 `<x,\
    \ y>` 坐标处，具有指定的 `height` 和 `width`。\n\n## 第 9 章 Geo Location API\n\n## Q. 什么是\
    \ Geo Location API？\n\n**答案**\n\nGeo Location API 向网络发布用户的地理位置。出于隐私考虑，它需要用户的许可。Geo\
    \ location API 存在于 `navigator.geolocation` 对象中。\n\n## Q. 如何判断浏览器是否支持 Geo Location\
    \ API？\n\n**答案**\n\n判断浏览器是否支持 Geo Location API，需要检查 `navigator.geolocation` 对象。以下代码展示了该逻辑：\n\
    \n```javascript\nfunction isGeoLocationSupported() {\n    return !!(navigator.geolocation);\n\
    }\nif (isGeoLocationSupported()) {\n    console.log(\"Geo Location API is supported\"\
    );\n} else {\n    console.log(\"Geo Location API is not supported\");\n}\n```\n\
    \n接下来的截屏显示了检查的结果 ![](img/image00088.jpeg)\n\n## 第 10 章 Web Workers\n\n## Q. 什么是\
    \ Web Workers？\n\n**答案**\n\nWeb Workers 是一种在后台运行脚本而不影响主线程性能的特性，允许进行大量计算。\n\n##\
    \ Q. 如何检测是否支持 Web Worker？\n\n**答案**\n\n我们可以通过验证 `Worker` 对象来检查是否支持 Web Workers：\n\
    \n```javascript\nif (window.Worker) {\n    console.log(\"Web Workers are supported\"\
    );\n} else {\n    console.log(\"Web Workers are not supported\");\n}\n```\n\n\
    ## Q. 什么是专用 worker (dedicated worker)？\n\n**答案**\n\n专用 worker 是只能被一个脚本访问的 worker。它通过指定脚本文件创建。\n\
    \n```javascript\nvar worker = new Worker(\"worker.js\");\n```\n\n## Q. 什么是共享 worker\
    \ (shared worker)？\n\n**答案**\n\n共享 worker 可以被同源的不同窗口或 iframe 的多个脚本访问。\n\n```javascript\n\
    var sharedWorker = new SharedWorker(\"worker.js\");\n```\n\n## Q. 开发一个专用 worker\
    \ 来显示时间？\n\n**答案**\n\n让我们在 `dateWorker.js` 中创建一个时间 worker，并每秒显示一次当前时间。\n\n**dateWorker.js:**\n\
    ```javascript\nsetInterval(function() {\n    var time = new Date();\n    self.postMessage({\n\
    \        hour: time.getHours(),\n        minute: time.getMinutes(),\n        second:\
    \ time.getSeconds()\n    });\n}, 1000);\n```\n\n**dateDemo.html:**\n```html\n\
    <!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n  \
    \  <title>Time Worker Demo</title>\n</head>\n<body>\n<h1 id=\"resultContainer\"\
    ></h1>\n<button id=\"timeButton\">Get Time</button>\n<script>\nvar dateWorker\
    \ = new Worker(\"dateWorker.js\"),\nresultContainer = document.getElementById(\"\
    resultContainer\"),\ntimeButton = document.getElementById(\"timeButton\");\n\n\
    timeButton.addEventListener(\"click\", function(){\n    dateWorker.postMessage(null);\n\
    });\n\ndateWorker.addEventListener(\"message\", function(workerEvent){\n    var\
    \ responseData = workerEvent.data,\n    hour = responseData.hour,\n    minute\
    \ = responseData.minute,\n    second = responseData.second;\n    resultContainer.innerText\
    \ = \"HOUR: \" + hour + \" MINUTE: \" + minute + \" SECOND: \" + second;\n});\n\
    </script>\n</body>\n</html>\n```\n\n上述代码的输出显示了从 worker 返回的小时、分钟和秒。\n\nImages/image0090.jpeg)\n\
    \n## Q. 开发一个专用 worker 来计算数字的平方？\n\n**答案**\n\n平方 worker 的定义在 `doSquareWorker.js`\
    \ 中，它监听消息并生成数字的平方。\n\n**doSquareWorker.js:**\n```javascript\nself.addEventListener(\"\
    message\", function(event){\n    var inputData = event.data,\n    inputNumber\
    \ = parseInt(inputData.number,10),\n    squareResult = Math.pow(inputNumber,2);\n\
    \    self.postMessage({result:squareResult});\n});\n```\n\n**squareWorkerDemo.html:**\n\
    ```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\"\
    >\n    <title>Square Worker</title>\n</head>\n<body>\n    <input type=\"number\"\
    \ id=\"numInput\">\n    <button id=\"calcBtn\">Calculate Square</button>\n   \
    \ <p id=\"result\"></p>\n    <script>\n        var worker = new Worker(\"doSquareWorker.js\"\
    );\n        var numInput = document.getElementById(\"numInput\");\n        var\
    \ calcBtn = document.getElementById(\"calcBtn\");\n        var result = document.getElementById(\"\
    result\");\n\n        calcBtn.addEventListener(\"click\", function(){\n      \
    \      worker.postMessage({number: numInput.value});\n        });\n\n        worker.addEventListener(\"\
    message\", function(e){\n            result.innerText = \"Square: \" + e.data.result;\n\
    \        });\n    </script>\n</body>\n</html>\n```\n\n"
