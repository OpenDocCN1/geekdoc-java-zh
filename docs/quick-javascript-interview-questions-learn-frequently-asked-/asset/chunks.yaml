    ### Q. What is Closure?\n\n**ANSWER**\n\nA closure is an inner function that has\
    \ access to the outer wrapped function’s variables. It has three different scope\
    \ accesses:-\n\n- **Self-scope:** It has access to properties present in its own\
    \ scope.\n- **Wrapped function’s scope:** It has access to the properties present\
    \ to from its enclosing function.\n- **Global Scope:** It has access to the properties\
    \ present in global scope that is window scope.\n\n**Example:**\n\nThe inner function\
    \ still has the access to `prop1` though `prop1` belongs to outer function scope.\n\
    \n```javascript\nfunction myOuterFunction(){ var prop1 = 5;\n\n  return function\
    \ innerFunction(){\n  return prop1;\n  }\n}\nvar res = myOuterFunction(); console.log(res.name);\n\
    console.log(res()); \n```\n\nBelow screenshot shows the output of the above code\
    \ in the console.\n\n![](Images/image00068.jpeg)\n\n### Q. Give an example of\
    \ practical implication of closure concept? ANSWER**\n\nIn web page development\
    \ closures are more frequently used by the developers. A most common scenario\
    \ is when we need some kind of factory which will return a function object with\
    \ different value that can be used by application.\n\n**Example:**\n\nThe following\
    \ code has a background color factory named `backgroundColorFactory` which returns\
    \ a function with an input color. Using this factory we have created `greenBackground`\
    \ and `blueBackground` function objects and binded with the 2 buttons. Once user\
    \ clicks these buttons the background color of the body is changed to the targeted\
    \ color.\n\n```html\n<!DOCTYPE html>\n<html>\n <head>\n<meta charset=\"utf-8\"\
    >\n<title>Practical Closure Example</title>\n</head>\n<body>\n<button id=\"greenButton\"\
    >Green Background</button> <button id=\"blueButton\">Blue Background</button>\
    \ <script>\nvar backgroundColorFactory = function(color) { return function() {\n\
    document.body.style.background = color; };\n};\nvar greenBackground = backgroundColorFactory('green');\
    \ var blueBackground = backgroundColorFactory('blue');\ndocument.getElementById('greenButton').onclick\
    \ = greenBackground;\ndocument.getElementById('blueButton').onclick = blueBackground;\n\
    </script>\n</body> \n</html>\n```\n\nThe output of the above code is listed in\
    \ below screenshot.\n\n![](Images/image00069.jpeg)\n\n### Q. Emulate the private\
    \ data using closure?\n\n**ANSWER**\n\nThe following code demonstrates the declaration\
    \ of private variable `_name`. It means we can assign the `_name` value using\
    \ `Student` constructor with a `new` keyword.\n\n```javascript\nfunction Student(name)\
    \ { var _name = name;\n\n  this.getName = function() { return _name;\n  };\n}\n\
    var student1 = new Student(\"Sandeep\"); student1 ._name = \"John\";\nconsole.log(student1.getName());\n\
    ```\n\nThe details of the previous code are as follows:\n\nA `Student` object\
    \ `student1` is created with `_name` has value `Sandeep`.\n\nA new name value\
    \ `John` is assigned to `_name` but the `getName()` method prints `Sandeep` to\
    \ the console. It proves `_name` is private. \n\nThe following screenshot shows\
    \ the Chrome console with the output of the previous code.\n\n![](Images/image00070.jpeg)\n\
    \n## Chapter 4 Questions on JSON\n\n### Q. What is JSON ? \n\n**ANSWER**\n\nThe\
    \ JSON text format is syntactically identical to the code for creating JavaScript\
    \ objects. JSON is only a subset of JS object literal notation, but apart from\
    \ looking similar, they have nothing in common. JSON is used as data exchange\
    \ format, like XML. JSON is built on two structures:\n\n1. A collection of name/value\
    \ pairs. In various languages, this is realized as an object, record, struct,\
    \ dictionary, hash table, keyed list, or associative array.\n2. An ordered list\
    \ of values. In most languages, this is realized as an array, vector, list, or\
    \ sequence.\n\n### Q. Why does Google prepend while (1); to their JSON responses?\
    \ ANSWER**\n\nIt prevents JSON hijacking. This is to ensure some other site can't\
    \ do nasty tricks to try to steal data. By replacing the array constructor, then\
    \ including this JSON URL via a `<script>` tag, a malicious thirdparty site could\
    \ steal the data from the JSON response. By putting a `while(1);` at the start,\
    \ the script will crash instead. A same-site request using `XHR` and a separate\
    \ JSON parser, on the other hand, can easily ignore the `while(1);` prefix.\n\n\
    ### Q. What is JSONP ?\n\n**ANSWER**\n\nJSONP stands for “JSON with Padding”.\
    \ It means JSON data wrapped in a function call. A callback (processing/padding)\
    \ function already defined in the Web page at the time of requesting remote JSON\
    \ data.\n\n**Example:**\n\nThe below JavaScript code shows a callback function\
    \ `paddingFunction()` for a remote URL `//abcdurl`.\n\n```javascript\nfunction\
    \ paddingFunction(data){\nconsole.log(\"response data processing code\")\n}\n\
    var script = document.createElement('script');\nscript.src = '//abcdurl?callback=paddingFunction'\n\
    document.getElementsByTagName('head')[0].appendChild(scrip t);\n```\n\n### Q.\
    \ Why use JSON over XML ?\n\n**ANSWER**\n\nThe following points are in favor of\
    \ JSON over XML:\n\n- JSON can contain Integer, String, List, Arrays.\n- JSON\
    \ is smaller, faster and lightweight compared to XML.\n- JSON can be mapped more\
    \ easily into object oriented system.\n- JSON and XML both use Unicode and thus\
    \ support Internationalization.\n- JSON is a better data exchange format. XML\
    \ is a better document exchange format.\n- JSON is less secure because of absence\
    \ of JSON parser in browser. If the data is in XML, you can write an XSLT template\
    \ and run it over the XML to output the data into another format: HTML, SVG, plain\
    \ text, comma-delimited, even JSON. So here, XML scores over JSON.\n\n### Q. What\
    \ is MIME type for JSON?\n\n**ANSWER**\n\nThe MIME type for JSON is `application/json`.\n\
    \n### Q. What data types are supported by JSON?\n\n**ANSWER**\n\nDifferent data\
