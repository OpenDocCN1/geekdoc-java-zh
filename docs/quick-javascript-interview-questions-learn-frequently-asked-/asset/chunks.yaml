  trans: "\n\n差异继承（Differential Inheritance）是一种常见的面向原型的模型，它使用的概念是大多数对象派生自其他更通用对象，仅在少数微小方面不同。每个对象都维护一个对其原型的引用以及一个包含不同属性的表。\n\
    \n### Q. `Object.create()` 方法的作用是什么？\n\n**答案**\n\nECMAScript 5.1 在其规范中包含了该方法。该方法可以用于使用指定的原型对象和属性创建一个新对象。该方法的语法列如下。\n\
    \n`Object.create(proto[, propertiesObject])`\n\n**示例：**\n\n下面的代码包含一个 `Student`\
    \ 类函数，它具有 `name` 属性，原型对象有一个方法 `getStudentName()`，该方法返回学生的姓名。通过使用 `Object.create()`\
    \ 方法传递 `Student` 的原型对象并将 name 的值设为 `sandeep`，创建了一个新的 `student1` 对象。然后在 `student1`\
    \ 对象上调用 `getStudentName()` 方法并在控制台中打印结果。\n\n```javascript\nfunction Student(name)\
    \ {\n  this.name = name;\n}\n\nStudent.prototype = {\n  getStudentName: function()\
    \ {\n    return \"Name of Student is :\" + this.name;\n  }\n};\n\nvar student1\
    \ = Object.create(Student.prototype);\nstudent1.name = \"Sandeep\";\n\nconsole.log(student1.getStudentName());\n\
    ```\n\n下面的截图显示了上述代码在开发者控制台中的输出。\n\n![](img/image00059.jpeg)\n\n### Q. 如果浏览器中不存在\
    \ `Object.create()` 方法，如何为它编写一个 polyfill？\n\n**答案**\n\nECMAScript 5.1 在其规范中包含了该方法。如果浏览器较旧，则不存在\
    \ `Object.create()` 方法。为了解决这个问题，我们需要编写一个 polyfill。下面的代码展示了 `Object.create()` 方法的\
    \ polyfill。\n\n```javascript\n//检查 Object 内部是否存在 create 方法\nif (typeof Object.create\
    \ != 'function') {\n  //定义 create 方法\n  Object.create = (function() {\n    var\
    \ Object = function() {};\n    return function(prototype) {\n      if (arguments.length\
    \ > 1) {\n        throw Error('Second argument not supported');\n      }\n   \
    \   if (typeof prototype != 'object') {\n        throw TypeError('Argument must\
    \ be an object');\n      }\n      Object.prototype = prototype;\n      var result\
    \ = new Object();\n      Object.prototype = null;\n      return result;\n    };\n\
    \  })();\n}\n```\n\n上述代码使用 `if` 条件通过将其类型与 `function` 来检查 `Object` 内部是否已存在 `create()`\
    \ 方法。如果该条件成立，则意味着不存在 `create()` 方法。然后执行 polyfill 代码块并将空对象赋值给 `Object.create` 属性。\n\
    \n### Q. `Object.defineProperties()` 方法的目的是什么？**答案**\n\nECMAScript 5.1 提供了 `Object.defineProperties()`\
    \ 方法来为已定义的对象创建新属性。它提供了许多配置选项来初始化这些成员。下面的代码展示了该方法的用法。\n\n```javascript\nfunction\
    \ Student(name) {\n  this.name = name;\n}\n\nvar student1 = Object.create(Student.prototype),\n\
    properties = {\n  \"subject\": {\n    value: \"Computer\",\n    writable: true,\n\
    \    enumerable: true\n  },\n  \"marks\": {\n    value: 0,\n    writable: false,\n\
    \    enumerable: true\n  }\n};\n\nObject.defineProperties(student1, properties);\n\
    \nstudent1.name = \"Sandeep\";\nstudent1.subject = \"Mathematics\";\nstudent1.marks\
    \ = 75;\n\nconsole.log(student1);\n```\n\n在上述代码中，使用 `Object.create()` 方法创建了一个\
    \ `student1` 对象。然后向该对象添加了一些如 `subject` 和 `marks` 的新属性。`enumerable` 决定了该属性是否可以作为属性被枚举。`writable`\
    \ 属性决定了属性是否可修改。`value` 属性获取属性的默认值。下面的截图显示了上述代码在开发者控制台中的输出。\n\n![](img/image00060.jpeg)\n\
    \n### Q. 如何在 JavaScript 中区分作用域（scope）和上下文（context）？**答案**\n\n作用域（scope）涉及变量的可见性，而上下文（context）指的是方法所属的对象，并且可以使用\
    \ `call` 或 `apply` 进行更改。\n\n### Q. 变量可以赋值给空对象的两种方法是什么？**答案**\n\n在创建新的空对象时，你可以实例化\
    \ `Object()` 构造函数，或者简单地创建一个空对象字面量。在任何一种情况下，你都可以向新对象添加属性。创建空对象的语法列如下。\n\n```javascript\n\
    var aEmptyObject = new Object();\nvar aEmptyObject = {};\n```\n\n## 第 2 章关于事件的问题\n\
    \n### Q. 事件是如何工作的？\n\n**答案**\n\n事件传播遵循两个阶段：**捕获**（capturing）阶段和**冒泡**（bubbling）阶段。\n\
    \n![](img/image00061.jpeg)\n\n**捕获阶段：**\n\n在此阶段，事件首先从 `DOCUMENT` **向下**传递到 `target`\
    \ 元素，经过了所有内部元素。\n\n**冒泡阶段：**\n\n在此阶段，事件从 `target` 元素**向上**返回到 `DOCUMENT`，经过了所有外部包裹元素。\n\
    \n### Q. 如何将事件绑定到元素上？\n\n**答案**\n\n根据 DOM Level 2 事件规范，可以使用 `addEventListener()`\
    \ 方法将事件绑定到元素上，该方法使用**三个**参数。\n\n**语法：**\n\n`<element>.addEventListener(eventname,eventcallback,booleanphase)`\n\
    \n**eventname:**\n\n代表事件类型，如字符串 `click`、`mouseover`、`mouseout` 等。\n\n**eventcallback:**\n\
    \n代表要处理的回调函数。\n\n**booleanphase:**\n\n这代表阶段。`false` 表示冒泡阶段，`true` 表示捕获阶段。\n\n\
    ### Q. 在 IE9 版本之前如何绑定事件？**答案**\n\n在 IE 浏览器中，可以使用 `attachEvent()` 方法将事件绑定到元素。仅用于冒泡阶段。\n\
    \n**语法：**\n\n`<element>.attachEvent(eventname,eventcallback)`\n\n**示例：**\n\n在文档上添加一个事件监听器，当事件发生时弹出提示框。\n\
    \n```javascript\ndocument.addEventListener('click', function () {\n  alert(\"\
