  trans: "\n\n下面的截图显示了在 `sayHello()` 方法中使用未声明变量时产生的错误。\n\n![](img/image00104.jpeg)\n\
    \n### 问题：请列出严格模式下不允许的一些条件？\n\n### 回答\n\n在下文中列出了 ECMA5 严格模式下不允许的条件列表：\n\n- 不允许使用未声明的变量。不允许删除变量、函数或参数。\n\
    - 不允许重复定义属性。不允许参数名重名（重复参数名）。\n- 不允许使用八进制数字字面量和转义字符。\n- 不允许写入只读属性。不允许删除不可删除的属性。\n\
    - 字符串 `\"eval\"` 不能作为变量名。字符串 `\"arguments\"` 不能作为变量名。不允许使用 `with` 语句。\n- 不允许使用未来保留的关键字。\n\
    \n### 问题：0.1+0.2 在控制台中的输出是什么？为什么？\n\n### 回答\n\nJavaScript 数学库遵循 IEEE 754 数标准进行数学运算。IEEE\
    \ 754 标准使用 64 位表示浮点数。这导致在评估 `0.1 + 0.2` 表达式时产生问题。下面的截图显示了该表达式的 Firebug 控制台。\n\n\
    ![](img/image00105.jpeg)\n\nJavaScript 内部将 `0.1` 转换为 16 精度，变为 `0.1000000000000000`，然后加上\
    \ `0.2` 变为 `0.30000000000000004`。下面的截图显示了 JavaScript 代码中的这一演示。\n\n![](img/image00106.jpeg)\n\
    \n### 问题：如何解决 0.1+0.2 = 0.30000000000000004 问题并产生 0.1+0.2 = 0.3？\n\n### 回答\n\n\
    这个问题可以通过对该表达式使用 `toFixed(1)` 方法来解决。`toFixed()` 方法将数字转换为指定的小数位数。下面的截图显示了如何使用 `toFixed()`\
    \ 方法产生正确的输出 `0.3`。\n\n![](img/image00107.jpeg)\n\n### 问题：以下代码的输出是什么？为什么？\n\n```javascript\n\
    (function(){\n\nvar a = b = 3;\n\n})();\n\nconsole.log(typeof a);\n\nconsole.log(typeof\
    \ b);\n```\n\n### 回答\n\n上述代码将在控制台中打印 `undefined` 和 `Number`。下面的截图显示了上述代码在 Firebug\
    \ 控制台中的输出。\n\n![](img/image00108.jpeg)\n\nJavaScript 将上述代码处理如下图所示。从下面的代码可以清楚看出，变量\
    \ `a` 处于函数的局部作用域内，而 `b` 被视为 `this.b`。当前的引用 `this` 代表 `window` 对象。\n\n![](img/image00109.jpeg)\n\
    \n### 问题：以下代码的输出是什么？为什么？console.log(1+2+4);\n\n### 回答\n\n由于所有参数都是数字，上述代码的输出是 `7`。下面的截图显示了上述代码在\
    \ chrome 控制台中的输出。\n\n![](img/image00110.jpeg)\n\n### 问题：解释 JavaScript 中的提升（Hoisting）？\n\
    \n### 回答\n\n提升是 JavaScript 将声明移动到顶部的默认行为。换句话说，变量可以在声明之前被使用。让我们通过以下示例来理解提升。\n\n\
    **示例 1：**\n\n以下代码包含一个 `display()` 方法，该方法会在控制台中打印 `a` 的值。\n\n```javascript\nfunction\
    \ display(){ console.log(a);\n}\n\ndisplay();\n```\n\n上述代码将产生引用错误（reference error），因为我们没有定义该变量。下面的截图显示了上述代码的输出。\n\
    \n![](img/image00111.jpeg)\n\n**示例 2：**\n\n以下代码包含一个 `display()` 方法，该方法会在控制台中打印\
    \ `a` 的值。\n\n```javascript\nfunction display(){\n\nvar a;\n\nconsole.log(\"Output:\
    \ \"+a); \n}\n\ndisplay();\n```\n\n上述代码的输出将 `undefined`，因为我们定义了变量但没有分配任何值。下面的截图显示了上述代码的输出。\n\
    \n![](img/image00112.jpeg)\n\n**示例 3：**\n\n以下代码包含一个 `display()` 方法，该方法会在控制台中打印\
    \ `a` 的值。\n\n```javascript\nfunction display(){\n\nconsole.log(\"Output: \"+a);\n\
    \nvar a; \n}\n\ndisplay();\n```\n\n上述代码的输出将 `undefined`，因为我们定义了变量但没有分配任何值。示例 2\
    \ 和示例 3 的输出相同。这意味着变量声明被移动到了顶部。下面的截图显示了上述代码的输出。\n\n![](img/image00113.jpeg)\n\n\
    ## 关于作者\n\n![](img/image00114.jpeg)\n\nSandeep Kumar Patel 是一位高级 Web 开发人员，`www.tutorialsavvy.com`\
    \ 的创始人，这是一个自 2012 年以来就广受欢迎的编程博客。他在面向对象的 JavaScript 和基于 JSON 的 Web 应用开发方面拥有五多年的经验。他通过了\
    \ GATE-2005 信息技术（IT）认证，并获得 VIT University, Vellore 的硕士学位。\n\n你可以通过以下途径了解更多关于他的信息：\n\
    \n- LinkedIn 简介 (`http://www.linkedin.com/in/techblogger`)。\n- 他曾因发布 Web 技术文章获得\
    \ Dzone 最价值博客主（MVB）奖。他的文章可以在此处查看：`http://www.dzone.com/users/sandeepgiet`。\n-\
    \ 他因在 JCG 发表的技术文章获得了 Java Code Geek（JCG）勋章。他的文章可以在此处查看：`http://www.javacodegeeks.com/author/sandeep-kumar-patlet/`。\n\
    - Packt 出版社《Instant GSON》的作者，`http://www.packtpub.com/create-json-data-java-objectsimplement-with-gson-library/book`。\n\
    \n有问题或建议？可以通过邮件 `sandeeplattech@gmail.com` 联系我，或在以下社交网络上找到我：\n\n- Facebook 页面：`http://www.facebook.com/SandeepTechTutorials`\n\
    - 教程博客：`http://www.tutorialsavvy.com`\n\n## 最后的一件事...\n\n当你翻页时，Kindle 会给你一个对这本书进行评分并在\
    \ Facebook 和 Twitter 上分享想法的机会。如果你认为这本书值得分享，请花几秒钟让你的朋友知道它。如果它对他们的职业生涯有所帮助，他们会永远感激你，我也一样。\n\
    \n祝好，\n\nSandeep Kumar Patel.\n\n"
