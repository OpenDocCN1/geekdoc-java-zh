    \n## 第 11 章 本地存储 (Local Storage)\n\n### Q. 什么是本地存储？\n\n**答案**\n\nHTML5 提供了一项在终端用户浏览器中本地存储数据的功能。数据以键值对的形式在浏览器中。与\
    \ cookie 不同，它的平均空间为 5 MB。这种存储分为两种不同的类型：`sessionStorage` 和 `localStorage`。\n\n\
    `localStorage`：它存储不带过期日期的数据。`sessionStorage`：它存储带有过期日期的数据。\n\n### Q. 哪一个是主要的存储接口？\n\
    \n**答案**\n\n`window.Storage()` 是实现 `localStorage` 和 `sessionStorage` 的主接口。该接口的定义如下。\n\
    \n```javascript\ninterface Storage {\n  readonly attribute unsigned long length;\n\
    \  DOMString? key(unsigned long index);\n  getter DOMString? getItem(DOMString\
    \ key);\n  setter creator void setItem(DOMString key, DOMString value);\n  deleter\
    \ void removeItem(DOMString key);\n  void clear();\n}\n```\n\n上述代码的细节如下：\n\n`setItem(key,value)`：此方法使用键值对在存储中存储值。\n\
    `getItem(key)`：此方法使用键检索已存储的对象。\n`removeItem(key)`：此方法根据键删除存储的项。\n`clear()`：删除存储器中的所有项。`length`：此属性返回存储的长度，即存储器内部元素的数量。\n\
    `key(position)`：此方法返回给定数字位置的值对应的键。\n\n### Q. 如何在本地存储中存储和检索对象？**答案**\n\n本地存储提供了\
    \ `setItem()` 和 `getItem()` 来从存储中存储和检索对象。`setItem(key, value)` 方法接受 2 个输入参数来存储对象。`getItem(key)`\
    \ 方法使用键作为输入参数检索值。下面的代码显示在“myName”键中存储“Sandeep Kumar”字符串，然后检索该字符串并放入 HTML 元素中。\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<div id=\"resultContainer\"></div>\
    \ \n<script>\nvar container = document.getElementById(\"resultContainer\");\n\
    localStorage.setItem(\"myName\", \"Sandeep Kumar\"); \ncontainer.innerHTML = localStorage.getItem(\"\
    myName\"); \n</script>\n</body>\n</html>\n```\n\n下面的截图显示了 Chrome 开发者工具的存储预览，它将上述对象作为键值对持有。\n\
    \n![](img/image00097.jpeg)\n\n### Q. 如何为本地存储附加事件？\n\n**答案**\n\n当本地存储对象被修改时，会触发\
    \ `storage` 事件。可以使用 `addEventListener()` 在 `window` 对象上附加回调方法。\n\n**注意**：在存储上调用\
    \ `setItem()`、`removeItem()` 和 `clear()` 时，会触发 `storage` 事件。下面的代码有一个监听存储的回调方法。\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<body>\n<div id=\"resultContainer\"></div>\n\
    <button onclick=\"update()\">Click Me</button>\n<script>\nvar container = document.getElementById(\"\
    resultContainer\"),\nmethodStorageEvent = function(event){ \n  container.innerHTML\
    \ = \"Event Fired\"+localStorage.getItem(\"myName\");\n},\ncounter = 1,\nupdate\
    \ = function(){\n  localStorage.setItem(\"myName\", ++counter);\n  container.innerHTML\
    \ = localStorage.getItem(\"myName\");\n};\nwindow.addEventListener(\"storage\"\
    , methodStorageEvent, false)\n</script>\n</body>\n</html>\n```\n\n下面的截图演示了如何触发存储事件，以及访问相同页面的其他标签如何接收存储事件并更新其内容。\n\
    \n![](img/image00098.jpeg)\n\n## 第 12 章 File API\n\n### Q. 什么是 HTML5 File API？\n\
    \n**答案**\n\nHTML5 提供了一种浏览器内部处理文件的新 API。此 API 提供了 `File`、`FileList` 和 `Blob` 数据类型来处理文件。它提供了\
    \ `FileReader` 接口来异步读取文件。\n\n### Q. FileReader 为异步读取提供了哪些方法？\n\n**答案**\n\n`FileReader`\
    \ 提供了 4 种不同的方法来处理加载的文件。这些异步方法列如下：\n\n`readAsBinaryString(Blob | File)`：读取目标文件并将其保存为包含\
    \ 0-255 整数的二进制字符串。\n`readAsText(Blob | File, opt_encoding)`：读取目标文件并保存为 UTF-8 文本文件。`readAsDataURL(Blob\
    \ | File)`：读取目标文件并返回包含 base64 ASCII 字符串的数据 URL。`readAsArrayBuffer(Blob | File)`：读取目标文件并将其保存到数组缓冲区。\n\
    \n### Q. JavaScript 中的 Blob 对象是什么？\n\n**答案**\n\nBlob 对象代表字节序列。Blob 对象的 IDL（接口定义语法）如下：\n\
    \n```javascript\ninterface Blob {\n  readonly attribute unsigned long long size;\n\
    \  readonly attribute DOMString type;\n  Blob slice(optional [Clamp] long long\
    \ start, optional [Clamp] long long end, optional DOMString contentType);\n  void\
    \ close();\n};\n```\n\n"
- fmt: "\nThe details of the method and properties are as follows:\n\n- `slice method`:\
    \ The slice method returns a new `Blob` object with bytes ranging from the optional\
    \ `start` parameter up to but not including the optional `end` parameter, and\
    \ with a type attribute that is the value of the optional `contentType` parameter.\n\
    - `close method`: The close method must permanently neuter the original `Blob`\
    \ object. This is an irreversible and nonidempotent operation; once a `Blob` has\
    \ been neutered, it cannot be used again; dereferencing a `Blob URL` bound to\
    \ a `Blob` object on which `close` has been called results in a network error.\
    \ A neutered `Blob` must have a size of 0.\n- `size property`: It returns the\
    \ size of the `Blob` object in bytes.\n- `type property`: It returns the type\
    \ of the content that the `Blob` object holds.\n\n### How to create a Blob Object?\n\
    \n#### ANSWER\n\nA blob object can be created using `new` keyword with `Blob`\
    \ constructor. A `Blob` constructor takes the following parameters:\n\n- `Blob\
    \ part sequence`: This can be either `ArrayBuffer`, `ArrayBufferView`, `Blob`\
    \ and `DOMString`.\n- `Blob property bag`: It takes one parameter representing\
    \ type of the ASCII-encoded string in lower case representing the media type of\
    \ the `Blob`.\n\nThe following code shows an example of creating Blob using `new`\
    \ keyword:\n\n```javascript\nvar a = new Blob();\n\nvar b = new Blob([\"foobarbazetcetc\"\
    \ + \"birdiebirdieboo\"], {type: \"text/plain;charset=UTF-8\"});\n```\n\n### What\
    \ are readable states for a Blob object?\n\n#### ANSWER\n\nA `Blob` must have\
    \ a readability state, which is one of `OPENED` or `CLOSED`.\n\nA `Blob` that\
    \ refers to a byte sequence, including one of 0 bytes, is said to be in the `OPENED`\
    \ readability state.\n\nA `Blob` is said to be closed if its `close` method has\
    \ been called. A `Blob` that is closed is said to be in the `CLOSED` readability\
    \ state.\n\n### What are different states of FileReader?\n\n#### ANSWER\n\nThe\
    \ `FileReader` object can be in one of 3 states. The `readyState` attribute, on\
    \ getting, must return the current state, which must be one of the following values:\n\
    \n- `EMPTY`: The `FileReader` object has been constructed, and there are no pending\
    \ reads. None of the read methods have been called. This is the default state\
    \ of a newly minted `FileReader` object, until one of the read methods have been\
    \ called on it.\n- `LOADING`: A `File` or `Blob` is being read. One of the read\
    \ methods is being processed, and no error has occurred during the read.\n- `DONE`:\
    \ The entire `File` or `Blob` has been read into memory, OR a file error occurred\
    \ during read, OR the read was aborted using `abort()`. The `FileReader` is no\
    \ longer reading a `File` or `Blob`. If `readyState` is set to `DONE` it means\
    \ at least one of the read methods have been called on this `FileReader`.\n\n\
    ## Chapter 13 Web RTC\n\n### What is Web RTC?\n\n#### ANSWER\n\nWeb RTC provides\
    \ the capability to browsers for real time communication without any additional\
    \ plugin installed. It involves audio, video and other type of data streaming\
    \ among the browser with their native capability.\n\n### What is the API implemented\
    \ by Web RTC?\n\n#### ANSWER\n\nWeb RTC implements three different API. These\
    \ interfaces are listed below.\n\n- `MediaStream`: This represents a synchronized\
    \ media stream using camera and microphone.\n- `RTCPeerConnection`: this interface\
    \ is responsible for stable connection between peer browser during real time communication.\n\
    - `RTCDataChannel`: this interface is responsible for other type of data communication\
    \ between peer browser. For example the remote desktop sharing using browser.\n\
    \n### What is MediaStream?\n\n#### ANSWER\n\nMediaStream basically represents\
    \ the stream captured by Camera and microphone. Each `MediaStream` has an input\
    \ which captures the stream. This `MediaStream` can be accessed using `navigator.getUserMedia()`\
    \ method.\n\n### What are the input parameters to getUserMedia() method?\n\n ANSWER\n\
    \nThe `getUserMedia()` method takes 3 parameters as input. These parameters are\
    \ as follows:\n\n- Constraint Object similar to a configuration object.\n- Success\
    \ Callback Method.\n- Error Callback Method.\n\n### What are MediaStreamTracks?\n\
    \n#### ANSWER\n\nThe `MediaStream` returned by `getUserMedia()` has 2 useful methods\
    \ `getAudioTracks()` and `getVideoTracks()`. Both of these methods returns an\
    \ array of `MediaStramTracks`.\n\n### What are the protocols used by Web RTC for\
    \ communication?\n\n#### ANSWER\n\nWeb RTC uses 2 different protocols for communication.\
    \ These 2 protocols are listed as follows.\n\n- `DTLS`: Datagram Transport Layer\
    \ Security.\n- `SRTP`: Secure Real-time Transport Protocol.\n\n### How to view\
    \ the statistics of an in progress Web RTC session in Chrome browser?\n\n####\
    \ ANSWER\n\nWe can view the detail statistics and charts of an ongoing Web RTC\
    \ session in chrome browser by using `chrome://webrtc-internals/` in chrome browser.\n\
    \n### What are the different event handlers for a channel?\n\n ANSWER\n\nA channel\
    \ has 4 different event handlers. These event handlers are as follows.\n\n- `onopen`:\
    \ Executed when the connection is established.\n- `onerror`: Executed if there\
    \ is an error creating the connection.\n- `onmessage`: When you receive a message,\
    \ this method will execute\n- `onclose`: Executed if the other peer closes the\
    \ connection.\n\n### What is a signal channel?\n\n#### ANSWER\n\nWebRTC can’t\
    \ create connections without some sort of server in the middle. We call this the\
    \ Signal Channel.\n\n### What is an ICE technique?\n\n#### ANSWER\n\nInteractive\
    \ Connectivity Establishment (ICE) is a technique used in computer networking\
    \ involving network address translators (NATs) in Internet applications of Voice\
    \ over Internet Protocol (VoIP), peer-to-peer communications, video, instant messaging\
    \ and other interactive media.\n\n### What is an ICE Candidate?\n\n#### ANSWER\n\
    \nWhile communication peers must exchange information about the network connection.\
    \ This is known as an ICE candidate.\n\n### What are the server side functionalities\
    \ needed by the Web?\n\n ANSWER\n\nWeb RTC requires following functionalities\
    \ from server side to create communication between peers.\n\n- User discovery\
    \ and communication.\n- Signaling.\n- NAT/firewall traversal.\n- Relay servers\
    \ in case peer-to-peer communication fails.\n\n### What is STUN protocol?\n\n\
    \ ANSWER\n\nSTUN (Session Traversal Utilities for NAT) is a standardized set of\
    \ methods and a network protocol to allow an end host to discover its IP address\
    \ if it is located behind a NAT.\n\n## Chapter 14 Drag & Drop API\n\n### How to\
    \ make content draggable inside the browser?\n\n ANSWER\n\nHTML5 provides drag\
    \ and drop feature. An element can be made draggable by setting its draggable\
    \ property to true. Check the below code having 2 buttons. One button is draggable\
    \ and other is just a normal button.\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    <title>Draggable Element</title>\n</head>\n<body>\n<button draggable=\"true\"\
    >Draggable Button</button>\n<button>Normal Button</button>\n</body>\n</html>\n\
    ```\n\nBelow screenshot shows both these buttons. The draggable button is movable\
    \ while the normal button is fixed in its position.\n\n### What happens when drag\
    \ starts for an element?\n\n ANSWER\n\nThere are 3 important key points to note\
    \ when a drag starts. These key points are as follows.\n\n- `Drag Data`: It represent\
    \ the type of data that will be transferred while dragging.\n- `Drag Feedback`:\
    \ This represents image which appears beside the mouse pointer during the drag\
    \ operation.\n- `Drag Effect`: This represents the type of drag happens to element.\
    \ It can be 3 types and listed below.\n    - `copy`: This effect indicates that\
    \ the data being dragged will be copied from its present location to the drop\
    \ location.\n    - `move`: This effect indicates that the data being dragged will\
    \ be moved from its original position to drop location.\n    - `link`: This effect\
    \ indicates that some form of relationship or connection will be created between\
    \ the source and drop locations.\n\n### What are the Drag and drop events?\n\n\
    \ ANSWER\n\nThere are 7 different drag and drop events that can be attached with\
    \ a callback method programmatically.\n"
