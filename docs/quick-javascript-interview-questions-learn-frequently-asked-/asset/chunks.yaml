    ## **Chapter 9 Geo Location API** \n\nQ. What is Geo Location API?\n\n**ANSWER**\n\
    \nGeo Location API publishes the location of the user to the web. It needs user’s\
    \ permission for privacy reason. The Geo location API is present inside **navigator.geolocation**\
    \ object.\n\nQ. How to determine Geo Location API is supported in browser? **ANSWER**\n\
    \nTo determine Geo location API is supported in browser can be determined by the\
    \ truth value of geolocation object inside the navigator object. Below code has\
    \ the function which returns true or false Boolean value based on the geolocation\
    \ object present inside the navigator.\n\n function isGeoLocationSupported(){\n\
    \nvar flag = navigator.geolocation ? true : false; return flag;\n\n}\n\nvar isSupported\
    \ = isGeoLocationSupported(); if(isSupported){\n\nconsole.log(navigator.geolocation);\n\
    \n}else{\n\nconsole.log(\"Geo Location API not supprted\"); } \n\nThe following\
    \ screenshot shows the output of the above code as the geolocation object is present\
    \ inside the navigator API. ![](Images/image00088.jpeg)\n\n## **Chapter 10 Web\
    \ Workers**\n\nQ. What is a Web Worker?\n\n**ANSWER**\n\nWeb Workers are new HTML5\
    \ feature to achieve concurrency in JavaScript execution in web application. A\
    \ web worker is JavaScript file which run in the background of the browser without\
    \ impacting the page performance. This helps in resolve the age old problem “**Un\
    \ responsive script alert box**”. Generally these workers can be used for extensive\
    \ computation purpose.\n\nQ. How to detect Web Worker is supported by browser?\
    \ **ANSWER**\n\nWe can check the support of Web Worker in a browser by validating\
    \ the Worker property is present in the window object. Code for checking Web Worker\
    \ support is as follows:\n\n <!DOCTYPE html>\n\n<html>\n\n<head lang=\"en\">\n\
    \n<title>Web Worker</title>\n\n</head>\n\n<body> \n\n<script>\n\n**var isWorkerSupported**\
    \ = **window.Worker** ? **true** : **false**; console.log(\"Is Web Worker Supported:\n\
    \n\"+isWorkerSupported);\n\n</script>\n\n</body>\n\n</html>\n\nIn the previous\
    \ code isWorkerSupported variable can contain TRUE or FALSE value based on the\
    \ existence of Worker property inside window object. The following screenshot\
    \ shows the output of above code in chrome console.\n\n![](Images/image00089.jpeg)\n\
    \nQ. What is a dedicated worker?\n\n**ANSWER**\n\nA dedicated worker is only accessible\
    \ by the calling script. A dedicated worker object can be created using worker\
    \ constructor. Syntax for creating a new dedicated worker is listed below.\n\n\
    var aDedicatedWorker = new Worker(\"script.js\")\n\nThe parameter inside the Worker\
    \ object is the JavaScript file which will run as worker in the background of\
    \ the browser.\n\nQ. What is a shared worker?\n\n**ANSWER**\n\nA Shared Worker\
    \ can be accessed by multiple scripts. A shared worker is accessible by different\
    \ window, iframe and by other worker having same origin. Syntax for creating a\
    \ new dedicated worker is as follows.\n\nvar aSharedWorker = new SharedWorker(\"\
    script.js\")\n\nThe parameter inside the Worker object is the JavaScript file\
    \ which will run as shared worker in the background of the browser.\n\nQ. Develop\
    \ a dedicated worker to display the time?\n\n**ANSWER**\n\nLet’s create the time\
    \ worker in **dateWorker.js** file and we can call this worker in **dateWorkerDemo.html**\
    \ file. The following code shows the content of **dateWorker.js** file which listens\
    \ to the messages and posts the current time in every second.\n\n **self** .addEventListener(**\"\
    message\"**,**function**(event){ setInterval(**function**(){\n\n**var** time =\
    \ **new** Date();\n\n**self**.postMessage({\n\n**hour** :time.getHours(),\n\n\
    **minute**: time.getMinutes(),\n\n**second**: time.getSeconds() \n\n});\n\n},1000);\n\
    \n});\n\n The following code shows the content of **dateWorkerDemo.html** containing\
