    \ PUBLIC \"-//W3C//DTD XHTML 1.1//EN\" \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
    >\n```\n\n## Chapter 6 Date Object\n\nQ. What is a JavaScript Date Object?\n\n\
    **ANSWER**\n\nJavaScript `Date` object returns time in that single moment. It\
    \ contains the value in number of milliseconds since 1 January, 1970 UTC.\n\n\
    Q. What are the different ways to create a `Date` object? Or what are the different\
    \ constructor forms of `Date` object?\n\n**ANSWER**\n\nJavaScript `Date` object\
    \ has 4 overloaded constructors. These constructors are listed below.\n\n```\n\
    new Date()\nnew Date(milliseconds)\nnew Date(dateString)\nnew Date(year, month,\
    \ day, hours, minutes, seconds, milliseconds)\n```\n\nQ. How to get 1^(st) January\
    \ 1970 in a date object, the date from where time is gets calculated?\n\n**ANSWER**\n\
    \n1st January 1970 is the day from where the time is get calculated as number\
    \ of milliseconds elapsed. It can be calculated by creating a new JS object with\
    \ parameter `0`.below screenshot demonstrate the date object with parameter `0`.\n\
    \n![](Images/image00079.jpeg)\n\nQ. How JavaScript counts months?\n\n**ANSWER**\n\
    \nJavaScript counts months from 0 to 11 for the twelve months a year. 0 represents\
    \ January and 11 represent December. Below screenshot shows the code for today’s\
    \ date that is July 23 and year 2014 and `getMonth()` returns 6.\n\n![](Images/image00080.jpeg)\n\
    \nQ. When `RangeError` invalid date exception occurs?\n\n**ANSWER**\n\nWhen a\
