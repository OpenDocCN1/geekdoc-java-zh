    \nQ. What is query selector in DOM?\n\n**ANSWER**\n\nDOM provides **querySelector()**\
    \ and **querySelectorAll()** methods for selecting DOM elements. querySelector()\
    \ method return a single element which matches first in the DOM. querySelectorAll()\
    \ method return a node list of matched elements. Below code demonstrates the use\
    \ of these methods in selecting elements from DOM.\n\n <!DOCTYPE html>\n\n<html>\n\
    \n<head>\n\n<title>Document Query Selector Example</title>\n\n</head>\n\n<body>\n\
    \n<h5 class=\"name\">Sandeep Kumar Patel</h5>\n\n<h4 class=\"country\">India</h4>\n\
    \n<h4 class=\"country\">UK</h4>\n\n<h5 class=\"name\">Surabhi Patel</h5>\n\n<h4\
    \ class=\"country\">US</h4>\n\n<h4 id=\"my-score\">520</h4>\n\n<script>\n\nvar\
    \ element = document.querySelector( \"#my-score\" ); element.style.color=\"red\"\
    ;\n\nvar elements = document.querySelectorAll(\"h4#my-score,\n\nh5.name\");\n\n\
    for (var item of elements) {\n\nitem.style.fontStyle = \"Italic\";\n\n}\n\nvar\
    \ aElement = document.querySelector( \"h4.country, h4#my-score\" );\n\naElement.style.background\
    \ = \"orange\";\n\n</script>\n\n</body>\n\n</html> \n\nThe following screenshot\
    \ shows the output of the above code in Browser.\n\n![](Images/image00077.jpeg)\n\
    \nQ. What is primary Data Type of DOM?\n\n**ANSWER**\n\nNode interface is the\
    \ primary data type of DOM. It represents a single item from DOM tree. Document,\
    \ Element, CharacterData, ProcessingInstruction, DocumentFragment, DocumentType,\
    \ Notation, Entity, EntityReference interface inherits from Node interface.\n\n\
    Q. What is document fragment in DOM?\n\n**ANSWER**\n\n**DocumentFragment** is\
    \ a light weight version of DOM. It does not have any parent class. It is generally\
    \ used by the developer as a temporary storage of DOM elements. Below code shows\
    \ an Example of creating document fragment and adding HTML element to it and finally\
    \ placing it to the body of the DOM.\n\n <!DOCTYPE html>\n\n<html>\n\n<head>\n\
    \n<title>DocumentFragment Example</title>\n\n</head>\n\n<body>\n\n<script>\n\n\
    var aFragment = document.createDocumentFragment(), aHTMLElement = document.createElement(\"\
    h2\"), aTEXTElement = document.createTextNode(\"SANDEEP\");\n\naHTMLElement.appendChild(aTEXTElement);\n\
    \naFragment.appendChild(aHTMLElement);\n\ndocument.body.appendChild(aFragment);\n\
    \n</script>\n\n</body>\n\n</html>\n\nBelow screenshot shows an h2 element with\
    \ a child text node containing value SANDEEP is place inside document fragment.\
    \ Finally the document fragment is appended as a child to the body element. \n\
    \n![](Images/image00078.jpeg)\n\nQ. Which is basic object of DOM?\n\n**ANSWER**\n\
    \nNode is most basic object of DOM. It is the most common interface from which\
    \ lot of other DOM object are inherited. The following interfaces all inherit\
    \ from Node its methods and properties: Document, Element, CharacterData, ProcessingInstruction,\
    \ DocumentFragment, DocumentType, Notation, Entity, EntityReference. These interfaces\
    \ may return null in particular cases where the methods and properties are not\
    \ relevant. They may throw an exception - for example when adding children to\
    \ a node type for which no children can exist.\n\nQ. What are the common doctype\
    \ declarations?\n\n**ANSWER**\n\nThere are 8 different type of doctype declaration\
    \ and are listed below.\n\n**HTML 5**: This document type is used in HTML5.\n\n\
    <!DOCTYPE html>\n\n **HTML 4.01 Strict** : This DTD contains all HTML elements\
    \ and attributes, but does NOT INCLUDE presentational or deprecated elements (like\
    \ font). Framesets are not allowed.\n\n<!DOCTYPE HTML PUBLIC \"-//W3C//DTD HTML\
    \ 4.01//EN\"\n\n\"http://www.w3.org/TR/html4/strict.dtd\">\n\n**HTML 4.01 Transitional**\
    \ : This DTD contains all HTML elements and attributes, INCLUDING presentational\
    \ and deprecated elements (like font). Framesets are not allowed.\n\n<!DOCTYPE\
    \ HTML PUBLIC \"-//W3C//DTD HTML 4.01 Transitional//EN\""
