  trans: "\n\"http://www.w3.org/TR/html4/loose.dtd\"\n\n### **HTML 4.01 Frameset**:\
    \ 此 DTD 等于 HTML 4.01 Transitional，但允许使用 frameset 内容。\n\n```html\n<!DOCTYPE HTML\
    \ PUBLIC \"-//W3C//DTD HTML 4.01 Frameset//EN\" \"http://www.w3.org/TR/html4/frameset.dtd\"\
    >\n```\n\n### **XHTML 1.0 Strict**: 此 DTD 包含所有的 HTML 元素和属性，但**不包含**表现层或已弃的元素（如\
    \ `font`）。不允许使用 framesets。标记必须写成良好的 XML。\n\n```html\n<!DOCTYPE html PUBLIC \"\
    -//W3C//DTD XHTML 1.0 Strict//EN\" \"strict.dtd\">\n```\n\n### **XHTML 1.0 Transitional**:\
    \ 此 DTD 包含所有的 HTML 元素和属性，**包括**表现层和已弃的元素（如 `font`）。不允许使用 framesets。标记必须写成良好的 XML。\n\
    \n```html\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.0 Transitional//EN\" \"\
    transitional.dtd\">\n```\n\n### **XHTML 1.0 Frameset**: 此 DTD 等于 XHTML 1.0 Transitional，但允许使用\
    \ frameset 内容。\n\n```html\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.0 Frameset//EN\"\
    \ \"frameset.dtd\">\n```\n\n### **XHTML 1.1**: 此 DTD 等于 XHTML 1.0 Strict，但允许你添加模块（例如为东亚语言提供注音支持）。\n\
    \n```html\n<!DOCTYPE html PUBLIC \"-//W3C//DTD XHTML 1.1//EN\" \"http://www.w3.org/TR/xhtml11/DTD/xhtml11.dtd\"\
    >\n```\n\n## 第 6 章 Date 对象 (Date Object)\n\n问：什么是 JavaScript Date 对象？\n\n**答案**\n\
    \nJavaScript `Date` 对象返回该时刻的时间。它包含了自 1970 年 1 月 1 日 UTC 以来的毫秒数值。\n\n问：创建 `Date`\
    \ 对象的不同方法有哪些？或者 `Date` 对象不同的构造函数形式形式？\n\n**答案**\n\nJavaScript `Date` 对象有 4 个重载构造函数。这些构造函数列如下：\n\
    \n```\nnew Date()\nnew Date(milliseconds)\nnew Date(dateString)\nnew Date(year,\
    \ month, day, hours, minutes, seconds, milliseconds)\n```\n\n问：如何在日期对象中获取 1970\
    \ 年 1 月 1 日（即计算时间的起始日期）？\n\n**答案**\n\n1970 年 1 月 1 日是计算时间为经过的毫秒数的起始日。可以通过创建一个参数为\
    \ 0 的新 JS 对象来计算。下面的截图演示了参数为 `0` 的日期对象。\n\n![](img/image00079.jpeg)\n\n问：JavaScript\
    \ 如何计算月份的？\n\n**答案**\n\nJavaScript 从 0 到 11 计算一年的十二个月份。0 代表 1 月，11 代表 12 月。下面的截图显示了今天日期（2014\
    \ 年 7 月 23 日）的代码，`getMonth()` 返回 6。\n\n![](img/image00080.jpeg)\n\n问：什么时候会发生 `RangeError`\
    \ 无效日期异常？\n\n**答案**\n\n当使用无效的日期字符串创建日期对象，并对该无效日期应用 `toISOString()` 方法时，就会发生 `RangeError`。下面的截图显示了字符串\
    \ '2014-13-13$，它代表 YYYY-MM-DD 格式，但月份超出范围，产生了 `RangeError` 异常。\n\n![](img/image00081.jpeg)\n\
    \n## 第 7 章 正则表达式 (Regular Expression)\n\n问：JavaScript 中的正则表达式是什么？\n\n**答案**\n\n\
    正则表达式用于字符串的模式匹配。JavaScript 中的正则表达式可以通过两种方式声明。这两种方法的语法列在下方：\n\n```javascript\n\
    var aRegExpression = new RegExp(pattern,modifiers);\nvar aRegExpression = /pattern/modifiers;\n\
    ```\n\n这些语法的细节如下：\n\n- `pattern`：表示搜索字符串。\n- `modifiers`：表示应用于模式匹配的条件开关。\n\n问：正则表达式有哪些方法？\n\
    \n**答案**\n\n下面列出了 3 种不同的正则表达式方法：\n\n- `exec()`：扫描匹配字符串并返回第一个匹配字符串。\n- `test()`：扫描匹配字符串并返回布尔值\
    \ `false` 或 `true`。\n- `toString()`：此方法返回正则表达式的字符串值。\n\n问：切换符 `\\w` 代表什么？\n\n\
    **答案**\n\n`\\w` 代表字母数字字符。下面的代码演示了 `\\w` 关的使用。\n\n```javascript\nvar regEx= /\\\
    wu/;\nvar out1 = regEx.exec(\"sandeep Ku Patel\"), out2 = regEx.test(\"sandeep\
    \ Ku Patel\");\nconsole.log(out1);\nconsole.log(out2);\n```\n\n下面的截图显示了上述代码的输出，该模式匹配任何第二个字符为\
    \ `u` 的字母数字字符子串。\n\n![](img/image00082.jpeg)\n\n问：写一个正则表达式来反转姓和名？例如，将 Sandeep\
    \ Patel 变为 Patel Sandeep。\n\n**答案**\n\n要反转姓和名，我们必须在输入字符串上对正则表达式使用 `replace()`\
    \ 函数。下面的代码显示了反转姓和名的方法。\n\n```javascript\nvar reverseFirstLastName = function(nameString){\n\
    var regex = /(\\w+)\\s(\\w+)/,\nresultString = \n```\n"
- fmt: "\nLarger number of objects (>10k), or both.\n\nGood text rendering capabilities.\n\
    \nBetter SEO and Accessibility as it DOM based rendering.\n\nModified through\
    \ script and CSS.\n\nPerformance is better with smaller number of objects (<10k),\
    \ a larger surface, or both.\n\n## Q. What is canvas 2d context and how it is\
    \ created?\n\n**ANSWER**\n\nUsing `getContext()` method with parameter `'2d'`\
    \ a canvas context can be created.\n\nThis context method is a type of `CanvasRenderingContext2D`\
    \ object. Below code shows a simple 2d context creation and log the object’s constructor.\n\
    \n```html\n<html>\n<body>\n<canvas id=\"myCanvas\"></canvas>\n<script>\nvar canvas\
    \ = document.getElementById(\"myCanvas\"), context = canvas.getContext(\"2d\"\
    );\nconsole.log(context.constructor);\n</script>\n</body>\n</html>\n```\n\nThe\
    \ following screenshot shows the constructor function of the context object which\
    \ is `CanvasRenderingContext2D` native object. \n\n![](Images/image00086.jpeg)\n\
    \n## Q. How to load an image in Canvas?\n\n**ANSWER**\n\nAn image can be loaded\
    \ using `drawImage()` method. This method takes several inputs for drawing an\
    \ image. These parameters are positioning and clipping type. We will discuss these\
    \ parameters in separate question. Below code shows how to use the `drawImage()`\
    \ method to load a PNG image from a URL inside the canvas.\n\n```html\n<html>\n\
    <body>\n<canvas id=\"myCanvas\"></canvas>\n<script>\nvar canvas = document.getElementById(\"\
    myCanvas\"), context = canvas.getContext(\"2d\"),\nimg = new Image();\nimg.src\
    \ = \"http://www.gravatar.com/avatar/4205261332ff131e971b48db31dcb528.png\";\n\
    img.onload = function() {\ncontext.drawImage(img, 10, 10);\n};\n</script>\n</body>\n\
    </html>\n```\n\nBelow screenshot shows the Gravatar image getting drawn inside\
    \ the HTML5 canvas element. This drawing is done using 2d context.\n\n![](Images/image00087.jpeg)\n\
    \n## Q. what are the different overloaded signature for drawImage() method?\n\n\
    **ANSWER**\n\nThe `drawImage()` method has 3 different signature and listed below.\n\
    \n- `drawImage(img, x, y)` : This method position the image on the canvas at `<x,\
    \ y>` coordinates.\n- `drawImage(img, x, y, width, height)` : This method position\
    \ the image on the canvas at `<x, y>` coordinates with a specified `height`.\n\
    - `drawImage(img, sx, sy, swidth, sheight, x, y, width, height)` : This method\
    \ clipped the image with starting point `<sx, sy>` having height `sheight` and\
    \ width `swidth` and position it at `<x, y>` coordinates with a specified `height`\
    \ and `width`.\n\n## Chapter 9 Geo Location API\n\n## Q. What is Geo Location\
    \ API?\n\n**ANSWER**\n\nGeo Location API publishes the location of the user to\
    \ the web. It needs user’s permission for privacy reason. The Geo location API\
    \ is present inside `navigator.geolocation` object.\n\n## Q. How to determine\
    \ Geo Location API is supported in browser?\n\n**ANSWER**\n\nTo determine Geo\
    \ Location API is supported in browser, check the `navigator.geolocation` object.\
    \ Below code shows the logic:\n\n```javascript\nfunction isGeoLocationSupported()\
    \ {\n    return !!(navigator.geolocation);\n}\nif (isGeoLocationSupported()) {\n\
    \    console.log(\"Geo Location API is supported\");\n} else {\n    console.log(\"\
    Geo Location API is not supported\");\n}\n```\n\nThe following screenshot shows\
    \ the result of the check. ![](Images/image00088.jpeg)\n\n## Chapter 10 Web Workers\n\
    \n## Q. What is Web Workers?\n\n**ANSWER**\n\nWeb Workers are a feature to run\
    \ scripts in the background without affecting the main thread performance, allowing\
    \ for heavy computation.\n\n## Q. How to detect Web Worker support?\n\n**ANSWER**\n\
    \nWe can check if Web Workers are supported by verifying the `Worker` object:\n\
    \n```javascript\nif (window.Worker) {\n    console.log(\"Web Workers are supported\"\
    );\n} else {\n    console.log(\"Web Workers are not supported\");\n}\n```\n\n\
    ## Q. What is a dedicated worker?\n\n**ANSWER**\n\nA dedicated worker is a worker\
    \ that is only accessed by one script. It is created by specifying a script file.\n\
    \n```javascript\nvar worker = new Worker(\"worker.js\");\n```\n\n## Q. What is\
    \ a shared worker?\n\n**ANSWER**\n\nA shared worker can be accessed by multiple\
    \ scripts from different windows or iframes of the same origin.\n\n```javascript\n\
    var sharedWorker = new SharedWorker(\"worker.js\");\n```\n\n## Q. Develop a dedicated\
    \ worker to display the time?\n\n**ANSWER**\n\nLet’s create the time worker in\
    \ `dateWorker.js` and display the current time every second.\n\n**dateWorker.js:**\n\
