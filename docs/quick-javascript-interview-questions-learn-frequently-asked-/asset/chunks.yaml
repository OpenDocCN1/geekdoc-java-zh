    \ the node..\n\nQ. What is windows load event?\n\n**ANSWER**\n\nLoad event occurs\
    \ generally fired after the object is completely loaded. Window load event is\
    \ event occurs when images, script files, CSS files and other dependencies get\
    \ loaded. Below screenshot shows use of load event.\n\n![](Images/image00075.jpeg)\n\
    \nQ. What is DOM ready event?\n\n**ANSWER**\n\nDOM ready event get fired when\
    \ elements are get loaded to browser. It does not wait for images and other files\
    \ loaded. We can listen to this event by attaching a callback method. A method\
