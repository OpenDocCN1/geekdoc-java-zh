    \ but allows the use of frameset content.\n\n```html\n<!DOCTYPE html PUBLIC \"\
    -//W3C//DTD XHTML 1.0 Frameset//EN\" \"frameset.dtd\">\n```\n\n### **XHTML 1.1**:\
