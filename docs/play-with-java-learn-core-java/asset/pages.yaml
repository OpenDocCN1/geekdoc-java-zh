    # Types of argument passing:-


    Arguments are passed in two ways i.e. call by value and call by reference. By
    value copies copies the value of the argument into the formal parameter of the
    subroutine. Therefore, changes made to the parameter of the subroutine do not
    affect the argument. In by reference, a reference is passed to the parameter.
    Inside the subroutine, this is used to access the actual argument specified in
    the call. This means that the changes made to the parameter will affect the argument
    used to call the subroutine.


