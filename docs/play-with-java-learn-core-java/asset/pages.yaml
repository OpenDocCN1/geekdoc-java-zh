  md: '# Features of oops


    Object-oriented programming deals with classes and objects.


    Objects are real-world entities that have certain features and functionalities.
    A class is a factory or template of an object. All the objects which belong to
    the features defined by any class are the objects of that class.


    As java is based on 100% oops features, it eliminates the other features into
    only three main features i.e. Encapsulation, Polymorphism, and Inheritance.


    Encapsulation is defined as the process of enclosing one or more details from
    the outside world through access rights. It says how much access should be given
    to particular details. Encapsulation also includes abstraction which says what
    details are to be visible and encapsulation provides the level of access right
    to visible details i.e. it implements the desired level of abstraction.


    Eg:- When we switch to Bluetooth, we can connect to another mobile but are not
    able to access the other mobile features like dialing a number, accessing our
    inbox, etc. This is because the Bluetooth feature is given some level of abstraction.


    Polymorphism can be defined as the ability to do the same operation with different
    types of input. More precisely we can say it as ‘many forms of a single entity.
    This plays a vital role in the concept of OOPs.(Discussed later in detail)


    Eg:- A mobile has a camera to click a picture and the same mobile is having panorama
    mode available in the camera, so functionality would be the same with mode.


    Inheritance means the ability to extend the functionality from the base entity
    to a new entity belonging to the same group. This will help us to reuse the functionality
    which is defined before.(Discussed later in detail)


    Eg:- Basic mobile functionality is to send a message, dial, and receive a call.
    So the brands of mobile are the basic functionality and adding their new features
    to their respective band.'
