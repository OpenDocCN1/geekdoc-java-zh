  md: '1. try-catch & finally block:- In java try block is used to enclose the code
    that might throw an exception. It throws the exception to the catch block when
    there is an error, and when there is no error the control doesn''t transfer to
    the catch block. Here, throw keyword is internally called for throwing the error.


    Life cycle of try block:


    ```

    1. try{

    catch(Exception_class_name ref){

    2. try{

    finally{}

    3.try{

    #error code

    }

    catch(Exception_class_name ref){

    #Exception msg

    }

    finally{

    }

    ```


    There are 3 life cycles of the try catch and finally block:


    In the first case, if an error occurs, then code after error won''t be executed.
    The try throws an exception and the control goes to the catch block & the error
    is handled in a catch block. If finally{} is not written then codes after catch{}
    will be executed.


    In the second case, every time try{} is executed, that many times finally{} will
    be executed.


    And in the last case, when try{} is executed and it throws an exception to catch{},
    then after executing catch{}, finally{} will be executed.


    Java finally is optional and when it is needed. It is always executed whether
    an exception occurred or not. There can be 10 lines of code in a try block and
    an exception occurs on the try block, not 6th line and then it is handled and
    the cursor goes out of the try block, not completely executing the try block.
    To execute important code finally is used. The finally block must be followed
    by a try or catch block. For each try block, there must be one catch block or
    more catch blocks but only one finally block. It is mainly used to put “clean
    up” code such as closing a file, closing a connection, etc. We write all the important
    code in finally.'
