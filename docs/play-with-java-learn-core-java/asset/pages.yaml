  md: '# Interface


    The interface is a 100% incomplete situation (where an only signature is given)
    i.e. it has non-concrete functions. Definition of the functions will be given
    by the implements class. for eg: Event handling is a type of interface because
    when an event is created, then that event will perform is defined by the end-user
    programmer. Here there be a few functions whose definition as well as a signature
    will be given in rest will be empty, which will be overridden in the implements
    class. It is the blueprint of class same as the original. The interface looks
    like a class but it is not a class. An interface can have methods and variables
    like the class but the methods declared in the interface are by default abstract
    (only method signature, nobody). Also, the variables declared in an interface
    are public, static and final by default.


    There are two methods of creating a thread i.e. by extending the Thread class
    or by implementing a runnable interface. As we know java does not support multiple
    than one class are there are certain situations where members of more than one
    class are required. In case, interfaces are useful because more than one interface
    can be implemented by a class. We can say that interface is the solution for multiple
    inherits.


    +   1. To make an interface, we use the interface keyword instead of class.

    2. Instead of extends, we use the implements keyword.

    3. Interfaces are implicitly abstract which is why we cannot create the object.

    4. Interface variables must be initialized at the time of declaration otherwise
    compiler will throw an error.

    5. A class can implement any no. of interfaces.

    6. If there are two or more methods in two interfaces and a class implements both
    interfaces, implementation of the method once is enough.

    7. Variables name conflicts can be resolved by interface name.

    8. If a class includes an interface but does not fully implement the methods defined
    by that the class must be declared as an abstract.

    9. We cannot instantiate an interface in Java.

    10. It provides complete abstraction as none of its methods can have a body(concrete
    method).'
