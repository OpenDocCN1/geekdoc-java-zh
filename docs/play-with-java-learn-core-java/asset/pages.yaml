  md: 'There are two types of nested classes: static and non-static. A static nested
    class has the static modifier applied. Because it is static, it must access the
    members of its enclosing class directly. Because of this restriction, static nested
    classes are seldom used.


    The most important type of nested class is the inner class. An inner class is
    a non-static nested class. It has access to all of the variables and methods of
    its outer class and may refer to them directly in the same way that other non-static
    members of the outer class do. Thus, an inner class is fully within the scope
    of its enclosing class.


    The java compiler will give an error message if any code outside of class outer
    attempts to instantiate inner class.


    Example:


