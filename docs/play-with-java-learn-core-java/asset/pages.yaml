    a continuous flow of bits/bytes like a stream of water, traveling from source
    to destination. Generally, it is used to transfer data in a network. I/O package
    has two modes to read and write data. Streams are used because stream means bytes,
    bytes means ASCII code, ASCII-code means binary, and the computer understands
    binary.'
