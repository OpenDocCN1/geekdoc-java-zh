  md: '# # String Handling


    In many other languages that implement strings as characters arrays, Java implements
    String as an object of type String. When we create a string object, we are creating
    a string that cannot be changed ie once a string object has been created, we cannot
    change the characters that comprise that string. When we write any string under
    double quotes it makes by a literal object in a constant pool. The java.lang.String
    class provides a lot of methods to work on String. With the help of these methods,
    we can perform operations on strings such as trimming, concatenating, comparing,
    replacing, etc. A few of the functions of String are given below:


    +   1. **charAt():** It returns the single character at the specified index. It
    is used in a linked list. The index number starts from 0. Eg: s.charAt(3);


    +   2. **getBytes():** It returns the byte array of the string. In other words,
    it returns the ASCII value of the given string.


    +   3. **equals():** It belongs to the String class. It compares two given Strings
    based on the contents of the string. If all characters are matched, it returns
    1 or true. It is case-sensitive & is used for reference type comparison. == in
    java compares primitive datatype & is used for value type comparison, in abstract
    datatype it compares the address where data is stored. Eg: (a.equals(b))


    +   4. **equalsIgnoreCase():** It works the same as equals() function but does
    a case insensitive comparison.


    +   5. **startsWith():** It checks if the string starts with a given prefix. It
    returns true if this string starts with the given prefix else returning false.'
