    push() is used to push an object on the top of the stack and pop() is used to
    remove and return the top element. Any EmptyStackException is thrown when the
    invoking Stack is empty.


    peek() - Return the top object.


    empty() - Returns true if nothing is on the Stack.


    search() - It determines whether an object exists on the Stack, and returns the
    number of pops that are required to bring it to the top of the Stack.


