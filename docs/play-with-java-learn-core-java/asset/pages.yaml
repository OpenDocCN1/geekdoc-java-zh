  md: '| int | Integer |

    | long | Long |

    | char | Character |

    | float | Float |

    | double | Double |

    | boolean | Boolean |


    There is an additional reference datatype called **String.**.

    Conversion of a primitive datatype to its corresponding reference type is called
    **boxing** whereas conversion of a reference datatype to its corresponding primitive
    type is called **unboxing**. These reference types of its corresponding primitive
    datatype are classes. Eg:- int belongs to the Integer class, float belongs to
    the Float class, and so on. These belong to the java.lang package i.e. java.lang.Integer,
    java.lang.Float and so on. Packages are the collection of classes. (Discussed
    later in detail)


    These classes are known as the **Wrapper class** and the objects of these classes
    are needed to be instantiated.


    Eg:- Integer a=new Integer(5);


    A string is a **special wrapper class.**


    If reference data types are used without creating objects i.e. as primitive data
    types, then these are called **literals.**


    Integer a=5; //Integer literal


    Integer a=new Integer(5); //Integer wrapper class'
