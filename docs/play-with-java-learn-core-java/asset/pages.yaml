  md: '# Applet


    An applet is a type of Java program that runs in a Java enabled web browser (i.e.
    Internet Explorer, Firefox). Applets are intended to be small programs and can
    be downloaded on demand. It can be a fully functional Java application because
    it has the entire Java API at its disposal.


    An applet is a subclass of java.applet package. It does not consist of the main
    method, unlike a Java application. Different states that an applet experience
    between its object creation and object removal is known as App Life Cycle. Applet
    are designed to be embedded into an HTML page. The user views an HTML page that
    contains an applet, the code for the applet is downloaded to the users'' machine.
    The JVM on the user''s machine creates an instance of the applet class and invokes
    various methods during the applet life cycle.


    # Applet life cycle


    +   1 public void init(): This method is intended for whatever initialization
    is needed for the applet. This is called only once in the life cycle. It instantiates
    the objects and loads the GUI of the applet. It is the born state of a thread.
    It is called after the param tags inside the applet tag have been processed.


    +   2. public void start(): Even though the applet object is created by the init()
    method, it remains in an inactive state. The init() method calls start() method
    & it starts the execution of applet. It is also called whenever the user returns
    to the page containing the applet after having gone off to the other page.


    +   3. public void stop(): This method is automatically called when the user moves
    off the page on which the applet resides. In this method, the applet becomes temporarily
    inactive. It is the equivalent of the blocked state of the thread.


    +   4. public void paint(): This method takes an object as a parameter of java.awt.Graphics.
    It helps to create Applet''s GUI. It is invoked immediately after the start()
    and also at any time the applet needs to repaint itself in the browser. This is
    equivalent to a runnable state of a thread.'
