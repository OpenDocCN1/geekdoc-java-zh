  md: '# We need to create an object to access the members of the class.

    The process of the creation of an object is called instantiation.


    Syntax:-


    ```

    <classname><objectname>=new <classname>();

    ```


    Here, the class name is the name of the class, object name is the name of the
    object. A **new** keyword is used to instantiate the object i.e. space is allocated
    in memory and returns a reference to it. class name() is the default constructor
    that is used to initialize the instance of the object. The default constructor
    is created and is automatically called.


    # Methods:


    We have used many pre-defined methods till now. Methods can also be user-defined
    i.e. functionality is defined by the users.


    # The syntax for defining a method:-


    ```

    <access-specifier> <returntype> <methodN>([{parameter-list}]) //Function Signature

    {

    //definition(process area)

    }

    ```


    **access-specifier** can be **public, private, or protected** which determines
    where the method can be accessed(discussed later in detail). Return type determines
    whether the method is returning a value or not. method name can be any valid identifier
    and the parameter list is optional. This whole line is called function signature.


    Different ways of function signature:


    +   - no parameter no return

    - no parameter with return

    - with parameter with return

    - with parameter no return


