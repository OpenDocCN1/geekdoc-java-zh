    +   3. FileOutputStream: it is also a specialized class for writing the data into
    a text-based file. If the file is not created, it will create a new file and if
    it is already created it will overwrite it. Here data can be written in forward
    as well as backward directions. For this we also need to import java.io.*;


    To read data from a file, read() function is used, its return type is a byte in
    integer format. 1 byte is read at a time. It will return an ASCII value. After
    returning the value, it will move the pointer 1 byte forward. The syntax uses
    System.out.print(fis.read());


    Since ASCII value won''t be understood by the user, so it is converted to character
    form or we can say that parsing will be done. Conversion from byte to String will
    take place. For this we write System.out.print((char)fis.read()); To reach the
    end of file available() is used. It counts available data in the file after the
    pointer. It reads byte. It opens a file in read mode, cursor points in a forward
    direction.


    Example of FileInputStream: Program for reading the contents of a file.


    ```

