  md: '# # Exception Handling


    There are two types of errors: Compile time errors and Run time errors. To remove
    the compile-time error, a compiler is best. Exception handling is a way to handle
    run-time errors (logical errors). An exception is an event that disrupts the normal
    flow of the diagram. It is an object thrown at runtime. Exception handling up
    to extent makes our program robust (error-free). The root class of java is **object
    class** and the root class in error handling is **throwable**. The only disadvantage
    of this is the more the exception is used the slower the program gets. There are
    two types of exceptions given as follows:


    # **Types of Exception:-


    +   1. Checked exception:- Checked Exceptions are also known as a pre-checked
    exceptions of Java and it handles the critical exceptions by itself. If checked
    exceptions are not handled, i.e written in the try-catch block the program won''t
    be compiled.


    +   2. Unchecked exception:-The classes that extend RuntimeException are known
    as unchecked exceptions. It is not checked at compile time, they are checked at
    run-time. These exceptions are user-handled exceptions such as Arithmetic Exception,
    NullPointer Exception, etc.


    **Advantages of Exception Handling:-** The advantage of exception handling is
    to maintain the normal flow of the application and make the application robust.
    Exception disrupts the normal flow of the application.


    ![](img/bdd382ccd4d5d3945e8ba2af128b8c72_50_0.png)


    # Ways of handling Exceptions'
