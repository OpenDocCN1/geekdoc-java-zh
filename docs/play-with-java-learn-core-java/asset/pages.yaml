  md: '# Introduction to Java


    Java is related to C++, which is a direct descendant of C. From C, Java derives
    its syntax. Since the C language is not platform-independent, we can''t develop
    applications with the help of it. For application development, we need a language
    that is platform-independent i.e. runs on different machines having different
    architectures. In java, both hardware and software coding are independent of each
    other.


    Java was first developed by Microsystem in 1991 and it was named Oak. In 1995,
    its first version was released and it was named Java. It was in the form of gadgets
    used in different machines like washing machine etc.


    For working on java, we have to install JDK(Java Development Kit) version 1. x
    i.e. 1.1, 1.2, 1.3, 1.4, 1.5, 1.6, 1.7, 1.8. It is freeware. When JDK is installed,
    three components are installed i.e. JVM(Java Virtual Machine), JRE(Java Runtime
    Environment), an API(Application Programming Interface)


    JVM is used to compile, execute and run the program.


    JRE is used to run a program in different programming environments i.e. on different
    platforms.


    API is the pre-defined library used by the programmer.


    # End User


    ![](img/bdd382ccd4d5d3945e8ba2af128b8c72_4_0.png)'
