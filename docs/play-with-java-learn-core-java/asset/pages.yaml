  md: '# Collections Framework


    The java collections framework standardizes how groups of objects are handled
    by our programs. The collection framework was designed to meet several goals.


    +   - The framework had to be high-performance. The implementations for the fundamental
    collections are highly efficient.


    +   - The framework had to allow different types of collections to work similarly
    and with a high degree of interoperability.


    +   - Extending/or adapting a collection had to be easy.


    **Note:** None of the collection classes are synchronized, but all the legacy
    classes are synchronized.


    The legacy classes defined by java.util are **Dictionary, Hashtable, Properties,
    Stack, Vector**


    Legacy interface - **Enumeration**


    # **The Enumeration Interface:**


    The Enumeration interface defines the methods by which we can enumerate it one
    at a time, the elements in a collection of objects.


    **hasElement()** It must return true while there are still more elements to extract
    and false when all the elements have been enumerated.


    **nextElement-** It returns the next object in the enumeration as a generic object
    reference i.e. each call to nextElement() obtains the next object in the enumeration.


    # **Vector**


    Vector implements dynamic array. It is similar to ArrayList but with two differences


    +   - Vector is synchronized.


    +   - A vector may contain a legacy method that is not the part of collection
    framework.


    Vector proves to be very useful if we don''t know the size of an array in advance
    or we just need that can be changed over the lifetime of a program.


    **Note:-** The enumeration interface or foreach loop is used to traverse the Vector.'
