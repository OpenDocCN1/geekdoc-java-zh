  md: '# Thread in Java


    A thread is a small snippet of code and each thread defines a separate path of
    execution.


    # Types of Thread:


    +   1. User Thread: User threads are threads that are created by the application
    or user. They are high-priority threads. JVM will not exit until all user threads
    finish their execution. JVM will wait for these threads to finish their task.
    These threads are foreground threads.


    +   2. Daemon Thread: Daemon threads that are mostly created by the JVM. These
    threads always run in the background. These threads are used to perform some background
    tasks like garbage collection tasks. Threads are fewer priority threads. JVM will
    not wait for these threads to finish their execution. JVM will exit as soon as
    all user threads finish their execution.


    A multithreaded program contains two or more parts that can run concurrently.
    It enables us to write very efficient programs that make maximum use of the CPU
    because idle time can be kept to a minimum. In multithreading, multiple threads
    work at a single instance of time. There is no scheduling in a thread but it has
    a life cycle. Thread class belongs to default package i.e. java.lang.


    # The life cycle of a thread:


    ![](img/bdd382ccd4d5d3945e8ba2af128b8c72_85_0.png)


    The thread starts its execution by the invocation of the start() method which
    belongs to Thread class. Then it comes to a runnable state when a run() method
    is invoked. run() is invoked implicitly as soon as start() is invoked. When start()
    is called, it starts the execution of the thread which'
  merge: -1
  pgno: 85
- img_proc: true
  md: 'begins from the run() method. After the successful termination of the thread,
    it stops and exits.


    When an interrupt occurs, again run() is invoked and the same process gets repeated.
    There can also be user interruptions. When suspend() method is invoked, the thread
    gets suspended and will remain in the CPU until resume() method is invoked. Therefore,
    this step is deprecated. not in use. By using resume(), again run() method is
    invoked and the same process gets repeated. When sleep(time in ms) thread gets
    paused for a certain period as specified in the argument of sleep(in millisecond)
    and again it is resumed and the thread comes to a normal state and the same process
    gets repeated.


    In the case of multithreading, java includes an elegant interprocess communication
    mechanism via wait(), notify(), and notifyAll() methods.


    wait() tells the calling thread to give up the monitor and go to sleep until some
    other thread enters the same monitor and calls notify() or notifyAll(). notify()
    wakes up the first thread that called wait() on the same object and notifyAll()
    wakes up all the threads that called wait() on the same object. The highest priority
    thread will run first. Again run() method is invoked and the same process gets
    repeated.


    In multithreading, there is also a join() method which waits until the thread
    on which it calls terminates. Its names come from the concept of the calling thread
    waiting until the specified thread joins it. It is inflexible while notify() and
    notifyAll() are more flexible than join(). So, it''s better to use notify() and
    notifyAll().


    There are two methods of creating a thread i.e. either extending the Thread class
    or implementing a Runnable interface.


