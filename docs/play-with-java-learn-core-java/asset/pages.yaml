  md: '# # Datatypes


    Datatype refers to the behavior of data elements i.e. what type of data it is
    i.e. whether integer, string, etc. It also specifies the operations performed
    on it like we can''t perform mathematical operations on string datatype and we
    can''t concatenate integer datatypes.


    It is of two types:-


    +   1. Primitive Datatype

    2. Reference Datatype/Derived Datatype/Abstract Datatype


    A primitive data type is of value type and abstract/derived data is of reference
    type i.e. pointer which means it contains the address of value stored in it.


    # In case of primitive,


    ```

    int a=5;

    ```


    ![](img/bdd382ccd4d5d3945e8ba2af128b8c72_11_0.png)


    # In case of reference,


    ```

    Integer a=5;

    ```


    ![](img/bdd382ccd4d5d3945e8ba2af128b8c72_11_1.png)


    | Primitive Datatype | Reference Datatype |

    |---|---|

    | byte | Byte |

    | short | Short |'
