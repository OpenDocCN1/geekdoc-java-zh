    + [5]

    [5, 6]

    [5, 6, 6.7]

    [5, 6]

    [5, 6, 8]

    ```


    # Hashtable


    Hashtable stores key/value pairs in a Hashtable. When using Hashtable, we specify
    an object that is used as a key and the value that we want to be linked to that
    key. The key is then hashed, and the resulting Hashcode is used as the index at
    which the value is stored within the table.


    A Hashtable is an array of the list. Each list is known as a bucket. The position
    of the bucket is identified by calling hashcode method. A Hashtable contains value
    based on key. It contains unique elements. It is synchronized. It may not have
    any null key or value.


    Example:


    ```java

    import java.util.*;

    class exhashtable {

    public void ht() {

    Hashtable<Integer,String> h=new Hashtable<Integer,String>();

    h.put(101,"Rahul");

    h.put(102,"Shyam");

    for(Map.Entry m:h.entrySet()) //To traverse the Hashtable, Map is a class and
    Entry is its property

    System.out.println(m.getKey()+"="+m.getValue());

    }

    public static void main(String[] arg) {


    exhashtable ob=new exhashtable();

    ob.ht();

    }

    }

    ```


    OUTPUT:

    ```

    E:\java\new_java>java exhashtable

    102=Shyam

    101=Rahul

    ```

