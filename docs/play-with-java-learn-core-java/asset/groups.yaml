- md: "\nDropdown (ComboBox): Radiobutton's substitute control is a dropdown list.\
    \ It belongs to the Choice class. The Choice class is used to create a pop-up\
    \ list of items from which the user may choose. only defines the default constructor,\
    \ which creates an empty list. add() is used to add the selection to the list.\
    \ getSelectedIndex() determine which item is currently selected, i.e. it returns\
    \ the index number of the selected item (starting with 0). getItem() returns a\
    \ string containing the name of the item. By default, the first item added to\
    \ the list is selected. itemCount() is used to obtain the no. of items in the\
    \ list. select() is used to set the selected item. Its parameter can be either\
    \ a zero-based integer or a string that will match a name in the list. getItem()\
    \ is used to obtain the name associated with the item at a given index.\n\nProgram\
