    \ {\n    }\n}\n```\n\nOUTPUT:\nWhen we press Enter key\n\n![](img/bdd382ccd4d5d3945e8ba2af128b8c72_75_0.png)\n\
    \n**MouseEvent Class:** A MouseEvent is handled by **EventListener**. There are\
