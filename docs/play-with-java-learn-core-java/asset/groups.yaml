    \ etc.\n\n**Advantages of Exception Handling:** The advantage of exception handling\
    \ is to maintain the normal flow of the application and make the application robust.\
    \ Exception disrupts the normal flow of the application.\n\n![](img/bdd382ccd4d5d3945e8ba2af128b8c72_50_0.png)\n\
    \n## Ways of handling Exceptions\n\n1. try-catch & finally block: In Java, try\
    \ block is used to enclose the code that might throw an exception. It throws the\
    \ exception to the catch block when there is an error, and when there is no error\
    \ the control doesn't transfer to the catch block. Here, `throw` keyword is internally\
    \ called for throwing the error.\n\nLife cycle of try block:\n\n```java\ntry {\n\
    \    # error code\n} catch(Exception_class_name ref) {\n    # Exception msg\n\
    } finally {\n    # finally code\n}\n```\n*(Note: The original OCR had a fragmented\
    \ code block; I have reconstructed the logical structure.)*\n\nThere are 3 life\
    \ cycles of the try-catch and finally block:\n\nIn the first case, if an error\
    \ occurs, then code after error won't be executed. The try throws an exception\
    \ and the control goes to the catch block & the error is handled in a catch block.\
    \ If finally{} is not written then codes after catch{} will be executed.\n\nIn\
    \ the second case, every time try{} is executed, that many times finally{} will\
    \ be executed.\n\nAnd in the last case, when try{} is executed and it throws an\
    \ exception to catch{}, then after executing catch{}, finally{} will be executed.\n\
    \nJava finally is optional and when it is needed. It is always executed whether\
    \ an exception occurred or not. There can be 10 lines of code in a try block and\
    \ an exception occurs on the 6th line of the try block, and then it is handled\
    \ and the cursor goes out of the try block, not completely executing the try block.\
    \ To execute important code, finally is used. The finally block must be followed\
    \ by a try or catch block. For each try block, there must be one catch block or\
    \ more catch blocks but only one finally block. It is mainly used to put “clean\
    \ up” code such as closing a file, closing a connection, etc. We write all the\
    \ important code in finally.\n\nIf you don't handle an exception, before terminating\
    \ the program, JVM executes the finally block.\n\n### Example:\n\n```java\nclass\
    \ Check{\n    public static void main(String[] args){\n        int a=10, b=0;\n\
    \        try{\n            int c = a/b;\n        }\n        catch(Exception ex){\n\
    \            System.out.println(ex.toString());\n        }\n        finally{\n\
    \            System.out.println(\"Program executed\");\n        }\n    }\n}\n\
    ```\nOUTPUT: java.lang.ArithmeticException: / zero\nProgram executed\n\n2. Multiple\
    \ catch{} block:\n\nOne try{} block can have multiple catch{} block. When there\
    \ are 3 lines in try{} each of which can generate interrupts, 3 exceptions may\
    \ be generated and for handling 3 exceptions we can write 3 catch{}. But when\
    \ we use the root class of exception, then there is no need of writing multiple\
    \ catch blocks. At a time only one exception occurred & at a time only one catch\
    \ block is executed. All catch blocks must be ordered in the sequence of occurrence\
    \ of the exception. Multiple catch blocks help in the faster execution of the\
    \ codes.\n\n```java\ntry{\n    # error code\n}\ncatch(ArithmeticException ex){\n\
    \    # Exception msg\n}\ncatch(FileNotFoundException ex){\n    # Exception msg\n\
    }\ncatch(ArrayOutOfBoundsException ex){\n    # Exception msg\n}\ncatch(Exception\
    \ ex) {\n  # Exception msg\n}\n```\n\n3. Nested try{}: The try block within a\
    \ try block is known as a nested block. Sometimes a situation may arise where\
    \ a part of a block may cause one error & the entire block itself may cause another\
    \ error. In such cases, exception handlers have to be nested. But it should have\
    \ a consecutive catch block. In this method complexity increases.\n\n```java\n\
    try {\n  # statements;\n  try {\n    statement1;\n  } catch(Exception ex) {\n\
    \  }\n} catch (Exception ex) {\n}\n```\n\n4. throws keyword: It is used for a\
    \ checked exception. There is no try-catch{} block in it. It can be used only\
    \ with the main().\n\n```java\npublic static void main(String[] args) throws ArithmeticException,\
    \ FileNotFoundException {\n  # statements;\n}\n```\n\n## I/O Stream\n\nTaking\
    \ input in Java: There are 4 ways to take input through console.\n\n- 1. System.in:\
    \ It takes input in int datatype.\n- 2. Command Line: At runtime, we need input\
