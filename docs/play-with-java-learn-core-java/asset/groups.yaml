    # Stack（栈）


    Stack 是 Vector 的子类，实现了标准的后进先出（LIFO）栈。Stack 只定义了默认构造函数，用于创建一个空栈。


    `push()` 用于将一个对象推入栈顶，而 `pop()` 用于移除并返回栈顶元素。当调用的 Stack 为空时，会抛出 `EmptyStackException`。


    `peek()` - 返回栈顶对象。


    `empty()` - 如果栈上没有任何元素，则返回 true。


    `search()` - 它确定一个对象是否存在于栈中，并返回将该对象移动到栈顶所需的入栈操作次数。


    示例：


    ```java

    import java.util.*;

    class exstack

    {

    public void st() {

    Stack s=new Stack();

    s.push(5);

    System.out.println(s);

    s.push(new Integer(6));

    System.out.println(s);

    s.push(new Double(6.7));

    System.out.println(s);

    s.pop();

    System.out.println(s);

    s.push(new Integer(8));

    System.out.println(s);

    }

    public static void main(String[] arg) {

    }

    exstack ob=new exstack();

    ob.st();

    }

    }

    ```


    OUTPUT:

    ```

    E:\java\new_java>java exstack


    + [5]

    [5, 6]

    [5, 6, 6.7]

    [5, 6]

    [5, 6, 8]

    ```


    # Hashtable（哈希表）


    Hashtable 在 Hashtable 中存储键/值对。使用 Hashtable 时，我们指定一个对象作为键（key），以及我们想要与该键关联的值（value）。然后对键进行哈希处理，生成的
    Hashcode 将作为值在表中存储的索引。


    Hashtable 是一个列表数组。每个列表被称为一个桶（bucket）。桶的位置通过调用 `hashcode` 方法来确定。Hashtable 包含基于键的值。它包含唯一的元素。它是同步的。它可能有任何
    null 键或值。


    示例：


    ```java

    import java.util.*;

    class exhashtable {

    public void ht() {

    Hashtable<Integer,String> h=new Hashtable<Integer,String>();

    h.put(101,"Rahul");

    h.put(102,"Shyam");

    for(Map.Entry m:h.entrySet()) //遍历 Hashtable，Map 是一个类，Entry 是它的属性

    System.out.println(m.getKey()+"="+m.getValue());

    }

    public static void main(String[] arg) {


    exhashtable ob=new exhashtable();

    ob.ht();

    }

    }

    ```


    OUTPUT:

    ```

    E:\java\new_java>java exhashtable

    102=Shyam

    101=Rahul

    ```

