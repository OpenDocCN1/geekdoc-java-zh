    java.lang package contains a class called System, which encapsulates several aspects
    of the run-time environment. System contains 3 defined stream variables: in, out,
    and err.


    System.out refers to Standard Output Stream, by default this is console.


    System.in refers to Standard Input Stream, by default this is the keyboard.


    System.err refers to Standard Error Stream which is also the console by default.


    Java implements streams classes in the java.io package. I/O package is divided
    into two streams given as:-


    +   ByteStream:- It provides a rich environment for handling byte-oriented I/O.
    It can be used with any type of object, including binary data.


    +   CharacterStream:- While the ByteStream classes provide sufficient functionality
    to handle any type of I/O operation, they cannot work directly with Unicode characters.


    The main purpose of Java is to support the "Write Once, Run Anywhere". It is necessary
    to include direct I/O support for characters.


    **Byte Stream Classes:** Byte streams are defined by two-class hierarchies. There
    are two root abstract classes Input Stream and Output Stream. These abstract classes
    have several subclasses that handle the various devices, such as disk files, network
    connections, and even memory buffers.


