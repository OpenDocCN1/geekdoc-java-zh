    {\nLabel lb;\nButton b1,b2;\nCheckbox c1,c2,c3;\nCheckboxGroup grp;\npublic excheck()\n\
    {\nsuper(\"Checkbox Example\");\nsetSize(400,400);\nsetLayout(null);\nlb=new Label(\"\
    Education Qualification\");\nb1=new Button(\"SUBMIT\");\nb2=new Button(\"EXIT\"\
    );\nc1=new Checkbox(\"10\");\nc2=new Checkbox(\"10\");\nc3=new Checkbox(\"BCA\"\
    );\ngrp=new CheckboxGroup();\nc1.setGroup(grp);\nc2.setGroup(grp);\nc3.setGroup(grp);\n\
    lb.setBounds(50,50,100,20);\nb1.setBounds(50,80,100,20);\nb2.setBounds(50,110,100,20);\n\
    c1.setBounds(150,50,100,20);\nc2.setBounds(150,80,100,20);\nc3.setBounds(150,110,100,20);\n\
    add(lb);\nadd(b1);\nadd(b2);\nadd(c1);\nadd(c2);\nadd(c3);\nb1.addActionListener(this);\n\
    b2.addActionListener(this);\nc1.addItemListener(this);\nc2.addItemListener(this);\n\
    c3.addItemListener(this);\n}\npublic static void main(String[] arg) {\nnew excheck();\n\
    }\npublic void actionPerformed(ActionEvent e) {\nif(e.getSource()==b1) {\nString\
    \ s=\"\";\nif(c1.getState()) s=c1.getLabel();\nif(c2.getState()) s=c2.getLabel();\n\
    if(c3.getState()) s=c3.getLabel();\nJOptionPane.showMessageDialog(null,\"You have\
    \ selected \"+s+\"\");\n}\nif(e.getSource()==b2) {\nSystem.exit(0);\n}\npublic\
    \ void itemStateChanged(ItemEvent e) {\nString s=\"\";\nif(e.getItemSelectable()==c1)\
    \ {\ns=c1.getLabel();\n}\nif(e.getItemSelectable()==c2) {\ns=c2.getLabel();\n\
    }\nif(e.getItemSelectable()==c3) {\ns=c3.getLabel();\n}\nJOptionPane.showMessageDialog(null,\"\
    You have selected \"+s+\"\");\n}\n}\n```\n\n输出：\n\n![](img/bdd382ccd4d5d3945e8ba2af128b8c72_68_0.png)\n\
    \n**单选按钮 (Radiobutton)：** 可以创建一个互斥的单选按钮组，组内一次只能选择一个。单选按钮通过使用两个类 **radiobutton**\
    \ 和 **CheckboxGroup** 创建。`getSelectedCheckbox()` 用于确定组中的哪个复选框被选中。`setSelectedCheckbox()`\
