    - 1. mouseClicked (MouseEvent e)\n- 2. mouseEntered (MouseEvent e)\n- 3. mouseExited\
    \ (MouseEvent e)\n- 4. mousePressed (MouseEvent e)\n- 5. mouseReleased (MouseEvent\
    \ e)\n\nIf the mouse is pressed and released at the same point, the **mouse clicked()\
