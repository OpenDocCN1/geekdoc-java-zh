    # Introduction to Java


    Java is related to C++, which is a direct descendant of C. From C, Java derives
    its syntax. Since the C language is not platform-independent, we can''t develop
    applications with the help of it. For application development, we need a language
    that is platform-independent i.e. runs on different machines having different
    architectures. In java, both hardware and software coding are independent of each
    other.


    Java was first developed by Microsystems in 1991 and it was named Oak. In 1995,
    its first version was released and it was named Java. It was in the form of gadgets
    used in different machines like washing machine etc.


    For working on java, we have to install JDK(Java Development Kit) version 1.x
    i.e. 1.1, 1.2, 1.3, 1.4, 1.5, 1.6, 1.7, 1.8. It is freeware. When JDK is installed,
    three components are installed i.e. JVM(Java Virtual Machine), JRE(Java Runtime
    Environment), an API(Application Programming Interface)


    JVM is used to compile, execute and run the program.


    JRE is used to run a program in different programming environments i.e. on different
    platforms.


    API is the pre-defined library used by the programmer.


    # End User


    ![](img/bdd382ccd4d5d3945e8ba2af128b8c72_4_0.png)


    # Figure: Java Interaction


    The end-user interacts with the program, the program interacts with the JVM, JRE,
    and API and these interact with an operating system, and then finally operating
    system interacts with hardware.


    Java is both a compiler and interpreter based language. When Java code is compiled,
    source code is converted into byte code(a highly optimized set of instructions)
    and after compiling, byte code is converted to machine code which is done by an
    JIT(Just-In-Time).


    ![](img/bdd382ccd4d5d3945e8ba2af128b8c72_5_0.png)


    # Figure: Java Program Compile and Run phases


    The java source code has the file extension .java and it is compiled to form byte
    code with file extension .class and this byte is machine independent and it is
    changed to machine code(which is machine dependent) by Just-In-Time(JIT) compiler
    and it is interpreted to generate output. Therefore, because of this executable
    middle layer code i.e. byte code, java is a platform independent language.


    # Features of Java


    The main features of java are:-


    - Easy to code, easy to learn.

    - It is platform-independent/portable/architectural-neutral/language i.e. “Write
    once, run anywhere”.

    - It is an Object-oriented Programming Language i.e. based on classes and objects.
    (Discussed later in detail). It follows the 100% OOPs features.

    - It provides a rich program model. It can be used to build many applications.

    - Java has a pointer-less architecture which prevents security issues.

    - Java programs are interpreted by the interpreter which makes the language platform-independent.

    - Java is multithreaded, allowing us to write programs that do many things simultaneously.

    - Java is dynamic, meaning it can adapt to an evolving environment. It can find
    new classes on demand.

    - Java is highly distributed, meaning it can be designed and built for applications
    distributed across the network using TCP/IP protocol.

