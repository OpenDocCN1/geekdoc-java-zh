    \n### 异常的类型：\n\n- 1. 检查异常（Checked exception）：检查异常也称为 Java 的预检查异常，它由自己来处理关键异常。如果没有处理检查异常（即没有写在\
    \ try-catch 块中），程序将无法编译。\n- 2. 未检查异常（Unchecked exception）：继承自 RuntimeException\
