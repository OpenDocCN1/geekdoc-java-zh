    \ = args[0];\n            System.out.print(\"Your name is: \" + s);\n        }\
    \ catch(Exception ex){\n            System.out.println(ex.toString());\n     \
    \   }\n    }\n}\n```\nWhile executing this file pass an argument: java cmd Rahul.\n\
    \nJava performs I/O operations through Streams. A stream is a sequence of data\
    \ or a continuous flow of bits/bytes like a stream of water, traveling from source\
    \ to destination. Generally, it is used to transfer data in a network. I/O package\
    \ has two modes to read and write. Streams are used because stream means bytes,\
    \ bytes means ASCII code, ASCII-code means binary, and the computer understands\
    \ binary.\n\njava.lang package contains a class called System, which encapsulates\
