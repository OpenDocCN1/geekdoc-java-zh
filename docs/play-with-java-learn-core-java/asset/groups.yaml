    **KeyEvent Class:** A KeyEvent is generated when keyboard input occurs. It is
    handled by **KeyListener**. There are three types of key events which are identified
    by these integer constants: **Key_Pressed, Key_Released & Key_Typed**. It is a
    must to override all these events, if not them be empty overridden. It can be
    captured on form and within control. The **KeyPressed** and **KeyReleased** methods
    are invoked when a key is pressed and released respectively. The **Typed** method
    is invoked when a character has been entered. The object of **KeyEvent** class
    is defined as the parameters of its methods. **getKeyChar** returns the character
    that was entered and **getKeyCode** returns the key code i.e. its ASCII equivalent.
    **getKeyChar** does not return any character for some keys like Esc, Ctrl, etc
    and it is difficult to remember the key codes of all the. For the solution to
    this, there is a concept of **virtual keys** which are static constants of KeyEvent
    class and it is bound with every key. For eg: VK_9 and VK_A through VK_1 defines
    the ASCII equivalents of the numbers and letters. There are some others like VK_ENTER,
    VK_CANCEL, VK_CONTROL, etc.


