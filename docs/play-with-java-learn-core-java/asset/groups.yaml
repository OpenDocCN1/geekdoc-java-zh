    # Socket Programming


    Socket helps in communication. It works on both, CLI and GUI. The notion of a
    socket allows a single computer to serve many different clients at once, as well
    as serving many different types of information. A server is anything that has
    some resources that can be shared. A client is simply any other entity that wants
    to gain access to a particular server.


    Internet Protocol(IP) is a low-level routing protocol that breaks data into smaller
    packets and sends them to an address across a network, which does not guarantee
    delivery of said packets with the help of IP address and port number. A Port is
    a numbered socket on a particular machine. A server process is said to listen
    to a port until a client connects to it. A server is allowed to accept multiple
    clients connected to the same port number, although each session is unique. To
    manage multiple client connections, a server process must be multithreaded or
    have some method of multiplexing the simultaneous I/O.


    Port numbers can be reserved or non-reserved. Some examples of reserved ports
    include FTP of 21 (connection-oriented), HTTP of 80 (connectionless), and Telnet
    of 23 (connection-oriented). From, 1-1024, called a reserved port and from 1025-65355,
    is called a non-reserved port. These ports are created by us. We can use services
    which are not occupied by any other.


    # Communication Protocol


    TCP(Transmission Control Protocol) is a reliable connection-oriented protocol.
    It uses handshake methodology. In this, packets are sent from source to destination.
    After receiving the packets, the destination sends an acknowledgment to the source
    so that source sending i.e. source is notified that the destination has received
    the data. The mobile calling system uses TCP protocol because when we call, we
    can hear the tuner when that call has reached the destination. TCP also ensures
    that not a single packet can be missed. In a banking transaction, not a single
    packet should be missed, otherwise, a transaction fails, therefore it use TCP.
    The disadvantage of TCP is that if there are many destinations, then each destination
    sends an acknowledgment to the source. Therefore data gets flooded. Thus, TCP
    is not used for a large amount of data.


    UDP(User Datagram Protocol) is a connectionless protocol that is not reliable.
    Here, the source is not notified whether the packets have reached the destination
    or not. Mobile SMS system uses this protocol because when we send a message, we
    are not notified whether the SMS is received or not(We are talking about earlier
    days, nowadays we are'
