    \ //Function Signature\n{\n//definition(process area)\n}\n```\n\n**access-specifier**\
    \ can be **public, private, or protected** which determines where the method can\
    \ be accessed(discussed later in detail). Return type determines whether the method\
    \ is returning a value or not. method name can be any valid identifier and the\
    \ parameter list is optional. This whole line is called function signature.\n\n\
    Different ways of function signature:\n\n- no parameter no return\n- no parameter\
    \ with return\n- with parameter with return\n- with parameter no return\n\n##\
    \ **Examples:**\n\n- no parameter no return\n- no parameter with return\n- with\
    \ parameter with return\n- with parameter no return\n\n## **static keyword:**\n\
    \nWhen member is declared static, it can be accessed before any object of a class\
    \ is created, and without any reference to any object. We can declare methods\
    \ and variables to be static. The most common example of a static member is the\
    \ main().\n\nInstance variables declared as static, essentially, global variables.\
    \ When objects of its class are declared, no copy of the static variable is made.\
    \ all instances of the class share the same static variable.\n\nThe static method\
