    # Datagrams


    Datagrams are bundles of information passed between machines. Once the datagram
    has been released to its intended target, there is no assurance that it will arrive
    or someone will be there to catch it. Therefore, when the datagram is received,
    there is no assurance that it hasn''t been damaged in transit or that whoever
    sent it is still there to receive a response.


