    are enhanced while working on browsers. Servlets run on web browsers. MUC, Spring,
    Strats, Hibernate and JSP provides advanced GUI with business logic.


    +   3. Mobile Application: The most common mobile application developed in JAVA
    is Android which is OS. It also provides an environment, tools, and API (Application
    Programming Interface).


    +   4. Web Services: Web Services have no user interface. It only provides services
    to many applications. For example, Cricket is handled by ICC, ICC has its website
    and mobile application which provides cricket scores and other information but
    there are many other website and applications which provides scores. All these
    websites use the same database which ICC uses means ICC is providing services
    to all the websites. All booking engines like railway reservations, hotel booking,
    etc belong to this category.


    # Classes of awt package:'
- md: "\n| Classes | Controls |\n| --- | --- |\n| Label | label |\n| TextField | textbox\
    \ |\n| Checkbox | checkbox, radiobutton |\n| Button | button |\n| Choice | combobox\
    \ (single selection) |\n| Select | Multiple Selection combobox |\n| List | listbox\
    \ |\n\nFrame is also a member of the aft package. It is used to make a blank frame.\
    \ There is a Component which is an abstract class that encapsulates all of the\
    \ attributes of a visual component. All user interface elements are displayed\
    \ on the screen and interact with the user are subclasses of Component. A container\
    \ class is a subclass of Component. It contains all the control. There is a Panel\
    \ class and DesktopPane class, which are similar to the Container class. The panel\
    \ is used to separate the controls on the Frame for designing purposes to make\
    \ it interactive. DesktopPane class is used for MDI applications.\n\nNote: In\
    \ MDI applications, a child frame is inserted inside the parent frame and one\
    \ parent frame can contain multiple child frames. There is add() method with each\
    \ to add the control to the main container.\n\nProgram to create a frame\n\n```javaimport\
    \ java.awt.*;\npublic class exSwin extends Frame {\n    public exSwin() {\n  \
    \      super(\"First Frame\");\n        setSize(400,400);\n        setVisible(true);\n\
    \    }\n    public static void main(String[] args[]) {\n        new exSwin();\n\
    \    }\n}\n```\n\n## Using Layout Managers: A layout manager automatically arranges\
    \ your controls within a window. Every Container object has a layout manager associated\
    \ with it. A layout manager is an instance of any class that implements the LayoutManager\
    \ interface. Different types of layouts are as follows:\n\n- 1. Flow Layout: It\
    \ is the default layout. Components are laid out line by line (i.e. left to right).\n\
    - 2. Grid Layout: It lays out components in a two-dimensional grid. Here we define\
    \ the number of rows & columns. In the constructor of GridLayout, we pass a number\
    \ of rows & number of columns as arguments. The substitute of GridLayout is GridBagLayout,\
    \ here we can specify the relative placements of components by specifying their\
    \ position within cells inside a grid.\n- 3. Border Layout: It has four sides\
    \ (North, South, East, West) and one large area in the center.\n- 4. Card Layout:\
    \ This layout can be thought of as being on a separate index card on a desk that\
    \ can be shuffled so that any card is on top at a given time. It is hidden before\
    \ one another. Example: Tab based system.\n- 5. Custom / User-defined Layout:\
    \ We can set the pixel of the screen according to our requirement then we pass\
    \ null for LayoutObject. Then to determine the shape and position of each component\
    \ manually setBounds() method is used, inherited from Component. It has 4 arguments,\
    \ i.e. starting value of x-coordinate, starting value of the y-coordinate, length\
    \ of control, and width of the control. The standard size of the control is 20.\n\
    \n## Important Terms:\n\nAn event is an object that describes a state change in\
    \ a source where event occurs. The listener listens to which type of event occurred,\
    \ on which control it occurred & passes it to Master Handler. The interface of\
    \ a listener is ActionListener and it comes under java.awt.event package. The\
    \ event for buttons is ActionEvent.\n\nProgram to enter a name in textfield and\
    \ print it in a message dialog box:\n\n```javaimport java.awt.*; //For GUI\nimport\
    \ java.awt.event.*; //For event handling\nimport javax.swing.*; //For advanced\
    \ GUI\npublic class exwin extends Frame implements ActionListener //Implementation\
    \ of listener\nLabel lb; //Initialization of controls\nTextField tx;\nButton b;\n\
    public exwin() {\nsuper(\"Window Example\");\nsetSize(400,400);\nsetLayout(null);\
    \ //For user-defined layout\nlb=new Label(\"Your name:\");\ntx=new TextField(15);\n\
    b=new Button(\"OK\");\nlb.setBounds(50,50,100,20);\ntx.setBounds(150,50,200,20);\n\
    b.setBounds(90,100,50,20);\nadd(lb);\nadd(tx);\nadd(b);\nb.addActionListener(this);\
    \ //Event source of button\n}\npublic static void main(String[] arg) {\nnew exwin();\n\
    }\npublic void actionPerformed(ActionEvent e) {\nif(e.getSource()==b) //For comparison\
    \ of event source {\nString s=tx.getText();\nJOptionPane.showMessageDialog(null,\"\
    Welcome \"+s,\"\");\n}\n} //Belongs to javax.swing Package\n}\n}\n```\n\nOUTPUT:\n\
    \n![](img/bdd382ccd4d5d3945e8ba2af128b8c72_65_0.png)\n\n## Controls\n\n**Check\
    \ Box:** Checkbox and radio buttons belong to the Checkbox class for using radio\
    \ buttons we have to use one more class called CheckGroup class, it groups all\
    \ checkboxes into one group and allows one selection at a time. `getState()` is\
    \ used to retrieve the current state of a check box. The return type is boolean.\
    \ `setState()` is used to see the state of the checkbox. `getLabel()` is used\
    \ to obtain the current level associated with a check box. `setLabel()` is used\
    \ to set the level. Each time a checkbox is selected or deselected, an item event\
    \ is generated. This is sent to the ItemListener interface. And its handler is\
    \ the `stateChanged()` method defined in the ItemListener interface.\n\nProgram\
    \ to illustrate checkbox:\n\n```javaimport java.awt.*;\nimport java.awt.event.*;\n\
    import javax.swing.*;\npublic class excheck extends Frame implements ActionListener,ItemListener\n\
    {\nLabel lb;\nButton b1,b2;\nCheckbox c1,c2,c3;\nCheckboxGroup grp;\npublic excheck()\n\
    {\nsuper(\"Checkbox Example\");\nsetSize(400,400);\nsetLayout(null);\nlb=new Label(\"\
    Education Qualification\");\nb1=new Button(\"SUBMIT\");\nb2=new Button(\"EXIT\"\
    );\nc1=new Checkbox(\"10\");\nc2=new Checkbox(\"10\");\nc3=new Checkbox(\"BCA\"\
    );\ngrp=new CheckboxGroup();\nc1.setGroup(grp);\nc2.setGroup(grp);\nc3.setGroup(grp);\n\
    lb.setBounds(50,50,100,20);\nb1.setBounds(50,80,100,20);\nb2.setBounds(50,110,100,20);\n\
    c1.setBounds(150,50,100,20);\nc2.setBounds(150,80,100,20);\nc3.setBounds(150,110,100,20);\n\
    add(lb);\nadd(b1);\nadd(b2);\nadd(c1);\nadd(c2);\nadd(c3);\nb1.addActionListener(this);\n\
    b2.addActionListener(this);\nc1.addItemListener(this);\nc2.addItemListener(this);\n\
    c3.addItemListener(this);\n}\npublic static void main(String[] arg) {\nnew excheck();\n\
    }\npublic void actionPerformed(ActionEvent e) {\nif(e.getSource()==b1) {\nString\
    \ s=\"\";\nif(c1.getState()) s=c1.getLabel();\nif(c2.getState()) s=c2.getLabel();\n\
    if(c3.getState()) s=c3.getLabel();\nJOptionPane.showMessageDialog(null,\"You have\
    \ selected \"+s+\"\");\n}\nif(e.getSource()==b2) {\nSystem.exit(0);\n}\n}\npublic\
    \ void itemStateChanged(ItemEvent e) {\nString s=\"\";\nif(e.getItemSelectable()==c1)\
    \ {\ns=c1.getLabel();\n}\nif(e.getItemSelectable()==c2) {\ns=c2.getLabel();\n\
    }\nif(e.getItemSelectable()==c3) {\ns=c3.getLabel();\n}\nJOptionPane.showMessageDialog(null,\"\
    You have selected \"+s+\"\");\n}\n}\n```\n\nOUTPUT:\n\n![](img/bdd382ccd4d5d3945e8ba2af128b8c72_68_0.png)\n\
    \n**Radiobutton:** It is possible to create a set of mutually exclusive radiobutton\
    \ in which only one item in the group can be selected at a time. The radiobutton\
    \ created by use of 2 class called **radiobutton** and **CheckboxGroup**, getSelectedCheckbox()\
    \ is used to determine which check box in a group is currently selected. setSelectedCheckbox()\
    \ is used to set a checkbox selected.\n\nProgram to illustrate radiobutton\n\n\
    ```javaimport java.awt.*;\nimport java.awt.event.*;\nimport javax.swing.*;\npublic\
    \ class extradio extends Frame implements ActionListener,ItemListener\n{\nLabel\
    \ lb;\nButton b1,b2;\nCheckbox r1,r2;\nCheckboxGroup grp;\npublic extradio()\n\
    {\nsuper(\"Radio Button Example\");\nsetSize(400,400);\nsetLayout(null);\nlb=new\
    \ Label(\"Radio Button\");\nb1=new Button(\"SUBMIT\");\nb2=new Button(\"EXIT\"\
    );\nr1=new Checkbox(\"10\");\nr2=new Checkbox(\"10\");\ngrp=new CheckboxGroup();\n\
    r1.setGroup(grp);\nr2.setGroup(grp);\nlb.setBounds(50,50,100,20);\nb1.setBounds(50,80,100,20);\n\
    b2.setBounds(50,110,100,20);\nr1.setBounds(150,50,100,20);\nr2.setBounds(150,80,100,20);\n\
    add(lb);\nadd(b1);\nadd(b2);\nadd(r1);\nadd(r2);\nb1.addActionListener(this);\n\
    b2.addActionListener(this);\nr1.addItemListener(this);\nr2.addItemListener(this);\n\
    }\npublic static void main(String[] arg) {\nnew extradio();\n}\npublic void actionPerformed(ActionEvent\
    \ e) {\nif(e.getSource()==b1) {\nString s=\"\";\nif(r1.getState()) s=r1.getLabel();\n\
    if(r2.getState()) s=r2.getLabel();\nJOptionPane.showMessageDialog(null,\"You have\
    \ selected \"+s+\"\");\n}\nif(e.getSource()==b2) {\nSystem.exit(0);\n}\n}\npublic\
    \ void itemStateChanged(ItemEvent e) {\nString s=\"\";\nif(e.getItemSelectable()==r1)\
    \ {\ns=r1.getLabel();\n}\nif(e.getItemSelectable()==r2) {\ns=r2.getLabel();\n\
    }\nJOptionPane.showMessageDialog(null,\"You have selected \"+s+\"\");\n}\n}\n\
    }\n```\n\nOUTPUT:\n\n![](img/bdd382ccd4d5d3945e8ba2af128b8c72_70_0.png)\n"
  mdcn: "\n\n| 类 | 控件 |\n| --- | --- |\n| Label | label |\n| TextField | textbox |\n\
    | Checkbox | checkbox, radiobutton |\n| Button | button |\n| Choice | combobox\
    \ (单选) |\n| Select | 多选 combobox |\n| List | listbox |\n\n`Frame` 也是 `aft` 包的成员。它用于创建一个空白帧。`Component`\
    \ 是一个抽象类，封装了所有视觉组件的属性。所有在屏幕上显示并与用户交互的界面元素都是 `Component` 的子类。容器类（Container）是 `Component`\
    \ 的子类，它包含了所有的控件。`Panel` 类和 `DesktopPane` 类类似于 `Container` 类。`Panel` 用于在设计上分离 Frame\
    \ 上的控件，使其具有交互性。`DesktopPane` 类用于多文档界面（MDI）应用程序。\n\n注意：在 MDI 应用中，子帧插入到父帧内部，一个父帧可以包含多个子帧。每个类都有\
    \ `add()` 方法，用于将控件添加到主容器中。\n\n创建帧的程序\n\n```javaimport java.awt.*;\npublic class\
    \ exSwin extends Frame {\n    public exSwin() {\n        super(\"First Frame\"\
    );\n        setSize(400,400);\n        setVisible(true);\n    }\n    public static\
    \ void main(String[] args[]) {\n        new exSwin();\n    }\n}\n```\n\n## 使用布局管理器：布局管理器会自动在窗口内排列你的控件。每个\
    \ `Container` 对象都关联有一个布局管理器。布局管理器是实现 `LayoutManager` 接口的类的实例。不同类型的布局如下：\n\n- 1.\
    \ 流布局布局 (Flow Layout)：这是默认布局。组件按行排列（即从左到右）。\n- 2. 网格布局 (Grid Layout)：它在二维网格中布局组件。在这里定义行数和列数。在\
    \ `GridLayout` 的构造函数中，我们将行数和列数作为参数传递。`GridLayout` 的替代方案是 `GridBagLayout`，在这里可以通过指定组件在网格单元格内的位置来指定它们的相对位置。\n\
    - 3. 边界布局 (Border Layout)：它有四个边（北、南、东、西）和一个中央的大区域。\n- 4. 卡片布局 (Card Layout)：这种布局可以被想象成桌上独立的索引卡，可以进行洗牌，使得任何卡片在给定时间位于顶部。它在其他卡片之前隐藏。示例：基于标签的系统。\n\
    - 5. 自定义/用户定义布局：我们可以根据需要设置屏幕像素，然后对 `LayoutObject` 传递 `null`。然后手动设置每个组件的形状和位置使用继承自\
    \ `Component` 的 `setBounds()` 方法。它有 4 个参数，即 x 坐标起始值、y 坐标起始值、控件长度和控件宽度。控件的标准尺寸为20。\n\
    \n## 重要术语：\n\n事件是一个描述源发生事件时状态改变的对象。监听器发生了什么类型的事件、发生在哪个控件上，并将其传递给主处理器（Master Handler）。监听器的接口是\
    \ `ActionListener`，它属于 `java.awt.event` 包。按钮的事件是 `ActionEvent`。\n\n在文本框中输入名称并在消息框中打印它的程序：\n\
    \n```javaimport java.awt.*; //用于 GUI\nimport java.awt.event.*; //用于事件处理\nimport\
    \ javax.swing.*; //用于高级 GUI\npublic class exwin extends Frame implements ActionListener\
    \ //实现监听器\nLabel lb; //初始化控件\nTextField tx;\nButton b;\npublic exwin() {\nsuper(\"\
    Window Example\");\nsetSize(400,400);\nsetLayout(null); //用于用户定义布局\nlb=new Label(\"\
    Your name:\");\ntx=new TextField(15);\nb=new Button(\"OK\");\nlb.setBounds(50,50,100,20);\n\
    tx.setBounds(150,50,200,20);\nb.setBounds(90,100,50,20);\nadd(lb);\nadd(tx);\n\
    add(b);\nb.addActionListener(this); //按钮的事件源\n}\npublic static void main(String[]\
    \ arg) {\nnew exwin();\n}\npublic void actionPerformed(ActionEvent e) {\nif(e.getSource()==b)\
    \ //用于比较事件源 {\nString s=tx.getText();\nJOptionPane.showMessageDialog(null,\"Welcome\
    \ \"+s,\"\");\n}\n} //属于 javax.swing 包\n}\n}\n```\n\n输出：\n\n![](img/bdd382ccd4d5d3945e8ba2af128b8c72_65_0.png)\n\
    \n## 控件\n\n**复选框 (Check Box)：** 复选框和单选按钮属于 `Checkbox` 类。为了使用单选按钮，我们需要使用另一个名为 `CheckboxGroup`\
    \ 的类，它将所有复选框分组，并允许一次选择一个。`getState()` 用于获取复选框当前的状态。返回类型为 `boolean`。`setState()`\
    \ 用于查看复选框的状态。`getLabel()` 用于获取与复选框关联当前标签。`setLabel()` 用于设置标签。每当复选框被选中或取消选择时，就会生成一个项目事件（item\
    \ event）。它被发送给 `ItemListener` 接口。它的处理器是 `ItemListener` 接口中定义的 `stateChanged()`\
    \ 方法。\n\n阐释复选框的程序：\n\n```javaimport java.awt.*;\nimport java.awt.event.*;\nimport\
