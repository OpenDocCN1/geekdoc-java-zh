    \        }\n    }\n}\n```\n执行此文件传递参数：java cmd Rahul\n\nJava 通过流执行 I/O 操作。流是数据的序列或连续的位/字节，就像水流从源流到目的地。通常，它用于在网络中传输数据。I/O\
    \ 包有两种读取模式。使用流是因为流意味着字节，字节意味着 ASCII ，ASCII 意味着二进制，而计算机理解二进制。java.lang 包包含一个名为\
