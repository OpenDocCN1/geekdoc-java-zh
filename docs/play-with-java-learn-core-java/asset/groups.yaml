    \ 等。\n\n**异常处理的优点：** 异常处理的优点是维持应用程序的正常流并使应用程序更加健壮。异常会破坏应用程序的正常流。\n\n![](img/bdd382ccd4d5d3945e8ba2af128b8c72_50_0.png)\n\
    \n## 异常的处理方式\n\n1. try-catch & finally 块：在 Java 中，try 块用于封装可能抛出异常的代码。发生错误时，它会将异常抛给\
    \ catch 块；如果没有错误，控制权就不会转移到 catch 块。在这里，内部调用 `throw` 关键字来抛出错误。\n\ntry 块的生命周期：\n\
    \n```java\ntry {\n    # error code\n} catch(Exception_class_name ref) {\n    #\
    \ Exception msg\n} finally {\n    # finally code\n}\n```\n（注：原始 OCR 代码块碎片化；我已重构了其逻辑结构。）\n\
    \ntry-catch 和 finally 块有 3 种生命周期：\n\n在第一情况下，如果发生错误，错误之后代码将不会执行。try 会抛出一个异常，控制权进入\
    \ catch 块，错误在 catch 块中被处理。如果没有写 finally{}，则 catch{} 之后的代码将执行。\n\n在第二情况下，每执行一次\
