    name of the item. By default, the first item added to the list is selected. itemCount()
    is used to obtain the no. of items in the list. select() is used to set the selected
    item. Its parameter can be either a zero-based integer or a string that will match
    a name in the list. getItem() is used to obtain the name associated with the item
    at a given index.


