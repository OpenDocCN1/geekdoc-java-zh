- md: "\n# Applet\n\nAn applet is a type of Java program that runs in a Java enabled\
    \ web browser (i.e. Internet Explorer, Firefox). Applets are intended to be small\
    \ programs and can be downloaded on demand. It can be a fully functional Java\
    \ application because it has the entire Java API at its disposal.\n\nAn applet\
    \ is a subclass of java.applet package. It does not consist of the main method,\
    \ unlike a Java application. Different states that an applet experience between\
    \ its object creation and object removal is known as App Life Cycle. Applet are\
    \ designed to be embedded into an HTML page. The user views an HTML page that\
    \ contains an applet, the code for the applet is downloaded to the users' machine.\
    \ The JVM on the user's machine creates an instance of the applet class and invokes\
    \ various methods during the applet life cycle.\n\n# Applet life cycle\n\n- 1.\
    \ public void init(): This method is intended for whatever initialization is needed\
    \ for the applet. This is called only once in the life cycle. It instantiates\
    \ the objects and loads the GUI of the applet. It is the born state of a thread.\
    \ It is called after the param tags inside the applet tag have been processed.\n\
    \n- 2. public void start(): Even though the applet object is created by the init()\
    \ method, it remains in an inactive state. The init() method calls start() method\
    \ & it starts the execution of applet. It is also called whenever the user returns\
    \ to the page containing the applet after having gone off to the other page.\n\
    \n- 3. public void stop(): This method is automatically called when the user moves\
    \ off the page on which the applet resides. In this method, the applet becomes\
    \ temporarily inactive. It is the equivalent of the blocked state of the thread.\n\
    \n- 4. public void paint(): This method takes an object as a parameter of java.awt.Graphics.\
    \ It helps to create Applet's GUI. It is invoked immediately after the start()\
    \ and also at any time the applet needs to repaint itself in the browser. This\
    \ is equivalent to a runnable state of a thread.\n\n- 5. public void destroy():\
    \ This destroys the Applet and is also invoked only once when the active browser\
    \ which contains the page is closed not minimized. It is equivalent to the dead\
    \ state of the thread.\n\nFor example\n\n```java\nimport java.applet.*;\nimport\
    \ java.awt.*;\n/*applet code=\"applet1\" width=\"400\" height=\"400\">\n<applet>\
    \ */\npublic class Hello extends Applet{\n    public void paint(Graphics g) {\n\
    \        g.drawString(\"Hello Java\",27,50);\n    }\n}\n```\n\nNote: To run an\
    \ applet the HTML code must be embedded in the Java program itself within comments.\n\
    \n# Database Connectivity\n\nConnectivity between the front end (GUI) and backend\
    \ (DBMS/RDBMS) is called Database Connectivity. To connect java with any RMS,\
    \ we use JDBC (Java Database Connectivity). It can be done by using either of\
    \ the following ways:\n\n- 1. Type I DSN\n- 2. Type II (Thin Server)\n- 3. Type\
    \ III (Server)\n- 4. Type IV (Distributed Server)\n\nHere, we will deal with Type\
    \ I. DSN (Data Source Name) is a common platform for all drivers. It needs the\
    \ help of another driver ODBC (Open Database Connectivity). It is written in C\
    \ language. JDBC is written in java, C & C++.\n\nSteps:\n\n- 1. Open Control Panel\
    \ and click on Administrative Tools.\n- 2. Open ODBC Data Sources (32-bit).\n\
    - 3. A dialog box opens, click on Add.\n- 4. Select \"Oracle in XE\" and click\
    \ on finish.\n- 5. A dialog box opens, provides a Data Source Name and TNS Service\
    \ Name as “XE”\n\n- 6. Before proving TNS Service name ensure that Connection\
    \ is tested by clicking on Test Connection and then providing the user name and\
    \ password of oracle.\n\nThe user id and password of the Oracle server are noted\
    \ for its use in code. We are using JDBC for java code and ODBC for oracle code.\n\
    GUI+JDBC-ODBC+SQL\n\nJDBC-ODBC is called a bridge. This process is also known\
    \ as a bridge-based connection.\n\nSteps:\n\n- 1. import package java.sql.*\n\
    - 2. Create bridge\n- 3. Class.forName(\"Sun.jdbc.odbc.JdbcOdbcDriver\")\n- 4.\
    \ Establish Connection, Connection class is used for it\n- 5. Insert/Update/Delete/Select\
    \ We use Statement class when a parameter is fixed i.e. query and PreparedStatement\
    \ when a query is not fixed. When we are using the Statement class, we use executeQuery()\
    \ to execute the query and when we are using PreparedStatement class, we use executeQuery()\
    \ to execute the query and executeUpdate() for INSERT and UPDATE.\n- 6. We use\
    \ the ResultSet class to move a particular row & column (Read-only and forward\
    \ only) with certain parameters, we can make ResultSet backward, hold read and\
    \ write. For movement of the pointer, next() method is used.\n\nProgram to execute\
    \ SELECT query:\n\n```java\nimport java.sql.*;\nclass exdata\n{\n    public void\
    \ voidata()\n    {\n        try{\n            Class.forName(\"sun.jdbc.odbc.JdbcOdbcDriver\"\
    ); //It internally combines with DriverManager\n            Connection con=DriverManager.getConnection(\"\
    jdbc:odbc:myproject\",\"hr\",\"oracle\");\n            //In above statement, \"\
    myproject\" is DSN name, \"hr\" is user id and \"oracle\" is password of oracle\n\
    \            Statement st=con.createStatement();\n            ResultSet rs=st.executeQuery(\"\
    select * from prty_mst\");\n            while(rs.next())\n            {\n    \
    \            // processing result set\n            }\n        }catch(Exception\
    \ e) {\n            e.printStackTrace();\n        }\n    }\n}\n```\n\n# Thread\
    \ in Java\n\nA thread is a small unit of code that can run concurrently. Multithreading\
    \ allows multiple parts of a program to run simultaneously, which makes maximum\
    \ use of the CPU because idle time can be kept to a minimum. \n\nTypes of Thread:\n\
    \n- 1. User Thread: User threads are created by the application. They are foreground\
    \ threads and the JVM waits until they finish.\n- 2. Daemon Thread: Daemon threads\
    \ are mostly created by the JVM. They perform background tasks like garbage collection.\n\
    \nThe life cycle of a thread:\n\n![](img/bdd32ccd4d5d3945e8ba2af128b8c7_)\n\n\
    The thread starts its execution by the invocation of start() method. Then it comes\
    \ to a runnable state when run() method is invoked. run() is invoked implicitly\
    \ as soon as start() is invoked. When start() is called, it starts the execution\
    \ of the thread begins from the run() method. After the successful termination\
    \ of the thread, it stops and exits.\n\nWhen an interrupt occurs, again run()\
    \ is invoked and the same process gets repeated. There can also be user interruptions.\
    \ When suspend() method is invoked, the thread gets suspended and will remain\
    \ in state until resume() method is invoked. Therefore, this step is deprecated.\
    \ not in use. By using resume(), again run() is invoked and the same process gets\
    \ repeated. When sleep(time in ms) thread gets paused for a certain period as\
    \ specified in the argument of sleep(in millisecond) and again it is resumed and\
    \ the thread comes to a normal state and the same process gets repeated.\n\nIn\
    \ the case of multithreading, java includes an elegant interprocess communication\
    \ mechanism via wait(), notify(), and notifyAll() methods.\n\nwait() tells the\
    \ calling thread to give up the monitor and go to sleep until some other thread\
    \ enters the same monitor and calls notify() or notifyAll(). notify() wakes up\
    \ the first thread that called wait() on the same object and notifyAll() wakes\
    \ up all the threads that called wait() on the same object. The highest priority\
    \ thread will run first. Again run() method is invoked and the same process gets\
    \ repeated.\n\nIn multithreading, there is also a join() method which waits until\
    \ the thread on which it calls terminates. Its names come from the concept of\
    \ the calling thread waiting until the specified thread joins it. It is inflexible\
    \ while notify() and notifyAll() are more flexible. So, it's better to use notify()\
    \ and notifyAll().\n\nThere are two methods of creating a thread i.e. either extending\
    \ the Thread class or implementing a Runnable interface.\n\n# By extending the\
    \ Thread class\n\n```java\npublic class thread1 extends Thread\n{\n    public\
    \ void run() //All the processing are done in run()\n    {\n        for(int i=0;i<=10;i++)\n\
    \        {\n            System.out.println(i);\n            try\n            {\n\
    \                Thread.sleep(1000); //It will throw InterruptedException\n  \
    \          } catch(InterruptedException e) {\n                e.printStackTrace();\n\
    \            }\n        }\n    }\n}\n```\n"
  mdcn: "\n\n# Applet（小程序）\n\nApplet 是一种在支持 Java 的网页浏览器（如 Internet Explorer、Firefox）中运行的\
    \ Java 程序。Applet 被设计为小型程序，并可以根据需要下载。它可以是一个功能完整的 Java 应用程序，因为它可以使用整个 Java API。\n\
    \nApplet 是 `java.applet` 包的子类。与 Java 应用程序不同，它不包含 `main` 方法。Applet 在对象创建和对象销之间经历的不同状态被称为\
    \ **Applet 生命周期**（App Life Cycle）。Applet 设计用于嵌入 HTML 页面中。当用户查看包含 applet 的 HTML\
    \ 页面时，applet 的代码会被下载到用户的机器上。用户机器上的 JVM 创建 applet 类的实例，并在 applet 生命周期周期内调用各种方法。\n\
    \n# Applet 生命周期\n\n- 1. `public void init()`: 此方法用于 applet 需要的任何初始化。它在生命周期中只被调用一次。它实例化对象并加载\
    \ applet 的 GUI。它是线程的诞生状态。它在 applet 标签内部的 `param` 标签处理后被调用。\n\n- 2. `public void\
    \ start()`: 尽管 applet 对象是由 `init()` 方法创建的，但它仍然处于非活动状态。`init()` 方法调用 `start()`\
    \ 方法并启动 applet 的执行。当用户离开其他页面后返回包含 applet 的页面时，它也会被调用。\n\n- 3. `public void stop()`:\
    \ 当用户离开 applet 所在的页面时，此方法会被自动调用。在此方法中，applet 变为临时非活动。这等同于线程的阻塞状态。\n\n- 4. `public\
    \ void paint()`: 此方法将 `java.awt.Graphics` 对象作为参数。它有助于创建 Applet 的 GUI。它在 `start()`\
    \ 之后立即被调用，并在 applet 需要在浏览器中重绘自己的任何时候被调用。这等同于线程的可运行状态。\n\n- 5. `public void destroy()`:\
    \ 此方法销毁 Applet，并且在包含页面的活动浏览器关闭（而非最小化）时仅被调用一次。这等同于线程的死亡状态。\n\n例如：\n\n```java\n\
    import java.applet.*;\nimport java.awt.*;\n/*applet code=\"applet1\" width=\"\
    400\" height=\"400\">\n<applet> */\npublic class Hello extends Applet{\n    public\
    \ void paint(Graphics g) {\n        g.drawString(\"Hello Java\",27,50);\n    }\n\
    }\n```\n\n注意：要运行 applet，HTML 代码必须嵌入在 Java 程序本身的注释中。\n\n# 数据库连接\n\n前端（GUI）与后端（DBMS/RDBMS）之间的连接被称为数据库连接。要让\
    \ Java 连接到任何关系型数据库（RMS），我们使用 JDBC（Java 数据库连接）。可以通过以下方式之一实现：\n\n- 1. 类型 I DSN\n\
    - 2. 类型 II（薄客户端服务器）\n- 3. 类型 III（服务器）\n- 4. 类型 IV（分布式服务器）\n\n在这里，我们将处理类型 I。DSN（数据源名称）是所有驱动程序的通用平台。它需要另一个驱动程序\
    \ ODBC（开放数据库连接）的帮助。它是用 C 语言编写的。JDBC 是用 Java、C 和 C++ 编写的。\n\n步骤：\n\n- 1. 打开控制面板并点击“管理工具”。\n\
    - 2. 打开“ODBC 数据源 (32位)”。\n- 3. 打开对话框，点击“添加”。\n- 4. 选择“Oracle in XE”并点击“完成”。\n\
    - 5. 打开对话框，提供数据源名称和 TNS 服务名称为“XE”。\n\n- 6. 在提供 TNS 服务名称之前，确保通过点击“测试连接”并提供 oracle\
    \ 的用户名和密码来测试连接。\n\nOracle 服务器的用户 ID 和密码被记录下来以便在代码中使用。我们在 Java 代码中使用 JDBC，在 Oracle\
    \ 代码中使用 ODBC。\nGUI+JDBC-ODBC+SQL\n\nJDBC-ODBC 被称为桥接。此过程也被称为基于桥接的连接。\n\n步骤：\n\n\
    - 1. `import package java.sql.*`\n- 2. 创建桥接\n- 3. `Class.forName(\"Sun.jdbc.odbc.JdbcOdbcDriver\"\
    )`\n- 4. 建立连接，使用 `Connection` 类来实现。\n- 5. 插入/更新/删除/查询：当参数固定（即查询）时我们使用 `Statement`\
    \ 类，当查询不固定时使用 `PreparedStatement`。当使用 `Statement` 类时，我们使用 `executeQuery()` 执行查询；当使用\
    \ `PreparedStatement` 类时，我们使用 `executeQuery()` 执行查询，并使用 `executeUpdate()` 执行 INSERT\
    \ 和 UPDATE。\n- 6. 我们使用 `ResultSet` 类根据特定参数移动特定的行和列（只读且仅向前），我们可以使 `ResultSet` 支持向后移动、保持读和写操作。对于指针的移动，使用\
    \ `next()` 方法。\n\n执行 SELECT 查询的程序：\n\n```java\nimport java.sql.*;\nclass exdata\n\
    {\n    public void voidata()\n    {\n        try{\n            Class.forName(\"\
    sun.jdbc.odbc.JdbcOdbcDriver\"); //它内部与 DriverManager 结合\n            Connection\
    \ con=DriverManager.getConnection(\"jdbc:odbc:myproject\",\"hr\",\"oracle\");\n\
    \            // 在上述语句中,\"myproject\" 是 DSN 名称，“hr\" 是用户 ID，“oracle\" 是 oracle\
    \ 的密码\n            Statement st=con.createStatement();\n            ResultSet\
    \ rs=st.executeQuery(\"select * from prty_mst\");\n            while(rs.next())\n\
    \            {\n                // 处理结果集\n            }\n        }catch(Exception\
    \ e) {\n            e.printStackTrace();\n        }\n    }\n}\n```\n\n# Java 中的线程\n\
    \n线程是可以并发运行的小代码单元。多线程允许程序的多个部分同时运行，从而最大限度地利用 CPU。\n\n线程的类型：\n\n- 1. 用户线程：由应用程序创建。它们是前台线程，JVM\
    \ 会等待它们完成。\n- 2. 守护线程：由 JVM 创建。它们执行后台任务，如垃圾回收。\n\n线程的生命周期：\n\nimg/32ccd4d5d3945e8ba2c7\n\
    \n线程通过调用 `start()` 方法开始执行。在调用 `start()` 后，它进入可运行状态。`run()` 方法在 `start()` 调用后立即被隐式调用。线程从\
    \ `run()` 方法开始执行。线程结束后停止并退出。\n\n当发生中断时，`run()` 再次被调用。也可以用户中断。当调用 `suspend()` 方法时，线程会被挂起，直到调用\
    \ `resume()` 方法。因此，此步骤已废弃，不再使用。使用 `resume()` 后，`run()` 再次被调用。使用 `sleep(毫秒)` 线程会按指定的时间暂停，一段时间后再次恢复，线程进入正常状态。\n\
    \n在多线程的情况下，Java 提供了通过 `wait()`、`notify()` 和 `notifyAll()` 方法实现的优雅进程间通信机制。\n\n\
    `wait()` 告诉调用线程释放锁并进入睡眠，直到其他线程进入同一个锁并调用 `notify()` 或 `notifyAll()`。`notify()`\
    \ 唤醒在同一对象上调用 `wait()` 的第一个线程，而 `notifyAll()` 唤醒所有在同一对象上调用 `wait()` 的线程。优先级最高的线程首先运行。`run()`\
    \ 方法再次被调用。\n\n多线程中还有 `join()` 方法用于等待被调用的线程终止。其名称来自于调用线程等待指定线程加入的概念。它是灵活的，而 `notify()`\
    \ 和 `notifyAll()` 更灵活。因此，最好使用 `notify()` 和 `notifyAll()`。\n\n创建线程有两种方法，即扩展 Thread\
