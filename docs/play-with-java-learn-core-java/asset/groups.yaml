    # Stack


    Stack is a subclass of Vector that implements a standard last-in, first out stack
    (LIFO). Stack only defines the default constructor, which creates an empty stack.


    push() is used to push an object on the top of the stack and pop() is used to
    remove and return the top element. Any EmptyStackException is thrown when the
    invoking Stack is empty.


    peek() - Return the top object.


    empty() - Returns true if nothing is on the Stack.


    search() - It determines whether an object exists on the Stack, and returns the
    number of pops that are required to bring it to the top of the Stack.


    Example:


    ```java

    import java.util.*;

    class exstack

    {

    public void st() {

    Stack s=new Stack();

    s.push(5);

    System.out.println(s);

    s.push(new Integer(6));

    System.out.println(s);

    s.push(new Double(6.7));

    System.out.println(s);

    s.pop();

    System.out.println(s);

    s.push(new Integer(8));

    System.out.println(s);

    }

    public static void main(String[] arg) {

    }

    exstack ob=new exstack();

    ob.st();

    }

    }

    ```


