    \ by default this is console.\n\nSystem.in refers to Standard Input Stream, by\
    \ default this is the keyboard.\n\nSystem.err refers to Standard Error Stream\
    \ which is also the console.\n\nJava implements streams classes in the java.io\
    \ package. I/O package is divided into two streams given as:-\n\n- ByteStream:\
    \ It provides a rich environment for handling byte-oriented I/O. It can be used\
    \ with any type of object, including binary data.\n- CharacterStream: While the\
    \ ByteStream classes provide sufficient functionality to handle any type of I/O\
    \ operation, they cannot work directly with Unicode characters.\n\nThe main purpose\
