    # Inheritance


    Using inheritance, we can create a general class that defines traits common to
    a set of related items. This class can then be inherited by other, more specific
    classes, each adding those things that are unique to it. The class that is inherited
    is called a **superclass** or **parent class** and the class that does the inheriting
    is called a **subclass**. Thus, a subclass is a specialized version of a superclass
    that inherits all the instance variables and methods defined by the subclass and
    its unique elements. We can'
  - '[PAGE 33]


    say that inheritance refers to the sharing of characteristics from parent to child.


    # Advantages:-


    +   - It reduces redundancy i.e. sharing of data.

    - Maintainability becomes easier.

    - Dynamic execution can be done.


    Disadvantage: Complexity is increased if there are many levels.


    ![](img/bdd382ccd4d5d3945e8ba2af128b8c72_33_0.png)


    Types of inheritance: In java, inheritance is only hierarchical which includes
    single and multilevel. Java doesn''t support multiple inheritances.


    Note:- Private members of a superclass can''t be inherited by sub-class i.e. it
    is not accessible to sub-class.


    The child class is inherited from the parent class using extends keyword. We can
    define both parent and child classes either in the same file or in a different
    file, we have to save the filename with the class name having main() defined in
    it ite. the lowest child class. Byte code is generated for both parent and child
    classes separately. There is no need to compile parent classes. Its byte code
    is generated automatically.


    # Syntax:-


    ```

    class <parent-class>

    {

    //body

    }

    class <child-class> extends <parent-class>

    {

    //body

    }

    class parent //parent class

