    # I/O Stream


    Taking input in Java: There are 4 ways to take input in console mode.


    +   1. System.in: It takes input in int and char data type.


    +   2. Command Line input: At runtime, we need to provide input separated by space.
    It will take input in String format.


    +   3. I/O Package: InputStream and BufferedReader class of I/O Package takes
    input in standard format (String).


    +   4. util Scanner: It belongs to the Scanner class. It has a specific datatype
    input methodology.


    For example, input a name from the user through Command-Line and display it on
    the console:


    ```

    class cmd{

    public static void main(String args[]){

    try{

    String s = args[0];

    System.out.print("Your name is: " + s);

    } catch(Exception ex){

    System.out.println(ex.toString());

    }

    }

    ```


    While executing this file pass an argument, separated by space. For example, on
    command prompt write java cmd Rahul.


    OUTPUT:


    E:\java\new_java-java cmd Rahul\Your name is: Rahul


    Java performs I/O operations through Streams. A stream is a sequence of data or
    a continuous flow of bits/bytes like a stream of water, traveling from source
    to destination. Generally, it is used to transfer data in a network. I/O package
    has two modes to read and write data. Streams are used because stream means bytes,
    bytes means ASCII code, ASCII-code means binary, and the computer understands
    binary.'
