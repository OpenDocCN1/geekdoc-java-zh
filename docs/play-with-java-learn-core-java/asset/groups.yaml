    \ finally{}。\n\nJava finally 是可选的，在需要时使用。无论是否发生异常，它总是会被执行。try 块中可能有 10 行代码，如果在第\
    \ 6 行发生异常，异常会被处理，光标会跳出 try 块，而不会完全执行 try 块。为了执行重要代码，会使用 finally。finally 块必须后跟\
    \ try 或 catch 块。对于每个 try 块，必须有一个或多个 catch 块，但只能有一个 finally 块。它主要用于放置“清理”代码，如关闭文件、关闭连接等。我们把所有重要的代码写在\
    \ finally 中。\n\n如果你不处理异常，在程序终止之前，JVM 会执行 finally 块。\n\n### 示例：\n\n```java\nclass\
