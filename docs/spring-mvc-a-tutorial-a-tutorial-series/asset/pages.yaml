- img_proc: true
  md: 'and the price of a Product object validated is negative, then a FieldError
    needs to be created. An ObjectError is any error that is not a FieldError. For
    example, if a Book is for sale in Europe is being purchased on an American online
    branch, then an ObjectError should be raised.


    When writing a validator, you don''t need to create an error object directly by
    instantiating ObjectError or FieldError takes a lot of programming effort. This
    is because the ObjectError’s constructor expects four arguments and the FieldError
    class’s constructor takes seven, as you can see in the constructor signatures.


    ObjectError (String objectName, String[]) codes, Object[] arguments, String defaultMessage)


    FieldError (String objectName, String field, Object rejectedValue, boolean bindingFailure,
    String[]) codes, Object[] arguments, String defaultMessage)


    The easier way to add an error to the Errors object is by calling one of the reject
    or rejectValue methods on the Errors object. You call reject to add an ObjectError
    and rejectValue to add a FieldError.


    Here are some of the method overloads of reject and rejectValue.


    ```

    void reject(String errorCode)

    void reject(String errorCode, String defaultMessage)

    void rejectValue(String field, String errorCode)

    void rejectValue(String field, String errorCode, String defaultMessage)

    ```


    Most of the time, you just need to pass an error code to the reject and rejectValue
    method. Spring can then look up the error code against a properties file to obtain
    the corresponding error message. You can also pass a default message that will
    be used if the error code is not found.


    The error messages in an Errors object can be displayed on an HTML page using
    the errors tag of the form tag library. Error messages can be localized through
    the internationalization feature that Spring supports. More about internationalization
    can be found in Chapter 10, "Internationalization."'
