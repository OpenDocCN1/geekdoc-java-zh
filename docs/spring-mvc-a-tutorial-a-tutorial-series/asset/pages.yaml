    # Summary


    JSP is the second technology for building web applications in Java, invented to
    complement Servlet technology and not to replace it. Well designed Java web applications
    use both servlets and JSP.

    In this appendix you''ve learned how JSP works and how to write JSP pages. By
    now, you should know all there is to know about the implicit objects and be able
    to use the three syntactic elements that can be present in a JSP page, directives,
    scripting elements, and actions.'
