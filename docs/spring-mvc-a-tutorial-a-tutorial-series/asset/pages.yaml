    \ and the load-on-startup element under \"servlet.\" The subsections under this\
    \ section are presented in alphabetical order.\n\n# context-param\n\nThe context-param\
    \ element passes values to the ServletContext. These values can be read from any\
    \ servlet/JSP page. This element contains a name/value pair that can be retrieved\
    \ by calling the getInitParameter method on the ServletContext. You can have multiple\
    \ context-param elements as long as the parameter names are unique throughout\
    \ the application. ServletContext.getParameterNames returns all ServletContext\
    \ parameter names.\n\nThe context-param element must contain a param-name element\
    \ and a param-value element. The param-name element contains the parameter name,\
    \ and the param-value element contains the parameter value. Optionally, a description\
    \ element also can be present to describe the parameter.\n\nThe following are\
    \ two example context-param elements.\n\n```\n<context-param>\n  <param-name>location</param-name>\n\
