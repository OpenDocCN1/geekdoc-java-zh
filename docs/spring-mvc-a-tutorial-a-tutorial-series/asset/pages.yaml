  md: '# Chapter 2: Model 2 and the MVC Pattern


    ![](img/40306dd596a93e2704d63b5edaea0061_34_0.png)


    Figure 2.3: The product details page


    The application is capable of performing these two actions:


    +   1. Display the “Add Product” form. This action sends the entry form in Figure
    2.2 to the browser. The URI to invoke this action must contain the string `product_input`.

    2. Save the product and returns the confirmation page in Figure 2.3. The URI to
    invoke this action must contain the string `product_save`.


    The app02a application consists of the following components:


    +   1. A Product class that is the template for product domain objects. An instance
    of this class contains product information.

    2. A ProductForm class, which encapsulates the fields of the HTML form for inputting
    a product. The properties of a ProductForm are used to populate a Product.

    3. A ControllerServlet class, which is the controller of this Model 2 application.

    4. An action class named SaveProductAction.

    5. Two JSP pages (ProductForm.jsp and ProductDetails.jsp) as the views.'
