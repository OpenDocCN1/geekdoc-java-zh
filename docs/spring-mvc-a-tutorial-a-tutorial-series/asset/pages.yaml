    # # The Back End


    Applications app02a, app02b, and app02c demonstrated how to deal with the front
    end. Now, what about the back end? Surely you need one for dealing with the database
    and so on.


    Using MVC, you can call the back end business logic from your controller classes.
    Normally, you would want several Service classes that encapsulate the complexity
    of the back end stuff. From a Service class, you would instantiate a DAO class
