  md: "# 130 Spring MVC: A Tutorial\n\nTo create a formatter, write a Java class that\
    \ implements the org.springframework.format.Formatter interface. Here is the declaration\
    \ of the interface.\n\npublic interface Formatter<T>\n\nHere, T represents the\
    \ type to which the input string should be converted. The interface has two methods\
    \ that all implementations must override, parse and print.\n\n```\nT parse(String\
    \ text, java.util.Locale locale)\nString print(T object, java.util.Locale locale)\n\
    ```\n\nThe parse method parses a String to the target type using the specified\
    \ Locale. The print method does the reverse, it returns the string representation\
    \ of the target object.\n\nAs an example, the app06b application employs a DateFormatter\
    \ for converting a String to a Date. Does it do the same job as the StringToDateConverter\
    \ converter in app06a.\n\nThe DateFormatter class is given in Listing 6.5.\n\n\
    +   Listing 6.5: The DateFormatter class\n\n```\npackage app06b.formatter;\n\n\
    import java.text.ParseException;\nimport java.text.SimpleDateFormat;\nimport java.util.Date;\n\
    import java.util.Locale;\n\nimport org.springframework.format.Formatter;\n\npublic\
    \ class DateFormatter implements Formatter<Date> {\n\n    private String datePattern;\n\
    \    private SimpleDateFormat dateFormat;\n\npublic DateFormatter(String datePattern)\
    \ {\n        this.datePattern = datePattern;\n        dateFormat = new SimpleDateFormat(datePattern);\n\
    \        dateFormat.setLenient(false);\n    }\\}\n```"
