  md: '# # Chapter 10

    Internationalization


    In this era of globalization, it is now more compelling than ever to be able to
    write applications that can be deployed in different countries and regions that
    speak different languages. There are two terms you need to be familiar with in
    this regard. The first is internationalization, often abbreviated to i18n because
    the word starts with an i and ends with an n, and there are 18 characters between
    the first I and the last n. Internationalization is the technique for developing
    applications that support multiple languages and data formats without rewriting
    the programming logic.


    The second term in localization, which is the technique for adapting an internationalized
    application to support a specific locale. A locale is a specific geographical,
    political, or cultural region. An operation that takes a locale into consideration
    is said to be locale-sensitive. For example, displaying a date is locale-sensitive
    because the date must be in the format used by the country or region of the user.
    The fifteenth day of November 2014 is written 11/15/2014 in the US, but printed
    as 15/11/2014 in Australia. For the same reason internationalization is abbreviated
    i18n, localization is abbreviated l10n.


    Java was designed with internationalization in mind, employing Unicode for characters
    and strings. Making internationalized applications in Java is therefore easy.
    How you internationalize your applications depends on how much static data needs
    to be presented in different languages. There are two approaches.


    +   1. If a large amount of data is static, create a separate version of the resource
    for each locale. This approach normally applies to web application with lots of
    static HTML pages. It is straightforward and will not be discussed in this chapter.


    +   2. If the amount of static data that needs to be internationalized is limited,
    isolate textual elements such as component labels and error'
  merge: -1
  pgno: 214
- img_proc: true
  md: '# 208 MVC: A Tutorial


    messages into text files. Each text file stores the translations of all textual
    elements for a locale. The application then retrieves each element dynamically.
    The advantage is clear. Each textual element can be edited easily without recompiling
    the application. This is the technique that will be discussed in this chapter.


    This chapter starts by explaining what a locale is. Next comes the technique for
    internationalizing your applications, followed by a Spring MVC example.


    # Locales


    The java.util.Locale class represents a locale. There are three main components
    of a Locale object: language, country, and variant. The language is obviously
    the most important part; however, sometimes the language itself is not sufficient
    to differentiate a locale. For example, the English language is spoken in countries
    such as the US and England. However, the English language spoken in the US is
    not exactly the same as the one used in the UK. Therefore, it is necessary to
    specify the country of the language. As another example, the Chinese language
    used in China is not exactly the same as the one used in Taiwan.


    The variant argument is a vendor- or browser-specific code. For example, you WIN
    for Windows, MAC for Macintosh, and POSIX for POSIX. Where there are two variants,
    separate them with an underscore, and put the most important first. For an example,
    a Spanish collation might construct a locale with parameters for language, country,
    and variant as es, Traditional_WIN, respectively.


    ```

    To construct a Locale object, use one of the Locale class''s constructors:

    public Locale(java.lang.String language)

    public Locale(java.lang.String language, java.lang.String country)

    public Locale(java.lang.String language, java.lang.String country, java.lang.String
    variant)

    ```


    The language code is a valid ISO language code. Table 10.1 displays examples of
    language codes.'
