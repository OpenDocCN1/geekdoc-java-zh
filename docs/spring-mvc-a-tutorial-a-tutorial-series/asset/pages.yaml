  md: '# 90 Spring MVC: A Tutorial


    However, note that if the same application is deployed as the default context
    (where the path to the default context is an empty string), the URL for the same
    target would be:

    http://example.com/abc


    Now, consider the following URL that carries a path variable in an application
    deployed as the default context:

    http://example.com/abc/1


    In this case, the browser will think abc is the context, not the action. If you
    refer to <img src="logo.png"> in your page, the browser will look for the image
    in http://example.com/abc/logo.png and it won''t find the image.


    Lucky for us there is an easy solution, i.e. by using JSTL url tag. (JSTL is discussed
    in Chapter 8, "JSTL.") The tag fixes the issue by correctly resolving the URL.
    For example, all CSS imports in the JSP app04b have been changed


    ```

