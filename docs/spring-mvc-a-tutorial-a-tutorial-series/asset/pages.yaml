    Any resource you put under the application directory is directly accessible to
    the user by typing the URL to the resource. If you want to include a resource
    that can be accessed by a servlet but not accessible to the user, put it under
    WEB-INF.


    Now, deploy the application to Tomcat. With Tomcat, one way to deploy an application
    is by copying the application directory to the webapps directory under Tomcat
    installation. You can also deploy an application by editing the server.xml file
    in Tomcat''s conf directory or deploying an XML separately in order to avoid editing
    server.xml. Other servlet containers may have different deployment rules. Please
    refer to Appendix A for details on how to deploy a servlet/JSP application to
    Tomcat.


    The recommended method for deploying a servlet/JSP application is to deploy it
    as a war file. A war file is a jar file with war extension. You can create a war
    file using the jar program that comes with the JDK or tools like WinZip. You can
    then copy the war file to Tomcat''s webapps directory. When you start or restart
    Tomcat, Tomcat will extract the war file automatically. Deployment as a war file
    will work in all servlet containers.


