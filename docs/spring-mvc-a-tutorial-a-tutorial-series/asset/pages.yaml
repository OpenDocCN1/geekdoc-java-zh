  md: "# # Chapter 1\nThe Spring Framework\n\nThe Spring Framework (or Spring for\
    \ short) is an open source framework for developing enterprise applications. It\
    \ is a light-weight solution composed of about twenty different modules. This\
    \ book covers Spring’s Core and Beans modules as well as Spring MVC. Spring MVC\
    \ is of course the subject of this book and a subframework within Spring.\n\n\
    This chapter explains the Core and Beans modules and how they provide solutions\
    \ for dependency injection. For the uninitiated, the concept of dependency injection\
    \ is also discussed in detail. You will use the skills you acquire in this chapter\
    \ to configure the Spring MVC applications developed in the next chapters.\n\n\
    Dependency InjectionDependency injection has been widely used in the past few\
    \ years as a solution to, among others, code testability. In fact, dependency\
    \ injection is behind great frameworks like Spring and Google Guice. So, what\
    \ is dependency injection?\n\nMany people use the terms dependency injection and\
    \ Inversion of Control (IoC) interchangeably, even though Martin Fowler argues\
    \ that they are not the same in his excellent article on the subject.\nhttp://martinfowler.com/articles/injection.html\n\
    \nFor those in a hurry, the short explanation of dependency injection is this.\n\
    \nIf you have two components, A and B, and A depends on B, you can say A is dependent\
    \ on B or B is a dependency of A. Suppose A is a class that has a method called\
    \ importantMethod that uses B, as defined in the following code fragment.\n\n\
    ```\npublic class A {\n    public void importantMethod() {\n        B b = ...\
    \ // get an instance of B\n```"
  merge: -1
  pgno: 18
- img_proc: true
  md: "```\nb.usefulMethod();\n...\n}\n```\n\nA must obtain an instance of B before\
    \ it can use B. While it is as straightforward as using the new keyword if B is\
    \ a concrete class, it can be problematic if B is an interface with many implementations.\
    \ You will have to choose an implementation of B and by doing so you reduce the\
    \ reability of A because you cannot use A with the implementations of B that you\
    \ did not choose.\n\nDependency injection deals with this kind of situation by\
    \ taking over object creation and injecting dependencies to an object that needs\
    \ them. In this case, a dependency injection framework like Spring would create\
    \ an instance of A and an instance of B and inject the latter to the former.\n\
    \nTo make possible for a framework to inject a dependency, you have to create\
    \ a set method or a special constructor in the target class. For example, to make\
    \ A injectable with an instance of B, you would modify A to this.\n\n```\npublic\
    \ class A {\n    private B b;\n    public void importantMethod() {\n        //\
    \ no need to worry about creating B anymore\n        // B b = .... // get an instance\
    \ of B\n        b.usefulMethod();\n        ...\n    }\n    public void setB(B\
    \ b) {\n        this.b = b;\n    }\n}\n```\n\nIn the revised version of A, there\
    \ is a setter method that can be called to inject an instance of B. Since dependency\
    \ injection provides dependencies for an object, the importantMethod method in\
    \ A no longer needs to create an instance of B before being allowed to call its\
    \ usefulMethod method.\n\nAlternatively, if you prefer a constructor, you could\
    \ modify class A to this.\n\n```\npublic class A {\n```"
