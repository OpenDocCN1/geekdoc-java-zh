    # Error Handling


    Error handling is well supported in JSP. Java code can be handled using the try
    statement, however you can also specify a page that will be displayed any of the
    pages in the application encounters an uncaught exception. In events, your users
    will see a well designed page that explains what happened, and not an error message
    that makes them frown.


    You make a JSP page error by using the isErrorPage attribute of the page directive.
    The value of the attribute must be true. Listing C.13 shows an error handler.


    # C.13: the errorHandler.jsp page


    ```

    %@page isErrorPage="true"%

    <html>

    <head><title>Error</title></head>

    <body>

    An error has occurred. <br/>

    Error message:

    <%

    outout.println(exception.toString());

    %

    </body>

    </html>

    ```


    Other pages that need protection against uncaught exceptions have to use the errorPage
    attribute of the page directive, citing the path to the error handling page as
    the value. For example, the buggy.jsp page in Listing C.14 uses the error handler
    in Listing C.13.


    # C.14: the buggy.jsp page


    ```

    %@page errorPage="errorHandler.jsp"%

    Deliberately throw an exception

    <%

    Integer.parseInt("Throw me");

    %>

    ```'
