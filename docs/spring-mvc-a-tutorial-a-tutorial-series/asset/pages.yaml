  md: '# # Chapter 2

    # Model 2 and the MVC Pattern


    There are two models in Java web application design, conveniently called Model
    1 and Model 2. Model 1 is page-centric and suitable for very small applications
    only. Model 2 is based on the Model-View-Controller (MVC) design pattern and the
    recommended architecture for all but the simplest Java web applications.


    This chapter discusses Model 2 and provides three Model 2 sample applications.
    The first application features a basic Model 2 application with a servlet as the
    controller. The second one introduces the use of controller classes. The third
    one introduces a validator component for validating user input.


    # # Model 1 Overview


    When you first learn JSP, your first applications would normally enable navigation
    from one page to another by providing links to the JSP pages. While this navigation
    method is straightforward, in medium-sized or large applications with significant
    numbers of pages, this approach can cause a maintenance headache. Changing the
    name of a JSP page, for instance, could force you to rename the links to the page
    in many other pages. As such, Model 1 is not recommended unless your application
    will only have two or three pages.'
  merge: -1
  pgno: 30
- img_proc: true
  md: '# Model 2 Overview


    Model 2 is based on the Model-View-Controller (MVC) design pattern, the central
    concept behind the Smalltalk-80 user interface. The term “design pattern” had
    not been coined at that time, it was called the MVC paradigm.


    An application implementing the MVC pattern consists of three modules: model,
    view, and controller. The view takes care of the display of the application. The
    model encapsulates the application data and business logic. The controller receives
    user input and commands the model and/or the view to change accordingly.


    # Note


    The paper entitled Applications Programming in Smalltalk-80(TM): How to use Model-View-Controller
    (MVC) by Steve Burbeck, Ph.D. discusses the MVC pattern. You can find it at http://www-cs.illinois.edu/users/march/st-docs/mvc.html.


    In Model 2, you have a servlet or a filter acting as the controller. All modern
    web frameworks are Model 2 implementations. Frameworks like Spring MVC and Struts
    1 employ a servlet controller in their MVC architectures, whereas Struts 2, another
    popular framework, uses a filter. Generally JSP pages are employed as the views
    of the application, even though other view technologies are supported. As the
    models, you use POJOs (POJO is an acronym for Plain Old Java Object). POJOs are
    ordinary objects, as opposed to Enterprise JavaBeans (EJB) or other special objects.
    Many people choose to use a JavaBean (plain JavaBean, not EJB) to store the states
    of a model object and move business logic to an action class. A JavaBean must
    have a no-argument constructor and get/set methods for accessing properties. In
    addition, a JavaBean should be serializable.


    Figure 2.1 shows the diagram of a Model 2 application.'
