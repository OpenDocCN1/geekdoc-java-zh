  md: '```

    </head>

    <body>

    Welcome to Brainy

    </body>

    </html>

    ```


    The first line of the response header is similar to the first line of the request
    header. It tells you that the protocol used is HTTP version 1.1, and that the
    request suceeded (200 is the success code).


    The response headers contain useful information similar to the headers in an HTTP
    request. The entity body of the response is the HTML content of the response itself.
    The headers and the entity body are separated by a sequence of CRLFs.


    Status code 200 is only issued if the web server was able to find the resource
    requested. If a resource cannot be found or the request cannot be understood,
    the server sends a different request code. For instance, 401 for an unauthorized
    access and 405 indicates that the HTTP method is not allowed. For a complete list
    of HTTP status codes, refer to this online document.


    ```

    http://www.w3.org/Protocols/rfc2616/rfc2616-sec10.html

    ```


    # Servlet and JSP Overview


    Java Servlet technology, or Servlet for short, is the underlying technology for
    developing web applications in Java. Sun Microsystems released it in 1996 to compete
    with the Common Gateway Interface (CGI), the then standard for generating dynamic
    content on the web. The main problem with CGI was that it spawned a new process
    for every HTTP request. This made it difficult to scalable CGI programs because
    creating a process took lot of CPU cycles. A servlet, on the other hand, is much
    faster than a CGI program because a servlet stays in memory after serving its
    first request, waiting for subsequent requests.


    Since the day Servlet emerged, a number of Java-based web frameworks have been
    developed to help programmers write more rapidly. These frameworks let you focus
    on the business logic and spend less time writing boilerplate code. However, you
    still have to understand the'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# Introduction


    nuts and bolts of Servlet. And JavaServer Pages (JSP), which was later released
    to make writing servlets easier. You may be using a great framework like Spring
    MVC, Struts 2, or JavaServer Faces. However, without excellent knowledge of Servlet
    and JSP, you won''t be able to code effectively and efficiently. Servlets, by
    the way, are Java classes that run on a servlet container. A servlet container
    or servlet engine is like a web server but has the ability to generate dynamic
    content, not just serve static resources. Servlet 3.1, the current version, is
    defined in Java Specification Request (JSR) 340 (http://jcp.org/en/jsr/detail?id=340).
    It requires Java Standard Edition 6 or later. JSP 2.3 is specified in JSP 245
    (http://jcp.org/en/jsr/detail?id=245). This book assumes you know Java and object-oriented
    programming. If you are new to Java, I recommend Java 7: A Beginner''s Tutorial
    (Third Edition), ISBN 978-0-9808396-1-6.


    A servlet is a Java program. A servlet application consists of one or more servlets.
    A JSP page is translated and compiled into a servlet.


    A servlet application runs inside a servlet container and cannot run on its own.
    A servlet container passes requests from the user to the servlet application and
    responses from the servlet application back to the user. As servlet applications
    include at least several servlet JSP pages. As such, it’s more appropriate to
    use the term “servlet/JSP application” to refer to a Java web application than
    to leave JSP out.


    Use a web browser as Internet Explorer, Mozilla Firefox, or Google Chrome to access
    servlet applications. A web browser is referred to as a web client. Figure I.1
    shows the architecture of a servlet/JSP application.


    ![](img/40306dd596a93e2704d63b5edaea0061_14_0.png)


    Figure I.1: Servlet/JSP application architecture'
  merge: -1
  pgno: 14
- img_proc: true
  md: '# Spring MVC: A Tutorial


    The web server and the web client communicate in a language they both are fluent
    in: the Hypertext Transfer Protocol (HTTP). Because of this, a web server is also
    called an HTTP server.


    A servlet/JSP container is a special web server that can process servlets as well
    as static static contents. In the past, people were more comfortable running a
    servlet/JSP container as a module of an HTTP server such as the Apache HTTP Server
    because an HTTP server was considered more robust than a servlet/JSP container.
    In this scenario the servlet/JSP container would be tasked with generating dynamic
    contents and the HTTP server with serving static resources. Today servlet/JSP
    containers are mature and widely deployed without an HTTP server. Apache Tomcat
    and Jetty are the most popular servlet/JSP containers and are free and open-source.
    You can download them from http://tomcat.apache.org and http://jetty.codehaus.org,
    respectively.


    Servlet and JSP are two of a multitude of technologies defined in the Java Enterprise
    Edition (EE). Other Java EE technologies include Java Message Service (JMS), Enterprise
    JavaBeans (EJB), Server Faces (JSF), and Java Persistence. The complete list of
    technologies in the Java EE version 7 (the current version) can be found here.

    http://www.oracle.com/technwork/java/javaee/tech/index.html


    To run a Java EE application, you need a Java EE container, such as GlassFish,
    Jboss, Oracle WebLogic, and IBMSphere. You can deploy a servlet/JSP application
    in a Java EE container, but a servlet/JSP container is sufficient and is more
    lightweight than a Java EE container. Tomcat and Jetty are not Java EE containers,
    so they cannot run EJB or JMS.


    # About This Book


    This section presents an overview of each chapter.


    Chapter 1, “The Spring Framework” introduces the popular open source framework.


    Chapter 2, “Model 2 and the MVC Pattern” discusses the pattern on which Spring
    MVC was built.'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'Chapter 3, “Introduction to Spring MVC” presents a gentle introduction to Spring
    MVC. In this chapter you learn to write your first Spring MVC application.


    Chapter 4, “Annotation-Based Controllers” discusses one of the main pillars of
    the MVC pattern, the controller. In this chapter you learn how to write annotation-based
    controllers, an approach introduced in Spring MVC 2.5.


    Chapter 5, “Data Binding and the Form Tags” discusses one of the most powerful
    features in Spring MVC and how to use it to repopulate fields.


    Chapter 6, “Converters and Formatters” talks about two object types that help
    with data binding, the converter and the formatter.


    Chapter 7, “Validators” teaches you how to validate user input by building validators.


    Chapter 8, “The Expression Language” explains one of the most important features
    added in JSP 2.0, the Expression Language (EL). The EL aims to make possible to
    author script-free JSP pages and can help you write shorter and more effective
    JSP pages. In this chapter you will learn to use the EL to access JavaBeans and
    scoped objects.


    Chapter 9, “JSTL” explains the most important libraries in the Java Pages Standard
    Tag Library (JSTL), a collection of custom tag libraries for solving common problems
    such as iterating over a map or collection, conditional testing, XML processing,
    and even database access and data manipulation.


    Chapter 10, “Internationalization” shows how to build multi-language web sites
    using Spring MVC.


    Chapter 11, “File Upload” shows how to write controllers that can handle uploaded
    files. Two approaches are discussed.


    Chapter 12, “File Download” explains how to send a resource to the browser programmatically.


    Appendix A. “Tomcat” explains how to install and configure Tomcat and run it in
    multiple operating systems.'
  merge: -1
