    # # Formatters


    A formatter is like a converter, it also converts a type to another type. However,
    the source type for a formatter must be a String whereas a converter can work
    with any source type. Formatters are more suitable for the web-tier whereas converters
    can be used in any tier. For converting user input in a form in a Spring MVC application,
    you should always choose a formatter over a converter.'
