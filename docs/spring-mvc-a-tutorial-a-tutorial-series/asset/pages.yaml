    # Validators


    Input validation is an important step when performing an action. Validation ranges
    from simple tasks like checking if an input field has a value to more complex
    ones like verifying a credit card number. In fact, validation play such an important
    role that the Java community has published JSR 303, “Bean Validation” and JSR
    349, “Bean Validation 1.1” to standardize input validation in Java. Modern MVC
    frameworks often offer both programmatic and declarative validation methods. In
    programmatic validation, you write code to validate user input. In declarative
    validation, you provide validation rules in an XML document or properties file.


    The following example features a new application (app02c) that extends the servlet
    controller-based Model 2 application in app02b.


    Figure 2.6 shows the directory structure of app02c.


    The new application is similar to app02b, except that it incorporates a ProductValidator
    class and two JSTL JAR files in its WEB-INF/lib directory. JSTL is discussed in
    Chapter 9, “JSTL.” For now, it suffices to say that it helps with the displaying
    of validation error messages in the ProductForm.jsp page.


    The ProductValidator class is given in Listing 2.10.'
