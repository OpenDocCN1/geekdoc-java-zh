  md: '5. If the type of value-a is java.util.Map, check whether value-b is a key
    in the Map. If it is, return value-a.get(value-b). If it is not, return null.


    6. If the type of value-a is java.util.List or if it is an array, do coercion-b
    to int. or the following:


    +   a. coercion fails, throws an exception.

    b. If value-a.get(value-b) throws an IndexOfOutOfBoundsException or if Array.get(value-a,
    value-b) throws an ArrayIndexOutOfBoundsException, return null.

    c. Otherwise, return value-a.get(value-b) if value-a is a List, or return Array.get(value-a,
    value-b) if value-a is an array.


    +   7. If the type of value-a is a Map, a List, or an array, value-a must be a
    JavaBean. In this case, coerce value-b to String. If value-b is a readable property
    of value-a, call the getter of the property and return the value from the getter
    method. If the getter method throws an exception, the expression is invalid. Otherwise,
    the expression is invalid.


    # Accessing JavaBeans


    You can use either the . operator or the || operator to access a bean''s property.
    Here are the constructs:


    ```

    ${{beanName["propertyName"]}

    ${beanName.propertyName}

    ```


    For example, to access the property secret on a bean named myBean, use the following
    expression:


    ```

    ${myBean.secret}

    ```


    If the property is an object that in turn has a property, you can access the property
    of the second object too, again using the . or || operator. Or, if the property
    is a Map, a List, or an array, you can use the same rule explained in the preceding
    section to access the Map''s values or the members of the List or the element
    of the array.'
