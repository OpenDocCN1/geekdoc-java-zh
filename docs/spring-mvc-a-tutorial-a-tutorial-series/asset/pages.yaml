- img_proc: true
  md: 'Note that an EL expression is evaluated from the highest to the lowest precedence,
    and then from left to right. The following are the arithmetic operators in the
    decreasing lower precedence:


    ```

    * / div % mod

    +-

    ```


    This means that *, /, div %, and mod operators have the same level of precedence,
    and + has the same precedence as - , but lower than the first group. Therefore,
    the expression ${1+2*3}


    results in 7 and not 6.


    # Relational Operators


    The following is the list of relational operators:


    +   - equality (== and eq)

    - non-equality (!= and ne)

    - greater than (> and gt)

    - greater than or equal to (>= and ge)

    - less than (< and lt)

    - less than or equal to (<= and le)


    For instance, the expression ${{3==4} returns false, and ${"b"<"d"} returns true.


    # Logical Operators


    Here is the list of logical operators:


    +   - AND (&& and and)

    - OR (|| and or)

    - NOT (! and not)'
