  md: '# EL Implicit Objects


    From a JSP page you can use JSP scripts to access JSP implicit objects. However,
    from a script-free JSP page, it is impossible to access these implicit objects.
    The EL allows you to access various objects by providing a set of its own implicit
    objects.


    | Object | Description |

    | --- | --- |

    | pageContext | The *javax.servlet.jsp.JPageContext* for the current JSP. |

    | initParam | A Map containing all context initialization parameters with the
    parameter names as the keys. |

    | param | A Map containing all request parameters with the parameter names as
    the keys. The value for each key is the first parameter value of the specified
    name. Therefore, if there are two request parameters with the same name, only
    the first can be retrieved by the **param** object. For accessing all parameter
    values that share the same name, use the **params** object instead. |

    | paramValues | A Map containing all request parameters as name-keys. The value
    for each key is an array of strings containing all the values for the specified
    parameter name. If the parameter has only one value, it returns an array having
    one element. |

    | header | A Map containing the request headers with the header names as the keys.
    The value for each key is the first header of the specified header name. In other
    words, if a header has more than one value, only the first value is returned.
    To obtain multi-value headers, use the headerheaderValues object. |

    | headerValues | A Map containing all request headers with the header names as
    the keys. The value for each key is an array of strings containing all the values
    for the specified header name. If the header has only one element, it returns
    a one-element array. |

    | cookie | A Map containing all Cookie objects in the current request object.
    The cookies'' names are the Map''s keys, and each key is mapped to a *Cookie*
    object. |

    | applicationScope | A Map that contains all attributes in the *ServletContext*
    object with the attribute names as the keys. |

    | sessionScope | A Map that contains all the attributes in the *HttpSession* object
    in which the attribute names are the keys. |

    | requestScope | A Map that contains all the attributes in the current *HTTPRequest*
    object with the attribute names as the keys. |

    | pageScope | A Map that contains all attributes with the page scope. The attributes''
    names are the keys of the **Map**. |


    Table 8.1: The EL Implicit Objects'
