  md: "# Request Parameters and Path Variables\n\nBoth request parameters and path\
    \ variables are used to send values to the server. Both are also part of a URL.\
    \ The request parameter takes the form of key=value pairs separated by an ampersand.\
    \ For instance, this URL carries a productId request parameter with a value of\
    \ 3.\n\n```\nhttp://localhost:8080/app04b/product_retrieve?productId=3\n```\n\n\
    In servlet programming, you can retrieve a request parameter value using the getParameter\
    \ method on the HttpServletRequest:\n\n```\nString productId = httpRequest.getParameter(\"\
    productId\");\n```\n\nIn Spring MVC there is an easier way to retrieve a request\
    \ parameter value: using the org.springframework.web.bind.RequestParam annotation\
    \ to annotate an argument to which the value of the request parameter will be\
    \ copied. For example, the following method contains an argument that captures\
    \ request parameter productId.\n\n```\npublic void sendProduct(@RequestParam int\
    \ productId)\n```\n\nAs you can see, the type of argument annotated with @RequestParam\
    \ does not need to be String.\n\nA path variable is similar to a request parameter,\
    \ except that there is no key part, just a value. For example, the product_view\
    \ action in app04b is mapped to a URL with this format:\n\n```\n/product_view/{productId}\n\
    ```\n\nwhere productId is an integer representing a product identifier. In Spring\
    \ MVC parlance, productId is called a path variable. It is used to send values\
    \ to the server.\n\nConsider the view method in Listing 4.11 that demonstrates\
    \ the use of a path variable.\n\n# Listing 4.11: Using path variables\n\n```\n\
    @RequestMapping(value = \"/product_view/{id}\")\npublic String viewProduct(@PathVariable\
    \ Long id, Model model) {\n    Product product = productsService.get(id);\n  \
    \  model.addAttribute(\"product\", product);\n```"
