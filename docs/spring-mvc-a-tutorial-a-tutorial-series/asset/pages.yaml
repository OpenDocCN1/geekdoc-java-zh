  md: "```\nimport org.springframework.stereotype.Controller;\nimport org.springframework.web.bind.annotation.RequestMapping;\n\
    ...\n```\n\n```\n@Controller\npublic class CustomerController {\n\n    @RequestMapping(value\
    \ = \"/customer_input\")\n    public String inputCustomer() {\n\n        // do\
    \ something here\n\n        return \"CustomerForm\";\n    }\n}\n```\n\nYou specify\
    \ the URI mapped to the method using the **value** attribute in the **RequestMapping**\
    \ annotation. In the example above, the URI **customer_input** is mapped with\
    \ the **inputCustomer** method. This means, the **inputCustomer** method can be\
    \ invoked using a URL having this pattern.\n\n```\nhttp://domain/context/customer_input\n\
    ```\n\nSince the **value** attribute is the default attribute of the **RequestMapping**\
    \ annotation type, you can omit the attribute name if it is the only attribute\
    \ used in the **RequestMapping** annotation. In other words, these two annotations\
    \ have the same meaning.\n\n```\n@RequestMapping(value = \"/customer_input\")\n\
    @RequestMapping(\"/customer_input\")\n```\n\nHowever, if more than one attributes\
    \ appear in @RequestMapping, you must write the **value** attribute name.\n\n\
    The value of a request mapping can be an empty string, in which case the method\
    \ is mapped to the following URL:\n\n```\nhttp://domain/context\n```\n\n**RequestMapping**\
    \ has other attributes besides **value**. For instance, the **method** attribute\
    \ takes a set of HTTP methods that will be handled by the corresponding method."
