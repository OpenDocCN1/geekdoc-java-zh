    # welcome-file-list


    The welcome-file-list element specifies the file or servlet that is displayed

    when the URL entered by the user in the browser does not contain a servlet

    name or a JSP page or a static resource.


    The welcome-file-list element contains one or more welcome-file

    elements. The welcome-file element contains the default file name. If the

    file specified in the first welcome-file element is not found, the web

    container will try to display the second one, and so on.


    Here is an example welcome-file-list element.


    ```

    <welcome-file-list>

    <welcome-file>index.html</welcome-file>

    <welcome-file>index.html</welcome-file>

    <welcome-file>index.jsp</welcome-file>

    </welcome-file-list>

    ```


    The following example uses a welcome-file-list element that contains two

    welcome-file elements. The first welcome-file element specifies a file in the

    application directory called index.html; the second defines the welcome

    serv under the servlet directory, which is under the application directory:


    ```

    <welcome-file-list>

    <welcome-file>index.html</welcome-file>

    <welcome-file>servlet/welcome</welcome-file>

    </welcome-file-list>

    ```


