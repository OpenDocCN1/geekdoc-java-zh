  md: '# The url Tag


    The url tag is used to compose the correct URL of a resource by taking account
    whether or not the application context is the default context. To understand why
    the **url tag** is very important, consider the following URL.

    http://example.com/myapp/abc


    The browser will think (correctly) that **myapp** is the context and **abc** is
    the action. Any relative reference to a static file, such as a CSS file, will
    be resolved using http://example.com/myapp as the base. This is to say, if the
    page sent by the server contains this **img** element

    <img src="logo.png">


    The browser will look for **logo.png** in http://example.com/myapp/logo.png.


    However, note that if the same application is deployed as the default context
    (where the path to the default context is an empty string), the URL for the same
    action would be

    http://example.com/abc


    Now, consider the following URL that carries a path variable in an application
    deployed as the default context:

    http://example.com/abc/l


    In this case, the browser will think **abc** is the context, not the action. If
    you refer to <img src="logo.png"> in your page, the browser will look for the
    image in http://example.com/abc/logo.png and it won''t find the image.


    Lucky for the **url** tag provides a solution. It fixes the issue by correctly
    resolving the URL. For example, a CSS import in a JSP page like this is sensitive
    to whether or not the context is the default context.

    <style type="text/css">@import url(css/main.css);</style>


    If you use the url tag like this

    <style type="text/css">

    @import url("<c:url value="css/main.css"/>\n</style>'
  merge: -1
