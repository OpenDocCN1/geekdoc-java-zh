  md: 'There are many advantages of using the deployment descriptor. For one, you
    can include elements that have no equivalent in @WebServlet, such as the load-on-startup
    element. This element loads the servlet at application start-up, rather than when
    the servlet is first called. Using load-on-startup means the first call to the
    servlet will take no longer than subsequent calls. This is especially useful if
    the init method of the servlet takes a while to complete.


    Another advantage of using the deployment descriptor is that you do not need to
    recompile your servlet class if you need to change configuration values, such
    as the servlet path.


    In addition, you can pass initial parameters to a servlet and edit them without
    recompiling the servlet class.


    The deployment descriptor also allows you to override values specified in a servlet
    annotation. A WebServlet annotation on a servlet that is declared in the deployment
    descriptor will have no effect. However, annotating a servlet not in the deployment
    descriptor in an application with a deployment descriptor will still work. This
    means, you can have annotated servlets and declare servlets in the deployment
    descriptor in the same application.


    Figure B.8 presents the directory structure of b3. The directory structure does
    not differ from that of app01a. The only difference is that b3 has a web.xml file
    (the deployment descriptor) in the WEB-INF directory.


    ![](img/40306dd596a93e2704d63b5edaea0061_304_0.png)


    # Figure B.8: Directory structure of b3 with deployment descriptor


    Now that SimpleServlet and WelcomeServlet are declared in the deployment descriptor,
    you can use these URLs to access them:


    ```

    http://localhost:8080/b3/simple

    ```'
