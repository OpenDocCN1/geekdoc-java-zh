  md: '# Spring MVC: A Tutorial


    After a resource name comes one or more query string or path variable. A query
    string is a key/value pair that can be passed to the server to be processed. Two
    query strings are separated by an ampersand (&). A path variable is like query
    string, but contains only the value part. Two path variables are separated with
    a forward slash (/).


    The following subsections discuss HTTP requests and responses in detail.


    # The HTTP Request


    The HTTP request consists of three components:


    +   - Method—Uniform Resource Identifier (URI)—Protocol/Version

    - Request headers

    - Entity body


    Here is a sample HTTP request:


    ```

    POST /examples/default.jsp HTTP/1.1

    Accept: text/plain; text/html

    Accept-Language: en-gb

    Connection: Keep-Alive

    Host: localhost

    User-Agent: Mozilla/5.0 (Macintosh; U; Intel Mac OS X 10.5; en-US; rv:1.9.2.6)
    Gecko/20100625 Firefox/3.6.6

    Content-Length: 30

    Content-Type: application/x-www-form-urlencoded

    Accept-Encoding: gzip, deflate

    ```


    ```

    lastName=Blanks&firstName=Mike

    ```


    The method—URI—protocol version appears as the first line of the request.

    POST /examples/default.jsp HTTP/1.1


    Here POST is the request method, /examples/default.jsp the URI, and HTTP/1.1 the
    Protocol/Version section.


    An HTTP request can use one of the many request methods specified in the HTTP
    standards. HTTP 1.1 supports seven request types: GET, POST, HEAD, OPTIONS, PUT,
    DELETE, and TRACE. GET and POST are the most commonly used in Internet applications.'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'The URI specifies an Internet resource. It is usually interpreted as being
    relative to the server’s root directory. Thus, it should always begin with a forward
    slash /. A Uniform Resource Locator (URL) is actually a type of URI (See http://www.ietf.org/rfc/rfc2396.txt).


    In an HTTP request, the request header contains useful information about the client
    environment and the entity body of the request. For instance, it may contain the
    language the browser is set for, the length of the entity body, and so on. Each
    header is separated by a carriage return/linefeed (CRLF) sequence.


    Between the headers and the entity body is a blank line (CRLF) that is important
    to the HTTP request format. The CRLF tells the server where the entity body begins.
    In some Internet programming books, CRLF is considered the fourth component of
    an HTTP request.


    In the previous HTTP request, the entity body is simply the following line:


    ```

    lastName=Blanks&firstName=Mike

    ```


    The entity body can easily be much longer in a typical HTTP request.


    # The HTTP Response


    Similar to the HTTP request, the HTTP response also consists of three parts:


    +   * Protocol—Status code—Description

    * Response headers

    * Entity body


    The following is an example of an HTTP response:


    ```

    HTTP/1.1 200 OK

    Server: Apache-Coyote/1.1

    Date: Thu, 29 Sep 2013 13:13:33 GMT

    Content-Type: text/html

    Last-Modified: Wed, 28 Sep 2013 13:13:12 GMT

    Content-Length: 112

    ```


    ```

    <html>

    <head>

    <title>HTTP Response Example</title>

    ```'
