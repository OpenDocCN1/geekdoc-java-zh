  md: '# Introduction


    Welcome to Spring MVC: A Tutorial.


    Spring MVC is a module in the Spring Framework (or Spring for short) for rapidly
    developing web applications. The MVC in Spring MVC stands for Model-View-Controller,
    a design pattern widely used in Graphical User Interface (GUI) development. This
    pattern is not only common in web development, but is also used in desktop technology
    like Java Swing.


    Sometimes called Spring Web MVC, Spring MVC is one of the most popular web frameworks
    today and a most sought-after skill. This book is for you if you want to learn
    how to develop Java-based web applications with Spring MVC.


    Learning Spring MVC will be much easier if you already master the Spring Framework
    as well as Servlet and JavaServer Pages (JSP), the two Java technologies upon
    which Spring MVC is based. If you''re new to Spring, Chapter 1 presents a short
    tutorial on the Spring Framework. If you are not familiar with Servlet and JSP,
    don''t despair. You can find two crash courses that will help: Appendix B, "Servlet"
    and Appendix C, "JavaServer Pages." If you are interested to know more about Servlet
    and JSP, I recommend Servlet and JSP: A Tutorial (ISBN 978-0980839623) by Budi
    Kurniawan.


    The rest of this introduction talks about HTTP, web programming with Servlet and
    JSP, and the content of the book.


    # The Hypertext Transfer Protocol (HTTP)


    The HTTP protocol enables web servers and browsers to exchange data over the Internet
    or an intranet. The World Wide Web Consortium (W3C),'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'an international community that develops standards, is responsible for revising
    and maintaining this protocol. The first version of HTTP was HTTP 0.9, which was
    then replaced by HTTP 1.0. Superseding HTTP 1.0 is HTTP 1.1, the current version.
    HTTP 1.1 is defined by the W3C''s Request for Comments (RFC) 2616, which can be
    downloaded from http://www.w3.org/Protocols/HTTP/1.1/rfc2616.pdf.


    A web server runs 24x7 waiting for HTTP clients (normally web browsers) to connect
    to it and ask for resources. In HTTP it is always the client that initiates a
    connection, a server is never in a position to contact a client.


    # Note


    It is worth noting that in 2011 the Internet Engineering Task Force (IETF), a
    standards body, standardized the WebSocket protocol as RFC 6455. The protocol
    allows an HTTP connection to be upgraded to a WebSocket, which will allow the
    connection to send messages in both directions. This means, using the WebSocket
    protocol a server can initiate conversations with its WebSocket clients.


    To locate a resource, an Internet user would click a link that contains a Uniform
    Resource Locator (URL) or enter one in the Location box of his/her browser. Here
    are two examples of URLs:


    ```

    http://google.com/index.html

    http://facebook.com/index.html

    ```


    The first part of the URLs is http, which identifies the protocol. Not all URLs
    use HTTP. For instance, these two URLs are valid even though they are not HTTP-based
    URLs:


    ```

    mailto:joe@example.com

    ftp:marketing@ftp.example.com

    ```


    In general an HTTP-based URL has this format:


    ```

    protocol://[host].domain[:port][/context][/resource]?query string

    path variable

    ```


    or


    ```

    protocol://IP address[:port][/context][/resource]?query string |

    path variable

    ```'
  merge: -1
  pgno: 9
- img_proc: true
  md: '# Introduction


    The parts in square brackets are optional, therefore a URL can be as simple

    as http://yahoo.ca or http://192.168.1.9. An Internet Protocol (IP) address,

    by the way, is a numerical label assigned to a computer or another device. In

    other words, instead of typing http://google.com, you can use its IP address:

    http://173.194.46.35. To find out the IP address of a domain, use the ping

    program on your computer console:


    ping google.com


    An IP address is hard to remember, so people prefer to use the domain.

    A computer may host than one domain, so multiple domains can have

    the same IP address. And, did you know that you can''t buy example.com or

    example.org because they are reserved for documentation purpose?


    The host part of a URL may represent and identify a totally different

    location on the Internet or an intranet. For instance, http://yahoo.com (no

    host) brings you to a different location than http://mail.yahoo.com (with a

    host). Over the years web has been the most popular host name and

    become the default. Normally, http://www.domainName is mapped to

    http://domainName.


    80 is the default port of HTTP. Therefore, if a web server runs on port

    80, you don''t need the port number to reach the server. Sometimes,

    hover, a web server doesn''t run on port 80 and you need to type the port

    number. For example, Tomcat by default runs on port 8080, so you need to

    supply the port number when requesting a resource:


    ```

    http://localhost:8080/index.html

    ```


    localhost is a reserved name typically used to refer to the local computer,

    i.e. the same computer the web browser is running on.


    The context part of a URL refers to the application name, but this is also

    optional. A web server can run multiple contexts (applications) and one of

    them can be configured to be the default context. To request a resource in

    the default context, you skip the context part in a URL.


    Finally, a context can have one or more default resources (ordinarily

    index.html or index.htm or default.htm). A URL without a resource name is

    considered to identify a default resource. Of course, if more than one default

    resource exists in a context, the one with the highest priority will always be

    returned when a client does not specify a resource name.'
