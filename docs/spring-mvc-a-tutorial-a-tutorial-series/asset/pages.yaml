  md: 'The body content for out is JSP. The list of the tag''s attributes is given
    in Table 9.2.


    | Attribute | Type | Description |

    | --- | --- | --- |

    | value*+ | Object | The expression to be evaluated. |

    | escapeXml+ | boolean | Indicates whether the characters <, >, &, and '' in the
    result will be converted to the corresponding character entity codes, i.e. < to
    &lt;, etc. |

    | default+ | Object | The default value |


    Table 9.2: The out tag''s attributes


    For example, the following out tag prints the value of the scoped variable x:
    `<c:out value="${x}"/>`


    By default, out encodes the special characters <, >, '', " and & to their corresponding
    character entity codes &lt;, &gt; &#39; &#034; and &amp; respectively.


    Prior to JSP 2.0, the out tag was the easiest way to print the value of a scoped
    object. In JSP 2.0 or later, unless you need to XML-escape a value, you can safely
    use an EL expression:


    ```

    s{x}

    ```


    # Warning


    If a string containing one or more special characters is not XML escaped, its
    value may not be rendered correctly in the browser. On top of that, unescaped
    special characters will make your web site susceptible to cross-site scripting
    attacks, i.e. someone can post a JavaScript function/expression that will be automatically
    executed.


    The default attribute in out lets you assign a default value that will be displayed
    if the EL expression assigned to its value attribute returns null. The default
    attribute may be assigned a dynamic value. If this dynamic value returns null,
    the out tag will display an empty string.


    For example, in the following out tag, if the variable myVar is not found in the
    HttpSession, the value of the application-scoped variable myVar is displayed.
    If the latter is not found, an empty string is sent to the output.'
