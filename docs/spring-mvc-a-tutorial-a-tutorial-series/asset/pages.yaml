- img_proc: true
  md: '# Chapter 9: JSTL


    The URL will be translated into this if it is in the default context.


    ```

    <style type="text/css">@import url("/css/main.css");</style>

    ```


    And it will be translated into this if it is not in the default context.


    ```

    <style type="text/css">@import url("/myapp/main.css");</style>

    ```


    The `url` tag can be used without body content with the following syntax


    ```

    <c:url value="value" [context="context"] [var=varName]

    scope="page request|session|application"]/>

    ```


    or with body content with this syntax.


    ```

    <c:url value="value" [context="context"] [var=varName]

    scope="page request|session|application">

    <c:param>subtags</c:param>

    </c:url>

    ```


    The attributes for the `url` tag are given in Table 9.8.


    | Attribute | Type | Description |

    |---|---|--|

    | value | String | The URL to be processed. |

    | context | String | The name of the context when specifying a relative URL resource
    that belongs to a foreign context. |

    | var | String | The scoped variable to be created for the processed URL. |

    | scope | String | The scope of the newly created scoped variable. |


    Table 9.8: The url tag’s attributes


    # ## The redirect Tag


    The `redirect` tag sends an HTTP redirect to the client. Attributes that may appear
    within this tag are presented in Table 9.9.


    | Attribute | Type | Description |

    |---|---|--|

    | url | String | The URL to redirect to. |

    | context | String | The name of the context when redirecting to a relative URL
    resource that belongs to a foreign context. |


    Table 9.9: The redirect tag’s attributes'
