    </c:forEach>\n```\n\nFor each iteration, the **forEach** tag creates a scoped\
    \ variable whose name is specified by the **var** attribute. In this case, the\
    \ scoped variable is named **phone**. The EL expression within the **forEach**\
    \ tag is used to display the value of **phone**. The scoped variable is only available\
    \ from within the"
