- img_proc: true
  md: 'JSR’s, there are currently two implementations. The first is Hibernate Validator,
    which is currently at version 5 and implement both JSR 303 and JSR 349. It can
    be downloaded from this site.

    http://sourceforge.net/projects/hibernate/files/hibernate-validator/


    The second implementation is Apache BVal, which implements JSR 303 only and can
    be downloaded from this site.

    http://bval.apache.org/downloads.html


    Apache BVal 0.5 was the latest version at the time of writing and did not seem
    stable enough. For this apparent reason, I am using Hibernate Validator for the
    accompanying application (app07b).


    As a side note, the following is an important website for everything related to
    Java bean validation.

    http://beanvalidation.org


    With JSR 303, there is no validator to write. Instead, you embed constraints in
    the domain class by using JSR 303 annotation types. The list of constraints is
    given in Table 7.1.


    Once you understand how it works, JSR 303 validation is easier to use than Spring
    validators. With Spring validators, you can overwrite error messages from a JSR
    303 validator by using property keys in this format in your properties file.


    ```

    constraint.object.property

    ```


    For example, to overwrite a message from @Size constraining the name property
    of a Product object, use this key in your properties file.

    Size.product.name


    To overwrite a message from @Past constraining the productionDate property of
    a Product object, use this key.

    Past.product.productionDate'
