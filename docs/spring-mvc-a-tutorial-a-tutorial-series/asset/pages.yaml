  md: "# Chapter 4: Annotation-Based Controllers 87\n\nThe trade-off when using a\
    \ redirect is you cannot easily pass a value to the target page. With a forward,\
    \ you can simply add attributes to the Model object and the attributes will be\
    \ accessible to the view. Since a redirect is a round trip to the server, everything\
    \ in the Model is lost when you redirect. Fortunately, Spring version 3.1 and\
    \ later provide a way of preserving values in a redirect by using flash attributes.\n\
    \nTo use flash attributes you must have an <annotation-driven/> element in your\
    \ Spring MVC configuration file. And then, you must also add a new argument of\
    \ type org.springframework.web.servlet.mvc.RedirectAttributes in your method.\
    \ The method saveProduct in ProductController app04b is reprinted in Listing 4.10.\n\
    \nListing 4.10: Using flash attributes\n\n```\n@RequestMapping(value = \"product_save\"\
    , method = RequestMethod.POST)\npublic String saveProduct(ProductForm productForm,\
