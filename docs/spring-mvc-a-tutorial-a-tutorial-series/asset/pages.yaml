  md: "Therefore, two JARs need to be copied to the WEB-INF/lib directory of your\
    \ application. The CommonsFileUpload JAR will have a name that follows this pattern:\n\
    \n```\ncommons-fileupload-x.y.jar\n```\n\nwhere $x$ is the major version and $y$\
    \ the minor version of the software. For example, the one used in this chapter\
    \ is **commons-fileupload-1.3.jar.\n\nThe name of the Commons IO JAR follows this\
    \ pattern.\n\n```\ncommons-io-x.y.jar\n```\n\nHere, $x$ is the major version and\
    \ $y$ the minor version of the software. For instance, the one used in this chapter\
    \ is **commons-io-2.4.jar.\n\nIn addition, you need to define this **multipartResolver**\
    \ bean in your Spring MVC configuration file:\n\n```\n<bean id=\"multipartResolver\"\
