  md: "The body content is JSP. The list of the forTokens tag’s attributes is given\
    \ in Table 9.7.\n\n| Attribute | Type | Description |\n|---|---|-|\n| var | String\
    \ | The name of the scoped variable that references the current item of the iteration.\
    \ |\n| items+ | String | The string of tokens to iterate over.\n The name of the\
    \ scoped variable that holds the status of the iteration. The value is of type\
    \ javax.servlet.jsp.jstl.core.LoopTagStatus. |\n| begin+ | int | The start index\
    \ of the iteration, where index is zero-based. If specified, begin must be 0 or\
    \ greater. |\n| end+ | int | The end index of the iteration, where index is zero-based.\
    \ |\n| step+ | int | Iteration will process only every step tokens of the string,\
    \ starting with the first one. If specified, step must be 1 or greater. |\n| delims+\
    \ | String | The set of delimiters |\n\nTable 9.7: The forTokens tag’s attributes\n\
    \nHere is an example of forTokens:\n\n```\n<:forTokens var=\"item\" items=\"Argentina,Brazil,Chile\"\
    \ delims=\">\n  <:out value=\"${item}\"/><br/>\n</:forTokens>\n```\n\nWhen pasted\
    \ in a JSP, the preceding forTokens will result in the following:\nArgentina\n\
