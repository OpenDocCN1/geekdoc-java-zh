- img_proc: true
  md: "# 344 Spring MVC: A Tutorial\n\npresent, the given path will be automatically\
    \ included (as in an include directive) at the beginning of each JSP page whose\
    \ URL matches the specified pattern(s).\n\nThe include-coda element is a context-relative\
    \ path that must correspond to an element in the application. When the element\
    \ is present, the given path will be automatically included (as in the include\
    \ directive) at the end of each JSP page in this jsp-property-group element.\n\
    \nFor example, here is a jsp-property-group element that causes evaluation in\
    \ all JSP pages to be ignored.\n\n```\n<jsp-config>\n  <jsp-property-group>\n\
    \    <url-pattern>*.jsp</url-pattern>\n    <el-ignored>true</el-ignored>\n  </jsp-property-group>\n\
    </jsp-config>\n```\n\nAnd, here is a jsp-property-group element that is used to\
    \ enforce script-free JSP pages throughout the application.\n\n```\n<jsp-config>\n\
    \  <jsp-property-group>\n    <url-pattern>*.jsp</url-pattern>\n    <scripting-invalid>true</scripting-invalid>\n\
    \  </jsp-property-group>\n</jsp-config>\n```\n\n# Deployment\n\nDeploying a Servlet/JSP\
    \ application has always been easy since the first version of Servlet. It has\
    \ just been a matter of zipping all application resources in its original directory\
    \ structure into a war file. You can either use the jar tool in the JDK or a popular\
    \ tool such as WinZip. All you need is sure the zipped file has war extension.\
    \ If you're using WinZip, rename the result once it's done."
  merge: -1
  pgno: 351
- img_proc: true
  md: "# Appendix D: The Deployment Descriptors 345\n\nYou must include in your war\
    \ file all libraries and class files as well as HTML files, JSP pages, images,\
    \ copyright notices (if any), and so on. Do not include Java source files. Anyone\
    \ who needs your application can simply get a copy of your war file and deploy\
    \ it in a servlet/JSP container.\n\n# Web Fragments\n\nServlet 3 adds web fragments,\
    \ a new feature for deploying plug-ins or frameworks in an existing web application.\
    \ Web fragments are designed to complement the deployment descriptor without having\
    \ to edit the web.xml file. A web fragment is basically a package (jar file) containing\
    \ the usual web objects, such as servlets, filter and listeners, and other resources\
    \ as JSP pages and static images. A web fragment can also have a descriptor, which\
    \ is an XML document similar to the deployment descriptor. The web fragment descriptor\
    \ must be named web-fragment.xml and reside in the META-INF directory of the package.\
    \ A web fragment descriptor may contain any elements that may appear over the\
    \ web-app element in the deployment descriptor, plus some web fragment-specific\
    \ elements. An application can have multiple web fragments.\n\nListing D.2 shows\
    \ the skeleton of the web fragment descriptor. The text printed in bold highlights\
    \ the difference between it and the deployment descriptor. The root element in\
    \ a web fragment is, surprisingly, web-fragment. The web-fragment element can\
    \ even have the metadata-complete attribute. If the value of the metadata-complete\
    \ attribute is true, annotations in the classes contained there will be skipped.\n\
    \nListing D.2: The skeleton of a web-fragment.xml file\n\n```\n<xml version=\"\
    1.0\" encoding=\"ISO-8859-1\">\n<web-fragment xmlns=\"http://java.sun.com/xml/ns/javaee\"\
    \n    xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\n    xsi:schemaLocation=\"\
    http://java.sun.com/xml/ns/javaee\n    http://java.sun.com/xml/ns/javaee/web-fragment_3_0.xsd\"\
    \n    version=\"3.0\">\n    [metadata-complete=\"true|false\"]\n```"
  merge: -1
  pgno: 352
- img_proc: true
  md: "# 346 Spring MVC: A Tutorial\n\n</web-fragment>\n\nAs an example, the d1 application\
    \ contains a web fragment in a jar file named fragment.jar. The jar file has been\
    \ imported to the WEB-INF/lib directory of d1. The focus of this example is not\
    \ on d1 but rather on the webfragment project, which contains a servlet (fragment.servlet.FragmentServlet,\
    \ printed in Listing D.3) and a web-fragment.xml file (given in Listing D.4).\n\
    \n# Listing D.3: The FragmentServlet class\n\n```\npackage fragment.servlet;\n\
    import java.io.IOException;\nimport java.io.PrintWriter;\nimport javax.servlet.ServletException;\n\
    import javax.servlet.http.HttpServlet;\nimport javax.servlet.http.HttpServletRequest;\n\
    import javax.servlet.http.HttpServletResponse;\n```\n\n```\npublic class FragmentServlet\
    \ extends HttpServlet {\n\n    private static final long serialVersionUID = 940L;\n\
    \n    public void doGet(HttpServletRequest request,\n                        \
    \ HttpServletResponse response)\n        throws ServletException, IOException\
    \ {\n\n        response.setContentType(\"text/html\");\n        PrintWriter out\
    \ = response.getWriter();\n        out.println(\"A plug-in\");\n    }\n}\n```\n\
    \n# Listing D.4: The web fragment descriptor in project webfragment\n\n```\n<?xml\
    \ version=\"1.0\" encoding=\"ISO-8859-1?>\n<web-fragment xmlns=\"http://java.sun.com/xml/ns/javaee\"\
    \nxmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\nxsi:schemaLocationLocation=\"\
    http://java.sun.com/xml/ns/javaee\nhttp://java.sun.com/xml/ns/javaee/web-fragment_3_0.xsd\"\
    \nversion=\"3.0\">\n```"
  merge: -1
  pgno: 353
- img_proc: true
  md: "# Appendix D: The Deployment Descriptor 347\n\n```\n<servlet>\n  <servlet-name>FragmentServlet</servlet-name>\n\
    \  <servlet-class>fragment.servlet.FragmentServlet</servlet-class>\n</servlet>\n\
    <servlet-mapping>\n  <servlet-name>FragmentServlet</servlet-name>\n  <url-pattern>/fragment</url-pattern>\n\
    </servlet-mapping>\n</web-fragment>\n```\n\n**FragmentServlet** is a simple servlet\
    \ that sends a string to the browser. The **web-fragment.xml** file registers\
    \ and maps the servlet. The structure of the **fragment.jar** file is depicted\
    \ in Figure D.1.\n\n![](img/40306dd596a93e2704d63b5edaea0061_354_0.png)\n\nFigure\
    \ D.1: The structure of the fragment.jar file\n\nYou can test the **Fragment**\
    \ servlet by invoking using this URL:\n`http://localhost:8080/d1/fragment`\n\n\
    You should see the output from the **Fragment** servlet.\n\n# Summary\n\nThis\
    \ appendix explained how you can configure and deploy your servlet/JSP applications.\
    \ The appendix started by introducing the directory structure of a typical application\
    \ and then moved to an explanation of the deployment descriptor.\n\nAfter the\
    \ application is ready for deployment, you can deploy it by retaining the files\
    \ and directory structure of your application. Alternatively, you can"
  merge: -1
  pgno: 354
- img_proc: true
  md: package the application into a WAR file and deploy the whole application as
    a single file.
