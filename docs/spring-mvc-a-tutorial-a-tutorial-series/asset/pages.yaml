  md: "# 342 Spring MVC: A Tutorial\n\ntaglib\n\nThe taglib element describes a JSP\
    \ custom tag library. The taglib element contains a taglib-uri element and a taglib-location\
    \ element.\n\nThe taglib-uri element specifies the URI of the tag library used\
    \ in the servlet/JSP application. The value for <taglib-uri> is relative to the\
    \ location of the deployment descriptor.\n\nThe taglib-location element specifies\
    \ the location of the TLD file for the tag library.\n\nThe following is an example\
    \ taglib element.\n\n```\n<jsp-config>\n  <taglib>\n    <taglib-uri>\n      http://brainysoft.com/taglib/complex\n\
    \    </taglib-uri>\n    <taglib-location>/WEB-INF/jsp/complex.tld\n    </taglib-location>\n\
    \  </taglib>\n</jsp-config>\n```\n\n# jsp-property-group\n\nThe jsp-property-group\
    \ element groups a number of JSP files so they can be given global property information.\
    \ You can use subelements under <jsp-property-group> to do the following.\n\n\
    +   - Indicate whether EL is ignored\n- Indicate whether scripting elements are\
    \ allowed\n- Indicate page encoding information\n- Indicate that a resource is\
    \ a JSP document (written in XML)\n- Prelude and code automatic includes\n\nThe\
    \ jsp-property-group element has the following subelements.\n\n+   - an optional\
    \ description element\n- an optional display-name element"
