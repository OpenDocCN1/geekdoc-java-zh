    # The include Directive


    You use the include directive to include the content of another file in the current
    JSP page. You can use multiple include directives in a JSP page. Modularizing
    a particular content into an include file is useful if that content is used by
    different pages or used by a page in different places.


    The syntax of the include directive is as follows:

    <%@ include file="url" %>


    where the space between @ and include is optional and url represents the relative
    path to an include file. If url begins with a forward slash (/), it is interpreted
    as an absolute path on the server. If it does not, it is interpreted as relative
    to the current JSP page.


    The JSP translator translates the include directive with the content of the include
    file. In other words, if you have written copyright.jsp file in Listing C.4.


    Listing C.4: The copyright.jsp file Include file


    ```

    <hr/>

    &copy;2012 BrainySoftware

    <hr/>

    ```


    And, you have the main.jsp page in Listing C.5.


    Listing C.5: The main.jsp page


    ```

    <html>

    <head><title>Including a file</title></head>

    <body>

    This is the included content: <hr/>

    ```'
