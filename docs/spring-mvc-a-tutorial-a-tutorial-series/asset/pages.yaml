  md: '# # Chapter 11

    File Upload


    Once upon a time not long after Servlet technology had emerged, file upload programming
    was still a challenging task that involved parsing raw HTTP responses on the server
    side. To alleviate the pain, developers would resort to commercial file upload
    components, some of which cost an arm and a leg. Fortunately, in 2003 the Apache
    Software Foundation released its open source Commons FileUpload component, which
    soon became a hit with servlet/JSP programmers worldwide.


    It took years before the designers of Servlet realized that file upload was essential,
    but file upload was finally a built-in feature in Servlet 3. Servlet 3 developers
    do not have to import the Commons FileUpload component into their projects anymore.


    As such, there are two methods for handling file upload in Spring MVC:


    +   1. By using Apache Commons FileUpload component.

    2. By taking advantage of Servlet 3.0 or later built-in support. You can only
    use this approach if you deploy your application to a container that supports
    Servlet 3.0 or later.


    No matter which approach you choose, you''ll be using the same API to handle the
    uploaded files. This chapter shows how to make use of the Commons FileUpload and
    Servlet 3 file upload feature in a Spring MVC application that need support for
    file upload. In addition, it also demonstrates how you can enhance user experience
    with HTML 5.'
  merge: -1
  pgno: 230
- img_proc: true
  md: "# Client Side Programming\n\nTo upload a file, you must set the value of the\
    \ enctype attribute of your HTML form with multipart/form-data, like this:\n\n\
    ```\n<form action=\"action\" enctype=\"multipart/form-data\" method=\"post\">\n\
    \  Select a file <input type=\"file\" name=\"fieldName'/>\n  <input type=\"submit\"\
    \ value=\"Upload\"/>\n</form>\n```\n\nThe form must contain an input element of\
    \ type file, which will be rendered as a button that, when clicked, opens a dialog\
    \ to select a file. The form may also contain other field types such as a text\
    \ area or a hidden field.\n\nPrior to HTML 5, if you wanted to upload multiple\
    \ files, you had to use multiple file input elements. HTML 5, however, makes file\
    \ uploads simpler by introducing the multiple attribute in the input element.\
    \ You can write one of the following in HTML 5 to generate a button for selecting\
    \ multiple files:\n\n```\n<input type=\"file\" name=\"fieldName\" multiple/>\n\
    <input type=\"file\" name=\"fieldName\" multiple=\"multiple\"/>\n<input type=\"\
    file\" name=\"fieldName\" multiple=\"\">\n```\n\n# The MultipartFile Interface\n\
    \nHandling uploaded files is very easy in Spring MVC. A Spring MVC application\
    \ will be wrapped in a MultipartFile object. Your only responsibility is to write\
    \ a domain class with a property of type MultipartFile.\n\nThe org.springframework.web.multipart.MultipartFile\
    \ interface has the following methods:\n\n```\nbyte[] getBytes()\n```\n\nReturns\
    \ the contents of the file as an array of bytes."
