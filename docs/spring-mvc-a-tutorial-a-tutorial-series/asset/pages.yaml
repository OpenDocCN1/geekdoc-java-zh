  md: "# Appendix C: JavaServer Pages 321\n\n# useBean\n\nThis action creates a scripting\
    \ variable associated with a Java object. It was one of the earliest efforts to\
    \ separate presentation and business logic. Thanks to other technologies such\
    \ as custom tags and the Expression Language, useBean is rarely used.\n\nAs an\
    \ example, the useBeanTest.jsp page in Listing C.9 creates an instance of java.util.Date\
    \ and associates it with scripting variable today, which we then used in an expression.\n\
    \n# Listing C.9: The useBeanTest.jsp page\n\n```\n<html>\n<head>\n  <title>useBean</title>\n\
    </head>\n<body>\n  <jsp:useBean id=\"today\" class=\"java.util.Date\"/>\n  <%=today%>\n\
    </body>\n</html>\n```\n\nThe action will be translated into this code in Tomcat.\n\
    \n```\njava.util.Date today = null;\ntoday = (java.util.Date) _jspx_page_context.getAttribute(\"\
    today\",\n      javax.servlet.jsp.PageContext.REQUEST_SCOPE);\nif (today == null)\
    \ {\n  today = new java.util.Date();\n  _jspx_page_context.setAttribute(\"today\"\
    , today,\n      javax.servlet.jsp.PageContext.REQUEST_SCOPE);\n}\n\n```\n\nRunning\
    \ this page prints the current date and time in your browser.\n\n# setProperty\
