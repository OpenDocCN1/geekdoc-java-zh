  md: "# Appendix D: The Deployment Descriptor ###\n\nDefining run-as overrides the\
    \ security identity for calling an Enterprise JavaBean by that servlet in this\
    \ application. The role name is one of the security roles defined for the current\
    \ web application.\n\nThe security-role-ref element maps the name of the role\
    \ called from a servlet using UserInRole(name) to the name of a security role\
    \ defined for the application. The security-role-ref element contains an optional\
    \ description element, a role-name element, and a role-link element.\n\nThe role-link\
    \ element is used to link a security role reference to a defined security role.\
    \ The role-link element must contain the name of the security roles defined in\
    \ the security-role elements.\n\nThe async-supported element is an optional element\
    \ that can have a true or false value. It indicates whether or not this servlet\
    \ supports asynchronous processing.\n\nThe enabled element is also an optional\
    \ element whose value is true or false. Setting this element to false disables\
    \ this servlet.\n\nFor example, to map the security role reference \"PM\" to the\
    \ security role with role-name \"payingMember,\" the syntax would be as follows.\n\
    \n```\n<security-role-ref>\n  <role-name>PM</role-name>\n  <role-link>payingMember</role-link>\n\
    </security-role-ref>\n```\n\nIn this case, if the servlet invoked by a user belonging\
    \ to the \"payingMember\" security role calls UserInRole(\"payingMember\"), the\
    \ result would be true.\n\nThe following are two servlet elements:\n\n```\n<servlet>\n\
    \  <servlet-name>UploadServlet</servlet-name>\n  <servlet-class>com.brainisoftware.UploadServlet</servlet-class>\n\
    \  <load-on-startup>10</load-on-startup>\n</servlet>\n<servlet>\n  <servlet-name>SecureServlet</servlet-name>\n\
    \  <servlet-class>com.brainisoftware.SecureServlet</servlet-class>\n  <load-on-startup>20</load-on-startup>\n\
    ```\n\n![](img/40306dd596a93e2704d63b5edaea0061_346_0.png)"
