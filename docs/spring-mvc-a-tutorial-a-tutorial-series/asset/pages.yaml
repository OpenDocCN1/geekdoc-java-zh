  md: "# Appendix C: JavaServer Pages 323\n\n# include\n\nThe include action is used\
    \ to include another resource dynamically. You can include another JSP page, a\
    \ servlet, or a static HTML page. For example, the jspIncludeTest.jsp page in\
    \ Listing C.12 uses the include action to include the menu.jsp page.\n\nListing\
    \ C.12: The jspIncludeTest.jsp page\n\n```\n<head>\n<title>Include action</title>\n\
    </head>\n<body>\n<jsp:include page=\"jspf/menu.jsp\">\n  <jsp:param name=\"text\"\
    \ value=\"How are you?\"/>\n</jsp:include>\n</body>\n\n```\n\nIt is important\
    \ that you understand the difference between the include directive and the include\
    \ action inclusion occurs at page translation time, i.e. when the JSP container\
    \ translates the page into a generated servlet. With the include action, inclusion\
    \ occurs at request time. As such, you can pass parameters using the include action,\
    \ but not the include directive.\n\nThe second difference is that with the include\
    \ directive, the file extension of the included resource does not matter. With\
    \ the include action, the file extension must be jsp for it to be processed as\
    \ a JSP page. Using jsp in the include action, for example, will make the JSP\
    \ segment be treated as a static file.\n\n# forward\n\nThe forward action forwards\
    \ the current page to a different resource. For example, the following forward\
    \ action forwards the current page to the login.jsp page.\n\n```\n<jsp:forward\
    \ page=\"jspf/login.jsp\">\n```"
