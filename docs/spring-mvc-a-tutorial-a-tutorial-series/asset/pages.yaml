  md: "# 328 Spring MVC: A Tutorial\n\n+   - You want to restrict access to a resource\
    \ collection and provide a way for the user to authenticate themselves.\n\nListing\
    \ D. 1 shows the skeleton of the deployment descriptor. It must be named web.xml\
    \ and reside in the WEB-INF directory of the application directory.\n\n# Listing\
    \ D.1: The skeleton of the deployment descriptor\n\n```\n<?xml version=\"1.0\"\
    \ encoding=\"ISO-8859-1\"?>\n<web-app xmlns=\"http://java.sun.com/xml/ns/javaee\"\
    \nxmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\n  xsi:schemaLocation=\"\
    http://java.sun.com/xml/ns/javaee/web-app_3_0.xsd\"\nhttp=\"http://java.sun.com/xml/ns/javaee\"\
    \nversion=\"3.0\">\n[metadata-complete=\"true|false\"]\n\n...\n</web-app>\n```\n\
    \nThe xsi:schemaLocation attribute specifies the location of the schema against\
    \ the deployment descriptor can be validated. The version attribute specifies\
    \ the version of the Servlet specification.\n\nThe optional metadata-complete\
    \ attribute specifies whether the deployment descriptor is complete. If its value\
    \ is true, the servlet/JSP container must ignore servlet-specific annotations.\
    \ If this element is set to false or if it's not present, the container must examine\
    \ the class files deployed with the application for servlet-specific annotations\
    \ and scan for web fragments.\n\nThe web-app element is the root element and can\
    \ have subelements for specifying:\n\n+   - servlet declarations\n- servlet mappings\n\
    - ServletContext initial parameters\n- session configuration\n- listener classes"
