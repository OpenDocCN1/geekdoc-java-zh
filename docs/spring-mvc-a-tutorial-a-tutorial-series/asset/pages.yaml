  md: "# Appendix A: Tomcat 26\n\n```\n<Context docBase=\"C:/apps/commerce\" reloadable=\"\
    true\"/>\n```\n\nThe only required attribute docBase, which specifies the location\
    \ of the application. The reloadable attribute is optional, but if it is present\
    \ and its value is set to true, Tomcat will monitor the application for any addition,\
    \ deletion, or update of a Java class file or other resources. When such a change\
    \ is detected, Tomcat will reload the application. Setting reloadable to true\
    \ is recommended during development but not in production.\n\nWhen you add a context\
    \ file to the specified directory, Tomcat will automatically load the application.\
    \ When you delete it, Tomcat will unload the application.\n\nAnother way of defining\
    \ a context is by adding a Context element in the conf/server.xml file. To do\
    \ this, open the file and create a Context element under the Host element. Unlike\
    \ the previous method, defining a context requires that you specify the path attribute\
    \ for your context path. Here is an example:\n\n```\n<Host name=\"localhost\"\
    \ appBase=\"webapps\" unpackWARs=\"true\"\n  autoDeploy=\"true\">\n\n<Context\
    \ path=\"/commerce\"\n  docBase=\"C:/apps/commerce\"\n  reloadable=\"true\"\n\n\
    </Host>\n```\n\nGenerally, managing contexts through server.xml is not recommended\
    \ as updates will only take effect after you restart Tomcat. However, if you have\
    \ a bunch of applications that you need to test quickly, you may find working\
    \ with server.xml almost ideal as you can manage all your applications in a single\
    \ file.\n\nFinally, you can also deploy an application implicitly by copying the\
    \ whole application to Tomcat's webapps directory.\n\nMore information on Tomcat\
    \ contexts can be found here:\nhttp://tomcat.apache.org/tomcat-8.0-doc/config/context.html"
