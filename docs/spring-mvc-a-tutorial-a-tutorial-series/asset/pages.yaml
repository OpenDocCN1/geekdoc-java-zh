    # The set Tag


    You can use the set tag to do the following.


    +   1. Create a string and a scoped variable that references the string.

    2. Create a scoped variable that references an existing scoped object.

    3. Set the property of a scoped object.


    If set is used to create a scoped variable, the variable can be used throughout
    the same JSP page after the occurrence of the tag.


    The set tag''s syntax has four forms. The first form is to create a scoped variable
    in which the value attribute specifies the string to be created or an existing
    scoped object.


    ```

    <c:set value="value", var="varName"

    [scope="page|request|session|application"]/>

    ```


    where the scope attribute specifies the scope of the scoped variable.


    For instance, the following set tag creates the string "The wisest fool" and assigns
    it to the newly created page-scoped variable foo.


    ```

    <c:set var="foo" value="The wisest fool"/>

    ```


    The following set tag creates a scoped variable job that references the request-scoped
    object position. The variable job has a page scope.


    ```

    <c:set var="job" value="${requestScope.position}" scope="page"/>

    ```


    # Note


    The last example might be a bit confusing because it created a page-scoped variable
    position. This should not be so if you bear in mind that the scoped object itself
    is not really "inside" the HttpServlet. Instead, a reference (named position)
    exists with the set tag in the last example, you were simply creating another
    scoped variable (job) that referenced the same object.'
