    # Converting Chinese Characters to Unicode


    In the Chinese language, 你好 (meaning hello, represented by the Unicode codes 4f60
    and 597d, respectively) and 再见 (meaning good bye is represented by Unicode codes
    518d and 89c1, respectively) are the most common expressions. Of course, no one
