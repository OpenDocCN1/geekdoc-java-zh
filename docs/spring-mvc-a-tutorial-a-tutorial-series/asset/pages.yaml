  md: 'The web-resource-collection element identifies a collection of resources to
    which access needs to be restricted. In it you can define the URL pattern(s) and
    the restricted HTTP method or methods. If no HTTP method is present, the security
    constraint applies to all HTTP methods.


    The auth-constraint element specifies the user roles that should have access to
    the resource collection. If no auth-constraint element is specified, the security
    constraint applies to all roles.


    The user-data-constraint element is used to indicate how data transmitted between
    the client and servlet/JSP container must be protected.


    The web-resource-collection element contains a web-resource-name element, an optional
    description element, zero or more url-pattern elements, and zero or more http-method
    elements.


    The web-resource-name element contains a name associated with the protected resource.


    The http-method element can be assigned one of the HTTP methods, such as GET,
    POST, or TRACE.


    The auth-constraint element contains an optional description element and zero
    or more role-name element. The role-name element contains the name of a security
    role.


    The user-data-constraint element contains an optional description element and
    a transport-guarantee element must have one of the following values: NONE, INTEGRAL,
    or CONFIDENTIAL. NONE indicates that the application does not require transport
    guarantees. INTEGRAL means that the data between the server and the client should
    be sent in such a way that it can''t be changed in transit. CONFIDENTIAL means
    that the data transmitted must be encrypted. In most cases, Secure Sockets Layer
    (SSL) is used for either INTEGRAL or CONFIDENTIAL.


    The following example uses a security-constraint element to restrict access to
    any resource with a URL matching the pattern /members/*. Only a user in the payingMember
    role will be allowed access. The login-config'
