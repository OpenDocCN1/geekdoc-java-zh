    # # The errors tag


    The **errors** tag renders one or more HTML `span` element that each contains
    a field error message. This tag can be used to display a specific field error
    or all field errors.


    The attributes of the **errors** tag are listed in Table 5.14. All attributes
    are optional and the table does not include HTML attributes that may appear in
    the HTML `span` elements.


    For example, this **errors** tag displays all field errors.


    ```

    <form:errors path="*"/>

    ```


    The following **errors** tag displays a field error associated with the **author**
    property of the form-backing object.


    ```

    <form:errors path="author"/>

    ```'
