  md: '# Appendix C: JavaServer 311


    ```

    <%@ page attribute1="value1" attribute2="value2" ... %>

    ```


    The space between @ and page is optional and attribute1, attribute2, and so on
    on the page directive''s attributes. Here is the list of attributes for the page
    directive.


    +   * import. Specifies a Java type or Java types that will be imported and usable
    by the Java code in this page. For example, specifying import="java.util.List"
    imports the List interface. You can use the wildcard * to import the whole package,
    such as in import="java.util.". To import multiple types, separate two types with
    a comma, java.util.ArrayList, java.util.Calendar, java.io.PrintWriter. All types
    in the following packages are implicitly imported: java.lang, javax.servlet, javax.servlet.http,
    javax.servlet.jsp.\n* session. A value of true indicates that this page participates
    in session management, and a value of false indicates otherwise. By default, the
    value is true, which means the invocation of a JSP page will cause a javax.servlet.http.HttpSession
    instance to be created if one does not exist yet.

    * buffers. Specifies the buffer size of the out implicit object in kilobytes.
    The suffix kb is mandatory. The default buffer size is 8kb or more, depending
    on the JSP container. It is also possible to assign none to this attribute to
    indicate that no buffering should be used, which will cause the output to be written
    directly to the corresponding PrintWriter.

    * autoFlush. A value of true, the default value, indicates that the buffered output
    should be flushed automatically when the buffer is full. A value of false indicates
    that the buffer is only flushed if the flush method of the response object is
    called. Consequently, an exception will be thrown in the event of buffer overflow.

    * isThreadSafe. Indicates the level of thread safety implemented in the page.
    JSP authors are advised against using this attribute as it could result in a generated
    servlet containing deprecated code.

    * info. Specifies the return value of the getServletInfo method of the generated
    servlet.'
  merge: -1
