  md: "# Chapter 11: File Upload 235\n\nIf you look into the image directory under\
    \ the application directory, you'll see the uploaded image.\n\n# File Upload with\
    \ Servlet 3 or Later\n\nWith Servlet 3, you don't need the duo Commons FileUpload\
    \ and Commons IO components. Server side file upload programming in Servlet 3\
    \ and later containers centers serve around the MultipartConfig annotation type\
    \ and the javax.servlet.http.Part interface. Servlets that handle uploaded files\
    \ must be annotated @MultipartConfig.\n\nThe following are attributes that may\
    \ appear in the MultipartConfig annotation type. All attributes are optional.\n\
    \n+   - maxSize: The maximum size for uploaded files. Files larger than the specified\
    \ value will be rejected. By default, the value of maxFileSize is -1, which means\
    \ unlimited.\n- maxRequestSize: The maximum size allowed for multipart HTTP requests.\
    \ By default, the value is -1, which translates into unlimited.\n- location: The\
    \ same location where the uploaded file is saved to disk by calling the write\
    \ method on the Part.\n- fileSizeThreshold: The size threshold after which the\
    \ uploaded file will be written to disk.\n\nThe Spring MVC DispatcherServlet handles\
    \ most or all requests. Unfortunately, you cannot annotate the servlet without\
    \ changing the source code. Fortunately, there is an easier way to make a MultipartConfig\
    \ servlet in Servlet 3: by passing values to the servlet declaration in the deployment\
    \ descriptor (the web.xml file). The following has the same effect as annotating\
