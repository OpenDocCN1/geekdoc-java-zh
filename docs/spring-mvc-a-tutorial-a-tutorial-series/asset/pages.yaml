  md: '# # Chapter 4

    Annotation-Based Controllers


    In Chapter 3, “Introduction to Spring MVC” you built two simple Spring MVC applications
    using some old style controllers. The controllers were classes that implemented
    the **Controller** interface. Spring 2.5 introduced a new way of creating controllers:
    by using the **Controller** annotation type.


    This chapter discusses annotation-based controllers and the various annotation
    types that can be beneficial to your applications.


    # ## Spring MVC Annotation Types


    There are several advantages of using annotation-based controllers. For one, a
    controller class can handle multiple actions. (By contrast, a controller that
    implements the **Controller** interface can only handle one action.) This means,
    related actions can be written in the same controller class, reducing the number
    of classes in your application.


    Secondly, with annotation-based controllers request mappings do not need to be
    stored in a configuration file. Using the `RequestMapping` annotation type, a
    method can be annotated to make it a request-handling method.


    **Controller** and **RequestMapping** annotation types are two most important
    annotation types in the Spring MVC API. This chapter focuses on these two and
    briefly touches on some other less popular annotation types.'
  merge: -1
  pgno: 74
- img_proc: true
  md: "# The Controller Annotation Type\n\nThe **org.springframework.stereotype.Controller**\
    \ annotation type is used to annotate a Java class to indicate to Spring that\
    \ instances of the class are controllers. Here is an example of a class annotated\
    \ with `@Controller`.\n\n```\npackage com.example.controller;\n\nimport org.springframework.stereotype;\n\
    ...\n@Controller\npublic class CustomerController {\n    // request-handling methods\
    \ here\n}\n```\n\nSpring uses a scanning mechanism to find all annotation-based\
    \ controller classes in an application. To ensure Spring can find your controllers,\
    \ there are two things you need to do. First, you need to declare the **spring-context**\
    \ schema in your Spring MVC configuration file, like so:\n\n```\n...\n<xmlns:context=\"\
    http://www.springframework.org/schema/context\"\n...\n```\n\nSecond, you need\
    \ to use a `<component-scan/>` element in your configuration file:\n\n```\ncontext:component-scan\
    \ base-package=\"basePackage\"/\n```\n\nIn your `<component-scan/>` element, specify\
    \ the base package of your controller classes. For example, if you put all your\
    \ controller classes under **com.example.controller** and its subpackages, you\
    \ need to write a `<component-scan/>` element like so.\n\n```\ncontext:component-scan\
    \ base-package=\"com.example.controller\"/\n```\n\nIntegrating `<component-scan/>`,\
    \ your configuration file would look like this:"
  merge: -1
