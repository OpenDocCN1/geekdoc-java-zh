    The following formatDate tags are used to format dates and times using custom
    patterns.

    <fmt:formatDate type="both" value="${now}" pattern="dd.MM.yy"/>

    <fmt:formatDate type="both" value="${now}" pattern="dd.MM.yyyy"/>


    # The timezone Tag


    The timezone tag is used to specify the time zone in which time information is
    to be formatted or parsed in its body content. The syntax is as follows:

    <fmt:timezone value="timezone">

    body content

    </fmt:timezone>


    The body content is JSP. The attribute value can be passed a dynamic value of
    type String or java.util.TimeZone. The values for US and Canada time zones are
    given in Table 9.14.

    If the value attribute is null or empty, the GMT time zone is used.

    The following example uses the timezone tag to format dates with time zones.'
