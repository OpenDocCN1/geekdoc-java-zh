    suffix\" value=\".jsp\"/>\n</bean>\n</beans>\n```\n\nThe main thing in the Spring\
    \ MVC configuration file in Listing 4.2 is the presence of a <component-scan>\
    \ element. It is to tell Spring MVC to scan classes under a certain package, in\
    \ this case the app04a.controller package. On top of that, there are also <annotation-driven/>\
    \ element and two <resources/> elements. The <annotation-driven/> element does\
    \ several things, including registering beans to support request processing with\
    \ annotated controller methods. The <resources/> element tells Spring MVC which\
    \ static resources are to be served independently from the dispatcher servlet.\n\
    \nIn the configuration file in Listing 4.2 there are two <resources/> elements.\
    \ The first makes sure that all files in the /css directory will be visible. The\
    \ second allows displaying of all .html files in the application directory.\n\n\
