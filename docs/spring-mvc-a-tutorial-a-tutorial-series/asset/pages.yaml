  md: '# Chapter 8: The Expression Language 155


    However, you can only use the [] operator if propertyName is not a valid Java
    variable name. For instance, the following two EL expressions can be used to access
    the HTTP header host in the implicit object header.


    ```

    ${header("host")}

    ${header.host}

    ```


    However, to access the accept-language header, you can only use the || operator
    because accept-language is not a Java variable name. Using the . operator to access
    it will cause an exception to be thrown.


    If an object''s property happens to return another object that in turn has a property,
    you can use either [] or . to access the property of the second object. For example,
    the pageContext implicit object represents the PageContext object of the current
    JSP. It has the request property, which represents the HttpServletRequest has
    the servletPath property. The following expressions are equivalent and result
    in the value of the servletPath property of the HttpServlet in pageContext:


    ```

    ${{pageContext["request"]["servletPath"]}

    ${pageContext.request["servletPath"]}

    ${pageContext.request.servletPath}

    ${pageContext["request"].servletPath}

    ```


    To access the HTTPSession, use this syntax:


    ```

    ${pageContext.session}

    ```


    For example, this expression prints the session identifier.


    ```

    ${pageContext.session.id}

    ```


    # The Evaluation Rule


    An EL expression is evaluated from left to right. For an expression of the form
    expr-a[expr-b], here is how the EL expression is evaluated:


    +   1. Evaluate expr-a to get value-a.

    2. If value-a is null, return null.

    3. Evaluate expr-b to get value-b.

    4. If value-b is null, return null.'
