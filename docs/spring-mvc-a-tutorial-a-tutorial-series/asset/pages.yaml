    # Working with HTML Forms


    A web application almost always contains one or more HTML forms to take user input.
    You can easily send an HTML form from a servlet to the browser. When the user
    submits the form, values entered in the form elements are sent to the server as
    request parameters.


    The value of an HTML input field (a text field, a hidden field, or a password
    field) or text area is sent to the server as a string. An empty input field or
    text area sends an empty string. As such, ServletRequest.getParameter that takes
    an input field name never returns null.


    An HTML select element also sends a string to the header. If none of the options
    in the select element is selected, the value of that is sent.


    A multiple-value select element (a select element that allows multiple selection
    and is indicated by <select multiple>) sends a string array and has to be handled
    by ServletRequest.getParameterValues.'
