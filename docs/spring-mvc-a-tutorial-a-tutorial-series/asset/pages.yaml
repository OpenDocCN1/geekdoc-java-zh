  md: '# Dependency Injection with @Autowired and @Service


    One of the benefits of using the Spring Framework is that you get dependency injection
    for free. After all, Spring started as a dependency injection container. The easiest
    way to get a dependency injected to a Spring MVC controller is by annotating a
    field or a method with @Autowired. The Autowired annotation type belongs to the
    org.springframework.beans.factory.annotation package.


    In order for a dependency to be found, its class must be annotated with @Service.
    A member of the org.springframework.stereotype package, the Service annotation
    type indicates that the annotated class is a service. In addition, in your configuration
    file you need to add a <component-scan/> element to scan the base package for
    your dependencies.


    ```

    <context:component-scan base-package="dependencyPackage"/>

    ```


