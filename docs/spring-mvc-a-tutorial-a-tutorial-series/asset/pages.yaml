  md: '# Appendix D: The Deployment Descriptor 343


    +   - an optional icon element

    - one or more url-pattern elements

    - an optional el-ignored element

    - an optional page-encoding element

    - an optional scripting-invalid element

    - an optional is-xml element

    - zero or more include-prelude elements

    - zero or more include-code elements


    The url-pattern element is used to specify a URL pattern that will be affected
    by the property settings.


    The el-ignored element can have a boolean value of true or false. A value of true
    means the EL expressions will not evaluated in the JSP pages whose URL match the
    specified URL pattern(s). The default value of this element is false.


    The page-encoding element specifies the encoding for the JSP pages whose URL match
    the specified pattern(s). The valid value for page-encoding is the same as the
    value of the pageEncoding attribute of the page directive used in a matching JSP
    page. There will be a translation-time error to name a different encoding in the
    pageEncoding attribute of the page directive used in a JSP page and in a JSP configuration
    element matching the page. It is also a translation-time error to name a different
    encoding in the prolog or text declaration of a document in XML syntax and in
    a JSP configuration element matching the document. It is legal to name the same
    encoding through multiple mechanisms.


    The scripting-invalid element accepts a boolean value. A value of true means that
    scripting is not allowed in the JSP pages whose URLs match the specified pattern(s).
    By default, the value of the scripting-invalid element is false.


    The is-xml element accepts a boolean value and true indicates that the JSP pages
    whose URLs match the specified pattern(s) are JSP documents.


    The include-prelude element is a context-relative path that must correspond to
