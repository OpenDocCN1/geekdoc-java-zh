- img_proc: true
  md: '# Spring MVC


    This book is an easy to follow tutorial on Spring MVC, a modern web application
    framework that is part of the Spring Framework. The MVC in Spring MVC stands for
    Model-View-Controller, a design pattern widely used in Graphical User Interface
    (GUI) development. This pattern is not only common in web development, but is
    also used in desktop technology like Java Swing. Sometimes called Spring Web,
    Spring MVC is one of the most popular web frameworks today and a most sought-after
    skill.


    Here are some of the topics covered in this book:


    +   - Introduction to Spring

    - Servlet and JSP

    - The MVC pattern

    - Controllers

    - Data binding

    - The Form Tag Library

    - Converters

    - Formatters

    - Validators

    - The Expression Language

    - JSTL

    - Internationalization

    - File upload and file download


    This book is for you if you want to learn how to develop Java-based web applications
    with Spring MVC.


    # About the author


    Paul Deck is a software developer and technical architect at Brainy Software.
    He is the co-author of How Tomcat Works: A Guide to Developing Your Own Java Servlet
    Container.


    ![](img/40306dd596a93e2704d63b5edaea0061_371_0.png)


    $ 39.99 USD

    $ 49.99 CAD'
