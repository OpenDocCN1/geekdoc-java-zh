    # servlet-mapping


    The servlet-mapping element maps a servlet to a URL pattern. The servlet-mapping
    element must have a servlet-name element and a url-pattern element.


    The following servlet-mapping element maps a servlet with the URL pattern /first.


    ```

    <servlet>

    <servlet-name>FirstServlet</servlet-name>

    <servlet-class>com.brainysoftware.FirstServlet</servlet-class>

    </servlet>

    <servlet-mapping>

    <servlet-name>FirstServlet</servlet-name>

    <url-pattern>first</url-pattern>

    </servlet-config>

    ```


    # session-config


    The session-config element defines parameters for javax.servlet.HttpSession instances.
    This element may contain one or more of the following elements: session-timeout,
    cookie-config, or tracking-mode.


    The session-timeout element specifies the default session timeout interval in
    minutes. This value must be an integer. If the value of the session-timeout element
    is zero or a negative number, the session will never time out.


    The cookie-config element defines the configuration of the session tracking cookies
    created by this servlet/JSP application.


    The tracking-mode element defines the tracking mode for sessions created by this
    web application. Valid values are COOKIE, URL, or SSL.


    The following session-config element causes the HttpSession objects in the current
    application to be invalidated after twelve minutes of inactivity.


    ```

    <session-config>

    ```'
