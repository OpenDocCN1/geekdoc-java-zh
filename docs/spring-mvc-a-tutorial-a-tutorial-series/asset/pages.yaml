    \ class. To override init, declare a jspInit method. To override destroy, declare\
    \ a jspDestroy method. The two methods are explained below.\n\n+   jspInit. This\
    \ method is similar to the init method in javax.servlet. jspInit is invoked when\
    \ the JSP page is initialized. Unlike the init method, jspInit does not take arguments.\
    \ You can still obtain the ServletConfig object through the config implicit object.\n\
    \n+   jspDestroy. This method is similar to the destroy method in Servlet and\
