  md: '# Servlet


    The Servlet interface defines these five methods.


    ```

    void init(ServletConfig config) throws ServletException

    ```


    ```

    void service(ServletRequest request, ServletResponse response)

    throws ServletException, java.io.IOException

    ```


    ```

    void destroy()

    ```


    ```

    java.lang.String getServletInfo()

    ```


    ```

    ServletConfig getServletConfig()

    ```


    Note that the convention for writing a Java method signature is to use the fully-qualified
    name for types that are not in the same package as the type containing the method.
    As such, in the signature of the service method javax.servlet.ServletException,
    which is in the same package as Servlet, is written without the package information
    whereas java.io.IOException is written fully.


    **init, service, and destroy** are lifecycle methods. The servlet container invokes
    these three methods according to these rules.


    +   **init.** The servlet container invokes this method the first time the servlet
    is requested. This method is not called at subsequent requests. You use this method
    to write initialization code. When invoking the method, the servlet container
    passes a ServletConfig. Normally, you will assign the ServletConfig to a class
    level variable so that this object can be used from other points in the servlet
    class.


    +   **service.** The servlet container invokes this method each time the servlet
    is requested. You write the code that the servlet is supposed to do here. Here
    the first time the servlet is requested, the servlet container calls the init
    method and the service method. For subsequent requests, only service is invoked.


    +   **destroy.** The servlet container invokes this method when the servlet is
    to be destroyed. This occurs when the application is unloaded or when the servlet
    container is being shut down. Normally, you write clean-up code in this method.'
  merge: -1
  pgno: 276
- img_proc: true
  md: 'The other two methods in Servlet are non-life cycle methods:

    getServletInfo and getServletConfig.


    +   - getServletInfo. This method returns any string that might be useful or even
    null.

    - getServletConfig. This method returns the ServletConfig passed by the servlet
    container to the init method. In order for getServletConfig to return a non-null
    value, you must have assigned the ServletConfig passed to the init method to a
    class level variable.

    ServletConfig is explained in the section "ServletConfig" in this chapter.


    An important point to note is thread safety. A servlet instance is shared by all
    users in an application, so class-level variables are not recommended, unless
    they are read-only or members of the java.util.concurrent.atomic package.


    The next section, “Writing A Basic Servlet Application,” shows how you can write
    a Servlet Implementation.


    # Writing A Basic Servlet Application


    Writing a servlet application is surprisingly easy. All you have to do is create
    a directory structure and place your servlet classes in a certain directory. In
    this section you''ll learn how to write a simple servlet application named b1.
    Initially it will contain one servlet, MyServlet, which sends a greeting to the
    user.


    You need a servlet container to run your servlets. Tomcat, an open source servlet
    container, is available free of charge and runs on any platform where Java is
    available. You should now read Appendix A and install Tomcat if you have not done
    so.'
