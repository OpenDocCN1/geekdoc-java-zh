  md: "```\n@Override\npublic Book get(long id) {\n    for (Book book : books) {\n\
    \        if (id == book.getId()) {\n            return book;\n        }\n    }\n\
    \    return null;\n}\n```\n\n```\n@Override\npublic Book update(Book book) {\n\
    \    int bookCount = books.size();\n    for (int i = 0; i < bookCount; i++) {\n\
    \        Book savedBook = books.get(i);\n        if (savedBook.getId() == book.getId())\
    \ {\n            books.set(i, book);\n        }\n    }\n    return book;\n}\n\
    ```\n\n```\n@Override\npublic long nextId() {\n    // needs to be locked\n   \
    \ long id = 0L;\n    for (Book book : books) {\n        long bookId = book.getId();\n\
    \        if (bookId > id) {\n            id = bookId;\n        }\n    }\n    return\
    \ id + 1;\n}\n```\n\nThe **ServiceImpl** class contains a **List** of **Book**\
