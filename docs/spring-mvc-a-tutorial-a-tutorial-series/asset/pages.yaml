  md: '# # Chapter 7

    # Validators


    Input validation is one of the most important web development tasks that Spring
    handles extremely well. There are two ways you can validate input in Spring MVC,
    by using Spring’s own validation framework or by utilizing a JSR 303 implementation.
    This chapter covers both methods of input validation.


    # ## Validation Overview


    Converters and formatters work on the field level. In an MVC application, they
    convert or format a String to another Java type, such as a `java.util.Date`. A
    validator, on the other hand, works on the object level. It determines whether
    or not all fields in an object are valid and some rules are followed.


    The sequence of events in an application that employs both formatters and validators
    goes like this: During the invocation of a controller, one or more formatter will
    try to convert input strings to field values in the domain object. Once formatting
    is successful, the validators step in.


    For example, an `Order` object may have a `shippingDate` property of type `Date`,
    (obviously) whose value cannot be earlier than today’s date. When the `HomeController`
    is invoked, a `DateFormatter` will convert a string to a `Date` and assign it
    to the `shippingDate` property of the `Order` object. If the conversion failed,
    the user will be redirected to the previous form. If the conversion was successful,
    a validator will be invoked to check if `shippingDate` is earlier than today.


    Now, you may ask if it is wise to move the validation logic to the `DateFormatter`.
    After all, it is not hard to compare dates. The answer is no.'
