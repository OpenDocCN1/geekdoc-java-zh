    # Model 2 with A Servlet Controller


    This section presents a simple Model 2 application to give you a general idea
    of what a Model 2 application looks like. In real life, Model 2 applications are
    far more complex than this.


    The application can be used to enter product information and is named app02a.
    The user fills in a form like the one in Figure 2.2 and submits it. The application
    then sends a confirmation page to the user and display the details of the saved
    product. (See Figure 2.3)


