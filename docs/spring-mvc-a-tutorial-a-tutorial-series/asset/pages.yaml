  md: "# Scriptlets\n\nA scriptlet is a block of Java code. A scriptlet starts with\
    \ <% and ends with %>. For example, the scriptletTest.jsp page in Listing C.6\
    \ uses scriptlets.\n\nListing C.6: Using a scriptlet (scriptletTest.jsp)\n\n```\n\
    <@page import=\"java.util.Enumeration\">\n<html>\n<head><title>Scriptlet example</title></head>\n\
    <body>\n<b>Http headers:</b><br/>\n<!---- first scriptlet --\n<%\nfor (Enumeration<String>\
    \ e = request.getHeaderNames();\n  e.hasMoreElements()) {\n  String header = e.nextElement();\n\
    \  out.println(header + \": \" + request.getHeader(header) +\n  \"<br/>\\n}\n\
    String message = \"Thank you.\";\n%\n<br/>\n<!---- second scriptlet --\n<%\nout.println(message);\n\
    %>\n</body>\n</html>\n```\n\nThere are two scriptlets in JSP page in Listing C.6.\
    \ Note that variables defined in a scriptlet is visible to the other scriptlets\
    \ below it.\n\nIt is legal for the first line of code in a scriptlet to be in\
    \ the same line as the <% tag and for the %> tag to be in the same line as the\
    \ last line of code. However, this would result in a less readable page."
