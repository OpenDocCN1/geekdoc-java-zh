  md: "# Chapter 4: Annotation-Based Controllers\n\na Model instance in a method.\
    \ This annotation type is also part of the org.springframework.web.bind.annotation\
    \ package.\n\n@ModelAttribute can be used to annotate a method argument or a method.\
    \ A method argument annotated with @ModelAttribute will have an instance of it\
    \ retrieved or created and added to the Model object if the method body does not\
    \ explicitly it. For example, Spring MVC will create an instance of Order every\
    \ time submitOrder method is invoked.\n\n```\n@RequestMapping(method = RequestMethod.POST)\n\
    public String submitOrder(@ModelAttribute(\"newOrder\") Order order,\nModel model)\
    \ {\n\n...\n}\n```\n\nThe Order instance retrieved or created will be added to\
    \ the Model object with attribute key newOrder. If no key name is defined, then\
    \ the name will be derived from the name of the type to be added to the Model.\
    \ For instance, every time the following method is invoked, an instance of Order\
    \ will be retrieved or created and added to the Model using attribute key order.\n\
    \n```\npublic String submitOrder(@ModelAttribute Order order, Model model)\n```\n\
    \nThe second use of @ModelAttribute is to annotate a non-request-handling method.\
    \ Methods annotated with @ModelAttribute will be invoked every time a request-handling\
    \ method in the same controller class is invoked. This means, if a controller\
    \ class has two request-handling methods and another method annotated with @ModelAttribute,\
    \ the annotated method will likely be invoked more often than each of the request-handling\
    \ methods.\n\nA method annotated with @ModelAttribute will be invoked before a\
    \ request-handling method. Such a method may return an object or have a void return\
    \ type. If it returns an, the object is automatically added to the Model that\
    \ was created for the request-handling method. For example, the return value of\
    \ this method will be added to the Model.\n\n```\n@ModelAttribute\npublic Product\
    \ addProduct(@RequestParam String productId) {\n  return productService.get(productId);\n\
    }\n```"
