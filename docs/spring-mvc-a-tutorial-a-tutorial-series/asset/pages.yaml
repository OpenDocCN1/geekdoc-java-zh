  md: "# Expressions\n\nAn expression is evaluated and its result fed to the print\
    \ method of the out implicit object. An expression starts with <%= and ends with\
    \ %>. For example, the text in bold in the following line is an expression:\n\n\
    Today is <%=java.util.Calendar.getInstance().getTime() %>\n\nNote that there is\
    \ no semicolon after an expression.\n\nWith this expression, the JSP container\
    \ first evaluates java.util.Calendar.getInstance().getTime(), and then passes\
    \ the result to out.print(). This is the same as writing this scriptlet:\n\nToday\
    \ is\n\n```\n<% out.print(java.util.Calendar.getInstance().getTime()); %>\n```\n\
    \n# Declarations\n\nYou can declare variables and methods that can be used in\
    \ a JSP page. You enclose a declaration with <%! and %>. For example, the declarationTst.jsp\
    \ page in Listing C.7 shows a JSP page that declares a method named getTodosDate.\n\
    \nListing C.7: Using a declaration (declarationTest.jsp)\n\n```\n<%!\n    public\
    \ String getTodosDate() {\n        return new java.util.Date();\n    }\n%>\n<html>\n\
    <head><title>Declarations</title></head>\n<body>\n    Today is <%=getTodosDate()\
    \ %>\n</body>\n</html>\n```"
  merge: -1
