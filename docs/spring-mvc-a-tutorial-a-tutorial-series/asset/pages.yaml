    \ <property name=\"prefix\" value=\"/WEB-INF/jsp/\"/>\n  <property name=\"suffix\"\
    \ value=\".jsp\"/>\n</bean>\n```\n\n# Redirect and Flash Attributes\n\nAs a seasoned\
    \ servlet/JSP programmer, you must know the difference between a forward and a\
    \ redirect. A forward is faster than a redirect because a redirect requires a\
    \ round-trip to the server and a forward does not. However, there are circumstances\
    \ where a redirect is preferred. One of such events is when you need to redirect\
    \ to an external site, like a different web site. You cannot use a forward to\
    \ target an external site so a redirect is your only choice.\n\nAnother scenario\
    \ where you want to use a redirect instead of a forward is when you want to avoid\
    \ the same action from being invoked again when the user reloads the page. For\
    \ example, in app04a when you submit the Product form, the saveProduct method\
    \ will be invoked and this method will do what it's supposed to do. In a real-world\
    \ application, this might include adding the product to the database. However,\
    \ if you reload the page after you submits the form, saveProduct will be called\
    \ again and the same product would potentially be added the second time. To avoid\
    \ this, after a form submit, you may prefer to redirect the user to a different\
    \ page. This page should have no side-effect when called repeatedly. For instance,\
    \ in app04a, you could redirect the user to a ViewProduct page after a form submit.\n\
    \nIn app04b you probably noticed that the saveProduct method in the ProductController\
    \ ends with this line:\n\n```\nreturn \"redirect:/product_view/\" + savedProduct.getId();\n\
    ```\n\nHere, you use a redirect instead of a forward to prevent the saveProduct\
    \ method being called twice if the user reloads the page."
