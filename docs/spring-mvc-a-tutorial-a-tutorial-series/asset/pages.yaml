  md: "# Formatting Actions\n\nJSTL provides tags for formatting and parsing numbers\
    \ and dates. The tags are formatNumber, formatDate, timeZone, setTimeZone, parseNumber,\
    \ and parseDate. These tags are discussed in the sections to follow.\n\n# The\
    \ formatNumber Tag\n\nYou use formatNumber to format numbers. This tag gives you\
    \ the flexibility of using its various attributes to get a format that suits your\
    \ need. The first is used without a body content:\n\n```\n<fmt:formatNumber value=\"\
    numericValue\"\n  [type=\"number|currency|percent\"]\n  [pattern=\"customPattern\"\
    ]\n  [currencyCode=\"currencyCode\"]\n  [currencySymbol=\"currencySymbol\"]\n\
    \  [groupingUsed=\"true|false\"]\n  [maxIntegerDigits=\"maxIntegerDigits\"\n \
    \ [minIntegerDigits=\"minIntegerDigits\"\n  [maxFractionDigits=\"maxFractionDigits\"\
    \n  [minFractionDigits=\"minFractionDigits\"\n  [var=\"varName\"]\n  [scope=\"\
    page|request|session|application\"]\n\n/>\n```\n\nThe second form is used with\
    \ a body content:\n\n```\n<fmt:formatNumber type=\"number|currency|percent\">\n\
    \  [pattern=\"customPattern\"\n  [currencyCode=\"currencyCode\"\n  [currencySymbol=\"\
    currencySymbol\"\n  [groupingUsed=\"true|false\"\n  [maxIntegerDigits=\"maxIntegerDigits\"\
    \n  [minIntegerDigits=\"minIntegerDigits\"\n  [maxFractionDigits=\"maxFractionDigits\"\
    \n  [minFractionDigits=\"minFractionDigits\"\n  [var=\"varName\"\n  [scope=\"\
    page|request|session|application\"]>\n  numeric value to be formatted\n</fmt:formatNumber>\n\
    ```"
  merge: -1
  pgno: 197
- img_proc: true
  md: 'The body content is JSP. The formatNumber tag''s attributes are given in Table
    9.10.


    | Attribute | Type | Description |

    | --- | --- | --- |

    | value+ | String or Number | Numeric value to be formatted. |

    | type+ | String | Indicates whether the value is to be formatted as number, currency,
    or percentage. The value of this attribute is one of the following: **number,
    currency, percent.** |

    | pattern+ | String | Custom formatting pattern. |

    | currencyCode+ | String | 4217 code. See Table 9.9. |

    | currencySymbol+ | String | Currency symbol. |

    | groupingUsed+ | Boolean | Indicates whether the output will contain grouping
    separators. |

    | maxIntegerDigits+ | int | The maximum number of digits in the integer portion
    of the output. |

    | minIntegerDigits+ | int | The minimum number of digits in the integer portion
    of the output. |

    | maxFractionDigits+ | int | The maximum number of digits in the fractional portion
    of the output. |

    | minFractionDigits+ | int | The minimum number of digits in the fractional portion
    of the output. |

    | var | String | The name of the scoped variable to store the output as a String.
    |

    | scope | String | The scope of **var**. If the **scope** attribute is present,
    the **var** attribute must be specified.|


    Table 9.10: The formatNumber tag''s attributes


    One of the uses of **formatNumber** is to format numbers as currencies. For this,
    you can use the **currencyCode** attribute to specify an ISO 4217 currency code.
    Some of the codes are given in Table 9.11.'
