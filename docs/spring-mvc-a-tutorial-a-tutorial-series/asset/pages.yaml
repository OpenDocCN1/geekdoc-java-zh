  md: '# Chapter 2: Model 2 and the MVC Pattern


    In this application, as is the case for most Model 2 applications, you need to
    prevent the JSP pages from being accessed directly from the browser. There are
    a number of ways to achieve this, including:


    +   - Putting the JSP pages under WEB-INF. Anything under WEB-INF or a subdirectory
    is protected. If you put your JSP pages under WEB-INF you cannot access them directly
    from the browser, the controller can still dispatch requests to those pages.

    - Using a servlet filter and filter out requests for JSP pages.

    - Using security restriction in the deployment descriptor. This is easier than
    using a filter since you do not have to write a filter class.


    # Testing the Application


    Assuming you are running the application on port 8080 of your local machine, you
    can invoke the application using the following URL:

    http://localhost:8080/app0a/product_input.action


    You will see something similar to Figure 2.2 in your browser.

    When you submit the form, the following URL will be sent to the server:

    http://localhost:8080/app0a/product_save.action


    Using a servlet controller allows you to use the servlet as a welcome page. This
    is an important feature since you can then configure your application so that
    the servlet controller will be invoked simply by typing your domain name (such
    as http://example.com) in the browser''s address box. You can''t do this with
    a filter.


    # Isolating Code in Controller Classes


    The business logic in app02a was written in the servlet controller. You guess
    right, the servlet can easily become bloated as the application grows more complex.
    To prevent this from happening, you should isolate business logic in separate
    classes called controller classes.'
