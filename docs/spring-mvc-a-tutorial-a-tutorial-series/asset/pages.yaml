  md: '# # Chapter 6

    # Converters and Formatters


    In Chapter 5, “Data Binding and the Form Tag Library” you witnessed the power
    of data binding and learned to harness it using the tags in the form tag library.
    However, Spring data binding is not without limit. There are cases where Spring
    is clueless on how to bind data correctly. For example, Spring will always try
    to bind a date input to a java.util.Date using the default locale. If you want
    Spring to use a different date pattern, for example, you need to use a converter
    or a formatter to help Spring.


    This chapter discusses the converter and the formatter. Both are used to convert
    one type of object to another. Converters are generic components that can be used
    in any tier of the application. Formatters, on the other hand, are specifically
    designed for the web tier.


    # ## Converters


    A Spring converter is an object that converts a type to another type. For example,
    user input for a date can be in many forms. “December 25, 2014,” 12/25/2014,”
    “2014-12-25” can all represent the same date. By default, Spring expects the input
    to be in the pattern as the current locale, which is probably in MM/dd/yyyy format
    if you live in the United States. If you want Spring to use a different date pattern
    when binding an input string to a Date, you need to write a string-to-date converter.


    To create a converter, you must write a Java class that implement the org.springframework.core.convert.converter.Converter
    interface. The declaration of this interface is parameterized:


    ```

    public interface Converter<S, T>

    ```'
