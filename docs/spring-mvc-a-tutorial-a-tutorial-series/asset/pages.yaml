  md: "# Chapter 3: Introduction to Spring MVC\n\ndispatcher servlet that you can\
    \ instantly use. Its fully qualified name is org.springframework.web.servlet.DispatcherServlet.\n\
    \nTo use this servlet, you need to configure it in your deployment descriptor\
    \ (web.xml file) using the servlet and servlet-mapping elements, like this.\n\n\
    ```\n<servlet>\n  <servlet-name>springmvc</servlet-name>\n  <class>\n    org.springframework.web.servlet.DispatcherServlet\n\
    \  </class>\n  <load-on-startup>1</load-on-startup>\n</servlet>\n```\n\n```\n\
    <servlet-mapping>\n  <servlet-name>springmvc</servlet-name>\n  <!-- map all requests\
    \ to the DispatcherServlet -->\n  <url-pattern>/</url-pattern>\n</servlet-mapping>\n\
    ```\n\nThe load-on-startup element under <servlet> is optional. If it is present,\
    \ it will load the servlet and call its init method when the application is started.\
    \ Without the load-on-startup element, the servlet will be loaded when it first\
    \ requested.\n\nBy itself the dispatcher servlet will use many default components\
    \ that come with Spring MVC. In addition, at initialization it will look for a\
    \ configuration file in the WEB-INF directory of the application. The XML file\
    \ name must conform to this pattern\n\n```\nservletName-servlet.xml\n```\n\nwhere\
    \ servletName is the name given to the Spring dispatcher servlet in the deployment\
    \ descriptor. If you have given the servlet name springmvc, you will need to have\
    \ a springmvc-servlet.xml file under the WEB-INF directory of your application\
    \ directory.\n\nHowever, you can place your Spring MVC configuration file anywhere\
    \ within your application directory as long as you tell the dispatcher servlet\
    \ where to find it. You do this by using an init-param element under the servlet\
    \ declaration. The init-param element would have a param-name element that has\
    \ the value contextConfigLocation. It would also have a"
  merge: -1
  pgno: 60
- img_proc: true
  md: "param-value element containing the path to your configuration file. For example,\
    \ you can change the default name and location of the configuration file to /WEB-INF/config/simple-config.xml\
    \ using this init-param\n\n```\n<servlet>\n  <servlet-name>springmvc</servlet-name>\n\
    \  <servlet-class>\n    org.springframework.web.servlet.DispatcherServlet\n  </servlet-class>\n\
    \  <init-param>\n    <param-name>contextLocation</param-name>\n    <param-value>/WEB-INF/config/simple-config.xml</param-value>\n\
    \  </init-param>\n  <load-on-startup>1</load-on-startup>\n</servlet>\n```\n\n\
    # The Controller Interface\n\nPrior to Spring 2.5, the only way to write a controller\
    \ was by implementing the org.springframework.web.mvc.Controller interface. This\
    \ interface exposes a handleRequest method that must be overridden by implementing\
    \ classes. Here is the signature of the method.\n\n```\nModelAndView handleRequest(HttpServletRequest\
    \ request, HttpServletResponse response)\n```\n\nAn implementation has access\
    \ to the HttpServletRequest and HttpServletResponse of the corresponding request.\
    \ The implementation must also return a ModelAndView that contains a view path\
    \ or a view path and a model.\n\nA controller implementing the Controller interface\
    \ can only handle one single action. On the other hand, an annotation-based controller\
    \ can house many request-handling methods and do not have to implement any interface.\
    \ You will learn about the latter in Chapter 4, “Annotation-based Controllers.”"
