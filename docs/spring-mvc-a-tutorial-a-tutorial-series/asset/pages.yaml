    # JSR 303 Validation


    JSR 303. “Bean Validation” (published in November 2009) and JSR 349, “Bean Validation
    1.1” (published in May 2013) specifies a set of API’s for applying constraints
    on object properties through annotations. JSR 303 and JSR 349 can be downloaded
    from these URLs, respectively.


    ```

    http://jsr.org/en/jsr/detail?id=303

    http://jsr.org/en/jsr/detail?id=349

    ```


    Of course, a JSR is just a specification document and of little use until someone
    writes an implementation of it. In the case of bean validation'
