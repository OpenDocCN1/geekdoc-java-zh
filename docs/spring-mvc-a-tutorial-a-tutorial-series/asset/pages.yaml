  md: '# # Appendix A

    Tomcat


    Tomcat is the most popular servlet/JSP container today. It''s free, mature, and
    open-sourced. You need Tomcat 7 or later or another compliant servlet/JSP container
    to run the sample applications accompanying this book. This appendix provides
    a quick installation and configuration guide and is by no means a comprehensive
    tutorial.


    # ## Downloading and Configuring Tomcat


    You should first download the latest version of Tomcat from http://tomcat.apache.org.
    You should get the latest binary distribution in either zip or gz. Tomcat 7 and
    later require Java 6 to run.


    After you download the zip or gz file, unpack the file. You will see several directories
    under the installation directory.


    In the bin directory, you will find programs to start and stop Tomcat. The webapps
    directory is important because you can deploy your applications there. In addition,
    the conf directory contains configuration files, including the server.xml and
    tomcat-users.xml files. The lib directory is also of interest since it contains
    the Servlet and JSP APIs that you need to compile your servlets and custom tags.


    After extracting the zip or gz file, set the JAVA_HOME environment variable to
    the JDK installation directory.


    For Windows users, it is a good idea to download the Windows installer for easier
    installation.'
  merge: -1
  pgno: 268
- img_proc: true
  md: '# Starting and Stopping Tomcat


    Once you’ve downloaded and extracted a Tomcat binary, you can start

    Tomcat by running the startup.bat (on Windows) or the startup.sh file (on\Unix/Linux/Mac
    OS). Both files reside under the bin directory of Tomcat’s

    installation directory. By default, Tomcat runs on port 8080, so you can test

    Tomcat by directing your browser to this address:


    http://localhost:8080


    To stop Tomcat, run the shutdown.bat (on Windows) or shutdown.sh file

    (on Unix/Linux/Mac OS) in the bin directory.


    # Defining A Context


    To deploy a servlet/JSP application to Tomcat, you need to define a Tomcat

    context either explicitly or implicitly. Each Tomcat context represents a web

    application in Tomcat.


    There are several ways of defining a Tomcat context explicitly,

    including


    +   * Creating an XML file in Tomcat’s conf/Catalina/localhost directory.

    * Adding a Context element in Tomcat’s conf/server.xml file.


    If you decide to create an XML file for each context, the file name is

    important as the context path is derived from it. For example, if you place a

    commerce.xml file in the conf/Catalina/localhost directory, the context

    path of your application will be commerce and a resource can be invoked

    using this URL:


    http://localhost:8080/commerce/resourceName


    A context file must contain a Context element as its root element. Most of

    the times the element does not have child elements and is the only element

    in the file. For example, here is an example context file, consisting of a

    single line.'
