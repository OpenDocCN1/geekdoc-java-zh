    <%@ include file="copyright.jsp"%>

    </body>

    </html>

    ```


    Using the include directive in the main.jsp page has the same effect as writing
    the following JSP page.


    ```

    <html>

    <head><title>Including a file</title></head>

    <body>

    This is the included content: <hr/>

    &copy;2014 BrainySoftware

    <hr/>

    </body>

    </html>

    ```


    For the above include directive to work, the copyright.jsp file must reside in
    the same directory as the including page.


    By convention an include file has jsp extension, which stands for JSP fragment.
    Today JSP fragments are called JSP segments but the jsp extension is still retained
    for consistency.


    Note that you can also include static HTML files.


    The include action, discussed in the section “Actions” later in this appendix,
    is similar to the include directive. The subtle difference explained in the section
    “Actions” and it is important to understand the difference between the two.


    # Scripting Elements


    The second type of JSP syntactic elements, scripting elements incorporate Java
    code into a JSP page. There are three types of scripting elements: scriptlets,
    declarations, and expressions. They are discussed in the following subsections.'
