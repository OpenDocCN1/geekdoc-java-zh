  md: "# 164 Spring MVC: Tutorial\n\nare using a JSP 2.0-compliant container but are\
    \ not ready yet to upgrade to JSP 2.0. In this case, you can disable the evaluation\
    \ of EL expressions.\n\nThis section discusses how to enforce script-free JSP\
    \ pages and how to disable the EL in JSP 2.0 and later.\n\n# Achieving Script-Free\
    \ JSP Pages\n\nTo disable scripting elements in JSP pages, use the jsp-property-group\
    \ element with two subelements: url-pattern and scripting-invalid. The url-pattern\
    \ element defines the URL pattern by which scripting disablement will apply. Here\
    \ is how you disable scripting in all JSP pages in an application:\n\n```\n<jsp-config>\n\
    \  <jsp-property-group>\n    <url-pattern>*.jsp</url-pattern>\n    <scripting-invalid>true</scripting-invalid>\n\
    \  </jsp-property-group>\n</jsp-config>\n```\n\nNote\n\nThere can be only one\
    \ jsp-config element in the deployment descriptor. If you have specified a jsp-property-group\
    \ for deactivating the EL, you must write your jsp-property-group for deactivating\
    \ scripting under the same jsp-config element.\n\n# Deactivating EL Evaluation\n\
    \nIn some circumstances, such as when you need to deploy JSP 1.2 applications\
    \ in a JSP 2.0 or later container, you may need to deactivate EL evaluation in\
    \ a JSP page. When you do so, an occurrence of the EL construct will not be evaluated\
    \ as an EL expression. There are two ways to deactivate EL evaluation in a JSP.\n\
    \nFirst, you can set the isELIgnored attribute of the page directive to true,\
    \ such as in the following:\n\n```\n<@ page isELIgnored=\"true\" %>\n```"
  merge: -1
  pgno: 171
- img_proc: true
  md: "# Chapter 8: The Expression Language\n\nThe default value of the isELIgnored\
    \ attribute is false. Using the isELIgnored attribute is recommended if you want\
    \ to deactivate EL evaluation in one or a few JSP pages.\n\nSecond, you can use\
    \ the jsp-property-group element in the deployment descriptor. The jsp-property-group\
    \ element is a subelement of the jsp-config element. You use jsp-property-group\
    \ to apply certain settings to a set of JSP pages in the application.\n\nTo use\
    \ the jsp-property-group element to deactivate EL evaluation, you must have two\
    \ subelements: url-pattern and el-ignored. The url-pattern element specifies the\
    \ URL pattern to which EL deactivation will apply. The el-ignored element must\
    \ be set to true.\n\nAs an example, here is how to deactivate EL evaluation in\
    \ a JSP named noEl.jsp.\n\n```\n<jsp-config>\n  <jsp-property-group>\n    <url-pattern>noEl.jsp</url-pattern>\n\
    \    <el-ignored>true</el-ignored>\n  </jsp-property-group>\n</jsp-config>\n```\n\
    \nYou can also deactivate the EL evaluation in all the JSP pages in an application\
    \ by assigning *.jsp to the url-pattern element, as in the following:\n\n```\n\
    <jsp-config>\n  <jsp-property-group>\n    <url-pattern>*.jsp</url-pattern>\n \
    \   <el-ignored>true</el-ignored>\n  </jsp-property-group>\n</jsp-config>\n```\n\
    \nEL evaluation in a JSP page will be deactivated if either the isELIgnored attribute\
    \ of its page directive is set to true or its URL matches the pattern in the jsp-property-group\
    \ element whose el-ignored subelement is set to true. For example, if you set\
    \ the page directive's isELIgnored attribute of a JSP page to false but its URL\
    \ matches the pattern of JSP pages whose EL evaluation must be deactivated in\
    \ the deployment descriptor, EL evaluation of that page will be deactivated."
  merge: -1
