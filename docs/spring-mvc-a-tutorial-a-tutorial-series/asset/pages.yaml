  md: '# # Appendix C

    # JavaServer Pages


    You learned in Appendix B, "Servlets" that there are two drawbacks servlets are
    not capable of overcoming. First, all HTML tags written in a servlet must be enclosed
    in Java strings, making sending HTTP response a tedious effort. Second, all text
    and HTML tags are hardcoded; as such, even minor changes to the presentation layer,
    such as changing a background color, require recompilation.


    JavaServer Pages (JSP) solves the two problems in servlets. JSP does not replace
    Servlet, though. Rather, it complements it. Modern Java web applications use both
    servlets and JSP pages. The latest version of JSP at the time of writing is 2.2.


    This appendix starts with an overview of JSP and discusses in detail comments
    in JSP pages, implicit objects, and the three syntactic elements (directives,
    scripting elements, and actions). Error handling is covered towards the end of
    this appendix.


    JSP can be written in standard syntax or XML syntax. JSP pages written in XML
    syntax are called JSP documents. JSP in XML syntax is very rarely used and is
    not covered here. In this appendix you learn JSP in standard syntax.


    # # An Overview of JSP


    A JSP page is essentially a servlet. However, working with JSP pages is easier
    than with servlets for two reasons. First, you do not have to compile'
  merge: -1
  pgno: 306
- img_proc: true
  md: '# 300 Spring MVC: A Tutorial


    JSP pages. Second, JSP pages are basically text files with jsp extension and you
    can use any text editor to write them.


    JSP pages run on a JSP container. A servlet container is normally also a JSP container.
    Tomcat, for instance, is a servlet/JSP container.


    The first time a JSP page is requested, a servlet/JSP container does things:


    +   Translate the JSP page into a JSP page implementation class, which is a Java
    class that implements the javax.servlet.jsp.JspPage interface or its subinterface
    javax.servlet.http.HttpServlet JspPage is a subinterface of javax.servlet.Servlet
    and makes every JSP page a servlet. The class name of the generated servlet is
    dependent on the servlet/JSP container. You do not have to worry about this because
    you do not work with it directly. If there is a translation error, an error message
    will be sent to the client.


    +   If the translation was successful, the servlet/JSP container compiles the
    servlet class. The container loads and instantiates the Java bytecode as well
    as performs the lifecycle operations it normally does a servlet.


    For subsequent requests for the same JSP page, the servlet/JSP container checks
    if the JSP page has been modified since the last time it was translated. If not,
    so it will be retranslated, recompiled, and executed. The JSP servlet already
    in memory is executed. This way, the first invocation of a JSP page always takes
    longer than subsequent requests because it involves translation and compilation.
    To get around this problem, you can do one of the following:


    +   Configure the application so that all JSP pages will be called (and, in effect,
    translated and compiled) when the application starts, rather than at first requests.


    +   Precompile the JSP pages and deploy them as servlets.


    JSP comes with an API that comprises four packages:


    +   javax.servlet.jsp. Contains core classes and interfaces used by the servlet/JSP
    container to translate JSP pages into servlets. The JspPage'
  merge: -1
  pgno: 307
- img_proc: true
  md: '# Appendix C: JavaServer Pages 301


    and HttpServletPage interfaces are important members of this package. All JSP
    page implementation classes must implement either JspPage or HttpServletPage.
    In the HTTP environment, HttpspPage is the obvious choice.


    +   - javax.servlet.jsp.tagext. Contains types for developing custom tags.

    - javax.servlet.el. Provides the API for the Unified Expression Language.

    - javax.servlet.jsp.el. Provides classes that must be supported by a servlet/JSP
    container to support the Expression Language in JSP.


    With the exception of javax.servlet.jsp.tagext, you rarely have to use the JSP
    API directly. When writing a JSP page, you''re more concerned with the Servlet
    API than the JSP API itself. Of course, you also need to master the JSP syntax,
    which will be explained throughout this appendix. One example where the JSP API
    is used extensively is when developing a JSP container or a JSP compiler.


    You can view the JSP API here:


    http://download.oracle.com/docs/cd/E17802_01/products/products/jsp/2.1/docs/jsp-2_1-pfd2/index.html


    A JSP page can contain template data and syntactic elements. An element is something
    with a special meaning to the JSP translator. For example, <% is an element because
    it denotes the start of a Java code block within a JSP page. %> is also an element
    because it terminates a Java code block. Everything else that is not an element
    is template data. Template data is sent as is to the browser. For instance, HTML
    tags and text in a JSP page are template data.


    Listing C.1 presents a JSP page welcome.jsp. It is a simple page that sends a
    greeting to the client. Notice how the JSP page is compared to a servlet that
    does the same thing?


    # Listing C.1: The welcome.jsp page


    ```

    <html>

    <head><title>Welcome</title></head>

    <body>

    Welcome

    </body></html>

    ```'
