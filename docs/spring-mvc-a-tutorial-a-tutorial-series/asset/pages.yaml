    To use a path variable, first you need to add a variable that is the value attribute
    of your RequestMapping annotation. The variable must be put between curly brackets.
    For example, the following RequestMapping annotation defines a path variable called
    id:

    @RequestMapping(value = "/product_view/{id}")


    Then, in your method signature, add an identically named variable annotated with
    @PathVariable. Take a look at the signature of view Product in Listing 4.11. When
    the method is invoked, the id value in the request URL will be copied to the path
    variable and can be used in the method. The type of a path variable does not need
    to be String. Spring MVC will try its best to convert a non-string value. This
    great feature of Spring MVC’s will be discussed in detail in Chapter 5, “Data
    Binding and the Form Tags.”


    You can use multiple path variables in your request mapping. example, the following
    two path variables, userId and orderId.

    @RequestMapping(value = "/product_view/{userId}/{orderId}")


    To test the path variable in the viewProduct method, direct your browser to this
    URL.

    http://localhost:8080/app0b/product_view/1


    There is a slight problem when employing path variables: in some cases it may
    be confusing to the browser. Consider the following URL.

    http://example.com/context/abc


    The browser will think (correctly) that abc is the action. Any relative reference
    to a static file, such as a CSS file, will be resolved using http://example.com/context
    as the base. This is to say, if the page sent by the server contains this img
    element

    <img src="logo.png"/>


    The browser will look for logo.png in http://example.com/context/logo.png.'
