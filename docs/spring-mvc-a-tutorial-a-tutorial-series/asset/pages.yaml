- img_proc: true
  md: "The DateFormatter may be used for formatting other strings to dates, such as\
    \ birthDate or purchaseDate. Both dates have different rules than shippingDate.\
    \ In fact, a date of birth for an employee, for example, cannot be a future date.\
    \ Second, a validator may work by inspecting the relationship between two or more\
    \ fields, each of which is supported by a different formatter. For example, given\
    \ an Employee object with a birthDate property and a startDate property, a validator\
    \ may rule that there is no way someone starting in the company before he she\
    \ was born. Therefore, a valid Employee object must have its birthDate property\
    \ value that is earlier than its startDate value. That's the job of a validator.\n\
    \n# Spring Validators\n\nRight from the start, Spring has been designed with input\
    \ validation in mind. This was even before JSR 303 (Java validation specification)\
    \ was conceived. As such, the Spring Validation framework was commonplace today,\
    \ although JSR 303 validators are generally recommended for new projects.\n\n\
    To create a Spring validator, implement the org.springframework.validation.Validator\
    \ interface. This interface is given in Listing 7.1 and has two methods, supports\
    \ and validate.\n\n# Listing 7.1: The Spring Validator interface\n\n```\npackage\
    \ org.springframework.validation;\npublic interface Validator {\n    boolean supports(Class<?>\
    \ clazz);\n    void validate(Object target, Errors errors);\n}\n```\n\nThe supports\
    \ method returns true if the validator can handle the specified Class. The validate\
    \ method validates the target object and populate the Errors object with validation\
    \ errors.\n\nAn Errors object is an instance of the org.springframework.validation.Errors\
    \ interface. An Errors object contains a list of FieldError and ObjectError objects.\
    \ A FieldError represents an error that is related to one of the properties in\
    \ the validated object. For example, if the price property of a product must not\
    \ be negative"
