    ```


    to


    ```

    <style type="text/css">

    @import url("<c:url value="css/main.css"/>");

    </style>

    ```


    Thanks to the url, the URL will be translated into this if it is in the default
    context.


    ```

    <style type="text/css">@import url("css/main.css");</style>

    ```


    And it will be translated into this if it is not in the default context.


    ```

    <style type="text/css">@import url("app04b/css/main.css");</style>

