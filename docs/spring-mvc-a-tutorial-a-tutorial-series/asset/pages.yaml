    # File Upload with Commons FileUpload


    Only servlet containers that implement Servlet 3.0 or later specification support
    file upload. For Pre-Servlet 3.0 containers, you need the Apache Commons FileUpload
    component you can download from this web page.

    http://commons.apache.org/proper/commons-fileupload/


    This is an open source project, so it is free and its source code is available.
    For Commons FileUpload to work successfully, it needs another Apache Commons component,
    Apache Commons IO. You can download Apache Commons IO from here.

    http://commons.apache.org/proper/commons-io/'
  merge: -1
