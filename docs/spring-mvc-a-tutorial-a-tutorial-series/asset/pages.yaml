  md: '# # Chapter 12

    File Download


    A static resource, such as an image or an HTML file, can be downloaded by simply
    pointing the browser to the right URL. As long as the resource is located in the
    application directory or a subdirectory under it and not under under WEB-INF,
    the servlet/JSP container will send the resource to the browser. However, sometimes
    a static resource is stored outside the application directory or in a database,
    or sometimes you want to control over who can see it and prevent other websites
    from cross-referencing it. If any of these scenarios applies to you, then you
    have to send the resource programmatically.


    In short, programmatic file download lets you selectively send a file to the browser.
    This chapter explains what it takes to programmatically send a resource to the
    browser and presents two examples.


    # ## File Download Overview


    To send a resource such as a file to the browser, you need to do the following
    in your controller.


    +   1. Use the `void` return type for your request-handling method and add `HttpServletResponse`
    as an argument to the method.

    2. Set the response''s content type to the file''s content type. The `Content-Type`
    header specifies the type of data in the body of an entity and contains of the
    media type and subtype identifiers. Visit http://www.iana.org/assignments/media-types
    for standard content types. If you do not know what the content type is or want
    the browser to always display the Save As dialog, set it to'
  merge: -1
  pgno: 258
- img_proc: true
  md: '# APPLICATION/OCTET-STREAM. This value is not case sensitive.


    3. Add an HTTP response header named Content-Disposition and give it the value
    attachment; filename=fileName, where fileName is the default file name that should
    appear in the File Download dialog box. This is normally the same name as the
    file, but does not have to be.


    For instance, this code sends a file to the browser.


    ```

    FileInputStream fis = new FileInputStream(file);

    BufferedInputStream bis = new BufferedInputStream(fis);

    byte[] bytes = new byte[bis.available()];

    response.setContentType(contentType);

    OutputStream os = response.getOutputStream();

    bis.read(bytes);

    nos.write(bytes);

    ```


    To send a file programmatically to the browser, first read the file as a FileInputStream
    and load the content to a byte array. Then, you obtain the HttpServletResponse''s
    OutputStream and call its write method, passing the byte array.


    # Example 1: Hiding A Resource


    The app12a application demonstrates how to send a file to the browser. In this
    application the ResourceController class handles user login and the sending of
    a secret.pdf file to the browser. The secret.pdf file is placed under WEB-INF/data
    so that direct access is not possible. Only authorized users can view it. If a
    user has not logged in, the application will forward to the Login page.


    The ResourceController class in Listing 12.1 presents a controller responsible
    for sending the secret.pdf file. Access is only granted if the user''s HttpSession
    contains a loggedIn attribute, which indicates the user has successfully logged
    in.'
