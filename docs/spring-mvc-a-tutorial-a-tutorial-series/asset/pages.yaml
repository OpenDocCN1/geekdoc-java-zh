  md: '# Chapter 4: Annotation-Based Controllers 73


    Here is the list of argument types that can appear as arguments in a request-handling
    method.


    +   * jakarta.servlet.ServletRequest or jakarta.servlet.http.HttpServletRequest

    * jakarta.servlet.ServletResponse or jakarta.servlet.http.HttpServletResponse

    * jakarta.servlet.http.HttpSession

    * org.springframework.web.context.request.WebRequest or org.springframework.web.context.request.NativeWebRequest

    * java.util.Locale

    * java.io.InputStream or java.io.Reader

    * java.io.OutputStream or java.io.Writer

    * java.security.Principal

    * HttpEntity<?> parameters

    * java.util.Map / org.springframework.ui.Model / org.springframework.ui.ModelMap

    * org.springframework.web.servlet.mvc.RedirectAttributes

    * org.springframework.validation.Errors / org.springframework.validation.validation.BindingResult

    * Command or form objects

    * org.springframework.web.bind.support.SessionStatus

    * org.springframework.web.util.UriComponentsBuilder

    * Types annotated with @PathVariable, @MatrixVariable, @RequestParam, @RequestHeader,
    @RequestBody, or @RequestPart.


    Of special interest is the **org.springframework.ui.Model** type. This is not
    a Servlet API type, but rather a Spring MVC type that contains a **Map**. Every
    time a request-handling method is invoked, Spring MVC creates a **Model** object
    and populates its **Map** with potentially various objects.


    A request-handling method can return one of these objects.


    +   * A ModelAndView object

    * A Model object

    * A Map containing the attributes of the model

    * A View object'
