  md: '# Comments


    Adding comments to a JSP page is good practice. There are two types of comments
    that can appear in a JSP page:


    +   - JSP comments, which are comments documenting what the page is doing.

    - HTML/XHTML comments, which are comments that will be sent to the browser.


    A JSP comment starts with <%- and ends with --%>. For instance, the following
    is a JSP comment:


    ```

    <-- retrieve products to display --%>

    ```


    A JSP comment is not sent to the browser and cannot be nested.


    An HTML/XHTML comment has the following syntax:

    <-- comments here -->


    An HTML/XHTML comment is not processed by the container and is sent to the browser
    as is. One use the HTML/XHTML comment is to identify the JSP page itself:


    ```

    <-- this is /jsp/store/displayProducts.jsp --%>

    ```


    This is particularly useful when working with an application that has many JSP
    fragments. The developer can easily find out which JSP page or fragment generated
    a certain HTML section by viewing the HTML source in the browser.


    # Implicit Objects


    The servlet container passes several objects to the servlets it is running. For
    instance, you get an HttpServletRequest and an HttpServletResponse in the servlet''s
    service method and a ServletConfig in the init method. In'
  merge: -1
  pgno: 313
- img_proc: true
  md: '# Appendix C: JavaServer Pages 307


    addition, you can obtain an HttpSession by calling getSession on the HttpServletRequest
    object.


    In JSP you can retrieve those objects using implicit objects. C.1 lists the implicit
    objects.


    | Object | Type |

    | --- | --- |

    | request | javax.servlet.http.HttpServletRequest |

    | response | javax.servlet.http.HttpResponse |

    | out | javax.servlet.jsp.JspWriter |

    | session | javax.servlet.http.HttpSession |

    | application | javax.servlet.ServletContext |

    | config | javax.servlet.ServletConfig |

    | pageContext | javax.servlet.jsp.PageContext |

    | page | javax.servlet.jsp.HttpJspPage |

    | exception | java.lang.Throwable |


    Table C.1: JSP Implicit Objects


    For example, the request implicit object represents the HttpServletRequest passed
    by the servlet/JSP container. You can use request as it was a variable reference
    to the HttpServletRequest. For instance, the following code retrieves the userName
    parameter from the HttpServletRequest object.


    ```

    String userName = request.getParameter("userName");

    ```


    pageContext refers to the javax.servlet.jsp.PageContext created for the page.
    It provides useful context information and access to various servlet-related objects
    via its self-explanatory methods, such as getRequest, getResponse, getServletContext,
    getConfig, and getSession. These methods are not very useful in scriptlets since
    the objects they return can be accessed more directly through the implicit objects
    request, response, session, and application.


    Another set of interesting methods offered by PageContext are those for getting
    and setting attributes, the getAttribute and setAttribute methods. Attributes
    can be stored in one of four scopes: page, request,'
  merge: -1
  pgno: 314
- img_proc: true
  md: '# 308 Spring MVC: A Tutorial


    session, and application. The page scope is the narrowest scope and attributes
    stored here are only available in the JSP page. The request scope refers to the
    current ServletRequest, the session scope the current HttpServletSession, the
    application scope the current ServletContext.


    The setAttribute method in PageContext has the following signature: public abstract
    void setAttribute(java.lang.String name, java.lang.Object value, int scope)


    The value of scope can be one of the following static final ints in PageContext:
    PAGE_SCOPE, REQUEST_SCOPE, SESSION_SCOPE, and APPLICATION_SCOPE.


    Alternatively, to store an attribute in the page scope, you can use the setAttribute
    overload:


    ```

    public abstract void setAttribute(java.lang.String name, java.lang.Object value)

    ```


    For example, the following scriptlet stores an attribute in the ServletRequest.


    ```

    <% product is a Java object

    pageContext.setAttribute("product", product,

    PageContext.REQUEST_SCOPE); %>

    ```


    The Java code above has the same effect as this:


    ```

    <% request.setAttribute("product", product); %>

    ```


    The out implicit object references a javax.servlet.jsp.JspWriter, which is similar
    to the java.io.PrintWriter you get from calling getWriter() on the HttpServletResponse.
    You can call its print method overloads just as you would send messages to the
