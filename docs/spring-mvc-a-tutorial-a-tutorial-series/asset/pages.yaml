    # Application Directory Structure


    A servlet application must be deployed in a certain directory structure. Figure
    B.2 shows the directory structure for this application.


    ![](img/40306dd596a93e2704d63b5edaea0061_280_0.png)


    Figure B.2: The application directory of b1


    The b1 at the top of the structure is the application directory. Under the application
    directory is a WEB-INF directory. It in turn has two subdirectories:


    +   - **classes.** Your servlet classes and other Java classes must reside here.
    The directories under classes reflect the class package.

    - **lib.** Deploy jar files required by your servlet application here. The Servlet
