- img_proc: true
  md: "beginning and closing forEach tags, and will be removed right before the\n\
    closing forEach tag.\n\nThe for tag has a varStatus variable of type\navax.servlet.jsp.core.LoopTagStatus\
    \ interface\nhas count property that returns the \"count\" of the current round\
    \ of\niteration. The value of status.count is 1 for the first iteration, 2 for\
    \ the\nsecond iteration, and so on. By testing the remainder of status.count%2,\n\
    you know whether the tag is processing an even-numbered or odd-\nnumbered element.\n\
    \nAs an example, consider the BookController class and BookList.jsp\npage in the\
    \ app09a application. The BookController class, presented in\nListing 9.1, calls\
    \ a service method that returns a List of Book objects. The\nBook class is given\
