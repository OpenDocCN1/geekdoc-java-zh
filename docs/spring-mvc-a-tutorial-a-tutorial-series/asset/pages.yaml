    HttpSession, or ServletContext. The sessionScope, requestScope, and pageScope
    implicit objects are similar to applicationScope. However, the scopes are session,
    request, and page, respectively.


    A scoped object can be accessed in an EL expression without the scope. In this
    case, the JSP container will return the first identically named object in the
    PageContext, ServletRequest, HttpSession, or ServletContext. Searches are conducted
    starting from the narrowest scope (PageContext) to the widest (ServletContext).
