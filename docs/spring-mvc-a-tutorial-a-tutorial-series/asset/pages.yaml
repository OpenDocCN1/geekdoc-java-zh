  md: '# # Chapter 3

    Introduction to Spring MVC


    In Chapter 2, “Model 2 and the MVC Pattern” you learned that the widely used design
    of modern web applications follow the MVC pattern. You also learned the advantages
    of the Model 2 architecture and how to build Model 2 applications. Spring MVC
    is a framework that developers write MVC applications more rapidly.


    This chapter starts by discussing the benefits of Spring MVC and how it expedites
    Model 2 application development. It also discusses some basic components of Spring
    MVC, the Dispatcher Servlet, and teaches you how to write “old-style” controllers
    that were the only way of writing controllers in older versions of Spring prior
    to version 2.5. Another type of controller is covered in Chapter 4, “Annotation-based
    Controllers.” The old style controller is discussed here because you might still
    have to work with legacy code written with older versions of Spring. For new developments,
    however, you should use annotation-based controllers.


    Introducing Spring MVC configuration is another objective of this chapter. Most
    Spring MVC applications will have an XML file for declaring various beans that
    are used in the applications.


    # ## The Benefits of Spring MVC


    When writing a Model 2 application without a framework, it is your responsibility
    to write a dispatcher servlet and controller classes. Your dispatcher servlet
    must be capable of doing these things:


    +   1. Determine from the URI what action to invoke.

    2. Instantiate the correct controller class.

    3. Populate a form bean with request parameter values.'
  merge: -1
  pgno: 58
- img_proc: true
  md: '# Spring MVC: A Tutorial


    +   4. Call the correct method in the controller object.

    5. Forward control to a view (JSP page).


    Spring MVC is an MVC framework that employs a dispatcher servlet that invokes
    methods in controllers and forwards control to a view. This is the first benefit
    of using Spring MVC: You don''t need to write your own dispatcher servlet. Here
    is the list of features that Spring MVC is equipped with to make development more
    rapid.


    +   * Spring MVC provides a dispatcher servlet, saving your writing one.

    * Spring MVC employs an XML-based configuration file that you can use without
    recompiling the application.

    * Spring MVC instantiates controller classes and populates beans with user inputs.

    * Spring MVC automatically binds user input with the correct type. For example,
    Spring MVC can automatically parse a string and sets a property of type float
    or decimal.

    * Spring MVC validates user input and redirects the user back to the input form
    if validation failed. Input validation is optional and can be done programmatically
    or declaratively. On top of that, Spring MVC provides built-in validators for
    most of the tasks you may encounter when building a web application.

    * Spring MVC is part of the Spring framework. You get everything Spring has to
    offer.

    * Spring MVC supports internationalization and localization. This means, you can
    display messages in multiple languages depending on the user locale.

    * Spring MVC supports multiple view technologies. Most of the time you''ll be
    using JSP, but other technologies are supported, including Velocity and FreeMarker.


    # Spring MVC DispatcherServlet


    Recall that in Chapter 2, “Model 2 and the MVC Pattern” you built a simple MVC
    framework that consisted of a servlet that acted as a dispatcher. With Spring
    MVC, you don''t have to do that. Spring MVC comes with a'
