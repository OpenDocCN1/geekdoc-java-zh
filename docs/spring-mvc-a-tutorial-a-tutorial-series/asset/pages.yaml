    Congratulations. You just wrote your first servlet application.


    # ServletRequest


    For every HTTP request, the servlet container creates an instance of ServletRequest
    and passes it to the servlet''s service method. The ServletRequest encapsulates
    information about the request.


    These are some of the methods in the ServletRequest interface.


    ```

    public int getContentLength()

    ```


    Returns the number of bytes in the request body. If the length is known, this
    method returns -1.


    ```

    public java.lang.String getContentType()

    ```


    Returns the MIME type of the request body or null if the type is known.


    ```

    public java.lang.String getParameter(java.lang.String name)

    ```


    Returns the value of the requested parameter.


    ```

    public java.lang.String getProtocol()

    ```


    Returns the name and version of the protocol of this HTTP request.


    getParameter is the most frequently used method in ServletRequest. A common use
    of this method is to retrieve the value of an HTML form field. You''ll learn how
    you can retrieve form values in the section “Working with Forms” later in this
    chapter.'
  merge: -1
  pgno: 282
- img_proc: true
  md: 'getParameter can also be used to get the value of a query string. For example,
    if a servlet is invoked using this URI

    http://localhost/context/servletName?id=123


    you can retrieve the value of id from inside your servlet using this statement:

    String id = request.getParameter("id");


    Note that getParameter returns null if the parameter does not exist.


    In addition to getParameter, you can also use getParameterNames,

    getParameterMap, and getParameterValues to retrieve field names and values as
    well as query strings. See the section "HttpServlet" for examples of how to use
    these methods.


    # ServletResponse


    The javax.servlet.ServletResponse interface represents a servlet response. Prior
    to invoking a servlet''s service method, the servlet container creates a ServletResponse
    and pass it as the second argument to the service method. The ServletResponse
    hides the complexity of sending response to the browser.


    One of the methods defined in ServletResponse is the getWriter method, which returns
    a java.io.PrintWriter that can send text to the client. By default, the PrintWriter
    object uses ISO-8859-1 encoding.


    When sending response to the client, most of the time you send it as HTML. You
    are therefore assumed to be familiar with HTML.


    Note


    There is also another method that you can use to send output to the browser: getOutputStream.
    However, this method is for sending binary data, so in most cases you will use
    getWriter and not getOutputStream.'
