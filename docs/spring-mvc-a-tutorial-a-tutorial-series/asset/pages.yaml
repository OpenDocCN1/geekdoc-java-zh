    # ServletConfig


    The servlet container passes a ServletConfig to the servlet’s init method when
    the servlet container initializes the servlet. The ServletConfig encapsulates
    configuration information that you can pass to a servlet through @WebServlet or
    the deployment descriptor. Every piece of information so passed is called an initial
    parameter. An initial parameter has two components: key and value.


    To retrieve the value of an initial parameter from inside a servlet, call the
    getInitParameter method on the ServletConfig passed by the servlet container to
    the servlet’s init method. The signature of getInitParameter is as follows.


    ```

    java.lang.String getInitParameter(java.lang.String name)

    ```


    In addition, the getInitParameterNames method returns an Enumeration of all initial
    parameter names:


    ```

    java.util.Enumeration<java.lang.String> getInitParameterNames()

    ```


    For example, to retrieve the value of a contactName parameter, use this. String
    contactName = servletConfig.getInitParameter("contactName");


    On top of getInitParameter and getInitParameterNames, ServletConfig offers another
    useful method, getServletContext. Use this method to'
