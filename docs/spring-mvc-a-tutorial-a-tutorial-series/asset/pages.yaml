  md: '# 14 Spring MVC: A Tutorial


    ClassXmlContext and FileSystemXmlApplicationContext. Both expect an XML document
    or multiple XML documents that contain information on the beans that it will manage.
    A ClassPathXmlApplicationContext will try to find the configuration files in the
    class path whereas a FileSystemXmlContext will try to find them in the file system.


    For example, here is code to create an ApplicationContext that searches for config1.xml
    and config2.xml files in the class path.


    ```

    ApplicationContext context = new ClassPathXmlApplicationContext(new String[] {"config1.xml",
    "config2.xml"});

    ```


    To obtain a bean from the ApplicationContext, call its getBean method. Product
    product = context.getBean("product", Product.class);


    The getBean method above allows for a bean with the id that is of type Product.


    # Note


    Ideally, you only need to create an ApplicationContext in a test class, and your
    application should not know that it is being managed by Spring. With Spring MVC
    you do not deal with ApplicationContext directly. Instead, you use a Spring servlet
    to handle the ApplicationContext.


    # XML-Based Spring Configuration


    Spring supports XML-based configuration since version 1.0 as well as annotation-based
    configuration starting version 2.5. The following section discusses how an XML
    configuration file would look like. The root element of a Spring configuration
    file is always beans.


    ```

    <?xml version="1.0" encoding="UTF-8"?>

    <beans xmlns="http://www.springframework.org/schema/beans"

    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"

    si:schemaLocation="http://www.springframework.org/schema/beans http://www.springframework.org/schema/beans/spring-beans-3.0.xsd">

    ...

    ```'
