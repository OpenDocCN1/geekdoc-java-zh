  md: "# The choose, when and otherwise Tags\n\nThe **choose** and **when** tags act\
    \ similarly to the **switch** and **case** keywords in Java, that is, they are\
    \ used to provide the context for mutually exclusive conditional execution. The\
    \ **choose** tag must have one or more **when** tags nested inside it, and each\
    \ **when** tag represents a case that can be evaluated and processed. The **otherwise**\
    \ tag is used for a default conditional block that will be processed if none of\
    \ the **when** tags' test conditions evaluates to **true**. If present, **otherwise**\
    \ must appear after the last **when**.\n\n*choose* and *otherwise* do not have\
    \ attributes. *when* must have the test attribute specifying the test condition\
    \ that determines whether the body content should be processed.\n\nAs an example,\
    \ the following code tests the value of a parameter called **status**. If the\
    \ value of **status** is **full**, it displays “You are a full member”. If the\
    \ value is **student**, it displays “You are a student member”. If the parameter\
    \ **status** does not exist or if its value is neither **full** nor **student**,\
    \ the code displays nothing.\n\n```\n<c:choose>\n  <c:when test=\"${param.status=='full'}>\n\
    \    You are a full member\n  </c:when>\n  <c:when test=\"${param.status=='student'}>\n\
    \    You are a student member\n  </c:when>\n</c:choose>\n```\n\nThe following\
    \ example is similar to the preceding one, but it uses the **otherwise** tag to\
    \ display “Please register” if the **status** parameter does not exist or if its\
    \ value is **not full** or **student**:\n\n```\n<c:choose>\n  <c:when test=\"\
    ${param.status=='full'}>\n    You are a full member\n  </c:when>\n  <c:when test=\"\
    ${param.status=='student'}>\n    You are a student member\n  </c:when>\n  <c:otherwise>\n\
    \    Please register\n</c:choose>\n```"
  merge: -1
  pgno: 183
- img_proc: true
  md: "# Iterator Actions\n\nIterator actions are useful when you need to iterate\
    \ a number of times or over a collection of objects. JSTL provides two tags that\
    \ perform iterator actions, forEach and forTokens, both of which are discussed\
    \ in the following sections.\n\n# The forEach Tag\n\nforEach iterates body content\
    \ a number of times or iterates over a collection of objects. Objects that can\
    \ be iterated over include all implementations of java.util.Collection and java.util.Map,\
    \ and arrays of objects or primitive types. You can also iterate over java.util.Iterator\
    \ and java.util.Enumeration, but you should not use Iterator or Enumeration in\
    \ more than one action because neither Iterator nor Enumeration will be reset.\n\
    \nThe syntax for forEach has two forms. The first form is for repeating the body\
    \ content a fixed number of times:\n\n```\n<c:forEach var=\"varName\" begin=\"\
    begin\" end=\"end\" step=\"step\">\n  body content\n</c:forEach>\n```\n\nThe second\
    \ form is used to iterate over a collection of objects:\n\n```\n<c:forEach items=\"\
    collection\" [var=\"varName\">\n  [varStatus=\"varStatusName\"] [begin=\"begin\"\
    ] [end=\"end\"]\n  [step=\"step\"]>\n  body content\n</c:forEach>\n```\n\nThe\
    \ body content is JSP. The forEach tag’s attributes are given in Table 9.6."
  merge: -1
  pgno: 184
- img_proc: true
