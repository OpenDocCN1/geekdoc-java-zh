    </beans>

    ```


    You can add more schemas to the schemaLocation attribute if you need more Spring
    functionality in your application. In addition, you can split your XML configuration
    into multiple files to make it more modular. Implementations of ApplicationContext
    are designed to read multiple configuration files. Alternatively, you can have
    a main XML configuration file that imports other configuration files.


    Here is an example of importing three other XML configuration files from a main
    configuration file.


    ```

    <?xml version="1.0" encoding="UTF-8"?>

    <beans xmlns="http://www.springframework.org/schema/beans" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
    xsi:schemaLocation="http://www.springframework.org/schema/beans http://www.springframework.org/schema/beans/spring-beans-3.0.xsd">


    <import resource="config1.xml" />

    <import resource="module2/config2.xml" />

    <import resource="resources/config3.xml" />

    ..

    </beans>

    ```


    You learn the other subelelements of <beans> in the next section.


