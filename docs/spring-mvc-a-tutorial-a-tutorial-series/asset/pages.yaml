    \n      http://www.springframework.org/schema/beans\n      http://www.springframework.org/schema/beans/spring-beans.xsd\n\
    \      http://www.springframework.org/schema/context\n      http://www.springframework.org/schema/context/spring-\n\
    \      \">\n<context:component-scan base-package=\"com.example.controller\"/>\n\
    \n<!-- -- -->\n</beans>\n```\n\nYou would want to make sure all controller classes\
    \ are part of the base package. At the same time, you don't want to specify a\
    \ base package that is too wide (say, by specifying com.example instead of com.example.controller)\
    \ because this would make Spring MVC scan irrelevant packages.\n\n# The RequestMapping\
    \ Annotation Type\n\nInside a controller class you write request handling methods\
    \ that each handle an action. To tell Spring which method handles which action,\
    \ you need to map URIs with methods using the org.springframework.web.bind.annotation.RequestMapping\
    \ annotation type.\n\nThe RequestMapping annotation type does what its name implies:\
    \ map a request and a method. You can use @RequestMapping to annotate a method\
    \ or a class.\n\nA method annotated with @RequestMapping becomes a request-handling\
    \ method and will be invoked when the dispatcher servlet receives a request with\
    \ a matching URI.\n\nHere is a controller class with a RequestMapping-annotated\
    \ method.\n\n```\npackage com.example.controller;\n```"
