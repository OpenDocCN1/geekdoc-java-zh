    There are two ways of handling uploaded files, by using the Commons FileUpload
    component or by taking advantage of the Servlet 3 native file upload feature.
    The accompanying examples for this chapter showed how to use both approaches.


    You also learned how to use HTML 5 to support multiple file upload and enhance
    user experience on the client side by utilizing the File API.'
