    # Note


    The body content of a JSTL tag can be empty, JSP, or tagdependent.


    # General-Purpose Actions


    The following section discusses three general-purpose actions in the Core

    library used for manipulating scoped variables: out, set, remove.


    # The out Tag


    The out tag evaluates an expression and outputs the result to the current

    JspWriter. The syntax for out has two forms, with and without a body

    content:


    ```

    <c:out value="value" [escapeXml="true|false"]

    [default="defaultValue"]/>

    ```


    ```

    <c:out value="value" [escapeXml="true|false"]

    default value

    </c:out>

    ```


    # Note


    In a tag''s syntax, [ ] indicates optional attributes. The underlined

    value, if any, indicates the default value.'
