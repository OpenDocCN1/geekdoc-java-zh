    # param


    The param implicit object is used to retrieve a request parameter. This object
    represents a Map containing all the request parameters. For example, to retrieve
    the parameter called userName, use one of the following:


    ```

    ${param.userName}

    ${param["userName"]}

    ```


    # paramValues


    The paramValues implicit object is used to retrieve the values of a request parameter.
    This object represents a Map containing all request parameters with the parameter
    name as the keys. The value for each key is an array of strings containing all
    the values for the specified parameter name. If the parameter has only one value,
    it still returns an array having one element. For example, to obtain the first
    and second values of the selectedOptions parameter, you use the following expressions:


    ```

    ${paramValues.selectedOptions[0]}

    ${paramValues.selectedOptions[1]}

    ```


    # header


    The header implicit object represents a Map that contains all request headers.
    To retrieve a header value, use the header name as the key. For example, to retrieve
    the value of the accept-language header, use the following expression:'
