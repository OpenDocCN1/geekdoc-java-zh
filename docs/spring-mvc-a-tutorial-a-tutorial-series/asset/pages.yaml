  md: '# # Chapter 9

    JSTL


    The JavaServer Pages Standard Tag Library (JSTL) is a collection of custom tag
    libraries for solving common problems such as iterating over a map or collection,
    conditional testing, XML processing, and even database access and data manipulation.


    This chapter discusses the most important tags in JSTL, especially those for accessing
    scoped objects, iterating over a collection, and formatting numbers and dates.
    If you are interested to know more, a complete discussion of all JSTL tags can
    be found in the JSTL Specification document.


    # # Downloading JSTL


    JSTL is currently at version 1.2 and defined by the JSR-52 expert group under
    the Java Community Process (www.jcp.org). The implementation is available for
    download from java.net:


    ```

    http://jstl.java.net

    ```


    There are two pieces of software you need to download, the JSTL API and the JSTL
    implementation. The JSTL API contains the javax.servlet.jsp.jstl package, which
    consists of types defined in the JSTL specification. The JSTL implementation contains
    the implementation classes. You must copy both jar files to the WEB-INF/lib directory
    of every application utilizing JSTL.'
  merge: -1
  pgno: 174
- img_proc: true
  md: '# JSTL Libraries


    JSTL is referred to as the standard tag library; however, it exposes its actions
    through multiple tag libraries. The tags in JSTL 1.2 can be categorized into five
    areas, which are summarized in Table 9.1.


    | Area | Subfunction | URI | Prefix |

    | --- | --- | --- | --- |

    | Core | Variable Support Flow Control URL Management Miscellaneous | http://java.sun.com/jsp/jstl/core
    | c |

    | XML | Core Flow Control Transformation | http://java.sun.com/jsp/jstl/xml |
    x |

    | 118n | Locale Message formatting Number and date formatting | http://java.sun.com/jsp/jstl/fmt
    | fmt |

    | Database Functions | SQL Collection length String manipulation | http://java.sun.com/jsp/jstl/sql
    http://java.sun.com/jsp/jstl/functions | sql fn |


    Table 9.1: JSTL Tag Libraries


    To use a JSTL library in a JSP page, use the taglib directive with the following
    format:


    <%@ taglib uri="uri" prefix="prefix" %>


    For instance, to use the Core library, declare this at the beginning of the JSP
    page:


    <%@ taglib uri="http://java.sun.com/jsp/jstl/core" prefix="c" %>


    The prefix can be anything. However, using the convention makes your code look
    more familiar to the other developers in your team and others'
