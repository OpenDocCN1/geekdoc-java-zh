    # Internationalizing Spring MVC Applications


    Internationalizing and localizing your application require you to


    +   1. isolate textual components into properties files

    2. be able to select and read the correct properties file This section elaborates
    the two steps and provides a simple example.


    # Isolating Textual Components into Properties Files


    An internationalized application stores its textual elements in a separate properties
    file for each locale. Each file contains key/value pairs, and each key uniquely
    identifies a locale-specific object. Keys are always strings, and values can be
    strings or any other type of object. For example, American English, German, and
    Chinese you will have three properties files, all of which will have the same
    keys.


    The following is the English version of the properties file. Note that it has
    two keys: greetings and farewell.


    ```

    Greetings = Hello

    farewell = Goodbye

    ```


    The German version would be as follows:


    ```

    greetings = Hallo

    farewell = Tschuß

    ```'
