  md: '# 338 Spring MVC: A Tutorial


    +   - an optional load-on-startup element

    - an optional run-as element

    - an optional enabled element

    - an optional async-supported element

    - an optional multipart-config element

    - zero or more security-role-ref element


    At a minimum a servlet must contain a servlet-name and a servlet-class element,
    or a servlet-name element and a jsp-file element. The servlet-name element defines
    the name for that servlet and must be unique throughout the application.


    The servlet-class element specifies the fully qualified class name of the servlet.


    The jsp-file element specifies the fully path to a JSP page within the application.
    The full path must begin with /.


    The init-param subelement can be used to pass an initial parameter name and value
    to the servlet. The element descriptor of init-param is the same as context-param.


    You use the load-on-startup element to load the servlet automatically into memory
    when the servlet/JSP container starts up. Loading a servlet means instantiating
    the servlet and calling its init method. You use this element to avoid delay in
    the response for the first request to the servlet, caused by the servlet loading
    to memory. If this element is present and a jsp-file element is specified, the
    JSP file is precompiled into a servlet and the resulting servlet is loaded.


    load-on-startup is either empty or an integer value. The value indicates the order
    of loading this servlet when there are multiple servlets in the same application.
    For example, if there are two servlet elements and both contain a load-on-startup
    element, the servlet with the lower load-on-startup value is loaded first. If
    the value of the load-on-startup element is empty or is a negative number, it
    is up to the web container to decide when to load the servlet. If two servlets
    have the same load-on-startup value, the loading order between the two servlets
    cannot be determined.'
