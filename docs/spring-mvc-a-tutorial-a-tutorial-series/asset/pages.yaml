  md: "# Conditional Actions\n\nConditional actions are used to deal with situations\
    \ in which the output of a page depends on the value of certain input, which in\
    \ Java are solved using if, if, ... else, and switch statements.\n\nThere are\
    \ four tags that perform conditional actions in JSTL: if, choose, when, and otherwise.\
    \ Each will be discussed in a section below.\n\n# The if Tag\n\nThe if tag tests\
    \ a condition and processes its body content if the condition evaluates to true.\
    \ The test result is stored in a Boolean object, and a scoped variable is created\
    \ to reference the Boolean object. You specify the name of the scoped variable\
    \ using the var attribute and the scope in the scope attribute.\n\nThe syntax\
    \ of if has two forms. The first form has no body content:\n\n```\n<c:if test=\"\
    testCondition\" var=\"varName\"\n[scope={page|request|session|application}]/>\n\
    ```\n\nIn this case, normally the scoped object specified by var will be tested\
    \ by some other tag at a later stage in the same JSP.\n\nThe second form is used\
    \ with a body content:\n\n```\n<c:if test=\"testCondition [var=\"varName\"\n[scope={page|request|session|application}]}>\n\
    \  body content\n</c:if>\n```\n\nThe body content is JSP and will be processed\
    \ if the test condition evaluates to true. The list of the if tag’s attributes\
    \ is given in Table 9.5."
  merge: -1
  pgno: 181
- img_proc: true
  md: "# Chapter 9: JSTL 175\n\n| Attribute | Type | Description |\n| --- | --- |\
    \ --- |\n| test+ | Boolean | The test condition that determines whether any existing\
    \ body content should be processed |\n| var | String | The name of the scoped\
    \ variable that references the value of the test condition; the type of var is\
    \ Boolean |\n| scope | String | The scope of the scoped variable specified by\
