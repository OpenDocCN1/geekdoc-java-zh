    long axial road had not been implemented. Previous Javanese towns did not have
    such spatial axes. The main function of roads is mostly economic in connecting
    the capital city to the domains of lungguh, from rural and remote areas to capital
    towns (kuta praja) and cities (kuta negara). Since 1830, the Dutch colonial rule
    forced a cultivation system in Java. From then until 1850, most villagers either
    from desa wanua or from desa lungguh had to pay taxed and commodities to the colonial
    regime in addition to their routine tax (pajeg) and tribute (pupundhutan) to their
    local ruler.


