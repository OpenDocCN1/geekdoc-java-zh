    Chapter One


    Aesthetics in Javanese Culture and Tradition


    What is aesthetics in Javanese culture? Why are aesthetics and ethics in Javanese
    society interchangeable? This chapter attempts to deal with these questions. In
    order to understand the relationship between aesthetics and ethics in Javanese
    tradition, this chapter argues that both have the same foundation and function
    in Javanese culture and society. In order to do so, the chapter applies a hermeneutical
    analysis that examines and scrutinizes the meanings of local concepts and their
    phenomena in works of art. The purpose is to unfold the thought and sensibility
    of Javanese concepts in dealing with art and beauty. Concepts and phenomena related
    to aesthetic experience will be examined, scrutinized, and unfolded to divulge
    the reality of the Javanese world.


    Javanese Culture in the Indonesian World


    Even though Javanese culture is geographically established in Central Java, in
    which Surakarta and Yogyakarta are the centers, its cultural influence in Indonesia
    is widespread and predominant. Concerning its dominant populations, the Javanese
    way of life plays an important role in Indonesian politics and culture. Since
    aesthetics in society is about ideas, tastes, information, and expressions, studying
    its phenomena and reality is one of the most effective ways to understand the
    country’s way of life and its values.'
