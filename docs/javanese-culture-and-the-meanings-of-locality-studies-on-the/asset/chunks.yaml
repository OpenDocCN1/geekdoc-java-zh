    The origin of `wayang` is from the pre–Hindu-Buddhist times. Originally, `wayang`
    was performed with wood-carved puppets. The modern `wayang` is performed with
    leather puppets or human performers. `Wayang` in Javanese society is an educationally
    entertaining performance for all ages. What is important to deliver in `wayang`
    performance is to sustain Javanese cultural values generation to generation. The
    all-night performance is directed and performed by a `dhalang` who plays the shadow
    puppets, music, and voices of all characters.


    In terms of aesthetics, `wayang` is a demonstration of experience about empathy
    (`welas`), shame (`isin`), compassion (`asih`), joy (`seneng`), respect (`hormat`),
    and hesitation (`sungkan`). The fight between culture and natural rawness is represented
    by the `satrias` and the `raksasa`. Tension between antagonistic elements and
    aspects becomes the most interesting part of aesthetic experience in `wayang`
    performance. Nonetheless, the drama of Javanese ideals comes into play with various
    tests and ordeals before the main character is able to restore and establish the
    world in order. The most important thing of `wayang` performance is for its audience
    to align itself (`nglaras`) to the contemporary world with full awareness of ancient
    wisdom and teaching. The purpose of `nglaras` is to become a `satria budhi luhung`
    (a well-mannered person with cultivated characters).


    ### Batik


    `Batik` represents Javanese graphic design as well as painting. The art of `batik`
    is emphasized on the pattern dated back to pre–Hindu-Buddhist influence. `Mbatik`
    in the Javanese language means engraving and painting in details. Geometrical
    patterns with double spiral motifs are dominant. Its origin is presumably from
    the `Dong-son` metal work culture (Bulbeck 2004, pp. 428–39). Repetitive form
    and an earth color scheme on white cotton dominate the design of `batik`. However,
    black, brown, and dark yellow are foremost in most classic `batik`. The most important
    thing for classic `batik` design is to harmonize (`nglaras`) the pattern and color
    in a gentle and delicate manner. Indeed, the aesthetic questions of `batik` are
    simple, concerning its inspiring capacity with motifs and patterns, its rapturous
    energy of uniqueness, and its provocative abstraction of figures (McCabe-Elliot
    and Brake 2004, p. 198). Avoiding something bizarre and blunt in the composition
    is obvious. The message of `batik` is to celebrate the world in the background.
    Subtlety of festivity belongs to the purpose of what `batik` design is all about.


    Indeed, there are versions of `batik` design for occasional celebration and daily
    use. The daily clothes of ordinary people are `lurik`. The common people wear
    `lurik` instead of classic `batik`. Technically speaking `lurik` is `ikat` textile.
    The difference between `batik` and `lurik` is not only its pattern, but also its
    production method and process. By design, `lurik` is simple and less elaborate
    in pattern and color. This is understandable because of its weaving technique
    of single or double `ikat`. Most `lurik` have only simple line pattern and a dark
    indigo color. All this is to incorporate the notion of modesty (`sa’ madya`) in
    the life of common people. Wearing `lurik` is to identify oneself as commoner.
    In many cases, only `priyayi` (the ruling class) people wear `batik`. Even though
    it is not obvious in their appearances, subtlety in social status in Javanese
    culture and tradition is shown in the clothes they wear. The sense of `nglaras`
    is demonstrated with the way people wear in casual and formal occasions.


    ### Gamelan


    The music of `gamelan` is an ensemble of traditional Javanese instruments. It
    is a complex system of percussion, wind, and string instruments. The rhythmic
    structure of `gamelan` is rooted in the spiritual and social fabric of the Javanese
    people. The patterns of `gamelan` are often cyclical, reflecting the circular
    nature of life and belief. The harmony of `gamelan` aims to create a state of
    balance among the performers.

