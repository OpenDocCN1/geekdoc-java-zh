- fmt: '

    In contrast to court arts, folk arts live and sustain the living philosophy of
    Javanese culture in a blunt way (`ngoko`). Folk arts in Javanese daily life are
    understood under the notion of `tontonan kawula`, meaning performance for commoners.
    Beyond its culturally pleasing capacity, folk arts play very important roles in
    preserving, developing, and sustaining Javanese culture and tradition. Unlike
    court arts, folk arts give more room for innovations and improvisations without
    having to follow traditional patterns and canons religiously.


    The process of enculturation in the Javanese sense is understood under the notion
    of `laras`, `nglaras`. Accordingly, bringing forth different elements from various
    sources into synthesis of form, expression, and articulation belongs to the disposition
    of the Javanese way of making things. The sense of `nglaras` is not simply about
    compromise. `nglaras` in the broadest sense is to work out everything foreign
    in compliance with Javanese values and customs. It is properly understood as the
    way of inner and mental exercise (`tirakat`) to accept something new and strange
    and to work it out internally. The aim of this inner exercise is to encounter
    the antagonistic elements and aspects that enable them to be fit with Javanese
    culture. Frankly speaking, it is the way Javanese people domesticate and tame
    (`nglulutake`) and foreign elements coming into their realm of culture.


    ## Arts, Beliefs, and Values


    Although most thoughtful concepts concerning Javanese tradition are originated
    from Sanskrit culture, locally customized contextuality has been made for being
    properly synchronized with what has been already available in indigenous concepts.
    Literacy and script have been adopted from India under the influence of Hindu
    and Buddhism at the beginning of the first century. Since then, Sanskrit culture
    has been adopted by Javanese tradition within the framework of syncretism with
    indigenous pantheistic animism.


    Traditionally, Javanese culture puts the principle of ethics for respect to any
    being—living or natural elements—within the system of beings as a whole. In the
    Javanese sense this wholeness (`utuh manunggal`) is conceived as the purpose of
    the Javanese world. Being obsessed with this purpose often leads to intolerance
    for differences; in certain ways it leads toward a prophetic mission for colonializing
    others on behalf of the wholeness of the Javanese world.


    Traditionally, arts, values, and meanings in Javanese society find their common
    ground on the subject of symbolism. Despite the dualistic patrimonial social structure
    of the lords (`priyayi`) and the commoners or ordinary people (`kawula`, `wong
    cilik`), the Javanese society maintains and regards the subtlety of conducts and
    works as part of their aesthetic worthiness. Molding myriad forms, things, ideas,
    and fashions into a coherent whole is culturally a Javanese way of making things.
    This act of molding is understood by Javanese people under the concept of `manunggal`,
    which is derived from the word `tunggal`, meaning single, one, and entity. It
    is probably not an exaggeration to say that Javanese culture is always striving
    to syncretically integrate everything with the Javanese being. Based on this most
    likely cultural obsession, Javanese imperialism, tolerance, and pretentiousness
    come to be understandable.


    Bringing everything coming from outside Javanese cultural being is Javanese cultural
    strategy in dealing with otherness. The strategy of `manunggal` is well known
    among Javanese people as `nglaras`. Indeed, subtlety and decency play important
    roles in the act of `nglaras`. Thus, `nglaras` is experiencing the being of something
    with intentional intercourse for establishing and developing integration into
    the Javanese world.


    The influence of Javanese culture in the Indonesian world is in many respects
    dominant because of its underlying principle of making up with others to establish
    and to develop newly emerging things within the sensibly learning system of `nglaras`.
    Accordingly, it is not simply to avoid confrontations or to deny the contradictions.
    Rather, `nglaras` is a flexible approach to work out any differences based on
    the strength of silence for harmony (`cocok`, `rukun`) and oneness (`tunggal`,
    `manunggal`). The Javanese people value harmony and unity as their way of life
    (Suseno 1997).


    The Javanese confidence in harmony and in oneness of the world has been establishing
    the sense of purpose of the works of art in myriad forms, matters, and fashions.
    Hence, making in the context of art is `makarya`, that is, to bring forth beings
    into harmony and wholeness. Only on this condition do the Javanese people understand
    the beautiful as `apik` (good), `slamet` (safe), `asri` (naturally delighted),
    `rahayu` (well-being), and `lestari` (sustainable).


    To come into harmony and oneness, Javanese people have to learn to control themselves
    to behave properly according to Javanese ethics (`karma`) (Berman 1998, p. 17).
    For Javanese people, harmony (`rukun`) and oneness (`utuh manunggal`) are indispensable
    from the world they understand. Harmony is conceived as being comfortable and
    in compliance with others not only based on respect and mutual understanding,
    but also based on fitting in hierarchical ordering system of beings.


    In social life as well as in artistic composition, being harmonious is being able
    to put oneself on proper seat in the whole system. Any being in this cultural
    system has its own place with a well-established structure that works in the service
    of oneness. Subsequently, subsuming of egoistic interest (`pamrih`) to the community
    of beings in which the harmonious relation (`rukun`) of members to each other
    is its indwelling causes. Finding the middle way or compromise is the best option
    for the Javanese way of life, instead of competition of ideas or records in a
    sportive way. Embracing rivals for compromise is conceived as a peaceful way to
    sustain the Javanese world.


    Any work of art in its essential way is meant to achieve the state of being in
    which the inspiring silence is. Indeed, deep contemplation (`samadi`) is necessarily
    done (Atkinson and Errington 1990, p. 54). Even though in many cases mysticism
    comes into play to imbue the importance of contemplation, the sense of `samadi`
    lies in the readiness for listening. Nevertheless, it does not mean that meditation
    is simply a concentration in the search for form and expression. Rather, the most
    important thing for achieving the inspiring silence through meditation is to pre-empt
    judgment and to be open and ready to listen to what is going to come to mind.


    Liberating the self from any interest, pretension, and prejudice is the way of
    making within the concept of `makarya`. The Javanese proverb says sepi ing pamrih
    rame ing gawe, meaning free yourself from any interest and keep doing the work.
    Making the work of art in this way is to get into the work and within the work
    in the search for wholeness. Bringing forth every element together is to let its
    being be revealed according to its own properties and qualities. Making in terms
    of `makarya` is not something apart from recognizing and bringing forth its nature
    to be close with humanity through his or her hand. It is the reason why work in
    the Javanese tradition is allusively articulated with the word `anasta`, literally
    meaning hand. Is it not because of the human hand that the world is established
    and developed?

