    where wet rice cultivation find its most favorable location, show us the field
    condition that consolidation of power was not easy. The situation of the past
    was dominated by steep and arduous topographical sites as well as dense tropical
    forests. The geographical setting confirms the fact that ancient rulers should
    have lived more coexistentially, rather than as a dominant conqueror and superior
    emperor. The consolidation of power under a single ruler could have not been easy
    without the support of monasteries. In the world of asceticism like in ancient
    Java, the ruler was seen as a powerful person, not only in terms of being a political
    leader, but also as a spiritually exceptional person.


    ![](Images/Figure_2.5.jpg)


    Figure 2.5\. The scene of a market (peken) in Java from the eighth century, Karmawibangga
    gallery of Borobudur. Photo courtesy of Rudi Badil and Katalis Publishing (Badil
    1989: 136).


    How did the state concept of early negara develop in other parts of Indonesia
    and what were its consequences for urbanism? Hitherto, the traces and inscriptions
    concerning negara have been hard to find in Kutei of East Borneo from the first
    to the fifth century, but they have been revealed in West Java. The four inscriptions
    of Ciaruteun at Bogor from 450 AD written in Pallava script confirm the existence
    of three concepts of settlement related to the idea of state: negara, puri, and
    sibira. It is, however, less apparent or even confusing whether the meaning of
    the word sibira is pura or temple. Since the use of the concept in epigraphic
    evidence on Purnawarman of West Java is probably associated with holy place, the
    word is perhaps close to the Indonesian word vihara or biara, meaning monastery.
    Even though it is difficult to draw a clear picture of the early township in Java
    from archaeological findings, there are two constituent institutions of the Indic
    concept of negara in Tarumanegara from the Purnawarman’s inscriptions, namely
    sthana, the seat of ruler or palace, and pura, the center of state rituals.


    Regarding its etymology, the word sibira is not a Sanskrit word; its possible
    meaning is close to pura, which is essential and decisive for the concept of negara.
    Pura was literally a holy place where state rituals and ceremonies took place.
    As urban institutions, puri and ksetra (the holy area for pura) could have constituted
    the idea of center. Despite their religious importance, they were essentially
    insufficient to constitute the idea of center if they were not supported by a
    permanent market. The indigenous market in ancient Javanese society was not only
    economically important, but also culturally significant as the real center of
    ancient Javanese life, as shown on the buried Borobudur’s Karmawibhangga panels.
    The ancient Javanese word for market was p’ken or peken, literally meaning gathering,
    interacting, exchanging, and coming together.


    Then the emergence of township and statehood of negara would have been inconceivable
    without comprising the three essential institutions of centers for a state settlement:
    pura (the place of state rituals and ceremonies), puri (the seat of ruler), and
    peken (the place of economic exchange and socialization). Nevertheless, residential
    areas (paumahan), state institutions (sarana), and their infrastructure (prasarana),
    were important as well.


    Even though in early negaras urban laws and codes for infrastructure and domain
    were not properly implemented, there were special codes and manners called tata
    krama that were applied for social interaction within the core of negara such
    as language (basa), dress/attire (busana), and manners (jawa). Such codes were
    not in use among villagers or rural people. According to the inscription of Mpu
    Ketudhara from 804, the consequences of violating codes and laws (tata karma)
    were executed in the court of justice (pakaranan) led by sang tuhan. Then fines
    and rewards were granted by the court for individuals with the status of citizen
    (warga negara).


    ![](Images/Figure_2.6.jpg)


    Figure 2.6\. The ruler (rakrya) in his pura, Karmawibangga panel of Borobudur
    from the seventh to eighth centuries. The figure of a crowned elephant and decorated
    umbrella, are signs of kingship with an inscription on the relief, Cakrarvartin.
    With his celestial Cakrarvartin status, the ruler has successfully unified several
    negaras under his control. The ritual of Cakrarvartin inauguration was conducted
    by the high priest and celebrated as the birth of the cosmos. Photo courtesy of
    Rudi Badil and Katalis publishing (Badil 1989: 89).


    The use of the three centers (pura-puri-peken) could have been relevant with the
    basic exigency for the establishment of urbanity in ancient Java. The focus of
    negara since the fifth century had always been the kraton or the center of political,
    cultural, and spiritual hegemony. Beyond the center, domains had always been only
    the parts of the agricultural production of desa. Accordingly, high-density settlement
    was not necessary for ancient Java because the center had not required them. What
    the center needed was the agricultural products, taxes, and tributes. In addition,
    the concentration of power in the Javanese tradition was not equal with the concentration
    of settlement because territorially the defense system of ancient negaras was
    distributed to each desa or lungguh of mancapat and not concentrated in the capital
    town.


    The notion of settlement (paumahan) was mostly associated with special occupation
    of its inhabitants or the name of its landlord (bhogi of lungguh). Lack of archaeological
    excavations on the sites where the Tarumanegara’s inscriptions had been found
    have left us with no further trace on the ancient towns. The only trace we can
    see from Tarumanegara, beyond its inscriptions, is its name; it comes from the
    old Sundanese word tarum, meaning indigo plant. Tarumanegara must have been well
    associated with indigo. The use of indigo in ancient Javanese society was widely
    used to color silk and cotton textiles. Since the location of Tarumanegara’s inscriptions
    was far inland from the river Tarum, the question concerning the possible location
    of its capital state in the today rice field town of Karawang region between the
    fifth and seventh century remains open. The newly found Hindu-Buddhist candi complex
    at Batujaya—the villages of Segaran and Telagajaya—Karawang nearby the river Tarum—Citarum—might
    give us a clearer and more precise idea of the location of the early Hindu-Buddhist
    Kingdom in West Java (Manguin and Indradjaja 2011, pp. 113–36; Perpustakaan Nasional
    Republik Indonesia 2015).'
