    `lakon` 相关。正如影皮戏（`wayang kulit`）所示，地点的理念与其事件及其制造者密不可分，而不是场所的建筑。建筑和居住无非是 `nglakoni`（经历）同时也也是生活。`Nglakoni`
    源于词 `laku`。


