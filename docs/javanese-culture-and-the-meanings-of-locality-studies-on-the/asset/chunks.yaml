  trans: '


    爪哇文化中艺术作品的真实目的究竟是什么？正如前面提到的，和谐与统一是爪哇世界目标密不可分的，即美化整体生命的存在。美化世界（`memayu ayuning
    bhawana`）本质上是人类在地球上所有工作的目的。因此，包容任何个体的欲望和需求是能够投入所有努力以进入整体整合的法则和原则的前提。这种整合体现在不丧失其原始源痕迹的合成特质中。作为人造物，作品被构想为一个拥有自身力量的新生命，这种力量在爪哇传统中被称为
    `greget`（Wibisono and Kurniasih 2002, p. 264）。


    任何成功的艺术品都被认为拥有一种 `greget` 的精神力量（Suharto 1998），它能引发人类强烈的情感、共鸣的感性，以及与观众建立联系的能力。在
    `greget` 的概念下，艺术品能够在整体构图的和谐感带出人类体验。相应地，作品系统中的任何部分都展示了其对作品中整个故事的重要作用和贡献。


    ### 完美与稳定


    完美（`utuh`）、稳定（`jejeg`）和无私（`sepi ing pamrih`）属于爪哇文化认为具有审美价值的内容。在爪哇文化中，作品的完美（`utuh,
    sampurna`）是指作品是开放式的，其开始和结束与一个从微观宇宙到宏观宇宙增长的无限循环达成一致。这种完美的基础基于一种信念：每个生命都是相同的，并且包含了存在的力量。没有这种身份身份，生命无法作为一个整体站立。


    稳定（`jejeg`）是艺术品参与整体构图或系统的另一个条件。在自然法则内排列是实现构图稳定性的重要原则之一。稳定的概念也是指作品具有本质特质，不虚假或隐藏任何东西。`jejeg`的最广义适用于某种持久的崇拜（`sajen`）和尊重（`kajen`）。缺乏稳定的艺术品在性格意义上是不尊重的，因为它不包含任何使其完整的建设性元素和结构。


    ### 超脱利益


    此外，获得美之本质必然是脱离任何利益（`pamrih`）（Mulder 2005, p. 18）。利益绝不存在没有控制、持有和占有的意愿的情况下。`pamrih`
    意义上的利益是为了自身利益的自私追求，并与对整体福祉的不尊重相关。在艺术品中，利益危害到爪哇世界的稳定性，而爪哇世界是在传统的社区认同结构内建立并维持的。任何挑战传统价值观的个人主义特征和倾向都可能严重危害集体建立的社区以及统一。


    爪哇传统下艺术家的创造和创新努力，通过在尊重传统的框架内持续工作来揭示改进和发现，是微妙且细致的。对于爪哇人来说，不利的因素不是创造力，而是这种创造能力对于自我概念的过度，这可能导致自大、傲慢和无知的状态。尽管如此，爪哇世界已经从现代性中学到了许多经验，能够通过
    `nglaras` 在寻求自然和谐与统一的同时，尊重当地资源并兼顾个人的艺术尝试。


    ## 爪哇美学概念


    总而言，只要作品内部没有导致我们陷入意义混乱的内在冲突，爪哇艺术世界就是和谐且完整的，呈现出良好的形状（`apik`）。好（`apik`）被理解为某种程度完整且组织良好。`apik`
    的美学概念强调作品内部秩序的必要性，这种秩序为元素提供了整体的角色和贡献。


    此外，`apik` 的意义是唤起一种万事如良好状态的感觉。在 `apik` 的意义内，系统中的每个元素都根据角色和贡献的特定结构相互联系，从而产生“一人为了众，众亦然”。此外，`apik`
    实际上适用于逻辑上相关的系统，使作品能够被视为具有特定意义标记的事物。简而言之，`apik` 是组织有序和完美存在物的基础概念。


    ### Rahayu 与 Ayu


    对于爪哇人来说，只有人类（而非艺术品）如果处于 `rahayu` 概念或简练的 `ayu` 下，其对人类的影响是健康且令人愉悦的，才称得上是美的。`rahayu`
    的愉悦在于艺术品能够为人类带来健康领域和影响的能力。`Rahayu` 是一个描述女性特质的美学概念，具有优雅的动作、比例协调的姿态和形态，以及慈悲散发的氛围。在许多情况下，`ayu`
    或 `rahayu` 也适用于代表女性生命的艺术品。


    正如前面提到的，爪哇人来说的美之意义并非某种出于自我沉溺的愉悦。相反，美的意义本质上被体验为一种整体感，其中自我与他人在精神身份上达成一致。因此，时间坍缩为无限的、富有灵感的沉默（`hening`）。在爪哇美学的
    `rahayu` 视角下，美与和平是不可分割的。它既不是关于漂亮或吸引力的事物，也不是关于感官和视觉吸引力的事物。`rahayu` 作为审美体验的意义是关于作为存在与世界保持完整。它是在宁静中升华的体验。


    ### 美学中的性别


    `rahayu` 的相反概念是 `ganteng`，描述男性的英俊和绅士风。然而，`ganteng` 被奇异地应用于艺术品。与艺术品男性性格相关的另一个概念是
    `gagah`，意味着勇敢、强壮和稳健。美学性格的性别类别大多适用于人类。其他生物通常不属于男性或女性类别来描述其性别性格。


    然而，在表演艺术（如 `wyang wong`）中，女性和男性角色在揭示人类性格方面发挥着重要作用。然而，桥接男性和女性角色之间的对立类别可以在爪哇版《摩诃婆罗多》中的
    `Srikandi` 和 `Puntadewa`，以及爪哇版《罗摩迷衍》中的 `Sarpakanaka` 和 `Laksmana` 角色中揭示。


