    # The concentration of Muslim settlement at the traditional Javanese town center
    has taken place surrounding the town mosque since the end of the sixteenth century.
    Since then the Muslim quarter, called `kauman`, has become an integrated part
    of the Javanese town structure and identity. Occupied mostly by Arabian, Gujarati,
    and native traders, `kauman` is the domain with its own features, as an enclave
    for learning Islamic teachings and reciting Koran. Traders from this Islamic domain
    have enacted as peddlers between the hinterland and coastal vicinities for specific
    commodities: gold, salt, spices, silk, beads, pearls, etc.


    It is presumably not the town and its palace the center of `negara`, but the public
    open space for grand ritual and ceremony called `alun-alun`. However, the question
    remains as to whether Javanese ancient kingdoms are states without towns because
    of simply technical reason or ideological priority. As a matter of fact, the emergence
    of Hindu and Buddhist temples in Java since the eighth century gives us the indication
    that `negara` as a sociopolitically organized community is able to build and establish
    large scale monumental edifice. Why did they not build their town? It has been
    suggested that the artefacts of house, town, and country for Indonesian people
    must have been simply conceived as the stage (Javanese `kelir`) to perform the
    episode of nation spectacle (`lakon`).


    Tearing down historical buildings in post-colonial Indonesia occurred during the
    reigns of Sukarno and Suharto for the sake of politically updating assertion.
    On the other hand, erecting new monuments for asserting the new spirit of reign
    epoch became mandatory. Both modern leaders used the same method in accusing their
    opponents of being anti-state and its ideology.


    The sense of belonging among Indonesians does not lie simply in its geopolitical
    map of history, but deeply rooted in its spiritual origin as the carriers and
    sustainers of the concept of Malay-ness and Java-ness. Accordingly, dwelling and
    sitting are bound up with the necessity for being able to bring everything toward
    oneness through syncretism. Then the rises and falls of `negara` are likely the
    drama of the reigns itself in which the state as a sociopolitically organized
    entity mobilizes people to perform their theater of the ruler cult. The Javanese
    state shares in large with Balinese `negara` in the nineteenth century on this
    intentionality, as observed meticulously by Clifford Geertz (1980).


    ## Historical Continuity and Architectural Concepts


    Historically, `kuta negara` in the Javanese tradition is conceptually sustainable,
    from Singasari, Majapahit, Demak, Kotagede, and Plered to Yogyakarta and Surakarta.
    Although the changes of name and form occur through time, for instance the replacement
    of `pura` with `mesjid agung` (grand mosque), the basic concept of `khita` as
    the political, cultural, and spiritual center of `negara` remains the same. At
    its very core is the emptiness of `alun-alun` guarded by twin banyan trees. Close
    to the emptiness are the seat of ruler and the place of spiritual congregation.
    `Alun-alun`, `kraton`, and `mesjid` are architecturally identical to inner rooms
    of the Javanese house: `sentong tengah`, `sentong kiwa`, and `sentong tengen`.


    The identity of house and town is articulated in the multilayered `dalem`, literally
    meaning inner, inside, home, and unified realm. The most inner domain is the inner
    self (`batin`) of man in which the unity of spirit, mind, and body finds its being.
    `Dalem` is spatiotemporally multilayered in the way of embracing inner and outer
    self within oneness. In the old Malay tradition of Deli Serdang, the idea of house,
    town, and country is conceptually composed of the concept of `jeru` with similar
    meaning with the Javanese `dalem`. Hence the identity of house, town, and country
    is not simply symbolic in the way of projecting the celestial realm on earth.
    Rather, the identity of domains lies in the concept of home in conceptually multilayered
    realms of relationship between human beings and their living place.


    ## The Sacred Domain of Silence


    Understanding the concept of center in Javanese thought, which has predominantly
    occupied the Indonesian polity and culture, must not have overlooked the importance
    of `dalem`, which is in its broadest sense the sacred domain of inspiring silence
    (`nglangut`) and stillness (`hening`). Letting the silence speak to us by meditation
    has been traditionally practiced as the way the Javanese people come up to determination.
    Architecturally, the sacred domain of town such as Yogyakarta is neither in the
    mosque nor in the court or palace, but in its town square. This is the place where
    stillness and silence are. Being guarded by the twin banyan trees, `alun-alun`
    keeps its secrecy in itself.


    From his highest place (`siti hinggil`), the ruler sits and meditates by gazing
    through the space of `alun-alun` between the twin banyan trees and so forth to
    the mountain and sky, and lets from there the stillness and silence speak to him.
    On the highest place there is a chamber within a chamber. The innermost chamber
    (`bangsal manguntur tangkil`) is actually the place where the ruler sits for his
    silence and stillness, whereas its outer chamber is the chamber of the origin
    of being (`bangsal witana`). In daily life, the chambers remain empty. From this
    emptiness, the idea of center is derived symbolically with an architecturally
    modest structure.


    ## The Foundation of Yogyakarta


    As the capital of Mataram Sultanate, Yogyakarta is also one of the most important
    centers of the Islamic Javanese state. The Javanese Mataram Kingdom was in decline
    after Sultan Agung’s death in 1630. After decades of turmoil and power struggle
    in the court elites, Prince Mangkubumi Sukowati had been given a concession to
    build a new kingdom based on the Giyanti agreement. Yogyakarta as the capital
    of the Javanese kingdom was founded after the Giyanti treaty in 1755. According
    to the pact, the Mataram Kingdom was divided into two rulers: Prince Mangkubumi
    in the west and Pakubuwono I in the east.


    The history of Yogyakarta has been depicted with metaphors and symbolic elements
    that are incorporated in buildings, landscape elements, and ornaments; this symbolism
    is manifest in a similar way to the Balinese context (Geertz 1980) because both
    share the same root in Animism and Hindu-Buddhism. The site clearing for the seat
    of his kingdom was begun in 1756. Mangkubumi himself led the site selection and
    opened the site for his `kraton`. The first thing he did was to find land between
    two rivers with a strong axial direction between mountain and sea. In fact, the
    location of the `kraton` is perfect on the plain between the river Winanga and
    Code.

    '
