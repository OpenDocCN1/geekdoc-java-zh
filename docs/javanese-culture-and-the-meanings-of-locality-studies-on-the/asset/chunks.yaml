    A number of scholars (Richter 1994; Jessup 1990; Holt 1967) have presented studies
    on the arts of Java as part of Indonesian culture. Their works have explored forms,
    styles, meanings, and historical aspects of arts and crafts in Indonesia that
    enable us to go further into the question of aesthetics. Indeed, Javanese arts
    are indivisible from its customs and traditions that nurture and sustain its presence
    in its society. In this respect, Javanese arts and aesthetics show their capacity
    as an integrated part of Indonesian culture, which has been studied profoundly
    by many scholars (Anderson 2006; Beatty 1999; Sears 1996; Florida 1995; Pamberton
    1994; Hefner 1985; van Groenendael 1985; and Geertz 1960). Their works not only
    show us many insightful aspects of the Javanese culture, but also show that there
    are many things to be done for further investigations. Among these is the Javanese
    sense of aesthetics, which has been so far short of coverage. As with many other
    cultures and traditions, Javanese culture has its specific and particular intentionality
    that depicts and demonstrates its historical evolution and contextual innovation.


    Even though aesthetics is an indispensable outcome of emotion, expression, impression,
    taste, and feeling, aesthetic experience is, in many ways, inseparable from personal
    judgment and sentiment as well as part of contextual collective values. However,
    in social and practical context, aesthetic matters are mostly conditioned by local
    culture and tradition, in terms of codes, manners, customs, and norms.


    Ostensibly observed, showing feeling in Javanese tradition is a shameful conduct
    or a sign of weakness, even a sin against God (Geertz 1960). Aesthetics in Javanese
    tradition is likely indivisible from ethics—the value and judgment of good or
    bad as well as beauty or ugliness have something to do with courtesy and manner.
    Accordingly, the Javanese tradition seemingly does give a room for common people
    to express their feelings and thoughts. As a matter of fact, in their daily world,
    the Javanese people are aptly to uphold self-control for gestures, mimics, and
    body language with emotional expression or sentimental phrases; this includes
    handling emotional reactions and anger with perseverance. Despite various turbulences
    and crises—ranging from politics, to the economy, to the environment—Javanese
    people are taught by their tradition and culture to be tough and compassionate
    without showing any emotion or affection. All of this is not expected to happen
    overnight, but in childhood intensive self-training begins that involves celibacy,
    fasting, meditation, and other restraints such as from certain food, habits, and
    pleasures.


    As a branch of philosophy for the experience of feeling, aesthetics in Javanese
    culture is challenged by the question of ethics. In some ways, Javanese aesthetics
    is probably not too much about bodily pleasure, but more about well-being and
    good manners. This implies that ethics and aesthetics in Javanese tradition are
    interchangeable (Hughes-Freeland 2008, p. 83).


    This chapter investigates the cultural concepts that represent and work within
    Javanese culture for growth, beauty, and sustainability. The purpose is to explore
    Javanese cultural forces and mechanisms that have been resiliently maintaining
    and developing domination and hegemony over Indonesian political culture since
    1945. This chapter argues that the concept of beauty does not simply affect the
    definition of a cultural identity and boundary, but also aesthetically in cultivating
    the sense of being Javanese in peaceful presence. Everything old and new in the
    world is subject to harmonization toward sustainability, as articulated in the
    Javanese credo: `laras yektine lestari`.


    Why are ethics and aesthetics in Javanese tradition indistinguishable? This chapter
    will deal with the question and argues that both civility and the sense of beauty
    in Javanese culture have the same source and purpose. In order to understand this,
    the chapter will examine and scrutinize the relationship between local concepts
    and its phenomena in various works of art, which are related to and associated
    with Javanese cultural values and customs.


    ## The Javanese World: Bhawana


    Semaoen probably presents one of the best descriptions of the Javanese world in
    the modern age in his novel `Hikayat Kadiroen`, the story of Kadiroen, in the
    chapter “Terjepit” (“Being Squeezed”). The novel was written in 1919 when Semaoen
    was jailed by the Dutch colonial power because of persdelict on his essay in `Sinar
    Hindia`, containing sympathetic support of the Indonesian nationalist movement
    (Semaoen 2000; Maier 2004, p. 171). According to Semaoen’s depiction in his only
    novel, the modern Javanese world has lost its spiritually ordering power. Indeed,
    as a Javanese person, he is not alone. Previously, Javanese populations pertained
    their cultural destiny and nation to the prophetic messages of the Kediri Third
    King, Jayabaya (1135–1157). In the nineteenth century, an influential Javanese
    poet, R. Ng. Ranggawarsita, told us a similar depiction of the world in his famous
    poem “Serat Kalatida,” or message from the Dark Age (jaman kalabendu). The prophetic
    message of Ranggawarsita that was believed to be the destiny of Javanese culture
    still lingers in Javanese populations; the relationship between his message and
    his personal life remains mysterious and influential today (Andjar 1980; Andjar
    1979). Despite the infiltration of the Dutch language and Javanology, Takashi
    Shiraishi and Andjar Any as quoted by Tsuchiya come to the conclusion that Ranggawarsita
    and his world continue to live on in the world of the Javanese language (Tschuchiya
    1990, p. 108). It is a typically Javanese way of thinking of the world that the
    heavenly flourishing world is always in the past or in the future, but it hardly
    deals with the immediate scene of the present.


    In contrast to the past realm, the contemporary world is depicted as hell with
    socially degrading values, spiritually swallowing resources, politically disintegrating
    leadership, and environmentally triggered disasters. All of these are obviously
    supportive of the justification of the patrimonial and prophetic messages of those
    who are not in power at the time because of their own choice or still in struggle
    for. In many ways, the perfect Javanese world is never in present times, but it
    is high above the horizon of the common people’ understanding and is believed
    to come true someday as the realization of the messianic promise of Javanese myths,
    legends, poems, and stories since the Stanza of the King Jayabaya from the twelfth
    century (Florida 1995, p. 273). Most recently, in March 2008, the prominent Javanese
    Indonesian poet W. S. Rendra in his inauguration speech as Doctor Honoris Causa
    at the University of Gadjahmada depicted the contemporary world in the Age of
    Darkness (`kalatida-kalabendu`), toward the Golden Age (`kalasuba`) (Kolese De
    Britto Yogyakarta 2008). As a poet he affirms that his thought on the world is
    in alignment with his predecessor, Ranggawarsita.


    The idea of the Javanese world is likely indivisible from the myth of `murwakala`
    (the origin of time), which is commonly used for the opening part of a shadow
    puppet show (`wayang`). The origin of `kala` is perceived by the Javanese as the
    beginning of an era that has been liberated from chaos, famine, impurity, disorder,
    and suffering. The Javanese world, `bhasana` or `jagat`, is believed to be born
    from this darkness that is known as `suker`, derived from the Sanskrit word `sukerta`,
    meaning anguish, agony, and torment (Headley 2000, p. 158).

