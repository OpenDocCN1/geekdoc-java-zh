  trans: '


    与宫廷艺术不同，民间艺术以一种直白的方式（`ngoko`）生活并维持着爪哇文化的生存哲学。在爪哇人的日常生活中，民间艺术被理解为 `tontonan kawula`，意为为平民的表演。除了其文化上的审美功能外，民间艺术在保护、发展和维持爪哇文化与传统方面发挥着至关重要的作用。与宫廷艺术不同，民间艺术为创新和即兴发挥提供了更大的空间，而不需要机械地遵循传统的模式和准则。


    爪哇意义上的文化内化过程是通过 `laras`、`nglaras` 的概念来理解的。因此，将来自各种来源的不同元素在形式、表达和表述上进行合成，属于爪哇人处事的一种特质。`nglaras`
    的意义不仅仅是妥协。从广义上说，`nglaras` 是根据爪哇的价值观和习俗来处理一切外来事物。它被准确理解为一种内在和精神的锻炼（`tirakat`），以接受新奇的事物并并在内部将其消化。这种内在锻炼的目的是遇到对立的元素和方面，使其能够与爪哇文化融合。坦率地说，这是爪哇人驯化并驯服（`nglulutake`）进入其文化领域的外来元素。


    ## 艺术、信仰与价值观


    尽管关于爪哇传统的大多数深刻概念都源于梵语文化，但已经进行了当地的定制化处理，以与本土概念中已有的内容保持同步同步。1 世纪初，在印度教和佛教的影响下，爪哇从印度引入了文字和字体。从那时起，梵语文化在与本土泛神论万灵论融合的框架内，被爪哇传统所接纳。


    传统上，爪哇文化将对任何存在（无论是生命体还是自然元素）表示尊重的伦理原则，置于整体存在体系之中。在爪哇人的语境中，这种完整性（`utuh manunggal`）被构想爪哇世界的目标。对这一目的的执着往往会导致对差异的不宽容；在某些方面，它导致了为了代表爪哇世界的完整而对他者进行殖民化的预言性使命。


    传统上，爪哇社会的艺术、价值观和意义在象征主义这一主题上找到了共同点。尽管存在贵族（`priyayi`）与平民或普通人（`kawula`、`wong cilik`）的双元遗产制社会结构，爪哇社会维持并将行为和作品的微妙视为其审美价值的一部分。将万千形式、物品、思想和时尚塑造成一个协调的整体，在文化上是爪哇人的处事方式。这种塑造行为被爪哇人通过
    `manunggal` 概念理解，该词源于 `tunggal`，意为单一、一和实体。说爪哇文化始终努力将一切事物与爪哇存在进行融合性的整合可能并不夸张。基于这种极可能的文化执着，爪哇的帝国主义、宽容和虚伪表现变得可以理解。


    将所有来自爪哇文化存在之外的事物引入进来，是爪哇文化处理异质性的一种文化策略。`manunggal` 策略在爪哇人中广为人知，即 `nglaras`。事实上，微妙和得体在
    `nglaras` 的行为中起着重要作用。因此，`nglaras` 是通过有意的交流来体验某物的存在，以建立并发展进入爪哇世界的整合。


    爪哇文化在印度尼西亚世界的影响在许多方面是主导性的，因为其底层原理是在 `nglaras` 的感性学习系统中与其和解，以建立和发展新兴事物。因此，这并不仅仅是回避冲突或否认矛盾。相反，`nglaras`
    是一种灵活的方法，基于和谐（`cocok`、`rukun`）和统一（`tunggal`、`manunggal`）沉默的力量。爪哇人将和谐和统一视为他们的生活方式（Suseno
    1997）。


    爪哇人对世界和谐与统一的信心确立了各种形式、事务和时尚的艺术作品的目标。因此，在艺术语境下创作就是 `makarya`，即使存在走向和谐与完整。只有在这种条件下，爪哇人才将美理解为
    `apik`（好）、`slamet`（安全）、`asri`（自然的喜爱）、`rahayu`（吉祥）和 `lestari`（可持续）。


    为了达到和谐与统一，爪哇人必须学会控制自己，根据爪哇伦理（`karma`）表现得恰当（Berman 1998, p. 17）。对于爪哇人来说，和谐（`rukun`）和统一（`utuh
    manunggal`）从他们理解的世界中不可或缺的。和谐被构想为不仅基于尊重和相互理解，还基于融入存在的等级排序体系。


    在社会生活中以及艺术创作中，保持和谐意味着能够将自己放在整个体系中的恰当位置。这个文化体系中的任何存在都有其自己的位置，并有一个建立良好的结构来为统一服务。随后，将利己的利益（`pamrih`）服从于存在的共同体，而成员之间和谐的关系（`rukun`）是其内在的原因。寻找中道或妥协是爪哇人生活方式的最佳选择，而不是以体育竞技的方式进行思想或记录的竞争。接纳对手进行妥协被视为一种维持爪哇世界的和平方式。


