  trans: '

    尽管如此，旧 `wanuas` 整合进 `negara` 意味着村庄的平等生活方式逐渐被官僚化的封建政治体系所瓦解。显然，如果没有贵族集团内部权力的集中和巩固，这将是不可能的。这种瓦解也导致了长老会（`karaman`）平等议会的削弱，与此同时，这也是爪哇社会中更复杂的农业地主制度的形成时期。


    事实上，对印度式治术的采用随后不仅意味着 `wanua` 首领头衔从 `raka` 或 `rakryan` 变为 `dhatu` 或 `ratu`，还意味着领导层角色和功能从社区首领向社会政治领袖的转变。这暗示了社会地位和分层的发展，以及职业种类和层级指挥链的日益多样化。这种国家的早期形成阶段之后，可能紧接着就是等级集权的
    `negara` 系统的出现。


    9 世纪晚期中爪和爪爪的碑文（`Lokapala`、`Mantyasih`、`Wanua Tengah` 和 `Sugih Manek`）进一步提到了 `desa`
    之外的自由所有定居点 `wateg` 的出现，其在政治上与 `desa` 的地位对等。这种自由所有地的地位传统上是由统治者作为政治手段授予的，旨在不通过暴力征服而接纳其他地主。凭借这种善意，统治者处于赢得忠诚和减少潜在竞争者的地位。高、低级王室官员（`samgat`、`pamgat`
    和 `mangilala drawya haji`）以及一些首领也享有免税权。自由所有地的地位可能被用来招揽潜在的竞争统治者进行合作。作为回报，定期向统治者所在地进行朝贡（例如为了
    `sima` 仪式而进行的 `sowan dalem`）必须被视为尊崇和忠诚的标志（Tarling 1999, p. 214）。


    在古代爪哇传统中，`sima` 是具有特殊地位且免税的场所。它也可以是国王或祖先英雄的圣地。授予土地 `sima` 地格是统治者控制其下属地主的一种政治手段。这需要国家仪式和典礼来确认并正式化这种安排。在精神上，这也被视为国家作为世界的诞生与重生。通过这样做，统治者在活动中的出现是为了证明其作为地上之神的地位。


    此外，在印度佛教国家时期的碑文中还有一些与定居点相关的概念，如 `wanua`、`negara`、`duwan/kaduhwan`、`desa`、`dapur`、`thani`、`dalem`
    和 `thani`。所有概念都有特定的独特含义，涵盖了 10 世纪爪哇权力从中部转移到东爪哇之前政治文化的转型过程。这包括从 8 世纪早期到 13 世纪爪哇领地术语的转变，这些术语可能与其政治机构
    `negara` 的形成和巩固有关。`Dhuwan` 是现代单词 `dukuh` 的古语，意为村落。尽管 `dhuwan` 由 `kamitua` 领导（字面意思是由于长者身份深受推崇的人），但其政治组织尚未建立，也不像
    `wanua` 或 `desa` 那样复杂。


    ![](img/Figure_2.1.jpg)


    图 2.1 婆罗浮屠 Karmawibangga 浮雕中的场景，描绘了下属地主 `punpunan` 向国王效忠的行为。照片由 Rudi Badil 和 Katalis
    Publishing 提供 (Badil 1989: 34)。


    与 `dhuwan` 相比，`desa` 实际上是一个借自梵的词，字面意思是农业定居点的社会政治机构，传统上处于 `negara` 的霸权之下。作为一种政治组织，`desa`
    在经济上依靠基于水稻的自给自足农业社区的支持。某些 `desa` 的建立很多时候是因为它们与最初作为 `wanua` 的 `negara` 具有政治附属。这种附属关系是由
    `negara` 通过政治过程或军事征服建立的。


    另一种附属形式基于 `negara` 领土扩张的政治机制。它是通过向国家官僚机构授予土地实现的。统治者将土地授予国家官员作为其领地或领土。这种领地在古代爪哇被称为
    `lungguh`。随着时间的推移，`lungguh` 地区的人口作为农业社区和定居点不断增长发展。此类定居点的政治地位取决于它们是 `desa lungguh`
    还是 `kadipaten/kabupaten`。这种定居点中心设有地方统治者的席位。`Kadipaten` 或 `kabupaten` 是地区或从属国家，由国家王子（`hino/mahamantri`）或具有高级国家官员身份的王室成员（`pamgat`）领导。


    在成熟形态下，普通的 `desa` 是一个领土化的定居实体，拥有处理政治、经济和社会事务的机构。`desa` 之首是 `demang`、`akwu` 或 `lurah`，由副手（`carik`）、祭司（`resi`、`pengulu`）和医者（`dukun`）协助。他领导的村民主要是被称为
    `gawe haji` 的地主或赞助者。在处理村事务时，每个传统村庄都有一个名为 `karaman`，由地主和长老组成。作为一个社区，古代爪哇 `desa`
    有其自己的地方习惯法（`cara`）指导社区生活。


    一些古代 `desa` 传统延续至今。最重要的活动是 `bersih desa` 传统。这是一个清理村庄并庆祝社区作为世界重生的活动。在古代，这种为领主进行的集体自愿劳动被称为
    `buncang haji`。但今天与之相同，只是名称不同，被称为 `gotong royong`（共同承担）或 `gugur gunung`（移山）。在古代和现在，村长的领导地位非常重要，如同他们村庄社区父亲的角色。此外，为了安全，`desa`
    提供了一套自愿的夜间巡逻系统（`ronda`）。村夜守大多是从每户抽出的成年男性。他们在夜晚值守，并配备了 `kentongan`（竹制乐器），在需要提醒社区危险时敲击它。


    尽管印度教和印度文化向爪哇社会引入了四个种姓（`svawarna`），但这种采纳微妙地融入了由贵族和平民构成的卓越二元体系中。古代爪哇的小王国至少有四个国家等级：`rakai`（统治者）、`pamgat`
    或 `samgat`（国家官员）、`haji`（地主）和 `samya haji`（地主的仆人）。除了官僚之外，国家祭司（`pandita`、`resi`、`Begawan`）和僧侣（`bikhu`、`cantrik`）在国家仪式和典礼中发挥着重要作用和功能，而商人和交易（`nayagan/niagawan`）在平民（`paura`）作为地主工人（`gawe
    haji`）和劳工（`katik`）的支持下经营经济。


    从 8 世纪到 10 世纪的碑文中，一个值得注意的概念是与被称为 `dapur` 的古代村落有关，字面意思是用于定居的开垦土地。`dapur` 或 `dhapuk`
    术语用于清理森林（`babad alas`）后的开荒定居点。发展的下一个阶段，`dapur` 必须基于轮耕水稻（`pagagan` 或 `gaga`）建立其驯化基础。这种开荒定居点的社会单位被称为
    `dhuwan`。今天这种概念仍在使用，且名称相似：`dephok`，意为村落或房屋分散的定居点。

    '
- fmt: '

    The transformation of `dhuwan` to `thani` was made possible by the practice of
    agriculture known as `sawah`, through which the development of settlement occurred
    as an underlying form of domestic production. `Dhuwan` and `thani` as settlement
    could have been sociopolitically a part of `wanua`. Both terms are to articulate
    the modes of rice cultivation. They were settlement units either politically independent
    or in affiliation with an economically and politically established `wanua`.


    # Aksara, Sawah, and Negara


    Literacy and wet rice cultivation were considered crucial and essential for the
    concentration of power and its formative state polity in Java and other parts
    of the archipelago. Most of the social and political concepts concerning the state
    have obviously been derived from `Sankrit dharmasastra` that is also the source
    of state rituals, statecraft, institutions, and iconography (Heesterman 1989,
    p. 5). The `Sankrit` literacy (`aksara`) had been introduced to the ruling class
    in Java and the outer islands by Buddhist monks (`bikhu`) and Brahmins (`brahmana`)
    from South India between 100 and 600 AD, while the practice of wet rice cultivation
    (`sawah`) could have been adopted from the Southeast Asian mainland around the
    first century. However, the oldest available inscription of `Kutei` was dated
    back not earlier than the fourth century.


    ![](Images/Figure_2.2.jpg)


    Figure 2.2. The scene of husbandry and domestication (`budidaya`) of fish, poultry,
    and pig in ancient Javanese society on a `Karmawibangga` panel of Borobudur from
    the eighth century. Photo courtesy of Rudi Badil and Katalis Publishing (Badil
    1989: 78).


    Evidently, historical traces of early kingdoms of the fifth century were available
    in stone and cooper inscriptions in East Kalimantan and West Java. The script
    was still in `Pallawa`. According to living oral Javanese accounts, the literacy
    was taught by Prince Adji Sakha from South India to Javanese noblemen (Iguchi
    2015, p. 78). From him the literacy and lunar calendar began in Java. It was dated
    back to circa 78 AD. Moreover, the prince was well known in Javanese oral tradition
    and taught the Javanese landlords the `Devanagari` script in `Sankrit` and `Pallawa`
    letters. Literacy was kept by and for the ruling class only and was conceived
    of as a celestial privilege. Since then, keeping `Sanskrit` texts in secrecy was
    the Javanese noble tradition. The relationship between India and Southeast Asia—especially
    Java—has always been unique in terms of cultural history. The cosmopolitan `Sanskrit`
    world has hardly been divided in terms of compartmentalization and regionalization
    that only leads us to lose sight of the natural and historical unity (Heesterman
    1989).


    ![](Images/Figure_2.3.jpg)


    Figure 2.3. Inscription on the stone, dated from the ninth century, Collection
    of National Museum of Indonesia, Jakarta. Photo by Bagoes Wiryomartono.


    One thing that ordinary people got the benefit from `Sanskrit` literacy was the
    calendar system. The Javanese lunar calendar (`pawukon`) then was developed by
    Prince Adji Saka. Since then, the year calendar system was named after him: `taon
    saka`. However, the influence of `Sanskrit` has been gradually integrated with
    local culture. As shown in the inscriptions of the twelfth century, Javanese `negara`
    did not use the `Sanskrit` language and `Pallava` script, but instead developed
    their own language, known as `basa kawi` and the script of `hanacaraka aksara`.
    Nevertheless, literacy in ancient Java was conceived as sacred knowledge and a
    skill so that it could have established the ruling class and the elite status
    in the state polity of `negara`. Sociologically speaking, literacy in ancient
    Java had made a strong social dichotomy between the ruling class and the ordinary
    people. Meanwhile, wet rice cultivation strengthened the position of the ruling
    class in dominating the commoners with a feudalistic system of economy.


    ![](Images/Figure_2.4.jpg)


    Figure 2.4. The scene from the panel of Borobudur’s `Karmawibangga` depicting
    donations from a landlord (`boghi`) to the poor in his residence. Photo courtesy
    of Rudi Badil and Katalis Publishing (Badil 1989: 19).


    Economically, the alteration from chiefdom to kingdom in ancient Java was not
    only made possible by the influence of Indic civilization, but also possibly by
    the provision of productive development in agricultural techniques, which were
