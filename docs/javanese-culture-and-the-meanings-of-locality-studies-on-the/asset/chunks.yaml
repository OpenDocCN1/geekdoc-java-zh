    事实上，`punakawans` 的信息是人们对当前社会政治事务现状作出的回应。无论其政治派别如何，`dhalang` 被认为应该引导观众进入一种强调的共性的状态。`dhalang`
    不又一次地用修辞手法传达关于团结与统一之紧迫性的信息。在爪哇世界中，这种强调共性的现象被理解为 `luruh`。`luruh` 的概念指代在整体面前保持顺从的必要性。让人们意识到合一性似乎通过
    `wayang` 演出代代相传而确立。那么，在通夜的 `wayang` 演出期间，房屋成为了爪哇世界的中心。


    ## 作为艺术品的房屋

    在爪哇传统中，作为艺术品的房屋被构想为一种在 `karya`（作品）概念下，对维持整体性做出贡献的努力。由于作为 `karya` 的工作在丰富我们作为生命总体的世界方面某种是有用的，爪哇传统中的艺术家或或少是整体性工作者，他们将合一的事件作为真理呈现出来。因此，将世界纳入其合一性的作品价值越高，其存在就越神圣。宫廷遗产（`pusaka
    dalem`）是爪哇国家最精美的艺术品和最神圣的东西。


    ## 建筑与仪式

    从建筑角度来说，如果没有位于中心内室（`sentong tengah`）的 `kris` 等宝，`dalem` 的概念本身就没有其核心内涵。由于被覆盖并注入了神秘主义，精美的艺术品与护身符（`aji-aji`）和最高知识（`kesekten`）密切相关。在爪哇历的每个周五
    `kliwon` 晚上，房屋所有的珍宝都要用花水进行清洗。当然，焚烧 `dupa`（香）的烟雾和诵读《古兰经》经文的 `mantra` 属于清理仪式的一部分。在诵读念咒后，全能神、神灵、祖先和所有仁慈的神灵包含在愿望清单和感激之中。


    房屋与艺术品欣赏之间的关系被认为是，遗产保护并守护家庭免受厄运的侵害。收集其他精良艺术品可能被视为维持其作为父母传给子女的传宝能力的一部分。在爪哇传统中，房屋含有遗产（`pusaka`）被认为是缅怀祖先至关重要的。没有任何遗产的房屋（`omah`）被认为是没有内容的容器（`wadah`）。神圣房间（`sentong`）可能被建立为房屋的祭坛。


    ## 设计与创造

    对合一性紧迫性的痴迷带来了艺术中一种集体建立的表达方式。基于自由想法的设计不被认为适合爪哇社区，因为它对个人风格和表现有强烈的执着。然而，爪哇语中没有对应“设计”的恰当词汇。设计的近义翻译词是
    `ngrancang`，源于词 `ancang`，意思是迈出一步。建筑施工中的 `ancang` 是指为进一步行动做好准备的状态。


    显然，设计职业在传统社区中除了 `kraton`（宫廷）之外，没有合适的位置。不用说，过去具有创造和创新能力的个人会以化名或以王的名义工作。今天的独立艺术家可能不属于爪哇宫廷社区，但根据他们基于
    `nglaras`（与他人和谐处）的整体思维方式，他们被认为是爪哇传统的维持者。因此，在爪哇文化中，创造和创新是受欢迎的，其框架是培养旨在改进和阐述本土特征与性格的一切。


    ## 艺术价值与原则

    断言和过度自信不像爪哇艺术的表达方式。尽管大多数爪哇识字分子根据他们的传统和语言是受过良好的思想者，但静止、坚持和谦虚成为了他们学识的标志。可以看出，在爪哇传统中，如果没有对于整体性紧迫性的传统共享价值观，巨大的创新是不被接受的。定居建筑中作品的审美诉求是在合一（`manunggal`）的紧迫性和框架之内，在这个框架内，顺应（`cocok`）、谦虚（`sa’madya`）、尊重他人（`tepa
    selira`）和和平共处（`guyub`）以及和谐（`rukun`）的原则在构、表达、构建和居住中发挥着重要作用。


    关于对顺应的坚定承诺，在爪哇社会中有一席之地意味着符合其传统和语言所传达的惯例。在爪哇传统中，奇怪和怪异被视为 `nyeleneh`，意思是疯狂和失去常识。顺应、相互尊重和和谐的原则似乎建立在
    `gamelan`、音乐（`karawitan`）、文学（`sastra`）、皮影戏（`wayang`）、蜡染、铁匠或建筑作品中。和谐、谦虚、相互尊重和顺应是爪哇作品中占主地位且预定的条件。爪哇人在单一公式中制定这些条件：`runtut`，意思是恰当且循序渐进地追求最佳和终极。


    爪哇人接受过语言训练，根据对他人的尊重遵循循序渐进的礼貌行为。根据 `runtut`，在通往目标的路上对任何步骤和每一个人的致敬和尊重不能有任何遗漏。因此，作品创作遵循合一原则，意味着遵循一种恰当的程序（`runtut`），在这种程序中，尊重、合作协作受到高度鼓励和促进。傲慢、无礼和低估可能被认为避免和阻碍。这种意义上的美不是某种爆发式的、个人的和孤独的。相反，它在某种程度上是音乐的和交响乐的。


    ## 美学与感知

    识别美物的途径是通过 `rasa` 实现的，这是一个尊重和谐整体来表达情感和情绪的概念。从建筑角度看，美丽的建筑是由其和谐的比例和谦逊的表达构成的，引导向优雅、洞察、成熟和谦虚。爪哇的艺术方式可能是逐渐而持续地将一切生煮成熟。仓促、匆忙和乱窜不是爪哇式的。相反，爪哇传统中的艺术表达是从自身的元素和资源，尊重其真实特征对整体性的贡献来阐述。


    此外，审美上考虑周全的建筑在其整体被理解为 `apik`（完美、井然、恰当和精美）。`apik` 的概念适用于具有清洁、恰当和整洁表现的建筑。`apik`
    意义的美被规定为良好的状况。然而，自然界的美从未用 `apik` 理解，而是用 `asri` 理解，这关乎生长良好、慷慨、肥沃、可持续和和谐的状态。


