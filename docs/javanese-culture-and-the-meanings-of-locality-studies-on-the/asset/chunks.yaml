    Kulke (1991) 提出的观点认为，在十世纪以前的古代爪哇存在没有城市的国家，这一观点几乎难以接受，并被认为是一个草率的结论。因此，城市化不仅关乎物理结构，更关乎文化。在爪哇的经历案例中，如果不提到城市结构与权力及国家概念之间的关系，对城市定居点进行判断在历史上是不充分的，因为城市化的意义在于其国家体系的政治制度。在爪哇和印度尼西亚的语境下，城市基础设施缺乏物理证据并非唯一的决定因素，因为这片热带土地上定居点的大部分建筑元素都是用易腐材料制成的。只有石头和陶土被用于纪念性建筑。这一事实促使我们审视物理结构之外的城市化方面。由于城市化的本质在概念上是为了“文雅化”（urbane），因此爪哇人将这一概念理解为`karma`（礼仪和行为规范），体现在`alus`（文化修养）方面。`kuta
    negara`（国家中心）中心一直与实践文化修养和良好礼仪的地方联系在一起。在爪哇的语境下，城市与非城市或农村地区的区别不在于其物理结构，而在于其文明行为。大多数西方学者在理解爪哇文化中的“城市”时，可能忽略了这些标准。


    # 第三章：国家中心（Kuta Negara）


    ## 爪哇城市/国家思想及其历史演变


    尽管`negara`源自印度文明，但作为一种国家和治国概念，爪哇文化以各种方式和形式对其吸收、调整和修改。几个世纪以来，爪哇的`negara`以其自身处理城市性和文明的方式和风格不断发展。本章认为，爪哇的城市化是一个没有明确外围的中心。本章的方法是诠释性的，将城市世界视为地方性的文本。本章将考察并审视与城市化和定居点现象相关的局部概念。其目的是揭示并解构它们的组成关系和意义结构。本章的材料源于作者作为爪哇本土人的经历，他曾在
    1993 年至 2010 年间在爪哇完成了深度实野调查。


    ## 爪哇文化中的城市定居点


    爪哇城市化的历史不可避免地涉及到这样一个事实：这种文化中的城市形式可能不是由其经济潜力定义的，而是由其仪式和象征目的定义的。Wertheim (1980)、Evers
    和 Korff (2000, pp. 25–37)、Bishop、Philips 和 Yeo (2003) 以及其他学者——McGee (1967) 和 Ginsburg
    (1955)——证实了东南亚城市化的思想在理论上是令人困惑的，尽管其形式有两种主要模式：内陆国家和港口公国。迄为止，此类理论大多来自西方视角。Wertheim
    对 Peter J. M. Nas 的《印尼西亚城市》（*The Indonesian City*）的提醒我们，研究需要听取印尼西亚人对其城市和社会的看法（Wertheim
    1987）。本章是对 Wertheim 要求的响应，试图从内部揭示和展现爪哇国家与城市的演变，并特别参考了局部概念、文本和器物。


    写这一章的另一个原因是，该地区关注城市形式和文化的城市研究缺乏出版物。虽然大多数研究印度尼西亚城市化的学者在对东南亚独特的家产制和专制城市、城镇的分析和理论在很大程度上是正确的，但他们似乎忽略了爪哇城市形式与当地政治文化之间的一些重要方面，而这种文化是保存在本土语言中的。


    在某种程度上，城市文化包含了一套思想、价值观、原则和期待系统，以各种形式、媒介和方式在其社会中运作。为了被集体共享，城市文化需要交流性。文化是一种必须根据当地情况进行阅读和描述的文本（Geertz
    1983, p. 70; Geertz 1973, pp. 11–12）。本章认为，爪哇城市/国家的意图在于其作为精神中心的权力概念。因此，城市和国家在概念上是可以相互的，取决于中心如何在现象上作为形式或事件呈现。根据意图性概念（Searle
    1983），本章将城市视为人们所向并以此存在的世界（Kulke 2001），是爪哇地方政治和文化构建的现实。除了考古器物、历史文本以及当地习俗传统外，这种建构背景阅读的主要来源是局部概念、它们的意义及其语境。然而，分析和解释侧重于概念与现象之间的关系，这些关系构建并建立了爪哇城市/国家的事物和事件。


    尽管一些学者对印尼爪哇早期国家和城市进行了研究（Coedes 1944/1968; Lombard 1980; Nas 1986; Rutz 1987; Wisseman-Christie
    1986），但可能存在误解，在某些情况下是因为局部概念在其他语言中大多是不可翻译的。还需要进一步的调查来明确局部概念的意义，这需要更多关于印尼语境下城市化的局部材料的支持。事实上，大多数研究印度尼西亚城市化的学者对东南亚独特的家产制和专制城市、城镇的分析和理论在很大程度上是正确的。然而，他们似乎忽略了保存在本土语言中的当地政治文化的重要方面。


    Wisseman-Christie (1991) 从人口统计角度认为，12 世纪以前的殖民前爪哇定居点是没有城市的国家。这如何可能是可能的？这个问题至今仍然存在。由于国家和城市化在历史上是权力集中的结果，城市现象与局部霸权和政治文化是不可分割的。Wisseman-Christie
    关于古代爪哇王国是没有城市的结论，如果没有审视爪哇权力思想及其局部概念，将是不全面的。权力的集中不需要将人们及其定居点集中在一个地方。在爪哇传统中，权力的集中更多是关于宇宙能量的精神和象征中心；越接近权力核心，越能感受到其神秘的氛围和环境。


    尽管 9 世纪到 13 世纪初爪哇人口是分散的，但他们的王国实现了国家官员和地方权威高度复杂且严格的层级制度（Kulke 2001, p. 16）。关于空间结构和领域的问题仍然开放。这种学识是如何在建筑上融入其土地规划的？这个问题引导我们去调查古代爪哇王国、伊斯兰、殖民和共和国时期
    `negara` 是什么。


    关于印尼西亚城市文化，可能没有比 `negara` 的政治制度更重要的，因为这个概念包含了城市、中心、城镇和国家。从古代至今，`negara` 和 `kuta`
    或 `kota` 一直是权力中心不可分割的概念。


