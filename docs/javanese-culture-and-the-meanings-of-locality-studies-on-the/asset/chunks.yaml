  trans: '

    尽管如此，`negara` 作为一种政治组织的定居实体，已以封建国家或王权的形式出现。这意味着，用于作物耕种的土地财产价值一直是税收和贡赋的对象。水利管理技术导致土地价值增加，促使人们发展出更复杂的社会组织化政体，使他们能够管理和控制作物和其他资源，以促进文化产出的发展。这一切都是基于地主与工人之间的主主关系。


    从轮耕农业向定居耕作的转变，在政治上随后导致了村庄并入单一地主的主权体系。这是印度式政治学和政体传统的结果吗？扩张权力的需求一直存在。问题确实在于，不仅要通过军事优势主宰他人，更要通过纪律和强有领导力高效地维持对他人的控制。印度文明为当地统治者提供了军事知识和战术，这些内容在《摩诃婆罗罗谭》和《罗摩衍衍》中有所描述。这两部巨著都被爪哇的统治阶层所采纳。然而，文本从宫廷到普通百姓的传播主要是通过故事讲述者表演者（`dhalang`）通过他们的皮偶戏（`wayang`）完成的。古爪哇版的《罗摩衍那》是
    `kakawin Ramayana`；它讲述的是 `Rama` 和 `Shinta` 的相同故事，但已从史诗小说变成了抒情诗。其作者无人知，但该作品可能写于
    `Rakai Watukura Dyah Balitung` 统治时期，约公元 `856 AD`。


    ## 社会与定居点


    爪哇名为 `mancapat` 的村庄联盟概念，其起源推测源自印度的轮转模型（`mandala`）。 8 世纪至 10 世纪间来自 `Kedu` 和 `Temanggung`
    的一些铭文中提到了为了防御和经济合作（在 `panaturdesa` 和 `pangasta desa` 方面）而由五个或十个村庄组成的联盟。除了神秘色彩外，`mandala`
    可能被用于在应对干旱、饥荒和旱季（`paceklik`）时确保农业生产和水利管理。根据 `mandala` 概念，村庄（通常不超过五个）通过定期轮换的市进行经济组织。每个村庄都有轮流举办每周集市的机会，根据参与村庄的数量一次。在文化方面，这些村庄建立了一个引渡罪犯（`maling`、`begal`、`rampok`）并同步其习惯法的代表性机构。


    尽管有许多宏伟的 `candi`（庙），但建筑和铭文显然在爪哇和苏门答腊等地屹立并蔓延。在 `Majapahit` 之城 `Trowulan`（`1305–1527`）和
    `Kediri`（`1042–1222`）时代之前，几乎找不到具有强大街道和区块结构规划的物理城市化定居点的考古痕迹。尽管古代国家的遗址尚未揭示公共基础设施的遗迹，但它们的概念出现在许多铭文中，例如蓄水池（`segara`）、排水系统（`kalen`）、港口（`bandar`）、公墓（`astana
    pralaya`）、公共浴室（`patirtaan`、`pancuran`）以及用于农业灌溉的水坝（`waduk/bendungan`）。


    与大部分稳定的古代村落定居点不同，作为 `negara` 中心的前伊斯兰时期城镇因为彼此之间的领土竞争而相对不稳定。尽管 `negara` 的兴衰影响了它们国家和首都的生存，但它们的
    `desas`（村庄）大多幸存并维持了其农业社区。尽管大多数可能消失了几个世纪的城市结构规划，某些古代村庄和国家的后代仍然可能保留了过去的某些域名。事实上，土地的当代用途可能随着其他活动而调整和变化，但古代名称可能保持不变，例如
    `alun-alun`（广场）、`peken/pekan`（市场）、`pendapa`（凉亭）、`keraton/kedhatuan`（皇宫）等。除了自然灾害（`pralaya`），定居点的迁移大多是因为忽视了遗址。根据铭文的位置及其文字，可以估计古代首都遗址的位置，例如
    8 世纪中期至 9 世纪 `Shailendra` 王朝位于 `Mamratipura` 的 `Medang`、`Matyasih`、`Kayumwungan`、`Talang
    Air` 以及位于 `Parakan Temanggung` 的 `Gondosuli`。然而，从田野来看，很难从它们的物理和地形痕迹中精确识别和定位古代遗址，这些痕迹大多已变为稻田和荒野。


    作为国家首都的 `kuta negara` 区域被分为若干领地（`kalungguhan`、`lungguh`），由高级国家官员（`pamgat`、`adipati`
    或 `bupati`）作为地主进行管理控制。在远离首都城的农村地区，这些领地和土地由 `adipatis` 或 `bupatis` 委托给他们的低级国家官员，这些人被称为
    `bekels`。然而，在首都城内，定居点的领地（`lungguhs`）形成了城市区块，这些区块由街道（`marga`）划分，以供人们骑马或步行成群移动。尽管几份铭文没有提到古代国家首都的定居点，但来自中国的文献证实了统治者宝座作为世界象征中心的重要性。定居点的核心被称为
    `dalem` 或 `jro`，实际上是矩形墙墙系统（`turus/penyengker`）内部的建筑或凉亭。


    正如 876 年的 `Jurungan`、905 年的 `Poh` 和 902 年的 `Pagumulan` 等多个铭文提到的，在 `Sindok` 统治之前，就已经存在重要的城市制度，例如行政首首的
    `patih`、祭司 `purahita`、领土联络 `desaadaksa`、律师 `adhyaksa`、法官 `upapatti`、通讯员 `pangujar`、档案
    `citralha`、财务 `kabandaryan` 以及税收 `pangurang`。各种职业专家在古代社会也为人知，例如建筑大师 `undahi`、船长
    `hawang`、鼓手 `mapadahi`、舞蹈者 `kicaka`、皮影戏师 `awayang` 和音乐家 `rawit`。他们的专业知识通过名字前的缀
    `juru` 或 `tuha` 来表示。还有具有特殊任务的国家官员，如村庄信使 `wikekas`、水稻官员 `hulu wras`、森林官员 `tuha
    alas`、灌溉官员 `huluair`、市场官员 `mapken`、园林官员 `mataman`、铁匠官员 `tuha gusali`、桥梁官员 `huluwuatan`
    以及边界官员 `mawatas`。


    确实，城市化的一个基本要素是国家记录。相应地，古代 `Mataram` 王国的记录写在各种媒介上，如 `lontar` 叶（`ripta`）、铜牌（`tamra`）和石碑（`prasasti`）。此外，城市化的另一个标志是贸易单位的存在。在古代爪哇文化中，货币基于各种商品，包括黄金单位（`kati`）、水牛（`suwarna`）和米碗（`masuya`）。


    此外，古代爪哇的社会组织在各种协会中，具有特定的成员条款、目标和范围。长者聚集在 `kamitua` 小组中负责社区事务的咨询，妇女们则聚集在 `rainata`
    小组中负责社区互助和家庭照顾。儿童由社区中的 `wadwa rarai` 组织照顾，进行早期训练和嬉耍，而青少年有自己的协会，女孩为 `rara` 或 `werewereh`，男孩为
    `wadwan matuha manwam`。

