    传统赞助制度的彻底瓦解在殖民前或殖民时期的爪哇从未真正发生。然而，在 18 世纪中期的苏卡塔发生了一场略显激进的艺术自我表达运动，当时诗人 `Raden Ngabehi
    Ranggawarsita` 在 `Pakubuwono VII` 的统治下工作。作为当时的国王，`Pakubuwana VII` 他为宫廷诗人（`pujangga
    kraton`）。由于国王对文学并不十分关注，国家为 `Ranggawarsita` 留了更多空间，不仅是为了他的创作写作，也是为了他构思爪哇世界的才华。在过去，类似的预言性叙述曾由东爪哇
    `Menang Kediri` 的 `Jayabaya` 皇（1135–1157 年）传达过。在许多方面，`Ranggawarsita` 的诗对于爪哇宫廷传统来说是非传统的的。与他的祖父和前任
    `Yasadipura II` 不同，他在诗中以预言的方式表达了自己的内心想法。他在 `Pakubuwana VIII` 和 `Pakubuwana IX`
    统治下继续担任宫廷诗人，直到他在 1873 年神秘地去世。他的死因至今仍不清楚。


    ## 爪哇文化中的艺术是什么？


    尽管在爪哇文化中没有一个描述“艺术是什么”的词汇，但爪哇人理解其意涵和目的。对于爪哇人来说，任何努力都是在 `karya` 方面实现其品质。创作艺术品通常被理解为
    `makarya` 的概念。`karya` 是一个梵语借词，被爪哇文化采纳，意味着具有对世界和社区福祉之用和贡献的作品。事实上，`karya` 是一种经过艺术化构思的、呈现出特定价值和意义的世界的作品。广义上说，`karya`
    是所有人类的作品，它们在功能和美学上经过良好考虑，通过精致的事物和行为呈现出文化。文化的对立面是 `urakan`，意为粗俗、无鲁和无礼。


    尽管在爪哇传统中处理艺术概念并不流行，但这并不意味着艺术作品没有任何特定的意义。爪哇文化中与艺术作品和审美体验相关的概念在意义和表达上非常广泛。在如此广泛的光谱中，爪哇文化中至少有三类艺术作品：`susastra`（文学）、`karawitan`（音乐）和
    `karya`（通用艺术作品）。


    `karya` 的特征应当包含伦理与美学的完整性，展示并融合了良好礼仪、精致和克制（`alus`）的思想（Hughes-Freeland 2008, p.
    82）。`alus` 的意义适用于事务、语言和行为。因此，根据爪哇价值体系，工作和行为在追求其精致和美学化处理方面是具有目的性的。这种意义上的精致不仅仅关乎精美的表达、阐述和互动。相反，爪哇的精致关乎适当的位置、取向、形式、风格和时尚。


    在许多方面，`alus` 的恰当需要普遍的接受、微妙和细腻。这一切几个世纪以来一直在演变，根源在于基于农业的封建主义。这种意义上的文化不仅仅是一组与习俗做法相关的共享意义的集合（Berger
    1995, p. 32）。相反，爪哇人在 `budhi` 的语境下理解文化。爪哇语境下的梵语借词 `budhi` 已经演变成并构成了思想和行动的力量源和体系；基于此，人们能够创造、建立、发展、保护和维持思想、情感、精神、记忆、智慧、希望和理想。在日常生活中，作为
    `budhi` 的文化思想作为审美和道德标准被实践。语言和礼仪传递了 `budhi` 作为一种规范的标准。然而，如果 `budhi` 没有被注入被称为 `daya`
    的生命力量、驱动力和激情，它就是虚无且无用的。`budhi` 和 `daya` 的协同被整合到 `budhaya` 的概念中，字面上的意思是文化。


    那么，创造美丽、有用且有见地的事物以及良好的礼仪行为，与爪哇文化的本质（`budhi`）是不可分割的。在所有表象之外，爪哇人将各种形式、方式和风格的艺术作品视为其生活哲学的一部分，即人类作为一个社会必须在艺术和社会上进行自我修养。整个学习过程被爪哇人构想在
    `nglakoni` 的概念中，意为“沿着行走”。因此，生活即是行走，也是以无限的方式体验当下。本章试图展开爪哇文化中审美体验的概念基础。


    为了对爪哇世界有一个简要的了解，没有哪个单一单词能更好地描述他们的文化和传统，比“融合”（syncretism）这一概念了。在爪哇语中，融合现象在语境上与深层情感的概念和词汇
    `manunggal` 相关，意为“合而为一”（Anderson 2007, pp. 23–24）。统一（`utuh`）和和谐（`rukun`）成为爪哇传统中最痴迷的概念。融合现象体现在各种活动和产品中。爪哇人从“驯化化”的角度来理解这一概念。这是爪哇人处理制造、生活和工作的方式。爪哇语中的融合被构想在
    `nglaras` 或 `laras` 的概念中（Yumarma 1996）。这一概念是爪哇思想的核心，将一切对立、二元和辩证法统一为整体。


    作为文化的不可或缺的一部分，爪哇艺术和审美与将各种形式、思想和时尚塑造进新体系的行为是不可分的。统一的目的是成为爪哇人（`jawa`），字面意思是经过文化教养和成熟的人（Weiss
    2006）。成为爪哇人意味着具有良好的礼仪和强烈的自律。这一切由 `alus` 概念组成，字面意思是精致和成熟，其对立面是粗鲁和不成熟。`nglaras`
    的最终目标是实现工作和行为的精致（`alus`）。


    爪哇传统中艺术作品的目的与爪哇人从黑暗（`kalatida`）世界走向光明（`kalasuba`）世界的奋斗是不可分的。它并不是为了艺术自我表达而制造某些东西，也不是为了个人自由。对于爪哇人来说，审美体验的作品关乎世界和社区的福祉（`sugeng
    slamet`）。尽管今天爪哇王国仍存在于`雅加达`和`苏卡塔`，它们的作用和功能更多是精神上的象征，而非政治参与。在艺术品领域，宫廷艺术和民间艺术出于不同的目的共存。宫廷艺术为宫廷仪式和活动提供服务（Jessup
    1990, pp. 73–102）。它们属于保护和维持宫廷自豪感和遗产方面的文化价值。确实，为了精神认同和爪哇世界的统一而歌颂过去，是宫廷艺术的核心目的。这包括表演模仿、模拟以及象征爪哇世界的年度和偶尔性庆祝活动。


