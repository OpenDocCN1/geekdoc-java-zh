    在爪哇文化中，建筑表达并不一定意味着美观和华丽。相反，爪哇人认为的美被构想为通过 `rahayu`、`apik` 和 `laras` 概念表达的幸福感。在这里，美不仅仅是外表，而是由人与环境之间的和谐关系所构成的现实。因此，美的存在不仅是为了为人们提供一个愉快的环境，而且是为了适应爪哇传统中社会公立的状况。适应社会公立的社区被爪哇人用
    `ngalaras` 一词来表达。这一概念的原意是在没有任何预设目的地的情况下，随处走走的行为。`Nglaras` 是一种在思考和行走上具有双重意义的游荡。`nglaras`
    的重要性在于它与爪哇人“在时间中穿行”（`nglakoni`）的居住概念具有相同的关系。同样，这两个概念都没有任何预设的目的地。


    将建筑整合到其社会背景中，爪哇人认为这种 `nglaras` 比设定个人形象更具意义。在这方面，建筑环境的意义在于其对社会合一的承诺。由于场所是恰当存在的地址，它的意义不仅仅是一个位置，而是一个发生聚集现象的领域。爪哇日常生活中的场所被理解为
    `panggonan`，意味着相对于他人（人、时间和性格）而言，为正确的事情提供适当的场所。`Panggonan` 源于动词 `manggon`，意为定居或将某物恰当地地放在某个位置。由于大多数前缀
    `pa` 赋予了我们作为场所一部分的指示，例如 `pawisman`（住宅）、`padunungan`（定居点）、`padusan`（公共浴室）、`paninisan`（乘凉风的地方）、`pangomben`（饮水处）等，`panggonan`
    指的是所有已找到其合适位置的事物。


    在爪哇传统中，拥有社会公立的席位生活（`mapan`）与拥有居住的地方（`manggon`）区分开来，是因为其非常尊重立足的核心理念。`Mapan` 源于单词
    `papan`，即最初由木材制成的地方。`papan` 的另一个意思是盾牌和避难所。因此，在爪哇人的居住理念中，`papan` 为人们提供一个允许采取行动和定位的庇护做出了特殊贡献。`mapan`
    的词源含义是为进一步的行动做好准备。这种标志表明居住是一种随时准备就的态度，并且永远不会重复做同样的事情感到疲倦。


    如前文所述，`mapan` 源于单词 `papan`，即为恰当的生活阐述场所。与定居有关，`mapan` 描述的是以和平、可持续和受尊重的形式存在的居住状态和条件。`papan`
    和 `panggonan` 在容纳居住方面具有相似的概念。正如在爪哇语言中，居住场所的类别不是根据其实用目的区分的，而是根据社会地位和位置区分。尽管如此，所有这些都表示了为了开放场所而对任何可能的变化和调整的准备。爪哇的
    `priyayi` 人在城市核心区拥有他们的 `papan`，而普通平民（`kawula`）应该在农村地区拥有他们的 `panggonan`。在日常对话中，`panggonan`
    也指任何恰当存放某物的地方。对于爪哇人来说，拥有一栋房屋与 `manggon` 相关，而是与 `mapan` 相关。


    ## 房屋、熟悉感、好客与居住


    关于建筑和居住必要性的一个重要问题是处理家感。我们所建造和居住的，无非是那些使我们能够构建和回想起家感的文化事物。爪哇人的家感由 `kerasan` 和 `pomah`
    概念组成。`kerasan` 的理念源于 `rasa`，意为感觉、情绪和感知力，而 `pomah` 源于 `omah`（房屋），意为定居和拥有席位。


    由于 `kerasan` 是能够处理环境的印象，它的体验是由与整体保持完好的心情和感受所规定的。`kerasan` 的意义在于，一切在环境上都近在咫尺并与之良好地联系。另一方面，`pomah`
    是在社会中拥有席位的状态。`pomah` 的核心理念不仅是指已经定居在环境中，而且描述了熟悉文化并适应文化的状态。此外，`pomah` 也提到与室友和邻居处于安全关系的状态。


    如前所述，`rasa` 在爪哇文化中在文化和日常生活中起着非常重要的作用。`Rasa` 与审美体验和社会生活的鉴赏有关。由于 `kerasan` 意味着对环境熟悉且便利，这是通过情感和理性的与场所完好来体验的，它的核心理念在于拥有不匆忙、不鲁莽的珍贵时刻。另一方面，`pomah`
    是由人的身份及其所在地所构成的家感。身份说明了与人的环境相适应的场所特征的相关性。它必然规定在 `ayem`（平静）和 `tentrem`（和平与满足）的领域内。舒适氛围的领域特征是间接采光、阴影的细微差别、土色和温暖，这些都是爪哇人居家感觉的典型和特征。这一切使得建筑环境成为背景，为可能的事件和发生提供舞台。


    尽管 `omah` 至少意味着头上有一个屋顶，但它在爪哇生活中的作用远不止于。`Omah-omah` 是建立一个家庭，而 `pomah` 是阐述家感。此外，`wis-omah`
    的概念是表达对某事的熟悉。`omah` 的应用可以在以下找到：`bale omah`（家）、`omahan`（像房子一样的）、`diahke`（驯化的、驯服的教化的）以及
    `somah`（配偶或婚姻伙伴）。爪哇语充满了对 `omah` 的引用，它意味着爪哇社会生活的滋养和安全的场所。


    `Pomah` 源于古代南岛语 `Uma`、`Umah`、`Omah`、`Humah`、`Rumah`，意为世界。在这种意义上的世界并不被理解为地球或整个陆地。在爪哇
    `Omah` 中，世界是指拥有土地和邻里的家庭。`Pomah` 是在特定地点上已经参与世界的状态。爪哇人与其物理环境中的家园的关系并不是感性的问题。爪哇人被传统教导要以感恩的精神对任何可能的生活做好准备。这可能是一种带有内在力量和对开放性
    `nrima` 的接受，这一概念有时会被误读和误解为在不反抗的情况下放弃而接受厄运。


    爪哇城镇的 `omah` 领土是通过 `penyengker`（围绕房屋的矩形墙）来定义的。房屋本身的定义并不是那种显性的言语，因为它的精髓在于 `Jero`
    或内部或内在部分的理念。`Jero` 是阐述内部状态的词。房屋的另一个词是 `dalem`，通常用于指代社会地位和等级较高的人的住所。`Dalem` 字面意思是阐述自我、内部以及第一人称。值得注意的是
    `dalem` 在其空间质量上的理念，它体现了一个较小系统的中心。


    '
- fmt: '

    The thing of the house is not the building in terms of the shelter (`papan`) or
    the house (`omah`), as mentioned earlier, but the state of being inside beyond
    the border. The transition between the inside and the outside is designated by
    the entrance door (`kori`). The meaning of `kori` is life or source of power.
    The substance of this word is `koripan`, meaning the life. The question is: What
    is the relationship of the door and the life? Door is a transition from and to
    outside or to inside. The transition is possibly not perceived as a border in
    a strict and clear category. We experience the idea of continuum in different
    states of being between moving and stopping. Thus, the category of inside and
    outside is not only understood as a physical transition, but also as a sign of
    the life in between. Inside and outside are complementary and signify and articulate
    the life and the being in the world as well.


    The idea of inside (`njaba`) and outside (`njero`) in the town scale and context
    is traditionally demonstrated by the town gate, known in the past as the `seketheng`.
    The word speaks of the beginning and the end of journey. `Sekheteng` is not a
    physical structure for making a demarcation between nature and culture. It is
    actually the opening of `kelir` (wall or curtain behind the gate). The `seketheng`
    stands to the `kelir` in order to articulate the state of sublime into and from
    a different realm. The other word for the gate is `gapunten`. The word is derived
    from `punten`, meaning apology and permission. The gate is the place to announce
    and to ask for blessing, apology, and admission. The word delivers the message
    of wisdom to recognize the essence of being in between. The important thing of
    the message is to experience the between as a condition of being aware (`eling`)
    that life is not the question of right or wrong, inside and outside, but open-mindedness
    and being humble with dignity. The Javanese culture sum up open-mindedness and
    being humble with dignity in one word: `njawani` or being Javanese. It is probably
    the most important thing for being preserved and conserved in the Javanese context.


    The notion of `njaba-njero` is not simply a physical demarcation. Conceptually,
    the category of in and outside is to bring clearly to mind the capacity of inner
    self for setting up the realm of home. `njero` is always identified with the inner
    self in its tranquility, `tentrem` from which `njaba` is able to define. Based
    on this peaceful condition, the `njero` is conceptually contracted and expanded
    to work out its relationship with the public world. Although the definition of
    `njero` is architecturally established with main house in a yard surrounded by
    a wall, the house remains open for any visit. `njero` is seemingly not equivalent
    to private domain. Rather, this inside is spatially to articulate the capacity
    of power contained by its owner. The larger `njero` is, the more powerful is the
    capacity and responsibility of its owner to make oneness come true. The largest
    `njero` is, of course, the palace with its surrounding wall (`baluwerti`) that
    is to define its rigorous self-identity as the center of wholeness, instead of
    for defense.


    As mentioned earlier, the idea of place in Javanese culture does not make any
    separation between form and space. All is inherent in the name or concept of the
    thing itself. Space and form/construction are not perceived as a territorially
    defined boundary, but as the platform where the thing shows itself as the daily
    use or event. Flexibility of occupation is architecturally demonstrated in the
    Javanese house provided that there are no specific assignments given to its space
    except its core (`sentong`).


    In any rate of expression and representation, it is difficult to define place
    without being able to find the center at a permanently constructed form. The center
    is always on the move. If we find something that is possibly a center, then we
    find nothing but the hollow. `Alun-alun` is a traditional Javanese town square,
    which is meaningless and nothing without any religious events. The relationship
    between `alun-alun` and the mosque and the palace (`kraton`) does not come into
    the light without religious events and happenings. We will find nothing in the
    house if we cannot observe the center. The core of the house, called `dalem`,
    consists of mainly three rooms: `sentong kiwa`, `sentong tengen`, and `sentong
    tengah`. At the center of the house is an empty room reserved for heirlooms. The
    most important part of the center is when the bride of the house sits together
    with the groom during the wedding ceremony reception. This center is only dedicated
    to this event. The number of brides in the house corresponds to how many times
    the room is at the service of house.


    Being aware of what happens right now for the Javanese culture is more important
    than any effort for anticipating the future. Being aware, called `eling`, does
    not mean ignorance to the future. The future is not conceived in a progressive
    and linear life course. Instead, the life is figured out in the sense of cycle
    of life with eternal repetition. The puppet shadow play (`wayang Kulit`) teaches
    us to understand how the Javanese people perceive their world that the Javanese
    people perceive their world that every occasion has its own `lakon` (scenario
    and figures). Any `lakon` is always open for identification with certain characters
    and heroes. For the Javanese, there is no any reason to worry because any crisis
    has its own heroes and solutions by its own nature. There is no reason to take
    unnecessary action, but `eling` (being aware of one’s own capacity and role in
    the society) and `waspada` (being aware, vigilant, and careful and able to see
    the differences) are absolutely indispensable.


    The future of human living for Javanese culture would rather the question of walking
    through rather than that of pursuing happiness. Consequently, building and settlement
    in the Javanese world depends on how to exercise its indigenous capacity to embrace,
    to contrive, and to integrate everything that is coming into its realm. It is
    not to accumulate power and glory without being able to decorate contemporary
    things, techniques, and institutions within the already-existing framework.

