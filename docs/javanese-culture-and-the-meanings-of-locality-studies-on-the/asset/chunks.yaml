    # 印度尼西亚政府改革与主权


    尽管苏西洛·班班·尤多约诺在廉政政府和法律主权方面的改革议程仍不如哈比比、瓦希德和梅加维蒂的任期进步，但他在这方面已尽了最大努力。改进的真正压力实际上是新政权倒台后的自由新闻和开放的公众舆论。然而，在人权和公正方面，从哈比比政府到尤多约诺再到佐科·维多多多届，尚未出现任何基于普遍人权的公正行动和承诺迹象。针对人权的暴力行为——从
    1965 年大屠杀、东帝汶、巴布亚、亚齐、三力斯蒂屠杀，到穆尼尔被谋杀——仍然处于黑暗之中，远离正义之光。关于公正和人权的问题将由权力者在家庭原则框架内处理，该原则维护并保持了印尼民族国家和社会免受危机和动荡。


    ## 统一与完整面临的挑战


    在处理印尼国家的统一与完整性时，改革运动（reformasi）可能不会改变印尼政治共同体传统概念的根本原则；这一选择被认为是有风险的，因为它使印尼民族国家和社会的统一与完整陷入危险之中。基于普遍人权重新定义其国家和国家的空间非常有限。改革并不意图转型整个印度尼西亚的家长制社会。这不仅具有风险，而且在文化上没有必要。只要人们——以议会议员为代表——已经稳稳地坐在他们的位置上，单一制国家国家的政治就会继续照常进行。


    ## 向民主的转型


    事实上，为了人权和社会公正，需要一个从权威主义向民主体制过渡的时期，在这个过程中，新的机构、法规和法律不仅要建立和颁布，还要经过测试和验证。到目前为止，这种转型实际上未能从根本上改变人们从单一国家概念向联邦模式的思维转变。尽管治理发生了去中心化，但苏哈哈特后的国家领导人仍然持有基于中央政府家长制国家的强大民族国家概念，这种制度通过官僚机构控制和监督各省、县、区和村庄的发展政治和经济政策。军事和司法结构仍作为一种可靠的组织在执行。统一与完整感一直是并仍然作为一个大家和谐家庭的民族国家最重要的事情。在他内心深处，是爪哇对世界
    `buana` 或 `bhawana` 的认知，认为这是一个秩序良好的生物系统，这种系统之所以可持续，是因为它是顺从、纯洁且不受任何形式的反对和抵抗的。


    ## 爪哇统治概念


    传统上，爪哇统治者是统一和谐领域 `buana` 的照顾者；元首不仅是世俗领袖，还是国家典礼和仪式的精神引导者。照顾是为了为了自尊、威望和遗产将其保持在可控范围内。他的首要任务是确保国家和民族处于良好的统一状态。为了实现这种权力整合，他将竭尽全力从其前对手那里获得广泛的政治支持。迈向单一国家国家的运动通过各种形式的
    `semangat` 精神被微妙地强化，例如政治共识或国家意识形态 `pancasila`。


    ## 发展与现代性


    在发展和现代性方面，苏哈哈特后的爪哇领导人持有进步观念，其重点是基于国家完整和和谐的经济增长与繁荣。其内阁组成的潜台词显示了掌握在手中的单一国家和国家概念。因此，权力是发展的之光，它从中心向边缘以灿烂的光芒阐明并照亮其领域。巴布亚和其他印尼东部省份被苏哈哈特后的领导人称为需要加速发展的地区。这些被归类为落后省份的地区实际上不仅是因为环境开发程度较低，还因为与爪哇价值观体系以及关于在治国风格和政治礼仪背景下家庭国家的传统的文化联系较少。


    ## 政党与意识形态


    尽管 2009 年大选有正式超过三十四个政党参加，但只有九个政党有资格获得在民议会的席位。现任总统议程中缺失的是统一的意识形态。在传统意义上，像苏加诺、苏哈哈特、瓦希德、梅加维蒂、尤多约诺和佐科·维多多等爪哇国家领导人在需要强大的意识形态领导力方面有着共同点，即将所有政治流派和群体统一在坚固的信仰之下，例如苏加诺和苏哈哈特的
    `Pancasila`。`Pancasila` 不仅是一个统一印尼群岛人民的意识形态平台，也是印尼家庭国家概念的超越性顺从结构。


    根据其意识形态，苏哈哈特后印尼的九大政党可以分为两个主要流派：民族主义集团（`Demokrat`、`PDIP`、`Golkar`、`Gerindra` 和
    `Hanura`、民族伊斯兰派，以及 `PAN`）和伊斯兰党（`PKB`、`PPP` 和 `PKS`）。正如苏哈哈特的新政权时代，印尼政治中的政治流派保持不变，核心是世俗民族主义流派。当然，`Demokrat`、`PAN`
    和 `PKB` 在主流的中间派中发挥作用。他们站在拥有民族主义支持者的 `Gerindra-PDIP` 与拥有温和伊斯兰信徒的 `PKS-PPP` 之间。


    ## 亚政治文化与媒体


    除了政治文化的主流之外，确实存在由知识分子、军事、新闻媒体和非政府组织等各种群体倡导的亚政治文化。这些群体都能自由地表达他们的忧虑和思想。然而，为了让思想在系统中发挥作用，他们需要与议会的党代表和政府合作。事实上，改革最有效的代理是纸质和电子媒体，言论和表达的自由从中找到了监督政治事务的途径。在
    `reformasi` 时代，记者面临的最大威胁不再是由执行部门和议会故意设计的法律法规（Romano 2003, p. 169）。


    ## 自由主义与共产主义的威胁


    迄今为止，印尼对自由主义和共产主义的观念被视为一种可能导致单一国家体制陷入危险的疾病。政治上的公开批评和自由意见是自由主义意识形态的，这与等级习俗和家庭价值观原则（`azas
    kekeluargaan`）不符。这种批评攻击将被视为对国家父亲的不尊重和不忠。另一方面，共产主义与无神论和无阶级社会相关，这些并不符合政治文化的主流。


    '
- fmt: '

    Unlike the aptly fascistic regime of the New Order, the leaders of political parties
    in the reformasi era are collectively and individually committed to the freedom
    and democracy in their movement. However, their primary concern is still to establish
    the stability in various areas. Strong government is still in their view. This
    implies that they will unite to stand for or in favor of a centrist ideology.
    They do not tolerate any rightist or leftist group growing and getting established.
    The presidency of `Wahid` was the best example for this tendency; it was against
    the likely leftist `Megawati` candidacy. Even though `Megawati` was eventually
    to replace `Wahid` in 2001, her party did not have the choice to work together
    with the centrist parties, `Golkar`, `PAN`, and `PKB`, for the unity and harmony
    of Indonesia as nation and state.


    Nevertheless, `Yudhoyono`, `Megawati`, and `Joko Widodo-Jusuf Kalla` share something
    in common on the unitary state and nation prior to anything else. There is, however,
    no single word in their political agenda addressing universal human rights as
    their main political concern. The absence of human rights—as the main agenda of
    politics of current administration—is unsurprisingly apparent because such an
    issue will bring about the unity and stability of current political patronage,
    pride, and prophecy in jeopardy.


    The disengagement and discontentment on the outcome of reformation are inevitably
    increasing in significant quantity, which is shown from the numbers of the undecided
    voters; `golput` in the 2009 public election was higher than 2014 (`[Detik.com](http://Detik.com)`
    2014). The `Joko Widodo` factor was probably the case; the enthusiasm for going
    to public ballots was high because `Joko Widodo` and `Jusuf Kalla` were public
    figures with populist programs and without direct relations to the New Order regime.
    Indeed, some significant reforms have been made from 1998 to the present, especially
    for liberating the press and the media to express their minds and facts lively.
    However, most political parties in the country are still comfortable with the
    ancient political culture. The only true supporters of reformasi are the press
    and the media. The role and the function of the press and media would be the determinant
    agent of reformasi in advocating and disseminating human rights and democracy
    as pillars of civil society. Nevertheless, the most important part of reformation
    is likely the transformation of relationship between state and capital (Robinson
    2009). Socioculturally, such a relationship has not yet been exercised on the
    basis of the democratic mechanism for public accountability. Until recently, the
    cases of corruption show how personal relationships between capitalists and individual
    political bureaucrats remain less changed. The root of this lies in the Javanese
    concept of the world that is constituted by the unity of duality: `manunggaling
    Gusti lan kawula`; the concept affirms the reality of a wholeness between the
    ruler (`ndara` or `bendara`), and the ruled (`kawula`). The unity between the
    patrons and the clients has been incorporated in various ways, forms, levels,
    fashions, and styles of Javanese people. Other ethnic groups in the archipelago
    share this cosmological concept of dualistic unity in terms of father-children
    relationships (`hubungan bapak-anak buah`). In other words, patron-client relations
    have been socioculturally working in various aspects of Indonesian society from
    ancient times until today. This is one of predicaments of process toward democratic
    society in Indonesia.


    ### Patron-Client Ties in Rural Java


    In rural Java areas, the patron-client ties have been practiced as part of agricultural
    production. In Javanese villages, the patron-client relationship between landowners
    and landworkers builds a social bond within the framework of a big family. Such
    bonding constitutes a political and economic cooperation by which the practice
    of slavery becomes out of the question. This does not, however, say that there
    is the absence of class, but builds a form in which classes work out their relationships
    and seek political and economic accommodation (Robinson 2009, p. 216). Vertical
    mobility for class struggle in Javanese villages does not find its smooth way
    in rural Java (Wertheim 1969). This is because the patron-client relationship
    between `priyayi` and `kawula` has been developed as a synergistically binding
    system for political and economic interdependency. In so doing, the boundary of
    classes becomes unclear (Mortimer 1969). The key point of this traditional bond
    is the human relation of familial solidarity in terms of `sanak-semanak`. In the
    Indonesian context, this principle is known as `azas kekeluargaan`. The Javanese
    people understand the dichotomy of patron-client (`priyayi-kawula`) as a whole
    of a cosmologically, politically, and economically functioning relationship. This
    relationship is demonstrated by Javanese people with the practice of `gotong royong`
    and `sambat soyo` (Henley 2007) when their community deals with crises, dangers,
    natural disasters, and other communal works. The collective mobility of the Javanese
    people is not about class struggle, but more about care for their unity, integrity,
    and harmony as a community.


    ### Urban Patron-Client Relations


    In the urban context, the patron-client relationship comes into play in politics
    and businesses. The patrons control the access of resources while the clients
    are in charge as laborers, mediators, advisers, guards, and supporters of production
    and services. During the Dutch colonial times, traders and commercial activities
    fell predominantly into the hands of local Chinese merchants (Wertheim 1956).
    The patron-client ties between politicians and businesspeople have been continuing
    from `Suharto`’s New Order era to the era of reformation according to Transparency
    International’s 2014 Corruption Perception Index, which puts Indonesia at 107
    out of 175 countries (Transparency International 2015); the 629 cases in the same
    year, which have been handled and processed by `Komisi Pemberantasan Korupsi`,
    `Corruption Eradication Commission`, involve three ministers, forty-five high-ranking
    officers, and one high-profile member of parliament (Hukum Online 2009). Movement
    toward democratic society in Indonesia crucially needs to work out its framework
    from patron-clients relationships to civil democratic based on rules of law. What
    has been achieved by the post-Suharto reformation is a democratic process of governance
    through transparent and fair public election. The transformation of society, in
    the business of government from the national to the local level, has not yet been
    working effectively from patron-client relationships based on personal preferences
    to democratic connections according to laws. In other words, post-Suharto Indonesia
    needs to change the cultural perception of populations from patron-client duality
    to citizen. This is what `Joko Widodo` understands in his 2014–2019 political
    agenda as the mental revolution because it is about the transformation of mentality
    of his people from `priyayi` and `kawula` to equal citizen (`[Kompas.com](http://Kompas.com)`
    2014). He does not speak loudly but his way, style, fashion, and manner of leadership
    demonstrates what a citizen is.


    ### Concluding Remarks


    The problem of actual reformasi lies essentially in the language of `bahasa Indonesia`,
    which is, in many ways, accommodative for the house of pride, patronage, and prophecy.
    The old saying says `bahasa menujukkan bangsa`: local language designates its
    nation. Seemingly, any movement against the mainstream of paternalistic political
    culture will be confronted with counterattacks with traumatic stigma of instable
    democracy like in 1950–1955 and anti-populist communism like in 1965. Even though
    the reality of both historical events has not been totally elucidated and reconstructed,
    the status quo and its supporters claim their cultural hegemony over the facts
    for their favor that liberalism and communism are equally level with danger and
    impurity.

