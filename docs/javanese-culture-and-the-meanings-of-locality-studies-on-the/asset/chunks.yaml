  trans: '

    随着时间的推移，日常世界可能受到了精神污染（`sukerta`）的侵害，需要宇宙级的疗愈（`ruwatan`）来维持其安全健康的形态和状态。在较小的尺度上，这种疗愈发生在家庭和社区层面，被称为
    `slametan`。`ruwatan` 和 `slametan` 的共同点在于对安全且统一的世界进行符号性的边界维护（Geertz 1960, p. 14;
    Mulder 2005, p. 89）。世界重生的古老传统通过通过表演皮影戏（`wayang kulit`）来体现。皮影戏（`dhalang`）不仅扮演着皮影戏指挥和导演的角色，而且在
    `murwakala` 特殊神话的表演中担任古代祭司的角色，这是一个关于怪物之神 `Kala`（时间）的诞生与成长的故事，他拥有吞噬世间一切的力量。`ruwatan`
    和 `slametan` 无非是爪哇人对时间力量的承认和尊重。统一与和谐不仅仅被理解为人与人之间的关系，而且被视为所有民众（`praja/kawula`）对其统治者（`raja/gusti`）承诺与忠诚的验证、肯定和确认。对政府各种批评和反对被视为对掌权者以及国家和民族侮辱、不忠和不尊重。此类行为被认为是对宇宙秩序的污染和破坏稳定。


    ### 权力与危险的概念


    权力与危险的概念是由玛丽·道格拉斯（Douglas 2002, pp. 117–40）在其对文化价值、知识和宇宙观的研究中引入的。道格拉斯追溯了文化背景下“洁”与“污”的不同概念，这些概念深根于安全宇宙领域的符号边界。在爪哇语境下，纯净深根于世界纯净形式
    `bhawana` 的概念中。因此，纯净的形式是安全的（`aman`）、可管理的（`tentram`）、秩序良好的（`tata`）、健康的（`rahayu`）以及繁荣的（`gemah-ripah`）。讽刺的是，维持这种纯洁的力量被称为
    `wasa binatara`，字面意思是“天上的、恐怖且惊恐惧的力量”。


    ### 权力的具体形式


    由于爪哇文化以及印度尼西亚文化中权力的概念是具体的（Anderson 2007, p. 22），统治者的宝座成为霸权的重要展示窗口。权力是具体的，因为它由统治者的席位或宝座来代表。那么，接管宝座就意味着声称了统治者的地位。然而，关于其具体形式，权力需要以壮观事件或宏大展览的形式呈现。因此，爪哇传统中霸权的意图不在于行使日常政治事务的权力，而在于集中和保护已有的权力（Anderson
    2007, p. 5）。权力的意图是为了为了统治者崇拜通过一场盛大的表演来履行这种权力。其首要目的不是为了娱乐公众，而是为了君主自身的自我伟大。通过这种方式，统治者从世俗现实升到了超越领域。他/她把自己塑造成一个不可侵犯的存在；他/她能够从上方俯瞰子民。


    ### 整体性与内在


    在爪哇语境下，权力的集中和保护在文化上与未受污染的完整性以及超越与内在的统一（`sejatining utuh lan manunggaling gusti
    kawula`）的概念有关。不纯被认为与碎片化（`modal-madul`）和混乱（`gonjang-ganjing`）相关。不纯不仅被包含了针对爪哇世界统一性的破坏性成分、流和运动的污染，而且在宇宙论上也某种程度上向混沌和迷失状态退化。


    ### *Kuasa* 的概念


    在印度尼西亚，权力与文化始终是霸权概念 `kuasa` 的一对互换词汇。因此，将权力建立为 `kuasa`、`kekuasaan` 不仅仅是权威的制度化，它还包含了一种具有强烈使命感的、针对统一国家和精神和文化霸权。这种使命感在历史上塑造并确立了印度尼西亚的政治文化。在日常实践中，国家（`negara`）是官僚专制主义，它以
    `agung-binatara` 的形式行使并属于权力 `kuasa`，意为“恐怖的权威”（Mudjanto 1986）。因此，统治者既不是公职人员也不是代表领袖，而只是
    `penguasa` 意义上的统治者或主人；国家官员是 `penguasa`，字面意思是霸权者。在最广义上，`penguasa` 的概念实际上是一个比我们的生命更大的支配机构。这样的机构能够接管你的行动和决定，因为你是他她的奴隶（`kawula`
    或 `hamba`）。普通人被视为 `hamba yang didaulat`，即在主人仁慈下的奴隶。`penguasa` 是恩赐者，也是仁慈的提供者。


    `penguasa` 的另一个概念是 `pemerintah`，来自词 `perintah`，字面意思是命令、指示、秩序和指导。国家官员概念上是 `penguasa`
    和 `pemerintah`。改革运动尚未成功将政府的概念从其霸权地位转化为公共代表性工作。任何掌权者都被预期为他们所王国的教父。因此，领袖在意图和行动上必然是统治性的（`menguasai`），因为他们被视为在状况方面的知识和洞察上高于平均水平的人。


    ### 民主主义中的混合主义


    由于爪哇政治文化在概念、形式和实践上都是复杂的，它对印度尼西亚政治文化的渗透是微妙且经过礼貌和优雅处理的。爪哇式专制和家长制的霸权模式从不进行直接对抗。将他人置于爪哇控制之下是识别、同步和整合他人的优劣势。这实际上是爪哇传统中混合主义的实践，体现为
    `laras`、`nglaraske`，字面意思是和谐和谐或“使其和谐”。在这种意义上，民主的概念将与爪哇的 `saresehan` 和 `rembugan`
    或印度尼西亚的 `musyawarah`（公开协商）达成 `mufakat`（共识）的概念统一（Tjiptoherianto 1996; Rais and
    Najib 1999）。因此，作为 `kuasa` 或 `kekuasaan` 的权力必须利用其所拥有的一切来掩盖缺陷和弱点。因为丑闻而下台既不是 `kuasa`
    霸权概念的优雅退出，也不是体面的解决方案，而是耻辱的。与其辞职，不如 `kuasa` 促使掌权者维护他们作为 `penguasa` 的形象（`citra`）和威望（`wibawa`）。将责任归咎于下级官员是这种丑闻和滥用权力的常见做法。

