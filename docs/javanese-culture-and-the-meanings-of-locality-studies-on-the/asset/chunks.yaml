    The thesis as argued by Kulke (1991) that in ancient Java prior to the period
    before the tenth century were states without cities is barely acceptable and considered
    a hasty conclusion. Accordingly, urbanism is not simply about physical structure,
    but rather it is about culture. In the case of the Javanese experience, judging
    urban settlement without mentioning the relationship between urban structure and
    the concept of power and state is historically inadequate because the sense of
    urbanism lies in its political institution of state system. Lack of physical evidence
    for urban infrastructure is not a solely determinant factor in the Javanese and
    Indonesia context because most building elements of settlement in this tropical
    land are subject to perishable materials. Only stones and terracotta are used
    for monumental buildings. This fact leads us to scrutinize aspects of urbanism
    beyond its physical structure. Since the essence of urbanism is conceptually for
    being urbane, then the Javanese people understand this concept as `karma` (codes
    of courtesy and manner) in terms of `alus` (culturally cultivated). The center
    of `kuta negara` has always been associated with the place where cultural cultivation
    and fine manners have been practiced. In the Javanese context, urban and non-urban
    or rural areas are distinguished not by their physical structure, but by their
    conducts of civility. Most Western scholars might have overlooked these criteria
    in understanding what urban in Javanese culture is.


    # Chapter Three: Kuta Negara


    ## The Javanese Idea of City/State and Its Historical Evolution


    In spite of its origin from the Indic civilization, `negara` as a concept of state
    and statecraft has been adopted, adjusted, and modified by Javanese culture in
    various ways and fashions. Throughout the centuries, the Javanese `negara` has
    been developing with its own way and style of dealing with urbanity and civilization.
    This chapter argues that the Javanese urbanism is a center without definite periphery.
    The approach of this chapter is hermeneutical and conceives the urban world as
    the text of locality. The chapter will examine and scrutinize local concepts related
    to the phenomena of urbanity and settlement. The purpose is to unfold and dismantle
    their constituent relations and structures of meanings. The materials of the chapter
    were carried out from author’s experience as a native Javanese, who completed
    intensive fieldwork in Java between 1993 and 2010.


    ## Urban Settlement in Javanese Culture


    The history of urbanism in Java is inevitable to deal with the fact that urban
    form in this culture is probably not defined by its economic potentiality, but
    by its ritual and symbolic purpose. Studies by Wertheim (1980), Evers and Korff
    (2000, pp. 25–37), Bishop, Philips, and Yeo (2003), and other scholars—McGee (1967)
    and Ginsburg (1955)—confirm that the idea of urbanism in Southeast Asia is theoretically
    puzzling though its urban form has two main patterns: the inland states and harbor
    principalities. Hitherto, such theories came from the Western point of view. Wertheim’s
    notes on Peter J. M. Nas’s *The Indonesian City* remind us that the study needs
    to listen to the Indonesian side on their cities and society (Wertheim 1987).
    This chapter is in response to Wertheim’s call and an attempt to disclose and
    unfold the evolution of state and city in Java from inside, with specific reference
    to local concepts, texts, and artefacts.


    The other reason to write this chapter is the fact that urban studies with focus
    on urban form and culture in this region fall short of publication. While most
    scholars on Indonesian urbanism are largely right in their analysis and theories
    on uniquely patrimonial and despotic cities and towns in Southeast Asia, they
    seemingly overlook some important aspects of the relationship between urban form
    and the local political culture on Java, which is preserved and conserved in native
    language.


    To a certain extent, urban culture comprises a system of ideas, values, principles,
    and expectations that works in its society in various forms, media, and manners.
    In order to be collectively sharable, urban culture needs to be communicative.
    Culture is a kind of text that is necessary to be read and to be depicted according
    to locality (Geertz 1983, p. 70; Geertz 1973, pp. 11–12). This chapter argues
    that the intentionality of the Javanese city/state lies in its concept of power
    in terms of spiritual center. Accordingly, city and state are conceptually interchangeable
    depending on how the center appears phenomenally as form or event. Under the notion
    of intentionality (Searle 1983), this chapter perceives the city as the world
    toward which and by which people are (Kulke 2001) a politically and culturally
    constructed reality of Javanese locality. Besides archaeological artefacts, historical
    texts, and local customs and traditions, the primary source of contextual readership
    of this construction is the local concepts, their meanings, and their context.
    However, analysis and interpretation is focused on the relationship between concepts
    and phenomena that construct and establish the things and events of the Javanese
    city/state.


    Although historical studies on early states and cities in Java Indonesia have
    been made by several scholars (Coedes 1944/1968; Lombard 1980; Nas 1986; Rutz
    1987; Wisseman-Christie 1986), misunderstandings are possibly made, in some cases
    because local concepts are mostly untranslatable in other languages. A further
    investigation is still needed to bring the meanings of local concepts into the
    light, which is supported with more local materials on urbanism in the Indonesian
    context. Indeed, most scholars on Indonesian urbanism are largely right in their
    analysis and theories on uniquely patrimonial and despotic cities and towns in
    Southeast Asia. However, they seemingly overlook some important aspects of local
    political culture that is preserved and conserved in the native language.


    Wisseman-Christie (1991) argues demographically that settlements in pre-colonial
    Java prior to the twelfth century were states without cities. How were they possible?
    The question still lingers today. Since state and urbanism are historically indivisible
    as a consequence of the concentration of power, the phenomena of town and city
    are inseparable from the local concepts of hegemony and political culture. Wisseman-Christie’s
    conclusion that ancient Javanese kingdoms were states without cities could have
    been incomprehensive without examining and scrutinizing the Javanese idea of power
    and its local concepts. The concentration of power does not need a centralization
    of people and their settlements in one place. In Javanese tradition the concentration
    of power is more about the spiritual and symbolic seat of cosmic energy; the sense
    of center of power is experienced as a mysterious and secretive place. The more
    one comes closer to the core of power, the more one experiences its enigmatic
    aura and environment.


    Although between the ninth and early thirteenth centuries Javanese populations
    were dispersed, their kingdoms achieved highly elaborate and strictly fixed hierarchy
    of state officers and local authorities (Kulke 2001, p. 16). The question remains
    open concerning spatial structure and domains. How was such erudition architecturally
    incorporated in their land use plan? The question leads us to investigate what
    is `negara` in early Javanese kingdoms, and during the Islamic, colonial, and
    republican eras.


    Regarding Indonesian urban culture, there is likely nothing more important than
    the political institution of `negara` because the notion includes urban, center,
    city, and state. From ancient time until today, `negara` and `kuta` or `kota`
    were indivisible concepts that pertain to the center of power.

