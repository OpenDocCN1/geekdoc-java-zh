  trans: '

    其次，`kuasa` 的意图性是威望（pamor, gengsi）和自豪（wibawa, harga diri）的宏大。这一切与公共服务的奉献或投入无关。相反，`kuasa`
    的理念更多是关于为了统治者（raja）及其国家（negara）和王国（kerajaan）的威严而动员资源的权力。尽管今天统治者的头衔已从 raja 变为 presiden（总统），政体也从
    kerajaan 变为 negara，但这些概念的含义大部分保持相同，仅在少数处进行了微调。


    在印度尼语语境下，`kwasa` 与印尼语单词 `kuasa` 相似，字面意思是权利、能力、力量、权威和威望。因此，`kuasa` 的概念既不是财富方面的权力，也不是知识方面的权力。相反，`kuasa`
    的概念强调并突出了全能的权威以及判断对错、得体的特权能力。


    古代的 `Wasa` 或现代爪哇语中的 `kwasa` 是一种用于控制、统治和支配他人的权力概念。它的实践突出并强调了权威的概念，对于他们的决策和行动，这种权威是绝对且不可谈判的。作为一个概念，`kwasa`
    是具体的，表现为坐在王座上的统治者的特权。任何能够获得那个位置的人都是具备 `kuasa` 持有者或守护者资格的人。传统上，成为具有这种定义的统治者不需要合法的程序和步骤；人们只需要勇气和能力通过政变或平稳过渡与继承来获得它。尽管在苏哈托后时期的印度尼西亚，正进行着权力转移的民主进程，但这并不意味着非合法的权力转移不会发生。


    第三，作为权者，他/她是 `atasan`（上级）、高级权威或受托人，拥有行使预言语言（turur, pinutur）的权利。`atasan` 不仅是发布指令或方向的上级，而且传统上还被认为是一个父性的形象，对于任何个人到官方事务都值得信赖。对
    `atasan` 或 `penguasa`（统治者）的忠诚和奉献是强制性的，这意味着这关乎道德，而是关乎权力的侮辱、不尊重和耻辱。在 `kuasa` 以及
    `kekuasaaan`（权力状态）的概念下，权威是神圣的主宰（gusti, tuan, datuk），在他/她的监督下的所有人实际上都是奴隶（kawula,
    hamba, abdi）。权者（`penguasa`）无论是作为高级国家官僚还是警察，都具有成为统治者的能力。他/她的主要工作不是服务其选民，而是统治其支持者和追随者。


    在宗主制权力的日常事务中，预言语言属于正式场合的开场白。任何公共倡议和行动的启动都要获得当地统治者（`penguasa local`）的 `restu`（批准、祝福）以及
    `petunjuk`（建议、指导）和 `pengarahan`（指示）。这一切反映并代表了基于自豪、赞助和预言的戏剧性政治文化实践，其中权者（`penguasa`）是此类公共场合和活动的华丽导演，而其他人则是他/她谦卑的观众。他/她也是那个有特权通过击鼓等仪式仪式或发表带有预言信息的开场白开启活动的人。在许多情况下，统治者在社会文化问题上扮演着社会治疗师的角色；在某些情况下，他/她也是道德问题判决的祭司。


    举办公共活动或场合并非简单的社交聚会。在印尼政治文化中，此类事件被视为宇宙境界的诞生，需要当地权威（`penguasa setempat`）的仪式性祝福、许可和认可。这种惯例请求和认可不仅仅是为了礼貌和客气。相反，它是与当地世界保持一致的必要；当地权威被认为是掌握和控制其领土内秩序与和谐的人。在
    `kuasa` 及其领域（`kekuasaan`，权力范围）方面，所有公共活动和事件——从社交聚会、筹款活动到学术会议——必须在他/她的 `restu` 之下，这意味着祝福、控制、仁慈、知识和批准。


    在 `kwasa` 或 `kuasa` 方面，维持权力意味着能够动员人们进行宏大的自我修养（praja binatara）。履行国家仪式和奇观是作为 `kwasa`
    权力或力量的最重要展示之一。这包括群众动员和人群控制。作为 `kwasa` 的权力概念的扩张性后果不仅仅是为了政治影响和经济利益。相反，这种需求深植于统治者对自身权力宏大奇观（grebeg）的渴望。这包括动员人们为了国家和国家的利益集体做事。最近，一些政治领袖和
    CEO 呼吁他们的粉丝和下属在每周的某几天穿蜡染衣。作为总统，Yudhoyono（2004–2014）动员印尼公民从 2009 年 10 月 2 日开始每周五都穿蜡染衣（[Detik.com](http://Detik.com)
    2009）。印尼历史上群众动员的大师是富有魅力的苏加诺；他经常用他的修辞演讲在每个国家活动和正式场合动员群众。作为一位伟大的演讲家，苏加诺能够用他巨大的魅力人格吸引观众并拥有他们（Cederroth
    2004, p. 82）。


    为了赋予其权力动员群众的能力，创造了一种精神统一的信条（semangat），并将其宣布为运动精神。`semangat` 的起源实际上是个人力量（prabhawa），它作为内在力量、坚强性格和勇气存在。`prabhawa`
    体现在富有魅力的人格和吸引中，使他/她能够获得 `kwasa`。尽管 `prabhawa` 通常与个人天赋和天赋相关，但爪哇传统教精英们通过各种方法和训练（如禁欲、冥想和斋食）来获得这种力量。这一切都是为了使他的格格神秘化，并让他远离现实世界，少言多，并高度自制。为了保持他的威望（wibawa）和形象（prabhawa），作为统治者的
    raja 或 ratu 扮演着 pamong praja（人民导师）的角色，即作为统一宇宙体系中国家的整合者、保护者和拯救者。

