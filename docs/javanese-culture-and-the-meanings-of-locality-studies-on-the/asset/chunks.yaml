    此外，描述美好事件的对应概念 `rahayu` 则是 `endah`。`endah` 的概念对于“某种美”而言，与其对人类快乐和舒适情感的影响有关。某种事物之所以是
    `endah`，是因为它根据氛围和发生范围为我们的感官带来了愉悦感。展现景观的自然特质及其视觉构图是通过 `endah` 概念来表达的，这种愉悦感是从体验其奇观中产生的。然而然而，一幅优美的风景画并不适合用
    `endah` 的概念来定性。相反，这种美是用 `apik` 的概念来描述的。


    `endah` 的意义在于其在自然环境中被即时体验到的美。与语境或环境相适应可以被定性为 `endah` 概念，前提是该事物不仅在景观或背景中恰当合适，而且还能以具有美学深思考虑的属性提升整体构图。在爪哇文化中，与周围环境恰合被称为
    `cocok` 概念，其字面意思是恰当、正确且相互匹配的。因此，在 `cocok` 的基础上，符合语境和环境的事物被认为达到了 `endah` 的美学特征。


    ![](img/Figure_1.1.jpg)


    图 1.1 阿尔达纳里像，湿奴与帕尔瓦蒂的单一化身，来自东爪爪德里地区，约 12 世纪。摄影：Bagoes Wiryomartono。


    对于爪哇人来说，音乐的美概念是什么？如前所述，在爪哇文化中，自我放纵背景下的快乐被认为是不道德的或不符合伦理的体验。这里的美音乐并非为了在个人基础上体验而带来的某种愉悦。相反，甘美兰乐队的音乐并非作为爪哇娱乐的主菜表演，而是作为影皮戏、舞蹈和仪式活动的背景音乐、配乐或支持系统。当然，五音阶（`slendro`）以及七音五阶（`pelog`）甘美兰音乐的和谐节奏被高度重视，能够以合适的节奏、柔和和响度以及深度和宽度来增强和支持主表演。


    再次，美学概念 `apik` 适用于描述具有完美编排、表演和创作质量的甘美兰音乐。爪哇传统中的音乐欣赏由 `nglaras` 概念组成，意味着与人类行走的节奏保持一致。与行走的节奏（`mlaku`）一致本质上是爪哇人处理时间的方式。`nglaras`
    无非就是将存在的时间结构与行走对齐。


    在爪哇文化中，存在与居住可能由行走（`mlaku`）概念组成。因此，存在的暂时性尽可能自然地以节奏律标记。人类活动（包括艺术）的目的是融入到节奏宇宙中，正如通过行走体验到的节奏，在
    `laku`、`lakon`、`nglakoni` 的意义上，意味着在心跳节奏中体验存在的意义。爪哇人将此体验为与“当下”立即接触的方式。


    事实上，起伏以及快慢属于人类穿行于时间之行走的变异。然而，回到寻找行走的节奏是爪哇人在 `nglaras` 概念内存在于世界的方式。存在与居住（`lungguh`、`lenggah`）实际上是坐着在聆听即将到来的事的同时，体验心跳的节奏。存在与生活的任务不是为了自我实现的需求去达成某些东西。相反，对于爪哇人来说，存在与生活的意义是在通过穿过时间所体验到的心跳节奏整合框架内，带出即将到来和被给予的东西。爪哇之旅的终点在哪里？这个这个问题对于爪哇文化来说听起来是琐事的，因为通过能够找到生活的节奏，我们已经处于存在与居住的终点。根据爪哇文化，这就是美的本质。而存在的目的无非根据感官愉悦并神化世界（`memayu
    ayuning bhawana`）。


    在爪哇文化中，成为艺术家就是成为社区的一部分，爪哇的美学目标是成为集体艺术。艺术品需要无私的奉献和投入。它并不是为了赞扬艺术家，因为艺术家就像社区中的任何其他劳动者一样。艺术品应该是社区的庆。尽管爪哇文化的艺术作品包括许多文学、视觉和表演艺术领域，但
    `wayang`（皮影）、`batik`（蜡染）和 `gamelan`（甘美兰）是今天最流行和代表性的作品。


    ### Wayang


    `wayang` 的美学是什么？`wayang` 不仅仅是爪哇文化和传统的剧场。它关乎生命的哲学以及当代政治和社会观点。尽管 `wayang` 表演的故事大多描写自印度史诗《罗摩衍那》和《摩诃婆罗多》，但戏剧的核心主线是关于以交流方式的爪哇思想和伦理。`dhalang`（皮影戏）的作用和功能是爪哇理想的伟大传播者。有趣的是，社会政治事务属于
    `wayang` 表演的主题。处理该剧目的场合代表了当代语境下的爪哇世界。戏被认为是爪哇世界现实的影子。`dhalang` 一词字面意思是一体导演、演说家和演员。表演
    `wayang` 的艺术是在戏中让爪哇世界活起来的艺术。戏的总结显然是文化对原始、贪婪、不公、欺骗和傲慢的胜利。


    ![](img/Figure_1.2.jpg)


    图 1.2 皮影戏舞台，印度尼国家博物馆收藏。摄影：Bagoes Wiryomartono。


    关于美学，`dhalang` 在表演审美质量上起着重要作用。这包括他对戏剧叙述和当前社会政治事务的知识。事实上，一个优秀的 `dhalang` 是一个对当代世界具有批判性感知的全才艺术家。他尖利的言辞、理性的评论和对时事的巧妙幽默，在
    `punakawan`（平民代表人物）登场的午夜场景是必要的。通过这种方式，他不会让观众从晚上 9 点到 10 点直到凌晨 4 点到 5 点感到无聊或入睡。


    在开场场景中，美学深思考虑的 `wayang` 表演通常主要表演一系列描写 `satria` 形式的理想爪哇性格的场景。普通世界通常被呈现为混乱、无序和困的领域，这是贪婪、欲望和愤怒的后果。主角
    `satria` 被召唤来应对特定的场合。故事将是描写 `satria` 一系列考验的场景：他必须准备好知识（`elmu`）、技能（`kanugaran`）和个人成熟（`mantep
    satria`），以便他能够恢复世界的统一、和谐和可持续性。

