  trans: '


    在爪哇岛以及印尼西亚的大部分地区，从 `negara`（国家）的角度来看，城镇与乡村或聚落的区别在于两个至关重要的物理组成部分：一个永久性市场和一个权力中心。这两个机构都是印度尼西亚前伊斯兰时期
    `negara`的关键结构，它们在政治和经济上都定义了 `negara` 的中心。`kraton`（皇宫）与 `peken`（市场）的共存决定了国家首都（`kuta
    negara`）的存在。然而，这两个中心机构并没有永久性或纪念性的结构。


    尽管如此，古代爪哇族统治者并非大多用石头建造自己的宫殿。他们可以这样做，但除了寺庙和纪念碑，他们并没有建造永久性的结构和建筑。在伊斯兰教国家之前，统治者的权力中心随着国家的消失而消失了。显然，8
    世纪 `Ratu Baka` 的遗迹引导我们推测，该地可能是古代爪哇宫殿的所在地。确实，`Ratu Baka` 遗址为我们提供了更多证据，证明 `candi`（寺庙）之外存在永久性建筑。鉴于该遗址建筑群位于战略性的山丘上，这一事实可能会否定我们的推测，因为爪哇传统中的大多数
    `kraton` 总是位于平原和平坦地区，而不是孤立的山丘，且周围是而非 `desa`（村庄）的森林。


    ![](img/Figure_2.12.jpg)


    图 2.12，约公元 1037 年位于巴厘岛 Gunung Kawi Tampak Siring 的 Airlangga 神庙。摄影：Bagoes Wiryomartono。


    根据 792 年的 Abhayagirivihara 铭，该地与 Sanjaya 王朝 `Rakryan Panangkaran` 的 `vihara`（佛教）有关。`Abhaya
    Giri Vihara` 的意思是和平山丘上的寺院。它应该是一个佛教寺院，或者是前统治者致力于精神目的的修养场所。根据遗址图，该建筑群显示了印度教和佛教元素——`Durga`、`Garuda`、`Ganesha`、`Yoni`
    和 `Lingga`，以及三座未完成的 `Dhayani Buddha`——所有的用于仪式沐浴的池子（`paseban`）和用于冥想的圣洞穴。遗址上的两个被称为
    `hara` 的 `lingga` 刻有 `778 Saka` 或公元 886 年的日期。此外，`lingga` 铭文提到了它们是在 Kalasobhawa
    王的命令下建立的。佛教和印度教信仰的统一在铭文上显而易见，文字为：`Om Rudra ya namah swaha`，这用佛教的方式崇拜湿婆。


    爪哇人的中心思想确实不仅是向外扩张的辐射控制，而且在形而学上将每个世界吸收到统治者的自我。这意味着承认统治者的至上和霸权不仅在政治上一致，而且在精神上臣服。权威的积累等同于力的吸收。正如在
    `Rukam` 铭（约公元 907 年）中发现的，国家理念是以领域（`wanua i rukam wanua jro`）表述的（Boechari 1976）。随后，整个国家理念（`negara`）就是自我（`dalem`、`jro`），作为权力中心辐射光（`teja`）的扩张圆。


    事实上，国王的住所象征性地位于 `negara` 领域的最内层。但爪哇统治权的扩张能力并不总是领土性的，在国家仪式和活动方面也是文化性的，他/她的王国的所有人民出席并聚集，臣服于统治者展示的壮丽奇观。最终，统治者的自我是爪哇家庭的精髓，它扩张性地主张在其霸权下凌驾他人。这一切通过其国家仪式和活动作为壮丽的奇观得到了戏剧性的表现。


    尽管如此，也许为什么西爪哇的 `Purnawarman` 在他的铭文中，除了宣布自己为地主之主（`parthiwa indra`）外，还向来自早期印度古普塔帝国的婆罗门（Reily
    2012, p. 116）表示感谢，感谢他们对他王权的支持。作为捐土地的回报，祭司们对他的卓越地位和国家仪式建立的支持；这一切都是为了作为神 `Isvara`
    或 `Wisnu`（毗）王的崇拜。因此，他可以为自己的崇拜和遗产建造特殊的纪念碑。`Purnawarman` 的遗产刻在有他脚印的石头上。


    从建筑上说，作为绝对统治者的个人崇拜的自我满足和主张可能从 11 世纪东爪哇 `Sindok` 的统治开始。更准确地说，是 `Airlangga` 将自己神话为地上的
    `Wisnu`。他的纪念建筑位于巴厘岛的 Gunung Kawi Tampak Siring。正如 Ngimbang 铭提到的，`Airlangga` 在公元
    1037 年成功集中了他的权力并具备了 `cakrarvartin` 地格（Pigeaud 1960, p. 470）。从那时起，`Kediri` 和 `Singasari`
    的权力通过赋予统治者作为整个精神和世俗世界之主的 `ratu cakrawati` 身份的国家仪式得到了证明。


    `Kota` 或 `kuta` 最初是一个梵语外来词，意为筑固的领地。墙（`turus`）更多是为了象征目的而非实际用途，因为传统上它既没有提供军事营房和后勤及武器的仓库，也没有定居点的集中。传统上，墙被爪哇人构想为
    `dalem` 的结构，字面意思是自我。也许宫殿和国家并不是为了大量密集的人口而发展的，因为这不是需要的。中心被构想为偶尔发生的壮丽奇观场所，例如 `sima`
    仪式和活动（Munoz 2006, p. 348）。


    ## 结语


    尽管在 5 世纪到 10 世纪爪哇和印尼其他地区的潜在城市化遗址考古挖掘很少，但定居点的可能性是显而易见的。然而，它并没有以集中和人口稠密的形式发生。相反，集中体现在宫廷文化方面。确实是通过复杂的社会系统支持宫廷仪式和活动。尽管政治和经济中心没有通过宏大的城市建筑来证明，但国家仪式和活动的壮丽奇观是需要的，这些活动在城镇广场举行。


