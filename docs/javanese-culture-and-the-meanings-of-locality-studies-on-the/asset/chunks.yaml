    事实上，爪哇神话中卡拉（kala）的诞生与任何周年纪念或特殊事件无关，而为了提醒人们这个时刻需要 `ruwatan` 的消灭世界。`ruwatan` 源于
    `ruwat` 一词，意为在关注可持续性的前提下从消灭中解放出来。`ruwatan` 的含义与爪哇的 `slametan` 仪式密不可分。克利福德·格尔茨（Clifford
    Geertz）曾详细描述了 `slametan` 在爪哇成年礼中扮演着重要角色（Geertz 1960, pp. 77–85）。他的描述在今天仍然有效，特别是在爪哇中部和东部的农村。因此，这些仪式致力于维护世界的统一（`manunggal`）、和谐（`rukun`）和可持续性（`lestari`），并对死亡命运表示接受（`nrima`）。


    在爪哇的创世神话中，时间作为消灭的符号和力量，被描绘为 `Batara Guru` 和 `Batari Uma` 之子。尽管他在爪哇传统中的形象是一个怪物、粗鲁、直率、冷漠且对任何生物都无情残暴的生物，但
    `Batara Kala` 从未进行血腥的暴力。`ruwatan` 的必要性更多是对世界福祉、统一和和谐的预见性维护。有几种 `murwakala` 仪式，包括个人福祉（`anggara`）、社区福祉（`mageri`）以及规避自然灾害（`sengkala`）。爪哇宇宙观中的世界被视为一个时刻面临着消灭和转瞬即逝威胁的生物领域，这引发了对持续关注和照顾福祉（`slamet`）的必要性，其中包含了统一（`manunggal`）、和谐（`rukun`）和可持续性（`lestari`）。


    皮偶师（`dhalang`）扮演着祭司的重要角色。祭司通过 `wayang` 表演宣布并引导 `ruwatan`。爪哇人——从该岛的西部到东部——自伊斯兰教时代以前一直实践着这一传统。最初，`murwakala`
    仪式作为 `wayang purwa` 开场场景的一部分进行的（Moerdowo 1982, pp. 13, 21, 22; Ulbricht 1970,
    pp. 14–21; Florida 1995, p. 273）。关于创世神话的古代咒语向所有年龄段的观众叙述。神话的信息通过各种权力游戏场景中的某些角色变得明确：世界需要从消灭中解放并维护其可持续性。为了实现这一目标，集体意识被唤起并动员为一种道德力量。


    尽管其概念化模糊且深奥，但 `ruwatan` 对爪哇世界的重要性在于对集体关怀的呼，以及对死亡的意识——即统一和和谐并非偶然，而是社区意图和努力的结果。诸如
    Foley (2001)、Headly (2000, pp. 8–9, 91) 和 van Groenendael (1985) 等学者观察到，在爪哇西部、中部和东部的许多地区，`murwakala`
    仪式作为 `ruwatan` 的一部分，由 `dhalang` 引导的 `wayang` 表演赋予了异域情调意义的恐惧和危险感。`dhalang` 及其 `wayang`
    表演被认为是爪哇文化的战略载体，通过娱乐包传递、传播并维持了古老的爪哇教义。


    尽管 `wayang purwa` 的起源可能源于新石器时代，但其关于 `murwakala` 仪式的内容和表演演变与印度文明（如《罗摩衍那》和《摩婆罗》）以及爪哇本土文化的融合是不可分的。对于爪哇人来说，`wayang`
    传统不仅仅是娱乐。相反，皮戏是伦理、审美学的来源，也是生活的哲学。


    从社会学角度来说，爪哇的 `wayang` 传统也是普通人和农村人的声音。然而，`wayang` 传统在爪哇社会的有效性在于其艺术性的娱乐能力，这种生动、吸引人的表演将古代信息和现代问题相结合。尽管
    `wayang` 表演作为文化融合的媒介和代理以各种形式和风格发展起来，但其呈现的核心信息非常明确：它在当代背景下唤起并阐述爪哇世界；这包括描述一个具有理想、危险、限制和机遇的世界。`dhalang`
    及其赞助者通常表演古代传说的特定主题和故事（如《罗摩衍那》或《摩婆罗》），这实际上是对他们社会当前事务的响应，涵盖从政治、经济到社会的问题。`Murwakala`
    是一个象征危机管理的重要主题。`murwakala` 仪式以及 `ruwatan` 最重要的方面是在历史和集体价值内确立爪哇世界的身份和边界，这通过皮影戏表演来传达。


    与群岛的其他传统文化不同，爪哇的古代传统在今天仍通过 `wayang` 表演继续生存。由于伊斯兰影响了爪哇社会，古代祭司（`mpu`、`pandita`）的作用和功能已经转化并委托委托了皮偶师（`dhalang`）。这种连续性在南尼亚和托纳拉贾（Tana
    Toraja）并不存在。这两个地区的本土祭司（`ere` 和 `to mina`）自从欧洲传教士在村庄建立基督教教会以来已逐渐功能丧失并消失。在爪哇，本土传统一直通过
    `wayang` 和 `gamelan` 等表演艺术延续至今，这些艺术作为古代世界的艺术娱乐载体。


    ### 爪哇传统中的艺术原则与艺术家


    在爪哇文化中，统一是通过创造者与创造物之间的身份同一原则实现的，这通过 `manunggal` 概念表达；统一本身是权力的核心象征（Anderson 2007,
    p. 36）。对统一、和谐以及可持续性的需求在于，爪哇信仰体系中的生命（`hurip`）是二元对角色和现象的协同作用。对于爪哇人来说，生命和世界的现实如果没有天与地、男与女、形与内容以及外与内的契合与完整是不可想象的（Yumarma
    1996）。因此，艺术作品的任务是将所有不同的事物聚集在一起，迈向统一、和谐和可持续性。对分裂和混乱的恐惧促使了统一、和谐和可持续性的必要性。作为回报，每个生物都必须有其适当的位置，对爪哇世界具有独特特定的功能和贡献。因此，不存在“异质”的概念，只有爪哇世界和语言之外的未知。


    在爪哇世界成为艺术家，意味着根据资历、教育、经验、成熟和社区服务处于适当的位置。创作创新和即兴发挥的空间是为了符合社区内部和谐的原则。这意味着在传统方式下，个人自由可能是不受质疑的（Mulder
    2005, p. 70）。


    爪哇万灵论相信每个生物都是含有宇宙力量（`Jiwa` 或 `isi`）的容器（`wadah`）。对他生物的尊重（`ngajeni`）通过祭品（`sajen`、`sesajen`）体现，即爪哇历每五天一次的鲜花和食物。焚香是这种祭祀仪式的一部分。这种做法属于古代和印度教之前的仪式，作为对祖先和宇宙中无形力量尊重的表现。


