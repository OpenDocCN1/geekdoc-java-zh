    proclamation of independence of the Republic of Indonesia was the myth for `Sukarno`
    as well as the moment of dubious `Supersemar` (presidential instruction on March
    11, 1967) for `Suharto`. Javanese rulers struggle to monumentalize such moments
    and try to convince themselves by building `prasasti` (monumental inscriptions)
    and `tugu` (memorial statues). `Suharto` built his monuments in commemoration
    of his early achievements in Yogyakarta: `Yogya Kembali` (1985) and `Serangan
    1 Maret` (1974). In doing so, `Suharto` would have inserted his presence as a
    national hero and savior of nation from early on in his career in the Indonesian
    Military and political system.


    # Modern Kota Negara and the Myth of the Past


    `Kota` is an Indonesian word for the Javanese `kuta`. `Kota` in general is a political
    institution of settlement with certain status. Past buildings and places are subject
    to the validation of their possibly adjusted relationship and commitment with
    the contemporary ruler. It is not surprising to witness the fact that the change
    of their majors, `walikota`, means the possible transformation of its symbolic
    center, main boulevards, seat of authority and institutions, `alun-alun`, mosques,
    `pasar`, etc., whereas the citizens, `warga`, are not the passive spectators of
    the state event. Rather, town dwellers are spectators and performers at once who
    participate in the making of the spectacle. The state occasion is considerable
    the vivid spectacle when the concept of home within the framework of `negara`
    is demonstratively performed in various enjoyable gatherings (`kenduri`). After
    all, if the ruler is not able to maintain `semangat` because of fatigue and exhaustion,
    it is also the time when chaos, anarchy, turmoil, and disorder come into being.
    Then a new ruler is waiting to pick up a new `semangat` for signifying the call
    for the rebirth of cosmos. Every epoch (`jaman`) must likely have had its own
    ruler (`penguasanya`) and its own `semangat`. And every ruler must have had its
    own stage with its own story and performance.

