    ## About the Author


    Dr. Bagoes Wiryomartono is an independent scholar and currently on leave as faculty
    member at the School of Design, University of Pelita Harapan, Karawaci Tangerang
    Indonesia. Bagoes obtained his Bachelor’s degree in architecture from Bandung
    Institute of Technology, Indonesia, and earned his doctorate from Aachen University
    of Technology in 1990 in Germany. He was a postdoctoral fellow for architecture
    at the East–West Center in Honolulu, Hawaii, and a Fulbright scholar at the Smithsonian
    Institution in Washington, DC. The area of specialization of his teaching and
    research experience is focused on the history, theory, and design of urbanism
    of various cultures and traditions in Southeast Asia and North America. He was
    a senior lecturer at the Bandung Institute of Technology (1981–1983, 1993–2002)
    and a visiting research associate at the Asian Institute, University of Toronto
    Canada (2003–2005). He was an associate professor at the Department of Architecture,
    Faculty of Built Environment of Universiti Teknologi Malaysia (2010–2013).

