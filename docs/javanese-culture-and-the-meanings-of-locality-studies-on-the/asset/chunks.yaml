    the Javanese agriculture to reach a surplus of economic production. Meanwhile,
    exchange (`nyaga`) of commodities in the permanent market (`peken`) could have
    developed in the ancient Javanese society with various specialized skills that
    enriched their life with arts, leisure, entertainment, and social life. Then the
    period of the first to the seventh centuries could have been considered the formative
    time for the Javanese people in developing their agricultural society. Besides,
    it must have been the era when the surplus of domestic productions was challenged
    by the necessity of efficient management of land and water.


