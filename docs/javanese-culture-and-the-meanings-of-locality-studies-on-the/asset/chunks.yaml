    # Government Reformation and Sovereignty in Indonesia


    Even though his agenda of reformation for clean government and sovereignty of
    law remains less improved than Habibi’s, Wahid’s, and Megawati’s terms of presidency,
    Susilo Bambang Yudhoyono has been trying his best in those aspects. The real pressure
    of the improvement is actually the free press and the open public opinions since
    the fall of New Order. Nevertheless, on human rights and justice, from the administration
    of Habibie to Yudhoyono and Joko Widodo there is no sign of action and commitment
    toward justice based on universal human rights. Violence against human rights—from
    the 1965 massacres, East Timor, Papua, Aceh, the Trisakti killings, to Munir’s
    murder—remains in darkness and far from the light of justice. The question concerning
    justice and human rights will be handled by whoever is in power within the framework
    of family principle that upholds and keeps the unity and integrity of the Indonesian
    nation-state and society out of crisis and disarray.


    ## Unity and Integrity Challenges


    In dealing with the unity and integrity of the Indonesian nation and state, the
    reformasi movement is likely not to change the fundamental principle of traditional
    concept of Indonesian political community; this option is considered a risky choice
    because it puts the sense of unity and integrity of the Indonesian nation-state
    and society in jeopardy. There is less room for a process of redefining its nation
    and state based on universal human rights. Reformation does not intend to transform
    the patrimonial society of Indonesia as a whole. It is not only risky, but also
    culturally unnecessary. As long as people—as represented by parliament members—are
    already seated comfortably on their seat, the politics of unitary state and nation
    goes on as usual.


    ## The Transition to Democracy


    Indeed, for human rights and social justice, the transitory process from an authoritarian
    to a democratic system is needed in which new institutions, regulations, and laws
    are not merely established and enacted, but are also tested and validated. So
    far, such a transformation is actually not able to radically change the minds
    of people from a unitary concept of state and nation to a federalist model. Despite
    the decentralization of governance, the post-Suharto national leaders still hold
    the concept of a strong nation-state based on the patrimonial system of central
    government that bureaucratically controls and supervises political and economic
    policies of development in the provinces, regencies, districts, and villages.
    The military and judicial structure is still implemented as a reliable organization.
    The sense of unity and integrity has been and still is the most important thing
    of nation-state as a big and harmonious family. Deep inside his heart is the Javanese
    perception of the world `buana` or `bhawana` as a well-ordered system of beings,
    which is only sustainable because it is conformist, clean, and free from any kind
    of opposition and resistance.


    ## The Javanese Ruler Concept


    Traditionally, the Javanese ruler is the caretaker of `buana` as a unitarily harmonious
    realm; the head of the nation-state is not only a secular leader, but also the
    spiritual conductor of state ceremonies and rituals. Taking care is keeping it
    in a manageable control for his pride, prestige, and legacy. His first priority
    is to ensure that the state and nation are in a good unitary shape. In order to
    achieve this consolidation of power, he will do everything in his power to gain
    broad political support from his former rivals. The move toward a unitary system
    of state and nation is subtly enforced by a spiritual credo of `semangat` in various
    forms such as political consensus or state ideology of `pancasila`.


    ## Development and Modernity


    On development and modernity, the post-Suharto Javanese leaders hold the notion
    of progress, which is focused on economic growth and prosperity based on national
    integrity and harmony. The subtext of his cabinet composition shows the concept
    of unitary state and nation with a centralized power at his hand. Accordingly,
    power is the light of development that elucidates and illuminates its realm with
    a radiant intensity from center to periphery. Papua and other Eastern Indonesian
    provinces have been mentioned by post-Suharto leaders as regions with special
    needs for development acceleration. The regions, which fall into category of the
    left-behind provinces that are actually not just because of their less environmentally
    developed condition, but also due to being less culturally connected with the
    Javanese values system and tradition concerning the family state in the context
    of statecraft style and political manners.


    ## Political Parties and Ideology


    Although there were formally more than thirty-four political parties participating
    in the 2009 public election, only nine parties were qualified to have their seats
    in the House of Representatives. What is missing here from the current president’s
    agenda is a unitary ideology. In the traditional sense, Javanese national leaders
    like Sukarno, Suharto, Wahid, Megawati, Yudhoyono, and Joko Widodo share something
    in common on the necessity for a strong ideological leadership in unifying all
    political streams and groups under a solid creed such as `Pancasila` for Sukarno
    and Suharto. `Pancasila` is not only an ideological platform that unifies people
    in the Indonesian archipelago, but also the transcendental structure of conformity
    for the family state concept of Indonesia.


    Based on their ideology, the nine prominent parties of post-Suharto Indonesia
    can be grouped into two main streams: the nationalist groups (`Demokrat`, `PDIP`,
    `Golkar`, `Gerindra` and `Hanura`, the Nationalist-Islamist, and `PAN`), and the
    Islamist parties (`PKB`, `PPP`, and `PKS`). As in the Suharto New Order era, the
    political streams in Indonesian politics remain the same with its core in secular
    nationalist streams. Of course, `Demokrat`, `PAN`, and `PKB` play their roles
    at the centrist faction of the mainstream. They stand in the middle between the
    `Gerindra-PDIP` with nationalist supporters and `PKS-PPP` with the moderate Islamist
    devotees.


    ## Sub-political Cultures and the Media


    Besides the mainstream of political culture, there are, indeed, sub-political
    cultures that are advocated by various groups such as intellectual, military,
    news and media, and non-government organizations. Each of these is able to express
    and articulate their concern and thought freely. However, in order to make ideas
    work in the system, they need to work together with the representatives of parties
    in the House of Representatives and the government. As a matter of fact, the most
    effective agent of reformation is the print and electronic media from which the
    freedom of speech and expression finds its way to watch over the business of politics.
    The biggest threats for journalists in the era of `reformasi` are no more laws
    and regulations, which are intentionally designed by the executive and parliament
    (Romano 2003, p. 169).


    ## Threats of Liberalism and Communism


    Hitherto, the notion of liberalism and communism in Indonesia is conceived like
    a disease that might lead the unitary system of state and nation to danger. Open
    criticisms and free opinions on politics are based on liberal ideology, which
    is unfit with the hierarchical custom and principle of family values (`azas kekeluargaan`).
    Such critical attacks will be perceived as disrespect and disloyalty to the father
    of the state and nation. On the other hand, communism is associated with atheism
    and classless society, which are not in the favor of the mainstream of political
    culture. With liberalism and communism, the mainstream of political culture is
    in danger because both are ideologically destructive for paternalistic and despistic
    hegemony.

