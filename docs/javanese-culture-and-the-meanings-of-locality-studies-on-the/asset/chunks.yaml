  raw: 'Silence (sepi) for the Javanese tradition is not forthrightly the empty realm.
    Rather, silence is the realm in which abundant creative power is. Oneness for
    Javanese culture must have been understood as the reality of their world. For
    this reason, the purpose of living is not to find the right or wrong path toward
    happiness. Rather, the purpose of living is sa’derma nglakoni, walking along the
    course of being on earth for growing with their understanding of wholeness. Hence,
    home for Javanese tradition is never a physically attached realm, but it is a
    harmonious extension of holistically embracing inner self (batin).


    The very idea of home in the Javanese tradition is constituted by the sense of
    being able to listen to the voice of silence (swara ing sepi). Of course this
    is not a cliché credo for the sake of mysticism, as is often accused of Javanese
    thought. For the Javanese, silence is pre-conditional to come into the ability
    for absorbing and witnessing the phenomena of beings in wholeness, in which every
    being reveals in its own property and capacity ready to come into play in the
    worldly existing system. In incorporating silence, the Javanese house is characterized
    by tranquility of interior sphere with ambient light and earthy color of wood.
    Most materials used in the house are absorbent for color and light. The daily
    Javanese sphere of home is likely dim, gloomy, mysterious, and portentous, instead
    of vibrant, tumultuous, and cheerful.


    How can home in Javanese culture come to terms with silence? Of course, the way
    to understand the state of being home as well as silence is never mundane. Instead,
    it is somewhat insightful and intuitive in the context of rasa. Accordingly, the
    idea of home is constituted by rasa that leads us into the state of being kerasan,
    meaning being intact with harmony. All this is believed to be attained with identifying
    one’s inner and outer self, then liberating oneself from any mundane attachment,
    including one’s self-consciousness: who and what am I. Being intact with harmony
    is not simply coming into agreement with others, but it is necessarily carried
    out for the purpose of living that grows beautifully.


    According to Javanese belief, the silence would never have been experienced without
    being able to liberate ourselves from pamrih (interest and desire). In other words,
    detachment of mundane and bodily yearnings leads us to the open being without
    self-consciousness (rumangsa). Nonetheless, it is not to say that sepi ing pamrih
    means being without awareness (eling). This state of being open is known by the
    Javanese people as eling that might be properly understood as being free from
    any preconception and prejudgment. Only in association with eling, the Javanese
    home becomes be accessible, meaning being able to submit the self-consciousness
    to the awareness of wholeness of beings. In a practical way, the holistic awareness
    never comes into being without being able to see others within us. It is the reason
    why the Javanese physical home is called dalem (inner container).


    The innermost of human being is batin (inner self), from which the phenomena of
    the world are projected in various forms, scales, and dimensions. Dalem is actually
    the projection of batin in its intimate realm of wholeness in which a family lives
    and grows. Architecturally, dalem is a conceptually generating system of home
    from which the institutions of Javanese settlement is physically developed. The
    construction of dalem itself is to put everything into wholeness within a spatial
    boundary. Architecturally, the sense of dalem is constituted by a visually established
    domain within a surrounding wall. The sense of being at home for the Javanese
    tradition is arrival inside the enclosure of dalem, which is actually the house
    yard.


    The construction of the wall surrounding the house yard has been conveyed by Javanese
    tradition to articulate dalem in its urban context. The reason to establish the
    surrounding wall is not simply for the reason of security and safety. Far from
    its practical purpose is its symbolic form of town, khita or kuta meaning literally
    fortified domain, since house stands in harmony with its compound, and its town.
    Nonetheless, the idea of dalem with its surrounding wall (pager) is mostly to
    be built in an urban context. In rural areas, dalem is represented by the main
    domain of the house, which is constructed under the roof. Generally, the idea
    of dalem is the place where people find their respective seat in society. The
    importance of dalem lies in its capacity to establish people’s identity with their
    seat in the society.


    Architecturally, building form and its construction seems to have set the stage
    of the rebirth of the world with its multiplying message of the necessary oneness.
    Then dalem, house, or palace seems to have not established the daily activity,
    but that the theater of oneness instead. It is possibly the reason why the Javanese
    buildings and towns do not show an excessive effort to represent the built environment
    in the sense of object in the space. Instead, the built environment stands at
    the service of events of gathering.


    ![](Images/Figure_4.1.jpg)


    Figure 4.1\. A Javanese rural house, omah or dalem, Gunung Kidul region, Yogyakarta.
    Photo by Bagoes Wiryomartono.


    The house as dalem is actually a symbolic form of the seat in society. Then its
    design and layout of domains are directed to perform the Javanese world coming
    into being within its territory. The events in the house as a socially growing
    institution of dalem are mostly related to the rituals of lifecycle from birth,
    initiation, marriage, and death. Dalem becomes the altar of house rituals. The
    mound of decorated rice called tumpeng or gunungan is usually put in the main
    area of dalem. The stage itself takes place at the front part of dalem, which
    is for the most powerful house owners built separately and known as pringitan.
    This hall is actually the stage for shadow puppet plays (wayang) with their audience
    sitting in the reception hall called pendapa. Thus, dalem as a house system is
    perfectly devoted as a stage of house rituals and ceremonies by performing wayang
    as its primordial demonstration of the Javanese world. The perfect house in the
    Javanese tradition is its capacity to carry wayang performance for wedding ceremony.


    The performance of shadow puppet plays in a house is traditionally not only for
    leisure and amusement, but also for delivering traditional values and Javanese
    cultural identity. The event of wayang performance is considered the occasion
    for being in spiritual alignment with Javanese tradition. The house of occasion
    for wayang performance is the platform of social gathering and spiritual unity
    under the charm of dhalang (puppet narrator).


    The performance of wayang itself is a dramatic presentation of Javanese interpretation
    of Mahabharata epic. According to its tradition, the story will be divided into
    three acts: the world in crisis, rivalries and conflicts for restoring order,
    and the way to success and its resolution. The most interesting part of the performance
    lies in the second act when the punakawans (court servants) come into play with
    jokes and humor. Laughter and joy are shared among the audiences during gara-gara
    (the performance of punakawans).'
