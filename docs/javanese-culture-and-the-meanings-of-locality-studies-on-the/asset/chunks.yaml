- fmt: '

    Site clearing was made to determine the open area for three main domains: the
    mosque area (`masjid hageng`), the square (`alun-alun`), and the palace (`kedaton`).
    The three essential components must be well established with a definite boundary.
    The square was marked out with the row of banyan trees while the areas for the
    palace and the mosque were delineated with the foundation of the wall. Similar
    layers of domain are applied for the mosque and palace complex. They have principally
    three layers—`purwa` (elementary), `madya` (intermediate), and `hutama` (primary)—that
    correspond to the depth of realm. The innermost area is characterized with the
    most intense category of meeting and the destination or the place of stop. The
    elementary domain is actually the reception area of all visitors, whereas the
    second and the third domain are the refinement of procession toward the goal.
    The interface of the palace and the temple area is the square `alun-alun`.


    From the highest site, the axial line of development was drawn to the north and
    to the south. In doing so, the view to Mount Merapi is clear from the highest
    site at the north side. On the south, the highest land has a view to the southern
    mountainous lands. At the middle part of the north and the south highest site
    there is an imaginary axis denoting the east-west direction.


    The development was continued to establish the square (`alun-alun`) on the south
    and on the north. The twin banyan trees were planted at the center area of the
    north and south square. On the north, the intersection of the center line of the
    palace and the center line of the mosque is the area between the twin banyan trees.
    There is an open question whether the twin banyans are to replace the twin `dvarapala`.
    The installment of twin banyans is to guard the `kraton`. This case is commonly
    found in most Buddhist temples (Malalasekera 1990, p. 53). The twin guardian figures
    stand with fierce face protecting the inner space of the temple. `Kraton` or `dalem`
    in this case is conceived as temple complex. Twin banyan trees are not only installed
    on the south of the palace, but they are also to guard the `kraton` on the north.
    The banyan trees stand within the square at the north and south as spiritual guards
    of the innermost part of `kuta negara`.


    The innermost area is actually the zone where the king and his family reside.
    Inside the palace there are four zones or complexed: `siti hinggil` (elevated
    area), `kemandungan` (engendering area), `kemagangan` (candidature/apprentice
    area), and `jengkar dalem`. The four zones have their specific functions and symbolic
    meanings. Each zone is provided with halls (`bangsal`) and buildings (`gedong`)
    for their ceremonial and functional purposes. The connection between the zones
    is architecturally signified with a gate (`regol`). The king’s home is the `jengkar
    dalem`, literally meaning inner self. The whole zone of the `jengkar dalem` and
    its buildings is called `kedaton`.


    ## Landlord System and Taxation


    Economically, the Javanese kingdom depends on land cultivation and its tax. Land
    ownership status is given by the king to his families or noblemen (`praja/priyayi`)
    outside `kraton`; this tax on farming settlements is called `lungguh` (Onghokam
    2003, p. 172; Headley 2004, p. 164; Schriecke 1955). Inside the palace wall, the
    land is directly controlled by the king and is known as `siti daleman`. It is
    the land for the king’s residence and his ceremonial supporters, from musicians
    to soldiers. The land is well known as `bumi narawita`, literally meaning earth
    for the king’s existence. Units of land under management of noblemen are usually
    used for their seats. The land of `lungguh` is actually the king’s direct land
    territory (`negara agung`), which is represented by and lent to his men or relatives
    with status of `anggadah`, literally meaning pretending to be owned. In return,
    they are due to pay tax and tribute on a periodical basis. Paying tribute is traditionally
    made with visit of loyalty to the king for state rituals and ceremonies.


    Most lands of `lungguh` are subject to be taken back by the king in cases where
    the landlords are not on duty as state officers anymore. However, in many cases
    the lands are able to be borrowed for generations as long as the property taxes
    and tributes are paid to the king. The distance of their relation to the king
    determines the area of their land of `lungguh`. The prime minister (`patih`) gets
    the largest land of `lungguh`, followed by other ministers and regents. As mentioned
    earlier, the lands of `lungguh` are the seats of the landlord, but if it is not
    the case and located outside the capital town or in rural area, the land is entrusted
    to somebody called `bekel`. Under his management, the `bekel` cultivates the land
    for agriculture (`sawah`, `tegalan`) or rents the land for other purposes, such
    as for shops, houses, or other productive facilities. In order to cultivate the
    land, the `bekel` hires commoner/peasants as workers called `nara karya`, who
    are usually granted to live with their families in the land of `lungguh` on a
    rental basis. Then the land of `lungguh` is divided into several parts or units
    called `cacah`. Each `cacah` is cultivated by a group of peasants consisting of
    five to twenty-five households. The head of `cacah` reports to the `bekel` for
    the production and cultivation of the land.


    The function of the `bekel` is to utilize the land as productively as possible
    so that the `bekel` is able to pay property tax to his landlord. Depending on
    the area, which is measured in units of `jung` and `karya`—1.428 Ha—the land of
    `lunguh` is subject to taxation or tribute. The collector of the tax, called `patuh`,
    is actually a state officer (Miyazaki 1988, p. 30; Nakamura 2012, p. 21) who works
    for the king or noblemen. His job is to collect the tax for the king and for the
    landlords according to a certain proportion, which is determined by the state.
    Of course, at the bottom of the taxation are the peasants who do not have the
    right of land. They have to work for their `bekel` and pay cultivation tax for
    their `patuh`. Besides, they have to work voluntarily to maintain the roads (`marga
    desa`), dam and irrigation systems (`bendungan`), bridges (`kreteg`), act as community
    night guards (`ronda`), and in case of emergency (`gugur gunung`).


    In rural areas, the `bekel` is the extension of the king’s hand and head of community
    settlement called `desa lungguh`. As a socioeconomic and political institution,
    `desa lungguh` is a miniature state in a rural environment with the `bekel` as
    the top political position. He is assisted by persons in charge of specific duties.
    However, the political structure of `desa` is less hierarchical and more egalitarian
    than `kuta negara` or `kuta praja`. Economically, `desa lungguh` is an agricultural
    settlement based on `sawah` cultivation. Indeed, `desa lungguh` is not a traditional
    Javanese `wanua`, which is originally a village republic with a self-contained
    socioeconomic system. However, they share a similar function as an agricultural
    community settlement. Traditionally, as an agricultural community a Javanese `desa`
    is provided with persons in charge of public safety and order (`tuha wanua`),
    irrigation (`huluair`), season and weather (`wariga`), customs and traditions
    (`pinuntun`), barn and granary (`makalangkang`), forest (`tuhalas`), and public
    health (`hulu wras`).

