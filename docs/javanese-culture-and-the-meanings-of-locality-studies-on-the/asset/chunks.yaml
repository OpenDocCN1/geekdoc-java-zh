- fmt: '

    Regarding life as walking, the Javanese-built environment could be seen as the
    stage of the performance of going together in various styles, manners, scales,
    forms, and events. Since `lakon` also means character of the play, living as `nglakoni`
    is considered enacting to serve for collective oneness. Being is actually designed
    at the service of ritual events and ceremonies, home place in Javanese tradition
    would have been meaningless without its ritual feast (`slametan`). It is the reason
    why in daily life, the Javanese-built environment shows itself as an empty place.
    All domains pertain to the designated places during the performance of `slametan`.


    As mentioned earlier, Javanese are taught by their traditions from early childhood
    to be able to manage their emotions and feelings for `sabar` (patient) and `prihatin`
    (concern). All these are believed to prepare them for being able to survive in
    any bad time by meditation (`semedi`) and reflection (`tawekal`). Architecturally,
    `eling` and `prihatin` are incorporated in the building expression as modest appearance.


    At any level of expression, the Javanese way to use form and color are aptly with
    `mattw` and earthy. All this represents and reflects the Javanese preference of
    harmony with earth and nature accordingly. There is no need for being obvious
    and self-important. The Javanese culture is likely repressive for expression and
    profile on an individual basis. The change and destruction of the built environment
    will not be able to hurt the Javanese feeling because they do not identify their
    life and being in such artifacts. It does not mean that Javanese do not care for
    the collectively memorized experience with things.


    The Javanese people are traditionally trained to not be sentimental in the way
    of being able to self-control based on the belief that time will resolve their
    problems and that life must go on in the sense of `legawa` (generous and altruistic).
    Avoiding open conflicts and confrontations are the attitude of the Javanese in
    dealing with any problem and change. They believe in syncretism at any rate of
    cultural phenomena: from ideas to concrete things.


    The way of syncretism is facilitated by the mechanism of `nrima` in a positive
    way. It implies the readiness to accommodate all possibilities and to manage the
    problems without any prejudice but careful listening. As long as the change is
    introduced carefully and persuasively they will listen. All this is not by the
    grace and blessings of Javanese culture, but it lies in the nature of human existence
    that he/she is always able to live on the earth with the capacity of learning.


    The sense of home for Javanese is never out of learning to be fit (`cocok`) with
    their feelings and emotions. Clifford Geertz describes the concept of `cocok`
    comprehensively in terms of a somewhat harmoniously experienced (Geertz 1973,
    pp. 129–30). It is, however, an effortless process that one feels at ease with
    his/her environment. Learning in the search for the sense of home is perceived
    by the Javanese sense of `nglakoni`: the concept of the ability to live and to
    deal with any problem and challenge without fear and anxiety.


    `Nglakoni` is learning to be open-minded and is based on the belief that any case
    and circumstance has its own lesson, wisdom, and message. The Javanese are taught
    by their traditions to manage and control their behavior to be a `priyayi`: to
    be a civilized humankind with full respect to others and able to control their
    instinct and desire. It is the reason why the change of their environment at any
    rate does not create panics and restlessness, because they believe in the nature
    of the things that there are no permanent circumstances but the change itself.
    All this is conceived by the Javanese in the idea of `sumeleh`.


    The integration of the built environment in its context and setting is conceived
    in the idea of `nglaras`: to find the way of harmonious togetherness or uniting
    behind. The presence of building work in this sense is not to make any high-profile
    expression. The Javanese tradition rejects with its classical credo, `ojo dumeh`,
    any attempt or way of expression that is apt to show personal opulence and less
    concern about harmony. Apparently disregarding its relation to others is considered
    not a Javanese way of expression.


    Establishing place of dwelling, therefore, is not merely to disclose the location
    with its surrounding and society, but also to contribute to the presence of `rahayu`,
    meaning well-being, beauty, healthy, and cultivation. In this context, the place
    of dwelling must have been developed within the ecosystemic totality in which
    every element or being has its own respective and genuine contribution to the
    `hurip` (dynamic living system) for cultural refinement (`alus`). Being cultivated,
    `alus` is conceived as the cultural process to put all potential sources and materials
    together into a harmonious composition. This is what in the Javanese tradition
    is called `nglaras`. The outcome of the belief that everything is principally
    able to find its way and contribute to being in wholeness might have led the Javanese
    culture toward its cultural imperialism.


    ## Moment and Home


    The Javanese culture avoids going into a self-grandeur expression for the place
    of dwelling except for state-related events and ceremonies. The Javanese people
    believe that every event has its `wanci`, its own moment, for demonstrating the
    idea of oneness. In its revelation, `wanci` is non-linear temporality, but cyclically
    repetitive. `wanci` is not a temporal scheme based on mathematical measurement
    in which a convention of actions in space is plotted in a measurable system. `wanci`
    is only an entry point of events and happenings in a cyclic repetition that is
    to reinstate the oneness of the world and its orderly system.


    The ritual events and happenings, `slametan` and `ruwatan`, reinstatement, and
    other religious celebrations, are the occasions when cosmic powers show themselves
    to recover the crises in the world. It is the way the Javanese preserve and conserve
    the oneness of their world. The call for restoring and recovering the oneness
    is given with crises in which crises come into being. The crises not only pertain
    to transition and change, but also to articulating the common care in the sense
    of the poetical mission of humankind: `memayu ayuning bawana` (care for beautifying
    the world).


    The call for saving the world is the time when the necessity for the center is
    demonstrated. Family lifecycle rituals are the time to establish center at the
    house. Traditionally, a Javanese family has to set up their own center that is
    made possible with `kaprajan` (a respective state service or other public servant).
    Regardless of its ranking and position, state or public service in Javanese culture
    is highly regarded as holding a respective seat in the society. House type and
    roof style are traditionally determined by the owner’s seat in Javanese society.
    Although merchants and traders can build their houses, restricted form and type
    may be applied respectively.

