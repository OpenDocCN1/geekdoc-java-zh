- fmt: '

    Nevertheless, negara as a politically organized entity of dwelling had come into
    being in the form of feudal state or kingship. This implies that the value of
    land property for the cultivation of crops has been the subject of taxations and
    tributes. The increasing value of land by means of water management technique
    led people to develop more complex socially organized polity that enabled them
    to manage and control its crops and other resources for the development of cultural
    productions. All this was based on the patron-client relationship of landowners
    and workers.


    The change from shifting cultivation to farming was politically followed by the
    incorporation of villages into a single landlord’s sovereignty system. Was this
    a consequence of the Indic statecraft and polity tradition? The need for the expansion
    of power was always there. The problem was, indeed, not simply to dominate others
    with a military supremacy, but also to maintain the control over others efficiently,
    with discipline and strong leadership. The Indic civilization proffered local
    rulers with military knowledge and tactics that were depicted in the `Mahabharata`
    and `Ramayana`. Both great books had been adopted by the Javanese ruling class.
    However, the dissemination of the text from the court to the ordinary people had
    been widely performed by storytellers and performers (`dhalang`) with their puppet
    play performances (`wayang`). The ancient Javanese version of `Ramayana` was `kakawin
    Ramayana`; it was the same story of `Rama` and `Shinta` but it had been transformed
    from epic fiction to lyric poem. The writer of this was unknown but the work was
    presumably written during the reign of `Rakai Watukura Dyah Balitung` circa `856
    AD`.


    ## Society and Settlement


    The origin of the Javanese concept of village alliance called `mancapat` must
    presumably have been deployed from the Indic wheel turner (`mandala`). In some
    inscriptions from `Kedu` and `Temanggung` between the eighth and tenth centuries
    mentioned the confederation of five or ten villages for defense and economic cooperation
    in terms of `panaturdesa` and `pangasta desa`. Beyond its mysticism, `mandala`
    was possibly deployed to secure the agricultural production and water management
    in dealing with drought, famine, and the dry season (`paceklik`). Based on the
    `mandala` concept, villages—usually not more than five—were economically organized
    with a regularly rotating market. Each village got a turn to hold the weekly market
    day, once for each of the number of the participating villages. In terms of culture,
    such villages established a representative body for extradition of criminals (`maling`,
    `begal`, `rampok`) and synchronization of their customary laws.


    Despite numerous monumental `candi`, buildings and inscriptions are evidently
    standing and spreading out in Java and Sumatra. There are hardly any archaeological
    traces of physically urbanized settlement with strong streets and blocks structure
    plans to be found prior to the era of the `Majapahit` town of `Trowulan` (`1305–1527`)
    and `Kediri` (`1042–1222`). Even though the ancient sites of states had not been
    revealed with remnants of public infrastructure, their concepts appeared in many
    inscriptions such as retaining ponds (`segara`), drainages systems (`kalen`),
    ports (`bandar`), public cemeteries (`astana pralaya`), public baths (`patirtaan`,
    `pancuran`), and dams (`waduk/bendungan`) for agricultural irrigation.


    Unlike ancient village settlements, which were mostly stable, pre-Islamic towns
    as the centers of `negara` were relatively unstable because of territorial competitions
    among each other. Although the rises and falls of `negara` affected the existence
    of their states and capitals, their `desas` mostly survived and sustained their
    agricultural communities. Despite mostly urban structure plans that could have
    disappeared for centuries, generations of some ancient villages and states still
    could have kept some domain names as they were in the past. Indeed, contemporary
    uses of land could have been adjusted and changed with other activities, but the
    ancient names might remain the same, such as `alun-alun`, `peken/pekan`, `pendapa`,
    `keraton/kedhatuan`, and so forth. Besides natural disasters (`pralaya`), displacements
    of settlements were mostly the case for leaving out the ancient sites in negligence.
    Based on the locations of the inscriptions and their text, the ancient sites of
    the capital state could have been estimated, such as `Medang` at `Mamratipura`,
    `Matyasih`, `Kayumwungan`, `Talang Air`, and `Gondosuli` at `Parakan Temanggung`
    for the `Shailendra` dynasty from the middle of the eighth to the ninth century.
    However, from the fields, it is difficult to recognize and locate precisely the
    ancient sites from their physical and topographical traces, which mostly have
    been transformed into rice fields and wilderness.


    The area of `kuta negara` as the capital of state would have been divided into
    several domains (`kalungguhan`, `lungguh`), which were managed and controlled
    by high-rank state officers (`pamgat`, `adipati`, or `bupati`) as landlords. Far
    and away from the capital town and in rural areas, such domains and lands were
    entrusted by the `adipatis` or `bupatis` to their low-rank state officers, called
    `bekels`. However, in the capital town, the domains (`lungguhs`) of settlement
    created urban blocks, which were divided by the street (`marga`) for the movement
    of people in group on their horses or on their feet. Albeit several inscriptions
    did not mention the settlements in the ancient state capital, chronicles from
    China confirmed the importance of the seat of the ruler as symbolic center of
    the world. The core of the settlement called `dalem` or `jro` was actually buildings
    or pavilions within the rectangular plan wall system (`turus/penyengker`).


    As mentioned in several inscriptions of `Jurungan` of `876`, `Poh` of `905`, and
    `Pagumulan` of `902`, prior to the reign of `Sindok`, there were important institutions
    of urbanism in existence, such as for the chief of executive officer of noblemen
    (`patih`), state priest (`purahita`), territorial liaison (`desaadhyaksa`), attorney
    (`adhyaksa`), judge (`upapatti`), communicator (`pangujar`), archive/record (`citralekha`),
    finance (`kabandaryan`), and taxation (`pangurang`). Specialists in various occupations
    were also well known in ancient Javanese society, such as `undahi` for master
    builder, `hawang` for ship captain, `mapadahi` for drummer, `kicaka` for dancer,
    `awayang` for puppet plays, and `rawit` for musician. Their specific expertise
    is signified with the prefix `juru` or `tuha` before their given name. There were
    various state officers with special tasks as well as `wikekas` (messenger between
    villages), `hulu wras` (officer of rice), `tuha alas` (officer for forestry),
    `huluair` (officer for irrigation), `mapken` (officer for market), `mataman` (officer
    for park and garden), `tuha gusali` (officer for blacksmiths), `huluwuatan` (officer
    for bridge), and `mawatas` (officer for border and boundary).


    Indeed, one essential component of urbanism is the state record. Accordingly,
    the record system during the ancient `Mataram Kingdom` was written on various
    media such as `lontar` leaf (`ripta`), bronze plate (`tamra`), and stone (`prasasti`).
    In addition, the other sign of urbanism was the existence of an exchange unit
    for trade. In the ancient Javanese culture the currency was based on various commodities
    that included the gold unit (`kati`), water buffalo (`suwarna`), and rice bowl
    (`masuya`).


    Furthermore, urban society in ancient `Java` was organized within various associations
    with specific terms of membership, aim, and scope. Elders gather together within
    the `kamitua` group with special tasks for consultation of community affairs while
    housewives pulled themselves in their `rainata` group for community mutual help
    and family care. Children were looked after by the community in the `wadwa rarai`
    organization for their early training and play group, meanwhile teenagers have
    their own association as well as `rara` or `werewereh` for girls and `wadwan matuha
    manwam` for boys.

    '
