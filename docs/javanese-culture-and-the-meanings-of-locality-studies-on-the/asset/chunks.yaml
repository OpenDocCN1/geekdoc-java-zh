- fmt: "\nSecond, the intentionality of kuasa is the grandeur of prestige (pamor,\
    \ gengsi) and pride (wibawa, harga diri). All this has nothing to do with dedication\
    \ or devotion to public service. On the contrary, the idea of kuasa is more about\
    \ the privilege for mobilizing resources for the majesty of the ruler (raja) and\
    \ his/her state (negara) and nation (kerajaan). Even though today the title of\
    \ ruler has been changed from raja to presiden as well as from kerajaan to negara,\
    \ the meaning of their concepts remains mostly the same with only a few modifications\
    \ here and there. \n\nIn the Indonesian context, `kwasa` is similar to the Indonesian\
    \ word `kuasa`, literally meaning right, capacity, ability, authority, and prestige.\
    \ Accordingly, the notion of `kuasa` is neither power in terms of wealth nor that\
    \ of knowledge. Rather, the concept of `kuasa` emphasizes and underscores omnipotent\
    \ authority and the prerogative capacity to say right or wrong as well as proper\
    \ and improper.\n\n`Wasa` in ancient times or `kwasa` in modern Javanese language\
    \ is a concept of power for controlling, ruling, and dominating others. Its practice\
    \ highlights and emphasizes the notion of authority, which is absolute and non-negotiable\
    \ for their decisions and actions. As a concept, `kwasa` is concrete as the privilege\
    \ of who sits on the throne as ruler. Whoever is able to get that seat is the\
    \ person with the eligibility as the holder or keeper of `kwasa`. Traditionally,\
    \ to be a ruler with such predicate does not require legitimate process and procedure;\
    \ one just needs the courage and capability to get it from the status quo by coup\
    \ d’état or by smooth transition and succession. Even though in post-Suharto Indonesia\
    \ a democratic process has been taking place for the transition of power, it does\
    \ not mean that illegitimate transition of power could not happen.\n\nThird, as\
    \ person in power, he/she is the `atasan`, superior authority or trustee, that\
    \ has the right to exercise the language of prophecy (turur, pinutur). `Atasan`\
    \ is not only superior for giving instructions or directions, but also traditionally\
    \ supposed to be the fatherly figure that is trustworthy for any issue and matter,\
    \ from personal to official matters. Loyalty and devotion to the `atasan` or `penguasa`\
    \ are mandatory, that is, not about morality, but humiliation, disrespect, and\
    \ disgrace of power. Under the notion of `kuasa` as well as `kekuasaaan`, the\
    \ authority is the divine master (gusti, tuan, datuk) and all people under his/her\
    \ supervisor are actually slaves (kawula, hamba, abdi). The person in power (`penguasa`),\
    \ either as a higher-rank state bureaucrat or as a police officer, has the capacity\
    \ to be a dominator. His/her main job is not to serve his/her constituents, but\
    \ to rule his/her supporters and followers.\n\nIn daily business of patrimonial\
    \ power, the prophetic language belongs to the opening speech of official occasions.\
    \ Any commencement of public initiative and action is due to get the `restu` (approval,\
    \ blessing) as well as the `petunjuk` (advice, direction) and `pengarahan` (direction)\
    \ from the local ruler (`penguasa local`). All this reflects and represents the\
    \ practice of political culture of theatrical stage based on pride, patronage,\
    \ and prophecy that `penguasa`, the person in power, is the pompous director of\
    \ such public occasions and events, while others are his/her humble audiences.\
    \ He/she is also the one who has the privilege to open the events with a ritual\
    \ ceremony by hitting the gong or by giving an opening speech with prophetic messages.\
    \ In many cases, the rulers play as a social therapist on sociocultural issues;\
    \ in some cases, he/she is also the priest for the judgments of moral issues.\n\
    \nMaking public events or occasions is not simply a social gathering. In Indonesian\
    \ political culture, such an occurrence is perceived as the birth of the cosmic\
    \ realm that needs a ritual blessing, permission, and acknowledgment from local\
    \ authority (`penguasa setempat`). Such a customary request and recognition is\
    \ not merely for politeness and courtesy. Rather, it is a necessity for being\
    \ in alignment with the local world; the local authority is conceived as the one\
    \ who holds and controls the order and harmony in his/her territory. In terms\
    \ of `kuasa` and its realm (`kekuasaan`), all public happenings and events—from\
    \ social gatherings and fundraisers to academic conferences—must be under his/her\
    \ `restu`, meaning blessing, control, mercy, knowledge, and approval.\n\nIn terms\
    \ of `kwasa` or `kuasa`, to stay in power means to be able to mobilize people\
    \ for grandeur self-cult (praja binatara). Performing state rituals and spectacles\
    \ is one of the most important displays of power or might as `kwasa`. This includes\
    \ mass mobilization and crowd control. The expansionist consequence of the concept\
    \ of power as `kwasa` is not simply for political influence and economic benefit.\
    \ Rather, this need is deeply rooted in the ruler’s desire for grandeur spectacle\
    \ (grebeg) of their power. This includes mobilizing people for doing something\
    \ collectively for the interest of state and nation. Recently, some political\
    \ leaders and CEOs have appealed to their followers and subordinates to wear batik\
    \ clothes on certain days in during the week. As president, Yudhoyono (2004–2014)\
    \ mobilized Indonesian citizens everywhere to wear batik clothes every Friday\
    \ starting on October 2, 2009 (`[Detik.com](http://Detik.com)` 2009)). The master\
    \ of mass mobilization in Indonesian history was charismatic Sukarno; he used\
    \ to mobilize people at every national event and official occasion with his rhetorical\
    \ oration. Being a great orator, Sukarno could spellbind his audience and possess\
    \ them by his immense charismatic personality (Cederroth 2004, p. 82).\n\nIn order\
    \ to imbue their power for mass mobilization, a spiritually unified credo (semangat)\
    \ is created and publicly announced as the spirit of movement. The origin of `semangat`\
    \ is actually a personal power (prabhawa), which is inherent as inner strength,\
    \ strong character, and courage. `Prabhawa` manifests in charismatic personality\
    \ and charm that enable him/her to attain `kwasa`. Even though `prabhawa` is often\
    \ associated with individual talent and personal gift, the Javanese tradition\
    \ teaches the elites to attain such power by various methods and trainings such\
    \ as celibacy, meditation, and fasting. All this is done to mystify his personality\
    \ and keeps him/hers away from the real world, with less talk and highly developed\
    \ self-control. In order to keep his/her pride (wibawa) and image (prabhawa),\
    \ a raja or ratu as ruler is in the role of pamong praja, that is, able to be\
    \ an integrator, protector, and savior of state and nation as a unitarily cosmological\
    \ system.\n"
  raw: 'Second, the intentionality of kuasa is the grandeur of prestige (pamor, gengsi)
    and pride (wibawa, harga diri). All this has nothing to do with dedication or
    devotion to public service. On the contrary, the idea of kuasa is more about the
    privilege for mobilizing resources for the majesty of the ruler (raja) and his/her
    state (negara) and nation (kerajaan). Even though today the title of ruler has
    been changed from raja to presiden as well as from kerajaan to negara, the meaning
    of their concepts remains mostly the same with only a few modifications here and
    there. In the Indonesian context, kwasa is similar to the Indonesian word kuasa,
    literally meaning right, capacity, ability, authority, and prestige. Accordingly,
    the notion of kuasa is neither power in terms of wealth nor that of knowledge.
    Rather, the concept of kuasa emphasizes and underscores omnipotent authority and
    the prerogative capacity to say right or wrong as well as proper and improper.


    Wasa in ancient times or kwasa in modern Javanese language is a concept of power
    for controlling, ruling, and dominating others. Its practice highlights and emphasizes
    the notion of authority, which is absolute and non-negotiable for their decisions
    and actions. As a concept, kwasa is concrete as the privilege of who sits on the
    throne as ruler. Whoever is able to get that seat is the person with the eligibility
    as the holder or keeper of kwasa. Traditionally, to be a ruler with such predicate
    does not require legitimate process and procedure; one just needs the courage
    and capability to get it from the status quo by coup d’état or by smooth transition
    and succession. Even though in post-Suharto Indonesia a democratic process has
    been taking place for the transition of power, it does not mean that illegitimate
    transition of power could not happen.


    Third, as person in power, he/she is the atasan, superior authority or trustee,
    that has the right to exercise the language of prophecy (turur, pinutur). Atasan
    is not only superior for giving instructions or directions, but also traditionally
    supposed to be the fatherly figure that is trustworthy for any issue and matter,
    from personal to official matters. Loyalty and devotion to the atasan or penguasa
    are mandatory, that is, not about morality, but humiliation, disrespect, and disgrace
    of power. Under the notion of kuasa as well as kekuasaaan, the authority is the
    divine master (gusti, tuan, datuk) and all people under his/her supervisor are
    actually slaves (kawula, hamba, abdi). The person in power (penguasa), either
    as a higher-rank state bureaucrat or as a police officer, has the capacity to
    be a dominator. His/her main job is not to serve his/her constituents, but to
    rule his/her supporters and followers.


    In daily business of patrimonial power, the prophetic language belongs to the
    opening speech of official occasions. Any commencement of public initiative and
    action is due to get the restu (approval, blessing) as well as the petunjuk (advice,
    direction) and pengarahan (direction) from the local ruler (penguasa local). All
    this reflects and represents the practice of political culture of theatrical stage
    based on pride, patronage, and prophecy that penguasa, the person in power, is
    the pompous director of such public occasions and events, while others are his/her
    humble audiences. He/she is also the one who has the privilege to open the events
    with a ritual ceremony by hitting the gong or by giving an opening speech with
    prophetic messages. In many cases, the rulers play as a social therapist on sociocultural
    issues; in some cases, he/she is also the priest for the judgments of moral issues.


    Making public events or occasions is not simply a social gathering. In Indonesian
    political culture, such an occurrence is perceived as the birth of the cosmic
    realm that needs a ritual blessing, permission, and acknowledgment from local
    authority (penguasa setempat). Such a customary request and recognition is not
    merely for politeness and courtesy. Rather, it is a necessity for being in alignment
    with the local world; the local authority is conceived as the one who holds and
    controls the order and harmony in his/her territory. In terms of kuasa and its
    realm (kekuasaan), all public happenings and events—from social gatherings and
    fundraisers to academic conferences—must be under his/her restu, meaning blessing,
    control, mercy, knowledge, and approval.


    In terms of kwasa or kuasa, to stay in power means to be able to mobilize people
    for grandeur self-cult (praja binatara). Performing state rituals and spectacles
    is one of the most important displays of power or might as kwasa. This includes
    mass mobilization and crowd control. The expansionist consequence of the concept
    of power as kwasa is not simply for political influence and economic benefit.
    Rather, this need is deeply rooted in the ruler’s desire for grandeur spectacle
    (grebeg) of their power. This includes mobilizing people for doing something collectively
    for the interest of state and nation. Recently, some political leaders and CEOs
    have appealed to their followers and subordinates to wear batik clothes on certain
    days in during the week. As president, Yudhoyono (2004–2014) mobilized Indonesian
    citizens everywhere to wear batik clothes every Friday starting on October 2,
    2009 ([Detik.com](http://Detik.com) 2009). The master of mass mobilization in
    Indonesian history was charismatic Sukarno; he used to mobilize people at every
    national event and official occasion with his rhetorical oration. Being a great
    orator, Sukarno could spellbind his audience and possess them by his immense charismatic
    personality (Cederroth 2004, p. 82).


    In order to imbue their power for mass mobilization, a spiritually unified credo
    (semangat) is created and publicly announced as the spirit of movement. The origin
    of semangat is actually a personal power (prabhawa), which is inherent as inner
    strength, strong character, and courage. Prabhawa manifests in charismatic personality
    and charm that enable him/her to attain kwasa. Even though prabhawa is often associated
    with individual talent and personal gift, the Javanese tradition teaches the elites
    to attain such power by various methods and trainings such as celibacy, meditation,
    and fasting. All this is done to mystify his personality and keeps him/hers away
    from the real world, with less talk and highly developed self-control. In order
    to keep his/her pride (wibawa) and image (prabhawa), a raja or ratu as ruler is
    in the role of pamong praja, that is, able to be an integrator, protector, and
    savior of state and nation as a unitarily cosmological system.'
