    In Javanese culture, building expression does not necessarily become pretty and
    fancy. Rather, beauty for Javanese is conceived as the sense of well-being that
    is articulated in the notions of `rahayu`, `apik`, and `laras`. Here, beauty is
    not simply appearance but reality that is constituted by a harmonious relationship
    between human beings and their environment. Therefore, the presence of beauty
    is not only to provide people with a cheerful environment, but also to be fit
    in socially established circumstances in the Javanese tradition. Fitting in socially
    established neighborhoods is articulated by the Javanese with the word `ngalaras`.
    The original meaning of this concept is the act of going here and there without
    any predetermined destination. `Nglaras` is a kind of roving in the sense of thinking
    and walking as well. The importance of `nglaras` lies in its identical relationship
    with the Javanese concept of dwelling as walking through the time (`nglakoni`).
    Similarly, both concepts do not have any pre-set destination.


    To integrate the building in its social context is considered by the Javanese
    with `nglaras` that is more significant than to set individually profile. In this
    respect, the significance of the built environment lies in its commitment for
    oneness socially. Since place is the address for proper being, its significance
    is not simply a location, but a domain where phenomena of gathering take place.
    Place in Javanese daily life is understood as `panggonan`, meaning proper site
    for proper things in relation to the others (people, time, and character). `Panggonan`
    is derived from the verb `manggon`, meaning to settle down or to put something
    appropriately in a location. As most of the prefix `pa` give us the indication
    of being part of place, for example, `pawisman` (dwelling house), `padunungan`
    (settlement), `padusan` (public bath), `paninisan` (place for having breeze),
    `pangomben` (place for taking drink), etc., `panggonan` is to address everything
    that has already found its proper seat.


    Living with a socially established seat in the Javanese tradition (`mapan`) is
    distinguished from having a place to live (`manggon`) because of its very idea
    of respectful standing. `Mapan` is derived from the word `papan`, the place that
    is originally made of timber. The other meaning of `papan` is shield and shelter.
    Thus, `papan` in the Javanese idea of dwelling has a special contribution to provide
    people with a shelter that allows for taking action and position. The idea of
    `mapan` etymologically is to be ready for further actions. This is the sign that
    the dwelling is an attitude to be ready and never feel tired doing the same over
    and over again.


    As mentioned earlier, `mapan` stems from the word `papan`, that is, to articulate
    the place for proper living. In association with settlement, `mapan` is to describe
    the situation and condition of dwelling at peaceful, sustainable, and respectful
    form. `papan` and `panggonan` have a similar idea in their capacity to accommodate
    dwelling. As in its language, the Javanese category for a living place is not
    differentiated by its utilitarian purpose, but by social status and position.
    Nonetheless, all these denote the readiness to accommodate any possible change
    and adjustment for opening the place. The Javanese `priyayi` people deserve their
    `papan` in urban core, whereas the commoners (`kawula`) are supposed to have their
    `panggonan` in rural area. In daily talk, `panggonan` is also to address any place
    to store something appropriately. Owning a home for Javanese is not associated
    with `manggon` but `mapan` instead.


    ## House, Familiarity, Hospitality, and Habitation


    One important question concerning the necessity for building and dwelling is to
    deal with the sense of home. What we would build and dwell in is nothing but the
    cultural things that enable us to constitute and recollect our sense of home.
    The Javanese sense of home is composted of the concepts `kerasan` and `pomah`.
    The idea of `kerasan` is derived from `rasa`, meaning feeling, mood, and sensibility,
    whereas `pomah` stems from `omah` (house), meaning being settled and having a
    seat.


    Since `kerasan` is an impression of being able to deal with the environment, its
    experience is stipulated by the mood and feeling of being intact with the wholeness.
    The sense of `kerasan` lies in the fact that everything is environmentally close
    at hand and friendly associated with. On the other hand, `pomah` is the state
    of having seat in society. The very idea of `pomah` is not only having already
    settled in the environment, but also describing the state of being familiar with
    and fitting in the culture. Moreover, `pomah` is also to mention the state of
    being in a secure relationship with housemates and neighbors.


    As mentioned earlier, the `rasa` in Javanese culture plays a very important role
    in the aspect of culture and daily life. `Rasa` is associated with the appreciation
    of aesthetic experience and social life. Since `kerasan` means being familiar
    and convenience with environment, which is experienced with emotive and intelligible
    intact with place, its very idea lies in owning the precious moment without rush
    and recklessness. On the other hand, `pomah` is the sense of being at home that
    is constituted by the identity of men and their place. The identity speaks of
    correlation of characteristics of place that fit with one’s environment. It is
    necessarily stipulated by the sphere of `ayem` (at calmness) and `tentrem` (peaceful
    and complacent). The sphere of cozy ambience is characterized by indirect day
    lighting, shadowy nuance, earthy colors, and warmth, which are typical and characteristic
    of the Javanese feeling at home. All this brings about the built environment in
    the background for possible events and happenings.


    Although `omah` implies at the very least a roof over the head, its role in Javanese
    lives is far more profound than that. `Omah-omah` is to establish a family, whereas
    `pomah` is to articulate the feeling at home. Furthermore, the notion of `wis-omah`
    is to express the state of being familiar with something. The application of the
    concept of `omah` can be found in the following: `bale omah` for household, `omahan`
    for being like house, `diomahke` for being domesticated, tamed, and civilized,
    and `somah` for spouse or married partner. The Javanese language is replete with
    allusions to `omah`, which means a nurturing and secure place where the Javanese
    social life began.


    `Pomah` is derived from the ancient Austronesian word `Uma`, `Umah`, `Omah`, `Humah`,
    `Rumah`, meaning the world. The world in this sense is not understood as a globe
    or the whole earth. The world in Javanese `Omah` is the household with their land
    and people/neighbors. `Pomah` is the state of already involved with the world
    on a certain site based on the learning process. The relationship of the Javanese
    people with their homeland as a physical environment is not a sentimental matter.
    The Javanese are taught by their tradition to always be ready for any possibility
    of living in the spirit of thankfulness. This is probably an acceptance with inner
    strength and faith in open-endedness `nrima`, the notion is sometimes misread
    and misunderstood as the ability to accept bad luck in terms of surrender or giving
    up without fight.


    `Omah` in a Javanese town is territorially defined by the `penyengker` (rectangular
    wall surrounding the house). The definition of the house itself is not that explicit
    utterance because its essence lies in the idea of `Jero` or the inside or the
    inner part. `Jero` is the word to articulate the state of being inside. The other
    word for house is `dalem`, which is usually to address the residence of people
    with higher social rank and status. `Dalem` is literally to articulate the self,
    the inside, and first person as well. What is interesting to note is the idea
    of `dalem` in its spatial quality that embodies the center of a smaller system.

