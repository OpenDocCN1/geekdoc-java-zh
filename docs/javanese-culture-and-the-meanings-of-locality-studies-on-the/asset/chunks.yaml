    After all this, the Javanese people call such an achievement kelakon, meaning
    having been experienced and gone through. What lies behind the concept of kelakon?
    Regarding dwelling is a walking through. Kelakon is the light at the end of the
    tunnel of living that is actually being on the safe track. The destination itself
    is oneness, not to speak of individual profile and achievement. In other words,
    there is no place for an egoistically established cult in Javanese tradition but
    the ruler. The concept of ruler itself is fundamentally established as the center
    of dwelling that brings about the existing oneness to grow. Needless to say the
    impact of the cult of center has led the Javanese people to immortalize their
    rulers, instead of commemorating their being as well as walking on the safe track.


    Given that, the Javanese people perceive building and dwelling in the sense of
    means for being on the move in terms of walking, is the meaning of the built environment
    they build simply a vehicle of moving forward? Walking as a matter of fact is
    the act of moving on rhythmic stride. The sense of Javanese walking (mlaku) lies
    in the steady and consistent pace; it is a movement without hesitation and hurry,
    but simply doing the move joyfully and constantly. In its essence, mlaku is experiencing
    the moments with continuous acceptance of the circumstances (sumarah) without
    worry and ready to deal with any situation with patience (sabra) and perseverance
    (tawakal). All these concepts are derived from Arabic words, but the content is
    a philosophically Javanese Hindu-Buddhist way of transcending ego into emptiness
    in terms of anatman.'
