    system came to happen simultaneously and reciprocally. The shift concept of settlement
    from `wanua` to `thani` was gradually made through the production of `thani`,
    literally meaning farming based on an irrigation system (`sawah`). The intensification
    of land and the highly sophisticated management of water were developed. Unlike
    the Balinese irrigation association (`subak`), Javanese peasants (`thani`) integrated
    their water management within the village assembly (`karaman`). Despite the fact
    that its names may vary across Javanese villages, its sociopolitical function
    as a community council is still in existence today. Coordinating and distributing
    water supply and mutual help for rice cultivation became an important part of
    the assembly’s gathering.


    Of course, rituals and ceremonies related to rice cultivation were also the part
    of the assembly’s job. This includes consultations and assistance. The composition
    of ancient village council members was not only politicians and community leaders,
    but also experts and trade peoples. Spiritual experts (`mpu` or `dukun`) gave
    their advice and directions through the assembly for the best time for rituals
    and ceremonies of planting, maintaining, and harvesting rice based on the Javanese
    almanac (`pewukon`). The expert on the weather and calendar system was known as
    `wariga`. He was also an elder and member of village council.

