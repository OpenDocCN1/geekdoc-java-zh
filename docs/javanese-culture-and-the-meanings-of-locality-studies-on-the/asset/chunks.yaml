  trans: '

    尽管印度教佛教爪爪哇传统中与 `alun-alun`（广场）相关的活动尚未被详细描述，但从宫廷仪式和表演中可以看出其与 `kedaton/prabayeksa`（皇宫）和
    `candi`（寺庙）之间关系的传说和痕迹。在生活中，`alun-alun` 一定是空旷，因为其空间性和结构并没有显示出任何公共娱乐或贸易的迹象。城市的中心并非位于城镇广场，而是在市场（`peken`）。根据其目前的设计、位置和方位，`alun-alun`
    是一个神圣的广场，中心有两棵大榕树，对称地划分了 `kedaton` 的轴线。`alun-alun` 的神圣性在于其用途受限，仅用于仪式目的，而不是作为公园或娱乐场所供公众使用。城市起源的另一个古代痕迹是宗教崇拜和仪式，它们展示了国家与其公民之间的所属关系。作为一个政治组织实体，`negara`（国家）是公民的伞盖。从象征意义上说，广场中心具有稳固庇护结构的大榕树代表了人们的庇护（`pengayom`）。`Alun-alun`
    一直一直是统治者展示其天界表演以及与神职人员联系的舞台。捐献和崇拜一定是由统治者在 `alun-alun` 完成的。通过这种方式，统治者所代表的神的仁慈和荣耀可以被显性地展示出来。这一切都是通过国家仪式和活动实现的。


    尽管人口集中发生在 `Singasari` 和 `Majapahit` 统治时期，但它们那些已经城市化的定居点并没有给我们留下任何关于资源不足的迹象。`Singasari`
    和 `Trowulan` 位于一片肥沃的平原，拥有发达的水稻种植业。在爪哇传统中，政治的消失并不被简单地理解为光的熄灭，也被认为是权力光芒转移到了其他地方。曾经的
    `Singasari` 和 `Majapahit` 首都仍然为空，并随着时间的推移逐渐被拆除，因为那里不再有光。然而，对于伊斯兰爪爪哇国家的旧首都并非如此，例如
    `Kotagede`、`Plered`、`Kartasura`、`Demak`、`Jepara`、`Banten` 和 `Cirebon`。


    国王将自己等同于最高的超越者，他可能不断需要作为地上至高无者的代表，对其主主的旨愿进行认可。爪哇传统中的 `Airlangga` 被广认为是第一个成功履行
    `cakravartin`（转轮王）国王职责的爪哇统治者。对于大多数爪哇印度教国王来说，将自己等同于山之之主 `Shiva` 和 `Wisnu`，可以通过
    `Iswara`、`Narendra`、`Hyang`、`Wisnu` 等王衔来体现。


    在处理 `sawah`（稻田）的重要性与 `negara`（国家）维持之间的关系时，我们必须追溯其起源于供奉 `gunungan`（山）的宫廷仪式和活动（Daniels
    2009, p. 25）。爪哇关于大米仁慈、婚姻和多产的神话与印度教女神 `Dewi Sri`（`Wisnu` 神的妻子）有关。由大米制成并精美装饰肉类、蔬菜和水果的宇宙山模型
    `Mahameru` 被称为 `tumpeng` 或 `gunungan`，这对爪哇人来说不仅仅是为了表达对幸福生活的感激。相反，`tumpeng` 是开启世界的宇宙完满诞生的生动提醒。`gunungan`
    一词是为了表达宇宙诞生的序曲。传统上，`gunungan` 的形象被用于皮影戏（`wayang kulit`）的开场表演。在 `grebeg` 国家仪式中供奉一对
    `gunungan` 是否与爪哇世界的重生有关？事实上，重生是为了庆祝这样一个时刻：在这一时刻中，统治者与人民之间的关系被证明性地展示为施予者与接受者的关系。


    `gunungan` 的起源于 `Yogyakarta` 和 `Surakarta` 宫廷，可以追溯到印度教圣山 `Mahameru` 的传说，爪哇人仍然认为它是天界的形象。此外，`gunungan`
    提醒人们祖先在永生中停留的居所。除了节日庆外，供奉大型 `tumpeng` 或 `gunungan` 的国家仪式和活动可能是爪哇人意识到他们对国家以及世界景仰和忠诚的真实时刻。`grebeg`
    仪式发生在伊斯兰的每一个节日：`Ied Fitri` 和 `Haj` 或 `Ied Adha`。在仪式（`upacara grebeg`）期间，米山（`gunungan`）从宫廷穿过公共广场（`alun-alun`）进入清真寺，使得宗教中心、清真寺与社会政治中心（`kraton`）之间的宇宙关系为了统一与一体（`manunggal`）。


    水稻种植的重要性已纳入任何活动和场合的传统供文中，表达了家庭统一的起源、启动、开始和维持。无论是从印度教佛教到伊斯兰制度的转变——从 `pura` 到 `mosque`（清真寺），从
    `puri` 到 `kraton`——`grebeg` 的起源可能深深植根于古代爪哇传统，将大米的仁慈（多产、滋养和维持）与国家（`negara`）以及宇宙的重生联系在一起。


    `Sultan Agung Hanyokrokumo`（1613–1645）被广认为是爪哇 `Mataram` 王国 `grebeg` 仪式的发起者和组织者，他综合了古代的本土泛神论、印度教佛教和伊斯兰传统。然而，`Sultan
    Agung` 并非第一个履行国家武装力量最高司令（`senapati`）和最高宗教领袖兼首席学者（`panatagama`）双重角色的国王，他的祖父 `Panembahan
    Senapati` 在 1575 年于 `Kotagede` 创立了伊斯兰爪哇 `Mataram`。尽管伊斯兰禁止任何形而学的上的，但爪哇统治者仍然声称拥有形而学的特权。


    ### 伊斯兰影响下的国家


    意识形态上，伊斯兰并没有完全转变爪哇权力观念从国王崇拜到抽象至者的概念。然而，伊斯兰通过阿拉伯文字及其的人道主义教义逐渐削弱了国王形而学的统治。伊斯兰被沿海地区（`pasisir`）的人们广泛接受，因为他们的生活对于王权及其专制传统并不重要。如前所述，爪哇宫廷精英如
    `walisanga` 以及其他统治者——`Senapati` 和 `Agung`——通过他们说服力的媒介 `pewayangan`（皮影戏）将伊斯兰教义融入爪哇文化。通过这样做，现状在维护他们对统治者崇拜的利益方面保持良好。


    伊斯兰影响通过沿海商人向爪哇和苏门答腊内陆的和平传播带来了宗教机构的改变和转型。伊斯兰国家出现在大多数沿海港口城市，如 Pasai、`Demak`、`Kudus`、`Jepara`、`Bantam`、`Jayakarta`、`Cirebon`、`Surabaya`
    和 `Makassar`。在建筑上，伊斯兰首都与其印度教佛教的前身没有太大。区别仅在于用 `mosque` 替换了 `candi` 或 `pura`。其建筑中印度教佛教影响的痕迹仍然可见，如
    `Demak`、`Jepara` 和 `Kudus` 清真寺所示。尽管许多现代清真寺采用圆顶作为屋顶，但使用类似 `Meru` 山的形式作为屋顶仍然是几个城市清真寺的共同传统。屋顶层叠伞金字塔的形式反映了建筑中的融合主义实践。

