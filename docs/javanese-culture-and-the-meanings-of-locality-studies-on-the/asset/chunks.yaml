    # Javanese Philosophy of Creation and Being


    Making things is conceived to work together with others, including the invisible.
    Being able to create and compose something from the earth is not to see humans
    as the master of being. The Javanese people believe that manmade things are indispensable
    from the transfer of energy from cosmos to the form. Consequently, the transfer
    needs to be handled with care and respect. This is not because of moral consideration.
    Naturally, it is about the awareness of being and remembering called `eling`.
    The state of `eling` is considered as the mental state of being able to listen
    to and to act according to respect (`hormat`, `ngajeni`) and dignity (`praja`,
    `kaprajan`). The Javanese people were trained from their childhood to realize
    that the way to be safe and healthy is not only to be loyal (`mituhu`) and sincere
    (`jujur`), but also to develop the sense of inner strength (`mantep bathin`).
    The training is exercised with fasting (`pasa`) and modest living (`prihatin`).
    All this is to improve the capacity for self-control of nourishment and want.
    Being able to know the difference between need and want is central for Javanese
    cultural training. In many cases, the outcome of this training is to lead people
    to be less assertive and not spontaneous.


    ## Social Conduct and Cultural Identity


    Shying away from expressing their feelings and thoughts is a common phenomenon
    found among the Javanese people. Here, something good and beautiful in terms of
    human conduct is about subtlety. Foreigners get the impression that Javanese people
    are apathetic because they are too polite and sometimes misunderstand it. There
    is, of course, a way to invoke participation for Javanese people if they are asked
    personally.


    Culturally, Javanese tradition has been developed with the concept of what being
    Javanese is; that is, ethically humble (`andah asor`), respective of others (`ngajeni`),
    and culturally cultivated (`alus`) (Sutton 1991, p. 21; Hughes-Freeland 2008,
    p. 82). Succinctly, being Javanese is being human in respect to other beings,
    either tangible or intangible. Thus, any determination concerning being in time
    is conceived as the way toward being somewhat ethically civilized based on polite
    comportment and respectful language. It is concerned with making something raw,
    coarse, and natural to be fine, subtle, and cultural.


    ## Self-Control and Personality


    The intensive training for self-control shapes and builds Javanese personality,
    which is, in many ways, more comfortable as listener and reader instead of speaker.
    Traditionally, seniority and experience play very important roles in communication.
    Often, seniority hinders and blocks to reveal something good and beautiful too.
    However, the Javanese people believe the reveal of the beautiful is unavoidable.
    It is only a matter of time. Being patient to accept (`sabar nrima`) is part of
    an inner strength exercise in Javanese tradition. Everything good and beautiful
    will come up out of the necessity for the world and community that is in terms
    of `rahayuning jagad`.


    Making things within the system of the work of art is indispensable from the purpose
    of being Javanese. In other words, making things is to bring forth something from
    a naturally raw to a culturally cooked state of being. Conceptually, being Javanese
    is nothing but bringing forth resources from natural rawness to the world. Nature
    as the resource of the work of art is not subject to domination by human reason
    and action. The Javanese way of dealing with nature is to disclose its potency
    for being close to the hand of man based on sensibility (`rasa`).


    ## The Concept of Rasa


    Sensibility in the Javanese language is composed of the Sanskrit loan word `rasa`,
    literally meaning aesthetically sensitive and sensibly empathetic. `Rasa` in the
    Javanese sense is not simply the feeling of somewhat. Rather, it is about the
    mindfully aesthetic experience that is not only about sensibility but also about
    meaning (Geertz 1960, pp. 235–58; Benamou 1998). Under the notion of `rasa`, the
    act of carefully listening becomes the primordial stipulation for dealing with
    any phenomenon of being, whether insight of mind or in the actuality of the world.
    Being able to listen is somewhat decisive in the act of letting `rasa` be intact
    with what is coming to show itself. Under this notion, the relationship between
    people and the world is more to rely on intuition instead of reasonable doubt
    against otherness. In doing so, humankind and nature/resources are more within
    the immediate scenes of action, which are not associated within the stance of
    subject-object relationship. The relationship is, to a certain extent, based on
    interplay in the search for wholeness; it is through disclosure of each other
    by means of technique (`makarya`).


    ## Patronage and Professional Artists


    The artists in Javanese society live mostly from their relationship with their
    patron. Beyond the palace, the ruling class (`priyayi`) and merchants mostly dominate
    the traditional patronage of `wayang` performance. The patrons invite (`nanggap`)
    performance artists (`wayang`, `troupes`, `dancers`, `singers`, `musicians`, etc.)
    on a contractual basis. The rites of passage—such as circumcisions, weddings,
    and harvest thanksgivings—are the most common occasions for contract clientele.
    Inviting professional artists for family occasions and celebrations has been part
    of traditional clientele among the Javanese villagers until today. The classical
    description of the life and work of professional artists is probably to be found
    in `Serat Centhini` especially in describing the freelance artist `cebolang` (Anderson
    2006, pp. 171–289; Santoso et al., 2006). Even though the writers of `Serat Centhini`
    were under the order and direction of `Pakubuwana V` that began in 1814, the Javanese
    world in the story is far away from the palace. The story covers rural and ordinary
    people in various places of Java with the absence of the Dutch from the scenes
    though the colonial rule that was strongly present during the period of the story,
    circa the beginning of the seventeenth century.


    ## Historical Context of Court Artists


    Since ancient times court artists and writers in Java have been part of the state
    bureaucrats. Their respectful title is `mpu`, meaning learned and wise person
    with specific literary or artistic skills. In the context of state/palace, the
    relationship between the artists and their clients, especially the king, is indispensably
    about the patronage of power. All works are mostly part of the ruling reign’s
    interest and point of view. Prior to King Airlangga’s reign, there are barely
    any names of artists or writers who worked on the surviving architecture, murals,
    poetry (`kakawin`), gamelan compositions, dances, stories (`babad`), and literature
    (`susastera`) of the period between the eighth and the eleventh century. Airlangga
    became the first king of `Kahuripan` in 1019 and began to establish his power
    in East Java by making peace with `Sriwijaya`. Under his reign (1019 AD–1049 AD),
    Airlangga consolidated his power with strong leadership and religious tolerance.


    Physical and epigraphic evidence in the area around Kediri confirmed the literary
    activities during the Airlangga rein. Beside the Javanese versions of classical
    `Ramayana` and `Mahabharata`, Airlangga’s tenure might be that for the first time
    the original works of literature were written in the Old Javanese language by
    the Javanese writer `Mpu Kanwa`. `Kanwa` wrote `Arjuna Wiwaha` depicting the marriage
    of Arjuna who is to adore Airlangga as the avatar of `Wisnu` on earth. The relationship
    between artists/writers and the ruler under Airlangga’s kingship is clearly for
    the pride of power and its state ideology. The patronage continued in `Singasari`
    and `Majapahit`, especially during `Hayam Wuruk`’s reign (1350 AD–1389 AD).

