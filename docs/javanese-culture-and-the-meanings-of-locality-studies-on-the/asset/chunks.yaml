    爪哇文化发展曼陀罗（mandala）的方式与印度教起源相似，但根据爪哇的宇宙观进行了处处调整。这些圆环或层级区分了相对于权力源源的影响价值。在 `kuta
    negara` 方面，`mancapat` 的最内层是 `Kedaton` 或 `Dalem`。其核心是国王或苏丹的居住地。其独特的建筑形式和空间布局显然通过被称为
    `cepuri` 的宫殿内墙表现出来。此外，内墙内部的建筑在风格、尺寸和细节处理上都独一特色。然而，最重要的是，这是唯一一个从东方入口的主建筑。其主要入口的设计类似于印度神庙（`candi`）的入口设计。


    `mancapat` 的第二个边界是 `sentana dalem`，被理解为皇室成员、官员和仆人的宫廷区域。它是宇宙权力的领域，统治者（`gusti`）与被统治者（`kawula`）会合的地方。国王/皇后与其民众会面由
    `bangsal witana` 建筑标识。名为 `baluwerti` 的墙体系统立于此，以划定皇宫的第二个区域。


    `mancapat` 概念的第三边界被称为 `kuta negara`，被理解为向各个方向延伸中心。为了建立 `negara` 世界，统治者及其追随者必须开垦森林进行定居和农业活动，或者控制现有的村庄和小落，并将所有这些土地归自己所有。作为地主，统治者通过税收制度（`upeti/upetya`）和缴纳宗教贡（`sowan
    dalem kaprabon`）来保护和控制村庄和小落。


    第四个是统治者土地所有之外的影响区域，但在其保护体系之下。保护地区的领袖必须每年缴纳贡赋（`upeti`）并参加国家仪式（`upacara negara`）。保护地区是统治者在其本土或领地之外，在权力（`adidaya`）、魅力（`wibawa`）和崇畏（`wisesa`）方面的影响力延伸。这些地区通常属于其他地方统治者或其追随者。该区域被称为
    `negaragung`（大国），可以根据统治者的领导力和个人权力灵活地扩大或缩小。具有魅力且强大的领导力将增加精神影响范围。`negaragung` 的边界并不总是地理领土（Miyazaki
    1988, pp. 30, 164, 176; Laksono 1986, p. 64）。它实际上是由几位地主或地区统治者在精神和政治崇畏上承认统治者的领导而构成的。


    第五区域是 `mancegara`，意味着统治者影响之外或海外。`mancegara`区域的数量和位置是不设限的。然而，通过交换使节和贸易进行相互尊重是可能的。`mancegara`
    是阐述外部世界或 `negara` 统治和秩序之外的概念。`negara` 向 `mancegara` 领域的扩张主义运动在任何情况下都是可能的。这与单纯的政治影响无关，而是关乎爪哇文化宇宙学领域的延伸。从历史上看，大多数爪哇统治者具有扩张主义倾向，需要确认他们的宇宙宝座作为地球上至高神的代表。爪哇人思考并相信他们的弥世主使命，即他们的文化是使领地之外的人们“爪哇化”。爪哇化意味着根据爪哇价值观进行文明化。在他们的细腻之处，成为爪哇人意味着采纳并实践成熟、礼貌、微妙和精致的爪哇习俗与传统。


    然而，在 `negara` 的背景下，`mancapat` 的边界既不是通过物理标记划分的，也不是通过书面文件。边界是通过语言等级的使用和实践所标记的事件，这种语言在建立主/奴关系方面具有微妙的压迫性。爪哇人通过对谈话对象的称呼来认知边界。这是行使尊重和崇拜的时刻。


    ## 国家作为统治者崇拜的舞台


    除了易腐材料和自然灾害——洪水、地震和火山喷发——之外，爪哇岛缺乏密集的考古挖掘是难以确定古代爪哇定居点早期类城镇结构的原因之一。另一个原因在于其概念基础：定居遗迹尚未反映
    `negara` 作为政治实体的理念。在 `Kahuripan` 战国的 `Airlangga` 之前，古代国家可能处于为了建立完美 `negara` 的竞争之中。这可能是为什么直到
    `Medang` 王国的 `Mpu Sindok` 时期，古代统治者尚未成功执行他们的神王（`devaraja`）崇拜（Thakur 1986, p. 33;
    Vic 2005, p. 89）。


    基于密教湿婆教的印度 `Devaraja` 崇拜可能在爪哇对印度国家政治的采纳中发挥作用。然而，本土化的采用可能改变了仪式和意义。用 `Gusti` 称呼神和统治者的概念是该崇拜的明显证明。从宇宙观角度看，爪哇的统治者概念认为国王是地球上的神性代表。确实，爪哇印度教
    `Kahuripan` 的 `Airlangga` 统治者以及 Majapahit 的 `Kertarajasa` 被刻并永化为 `Wisnu`，而 `Singasari`
    的 `Anusapati` 被刻为 `Siva` 的化身。他们的纪念碑只是在 `manunggaling Gusti-kawula`（神人合一）意义上对代表性神性的建筑永化宣称。`kawula`
    的概念很难翻译。它不仅仅是关于被统治者作为仆人或从属。`Gusti-kawula` 的思想也与牧羊人与羊的关系并不相似（Peacock 1973, pp.
    29, 158）。`kawula` 不仅仅是劳动力，还是精神支持者、崇拜者、追随者和信徒，带着完全的虔诚。

