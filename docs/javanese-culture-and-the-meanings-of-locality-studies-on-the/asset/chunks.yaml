  trans: '


    将生活视为一场行走，爪哇人造筑的环境可以被看作是各种各种风格、方式、规模、形式和事件中，共同表演的舞台。由于 `lakon` 也意味着剧中的角色，因此，作为
    `nglakoni` 的生活被认为是为了服务集体统一而进行的表演。存在本身实际上是为了服务仪式活动和庆典而设计的；在爪哇人的传统中，如果没有仪式性宴会（`slametan`），家庭居所是毫无意义的。这就是为什么在日常生活中，爪哇人造筑的环境呈现为一个空旷的地方。所有领域都属于
    `slametan` 表演期间指定的场所。


    如前所述，爪哇人从小就接受其传统的教导，学会管理自己的情绪和感受，以达到 `sabar`（耐心）和 `prihatin`（忧虑）。这些被认为能让他们能够通过冥想（`semedi`）和反思（`tawekal`）在任何困难时期生存下来。在建筑上，`eling`和`prihatin`
    被融入到建筑表达中，表现为朴素的外观。


    在任何表达层面上，爪哇人使用形式和色彩的方式都与 `mattw`（内敛）和土色相契合。这一切代表并反映了爪哇人相应的与土地和自然和谐的偏好。不需要显露或自我自大。爪哇文化对于个人的表达和形象往往是压抑的。造筑环境的变化和破坏无法伤害到爪哇人的感受，因为他们并不将自己的生活和存在认同于这些人工。这并不意味着爪哇人不在乎与事物的集体记忆体验。


    爪哇人传统上接受训练，不要感性，要自我控制，这种信仰基于：时间会解决他们的问题，生活必须以 `legawa`（慷慨和利他）的精神继续下去。避免公开冲突和对抗是爪哇人处理任何问题和变化的态度。他们相信任何程度的文化现象都存在并主义：从思想到具体的物品。


    并主义的方式通过 `nrima`（接受）的机制以积极的方式促进。它意味着准备好接纳所有可能性，并在不带任何偏见的情况下通过留心的倾听来管理问题。只要改变是谨慎且有说服力地引入，他们就会听。这一切并非源于爪哇文化的恩典和祝福，而是在于人类存在的本质，他/她总是能够带着学习的能力在地球生存。


    对于爪哇人来说，家的感觉从未离开学会与自己的感受和情绪适应（`cocok`）。克利福德·格尔茨（Clifford Geertz）从某种和谐体验的角度全面描述了
    `cocok` 的概念（Geertz 1973, pp. 129–30）。然而，这是一个让人对自己的环境感到从容的过程。在寻找家感过程中的学习被爪哇人感知为
    `nglakoni` 的概念：即在不恐惧不焦虑的情况下生活和处理任何问题与挑战的能力。


    `Nglakoni` 是学习保持开放，并基于一种信念：任何情况和环境都有其自身的教训、智慧和信息。爪哇人接受传统的教导，管理并控制自己的行为以成为 `priyayi`（贵族）：成为一个对他人的充分尊重并能够控制自己本能和欲望的文明人类。这就是为什么他们的环境发生任何程度的变化，不会产生恐慌和不安的原因，因为他们相信事物的本质是没有永久的状况，只有变化本身。这一切是爪哇人通过
    `sumeleh`（顺应天命）的思想构想的。


    造筑环境与其语境和设置的整合被构想为 `nglaras` 的思想：寻找和谐共处或背后统一的方式。在这种意义上，建筑工程的存在不是为了做出任何高调的表达。爪哇传统用其经典信条
    `ojo dumeh`（不要骄傲）拒绝任何倾向于展示个人富裕且对和谐关注较少的尝试或表达方式。显然忽视与他人的关系被认为不符合爪哇人的表达方式。


    因此，建立居所不仅是为了揭示其与周围及社会的位置，也是为了贡献 `rahayu` 的存在，这意味着福祉、美感、健康和修养。在这种背景下，居所必须在生态系统的整体中被发展，在这个整体中，每个元素或生命对于文化精炼（`alus`）的动态生命系统都有其各自且真实的贡献。作为被修养的，`alus`
    被视为一种文化过程，将所有潜在的来源和材料组合成和谐的整体。这在爪哇传统中被称为 `nglaras`。这种认为一切原则上都能找到自己的道路并为完整做出贡献的信念，可能导致爪哇文化走向其文化帝国主义。


    ## 时刻与家


    爪哇文化避免除国家相关活动和仪式之外的对居所进行自我夸大式的表达。爪哇人相信每个事件都有其 `wanci`，即自己的时时刻，用于展示统一的思想。在它的启示中，`wanci`
    是非线性的时间，是循环重复的。`wanci` 不是基于数学测量的时间方案（在那种方案中，空间动作约定被绘制在一个可测量的系统中）。`wanci` 仅仅是循环重复中事件和遭遇的入口点，旨在恢复世界及其有序系统的统一。


    仪式活动和事件、`slametan`（祈祷）、`ruwatan`（净化）、重生以及其他的宗教庆祝，是宇宙力量显现以恢复世界危机的契机。这是爪哇人保护和维护他们世界统一的方式。恢复和重建统一的呼号是在产生危机时给出的。危机不仅涉及转变和变化，还涉及在人类诗意使命的意义上表达共同的：`memayu
    ayuning bawana`（美化世界）。


    '
- fmt: '

    Although in the Javanese language the work of art is associated with the concept
    of `reka` (creative work, figure, painting, artificial, and mind), its context
    and application are restricted as the medium of event for demonstrating the idea
    of oneness. Erecting a settlement or a house is never associated with the concept
    of `reka` because such works have already been established with typological form
    (`pakem`). In some way the concept of `reka` sounds deviant, out of conformity,
    and counterfeit. It is, however, not to say that creativity and innovation do
    not have special room in the Javanese tradition. The affirmative account for creativity
    is `mbangun`, a synonym of `reka`. `mbangun` is actually building, erecting, establishing,
    sustaining, and developing. Its context, however, is not only to establish the
    structure and shelter, but also to renew and recover the earth. Creative work
    in the sense of `mbangun` has always emphasized its constructive intention for
    making the world whole and beautiful.


    The message of `mbangun` is to cultivate the land and to make a free area for
    possible construction. Regarding the built environment as the work of art, its
    composition might have been established with sensible technique and treatment.
    Since the concept of art in Javanese culture does not manifest at the level of
    abstract formulation, it is difficult to grasp the work under a single artistic
    concept without taking its various Javanese ideas of beauty.


    ### Beauty and the Built Environment


    Beauty related to the built environment in the Javanese tradition comprises various
    concepts: `rahayu`, `apik`, `endah`, and `lestari`. However, the ancient Javanese
    concept of beauty concerning building was more comprehensive in its formulation
    under the notion of `hita`. In the old Javanese language, every building has its
    essentially designated beauty called `hita` concerning its relationship with human
    being. Nonetheless, `hita` is not simply somewhat functional or utilitarian. Rather,
    `hita` is beauty because of its capacity for giving and delivers an inventively
    assenting thing for human well-being.


    The sense of beauty in the framework of `hita` is expressed in the word `Hlam-hlam`,
    meaning kind and beneficial. Since `hita` is a Sankrit loanword literally meaning
    well-being, its synonym in Javanese language is `rahayu`, which is widely and
    commonly used with the word `sugeng` (safe, vigorous, vital, and healthy). Thus,
    `sugeng rahayu` is the concept for the state of being safe, fit, fine, well, and
    living in perfect shape. Generally the concept is to emphasize dwelling as walking
    through on the safe track.


    ### Innovation and Pakem


    Although carpentry and millwork is a longstanding profession for Javanese traditional
    building construction, there is no indication that wooden architecture finds its
    way for free expressions. Design in the Javanese way is commonly understood within
    the scheme of `pakem` (pattern, scheme, and format). Living house must have been
    reproduced generation to generation based on its already-established model (`pakem`).
    Although traditional master builders (`hundagi`) have disappearing for several
    centuries, their `pakem` is still alive. The application of `pakem` in the built
    environment is to establish the stately ordering system to acknowledge and to
    affirm the social status of its owners.


    Although the scheme of composition and construction has a already formulated with
    `pakem`, it does not mean that the Javanese do not have any respect and honor
    to innovative artistic works. The space for innovation is still on hand within
    the agenda of making events. Then the problem of artistic work in Javanese culture
    does not lie in the exploration of form and style, but concerns the capacity of
    the work as stage of the world. The utmost endeavor for works of art is to incorporate
    the rituals and ceremonies that sustain and develop the world toward its beautiful
    oneness. Architecturally, the Javanese house is to reinstate its capacity as the
    theater of family rituals.


    ### Family Rituals and Slametan


    Family rituals in the Javanese tradition are the occasions when the sense of oneness
    is experienced. Being guided with rituals, `dalem` shows itself as the pedestal
    of community. Ancient traces of Pantheistic Animism are demonstrated with solemn
    mantra reciting verses from `Al Qur’an`. The purpose of gathering in the house
    during family ritual is to reinstate their wish and hope for being on the safe
    track of oneness.


    `Slametan` as a concept stems from the word `slamet`, meaning safe and secure.
    The event of `slametan` is never in perfect shape without performing the mound
    of rice (`tumpeng`) as the center of the feast. The form of `tumpeng` itself is
    to recall the image of the tree of life (`kapaltaru`) and the statue of the mountain
    of heaven (`Mahameru`). As in ancient times, the conductor of the ceremony is
    a cleric (`modin` or `kiayi`) and the keynote speaker is the most respected person
    in the community. In general, the affiliation of religious and sociopolitical
    leadership always comes into terms with the redefinition and reinstatement of
    oneness.


    ### Sustainability and Dwelling


    The Javanese sustainable relationship between building and dwelling is comprehended
    with the concept of `open`, `diopeni` and `rawat`, `dirawati`. The words imply
    the care for its service to humankind. The ideas of `open` and `rawat` are the
    way of keeping the things’ presence and at hand for human being. It is not simply
    seen as a functional relationship between subject and object.


    House as the place of dwelling seems to have been integrated as the extension
    of body in terms of container (`wadah`). The relationship constitutes the sense
    of `pomah` (being at home) because of the care for its service. Ritual offerings
    (`sajen`) are delivered by the owner to the ancestors and spirits that are believed
    to guard the house, especially in the evening. In certain periods, usually every
    ten years, a ritual feast (`slametan`) is offered for renewing the roof covering
    of the house.


    Taking care and maintaining the Javanese house in a proper and good condition
    is not simply for its use and function as the seat of its owner. Rather, the care
    is actually based on the respect and belief that the house contains benevolent
    spirits (`danyang`). A house without spirits is an empty being, which is not safe
    and not healthy. Making peace with spirits is actually the act of thankfulness
    to what have been given by the house to live in its spatiality.


    `Slametan` is offered to demonstrate the thankfulness and wishing for the well-being
    of the family. Of course, believing in the spirits is only the way to respect
    the thing as well as being that for Javanese people everything has its own right
    and place in the universe (`jagat`). Living is always being with other beings
    based on mutual respect, regardless of its form and manifestation. Since for the
    Javanese everything is respectful being, setting up a home is not to dominate
    others. Instead, building a home is always to make up with others for bringing
    everything into a whole system in harmony. Every step and phase of building construction
    and its inhabitation is a request for safety and peace within the framework of
    ritual feast (`slametan`).


    ### Dalem, Home as Inner Self


    Harmonizing with place and society is nothing but bringing about mutuality and
    relationship from rude to fine, from raw to cooked, because home is built, sustained,
    and maintained and demonstrates the care for being and growing together in oneness.
    Home is experienced with `rasa` as striving for prolific gathering without self-interest
    as conceived in the Javanese saying, `sepi ing pamrih rame ing gawe`.

    '
