  trans: '

    正如前面提到的，房子的意义并非作为避难的建筑（`papan`）或房屋（`omah`），而是越过边界进入内部后的状态。内部与外部的过渡由入口门（`kori`）指定。`kori`的意义是生命或力量之源。这个词的本质是
    `koripan`，意为生命。问题在于：门与生命之间是什么关系？门是通往外部向内部或从内部向外部的过渡。这种过渡可能并不被视为一种严格且清晰的范畴之上的边界。我们在运动与停止之间的不同存在状态中体验到了连续性的概念。因此，内部与外部的类别不仅被理解为物理上的过渡，也被视为其之间生命的标志。内部与外部是互补的，同时也并并述了生命以及在世界中的存在。


    在城市尺度和语境下，内部（`njaba`）与外部（`njero`）的概念传统上通过城门来体现，过去被称为 `seketheng`。这个词讲述了旅程的开始与结束。`seketheng`
    并不是用于划分自然与文化界限的物理结构。它实际上是 `kelir`（门后的墙或帘幕）的开启。`seketheng` 面对 `kelir`是为了表达进入和离开不同领域的崇高状态。门的另一个词是
    `gapunten`。这个词源自 `punten`，意为道歉和许可。门是宣布和请求祝福、道歉与准入的地方。这个词传达了识别“其之间”存在本质的智慧。这一信息的要点在于，将这种“之间”体验为一种觉知（`eling`）的状态，即生命并非对错、内外的对立，而是开放的心态和带有尊严的谦卑。爪哇文化将开放的心态和带有尊严的谦卑总结为一个词：`njawani`，或意为“爪哇化”。这可能是爪哇语境下最需要被保护和维护的重要事项。


    `njaba-njero` 的概念并非简单的物理划分。在概念上，内与与的范畴是为了清晰地唤起内在自我建立家庭领域的能力。`njero` 总是被等同于内在自我的宁静
    `tentrem`，正基于此 `njaba` 得以被定义。在这种平和的状态下，`njero` 在概念上收缩又扩张，以处理与公共世界的关系。尽管 `njero`
    的定义在建筑上是建立在围墙环绕的主屋内，但房屋对任何访问都保持开放。`njero` 似乎并不等同于私有领域。相反，这种“内部”在空间上是为了表达所有者所含的力量的能力。`njero`
    越大，所有者实现合一的能力和责任就越强大。最大的 `njero` 自然然是宫殿，其环绕的围墙（`baluwerti`）是为了定义其作为整体中心的严谨自我认同，而不是为了防御。


    正如前面提到的，爪哇文化中的地点概念没有在形式与空间之间做出任何分离。一切都包含在事物本身的名字或概念中。空间与形式/构造不被视为一种领土化的边界，而被视为事物作为日常用途或事件显现的平台。占据的灵活性在爪哇房屋中得到了建筑体现，因为其核心（`sentong`）之外，空间没有被赋予特定的任务。


    在任何表达和表现方式中，如果不能在永久构建的形式中找到中心，就很难定义地点。中心总是处于移动之中。如果我们发现某个可能是中心的东西，那么我们发现的只有空虚。`Alun-alun`
    是传统的爪哇城市广场，如果没有任何宗教活动，它是毫无意义的。`alun-alun` 与清真寺、宫殿（`kraton`）之间的关系在没有宗教活动和发生的情况下不会体现。如果我们无法观察中心，我们在房屋中将一无所有。房屋的核心被称为
    `dalem`，主要由三个房间组成：`sentong kiwa`、`sentong tengen` 和 `sentong tengah`。房屋中心是一个留给传宝的空房间。中心最重要的部分是婚礼招待会上房屋中的新娘与新郎坐在一起。这个中心专门为这一活动服务。房屋中新娘的数量对应于该房间服务服务的次数。


    对于爪哇文化而言，意识到当下正在发生的事情比任何预测未来的努力都重要。觉知，被称为 `eling`，并不意味着对未来无知。未来并非在一个进步和线性的生命过程中构想出来的。相反，生命是以永恒循环的意义来理解的。皮影戏（`wayang
    Kulit`）教我们理解爪哇人如何感知他们的世界，即爪哇人感知世界的方式是每个场合都有自己的 `lakon`（情节和人物）。任何 `lakon` 总是可以与特定的角色和英雄产生认同。对于爪哇人来说，没有任何理由担心，因为任何危机根据其本质都有自己的英雄和解决方案。没有理由采取不必要的行动，但
    `eling`（意识到自己在社会中的能力和角色）和 `waspada`（觉知、警惕、谨慎并能够洞察差异）是绝对不可或缺的。


    爪哇文化对于人类生活的未来倾向于认为是“行走”的问题而非“追求幸福”的问题。因此，爪哇世界的建筑与定居取决于如何行使其本土能力，去接纳、构思和整合进入其领域的一切事物。它并不是在现有框架内通过装饰当代事物、技术和制度来积累权力和荣誉。

