    许多学者（Richter 1994; Jessup 1990; Holt 1967）已作为印度尼西亚文化组成部分对爪哇艺术进行了研究。他们的作品探索了印度尼西亚艺术与手品的形式、风格、意义和历史方面，使我们能够更深入地探讨美学问题。事实上，爪哇艺术与其习俗和传统不可分割，这些习俗传统养育并维持了它们在社会中的存在。在这方面，爪哇艺术与审美展现了它们作为印度尼西亚文化整合部分的能力，许多学者对此进行过深入研究（Anderson
    2006; Beatty 1999; Sears 1996; Florida 1995; Pamberton 1994; Hefner 1985; van
    Groenendael 1985; 以及 Geertz 1960）。他们的著作不仅向我们展示了爪哇文化的许多富有见解的方面，还表明还有许多工作需要进一步调查。其中之一就是爪哇人的审美感，这到目前为止涵盖仍然不足。与许多其他文化和传统一样，爪哇文化有其特定的、独特的意向，描绘并证明了它的历史演变和背景创新。


    尽管美学是情感、表达、印象、品味和感受不可或缺的结果，但审美体验在许多方面与个人判断和情感密不可分，同时也是背景集体价值的一部分。然而，在社会和实践背景下，审美问题大多受到当地文化和传统的限制，体现在代码、礼仪、习俗和规范方面。


    从表面上看，在爪哇传统中表现情感是一种羞耻的行为或软弱的象征，甚至是对上帝的亵罪（Geertz 1960）。爪哇传统中的美学可能与伦理不可分割——对善与坏、美与丑的价值和判断都与礼貌和举止有关。因此，爪哇传统似乎确实为普通人表达情感和思想留了空间。事实上，在他们的日常世界里，爪哇人非常擅长在手势、模仿和肢体语言上保持自律，避免情感表达或感性语句；这包括用坚毅地处理情绪反应和愤怒。尽管面临各种动荡和危机——从政治、经济到环境——爪哇人受到其传统和文化的教导，要变得坚强且慈悲，而不表现出任何情感或喜爱。这一切并非预期在一夜之间发生，而是从童年开始密集的自我训练，涉及禁欲、斋食、冥想以及其他对特定食物、习惯和快乐的克制。


    作为一种关于感受体验的哲学分支，爪哇文化中的美学面临着伦理问题的挑战。在某些方面，爪哇审美可能并不太关乎肉体愉悦，而更多关乎福祉和良好的礼仪。这意味着爪哇传统中的伦理与美学是互换的（Hughes-Freeland
    2008, p. 83）。


    本章调查了代表并运作于爪哇文化中、追求增长、美和可持续性的文化概念。其目的是探索自 1945 年以来坚韧地维持和发展对印度尼西亚政治文化的主导和霸权的爪哇文化力量和机制。本章认为，美的概念不仅影响文化身份和边界的定义，还从审美上培养了在和平存在中作为爪哇人的感觉。世界上一切古老与全新的都趋于可持续的和谐，正如爪哇信条中所阐述的：`laras
    yektine lestari`。


    为什么爪哇传统中的伦理与美学密不可分？本章将处理这个问题，并认为爪哇文化中的文明和美感具有相同的来源和目的。为了理解这一点，本章将检查并审视局部概念与其各种艺术作品中的现象之间的关系，这些作品与爪哇文化价值观和习俗相关联。


    ## 爪哇世界：Bhawana


    Semaoen 在他的小说`Hikayat Kadiroen`中可能呈现了现代对爪哇世界最好的描述之一，该小说是 Kadiroen 的故事，位于“Terjepit”（被挤压）章节。这本小说写于
    1919 年，当时 Semaoen 因为在`Sinar Hindia`上发表的文章因诽谤而被荷兰殖民当局监禁，该文章包含了对印度尼西亚民族主义运动的同支持（Semaoen
    2000; Maier 2004, p. 171）。根据 Semaoen 在其唯一小说中的描写，现代爪哇世界已经失去了它的精神秩序力量。事实上，作为一名爪哇人，他并不孤单。此前，爪哇人将他们的文化命运和国家归于吉达里第三任国王
    Jayabaya（1135–1157）的预言信息。在 19 世纪，一位极有影响力的爪哇诗人 R. Ng. Ranggawarsita 在他著名的诗歌《Serat
    Kalatida》（或“来自黑暗时代的信息”，即*jaman kalabendu*）中告诉了我们对世界的类似描写。Ranggawarsita 被认为是爪哇文化命运的预言信息仍然留存在爪哇人的心中；他的信息与个人生活之间的关系在今天仍然是神秘且富有影响力的（Andjar
    1980; Andjar 1979）。尽管荷兰语和爪哇学的渗透，被 Tsuchiya 引用的 Takashi Shiraishi 和 Andjar Any
    得出结论：Ranggawarsita 和他的世界继续在爪哇语的世界中存续（Tschuchiya 1990, p. 108）。这是一种典型的爪哇思维方式，即天堂般繁荣的世界处于过去或未来，但几乎不触及当下。


    与过去领域形成对比，当代世界被描绘为地狱，具有社会退化的价值观、吞噬资源、政治领导力以及环境引发的灾难。所有这些显然支持了那些由于自身选择未处于权力地位或仍在奋斗的人的遗产和预言信息的合理性。在许多方面，完美的爪哇世界从未出现在现在，它处于普通人认知的地平线之上，并被认为有一天会让爪哇神话、传说、诗歌和故事中的救世主承诺实现，自
    12 世纪的 Jayabaya 国王诗以来（Florida 1995, p. 273）。最近，在 2008 年 3 月，著名的爪哇裔印度尼西亚诗人 W. S.
    Rendra 在加加哈马达大学获得荣誉博士学位的位的辞中，将当代世界描绘为黑暗时代（*kalatida-kalabendu*），走向黄金时代（*kalasuba*）（Kolese
    De Britto Yogyakarta 2008）。作为一名诗人，他确认他对世界的思想与其前辈 Ranggawarsita 一致。


    爪哇世界的理念可能与`murwakala`（时间的起源）传说不可分割，这通常用于皮影戏（`wayang`）的开场。`kala`的起源被爪哇人感知为从混沌、饥荒、不洁、无序和痛苦中解脱出来的时代的开始。爪哇世界，`bhasana`或`jagat`被认为诞生于这种被称为`suker`的黑暗，源自梵语`sukerta`，意为痛苦、焦虑和折磨（Headley
    2000, p. 158）。


