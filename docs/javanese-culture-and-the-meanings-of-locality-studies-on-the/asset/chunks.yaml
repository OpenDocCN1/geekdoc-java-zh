    As described in several inscriptions, such as Mulawarman’s `Yupa` and Purnawarman’s
    `sanghyang tapak`, the existence of `pura` has been articulated as the place of
    the center of state rituals and ceremonies, where offering and donation take place.
    In addition to `pura`, Purnawarman’s inscription enables us to read the existence
    of `puri`, meaning the residency of the king and his royal family (`praja`). `Pura`
    and `puri` are institutions of `negara` that are still alive in Balinese tradition
    as constituent structures of a rectangular surrounding wall domain, `kuta`, from
    which grand ritual performances, `upacara`, are delivered.


    ### Early Kingdoms and Archaeological Evidence

    The earlier kingdom in Java was `Salakanagara` or `Rajatapura` from 150 to 358
    AD; the founder of the kingdom was `Dewawarman` from `Pallava`, India, and married
    the daughter of local ruler `Aki Luhur Sang Mulya` (Iguchi 2015, p. 116). The
    location of the kingdom was at `Teluk Lada`, today called the `Pandeglang` area.
    The son-in-law of `Dewawarman VIII`, `Jayasinghawarman`, founded `Tarumanegara`;
    `Purnawarman` was his grandson, who reigned over forty-eight vassal kingdoms between
    395 and 434 AD, from `Sakalanagara` in West Java to `Purwalingga`, today called
    `Probolinggo` in East Java. Despite its prosperous record on various inscriptions,
    archaeologists have not yet found the traces and urban relics of `kuta negara`
    for `Salakanagara` and `Tarumanegara`.


    ### Concepts of Domain and Tradition

    However, the most vivid evidence of such a fortified domain is obvious at most
    of the `candis` in Java, such as `Candi Prambanan` or the `Lara Jongrang` complex.
    Since most building materials for `puri` are made of perishable materials, mostly
    made of timbers, we are not able to see the coexistential relationship between
    `pura` and `puri` architecturally. In the Javanese tradition, the word `khita`
    used to be deployed for the domain where `tata krama` must necessarily have been
    practiced. From old Javanese sayings `desa mawa cara, negara mawa tata`, meaning
    the village community is provided with customs and mores, whereas state has its
    own laws and orders (Miyazaki 1988, p. 26).


    In contrast to rural vicinity (`desa`), `khita/kuta` or urban vicinity must have
    been marked with a conceptual boundary where urban language (`krama`) and polite
    conduct (`tata`) must have played an important role. Going into `khita` or `negari`
    for Javanese people is always an engagement with full respect and softly spoken
    language. In the Malay tradition, `kota` has been associated with any conduct
    and behavior of being humble (`melayukan diri`) (Rahman et al. 2003, p. 5; Sinar
    1971/1986, p. 25). The boundary of urbanity marked by highly sophisticated language
    and manners in the Javanese tradition has comprised the concept of `tata krama`,
    meaning set of values and principles of conduct based on hospitality, respect,
    and humility.


    ### The Legacy of Majapahit

    The traces of ancient `khita` as shown by the remnants of `Trowulan` of the fourteenth
    to sixteenth centuries gives us a boundary covering ten square kilometers. Concentration
    of populations has been indicated with the remnants of terracotta foundations,
    networks of drainage, paths, and monuments within the area of `khita`. Even though
    the Majapahit capital `Trowulan` has not been inhabited since the end of the seventeenth
    century, traces of drainage and water reservoirs are still readable on site. In
    spite of `Singasari` and `Trowulan` leaving us their past reality in scattered
    sources of artefacts and texts, which are due to be verified with archaeological
    excavations and historical texts, their essential structures and principles are
    still decipherable in today’s Javanese capital towns such as `Cirebon`, `Yogyakarta`,
    and `Surakarta`. Majapahit `Trowulan` has already shown the diversified domains
    of Javanese towns. The domains have been developed according to their specific
    relation to the court for cultural, bureaucratic, and weaponry professions and
    to the market (`peken` or `pasar`). Several domains of town are closely associated
    with the name of their landlords.


    ### The Role of Alun-alun

    Locating the center in Javanese Hindu-Buddhist towns such as `Kediri`, `Singasari`,
    and `Trowulan` is indispensably associated with the emergence of the town square
    (`alun-alun`). In spite of the origin of `alun-alun` prior to the twelfth century,
    its conceptual root is Old Javanese, not Sanskrit. Hitherto, the available trace
    of the town square is `Singasari`’s `alun-alun` from the thirteenth-century nearby
    town of `Malang`. This might be the oldest available town square in Java. The
    `alun-alun` is today only recognizable from its toponymical trace. Its location
    is between the statues of Buddhist `Dwaraphala` and the `candi Singasari`. Although
    the square might have been associated with the center of settlement, there is
    no architecturally indicated remains of `Singasari`’s `kraton` nearby. Entering
    the place within the enclosure such as the Buddhist temple palace is necessarily
    making a round walk ritual clockwise in front of the guardian statues. Presumably,
    the emergence of `alun-alun` was originally to accommodate such a ritual. As a
    matter of fact, `Singasari`’s `alun-alun` is smaller than `Yogyakarta`’s town
    square. Today the historic site of `Singasari`’s square has been transformed into
    a road crossing area.


    Remarkably, there is the spatial arrangement of `alun-alun`, which is provided
    with `candi` and the gate guarded by two `Dwaraphala` giant figures. The north
    direction is the main entry direction to `alun-alun`, whereas the Saivite temple
    is located on the west with its front façade facing east. Such a sacred place
    denoting center in ancient India has appeared in the seal of `Mohenjo Daro` and
    coin from the Vedic period was signified with a tree enclosed by fence (Snograss
    1985, p. 153).


    In the Javanese tradition as described in `Pararaton` and `Negarakagama`, `alun-alun`
    was characterized by a couple of banyan trees. Each tree was enclosed with rectangular-plan
    city wall (`baluwerti` or `beteng`), as shown in `Yogyakarta` and `Surakarta`.
    What was actually the relationship between `alun-alun` and `kedaton` and `candi`
    in the Javanese tradition since the period of `Singasari` during the reign of
    `Kartanegara` (1222)? The emergence of `alun-alun` might have been earlier than
    `Singasari`’s `alun-alun`.


    In Javanese oral tradition and several inscriptions found around `Kediri` and
    `Malang`, we find the emergence of the Javanese interpretation on Indic civilization,
    such as epic `Mahabharata` and statecraft `negara`; it was during the reign of
    `Dharmawangsa` (991–1016 AD). The king was also well known as the composer a state
    legal code called `shivashasana`, which is known in Bali as `poerwadigama`. The
    elaboration of Indic statecraft came into being under the reign of his son-in-law,
    `Airlangga`, who unified several Javanese kingdoms under his rule in `Kahuripan`
    from 1016 to 1042 AD.


    Like his predecessor, `Airlangga` also commissioned the composition of the Javanese
    epic `Arjunawiwaha`. Both East Javanese rulers must also have interpreted Indic
    statecraft with `mandala` within the Javanese `mancapat` model, which is subtly
    preserved in `gamelan` music principle. Moreover, the change for the name of temple
    from `caitya` to `candi` could have occurred since the establishment of `Kediri`
    during the reign of `Airlangga`. The Javanese Mataram state under `Dharmawangsa`
    and `Airlangga` might be properly said as the period when the amalgam of Indic
    culture and indigenous Javanese tradition came into being.

