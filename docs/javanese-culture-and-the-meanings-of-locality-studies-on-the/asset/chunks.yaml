    在经济上，国家和城市化需要来自各种税收（`pajeg`）和罚款（`sukha`）的收入。在古代爪哇印度教时期，收入（`pangguhan`）按年度征收，包括财产税、畜牧税和水稻税。日常税收是从商业交易（`masawyara`）和手工艺（`mistral`）中征取的。根据
    902 年的 Watukura 铭文，在特殊场合，会有向国家缴纳的入户贡献，例如献花（`pangraga`）。国家仪式和庆典（如`sima`）不仅有当地人参与，还有来自`wargga
    kilalan`、泰国（`siam/kmir`）、印度（`kling/dravida/arya/`以及以及斯里兰卡（`singhala`）的代表参与。铭文中从未提到过中国人，所有公民（`warganegara`）都必须缴纳居住税。


    ## 神王崇拜（Devaraja）


    尽管如此，尚未在 8 世纪至 10 世纪的铭文中发现关于爪哇统治者`Samaratungga`、`Daksa`、`Balitung`以及`Sindok`的神王崇拜（`devaraja`）。在当时的许多铭文中，`Sindok`从未自称为`Indra`、`Isvara`、`Wisnu`或`narendra`等神名，而是使用`Rakryan
    Mahapatih`或`Rakryan Mahamantri`等最高权威的头衔。这表明对`Sankrit`（梵语）文化的采用是为了当地的自豪感。换句话说，爪哇或印尼印度化与政治霸权无关。


    拥抱印度宗教并非仅仅因为印度教与泛灵论之间的相似性。相反，对印度传统的采纳是因为奥罗尼斯文化的融合主义传统。因此，任何影响都应被视为被学习并纳入控制的爪哇资产（`negara`），基于爪哇人（`njawani`）的文化化信仰。爪哇人字面来说是包容且有觉察的。印度教和佛教的采纳与殖民无关。相反，梵语文化极大地丰富了本土文化以及国家治理术和识字。


    ![](img/Figure_2.7.jpg)


    图 2.7。8 世纪一群妇女前往罗布奴巨巨佛塔（Caitya）的纪念。照片由 Rudi Badil 和 Katalis 出版社提供（Badil 1989:66）。


    从印度文化来看，爪哇`negara`学会了在`mandala`（曼荼罗）概念下应用中心向东爪哇的迁移（`Dharmawangsa`统治时期之前）。为了部署`mandala`，领主必须为了对其他地区的霸权而努力。`mandala`是`negara`作为宇宙中心的形而上学框架。实际上，为了防止地理分裂，`negara`应该位于四个村庄（`desa`）的中心。`mandala`的完美部署需要政治和军事霸权。获得这种霸权后，宗教僧的支持提供了合理性。不用说，爪哇传统中的密教、苦行主义和神秘主义一直是建立权力的一部分。通过这种方式，统治者与普通百姓分离。


    建立宗教建筑（`candis`）的动机可能与将多个`negaras`统一在一个控制下的成就有关。然而，夏连罗王朝（`Shailendra dynasty`，公元
    770–825 年）和三散那王朝（`Sanjaya dynasty`，公元 910–929 年）需要天界群体的支持来实现他们的自豪和成就。通过这种方式，统治者可以在宗教的保护伞下展示他们的个人野心。事实上，没有任何证据表明这些建筑是宗教生活的中心。相反，国家仪式和庆典在城镇广场和统治者的住所处举行。事实上，古代人是为了朝圣而访问这些建筑的。


    尽管在社会政治上，爪哇社会已经实现了复杂性和高度复杂的国家政治体系，但很难找到人口高度集中的居住点物理证据。像普兰巴南（`Prambanan`，约公元 856
    年）和罗布奴巨塔（`Borobudur`，约公元 790 年）这样复杂的建筑，在没有空间组织的大型人口居住点的情况下建造的呢？尽管材料易腐且面临默拉比山（`Mount
    Merapi`）和默拉布山（`Mount Merbabu`）火山爆发的潜在威胁，为了建造耗时多年或十年的大规模建筑，定居点的集中是不可少的。然而，这与政治中心或首都城镇无关。相反，这种集中在概念上是为了建造建筑的临时性，并非为了城市化。在项目完成后，这种定居点就消失了。那么问题是：`negara`与其与其建筑（如夏连罗王朝的`Dharmatungga`和`Samaratungga`、三散那王朝的`Borobudur`和`Daksa`，以及`Lara
    Jongrang`和`Prambanan`）之间是什么关系？对于早期爪哇国家来说，`candi`（庙）究竟是什么？


    如前所述，`negara`作为其公民（`paura`）的精神统一实体的存在，如果没有宗教仪式（`caru`和`puja`）是不可能的。为了将统一作为一种活动体验，`negara`需要仪式化和正式的场合来展示集体的团结和承诺。这一事件的终点是国王或女王的自我满足，这通过他们自己的纪念碑来体现。在这方面，这些建筑仅仅是统治者使其遗产永生的工具。更准确地说，对于爪哇统治者来说，`candi`更多是权力的祭坛，而不是对人民的奉献。爪哇统治者大多过于自傲，不在乎宫墙之外的人民，而在乎税收、贡品、忠诚以及国家仪式和庆典。


    事实上，`caitya`的存在也象征着`mandala`或`prasada`。作为纪念性建筑的`candi`在视觉上比抽象的宗教用途更有用。正如罗布奴巨塔`Karmawibangga`面板所示，`caitya`并不是像清真寺或教堂那样的聚会场所。因此，古代爪哇的`caitya`在受到印度影响之前，可能仅仅是一个纪念性结构（`tugu`）。因此，`caitya`的宗教崇拜可能在意识形态上维持本土信仰，但可能用印式的服装和装饰进行了重新构建。


    古代爪哇的`caitya`可能为古代爪哇社会提供了一个新的祭坛，以取代他们的泛灵论`pepunden`（金字塔形式的神地）。与`caitya`相关的仪式可能提醒了人们与其祖先的身份。对共同起源和祖先记忆可能是古代爪哇人建造`caitya`的动机，而不是任何其他宗教意图。


