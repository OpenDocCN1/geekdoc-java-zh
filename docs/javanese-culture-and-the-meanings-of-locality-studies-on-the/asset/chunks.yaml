    The area of kuta negara as the capital of state would have been divided into several
    domains (kalungguhan, lungguh), which were managed and controlled by high-rank
    state officers (pamgat, adipati, or bupati) as landlords. Far and away from the
    capital town and in rural areas, such domains and lands were entrusted by the
    adipatis or bupatis to their low-rank state officers, called bekels. However,
    in the capital town, the domains (lungguhs) of settlement created urban blocks,
    which were divided by the street (marga) for the movement of people in group on
    their horses or on their feet. Albeit several inscriptions did not mention the
    settlements in the ancient state capital, chronicles from China confirmed the
    importance of the seat of the ruler as symbolic center of the world. The core
    of the settlement called dalem or jro was actually buildings or pavilions within
    the rectangular plan wall system (turus/penyengker).


    As mentioned in several inscriptions of Jurungan of 876, Poh of 905, and Pagumulan
    of 902, prior to the reign of Sindok, there were important institutions of urbanism
    in existence, such as for the chief of executive officer of noblemen (patih),
    state priest (purahita), territorial liaison (desaadhyaksa), attorney (adhyaksa),
    judge (upapatti), communicator (pangujar), archive/record (citralekha), finance
    (kabandaryan), and taxation (pangurang). Specialists in various occupations were
    also well known in ancient Javanese society, such as undahagi for master builder,
    hawang for ship captain, mapadahi for drummer, kicaka for dancer, awayang for
    puppet plays, and rawit for musician. Their specific expertise is signified with
    the prefix juru or tuha before their given name. There were various state officers
    with special tasks as well as wikekas (messenger between villages), hulu wras
    (officer of rice), tuha alas (officer for forestry), hulair (officer for irrigation),
    mapken (officer for market), mataman (officer for park and garden), tuha gusali
    (officer for blacksmiths), huluwuatan (officer for bridge), and mawatas (officer
    for border and boundary).


    Indeed, one essential component of urbanism is the state record. Accordingly,
    the record system during the ancient Mataram Kingdom was written on various media
    such as lontar leaf (ripta), bronze plate (tamra), and stone (prasasti). In addition,
    the other sign of urbanism was the existence of an exchange unit for trade. In
    the ancient Javanese culture the currency was based on various commodities that
    included the gold unit (kati), water buffalo (suwarna), and rice bowl (masuya).


    Furthermore, urban society in ancient Java was organized within various associations
    with specific terms of membership, aim, and scope. Elders gather together within
    the kamitua group with special tasks for consultation of community affairs while
    housewives pulled themselves in their rainata group for community mutual help
    and family care. Children were looked after by the community in the wadwa rarai
    organization for their early training and play group, meanwhile teenagers have
    their own association as well such as rara or werewereh for girls and wadwan matuha
    manwam for boys.'
