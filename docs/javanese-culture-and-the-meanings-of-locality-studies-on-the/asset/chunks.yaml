  raw: 'What is actually the purpose of the work of art in Javanese culture? As already
    mentioned, harmony and oneness are inseparable from the purpose of the Javanese
    world, that is, to beautify the being of beings as a whole. Beautifying the world
    (memayu ayuning bhawana) is essentially the purpose of all human work on earth.
    Accordingly, subsuming any individual want and need is the precondition for being
    able to dedicate all effort and endeavor to get into the law and principle of
    integration into wholeness. The integration is demonstrated with the quality of
    synthesis without losing traces of its authentic origin. The work as the manmade
    thing is conceived as a new being with its own power, which is in Javanese tradition
    called greget (Wibisono and Kurniasih 2002, p. 264).


    Any successful work of art is believed to have a spiritual power of greget (Suharto
    1998) that invokes intense human feelings and sensibility for empathy as well
    as for getting along with the audience. Under the notion of greget, the work of
    art is able to bring forth human experience with the sense of harmony within the
    whole composition. Correspondingly, any part in the system of work demonstrates
    its significant role and contribution to the whole story within the work.


    Perfection (utuh), stability (jejeg), and free from vested interest (sepi ing
    pamrih) belong to what Javanese culture considers aesthetically pleasing. In Javanese
    culture, perfection (utuh, sampurna) of the work is understood if the work is
    open-ended, in which the beginning and the end come into terms with an infinite
    cycle that grows from micro to macro cosmos. The ground of this perfection is
    based on the beliefs that every being is identical and contains the power of being.
    Without this identity, beings are not able to stand together as a whole.


    Stability (jejeg) is another condition of the work of art for being able to take
    part in the whole composition or system. Standing in line within natural laws
    is one important principle to achieve stability in composition. The notion of
    stability is also to address the work with essential quality that is not untruthful
    or hiding something. The concept of jejeg in the broadest sense of the word is
    applicable for somewhat persistent upholding adoration (sajen) and respectfulness
    (kajen). The work of art without stability is not respectful in the sense of characterlessness
    because it does not contain any constructive element and structure for being whole.


