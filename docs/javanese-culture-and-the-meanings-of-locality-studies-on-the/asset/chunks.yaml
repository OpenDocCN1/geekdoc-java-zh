    Even though most states and settlement centers had disappeared between the first
    and twelfth centuries, the traces of Indic influence were apparent. Their barely
    recognized traces in the past were found in scattered sources; from relics of
    monuments (`candis`), inscriptions (`prasasti`), poems (`kakawin`), and chronicles
    (`babad`), to myths (`dongeng`). Nonetheless, on urban history there is seemingly
    nothing left behind in terms of comprehensive archaeological evidence. Were pre-Islamic
    states without cities possible or did they have a different concept of urbanism?
    Hitherto, judging on urban settlements in the Indonesian context lacks the local
    knowledge and context of what urban is. The primary sources of this historical
    investigation are local concepts, artefacts, relics, and bibliographical history
    related to human settlement in Java Indonesia prior to the twelfth century.


    ## Pre-Islamic Java


    Studies on early urbanism in pre-Islamic Java have been presented by numerous
    scholars (Coedes 1944/1968; Wisseman-Christie 1986; Wisseman-Christie 1983; Coedes
    1966; Ali 2011; Kulke 2001). Their contribution to our knowledge on ancient Javanese
    settlements is unquestionably significant. However, local ancient concepts concerning
    urban settlement still need further examining and explicating. This chapter argues
    that local concepts are potentially resourceful for historical analysis because
    ancient concepts and things were contextually related to and associated with each
    other in constructing the ancient world. What is the relationship between the
    concepts of state and urbanism in ancient Java? The question leads this chapter
    to explore aspects and ancient concepts related to early states and societies
    that are theoretically constituent for ideas or traces of urbanism. Hitherto,
    less attention has been paid to developing theoretical positions that enable us
    to understand the relationship between `negara` and urbanity. This fact is probably
    rooted in the deficiency of our understanding of the political culture that was
    shaped and had been shaped with `negara` as the generative concept of Indonesian
    towns and cities.


    Hitherto, misconceptions have been inevitable because urbanism is narrowly understood
    as the morphological phenomenon of settlement with the concentration of populations.
    Rather, urbanism is essentially about the experience of politically organized
    settlements with a sustainable capacity for cultural cultivations and economic
    growth. Accordingly, development and growth are possible because there are available
    resources and the political stability of their production system, politically
    and environmentally. Besides, urbanism enables citizens to sustain their wealth,
    power, and capacity for something worthy as a nation or system of polity. Concentration
    of settlement is probably not a sole determinant variable for urbanism but apparently
    the outcome of mode, demand, and consequence of a cultural production system.


    To understand the history of urbanism in Indonesia as a cultural phenomenon it
    is likely necessary to include the discourse on `negara` as a political concept.
    The reason is because the origin of urban settlement is inescapably the product
    of political culture and of interactions with others. It is political culture
    that makes towns and cities unique and contextual. Since urban settlement is the
    site of the concentration of power, unfolding and dismantling the concepts of
    hegemony and authority is crucial for a historical discourse on what urban is.
    Methodologically, this chapter is a hermeneutical investigation. It deals with
    the concepts of structure and the aspects of early urbanism in Java Indonesia.
    The focus of the chapter is to divulge and unfold local concepts concerning domains
    and community aspects that have been constructive to the world of the past and
    present. In order to find their original meanings of locality, dismantling and
    divulging the local and original concepts of place becomes the main task of the
    chapter. In doing so, urban history is not simply a descriptive narrative of the
    past but also a discursive interpretation of the precedent world and its political
    culture. Then the history of urbanism will be depicted within this socioculturally
    constructed reality in which `negara` as a concept is central and indispensable
    for urbanism in Indonesia.


    ## Desa and Early Negara


    In the history of Indonesian settlements, villages (`wanua`, `kampong`, `gampong`,
    `banua`, `kabisu`) are distinguished from towns (Javanese `kuta` or Malay `kota`)
    by their institutions and societies. `wanua` is an autonomous, self-sufficient,
    and paternalistic settlement organization. Socially, ancient villages (`wanuas`)
    were constituted of dualistic antagonistic groups: noble class and commoners (Kroef
    1954, pp. 842–62). Even though several villages (`wanuas`) stood independently
    (Bellwood et al. 1995, p. 195), a `negara` had to have several `desa` (villages),
    which surrounded and supported its political center (`kuta negara`). Historically,
    there was never a `negara` without `desas`. `negara` and `desa` had been in coexistence
    since the adoption of Hindu and Buddhist influences from circa the fifth century.
    `desas` and `negara` were not simply economically interdependent, in terms of
    a master/slave relationship, but they both also metaphysically supported each
    other, in terms of a parent-children relationship.


    Undeniably, most indigenous rulers in Java embraced Hinduism and Buddhism between
    the fourth and tenth century, which enabled them to found a state `negara`. Prior
    to this possibility, they had to unite at least four villages surrounding their
    own `wanua` under their control. This was what in Javanese tradition was known
    as `mancapat` (Koentjaraningrat 1985, p. 100). However, it does not mean to consolidate
    the whole villages into a location. What is important for the `mancapat` concept
    is to build a chain of villages. The more powerful a state is, the longer the
    chain they build. Then the surrounding villages (`tpi siring`) were brought under
    their political control and granted with `desa` polity status. Despite the consolidation
    of villages under a single roof, authority was indigenous idea and practice, the
    transformation from chiefdom to state had been philosophically owing to Indic
    state influence. They did not only learn from the Indic civilization Hinduism
    and Buddhism, but also statecraft, literacy, and the way to control territory
    with a taxation and tribute system.


    During the eighth century, there was a significant change in the development of
    Javanese settlements. The change is documented in the inscriptions of `Dinaya`,
    which mentions the Sanjaya dynasty from circa 732 AD (Coedes 1944/1968, p. 90).
    The development was denoted with the text indicating the replacement of concept
    from the indigenous settlement institution of `wanua` by `negara` or `desa`. As
    found repeatedly in several inscriptions in the region of Sleman Yogyakarta, `desa`
    was not understood by the Javanese culture in its original Sanskrit account for
    place and territory. Rather, in the ancient Javanese context, `desa` was a village
    settlement and community with a politically organized system of dualistic social
    groups: `karaman` consisting of elders (`rama`) and `bhogi` consisting of `raka`
    or `rakryan` (big or older brother) at the village ruling position; `karaman`
    is gentry of the village. Later on the `raka` or `rakryan` became the title of
    pre-Islamic Javanese aristocrats or noblemen. The title had been transformed from
    `rakryan` to `raden` since the Islamic Demak Sultanate with its first ruler `Raden
    Patah`.

