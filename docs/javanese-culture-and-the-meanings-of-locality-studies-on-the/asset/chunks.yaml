    最初，纯洁作为一种安全状态是村庄的一个传统条件。为了确保这种状态，爪哇岛和印度尼西亚的大部分地区的村庄必须提供一种非自愿的集体劳动，以出于卫生和精神目的维护村庄。这项被称为
    `bersih desa` 的工作实际上不仅是清洁、更换和修理建筑及卫生设施，而且是在精神上对作为一个小世界的村庄进行补充和新生。`bersih desa`
    具有双重目的，一是维持农业再生产，二是与当地灵性世界保持友好的关系。村庄集体聚餐（`slametan` 或 `kenduri desa`）是维护村庄福祉和庆祝的一部分。事实上，`bersih
    desa` 是村庄作为小世界重生的净化行为。所有村民都应该参加这一盛典。只有病人和儿童可以免于积极参与。事实上，这种净化世界的行为是为了维护、建立和维持统治者与被统治者整体的统一。


    迄为止，`bersih desa` 的传统一直延续。`bersih desa` 的最佳时间发生在群岛的每个村庄、城镇和城市，作为每年 8 月 17 日印尼独立日纪念活动准备工作的整合组成部分。这一天是国家和国家的特殊事件，潜在地统一并聚集所有公民为一个整体。村民受到当地领袖的鼓励和动员进行社区服务以及对其房屋和场所的装修。各种活动并行进行，并在独立日达到高峰。


    从历史上看，独立日的庆典深根于辛加沙里（Singasari）和满者伯夷（Majapahit）传统。根据《国家史》（`Negarakertagama`），节日和庆祝活动在
    `Hayam Wuruk` 统治期间达到顶，发生在 `Caitra` 月（3 月至 4 月）。国家举行了一场盛大的会议，并接收了来自所有下属王国、地区和领土的贡品（Leur
    1955, pp. 7–10）。在 9 世纪之前的古代爪哇时期，这样一种年度庆祝被称为 `sima` 仪式。那是国家下级王国、地区和领土必须向国王效忠、纳贡并缴纳税款的时间。他们出现在国家首都是，是向统治者忠诚和服从的标志。


    在任何国家场合，国王或女王实际上是自己为了光荣、权力和满足而进行的表演的唯一观众。在他们之外是该活动的支持者和表演者。国家剧院的导演是其最高等级的国家祭司，`maharesi`
    或 `mahapandita`。所有这些表演的目的可能仅仅是权力的自我满足，冠以宇宙净化和世界重生的名义。事实上，国家场合是展示谁在权力圈“内”、谁在“外”的事件。对于统治精英来说，这一活动是他们的表演，证明国家和民族处于有序的结构（`mapan`）、繁荣的活力（`kerta
    raharja`）以及精神上的统一（`manunggal`）。


    ## 改革的阻碍


    如前所述，“洁”或“脏”的概念与道德价值无关，而简单来说是政治上的受青睐或不受认可。在新秩序时期，自由主义、共产主义和社会主义被归为“脏”的一类，而中间派民族主义和国家意识形态的忠实者被政权认为是“洁”的。在今天和改革时代，主流和印尼精英仍然维持基于底线概念的“洁”与“脏”的概念，即“洁”或“脏”与主流统治阶级有关。从这个意义上说，危险（`bahaya`不仅仅是对国家或国家的不安全威胁，而是取决于其影响在多大程度上威胁到主流统治者的自尊、保护和预言。


    在应对危险时，主流统治集团将以国家和民族统一的名义尽一切努力。在爪哇语和传统中，击败对手的做法被称为 `ahangkara`，意味着绝对的支配和受控。传统上，爪哇统治者有权拥有
    `ahangkara`，因为他是地球上代表神性的以维持和平秩序的人。在 `kwasa` 或 `kuasa`（权力）方面，爪哇权力将利用一切可能的手段为了和平秩序将一切置于控制。爪哇传统中一种广为人知的策略是
    `apus karma`，或微妙的计划或方法。将研究敌人的个人生活以了解其优缺点。敌人的弱点包括 `maen`（赌博）、`madon`（情爱）、`mabuk`（喝酒）、`maling`（偷窃和欺骗）以及
    `madat`（吸鸦片或毒品）。关于 `apus karma` 的著名爪哇故事是由 `Senapati` 实践的。作为 `Kotagede` `Mataram`（1584–1601）的第一任国王，他必须击败他的对手
    `Ki Ageng Mangir Wanabaya`。`Senapati` 派遣自己的女儿 `Pembayun 公主` 作为舞者诱惑 Mangir，并强制他在结婚后向国王效忠。国王邀请
    Mangir 和 Pembayun 访问他的宫殿。在 `kraton`（宫殿）中，Mangir 被迫交出他著名的矛并在岳父面前跪下。`Senapati` 杀掉了女婿并将尸体分两部分埋掉，一部分在
    `kraton` 墙内，另一部分在外面。通过这种方式，`Senapati` 能够消除对其现状的威胁。这个故事的信息很明确：现状并不太关心家庭事务。


