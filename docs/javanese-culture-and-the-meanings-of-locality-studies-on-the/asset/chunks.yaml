    在本章中，政治文化被理解为一套关于公共决策、政策和行动的概念、符号、价值观、习俗、礼、行为和框架（Fagen 1969）。到为止，印度尼西亚的政权在其国家和社会范围内利用并合法化了政治文化，以建立、维持和延续其现状（Pye
    and Verba 1972）。作为一种文化体系，政治文化在历史发展中不断发展、阐述、强化、调整和修改，以适应和支持政权和社会的当前状况。政治文化可能是分析和理解政治以及权力行为的一种有效方法（Bryder
    1989; Solomon 1971, p. 8）。


    由于政治价值观对于当地文化和传统是不可缺的，因此为了理解印度尼西亚的当代发展，人们认为这种向基于社会正义的公民社会的转型，只有在涉及社会全体成员时才可能实现。事实上，目前的民主进程仅限于公共选举，但并没有更进一步、更深入地进入开放社会的治理实践。


    从理论上说，政治文化是一个相对持久的框架。它维护并维持着国家和国家的原则、理想和核心价值观。这意味着政治文化的剧变不太可能发生，因为这被认为是对整个国家和国家当前概念及现实的根除过程。尽管在改革时期（reformasi）一些新的民主治理机构和程序被建立并实施了，但政治文化的历史根源在日常政治实践中仍然占据主导，因为它们通过`印尼语`和`爪哇`礼仪作为权力关系的基本结构得到了良好的保护和保存。


    尽管如此，政治文化在纳入集体意识的理想方面具有本质性，这些理想构成了国家和国家机构及关系的生存结构基础。因此，政治文化的变革和转型不仅取决于现状中的个人，还取决于印度尼西亚社会的精英。他们大多数仍然习惯于旧的父权式庇护、自豪和预言的实践与价值观；所有这些构成了印度尼西亚家长制政治文化的结构。


    不可否认，家长制权力并不仅仅是权威和霸权。相反，它包含了创造和做一切的能力，这种能力表现为根据家长制偏好推动世界的意志和努力，例如自上而下的操作性、集体主义、从众主义和忠诚。由于世界的意义保留在当地语言中，政治文化的改革要求从口语语言和手势方面对其权力语言进行转型。在这种情况下，印尼口语在某些方面是人际平等的，在语法上对错误、偏见和无时态具有包容性；这种语言更有于民主沟通。然而，关于家长制价值观体系，礼仪和行为的交流手势比口语更有说服力。在某种程度上，`爪哇`的概念和表达被用来在恰当性和可接受性的语境下强调家长制的基调。尽管`爪哇`语不是官方语言，但`爪哇`的封建和等级化的礼仪、举止与国家官僚治理的代码非常契合。几个世纪以来，自`1945`年早期概念以来，`爪哇`政治文化渗透到了现代印度尼西亚的国家官僚体系中。此外，在占多数的`爪哇`人口中，作为通用语的印尼语已经被封建、等级、官僚和庇护文化所塑造和调整。事实上，语言的局部性不仅仅是政治文化的交流媒介。相反，价值观和意义的来源区分了一个文化地理与另一个地方。


    由于文化是一个丰富的价值观和理想体系，所有公民共同分享政治文化的价值观和理想；它是国家意识形态和国家利益不可分割的一部分。因此，政治文化的必要性对于政权和整个国家的建立是有益的。由于政治文化是国家历史发展和演化的结果，其功能不仅在哲学上具有参考意义，在处理权力事务和国家政治方面也具有实践指导意义。尽管在许多方面权力和文化在建立统治主流方面可能是互换的，但两者的意识形态联盟可能是任何政治计划最有效的力量和系统。


    政治文化之所以可行或许是因为其共同共享的愿景和观念。为了拥有这种愿景，政权将通过压迫或民主进程取得领先。塑造和建立新政治文化的问题在于其精英和主流，他们是否自愿且有能力回顾、重新定义、重新组织或重新评估他们的体系和事务。由于民主政治文化在意识形态上与家长主义不兼容，其实践可能并不理想。此外，精英的主流仍然习惯于传统的贵族（priyayis）对平民（rakyat）的传统庇护。在许多方面，这个国家的改革对于塑造基于民主和社会正义的公民社会的理想和计划来说具有挑战。


    ## 爪哇政治文化


    有一些障碍能够减缓和阻碍印度尼西亚政治的民主化进程。这一切很可能与权力概念有关，通过这一概念，整个国家和国家的多数决策得以完成。首先，群岛的权力概念深深植根于传统社区和社会的家长式庇护（`perwalian
    kebapakan`）。在政治上，家长制文化已体现在史前的村落政治`wanua`中（van Naerssen and de Iongh 1977, p. 37）。家长式庇护不仅是一个通过从小的教育和社会化的价值观问题，也是一个基于领导（`panutan`）和随者（`pengikut`）二分法的社会生活方式。由于家长制传统一直是政治文化的一部分，强大的领导是重要且必须的，通过它，建立共同愿景和集体动员成为可能。这种愿景的工具是政治信条或修辞符号（`semboyan`），它包含了一种被称为`semangat`的主题精神。`semangat`是任何政治运动和领导的内容。没有这个，政治领袖或组织就没有实质性的动力。


    到为止，主流的`爪哇`人口和印度尼西亚社会一直持有并维持着单一的家长制传统体系，这本质上是封建且以赞助为导向的。对家长主义的态度表现为对现状的忠诚，只要它能给他们生理和心理上的和平（`pengayoman`）。`pengayoman`的感觉在于统治权力为他们的日常活动提供安全和稳定的能力。爪哇语`pengayoman`的根是`ayom`或`ayem`，字面意思是受到保护以获得平静的心灵和统一的和谐。家长式领袖应该是保护者和和谐统一提供者。未能提供这些条件将损害他们作为领袖的威严（`wibawa`）。

