    # 爪哇文化与生活哲学


    从语言角度来看，爪哇居住文化区曾位于中爪哇和东爪哇。然而，如今爪哇文化的范畴在很大程度上已经建立了印度尼西亚的生活方式。爪哇习俗被认为占主地位，不仅是因为它们在群岛上具有压倒的人口优势，还因为爪哇人占据了印度尼西亚政治中从地方、地区到国家官僚体系的大多数关键位置。从地缘背景来看，爪哇的居住传统和文化很大程度上必然建立在印尼的生活方式之上。同样，可以说，爪哇对印尼生活传统的影响，是通过其文化同化的领导力，在塑造和建立国家文化认同方面决定的。


    ## 爪哇的生活方式：皮戏（Wayang）


    爪哇的生活方式是什么？研究爪哇生活方式最好的切入点可能是爪哇影皮戏 `wayang` 的理念和表演。大多数爪哇人一定作为其文化教育的一部分了解过并体验过 `wayang`
    表演，因为它被认为是他们的生活哲学和宗教。由于这种战略重要性，`wayang` 成为权力关系的最佳媒介。爪哇岛上的大多数宗教——`印度教`、`佛教`、`基督教`和`伊斯兰教`以及意识形态——`自由主义`、`马克思列宁共产主义`、`社会主义`和`五民柱原则`——从未利用
    `wayang` 作为它们的意识形态宣传媒介（McVey 1986; Taylor et al. 1991, p. 22）。`wayang` 表演中重要的不仅仅是故事，因为活动的日期和程序必须履行某些仪式和盛宴。在某种程度上，表演的准备不仅仅是技术性的，还充满了神秘色彩，既复杂又神秘。此外，表演最有价值的地方在于它作为爪哇伦理和审美理想精神信使的能力。关于这种能力，政治领袖及其意识形态机器试图利用
    `wayang` 表演来实现他们的政治利益和议程。


    ## 战士（Satria）与贵族（Priyayi）的理想


    在他们的生活中，没有比成为爪哇人更重要的了。成为爪哇人意味着表达 `wayang` 表演中 `satria` 的行为质，这种行为在善良、细腻、礼貌、谦逊、好客、诚恳、温柔和尊重方面是行为完美的。`satria`
    的理想无疑不仅于此，因为它是一个领袖的形象和模型，具有骑士般的自律举止和意识形态上具有说服力的个性。《摩诃婆罗史》中的五位 `pandawa` 潘达瓦战士可能是爪哇
    `satria` 最具代表性的形象。事实上，`satria` 的形象并不总是像 `Arjuna`（阿周�那那）或 `Gatotkaca` 那样完美英帅的人。`Hanuman`、`Subali`、`Sugriwa`
    和 `Srikandi` 也认为是 `satria`，尽管它们的物理属性不属于男性人类。爪哇文化中需要强调的重点是，`satria` 是一个具有英雄能力的
    `halus`（修养过的）人。在爪哇人的心中，成为 `halus` 是权力的象征，需要通过行动和训练来集中能量（Anderson 2007, p. 39）。`satria`
    的文化和传统被爪哇人通过 `priyayi`（贵族/精英层）的环境广为人知。`priyayi` 人因为他们在教育、权力关系和国家官僚体系地位方面的传统特权而与爪哇其他部分区别离开。


    尽管爪哇社会的大多数并不是 `priyayi` 人，但这个精英群体在塑造和发展爪哇世界几乎所有方面（从经济政治到社会文化生活）的价值观和规范方面发挥着重要作用。`wayang`
    表中最古典的部分描绘了爪哇 `priyayi` 的世界。然而，普通人（`wong cilik` 或 `rakyat`）的声音在整个表演中占有重要部分，当仆人
    `punakawan-Semar`、`Petruk`、`Gareng` 和 `Bagong` 有话说时。表演试图在一个连续的故节中描绘 `priyayi`
    的神话信息和当代问题。然而，`wayang` 故事和表演的整个理念与将生活视为行走的故事（`lakon`）的必要性密不可分。


    ## Lakon（情节）与 Laku（修行）的概念


    `Lakon` 在其概念上是指使爪哇世界从混沌变为有序系统的的人生故事。`lakon` 一词源于 `laku`，意为行走、行为和迈进。尽管开头是混乱且具有破坏性的，但爪哇的生活是一场为了行走而斗争的故事，将粗鲁和无礼转化为细腻和伟大。


    爪哇传统中的“地方”被理解为事件和日常活动发生的特征场所。如果地方与 `laku`（行走、行为、行动和演员的角色）或 `lakon`（情节、剧本、故事和表演）没有任何关系，爪哇的地点就没有意义了。像任何表演一样，地点的意义总是与所演的
    `lakon` 相关。正如影皮戏（`wayang kulit`）所示，地点的理念与其事件及其制造者密不可分，而不是场所的建筑。建筑和居住无非是 `nglakoni`（经历）同时也也是生活。`Nglakoni`
    源于词 `laku`。`satria` 的文化和传统被爪哇人通过 `priyayi` 的环境广为人知。`priyayi` 人因为他们在教育、权力关系和国家官僚体系地位方面的传统特权而与爪哇其他部分区别开。


