    # 爪哇传统中的家观念


    爪哇传统中的家观念被认为与对 `kalenggahan` 的追求不可分，这指的是在地球上一个社会公认的相应席位。在爪哇传统中，“坐”总是富有诗意的，正如 `lenggah`
    或 `lungguh`。它的意义从未与身处他人之间的这种反思性思想脱节。在这里，坐并不仅仅是社会生活中地位的标志。相反，坐着反映了作为整个社会的一部分、并拥有特定角色和贡献的意识。它的习语与个人的职业（从“手”
    `hasta` 的意义）有关。与手相关，坐成为了在社会中做某事的能力和能力的象征。


    ## 座位与职业


    爪哇文化中的“坐”用 `lenggah` 一词表达，字面意思是为了执行 `ngasta` 方面的特定任务而处于一个固定位置。因此，`lenggah`（坐）从未离开过
    `ngasta`（职业/占据）。由于坐在这里实际上是一个社会政治的居住位置，因此座位与职业之间的关系不仅依赖于工作和责任。相反，在爪哇传统中，这种关系在社会被描绘为宇宙山之地的权威背景下更具象征意义。相应，社会中的座位（`kaprajan`）有其对于整体做出行动和决策的等级和能力。政府官员是受高度尊敬的人。因此，他们的房屋似乎展示了他们的等级和地位。高级政府官员的传统房屋配有一个名为
    `pendapa` 的前厅。


    ## Pendapa 的建筑


    大厅（`pendapa`）最初源于梵语借词 `mandapa`，意思是寺庙前的等候厅。建立 `pendapa` 是为了展示所有者在社会中的等级和地位。这种大厅是根据矩形平面图建造的。大厅的形式和结构被称为
    `joglo`，支撑在四根称为 `sokoguru` 的柱子上，周围环绕着十六根柱子。简单的 `pendapa` 只有一个顶冠（`brunjung`）和一件袍（`penaggap`）。主人在国家官僚机构中的等级和地位越高，他的
    `pendapa` 就能拥有越多的装饰。


    爪哇传统中最重要的人是国王（`ratu`）。他的大厅（`bangsal`）不仅是拥有两或三层屋顶的完美 `joglo`，而且还能适应各种仪式，例如 `bangsal
    witana`（接待厅）、`bangsal kencana`（宫廷典礼厅）、`bangsal srimanganti`（觐见国王的仪式大厅）、`bangsal
    manis`（宫廷用餐厅）和 `bangsal trajumas`（宫廷婚礼和皇室仪式大厅）。爪哇房屋中的每一栋建筑和大厅必须与仪式和典式的必要性有关。


    ## 传统的坐姿


    将平台作为桌子和座位的地方是公共聚集的悠久传统，即使在宫廷也是如此。然而，作为居住的坐是一种文化的独特方面，在日常现实中并没有迹象表明使用家具是爪哇的长久传统。我们找不到表示“椅子”的正宗爪哇词汇，除了宝座（`singasana`），它仅供统治者或强大的地主使用。在某些方面，爪哇传统中的坐位是在
    `patarana` 上。


    然而，`patarana` 并不是椅子，而是长凳或平台（`amben`）。正如婆罗浮浮 `Karmawibangga` 浮雕板所示，殖民时期的之前的爪哇社会并不是坐在个人椅子上，而是坐在长凳或平台上。坐姿的艺术和安排其特征是蹲坐（`sila`，字面意思是原则和基础）。`sila`
    概念本身源自梵语，但在爪哇传统的使用和语境中得到了详细阐述，作为会议（`rembugan`）和仪式宴会社交聚集（`njagong slametan`）的相应坐姿。


    ## 室内空间与仪式


    爪哇房屋没有任何带桌椅的特定用餐区域并非偶然。在建筑上，房屋平面没有部分专门用于用餐活动。坐在地板上通过使用被称为 `pranada`（爪哇卡维语）的地毯来体现。虽然没有任何迹象表明古代爪哇的家中已经建立了家具的使用，但使用名为
    `prastarana`（梵语）的床垫是显而易见的。


    从建筑角度来看，伊斯兰教之前的之前的爪哇房屋可能在其内部没有发展出家具的使用。坐在地面或平台上一直是殖民时期之前爪哇的普遍情况。除了缺乏家具外，殖民时期之前的爪哇在其房屋领域内可能没有具有特定每日用途的既定区域，例如卧室、洗浴室、客厅、餐厅等。


    尽管爪哇房屋似乎从初不是为了日常生活而设计的，但仍有一个几乎被遗忘的用于准备仪式宴会食物的地方，被称为 `prantunan`，源自单词 `rantun`，意为顺路经过或到来。由于该地方没有任何建筑结构，而是由活动决定的，今天它的领域已经处于遗忘。


    ## 房屋的后部


    然而，`prantunan` 的概念意味着一种不常的状态。实际上，`prantunan` 专门为房屋提供一个准备宴会的地方。如果我们看今天的爪哇房屋，准备食物发生在
    `pawon`，它位于房屋的后部或侧部。爪哇房屋中的服务区域位于一个相对私密和限制的区域。爪哇传统将仪式的支持部分命名为 `wingking`，意为后部或背面。厨房、储物室、库、洗衣房和工作坊属于爪哇房屋的后部类别。从视觉上看，这些建筑必须排列在房屋后面。


