    `wayang` 的起源于印度教佛教传入之前的时期。最初，`wayang` 使用木刻人偶进行表演。现代 `wayang` 则使用皮影偶或真人演员进行表演。在爪哇社会中，`Wayang`
    是一种面向所有年龄段的兼具教育性和娱乐性的表演。`wayang` 表演的重要的是使爪哇文化价值观能够代代相传。这种通宵演出由一位 `dhalang` 指导并表演，他要负责操纵影偶、演奏音乐并为所有角色配音。


    从美学角度来看，`wayang`是对共情（`welas`）、羞耻（`isin`）、慈悲（`asih`）、快乐（`seneng`）、尊重（`hormat`）和犹豫（`sungkan`）经验的展示。文化与自然原始之间的战斗由
    `satrias` 和 `raksasa`（巨人）代表。对立元素与方面之间的紧张关系成为 `wayang` 表演中审美体验中最有趣的部分。尽管如此，在主角能够恢复并建立世界秩序之前，爪哇理想的戏剧性会随着各种考验和磨炼而展开。`wayang`
    表演最重要的目的是让观众在充分意识到古代智慧和教诲的情况下，使自己与当代世界对齐（`nglaras`）。`nglaras` 的目的是成为一个 `satria
    budhi luhung`（品德高尚、素质良好的人）。


    ### Batik


    `Batik` 代表了爪哇的图形设计和绘画。`batik` 艺术强调的是追溯到印度教佛教影响之前的图案。在爪哇语中，`Mbatik` 的意思是精细的雕刻和绘画。具有双螺旋图案的几何图形占主导地位。它的起源可能源于
    `Dong-son` 金属器物文化（Bulbeck 2004, pp. 428–39）。重复的形式和白色棉布上的大地色调主了 `batik` 设计。然而，黑色、棕色和深黄色在大多数经典
    `batik` 中占据地位。经典 `batik` 设计最重要的目的是以温柔而细腻的方式协调（`nglaras`）图案与颜色。事实上，`batik` 的美学问题非常简单，涉及其纹样和图案的启发能力、其独特性的狂热能量以及对形象的挑衅性抽象（McCabe-Elliot
    and Brake 2004, p. 198）。在构图中避免奇特和粗俗是显而易见的。`batik` 的信息是庆祝背景中的世界。节庆的微妙属于 `batik`
    设计的核心目的。


    事实上，`batik` 设计有用于节日庆祝和日常使用的版本。普通人的日常服装是 `lurik`。百姓穿 `lurik` 而不是经典 `batik`。从技术上说，`lurik`
    是 `ikat` 织物。`batik` 和 `lurik` 的区别不仅在于图案，还在于生产方法和工艺。从设计上来说，`lurik` 的图案和颜色简单且不复杂。这是可以理解的，因为采用了单双
    `ikat` 织造技术。大多数 `lurik` 只有简单的线条图案和深靛蓝色。这一切是为了将谦逊（`sa’ madya`）的概念融入普通人的生活。穿 `lurik`
    意味着认同自己为平民。在许多情况下，只有 `priyayi`（统治阶级）穿 `batik`。尽管从外表上并不明显，但爪哇文化和传统中社会地位的微妙差异体现在他们穿的衣服上。`nglaras`
    的感通过人们在休闲和正式场合的穿着方式得以体现。


    ### Gamelan


    `gamelan` 音乐是爪哇传统乐器的合奏。它是一个由打击乐、管乐和弦器组成的复杂系统。`gamelan` 的节奏结构根于爪哇人的精神和社会结构。`gamelan`
    的模式通常是循环的，反映了生命和信仰的循环本质。`gamelan` 的和谐旨在表演者之间创造一种平衡状态。


