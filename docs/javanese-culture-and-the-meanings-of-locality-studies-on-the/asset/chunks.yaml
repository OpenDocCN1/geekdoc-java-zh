  raw: 'The root of political culture of the societal dichotomy between the ruler
    and the ruled is historically shared, shaped, and cultivated among the Malay,
    Bugis, and Javanese people. The unity of the dualistic system is ideologically
    incorporated by the ruler with a semangat in the sense of a collectively purposive
    spirit. Both are considered essential in understanding how the ruler crafts their
    “imagined nation” and its establishment in real politics. Semangat is the essence
    of political agenda in order to fulfill the intentionality of power as the light
    of his/her kingdom. Accordingly, semangat is somewhat unifying, encouraging, illuminating,
    inspiring, motivating, and mobilizing.


    Negara is nothing but the container and vehicle of semangat with two levels of
    practicality. First, it is at the real politics that negara is the state body
    of polity for national affairs in undertaking domestic economy, foreign relations,
    sociocultural matters, national security, and defense. Second, it is at the ideological
    level that negara is the means for transforming semangat into the spectacle of
    power. In order to achieve the grandeur spectacle of negara, semangat, as ideological
    content, is necessarily pure and cosmologically unitary. Purity and unity are
    necessary conditions for the mobilization of all resources, free from doubts and
    resistance.


