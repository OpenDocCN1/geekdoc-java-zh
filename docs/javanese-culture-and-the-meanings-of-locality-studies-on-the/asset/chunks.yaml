- fmt: '

    Since the Javanese culture is by theory and practice highly sophisticated, the
    demonstration of the model is never obvious but subtly symbolic and allusive.
    The despotic paternalism will be cultivated with various tactics and strategies.
    In Javanese tradition, such ways are well known as `disanake` (being treated as
    their own children and family) and `dijawake` (being educated or tamed as Javanese).
    Bluntly speaking, it is to say that the person has been under control according
    to Javanese norms and manners with or without force. Accordingly, the person in
    power will embrace every potential opposition with an appeal to the intentionality
    of state and nation as unitary system. He/she will do everything in his/her power
    to eliminate and to diminish any possible resistance and conflict from the very
    beginning.


    # Power and Impurity


    In the Indonesian context, purity (`bersih`, `resik`) and danger (`bahaya`, `baya`)
    are neither simply categories of moral affairs nor hygienic values of public health.
    Rather, in Indonesian political culture they are crucial issues in identifying
    individuals or groups in the enemy of the regime in power. The slogan says `bersih
    diri bersih lingkungan`, literally meaning purity of the self and environment
    from any pollutant against the wholeness of the world. In the broadest sense of
    the words, the credo implies the political requirement for being clean from any
    indication of resistance, disagreement, and opposition against the status quo.


    Even though the notion of purity (`bersih`) is to address the governance with
    public accountability, its conceptual origin remains morally significant in the
    cosmological sense of the harmonious world. This phenomenon is obvious in daily
    politics that the governance for the harmony and unity of nation and state is
    more important than that based on law and order. In other words, a clean government
    is more intended to establish a unified nation and state free from any opposition,
    rather than to set up the rules of law with many opponents. Moreover, in terms
    of the Indonesian political culture of `kuasa`, clean authority is seen as a strong
    and solid status quo, which is able to stabilize the unitary system of state and
    nation. The sense of clean here is more about freedom from any disease and malady
    of disintegration and disgrace, rather than that of corruption, collusion, and
    nepotism.


    In Javanese political culture, purity and danger are culturally related to each
    other by one concept, namely power in terms of `kwasa/kuasa` and `prabhawa`. Accordingly,
    the problem of purity and peril is neither about justice nor about the legitimacy
    of power, but simply about their relation to the accretion and stability of hegemony.
    This implies that the ruler has more to be concerned about how to save the world
    from impurity and danger. In Javanese tradition, crises are traditionally needed
    as opportunities for new leaders to emerge; as the Javanese saying goes, `jer
    basuki mawa beya`, meaning there is no worthiness without cost, danger, and crisis
    (Jakarta Centre for Strategic and International Studies 1991).


    The case for taking over power with force and violence has been a common practice
    since ancient times from the Sanjaya and Shailendra dynasties to the modern Indonesia
    state. `Ken Arok` murdered `Tunggul Ametung` in order to get the power from him
    in the thirteenth century. Such a taking over of power brought `Tumapel` into
    crisis. A similar case happened in 1965 when `Suharto` took over the power from
    `Sukarno`, with a mysterious letter of transition of power known as `supersemar`
    (Roosa 2006). In the midst of turmoil, no one questioned the legitimation of how
    he came to power. For the Javanese people, such turmoil or upheaval is perceived
    as a sign of impurity in their world. People’s intention was to wait for a savior
    of the crises. `Suharto` played delicately to rise into the occasion. Such an
    occasion seemed likely to be repeated in 1998 when `Suharto` was away from the
    country.


    Inner struggle for power among elites in the armed forces attempted to create
    the scenes of national crisis with social and political upheavals, such as the
    `Trisakti` incident and anti-Chinese riots. As a matter of fact, the internal
    power struggle among political and military elites at the time had not successfully
    come to end with a winner. From the Javanese political culture’s point of view,
    the reason is clear because no one at the time was able to play their role as
    a knight in shining armor (`satria piningit`). In many ways, the 1998 power struggle
    was not the case for `Ken Arok`, `Jaka Tingkir`, and `Suharto` in Javanese history.
    Even though the 1998 crisis of power was an opportunity for taking over the national
    leadership, the elites were not able to utilize the event because they did not
    have the capacity to do that. From the Javanese point of view, `Habibie` is not
    a strong ruler, and `Wiranto` is not a tough leader either. On the other hand,
    `Prabowo Subianto` is neither a convincing knight nor an inspiring organizer.
    Even though `Wiranto` was in the position to take over `Suharto`’s seat, he did
    not have the guts and solid confidence to do so. Moreover, `Wiranto` is `Suharto`’s
    protégé, to whom he should be always grateful and respectful (Emmerson 1999, pp.
    309–10).


    Indeed, the political culture of Indonesia is a dynamic process that has been
    shaped and established by the status quo. During the last decade of `Suharto`’s
    reign, such a political culture was challenged by the need for change. Since `Suharto`
    as person was unable to replenish and purify his world, his light had gone dim
    and he was not able to mobilize his resources for economic recovery due to Asia
    Financial crises in 1998. He resigned as the ruler, which is not because of a
    scandalous accident but simply because he realized that he no longer had the pride
    and prestige needed in terms of power as light. He had to give away his seat voluntarily
    to someone else, otherwise somebody would take over from him violently and cruelly.


    Political culture plays significant role in determining what purity and danger
    are. In Javanese tradition, the one who is able to bring down the status quo is
    the one who is capable of restoring the world order, which is mythologically well
    known among the Javanese people as `satria piningit` (Soesetro and Al Arief 1999;
    Pamungkas 2008). One important role of such `satria` is not playing hubris. On
    the contrary, he/she has the guts beyond average people to fulfill the call of
    duty and claim his/her power without mercy to his/her enemy. Cruelty, bloodshed,
    and violence are part of this claim. Again, as the Javanese saying goes, `jer
    basuki mawa beya` (every successful achievement requires terrible sacrifices).
    Bearing this in mind, it would be fallacious to assume that purity and peril are
    morally religious issues. On the contrary, power in Indonesian political culture
    has always been the source of the world order and wealth. It is metaphysically
    concentrated and conceived as the center of spectacle.


    Exercising power in daily Indonesian culture is not about ethical right or wrong
    (Geertz 1960, pp. 77–85; Hadiz and Dakhidae 2005, p. 239) but about the pride
    and prestige of the ruler over the ruled. Accordingly, the ruler is perceived
    with a perfect image of protector, savior, director, and benefactor. Saving and
    establishing the image from weakness and flaw is very important at any cost. Nonetheless,
    personal distance between the ruler and the ruled is needed; the paternalistic
    patronage is likely a fit relationship. Beyond its political formality, such dichotomy
    does exist on a daily basis; the ruling class (`priyayi`) remains powerful over
    the ordinary citizens (`kawula`, `wong cilik`) at any level of community activities.

