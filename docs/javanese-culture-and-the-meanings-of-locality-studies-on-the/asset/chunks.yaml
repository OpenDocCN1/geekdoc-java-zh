    正如多处铭文描述的，例如 Mulawarman 的 `Yupa` 和 Purnawarman 的 `sanghyang tapak`，`pura` 的存在被描述为国家仪式和典式的中心场所，是进行奉献和捐赠的地方。除了
    `pura`，Purnawarman 的铭文还让我们能够读到 `puri` 的存在，意味着国王及其皇室（`praja`）的居所。`Pura` 和 `puri`
    是 `negara` 的机构，这些机构在巴厘岛传统中仍然存在，作为矩形围墙领域 `kuta` 的组成结构，而宏大的仪式表演（`upacara`）在此举行。


    ### 早期王国与考古证据

    爪哇岛最早的王国是 `Salakanagara` 或 `Rajatapura`，存在于公元 150 年至 358 年；该王国的创始人是来自印度 `Pallava`
    国的 `Dewawarman`，他娶了当地统治者 `Aki Luhur Sang Mulya` 的女儿（Iguchi 2015, p. 116）。该王国位于
    `Teluk Lada`，即今天的 `Pandeglang` 地区。`Dewawarman VIII` 的女婿 `Jayasinghawarman` 建立了
    `Tarumanegara`；`Purnawarman` 是他的孙子，在公元 395 年至 434 年间统治着 48 个属国，范围从西爪哇的 `Sakalanagara`
    到东爪哇的 `Purwalingga`（现称 `Probolinggo`）。尽管在各种铭文中有繁荣的记录，但考古学家尚未发现 `Salakanagara`
    和 `Tarumanegara` 的 `kuta negara` 遗迹和城市遗址。


    ### 领域与传统的概念

    然而，这种防御性领域最生动的证据在爪哇岛的大多数 `candis` 中显而可见，例如 `Candi Prambanan` 或 `Lara Jongrang`
    建筑。由于 `puri` 的大部分建筑材料是易腐材料（主要是木材），因此我们无法从建筑上看到 `pura` 和 `puri` 的共存关系。在爪哇传统中，`khita`
    一词曾被用于必须遵循 `tata krama` 的领域。根据古爪哇语谚语 `desa mawa cara, negara mawa tata`，意为村落社区有其习俗道德，而国家有其自己的法律和秩序（Miyazaki
    1988, p. 26）。


    与农村周边（`desa`）相反，`khita/kuta` 或城市周边必须标有一个概念性边界，城市语言（`krama`）和礼貌行为（`tata`）在其中发挥着重要作用。对于爪哇人来说，进入
    `khita` 或 `negari` 总是一种充满尊重和柔和语言的交流。在马来传统中，`kota` 与任何谦逊的行为表现（`melayukan diri`）联系在一起（Rahman
    et al. 2003, p. 5; Sinar 1971/1986, p. 25）。爪哇传统中由高度复杂的语言和礼仪标记的城市边界包含了 `tata krama`
    的概念，意味着一套基于好客、尊重和谦卑的价值观和行为准则。


    ### 爪辟特的遗产

    14 世纪至 16 世纪 `Trowulan` 遗迹所示的古代 `khita` 遗迹为我们提供了一个十平方公里的边界。`khita` 区域内的陶土基础遗迹、排水网络、路径和纪念碑表明了人口的集中。尽管马爪辟特首都是
    `Trowulan` 自 17 世纪末以来已未有人居住，但在现场仍能读出排水系统和蓄水池的痕迹。尽管 `Singasari` 和 `Trowulan` 通过分散的文物和文本来源为我们留下了它们的过去现实（这些有待通过考古挖掘和历史文献进行核实），但它们的核心结构和原则在当今的爪哇卫星（如
    `Cirebon`、`Yogyakarta` 和 `Surakarta`）中仍然可以解读。马爪辟特的 `Trowulan` 已经展示了爪哇城市的多样领域。这些领域根据其与宫廷在文化、官僚和武器职业方面，以及与市场（`peken`
    或 `pasar`）的特定关系而发展。几个城镇领域与其领主的名字密切相关。


    ### Alun-alun 的作用

    在 `Kediri`、`Singasari` 和 `Trowulan` 等爪哇印度佛教城市中，中心的定位与城镇广场（`alun-alun`）的出现密不可分。尽管
    `alun-alun` 起于 12 世纪之前，但其概念根源是古爪哇语而非梵语。到目前，现有的城镇广场遗迹是 13 世纪附近城镇 `Malang` 的 `Singasari`
    `alun-alun`。这可能是爪哇岛最老的城镇广场。如今 `alun-alun` 只能通过其地名痕迹来识别。它位于佛教 `Dwaraphala` 像和 `candi
    Singasari` 之间。虽然广场可能与定居点中心有关，但附近没有建筑学意义上的 `Singasari` `kraton` 遗迹。进入围墙内的场所（如佛教寺庙宫）必须在守护像前进行顺时针方向的绕行仪式。推测，`alun-alun`
    的出现最初是为了适应这种仪式。事实上，`Singasari` 的 `alun-alun` 相比 `Yogyakarta` 的 `alun-alun` 较小。如今
    `Singasari` 的遗址已转变为道路交叉口。


    值得注意的是，`alun-alun` 的布局有 `candi` 和巨大的 `Dwaraphala` 守护。北方向是 `alun-alun` 的主入口，而湿婆教庙面朝东。这种古代圣地出现在
    `Mohenjo Daro` 的印章上，用树包围（Snograss 1985, p. 153）。


    在 `Pararaton` 和 `Negarakagama` 描述的爪哇传统中，`alun-alun` 以对榕树为特征。每棵树都由矩形城墙（`baluwerti`
    或 `beteng`）包围，正如 `Yogyakarta` 和 `Surakarta` 所示。在 `Singasari` 的 `Kartanegara` 时期，`alun-alun`
    与 `kedaton` 和 `candi` 之间的关系究竟是什么？`alun-alun` 的出现可能早于 `Singasari` 的 `alun-alun`。


