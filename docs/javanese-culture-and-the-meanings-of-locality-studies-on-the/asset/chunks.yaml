    Indic statecraft came into being under the reign of his son-in-law, Airlangga,
    who unified several Javanese kingdoms under his rule in Kahuripan from 1016 to
    1042 AD.


    Like his predecessor, Airlangga also commissioned the composition of the Javanese
    epic Arjunawiwaha. Both East Javanese rulers must also have interpreted Indic
    statecraft with mandala within the Javanese mancapat model, which is subtly preserved
    in gamelan music principle. Moreover, the change for the name of temple from caitya
    to candi could have occurred since the establishment of Kediri during the reign
    of Airlangga. The Javanese Mataram state under Dharmawangsa and Airlangga might
    be properly said as the period when the amalgam of Indic culture and indigenous
    Javanese tradition came into being.'
