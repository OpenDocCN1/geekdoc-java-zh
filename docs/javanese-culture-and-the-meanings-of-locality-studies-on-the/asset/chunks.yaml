    In Java as well as in most parts of Indonesia, town in terms of `negara` is distinguished
    from village or hamlets because of two essential physical components; a permanent
    market and the seat of authority. Both institutions were crucial structures of
    a Pre-Islamic `negara` in Indonesia that defined the centre of `negara` politically
    and economically as well. The coexistence of the `kraton` and the `peken` determined
    the existence of the capital town of the state (`kuta negara`). Nonetheless, both
    institutions of centre did not have a permanent or monumental structure.


    Nevertheless, it was mostly not the case that the ancient Javanese rulers built
    their own palaces with stones. They could do so but they did not build permanent
    structure and buildings beyond temples and monuments. Prior to pre-Islamic states,
    the seats of the rulers disappeared along with their states. Obviously, the remnants
    of `Ratu Baka` from the eighth century invite us to speculate that the location
    could have been the site of the ancient Javanese palace. Indeed, the remains of
    `Ratu Baka` site gave us more evidence that there were permanent buildings beyond
    `candi`. Given that the remains of the complex are strategically situated on a
    hill, this fact could disqualify our speculations because most `kratons` in the
    Javanese tradition were always on the plain and flat area, which is not on the
    isolated hill and surrounded by woods instead of by `desa`.


    ![](Images/Figure_2.12.jpg)


    Figure 2.12. Airlangga Shrine, Gunung Kawi Tampak Siring Bali from circa 1037
    AD. Photo by Bagoes Wiryomartono.


    According to Abhayagirivihara’s inscription, dated back to 792 AD, the site was
    associated with `vihara` of `Rakryan Panangkaran` of Sanjaya dynasty. `Abhaya
    Giri Vihara` means monastery on a peaceful hill. It should be a Buddhist monastery
    or a retreat place for the former rulers in devoting their life for spiritual
    purposes. Based on the site plan, the complex shows Hindu and Buddhist elements—`Durga`,
    `Garuda`, `Ganesha`, `Yoni`, and `Lingga`, as well as three unfinished `Dhayani
    Buddha`—all together with pools for ritual bathing (`paseban`) and sanctuary caves
    for meditation. On the site the two `linggas` called `hara` bear the date of `778
    Saka` or `886 AD`. In addition, the `linggas’s` inscription mentions their erection
    under the order of King Kalasobhawa. The unison between Buddhist and Hindu faith
    is obvious on the inscription with text: `Om Rudra ya namah swaha` that adores
    Shiva with the Buddhist way.


    The Javanese idea of center is indeed not only expansively radiating control,
    but also metaphysically absorbing every world to the self of the ruler. This implies
    that acknowledging the ruler’s supremacy and hegemony is not only politically
    in agreement, but also spiritually in submission. The accumulation of authority
    is equal with the absorption of power. As found in the inscriptions of `Rukam`
    (ca. 907 AD), the idea of state was articulated in terms of the realm of self
    (`wanua i rukam wanua jro`) (Boechari 1976). Subsequently, the whole idea of state
    (`negara`) is the self (`dalem`, `jro`) as expandable circle of radiating light
    (`teja`) of the center of power.


    Indeed, the seat of the king is symbolically located at the innermost part of
    `negara`’s realm. But the expansive capacity of Javanese ruling power is not always
    territorial, but also cultural in terms of state rituals and ceremonies in which
    all people of his/her kingdom present and gather in submission to the splendid
    spectacle of the ruler’s show. Ultimately, the self of the ruler is the essence
    of the Javanese home that asserts expansively to surmount others under his/her
    hegemony. All this is dramatically performed by his/her state rituals and ceremonies
    as a splendid spectacle.


    Still, it was probably the same reason why `Purnawarman` of West Java in his inscription,
    besides declaring himself as lord of landlords (`parthiwa indra`) announced his
    gratitude to the brahmins, who were from the early Indian Gupta empire (Reily
    2012, p. 116), for the endorsement to his kingship. In return to the donation
    of land the priests had given their support for the celestial eminence and the
    establishment of state rituals; all this was for the cult of the king as the god
    of `Isvara` or `Wisnu`. Therefore he could build special monument for his cult
    and legacy. `Purnawarman` legacy was inscribed on the stone with his foot imprints.


    Architecturally speaking, self-gratification and claim for individual cult as
    absolute ruler had probably begun with the reign of `Sindok` in East Java during
    the eleventh century. More precisely, it was `Airlangga` who mythologized himself
    as `Wisnu` on earth. His memorial building is located in Gunung Kawi Tampak Siring
    Bali. As mentioned by Ngimbang’s inscriptions, `Airlangga` was successful in concentrating
    his power in 1037 AD and qualified for `cakrarvartin` status (Pigeaud 1960, p.
    470). Since then, the concentration of power in `Kediri` and `Singasari` was demonstrated
    by the state ritual of the entitlement of ruler as `ratu cakrawati` of the lord
    of the spiritual as well as the secular world as a whole.


    `Kota` or `kuta` was originally a Sanskrit loan word articulating a fortified
    domain. The wall (`turus`) had been more for symbolic purposes than for practical
    use because it was traditionally neither provided with military barracks and warehouses
    for logistics and weapons nor with a concentration of settlements. Traditionally,
    the wall had been conceived by Javanese people as the structure of `dalem`, literally
    meaning the self. Probably the palace and the capital of the state were not developed
    for large and dense populations because it was not required. The center was conceived
    as the place of splendid spectacle that happened only occasionally, such as for
    `sima` rituals and ceremonies (Munoz 2006, p. 348).


    ## Concluding Remarks


    Although there had been few archaeological excavation of historic sites of potential
    urbanism in Java and other parts of Indonesia, prior to the period from the fifth
    to the tenth century, the potentiality for the concentration of settlement was
    obvious. However, it did not happen in terms of a concentration and highly populated
    settlement. Instead, a concentration was the case in terms of court culture. It
    was indeed with a highly sophisticated system of societies that supported court
    rituals and ceremonies. Although the center of political and economic power had
    not been demonstrated by a grand urban architecture, the splendid spectacle of
    state rituals and ceremonies were in demand, which took place in the square of
    the capital town.


    Despite the lack of physical evidence, ancient concepts related to urban phenomena
    did exist with `kuta negara` as its main system. The concepts that are essential
    for `negara` as state and urban core are `hyang/pura` (religious and sacred center),
    `puri` (seat of ruler/palace), `peken` (permanent market), `lungguh` (urban block/domain),
    `marga` (street), `kreteg` (bridge), and `kalen` (drainage). In contrast to the
    village (`wanua`/`dukuh`), the emergence of town (`kuta`) must have established
    the center of several villages (`desa`) for its political and military territory
    as well as its socioeconomic region.

