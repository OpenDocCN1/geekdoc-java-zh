    Compares with court as the center of high culture, the market is more egalitarian,
    which is apparently recognized from the use of its applicable language. The development
    of urban culture in the market is mostly based on freedom of expression and exchange.
    Regardless of its association with spontaneity, vulgarity, and crudity, the market
    for a Javanese town is an actual center of sociocultural and economic life. Although
    the existence of the court is never out of Javanese people’s concern, the reality
    of the Javanese public world does not exist at its court, but instead in their
    peken.


    # Chapter Five: Javanese Pride, Patronage, and Prophecy


    ## Political Culture in Indonesia


    Although the `reformasi` has achieved some changes in Indonesian political institutions,
    the development of social justice is barely realized today. Why is that? This
    chapter argues that whoever in power does not change Indonesia toward a civil
    society based on democracy and social justice because their political culture
    of despotic paternalism has not yet changed fundamentally. The problem of civil
    society in the largest archipelago lies in the transformation of its cultural
    values from hierarchical feudalism to democracy. Hitherto, the status quo in the
    archipelago still holds fast to the ancient values based on patronage, pride,
    and prophecy that defy the democratic concept of power and equality. The predominant
    Javanese tradition—from which Indonesian political culture has been shaped and
    established—has always been a challenging factor for the process of democratization
    in various levels and occasions. This chapter is an attempt to explore the aspects
    and elements of political culture that can decelerate and hold back the agenda
    of reformation for a civil and democratic society based upon sovereignty of law.


    ### Javanese Culture in the Indonesian Context


    Originally, one important agenda of the political reformation (`reformasi`) was
    to carry out the transformation of Indonesia as a whole; it comprises the power
    relations in the political, bureaucratic, judicial, and social systems. The fact
    is that `reformasi` has not yet radically changed the political culture of the
    state for nepotism, corruption, and collusion. Consequently, poverty, disparity,
    and abuse of power are still obvious on a daily basis and mostly without legal
    consequences. Establishing social order based on rules of law has been mostly
    challenged by patrimonial establishment in the executive, legislative, and judicial
    systems.


    The question is why the process of democratization is hardly able to change Indonesia
    toward a civil society. What are the actual forces that can undermine the democratization
    of Indonesia? To what extent is Javanese political culture dominant in the reality
    of Indonesia as state and nation? The questions lead this chapter to look closer
    into the nature and roots of political culture that have historically shaped and
    established the Indonesian state and society. Moreover, this chapter is an attempt
    to unmask the aspects of power that work, shape, establish, and sustain the political
    culture in Indonesian society.


    Besides political and historical events, local concepts and their context became
    the primary source of reference for this study. Local concepts have been indispensably
    important for theoretical and textual interpretation with respect to their contextually
    originality. Hans Georg Gadamer (1976/2008) points out the importance of the relationship
    between language and the life world that provides us with the awareness of history.
    Accordingly, man as well as society is a linguistic being. Then the importance
    of local knowledge lies in the capacity of local language as the resourceful system
    for its society that enables them to grow and to develop their culture and tradition.
    This fact is not new for anthropological and philosophical studies. Clifford Geertz
    (1983) has pioneered studies on Indonesia based on local concepts and their relations
    to sociocultural phenomena. Further explorations on the significance of local
    knowledge have been presented by number of scholars (Bicker et al. 2004) that
    show its potential resources to deal with global crises.


    The focus of this chapter is to divulge and to dismantle the local concepts, which
    are associated with phenomena and ideas of power relations. This chapter will
    emphasize its analysis on the reveal of those concepts in relation to the political
    affairs. In doing so, politics and language are conceptually inseparable from
    their culture and society. Studies on politics of post-Suharto Indonesia have
    been presented by numerous scholars (Emmerson 1999; Budiman et al. 1999; Bertrand
    2004; Bertrand 2013; O’Rourke 2002; Eklof 2002; Metzner 2000; Bunte and Ulfen
    2008; Nyman 2006). Their works are not only important for understanding the development
    of democracy in the country, but also give us a new horizon for further investigations.
    One of them is to find out the relationship between political developments and
    the existing political culture, which is predominantly influenced by the Javanese
    tradition. After having been oppressed by the regime of Suharto for more than
    three decades, the reformation in 1998 was undoubtedly the beginning of a new
    era of democratic Indonesia, though it was undoubtedly challenging and uncertain.
    The reformation was expected to redefine and to reevaluate the elements and structures
    of political culture toward an open and democratic society.


    Indonesian society is historically and socially divided; it consists of the ruling
    class (`priyayis`, `penguasa`), and the people (`rakyat`, `hamba`). This antagonistic
    system works subconsciously in Indonesian societies, from village to the capital
    city, as well as from ancient times until today. Since the dualistic system has
    worked until today, the access to state politics is limited to only the elites
    (Anderson 2007, pp. 1–69); the culture does not tolerate any opposition. Grassroots
    politics has been traditionally perceived as threat and disease against the state
    and its authority.


    Even though the Dutch scholars have detected the dualistic organizing principle
    as an ancient social structure that works in most Indonesian ethnic groups (Adam
    and Anwar 2005, p. 336; Jo-Sears 1993, pp. 123–25), contemporary studies on Indonesian
    politics pay less attention to considering this pervasive division. In such a
    sociopolitically divided group, the change of political system does not automatically
    transform its political culture unless the societal structure as a whole changes;
    it is unlikely to happen in post-Suharto Indonesia, especially under the administration
    of Megawati, Susilo Bambang Yudhoyono, and Joko Widodo. Nyman in her 2006 study
    points out that after the 1998 `reformasi` there was no official plan made for
    Indonesia’s future democratic transformations. Joko Widodo does not say something
    concrete on the direction and transformation toward democratic society in his
    presidency agenda of `Nawacita`—Nine Priorities (Kurniawati 2015); his agenda
    is to establish a good governance.


    ## Political Culture as Theoretical Considerations


    The relationship between culture and politics for Indonesian studies is neither
    a new approach nor a field of research. Benedict Anderson (1972/2007) was the
    prominent scholar who introduced the importance of Javanese political culture
    in Indonesian politics (Suryadinata 2002; Anderson 2006). Accordingly, the idea
    of power in Javanese culture is the source and reference of social order and ideals
    that works in Indonesian politics until today. The dominance of Javanese culture
    in Indonesian politics is self-evident on a daily basis for power relations; Javanese
    courtesy and manners are practiced as unspoken language in the bureaucracy and
    in the educational institutions.

