  raw: 'Since the fifth century, there were more than hundreds and might be thousands
    negaras that have arisen and fallen in the archipelago. Most of them disappeared
    without physical traces, such as Pakuan, Padjajaran, Galuh, Medang, Blambangan,
    Early Mataram, and Kahuripan. Their presence in the past is barely known in textual
    evidence. Inscriptions (prasasti), legends (dongeng), annals (babad), and a few
    monuments (petilasan) are mostly biased because they are inevitably prone in support
    of the status quo.


    It is true that the institution of negara is literally untranslatable in any other
    languages beyond the Southeast Asian experience or more specifically the Malay-Indonesian
    context. The originally Sanskrit loanword negara has been transformed and elaborated
    by Javanese as well as Malay cultural experience, which is not simply palace,
    capital, town, state, or realm. Clifford Geertz has perfectly described it in
    the broadest sense of the word as civilization that the city supported and the
    superstructure of political subordination centered there (Geertz 1980, p. 4).


    Early Urbanization and the Emergence of Negara


    The domain of negara in Javanese tradition is not marked by physical nature or
    by architecture but by various levels of language practice that identify its citizens
    as krama. The obvious structure is only revealed at the innermost part of negara.
    The word krama is derived from Sanskrit meaning manner, way, fashion, step, performance,
    and, in the broadest sense, citizen, within the domain kadatwan, where the court
    language krama-inggil was practiced. The formative component of negara was physically
    designated with a fortified square domain called in pura in Sanskrit, where the
    elites or the ruling group, priyayi, pangreh praja, lived. Such a domain in the
    old Javanese language has been called jero or dalem, meaning inner space, interior,
    core, center, and the self.


    As a matter of archaeological fact, there is no negara without jero or dalem.
    The concept of jero is center; it is the seat of the landlord. Spatially, negara
    in the Javanese context is always a multilayered system of domains with jero or
    dalem at its innermost center. In many cases, the jero must have been fortified
    with a surrounding wall (beteng penyengker). Indeed, such a wall is still in existence
    in today’s kratons. It is more for a symbolic purpose than for defense. Astonishingly,
    it is difficult to find a definitive structure of negara’s periphery. Even though
    the capital town of negara in the Javanese tradition, or perhaps also in other
    Indonesian states from Aceh to Tidore, does not have any trace of definitive periphery
    and architectural boundary, its core is architecturally apparent in the form of
    a fortified enclosure called jero, jeru, dalem, or kraton.


    The domains of negara are built around the court. The areas are laid out along
    main roads (marga raya) to state squares (alun-alun). The obvious enclosure (mbeteng)
    is not only manifesting at pura, kedaton, or kraton, but also in some domains
    (lungguh) where state officers live. Kedatwan or the domain is on what the castle
    (pura) stands. The other equivalent name with kedatuan is kajeruan, from the word
    jero, meaning the innermost part of negara. Even though they have similar meanings,
    in most Malay-speaking regions, kajeruan is less common than kedatuan.


    The word kedatwan or kedatuan is actually derived from the ancient Malay word
    datuk, meaning the head/chief or lord of community. Thus, kedatwan is to articulate
    the seat of the chieftain. Datu in the pre-Hindu and pre-Buddhist phase is the
    chief of the village settlement called wanua. The Austronesian wanua is a patrimonial
    community with dualistic social groups—noble class and commoners. The center of
    polity is a village council consisting of noble leaders and elders. The ancient
    trace of wanua settlement is still alive today, such as the banua in South Nias
    and the kabisu in the Sumba islands.


    Under the influence of Indic culture and civilization, the chief must have transformed
    the community within the pyramidal cosmic model of Mount Meru with him as its
    apex. The necessity for the concentration of power and authority must have been
    incarnated with the cult of Siva and Wisnu. Without this cult, the ruler is not
    metaphysically mysterious and sacred, set aside from his noble circle and ordinary
    people. Then secrecy, formality, and reserve have come into play for the devaraja
    cult established by rituals and ceremonies that mystify his self-gratification
    and his self-appointed celestial splendor of divinity.


    Even though the development of the concept of kedatwan or kedaton has been deployed
    within the area of the ancient village of wanua, the adoption of Sanskrit in the
    Javanese and Malay polity had been very selective. They did not employ the Indic
    version from the word raja (king) prior to the period from the fifth to the tenth
    century. Nevertheless, the Indic negara for the notion of state remains in Sanskrit,
    though the meaning has been adjusted and elaborated with local circumstances.
    Prior to the reign of Airlangga in Kahuripan, the seat of the ruler has been pronouncedly
    transformed from the Malay word kedatuan or kedaton to the Javanese kraton, without
    a change in its meaning. Since then, the seat of the ruler had not been called
    pura.


    Pura as the center of the seat of the ruler in the Javanese tradition seems have
    been translated into kraton. The transformation of the concept must have happened
    in the time when the Javanese culture and tradition began to translate various
    Indic cultures and literatures into its own language. The kings, such as Dharmawangsa,
    Airlangga, and Jayabaya, were well known in Javanese culture as the initiators
    for such Indic-Javanese acculturation. Today, several Javanese towns still carry
    the name of the domain and place indicating the corresponding area of kraton,
    even though its courts disappeared a long time ago, such as Kediri, Jepara, Demak,
    Plered, Kotagede, and Kartasura.


    Mancapat as Spatial Framework of Center


    From Indic state tradition, the Javanese negara learned to apply the concept of
    mandala in the context of wheel turner (cakravartin). The origin of the Javanese
    concept of the peasant village alliance called thani with the mancapat scheme
    must presumably have been deployed from the Indic wheel turner, mandala. Beyond
    its mysticism, mandala was possibly deployed to secure the agricultural production
    and water management in dealing with drought, famine, and the dry season (paceklik).
    Based on the mandala concept, villages were brought in to cooperative units of
    settlement called thani, with a regularly rotating market once per five-day week.
    Synchronization of customary laws and mores called cara must have been established
    that could have stabilized peace and security among villagers.


    Mandala means essence or content in the original Sanskrit. The use of mandala
    in terms of kuta negara is to signify the idea of mediator between the mundane
    and the sacred. The purpose of this signification is to bring about the experience
    of mystical unity from which the manifold forms and appearances arise. The adaptation
    of mandala of Hindu into the Javanese culture is articulated in the concept of
    mancapat. Literally, it is the concept of realm beyond four corners and the four
    main cardinal directions: north, south, east, and west. Mancapat is the axis mundi
    between earth and sky. The word manca means beyond or further than, whereas the
    word pat is from papat or four.'
