- fmt: '

    # Reformation and Political Stability in Indonesia


    The most important agenda of reformation is to establish a political and economic
    stability. Stability in the Indonesian language is conceived as `mantap`, literally
    meaning permanent, firm, consistent, convincing, stable, and strong. Such stability
    is crucially conceived as the actual measures of the daily experiences of ordinary
    people on the street. The government and its institutions may change, but if political
    stability is not achieved, state and nation are in peril. As a matter of fact,
    economic improvement and justice depend on this stability. In Javanese and Indonesian
    tradition, this political stability is superficially understood as `stabilitas
    nasional`. The deep structure of the concept of stability lies in the notion of
    `kuasa` or `kekuasaan`. Unitary state and nation are always the primary concern
    of status quo in terms of `kekuasaan`. `Berkuasa` implies commanding, dominating,
    and controlling the state, nation, and its resources so that they are not in danger.
    That is to say that the nation and state are not in impurity.


    ## The Politics of Reformasi


    Indeed, the actual politics of `reformasi` is to make a radical transformation
    for the previous political culture. Even though the urgency for the sovereignty
    of law and democratization is on the agenda of reformation, both are not seen
    as a priority of the ordinary people. The outcome of the four public elections
    of 1999, 2004, 2009, and 2014 has shown us that the expectations of political
    stability are still high prior to dealing with economic recovery, unemployment,
    and poverty. For this stability, a strong leadership is needed. The New Order
    under `Suharto` (1967–1998) had successfully integrated the Javanese political
    culture into the Indonesian political system that order, stability, and growth
    are essential conditions for national integrity and identity. Political disarray
    or disorder, such as in the end of `Suharto’s` reign and the crisis of `Wahid’s`
    term, have been seen as a process of salvation that the world would be back in
    order and harmony again. These messianic beliefs are not only shared by the Javanese
    population, but also by most people in the Indonesian archipelago (Kroef 1959).
    The impeachment of `Wahid` and the unsuccessful attempt of `Megawati` at reelection
    until the election of `Joko Widodo` in 2014 confirm that the political culture
    of messianic savior of national stability is still on. Accordingly, people go
    to ballot in the hopes of `satria piningit`, a distinguished knight, or `Ratu
    Adil`, the king of justice who acts as the savior of state and nation from chaos
    and trouble (Geels 1997, p. 75; Choy 1999, p. 127; Sindhunata 1999, pp. 20, 84,
    85).


    ## The Concept of Home and Dwelling


    Political stability has been a lesson learned from Indonesian culture and tradition
    on the concept of home and dwelling as sitting. Being stable (`mapan`) is stipulated
    by the state of having a seat or occupation (`kedukukan`); it is not surprising
    to address the citizens with the word `penduduk` because sitting or `duduk` is
    not only a body posture of staying. It is culturally the sign of having a home
    with a socially respectable standing. Political stability for Indonesian culture
    is the existential state of being because it gives people a secure environment
    for their well-being.


    Moreover, for the Javanese ruler, having a seat (`kedudukan`) is neither a public
    service nor a social responsibility, but simply a powerful position as well as
    occupation for establishing stability and order in his/her kingdom. `Sukarno`
    and `Suharto` are probably the best examples of modern Indonesia’s leaders who
    recognize the sense of seat in relation to power. `Suharto` maintains the record
    for his almost thirty-two years in power because he knew that power is equivalent
    with the authority to maintain the order and stability of his kingdom; if it is
    necessary at any cost and with any means. Unlike his two predecessors mentioned
    earlier, `Sukarno`, `Suharto`, `Wahid`, `Megawati`, `Yudhoyono`, and `Joko Widodo`
    did know the sense of `kedudukan`, therefore they acted not only as secular leaders,
    but also as commanders in chief for spiritual matters. Javanese leadership should
    claim their position as traditional rulers who value the stability, unity, and
    order of state and nation in terms of cosmological realm and reality.


    ## Continuity and Patronage


    Whoever has the Indonesian presidency, he/she emphasizes the notion of continuity
    as a sign of stability. Even though he/she is the only leader who envisions a
    better Indonesia, he/she does believe in the end that the world is in perfect
    harmony; any crisis and disorder is only the way to remind people that there is
    time for redemption and salvation. Javanese leading figures barely adopt and accept
    an egalitarian and democratic way of life on a daily basis: a patrimonially ordered
    system should be in place. Only in such a system, the pyramidal structure of the
    harmonious world is cosmologically in order and in harmony. The Javanese leaders
    from `Sukarno` to `Joko Widodo` comfortably used the language of prophecy in their
    state speeches and official addresses to their audiences with the words `saudara`
    or `saudari` that sound like the connotation of subordination. In addition, they
    were never comfortable being addressed by their first name without the attribute
    of “Sir” or `pak` or `bapak`.


    In Indonesia, one is never a person without a power of seat (`kedudukan`). Based
    on the political culture of patronage, pride, and prophecy, he/she deserves the
    prefix of `bapak` or `ibu` prior to their first name. In the language of pride,
    patronage, and prophecy, ordinary and common people are like the ocean of the
    unknown supporters, though they will be addressed as brothers (`saudara-saudara`)
    or sisters (`saudari-saudari`). From a language perspective, a democratic society
    in Indonesia is a challenging goal of reformation.


    ## Modern Vision of Reformasi


    Unsurprisingly, `Yudhoyono` (2004–2014) and `Joko Widodo` (2014–) contain their
    party’s mission and vision with `semangat reformasi`, the spirit of reformation,
    that is actually in the sense of leading back to the original formation of unitary
    state and nation as declared in the 1945 Constitution (Partai Demokrat, Indonesia
    n.d.). Accordingly, `reformasi` is understood neither as a change nor a transformation,
    but renewal—in terms of readjustment and revalidation—and sustenance of Indonesian
    struggle from the colonial times until today. The very idea of nation-state in
    the 1945 Constitution is integralist. `Supomo`—one of those who drafted the Constitution
    based on his expertise in customary laws of Indonesian ethnic groups—believes
    in the necessity for unity and harmony based on family principle (`azas kekeluargaan`)
    (Bourchier 2015, p. 220), which is integralist and totalitarian through deliberations
    toward consensus. The relationship between the government and the governed is
    like father and son, that is, essentially paternalistic (Silalahi 2003, pp. 139–40).
    In other words, the nation-state of Indonesia according to the 1945 Constitution
    is conceived as a big family of various ethnic groups that value the unity and
    harmony of the whole people more than individual human rights. In addition, democracy
    in the Constitution is with condition concerning the wisdom of people’s representatives.
    It is worth noting that the word wisdom here gives room for local manners and
    values.

