    ## Preface


    ![](Images/Figure_0.1.jpg)


    Statue of Ganesha of Singasari from 13th century, collection of National Museum,
    Jakarta Indonesia. Photo by Bagoes Wiryomartono.


    This book is a collection of essays on Javanese culture that describes, analyzes,
    and discusses the manifold features and characteristics of Javanese culture and
    society comprising aesthetics, the art of living, urban settlement, and political
    culture. As a whole, the book is searching for the meanings of locality in the
    context of arts, architecture, polity, and society. It argues that study on Java
    is a significant contribution to counteract the contemporary global culture; for
    several centuries, Javanese tradition has been graciously synergizing and integrating
    foreign influences into its sociocultural system in the sense of syncretism. By
    exploring the identities and differences of Javanese culture we are able to enrich
    and enhance our understanding of the importance of diversity. In doing so, globalization
    does not mean the colonialization of monoculture modernity, but the transmission
    of multiplicity and intricacy of various cultural sources.


    The specific mission of this book is to strengthen cross-disciplinary studies
    on sustainable culture and societies in Southeast Asia, especially in dealing
    with their vibrant diversity, economic growth, global communication, and environmental
    crisis. The data and materials of the study are based on the author’s life experience
    as a native Javanese growing up in Javanese tradition. Until recently, mostly
    non-Javanese scholars or Western academicians have written scholarly studies and
    treatments on Javanese culture and tradition. We seldom hear and read studies
    on Javanese culture and tradition.


