- fmt: '

    Indeed, the birth of kala in the Javanese myth does not have to do with any anniversary
    or special event, but simply to remind people of the perishability of the world
    that is always in need of `ruwatan`. `Ruwatan` is derived from the word `ruwat`,
    meaning to liberate from perishability with care for sustainability. The meanings
    of `ruwatan` are indivisible from the Javanese rites of `slametan`. Clifford Geertz
    has described in detail how the `slametan` plays an important role in Javanese
    rites of passage (Geertz 1960, pp. 77–85). His description is still valid today,
    especially in rural areas of Central and East Java. Accordingly, the rituals are
    dedicated to the care of unity (`manunggal`), harmony (`rukun`), and of sustainability
    (`lestari`) of the world with the acceptance (`nrima`) of the destiny of mortality.


    In the Javanese myth of the world creation, time as sign and power of perishability
    is depicted as the son of the `Batara Guru` and `Batari Uma`. Even though his
    character in Javanese tradition is monstrous, rude, bluntly honest, indifferent,
    and indiscriminately savage to any being, `Batara Kala` never does violence with
    bloodshed. The necessity for `ruwatan` is more about anticipatory care for the
    well-being, unity, and harmony of the world. There are several kinds of the rite
    of `murwakala` including for personal well-being (`anggara`), for communal well-being
    (`mageri`), and for avoiding natural disaster (`sengkala`). The world in Javanese
    cosmogony is perceived as the realm of beings with the constant threat of perishability
    and transience that invokes the necessity for continuous awareness of care for
    well-being (`slamet`) that includes unity (`manunggal`), harmony (`rukun`), and
    sustainability (`lestari`).


    The puppet master (`dhalang`) plays an important role as priest. The priest enunciates
    and leads the `ruwatan` with `wayang` performance. The Javanese people—from the
    west to the east part of the island—have practiced this tradition since the pre-Islamic
    times. Originally, the rite of `murwakala` was performed as part of the opening
    scene of `wayang purwa` (Moerdowo 1982, pp. 13, 21, 22; Ulbricht 1970, pp. 14–21;
    Florida 1995, p. 273). Ancient mantras on the myth of world creation are narrated
    for all age audience. The message of the myth is made clear by certain characters
    in various power play scenes that the world necessitates liberation from perishability
    and care for its sustainability. In order to achieve this, collective awareness
    is evoked and mobilized as moral power.


    Despite its nebulous and esoteric conceptualization, the importance of `ruwatan`
    for the Javanese world lies in the call for the collective care and the awareness
    of mortality that unity and harmony are not by chance, but the outcome from communal
    intention and effort. Scholars such as Foley (2001), Headly (2000, pp. 8–9, 91),
    and van Groenendael (1985) have observed the `murwakala` rite as part of `ruwatan`
    in many parts of Javanese places from West, Central, and East that the `wayang`
    performance led by `dhalang` gives the sense of dread and danger in terms of exoticism.
    The `dhalang` and their `wayang` performances are considered the strategic vehicle
    of Javanese culture that conveys, disseminates, and sustains ancient Javanese
    teaching with an entertainment package.


    Even though the origin of the `wayang purwa` was probably from the Neolithic Ages
    the evolution of its content and performance concerning the rite of `murwakala`
    was inseparable from the assimilation of Indic civilization—such as `Ramayana`
    and `Mahabharata`—and indigenous Javanese culture. For the Javanese the `wayang`
    tradition is more than just entertainment. Rather, the puppet show is one of the
    sources of ethics and aesthetics as well as living philosophy.


    Sociologically speaking, the `wayang` tradition in Java is also the voice of the
    ordinary and rural people. However, the effectiveness of wayang tradition tradition
    in Javanese society lies in its artistically entertaining capacity that incorporates
    ancient messages and modern issues in a lively, attractive performance. Albeit
    the `wayang` performance as the medium and agent of cultural syncretism has been
    developing in various forms and styles, the main message of its presentation is
    clear that it invokes and articulates the Javanese world in the present context;
    this includes depicting the world with its ideals, dangers, constraints, and opportunities.
    The `dhalang` and its sponsor usually perform a specific theme and story of ancient
    legend, `Ramayana` or `Mahabharata`, that is actually in response to the current
    affairs in their societies, ranging from political, to economic, to social issues.
    `Murwakala` is one important theme that signifies the care for crises. The most
    important aspect of the rite of `murwakala` as well as `ruwatan` is to set the
    identity and boundary of the Javanese world within the historical and collective
    values of being Javanese, which is conveyed with the performance of shadow puppets.


    Unlike other traditional cultures in the archipelago, the Javanese ancient tradition
    continues to live on today through the `wayang` performance. Since Islamic influence
    was in effect in Javanese societies, the role and function of the ancient priests
    (`mpu`, `pandita`) had been transformed and entrusted to the puppet master (`dhalang`).
    Such continuity is not the case in South Nias and Tana Toraja. The indigenous
    priests in both regions (`ere` and `to mina`) have been gradually dysfunctional
    and disappearing since the European missionaries established their Christian churches
    in their villages. In Java, indigenous traditions have been prevailing up until
    today through their performance arts such as `wayang` and `gamelan` that work
    as an artistically entertaining vehicle of the ancient world.


    ### Artistic Principles and Artists in the Javanese Tradition


    In Javanese culture, unity is achieved with the principle of identity between
    the creator and the creation that is expressed with the concept of `manunggal`;
    the unity itself is a central symbol of power (Anderson 2007, p. 36). The need
    for unity and harmony as well as sustainability lies in the fact that life (`hurip`)
    in the Javanese beliefs system is the synergy of dualistic characters and phenomena.
    The reality of life and the world for the Javanese is unconceivable without the
    accord and wholeness of sky and earth, male and female, form and content, as well
    as outside and inside (Yumarma 1996). Accordingly, the task of a work of art is
    the act of bringing everything different together toward unity, harmony, and sustainability.
    The fear of disintegration and disarray urges the necessity for unity, harmony,
    and sustainability. In return, every being has to have their proper place with
    unique and particular function and contribution to the Javanese world. Accordingly,
    there is no concept of otherness but the unknown or beyond the boundary of the
    Javanese world and language.


    Being an artist in the Javanese world is being in the proper position according
    to seniority, education, experience, maturity, and community service. The room
    for creative innovation and improvisation is to comply with the principle of harmony
    within the community. It implies that in the traditional way, individual freedom
    is likely out of question (Mulder 2005, p. 70).


    Javanese animism believes that every being is a container (`wadah`) containing
    cosmic power (`Jiwa` or `isi`). Respect (`ngajeni`) to other beings is demonstrated
    with offering (`sajen`, `sesajen`), a bunch of flowers and foods at periodic times
    within five days of the Javanese calendar. Burning incense is part of the ritual
    for such offerings. Such a practice pertains to ancient and pre-Hindu rituals,
    as a sign of respect to the ancestors and the invisible power in the cosmos.

