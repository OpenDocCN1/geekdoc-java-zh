    正如前面提到的，爪哇人无论多么现代，都相信祖先的祝福（`restu leluhur`），这种信仰已塑造了各种宗教态度和行为规范。所有努力的基础是 `semangat`，它以多种形式和名称表现出来，但本质只有一个。苏加诺在反殖民解放和印度尼西亚国家建设的背景下谈论
    `semangat`，而苏哈托则强调用于国家发展的 `semangat`。从主题上讲，正是这种 `semangat` 被不断召唤，以使人们融为一体。统治者是指挥家，将
    `semangat` 转化为行动和盛会。由于城镇和城市很可能是统治者展示其 `semangat` 的舞台，因此它们的建筑表达和特征必然植根于与那些统治时期相关的时代。


    在群岛的沿海居民中，`semangat`是通过 `jamu laut`（款待海洋）仪式从海洋中仪式性地汲取的。在爪哇传统中，`semangat` 被构想 `kesekten`（内涵、本质和魅力）意义上的
    `isi`。`semangat` 在城镇日常生活中的表达，成为了一种精神上的激励信条，提醒公民他们的认同（`Forschee 2006, p. 85`）。统一在
    `semangat` 中使统治者能够举行他们的盛宴。所有的建筑努力和资源必须在 `semangat` 的框架内动员，以实现其活动。


    纪念性建筑、摩天大楼和高端设施是 `semangat` 的载体（`wahana`），用于在各种国家活动中验证统治者的魅力。苏加诺和苏哈托作为 `pemimpin
    besar revolusi`（革命伟大领）和 `bapak pembangunan`（建设之父）建立了他们的魅力。正如过去的统治者所做的那样，印度尼西亚第一、二任总统赋予了自己独特的
    `semangat`，这种精神被视为他们的他们的启示。因此，印度尼西亚城镇和城市的形象可能不仅仅简单地与其建筑和公园的历史剪贴相关联。相反，这里的城市形象与现任统治者融入建成环境的现今
    `semangat` 是不可分的。因此，在大多数情况下，更新为当代性比保留和维持过去的纪念性内容更具优越。


    建成环境的变化和变革可能不是正式合法化体系的主体。相反，在印度尼西亚，它们是与在位统治者持有的 `semangat` 关联和和谐的主体。将 `semangat`
    纳入日常政治的形式是意识形态。尽管有多个版本，从苏加诺到苏西洛·班班·尤多，印度尼西亚统治者都在苦行主义的国家哲学（`pancasila`）框架内行使他们的
    `semangat`。尽管在苏哈托倒台后，政治团体为了修正 1945 年宪法发起了理性运动，但可能没有什么会改变其国家意识形态（`pancasila`）。2003
    年印度尼西亚政治的最新发展向我们展示了更有说服力的证据，即通过新设立的国家机构 `mahkah konstitusi`（宪法院）保护宪法和国家意识形态。


    尽管爪哇或印度尼西亚文化中的权力并非抽象的公式（`Anderson 2007, p. 5`），但神秘和秘密属于其基础。其目的显而易见，深根于统治者崇拜的传统。然而，建立中心不仅仅是为了为人口和权力的集中建立定居点。相反，建立中心是设立发生的场所，让统治者在那里能够动员人们前往
    `alun-alun`（广场）。建立中心既不是合法性也不是权威的问题。统治的能力是为了为了自身而动员人们的能力：自我修养。印度尼西亚统治者的问题似乎不仅仅是对最佳想法或计划的竞争。相反，统治者通常拥有一个统一的思想（`semangat`），通过具有魅力的吸引力统一人们。修辞和微妙的残忍在历史上是这种意图方法的一部分。如果没有这些能力，他们将很快被遗忘，而没有留下实质性的、令人难忘的遗产。


    ## 结语


    为了理解爪哇城镇和国家，有必要在爪哇宇宙论的背景下讨论 `kuta negara` 概念。因此，权力被视为统治者赋予的光芒，表现为个人魅力和精神崇畏。从这个意义上说，这种光芒不仅包含在统治者的领导能力中，还被赋予实现成功成就的勇气和坚持。强大的成就不是关乎正义、合法性和法律层面的对错。它确切地说是关于恢复秩序和和平的能力。一个强大的统治者是那些能够在关键时刻，将世界从混乱和瓦解中恢复出来的人。


    权力与领土的关系类比于光源及其在地面上的光。光越亮越强，其权力的影响就越大越广。光的灵活性不仅仅是为了物理和政治统治的扩张，它在某种程度上是精神性的。首先，它是关于一个灯泡的想法，将一切都置于其光芒之下。与西方可测量、可负责且具实物参考的空间和领土观念相反，爪哇的领域和边界概念在空间上具有某种象征意义和灵活性。爪哇意义上的领土不是具有物理边界的区域划分问题。相反，它是统治者精神和宇宙影响的构想弹性区域。魅力、政治魅力以及精神吸引力在空间影响概念中起着至关重要的作用。由于
    `negara` 的意图是权力的盛宴，将城市作为永久结构建造可能不符合统治者崇拜的利益。永久结构不支持一生一次宏大表演的灵活需求。


    ## 第四章


    ### 爪哇的生活方式


    在爪哇文化中生活是什么？本章试图寻找爪哇传统中普通生活的意义。本章基于作者作为爪哇人的个人生活经历，以及对爪哇文化和传统的文学研究。本章的重点是理解日常生活中概念与现象之间的关系。本章将展开并考察局部概念，以寻找它们与其他概念的关系，即揭示并拆解爪哇对于其家园感的价值和意义。在此过程中，文化地方性不仅是事件发生的场所，也是决定和制定生活方式的结构和资源。


    ### 作为行走的生活


