  raw: 'Nonetheless, the integration of former wanuas into a negara meant that the
    village egalitarian way of life was gradually dissolved by a bureaucratic system
    of feudal polity. Evidently, it was impossible without a concentration and consolidation
    of power within the aristocrat group. The dissolution was also the cause of the
    weakening egalitarian assembly of the elders (karaman), meanwhile it was also
    the formative time for the more sophisticated agrarian landlord system in the
    Javanese society.


    As a matter of fact, the adoption of Indic statecraft was subsequently not only
    a transformation of the title of wanua chieftain from raka or rakryan to dhatu
    or ratu, but also the shift of the role and function of leadership from the chief
    of community to the political leader of society. This implies a development of
    social status and stratification and more diversity in occupations and hierarchical
    chain of command. This early formative phase of state could have also been followed
    by the emergence of a hierarchically centralized system of negara.


    The inscriptions in Central and East Java (Lokapala, Mantyasih, Wanua Tengah,
    and Sugih Manek) from the late ninth century further brought up the appearance
    of freeholds of settlement beyond desa called wateg, which was politically at
    the same level as the status of desa. The status of such a freehold had been traditionally
    granted by a ruler as political tactics to embrace other landlords without violent
    conquest. With such a good will, a ruler was in a position to gain loyalty and
    diminish potential rivals. High- and low-rank royal officers (samgat, pamgat,
    and mangilala drawya haji) and some chieftains enjoyed a tax exemption as well.
