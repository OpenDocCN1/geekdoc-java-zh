  trans: '


    在城市语境下，街区实际上是一个被称为`lungguhan`的领域系统，由道路（`marga negara`）划分。主路（`marga hutama`）作为通往广场（`alun-alun`）的接入道路。在雅加加达之前，尚未实施过长距离轴线道路。之前的爪哇城镇没有这种空间轴线。道路的主要功能大多是经济性的，将首府与`lungguh`领域连接起来，从农村和偏远地区到首府（`kuta
    praja`）和城市（`kuta negara`）。自 1830 年以来，荷兰殖民统治在爪哇岛强迫实行了耕作制度。从那时直到 1850 年，大多数来自`desa
    wanua`或`desa lungguh`的村民除了向当地统治者缴纳常规税收（`pajeg`）和贡品（`pupundhutan`）外，还必须向殖民政权缴纳税收和商品。


    # 国家仪式


    宫殿整体并没有展现出比其`grebeg`等仪式和典场合更特别的东西。仪式每年举行三次：先知穆罕德的生日（`grebeg maulud`）、开斋节（`grebeg
    sawal`）和宰牲节（`grebeg besar`）。国王及其家人将坐在他`kedaton`中的 ponconity 大厅里，等待`grebeg`的开始。当一切就绪后，他将移动到`siti
    hinggil`区域的`witana`起源、源、天座）大厅。人们向他们的统治者致敬正是在这个区域。在`grebeg`仪式期间，所有的厅和建筑都充满了生机，被各种活动占据着。准备聚餐的食物在`kamadungan`区域进行。这是中央厨房所在的区域：西边的`gebulen`和东边的`sekulagen`。这两者在象征意义上都代表了中心从出生到死亡的产生力量。


    `kamagangan`区域的活动由皇室年轻成员和皇室官员主导。色彩丰富的服装和装束是他们舞蹈和仪式表演的一部分。他们代表了中心的新兴一代，维持着`negara`的荣耀与辉煌。`grebeg`仪式聚集了来自宫墙内外（`beteng`）每个分区组的所有皇室成员。从仪式上说，`grebeg`仪式的概念是在
    16 世纪由 Sunan Kalijaga 和其他`Wali Sanga`成员在如德马马克、库杜斯、泗水和真哲帕拉等伊斯兰王国的不同地点引入的。德马克的`grebeg
    besar`被纪念为 Raden Patah（1478–1518）于 1503 年就任德马马克王国的第一任苏丹。然而，`grebeg`仪式的盛大表演是由马塔兰苏丹国的
    Agung Hanyokrokusumo（1613–1645）发起并创作的；`gerebeg`仪式和节日被 Agung 用于将伊斯兰历法的新年与爪哇历相结合。


    在印尼和爪哇语语境下，`Negara`被恰地理解为一个宇宙概念，而不仅仅是一个世俗的政治机构概念。`Negara`或`negari`是宇宙秩序的源头。它是通过使用极其礼貌的举止和语言来致敬和尊重的目的地。爪哇意义上的城市性对于与统治者、宫廷（`kraton`或`istana`）以及`negara`相关的仪式和活动是必不可少的。它与定居点的集中和公共服务机构没有直接关系。`negara`背景下的大多数机构都是为了国家仪式和典礼。`negara`的核心目的是执行一场盛大的活动，唤起并重新验证不同存在层次和形式下二元对立的宇宙统一性。事实上，`negara`的结构是为了日常国家事务的，但其整个业务流程是为了预测和庆祝被称为`grebeg`或`keduri`的宇宙重生。


    从 Kahuripan 的`Airlangga`、满者伯石的`Raden Wijaya`、德马克的`Jaka Tingkir`、Singasari 的`Ken
    Arok`、马塔兰的`Panembahan Senapati`和`Agung Hanyokrokusumo`，到现代印尼的`Sukarno`和`Suharto`，爪哇统治历史告诉我们能够恢复世界秩序的人的重要性。在大多数情况下，这既不是合法性也不是法律有效性的问题。相反，成功的统治候选人必须是一个具有强大意志力或叛逆者。一个顺风的候选人对于爪哇理想来说是一个看似虚弱的领导者。


    尽管有时残暴、残酷且无情，但一个拯救者、解放者或恢复者比世袭者更受青睐。爪哇谚`jer basuki mawa beya`证实了任何值得和更好的事物都在克服危险或危机之后出现。爪哇世界的拯救者和英雄不会根据他们上权之前的历史传记数据来判断。重要的是获取并赢得引导通往宇宙秩序成功恢复的时刻。他的崇拜神话就始于那些时刻。印度尼西亚共和国独立宣言的时刻是`Sukarno`的神话，也是`Suharto`充满争议的`Supersemar`（1967
    年 3 月 11 日的总统指示）的时刻。爪哇统治者努力将这些时刻纪念碑化，并试图通过建造`prasasti`（纪念碑文）和`tugu`（纪念碑））来说服自己。`Suharto`为了他在雅加达的早期成就建立了纪念碑：`Yogya
    Kembali`（1985）和`Serangan 1 Maret`（1974）。通过这种方式，`Suharto`在他印尼军事和政治体系的职业早期就植入了自己作为国家英雄和拯救者的存在。


    # 现代城市国家与过去的神话


    `Kota`是爪哇语`kuta`的印尼语词。通常`Kota`是一个具有特定地位的政治定居机构。过去的建筑和场所受到与当代统治者之间可能调整的关系和承诺的影响。见证这一事实并不意外：市（`walikota`）的意味着其象征中心、主大道、权威和机构（`alun-alun`、清真寺、市场等）可能的转型，而公民（`warga`）并不是国家事件的被动观众。相反，城市居民既是观众又是表演者，参与了景观的制作。当`negara`框架内的家概念在各种愉快的聚会（`kenduri`）中得到性表演时，国家场合是非常生动的景观。毕竟，如果统治者由于疲劳和力竭而无法维持`semangat`，这也是混沌、无政府、动荡和无序产生的时刻。那时，新的统治者正等待着新的`semangat`来象征宇宙重生的召唤。每个时代（`jaman`）可能都有自己的统治者（`penguasanya`）和自己的`semangat`。而每个统治者都有自己的舞台、自己的故事和表演。


