- fmt: '

    In this chapter, political culture is understood as a system of concepts, symbols,
    values, customs, manners, behaviors, and frameworks on public decisions, policies,
    and actions (Fagen 1969). So far, the regimes in Indonesia have utilized and legitimized
    political culture over their nation and society in order to establish, maintain,
    and sustain their status quo (Pye and Verba 1972). As a cultural system, political
    culture is historically developed, elaborated, enhanced, adjusted, and modified
    in favor and in support of the current circumstances of regime and society. Political
    culture is probably an effective approach in analyzing and in understanding politics
    and the behaviors of power (Bryder 1989; Solomon 1971, p. 8).


    Since the values of politics are indispensable from local culture and tradition,
    in order to understand the contemporary development of Indonesia, it is argued
    that such transformations, toward a civil society based on social justice, are
    only possible if they involve the whole members of society. As a matter of fact,
    the current democratic process only takes place for public elections, but it does
    not go any further and deeper into the practice of governmentality for an open
    society.


    Theoretically, political culture is a relatively permanent framework. It upholds
    and sustains the principles, ideals, and essential values of state and nation.
    This implies that the radical change of political culture is unlikely to happen,
    which is considered an uprooting process of the current concept and actuality
    of the state and nation as a whole. Although in the era of reformasi some new
    institutions and procedures for democratic governance have been installed and
    implemented, the historical roots of political culture are still preeminent in
    daily political practice because they are well preserved and conserved by `bahasa
    Indonesia` and `Javanese` manners as the basic structure of power relations.


    Nevertheless, political culture has something essential in incorporating the ideals
    of collective consciousness that underlies the existential structure of the institutions
    and relations of a state and nation. Accordingly, changes and transformations
    of political culture are not only determined by the persons in the status quo,
    but also by the elites of Indonesian society. They are mostly still comfortable
    with the old practice and values of fatherly patronage, pride, and prophecy; all
    these become the structures of patrimonial political culture in Indonesia.


    Undeniably, patrimonial power is more than just authority and hegemony. Rather,
    it comprises all ability to create and do everything, which is exercised as the
    will and effort to move the world according to patrimonial preferences, such as
    top-down operative, collectivist, conformist, and loyal. Since the meanings of
    the world are preserved with the local language, the reformation of political
    culture necessitates the transformation of its language of power in terms of spoken
    language and gestures. Indonesian spoken language in this case is, in some ways,
    interpersonally egalitarian, grammatically tolerant for errors, biases, and tenselessness;
    this language is more supportive for democratic communication. However, communicative
    gestures of manner and behavior speak louder than spoken language concerning the
    patrimonial values system. To a certain extent, `Javanese` concepts and expressions
    are used to underscore the patrimonial tones in the context of appropriateness
    and acceptability. Even though the `Javanese` language is not the official language,
    the `Javanese` feudalistic and hierarchical manners and comportments fit well
    with the state codes of bureaucratic governance. For centuries, the `Javanese`
    political culture has disseminated into the state bureaucracy of modern Indonesia
    since its early conception in `1945`. Furthermore, in the predominant `Javanese`
    populations, the Indonesian language as lingua franca has already been molded
    and adjusted with feudalistic, hierarchical, bureaucratic, and patronage culture.
    As a matter of fact, the locality of language is not merely a communicative medium
    of political culture. Rather, the source of values and meanings distinguish a
    cultural geography from another place.


    Since culture is a resourceful system of values and ideals, all citizens collectively
    share the values and ideals of political culture; it is an integrated part of
    state ideology and national interest. Therefore, the necessity for political culture
    is obviously useful for the establishment of regime and nation as a whole. Since
    political culture is an outcome of the historical development and evolution of
    a nation, its function is not only philosophically referential, but also pragmatically
    directive in dealing with the business of power and state politics. Even though
    in many ways power and culture might be interchangeable in establishing the ruling
    mainstream, the ideological coalition of both is probably the most effective force
    and system for any political program.


    Political culture is perhaps only workable because of its collectively shared
    vision and notion. In order to have such a vision, the regime will take a lead
    either by oppressive method or through a democratic process. The problem of shaping
    and establishing a new political culture lies in its elites and mainstream, whether
    they are willingly and at the capacity to retrospect, to redefine, to reorganize,
    or to reevaluate their system and business or not. Since democratic political
    culture is ideologically not compatible with paternalism, its practice is not
    likely desirable. In addition, the mainstream of political elites is still comfortable
    with the traditional patronage of `priyayis` over the `rakyat`. In many ways,
    reformation in this country is challenging for its ideals and programs in shaping
    a civil society based on democracy and social justice.


    ## The Javanese Political Culture


    There are some impediments that are able to decelerate and discourage the process
    of democratization in Indonesian politics. All this is likely related to the concept
    of power, by which most decision making for the whole nation and state is done.
    First, the concept of power in the archipelago is deeply rooted in the paternalistic
    patronage (`perwalian kebapakan`) of traditional communities and societies. Politically,
    patrimonial culture has been embodied in the prehistoric village polity of `wanua`
    (van Naerssen and de Iongh 1977, p. 37). Paternalistic patronage is not only a
    matter of values through education and socialization since early childhood, but
    also an issue of societal way of life based on the dichotomy of leader (`panutan`)
    and follower (`pengikut`). Since paternalistic tradition has been part of Indonesian
    political culture, strong leadership is important and mandatory by which building
    a shared vision and a collective mobilization is made possible. The tool for such
    a vision is a political credo or rhetorical slogan (`semboyan`), which incorporates
    a thematic spirit for movement called `semangat`. The `semangat` is the content
    of any political movement and leadership. Without this, political leaders or organizations
    do not have a substantial motivation.


    Hitherto, the mainstream `Javanese` population and Indonesian society has held
    and sustained a monolithic system of paternalistic tradition, which is essentially
    feudal and patron-client oriented. The attitude toward paternalism is demonstrated
    with a loyalty to the status quo as long as it gives them the sense of peace physically
    and spiritually (`pengayoman`). The sense of `pengayoman` lies in the ruling power’s
    capacity to give a security and stability for their daily activities. The root
    of the Javanese word `pengayoman` is `ayom` or `ayem`, literally meaning being
    protected for peaceful mind and unitary harmony. The paternalistic leader is supposed
    to be a protector and provider of harmony and unity for the people. Failing to
    give such conditions costs the power of their pride (`wibawa`) as a leader.

