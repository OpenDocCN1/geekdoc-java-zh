    # 印度尼西亚的改革与政治稳定


    改革最重要的议程是建立政治和经济稳定。在印尼语中，“稳定”被理解为 `mantap`，字面意思是永久的、坚固的、一致的、令人信服的、稳定的和强大的。这种稳定性被地视为普通人在街道日常生活的实际衡量标准。政府及其机构可能会发生，但如果无法实现政治稳定，国家和民族将处于危险之中。事实上，经济的改善和正义取决于这种稳定。在爪哇语和印尼语传统中，这种政治稳定在表面上被理解为
    `stabilitas nasional`（国家稳定）。稳定概念的深层结构在于`kuasa`或`kekuasaan`（权力）的概念。从权力角度来看，国家和民族始终是现状的首要关注点。`Berkuasa`意味着指挥、支配和控制国家、民族及其资源，使其免受危险。也就是说，民族和国家不处于不洁状态。


    ## 改革的政治


    事实上，`reformasi`的实际政治是对此前的政治文化进行激进的变革。尽管法律主权和民主化的紧迫性在改革议程中，但普通人并不认为两者是优先事项。1999
    年、2004 年、2009 年和 2014 年四次公开选举的结果告诉我们，在处理经济恢复、失业和贫困之前，对政治稳定的期望仍然很高。为了这种稳定，需要强有领导力。`Suharto`（1967–1998）领导的新秩序成功地将爪哇政治文化整合到印尼政治体系中，秩序、稳定和增长是国家完整和认同的必要条件。政治混乱或无序，例如`Suharto`统治末期和`Wahid`任期内的危机，被视为世界将重新恢复秩序与和谐的拯救过程。这些救世主式的信念不仅被爪哇人所共有，也被印尼群岛的大多数人所共有（Kroef
    1959）。`Wahid`的弹劾以及`Megawati`连任的失败尝试，直到 2014 年`Joko Widodo`的当选，证实了国家稳定的救世主式的这种政治文化仍然存在。因此，人们去投票是希望出现`satria
    piningit`（隐秘的骑士）或`Ratu Adil`（正义之王），作为拯救国家民族免于混乱和麻烦的人（Geels 1997, p. 75; Choy 1999,
    p. 127; Sindhunata 1999, pp. 20, 84, 85）。


    ## 家与居所的概念


    政治稳定是从印尼文化和传统中关于家和居所作为坐席的概念中学到的教训。保持稳定（`mapan`）规定为拥有座位或职业（`kedukukan`）的状态；用`penduduk`（居民）来称呼公民并不奇怪，因为“坐”或`duduk`不仅是一种停留的身体姿势。在文化上，它是拥有具有社会尊重地位之家的标志。对于印尼文化来说，政治稳定是一种存在状态，因为它为人们的福祉提供了一个安全的环境。


    此外，对于爪哇统治者来说，拥有座位（`kedudukan`）既不是公共服务也不是社会责任，而仅仅是为了在其王国建立稳定和秩序的强有力职位和职业。`Sukarno`和`Suharto`可能是现代印尼领导人中最好的例子，他们认识到与权力相关的座位感。`Suharto`维持了其近三十年的执政记录，是因为他知道权力等同于维护王国秩序和稳定的权威；无论付出任何代价和采取任何手段。与之前提到的两个前任不同，`Sukarno`、`Suharto`、`Wahid`、`Megawati`、`Yudhoyono`和`Joko
    Widodo`确实知道`kedudukan`的意思，因此他们不仅是世俗领导人，还是精神事务的总司令。爪哇领导层应当主张他们作为传统统治者的地位，在宇宙领域和现实层面上重视国家和民族的稳定、统一和秩序。


    ## 连续性与庇护


    无论谁担任印尼总统，他/她都会强调连续性作为稳定的标志。尽管他/她是唯一愿景更好印尼的领导者，但他/她确实相信世界处于完美和谐的结局；任何危机和混乱只是为了提醒人们有救赎和拯救的时间。爪哇领袖几乎不在日常生活中采纳和接受平等和民主的生活方式：应该存在一个宗法秩序的体系。只有在这样的系统中，和谐世界的金字塔结构在宇宙学上才是有序和和谐的。从`Sukarno`到`Joko
    Widodo`，爪哇领导人在国家演说和官方演讲中自如使用预言语言，用`saudara`（兄弟）或`saudari`（姐妹）等词称呼听众，这些词听起来带有从属含义。此外，他们从不习惯在没有“Sir”或`pak`或`bapak`等头衔的情况下直呼其名。


    在印尼，一个人如果没有座位的权力（`kedudukan`），就不是一个人。根据庇护、自豪和预言的政治文化，他/她在名字之前被称为`bapak`（父亲）或`ibu`（母亲）的前缀。在自豪、庇护和预言的语言中，普通人就像未知支持者的海洋，尽管他们会被称为兄弟（`saudara-saudara`）或姐妹（`saudari-saudari`）。从语言角度来看，印尼民主社会是改革的一项挑战性目标。


    ## 改革的现代愿景


    意乎不意外，`Yudhoyono`（2004–2014）和`Joko Widodo`（2014–）在其政党的使命和愿景中包含了`semangat reformasi`（改革精神），这种精神实际上是指引导回到
    1945 年宪法所宣布的统一国家和民族的原始形态（印尼民主党，未注明日期）。因此，`reformasi`既不被理解为改变或转型，而是更新——从调整和重新验证的角度来看——以及从殖民时代直到今天的印尼奋斗的持续。1945
    年宪法中的国家理念是整合主义的。`Supomo`——根据他对印尼各族习惯法的专业知识起草宪法的人之一——认为有必要根据家庭原则（`azas kekeluargaan`）来实现统一和和谐（Bourchier
    2015, p. 220），这是一种通过协商达成共识的、整合主义和全权主义的。政府与被统治者之间的关系就像父子，也就是说，本质上是家长制的（Silalahi
    2003, pp. 139–40）。换句话说，根据 1945 年宪法，印尼国家被构想为一个由不同民族组成的大家庭，他们重视全体人民的统一与和谐而非个人人权。此外，宪法中的民主是带有关于代表智慧的条件的。值得注意的是，这里的“智慧”一词为当地礼仪和价值观留了空间。


