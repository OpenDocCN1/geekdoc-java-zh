  trans: '

    场地清理工作确定了三个主要区域的开放空间：清真寺区域（`masjid hageng`）、广场（`alun-alun`）和皇宫（`kedaton`）。这三个核心组成部分必须建立在明确边界边界。广场用一排大榕树标记，而皇宫和清真寺区域则通过墙基进行勾勒。类似的领域层级也适用于清真寺和皇宫建筑群。它们主要分为三个层级——`purwa`（初级）、`madya`（中级）和`hutama`（高级）——对应于领地的深度。最内层区域的特征是最高密度的聚会类别，以及目的地或停留地。初级区域实际上是所有访客的接待区，而第二和第三区域则是通往目标仪式的精炼过程。皇宫与寺庙区域的界面就是广场
    `alun-alun`。


    从最高点出发，发展轴线分别向北方和南方延伸。这样做使得从北侧的最高点可以清晰地望向默皮火山（Mount Merapi）。在南方，最高地可以俯瞰南方的山区。在南北最高点的中间部分，有一条代表东西方向的虚拟轴线。


    建设继续，在南方和北方建立了广场（`alun-alun`）。双大榕树被植于南北两个广场的中心区域。在北方，皇宫中心线与清真寺中心线的交汇处是双大榕树之间的区域。关于双大榕树是否取代了双
    `dvarapala`（门神）尚存在疑问。种植双大榕树是为了守护 `kraton`（皇宫）。这种情况在绝大多数佛教寺庙中都很常见（Malalasekera
    1990, p. 53）。双尊守护神面目威严，保护着寺庙的内部空间。在这种情况下，`Kraton` 或 `dalem` 被构视为寺庙建筑群。双大榕树不仅安置在皇宫南方，也为了守护北方的
    `kraton`。大榕树立于南北广场内，作为 `kuta negara`（国家中心）最内层的精神守护者。


    最内层区域实际上是国王及其家人居住的地方。皇宫内部分为四个区域或复合：`siti hinggil`（高台）、`kemandungan`（生育区）、`kemagangan`（候选/学徒区）和
    `jengkar dalem`。这四个区域具有特定的功能和象征意义。每个区域都设有大厅（`bangsal`）和建筑（`gedong`），用于仪式和功能目的。区域之间的连接在建筑上通过大门（`regol`）体现。国王的住所是
    `jengkar dalem`，字面意思是“内在自我”。整个 `jengkar dalem` 区域及其建筑被称为 `kedaton`（皇宫）。


    ## 地主制度与税收


    经济上，爪哇王国依赖土地耕作及其税收。土地所有权由国王授予其 `kraton` 之外的家族或贵族（`praja/priyayi`）；这种针对农业定居点的税被称为
    `lungguh`（Onghokam 2003, p. 172; Headley 2004, p. 164; Schriecke 1955）。在皇宫墙内，土地由国王直接控制，被称为
    `siti daleman`。这是国王居住及其仪式支持者（从音乐家到士兵）的土地。这片土地闻名为 `bumi narawita`，字面意思是“为了国王存在的土地”。由贵族管理的土地单位通常用于他们的席位。`lungguh`
    土地实际上是国王的直接领土（`negara agung`），由其代表并借给具有 `anggadah` 身份的人员或亲属，字面意思是“假装拥有”。作为回报，他们需要定期缴纳税收和贡赋。传统的贡赋是通过拜访国王参加国家仪式和典礼来表达忠诚。


    绝大多数 `lungguh` 土地在地的主不再担任国家官员的情况下可能会被国王收回。然而，在许多情况下，只要向国王缴纳财产税和贡赋，土地就可以世代租赁。他们与国王关系的远近决定了
    `lungguh` 土地的面积。首相（`patih`）获得最大的 `lungguh` 土地，其次是其他大臣和县令。如前所述，`lungguh` 土地是主的席位，但如果不在首都或位于农村地区，土地将托付给被称为
    `bekel` 的人。在 `bekel` 的管理下，`bekel` 耕作土地用于农业（`sawah`，`tegalan`）或出租土地用于其他用途，如商店、房屋或其他生产设施。为了耕作土地，`bekel`
    雇佣平民/农民作为工人被称为 `nara karya`，他们通常被允许以租赁的方式住在 `lungguh` 土地上并家中。然后，`lungguh` 土地被分为若干部分被称为
    `cacah` 的单位。每个 `cacah` 由一组五到二十五户农民组成耕种。`cacah` 的负责人向 `bekel` 汇报土地的产量和耕作情况。


    `bekel` 的功能是尽可能高效地利用土地，以便 `bekel` 能够向地主缴纳财产税。根据面积（以 `jung` 和 `karya` 为单位，1.428
    公顷），`lunguh` 土地需要缴纳税收或贡赋。税收员 `patuh` 实际上是官员（Miyazaki 1988, p. 30; Nakamura 2012,
    p. 21），为国王或贵族工作。他的工作是按照规定的比例为国王和地主征收税收。当然，税收制度的最底层是没有土地权利的农民。他们必须为 `bekel` 工作并向
    `patuh` 缴纳耕作税。此外，他们必须自愿维护道路（`marga desa`）、水坝和灌溉系统（`bendungan`）、桥梁（`kreteg`）、担任社区巡逻（`ronda`），并在紧急情况下（`gugur
    gunung`）。


    在农村地区，`bekel` 是王权的延伸，也是社区定居点的首领。作为一种社会经济政治制度，`desa lungguh` 是农村环境中的微型国家，`bekel`
    是最高职位。他由负责特定事务的人协助。然而，农村社区的政治结构比 `kuta negara` 或 `kuta praja` 等级较低且更加平等。经济上，`desa
    lungguh` 是基于 `sawah` 耕作的农业定居点。

    '
- fmt: '

    In the urban context, city blocks are actually a system of domains called `lungguhan`,
    which are divided by roads (`marga negara`). The main road (`marga hutama`) acts
    as the access road to the city square (`alun-alun`). Prior to Yogyakarta, a long
    axial road had not been implemented. Previous Javanese towns did not have such
    spatial axes. The main function of roads is mostly economic in connecting the
    capital city to the domains of `lungguh`, from rural and remote areas to capital
    towns (`kuta praja`) and cities (`kuta negara`). Since 1830, the Dutch colonial
    rule forced a cultivation system in Java. From then until 1850, most villagers
    either from `desa wanua` or from `desa lungguh` had to pay taxed and commodities
    to the colonial regime in addition to their routine tax (`pajeg`) and tribute
    (`pupundhutan`) to their local ruler.


    # State Ceremony


    The palace as a whole does not show something more special than its ritual and
    ceremonial occasions such as `grebeg`. The ceremony takes place three times per
    year: the birthday of the Prophet Muhammad (`grebeg maulud`), the `ed Fitri` (`grebeg
    sawal`), and the `Ied Adha` (`grebeg besar`). The king and his family will sit
    in the hall of ponconity in his `kedaton`, waiting for the commencement of the
    `grebeg`. When everything is ready, he moves to the hall of `witana` (origin,
    source, heavenly seat) in the `siti hinggil` zone. It is this zone where the people
    pay homage to their ruler. During the `grebeg` ceremony, all halls and buildings
    are lively, occupied by various activities. Preparing foods for communal meals
    takes place in the `kamadungan` zone. It is the zone where the central kitchens
    are located: `gebulen` in the west and `sekulagen` in the east. Both symbolically
    represent the engendering power of center from birth to death.


    The activities in the zone of `kamagangan` are dominated by youth members of the
    royal family and royal officers. Colorful costumes and attire are part of their
    dance and ceremonial performances. They represent the emerging generation of the
    center that sustains `negara`’s glory and splendor. The ritual and ceremony of
    `grebeg` gathers all royal components from every zoning group inside and outside
    the palace wall (`beteng`). Ceremonially, the conception of `grebeg` ceremony
    had been introduced by Sunan Kalijaga and other members of `Wali Sanga` in various
    places of Islamic kingdoms such as Demak, Kudus, Surabaya, and Jepara in the sixteenth
    century. The Demak’s `grebeg besar` has been commemorated as the inauguration
    of Raden Patah (1478–1518) as the first sultan of the Demak kingdom in 1503. However,
    the grand performance of `grebeg` ceremony was initiated and composed by Sultan
    Agung Hanyokrokusumo of the Mataram Sultanate (1613–1645); the ceremony and festival
    of `gerebeg` had been used by Sultan Agung to integrate the new year of the Islamic
    calendar system with the Javanese almanac.


    `Negara` in the Indonesian and Javanese context is appropriately understood as
    a cosmological concept instead of merely a secular notion of political institution.
    `Negara` or `negari` is the source of the cosmic order. It is the destination
    of paying homage and respect demonstrated with the use of highly courteous manners
    and language. Urbanity in the Javanese sense is indispensable from the rituals
    and ceremonies associated with the ruler, court (`kraton` or `istana`), and `negara`.
    It has nothing to do directly with the concentration of settlement and public
    service institutions. Most of institutions in the context of `negara` are for
    state ritual and ceremonies. The central purpose of `negara` is to perform a splendor
    occasion that invokes and revalidates the cosmological unity of dualistic antagonism
    at various levels and forms of existence. Indeed, the structure of `negara` is
    for day-to-day state business, but its entire course of business is to anticipate
    and celebrate the rebirth of the cosmos called `grebeg` or `keduri`.


