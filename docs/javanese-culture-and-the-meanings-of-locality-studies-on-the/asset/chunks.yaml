  trans: '


    自五世纪以来，在该群岛上出现了数百甚至数千个 `negara`（国家/政权）的兴衰。其中大多数没有留下物理痕迹，例如 `Pakuan`、`Padjajaran`、`Galuh`、`Medang`、`Blambangan`、早期马达腊和
    `Kahuripan`。它们过去的存在在文字证据几乎鲜为人知。碑文（`prasasti`）、传说（`dongeng`）、史纪（`babad`）以及少数纪念碑（`petilasan`）大多带有偏见，因为它们不可避免支持现状。


    确实，`negara`这一制度在东南亚经验或更具体的马来-印尼语境之外的任何其他语言中都是无法翻译的。源自梵语的借词 `negara` 经过爪哇和马来文化经验的转化和阐述，已不仅仅是宫殿、首都、城镇、国家或王国。克利福德·格尔茨（Clifford
    Geertz）在该词最广义的意义上完美地描述为城市支撑的文明以及以此为中心的政治隶从上层建筑（Geertz 1980, p. 4）。


    ## 早期城市化与 Negara 的兴起


    爪哇传统中 `negara` 的领域并非由物理性质或建筑标记，而是通过各种层级的语言实践，将其公民识别为 `krama`（敬语使用者）。显而易见的结构仅在
    `negara` 的最核心部分显现。`krama` 一词源自梵语，意为方式、方法、样式、步法、表演，在最广义上指公民，位于 `kadatwan`（贵族领地）范围内，那里使用宫廷语言
    `krama-inggil`。`negara` 的形成组成部分在物理上被指定为一个加固的方形区域，在梵语中称为 `in pura`，精英或统治阶级 `priyayi`、`pangreh
    praja`（地方官员）居住在此。在古爪哇语中，这种领域被称为 `jero` 或 `dalem`，意为内部空间、室内、核心、中心和自我。


    从考古事实来说，没有 `jero` 或 `dalem` 就没有 `negara`。`jero` 的概念是中心；它是地主的座所在地。从空间上讲，爪哇语境下的
    `negara` 始终是一个多层系统，`jero` 或 `dalem` 位于其最内中心。在许多情况下，`jero` 必须用围墙（`beteng penyengker`）进行加固。事实上，这样的墙在如今的
    `kratons`（皇宫）中仍然存在。它更多是为了象征意义而非防御。令人惊讶的是，很难找到 `negara` 外围的确定结构。尽管爪哇传统中的 `negara`
    首都（或者可能也包括从亚齐到梯多洛尔的其他印度尼西亚国家）没有任何确定外围和建筑边界的痕迹，但其核心在建筑上以一种名为 `jero`、`jeru`、`dalem`
    或 `kraton` 的加固围合结构的形式清晰可见。


    `negara` 的领域围绕着宫廷建立。这些区域沿着主路（`marga raya`）布局通往国家广场（`alun-alun`）。显而易见的围墙（`mbeteng`）不仅体现在
    `pura`、`kedaton` 或 `kraton` 中，也出现在一些国家官员居住的领地（`lungguh`）中。`Kedatwan` 或领地位于城堡（`pura`）所在地。与
    `kedatuan` 另一个等效名称是 `kajeruan`，源自 `jero`，意为 `negara` 的核心部分。尽管含义相似，但在大多数马来语地区，`kajeruan`
    没有 `kedatuan` 常见。


    `kedatwan` 或 `kedatuan` 一词实际上源自古马来语 `datuk`，意为社区的首领/酋长或领主。因此，`kedatwan` 指的是首领的座。。在印度教和佛教传入之前，`Datu`
    是名为 `wanua` 的村落聚落的首领。奥斯尼西亚语的 `wanua` 是一个具有双重社会群体的世袭制社区——贵族阶层和平民。政治中心是由贵族领袖和长者组成的乡村委员会。`wanua`
    聚落的古代痕迹今天仍然存在，例如南尼亚的 `banua` 和松丹巴岛的 `kabisu`。


    在印度文化和文明的影响下，首领一定将社区融入了须鲁山的金字塔宇宙模型，并以自身为顶点。权力和权威的集中性通过 `Siva`（湿婆）和 `Wisnu`（毗湿奴）崇拜体现。没有这种崇拜，统治者在形而上学上并不神秘神圣，无法与他的贵族圈和普通人分开。随后，秘密、正式和克制通过仪式和典礼建立了
    `devaraja`（神王）崇拜，神秘了他的自我愉悦和自封的神性光辉。


    尽管 `kedatwan` 或 `kedaton` 概念的发展在古村落 `wanua` 范围内展开，但爪哇和马来政治对梵语的采用非常具有选择性。在五世纪到十世纪之前，他们没有使用源自
    `raja`（国王）的印度版本。然而，表示“国家”概念的印度式 `negara` 保留了梵语，尽管其含义已根据当地情况进行了调整和阐述。在卡胡里潘的 `Airlangga`
    统治之前，统治者的住所已明显从马来语 `kedatuan` 或 `kedaton` 转化为爪哇语的 `kraton`，而含义没有改变。从那时起，统治者的住所不再被称为
    `pura`。


    爪哇传统中，作为统治者座席中心的 `pura` 似乎被翻译成了 `kraton`。这一概念的转化一定发生在爪哇文化和传统开始将各种印度文化和文学翻译成自己语言的时期。国王们如
    `Dharmawangsa`、`Airlangga` 和 `Jayabaya` 在爪哇文化中广为人知，是这种印度-爪哇文化融合的发者。今天，有几个爪哇城市仍然保留着领地的名称，并指示着相应的
    `kraton` 区域，尽管它们的宫殿早已消失，如 `Kediri`、`Jepara`、`Demak`、`Plered`、`Kotagede` 和 `Kartasura`。


    ## Mancapat 作为中心的空间框架


    从印度国家传统中，爪哇的 `negara` 学了在转轮者（`cakravartin`）背景下应用 `mandala`（曼陀罗）概念。爪哇名为 `thani`
    的农民村联盟概念及其 `mancapat` 方案的起源，推测一定源自印度的转轮者 `mandala`。除了其神秘主义之外，`mandala` 可能被用于应对干旱、饥荒和旱季（`paceklik`）时的农业生产和水资源管理。根据
    `mandala` 概念，村民被组成 `thani` 的协作聚落单位，每五天举行一次定期的市场。名为 `cara` 的习俗法和道德规范必须已经建立，用以稳定村民之间的和平与安全。


    `mandala` 在原始梵语中意为本质或内容。在 `kuta negara`（国家之城）中使用 `mandala` 是为了象征世俗与神圣之间的中介理念。这种象征的目的是为了带来一种神秘统一的体验，由此产生万千的形式和表象。印度教
    `mandala` 向爪哇文化的调适在 `mancapat` 概念中得到了阐述。字面上说，它是超越四个角和四个主方向（北、南、东、西）的领域概念。`mancapat`
    是天地之间的轴心。`manca` 意为超越或更远，而 `pat` 一词源自 `papat`或四。


