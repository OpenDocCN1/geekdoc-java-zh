    与此同时，爪哇社会的本土社会群体，以及其他奥斯罗尼语族的后裔，仍然保持着旧有的习俗形式。他们并没有立即接受印度的种姓阶层划分（`varna`）。事实上，婆罗门（`brahmins`）群体可能被他们接受为一个与贵族（`bhogi`或`priyayi`）相关的高度受尊群体。贵族需要宗教权威来使其权力的积累合法化。统治阶级赋予佛教和印度教僧侣特殊地位，作为对他们精神支持和治国知识的回报。作为，正如印度教和佛教教义所教的那样，统治阶级会在罗布
    udur（`Borobudur`）的`Karmawibangga`廊向穷人和`brahmana`或`bikhu`捐赠。


    ### 权力的巩固与地理


    在古代，权力的集中在多大程度上是可能的？从地理上来说，`Kedu`平原、`Dieng`高原、`Brantas`平原和马兰（`Malang`）地区（那里水稻种植最有利的地点）不同时期散布的碑文和纪念碑向我们展示了权力的巩固并非易事。过去的情况由陡峭崎岖的地形地以及茂密的热带森林所主导。地理背景证实了一个事实：古代统治者更多应该是共存的，而不是作为主宰的征服者和卓越的皇帝。如果没有寺院的支持，单一统治者下的权力巩固可能是不易实现的。在古代爪哇这样一个苦修者的世界里，统治者被视为强大的人，不仅是作为政治领袖，而且是精神上出凡的人。


    ![](img/Figure_2.5.jpg)


    图 2.5 8 世纪爪哇的市场（`peken`）场景，取自罗布 udur`Karmawibangga`廊。照片由 Rudi Badil 和 Katalis
    Publishing 提供（Badil 1989: 136）。


    ### 国家（Negara）的概念


    早期`negara`的国家概念在印度尼西亚岛的其他地区是如何发展的？它对城市化产生了什么影响？到目前为止，从 1 世纪到 5 世纪的东婆罗洲`Kutei`，关于`negara`的痕迹和碑文很难找到，但在西爪哇已经显现。位于波哥尔（Bogor）公元
    450 年用`Pallava`文字书写的四块`Ciaruteun`碑文证实了与国家思想相关的三个定居点概念：`negara`、`puri`和`sibira`。然而，`sibira`一词的意思是`pura`还是寺庙并不明显，甚至令人困惑。由于该概念在西爪洲`Purnawarman`铭文证据中使用可能与圣场所有关，这个词可能接近印尼语单词`vihara`或`biara`，意为寺院。尽管很难从考古发现勾勒出爪哇早期城镇的清晰画像，但`Purnawarman`碑文中提到的达鲁曼加拉（`Tarumanegara`）包含了印度`negara`概念的两个组成机构，即`stana`（统治者的宝座或宫殿）和`pura`（国家仪式的中心）。


    ### 城市机构与中心


    从词源上说，`sibira`并不是梵词；它可能的含义接近`pura`，而这对于`negara`的概念至关重要且具有决定性。`pura`字面意思是举行国家仪式和庆典的神圣之地。作为城市机构，`puri`和`ksetra`（`pura`的圣区）可能构成了中心的概念。尽管它们具有宗教重要性，但如果没有永久性市场的支撑，它们本质上不足以构成中心的概念。古代爪哇社会的本土市场不仅在经济上重要，而且作为古代爪哇生活的真实中心在文化上也具有重要意义，正如被埋藏的罗布
    udur`Karmawibhangga`浮雕所示。古代爪哇语中，市场的词是`p’ken`或`peken`，字面意思是聚集、互动、交换和汇聚。


    那么，如果不包含构成国家定居点的三个核心中心机构，`negara`的城镇和国家状态将是不可想象的：`pura`（举行国家仪式和庆典的地方）、`puri`（统治者的宝座）和`peken`（经济交换和社会化的场所）。尽管如此，住宅（`paumahan`）、国家机构（`sarana`）和它们的基础设施（`prasana`）同样重要。


    ### 社会准则与公正


    尽管在早期`negara`中，基础设施和领土的城市法律和准则没有得到妥善执行，但存在被称为`tata krama`的特殊准则和礼仪，用于`negara`核心的社交互动，如语言（`basa`）、服装（`busana`）和礼仪（`jawa`）。这些准则在村民或农村地区并不使用。根据
    804 年的`Mpu Ketudhara`碑文，违反准则和法律（`tata karma`）的后果由`sang tuhan`领导的法院（`pakaranan`）执行。然后，法院会授予公民身份（`warga
    negara`）的个人罚款和奖励。


    ![](img/Figure_2.6.jpg)


    图 2.6 在其`pura`中的统治者（`rakrya`），取自 7 至 8 世纪的罗布 udur`Karmawibangga`浮雕。戴头冠的大象和装饰华伞的形象是王权的象征，浮雕上刻有铭文`Cakrarvartin`。凭借他神圣的`Cakrarvartin`身份，统治者成功地将几个`negaras`统一在他的控制下。`Cakrarvartin`仪式由大祭司主持，被视为宇宙的诞生。照片由
    Rudi Badil 和 Katalis publishing 提供（Badil 1989: 89）。


    ### 古代爪哇的城市化


    三个中心（`pura-puri-peken`）的使用可能是古代爪哇建立城市化的基本需求。从 5 世纪以来，`negara`的焦点一直是`kraton`，即政治、文化和精神的中心。在中心之外，领地一直是`desa`的农业部分。因此，高密度定居对于古代爪哇并不是必要的，因为中心需要农产品、税收和贡品。此外，爪哇传统的权力集中并不等同于定居集中，因为从领土上看，`negaras`的防御系统分布在每个`desa`或`lguh`。


    定居点（`paumahan`）的概念主要与其居民的特殊职业或地主（`lguh`的`bhogi`）有关。由于在发现`Tarumanegara`碑文的地方缺乏考古挖掘，我们对古代城镇没有进一步的痕迹。除了铭文外，我们从`Tarumanegara`看到的唯一痕迹是它的名字；它源自古苏丹语单词`tarum`，意为靛蓝。`Tarumanegara`一定与靛蓝密切相关。古代爪哇社会中的靛蓝被广泛用于丝绸和棉织品的染色。由于`Tarumanegara`碑文的位置位于`Tarum`河内陆，关于其在现今加拉
    awang 稻田地区可能的首都位置的问题悬而未决。`Batujaya`新发现的印度教寺庙群——位于`Segaran`和`Telagajaya`村，靠近`Tarum`河（Citarum）的加拉
    awang——可能会让我们对西爪哇早期印度教王国的位置有一个更、更精确的想法（Manguin and Indradjaja 2011, pp. 113–36;
    印度尼西亚国家图书馆 2015）。


