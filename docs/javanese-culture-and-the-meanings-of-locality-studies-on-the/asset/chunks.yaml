    as architect defines the site for the palace that belongs to the innermost negara
    called kadaton. In Yogyakarta, there are two highest sites situated on the north
    and on the south along the north-south axis. The area of kedaton is located to
    include both highest sites into a continuous enclosure. The north area is dedicated
