  trans: '

    尽管在爪哇语中，艺术作品与 `reka` 概念（创造性工作、形象、绘画、人造和心灵）相关，但它的语境和应用被限制为展示合一性理念的活动媒介。建立定居点或房屋从未与
    `reka` 的概念相关，因为此类作品已经通过类型化形式（`pakem`）确立了。在某种程度上，`reka` 的概念听起来是偏离、不符合规范和伪造的。然而，这并不意味着创造力和创新在爪哇传统中没有特殊的空间。对创造力的肯定表述是
    `mbangun`，它是 `reka` 的同义词。`mbangun` 实际上是建筑、建立、设立、维持和发展。然而，它的语境不仅是为了建立结构和庇护，更是为了更新和恢复大地。`mbangun`
    意义上的创造性工作始终强调其使世界完整且美丽的建设性意图。


    `mbangun` 的信息是耕作土地并为可能的建筑腾出自由区域。将建成环境视为艺术品，其构图可能是通过感性的技术和处理确立的。由于爪哇文化中的艺术概念并未体现在抽象公式的层面，因此在不考虑其各种爪哇审美思想的情况下，很难通过单一的艺术概念来理解这些作品。


    ### 美与建成环境


    爪哇传统中与建成环境相关的美包含多种概念：`rahayu`、`apik`、`endah` 和 `lestari`。然而，古代爪哇关于建筑的美学概念在 `hita`
    的内涵下其表述更为全面。在旧爪哇语中，每栋建筑都有其本质指定的美，被称为 `hita`，涉及其与人类的关系。尽管如此，`hita` 不仅仅是某种功能性或实用性。相反，`hita`
    之美是因为它具有给予的能力，并交付一种创造性的认同物以促进人类的福祉。


    `hita` 框架下的美感体现在 `Hlam-hlam` 一词中，意为善良和有益。由于 `hita` 是一个梵语借用词，字面意思是福祉，它在爪哇语中的同义词是
    `rahayu`，该词与 `sugeng`（安全、强健、有活力和健康）被广泛使用。因此，`sugeng rahayu` 是处于安全、适体、良好、健康且处于完美状态的概念。通常情况下，这个概念是强调居住就像行走在安全的轨道上。


    ### 创新与 Pakem


    尽管木工和细木木工是爪哇传统建筑施工中的一项长期职业，但没有迹象表明木结构建筑找到了自由表达的途径。爪哇式的设计通常在 `pakem`（模式、方案和格式）的框架内被理解。居住房屋必须根据其已建立的模型（`pakem`）代代相传。尽管传统的建筑大师们（`hundagi`）已经消失了几个世纪，但他们的
    `pakem` 仍然存在。`pakem` 在建成环境中的应用是建立一种庄严的秩序体系，以承认并确认所有者的社会地位。


    尽管构图和建造的方案已经通过 `pakem` 制定，但这并不意味着爪哇人对创新的艺术作品没有任何尊重和荣誉。创新的空间仍然存在于活动的议程中。因此，爪哇文化中艺术作品的问题不在于对形式和风格的探索，而在于作品作为世界舞台的能力。艺术作品的终极努力是融入维持和发展世界迈向其美丽合一的仪式和庆典。在建筑上，爪哇房屋的作用是恢复其作为家庭仪式剧场的功能。


    ### 家族仪式与 Slametan


    爪哇传统中的家庭仪式是体验合一之感的时刻。在仪式的引导下，`dalem` 显示为社区的基座。古代泛神论万灵论的痕迹通过庄重地诵读《古兰经》经文表现出来。在家庭仪式期间在屋内聚集的目的是恢复他们处于合一安全轨道上的愿望和希望。


    `Slametan` 作为一个概念源于 `slamet` 一词，意为安全和可靠。`slametan` 活动如果没有执行作为宴会中心的米饭塔（`tumpeng`），就永远是不完美的。`tumpeng`
    本身的形式是为了唤起生命之树（`kapaltaru`）和天堂山（`Mahameru`）的形象。像古代一样，仪式的主持者是神职（`modin` 或 `kiayi`），主旨发言者是社区中最受尊敬的人。通常，宗教和社会政治领导的结合总是与合一的重新定义和恢复联系在一起。


    ### 可持续性与居住


    爪哇建筑与居住之间的可持续关系通过 `open`、`diopeni` 和 `rawat`、`dirawati` 概念来理解。这些词意味着对服务人类的关注。`open`
    和 `rawat` 的理念是让事物存在并触手可及的方式。它不仅仅被视为客体之间的功能关系。


    作为居住地的房屋似乎被整合为身体（`wadah`）的延伸。关系构成了 `pomah`（在家）的感觉，是因为有了照顾。祭品（`saj`）由主人提供给相信守护房屋的祖灵。在特定时期，通常每十年一次，会举行仪式宴会（`slametan`）以更新屋顶。


    照顾和维护爪哇房屋处于适当良好的状态，不仅仅是为了其作为所有者座席的使用和功能。相反，这种照顾实际上基于对房屋包含仁灵（`danyang`）的尊重和信仰。没有灵魂的房屋是空的，既不安全也不健康。与灵魂和解实际上是对房屋所给予的感激行为。


    `Slametan` 的举行是为了表达感激，并祝愿家族福祉。当然，相信灵魂只是尊重事物的方式，因为对于爪哇人来说，万物在宇宙（`jagat`）中都有自己的权利和位置。生活总是与其他生物相互尊重地共处，无论其形式和表现如何。建筑施工和居住的每一个步骤和阶段都是仪式宴会（`slametan`）框架内对安全和和平的请求。


    ### Dalem，作为内在自我的家


    与场所和社会的和谐无非为了带来互动和关系，从粗糙到精细，从生涩到熟透，因为有了照顾而构成了“家”的感觉。家通过感受（rasa）被体验，正如爪哇谚语所：`sepi
    ing pamrih rame ing gawe`（无私心，勤于工作）。


