    # 自 16 世纪末以来，爪哇传统城镇中心的穆斯林定居点一直围绕着城镇清真寺。从那时起，被称为 `kauman` 的穆斯林区已成为爪哇城市结构和身份中不可分割的一部分。`kauman`
    主要由阿拉伯人、古拉特人和当地商人占据，它是一个具有独特特征的领域，是学习伊斯兰教义和诵读古兰经的圣地。来自这个伊斯兰领域的贸易者在内陆与沿海地区之间充当特定货物的中间商：黄金、盐、香料、丝绸、珠子、珍珠等。


    推测城市及其宫殿并非 `negara` 的中心，而是被称为 `alun-alun` 的用于大型仪式和典式的公共开放空间。然而，问题仍然在于，爪哇古代王国是因为单纯的技术技术原因还是意识形态的优先考虑才没有城市？事实上，自
    8 世纪以来爪哇岛印度教和佛教寺庙的出现表明，`negara`作为一个社会政治组织的社区，能够建造和建立大规模的纪念性建筑。他们为什么不建立自己的城市呢？有人认为，对于印度尼人来说，房屋、城镇和国家的遗迹可能被简单地构想为国家景观（`lakon`）的舞台（爪哇语
    `kelir`）。


    后殖民时期印度尼西亚拆除历史建筑发生在苏尔诺和苏哈托统治时期，目的是为了更新政治主张。另一方面，建立新纪念碑以彰显统治时代的新精神成为强制性。这两位现代领导人都使用了相同的方法来指控他们的对手反国家及其意识形态。


    印度尼西亚人的归属感并不仅仅存在于其地缘政治历史地图，而是深根于其作为马来性和爪哇性（Javan-ness）概念载体和维持者的精神源头。因此，居住和坐卧与通过合一主义将万物归为一的必要性联系在一起。那么，`negara`
    的兴衰很可能是统治本身的戏剧，其中作为社会政治实体的国家动员人们表演他们的统治者崇拜剧场。正如克里福德·格尔茨（1980）细致观察到的，爪哇国家在这一意图上与
    19 世纪的巴厘 `negara` 有很大相似之处。


    ## 历史连续性与建筑概念


    从历史角度看，爪哇传统中的 `kuta negara` 在概念上是持续的，从辛格萨里、马雅帕希特、德马克、科塔格德、普莱德到雅加达塔和苏卡塔。尽管名称和形式随着时间的推移而变化，例如用
    `mesjid agung`（大清真寺）取代 `pura`，但 `khita` 作为 `negara` 的政治、文化和精神中心的基本概念保持不变。其核心是由双榕树守护的
    `alun-alun` 的空地。靠近空地的是统治者的座席和精神聚集场所。`alun-alun`、`kraton` 和 `mesjid` 在建筑上与爪哇房屋的内部房间相同：`sentong
    tengah`、`sentong kiwa` 和 `sentong tengen`。


    房屋和城镇的身份体现在多层级的 `dalem` 中，其字面意思是内部、里面、家和统一的领域。最内层的领域是人内在的内在自我（`batin`），精神、思想和身体的统一在此处找到存在。`dalem`
    在时空上是多层级的，其方式是在合一中包容内在和外在自我。在德里瑟当的老马来传统中，房屋、城镇和国家的理念在概念上由 `jeru` 概念组成，与爪哇的 `dalem`
    具有相似含义。因此，房屋、城镇和国家的身份不仅仅是将天界投影到地上的符号。相反，领域的身份在于人类与其居住地之间概念上多层级关系领域中“家”的概念。


    ## 寂静的神圣领域


    理解爪哇思想中关于中心的概念（这种思想主要占据了印度尼西亚的政治和文化），绝不能忽视 `dalem` 的重要性，在最广泛的意义上，它是启发性沉默（`nglangut`）和宁静（`hening`）的神圣领域。通过冥想让沉默向我们倾诉，在传统上被视为爪哇人做出决定的途径。在建筑上，像雅加达塔这样的城镇其神圣领域既不在清真寺内，也不在庭院或宫殿内，而是在其城镇广场。这是宁静和沉默所在的地方。`alun-alun`
    受到双榕树的守护，保持着它自身的秘密。


    统治者从他的最高处（`siti hinggil`）坐下，通过透过双榕树之间的 `alun-alun` 空间望向山峦和天空进行冥想，让那里的宁静和沉默对他说话。在最高处有一个房中之房。最内层的房间（`bangsal
    manguntur tangkil`）实际上是统治者保持沉默和宁静的地方，而其外层房间则是存在起源的房间（`bangsal witana`）。在日常生活中，这些房间保持空虚。从这种空中，中心的概念通过一个建筑简约的结构象征性地推导出来。


    ## 雅加达塔的基础


    作为马特兰苏丹国的首都，雅加达塔也是伊斯兰爪哇国家最重要的中心之一。爪哇马特兰王国在 1630 年阿贡苏丹去世后陷入了衰落。在宫廷精英经历了数十动荡和权力斗争后，曼库布米·苏科瓦蒂王子获得了根据《吉亚蒂协议》建立新王国的特权。雅加达塔作为爪哇王国的首都是在
    1755 年吉亚蒂条约后建立的。根据该条约，马特兰王国被分为两个统治者：西部的曼库布米王子和东部的帕库布沃诺一世。


    雅加达塔的历史通过比喻和象征元素来描述，这些元素被融入建筑、景观元素和装饰中；这种象征意义在巴厘语境（Geertz 1980）中的表现方式相似，因为两者具有相同的灵论和印度教-佛教根源。他的王国王座选址清理工作于
    1756 年开始。曼库布米亲自领导了选址并开启了他的 `kraton` 选址。


