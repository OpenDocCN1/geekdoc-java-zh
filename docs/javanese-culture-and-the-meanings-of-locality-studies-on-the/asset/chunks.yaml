    对于统治王朝而言，`caitya`的建立可能实现了`negara`（国家）与其`kawula/paura`（民众）的统一，这使他们能够动员自己的资源。不而而之，缺乏任何宗教文化归属的`negara`
    似乎仍然是一个抽象且不可触及的概念。由于`negara`作为权力的感可以通过建造建筑得以具体化，对于古代爪哇社会来说，`caitya`可能为他们提供了一个精神上的统一场所，让他们能够集体对比生命更伟大的事物表达希望、崇拜、祝福和感激。


    从 10 世纪`Sindok`统治开始，`candis` 作为伟大统治者遗产的纪念碑变得显易可见；例如，为`Airlangga`的`candi Gunung
    Kawi`、为`A Arok`的`candi Jago`、为`Anusaphati`（1227–1248）的`candi Kidal`以及为`Kertanegara`（1254–1292）的`candi
    Singasari`。问题随之产生：作为`negara`的纪念性建筑，`negara`与`candis`之间之间是什么关系？


    根据`Mula Malurung`碑文`V-a`和`V-b`，Singasari 王国时期存在多种类型的`candis`：`thani bala`（避邪纪念碑）、`sima`（自由地纪念碑）、`kalang`（工匠建筑）、`Kalagyan`（村名）、`kamulan`（神龛）、`Kakurugan`（村碑）、`Kuti`（村名）、`biara`（寺庙纪念碑）、`Sala`（村名）、`parahyangan`崇拜场所）和`karesian`精神纪念结构）。`Singasari`对`candi`建筑的贡献显然是对其统治者纪念碑功能的重新解释。从`Ken
    Arok`到`Kertanegara`的`Singasari`统治时期将`candi`的功能从神圣的宗教纪念碑转化为统治者的纪念建筑。


    自从爪哇王国从中爪哇迁往东爪哇，特别是`Singasari`之后，国王的遗产通过纪念性结构得到了尊严（`Muljana 2006, p. 64`）。鉴于爪哇文化中的权力是宇宙能量（`kesection`），对统治者的崇拜通过纪念碑得以永恒化，纪念碑可能是保存这种苦行力量的方式。尽管从`Majapahit`统治时期开始我们没有发现任何大规模的纪念碑，但群岛上最后一位伟大的印度教皇帝为我们留下了爪哇城市定居点的痕迹。`Trowulan`的`Majapahit`遗迹为我们提供了一个生动的爪哇首都城范例，那里必然部署了多层次的中心区域和高度复杂的土地利用模式。尽管`Trowulan`遗址处的一些`candis`可能是尊献给其统治者的，但这种奉献似乎并非为了他们的坟墓或陵寝。大多数统治者的骨灰都是通过相邻河流的水流被送往海洋。


    如前所述，外来影响大部分通过融合的方式被爪哇文化所吸收。然而，某些地方自豪感和尊严的案例在文化融合过程中起着重要作用。`Suhita`王后（公元 1416–1459
    年）通过她的纪念碑`candi Sukuh`展示了这种情况。她在 15 世纪强烈抵抗伊斯兰教的传播。作为`Majapahit`的最后一位皇后，她用本土爪哇建筑建造了这座`candi`，重新发明了印度文化影响之前的本土建筑形式。`candi
    Sukuh`的设计基于类似于金字塔的形式或阶梯式圣殿——`umpak pepunden`，最初在其顶部有一个`lingam-yoni`。`candi`的四座石梯旨在引导人们从地面通往这座带有矩形顶峰的建筑顶部。


    ![](img/Figure_2.9.jpg)


    图 2.9. 位于苏拉卡塔东部 Lawu 山坡上的 15 世纪`Candi Sukuh`；它被认为是从受印度影响的`candi`建筑向本土风格和形式转变的高潮转折点。摄影：Bagoes
    Wiryomartono。


    考虑到装饰寺庙的浮雕和雕塑纹样，显然雕刻了一种后期印度佛教影响与爪哇巨石纪念碑的混合体。`candi`的形式让人们联想到马来-爪哇本土泛神灵灵论中的祖先崇拜祭坛。此外，`candi
    Sukuh`的雕塑元素和装饰描绘了爪哇人对《摩诃婆罗多》人物和印度佛教神的解读，带有漫画和喜剧的场景。


    国家的建立可以被视为对其统治者个人崇拜的制度化。这在获得主权权力后在政治上完成。然而，如果没有宗教辩护和公众表演，政治霸权的地位是不完整的。在仪式上，把自己任命为超级王——`maharatu
    cakrawati`需要精神领袖的支持，使他能够表演他的权力戏剧。


    ![](img/Figure_2.10.jpg)


    图 2.10. 11 世纪描绘为`Wisnu`的`Airlangga`像，印度尼西亚国家博物馆藏品。摄影：Bagoes Wiryomartono。


