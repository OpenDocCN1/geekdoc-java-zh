    The future of human living for Javanese culture would rather the question of walking
    through rather than that of pursuing happiness. Consequently, building and settlement
    in the Javanese world depends on how to exercise its indigenous capacity to embrace,
    to contrive, and to integrate everything that is coming into its realm. It is
    not to accumulate power and glory without being able to domesticate contemporary
    surrounding things, techniques, and institutions within the already-existing indigenous
    framework.


    Building and dwelling for the Javanese tradition seem to have been established
    as the way to deal with contemporary challenges. All these for Javanese people
    are never out of commission of domesticating (njawake), literally meaning making
    it familiar with the Javanese way—because the idea of home for the Javanese does
    not lie in the physical representation, but it lies deep in their way of nglakoni
    and Urip sa’derma mampir ngombe: life is a walk and take a rest for a while for
    taking a drink, nor more no less. In this sense we learn the wisdom of the Javanese
    thinking that holds on culturally materialized things. All this is seen by the
    Javanese in a different way. In other words, the things are only the shadows.


    The way to find a home for the Javanese is not a physical matter but an inner
    business of feeling in the sense of kerasan. The question is quite critical for
    those who hold the idea of building and dwelling in Western historic monumentalism,
    maintaining the authenticity of objects in the space according to its origin.
    For the Javanese tradition, living is walking through in a way not to hold everything
    passing by. It is, however, not to say that there is no lesson from the past.


    The Javanese would rather develop their attitude to be ready for the right now
    rather than glorifying the past. For Javanese people, dealing with the right now
    is already to embrace the past and the future with the pragmatic concept of nglakoni,
    that is, the way for experiencing, owning, and comprehending beings as a whole.
    There is no “us versus them” in any level of being, whether as thought or as form
    and event.'
