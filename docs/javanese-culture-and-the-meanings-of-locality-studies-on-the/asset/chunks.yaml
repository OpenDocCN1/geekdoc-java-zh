    Although reformasi is the new era of Indonesian politics for more democratic governance,
    the mainstream of old political culture still plays a dominant role in shaping
    and directing the political junctures based on paternalistic patronage, pride,
    and prophecy. On clean from corruption and good governance, Indonesian reformist
    leaders have to work extra, not simply because the current bureaucratic system
    is mostly still dominated by the mainstream of the despotic New Order. They do
    not want to change the old political culture from despotic patrimonial to democratic
    governance.


