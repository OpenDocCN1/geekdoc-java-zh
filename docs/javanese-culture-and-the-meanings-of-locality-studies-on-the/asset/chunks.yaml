  trans: '

    尽管大多数国家和定居点在公元一世纪到十二世纪之间已经消失，但印度影响的痕迹依然可见。它们在过去几乎不被承认的痕迹发现于分散的来源中：从纪念碑遗迹（`candis`）、铭文（`prasasti`）、诗歌（`kakawin`）和史（`babad`），到神话（`dongeng`）。然而，在城市历史方面似乎没有留下全面的考古证据。伊斯兰之前的国家可能没有城市，还是说他们有一种不同的城市观念？到目前为止，根据印尼的背景判断城市定居点，缺乏对“什么是城市”的当地知识和背景。这项历史调查的主要来源是与十二世纪以前印度尼爪爪哇人类定居相关的当地概念、人工、遗迹和文献历史。


    ## 伊斯兰前的爪爪哇


    许多学者已经对伊斯兰前爪爪哇早期城市化的研究（Coedes 1944/1968; Wisseman-Christie 1986; Wisseman-Christie
    1983; Coedes 1966; Ali 2011; Kulke 2001）。他们对我们古代爪爪哇定居点知识的贡献无疑是重大的。然而，关于城市定居的当地古代概念仍需进一步的审查和阐释。本章认为，当地概念在历史分析中具有潜在资源价值，因为古代概念和事物在构建古代世界时在背景上是相互联系和关联的。古代爪爪哇国家概念与城市化概念之间是什么关系？这个问题引导本章探索与早期国家和社会相关的方面和古代概念，这些概念在理论上是城市化思想或痕迹的组成部分。到目前为止，人们很少关注能够使我们理解
    `negara` 与城市性之间关系的理论立场的发展。这一事实可能源于我们对政治文化的理解匮乏，而这种文化是以 `negara` 为印尼城镇和城市的生成概念被塑造的并并在其塑造的。


    到目前为止，误解是不可避免的，因为城市化被狭义地理解为人口聚集的定居形态现象。相反，城市化本质上是关于具有可持续文化培养能力和经济增长能力的政治组织定居点的体验。因此，发展和增长是可能的，因为有可用资源，以及其生产系统在政治和环境上的政治稳定性。此外，城市化使公民能够维持他们的财富、权力以及作为国家或政体系统中某种价值之物。定居点的聚集可能不是城市化的唯一决定变量，而显然是文化生产系统模式、需求和结果的结果。


    要将印尼城市化历史作为一种文化现象来理解，可能需要包含关于 `negara` 作为政治概念的话语。这是因为城市定居的起源不可避免地是政治文化与他人互动的产物。是政治文化使城镇和城市变得独特且具有背景。由于城市定居是权力集中的场所，展开和瓦解霸权与权威的概念对于什么是城市的历史话语至关重要。在方法论上，本章是一项诠释学调查。它涉及印尼爪哇的结构概念和早期城市化的方面。本章的重点是揭示和展开关于领域和社区方面的当地概念，这些概念对过去和世界具有建设性。为了找到它们的局部含义，拆解和揭示地方和原始概念成为本章的主要任务。在此过程中，城市历史不仅是对过去的描述性叙述，而且是对前世世界及其政治文化的话语性解释。那么，城市化的历史将在这种社会文化构建的现实中被描绘，其中
    `negara` 作为概念对于印尼的城市化是核心且不可或缺的。


    ## Desa 与早期 Negara


    在印尼定居点的中，村庄（`wanua`、`kampong`、`gampong`、`banua`、`kabisu`）通过其制度和社会与城镇（爪语 `kuta`
    或马来语 `kota`）区分开来。`wanua` 是一个自治、自给自足且父制的定居组织。在社会上，古代村庄（`wanuas`）由二元对立群体组成：贵族阶层和平民（Kroef
    1954, pp. 842–62）。尽管几个村庄（`wanuas`）独立存在（Bellwood et al. 1995, p. 195），但一个 `negara`
    必须有几个 `desa`（村庄），它们环绕并支持着它的政治中心（`kuta negara`）。从历史上看，从未没有没有 `desas` 的 `negara`。自从公元五世纪左右采用印度教和佛教影响以来，`negara`
    和 `desa` 一直共存。`desas` 和 `negara` 不仅仅在主奴关系上在经济上相互依赖，它们在形而上学上也通过父子关系相互支持。


    毫无疑问，爪爪哇大多数本土统治者在四世纪到十世纪之间接受了印度教和佛教，这使他们能够建立国家 `negara`。在此可能性之前，他们必须在自己的控制下统一至少四个围绕他们自己
    `wanua` 的村庄。这在爪哇传统中被称为 `mancapat`（Koentjaraningrat 1985, p. 100）。然而，这并不意味着将整个村庄固合成一个位置。对于
    `mancapat` 概念来说，重要的是建立一个村庄链条。一个国家越强大，他们建立的链条就越长。然后，周围的村庄（`tpi siring`）被纳入他们的政治控制之下，并授予
    `desa` 政体地位。尽管村庄被整合在同一个屋檐下，但权威是本土的思想和实践，从酋长制到国家的转变在哲学上归功于印度国家的影响。他们不仅从印度文明中学习了印度教和佛教，还学习了治国、识字以及通过税收和贡赋系统控制土地的方法。


    八世纪期间，爪哇定居点的发展发生了重大变化。这种变化记录在 `Dinaya` 铭文中，该铭文提到了公元 732 年左右的三詹延王朝（Coedes 1944/1968,
    p. 90）。这种发展通过文字表明了从本土定居制度 `wanua` 的概念被 `negara` 或 `desa` 取代。正如在斯莱曼日加雅地区的多个铭文中反复发现的那样，爪哇文化并没有按照梵文中对地方和土地的描述来理解
    `desa`。相反，在古代爪哇背景下，`desa` 是一个具有政治组织的二元社会系统的村落定居点：`karaman` 由长者（`rama`）组成，`bhogi`
    由担任村庄管理位的 `raka` 或 `rakryan`（大哥哥）组成；`karaman` 是村庄的绅士。后来 `raka` 或 `rakryan` 成为伊斯兰前爪哇贵族或贵族的头衔。自伊斯兰德麦苏丹国及其首位统治者
    `Raden Patah` 以来，该头衔从 `rakryan` 变为 `raden`。

    '
- fmt: '

    Nonetheless, the integration of former `wanuas` into a `negara` meant that the
    village egalitarian way of life was gradually dissolved by a bureaucratic system
    of feudal polity. Evidently, it was impossible without a concentration and consolidation
    of power within the aristocrat group. The dissolution was also the cause of the
    weakening egalitarian assembly of the elders (`karaman`), meanwhile it was also
    the formative time for the more sophisticated agrarian landlord system in the
    Javanese society.


    As a matter of fact, the adoption of Indic statecraft was subsequently not only
    a transformation of the title of `wanua` chieftain from `raka` or `rakryan` to
    `dhatu` or `ratu`, but also the shift of the role and function of leadership from
    the chief of community to the political leader of society. This implies a development
    of social status and stratification and more diversity in occupations and hierarchical
    chain of command. This early formative phase of state could have also been followed
    by the emergence of a hierarchically centralized system of `negara`.


    The inscriptions in Central and East Java (`Lokapala`, `Mantyasih`, `Wanua Tengah`,
    and `Sugih Manek`) from the late ninth century further brought up the appearance
    of freeholds of settlement beyond `desa` called `wateg`, which was politically
    at the same level as the status of `desa`. The status of such a freehold had been
    traditionally granted by a ruler as political tactics to embrace other landlords
    without violent conquest. With such a good will, a ruler was in a position to
    gain loyalty and diminish potential rivals. High- and low-rank royal officers
    (`samgat`, `pamgat`, and `mangilala drawya haji`) and some chieftains enjoyed
    a tax exemption as well. The status of freehold could have been used to embrace
    potentially competing rulers for cooperation. In return, paying homage periodically
    to the seat of rulers, such as `sowan dalem` for `sima` ceremonies, must have
    been advised as a sign of veneration and loyalty (Tarling 1999, p. 214).


    The `sima` in ancient Javanese tradition was the place with special status, free
    of taxation. It could be also the holy place of the king or ancestral heroes.
    Granting a `sima` status of land was a political move of the ruler to control
    his/her subordinate landowners. This required a state ritual and ceremony that
    confirmed and formalized the arrangement. It was also spiritually considered the
    birth and renewal of the state as the world. In doing so, the presence of the
    ruler on the occasion was intended to justify his/her status as the god on earth.


    Moreover, there were some concepts related to settlement from the inscriptions
    during the era of Hindu-Buddhist states, such as `wanua`, `negara`, `duwan/kaduhwan`,
    `desa`, `dapur`, `thani`, `dalem`, and `thani`. All these concepts had specific
    and unique meanings that covered the transformation processes of political culture
    prior to the time before the displacement of Javanese power from Central to East
    Java in the tenth century. These included the shifts of terms for domains from
    the early eighth- to thirteenth-century Java, which were possibly associated with
    the formative process and consolidation of its institutional body of polity: `negara`.
    `Dhuwan` was the ancient term for the contemporary word `dukuh`, meaning hamlet.
    Even though `dhuwan` was led by a `kamitua`, literally meaning someone who was
    highly respected as a senior person, its political organization had not yet been
    established and was not as sophisticated as `wanua` or `desa`.


    ![](Images/Figure_2.1.jpg)


    Figure 2.1. The scene from the relief of Borobudur’s Karmawibangga portraying
    the act of paying homage to the King from his subordinate landlords, `punpunan`.
    Photo courtesy of Rudi Badil and Katalis Publishing (Badil 1989: 34).


    Compared to `dhuwan`, `desa` was actually a borrowed Sanskrit word, literally
    meaning a sociopolitical institution of agricultural settlement that was traditionally
    under a `negara`’s hegemony. As a political organization, `desa` is economically
    supported by a self-sufficient agrarian community based on wet rice cultivation.
    The establishment of some `desas` was in many cases because of their political
    affiliation with a `negara` that was originally a `wanua`. The affiliation was
    made by a `negara` through political processes or military conquests.


    The other form of affiliation was based on a political mechanism of territorial
    expansion of a `negara`. It was made with a land grant system to the state bureaucratic
    apparatus. The state ruler granted the land to the state officers for their domain
    or territory. Such domain or territory in ancient Java was known as `lungguh`.
    In the course of time, the populations of `lungguh` territory were growing and
    developing as an agricultural community and settlement. The political status of
    such settlements varied as to whether they were `desa lungguh` or `kadipaten/kabupaten`.
    This kind of settlement was provided with a seat of local ruler at its center.
    `Kadipaten` or `kabupaten` were regencies or subordinate states that were led
    by the princes of state (`hino/mahamantri`) or royal family members with high-rank
    state office status (`pamgat`).


    In its mature form, an ordinary `desa` was a territorially organized entity of
    settlement with institutions for political, economic, and social affairs. The
    head of `desa` was `demang`, `akwu`, or `lurah`, who was assisted by a deputy
    (`carik`), priests (`resi`, `pengulu`), and medicine men (`dukun`). He led villagers
    who principally consisted of landlords or patrons of work called `gawe haji`.
    In dealing with village affairs, every traditional village was provided with a
    village council called `karaman` consisting of landlords and elders. As a community,
    ancient Javanese `desa` had its own local customary laws (`cara`) for their community
    life.


    Some ancient `desa` traditions still survive today. The most important event is
    the tradition of `bersih desa`. It is an event for cleaning up the village and
    for celebrating the rebirth of the community as the world. In ancient times such
    collective voluntarily work for a lord was called `buncang haji`. But today it
    is the same with a different name, known as `gotong royong` (carrying together)
    or `gugur gunung` (falling mountain). In ancient times and today, the leadership
    of the village chief is very important as the role of the father of the village
    community. In addition, for safety and security `desa` is provided with a night
    guarding system (`ronda`) on a voluntarily basis. Village night guards are mostly
    adult males who are pulled out from every household. They guard during the night
    and are provided with `kentongan` (bamboo instruments) that they strike if they
    need to alert the community to danger.


    Although Hindu and Indic culture had introduced the Javanese society to the four
    castes (`svawarna`), the adoption had been subtly assimilated within the preeminent
    dualistic system consisting of noblemen and commoners. Small kingdoms in ancient
    Java had at least four state ranks: `rakai` (ruler), `pamgat` or `samgat` (state
    officer), `haji` (landlord), and `samya haji` (servant of landlord). Besides bureaucrats,
    state priests (`pandita`, `resi`, `Begawan`) and monks (`bikhu`, `cantrik`) played
    important roles and functions for state rituals and ceremonies while the merchants
    and traders (`nayagan/niagawan`) ran the agrarian economy with the support of
    commoners (`paura`) as workers of landlord (`gawe haji`) and laborers (`katik`).


    From the inscriptions of the eighth to the tenth century, one noteworthy concept
    among others was associated with the ancient hamlet called `dapur`, literally
    meaning pioneer land for settlement. The terms `dapur` or `dhapuk` were used for
    the pioneer settlement after the site clearing of forest, called `babad alas`.
    The next stage of its development, `dapur` had to establish its domestication
    based on shifting rice cultivation (`pagagan` or `gaga`). The social unit of such
    pioneer settlement was known as `dhuwan`. Today such a concept is still in use
    with a similar name: `dephok`, meaning hamlet or a settlement with scattered houses.

