  trans: '


    统治者与被治者之间社会二元对立政治文化的根源在历史上是由马来人、布吉斯人和爪哇人共同分享、塑造和培养的。这种二元体系的统一性是统治者通过一种 `semangat`（意为集体目标精神）在意识形态上的整合。这两者对于理解统治者如何构建其“想象的国家”及其在现实政治中建立这一国家至关重要。`semangat`
    是政治议程的核心，旨在实现权力作为其/她王国之光的意图。因此，`semangat` 具有某种程度上统一、鼓励、启示、启发、激励和动员的作用。


    `negara`（国家）无非是 `semangat` 的载体和工具，具有两个层面的实用性。首先，在现实政治层面，`negara` 是国家事务的政治实体，承担国内经济、外交关系、社会文化事务、国家安全和防御任务。其次，在意识形态层面，`negara`是将
    `semangat` 转化为权力景观的手段。为了实现 `negara` 的宏伟壮观，作为意识形态内容的 `semangat` 必须是纯粹且在宇宙论上统一的。纯粹性和统一是动员所有资源的必要条件，能够免受怀疑和抵抗。


    ### 古代政治文化


    群岛的古代政治文化根植于奥斯特罗尼语人的 `wanua`，这是一种将村庄共和国视为世界的概念，传统上由父权式领导层建立，并获得二元且对立集团的支持：地主和长老。`semangat`
    燃料并为村庄世界注入了一种统一的宇宙美学概念。因此，统一与和谐等同于美丽繁荣的世界。在整个群岛，亚齐人、马来人、爪哇人、民南加道人和布吉斯人的族群中，统一精神（`utuh`）和共识（`mufakat`）显而可见。埃灵顿（Errington）将这些社会——以及之前的印度国家——称为“中心主义群岛”，因为他们专注于统一，并将分裂和离离视为个人疾病、社区不幸或政治失败的结果、原因或两者兼有（Pamberton
    1994, p. 243）。


    在印度尼西亚的背景下，`semangat` 深根于古代对国家（`negara`）和民族（`bangsa`）统一权力的信仰。不出所料，现代国家 `negara`
    将 `semangat` 纳入潘加西拉（pancasila）的国家意识形态中。`semangat` 被认为在精神上激励、并在情感上推动人们走向统一和完整。基于对
    `semangat` 的信仰，有三个原则作为印尼西亚传统政治文化的美德脱颖而出。


    ### 印尼西亚政治文化的三大原则


    #### 第一：和谐统一

    和谐统一被认为是群岛政治文化的基本原则。政治世界的意图是将人们聚集在一起，作为家庭和家的现实。在讨论政治思想、问题和事务时，政治精英必须记住，社区的统一（`kesatuan`）和和谐（`selaras`）不是可以衡量（`taruhan`）或危险（`bahaya`的。统一与和谐被认为是不可分割的。它们在传统上被维持为社区感（`hakekat
    bermarakat`）。任何分裂和不和的行为都被视为反对系统乃至世界的。在许多方面，任何新思想和影响都将根据其后果接受检验，是导致稳固强大的社区，还是导致混乱和解体。


    #### 第二：强而坚定的领导

    强而坚定的领导（`pimpinan kuat dan tegas`）是永远需要的。无论对错并不重要，而仅仅关乎为主流或精英利益服务的现实政治。强而坚定的领导被视为社区前进的先锋，为了作为国家和祖国的自豪（`kapriyaian/priyayi`,
    `harga diri`）和威望（`kaprajan`, `gengsi`）。一个领导者受人尊重是因为他/她不仅克制、勇敢且勇于承担风险，而且在做决定时从不犹豫。他/她对敌人是否固执（`keras
    kepala`）或残忍（`keji`）并不重要。领导者是能够引导人们为自己作为一个国家感到自豪，并作为一个国家受到尊重的人；他们并不真正关心这样的领导者是以合法的方式获得权力的。


    在许多方面，对强领导的需求可能导致人们走向一个具有盲目爱国狂热法西斯国家，正如苏尔诺（1945–1967）和苏哈托（1967–1998）所示。这种民族主义民粹主义的早期迹象在近期印尼的改革时期显而易见，正如梅加瓦蒂领导的印尼西亚民主党和
    2007 年在普拉博沃·苏比安托领导下的印尼西亚大义党（`Gerindra`）所形成的民粹主义和反自由主义运动所示。


    #### 第三：寻找共同点

    寻找共同点是任何政治审议的目标和隧道尽头的光，否则强有力而有权威的领导将接手决定目标。寻找共同点通常通过会议和协商（`musyawarah`）进行。共识（被称为
    `mufakat`）实际上不是通过商议达成的，也不是通过谈判达成的（谈判本质上是为了撇开任何反对政治主流的利益）。传统上，`musyawarah` 是一种父权式的说服和教育，由长老来教导那些尚未进入政治主流的人。而
    `mufakat` 实际上是接受加入主流。再次，这关乎正确与否，而仅仅是维护统一的形象、自豪感以及对现状尊重的必要性。


    ### 共识与权力


    在许多方面，共识是印尼西亚政治为了实现权力同质性的圣杯。由于权力（`kuasa`, `kekuasaan`）被构想为控制和主导权威，思想统一是必然的结果。有许多方法可以达成共识。最有利的是在形态或政治领域创建一个共同敌人。通过这样做，权力有了正当理由为其现状做应该做的一切，并将纯粹和危险作为其分类范式。


    基于上述三个特征，印尼西亚政治传统在文化上契合父权式的赞助，这种赞助基于贵族特权和年龄顺序。赞助在许多方面是金字塔式的。年轻领导者不能仅凭成就取得长远。他们必须说服长老他们在危机期间领导的能力。否则，他们必须等待机会的出现。


    ### 不纯洁与宇宙整体性


    纯粹和危险是证明上述政治文化三大价值的权力概念。在政治上，纯粹（`bersih`）并不意味着正确或合适，而仅仅意味着符合当前意识形态和霸权的轨道。尽管信仰、民族和起源存在多样，作为政治现实的世界被构为一个同质的霸权体系。这种同质霸权的来源是未知的，但被认为是爪哇传统中被称为
    `semangat` 或 `kesekten` 的精神能量。


