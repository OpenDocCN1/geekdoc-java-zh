  trans: '

    `dhuwan` 到 `thani` 的转变是通过名为 `sawah` 的农业实践实现的，通过这种实践，定居点作为一种基础性生产的形式得以发展。作为定居点的
    `dhuwan` 和 `thani` 在社会政治上可能是 `wanua` 的一部分。这两个术语都是为了描述水稻种植模式的。它们是政治上独立的定居单位，也可以与经济和政治上已建立的
    `wanua` 附属。


    # 文字、稻田与国家


    识字能力和水稻种植被认为是爪哇答及群岛其他地区权力集中及其形成性国家政体至关重要的要素。大多数关于国家的社会和政治概念显然源于 `Sankrit dharmasastra`，该法典也是国家仪式、治国、制度和图象的来源（Heesterman
    1989, p. 5）。`Sankrit` 识字（`aksara`）在公元 100 年至 600 年间，由来自南印度的佛教僧（`bikhu`）和婆罗门（`brahmana`）引入爪哇答及其外岛的统治阶层，而水稻种植（`sawah`）的实践可能在第一世纪左右从东南亚大陆引入。然而，现存最古老的
    `Kutei` 铭文不早于第四世纪。


    ![](img/Figure_2.2.jpg)


    图 2.2 8 世纪婆罗浮浮寺 `Karmawibangga` 面板上古代爪哇社会中鱼、家禽和猪的饲养与驯化（`budidaya`）场景。照片由 Rudi
    Badil 和 Katalis Publishing 提供（Badil 1989: 78）。


    显然，五世纪早期王国的历史痕存在于东加里曼和西爪哇的石刻和铜文中。文字仍然是 `Pallawa`。根据流传的爪哇口述，识字是由来自印度的 Adji Sakha
    王子教授爪哇贵族的（Iguchi 2015, p. 78）。从他那里，识字和阴历开始出现在爪哇。它可以追溯到公元 78 年左右。此外，这位王子在爪哇口传传统中非常有名，他教用
    `Sankrit` 和 `Pallawa` 字母教授爪哇地主 `Devanagari` 文字。识字仅供统治阶层保留和使用，被视为一种上特权。从那时起，保守
    `Sanskrit` 文本一直是爪哇贵族的传统。印度与东南亚（特别是爪哇）之间的关系在文化历史方面一直是独特的。国际化的 `Sanskrit` 世界几乎没有在隔绝和区域化方面被划分，这让我们忽视了自然和历史的统一性（Heesterman
    1989）。


    ![](img/Figure_2.3.jpg)


    图 2.3 9 世纪石刻，馆藏于印度尼西亚雅加达国家博物馆。摄影：Bagoes Wiryomartono。


    普通人从 `Sanskrit` 识字中受益的一点是历法系统。爪哇阴历（`pawukon`）随后由 Adji Saka 王子开发。从那时起，年历系统以他的名字命名：`taon
    saka`。然而，`Sanskrit` 的影响逐渐与当地文化融合。正如 12 世纪的铭文所示，爪哇的 `negara` 不使用 `Sanskrit` 语言和
    `Pallava` 文字，而是发展了自己的语言，被称为 `basa kawi`，以及 `hanacaraka aksara` 字体。尽管如此，古代爪哇的识字被视为神圣的和技能，使其能够建立
    `negara` 国家政体的统治阶层和精英地位。从社会学角度来说，古代爪哇的识字能力在统治阶层和普通人之间形成了强烈的社会对立。同时，水稻种植通过封建主义经济体系加强了统治阶层统治平民的地位。


    ![](img/Figure_2.4.jpg)


    图 2.4 婆罗浮浮 `Karmawibangga` 面板场景，描绘了地主（`boghi`）在其住所内向穷人进行捐赠。照片由 Rudi Badil 和 Katalis
    Publishing 提供（Badil 1989: 19）。


    在经济上，古代爪哇从酋长制到王国的转变不仅是因为印度文明的影响，也可能是因为农业技术上生产性发展的提供，这些技术从 `tegal`（刀耕火耕）转变为 `thani`（农业村落或定居单位）。这可能发生在第一世纪到七世纪之间。此类技术的起源在东南亚大陆早已为人知，特别是越南的湄江三角洲（Wheatley
    1983, p. 113; Needham et al. 2000, pp. 123, 486）。然后，水稻种植和印度治术使得早期爪哇 `wanuas` 能够定居在基于
    `thani` 农业耕作的原国家政治系统的地点。


    然而，爪哇驯化方式从轮耕（`negal`）向农耕作（`nyawah` 或 `ntani`）的转变并不是居住文化从平等社区向等级农业社会转变的唯一重要因素。一定还有其他因素，例如工具制造技术。因此，第一世纪到七世纪之间也是农业演变的时期，使他们能够建立一个国家社会和政体。这种转变无疑是一个逐渐的过程，伴随着基于金属或铁的工具的发展。


    铁匠（`gusali`）和灌溉技术（`sawah`）可以通过强化驯化来转变并增加土地价值，使爪哇农业达到经济生产剩余。同时，在永久性市场（`peken`）中的商品交换（`nyaga`）可以在古代爪哇社会中发展，其各种专业技能丰富了他们的艺术、闲暇、娱乐和社交生活。那么，第一世纪到七世纪时期可以被认为是爪哇人发展其农业社会的形成时期。此外，这一定是家庭生产剩余面临土地和水资源高效管理必要性而受到挑战的时代。


    事实上，生产体系的转型和政治体系的变化是同时且相互发生的。定居概念从 `wanua` 到 `thani` 的转变是通过 `thani` 的生产逐渐实现的，其字面意思是基于灌溉系统（`sawah`）的耕作。土地的强化和高度复杂的水管理得到了发展。与巴厘灌溉协会（`subak`）不同，爪哇农民（`thani`）将水管理整合在乡村会议（`karaman`）中。尽管其名称在爪哇村庄可能不同，但其作为社区委员会的社会政治功能至今仍然存在。协调和分配水源以及水稻种植的互助成为会议的重要部分。


    当然，与水稻种植相关的仪式和活动也是会议工作的一部分。这包括咨询和协助。古代村委员会成员的组成不仅包括政治家和社区领袖，还包括专家和贸易人员。精神专家（`mpu`
    或 `dukun`）通过会议根据爪哇历书（`pewukon`）为种植、维护和收获水稻的仪式活动提供最佳时间的建议和指导。天气和历法专家被称为 `wariga`。他也是一位长者和村委员会的成员。

