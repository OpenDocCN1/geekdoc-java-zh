    对于传统的爪哇家庭来说，睡觉是在位于房屋内部靠近火炉（`pawon`）的平台（`amben`）上进行的。父母和孩子不在同一个平台上睡觉。然而，他们处于同一个区域内。如果家里有女孩，她们会在房屋的核心区域（`sentong`）拥有自己的睡觉平台。与此同时，男孩子们则睡在房屋前部分的平台上。尽管现代爪哇家庭大多住在西方风格的房屋中，但仍然留有
    `sentong` 的痕迹，这在传统上被用作备用的各自独立房间。他们可能将这种房间称为客房或 `mushola`。


    由于爪哇房屋的设计初衷是为了仪式和庆典，因此其空间大部分是没有固定墙壁的大厅。为了容纳房间而对布局进行的细化是在遇到现代性时才产生的。现代爪哇房屋保留了使用传统的
    `pendapa-pringitan-dalem` 三分法完美形式的特征。将活动调整到房屋的三个主要部分，已为了适应当代和城市的生活方式。


    在大多数情况下，大厅保持开放状态，没有墙壁。日常生活的用途是接待临时来访的客人。第二部分和第三部分通常整合为客厅、餐厅和卧室。厨房和茶水室通常设置在靠近仆人居住区的后部。现代爪哇房屋通常有一个采纳的游泳池和活动室。在最广泛的语境下，家的感觉不仅限于居住地。因为对于爪哇人来说，居住就是与他人共同生活，因此每个地方都有自己的灵，并且不仅局限于可见的，也包含了不可见的部分。没有任何地方是不包含灵的。根据爪哇信仰，地方是容器（`wadah`），而灵是其内容（`isi`）。这些灵（`danyang`）被认为守护着地方，使得每个地方在宇宙中都有自己的特征和目的。地球上没有真空的地方，因为灵像空气一样不可见，并融合了自然力量。这种信仰可以追溯到印度教佛教之前的爪哇，它对存在的力量表示尊重。爪哇人的重要场所与
    `angker` 的概念联系在一起，意味着神圣、庄严、神秘和受圣的。神圣之地有自己的守护灵，不允许人们伤害它们的领地。


    清理和建造自然场所是为了呈送仪式祭品（`sajen`）和仪式宴会（`slametan`），表达对它们存在的敬畏和尊重。祭品和宴会是为营造人类生活环境而进行的重大协商和许可。以水牛头作为牺牲的祭品用于定居点、桥梁和坝的建立。无论如何，祭品和宴会都是为了带来人类与其他生物之间的和谐关系。


    场所之所以有意义是因为它是众所周知的，因此集体记忆必然会被建立。爪哇文化中场所的集体记忆与精神领袖参与的事件和活动有关。爪哇人建立集体记忆的方式是在爪哇历的大日子里进行定期的集体访问。由于在爪哇语中，记忆被包含在
    `eling` 的概念中，意味着回想、意识、关注和正念，因此纪念地是用来提醒他们对精神领袖（`panutan`）的尊重，以感谢他们的祝福和仁慈。精神领袖的坟墓（`sarean`，意味着休息和睡眠的地方）被构想充满祝福的地方。由于在爪哇传统中，死亡从未被视为存在的终结，因此维护和保护纪念地实际上从未为了维持与亡者的个人关系而停止过工作。


    如果一个场所的事件和活动与其精神领袖（`panutan`）无关，那么它在爪哇人的集体记忆中就没有特殊位置。`panutan` 的理念是提醒人们带他们走向统一的领导和预言。`panutan`
    一词源于 `anut`，意思是跟随或遵循的词。`Anutan` 意味着教学、流派、纪律和信仰。在爪哇传统中，纪念地被理解为有迹（`patilasan`）的地方。


    `Patilasan` 源于词 `tilas`，意味着线索、痕迹、提示、残留和休息。纪念地（`patilasan`）与痕迹有什么关系？爪哇文化是否将纪念地视为让人们想起其领袖和教导的痕迹？这可能就是为什么当宗教活动在该场地发生时，纪念地具有意义的原因。


    为了仪式或对场所表示尊重的访问被视为 `sowan` 或 `ziarah`，即一次精神之旅。他们保留和维护的是一个提醒他们想起相关精神领袖的事件。活动发生的地点被视为
    `tilas`，被认为应该通过仪式恢复成一个完整的、有意义的世界。其他与其精神领袖的痕迹无关的地方不会被视为 `patilasan`，而是 `tengeran`，意味着地标或方向标记。


    各种地标所在的地方是城镇（`kitha` 或 `kuta`）。山脉和海洋是自然地标，传统上整合在城镇布局中以提供方向。大门（`plengkung`）和城墙（`baluwerti`）是清真寺和
    `alun-alun` 之外的地标。尽管在后殖民时代的爪哇城市有一些纪念碑，但传统上他们不会建造与其生活传统无关的纪念性建筑。城市中唯一的纪念碑是一个被称为
    `tugu` 的方尖碑雕塑。在日加卡市，这座建筑被用作参考点，而国王在他宫的前厅冥想时，会透过 `alun-alun` 沿着宫廷大道望。。爪哇人的城镇理念源于并发展自印度和东南亚大陆的经验：`kuta`，意味着被矩形墙和运河包围的场所。除了作为统治者的社会政治意义外，爪哇人将城镇理解为建立了
    `peken`（永久性五日市场）的场所。将 `kuta` 作为物理阐释的理念并未被严格采用。因此，自 8 世纪以来的爪哇城市很难重建。直到现在，普兰巴南和波罗浮主的遗迹仍然保持沉默，为我们提供了古代爪哇城镇结构的线索。我们仍在等待对
    8 世纪以来爪哇城镇起源和结构的发现。


    我们从爪哇人那里体验到，城镇是 `peken`（传统市场）、`alun-alun`（城镇广场）和 `kraton`（皇宫）或 `kabupaten`（县）的建立和维持。城镇生活中最重要的方面是
    `peken`。它的起源于动词 `mapeken`，意思是集会或见面和聚集。对于爪哇传统来说，其他国家也可能发生相同的情况，`peken`（市场）不仅是交易场所，也是社交互动和休闲的场所。爪哇传统中的休闲、赌博、娱乐和流行城市文化是从这种制度中发展出来的。另一方面，宫廷成为以记录形式和可持续系统保护和保存传统的文化机构。


