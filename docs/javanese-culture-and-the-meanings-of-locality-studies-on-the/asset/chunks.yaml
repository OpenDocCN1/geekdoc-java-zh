    of nature. The reality of life and the world for the Javanese is unconceivable
    without the accord and wholeness of sky and earth, male and female, form and content,
    as well as outside and inside (Yumarma 1996). Accordingly, the task of a work
    of art is the act of bringing everything different together toward unity, harmony,
    and sustainability. The fear of disintegration and disarray urges the necessity
    for unity, harmony, and sustainability. In return, every being has to have their
    proper place with unique and particular function and contribution to the Javanese
    world. Accordingly, there is no concept of otherness but the unknown or beyond
    the boundary of the Javanese world and language.


    Being an artist in the Javanese world is being in the proper position according
    to seniority, education, experience, maturity, and community service. The room
    for creative innovation and improvisation is to comply with the principle of harmony
    within the community. It implies that in the traditional way, individual freedom
    is likely out of question (Mulder 2005, p. 70).


    Javanese animism believes that every being is a container (wadah) containing cosmic
    power (Jiwa or isi). Respect (ngajeni) to other beings is demonstrated with offering
    (sajen, sesajen), a bunch of flowers and foods at periodic times within five days
    of the Javanese calendar. Burning incense is part of the ritual for such offerings.
    Such a practice pertains to ancient and pre-Hindu rituals, as a sign of respect
    to the ancestors and the invisible power in the cosmos. They believe in the wholeness
    that human work is nothing unless it is imbued with the power of nature that flows
    into the form (lair) as its content (bathin).'
