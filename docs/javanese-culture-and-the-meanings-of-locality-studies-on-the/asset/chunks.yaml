    # The Idea of Home in Javanese Tradition


    The idea of home in the Javanese tradition is considered inseparable from the
    search for `kalenggahan`, a respective seat as a socially established position
    on the earth. Sitting in Javanese tradition is always poetic in the sense of `lenggah`
    or `lungguh`. Its meaning is never out of touch with the reflexive idea of being
    among others. Here, sitting is not simply the sign of position in social life.
    Rather, sitting is to reflect the awareness of being part of whole society with
    a particular role and contribution. Its idiom pertains to one’s occupation and
    profession within the sense of hand (`hasta`). In association with hand, sitting
    becomes the sign of the capacity and competence to do something in society.


    ## The Seat and Occupation


    Sitting in Javanese culture is articulated with the word `lenggah`, literally
    meaning being at a permanent position to carry out a particular assignment in
    terms of `ngasta`. Hence, `lenggah` (sitting) is never out of commission of `ngasta`
    (occupation). Since sitting is actually a sociopolitically dwelling position,
    the relationship between seat and occupation does not only rely on job and responsibility.
    Rather, in the Javanese tradition, this relationship is more symbolic in the context
    of authority depicted from society as a cosmic mountain realm. Accordingly, the
    seat in society (`kaprajan`) has its own level and capacity for making action
    and decision concerning wholeness. State officials are highly regarded persons.
    Consequently, their houses seem to have demonstrated their rank and status. Traditional
    houses for high-rank state officials are provided with a front hall called `pendapa`.


    ## The Architecture of the Pendapa


    The hall (`pendapa`) is originally from the Sankrit loanword `mandapa`, meaning
    waiting hall in front of the temple. The establishment of `pendapa` is to demonstrate
    the rank and status of its owner in society. The simple hall is erected with a
    rectangular ground plan. The form and construction of the hall are called `joglo`,
    standing on four pillars called `sokoguru`, with its encircling sixteen columns.
    A simple `pendapa` has only a single crown (`brunjung`) and single robe (`penaggap`).
    The higher the rank and status of the owner in state bureaucracy, the more he
    can have its robes for his `pendapa`.


    The most important person in the Javanese tradition is the king (`ratu`). His
    halls (`bangsal`) are not only perfect `joglo` with two or three robes for its
    roof, but also vary in accommodating various rituals such as `bangsal witana`
    (reception hall), `bangsal kencana` (hall for court ceremony), `bangsal srimanganti`
    (hall for ritual visit to the king), `bangsal manis` (hall for court dining),
    and `bangsal trajumas` (hall for court wedding and court family rituals). Every
    building and hall in the Javanese house must have something to do with the necessity
    for rituals and ceremonies.


    ## Traditional Ways of Sitting


    The use of platforms for table and seat place is a longstanding tradition for
    public gathering, even in the court. Nevertheless, sitting as dwelling is a respective
    aspect of culture, in its daily actuality there is no indication that the use
    of furniture is a longstanding Javanese tradition. We do not find the authentic
    Javanese word for chair except the throne (`singasana`), which is only for the
    ruler or a powerful landlord. In some respect the place for sitting in Javanese
    tradition is on `patarana`.


    The `patarana` is, however, not the chair but a bank or platform (`amben`). As
    shown in the panels of Borobudur`s `Karmawibangga`, pre-colonial Javanese society
    did not sit on individual chairs but on the bank or on a platform. The art and
    arrangement of sitting are characterized with squatting (`sila`, literally meaning
    principle and fundamental). The concept of `sila` itself is originally Sankrit,
    but it has been elaborated in its use and context in the Javanese tradition as
    the respective position of sitting for assembly (`rembugan`) and social gathering
    for ritual feast (`njagong slametan`).


    ## Interior Space and Rituals


    It is not by accident that the Javanese home does not have any specific dining
    area with table and chairs. There is no part of the house plan dedicated to the
    activity of dining architecturally. Sitting on the floor is indicated by the use
    of carpet known `pranada` (Javanese Kawi word). Although there is no any indication
    that the use of furniture has been established in the home in ancient Java, the
    use of a mattress known as `prastarana` (Sanskrit) is evident.


    Architecturally, the pre-Islamic Javanese house might not have developed the use
    of furniture in its interior. Sitting on the ground or on the platform must have
    been the common case for pre-colonial Java. Beside the absence of furniture, pre-colonial
    Java must not have had established domains in its house realm with specific daily
    designations, such as bedroom, washroom, living room, dining room, etc.


    Even though the Javanese house seems to not have been designed primordially for
    daily living, there is the almost forgotten place for preparing the food for a
    ritual feast known as `prantunan`, originated from the word `rantun` meaning to
    stop by or to come over. Since the place does not have any architectural structure,
    but is determined by event, today its domain has fallen into oblivion.


    ## The Rear Area of the House


    The idea of `prantunan`, however, means the state of being impermanent. Actually,
    `prantunan` is dedicated to providing the house with a place for preparing a feast.
    If we look at the Javanese house of today, preparing food takes place in `pawon`,
    which is located at the rear part or side part of the house. The service area
    in the Javanese house is located in a relatively private and restricted zone.
    The Javanese tradition gives the name to the supporting part of the rituals with
    the word `wingking`, meaning rear or back. Kitchen, stall, storage, garage, laundry,
    and workshop belong to the rear category of the Javanese house. Visually, such
    buildings must have been arranged behind the house.


    Although privacy in the Javanese house does not reveal bluntly in association
    with room of activity, its phenomena manifest during mealtime. The inside and
    outside category comes into play when family members gather to have breakfast,
    lunch, and supper. In rural areas, family members sit together by squatting on
    the platform in the main room of the house. Meanwhile, in urban areas, the Javanese
    family father has his first turn for having the meal.


    ![](Images/Figure_4.2.jpg)


    Figure 4.2. Various sila sitting positions from a Karmawibangga gallery of Borobudur
    from the eighth century depicting the daily life in ancient Javanese society.
    Photo courtesy of Rudi Badil and Katalis Publishing (Badil 1989: 42).


    In the modern Javanese family, egalitarian dining has been fully accepted. However,
    they always keep respect to the father or older members of the family. They let
    the older persons in the house have their first turn for the meal. Of course,
    the fixed positions of sitting at a dining table must have been established as
    a part of family ritual. Father always has his position at the head of the table.
    Close to the father of the house is the lady of the house, who sits at the left
    side of her husband. In their traditional house, the family dining area is located
    in `dalem`. There is, however, no fixed room for dining. Importantly, the area
    where dining takes place will be prepared for other activities after the mealtime
    is done.

