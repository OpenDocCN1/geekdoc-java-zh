    The third boundary of the mancapat concept is called kuta negara, which is understood
    as the extension of the center in all directions. In order to establish the realm
    of negara, the ruler and his followers had to open the forest for settlement and
    agriculture, or to seize control of existing villages and hamlets and to claim
    all these under his land ownership. As a landlord, the ruler protects and controls
    villages and hamlets with a taxation system (upeti/upetya) and payment of religious
    homage (sowan dalem kaprabon).


    The fourth is the area of influence beyond the ruler’s land ownership, but under
    his/her protectorate system. The leaders of the protectorate region had to pay
    annual tribute (upeti) and to be present in state ceremonies (upacara negara).
    The protectorate region is the extension of his influence in terms of power (adidaya),
    charisma (wibawa), and reverence (wisesa) beyond his home seat or his own land.
    The areas are usually under other local rulers or his followers. The area is called
    negaragung (great state) and can be flexibly larger or smaller depending on the
    leadership and personal power of the ruler. Charismatic and strong leadership
    will increase the scope of spiritual influence. The boundary of negaragung is
    not always geographical territory (Miyazaki 1988, pp. 30, 164, 176; Laksono 1986,
    p. 64). It is actually constituted by acknowledgment of several landlords or regional
    rulers to the leadership of the ruler in terms of spiritual and political reverence.


    The fifth area is mancanegara, meaning beyond the ruler’s influence or abroad.
    The area of mancanegara is unlimited in number and location. However, mutual respect
    with exchange of ambassadors and trades is possible. The mancanegara is the concept
    of articulating the idea of the outside world or beyond the negara’s rule and
    order. The expansionist move of negara into the realm of mancanegara is in any
    chance possible. It has nothing to do with merely the political influence. Rather,
    it is about the extension of the cosmological realm of Javanese culture. Most
    Javanese rulers are historically expansionist in the need to affirm their cosmological
    seat as the representation of the supreme being on the earth. The Javanese people
    think and believe in their messianic mission that their culture is to javanize
    other people outside their realm. To javanize means to civilize according to Javanese
    values. In their delicacy, being Javanese is to adopt and practice the Javanese
    custom and tradition in terms of mature, polite, subtle, and refined.


    However, the border or boundary of mancapat in the context of negara is neither
    laid out with physical landmark nor with written document. The boundary is the
    event that is marked out by the use and practice the gradation of language, which
    is subtly oppressive in establishing the master/slave relationship. The Javanese
    people know the boundary in terms of addressing people they talk to. It is the
    event when respect and adoration are exercised.


    Negara as the Stage of the Ruler Cult


    Besides perishable materials and natural disasters—floods, earthquakes, and volcanic
    eruptions—the lack of intensive archaeological excavations in Java is one of the
    reasons for the difficulty in figuring out the early town-like structure of ancient
    Javanese settlements. The other reason lies in its conceptual basis that settlement
    remnants have not yet reflected the idea of negara as a political body. Ancient
    states might have been in a struggle of competition to establish perfect negara
    prior to Airlangga in the Kahuripan kingdom. It might be the reason why the ancient
    rulers until Mpu Sindok of the Medang kingdom had not yet successfully performed
    their cult of devaraja (Thakur 1986, p. 33; Vic 2005, p. 89).


    The cult of Indian Devaraja based on Tantric Sivaism could have been in effect
    in the Javanese concept of the ruler as part of Javanese adoption of Indic state
    polity. However, locally customized adoption could have modified the rituals and
    meanings. The concept of Gusti to address God and ruler is the apparent proof
    for the cult. Cosmologically, the Javanese concept of ruler holds that the king
    is the representative divinity on earth. Indeed, rulers of Javanese Hindu Kahuripan’s
    Airlangga as well as Majapahit’s Kertarajasa are carved and eternalized as Wisnu
    while Anusapati of Singasari is carved as the embodiment of Siva. Their monuments
    are nothing but an architecturally immortalized claim of representative divinity
    in the sense of manunggaling Gusti-kawula (blending unity of immortal and mortals).
    The concept of kawula is hard to translate. It is not simply about the ruled as
    servant or subordinate. The idea of Gusti-kawula is also not quite similar to
    the relationship between the shepherd and the sheep, but master and slave (Peacock
    1973, pp. 29, 158). Kawula is not only labor but also spiritual supporter, worshipper,
    follower, and believer, with fully submissive devotion. The unity of the ruler
    and the ruled is conceived by the Javanese culture—which is shaped and established
    by the status quo—as the reality of the world.


    Town in the Javanese language is kuta, literally meaning land or settlement surrounded
    by a wall. In reality, the walled territory only exists at its core in which the
    ruler resides. The sense of kuta is characterized by the seat of the state ruler
    or the king, which is perceived as the center of the cosmic system on the earth.
    Kuta negara is the capital or the center of the state realm in terms of cosmological
    and spiritual sense. It is to protect human settlements in the metaphysical sense
    by utilizing the illiteracy of people outside the court wall.


    As a cosmic center, kuta negara is a symbolic and spiritual source from which
    the authority and order radiates. Even though the core of kuta negara is an architecturally
    walled system of the ruler’s seat, the very idea of kuta negara is not always
    a territorially concentrated settlement. On the contrary, it is a borderless realm
    with a mandala imprint form at its center. Thus, the walled core of kuta negara
    has nothing to do with defense or security in the first place. It is originally
    a symbolic marking out of the cosmic center on earth as well as the radiance of
    the king’s power.'
