- fmt: '

    Economically, the state and urbanism needed revenue from various taxes (`pajeg`)
    and fines (`sukha dukha`). In the ancient Javanese Hindu-Buddhist Mataram era,
    revenues (`pangguhan`) were collected on an annual basis, consisting of property
    tax, husbandry tax, and rice cultivation tax. Taxation on a daily basis was collected
    from commercial transactions (`masawyawahara`) and crafts (`mistral`). According
    to `Watukura’s inscription of 902`, there were some other door-to-door contributions
    from people to the state on a regular basis for special occasions, such as the
    donation of flowers (`pangraga skar`) for the full month ceremony. State rituals
    and celebrations such as for `sima` were not only participated by local people,
    but also by foreigners and highly specialized skill persons (`wargga kilalan`),
    from Thailand (`siam`), Khemer (`kmir`), India (`kling`, `dravida`, `arya`), Sri
    Lanka (`singhala`), and representatives from other regions. The inscriptions never
    mention the Chinese as foreigners. Unlike local citizens (`warganegara`), all
    foreigners had to pay visa or domicile tax.


    ## The Cult of Devaraja


    Nevertheless, we have not yet found inscriptions from the eighth to tenth centuries
    that mention the likely Indic cult of `devaraja` from the Javanese rulers of `Samaratungga`,
    `Daksa`, `Balitung`, and `Sindok`. In his several inscriptions, even `Sindok`
    never declared himself with divine names such as `Indra`, `Isvara`, `Wisnu`, or
    `Narendra`. Instead, he used to call himself `Rakryan Mahapatih` or `Rakryan Mahamantri`,
    the indigenous word for chieftain with the highest authority. This shows us how
    the adoption of `Sankrit` Indic culture was very selective in favor of local pride
    and dignity. In other words, the Indic colonialization over Java or Indonesia
    was not the case in terms of political hegemony.


    Embracing of Indic religion was not simply by reason of similarities of spiritual
    tradition between Hinduism and pantheistic Animism. Rather, the adoption of the
    Indic tradition was because of the syncretic tradition of Austronesian culture.
    Accordingly, any influence should be considered as the subject to be learned and
    be brought under control as a Javanese asset, based on the belief of acculturation,
    which is shareable among Javanese people as `njawani` of being Javanese. Being
    Javanese is literally being cultivated, tolerant, and aware of circumstances.
    The adoption of Hinduism and Buddhism must have had nothing to do with Indic colonialism.
    Instead, the Sanskrit culture had tremendously enriched the native culture and
    tradition with the improvements in trade, statecraft, and literacy.


    ![](Images/Figure_2.7.jpg)


    Figure 2.7. A memorial visit by a group of girls to Caitya on the panel of Karmawibangga
    Borobudur from the eighth century. Photo courtesy of Rudi Badil and Katalis Publishing
    (Badil 1989: 66).


    From Indic culture, the Javanese `negara` learned to apply the concept of `mandala`
    in the context of wheel turner (`cakravartin`) after the displacement of the center
    from Central to East Java, prior to the reign of `Dharmawangsa`. In order to deploy
    `mandala`, landlords had to struggle for their hegemony over others. `mandala`
    was a metaphysical framework of `negara` as center in the cosmic constellation.
    It was actually for geographical defense against disintegration that a `negara`
    should be located at the center of four cardinal villages (`desa`). Perfect deployment
    of `mandala` required political and military supremacy. After having such supremacy,
    the support from religious clerics came into play for justification. Needless
    to say, esotericism, asceticism, and mysticism in the Javanese tradition have
    been part of the power establishment. In doing so, the rulers gained social detachment
    from their common people.


    The motive for the establishment of religious monuments (`candis`) might have
    been related to the achievement of consolidating several `negaras` under one control.
    However, the `Shailendra dynasty` (770–825 AD) and the `Sanjaya dynasty` (910–929
    AD) needed the support of the celestial group for their pride and achievement.
    In doing so, the rulers could demonstrate their personal ambitions under a religious
    umbrella. As a matter of fact, there was no evidence whatsoever from the inscriptions
    to confirm that monuments were the centers of religious life. Instead, the state
    rituals and ceremonies took place in the town square and at the seat of the ruler.
    Indeed, the monuments were visited by ancient people in terms of pilgrimage.


    Even though sociopolitically Javanese society had achieved complexity and a highly
    sophisticated system of state polity, it was difficult to find physical evidences
    of settlement with highly concentrated populations. How could the sophisticated
    monuments like `Prambanan` (ca. 856 AD) and `Borobudur` (ca. 790 AD) complex have
    been built without a spatially organized place for living settlement of large
    populations? Despite perishable materials and the latent threat of volcanic eruptions
    of `Mount Merapi` and `Mount Merbabu`, concentration of settlements would have
    been necessary to build monuments with such a large scale that took years or decades.
    However, it could have nothing to do with the political center or capital town.
    Rather, the concentration was conceptually temporary for the construction of the
    monuments, but it was not intended for urbanism. Such settlement was dissolved
    after the projects were done. Then the question is: What was the relationship
    of `negara` and its monuments, such as `Dharmatungga` and `Samaratungga` of the
    `Shailendra dynasty`, `Borobudur` and `Daksa` of the `Sanjaya dynasty`, and `Lara
    Jongrang` and `Prambanan`? What actually was `candi` for the early Javanese states?


    As mentioned earlier, the existence of `negara` as a spiritually unifying entity
    of its citizens (`paura`) did not exist without religious rituals (`caru` and
    `puja`). In order to experience the unity as an event, `negara` needed ceremonial
    and formal occasions in which collective union and commitment were displayed with
    splendid spectacle. The culmination of the event was about the self-gratification
    of the king or the queen, which was signified by the inauguration of his/her monument.
    The monuments in this regard were simply the vehicles of the rulers for immortalizing
    their legacy. More precisely, `candi` for Javanese rulers was more about the altar
    of their power than their devotion to people. Javanese rulers were mostly too
    proud of themselves and did not care for people outside their palace wall but
    for tax, tribute, loyalty, their state rituals, and ceremonies.


    Indeed, the presence of `caitya` was also symbolic as `mandala` or `prasada`.
    `Candi` as monumental architecture was visually more useful for orientation than
    for abstract religious purpose. As demonstrated in the panel of `Borobudur’s`
    `Karmawibangga`, `caitya` was not the meeting place for a congregation like a
    mosque or a church. Thus, the presence of `caitya` in ancient Java could have
    been simply a memorial structure (`tugu`), as perceived in the time prior to the
    Indic influence. Thus, a religious cult at the `caitya` must have ideologically
    sustained the indigenous beliefs, but it might have been restructured with Indic
    outfits and accessories.


    `caitya` in ancient Java could have provided the ancient Javanese society with
    a new altar to replace their Animistic `pepunden`, a sacred site with ziggurat
    form. Rituals related to `caitya` must have reminded people of the identity with
    their ancestors. Being reminded of their same origin and ancestors must have been
    the motive of the ancient Javanese people to build their `caitya` instead of any
    other religious intention.


    ![](Images/Figure_2.8.jpg)


    Figure 2.8. Candi Singasari with Shiva Buddha elements as embodiment of Kertanegara’s
    cult. Photo by Bagoes Wiryomartono.

