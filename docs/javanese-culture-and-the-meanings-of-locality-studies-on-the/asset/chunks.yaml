- fmt: '

    What is actually the purpose of the work of art in Javanese culture? As already
    mentioned, harmony and oneness are inseparable from the purpose of the Javanese
    world, that is, to beautify the being of beings as a whole. Beautifying the world
    (`memayu ayuning bhawana`) is essentially the purpose of all human work on earth.
    Accordingly, subsuming any individual want and need is the precondition for being
    able to dedicate all effort and endeavor to get into the law and principle of
    integration into wholeness. The integration is demonstrated with the quality of
    synthesis without losing traces of its authentic origin. The work as the manmade
    thing is conceived as a new being with its own power, which is in Javanese tradition
    called `greget` (Wibisono and Kurniasih 2002, p. 264).


    Any successful work of art is believed to have a spiritual power of `greget` (Suharto
    1998) that invokes intense human feelings and sensibility for empathy as well
    as for getting along with the audience. Under the notion of `greget`, the work
    of art is able to bring forth human experience with the sense of harmony within
    the whole composition. Correspondingly, any part in the system of work demonstrates
    its significant role and contribution to the whole story within the work.


    ### Perfection and Stability


    Perfection (`utuh`), stability (`jejeg`), and free from vested interest (`sepi
    ing pamrih`) belong to what Javanese culture considers aesthetically pleasing.
    In Javanese culture, perfection (`utuh, sampurna`) of the work is understood if
    the work is open-ended, in which the beginning and the end come into terms with
    an infinite cycle that grows from micro to macro cosmos. The ground of this perfection
    is based on the beliefs that every being is identical and contains the power of
    being. Without this identity, beings are not able to stand together as a whole.


    Stability (`jejeg`) is another condition of the work of art for being able to
    take part in the whole composition or system. Standing in line within natural
    laws is one important principle to achieve stability in composition. The notion
    of stability is also to address the work with essential quality that is not untruthful
    or hiding something. The concept of `jejeg` in the broadest sense of the word
    is applicable for somewhat persistent upholding adoration (`sajen`) and respectfulness
    (`kajen`). The work of art without stability is not respectful in the sense of
    characterlessness because it does not contain any constructive element and structure
    for being whole.


    ### Freedom from Interest


    Moreover, attaining what beauty is is necessarily free from any interest (`pamrih`)
    (Mulder 2005, p. 18). Interest never stands without the will to control, to hold,
    and to take into possession. Interest in the sense of `pamrih` is a selfish pursuit
    for one’s own advantage associated with disrespect to the whole welfare. In the
    work of art, interest endangers the stability of the Javanese world, which is
    established and sustained within the traditional structure of communal identity.
    Any individualistic profile and propensity that challenges traditional values
    may be considerably jeopardizing the collectively established community as well
    as oneness.


    Creative and innovative efforts of artists under the Javanese tradition are necessarily
    subtle and delicate in unveiling improvement and discovery by persistently working
    within the framework of respect to tradition. What is unfavorable for Javanese
    is not about the creativeness, but the excess of this creative capacity to the
    concept of self that may lead to the state of being overconfident as well as arrogant
    and ignorant. Nevertheless, the Javanese world has learned much from modernity
    to accommodate individual artistic endeavors with respect to local resources in
    the search for natural harmony and oneness through `nglaras`.


    ## Javanese Concepts of Aesthetics


    In a general way, the Javanese world for art is harmonious and whole in a good
    shape (`apik`) as long as there is no internal conflict within the work that leads
    us into confusion of meaning. Good (`apik`) is understood as somewhat complete
    and well-organized. The aesthetic concept of `apik` is to emphasize the necessity
    for order within the work that provides the elements with role and contribution
    to the whole.


    Moreover, the sense of `apik` is to invoke the feeling of an all right and favorable
    state of being. Within the sense of `apik` every element in the system is related
    to each other according to certain structures of role and contribution so that
    one for all and vice versa comes into being. In addition, `apik` is actually applicable
    for the logically interrelated system that enables the work to be qualified as
    the thing with a certain designation of meaning. Succinctly, `apik` is the underlying
    concept for something in orderly organization and perfect being.


    ### Rahayu and Ayu


    Only human being, not the work of art for the Javanese people is qualified to
    be beautiful if its effect on human being is healthy and delightful under the
    notion of `rahayu` or in concise `ayu`. The pleasure of `rahayu` lies in the capacity
    of the work of art to bring about a healthy sphere and influence to human being.
    `Rahayu` is an aesthetic concept for describing the quality of feminine being
    with elegant movement, well-proportioned posture and form, and compassionately
    emanating aura. In many cases, `ayu` or `rahayu` is also applicable to the work
    of art representing feminine being.


    As mentioned earlier, the sense of what beauty is for the Javanese people is not
    somewhat pleasurable in terms of self-indulgence. Rather, the sense of beauty
    is essentially experienced as the sense of being in wholeness in which self and
    others come into terms with spiritual identity. Accordingly, time collapses into
    infinity of spiritually inspiring silence (`hening`). The beautiful and peaceful
    are never divisible for Javanese aesthetics in terms of `rahayu`. It is neither
    about pretty or attractive things, nor about sensually and visually appealing
    things. The sense of `rahayu` as aesthetic experience is about being intact with
    the world as presence. It is the experience of being uplifting in tranquility.


    ### Gender in Aesthetics


    The opposite concept to `rahayu` is `ganteng`, describing the handsome and gentlemanly
    character for male being. However, `ganteng` is strangely applied for the work
    of art. The other concept related to male character for the work of art is `gagah`,
    meaning gallant, strong, and sturdy. Gender categories of aesthetic character
    are mostly applicable for human being. Other living beings are usually not qualified
    to fall into the male or female category for describing their gender character.


    Nevertheless, in the performing arts, such as `wyang wong`, feminine and masculine
    characters play an important role in revealing human character. Bridging the antagonistic
    category between male and female characters is, however, to be unveiled in the
    characters of `Srikandi` and `Puntadewa` in the epics of the Javanese versions
    of Mahabharata as well as `Sarpakanaka` and `Laksmana` in the epics of the Javanese
    version of Ramayana. `Srikandi` and `Sarpakanaka` are known as tough women with
    masculine traits, whereas `Puntadewa` and `Laksmana` are male with feminine characteristics.
    In sculpture, the embodiment of male-female in single form was found in the statue
    of `Ardhanari` from the Kediri area of East Java circa the twelfth century. The
    statue shows the hybrid figures of `Wisnu` and `Parvati`.

