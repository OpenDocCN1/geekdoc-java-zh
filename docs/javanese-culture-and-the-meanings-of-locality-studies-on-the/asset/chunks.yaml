    in Javanese culture, pleasure in the context of self-indulgence is considered
    immoral or an unethically proper experience. Beautiful music here is not somewhat
    pleasurable for being experienced on an individual basis. Rather, the music of
    gamelan orchestra is not performed as the main menu of Javanese entertainment,
    but as background, or back sound or supporting system for shadow puppet plays,
    dances, and ritual events. Of course, harmonious rhythm of pentatonic (slendro)
    as well heptatonic-pentatonic (pelog) gamelan music is highly regarded to enhance
    and to support the main performance with appropriate rhythmic pace, softness,
    and loudness, as well as depth and width.


    All over again, the aesthetic concept of apik is applicable for describing gamelan
    music with perfect quality of arrangement, performance, and composition. Music
    appreciation in the Javanese tradition is composed of the concept of nglaras,
    meaning to get along with the rhythmic pace of human walking. Going along with
    the rhythm of walking (mlaku) is essentially the Javanese way of dealing with
    time. Nglaras is nothing but putting the temporal structure of being in alignment
    with walking.


    Being as well as dwelling in Javanese culture is conceivably composed of the concept
    of walking (mlaku). Accordingly, temporality of being is signified rhythmically
    as naturally as possible. The purpose of the work of human being including art
    is to integrate into the rhythmic universe as experienced with the pace of walking
    in the sense of laku, lakon, nglakoni, meaning experiencing for being within the
    rhythm of heartbeat. The Javanese people experience this as the way to be in touch
    with the now immediately.


    Indeed, ups and downs as well as fast and slow belong to the variations of human
    walk through time. However, coming back to find the rhythm of walking is the Javanese
    way of being in the world within the concept of nglaras. Being as well as dwelling
    (lungguh, lenggah) is actually sitting to experience the rhythm of heartbeat while
    listening to what is coming. The task of being as well as living is not to achieve
    something under the need of self-actualization. Rather, for the Javanese people,
    the sense of being as well as living is able to bring forth what is coming and
    what is given within the framework of integration into the rhythm of heartbeat
    as experienced by walking through time. Where is the end of the Javanese journey?
    This question sounds trivial for Javanese culture because by being able to find
    the rhythm of life we are already within the end of what being as well as dwelling
    is. This is according the Javanese culture the essence of what beauty is. And
    the purpose of being is nothing but gratifying and beatifying the world (memayu
    ayuning bhawana) based on sensibility.


    In Javanese culture, being an artist is being part of the community with the Javanese
    aesthetic goal of being collective artwork. Artwork needs selfless dedication
    and devotion. It is not for glorifying the artist because the artist is simply
    the worker like any other laborers in the community. And the artwork should be
    a celebration of community. Even though the works of art in Javanese culture include
    many fields of literature, visual, and performance arts, wayang, batik, and gamelan
    are most the popular and representative works today.


    Wayang


    What is the aesthetics of wayang? Wayang is more than just a theater for Javanese
    culture and tradition. It is all about the philosophy of alive and contemporary
    political and social opinions. Even though the story of wayang performance is
    mostly depicted from the Indian epics of Ramayana and Mahabharata, the essential
    line of drama is about Javanese thought and ethics in a communicative way. The
    role and function of dhalang is a great communicator of Javanese ideals. Interestingly,
    sociopolitical affairs belong to the subject matter of the wayang performance.
    The occasion for dealing with the play represents the Javanese world in contemporary
    circumstances. The play is considered the shadow of the reality of the Javanese
    world. The word dhalang literally means the director, orator, and actor in a single
    role. The art of performing wayang is the art of making the Javanese world alive
    in the play. The resume of the play is obviously the prevailing of culture against
    rawness, greed, injustice, deception, complacency, and arrogance.


    ![](Images/Figure_1.2.jpg)


    Figure 1.2\. Shadow pupet play stage, wayang kulit, Collection of National Museum
    Indonesia. Photo by Bagoes Wiryomartono.


    Concerning aesthetics, dhalang plays a significant role in the aesthetic quality
    of performance. This includes his/her knowledge and skills on dramatic storytelling
    and current sociopolitical affairs. As a matter of fact, a good dhalang is a well-rounded
    artist with a critical sensibility for his/her contemporary world. His/her biting
    remarks, intelligent commentaries, and clever jokes on current affairs are needed
    in the midnight scenes when the punakawan (representative figures of commoner)
    come to the stage. In doing so, he/she does not make the audience bored or fall
    asleep from the beginning, at 9:00–10:00 p.m., to the end, at 4:00–5:00 a.m.


    At the opening scenes, an aesthetically well-considered wayang performance performs
    mostly and commonly a series of scenes depicting the ideal Javanese character
    in the form of satria. The ordinary world is commonly presented as the realm of
    chaos, disorder, and confusion as the consequence of greed, desire, and anger.
    The main character, a satria, is called to be in charge in response to the occasion.
    The story will be followed with the scenes depicting a series of ordeals of the
    satria: he/she has to prepare his/her knowledge (elmu), skills (kanugaran), and
    personal maturity (mantep satria) to enable him/her to restore the unity, harmony,
    and sustainability of the world.'
