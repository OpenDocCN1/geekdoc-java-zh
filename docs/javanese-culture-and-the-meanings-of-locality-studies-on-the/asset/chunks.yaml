  raw: 'Originally, purity as the state of being safe has been a traditional condition
    for a village. In order to ensure this state, villages in Java and most parts
    of Indonesia have to offer an involuntarily collective work for village care for
    hygienic and spiritual purpose. The work called bersih desa is actually not only
    cleaning, replacing, and repairing buildings and sanitations, but also spiritually
    replenishing and rejuvenating the village as the world. Bersih desa has a double
    purpose, which is for maintaining agricultural reproduction and for keeping hospitable
    relations with the local spirit world. The village communal meal (slametan or
    kenduri desa) is part of the care for village well-being and celebration. Indeed,
    bersih desa is the act of purification for the rebirth of the village as the world.
    All villagers are due to participate in the occasion. Only sick persons and children
    are free from active involvement. As a matter of fact, the act for the purification
    of the world is to maintain, to establish, and to sustain the unity of the ruler
    and the ruled as a whole.


    So far, the tradition of bersih desa has been in effect until today. The best
    time of bersih desa takes place in every village, towns and city in the archipelago
    as an integrated part of preparation for the annual commemoration of Indonesia’s
    Independence on August 17\. The day is the special event of the nation and state
    that potentially unifies and gathers all citizens as a whole. Villagers are encouraged
    and mobilized by local leaders for community service as well as for renovation
    for their homes and places. Various activities are performed with its peak on
    Independence Day.


    Historically, the festivity of Independence Day is deeply rooted in Singasari
    and Majapahit tradition. According to Negarakertagama, the festivals and celebrations
    were culminated during the reign of Hayam Wuruk that took place during the month
    of Caitra (March–April). The state held a grand meeting and reception of all tributes
    from its subordinate kingdoms, regions, and territories (Leur 1955, pp. 7–10).
    In the ancient Javanese period prior to ninth century, one such annual celebration
    was known as the sima ceremony. It is the time when lower kingdoms, regions, and
    territories of the state were due to pay homage, tributes, and taxes to the king.
    Their presence in the state capital was the sign of loyalty and obedience to the
    ruler.


    At any state occasion, the king or queen is actually the only spectator of his/her
    own show for his/her splendour, power, and gratification. Beyond him/her are the
    supporters and performers of the event. The director of the state theater is his
    highest rank of state priest, maharesi or mahapandita. The purpose of all these
    performances is likely nothing but the self-gratification of power, in the name
    of cosmic purification and the rebirth of the world. As a matter of fact, state
    occasions are the events that show who is “in” and “out” of the circle of power.
    For the ruling elites, the event is their show that the state and nation is in
    orderly structure (mapan), prosperous vitality (kerta raharja), and spiritually
    united (manunggal).


    Impediments of Reformasi


    As mentioned earlier, the concept of “clean” or “dirty” is not about moral value,
    but simply politically favorable or disapproved. During the New Order era, liberalism,
    communism, and socialism fell into the category of dirty, whereas centrist nationalism
    and state ideology’s loyalists were conceived by the regime as clean. Today and
    in the age of reformation, the mainstream and Indonesian elites still maintain
    the concept of “clean” and “dirty” based on the bottom line concept that “clean”
    or “dirty” has something to do with the mainstream ruling class. In this sense,
    danger (bahaya) is not simply unsafe and threatening for the nation or state,
    but to what extent its influence endangers the pride, patronage, and prophecy
    of the ruling mainstream.


    In dealing with danger, the mainstream ruling group will do everything it can
    in the name of the unity of state and nation. In Javanese language and tradition
    the practice for defeating an opponent is known as ahangkara, meaning absolutely
    dominating and putting under control. Traditionally, the Javanese ruler is entitled
    to have ahangkara because he/she is the one who represents the divine on earth
    for peace and order. In terms of kwasa or kuasa, the Javanese power will use all
    possible means to put everything under control on behalf of peace and order. One
    well-known tactic in the Javanese tradition is apus karma, or subtle scheme or
    approach. The personal life of the enemy will be studied to know his/her strengths
    and weaknesses. The enemy’s weaknesses includes maen (gambling), madon (love affairs),
    mabuk (drinking), maling (stealing and cheating), and madat (taking opium or drugs).
    The famous Javanese story on apus karma was practiced by Senapati. As the first
    king of Mataram (1584–1601) in Kotagede, he had to defeat his opponent Ki Ageng
    Mangir Wanabaya. Senapati sent his own daughter, Princess Pembayun, as a dancer
    to seduce Mangir and force him to pay homage to the king after their marriage.
    The king invited Mangir and Pembayun to visit his palace. In the kraton, Mangir
    was forced to submit his famous spear and to kneel down in front of his father-in-law.
    Senapati killed his son-in-law and buried his dead body in two parts, one in and
    on outside the kraton’s wall. In doing so, Senapati was able to eliminate the
    danger to his status quo. The message of this story is clear that the status quo
    does not care too much about family matters, violence, and cruelty; those who
    are against the status quo are due to face death because it is perceived as a
    disease for the unity and integrity of a state as a big and conformist family.


    For people in the archipelago, post-Suharto Indonesia is the era of reformation.
    Even though it is not clear in which direction the reformation was going, political
    leaders in the country—from nationalist, pragmatist outlook to Islamic fundamentalist
    followers—did agree on the notion of reformasi as a new beginning for post-Suharto
    Indonesia; it was the way out from the hegemonically despotic and paternalistic
    system. However, this was not the case. Under the presidency of Abdurachman Wahid
    (1999), the unity of state and nation of Indonesia was cosmologically considered
    as in crisis. The cause of this unrests and disarray was not from the opponent
    of the nation-state, but the chieftain of the state: Wahid as the president of
    Indonesia. In the Javanese perception, Wahid was supposedly not acting as a Javanese
    ruler who provides people with the sense of stability and harmony with careful
    judgments and subtle gestures. Instead, Gus Dur or Abdurrachman Wahid often made
    controversial statements and judgments that jeopardized the conformity and harmony
    of the Indonesian people.


    For the Javanese people, Wahid or Gus Dur is an anomaly and a temperamental figure
    that was not fit to be father figure of society. He was neither a father figure
    person (bapak, pamong praja) nor a subtly authoritative man (penguasa). In truth,
    regarding his mismanagement and administrative incompetence, Abdurachman Wahid
    was an unlikely president from the Javanese perspective of political culture.
    Despite his reactive and controversial comments on social and political issues,
    Gus Dur was a well-known Muslim leader with a moderate outlook. From the perspective
    of Javanese political culture, the removal of his presidency by the People’s Representative
    Assembly in 1999 was reasonable because he did not fit in the picture of the Javanese
    ruler. This was also the case for Habibie and Megawati. Concerning political culture,
    they were considered too weak to be Indonesian rulers, especially in dealing with
    oppositions and resistances (Forschee 2006, p. 22).'
