    society with a new altar to replace their Animistic pepunden, a sacred site with
    ziggurat form. Rituals related to caitya must have reminded people of the identity
    with their ancestors. Being reminded of their same origin and ancestors must have
    been the motive of the ancient Javanese people to build their caitya instead of
    any other religious intention.


    ![](Images/Figure_2.8.jpg)


    Figure 2.8\. Candi Singasari with Shiva Buddha elements as embodiment of Kertanegara’s
    cult. Photo by Bagoes Wiryomartono.'
