- fmt: '

    As mentioned earlier, Javanese people, however modern, believe in ancestral bless
    (`restu leluhur`), which has been molded into various religious attitudes and
    conducts. What lies beneath all efforts is the `semangat`, which is considerably
    manifested in various forms and names but one. Sukarno spoke of `semangat` in
    the context of liberation from colonialism and Indonesian nation building, whereas
    Suharto asserted `semangat` for national development. Thematically, it is the
    `semangat` that is persistently retrieved to bring about people into oneness.
    The rulers are the conductors for making the `semangat` manifest into actions
    and concerts. Since towns and cities must likely have been the stage for the rulers
    to perform their `semangat`, their architectural expressions and characteristics
    must have been embedded in the epochs associated with those in reign.


    Among coastal people in the archipelago, `semangat` has been ritually picked up
    from the ocean with the ceremony of `jamu laut` (entertaining the sea). In Javanese
    tradition, `semangat` has been conceived as `isi` in terms of `kesekten` (contain,
    essence, and charisma). The articulation of `semangat` in the daily life of towns
    and cities becomes a spiritually motivating credo for reminding citizens of their
    identity (`Forschee 2006, p. 85`). Being unified in a `semangat` enables the rulers
    to conduct their spectacles. All architectural efforts and resources must have
    mobilized within the framework of `semangat` to make its events.


    Monumental buildings, skyscrapers, and upscale facilities are the vehicle (`wahana`)
    of `semangat` for validating the charm of rulers in various state events. Sukarno
    and Suharto have built their charms as `pemimpin besar revolusi` (great leader
    of revolution) and `bapak pembangunan` (father of development). As done by the
    past rulers, the first and second presidents of Indonesia had entitled themselves
    with their own `semangat` that were conceived as their enlightenment. Then the
    image of towns and cities of Indonesia might have not simply been associated with
    its historical collage of buildings and parks. Rather, the urban image here is
    inseparable from the present `semangat` incorporated by its present rulers in
    the built environment. Accordingly, updating to the contemporary in most cases
    must be more preferable than holding and maintaining its memorial contents of
    the past.


    Change and transformation of the built environment are likely not the subject
    of formally legitimating system. Rather, in Indonesia they are the subject of
    relevance and harmonization with the `semangat` held by the ruler in reign. The
    incorporation of `semangat` in daily polity is in the form of ideology. Despite
    their various versions, the Indonesian rulers from Sukarno to Susilo Bambang Yudhoyono
    have exercised their `semangat` within the framework of an ascetically creed of
    state philosophy (`pancasila`). Even though after the fall of Suharto, rational
    movements of political groups for the rectification of state constitution of 1945
    have been made, there is likely nothing that will change with its state ideology
    (`pancasila`). The recent development in 2003 of the Indonesian polity shows us
    even more convincing evidence of the preservation of constitution and state ideology
    with the newly established state institution called `mahkah konstitusi` (the constitution
    court).


    Although power in Javanese or Indonesian culture is not an abstract formulation
    (`Anderson 2007, p. 5`), mystery and secrecy belong to its foundation. The purpose
    is clear, which is deeply rooted in the tradition of the ruler cult. To establish
    a center is, however, not merely to institute a settlement for concentration of
    populations as well as power. Rather, founding a center is to set up the place
    of happening where the ruler is able to mobilize people going to `alun-alun`.
    Establishing a center is neither the question of legitimacy nor authority. The
    question of ability to rule is the capacity for mobilizing people for his/her
    own sake: the self-cult. The problem of rulers in Indonesia seems not simply the
    competition for best idea or program. Rather, rulers used to have a single thought
    (`semangat`) that unifies people with charismatic appeal. Rhetoric and subtle
    cruelty are historically part of the method of this intentionality. Without having
    these capacities, they will be quickly forgotten without substantial and memorable
    legacy.


    ## Concluding Remarks


    In order to understand the Javanese town and state, it is necessary to discuss
    the concept of `kuta negara` in the context of Javanese cosmology. Accordingly,
    power is perceived as the light endowed by the ruler in the form of personal charisma
    and spiritual reverence. The light in this sense is not only incorporated in the
    leadership capacity of the ruler, but also endowed as courage and persistence
    in achieving the successful achievement. The powerful achievement is not about
    right or wrong in terms of justice, legitimacy, and law. It is properly said about
    ability to restore order and peace. A strong ruler is the one who is able to rise
    to the occasion for restoring the world from chaos and disintegration.


    The relation of power to territoriality is analogically like the source and its
    light on the ground. The brighter and stronger the light is, the larger and wider
    the influence of its power. The flexibility of light is not simply expansionist
    for physical and political domination, but it is more or less spiritual. First
    of all, it is about the idea of a bulb to bring everything under its light. In
    contrast to the Western idea of space and territory that is measurable and accountable
    as well as tangibly referential, the Javanese idea of domain and boundary is somewhat
    spatially symbolic and flexible. Territory in the Javanese sense is not a matter
    of area demarcation with a physically fixed boundary. It is rather a conceptually
    elastic area of spiritual and cosmic influence of the ruler. Charisma and political
    charm as well as spiritual appeal play very important roles in the concept of
    spatial influence. Since the intentionality of `negara` is the grand spectacle
    of power, building the city as a permanent structure is likely not in the interest
    of the ruler cult. Permanent structure does not support the flexible need of grandeur
    performance once in a lifetime. In other words, Javanese towns and cities are
    not built for their citizens but for their rulers. And the rulers understand cities
    and towns are nothing but their stage for their theater of power.


    ## Chapter Four


    ### Javanese Way of Living


    What is living in Javanese culture? This chapter attempts to search for meanings
    of ordinary life in the Javanese tradition. The chapter was carried out from the
    author’s personal life experience as a native Javanese and literary studies on
    Javanese culture and tradition. The focus of the chapter is to understand the
    relationship between the concepts and phenomena of the living world in daily life.
    The chapter will unfold and examine local concepts to find their relation to other
    concepts, that is, to unveil and dismantle the Javanese values and significances
    for their sense of home. In doing so, cultural locality is not to be just the
    site of happenings, but also the structure and resources that determine and work
    out the way of living.


    ### Living as Walking

