  trans: '


    与具有明显法西斯主义色彩的新秩序政权不同，改革时代（reformasi）的政党领导人在集体和个人上都致力于其运动中的自由与民主。然而，他们首要关注的仍然是建立各个领域的稳定。在他们看来，强有力的政府是必要的。这意味着他们将团结起来支持或倾向中间主义意识形态。他们不容忍任何右翼或左翼团体的成长和确立。`Wahid`
    的总统时期是这种倾向的最好范例；他反对了极可能具有左翼色彩的 `Megawati` 候选人身份。尽管 `Megawati` 最终在 2001 年取代了 `Wahid`，但她的政党并没有选择与中间派政党
    `Golkar`、`PAN` 和 `PKB` 合作，以维护印尼作为一个国家的统一与和谐。


    尽管如此，`Yudhoyono`、`Megawati` 和 `Joko Widodo-Jusuf Kalla` 在任何事情之前对单一国家和民族有着共同点。然而，在他们的政治议程中，没有任何一个字将普遍人权作为其主要的政治关注。人权的缺失——作为当前政府政治的主要议程——出乎意料地明显，因为此类问题将使当前政治赞助、自豪和预言的统一与稳定陷入危险。


    对改革结果的脱离和不满不可避免地在数量上增加，这从不确定选民的数字中可以看出；2009 年大选中的 `golput`（弃票）率高于 2014 年（[Detik.com](http://Detik.com)2014）。`Joko
    Widodo` 因素可能是原因所在；人们对参加投票的热情很高，因为 `Joko Widodo` 和 `Jusuf Kalla` 是拥有民粹计划的公众人物，且与新秩序政权没有直接关系。事实上，从
    1998 年至今已经取得了重大改革，特别是解放了新闻和媒体，使其生动地表达思想和事实。然而，该国大多数政党仍然安于这种古老的政治文化。改革的唯一真正支持者是新闻和媒体。新闻和媒体的作用和功能将成为改革中倡导和传播人权及民主（作为社会的支柱）的决定性因素。尽管如此，改革最重要的部分可能是国家与资本之间关系的转型（Robinson
    2009）。在社会文化方面，这种关系尚未基于公共问责的民主机制进行运作。直到最近，腐败案件显示出资本家与个人政治官僚之间的私人关系仍然变化较小。其根源在于爪哇人的世界观，即世界是由二元对立的统一构成的：`manunggaling
    Gusti lan kawula`；这一概念肯定了统治者（`ndara` 或 `bendara`）与被统治者（`kawula`）之间整体性。赞助者与客户之间的统一已以各种方式、形式、层次、时尚和风格融入了爪哇人的生活中。群岛上的其他民族在父子关系（`hubungan
    bapak-anak buah`）方面也共享这种二元统一的宇宙观。换句话之，赞助-客户关系从古代起一直在这印尼社会的各个方面运作。这是印尼迈向民主社会过程中的困境之一。


    ### 爪哇农村地区的赞助-客户纽带


    在爪哇农村地区，赞助-客户关系作为农业生产的一部分被实践。在爪哇村庄里，土地主与土地劳动者之间的赞助-客户关系在大家族的框架内建立了一种社会纽带。这种纽带构成了政治和经济合作，使得奴隶制度变得不再可能。然而，这并不意味着阶级的缺失，而是建立了一种阶级处理其关系并寻求政治和经济调和的形式（Robinson
    2009, p. 216）。爪哇村庄阶级斗争的垂直流动在爪哇农村并没有找到顺畅的（Wertheim 1969）。这是因为 `priyayi`（贵族）与 `kawula`（百姓）之间的赞助-客户关系已经发展成一种协同的系统，用于政治和经济的相互依赖。这样做使得阶级的界限变得模糊（Mortimer
    1969）。这种传统纽带的关键在于基于 `sanak-semanak`（亲属团结）的人际关系。在印尼语境下，这一原则被称为 `azas kekeluargaan`（家族原则）。爪哇人将赞助-客户（`priyayi-kawula`）的二元性视为一个在宇宙、政治和经济上运作的整体关系。爪哇人通过
    `gotong royong`（互助）和 `sambat soyo`（共同劳动）（Henley 2007）的实践来当这种社区应对危机、危险、自然灾害和其他公共工程时。爪哇人的集体流动不是关于阶级斗争，更多是关于维护他们作为社区的统一、完整和和谐。


    ### 城市赞助-客户关系


    在城市语境下，赞助-客户关系在政治和商业中发挥作用。赞助者控制资源的获取，而客户则负责担任工人、调解人、顾问、卫兵以及生产服务的支持者。荷兰殖民时期，贸易和商业活动主要落入当地中国商人手中（Wertheim
    1956）。政治家与商界之间的赞助-客户纽带从 `Suharto` 的新秩序时代持续到改革时代，根据透明国际组织 2014 年的《腐败感知指数》，该指数将印尼放在
    175 个国家中排第 107 位（Transparency International 2015）；同年有 629 起由 `Komisi Pemberantasan
    Korupsi`（反腐败委员会）处理的案件，涉及 3 名部长、45 名高级官员和一名高级议会议员（Hukum Online 2009）。印尼迈向民主社会的运动关键需要建立一个基于法律的赞助-客户关系框架。后苏哈托时期改革取得的成就是通过透明公平的公开选举实现的治理进程。从国家到地方政府业务的社会转型，尚未有效地从基于个人偏好的赞助-客户关系转向基于法律的民主联系。换言之，后苏哈托时代的印尼需要改变民众对赞助-客户二元性的文化认知。这就是
    `Joko Widodo` 在其 2014-2019 年政治议程中所理解的“思想革命”，因为它关乎人民从 `priyayi` 和 `kawula` 向平等公民的心态转型（[Kompas.com](http://Kompas.com)2014）。他并没有大声疾呼，但他的方式、风格、时尚和领导方法展示了什么是公民。


    ### 结语


    改革的问题本质在于 `bahasa Indonesia`（印尼语），它在许多方面都适应了自豪、赞助和预言的殿堂。古话说：“`bahasa menujukkan
    bangsa`”（语言反映民族）。似乎，任何反对家长制政治文化主流的运动都会面临带有创伤性污名的反击，如 1950-1955 年的不稳定民主时期和 1965
    年的反民粹主义共产主义那样的印记。尽管这两个历史事件的现实尚未被完全阐明和重构，但现状及其支持者声称对事实拥有文化霸权，以支持他们的主张，即自由主义和共产主义同样是不平等的危险。


