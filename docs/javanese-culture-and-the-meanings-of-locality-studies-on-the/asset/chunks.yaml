- fmt: "\n# Silence in Javanese Tradition\n\nSilence for the Javanese tradition is\
    \ not forthrightly the empty realm. Rather, silence is the realm in which abundant\
    \ creative power is. Oneness for Javanese culture must have been understood as\
    \ the reality of their world. For this reason, the purpose of living is not to\
    \ find the right or wrong path toward happiness. Rather, the purpose of living\
    \ is `sa’derma nglakoni`, walking along the course of being on earth for growing\
    \ with their understanding of wholeness. Hence, home for Javanese tradition is\
    \ never a physically attached realm, but it is a harmonious extension of holistically\
    \ embracing inner self (`batin`).\n\n## The Concept of Home\n\nThe very idea of\
    \ home in the Javanese tradition is constituted by the sense of being able to\
    \ listen to the voice of silence (`sepi`). Of course this is not a cliché credo\
    \ for the sake of mysticism, as is often accused of Javanese thought. For the\
    \ Javanese, silence is pre-conditional to come into the ability for absorbing\
    \ and witnessing the phenomena of beings in wholeness, in which every being reveals\
    \ in its own property and capacity ready to come into play in the worldly existing\
    \ system. \n\nIn incorporating silence, the Javanese house is characterized by\
    \ tranquility of interior sphere with ambient light and earthy color of wood.\
    \ Most materials used in the house are absorbent for color and light. The daily\
    \ Javanese sphere of home is likely dim, gloomy, mysterious, and portentous, instead\
    \ of vibrant, tumultuous, and cheerful.\n\n## Architecture and Atmosphere\n\n\
    How can home be? The Javanese house is characterized by tranquility of interior\
    \ sphere with ambient light and earthy color of wood. Most materials used in the\
    \ house are absorbent for color and light. The daily Javanese sphere of home is\
    \ likely dim, gloomy, mysterious, and portentous, instead of vibrant, tumultuous,\
    \ and cheerful.\n\nThe purpose of living is `sa’derma nglakoni`, walking along\
    \ the course of being on earth for growing with their understanding of wholeness.\
    \ Hence, home for Javanese tradition is never a physically attached realm, but\
    \ it is a harmonious extension of holistically embracing inner self (`batin`).\n\
