    ## 关于作者


    Bagoes Wiryomartono 博士是一位独立学者，目前任教于印尼拉瓦西普利塔哈拉潘大学（Pelita Harapan）设计学院并休假。Bagoes
    在印尼万隆理工学院获得建筑学学士学位，并于 1990 年在德国亚琛工业大学获得博士学位。他曾担任夏威夷檀鲁鲁东西方中心的建筑博士后研究员，以及华盛顿特区史密森尼学会的富莱特学者。他的教学和研究专长聚焦于东南亚和北美不同文化与传统的城市主义历史、理论和设计。他曾任万隆理工学院高级讲师（1981–1983，1993–2002）以及加拿大多伦多大学亚洲学院访问研究员（2003–2005）。他曾担任马来西亚科技大学（Universiti
    Teknologi Malaysia）建筑环境学院建筑系副教授（2010–2013）。


