- fmt: '

    For the ruling reigns, the establishment of `caitya` could have instituted the
    unity of `negara` (state) and its `kawula/paura` (citizens), which could enable
    them to mobilize their resources. Needless to say, `negara` without any religious-cultural
    affiliation seems to remain an abstract concept and untouchable. Since the sense
    of `negara` as power could be made concrete by monument building, `caitya` for
    ancient Javanese society could have provided them with a spiritually unified place
    that enabled them to collectively address their hope, adoration, blessings, and
    gratitude to something bigger than life.


    After the reign of `Sindok` from the tenth century on, `candis` were evident as
    the monuments of the great rulers’ legacy; for instances, `candi Gunung Kawi`
    for `Airlangga`, `candi Jago` for `A Arok`, `candi Kidal` for `Anusaphati` (1227–1248),
    and `candi Singasari` for `Kertanegara` (1254–1292). The question arises: What
    is the relation of `negara` to the `candis` as the monumental buildings of `negara`?


    According to `Mula Malurung`’s inscription plate `V-a` and `V-b`, there were several
    types of `candis` during the Singasari Kingdom: `thani bala` (monument of anti-bad
    luck), `sima` (freehold monument), `kalang` (artisan structure), `Kalagyan` (a
    village name), `kamulan` (shrine), `Kakurugan` (a village monument), `Kuti` (a
    village name), `biara` (monument of monastery), `Sala` (a village name), `parahyangan`
    (place of worship), and `karesian` (spiritual memorial structure). The contribution
    of `Singasari` to the architecture of `candi` is obviously a reinterpretation
    of its function as the ruler’s monument. The reigns of `Singasari` from `Ken Arok`
    to `Kertanegara` have transformed the function of `candi` from sacral and religious
    monuments to rulers’ memorial buildings.


    Since the displacement of Javanese Kingdoms from Central to East Java and especially
    after `Singasari`, the king’s legacy had been dignified with a monumental structure
    (`Muljana 2006, p. 64`). Given that power in Javanese culture was cosmic energy
    (`kesekten`), the cult of the ruler was immortalized with a monument that could
    have been the way of preserving this ascetic power. Although from the reign of
    `Majapahit` we have not found any large-scale monument, the last great Hindu emperor
    in the archipelago gave us the traces of urban settlement in Java. The remnants
    of `Majapahit` in `Trowulan` give us the most vivid example of a Javanese capital
    town where multilayered domains of center and highly sophisticated land use must
    have been deployed. Even though some `candis` at the `Trowulan` site could have
    been dedicated to its rulers, this devotion seems not to have been intended for
    their tombs or mausoleums. Most ashes of the rulers were sent to the ocean through
    the flow of the adjacent river.


    As mentioned earlier, the foreign influences have been mostly adopted by the Javanese
    culture in a syncretic way. However, some cases of local pride and dignity play
    an important role in the acculturation process. This was the case that had been
    shown by the `Queen Suhita` (1416–1459 AD) with her monument, `candi Sukuh`. She
    strongly resisted the spread of Islam in the fifteenth century. As the last empress
    of `Majapahit`, she built the `candi` with indigenous Javanese architecture that
    reinvented native built form prior to the influence of Indic culture. The design
    of `candi Sukuh` was based upon a ziggurat-like form or terraced sanctuary, `umpak
    pepunden`, originally with a `lingam-yoni` at its peak. Four stone ladders of
    the `candi` were designed to lead people from the ground to the top of the building
    with its rectangular pinnacle.


    ![](Images/Figure_2.9.jpg)


    Figure 2.9. `Candi Sukuh` from the fifteenth century situated at the slope of
    Mount Lawu east of Surakarta; it was considered the anticlimax and turning point
    from `candi` architecture with Indic influence to indigenous style and form. Photo
    by Bagoes Wiryomartono.


    Considering the decorative motifs of relief and sculpture embellishing the temple,
    an amalgam of late Hindu-Buddhist influence and Javanese megalithic monument was
    obviously carved. The form of the `candi` reminds people of the altar of ancestral
    cult in the Malayan-Javanese indigenous pantheistic Animism. Moreover, the sculptural
    elements and decorations of `candi Sukuh` depict the Javanese interpretation of
    characters of `Mahabharata` and Hindu-Buddhist gods with caricaturist and comedic
    scenes.


    The establishment of the states could be seen as the institutionalization of the
    personal cult of their rulers. It was politically accomplished after he had attained
    the sovereignty of power. However, the status of political hegemony was not complete
    without religious justification and public spectacle. Ritually, inaugurating himself
    as super king, `maharatu cakrawati` needed support from spiritual leaders that
    enabled him to perform his theater of power.


    ![](Images/Figure_2.10.jpg)


    Figure 2.10. Statue of `Airlangga` depicted as `Wisnu` from the eleventh century,
    Collection of Museum National Indonesia. Photo by Bagoes Wiryomartono.


    Religious rituals and ceremonies were the means and vehicle of power show off
    for self-gratification that the king was the god on earth. Religious processions
    and services were an effective way to gather public attention and participation
    with respectful, intentional, and solemn acts. Of course, public ecstasy was the
    peak of all these rituals and ceremonies that signified the dramatic event with
    a single resolution for the king only. It was the time when the ruler announced
    his new name with celestial title, such as `hyang`, `hulun`, `indra`, `narendra`,
    `mahadewa`. All this signified the personal cult of ruler as the representation
    of absolute authority on earth. In doing so, the king was conceived as an ascetic
    being and socially distanced himself from his people. Such a metaphysical distance
    created the sense of the king as a mysterious figure. The detachment worked well
    to terrorize and terrify people who wanted to challenge his hegemony. The purpose
    was clearly to make his people absolutely respect and adore him as absolute ruler.
    Needless to say, it is the easy way to maintain his hegemony and power as absolute
    ruler. The first encounter with the phenomenon of the cult of `devaraja` is evident
    with the statue of `Airlangga` depicted as incarnated `Wisnu` on `garuda`.


    ![](Images/Figure_2.11.jpg)


    Figure 2.11. The `Ratu Baka` or `Abhayasa Girivihara` site from circa ninth century
    situated on the hill with `lingga` at foreground and two gates at background.
    Photo by Bagoes Wiryomartono.


    Evidently, the rise and fall of `candis` as monuments of the rulers had been always
    in concert with the rise and fall of their states. The `candis` of the `Shailendras`
    and the `Sanjayas` in Central Java were drastically abandoned for centuries after
    its center of `negara` had been relocated to `Kediri` East Java by `Sindok` in
    911 AD. Although the available inscriptions mention the relationship between states
    and their `candis`, there is no any specific clue on their functions and services
    as places of worship. In most cases, `candi` for Javanese people had always been
    a memorial structure (`petilasan`) where people paid homage and tribute (`sesajen`)
    to their ancestors with incense (`dupa`) and foods on a regular basis.


    Based on the records of `Fa-hien`, a Chinese traveler who was in India from 399
    to 414, the architecture of temples in Java reached its finest achievement. During
    the `Guptas` reign, arts, literature, and architecture could have dispersed to
    Java and Sumatra through the missionary works of `Nalanda Brahmins` and Budhist
    monks (`bikhu`). One of the most famous Buddhist scholars in Java was `Kashmir
    Gunavarman`, who might have been working in Java until 421 AD before he continued
    his work in China until his death in Nanking in 467.

