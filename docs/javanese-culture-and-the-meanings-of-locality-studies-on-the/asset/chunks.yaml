    Batik


    Batik represents Javanese graphic design as well as painting. The art of batik
    is emphasized on the pattern dated back to pre–Hindu-Buddhist influence. Mbatik
    in the Javanese language means engraving and painting in details. Geometrical
    patterns with double spiral motifs are dominant. Its origin is presumably from
    the Dong-son metal work culture (Bulbeck 2004, pp. 428–39). Repetitive form and
    an earth color scheme on white cotton dominate the design of batik. However, black,
    brown, and dark yellow are foremost in most classic batik. The most important
    thing for classic batik design is to harmonize (nglaras) the pattern and color
    in a gentle and delicate manner. Indeed, the aesthetic questions of batik are
    simple, concerning its inspiring capacity with motifs and patterns, its rapturous
    energy of uniqueness, and its provocative abstraction of figures (McCabe-Elliot
    and Brake 2004, p. 198). Avoiding something bizarre and blunt in the composition
    is obvious. The message of batik is to celebrate the world in the background.
    Subtlety of festivity belongs to the purpose of what batik design is all about.


    Indeed, there are versions of batik design for occasional celebration and daily
    use. The daily clothes of ordinary people are lurik. The common people wear lurik
    instead of classic batik. Technically speaking lurik is ikat textile. The difference
    between batik and lurik is not only its pattern, but also its production method
    and process. By design, lurik is simple and less elaborate in pattern and color.
    This is understandable because of its weaving technique of single or double ikat.
    Most lurik have only simple line pattern and a dark indigo color. All this is
    to incorporate the notion of modesty (sa’ madya) in the life of common people.
    Wearing lurik is to identify oneself as commoner. In many cases, only priyayi
    (the ruling class) people wear batik. Even though it is not obvious in their appearances,
    subtlety in social status in Javanese culture and tradition is shown in the clothes
    they wear. The sense of nglaras is demonstrated with the way people wear in casual
    and formal occasions in which earth color and similar pattern come into play.


    Gamelan


    The other important work of art in Javanese tradition is gamelan music. The important
    thing for gamelan music is its interlocking tonal and rhythmic pattern. Extensive
    historical study on gamelan by Sumarsam confirms that this Javanese musical tradition
    has survived through various ages—from Hindu and Islam to colonial Dutch and modernity—because
    foreign elements and ideas are blended and imposed together in a harmonious way
    (Sumarsam 1995). As a matter of fact, such syncretism is and was not always smooth.
    Tensions between Hindu-Buddhist and Islamic elements were evident as depicted
    in Serat Cebolek. However, in terms of nglaras conflict resolutions have been
    subject to be worked out with intelligible adjustment and justification. The conflicts
    of ideas between Javanese gamelan and Islamic tradition has been subtly unfolded
    and explored by Javanese artists and writers in Serat Centhini, in which playing
    gamelan music and reciting Koran/Qur’an (ngaji dhikir) are thoughtfully identified,
    similarly compared, and reasonably justified (Patel 2008, pp. 325–56; Sutton 1991,
    p. 236).


    ![](Images/Figure_1.3.jpg)


    Figure 1.3\. Gamelan performance in modern setting of the Lippo Kemang Village,
    Jakarta 2013\. Photo by Bagoes Wiryomartono.


    Listening and playing to gamelan music is inseparable from the way of life in
    terms of walking (mlaku) and in terms of nglaras. Both activities are experienced
    as spiritually entertaining moments for recollection, awareness, and remembering
    (eling). Even though the music of gamelan is featured mainly with metallophones,
    xylophones, and gongs, the leading instrument is the drum (kendang), followed
    by bamboo flutes, bowed and plucked strings, and vocalists (sinden). Gamelan as
    traditional orchestra is mostly performed for special events of memorial celebration.
    The main function of gamelan music in Javanese culture is to nurture laras in
    terms of the unity and harmony of mind (jiwa), body (raga), and spirit (sukma),
    with cyclic patterns of predictable coincidences. The sense of living as walking
    and experiencing “the now” is performed with gamelan music. People sit on the
    floor by folding their legs while playing and listening to gamelan music. Traditionally,
    the performers and their listeners are together, relaxed but mindful. This is
    what nglaras in action is.


    Concluding Remarks


    Traditionally in Java, philosophy and artworks are indispensable from daily life.
    The works of art here are neither exclusive nor self-actualized. Rather, Javanese
    tradition and culture uphold artwork as collective works that preserve, develop,
    and sustain their traditional values on modesty, humility, and subtlety. Working
    on artistic things is inseparable from living in bringing forth everything toward
    harmony. This is the sense of what nglaras is all about. In daily life, the sense
    of nglaras is metaphorically experienced as walking. Walking (mlaku) is nothing
    but experiencing the now in infinite way on its own rhythm. It is the way to engage
    with the world based on the belief that being is sustained by gratitude (nrima)
    and compassion (asih). The purpose of artwork is nothing but to celebrate and
    contribute to the beautiful and peaceful world in terms of memayu ayuning bhawana.


    Moreover, the sense of nglaras is appreciation of the rhythm of life and alignment
    with the temporal environment. The core of activity for this artistic appreciation
    is actually to exercise the mode of thinking in receptive mode. In doing so, the
    Javanese people are trained to accept what it is without emotional and thoughtful
    resistance. The presence of the works in various forms, styles, manners, and fashions
    is not to take under control, but to let them show themselves as they are in their
    own characteristics and properties. The Javanese concept for this acceptance is
    ngematke, literally meaning observing, inspecting, listening, reading, and appreciating.


    Chapter Two


    Pra Kuta Negara


    Pre-Islamic States and Formative Urbanism in Java Indonesia'
