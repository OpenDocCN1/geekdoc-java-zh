  trans: '


    由于爪哇族文化在理论和实践上都是高度复杂的，因此模型的展示绝不是显而易见的，而是具有微妙的象征意义和暗示性。专制的家长式统治将通过各种战术和策略来培养。在爪哇传统中，这些方式广为人知的
    `disanake`（被像自己的孩子家人一样对待）和 `dijawake`（被像爪哇人一样被教育或驯化）。直白地说，这意味着这些人无论是否使用武力，都已根据爪哇的规范和礼仪受到了控制。因此，掌权者将通过诉诸国家作为统一系统的意图，来拥抱每一个潜在的反对者。他/她会竭尽全力，从源上消除并减少任何可能的抵抗和冲突。


    # 权力与不洁


    在印尼的语境下，纯洁（`bersih`, `resik`）与危险（`bahaya`, `baya`）既不是简单的道德事务范畴，也不是公共卫生的卫生价值。相反，在印尼政治文化中，它们是识别政权敌对个人或团体的关键问题。口号说
    `bersih diri bersih lingkungan`，字面意思是自我和环境纯洁于任何反对世界完整性的污染物。从这些词最广义的意义来说，信条意味着一种政治要求，即必须清除任何对现状的抵抗、分歧和反对的迹象。


    尽管纯洁（`bersih`）的概念是为了应对具有问责制的治理，但其概念起源在和谐世界的宇宙论意义上仍然具有道德意义。这种现象在日常政治中显而易见：为了国家和国家的统一而进行的治理，比基于法律秩序的治理更重要。换句话说，廉更多是为了建立一个没有任何反对的统一国家。此外，从印尼
    `kuasa`（权力）政治文化来看，纯洁的权威被视为强大且稳固的现状，能够稳定国家和统一系统。这里的“纯洁”感更多是指免受任何分裂和耻辱的疾病与病态，而不是腐败、勾结和任用亲信。


    在爪哇政治文化中，洁与危险通过一个概念在文化上相关，即基于 `kwasa/kuasa` 和 `prabhawa` 的权力。因此，纯洁与危险的问题既不关正义，也不关权力的合法性，而仅仅关乎它们与霸权积累和稳定的关系。这意味着统治者更多地关注如何将世界从不洁和危险中拯救出来。在爪哇传统中，危机传统被认为是新领导出现的机会；正如爪哇谚语所：`jer
    basuki mawa beya`，意味着没有代价就没有成就，没有危险就没有危机（雅加达战略与国际研究中心 1991）。


    通过武力和暴力夺权自古以来一直是常见做法，从桑贾亚（Sanjaya）和夏里延德（Shailendra）王朝到现代印尼国。`Ken Arok` 在 13 世纪杀杀了
    `Tunggul Ametung` 以从他手中获得权力。这种夺权让 `Tumapel` 陷入了危机。类似的情况也发生在 1965 年，当时 `Suharto`
    通过一份名为 `supersemar` 的神秘权力移交书中从 `Sukarno` 手中接过了权力（Roosa 2006）。在动荡之中，没有人质疑他何来上权的合法性。对于爪哇人来说，这种动荡或剧变被视为他们世界不洁的信号。人们的意图是等待危机的拯救者。`Suharto`
    巧妙地顺势而起。这种场合似乎在 1998 年再次发生，当时 `Suharto` 正在执国外。


    武装力量精英内部的权力斗争试图通过社会和政治动荡制造国家危机的场面，例如 `Trisakti` 事件和反华裔骚乱。事实上，当时政治和军事精英之间的内部权力斗争并未成功以一个获胜者结束。从爪哇政治文化的角度来看，原因显而易见，因为当时没有人能够扮演身披甲的骑士（`satria
    piningit`）的角色。在许多方面，1998 年的权力斗争并不是爪哇历史上的 `Ken Arok`、`Jaka Tingkir` 和 `Suharto`
    那样。尽管 1998 年的权力危机是夺取领导权的机会，但精英们未能利用这一事件，因为他们没有能力这样做。从爪哇的角度来看，`Habibie` 不是一个强大的统治者，`Wiranto`
    也不是一个坚强的领导者。另一方面，`Prabowo Subianto` 既不是一个有说服力的骑士，也不是一个鼓舞人心的组织者。尽管 `Wiranto` 处于接替
    `Suharto` 位置的位置，但他没有胆气和坚定的信心去这样做。此外，`Wiranto` 是 `Suharto` 的学生，对他应该一直保持感激和尊重（Emmerson
    1999, pp. 309–10）。


    事实上，印尼的政治文化是一个由现状塑造和建立的动态过程。在 `Suharto` 统治的最后十年里，这种政治文化面临着变革需求的挑战。由于 `Suharto`
    本人无法补充和纯化他的世界，他的光芒已经暗淡，而且由于 1998 年亚洲金融危机，他无法动员资源进行经济复苏。他辞去了统治者的身份，并不是因为某个丑闻意外，而是因为他意识到自己不再拥有作为权力之光所需的自尊和威严。他必须自愿交出位置，否则别人会以残酷的方式夺走。


    政治文化在决定什么是纯洁和危险方面起着重要作用。在爪哇传统中，推翻现状的人是能够恢复世界秩序的人，这在爪哇人中神话化地广为人知的 `satria piningit`（Soesetro
    and Al Arief 1999; Pamungkas 2008）。这种 `satria` 的一个重要角色不是傲慢。相反，他拥有常人的胆量来履行职责，并无情地对其主张他的权力。残酷、流血和暴力是这种主张的一部分。再次正如爪哇谚语所：`jer
    basuki mawa beya`（任何成功的成就都需要付出巨大的代价）。考虑到这一点，认为纯洁和危险是道德宗教问题将是错误的。相反，印尼政治文化中的权力一直是世界秩序和财富的来源。它在形而上学上集中并被视为景观中心。


    在印尼日常文化中行使权力并非关于道德对错（Geertz 1960, pp. 77–85; Hadiz and Dakhidae 2005, p. 239），而是关乎统治者对被统治者的自尊和威严。因此，统治者被视为完美的保护者、拯救者、导演和资助者。维护和建立形象免受弱点和缺陷的影响无论如何都非常重要。尽管如此，统治者与被统治者之间的个人距离是必要的；家长式的庇护可能是一种恰当的关系。在政治形式之外，这种二二元对立在日常生活中确实存在；统治阶级（`priyayi`）对于普通公民（`kawula`、`wong
    cilik`）在任何级别的社区活动中都保持着权力。


    '
- fmt: '

    The root of political culture of the societal dichotomy between the ruler and
    the ruled is historically shared, shaped, and cultivated among the Malay, Bugis,
    and Javanese people. The unity of the dualistic system is ideologically incorporated
    by the ruler with a `semangat` in the sense of a collectively purposive spirit.
    Both are considered essential in understanding how the ruler crafts their “imagined
    nation” and its establishment in real politics. `semangat` is the essence of political
    agenda in order to fulfill the intentionality of power as the light of his/her
    kingdom. Accordingly, `semangat` is somewhat unifying, encouraging, illuminating,
    inspiring, motivating, and mobilizing.


    `Negara` is nothing but the container and vehicle of `semangat` with two levels
    of practicality. First, it is at the real politics that `negara` is the state
    body of polity for national affairs in undertaking domestic economy, foreign relations,
    sociocultural matters, national security, and defense. Second, it is at the ideological
    level that `negara` is the means for transforming `semangat` into the spectacle
    of power. In order to achieve the grandeur spectacle of `negara`, `semangat`,
    as ideological content, is necessarily pure and cosmologically unitary. Purity
    and unity are necessary conditions for the mobilization of all resources, free
    from doubts and resistance.


    ### Ancient Political Culture


    The ancient political culture in the archipelago was rooted in Austronesian `wanua`,
    a concept of village republic as the world, which was traditionally established
    by paternalistic leadership with the support of dualistic and antagonistic groups:
    the landlords and elders. `semangat` fuels and imbues the village world with a
    unitary concept of cosmological aesthetics. Accordingly, unity and harmony are
    identical with the beautiful and prosperous world. Across the archipelago, the
    spirit of unity (`utuh`) and conformity (`mufakat`) are evident among ethnic groups
    of Aceh, Malay, Java, Minangkabau, and Bugis. Errington calls these societies—with
    former Indic states—centrist archipelagoes because they are preoccupied with unity
    and view fracture and divisiveness as either the result or cause or both of personal
    illness, community misfortune, or political failure (Pamberton 1994, p. 243).


    In the Indonesian context, `semangat` is deeply rooted in the ancient belief of
    the unitary power of state (`negara`) and nation (`bangsa`). Unsurprisingly, the
    modern state of `negara` incorporates `semangat` as state ideology of `pancasila`.
    `semangat` is perceived as spiritually motivating and emotionally moving people
    toward unity and integrity. Based on the beliefs in `semangat`, there are three
    principles that stand out as the virtues of Indonesian traditional political culture.


    ### Three Principles of Indonesian Political Culture


    #### First: Harmonious Unity

    Harmonious unity is conceived as the basic principle of political culture in the
    archipelago. The intentionality of the political world is to bring people together
    as a reality of house and home. In discussing the political ideas, issues, and
    affairs, political elites have to keep in mind that unity (`kesatuan`) and harmony
    (`selaras`) in the community are not put at stake (`taruhan`) and at risk (`bahaya`).
    Unity and harmony are conceived to be indivisible. They are traditionally maintained
    as the sense of community (`hakekat bermarakat`). Any move to disintegration and
    discordance is considered against the system as well as the world. In many ways,
    any new idea and influence will be tested within their consequence, whether for
    solid and strong community or disarray and disintegration.


    #### Second: Strong and Firm Leadership

    Strong and firm leadership (`pimpinan kuat dan tegas`) is always in demand. It
    does not matter whether it is right or wrong, but simply that it is about real
    politics that work for the interest of the mainstream or the elites. Strong and
    firm leadership is conceived as the spearhead of the community in moving forward
    for their pride (`kapriyaian/priyayi`, `harga diri`) and prestige (`kaprajan`,
    `gengsi`) as nation and homeland. A leader is respectful because he/she is not
    only restrained, brave, and a risk taker, but also never hesitant in making decisions.
    It does not matter that he/she is stubborn (`keras kepala`) or cruel (`keji`)
    to their enemies. A leader is someone who is able to lead people to make them
    proud of themselves as nation and respected as a country; they do not really care
    about how such a leader comes to power in terms of a legitimate way or not.


    In many ways, the demand for strong leadership could lead people to a fascist
    nation with blindly patriotic fanaticism as demonstrated by Sukarno (1945–1967)
    and Suharto (1967–1998). Such early indication of nationalistic populism has been
    noticeable in recent Indonesia under the reformation era, as shown by the formation
    of populist and anti-liberal movements from Megawati’s Democratic Party of Indonesia
    in the Struggle and Gerakan Indonesia Raya Party, `Gerindra`, in 2007 under the
    leadership of Prabowo Subianto.


    #### Third: Searching for Common Ground

    Searching for common ground is the aim and the light at the end of the tunnel
    of any political deliberation, otherwise strong and authoritative leadership will
    take charge to determine the goal. Searching for common ground is usually conducted
    with meetings and deliberations (`musyawarah`). Consensus, called `mufakat`, is
    actually neither achieved with deliberations nor with negotiations that are principally
    to set aside any interest against the political mainstream. Traditionally, `musyawarah`
    is a paternalistic persuasion and education of elders to those who are still not
    on the political mainstream. And `mufakat` is actually acceptance to be on board
    with the mainstream. Again, it is not about proper or improper, but simply the
    necessity for keeping the image and pride of unity and respect to the status quo.


    ### Consensus and Power


    In many ways, consensus is the Holy Grail of Indonesian politics in order to achieve
    the homogeneity of power. Since power (`kuasa`, `kekuasaan`) is conceived as politically
    controlling and dominating authority, unity of mind is the necessary outcome.
    There are many ways to achieve a consensus. The most favorable is creating a common
    enemy in terms of ideology or political stream. In doing so, the power has public
    justification to do everything they ought to do for their status quo, with purity
    and danger as their categorical norms.


    Based on the three characteristics mentioned earlier, Indonesian political tradition
    is culturally apt to paternalistic patronage, which is based on privilege of nobility
    and seniority of age. The patronage is in many ways pyramidal with hierarchical
    structure. Young leaders are not able to go further only on the basis of achievements.
    They have to convince their elders of their capacity to lead during the crises.
    Otherwise, they have to wait for a good chance to come.


    ### Impurity and Cosmological Totality


    Purity and danger are concepts of power to justify the three values of the political
    culture mentioned above. Politically, purity (`bersih`) means neither correct
    nor proper, but simply right on the track in line with the currently working ideology
    and hegemony. Despite the diversity of faiths, ethnicities, and origins, the world
    as a political reality is conceived as a homogenous system of hegemony. The source
    of this homogenous hegemony is unknown but believed to be spiritual energy called
    `semangat` or `kesekten` in the Javanese tradition.

