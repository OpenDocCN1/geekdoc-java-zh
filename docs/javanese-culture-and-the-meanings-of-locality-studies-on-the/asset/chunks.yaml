    # Javanese Culture and Living Philosophy


    Linguistically, the region of Javanese dwelling culture used to be situated in
    Central and East Java. However, today the realm of Javanese culture has, for the
    most part, established Indonesian lifestyle. Javanese customs are considered predominant
    not merely because of their overriding populations spread out in the archipelago,
    but also because Javanese people occupy most of the key positions in Indonesian
    polity from local, regional, to national bureaucracy. Regarding its geopolitical
    context, the Javanese dwelling tradition and culture must have been established
    for the most part in the Indonesian way of life. Likewise, it would not be an
    exaggeration to say that Javanese influence in Indonesian living tradition is
    stipulated with its culturally assimilating leadership in shaping and establishing
    a national cultural identity.


    ## The Javanese Way of Living: Wayang


    What is the Javanese way of living? The best entry point for studying the Javanese
    way of life is probably from the idea and performance of the Javanese shadow puppet
    plays, `wayang`. Most Javanese people must have known and experienced `wayang`
    performance as part of their cultural education because it is considered their
    living philosophy and religion. Regarding this strategic importance, `wayang`
    becomes the best medium of power relation. Most religions—`Hinduism`, `Buddhism`,
    `Christianity`, and `Islam`—and ideologies—`Liberalism`, `Marxist-Communist`,
    `Socialism`, and `Pancasasm`—in Java have never utilized `wayang` as their ideological
    propaganda medium (McVey 1986; Taylor et al. 1991, p. 22). What is important in
    the `wayang` performance is not simply storytelling because the date and procedure
    of the occasion have to fulfill certain rituals and feasts. To a certain extent,
    the preparation of the performance is not simply technical, but also full of mystical
    aspects, which are sophisticated and mysterious. Moreover, the most valuable of
    the performance is its capacity as the spiritual messenger of the Javanese ideals
    for ethics and aesthetics. Regarding this capacity, political leaders and their
    ideological machinery try to use `wayang` performance for their political interest
    and agenda.


    ## The Ideals of Satria and Priyayi


    There is nothing more important in their lives than being a Javanese. Being Javanese
    is to articulate the quality of behavior of `satria` in `wayang` performance,
    which is behaviorally perfect in terms of kindness, fineness, courteousness, politeness,
    hospitability, cordiality, gentleness, and respectfulness. The ideals of `satria`
    are, of course, more than that because it is a figure and model of leader with
    knightly self-disciplined manners and an ideologically convincing personality.
    The five `pandawa` knights in the Epics of `Mahabarata` are probably the most
    representative figures of Javanese `satria`. Indeed, the figure of `satria` is
    not always a perfect and handsome person like `Arjuna` or `Gatotkaca`. `Hanuman`,
    `Subali`, `Sugriwa`, and `Srikandi` are also considered `satria`, though their
    physical properties do not belong to a male human. What is important to emphasize
    in the Javanese culture is that `satria` is a `halus` (cultivated) person with
    the capacity of a hero. In the minds of Javanese, being `halus` is a sign of power
    that requires the acts and trainings for the concentration of energy (Anderson
    2007, p. 39). The `satria`’s culture and tradition are well known by the Javanese
    people in terms of `priyayi`’s milieu or gentry. The `priyayi` people set apart
    from the rest of Javanese society because of their traditional privileges in terms
    of education, power relation, and social standing in the state bureaucracy.


    Even though the majority of Javanese society is not the `priyayi` people, this
    elite group plays an important role in shaping and developing the system of values
    and norms in almost all aspects of the Javanese world, from economy and politics
    to sociocultural life. The most classical part of the performance of `wayang`
    depicts the Javanese `priyayi`’s world. However, the voice of ordinary people
    (`wong cilik`, or `rakyat`), plays an important segment in the whole performance
    when the servants, `punakawan-Semar`, `Petruk`, `Gareng`, and `Bagong`, have the
    words to say. The performance tries to portray the mythological messages of the
    `priyayi` and the contemporary issues in a continuous storyline. However, the
    whole idea of the `wayang` story and performance is inseparable from the necessity
    for depicting life as a story of walking (`lakon`).


    ## The Concept of Lakon and Laku


    `Lakon` in its conceptual capacity is the story of life that transforms the Javanese
    world from chaos to orderly system. The word `lakon` is derived from `laku` meaning
    walking, behaving, and going on stride. Despite its chaotic and devastating beginning,
    the Javanese life is a story of struggle for walking the line that transforms
    rudeness and impertinence to fineness and greatness.


    Place in the Javanese tradition is grasped as the characteristic site where events
    and daily activities take place. The Javanese place is meaningless without any
    relation to `laku` (walk, behavior, action, and role of actors) or `lakon` (plot,
    scenario, story, and performance). As any performance, the significance of place
    is always associated with the `lakon` enacted. As shown in the shadow puppet play
    (`wayang kulit`), the idea of place is inseparable from the events and its role
    maker, not the edifice of the place. Building and dwelling are nothing but `nglakoni`
    as well as living. `Nglakoni` is derived from the words `laku` and `lakon`. How
    to build and to dwell is associated with the necessity for going for a walk and
    walking through time.


    The other meanings of `lakon` are experiencing a journey or trip; life is a sojourn
    for having a drink (`urip mung mampir ngombe`). The question is: What is actually
    the destination of such journey (`lakon`)? How is it possible to find home if
    living means walking through time? Since in Javanese tradition the purpose of
    living is never more clearly formulated than walking through time, it must have
    been suggested to consider whiling away as the essence of dwelling. How can we
    enjoy the time if we do not understand our being?


    ## The Journey Towards Oneness


    The question concerning being (`ana`) has always been understood by the Javanese
    tradition in the context of experiencing oneness (`manunggal`). Accordingly, the
    aim of living is not to establish a permanent place, but it is essentially to
    enable people to experience oneness at any level of representation. After all
    this, the Javanese people call such achievement `kelakon`, meaning having been
    experienced and gone through. What lies behind the concept of `kelakon`? Regarding
    dwelling is a walking through. `Kelakon` is the light at the end of the tunnel
    of living that is actually being on the safe track. The destination itself is
    oneness, not to speak of individual profile and achievement. In other words, there
    is no place for an egoistically established cult in Javanese tradition but the
    ruler. The concept of ruler itself is fundamentally established as the center
    of dwelling that brings about the existing oneness to grow. Needless to say the
    impact of the cult of center has led the Javanese people to immortalize their
    rulers, instead of commemorating their being as well as walking on the safe track.


    Given that, the Javanese people perceive building and dwelling in the sense of
    means for being on the move in terms of walking, is the meaning of the built environment
    they build simply a vehicle of moving forward? Walking as a matter of fact is
    the act of moving on rhythmic stride. The sense of Javanese walking (`mlaku`)
    lies in the steady and consistent pace; it is a movement without hesitation and
    hurry, but simply doing the move joyfully and constantly. In its essence, `mlaku`
    is experiencing the moments with continuous acceptance of the circumstances (`sumarah`)
    without worry and ready to deal with any situation with patience (`sabra`) and
    perseverance (`tawakal`). All these concepts are derived from Arabic words, but
    the content is a philosophically Javanese Hindu-Buddhist way of transcending ego
    into emptiness in terms of `anatman`.

