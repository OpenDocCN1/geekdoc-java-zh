    与作为高雅文化中心的宫廷相比，市场更具平等性，这一点从适用语言的使用中显而易见地看出。城市文化的发展大多基于表达和交流的自由。无论市场与自发性、世俗和粗俗有何种联系，爪哇一个城镇的市场实际上是社会文化和经济生活的中心。尽管宫廷的存在从未离开过爪哇人的关注，但爪哇人公共世界的现实并不存在于其宫廷，而是存在于他们的集市（peken）中。


    # 第五章：爪哇人的骄傲、庇护与预言


    ## 印度尼西亚的政治文化


    尽管`reformasi` 在印尼的政治制度上取得了一些变化，但社会正义的发展在今天几乎没有实现。为什么呢？本章认为，无论谁执政，都没有将印度尼西亚转向基于民主和社会正义的公民社会，因为他们专制家长主义的政治文化尚未发生根本性改变。这个最大的群岛国家公民社会的问题在于其文化价值观从等级封建主义向民主的转型。迄为止，该群岛的现状仍然固执地维持着基于庇护、骄傲和预言的古代价值观，这些价值观违背了权力和平等的民主概念。占主地位的爪哇传统——塑造和建立印度尼西亚政治文化的来源——一直是各个层次和场合民主化进程的一个挑战性因素。本章试图探索政治文化的某些方面和元素，这些因素可能会减缓并阻碍基于法治的公民民主社会的改革议程。


    ### 印度尼西亚语境下的爪哇文化


    最初，政治改革（`reformasi`）的重要议程之一是开展印度尼西亚整体的转型；它包含了政治、官僚、司法和社会体系中的权力关系。的事实是，`reformasi`
    尚未从根本上改变该国家存在裙族主义、腐败和勾结的政治文化。因此，贫困、不平等和滥用权力每天仍然显而易见，且大多数没有法律后果。基于法治的社会秩序在很大程度上受到了行政、立法和司法系统中宗主制机构的挑战。


    问题在于，为什么民主化进程难以将印度尼西亚推向公民社会。哪些实际力量可以削弱印度尼西亚的民主化？爪哇政治文化在印度尼西亚作为一个国家和民族的现实中占据多大程度的主导地位？这些问题引导本章仔细审视在历史上塑造和建立了印度尼西亚国家和社会的政治文化的本质和根源。此外，本章试图揭示在印度尼西亚社会中运作、塑造、建立和维持政治文化的权力维度。


    除了政治和历史事件外，地方概念及其背景成为本研究的主要参考来源。由于其语境的独创性，地方概念在理论和文本解释方面具有不可或缺的重要性。汉斯·乔治·伽达默尔（1976/2008）指出语言与生活世界之间关系的重要性，这为我们提供了历史意识。因此，人类以及社会都是语言性生物。那么，地方知识的重要性在于地方语言作为其社会资源丰富系统的能力，这使他们能够成长并发展自己的文化和传统。这一事实对于人类学和哲学研究来说并不新鲜。克利福德·格尔茨（1983）开创了基于地方概念及其与社会文化现象关系的印度尼西亚研究。许多学者（Bicker
    et al. 2004）对地方知识的意义进行了进一步探索，展示了其在应对全球危机的潜力资源。


    本章的重点是揭露并拆解与权力关系现象和思想相关的地方概念。本章将强调对这些概念在政治事务中呈现的分析。在此过程中，政治和语言在概念上与它们的文化和社会是不可分割的。许多学者已经对后苏哈托时期印度尼西亚政治进行了研究（Emmerson
    1999; Budiman et al. 1999; Bertrand 2004; Bertrand 2013; O’Rourke 2002; Eklof
    2002; Metzner 2000; Bunte and Ulfen 2008; Nyman 2006）。他们的著作不仅对于理解该国民主的发展很重要，也为我们的进一步调查提供了新视野。其中之一是发现政治发展与现有政治文化之间的关系，这种文化主要受到爪哇传统的影响。在被苏哈托政权压迫了三十多年后，`1998`
    年的改革无疑是印度尼西亚民主新时代的开始，尽管这无疑充满了挑战和不确定性。改革被重新定义和重新评估政治文化的元素和结构，以走向一个开放民主的社会。


    印度尼西亚社会在历史和社会上是分裂的；它由统治阶级（`priyayis`, `penguasa`）和人民（`rakyat`, `hamba`）组成。这种对立系统在印尼社会中处于潜意识的运作，从村庄到首都，从古代一直延续至今。由于二元制度一直运作到今天，国家政治的渠道仅限于精英（Anderson
    2007, pp. 1–69）；这种文化不容忍任何反对。基层政治传统上被视为国家及其权威的威胁和疾病。


    尽管荷兰学者已经发现二元组织原则是一种运作于大多数印度尼西亚族群的古代社会结构（Adam and Anwar 2005, p. 336; Jo-Sears
    1993, pp. 123–25），但当代关于印度尼西亚政治的研究较少关注这种普遍的分裂。在一个社会政治分裂的群体中，政治制度的改变不会自动转型其政治文化，除非整个社会结构发生变化；这在后苏哈托时代的印度尼西亚不太可能发生，特别是在梅加维蒂、苏西洛·班班·尤多约诺和佐科·维维多执政期间。Nyman
    在其 2006 年的研究中指出，1998 年`reformasi`之后，没有为印度尼西亚未来的民主转型制定官方计划。佐科·维多多在其在其总统议程`Nawacita`——九大重点（Kurniawati
    2015）中没有对民主社会的方向和转型做出具体的说明；他的议程是建立良好治理。


    ## 作为理论思考的政治文化


    印尼研究中文化与政治的关系既不是新方法，也不是新领域。本尼迪克·安德森（1972/2007）是介绍爪哇政治文化在印度尼西亚政治中重要性的著名学者（Suryadinata
    2002; Anderson 2006）。因此，爪哇文化中的权力观念是直到今天印尼政治中社会秩序和理想的来源和参考。爪哇文化在印度尼西亚政治中的主导地位在日常权力关系中显而易见；爪哇式的礼仪和举止在官僚机构和教育机构中作为无声的语言被实践。

