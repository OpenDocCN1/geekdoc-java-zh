    # 爪哇的创造与存在哲学


    万物的创造被构想为与他人（包括无形的力量）共同运作。能够从地上创造并组合某些事物，并不是将人类视为存在的主宰。爪哇人相信，人造物对于从宇宙向形式的能量转移是不可或缺的。因此，这种转移需要谨慎和尊重的方式来处理。这并非出于道德考量，自然而然，这是关于对存在的意识与记忆，被称为
    `eling`（觉）。`eling` 的状态被视为一种能够根据尊重（`hormat`, `ngajeni`）和尊严（`praja`, `kaprajan`）倾听并行动的精神状态。爪哇人从小接受训练，要实现安全健康的方法不仅是忠诚（`mituhu`）和诚实（`jujur`），还要培养内在力量感（`mantep
    bathin`）。这种训练通过禁食（`pasa`）和简朴的生活（`prihatin`）来执行。这一切都是为了提高对营养和欲望的自我控制能力。能够区分需求与欲望是爪哇文化训练的核心。在许多情况下，这种训练的结果是让人们变得不那么武断，且不那么自发。


    ## 社会行为与文化认同


    回避表达情感和想法是爪哇人中常见的现象。在这里，人类行为中的良好与美之处在于微妙。外来人留下的印象是爪哇人是冷淡的，因为他们太礼貌了，有时会被误解。当然，如果被个人要求，有一种方法可以唤起爪哇人的参与。


    从文化上说，爪哇传统是根据“什么是爪哇人”的概念发展的；即：伦理上的谦卑（`andah asor`）、尊重他人（`ngajeni`）以及文化上的修养（`alus`）（Sutton
    1991, p. 21; Hughes-Freeland 2008, p. 82）。简而言之，作为爪哇意味着相对于其他存在（无论实体还是无形）而为人。因此，任何关于时间存在的决定都被构想为一种基于礼貌举止和尊重语言的某种伦理文明之路。它关乎将原始、粗糙和自然的事物变得精致、微妙和文化化。


    ## 自我控制与性格


    对自我控制的强化训练塑造并建立了爪哇人的性格，这种性格在许多方面作为倾听者和读者比作为演讲者更自在。传统上，资历和经验在交流中起着非常重要的作用。通常，资历也会阻碍和阻良好美好事物的展现。然而，爪哇人相信美丽的揭示是不可避免的。这只是时间问题。耐心接受（`sabar
    nrima`）是爪哇传统中内在力量练习的一部分。一切美好的事物都会由于世界和社区的需要而出现，这被称为 `rahayuning jagad`（世界的和谐）。


    在艺术作品系统内的创造事物对于成为爪哇人的目的是不可或缺的。换句话说，创造事物是将某些事物从自然的原始状态带入文化加工后的状态。从概念上讲，作为爪哇人就是将资源从自然的原始状态带到世界上。作为艺术作品资源的自然，不受人类理性和行动的支配。爪哇人处理自然的方式是基于感性（`rasa`）揭示其潜力，使其接近人类之手。


    ## Rasa 的概念


    爪哇语中的感性由梵语借词 `rasa` 组成，字面意思是美学上的敏感和理智上的共情。爪哇意义上的 `rasa` 不仅仅是某种感觉。相反，它是关于一种自觉的美学体验，不仅关乎感性，还关乎意义（Geertz
    1960, pp. 235–58; Benamou 1998）。在 `rasa` 的概念下，仔细听的行为成为处理任何存在现象的原始规定，无论是心灵的洞察还是世界的现实。能够倾听在让
    `rasa` 与即将显现的事物保持完好的行为中具有某种决定性意义。在这一概念下，人与世界的关系更多地依赖于直觉，而不是对他者的理性的怀疑。通过这样做，人类与自然/资源更处于行动的即时场景中，而与主客体关系立场并不关联。这种关系在某种程度上是基于寻找完整性过程中的相互作用；它是通过技术（`makarya`）相互揭示实现的。


    ## 赞助人与职业艺术家


    爪哇社会的艺术家大多依靠他们与赞助人的关系生活。皇宫之外，统治阶级（`priyayi`）和商人主导了传统的影戏（`wayang`）表演赞助。赞助人根据合同邀请（`nanggap`）表演艺术家（`wayang`、剧团、舞者、歌手、音乐家等）。成年礼等仪式——如割礼、婚礼和丰收感恩节——是合同客户最常见的场合。直到今天，为家庭场合和庆祝活动邀请职业艺术家仍然是爪哇村民传统客户关系的一部分。关于职业艺术家生活和工作的经典描述，可能可以在
    `Serat Centhini` 中找到，特别是对自由职业艺术家 `cebolang` 的描述（Anderson 2006, pp. 171–289; Santoso
    et al., 2006）。尽管 `Serat Centhini` 的作者是在 1814 年开始的 `Pakubuwana V` 的命令和指导下创作的，但故事中的爪哇世界远离皇宫。


    ## 廷艺术家的历史背景


    自古代，爪哇宫廷艺术家和作家一直是国家官僚的一部分。他们的尊称为 `mpu`，意味着具有特定文学或艺术才能的智者。在国家/皇宫的背景下，艺术家与客户（尤其是国王）的关系不可或缺地关于权力的赞助。所有作品大多是统治王朝的兴趣和观点。在阿尔拉加国王统治之前，几乎没有关于创作了存世建筑、壁画、诗歌（`kakawin`）、甘美兰乐曲、舞蹈、故事（`babad`）和文学（`susastera`）的艺术家或作家名字。阿尔拉加于
    1019 年成为 `Kahuripan` 的第一位国王，并通过与三齐腊和和在东爪哇建立了权力。在他的统治期间（1019 年–1049 年），阿尔拉加通过强有领导力和宗教宽容巩固了权力。


    泗逸里周边的物理和铭文证据证实了阿尔拉加统治时期的文学活动。除了经典的《罗摩衍那》和《摩诃婆罗多》的爪哇版本外，阿尔拉加执政可能是第一次由爪哇作家 `Mpu
    Kanwa` 用古爪哇语创作文学作品。`Kanwa` 写了《Arjuna Wiwaha》，描绘了阿周那的婚姻，而阿周那正崇拜阿尔拉加为世间的湿奴化身。在阿尔拉加时期，艺术家/作家与统治者之间的关系显然是为了权力的自豪感及其国家意识形态。赞助持续到了三达和满者时期，特别是在
    `Hayam Wuruk` 统治时期（1350 年–1389 年）。


