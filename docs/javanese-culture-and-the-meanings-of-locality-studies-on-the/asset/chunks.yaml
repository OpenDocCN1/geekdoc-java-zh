- fmt: '

    Although activities related to alun-alun in Hindu-Buddhist Javanese tradition
    had not yet been described in detail, legends and traces of its relationship with
    `kedaton/prabayeksa` and `candi` were recognizable from court rituals and performances.
    In daily life, `alun-alun` must have remained empty because its spatiality and
    structure did not show any trace of public amusement and trade. The center of
    urbanism did not take place in the town square, but in the market (`peken`). Based
    on its current design, location, and position, `alun-alun` is a sacred square
    with two banyan trees at its center point that divide the axis of the `kedaton`
    symmetrically. The sacredness of `alun-alun` lies in its restricted use only for
    ceremonial purposes, instead of public use as a park or for amusement.


    The other ancient trace of the origin of urbanism is religious cults and rituals
    demonstrating the affiliation between state and its citizens. As a politically
    organized entity, `negara` is the umbrella of its citizens. Symbolically, the
    banyan tree with its steadily sheltering structure at the center of the square
    represents the idea of shelter (`pengayom`) of people. `Alun-alun` has always
    been the stage where the rulers have an opportunity to show off their celestial
    performance and affiliation with clerics. Donating and worshipping must have been
    done by the rulers in `alun-alun`. In doing so, the benevolence and glory of the
    God represented by the ruler could have been demonstrated conspicuously. All this
    is made possible by state ceremony and ritual.


    Although the concentration of populations occurred during the `Singasari` and
    `Majapahit` reigns, its already-urbanized sites of settlement did not leave us
    with any indication of insufficient resources. `Singasari` and `Trowulan` are
    located in a fertile plain with well-developed wet rice cultivation. In Javanese
    tradition, the disappearance of the political is conceived not simply as the dwindling
    light, but also as the relocation of the radiance of power to somewhere else.
    The former state capitals of `Singasari` and `Majapahit` remain empty and have
    been gradually demolished through time because there is no light anymore. It is,
    however, not the case for the former capital towns of Islamic Javanese states,
    for example `Kotagede`, `Plered`, `Kartasura`, `Demak`, `Jepara`, `Banten`, and
    `Cirebon`.


    Identifying himself with the highest transcendence, the king must have been in
    constant need of validation of his lordly whim as the representation of the supreme
    being on earth. `Airlangga` in the Javanese tradition was well known as the first
    Javanese ruler who had successfully fulfilled his duty as king of `cakravartin`.
    Identifying themselves with the lord of mountain, `Shiva` and `Wisnu` for most
    Javanese Hindu kings could have been articulated with the royal title of `Iswara`,
    `Narendra`, `Hyang`, `Wisnu`, etc.


    In dealing with the relationship between the importance of `sawah` and the sustenance
    of `negara` we necessarily trace back its origin from the court ritual and ceremony
    of offering `gunungan` (Daniels 2009, p. 25). The Javanese myth of the benevolence
    of rice, marriage, and fertility is in association with the Hindu goddess `Dewi
    Sri`, the wife of the god `Wisnu`. The model of cosmological mount, `Mahameru`
    made of rice decorated finely with meats, vegetables, and fruits is called `tumpeng`
    or `gunungan`, for Javanese people is not simply to articulate their thankfulness
    for their well-being. Rather, the `tumpeng` is the vivid reminder of the birth
    of cosmological wholeness that opens the world. The word `gunungan` is to articulate
    the prelude of the birth of cosmos. Traditionally, the figure of `gunungan` is
    used for the opening performance of puppet shadow plays (`wayang kulit`). Does
    offering a couple `gunungan` for the state ritual of `grebeg` have to do with
    the rebirth of the Javanese world? As a matter of fact the rebirth is a celebrating
    the occasion in which the relationship between the ruler and the people is demonstratively
    shown as the relation of the giver to the receiver.


    The origin of `gunungan`, delivered by `Yogyakarta` and `Surakarta` courts, dates
    back to the myth of the Hindu sacred mount `Mahameru`, which is still believed
    by the Javanese people as the celestial image. Furthermore, the `gunungan` reminds
    people of the abode where their ancestors sit in their immortality. Beside its
    festivity, the state ritual and ceremony of offering large `tumpeng` or `gunungan`
    are likely the moments of truth for the Javanese people to realize their admiration
    and loyalty to the state as well as the world. The `grebeg` ceremony takes place
    every great day of Islam: the `Ied Fitri` and `Haj` or `Ied Adha`. During the
    ritual (`upacara grebeg`), the mound of rice (`gunungan`) is carried from the
    court to the mosque by passing through the public square (`alun-alun`), so that
    the cosmological relationship between religious center, mosque, and sociopolitical
    centre (`kraton`) comes into being for unity and oneness (`manunggal`).


    The importance of rice cultivation has been incorporated in the traditional offering
    for any event and occasion articulating origin, initiation, commencement, and
    sustenance of oneness of home. Regardless of its transformation from Hindu-Buddhist
    to Islamic institution—from `pura` to `mosque` and from `puri` to `kraton`—the
    origin of `grebeg` might have been deeply rooted in ancient Javanese tradition
    associating the benevolence of rice for fertility, nourishment, and sustenance
    with the rebirth of state (`negara`) as well as that of cosmos.


    `Sultan Agung Hanyokrokusumo` (1613–1645) was well known as the initiator and
    conductor of the `grebeg` ritual for the Javanese `Mataram` kingdom. He synthesized
    ancient indigenous pantheistic `Animism`, Hindu-Buddhist and Islamic tradition
    based on Javanese wisdom. Nevertheless, `Sultan Agung` was not the first king
    who enacted the dual role of state as the highest commander of the armed forces
    (`senapati`) and the highest religious leader and principal theologian (`panatagama`),
    but his grandfather, `Panembahan Senapati`, who founded the Islamic Javanese `Mataram`
    in `Kotagede` around 1575. Despite Islam forbidding any supremacy of metaphysics
    but God, the Javanese ruler still claims his metaphysical privilege as the best
    theologian.


    ### Negara under Islamic Influence


    Ideologically, Islam has not totally transformed the Javanese idea of power from
    the cult of the king to the abstract concept of supreme being. However, Islam
    has gradually diminished the centrality of the king’s metaphysical domination
    with Arabic literacy and its egalitarian doctrine on humanism. Islam was widely
    accepted by the people at coastal areas (`pasisir`) because their lives did not
    matter too much for the kingship and its despotic tradition. As mentioned earlier,
    Javanese court elites such as `walisanga` and other rulers—`Senapati` and `Agung`—acculturated
    Islamic teaching into Javanese culture, by means of their persuasive media of
    `pewayangan`. In doing so, the status quo was still in good shape in guarding
    their interest in the ruler cult.


    The peaceful spread of Islamic influence through coastal traders to the hinterland
    of Java and Sumatra brought about the change and transformation of religious institutions.
    Islamic states came into being in the mostly coastal port towns, such as Pasai,
    `Demak`, `Kudus`, `Jepara`, `Bantam`, `Jayakarta`, `Cirebon`, `Surabaya`, and
    `Makassar`. Architecturally, the Islamic capital town was not very different from
    its Hindu-Buddhist predecessor. The difference was only the replacement of `candi`
    or `pura` by `mosque`. The trace of Hindu-Buddhist influence in its architecture
    is still apparent as shown in the `Demak`, `Jepara`, and `Kudus` mosque. Despite
    the fact that many modern mosques deploy dome form for their roofs, the use of
    Mount `Meru`-like forms for the roof is still a common tradition for the mosques
    in several Indonesian towns. The pile up parasol-pyramidal form of roof reflects
    the practice of syncretism in architecture.

