- fmt: '

    Actually, the messages of `punakawans` are the voices of people in responding
    to the current situation concerning social and political affairs. Regardless of
    its political affiliation, `dhalang` is supposed to bring his audiences into emphatic
    togetherness. Again and again, the message for the exigency of solidarity and
    unity is delivered by `dhalang` in a rhetorical manner. In the Javanese world
    this emphatic phenomenon of togetherness is understood as `luruh`. The concept
    of `luruh` designates the necessity for being submissive in front of the wholeness.
    Bringing people into awareness of oneness seems to have been established with
    `wayang` performance from generation to generation. Then the house becomes the
    center of the Javanese world during the all-night `wayang` performance.


    ## House as a Work of Art

    House as a work of art is conceived in the Javanese tradition as an exertion that
    makes a contribution to the sustenance of wholeness under the notion of work as
    `karya`. Since work as `karya` is somewhat useful in enriching our world as the
    totality of beings, artists in the Javanese tradition are more or less wholeness
    workers that bring the events of oneness into being as truth. Consequently, the
    higher the worth of the work incorporating the world in its oneness, the more
    sacred is its presence. Court heirlooms (`pusaka dalem`) are the finest works
    of art and the most sacred things for the Javanese state.


    ## Architecture and Rituals

    Architecturally, the very idea of `dalem` does not have its essential denotation
    without having heirlooms such as `draggers` (`kris`) at its central innermost
    room (`sentong tengah`). Being covered and imbued with mysticism, the finest works
    of art are well associated with amulets (`aji-aji`) and the highest knowledge
    (`kesekten`). Every Friday `kliwon` evening of the Javanese calendar, all heirlooms
    of the house are subject to cleaning with flowered water. Of course, the smoke
    of burning `dupa` (incense) and reciting `mantra` from the `Al Qur’an`s verses
    belong to the ritual of the cleanup ceremony. The Almighty God, gods, ancestors,
    and all benevolent spirits are included within the wish list and thankfulness
    after reciting the mantras.


    The relationship between house and the appreciation for the works of art is thought
    to be the heirlooms that keep and guard the family from bad luck. Collecting other
    fine art might have been considered a part of sustaining its capacity as heirlooms
    handed down from parents to their children. That the house contains heirlooms
    (`pusaka`) in the Javanese tradition is considered essential for reminding of
    their ancestors. A house (`omah`) without any heirlooms is considered a container
    (`wadah`) without content (`isi`). The sacred room (`sentong`) might have been
    established as the altar of the house.


    ## Design and Creativity

    Being obsessed with the exigency of oneness brings about a collectively established
    way of expression in the arts. Design based on free idea is not considered to
    be fit in the Javanese community because of its strong commitment to individual
    style and performance. However, there is no proper word for design in the Javanese
    language. The nearly translated word for design is `ngrancang`, originated from
    the word `ancang`, meaning to take a step. `Anang` in building construction is
    the condition of being prepared for further action.


    Evidently, the design profession has not had an appropriate place in the traditional
    community except in the `kraton`. Needless to say, in the past creative and innovative
    individuals would have worked under pseudonyms or under the king’s name. Independent
    artists today may not belong to the Javanese court community, but they could have
    been considered the sustenance of the Javanese tradition regarding their way of
    holistic thinking based on `nglaras` (harmonizing with others). Hence, creativity
    and innovation are welcomed in Javanese culture within the framework of cultivating
    everything that is to improve and to elaborate indigenous traits and characters.


    ## Artistic Values and Principles

    Assertiveness and overconfidence are unlikely Javanese artistic building expressions.
    Although most of Javanese literate people are, by their tradition and language,
    well-trained thinkers, stillness, persistence, and modesty become the signs of
    their scholarship. It must have been seen that enormous innovation was not accepted
    in Javanese tradition without traditionally shared values for the exigency of
    wholeness. The aesthetic charge that works in the architecture of settlement is
    in the exigency and framework of oneness (`manunggal`) in which the principles
    of conformity (`cocok`), modesty (`sa’madya`), respect for others (`tepa selira`),
    and peaceful togetherness (`guyub`), and harmony (`rukun`) come into important
    play in the composition, expression, construction, and habitation.


    Regarding its strong commitment in conformity, to have a seat in Javanese society
    is to be fit in its conventionality delivered by its tradition and its language.
    Being strange and odd in Javanese tradition is perceived as `nyeleneh`, meaning
    crazy and loss of common sense. The principles of conformity, mutual respect,
    and harmony seem to have established in Javanese works of art whether in `gamelan`,
    music (`karawitan`), literature (`sastra`), shadow puppet show (`wayang`), batik,
    blacksmith, or in architecture. Harmony, modesty, mutual respect, and conformity
    are predominant and predetermined condition in the Javanese works of composition.
    The Javanese make these conditions within a single formulation: `runtut`, meaning
    to be proper and step by step for striving for the best and the ultimate.


    The Javanese people are trained with their language to follow step-by-step courteous
    action based on respect for others. According to `runtut`, there must be no stone
    unturned for paying homage and respect to any step and person intact on the way
    toward goal. Thus, following the principle of oneness for works of composition
    is to stick with a proper procedure (`runtut`) in which respect, cooperative,
    and collaboration are highly encouraged and promoted. Arrogance, impudence, and
    underestimation might have been necessarily avoided and discouraged. The beauty
    in this sense is not somewhat explosive, individual, and solitary. Rather, it
    is to some extent musical and orchestral.


    ## Aesthetics and Perception

    The access to recognize the beautiful thing is made possible by `rasa`, the concept
    of articulating feelings and emotions with respect to harmonious totality. Architecturally,
    a beautiful building is constituted by its harmonious proportions and modest expression
    that lead toward elegance, insightfulness, maturity, and modesty. The Javanese
    artistic way is likely to cook everything raw toward its ripeness gradually but
    persistently. Rush, hurry, and scurry are not likely Javanese. Instead, thoughtful,
    meticulous, prudent, and circumspect are highly regarded in Javanese culture.
    In dealing with form, construction, and decoration, Javanese architecture gives
    its priority to reticence.


    Moreover, artistic expression in Javanese tradition is elaborated from its own
    elements and resources with respect to their genuine traits and contributions
    to wholeness. An aesthetically well-considered building is understood in its wholeness
    as `apik` (perfect, orderly, proper, and fine). The concept of `apik` is applicable
    for a building with clean, proper, and neat performance. Beauty in the sense of
    `apik` is stipulated with a well-maintained condition. However, the beauty of
    nature is never comprehended with `apik`, but instead with `asri` that pertains
    to the state of growing well, generosity, fertility, sustainability, and harmony.

    '
