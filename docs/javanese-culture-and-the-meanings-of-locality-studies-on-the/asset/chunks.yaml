- fmt: '

    Sleeping for the traditional Javanese family takes place on the platform (`amben`)
    located in the inner part of the house close to the hearth (`pawon`). Parents
    and children do not sleep on the same platform. They sleep, however, in the same
    area. If the house has girls, they would have their sleeping platform in the core
    of the house (`sentong`). Meanwhile, boys sleep on the platform in the front part
    of the house. Although the modern Javanese family now lives mostly in Western
    style houses, there are still traces of `sentong`, which is traditionally dedicated
    as a spare respective room. They may call such a room a guest room or `mushola`.


    Since the purpose of the Javanese house is originally designed for rituals and
    ceremonies, its space is mostly a hall without fixed walls. The elaboration of
    layout for accommodating rooms comes into being when they encounter modernity.
    The modern Javanese house keeps the character in the use of traditional perfect
    form of three divisions of `pendapa-pringitan-dalem`. The adjustment of activities
    into the three main parts of the house has been made to be fit with contemporary
    and urban lifestyle.


    The hall in most cases remains open without a wall. The use of daily life is to
    receive the guest for a temporary visit. The second and the third part are usually
    integrated for a living room, a dining room, and sleeping rooms. Kitchen and pantry
    are commonly set up in the back area close to the servant quarter. The modern
    Javanese house usually has an adopted pool and recreation room. The sense of home
    in the broadest context is not restricted only by dwelling place. Since for Javanese
    dwelling is living with others, every place has its own spirits and is not restricted
    to the visible, but it also comprises the invisible. There is no place that does
    not contain a spirit. According to Javanese belief, places are containers (`wadah`)
    and the spirits are their content (`isi`). The spirits (`danyang`) are believed
    to guard the place so that every place has its character and purpose in the universe.
    There is no empty place on earth because spirits are like air and invisible incorporating
    natural forces. This belief dates back to pre-Hindu-Buddhist Java that pays respect
    to the forces of being. The important places for Javanese are identified with
    the concept of `angker`, meaning holy, sacred, mysterious, and sanctified. Sacred
    places have their own guarding spirits that do not allow people to harm their
    territory.


    Clearing and building natural place are due to deliver ritual offering (`sajen`)
    and ritual feast (`slametan`), designating reverence and respect to their existence.
    Offering and feast are considerable negotiation and permission for making up the
    environment for human living. Offering with a sacrifice of the head of water buffalo
    is given for the establishment of settlement, bridge, and dam. At any rate the
    offering and feast are dedicated to bring about the relationship between human
    beings and other beings in harmony.


    Since place is meaningful because of it is publicly well known, collective memory
    is necessarily established. The collective memory of place in the Javanese culture
    has to do with the events and happenings in which spiritual leaders are involved.
    The Javanese way to institute collective memory is by regular collective visits
    on the great days of Javanese calendar. Since memory in Javanese is recognized
    in the concept of `eling`, meaning reminiscence, awareness, concern, and mindfulness,
    memorial place is to remind them the respect to their spiritual leaders (`panutan`)
    for their blessing and benevolence. Graves (`sarean`, meaning place for rest and
    sleep) of spiritual leaders are conceived as places with full blessing. Since
    death in the Javanese tradition is never conceived as the termination of being,
    maintaining and conserving memorial places are actually never out of commission
    for sustaining a personal relationship with the dead.


    The place has no special location in the Javanese collective memory if its events
    and happenings have nothing to do with their spiritual leader (`panutan`). The
    idea of `panutan` is to remind people of the leadership and prophecy that have
    brought them into oneness. The word `panutan` is derived from `anut`, the word
    for to follow or following. `Anutan` means the teaching, stream, discipline, and
    beliefs. Memorial place is understood in the Javanese tradition as place with
    trace (`patilasan`).


    `Patilasan` is originated from the word `tilas`, which means clue, trace, hint,
    remain, and rest. What does memorial place (`patilasan`) have to do with trace?
    Does the Javanese culture perceive the memorial places as the traces that allow
    people to remind their leaders and teachings? It is probably the reason why the
    memorial place is meaningful when the religious events take place on the site.


    The visit for rituals or respect to the site is understood as `sowan` or `ziarah`,
    a spiritual trip. What they preserve and conserve is an event that reminds them
    to the spiritual leader concerned. The site of the occasion is perceived as `tilas`,
    which is believed and ought to be recovered as a whole meaningful world by the
    rituals. The other places that have nothing to do with the traces to their spiritual
    leaders will not be considered `patilasan` but as `tengeran`, meaning landmark
    or sign for orientation.


    The place where various landmarks are is the town (`kitha` or `kuta`). The mountain
    and sea are natural landmarks that are traditionally integrated in the layout
    of the town for giving orientation. Gates (`plengkung`) and town wall (`baluwerti`)
    are important landmarks besides mosques and `alun-alun`. Although in post-colonial
    Javanese towns there are some monuments, traditionally they do not build monumental
    buildings that do not have to do with their living tradition. The only monument
    that stands in town is an obelisk-like stature called `tugu`. In the town of Yogyakarta,
    this building is used as the reference point while the king’s meditation takes
    place in the front hall of his palace, gazing through `alun-alun` along the court
    boulevard.


    The Javanese idea of town is derived and developed from the Indian and Southeast
    Asia mainland experience: `kuta`, meaning the site inside surrounded by the rectangular
    wall and canal. Besides its sociopolitical meaning as the seat of their ruler,
    the Javanese people understand town as the site where the `peken` (permanent five-day
    market) has been established. The idea of town as the physical interpretation
    of `kuta` is not adopted in a strict sense. Then urbanism in Java since the eighth
    century is difficult to be reconstructed. Until this time, the ruins of Prambanan
    and Borobudur remain silent to give us the clues on the structure of old Javanese
    towns. We are still waiting for the finding on the origin and structure of the
    Javanese towns since the beginning of the eighth century.


    What we experience from the Javanese on the fact that the town is that `peken`
    (traditional market), `alun-alun` (town square), and `kraton` or `kabupaten` (regency)
    have been instituted and sustained. The most important aspect of town life is
    the `peken`. Its origin comes from the verb `mapeken`, meaning assembly or meeting
    and gathering. In contrast to village (`dhukuh`), `kitha` (town) is established
    with a relatively permanent market: `peken`. The other word of `peken` is `pasar`,
    possibly derived from the Persian `bazaar`.


    For the Javanese tradition, it might be that the same things happen in other countries,
    `peken` (market) is not only the place of transaction, but also the site of social
    interaction and amenities. Leisure, gambling, amusement, entertainment, and popular
    urbanity in the Javanese tradition are developed from this institution. On the
    other hand, court becomes the mother of cultural institution for conserving and
    preserving tradition in documented form and in a sustainable system.

