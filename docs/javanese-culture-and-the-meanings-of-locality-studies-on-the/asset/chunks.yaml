    Wijaya`, Demak’s `Jaka Tingkir`, Singasari’s `Ken Arok`, Mataram’s `Panembahan
    Senapati` and `Agung Hanyokrokusumo`, to the modern Indonesia `Sukarno` and `Suharto`,
    told us the importance of the one who was able to bring back the world in order.
    It is, in most cases, neither the question of legitimacy nor legal validity. Rather,
    the successful candidate for ruler must be somebody with strong willpower or a
    renegade. A smoothly sailing candidate is a seemingly weak leader for the Javanese
    ideal.


    Although sometimes brutal, cruel, and merciless, a savior, liberator, or restorer
    is more favorable than a hereditary successor. The Javanese saying `jer basuki
    mawa beya` confirms that everything worthy and better comes after overcoming the
    danger or crisis. The saviors and heroes of the Javanese world will not be judged
    on their past biographical data before they come to power. What is important is
