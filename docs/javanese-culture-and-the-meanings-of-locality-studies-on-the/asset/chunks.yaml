- fmt: '

    Over the course of time, the daily world is possibly contaminated by spiritual
    pollution (`sukerta`) and needs cosmic cure (`ruwatan`) for its safe and healthy
    form and state of being. On a smaller scale, such a cure is made at the household
    and community level, which is known as `slametan`. `ruwatan` and `slametan` share
    their common ground on the symbolic boundary maintenance for the safe and united
    world (Geertz 1960, p. 14; Mulder 2005, p. 89). The presence of ancient tradition
    for the rebirth of the world is signified with the performance of puppet shadow
    plays (`wayang kulit`). The puppet master (`dhalang`) not only plays his/her role
    as a conductor and director of the puppet show, but he/she takes charge as the
    ancient priest in the performance of the special myth of `murwakala`, a story
    of the birth and growth of the monstrous god `Kala` (time), who poses the power
    to eat everything in the world. `ruwatan` and `slametan` are nothing but the Javanese
    way for the acknowledgment and respect of the power of time. Unity and harmony
    are not simply understood in terms of interpersonal relations among people, but
    they are also perceived as the validation, affirmation, and confirmation of the
    commitment and loyalty of all people (`praja/kawula`) to their ruler (`raja/gusti`).
    Criticisms and oppositions against the government in various ways are conceived
    as humiliation, disloyalty, and disrespect to the person in power as well as to
    state and nation. Such conducts are considered polluting and destabilizing to
    the cosmic order.


    ### Concepts of Power and Danger


    The concepts of power and danger have been introduced by Mary Douglas (Douglas
    2002, pp. 117–40) in her studies on cultural values, knowledge, and cosmology.
    Douglas traces the different concepts of clean and dirty in cultural context that
    is deeply rooted in the symbolic boundary of safe cosmological realm. In Javanese
    context, purity is deeply rooted in the concept of the pure form of the world
    `bhawana`. Accordingly, the pure form is safe (`aman`), manageable (`tentram`),
    well-ordered (`tata`), healthy (`rahayu`), and prosperous (`gemah-ripah`). Ironically,
    the power to maintain this purity is known as `wasa binatara`, literally meaning
    celestially terrifying and frightening power.


    ### The Concrete Form of Power


    Since the notion of power in Javanese as well as in Indonesian culture is concrete
    (Anderson 2007, p. 22), the seat of the ruler becomes an important showcase of
    hegemony. Power is concrete because it is represented by the seat or throne of
    the ruler. Then taking over the seat is claiming the place as the ruler. Still,
    concerning its concrete form, power needs to show up in terms of spectacular happenings
    or grand exhibitions. Therefore, the intentionality of hegemony in Javanese tradition
    is not about the exercise of power concerning daily business of politics but concentrating
    and preserving power that is (Anderson 2007, p. 5). The intentionality of power
    is to perform this power with a grand spectacle for the ruler cult. It is not
    primarily to entertain the public but for self-grandeur of his/her majesty. In
    doing so, the ruler moves upward from mundane reality to transcendental realm.
    He/she makes a case as the untouchable being; he/she is able to watch over his/her
    people from above.


    ### Wholeness and Immanence


    In the Javanese context, the concentration and preservation of power are culturally
    related to the idea of unpolluted wholeness and the unity of transcendence and
    immanence (`sejatining utuh lan manunggaling gusti kawula`). Impurity is considered
    associated with fragmentation (`modal-madul`) and disarray (`gonjang-ganjing`).
    Impurity is not only polluted with destructive components, streams, and movements
    against the unity of Javanese world, but it is also somewhat cosmologically degenerated
    toward chaos and the state of getting lost.


    ### The Concept of *Kuasa*


    In Indonesia, power and culture has always been an interchangeable pair of the
    hegemonic concept `kuasa`. Accordingly, the establishment of power as `kuasa`,
    `kekuasaan` is not merely the institutionalization of authority, but it also comprises
    a spiritual and cultural hegemony with the strong sense of purpose for unitary
    nation and state. This sense has been historically shaping and establishing Indonesian
    political culture. In the daily practice, the state `negara` is bureaucratically
    despotic that exercises and pertains to the power `kuasa` in terms of `agung-binatara`,
    meaning “the terrifying authority” (Mudjanto 1986). Accordingly, the rulers are
    neither public servants nor representative leaders, but simply the dominator or
    master in terms of `penguasa`; the state officers are `penguasa`, which literally
    means hegemonic person. In the broadest sense, the notion of `penguasa` is actually
    a dominant agency that is bigger than our life. Such an agency is capable of taking
    over your actions and decisions because you are his/her slave (`kawula` or `hamba`).
    Ordinary people are perceived as `hamba yang didaulat`, meaning slaves under the
    mercy of their master. `penguasa` is the blessing giver as well as the mercy provider.


    The other notion for `penguasa` is `pemerintah`, from the word `perintah`, literally
    meaning command, instruction, order, and direction. A state officer is conceptually
    `penguasa` and `pemerintah`. The reformation movement has not yet successfully
    transformed the notion of government from its hegemonic position to public representative
    job. Anyone who is in power is expected to be the godfather of their kingdom.
    Accordingly, a leader is necessarily dominating (`menguasai`) in their intentions
    and actions because they are perceived as someone above average in their knowledge
    and sight on the circumstances and situations of their realm (`dunia`, `wilayah`).


    Power as `kuasa` or `kekuasaan` is due to cover up their flaws and weaknesses
    with everything they have. They will defy any attempt to disintegrate and disgrace
    its existence and status quo in terms of purity of power. Stepping down from power
    because of scandal is neither a graceful exit nor an elegant solution for the
    hegemonic concept of `kuasa`, but shameful and disgraceful instead. Instead of
    resigning, `kuasa` urges persons in power to save their image (`citra`) and pride
    (`wibawa`) as `penguasa` or omnipresent authority. Blaming their subordinate officers
    for being responsible is the most common practice for such scandalous and outrageous
    abuse of power.


    ### Syncretism in Democracy


    Since the Javanese political culture is sophisticated in its concept, form, and
    practice, its infiltration into Indonesian political culture is delicate and refined
    by means of courtesy and graciousness. The hegemonic model of Javanese despotism
    and paternalism is never to exercise direct confrontation. Putting others under
    the Javanese control is identifying, synchronizing, and integrating the strengths
    and weaknesses of others within the Javanese system. This is actually the practice
    of syncretism in the Javanese tradition in terms of `laras`, `nglaraske`, literally
    meaning harmony or to harmonize. In this sense, the notion of democracy will be
    harmonized with the Javanese concept of `saresehan` and `rembugan` or the Indonesian
    notion of `musyawarah` (open deliberation) toward `mufakat` (agreement) (Tjiptoherianto
    1996; Rais and Najib 1999). Accordingly, the original idea of democracy has lost
    its essential and original concept of individual freedom; the Javanese and Indonesian
    version of democracy is a mere vehicle and way to the power for the unity and
    harmony of the nation and state. In many ways, `musyawarah` is another word for
    a deliberation toward alignment with the political will of status quo or the mainstream.
    Subsequently, whoever is in power is eventually due to perform the unity and harmony,
    that is, not to carry out democracy in respect to individual freedom.

