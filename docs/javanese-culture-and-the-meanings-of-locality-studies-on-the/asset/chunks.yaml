- fmt: '

    The considerable breakup of the traditional patronage never comes into being either
    in pre-colonial or in the colonial Java. However, a slightly radical movement
    of artistic self-expression did happen in Surakarta Palace in the middle of the
    eighteenth century when the poet `Raden Ngabehi Ranggawarsita` worked under the
    reign of `Pakubuwono VII`. As the king at the time, `Pakubuwana VII` confirmed
    him as court poet (`pujangga kraton`). Since the king did not pay too much attention
    to literature, the state gave `Ranggawarsita` more space, not only for his creative
    writings, but also for his talent in envisioning the Javanese world. In the past,
    such similar prophetic narration had been delivered by `King Jayabaya` (1135–1157)
    of `Menang Kediri` East Java. In many ways, the poems by `Ranggawarsita` are unconventional
    for Javanese court tradition. Unlike his grandfather and predecessor `Yasadipura
    II`, he speaks his own mind in his poems in a prophetic way. He continued to work
    as court poet under `Pakubuwana VIII` and `Pakubuwana IX` until his mysterious
    demise in 1873. The cause of his death remains unclear today.


    ## What Is Art in Javanese Culture?


    Even though in Javanese culture there is no word for what art is, the Javanese
    people understand its sense and purpose. Any endeavor for the Javanese people
    is to achieve its quality in terms of `karya`. Making a work of art is generally
    understood under the notion of `makarya`. `karya` is a Sanskrit loan word that
    has been adopted by Javanese culture to mean the work with its usefulness and
    contribution to the well-being of the world and the community. As a matter of
    fact, `karya` is an artistically well-thought-out work that brings forth the world
    with specific value and meaning. `karya` in the broadest sense is all human works,
    which are functionally and aesthetically well considered in bringing forth culture,
    in terms of refined things and behaviors. The opposite of culture is `urakan`,
    meaning coarse, rude, and impolite.


    Albeit it is unfashionable in Javanese tradition to deal with the concept of art,
    it does not mean that artistic work does not have any specific signification.
    Concepts related to the work of art and aesthetic experience in Javanese culture
    are wide-ranging in meanings and expressions. In such a broad spectrum, there
    are at least three main categories of works of art in Javanese culture: `susastra`
    (literature), `karawitan` (music), and `karya` (general works of art).


    The characteristic of `karya` should contain the integrity of ethics and aesthetics
    that shows and incorporates the idea of well-mannered, refined, and restrained
    (`alus`) (Hughes-Freeland 2008, p. 82). The sense of `alus` is applicable for
    matters, words, and conduct. Accordingly, work and deed are purposive as far as
    toward its refinement and aesthetically well-treated, according to the Javanese
    system of values. Refinement in this sense is simply not about fine expression,
    articulation, and interaction. Rather, Javanese refinement is about proper position,
    orientation, form, style, and fashion.


    In many ways, the appropriateness of alus requires ubiquitous acceptance, subtlety,
    and delicacy. All this has been evolving for centuries with its root in agriculture-based
    feudalism. Culture in this sense is more than just a set of shared meanings associated
    with customary practices (Berger 1995, p. 32). Rather, the Javanese understand
    culture in the context of `budhi`. The Sankrit loan word `budhi` in Javanese context
    has been evolved and conceived as the powerful source and system of mind and action;
    based on that one is able to create, establish, develop, conserve, and sustain
    ideas, feelings, spirits, memories, ingenuities, hopes, and ideals. In daily life,
    the idea of culture as `budhi` is practiced as aesthetic and moral standard. Language
    and manners convey the `budhi` as a standard of appropriation. Nevertheless, `budhi`
    is nothing and useless unless it is imbued with forces, drives, and passions of
    life known as `daya`. The synergy of `budhi` and `daya` is incorporated with the
    concept of `budhaya`, meaning literally culture.


    Then, making something beautiful, useful, and insightful as well as well-mannered
    behavior is inseparable from the essence of Javanese culture (`budhi`). Beyond
    and above all appearances, the Javanese people understand the work of art in various
    forms, ways, and fashions as part of their living philosophy that humankind as
    a society has to cultivate itself artistically and socially. All this learning
    process is conceived by the Javanese people in the concept of `nglakoni`, meaning
    walking along. Accordingly, living is walking as well as experiencing the now
    in an infinite way. This chapter is an attempt to unfold conceptual foundations
    of aesthetic experience in Javanese culture.


    To have a brief idea of the Javanese world, there is no appropriate single word
    to describe their culture and tradition better than the notion of syncretism.
    In the Javanese language, syncretic phenomena are contextually associated with
    the deeply emotive concept and word `manunggal`, meaning to become one (Anderson
    2007, pp. 23–24). Unity (`utuh`) and harmony (`rukun`) become the most obsessed
    concepts in Javanese tradition. The phenomena of syncretism are revealed in various
    activities and products. The Javanese people understand the concept in terms of
    domestication. It is the way the Javanese people deal with making, living, and
    working. Syncretism in the Javanese language is conceived in the concept of `nglaras`
    or `laras` (Yumarma 1996, pp. 140–45). The concept is central in Javanese thought
    that being everything antagonistic, dualistic, and dialectic into oneness.


    As an integral part of culture, the Javanese art and aesthetic is indispensable
    from the act of molding myriad forms, ideas, and fashions into a newly established
    system. The purpose of the unity is to be Javanese (`jawa`), meaning to be human,
    culturally cultivated, and mature (Weiss 2006). Being Javanese is being human
    with good manners and strong self-control. All this is composed of the concept
    `alus`, literally meaning refined and mature, the opposite of `kasar` or rude
    and immature. The ultimate goal of `nglaras` is to achieve the refinement, `alus`,
    of work and behavior.


    The purpose of the work of art in Javanese tradition is indivisible from the Javanese
    struggle from the world in the darkness (`kalatida`) to that in the light (`kalasuba`).
    It is not about making something for the sake of itself in terms of artistic self-expression.
    And it is not about individual freedom either. The work concerning aesthetic experience
    for Javanese people is about well-being (`sugeng slamet`) of the world and the
    community. Their works are demonstrated in architecture (`wayang kulit`), shadow
    puppet theater, `jogged` (dance), `susastra` (literature), `ketoprak` (folk theater),
    `gamelan` orchestra, `batik`, and `kris` (dragger).


    Although today Javanese kingdoms still exist in `Yogyakarta` and `Surakarta`,
    their roles and functions are more spiritually symbolic rather than politically
    involved. In the field of artwork, court arts and folk arts live together in different
    purpose. Court arts serve their works for court ceremonies and rituals (Jessup
    1990, pp. 73–102). They belong to preserve and sustain cultural values in terms
    of court pride and heritage. Indeed, glorifying the past for spiritual identity
    and unity of Javanese world becomes the central purpose of the court arts. This
    includes performing annual and occasional celebrations that emulate and simulate
    as well as signify the Javanese world.

