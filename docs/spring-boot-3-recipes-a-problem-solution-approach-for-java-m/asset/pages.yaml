    # **Table 3-1. Automatically Registered Servlet Filters**


    | Filter | Description |

    | DefaultCharacterEncodingFilter | Forces the encoding to be UTF-8 by default.
    Can be configured by setting the spring.http.encoding charset property. Can be
    disabled by setting server.encoding.enabled to false. |

    | FormContentFilter | Wraps the request with FormContentRequestWrapper for PUT,
    PATCH, and DELETE requests so there is consistent handling of these requests and
    can be able to use bindings with them. Can be disabled by setting the spring.mvc.formcontent.enabled
    to false. |

    | RequestContextFilter | Exposes the current request to the current thread so
    that you can use RequestContextHolder and LocalContextHolder even in a non-Spring
    MVC application like Jersey. |


