    # 6-3. Use JdbcTemplate or JdbcClient


    # Problem


    You want to use JdbcTemplate, NamedParameterJdbcTemplate, or JdbcClient to have
    a better JDBC experience.


    # Solution


    Use the automatically configured JdbcTemplate, NamedParameterJdbcTemplate, or
    JdbcClient to execute the queries and handle the results.


    # How It Works


    Spring Boot will configure a JdbcTemplate, NamedParameterJdbcTemplate, and JdbcClient
    by default and does so when it can detect a single candidate DataSce. A single
    candidate DataSource means there is either only a single DataSource or there is
    one marked as a primary resource using @Primary. As the JdbcTemplate is already
    available, you can choose to write your JDBC code. Rewriting the CustomerLister
    to the JdbcTemplate instead of a plain DataSource will make the code a little
    easier to read and thus easier to handle (see Listing 6-14).'
