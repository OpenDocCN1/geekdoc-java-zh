    \ | Description |\n| --- | --- |\n| hasRole('role') or hasAuthority('authority')\
    \ | Returns true if the current user has the given role |\n| permitAll() | Always\
    \ evaluates to true |\n| denyAll() | Always evaluates to false |\n| authenticated()\
    \ | Returns true if the user is authenticated |\n| access() | Use a function to\
    \ determine if access is granted |\n\n> Although the role and authority are almost\
    \ the same, there is a slight, but important, difference in how they are processed.\
    \ When using hasRole, the passed-in value for the role will be checked if it starts\
    \ with ROLE_ (the default role prefix). If not, this will be added before checking\
    \ the authority. So, hasRole('ADMIN') will actually check if the current user\
    \ has the authority ROLE_ADMIN. When using hasAuthority, it will check the value\
    \ as is.\n\nListing 5-39. Spring Security Custom Security Rules\n\n```\n@Bean\n\
