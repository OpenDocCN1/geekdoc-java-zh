  md: '# CHAPTER 4 WEBFLUX


    BookController is mapped to /books and supports listing all books or a single
    one adding and modifying a book. Using something like HTTPPie or curl you can
    query the endpoint.


    The command http://localhost:8080/books should list all the orders in the system
    (see Figure 4-1), and http http://localhost:8080/books/{isbn} should list a single
    one.


    ![](img/89a0bcab7458b6da76f2e201f270589c_195_0.png)


    Figure 4-1. Result of getting all books


    # Stream JSON


    The result of the call to /books isn''t streaming, but rather it is blocking.
    It first collects all results before sending them out. Also see the content-type
    header in Figure 4-1, which is set to application/json. To stream the result,
    it should be application/x-ndjson (or another content type that supports streaming).
    This is something to take into consideration when writing a client to consume
    this endpoint. For HTTPPie we can specify the Accept header to make it streaming.
    Add ''Accept:application/x-ndjson'' to the HTTPPie command from earlier, and the
    result will be streaming. The result will now gently stream in until there is
    nothing to consume (see Figure 4-2).'
