  md: "With that in place and having built your artifact, you can now deploy your\
    \ application to the JEE container and reuse the existing ConnectionFactory.\n\
    \n# Configure Manually\n\nThe final way to configure JMS is to do it manually.\
    \ For this you will need at least the spring-jms and jakarta.jms-api dependencies\
    \ and probably some client libraries for the JMS broker you are using. Manual\
    \ configuration can be needed when:\n\n+   * Spring Boot cannot auto-configure\
    \ your ConnectionFactory\n* Extensive setup of the ConnectionFactory instance\
    \ is needed\n* Multiple ConnectionFactory instances are needed\n\nTo configure\
    \ a ConnectionFactory instance, you add an @Bean annotated method that constructs\
    \ a ConnectionFactory instance. See Listing 8-6.\n\n**Listing 8-6.** ConnectionFactory\
    \ Bean Configuration\n\n```\n@Bean\npublic ConnectionFactory connectionFactory()\
    \ {\n    var connectionFactory =\n    new ActiveMQConnectionFactory(\"vm://localhost?broker\"\
    \n    persistent=false);\n    connectionFactory.setClientID(\"someId\");\n   \
    \ return connectionFactory;\n}\n```\n\nThis will create a ConnectionFactory instance\
    \ for Artemis; it will use an embedded nonpersistent broker and set the clientId\
    \ instance. When Spring Boot detects a preconfigured ConnectionFactory, it doesn't\
    \ attempt to create one itself. When running it, the output should look like Figure\
    \ 8-3."
  merge: -1
