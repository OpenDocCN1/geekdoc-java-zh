- img_proc: true
  md: '# CHAPTER 4 WEBFLUX


    The handle method returns Mono<Void>, which is the reactive way of saying it returns
    void. It takes a HttpRequest interface and a ServerHttpResponse, both from the
    org.springframework.http.server package. Depending on the container, the proper
    implementation is created. For these several adapters or bridges for containers
    exist. When running on a Servlet 5.0 container (supporting nonblocking I/O), HttpServletHandlerAdapter
    (one of its subclasses) is used to adapt the plain Servlet to the Reactive world.
    When running on a native Reactive engine like Netty, the ReactorHandlerAdapter
    is used.


    When a request is sent to a WebFlux application, HandlerAdapter receives the request.
    Then it organizes the different components configured in Spring’s application
    context that are needed to handle the request.


    To define a controller in SpringFlux, a class has to be marked with the @Controller
    or @RestController annotation (just as with Spring MVC; see Chapter 3).


    When an @Controller annotated class (i.e., a controller class) receives a request,
    it looks for an appropriate handler method to handle the request. This requires
    a controller class map each request to a handler method by one or more handler
    mappings. To do this, a controller class’s methods are decorated with the @RequestMapping
    annotation, making them handler methods.


    The signature for these handler methods—as you can expect from any standard class—is
    open-ended. You can specify an arbitrary name for a handler method and define
    a variety of method arguments. Equally, a handler method can return any of a series
    of values (e.g., String or void), depending on the application logic it fulfills.
    The following is only a partial list of valid argument types, just to give you
    an idea:


    +   * HttpServletHttpResponse

    * Request parameters from the URL of arbitrary type, annotated with @RequestParam

    * Model attributes of arbitrary type, annotated with @ModelAttribute

    * Cookie values included in an incoming request, annotated with @CookieValue

    * Request header values of arbitrary type, annotated with @RequestHeader

    * Request attribute of arbitrary type, annotated with @RequestAttribute

    * Map or ModelMap, for the handler method to add attributes to the model'
  merge: -1
  pgno: 183
- img_proc: true
  md: '+   - Errors or BindingResult, for the handler method to access the binding
    and validation result for the command object


    +   - WebSession, for the session


    Once the controller class has picked an appropriate handler method, it invokes
    the handler method''s logic with the request. Usually, a controller''s logic invokes
    back-end services to handle the request. In addition, a handler method''s logic
    is likely to add or remove information from the numerous input arguments (e.g.,
    HttpServlet, Map, or Errors) that will form part of the ongoing flow.


    After a handler method has finished processing the request, it delegates control
    to a view, which is represented as the handler method''s return value. To provide
    a flexible approach, a handler method''s return value doesn''t represent a view''s
    implementation (e.g., user.html or report.pdf) but rather a logical view (e.g.,
    user or report)—note the lack of file extension.


    A handler method''s return value can be either a String—representing a logical
    view name—or void, in which case a default logical view name is determined on
    the basis of a handler method''s or controller''s name.


    To pass information from a controller to a view, it''s irrelevant that a handler
    method returns a logical view name—String or a void—since the handler method arguments
    will be available to a view.


    For example, if a handler method takes Map and Model objects as input parameters—modifying
    its contents inside the handler method''s logic—these objects will be accessible
    to the view returned by the handler method.


    When the controller class receives a view, it resolves the logical view name into
    a specific implementation (e.g., user.html or report.fmt) by means of a view resolver.
    A view resolver is a bean configured in the web application context that implements
    the ViewResolver interface. Its responsibility is to return a specific view implementation
    for a logical view name.


    Once the controller class has resolved a view name into a view implementation,
    per the view implementation''s design, it renders the objects (e.g., HttpServlet,
    Map, Errors, or WebSession) passed by the controller''s handler method. The view''s
    responsibility is to display the objects added in the handler method''s logic
    to the user.


