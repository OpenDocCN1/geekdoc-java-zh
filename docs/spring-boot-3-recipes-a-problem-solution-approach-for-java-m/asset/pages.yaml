  md: "# Receive mMessages\n\nLet's create a service that listens to the message sent\
    \ by the sender from Recipe 8-2. See Listing 8-15.\n\n**Listing 8-15. JMS-Based\
    \ Spring JMS Listener**\n\n```\n@Component\nclass CurrentDateTimeService {\n \
    \   @JmsListener(destination = \"jms-queue-queue\")\n    public void handle(TextMessage\
    \ msg) throws JMSException {\n        System.out.println(\"[RECEIVED] - \" + msg.getText());\n\
    \    }\n}\n```\n\nIt is a regular class and has a method annotated with @JmsListener,\
    \ which accepts at least a destination so it knows where to retrieve messages\
    \ from. It accepts a jakarta.jms.TextMessage and prints the content to the console.\
    \ The method signature of a@JmsListener annotated method is flexible as it allows\
    \ for several arguments either annotated or from a specific type (see Table 8-8).\n\
    \n**Table 8-8. Allowed Method Parameter Types**\n\n| Type | Description |\n| ---\
    \ | --- |\n| java.lang.String | Gets message payload as String only for TextMessage\
    \ |\n| java.util.Map | Gets message payload as Map only for MapMessage |\n| byte[]\
    \ | Gets message payload as byte[] only for BytesMessage |\n| Serializable object\
    \ | Deserializes Object from ObjectMessage |\n| jakarta.jms.Message | Gets the\
    \ actual JMS message |\n| jakarta.jms.Session | Accesses the Session for access,\
    \ sending a custom reply, for instance |\n| @Header annotated element | Extracts\
    \ a header from the JMS message |\n| @Headers annotated element | Only usable\
    \ on java.util.Map to get all the JMS message headers |\n| org.springframework.messaging.Message\
    \ | Representation of the incoming JMS message |"
