    # # 4-8. Configure SSL for the Reactive Content Problem


    You want your application to be accessible through HTTPS next (or instead of)
    HTTP.:


    # # Solution


    Get a certificate, place it in a keystore, and use the server.ssl properties to
    configure the keystore. Spring Boot will then automatically configure the server
    to be accessible through HTTPS.


    # # How It Works


    Using server.keystore (and related properties), you can configure the embedded
    container to accept only HTTPS connections. Before you configure SSL, you will
    need to have a certificate to secure your application. Generally, you will want
    to get a certificate from a certificate authority such as Verisign or Let''s Encrypt.
    However, for development purposes, you can use a self-signed certificate (see
    the section "Create a Self-Signed Certificate").


    # # Create a Self-Signed Certificate


    Java comes with a tool called keytool that can be used to generate certificates
    among other things. See Listing 4-32.'
