    \ has a pluggable mechanism for both the authentication and authorization process\
    \ and by default supports different mechanisms. For authentication, Spring Security\
    \ has out-of-the-box support for JDBC, LDAP, and property files.\n\n# 5-1. Enable\
    \ Security in Your Spring Boot Application Problem\n\nYou have a Spring Boot-based\
    \ application and you want to enable security in it.\n\n# Solution\n\nAdd spring-boot-starter-security\
    \ as a dependency to set up and configure security automatically for your application.\n\
    \n# How It Works\n\nTo get started, you will need to import the libraries for\
    \ Spring Security into your application. To do this, you can add spring-boot-starter-security\
    \ to your list of dependencies. See Listing 5-1.\n\n**Listing 5-1.** Spring Security\
    \ Starter Dependency\n\n```\n<dependency>\n  <groupId>org.springframework.boot</groupId>\n\
    \  <artifactId>spring-boot-starter-security</artifactId>\n</dependency>\n```"
