  md: "# Listing 6-63. MongoDB-Based Test for the CustomerRepository\n\n```\n@DataMongoTest\n\
    class CustomerRepositoryTest {\n\n@Autowired\nprivate CustomerRepository repository;\n\
    \n@BeforeEach\npublic void cleanUp() {\n    repository.deleteAll();\n}\n}\n```\n\
    \nThe @DataMongoTest annotation executes the test with a special JUnit Extension\
    \ (SpringExtension) to bootstrap the Spring Test Context framework. The @DataMongoTest\
    \ annotation will replace the preconfigured MongoDB with an embedded one (if on\
    \ the classpath). It will also bootstrap the MongoDB components and when detected\
    \ Spring Data Mongo repositories.\n\nAfter each test, we want to make sure that\
