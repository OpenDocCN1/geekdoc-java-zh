    \ Messages\n\n```\n@Component\nclass HelloWorldReceiver {\n    @RabbitListener(queues\
    \ = \"hello\")\n    public void receive(String msg) {\n        System.out.println(\"\
    Received: \" + msg);\n    }\n}\n```\n\nThis component will receive all the messages\
    \ from the hello queue and print them to the console (Figure 8-7). This works\
    \ for simple payloads or if the receiving object can be deserialized from the\
