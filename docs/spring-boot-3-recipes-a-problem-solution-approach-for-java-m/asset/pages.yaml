  md: "# CHAPTER 6 DATA ACCESS\n\nThere is a small difference in this customer compared\
    \ to the one in Recipe 6-15. The difference is the @Id annotation on the id property.\
    \ We need to tell Spring Data which fields to use as the primary key. This is\
    \ needed so things like findById will work; otherwise, Spring Data will not know\
    \ which fields make up the identifier and cannot generate the query. For this\
    \ we need to mark the fields with @Id. When there is only one field making up\
    \ the primary key for this object and it is also named id, you can omit the @Id\
    \ annotation. However, being explicit about is never wrong and aids the expressiveness\
    \ of the code.\n\nFinally, we need a recipe we defined an interface (Recipe 6-15)\
    \ and provided the implementation we wanted (Recipe 6-16). With Spring Data JDBC\
    \ we only need to specify an interface (Listing 6-22), which has extend to one\
    \ of the Data interfaces. Now Spring Data will dynamically create the appropriate\
    \ repository at runtime.\n\n# Listing 6-22. CustomerRepository for Spring Data\
    \ JDBC\n\n```\npackage com.apress.springboot3recipes.jdbc;\n\nimport org.springframework.data.repository.CustomerRepository;\n\
    \npublic interface CustomerRepository extends CrudRepository<Customer,\nLong>\
    \ { }\n```\n\nCustomerRepository extends CrudRepository and contains no methods.\
    \ All the methods needed are provided out of the box by Spring Data. Finally,\
    \ we need to create something that uses the repository. Let's write a CustomerLister\
    \ that retrieves all the Customer instances from the database and prints the output\
    \ (Listing 6-23).\n\n# Listing 6-23. CustomerLister Using CustomerRepository\n\
    \n```\n@Component\nclass CustomerLister implements ApplicationRunner {\n\n  private\
    \ final Logger logger = LoggerFactory.getLogger(getClass());\n  private final\
    \ CustomerRepository customers;\n\n  CustomerLister(CustomerRepository customers)\
    \ {\n    this.customers = customers;\n}\n```\n\n299"
