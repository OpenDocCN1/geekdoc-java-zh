  md: "# CHAPTER 2 THE BASICS OF SPRING BOOT\n\nThe Docker Compose support can be\
    \ enabled by including the spring-boot-docker-compose dependency. When it detects\
    \ a docker-compose.yml or compose.yml in the root of your application folder,\
    \ it will use that to start the containers before starting the application. It\
    \ will use the ConnectionProvider abstraction and @ServiceConnection support (see\
    \ Recipe 2-3 on Testcontainers and Docker support) to determine which containers\
    \ are started and will make the metadata (like URL, username, password, etc.)\
    \ available to Spring Boot automatically.\n\n> By default the Docker Compose support\
    \ is disabled for testing in favor of using Testcontainers.\n\nThe other option\
    \ is to define some containers using Testcontainers and use the @ImportTestcontainers\
    \ annotation to use them to start the dockerized environment. The added benefit\
    \ of this is that you can reuse the same container definitions as used when writing\
    \ tests.\n\n# How It Works\n\n# Spring Boot Docker Compose Support\n\nTo start,\
    \ you would need a docker-compose.yaml file to determine which services need to\
    \ run. Let's create one that bootstraps Postgresql with a database and a given\
    \ username/password combination (see Listing 2-29).\n\nListing 2-29. Docker Compose\
    \ File\n\n```\nservices:\n  postgres:\n    image: 'postgres:15.2'\n    environment:\n\
    \      - POSTGRES_DB=springboot3recipes\n      - POSTGRES_USER=springboot3\n \
    \     - POSTGRES_PASSWORD=recipes\n  ports:\n    - '5432'\n```"
