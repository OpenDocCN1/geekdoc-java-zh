  md: '# 2-4. Configure Logging


    # Problem


    You want to configure log levels for certain loggers.


    # Solution


    With Spring Boot you can configure the logging framework and configuration.


    # How It Works


    Spring Boot with a default configuration for the supported log providers (Logback,
    Log4J2, and Java Util Logging). In addition to the default configuration, it adds
    support for configuring the logging levels through the regular application.properties
    as well as specifying patterns and where to, optionally, write log files to.


    Spring Boot uses SLF4J as the logging API, and when writing components, you should
    use these interfaces to write your logging. That way, you have a choice in which
    logging framework to use.


    # Configure Logging


    One of the general things to do with a logging framework is to enable or disable
    logging for parts of the framework. With Spring Boot, you can do this by adding
    some lines to your application.properties file. The lines need to be prefixed
    with logging.level. followed by the name of the logger and finally the level you
    want to be.


    ```

    logging.level.org.springframework.web=DEBUG

    ```


    The previous line will enable DEBUG logging for the org.springframework.web logger
    (generally all classes in that package and subpackages). To set the level of the
    ROOT logger, use logging.level.ROOT=level. This will set the default level of
    logging.


    # Log to a File


    By default Spring Boot will log only to the console. If you want to write to a
    file as well, you need to specify either logging.file or logging.path. The first
    takes the name of'
