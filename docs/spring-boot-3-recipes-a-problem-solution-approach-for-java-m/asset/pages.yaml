  md: "# Listing 3-29. SessionLocaleResolver Bean Definition\n\n```\n@Bean\npublic\
    \ LocaleResolver localeResolver() {\n    var localeResolver = new SessionLocaleResolver();\n\
    \    localeResolver.setDefaultLocale(Locale.forLanguageTag(\"en\"));\n    return\
    \ localeResolver;\n}\n```\n\nYou can set the defaultLocale property for this resolver\
    \ in case the session attribute doesn't exist. Note that this locale resolver\
    \ is able to change a user's locale by altering the session attribute that stores\
