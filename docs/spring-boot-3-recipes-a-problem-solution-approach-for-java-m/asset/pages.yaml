  md: 'CHAPTER 4 WEBFLUX


    # Enable and Use Problem Details


    Spring 6 added support for the Problem Details for HTTP API (RFC-7807), and with
    Spring Boot it is quite easy to enable it. By adding spring.webflux.problemdetails.enabled=true
    (or spring.mvc.problemdetails.enabled=true for MVC-based applications), this will
    be enabled.


    When this is enabled, Spring Boot will register ProblemDetailsExceptionHandler
    as an additional ExceptionHandler will handle some well-known exception (all the
    Spring-related web exceptions) and return a result containing more information
    and of the type application/problem+json. See 4-6.


    ![](img/89a0bcab7458b6da76f2e201f270589c_209_0.png)


    Figure 4-6. Problem detail error response


    4-6 shows the result of calling http://localhost:8080/books/500 with Problem Detail
    support enabled.


