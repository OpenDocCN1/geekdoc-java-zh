  md: '# CHAPTER 4 WEBFLUX


    # Listing 4-32. keytool Command


    ```

    keytool -genkey -keyalg RSA -alias sb3-recipes -keystore sb3-recipes.pfx -storepass
    password -validity -keysize 3600 4096 -storetype pkcs12

    ```


    This command will tell keytool to generate a key using the RSA algorithm and place
    it in the keystore sb3-recipes.pfx with the alias sb3-recipes, and it will be
    valid for 3,600 days. When running the command, it will ask a few questions and
    answer them accordingly (or leave them empty). After that, there will be a file
    called sb3-recipes.pfx containing the certificate protected with a password.


    Place this file in the src/main/resources folder so that it is packaged as part
    of your application and Spring Boot can easily access it.


    > Using a self-signed certificate will produce a warning in the browser that the
    website isn’t safe or protected.


    # Configure Spring Boot to Use the Keystore


    Spring Boot will need to know about the keystore to be able to configure the embedded
    container. For this you first create a so-called SSL bundle and use the server.ssl
    bundle property to link it to the server.


    For this use the server.ssl.keystore property. You will also need to specify the
    type of keystore (pkcs12) and the password. See Listing 4-33.


