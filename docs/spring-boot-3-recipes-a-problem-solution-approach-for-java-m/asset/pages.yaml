  md: "# Use Spring Data MongoDB Repositories\n\nInstead of writing your own implementation\
    \ of the repository, you can also use Spring Data MongoDB to create them for you\
    \ (just like with Spring Data JPA). For this you need to extend one of the Repository\
    \ interfaces from Spring Data. The easiest is to extend CrudRepositoryory or MongoRepository\
    \ (Listing 6-55).\n\n**Listing 6-55.** Spring Data MongoDB-Based CustomerRepository\n\
    \n```\npackage com.apress.spring3recipes.mongo;\n\nimport org.springframework.data.mongodb.repository.MongoRepository;\n\
    \npublic interface CustomerRepository extends MongoRepository<Customer, String>\
    \ { }\n```\n\nThis is all we need to get a fully functional repository; you can\
    \ remove the MongoCustomerRepository implementation. This will give you save,\
    \ findAll, findById, and many more methods.\n\nThe application will still run,\
    \ insert some customers, and list them in the logs (see Figure 6-4).\n\n# Use\
    \ Reactive MongoDB Repositories\n\nInstead of using regular blocking operations,\
    \ MongoDB can also be used in a reactive fashion. For this, use spring-boot-starter-mongodb-reactive\
    \ instead of spring-boot-starter-data-mongodb. This dependency will include the\
    \ needed reactive libraries and reactive driver for MongoDB (Listing 6-56).\n\n\
    **Listing 6-56.** Spring Data MongoDB Dependencies for Reactive Use\n\n```\n<dependency>\n\
    \  <groupId>org.springframework.boot</groupId>\n  <artifactId>spring-boot-starter-data-mongodb-reactive</artifactId>\n\
    </dependency>\n```\n\nWith the dependencies in order, you can make CustomerRepository\
    \ reactive. This is done by simply extending ReactiveCrudRepository, ReactiveSortingRepository,\
    \ or ReactiveMongoRepository depending on your needs (Listing 6-57)."
