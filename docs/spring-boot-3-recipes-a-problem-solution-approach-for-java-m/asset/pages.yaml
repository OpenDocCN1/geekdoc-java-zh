  md: "# Remember-Me Support\n\nRemember-me support can be configured via the rememberMe()\
    \ method in Java config. By default, it encodes the username, the password, the\
    \ remember-me expiration time, and a private key as a token, and stores it as\
    \ a cookie in the user’s browser. The next time the user accesses the same web\
    \ application, this token will be detected so that the user can log in automatically.\
    \ See Listing 5-20.\n\nListing 5-20. RememberMe Configuration\n\n```\n@Configuration\n\
    @EnableWebSecurity\npublic class LibrarySecurityConfig {\n\n@Bean\npublic SecurityFilterChain\
    \ security(HttpSecurity http) throws Exception {\n    http.rememberMe(Customizer.withDefaults());\n\
    \    return http.build();\n}\n}\n```\n\nHowever, static remember-me tokens can\
    \ cause security issues, because they may be captured by hackers. Spring Security\
    \ supports rolling tokens for more advanced security needs, but this requires\
    \ a database to persist the tokens. For details about rolling remember-me token\
    \ deployment, please refer to the Spring Security reference documentation.\n\n\
    # 5-3. Authenticate Users\n\n# Problem\n\nWhen a user attempts to log into your\
    \ application to access its secure resources, you have to authenticate the user’s\
    \ principal and grant authorities to this user."
