  md: "# Solution\n\nIn a Spring WebFlux application, a user's locale is identified\
    \ by a component that has to implement the LocaleContextResolver interface. Spring\
    \ WebFlux comes with two LocaleContextResolver implementations for you to resolve\
    \ locales with different criteria. Alternatively, you can create your own custom\
    \ locale resolver by implementing this interface.\n\nYou can define a locale resolver\
    \ by registering a bean of type LocaleContextResolver in the web application context.\
    \ You must set the bean name of the locale resolver to localeContextResolver so\
    \ it is autodetected.\n\n# How It Works\n\nSpring WebFlux ships with several default\
    \ implementations of the LocaleContextResolver interface, some of which allow\
    \ the Locale to be changed. To change the locale, one can use a WebFilter to allow\
    \ users to override the locale they want to use. None of these is provided by\
    \ Spring WebFlux (at least not at the moment of writing); hence, you will need\
    \ to implement them yourself.\n\n# Resolve Locales with an HTTP Request Header\n\
    \nThe default locale resolver registered by Spring Boot is AcceptHeaderLocaleContextResolver.\
    \ It resolves locales by inspecting the accept-language header of an HTTP request.\
    \ This header is set by a user's web browser according to the locale setting of\
    \ the underlying operating system. See Listing 4-25.\n\n> AcceptHeaderLocaleContextResolver\
    \ cannot change a user's locale because it is unable to modify the locale setting\
    \ of the user's operating system.\n\nListing 4-25. AcceptHeaderLocaleContextResolver\
    \ Bean Definition\n\n```\n@Bean\npublic AcceptHeaderLocaleContextResolver localeContextResolver\
    \ () {\n    return new AcceptHeaderLocaleContextResolver();\n}\n```"
