  md: '# Perform Integration Testing with Spring Boot and Mocks


    Spring Boot makes it easy to replace a bean with a mock in the application context.
    For this, Spring Boot has the @MockBean annotation. See Listing 2-17.


    Listing 2-17. MockBean Annotation Sample


    ```

    @MockBean

    private Calculator calculator

    ```


    This would replace the whole calculator with a mocked instance. To be able to
    use it, you would need to define the bean using the regular Mockito way. When
    there are multiple beans of a certain type, you need to specify the name attribute
    of the bean you want to replace. See Listing 2-18.


    Listing 2-18. MockBean Annotation with Name Sample


    ```

    @MockBean(name="addition")

    private Operation mockOperation;

    ```


    This would replace the regular Addition bean with a mocked instance, which we
    can then use to register mock behavior. When a bean with that name cannot be found,
    the mocked bean will be registered as a new instance of that bean. See Listing
    2-19.


    Listing 2-19. MockBean Annotation with Name Sample (Nonexistent Bean)


    ```

    @MockBean(name="division")

    private Operation mockOperation;

    ```


    This would not replace an existing bean but add a bean to the application context,
    and as a result, the Calculator would have an additional operation added to the
    operations it can handle. You could test that using the ReflectionTestUtils helper
    class from the Spring test framework. See Listing 2-20.'
