    * Spring AMQP (RabbitMQ)


    Spring Boot exposes some properties in the management.observations namespace to
    configure certain features (see Table 9-4). Some observations could be disabled,
    but it is also possible to set default values to include in the observations.
    This can be useful to include parts like the application name or version as default
    key/values.


    # Table 9-4. Observation Configuration Properties


    | Property | Description |

    |---|---|n| management.observations.enable.<key> | Sets whether the given observation
    of <key> should be enabled; the default is true. all is a special keyword to enable
    or disable all observations. |

    | management.observations.http.client.requests.name | Sets the name of the observation
    for the client requests; default is http.client.requests. |

    | management.observations.http.server.requests.name | Sets the name of the observation
    for the client requests; default is http.server.requests. |

    | management.observations.key-values.<key> | Sets the common key/values that are
    applied to all observations. The default is empty. |

    | management.observations.r2dbc.include-parameter-values | Sets whether to include
    the query parameters for the R2DBC observations; the default is false. |


    > When Spring Boot detects a preconfigured ObservationHandler, it will not configure
    one for you, and the properties from Table 9-4 won''t be applied as it is expected
    that you do the full configuration!'
