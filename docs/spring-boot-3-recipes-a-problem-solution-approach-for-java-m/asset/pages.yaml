    \ |\n| java.util.Map | javax.jms.MapMessage |\n| java.io.Serializable | javax.jms.ObjectMessage\
    \ |\n| byte[] | javax.jms.BytesMessage |\n\nLet's send an Order to the orders\
    \ queue, and let's use Jackson to send JSON instead of using the Java Serialization\
    \ mechanism. See Listing 8-10.\n\n# Listing 8-10. Order Class\n\n```\npackage\
