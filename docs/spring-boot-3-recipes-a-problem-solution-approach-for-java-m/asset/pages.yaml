  md: '# Solution


    Change the packaging of the application from JAR to WAR and let your Spring Boot
    application extend SpringBootInitializer so that it can bootstrap itself as a
    regular application. Lastly, make sure the server you use for development is included
    as a provided dependency so that it can be filtered while generating the deployable
    artifact.


    # How It Works


    To make Recipe 3-1 into a deployable WAR, three things need to be done.


    +   1. Change the packaging from JAR to WAR.

    2. Extend SpringBootInitializer to bootstrap the application on deployment.

    3. Change the scope of the embedded server to provided.


    In the pom.xml file, change the packaging from JAR to WAR. See Listing 10-4.


    # Listing 10-4. Create a WAR File with Maven


    ```

    <packaging>war</packaging>

    ```


    To prevent the embedded container from adding its classes to the web application,
    the scope of the embedded container needs to be changed to provided instead of
    the default compile.

    When using an embedded Tomcat (the default), add Listing 10-5 to pom.xml.


    # Listing 10-5. Scoped Dependency


    ```

    <dependency>

    <groupId>org.springframework.boot</groupId>

    <artifactId>spring-boot-starter-tomcat</artifactId>

    <scope>provided</scope>

    </dependency>

    ```


    When using a different embedded container, see Recipe 3-7; then change the scope
    of that container to provided by including <scope>provided</scope>. When doing
    so, the Spring Boot plugin will not add the libraries to the default WEB-INF/lib.
    However, they will still be part of the created WAR file, but in the special WEB-INF/provided'
