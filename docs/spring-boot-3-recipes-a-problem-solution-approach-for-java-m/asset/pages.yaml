  md: "# Make It More Reactive\n\nWhen running the application and opening the page,\
    \ you have to wait some time before the page starts to render. When rendering\
    \ a page and the model contains Flux, it will by default wait until the whole\
    \ Flux is consumed. After that, it will start rendering the page. It basically\
    \ behaves like you would retrieve a Collection instead of a Flux. To start rendering\
    \ the page quicker and get the page streaming, wrap the Flux in a ReactiveDataDriverContextVariable.\
    \ See Listing 4-14.\n\nListing 4-14. Method Using ReactiveDataDriverContextVariable\n\
    @GetMapping(\"/books.html\")\n\n```\npublic String all(Model model) {\n    var\
    \ books = new ReactiveDataDriverContextVariable(bookService;\n    findAll(), 5);\n\
    \    model.addAttribute(\"books\", books);\n    return \"books/list\";\n}\n```\n\
    \nThe all method looks the same, but notice that the Flux is wrapped in ReactiveDataDriverContextVariable.\
    \ This will start rendering as soon as five elements are received and will continue\
    \ to render the page until everything is received. Now when opening the books\
    \ page, you will see the table grow until all orders are read.\n\n# 4-4. Handle\
    \ Exceptions with Spring WebFlux Problem\n\nYou want to configure the exception\
    \ handling for Spring WebFlux and configure according to your needs.\n\n# Solution\n\
    \nSpring WebFlux provides several ways of handling exceptions, and with Spring\
    \ Boot has become pretty easy to modify the default behavior."
