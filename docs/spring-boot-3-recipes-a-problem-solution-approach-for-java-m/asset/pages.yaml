  md: "# CHAPTER 6 DATA ACCESS\n\nthe result to a Customer. The map method used here\
    \ takes a Function, which maps io.r2dbc.spi.Readable(a Row is just like that)\
    \ to another element. The all() method instructs the DatabaseClient that we have\
    \ 0 or more results to return, and thus it will create a Flux. The findById executes\
    \ a query by first binds to fill in the :id attribute in the query; then we map\
    \ the result. The one() method instructs DatabaseClient to return 0 or 1 result;\
    \ if we get multiple results, an error will be issued.\n\nThe save is a bit more\
    \ complicated as we need to get the id; we can use the filter method to modify\
    \ io.r2dbc.spi.Statement and instance to return the generated keys. We need to\
    \ bind the :name and :email attributes. Using first() we get the first result\
    \ returned. We could also use one() in this case. As we get a MonoLong>, which\
    \ contains the generated ID of the Customer, we can use the method to instruct\
    \ to create a Customer with that ID and the given Customer to save.\n\n# Use R2dbcTemplate\n\
    \nWhen Spring Data R2DBC is detected on the classpath, Spring Boot will, in addition\
    \ to DatabaseClient, also automatically prepare a R2dbcEntityTemplate instance.\
    \ R2dbcTemplate is a wrapper around DatabaseClient to make it easier to work with\
    \ database entities (Listing 6-74).\n\n**Listing 6-74.** Reactive CustomerRepository\
    \ Implementation with DatabaseClient\n\n```\npackage com.apress.springframework3recipes.r2dbc;\n\
    import static org.springframework.data.relational.core.query.Criteria.where;\n\
    \nimport org.springframework.data.r2dbc.R2dbcEntityTemplate;\nimport org.springframework.data.relational.core.query.Query;\n\
    import org.springframework.data.stereotype.Repository;\n\nimport reactor.core.publisher.Flux;\n\
    import reactor.core.publisher.Mono;\n\n@Repository\nclass R2dbcCustomerRepository\
    \ implements CustomerRepository {\n    private final R2dbcEntityTemplate template;\n\
    ```\n\n343"
