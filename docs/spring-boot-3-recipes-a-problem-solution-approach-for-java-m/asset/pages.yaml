  md: '# CHAPTER 3 SPRING MVC


    # Solution


    Get a certificate, place it in a keystore, and use the server.ssl properties to
    configure the keystore. Spring Boot will then automatically configure the server
    to be accessible through HTTPS only.


    # How It Works


    Using the server.ssl.keystore (and related properties), you can configure the
    embedded container to accept only an HTTPS connection. Before you can configure
    SSL, you will need to have a certificate to secure your application. Generally,
    you will want to get a certificate from a certificate authority like Verisign
    or Let’s Encrypt. However, for development purposes, you can use a self-signed
    certificate (see the section “Create a Self-Signed Certificate”).


    # Create a Self-Signed Certificate


    Java comes with a tool called the keytool, which can be used to generate certificates,
    among other things. See Listing 3-35.


    +   Listing 3-35. keytool Command


    ```

    keytool -genkey -keyalg RSA -alias sb3-recipes -keystore sb3-recipes.pfx -storepass
    password -validity 3600 -keysize 4096 -storetype pkcs12

    ```


    This command will tell keytool to generate a key using the RSA algorithm and place
    it in the keystore sb3-recipes.pfx and it will be valid for 3,600 days. When running
    the command, it will ask a few questions. Answer accordingly (or leave them empty).
    After that, there will be a file sb3-recipes.pfx containing the certificate and
    protected with a password.


    Place this file in the src/main/resources folder so that it is packaged as part
    of your application and Spring Boot can easily access it.


    > Using a self-signed certificate will produce a warning in the browser that the
    website isn’t safe and protected.'
