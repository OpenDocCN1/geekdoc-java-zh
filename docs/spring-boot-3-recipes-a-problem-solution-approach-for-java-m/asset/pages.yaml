    # # Configure Tracing


    Spring Boot exposes some properties to make it easier to configure tracing. You
    can configure the propagation type it should and how many of the calls should
    be sampled (the default is 10%). By default it will be enabled if detected, but
    you can also disable it.


    **Table 9-5.** Tracing Configuration Properties


    | Property | Description |

    | --- | --- |

    | management.tracing.enabled | Sets whether the auto-configuration of tracing
    should be enabled; default is true. |

    | management.tracing.sampling | Sets the probability of the sample range, from
    0 to 1.0; the default is 0.1. |

    | management.propagation.type | Lists supported tracing context propagations (can
    contain W3C, B3, or B3_MULTI); the default is null. When set, it takes precedence
    over the more fine-grained consumes and produces properties. |

    | management.tracing.consume | Lists supported tracing context propagations for
    receiving (can contain W3C, B3, or B3_MULTI); the default is all values. |

    | management.tracing.produce | Lists supported tracing context propagations for
    sending (can contain W3C, B3, or B3_MULTI); the default is W3C. |

    | management.tracing.sampling | Probability in the range from 0.0 to 1.0 that
    a trace will be sampled. |


    Next, it is possible to configure Zipkin. Mainly the URL to the endpoint and some
    connection timeouts can be set (see Table 9-6). This applies to other solutions
    such as Wavefront, Open Telemetry, and Prometheus.'
