  md: "# CHAPTER 2 THE BASICS OF SPRING BOOT\n\n# Listing 2-20. Validating the Number\
    \ of Operations\n\n```\n@Test\npublic void calculatorShouldHave30operations()\
    \ {\n    var operations = ReflectionTestUtils.getField(calculator,\n        \"\
    operations\");\n    assertEquals(3, ((Collection<Operation>) operations).size());\n\
