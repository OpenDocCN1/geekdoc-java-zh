    import org.springframework.web.bind.annotation.RestController;\nimport org.springframework.web.client.WebClientResponseException;\n\
    import org.springframework.web.reactive.function.client.WebClient;\nimport reactor.core.publisher.Mono;\n\
    \nimport java.util.Map;\n\n@RestController\n@RequestMapping(\"/books\")\npublic\
    \ class EnrichedBookController {\n    private static final String BOOKS_URL =\
    \ \"http://localhost:8080/books/\n    {isbn}\";\n    private static final String\
    \ OL_API = \"https://openlibrary.org/isbn/\n    {isbn}.json\";\n    private final\
    \ WebClient rest;\n\n    public EnrichedBookController(WebClient rest) {\n   \
    \     this.rest = rest;\n    }\n\n    @GetMapping(\"{isbn}\")\n    public Mono<ResponseEntity<EnrichedBook>>\
    \ get(@PathVariable(\"isbn\")\n    String isbn) {\n        var book = rest.get().uri(BOOKS_URL,\
