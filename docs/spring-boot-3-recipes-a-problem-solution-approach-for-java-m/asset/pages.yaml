  md: '# Solution


    To avoid creating different versions of a page for different locales, you should
    make your web page independent of the locale by externalizing locale-sensitive
    text messages. Spring is able to resolve text messages for you by using a message
    source, which has to implement the MessageSource interface. In your page templates,
    you can then either use special tags or do lookups for the messages.


    # How It Works


    Spring Boot automatically configures a MessageSource when it finds a properties
    file in src/main/resources (the default location). This messages file contains
    the default messages to be used in your application. Spring Boot will use the
    Accept-Language header from the request to determine which locale to use for the
    current request (see Recipe 3-6 on to change that).


    There are properties that change the way the MessageSource reacts to missing translations,
    caching, etc. See Table 3-6 for an overview of the properties.


    # Table 3-6. I18N Properties


    | Property | Description |

    | --- | --- |

    | spring.messages.basename | Comma-separated list of base names; the default is
    messages. |

    | spring.messages.encoding | Message bundle encoding; the default is UTF-8. |

    | spring.messages.always-use-message-format | Sets whether MessageFormat should
    be applied to all messages; the default is false. |

    | spring.messages.fallback-to-system-locale | Fallback to the system''s locale
    when no resource bundle is found. When disabled, this will load the defaults from
    the default file. The default is true. |

    | spring.messages.default-use-code-as-default-message | Use the message code as
    a default message when no message can be found instead of throwing a NoSuchMessageException.
    The default is false. |

    | spring.messages.cache-duration | Cache duration; the default is forever. |'
