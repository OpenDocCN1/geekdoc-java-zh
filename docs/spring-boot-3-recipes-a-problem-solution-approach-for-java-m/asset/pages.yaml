  md: '# CHAPTER 4 WEBFLUX


    With the addition of this dependency Dialect you will get the Thymeleaf library
    as well as the Thymeleaf Spring Dialect so that they integrate nicely. Because
    of the existence of these two libraries, Spring Boot will automatically configure
    the ThymeleafReactiveViewResolver. The ThymeleafReactiveViewResolver requires
    a Thymeleaf SpringWebFluxTemplateEngine to be able to resolve and render the views.
    A special SpringWebFluxTemplateEngine will be preconfigured with SpringDialect
    that you can use SpEL inside Thymeleaf pages.


    Configuring Thymeleaf Spring Boot exposes several properties in the spring. thymleaf
    and spring.thymeleaf.reactive namespaces (see Table 4-1).


    # ### Table 4-1. Thymeleaf Properties


    | Property | Description |

    | --- | --- |

    | spring.thymeleaf.prefix | Sets the prefix to use for the ViewResolver; the default
    is classpath:/templates. |

    | spring.thymeleaf.suffix | Sets the suffix to use for the ViewResolver; the default
    is .html. |

    | spring.thymeleaf.encoding | Sets the encoding of the templates; the default
    is UTF-8. |

    | spring.thymeleaf.check-template | Checks if the template exists before rendering;
    the default is true. |

    | spring.thymeleaf.check-template-location | Checks if the template location exists.
    |

    | spring.thymeleaf.mode | Sets the Thymeleaf TemplateMode to use; the default
    is HTML. |

    | spring.thymeleaf.cache | Sets whether resolved templates should be cached; the
    default is true. |

    | spring.thymeleaf.template-resolver-order | Sets the order of the ViewResolver;
    the default is 1. |

    | spring.thymeleaf.view-names | Sets the view names (separated by commas) that
    can be resolved with this ViewResolver. |


    (continued)'
