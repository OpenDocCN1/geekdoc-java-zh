  md: "# CHAPTER 6 DATA ACCESS\n\n@Autowired\n\n```\nprivate CustomerRepository repository;\n\
    \n@BeforeEach\npublic void cleanUp() {\n    repository.deleteAll();\n}\n```\n\n\
    @DataTest executes the test by the special JUnit extension (SpringExtension) to\
    \ bootstrap the Spring Test Context framework. Now to register the special JUnit\
    \ extension for Testcontainers, the @Testcontainers annotation has been added.\
    \ This extension finds annotated with @Container and will bootstrap the given\
    \ container. For this test, that is a MongoDBContainer, which we instruct to use\
    \ a MongoDB 6.0 container. Testcontainers will take care of the download of this\
    \ container and start an instance and stop it after the test.\n\nAs the container\
    \ for each test will start with a different URL, we need to tell this our Spring\
    \ Boot application. For this we can use the @ServiceConnection annotation. This\
    \ will pass the required and needed properties to the container automatically.\
    \ See also Recipe 2-3 for more information on this.\n\n# 6-9. Access Data with\
    \ R2DBC\n\nMost Java developers will know, or at least have heard of, the JDBC\
    \ API (see the beginning of this chapter). JDBC, however, is blocking by nature\
    \ and will not do well in an environment with reactive programming. For reactive\
    \ programming and SQL databases, there is R2DBC. This is a low-level reactive\
    \ API (or SPI) developed by the community. Several database already have a driver\
    \ implementation based on this SPI, such as (but not limited to) PostgreSQL, Oracle,\
    \ MySQL, and H2.\n\n# Problem\n\nYou have a reactive application but are still\
    \ using a relational database. Using JDBC isn't an option as that is blocking\
    \ in nature. Use R2DBC to have a reactive way to access your database."
