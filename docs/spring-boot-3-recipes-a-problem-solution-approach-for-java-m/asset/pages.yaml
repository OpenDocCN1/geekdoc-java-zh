  md: "# CHAPTER 3 SPRING MVC\n\n@Bean\n\n```\npublic BookServiceClient bookServiceClient(HttpServiceProxyFactory\
    \ factory) {\n    return factory.createClient(BookServiceClient.class);\n}\n```\n\
    \n@Bean\n\n```\npublic OpenLibraryClient openLibraryClient(HttpServiceProxyFactory\
    \ factory) {\n    return factory.createClient(OpenLibraryClient.class);\n}\n```\n\
    \nRestClient.Builder is used to construct a RestClient for use with the HttpServiceProxyFactory.\
    \ As the RestClient cannot be used directly, we need to wrap it in a RestClientAdapter,\
    \ which adapts RestClient to the HttpExchangeAdapter.\n\nHttpExchangeAdapter has\
    \ three implementations: RestClientAdapter, RestTemplateAdapter, and WebClientAdapter.\
    \ The latter is used in Chapter 4 and is nonblocking. However, it is also possible\
    \ to use a RestTemplate to execute the requests of a RestClient.\n\nHttpServiceProxyFactory\
    \ in turn is used to create proxies for BookServiceClient and OpenLibraryClient.\
    \ This is simply done by calling createClient with the given interface on HttpServiceProxyFactory.\
    \ See 3-59.\n\nListing 3-59. EnrichedBookController with Declarative Clients\n\
    \n```\npackage com.apress.spring3recipes.library.rest;\n\nimport com.apress.spring3recipes.library.Book;\n\
    import com.apress.spring3recipes.library.EnrichedBook;\nimport org.springframework.http.ResponseEntity;\n\
