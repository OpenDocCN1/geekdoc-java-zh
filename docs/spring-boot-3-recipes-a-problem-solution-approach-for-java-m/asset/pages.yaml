  md: "# CHAPTER 4 WEBFLUX\n\n```\n@GetMapping(\"/orders\")\npublic Flux<Order> orders()\
    \ {\n    return orderService.findAll().delayElements(Duration.ofMillis(32));\n\
    }\n```\n\n```\n@GetMapping(value = \"/orders\", produces = MediaType.TEXT_EVENT_STREAM_VALUE)\n\
    public Flux<ServerSentEvent<Order>> orderEvents() {\n    return orderService.findAll()\n\
    \        .map(this::toEvent)\n        .delayElements(Duration.ofMillis(32));\n\
    }\nprivate ServerSentEvent<Order> toEvent(Order order) {\n    return ServerSentEvent.builder(order)\n\
    \        .event(\"order-event\")\n        .id(order.id()).build();\n}\n```\n\n\
    We create a dedicated ServerSentEvent for each Order we receive. We specify the\
    \ id and event. The order is used as the body (the data field). Finally, after\
    \ calling the build method, we can use the created ServerSentEvent.\n\nNow when\
    \ the URL http://localhost:8080/orders with a Content-Type of text/event-stream\
    \ is called, you see events coming in one by one (Figure 4-14)."
