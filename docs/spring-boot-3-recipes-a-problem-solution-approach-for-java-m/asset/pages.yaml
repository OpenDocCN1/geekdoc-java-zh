  md: "# CHAPTER 3 SPRING MVC\n\nIn addition to the method arguments, there is also\
    \ support for several method return types. See Table 3-18.\n\n# ### Table 3-18.\
    \ HttpExchange Supported Method Return Types\n\n| Type | Description |\n| ---\
    \ | --- |\n| void | Perform the request; no response. |\n| HttpHeaders | Perform\
    \ the request and return only the headers. |\n| <T> | Perform the request and\
    \ return the decoded body as type T. |\n| ResponseEntity<Void> | Perform the request\
    \ and return a ResponseEntity with the status and headers. |\n| ResponseEntity<T>\
    \ | Perform the request and return a ResponseEntity with the status and the body\
    \ decoded as type T. |\n\nGiven this information, we could provide two interfaces\
    \ to provide access to the APIs that we need to call. Let's start with the API\
    \ for the books. See Listing 3-56.\n\n# ### Listing 3-56. BookServiceSources\n\
    \n```\npackage com.apress.springboot3recipes.library.rest;\n\nimport com.apress.springboot3recipes.library.Book;\n\
    import org.springframework.web.bind.annotation.PathVariable;\nimport org.springframework.web.service.annotation.GetMapping;\n\
    \npublic interface BookService {\n\n    @GetMapping(\"http://localhost:8080/books/{isbn}\"\
    )\n    Book getBook(@PathVariable String isbn);\n}\n```\n\nThe BookService has\
    \ one method, which is annotated with @GetMapping. There is a provided value of\
    \ http://localhost:8080/books/{isbn}, which is a URI template. The method takes\
    \ a single argument isbn, which has been annotated with @PathVariable. When calling\
    \ this method, the value we pass in will be placed in the {isbn} part of the URI\
    \ before executing the request. The request has been sent, a response comes in\
    \ that is converted to a Book, just as we did with the RestTemplate or RestClient.\n\
    \n156"
