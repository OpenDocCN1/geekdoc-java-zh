  md: '# Use Artemis with a Connection Pool


    When using Artemis, it is also possible to use a pool of JMS connections (much
    like a JDBC-based connection pool). By default this is disabled. To enable and
    configure it, you can use the properties in the spring.artemis.pool namespace
    (see Table 8-5).


    **Table 8-5.** ActiveMQ Pooling Configuration Properties


    | Property | Description |

    | --- | --- |

    | spring.artemis.pool.enabled | Sets whether a connection pool should be used;
    the default is false. |

    | spring.artemis.pool.max-connections | Sets the maximum number of connections;
    the default is 1. |

    | spring.artemis.pool.maximum-active-session-per-connection | Sets the maximum
    number of active JMS sessions allowed per connection; the default is 500. |

    | spring.artemis.pool.idle-timeout | Sets how long a connection can be idle; the
    default is 30 seconds. |

    | spring.artemis.pool.expiry-timeout | Sets how long before a connection is expired;
    the default is 0 (never). |

    | spring.artemis.pool.reconnect-on-exception | Rests the connection when a JMSException
    occurs; the default is true. |

    | spring.artemis.pool.block-if | Blocks when a connection is requested or throws
    a JMSException instead; the default is true. |

    | spring.artemis.pool.block-if-timeout | Sets how long to block before throwing
    a JMSException; the default is -1 (which blocks until a connection is available).
    |

    | spring.artemis.pool.create-connection-on-startup | Sets whether a connection
    should be eagerly created on startup of the application; the default is true.
    |


    Using the pooling facility requires the pooled-jms dependency to be added to your
    build file. See Listing 8-4.'
