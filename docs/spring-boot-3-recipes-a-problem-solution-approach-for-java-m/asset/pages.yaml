  md: "ServerHttpSecurity should look familiar (see the other recipes in this chapter)\
    \ and is used to add security rules and further configuration (such as adding/\
    \ removing headers and configuring the login method). With authorizeExchange,\
    \ it is possible to write rules; here we secure URLs. The / is permitted for everyone,\
    \ and the /orders URLs are available only for the role USER. For other requests,\
    \ you have to at least be authenticated. Finally, you need to call build() to\
    \ actually build and return the SecurityWebFilterChain.\n\nIn addition to authorizeExchange,\
    \ it is possible to use the headers() configuration method to add security headers\
    \ to requests, use csrf() to add CSRF protection, etc.\n\n# Log in to WebFlux\
    \ Applications\n\nYou can override parts of the default configuration by explicitly\
    \ configuring them, and you can override the authentication manager used and the\
    \ repository to store the security context. The authentication manager is detected\
    \ automatically; you just need to register a bean of type ReactiveAuthenticationManager\
    \ or UserDetailsRepository.\n\nYou can also configure the location where SecurityContext\
    \ is stored by configuring the ServerSecurityContextRepository. The default implementation\
    \ is using the WebSessionSecurityContextRepository, which stores the context in\
    \ WebSession. The other default implementation is NoopServerSecurityContextRepository,\
    \ which is used in stateless applications. See Listing 5-37.\n\nListing 5-37.\
    \ Spring Security Configuration\n\n```\n@Bean\nSecurityWebFilterChain springWebFilterChain(ServerHttpSecurity\
    \ http) throws Exception {\n    return http\n        .formLogin(new CustomReactiveAuthenticationManager())\n\
    \        .securityContextRepository(new NoopServerSecurityContextRepository())\n\
    \        .build();\n}\n```\n\nThis will override the defaults with a CustomReactiveAuthenticationManager\
    \ and the stateless NoopServerSecurityContextRepository. However, for our application,\
    \ we are going to stick with the defaults."
