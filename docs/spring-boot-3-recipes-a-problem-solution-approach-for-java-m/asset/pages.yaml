    \ registered.\n\nUsing the mock is straightforward. See Listing 2-21.\n\n# Listing\
    \ 2-21. Using the Mocked Bean\n\n```\n@Test\npublic void mockDivision(CapturedOutput\
    \ capture) {\n    when(mockOperation.handles('/')).thenReturn(true);\n    when(mockOperation.apply(14,\
    \ 7)).thenReturn(2);\n\ncalculator.calculate(14, 7, '/');\n    assertTrue(capture.getOut().contains(\"\
    14 / 7 = 2\"));}\n```\n\nHere we instruct Mockito to return true when a division\
    \ (/) is being tested and return a value when the apply method is called. Next\
    \ the method is called, and we assert that the output is what is expected from\
    \ this test.\n\n# Perform Integration Testing with Spring Boot Slices\n\nInstead\
    \ of using @SpringBootTest, you can also test part of your application. For this,\
    \ Spring Boot has so-called slices. With the dedicated @Test annotation (see Table\
    \ 2-2), it will load an ApplicationContext with only the parts of the configuration\
    \ that are needed. For instance, when using @JdbcTest, it will create an ApplicationContext\
    \ with only the JDBC-related beans like a DataSource, JdbcTemplate, etc. It will\
    \ not create all non-related beans like your web server or web-related beans."
