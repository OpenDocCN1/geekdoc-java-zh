  md: '# Configure Individual Management Endpoints


    Individual endpoints can be configured through properties in the management. <endpoint-name>
    namespace. Most of them have at least an enabled property and a cache.time-to-live
    property. The first will enable or disable the endpoint. The other one specifies
    how long to cache the result of the endpoint (see Table 9-2).


    # Table 9-2. Endpoint Configuration Properties


    | Property | Description |

    | management.endpoint.<endpoint-name>.enabled | Sets whether the specific endpoint
    is enabled; generally defaults to true and sometimes depends on availability of
    a feature. For example, if Flyway isn''t present, then enabling the flyway endpoint
    wouldn''t have any effect. |

    | management.endpoint.<endpoint-name>.cache.time-to-live | Sets the time to cache
    a response; the default is 0ms, meaning no caching. |

    | management.endpoint.health.showdetails | Sets whether to show details for the
    health endpoint; the default is never and can be changed to always or when_authorized.
    |

    | management.endpoint.configprops.show-values | Sets when to show unsanitized
    values for the endpoint; the default is never. This can be changed to always or
    when_authorized. |

    | management.endpoint.env.show-values | |

    | management.endpoint.env.quartz.show-values | |

    | management.endpoint.configprops.roles | Sets the roles that are allowed to see
    the details (use with when_authorized for show-details/show-values). |

    | management.endpoint.env.roles | |

    | management.endpoint.health.roles | |

    | management.endpoint.quartz.roles | |'
