    # Initialize the Database with Flyway


    When developing an application, you want more control of the database migration.
    While using schema.sql and data.sql files is very quick and easy, it will eventually
    get cumbersome to maintain. Spring Boot also supports Flyway, which is, simply
    said, a version control for your database schema. It allows you to incrementally
    change/update your database schema. To use Flyway, the first thing to do is to
    add the dependency on Flyway itself (Listing 6-12).


    Listing 6-12. Flyway Dependency


    ```

    <dependency>

    <groupId>org.flydb</groupId>

    <artifactId>flyway-core</artifactId>

    </dependency>

    ```


    Spring Boot will detect the presence of Flyway, and it will assume you want to
    use it to database migrations. The migration scripts should be in the db/migration
    folder in src/main/resources. This is the default location that can be changed
    by specifying spring.flyway.locations in your application.properties file. See
    Listing 6-13 for a migration script to use instead of schema.sql and data.sql.


    Listing 6-13. Flyway Migration Script


