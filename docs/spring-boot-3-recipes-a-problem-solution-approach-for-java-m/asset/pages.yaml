  md: "# Listing 6-78. CustomerRepositoryTest Class\n\n```\n@DataR2dbcTest\n@TestPropertySource(properties\
    \ =\n    { \"spring.r2dbc.url=r2dbc:h2://mem:testdb,\n      \"spring.r2dbc.generate-unique-name=true\"\
    \ }\n@Import(R2dbcCustomerRepository.class)\nclass CustomerRepositoryTest {\n\
    ```\n\n```\n@Autowired\n    private CustomerRepository repository;\n\n    @Autowired\n\
    \    private DatabaseClient db;\n\n    @BeforeEach\n    public void setup() {\n\
    \        db.sql(\"DELETE FROM customer\").fetch().first().subscribe();\n    }\n\
    ```\n\nThe @DataR2dbcTest annotation executes the test by a special JUnit extension\
    \ (SpringExtension) to bootstrap the Spring Context framework. The @DataR2dbcTest\
    \ annotation sets up Spring Data RDBC (if needed) and enables all other R2DBC\
    \ features. Using @TestPropertySource, we provide spring.r2dbc.url with an H2\
    \ in-memory database, and we set spring.r2dbc.generate-unique-name to true. As\
    \ we want to test our repository, we add @Import(R2dbcCustomerRepository.class).\
    \ In @BeforeEach we clean the database as to not have one test interfere with\
    \ another test.\n\nTip When using the Spring Data R2DBC-based repository, you\
    \ don't need @Import as the repository will be automatically detected.\n\nNow\
    \ write a test that tests records get inserted correctly (Listing 6-79)."
