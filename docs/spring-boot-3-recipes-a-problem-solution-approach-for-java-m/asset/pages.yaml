  md: "```\npublic record EnrichedBook(\n  String isbn,\n  String title,\n  String\
    \ published,\n  List<String> authors\n) {}\n```\n\n```\n@Override\npublic boolean\
    \ equals(Object o) {\n  if (o instanceof EnrichedBook book) {\n    return Objects.equals(isbn,\
    \ book.isbn);\n  }\n  return false;\n}\n```\n\n```\n@Override\npublic int hashCode()\
    \ {\n  return Objects.hash(isbn);\n}\n```\n\nThis is a slightly extended version\
    \ of the Book class created in Recipe 3-2 (see Listing 3-6). We can reuse the\
    \ Book class to bind the result from our own server. For the Open Library API,\
    \ we will use a HashMap to put the response in and retrieve the elements needed.\n\
    \n# Use a WebClient\n\nA WebClient is constructed through a WebClient.Builder,\
    \ which is exposed by Spring Boot automatically. See Listing 4-41.\n\nListing\
    \ 4-41. WebClient Bean Definition with Builder\n\n```\n@Bean\npublic WebClient\
    \ restClient(WebClient.Builder builder) {\n  var httpClient = HttpClient.create().followRedirect(true);\n\
    \  var connector = new ReactorClientHttpConnector(httpClient);\n  return builder.clientConnector(connector).build();\n\
    }\n\n```"
