  md: "# CHAPTER 4\n\n# WebFlux\n\nSpring WebFlux is a reactive web framework included\
    \ with Spring. It supports fully nonblocking and support Reactive Streams backpressure.\
    \ It runs on servers like Netty, Undertow or Servlet Containers. When such a server\
    \ is detected Spring Boot will automatically configure the server for you.\n\n\
    # 4-1. Develop a Reactive Application with Spring WebFlux\n\n# Problem\n\nYou\
    \ want to develop a simple reactive web application with Spring WebFlux to learn\
    \ the basic concepts and configurations of this framework.\n\n# Solution\n\nThe\
    \ lowest component of Spring WebFlux is **org.springframework.http.server.reactive.Handler**.\
    \ The HttpHandler interface has a single handle method. See Listing 4-1.\n\n**Listing\
    \ 4-1.** HttpHandler Interface\n\n```\npublic interface HttpHandler {\n\n    Mono<Void>\
    \ handle(HttpRequest request, ServerHttpResponse response);\n}\n```"
