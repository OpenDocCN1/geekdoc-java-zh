  md: '# How It Works


    Spring Boot automatically configures a RabbitTemplate when it finds a unique ConnectionFactory;
    this template can be used to send a message to a queue.


    # Configure the RabbitTemplate


    Spring Boot will automatically configure a RabbitTemplate if it can find a unique
    ConnectionFactory and if no RabbitTemplate exists in the configuration. Spring
    Boot allows you to modify the configured RabbitTemplate through properties in
    the spring.rabbitmq.template namespace (see Table 8-11).


    **Table 8-11.** RabbitTemplate Configuration Properties


    | Property | Description |

    | | | |

    | spring.rabbitmq.template.exchange | Sets the name of the default exchange to
    use for send operations; the default is none. |

    | spring.rabbitmq.template.routing-key | Sets the value of a default routing key
    to use for send operations; the default is none. |

    | spring.rabbitmq.template.receive-timeout | Sets the timeout for send and receive
    operations. |

    | spring.rabbitmq.template.reply-timeout | Sets the timeout for receive operations.
    |


    Spring Boot also makes it easy to configure retry logic with RabbitTemplate, but
    by default it is disabled. Putting spring.rabbitmq.template.retry.enabled=true
    in application.properties will enable it. When sending fails, it will try an additional
    times to send the message. To change the number of retries or the interval, you
    can use properties from the spring.rabbitmq.template.retry namespace (see Table
    8-12).'
