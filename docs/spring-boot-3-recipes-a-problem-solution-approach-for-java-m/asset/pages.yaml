  md: '# Table 5-8. Spring Security Built-in Expressions


    | Expression | Description |

    | --- | --- |

    | hasRole(''role'') or hasAuthority(''authority'') | Returns true if the current
    user has the given role |

    | hasAnyRole(''role1'',''role2'') or hasAnyAuthority(''auth1'',''auth2'') | Returns
    true if the current user has at least one of the given roles |

    | hasIpAddress(''ip-address'') | Returns true if the current user has the given
    IP address |

    | principal | The current user |

    | authentication | Access to the Spring Security authentication object |

    | permitAll() | Always evaluates to true |

    | denyAll() | Always evaluates to false |

    | isAnonymous() | Returns true if the current user is anonymous |

    | isRememberMe() | Returns true if the current user logged in by the means of
    remember-me functionality |

    | isAuthenticated() | Returns true if this is not an anonymous user |

    | isFullyAuthenticated() | Returns true if the user is not an anonymous or a remember-me
    user |

    | access() | Use a function to determine whether access is granted |


    > Although role and authority are almost the same, there is a slight, important,
    difference in how they are processed. When passed-in value for the role will be
    checked if it starts with ROLE_ (the default prefix). If not, this will be added
    before checking the authority. So, hasRole(''ADMIN'') will actually check if the
    current user has the authority ROLE_ADMIN. When using hasAuthority, it will check
