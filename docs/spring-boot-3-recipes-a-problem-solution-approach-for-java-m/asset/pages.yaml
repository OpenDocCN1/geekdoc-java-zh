  md: "# Solution\n\nIn Spring Security, authentication is performed by one or more\
    \ AuthenticationProviders, connected as a chain. If any of these providers authenticates\
    \ a user successfully, that user will be able to log into the application. If\
    \ any provider reports that the user is disabled or locked or that the credential\
    \ is incorrect, or if no provider can authenticate the user, then the user will\
    \ be unable to log into this application.\n\nSpring Security supports multiple\
    \ ways of authenticating users and includes built-in provider implementations\
    \ for them. You can easily configure these providers with the built-in XML elements.\
    \ Most common authentication providers authenticate users against a repository\
    \ storing user details (e.g., in an application's memory, a relational database,\
    \ or an LDAP repository).\n\nWhen storing user details in a repository, you should\
    \ avoid storing user passwords in clear text, because that makes them vulnerable\
    \ to hackers. Instead, you should always store encrypted passwords in your repository.\
    \ A typical way to use a one-way hash function to encode the passwords. When a\
    \ user enters a password to log in, you apply the same hash function to this password\
    \ and compare the result with the one stored in the repository. Spring Security\
    \ supports several algorithms for encoding passwords (including BCrypt and SCrypt)\
    \ and provides built-in password encoders for these algorithms.\n\n# How It Works\n\
    \nLet's talk about how it works.\n\n# Authenticate Users with In-Memory Definitions\n\
    \nIf you have only a few users in your application and you seldom modify their\
    \ details, you can consider defining the user details in Spring Security's configuration\
    \ file so that they will be loaded into your application's memory. See Listing\
    \ 5-21.\n\nListing 5-21. In-Memory UserDetailsService Configuration\n\n```\n@Bean\n\
    public UserDetailsService userDetailsService() {\n    var adminUser = User.withDefaultPasswordEncoder()\n\
    ```"
