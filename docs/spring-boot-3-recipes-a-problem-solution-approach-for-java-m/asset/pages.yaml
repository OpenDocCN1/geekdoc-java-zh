    # 6-2. Manage the Database Schema with Spring Boot

    Problem


    You need to initialize or extend the objects in the schema of the database you
    are using, and you want them to be triggered/managed by your Spring Boot application.


    > There is a postgres.sh script in the bin directory that will start a PostgreSQL
    server for use with this recipe.


    # Solution


    Spring Boot has out-of-the-box support for simple database management as well
    as Flyway and Liquibase. Include the (if needed) dependencies, and Spring Boot
    will automatically use the database management of your choice and provide sensible
    defaults as well as the ability to apply some configuration properties.


    # How It Works


    When working with an existing database, you probably already have existing tables,
    views, and procedures. However, when you create a new database, it is empty, and
    you will need to create the tables yourself. Using Spring Boot, this is supported
    out of the box. You can add a schema file to initialize the schema (tables, views,
    etc.) and a data sql file to insert data into the tables. Spring Boot will allow
    you to provide a schema-<platform>.sql and data-<platform>.sql to do database-specific
    initialization.


