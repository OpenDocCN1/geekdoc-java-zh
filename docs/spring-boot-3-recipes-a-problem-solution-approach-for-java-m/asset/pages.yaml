  md: '# Table 4-10. HttpExchange-Supported Method Arguments


    | Type | Description |

    | --- | --- |

    | java.net.URI | Dynamically sets the URL for the request; overrides the url attribute
    from the @HttpFile |

    | UriBuilderFactory | Provides a UriBuilderFactory to expand the URI template
    and variables. Used instead of the UriBuilderFactory of the underlying client.
    |

    | HttpMethod | Dynamically sets the HTTP method to use for the request; overrides
    the method attribute from the @HttpExchange |

    | MultipartFile | Adds a request part from a MultipartFile, typically used with
    Spring MVC to indicate an uploaded file. |

    | @COOKIE | Adds cookies to the outgoing request. The argument can be a Map<String,
    ?> or a MultiValueMap<String, ?> ?> with multiple cookies or individual values.
    Uses the type conversion for non-String values. |

    | @RequestHeader | Adds headers to the outgoing request. The argument can be a
    Map<String, ?> or a MultiValueMap<String, ?> ?> with multiple headers or individual
    values. Uses the type conversion for non-String values. |

    | @PathVariable | Adds a variable to expand a placeholder in the request URL.
    The argument can be a Map<String, ?> for multiple values or an individual value.
    Uses the type conversion for non-String values. |

    | @RequestBody | Provides the body of the request either to be serialized or as
    a Reactive Streams Publisher such as Mono, Flux, or any other async type supported
    by the configured ReactiveAdapterRegistry. |

    | @RequestParam | Adds request parameters. Can be a Map<String, ?> / ?> MultiValueMap<String,
    ?> for multiple values. Or can be an individual type. Uses the type conversion
    for non-String values. When contentType is application/x-www-form-urlencoded,
    the parameters are added to the request body. |

    | @RequestPart | Adds a request part that can be a String (becomes a form field),
    a Resource, an Object to be encoded as JSON (or whatever is configured), HttpEntity
    including headers, a Spring Part, or a supported Reactive Streams Publisher. |'
