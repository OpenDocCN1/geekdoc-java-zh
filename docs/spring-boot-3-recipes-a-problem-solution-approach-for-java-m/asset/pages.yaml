  md: '# CHAPTER 2 THE BASICS OF SPRING BOOT


    # Table 2-1. Configuration Parameters


    | Parameter | Description |

    | spring.config.name | Comma-separated string of filenames to load; the default
    is application. |

    | spring.config.location | Comma-separated string of resource locations (or files)
    to consider for loading property files; the default is classpath:,classpath:/config/:file:/,file:./
    |\| spring.config.additional-location | Comma-separated string of additional resource
    locations (or files) to consider for loading property files; the default is empty.
    |


    > When using spring.config.location or spring.config.additional-location with
    a file location, this will be used as is, and a profile-specific one won''t be
    loaded. When using a directory, the profile-specific files will be loaded.


    Using --spring.config.name=your-external would be sufficient to load your-external.properties
    file; however, this will break loading application.properties, so it is better
    to use --spring.config.name=application,your-external. Now all the locations will
    be searched for both application.properties and your-external.properties, and
    also the profile-specific versions will be taken into consideration.


