  md: "# CHAPTER 2 THE BASICS OF SPRING BOOT\n\nLet's create an application that can\
    \ do some basic calculations for integers. First let's write the Calculator. It\
    \ will get a collection of Operation beans in the constructor. Operation is an\
    \ interface, and the different implementations will do the actual calculation.\
    \ See Listing 2-2.\n\n# Listing 2-2. Calculator Class Source\n\n```\npackage com.apress.springboot3recipes.calculator;\n\
    \nimport org.springframework.framework.stereotype.Component;\n\nimport java.util.Collection;\n\
    \n@Component\npublic class Calculator {\n    private final Collection<Operation>\
    \ operations;\n\n    public Calculator(Collection<Operation> operations) {\n \
    \       this.operations = operations;\n    }\n\n    public void calculate(int\
    \ lhs, int rhs, char op) {\n        operations.stream()\n            .filter((operation)\
    \ -> operation.handles(op))\n            .map((operation) -> operation.apply(lhs,\
    \ rhs))\n            .peek((result) -> System.out.printf(\"%d %s = %s%n\", lhs,\
    \ op, result))\n            .findFirst()\n            .orElseThrow(() -> \n  \
    \              new IllegalArgumentException(\"Unknown operation \" + op));\n \
    \   }\n}\n```\n\nIn the calculate method, the right Operation is detected using\
    \ the Operation handles method; when the right one is found, the Operation.apply\
    \ method is called to the actual calculation. If we pass in an operation that\
    \ the calculator cannot handle, a method is thrown."
