  md: "# CHAPTER 5 SPRING SECURITY\n\na principal and grant authorities to an anonymous\
    \ user so that you can handle an anonymous user like a normal user when defining\
    \ security policies.\n\nSpring Security also supports remember-me login, which\
    \ is able to remember a user’s identity across multiple browser sessions so that\
    \ a user doesn’t need to log again after logging in for the first time.\n\n# How\
    \ It Works\n\nSpring Boot enables the default security settings when no explicit\
    \ security configuration can be found. When one or more are found, it will use\
    \ them to configure the security. Security configurations are those with an @EnableWebSecurity\
    \ and/ @EnableMethodSecurity. Including the @EnableWebSecurity annotation automatically\
    \ pulls in the HttpSecurityConfiguration class, which contains the default security\
    \ settings and possibilities to customize them.\n\nTo help you better understand\
    \ the various login mechanisms in isolation, let’s first discuss the default security\
    \ configuration. Note that the login services introduced are registered automatically\
    \ if you include @EnableWebSecurity.\n\nBefore enabling the authentication features,\
    \ you will have to enable the basic Spring Security requirements. You need at\
    \ least to configure exception handling and security context integration. See\
    \ Listing 5-7.\n\n# Listing 5-7. Security Context Integration and Exception Handling\n\
    \n```\n@Configuration\n@EnableWebSecurity\npublic class LibrarySecurityConfig\
    \ {\n\n    @Bean\n    public SecurityFilterChain security(HttpSecurity http) throws\
    \ Exception {\n        http.securityContext(Customizer.withDefaults());\n    \
    \    http.exceptionHandling(Customizer.withDefaults());\n        return http.build();\n\
    \    }\n}\n```\n\n245"
