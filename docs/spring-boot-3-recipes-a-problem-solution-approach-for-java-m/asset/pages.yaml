  md: "# Solution\n\nSpring Boot extends the range of the Spring Testing framework.\
    \ It adds support for mocking and spying (through Mockito) on beans as well as\
    \ provides autoconfiguration for web tests. It also introduces easy ways of slicing\
    \ your application by bootstrapping only what is needed (through the use of @WebMvcTest\
    \ or @JdbcTest, for instance) or to write full-blown integration tests with @SpringBootTest.\n\
    \n# How It Works\n\nSpring Boot extended the auto-configuration to parts of the\
    \ test framework as well. It integrates with Mockito for easy mocking (or spying)\
    \ on beans. It also provides auto-configuration for web-based tests using either\
    \ the Spring MockMvc testing framework or WebDriver-based testing.\n\n# Write\
    \ a Unit Test\n\nFirst let's write a simple unit test for one of the components\
    \ of the calculator, MultiplicationTest, which will test the Multiplication class.\
    \ See Listing 2-13.\n\nListing 2-13. Basic Unit Test\n\n```\npackage com.apress.springboot3recipes.calculator.operation;\n\
    \nimport org.junit.jupiter.api.Test;\n\nimport static org.junit.jupiter.api.Assertions.assertEquals;\n\
    import static org.junit.jupiter.api.Assertions.assertFalse;\nimport static org.junit.jupiter.api.Assertions.assertTrue;\n\
    \npublic class MultiplicationTest {\n\n    private final Multiplication operation\
    \ = new Multiplication();\n\n    @Test\n    public void shouldMatchSign() {\n\
    \        assertTrue(operation.handles('*'));\n        assertFalse(operation.handles('/'));\n\
    \    }\n}\n```"
