- img_proc: true
  md: "# CHAPTER 10 PACKAGING\n\n```\npublic class HelloWorldApplication {\n  public\
    \ static void main(String[] args) {\n    SpringApplication.run(HelloWorldApplication.class,\
    \ args);\n  }\n  static class HelloWorldHints implements RuntimeHintsRegistrar\
    \ {\n    @Override\n    public void registerHints(RuntimeHints hints, ClassLoader\
    \ cl) {\n      hints.resources().registerPattern(\"classpath:*.properties\");\n\
    \    }\n  }\n}\n```\n\nHere we create resource hints for including all .properties\
    \ files in the root of the classpath. This can be needed if files are dynamically\
    \ loaded and Spring or GraalVM isn’t able to detect this. When registering runtime\
    \ hints, we can register hints for jni, proxies, reflection, resources, and/or\
    \ serialization. All of these will contribute entries to one of the available\
    \ hint files.\n\n# Generate Bytecode for Proxy Classes\n\nFinally, Spring AOT\
    \ will generate actual class files containing the bytecode for the proxies created\
    \ at runtime. Proxies are dynamically created classes, and this is something that\
    \ isn’t possible with GraalVM; thus, they are exported at build time. The code\
    \ is generated in the regular target/classes directory and can be noticed by the\
    \ $SpringCGLIB$$<number> suffix. See Figure 10-8."
