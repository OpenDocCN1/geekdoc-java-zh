    The resulting binary can be found in the target directory and is named recipe_10_5_i
    (the name of the artifact). Starting it will show the same output as the Java
    way of running. With one difference, it will start blazingly fast.


    Some of the trade-offs are longer compilation for faster startup times and lower
    memory footprint.


    # Build a Native Image Using Buildpacks


    Another of building a native image is to use a buildpack (see Recipe 10-4). When
    using a buildpack, you wouldn''t need to have GraalVM installed on your local
    system as it would be downloaded as part of the image. You would need the GraalVM
    Maven plugin in your build. See Listing 10-16.


    # Listing 10-16. Maven GraalVM Plugin


    ```

    <groupId>org.graalvm.buildtools</groupId>

    <artifactId>native-maven-plugin</artifactId>

    </plugin>

    ```


    To use a buildpack, running the regular build with the desired Maven profile is
    enough. mvn -Pnative spring-boot:build-image is all that is needed. After the
    process finished, you have a container image with a native executable, which you
    can run using Docker, K8S, or another container technology.'
