  md: "# Use DatabaseClient\n\nWhen Spring Boot detects the presence of spring-r2dbc,\
    \ it will automatically add DatabaseClient as a bean to the application. The most\
    \ basic way to access the database is to use this preconfigured DatabaseClient,\
    \ which comes from spring-r2dbc, which is part of the Spring Framework. With this\
    \ DatabaseClient, you can create an implementation of CustomerRepository (Listing\
    \ 6-73).\n\nListing 6-73. Reactive CustomerRepository Implementation with DatabaseClient\n\
    \n```\npackage com.apress.spring3recipes.r2dbc;\n\nimport io.r2dbc.spi.Readable;\n\
    import org.springframework.r2dbc.core.DatabaseClient;\nimport org.springframework.stereotype.Repository;\n\
    import reactor.core.publisher.Flux;\nimport reactor.core.publisher.Mono;\n\n@Repository\n\
    class R2dbcCustomerRepository implements CustomerRepository {\n\n    private static\
    \ final String ALL_QUERY = \"SELECT id, name, email FROM customer\";\n    private\
    \ static final String BY_ID_QUERY = \"SELECT id, name, email FROM customer WHERE\
    \ id=:id\";\n    private static final String INSERT_QUERY = \"INSERT INTO customer\
    \ (name, email) VALUES (:name, :email)\";\n\n    private final DatabaseClient\
    \ client;\n\n    R2dbcCustomerRepository(DatabaseClient client) {\n        this.client\
    \ = client;\n    }\n\n    @Override\n    public Flux<Customer> findAll() {\n \
    \       return client.sql(ALL_QUERY);\n    }\n```"
