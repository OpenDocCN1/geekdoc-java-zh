  md: "# How It Works\n\nThe Calculator created for Recipe 2-1 is pretty flexible;\
    \ however, the CalculatorApplication has hard-coded values when it comes to the\
    \ calculations it does. Now when we want to calculate something different, we\
    \ would need to modify the code, recompile, and run the newly compiled code. We\
    \ probably want to use properties for this so that we are able to change them\
    \ when needed.\n\nFirst modify the application to use the values instead of hard-coded\
    \ values. For this, change the @Bean method for the ApplicationRunner to accept\
    \ three additional parameters, which are going to be annotated with @Value. See\
    \ Listing 2-8.\n\n**Listing 2-8.** CalculatorApplication Source with Properties\n\
    \n```\npackage com.app.springboot3recipes.calculator;\n\nimport org.springframework.framework.beans.factory.annotation.Value;\n\
    import org.springframework.framework.boot.ApplicationRunner;\nimport org.springframework.framework.boot.SpringApplication;\n\
    import org.springframework.framework.boot.autoconfigure.SpringBootApplication;\n\
    import org.springframework.framework.context.Bean;\n\n@SpringBootApplication\n\
    public class CalculatorApplication {\n    public static void main(String[] args)\
    \ {\n        SpringApplication.run(CalculatorApplication.class, args);\n    }\n\
    \n    @Bean\n    public ApplicationRunner calculationRunner(Calculator calculator,\n\
    \        @Value(\"${lhs}\") int lhs,\n        @Value(\"${rhs}\") int rhs,\n  \
    \      @Value(\"${op}\") char op) {\n            return args -> calculator.calculate(lhs,\
    \ rhs, op);\n        }\n}\n```"
