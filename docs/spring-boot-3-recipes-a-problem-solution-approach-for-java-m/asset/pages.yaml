  md: '# Configure the Management Server


    By default Spring Actuator is available on the same port and address (http://localhost:8080)
    as the regular application. It is, however, common to run the management endpoints
    on a different port. You can configure this properties in the management.server
    namespace. Most of the properties mimic the ones in the regular server namespace
    (see Table 9-1).


    Table 9-1. Management Server Properties


    | Property | Description |

    | --- | --- |

    | management.server.add-application-context-header | Adds an X-Application-Context
    header to the response, containing the application context name |

    | management.server.port | Sets the port to run the management server; the default
    is the same as server.port |

    | management.server.address | Sets the network address to bind to; the default
    is the same as server.address (which is 0.0.0.0 or all addresses) |

    | management.server.basepath | Sets the management endpoint base path; the default
    is /, which requires a port to be set |

    | management.server.ssl.* | Sets the SSL properties to configure SSL for the management
    server |


    Adding Listing 9-3 to the application.properties file, which will run the management
    endpoints on a separate port and add the X-Application-Context header.


    Listing 9-3. Management Server Properties


    ```

    management.server.add-application-context-header=true

    management.server.port=8090

    ```


    When restarting the application, the management endpoints are now available on
    http://localhost:8090/actuator. Running Spring Boot Actuator on a different port
    has the benefit of hiding it from the public Internet by blocking the firewall
    and allowing only local access.'
  merge: -1
