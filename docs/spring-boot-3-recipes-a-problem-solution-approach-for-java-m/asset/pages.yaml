  md: '# CHAPTER 3 SPRING MVC


    With the addition of this dependency, you will get the Thymeleaf library as well
    as the Thymeleaf dialect so that the two integrate nicely. Because of the existence
    of these two libraries, Spring Boot will automatically configure ThymeleafResolver.
    ThymeleafResolver requires a Thymeleaf ITemplateEngine to be able to render the
    views. A special SpringTemplateEngine will be preconfigured with SpringDialect
    that you can use SpEL inside Thymeleaf pages.


    +   To add other Thymeleaf dialects, you only need to create an @Bean method for
    it, and Spring Boot will automatically detect and wire them with Thymeleaf. Some
    of them are even automatically configured like when integrating with Spring Security
    (see Chapter 5).


    To configure Thymeleaf, Spring Boot exposes several properties in the spring.thymeleaf
    namespace (see Table 3-2).


    # Table 3-2. Thymeleaf Properties


    | Property | Description |

    | --- | --- |

    | spring.thymeleaf.cache | Sets whether resolved templates should be cached; the
    default is true. |

    | spring.thymeleaf.check-template | Checks if the template exists before rendering;
    the default is true. |

    | spring.thymeleaf.check-template-location | Checks if the template location exists;
    the default is true. |

    | spring.thymeleaf.enabled | Sets whether Thymeleaf should be enabled; the default
    is true. |

    | spring.thymeleaf.enable-el-compiler | Enables the compilation of SpEL expressions;
    the default is false. |

    | spring.thymeleaf.encoding | Sets the encoding of the templates; the default
    is UTF-8. |

    | spring.thymeleaf.exclude-view-names | Lists the view names (separated by commas)
    that are excluded from resolving. |


