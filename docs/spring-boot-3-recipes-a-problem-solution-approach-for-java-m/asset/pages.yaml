    # 10-5. Use Spring Boot GraalVM Native Images


    GraalVM native images are single-image executables that can run without Java and
    other dependencies. They are generated by compiling the Java application ahead
    of time instead of just in time with the JVM. These native images will most likely
    have a smaller size, with a smaller memory footprint, and are quicker to start.
    The native image is a platform-specific executable; there is no need to include
    a JVM on those environments.


    Native images are very suitable to run in containerized environments, especially
    using functions as a service, like AWS Lambda.


    There are some drawbacks, however, when using native images.


    +   - The classpath is fixed and needs to be fully defined at build time.

    - The beans defined in the application cannot be changed at runtime.

    - @Profile support isn''t available in native images; the profile to run with
    needs to be supplied at build time.'
  merge: -1
  pgno: 468
- img_proc: true
  md: "CHAPTER 10 PACKAGING\n\n+   - @Conditional beans, which rely on the Environment,\
    \ are available only at build time.\n\n+   - Bean definitions that are defined\
    \ as Lambda expressions or method references cannot be used.\n\nAll of the restrictions\
    \ come from the fact that GraalVM operates in a closed world, which means that\
    \ all classes and bytecode that are needed at runtime need to be there at build\
    \ time. Using Spring ahead-of-time (AOT) processing, we can help GraalVM get a\
    \ full and clear view on which classes and bytecode are needed. Spring itself\
    \ already does a great job of providing much information as it can, but we can\
    \ also help the AOT processing a little by providing additional metadata and information.\n\
    \n# Problem\n\nYou want to create a native executable for your Spring Boot application.\n\
    \n# Solution\n\nSpring Boot can leverage the GraalVM plugins for both Maven and\
    \ Gradle to create a native image. For Maven there is a special profile that adds\
    \ additional configuration to generate the proper image. Running mvn -Pnative\
    \ native:compile will run the regular compilation, the AOT processing, and finally\
    \ the GraalVM compiler.\n\n# Build a Native Image Using Native Build Tools\n\n\
    To build the image on your local machine using the Maven (or Gradle) plugins,\
    \ you will need to install GraalVM and include the plugin in your build. See Listing\
