  md: "# Send Multiple Results in a Response\n\nSpring WebFlux will automatically\
    \ stream the results when a content type that requires it is detected. Create\
    \ an OrderController with an orders method that returns a Flux<Order> and sends\
    \ the results one by one to the client.\n\n```\npackage com.apress.spring3recipes.order.rest;\n\
    import com.apress.spring3recipes.order.Order;\nimport com.apress.spring3recipes.order.OrderService;\n\
    import org.springframework.web.bind.annotation.GetMapping;\nimport org.springframework.web.bind.annotation.RestController;\n\
    import reactor.core.publisher.Flux;\n\nimport java.time.Duration;\n\n@RestController\n\
    public class OrderController {\n    private final OrderService orderService;\n\
    \n    public OrderController(OrderService orderService) {\n        this.orderService\
    \ = orderService;\n    }\n\n    @GetMapping(\"/orders\")\n    public Flux<Order>\
    \ orders() {\n        return orderService.findAll().delayElements(Duration.ofMillis(32));\n\
    \    }\n}\n```\n\nThe controller is very simple, because all complexities for\
    \ returning the correct response are handled by the framework.\n\n> There is a\
