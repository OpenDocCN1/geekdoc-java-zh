  md: "# How It Works\n\nSpring Boot by default comes with the error handling enabled\
    \ and will show a default error page. This can be disabled in full by setting\
    \ the server.error.whitelabel enabled property to false. When disabled, the exception\
    \ handling will be handled by the servlet container instead of the general exception\
    \ handling mechanism provided by Spring and Spring Boot.\n\n# Handle Exceptions\
    \ for View Technologies\n\nThere are some other properties that can be used to\
    \ configure the whitelabel error page, mainly for what is going to be included\
    \ in the model so that it, optionally, could be used to display additional information.\
    \ See Table 3-3 for the properties.\n\n**Table 3-3.** Error Handling Properties\n\
    \n| Property | Description |\n| --- | --- |\n| server.error.whitelabel | Sets\
    \ whether the whitelabel error page is enabled; the default is true. |\n| server.error.path\
    \ | Sets the path of the error page; the default is /error. |\n| server.error.include-exception\
    \ | Sets the name of the exception should be included in the model; the default\
    \ is false. |\n| server.error.include-stacktrace | Sets whether the stack trace\
    \ should be included in the model; the default is NEVER. |\n| server.error.include-message\
    \ | Sets whether the message should be included in the model; the default is NEVER.\
    \ |\n| server.error.include-binding-errors | Sets whether the message should be\
    \ included in the model; the default is NEVER. |\n\nLet's add a method to BookController\
    \ that forces an exception.\n\n```\n@GetMapping(\"/books/500\")\npublic void void\
    \ error() {\n    var cause = new NullPointerException(\"Dummy Exception\");\n\
    \    throw new ServerErrorException(cause.getMessage(), cause);\n}\n```"
