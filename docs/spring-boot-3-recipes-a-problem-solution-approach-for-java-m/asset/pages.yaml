  md: '# Test Spring Data JDBC Repositories


    When using Spring Data JDBC, the test setup is slightly different. Instead of
    the @JdbcTest annotation, there is now the @DataJdbcTest annotation, which indicates
    the use of Spring Data JDBC and its test setup. Next, to the setup for the needed
    JDBC Components (like the DataSource), it also enabled scanning for Spring Data
    JDBC-based repositories.


    As with the @JdbcTest, this setup will automatically try to replace the existing
    DataSource with an embedded one. We use Testcontainers to bootstrap our database,
    we need to disable this by adding @ConfigureTestDatabase(replace = AutoConfigureTestDatabase.Replace.NONE).


    The test class still looks a like the regular JDBC-based test, but the difference
    is the annotation (Listing 6-32).


    Listing 6-32. CustomerRepositoryTest for Spring Data JDBC


    ```

    @JdbcTest

    @AutoConfigureTestDatabase(replace = AutoConfigureTestDatabase.

    Replace.NONE)

    @Testcontainers

    class JdbCustomerRepositoryTest {


    @Container

    @ServiceConnection

    static PostgreSQLContainer<?> postgres =

    new PostgreSQLContainer<>("postgres:15-alpine")


    @Autowired

    private CustomerRepository repository;

    initial}

    ```


    It is largely the same as the initial @JdbcTest with Testcontainers, with the
    differences that we now use the @DataJdbcTest annotation, indicating we want to
    use Spring Data JDBC, and that we autowire CustomerRepository instead of the previous
    JdbCustomerRepository. We now only need the interface for testing.'
