  md: "# CHAPTER 4 WEBFLUX\n\nOpenLibraryClient has an @HttpExchange method with the\
    \ url attribute set. This will set a base URI for all other methods in this interface.\
    \ This allows us to specify relative URLs for all other methods. Now there is\
    \ only a single method with an @GetExchange. This method also takes a single argument,\
    \ isbn, which is placed in the URI template before executing. The response is\
    \ turned into a MonoMap again before.\n\nNow that the interfaces are ready, we\
    \ need to expose them in our configuration, but we cannot create an instance from\
    \ an interface. This is where HttpServiceProxyFactory comes into play; it creates\
    \ a proxy at runtime for these interfaces. To do this, we need to add some configuration\
    \ to our application. See Listing 4-45\n\n# Listing 4-45. HttpServiceProxyFactoryConfiguration\n\
    \n```\n@Bean\npublic HttpServiceProxyFactory httpServiceProxyFactory(WebClient\
    \ client) {\n  var adapter = WebClientAdapter.create(client);\n  return HttpServiceProxyFactory.builderFor(adapter).build();\n\
    }\n```\n\n```\n@Bean\npublic BookServiceClient bookServiceClient(HttpServiceProxyFactory\
    \ factory) {\n  return factory.createClient(BookServiceClient.class);\n}\n```\n\
    \n```\n@Bean\npublic OpenLibraryClient openLibraryClient(HttpServiceProxyFactory\
    \ factory) {\n  return factory.createClient(OpenLibraryClient.class);\n}\n```\n\
    \nThe WebClient cannot be used directly, we need to wrap it in a WebClientAdapter,\
    \ which adapts the WebClient to the HttpExchangeAdapter."
