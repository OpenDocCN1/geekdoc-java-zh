  md: "# Solution\n\nSpring Boot provides the configuration and builders to help construct\
    \ the needed classes. This recipe will show how to build an application that can\
    \ be used to consume the API in Recipe 4-2.\n\nYou can use WebClient.Builder to\
    \ create a WebClient. Another option is to use a declarative client using @HttpExchange.\n\
    \n# How It Works\n\nAlthough each approach differs in the classes in use, we are\
    \ still going to need a dependency on the web classes for Spring MVC. For this\
    \ we can add the spring-boot-webflux dependency. See Listing 4-39.\n\n**Listing\
    \ 4-39.** Spring Boot Starter WebFlux Dependency\n\n```\n<dependency>\n  <groupId>org.springframework.boot</groupId>\n\
    \  <artifactId>spring-boot-starter-webflux</artifactId>\n</dependency>\n```\n\n\
    > If you are writing a stand-alone client not in a need of servlet container,\
    \ you might want to add an exclusion for spring-boot-starter-netty.\n\nWe are\
    \ going to use Recipe 4-2 as our server API, and we will write an application\
    \ that looks up that API, calls another API (on https://openlibrary.org) to retrieve\
    \ additional information for the book, and returns an enriched response.\nThe\
    \ EnrichedBook looks like Listing 4-40.\n\n**Listing 4-40.** EnrichedBook Record\n\
    \n```\npackage com.apress.springboot3recipes.library;\n\nimport java.util.List;\n\
    import java.util.Objects;\n```"
