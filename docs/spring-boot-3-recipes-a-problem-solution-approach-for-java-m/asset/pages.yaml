  md: "# Authenticate Users\n\nAuthenticating users in a Spring WebFlux-based application\
    \ is done through a ReactiveAuthenticationManager interface. This is an interface\
    \ with a single authenticate method. You can either provide your own implementation\
    \ or use one of the provided implementations. The first is UserRepositoryReactiveAuthenticationManager,\
    \ which wraps an instance of ReactiveUserDetailsService.\n\n> ReactiveUserDetailsService\
    \ has only a single implementation, MapReactiveUserDetailsService, which is an\
    \ in-memory implementation. You could provide your own implementation based on\
    \ a reactive datastore (like MongoDB or Couchbase).\n\nAs another implementation,\
    \ ReactiveAuthenticationManagerAdapter is actually a wrapper for a regular AuthenticationManager.\
    \ It will wrap a regular instance, and therefore, you can use the blocking implementations\
    \ in a reactive way. This doesn't make them reactive; they still block, but they\
    \ are reusable this way. You can also use JDBC, LDAP, etc., for your reactive\
    \ application.\n\nWhen configuring Spring Security in a Spring WebFlux application,\
    \ you can add an instance of a ReactiveAuthenticationManager to your Java configuration\
    \ class or add a ReactiveUserDetailsService. When the latter is detected, it will\
    \ automatically be wrapped in a UserReactiveAuthenticationManager. See Listing\
    \ 5-38.\n\nListing 5-38. Reactive In-Memory UserDetailsService\n\n```\n@Bean\n\
    public MapReactiveUserDetailsService userDetailsService() {\n    var marten =\
    \ User.withDefaultPasswordEncoder()\n        .username(\"marten\").password(\"\
    secret\").roles(\"USER\").build();\n    var admin = User.withDefaultPasswordEncoder()\n\
    \        .username(\"admin\").password(\"admin\").roles(\"USER\", \"ADMIN\").build();\n\
    \    return new MapReactiveUserDetailsService(marten, admin);\n}\n```"
