    # Spring Boot Docker Compose Support: Custom Container Images


    As Table 2–4 shows, the names of the container matter. But what if you want to
    use a customized container, for instance with a preconfigured and filled PostgreSQL
    database or a preconfigured and secured message broker? With the Spring Docker
    Support, this is still possible, with some additional configuration in the Docker
    Compose file. With Docker Compose, it is possible to specify labels. The Spring
    Boot Docker support will read the org.springframework.boot.service-connection
    label; the value it has will be used as the name of the container. See Listing
    2-32.'
