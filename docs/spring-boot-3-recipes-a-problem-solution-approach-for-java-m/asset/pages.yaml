    # Use a Declarative Client\n\nSpring Framework 6 introduced the declarative HTTP\
    \ client. With this it is possible to write an interface with some annotations.\
    \ At runtime a proxy will be created that will handle the request/response including\
    \ the mapping and exception handling.\n\nThe starting point is an interface with\
    \ an @HttpExchange annotation (or one of the derived annotations like @GetMapping\
    \ and @PostMapping) on either the class or the method(s). It functions much in\
    \ the same way as the @RequestMapping annotation from the server API.\n\nUsing\
    \ the @HttpExchange annotation, it is possible to set some properties (see Table\
    \ 4-9)."
