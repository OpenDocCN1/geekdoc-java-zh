    when including the spring-starter-jdbc dependency (or one of the other database-related
    dependencies). Spring Boot will configure the connection pool with some default
    settings; however, you may want to override this (increase the connections or
    reduce it, set the timeouts, etc.). The configuration options for HikariCP are
    in the spring.datasource.hikari namespace (see Table 6-1).'
