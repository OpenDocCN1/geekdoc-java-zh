  md: "# Solution\n\nSpring Boot will (as with JDBC) detect the presence of R2DBC\
    \ and/or Spring Data\nR2DBC, and the properties in the spring.r2dbc namespace\
    \ will connect to the database.\n\n# How It Works\n\nTo work with R2DBC, the first\
    \ thing you need to do is to add the required dependencies:\nr2dbc, spring-r2dbc,\
    \ and spring-data-r2dbc. However, to make it easier, Spring\nBoot provides spring-boot-starter-r2dbc\
    \ to pull in all those dependencies at once\n(Listing 6-68).\n\nListing 6-68.\
    \ Spring Data R2DBC Starter Dependency\n\n```\n<dependency>\n  <groupId>org.postgresql</groupId>\n\
    \  <artifactId>r2dbc-postgresql</artifactId>\n</dependency>\n```\n\nIt will use\
    \ the properties in the spring.r2dbc namespace to configure the\nconnections to\
    \ the database (see Table 6-6 and Table 6-7). Just like JDBC, the spring.\ndatasource\
    \ namespace is used.\n\nTable 6-6. R2DBC Connection Properties\n\n| Property |\
    \ Description |\n| --- | --- |\n| spring.r2dbc.url | Sets the R2DBC URL of the\
    \ database. |\n| spring.r2dbc.username | Sets the username to use to connect to\
    \ the database. |\n| spring.r2dbc.password | Sets the password to use to connect\
    \ to the database. |\n| spring.r2dbc.name | Sets the name of the database to use\
    \ if not set in the URL; the default is testdb. |\n| spring.r2dbc.generate-unique-name\
    \ | Sets whether to generate a random database name. Ignores any configured name\
    \ when enabled; the default is false. This is useful when writing tests with an\
    \ in-memory database. |\n| spring.r2dbc.properties | Sets additional R2DBC driver\
    \ properties. |"
