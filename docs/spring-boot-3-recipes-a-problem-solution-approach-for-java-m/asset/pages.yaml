  md: "# Test JDBC Code with an Embedded Database\n\nLet's write a test for JdbcCustomerRepository,\
    \ and let's use H2 as the embedded database. First add H2 as a test dependency\
    \ (Listing 6-24).\n\n**Listing 6-24.** H2 Database as a Test Dependency\n\n```\n\
    <dependency>\n  <groupId>com.h2database</groupId>\n  <artifactId>h2</artifactId>\n\
    \  <scope>test</scope>\n</dependency>\n```\n\nNext create JdbcCustomerRepositoryTest\
    \ (Listing 6-25).\n\n**Listing 6-25.** JdbcCustomerRepositoryTest Setup\n\n```\n\
    @JdbcTest\n@TestPropertySource(properties = \"spring.flyway.enabled=false\")\n\
    @Import(JdbcCustomerRepository.class)\nclass JdbcCustomerRepositoryTest {\n\n\
    \  @Autowired\n  private JdbcCustomerRepository repository;\n}\n```\n\nThe @JdbcTest\
    \ annotation executes the test by a special JUnit extension to bootstrap the Spring\
    \ Test Context framework. The @JdbcTest annotation will replace the preconfigured\
    \ DataSource with an embedded one (H2 in this case). As we want to test our repository,\
    \ the @Import(JdbcCustomerRepository.class) annotation is added.\n\nFinally, there\
    \ is the @TestPropertySource(properties = \"spring.flyway.enabled=false\"), which\
    \ indicates that we want to disable Flyway. The application uses Flyway to manage\
    \ the schema; however, those scripts are written for PostgreSQL and not H2. For\
    \ testing we want to disable Flyway and provide an H2-based schema.sql to create\
    \ the schema."
