  md: '# Specify the Configuration


    Normally when you launch a Spring Boot-based application, there are several options
    for providing additional configuration (see Chapter 2).² However, when using the
    archive as a script (or as a service), some of them don''t apply anymore. What
    you can instead make use of a .conf file next to your executable archive (it must
    be named yourapplication.conf) to contain additional configuration options for
    your application. Table 10-1.


    # Table 10-1. Available Properties


    | Property | Description |

    | --- | --- |

    | MODE | Sets the "mode" of operation. The default is auto, which will detect
    the mode. When launched from a symlink, it will behave like service. Change to
    run if you want to run the process in the foreground. |

    | RUN_AS_USER | Sets the user that is used to run the application; the default
    is the owner of the JAR file. |

