  md: "# Listing 4-43. BookServiceClient Sources\n\n```\npackage com.apress.springboot3recipes.library.rest;\n\
    import com.apress.springboot3recipes.library.Book;\nimport org.springframework.web.bind.annotation.PathVariable;\n\
    import org.springframework.web.service.annotation.GetExchange;\nimport reactor.core.publisher.Mono;\n\
    \npublic interface BookServiceClient {\n  @GetExchange(\"http://localhost:8080/books/{isbn}\"\
    )\n  Mono<Book> get(@PathVariable String isbn);\n}\n```\n\nBookServiceClient has\
    \ one method, which is annotated with @GetExchange. There is a provided value\
    \ of http://localhost:8080/books/{isbn}, which is a URI template. The method takes\
    \ a single argument isbn that has been annotated with @PathVariable. When calling\
    \ this method, the value we pass will be placed in the {isbn} part of the URI\
    \ before executing the request. When the request comes in, a response comes in\
    \ is converted to a Mono<Book>, just as we did with the WebClient.\n\nNext we\
    \ an interface for the Open Library API as well. See Listing 4-44.\n\n# Listing\
