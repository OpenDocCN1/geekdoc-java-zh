  md: '# 3-10. Create Response Writers


    # Problem


    You have a service, or multiple calls, and want to send the response in chunks
    to the client.


    # Solution


    Use a ResponseBodyEmitter (or its sibling SseEmitter) to send the response in
    chunks.


    # How It Works


    Here''s how it works.


    # Send Multiple Results in a Response


    Spring MVC has a class named ResponseBodyEmitter that is particularly useful instead
    of a single result you want to return multiple objects to the client. When sending
    an object, it is converted to a result using an HttpMessageConverter. To use ResponseBodyEmitter,
    you have construct and return it from the request handling method.


    +   Create an OrderController with an orders method that returns a ResponseBodyEmitter
    and send the results by one to the client. See Listing 3-45


