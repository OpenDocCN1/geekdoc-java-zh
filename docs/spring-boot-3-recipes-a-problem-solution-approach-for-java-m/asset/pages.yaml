  md: '# Configure JmsTemplate


    Spring Boot provides properties in the spring.jms.template namespace to configure
    JmsTemplate (see Table 8-6).


    Table 8-6. JmsTemplate Properties


    | Property | Description |

    | --- | --- |

    | spring.jms.template.default-destination | Sets the default destination to use
    for send and receive operations when a specific destination isn''t specified.
    |

    | spring.jms.template.delivery-delay | Sets the delivery delay for sending a message.
    |

    | spring.jms.template.delivery-mode | Sets the delivery mode, persistent or non-persistent.
    When explicitly set, it sets qos-enabled to true. |

    | spring.jms.template.priority | Sets the priority of the message when sending.
    The default is none; when explicitly set, it sets qos-enabled to true. |

    | spring.jms.template.qos-enabled | Sets whether quality of service (QOS) should
    be enabled. When enabled, the priority, delivery-mode, and time-to-live of a message
    will be set. The default is false. |

    | spring.jms.template.receive-timeout | Sets the timeout to use for receive calls.
    The default is indefinite. |

    | spring.jms.template.time-to-live | Sets the time-to-live of a JMS message; when
    set, it sets qos-enabled to true. |

    | spring.jms.template.pub-sub-domain | Sets the default destination to a topic
    or queue. The default is false, meaning queue. |


    In addition to these properties, JmsTemplate will also be auto-configured with
    a DestinationResolver and MessageConverter if a unique instance of the beans can
    be found. If no unique instance can be found, the defaults will be used, DynamicDestinationResolver
    and SimpleMessageConverter (see Table 8-7).'
