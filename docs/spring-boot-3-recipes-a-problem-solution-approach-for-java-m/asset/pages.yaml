- img_proc: true
  md: "# CHAPTER 9 SPRING BOOT ACTUATOR\n\n@Override\nprotected void doHealthCheck(Health.Builder\
    \ builder) throws Exception {\n\n```\nint poolSize = taskScheduler.getPoolSize();\n\
    int active = taskScheduler.getActiveCount();\nint free = poolSize - active;\n\
    ```\n\n```\nbuilder\n    .withDetail(\"active\", active)\n    .withDetail(\"poolsize\"\
    , poolSize);\n```\n\n```\nif (poolSize > 0 && free <= 1) {\n    builder.down();\n\
    } else {\n    builder.up();\n}\n\n```\n\nThe TaskSchedulerHealthIndicator operates\
    \ on the given ThreadPoolTaskExecutor. It reports the status as if there are 1\
    \ or fewer threads available to schedule tasks. The condition on poolSize > 0\
    \ is there because the creation of the underlying Executor is delayed until needed;\
    \ until then, the poolSize will report 0. The returned value includes the poolsize\
    \ and active thread count.\n\nThe TaskSchedulerMetrics implementation extends\
    \ the MeterBinder interface from Micrometer.io. It exposes the active and pool-size\
    \ values to the metrics registry. See Listing 9-8.\n\n# Listing 9-8. MeterBinder\
    \ Implementation to Expose Metrics\n\n```\npackage com.appressspringboot3recipes.library;\n\
    \nimport io.micrometer.core.instrument.FunctionCounter;\nimport io.micrometer.core.instrument.MeterRegistry;\n\
    import io.micrometer.core.instrument.binder.MeterBinder;\nimport org.springframework.scheduling.concurrent.ThreadPoolTaskScheduler;\n\
    import org.springframework.stereotype.Component;\n```"
