    # Send Multiple Results as Events


    ResponseBodyEmitter is a sibling of the SseEmitter that can deliver events from
    the server to the client. For this Server-Sent-Events are messages from the server
    to the client. They have a Content-Type header of text/event-stream. They are
    lightweight with only four fields (see Table 3-13).


    Table 3-13. Allowed Fields for Server-Sent-Events


    | Field | Description |

    |---|---|n| Id | The ID of the event |

    | Event | The type of event |

    | Data | The event data |

    | Retry | Reconnection time for the event stream |


