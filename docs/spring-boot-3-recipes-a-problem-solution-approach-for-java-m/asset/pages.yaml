  md: "CHAPTER 2 THE BASICS OF SPRING BOOT\n\n# # Perform Integration Testing with\
    \ Spring Boot\n\nSpring Boot provides several annotations to aid in testing. The\
    \ first is @SpringBootTest, which will make the test a Spring Boot-driven test,\
    \ which means that the test context framework will be searching for the class\
