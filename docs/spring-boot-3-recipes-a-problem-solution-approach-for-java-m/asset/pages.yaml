    # 5-4. Make Access Control Decisions


    # Problem


    In the authentication process, an application will grant a successfully authenticated
    user a set of authorities. When this user attempts to access a resource in the
    application, the application has to decide whether the resource is accessible
    with the granted authorities or other characteristics.


    # Solution


    The decision about whether a user is allowed to access a resource in an application
    is called an *access control decision*. It is based on the user''s authentication
    status and the resource''s nature and access attributes.


    # How It Works


    With Spring Security, it is possible to use Spring Expression Language (SpEL)
    to create powerful access control rules. Spring Security supports a couple of
    expressions out of the box (see Table 5-8 for a list). Using constructs such as
    and, or not, you can create powerful and flexible expressions.


