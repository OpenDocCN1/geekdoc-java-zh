- img_proc: true
  md: '# Table 4-9. HttpExchange Properties


    | Attribute | Description |

    |---|---|

    | value or url | The URL for the request; can be a full URL, a path relative to
    the type level @HttpExchange, or the preset base URI. |

    | Method | The HTTP method to use; DELETE, GET, PATCH, POST, or PUT. The default
    is empty. |

    | contentType | The media type to send for the Content-Type header; the default
    is empty. The media type for the Accept header. |


    In addition to the @HttpExchange annotation, there are @DeleteExchange, @GetExchange,
    @PatchExchange, @PostExchange, and @PutExchange annotations. These can be used
    instead of @HttpExchange with a specific method value. Using these annotations
    makes it more explicit.


    Just like request handling methods with @RequestMapping, the declarative client
    supports multiple arguments, annotations, and return types. It reuses common parts
    of the web infrastructure for this. See Table 4-10.'
