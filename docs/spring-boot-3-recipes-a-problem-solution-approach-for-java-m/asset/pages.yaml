  md: '# CHAPTER 4 WEBFLUX


    For view-related implementations, it is easy to add pages that will automatically
    be picked up. Add error.html as a customized error page, or add specific error
    pages for specific HTTP error codes, i.e., 404.html and 500.html.


    Spring Boot also has exception handling for REST-based controllers. It will return
    a response containing the error information, much like the error information that
    is available with regular WebFlux handling. Another option is to enable Problem
    Detail support (RFC-7807), which is a small standard for defining error responses.
    To enable it, set the spring.webflux.problemdetails.enabled property to true.


    # How It Works


    We''ll now explain how it works.


    # Handle Exceptions Handle Exceptions for REST Controllers


    Write a custom ErrorAttributes property to replace the default (Figure 4-4) and
    to fill the model that is being written as a response.


    ![](img/89a0bcab7458b6da76f2e201f270589c_206_0.png)


    **Figure 4-4.** Default error response


    By default Spring Boot will include the attributes shown in Table 4-2 in the model
    for the error response.


