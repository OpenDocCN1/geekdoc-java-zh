  md: '# Table 8-18. Kafka Listener Properties


    | Property | Description |

    | --- | --- |

    | spring.kafka.listener.type | Sets the listener container type SINGLE or BATCH;
    the default is SINGLE. |

    | spring.kafka.listener.ack-mode | Sets the container acknowledge mode; the default
    is none. |

    | spring.kafka.listener.async-acks | Sets whether we acknowledge async; the default
    is none. This is useful only with ack-mode set to MANUAL or MANUAL - IMMEDIATE.
    |

    | spring.kafka.listener.client-id | Sets the prefix for the client-id property.
    |

    | spring.kafka.listener.concurrency | Sets the minimum number of listener invoker
    threads. |

    | spring.kafka.listener.poll-timeout | Sets the timeout to use when polling the
    consumer. |

    | spring.kafka.listener.no-poll-threshold | Sets the multiplier to apply to the
    poll-timeout to determine whether a consumer is nonresponsive. |

    | spring.kafka.listener.ack-count | Sets the number of records between offset
    commits for ack-mode COUNT or COUNT_TIME. |

    | spring.kafka.listener.ack-time | Sets the time between offset commits for ack-mode
    TIME or COUNT_TIME. |

    | spring.kafka.listener.idle-between-polls | Sets the interval between consumer
    polls. |

    | spring.kafka.listener.idle-event-interval | Sets the time between publishing
    idle consumer events. |

    | spring.kafka.listener.idle-partition-event-interval | Sets the time between
    publishing idle partition consumer events.'
