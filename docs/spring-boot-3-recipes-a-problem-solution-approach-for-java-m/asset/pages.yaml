  md: "# Table 4-7. Allowed Fields for Server-Sent-Events\n\n| Field | Description\
    \ |\n|---|---|\n| id | The ID of the event |\n| event | The type of event |\n\
    | data | The event data |\n| retry | Reconnection time for the event stream |\n\
    \nBy default only the data element is included in the response.\nTo send events\
    \ from a request handling method, you use the ServerSentEvent that provided a\
    \ builder method to actually create the ServerSentEvent instance. We can send\
    \ the ServerSentEvent to the client, you need to convert your object to this.\
    \ We can extend the OrderController, which was created initially, with a dedicated\
