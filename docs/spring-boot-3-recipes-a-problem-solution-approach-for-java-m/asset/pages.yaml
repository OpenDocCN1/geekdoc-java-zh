  md: '# CHAPTER 3  SPRING MVC


    # Use a Declarative Client


    Spring Framework 6 introduced the declarative HTTP client. With this it is possible
    to write an interface with some annotations. At runtime a proxy would be created
    that would handle the request/response including the mapping and exception handling.


    The starting point is an interface with @PutMappingExchange annotation (one of
    the derived annotations like @GetExchange or @PostExchange) or either of the class
    and methods. It functions in the same way as @RequestMapping from the server API.
    Using @HttpExchange, it is possible to set some properties (see Table 3-16).


    **Table 3-16.** HttpExchange Properties


    | Attribute | Description |

    | --- | --- |

    | value or url | Sets the URL for the request; can be a full URL, a path relative
    to the type-level @PutMappingExchange; or the preset base URI. |

    | method | The HTTP method to use; DELETE, GET, PATCH, POST, PUT. The default
    is empty. |

    | contentType | The media type to send for the Content-Type header; the default
    is empty. |

    | accept | The media type for the Accept header. |


    In addition to the @PutMappingExchange annotation, there are also @DeleteExchange,
    @GetExchange, @PutMappingExchange, @PostExchange, and @PutExchange. These can
    be used instead of @PutMappingExchange with a specific method value. Using those
    annotations makes it more explicit.


    Just like request handling methods with @RequestMapping, the declarative client
    supports multiple arguments, annotations, and return types. It reuses common parts
    of the web infrastructure for this. See Table 3-17.'
  merge: -1
  pgno: 171
- img_proc: true
  md: '# Table 3-17. HttpExchange Supported Method Arguments


    | Type | Description |

    | --- | --- |

    | java.net.URI | Dynamically sets the URL for the request; overrides the url attribute
    from @HttpExchange. |

    | UriBuilder Factory | Provides a UriBuilderFactory to expand the URI template
    and URI variables. Used instead of the UriBuilderFactory of the underlying client.
    |

    | HttpMethod | Dynamically sets the HTTP method to use for the request; overrides
    the method attribute from @HttpExchange. |

    | MultipartFile | Adds a request part from a MultipartFile; typically used with
    Spring MVC to indicate an uploaded file. |

    | @Cookie | Adds cookie(s) to the outgoing request. The argument can be a Map<String,
    ?> or a MultiValueMap<String, ?> with multiple cookies or individual values. Uses
    the type conversion for non-String values. |

    | @RequestHeader | Adds request headers to the outgoing request. Argument can
    be a Map<String, ?> or a MultiValueMap<String, ?> with multiple headers or individual
    values. Uses the type conversion for non-String values. |

    | @PathVariable | Adds a variable to expand a placeholder in the request URL.
    The argument may be a Map<String, ?> for multiple values or an individual value.
    Uses the type conversion for non-String values. |

    | @RequestBody | Provides the body of the request either as an Object to be serialized
    or as a Reactive Streams Publisher such as Mono, Flux, or any other async type
    supported through the configured ReactiveRegistry. |

    | @RequestParam | Adds request parameters. Can be a Map<String, ?> /? MultiValueMap<String,
    ?> for multiple values. Or be an individual type. Uses the type conversion for
    non-String values. When ContentType is application/x-www-form-urlencoded, the
    parameters are added to the request body. |

    | @RequestPart | Adds a request part that can be a String (becomes a form field),
    a Resource, an Object to be encoded as JSON (or whatever is configured), an HttpEntity
    including headers , a Spring Part, or a supported Reactive Streams Publisher.
    |'
