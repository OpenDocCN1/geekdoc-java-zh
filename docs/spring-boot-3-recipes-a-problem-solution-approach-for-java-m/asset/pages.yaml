  md: '# 10-4. Containerize a Spring Boot Application


    Using Docker to build and ship containers is a common practice nowadays. When
    using Spring Boot, it is quite easy to wrap that into a Docker container.


    # Problem


    You want to run your Spring Boot-based application inside a Docker container.


    # Solution


    Create a Dockerfile and use one of the Docker plugins available to Maven to build
    the Docker container.


    > In this recipe we choose to use docker-maven-plugin from Fabric8, but there
    are others that work equally well.


    # How It Works


    First you will need a Dockerfile containing the information needed to build the
    container. When the container has been built, you can launch it using the docker
    run command.


    # Update a Build Script to Produce a Docker Container


    To create a Docker container, first create a Dockerfile. The Dockerfile is the
    file containing the information on how to build the container. Place this file
    in the root of the project. See Listing 10-9.


    # Listing 10-9. Dockerfile


    ```

    FROM eclipse-temurin:21-jre-alpine

    ARG JAR_FILE

    COPY ${JAR_FILE} app.jar

    ENTRYPOINT ["java","-Djava.security.egd=file:/dev/./urandom","-jar","/app.jar"]

    ```'
  merge: -1
  pgno: 461
- img_proc: true
  md: "# CHAPTER 10 PACKAGING\n\nWith this Dockerfile we use the Eclipse Temurin-provided\
    \ container to build our own. We are going to add our application to it using\
    \ the ADD command, and finally we need to tell the container what to start during\
    \ startup. For this you can use the ENTRYPOINT command.\n\nUsing publicly available\
    \ containers as a starting point might seem like a good idea, but you have to\
    \ be aware of the possible security implications this can have. As you don't control\
    \ specific container, you cannot guarantee what is built into (or not into) the\
    \ container. For real-life situations, you might want to build your own base containers.\n\
    \nThe ARG in the JAR_FILE argument is telling the build that there is a variable\
    \ JAR_FILE available that can be used in the build script. We will provide the\
    \ value of that variable through the plugin configuration.\n\nThe ENTRYPOINT simply\
    \ specifies that it will run java -jar /app.jar; you could also combine with this\
    \ Recipe 14-1 and install an executable JAR as a script, making the entrypoint\
    \ a little smaller.\n\nNow that there is a Dockerfile, you need to add docker-maven-plugin\
    \ to build your section of the pom.xml file. See Listing 10-10.\n\n# Listing 10-10.\
    \ Docker Maven Plugin\n\n```\n<plugin>\n  <groupId>io.fabric8</groupId>\n  <artifactId>docker-maven-plugin</artifactId>\n\
    \  <version>0.43.4</version>\n  <configuration>\n    <buildArgs>\n      <JAR_FILE>target/${project.build.finalName}.jar</JAR_FILE>\n\
    \    </buildArgs>\n  </configuration>\n</plugin>\n```\n\n480"
