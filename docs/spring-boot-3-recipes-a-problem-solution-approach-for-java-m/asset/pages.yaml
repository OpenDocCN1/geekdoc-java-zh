  md: 'RestClient.Builder provides some methods to enhance the configuration. Each
    method will result in a new RestClient.Builder instance. Here we configure the
    Project HttpClient to automatically follow redirects (HTTP status 301/302) as
    this is disabled by default. The API we are using (from Open Library) uses a redirect
    to point to the right results. See Table 4-8 and Listing 4-42.


    # Table 4-8. WebClient.Builder Configuration Methods


    | Method | Description |

    | --- | --- |

    | baseUrl | Sets the root URL to be used with requests; the default is null |

    | clientConnector | Configures the HttpClientConnector to be used. Useful for
    using a preconfigured one in case of (for instance) SSL |

    | defaultCookie | Adds a cookie(s) with a default value |

    | defaultHeader | Adds a header(s) with a default value |

    | defaultHeaders | |

    | defaultRequest | Consumer to customize every request that is being built |

    | defaultStatusCode | Registers a default status handler to be applied to each
    response |

    | defaultUriVariables | Default values for URI variables |

    | messageConverters | Replaces the HttpMessage that should be used with the created
    RestTemplate |

    | exchangeFunction | Registers a default ExchangeFunction with a preconfigured
    HttpClient and ExchangeStrategies |

    | exchangeStrategies | Configures the ExchangeStrategies to use |

    | filter | Adds the given filter to the filter chain |

    | observationConvention | Configures the ObservationConvention to collect metadata
    for the request observation/metrics. The default will be set to DefaultClientRequestObservationConvention
    |

    | observationRegistry | Configures the ObservationRegistry to use for recording
    HTTP Client observations. Generally automatically set by Spring Boot |

    | uriBuilderFactory | Sets the UriBuilderFactory to use |'
