  md: "# 6-6. Access Data with JPA\n\n# Problem\n\nYou want to use JPA in your Spring\
    \ Boot application.\n\n# Solution\n\nSpring Boot automatically detects the presence\
    \ of Hibernate, and the needed JPA classes will use that information to configure\
    \ the EntityManagerFactory instance.\n\n# How It Works\n\nSpring Boot has out-of-the-box\
    \ support for JPA through Hibernate. When Hibernate is detected, an EntityManagerFactory\
    \ instance will be automatically configured using the earlier configured DataSource.\n\
    \nYou need to add hibernate-core and spring-orm dependencies to your project.\
    \ However, it is easier to add the spring-boot-starter-data-jpa dependency to\
    \ your project (Listing 6-33), although this will also pull in spring-data-jpa\
    \ as a dependency.\n\n**Listing 6-33.** JPA Dependencies for Spring Boot\n\n```\n\
    <dependency>\n  <groupId>org.springframework</groupId>\n  <artifactId>spring-boot-starter-data-jpa</artifactId>\n\
    </dependency>\n```\n\nThis will add all the necessary dependencies to the classpath.\n\
    \n# Use Plain JPA Repositories\n\nFor JPA to work, you have annotate the classes\
    \ representing entities in your system. In your system, we are going to store\
    \ and retrieve Customer from the database. We need to mark this as an entity using\
    \ the @Entity annotation. In addition, we need to identify the ID (primary key)\
    \ of the entity (here we use @Id on the id field). A JPA entity class is required\
    \ to have a default no-args constructor (although it can be package private)."
