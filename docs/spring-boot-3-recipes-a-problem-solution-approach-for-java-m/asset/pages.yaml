    \ application again, you will notice that the type of the ConnectionFactory has\
    \ changed to PoledConnectionFactory.\n\n# Use JNDI\n\nWhen deploying a Spring\
    \ Boot application to a JEE container, there is a big change that you want to\
    \ use a prereistered ConnectionFactory from that container as well. To enable\
    \ this, you will need a dependency on the spring-jms library and the jakarta.jms-api\
    \ (the latter can then probably be marked that it will be supplied by your JEE\
    \ container). You could use one of the starters and exclude the explicit ActiveMQ\
    \ or Artemis dependencies; however, declaring only the needed dependencies is\
    \ easier and clearer. See Listing 8-5.\n\n# Listing 8-5. Bare JMS Dependencies\n\
    \n```\n<dependency>\n  <groupId>org.springframework.framework</groupId>\n  <artifactId>spring-jms</artifactId>\n\
    </dependency>\n<dependency>\n  <groupId>jakarta.jms</groupId>\n  <artifactId>jakarta.jms-api</artifactId>\n\
    </dependency>\n```\n\nWhen JNDI is available, Spring Boot will first try to detect\
    \ ConnectionFactory in the JNDI register under one of the well-known names such\
    \ as java:/JmsXA and java:/XAFactory or by the name specified in the spring.jms-name\
    \ property. Furthermore, it will also automatically create a JndiDestinationResolver\
    \ so that the queues and topics will also be detected in JNDI; by default a fallback\
    \ to dynamic creation of destinations is allowed.\n\nspring.jms.jndi-name=java:/jms/connectionFactory"
