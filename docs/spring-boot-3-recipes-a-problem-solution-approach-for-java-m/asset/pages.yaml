  md: "# Solution\n\nHealth checks and metrics are pluggable, and beans of type HealthIndicator\
    \ and MetricBinder are automatically registered to provide additional health checks\
    \ and metrics. You just need to create a class implementing the desired interface\
    \ and register an instance of class as a bean in the context to have it contribute\
    \ to the health and metrics.\n\n# How It Works\n\nAssuming that a dependency on\
    \ Spring Boot Actuator is already present, you can start writing implementation\
    \ right away. Assume you have an application using a TaskScheduler and you want\
    \ to have some metrics and health checks on it. (Adding @EnableScheduling is enough\
    \ to have Spring Boot create a default TaskScheduler.)\n\nFirst let's write the\
    \ HealthIndicator interface. You can either directly implement the HealthIndicator\
    \ interface (and implement the health() method) or use the convenience AbstractHealthIndicator\
    \ method as a base class (which adds some logic and exception handling out of\
    \ the box). We can use Recipe 3-3 as the starting point for this recipe. See Listing\
    \ 9-7.\n\n+   **Listing 9-7.** HealthIndicator Implementation\n\n```\npackage\
    \ com.ap.springbootrecipes.library;\n\nimport org.springframework.boot.actuate.health.AbstractHealthIndicator;\n\
    import org.springframework.boot.actuate.health.Health;\nimport org.springframework.scheduling.concurrent.ThreadPoolTaskScheduler;\n\
    import org.springframework.stereotype.Component;\n\n@Component\nclass TaskSchedulerHealthIndicator\
    \ extends AbstractHealthIndicator {\n\n    private final ThreadPoolTaskScheduler\
    \ taskScheduler;\n\n    TaskSchedulerHealthIndicator(ThreadPoolTaskScheduler taskScheduler)\
    \ {\n        this.taskScheduler = taskScheduler;\n    }\n}\n```"
  merge: -1
