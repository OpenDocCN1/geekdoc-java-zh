    # ## 2-1. Configure a Bean


    # ### Problem


    You want Spring Boot to use your class as a bean.


    # ### Solution


    Depending on your needs, either you can leverage @ComponentScan to automatically
    detect your class and create an instance, using it with @Autowired and @Value
    to inject dependencies or properties, or you can use a method annotated with @Bean
    in an @Configuration class to maintain control over the bean being created.


    # ### How It Works


    Recipe 1-1 explained that @SpringBootApplication includes both @ComponentScan
    and @Configuration. This means that any @Component annotated class will be automatically
    detected and instantiated by Spring Boot; it also allows for @Bean methods to
    be defined to declare beans.'
