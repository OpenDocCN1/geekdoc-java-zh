  md: "Next we need an interface for the Open Library API as well. See Listing 3-57.\n\
    \n# **Listing 3-57.** OpenLibrary Sources\n\n```\n```java\\package com.apress.springboot3recipes.library.rest;\n\
    ```\n\n```\nimport org.springframework.web.bind.annotation.PathVariable;\nimport\
    \ org.springframework.web.service.annotation.GetExchange;\nimport org.springframework.web.service.annotation.HttpExchange;\n\
    ```\n\n```\nimport java.util.Map;\n\n@HttpExchange(url = \"https://openlibrary.org/isbn\"\
    )\npublic interface OpenLibraryClient {\n\n    @GetExchange(\"/isbn}.json\")n\
    \    Map getInformation(@PathVariable String isbn);\n}\n```\n\nOpenLibraryClient\
    \ has an @HttpExchange method with the url attribute set. This will set a base\
    \ URI for all other methods in this interface. This allows us to specify only\
    \ relative URLs for all other methods. Now there is only a single method with\
    \ @GetExchange. This method also takes a single argument, isbn, which is placed\
    \ in the URI template as well before executing. The response is turned into a\
    \ Map just as before.\n\nNow the interfaces are ready, we need to expose them\
    \ in our configuration, but we cannot create an instance from an interface. This\
    \ is where HttpServiceProxyFactory comes into play; it creates a proxy at runtime\
    \ for these interfaces. To do this, we need to add some configuration to our application.\
    \ See Listing 3-58.\n\n# **Listing 3-58.** HttpServiceProxyFactory Configuration\n\
    \n```\n```java\\@Bean\npublic HttpServiceProxyFactory httpServiceProxyFactory(RestClient.Builder\
    \ builder) {\n    var adapter = RestClientAdapter.create(builder.build());\n \
    \   return HttpServiceProxyFactory.builderFor(adapter).build();\n}```\n```"
