  md: '# CHAPTER 6 DATA ACCESS


    # Table 6-7. R2DBC Connection Pool Properties


    | Property | Description |

    |---|---|

    | spring.r2dbc.pool.enabled | Sets whether the R2DBC connection pooling is enabled;
    the default is true. |

    | spring.r2dbc.pool.initial-size | Sets the initial number of connections to create;
    the default is infinite. |

    | spring.r2dbc.pool.max-acquire-time | Sets the maximum time to wait to obtain
    a connection from the pool; the default is infinite. |

    | spring.r2dbc.pool.max-connection-time | Sets the maximum time to wait to create
    a new connection; the default is infinite. |

    | spring.r2dbc.pool.max-idle-time | Sets the maximum time for a connection to
    sit idle in the pool; the default is 30 minutes. |

    | spring.r2dbc.pool.max-life-time | Sets the maximum time for a connection to
    live; the default is infinite. |

    | spring.r2dbc.pool.max-size | Sets the maximum number of connections to be created;
    the default is 10. |

    | spring.r2dbc.pool.validation-depth | Sets the depth of the validation, LOCAL
    or REMOTE; the default is LOCAL. |


    To connect to the database, we need at least spring.r2dbc.url to be set; this
    can include all the information needed as the database name, username, and password.
    But often spring.r2dbc.username and spring.r2dbc.password are passed separately.
    To connect to the database created earlier (see Recipe 6-2), we need the properties
    in Listing 6-69.


