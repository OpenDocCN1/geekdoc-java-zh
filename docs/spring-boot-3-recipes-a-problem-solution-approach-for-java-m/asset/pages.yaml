  md: "# Listing 8-32. JSON MessageConverter Configuration\n\n```\n@Bean\npublic Jackson2JsonMessageConverter\
    \ jsonMessageConverter() {\n    return new Jackson2JsonMessageConverter();\n}\n\
    ```\n\nTo configure the MessageConverter, create an @Bean annotated method and\
    \ construct the converter you want to use; here the converter is a Jackson 2-based\
    \ one, but there is also one for unmarshalling XML: MarshallingMessageConverter.\
    \ See Listing 8-33.\n\n# Listing 8-33. Rabbit Listener for Orders\n\n```\n@Component\n\
    class OrderService {\n    @RabbitListener(bindings = =\n        @QueueBinding(exchange\
    \ = @Exchange(name=\"orders\", type = ExchangeTypes.TOPIC,\n            value\
    \ = @Queue(name = \"incoming-orders\",\n            key = \"new-order\"))))\n\
    \    public void handle(Order order) {\n        System.out.println(\"[RECEIVED]\
    \ - \" + order);\n    }\n}\n```\n\nThe previous listener will use the orders exchange\
    \ (which is a fanout exchange) and create a binding for the incoming-orders using\
    \ the new-order routing key. When started, the exchange and queue will automatically\
    \ be created if they don't already exist. The incoming message is converted into\
    \ an Order Jackson2JsonMessageConverter. The output should be similar to Figure\
