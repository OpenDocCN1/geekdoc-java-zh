  md: "# CHAPTER 6 DATA ACCESS\n\n```\nR2dbcCustomer(R2dbcTemplate template) {\n \
    \   this.template = template;\n}\n```\n\n```\n@Override\npublic Flux<Customer>\
    \ findAll() {\n    return template.select(Customer.class).all();\n}\n```\n\n```\n\
    @Override\npublic Mono<Customer> findById(long id) {\n    return template\n  \
    \  .selectOne(Query.query(where(\"id\").is(id)), Customer.class);\n}\n```\n\n\
    ```\n@Override\npublic Mono<Customer> save(Customer customer) {\n    return template.insert(customer);\n\
    }\n```\n\nR2dbcUserRepository using the R2dbcTemplate is a bit simpler than the\
    \ one using a DatabaseClient instance. The mapping from the database to Customer\
    \ is done automatically, as well as the binding for the insert. The findById method\
    \ has some complexity still as we need to specify the where clause for the query.\
    \ To make it easier to write queries, Spring Data R2DBC contains a query builder.\
    \ Here we specify a limitation on the id column.\n\nMapping from/to database columns\
    \ is done based on metadata on the Customer class. This is optional. The default\
    \ is it will use the name of the class Customer, with a lowercase first letter\
    \ as the name of the table customer. If a different table is to be used, this\
    \ can be supplied through the @Table annotation. For column names to field names,\
    \ something similar happens: it will use the name of the field as for the column;\
    \ if something else is needed, this can be specified through an @Column annotation.\
    \ A database record also needs a primary key (in general). If the class has a\
    \ field named id, this will be automatically used as the primary key. If another\
    \ field is to be used or you want to make it explicit, you can annotate field\
    \ (or fields) with @Id (see Listing 6-75)."
