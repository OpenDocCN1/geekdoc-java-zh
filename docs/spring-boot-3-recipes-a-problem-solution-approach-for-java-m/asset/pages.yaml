  md: "# Test JPA Code with Testcontainers\n\nThere could be more assertions, but\
    \ saving the data is already verified in the other test method.\n\nA better option\
    \ nowadays is to use Testcontainers. Testcontainers uses Docker to bootstrap a\
    \ Docker container for your given technology. In this case, we could use a PostgreSQL\
    \ Docker image to boot a real database and use that in our tests. With this we\
    \ are now using your actual database for testing and don’t need to do with an\
    \ in-memory version, meaning you can execute all the queries you want and test\
    \ them. It also gives you the opportunity to test your database migration scripts\
    \ (when in use).\n\nTo use Testcontainers, in this case for PostgreSQL, we need\
    \ to add the appropriate dependencies (see Listing 6–44).\n\n**Listing 6-44.**\
    \ Testcontainers Dependency for PostgreSQL and JUnit Jupiter\n\n```\n<dependency>\n\
    \  <groupId>org.springframework.boot</groupId>\n  <artifactId>spring-boot-testcontainers</artifactId>\n\
    </dependency>\n<dependency>\n  <groupId>org.testcontainers</groupId>\n  <artifactId>postgresql</artifactId>\n\
    \  <scope>test</scope>\n</dependency>\n<dependency>\n  <groupId>org.testcontainers</groupId>\n\
    \  <artifactId>junit-jupiter</artifactId>\n  <scope>test</scope>\n</dependency>\n\
    ```\n\nNow write a test that tests if records get inserted correctly into our\
    \ actual PostgreSQL database (see Listing 6–45)."
