    # 3-6. Change User Locales


    # Problem


    For your web application to support internationalization, you have to identify
    each user''s preferred locale and display contents according to this locale.


    # Solution


    In a Spring MVC application, a user''s locale is identified by component, which
    has to implement the LocaleResolver interface. Spring MVC comes with several LocaleResolver
    implementations for you to resolve locales by different criteria. Alternatively,
    you may create your own custom locale resolver by implementing this interface.


    You can define a locale resolver by registering a bean of type LocaleResolver
    in the web application context context. You must set the bean name of the locale
    resolver to localeResolver so it can be autodetected.'
  merge: -1
  pgno: 127
- img_proc: true
  md: "# How It Works\n\nSpring MVC ships with several default implementations of\
    \ the LocaleResolver interface, some of which allow the Locale to be changed.\
    \ To change the Locale, one can use a specific HandlerInterceptor to allow users\
    \ to override the locale they want to use, the LocaleChangeInterceptor.\n\n# Resolve\
    \ Locales with an HTTP Request Header\n\nThe default locale resolver registered\
    \ by Spring Boot is the AcceptHeaderLocaleResolver. It resolves locales by inspecting\
    \ the Accept-Language header of an HTTP request. This header is set by a user's\
    \ browser according to the locale setting of the underlying operating system.\
    \ See Listing 3-28.\n\n> The AcceptHeaderLocaleResolver cannot change a user's\
    \ locale because it is unable to modify the locale setting of the user's operating\
    \ system.\n\nListing 3-28. AcceptHeaderLocaleResolver Bean Definition\n\n```\n\
    @Bean\npublic LocaleResolver localeResolver () {\n    return new AcceptHeaderLocaleResolver();\n\
    }\n```\n\n# Resolve Locales with a Session Attribute\n\nAnother option of resolving\
    \ locales is by SessionLocaleResolver. It resolves locales by inspecting a predefined\
    \ attribute in a user's session. If the session attribute doesn't exist, this\
    \ locale resolver determines the default locale from the Accept-Language HTTP\
    \ header. See Listing 3-29."
