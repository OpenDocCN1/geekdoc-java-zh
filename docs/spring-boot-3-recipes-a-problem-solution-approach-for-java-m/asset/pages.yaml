    # 4-5. Implement Internationalization (I18N) Problem


    When developing an internationalized web application, you have to display your
    web

    pages in a user''s preferred locale. You don''t want to create different versions
    of the same

    page for different locales.


    # Solution


    To avoid creating different versions of a page for different locales, you should
    make your

    web page independent of the locale by externalizing locale-sensitive text messages.

    Spring is able to resolve text messages for you by using a message source, which
    has to

    implement the MessageSource interface. In your page templates, you can then either
    use

    special tags or do lookups for the messages.


    # How It Works


    Spring Boot automatically configures a MessageSource when it finds a messages
    .

    properties in src/main/resources (the default location). This messages.properties

    contains the default messages to be used in your application. Spring Boot will
    use the

    Accept-Language header from the request to determine which locale to use for the

    current request (see Recipe 4-6 for how to change that).


    +   Some properties change the way MessageSource reacts to missing translations,

    caching, etc. See Table 4-3 for an overview of the properties.'
