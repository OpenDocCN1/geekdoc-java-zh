  md: "# Test MongoDB Code with Testcontainers\n\nAnother option is to use Testcontainers.\
    \ Testcontainers uses Docker to bootstrap a Docker container for your technology.\
    \ In this case, we could use a Docker image to boot a real MongoDB instance and\
    \ that in our tests. This also you the opportunity to test your database migration\
    \ scripts (when in use). This is also useful when you are combining different\
    \ technologies such as SQL and MongoDB because you can use Testcontainers to bootstrap\
    \ both.\n\nTo use Testcontainers, in this case for MongoDB, we need to add the\
    \ appropriate dependencies (see Listing 6-66).\n\n**Listing 6-66.** Testcontainers\
