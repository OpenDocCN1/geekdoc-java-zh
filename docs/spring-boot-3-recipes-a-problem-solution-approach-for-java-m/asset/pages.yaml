    |

    | server.servlet.jsp.init-parameters.development | true | JSP development parameter,
    allows reload. |

    | server.servlet.session.persistent | true | Persist session information during
    restarts. |

    | spring.docker.compose.readiness | only-if-started | Wait for Docker containers
    to be ready. |

    | spring.freemarker.cache | false | Disable Freemarker template caching. |

    | spring.graphql.graphql.enabled | true | Enable the GraphQL UI. |

    | spring.groovy.template.cache | false | Disable Groovy template caching. |

    | spring.h2-console.enabled | true | Enable the H2 console, when available. |

    | spring.mustache.servlet.cache | false | Disable Mustache template caching. |

    | spring.mvc.log-resolved-exception | true | Log exceptions. |

    | spring.reactor.netty.shutdown-quiet-period | os | Shut down Netty immediately
    instead of waiting. |

    | spring.template.provider.cache | false | Disable template caching. |

    | spring.thymeleaf.cache | false | Disable Thymeleaf template caching. |

    | spring.web.resource.cache.period | os | Disable static resource caching. |

    | spring.web.resource.chain.cache | os | Disable static resource caching. |


