  md: "# 6-1. Configure a Data Source\n\nWhen working with a relational database,\
    \ the first thing you need is a connection to the database. A connection in Java\
    \ is obtained through javax.sql.DataSource. Spring provides several out-of-the-box\
    \ implementations of DataSource like DriverManagerDataSource and SimpleDriverDataSource.\
    \ However, these implementations are not connection pools and should be considered\
    \ mainly for testing use, not production use. For a live system, you want to use\
    \ a proper connection pool such as HikariCP.\n\n# Problem\n\nYou need access to\
    \ a database from your application.\n\n# Solution\n\nUse the spring.datasource.url,\
    \ spring.datasource.username, and spring.datasource.password properties to let\
    \ Spring Boot configure a DataSource instance.\n\n# How It Works\n\nTo configure\
    \ a DataSource instance, Spring Boot requires the presence of a connection pool\
    \ such as HikariCP, a JDBC driver, or an embedded database such as H2, HSQLDB,\
    \ or Derby. Spring Boot automatically detects HikariCP, Tomcat JDBC, and Commons\
    \ DBCP2-based connection pools. To use the connection pool, configure the spring.datasource.url,\
    \ spring.datasource.username, and spring.datasource.password properties (the minimum\
    \ properties you need to set). Enable the JDBC support by adding the spring-boot-starter-jdbc\
    \ dependency (see Listing 6-1). This will pull in the required dependencies to\
    \ work with JDBC.\n\n**Listing 6-1.** Spring Boot JDBC Starter Dependency\n\n\
    ```\n<dependency>\n  <groupId>org.springframework.boot</groupId>\n  <artifactId>spring-boot-starter-jdbc</artifactId>\n\
    </dependency>\n```"
  merge: -1
  pgno: 296
- img_proc: true
  md: "The dependencies included are spring-jdbc, spring-tx, and HikariCP as the default\
    \ connection pool.\n\n# Use an Embedded Data Source\n\nWhen Spring Boot detects\
    \ the presence of H2, HSQLDB, or Derby, it will by default start an embedded database\
    \ using the detected embedded implementation. This is very useful when writing\
    \ a test or preparing a demonstration. Getting Spring Boot to create this is a\
    \ simple matter of including the desired dependency (see Listing 6-2).\n\nListing\
    \ 6-2. Apache Derby Dependencies for an Embedded Server\n\n```\n<dependency>\n\
    \  <groupId>org.apache.derby</groupId>\n  <artifactId>derby</artifactId>\n  <scope>runtime</scope>\n\
    </dependency>\n<dependency>\n  <groupId>org.apache.derby</groupId>\n  <artifactId>derbytools</artifactId>\n\
    \  <scope>runtime</scope>\n</dependency>\n```\n\nSpring Boot will now detect Derby\
    \ and bootstrap an embedded DataSource instance. Let's write an application that\
