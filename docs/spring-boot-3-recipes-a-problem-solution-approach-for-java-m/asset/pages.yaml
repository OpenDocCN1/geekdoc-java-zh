  md: "# Table 4-2. Default Error Model Attributes\n\n| Attribute | Description |\n\
    | --- | --- |\n| timestamp | The time that the errors were extracted |\n| status\
    \ | The status code |\n| error | The error reason |\n| exception | The class name\
    \ of the root exception (if configured) |\n| message | The exception message |\n\
    | errors | Any errors from a BindingResult (when using binding and/or validation)\
    \ |\n| trace | The exception stack trace (if configured) |\n path | The URL path\
    \ when the exception was raised |\n\nThis is all done through the use of an ErrorAttributes\
    \ component. The default is DefaultErrorAttributes. You can create your own ErrorAttributes\
    \ handler to add additional attributes. See Listing 4-20.\n\n# Listing 4-20. Custom\
    \ ErrorAttributes Implementation\n\n```\npackage com.apress.springboot3recipes.library;\n\
    \nimport org.springframework.framework.web.error.ErrorAttributeOptions;\nimport\
    \ org.springframework.boot.web.reactive.error.DefaultErrorAttributes;\nimport\
    \ org.springframework.web.reactive.function.server.ServerRequest;\nimport java.util.Map;\n\
    \npublic class CustomizedErrorAttributes extends DefaultErrorAttributes {\n  \
    \  @Override\n    public Map<String, Object> getErrorAttributes(ServerRequest\
    \ req, ErrorAttributeOptions options) {\n        var errorAttributes = super.getErrorAttributes(req,\
    \ options);\n```"
