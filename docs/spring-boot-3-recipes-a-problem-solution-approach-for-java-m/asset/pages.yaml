  md: "# Change a User’s Locale\n\nIn addition to changing a user’s locale by calling\
    \ LocaleResolver.setLocation() explicitly, you can also apply LocaleChangeInterceptor\
    \ to your handler mappings. This interceptor detects if a special parameter is\
    \ present in the current HTTP request. The parameter name can be customized with\
    \ the paramName property of this interceptor (the default is locale). If such\
    \ a parameter is present in the current request, this interceptor changes the\
    \ user’s locale according to the parameter value.\n\nTo be able to change the\
    \ locale, a LocaleResolver that allows change has to be used.\n\n```\n@Bean\n\
    public LocaleResolver localLocaleResolver() {\n    return new CookieLocaleResolver();\n\
    }\n```\n\nTo change the locale, add the LocaleChangeInterceptor as a bean and\
    \ register it as an interceptor; for the latter, use the addInterceptors method\
    \ from the WebMvcConfigurer. See Listing 3-32.\n\n> Instead of adding it to the\
    \ @SpringBootApplication, you could create a specialized @Configuration annotated\
    \ class to register the interceptors. Be aware of not adding @EnableWebMvc to\
    \ that class as will disable the auto-configuration from Spring Boot!\n\nListing\
    \ 3-32. LocaleChangeInterceptor Beans and Configuration\n\n```\n@SpringApplication\n\
    public class LibraryApplication implements WebMvcConfigurer {\n    public static\
    \ void main(String[] args) {\n        SpringApplication.run(LibraryApplication.class,\
    \ args);\n    }\n\n    @Override\n    public void addInterceptors(InterceptorRegistry\
    \ registry) {\n        registry.addInterceptor(new LocaleChangeInterceptor());\n\
    \    }\n}\n```"
