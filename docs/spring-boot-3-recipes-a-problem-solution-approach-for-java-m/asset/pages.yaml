  md: '# CHAPTER 6 DATA ACCESS


    # Table 6-5. MongoDB Properties


    | Property | Description |

    | --- | --- |

    | spring.data.mongodb.uri | Sets the MongoDB database URI, including credentials,
    settings, etc. The default is mongodb://localhost/test. |

    | spring.data.mongodb.username | Sets the login user of the MongoDB server. The
    default is none. |

    | spring.data.mongodb.password | Sets the login password of the MongoDB server.
    The default is none. |

    | spring.data.mongodb.host | Sets the hostname (or IP address) of the MongoDB
    server. The default is to fall back to localhost. |

    | spring.data.mongodb.port | Sets the port of the MongoDB server. The default
    is to fall back to 27017. |

    | spring.data.mongodb.database | Sets the name of the MongoDB database/collection
    to use. |

    | spring.data.mongodb.fieldnaming-strategy | Sets the FQN of the FieldNamingStrategy
    instance used to map object fields to document fields. This defaults to PropertyFieldNameNamingStrategy.
    |

    | spring.data.mongodb.authentication-database | Sets the name of MongoDB to use
    for authentication. This defaults to the spring.data.mongodb.database value. |

    | spring.data.mongodb.grids-database | Sets the name of MongoDB to connect to.
    This defaults to a spring.data.mongodb.database value. |

    | spring.data.mongodb.replica-set-name | Sets the replica set name for the cluster,
    required when using a clustered MongoDB. |


    Although you can use Spring Boot to configure the MongoClient, if you need more
    control, you can always specify MongoDbFactory or MongoClient yourself as a bean,
    and Spring Boot will not auto-configure the MongoClient. It will still detect
    Spring Data MongoDB classes and will enable repository support.'
