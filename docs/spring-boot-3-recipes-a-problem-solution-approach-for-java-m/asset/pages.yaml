    # Use Artemis


    When using Artemis, the first thing to do is to include spring-boot-starter-artemis.
    This will pull in all the needed JMS and Artemis dependencies to get started.
    It will include the spring-jms dependency and the libraries for Artemis (see Table
    8-3). See Listing 8-3.


    Listing 8-3. Spring Boot Artemis Starter Dependency


    ```

    <dependency>

    <groupId>org.springframework.boot</groupId>

    <artifactId>spring-boot-starter-artemis</artifactId>

    </dependency>

    ```


    | Property | Description |

    | --- | --- |

    | spring.artemis.broker-url | Sets the Artemis broker URL. |

    | spring.artemis.user | Sets the username for connecting to the Artemis broker;
    the default is empty. |

    | spring.artemis.password | Sets the password for connecting to the Artemis broker;
    the default is empty. |

    | spring.artemis.mode | Sets the mode of operation, native or embedded; the default
    is none, leading to auto-detection of the mode. When the embedded classes are
    found, it will run in embedded mode. |


