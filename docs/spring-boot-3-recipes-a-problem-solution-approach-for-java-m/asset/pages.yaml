  md: "# 6-10. Test with Spring Data R2DBC\n\n# Problem\n\nYou want to test your R2DBC-based\
    \ repositories using a unit or small integration test.\n\n# Solution\n\nUse the\
    \ Spring Test Context framework and the Spring Boot testing support to write a\
    \ unit test using an embedded container such as Apache Derby, or use Testcontainers\
    \ to write a dedicated integration test.\n\n# How It Works\n\nWhen testing R2DBC\
    \ code, a database is required. Often an embedded database such as H2, Derby,\
    \ or HSQLDB is used for testing. Spring Boot makes it easy to write tests for\
    \ R2DBC. R2DBC-based tests can be annotated with @DataR2JpaTest, and Spring Boot\
    \ will create a minimal application with only the R2DBC-related beans. R2DBC related\
    \ beans like a ConnectionFactory, a transaction manager and if needed Spring Data\
    \ R2DBC repositories.\n\n# Test R2DBC Code with an Embedded Database\n\nLet's\
    \ write a test for CustomerRepository and use H2 as the embedded database. First\
    \ add H2 as a test dependency (Listing 6-77).\n\n**Listing 6-77.** Reactive H2\
    \ Dependency for Testing\n\n```\n<dependency>\n  <groupId>io.r2dbc</groupId>\n\
    \  <artifactId>r2dbc-h2</artifactId>\n  <scope>test</scope>\n</dependency>\n```\n\
    \nAs you can see, this isn't just the H2 dependency but rather the r2dbc-h2 dependency\
    \ (which pulls in the H2 database). This dependency is the reactive counterpart\
    \ of the regular JDBC driver for H2.\n\nNext create CustomerRepositoryTest (Listing\
    \ 6-78)."
