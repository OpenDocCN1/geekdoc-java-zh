    This will construct a new RestTemplate for use in our application.

    It is also possible to specify additional configuration for the RestTemplateBuilder
    through the RestTemplateBuilder Each method will construct a new RestTemplateBuilder
    as the RestTemplateBuilder itself is immutable. So, changes set will not be reflected
    in other places that use a RestTemplateBuilder. See Table 3-14.


    # Table 3-14. RestTemplateBuilder Configuration Methods


    | Method | Description |

    | --- | --- |

    | additionalCustomizers | Adds additional RestTemplateCustomizer that should be
    applied to the created RestTemplate. Applied in the order as added on the configuration.
    |

    | additionalInterceptors | Adds additional HttpClientInterceptors that should
    be added/configured on the created RestTemplate. |

    | additionalMessageConverters | Adds HttpClientMessageConverter that should be
    used with the created RestTemplate. |

    | additionalRequestCustomizers | Adds additional RestTemplateCustomizers instances
    to be used to modify the ClientHttpRequest for the created RestTemplate. |

    | basicAuthentication | Sets a basic authentication header with username and password.
    |

    | own | Replaces the RestTemplateCustomizers that are used by the created RestTemplate.
    |

    | defaultHeader | Adds a header with a default value. |

    | detectRequestFactory | Sets whether the request factory should be detected;
    the default is true. Set to false when explicitly configuring the requestfactory.
    |

    | errorHandler | Sets the ResponseErrorHandler that should be used with the created
    RestTemplate. |

    | interceptors | Replaces the interceptors that are used by the created RestTemplate.
    |


