  md: '# 8-6. Receive Messages Using RabbitMQ


    The included @TestConfiguration adds the queue, exchange, and needed bindings.
    The queue and bindings are needed to be able to receive the messages; otherwise,
    they would reside only on the exchange (or depending on the configuration discarded).


    The integration test will load the application and the additional configuration.
    It will use RabbitTemplate to receive the message.


    # Problem


    You want to receive messages from RabbitMQ.


    # Solution


    Annotating a method with @RabbitListener will bind it to a queue and will let
    it receive messages.


    # How It Works


    A bean that has @RabbitListener and/or @RabbitHandler annotated methods will be
    used as message listeners from incoming messages. A message listener container
    is constructed, and the annotated method will receive the incoming message. The
    message listener container can be configured through properties in the spring.rabbitmq.listener
    namespace (see Table 8-13).'
