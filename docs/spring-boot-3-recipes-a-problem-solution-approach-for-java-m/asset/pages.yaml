  md: "# Listing 6-45. CustomerRepositoryTest Setup for Testcontainers\n\n```\n@DataJpaTest\n\
    @AutoConfigureTestDatabase(replace = AutoConfigureTestDatabase.\nReplace.NONE)\n\
    @Testcontainers\nclass CustomerRepositoryTest {\n\n  @Container\n  @ServiceConnection\n\
    \  static PostgreSQLContainer<?> postgres = =\n    new PostgreSQLContainer<>(\"\
    postgres:15-alpine\\n\n  @Autowired\n  private CustomerRepository repository;\n\
    \n  @Autowired\n  private TestEntityManager testEntityManager;\n```\n\nThe @DataJpaTest\
    \ annotation executes the test with a special JUnit extension (the SpringExtension)\
    \ to bootstrap the Spring Test framework. @DataJpaTest will replace the preconfigured\
    \ DataSource with an embedded one by default. @AutoConfigureTestDatabase(replace\
    \ = AutoConfigureTestDatabase.Replace.NONE) prevents this as we want to provide\
    \ an actual DataSource.\n\nNow to register the special JUnit extension for Testcontainers,\
    \ the @Testcontainers annotation has been added. This extension finds fields annotated\
    \ with @Container and will bootstrap the given container. For this test, that\
    \ is a PostgreSQLContainer, which we instruct to use a PostgreSQL15 Docker container.\
    \ Testcontainers will take care of the download of this container and then start\
    \ an instance and stop it after the test.\n\nWhen the test runs, the Flyway script\
    \ will automatically execute and create the schema and populate it with some data\
    \ (as that in our Flyway script; see Listing 6-8).\n\nAs the container for each\
    \ test will start with a different URL, we will need to tell this to our Spring\
    \ Boot application. For this we can use the @ServiceConnection annotation. This\
    \ will pass the required and needed properties to the container automatically.\
    \ Also Recipe 2-3 for more information on this.\n\nWith this we can now write\
    \ some tests to validate our behavior (Listing 6-46)."
