  md: '# 10-3. Reduce the Archive Size Through the Thin Launcher


    # Problem


    Spring Boot by default generates a fat JAR, which is a JAR file with all the dependencies
    inside it. It has some obvious benefits as the JAR file is fully self-contained.
    However, the JAR size can grow considerably, and when using multiple applications,
    you might want to reuse already downloaded dependencies to reduce the overall
    footprint.


    # Solution


    When packaging the application, you can specify a custom layout to use. This behavior
    can be changed by using a custom layout. One such custom layout is the Thin Launcher.
    This launcher will result in the dependencies to be downloaded before starting
    the application, instead of the dependencies packaged inside the application.


    # How It Works


    When using the Spring Boot plugin as is, all the needed libraries are included
    in the archive in the BOOT-INF/lib folder. However, one might want to reduce the
    size of the JAR and enable reuse of dependencies to create an even smaller overall
    footprint. For example, the archive generated with Recipe 10-1 is around 7.1 MB.
    Most of this comes from included dependencies.


    It is possible to add a custom layout and launcher to the Spring Boot plugin.
    A layout defines where the sources are loaded from, and the launcher uses this
    information to load those dependencies. The Thin Launcher will download the artifacts
    from Maven Central and place them in a shared repository. So when multiple applications
    share the dependencies, they are downloaded only once.


    To use the Thin Launcher, add a dependency to the Spring Boot plugin. See Listing
    10-8.'
  merge: -1
  pgno: 459
- img_proc: true
  md: "# Listing 10-8. Thin Layout Configuration\n\n```\n<plugin>\n  <groupId>org.springframework.boot</groupId>\n\
    \  <artifactId>spring-boot-maven-plugin</artifactId>\n  <dependencies>\n    <dependency>\n\
    \      <groupId>org.springframework.boot.experimental</groupId>\n      <artifactId>spring-boot-thin-layout</artifactId>\n\
    \      <version>1.0.31.RELEASE</version>\n    </dependency>\n  </dependencies>\n\
    </plugin>\n```\n\nThis is enough to create a considerably smaller archive (there\
    \ is no BOOT-INF/lib directory inside the archive anymore). When running mvn verify,\
    \ the resulting JAR is around 12 KB. The drawback is, however, that it needs to\
    \ download the dependencies when the application is started, so starting the application\
    \ might take longer depending on the number of dependencies.\n\nWhat happens when\
    \ a class named ThinJarWrapper has been added, and that will be the entrypoint\
    \ of your application. Your application contains a pom.xml and/or META-INF/thin.properties\
    \ file to determine the dependencies. The ThinJarWrapper will locate another JAR\
    \ file (the “launcher”). The wrapper downloads the launcher (if it needs to) or\
    \ else uses the cached version in your local Maven repository.\n\nThe launcher\
    \ then takes over and reads pom.xml (if present) and META-INF/thin.properties,\
    \ downloading the dependencies (and all transitives) as necessary. It will now\
    \ create a class loader with all the downloaded dependencies on the classpath.\
    \ Then it runs the application’s own main method with that class loader.\n\n>\
    \ When downloading the dependencies from Maven, it will respect the settings made\
    \ in the Maven settings.xml file as it regular Maven tooling. When using a mirror,\
    \ like Nexus, for Maven repositories, include thin.repo in the META-INF/thin.properties\
    \ file to point to that mirror. Otherwise, downloading the launcher will fail."
  merge: -1
