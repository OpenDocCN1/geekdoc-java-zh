  md: "# Test Spring Data R2DBC Code with Testcontainers\n\nA better option nowadays\
    \ is to use Testcontainers. Testcontainers uses Docker to bootstrap a Docker container\
    \ for your given technology. In this case, we could use a PostgreSQL Docker image\
    \ to boot a real database and that in our tests. With this we are now using your\
    \ actual database for testing and don't need to have an in-memory version, meaning\
    \ you can execute all the queries you want and test them. It also gives you the\
    \ opportunity to test your database migration scripts (when use).\n\nTo use Testcontainers,\
    \ in this case for PostgreSQL, we need to add the appropriate dependencies (see\
    \ Listing 6-81). We need the PostgreSQL dependency from Testcontainers as well\
    \ as the JUnit Jupiter and a special one for R2DBC.\n\n**Listing 6-81.** Testcontainers\
    \ Dependency for PostgreSQL and JUnit Jupiter\n\n```\n<dependency>\n  <groupId>org.springframework.boot</groupId>\n\
    \  <artifactId>spring-boot-testcontainers</artifactId>\n  <scope>test</scope>\n\
    </dependency>\n<dependency>\n  <groupId>org.testcontainers</groupId>\n  <artifactId>postgresql</artifactId>\n\
