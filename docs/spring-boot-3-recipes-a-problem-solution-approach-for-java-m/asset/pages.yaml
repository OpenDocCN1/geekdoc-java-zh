  md: '# Table 3-19. MockRestRequestMatchers Setup Methods


    | anything() | Matches any request. |

    | content() | Setup matches for the content, like Content-Type or the actual body
    of the request. |

    | header() | Matches request with given header, with either a value or Hamcrest
    Match. |

    | headerDoesNotExist | Matches request where the given header doesn''t exist.
    |

    | headerList() | Matches request with given header, with values or Hamcrest Match.
    |

    | jsonmethod | Setup matches for the request body with JsonPath. |

    | queryParam | Matches the HttpMethod of the request. |

    | queryParamList | Match the request parameter with either a value or Hamcrest
    Match. |

    | requestTo | Match the request using the expected URI (can be a String or URI).
    |

    | requestToUriTemplate | Match the request using a URI template. |

    | xpath | Setup matches for the request body with XPath. |


    The response is created through the use of MockResponseCreatators, and currently
    we only use withSuccess, but it is also possible to set up error scenarios (Table
    3-20).


    # Table 3-20. MockResponseCreatators Setup Methods


    | withAccepted() | Response with a 202 (ACCEPTED) HTTP status code. |

    | withBadGateway() | Response with a 502 (BAD_GATEWAY) HTTP status code. |

    | withBadRequest() | Response with a 400 (BAD_REQUEST) HTTP status code. |

    | withCreatedEntity(URI) | Response with a 201 (CREATED) HTTP status code and
    Location header. |

    | withException(IOException) | Response with an internal application IOException.
    It is useful to simulate read or connection timeouts. |


    (continued)'
