- img_proc: true
  md: '# Introduction


    Welcome to Spring 3 Recipes!


    # Who This Book Is For


    This book is for developers who want to make it easier to work with their Spring
    applications. If your project uses Spring, introducing Spring Boot will simplify
    your application configuration, deployment, and management.


    This book assumes that you are familiar with Java and Spring and that you have
    an integrated development environment (IDE) of some sort. This book doesn''t explain
    all the internals and in-depth workings of Spring or the related projects; for
    that you might want to pick up a copy of Spring 6 Recipes.


    # How This Book Is Structured


    There are 10 chapters in this book.


    +   Chapter 1, “Introduction to Spring Boot,” gives a quick overview of Spring
    Boot and how to get started.


    +   Chapter 2, “The Basics of Spring Boot,” covers the foundations of how to define
    and configure a bean with dependency injection using Spring Boot.


    +   Chapter 3, “Spring MVC,” covers web-based application development using Spring
    MVC.


    +   Chapter 4, “Spring Webflux,” covers reactive web-based application development
    using Spring Webflux.


    +   Chapter 5, “Spring Security,” provides an overview of how to secure your Spring
    Boot application using Spring Security.


    +   Chapter 6, “Data Access,” explains how to access data storage such as a database
    or No-SQL store.


    +   Chapter 7, “Java Enterprise Services,” introduces how to use enterprise services
    such as JMX, Mail, and JFR with Spring Boot'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# INTRODUCTION


    Chapter 8, "Messaging," introduces how to do messaging with several different
    messaging technologies.


    Chapter 9, "Spring Boot Actuator," explains how to use the production-ready features
    such as health and metrics from Spring Boot Actuator.


    Chapter 10, "Packaging," shows how to package and deploy your Spring Boot applications
    by making them executable and how use Docker and GraalVM.


    # Conventions


    We use the following code conventions in this book:


    +   - Sometimes, when we want you to pay particular attention to a certain part
    of an example, we will put the code in bold. Please note that the bold doesn''t
    necessarily reflect a code bold from the previous version.


    +   - When a code line is too long to fit within the page''s width, we will break
    it with a code continuation character. Please note that when you try to type the
    code, you have to concatenate the line without any spaces.


    # Prerequisites


    Because the Java programming language is platform independent, you are free to
    choose any supported operating system. However, some of the examples in this book
    platform-specific paths. Translate them as necessary to your operating system''s
    format before typing your examples.


    To make the most out of this book, install JDK version 21. You should have a Java
    IDE installed to make development easier. For this book, most of the sample code
    is Maven based, and most IDEs have built-in support for Maven to manage the classpath.


    The samples sometimes need additional libraries installed such as PostgreSQL,
    ActiveMQ, etc. For this book, we use Docker. Of course, you can install the libraries
    on your machine instead of using Docker, but for ease of use (and not polluting
    your system) using Docker is preferred.


    # Contacting the Author


    We always welcome your questions and feedback regarding the contents of this book.
    You can contact Marten Deinum by email at marten@deinum.biz or via X at @mdeinum.'
  merge: -1
  pgno: 17
- img_proc: true
  md: '# CHAPTER 1


    # # Introduction to Spring

    Boot


    In this chapter, you will learn about the fundamentals of Spring Boot. At the
    heart of Spring Boot lies the Spring Framework, which Spring Boot extends to make
    auto-configuration, among other features, possible.


    Spring Boot makes it easy to create stand-alone, production-grade Spring-based
    applications that you can “just run.” We take an opinionated view of the Spring
    platform and third-party libraries so you can get started with minimum fuss. Most
    Spring Boot applications need very little configuration.


    > —Spring Boot Reference Guide


    Spring Boot has auto-configuration for infrastructure like JMS, JDBC, JPA, RabbitMQ,
    and more, and it comes with auto-configuration for different frameworks such as
    Spring Integration, Spring Batch, Spring Security, and many others. When these
    frameworks or capabilities are detected, Spring Boot will auto-configure them
    with opinionated but sensible defaults.


    The source code uses Maven for its build. Maven will take care of getting the
    necessary dependencies, compiling the code, and creating the artifact (generally
