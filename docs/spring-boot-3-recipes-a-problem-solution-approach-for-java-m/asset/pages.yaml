- img_proc: true
  md: '# How It Works


    When building, GraalVM native image is created based on the code that is currently
    available in the JVM. Based on that, GraalVM will compile a native executable.
    GraalVM assumes that all the code that is needed to run the application is present
    in the JVM at the moment the application is being inspected. If the code doesn''t,
    it will be part of the resulting native executable. The process to compile the
    bytecode in native code is called ahead-of-time (AOT) compilation, instead of
    the JVM does with just-in-time compilation JIT.


    Spring support for contributing information ahead of time to GraalVM, and Spring
    Boot leverages that support in the Spring Boot plugins. When running mvn -PNative
    native:compile, you will see a line in the output that reads like [INFO] --- spring-boot:3.2.1:process-aot
    (process-aot) @ recipe_10_5_i ---. See Figure 10-5.


    ![](img/89a0bcab7458b6da76f2e201f270589c_471_0.png)


    Figure 10-5. Maven process-aot, Spring Boot will do a couple of things.


    +   - Generate source code for bean definitions

    - Generate a file containing GraalVM hints

    - Generate bytecode for proxy classes


    All of these steps are needed for GraalVM to do a proper static analysis of the
    code needed to run the application.'
  merge: -1
  pgno: 471
- img_proc: true
  md: '# CHAPTER 10 PACKAGING


    # Generate Source Code for Bean GraalDefinitions


    As we cannot have dynamic code in GraalVM native image, we need to have a static
    configuration. Normally an @Configuration class is parsed while starting the application,
    and based on the @Bean annotated methods, Spring will create special BeanDefinition
    source files. The actual @Bean methods are being invoked with reflection, which
    we cannot do in a native image.


    Now when creating a native image instead of parsing the @Configuration classes
    at runtime and parsing the beans, it generates the bean definitions during AOT
    processing. It will actually generate a source file for the @Configuration class.
    These classes can be found in the target/spring-aot/main/sources Figure 10-6.


    ![](img/89a0bcab7458b6da76f2e201f270589c_472_0.png)


    Figure 10-6. generated sources


    As you can see, there is also an org directory, as it will generate sources for
    all @Configuration classes it generates. This works for the Spring Boot configuration
    classes and other @Configuration classes that are loaded.


    # Generate GraalVM Hints


    In addition to generating sources, Spring AOT will also generate a hints file
    that is used by the GraalVM. The hint file contains data, in JSON format, that
    describes how GraalVM should deal with situations it cannot understand directly,
    like in the case of reflection, multiple constructors, or dynamic class loading.


    490'
  merge: -1
  pgno: 472
- img_proc: true
  md: '# CHAPTER 10 PACKAGING


    The hint file is automatically generated in the target/spring-aot/main/resources

    directory. See Figure 10-7.


    ![](img/89a0bcab7458b6da76f2e201f270589c_473_0.png)


    Figure 10-7. Generated hint files


    While Spring Boot will do its best to infer the hints to generate based on the
    code,

    it might be that it cannot determine or it might need some help. Spring

    AOT can help provide and provides the RuntimeHintsRegistrar interface, which allows

    to register additional hints for the code in question. After defining the specific
    hints,

    you can use the @ImportRuntimeHints annotation to make Spring AOT aware of this

    class. See Listing 10-17.


    # Listing 10-17. Register Runtime Hints


    ```

    package com.app.spring.aot.hint.RuntimeHints;


    import org.springframework.framework.aot.hint.RuntimeHintsRegistrar;

    import org.springframework.framework.boot.SpringApplication;

    import org.springframework.boot.autoconfigure.SpringBootApplication

    import org.springframework.framework.context.annotation.ImportRuntimeHints;

    import org.springframework.framework.scheduling.annotation.EnableScheduling;

    ```


    ```

    @SpringBootApplication

    @EnableScheduling

    @ImportRuntimeHints(HelloWorldApplication.HelloWorldRuntimeHints.class)

    ```'
