  md: "# CHAPTER 5 SPRING SECURITY\n\nWithout these basics, Spring Security wouldn't\
    \ store the user after doing a login, and it wouldn't do proper exception translation\
    \ for security-related exceptions (they) would simply bubble up, which might expose\
    \ some of your internals to the outside world). You also want to enable the Servlet\
    \ API integration so that you can use the methods on HttpServletRequest to do\
    \ checks in your view. See Listing 5-8.\n\n# Listing 5-8. Servlet API Defaults\n\
    \n```\n@Configuration\n@EnableWebWebSecurity\npublic class LibrarySecurityConfig\
    \ {\n\n  @Bean\n  public SecurityFilterChain security(HttpSecurity http) throws\
    \ Exception {\n    http.servletApi(Customizer.withDefaults());\n    return http.build();\n\
    \  }\n}\n```\n\n# HTTP Basic Authentication\n\nThe HTTP Basic authentication support\
    \ can be configured via the httpBasic() method. When HTTP Basic authentication\
    \ is required, a browser will typically display a login dialog box or a browser-specific\
    \ login page for users to log in. See Listing 5-9.\n\n# Listing 5-9. Enabling\
    \ Basic Authentication with the Defaults\n\n```\n@Configuration\n@EnableWebWebSecurity\n\
    public class LibrarySecurityConfig {\n\n  @Bean\n  public SecurityFilterChain\
    \ security(HttpSecurity http) throws Exception {\n    http.httpBasic(Customizer.withDefaults());\n\
    \    return http.build();\n  }\n}\n```"
