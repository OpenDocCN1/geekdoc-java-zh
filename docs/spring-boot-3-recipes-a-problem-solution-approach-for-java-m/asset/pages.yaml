  md: '# CHAPTER 6


    # Data Access


    Most applications use a relational database such as Oracle, MySQL, PostgreSQL,
    however, there is more to data storage than just SQL databases. There are also
    these types:


    +   - Document stores (MongoDB, Couchbase)

    - Key-value stores (Redis, Voldemort)

    - Column stores (Cassandra)

    - Graph stores (Neo4j, Apache Giraph)


    Each of these technologies (even different implementations of them) has its own
    purpose. They can also be hard to use or configure, but Spring Boot makes it easier
    to configure and use them. Spring Boot uses auto-configuration, which will detect
    data store is in use (it detects the drivers) and will apply the configuration
    for it. To make easier to work with these technologies, Spring Boot utilizes the
    Spring Data project.


    > Although each section uses a different persistence store, the bin directory
    contains scripts that set up Docker containers for each persistence store.


    The Spring Data project can make life easier; it can help configure the different
    technologies with the plumbing code. Each of the integration modules will support
    for exception translation to Spring’s consistent DataAccessException hierarchy
    and will be able to use Spring’s templating approach. Spring Data also provides
    a cross-storage solution for some technologies, which makes part of your model
    can be stored in a relational database with JPA, and the other part can be stored
    in a graph or document store.'
