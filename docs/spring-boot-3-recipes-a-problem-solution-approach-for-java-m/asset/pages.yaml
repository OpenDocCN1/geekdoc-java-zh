    \ as a spring.sql.init.mode property with a value of ALWAYS. This is to initialize\
    \ the database and insert some data (see Recipe 6-2 for more database initialization).\n\
    \nTo work with the database, let's use a repository and create a different implementation\
    \ for this. Listing 6-70 shows the CustomerRepository interface.\n\n# Listing\
    \ 6-70. Reactive CustomerRepository Interface\n\n```\npackage com.appspring.boot3recipes.r2dbc;\n\
    \nimport reactor.core.publisher.Flux;\nimport reactor.core.publisher.Mono;\n\n\
    public interface CustomerRepository {\n\n    Flux<Customer> findAll();\n    Mono<Customer>\
    \ findById(long id);\n    Mono<Customer> save(Customer customer);\n}\n```\n\n\
    The methods return either a Flux or Mono, respectively zero or more of zero or\
    \ one, which are the reactive types from Project Reactor. Project Reactor is the\
    \ reactive implementation used internally with Spring, but it is also possible\
    \ to work with RxJava or SmallRye Mutiny.\n\nNext we need a class that uses this\
    \ interface to retrieve the customers and prints out the results (Listing 6-71).\n\
