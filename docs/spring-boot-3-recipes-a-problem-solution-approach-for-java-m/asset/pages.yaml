  md: '# CHAPTER 10


    # # Packaging


    In this chapter, you will learn about different solutions for packaging a Spring
    Boot application, from creating an executable JAR to using GraalVM to create a
    native image from the code.


    # ## 10-1. Create an Executable Archive


    By default Spring Boot creates a JAR or WAR that can be run with java -jar your-application.jar.
    However, you might want to run the application as part of the startup of your
    server (currently tested and supported for Debian- and Ubuntu-based systems).
    For this you can use the Maven or Gradle plugins to create an executable JAR.


    # ### Problem


    You want an executable file so that it can be installed as a service in your environment.


    # ### Solution


    The Spring Boot Maven and Gradle plugins both have the option to make the created
    artifact executable.¹ When doing so, the archive also becomes/behaves like a Unix
    shell script to start/stop a service.


    # ### How It Works


    To make an artifact executable, you need to configure the Maven or Gradle plugin
    as such.


    > ¹https://docs.spring.io/spring-boot/docs/current/reference/html/deployment-install.html'
  merge: -1
  pgno: 451
- img_proc: true
  md: "# Make the Archive Executable\n\nIn the Maven plugin, you can set the executable\
    \ property to true, and the archive will be executable. See Listing 10-1.\n\n\
    **Listing 10-1.** Spring Boot Maven Plugin to Create Executable\n\n```\n<plugin>\n\
    \  <groupId>org.springframework.boot</groupId>\n  <artifactId>spring-boot-maven-plugin</artifactId>\n\
    \  <configuration>\n    <executable>true</executable>\n  </configuration>\n</plugin>\n\
    ```\n\nFor Gradle you need to specify launchScript() to achieve this. See Listing\
    \ 10-2.\n\n**Listing 10-2.** Spring Boot Gradle Plugin to Create Executable\n\n\
    ```\ntasks.named('bootJar') {\n  launchScript()\n}\n```\n\nNow after building\
    \ your artifact, the artifact itself is executable and can be used to launch the\
    \ application. Instead of java -jar your-application.jar, you can now simply type\
    \ ./your-application.jar and it will start.\n\n> It might be necessary to make\
    \ the archive executable; you can use chmod +x your-application.jar for that.\n\
    \nWhen making the archive executable, what happens is the archive will be prefixed\
    \ with a bash script. You might think that doing so will break the Java archive.\
    \ However, because of the way Java reads archives (bottom to top) and the way\
    \ the shell reads the archives (top to bottom), this actually does work.\n\n>\
    \ You can see the bash script using head -n 309 your-application.jar."
  merge: -1
