    favorite.


    That she does, I glance toward the main shop. I had a coffee right when I got
    here, and I plan to grab another before I take off. It’s hard not to crave it
    when I’m inhaling that aroma all day. The rich, distinct smell of roasted coffee
    beans, combined with the intoxicating scent of fresh-cut wood, has made this job
    even better than most.


    Braxton: All right, man, thanks. See you in a min.


    I pack up for the day; chest puffed with pride from a job well done, mouth watering
    for that frothy cappuccino. I feel great about the work I got done today, and
    I feel even better knowing I’ll have a nice drink to warm me on the way home.
    If I hurry, I’ll catch the second half of the game. Not that I’m terribly invested
    now that the Seahawks are down.


    The lot is even more crowded than usual. Cars line the roadside, starting at the
    Coffee Loft and continuing as far as the eye can see. As soon as I pull open the
    entrance door, I sense the mass energy of a crowded space. I duck my head as I
    weave through a few people who’ve migrated into the walkway leading to the counter.
    Beau catches my gaze with the hook of one arm, motioning for me to join him and
    Kirsten, who’s lifting a pair of coats off a spare chair and pulling them onto
    her lap.


    “Chantel’s starting your drink now,” Beau says.


    “Thanks,” I say. It might be rude to skip out on the show, but I’m not about to
    stay. I shift my gaze to the mock stage where a couple stands awkwardly facing
    one another, mics in their hands.


    “So finally,” a chick who’s probably in her early twenties says, “Brinley is sure
    she’s worked up the nerve to tell her best friend, Mason, that she likes him.
    She figures she can tell him during the ballgame. Or maybe right after. So long
    as she doesn’t chicken out.”


    A chime sounds, and all eyes shift to the male standing opposite her. He’s tall,
    gawky, and, from what I can tell, nervous.


    Beau leans in and taps my arm. “It’s an improv storytelling. A couple goes up
    and takes their best shot at telling a story.”


    “It has to be romance,” Kirsten adds in a whisper.


    The kid clears his throat and smears a hand over his glistening forehead. “So…uh…
    meanwhile, Mason is on his way to pick up Brinley for the game. While he’s driving,
    he finds that his palms are sweaty against the wheel. His heart is pounding harder,
    too. He knows it’s because he has something to tell this woman he’s been slowly
    falling in love with, and he’s not so sure how she’ll take it.”


    Oohs and ahs fill the crowd. I resist an eye roll and tip my head back to spot
    the action behind the counter. Hopefully, my coffee is coming soon; I have an
    old lounge chair and a big-screen TV calling my name back home. A sliver of disappointment
    burrows into my chest as I realize Maggie must have gone home. The irritating
    thing is I didn’t even realize I was looking for her. But more perplexing is the
    fact that I’m not relieved that she’s gone.


    Ah, there’s Chantel holding a steaming mug with a white, frothy top as she heads
    my way. I’m about to get my hopes up when I realize she’s serving it in one of
    the house mugs, not a to-go cup. Great.


    Well, maybe that one’s not mine.


    But Chantel narrows her gaze on me. She nods toward the table, indicating her
    intent, then slides the delicious-looking drink gently onto the surface, causing
    the foam with its decorative swirls to tip and sway.


    The crowd claps, and the host of this thing congratulates the couple on a job
    well done.


    “It’s already paid for,” Chantel whispers, but I slip her a five as a tip.


    “Thanks. You don’t happen to have a to-go cup around here, do you?”'
