    Kirsten gently closes the book and rests it on the coffee table. “You should read
    it.”


    “I don’t know if I want to now. I feel like that whole book is ruined for me.
    I was so positive I was on the right track.”


    “I think you are on the right track,” Kirsten says. “You just…hit a speed bump,
    is all.”


    Why isn’t she telling me what’s going on with Braxton? I know she knows. How did
    he spend his night last night? Was he as upset as I was? Is he as messed up today
    as I am?


    “Are you going to turn your phone back on now?” she asks. It’s like an unspoken
    game of hardball. If I want to know what’s going on with Braxton, I have to be
    willing to hear from him directly.


    The thing is, if I turn on my phone to find I haven’t missed even one text or
    call from him, I’ll feel worse than ever. At least while it’s off, I can imagine
    that he’s trying very hard to get through. Asking if I’ll forgive him. If we’re
    still on for our Valentine’s date.


    Only as the day has gone on, it’s gotten harder to imagine him making any such
    attempt.


    “What’s Braxton thinking?” I finally ask.


    Kirsten holds my gaze. “The boys went out for drinks after we left. Braxton ranted
    the whole time. He’s upset that you’re willing to throw out a good relationship
    over something that happened before you even knew each other.”


    “That’s only a small part of it,” I say, irritation coating my words. “You saw
    how he acted about it last night. He was a total jerk. Laughing like it was no
    big deal.”'
