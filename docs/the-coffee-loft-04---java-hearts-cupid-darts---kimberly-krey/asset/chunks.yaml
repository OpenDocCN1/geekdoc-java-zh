    格特鲁德拍了拍手，叫了起来。


    在心里，我也在这样做。我不希望这个夜晚结束，看起来玛姬似乎也有同感。


    # 16


    ![](img/image_rsrc2A2.jpg)


    ## 玛姬


    笑声填满了我们今晚共用的房间。正如承诺的那样，这里有两张床，但到为止，我们谁都没有离开到达时坐下的那张床。


    一桶焦糖爆米花放在中间的托盘上，旁边有一个空酒瓶和两个香槟高脚杯。布克斯顿侧躺着，用手肘支撑面对我。在床的另一侧，我靠着床头，双膝抱在胸前。


    “所以你们每人至少都断了一根骨，”我根据布克斯顿刚讲的故事推测道。


    “至少一根，是的。”


    “而且你们的头上某个地方都得过缝针。”


    “没错，”他肯定道。


    我摇了摇头。“而你之前还因为我盯着灯具看而大惊失色。”


    “嘿，我以为女孩是不一样的。况何况，你做的事并不正常，”他调侃道，“男孩子本性……从高树枝、屋顶或任何我们能爬上去的地方下来——这些都是常有的便饭。”


    “你可怜的妈妈。”


    “是啊，”他承认了。


    安静的时刻让我想起他今晚分享的其他事情。听到布克斯顿在重温童年几个精彩时刻时大笑感觉很好，其中大多数都包括他去世的哥哥布莱恩。


    “我想我应该说，在你的情况下，是可怜的老师，”布克斯顿说道。


    我咯笑得感到腹部的肌肉隐隐作痛，那是因为今晚一直在笑。“完全可以这么说。”我那些精彩的童年时刻大多集中在因为调皮或顶嘴而惹了老师的麻烦上。当然，那是为了引起父母某人的注意，尽管这并没有起什么作用。


    “还有可怜的凯斯汀，”我补充道，“她是唯一能找得到的人。最后，她开始说我是我妈妈。她会替我道歉。


    “然后，当我回家时，她并不会对我生气，而是会密切关注我的成就并给予许多赞扬。如果这还不够，她会带我走向隔壁的诺布利家，告诉他们我的论文考得了 A+，或者我的英语考试考了
    B-——比我上次得的 D 好得多。”


    布克斯顿呻吟着道。“我知道我会后悔说关于杰布的那些错话的。如果我早知道的话——”


    “你只是在诚实，”我说。


    “而我，正如某人所说的那样，缺乏任何像样的床边态度。”


    当我想起他在那句话之后对我说的话时，一阵热流涌上胸膛。那是关于我在我们甚至还没约会时就提到睡前活动的笑话。


    “什么？”布克斯顿问，让我意识到我正在微笑。


    我凝视他的目光片刻，然后寻找着他英俊的脸。“我只是……在想回我们最初几次对话有多好笑。现在我更了解你了，它们似乎更……”


    “噢，不。更什么？”


    我咯咯笑道。“更有趣。我觉得我现在懂你了。”


    “好，”他说，“如果你真的懂我，那我现在在想什么？”


    这听起来像个危险的问题。一个迫使我的脑海立刻跳回我们在车厢尾部分享的吻。我的目光落在他的唇上，然后重新抬起对上他的眼睛。就在那里，那抹我早已预料甚至喜爱的迷人恶作火花。


    他打破了我们的视线，将托盘滑到床尾。我看着他倾倒瓶子，然后一个接一个将每个空杯侧放，最后重新恢复他的姿势，用的一只手肘支撑面对我。


    但这一次，他更近。近得多。当他再次对上我的目光时，他身上男性的、辛性的香水味挑逗着我的感官。“我们谈到哪儿了？”


    我笑了。“我正试着猜你想什么。”


    布克斯顿向后仰头。“啊，对。”


    我打量着他，观察他深夜的样子。现在已经是凌晨两点多了，随着时间一分分过去，布克斯顿调整了他的衣服。先脱掉西装外套，然后松开领带。接着，他解开了白衬衫的最三个纽扣，卷起袖子，露出了黝黑、肌肉发达的前臂。


    “呢？”他催促道。


    我的脸发烫。我轻笑了一下，突然感到很害羞。“我不知道。”


    “我告诉过你利姆扔那个锡罐朝我时我缝针的事。我脸上那里留了一道疤。你能看到吗？”


    我歪了歪头。“你在想这个？”


    “我在想你可能应该吻好它。”


    我再次微笑脸红。“你是这么想的对吗？”我说，很想这样做。我伸直双腿向他靠拢。“你可能应该坐起来，好让我看得清楚。”


    “好主意。”他照做了，很快我们就面对面，双腿交叉，膝盖接触，心跳加速。至少我的是这样。


    我把手放在他的肩膀，对这种动作的亲密感感到惊讶。我曾想象过他的胡须在手心是什么感觉，并挑战自己去发现。伴着缓慢、有些试探的动作，我的手滑过他衬衫敞开的领口。然后我温柔地托住他强有力、线条分明的下颌，享受皮肤上那种粗糙的触感。


    布克斯顿发出一声短促的呼吸。


    我喜欢他让我这样做——让我近距离地观察他英俊脸庞的特征。我的指尖以极轻的拂过他的太阳穴、额头和脸颊。


    他闭上眼睛，呼吸变得急促。


    这个动作让我意识到我的触摸对他有多影响；我也喜欢那样。我顺着眼角细小的鱼尾纹、光滑的额头和眼睑细腻的感觉。


    还是没有疤的迹象。尽管如此，我凑过去亲了他的脸颊，让呼吸在他的皮肤上停留。


    “对不起，”我说，“我以为在那里看到了什么。只是影子。”


    他只是咽了一下，我们之间的化学反应更加激烈。他的手托住我的膝，温暖的感觉增强了房间里流动的能量。我再次观察他的脸，降低目光掠过他的鼻子、下巴，再次回到上唇上方。最后，我发现了——那是他上唇一侧的一道细小的白线。


    我的胃暖暖了。我本该知道会在那里的。


    我微微托起他的下巴，低下头，直接沿着疤痕落下一个温柔、持久的吻。另一阵颤栗流遍全身，让快感一直延伸到脚趾。我不记得以前主动吻过。


    布克斯顿睁开眼睛对上我的目光。他脸上的表情让热流直穿我的身体。欲望、渴望、决心。在他凑近并再次缩小我们距离之前，他的手移到了我的脖子上。双唇咫尺之际，他低声唤着我的名字，然后用他那充满鼓励的唇吻住了我的唇。


    我叹了口气，当他加深吻时偏过头。他用喉咙里低沉的呻吟作为回应，手插进我的头发。


    寒意掠过我的手臂，我品味着他美妙吻的每一次推拉。就像潮汐的涨落，这一刻给予，下一刻夺走。布克斯顿那精妙的嘴正让我陷入天堂般的魔咒，我满脑想的只有更多。


    这个单词不知为何唤醒了我，并提醒我我设定的界限。无论这种感觉有多好，我都没有打算逾越。这些界限。而这种感觉确实很好。


    “布克斯顿，”我在亲吻间呢喃道。


    他再次亲吻我，是一连串缓慢、挑逗的愉悦。“嗯？”


    我退后一点对上他的目光，他的眼睛依然闭着。我对着他脸上幸福的微笑露出了。

