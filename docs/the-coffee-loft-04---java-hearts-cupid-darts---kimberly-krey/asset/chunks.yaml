    I pull back from the window and hurry across my room, brow furrowed as I try to
    guess what’s waiting in his back seat.


    The old grandfather clock—a gift from Jeb—chimes as it hits five o’clock right
    as I make it to the door.


    Without a second’s delay, I twist the knob, pull open my door, and step right
    onto my porch. As soon as I see Braxton, my eyes go wide in surprise.


    He’s wearing a tux, all right, but that’s not all he has on. I’m not sure which
    medical staff from what hospital he had to bribe to get his hands on it, but Braxton
    Wheaton is wearing a King Kong-sized neck brace that hinders his stride and squishes
    his face, and makes my heart explode with all the feels of a woman who’s well
    on her way to falling in love.


    “Hi,” he says from the bottom of the step. I can tell he’s attempting to look
    down and check his footing, but the contraption won’t let him.


    “Braxton,” I say, hurrying down the steps to greet him before he gets hurt. “Where
    did you get this thing?”


    “A nurse Luke and Liam know from the singles group,” he says through squished
    lips. “I am going to force myself to wear it the whole night to make up for what
    I did to you.”


    “You are?” I ask as a shocked laugh sneaks past my throat.


    Braxton blinks twice. “I can’t nod,” he gripes, “but yes.”


    I level a look at him, suspecting that Braxton is far too vain to ever really
    do such a thing. And the truth is, I would never let him. Still, I decide to have
    a little fun before letting him off the hook.


    I nod. “Okay.”


    “Okay?” he squeaks, eyes bulging.


    “Sure. I’ll probably have to drive.” I glance over at the car. “But I’m sure Beau
    won’t mind.”


    Braxton sniffs and attempts to rub his nose, but his arm gets stopped by the halo
    bar.


    “You know,” I say, reaching in to scratch his twitching nose for him, “when I
    wore this, I had to keep it on for four whole weeks.”


    He pulls a nervous-looking cringe face like I might ask him to do that too.


    I start to laugh. I can’t help it. He’s so cute with his tux and the stormtrooper
    neck brace, his face all squished and thinking I’d really make him wear it all
    night.


    “Yeah, yeah,” he mumbles. “I know. I look ridiculous. You have every right to
    laugh.”


    But I only shake my head and reach for the Velcro strap around his ribs. I give
    it a tug, and the sharp sound from the Velcro echoes in the confined porch space.


    “What are you doing?” he asks.


    I move to the halo strap and give that tug next. Another echoing hiss from the
    Velcro. “I’m setting you free,” I say. It takes a few more steps to get the whole
    thing loose, but soon, I’m hoisting the giant thing from his body as Braxton takes
    a step back. His hair is tousled, and his face is flushed.


    “There,” I say, setting it gently on the step. “The fact that you were willing
    to wear this is enough for me. It’s more than enough,” I add, wrapping my arms
    around him and pulling him in for a warm embrace.


    “I really was a jerk,” Braxton says in my ear as he squeezes me tight. “I shouldn’t
    have laughed about it. But if it makes you feel any better, I thought you were
    cute.”


    I yank back and smack his arm. “You did not.”


    He nods adamantly. “I most definitely did, and man, it feels good to nod again.”
    He runs a hand over his throat. “I could tell you were pretty despite this big…contraption,
    and I liked your sass.”


    “You’re lying,” I say, not at all convinced.


    “I knew you’d say that.” He tugs his phone from his back pocket and pulls up an
    image on the screen. He shows it to me. At first, I think it’s a picture, but
    then I realize it’s a video when Braxton taps the screen.


    I see a guest signing book and realize, by the last name embossed on the cover,
    that it’s Chad and Viv’s. “I remember you leaving a funny message on our guestbook,”
    comes Chad’s voice. “So, Viv and I dug it up last night and thumbed through it.
    Lo and behold, we found that funny message right here by your signature.”


    The camera zooms in. I read a scribbled version of Braxton’s first and last name.
    Beside that is a note that says, ‘Set me up with neck-brace girl once she gets
    the brace off. I think I like her.’


    I gasp. There are dozens of signatures above, below, and all around it, but my
    eyes can barely move off that one spot.


    Braxton speaks up. “I was laughing, saying it was hilarious, even, because I was
    attracted to you even back then. I liked how you told me off. I should have apologized,
    sure, but…” He sighs and tucks the phone back into his pocket. “I had a lot to
    learn. I still do.”


    I stare at him for a blink, perplexed. “Did you really think I’d agree to go out
    with you after you did that?”


    He grins. “Kinda. If I apologized, that is. I hoped.”


    “Well,” I say, taking hold of his arm. “I’m going out with you now.”


    “Yes, lucky man that I am.” Braxton leans down and hoists the brace off the ground.


    He opens the door for me, and I climb into the passenger seat. After he hoists
    the hefty brace into the trunk, Braxton settles into the driver’s seat and pulls
    a pair of tickets from his pocket.


    “I told you to dress in formalwear, but I didn’t say what we had planned.”


    He hands over the tickets, and I read the event line aloud. “Dinner Cruise for
    Two!” I squeal in excitement and rush in to give him a hug. “You remembered,”
    I say, bringing a hand on my chest as I bask in that fact.


    “Remembered? I booked it the very next day, the platinum package, which means
    a guaranteed window seat.” He leans over and kisses my lips.


    “Mmm,” I mumble, “I can’t wait.”


    “You know what I’m excited about?” Braxton says after backing up and straightening
    the wheel. “The whole ride we have ahead of us. Which reminds me—what does that
    line mean, you know, that whole sky’s the limit thing?”


    I tap my lip and pull a perplexed expression. “I think it means potential.”


    “Sky’s the limit,” Braxton says.


    # EPILOGUE


    ![Maggie](EBPS/image_rsrc2A2.jpg)


    “Who’s ever heard of rebounding, anyway?” Luke grumbles under his breath.


    Liam sinks deep into a stretch. “I think it sounds fun.”


    “It is fun,” I assure them.


    Beau hands Kirsten her water bottle, and they each position next to a tramp. “Yeah,”
    he says, “but is it a workout?”


    Braxton rolls his shoulders. “It will definitely be a workout for you, old man.”


    “Who are you calling old man?” Collin Wheaton asks.


    “Not you, Pops,” Braxton assures him. “Here, you and mom use these up front with
    the bar.”


    “Oh, good,” Mandy says, following Braxton to the front. “I was hoping some would
    have bars.” The woman looks up at me. “What kind of music are you going to play,
    dear? Braxton says you play a lot of Metallica?”


    I grin and shake my head. “He’s teasing. Do you like Taylor Swift?”


    Mandy presses her hands over her heart. “I love her.”


    “Good,” I say. “Then you’ll like the playlist.”


    “I don’t care what music you play,” Luke says, “so long as Jessica Rabbit’s going
    to be here.”


    “Actually,” I say regretfully, “Jessica doesn’t attend the class, she teaches
    it. She’s the one I’ll be subbing for off and on.”


    “What?” Luke whines. “She’s the only reason I agreed to come.”


    Liam swats him on the back of the head. “You agreed to come because that’s what
    we do—we show up for family.”


    “Yeah,” Braxton says. “Besides, you know this is just a practice class; it’ll
    only be us.”


    “So there won’t be any women?” Luke shakes his head.


    I pull an apologetic grin. “Not unless we have a few randos show up.”

