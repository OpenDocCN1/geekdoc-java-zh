    ## Maggie


    It takes everything in me to pay attention to the storytellers on the stage. I’m
    seated beside Braxton, whose work boot barely grazes the side of my shoe. The
    energy that urged us on hours ago is still revving hot.


    I crossed half-a-dozen things off my to-do list while waiting for tonight’s event,
    but throughout it all, I couldn’t stop thinking about the slightly rough feel
    of his fingertips on my neck. That confident, bad-boy gleam in his eye, and the
    blazing heat that replaced that gleam when his gaze dropped to my mouth.


    I barely closed my eyes in time to take in the bliss. Bliss that still races through
    me at the memory alone. I haven’t exactly looked at Braxton since I sat down beside
    him, but I can feel him daring me to in his spot beside me.


    “Let’s give these guys a hand, everyone,” JJ says, gaining my attention and letting
    me know that I missed the couple’s story completely.


    I fight off a wave of embarrassment as Brinley and Mason take their seats to my
    left. “Good job,” I say.


    Brinley grins. “Thanks. Good luck!”


    “Now, let’s welcome our final couple of the night. This pair really caused a ruckus
    last week. You know who I’m talking about, let’s hear it for Braxton and Maggie.”


    Oh, my gosh. What in the world am I going to say this time? I’ve been so distracted
    by thoughts of Braxton’s kiss that I haven’t even considered it.


    Braxton’s arm brushes mine as he comes to a stand. He offers me his hand and leans
    close to my ear. “Beau and Kirsten just walked in,” he says under his breath while
    pulling me to my feet. “It’s their fault we’re up here. I say we use their story
    to get us through. What do you think?”


    I glance over to see Kirsten grinning widely at me in excitement. Beau helps her
    remove her coat, and the two take comfortable seats in the crowd. I move my gaze
    back to Braxton and give him a nod. It’s genius!


    “Great idea,” I say, relief flooding over me.


    “Nice to see you up here again,” JJ says. “This time, we’ll let Braxton take the
    lead.”


    A hush settles over the crowd. “Once upon a time…” the says theatrically, then
    hands the mic over to Braxton.


    He lifts the mic to his mouth. “There was a man named Braxton who was married
    to a woman who loved nice things. They had a son named Peter, who was very good
    at soccer. One day, Peter and a fellow teammate started to notice something odd
    between Peter’s mom and the teammate’s dad.”


    Oohs and ahs sound over the crowd. Kirsten’s eyes go wide in surprise. Beau looks
    more amused than anything. A half smile appears on his face while he shakes his
    head. Touche, he says without saying it.


    This time, as I hand the mic over to Braxton, I enjoy the sense of camaraderie.
    He gives me an approving smile.

