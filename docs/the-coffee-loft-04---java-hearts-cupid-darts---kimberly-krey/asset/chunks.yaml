    我轻吻了他的每一个指节，然后将他的拳头紧紧抱在胸前，叹了口气。“我没有比你更想和你度过这一天了。”希望他也有同感。


    ![](img/image_rsrc2A3.jpg)


    ## 布莱克斯顿


    我穿着一套新合体的燕尾服从试衣间出来，检查着裤脚的长度。


    “天哪，你太帅了，儿子！”玛丽亚尖叫着朝我冲走来，脖子上还挂着卷尺。


    “谢谢，亲爱的玛丽亚，”我说，“你工作得很完美。”


    玛丽亚脸红了，拍了拍我的手臂。“你知道我最吃你讲我母语这一套。”


    “我恐怕那是我唯一认识的几个词了，”我承认道。我和我的家人从小就经常来玛丽亚的西装和礼服店。她声称惠尔顿家的男们是她的宠儿，但我怀疑她让每一位顾客都产生了这种感觉。玛丽亚在这方面很特别。


    她撇起嘴角审视了我一眼，然后拉了拉我的袖口，调整了领口，最后向后退了一步再次打量我。


    “弯起手臂。”


    我做了。


    “向两侧紧绷肌肉。”


    我也做了。


    她拉了拉我的西装外套，笑了起来。“好了，放松。完美（Perfecto）。非常帅。”


    “谢谢你，美丽的朋友，”我点头回答道。


    当我结账时，玛丽亚问起我的兄弟们，说除了卢克以外，其他人都来取他们参加即将举行的纪念日派对的西装了。


    “所以你和博是唯一两个要把西装留到情人节的人。这意味着你和某个特别的人也有约会了？”


    “是的。她叫玛吉。她美丽、聪明、有野心……”我叹了口气，在承认自己对她有多疯狂时，感到脸发烫。“她也很有趣，坚强且坚韧。”


    玛丽亚打印出收据递给我。“听起来你可能有点喜欢她。”


    “是，”我笑着说，“我不知你多久去一次海边步道，但她在那里拥有一家店‘咖啡阁楼’。你知道吗，就是那个旧火车站？”


    “我知道那个。增加了火车车厢的那个？”


    我知道自己现在笑得像个傻瓜一样，但我控制不住。我为玛吉和她的成就感到无比自豪。“现在有两节车厢了。我翻新了第二个尾机车。我们就是那样相的。”


    玛丽亚拍了拍手。“真为你感到高兴，布莱克斯顿。”


    我告诉她那些故事讲述活动、在里士满德的约会奖品，还有我为情人节抢到的门票——一次让玛吉难忘的晚餐巡游体验。


    “太神奇了，”玛丽亚说。


    “如果你来参加纪念日派对，”我说，“我会把她介绍给你。”


    “噢，我会去的，”她保证道，“我很期待。”她捏了捏我的脸颊。“玛吉是个幸运的女人。”


    我露笑了。“谢谢。而我是个幸运的男人。”


    # 19


    ![](img/image_rsrc2A2.jpg)


    ## 玛吉


    纪念日派对终于到了。布莱克斯顿的父母结婚了四十五年了！在这样的派对上，我无法移开对这对夫妇的视线。


    “你知道我一直不明白什么，”布莱克斯顿严肃地说道，“‘天空是极限（Sky’s the limit）’。到底是什么意思？”


    我摇了摇头，然后想起了布莱克斯顿告诉我的他与布莱恩之间的特殊交流。


    我说这句话时，我的心微微颤动。“那就像……无限的可能。”


    他笑得像我掉进了他的陷阱。“这就是我们拥有的，”他期待地看着我。


    我咽了口唾水，一半是被这种感的情的情融化，一半是有些敬畏。突然，我想起他们两人以前会一起说这句话。“你是对的，”我会意地点头道。当我再次开口时，他跟着我的节奏，这让我松了一口气。


    “天空是极限，宝贝，”我们齐声说道。


    布莱克斯顿将我拉入怀中。我们分享了一些无法解释的东西。某种亲密而神圣的东西。他信任我，我也信任他。比我信任过的任何男人都要多。


    “那么，我们打算什么时候让这段关系正式化？”布莱克斯顿用鼻尖沿着我的太阳穴滑动，让热的呼吸弄着我的皮肤。


    我的手臂起了一层鸡皮疙瘩，让我笑了起来。我转过头捕捉他的目光，被他眼中那顽皮的光芒令着不已。


    期待在我的胃里升起。他会问我做他的女朋友的，我知道。


