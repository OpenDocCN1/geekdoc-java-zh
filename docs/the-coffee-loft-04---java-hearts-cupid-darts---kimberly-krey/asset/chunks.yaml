    不，玛姬，我对自己说。我拒绝消沉。我决定要保持希望，弄明白这场名为“爱”的游戏，并找到我正在寻找的东西。他就在某个地方，我很确信他的牙还没掉光。。


    既然情人节只剩下短短五十天了，我觉得现在是认真的完美时机。这与我即将迎来三十大生日无关，也与我所有的高中朋友在多年前就结婚、并正式把手提包换成尿布包的事实无关。


    完全没有关系。


    没有时钟在滴答作响。


    也没有内心声音在尖叫，如果我不认真对待，我余生可能都会形单影只。


    “好了，”教练在音乐声中大声喊道，“我们上雪道吧。双板滑雪，膝盖弯曲，在蹦床上每次旋转时手肘向后。你们可以的！”


    我尽力做出我的滑雪动作，收紧核心力量，握紧拳头，并下定了要在寻找真挚持久爱情时，无论生理还是心理上都处于最佳状态的决心。


    课程结束后，我向教练表示感谢，她被镇上四十多岁的单身人士戏称为“杰西卡·兔兔”。我是在咖啡馆在我们新的火车车厢扩建举办聚会时认识她——顺便说一下，这次活动非常成功。杰西卡非常漂亮、野心勃勃，而且聪明。尽管她留下了一段失败的婚姻，但她是很快乐的。


    课后我们简短聊了聊。我问她销售情况如何——非常好，她问尽管圣诞节已经过了我们是否还有��形花拿铁咖啡——有的。


    “事实上，”我说，“我们将那款产品一直保留到一月三号。”


    “很不错，”杰西卡说，“回头见。”


    在回家的路上，松松的雪花盘旋着飘落在泥泞的地面上。我享受着这种景象；在这里，雪花很少积聚到可以让人抓起来揉成雪球的程度。事实上，只要太阳一出云层，那些轻如羽毛的雪花就会融化、汽化，或者对那些可怜的小东西发生什么。


    我叹了口气，感觉到一种熟悉的悲伤正从胸口中涌来。小时候，我把那种空虚感称为我的“心洞”。直到今天，这仍是我能解释它的最好方式。那种感觉就像我的心脏中心有一个真空驱动的深坑，准备好在我的梦想成型之前将它们吞噬。


    没过多久，我就明白了为什么那个洞正试图再次裂开。这与我举办的那场单身活动有关。我见到了许多当地四十多岁的单身人士；有些人从未结过婚，大多数人已经离婚，而且都仍在寻找爱情。遗憾的是，我的姐姐基斯汀也在他们之中，作为该小组中新入伍的离婚女性。


    我们母亲总是说，她很高兴格雷格和基斯汀提供了一个爱情样子的健康榜范，因为她和我父亲“失败得惨不忍睹”。我没有对此争论。


    基斯汀和格雷格拥有一切。我从未猜到格雷格会通过背叛我的姐姐来毁一切，顺便说一下，我的姐姐是世界上最优秀、最美丽的人之一。


    格雷格背叛了我世界上最喜爱的两个人——我的姐姐和我的侄子。他背叛了每一个爱并信任他的人。我曾指望他们能战胜概率，成为那些留下的人。

    '
- fmt: '

    Kirsten sighs heavily. As her little sister, I’ve been the cause of that sigh
    more times than I can count. “Okay, I’ll let you go. But if Braxton takes the
    job, and you guys fall for each other that way, it will be totally organic, and
    I don’t want you to be closed off to the opportunity, okay? Goodbye.” She disconnects
    before I can argue.


    “Bye,” I say as I shut off the engine.


    Every time I step out of my adorable, sunshine yellow Jeep Renegade, whose name
    is `Sunny`, by the way, I must admire her for at least sixty seconds. I love this
    car, and I worked very hard to get her.


    I lift my nose to inhale the salty ocean breeze as the waves gurgle and whoosh
    in the distance. It’s well past high tide this morning, and the sun is already
    making a show. Soon, the ground will be mostly dry. That’s not to say it’s warm.
    It is cold. Cold enough to make me shiver all the way to the door. It’ll get increasingly
    colder in January before temps slowly start to rise. By March, we begin seeing
    diehards show up to surf in their wetsuits.


    I inhale deeper as I note the shift in the air, that rich aroma of fresh brew
    delighting my senses and, hopefully, enticing passersby. It grows infinitely stronger
    as I pull open the door and step into the warmth and comfort of my shop.


    If admiring `Sunny` takes at least sixty seconds, admiring my dream of a coffee
    shop takes much longer. Customers curl into the cozy couches by the fireplace.
    Some huddle up to the counter, loosening coats, clutching gift cards, and eyeing
    the massive chalkboard menu. Others are scattered throughout the upper and lower
    dining areas, tipping back mugs or inhaling the heavenly steam floating over their
    faces.


    Many online reviewers say the Coffee Loft is their home away from home, and I
    couldn’t agree more. It might be my workplace, but the homey, laid-back environment
    makes most workdays a joy.


    My gaze drifts to the vaulted ceiling beside the loft, which, I’m told, used to
    be an overwatch of sorts for the old train station. There, hanging beautifully
    and boldly along that great wall, is the banner for `Cupid Darts`. The cover is
    bright white with shadowy Cupids in faded black—bows drawn—arrows ready.


    At the center of the image is a shiny, crimson heart, an arrow piercing its center.
    It’s a mix between a love heart found on cards and such and a three-dimensional
    human heart you might see beating in one’s chest. There’s an artistic trick at
    play, one that makes it look like the heart is beating. With the slightest tip
    of my head or shift of my gaze, the bottom chamber seems to contract while the
    upper portion swells on one side.


    Glossy blood oozes down the exposed arrow tip, dripping to dot the i of the title
    with a delicate splotch. `Cupid Darts` is scrawled in matching red; the font,
    intricate and dainty.


    It gives the impression that the tiny matchmakers sneak up on people who don’t
    even expect it.


    Huh, I muse. I don’t know about that. I suppose it’s possible that some single,
    as in never-been-married women my age, aren’t looking for love, but I dare say
    that most of us are, and the ones who say they’re not are only lying to themselves.


    ### The Vision of Love


    Three things run through my mind: First, how I would handle the situation if I
    actually fell for someone. Second, whether I’m even ready for a relationship.
    And third, what `Cupid Darts` truly represents for my life.

    '
