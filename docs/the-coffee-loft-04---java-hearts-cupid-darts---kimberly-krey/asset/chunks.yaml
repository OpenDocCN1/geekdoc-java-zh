    我转过身靠在柜台上，面对玛吉，她的手松散地搭在未爆爆的玉米花罐子上。我想听听更多关于她的过去。我想知道，在经历了那样混乱的童年后，凯斯汀和玛吉是如何变得这么好的。


    “那时候你爸爸在身边吗？”我问道。


    玛吉摇了摇头。“几乎没有。他们两个人的性格都很极端，所以感觉就像是被两只松鼠养大的。他们不是一个留守而另一个出去觅食，而是会零星地闯入又离开我们的生活，连续出现几个月，然后消失几天甚至几周。有时候聚在一起，大多数时候是分开的。我妈妈坚称人应该是自由的，为人父母不应该是对人的囚禁。”


    我缩了缩脖。“囚禁？”


    “没错。我听说她在和凯斯汀在一起的前头几年确实很享受当妈妈的。但那并没有持续多久。等到我出生的时候……我只能说，如果不是因为凯斯汀，我不知道自己会在哪儿。”


    她的故事触了我脑海中一个挥之不去的忧虑。那是我一直试图掩埋的。“我很遗憾你们必须经历那些。”


    她抬头看向我。“我很遗憾你失去了你的弟弟，布莱恩。听起来他是个很有野心且很善良的人。”


    “他确实如此，”我向她保证。“我们以前有个习惯。有一次我问他`sky’s the limit`（行无不利）这个词是什么意思。他告诉我，这描述的是一种没有尽头的潜力。从那时起，当他或我觉得这句话很合适时，我们就会问：‘天空极限是什么意思？’另一个人就会说‘无限的潜力’。然后，我们会面面彼此，齐声说出来，大声而自豪：‘一切皆有可能，宝贝！’”


    玛吉吸了吸鼻子。“我喜欢那个。”


    “有时候，”我补充道，“如果我处于一个我知道他也会欣赏的时刻，比如爬上了一处很好的徒步路线的山顶，我会发现自己极想说出这句话，但我忍了。如果没有另一个人在那里接话，那种感觉就不对劲。”


    她笑着，同时在擦去眼角的泪水。那些泪水显示出她是多么富有同情。尽管她受过伤。尽管她不得不在心中筑起层层保护，玛吉依然能感受到深层的情感。我喜欢这一点。


    “我希望能见到他，”她说。


    我点头。“我也是。我喜欢向别人谈起他。在某种意义上，这让他保持活着。”


    玛吉凝视着我的眼睛让我的心跳加速，胃部感到暖意。在这种光线下，她的榛果色眼睛看起来那么不真实。金黄色、琥珀色和绿色的星星交织成复杂的图案，我可以凝视一整天。我意识到，我真的可能会爱上这个女人。很久以来第一次，这个念头并没有让我感到恐惧。


    当我年轻的时候，我总是陷得很快很深。我喜欢恋爱的感觉，或者说我以为那是爱情的感觉。但在布莱恩去世后，这一切感觉都太……危险了。再加上我们家里的一系列离婚，我想和一个女人建立认真关系的渴望几乎消失殆尽。直到现在我才向自己承认，博的担心是有道理的。我确实心有戒备。或者说，我曾经如此。而玛吉似乎找到了开启我心中那个不可触之地的钥匙。


    ### 制作爆米花


    很快，爆米花爆开了，黄油融化了，棕糖和玉米糖浆也融进了其中。那气味就像玛吉和我之间涌动的化学反应一样迷人。


    我无无赖地搅拌着混合物，然后抬头看向她。“开始冒泡了。”


    她笑了。“完美。什么时候说加小苏打的？”


    “离火后，在倒进玉米粒之前。”焦糖现在真的剧烈沸腾起来，接近锅缘。


    我加快了搅拌的速度。“噢，不，也许你关于用大锅的建议是对的。”


    她看了一眼装着爆米花的大锅，然后将目光移回焦糖上。“希望没问题。”


    我们计时记录炖煮的过程，然后关掉火，小心地将沸腾的混合物移到台面上。“还好我们只剩下小苏打和香草了，”她说，“别的什么都放不进那个锅里。”


    “真的。”我量了香草，并在她搅拌时加了。“现在加一茶匙小苏打，”我说，接着把那个倒进焦糖里。


    她将那小部分小苏打搅拌进混合物中，突然，它变成了一种泡沫密集的生命力。它升得越高，越过了边缘，就像一杯泡沫丰富的根啤酒上面的沫，一直延伸到锅缘之外并继续膨胀。岩浆般的块状从边缘溢出，顺着锅壁滑落。


    “噢，不，它疯了，”她笑着说道。


    “快……”我伸手去盛满爆米花的锅。“我把这个放在它下面。”


    她高举起锅，我举起爆米花容器让它刚好在下方。


    “我不认为这是我们应该添加它的方式，”她说，焦糖继续堆积，并以泡沫块溢过边缘。


    “嘿，”我说，“如果管用，管用就行。现在开始倒吧，我去拿那个铲子……我们把它丢在哪儿了？”


    她用双手握住锅柄，向肩后看了一眼并点了点头。“在那儿。炉子旁边。”


    但由于我们的两个锅都悬空着，我暂时还不能离开。


    ### 晚餐邀请


    厨房旁边旁有一间视野极佳的餐厅。餐桌布置得精美；唯一缺的是食物。格特汀和吉负责这些，摆放了意大利烩饭、烤蔬菜和搭配鸡肉的荷兰酱。


    就在门声响起时，计时器响了。


    “晚餐时间到了，”格特汀大喊道。


    “看看你们的食物比我们的怎么样，”吉发出一阵狂魔般的笑声补充道。'
