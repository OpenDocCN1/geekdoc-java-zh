    # 致谢


    我想向我出色的故事编辑 Valerie Bybee 表以诚挚的感谢。你敏锐的洞察力指出了那些可能被忽视的问题。你让我的每一本书都变得更好，对此非常感谢。


    我还想非常感谢我的文字编辑 Brievelle。我非常感谢你的辛勤和灵活性。与你合作非常愉快。


    最后，我想感谢 Alice 分享了她在校对编辑方面的技能！我非常感激你！


    此外，感谢我的 ARC（提前试读）团队。我在《Java 之心》中第一次与你们中的许多人“相遇”，我希望能再次与你们合作！真是一支很棒的团队！感谢你们愿意阅读、评论，并在一路上发来鼓励我的信息。你们太棒了。谢谢！


