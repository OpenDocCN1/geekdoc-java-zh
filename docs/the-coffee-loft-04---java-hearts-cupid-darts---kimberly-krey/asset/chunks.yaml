    这节旧守尾车厢里的瞭望塔是独一无二的。它是我改造模型展示中最大的卖点之一。车厢远端的上半部分被中间的一条过道隔开。短梯通向两个独立的隔间，里面有浅浅的卡座式座椅，四周都是窗户。当这台小家伙还在轨道上运行时，机车组人员会坐在上层，眼睛紧盯着前方的轨道。然后，他们只需用力拉拉绳子，就能提醒驾驶员注意潜在的危险。


    现在，这个区域将成为全屋黄金位置的座位。额外的空间每边可以坐四个人，中心放着一张小圆桌。我没有保留原有的水桶椅，而是设计了一个像餐馆卡座一样的圆形休息区，只在梯子允许进出的地方开放。


    这样，客人们可以滑进座位，完美地欣赏日出时海浪拍击的壮景。在另一侧，顾客可以观察拥挤的码头，那里悬挂着灯光，飞翔着羽毛朋友们。晚上，他们可以欣赏屹立高耸、坚毅的灯塔，它稳定的光芒引导着船只回到浪花的岸边。


    木工对我来说是一门艺术，我很庆幸放弃了全职造房子，转而去做我最喜欢的事情。我对某些特殊工作的着迷，就像我对某些女性着迷一样——那些在让我兴奋的同时又充满挑战性的人。


    当然，发现我的新年约会对象竟然结婚了——那可不是我想要的挑战。那简直是浪费时间。我本应该接受柯斯汀的邀请去她家的。但不，我想让玛姬知道我的假期有更正经的事要做。老天，这结果真是适得其反吧？


    脑海中浮现出玛姬的形象。那个活泼的红头发可能会挑战我，但她绝对没有让我感到兴奋。


    然而，当我想到她时，腹部处掠起一丝微弱的热度。好吧，她很有魅力。而且很迷人；这点我承认。我佩服她获得属于自己的`Coffee Loft`特许经营权。此外，她很有眼光；那座老火是个宝贝，由于前任所有者让那里荒废，我听闻她是超低价买下的。


    尽管如此，柯斯汀的妹妹是个固执又骄傲的小家伙。当我指出`Nobly`的工作缺陷和粗糙的偷工行为时，没多久就惹恼了她。她甚至没法放下自尊心来告诉我她有多喜欢我构思的那些设计。


    当然，她每天来时都穿得光鲜亮丽，半休闲装。那个娇小的红头发女孩在狭窄的工作空间里穿行，在检查我的工作时，小心地避开散落的工具和几天的垃圾以免绊倒。她会对我说那几句赞美，并不算慷慨，在离开之前，她会请我喝一杯我喜欢的咖啡，我乐意接受了。


    大多数时候，我回得非常少，而这并不难。


    上周和兄弟们一起吃午饭时，我声称玛姬不是我的菜。但在很多方面，那个野心勃勃的红头发女孩正是我的菜。她身材好，漂亮，还有那种让我不由自主被吸引的犀利劲。而且别忘记那种化学反应。它是生生勃的。当玛姬用那双琥珀色的眼睛看着我，眼中充满了几乎无法掩饰的烦躁和对我的鄙视——我渴望点燃其他的感情。我想象一个男人必须得拼命努力才能获得她的认可。她很难追，这也是为什么还没有人搞定她。


    如果她不是柯斯汀的妹妹，我可能这周已经试探过水了，看看能否打破她那层冰冷的外壳，找出她的想法。但现在，我们周围这种肥皂剧般的处境——柯斯汀催促我，而`Beau`坚持让我远离她——让我只能安分守职。干完活就走吧，`Braxton`。


    当我正在钉好屋顶最后一块弯木板时，手机震动了一下。我把锤子滑回腰带，拿起手机；反正我也想看看时间。天快黑了。我点点屏幕看新短信。


    `Beau`: 你快结束了吗？如果是的话，离开前顺道来趟主店。我和柯斯汀在这，我为你点了饮料。尚特说她知道你喜欢什么。


    她确实知道，我朝主店看了一眼。我刚到这里就喝了咖啡，计划在出发前再来一杯。当我整天闻着那股气味时，很难不渴望。烘焙咖啡豆浓郁独特的香气，结合新鲜木材的迷人芬芳，让这份工作比大多数时候都要好。


    `Braxton`: 好了，哥们，谢了。一会儿见。


    我收拾好当天的东西；因为完成了出色的工作而感到自豪，口水因为那杯泡沫卡布奇诺而流口水。我对今天完成的工作感到很棒，知道回家路上有一杯不错的饮料可以暖身体，感觉更好。如果我快点，就能赶上比赛的下半场。倒不是说现在`海鹰队`落后了我就有多么投入感情。


    停车场比平时还要拥挤。汽车排在路边，从`Coffee Loft`一直延伸到视线所及。我一推开入口门，就感受到了拥挤空间的人潮能量。我低着头，穿过拥挤的人群。

