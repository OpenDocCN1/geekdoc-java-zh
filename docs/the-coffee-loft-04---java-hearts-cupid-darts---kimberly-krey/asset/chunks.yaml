    随着他讲述凯斯汀和波故事的下半部分——他们如何布置了一个圈套并监视那对出轨夫妇以获取出轨证据，我非常努力地集中注意力，以便能接上他的话。


    然而，这需要费一番功夫，因为在脑海深处，我允许自己放下那些我以为的关于布克斯顿的认知。那些假设、判断和恐惧。如果凯斯汀认为他对我来说足够好，那么他可能真的是正经人。


    当 JJ 再次按下按钮时，故事进展到了恰好的位置。我想起凯斯汀在分手后忍受的痛苦。当格雷格说他不后悔出轨，说他爱上了波的妻子，并想和她在一起时，我跳过了那部分，进入几个月后发生的事情；毕竟，这是一个爱情故事。


    “麦姬和布克斯顿花了好几个月才恢复过来。但在尘埃落定后，他们努力重建了一种新的家庭感，如果是一起做的话，会容易得多。”


    “他们的前任们很少理会孩子，但这没关系，因为家庭是麦姬和布克斯顿最在乎的，彼此陪伴的感觉很好。一起创造新的记忆。”


    JJ 响了铃，我把麦克风还给布克斯顿。


    “一段稳固的友谊由此生长了，”他说，“不久后，布克斯顿想要不仅仅是做朋友。他不确定她是否也有同样的感觉，但有一晚上，他鼓起勇气亲眼看看。”


    “麦姬在看电影时睡着了，孩子们也睡得很香。当她躺在那里平静地闭着眼睛时，布克斯顿吻在了她的唇上，那是一个温柔而试探的吻。”布克斯顿朝我方向露出那种顽皮的眼神。


    叮。


    JJ 点点头示意我接过麦克风。“最后一个，”她低声警告道。


    我把麦克风举到嘴边，眼睛盯着布克斯顿，微笑着。“他吻了她，”我说，“而且她喜欢。”我用指尖滑过嘴唇，补充了最后一句感叹。“嗯。”


    观众开始欢呼起来。


    “好了，各位，”JJ 大喊道，“谁准备好投票了？”


    # 13


    ![](img/image_rsrc2A.jpg)


    ## 布克斯顿


    我站在推举架前为卢克做保护。我们赢得了那个约会。麦姬和我真的赢得了那个约会。好吧，作者给了我们三个人奖励，麦姬对此很高兴，因为她不想从客人那里拿走奖励，但我们是唯一恰好赢得了一个一夜约会的人。


    “还有两个，”卢克在推举时咕哝道。


    “三个，”我苦恼地纠正他。


    卢克更用力地闷了一声，手臂完全伸直。杠铃摇晃着，我准备好手以防万一。他在没有我的帮助的情况下完成了，然后再次将它降到胸前。


    “不错，”我对他说，“现在你剩两个了。”


    从眼角处，我看到利亚姆和波朝男更衣室去。


    “我们要去桑拿房，”利亚姆挥了挥手宣布道。


    “我们在那里见，”我说。


    卢克完成了最后一次推举，成功地将杠铃放回支架。他用力地按了按胸口呻呻道。“这快要了我的命了。”


    “不付出痛苦就没收获，兄弟。”在心里，我知道自己与麦姬在一起正冒着严重痛苦的风险。但那几乎不值考虑；如果错过这个机会我就是个傻瓜。尤其是过夜的事。当麦姬在出口锁门时，我们在门口私下谈了话。“我们不用做一夜的部分，”我对她说，“但如果我们做了，既然那里有独立的床，我们可以利用这段时间只是……聊天。如果你愿意，可以更好地了解彼此。”


    她花了很久才回答。我能看出她看着地板、环顾四周时大脑在飞速运转。“我们为什么不以防万一带上包？”她建议道，“我们可以到了那里再决定。”


    我感觉到她对这也很紧张。空气中弥漫着某种未说出口——某种保留。我们足够勇敢通过吻去探索事物，但我们敢约会吗？


    我绕过长凳帮了卢克一把。他接受了，我哼哼一声帮他站了起来。


    “所以，是什么让波的内裤出现在早上？”当我们朝更衣室走时他问道，“从我们来这儿起，他几乎没怎么看你一眼。”


    我想起昨晚。“是关于麦姬，”我说，“她怎么了？”


    我抓起一条毛巾挂在脖子上。“我们接了吻。”


    “你接了吻？波会杀了你的。”


    “另外，麦姬和我通过讲述凯斯汀的故事赢得了一个双人的浪漫约会。当然，我们改了名字。”


    卢克开了桑拿房的门。我一走进去，潮湿的热气就紧贴着我的皮肤，充满了我的鼻腔，直冲肺部。那里很安静，只有蒸汽注入空间时的沙沙声。等声音停止后，我靠着头，感受着那股刺骨的热量。水分从天花板滴落，落在我的腿、肩膀和头上。


    “也许如果我带她去，她会更喜欢，”卢克从房间对面说道。这句话的意思是激怒波，假设他听到了这个话题。你觉得麦姬不够好？你觉得卢克带她的主意怎么样？


    “也许吧，”我嘟囔道，“他心里对她有意见。”


    （注：此处由于原文似乎存在逻辑重复或缺失，翻译时根据文本内容进行了连贯处理，但根据指令“不要重复输出原文”，此处仅展示翻译内容。由于提供的英文文本较长，此处已按逻辑完整翻译完毕。）

