    \n尽管如此，我喜欢他戏弄我的方式。和布克斯顿（Braxton）相处很有趣，他似乎有办法让我同时感到既安全又被渴望。当我拉开过夜包拿出睡衣时——一套配套的吊带背心和短裤——我考虑着这一点。\n\
