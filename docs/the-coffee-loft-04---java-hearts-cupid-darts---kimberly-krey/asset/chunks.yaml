    I instruct everyone to step onto their tramps and warm up by shifting their weight
    from one foot to the next. Just as I’m about to cue the music, three stragglers
    hurry in. My nephew, Jack, leads Beau’s kids, Parker and Paige, into the studio,
    where they each set down their bags, remove their jackets, and take tramps of
    their own.


    Paige goes up front by Mandy with a wide grin. “Hi, Grandma and Grandpa. Hi, Maggie.”
    She waves at each of us in turn.


    I grin back. “Hi, sweetheart! Thanks for coming.”


    Jack reveals that crooked smile of his as he shoots me a peace sign. He and Parker
    take the tramps in back, pushing one another off balance with outstretched arms.


    I watch Kirsten and Beau exchange a look that says they’re pleased the boys came.
    It must feel good to be raising such great kids. I can’t help but take a little
    credit for how well Jack is turning out, too, since I’ve played a big part in
    his life.


    I have an incredible playlist; one that will have Paige singing her little heart
    out, I hope. I adjust my headset, ready to get things started, when I’m struck
    by the sight before me.


    Bouncing on mini trampolines throughout the studio is a group of people who are
    here for me. Showing support in this silly side venture of subbing for a workout
    class from time to time. Giving me a good practice round with a live, active group.


    It’s nothing major, but they showed up. And what had Liam said to Luke? We show
    up for family. Braxton and I have been dating for three months now, and while
    we haven’t exactly made wedding plans, the Wheaton family has embraced me like
    one of their own just like they did with Kirsten.


    A rush of warmth gathers in my chest like a warm heart hug; something that happens
    quite often, thanks to Braxton. In fact, those heart hugs seem to have effectively
    patched up the hole. Layer upon layer, putting me at ease. Allowing me to be vulnerable
    despite the risk. Allowing me to love him, though I haven’t exactly uttered the
    words. But I do love him, I realize.


    Kirsten’s words of advice play through my mind—‘Once you have that first realization…tell
    him right then and there, no matter where you are.’


    ‘I will,’ I had promised.


    My gaze shifts to Braxton as my emotions swell. He holds my gaze, and suddenly
    a hint of concern sparks in his eye.


    “You okay?” he asks. “Do you need anything?”


    I shake my head, not sure why he’s asking until it hits me; he’s reading the emotion
    on my face. I grin at him. “These are good feels,” I say.


    He tips his head back and gives me a thumbs up. “Gotcha. Good. You’ve got this,
    babe!”


    I think of the title of the song I’m about to play—Ready For It?` It reminds me
    of the day I first met Braxton, and of everything we’ve been through since. Anticipation
    stirs deep within me. Yes, I realize, answering the question in my mind. I most
    definitely am.


    “Actually,” I say, the urgency beginning to gnaw at me. “Come here.” I motion
    for Braxton to meet me at the front of the room.


    He hops off his trampoline and hurries up to me.


    “Yeah?”


    We’re face to face now, and the love I feel for him multiplies as I form the words
    in my head.


    “Braxton?”


    He nods. “Yes?”


    I wrap my arms around him and move my lips to his ear. “I love you.”


    He pulls back to look in my eyes. “You said it,” he breathes, sounding shocked.


    I laugh a little.


    “She said what?” Collin asks.


    “Maggie said she loves me, Pops.”


    “We actually heard it through the headset mic,” Liam admits.


    “I didn’t,” Collin grumbles.


    “Of course she does,” Mandy says. “Who couldn’t love you?”


    “I sometimes don’t,” Luke says.


    “Dude,” Beau hollers. “Did you say it back?”


    Braxton turns to face me. “It’s been a while, but I’ve been dying to say it again
    for a long time.”


    “Then say it!” Paige hollers while bouncing excitedly on her tramp.


    “Yeah,” Mandy says. “What are you waiting for?”


    Braxton chuckles and takes my hands. “I love you, Maggie Modella, and it only
    grows stronger every day.”


    And just like that, I’m getting another heart hug, so full and thorough I feel
    like I could cry with the joy it brings.


    Braxton rushes in to kiss me, then mumbles against my lips, “I knew you were falling
    for me.” He kisses the tip of my nose. “Really, though, I think you just made
    me the happiest man alive.”


    He takes a few steps back and releases my hands. His shoulders are higher, his
    chest broader. It’s a glimpse of that peacock pride, but this time, I’m playing
    a part in it. He’s proud that he’s loved by me, and I like that more than I can
    say.


    “Now,” he says as he hops back onto his tramp. “Let’s see what you’ve got.”


    Suddenly, the door swings open, and a woman pops her head in. She’s blonde, beautiful,
    and curvy. “Do you have room for one more?”


    “You bet we do,” Luke answers, moving from the other edge to make room for her.


    “Great,” she says, then motions into the room with the wave of her arm. “Go ahead.”


    My eyes widen as I see who strides in.

