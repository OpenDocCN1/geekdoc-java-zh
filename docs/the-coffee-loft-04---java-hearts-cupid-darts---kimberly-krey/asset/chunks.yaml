    “科林·惠特是个纯汉。他靠修车维持生计，爱好是改装经典机型，而且满口得像水手一样粗鲁。他的借口是在海军服役过一段时间，但在我妈妈面前他很少骂人，这让他也显得像个绅士。他是我们所有男孩子的良好榜样。”


    我感到一阵暖意。我喜欢知道布克斯顿钦佩父亲的这些特质。知道他生命中有过那样的榜样，一个他仰慕的人。


    我的思绪飘到了他清单上的最后一项。“那狗粪呢？你不想让它弄得你们的社区看起来很脏吗？”我猜他耸了耸肩。


    “不，不是因为那个。租这间房子的老头——他叫马丁——身体不方便带狗出去散步，所以他就让它在前院里泄便、发泄精力。院子当然是有围栏的，所以它跑不出去。总之，几个月前，我无意他的房东——那是个真正的变态——威胁说，如果他不把草地上的狗粪清理干净，就赶走他。”


    “但他身体不方便做那个？”我问。


    “他试过。我见过他一次在清理她留下的垃圾时摔了个狗啃。所以我问我能不能帮忙。我没法遛那小东西，因为它是一只乱叫且讨厌我的吉娃娃，所以我基本上就是带着一把园艺铲子过去，把它们全铲进土里。”


    我考虑了片刻，对一个关于狗粪的故事竟然让我深受触动感到好笑。但确实如此。噢，确实是如此。“那真是一个巨大的牺牲。”


    他耸了耸肩。“最多只要两分钟。但对马丁和马菲来说，意义非凡。”


    “马菲？”我重复道。


    “那只狗。”


    我笑了。“我打赌确实很有意义。”


    不知不觉，我们已经驶入了一个看起来像食物分发中心的停车场。我们按照日期卡上的指示进入了一间厨房，迎接我们的是一对穿着白色大褂、戴着帽子的专业厨师。


    “我是格特鲁德，”那个长相圆润丰胖、口音浓重的女人说道。


    她旁边的灰发男人接着说道。“我是吉尔。今晚，我们将亲手为你们准备一顿美味的大餐。”


    但身边的女人拍了拍他的手臂。“不，亲爱的，我们今晚不是唯一的厨师。”


    “不？”吉尔露出了一个夸张的惊恐表情。


    “记得吗？其中两道菜将由……”格特鲁德话没说完，朝我们方向点了点头。


    吉尔开始用双手交替揉搓他长长的灰色山羊胡。“我们是专业人士。你们不是说他们要……”


    “我就是这个意思。”


    吉尔摇头抗议。“他们不能……”


    “但他们必须做。他们必须承担部分工作来换取他们的食物。”格特鲁德用下巴指着我。“那个红头发的女孩。”


    我轻笑了一下。“怎么？”


    “过来。”她带我来到他们身后的一张遮盖着的桌旁。随着两声清脆的响指，吉尔赶忙走过来，抓住桌布垂下的边缘，动作利落地地将其拽掉。七个棕色纸袋均匀地铺在上面。


    “选一个袋，你这小家伙，”吉尔说。“不管里面是什么，准备它都是你的任务。”


    布克斯顿轻声笑了起来，把手放在我的腰后，向我保证我并不孤单。


    我凝视着袋子中最小的一个。


    吉尔顺着我的目光。“她想要这一窝里最小的，因为她也是最小的。”


    现在，随着布克斯顿再次轻笑，我也加入了进来。


    “是的，”我确认道。“我要那个，请。”


    吉尔的肩膀垮了下来。“我想要做那一个。行吧，行吧。大小子又要选哪一个，嗯？你这个满手伤痕、手臂粗壮的。”


    “我当然要选最大的那个，”布克斯顿洪声说道。


    格特鲁德咯咯笑着揉了搓手。“那是最难的一个。我想你会后悔的。”


    “拿上你们的食物走吧，”吉尔挥了挥手。“你们的厨房在楼上，我们两小时后会给你们上七道菜。瞧，有四份；我们在这里自己约会。所以……我们会做好自己的份。你们可别搞砸了。”


    我们迅速拿起纸袋，走上那段高窄的楼梯。主楼层的厨房更具工业风，配有各种炉灶、冰箱和烹饪区，而这间厨房则感觉更像家。


    “我真不敢相信我们还要做他们的食物，”我说。“压力可真大了。”


    “你说得对。”布克斯顿是第一个打开他的东西。“蓝纹奶培根卷？”他听起来很惊讶。


    “噢，”我说，“那会很好吃的。”


    “是啊，只要我们没把它搞砸，”他说。“你那袋里有什么？”


    此时我从袋里掏出了一把东西。一罐玉米花籽、黄油、红糖和小苏打。“焦糖爆米花，”我笑着说道。


    这次约会的设定——进入未知领域、结识古怪的厨师、并准备一起动手做一顿饭——已经形成了一种“我们对他们”的氛围。


    # 厨房准备


    布克斯顿是第一个打开他的东西。“蓝纹奶培根卷？”他听起来很惊讶。


    “噢，”我说，“那会很好吃的。”


    “是啊，只要我们没把它搞砸，”他说。“你那袋里有什么？”


    我从袋里掏出了一把东西。一罐玉米花籽、黄油、红糖和小苏打。“焦糖爆米花，”我笑着说道。


    这次约会的设定——进入未知领域、结识古怪的厨师、并准备一起动手做一顿饭——已经形成了一种“我们对他们”的氛围。


    # 家庭回忆与反思


    布克斯顿是第一个打开他的东西。“蓝纹奶培根卷？”他听起来很惊讶。


    # 15


    ![](img/image2.jpg)


    布克斯顿


    我吸了吸鼻子，被自己声音里的自豪感触动。我一直支持布莱恩，能感觉到他在三个哥哥身后那种挣扎而出的弱势者心态。

