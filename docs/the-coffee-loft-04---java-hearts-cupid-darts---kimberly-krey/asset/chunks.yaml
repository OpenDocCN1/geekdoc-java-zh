    He clears his throat and continues. “Big, strong Braxton dropped his tools, dusted
    his hands on his jeans, and rushed with superhero speed toward the woman in need
    of his services. The spider seemed to grow bigger with every step he took, creepily
    moving down her lower back with its hairy legs and big, googly eyes. He got there
    just as the venomous thing rounded her backside and bared its dagger-sharp teeth.
    Without delay, Braxton bravely lifted his hand and swatted that thing right off
    her tush with a solid smack.”


    The crowd hoots and hollers.


    “Maggie spun quickly around to face him. Braxton was ready to explain why he’d
    done it, knowing she’d be livid, but before he could form the words, the expression
    on her face stopped him short.”


    My brow furrows while I wait for him to elaborate. I prop a fist on one hip.


    “She wasn’t scowling at him and she wasn’t looking at him in question. Instead,
    Maggie was smiling at him and batting her lashes. Which could mean only one thing.”
    Braxton leans in to finish his sentence, eyes pinned on me. “She liked it!”


    I gasp.


    Ding.


    I dart glances throughout the crowd, catching mirth and amusement on every face
    in the house. These are my patrons. I can’t lose my cool up here, and I’ll be
    danged if I let him get the best of me. “What silly Braxton didn’t realize is
    that she wasn’t fastening her shoes at all. Maggie had simply tripped while trying
    to navigate the wreckage of his workspace—scattered tools, knotted electric cords,
    and takeout bags galore.”


    “Galore?” he repeats under his breath.


    I pin a look on him and continue. “So, imagine her surprise when, instead of helping
    her up as any gentleman would, Braxton swatted her rear end with his grubby hand.
    Then, when she spun around, all wide-eyed and furious, Braxton didn’t bother explaining
    he’d seen a spider. He just gave her a slimy grin and said, ‘You liked that, didn’t
    you? ’


    “But she didn’t like it, so she did what any self-respecting woman would do; she
    gave him a well-deserved slap across the cheek.”


    The audience is really laughing now, which gives me the confidence to give them
    more. Sadly, JJ hands it over with the press of her thumb.


    Ding.


    Braxton steps closer, eyes pinned on me. “She gave him a slap, all right, a moment
    before rushing in for a hot, urgent kiss.” Braxton glides his fingertips over
    his lips and grins. “Mmm.”


    Someone uses their horn to sound out a long, theatrical catcall.


    Ding.


    JJ rushes in with an arm lifted high over her head. “And that’s all for now, folks.
    Let’s give our final contestants, Maggie and Braxton, a big round of applause.”


    They do, and I do my best impersonation of a good sport. Inwardly, I am fuming.
    Seething over the fact that Braxton made me look like a fool up here. One blotchy
    blush after the next. I’ve got to be redder than the balloons by now.


    JJ takes the mic. “Okay, folks, put those pencils to good use and vote. Three
    of the four couples will return for next week’s event. Contestants will be notified.
    The rest of you will have to show up to find out who moves on.”


    I do not look in Braxton’s direction, but from my periphery, I could swear I see
    a grin on his face.


    # 9


    ![](OEBPS/image_rsrc2A2.jpg)


    Braxton


    Sweat drips down my temples as I sand the edge of a freshly cut plank. Since I
    often cut on-site to get the measurements precise, I’m left with a bit of sanding
    work to smooth out the edges. I don’t mind; the smell of fresh wood is one of
    life’s finest gifts.


    Also fine, not that I’m looking, is the maddening woman pacing back and forth,
    watching me as I work.


    “Why do you wear the bandanna?” Maggie asks.


    I continue sanding. “Keeps me from inhaling sawdust,” I say. “Occupational hazard,
    but I only have to wear it when I’m sanding. Sometimes I wear it while I stain
    the wood too.”


    “Hmm.” It’s a soft sound, but somehow, I manage to hear it through the repetitive
    scratch of sandpaper on wood. It’s increasingly this way lately, my growing awareness
    of Maggie’s distracting presence when she steps in to survey the project.


    “I was wondering,” she says thoughtfully, “if you ever think about our story.”


    My brow lifts. It’s been nearly a week since the storytelling event in the main
    shop, not that I’m counting, and the answer to her question is too embarrassing
    to admit. Yes, I think about it. I can’t stop thinking about it.


    I shrug. “Kind of.” But my hand goes still because she is moving toward me. Closer.
    And closer still. Soon, I catch hints of her enticing scent—like sugar cookies
    with a strong side of freshly ground coffee, good enough to eat.


    Her hand brushes my shoulder. “Mind if I…see something?”


    I gulp, straighten, and turn to catch a look in her hazel eyes that I’ve only
    dreamed of seeing. Please tell me this isn’t one of those dreams. If it is, I
    don’t want to know. Not yet.


    She reaches out, runs her fingertips over my covered jaw, and then loosens the
    bandanna with one light tug, exposing the lower half of my face.


    Her heated gaze drops to my lips.


    My mouth waters in response. I gulp again. The sandpaper forgotten as I lift my
    hand to trace the delicate curve of her silky neck, skin so soft I close my eyes
    to enjoy the sensations that rush through me.


    I want more. I lower my head, eyes aimed at that pretty mouth of hers, and press
    a warm, lingering kiss to her lips.


    Maggie surprises me by grabbing my flannel shirt to pull me closer. I happily
    oblige. I’m just getting into the rhythm when she pulls away suddenly. Before
    I can ask why, Maggie pushes me back and slaps me hard across the face. Her lips
    part, and I know she’s about to lay into me, but what comes out doesn’t sound
    human at all.


    I jolt, eyes popping open, heart pounding, and peer into the darkness around me.
    A siren wails in the distance.


    “Yep,” I rasp, “another dream.” I must be some sort of sucker to be dreaming about
    a woman who infuriates me as much as Maggie does. Especially one who hates me.


    I grin at the thought because I’m not entirely convinced Maggie does hate me.'
