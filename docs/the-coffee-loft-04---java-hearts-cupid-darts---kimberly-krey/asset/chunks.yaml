    “没错，”我同意道，顺手向后拍了拍查德。


    “你不可能当布拉克克斯顿的伴郎，”曼迪脱口而出。她把毛巾丢进水晶果盆，在我和布拉克克斯顿之间来回看去，像看到幽鬼一样。


    “查德的伴郎是个彻头彻尾的混蛋。”


