    当我转过身面对她时，感到有些局促。在向她靠拢之前，我回头看了一眼那些顾客。“布克斯顿刚冲进雨里去给我送伞，”我说道，“显然，我昨晚把它忘在列车尾了。”


    香特尔发出一声高亢的哼声。“噢，”她说，“那说明了些什么。”


    我们匆忙回到顾客身边，但我忍不住在脑海中回味她的话。我也觉得这意味着某种什么。我想希望这说明他注意到了我那把被遗忘的伞，是因为他对我感兴趣。但至少起码，这说明布克斯顿比我想象的要像绅士得多。


    “没错，”我听到香特尔说，“今晚七点有故事大对决。”


    那位顾客是一个常光客，一个非常可爱的金发女孩，她对我微笑。“我会回来参加的。祝你好运！希望你和布克斯顿获胜。”


    她知道他的名字。当然，她知道。


    “谢谢，”我说，“你认识他吗？”


    女孩摇了摇头。“不认识，我只是记得他的名字，因为你们在故事里用到了。然后我们用这些名字来投票，所以……”


    “对，”我说，“好吧，谢谢支持。我们看看今晚会发生什么。”


    今晚。我那一度消退的恐惧感再次浮出水面。我起初为什么要举办这个故事活动呢？并不是说我不能抱怨，咖啡咖啡馆自我开业以来经历了销量最好的一天之一。我预感到今晚会有更多的人流量。而且，至少这一次，我不会措手不及了。


    尽管如此，困境是真实的——布克斯顿和我本该在讲述一个即兴爱情故事——爱情故事啊！如果我坚持要扑灭他点燃的每一个火花，观众不会喜欢的。我到底在害怕什么呢？我们又不是真的在讲我们自己的故事，尽管我开始时用那个造船匠的比喻是那样开头的。但我还能用什么呢？我又不是什么作家。我能想出点什么就很幸运了。


    当我看到落在队伍中的下一组顾客时，这个念头从我的脑海中抽离——一个高个男人，抱着一个抱着幼儿，旁边是一个穿着森林绿毛衣的红发女孩。


    “薇！”我从柜台后冲出来，冲上去给了她一个温暖的拥抱。她的肚子在我们之间隆起，告诉我了一些我之前没有察觉到的事情。


    当我退后时，眼睛睁大了。“又要怀孕了？”


    “我能说什么呢？”查德替她回答，把我拉进一个侧抱。“她对我总是手痒。”瘦高男人举起斯凯勒软乎乎的手，让他向我挥挥手。“你记得玛·格吗？”


    斯凯勒缩了摇了摇头，透过红扑扑的脸和红鼻子怀疑地看着我。他太可爱了，我想凑过去，和他蹭蹭鼻子，把我的脸颊贴在他的脸上，感受那种软绵绵的手感。


    “没关系的，”我保证道。“下次如果我在你的热巧克力上加额外的奶油，你就会记得我的，对吧？”


    “我会记得的，”查德笑着说。薇带着爱意的微笑推了推丈夫的手臂。“小西正处于整个‘陌生人危险’阶段，”她解释道，好像我能懂她的意思。


    “是。”我试图回忆我的侄子杰克小时候时是什么样的。尽管我们关系很亲密，我怀疑他从未把我当成陌生人。


    “他会会长好的。还有这一个……”薇摸着她圆圆的肚子。“她预计四月第一周出生。”


    “她？”


    薇直视着我的眼睛点了点头，灿烂的笑容照亮了她漂亮的脸。薇和我以前经常谈论未来——当然，其中包含了对同龄女孩的愿景，这样她们就能像我们一样成为最好的朋友。


    热浪像暴涨的潮水一样席卷我的身体，来自四方的推拉让我失去了平衡。为我亲密的朋友和日益壮大的家庭感到高兴，为见到在她体内奇迹般生长的小天使感到兴奋，还有一种这可能永远不会发生在我身上的热恐惧。


    “我们要给她取莉迪亚，用我奶奶的名字。”


    “啊，太美了。”我再次环抱住她，在她脸颊上亲了一下。“我为你感到非常高兴。”我退开，看着她生命中的男孩们。“为你们所有人，”我说，转向柜台。“来，给你们点些饮料暖暖。”


    等这三个人坐好点完后，我忍不住观察这个小家庭。薇和查德盯着着斯凯勒的每一个动作，就像他是镇上最棒演出的舞台中心一样。那个可爱的幼儿把在鼻子上点奶油当成游戏，让父母大笑起来。在某个时刻，他甚至指了指妈妈的肚子，嘟囔着“姐姐”这个词。


    潮水再次涌回。我每天都能看到许多正在成长的小家庭；这并不新鲜。但看到薇薇安——我那个曾在同一场婚礼上担任同样伴娘的好闺蜜，也在思考她的时刻何时会到来——这种感觉是苦乐参半的。既令人鼓舞又让人沮丧。当然，我为她感到高兴。此外，如果它发生在她身上，也可能发生在我身上，但什么时候呢？已经过去三年了，我离真命天子并没有比那时更近。


    我依然在像以前一样，忍受着属于我的那些尴尬时刻。

