- fmt: "\nStill, I choose to remain cautiously optimistic. Maybe Chad’s cousin will\
    \ take one look at me and think, “what an awesome friend. Look how devoted she\
    \ is. She’d make a great wife one day.” In fact, I should consider this his first\
    \ test. If Viv and Chad think the best man and I could make a good match, this\
    \ is a great way to test the waters—see how shallow the guy really is.\n\nIf he’s\
    \ Mr. Right, he’ll see past the neck brace and give me a chance.\n\nA boost of\
    \ confidence fills my chest because I can be very engaging. Two college professors\
    \ have told me so, and I don’t take that lightly. I’ll hold my head up, not that\
    \ I could actually lower it if I wanted to, and resolve to make the most of this\
    \ day.\n\n“You know, Maggie,” Lindy Goodfellow says, “you really are lucky to\
    \ be alive.” Lindy sits at my right, filing her pointed nails while smacking her\
    \ gum.\n\nI scowl at her reflexively, but it doesn’t translate with the whole\
    \ squished, babyface thing.\n\n“You’re right,” I finally say, resigned.\n\n“I\
    \ can’t believe you actually came,” says Maple with her maple-toned complexion\
    \ that looks perfect in every color known to man. She moves the wand to her right\
    \ eye and blinks some more. “That was really sweet of you.”\n\n“You’re better\
    \ than I am,” Shaylee inserts. “I’d probably hide out until I was able to take\
    \ that thing off.”\n\n“Same,” Lindy agrees with another smack of her gum.\n\n\
    “I’ll be in this thing for at least four weeks,” I say, my tone defensive. “I\
    \ have to eat in it, sleep in it, and go to the bathroom in it… I can’t just hide\
    \ out for four whole weeks. Plus, I didn’t want to let Viv down. She’s waited\
    \ her whole life for this day.” Tears sting my eyes. Perhaps I should have stayed\
    \ home. Who can focus on the wedding when the maid of honor comes out in more\
    \ plastic than a Storm Trooper?\n\n“Aw,” Lindy says, leaning far over to smooth\
    \ a hand over my plastic hump of a neck brace. Maple follows suit, the two huddling\
    \ around me, giving me awkward, delicate pats around the hindering device.\n\n\
    “I’m sorry,” Maple says. “This must be so difficult for you.”\n\nShaylee hasn’t\
    \ moved, but she pipes up from her place at the vanity. “Yeah, having your best\
    \ friend get married…”\n\n“After getting your car smashed last night,” Lindy points\
    \ out.\n\n“And didn’t you just find out that the Brew House is getting torn down—”\
    \ adds Maple.\n\nI nod sadly. The Brew House is a coffee shop by morning and a\
    \ beer bar by night. I’ve been head barista there for two years and just got moved\
    \ up to management.\n\n“So there goes the job you worked so hard for,” Lindy says,\
    \ shaking her head.\n\nMy eyes ping-pong between Maple and Lindy as they tally\
    \ up my series of misfortunes.\n\n“And now you’re stuck wearing this…big old neck\
    \ brace,” Maple says.\n\n“It’s more than a neck brace.” Lindy chuckles a little.\
    \ “It’s a chin, head, chest, back, and ribs brace too.”\n\nIn the quiet pause,\
    \ all eyes flit to Shaylee. She leans very close to the mirror, smearing a thick\
    \ coat of frosty lipstick over her Cupid’s bow, back and forth. She smacks her\
    \ lips together and catches eyes with us through the mirror.\n\n“Not to mention,”\
    \ Shaylee says nonchalantly, sliding the applicator back into its case. “You’ll\
    \ be the only one not married now.”\n\nI blink. “You sort of already said that.”\n\
    \n“No, I didn’t. I just said your bestie is getting married. I didn’t mention\
    \ that the rest of us already had.”\n\nMaple gives Shaylee a hard look. “That\
    \ goes without saying.”\n\n“Well, so does the neck brace thingy,” Shaylee says\
    \ with a wave in my direction.\n\nI sigh, wanting to shimmy my way back into the\
    \ casket I crawled out of for Lindy’s wedding.\n\n“Why don’t you guys go on ahead,”\
    \ I suggest. “Tell Viv I’ll be there soon.”\n\nThe women give each other glances\
    \ and then nod.\n\n“All right.” Maple gives me the best half-hug she can manage\
    \ around the bulky brace.\n\n“See ya out there,” Lindy says while Shaylee zips\
    \ up her jumbo-sized makeup case.\n\n“Oh,” Maple chimes in in a cheery tone, “I\
    \ heard the guy walking you down the aisle—Chad’s cousin—is hot.”\n\n“Yeah, but…”\
    \ Shaylee stops herself from pointing out the obvious by pointing to the obvious\
    \ instead. ‘But…’ the wave of her hand says, ‘Maggie’s not looking too hot herself.\
    \ Just look at her—she’s hideous.’\n\nLindy tugs open the door and holds it for\
    \ the others. “See you out there?”\n\nYeah, unless I’m hiding in Shaylee’s makeup\
    \ case. I fail at another attempt to nod and groan. “Yep.”\n\n“Au revoir,” Shaylee\
    \ says.\n\nLindy waves. “Ciao.”\n\nAs the door swings closed, I spot a group of\
    \ men in tuxes eyeing the women appreciatively. One yelps out a catcall. Another\
    \ whistles.\n\n‘Oh, shut up,’ I want to say, ‘they’re all married.’\n\n“Man,”\
    \ I hear one exclaim from the other side of the door. “The bridesmaids are hot.”\n\
    \n“Did you see her cousins out there?” another asks.\n\n“Yeah,” comes a third\
    \ voice. “Too bad for me, the neck brace. Did you see her cousins out there?”\
