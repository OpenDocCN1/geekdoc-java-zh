    as in never-been-married women my age, aren’t looking for love, but I dare say
    that most of us are, and the ones who say they’re not are only lying to themselves.
    So, even in that case, how can it possibly take anyone by surprise?


    Still, the imagery is hauntingly beautiful, like some of my favorite songs, and
    I feel it stirring new emotions, old longings, and fresh determination. I plan
    to devour this book, and maybe, just maybe, it will be the very thing that changes
    my life.


    # 3


    ![](OEBPS/image_rsrc2A2.jpg)


    Braxton


    Three things run through my mind as I pull into the Coffee Loft’s crowded parking
    lot: First, how are this many people sitting in a coffee shop at 10 a.m. on a
    workday? Sure, yesterday was a holiday, but today certainly isn’t. Second, I hope
    Kirsten’s sister is flexible and willing to at least entertain the plans I have
    in mind; I’ll make this one killer caboose if she hires me.


    But the third thing is triggered at the sight of a Lincoln Town Car in the lot.
    A decorative wrap covers the entire backside. A bloody heart with the word Lovely
    beside it.


    “What in the world?” I mumble, positioning my work truck so I can back into one
    of the only spaces left.


    A call comes in and since I’m here a few minutes early and I don’t feel like getting
    out of the truck yet, I tap the connected dash screen and take the call. It’s
    from Beau. Probably making sure I plan to play nice with his girlfriend’s sister.
    Just not too nice.


    “What’s up?” I ask.


    “You on your way?”


    “Already here,” I announce, ducking my head to better view the space I’m working
    with. To the left of the main shop, the first restored train car acts as an overflow
    for the busy establishment. My job is to restore the interior of the newly delivered
    train car waiting on the opposite side—a classic 1966 caboose. She’s a beauty.


    Last week, I did a walk-through of the new addition so I could measure the place,
    draft up some plans, and have my newest employee—who’s also my college-aged niece—create
    a digital tour incorporating those plans. Maggie hadn’t been there, but her lead
    manager welcomed me with a complimentary cappuccino that, come to think of it,
    explains the busy parking lot.


    In her description, Maggie stated she’d like this one to match the interior of
    the first train car; I have a different idea. A better one.


    “You know what we talked about,” Beau says in his big brother tone.


    “Yeah,” I say. “Hands off the Maggen-dise—I mean…merchandise.”


    “Haha,” Beau says. “Just keep things professional, okay?”


    “Sure, I will. Despite the fact that your girlfriend wants to set me up with her,”
    I add.


    Beau clears his throat. “Kirsten doesn’t want to see her sister alone, which is
    understandable, but I don’t think she realizes how it might affect our relationship
    if you end up…” He trails off there.


    I roll my eyes. “If I end up what? Not falling head-over-heels in love after the
    first date like some sort of sap?”


    Silence.


    “You know what,” I continue, because I’ve had a diatribe on the subject running
    through my mind all week. “I may or may not even like Maggie, Beau. But to know
    that Kirsten has more faith in me than you do stings, okay? I’m a good guy.”


    “I never said you’re not a good guy. You are. You’re a great guy, in fact. I just…you
    don’t…”


    I sense the weight of the words he’s dancing around. “I don’t commit to anyone.
    Is that what you’re going to say? Like the commitment Luke made to Meg? Or are
    you talking about the one Liam made to Gabrielle? Or how about we talk about the
    commitment your wife made to you?”


    “Now you’re crossing a line,” Beau warns.


    I shake my head. “I’m stating the facts. Just because I’m cautious doesn’t mean
    I don’t want what Mom and Dad have. Obviously, I want that.” I sense the deception
    in my own words and work to cover it by adding, “Who doesn’t?”


    The fact is, I do want what they have, but not if I’m more likely than not to
    end up divorced and wrecked like my brothers. Of course, in Luke’s marriage, he
    did the wrecking.


    Beyond that, I’ve seen the same thing happen to my friends over the years. So
    yeah, I’m hesitant to pursue a committed relationship. Plus, I don’t even want
    to date Kirsten’s sister.


    Only that feels like a lie, too. Kirsten’s shown me pictures of Maggie Modella;
    she’s beautiful. Seems to be a real go-getter, too; buying a franchise of her
    own and making additions with the extra train cars. I love that type of drive
    and confidence in a woman.


    Perhaps I’m just suffering a case of wanting what I can’t have. Beau made Maggie
    off-limits, and that probably just made her all the more desirable. Not that it
    matters. I haven’t found anyone I want to risk giving my heart to; I doubt this
    woman will be any different.


    “Don’t worry that pretty head of yours, Beau. I won’t flirt with your precious
    girlfriend’s little sister, okay?”


    “Thanks, man. But don’t…don’t be rude or anything. Just, you know, treat her like
    a potential client, nothing more.”'
