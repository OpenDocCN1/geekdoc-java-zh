    我提前下班，是因为家里有一块冷冻三文鱼排，还有一个尺寸合适的屏幕在召唤我的名字。自从买下它以来，我第一次希望 `Sunny` 的亮度能再低一点。我不希望被任何人发现。我想在接下来的几天里隐形形。也许明天我根本不会去
    `Coffee Loft`。


    我按了一下车库门开启器，小心地驶进室内，然后熄火并再次按了一下按钮。也许我就一直留在这里吧。


    直到我下车时，才注意到我忘记去送那条裙子。


    看到它，一股怒火在心中点燃。满是亮片、丝绸和美感。其他女性可以去情人节约会。其他女性可以结婚，并强迫一群女士穿上她们自己挑选的礼服。但我不能。


    我从车里的衣架上扯下那条礼服，坚定地走向垃圾桶，把那件儿直接扔在上面。没错，它有一个盖子，能把裙子和桶里的垃圾隔离开，但这个动作依然让我感到很畅快。


    得意的，这件永远不会在任何特殊场合穿的裙子。


    当那个词——“永远”——在我脑海中回荡时，我吱呀着开了门。


    悲伤像海啸一样向我袭来，从每一个角度击中我，让我变得虚弱。泪水涌上眼眶时，我勉强走到躺椅旁。我瘫坐在角落里，去拿纸巾，因为泪水已经顺着脸颊流了下来。


    很快，我开始大哭。抽泣。释放出当我想象让 `Braxton` 离开我的生活时，内心所有的心痛。


    我脑海中浮现他告诉我爱我时的神情。他那双漂亮的棕色眼睛里的期待。那双眼睛比我认识过的任何人都更能表现他的情感。也许只是因为我太了解他了。通过最细微的皱眉或动作，我就能准确感觉到他正处于什么心情。对我来说，他很容易读，这让我很安心。


    我喜欢的 `Braxton` 的其他点也涌了出来。他体贴又慷慨。仅仅看到他为父母建立的一切……那真的触动了我。他很有天赋。我喜欢走进阁楼，听着客人们发出赞叹声。那不仅是一件艺术品；在某种程度上，它是他的一部分——他的创造，只要我拥有这间阁楼，它就会在那里。这种认可让我微笑，然后又哭了一会儿。


    更多令人钦佩的特质接踵而来。他幽默、傻气、聪明且成功。他为我感到自豪。在周年纪念派对上，他把我介绍给几乎每一个人时，他是是的自豪。


    而且他爱我。他是直说出来的。事实上，他想让我们的关系正式化。


    这种认可中的某些东西刺痛了我的脑海。这就是你这么做的原因，它在说。你在害怕。


    呵，害怕又怎样？这改变不了 `Braxton` 是那个在我人生低谷羞辱我的残忍混蛋的事实，让我又缩回壳里躲了整整三年。而且，那甚至不是我最难过的事。我难过是因为他的反应和他那天的行为一样，幼稚又糟糕。他竟然有脸说那很有趣，可实际上那一点也不好笑。


    即使我可以释怀这一点，我也对自己的发脾气感到非常羞耻。我羞愧自己会对关于 `Jeb Nobly` 作品的评论，以及关于我被打屁股的愚蠢故事没完没了地发火。我羞辱
    `Braxton` 知道我是那个被他和所有哥们儿嘲笑的荒唐“弗兰肯斯坦新娘”，而我再也不想见到他了。


    `Kirsten` 出现在家里本该让我意外的，但我确实有点意外。我希望她能收到信息，知道我今天不想被打扰。我需要时间独处、哭泣并自我怜。


    但她没有说话。相反，她直接拿过我的遥控器，放了一段 `Taylor Swift` 的音乐合集，然后滑进我旁边的躺椅上。


    我把头靠在她的肩膀上，她用柔软的手指穿过我的头发。`Kirsten` 对我来说一直处于姐姐和母亲形象之间。她不像其他只会对你说你想听的话的姐姐，比如你的高中闺蜜。她说话总是从更有智慧的角度出发。


    两首歌过去后，她开口了。


    “想聊聊吗？”


    我吸了吸鼻子。“不想。”


    但接着，我确实开始谈起它了。我告诉她我心里的一切。难过、愤怒、羞辱，以及失去如此珍贵的东西时感到的悲伤。


    向世界上让我感到最安全的人说出这些感觉很好，但我知道这种情况不会持续下去。很快，她就会教训我，告诉我必须理性思考，并和 `Braxton` 谈清楚。


    但随后我想了一件事。她可能知道我不知道的事。`Kirsten` 可能完全知道 `Braxton` 对这一切心里在想什么。也许 `Braxton` 告诉了 `Beau`，昨晚之后他不想再跟我有任何关系了。也许
    `Beau` 说他不怪他，这很可能会让 `Kirsten` 生气。如果发生了这样的链式反应，她是不会直说的。


    “你和 `Beau` 关系很好，对吧？”我在长时间停顿后说道。


    她点了点头。“他几小时后来接我。”


    我闭上眼睛。“为了你的情人节约会。”我脑海中浮那条绿裙子，并在想 `Kirsten`。

