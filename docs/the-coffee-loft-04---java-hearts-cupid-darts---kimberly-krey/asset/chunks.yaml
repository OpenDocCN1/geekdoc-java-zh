  trans: '

    老天保佑，她的目光也随之落在了我的唇上。


    在我内心的声音破坏这一时刻之前，我倾身向前，低下头，在玛吉（Maggie）丝滑的双唇上落下了一个柔软而绵长的吻。那是我梦过无数次、数不清的唇。快感在我的小腹部温暖地升起。我压抑住一声呻吟。嗯。比我想象的还要好。


    我向后退，强迫自己再次睁开眼，发现她正惊讶地抬头看着我。


    我眯起眼睛。“你现在不会要打我脸吧？”


    她将一缕散发的头发别到耳后。“也许吧。”她的脸颊泛红，不知为何反而增添了几分美感。


    我的心因为成就感而剧烈跳动。我又变回了一个孩子。一个刚和初恋牵手的青少年。虽然听起来很幼稚，但我想我喜欢玛吉，我也认为玛吉也喜欢我。


    “如果你需要帮忙把杯子放进里面，告诉我，”我说道，将目光移回展示柜。这个转折有些生硬，但我已经在想，既然我在这里的工作快结束了，该如何多争取一些和她在一起的时间。


    “我很乐意，”她说。“到时候你就可以看到装满后的样子了。”


    “好。”我点头，然后向后退了几步，再次扫视周围区域。“你看到什么想添加或修改的吗？”


    “目前还没有，”她说。“我再多看看，然后告诉你。”


    “没问题。嘿，”我走向门口时顺口转了下话题，“如果我们今晚的讲故事比赛赢了，能得到什么？”


    “一场两个人的浪漫约会，”她回答道，脸颊变得更红了。


    “嗯。”我看了停车场，然后把目光转回她身上。“我希望我们赢。”


    # 12


    ![](img/image_rsrc2A2.jpg)


    ## 玛吉


    ### 刚。发生了。什么？


    我看着布克斯顿（Braxton）从车尾走出来，感觉就像是第一次见到他。我的心像电钻一样剧烈跳动着。我颤抖着手抚过嘴唇，回味他那美妙双唇触碰我的感觉。他俯下身，歪着头，给了我柔软而感性的吻，那带给我的冲击比我愿意承认的要得多。


    我呆在原地，心完全被那个粗犷的木工融化了。他拥有艺术家的思维、灵巧双手，还有那双摩卡褐色的眼睛——事实证明，那眼睛有让我的双腿发软的力量。


    我甚至完全没预料到。我原本在这里正试着和市场和健身房的那些陌生男人搞点什么；与此同时，爱丘比特已经准备好了弓，目标正对准了我，正如克拉丽莎·洛维（Clarissa
    Lovely）所说的那样。


    我想起第一支箭——爱丘比特的撞击，我不睁大了眼睛。皮肤泛起阵阵寒栗，因为布克斯顿和我完全撞在了一起。这其中没有任何刻意。


    “哇，”我气喘吁吁地说，向后退到足以靠在墙上。


    还有爱丘比特的尴尬——我在讲故事活动中丢了脸。那一定也算在内。


    这意味着我中了两箭。两支箭，一个男人，还有一个非常狡猾的爱丘比特。


    洛维说过，仅仅那样的邂逅通常就足以让情侣建立持久的纽带，而我在这里已经和布克斯顿经历了两次了。


    “事情正在发生，”我低声说道。


    兴奋感在胃部底部翻腾，一股快速而轻盈的颤栗贯穿了我的核心。


    我再次回放了那个吻，他俯身时看我的眼神，他温暖的呼吸洒在皮肤上的感觉，突然，我想起了我不想喜欢上布克斯顿的原因——他的哥哥是我妹妹的新追求者，这可能会在他们之间产生隔阂。


    不会的，我向那个旧我保证道，旧我显然反应过度了，在找理由不让自己冒险去爱。现在的我在这点上认同基尔斯坦（Kirsten）的观点——如果我和布克斯顿之间没结果，那就到此为止。大大不了。


    我很惊讶这种想法带给我如此巨大的快乐。我感到自由——长久以来第一次——可以真正、完全地投入自我。


    我吱呀着打开门，准备冲向咖啡阁楼（Coffee Loft）的入口，这时某个东西吸引了我的目光。那里，挂在车尾门外手手上的是我的伞。我想象着布克斯顿为了我冲进店里拿伞，然后看着我脸上露出一个傻傻的笑容。


    布克斯顿希望我们今晚能赢得比赛并获得那个两个人的浪漫约会，对吧？我也正希望如此。


    ![](img/image_rsrc2A3.jpg)


    ## 玛吉


    我必须尽全力关注舞台上的讲故事的人们。我坐在布克斯顿身边，他的工作靴几乎擦到了我的鞋侧面。几小时前鼓舞着我们的能量仍在热烈地涌动。


    在等待今晚活动期间，我勾掉了清单上的大六件事，但整个过程中，我无法停止思考他指尖在我脖子上略显粗糙的感觉。他眼中那种自信的、坏男孩的光芒，还有当他的目光落在我的唇上时，取代那种光芒的炽热。


    我几乎没有及时闭上眼睛沉浸在那份幸福中。仅仅是回忆，那份幸福感依然在我身上奔梭。自从坐在他身边后，我几乎没有看布布克斯顿，但我能感觉到他在身边的位置挑逗我看向他。


    “大家，给他们鼓鼓吧，”JJ 说道，引起了我的注意，让我意识到我完全错过了那对情人的故事。


    布林利（Brinley）和梅森（Mason）坐在我左侧坐下时，我努力抑制住一阵尴尬。“做得好，”我说。


    布林利微笑着。“谢谢。好运！”


    “现在，让我们欢迎今晚的最后一对情侣。这对组合上周真的闹了大动静。你们知道我在说谁，让我们为布克斯顿和玛吉掌声。”


    噢，天哪。这次我该说什么好呢？我一直被布克斯顿吻的思绪分散了注意力，甚至没有考虑过。


    当布克斯顿站起来时，他的手臂擦过我的。他向我伸出手，凑近我的耳边。“波（Beau）和基尔斯坦刚走进来，”他在拉着我站起来时低声说。“我们站在这儿是他们的错。我觉得我们可以用他们的故事来救场。你觉得呢？”


    我瞥了一眼，看到基尔斯坦正兴奋地对我大大微笑。波帮她脱掉外套，两人在观众席找了舒适的座位。我将目光移回布克斯顿身上，对他点了点头。这主意太天才了！


    “好主意，”我说，如释重负。


    “很高兴再次看到你们站在这里，”JJ 说。“这次，我们让布克斯顿主导。”


    全场安静了下来。“从前……”他戏剧性地说，然后把麦克风给了布克斯顿。


    他把麦克风举到嘴边。“有一个叫布克斯顿的男人，他嫁了一个爱东西的女人。他们有一个叫彼得的儿子，足球得很好。有一天，彼得和他的队友开始注意到彼得妈妈和队友爸爸之间有些异常。”


    观众席发出一阵惊呼。基尔斯坦惊讶地睁大了眼睛。波看起来更多是觉得有趣。他脸上露出一丝微笑，摇了摇头。“干得漂亮，”他没说却表达了意思。


    这一次，当我把麦克风交给布克斯顿时，我享受这种认同的情感。他给了我一个赞许的微笑。

