    He smells like fresh-cut wood and leather, probably from that surprisingly attractive
    toolbelt. Man of wonders, that’s what he is. Successful operator of his own construction
    crew, talented specialist in private, custom jobs, and chivalrous umbrella guy
    who looks hot in the rain.


    “Did you need something?” I ask, hoping my lashes aren’t wet with tears.


    His focus darts between the spoon and the jar in my hand. “Um, no. I mean, yes,
    I’m almost done. I wondered if you’d like to walk through it before I leave. See
    if there’s anything you’d like altered as I finish up.”


    “Oh, you’re…sure, just a second.” I set the jar and spoon down, grab my heels
    off the floor, and work on the task of fastening the straps. If there was a cloud
    over me before, it feels bigger and darker now.


    “You’re coming back for tonight’s event, right?” I finish with one shoe and move
    to the straps of the next, sensing his gaze on me.


    “You don’t want to disappoint your new fan club,” I add, but the truth is, I’m
    the disappointed one. I don’t exactly hate Braxton as much as I thought I did.
    And who knows—maybe if we had more time together, we’d discover there’s actually
    something there.


    “Oh, I wouldn’t miss it,” he rasps.


    I clench my eyes shut against the sudden urge to crumble. First, I run into Viv
    and Chad, catching a glimpse of what I’m missing—of what I might never have. Next,
    I find out that Braxton’s leaving just when I was warming up to him a little.


    Slow footsteps bring him closer. My gaze shifts to his work boots as I finish
    fastening the second clasp and another waft of cedar toys with my senses.


    His hand drops, and I realize he’s offering it to me.


    It’s the second chivalrous gesture of the day, and I can’t help but swoon a little,
    which only shows how deprived I am of such attention.


    I take hold of his rather large hand, appreciating the calloused nature of his
    skin…he’s a hardworking man, and I like that.


    Once he helps me to my feet, Braxton tilts his head and drops his gaze. “Nice
    shoes.”


    My face flushes with heat. “Thanks.” Holy Chemistry. It’s nearly explosive. Why
    now? Why, now that our time is through, does the chemistry have to become so…alive?


    I clear my throat. “Shall we?”


    When his eyes flit back to mine, he lifts a flirtatious brow that sends tingles
    clear to my toes.


    “We shall.”


