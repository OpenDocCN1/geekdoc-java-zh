    your best friend get married…”


    “After getting your car smashed last night,” Lindy points out.


    “And didn’t you just find out that the Brew House is getting torn down—” adds
    Maple.


    I nod sadly. The Brew House is a coffee shop by morning and a beer bar by night.
    I’ve been head barista there for two years and just got moved up to management.


    “So there goes the job you worked so hard for,” Lindy says, shaking her head.


    My eyes ping-pong between Maple and Lindy as they tally up my series of misfortunes.


    “And now you’re stuck wearing this…big old neck brace,” Maple says.


    “It’s more than a neck brace.” Lindy chuckles a little. “It’s a chin, head, chest,
    back, and ribs brace too.”


    In the quiet pause, all eyes flit to Shaylee. She leans very close to the mirror,
    smearing a thick coat of frosty lipstick over her Cupid’s bow, back and forth.
    She smacks her lips together and catches eyes with us through the mirror.


    “Not to mention,” Shaylee says nonchalantly, sliding the applicator back into
    its case. “You’ll be the only one not married now.”


    I blink. “You sort of already said that.”


    “No, I didn’t. I just said your bestie is getting married. I didn’t mention that
    the rest of us already had.”


    Maple gives Shaylee a hard look. “That goes without saying.”


    “Well, so does the neck brace thingy,” Shaylee says with a wave in my direction.


    I sigh, wanting to shimmy my way back into the casket I crawled out of for Lindy’s
    wedding.


    “Why don’t you guys go on ahead,” I suggest. “Tell Viv I’ll be there soon.”


    The women give each other glances and then nod.


    “All right.” Maple gives me the best half-hug she can manage around the bulky
    brace.


    “See ya out there,” Lindy says while Shaylee zips up her jumbo-sized makeup case.


    “Oh,” Maple chimes in a cheery tone, “I heard the guy walking you down the aisle—Chad’s
    cousin—is hot.”


    “Yeah, but…” Shaylee stops herself from pointing out the obvious by pointing to
    the obvious instead. ‘But…’ the wave of her hand says, ‘Maggie’s not looking too
    hot herself. Just look at her—she’s hideous.’


    Lindy tugs open the door and holds it for the others. “See you out there?”


    Yeah, unless I’m hiding in Shaylee’s makeup case. I fail at another attempt to
    nod and groan. “Yep.”


    “Au revoir,” Shaylee says.


    Lindy waves. “Ciao.”


    As the door swings closed, I spot a group of men in tuxes eyeing the women appreciatively.
    One yelps out a catcall. Another whistles.


    ‘Oh, shut up,’ I want to say, ‘they’re all married.’


    “Man,” I hear one exclaim from the other side of the door. “The bridesmaids are
    hot.”


    “Did you see her cousins out there?” another asks.


    “Yeah,” comes a third voice. “Too bad for me, I get the chick with the neck brace.
    Did you see her? She moves like the Bride of Frankenstein.”


    Laughter follows. One guy drags out the word dude until it’s three syllables.


    Jerk. Did that creep actually have the nerve to say, ‘too bad for me’ as if he’s
    the one they should feel sorry for?


    I can barely believe my ears. Here I was, thinking the best man might actually
    see past the neck brace, and he’s out there cracking jokes before we’ve even been
    introduced. And to think I was actually wondering if he’d magically be Mr. Right.


    He most definitely is not. That guy is Mr. Wrong. Mr. Couldn’t-be-wronger, which
    is extra wrong since that’s not even a word.


    What kind of self-centered jerk makes fun of the girl wearing a neck brace after
    surviving an accident the night before her best friend’s wedding and still manages
    to come?


    Indignation flares hot in my chest. Someone ought to make those guys feel ashamed
    of themselves.


    I don’t know whether it’s the eloquently stated series of my misfortunes, the
    pain pills that have me feeling not-so-much like myself, or the fevered agitation
    of spending more than half the night in the ER only to come home with a neck brace
    suited for Big Foot, but I am not about to let Chad’s cousin act like he’s the
    victim when I’m the one stuck wearing this thing.


    I shift from one foot to the next so fast that I feel like a possessed mummy in
    a horror flick.


    “Hey,” I growl as I fling open the door. “I’m lucky to be alive, for your information,
    and if anyone’s going to complain about this ridiculous neck brace, it’s the miserable
    woman stuck wearing it for four weeks!”


    My focus zig zags across the group. Head woozy from my hysterical jaunt, I settle
    on the shortest of the bunch, who’s wearing a snide grin on his face.


    “That’s not a neck brace,” the kid squeaks, “it’s a…body vase.” I can tell by
    his red hair and features that he’s related to Viv. Probably a pesky younger cousin.


    The guys bust up laughing, though some put their heads down and jab those at their
    sides with their elbows. My gaze locks on the only guy I don’t recognize from
    last night’s rehearsal, which means he’s the one who’s supposed to escort me down
    the aisle. Bobby or Braden or something with a B. I think.


    There’s a devilish glint in his eye, one that suggests he’s enjoying himself.
    “Hey,” he says, “I’m sorry. I was just being a jerk. Didn’t know you were…” He
    pauses to glance about the place, then leans in to put emphasis on the final word.
    “Eavesdropping.”


    My nostrils flare. My eyes narrow in on him. What sort of apology is that? Accusing
    me of eavesdropping?


    My vicious side claws its way to the surface, trying to find an imperfection in
    the man who—I’m not going to lie—could model tuxes for a living. I can see why
    Viv said he was hot. He’s attractive in that high school jock type of way. No
    doubt he was the guy every girl in school loved to hate and hated to love. Or
    lust after was probably more like it; I doubt he’s very lovable.'
