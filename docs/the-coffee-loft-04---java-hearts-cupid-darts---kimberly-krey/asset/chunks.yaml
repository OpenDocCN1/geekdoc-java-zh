    Maggie


    Dart Number Four—Cupid’s Creation


    Found at the heart of creation is love.


    Lovely unveils her spiritual side in this chapter, and I’m all about it.


    All signs keep pointing to Braxton, who I’m certain was heaven-sent. Even as I
    dive into the topic of creation and its accompanying chapters, I do so while Braxton
    fashions the coffee bar that he and I—in a word—created together. His parents
    are on an anniversary cruise, a gift from Braxton and his brothers, which allowed
    him just enough time to start and finish the job.


    A few weeks back, Braxton introduced me to his parents; they’re absolutely charming,
    and they’re crazy about their ‘talented son who can build anything with his hands.’
    As they should be.


    I wish my parents had that kind of pride and appreciation for me and Kirsten.
    But I don’t resent it. Instead, I use it to feed me with hope. Braxton has that,
    and if he and I end up making mini Braxtons (or mini Maggies) one day, we can
    develop that kind of closeness as well.


    Seated on a comfy chair in his parents’ spacious bedroom, I hug my beat-up copy
    of Cupid Darts to my chest and watch Braxton put the finishing touches on the
    bar. I’m all but done with the book now, save the closing chapter and, of course,
    the inscription I’ve waited all this time to read. I fell back into savor-mode
    with this last dart, enjoying the way it seemed to narrate the bigger picture
    of the Great Creator and His unmatched love.


    Beyond that, this chapter, like all the others, reflects yet another section of
    my blooming romance with Braxton, giving us every benefit known to true and everlasting
    love-hood.


    “What do you think?” he says, backing proudly away from the bar so I can see it.


    I set the book down, hurry over to his side to observe it, and then let out an
    enchanted sigh. “It’s a masterpiece.”


    He gives me a wicked grin. “You’re quite the masterpiece yourself. You know that?”
    He kisses me on the tip of my nose, making me smile and blush.


    Before we leave, I help him arrange the items I gathered to pull everything together.
    The new multipurpose coffee/cappuccino maker—another gift Braxton and his siblings
    went in on together. And the gorgeous, glass containers I picked out to hold everything
    from coffee beans to K-cups.


    Charming his and hers mugs hang from a matching mug tree on the small kitchenette
    cabinet. Bottles of flavored syrup stand beside it. Last year, Braxton added a
    patio to the couple’s second-story balcony—a sunlit spot of heaven where the two
    often enjoy their morning coffee. Now, they won’t have to trudge downstairs in
    their slippers and robes to get their morning brew.


    “You’re still holding Valentine’s weekend for me, right?” Braxton asks as he rubs
    my back. Warm sunlight pours over my skin, adding to the pleasure of the moment.
    I have a boyfriend who wants to introduce me to his family and friends at his
    parents’ anniversary party. One who wants to spoil me on Valentine’s Day, too.
    It’s wonderful. I plan to spoil him as well; he doesn’t know it, but I ordered
    Braxton a new toolbelt with a special inscription inside: ‘Sky’s the limit, baby!’


    “Yes,” I assure. There’s not so much as a hint of reservation. We may not have
    used the L-word yet, but I can see myself getting there. I’m certain that my days
    of uncertainty are a thing of the past. I lift his large hand, coarse from hard
    labor, and bring it to my lips. Scents of fresh wood cling to his skin.'
