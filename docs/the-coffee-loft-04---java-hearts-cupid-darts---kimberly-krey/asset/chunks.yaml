    “没关系的，”他贴着我的皮肤轻声说道，“我不想催促你。在你准备好之前，你不必说出来的。”他亲了吻我的脸颊，又在下方落下下一个吻。随着一系列柔软而美妙的吻，布拉克克斯顿（Braxton）向我的唇角一路吻去，既让我感到温暖，又让我心旷神怡。


    我渴望得到更多的肯定，及时抬起下巴，正好让他的嘴吻上我的。


    当双唇终于触碰时，布拉克克斯顿的吻变得有力而坚定，似乎在告诉我他想让我知道的一切。他真的爱着我，他也真的愿意等待。


    很快，他的动作变得缓慢、温柔、轻柔。“现在，”他清了清嗓子说，“准备好去见玛利亚（Maria）。她也是个小企业主，所以你们有很多共同语言。”


    当我透过人群与她对视时，凯斯汀（Kirsten）向我挥了挥手。我不知道她从我的脸上读出了什么。震惊、不可信、还是喜悦？我姐姐比任何人都更了解我，但即使她能读懂我脑子里的对话手稿，她依然不知道我的感受。连我自己都知道。


    尽管如此，我还是带着微笑迎接了玛利亚，并祝贺她把布拉克克斯顿的礼服做得很好。她告诉我，在试合期间他一直在夸赞他的新女朋友，我调皮地戳了戳布拉克克斯顿。


    “那太甜了。我也喜欢向别人提起他。”这是一个谎。一个没必要的谎，甚至让我挪了重心并移开了视线。事实是，我不想去吹捧一个可能随时走开、留下我独自面对“结束后到底发生了什么”这类尴尬问题的男人。


    在派对剩下的时间里，我努力设法让自己平复了情绪。布拉克克斯顿告诉我他爱我，当我无法回话时，他给了我所能要求的所有爱和肯定。


    每当我重新回味那份情感时，我都多相信了一点分。而且愈信愈多。


    等派对结束时，我已经认识了家里大多数朋友、亲戚以及教会社区的成员。


    我们说服布拉克克斯顿的父母去露台泡热水缸，而我们负责打扫。


    “再次见到你真好，玛姬（Maggie），”科林·惠特顿（Collin Wheaton）在门口说着，肩上搭着一条毛巾。“你和凯斯汀让我的儿子们非常开心。”


    “谢谢，”我站在水池前回答，“他们也让我们很快心，对吧？”我补充道，推了推正和我一起洗碗的凯斯汀。


    “当然如此，”凯斯汀说。


    站在丈夫身旁的曼迪·惠特顿（Mandy Wheaton）轮流看向布拉克克斯顿和博格（Beau）。“他们最好是这样。”。”她对上我的目光，露出一抹顽皮的笑。“可惜你们没再多几个姐姐给这两个家伙了。”她指了指利姆（Liam）和卢克（Luke）。


    利姆“啪”地一下甩抖开了一个新的厨房垃圾袋。“毫无疑问。”


    “我愿意立刻带走一个莫德拉（Modella）家的女孩，”卢克补充道，引起了我们大多数人的笑声。


    然而，布拉克克斯顿用气球碰了一下他的头，然后把它扔进敞开的袋子里。“小心点。”


    科林和曼迪慈爱地看着这一幕。


    “好了，谢谢你们让今晚圆满成功，孩子们，”科林说，“没有你们我们办不到。”他的目光重新落在凯斯汀和我身上。“希望很快再次见到你们俩。”


    “我们也是，”我们同时回答。


    这对夫妇穿着泳衣走向露台，并在他们身后关上了门。


    “老兄，我真佩服他们，”卢克说。


    “我羡慕他们，”利姆承认道。


    布拉克克斯顿从对面捕捉到了我的目光，他那微妙的微笑似乎在说，我们可能正走在通往他父母所拥有的道路上。


    我露出安定的微笑回礼。是的，我决定，我们真的可能。我还没有说出我爱并没有关系。如果布拉克克斯顿像他父母一样耐心——这是我亲眼所证的——我确信我会达到那一步的。


    “真不敢相信你们你们忍受了这一切，”布拉克克斯顿一边从一簇气球上扯下一根彩色纸一边说道。


    “他们是冠军。”博格收起高挂的气球，把它们塞进垃圾袋，然后从利姆手中接过来。“利姆，能把那个满的袋子拿到门外去吗？”他问。


    利姆抓起袋子走向门外。


    凯斯汀递给我一个洗干净的蛋糕盘，笑着说。“我们确实是冠军，”她赞同道，“我们可能都应该按摩脚。”


    我一边擦干盘子一边用力点头。“是啊，也许再来来块芝士蛋糕。那个太好吃了。”


    正在扫厨房地板的卢克接着话道。“嘿，哥们儿，当你们的女人们在互相按摩脚和吃芝士蛋糕时，我们为什么不出去喝几杯呢？”


    博格低声笑了起来。“很有趣。”


    “看谁差点错过派对了，”利姆冲回室内说道，“布拉克克斯顿，幸好你还在这儿。你就要错过见你最爱的表弟了。”


    在我还没看到是谁跟着他进来之前，凯斯汀推了推我的胳膊。


    “大人物来了。准备好了吗？”她用滴着水的手端着一个大大的水晶水果果盆。


    “准备好了，”我说。


    “怎么样，哥们儿？”迟到者喊道。


    当凯斯汀递过那个沉重的水晶碗时，我的目光停留在她身上。


    “没关系的，”他贴着我的皮肤轻声说道，“我不想催促你。在你准备好之前，你不必说出来的。”他亲了吻我的脸颊，又在下方落下下一个吻。随着一系列柔软而美妙的吻，布拉克克斯顿向我的唇角一路吻去，既让我感到温暖，又让我心旷神怡。


    我渴望得到更多的肯定，及时抬起下巴，正好让他的嘴吻上我的。


    当双唇终于触碰时，布拉克克斯顿的吻变得有力而坚定，似乎在告诉我他想让我知道的一切。他真的爱着我，他也真的愿意等待。


    很快，他的动作变得缓慢、温柔、轻柔。“现在，”他清了清嗓子说，“准备好去见玛利亚。她也是个小企业主，所以你们有很多共同语言。”


    当我透过人群与她对视时，凯斯汀向我挥了挥手。我不知道她从我的脸上读出了什么。震惊、不可信、还是喜悦？我姐姐比任何人都更了解我，但即使她能读懂我脑子里的对话手稿，她依然不知道我的感受。连我自己都知道。


    尽管如此，我还是带着微笑迎接了玛利亚，并祝贺她把布拉克克斯顿的礼服做得很好。她告诉我，在试合期间他一直在夸赞他的新女朋友，我调皮地戳了戳布拉克克斯顿。


    “那太甜了。我也喜欢向别人提起他。”这是一个谎。一个没必要的谎，甚至让我挪了重心并移开了视线。事实是，我不想去吹捧一个可能随时走开、留下我独自面对“结束后到底发生了什么”这类尴尬问题的男人。


    在派对剩下的时间里，我努力设法让自己平复了情绪。布拉克克斯顿告诉我他爱我，当我无法回话时，他给了我所能要求的所有爱和肯定。


    每当我重新回味那份情感时，我都多相信了一点分。而且愈信愈多。


    等派对结束时，我已经认识了家里大多数朋友、亲戚以及教会社区的成员。


    我们说服布拉克克斯顿的父母去露台泡热水缸，而我们负责打扫。


    “再次见到你真好，玛姬，”科林·惠特顿在门口说着，肩上搭着一条毛巾。“你和凯斯汀让我的儿子们非常开心。”


    “谢谢，”我站在水池前回答，“他们也让我们很快心，对吧？”我补充道，推了推正和我一起洗碗的凯斯汀。


    “当然如此，”凯斯汀说。


    站在丈夫身旁的曼迪·惠特顿轮流看向布拉克克斯顿和博格。“他们最好是这样。”她对上我的目光，露出一抹顽皮的笑。“可惜你们没再多几个姐姐给这两个家伙了。”她指了指利姆和卢克。


    利姆“啪”地一下甩抖开了一个新的厨房垃圾袋。“毫无疑问。”


    “我愿意立刻带走一个莫德拉家的女孩，”卢克补充道，引起了我们大多数人的笑声。


    然而，布拉克克斯顿用气球碰了一下他的头，然后把它扔进敞开的袋子里。“小心点。”


    科林和曼迪慈爱地看着这一幕。


    “好了，谢谢你们让今晚圆满成功，”科林说，“没有你们我们办不到。”他的目光重新落在凯斯汀和我身上。“希望很快再次见到你们俩。”


    “我们也是，”我们同时回答。


    这对夫妇穿着泳衣走向露台，并在他们身后关上了门。


    “老兄，我真佩服他们，”卢克说。


