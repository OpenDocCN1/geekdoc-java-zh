  raw: 'I pace my bedroom floor as I wait for Braxton to pick me up. It feels surreal—the
    fact that we’re about to go on our first date, which happens to be an overnight
    date if we decide to stay. Not that we’d do anything we shouldn’t. We’d just take
    the time to get to know each other better, like Braxton said. Time that I thought
    had expired when Braxton finished up his work on the caboose.


    Anticipation bubbles warm and tingly in my chest. I’m glad my time with him isn’t
    through; there’s a lot I don’t know about Braxton, and I can’t wait to learn more.


    When he comes to the door, he glances briefly inside my house before fixing his
    gaze on me. Heat stirs low in my tummy. His brown eyes are puppy dog sweet, save
    that ever-present spark of mischief.


    “Hi,” he rasps, then clears his throat. His cheeks were warm. “You look great.”


    The compliment gives me a reason to appraise him in return. I like Braxton’s everyday,
    rugged carpenter appeal, but the suit he’s sporting adds a whole new dimension.
    It somehow accentuates the broadness of his shoulders and chest. His dark hair,
    which normally hangs in loose, rather reckless waves, is combed back, revealing
    a neatly trimmed undercut. Did he get a haircut for the occasion, I wonder? He
    looks polished, powerful, perfect.


    “You look great, too,” I tell him, knowing the truth of that statement is written
    on my face.


    He walks me to the passenger seat of a gorgeous Cadillac before taking my overnight
    bag and resting it in the trunk.


    “I borrowed this from Beau,” Braxton explains as he settles behind the wheel.
    “I figured it was better than the work truck. Plus, it’s kind of a test drive.
    I’m looking for a second car that I can have a little fun with. This baby has
    some power, let me tell you.”


    “Nice,” I say, but I can’t escape the fact that he and I haven’t exchanged a lot
    of pleasant conversation just yet. Sure, we’re getting along a whole lot better
    now, but in the beginning, we clashed over Nobly’s job with the train car, and
    our first storytelling experience was teeming with angst.


    But then I run into Viv and the baby and start getting in my head…and along comes
    Braxton, of all people, speaking my fears like he’d heard them all along. And
    we share this kiss that is straight out of the movies. Unexpected, tender, and
    sweet. A kiss that left me wanting—not only more of the same—but also more insight
    into who Braxton really is. He’s deeper than I assumed, and the fact that he was
    willing to show a vulnerable side of himself in the caboose says that he trusts
    me.


    “You know,” I say, recalling the way he saved my hide during the storytelling
    event, which is how we won this date, to begin with. “Sharing Kirsten and Beau’s
    story was a stroke of genius.”


    He tilts his head, glancing into the rearview as he merges onto the freeway. “You
    think so?”


    “You know so, don’t you?” I tease. “I always thought it was the sort of story
    that should go in a book one day.”


    “No doubt,” Braxton agrees. “They probably shouldn’t lead with that at parties.
    People will think they’re making it up.”


    I laugh. “Seriously.”


    Braxton puts the car on cruise control and shoots me a quick, sideways glance,
    causing new waves of heat to flare in my chest.


    “We’ve got a ninety-plus minute drive ahead of us,” he says. “We may as well play
    a game.”


    “What kind of game?” I ask.


    “In the spirit of hard-to-believe stories, I think we should start with the one
    where you tell two truths, one lie, the other has to guess which is which.”


    “Okay,” I say. “Who should start?”


    Braxton glances over at me, causing another round of heat to flare in my tummy.
    “Who would you like to go first?”


    I shrug. “Me, I guess. Just let me think for a minute.” For the slightest second,
    I’m tempted to add something revealing—the fact that I’ve never told a man that
    I love him. But it’s too deep for now. Too personal. Besides, it’d be awkward
    if he assumed that was the lie. Like it’s that crazy that I’ve never fallen in
    love.


    I shift gears. My parents have a whopper of a history that Braxton would never
    guess, so I’ll use that one. And then there was that time I tried to make one
    of my own eyes go blind since my friend was blind in one eye—talk about embarrassing.
    I think of a made-up story that’s easy enough to believe, and decide to start
    with that.


    “Okay, when I was little, I had a toothless dog named Stubs.”


    “Stubs?”


    “Yeah, that’s my first one. The second one…I once tried to make myself go blind
    in one eye. And third…after my parents got divorced, they both married other people,
    divorced those guys, and then got back together again.”


    “Only one of those is made up?” Braxton asks.


    “Only one,” I assure.


    “Hmm. So, we’ve got the toothless wonder named Stubs, the wannabe blind-in-one-eye
    story, and the chain-divorcing parents.”


    “That’s right,” I say.


    “I’m going to guess that you did not try to blind yourself in one eye,” he says.
    “Please say you didn’t attempt that. I don’t need one more reason to fear being
    a dad one day.”


    I laugh. “Sorry, but I did do that. I wanted to be like Nancy Dee. She was cool,
    and she told me she was blind in one eye.” I grin as I recall getting busted.
    “Kirsten walked in on me—I was staring at the light fixture with a hand covering
    one eye.”


    Braxton chuckles heartily under his breath. “Why do kids do such dumb things?”


    I join in on the laughter. “I have no idea. That was bizarre of me.”


    “It most definitely was.”


    “And now you’re more afraid to become a dad one day?”


    “Infinitely so. Who will make sure Braxton Jr isn’t staring at the light fixture
    while I’m at work?”


    “Stop it,” I say through more laughter, enjoying the easy feel of being around
    him. It’s unexpected. I’d been worried that spending so much time with Braxton
    in a quiet car might be awkward, but the comfortable ease of our conversation
    has me glad we’ve got the drive ahead of us. It also makes me glad I packed the
    overnight bag in case we want more time together.


    “So what was the lie?” he asks.


    “Stubs. He’s made up.”


    Braxton tips his head. “You don’t say. I was just starting to feel sorry for him,
    too. So that means your parents flip-flopped a lot, huh? That’s rough.”


    “Kirsten witnessed more of that than I did,” I say. “They’d been married and divorced
    before I was even born. After they each got divorced for the second time, they
    got back together long enough to have me, then split up again.”


    “I’m sorry to hear that,” he says thoughtfully.


    I shrug. “It’s all I’ve known. I just hope I can give my kids a different experience,
    you know?”


    He nods. “Beau and I are lucky. Our parents are still together, and they’re actually
    still in love, too, if you can believe it.”


    “That’s fortunate,” I say.


    “Yeah.”


    “Okay,” I urge, “it’s your turn. Give me two truths and one lie.”


    “Easy. I played the lead role in our high school musical senior year, I once out-ate
    all my brothers in a hot wings contest, and I shovel dog poop off my neighbor’s
    lawn almost every day.”


    I take a moment to go over each declaration in my mind. “The only one I do believe
    is the hot wings one.”


    Braxton grins. “That’s the one that’s false. Luke took the win on that one. But
    I was the lead in Footloose my senior year. I juggled theater and football. Wasn’t
    easy.”


    “Wow.” I soak that in for a moment, genuinely impressed. “Footloose? That means
    you can sing, act, and dance.”


    He shrugs. “Means I was better than the other guys who tried out at my school.
    Or at least better looking,” he adds.


    Probably both, but I don’t say it aloud. “Is there a copy of this production someplace?
    Maybe online?”


    Braxton shakes his head. “There were copyright restrictions, but my dad managed
    to sneak-record the whole thing anyway. He was proud. And it’s funny because I
    wondered if he’d give me crap for it, you know?'
