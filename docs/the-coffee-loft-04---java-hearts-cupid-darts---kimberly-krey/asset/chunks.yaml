    我在卧室地板上来回走着，等布克斯顿来接我。这种感觉很不真实——我们即将开始第一次约会，而且如果我们决定留下来的话，这将是一次过夜约会。并不是说我们会做什么不该做的事。我们会像布克斯顿说的那样，花时间更好地了解彼此。我本以为当布克斯顿完成他在列车厢的工作后，这段时间已经过期了。


    期待感在我的胸中温暖而酥麻地涌动着。我很庆幸和他在一起的时间还没有结束；关于布克斯顿，我还有很多不知道，我迫不及待想了解更多。当他来到门口时，他简单地了一眼我的屋内，然后将目光定在我身上。我的小腹处升起一阵热流。他那棕色的眼睛像小狗一样温柔，只是闪烁着挥之不去的顽皮。


    “嗨，”他沙哑着说，然后清了清嗓子。他的脸颊很暖，“你看起来真美。”


    这句赞美给了我一个回礼欣赏他的理由。我喜欢布克斯顿那种日常、粗犷的木工气质，但他穿的这身西装增添了一个全新的维度。这似乎衬托出他宽阔的肩膀和胸膛。他深色的头发通常呈着松散、有些随意的波浪，现在被向后梳，露出修剪得整齐的侧推剪。我在想，他是为了这次场合去理发了吗？他看起来精干、充满力量、完美。


    “你也很美，”我告诉他，我知道这句话的真实性写在我的脸上。


    他送我坐一辆华丽的凯迪克的副驾驶座，接过我的过夜包并放在后备箱里。


    “这是我从波那里借的，”布克斯顿坐在驾驶位上解释道，“我觉得这比那辆工作车要好。而且，这也算是一次试驾。我正在找第二辆可以稍微玩得开车的车。这小家伙力气真大，我告诉你。”


    “不错，”我说，但我无法回避一个事实：我和他还没有进行过太多愉快的对话。诚然，我们现在的相处好多了，但在刚开始，我们因为诺布利在火车车上的工作发生过冲突，我们第一次讲故事的经历充满了焦虑。


    但随后我遇到了维和宝宝，开始胡思乱想……结果布克斯顿，在所有人中偏偏是他，说出了我的恐惧，就好像他一直在听着一样。然后我们分享了一个简直直接出自电影的吻。出乎意、温柔而甜蜜。这个吻让我渴望——不仅仅是想要更多——更是想更深入地了解布克斯顿是谁。他比我想象的要深刻，而且他愿意在列车厢里展现出脆弱的一面，这说明他信任我。


    “你知道的，”我回想起他在讲故事活动中如何救了我一命，那从就是我们获得这次约会的开始，“分享凯斯汀和波的故事简直是神来之笔。”


    他歪着头，在并入高速公路时瞥了一眼后视镜。“你这么觉得吗？”


    “你心里清楚，不是吗？”我调侃道，“我一直觉得那种故事总有一天应该写进书里。”


    “毫无疑问，”布克斯顿赞同道，“他们可能不应该在聚会上以此作为开场。人们会觉得那是编造的。”


    我笑了起来。“真的。”


    布克斯顿开启了汽车巡航模式，快速向侧瞥了我一眼，导致我胸中泛起新的一波热浪。


    “我们前面还有九十分钟的车程，”他说，“我们还不如玩个游戏。”


    “玩什么游戏？”我问。


    “本着那些难以置信的故事的精神，我想我们应该从这样一个故事开始：你说两个真话，一个谎话，另一个人猜哪是一个。”


    “好，”我说，“谁先？”


    布克斯顿看向我，导致我小腹处又升起了一阵热度。“你想先来？”


    我耸了耸肩。“我想是我吧。让我思考一分钟。”在那么一秒钟里，我很想增加一些揭露性的内容——比如我从未告诉过任何男人我爱他。但现在说这个太深了。太私密了。而且，如果他假设那是谎话，那会很尴尬。就像觉得我从未谈过恋爱这事很疯狂一样。


    我转换了思路。我父母有一段布克斯顿永远猜不到的惊人历史，所以我用那一个。还有有一次，我试图让自己的一只眼睛变盲，因为我朋友一只眼睛是瞎的——提提这多丢脸。我想了一个足够容易相信的虚构故事，决定从那个开始。


    “好，我小的时候，我有一只叫斯塔布斯的没牙小狗。”


    “斯塔布斯？”


    “是的，这是第一个。第二个……我曾试图让自己一只眼睛变盲。第三个……在我父母离婚后，他们又各嫁了别人，又和那些人离婚，然后又复合在了一起。”


    “这三个里只有一个编造的？”布克斯顿问。


    “只有一个，”我保证道。


    “嗯。所以，我们有一个叫斯塔布斯的没牙奇迹，一个想变盲的故事，和一个连环离婚的父母。”


    “没错，”我说。


    “我猜你没有尝试让自己一只眼睛变盲，”他说，“请告诉我你没试过那个。我不需要再多一个理由来担心以后当个爸爸。”


    我笑了起来。“抱歉，但我确实没试过。”


    “好，我没弄瞎自己一只眼睛。”


    “正因为我一只眼睛是瞎的，”布克斯顿低声大笑，“我完全理解那种。”


    “那是真的，”我笑着回答，“所以你更害怕以后当个爸爸了？”


    “确实是如此，”我大笑着回答。

