    you while I was picking up my tux.” I can tell that Braxton’s trying not to get
    hung up on the fact that I didn’t return his sentiment. His posture is wilted,
    and he’s avoiding my gaze.


    “Wait,” I blurt. I don’t want to fail. I don’t want to lose him. Braxton is no
    stranger to fear, but he’s pushing past it, expressing himself despite the risk.


