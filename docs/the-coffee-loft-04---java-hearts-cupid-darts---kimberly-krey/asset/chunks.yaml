    “By taking my time,” the one I assume is Maggie replies. “I’m not the type to
    throw myself at a guy or rush into anything. But it seems like that’s what guys
    want. If you approach things cautiously—and why shouldn’t you with the divorce
    rate out there—you’re some boring dud who’s not even worth their time.”


    “Sounds like you’re speaking from experience,” Jersey voice says, speaking my
    thoughts exactly. I’m suddenly glad Beau drew a line; the last thing I want is
    to pay for damage done by some punk in the woman’s past.


    “I most definitely am. But I have a question for you about the cover of this new
    book. It’s gorgeous, by the way. Something about the appearance of the heart and
    the way the Cupids are portrayed suggests, to me, that love sort of sneaks up
    on us. But maybe I’m reading too much into it.”


    “No,” Jersey says, “you’re right. The Cupid darts give indications, markers, if
    you will, of common occurrences found in long-lasting relationships.”


    “But if the instances take us by surprise—meaning we can’t orchestrate them—then
    what good is it to know what they are?”


    I cringe. This chick is pushy. I lean in, half expecting Jersey girl to pop off.


    “Ah, you’re already getting to the heart of it, aren’t you? The four Cupid darts
    listed in my book are meant to show the reader just how often Cupid attempts to
    strike.


    “Your job is to take note when you encounter one or more of those things with
    a potential match. Take them as signs, if you will, that you should pay closer
    attention to that person because if things do work out between you, the relationship
    is more likely to last.”


    What a load of crap. I shake my head and let out a tsk that echoes in the small
    space.


    “Just a second…” comes a mere whisper. The soft padding of footsteps tells me
    someone’s approaching the all-but-closed door.


    I clear my throat and give the old paneled door a tap with my knuckles. I mean
    for it to be a series of taps, but the thing swings open before I can get the
    second one in.


    I blink, staring at the woman in the doorway. Wide hazel eyes, reddish blonde
    hair, and a set of pouty lips that summon the word kissable. Her nostrils flare
    the slightest bit, and I could swear something is stirring behind those eyes,
    as if she’s working to solve a mystery in her mind. As if I’m the mystery she’s
    trying to solve.


    Something akin to fear sparks hot in my chest. My face warms. “Uh…hi, Maggie,
    is it?”


    # 4


    ![](OEBPS/image_rsrc2A2.jpg)


    Maggie


    Tall, dark, and handsome barely cover the sight standing outside my office door.
    Lurking is more like it. How long has he been standing here? And why does he look
    so…familiar?


    “That’s your name, isn’t it?” he prods, tearing me from my stupor. A mischievous
    gleam flickers in his dark eyes as he holds my gaze. He’s not smiling, per se,
    but there’s a hint of amusement trapped in his expression, and I can’t help but
    wonder what Kirsten has told him about me.


    My face flushes with heat. “Yes, that’s me, hi. I’m just finishing up here. Do
    you mind meeting me in the finished train car? It’s unlocked.”


    He darts a gaze over my shoulder before fixing those penetrating eyes back on
    me. “Sure.”


    “Great, thanks.”


    He heads down the stairs, his massive frame taking up more space in the walkway
    than I thought possible. Holy smokes. I shouldn’t be surprised by how ridiculously
    appealing the man is; his brother, Beau, is the same way. It’s why I asked if
    he happened to have a little brother for me.


    I hurry back to my desk, but Clarissa is coming to a stand.


    “I’ve taken up too much of your time,” she says, smoothing a hand down the length
    of her silky, black hair. Something about the gesture summons an image of Wednesday’s
    mom in the Addams Family.


    I shake my head. “Not at all.”'
