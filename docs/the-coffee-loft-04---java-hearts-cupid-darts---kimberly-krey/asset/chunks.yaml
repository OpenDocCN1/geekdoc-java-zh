    # SAMPLE CHAPTER STING OP ‘FUN’


    I hope you enjoyed Java Hearts & Cupid Darts and the bonus book, Snowed In for
    Christmas.


    Would you like to read Kirsten and Beau’s love story? It’s called Sting Op ‘Fun’
    at Forty-One, and it’s the first book in my new, romcom series, Forty-Something
    Singles of VA Beach.


    Here’s a sample chapter for you:


    September


    Kirsten


    Jack flings open the passenger side door as soon as I pull beside the soccer field.
    He flips his growing bangs from his face and leans forward to adjust his shin
    guards, which sends his hair back over his eyes once more.


    “Wanna know something weird?” he asks.


    I survey my fourteen-year-old son, realizing this could veer into territory I’m
    not prepared for. “Sure.”


    “Every time Dad comes to my games, he sets his chair up next to Parker’s mom,
    Trish, and they talk the whole time.”


    I shrug. “So?”


    “So, it’s like, they’re not even watching the game.”


    “You know Dad’s not into sports⁠—”


    “It’s not that,” he interrupts. “They’re both married to other people. It’s weird.”


    I shake my head, recalling how high the jealousy factor is at his age. Early teens
    who were “going together” couldn’t look at another person without a hallway drama
    unfolding after school.


    “Jack, when you’ve been married as long as your dad and I have, you learn to…not
    look into things too much, you know? We’d make ourselves crazy.”


    He climbs out and closes the door. Seconds later, the hatchback opens. “Whatever.
    And I also think it’s weird that every time you come, she doesn’t. It’s like she
    knows he won’t be here, so she sends Beau instead.”'
