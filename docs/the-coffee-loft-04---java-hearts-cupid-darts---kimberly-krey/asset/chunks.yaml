- fmt: '

    I press a soft kiss to each of his knuckles, and then I hug his fist to my chest
    and sigh. “There’s no one else I’d rather spend the day with.” Hopefully, he feels
    the same way.


    ![](OEBPS/image_rsrc2A3.jpg)


    ## Braxton


    I step out of the dressing room in a freshly tailored tux, checking the hem length
    on my pants.


    “Dios mío, estás tan guapo, hijo!” Maria trills as she rushes toward me with the
    measuring tape draped around behind her neck.


    “Gracias dulce María,” I say. “Haces un trabajo magnifico.”


    Maria blushes and swats my arm. “You know I’m a sucker for when you speak my language.”


    “I’m afraid those are about the only words I know,” I admit. My family and I have
    been coming to Maria’s Suit and Tux shop since I was a kid. She claims the Wheaton
    boys are her favorite, but I’ve got a sneaking suspicion she makes all of her
    customers feel like that. Maria is special that way.


    She inspects me with a twisted lip before tugging my cuffs, adjusting my collar,
    and then stepping back to look at me once more.


    “Bend your arms.”


    I do.


    “Flex your muscles out to the side.”


    I do that, too.


    She tugs the jacket of my suit coat and grins. “There, relax. Perfecto. Muy guapo.”


    “Gracias hermosa amiga,” I reply with a nod.


    As I check out, Maria asks about my brothers, saying all but Luke have come to
    pick up their suits for the upcoming anniversary party.


    “So you and Beau are the only ones keeping the suits through Valentine’s Day.
    Does that mean you have a date with a special someone, too?”


    “I do. Her name’s Maggie. She’s beautiful, intelligent, ambitious…” I sigh, feeling
    my face warm as I admit how crazy I am about her. “She’s really funny too, and
    strong, and resilient.”


    Maria prints out the receipt and hands it to me. “Sounds like you might like her
    a little bit.”


    “Yeah,” I say with a laugh. “I don’t know how often you make it to the boardwalk
    on the beach, but she owns the Coffee Loft out there. You know, the old train
    station?”


    “I do know that one. With the train car addition?”


    I know I’m beaming like a cheeseball, but I can’t help it. I’m dang proud of Maggie
    and her accomplishments. “There are two train cars now. I refurbished the second
    caboose. That’s how we met.”


    Maria claps her hands together. “I’m so happy for you, Braxton.”


    I tell her about the storytelling events, the date prize in Richmond, and about
    the tickets I secured for Valentine’s—a dinner cruise experience that Maggie won’t
    forget.


    “How magical,” Maria says.


    “If you come to the anniversary party,” I say, “I’ll introduce you to her.”


    “Oh, I’ll be there,” she assures. “And I’m looking forward to it.” She gives my
    cheek a pinch. “Maggie is one lucky woman.”


    I grin. “Thanks. And I am one lucky man.”


    # 19


    ![](OEBPS/image_rsrc2A2.jpg)


    ## Maggie


    The anniversary party is here at last, and I can’t take my eyes off the celebrated
    couple. Forty-five years! Braxton’s parents have been married for forty-five years.
    For someone like me, it’s almost like seeing a unicorn.


    Relationships like this do exist.


    That one sentence stirs all sorts of excitement in my soul. It’s like a warm,
    crackling fire in the once frigid hollow of my chest. An entire month has passed
    since Braxton and I went on our very first date. Since then, we’ve been going
    nonstop—nights out, nights in, phone calls, and lovey-dovey texts filled with
    just enough sarcasm and snark to make me laugh out loud or smile in a crowd.


    I can’t help but think I’ve officially graduated, in a way. I spent years trying
    to leave my reservations and fears in the past. I read countless books about being
    open, vulnerable, and letting someone into my heart.


    In my past relationships, I was constantly running from that part of myself—the
    part that could undo everything with the sudden, drastic tip of the scale. From
    all to nothing.


    I feel no such inclination with Braxton.


    That’s not to say falling in love with him is not a risk. But I’m confident that
    Braxton Wheaton is worth the risk.


    Over the last month, we’ve enjoyed several group dates with Kirsten and Beau,
    made all the more enjoyable by the fact that the kids will often come along, too.
    When we’re together, there’s an undeniable sense of family and unity, and I can’t
    help but bask in it every time.


    If she married Beau and I married Braxton, we’d have shared holidays on both sides,
    mutual in-laws, and the same nieces and nephews, too. I don’t let myself dream
    of it often, but during a party like this, I can’t help but imagine what could
    be.


    Braxton and I make our way to a quiet corner of his parents’ great room as the
    couple of honor happily greets their guests. His brothers are scattered throughout,
    chatting with family, old friends, and acquaintances alike.


    But here, in this small nook behind the grand piano, slightly hidden by Mrs. Wheaton’s
    prize figurine display case, it feels like Braxton and I are alone.


    “You know what I’ve never understood,” Braxton says, looking serious. “Sky’s the
    limit. What’s that supposed to mean, anyway?”


    I shake my head for a beat, then recall what Braxton told me about his special
    exchange with Blaine.


    My heart cracks a little as I say it. “It’s like… potential without end.”


    He grins like I’ve fallen into his trap. “That’s what we have,” he says, looking
    at me expectantly.


    I gulp, half melting from the incredible sentiment and half intimidated by it
    too. Suddenly, I remember that the two of them used to say it together afterward.
    “You’re right,” I say with a knowing nod. I’m relieved when he follows my lead
    as I speak up again.


    “Sky’s the limit, baby,” we say in unison.


    Braxton pulls me in for a hug. We’ve shared something that I can’t exactly explain.
    Something intimate and sacred. He trusts me, and I trust him too. More than I’ve
    trusted any man besides Jeb Nobly.


    “So when are we going to make this…official?” Braxton glides the tip of his nose
    along my temple, allowing his heated breath to tease my skin.


    Goose bumps rise up my arms, making me grin. I turn to catch his gaze, delighted
    by that roguish glint in his eye.


    Anticipation stirs low in my tummy. He’s going to ask me to be his girlfriend,
    I know.

