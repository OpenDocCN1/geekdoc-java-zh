    终于，她微微动了一下。看起来几乎像是在点头，但动作如此微妙，我我无法确定。一丝若有若无的笑意掠过她的一侧绯红脸颊。她抿住嘴压住那抹微笑，但我现在确定它在那里，露出了喜悦或快乐，我不确定是哪一种。


