    “No, it’s okay if everyone hears this,” Maggie says. “I mean, I had been to one
    wedding after the next, watching all my friends get married. And Viv had really
    talked you up. I was thinking that maybe I was finally going to meet my person.
    I’d shut out men before that, but I was opening myself up just in time, hoping
    that you might just be Mr. Right. And after the way you treated me, I shut down
    all over again.”


    I roll my eyes. “You’re blaming me for that now?”


    “I can’t believe you’re rolling your eyes like that. Yes, I blame you for that.
    You were terrible to me.”


    “I didn’t even know you.” I take a step back and eye her up and down, wondering
    what sort of crazed universe we just walked into. But then it hits me—I know exactly
    what Maggie’s doing right now, and I’m not about to let her get away with it.


    I square a hard look at her. “Have you forgotten that you’re not the only one
    who plays this game?”


    “Game?” she shrieks.


    I nod. “I have fears too, and I can blame things in my past and look for all sorts
    of reasons to back out of a relationship or refuse to look for love…” I walk closer
    to the counter, eyes fixed on her. “But what it all boils down to is ourselves—no
    one else.”


    “I’m not listening to any more of this.” Maggie backs away from the counter and
    tears out of the kitchen toward the front room.


    “Maggie, wait!" I move to follow her out, but Beau puts an arm out to stay me.


    “I’ll go with her,” Kirsten says, looking first at Beau and then at me. “She’ll
    be fine. She just needs a minute to cool down.”


    I nod in response, but I’m not so sure she will come around.


    I replay the way I expressed my love for her and her inability to return the sentiment.
    I was hurt, but I was also okay with it. I didn’t want Maggie to feel rushed.


    Still, if she’s panicking, if she’s looking for a way out now that we’re getting
    in deep, this is just the sort of thing she’ll use to break things off.


    Viv follows Kirsten without so much as a protest from anyone.


    “Sorry, man,” Chad says over his shoulder as he follows his wife out—traitor.


    My brothers surround me with somber faces and headshakes. They’ve been through
    this before. They’ve been through worse than this. They married who they thought
    was the love of their lives. They had children together, then were faced with
    their greatest fear—having it all fall apart.


    Perhaps the timing of this isn’t so bad after all. If Maggie is destined to leave
    me sometime, maybe it’s better now than later. Perhaps my fears were doing me
    more good than I thought. It’s possible that people like Maggie and I are better
    off alone.


    ![](OEBPS/image_rsrc2A3.jpg)


    # Braxton


    I lift my arm to make the mug in my hand clank against those in the center of
    the table. I don’t drink often, and this stuff is hitting me hard. My head is
    woozy, my vision is fuzzy, and parts of my face feel numb.


    “Here’s to brotherhood,” Luke booms exuberantly.


    “Yeah,” I say with a slur. “You guys are the only people I can really trust to
    stick around.”


    “That’s not true,” Beau says with a pat on my back.


    Liam pulls a sour face. “Just let him have his pity party, will you?”


    “Yeah,” I scold, “you big…” I search for a blink, finding that my vocabulary has
    dwindled. “Mean…face.”


    “Geez, you really don’t drink often, do you?” Luke laughs, and the others join
    in.


    “He’s had one draft,” I hear Liam say.


    Beau gives my back another pat. “He is our baby brother.”


    “Don’t talk about me like I’m not here.” I think back on a term the waitress used
    when we ordered the first round. “These mugs are giant. And don’t act like you
    guys didn’t ask for the strong ones. I heard you say high tip.” When that doesn’t
    sound right, I try again. “Top. I mean point. High point.” I shake Beau’s arm
    off me like it has cooties, feeling more agitated and irritable by the minute.


    “You and your perfect little relationship with Kirsten,” I snap, “who, by the
    way, should have a harder time trusting men than Maggie does after what she’s
    been through.”


    I let loose the diatribe I’ve memorized over the years, reciting all the excuses
    I have to be fearful and patting myself on the back for being the one to stick
    things out this time.


    The gold liquid in my second mug gets lower, and the overhead lights start to
    tip and sway, but my message must be heard. “And over something I did like three
    years ago?” I gripe. “Get over it already.”


    “This isn’t how I pictured the night going,” Luke says to Liam.


    “Me neither,” Liam agrees.


    I flinch. “Oh, I’m too boring for you guys?”


    “Try too whiny,” Luke mumbles.


    Beau stands to his feet, pulls a few bills from his wallet, and drops them onto
    the table. “Why don’t you guys head over to the bar and start a new tab. I’ll
    make sure Braxton gets home all right.”


    I don’t know how it happens, but soon, I’m, I’m getting home all right.


