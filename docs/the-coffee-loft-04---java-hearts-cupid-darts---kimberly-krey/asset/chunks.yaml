    Maggie


    Present Day


    Rebounding—a fun aerobic exercise on a trampoline—is at the top of my resolution
    list for the new year. So you can imagine how proud I am as I take my first class
    the day after Christmas.


    Why wait until New Years? Especially considering the copious amounts of charcuterie
    board goodies I ate this month.


    I know the rebound class is a win when the instructor starts with a Taylor Swift
    song. Since I’m only a few years younger than the pop queen herself, Taylor and
    I essentially grew up together. With songs like Love Story and You Belong With
    Me, she helped a teenage hormonal me cope with the cruelty of immature boys. Like
    the name of that hit album, I wanted to be Fearless! And when I pumped myself
    up on Swift’s songs, I was.


    The album she released after I graduated helped me Shake It Off when the Brew
    House was torn down to make room for condos since, apparently, Virginia Beach
    didn’t have enough already.


    But today, as I bounce to the electronic beat of Ready For It, I think of the
    ways I’ve risen above letdowns, heartaches, and disappointments.


    At a mere twenty-nine years old, I’m the owner and operator of a new beachside
    coffee shop that’s even better than the first, if I say so myself. You’ve no doubt
    heard of the Coffee Loft, the most charming coffee chain in the U.S. For one to
    carry that name, one must live up to impeccable standards. Just look at the ones
    in Long Island and Palmer City.


    My shop is in an old, restored train station that oozes charm! I love being there,
    I love making it cozy and new for each season that comes, and I love every member
    of my staff. Life is humming along beautifully. I’m achieving my goals one by
    one.


    Finish school while working as a barista full-time: check!


    Become an owner/operator of a successful coffee shop: check!


    Find the man of my dreams to enjoy life with: insert a crow’s distant caw over
    a stretch of barren land. Better yet, a toilet flushing with a flourish.


    Okay, so that area is a work in progress. And no, I still haven’t told a man I
    love him because I have yet to fall in love. But for the first time in years,
    I am genuinely ready for it.


    I’ve been on close to a dozen dates in the last four dozen days. There was the
    electrician who squeezed puns into every conversation we had. Mid-way through
    the date, I was so punned out I imagined jamming my fork into the nearest outlet.
    Are we having pun yet?


    Then there was the “much-older” gentleman who lied about his age. I should have
    caught on when he posted a black and white photo that looked suspiciously like
    James Dean. It’s a classic look, and he was cute. Too bad he was also in his early
    seventies. The guy showed up at the diner in pegged jeans rolled at the ankles,
    a tight white tee shirt that, bless him, accented his sagging muffin top, and
    thick, silver hair swooped just like the rebel without a cause himself. For a
    woman closer to his age, Herman would be a real catch.


    The most promising of my dates was the Navy SEAL from Norfork. He was perfect,
    minus the fact that he was leaving for an extended operation in Japan the very
    next day.


    I sigh, feeling the energy draining from my limbs.'
