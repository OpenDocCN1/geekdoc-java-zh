    and couples alike. I hand out the voting cards while they tug off beanies, unwrap
    scarves, and drape coats and jackets over the backs of chairs.


    The spunky author hosting tonight’s event is already working the crowd, asking
    couples how long they’ve been together and prodding singles to point out someone
    in the room they’d be interested in getting to know.


    I’m surprised to see that Kirsten and Beau took me up on the invite. They take
    a seat beside a group I recognize from the forty-something singles event.


    JJ approaches me with a wide grin. “Great crowd,” she says under her breath, eyes
    wandering over the filled tables and chairs. Her gaze lifts to glance over those
    seated in the loft. “I’ll be asking for volunteers,” she explains, “but I might
    call on a few unsuspecting souls too. See if we can’t make a love match.”


    I tip my head back; that’s why she was asking the singles if they had their eye
    on someone. I’m simultaneously glad and sad about the fact that I’m not a candidate
    for the event. The couples who get the most votes will move on to the next round.
    There, one lucky couple will win a romantic date package for two.


    JJ gets started by inviting a couple who’s willing to show everyone how it’s done.
    They happen to be JJ’s parents, who sit front and center in the crowd. They’ve
    been married for over thirty-five years. She hands them each a mic, takes a step
    back, and hollers, “You start, Ma. Once upon a time…”


    JJ’s mother takes it and runs, describing the time a fair maiden met a noble knight
    in the woods one day. JJ’s father broadens his shoulders and lifts his chin as
    the woman describes his handsome face and fine physique.


    When it’s his turn, he takes over telling the tale, saying the two were barely
    beyond introductions when a dangerous band of gypsies broke through the trees.
    He was forced to hoist the fair maiden onto his horse and bolt into the densest
    part of the woods where no one dared venture.


    By the time the couple’s eight minutes is up, the crowd is collectively leaning
    forward and waiting on bated breath.


    “Now you know where I get it,” JJ says. “These two can spin a yarn, can’t they?
    Let’s all give them a hand.” She goes on to assure the guests that their stories
    can be set in modern day, a historical era, or even a fantasy world. It all depends
    on the storytellers and where they choose to take it.


    A flare of excitement sparks in my chest. I can’t wait to see what my patrons
    come up with. Maybe I can get Kirsten and Beau up there. Just as that thought
    crosses my mind, I catch eyes with JJ across the room. I lock eyes with her, then
    nod pointedly in Kirsten and Beau’s direction.


    JJ’s eyes land on the happy couple before she looks back at me with a thumbs up.
    “I’ll get ‘em,” she mouths.


    I grin.


    This ought to be good.


