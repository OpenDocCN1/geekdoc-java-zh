  trans: '


    我从窗边退开，匆忙穿过房间，眉头紧锁，试图猜他在后座上等我的是什么。


    那口老祖父钟——杰布送的礼物——在我到达门口时，恰好响起了五点钟。


    我没有一刻延误，扭动门把，推开门，直接走到了门廊上。我一看到布拉克克斯顿，我不惊讶地睁大了眼睛。


    他确实穿了一套无尾服，但这并不是他身上的全部。我不确定他收买了了哪个医院的哪些医护人员才弄来这东西，但布拉克克斯顿·惠尔顿戴着一个金刚一样大的颈托，它阻碍了他的步态，压扁了他的脸，也让我的内心作为一个陷入爱情的女人激动不已。


    “嗨，”他在台阶下说道。我看得出他正试图低头看脚下的位置，但那个架子不让他这么做。


    “布拉克克斯顿，”我说，快步走下台阶迎接他，免得他受伤。“你从哪儿弄来这玩意儿的？”


    “卢克和利亚姆在单身小组认识的一个护士，”他通过压扁的嘴说道。“我会强迫自己戴一整晚晚上，以此补偿我对你做的事。”


    “你是认真的吗？”我问道，喉咙里溢出一声惊讶的笑声。


    布拉克克斯顿眨了眨眼睛。“我没法点头，”他抱怨道，“但是的。”


    我斜着他，怀疑布拉克克斯顿太爱虚荣了，绝不会真的做这种事。事实也是，我绝不会让他这么做。尽管如此，我决定在放过他之前先开个小玩笑。


    我点了点头。“好。”


    “好？”他尖叫道，眼睛睁得很大。


    “没问题。我可能得我开车。”我瞥了一眼车。“但我相信比波不会介意的。”


    布拉克克斯顿斯哼了一声，试图揉揉他的鼻子，但他的手臂被圆环横杆挡住了。


    “你知道吗，”我说，伸手去帮他揉了揉抽动的鼻子，“当我戴这个时候，我得连续戴整整四个周。”


    他露出了看起来很紧张的缩脸表情，好像我也会要求他也那样做。


    我笑了起来。我忍不住。他穿着无尾服戴着风暴兵兵颈托的样子太可爱了，脸被压扁了，还以为我真的会让他戴一整晚晚上。


    “是了，是了，”他嘟囔道。“我知道。我看起来很滑稽。你有完全的权利笑。”


    但我只是摇摇头，去拉他围在肋部的魔术贴带。我用力拉了一下，魔术贴清锐的声音在狭窄的门廊空间里回荡。


    “你在干什么？”他问。


    我移到圆环带，接着又拉了一下。魔术贴再次发出一声回响的嘶嘶声。“我在释放你，”我说。我又费了几步才让整个东西松动，但很快，我就把那个巨大的东西从他身上提了过来，布拉克克斯顿向后退了一步。他的头发乱乱的，脸也通红了。


    “好了，”我说，轻轻地把它放在台阶上。“你愿意戴这个对我来说已经足够了。非常足够了，”我补充道，双臂环住他，将他拉入一个温暖的怀抱中。


    “我真的是个混蛋，”布拉克克斯顿紧紧搂住我时在我耳边说。“我不应该对这件事笑的。但如果这让你感觉好受一点，我觉得你很可爱。”


    我向后一拉，拍了一下他的手臂。“你才没有。”


    他坚定地点头。“我绝对有，而且，老兄，能再次点头的感觉真好。”他用手抚过自己的脖子。“我看得出尽管戴着这个大……架子，你还是很漂亮，我很喜欢你的傲娇。”


    “你在撒谎，”我说，一点也不信服。


    “我知道你会这么说。”他从后口袋掏出手机，在屏幕上打开了一张图片。他展示给我看。起初，我以为是一张照片，但当布拉克克斯顿点屏幕时，我意识到那是一个视频。


    我看到一本客人签到簿，通过封面上凸出的姓氏意识到那是查德和薇的。“我记得你曾在我们的签到簿上留了一条有趣的留言，”查德的声音传来。“所以，薇和我昨晚把它找了出来并翻了翻。你瞧，瞧，我们就在你的签名旁边发现了那个有趣的留言。”


    镜头放大。我看到一个手写乱画的布拉克克斯顿的名字和姓氏。旁边有一行字写着：“等她摘掉颈托，给我介绍个对象吧。我想我喜欢她。”


    我倒吸了一口气。上面、下面和周围都有几十个签名，但我的眼睛几乎无法离开那个位置。


    布拉克克斯顿开口了。“我当时在笑，觉得那太好笑了，甚至在那时我就被你吸引了。我喜欢你教训我的样子。我应该道歉的，当然，但是……”他叹了口气，把手机塞回口袋。“我还有很多要学。现在也是。”


    我盯着他眨了眨眼有些困惑。“你真的觉得在我做了那种事之后，我会同意和你约会吗？”


    他笑了笑。“有点吧。如果我道歉的话。我曾希望过。”


    “好吧，”我说，抓住他的手臂。“我现在要和你约会了。”


    “是的，我真是个幸运的男人。”布拉克克斯顿弯下腰，从地上抱起颈托。


    他为我开门，我爬上副驾驶。在他把沉重的颈托放进后备箱后，布拉克克斯顿坐在驾驶座上，从口袋里掏出两张票。


    “我告诉过你要穿正式服装，但我没说我们计划了什么。”


    他把票递给我，我大声读出活动内容。“双人晚宴游轮！”我兴奋地尖叫起来，冲过去给了他一个拥抱。“你记得，”我说，手抚在胸口，沉浸在这一事实中。


    “记得？我在第二天第二天就预订了，铂金套餐，这意味着保证有靠窗位。”他俯身吻了我的嘴唇。


    “嗯，”我嘟囔道，“我等不及了。”


    “你知道我在兴奋什么吗？”布拉克克斯顿在倒车并扶正方向盘后说道。“我们面前的整个旅程。这让我想起——那句话是什么意思，你知道的，就是整个‘天空才是极限’之类？”


    我拍了拍嘴唇，露出了困惑的表情。“我觉得意思是潜力。”


    “天空才是极限，”布拉克克斯顿说。


    # 尾声


    ![Maggie](img/image_rsrc2A2.jpg)


