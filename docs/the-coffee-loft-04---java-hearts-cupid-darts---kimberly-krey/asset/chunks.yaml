    \n突然，我非常想知道这个事实是否也会吓跑布克斯顿。如果是这样，我宁愿让他现在就知道，而不是等我陷得更深之后再说。\n\n“布克斯顿，”我说，一只脚在铺了地毯的房间里，另一只在浴室的瓷砖地板上。\n\
    \n“嗯？”他手里抓着一条格子纹睡睡裤，没上衣。我清了清嗓子，因为在想着看到他那副结实、充满肌肉的胸膛而分了神。\n\n“我，呃，”我说，突然感到有些挫败。我走过去坐在最近的一张床角上。“我想让你知道一件事。”\n\
    \n他看着我，由于能量状态的突然转变，皱起了眉头。“好。”\n\n我的脖子发烫。我的喉咙收紧。“我从未告诉过一个男人我爱他，”我说。“也就是说……我从未谈过恋爱。”\n\
    \n我观察着他的脸，心跳得像愤怒的鼓点一样。他的目光扫过地毯，然后停留在床单上的某一点。\n\n他又点点头。“好。”\n\n“这让你觉得……我不知道……害怕和像这样的女人约会吗？”\n\
    \n布克斯顿摇了摇头，耸了耸肩。“不，并不真的。”\n\n我咽了口唾水，眼睛紧盯着他，在内心试图解读他的表情、姿态和声音。他是真的这么想，还是只是这么说？\n\
    \n“在我哥布莱恩（Blaine）的葬礼上，”布克斯顿说道，有效地将我从沉思中拉出来，“高中的几个孩子出现了——沃克双胞胎（Walker twins）。两个可怜的欺凌者。他们的成长环境糟糕，我想如果他们能活到那么久，最后也会变得像他们那对糟糕的父母一样。”\n\
    \n他叹了口气，继续说话时目光涣散。“但他们进来了，穿着合体的西装，满脸同情和得意的姿态，告诉我他们对我的损失有多难过。当我看着他们，甚至还感谢了他们时，你想知道我在想什么吗？”\n\
    \n他的脸变得僵硬，眼睛依然盯着墙上远处的一一点。“我满脑子想的都是‘他们了？沃克双胞胎还活得好，而布莱恩在棺材里。怎么可能’”\n\n他眨了眨眼，转过头锁定在我身上。“怎么可能？”他又问道，声音沉重而沙哑。“我很愤恨、愤怒……而且私下里希望死的是他们其中一个。该死，甚至是两个。在整整的一年里，我产生过很多想法，那种糟糕的想法。”\n\
    \n他向床近了一步，表情柔和了下来。“所以让我问你，既然那是我生活中几乎每天都困扰我的。这让你害怕和像我这样的男人约会吗？”\n\n我盯着他，哑口无言，在脑海中处理他的话。一当这些话进入大脑，我立刻站起身，冲到他身边，双臂环住了他。\n\
    \n“完全不会，”我说，不知为何我知道这就是他需要听到的一切。“当然不会。”\n\n他花了一会儿时间，但很快他的手就绕过了我的后背，起初很软，但随后他的触碰变得有力。\n\
    \n布克斯顿将额头抵在我的肩膀上，叹了口气。“我不担心你没有爱过别的男人，”他对着我的头发说道。“也许我可以成为第一个、最后一个，也是唯一的。”\n\n随着时间流逝，我们依然在彼此怀中，不知为何知道我们进入了萌芽关系中的另一个阶段。只要知道布克斯顿也有他自己的恐惧……其中的某些点让我觉得离他更近了。这不仅仅是相互的吸引；我们有某种联结。过去曾阻碍过我们的相似障碍。\n\
    \n当我思考他最后说的那句话时，我不禁希望也许，如果我们双方都愿意尝试，我们可以一起克服那些障碍。也许有一天，布克斯顿会成为第一个、最后一个，也是唯一我付出内心的男人。\n\
