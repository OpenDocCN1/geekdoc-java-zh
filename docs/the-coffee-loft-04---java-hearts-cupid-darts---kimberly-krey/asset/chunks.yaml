    At last, she moves the slightest bit. It almost looks like she’s nodding, but
    the action is so subtle I can’t be sure. The slightest hint of a grin lifts one
    of her rosy cheeks. She pins her lips over that grin, but I’m positive now that
    it’s there, revealing amusement or delight, I’m not sure which.


    “Okay,” she finally says. “Let’s stay the night.”


    Gertrude claps her hands and squeals.


    Inwardly, I’m doing that very thing. I don’t want this night to end, and it looks
    as if Maggie feels the same way.


    # 16


    ![](OEBPS/image_rsrc2A2.jpg)


    ## Maggie


    The sound of laughter fills our shared room for the night. There are two beds,
    just as was promised, but so far, neither of us has moved from the bed we settled
    onto when we arrived.


    The bucket of caramel popcorn rests on a tray in the center, along with a now-empty
    bottle and two champagne flutes. Braxton lies on his side, facing me while leaning
    on an elbow. On the other side of the bed, I lean against the headboard, hugging
    my knees to my chest.


    “So each of you guys has broken at least one bone,” I surmise from the stories
    Braxton just told.


    “At least one, yes.”


    “And all of you have had to get stitches someplace on your head.”


    “Yep,” he assures.


    I shake my head. “And here you were horrified over the story of me staring at
    light fixtures.”


    “Hey, I thought girls were different. Besides, what you did wasn’t normal,” he
    razzes. “Boys being boys…jumping off high branches, rooftops, or whatever else
    we could climb—that was all par for the course.”


    “Your poor mom.”


    “Yeah,” he allows.


    The quiet moment reminds me of the other things he shared tonight. It’s been nice
    to hear Braxton laughing as he relived several outstanding moments from his childhood,
    most of which included his late brother, Blaine.


    “I guess I should be saying, in your case, poor teachers,” Braxton says.


    I chuckle enough to feel the aching muscles in my stomach, sore from all of tonight’s
    laughter. “You can say that again.” Most of my outstanding childhood moments center
    around trouble with my teachers for acting out or sassing off. It was an effort
    to get one of my parents’ attention, of course, not that it worked.


    “And poor Kirsten,” I add. “She was the only one they could get hold of. Eventually,
    she started saying she was my mom. She’d apologize on my behalf.


    “And then, instead of getting angry with me when I got home, she’d pay close attention
    to my accomplishments and give me lots of praise. And when that wasn’t enough,
    she’d walk me next door to the Noblys and tell them all about the A+ I got on
    my paper or the B- I got on my English test—much better than the D I got last
    time.”


    Braxton groans. “I knew I was going to eat my crummy words about Jeb. If I’d had
    any idea⁠—”


    “You were just being honest,” I say.


    “While I, as someone once put it, lacked any semblance of proper bedside manner.”


    Heat floods my chest as I recall what he’d said to me after that comment. Some
    joke about me bringing up bedtime activities when we hadn’t even gone on a date.


    “What?” Braxton asks, making me realize I’m smiling.


    I hold his gaze for a blink before searching his handsome face. “I’m just…thinking
    how funny it is, looking back on our first few conversations. Now that I know
    you better, they seem more…”


    “Oh, no. More what?”


    I giggle. “More entertaining. I get you now, I think.”


    “Okay,” he says. “If you truly get me, what am I thinking right now?”


    It feels like a dangerous question. One that forces my mind to leap right back
    to the kiss we shared in the caboose. My gaze drops to his lips before rising
    back up to meet his. And there it is, that alluring spark of mischief I have come
    to expect and even love.


    He breaks our gaze enough to slide the tray to the foot of the bed. I watch as
    he tips the bottle, then each empty glass on its side, one after the next, before
    assuming his position once more, leaning on one elbow while facing me.


    Only this time, he’s closer. Much closer. Hints of his masculine, spicy cologne
    toy with my senses as he meets my gaze once more. “Where were we?”


    I grin. “I’m trying to guess what’s on your mind.”


    Braxton tips his head back. “Ah, right.”


    I run my gaze over him, taking in his late-night appearance. It’s past two in
    the morning now, and as each hour ticked by, Braxton adjusted his clothes. First,
    stripping off the suit coat and then loosening his tie. Next, he unfastened the
    top three buttons of his white-collar shirt and rolled up the sleeves, revealing
    his tan, muscular forearms.


    “Well?” he prods.


    My cheeks fill with heat. I laugh a little, feeling shy suddenly. “I don’t know.”


    “I told you about the stitches I got when Liam threw that tin can at me. I have
    a scar on my face from that. Can you see it?”


    I tip my head. “That’s what you were thinking?”


    “I was thinking that you should probably kiss it better.”


    I grin and blush again. “You were, were you?” I say, wanting to do that very thing.
    I straighten out my legs and scoot closer to him. “You should probably sit up
    so I can see better.”


    “Good idea.” He does, and soon we’re facing one another, legs crossed, knees touching,
    hearts racing. At least mine is.


    I lift my hands to his shoulders, surprised by how intimate the act feels. I’ve
    imagined what his stubble would feel like against my palms and dare myself to
    find out. With slow, rather tentative movements, I slide my hands over the open
    collar of his shirt. Gently then, I cradle his strong, chiseled jaw, reveling
    in the coarse sandpaper feel against my skin.


    Braxton lets out a sharp exhale.


    I love that he’s letting me do this—letting me study the features of his handsome
    face up close and personal. I trail my fingertips in a feather-light motion along
    his temples, forehead, and cheeks.


    He closes his eyes, and his breaths turn ragged.


    The action makes me realize how affected he is by my touch; I like that, too.
    I trace over the tiny crow’s feet at the corners of his eyes, the smooth plane
    of his forehead, and the delicate feel of his eyelids.


    Still no sign of a scar. Despite that, I lean in and press a kiss on his cheek,
    allowing my breath to linger over his skin.


    “Sorry,” I say, “I thought I saw something there. It was just a shadow.”


    He only gulps in return, and the sizzling chemistry between us burns hotter. His
    hands move to cup my knees, the warm feel of them enhancing the energy buzzing
    about the room. I search his face some more, lowering my gaze along his nose,
    chin, and back up to the peaks of his upper lip. At last, I spot it—a tiny, white
    line that cuts through his upper lip on one side.


    Heat warms warm in my tummy. I should have known it’d be there.


    I tip his chin the slightest bit, lower my head, and press a gentle, lingering
    kiss directly along the scar. Another thrill rushes through me, fanning the pleasure
    clear down to my toes. I don’t remember initiating a kiss before.


    Braxton opens his eyes to meet my gaze. The expression on his face shoots heat
    straight through me. Desire, longing, determination. His hands move up to my neck
    a moment before he leans in and closes the gap between us once more. With his
    lips a breath away, he whispers my name, then presses his full, encouraging lips
    to mine.


    I sigh, tipping my head as he deepens the kiss. He matches the sound with a low
    groan in his throat, his hands moving into my hair.


    Chills ripple up my arms as I savor every push and pull of his incredible kiss.
    Like the ebb and flow of the ocean tide, giving one moment, taking the next. Braxton’s
    masterful mouth is putting me under a heavenly spell, and all I can think is more.


    The single word awakens me somehow and reminds me of the boundaries I set. Boundaries
    I have no intention of crossing, no matter how good this feels. And this does
    feel good.


    “Braxton,” I mumble between kisses.


    He kisses me again, a series of slow, teasing delights. “Yes?”


    I pull back to meet his gaze, but his eyes are still closed. I grin at the blissful
    smile on his face.

