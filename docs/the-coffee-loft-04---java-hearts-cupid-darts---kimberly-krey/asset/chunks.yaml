  raw: 'Why Luke insists on calling Meg his ex-wife rather than just using her name
    is beyond me. She was once part of the family, after all. “Jackie’s awesome,”
    I say, addressing the comment about his daughter first. “I used to get eighty-five
    percent of the jobs I’d sketch up for potential clients. But with her digital,
    3D displays, I get every one of them.”


    “Which is why you’re so sure you’ve got this one with Maggie in the bag?” Beau
    asks.


    I nod, but deep down, I’m not nearly so sure. What I am sure about is that our
    paths will cross again one way or another. And not just because Beau is dating
    her sister. There’s chemistry between Maggie and me. A charged sort of energy,
    if you will. I felt it when she stepped into her office doorway, and I felt it
    again in the refurbished train car. That type of potential demands to be tested,
    and I’d bet money that Maggie feels it, too.


    “As for Meg,” I say, smiling as I mention Luke’s ex-wife, “she always liked me
    better than you. One drunken Christmas, in fact, she confided in me, saying she
    picked the wrong brother.”


    “Tsk,” Luke scoffs. “You’re almost ten years younger. She’s not a cougar.”


    I grin. “Correction,” I say. “Meg said she picked the wrong twin.” My gaze shoots
    to Liam in time to see his face turn redder than Luke’s hot wings.


    “Is that true?” Luke asks in a shocked tone.


    It is, but he probably doesn’t need to know. “Nah,” I say, not bothering to sound
    too convincing.


    The fact is, Luke wasn’t a good husband to Meg, and he knows it. And Gabrielle,
    Liam’s ex-wife, wasn’t great either; in fact, she treated Liam horribly. Meg rarely
    drank, but that year, she was having a particularly tough time dealing with Luke.
    She’d tipped back her second flute of champagne and said, ‘why couldn’t I have
    wound up with Liam instead? He’s nice, I’m nice—we deserve each other. Luke deserves
    to have someone like Gabrielle. She’s as mean as he is.’


    I glance about the table to see that both Luke and Liam have their gazes pinned
    on me, brows slightly furrowed, eyes deep in thought. I shift my gaze back out
    the window. I can’t be the only one who wonders if Meg and Liam will ever test
    the waters. Both are still single, after all, and I wouldn’t say either divorce
    is still fresh at this point.


    Just then, my phone starts to buzz.


    Beau leans far over to peek at the screen as I lift it. “Is it Maggie?”


    I pull a smug grin. “Maybe.”


    “Be nice,” Beau warns. “Not too nice.”


    “Don’t worry, she’s not my type.” I’m feeling extra cocky now, so I tap the speaker
    to let everyone hear. “This is Braxton.”


    “Braxton,” comes a voice that’s decidedly not Maggie’s. “This is Chantel from
    the Coffee Loft. We’d like to go ahead with the renovation. When can you start?”


    My brothers shake their heads, roll their eyes, and lean in slightly as I pause
    in answering.


    “One moment,” I say, muting my voice with a tap of the screen. I look at Beau.
    “I’m going to tell her that if Maggie wants me to do the job, she’ll have to call
    me herself.”


    Beau’s eyes bulge. “Don’t you dare⁠—”


    I tap the unmute prompt, effectively silencing him. “Chantel?”


    “Yes, I’m here.”


    “Maggie seemed…hesitant when I spoke with her. Does she happen to be anywhere
    near? If you don’t mind, I’d like direct confirmation from her before I map out
    the time.”


    Beau smacks his forehead with his palm.


    Liam and Luke chuckle under their breath.


    “Uhh…” comes Chantel’s voice.


    I grin wider, almost knowing Maggie is hovering over the phone at her side.


    “I’m right here, Braxton,” she says, practically growling my name.


    Heat sparks low in my belly. “Hi, Maggie,” I say in a sing-song tone.


    “We’d like you to go ahead with the project, please.”


    Triumph swells in my chest. “Exactly as-is? Or do you want to make change⁠—”


    “Yes, exactly as is,” Maggie blurts, sounding none too pleased about it either.


    “So you’re saying that what I presented to you was, in a word, perfect?”


    There’s a long pause, then a muted scuffle.


    “She had to attend to a customer,” Chantel says. “But yes, that’s what she’s saying.”
    That final sentence is coated in stifled laughter as if Chantel is enjoying this
    as much as I am.


    “That’s what I like to hear,” I say. “I can start right away.” I hang up and set
    the phone down. “And that’s how it’s done, boys.” I shoot Beau a look, itching
    to get under his skin once more. “Tell Maggie not to fall too hard for me,” I
    say, rolling my shoulders back and puffing my chest. “My brother tells me she’s
    off limits.”


    # 6


    ![](OEBPS/image_rsrc2A2.jpg)


    Maggie


    Dart Number One: Cupid’s Clash


    Anger and passion, baby—you can’t have one without the other.


    I scarf down chapter one like it’s the first meal I’ve had in years. And then
    I devour it again while hovering over a steaming bowl of leftover pho.


    Lovely dips into the topic playfully at first, mentioning memorable scenes from
    literature and cinema alike. Next, she goes deeper, quoting brilliant scholars
    like Harriet Lerner, who wrote The Dance of Anger because, apparently, there is
    one. Lovely speaks of the way we rise to it, fall from it, and even become addicted
    to it. She sneakily points out that our mishandling of this emotion might just
    be the downfall of our prior relationships. But who’s interested in the past?
    I think, just tell me how this helps me find Mr. Right.


    I decide not to read the author’s personal inscription until I’m done reading
    the book in its entirety—a delectable treat after a satisfying meal.


    Cupid’s clash, huh? A minor quarrel might be all it takes to spark something.


    I fall asleep with those thoughts imprinting on my brain.


    The next morning, I hit the grocery store, somehow knowing that Cupid is ready
    to strike. I’ve opened the door. I’m letting him in. And since I know my track
    record, I need him to come quick, before I swing back to my state of aversion.


    That very thought runs through my head as I spot a seriously attractive man pushing
    a cart filled with fresh seafood and classy produce items like butternut squash
    and red peppers. We pass each other mid-way down the coffee aisle when a sudden
    urge strikes. Call it intuition or perhaps food poisoning from the leftover pho,
    but soon, I’m giving in to the impulse.


    I rush down the remainder of the coffee aisle, circle around to race halfway up
    the cereal aisle, then frantically spin the cart in place and hurry back toward
    aisle five at lightning speed.


    I fly past instant oatmeal, countless cereal brands in boxes and bags, and a jar
    of Merlyn’s Marmalade, which nearly derails my flight—I thought they stopped making
    that. All the while, I imagine cutely bumping into Classy Produce Guy’s cart.
    I’m on an unspoken, irrational mission, and not even Merlyn’s Marmalade can stop
    me.


    I take the corner to re-enter the coffee aisle like a stuntwoman on steroids,
    yet before I can orchestrate a cute, bumper-car style bonk, I crash into my suspect’s
    cart hard enough to make the handlebar reverberate against my palms.


    The crab legs in his cart leap into the air, performing a pirouette over the butternut
    squash.


    The red peppers tumble, whirl, and fling right out of the produce bag. The blushing
    veggies barrel into a small, white box in the corner of his cart.


    I stare at the disrupted sight for a blink, eyeing the crab legs which, from this
    angle, seem to be taking a bow. I glance back to the disheveled peppers and the
    box they’re nudged against. Two words stand out in turd-brown text: Stool Softener.


    I glance back up at him, somehow feeling as if the Hallmark moment has been tainted
    by the stool softener but hoping it’s just something we’ll joke about later instead.
    Remember when we first met…


    He meets my gaze at last, and my hope for the meet cute withers and turns to ash.


    His brow furrows, which hardens the rather bloodshot eyes beneath. I can’t help
    but wonder if he spent an unproductive night on the toilet, longing for the stool
    softeners now resting in his cart.'
