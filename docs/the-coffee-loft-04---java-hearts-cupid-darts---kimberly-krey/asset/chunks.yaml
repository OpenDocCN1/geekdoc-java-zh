    ★★★★★ “每个人的图书馆里都应该有一本金伯莉·克雷伊的作品。甜蜜纯洁而又浪漫，充满惊喜。” (N Rapp)


    ★★★★★ 2021 年《InD''tale》杂志卓越心灵奖


    ★★★★★ “在没有描写露骨性行为的情况下表达出化学反应……这是我只在几本小说中见过的才华……这是最棒的好莱坞魔法。克雷女士知道如何描写这种魔法。” djsugarrn
