  trans: '

    女人一边重新系好围裙上的绳带，一边点了点头。“没问题。我这就去把它拿过来。或者如果你愿意的话，我可以帮你倒。省得弄得很乱，”她提醒道。


    我摇了摇头。“现在用杯就行了，谢谢。我先喝几口这个。”


    我端起温热的马克杯放到唇边，轻轻吹了气，然后谨慎地抿了一口。啊，太好喝了。希望我能克服麦奇和我和之间那种尴尬的氛围，因为我觉得自己可能戒不掉咖啡了。它轻而易举地击败几英里的竞争对手。


    “好的，”主持人说，“现在是我们今晚的第五组也是最后一组情侣了。最后这对组合可能有优势，因为他们已经看到其他几个人是怎么做的，但他们的劣势在于他们必须面对的竞争对手。到目前为止，大家表现都很棒，对吧？”


    人们鼓掌欢呼，鼓励着我心不在焉地加入其中，而我随之又喝了一口水。


    “有一只小鸟告诉我，我应该咨询一下就在那里的那对情侣，”女人继续说道，“就是穿蓝衫的那个和穿白色毛衣的女孩。”


    我花了一会儿才意识到她指向的是凯尔斯（Kirsten）和博（Beau）。我笑了，决定自己也许可以留下来。我很想看看博在上面努力取悦观众时满头大汗的样子。


    “你们叫什么名字？”她问道。


    “我是博，这是我的女朋友凯尔斯。”


    “但是，我们并不打算自己上台，”凯尔斯插话道，“我希望你能让我姐姐麦奇（Maggie）——也就是这家店的老板——和这个伙子一起上台。”她伸出手揉了揉我的肩膀。“他叫布克斯顿（Braxton）。”


    我摇了摇头，但观众已经开始欢呼了。


    “这个主意不错，”女士说道，环视着人群。“麦奇？你在哪儿？”


    “她走了，”我提议道，“我正准备—”


    “不，她不在，”咖啡吧旁传来一个熟悉的声音。是尚特（Chantel）；她直接站在麦奇身后，像展示待宰羔羊一样把她推了出来。


    麦奇看起来很恐慌。她眼睛睁大，满脸通红，不停地摇头。“我不认为这是个好主意。”


    “你不这么认为？”拿着麦克风的女人问道，然后转向观众。“观众怎么想？你们想看到独一无二的麦奇·莫德拉（Maggie Modella）和这位帅气的绅士联手吗？”


    观众欢呼助威。麦奇的脸颊烧得更红了，我不禁享受她正遭受尴尬之苦的事实。尽管我很讨厌再留下去，但我并不害怕站在观众面前。事实上，在高中毕业年那年，我兼顾了橄榄球和戏剧，为了能和劳里·迈耶斯（Laurie
    Meyers）一起参加学校的音乐剧。我们拿到了主角，这意味着我可以亲吻她。我在舞台上感到异奇地舒服，即使我必须在整个毕业班级面前唱那些多情肉俗的情歌；在内心深处，我知道自己也是大多数男人的嫉妒对象；因为每个人都想要得到劳里。


    我站起身，目光落在被尚特鼓励性的搀扶下那个心不情愿的女人身上。


    “只要麦奇愿意，我就加入，”我说，对着观众笑，他们的目光在麦奇和我之间来回游视。


    群体欢呼得更响了。


    “噢，”拿着麦克风的主持说，“你们听到了吗？你怎么说，麦奇？”


    麦奇的眼睛大了。她脸上的红晕蔓到了整个脖子。如果我不表现得这么开心，我可能还会为鼓励这种事感到内疚。


    “加油，小麦雀（Magpie），”我说，用了我听凯尔斯用过的名字。“你和我可以一起写一个爱情故事，你不觉得吗？”


    “好，”她勉强说道。我不禁露出了得意的微笑。我本以为麦奇会有个更好的扑克脸。


    “行吧，”她应付道，目光扫过人群。“麦奇？你在哪儿？”


    麦奇的眼睛睁大了。脸上的红晕顺着脖子向下。如果我不表现得这么开心，我可能还会为鼓励这种事感到内疚。


