    “不，大家听见也没关系，”玛姬说道，“我的意思是，我最近参加了一场接又一场的婚礼，看着我所有的朋友一个个结婚。薇薇一直在我面前夸你天很好。我当时在想，也许我终于要遇到我的真命了。在那之前我一直把男人拒之门外，但那时恰好敞开了心扉，希望你也许就是那个对的人。而在你对我采取了那种态度之后，我又彻底关了心门。”


    我翻了个白眼。“你现在是在怪我吗？”


    “我真不敢相信你居然那样翻白眼。是的，我是在怪你。你对我太差了。”


    “我甚至根本不认识你。”我后退了一步，上上下打量着她，纳闷我们刚刚走进了一个什么样的疯狂的世界。但随后我突然反应过来——我完全清楚玛姬现在在做什么，而我绝不会让她得逞。


    我严厉地盯着她。“你忘了可不是只有你这一个在玩这种游戏的人吗？”


    “游戏？”她尖叫道。


    我点了点头。“我也有恐惧，我可以把一切归咎于过去，寻找各种理由退出一段关系或拒绝寻找爱情……”我走向柜台，眼睛紧紧盯着她，“但归根结底都是我们自己——不是别人。”


    “我再也不想听这些话了。”玛姬后后柜台，冲出厨房跑向前厅。


    “玛姬，等等！”我想跟她出去，但博格伸出一手臂拦住了我。


    “我去陪她，”凯斯汀说，她先看了看博格，又看了我，“她没事的。她只需要一点时间冷静一下。”


    我点头表示回应，但不确定她是否会改变主意。


    我在脑海中重演了自己表达爱意的方式，以及她无法回馈这份情感。我很受伤，但也能接受。我不希望让玛姬感到仓促。


    尽管如此，如果她感到恐慌，如果她在我们感情加深之际正寻找退路，这正是她会用来分手的理由。


    薇薇跟着凯斯汀走了，没有任何人提出反对。


    “抱歉了，哥们，”查德在跟着妻子出去时对着肩膀说道——个叛徒。


    我的兄弟们神情凝重地围着我，直摇头。他们经历过这种事，甚至经历过比这更糟糕的。他们娶了自己认为是真爱的人。他们一起有了孩子，然后面临了最恐惧的时刻——一切分崩离析。


    也许时机并不那么糟。如果玛姬注定某天会离开我，也许现在离开比以后要好。也许我的恐惧比我想象的更有好处。像玛姬这样的人和我，或许独处会更好。


    ![](img/image_rsrc2A3.jpg)


    # 布拉克克斯顿


    我举起手臂，让手中的马克杯与桌中央的杯子碰撞出清脆的声音。我不经常喝酒，这玩意儿劲很大。我感到头晕眼花，视线模糊，脸部部分感到麻木。


    “为了兄弟情干，”卢克兴昂地大叫道。


    “是，”我含不清地说道，“你们是我唯一真正信任会留在我身边的人。”


    “那不是，”博格拍了拍我的背。


    利亚姆皱了起脸。“就让他发发他的同情秀吧，行吗？”


    “行，”我责备道，“你这个大……”我在脑子里搜寻着词，发现自己的词汇量已经枯竭了。“坏……脸蛋。”


    “天哪，你真的不常喝酒，对吧？”卢克笑了起来，其他人也跟着笑。


    “他才喝了一口啤酒，”我听到利亚姆说。


    博格又拍了拍我的背。“他是我们的小兄弟。”


    “别像我不在一样谈论我。”我想起服务员在我们点第一轮酒时用过一个词。“这些杯子太大了。而且别装作你们没要过猛的。我听见你说过高小费。”当听起来不对时，我又试了一次。“高。我的意思是，高点。”我像推开传染源一样推开博格的手，感觉每一分钟都变得更加焦虑和易怒。


    “你和凯斯汀那段完美的感情，”我冲口道，“顺便说一句，在经历了那些事后，她本应该比玛姬更难信任男人。”


    我发泄出多年来背过的指责，背诵着我所有感到恐惧的理由，并为自己这次能坚持下去而感到自豪。


    我第二个杯子里的金色液体变少了，天花板上的灯光开始摇晃，但我的信息必须被传达。“就因为我三年前做的某件事？”我抱怨道，“放过去吧。”


    “这不是我预想的今晚进展，”卢克对利亚姆说道。


    “我也是不是，”利亚姆同意道。


    我缩了一下。“噢，我对你们来说太无聊了吗？”


    “是太爱抱怨了，”卢克咕囔道。


    博格站起身，从钱包里掏出几张钞票扔在桌上。“你们为什么不去吧台开个新单呢？我会确保布拉克克斯顿安全回家。”


    我不知道是怎么发生的，但很快，我，我安全到家了。


