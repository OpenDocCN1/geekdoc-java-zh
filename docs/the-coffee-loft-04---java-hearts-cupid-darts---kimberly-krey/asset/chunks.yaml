    pulls at my throat.


    Braxton sticks his head inside.


    “What do you want?” I snap, my fists landing on my hips.


    “Just ah…” He pauses there, letting me drown in my agitation without so much as
    a life vest. “I wanted you to know that if I don’t hear from you by this time
    tomorrow, I’ll assume it’s a no and move down the list. I put you in front of
    my other jobs as a favor to Beau and Kirsten, but you can’t stay there forever.”


