    我的眼睛瞪得滚圆。下巴掉得厉害，简直得要用起重机才能从地板上抬起来。那种在血管中流淌的尴尬感滚热得足以让我的下一次呼吸点燃火焰。


    叮。


    “至少，自大先生是这么认为的，”我说，“那个可怜的家伙太自恋了，不由得觉得别人也在崇拜他。Maggie 像任何负责任的人会做的那样，确实检查了 `Braxton`
    的杰作。她也确实给了他应有的赞誉。尽管如此，当她说船底看起来很坚固很结壮时，Braxton 听到了他心里那个版本的赞美。在他脑子里，Maggie 是在说他的二头肌、三头肌和他那粗壮的脖子看起来坚固又结壮。”


    “粗壮的脖子？”Braxton 嘴唇着，眼神困惑地挠着下巴。


    “他非常自信认为她已经开始喜欢他了，事实上，Braxton 开始为了报答这种想象中的恩情，每天告诉 Maggie 她看起来有多迷。”


    叮。


    得意吧，Braxton。


    “这并不难，”Braxton 说，带着一种流氓式的神情上下打量着我。


    热流现在新的地方升起，温暖而刺痛的火花在我的小腹下方跳动。


    “她每天看起来确实很好，”他继续道，“而且，她自己也清楚。然而，有一天，当 Braxton 忙于工作而 Maggie 在附近时，他发现一只八条腿的生物正沿着她的背爬下来。她正弯着腰系鞋带，一边对着耳机里放的任何歌曲唱歌——很可能是金属摇滚乐队。但我偏题了；有一只蜘蛛正朝着
    Maggie 的臀部而去，Braxton 需要迅速行动。他很清楚自己该做什么。”


    我在心里呻吟，希望 JJ 能把话还给我，但那个女人看起来实在太感兴趣了。事实上，整个群体集体地向前倾身，就像一个人类磁铁刚刚在舞台上挥了魔术棒。


    他清了清嗓子继续道：“高大强壮的 Braxton 放下工具，在牛仔裤上拍了拍灰，以超级英雄的速度向那个需要他服务的女性冲去。那只蜘蛛似乎随着他的每走一步都变大，用它毛茸茸的腿和大圆眼诡异地向她的后背部移动。就在他赶到时，那个有毒的东西正绕过她的后臀，露出了它匕首般锋利的牙。毫不犹豫，Braxton
    勇敢地举起手，‘啪’的一声响亮地把那玩意儿直接从她的屁股上拍掉。”


    观众欢呼叫好。


    “Maggie 迅速转过身面对他。Braxton 本准备解释他为什么要这样做，知道她会大发雷霆，但在他话出口之前，她脸上的表情就让他停住了。”


    我等他详述，眉头紧锁。我将拳头抵在腰上。


    “她没有对他皱眉，也没有用怀疑的眼神看着他。相反，Maggie 正对他露微笑，并眨着睫毛。这只意味着一件事。”Braxton 凑近说完最后的话，眼睛死死盯着我，“她喜欢了！”


    我吸了一口气。


    叮。


    我在人群中扫视四周，捕捉到屋子里每张脸上的喜悦和趣味。这些都是我的顾客。我不能在这里失去冷静，我绝不会让他占我的上风。“什么……”

