    “我觉得你是对的。”我把橡皮擦揉成一个球，按在桌面上，然后将笔尖没入纸团，让它直立起来。等手空闲了，我站起来将 Maggie 拉近了一些，在她脸颊上亲了一下，然后向她那诱人的双唇吻去。“你真的把这件事提升到了新高度，”我对她说，“我一直为自己的跳跃性思维感到自豪，但你有很多新鲜的想法。”


    “也许是你变得有点呆板了，”她调趣道。


    “噢，我没有，”我说，戳了戳她肋骨下方一个痒点。


    Maggie 尖叫一声，躲开我朝厨房跑去。“你可能真的吧，”她再次调趣道。


    “而你可能很痒，”我说，追上她并再次戳了戳她的侧腰。


    她笑得太厉害，话都说不利。


    “看看你，”我欢快地说，“这么怕痒。”


    “我打赌你也是。”她伸手同时捏了住我肋骨的两侧，导致我的肌肉痉挛紧张，但至少我避免了像个女学生一样咯咯大笑。


    尽管如此，当我缩回身体时，Maggie 挣脱我的抓握，冲向沙发。


    “你像个调皮的孩子，”我指责道，这让她笑得更开心了。


    她落在沙发上几秒后，指着我书架的最底层。“Braxton，”她屏息道，“那是《谁猜我》（Guess Who？）吗？”


    我点了点头笑了。“如果我家里没有几个游戏，我算个什么样的叔叔？为什么？你想玩吗？”


    “我当然想玩，”她热切地说，“好久没玩了。”


    “好，”我说，我很喜欢她俏皮有趣的样子。和 Maggie 在一起，惊喜不断，我我喜欢这一点。我想象着她成为我生活中重要的一部分。家、家庭、未来。我们的关系充满了可能，我不禁希望她就是那个人。


    我们面对面坐在地板上，摆好游戏板。随着情人节的临近，我有一件事一直想问她。一件我希望她会答应的事。


    “嘿，”在我们开始之前我说。“我父母很快要举办周年纪念活动了。是个大派对，四十五周年，我很希望你能陪我一起。”


    她的眼睛愣了一下，然后眯了起来，仿佛在考量。


    我胸口处升起一阵不安的热度。我希望她不要觉得我进展太快了，但事实是，我看到了 Maggie 成为我生活的一部分。我想那样，我不想浪费时间或玩游戏。


    “我想把你介绍给所有人，”我补充道。


    “真的吗？”


    我点了点头。“是的。”


    “四十五，哈？”


    “他们结婚得很早，”我解释道。“他十九岁，她刚满十八。校恋。”


    她笑了，我的忧虑消散了。“太棒了。是的，我很乐意。”


    我叹了口气。“好。还有几周时间。他们是在情人节结婚的，但我们会在前一天晚上庆祝，所以不会影响到节日。”


    Maggie 的笑容扩大了。“你父母是在情人节结婚的？”


    我耸了耸肩。“还能说什么呢？他们是真正的浪漫主义者。”我看了一眼游戏板，拇指滑过角色卡，然后重新看向她。


    “你知道吗，”她轻声说，“我以前从未在情人节约过会。”


    我挑了挑眉。她以前交往过什么样的笨蛋？“你没有？”


    她摇了摇头。“我猜每年到那个时候，我从没有认真交往过任何人。感觉那里是留给那种……比如，正式情侣的，你懂。”


    “嗯。”我点了点头。“对你来说，完美的情人节约会是什么样的？”


    “我一直觉得在情人节去参加那种浪漫的晚餐游轮会很有趣。在水上的豪华轮船上度过夜晚——美食、轻音乐，还有跳舞。而且你可以打扮一下，我觉得偶尔打扮一下挺好玩的。”


    她凝视着我的目光，那双琥珀色的眼睛融化了我内心的新领域。“听起来很完美，”我说，但在游戏开始之前，我又开口了。“Maggie？”


    她抬头看向我。“嗯？”


    “今年做我的情人节约会对象吗？我承诺会那一个难忘的夜晚。”


    她笑着咬了咬嘴，这是我注意到几次的一个非常可爱的动作。


    “没问题。”她点了点头，脸颊泛起粉红。“我等不及了。”


    我报以微笑，无法抵挡地越过游戏板，吻在她的唇上。我测试了自己，确保恐惧没有回来。对我来说，并没有。我只希望 Maggie 也能这么说。


    我再次吻了她，然后退开，直视她的眼睛。“我也不一样。”


    # 18


    ![](img/image_rsrc2A2.jpg)


    ## Maggie


    幸运箭四号——丘比特神之作


    在造物的核心是爱。


    可爱的 Maggie 在这一章中展现了她精神的一面，而我非常喜欢。


