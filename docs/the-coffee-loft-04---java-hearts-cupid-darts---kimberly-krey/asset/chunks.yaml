    \ Bonding）\n\n听说过创伤纽带吗？\n\n[content]\n[ \n[/content]\n\n![](img/image_rsrc2A3.jpg)\n\
    \n## 布克斯顿\n\n创伤纽带（Trauma Bonding）\n\n丘比特（Cupid）的创伤纽带\n\n[content]\n[ \n"
