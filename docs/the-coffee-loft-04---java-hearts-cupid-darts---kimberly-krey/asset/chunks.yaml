    # 5


    ![](OEBPS/image_rsrc2A2.jpg)


    ## Braxton


    “Trust me when I tell you…” I lower my chin and look at each of my brothers pointedly
    one by one. “I may have ruffled her pretty feathers, but she will definitely call.”


    Our food came moments ago, but it turns out Beau has a greater appetite for the
    details of my meeting with Maggie than he does for the combo plate he ordered.


    Beau shakes his head. “I wouldn’t be so sure. And why’d you have to ruffle her
    feathers?” His eyes narrow. “If you somehow mess things up between me and Kirsten,
    I will kill you. You know that, right?”


    “I’ll help,” Luke adds, dunking his Nashville hot wings into a tub of ranch.


    Beau flexes his biceps by resting his elbows on the table. “I won’t need any help.”


    “You guys think I can’t take on a bunch of old-timers? We’re not kids anymore.”
    I grin, matching Beau’s posture so my biceps bulge as well. “I’m in my prime,
    baby, and you guys are nearing the days of hearing aids and toupees.” I’m exaggerating,
    of course, but the truth is, Beau, Luke, and Liam are in their forties, while
    I’m a young thirty-three years old.


    “Don’t worry, brother,” I say, “I’ll keep it strictly professional, just like
    you asked.” I pop a brow. “No matter how bad she wants me.” Or how badly I want
    her, but I don’t add that part.


    Beau groans.


    “You don’t know women as well as you think you do,” Luke says before taking a
    bite of his chicken. Ranch oozes down his fingers.


    Luke’s twin, Liam, shivers. “Can’t believe you can eat it with that much sauce.
    That’s not natural.”


    My confidence might be heightened by sheer desire to see Maggie again. To show
    her exactly what I can do with that place. Maybe then she’ll understand my frustration
    over Nobly’s outdated approach to the job.


    “Hey,” I say to Luke. “You saw the design I came up with. Do you think she’s going
    to swallow her pride and have me do the job or not?”


    I’m looking for affirmation because this is one job I do not want to lose. Luke’s
    the best source since Jackie, his oldest daughter, is the one who transforms the
    blueprint into a three-dimensional online experience. Potential clients can practically
    do a walk-through of the space before I even start. Jackie is dang talented, and
    I’m lucky to have her while she’s working toward her degree.


    Luke shakes his head. “Nah, she won’t pass it up.”


    Liam pipes up. “What if Maggie takes your design and has someone else do the job
    for her?”


    The idea hits me like a kidney punch; I hadn’t thought about that. “I’d be ticked,”
    I admit. “Not that anyone would do it as well as I would.”


    My older brothers, who all work in the same building doing different jobs, meet
    for lunch regularly. I join them when we’re together, which is de-present for
    a couple of months. The fact is, it’s almost easy to picture. It moves from my
    mind to my heart like the steel sphere in a pinball machine, triggering old wounds,
    and a sense of loss that could paralyze me for days. Blaine was close to my age—just
    two and a half years older. When we were kids, we’d defend one another against
    our older brothers, even if it was just for play. Them against us—the Goliaths
    against the Davids.


    Wait, the text is de- the the the the the the the the the the the the the the
    the the the the the the the the the the the the the the the the the the the the
    the the the the the the the the the.


    “Has anyone else been thinking about Blaine lately?” I barely mean to speak it,
    but a part of me is dying to know. I can’t be the only one reeling from recurring
    waves of grief.


    “Yeah,” Beau says first.


    “It’s worse this time of year,” Liam adds. “Reminds me of the nights we drove
    around looking for him, hoping to drag him off the streets.”


    “I remember we took him that specialty sleeping bag when he refused,” Luke adds,
    plunging more chicken into his ranch.


    “Which he probably just sold for drugs,” I say.


    “Then you went and built him that tiny home fit for a king in Mom and Pops’ backyard,”
    Luke says. “You always did have a bleeding heart.”


    I ignore the bitterness in Luke’s tone. He still resents the fact that Mom and
    Pops spent part of their nest egg to put Blaine through a sobriety program, something
    Luke was certain was a lost cause.


    “You were good to do that for him,” Liam says, his face thoughtful.


    “Yeah,” Beau agrees. “You were good to Blaine. The fact is, he just didn’t know
    how to be good to himself.”


    It goes quiet as I turn my gaze out the window. Birds soar over the pier, the
    blue sky at their back, their echoing cries carrying beyond the glass.


    “This is a crap topic,” Luke says. “Getting back to this mock-up you did for the
    caboose… Jackie says it’s her favorite design yet. I’m sure she’d agree with you
    that Maggie won’t be able to turn it down. And,” he adds, cleaning his fingers
    off a napkin, “while I don’t like admitting this, my ex-wife can’t stop talking
    about how wonderful you are for giving Jackie this chance to work for you while
    she’s going to school.”

