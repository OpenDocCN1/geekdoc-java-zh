    “I’m liking this,” he says softly. “Why are we stopping?”


    I laugh. “Because we can’t keep going all night.”


    “I can,” he quips.


    I laugh again, swatting his arm. “Stop,” I say. “We should probably…get into our
    pajamas and pick a bed.”


    “Okay,” he says, sobering and meeting my gaze at last. “I pick whatever bed you
    pick.” He laughs and shakes his head. “Kidding, Maggie, you know that, right?”


    I nod because I do know that. He said he’d be the perfect gentleman, and I believe
    that he will.


    Still, I like the way he teases me. Braxton is fun to be around, and he seems
    to have a way of making me feel safe and desired at the same time. I consider
    that as I unzip my overnight bag and pull out my PJs—a matching camisole and shorts.


    “I’ll change in the bathroom,” I say, “and you can change out here.”


    “Works for me,” he says.


    I walk slowly toward the bathroom door, an intrusive thought popping into my mind.
    I’ve never been in love. Would that fact scare Braxton away? It’s not as if we’re
    terribly young anymore. When I shared that fact with Jaxon—the only guy I came
    close to getting serious with—he called it a red flag. I, in turn, considered
    that a red flag and ended things. Kirsten said it was just an excuse of mine—my
    way of breaking things off like I always do.


    Suddenly, I’m dying to know if the fact would scare Braxton away, too. If that’s
    the case, I’d rather he know about it now than later when I’ve gotten in even
    deeper.


    “Braxton,” I say, one foot in the carpeted room, the other on the tiled bathroom
    floor.


    “Yeah?” He’s clutching a pair of checkered pajama pants in one hand, no shirt.
    I clear my throat, distracted by the idea of seeing that full, muscled chest of
    his.


    “I um,” I say, feeling deflated suddenly. I walk over and sit on the corner of
    the nearest bed. “I want you to know something.”


    He looks at me, his brow furrowing from the sudden shift in energy. “Okay.”


    My neck gets hot. My throat tightens. “I’ve never told a man I love him,” I say.
    “Which is to say that…I’ve never fallen in love before.”


    I watch his face, my heart pounding like an angry drum. His gaze moves over the
    carpet, then settles on a spot on the bedspread.


    He nods again. “Okay.”


    “Does that make you…I don’t know…scared about dating a woman like me?”


    Braxton shakes his head and shrugs. “No, not really.”


    I gulp, eyes pinned on him, inwardly trying to decode his expression, his posture,
    his voice. Does he mean that, or is he just saying it?


    “At my brother Blaine’s funeral,” Braxton says, effectively pulling me from my
    musings, “a couple of kids from high school showed up—the Walker twins. A couple
    of miserable bullies. They had a horrible upbringing, and I figured they’d end
    up just like their messed-up parents if they even lived that long.”


    He sighs, his gaze glossing over as he continues. “But in they come, all sympathy
    and success in tailored suits and sullen faces, telling me how sorry they are
    for my loss. And as I looked at them, thanked them, even, do you want to know
    what I was thinking?”


    His face goes hard, eyes still fixed on a distant spot on the wall. “All I could
    think was, ‘they made it? The Walker twins are alive and well, and Blaine’s the
    one in that casket. How?”


    He blinks and turns to fix his gaze on me. “How?” he asks again, voice heavy and
    coarse. “I was bitter and angry and…and secretly wishing it was one of them. Heck,
    even both of them. For a solid year, I had more thoughts like that, horrible ones.”


    He takes a step closer to the bed, his expression softening. “So let me ask you
    since that’s something that haunts me nearly every day of my life. Does that make
    you scared about dating a man like me?”


    I’m speechless as I stare at him, processing his words in my mind. As soon as
    they register, I rush to my feet, hurry over to his side, and throw my arms around
    him.


    “Not at all,” I say, somehow knowing it’s all he needs to hear. “Of course not.”


    It takes him a moment, but soon his hands slide around my lower back, weak at
    first, but then his touch grows stronger.


    Braxton rests his forehead on my shoulder and sighs. “And I’m not worried that
    you haven’t loved some other guy,” he says into my hair. “Maybe I can be the first,
    the last, and the only.”


    We stay in each other’s arms as the minutes tick by, somehow knowing we’ve reached
    another stage in our budding relationship. Just knowing that Braxton faces fears
    of his own…something about that makes me feel closer to him. There’s more than
    just a mutual attraction; we have a connection. Similar barriers that have held
    us back in the past.


    And as I reflect on the last thing he said, I can’t help but hope that maybe,
    if we’re both willing to give this a try, we can get past those barriers together.
    Maybe one day, Braxton will become the first, the last, and the only man I give
    my heart to.


    # 17


    ![](OEBPS/image_rsrc2A2.jpg)


    ## Maggie


    ## Dart Number Three: Cupid’s Catastrophe


    Ever heard of trauma bonding?


    I’m back in feast-mode as I read about the next dart. I’m still floating on the
    high of the best date I’ve ever been on. Braxton and I shared ongoing laughter,
    incredible kisses, and a deep connection that has me shaking my head. This must
    be how people fall in love, I muse, more hopeful than I’ve been in years.


    As I take in the topic of trauma bonding in `Lovely`s book, I can’t help but see
    Braxton’s face, taut with anguish and grief. ‘Does that make you scared to date
    a man like me?’


    My heart aches at the mere recollection. I don’t remember a time a man allowed
    himself to be so vulnerable around me. I hate that those thoughts haunt him, thoughts
    he had no control over. Thoughts he’s decent enough to realize weren’t fair or
    good. But they sounded—to me, anyway—normal. We’re flawed, after all, each and
    every one of us.


    I shift to consider the other things I learned on our date. Every time I think
    I’ve figured out who Braxton Wheaton is, he adds another layer. Talented carpenter
    with a rebellious glint in his eye—check. A man who cares about his neighbor enough
    to scoop dog poop off his lawn—check. A deeply wounded brother who’s still reeling
    from the loss in his own way—check. And he chose to open up to me about it.


    The chapters on Cupid’s Catastrophe explain that trauma bonding can happen by
    not only experiencing a traumatic incident together, but also by vulnerably sharing
    past experiences you don’t share. When there’s a common thread in those experiences,
    the bond is even greater.


    With all these mounting affirmations, I can’t help but think that Cupid has finally
    struck at last.


    ![](OEBPS/image_rsrc2A3.jpg)


    ## Braxton


    Maggie and I find time to hang out the day after our date and the day after that,
    too. Once the weekend comes to an end, we hang out after work each night, snuggling
    in a cozy nook in `Coffee Loft` one day and going to my place the next. We spend
    time at her place, too; it’s bright, colorful, and it smells good—just like Maggie.


    As the weekend approaches once more, I ask her to help me create a coffee bar
    for my parents’ master suite—an anniversary gift for the two of them. It’s something
    my mom has always wanted, and my father hoped to give her one day. Having Maggie’s
    help for the project makes me glad I put it off until now; she has more expertise
    in this area than anyone.


    I consider that as I hover over the mock-up I sketched out at my dining room table.
    I grip the architect pencil close to the tip while kneading the putty eraser with
    the other hand. “I think that’s it,” I say, taking in our creation like a proud
    parent.


    She reaches down to place a kiss on my cheek. “We make a good team. She’s going
    to love it. They both are.”

