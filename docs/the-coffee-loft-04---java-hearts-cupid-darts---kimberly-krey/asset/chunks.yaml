  trans: '

    此刻我脑海中想不出任何妙语的话。没有红眼先生那种“走路看着路”的对白，也没有刻薄的热讽。他只是给了我一个警惕的点头，小心翼翼地绕过我，朝着谷物区走去。


    “抱歉，”在他走过后，我勉强说道。


    在健身房，我发现了“帅气胡子哥”，又名“三 G 男”，他正在划船机旁踱步。我以前在这里见过他——谁没见过他呢？但我从未胆敢跟他搭话。我也没能通过在附近健身来吸引他的注意力。“单车双胞”——一对穿着霓虹色连体衣的单车课狂热粉丝——以前追求过他，提议去街街头的果汁店为他买杯奶昔。他拒绝了，但旁边一个穿着质量堪疑的紧身裤的男人提议加入他们。


    然而今天，当我看着 `Triple G` 侧眼盯着设备，显然在等那个老头（他今天穿了件豹纹连体衣）擦完座位时，我突然产生了一个主意。是的，我产生了一个绝妙、危险且可怕的主意。


    在我还没来得及反悔之前，我已经冲向了健身房。


    我轻快地穿过爬楼梯机、收腹机，以及那对正在饮水机旁等着接水的、没作多想的单车双胞。豹纹男正懒洋洋地用湿巾擦着手柄。`Triple G` 走近了一些，但我动作得更快，像一个灵敏的仙女，眼睛紧盯着目标。我滑入位置，就像在比赛的最后一局击中本垒一样。实际上，并没有滑得那么优雅，更像是一声“咚”的闷响，震得我喘不过气来。


    那个帅得令人生畏的男人错愕地看着我。接着，他的表情变得比煎饼还平。。我感觉到他口中欲言又止。我几乎已经能听到那三个简单的词了——你是认真的吗？


    我不知道，我是认真的吗？`丘比特的碰撞`正在我脑海中制造混乱。它说服我某个天使的小鬼子正浮在最近的转角，拉满弓，箭指准目标，准备好恶作剧。


    别想了，”我在机器上做了几次例行的划船时警告自己。如果真的发生了，就会发生吧。我无法强求。


    在去“咖啡阁”的路上，我对自己承诺，无论脑海中出现什么疯狂的想法，我都不会对那个固执的布克斯顿采取任何行动。他是这个星球上我最不想发生“邂逅”的人。


    我一整天都在躲着布克斯顿，而《丘比特之箭》的签售会进展非常顺利。事实上，进展如此顺利，以 `Lovely` 的出版社安排了 `JJ Lee`——一位以指导有志作家而闻名的畅销言情小说家——在元旦第二天来到这里参加互动故事会活动。显然，这是为了她即将出版的写作书籍做介绍。


    我宣传了一整周的活动，鼓励客人们带上伴侣或另一半。一条新的横幅挂了上来，虽然看到 `Lovely` 那精美的横幅被打包寄往下一个地点我很难过，但新的横幅凭借古白色的背景、粉色的心形和淡粉色的吻，散发着情人日的氛围。


    顶部是标题——《从前》。下面写着：`带有“他说、她说”转折的即兴言情写作`。听起来确实很有趣。事实上，听起来就像那种可能会引发最完美邂逅……不，我打断了自己的想法。保持专注。


    我整周都设法与布克斯顿保持客气。我每天至少去问候他一次，看看进展得如何。当然，他几乎不理会我，又好像我并不在乎。在快速评估了他的工作成果——我必须补充一句，那令人印象深刻——之后，我问他是否需要什么，也许是免费的一杯咖啡。理所当然，他接受了，我让
    `Chantel` 送过去。我不禁为自己在初次见面他那种卑劣行为后表现出的如此体面的回应感到自豪。是的，这就是我。我是个很有格的女孩。


    `Triple G` 并不这么认为。在我接下来的几次健身之行中，每当我靠近他时，他都会刻意保持距离。雪上加霜的是，当我正走向更衣室时，“豹纹先生”悠到了我面前，问我什么时候想一起出去喝杯酒。他用一种听起来完全像我曾祖父的声音告诉我，我很有胆识，他喜欢这种。我的目光瞥向
    `Triple G`，他打破了边界，恰好听听了约邀请。他笑着，仿佛这是我理应得的报酬。


    遗憾的是，和一个迷恋豹纹衣的九岁老人约会不在我的遗愿清单上，所以我礼貌地感谢他并拒绝了。


    我在我姐 `Kirsten` 家家度过了新年。`布克斯顿` 的兄弟 `Beau` 自然也在那里，因为他们俩感情依然很好。那里有好吃的食物、有趣的卡拉 OK，以及几个需要分组配对的游戏。`Kirsten`
    和 `Beau` 是一对，我最爱的（尽管也是唯一的）侄子 `Jack` 和他的约会对象一对，`Beau` 的儿子 `Parker` 也有自己的伴侣。这留给了我和
    `Beau` 八岁的女儿 `Paige`。我很开心地发现自己并不太介意。我喜欢那个活泼的小女孩，她会唱歌、跳舞，在需要时还能吐出一脸的俏皮。我没忍住冲动，问
    `Paige` 对她那个刻薄的舅舅 `布克斯顿` 怎么看。


    Paige` 大笑，咯咯笑着，然后向我保证他并没有看起来那么刻薄。


    “说起布克斯顿，”`Beau` 听了我们的对话，“他今晚本来有个约会，但对方放了他的鸽子。好吧，其实她是取消了，说她丈夫终还是回城了。”


    “丈夫？”我脱口而出，震惊地睁大双眼盯着 `Kirsten`。


    “他不知道，”我姐姐一边瞪着 `Beau` 一边保证道，“他发现时也很震惊。”


    “他确实气坏了，这是肯定的，”`Beau` 说，“主要是因为他开了两个半小时去某个老掉的冰冰场见她，这意味着他将在深夜的暴风雨中开车回家，而不是在某个女孩身边迎接新年。”


    我不知道为什么在这一刻甚至会感到一丝嫉妒，这让我无法理解。但我确实感到了，我很讨厌这种感觉。


    `Kirsten` 和 `Beau` 交换了眼神，我感觉到 `Beau` 并不认为我和布克斯顿约会是个好主意。

    '
- fmt: '

    I trade my contrived meet-cute clashes for daydreamed ones instead. In addition
    to being safer, the musings put a smile on my face and keep hope in my heart.


    On the morning of the Once Upon a Time event, I skip the gym to avoid all the
    New Year’s resolution junkies and do an online yoga class instead. Once I head
    out, I pick up a bouquet of balloons for the event, then pull into the gas station
    to fill up `Sunny`.


    I imagine a handsome hunk approaching me after the event while customers bustle
    into the chilly night. He’s got an angry snarl on his face and a water-damaged
    book in his hand. But not just any book—it’s `Cupid Darts`, he’s reading it too.
    Furiously, he rants about the fact that someone spilled their spiced chai latte
    with a double shot of espresso on his book, and he demands a new one.


    ‘A new drink?’ I ask him.


    ‘A new book!’ he yells.


    It’s hard for me to imagine going off on a customer, but for the sake of the daydream,
    I raise my voice and tell him just how absurd it is for him to suggest that I
    replace his book. And just how in the world did he know it was a spiced chai latte
    with a double shot of espresso anyway?


    My face is red.


    My blood is heated.


    But suddenly, he pulls a sheepish grin.


    I’m ticked off, and I don’t know if I want to slap the guy or tell him to shut
    up and kiss me.


    I’m so wrapped up in the tale that I almost hit a man as I pull away from the
    gas pump. I barely see his khaki coat and checkered scarf as I slam on the brakes
    hard.


    The tires screech in protest. The balloon bouquet flies into the front half of
    my car. Red, white, and pink orbs obscure my view as they crowd against the windshield,
    bob against my head, and cling to my hair with static-ridden snaps.


    A small clip holds the ribbons together; I know that much, but as I search blindly
    for it, determined to yank the balloons back into place, I come up short.


    “Where in the world is it?” I mumble, patting my legs, the gears beside me, and
    the passenger seat, too. The pungent rubber balloons give me a free facial as
    I lean far over, grasping for the clip while my fingers clumsily follow the ribbon
    length. There!


    I manage to secure the thing at last and fling the naughty balloons back into
    the corner where they belong. I can not only feel the static-ridden energy along
    the crown of my head, but I can also see the strawberry blonde strands of my hair
    waving merrily at the guy I almost hit. He hasn’t moved, and boy does he look
    furious.


    Wait just a minute. This guy isn’t bad. Not bad at all. It comes to my attention
    that I didn’t even do this one on purpose. Bubbles of excitement rise in my chest.


    He glowers at me through the windshield, then looks down to gauge the distance
    between my bumper and his legs. Man, his eyes sure are bloodshot. Wait, is that
    `Classy Produce Guy`? It is. It is `Classy Produce Guy`.


    This is destiny, maybe.


    I fight back a grin, lower my window, and inwardly dare him to yell at me. ‘What,
    are you trying to kill me, lady?’


    He doesn’t. Instead, he shoves his hands deeper into his pockets and ducks his
    chin. “Bunch of crazy people around here,” he mumbles.


    Embarrassed heat flares in my chest. “No, you’re crazy,” I holler, then instantly
    feel bad. I roll the passenger side window down just as he ducks for cover inside
    the station. “Sorry. That was my fault, actually.” I roll up my window. “And so
    was the grocery cart thing,” I add quietly, attempting to tame the static that
    probably makes me look as insane as I feel at this moment.


    I double-check both ways before slowly accelerating once more and shake my head.
    “Geez, I really am crazy.”


    The `Coffee Loft` is busy today, like usual, making morning turn to late afternoon
    in no more than a blink. The publisher suggested we set up a mock stage of sorts,
    which we place at the base of the new, storytelling banner. That way, almost everyone
    present will be able to watch the action—those in the loft, those in the lounging
    areas, and from the dining spots, too. Guests who don’t want any part of the event
    will be directed to the one corner of the shop that doesn’t offer a view of the
    stage.


    Speaking of the mock stage—I asked `Jeb Nobly` if he could set one up, but he
    was unable to do it, so I had `Chantel` ask `Braxton`, and he agreed, saying he’d
    tack on a small fee for setting it up and tearing it down once we were through.


    “Surprised he didn’t make me ask,” I murmur as I arrange the voting cards, pencils,
    and noisemakers provided by the publisher. Just when I thought I wouldn’t see
    another celebration horn until next New Year’s, I got five dozen of them sent
    to my shop.


    A quick glance out the window tells me `Braxton` is still working on the caboose.
    Hopefully, we can keep things cordial until he’s done. After that, I won’t have
    to see him again. Until `Beau` and `Kirsten` tie the knot.


    A flitter of something floats across my memory at the thought. Not in a pleasant
    way, either, but it’s easily pushed from my mind as I notice how many guests are
    piling into the `Coffee Loft`. The place fills up quickly with a crowd of singles
    and couples alike. I hand out the voting cards while they tug off beanies, unwrap
    scarves, and drape coats and jackets over the backs of chairs.


    The spunky author hosting tonight’s event is already working the crowd, asking
    couples how long they’ve been together and prodding singles to point out someone
    in the room they’d be interested in getting to know.


    I’m surprised to see that `Kirsten` and `Beau` took me up on the invite. They
    take a seat beside a group I recognize from the forty-something singles event.


    `JJ` approaches me with a wide grin. “Great crowd,” she says under her breath,
    eyes wandering over the filled tables and chairs. Her gaze lifts to glance over
    those seated in the loft. “I’ll be asking for volunteers,” she explains, “but
    I might call on a few unsuspecting souls too. See if we can’t make a love match.”


    I tip my head back; that’s why she was asking the singles if they had their eye
    on someone. I’m simultaneously glad and sad about the fact that I’m not a candidate
    for the event. The couples who get the most votes will move on to the next round.
    There, one lucky couple will win a romantic date package for two.


    `JJ` gets started by inviting a couple who’s willing to show everyone how it’s
    done. They happen to be `JJ`’s parents, who sit front and center in the crowd.
    They’ve been married for thirty-five years. She hands them each mic, takes a step
    back, and hollers, “You start, Ma. Once upon a time…”


    `JJ`’s mother takes it and runs, describing the time a fair maiden met a noble
    knight in the woods one day. `JJ`’s father broadens his shoulders and lifts his
    chin as the woman describes his handsome face and fine physique.


    When it’s his turn, he takes over telling the tale, saying the two were barely
    beyond introductions when a dangerous band of gypsies broke through the trees.
    He was forced to hoist the fair maiden onto his horse and bolt into the densest
    part of the woods where no one dared venture.


    By the time the couple’s eight minutes is up, the crowd is collectively leaning
    forward and waiting on bated breath.


    “Now you know where I get it,” `JJ` says. “These two can spin a yarn, can’t they?
    Let’s all give them a hand.”


    A flare of excitement sparks in my chest. I can’t wait to see what my patrons
    come up with. Maybe I can get `Kirsten` and `Beau` up there. Just as that thought
    crosses my mind, I catch eyes with `JJ` across the room. I lock eyes with her,
    then nod pointedly in `Kirsten` and `Beau`’s direction.


    `JJ`’s eyes land on the happy couple before she looks back at me with a thumbs
    up. “I’ll get ‘em,” she mouths.


    I grin.


    This ought to be good.

    '
