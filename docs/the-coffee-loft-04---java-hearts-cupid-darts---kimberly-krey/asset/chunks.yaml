    I hope it’s not obvious that I’m distracted, but the fact is, Braxton’s face keeps
    bobbing into my head like a static-bound balloon in a carnival crowd. He almost
    looks…familiar. I picture his brothers; I’ve met them all, and each looks like
    a Greek god of sorts. Olive-toned skin, brown eyes, and muscles for days. It’s
    not natural. It’s probably the strong resemblance that makes him seem familiar.


    Only I’m not fully convinced. For whatever reason, I have a not-so-good impression
    of him. Perhaps this is just me trying to convince myself that I wouldn’t want
    Beau’s brother even if I did think dating him was a good idea, which I don’t—no
    sense in wanting what I can’t have. Besides, look at him—he must have women throwing
    themselves at his steel-toed boots.


    I force myself to focus on the reason he’s here—the new addition and head to the
    train car Nobly finished. When I step inside, I spot a set of blueprints spread
    over the nearest table. A quick scan of the area says Braxton is in the far corner
    inspecting the ceiling with unusual interest.


    I clear my throat. “Sorry about the delay.”


    “Who did the restore job on this?” he snaps gruffly.


    “Jeb Nobly.” There’s pride in my voice, for good reason; the man has a good name
    around here, after all.


    “You mean Nobly’s not dead yet?” Braxton has yet to take his eyes off the finish.
    He reaches up with extended fingers and presses along an outer edge.


    “No, he’s not dead, geez.”


    “He should be retired by now in the least of it.”


    I fold my arms and huff out a breath. “He is. He just…still takes on side jobs
    from time to time.”


    “Yeah, well, he shouldn’t.”


    Now this guy’s just crossing a line. “What do you mean by that? Jeb did a beautiful
    job on this.”


    “Beautiful to you,” he allows, tearing his gaze off the ceiling and dropping it
    to the floor. He jabs the toe of his filthy-looking boot against the wood. “To
    the trained eye, it’s a hack job.”


    “A hack job?” I squeak. “Name one thing he did wrong.”


    “Honey,” he says, pinning his eyes on me now. “I could have named a dozen things
    he did wrong the second I stepped into this place.” He flicks out his thumb, counting
    up on his fingers with each item. “He didn’t insulate properly, he didn’t double-pane
    the windows, he used new wood instead of refurbished, and there’s a plank sticking
    up at the entrance that could knock one of your pretty little customers on their…”
    He seems to catch himself. “Tush.”


    I tap my toe.


    Pace my breath.


    Wonder if there’s a plane I could catch to a land far, far away. It’s not just
    what this guy said that has me so miffed. It’s how he said it.


    “You’re a very rude man. Has anyone ever told you that?”


    He shrugs and spins in place. “Truth hurts sometimes.”


    “Does it?” My voice is.

