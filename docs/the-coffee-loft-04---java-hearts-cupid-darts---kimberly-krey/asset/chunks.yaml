    And as he tells the next part of Kirsten and Beau’s story, how they set up a sting
    op and spied on the cheating couple to get proof of the affair, I try very hard
    to focus so I can pick up where he leaves off.


    It takes effort, though, because in the back of my mind, I am allowing myself
    to let go of the things I thought I knew about Braxton. The assumptions, the judgments,
    the fear. If Kirsten thinks he’s good enough for me, he’s probably the real deal.


    By the time JJ hits the button once more, the story is at just the right place.
    I recall the torment Kirsten endured after the breakup. When Greg said he didn’t
    regret cheating, that he was in love with Beau’s wife and wanted to be with her.
    I skip over that part to get to what happened months later; this is a love story,
    after all.


    “It took months for Maggie and Braxton to recover. But after the dust settled,
    they worked on rebuilding a new sense of family, something that was easier when
    they did so together.


    “Their exes wanted little to do with the kids, but that was just fine, because
    family was what Maggie and Braxton cared about most, and it felt good to be there
    for each other. To make new memories together.”


    JJ sounds the chime, and I hand the mic back to Braxton.


    “A solid friendship grew,” he says, “and before long, Braxton wanted to be more
    than just friends. He wasn’t sure if she felt the same, but one night, he worked
    up the bravery to see for himself.


    “Maggie had dozed off during a movie, and the kids were fast asleep. While she
    lay there, eyes closed peacefully, Braxton pressed his lips on hers for a soft,
    testing kiss.” Braxton flashes that roguish look in my direction.


    Ding.


    JJ nods for me to take the mic. “Last one,” she warns under her breath.


    I lift the mic to my mouth, eyes set on Braxton, and grin. “He kissed her, all
    right,” I say, “and she liked it.” I run my fingertips over my lips and add one
    final sentiment. “Mmm.”


    The audience starts to cheer.


    “Okay, folks,” JJ hollers, “who’s ready to vote?”


    # 13


    ![](OEBPS/image_rsrc2A2.jpg)


    ## Braxton


    I stand at the head of the bench press to spot Luke. We won the date. Maggie and
    I actually won the date. Well, the author gave all three of us prizes, which Maggie
    was glad about since she wouldn’t want to take a prize from her guests, but we’re
    the only ones who happened to win an overnight date.


    “Two more to go,” Luke grunts while he presses.


    “Three,” I correct him ruefully.


    Luke grunts harder, extending his arms fully. The bar wobbles and I ready my hands
    just in case. He manages without my assistance, then lowers it to his chest once
    more.


    “Nice,” I tell him. “Now you’re at two.”


    From the corner of my eye, I see Liam and Beau heading towards the men’s locker
    room.


    “We’re hitting the steam room,” Liam announces with a wave.


    “We’ll see you in there,” I say.


    Luke finishes up his last press and manages to get the bar back in its brace.
    He rubs a hand firmly over his chest and groans. “That killed me.”


    “No pain, no gain, brother.” Inwardly, I know I’m risking serious pain to getting
    involved with Maggie. But that’s barely a consideration; I’d be an idiot to pass
    up this chance. Especially the overnight thing. As Maggie was locking up at the
    exit, she and I talked privately at the door. “We don’t have to do the overnight
    part,” I told her. “But if we do, since it has separate beds, we could use the
    time to just…talk. Get to know each other better if you’d like.”


    It took her forever to answer. I could tell her wheels were turning as she looked
    at the floor and glanced about. “Why don’t we pack bags just in case?” she suggested.
    “We can decide while we’re there.”


    I sensed she was nervous about it, too. There was something unspoken in the air—a
    reservation of sorts. We were brave enough to explore things with a kiss, but
    did we dare dating?


    I walk around the bench to give Luke a hand. He takes it, and I help him onto
    his feet with a grunt.


    “So, what’s got Beau’s boxers in morning?” he asks as we head toward the locker
    room. “He’s barely even looked at you since we got here.”


    I think back to last night. “It’s about Maggie,” I say. “What about her?”


    I grab a hand towel and toss it around my neck. “We kissed.”


    “You kissed? Beau is going to kill you.”


    “Plus, Maggie and I won some romantic date for two by telling Kirsten’s story.
    We changed the names, of course.”


    Luke opens the door to the steam room. As soon as I walk inside, the damp heat
    clings to my skin, fills my nostrils, and goes straight to my lungs. It’s quiet,
    save the hush of the steam pouring into the space. Once it stops, I rest my head
    and take in the penetrating heat. Moisture drips from the ceiling and splats on
    my legs, shoulders, and head.


    “Maybe he’d like it better if I took her,” Luke says from across the room. The
    comment meant to agitate Beau, assuming he catches on the subject. You think Maggie
    isn’t good enough? How do you like the idea of Luke taking her?


    “Probably,” I mumble. “He’s got something against me.”


    Quiet takes over, making me think that Beau’s not going to take the bait. But
    then, in true in-your-face fashion, he pipes up. “Guess I used the wrong tactic
    with you,” he says.


    I’m not in the mood to bite back, but since Luke and I are the ones who started
    it, I indulge him. “Oh, explain, brother. I should’ve known that if I told you
    not to date Maggie, you’d be kissing her before the job was through.”


    “You kissed her?” Liam whoops. “You didn’t tell me, Beau. You just said they were
    going on some getaway.”


    “It’s a date,” I snap.


    Now Luke’s the one to pipe up. “Dude, you didn’t tell me it was for the whole
    weekend.”


    “It’s one night,” I clarify. “Some bed and breakfast in Richmond in case we don’t
    want to drive all the way back after the date. It’s separate beds. No big deal.”


    It goes quiet once more, but I can’t leave it there. I’m torn about the date as
    it is, and I don’t need to be guilted by Beau and his nonsense.


    “And it’s not like I’m the one who planned the date. We won it.”


    “Mmm—hmm,” Beau mumbles.


    “You know what,” I say, half tempted to get to my feet and pace. “You put me in
    an impossible situation. You want me to be nice to her but not too nice. Meanwhile,
    Kirsten wants me to date her, and by the time I was one week into the job, Maggie
    absolutely despised me.


    “Despite that,” I continue, “I start having dreams about her—I don’t have control
    over that. And before I know it, she’s admiring my handiwork and looking at me
    with those eyes and…and it’s after a weak moment where I’d been thinking about
    how crummy it is that Blaine died and you all ended up divorced and how I’m not
    sure there’s a lot out there to put my hope in.”


    I shrug, staring blindly into the steamy clouds ahead. “And I kissed her.”


    “Did she kiss you back?” Luke and Liam ask in unison.


    “Was just a peck,” I say. “But…yeah.”


    “Nice,” Luke says.


    “That’s great, man,” Liam agrees.


    “Thanks,” I say to them. “I’m taking her on the date we won, and I’m not going
    to feel guilty about it either, Beau. You can live your life, and I’ll live mine.”


    “So long as you don’t mess things up with Kirsten and me,” he says.


    “I won’t,” I promise, wondering if I can guarantee such a thing.


    “Whatever,” Beau says. “You’ll do what you want to do anyway.”


    “Yep,” I say, “I always do.” Only it’s not exactly true. If I always did what
    I wanted, I’d have made a move on Maggie long before now.


