    along my temple, allowing his heated breath to tease my skin.


    Goose bumps rise up my arms, making me grin. I turn to catch his gaze, delighted
    by that roguish glint in his eye.


    Anticipation stirs low in my tummy. He’s going to ask me to be his girlfriend,
    I know it. “Official?”


    He takes me by both hands and looks longingly into my eyes. “I love you, Maggie.”


    My heart misses its next beat.


    A tiny gasp pulls at my throat.


    And despite my best efforts, a splinter of fear pricks through my barrier. It’s
    tiny, minuscule, even, but it’s there, threatening that ever-dreaded infection.
    The disease of my fear that could ruin everything.


    His brown eyes search mine expectantly, telling me that it’s my turn to speak.
    To return the sentiment. He gives my hands the slightest squeeze. “I just…thought
    you should know.”


    Yeah, right, he just thought I should know. This is a test. It’s his way of testing
    me, and I’m failing. Falling. Drowning in my aversion to being vulnerable in return.


