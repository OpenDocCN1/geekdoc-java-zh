  raw: 'Kirsten stands to her feet and smooths a strand of hair behind one ear. “I
    heard that, yeah, but I also heard you blaming Braxton for stuff he shouldn’t
    have to take the blame for.”


    “Well, he practically ruined my life back then,” I say. “I just wanted him to
    say he was sorry.”


    “He did say he was sorry,” Kirsten says. She’s getting her coat on now.


    “I didn’t hear him say he was sorry.”


    Kirsten wraps a bright, red scarf around her neck, then toys with the fringe as
    she looks at me. “Be honest, if this hadn’t come up last night, do you think you’d
    have found something else to blow up about?”


    I laugh a little too loudly. “Nice one, but no, I don’t think so.” But then I
    remember having a similar thought this morning. “This isn’t me just vacillating,
    Kirsten,” I say, testing the truth of that declaration as it leaves my lips. Even
    I’m not convinced.


    “And who’s to say he’d even still want me after this?” I add, standing so I can
    hug her goodbye.


    Kirsten rests her hands on my shoulders and gives me a soft smile. “If he’s the
    right one for you, he won’t let this get in the way. And if you’re the right one
    for him, you won’t either.” She presses a big sister kiss to my forehead before
    pulling me in for a warm squeeze.


    “You are amazing,” she says against my hair while embracing me. “You’re worthy
    of love, you’re capable of giving it, and you’re capable of receiving it too.”
    She squeezes a little tighter before letting me go, then tugs the keys from her
    pocket.


    “Read the inscription, and then turn on your phone, okay?”


    “Okay,” I say.


    “The ball is in your hands, Maggie. You need to get out of your own way.” With
    that, she steps out and closes the door behind her. I hear the garage open and
    then close.


    “Whatever,” I say. I trudge back to my seat, grab the book, and flip open the
    front cover.


    At first, it’s a few niceties—expressed gratitude for hosting her book signing
    and for being a fan of her other work. But just above her signature, she leaves
    me with some personal advice.


    Keep in mind, Maggie, no one holds tighter to an unhealthy pattern than someone
    who’s about to give it up completely. When you feel yourself doing that, unclench
    your fists, let go, and let yourself love at last.


    Fire encircles my heart. It’s like Clarissa Lovely pulled some sort of Christmas
    Carol miracle, having caught a glimpse of my Valentine’s future and given me the
    exact advice I’d need at this moment.


    And it’s more than just advice. It’s encouragement, too. Look how tightly I’m
    holding on to my own ways—willing to let a man like Braxton Wheaton walk out of
    my life at the first sign of trouble without even talking things out.


    But what that means, if Lovely’s correct, is that I’m about to release it completely.
    To make the changes necessary to stop getting in my own way.


    I picture the dress on the trash can and gasp. Hopefully, it hasn’t absorbed any
    odors through the plastic lid and protective wrap. My heart races as I dash for
    the garage, yet just before I fling open the door, I pause and recall what Clarissa
    told me. Unclench your fists…


    I pull in a deep breath, close my eyes, and make a fist with each hand. I picture
    everything I cling to when relationships get too serious or too tough. My insecurities,
    my past hurts, all of the terrible things I’ve witnessed. They’re only the negatives.
    I’ve let so many good things pass before my eyes, holding only those that feed
    my narrative.


    And right here, right now, I’m letting them go forever. I twist my wrists so my
    hands will face the floor, then I uncurl my fingers and imagine all that junk
    falling away from me.


    When that’s done, I shake out my hands and summon an image of Mandy and Collin
    Wheaton.


    I picture the looks they exchanged during their anniversary party when Braxton
    and his brothers took turns sharing memories from years’ past. Memories that caused
    laughter and tears alike.


    At poignant spots, Mandy and Collin would turn to one another and exchange a look.
    A look that might seem subtle to some. But for me, as someone green to that type
    of lasting love, that look said everything.


    It spoke of the years they’d shared, the troubles they’d overcome, and the joy
    and adventures that awaited them. Most of all, it spoke of the one thing that
    enriched each day of those forty-five years—the fact that they’d lived them together.


    I picture that devilish glint in Braxton’s eye, the one I spotted on that very
    first day, and let myself dream of a time forty-five-plus years from now, where
    we wordlessly appreciate the years in our wake.


    I ball up my fists, bring them to my heart, and vow to hold on to this instead.


    Now, I decide it’s time to rescue that dress.


    # 22


    ![](OEBPS/image_rsrc2A2.jpg)


    Braxton


    I nod my head to the blasting beat from the car stereo. I am pumped up with all
    the excitement and hope I need to make this night go just right.


    I wasn’t sure what I would do when evening came around. Would I call Maggie and
    ask if she still wanted to go out? Or would I simply return the tux and head out
    of town for the night? Find some snowy cabin where I could light a fire and tend
    to it all night long.


    But a few hours ago, I got a text from Maggie’s sister that set me on a new course.


    Kirsten: Please don’t let Maggie spend Valentine’s Day alone. She’s really upset
    about last night and embarrassed by it, too, but you guys can get past it if you’re
    willing to try. This can be a minor setback that you both learn from, or it can
    be a flimsy excuse to give up on each other. I hope you’ll make the right choice.


    Kirsten’s message did something for me. It gave me permission to pursue Maggie,
    to try and follow through with the plans we made. I don’t want to give up on her
    and what we have. And it’s not like last night’s blowup will be the only issue
    we encounter in life. As a couple, we’ll have our fair share. But like Kirsten
    says, we can choose to learn from them instead.


    Bless Beau for letting me take the Cadillac again, even if we are just parking
    the thing at the port and boarding a ship for the evening.


    I shift gears to lower my speed as the turn for Maggie’s neighborhood approaches.
    No less than twenty minutes after receiving Kirsten’s text, I sent a text to Maggie:
    I’m sorry for how I acted last night. And I’m sorry for hurting you at Viv and
    Chad’s wedding. If you’re willing to forgive me, meet me on your porch step at
    five o’clock sharp.


    She might suspect what I have in store, seeing that I told her to wear a formal
    gown, but I have a surprise up my sleeve that she’s bound to appreciate. That
    is, if she shows.


    A quick glance at my dash says it’s 4:55\. The countdown is on. I pull into Maggie’s
    driveway, anticipation building with every breath.


    Now is the moment of truth.


    # 23


    ![](OEBPS/image_rsrc2A2.jpg)


    Maggie


    I pace across my bedroom floor, eyeing the shoes I picked out for tonight. I might
    be zipped into the gown with my hair and makeup done to perfection, but I can’t
    get myself to commit to the heels just yet.


    I think back on the text Braxton sent. ‘If you’re willing to forgive me…’ Could
    that really be his only condition? And what if he’s changed his mind since sending
    it? It’s been hours now.


    Five o’clock is getting closer and closer with every tick of the clock.


    Since reading Lovely’s inscription and determining to apply it, I feel less angry,
    less embarrassed, and less afraid to confront the ugly encounter from last night.
    Yes, I had a freakout. But if Braxton isn’t willing to let it tear us apart, then
    neither am I.


    With that in mind, I tiptoe over to where my heels rest and slip into them, bending
    down to clasp the straps around my ankles. Suddenly, I hear the sound of a car
    door closing. I dart upright, glance out my window, and barely catch sight of
    Braxton in a tux. He’s not approaching my door yet, though. Instead, he’s ducking
    into his backseat to retrieve something.'
