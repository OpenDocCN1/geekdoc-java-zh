  trans: '

    Kirsten 重重地叹了口气。作为她的妹妹，导致她这样叹气的次数多到我无法计数。“好吧，我放你了。但如果 Braxton 接受了那份工作，而你们就这样坠入爱河，那完全是自然的，我不希望你对这个机会闭门见，好吗？再见。”在我反驳之前，她就挂断了电话。


    “拜拜，”我关掉引擎说道。


    每当我走出我那辆可爱的阳光黄色的 Jeep Renegade 时——顺便说一下，它的名字叫 `Sunny`——我都必须至少欣赏它六十秒。我爱着这辆车，为了得到它我付出了很多努力。


    我抬起鼻子，吸入咸咸的海风，远处传来波涛的涌和呼啸声。今天早晨已经过了涨潮期，太阳已经开始显威了。很快，地面就会大部分干透。但这并不意味着温暖。我很冷。冷到让我一路走到门口都在打抖。一月的时候天气会变得越来越冷，然后温度才会开始缓慢上升。到三月，我们就能看到死忠粉丝们开始穿着潜水服来冲浪了。


    我深吸了一口气，注意到空气中的变化，那股现磨咖啡的浓郁芬芳愉悦着我的感官，并希望能吸引路人。当我推开门走进店里温暖舒适的空间时，那股气味变得无限强烈起来。


    如果欣赏 `Sunny` 至少需要六十秒，那么欣赏我咖啡馆的梦想则需要长得多。顾客们缩在壁炉旁舒适的沙发上。有些人挤在柜台旁，松开外套，手里攥着礼品卡，盯着巨大的黑板菜单看。另一些则散落在楼上和楼下的用餐区，仰着头喝着杯里的咖啡，或是吸入着浮在脸上的、神圣般的热气。


    许多在线评论者说 Coffee Loft 是他们家之外的第二个家，我再赞同不过。这也许是我工作场所，但这种温馨、轻松的环境让大多数工作日都变成了一种享受。


    我的目光移向阁楼旁边的拱形天花板，据我介绍，那里曾是旧火车站的一种哨戒处。在那里，沿着那面大墙壁，优美而大胆地悬挂着 `Cupid Darts` 的横幅。背景是明亮的白色，上面有褪色的黑色阴影爱神——他们正拉满弓，箭箭待发。


    图像中心是一颗闪亮的深红色爱心，一支箭穿了它的中心。它融合了贺卡上的那种爱心形状和你可能在他人胸腔中看到的跳动三维人类心脏。这里运用了一种艺术技巧，让这颗心看起来像在跳动。只要我微微歪头或移动视线，下方的心室似乎在收缩，而上部则在一侧膨胀。


    光亮的血液从裸露的箭尖渗出，滴落下来，恰好点在标题字母 `i` 的点上，点缀出一块精致的斑点。`Cupid Darts` 用匹配的红色手写着；字体复杂而精巧。


    它给人一种印象，那些小小的媒婆会悄悄地靠近那些完全没有防备的人。


    呵，我沉思着。我不清楚。我想，有些像我这么大的单身女性——也就是从未结婚过的人——可能并不在寻找爱情，但我敢说，我们大多数人都是，而那些说称自己没有的人只是在自欺欺人。


    ### 爱的愿景


    三件事在我脑海中闪过：第一，如果我真的爱上了某人，我会如何处理这种情况。第二，我是否已经准备好进入一段关系。第三，`Cupid Darts` 对我的生活真正代表了什么。

    '
- fmt: '

    I roll my eyes a second time. “I’m hanging up now.” I don’t let him say another
    word.


    A text pops in seconds later.


    `Beau`: “Don’t be sore at me. I have something special with `Kirsten`, but it’s
    still early days and I don’t want anything to mess with it.”


    I tap back the only decent four-letter word I can muster.


    `Braxton`: “Fine.”


    ## The Coffee Shop and the Past


    I head into the coffee shop and buy myself a dry cappuccino with half and half.
    I hadn’t planned to, but the aroma in the place was impossible to resist. I pace
    the interior while I’m here, admiring the loft with its central vault accented
    by what looks like original beams. A massive banner explains the car-wrap I saw
    in the lot. Apparently, the Town Car belongs to an author of sorts. Must be doing
    a book signing here.


    As I check out the upper level, complete with an impressive view of the ocean,
    my thoughts are pulled back to the disturbing call I got this morning from `Davis`,
    the lead over my construction crew. I had him take over the home development side
    of `Wheaton Construction` once I decided to step away and focus on private, custom
    jobs. `Davis` gave me word that the new guy—a friend of one of my recent hires—used
    unnecessary force to kick a pair of homeless guys out of an unfinished home—one
    of many in the subdivision we’re building near `Norfork`.


    It’s not uncommon for that to happen this time of year. Especially when we’re
    at this particular phase of the building process, the place is framed, the floors
    are unfinished, and there isn’t a lot of damage a few guys taking shelter can
    do besides use the toilets before plumbing comes through.


    I’m not one for kicking a man when he’s down; under different circumstances, that
    could be any one of us, Pops would always say. And before my brother `Blaine`
    took his last breath, he was living proof.


    In my late brother’s honor, I’ve established a protocol for this type of thing.
    When we find squatters taking shelter in one of our worksites, we offer to see
    them to the nearest bus stop and buy their way to the local shelter for a hot
    meal and a roof over their head.


    I regret not taking the time to cover this aspect with `Levi`. He needs more training
    than most of my hires, but since he was `Johnson’s` friend, I hoped it’d be worth
    the effort. The jury’s still out on that.


    A deep ache bloats low and steady in my chest. It’s hard to fight my pessimistic
    ways. I couldn’t save `Blaine`; what makes me think I could save anyone else?
    But I know that’s not the point. The point is that someone I love was once on
    those streets, and I prayed to God he’d meet the kindness of strangers. All I
    can do now is offer that very thing to others.


    ## Finding the Office


    I tear my eyes from the crowded boardwalk and spin in place to survey the adjacent
    wall, separated by the vaulted space. It’s part of the shop, that much I can tell,
    but where’s the access point?


    I’m quick to take the wide staircase back to the main floor, trail through a rather
    cozy area of the joint where guests play checkers and chess, up to tea tables
    on the floor, and discover a stairwell. A small sign tells me there’s an office
    up there.


    As a carpenter, I admire the woodwork on my way up the narrow staircase. It’s
    not exactly a spiral case, interrupted by several small landings as it is, but
    it does shift directions clockwise all the way up to the top.


    “It sounds like this book is coming into your life at the perfect time,” a woman
    with a Jersey accent says from the other side of the wall.


    Surely, the creaking stairs have given me away, but I freeze just the same, listening
    for a response. This must be `Maggie’s` office, I decide, and what a perfect place.
    I bet there’s a window in there with a view.


    “I hope so,” another woman says. No accent—probably `Maggie`. “Of course, I also
    thought my timing was three or four years ago when all my friends were getting
    married. I don’t know, sometimes I wonder if I accidentally missed my person,
    you know? Or maybe I scared him away.”


    “How so?”


    I’m shamelessly eavesdropping, but since `Maggie` is off-limits anyway, what does
    it matter? I take a cautious sip of my drink. So good.


    “By taking my time,” the one I assume is `Maggie` replies. “I’m not the type to
    throw myself at a guy or rush into anything. But it seems like that’s what guys
    want. If you approach things cautiously—and why shouldn’t you with the divorce
    rate out there—you’re some boring dud who’s not even worth their time.”


    “Sounds like you’re speaking from experience,” Jersey voice says, speaking my
    thoughts exactly. I’m suddenly glad `Beau` drew a line; the last thing I want
    is to pay for damage done by some punk in the woman’s past.


    “I most definitely am. But I have a question for you about the cover of this new
    book. It’s gorgeous, by the way. Something about the appearance of the heart and
    the way the `Cupids` are portrayed suggests, to me, that love sort of sneaks up
    on us. But maybe I’m reading too much into it.”


    “No,” Jersey says, “you’re right. The `Cupid` darts give indications, markers,
    if you will, of common occurrences found in long-lasting relationships.”


    “But if the instances take us by surprise—meaning we can’t orchestrate them—then
    what good is it to know what they are?”


    I cringe. This chick is pushy. I lean in, half expecting Jersey girl to pop off.


    ## The Encounter


    ![](EBPS/image_rsrc2A2.jpg)


    # Maggie


    Tall, dark, and handsome barely cover the sight standing outside my door. Lurking
    is more like. How long has he been standing here? And why does he look…familiar?


    “That’s your name, isn’t it?” he prods, tearing me from my stupor.

    '
