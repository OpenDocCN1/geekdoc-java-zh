    “I think you’re right.” I roll the eraser into a ball, press it against the tabletop,
    then sink the tip of the pencil into the mound so it stays upright. Once my hands
    are free, I stand and pull Maggie closer, pressing a kiss to her cheek before
    trailing my way to her tempting lips. “You really took this to the next level,”
    I tell her. “I pride myself on thinking outside of the box, but you’ve got a lot
    of fresh ideas.”


    “Maybe you’re getting a little stale,” she teases.


    “Oh, I’m not,” I say, poking a ticklish spot beneath her ribs.


    Maggie squeals, dashing away from me and toward the kitchen. “You might be,” she
    teases once more.


    “And you might be ticklish,” I say, catching up to her and poking her sides again.


    She’s laughing too hard to form words.


    “Look at you,” I say gleefully. “So ticklish.”


    “I bet you are, too.” She reaches in and kneads both sides of my ribs at once,
    causing my muscles to spasm and tense, but at least I avoid giggling like a schoolgirl.


    Still, as I squirm back, Maggie wriggles out of my grip and races for the couch.


    “You’re like a rowdy child,” I accuse, which only makes her laugh some more.


    Seconds after she lands on the couch, she points to the bottom shelf of my bookcase.
    “Braxton,” she breathes, “is that Guess Who?”


    I nod and grin. “What kind of uncle would I be if I didn’t have a few games at
    my house? Why? Do you want to play?”


    “Of course, I want to play,” she says eagerly. “It’s been ages.”


    “Okay,” I say, liking how playful and fun she is. With Maggie, the surprises keep
    coming, and I like that. I imagine her becoming a significant part of my life.
    The home, the family, the future. Our relationship is chock-full of possibilities,
    and I can’t help but hope she’ll be the one.


    We sit on the floor opposite one another and set up our boards. With Valentine’s
    Day approaching, there’s something I’ve been meaning to ask her. Something I hope
    she’ll say yes to.


    “Hey,” I say before we start. “My parents have an anniversary party coming up
    soon. It’s a big one, forty-five, and I’d love it if you’d accompany me.”


    Her eyes go wide for a beat, and then they narrow as if she’s contemplating.


    A knot of uncomfortable heat forms high in my chest. I hope she doesn’t think
    I’m moving too quickly, but the fact is, I could see Maggie becoming a part of
    my life. I want that, and I don’t want to waste time or play games.


    “I want to introduce you to everyone,” I add.


    “You do?”


    I nod. “Yes.


    “Forty-five years, huh?”


    “They got married young,” I explain. “He was nineteen, and she’d just turned eighteen.
    High school sweethearts.”


    She grins, and my worry fades. “That’s awesome. And yes, I’d love to come.”


    I sigh. “Good. It’s still a few weeks away. They got married on Valentine’s Day,
    but we’re celebrating the night before, so it doesn’t interfere with the holiday.”


    Maggie’s smile widens. “Your parents got married on Valentine’s Day?”


    I shrug. “What can I say? They’re true romantics.” I glance down at my board game,
    thumbing the character card before looking back to her.


    “You know,” she says softly, “I’ve never had a date on Valentine’s Day before.”


    I lift a brow. What kind of idiots has she been dating? “You haven’t?”


    She shakes her head. “I guess I was never dating anyone seriously when it came
    around each year. Seems like it’s kind of reserved for, like, couples, you know,
    that are official.”


    “Hmm.” I nod. “What would the perfect Valentine’s date look like to you?”


    “I always thought it’d be fun to go on one of those romantic dinner cruises on
    Valentine’s. Spend the evening on a luxury ship on the water—fine food, a little
    music, and dancing. Plus, you get to dress up, which is kind of fun to do once
    in a while, I think.”


    She holds my gaze, those hazel eyes melting new parts of me. “Sounds perfect,”
    I say, yet before the game starts, I speak up once more. “Maggie?”


    She glances back up. “Yes?”


    “Will you be my Valentine''s date this year? I promise to make it a night to remember.”


    She grins and bites her lip, a rather adorable gesture I’ve noticed a handful
    of times now.


    “Definitely.” She nods, and her cheeks flush pink. “I can’t wait.”


    I grin in reply, unable to resist leaning across the boards and pressing a kiss
    to her lips. I test myself, making sure the fear hasn’t returned. For me, it hasn’t.
    I just hope that Maggie can say the same.


    I kiss her once more before pulling back and setting my gaze on hers. “Neither
    can I.”


