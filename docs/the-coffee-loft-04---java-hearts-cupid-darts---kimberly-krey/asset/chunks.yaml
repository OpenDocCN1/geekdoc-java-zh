    凯斯汀（Kirsten）站起身，将一缕头发理到耳后。“我听说了，是的，但我也听你说你在把布克斯顿（Braxton）归咎于一些他不该承担的责任的事情。”


    “噢，他那时几乎毁毁了我的生活，”我说。“我只是想让他说对不起。”


    “他确实说过抱歉了，”凯斯汀说。她现在正在穿外套。


    “我没听见他说道歉。”


    凯斯汀将一条鲜艳的红色围巾绕在脖子上，一边看着我，一边手指摆弄着流苏。“诚实点，如果昨晚没提这事，你觉得你会不会找别的借口大发雷霆吗？”


    我笑得有些太大声了。“得主说得好，不过不，我不这么觉得。”但接着我想起今天早上也有过类似的想法。“凯斯汀，我可不是在反复无常，”我说，话话说出口时，我自己在测试这句誓言的真伪。连我自己都不完全确定。


    “而且谁能保证在发生这些之后，他还会想要我呢？”我补充道，站起身来好抱她告别。


    凯斯汀把手放在我的肩膀上，给了我一个温柔的微笑。“如果他是你的对的人，他不会让这成为阻碍。而如果你是他的对的人，你也不会。”她在我的额头上落了一个像大姐姐一样的吻，然后将我搂入怀里温暖地捏了一下。


    “你太棒了，”她在拥抱着我时隔着我的头发说道。“你值得被爱，你有能力给予爱，也有能力接受爱。”在她放开我之前用力加紧了一下，然后从口袋里掏出钥匙。


    “读读铭文，然后打开手机，好吗？”


    “好，”我说。


    “球在你手里，玛吉（Maggie）。你需要不要成为自己的阻碍。”说完，她走出门门，并在身后关上门。我听到车库打开又关上的声音。


    “随便吧，”我说。我无力地走回到座位上，拿起那本书，翻开了封面。


    起初，是几句客套话——感谢她举办了签书会，并感谢她是她其他作品的粉丝。但在她的签名上方，她给我留了一些私人建议。


    *记住，玛吉，没有人比一个即将彻底放弃不健康模式的人抓得更紧。当你发现自己正处于那样时，松开紧握的拳头，放手，让你自己去爱吧。*


    火焰环绕着我的心。这感觉就像克拉丽莎·洛夫里（Clarissa Lovely）创造了某种圣诞歌般的奇迹，她瞥见了我情人节的未来，并在此时此刻给了我切需要的建议。


    这不仅仅是建议。这也是鼓励。看我是多么紧紧地守着自己的那些习惯——愿意让像布克斯顿·惠尔顿（Braxton Wheaton）这样的男人在问题出现的第一个迹象时就离开我的生活，甚至连话都来不及谈。


    但如果洛夫里是正确的，那意味着我即将完全释放它。做出必要的改变，以停止成为自己的阻碍。


    我脑海中出现垃圾桶上的裙子，倒吸了一口气。希望它没有通过塑料盖和保护包装吸收任何气味。当我冲向车库时，心跳加速了，但在我用力推开门之前，我停停了，想起了克拉丽莎告诉我的话。松开拳头……


    我深吸了一口气，闭上眼睛，双手都握成了拳头。我脑海中浮现当关系变得太严肃或太艰难时，我紧抓着的一切。我的不安全感、过去的伤痛、我目睹过的所有糟糕的事情。它们都是负面因素。我让许多美好的事从眼前溜走，只抓着那些迎合我内心叙事的东西。


    而此时，此刻，我要让它们永远离开。我扭动手腕，让手心朝下，然后张开手指，想象所有杂质从我身上落下。


    完成之后，我抖了抖手，脑海中浮出曼迪（Mandy）和科林·惠尔顿（Collin Wheaton）的形象。


    我想象着他们在周年纪念派对上交换的眼神，当时布克斯顿和他的兄弟们轮流分享往年的回忆。那些回忆引发了笑声也引发了泪水。


    在动人的时刻，曼迪和科林会转互相彼此交换一个眼神。那个眼神对某些人来说可能很微妙。但对我来说，作为一个对那种长久感情尚属的新手，那个眼神说明了一切。


    它诉说着他们共同度过的岁月，克服过的困难，以及等待着他们的快乐与冒险。最重要的是，它诉说着让那四十五年的每一天变得丰富的那件事——事实他们是共同度过的。


    我幻象出布克斯顿眼中那抹狡黠的光芒，那是我在第一天就注意到的，我让自己去梦想四十五多年后的某个时刻，到那时，我们将无言地赞叹回首流过的岁月。


    我握紧拳头，将它们放在心口，发誓要抓住这些。


    现在，我决定是时候去救那条裙子了。


