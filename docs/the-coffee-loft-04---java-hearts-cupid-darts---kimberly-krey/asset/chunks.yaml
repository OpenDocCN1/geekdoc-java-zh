    I glance over to see Kirsten grinning widely at me in excitement. Beau helps her
    remove her coat, and the two take comfortable seats in the crowd. I move my gaze
    back to Braxton and give him a nod. It’s genius!


    “Great idea,” I say, relief flooding over me already.


    “Nice to see you two up here again,” JJ says. “This time, we’ll let Braxton take
    the lead.”


    A hush settles over the crowd. “Once upon a time…” the woman says theatrically,
    then hands the mic over to Braxton.


    He lifts the mic to his mouth. “There was a man named Braxton who was married
    to a woman who loved nice things. They had a son named Peter, who was very good
    at soccer. One day, Peter and a fellow teammate started to notice something odd
    between Peter’s mom and the teammate’s dad.”


    Oohs and ahs sound over the crowd. Kirsten’s eyes go wide in surprise. Beau looks
    more amused than anything. A half smile appears on his face while he shakes his
    head. Touche, he says without saying it.


    JJ turns it over to me with a ding, and Braxton holds out the mic.


    When I move to take it from him, he resists long enough for me to look at him
    in question. A grin tugs at one side of his lips, and the mischievous look in
    his eye reminds me of the delicious secret we share. No one else knows that Braxton
    and I shared a kiss in the caboose this afternoon, and something about that excites
    me.


    I force my thoughts back to the story. It’s where Parker and Jack kept telling
    Beau and Kirsten that something wasn’t right.


    I blow out a shaky breath. “That teammate’s dad had a devoted wife named…” I stop
    myself from using Kirsten’s name. “Maggie. With the help of their observant sons,
    Maggie and Braxton began catching on to suspicious behavior. Each time Maggie’s
    husband had an out-of-town work trip, Braxton’s wife happened to plan a girls’
    trip. Something was fishy.”


    The crowd buzzes.


    Ding.


    This time, as I hand the mic over to Braxton, I enjoy the sense of camaraderie.
