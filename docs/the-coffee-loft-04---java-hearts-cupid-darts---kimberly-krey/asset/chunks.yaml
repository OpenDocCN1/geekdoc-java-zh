  trans: '

    他身上散发着新切木材和皮革的味道，可能源于他那条出奇地迷人的工具带。一个奇迹男人，他就是这样。他自己建筑团队的成功经营者，私人定制工作的才华专家，还是那个在雨中看起来英帅极了、充满骑士精神的伞男。


    “你有什么需要的吗？”我问道，希望自己的睫毛没有被泪水打湿。


    他的目光在我手中的勺子和罐子之间游移。“嗯，不。我的意思是，是的，我快做完了。我想知道在我离开之前，你是否想再过一遍。看看在我收尾时，有没有什么想要修改的地方。”


    “噢，你……没问题，等一下。”我放下罐子和勺子，把高跟鞋从地板上脱开，忙着扣带子。如果之前我头顶还罩着乌云，现在感觉那片云更大、更暗了。


    “你会回来参加今晚的活动吧？”我弄好了一只鞋，开始处理另一只鞋的带子，感觉到他的目光落在我身上。


    “你不想让你的新粉丝俱乐部失望的，”我补充道，但事实是，我才是那个失望的人。我并不像我想象中那样讨厌布莱克斯顿。而且谁知道呢——也许如果我们有更多相处的时间，也许会发现我们之间真的有些什么。


    “噢，我不会错过的，”他沙哑地说道。


    我闭上眼睛，抵制住内心想要崩溃的冲动。首先，我遇到了维夫和查德，瞥到了我正在错过的东西——那些我可能永远无法拥有的。接着，我发现布莱克斯顿在我刚刚对他产生好感时，他就要离开了。


    轻缓的脚步声将他带来。当我扣好第二个扣时，我的目光移向他的工作靴，另一阵雪松木味再次弥漫了我的感官。


    他的手垂了下来，我意识到他是在向我伸出手。


    这是今天的第二个骑士精神的举动，我不禁有些陶醉，这恰恰说明了我是么么渴望这种关注。


    我握住他那只宽大的手，欣赏着他皮肤上的老茧……他是个勤奋的男人，我喜欢这一点。


    等他扶我站起来后，布莱克斯顿歪着头，垂下目光。“鞋子不错。”


    我的脸一阵发烫。“谢谢。”老天爷的化学反应。简直要爆炸了。偏偏是现在？为什么偏偏在我们相处结束之后，这种化学反应却要变得如此……鲜活？


    我清了清嗓子。“我们走？”


    当他的目光回回我的眼睛时，他挑起了一只挑情的眉毛，那股酥意直达我的脚趾。


    “我们走。”


    # 11


    ![](img/image_rsrc2A2.jpg)


    ## 布莱克斯顿


    麦姬·莫德拉（Maggie Modella）一点都不公平。


    当我跟着那个女人穿过她的店时，我脑海中只有这句话。她没有脱掉围裙就套上了风大衣，记录一下，那条围裙穿在她身上好看极了。当她拉紧带子时，我转过头，看到一个熟悉的身影走向门口。没几个男人像我表哥查德那样高大又瘦。


    那个男人的手放在他女人腰后，而她一侧臀上顶着一个幼儿。没错，那是他和维维安，没错。看起来很像。

    '
