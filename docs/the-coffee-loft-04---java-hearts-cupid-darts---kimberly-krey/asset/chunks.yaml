    Before my inner voice can spoil the moment, I lean in, lower my head, and press
    a soft, lingering kiss to Maggie’s silky lips. Lips I’ve dreamed about more times
    than I can count. Pleasure stirs warm in my lower belly. I bite back a groan.
    Mmm. Even better than I imagined.


    I pull back, willing my eyes to open once more and find her looking up at me in
    surprise.


    My eyes narrow. “You’re not going to slap me now, are you?”


    She tucks a stray strand of hair behind one ear. “Maybe.” Her cheeks go pink,
    somehow enhancing her beauty all the more.


    My heart is pounding with triumph. I’m a kid again. An adolescent who just held
    hands with his first crush. As elementary as it might sound, I think I like Maggie,
    and I think Maggie likes me.


    “Let me know if you need help placing the mugs in there,” I say, shifting my gaze
    back to the case. It’s a clumsy transition, but I’m already thinking of how to
    get more time with her now that my job here is almost done.


    “I’d love that,” she says. “Then you can see how it looks all filled up.”


    “Right.” I nod, then take a few backward steps as I scan the area once more. “Did
    you see anything you want added or changed?”


    “Not right off,” she says. “I’ll look a little more and let you know.”


    “Sounds good. Hey,” I add, switching gears as I make my way to the door. “What
    do we get if we win the story-telling event tonight?”


    “A romantic date for two,” she answers, her cheeks growing pinker still.


    “Hmm.” I glance at the parking lot before shifting my gaze back to her. “I hope
    we win.”


    # 12


    ![](OEBPS/image_rsrc2A2.jpg)


    Maggie


    What. Just. Happened?


    I watch Braxton step out of the caboose, and it’s like seeing him for the very
    first time. My heart is pounding like a jackhammer. I trace over my lips with
    a shaky hand and relive the feel of his delectable mouth on mine. The way he leaned
    down, tilted his head and moved in for a soft, sensual kiss that did more to me
    than I’m willing to admit.


    I am glued in place, heart melting over the rugged carpenter who works wonders
    with his artistic mind, his capable hands, and those mocha-brown eyes that—it
    turns out—have the power to turn my legs into mush.


    I hadn’t even seen it coming. Here I was, trying to orchestrate something with
    random men at the market and the gym; meanwhile, Cupid was readying his bow with
    his sights set on me, just like Clarissa Lovely said he would.


    My eyes widen as I think of the first dart—Cupid’s clash. Chills erupt over my
    skin because Braxton and I totally clashed. There was nothing contrived about
    it.


    “Wow,” I say breathlessly, stepping backward enough to lean against the wall.


    And Cupid’s cringe—I was humiliated during the story telling event. That has to
    qualify.


    That means I was hit twice. Two darts, one man, and one very sneaky Cupid.


    Lovely said that having just one of those encounters was often impactful enough
    to bond couples in lasting ways, and here I’ve already experienced two with Braxton.


    “It’s happening,” I say in a whisper.


    Excitement stirs low in my tummy, sending a fast and fluttery thrill through my
    very core.


    I replay the kiss once more, the way he looked at me as he leaned in, the feel
    of his warm breath on my skin, when suddenly I’m reminded of the reason I didn’t
    want to like Braxton—his brother is my sister’s new love interest, and that could
    come between them.


    It won’t, I assure my old self, who was obviously overreacting and looking for
    a reason not to risk falling in love. New Me agrees with Kirsten on this point—if
    things don’t work between me and Braxton, we’ll leave it at that. No big deal.


    I’m surprised by how much joy this outlook brings. I feel free—for the first time
    in a long time—to really, truly put myself out there.


    I creak open the door, ready to make a run for the Coffee Loft entrance, when
    something catches my eye. There, hanging on the outer handle of the caboose door
    is my umbrella. I picture Braxton racing into the shop to get it for me and give
    in to the dopey grin that forms on my face.


    Braxton hopes we win tonight’s event and get the romantic date for two, does he?
    I’m hoping for that very thing.


