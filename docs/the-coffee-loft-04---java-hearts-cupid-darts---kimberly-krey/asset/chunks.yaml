- fmt: '

    I lift my gaze and glare at him. “Bye,” I croon, sounding exactly like some mean
    girl from a chick flick because I don’t want to be in his unnerving presence for
    even one second more. He offended me by offending Jeb Nobly because Braxton Wheaton
    is a rude and offensive man.


    He shuffles closer to the door, twists the knob, and glances at the spot on the
    floor. “You might want to look into getting that fixed.” He grins ruefully. “Someone
    could get hurt.” With that, he steps outside. “Good day,” he says as the door
    swings shut.


    I fold my arms and summon my most seething glare at the closed door. “Good day?
    Not with you in it,” I grumble.


    Yet suddenly, the door swings back open. I’m taken so off guard that another yelp
    pulls at my throat.


    Braxton sticks his head inside.


    “What do you want?” I snap, my fists landing on my hips.


    “Just ah…” He pauses there, letting me drown in my agitation without so much as
    a life vest. “I wanted you to know that if I don’t hear from you by this time
    tomorrow, I’ll assume it’s a no and move down the list. I put you in front of
    my other jobs as a favor to Beau and Kirsten, but you can’t stay there forever.”


    He closes the door without another word.


    “You can’t stay there forever,” I mimic again, not caring if he hears this time.
    In fact, let’s see if he can hear this. “Jerk!” I tug my phone from my pocket
    and pull up the text thread with Kirsten.


    `Maggie`: Hate to break it, but I will not be using Braxton for the refurb.


