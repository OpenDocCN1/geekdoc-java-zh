  raw: '“It’s okay,” he breathes against my skin. “I don’t want to rush you. You don’t
    have to say it until you’re ready.” He presses a kiss to my upper cheek, then
    plants another just beneath it. With a series of soft, wonderful kisses, Braxton
    trails a path to the corner of my lips, warming and delighting me all at once.


    Desperate for more reassurance, I lift my chin just in time for his mouth to meet
    mine.


    When it finally does, Braxton’s kiss is strong and certain, seeming to tell me
    all he wants me to know. He really does love me, and he really is willing to wait.


    Soon, his movements become slower, gentler, softer. “Now,” he says, clearing his
    throat, “get ready to meet Maria. She’s a small business owner, too, so you guys
    have a lot in common.”


    Kirsten gives me a wave as I catch eyes with her through the crowd. I have no
    idea what she reads on my face. Shock, disbelief, delight? My sister knows me
    better than anyone, but even if she had a manuscript reading of the dialogue in
    my head, she still wouldn’t know how I’m feeling. Not even I know.


    Still, I greet Maria with a smile and congratulate her on a job well done with
    Braxton’s tux. She tells me that he was gushing about his new girlfriend during
    the fitting, and I nudge Braxton playfully.


    “That’s so sweet. I like telling people about him, too.” It’s a lie. An unnecessary
    lie at that, one that causes me to shift my weight and look away. The fact is,
    I don’t want to gush about a man who could walk away and leave me answering awkward
    questions about what happened when it’s over.


    Throughout the remainder of the party, I managed to pull myself together. Braxton
    told me he loves me, and when I couldn’t say it back, he gave me all the love
    and assurance I could ask for.


    Each time I replay the sentiment, I believe it a little more. And more even still.


    By the time the party’s over, I’ve been introduced to most of the family’s friends,
    relatives, and church community, too.


    We convince Braxton’s parents to head onto the patio for a soak in the hot tub
    while we clean up.


    “So nice to see you again, Maggie,” Collin Wheaton says on his way out, a towel
    draped over one shoulder. “Between you and Kirsten, you’ve made my sons very happy.”


    “Thank you,” I say from my spot in front of the kitchen sink. “They’ve made us
    pretty happy, too, right?” I add, nudging Kirsten who’s doing dishes with me.


    “Definitely,” Kirsten says.


    Mandy Wheaton, who’s standing beside her husband, looks at Braxton and Beau in
    turn. “They better.” She meets eyes with me and pulls an impish grin. “Too bad
    you don’t have a few more sisters for these two.” She points at Liam and Luke.


    Liam shakes out a fresh kitchen garbage bag with a sharp snap. “No doubt.”


    “I’d take one of the Modella chicks in a heartbeat,” Luke adds, making most of
    us laugh.


    Braxton, however, bops him on the head with a balloon before tossing it in the
    open sack. “Watch it.”


    Collin and Mandy grin affectionately at the scene.


    “Well, thanks for making this night a success, kids,” Collin says. “We couldn’t
    have done it without you.” His gaze settles back on Kirsten and me. “Hope to see
    you gals, soon.”


    “Me too,” we say at the same time.


    The couple heads onto the patio in their swimsuits and closes the door behind
    them.


    “Man, I admire them,” Luke says.


    “I envy them,” Liam admits.


    Braxton catches my gaze from across the way, his subtle grin seeming to say that
    we might be well on our way to getting what his parents have.


    I smile reassuringly back. Yes, I decide, we really might be. It’s okay that I
    didn’t say I loved him back yet. If Braxton is as patient as his parents are,
    something I’ve witnessed firsthand, then I’m sure that I’ll get there.


    “Can’t believe you ladies hung in there for all of that,” Braxton says as he tugs
    one end of crepe paper from a cluster of balloons.


    “They were champs.” Beau rounds up the high placed balloons, shoves them into
    the garbage bag, and takes it from Liam. “Take that full one out front, will you,
    Liam?” he asks.


    Liam grabs the bag and heads out front.


    Kirsten hands me a freshly washed cake pan and grins. “We really are champs,”
    she agrees. “We probably both deserve foot rubs.”


    I dry the pan while nodding hugely. “Yeah, and maybe another slice of cheesecake.
    That was so good.”


    Luke, who’s sweeping the kitchen floor, pipes up next. “Hey, boys, while your
    women are giving each other foot rubs and eating cheesecake, why don’t we go out
    and grab a few drinks?”


    Beau chuckles under his breath. “Very funny.”


    “Look who almost missed the party,” Liam says as he bursts back inside. “Braxton,
    it’s a good thing you’re still here. You would have missed seeing your favorite
    cousin.”


    Before I can see who’s stepped in with him, Kirsten nudges me in the arm.


    “Here comes a big one. Are you ready?” She holds a large, crystal punch bowl with
    dripping fingers.


    “Yep,” I say.


    “How you doing, man?” the late-comer cries.


    My gaze stays on Kirsten as she hands over the hefty crystal bowl. I set it carefully
    on the counter and secure the dishtowel once more.


    “Chad,” I hear Braxton bellow. “So good to see you.”


    “You remember my wife, Viv.” My eyes go wide as I piece the names and voices together.


    “Oh my gosh, Viv!” Sure enough, it is them, minus their little boy, Skyler. I
    secure the punchbowl with one hand and lift the other to wave at them. “Where’s
    your little guy?”


    “My folks are watching him at our place,” Chad says.


    Beau points at the couple. “Didn’t I see them here earlier?”


    “Oh, they were here all right,” Chad says, “we just didn’t expect them to stay
    all night.”


    “Wait,” Braxton says. “You guys know each other?”


    Viv’s gaze darts between me and Braxton. “I was going to ask the same thing. How
    do you guys know each other?”


    “Braxton and I are dating,” I say to her before turning to Braxton. “And Vivian’s
    one of my best friends.”


    Vivian starts to squeal. “You two are dating?”


    I grin and nod. “And Chad, you said you’re one of Braxton’s cousins?”


    “Not just one of his cousins…” He tosses his arm around Braxton and slaps his
    chest. “I’m his favorite cousin. This guy was the best man at my wedding.”


    # 20


    ![](OEBPS/image_rsrc2A2.jpg)


    Braxton


    “That’s right,” I agree, reaching behind me to smack Chad in the chest as well.


    “You can’t have been Chad’s best man,” Maggie blurts. She plops the dishtowel
    into the punch bowl on the counter and looks between me and Chad like she’s seen
    a ghost. “Chad’s best man was an absolute jerk.”


    My brow furrows. I know Maggie’s got to be mistaken, but Viv speaks up before
    I can even form a word.


    “What are you talking about, Maggie?” she asks, concern thick on her tone.


    “I didn’t want to tell you,” Maggie says, “but the real reason I didn’t walk in
    your wedding line that day is because Chad’s jerk of a best man compared me to
    the Bride of Frankenstein.”


    Instantly, I picture the sassy woman in the massive neck brace who hobbled away
    after telling us off. I laugh out loud from the shock of it.


    “That was you?”


    “Yes,” she snaps.


    Another laugh forms low in my chest. One of bafflement more than amusement, though
    it’s funny, too, if you think about it. “That is hilarious,” I say. “All this
    time, and we never knew.”


    “I wouldn’t say it was hilarious,” Maggie retorts. “In fact, you should be embarrassed
    for how you treated me that day.” She’s practically yelling now.


    I glance at Viv, Chad, and my brothers as they stand there, looking as stunned
    as I am.


    “I am embarrassed about how I treated her that day. I mean you. I was going to
    apologize, but I couldn’t find you.”


    “Did you honestly think I was going to stick around after that? I was humiliated.”


    “Maggie,” Kirsten says, “maybe you and Braxton should take this into the other
    room.”'
