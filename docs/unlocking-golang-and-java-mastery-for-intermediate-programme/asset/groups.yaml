    \n```java\nimport java.util.List;\nimport java.util.stream.Stream;\n\npublic class\
    \ StreamExample {\n    public static void main(String[] args) {\n        List<String>\
    \ names = List.of(\"Alice\", \"Bob\", \"Charlie\", \"David\");\n\n        // 过滤以\
