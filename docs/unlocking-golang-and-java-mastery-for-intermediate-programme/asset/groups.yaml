    \ declaring variables is as follows:\n\n```\n```java\n<dataType> <variableName>;n```\n\
    ```\n\nHere's an example of declaring and initializing variables in Java:\n\n\
    ```\n```java\npublic class Main {\n    public static void main(String[] args)\
    \ {\n        int age;\n}```\n```"
