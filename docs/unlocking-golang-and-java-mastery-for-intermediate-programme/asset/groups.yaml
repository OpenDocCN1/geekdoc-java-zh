- md: "\n# **Chapter 10: Concurrency in Java**\n\nConcurrency is the ability of a\
    \ system to execute multiple tasks concurrently, enabling programs to perform\
    \ multiple operations simultaneously. In Java, concurrency is achieved using threads,\
    \ which are lightweight sub-processes that can run independently and share resources.\
    \ The Java platform provides powerful APIs and tools to manage concurrent programming\
    \ efficiently. In this chapter, we will explore the fundamentals of concurrency\
    \ in Java, discuss thread management, synchronization, and concurrent collections,\
    \ and provide practical examples to demonstrate how to write concurrent programs.\n\
    \n## Section 1: Introduction to Concurrency\n\n### What is Concurrency?\n\nConcurrency\
    \ refers to the ability of a program to handle multiple tasks simultaneously,\
    \ making use of multiple threads to execute different operations concurrently.\n\
    \n### Threads and Multithreading\n\nA thread is the smallest unit of execution\
    \ within a process. Multithreading allows a program to run multiple threads concurrently,\
    \ enabling more efficient use of CPU resources.\n\n### Benefits of Concurrency\n\
    \nConcurrency offers several advantages, including improved performance, responsiveness,\
    \ and resource utilization. It is particularly beneficial for tasks involving\
    \ I/O operations, where threads can perform non-blocking operations while other\
    \ threads continue execution.\n\n## Section 2: Creating Threads\n\n### Extending\
    \ the `Thread` Class\n\nThreads can be created by extending the `Thread` class\
    \ and overriding the `run()` method.\n\n**Example:**\n\n```java\npublic class\
    \ MyThread extends Thread {\n    @Override\n    public void run() {\n        System.out.println(\"\
    Thread running\");\n    }\n\n    public static void main(String[] args) {\n  \
    \      MyThread thread = new MyThread();\n        thread.start();\n    }\n}\n\
    ```\n\n### Implementing the `Runnable` Interface\n\nAnother way to create threads\
    \ is by implementing the `Runnable` interface and passing it to a `Thread` object.\n\
    \n**Example:**\n\n```java\npublic class MyRunnable implements Runnable {\n   \
    \ @Override\n    public void run() {\n        System.out.println(\"Thread running\"\
    );\n    }\n\n    public static void main(String[] args) {\n        MyRunnable\
    \ myRunnable = new MyRunnable();\n        Thread thread = new Thread(myRunnable);\n\
    \        thread.start();\n    }\n}\n```\n\n## Section 3: Thread Management\n\n\
    ### Thread States\n\nThreads in Java can be in different states, such as `NEW`,\
    \ `RUNNABLE`, `BLOCKED`, `WAITING`, `TIMED_WAITING`, and `TERMINATED`, depending\
    \ on their execution status.\n\n### Thread Priority\n\nThreads can be assigned\
    \ different priorities using the `setPriority()` method, but it is platform-dependent,\
    \ and its usage is limited.\n\n**Example:**\n\n```java\npublic class PriorityExample\
    \ {\n    public static void main(String[] args) {\n        Thread thread1 = new\
    \ Thread(() -> {\n            for (int i = 0; i < 5; i++) {\n                System.out.println(\"\
    Thread 1 - Priority: \" + Thread.currentThread().getPriority());\n           \
    \ }\n        });\n\n        Thread thread2 = new Thread(() -> {\n            for\
    \ (int i = 0; i < 5; i++) {\n                System.out.println(\"Thread 2 - Priority:\
    \ \" + \n                Thread.currentThread().getPriority());\n            }\n\
    \        });\n\n        thread1.setPriority(Thread.MAX_PRIORITY);\n        thread2.setPriority(Thread.MIN_PRIORITY);\n\
    \n        thread1.start();\n        thread2.start();\n    }\n}\n```\n\n### Daemon\
    \ Threads\n\nDaemon threads are threads that run in the background and do not\
    \ prevent the program from exiting when all non-daemon threads have finished.\n\
    \n**Example:**\n\n```java\npublic class DaemonThreadExample {\n    public static\
    \ void main(String[] args) {\n        Thread daemonThread = new Thread(() -> {\n\
    \            while (true) {\n                System.out.println(\"Daemon Thread\
    \ is running...\");\n            }\n        });\n\n        daemonThread.setDaemon(true);\n\
    \        daemonThread.start();\n\n        System.out.println(\"Main thread is\
    \ exiting...\");\n    }\n}\n```\n\n## Section 4: Thread Synchronization\n\n###\
    \ Thread Interference\n\nThread interference occurs when multiple threads access\
    \ shared resources concurrently, leading to unpredictable behavior.\n\n### Synchronized\
    \ Methods\n\nSynchronized methods ensure that only one thread can access the method\
    \ at a time, preventing thread interference.\n\n**Example:**\n\n```java\npublic\
    \ class Counter {\n    private int count = 0;\n    public synchronized void increment()\
    \ {\n        count++;\n    }\n    public synchronized int getCount() {\n     \
    \   return count;\n    }\n}\n```\n\n### Synchronized Blocks\n\nSynchronized blocks\
    \ allow fine-grained control over synchronization by locking on specific objects.\n\
    \n**Example:**\n\n```java\npublic class SynchronizedBlock {\n    private final\
    \ Object lock = new Object();\n    private int count = 0;\n    public void increment()\
    \ {\n        synchronized (lock) {\n            count++;\n        }\n    }\n \
    \   public int getCount() {\n        synchronized (lock) {\n            return\
    \ count;\n        }\n    }\n}\n```\n\n## Section 5: Concurrent Collections\n\n\
    ### ConcurrentHashMap\n\n`ConcurrentHashMap` is a thread-safe version of `HashMap`,\
    \ suitable for concurrent access.\n\n**Example:**\n\n```java\nimport java.util.concurrent.ConcurrentHashMap;\n\
    \npublic class ConcurrentHashMapExample {\n    public static void main(String[]\
    \ args) {\n        ConcurrentHashMap<String, Integer> map = new ConcurrentHashMap<>();\n\
    \        map.put(\"one\", 1);\n        map.put(\"two\", 2);\n        map.forEach((key,\
    \ value) -> System.out.println(key + \" : \" + value));\n    }\n}\n```\n\n###\
    \ CopyOnWriteArrayList\n\n`CopyOnWriteArrayList` is a thread-safe version of `ArrayList`,\
    \ optimized for read-heavy workloads.\n\n**Example:**\n\n```java\nimport java.util.List;\n\
    import java.util.concurrent.CopyOnWriteArrayList;\n\npublic class CopyOnWriteArrayListExample\
    \ {\n    public static void main(String[] args) {\n        List<String> list =\
    \ new CopyOnWriteArrayList<>();\n        list.add(\"Alice\");\n        list.add(\"\
    Bob\");\n        list.forEach(System.out::println);\n    }\n}\n```\n\n## Section\
    \ 6: Thread Communication\n\n### Using `wait()` and `notify()`\n\n`wait()` and\
    \ `notify()` methods allow threads to communicate and coordinate their activities.\n\
    \n**Example:**\n\n```java\npublic class WaitNotifyExample {\n    public static\
    \ void main(String[] args) {\n        Object lock = new Object();\n\n        Thread\
    \ producer = new Thread(() -> {\n            synchronized (lock) {\n         \
