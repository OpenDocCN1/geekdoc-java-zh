  mdcn: "\n\n# **第 10 章：Java 并发**\n\n并发是系统同时执行多个任务的能力，允许程序同时多个操作。在 Java 中，并发通过线程实现，线程是能够独立运行并共享资源的轻量级子进程。Java\
    \ 平台提供了强大的 API 和工具来高效地管理并发编程。在本章中，我们将探索 Java 并发的基础知识，讨论线程管理、同步和并发集合，并提供实用示例演示如何编写并发程序。\n\
    \n## 第 1 节：并发简介\n\n### 什么是并发？\n\n并发是指程序处理多个任务的能力，利用多个线程并发执行不同的操作。\n\n### 线程与多线程\n\
    \n线程是进程中执行的最小单元。多线程允许程序并发运行多个线程，从而更高效地利用 CPU 资源。\n\n### 并发的优势\n\n并发提供了许多优势，包括提高性能、响应能力和资源利用率。它对于涉及\
    \ I/O 操作的任务特别有利，因为线程可以执行非阻塞操作，而其他线程继续执行。\n\n## 第 2 节：创建线程\n\n### 扩展 `Thread` 类\n\
    \n可以通过扩展 `Thread` 类并重写 `run()` 方法来创建线程。\n\n**示例：**\n\n```java\npublic class MyThread\
    \ extends Thread {\n    @Override\n    public void run() {\n        System.out.println(\"\
    Thread running\");\n    }\n\n    public static void main(String[] args) {\n  \
    \      MyThread thread = new MyThread();\n        thread.start();\n    }\n}\n\
    ```\n\n### 实现 `Runnable` 接口\n\n创建线程的另一种方法是实现 `Runnable` 接口并传递给 `Thread` 对象。\n\n\
    **示例：**\n\n```java\npublic class MyRunnable implements Runnable {\n    @Override\n\
    \    public void run() {\n        System.out.println(\"Thread running\");\n  \
    \  }\n\n    public static void main(String[] args) {\n        MyRunnable myRunnable\
    \ = new MyRunnable();\n        Thread thread = new Thread(myRunnable);\n     \
    \   thread.start();\n    }\n}\n```\n\n## 第 3 节：线程管理\n\n### 线程状态\n\nJava 中的线程可以处于不同的状态，如\
    \ `NEW`、`RUNNABLE`、`BLOCKED`、`WAITING`、`TIMED_WAITING` 和 `TERMINATED`，取决于它们的执行状态。\n\
    \n### 线程优先级\n\n线程可以使用 `setPriority()` 方法分配不同的优先级，但它是依赖平台的，且用法有限。\n\n**示例：**\n\n\
    ```java\npublic class PriorityExample {\n    public static void main(String[]\
    \ args) {\n        Thread thread1 = new Thread(() -> {\n            for (int i\
    \ = 0; i < 5; i++) {\n                System.out.println(\"Thread 1 - Priority:\
    \ \" + Thread.currentThread().getPriority());\n            }\n        });\n\n\
    \        Thread thread2 = new Thread(() -> {\n            for (int i = 0; i <\
    \ 5; i++) {\n                System.out.println(\"Thread 2 - Priority: \" + \n\
    \                Thread.currentThread().getPriority());\n            }\n     \
    \   });\n\n        thread1.setPriority(Thread.MAX_PRIORITY);\n        thread2.setPriority(Thread.MIN_PRIORITY);\n\
    \n        thread1.start();\n        thread2.start();\n    }\n}\n```\n\n### 守护线程\n\
    \n守护线程是在后台运行的线程，当当所有非守护线程都结束时，它们不会阻止程序退出。\n\n**示例：**\n\n```java\npublic class\
    \ DaemonThreadExample {\n    public static void main(String[] args) {\n      \
    \  Thread daemonThread = new Thread(() -> {\n            while (true) {\n    \
    \            System.out.println(\"Daemon Thread is running...\");\n          \
    \  }\n        });\n\n        daemonThread.setDaemon(true);\n        daemonThread.start();\n\
    \n        System.out.println(\"Main thread is exiting...\");\n    }\n}\n```\n\n\
    ## 第 4 节：线程同步\n\n### 线程干扰\n\n当多个线程并发访问共享资源时，发生线程干扰，导致不可预测的行为。\n\n### 同步方法\n\n\
    同步方法确保一次只有一个线程可以访问该方法，防止线程干扰。\n\n**示例：**\n\n```java\npublic class Counter {\n\
    \    private int count = 0;\n    public synchronized void increment() {\n    \
    \    count++;\n    }\n    public synchronized int getCount() {\n        return\
    \ count;\n    }\n}\n```\n\n### 同步块\n\n同步块通过对特定对象加锁来实现细粒度的同步控制。\n\n**示例：**\n\n\
    ```java\npublic class SynchronizedBlock {\n    private final Object lock = new\
    \ Object();\n    private int count = 0;\n    public void increment() {\n     \
    \   synchronized (lock) {\n            count++;\n        }\n    }\n    public\
    \ int getCount() {\n        synchronized (lock) {\n            return count;\n\
    \        }\n    }\n}\n```\n\n## 第 5 节：并发集合\n\n### ConcurrentHashMap\n\n`ConcurrentHashMap`\
    \ 是 `HashMap` 的线程安全版本，适用于并发访问。\n\n**示例：**\n\n```java\nimport java.util.concurrent.ConcurrentHashMap;\n\
    \npublic class ConcurrentHashMapExample {\n    public static void main(String[]\
    \ args) {\n        ConcurrentHashMap<String, Integer> map = new ConcurrentHashMap<>();\n\
    \        map.put(\"one\", 1);\n        map.put(\"two\", 2);\n        map.forEach((key,\
    \ value) -> System.out.println(key + \" : \" + value));\n    }\n}\n```\n\n###\
    \ CopyOnWriteArrayList\n\n`CopyOnWriteArrayList` 是 `ArrayList` 的线程安全版本，针对读多型负载进行了优化。\n\
    \n**示例：**\n\n```java\nimport java.util.List;\nimport java.util.concurrent.CopyOnWriteArrayList;\n\
    \npublic class CopyOnWriteArrayListExample {\n    public static void main(String[]\
    \ args) {\n        List<String> list = new CopyOnWriteArrayList<>();\n       \
    \ list.add(\"Alice\");\n        list.add(\"Bob\");\n        list.forEach(System.out::println);\n\
    \    }\n}\n```\n\n## 第 6 节：线程通信\n\n### 使用 `wait()` 和 `notify()`\n\n`wait()` 和\
    \ `notify()` 方法允许线程通信并协调它们的活动。\n\n**示例：**\n\n```java\npublic class WaitNotifyExample\
    \ {\n    public static void main(String[] args) {\n        Object lock = new Object();\n\
    \n        Thread producer = new Thread(() -> {\n            synchronized (lock)\
    \ {\n                System.out.println(\"Producer is producing data...\");\n\
    \                lock.notify(); // 通知等待的消费者\n            }\n        });\n\n  \
    \      Thread consumer = new Thread(() -> {\n            synchronized (lock) {\n\
    \                try {\n                    lock.wait(); // 等待生产者产生数据...\n   \
    \                 System.out.println(\"Consumer is consuming data...\");\n   \
    \             } catch (InterruptedException e) {\n                    e.printStackTrace();\n\
    \                }\n            }\n        });\n\n        producer.start();\n\
    \        consumer.start();\n    }\n}\n```\n\n## 第 7 节：线程安全\n\n### Java 中的线程安全\n\
    \n线程安全是指程序在多线程环境中正确且安全运行的能力。\n\n### 不变对象\n\n不可变对象是天生线程安全的，因为它们的状态在创建后无法被修改。\n\n\
    **示例：**\n\n```java\npublic final class ImmutablePoint {\n    private final int\
    \ x;\n    private final int y;\n    public ImmutablePoint(int x, int y) {\n  \
    \      this.x = x;\n        this.y = y;\n    }\n    public int getX() {\n    \
    \    return x;\n    }\n\n    public int getY() {\n        return y;\n    }\n}\n\
    ```\n\n"
