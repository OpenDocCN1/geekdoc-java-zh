    \        } catch (MalformedURLException e) {\n            e.printStackTrace();\n\
    \        }\n    }\n}\n```\n\n## Section 4: HTTP Communication\n\n### HTTP Basics\n\
    \nHTTP (Hypertext Transfer Protocol) is the foundation of data communication on\
    \ the internet.\n\n### HttpURLConnection Class\n\nJava provides the `HttpURLConnection`\
    \ class in the `java.net` package for making HTTP requests and processing responses.\n\
    \n**Example:**\n\n```java\nimport java.io.*;\nimport java.net.*;\n\npublic class\
    \ HTTPExample {\n    public static void main(String[] args) {\n        try {\n\
    \            URL url = new URL(\"https://api.example.com/data\");\n          \
    \  HttpURLConnection conn = (HttpURLConnection) url.openConnection();\n      \
    \      conn.setRequestMethod(\"GET\");\n\n            int responseCode = conn.getResponseCode();\n\
    \            System.out.println(\"Response Code: \" + responseCode);\n\n     \
