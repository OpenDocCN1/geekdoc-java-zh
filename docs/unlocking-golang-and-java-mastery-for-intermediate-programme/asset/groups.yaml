    \ = number; // Automatic conversion from int to double\n```\n\nHowever, explicit\
    \ type conversion, known as casting, is required when converting a larger data\
    \ type to a smaller data type to avoid data loss:\n\n```java\ndouble largeNumber\
    \ = 1234.56;\nint smallNumber = (int) largeNumber;\n```\n\n### ### Type Conversion\
