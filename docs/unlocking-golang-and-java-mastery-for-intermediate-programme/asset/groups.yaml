    # Chapter 13: Database Connectivity with JDBC\n\nDatabase connectivity is a crucial\
    \ aspect of modern software applications, allowing programs to interact with relational\
    \ databases to store, retrieve, and manipulate data. Java Database Connectivity\
    \ (JDBC) is a standard Java API that enables Java applications to connect to and\
    \ interact with various relational databases. In this chapter, we will explore\
    \ the fundamentals of JDBC, establishing database connections, executing queries,\
    \ and performing database operations, with practical examples to demonstrate how\
    \ to work with databases in Java applications.\n\n## Section 1: Introduction to\
    \ JDBC\n\n### What is JDBC?\n\nJDBC stands for Java Database Connectivity, and\
    \ it is a standard Java API that provides a set of classes and interfaces for\
    \ connecting to relational databases.\n\n### JDBC Architecture\n\nJDBC follows\
    \ a layered architecture, including:\n\n1. JDBC API: Contains interfaces and classes\
    \ to interact with databases.\n2. JDBC Manager: Manages database drivers and handles\
    \ connections.\n3. JDBC Driver: Implements the low-level communication with specific\
    \ databases.\n\n## Section 2: Connecting to the Database\n\n### Loading JDBC Driver\n\
    \nBefore connecting to a database, you need to load the appropriate JDBC driver\
    \ using `Class.forName()`.\n\n**Example:**\n\n```java\nimport java.sql.*;\n\n\
    public class DBConnectionExample {\n    public static void main(String[] args)\
    \ {\n        try {\n            Class.forName(\"com.mysql.jdbc.Driver\");\n  \
    \          System.out.println(\"JDBC Driver loaded successfully!\");\n       \
    \ } catch (ClassNotFoundException e) {\n            System.out.println(\"Failed\
    \ to load JDBC Driver: \" + e.getMessage());\n        }\n    }\n}\n```\n\n###\
    \ Establishing Database Connection\n\nAfter loading the JDBC driver, you can establish\
    \ a connection to the database using `DriverManager.getConnection()`.\n\n**Example:**\n\
    \n```java\nimport java.sql.*;\n\npublic class ConnectionExample {\n    public\
    \ static void main(String[] args) {\n        String url = \"jdbc:mysql://localhost:3306/mydatabase\"\
    ;\n        String username = \"username\";\n        String password = \"password\"\
    ;\n\n        try {\n            Connection connection = DriverManager.getConnection(url,\
    \ username, password);\n            System.out.println(\"Database established\
    \ successfully!\");\n        } catch (SQLException e) {\n            System.out.println(\"\
    Failed to establish database connection: \" + e.getMessage());\n        }\n  \
    \  }\n}\n```\n\n## Section 3: Executing SQL Queries\n\n### Executing Statements\n\
    \nOnce the database connection is established, you can create a `Statement` object\
    \ to execute SQL queries.\n\n**Example:**\n\n```java\nimport java.sql.*;\n\npublic\
    \ class SQLQueryExample {\n    public static void main(String[] args) {\n    \
    \    String url = \"jdbc:mysql://localhost:3306/mydatabase\";\n        String\
    \ username = \"username\";\n        String password = \"password\";\n\n      \
    \  try {\n            Connection connection = DriverManager.getConnection(url,\
    \ username, password);\n            Statement statement = connection.createStatement();\n\
    \            // Execute queries here...\n        } catch (SQLException e) {\n\
    \            System.out.println(\"Error: \" + e.getMessage());\n        }\n  \
    \  }\n}\n```\n\n### Prepared Statements\n\nPrepared statements are a more efficient\
    \ way to execute SQL queries, especially for parameterized queries.\n\n**Example:**\n\
    \n```java\nimport java.sql.*;\n\npublic class PreparedStatementExample {\n   \
    \ public static void main(String[] args) {\n        String url = \"jdbc:mysql://localhost:3306/mydatabase\"\
    ;\n        String username = \"username\";\n        String password = \"password\"\
    ;\n\n        try {\n            Connection connection = DriverManager.getConnection(url,\
    \ username, password);\n            String sql = \"INSERT INTO employees (name,\
    \ age) VALUES (?, ?)\";\n            PreparedStatement statement = connection.prepareStatement(sql);\n\
    \n            statement.setString(1, \"John\");\n            statement.setInt(2,\
    \ 30);\n            statement.executeUpdate();\n\n            statement.setString(1,\
    \ \"Alice\");\n            // ... more code\n        } catch (SQLException e)\
    \ {\n            System.out.println(\"Error: \" + e.getMessage());\n        }\n\
    \    }\n}\n```\n"
