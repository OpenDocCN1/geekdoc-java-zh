    John\");\nemployee.setAge(30);\n\nsession.save(employee);\n\ntx.commit();\nsession.close();\n\
    ```\n\n## 第 4 节：Apache Maven\n\n### Apache Maven 简介\n\nApache Maven 是一个用于 Java\
    \ 项目的构建自动化和依赖管理工具。\n\n### 项目结构与 pom.xml\n\nMaven 遵循标准的项目结构，所有项目配置都都在在 `pom.xml`\
    \ 文件中。\n\n**示例：pom.xml**\n\n```xml\n<project xmlns=\"http://maven.apache.org/POM/4.0.0\"\
