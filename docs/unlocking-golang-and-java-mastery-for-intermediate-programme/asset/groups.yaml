    \ 2 章：理解面向对象编程\n\n面向对象编程 (OOP) 是一种围绕对象设计的范式，它允许开发者模拟现实世界的实体。OOP 的核心是将数据（属性）和操作数据（方法）封装在一起。\n\
    \n### 类与对象\n\n类（Class）是创建对象的蓝图或模板。它定义了对象将具有的结构和行为。\n\nJava 示例：\n\n```java\npublic\
    \ class Car {\n    String make;\n    String model;\n    int year;\n\n    public\
