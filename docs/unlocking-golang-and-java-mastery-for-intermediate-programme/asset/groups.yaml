    \n## 第 7 章：Go 中的结构体与接口\n\n欢迎来到《解锁 Golang：中级编程精通必备指南》第 7 章。在本章中，我们将探索 Go 中两个强大的概念：结构体（structs）和接口（interfaces）。结构体允许你通过将相关字段组合来定义自己的数据类型，而接口提供了一种定义可以被多个类型实现的行为。通过理解如何使用结构体和接口，你将能够在\
    \ Go 中设计出更具模块化且可扩展的代码。\n\n### Go 中的结构体\n\n结构体是一种复合数据类型，它将零或多个不同数据类型的字段组合在一起。它允许你创建自定义的数据结构，使得在程序中表示现实世界的实体变得更加简单。\n\
    \n#### 声明和初始化结构体\n\n在 Go 中声明结构体，你需要定义它的字段以及对应的数据类型。\n\n```go\npackage main\n\n\
    import \"fmt\"\n\ntype Person struct {\n    FirstName string\n    LastName  string\n\
    \    Age       int\n}\n\nfunc main() {\n    var p Person\n\n    p.FirstName =\
    \ \"Alice\"\n    p.LastName = \"Smith\"\n    p.Age = 30\n\n    fmt.Println(\"\
    Person:\", p)\n}\n```\n\n#### 使用值初始化结构体\n\n你也可以在声明时使用值初始化结构体。\n\n```go\npackage\
    \ main\n\nimport \"fmt\"\n\ntype Person struct {\n    FirstName string\n    LastName\
    \  string\n    Age      int\n}\n\nfunc main() {\n    p := Person{\n        FirstName:\
    \ \"Bob\",\n        LastName:  \"Johnson\",\n        Age:      28,\n    }\n\n\
    \    fmt.Println(\"Person:\", p)\n}\n```\n\n#### 访问结构体字段\n\n你可以使用点运算符（dot notation）访问结构体字段。\n\
    \n```go\npackage main\n\nimport \"fmt\"\n\ntype Person struct {\n    FirstName\
    \ string\n    LastName  string\n    Age       int\n}\n\nfunc main() {\n    p :=\
    \ Person{\n        FirstName: \"Charlie\",\n        LastName:  \"Brown\",\n  \
    \      Age:       35,\n    }\n\n    fmt.Println(\" First Name:\", p.FirstName)\n\
    \    fmt.Println(\"Last Name:\", p.LastName)\n}\n```\n\n### 嵌入结构体\n\n你可以将一个结构体嵌入另一个结构体中，以创建复杂的结构。\n\
    \n```go\npackage main\n\nimport \"fmt\"\n\ntype Person struct {\n    FirstName\
    \ string\n    LastName  string\n    Age       int\n}\n\ntype Address struct {\n\
    \    Street  string\n    City    string\n    Country string\n}\n\nfunc main()\
