    \    def make_sound(self):\n        print(\"Dog barks\")\n\nclass Cat(Animal):\n\
    \    def make_sound(self):\n        print(\"Cat meows\")\n```\n\n### 多态\n\n多态允许将不同类的对象被视为公共父类的对象。它允许一个接口表示不同种的实体，为代码提供了灵性和扩展性。\n\
