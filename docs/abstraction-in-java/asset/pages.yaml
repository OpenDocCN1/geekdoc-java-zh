  md: "# Abstraction in Java\n\n```\npublic void giveCommission(Double amount) {\n\
    \    grossCommission += amount;\n}\n```\n\nAs you can see a lot of the code is\
    \ duplicated between SalaryEmployee and CommissionEmployee. In fact the only thing\
    \ that's different is the calculation for grossPayment, which uses a commission\
    \ value in CommissionEmployee. Some of the functionality is the same, and some\
    \ is different. This looks like a good candidate for an Abstract Class.\n\n# 4.3.3\
    \ The Employee Abstract Class\n\nLet's abstract the name and bank account functionality\
    \ into an Employee abstract class. SalaryEmployee and CommissionEmployee can then\
    \ extend this abstract class and provide different implementations for grossPayment\
    \ ().\n\n# 4.3.3.1 Class Diagram\n\n![](img/3ed46cf971278dea2d7c239e74f87929_19_0.png)\n\
