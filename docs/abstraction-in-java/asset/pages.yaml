  md: '# Chapter 1


    # Introduction


    In this tutorial we will give an introduction to Abstraction in Java and define
    a simple Payroll System using Interfaces, Abstract Classes and Concrete Classes.


    There are two levels of abstraction in Java - **Interfaces**, used to define expected
    behaviour and **Abstract Classes**, used to define incomplete functionality.


    We will now look at these two different types of abstraction in detail.'
  merge: -1
