  md: "# Handling Bonuses\n\nThe boss is very happy with the system far, but he's\
    \ tells us that in order to motivate his employees he wants the ability to give\
    \ them weekly percentage bonuses. He tells us that Commissioned Employees are\
    \ typically on a lower salary we should give them a bonus of 1.5x in order that\
    \ their percentage bonus is bumped up. The bonus should be reflected in the gross\
    \ payment of each employee.\n\n# The Employee Class for Bonuses\n\nLet's add a\
    \ field to capture any bonuses that are given, a protected method to return and\
    \ reset the bonus and an abstract method to give the bonus. The getBonus method\
    \ is abstract because it will be implemented differently for Salaried and Commissioned\
    \ Employees.\n\n```\npublic abstract class Employee implements Payee {\n    private\
    \ String name;\n    private Integer bankAccount;\n\n    protected Double currentBonus;\n\
    \    protected Double grossWage;\n\n    public Employee(String name, Integer bankAccount,\
    \ Double grossWage) {\n        this.name = name;\n        this.bankAccount = bankAccount;\n\
    \        this.grossWage = grossWage;\n        currentBonus = 0.0;\n    }\n\n \
    \   public String name() {\n        return name;\n    }\n\n    public Integer\
    \ bankAccount() {\n        return bankAccount;\n    }\n\n    public abstract void\
    \ giveBonus(Double percentage);\n\n    protected Double doCurrentBonus() {\n \
    \       Double bonus = currentBonus;\n        currentBonus = 0.0;\n        return\
    \ bonus;\n    }\n}\n```\n\nUpdates to SalaryEmployee:\n\n```\npublic class SalaryEmployee\
    \ extends Employee {\n    public SalaryEmployee(String name, Integer bankAccount,\
    \ Double grossWage) {\n        super(name, bankAccount, grossWage);\n    }\n\n\
    \    public void giveBonus(Double percentage) {\n        currentBonus += grossWage\
    \ * (percentage/100.0);\n    }\n\n    public Double grossPayment() {\n       \
    \ return grossWage + doCurrentBonus();\n    }\n}\n```"
