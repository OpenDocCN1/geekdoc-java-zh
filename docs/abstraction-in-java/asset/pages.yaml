  md: "# Abstraction in Java\n\nmethod will do, it will be defined in any concrete\
    \ classes which extend MyAbstractClass.doSomethingNumber() doesn't have a method\
    \ body because it is abstract.\n\nIn interfaces all methods are public by default,\
    \ however the scope of the abstract method may be package, protected or private.\
    \ You can see that some behavioural implementation in interface is mixed with\
    \ some behavioural definition in doingSomethingNumber() in this class abstract.\
    \ Abstract classes mix some implementation with some definition. Concrete classes\
    \ which extend Abstract class will reuse the implementation of increment() while\
    \ guaranteeing to provide their own implementations of doSomethingNumber().\n\n\
    # 3.2 Extending Abstract Classes\n\nNow we have created an abstract class let's\
    \ make a concrete implementation for it. We make concrete implementations from\
    \ abstract classes using the extends keyword in a class which is not abstract.\n\
    \n```\npublic class MyConcreteClass extends MyAbstractClass {\n    public void\
    \ sayHello() {\n        System.out.println(\"Hello there!\");\n    }\n\n    public\
    \ void doSomethingNumber() {\n        System.out.println(\"The number is \" +\
    \ someNumber);\n    }\n}\n```\n\nWe have created a concrete class called MyConcreteClass\
    \ and extended MyAbstractClass. We only needed to provide implementation for the\
    \ abstract method doSomethingNumber() because we inherit the private member variables\
    \ and methods from MyAbstractClass. If any client calls increment() on MyConcreteClass\
    \ implementation defined in MyAbstractClass will be executed. A new method called\
    \ sayHello is unique to MyConcreteClass and wouldn't be available from any other\
    \ class which implements MyAbstractClass.\n\nWe also extend MyAbstractClass with\
    \ another abstract class where we do not define doSomethingNumber - this means\
    \ another abstract class will have to be defined, which extends this class in\
    \ order to implement doSomethingNumber().\n\n```\npublic abstract class MyAbstractClass\
    \ extends MyAbstractClass {\n    public void sayHello() {\n        System.out.println(\"\
    Hello there!\");\n    }\n}\n```\n\nWe didn't have to make any reference to doSomethingNumber()\
    \ here, however we create a concrete class for MyAbstractClass we will provide\
    \ the implementation for doSomethingNumber().\n\nLastly, abstract classes can\
    \ implement interfaces. Because the abstract class is not instantiated itself\
    \ it does have to provide an implementation for all (or any) of the interface\
    \ methods. If the abstract class does not provide an implementation for an interface\
    \ method, the class which extends the abstract class will have to provide the\
    \ implementation.\n\n```\npublic abstract MyImplementingAbstractClass implements\
    \ MyInterface {\n    public void methodA() {\n        System.out.println(\"Method\
    \ A has been implemented in this abstract class\");\n    }\n}\n```\n\nHere we\
    \ see that MyImplementingAbstractClass implements MyInterface but only provides\
    \ an implementation for methodA(). If any concrete class extends MyImplementingAbstractClass\
    \ it will have to provide an implementation for methodB() and methodC() as defined\
    \ in MyInterface."
