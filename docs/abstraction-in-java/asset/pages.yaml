  md: "# Abstraction in Java\n\n```\npublic interface OneMethodInterface {\n    void\
    \ methodName();\n}\n```\n\nIt defines one void method which takes no parameters.\n\
    Let's implement it:\n\n```\npublic class ClassA implements OneMethodInterface\
    \ {\n    public void methodName() {\n        System.out.println(\"Runtime type\
    \ is ClassA.\");\n    }\n}\n```\n\nWe can use this in a client just before:\n\n\
    ```\nOneMethodInterface myObject = new ClassA();\nmyObject.methodName();\n```\n\
    \nOutput:\n\n```\nRuntime type is ClassA.\n```\n\nNow let's make a different implementation\
    \ for OneMethodInterface:\n\n```\npublic class ClassB implements OneMethodInterface\
    \ {\n    public void methodName() {\n        System.out.println(\"The runtime\
    \ type of this class is ClassB.\");\n    }\n}\n```\n\nAnd modify our code above:\n\
    \n```\nOneMethodInterface myObject = new ClassA();\nmyObject = new ClassB();\n\
    myObject.methodName();\n```\n\nOutput:\n\n```\nRuntime type is ClassA.\nRuntime\
    \ type of this class is ClassB.\n```\n\nWe have successfully used the Reference\
    \ (myObject) to refer to instances of two different runtime types. The actual\
    \ implementation that OneMethodInterface is implemented, by, anything, and in\
    \ any way. As far as the compiler is concerned myObject is a OneMethodInterface,\
    \ and one() is available, even if it is reassigned to a different instance object\
    \ of a different class. This ability to provide more than one runtime type and\
    \ it resolved at run time, rather than compile, is called polymorphism.\n\nInterfaces\
    \ define behaviour without any implementation details (ignoring Java 8) and implementing\
    \ classes define all the implementation for the classes they define, but what\
    \ if we want a mix of the two concepts? If we want to mix some behaviour definition\
    \ and some implementation together in the same place we can use an abstract class."
