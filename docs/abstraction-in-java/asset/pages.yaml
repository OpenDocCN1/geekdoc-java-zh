  md: '# Abstraction in Java


    ```

    TwoMethodAbstractClass myObject = new ConcreteClassA();

    myObject.oneMethod();

    myObject.twoMethod();

    myObject = new ConcreteClassB();

    myObject.oneMethod();

    myObject.twoMethod();

    ```


    Output:


    TwoMethod is implemented in TwoMethodAbstractClass.

    TwoMethod is implemented in ConcreteClassA.

    ConcreteClassB implements its own twoMethod.


    We have used the reference (myObject) to refer to instances of two different runtime
    types. When the runtime type of myObject is ConcreteClassA it uses the implementation
    of twoMethod from ConcreteClassA. When the runtime of myObject is ConcreteClassB
    it uses the implementation of twoMethod from ConcreteClassB. In both cases the
    common implementation of oneMethod from TwoMethodAbstractClass is used.


    Abstract classes are used to define common behaviours while providing contracts
    or promises that other behaviours will be available from a concrete class later.
    This allows us to build object models where we can reuse common functionality
    and capture differing requirements in different concrete classes.'
