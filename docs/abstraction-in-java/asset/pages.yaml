    # 4.7 Advanced Functionality: Taxation


    The boss is ever on the moon with the Payment System, however the trouble the
    taxman has sent him a letter telling him that he has to incorporate some sort
    of tax withholding into the system or he''ll be in trouble. There should be a
    global rate for the system and each employee should have a personal tax allowance.
    The tax should only be collected on payments made to an employee and above the
    tax free allowance. The employee should then only be paid the amount of payment
    due to them. Contracting Companies are responsible for paying their own tax so
    the system should not withhold from them.


    In order to handle taxation we will need to create a new, type of Payee which
    is taxable and can provide a tax allowance


    In we can extend interfaces. Let''s us add behaviour definitions without modifying
    our original interface. All of the behaviour defined in the original interface
    will be automatically carried into the new.


    # 4.7.1 The TaxablePayee Interface


    We''ll extend Payee to create a new TaxablePayee interface, we''ll then have Employee
    implement that interface, while letting ContractingCompany remain as a regular,
    untaxed, Payee.'
