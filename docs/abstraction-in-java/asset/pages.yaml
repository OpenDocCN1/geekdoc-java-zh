  md: "# 3.3 Using Abstract Classes\n\nLike with Interfaces and regular classes, to\
    \ call the methods of an abstract class you use the (.) operator.\n\n```\nMyAbstractClass\
    \ object1 = new MyConcreteClass();\nobject1.increment();\nobject1.doSomethingWithNumber();\n\
    ```\n\nAgain notice that object1 is a reference to an instance that provides a\
    \ concrete implementation for MyAbstractClass and the runtime type of instance\
    \ is MyConcreteClass. For all intents and purposes object1 is created by the compiler\
    \ as it is a MyAbstract instance. If you tried to call the sayHello() method defined\
    \ in MyConcreteClass you would get a compiler error. This method is not visible\
    \ to the compiler because object1 is a MyAbstract class. The only guarantee object1\
    \ provides is it will have implementations for the methods defined in MyAbstractClass.\
    \ Any other methods provided by the runtime are not visible.\n\n```\nobject1.sayHello();\
    \ // compiler error\n```\n\nAs with interfaces we can provide different runtime\
    \ types and use them through the same reference.\n\nDefines a new abstract class\n\
    \n```\npublic abstract class TwoMethodAbstractClass {\n\n    public void oneMethod()\
    \ {\n        System.out.println(\"oneMethod is implemented in TwoMethodAbstractClass.\"\
    );\n    }\n\n    public abstract void twoMethod();\n\n}\n```\n\nIt defines one\
    \ method implemented and an abstract method.\n\nLet's extend it with a concrete\
    \ class\n\n```\npublic class ConcreteA extends TwoMethodAbstractClass {\n\n  \
    \  public void twoMethod() {\n        System.out.println(\"twoMethod is implemented\
    \ in ConcreteA.\");\n    }\n\n}\n```\n\nWe can use it in a client just like this:\n\
    \n```\nTwoMethodAbstractClass myObject = new ConcreteA();\nmyObject.oneMethod();\n\
    myObject.twoMethod();\n```\n\nOutput:\n\n```\noneMethod is implemented in TwoMethodAbstractClass.\n\
    twoMethod is implemented in ConcreteA.\n```\n\nNow let's make a different concrete\
    \ class which extends TwoMethodAbstractClass:\n\n```\npublic class ConcreteB extends\
    \ TwoMethodAbstractClass {\n\n    public void twoMethod() {\n        System.out.println(\"\
    ConcreteB implements its own twoMethod.\");\n    }\n\n}\n```\n\nAnd modify our\
    \ code above:"
