  md: "# Chapter 3\n\n# Abstract Classes\n\nAn abstract class is like an incomplete\
    \ blueprint, it defines some of the implementation details of the class while\
    \ leaving others as simple behaviour definitions to be implemented later.\n\n\
    Imagine a blueprint of a house where the house is drawn in completely but there\
    \ is a big empty square where the garage will be gone. We do not know what it\
    \ will look like. Somebody else will have to take a copy of our blueprint in the\
    \ garage. In fact many different people may take copies of our blueprint and draw\
    \ in different types of garage. Houses built using these blueprints will be recognizable\
    \ variants of our house; the front door, the room layouts and the windows will\
    \ be all identical, however the garages will be different.\n\nLike the blueprint\
    \ above our abstract classes define some methods completely, and these method\
    \ implementations will be the same in all implementations of the abstract class.\
    \ The abstract class will define only the signature for other methods, in the\
    \ same way that interfaces does. The method implementations for these methods\
    \ will vary in the implementing classes. Implementing an abstract class is commonly\
    \ referred to as a concrete class. Due to the inheritance relationship between\
    \ the concrete class and the abstract class we generally say that a concrete extends\
    \ an abstract class, rather than implements it as we say with interfaces.\n\n\
    Just like interfaces any client code knows that if a concrete class is extending\
    \ the abstract class class guarantees to provide method bodies for the abstract\
    \ methods of the abstract class (the abstract class provides its own methods for\
    \ non-abstract methods, of course).\n\nAgain, just like interfaces, there can\
    \ be different concrete classes of a given abstract class, each define very different\
    \ behaviours for the abstract methods of the abstract class while satisfying the\
    \ contract of the abstract class. The implementation details are hidden from the\
    \ client.\n\n# 3.1 Defining Abstract Classes\n\nThe keyword abstract is used to\
    \ define both class and its methods as abstract.\n\n```\npublic abstract class\
    \ MyAbstractClass {\n    protected int someNumber = 0;\n\n    public void increment()\
    \ {\n        someNumber++;\n    }\n\n    public abstract void doSomethingWithNumber();\n\
    }\n```\n\nHere we defined an abstract class called MyAbstractClass which contains\
    \ an integer and provides a method for incrementing that integer. We also define\
    \ an abstract method called doSomethingWithNumber(). We don't yet know what this"
