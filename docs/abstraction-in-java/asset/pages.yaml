  md: "# Chapter 4\n\n# A Worked Example - Payments System\n\nWe have been asked to\
    \ build a payments system for a company. We know that the company has different\
    \ types of employees that can be paid in different ways; salaried and with commission.\
    \ The boss of the company understands that his needs will change and the system\
    \ may be changed later to accommodate different types of entities which will receive\
    \ payments.\n\n# 4.1 The Payee Interface\n\nLet's start by considering the employees.\
    \ They must receive payments, but we also know that later on we may need to have\
    \ different entities also receive payments. Let's create an interface, Payee,\
    \ which will define the sort of behaviour we' expect from entities which can receive\
    \ payments.\n\n```\npublic interface Payee {\n    String name();\n    Double grossPayment();\n\
    \    Integer bankAccount();\n}\n```\n\nHere we have a Payee interface let's write\
    \ some code that guarantees three behaviours; the ability to provide a name for\
    \ the Payee, the ability to provide a gross payment amount which should be paid\
    \ and the ability to provide a bank account number where the funds should be deposited.\n\
    \n# 4.2 The Payment System\n\nNow that we have a Payee defined let's write some\
    \ code that it uses. We'll create a PaymentSystem class which maintains a list\
    \ of Payees and will on cycle through them and transfer the requested amount into\
    \ the appropriate bank account.\n\n```\npublic class PaymentSystem {\n    private\
    \ List<Payee> payees;\n\n    public PaymentSystem() {\n        payees = new ArrayList<>();\n\
    \    }\n\n    public void addPayee(Payee payee) {\n        if (!payees.contains(payee))\
    \ {\n            payees.add(payee);\n        }\n    }\n```"
