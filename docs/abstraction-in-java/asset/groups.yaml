  mdcn: "\n\n# Java 中的抽象\n\n```\nTwoMethodAbstractClass myObject = new ConcreteClassA();\n\
    myObject.oneMethod();\nmyObject.twoMethod();\nmyObject = new ConcreteClassB();\n\
    myObject.oneMethod();\nmyObject.twoMethod();\n```\n\n输出:\n\nTwoMethod is implemented\
    \ in TwoMethodAbstractClass.\nTwoMethod is implemented in ConcreteClassA.\nConcreteClassB\
    \ implements its own twoMethod.\n\n我们使用了引用 (myObject) 来指向两个不同运行时类型的实例。当 myObject\
    \ 的运行时类型为 ConcreteClassA 时，它使用来自 ConcreteClassA 的 `twoMethod` 实现。当 myObject 的运行时类型为\
    \ ConcreteClassB 时，它使用来自 ConcreteClassB 的 `twoMethod` 实现。在这两种情况下，都使用了来自 TwoMethodAbstractClass\
    \ 的 `oneMethod` 通用实现。\n\n抽象类用于定义共同行为，同时提供契约或承诺，后续具体类将提供其他行为。这允许我们构建对象模型，在模型中我们可以重用通用功能，并在不同的具体类中捕捉不同的需求。\n\
    \n# 第 4 章\n\n# 实例示例 - 支付系统\n\n我们被要求为公司构建一个支付系统。我们知道公司有不同类型的员工，可以以不同的方式支付工资：薪制和佣金制。公司老板理解他的需求会发生变化，系统可能会进行更改，以适应接收支付的不同类型的实体。\n\
    \n# 4.1 Payee 接口\n\n让我们从考虑员工开始。他们必须接收支付，但我们也知道以后可能需要不同的实体也接收支付。让我们创建一个接口 `Payee`，它将定义我们期望能够接收支付的实体提供的行为。\n\
    \n```java\npublic interface Payee {\n    String name();\n    Double grossPayment();\n\
    \    Integer bankAccount();\n}\n```\n\n这里有一个 `Payee` 接口，让我们写一些代码来保证三种行为：为 Payee\
    \ 提供名称的能力、提供应支付的毛金额的能力，以及提供资金应存入银行账户的能力。\n\n# 4.2 支付系统\n\n现在我们定义了 `Payee`，让我们写一些使用它的代码。我们将创建一个\
    \ `PaymentSystem` 类，它维护一个 `Payee` 列表，并将循环遍历它们并将请求金额转入相应的银行账户。\n\n```java\npublic\
    \ class PaymentSystem {\n    private List<Payee> payees;\n\n    public PaymentSystem()\
    \ {\n        payees = new ArrayList<>();\n    }\n\n    public void addPayee(Payee\
    \ payee) {\n        if (!payees.contains(payee)) {\n            payees.add(payee);\n\
    \        }\n    }\n\n    public void processPayments() {\n        for (Payee payee\
    \ : payees) {\n            Double grossPayment = payee.grossPayment();\n\n   \
    \         System.out.println(\"Paying to \" + payee.name());\n            System.out.println(\"\
    \\tgross\\t\" + grossPayment);\n            System.out.println(\"\\tTransferred\
    \ to Account: \" + payee.bankAccount());\n        }\n    }\n}\n```\n\n你可以看到 `PaymentSystem`\
    \ 完全忽略 `Payee` 的运行时类型，它不需要关心。它知道无论正在处理的 `Payee` 运行时类型是什么，都保证实现了 `name()`、`grossPayment()`\
    \ 和 `bankAccount()`。基于这一知识，只需执行一个 for 循环遍历所有的 `Payee` 并使用这些方法处理它们的支付即可。\n\n# 4.3\
    \ 员工类\n\n老板告诉我们他有两种不同类型的员工——薪制员工和佣金制员工。薪制员工有不改变的基本工资，而佣金制员工有基本工资，并且还可以根据成功的销售获得销售佣金。\n\
    \n# 4.3.1 SalaryEmployee 类\n\n让我们从一个用于薪制员工的类开始。它应该实现 `Payee` 接口，以便被支付系统使用。\n除了代码之外，让我们还使用类图来表示我们的类。在类图中，虚箭头表示实现（implements）关系，实箭头表示继承（extends）关系。\n\
    \n# 4.3.1.1 类图\n\n![](img/3ed46cf971278dea2d7c239e74f87929_17_0.png)\n\n图 4.1:\
    \ 截图\n\n# 4.3.1.2 代码\n\n```java\npublic class SalaryEmployee implements Payee\
    \ {\n    private String name;\n    private Integer bankAccount;\n    protected\
    \ Double grossWage;\n\n    public SalaryEmployee(String name, Integer bankAccount,\
    \ Double grossWage) {\n        this.name = name;\n        this.bankAccount = bankAccount;\n\
    \        this.grossWage = grossWage;\n    }\n\n    public Integer bankAccount()\
    \ {\n        return bankAccount;\n    }\n\n    public String name() {\n      \
    \  return name;\n    }\n\n    public Double grossPayment() {\n        return grossWage;\n\
    \    }\n}\n```\n\n# 4.3.2 CommissionEmployee 类\n\n现在让我们创建一个 `CommissionEmployee`\
    \ 类。这个类将类似于 `SalaryEmployee`，但具有支付佣金的能力。\n\n# 4.3.3 Employee 抽象类\n\n你可以看到，`SalaryEmployee`\
    \ 和 `CommissionEmployee` 之间有很多重复的代码。事实上，唯一不需要实现 `Payee` 中定义的 `grossPayment()`\
    \ 方法的地方是由于 `Employee` 是抽象的。现在让我们创建两个 `Employee` 子类：\n\n```java\npublic class SalaryEmployee\
    \ extends Employee {\n    public SalaryEmployee(String name, Integer bankAccount,\
    \ Double grossWage) {\n        super(name, bankAccount, grossWage);\n    }\n\n\
    \    public Double grossPayment() {\n        return grossWage;\n    }\n}\n\npublic\
    \ class CommissionEmployee extends Employee {\n    private Double grossCommission\
    \ = 0.0;\n    public CommissionEmployee(String name, Integer bankAccount, Double\
    \ grossWage) {\n        super(name, bankAccount, grossWage);\n        grossCommission\
    \ = commission;\n    }\n\n    public Double grossPayment() {\n        return grossWage\
    \ + currentCommission();\n    }\n\n    private Double currentCommission() {\n\
    \        Double commission = grossCommission;\n        grossCommission = 0.0;\n\
    \        return commission;\n    }\n\n    public void giveCommission(Double amount)\
    \ {\n        grossCommission += amount;\n    }\n}\n```\n\n这看起来是抽象类的良好候选者。让我们将名称和银行账户的功能抽象到一个\
    \ `Employee` 抽象类中。然后 `SalaryEmployee` 和 `CommissionEmployee` 就可以扩展这个抽象类，并为 `grossPayment()`\
    \ 提供不同的实现。\n\n# 4.3.3.1 类图\n\n![](img/3ed46cf971278dea2d7c239e74f87929_19_0.png)\n\
    \n图 4.3: 截图\n\n# 4.3.3.2 代码\n\n```java\npublic abstract class Employee implements\
    \ Payee {\n    private String name;\n    private Integer bankAccount;\n    protected\
    \ Double grossWage;\n\n    public Employee(String name, Integer bankAccount, Double\
    \ grossWage) {\n        this.name = name;\n        this.bankAccount = bankAccount;\n\
    \        this.grossWage = grossWage;\n    }\n\n    public String name() {\n  \
    \      return name;\n    }\n\n    public Integer bankAccount() {\n        return\
    \ bankAccount;\n    }\n}\n```\n\n注意 `Employee` 不需要实现 `Payee` 中定义的 `grossPayment()`\
    \ 方法，因为 `Employee` 是抽象的。整洁多了！\n\n# 4.4 应用程序\n\n让我们在应用程序中使用我们新的员工类型。我们将创建一个应用程序类，通过创建支付系统、一些员工并模拟一周的工作来初始化系统。\n\
    \n"
