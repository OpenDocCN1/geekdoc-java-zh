    \    protected Double grossWage;\n\n    public Employee(String name, Integer bankAccount,\
    \ Double grossWage) {\n        this.name = name;\n        this.bankAccount = bankAccount;\n\
    \        this.grossWage = grossWage;\n    }\n\n    public String name() {\n  \
    \      return name;\n    }\n\n    public Integer bankAccount() {\n        return\
    \ bankAccount;\n    }\n}\n```\n\nNote that Employee doesn't to implement the grossPayment()\
    \ method defined in Payee because Employee is abstract. Much neater!\n\n# 4.4\
