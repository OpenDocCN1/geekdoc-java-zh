    - 4.7.2 支付系统的变更 24\n- 5 结论 27\n\n版权 (c) Exelix Media Ltd., 2015\n保留所有权利。在不限制上述规定的情况下，未经所有者书面许可，不得复制、存储或以任何形式或手段引入（电子、复印或其他方式）。\n\
    \n# 前言\n\n在软件工程和编程语言中，抽象（或抽象原则）是一项基本准则，旨在通过利用语言提供的抽象来减少程序中信息的重复。这一原则有时被告知程序员，有时被视为编程语言的要求，理解为什么使用抽象是有用的。它的起源曾多次以不同的名称被发明，并总结为“不要重复自己”（don't\
    \ repeat yourself）原则，该原则避免了通用的信息重复，也避免了软件开发过程中的人力投入浪费。\n\n维基百科\nhttp://en.wikipedia.org/wiki/Abstraction\n\
    \n# 关于作者\n\nHugh Hamill 是一位位于爱尔兰高威的高级工程师和认证 Scrum 大师。他于 2002 年在沃特福科技大学获得应用计算学士学位，从那以后一直在业界工作。他曾使用过\
    \ C++ 和 VB，但目前专注于 Java。他具有使用 Swing 构建桌面应用程序以及企业级后端的经验，曾担任多个项目（包括大型系统）的技术主管和架构师。他感兴趣的主要领域包括核心\
    \ Java、设计模式、TDD 和敏捷软件开发。\n\n# 第 1 章 引言\n\n在本教程中，我们将介绍 Java 中的抽象，并使用接口定义一个简单的工资支付系统。在本教程中，我们将介绍\
    \ Java 中的抽象，并使用接口定义一个简单的工资支付系统。Java 中的抽象有两种类型：**接口**和**抽象类**。我们现在将详细介绍这两种类型。\n\
    \n# 第 2 章 接口\n\n接口就像一份契约。它承诺提供某些行为，实现接口的类必须提供这些行为。使用接口的人可以不于具体的实现细节，这是抽象的一个重要益处。\n\
    \n## 2.1 定义接口\n\n在 Java 中，你可以使用 `interface` 关键字来定义接口：\n\n```java\npublic interface\
    \ MyInterface {\n    void methodA();\n    int methodB();\n    String methodC(double\
    \ x, double y);\n}\n```\n\n接口定义了方法的签名，但没有提供实现。实现接口的类必须提供实现。\n\n## 2.2 实现接口\n\n\
    现在我们要实现接口，通过编写一个新类并使用 `implements` 关键字来告诉编译器该类应该实现：\n\n```java\npublic class MyClass\
    \ implements MyInterface {\n    public void methodA() {\n        System.out.println(\"\
    调用了 A!\");\n    }\n\n    public int methodB() {\n        return 42;\n    }\n\n\
    \    public String methodC(double x, double y) {\n        return \"x = \" + x\
    \ + \", y = \" + y;\n    }\n}\n```\n\n我们根据 `MyInterface` 中定义方法签名，为它们提供了方法体。我们还可以创建多个实现类，每个类都有不同的实现细节。只要方法体符合签名，我们可以在其中做任何事情。\n\
    \n## 2.3 使用接口\n\n为了从客户端调用接口的方法，我们只需要使用 `.` 运算符，就像调用类的方法一样：\n\n```java\nMyInterface\
    \ object1 = new MyClass();\nobject1.methodA(); // 保证可以工作\n```\n\n我们在上面看到了一些特殊之处，我们没有使用\
    \ `MyClass object1 = new MyClass();`（这完全可行），而是声明 `object1` 的类型为 `MyInterface`。这是因为\
    \ `MyClass` 是 `MyInterface` 的实现，当我们想要调用接口中定义的方法时，我们将提供实现。`object1` 是指向该实现对象的引用，在本例中它是\
    \ `MyClass` 的实例。\n\n当我们调用 `object1.methodA()` 时，我们执行的是在 `MyClass` 中定义的方法，因为对象的运行时类型是\
    \ `MyClass`，即使引用类型是 `MyInterface`。我们只能在 `object1` 上调用 `MyInterface` 中定义的方法，实际上，我们只能将\
    \ `object1` 视为 `MyInterface` 类型，即使运行时类型是 `MyClass`。\n\n接口还可以包含状态：\n\n```java\n\
    public interface MyInterfaceWithState {\n    int someNumber;\n    void methodA();\n\
    }\n```接口中的方法默认是 `public` 的，事实上，你不能在接口中创建非 `public` 访问级别的方法。\n\n"
