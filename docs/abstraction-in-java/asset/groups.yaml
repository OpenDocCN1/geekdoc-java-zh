- md: "\n# Abstraction in Java\n\n```java\npublic interface OneMethodInterface {\n\
    \    void methodName();\n}\n```\n\nIt defines one void method which takes no parameters.\n\
    Let's implement it:\n\n```java\npublic class ClassA implements OneMethodInterface\
    \ {\n    public void methodName() {\n        System.out.println(\"Runtime type\
    \ is ClassA.\");\n    }\n}\n```\n\nWe can use this in a client just before:\n\n\
    ```java\nOneMethodInterface myObject = new ClassA();\nmyObject.methodName();\n\
    ```\n\nOutput:\n\n```\nRuntime type is ClassA.\n```\n\nNow let's make a different\
    \ implementation for OneMethodInterface:\n\n```java\npublic class ClassB implements\
    \ OneMethodInterface {\n    public void methodName() {\n        System.out.println(\"\
    The runtime type of this class is ClassB.\");\n    }\n}\n```\n\nAnd modify our\
    \ code above:\n\n```java\nOneMethodInterface myObject = new ClassA();\nmyObject\
    \ = new ClassB();\nmyObject.methodName();\n```\n\nOutput:\n\n```\nRuntime type\
    \ is ClassA.\nRuntime type of this class is ClassB.\n```\n\nWe have successfully\
    \ used the Reference (myObject) to refer to instances of two different runtime\
    \ types. The actual implementation that OneMethodInterface is implemented by,\
    \ anything, and in any way. As far as the compiler is concerned myObject is a\
    \ OneMethodInterface, and methodName() is available, even if it is reassigned\
    \ to a different instance object of a different class. This ability to provide\
    \ more than one runtime type and it is resolved at run time, rather than compile,\
    \ is called polymorphism.\n\nInterfaces define behaviour without any implementation\
    \ details (ignoring Java 8) and implementing classes define all the implementation\
    \ for the classes they define, but what if we want a mix of the two concepts?\
    \ If we want to mix some behaviour definition and some implementation together\
    \ in the same place we can use an abstract class.\n\n# Chapter 3\n\n# Abstract\
    \ Classes\n\nAn abstract class is like an incomplete blueprint, it defines some\
    \ of the implementation details of the class while leaving others as simple behaviour\
    \ definitions to be implemented later.\n\nImagine a blueprint of a house where\
    \ the house is drawn in completely but there is a big empty square where the garage\
    \ will be gone. We do not know what it will look like. Somebody else will have\
    \ to take a copy of our blueprint in the garage. In fact many different people\
    \ may take copies of our blueprint and draw in different types of garage. Houses\
    \ built using these blueprints will be recognizable variants of our house; the\
    \ front door, the room layouts and the windows will be all identical, however\
    \ the garages will be different.\n\nLike the blueprint above our abstract classes\
    \ define some methods completely, and these method implementations will be the\
    \ same in all implementations of the abstract class. The abstract class will define\
    \ only the signature for other methods, in the same way that interfaces does.\
    \ The method implementations for these methods will vary in the implementing classes.\
    \ Implementing an abstract class is commonly referred to as a concrete class.\
    \ Due to the inheritance relationship between the concrete class and the abstract\
    \ class we generally say that a concrete extends an abstract class, rather than\
    \ implements it as we say with interfaces.\n\nJust like interfaces any client\
    \ code knows that if a concrete class is extending the abstract class class guarantees\
    \ to provide method bodies for the abstract methods of the abstract class (the\
    \ abstract class provides its own methods for non-abstract methods, of course).\n\
    \nAgain, just like interfaces, there can be different concrete classes of a given\
    \ abstract class, each define very different behaviours for the abstract methods\
    \ of the abstract class while satisfying the contract of the abstract class. The\
    \ implementation details are hidden from the client.\n\n# 3.1 Defining Abstract\
    \ Classes\n\nThe keyword abstract is used to define both class and its methods\
    \ as abstract.\n\n```java\npublic abstract class MyAbstractClass {\n    protected\
    \ int someNumber = 0;\n\n    public void increment() {\n        someNumber++;\n\
    \    }\n\n    public abstract void doSomethingWithNumber();\n}\n```\n\nHere we\
    \ defined an abstract class called MyAbstractClass which contains an integer and\
    \ provides a method for incrementing that integer. We also define an abstract\
    \ method called doSomethingWithNumber(). We don't yet know what this method will\
    \ do, it will be defined in any concrete classes which extend MyAbstractClass.\
    \ doSomethingWithNumber() doesn't have a method body because it is abstract.\n\
    \nIn interfaces all methods are public by default, however the scope of the abstract\
    \ method may be package, protected or private. You can see that some behavioural\
    \ implementation in interface is mixed with some behavioural definition in doSomethingWithNumber()\
    \ in this class abstract. Abstract classes mix some implementation with some definition.\
    \ Concrete classes which extend Abstract class will reuse the implementation of\
    \ increment() while guaranteeing to provide their own implementations of doSomethingWithNumber().\n\
    \n# 3.2 Extending Abstract Classes\n\nNow we have created an abstract class let's\
    \ make a concrete implementation for it. We make concrete implementations from\
    \ abstract classes using the extends keyword in a class which is not abstract.\n\
    \n```java\npublic class MyConcreteClass extends MyAbstractClass {\n    public\
    \ void sayHello() {\n        System.out.println(\"Hello there!\");\n    }\n\n\
    \    public void doSomethingNumber() {\n        System.out.println(\"The number\
    \ is \" + someNumber);\n    }\n}\n```\n\nWe have created a concrete class called\
    \ MyConcreteClass and extended MyAbstractClass. We only needed to provide implementation\
    \ for the abstract method doSomethingNumber() because we inherit the private member\
    \ variables and methods from MyAbstractClass. If any client calls increment()\
    \ on MyConcreteClass implementation defined in MyAbstractClass will be executed.\
    \ A new method called sayHello is unique to MyConcreteClass and wouldn't be available\
    \ from any other class which implements MyAbstractClass.\n\nWe also extend MyAbstractClass\
    \ with another abstract class where we do not define doSomethingNumber - this\
    \ means another abstract class will have to be defined, which extends this class\
    \ in order to implement doSomethingNumber().\n\n```java\npublic abstract class\
    \ AnotherAbstractClass extends MyAbstractClass {\n    public void sayHello() {\n\
    \        System.out.println(\"Hello there!\");\n    }\n}\n```\n\nWe didn't have\
    \ to make any reference to doSomethingNumber() here, however we create a concrete\
    \ class for MyAbstractClass we will provide the implementation for doSomethingNumber().\n\
    \nLastly, abstract classes can implement interfaces. Because the abstract class\
    \ is not instantiated itself it does have to provide an implementation for all\
    \ (or any) of the interface methods. If the abstract class does not provide an\
    \ implementation for an interface method, the class which extends the abstract\
    \ class will have to provide the implementation.\n\n```java\npublic abstract class\
    \ MyImplementingAbstractClass implements MyInterface {\n    public void methodA()\
    \ {\n        System.out.println(\"Method A has been implemented in this abstract\
    \ class\");\n    }\n}\n```\n\nHere we see that MyImplementingAbstractClass implements\
    \ MyInterface but only provides an implementation for methodA(). If any concrete\
    \ class extends MyImplementingAbstractClass it will have to provide an implementation\
    \ for methodB() and methodC() as defined in MyInterface.\n\n# 3.3 Using Abstract\
    \ Classes\n\nLike with Interfaces and regular classes, to call the methods of\
    \ an abstract class you use the (.) operator.\n\n```java\nMyAbstractClass object1\
    \ = newConcreteClass();\nobject1.increment();\nobject1.doSomethingNumber();\n\
    ```\n\nAgain notice that object1 is a reference to an instance that provides a\
    \ concrete implementation for MyAbstractClass and the runtime type of instance\
    \ is ConcreteClass. For all intents and purposes object1 is created by the compiler\
