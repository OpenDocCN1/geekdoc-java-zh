    \n就像接口一样，任何客户端代码都知道，如果一个具体类扩展了抽象类，类就保证为抽象类的抽象方法提供方法体（当然，抽象类为非抽象方法提供了自己的方法）。\n\n\
    同样，就像接口一样，给定的抽象类可以有不同的具体类，每个类在满足抽象类约的同时，为类的抽象方法定义非常不同的行为。实现细节对客户端隐藏。\n\n# 3.1\
