    \ method to give the bonus. The getBonus method is abstract because it will be\
    \ implemented differently for Salaried and own Employees.\n\n```java\npublic abstract\
    \ class Employee implements Payee {\n    private String name;\n    private Integer\
    \ bankAccount;\n\n    protected Double currentBonus;\n    protected Double grossWage;\n\
    \n    public Employee(String name, Integer bankAccount, Double grossWage) {\n\
    \        this.name = name;\n        this.bankAccount = bankAccount;\n        this.grossWage\
    \ = grossWage;\n        this.currentBonus = 0.0;\n    }\n\n    public String name()\
    \ {\n        return name;\n    }\n\n    public Integer bankAccount() {\n     \
    \   return bankAccount;\n    }\n\n    public abstract void giveBonus(Double percentage);\n\
    \n    protected Double doCurrentBonus() {\n        Double bonus = currentBonus;\n\
    \        currentBonus = 0.0;\n        return bonus;\n    }\n}\n```\n\n### Updates\
    \ to SalaryEmployee:\n\n```java\npublic class SalaryEmployee extends Employee\
    \ {\n    public SalaryEmployee(String name, Integer bankAccount, Double grossWage)\
    \ {\n        super(name, bankAccount, grossWage);\n    }\n\n    public void giveBonus(Double\
    \ percentage) {\n        currentBonus += grossWage * (percentage/100.0);\n   \
    \ }\n\n    public Double grossPayment() {\n        return grossWage + doCurrentBonus();\n\
    \    }\n}\n```\n\n### Updates to CommissionEmployee:\n\n```java\npublic class\
