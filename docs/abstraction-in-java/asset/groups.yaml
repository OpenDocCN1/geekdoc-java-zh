- md: "\n# Abstraction in Java\n\n```\nTwoMethodAbstractClass myObject = new ConcreteClassA();\n\
    myObject.oneMethod();\nmyObject.twoMethod();\nmyObject = new ConcreteClassB();\n\
    myObject.oneMethod();\nmyObject.twoMethod();\n```\n\nOutput:\n\nTwoMethod is implemented\
    \ in TwoMethodAbstractClass.\nTwoMethod is implemented in ConcreteClassA.\nConcreteClassB\
    \ implements its own twoMethod.\n\nWe have used the reference (myObject) to refer\
    \ to instances of two different runtime types. When the runtime type of myObject\
    \ is ConcreteClassA it uses the implementation of twoMethod from ConcreteClassA.\
    \ When the runtime of myObject is ConcreteClassB it uses the implementation of\
    \ twoMethod from ConcreteClassB. In both cases the common implementation of oneMethod\
    \ from TwoMethodAbstractClass is used.\n\nAbstract classes are used to define\
    \ common behaviours while providing contracts or promises that other behaviours\
    \ will be available from a concrete class later. This allows us to build object\
    \ models where we can reuse common functionality and capture differing requirements\
    \ in different concrete classes.\n\n# Chapter 4\n\n# A Worked Example - Payments\
    \ System\n\nWe have been asked to build a payments system for a company. We know\
    \ that the company has different types of employees that can be paid in different\
    \ ways; salaried and with commission. The boss of the company understands that\
    \ his needs will change and the system may be changed later to accommodate different\
    \ types of entities which will receive payments.\n\n# 4.1 The Payee Interface\n\
    \nLet's start by considering the employees. They must receive payments, but we\
    \ also know that later on we may need to have different entities also receive\
    \ payments. Let's create an interface, Payee, which will define the sort of behaviour\
    \ we' expect from entities which can receive payments.\n\n```java\npublic interface\
    \ Payee {\n    String name();\n    Double grossPayment();\n    Integer bankAccount();\n\
    }\n```\n\nHere we have a Payee interface let's write some code that guarantees\
    \ three behaviours; the ability to provide a name for the Payee, the ability to\
    \ provide a gross payment amount which should be paid and the ability to provide\
    \ a bank account number where the funds should be deposited.\n\n# 4.2 The Payment\
    \ System\n\nNow that we have a Payee defined let's write some code that it uses.\
    \ We'll create a PaymentSystem class which maintains a list of Payees and will\
    \ on cycle through them and transfer the requested amount into the appropriate\
    \ bank account.\n\n```java\npublic class PaymentSystem {\n    private List<Payee>\
    \ payees;\n\n    public PaymentSystem() {\n        payees = new ArrayList<>();\n\
    \    }\n\n    public void addPayee(Payee payee) {\n        if (!payees.contains(payee))\
    \ {\n            payees.add(payee);\n        }\n    }\n\n    public void processPayments()\
    \ {\n        for (Payee payee : payees) {\n            Double grossPayment = payee.grossPayment();\n\
    \n            System.out.println(\"Paying to \" + payee.name());\n           \
    \ System.out.println(\"\\tgross\\t\" + grossPayment);\n            System.out.println(\"\
    \\tTransferred to Account: \" + payee.bankAccount());\n        }\n    }\n}\n```\n\
    \nYou can see that the PaymentSystem is totally agnostic to the runtime types\
    \ of the Payees, it doesn't have to care. It knows that no matter what the runtime\
    \ type the Payee being process is guaranteed to implement name(), grossPayment()\
    \ and bankAccount(). Given that knowledge it's simply a matter of executing a\
    \ for loop all the Payees and processing their payments using these methods.\n\
    \n# 4.3 The Employee Classes\n\nWe have been told by the boss that he has two\
    \ different types of Employee - Salaried Employees and Commissioned Employees.\
    \ Salaried Employees have a base salary which doesn't change while Commissioned\
    \ Employees have a base salary and also can given sales commissions for successful\
    \ sales.\n\n# 4.3.1 The SalaryEmployee Class\n\nLet's start with a class for Salaried\
    \ Employees. It should implement the Payee interface so it can be used by the\
    \ Payee System.\nLet's represent our changes using class diagrams in addition\
    \ to code. In class diagrams a dotted arrow means an implements relationship and\
    \ a solid arrow means an extends relationship.\n\n# 4.3.1.1 Class Diagram\n\n\
    ![](img/3ed46cf971278dea2d7c239e74f87929_17_0.png)\n\nFigure 4.1: screenshot\n\
    \n# 4.3.1.2 Code\n\n```java\npublic class SalaryEmployee implements Payee {\n\
    \    private String name;\n    private Integer bankAccount;\n    protected Double\
    \ grossWage;\n\n    public SalaryEmployee(String name, Integer bankAccount, Double\
    \ grossWage) {\n        this.name = name;\n        this.bankAccount = bankAccount;\n\
    \        this.grossWage = grossWage;\n    }\n\n    public Integer bankAccount()\
    \ {\n        return bankAccount;\n    }\n\n    public String name() {\n      \
    \  return name;\n    }\n\n    public Double grossPayment() {\n        return grossWage;\n\
    \    }\n}\n```\n\n# 4.3.2 The CommissionEmployee Class\n\nNow let's make a CommissionEmployee\
    \ class. This class will be similar to SalaryEmployee with the ability to pay\
    \ commissions.\n\n# 4.3.3 The Employee Abstract Class\n\nAs you can see a lot\
    \ of the code is duplicated between SalaryEmployee and CommissionEmployee. In\
    \ fact the only thing that doesn't to implement the grossPayment() method defined\
    \ in Payee because Employee is abstract. Now let's create two Employee classes:\n\
    \n```java\npublic class SalaryEmployee extends Employee {\n    public SalaryEmployee(String\
    \ name, Integer bankAccount, Double grossWage) {\n        super(name, bankAccount,\
    \ grossWage);\n    }\n\n    public Double grossPayment() {\n        return grossWage;\n\
    \    }\n}\n\npublic class CommissionEmployee extends Employee {\n    private Double\
    \ grossCommission = 0.0;\n    public CommissionEmployee(String name, Integer bankAccount,\
    \ Double grossWage) {\n        super(name, bankAccount, grossWage);\n        grossCommission\
    \ = commission;\n    }\n\n    public Double grossPayment() {\n        return grossWage\
    \ + currentCommission();\n    }\n\n    private Double currentCommission() {\n\
    \        Double commission = grossCommission;\n        grossCommission = 0.0;\n\
    \        return commission;\n    }\n\n    public void giveCommission(Double amount)\
    \ {\n        grossCommission += amount;\n    }\n}\n```\n\nThis looks like a good\
    \ candidate for an Abstract Class. Let's abstract the name and bank account functionality\
    \ into an Employee abstract class. SalaryEmployee and CommissionEmployee can then\
    \ extend this abstract class and provide different implementations for grossPayment().\n\
    \n# 4.3.3.1 Class Diagram\n\n![](img/3ed46cf971278dea2d7c239e74f87929_19_0.png)\n\
    \nFigure 4.3: screenshot\n\n# 4.3.3.2 Code\n\n```java\npublic abstract class Employee\
