    \n# Preface\n\nIn software engineering and programming language, abstraction (or\
    \ abstraction principle) is a basic dictum that aims to reduce duplication of\
    \ information in a program by making use of abstractions provided by the language.\
    \ The principle is sometimes stated to the programmer but sometimes stated as\
    \ requirement of programming language, understanding why abstractions are desirable\
    \ to use. The origins have been reinvented a number of times, under different\
    \ names, generalized as the \"don't repeat yourself\" principle, which avoids\
    \ duplication of information in general and also avoiding human effort involved\
    \ in software development process.\n\nWikipedia\nhttp://en.wikipedia.org/wiki/Abstraction\n\
    \n# About the Author\n\nHugh Hamill is a Senior Engineer and Certified Scrum Master\
    \ based in Galway, Ireland. He achieved his B.Sc. in Applied Computing from Waterford\
    \ of Technology in 2002 and has been working in industry since then. He has previously\
    \ worked with both C++ and VB but currently concentrates on Java. He has experience\
    \ of building desktop applications using swing and enterprise back ends, being\
    \ tech lead and architect on several projects including large scale systems. His\
    \ main areas of interest include Core Java, Design Patterns, TDD, and Agile Software\
    \ Development.\n\n# Chapter 1 Introduction\n\nIn this tutorial we will give an\
    \ introduction to Abstraction in Java and define a simple Payroll System using\
    \ Interfaces, Abstract Classes. There are two levels of abstraction in Java -\
    \ **Interfaces**, used to define expected behaviour and **Abstract Classes**,\
    \ used to define incomplete functionality. We will now look at these two different\
    \ types of abstraction in detail.\n\n# Chapter 2 Interfaces\n\nAn interface is\
    \ like a contract. It is a promise to provide certain behaviours and all classes\
    \ which implement the interface guarantee to also implement these behaviours.\
    \ To define the expected behaviours the interface lists a number of method signatures.\
    \ Any class which uses the interface can rely on methods being implemented in\
    \ the runtime class which implements the interface. This allows anyone using the\
    \ interface to know what functionality will be provided without having about how\
    \ functionality will actually be achieved. The implementation details are hidden\
    \ from the client, this is a crucial benefit of abstraction.\n\n## 2.1 Defining\
    \ Interfaces\n\nYou can use the keyword `interface` to define an interface:\n\n\
    ```java\npublic interface MyInterface {\n    void methodA();\n    int methodB();\n\
    \    String methodC(double x, double y);\n}\n```\n\nHere we have an interface\
    \ called `MyInterface`, note that you should use the same case conventions for\
    \ Interfaces that you use for Classes. `MyInterface` defines 3 methods, each with\
    \ different return types and parameters. You can see that none of these methods\
    \ have a body; when working with interfaces we are only interested in defining\
    \ the expected behaviour, not in its implementation.\n\n**Note:** Java 8 introduced\
    \ the ability to create a default implementation for interface methods, however\
    \ we will not cover that functionality in this tutorial.\n\nInterfaces can also\
    \ contain state data by the use of member variables:\n\n```java\npublic interface\
    \ MyInterfaceWithState {\n    int someNumber;\n    void methodA();\n}\n```\n\n\
    All the methods in an interface are public by default and in fact you can't create\
    \ a method in an interface with an access level other than public.\n\n## 2.2 Implementing\
    \ Interfaces\n\nNow we have defined an interface we want to create a class which\
    \ will provide the implementation details of the behaviour we have defined. We\
    \ do this by writing a new class and using the implements keyword to tell the\
    \ compiler what this class should implement.\n\n```java\npublic class MyClass\
    \ implements MyInterface {\n    public void methodA() {\n        System.out.println(\"\
    Method A called!\");\n    }\n\n    public int methodB() {\n        return 42;\n\
    \    }\n\n    public String methodC(double x, double y) {\n        return \"x\
    \ = \" + x + \", y = \" + y;\n    }\n}\n```\n\nWe took the method signatures which\
    \ we defined in MyInterface and gave them bodies to implement. We just said we\
    \ could have done anything in those bodies, as long as they satisfied the method\
    \ signatures. We could also create many implementing classes as we want, each\
    \ with different implementation details of the methods from MyInterface.\n\nWe\
    \ implemented all methods from MyInterface in MyClass and if we failed to implement\
    \ any of them compiler would have given us an error. This is because that MyClass\
    \ implements MyInterface means that MyClass is guaranteed to provide an implementation\
    \ for each of the methods from MyInterface.\n\n## 2.3 Using Interfaces\n\nTo call\
    \ the methods of the interface from the client we just need to use the (.) operator,\
    \ just like with the methods of classes:\n\n```java\nMyInterface object1 = new\
    \ MyClass();\nobject1.methodA(); // Guaranteed to work\n```\n\nWe see something\
    \ unusual above, instead of something like MyClass object1 = new MyClass(); (which\
    \ is perfectly acceptable) we declare object1 is of type MyInterface. This works\
    \ because MyClass is an implementation of MyInterface when we want to call a method\
    \ defined in MyInterface we will provide the implementation. object1 is a reference\
    \ to that object which implements, in this case it is an instance of MyClass.\n\
    \nWhen we make the call to object1.methodA() we are executing the method defined\
    \ in MyClass because the runtime type of object is MyClass, even though the reference\
    \ is of type MyInterface. We can only call methods on object1 that are defined\
    \ in MyInterface, for all intents we can refer to object1 as being of type MyInterface\
    \ even though the runtime type is MyClass. In fact if MyClass defined another\
    \ method called methodD() we couldn't call it on object1, because the compiler\
    \ only knows object1 is a reference to a MyInterface, not that it is specifically\
    \ a MyClass.\n\nTake the following interface:\n"
