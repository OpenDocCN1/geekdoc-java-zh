    # 15.2 MESSAGE ORDERED MIDDLEWARE - MOM


    The DCS module to supply system entities is particularly useful in a stand alone
    mode as no other module is there to receive, process and propagate this information
    somewhere. A device communicator should provide a Camel route to send the bare
    GPS information to some server without further processing.


    The solution to this general problem domain started in the 1970s under the term
    ‘Message Ordered Middleware’ – specially for information exchange. Distributed
    applications can communicate via a MOM server in a manner that is asynchronous,
    loosely-coupled, reliable, scalable and secure. MOM acts as message mediator between
    senders and receivers and provides loose coupling among enterprise applications.
    For a long time MOM solutions were proprietary to the Java Message Service (JMS)
    which was introduced as the Standard.


