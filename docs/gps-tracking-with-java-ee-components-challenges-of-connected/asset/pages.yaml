  md: '# 16.2.4 Camel Component String


    During the development of some useful JEETS with the Camel framework we have adopted
    simple strings for components ("activemq:") and endpoints ("activemq:device.in").
    As a Java programmer it is very simple to create strings quickly. In a system
    with a growing number of components you will have to manage these strings on a
    system level. Otherwise the messages can appear to travel erratic routes and you
    might lose control of message cloning, i.e. system load.


    Be aware that every component must be well defined and configured in the Camel
    context. On the other hand this is also a feature. If you think of heavy components
    like JPA and MQ you will sooner or later JTA for safe transactions and pooling
    for better performance. This fine tuning can be done after making the actual routing.


    # 16.3 TRAFFIC MONITOR


    The automotive industry of OEMs, the actual car vendors, but more people are working
    for automotive suppliers, which again rely on individual subcontractors. With
    the global target of the self driving car the auto industry has to collaborate
    with the data hosting industry. Therefore every person in automotive business
    working on a ''secret'' prototype is for enterprise management this contradiction
    presents the challenge to share ''confidential'' development from emerging markets
    and technologies.


    In order to understand this challenge we can create an application that globally
    serves a complete enterprise, while hiding the details of a new feature by a premium
    OEM. This customer is spending a lot of money to introduce something to ''his
    customers and would not be amused, if another OEM would benefit from his investment.
    For economic reasons the automotive supplier needs for the implementation would
    develop according to company standards and share the how internally. Synergies
    are vital for big businesses just like discretion.


    How can we unite separate software development?

    SDC development is a challenge without a doubt. The car is treated like a child
    growing up and learning to react to its environment - on his own. In this book
    we are looking at the connected car, i.e server communication, and exploring its
    limits. The intrinsic limitations are network latency, time-dependent bandwidth,
    connectivity and positioning precision besides aspects.


    For example GPS tracking is not being applied to validate the trajectory along
    the road width. In the best case the lane can be assumed.

    A can be equipped with many onboard sensors and actually ''watch'' the road. Client
    server communication is meant to basically serve the traffic sit'
  merge: -1
