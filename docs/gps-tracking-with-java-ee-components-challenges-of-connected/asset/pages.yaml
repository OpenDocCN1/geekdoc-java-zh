  md: '# Tracker Architecture 95


    which can be applied any time.


    In SDC scenarios it is also common practice to supply a minNrOfPositions for a
    single message. One reason for this is (country dependent) privacy protection
    which doesn''t allow subsequent tracking for more than some minutes. Another good
    reason is the creation of a tiny route that can be analyzed on your journey through
    the system.


    One of the greatest challenges of competing global players in the automotive business
    is to provide a single service reporting traffic situations live – all different
    cars of vendors. Submitting single positions from different vehicles is pretty
    useless. By submitting minNrOfPositions for every vehicle we gain dynamic information.
    We can analyze and provide exact speed and course from position n to n+1 and can
    create some plausible checks and throw a route that could confuse the system.
    Planning can also be applied inside the driving car by comparing GPS and OBD data
    for example. From a GPS trace with three positions you can determine the GPS ''course''
    and compare it to the vehicle orientation provided by a gyro sensor. If these
    values deviate the vehicle is drifting and around the ''traffic server'' can then
    be fed with plausible motion data.


    The decision between min and maxOfPositions can be implemented depending on the
    traffic situation. If the vehicle travels through a city at 10 to 30 meters per
    second keep in mind that a collision through a client server communication should
    perform within a second to slow the vehicle down in time. Depending on the project
    you can calculate the manageable distance for a successful alarm measure...


    The trackers main method can be used to get performance figures – for your development
    environment with a local host connection. The Traccar position provides two relevant
    timestamps:


    +   1. The GPS fix is the actual time when the event has happened and naturally
    synchronized with the GPS coordinates to describe where it occurred. GPS ''stamp''
    describes and event in the real world, before this event is handled by the technical
    components.


    +   2. The devetime describes the time when the tracker connected to the server
    to submit the collected events. In a real world scenario fix and devetime are
    hours and days apart from each other.


    Just think of a test car collecting traces on Friday in an area with bad network
    coverage. At the end of the day the car is parked and the messages are still ''in
    the car''. The next day (Monday) when the car is started the tracker connects
    to the server and ''flushes'' the events from previous recording to the server
    where they can be analyzed.


    The chronological order of GPS fixes the exact physical trajectory of the tracked
    object!'
