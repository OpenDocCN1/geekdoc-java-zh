  md: '# GPS Protocols 9


    TABLE 2.1 Integer Coordinates with a Precision Field

    | longitude | dir | integer | precision | double |

    | 121.1234567 | East | +1211234567 | 7 | +121.1234567 |

    | 121.1234567 | West | -1211234567 | 7 | -121.1234567 |

    | 21.1234567 | East | +211234567 | 4 | +211234567 |

    | 21.1234567 | East | +211234 | 4 | +21.1234567 |


    In a text format at least one byte is needed for every (or in this character)
    and separator that adds up to 29 bytes. Also it is unclear whether the altitude
    of zero is a default value or real (unlikely). The lat and lon are restricted
    to 6 digits to fix their overall precision.


    From the data processing perspective it''s a good idea to use integers instead
    of decimals, if you compare FLOPS and MIPS performances of computer systems. The
    problem emerging from the SDC is precision of lat and lon. Digital maps were used
    to provide an accuracy in meters and were subsequently redefined for ADAS². Since
    this is insufficient for autonomous driving a new type of map is coming with centimeter
    precision: the HD machine reading.


    On the other hand not every is provided in centimeter precision. Therefore could
    define lat and lon as integers and a precision field (see Table 2.1). The value
    4 represents the digital 10⁻⁴, i.e. multiple of 1⁻⁴ and allows defaulting to specifying
    it explicitly for any coordinate. The space needed for java variables is a 16-bit
    for the integer, a 64-bit double for the targeted variable in the server code.
    Now we have a 24 bit representation for lat and lon, which is much better than
    the methods listed above.


    Depending on your application you might consider submitting a small route, it
    a course of related position infos. This opens the possibility to tag each position
    with small deltas for lat, lon, alt. Yet this is a very dedicated approach which
    can also introduce risks. In a networking context we do not have Java types and
    there is still room for compression by using the single bits ...


