- img_proc: true
  md: 'uation around a car. But how can you generate traffic for a certain area at
    development time?


    In Figure 9.3 we have introduced a simple solution by using the jets-player to
    playback recorded tracks. By combining many GPS we can generate traffic. Traffic
    is much too complex to simply play a few vehicles. Traffic is driven by rush hours,
    holidays, weekdays and many unforeseeable events at critical intersections.


    From the last section we have outlined that one enterprise is always working on
    one solution for SCD scenarios - even, if projects are treated as very confidential
    relative to external parties. Internally it is unwise not to exchange information
    between different projects. Therefore it could be helpful to develop a ''neutralized''
    project to publish motion data without any information about the vehicle types.


    If you provide services you should never reveal different fleets to each other.
    In the end all customers are (''horizontal'') competitors in the same market.
    On the other hand the information streaming from different fleets can be used
    for internal routing and supply added value for everyone. The prediction team
    could use the GTS traffic monitor for dynamic load balancing, which is a technical
    added value.


    The most important parameters for setting up a simulation are day and time. A
    developer can choose a certain area for his simulation and then retrieve the data
    from the traffic server. This server can offer unix expressions to define traffic
    for a certain weekday and aggregate the data for every ''normal'' Tuesday around
    noon. In addition the server could offer some ''special situations'' with a previously
    recorded accident event. To get a picture you can go to Google maps and turn on
    the traffic View and choose between ''typical'' traffic for certain days and times
    of day.


    Usually even large companies use only limited locations for road tests and their
    developers can simulate the traffic in these locations. In order to own their
    test cases the company might acquire additional sources to enrich (the simulated)
    traffic. For example data from mobile locations can be extremely helpful. For
    open source development crowds forming a powerful source and the open data movement
    is only beginning ... and may become useful in the future to enrich the JEETS.


    From the Camel view idea is to clone the messages from every project, strip them
    down to the core GPS coordinates lat, lon with a timestamp and send them to some
    traffic server. This server serves the motion data and every developer can apply
    the development cycle described in Section 9.3.'
