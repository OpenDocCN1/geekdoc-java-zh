    against a complicated admin polygon with many coordinates is expensive in terms
    of machine power.


    # 16.2 The Tile MAPPER


    A very effective way to distribute messages is via tiling algorithm. If you work
    with an online map like Google Maps or OpenStreetMap you will sometimes see the
    map tiles when you zoom the level. These squared tiles seamlessly cover a city,
    country, continent. Zoom levels define precise scales with an integer number of
    map tiles covering the world from Greenwich to Greenwich (-180, 0, 180) and from
    pole to pole (-90, 0, 90). Any position (lat,lon) can be mapped to an exact tile
    (coordinate,y) for every zoom level,


    > Have a look at the geocoder response to identify the admin hierarchy.'
