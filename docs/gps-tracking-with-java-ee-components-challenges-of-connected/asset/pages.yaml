  md: '# 200 JSE Tracking Components


    JDBC programmers are used to managing the number of loaded records in the code.
    For some example ''paging'' mechanism is usually applied, if a user wants to display
    large lists in the browser. In the above listing you can find the two parameters
    to apply in your code


    ```

    .setFirstResult(100) // offset

    setMaxResults(10) // pagination

    ```


    For very large trips you can adjust your code to load portions of the trip by
    using offset and pagination values in the process to avoid the instantiation of
    too many objects in the RAM. The advantage of JPQL is that the JPA implementation
    translates these methods into the specific database dialects:


    H2 and Postgres: limit 10 offset 10


    MySQL limit 100, 10

    Oracle creates SQL statements

    with selectss and its proprietary rownum


    This is only a sample example of how one JPA implementation creates individual
    SQL statements for different platforms. If you use limit and offset in native
    SQL, you''ll run into syntactic problems when you switch from one database to
    another. The switch from H2) to Postgres (developer data) would work as the same
    syntax but then the production environment creates native database and you are
    in trouble.


    Lesson to learn: Use many JPQL queries as possible and leave the generation of
    complex SQL statements to the JPA implementation since the syntax can highly differ
    for different targets. Keep an eye on the runtime behavior when switching platforms
    and analyze the generated SQL statements at development time.


    This book is not about the specifics of JPA and you should spend some time to
    get used to JPQL. With JPQL you can create left joins, fetch joins to deactivate
    LAZY loading, selects with functions and aggregations etc. You should also have
    a look at an entity relation modeled with a Java Map and consider it for dedicated
    use cases...


