    # 9.4.2 Plausibility


    The player is introduced here for the upcoming development of tracking server
    system. All player features should not be used to send tracks to the production
    system! A production system should always receive real world data live and a player
    with double, triple .. speed will probably raise plausibility problems which can
    cause a loss of pain for a player – unless it applies the same time factor.


    Another plausibility issue is the order of the recorded track. For a programmer
    it is easy to traverse track backwards. Think of the implications! The ''vehicle''
    would travel the wrong way against the traffic. A bicycle would climb a hill at
    all recorded record speed, etc.


    As a conclusion we should always use the player with care and with respect to
    the targeted system. And after all a recorded track is never really live – with
    one exception! Public transit is carefully planned into the future and we will
    access this kind of data in a sample project in Chapter 11.


