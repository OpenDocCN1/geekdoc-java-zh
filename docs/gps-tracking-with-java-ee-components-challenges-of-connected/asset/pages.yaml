    a hundred components already implemented by the Camel riders.


    In a large enterprise you should not expect every developer to learn Camel just
    to implement a single processing step. You should always distinguish between a
    Camel developer or architect and a Java developer who is implementing a processing
    step inside a Camel route.


    The ''integration technique'' to achieve this is described on the Camel web as
    ''Hiding Middleware''. The idea is to provide a Java skeleton class that can be
    wired to a Camel route, it has from and to endpoints. The developer responsible
    for the Camel route can define the two endpoints and hide the middleware connectors
    to a JMS, JPA and many other components and resources at development time. With
    this role separation logic, performance tuning and middleware code can be decoupled
    to a high degree.


