  md: "We will create a DCS module to send the system entities to a message queue\
    \ where they can reside until one or more applications are ready to consume them.\n\
    \n# 15.3 JAVA MESSAGING SERVICE - JMS\n\nMiddleware software has evolved as a\
    \ necessity to mediate between data formats, operating systems, protocols and\
    \ wide effect programming languages. The software category of messaging routing\
    \ has become a complex discipline of its own. Later the Camel integration framework\
    \ was invented to simplify routing of messages in a descriptive manner.\n\nJMS\
    \ is a standardized API for implementations of different MOMs to send and receive\
    \ information. With the JMS API development requires little knowledge of messaging\
    \ details like transport mechanism etc. JMS can be viewed as an integration technology\
    \ to allow loosely coupling of applications with reliable message exchange. The\
    \ messaging is asynchronous by nature as it provides the ability for senders to\
    \ 'get rid' of their output to a destination while the receivers can 'pick up'\
    \ the messages as appropriate. The middleware does not require sender and consumer\
    \ to be online at the same time - they do not have to know each other. Beyond\
    \ notifying applications JMS supports their inter operation.\n\nJMS formalizes\
    \ the core concepts of messaging and we have already learned some messaging terminology\
    \ with Camel and it shouldn't be a big surprise that JMS is based on these terms:\n\
    \n+   JMS client\nAn application is written in Java to send (produce) and receive\
    \ (consume) messages by utilizing the javax.jms.MessageProducer and Consumer interfaces.\n\
    \n+   JMS producer\nA client application that creates and sends JMS messages.\n\
    \n+   JMS consumer\nA client application that receives and processes JMS messages.\n\
    \n+   JMS provider\nThe implementation of the JMS interfaces in Java.\n will use\
    \ ActiveMQ as the JEETS middleware.\n\n+   JMS message\nThe fundamental actor\
    \ of JMS sent and received by JMS clients.\nWe have gotten a first impression\
    \ from Camel's Exchanges.\n\n+   JMS domains\nThe two styles of messaging - point-to-point\
    \ and publish/subscribe."
