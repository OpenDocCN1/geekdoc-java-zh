- img_proc: true
  md: 'for our needs. If you plan to create a GTFS software you might add some tools
    in the chain to do some cleaning up to increase the performance:


    +   Remove redundant data


    +   Switch from String to Integer keys


    +   Reduce number of shapes with PostGIS Douglas Peucker Algorithm


    +   etc.


    # D.4 INSTALL GTFSDB


    You will find the software with instructions at


    github.com/OpenTransitTools/gtfsdb


    Here is a brief description of the steps you need to take:


    +   Download and install python 2.7..


    +   Download and install setuptools-36.5.0


    +   Download and install

    ycopg2-2.6.2.win-amd64-py2.7-pg9.5.3-release.exe


    +   Command: pip install zc.buildout


    +   Command: buildout install postgresql


    After the software is installed you go to the psycopg2 installation


    ```

    ...\Python27\Lib\site-packages\psycopg2

    ```


    look for the __init__ file and enter the credentials for your GTFS database


    ```

    def connect(dsn=None,

    database=''HVV-20171006'', user=''postgres'', password=''postgres'',

    host=''localhost'', port=5432,

    connection_factory=None, cursor_factory=False,

    async_=False,

    **kwargs):

    ```


    As a measure of precaution we have named the database after the download file


    ```

    Upload__HVV_Bohdaten_GTFS_Fpl_20171006.zip

    database: HVV-20171006

    ```'
  merge: -1
