    In Section 2.2 we reflected on the monolithic Traccar application running in a
    single JVM and processing each message in a single Netty channel pipeline. The
    challenge to create JEETS server components is the migration of Traccar GTS features
    and functionality to a distributed environment!


    In a Camel context messages, Camel exchanges are processed in various ways when
    traveling through a Camel route with well defined start and endpoints. In low
    level TCP/IP, Section 2.2), we speak of sockets and threads. After a client starts
    to send the server robo this message and send a response. Upon successful message
    transmission all threads are closed. The context of Netty speaks of channels and
    pipelines — the same thing, but a higher level.


