  md: '# 210 ■ JSE Tracking Components


    When designing a system you should be aware of where you distribute, clone or
    modify the original information transferred with the message. While the georouter
    does not modify information, the route snapper does. Besides checking plausibility
    a route optimizer analyzes a route to return an optimized route reduced to positions
    with state changes. After moving original positions along the trace direction
    and speed attributes have to be recalculated.


    Each of these components varies every route with respect to performance it should
    be carefully evaluated and not applied times. If a Camel does not need a geocoder
    it place there and save machine power.


    Another pattern we have seen the enricher. Like demonstrated with the geocoder,
    enrichers can easily be added to existing routes. As we have the Google geocoder
    produces a lot of data and the system designer decide which route is suited for
    geocoding. For small companies an external geocoder is a cost factor and it makes
    sense to apply geocoding only when the information is needed for a detailed trip
    map etc. Coding every message with a long address string has significant impact
    on the total database size.


    #  17.6 GTS Components


    We have thoroughly looked at the relation of emerging connected car technologies
    to ‘classical’ tracking systems. We will now finalize the creation of JSE components
    and resume the classical GTS architecture. As a matter of fact the Spring framework
    (especially Spring Boot) is moving JSE standards for JSE components that can basically
    replace any application server environment. Individual control by an operator
    and easier to monitor the OS processes individually.


    Cloud computing is not just another world for a server; it describes the process
    of assembling enterprise applications to individual modules and separating customers
    by providing a complete GTS to each of them - potentially with common resources
    like a database or message broker. While the Java coding of logic does not change
    very much, the deployment process requires more programming logic. With an automated
    deployment process you don''t need to touch every customer module for configuration
    etc. The module is created, debugged, and maintained by Java programmers and then
    it is tested and distributed to any number of servers by the operator.


    Let’s have another final look at our production system Traccar GTS GTS which has
    perfectly served our purposes and complemented our JEETS components at development
    time.'
