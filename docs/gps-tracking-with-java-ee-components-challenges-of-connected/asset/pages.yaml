  md: 'The development of information technology from the first unix system in the
    late sixties to DevOps has gone through various paradigm shifts. Software developers
    have always driven for a seamless development cycle from the very beginning and
    with continuous development this claim has been fulfilled – after laborious decades!
    Software development combined with the deployment on hardware is exponentially
    accelerating software innovations and drastically reducing time to market. Users
    are not bothered with complicated update procedures.


    For prototyping is always a good idea to create one or pieces of software to accept
    input and provide (hard coded) output – before implementing details. We have gone
    through the major modules of a tracking system and created alone prototypes for
    them. New team members offers transparency of the actual information processing
    and allows the project manager to direct work, and (potentially) employ experts
    by domain Skills.


    On the other hand the JEE specifications are essential to guarantee compatibility
    in complex software systems. Specifications are invaluable (for enterprises),
    but what about their implementations? A JEE server is only certified, if it provides
    JEE specification implementations. From a high level we can see that you can setup
    Spring with any JEE specified component or you can create one enterprise application
    (business logic) and deploy it into a complete production environment.


    The approaches of Spring components and enterprise applications (in) application
    servers (AS) are complementary to each other and have a large impact on development
    and deployment. While the ear is deployed to the AS in one the Spring components
    can be deployed individually. The deployment of many Spring component instances
    the configuration (and work) moves from Dev to Ops? We have seen how to apply
    message queues as endpoints between modules, but at least the MQ names and the
    persistence unit have to be configured for every JEE component...preferably with
    a built tool.


    Another reason to modularize the system is the fact that computer speed will not
    increase any more. Moore Law has correctly predicted development for three decades
    but this development has reached physical limits. Today computer speed is increased
    with the number of CPUs cores horizontal scaling. Instead of using complex AS
    or DB clusters you can simply instantiate your components (DCS, ETL etc.) multiple
    times on different machines.


    Visualization is a great support for operators as they can preconfigured environments
    with resource installations (AS, DB, MQ etc.) and clone them as many times as
    needed. In the end scaling by Cloud, VM, Docker etc. should be done with respect
    to the hardware resources. What''s the use of two databases in two VMs, if both
    share the same CPUs? Cloud computing is about distributing electric power over
    many small software modules. On the


    > tied together continuous testing, integration and deployment.'
