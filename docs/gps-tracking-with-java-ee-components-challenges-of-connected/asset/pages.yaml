  md: 'Enterprise Standards


    # 17.6 ENTERPRISE STANDARDS


    At this point we have learned how to apply different Java Frameworks to compose
    a system with standalone modules. We have gone through some basic guidelines on
    how to apply a framework correctly and covered some common pitfalls. We being
    the system architects, have set up the core modules used in a GPS tracking system.
    We have created some seed components that can be used as a starting point for
    a system dedicated to business cases.


    There is much more you can do with JPA, Spring and Camel and happily you can use
    the JEETS components to add additional features for your needs or as an entry
    point to go deeper into each framework. If not, we should meet at jeets.org to
    discuss requirements and put together a nice bare bone system that can run ''out
    of the box''.


    This section details the creation of JSE components and outlines how to combine
    them into one system using only the introduced techniques.


    Enterprise development can be spread over different departments and locations.
    When creating software for connected car technology you have to design each module
    according to enterprise standards based on existing modules. Approved software
    should be available in one Maven repository.


    We have learned that a database relation model provides the system model. Tables
    define attributes and relations ensure that you cannot insert a message without
    an associated registered device and an account that you can send your bills to.
    Database engines are work horses and every new table or attribute should be modeled
    into the database – continuously as the system evolves.


    # 17.6.1 Data Formats


    Once you have added your objects to the ERM you can connect to the database and
    generate the ORM. Of course you might as well start with the ORM and generate
    the ERM in the DBMS. The ORM is a (partial) representation of the ERM with Java
    entities that must be used by every developer to standardize his component. After
    the (initial) ORM generation you can manually tune the things to be ordered, lazy
    loaded, cascaded.


    The next step is to provide one or more persistence units for different programming
    contexts. We have created the JEETS PU basically to persist new messages in the
    database. Usually a GTS database model can be subdivided into tracking, administration,
    reporting etc. You have more control, if you create a persistence unit for each
    of these blocks. Or you can strip down the Traccar system to administration, reporting
    etc. and use your own DCS to collect messages.


    Coding begins with the preparation of system entities from the incoming messages
    – the device communication. If you are using commercial trackers'
