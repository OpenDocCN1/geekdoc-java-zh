  md: "# Object Relations\n\nPlease go through the Developer Guide [17] to get a quick\
    \ intro with a simple message describing a person. Just think of our **Position**\
    \ when you read **Person** to get started. Please use this introduction to install\
    \ the protobuf compiler on your system. You can then modify Google's example to\
    \ compile the snippets of the following sections.\n\nIf you have already worked\
    \ with JavaScript objects you can use JSON to familiarize yourself with protobufs.\
    \ The simplicity of using protobufs lies in the `.proto` file, a simple text file\
    \ to define messages with fields. From the previous sections field evaluation\
    \ we confirm that the system and network models map nicely to each other while\
    \ they are not identical. We will deal with this asymmetry. In this section we\
    \ will focus on [Chapters 6 and 7](# and we will deal with the design of the proto\
    \ file to define the network model.\n\nAfter we have looked at the positions layer\
    \ (ERM) and the Position entity (ERM) let's create the position with protobufs:\n\
    \n```\nmessage Position {\n  int32 deviceid = 1;\n  uint64 servertime = 2;\n\n\
    \  // decimal degrees = N/S\n  double latitude = 6;\n  // decimal degrees = +/-/W\n\
    \  double longitude = 7;\n\n  postges types\n  integer NOT NULL\n  timestamp\n\
    \    without time zone NOT NULL\n  double precision NOT NULL\n  double precision\
    \ NOT NULL\n```\n\nThe protobuf message is on the left side while the right side\
    \ shows the Posted types. In general protobufs are language neutral and therefore\
    \ have to be mapped to the receiving environment. The listing is skipping the\
    \ Java types as we will encounter them soon.\n\nIf you look at the complete message\
    \ in the [traccar.proto file](#) you will notice the missing id, **address**,\
    \ **protocol fields** - as discussed above. A useful measure is to supply important\
    \ remarks for developers adding comments to the message and fields. They will\
    \ be processed to help and saving when hovering over the variables.\n\nWhen you\
    \ create the initial proto file you should be aware of the explicit ordering with\
    \ **=** expressions. This looks unnecessary unless the fields appear in exactly\
    \ this order. The reason is the forward and backward compatibility of a protobuf\
    \ over time. If you recall your first kt10 message with empty fields it should\
    \ become clear that the protobuf internally applies the order to define values,\
    \ mappings.\n\nIn earlier versions there used to be a **required** token for fields\
    \ and you can find interesting discussions about them, which are quite educational\
