  md: '# 36 Data Modeling


    We can only transform a GPS message to a Java entity, if at least lat, lon and
    timestamp are available (required fields). On the server side with a lot of positions
    an identifier is needed for distinction and therefore the position has an id field
    which we find in the class Extensible. With a little database experience you know
    that database systems (DBMS) generate identifiers while persisting as.


    What if we want to use the entity without database and without ID?


    One of the best achievements of the Object/Relational Mapping framework is that
    the developer does not need to know any IDs or OR relations (primary and foreign).
    As a rule of thumb you should not code any logic based on IDs. In Section 6.5.1
    we will see how the entity manages this task.


    The next mandatory of a tracking message is some deviceId, which can be the IMEI,
    phone number..., whatever the system requires - and which is not generated by
    the database. It only has to be inside the model as a primary key of a table row.
    We can peek into the Traccar database³ (ERM) table positions:


    ```

    CONSTRAINT fk_position_device FOREIGN (deviceid) (id) MATCH SIMPLE

    ```


    What makes the Position class relation the parent class Message which introduces
    the deviceId.


    Position extends Message Extensible


    In the database you can locate this relation in the table definition:


    ```

    CONSTRAINT fk_position_device FOREIGN (deviceid) (id) MATCH SIMPLE

    REFERENCES public.devices (id)

    ```


    This relation has an impact on the GTS functionality; if you have successfully
    recorded a tracking position as described in Section 3.3.4 remember that you have
    to register your device before the GTS accepted its messages. In others the message
    (i.e. position) can only be persisted if the tables hold the deviceId.


    We can conclude that an entity has values (lat,lon,time...), an identifier (id)
    with relations (device) to other entities of the model. The DC server extracts
    values from messages and transforms them to entities. A simple message can require
    a (database and/or) relation in order to be accepted by the GTS (or actually by
    the model). In the next chapter we will use this knowledge to look at message
    relations and how you can model these relations into your protocol.


