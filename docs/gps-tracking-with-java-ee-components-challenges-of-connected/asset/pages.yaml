  md: '# TCP/IP Communication 13


    # 2.2 TCP/IP COMMUNICATION


    Generally we can assume that a tracking system is designed to receive live GPS
    information and telematics from a remote tracking device over the air (OTA). Since
    a modern tracking system should also be able to handle indoor tracking we don''t
    want to restrict the system to OTA. The most general approach is to focus the
    Internet TCP/IP and ignore the transport media – which is the actual benefit of
    TCP.


    # Transmission Control Protocol³


    The Transmission Control Protocol (TCP) is one of the main protocols of the Internet
    protocol suite. It originated in the initial network implementation in the Internet
    protocol (IP). Therefore, the entire suite is commonly referred to as TCP/IP.
    TCP provides reliable, ordered, and error-checked delivery of a stream of octets
    between applications running on hosts communicating by an IP network.


    For developers this interface is focusing on the implementation. We associate
    TCP communication with a port and an IP address on client- and on server side.
    And most important: an IP address defines where a hardware endpoint to software!


    # Port (computer networking)⁴


    > In the Internet protocol suite, a port is an endpoint of communication in an
    operating system. While the term is also used for hardware devices, in software
    it is a logical construct that identifies a specific process or a type of network
    service. A port is always associated with an IP address of a host and the protocol
    of the communication, and thus completes the destination or origin address of
    a communication session. A port is identified for each address and protocol by
    a 16-bit number, commonly known as the port number.


    For our design we can simplify the complete communication by specifying:port combination
    at least for the server and, if available (i.e. online), you may miss the other
    common protocol UDP, which is also applied in various tracking devices. Anyway
    TCP/IP is a useful constellation we can work with and can treat UDP implementations
    in a similar way. The data flow for the new system JEETS can be simplified to:


    Tracking Device > TCP > Tracking Server > JEETS


    ³From Wikipedia, the free encyclopedia

    ⁴From Wikipedia, the free encyclopedia'
