    # 14.1 THE SPRING FRAMEWORK


    The two main reasons to apply the Camel and Spring framework are their threading
    and Decoupling capabilities under the hood. Both techniques are applied to avoid
    delays or blocking, i.e. wasting performance in the regular program flow. Developers
    describe these low level terms with ''Context and Dependency Injection'' (CDI
    and DI). Since the reduction of coupling is vital for complex systems the community
    provides a lightweight Inversion of Control (IoC) container for simple POJOs and
    beans. While Camel decoupling components was initially made to decouple objects,
    i.e. POJOs or beans. The Spring framework is an dependency injection framework
    to manage the life-cycle of Java components and or beans.


    # Spring Framework [63]


    > Core support for dependency injection, transaction management, web applications,
    data access, testing, and more.

    The Spring Framework provides a comprehensive programming and configuration model
    for modern Java-based enterprise applications - on any kind of deployment platform.
    A key element of Spring is infrastructural support at the application level: Spring
    focuses on the ''plumbing'' of enterprise applications so that teams can focus
    on application-level business logic, without unnecessary ties to specific deployment
    environments.


