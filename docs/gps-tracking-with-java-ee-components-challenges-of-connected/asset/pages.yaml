    a scenario. To inspect the scenario for number of all vehicles and list vehicle
    with its messages we add some methods:


    ```

    public List<Device> getVehicles() { ... }

    public Device getVehicle(String uniqueId) { ... }

    public int getMessageCount() { ... }

    public Device getLastMessage() { ... }

    ```


    and we can head on to a frontend where we can actually retrieve and observe the
    scenario in a browser ...


    At this point each tracking message is propagated to the application scenario
    and the application developers can forget about the message source and head on
    to JEE development with an AS.


    You will complete the ApplicationController (seed) in the JEETS repository and
    model it to fit your needs. The ApplicationController is an scoped bean managed
    in the /web layer to access the /ejb layer, clear separation of layers and project
    artifacts for different sets.


    Once you have created your controller you can start adding methods, getters and
    setters to serve your application. The application frontend can then be modeled
    with JSF and the web designer need to add expressions to access the controller:


    ```

    <h:commandButton value="update page " />

    <h:outputText value="Display Status" style="width:100%" />

    <h:outputText value="last update: ${appcontroller.getCurrentTime()}\ />

    ------------------------------------------------

    ```


    And there you are in your JEE application where you apply your JEE skills to process
    the incoming messages!'
