    # 16.4 THE JEETS GEO ROUTER


    The title mapper was introduced as a general purpose tool for connected car technologies.
    We now want to see how we can use a similar strategy for fleet management systems.
    First of all we don''t want to clone messages inside the system at - too risky.
    Therefore we should not provide a recipient list implementation to developers
    to avoid (accidental) cloning.


    With the title implementation we can create 1-n entities. The next implementation
    of a geo router will provide a 1:1 distribution. To achieve this we will apply
    the content based router EIP as shown in Figure 16.3. The geo router will check
    every message and route to one destination only.


    # 16.4.1 Use Case


    For this book we set up the JEETS repository to develop one system with subsequent
    tracking of all components. Due to the lack of a public ‘traffic source’ we have
    created our own public transit (GTFS) factory in Chapter 11 to generate traffic.
    We have used real GTFS data from Hamburg''s agency HVV (see hvv.de).


    By creating a GTFS factory you can generate much traffic to test your system as
    needed. We can create a railway vehicle at the exact time it leaves the originating
    station and simulate its track. For more traffic you could do the same for buses
    and easily simulate hundreds of vehicles for the city of Hamburg.


    Now we separate this particular transit data from the tracking of our production
    system Traccar. As a long as we are tracking vehicles in Hamburg this separation
    of Hamburg from the rest of the world is a feasible development strategy. Business
    wise the filtering is a bit more complex but has the same effect to direct data
    streams.'
