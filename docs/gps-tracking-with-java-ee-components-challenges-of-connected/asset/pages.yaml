  md: '# Enterprise Standards ■ 209


    ![](img/ed3f7c259b164cd908f21a323b5bc23e_223_0.png)


    Figure 17.3. After incoming messages have been transformed to system entities
    these can be directed to various routes. With Camel you can distribute, enrich,
    replicate and aggregate the entity along the route to the targeted resource.


    For a small business it might be sufficient to have a single MQ endpoint to serve
    all vehicles of fleets. An enterprise creating a connected car platform has to
    deal with many concurrent messages and uses data distributors to send the messages
    to geographical region (GeoRouter, tilemapper etc.), to dedicated OEM fleet software,
    or as will be in the last part of the book, send the raw data directly to an application
    server for research. At system entry you should not clone messages to increase
    the load. Speaking in EIP patterns: Use the content based router and not the recipient
    list. The distributor serves as a semantic load balancer for the consecutive software
    modules.


    If you want to add a traffic monitor to view the traffic you should look at the
    Aggregator EIP and how to implement it with Camel. Connected cars continuously
    create a ''live map'' and vehicles can download their direct environment (tiles).
    To do this you can use Camel to place the map on an ftp server and each vehicle
    can use the map to enrich the onboard navigation with traffic information.


    With DCSs have standardized the relational messages to seamlessly work with every
    module. On the other hand you can create small, but very useful components to
    be applied on any Camel route. As example you can build a ''road snapper'' to
    map the incoming positions to the road network. This can be achieved with the
    Java Topology Suite and the Digital Road map as This tool could be downloaded
    from the Maven repository or it could be deployed as a service and a single map
    instance.


    Persistence units are tiny components with large impact as they keep the system
    together as one. TileMapper and GeoRouter were created with existing entities,
    and it is vital to isolate PUs as individual jar files in order to distribute
    to almost every module on top of them.'
