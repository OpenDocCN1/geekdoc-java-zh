  md: '# The JEETS EAR


    JEE environment inside of a preconfigured server. In the end of this chapter you
    can create the EAR from the JEETS repository to implement your own JEE tracking
    scenario or system. The EAR is supplied as a seed component to begin tracking
    development. Once you get familiar with this environment you can choose between
    a JSE- and JEE environment or a mixture of them.


    # 19.1 JEE ENTERPRISE ARCHIVE


    EJBs are complex constructs (under the hood) [69] that can be deployed in a single
    file to an AS with the EJB framework configured to access previous subsystems.
    EJBs are easy to create, but when deploying a number of EJBs their management,
    services and interaction become more complex. An Enterprise Archive is a construct
    to package a number of cooperating modules in one package.


    The AS knows exactly how to deploy the EAR according to XML descriptors ..., the
    order of installing and running the components in the EJB container with given
    dependencies. The deployment process already implies a lot of validation itself.
    The EAR matches the AS structure and an EAR deployment to AS is compatible to
    that of a Docker container to its container.


    Another comparison are the different deployments of an AS archive with or without
    dependencies. If you look at the packages of the jeets-tracker target you will
    note that the actual business code has a size around 20 KB, while the jar-with-dependencies
    has about 20 MByte; The latter can be compared to an AS with installed dependencies.


    In short: For a developer the EAR file represents the AS environment, which has
    been set up for all external resources, i.e. database access via DB Pooling, secure
    user Login for customers and employees (LDAP etc.) ... developers define EJB connectors
    declaratively with JAA annotations or alternatively with XML descriptors.


    With the JEETS EAR we want to supply some major technologies for your convenience
    and provide hints to all your own. The configuration of these technologies should
    give your entry to an AS. Again, one of the main reasons to implement tracking
    for an AS, is the existence of other major systems in a company. Therefore we
    will not create a complete application, but you will see how to add tracking information
    to your existing EJBs – how to integrate your system with tracking information.
    Let''s see how we can abstract the environment for this general purpose.


    Without describing every step we will outline the rapid development of a subdivided
    ear file. You can then choose to use the JEETS EAR or create your own from scratch
    by following the instructions.'
