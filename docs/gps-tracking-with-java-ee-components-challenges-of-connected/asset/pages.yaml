    the GTFS database to create a live vehicle track. If you are new to GTFS you could
    gain some experience by first using a SQL tool, like PG Admin, identify transit
    vehicles leaving the next stop from your home to stop know well. Once you are
    familiar with the data structure and relations you model your prepared SQL statements
    to ’JPA Java’. In the jets-gtfs-factory you will find the TransitFactory class,
    which implements a top down search from GTFS data.


    Let’s go through the major entities / tables of the GTFS / db. For prototyping
    it is helpful to start by creating SQL statements and combining with named queries.
    In a next step SQL can be remodeled with entities.'
