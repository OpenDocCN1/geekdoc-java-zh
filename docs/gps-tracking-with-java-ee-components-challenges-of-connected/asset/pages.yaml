    From performance considerations it makes a lot of sense to start entity processing
    with a database lookup with SQL or better JPQL for painless platform changes.
    Each GTS manager should be aware of the available information in the software
    created or retrieved from the predecessor and should navigate through the ORM
    to enrich it. Once the context is completed the last manager can persist every
    modification along the route and other handler routes instantly synchronize the
    new info.


    # 17.6.3.3 Permission Manager


    In case of Traccar the permission management can be implied in every empty database
    query. If permission is denied then an exchange is sent on the GTS route. If you
    choose to use an application server you can use its security domain to create
    safe sessions. The login process can also check user and role permissions with
    SQL statements.


    For connected car systems this process is much more complex and messages must
    traverse the process of identification (who?), registration(listed?), authentication
    (digital identity) before it is finally authorized (''come in'') to enter the
    system.


    To simplify admission sequences Figure 17.4 showed an abstracted permission manager.
    This manager might deal with internal enterprise LDAP servers or require to use
    security domains etc. With ''hiding middleware'' we have learned how to create
    independent Java software and how to add a Camel endpoint. No matter how complex
    the admission might be, it must return Yes or No as the result.'
