    # # Hands-on Instructions


    In order to run, debug and analyze Traccar please follow the appendices

    ''Development Environment'' and ''Install Traccar Sources'' to set up your

    environment before continuing with the next section.


    # ## 3.2 DEVICE COMMUNICATION SERVER


    The core of GPS tracking is the device communication with many trackers

    via dedicated protocols and hardware ports. Usually for every tracking device

    type (and protocol) there is a Device Communication Server (DCS) to decode

    t protocol into the tracking system. For scaling and security purposes one

    single protocol can also be bound to different ports for different customers.

    Classical tracking systems store the information in the database where-

    secutive components can pick up this information (see Figure 2.3 on page

    19).


    The DCS is connected to a hardware to receive tracking messages (i.c.

    key-value pairs), then parse and propagate their information to the system

    core. A single DCS is usually bound to a port to receive live GPS information
    and telematics from

    a a remote tracking device via TCP. The DCS processes these ''events'' shortly

    after their occurrence.


    In the next chapter we will look at the Traccar GTS and its DCS archi-

    ecture. We will learn that every DCS of a single GTS creates the same Java

    types for a standardized data flow and process the actual tracking sys-

    tem. Especially for the SDG scenario we should restrict the DCS

    definition to its core tasks:


    +   listen to ports, create socket and session, receive tracking event


    +   extract and convert data to the actual GTS model


    The Device Communication Servers of OpenGTS are actually doing more:


    +   add geographical labels, i.e. geomatch coordinates to address


    +   administer tracking devices, create reports


    +   create geozones for server side events


    We will later how to fulfill these tasks in a more modern way.'
