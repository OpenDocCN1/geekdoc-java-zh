    system with the following components and layers:


    # 19.2.1 Client Software (Simulation)


    The client side is complementary to the GTS and we need to send messages to process
    through the GTS. We are prepared to do this with the JEETS components jeets-tracker,
    jeets-player or a more complex source coded from my-jets-client.


    Let''s revisit your GTFS factory with data from HVV agency in Hamburg. You can
    setup your my-jets-client to replay a single transit vehicle or you can roll out
    one for all vehicles at one time! To achieve this you can use a GTS data source
    or access to the REST API called GeoFox and retrieve live tracks.


    Usually transit vehicles are defined with line keys for different vehicle types
    like L: for the line, B for the agency and U, B for the vehicle type. For our
    setup we''ll instantiate my-jets-client two to simulate Subway U1 from Fuhlsühl
    to Farmsen and the opposite Direction. In order to depend on individual line keys
    at different nowadays we''ll call the devices U1.FuFa and U1.FaFu. The client
    software can then be launched twice with slightly different command lines in opposing
    directions:


    ```

    my-jets-client "U1" "Fuhls\uttel" "Farmsen" "U1.FuFa"

    my-jets-client "U1" "Farmsen" "Fuhls\uttel" "U1.FaFu"

    ```


    Prepare your client software or hardware to send messages to an IP:port

    If you are using the jeets-player you should see the messages

    ''U1.FuFa'' sending 2 Positions to ''localhost:5200''

    152431469651 (4 msg queued)

    When there is no receiver on server side you can stop the client software\and
    leave the command line waiting for the RETURN key.

    if you (implicitly) apply the jeets-player you can keep it running

    as it will buffer the messages with their original GPS fixtimes

    which is convenient especially at development time.

    And it simulates the hardware behavior of a tracker

    losing contact to the server for a while.'
