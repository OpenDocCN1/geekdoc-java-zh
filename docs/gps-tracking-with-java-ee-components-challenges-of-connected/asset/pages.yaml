  md: '# 12 ■ Message Exchange


    # 2.1.3 Message Catalogs


    The tx102 protocol format is helpful for a textbook and is sufficient to describe
    the process of encoding and decoding messages. For higher network traffic and
    smaller data sizes more sophisticated devices apply byte by bit manipulations
    for every data field.


    To get an impression of a complex device you should have a look at Garmin Fleet
    Management Interface (FMI) [6]. FMI provides a large number of features, i.e.
    messages used for fleet management solutions with navigation and messaging. Garmin
    FMI devices represent a connector for external track sensors like dash camera
    and much more.


    The complete FMI functionality is a large message catalog [7] where you will find
    message for many different appliances:


    +   - A607 Waypoint Management and Driver Status

    - A611 Server to Client Long Text Message Protocol

    - A622 CAM 1.0 (Dash Camera Protocol)


    The implementation details can be found in the Garmin Interface Specification
    [8] which has about 70 pages of technical details for encoding and decoding. We
    will not go into the specifics of extracting information from a decoded file and
    this specification can serve as a substitute for you to get a good impression
    of a complex device communication. The document describes data types, protocol
    layers and application protocols that you can study as needed.


    Another good reason to look at the FMI devices in the SDC context is the fact
    that it is not a tracker! Although it does have a GPS unit and even more a digital
    map for navigation it does not hold a GSM unit. In order to communicate with a
    GTS or Fleet Management System the device has to be connected to a tracker with
    a GSM unit. The FMI device communicates with the tracker via physical protocols
    such as RS232 or USB Standards. The tracker (or self driving) car is merely the
    device to submit messages and add a time and place stamp. We will look at some
    implementation details to deal with two devices little later.


    Now that we have a good idea of fields, and message catalogs we proceed to create
    a device communication server for dedicated message catalogs representing a device
    and its external sources or sensors.'
