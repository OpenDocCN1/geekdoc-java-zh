  md: '# 17.5 GEOFENCE MANAGER


    After modeling the route for database management we''ll have another look at the
    JEETS architecture. Compared to the ''production system Traccar we have seen how
    to isolate the complete device communication and how we can pick up the entities
    from a message queue. The messages from the MQ are directed to the handler to
    manage all database accesses in a logical sequence. With this route we have created
    the backbone for a complete GTS and we only have to deal event handling and a
    notification engine.


    As a start new we will add the geofence manager as an implementation example and
    we will look at the geofence processing from our manager to the next. Generally
    speaking the handler provides the two entities inDevice with chronological positions
    and dbDevice with reversed chronological positions. The latter is the target to
    be persisted at the end of the route.


    ```

    dbDevice (persisted data)

    <-- position 0 1 2 <--- direction of travel

    fixtimes 00:41:29 00:39:29 00:37:29 reverse chrono order

    inDevice (incoming message)

    --> position 2 --> direction of travel

    fixtimes 00:42:29 00:43:29 00:45:29 chronological order

    ```


    We could merge the entities into the our entity from the start. To keep managers
    as independent as possible we''ll make a contract to keep both entities for all
    managers. This way manager can distinguish existing from incoming data. Since
    the device is part of the system model every manager is implicitly standardized
    to the system and can be applied in various plain Java classes.


    The device entity is ready to traverse the handler route and every programmer
    can add children entities to the instance. We have actually created a new structure
    to implement Traccar''s abstract method:


    MapEvent, Position> analyzePosition(Position position)


    If you decide to code modules to retrieve all children positions you can maintain
    performance with automated database archiving. A daemon can pick up all positions
    after a month or aggregate them into a report structure. The way the customer
    still has access to reports, but cant view the detailed route. These overall aspects
    of a system are typical for SDC scenarios and even in classical GTS tracking you
    should define and communicate for how long single positions are persisted. Vice
    versa the customer might ask you to delete the data due to legal issues. Legal
    and business aspects are always part of the system architecture.'
