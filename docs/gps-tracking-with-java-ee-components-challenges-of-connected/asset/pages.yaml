  md: '248 The JEETS EARS


    # 19.4 JEETS OUTLOOK


    Once you keep the JEETS application up and running you are a qualified JEETS developer
    and should be able to tracking your own application. This book has demonstrated
    how to define your messages towards a system model, which is materialized in the
    persistence unit. When the message reaches the server port it will be transformed
    and propagated to the system, to your system.


    One last time it should be highlighted that we have modled the complete route
    from tracking client to DCS, ETL, geobased routing and then to a large JEE application.
    The higher level modeling actually takes place in the JEETS repository to become
    the actual Software Model.


    In order to keep the repository as one system, developers have to add tests with
    each implementation. The project manager can focus on the development of the repository
    itself by adding Integration Testing over software modules.


    Please check the JEETS repository at github for the latest developments. The roadmap
    prepares the modeling of a complete message route from client to server Maven
    project individually, then combined projects, like DCS. After that you can create
    a client with a tracker, a player, a factory etc. and run it inside your test
    environment. The server can be set with a clean memory database, create the model
    with JPA on the fly, accepting the incoming messages and direct them to the module
    to be tested. In other development cycle the system (test) can be for performance.


    Then after you have modeled the complete transmission of a GPS line from client
    to server you can add Arquillian to launch WildFly, add a message broker for tracking
    and you can supply a real database connection to compare in memory performance
    with the installed RDBMS. External resource be supplied with a Maven profile to
    provide control over each dedicated testing environment.


    As you can see there will still a lot of work to ensure a stable GTS like Traccar
    and we will see where it''s heading at jeets.org. The creation of various integration
    environments is not related to GPS tracking, just like JEE programming with different
    subsystems. Therefore we will conclude the book at this point and head on to a
    shared repository for discussions and improvements.


    See you at jeets.org !'
