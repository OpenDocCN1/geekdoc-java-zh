    # Tutorial on Spring Remoting with JMS [48]


    > This tutorial is a simple example that demonstrates the fact of how Camel is
    seamlessly integrated with Spring to leverage the best of both worlds. This sample
    is a client server solution using JMS messaging as the transport.

    The server is a JMS message broker that routes incoming messages to a business
    service that does computations on the received message and returns a response.


    With respect to our permission management we can create an MQ endpoint to route
    messages to role, rule-, group permissions with authentication and return the
    message that can be forwarded to the tracking system.


