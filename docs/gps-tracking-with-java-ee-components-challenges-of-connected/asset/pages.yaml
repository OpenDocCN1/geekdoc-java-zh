  md: '# Monolithic Traccar Architecture \■ 127


    Our intention is *not* to go through each one of these managers and handlers.
    We want to understand how Traccar is going through this complete process inside
    a single Netty pipeline. And all ''components'', like decoders and handlers are
    extended or implemented from Netty types while the managers take care of the business
    logic. Our intention is to set up a similar processing chain where you can create
    your own handler components as needed for dedicated applications or use cases.


    We have looked at Traccar''s event handling process in Section 8.1.2 to find that
    all events are parsed and created inside its BasePipelineFactory. With respect
    to this performance is hard to beat. With respect to SDC scenarios we would have
    to implement every event in the Netty pipeline. As these events can be project
    specific we would need to add switches, filters inside the streaming process.


    Traccar''s handler concept analyzes the previously created *Position on events
    derived by the server logic*. Since you cannot analyze a motion from a single
    position at a given time the method takes the previous position into account.
    Again you should be aware that this previous position is retrieved from existing
    server data and this can already have been *smoothed* and deviate from the actual
    client recording.


    By using the device ORM we can submit more than one position and the client can
    implement some logic to compose a track. Then we can simply access each previous
    position in the track without accessing any external resources.


    By creating a persistence unit in conjunction with a protocol we have defined
    the target format of the complete system. Now we want to go a different way than
    Traccar by providing a general purpose ''loader'' *before* applying any application
    logic after loading.


    We want to pick up the idea of integration frameworks with respect to the Traccar
    processing chain and perceive every manager as a component that can be added and
    removed from the system. This way software composition becomes much more flexible.
    Let''s see how we can achieve this?'
