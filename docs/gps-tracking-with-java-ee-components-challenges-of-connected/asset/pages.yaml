  md: '# 17.6.3.1 Server Manager


    We have identified Traccar''s ServerManager as the Controller for all DC servers.

    Let''s say you wanted to create a stand alone version of Traccar''s ServerManager
    that you can use to supply system entities from different protocols. In an enterprise
    environment you could modify Traccar''s pom.xml file to create a sub project to
    create traccar.protocols.jar which includes the default.xml file with predefined
    protocols and ports⁴.


    Then you can create a ServerManager configuration with a Camel or Spring startup
    that takes care of the bootstrap configuration for all DC servers, i.e. protocol
    and port pairs. The output of the ServerManager should be defined by a small number
    of system entities: the protobuf deliver ORMs to their endpoints while the Traccar
    protocols create position objects from different protocol and types.


    # 17.6.3.2 Data Manager


    Traccar''s DataManager can be replicated with the JPA specification, the PU and
    the EntityManager. We have created the handler route to demonstrate entity handling
    along the route of different managers. In the case of JPA every EntityManager
    can be provided by an EntityManagerFactory for which Camel provides implementations
    of many (emerging) database technologies⁵.


    +   Apache Cassandra database

    for scalability and high availability without compromising performance.


    +   Apache Couch database

    Seamless multi-master sync, that scales from big data to Mobile, with a Intuitive
    HTTP/JSON API and designed for Reliability.


    +   Dropbox

    treat Dropbox remote folders as a producer or consumer of messages.


    +   Gora

    NoSQL databases using the Apache Gora framework.


    +   Hadoop

    For distributed storage and processing of big data datasets.


    +   Batis

    Performs a query, poll, insert, update or delete in a relational database


    +   PGEEvent

    Allows for producing/consuming PostgreSQL events related to listen/notify commands
    added since PostgreSQL 8.3


    > ⁴you should update each protocol from Netty3 to Netty4

    ⁵The main requirement is via JDBC.'
