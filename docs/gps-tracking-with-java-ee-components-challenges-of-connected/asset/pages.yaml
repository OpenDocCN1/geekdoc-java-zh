    # 14.2.2 Camel JPA Configuration


    Now that we have an endpoint for persistence, the ETL should be ready to use.
    But again we are confronted with the intricacies of a Camel component. When programming
    against the JPA you must be aware of the differences between the EntityManager
    persist and merge methods. Behind the scenes the difference lies in the SQL statement
    UPDATE or INSERT data. The persist method adds a new entity to the persistence
    context and has the void return type. The problem is that you can raise an exception
    if you try to persist a detached i.e. unmanaged instance with something like EntityManager.persist(entity).


    The merge method looks for an entity via ID, retrieves it from the persistence
    context or creates a new instance loaded from the database, copies fields from
    the passed object to this instance and updates the instance. The returned entity
    is a different object and the passed-in object should be ignored or better discarded.


    In the context of the ETL in conjunction with Traccar we would like to check,
    if a device is registered under the uniqueId and only persist the message for
    existing devices. We can use the Traccar administration to register devices and
    still receive their messages via ETL.


    Applying SQL statements to an EntityManager on a database is more than just a
    technical detail. Database models (ERM) are intentionally created with a number
    of constraints to control data modification (DML). We will use the persist method
    to gain control over the incoming data. Checkout the Camel JPA page to find the
    configuration option usePersist=true to the endpoint


