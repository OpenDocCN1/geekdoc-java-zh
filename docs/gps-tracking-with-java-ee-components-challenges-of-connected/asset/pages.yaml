    This book describes tracking technologies and provides tracking, i.e. JEETS components
    as add-ons to existing applications. This book does not create a complete tracking
    system. By introducing Traccar as a complete and structured tracking system we
    can analyze its architecture and use it as fallback for (yet) missing components.
    We will identify endpoints to place logical to any existing system. Experienced
    developers will be enabled to create a new system from Traccar and JEETS components
    in a complementary manner.


    OpenSTS was the first Java Open Source GTS. The DCS modules are compiled to independent
    jars while the core system is built with the Ant tool and based on Servlet technology
    running on Tomcat. When Traccar came as the second Java Open Source GTS many companies
    replaced the OpenG with the better performing Traccar Device communication while
    sticking to the Open Web frontend to their customers.


