    # 17.5.2 Route Modification


    We have created geofence entry and geofence exit events in the same manner the
    Traccar system does. The event is attached to the position right after the event
    has occurred. With JTS it is easy to determine the exact coordinate of the intersection
    and calculate (mathematically) exact time.


    | geofence | intersection to positions |

    | --- | --- | --- | --- |

    | |-- distanceName ---->|distanceTwo ---->| distances |

    | t0 | ? | i | t2 timestamps |


    By calculating distances between one and you get the ratio, apply it to get the
    timestamp of the intersection and can finally create the exact position of the
    event!


    Anyway we will not create this additional position. The reason concerns an unmentioned
    guideline for the complete tracking system. The vital question is whether you
    want to persist only the exact positions submitted by the tracker message or whether
    you allow modifications. Classical tracking systems usually do not modify original
    tracks while SDC systems aggregate tracks from many different vehicles to represent
    the traffic situation. These systems provide many utilities to optimize tracks
    by snapping coordinates to the road geometry, removing positions without additional
    information etc.


    > ³TYPE_GEOFENCE_EXIT and TYPE_GEOFENCE_ENTER'
