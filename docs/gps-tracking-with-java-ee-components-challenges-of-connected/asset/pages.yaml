  md: 'other hand, the computer industry can only grow with sufficient energy and
    is competing with classical consumers like cars – people. Just think of the billions
    of smartphones as standalone high tech computers, always up and running, demanding
    a complete load every day!


    The Ops part of DevOps was also driven by administrative and hardware developments.
    In the nineties the installed and running software turned out to be a great challenge
    while it was barely noticeable for PC users. After hibernation the to virtual
    machines was relatively small and modern CPUs with a virtualization mode in the
    BIOS, VMs turned out to be very convenient. Or that hibernated VM is only a binary
    blob and it shouldn''t be misused for (incremental) backups on a regular basis
    and its frozen content. Databases backup data on a regular basis and to enable
    developers to search for datasets in the archives.


    Docker can be perceived as the next step to more transparent deployment, the point
    is that the traditional operating system is being abstracted and reduced to a
    ‘container’, which provides the software environment. From Java developers'' perspective
    others are slowly being separated from moving out of the application server.


    This book is about software development and how to separate business logic (Dev)
    from deployment (Ops). A developer is not in charge of leveraging the CPU power
    in applications. Why should he investigate the number of (virtual) CPUs in Dev
    VM, if he doesn''t know what CPU slices will be provided from the production hardware?
    He should rather provide some benchmarks to provide hints for the operator. We
    have seen Camel can be used to split and merge processing steps and how Spring
    creates objects via IoC to handle the load and adds Aspect-Oriented Programming
    (AOP) to complement Object-Oriented Programming (OOP).


    The operator is in charge of the behavior in general and modern computing nodes
    provide scale a system. SDC systems require this kind of hardware scaling and
    have challenged software development to make it happen! We all the critical traffic
    spots from our daily trips and we know when to avoid traffic. The same applies
    to cloud computing: During rush hours the system can automatically launch additional
    instances of any module.


    A modern tracking system should be able to raise CPU power on demand and lower
    it to control the hosting costs – electricity in the end. Or more consequently:
    a modern tracking software can be set up for every (major) customer! It''s only
