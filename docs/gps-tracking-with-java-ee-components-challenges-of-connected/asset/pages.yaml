  md: '# Protocol


    This is another string of the Traccar position to be stored in the database. For
    the sake of simplicity we will only apply one protocol per port and this field
    is not used to determine a port from the protocol name. It does not make sense
    to fill this field on the client side.


    # Message ID


    This field is not explicitly defined in the Traccar model but can be found in
    many protocols to support the network transfer. When the client receives an ACK
    response it can clean up the sent messages and by adding a messageId to the response
    client logic can clean up the successfully transferred messages. Many trackers
    automatically resend a message after a certain number of seconds, if they don''t
    receive an acknowledgment.


    Note that the messageId is not mandatory for a single Netty session processing
    a single message. The point is that you can add fields to the ''network model''
    that will not end up in the system model.'
