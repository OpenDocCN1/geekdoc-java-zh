    # 17.4.4 Ordered Relations


    The Java developer comfortably traverse the device''s positions in a loop


    ```

    for (Position position : dbDevice.getPositions()) {

    ```


    does not control how and when the Set<Position> is loaded; how many Positions,
    in what order? Cod should always be aware of the loading mechanism and take purely
    logical aspects into account: Imagine you receive a message from a device that
    has been registered for a long period. If you invoke the size method PersistedSet.size()
    it is only logical that the entity manager has to check the database for all positions
    somehow.


    To get more control over the position retrieval we have tuned the Device positions
    from a Set to a List and reverse chronological ordering as statements follows:


    ```

    @OneToMany(...)

    @OrderBy("retime DESC, devetime DESC, servertime DESC")

    public List<Position> getPositions() {

    ```


    This sorting does cost performance in the RDBMS, but as all messages should arrive
    (more or less) in chronological order it is reasonable to set a standard order
    directly in the parent entity. This does not only apply to the handler route and
    persistence context. It applies to the children and reverses the order of the
    data collection and persisting.


    Every time the list of positions is accessed from the database, the database orders
    before it returns the first entries. The order of chronological tracking is perfectly
    reversed. The first position in the list is the last position received in the
    database. The important part of any UI modification is to spread release notes
    among JPA developers!


    Therefore manager implementation should traverse the list into the past while
    the incoming messages list their positions in correct chronological order. If
    every manager would revert the lists for better readability this would consume
    some overall performance in software and database!


    As long as the system is running stable you may not notice it, but as the database
    grows it can become a bottleneck. On the other hand, sorting a sorted list doesn''t
    cost much additional processing and can stay in the code as an assertion of a
    correct order. Anyway the operator should keep an eye on the entity handling route.'
