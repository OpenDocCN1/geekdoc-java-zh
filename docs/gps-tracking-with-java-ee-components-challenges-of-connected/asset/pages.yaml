  md: '# 34 ■ Data Modeling


    usually only a part of the provided protocol messages are actually transformed
    in a DC server according to the application needs.


    Technically a tracker message is just a collection of variables. Semantically
    it describes some kind of event which has occurred during tracking to the submission.
    A communication server''s task is to decode the submitted bits and bytes into
    Plain Old Java Object (POJO).


    Especially in tracking devices with restricted bandwidth and connectivity the
    message size should be minimized for a safe transfer in little time. A regular
    GTS can not be associated with a client software as a part of a distributed application.
    A tracker can be (hardware) device sending serialized variables from various sensors
    and no language specific objects. A tracking system can have many purposes and
    may reject many tracker messages in the first place. Or the other hand GTS can
    grow to new requirements.


    As an experienced developer you know that every application requires a model.
    In general a model is a collection of all data pieces (fields) grouped in entities,
    which are related to each other. Any good system design is based on the integrity
    of the data model. The model describes data formats and the relations in the (tracking)
    application. We will analyze how a good model can support development of well
    performing processes.


    # 4.2 MESSAGE TO ENTITY


    A DCS is the entry point to a GTS and as we are focusing on incoming messages.
    The first task is to create Java objects from incoming messages. In the case of
    Tracer we have seen that every protocol device is creating a org.traccar.model.Position
    as the return value of its .decode(...) method.


    Tracker''s Position is pretty straightforward forward and we can easily find the
    base coordinates GPS(lon,alt,time) we have defined in Section 2.1. There are a
    few more fields to enrich the information for the GTS, like GPS and turns to determine
    the network latency². If you look at the Position source you can find a large
    number of constants compared to the limited number of fields:


