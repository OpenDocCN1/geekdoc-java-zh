  md: "# 184 Geo Distribution\n\nforwards each to one destination, while the consumers\
    \ represent a 1:n relation of messages. (You could also model n:n.) The advantage\
    \ is that we don't have to know the number of consumers at construction time.\
    \ A system architecture should be aware of the difference. Topics can consume\
    \ many resources with fewer guarantees while queues are better for load balancing.\n\
    \nThe geo router extracts the positions from the device to create a linestring\
    \ and 'relates to the polygon'. As you can see JTS offers many geometric relations\
    \ and you should carefully choose the one you need. Anyway many more ways to compare\
    \ details with 'fast' comparisons, but you can find more details in JTS. For example\
    \ the linestring also has a direction and we can compare the device track's first\
    \ point (last point in time) to the polygon with deviceTrack.getStartPoint() and\
    \ decide to only accept messages, if the subway is heading into the zone.\n\n\
    The result of the GeoBasedRouter is stored in a header\n\n```\nexchange.get().setHeader(\"\
    senddevice\", \"hvv\");\n```\n\nThe headerName \"senddevice\" is an internal 'variable'\
    \ for geographic routing. For our simple setting we only distinguish the headerValue\
    \ \"senddevice\" and \"gts\".\n\nNow it is to create a GeoBasedRouter by using\
    \ the header as a predicate\n\n```\nfrom(startUri)\n  process(new GeoBasedRouter(wtPolygon,\
    \ targetTopic))\n  .choice()\n    .when(header(\"senddevice\").isEqualTo(targetTopic))\n\
    \      .to(\"activememq:topic:hvv.device.in\") // JEE\n    .otherwise()\n    \
    \  .to(\"activememq:topic:hvv.device.in\");\n```\n\nAnd that's all there is to\
    \ it."
