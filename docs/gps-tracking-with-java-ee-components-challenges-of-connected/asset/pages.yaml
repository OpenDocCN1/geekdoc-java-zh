    # 4.1 DATA MODEL


    In complex EE software running on application servers data is exchanged in Java
    types, objects and references. These system entities should be limited and well
    defined for all components. In times of distributed systems we should not rely
    solely on a specific programming language and rather focus on protocol specifications.


    The first section about device communication outlines how well defined messages
    with ordered values are transferred over the network. In order to process the
    data on the server side value has to be related to a Java Type key to sender and
    receiver according to a protocol.


    A complete protocol is composed of a number of message types describing a complete
    client-server dialog with all available features. More generally a scientific
    or diplomatic protocol describes a complete process with all intermediate events
    from beginning to end. This was indicated with the Garmin FMI message Catalog
    in Section 2.1.3. In such a case a protocol becomes mandatory and the application
    has to manage intermediate states to follow the order of predefined events. When
    you implement a new tracker'
