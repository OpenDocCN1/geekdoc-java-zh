    # 6.5 FINE TUNING AGAINST ERM


    In the JEE persistence unit can be fine tuned to serve the application and reduce
    programming. On page 48 we have designed the Device message to fit incoming data
    to Traccar and define a single protocol for related messages. When working with
    entities (with or without the database) we would like to use the same convenience.

    Let''s say one model creates different entities with the keyword new:


    ```

    Device device = new Device(1, "Tracker", "395389");

    Position pos1 = new Position(1, device, ..., 49.12d, 12.56d, ...);

    Position pos2 = new Position(2, device, ..., 49.34d, 12.78d, ...);

    Event event1 = new Event(1, device, "deviceMoving", ...);

    Event event2 = new Event(2, device, "deviceStopped", ...);

    ```


    then the Position and entities are related to the device by using the object for
    the relation. Now these five objects can be attached to the entity manager for
    persistence in the database:


    ```

    entityManager.persist(device);

    entityManager.persist(pos1);

    entityManager.persist(pos2);

    entityManager.persist(event1);

    entityManager.persist(event2);

    ```


    This implies some problems. After creating the five entities the programmer has
    to make sure that they are persisted in the correct order of dependencies! If
    you wouldn''t persist the device first and then its positions and events this
    would raise a violation in the database as they wouldn''t have a parent. It is
    also illegal to invoke a .persist() method on every single entity. By doing this
    you create additional work for the entity manager. Let''s see what we can do to
    move this persistence ordering and id management from the business code into the
    PU.


