  md: 'ERM and PU Updates ■ 71


    Consequently we have to keep up with Traccar''s development and apply the ERM
    updates with every new release. A closer look at the database schema history reveals
    that tables can be dropped from the model and new tables and attributes are added
    constantly.


    How can we deal with this constant development? Software is alive and developers
    should be aware of this fact. How did the creators of the JPA specification incorporate
    this aspect?


    For one thing the direct access to the database bypasses the logic of the Traccar
    software. Completely the JEETS modules can insert any device with positions and
    events as long as they adhere to the table''s constraints. We will create a JEETS
    leader to do exactly this and imply the responsibility for the values to work
    with the Traccar software. For example we can add a validation check before inserting
    data - if we previously look up the device in the task has be registered via Traccar
    before the JEETS leader can add positions and events.


    Another aspect of designing a dedicated persistence unit for a piece of software
    is that the PU does not include the complete ERM. If we have modified three tables
    yet we can create the PU with these three tables we can create PUs with different
    tables.


    If we want to (geocode) logic as described in Section 5.6 we can add the relevant
    tables in the development process. This way the maintenance can be handled much
    better. Generally it is easier to add than modifying existing entities and attributes.
    Even if the existing tables are extended the entities only need to be modified,
    if it handles the changes.


    Practically the PU is regenerated after every new Traccar update and moved into
    the jpa folder. We have renamed the three entities from plural to singular. Therefore
    they will not be replaced, the new software will work with the manually modified
    entities. The other entities are compiled anyway and can be modified as they are
    implemented in the JEETS software.

    different purposes:


    For larger developers it may make sense to create different PUs for


    ```

    jeets-pu-traccar-devices-jpa

    jeets-pu-traccar-admin-jpa

    etc.

