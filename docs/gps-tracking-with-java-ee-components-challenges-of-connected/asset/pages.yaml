    in any Java application. Apache Camel lets you work with the same API regardless
    which kind of Transport is used - so learn the API once and you can interact with
    all the components provided out-of-box."


    If you are not familiar with Camel it is helpful to browse over its website -
    no doubt. On the other hand developers conflated with Camel for the first time
    commonly have problems grasping the frameworks domain, which is somewhere in between
    different software ''pieces''. Integration is the process of mediating between
    different software ''pieces''. Camel is not a middleware itself; it can be used
    between Java applications, hardware (i.e. ports), middleware and backends. When
    you look at a block diagram of a system Camel is represented (or actually hidden)
    in the connecting lines.


    # What exactly is ApacheCamel?


    +   * Apache Camel is an open source Java framework that focuses on integration
    easier and more accessible to developers and provides:

    * concrete implementations of Enterprise Integration Patterns (EIPs)

    * connectivity to a great variety of transports and APIs

    * easy to use Domain Specific Languages (DSLs)

    * to wire EIPs and transports together


    Camel provides ''a great variety'' of different implementations and different
    specific languages, which can be very distracting for a first contact. With Camel
    (you) can take a different, higher level, perspective to look at complex systems,
    to think in enterprise integration patterns and to develop in the role of an architect.
    With plain Java you create Objects to interact with and you also code with Java,
    but now the involved components can be treated analogously to Java objects.


    # 13.2 JEETS CAMEL COMPONENTS


    For the readers unfamiliar with Camel the next two chapters can serve as a spectacular
    introduction to modern software development:

    The JEETS Camel Tutorial - get ready for some Camel magic!

    The important aspect of integration is to grasp each software component in its
    business domain language, like device communication. Not in technical terms (TCP,
    threading etc.) but in how the component works internally.


    > see stackoverflow.com/questions/8845186/'
