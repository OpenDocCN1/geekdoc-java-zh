    This implementation counts all messages arriving in the application and creates
    a new vehicle for a messages unique ID or it adds the message if the vehicle already
    exists. For simplicity each vehicle is represented by a Device object and for
    a new vehicle we simply use the incoming Device message, which is the reward of
