    # SEDA Component [40]


    > "...provides asynchronous SEDA behavior, so that messages are changed on a BlockingQueue
    and consumers are invoked in a separate thread from the producer.

    Note that queues are only visible within a single CamelContext. If you want to
    communicate across CamelContext instances (for example, communicating the VM component.


    Instead of waiting for messages to be sequentially consumed from the end of our
    route we serve each consumer (instance!) in a separate thread. Just like other
    components the SEDA component provides configuration options and we can fine tune
    our route for asynchronous concurrent consumers. By specifying concurrentConsumers
    we can improve the performance with WaitForToCompleteNever SEDA will simply forget
    the message and call the next one: "fire and forget".

    The configured multi threaded ending point of the DCS looks like this:


    ```

    .inline("seda:jeets-dc" + \

    "?concurrentConsumers=8&waitForToComplete=Never");

