  md: '# The JEETS Tile Mapper 173


    ![](img/ed3f7c259b164cd908f21a323b5bc23e_187_0.png)


    **Figure 16.2** The tile mapper can serve as a semantic scaling method to distribute
    messages to different geographic tiles and different zoom levels, i.e. map scales.


    i.e. map scale. By applying this algorithm on a car''s location the messages can
    be distributed to tile servers and, if required, large tile ''containers'' redistribute
    the car locations to smaller tiles with larger zoom levels.

    The tile algorithm can vary from company to company and should therefore be distributed
    from a (Maven) repository similar to the persistence level for standardization.
    Algorithms can be provided for different programming languages, as pure math or
    as a service.


    As an example algorithm you can look at the Slippy map tiles [65] function:


    ```

    n = 2 ^ zoom

    xtile = n * (1 - (log(lat_deg + 180) + sec(lat_rad)) / pi)) / 2

    ```


    Though trigonometric calculations can get expensive the formula is inconvenient
    for our message distribution. In big data systems it is worthwhile to create tiling
    algorithms with fixed size integers and without trigonometry to save some milliseconds.

    Let''s see how we can distribute messages to tiles with Camel.


    You will find a TileMapper seed component in the test environment of-server-jse/jeets-geo-router.

    Please run the AmqTileMapper before you continue to read about the implementation.'
