    # 6.1 INTRODUCTION


    The relational data model is the fundamental component for most systems and JEETS
    components can only interact if they share the same data formats: Entities should
    be created as the smallest and related pieces of information for the system. The
    power of JEE development lies in the clear separation of components for different
    programming domains. These components can be downloaded from third parties like
    the Net Framework and the Protobuf Library. They can be combined with your business
    code to create a new component including the third party dependencies.


    This chapter will deal with the org.traccar.model package representing the installed
    database. If you are familiar with the Java Persistence Architecture (JPA) then
    you already know that this package is defining the Traccar Persistence Unit (PU).


    We have introduced the ideas of JEE components in Section 2.3 and JEETS should
    provide a number of useful tracking components. While Traccar is a well aligned
    Java application and only requires a JVM we will create a separate persistence
    unit for any application based on the Traccar model. A jeetspu-traccar module
    can be used to replace the org.traccar.model package outside of the Traccar application
    - like in an application server or'
