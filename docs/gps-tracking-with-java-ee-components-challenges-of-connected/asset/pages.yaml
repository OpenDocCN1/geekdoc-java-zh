    # 7.2 TRACCAR.JAVA


    If you have created Google''s person example [18] you can now compile the traccar.proto
    file and open the generated Traccar.java file first! (You might want to backup
    the acquired Traccar.java file!) Don''t get confused by finding a file with more
    than thousand lines! The protobuf library is a complete software to transfer Java
    objects over the network. The generated file is dedicated to the proto file, which
    is built on top of the library. We will not go into the details and you can study
    everything you need to know on the Protobuf website. For our development we are
    only interested in looking at the member class


    ```

    public static final class Position

    extends com.google.protobuf.GeneratedMessageV3

    implements PositionDrillBuilder

    ```


    ```

    { public double getLatitude() { return latitude; }

    ```


    This class is the entity of the network model designed by Traccar''s org.traccar.model
    in the relational model. What we see is the position received from the network
    and it only has getters and no setters. Transforming the network to org.traccar.model.Position
    is as simple as¹:


    ```

    Traccar.Position protoPosition(Traccar.Position) message;

    org.traccar.model.entityPosition = new Position();

    ```


    ```

    entityPosition.setLatitude(protoPosition.getLatitude());

    ```


    First you cast the received message to a position object, then you can create
    a new Traccar position and assign every field that matches by design.

