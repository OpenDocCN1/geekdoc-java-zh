    # 18.6 DEVELOPMENT WITH ARQUILLIAN


    In the previous section we skipped the Maven step to test the application. Testing
    inside an AS environment has been a real pain for years until the JBoss community
    came to use the Arquillian test framework [56]. The idea of Arquillian is to deploy
    an isolated test project to an AS and ignore all of ‘official’ deployments.


    The application you have just generated and deployed uses @WebServlet, its endpoint.
    The test class listing reveals how to create a test jar and deploy. Then Arquillian
    takes over and sends a message to Camel''s ProducerTemplate to the route defined
    in jboss-camel-context.xml. Note that Arquillian requires an AS home variable
    to find the AS. You can choose from the Maven profiles ''remote'' for a running
    instance or ''managed'' to instruct Arquillian to start and stop the (test) server.


    If you are aware of test driven development then Arquillian is a powerful tool
    in which to start development. This makes the developer’s life much easier as
    he can focus on the one implementation he is working on instead of getting confused
    in a complex AS setting.


