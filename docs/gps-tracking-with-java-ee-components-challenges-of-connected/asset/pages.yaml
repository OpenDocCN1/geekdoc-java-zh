  md: '# APPENDIX C


    # Install JEETS Sources


    # CONTENTS


    +   C.1 Building the JEETS Repository 257

    C.2 Eclipse Source Import 258

    C.3 Protobuf Compiler 258

    C.4 ActiveMQ Installation and Tests 259


    JEETS components are bundled in a single GIT repository at github. To ensure their
    functionality and compatibility unit tests are implemented for every single component
    to ensure stand-alone usage. The built process will start with the independent
    components and add dependencies of higher level components. If you modify the
    sources you should make sure that all tests (starting with the modified module)
    return a green bar to maintain integrity.


    # C.1 BUILDING THE JEETS REPOSITORY


    Clone the Jeets repository to your PC:


    ```

    git clone https://github.com/kbeigl/jeets-git

    ```


    Change to your local Traccar directory (with pom.xml) and run Maven:


    ```

    mvn clean // validate Maven installation

    mvn compile // compile: java sources

    mvn test // tests without additional requirements

    mvn test -P... // tests with Postgres database and Traccar user

    mvn test -P... // tests with running ActiveMQ Service

    mvn test -P... // tests with running Wildfly Server

    mvn install // all of the above ???

    ```


    If all goes well Maven clean, compile, test and create a target folder for each
    artifact. External dependencies will be downloaded to your local repo upon first
    execution.


    With modern tooling you can implement anything in test cases. The JEETS repository
    should be perceived as a number of projects which can be tested stand alone. Other
    projects depending on the platonic modules can


    257'
  merge: -1
  pgno: 271
- img_proc: true
  md: 'run through other test setups. Therefore the repository is created in the order
    of low level Modules, like the Hibernate PU. Each module runs through basic tests,
    if you do not specify a Maven profile.


    # C.2 ECLIPSE SOURCE IMPORT


    You can import the complete JEETS repository into Eclipse. Anyhow it is more practical
    to build the JEETS repository from command line with Maven.

    After you have successfully compiled you could open Eclipse with a new workspace
    for the JEETS projects. Then you choose


    +   File > Import ...

    > Existing Projects

    > Root Directory \<pathTorepo.jets\>


    Now you see the complete JEETS structure and you can apply the checkboxes for
    the project you want to work with. Note that it is (sometimes mandatory) to use
    Maven on the command line if you are working with Eclipse! Eclipse m2e will retrieve
    the precompiled and installed projects from your local Maven repository in the
    .m2 folder.


    # C.3 PROTOBUF COMPILER


    The traccar.proto file is the reference file for the JEETS TCP protocol and should
    be re-fferted after each change. It resides in the folder


    ```

    ...repo.jets/jets-models/jets-protocols/protobuf

    ```


    From this file the Java class


    ```

    ...jets-protocols/src/main/java/org/jets/protocol/Traccar.java

    ```


    is generated with the protobuf compiler protoc. Then this Java file becomes part
    of the JEETS repository and developers compile against it.

    In order to understand this process you should practically go through the Proto
    Buffers Tutorial at


    ```

    developers.google.com/protocol-buffers/docs/javatutorial

    ```


    After you have concluded the tutorial you should create a backup of the original
    Traccar.java class. Then you can use the protoc compiler on the traccar.proto
    file to create the Traccar.java file.

    For your own protocols you should start out with a *.proto file and create message
    formats according to your system model.'
