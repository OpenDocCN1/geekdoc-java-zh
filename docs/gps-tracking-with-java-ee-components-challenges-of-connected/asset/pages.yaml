    formula for complex mapping with (dynamic) geozons. In order elately work with
    large geographic polygons we will introduce another small, yet useful and powerful
    library to execute complex calculations with a small geometric class model:


    # The Java Topology Suite - JTS [66]


    > The Java Topology Suite is a Java library for creating and manipulating vector
    geometry. It also provides a comprehensive set of geometry test cases, and the
    TestBuilder GUI application for working with and visualizing geometry and JTS
    functions.


