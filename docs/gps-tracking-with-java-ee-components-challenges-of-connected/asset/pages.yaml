  md: '# 262 Install GTFS Sources


    Veroeffentliche Stelle: Hamburger Verkehrsverbund GmbH

    Veroeffentlichungsdatum: 03.11.2017


    Der Hamburger Verkehrsverbund (HVV) stellt hier die Fahrplandaten des Verbundesgebiets
    monatlich im GTFS-Format zur Verfuegung.

    Die Daten enthalten Informationen zu Linien, Haltestellen,

    Fahrzeiten aus.


    Name: HVV_Rohdaten_GTFS_Fp1_20171103

    Format: ZIP (size: 25.6 MB 150 MB unzipped!)_n


    Please search for GTFS data in the city you know best or better the city you live
    in and load it to your PC.


    # D.3 GTFS INSTALLER


    Note that the instructions support you to load GTFS to Postgres / PostGIS. You
    should have the Traccar tracking system installed with Postgres, but if you have
    chosen a different DBMS the next steps are only guidelines that you need to modify
    for your system accordingly.

    in the downloaded dataset you find these basic tables, i.csv files:


    | agency.txt | stops.txt |

    | calendar.txt | shapes.txt transfers.txt |

    | calendar_dates.txt | stop_times.txt trips.txt |


    Like many other agencies the Hamburg dataset comes without fares and if you plan
    a scheduling service for public users you should ask for this additional data
    or for the REST API.


    With the dataset we will set up the production chain to import data into Postgres.
    Although there are many loading tools available in Java we have chosen to use
    the loader from [28] which is written in Python and makes a stable and maintained
    impression.


    # GTFS Database [29]


    > The gtfsdb project''s focus is making GTFS data available in a programmatic
    context for software developers. The need for the gtfsdb project comes from the
    fact that a lot of developers start out a GTFS-related effort by first building
    some amount of code to read GTFS data (whether that''s an in-memory loader, a
    database loader, etc...): GTFSDB can happily reduce the need for such drudgery,
    and give developers a starting point beyond the first step of dealing with GTFS
    in .csv file format.


    This standard tool also implies its ''raw'' data model which is sufficient'
  merge: -1
