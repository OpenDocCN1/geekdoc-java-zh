  md: '# 38 Data Modeling


    as the identifier. This is helpful when you evaluate different trackers with the
    same vehicle as it makes it easier to change the tracker type (in the prototyping
    phase) by simply changing the SIM. We will not use the SIM as identifier.


    Whatever you choose it is recommended to use some kind of ''official'' identifier
    instead of generating them in the database! In Traccar GTS the identifier can
    be any unique character string.


    # Validity


    Generally tracking systems should have something like a validation module to sort
    out positions invalid for the context of an application. For example when a car
    stops at a place with poor satellite visibility the position can instantly jump
    more than a kilometer before it finds a good constellation for a fix again. These
    positions can cause problems like jumping out of a geozone to trigger wrong entry
    and exit events. Therefore validation and plausability checks belong to a reliable
    client and server system.


    # Character Strings


    In general machine to communication does not require strings at all and architects
    should avoid them for device communication. The above mentioned deviceid for Traccar
    is an exception and provides the freedom to define your own id like MyAndroidResource.
    Strings are only for human readability. You should also be aware that it makes
    a difference what kind of characters you put in a string. You might successfully
    develop a network protocol with ASCII or Latin character string as a place holder.
    Later you run into problems on the restriction which also uses UTF-8 Strings.
    Before adding a string to your protocol you should think about alternatives using
    the IMEI as a number.


    Let''s look at two string fields in the Traccar position:


    # Address


    In Traccar this string field is ''reserved'' for reverse geocoding on the server
    side. A reverse geocoding service derives an (preconfigured) address from the
    lat and lon coordinates. As reverse geocoding can be an expensive process it is
    usually delegated to an isolated service. You can choose a reverse geocoder from
    a number of suppliers and pay for the service by the number of geodings per time.
    Or you can set up your own service which has the advantage to add your places
    like ''headquarters'', ''warehouse north'' etc which are familiar to all employees
    and drivers. Of course you could also fill this field on the client side to indicate
    checkpoint#3763. Anyway we will associate this field to the Traccar server and
    not use it on the client side.


    > 6From the Administrative Hierarchy of the Map'
