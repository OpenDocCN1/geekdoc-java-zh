    # 12.2 ENTERPRISE INTEGRATION PATTERNS


    Continuous integration (CI) aims at enterprise integration with term referring
    to many developers, different teams, wide or globally spread (proprietary) systems
    of large companies. For example most operating companies provide LDAP authorization
    servers to provide the identity of every single employee, customer and every visitor.
    This service can be used to open doors, to lock the personal workstation and so
    forth. Each authorization can be withdrawn with a single mouse click.


    With CI every software is built with credentials and then tested against the real
    enterprise LDAP mechanism. In other CI makes sure that the software not works
    in an isolated setup, but adheres to the software of other departments, can also
    be commercial products: Email, calendar synchronization, customer relations...
    any confidential software. This kind of integration has to various problems before
    it can be released. Network connections, file systems, databases have to be accessible
    in the process and are constantly changing.


    All of these challenges led to Enterprise Integration Patterns (EIPs) and you
    can find a great introduction at [30] which supplements the book by Gregor Hogpe
    and Bobby Wood [31]. We will not reproduce the content here. Instead we will apply
    one pattern at a time as we move on.


    The title of this book actually implies enterprise integration. Up to this section
    we have looked at some JEE components like Hibernate in order to create a JPA
    persistence unit specified by JEE for database interactions. The course of the
    book reflects software development techniques where these components become smaller
    and much more robust to operate in various environments.


    To demonstrate this development in practice we have chosen Traccar as a single
    monolithic software and to reassemble a tracking system with individual standardized
    components which can be used almost any tracking software you may have in mind.
    Or to provide ''connectors'' to feed existing systems with GPS information.


    +   1 Lightweight Directory Access Protocol'
