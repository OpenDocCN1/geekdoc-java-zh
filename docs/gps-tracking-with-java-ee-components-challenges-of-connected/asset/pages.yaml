    # 11.5 TRANSIT TERMINOLOGY


    A persistence unit is more than a technical construct, entities are the main actors
    of / in a system and highly support communication about the domain. i.e. We can
    look at the GTFS model with the common sense of the passenger, i.c. in his domain
    language:


    +   First of all transit services of an Agency are based on stops where passengers
    enter and exit transit vehicles. The city of Hamburg has about 24.000 stops and
    these stops form the base map for public transportation.


    +   A chain’s stops served by a single transit vehicle is specified as a route
    in GTFS [20]; A route is a group of trips that are displayed to riders as a single
    service. Another may be more familiar for a route is a line.


    +   Once a passenger has planned to travel from one stop to another he needs to
    determine or one route to connect these stops. And he has to decide when to depart
    from a stop in order to reach a destination in time. GTFS provides stop times
    for arrival and departure at each stop. Hamburg provides 1.4 million stop times
    per year of a travel? Stop times are related to a calendar and calendar scheduling
    the valid / included and invalid / excluded dates (weekend, holiday, special events,
    etc.).


    +   When boarding a vehicle the passenger is going on, a trip. Each route (spatial)
    offers a number of trips (temporal) and has a shape defined by (lat,lon) waypoints.


    GTFS gets fed can be described as: [27]


    > "A GTFS has one or more routes. Each route (route.txt) has or more trips (trips.txt).
    Each trip visits a series of stops (stops.txt) at specified times (stop_times.txt).
    Trips and stops only contain time of information; the calendar is used to determine
    on which days a given trip runs (calendar.txt and calendar_dates.txt)."


    # 11.6 TRANSIT FACTORY


