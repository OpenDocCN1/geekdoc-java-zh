    # 17.6.2 Message Transformation


    With these fundamental data formats you can start coding the device communication
    and Extract Transform and ETL modules completely independent. With Spring and
    Canuel you can make the DCS and ETL completely independent and run each one from
    the command line. By introducing a message queue you can decouple the modules
    and shut them down for maintenance in critical situations. This is very convenient
    for load balancing and scaling as you can run the modules on different machines.
    With modern deployment you could start additional modules at rush hours and shut
    down when the traffic decreases to make save power and costs.


    After designing ERM, ORM, message formats, DCS and ETL the message queue becomes
    the entry point to all tracking system. On the other hand handle the device communication
    element the core for tracking vehicles (or things!) After the system entities
    are sent to the message queue components can be programmed against the database
    and a Web developer could access the database without any knowledge of tracking
    technology. For safety reasons the database access can be modeled with a REST
    API without CRUD operations. This way you can ‘partition’ resources by skill sets.'
