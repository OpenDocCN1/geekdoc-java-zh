  md: '# 4 Introduction and Overview


    can be modified during the development and according to new requirements to an
    existing system.

    Since SDC development in the automotive industry is highly competitive and therefore
    taking place under non disclosure we will focus on applying Java technology to
    ensure GPS tracking systems. By providing live tracking information to Entity
    Java Beans (EJBs) a GTS developer can easily break the location of its GTS and
    combine it with other systems of the enterprise. Just imagine clicking on a truck
    on the map frontend to retrieve the actual truck load from the warehouse and other
    logistic systems.


    # 1.4 SKILLS / SKILL LEVEL


    This book does not introduce Java EE and you are expected to…


    ```

    install the JSE Tracer GTS

    install the Postgres database (with PostGIS)

    download / clone a GIT repository

    apply the build tool Maven (clean compile test install ...)

    install the application server Wildfly

    install ActiveMQ

    configure the ActiveMQ resource adapter for WildFly

    ```


    The book''s source code and sample appendix are available to the reader on the
    book''s website jeets.org. The book should be used as a hands-on instruction accompanying
    the source code. The reader is expected to download and compile the sources in
    a personal development environment. You can go through the appendix all at once
    to setup your environment or you will be asked to setup required software by single
    appendix as you read.


    # 1.5 THE AUTHOR


    The author is specialized on Geographic Data Processing and has worked for the
    automotive industry for more than a decade and witnessed the developments from
