    A tracker specifies a certain protocol for events triggered by sensors or internal
    states like the battery level. The actual GPS processor is usually the NMEA 103
    format which introduced for the very first GPS units around 1984. As we see some
    trackers providing a setting to transfer NMEA sentences in a (complicated) raw
