    # 2.3 JEE COMPONENTS


    This book''s title includes the vague and unofficial term ''Java EE Components''.

    What does this mean? What are they? So far we haven''t looked at any of the

    JEE specifications at all.


    The Standard Edition provides the core of every Java implementation.

    Nevertheless we have seen how much effort is needed to implement a DCS

    with java.net and java.10 packages. You would rely on these and

    handler classes with more than 6000 lines of (historic) code in an SDC scenario

    where a tiny bug might threaten lives?


    JEE certified application servers probably have the largest global programming-communities
    and the specifications keep all implementations compatible.

    On the other hand smart phones, web browsers, trackers and the Internet of Things

    have different requirements for network communication. Big data processing

