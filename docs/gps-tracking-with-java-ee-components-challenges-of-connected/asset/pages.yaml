  md: 'We will now look at the tk102 (or tk103 etc.) as it is human readable (see
    [5]). A typical String encoded by the tracker looks something like this:


    ```

    0023800858890B141129A2302.753207N23.2461E000

    .0092142349.381000000AL000000F1

    ```


    The server application receiving the message has to know the format in order to
    parse the first values of your application:


    ```

    002380085889 - trackerid / mobile number

    B001 - alarm event

    141129 - YMMDD date

    A - valid data / V - invalid data

    N - latitude = north, S = south

    2302.7532 - latitude, format ddmm. mmmm

    07232.2461 - longitude, format (d)ddmm.mmmm

    E - e = east, W = west

    000.0 - speed k/m

    09214 - UTC time HMMSS

    349.38 - altitude in meters (cm precision?)

    1000000A - bit representation of several events:

    power = on/off/external, ignition on/off, ...

    L00000FF - mileage

    ```


    We won''t go into details yet, it''s worth noting that lat, lon and time have
    the format of NMEA sentences and indicate that these values are propagated from
    the GPS output. Here is a Decoding Algorithm in a Java target format which should
    provide an impression of a Decoding Process:


    ```

    2302.7284 = latitude, format is ddmm. mmmm

    >>> N = north, S = south

    >>> (DD)dd + mm.mmmm. >>> 23 + 0.07284

    >>> 02.7284/60 = 0.04547333333333333

    >>> 0.04547333333333333 * 23 = 1.0458866666666667

    >>> This is the result will

    >>> Then multiply the result by -1 - if that the result is S

    >>> >>> 0.04547333333333333 * 23 = 1.0458866666666667

    ```


    This sample conversion of the altitude indicates processing time, which is again
    something we should not waste for the SDC scenario. It may seem picky, but we
    need a precise look at transferred data to identify the bottlenecks. Another transformation
    could be required to calculate the local time from the UTC time and geocoordinates.

    You should be aware of the altitude source. If altitude is important for your
    application you should not rely on the value supplied by the GPS unit! The height
    is determined from the satellites and highly depends on their constellation. Every
    time the GPS switches to other satellites the altitude increases or decreases
    depending on the geometry. The original NAVSTAR GPS from 1984 was simply made
    for this. If you need to rely on'
