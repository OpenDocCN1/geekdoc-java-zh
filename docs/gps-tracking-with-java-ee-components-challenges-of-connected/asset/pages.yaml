  md: '# Install WildFly with Camel


    You will find all the details at

    docs.jboss.org/author/display/WFLY/Getting+Started+Guide


    # E.2 INSTALL CAMEL SUBSYSTEM


    Please visit [57]:


    # The WildFly Camel User Guide


    "...provides Camel integration with the WildFly Application server.

    The WildFly-Camel subsystem allows you to add Camel Routes as part

    of the WildFly configuration. Routes can be deployed as part of JavaEE applications.
    JavaEE components can access the Core API and various Camel component APIs.

    Your Enterprise integration Solution can be architected as a combination of JavaEE
    and Camel functionality.


    Download the release for your WildFly version at

    github.com/wildfly-extras/wildfly-camel/releases


    which you can find in the WildFly compatibility matrix.

    For this we have used


    ```

    wildfly-camel-patch-5.1.0.tar.gz      294 MB

    ```


    to provide Camel-2.20.2 integration with WildFly-11.0.0 If you look at the

    content of the archive you can see part of the folder structure of the WildFly

    installation.


    +   1. Download WildFly-Camel

    2. Move archive to JBOSS_HOME

    Run bin/standalone (.sh.bat) -c standalone-camel.xml

    3. Go to JBOSS_HOME

    4. Login to the management console at localhost:9090 and

    look for the Camel subsystem in the configuration window

    5. If you have configured WildFly in your IDE make sure

    to apply the standalone-camel.xml file for launching.


    Now you are ready to deploy your first Camel component on WildFly!'
  merge: -1
  pgno: 280
- img_proc: true
  md: "# E.2.1 Wildfly-Camel Configuration File\n\nIf you already have a Wildfly instance\
    \ running for your existing system you should use your original standalone.xml\
    \ file and merge the Camel stuff into it. If you compare the original standalone.xml\
    \ file provided from the Wildfly installation to the standalone-camel.xml file\
    \ you can easily identify the few lines to add to your configuration. In a merge\
    \ view you can add the missing portions with some mouse clicks.\n\n# E.2.2 Hawtio\
    \ Web Console\n\nThe Hawtio Web console has been installed with the WildFly-Camel\
    \ System and you should be able to access it at localhost:8080/hawtio/ with the\
    \ WildFly application you have created earlier.\n\nIf you choose the JMX tag and\
    \ over the jboss.as as node you can activate look into the application server.\
    \ If you have installed everything described above you should be able to locate\
    \ the activemq-rar.rar and activemq-wildfly-5.7.war other components.\nLet's connect\
    \ to another Java route - the ActiveMQ installation. We were looked at the traversing\
    \ messages with the ActiveMQ frontend at localhost:8161. At localhost:8161/api/jolokia\
    \ you can retrieve server info via REST API. If not should you check your activemq.xml\
    \ file and set\n\n```\n<managementContext>\n  <managementContext createConnector=\"\
    true\"/>\n</managementContext>\n```\n\nTo make life easier you can use hawtio\
    \ to connect to ActiveMQ. Choose the 'connect' tab and enter the connection parameters:\n\
    \n```\nscheme: http\nhost: admin@localhost\nport: 8161\npath: api/jolokia\n```\n\
    \nNote that you can add user and password to the host URL. Press connect to server\
    \ to open a new browser tab and explore the ActiveMQ status.\nAs an alternative\
    \ setup you can embed ActiveMQ in WildFly and the component can be configured\
    \ to work with an embedded or external broker. For Wildfly / EAP configured managed\
    \ connection pools and XA-Transaction support, the ActiveMQ resource adapter can\
    \ be configured into the container configuration file. Wildfly resource adapters\
    \ subsystem is wired to the ActiveMQ adapter.\n\nNow you are ready to test your\
    \ first Camel route\nSection 18.5 'Wildfly-Camel Quickstart'"
