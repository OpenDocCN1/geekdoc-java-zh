  md: '# 58 ■ JEETS Persistence Unit/s


    some (OSGi) container. The PU provides all information to create a database, even
    in memory, instantly to be used by the environment, which might only exist for
    some dedicated steps.


    The readers not familiar with JPA can look at a pu.jar similar to a database driver
    like postgresql-9.2c41.jar. However the PU is including the semantics, the relational
    data model for our system. With this component we can develop JEETS components
    based on the Tracer model in conjunction with a database management system.


    For creating a network model we have used the protocol buffer technology to setup
    a (complex) protocol from the application''s entities and buffer it the software
    and network ready to stream it. The JPA specification is based on a similar intention.


    By providing entities for table (class) and row (object) the developer can freely
    create an entity with the keyword and assign the values to each member variable.
    In JPA the "buffer" is provided by an EntityManager which can be involved to synchronize
    entities with a persistence layer. Since we relate a database engine to an external
    hardisc database access can significantly slow down the performance. We will highlight
    some pitfalls and usage patterns in the Implementation phase of JEETS components.


    # 6.2 JPA PERSISTENCE ARCHITECTURE


    The Traccar GTS does not use a JPA implementation (javax.persistence packages).
    It applies the Standard Java java.sql package to compose SQL specifications, HikariCP
    [2] to manage the connection pool and liquidity [3] as a change management (and
    migration) for SQL databases.


    The Java Persistence Architecture (JPA) provides a higher level API than the classical
    JDBC approach as it can implicitly manage database synchronization with Object/Relational
    (ORM) Mapping. By providing a Persistence Unit (PU), which is literally a Java
    package with each class representation, you can focus on your Java code and leave
    the database specification to an entity manager.


    JPA is only a specification and in order to apply it it needs to be implemented.
    Similar to choosing Jetty as TCP framework, there are various popular JPA implementations
    freely available. The Glassfish community uses EclipseLink [4] which the JEETS
    JBoss Community and we use Hibernate [20] to create two persistence units for
    the same data model.


    Although we have not introduced JEE environment yet it makes sense to create a
    JPA entity while using the model generator. The project jeets-pu-traccar-jpa is
    versioned after the Traccar release. Thereafter the architect is prepared to point
    developers to the data model. If the company guidelines strictly insist on JEE
    specifications the JPA module should be used.


    In our analysis of relational modeling in Section 4.3 we have found Traccar''s
    Position entity with inheritance:'
