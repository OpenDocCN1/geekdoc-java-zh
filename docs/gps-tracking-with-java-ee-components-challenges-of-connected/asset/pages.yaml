  md: '# 5.3.1  Model Implications


    In the modeling process you should always be aware of the semantic implications.
    For vehicle tracking the battery level is marginal since the tracker is fed by
    the vehicle''s battery which is constantly loaded. When people with disabilities
    in ambient assisting frameworks the battery level can become vital^1


    A typical tracker depends on its internal energy system which dangerously defines
    the devices size. By rule of thumb a rechargeable battery with 1 Ah (or 1000 mAh)
    can track for about 10 hours highly depending on the person activities. The standard
    requirement is to cover one day and reload the device depending upon the person
    goes to bed. There is no way to determine the exact lifespan upon the number of
    connections, the satellite visibility etc. varying every day. Anyway the tracker
    – and not the tracking system – should report low battery event to raise a notification
    at the emergency center.


    If you think about our Device message in this context you can identify a dangerous
    pitfall. A low battery event is planned below 15 percent. The problem occurs if
    the battery power becomes too low to establish a GSM connection and prevents saying
    anything, not ever a low battery event.


    Therefore a low battery event should always be generated in the client that should
    be smart enough to detect the event at 17 percent even if the rule is ''below
    15%! In the described scenario the server could never trigger a low battery event
    by the rule of 5%. A thorough implementation should generate some warning anyway.


    Most modifications should be implemented thoroughly and associating the battery
    level to the device makes sense. The implementor of the software logic should
    make sure that the battery level of the device is updated for every new position
    added. Only then can you conclude that the battery level represents the value
    at the timestamp of the last position.


    If you are interested in observing the battery consumption in detail – move the
    battery field back to the position message. Modeling is programming and messages
    imply – system wide rules.'
