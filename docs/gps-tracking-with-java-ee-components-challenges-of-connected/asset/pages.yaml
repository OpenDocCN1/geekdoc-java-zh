  md: '50 ■ Object Relations


    # 5.6.1 Temporary ORM Extensions


    To wrap the protocol design we will describe how to add a network model extension
    for a dedicated project - without modifying the system''s data model.


    As mentioned earlier client software can constantly analyze the output of the
    GPS unit to improve the results to be transferred. As a GPS usually provides NMEA
    sentences as output, the client software can apply these sentences for the analysis.
    Now the client developer cannot simply rely on the delivered positions without
    validating the results on the server side. Therefore he decides to add the NMEA
    messages to the device message for his personal development environment without
    burden the colleagues programming the main application based on the system''s
    data model.


    The geozone example provided rough guidance on how to add related NMEA messages
    to the device. The client developer can implement a logic to evaluate the NMEA
    sentences and develop the client software on the server side which is much more
    convenient than doing an Over The Air (OTA) update over and over. Once the software
    is in good shape the server can remove the NMEA message without any side effects
    on the system.


    The network model and system data model should be well aligned at all times as
    they are not identical and can be modified for their respective environment, i.e.
    network model for networking only!


    # 5.6.2 Harmonic ORM Extensions


    Creating protobuf messages is simple and simpler if you already have a relational
    data model to work with. Similar to creating a persistence unit (in the next chapter)
    one could be tempted to create a protocol for the complete data model at once.
    This is not useful and can even be harmful.


    Recall that a tracker has to be registered before the tracking system will record
    its track. If you decide to develop the device message with every field available
    in the main model junior developer might pass these messages to the system and
    implement an automatic device registration initially for his purposes. The point
    is that you lose control of the systems integrity, if you don''t perceive the
    protocol as the key to the system. Otherwise you would lose the servers'' power
    to administer the system.


    Like the Tracer model you usually subdivide sets of tables for different situations:


    Administration - for people, devices, booking etc.


    Incoming Data - from client software


    Outgoing Data - for client software


    Map Data - for calculations etc.'
