    \ CDC scenarios require the use of GPS coordinates a precise pattern. For a simple\
    \ example 100 seconds or (speed dependent) precisely 50 meters. A sophisticated\
    \ client software can analyze the GPS unit's (internal) coordinates with DGPS\
    \ enhancement etc. to interpolate the parameters and retrieve the best possible\
    \ coordinate for a given time or place. Using an internal client 'database' the\
    \ coordinates can be buffered internally to balance the unreliability of the GSM\
    \ connectivity. Note that Traccar's position has timestamps fix, device- and finally\
    \ servertime to document the positions creation history.\n\nAn internal logic\
    \ code can deal with the buffered messages to send them when there is a good connection\
    \ and it can leverage the number of messages to send at one time. More than that\
    \ the client can traverse the buffered coordinates to align and optimize them\
    \ in some way. In any case a maximum number of bytes should be defined to prevent\
    \ blocking a server port for too long.\n\nMany classical trackers offer a bulk\
    \ message to transfer the internal database in one message. Besides implementing\
    \ additional message formats with new parsers this does not provide a control\
    \ mechanism for the total message size.\n\nWith buffers it is very simple to transfer\
    \ any number of positions by simply adding another message to the proto file:\n\
