  md: '# 14 ■ Message Exchange


    This is a pragmatic model to start an implementation and as we move on we''ll
    see how to transfer data back to the Self Driving Car via JEE services. Note that
    the ''tracking server'' is actually a Device communication Server (DCS). A DCS
    represents one single component of the tracking server and is coded to communicate
    with well known messages of the trackers Catalog.


    By looking only the TCP communication we can also cover the fact that indoor tracking
    is usually based on various technologies, since GPS is not available. Besides
    indoor tracking we should keep a new emerging industry in mind, the Internet of
    Things (IoT), Industry 4.0 and so on. In the we only need values for time, length
    and latitude for tracking.


    For indoor tracking the altitude is sometimes used in a different way. Abstractly
    speaking buildings have one or more floors with a constant altitude and the altitude
    might store the floor number, which is used to load its ground plan. Check out
    the Minneapolis Mall of America in Google maps to get an idea of map matched grounded
    planes.


    # 2.2.1 TCP with Standard Java


    Java was invented for the network- and Internet programming language and Java
    objects in communicate directly via TCP (or UDP) by design. Distributed systems,
    like the tracker and tracking server, need reliable communication. A Java server
    application can bind a socket to a specified port and exchange information via
    a point-to-point channel. During this session data can be exchanged in both directions.


    Some systems simply keep up the connection to a car as long as possible although
    most of the time the connection is idle and virtual. This model is naturally driven
    by the KMS provider fees. For an existing connection the provider charges the
    actual bytes being transferred every new connection requires additional data packets.
    It most expensive to transfer tracking message over a new connection with much
    overhead than the actual information.


    The Java developer does not have to deal with TCP layers when using the java.net
    package. While TCP is a generic protocol many customized protocols like http and
    ftp are implemented on top of TCP and specified by the port in the URL. Java class
    offer many methods to deal with these protocols to establish connections and exchange
    data. A simple position could be transmitted via HTTP encoding:


    ```

    http://host:5055/?id=401256&lat=49.158&lon=-12.864&timestamp=192412

    ```


    The other important class to know is the Socket. After establishing a client server
    connection each side communicates to a local socket which can be associated with
    an instance, a session or channel of the relevant software logic. Sockets provide
    the ability to establish and distinguish multiple client connections at the same
    time.'
