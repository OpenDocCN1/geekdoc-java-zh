  md: "# THE TRACCAR MODEL\n\nAs we are focusing on Traccar's Relational Data Model\
    \ we can use Traccar code and the database to identify all fields of the systems\
    \ ER- and OR model. One of the main entities for any tracking system is the Position:\n\
    \n```\npublic class Position CREATE TABLE public.positions\n{\n  id INTEGER NOT\
    \ DEFAULT nextval,\n  private double latitude double precision NOT NULL,\n  private\
    \ double longitude double precision NOT NULL,\n  private double altitude double\
    \ precision NOT NULL,\n  private Date deviceTime wo tz NOT NULL,\n```\n\nOne important\
    \ thing to note is the single position entity and the table for many positions.\
    \ While a database stores only number of records an entity always refers to a\
    \ single record (or row) represented in a single object. The listing also shows\
    \ the NOT constraints to prevent storing incomplete positions. Any constraints\
    \ can also be annotated in Java and we will look at the persistence model later.\
    \ Let's look at some fields and their implications.\n\n# ID\n\nThe ID in the database\
    \ table should be provided automatically by the database system (DBMS) with a\
    \ sequence generator to ensure relations via Primary Key. An ID provides distinct\
    \ identification of records (entities) which is vital to relate entities to each\
    \ other. On the other hand the client software should not supply ids and leave\
    \ it to the database engine to generate them as needed.\n\n# Device Time\n\nEarlier\
    \ it was stated that a message definition consists of keys with well defined (language\
    \ natural) data types. Nevertheless a Java Date object is nothing but a wrapper\
    \ for a long value and can be mapped.\n\n# Device ID\n\nThe device is a 'speaking'\
    \ identifier and 'belongs' to the device and should be provided by it. The IMEI¹\
    \ can be perceived as an identifier hardwired to the device. If the client software\
    \ accesses this number in a safe way and adds it to the protocol methods you can\
    \ rely on. And you gain implicit validations of the GSM network, since it uses\
    \ the IMEI to identify valid devices.\nSometimes there might also be a reason\
    \ to choose the SIM cards IMSI⁵\n\n⁴International Mobile Equipment Identity\n\
    ⁵International Mobile Subscriber Identity"
