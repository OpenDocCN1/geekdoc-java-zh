    The persistence unit is attached to the POM and the configuration for Spring,
    Camel and JPA resides in the file spring-camel-jpa.xml with the major components.


    ```

    <Bean id="ManagersDao" class="org.managers.ManagersDao" />

    <!-- -- access to EntityManagerFactory/EntityManager -->

