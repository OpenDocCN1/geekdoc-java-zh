- img_proc: true
  md: 'but for the longer term you shouldn''t include the yyyymmd date in the name
    and use the same name for subsequent deliveries. Since you usually request transit
    information for ''today'' the data will ''run out'' at a certain day and won''t
    return any information. Then you would need to go through the re/installation
    process again.


    Before starting the import you need to create the database in Postgres. This can
    easily be achieved with the PG admin tool. Then you must connect to the new database
    and enable PostGIS by entering the SQL command.


    ```

    CREATE EXTENSION postgis;

    ```


    Another thing you should know is that the import process consumes a lot of CPU
    power and RAM and it is best you should not work on the PC during the import.
    The above mentioned dataset with about 150 MBcompressed data takes about 30 minutes
    and up to 6 GB of RAM. The city of Hamburg has about 24.000 stops with about 1.4
    million stop times and 2.5 million shapes.


    Now you can launch the import (with geospatial processing) with the (single-)
    command line


    ```

    bin/gtfsdb-load --database_url postgresql@localhost:5432 --is_geospatial .\GTFS\HVV_Rohdaten_GTFS_Fpl_20171006.zip

    ```


    ...and you are ready to run the public transit factory described in Chapter 11.'
