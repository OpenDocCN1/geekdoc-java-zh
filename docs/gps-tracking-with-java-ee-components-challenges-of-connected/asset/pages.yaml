    Later we will look at tracker architectures to understand how NMEA plays an important
    role inside the controller to evaluate the GPS output and select high quality
    locations by taking accuracy, satellite constellation etc. into account. Tracker
    logic is responsible for selecting good events and formatting them into a tracker
    format.


    # 2.1.2 Message Type and ID


    Sending a message with a position and an event is the basis of tracking. Tracker
    protocols define different messages to submit event details. To set up a device
    communication software for a dedicated device you need to apply different encoder
    decoders and decoders repeatedly. For values for a key, i.e. latitude appears
    in different messages.


    Common device communication software is designed for various messages of a tracker
    protocol and have many switch .. case constructs in their code to switch to message
    types and field definitions. Many devices provide a header containing only message
    ID or place the Id as the first field in the message sentence. Many protocols
    use message ID with a $. As an example we''ll look at some NMEA sentence functions


    ```

    GLL - Geographic Latitude and Longitude:

    $GPLL, 4916.45,N,12311.12,W,225444,A,*1D


    GGA - essential fix data with 30 location and accuracy data:

    $PGGA,12359,4916.45,N,12311.12,W,1,0.9,545.4,M,46.9,M,*47

    ```


    to find the messages $GPLL and $PGGA share some fields.'
