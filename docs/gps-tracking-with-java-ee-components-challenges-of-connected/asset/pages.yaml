    Modern Java development should begin with component composition with a build tool.
    Developers need to research for the latest components of their problem domain.
    In other words try to avoid technical implementations and focus on the business
    logic. The build tool takes care of resolving dependency conflicts with duplicate
    embedded subcomponents.


    As we could see GTS is based on standard Java with lengthy code and we will see
    how to drastically reduce the code by using the JEE component Netty.


    # 2.3.1 The Netty Framework


    So far we have created a simple tracker to send a message string with only a few
    lines of Standard Java. As long as you need to send a GPS position to a server
    there is nothing wrong with this approach, no extra jar needed to blow up your
    application scene.


    Things get more complicated on the server side.


    Every tracking hardware has its limits in the number of bytes per second and per
    port. For an SDC scenario technical limits have to be estimated and calculated
    down to a number of messages per second.


    Imagine a scenario where a dedicated server application is responsible for analyzing
    a traffic flow. More generally speaking a ''traffic node'' should refer to a place
    with problematic traffic flow. The worst times, anyone knows, are the rush hours.
    You can find out detailed traffic information for different days, daytimes, seasons
    in the Internet or check Google Traffic for conditions in your town. With dedicated
    knowledge of the inner city and live data a box can be dynamically defined for
    a traffic node according to the hardware capacities.


    With figures like these you can calculate the number of ports to use for a bound
    box or you adjust the bound box to the number of messages per port. How much buffer
    does your hard- and software have to deal with high traffic? The scaling process
    can become very dynamic with live big data.


    > Search for ''traffic mathematics'' to begin calculating capacities, delays etc.'
