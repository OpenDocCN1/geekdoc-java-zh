    to their importance as (light weight!) entities for a complete system. The application
    server represents the runtime environment for many different framework components
    — to spare the developer from setup and configuration work.


    Spring Boot is a new concept to configure and run applications without an AS.
    These concepts have been applied much earlier in other languages — due to the
    lack of an AS. Spring Boot provides pre-configured technologies to reduce configuration
    — like an AS, only more dedicated to the deployed application. With Spring you
    can quickly get your application running with very little code and out of the
    box frameworks.


    A very important aspect of modern development is the need for innovation and adaptation.
    With the Spring framework you can form functionalities required for new applications
    quickly up by the community. Therefore Spring can be seen as a lively Sandbox
    for experiments with new challenges. When the new approaches are accepted, become
    successful and productive, they will probably be developed in JEE sooner or later.
    Some say CDI was invented in Spring IoC.


    Confused? If you prefer Spring for flexibility of design, while you should use
    an AS to ensure official standards. If you have legacy applications don''t worry,
    JEE is alive and application servers are extremely convenient (for prototyping).
    Spring is one technique to extract code from an AS and stand alone. WildFly Swarm
    is a technique somewhere in between and closer to AS and user jars are closer
    to Spring etc.


    If you look back at the JEETS components, you can easily identify the business
