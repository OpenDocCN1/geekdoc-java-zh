  md: '# 244 ■ The JEE EAR Application Scenario


    # 19.2.4 Jee Server Application Scenario


    Since there is no consumer running the messages should not be dequeued.

    Now we are ready to finally start the consumer, being our JEE server application.
    Start WildFly and check startup log with installed JEE Ears compiled from .../jets-server-jee/jets-jee-app
    as described on page 241:


    ```

    Camel CDI starting Context [camel-activemq-context]

    Apache Camel 2.2.0 (CamelContext: camel-activemq-context) is starting

    Camel starting object [camel-activemq-context]

    Bound camel naming object: /context/camel-activemq-context

    Successfully connected to tcp://localhost:61616

    Route: started and consuming from: activemq://queue.hv.in

    Total routes, which are started

    Apache 2.2.0 (CamelContext: camel-activemq-context)

    started in 11.200 seconds

    ```


    You can see that Camel is starting the [camel-activemq-context] CDI. Now we have
    to look in the /web subproject to find the Route Builder class:


    ```

    @ApplicationScoped

    @Context("camel-activemq-context")

    public class ActiveMQRouteBuilder extends RouteBuilder {

    ```


    This is the entry EAR construct and directs the devices to the ApplicationBean
    EJB with our prepared method processMessage:


    ```

    from("activemq://queue.hv.in")

    .to("ejb:java:global/jee-jee-app/jets-jee-ejb/

    ApplicationBean?method=processMessage\*")

    ```


    As you can see Camel routes from the external activemq: to the WildFly internal
    ejb: route. Now we have to add some log statements before, and after the method
    invocation to observe the processing:


    ```

    [route2] Camel (camel-activemq-context) thread #3 - JnsConsumer([hv.in])

    message: Device(id=0, ...) to application bean

    application: process message from ''pb.device''

    Send message Device(id=0, ...) to another bean

    ```


    ...and we''re done! From here we can hook up to your existing JEE application
    with the major actors being the EJBs accessed by CDI Controllers visualized with
    JSF.


    Now you can hook up your application''s beans and controllers. If you have a busy
    developer team working on your enterprise''s core application you might not want
    to bother them with Camel and can use the device messages inside their Plain Java
    code and whatever they want.


    If you don''t have a JEE application we will go through a general purpose application
    in pseudo code in the next section.'
