  md: '# 8 Message Exchange


    event: The cause of sending this GPS coordinate

    Tracking information, i.e. events should always be tagged with a coordinate

    GPS(lat,lon,alt,time) to describe what has happened where and for.

    time the event stands for (sensor) information to be transferred

    describing the meaning or cause of a transmission. The submitted fields are

    transformed into Plain Old Java Objects (POJO) to become entities of

    tr system. See Figure 2.1.


    Let''s look at four fundamental GPS fields to gain an understanding

    of different formats and how much space, i.e. bits, they require. As Java

    developers want to handle the submitted values defined by Java primitives

    types as the server target format. Although a 32-bit representation

    is could be sufficient and they are commonly used as 64-bit

    double primitives. A vital question in a tracking context is how to transfer

    the GPS data over the network with a minimum number of bits without losing

    precision?


    For the ease of many trackers transfer information in a human readable

    format (ASCII csv) format:


    ```

    keys            time           lon      lat      alt

    values...      ...170312123644,120589,490234,0...

    formats         YYYMDDDHMMSS ddmmmmm

    29 bytes        ----------------

    ```


    The first field represents a time stamped by lat and lon represented

    as digits and finally the altitude relative to sea level. This is useful for dis-

    play purposes or to send tracking messages via SMS and many other human

    interactions. For an SDC scenario this format is a disaster.


    ![](img/ed3f7c259b164cd908f21a323b5bc23e_22_0.png)


    Figure 2.1 The server transforms the messages into related related POJOs. GPS

    and events can be modeled in one or more system entities. Their relation-

    tion can be modeled as 1:1 or 1:n as needed.'
