  md: '# Preface


    The times of proprietary products dominating the software industry are over. Today
    more than 80% of all software applications are compiled of open source components
    and with the combination of Java and Open Source Software (OSS) alone there is
    practically nothing you can not program. The Apache Maven Build Tool has emerged
    to an automated Source Object Model from scratch and begin to implement code the
    overall project manager. The architect of a new application is in challenge of
    composing the overall Project Object (POM). Once the project is defined each developer
    can create the software with his domain knowledge.


    Maven Central is hosting millions of artifacts and serving tens of millions downloads
    per week, tens of billion per year, with growing demand. A Maven Server can be
    easily set up to support distributed software development for your team. Maven
    is automation of development, integration, testing, documentation and deployment.
    The infinite number of Java OSS Components is the modern challenge for software
    architects to compose an application.


    Choosing the right OSS components already is a challenge and this book will demonstrate
    how to select Java and Java EE Components and compose the technical framework
    for your application before you start business code. Our business domain is GPS
    Tracking and we will see how create individual components for a GPS Tracking System
    (GTS) and put them together to a running system. This process of picking JEETS
    components and adding GTS features can be expressed in the pseudo equation


    ```

    JEETS + GTS = JEETS

    ```


    where JEETS is pronounced like G.T.S., i.e. JEE T.S.


    The book''s index provides an overview over JEE and JEETS components.

    Instead of a Bibliography the book provides a ''Recommended Readings'' Section
    of freely available Internet sources to be used while you are reading the JEETS
    code. In the recommended readings you can find book recommendations to explore
    each component in full depth - after you have gone through the book for a complete
    picture.'
  merge: -1
  pgno: 13
- img_proc: true
  md: '# ■ Preface


    Instead of creating an application from scratch, which exceeds the limit and purpose
    of a book, we will work with the Open Source Tracking System Traccar. Traccar
    is a popular Java GTS that you can install out of the box and start tracking with
    your smartphone immediately. Traccar is a proven product, maintained very well
    and upgraded frequently by Anton Tanaevev. Once Traccar is up and running we will
    take it as the running production system and put ourselves in the position to
    customize and replace GTS functionalities with new modules. This architecture
    is a realistic situation for most professional developers.


    We will analyze the Traccar GTS architecture to identify components like Device
    Communication Servers (DCS) and then create a JEE component that can run alone
    or be embedded inside a JEE Application Server. With this approach you will learn
    how to decompose a monolithic application into independent modules and then apply
    integration technologies to put the pieces together with explicit endpoints to
    run as one system.


    At the end of the book we will have created a Maven Repository with all JEE components
    that you can use as seed components. Hopefully we will meet at least creating
    tests and improve the JEE components according to your requirements. You will
    be able to create your own Java components and combine them to a new application
    or with your running production system. You should also become aware of the paradigm
    shift from large JEE application to micro services that can be scaled individually.
    You will be able to create an Enterprise Application running on an AS or you can
    create many components and assemble them to one server backend application or
    both.


    The Self Driving Car (SDC) is the latest global challenge of steering a real car
    with software. You could not navigate a car through a city without information
    about the traffic, situation. GPS Tracking has to be taken to a higher level to
    be able to track many cars at the same time and provide the aggregated traffic
    situation to each car. This constellation is referred to as Connected Car Technology
    and we will look at the impact on classical tracking systems.'
  merge: -1
  pgno: 14
- img_proc: true
