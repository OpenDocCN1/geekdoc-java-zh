    <Bean id="entityManagerFactory" class="org.jpa.persistence.LocalEntityManagerBean">

    <property name="persistenceUnitName" value="jeets-pu-traccar-jpa" />

    </bean>

    ```


    Figure 17.1 provides an overview for the handler component. The Java consumer
    can be configured for any producer and can optionally send messages to other consumers,
    i.e. recipients. Internally the handler router is supported by the manager DAO
    which is coded with a single entity manager.


    Developers used to programming JDBC with SQL statements should spend some time
    at vital design patterns in order to profit from JPA. When designing one DAO you
    should always keep its semantics in mind. In our case the incoming message is
    synchronized with the database to check whether the device ID is registered. If
    the device is the DAO returns the device message from the database. Then the programmer
    has two device messages to work with; one incoming message and one retrieved from
