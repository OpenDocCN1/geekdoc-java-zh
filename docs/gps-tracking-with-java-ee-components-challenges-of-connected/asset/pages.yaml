    # 5.4 ORM and ERM


    We have seen how to model relational messages with protobufs. Now what exactly
    is an Object Relation Model (ORM) and how does it relate to an Entity Relation
    Model (ERM)? Trying to look up it can become even more confusing and the terms
    are applied differently in various contexts. Let''s not rely on theoretical differentiation
    and rather look at the practical implications.


    If you are familiar with the Unified Modeling Language (UML) you are aware of
    the difference between a class model and an object model. Objects are created,
    instantiated after the blueprint of a class definition. In database models, often
    precisely referred as ERM, a table (~ class) defines the valid content with types
    where each row (~ object) holds a concrete - semantic entity of the system domain.


    The single string message was introduced on page 10 as an example of one protocol
    sentence with a defined number of fields. The message size allows estimates about
    the maximum server performance to determine the ports needed for a certain scenario.
    The protobuf device message is relational and the maximum size is not fixed.


    In our context we will relate one device message to one ORM. The point is that
    message definition, similar to a class, does not define how many positions are
    attached to the device. One device message including five position messages adds
    up to six instantiated objects, i.e. messages with individual values. This message
    represents one distinct ORM with size concrete objects (see Figure 5.1).


    Later we will create a Persistence Unit (PU) to represent the complete model with
    Java classes. Then the device message being ORM will be transformed into one device
    entity with five relation entities. This new ORM based on the PU can be passed
    to any application which can easily'
