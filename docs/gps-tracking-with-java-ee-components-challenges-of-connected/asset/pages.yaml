  md: "# 19.3 APPLICATION SCENARIOS\n\nWith the JEETS repository you have a tool to\
    \ create a GTS or a 'Real World Live Application' from JEETS components. The GTFS\
    \ factory is a great helper to get started very fast. You can simulate traffic\
    \ with trains, ferries and buses in a single city. As an example you could create\
    \ a scenario from the Hamburg's GTFS data as described in chapter 11. In section\
    \ 19.2 we use my-jeets-client to simulate two subways U1 in opposite directions.\
    \ You can easily raise the traffic driving in your-jeets-client along your development\
    \ time to simulate a hundred buses all over the city.\n\nBy starting out with\
    \ two subways you already develop a robustness by triggering each incoming message\
    \ against all participating vehicles. As soon as the subways are within a distance\
    \ of 100 meters they are informed by the information controller, they are encouraged\
    \ to talk to each other and can exchange information. Inside the software vehicles\
    \ can be provided with some connection to each other to simulate external sensors\
    \ inside the vehicle.\n\nWe should keep the big picture of driving cars in mind,\
    \ which requires much more than GTS tracking. Besides developing software to each\
    \ car is developed to deal with the incoming information and actually derive the\
    \ decision for the next manager.\n\nThe client being vehicle in real traffic can\
    \ also be modeled and act inside the scenario server. These vehicles can be modeled\
    \ as an abstract vehicle class and carried by a Car or a Bus etc. In the JEE environment\
    \ we can create a stateful bean for each vehicle for the application time (or\
    \ whatever fits your needs).\n\n# 19.3.1 Camel Routing\n\nIn the applications\
    \ Camel route you parse the vehicle's unique ID and direct it to a stable EJB.\
    \ If the vehicle's EJB already exists is instantly instantiated, it will not be\
    \ created. A ScenarioController handles a collection of participating vehicles\
    \ that can be continuously traversed to determine distances etc. This pseudo code\
    \ executes the idea:\n\n```\nfrom(\"activemq:queue?hv.im\")\n.to(\"modified:ApplicationBean?method=processMessage\"\
    ) // i.e. VehicleController\n\nlog(\"Send(modified) message \" + body + \" to\
    \ another bean\");\n// isRegistered? DB loop!\nchoice(\n\t.when(vehicle == 'Bus')\n\
    \t\tteto(bus)\n\t\twhen(vehicle == \"AH24:233\")\n\t\tteto(Vehicle implementation\
    \ Bean ! with environment sensors)\n\t...\n\t.otherwise(\n\t\tlog(unknown vehicle\
    \ - create one?);\n```"
