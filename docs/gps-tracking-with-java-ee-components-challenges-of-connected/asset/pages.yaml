  md: '# 19.2.2 Client Hardware


    Of course you can also enrich the scenario with real tracking, choose your protocol
    from more than 100 Traccar protocols and adjust your port to accept messages from
    to server side.


    # 19.2.3 JSE Server Middleware


    We have learned that the layer between client and server is called middleware
    and mediates between the processing cores. Here we have prepared the JEETS components
    jeets-dcs, jeets-dcs-et1 and jeets-dcs-amq.


    The most simple case is to apply the jeets-dcs-amq and direct the messages from
    port to message queue, which can be buffered until a consumer picks them up.


    You might also choose to apply a GeoHashRoute from the jeets-geo-router along
    the path to filter messages for the Hamburg or your cities area. From performance
    perspective you should keep in mind that Java objects are serialized and deserialized
    when traveling from one JVM to another. On the other hand the convenience of adding
    and removing logical steps along the route outweighs these milliseconds.


    ```

    Launch the message broker

    .../apache-activemq-5.15.0/bin/activemq start

    Launch DCS to MQ:

    java -jar jeets-dcs-amq-0.1-jar-with-dependencies.jar

    Check output:

    Betty consumer bound to:localhost:5200

    route started and consuming from: tcp://localhost:5200

    If the client server is not running, start it now.

    Check client output:

    ''pb.device'' sending 1 Positions to ''localhost:5200'' ...

    Check DCS to MQ output:

    [Camel Thread2 - NettyServerTCPWorker]

    INFO route - device from Netty: uniqueid "pb.device"

    Check frontend localhost:8161/admin/queues.jsp

    for enqueued messages.

    ```'
