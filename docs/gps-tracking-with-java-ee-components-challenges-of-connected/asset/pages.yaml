    D.1 Disclaimer

    nPlease note that GTFS data is publicly available for download. This does not
    imply that you can do with whatever you choose! If you plan to publish a website
    with GTFS data you should carefully study the legal issues and maybe even get
    in touch with the agency providing the data. Once you are in contact with the
    agency you might even get access to their REST API providing vehicle information!

    For testing and development of JEE components you can download any GTFS dataset
    and create traffic on your development PC.


    # D.2 Finding your GTFS Dataset


    With GTFS has provided a global specification for public transit schedules and
    with a great number of applications have emerged. For our purposes we don''t want
    to get lost in the world of GTFS and go straight to creating a GTFS database with
    Postgres and very important – with PostGIS for geographical indices.

    The JEE code for the transit factory was developed with real GTFS data for the
    city of Hamburg in Germany. Due to the standard format the code should also work
    for your City and it is worth to search for its dataset. Just by searching for
    ''GTFS'' you will find many overview sites linking to the actual sources for a
    city.

    Hamburg, like more and more cities, is providing a ''Transparency Portal'' with
    a large number of ''open data'' sets including GTFS. At transparency.hamburg.de
    you simply search for ''GTFS'' to find something like'
