    limitations, which were designed to provide a complete JEE implementation. For
    smaller processes this turned out to be a massive overhead. The Spring framework
    you can define independent Java objects and services and wire them together.


    If you look at the Spring Quickstart (64) you will find an introductory example
    of a MessageService and a MessagePrinter. If you would create a MessagePrinter
    as a member of a MessageService, the service would be allocated for the complete
    time of printing. Imagine you would call the service to print a very long report
    and call the service again while the report is still being printed. Since this
    allocation is a waste of performance and time, the idea is to decouple the objects
    and create new instances when needed. And inject a new MessagePrinter() to print
    another parallel to the first.


