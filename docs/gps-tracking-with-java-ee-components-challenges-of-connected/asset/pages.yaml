  md: '# 84 ■ The JEETS Tracker


    ![](img/ed3f7c259b164cd908f21a323b5bc23e_98_0.png)


    Figure 8.1 A tracking hardware combines GPS- and GSM unit on a Controller Board.
    The Controller evaluates sensor data to create event messages in the protocol
    format. NMEA data is constantly validated to provide the best position available.
    The messages can be sent whenever appropriate.


    does not imply a GPS- and/or GSM unit. A tracker can be built for indoor tracking
    and communicate with different technologies than GNSS and GSM (like Bluetooth,
    WLAN and many more). In the end every tracker should be able to send Coordinates,
    preferably WGS84 latitude and length, which the Server can use to locate the device.


    Many trackers need to operate without external energy source and are designed
    to track people and assets. GPS and GSM are soldered on a single board with a
    controller logic responsible to make optimal use of the processors. The size of
    the tracker is defined by the circuit board''s area plus the weight of the accumulator
    or battery. A rechargeable battery with 1 Ah has the size of a matchbox.


    GPS (or GNSS) receiver from GSM transmitter hardware modules operate ''out of
    the box'' and with the GSM you gain a (personalized) SIM card and a phone number.
    The tracker vendor is adding a Controller to combine the modules operations for
    used cases. To face the main concern of energy management and consumption these
    trackers have sensors for motion (or acceleration to detect a falling device)
    to turn off the modules when rest is to detect indoor locations by evaluating
    the number and constellation of satellites, GPS signal strengths and triangulation
    etc. – turn the GPS processor for all.


    We are mostly interested in Vehicle trackers where Power management is not a real
    issue (while driving). The main difference is the connection to the Car''s Data
