  md: "# Object Relations\n\nimplicitly be used to send a single Position – wrapped\
    \ in a collection as a tiny overhead.\n we agree to use the Positions protocol\
    \ instead of Position we can already spot the next opportunity to reduce the size.\
    \ Every Position from a single device holds the same deviceId we can reformat\
    \ the message to:\n\n```\nmessage Positions {\nint32 deviceId = 1;\nrepeated Position\
    \ position = 2;\n}\n```\n\nand remove the deviceId from the single position message.\
    \ In other words the repeated keyword is used to create collections of messages\
    \ – without using explicit IDs. And it can be used as a buffer to collect positions\
    \ on the client side before it is converted into the network format for streaming\
    \ with a single method call.\n\n# 5.3 OBJECT RELATIONS\n\nWe are still in the\
    \ process of relational data modeling by Traccar’s data model. The initial ideas\
    \ leading to oriented software development were driven by language analysis. A\
    \ noun was modeled into an object and objects are related by verbs, i.e. methods\
    \ [19]. When we go back to the Traccar model we can find the relation to device\
    \ to position. Positions are always created by a device. We can rename the Positions\
    \ message to a Device message:\n\n```\nmessage Device {\nint32 deviceId = 1;\n\
    repeated Position position = 2;\n}\n```\n\nto model the 1:n relation of one device\
    \ to many position entities. Again this is more than simply changing the name\
    \ of the message and opens new modeling options.\n\nOne of the commonly used sensor\
    \ data is the devices battery level and is part of protocol messages. With protobufers\
    \ we could relate this piece of sensor data to the device:\n\n```\nmessage Device\
    \ {\nint32 deviceId = 1;\nrepeated Position position = 2;\nint32 batteryLevel\
    \ = 3;\n}\n```\n\nwhich adheres to common sense as a position does not have a\
    \ battery level. With protobufers this modification can be applied for an existing\
    \ software since we have added the new field at the end without modifying the\
    \ existing order. Previous implementations (out in the field) are still working\
    \ without aware of the battery level!"
