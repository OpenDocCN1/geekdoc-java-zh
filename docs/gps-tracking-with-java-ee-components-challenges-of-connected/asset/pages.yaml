    # 2.1 GPS TRACKING WITH JAVA EE


    Vehicle and fleet tracking has become a large industry over the last decade and
    the market offers innumerable trackers for different appliances. With the smartphone
    new tracker type was introduced as a multipurpose well-performing Client computer
    with full connectivity to any sensor.


    On the Server different GPS Tracking Systems (GTS) have evolved to track, people,
    assets, vehicles a vehicle-tracking system can be used to observe a fleet and
    locate vehicles on a map in a browser frontend. The system can raise individual
    events to improve logistics, monitor fuel consumption, create travel reports.
    A transport company doesn''t persist in the market today without a GTS and the
    software industry provides full fledged solutions to run a business.


    Since the automotive industry has recognized tracking technologies as the live
    data source architecture to activate direct cars through a complex environment
    the classical GTS architecture considers new aspects. This book analyzes how the
    challenges of the Self Driving Car (SDC) exceed the limits of a classical GTS
    Tracking System. For a thorough analysis the widely accepted and well designed
    Open Source Tracer GTS [1] is reverse engineered in detail to dissect major GTS
    constituents. Traccar is a monolithic application in Standard Java (JDK) running
    in a single JVM and we will re/model individual components to produce reusable
    Java EE,i.c. JEE Modules.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# 1.1 Introduction and Overview


    The readers can witness the prototyping and modeling process and modify their
    own software. This book can help you to set up your tracking system by customizing
    the components. Every component is introduced in detail and includes a number
    of design decisions for development. The modules are combined into a customizable
    GTS - the JEE Tracking System JEETS . And they can be used as components to enrich
    existing systems including Java middleware and JEE application servers with live
    tracking. JEETS is a toolbox of GTS components crunching on a bare bone level
    that you can also use in connection with Tracer.


    # 1.2 THE CHALLENGE OF THE SELF DRIVING CAR


    Navigation systems and digital maps have become extremely precise to localize
    a vehicle on a digital map with GPS coordinates. It was only a matter of time
    before tracking and mapping will be merged to guide the vehicle towards a Self
    Driving Car (SDC). This is currently changing the automotive industry from programming
    embedded software to hosting services and data crunching in real time with Big
    Data. The Internet has grown rapidly to be now prepared to assist cars, sometimes
    within seconds, as they move.


    The main goal in development of a self driving is to provide a calculated route
    and actually control the car to follow. At the first impression the SDC seems
    like a logical continuation of automotive developments. Existing intelligent Parking
    Assist Systems are noteworthy, since they actually take complete control over
    the car for a complex maneuver: heavy steering, driving forward and backward with
    high precision without human interaction. This book will not explore the internal
    control of a vehicle but rather focuses on client services and providing useful
    information for.


    So the SDC not a revolutionary? Is it a normal evolution of technology? It is
    much more. The challenge is the coordination of moving cars and the prediction
    of coincidences that could trigger events for cars approaching each other and
    avoids.


    The main difference of the SDC to a classical GTS is that the latter only processes
    the tracking information of a single device. In the SDC systems need to evaluate
    values of different vehicles and provide fast feedback to each vehicle as it moves.
    The system has to evaluate and classify each vehicle message before comparing
    and aggregating different vehicles and finally supplying conclusions to each vehicle.


    This SDC challenge requires a remodeling of a GTS to more in-dependent components.
    We will combine these components on a higher level to form individual use cases
    which can be processed in parallel. In order to achieve the JEETS will be modeled
    following some major guidelines:'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'Intended Audience ■ 3


    Don''t look into the past.


    A classical GTS usually makes frequent use of database lookups to determine the
    vehicle was previous to the submitted position.


    Don''t speculate on the future.


    Some GTS keep up a connection dialog to wait for incoming events.


    Don''t wait for external resources.


    The response time of an external resource is generally unpredictable. An external
    database represents a hardware resource and can easily become the main bottleneck
    of the complete system.


    # 1.3 INTENDED AUDIENCE


    Another main topic of this book is the reflection of JEE technology itself. Containers
    have diminished and can be created on the fly to create a single method – and
    then be dropped. ...JEE technology is slowly moving away application servers to
    smaller independent Java (EE) components which are combined to a system. Many
    of these components will be introduced and applied for the creation of standalone
    JEE components.


    In Java we usually speak of the architect and developer roles, which does not
    reflect the modern software component completely. The build tool and sophisticated
    frameworks have become a core part of the development process. The Java EE platform
    is ''only'' a higher level specification of many globally accepted API specifications
    relate to each other, to the Java world and the network. Before actually starting
    an implementation the architect has to work as a software computer to create the
    build environment. All JEE client-server modules developed in this book can be
    found in the GIT repository and can be compiled, tested, installed with Maven.


    One typical problem to upgrade a standard Java to a Java EE is the direct connection
    to the hardware. Tracking messages arrive at the ports of a computer, a hardware.
    On the other hand the JEE runtime environment, the application server is designed
    for inversion of control (IoC) and the business logic should not include any code
    to interact with server, not operating system. Otherwise scalability over different
    machines will not!


    Therefore this book can also help Java developers not only interested in GPS tracking,
    but in modern software design from many individual modules. The complete system
    design is described bottom up beginning with the creation of data formats. The
    reader should be able to see the fundamental importance of a persistence unit
    and a compatible network data format for data transmission, which actually pre/define
    the system and dictate each component''s design. Since it is merely impossible
    to completely define formats before creating a system we will describe how to
    create formats,'
  merge: -1
