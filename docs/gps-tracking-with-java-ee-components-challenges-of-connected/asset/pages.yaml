  md: '# 186 ■ JSE Tracking Components


    In this chapter we will outline the creation of your own dedicated tracking system
    by combining the technologies we have looked at. After that we will leave Traccar
    behind and head toward JEE technologies to find out how to inject live data into
    an application server.


    # 17.1 FROM PIPELINE TO ROUTES


    Working against a production system is the typical development situation. The
    production system has to be up and 24/7 to serve customers and generate income
    and should never be replaced by a new system ad hoc. The new system should either
    evolve from the proven production system and replace each module in small steps,
    continuously. By creating components compatible with the running system business
    cases can be addressed while reliable components are in place until resources
    are available to redesign them for more modern requirements. This approach mitigates
    the CTO risk of approving a new (isolated) project with resources (the production
    team) and supplies interfaces for a new implementation.


    With respect to the Traccar system there is no need to rewrite the administration
    of devices, people and groups. Reporting is allowed on the persisted data and
