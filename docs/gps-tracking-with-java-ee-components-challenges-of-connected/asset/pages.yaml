    via IP just like a database service. ActiveMQ is Camel''s big brother you can
    theoretically do anything (and more) with ActiveMQ that you can do with Camel,
    only that Camel is descriptive and does not add any technology or persistence.
    Camel is not considered to be a middleware itself as it is most concerned with
    leveraging thirdparty software. We have introduced the world of messaging from
