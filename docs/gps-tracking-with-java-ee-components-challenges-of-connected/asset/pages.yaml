    we are heading - server software and system model.

    We have modelled data formats for the JEE tracking software to be created. By
    doing so we define every piece of data entering the ''system''. On the other hand
    it is impossible to foresee every detail that we might run into the software will
    be created and organically grow. This dilemma has always been there: software
    is alive! Once you have reached the end you can start resuming from the beginning...
    therefore soft software is developed in cycles. We have picked the driving car
    as the project changing the world as we know it and challenging the software development.


    Continuous integration, -development and -delivery create an automated server
    release chain to propagate every little directly to the production system. Specific
    CDC scenarios are dealing with human lives and already know that we can design
    the perfect system - on paper.

    We will use a repository for the ongoing JEE developed to host all independent
    JEE Components. After every change we can run mvn clean install to compile the
    sources in order of rising dependencies, run tests for every single component
    including the more complex Components relying on previously compiled components.
    Later can then add integration tests to simulate client server exchanges, etc.
    Maven is responsible for retrieving the JEE components defined in the project
    object models. The complete JEETS software is living in a single repository, which
