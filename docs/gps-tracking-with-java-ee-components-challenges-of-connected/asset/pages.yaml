  md: 'So far we have gone through the concepts of message exchange and device communication
    with well defined protocols in conjunction with the system''s relational data
    model. These two structures are fundamental to GPS tracking in general. Therefore
    we will catch up with the theoretical introduction by implementing these two components.


    In the Tracer source we will identify the org.traccar.model package as the relational
    data model and the org.traccar.protocol package as the decoders for various protocol
    formats and types. While Tracer Standard Java application JEE development is based
    on creating components which are combined to a software by a build tool.


    We will create JEETS components for each programming domain: One component to
    provide the relational data model and another to handle associated-protocol messages.
    Each JEETS component should include its dependent JEE component i.e. Netty protobuf
    library, to implement test code on the component without any external dependencies.
    Since these components can be used for any application based on this model it
    makes sense to avoid as much business code as possible.


    Initially JEE development was related to the application server as a single execution
    environment. The requirements of social networks, the self-driving car with Big
    Data etc have changed this approach. While the JEE specification is taking care
    of the components is not a software of its own. The idea of extending Java Standard
    APIs with higher functionality has turned out to point in the correct direction.
    In the context of JEE build tools the data- and protocol model can be perceived
    as drivers which should be applied by every developer to guarantee (data-) compatibility.
    Later we will see how to apply these modules for any (Java-) context you may choose.'
