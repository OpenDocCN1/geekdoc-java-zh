  md: '# CHAPTER THREE


    # Radical Work


    “LET TELL YOU SOMETHING. You sell blood diamonds, too.” Leonardo DiCaprio’s Danny
    Archer spoke those words to Jennifer Connelly’s Maddy Bowen in the 2006 film Blood
    Diamond, which sparked a global conversation about how, where, and why diamonds
    are procured for products ranging from engagement rings to lasers. The quote was
    an acerbic rejoinder to Bowen’s brush confidence that she bore no culpability
    for Africa’s rough-and-tumble diamond trade. Indeed, as DiCaprio’s character underscored,
    she did, because she and billions of others bought products every day mined out
    of the Earth.


    Michael J. Kowalski had already begun to consider these issues about seven years
    before the film debut, eventually deciding that he and the company had a role
    to play in making sure the metals they bought were extracted and processed responsibly.
    Kowalski had taken the reins in 1999 of Tiffany & Co., the iconic retailer knew
    the world for its rings, necklaces, watches, and myriad jewelry products made
    from gold, silver, platinum, and other metals wrapped in proprietary blue-hued
    bags and boxes. The company made most of its jewelry, thus helping ensure not
    only product quality but safe working conditions and fair labor practices for
    staff. What Tiffany did not control, though, was the mining of metals for its
    products. For Kowalski, that was a problem.


    We began to realize that the jewelry industry broadly and Tiffany specifically
    didn’t have a strong understanding of the metals supply chain and the sourcing
    of the building blocks for the products we sold,” Kowalski said. It was a reputational
    risk to the company’s bottom line. After all, buying an engagement or wedding
    ring is one of the most intimate purchases a person can ever make.'
