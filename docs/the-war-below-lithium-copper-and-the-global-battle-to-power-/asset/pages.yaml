  img_proc: true
- pgno: 9
  md: 'battery metal, but if that is the case, an industry hungry for lithium would
    surely call it misfortunate. Throughout the world, supplies of metal sit atop
    land considered sacred, or too special, or too ecologically sensitive to disturb.
    Whether these lands should be dug up in an attempt to defuse climate change is
    one of the defining questions of our time. For the United States, which has less
    than 5 percent of the world’s population but consumes almost 17 percent of its
    energy, this new green energy economy requires a collective reflection to which
    many are not accustomed. Other governments, too, are grappling with this transition,
    including China, which has 18 percent of the world’s population and consumes 25
    percent of its energy.¹¹¹


    Jerry Tiehm’s discovery on that quiet Nevada hill in 1983 is emblematic of the
    stark choices at hand and a harbinger of the fight to stem climate change. “I’m
    now botanically immortal,” Tiehm told me. “Years after I’m dead, people will still
    be talking about my discovery and its implications.”


    Tiehm had no clue just how right he was.'
