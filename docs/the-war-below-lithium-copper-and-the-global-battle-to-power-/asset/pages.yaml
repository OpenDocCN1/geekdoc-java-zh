- pgno: 14
  md: 'better understand the language of electricity.16 Ahmed, who studied at the
    Bangladesh University of Engineering and Technology before earning his Ph.D. from
    the University of Nebraska, runs Argonne’s BatPaC tool, which helps calculate
    the materials needed for a battery’s energy storage capacity.17


    A kilowatt is the rate of energy flow and a kilowatt-hour is a quantity of energy.18
    (In a gasoline-powered engine, the fuel injection rate can be expressed in kilowatts,
    while the gasoline in the fuel tank can be expressed in kilowatt-hours.) The larger
    the battery, the greater its electricity storage capacity. The standard Tesla
    Model 3—the most popular EV in the world in 2021—has a 55.4 kWh battery, meaning
    it can deliver 55.4 kilowatts of power for one hour.19 How fast battery charges
    depends on the charger itself; a typical household plug charger at about 1 kW,
    it would take about fifty-five minutes to charge the Model 3 in this analogy.
    But commercial or public chargers operate faster, typically 50 kW, meaning it
    would take slightly more than an hour to recharge that. Some superchargers at
    250 kW or more.20


    “If you have more energy to store, then you need a bigger battery. And the bigger
    the battery, the driving range you have,” Ahmed explained over Zoom, his long
    white hair evoking Doc Brown from the 1985 film Back to the Future. Not surprisingly,
    the bigger battery, the more metals you need. Model 3, Ahmed explained, uses 0.11
    kilograms of lithium for every kWh. (One kilogram is 2.2 pounds.) That means Tesla’s
    55.4 kWh battery was built using roughly 6 kilograms of lithium.21 Using Ahmed’s
    estimates, that same battery’s cells hold about 42 kilograms of nickel, nearly
    8 kilograms of cobalt, 8 kilograms of aluminum, nearly 55 kilograms of graphite,
    and about 17 kilograms of copper, with even more aluminum and copper elsewhere
    in the battery.


    The problem for the U.S. automakers, though, was that the United States was producing
    very few of these metals as EVs and other green energy devices began to go mainstream,
    a concern of industry executives that has only grown since Tesla introduced the
    Roadster.22 Coronavirus put these fears into overdrive, reinforcing to consumers
    how much their everyday life depended on products such as pharmaceuticals, clothing,
    and energy, which were linked to'
