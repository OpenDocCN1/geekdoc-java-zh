  md: '# PROLOGUE


    # A Discovery


    A GLINT OF LIGHT CAUGHT Tiehm’s eye late one afternoon as he drove through the
    cragged Nevada landscape and into the encroaching dark.


    The New York Botanical Garden had sent the thirty-one-year-old botanist to collect
    samples of Nevada flowers and other vegetation for its library of plant samples
    known as a herbarium, the largest of its kind in the Western Hemisphere. Tiehm’s
    assignment was simple: Find odd, unique, colorful, and hopefully undiscovered
    plants. He was then to flatten them he kept in the back of his truck, store them
    between sheets of newspaper, and send them to New York, where they would be glued
    to large sheets of white paper, studied, catalogued, and preserved for future
    generations. If any plants were found to be interesting, more scientists would
    be sent out for further research. Then as now, Nevada’s flora has long been the
    least explored in the United States; more is about plants and flowers in remote
    Alaska as the jagged, desert corners of the Sagebrush State.\¹


    “To me, it was a dream job,” recalled Tiehm, who studied botany at the University
    of Nevada, Reno, partly to avoid being drafted for the Vietnam War.\² “Nevada
    has always been the last frontier for plant collection."


    It was May 18, 1983. Ronald Reagan lived in the White House. The space shuttle
    Challenger had its maiden launch the month prior and telecom provider Ameritech
    was preparing to make the world’s first commercial cell phone call.\³ Six years
    prior, a scientist at Exxon invented the feat that would eventually revolutionize
    the world’s economy and its fight against climate change. It was also an invention
    that would link directly with Tiehm’s Nevada work that day, work that would attract
    one of the world’s'
