- pgno: 8
  md: 'A small plant, Tiehm’s buckwheat looms large in the green energy transition.

    ath the roots of the plant that Tiehm first discovered that warm spring day sits
    a massive deposit of lithium, which is used to make lithium-ion batteries for
    power millions of consumer electronic devices and electric vehicles. While Tiehm
    would eventually have seven plants named after him, it is Tiehm’s buckwheat that
    grows only in the lithium-rich soils of those Nevada hills and nowhere else on
    Earth for reasons that rank among the many mysteries of the plant kingdom.⁸


    When I visited Tiehm in Reno in the summer of 2022, he wore New Balance sneakers
    and was dressed in a Hawaii Five-O T-shirt tucked into navy-blue shoes. A pair
    of reading glasses rested on top of his balding head. Fit and trim, Tiehm’s youthful
    physique and sharp mind beheld his seven decades. He had no plans to retire and
    ceil unofficial title of “Nevada’s premier botanist and plant explorer.”²


    Tiehm had been teaching at the University of Nevada, Reno, since 2014 and before
    that worked as a bellman and limousine driver for three of Reno’s casinos, mostly
    the Peppermill.¹⁰ He would often take weekends away from the slot machines and
    poker tables to explore the state’s remote landscape. “My experience in looking
    at plants out at the desert for fifty years is that the plants grow they want
    to grow. And nowhere else,” he said.


    In 2016, an Australia-based company was hunting for gold in Nevada and realized
    that Rhyolite Ridge contained lithium. wildly profitable as global demand for
    the white metal was to spike. Electric vehicles from Tesla and others were increasingly
    seen as key tools to fight climate change. To get at that lithium, though, would
    require the company to dig an open-pit mine right where Tiehm found the flowers.


    Thus, the paradox: What matters, the plant or the lithium beneath it? This is
    a story about that choice, and the choices facing regions across the United States
    and the world replete with lithium and copper, nickel, rare earths, or cobalt—metals
    critical to the construction of solar panels, electric vehicles, batteries, wind
    turbines, and an array of other products heralded as key to electrifying the world’s
    economy and easing carbon emissions. Tiehm would later call it “blind luck” such
    that a rare plant sat atop this giant reserve of a key'
