- pgno: 7
  md: 'largest automakers, stoke the ire of one of America''s most preeminent conservation
    groups, and spread worry through the corridors of power in Washington and Wall
    Street.


    Tiehm was very much unaware of that future as he guided his burnt-orange-colored
    Chevrolet Blazer down a steep embankment of gravel barely recognizable as a road.
    All the botanist could about finding a safe place to camp. Those barren hills
    of Nevada known as the Silver Peak Range were not forgiving those without a plan,
    especially in the stygian dark. But that hint of light, flickering ahead of the
    dusk, beckoned Tiehm.


    Amid what looked to be unusual, light patches of ground surrounded by a sea of
    dark rock, the botanist noticed a wildflower that hugged the earth, almost like
    an herb.4 Stems of six or so inches protruded from the soil with leaves of a bluish
    gray hue and flowers of pale yellow.5 Hundreds of the plants seemed together at
    the site, known as Rhyolite Ridge, but Tiehm was unsure why. He had stumbled upon
    the plant at the peak of its blooming season, from May to June, when the golden
    flowers emerge resplendent for nature and dazzle bees, spiders, and other creatures
    that pollinate it in the seemingly barren desert. By July, the flowers turn red
    with age and begin to cast off seeds, propagating their next generation. Late
    summer brings a hibernation that lasts through the next year.6


    Tiehm followed procedure. He collected fifteen samples of the flowers, pressed
    them, labeled them, and catalogued them for New York out of the bed of his truck.
    He pulled out his tent and camped for the night under the expanse of the Milky
    Way.7 Back east, months later, Tiehm was reviewing his field notes and still couldn''t
    identify the plant. James Reveal, a University of Maryland professor, who had
    also studied his notes, to say why: Tiehm had had likely discovered a species
    of plant previously unknown to science. Reveal, Tiehm, and a group of other botanists
    visited the site the following summer and collected more samples. In 1985, Reveal
    announced the findings to the world in an academic journal. And in honor of its
    discoverer, the plant was given the moniker Eriogonum tiehmii, or Tiehm''s buckwheat.'
