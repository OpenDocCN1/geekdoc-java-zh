    the south.^29 Instead of visiting the site, we met for lunch at a fast-casual
    restaurant in Houston. Tired and drawn, Calaway had recently returned from a planning
    session with fellow ioner executives, and the'
  merge: -1
  img_proc: true
- pgno: 302
  md: 'multiday meetings had worn him down. Still, he spoke with optimism about the
    project and the permitting process.


    Ford, which had agreed to buy much of ionic''s lithium from Rhyolite Ridge, had
    announced just days prior that it would build a $3.5 billion battery plant in
    Michigan with its Chinese partner CATL, the world''s largest battery producer
    and the same company that had prevailed in Bolivia''s lithium fight.30 Ford''s
    deal with ioner, however, was to supply the automaker''s BlueOvalSK joint venture
    in Kentucky. Calaway had built ioner to wean the United States off Chinese supplies,
    not supply Chinese battery companies. We, of course, immediately contacted Ford.
    They assured us that our material wasn''t going to CATL, told me. “We’ve been
    pretty serious about keeping our material out of the hands of the Chinese.”31


    Beyond the geopolitics, Calaway grew introspective about the environment. If he
    succeeded at Rhyolite Ridge, Calaway would have built not one but two lithium
    projects, an accomplishment that would ensure his role as titan of an industry
    center in the fight against climate change. Eight months prior, Calaway welcomed
    the birth of his first grandson, an event that ushered a flood of emotions and
    reminded him why he wanted to build Rhyolite Ridge in the first place. “What I
    want to do before I die is confident that I''ve done everything I can possibly
    do to leave this place more livable for my children and grandchildren,” he said.


    I thought about Jerry Tiehm''s fateful drive in 1983 through Nevada''s barren
    wilderness. His discovery that day had lain dormant for years, much like Tiehm''s
    buckwheat through the winter months. But the bloom of the green energy revolution
    made that plant emblematic of the choices and consequences facing our world as
    it struggles with how best to tackle the climate crisis.


    At the end of one of our chats, I asked Tiehm what he thought of the inherent
    tensions in the fight over Rhyolite Ridge, its lithium, and the flower that bore
    his name. The botanist paused, as if to consider the weight of the matter, before
    responding: “If you find interesting habitats, you’ll find interesting plants.\”'
