    Energy used to be about crude oil and natural gas. Now it''s also about lithium,
    copper, and other EV metals.


    Consider the following:


    +   - Chile and Australia by 2023 were the world''s largest lithium producers
    but relied on China to process much of that metal into a form usable for EV batteries.
    Two of the world''s largest lithium companies are Chinese, one of which also controls
    a quarter of its Chilean rival SQM, which produces much of the world''s lithium
    in the Atacama salt flats. The United States produces only small amounts of lithium
    at a facility first built in the 1960s and has no large-scale facilities to process
    it, though it has enough untapped to build millions of EVs.23 China has lithium
    reserves locked in hard-to-extract deposits.24


    +   - China is the world''s largest copper consumer and aggressively buys the
    red metal, a major conductor of electricity, from Chile, Peru, and other nations.
    U.S. copper production dropped nearly 5 percent from 2017 through 2021 despite
    the country having twice as much as China.25


    +   - Indonesia holds the world''s largest supplies of nickel and has moved to
    block exports of the key metal to build its own EV industry.26 The only U.S. nickel
    mine will be depleted by 2025 and the United States does not have a nickel refinery.
    The metal is key to boosting an EV battery''s energy density, and thus allowing
    an EV to drive further on a single charge. An EV battery made with nickel uses
    40 to 60 kilograms of the metal, whereas an internal combustion engine only uses
    1 to 2 kilograms.27'
