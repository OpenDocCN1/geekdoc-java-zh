    ![](img/a217edfbc8bc4a3e8c74ce0377f399ce_12_0.png)


    LITHIUM-ION BATTERIES were first invented in 1977 by the U.S. scientist Stanley
    Whittingham, who was working for the oil Exxon in its New Jersey laboratories.¹10
    While Whittingham and two peers eventually were awarded the Nobel Prize in Chemistry
    for the invention—the Nobel Committee in 2019 lauded it for “making possible a
    fossil-fuel-free society”—Exxon passed on the technology in part due to concern
    that early versions of the battery would spontaneously combust, a problem known
    as “thermal runaway,” one caused by lithium’s reactive properties.¹11 Oil prices
    also revived gasoline after the end of the Arab Oil Embargo, lessening the crunch
    to find an oil replacement.¹12 The addition of cobalt to the battery''s composition
    was later found to be a way to mitigate these explosions. Japan''s Sony eventually
    ended up with the patents and in 1990 debated a line of handheld cameras powered
    by rechargeable lithium-ion batteries. These batteries were just as powerful as
    traditional lead-acid batteries. Thanks to lithium''s electrochemical properties,
    they could be engineered to be larger and smaller.


    The invention helped personal electronics go mainstream. Soon, laptops, cell phones,
    and a range of other consumer electronics were everywhere, powered by the rechargeable
    batteries built with metals that could be reused thousands of times.¹13 Even still,
    most of the world’s consumers paid little attention to how much the Periodic Table
    of Elements affected their daily lives and, increasingly, their futures. While
