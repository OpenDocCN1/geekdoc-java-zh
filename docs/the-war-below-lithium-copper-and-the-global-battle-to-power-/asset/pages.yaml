    Li stands for lithium. The lightest metal, it’s found near the top of the Periodic
    Table of Elements and enormously good at retaining an electric charge, making
    it the perfect anchor for the lithium-ion battery. Calaway realized that all the
    chemical equations used to build those batteries contained that symbol: Li. “And
