  md: '# CHAPTER ONE


    # A Choice


    “YOU SHOULD MEET JAMES CALAWAY.” So advised a banking contact of mine in the fall
    of 2018. “He knows everything there is to know about lithium and starting a lithium
    company.”


    I was transitioning from my coverage of the U.S. oil industry’s fracking revolution
    to coverage of the miners jockeying to supply lithium and other metals for the
    green energy transition. It was an opportunity I looked forward to, even if it
    was daunting. I had already reported on one major energy transition; here was
    a chance to cover a second one. Opportunities like that don’t come too often.
    But while the politics and production of fossil fuels are well understood and
    similar, making a battery would require multiple metals, some sourced in wildly
    different manners. Rather than report on just oil and natural gas, I would now
    find myself digging into lithium, copper, nickel, cobalt, and a strange classification
    of seventeen minor metals known as rare earths. (Not to mention gold and silver,
    which had been the mining industry’s mainstays for thousands of years.)


    I dove into the challenge of meeting new experts, especially those Cal Calaway
    with money on the line and skin in the game. So, on my banking contact’s advice,
    I emailed Calaway one morning in December 2018 asking if he would be open to meet
    over a casual coffee. Within minutes, my cell phone buzzed.


    Hello, is this Ernest? This is James Calaway. I got your email.”


    Now, here was someone eager to talk about lithium.\Not only was Calaway eager
    to talk, he was also based in Houston, where I had decided to remain after I switched
    beats. Calaway and I agreed to grab lunch'
