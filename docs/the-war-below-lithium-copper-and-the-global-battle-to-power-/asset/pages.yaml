    as now to Dodge''s teetalling ways.)²


    Dodge founded a trading firm in 1834 with his father-in-law, Ansel Phelps, growing
    an empire that led to Dodge being described as a merchant prince because of his
    holdings of extensive interests in multiple industries: timber, real estate, railroads,
    banking, cotton, and other commodities, to name a few. He even, for a brief time,
