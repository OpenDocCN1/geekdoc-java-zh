    appetite for antimony into an acute hunger when Japan invaded China during the
    Second World War, stoking a perfect storm of supply-and-demand imbalance. Japan
    blocked exports of the strategic metal, sparking a hunt for alternate reserves.
    In 1939, Congress and President Franklin Roosevelt passed the Strategic and Critical
    Materials Stock Piling Act, which directed the U.S. military and Department of
    the Interior to craft a list of minerals and materials crucial for the national
    defense. Antimony was placed on the list, and the U.S. Bureau of Mines scouted
    the country for supply.6


    The mountains near Yellow Pine and Stibnite had been known to have a large concentration
    of gold and antimony ever since the Thunder Mountain gold rush of 1900. That gold
    rush failed largely due to the complex geology and the sheer remoteness of northern
    Idaho; just transporting digging equipment to the site proved an insurmountable
    cost.7 Several companies claimed stakes over the next thirty years before a San
    Francisco–based firm, Bradley Mining Co., opted for the rights to mine in the
    area in the 1930s. Like those who had gone before, Bradley found it challenging
    to profitably separate gold from antimony. The bill that Roosevelt had signed
