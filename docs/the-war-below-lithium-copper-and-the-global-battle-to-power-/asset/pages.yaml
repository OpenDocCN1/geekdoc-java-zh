    When Martin Eberhard founded Tesla Motors in 2003, the lithium-ion battery was
    very fringe in the automobile sector, treated as a kind of science experiment
    by Ford, Chrysler, and other auto giants. Elon Musk joined Tesla the following
    year and started the company on a path to launching its first vehicle—the Roadster—in
    2008. It was a journey that involved battery partnerships with Germany''s Daimler,
    Japan''s Toyota, and the U.S. government, a tortuous path chronicled in Car Wars,
    John Fialka''s definitive account of the early years of the EV industry.


    With electric cars making oil changes, miles per gallon estimates, radiators,
    and other staples of the internal combustion engine of the past, consumers increasingly
    are being forced to master a new set of terminologies, starting with the structure
    of the lithium-ion battery. It has four main parts: an anode, cathode, electrolyte,
    and separator. An anode is typically made with graphite. A cathode is made with
    lithium and, depending on a mix of nickel, manganese, cobalt, or aluminum. Between
    the two is an electrolyte solution often made of lithium, with a separator composed
    of plastic. Inside an EV''s motor sits more than a mile of copper wiring that
    is used to help turn power from the battery into motion. When the battery is powering
    a car or other device, lithium ions flow from the anode through the separator
    to the cathode. The process is reversed during charging.¹⁵


    A lithium-ion battery''s power is directly related to its metal content, unpacking
    the difference between kilowatts and kilowatt hours, when many have grown accustomed
    to thinking of a vehicle''s power in "horsepower" for the past hundred years,
    can seem daunting. Solar panels and wind turbines also generate electricity in
    kilowatt hours.


