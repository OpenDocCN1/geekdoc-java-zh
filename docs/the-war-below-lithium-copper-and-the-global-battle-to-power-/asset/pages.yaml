    tenure from 1866 to 1867 was marked by a spirited campaign to convince a reported
    fifty senators and congressmen to take pledges to abstain from alcohol.³ It would
    be the early twentieth century before the firm morphed into what became one of
    the world''s largest copper mining companies: Phelps Dodge.⁴


    The transformation to copper mining happened slowly. The U.S. copper industry
