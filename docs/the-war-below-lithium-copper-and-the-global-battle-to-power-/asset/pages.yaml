    to find lithium somewhere in the world.


    LITHIUM CAN be found in several types of rock that tend to have some connection
    to ancient volcanoes, hinting perhaps at the primordial origins of a metal that
    is now seen as key to saving our planet. The Swedish chemist Johan August Arfwedson
    credited with being the first to identify lithium when, in 1817, working in the
    laboratory of one of the founders of modern chemistry, his fellow Swede Jons Berzelius,
    successfully separated it as a salt from the mineral petaline. Lithium is also
    found in spodumene, a mineral common across Australia; lepidolite, which is found
    in parts of China; and deposits of salty water known as brine.) A Brazilian scientist,
    José Bonifácio de Andrade e Silva, who had previously discovered petaline on a
    Swedish island but had not been able to tease the metal inside. Production of
    lithium gradually refined over the next hundred years or so, but demand was always
    niche. Lithium was used to make greases during the Second World War, giving tanks
    operated by the Allies an advantage over their Nazi rivals. After the war, lithium
    was used to help build hydrogen bombs, the development of which by the United
    States made it the largest lithium producer in the world thanks to mines that
    would be developed in North Carolina and a brine evaporation facility in Nevada.'
