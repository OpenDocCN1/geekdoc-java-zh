    # The Neighbors


    NORTH CAROLINA’S GASTON COUNTY is a place entirely divorced from the hustle of
    nearby Charlotte, one of America’s twenty largest cities. On a map, the county’s
    borders evoke an anvil hugged up against Charlotte’s western borders. Founded
    in 1846, the county was named for William Gaston, a former member of the U.S.
    Congress and jurist who had died two years prior. Gaston for a time owned slaves
    in a state that would become one of the most active in the Confederacy. Yet he
    paradoxically was an ardent abolitionist. As a member of the state’s supreme court,
    he ruled that a slave could defend himself against an unjust attack from the person
    who claimed to own him. Supreme Court Justice Benjamin Curtis cited one of Gaston’s
    rulings that Black North Carolinians were citizens of the state when he dissented
    in the infamous Dred Scott case.


    In an 1832 address to University of North Carolina graduates, Gaston beseeched
    them to dreary slavery, saying “more than any other cause, keeps us back in the
    career of improvement” and “fatal to economy and providence—it discourages skill—impairs
    our strength as a community and poisons morals at the fountain head.” Elsewhere
    in the speech, Gaston implored graduates to balance development with other areas,
    advice that would prove sage as the green energy revolution began:


    As your country grows in years, you must also cause it to grow in science, literature,
    arts, and refinement. It will be for you to develop and multiply its resources,
    to check the faults of manners as they rise, and to advance the cause of industry,
    temperance, moderation, justice, morals, and religion.'
