    # A Turning Point


    ON EARTH DAY 2016, THE United Nations held a signing ceremony in New York for
    member states to begin ratification of the Paris Climate Accords, the culmination
    of years of negotiations that had begun with the Framework Convention on Climate
    Change in 1992. Secretary-General Ban Ki-moon, U.S. Secretary of State John Kerry,
    and President François Hollande of France, a collective among the scores of dignitaries
    that descended on the Big Apple, a collective show of unity designed to underscore
    the seriousness of the topic.¹ Kerry brought his granddaughter to indicate his
    belief that the agreement would benefit generations to come.²


    Nearly two hundred nations had gathered in a suburb of the French capital earlier
    to wash out the globe could speak and act with one voice on a strategy to mitigate
    climate change. The resulting agreement set a long-term goal of limiting the rise
    in average global temperatures this century to 2 degrees Celsius (3.6 Fahrenheit)
    and to reach net-zero global emissions by 2050. For that goal to be reached, it
    would mean the era of fossil fuels and converting the global economy to run entirely
    on batteries powered by wind turbines, solar panels, and other devices that churned
    out renewable energy. President Barack Obama called the Paris Accords one of his
    proudest accomplishments. “If we follow through on the commitments that this agreement
    embodies, history will judge it as a turning point for our planet,” Obama said
    when the accords went into effect after fifty-five countries representing 55 percent
    of global emissions had signed.³


