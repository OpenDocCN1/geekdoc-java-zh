    Beaverdam Creek ran just to the north.


    Lacking advanced technologies to find the best spot for a well and the funds to
    pay for costly drilling, Hastings turned to an ancient device to place his home
    by finding a well to feed it: the dosing rod. He his brother carried the forked
    stick throughout the acreage, hoping to get the sensation, the vibration, indicating
    a water supply. When the ancient device settled on a small patch of dirt to the
    west of Aderholt Road, Hastings and his brother started digging with buckets to
    the soft earth. When the hole became too deep to easily enter and exit, they erected
