  md: '# ABOUT THE AUTHOR


    ![](img/a217edfbc8bc4a3e8c74ce0377f399ce_306_0.png)


    Ernest Scheyder is a senior correspondent for Reuters covering the green energy
    transition and the minerals that undergrid it. He previously covered the U.S.
    shale oil revolution, politics, and the environment, and held roles at the Associated
    Press and the *Bangor Daily News*. A native of Maine, Scheyder is a graduate of
    the University of Maine and Columbia Journalism School. Visit his website at [ErnestScheyder.com](http://ErnestScheyder.com).


