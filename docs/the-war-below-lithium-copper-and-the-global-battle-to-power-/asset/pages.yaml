    Power is an exponential of voltage; the higher the voltage, the more power you
    have. Because of lithium''s small size and weight, its electrons can move inside
    a battery at surprisingly fast speeds. That makes it rare when compared with other
    metals on the Periodic Table of Elements and ideally suited for use in a battery.
    There aren''t any immediately substitutes that can mimic all of its properties.
    That is why, for Calaway and an increasing number of investors and corporate executives,
