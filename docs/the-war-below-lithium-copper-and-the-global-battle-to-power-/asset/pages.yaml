    perhaps of his unwillingness to engage on the topic or his fixation on more-pressing
    campaign issues at the time. (COVID-19, Russia, his son Hunter.)


    Biden, of course, bested Donald Trump in the election and was inaugurated on January
    20, 2021. He spent the next year saying nothing publicly about minerals or mining,
    even while he and Granholm talked repeatedly about the'
