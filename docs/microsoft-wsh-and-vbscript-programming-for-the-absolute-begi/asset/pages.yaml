    # Working with Object Properties


    Now let''s take a look at an example of VBScript that demonstrates how to instantiate
    an instance of the WshNetwork object and access its properties. The script is
    called NetInfo.vbs and it is as follows:


    ```

    Set WshNwk = WScript.CreateObject("WshNetwork.Network")

    ```


    ```

    PropertyInfo = " User Domain" & vbTab & " = " & WshNwk.Info.UserDomain & \

    vbCrLf & " Computer Name" & vbTab & " = " & WshNwk.Info.ComputerName & \

    vbCrLf & " User Name" & vbTab & " = " & WshNwk.Info.UserName & vbCrLf _

    ```


    MsgBox PropertyInfo, vbOKOnly , "WshNwk Properties Example"


    As you can see, it is not very big script. By using a Set to create an instance
    of the WshNetwork object, which is associated with a variable name of WshNwk.
    After you have established an instance of the WshNetwork object in this manner,
    you can reference the object''s properties and methods using its variable name
    assignment.'
