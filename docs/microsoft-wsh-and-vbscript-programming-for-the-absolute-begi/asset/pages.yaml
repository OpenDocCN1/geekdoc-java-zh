  md: '# Chapter 8 • Storing and Retrieving Data


    If a folder with a name already exists in the destination specified by the CopyFolder()
    method, the contents of the source folder are added to the files and folders that
    are already present. You can tell the CopyFolder() method what to do if duplicate
    file and folder names are found in the destination folder by adding an optional
    third parameter and setting its value to either True or False. Specifying a value
    of True matches files to be overwritten. For example, the following VBScript statements
    prevent files with duplicate names from being overriden:


    ```

    Dim objFso

    Set objFso = WScript.CreateObject("Scripting.FileSystemObject")

    objFso.CopyFolder("C:\Temp", "C:\VBScriptGames\Temp", "False")

    ```


    This example allows files with duplicate names to be overridden:


    ```

    Dim objFso

    Set objFso = WScript.CreateObject("Scripting.FileSystemObject")

    objFso.CopyFolder("C:\Temp", "C:\VBScriptGames\Temp", "True")

    ```


    # Moving Folders


    You can use the FileSystemObject''s MoveFolder() method to move folders from one
    location to another. Of course, when you move a folder, you move all its contents
    to the new destination. Take a look at the following example:


    ```

    Dim objFso

    Set objFso = WScript.CreateObject("Scripting.FileSystemObject")

    objFso.MoveFolder("C:\Temp", "C:\VBScriptGames\Temp")

    ```


    The Temp folder and all its contents are moved from the root of the C: drive to
    C:\VBScriptGames folder.


    # Deleting Folders


    You can use the FileSystemObject''s DeleteFolder() method to delete one or more
    folders. This method deletes the folder and any subfolders or files stored inside
    it. See how it works, look at the following example, which deletes a folder Temp
    from the C:\VBScriptGames folder.


    ```

    Dim objFso

    Set objFso = WScript.CreateObject("Scripting.FileSystemObject")

    objFso.DeleteFolder("C:\VBScriptGames\Temp")

    ```


    # Trap


    Be careful when using the DeleteFolder() method. When executed, this method deletes
    not only the specified folder, but also anything stored within it.'
