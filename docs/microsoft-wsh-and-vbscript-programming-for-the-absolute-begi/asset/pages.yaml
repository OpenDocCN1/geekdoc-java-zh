- img_proc: true
  md: '# Microsoft WSH and VBScript Programming for the Absolute Beginner, Fourth
    Edition


    dimensions is a comma-separated list of numbers that specifies the number of dimensions
    that make up the array. For example, the following VBScript statement can be used
    to create a single-dimension array named ItsParty that can hold up to 10 names:


    ```

    Dim ItsParty(9)

    ```


    Notice that you use the number 9 to define an array that can hold up to 10 elements.
    This is because the first index in the array is automatically set to 0, allowing
    the array to store 10 elements (that is, 0–9).


    After an array is defined, it can be populated with data.


    > The first element stored in an array has an index of 0, its actual length is
    equal to the number supplied when the array is first defined plus one.


    The following VBScript statements demonstrate how you can assign data to each
    element in the array:


    ```

    ItsParty(0) = "Jerry"

    ItsParty(1) = "Molly"

    ItsParty(2) = "William"

    ItsParty(3) = "Alexander"

    ```


    .


    .


    ```

    ItsParty(9) = "Mary"

    ```


    As you can see, to assign a name to an element in the array, I had to specify
    the element''s index number. After you populate the array, you can access any
    array element by specifying its index number, like this:


    ```

    MsgBox ItsParty(1)

    ```


    In this example, ItsParty(1) equates to Molly.


    > If you like the suggestions I made earlier in this chapter about naming constants
    and about using Hungarian Notation when creating names for your variables, you
    might want to combine these two approaches when naming your arrays. For example,
    instead of naming an array ItsParty(), you might want to name it astrItsParty().
    The first character of the name identifies that it''s an array and the next three
    characters identify the type of data that''s stored in the array. This is the
    naming standard that I''ll use when naming arrays throughout the rest of this
    book.'
