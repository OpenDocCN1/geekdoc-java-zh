    # The For...Next Statement


    The For...Next statement is used to create loops that execute a specific number
    of times. For example, if you''re creating a game that requires the player to
    enter five guesses, you could use a For...Next loop to control the logic that
    supports the data-collection portion of the script.


    The syntax for the For...Next statement is as follows:


    ```

    For counter = begin To end [StepValue] statements

    ```


    counter is a variable used to control the execution of the loop. begin is a numeric
    value that specifies the starting value of the counter variable. end specifies
    the ending value for the counter variable (that is, the value that when reached,
    terminates the loop''s execution). StepValue is an optional setting that specifies
    the increment for the For...Next statement when incrementing the value of counter
    (that is, the value added to counter at the end of each iteration). If omitted,
    the value assigned to StepValue is always 1.


    To better understand the operation of a For...Next loop, look at one example that
    collects data using a loop and one that collects the same data using a For...Next
    loop. In this example, you''re creating a game in which the player is expected
    to enter the name of his five favorite foods. You could always handle this type
    of situation as follows:


    ```

    Dim strFoodList = ""

    strFoodList = strFoodList & " " & InputBox("Type the name of a food " & "that
    you really like.")

    strFoodList = strFoodList & " " & InputBox("Type the name of a food " & "that
    you really like.")

    strFoodList = strFoodList & " " & InputBox("Type the name of a food " & "that
    you really like.")

    strFoodList = strFoodList & " " & InputBox("Type the name of a food " & "that
    you really like.")

    strFoodList = strFoodList & " " & InputBox("Type the name of a food " & "that
    you really like.")

    MsgBox "You like : " & strFoodList

    ```


    As you can see, this example repeats the same statement over and over again to
    collect user input. As proof that it did its job, it displays the data it collected
    using the MsgBox() function.'
