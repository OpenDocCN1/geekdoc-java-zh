    # Introducing VBScript


    As you know now, VBScript is a scripting language that enables you to develop
    scripts that automate tasks that would otherwise have to be manually performed
    in the environment in which they execute. VBScripts are stored as plain-text files
    with a .vbs extension and can be created using any text editor. This makes them
    easy and quick to develop.


    Unlike the standalone implementations of many scripting languages, as Perl or
    Python, VBScripts cannot execute without an execution host. VBScript was originally
    designed to execute as text embedded within HTML pages inside the Internet Explorer
    browser. Over the years, however, Microsoft extended VBScript’s capabilities to
    it in numerous different settings. VBScript is now supported in a number of different
    environments, including the following:


    +   * Windows Script Host. VBScript provides a host automation language for performing
    system and network tasks.

    * Internet Explorer. VBScript supplies a client-side Web-scripting language.

    * Microsoft Windows Script Console. This allows VBScript to be added to third-party
    applications to incorporate its scripting capabilities.

    * Internet Information Server (IIS) and Active Server Pages (ASP). VBScript can
    be embedded into ASP to access local databases and deliver dynamic Web content.

    * Outlook Express. VBScript provides the ability to automate a number of Outlook’s
    functions.


    As you can see, after master VBScript within the context of WSH script development,
    you’ll have a number of other avenues in which you can begin using your new VBScript
    programming skills.'
  merge: -1
