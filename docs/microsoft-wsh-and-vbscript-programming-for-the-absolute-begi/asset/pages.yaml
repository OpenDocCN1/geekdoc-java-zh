    # Back to the Guess a Number Game


    Let''s turn our attention to the Guess Number game. In this game, the player is
    prompted to guess a randomly generated number between 1 and 100. Each time the
    player takes a guess, the script will check to see if the correct number was guessed.
    If not, the script will provide a hint to help the player on his next guess.


    Developing this script will enhance your knowledge and understanding of working
    with the Do...Until loop. You will also work with the If statement, and learn
    how to work with a number of new built-in VBScript functions.


    # Designing the Game


    The Guess Number game begins by asking the player to guess a number between one
    and 100 and then helps the user guess the number by providing hints. This project
    has five steps. These steps are as follows:


    +   1. Add the standard documentation template and define any variables, constants,
    or objects used by the script.

    2. Generate a random number between one and 100.

    3. Create a loop that runs until the player either guesses the correct answer
    or gives up.

    4. Test the player''s answer to see whether it is valid.

    5. Test the player''s answer to see whether it is too low, too high, or correct.'
