    # Displaying Script Output


    You''ve already seen many examples of how to display messages in VBScripts. Output
    display is a critical tool in any programmer''s toolbox. As a VBScript programmer
    working with the WSH, you have four different options for displaying script output.'
  merge: -1
  pgno: 88
- img_proc: true
  md: 'Two of these options are provided by the WSH in the form of objects:


    +   - Echo(). This displays text messages in the Windows Console when processed
    by the CScript.exe execution host, and in pop-up dialog boxes when processed by
    the WScript.exe execution host.


    +   - Popup(). This displays text messages in pop-up dialog boxes, giving you
    control over the icons and buttons that are displayed and, optionally, returning
    a value representing the button that is clicked.


    In addition to two WSH options, VScript gives you two functions of its:


    +   - InputBox(). This displays a text-entry field in a pop-up dialog box to collect
    user input.


    +   - MsgBox(). This displays text messages in pop-up dialog boxes, giving you
    control over the icons and buttons that are displayed and, optionally, returning
    a value representing the button that is clicked.


    # The WScript Object''s Echo() Method


    The WScript object''s Echo() method can display text output in the Windows Console
    or in a pop-up dialog box, depending on the execution host that processes it.
    Table 3.7 outlines the Echo() method''s behavior based on the execution host that
    processes it. Unlike other WSH object methods or VScript functions, the Echo()
    method cannot collect user input.


    | TABLE 3.7 WSCRIPT ECHO() METHOD EXECUTION OPTIONS |

    | WSH Execution Host | Output |

    | WScript.exe | Displays text messages in graphical pop-up dialog boxes |

    | CScript.exe | Displays text messages in the Windows Console |


    The syntax for the WScript object''s Echo() method is as follows:


    ```

    WScript.Echo [Arg1] [,Arg2]...

    ```


    The Echo() method can display any number of arguments:


    ```

    WScript.Echo "This message appears differently depending on the " * \

    execution host that runs it."

    ```


    # The WshShell Object''s Popup() Method


    The WshShell''s Popup() method displays messages in pop-up dialog boxes. You can
    customize its appearance by selecting the buttons and the icon to be displayed.
    You can also determine which button the user clicked. To work with the WshShell
    object, you must first instantiate it within your script, which you can do by
    adding a statement like the one shown here.


    ```

    Set WshShell = WScript.CreateObject("WScript.Shell")

    ```'
  merge: -1
  pgno: 89
- img_proc: true
  md: '# Microsoft WSH and VBScript Programming for the Absolute Beginner, Fourth
    Edition


    Once instantiated, you can access WshShell object''s methods and properties. The
    WshShell object''s Popup() method can be used in either of two ways. The syntax
    of the first option is as follows:


    ```

    Response = WScript.Popup(StrText,[Time],[TitleBarMsg],[DialogSettings])

    ```


    The syntax of the second option is as follows:


    ```

    WScript.Popup StrText,[Time],[TitleBarMsg],[DialogSettings])

    ```


    Response is a variable that stores numbers representing the button that was clicked
    by the user. StrText represents the message text to be displayed. Time is a value
    that determines how long, in seconds, the popup box will stay; if omitted, the
    default is zero. TitleBarMsg is an optional message that is displayed in the pop-up
    dialog box''s title bar. DialogSettings is a numeric value that specifies the
