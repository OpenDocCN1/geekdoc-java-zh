  md: '# Microsoft WSH and VBScript Programming for the Absolute Beginner, Fourth
    Edition


    # Skipping Lines


    Often reports and other files begin some type of heading or other information
    that you might not be particularly interested in. In these cases, you can skip
    the reading of these lines using the FileSystemObject''s Skip() and SkipLine()
    methods. The Skip() method allows your script to skip a specific number of characters
    at a time, whereas the SkipLine() method allows your script to skip entire entries.


    To use the Skip() method, you must pass the number of characters that you skipped
    as demonstrated here:


    ```

    objFileHandle.Skip(25)

    ```


    The SkipLine() method does not accept any arguments, so it can only be used to
    skip one line at a time. However, by wrapping the execution of this method within
    a loop, you can skip as many lines as you want as demonstrated here:


    ```

    For intCounter = 1 To 5

    objFileHandle.SkipLine()

    ```


    Next


    # Reading Files by Character


    To read a file or more characters at a time, you need to work with the FileSystemObject''s
    Read() method. This might be necessary for reading files with fixed length. For
    example, you might have a report file that lists a category or information in
    a column that begins at character position 20 and ends at character position 30
    on each line of the file. Using the Read() method, you could develop a VBScript
    that reads the file and pulls out only the information stored in that column for
    each line of the file.


    To get a glimpse of the Read() method in action, consider the following example.
    This script uses a For loop to skip the reading of the first five lines of the
    Sample.txt file. The Skip() method skips the first 15 characters on the next line
    in the file (line 6). The Read() method reads the next 22 characters from the
    file. The file is then closed and the text that was read from the file is displayed.


    ```

    Dim objFso, objFileHandle, intCounter, strDisplayString

    Set objFso = WScript.CreateObject("Scripting.FileSystemObject")

    Set objFileHandle = objFso.OpenTextFile("C:\Temp\Sample.txt", 1)

    ```


    ```

    For intCounter = 1 To 5

    objFileHandle.SkipLine()

    ```


    Next


    ```

    objFileHandle.Skip(15)

    strDisplayString = objFileHandle.Read(22)

    objFileHandle.Close

    ```


    ```

    MsgBox "C:\Temp\Sample.txt was created on " & strDisplayString

    ```'
  merge: -1
  pgno: 218
- img_proc: true
  md: 'Chapter 8 • Storing and Retrieving Data


    # Reading a File at Once


    Sometimes all you need to read is an entire file in a single operation, such as
    when the file to be read is already formatted to produce the output that you want.
    You can do this using the FileSystemObject''s ReadAll() method as demonstrated
    here:


    ```

    Dim objFso, objFileHandle, strDisplayString

    set objFso = WScript.CreateObject("Scripting.FileSystemObject")

    set objFileHandle = objFso.OpenTextFile("C:\Sample.txt",1)

    ```


    ```

    strDisplayString = objFileHandle.ReadAll()

    objFileHandle.Close()

    MsgBox strDisplayString

    ```


    As you can see, the script reads the entire file using ReadAll() operation and
    displays what it read using a MsgBox() statement. The output displayed when you
    run this script is exactly the same as shown in Figure 8.8, in which the script
    reads the entire file a line at a time before displaying the file''s contents.


    # Managing Files and Folders


    In addition to VBScript and the WSH to read and write to from files, you can use
    them to help administer all your files and folders. By administer, I mean to help
    keep them organized—or specifically, to automate the organization process. For
    example, if your computer is connected to a local area network, you can create
    a VBScript that makes copies of all the files it finds in certain folders and
    stores them on a network server. Then, if something ever happens to your original
    files, you can always recover them by retrieving a backup copy.


    The FileSystemObject object provides several methods for developing scripts that
    can automate administration:


    +   * CopyFile(). This copies one or more files.

    * MoveFile(). This moves one or more files.

    * DeleteFile(). This deletes one or more files.

    * FileExists(). This determines whether a file exists.


    The FileSystemObject object also provides a large collection of methods for automating
    folder administration:


    +   * CopyFolder(). This copies one or more folders.

    * MoveFolder(). This moves one or more folders.

    * DeleteFolder(). This deletes one or more folders.

    * FolderExists(). This determines whether or not a folder exists.

    * CreateFolder(). This creates a new folder.'
  merge: -1
  pgno: 219
- img_proc: true
  md: '# Microsoft WSH and VBScript Programming for the Absolute Beginner, Fourth
    Edition


    # Trick


    As an alternative to using methods belonging to the FileSystemObject object, you
    can also work with methods that jointly belong to the File and Folder objects:


    +   * Copy(). This copies a single file or folder.

    * Delete(). This removes a single file or folder.

    * Move(). This moves a single file or folder.


    There are a few drawbacks to these methods. First, using these methods requires
    that you instantiate both the FileSystemObject and the File or Folder object,
    which is just a little more work. Second, they work with just one file at a time
    as opposed to the methods belonging to the FileSystemObject object, which can
    work on more than one file or at a time. Finally, the File and Folder objects
    share the same methods, it''s easy to make a mistake and accidentally mess up.
    For example, if you have a file and a folder in the same location with the same
    or a similar name, it''s easy to accidentally delete the wrong one.


    # Copying, Moving, and Deleting Files


    Using the FileSystemObject''s CopyFile method, you can create a VBScript that
    can copy one or more files, as demonstrated in the following:


    ```

    Dim objFso

    Set objFso = WScript.CreateObject("Scripting.FileSystemObject")

    objFso.CopyFile "C:\Temp\Sample.txt", "C:\VBScriptGames\Sample.txt"

    ```


    In this example, a file named Sample.txt located in the Temp folder on the C:
    drive is copied to the VBScript folder on the C: drive. By modifying this example,
    as shown here, you can change the script so that copies more than one file. Specifically,
    this example results in all files named "Sample" being copied, regardless of their
    file extensions.


    ```

    Dim objFso

    Set objFso = WScript.CreateObject("Scripting.FileSystemObject")

    objFso.CopyFile "C:\Temp\Sample.*", "C:\VBScriptGames"

    ```


    # Trick


    Wildcard characters make it possible to copy, move, or delete more than one file
    or folder at a time. The * and ? characters enable pattern matching. The ? character
    is used to specify a single character match. The * character is used to match
    against an unlimited number of characters. For example, specifying *.txt in a
    match with all files that have a .txt extension. Specifying sample?.txt results
    in a match only with files that have a six-character long file name with "Sample"
    as the first five characters, and a .txt extension.'
  merge: -1
  pgno: 220
- img_proc: true
  md: '# Copying One or More Files


    You can copy one or more files using the CopyFile() method. This method also supports
    an additional parameter that allows you to specify what to do if the script attempts
    to copy a file to a folder that contains a file with the same name. You specify
    a value of either True or False for this parameter. A value of True CopyFile()
    to replace or override files with duplicate file names. A value of False CopyFile()
    to cancel the copy operation for files with matching names.


    The following example demonstrates how to copy all files with a .txt file extension
    located in the C:\Temp folder to a folder called C:\VBScriptGames without allowing
    any duplicate files already located in the destination to be overridden:


    ```

    Dim objFso

    Set objFso = WScript.CreateObject("Scripting.FileSystemObject")

    objFso.CopyFile("C:\Temp*.txt", "C:\VBScriptGames", "False")

    ```


    This next example does the exact same as the previous example, except that it
    allows duplicate files to be overridden:


    ```

    Dim objFso

    Set objFso = WScript.CreateObject("Scripting.FileSystemObject")

    objFso.CopyFile("C:\Temp*.txt", "C:\VBScriptGames", "True")

    ```


    > Trick

    Remember, you can avoid errors by using the FileSystemObject''s FileExists and
    FolderExists properties to verify whether a file or folder exists before manipulating
    it.


    # Moving One or More Files


    The difference between moving and copying files is that after you copy a file,
    you end up with two copies in two places, whereas you move a file, only the file
    exists in its new location. You can move files from one folder to another using
    the FileSystemObject''s MoveFile() method:


    ```

    Dim objFso

    Set objFso = WScript.CreateObject("Scripting.FileSystemObject")

    objFso.MoveFile("C:\Temp*.txt", "C:\VBScriptGames")

    ```


    In this example, all files with a .txt file extension are moved from the C:\Temp
    folder into the C:\VBScriptGames folder.'
