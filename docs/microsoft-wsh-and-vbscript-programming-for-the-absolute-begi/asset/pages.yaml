    \ total number of correct answers. What you need to do next is add logic to assign\
    \ the player rank based on the number of correctly answered questions. This can\
    \ be done using a Select Case statement, like this:\n\n```\nSelect Case intNumberCorrect\n\
    Case 5 'User got all five answers right\nstrRank = intNumberCorrect & \" stars*\"\
    \nCase 4 'User got four of five answers right\nstrRank = intNumberCorrect & \"\
    \ stars*\"\nCase 3 'User got three of five answers right\nstrRank = intNumberCorrect\
    \ & \" stars*\"\nCase 2 'User got two of five answers right\nstrRank = intNumberCorrect\
    \ & \" stars*\"\nCase 1 'User got one of five answers right\nstrRank = intNumberCorrect\
    \ & \" star*\"\nCase 0 'User did not get any answers right\nstrRank = intNumberCorrect\
    \ & \" stars*\"\nEnd Select\n```\n\nThe variable intNumberCorrect contains the\
    \ number of answers that the player has correctly answered. The value of this\
    \ is then compared against six possible cases to determine how many stars to award\
