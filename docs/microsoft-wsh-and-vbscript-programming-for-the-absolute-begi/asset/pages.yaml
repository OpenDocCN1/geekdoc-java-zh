    # Back to focus to the Knock Knock Game


    Let''s turn the focus of this chapter back to the development of the Knock knock
    game. This project will demonstrate the steps involved in creating and running
    your first VBScript game. Along the way, you''ll learn how to use VBScript to
    create a script that can communicate with the user via pop-up dialog boxes. You
    will also learn a little about conditional programming logic.


    # Designing the Game


    The Knock knock game''s design is very straightforward, involving basic programming
    techniques. The game begins by displaying the message “Knock Knock” in a pop-up
    dialog box. It waits for the player to reply by typing “Who’s there?” The game
    then replies “Panther” and waits for the player to respond by typing “Panther
    who?” at which time the punch line, “Panther no pans I’m going swimming” is displayed.
    If the player fails to exactly type the proper responses at any point of the game,
    an error message will be displayed inviting the player to try again.'
