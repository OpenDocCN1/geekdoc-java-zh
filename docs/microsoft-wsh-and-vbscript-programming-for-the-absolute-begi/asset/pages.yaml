    In this example, the first line of code checks to see if the script is running
    on Windows NT, 2000, XP, 2003, Vista, 2008, 2012, 7, or 8. If it isn''t, the second
    and third lines of code execute, informing the user of the situation and terminating
    the script''s execution.


    ![](img/337e6368245d3aad07236ff6d4dacf23_123_0.png)


    # Working with Collections of Related Data


    When using variables, you can store an incredible amount of information during
    the execution of your script. Indeed, you''re limited only by the amount of memory
    available on your computer. However, keeping up with large numbers of variables
    can be difficult and make your scripts difficult to maintain.


    Often, data items processed by a script have a relationship to one another. For
    example, if you write a script that collects a list of names from the user to
    generate a list of personal contacts, it would be more convenient to store and
    manage the list of names as a unit instead of a collection of individual names.
    VBScript provides support for arrays so that such a task can be performed.


    > An array is an indexed list of related data. The first element, or piece of
    data, in the array is assigned an index position of 0. The second element is assigned
    an index position of 1, and so on. Referring to an element''s index position,
    you can access its value.


    ItsMyParty is an example of a single-dimension array. VBScript is capable of supporting
    arrays with as many as 60 dimensions. In most cases, you''ll need to work with
    single-dimension arrays, so that''s where I''ll focus most of my attention.


    # Single-Dimension Arrays


    To create a single-dimension array, you use the Dim statement. When used in the
    creation of arrays, the Dim statement has to have the following syntax:


    ```

    Dim ArrayName(dimensions)

    ```'
  merge: -1
