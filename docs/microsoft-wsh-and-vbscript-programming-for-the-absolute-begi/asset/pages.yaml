    # Back to the Rock, Paper, and Scissors Game


    Now it''s time to go back to where this chapter started—talking about the Rock,
    Paper, and Scissors game. In this project, you will create a scripted version
    of this classic game. This version is a bit limited, that you''ve not yet had
    the chance to learn everything you need to create a more sophisticated version.
    However, you know enough to build the game''s foundation and get a working model
    going. In Chapter 5, “Conditional Logic,”you’ll return to this project and spice
    things up a bit.


    # Designing the Game


    The basic design of this game is simple. First, display the rules of the game,
    and ask the player to type rock, paper, or scissors. Next, have the script randomly
    pick a choice of its own and display the results.


    This project is completed in six steps:


    +   1. Define the resources used by this script.

    2. Display the game’s instructions.

    3. Provide a way for the user to select a choice.'
