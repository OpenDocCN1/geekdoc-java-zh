  md: '# What’s on the Companion Website?


    The best way to become a good script developer is to spend time writing new scripts.
    However, it helps to have a collection of scripts from which you can cut and paste
    when starting out. Hopefully, you''ve been creating the scripts that you''ve seen
    in this book as you''ve gone along. But just in case you missed some, I''ve added
    copies of each script to the book''s companion website. In this appendix, I''ll
    provide a brief reference to each of the scripts. The companion website can be
    found at www.cengageptr.com/downloads. Enter the name of the book or ISBN to find
    the files.


    # Script Examples


    Table E.1 provides a quick overview of all the sample scripts from this book that
    are located on the companion website.'
  merge: -1
  pgno: 447
