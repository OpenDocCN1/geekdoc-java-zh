    A single Registry key can be used to store any number of values. For example,
    the following statements establish a secure value named FileType under the GameKey
    and assign it a string of ".txt":


    # Accessing Informationored in the Registry


    After a Registry key and one or more values have been established, you can read
    them using the WshShell object''s RegRead() method. For example, the following
    statements read and then display the value stored in the previous example:


    ```

    Set objWshObject = WScript.CreateObject("WScript.Shell")

    strResults = objWshObject.RegRead("HKCU\GameKey\FileType")

    MsgBox strResults

    ```


    # Deleting Keys and Values


    Now let''s delete the two Registry values we''ve just created using the WshShell
    object''s RegDelete() method, as follows:


    ```

    Set objWshObject = WScript.CreateObject("WScript.Shell")

    objWshObject.RegDelete "HKCU\GameKey\FileType"

    ```


    In a similar fashion, you can delete the GameKey, deleting all the values that
    it stores, like like this:


    ```

    Set objWshObject = WScript.CreateObject("WScript.Shell")

    objWshObject.RegDelete "HKCU\GameKey"

    ```


    Take note of the character that follows GameKey in the previous statement. This
    character tells the RegDelete() method that the specified element is a Registry
    key and not a value.'
