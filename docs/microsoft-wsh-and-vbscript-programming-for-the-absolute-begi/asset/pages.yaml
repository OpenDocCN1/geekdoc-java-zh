  md: "# Chapter 14 • Adding a GUI to Your Scripts\n\n# Hint\n\nA complete review\
    \ of HTML and all the tags that it supports is beyond the scope of this book.\
    \ Instead, you will be introduced to commonly used tags that are used to build\
    \ effective GUIs. To take a deeper into HTML, you may wish to read HTML, XHTML,\
    \ and CSS for the Absolute Beginner (ISBN: 978-1354-5423-1).\n\n```\n<body>\n\
    <p>\n  <label for=\"userName\">Enter your name:</label>\n  <input type=\"text\"\
    \ name=\"textbox\" id=\"userName\" size=\"50\" maxLength=\"50\">\n</p>\n<input\
    \ type=\"button\" value=\"Click me!\" onclick=\"ShowResult()\">\n</body>\n```\n\
    \nIn this example, the <label> </label> tags are used to display a label text\
    \ on the top of the window. Immediately following the label is a text control.\
    \ The control is defined using an <input> tag with a type assignment of text.\
    \ It is assigned a name TextBox, allowing it to be programmatically referenced.\
    \ The text control is assigned a size that specifies its length (that is, how\
    \ many characters it can display) and is assigned a maximum length (that is, the\
    \ total number of characters it can contain). All of these tags are enclosed within\
    \ borders of <p> and </p> tags, which are paragraph tags that add a bit of space\
    \ in between interface controls. The last tag in the <body></body> section is\
    \ a second <input> tag, assigned a type of button, which is used to add a button\
    \ control to the window. Its value property is assigned a value of Click me! This\
    \ string is displayed on top of the button. Lastly, ShowResult is assigned to\
    \ the button's onclick event. As a result, the subroutine is executed whenever\
    \ the button is clicked.\n\n# The <style></style> Tags\n\nAn HTA <style></style>\
    \ tags are used to specify Cascading Style Sheet (CSS) rules governing the presentation\
    \ of the application. CSS is a style programming language that influences the\
    \ presentation of HTML content. CSS provides numerous advantages, separation of\
    \ content and presentation.\n\nCSS has a prioritization scheme that governs how\
    \ style rules are applied when one or more rules match the same element. As a\
    \ result, CSS rules cascade downward to document elements (HTML tags) in a predictable\
    \ manner. CSS rules are used to control presentation aspects such as font type,\
    \ size, and color, as well as background styles, and the alignment of content."
