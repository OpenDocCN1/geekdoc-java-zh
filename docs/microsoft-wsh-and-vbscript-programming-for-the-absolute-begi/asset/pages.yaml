    # Adding Text Controls


    As demonstrated, if you place an <input> tag in the <body></body> section of an
    HTA and assign its type attribute value of text, a single-line text control is
    added to the application window. The text control is made out of a rectangular
    text field with an insert border. Text controls are used to collect small amounts
    of text input. The following example demonstrates how to add control to an HTA.


    ```

    <p>

    <Label for="userName">Enter your name:</label>

    <input type="text" name="textBox" id="userName" size="50"

    length="50">

    </p>

    ```


    Here, the <input> tag includes a number of additional optional attributes that
    further configure the text control. These attributes are explained here:


    +   - size. This specifies the width (in number of characters) of the text control.

    - maxLength. This specifies the total number of characters of input (including
    blank spaces) of the text control can store.'
