    \nTable 5.1 lists VBScript comparison operators.\n\n| Operator | Description |\n\
    | --- | --- |\n| = | Equal |\n| <> | Not equal |\n| < | Less than |\n| > | Greater\
    \ than |\n| <= | Less than or equal to |\n| >= | Greater than or equal to |\n\n\
