  md: '# Chapter 9 • Handling Script Errors


    In addition to the initialization section and the main processing section, this
    script is made up of 13 separate procedures. Therefore, you will develop this
    in 15 steps, as follows:


    +   1. Create a new script, using your VBScript template and defining the variables,
    constants, and arrays that are used by this script.

    2. Develop the controlling logic for the main processing section.

    3. Develop the `DoWantToPlay()` function to create an introductory game splash
    screen and determine whether the user wants to play.

    4. Assign a list of words to an array using the `FillArray()` function.

    5. Create a loop in the `PlayGame()` function that controls the actual flow of
    the game, collecting player guesses and other functions as required.

    6. Retrieve a randomly selected word using the `RetrieveWord()` function.

    7. Display space-separated underscore characters representing each letter in the
    game word using the `InitialDisplayString()` function.

    8. Use the `FirstLevelValidation()` function to validate the player''s input to
    make sure the player is providing valid guesses.

    9. Use the `SecondLevelValidation()` function to check whether the player has
    already tried guessing before accepting it as input.

    10. Use the `TestLetterGuess()` function to check whether the player made an incorrect
    guess.

    11. Use the `NonGuessedString()` function to create a temporary string blanking
    out the letters correctly guessed by the player.

    12. Use the `CheckIfGameWon()` function to check whether the player has guessed
    all the letters that make up the mystery word.

    13. Use the `FlipString()` function to spin through the script created in step
    11, and reverse the display of each character of the string (that is, now show
    only the correctly guessed letters).

    14. Tell the player whether he won or lost using the `DisplayGameResults()` function.

    15. Display information about the game as it finishes using the `SplashScreen()`
    function.


