    # Designing the Game

    Let''s starting building the Math Game. This game will be assembled in five steps.
    The first three steps create the logic that interacts with the user and plays
    the game. The last two steps perform the game''s application demonstrations. These
    steps are as follows:


    +   1. Add the standard documentation template and define any variables, constants,
    and objects used by the script.

    2. Present the player with the equation and test the player''s response to determine
    whether he provided an answer and whether answer was numeric.

    3. Test to see whether the player provided the correct answer. If not, offer to
    show the user how to arrive at the correct answer.

    4. Add the statements required start and control the WordPad application.

    5. Add the statements to start and control the Calculator application.


