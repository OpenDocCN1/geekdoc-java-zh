    # Integrating VBScript with Other Applications


    In addition to create VBScripts that can interact with and control Windows resources,
    you can create VBScripts that automate the execution of popular Windows applications
    such as Microsoft Word and WinZip. In this section, you''ll see examples of how
    to use VBScript and the WSH to create a Word document and a ZIP file.


    # Automating the Generation of Microsoft Word Reports


    To use VBScript to automate Word tasks, you need to know a little something about
    the Word object model. The Application object resides at the top of the Word object
    model. The Application object is automatically instantiated when you use Start.
    Using properties and methods associated with the Application object, you can access
    lower-level objects and collections in the Word model. Using the properties and
    methods associated with the lower-level objects, you can automate any number of
    Word tasks.


    The following script provides a working example of how to use VBScript and the
    WSH to automate the creation of a Word document. Comments embedded within the
    script provide additional information about the Word object model.


    # Trick


    The Word object model is too large and detailed to be covered in this book. You
    can learn more about it here: http://msdn.Microsoft.com/office.'
