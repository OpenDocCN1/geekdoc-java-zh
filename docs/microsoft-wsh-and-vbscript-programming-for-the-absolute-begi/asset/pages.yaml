    # Working with List Controls


    Another type of useful controls is list-based controls. These include the list
    box control, the drop-down list control, and the multi-line list control. As checkbox
    and radio button controls, list-based controls display a pre-defined list of options
    from which the user can select.


    # Adding a List Box


    A list box control displays a pre-defined list of options from which a single
    selection can be made. Selection of an item from the list can trigger an event.
    However, it is more common to *not* trigger an event in this manner, and instead
    to add a button control to trigger the event. This allows the user to make a selection,
    change his mind, and then make a *different* selection before initiating the processing
    of the selection.


    A list box is added to an HTA by a combination of the `<select>` and `<option>`
    tags. The first step in creating a list box control is to use the `select` element
    to define the control using the format here:


    ```

    <label>Pick Size</label>

    <p>

    <select size="4" name="PickSize" onChange="ShowResult">

    </select>

    </p>

    ```'
