  md: 'Appendix A • WSH Administrative Scripting


    # Computer Administration


    The term computer administration represents a very broad category of tasks. Rather
    than try to list or explain them all, I''ll simply present you with two computer
    administration examples. The first example demonstrates how to use VBScript and
    the WSH to manage Windows services, and the second example demonstrates user account
    creation.


    # Managing Services


    On computers running the Windows 7 and Windows 8.1 operating systems, much of
    the operating system''s core functionality is provided in the form of services.
    These services perform tasks, such as managing Windows plug and play, handling
    the pooling of printer jobs, and automating the execution of scheduled tasks.
    By starting and stopping Windows, you can enable and disable Windows functions—that
    is, control what users can and cannot do.


    You can use the Windows net stop and net start commands to stop and start Windows
    services. To execute these commands from within a VBScript, you can use the WshShell
    object''s Run() method, as demonstrated in the following script:


    # Trap


    This script requires that you execute it with elevated privileges. To do so, locate
    and right-click the Windows Command Prompt icon and choose Run as Administrator
    from the menu that appears. Then navigate to the folder where the script resides
    and executes it.


    ```

    ********************************************************************

    ''Script Name: ServiceCycler.vbs

    ''Author: Jerry Ford

    ''Created: 02/25/14

    ''Description: This script demonstrates how to use VBScript to stop and

    ''start Windows services.

    ********************************************************************

    ```


    ''Initialization Section


    Option Explicit

    On Error Resume Next


    Dim objWshShl, strServiceToManage'
  merge: -1
  pgno: 409
- img_proc: true
  md: '# Microsoft WSH and VBScript Programming for the Absolute Beginner, Fourth
    Edition


    ''Instantiate the WshShell object

    Set objWshShl = WScript.CreateObject("WScript.Shell")


    #  ''Main Processing Section


    ''Prompt the user to specify the name of the service to cycle

    strServiceToManage = InputBox("What service would you like to cycle?")


    ''Call the procedure that stops a service

    StopService(strServiceToManage)


    ''Pause for five seconds

    WScript.Sleep(5000)


    ''Call the procedure that starts a service

    StartService(strServiceToManage)


    ''Terminate script execution

    WScript.Quit()


    # ''Procedure Section


    ```

    ''This subroutine stops a specified service

    Function StopService(ServiceName)

    objWshShl.Run("net stop " & ServiceName, 0, "True")

    End Function

    ```


    ```

    ''This subroutine starts a specified service

    Function StartService(ServiceName)

    objWshShl.Run("net start " & ServiceName, 0, "True")

    End Function

    ```


    The ServiceCycle.vbs script uses the Windows net stop and start commands to stop
    and start services. You can also use the WMI to control service status. An example
    of how to stop and start services using the WMI was provided in Chapter 13, “Working
    with the Windows Management Instrumentation."'
