    # Locating CIM Information


    The CIM is the repository used to store and organize all classes managed by the
    WMI. As mentioned, the WMI organizes classes into a hierarchy of namespaces. The
    hardest thing working with the WMI is arguably finding the classes that you need
    to when developing an administrative script. One excellent source of documentation
    regarding WMI classes is maintained by the Microsoft TechNet website at http://msdn.microsoft.com/en-us/library/a394554(v=vs.85).aspx
    (see Figure 13.9).


    Here you will not only find a listing of classes names, but by drilling down into
    specific classes, you''ll get lists of all the properties and methods defined
    in specific classes. Not all classes are available on all Windows operating systems
    by referring to that WMI documentation, can save yourself a great deal of frustration
    and confusion when you write script that works on one type of Windows operating
    system but not another.


    # Summary


    In this chapter, you learned how the WMI is architected and how its different
    components work together to facilitate the administration of managed resources.
    This chapter demonstrated how to retrieve and process WMI data using different
    classes. You learned how to use the WMI Query Language to formulate queries and
    retrieve WMI data and then learned how to incorporate the WMI into your VBScripts.
    In addition to using the WMI to retrieve data provided by different managed resources,
    you also learned how to use the WMI to interact with and administer resources.
    Lastly, you learned where to go to learn more about the different providers, classes,
    properties, and methods supported by the WMI.'
