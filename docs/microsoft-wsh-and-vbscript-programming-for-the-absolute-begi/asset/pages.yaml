    # Building the ValidateInput() Function


    The ValidateInput() function, shown here, uses a Select Case statement to process
    the input provided by players to determine whether it is valid. Input is valid
    if it is provided in the form of a valid cell range. Next, the function checks
    to make sure player did not accidentally click OK before a move. Last last test
    performed by this function checks to make sure that the cell specified by the
    player has not already been selected. This is done by checking whether the value
    assigned to the cell is anything other than a blank space. If it is, regardless
    of whether a of X or O has assigned, the cell is not available.


