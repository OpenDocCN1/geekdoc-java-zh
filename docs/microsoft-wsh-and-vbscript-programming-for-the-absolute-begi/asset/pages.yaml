  md: '# The Final Result


    I suggest that you run and test this script to make sure it works as expected.
    For example, try typing a letter instead of a number for the answer. Then typing
    nothing at all and just click OK or Cancel. Try both a correct and an incorrect
    answer and see what happens. This is a fairly lengthy script, so the odds of typing
    it correctly the first time are slim. If you get errors, read them carefully and
    see if the error message tells you what''s wrong and then fix it. Otherwise, you
    may need to double-check your typing.


    # Trick


    As scripts grow more complex, you''re going to run into more and more errors while
    developing them. I recommend that you learn to develop your scripts in a modular
    fashion, writing one section at a time and testing it before moving on to the
    next section. In Chapter 9, “Handling Script Errors,” I''ll demonstrate how to
    do this.


    # Summary


    In this chapter, you learned the core and run-time VBScript objects and their
    associated properties and methods, and were shown how to use them within your
    VBScripts. You also learned about VBScript syntax, reserved words, and special
    characters. In addition, you learned about and saw the power and convenience of
    VBScript functions. Finally, you learned different ways to display script output.


