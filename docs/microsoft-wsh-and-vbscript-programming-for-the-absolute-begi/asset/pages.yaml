  md: '# Microsoft WSH and VBScript Programming for the Absolute Beginner, Fourth
    Edition


    Set WMIService = GetObject("winmgmts:\" & trgtSystem)

    Set WMICollection = =

    WMIService.ExecQuery("Select * from Win32_NTLogEvent where " & \

    "LogFile = ''System'' and EventType = 1", , 48)


    For Each WMIObject In WMICollection

    Wscript.Echo "Operating System: " & WMIObject.Message

    Next

    End Function


    As this demonstrates, working with the ExecQuery method, you must pass it a query
    string that identifies the WMI class that you want to access. Here, the query
    string begins with the Select keyword followed by the * character, which instructs
    the WMI to return all matching instances from the Win32_NTLogEvent class, where
    the keyword is used to refine the query. When used, the query creates a map up
    of class property, an operator, and a constant value. In the case of this script,
    two properties are specified, LogFile and EventType, and the equals operator is
    used. Figure 13.4 provides an example of the type of output that you might see
    when this example is executed on a computer running Windows 8.1. System is specified
    by the value for LogFile, and 1 is specified for EventType.


    # Hint


    You can modify the script to work with different event logs by specifying a different
    log name, such as application. By setting EventType to 1, you instructed the query
    to retrieve error records. You could easily assign a value of 2 to retrieve warning
    records, 3 for information records, 4 for security audit success, or 5 for security
    audit failure records.


    ```

    C:\Scripts>GetEventLog.vbs

