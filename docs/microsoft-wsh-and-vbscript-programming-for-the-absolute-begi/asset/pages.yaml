  md: '# Chapter 5 • Conditional Logic 127


    ![](img/337e6368245d3aad07236ff6d4dacf23_147_0.png)


    **Figure 5.4** A flowchart outlining the logic behind a typical If statement.
    © 2014 Cengage Learning.


    In the Real World

    Programmers sometimes begin script development by first creating a flowchart.
    The flowchart depicts the logical flow of a script or program as a visual tool
    for script development and provides a valuable documentation tool. Flowchart development
    can be a big help in the creation of complex scripts. Flowcharts help programmers
    formalize their thoughts before script development begins.


    You can expand the If statement by adding one or more ElseIf keywords, each of
    which can test another alternative condition. For example, look at the following
    VBScript statements:


    ```

    If X = 250 Then

    WScript.Echo "Go buy that TV!"

    WScript.Echo "Buy a TV Guide while you are at it."

    WScript.Echo "And do not forget to say thank you."

    ElseIf X = 200 Then

    WScript.Echo "Buy the VCR"

    ElseIf X = 100 Then

    WScript.Echo "Buy the Radio."

    Else

    WScript.Echo "OK. Maybe you had best just eat lunch."

    End If

    ```


    # Nesting If Statements


    Another way to use If statements is to embed them within each other. This enables
    you to develop scripts that test for a condition and then further test other conditions
    based on the result of the previous test.'
