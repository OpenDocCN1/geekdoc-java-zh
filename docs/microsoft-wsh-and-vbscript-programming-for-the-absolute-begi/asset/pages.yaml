  md: '# Chapter 4 • Constants, Variables, Arrays, and Dictionaries


    To summarize, the following list provides the guidelines that you should follow
    when working with vari-ables:


    +   - Define the variables at the beginning of your scripts in one location.

    - Use the Option Explicit statement to enforce formal variable declaration.

    - Use the Dim statement to define each variable.


    Up to this point in the chapter, I have not been following these rules because
    I had not gotten to them yet. However, from this point on, you''ll find them applied
    consistently in every script that you use.


    # Trick


    There is one exception to the set of rules that I want to point out. In certain
    cases, you can limit the avail-ability of a variable and its value to a specific
    portion of your scripts. This is called "creating a local vari-able" and can be
    useful when manipulating a sensitive variable to make sure that its is not acci-dently
    modified by other parts of the script. I''ll provide more information about local
    variables a little later in this chapter.


    # Variable Naming Rules


    Another important that merits attention is the proper naming of variables. VBScript
    has a number of rules that you must follow to avoid errors from inappropriately
    named variables. These rules include the following:


    +   - Variable names must be fewer than 256 characters long.

    - Variable names must begin with an alphabetic character.

    - Only letters, numbers, and the underscore (_) character can be used when creating
    variable names.

    - Reserved words cannot be used as variable names.

    - Variable names cannot contain spaces.

    - Variable names must be unique.


    One more thing to know about VBScript variables is that they are case insensitive.
    That means capitalization does not affect VBScript''s capability to recognize
    a variable. Therefore, if a script defines a variable as MyBirthday and then refers
    it as MYBIRDAY, VBScript will recognize both spellings of the variable name as
    the same. However, mixing cases in this manner can be confusing to anyone look-ing
    at your code, so you should do your best to use a consistent case throughout your
    scripts.'
