  md: 'The following is a list of rules that you should keep in mind as you write
    VBScripts:


    +   - By default, all VBScript statements must fit on one line.


    +   - You can spread a single statement over multiple lines by ending each line
    with the _ (continuation) character.


    +   - You can place more than one VBScript statement on a single line by ending
    each statement with the : (colon) character.


    +   - By default, VBScript is not case sensitive, meaning that VBScript regards
    different case spelling of words used by variables, constants, procedures, and
    subroutines as the same.


    +   - You can enforce case sensitivity by adding the Option Explicit statement
    to the beginning of your VBScripts.


    +   - By default, an error will halt the execution of any VBScript.


    +   - You can prevent an error from terminating a VBScript''s execution by adding
    the On Error Resume Next statement to your VBScripts.


    +   - Extra blank spaces are ignored within scripts and can be used to improve
    VBScript''s format and presentation.


    Every VBScript statement has its own specific syntax that must be exactly followed.
    Failure to properly follow a statement will result in an error. Let''s look at
    an example. The following statement tries to use the VBScript''s MsgBox() function
    to display a text message:


    MsgBox "Thanks for playing!


    Unfortunately, the statement syntax requirements have not been followed. The MsgBox()
    function requires all text messages be enclosed within a pair of quotation marks.
    If you look closely, you will see the closing quotation mark is omitted. Figure
    3.5 shows the error produced on a computer running Windows 8.1 by this statement
    at run-time.


    ![](img/337e6368245d3aad07236ff6d4dacf23_75_0.png)


    **Figure 3.5** The error message caused by an unmatched quotation mark in a MsgBox()
    statement.


    © 2014 Microsoft Corporation. Used with permission from Microsoft.'
