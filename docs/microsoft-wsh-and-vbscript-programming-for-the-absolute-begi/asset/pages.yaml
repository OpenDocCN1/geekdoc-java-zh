  md: '# Game Development


    The following steps outline the process you''ll go through to complete the development
    of the game:


    +   1. Create a basic HTML file and add the <HTA:APPLICATION> tag to it.

    2. Build the application''s GUI by adding appropriate controls in the <body> </body>
    section.

    3. Port over and convert the WSH Rock, Paper, Scissors game''s programming logic.

    4. Add a CSS to the application to further enhance its presentation.


    # Step 1: Start with a Basic HTML File


    Begin this by creating a new HTA named RockPaperScissors.HTA. Then add the following
    HTML to it. As you can see, there is nothing other than the standard HTA template
    with little tweaking of the <HTA:APPLICATION> tag.


