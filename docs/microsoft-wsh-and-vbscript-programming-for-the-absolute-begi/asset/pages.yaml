    WScript.Echo "This says that I will be " & intMyAge


    If you run this script on a computer running Windows 8.1, you''ll see the results
    shown in Figure 4.8.

    The first four calculations should be fairly easy to understand. In the first
    calculation, I took the value of intMyAge and added 1 to it. Similarly, I subtracted
    1 in the next calculation and then multiplied intMyAge by 2 in the third statement.
    The final calculation requires a little more explanation. You may have been surprised
    by this calculation''s result. At first, it appears that VBScript will try to
    solve the equation as follows:


    +   1. Divide intMyAge (which is 74) by 5 to get 14.8.

