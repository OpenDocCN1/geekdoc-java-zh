    # Enabling and Disabling the Windows Script Host


    It is no secret that today''s computers exist under the threat of viruses, worms,
    and other pesky computer programs designed to spy on, or otherwise harm or take
    over your computer. In the past, clever people exploited the power and convenience
    of the WSH to spread and infect computers using scripts. Many defenses have been
    developed to combat these threats. For example, several email providers scan emails
    and email attachments for threats and block them if a threat is discovered. Likewise,
    anti-virus programs can be installed to help protect computers from these threats.
    Firewalls can also be used to protect computers or entire computer networks.


    Despite these protections and precautions, threats still persist. One way people
    have dealt with in the past has been to try to block the unauthorized execution
    of programs and scripts. In the case of the WSH, some people have disabled it.'
  merge: -1
  pgno: 61
- img_proc: true
  md: '# Microsoft WSH and VBScript Programming for the Absolute Beginner, Fourth
    Edition


    If you have inherited a computer with the WSH disabled, you will receive the following
    notification the first time you attempt to run a VBScript using the WSH:


    CScript Error: Windows Script Host access is disabled on this machine. Contact
    your administrator for details.


    # Re-enabling the WSH


    If the WSH has been disabled on your computer, you can re-enable it using one
    of the following procedures. However, doing so requires administrative-level privileges.
    If you lack these privileges, you will need to seek out your computer administrator
    and request that this procedure be performed. The first procedure will reenable
    WSH only for yourself when you are logged on to the computer. The second procedure
    will reenable WSH execution for any user logged to the computer.


    To re-enable the WSH for an individual user, do the:


    +   1. Click the Start button, type Regedit in the Search field, and press Enter
    to open the Regedit utility.

    2. Click Yes when prompted by the User Account Control dialog.

    3. Navigate to the following key: HKEY_CURRENT_USER\Software\Microsoft\Windows
    Script HostSettings.

    4. Under DWORD, look for an Enabled entry. If it is present, double-click it and
    change its assigned value to 1. If it is not present, right-click the Settings
    key and select New > DWORD. Then type Enabled as its name. Finally, double-click
    the Enabled DWORD entry and assign it a value of 1.

    5. Close Regedit.


    To re-enable the WSH for all users of a computer, do the:


    +   1. Click the Start button, type Regedit in the Search field, and press Enter
    to open the Regedit utility.

    2. Click Yes when prompted by the User Account Control dialog.

    3. Navigate to the following key: HKEY_LOCAL_MACHINE\Software\Microsoft\Windows
    Script HostSettings.

    4. Under DWORD, look for an Enabled entry. If it is present, double-click it and
    change its assigned value to 1. If it is not present, right-click the Settings
    key and select New > DWORD. Then type Enabled as its name. Finally, double-click
    the Enabled DWORD entry and assign it a value of 1.

    5. Close Regedit.


    # Disabling the WSH


    If, after enabling the WSH on your computer, you decide that you need to return
    it to a disabled state, you can do so using one of the following procedures. The
    first procedure blocks WSH execution only when you are logged on to the computer.
    The second procedure affects any logged in user of the computer.'
  merge: -1
  pgno: 62
