    # Creating Event Procedures


    Custom VBScript objects automatically support two events. These events execute
    as follows:


    +   * Class_Initialize. This executes whenever a new instance of an object is
    instantiated.

    * Class_Terminate. This executes whenever an instance of an object is destroyed.


    The definition of these events is optional. When defined, the Class_Initialize
    procedure performs tasks such as the definition of variable default values. Similarly,
    the Class_Terminate procedure performs any cleanup that may be required after
    an object is no longer needed. For example the following statements define an
    initialization procedure for the SuperHero object from the previous example.'
