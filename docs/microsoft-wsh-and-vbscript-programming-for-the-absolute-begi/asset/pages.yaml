  md: '# Microsoft WSH and VBScript Programming for the Absolute Beginner, Fourth
    Edition


    # VBScript Capabilities


    VBScript cannot execute without an execution host. Therefore, the language''s
    capabilities vary greatly based on where they are run. For example, when embedded
    in HTML pages, VBScript can access and manipulate forms, frames, links, images,
    and other objects that are based on Web pages. When inside ASP pages, VBScripts
    have access to server-based resources such as databases. However, because the
    purpose of this book is to teach you how to program using VBScript within the
    context of the WSH, I think it''s best that we focus on the capabilities that
    VBScript has when executed in this environment.


    As I will show you throughout this book, you can create games using VBScript and
    the WSH. While game development is a great way to have fun while learning a new
    language, it''s important to understand the reason Microsoft enabled VBScript
    to operate in the WSH and to be familiar with the capabilities that Microsoft
    has given to VBScript within the context of WSH script development.


    VBScript provides programmers with a quick development tool for creating small
    applications and utilities and for prototyping new applications. System and network
    administrators use these tools to automate administrative tasks, such as the following:


    +   - Creating user and group accounts

    - Configuring the desktop

    - Creating ad hoc reports

    - Automating network file, folder, and drive administration

    - Managing Windows services

    - Administering local and network printers


    Some tasks simply take a long time to perform manually or must be done so frequently
    that they become bothersome. By providing the ability to automate these tasks,
    VBScript provides a powerful easy way to use programming tools. Once developed,
    script execution can be automated using the Windows script service. This allows
    you to run your scripts at the times that are most convenient for you.


    For example, suppose you wrote a script that reorganizes files on your computer
    by moving them from various folders into a centralized location. When, at the
    end of each month, you can run the script and reorganize a month''s worth of file
    placement. The number of files to be moved may be such that it takes a script
    to complete its work, during which the computer runs slowly and is no fun to use.
    Fortunately for you, however, VBScripts can be scheduled. You can set up the execution
    of this script to run at night, over the weekend, or any time you don''t plan
    on using your computer.


    # VBScript''s Roots


    Microsoft first released VBScript in 1996 as a Web-based client-side scripting
    language for Internet Explorer 3.0. At the same time, another Web-based client-side
    scripting language, JavaScript, was already making big waves in the Internet community.
    Despite the similarity in name, JavaScript had very little in common with Java,
    which was also fast becoming popular in the mid to late 1990s.'
  merge: -1
  pgno: 42
- img_proc: true
  md: '# Chapter 1 • Getting Started with the WSH and VBScript


    As mentioned, VScript’s popularity as a client-side Web-scripting language has
    continued over the years, while Script’s stalled. Even today, the only way to
    perform client-side Web scripting and to be sure that everyone with an Internet
    browser access is to use JavaScript.


    Still, Microsoft has remained committed to the development of VScript over the
    years. It released VScript 2.0, along with IIS 3.0, turning VScript into a server-side
    Web-development language. New developers could embed VBScripts into their ASP
    pages, giving them the ability to access local databases and create dynamic HTML
    pages.


    VScript’s big break came with VScript 3.0. This version was packaged with multiple
    Microsoft products, including the following:


    +   * Internet Explorer 4.0

    * IIS 4.0

    * Outlook 98

    * Windows Scripting Host


    VScript 3.0 could now be used as a scripting language for Microsoft’s email client.
    However, VScript really took off when it was included as a scripting language
    for the WSH. Visual Basic programmers, administrators, and technology enthusiasts
