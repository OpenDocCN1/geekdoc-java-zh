- img_proc: true
  md: '# Microsoft WSH and VBScript Programming for the Absolute Beginner, Fourth
    Edition


    ![](img/337e6368245d3aad07236ff6d4dacf23_360_0.png)


    **Figure 14.1** It is obvious from the start that the HTA version of the Rock,
    Paper, Scissors game looks and acts a lot more like a Windows application. © 2014
    Cengage Learning.


    ![](img/337e6368245d3aad07236ff6d4dacf23_360_1.png)


    **Figure 14.2** The HTA version of the game is played by clicking on graphical
    button controls, speeding up game play and eliminating types. © 2014 Cengage Learning.


    # Introducing HTML Applications (HTAs)


    An HTML Application (HTA) is a Windows program made of HTML and a scripting language.
    The scripting language, which in the case of this book is VBScript, must be an
    Internet Explorer-supported scripting language.


    HTAs are full-featured Windows applications. HTAs look and execute like other
    Windows applications, including those developed using programming languages like
    Visual Basic, Java, and C++. An HTA executes as a trusted Windows application.
    As such, it executes outside of the constraints of Internet Explorer''s security
    restrictions.


    > An HTML Application (HTA) is computer program that consists of HTML, Dynamic
    HTML, and Internet Explorer-supported scripting languages like VBScript, which
    has a GUI and executes without the limitations that Internet Explorer normally
    imposes on applications.'
  merge: -1
  pgno: 360
- img_proc: true
  md: '# Chapter 14 • Adding a GUI to Your Scripts 341


    This allows it to do things that browser-based scripting prevents, like accessing
    the computer''s file system and Registry. HTAs can also interact with WMI. HTAs
    enable administrators to wrap their scripts inside a graphical user interface
    (GUI). HTAs are also used to prototype Windows applications, create desktop applications,
    develop widgets, and so on.


    Even though they include HTML, HTAs execute in a different process than Internet
    Explorer. HTAs are executed by the mshta.exe execution host, which is analogous
    to the WSH Script.exe and Cscript.exe execution hosts. When you execute an HTA
    script, the mshta.exe execution host initializes Internet Explorer''s rendering
    engine and the scripting engine (for example, vbscript.dll). Execution by the
    mshta.exe execution host allows scripts to access the WSH core object model. There
    are, however, some limitations. For example, an HTA cannot access the Wscript
    object''s methods, most notably Quit, Echo, and Sleep. These methods are only
    available when your scripts are executed by Wscript or Cscript.exe. The mshta.exe
    execution host has no equivalents.


    HTAs have access to the Internet Explorer DOM, which provides them with access
    to browser controls (for example, text boxes, option buttons, checkbox controls,
    etc.). Using these elements, you can construct the GUIs for your scripts. Another
    benefit of HTAs is that in addition to the Internet Explorer DOM, you have access
    to HTML, XHTML, and even CSS. You can therefore leverage these optional technologies
    in your HTAs.


    # Trap


    To execute an HTA, Internet Explorer must be enabled on the computer. Other Web
    browsers are not supported. Therefore, any computer on which you execute an HTA
    must have Internet Explorer enabled. Starting with Microsoft Vista, Internet Explorer
    is an optional application, so it may not always be available.


    # How Do HTAs Compare to HTML Pages?


    Like WSH scripts, HTAs are text files. HTML files are organized like HTML files,
    however. If you are familiar with Web page development, learning how to develop
    HTA files should come easily to you. Even if you have not done prior Web development,
    don''t worry. This will teach the basics and get you up and running quickly. The
    following example shows the construction of a basic HTML page:


    ```

    <html>

    <head>

    <title>A Simple HTML Page</title>

    </head>

    <body>

    <h2>Hello World!</h2>

    </body>

    </html>

    ```'
