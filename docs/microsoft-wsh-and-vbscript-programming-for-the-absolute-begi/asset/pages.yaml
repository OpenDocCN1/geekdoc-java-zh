    # Examining Scripting Environments


    As discussed in Chapter 1, “Getting Started with the WSH and VBScript,” this book''s
    primary focus is in teaching you how to program through the development of VBScripts
    executed using the WSH. VBScript, like JScript, is an ActiveX scripting engine.
    A scripting engine provides the operating system with access to a dynamic library
    (DLL), which supports a given scripting language. In the case of VBScript, the
    DLL is VBScript.dll. (For JScript, it is JScript.dll.) These DLL files are stored
    in C:\Windows\System32. The DLL itself never executes. Instead, it is called by
    an execution host like those provided by IE and the WSH.'
