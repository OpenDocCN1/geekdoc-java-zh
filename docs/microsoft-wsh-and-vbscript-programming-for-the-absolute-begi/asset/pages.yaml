  md: '# Microsoft WSH and VBScript Programming for the Absolute Beginner, Fourth
    Edition


    # Configuring WScript.exe and CScript.exe Command-Line Execution


    You can use either the WScript.exe or CScript.exe execution host to run any VBScript.
    Generally speaking, you''ll use the WScript.exe execution host to run scripts
    that need to pop-up dialog boxes, and the CScript.exe execution host to run scripts
    silently in the background.


    Even though they have their own configuration settings, both the WScript.exe and
    CScript.exe execution hosts are configured in the same way, using the exact set
    of options. The syntax used to configure these two execution hosts is follows:


    ```

    wscript [/options]

    cscript [/options]

    ```


    Begin by opening a Windows Console. At the Windows command prompt, type the name
    of the execution host that you want to configure followed by one or more options,
    each of which is preceded by the // characters.


    # Trap


    Any changes you make to the default execution host will affect your scripts only.
    If you share a computer with another, that person''s WSH execution host settings
    will not be affected. If you want the settings to be standardized for all of your
    computers, make each user set them accordingly.


    Table 2.1 lists the configuration options supported by the WScript.exe and CScript.exe
    execution hosts.


    | TABLE 2.1 COMMAND-LINE OPTIONS FOR THE WSCRIPT.EXE AND CSCRIPT.EXE EXECUTION
    HOSTS |

    | Configuration Option | Purpose |

    | //? | Displays the command syntax for the CScript.exe and WScript.exe execution
    hosts. |

    | //b | Runs a script in batch mode, where all errors and message output are suppressed.
    |

    | //d | Turns off script debugging. |

    | //e:jscript | e:vbscript | Sets the script engine that is used to run the script.
    |

    | //h:wscript | h:script | Sets the execution host that is used to run the script.
    |

    | //i | Runs the script actively, displaying all errors and message output. |

    | //job:id | Identifies a specific job within a Windows script file to run. |

    | //logo | Displays the CScript or WScript host at the start of script execution.
    |

    | //nologo | Suppresses the daily specified options and sets them as the default
    settings. |

    | //s | Saves the currently specified options |

    | //t:nn | Establishes a timeout value that limits how long a script can run.
    By default, there are no execution time limits imposed on script execution. |

    | //x | Turns off script debugging. |


    © Jerry Lee, Jr. All Rights Reserved.'
