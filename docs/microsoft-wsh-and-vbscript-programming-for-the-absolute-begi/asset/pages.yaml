    The rest of the template is divided into three sections:


    +   - The initialization section. This contains statements that globally affect
    the scripts, including Option Explicit and On Error, as well as the declaration
    of any variables, constants, arrays, and objects used by the script.

    - The main processing section. This section contains statements that control the
    main processing logic of the script.

    - The procedure section. This section contains all the script’s procedures. *Procedures*
    are groups of statements that can be called and executed as a unit. You’ll learn
    how to work with procedures in Chapter 7, “Using Procedures to Organize Scripts.”


    # Mastering the VBScript Object Model


    In Chapter 2, “An Introduction to the Windows Host,” you learned about the WSH
    core object model and its properties and methods. You also learned how to instantiate
    WSH objects to access and manipulate their properties and methods. VBScript also
    provides two collections of objects that you can use in your scripts. Table 3.3
    provides an overview of VBScript’s built-in or core objects.'
