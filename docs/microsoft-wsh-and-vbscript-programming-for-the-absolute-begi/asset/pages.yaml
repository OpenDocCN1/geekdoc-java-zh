  md: '# Chapter 12 • Combining Different Scripting Languages


    In the real world, time is money. Saving time during script development means
    that you can get done in less time. One experienced programmers save time by creating
    reusable code. You can use Windows Script Files to save development time by externalizing
    scripts that perform common tasks. That way, you can use a reference to scripts
    in any number of Windows Script Files without reinventing the wheel. In addition,
    you''ll save yourself a lot of maintenance work if you ever need to modify a commonly
    used external script, you''ll only have to make the change to the script once.
    This is preferable to making the same change over and over again in any scripts
    where you embedded copies of the script.


    Let''s look at an example of how to create a Windows Script File that includes
    both an embedded VBScript and one that is externally referenced. As you can see,
    the following Windows Script File includes a reference to two VBScripts:


    ```

    <script language="VBScript">

    MsgBox "This message is being displayed by an embedded VBScript"

    </script>

    <script language="VBScript" src="TestScript.vbs" />

    </job>

    ```


    The embedded VBScript simply displays a text message stating that it has executed.
    Similarly, the external VBScript might consist of a single statement that uses
    the MsgBox() function to display a similar message:

    MsgBox "This message is being displayed by an external VBScript"


    If you create these scripts and double-click the Windows Script File, you''ll
    see that both scripts will execute and display their pop-up dialog box in sequence.


    # Executing Your Windows Script Files


    As you know, you can run a Windows Script File by double-clicking it. When this
    started, the Windows Script File runs the first job that has been defined. If
    more than one job has been defined within the Windows Script File, you can execute
    any job by running the script from the Windows command prompt and specifying the
    job''s ID, as demonstrated next. Of course, every script contained within the
    job will be executed.


    Let''s look at some examples of how to run Windows Script Files from the Windows
    command prompt. To run the first script in a Windows Script File that contains
    two jobs, just type the name of an execution followed by the name of the Windows
    Script File:


    ```

    cscript TestWsfScript.wsf

    ```'
