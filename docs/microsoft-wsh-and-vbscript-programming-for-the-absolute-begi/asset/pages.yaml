    # ### An Overview of <HTA:APPLICATION> Tag Attributes and Properties


    The inclusion of the <HTA:APPLICATION> tag in the <head></head> section of an
    HTA provides you with the ability to customize the look and operation of the window
    within which the HTA executes. Table 14.1 provides a list of all the attributes
    and properties that are exposed by the HTA:APPLICATION object. By specifying and
    configuring these attributes in the <HTA:APPLICATION> tag, you can exercise detailed
    control over the look and operation of the application window within which an
    HTA executes.'
