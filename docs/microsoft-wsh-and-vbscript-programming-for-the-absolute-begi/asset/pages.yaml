    # # Writing to Files


    You have a number of different options when it comes to how your VBScripts write
    text to files:


    +   - Writing one or more characters at a time

    - Writing a line at a time

    - Writing blank lines


    Writing one or more characters at a time is good when you need to carefully format
    text output, such as when you want to create reports with data lined up in columns.
    On the other hand, writing out one line of text at a time is convenient when the
    format is more free form. Finally, inserting or writing lines into files helps
    you improve the file''s appearance, such as adding space between the heading and
    the text in a formal report.


    # # Writing Characters


    To write text to one or more characters at a time, you need to use the FileSystemObject
    object''s Write() method. This method does not append a carriage return to the
    end of any text that it writes. If two back-to-back operations are performed using
    the Write() method, the text from the second write operation is inserted into
    the text file on the same line immediately following the text written by the first
    script. To do this, take a look at the following example:


    ```

    objFso = WScript.CreateObject("Scripting.FileSystemObject")

    objFileHandle = _

    objFso.OpenFile("C:\Temp\Sample.txt", 2, "True")

    objFileHandle.Write("Once upon a time there \nobjFileHandle.Write("were three
    bears.")

    objFileHandle.Close()

    ```'
