    to the Extensible Markup Language, or XML, which allows different scripting languages
    to be combined into Windows Script Files. Specifically, you will learn the following:


    +   - How to combine VBScript with another scripting language to create Windows
    Script Files

    - How XML is used to format Windows Script Files

    - A sneak peek at the Jscript scripting language

    - How to execute Windows Script Files


