  md: 'Chapter 4 • Constants, Variables, Arrays, and Dictionaries


    # Back to the Story of Captain Adventure


    Now let''s return to the chapter''s programming project, the Story of Captain
    Adventure. In this programming project, you''ll develop a script that displays
    a story describing how your story''s hero, Captain Adventure, first gets his superpowers.
    Through the development of this script, you''ll have the opportunity to put your
    knowledge of how to work with VBScript constants, variables, and string formatting
    constants to the test.


    # Designing the Game


    The basic design of this project is to ask the user a bunch of questions (without
    telling the player what the answers will be used for) and then use the information
    provided by the player to build a comical action story about a fictional hero
    named Captain Adventure.


    This project will be completed in five steps.


    +   1. Add the standard documentation template and fill in its information.

    2. Define the constants and variables that will be used by the script.

    3. Create the splash screen that welcomes the user to the story.

    4. Use the InputBox() function to create variables that store user-supplied data.

    5. Write the story, adding the data stored in the script''s variables and constants.
    In addition, use VBScript strings to control the manner in which the story text
    is formatted before displaying the story using the MsgBox() function.


    # Beginning the Captain Adventure Script


    The first step in putting this project together, now that an outline of the steps
    involved has been defined, is to open your editor and set up your script template
    as follows:


    ```

    ********************************************************************************

    ''Script Name: Captain Adventure.vbs

    ''Author: Jerry Ford

    ''Created: 02/01/14

    ''Description: This script prompts the user to answer a number of questions

    ''and then uses the answers to create a comical action adventure story.

    ********************************************************************************

    ```


    ''Perform script initialization activities

    Option Explicit


    This template, introduced in the last chapter, gives you a place to provide some
    basic documentation about the script you''re developing. In addition, the template
    includes the Option Explicit statement, based on the assumption that just about
    any script you''ll develop will use at least one variable.'
