    # Building the ManageGame() Function


    The ManageGame() function that is controlled by a Do...Until loop that executes
    until the value assigned to a variable blGameGameOver is set to True. Within the
    loop, the function begins by performing a series of checks to determine whether
    the game has already won. The first check looks to see whether player X has won.
    If this is the case, the value assigned to strNotificationMsg is set to Game over!
    Player X wins and the value assigned to a variable strDirection is used to identify
    the game was won. The display string assigned to strNotificationMsg is later used
    by the DisplayGameResults() function. The next check looks to see whether player
    O won. The last check looks to see whether the game has ended in a tie.


    ```

    Function ManageGame() ''Manage the overall execution of the game

    Do Until blGameGameOver = "True"

    ```


    ```

