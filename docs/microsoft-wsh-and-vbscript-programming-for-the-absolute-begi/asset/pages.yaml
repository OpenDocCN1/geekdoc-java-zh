    # Working with the Err Object


    The Err object provides access, via its properties, to information about run-time
    errors. For example, using the Err object''s Description property, you can retrieve
    a string containing an error''s description. Using the Err object''s Number property,
    you can retrieve the error number associated with an error. And using the Err
    object''s Source property, you can retrieve the name of the resource that reported
    the error.'
  merge: -1
  pgno: 294
- img_proc: true
  md: '# Chapter 11 • Working with Built-in VBScript Objects


    The Err object also provides access to two methods:


    +   - Clear(). The Clear() method clears out the properties belonging to the Err
    object. This is handy in situations when you can develop an effective error-handling
    routine that enables your script to recover from an error and keep running.

    - Raise(). The Raise() method is useful, giving you the ability to simulate run-time
    errors so you can test your script''s error-handling procedures.


    For additional information and examples on how to work with the Err object, refer
    to Chapter 9, "Handling Script Errors."


    # Working with Regular Expressions


    All remaining VBScript-in objects and collections deal with regular expressions.
    A regular expression is a pattern consisting of characters and metacharacters.
    Regular expressions are used as a means of searching and replacing patterns within
    strings.


    The first step in preparing your VBScripts to work with regular expressions is
    to instantiate the RegExp object. This object provides access to the remaining
    built-in VBScript objects. The RegExp object is instantiated as follows:


    ```

    Dim objReg

    Set objExp = New RegExp

    ```


    The RegExp object provides access to the following methods:


    +   - Pattern. This identifies the pattern to be matched.

    - IgnoreCase. This contains a value of True or False depending on whether a case-sensitive
    search is performed.

    - Global. This is an optional Boolean value used to indicate whether all occurrences
    of the specified pattern are replaced.


    The RegExp object provides access to several methods, including the following:


    +   - Replace(). This replaces matching string patterns.

    - Test(). This performs a pattern search, generating a Boolean value based on
    whether a match is found.

    - Execute(). This provides the ability to generate a Matches collection.'
