  md: '# Chapter 10 • Using the Windows Registry to Configure Script Settings


    By the time you''ve finished writing the new Hangman setup script and modifying
    the original Hangman game, you''ll have a basic understanding of the Windows Registry
    and what it means to access and modify its contents. You will also know how to
    retrieve data stored in external files to use it as input in VBScripts.


    # Introducing the Windows Registry


    Since the introduction of Windows 95, the Registry has been the central repository
    for configuration information on all Microsoft operating systems. The Registry
    is a type of built-in database that acts as a central repository for configuration
    settings. Windows uses it to store information that affects every component of
    the computer, including the following


    +   * Windows operating system configuration settings

    * Software configuration settings

    * User configuration settings

    * Windows services configuration settings

    * Hardware configuration settings

    * Software device driver configuration settings


    As you can see, the Registry is used to store information regarding just about
    every aspect of the computer and its operation. It only makes sense, then, by
    making changes to the Registry, you can configure the appearance, behavior, and
    operation of just about anything that affects the computer. For example, you could
    directly change the appearance and behavior of the Windows desktop or screensaver
    by making the appropriate changes to the Registry.


    The Registry is critical to the operation of Windows computers that you actually
    interact with every day, perhaps without ever realizing it. For example, just
    every time you open the Windows Control Panel and make a change using one of its
    utilities or applets, you change a configuration stored in the Registry. In the
    case of the Control Panel applets, Microsoft has made just easy for you creating
    a collection of graphical interfaces, each of which is designed to help you change
    the way the computer is configured. Alternatively, you can use the Windows Registry
    editor to view and make changes to the Registry.


    Because the Registry is a very reliable repository for storing and retrieving
    information, many application developers will take advantage of it by storing
    their application''s settings. In a similar fashion, you can migrate settings
    from your VBScripts into the Registry.


    You can also create VBScripts that can manipulate Registry contents to affect
    virtually every aspect of your computer''s operation.


    > The Windows Registry is a built-in database that the operating system uses to
    store configuration information about itself, as well as the computer''s software,
    hardware, and applications.'
  merge: -1
  pgno: 267
- img_proc: true
  md: 'Microsoft WSH and VBScript Programming for the Absolute Beginner, Fourth Edition


    # How Is the Registry Organized?


    The Registry is organized as a collection of five root or parent keys, which are
    defined in Table 10.1. All the data in the Registry is stored in a tree-like fashion
    under one of these keys.


    # Table 10.1 Registry Root Keys


    | Key | Short Name | Description |

    |---|---|---|n| HKEY_CLASSES_ROOT | HKCR | Stores information about Windows file
    associations |

    | HKEY_CURRENT_USER | HKCU | Stores information about the currently logged-on
    user |

    | HKEY_LOCAL_MACHINE | HKLM | Stores global computer settings |

    | HKEY_USERS | — | Stores information about all users of the computer |

    | HKEY_CURRENT_CONFIG | — | Stores information regarding the computer''s current
    configuration |


    > © Jerry Lee Ford, Jr. All Rights Reserved.


    Although the Registry is logically organized into five root keys, physically it
    consists of many files. Files belonging to the Registry can be found in the %systemroot%system\config
    folder. These files include the following:


    +   * DEFAULT

    * SYSTEM

    * SECURITY

    * SAM

    * SOFTWARE


    # Trick


    %systemroot% is an environment variable created and maintained by the operating
    system. This identifies the location of the folder where Windows stores system
    files and folders. By default, this is C:\Windows.


    Information managed by Windows Registry also consists of data stored about each
    user of the computer. This data is stored in user profiles, which are located
    in either the Documents and Settings or the Users folder (depending on which version
    of Windows you are using) belonging to each user of the computer. Even though
    the Registry has five root keys, as a VBScript programmer, you''ll only need to
    work with three of them. To help things easier on you, Microsoft has created a
    short-name reference for each of these three keys. You can see these short names
    listed in the second column of Table 10.1.'
  merge: -1
