    # Back to the Math Game


    The Math Game is played by displaying a math equation and asking the player to
    provide the solution. If the player provides the correct answer, the game ends;
    however, if the player gets wrong, the script offers to show the player how to
    arrive at the correct answer. This is achieved in a slide or movie-like fashion,
    when the script first starts WordPad, then starts the Calculator application,
    and finally uses these applications to solve the equation while the player sits
    and waits. When the script is finished with its presentation, it ends by closing
    both the WordPad and the Calculator applications.


    # A Quick Overview of the WshShell Object''s SendKeys() Method


    Before I jump completely into the design of the Math Game, I want to give you
    one more piece of information. The Math Game''s capability to interact with the
    WordPad and Calculator applications depends on the use of the WshShell object''s
    SendKeys() method. This method is used to send keystrokes to the currently active
    Windows application.


    Because opening another window while the SendKeys() method is executing will divert
    the keystrokes to the new window, you will want to find another way of integrating
    your scripts with other applications whenever possible. Many applications, such
    as Excel and Word, provide their built-in core object model. WSH scripts can interact
    directly with these applications by instantiating instances of application''s
    objects and accessing their methods and properties. The only trick here is that
    you need to know the objects that make the application''s object model, as well
    as their associated methods and properties. You can often get this information
    from the application vendor''s website or by searching the Internet. Of course,
    if the application you want to work with does not expose an object model for your
    scripts to work with, you can always try the SendKeys() method.'
