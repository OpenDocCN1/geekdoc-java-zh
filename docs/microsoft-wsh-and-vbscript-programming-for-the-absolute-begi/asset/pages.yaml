    # Adding a Password Control


    A password control is a specialized type of text control that masks its input
    using asterisk or bullet characters to prevent it from being seen by spying eyes.
    To add a password control to an HTA, add an `<input>` tag and assign its type
    attribute a value of password, as shown here.


    ```

    <p>

    <label for="passwordBox">Enter your password:</label>

    <input type="password" name="passwordBox" id="passwordBox" size="20" maxlength="10"
    >

    </p>

    ```


    Figure 14.10 show how the previous example looks on a computer running Windows
    7 when used to provide an HTA with its GUI. Note that nine characters have been
    typed into the password control, none of which are visible.


    ![](img/337e6368245d3aad07236ff6d4dacf23_375_1.png)


    Figure 14.10 An HTA GUI includes a password control. © 2014 Cengage Learning.


    # Adding a Checkbox Control


    Checkbox controls provide another way of collecting input. A checkbox control
    consists of a small square, which users can click to select or unselect it. When
    selected, a checkbox control displays a checkmark or similar character inside
    the control. An unselected checkbox appears as an empty box.'
