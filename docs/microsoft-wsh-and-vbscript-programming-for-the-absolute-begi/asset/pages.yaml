    **Figure 11.5** At the end of each game, players are prompted to play again. ©
    2014 Cengage Learning.


    By the end of this chapter, you will have learned a great deal about how to work
    with VBScript''s built-in collection of objects. You will also have developed
    your first multi-player VBScript game.


    # Leveraging VBScript’s Built-in Collection of Objects


    VBScript provides a small collection of built-in objects. The VBScript interpreter
    provides access to these objects. Therefore, they are available to any VBScript
    regardless of the execution host it. These objects, though not numerous, provide
    VBScript with a powerful arsenal of capabilities, including the following:


    +   - Creating customized objects complete with their own properties and methods

    - Intercepting and dealing with run-time errors that your VBScripts may encounter

    - Performing complex regular expression pattern matching


    Table 11.1 displays a list of VBScript’s built-in objects and provides a description
    of each object, as a complete listing of all the properties, methods, and events
    associated with the objects.'
  merge: -1
  pgno: 287
- img_proc: true
  md: '# Table 11.1 VBScript''s Collection of Built-in Objects


    | Object | Description | Properties | Methods | Events |

    |---|---|---|---|--|

    | Class | Used to create new custom objects | None | None | Initialize, Terminate
    |

    | Err | Used to retrieve information about run-time errors. | Description, HelpContext,
    HelpFile, Number, Source | Clear, Raise | None |

    | Match | Used to access-only properties associated with regular expression match
    strings. | FirstIndex, Length, Value | None | None |

    | Matches | Represents a collection of regular expression objects. | None | None
    | None |

    | RegExp | Provides the ability to work with regular expressions. | Global, IgnoreCase
    Pattern | Execute, Replace, Test | None |

    | SubMatches Collection | Used to access-only values associated with regular expression
    submatch strings. | None | None | None |


    Jerry Lee Ford, Jr. All Rights Reserved.


    # # Built-in Object Properties


    As you can see in Table 11.1, VBScript''s built-in objects have a number of associated
    properties. A description of each of these properties is provided in Table 11.2.


    # # Built-in Object Methods


    Of all the VBScript built-in objects, the Err object and the RegExp objects have
    methods associated with them. Methods with the Err object generate and clear errors,
    as outlined here:


    +   - Clear(). This clears out Err object settings.

    - Raise(). This provides the ability to simulate a run-time error.


    Methods associated with the RegExp object provide the ability to search strings
    and to replace portions of strings as outlined here:


    +   - Execute(). This performs a regular expression search.

    - Replace(). This replaces specified text during a regular expression search.

    - Test(). This returns a Boolean value indicating whether a matching pattern is
    located within a string.'
  merge: -1
  pgno: 288
- img_proc: true
  md: '# Table 11.2 Built-in VBScript Object Properties


    | Property | Description |

    |---|---|

    | Description | Returns error messages associated with the Err object |

    | First | Returns the starting character location of a substring a string |

    | Global | Returns a Boolean value |

    | HelpContext | Returns the context ID associated with Help file topic |

    | HelpFile | Retrieves the path of the specified Help file |

    | IgnoreCase | Returns a value of True or False depending on whether a pattern
    search is case-sensitive |

    | Length | Retrieves the number of characters associated with a search match |

    | Number | Retrieves an error number |

    | Pattern | Retrieves a regular expression pattern from a search operation |

    | Source | Returns the object name responsible for generating an error |

    | Value | Retrieves a value from a search match |


    # Creating Custom Objects


    VBScript enables you to store data in constants, variables, and arrays. VBScript
    supports a wide variation of variable subtypes, such as date, string, and integer.
    However, VBScript does not provide for strict enforcement of variable subtypes,
    meaning that you can store any type of value in any variable and change the value
    type and value later without raising any errors. Although all this flexibility
    is great, it also makes it easy to introduce errors. That’s why to use strict
    discipline when working with variables to ensure you do not allow your scripts
    to mix data types. VBScript’s support for arrays provides for the storage and
    retrieval of more complex data structures. But again, there is nothing into VBScript
    to prevent you from mixing and matching data types within your arrays.


    By providing you access to the Class object, VBScript gives you the ability to
    create complex data structures in the form of custom objects. You can then define
    properties and methods for your custom objects. Once created, you can access custom
    objects just like you do any objects. Custom objects help to improve data consistency
    because they give you the ability to establish validation procedures that ensure
    data consistency and enforce strict control over object manipulation.'
  merge: -1
  pgno: 289
- img_proc: true
  md: "# Defining a Custom Object\n\nYou can create a custom object using the Class...End\
    \ Class statement. The Class object provides a template for the creation of new\
    \ objects. Once defined, custom objects must be instantiated like any other object.\
    \ The syntax of the Class...End Class statement follows:\n\n```\nClass ClassName\n\
    \  Statements\nEnd Class\n```\n\nClassName is used to specify the name assigned\
    \ to the new object. Statements are variables, properties, and methods that you\
    \ define within the object. You define object properties for objects by adding\
    \ any of the following statements within the Class...End Class statement:\n\n\
    +   - Property Get. This enables the retrieval of a value assigned to a private\
    \ variable.\n- Property Let. This enables the modification of a value assigned\
    \ to a private variable.\n- Property Set. This enables the modification of a value\
    \ assigned to a public variable.\n\n# Defining Object Properties and Methods\n\
    \nWithin the Class...End Class statement, variables, properties, and methods can\
    \ be defined as private or public using the Private and Public keywords. Labeling\
    \ a variable, property, or method as private restricts access to only within the\
    \ class. Labeling a variable, property, or method as public makes it accessible\
    \ throughout a script.\n\nWhen not specified, it is assumed that variables, properties,\
    \ and methods are public. However, it is generally not a good idea to allow variables\
    \ to be defined with a public scope. Making variables public removes the capability\
    \ to strictly control their value within an object. Instead, it is better to make\
    \ object variables private and allow them to be accessed using the Property Get\
    \ and Property Let statements.\n\nTo best demonstrate how all this works, let's\
    \ look at an example. Here a new object is defined and assigned the name SuperHero\n\
    \n```\nClass SuperHero\n  Private strName\n\n  Public Property Let Name(strIdentity)\n\
    \    strName = strIdentity\n  End property\n```\n\n```\nFunction DisplayName()\n\
    \  MsgBox \"Our new hero's name is \" & strName & \"!\"\nEnd Function\n```\n\n\
    ```\nEnd Class\n```"
  merge: -1
  pgno: 290
