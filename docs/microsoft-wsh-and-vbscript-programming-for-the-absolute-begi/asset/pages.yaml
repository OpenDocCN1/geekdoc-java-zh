  md: '# Using Procedures to Organize Scripts


    By now you''ve seen and worked on a number of VBScript projects, and all of these
    scripts have been organized the same way. First, you set up script initialization
    processes (defining variables, constants, objects, and so on). Then you sequentially
    wrote the rest of the script as one big collection of statements. You then used
    the If and Select Case statements to organize your scripts. Finally, by embedding
    statements within one another, you further refined your scripts'' organization.
    In this chapter, you will learn how to further improve the organization of your
    VBScripts using procedures. Specifically, you will learn the following:


    +   - How to create your customized functions

    - How to create reusable collections of statements using subroutines

    - How to break down scripts into modules of code to make them easier to manage

    - How to control variable scope within your scripts using procedures


    # Project Preview: The BlackJack Lite Game


