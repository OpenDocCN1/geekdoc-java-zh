  md: '# Designing the Game


    In total, the script will consist of 10 functions, each of which is designed to
    perform a specific task. The names of these 10 functions and the tasks they perform
    are as follows:


    +   * SetVariableDefaults(). This establishes default values for a number of script
    variables.

    * ProcessScriptInputFile(). Retrieves configuration settings from the script''s
    external INI file.

    * CollectPlayerInput(). This prompts the player to select the number of lottery
    numbers to be generated.

    * GetRandomNumber(). This generates random lottery numbers.

    * ProcessRandomNumber(). This ensures duplicate lottery numbers are not generated.

    * DetermineIfSetComplete(). This determines when a full set of lottery numbers
    has been generated.

    * BuildDisplayString(). This assembles the display string that will be used to
    show the player the lottery numbers generated by the script.

    * ResetVariableDefaults(). This resets default variables to prepare the script
    for the generation of additional sets of lottery numbers.

    * DisplayFinalResults(). This displays the lottery numbers generated by the script.

    * DisplaySplashScreen(). This displays information about the script and its author.


