  md: '# Chapter 8 • Storing and Retrieving Data


    # Trick


    The trick to extracting script configuration settings from key-value pairs in
    INI files is the script''s use of the built-in VBScript Mid() function. This function
    retrieves or parses a specified number of characters from a string. The Mid()
    function has the following syntax:


    ```

    Mid(string, StartPosition[,Length])

    ```


    string represents the string that the Mid() function is to parse. StartPosition
    identifies the character position within the specified string where the parsing
    operation should begin. Length is optional. When identified, Length specifies
    the number of characters to be returned. If omitted, all characters from the start
    position to the end of the string are returned.


    After a key has been processed, a Select Case is set up to inspect the value associated
    with the key to determine what it is. After the "GameControls" section has been
    processed, the Do...Until loop terminates and the script displays the configuration
    settings that were extracted from the INI file as shown in Figure 8.10, which
    shows the results on a computer running Windows 7.


    ![](img/337e6368245d3aad07236ff6d4dacf23_227_0.png)


    > **Figure 8.10** The output displayed by the INIDemo.vbs script demonstrates
    how to extract configuration settings from INI files. © 2014 Cengage Learning


    Of course, a script that only displays the configuration settings that it extracts
    from its INI file isn''t really useful. However, it provides a working example
    of how to process INI files. You''ll get the chance to modify this example by
    adapting its logic to work with the Lucky Lottery Number Picker.


    # Back to the Lucky Lottery Number Picker


    The heart of the Lucky Number Picker game resides in the script''s main processing
    section, which contains a collection of function calls and two loops that control
    the generation of as many sets of lottery numbers as the player asked for. Script
    configuration settings are stored in an external INI file, which is retrieved
    by the script at execution. The configuration settings are used to specify the
    following:


    +   - How many lottery numbers are required to complete a full set

    - The text to be displayed in the title bar or the pop-up dialog boxes displayed
    by the script

    - The range of numbers from which lottery numbers are to be selected

    - Whether to display the results generated by the script in full or summary format'
