  md: '# Chapter 2 • An Introduction to the Windows Script Host


    Before being adapted to the WSH, VBScript was used as a Web-scripting language
    designed to support script execution in Internet Explorer and Internet Explorer-compatible
    Web browsers. Internet Explorer provides VBScript with an environment that gives
    access to things like forms, frames, and various browser controls over the browser''s
    Document Object Model (DOM).


    Like Internet Explorer, the WSH is also a programming environment that provides
    VBScript execution. Rather than supplying the browser DOM, the WSH provides scripts
    with access to local resources like the Windows Registry and file system through
    its own object model. Whereas Internet Explorer runs as a full-blown Windows application,
    consuming resources that such an application requires (including the memory required
    to formulate and maintain a graphical user interface), the WSH has been streamlined
    to just one host; the WSH, therefore, requires fewer computer resources to execute
    your scripts. As a result, scripts execute more quickly.


    In Chapter 14, "Adding a GUI to Your Scripts," you will learn how to use your
    scripting skills in the development of HTML Applications. This will enable you
    to develop scripts that look and operate like desktop applications. This third
    scripting environment provides your scripts with the ability to access both the
    Internet Explorer DOM as well as the WSH core object model. The end result is
    the ability to use the DOM to build graphical user interfaces for your scripts
    while still allowing them to access and manipulate Windows resources via the WSH.


    # An Examination of WSH Components


    Think of a computer, its operating system, and its hardware and software as being
    a collection of objects such as files, disk drives, printers, and so on. To automate
    tasks on Windows operating systems, VBScript needs a way of interacting with these
    objects. This is provided by the WSH core object model.


    An understanding of the WSH core object model is essential to your success as
    a VBScript programmer. Not only will it provide the technical insights you need
    to develop scripts that will run on Windows operating systems, but by introducing
    you to working with objects, it will also prepare you to work with other object
    models. For example, many Windows applications, including Microsoft Office applications,
    expose their own object models, allowing VBScript to programmatically manipulate
    them. In addition, other VBScript execution hosts, such as Internet Explorer,
    provide VBScript with access to other object models. The WSH core object model
    is complex and may at first seem rather daunting. But don''t worry—you’ll continue
    to develop your understanding of this complex topic as you go through the rest
    of this book. By the time you are finished, you should have a solid grasp of the
    WSH core object model.


    | Definition | A representation of related objects that provide a script or program
    with the capability to view and interact with each of the objects (files, disks,
    printers, and so on) represented in the object model. |'
  merge: -1
