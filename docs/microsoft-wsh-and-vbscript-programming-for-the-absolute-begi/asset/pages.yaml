    # Back to the Hangman Game


    Now that you''ve reviewed the basic steps involved in dealing with VBScript errors,
    let''s return to the Hangman game and begin its development. I''m going to cover
    the development of this game from a different angle than previous chapters. By
    now, you should have a pretty idea of how things work, and you should be able
    to read and understand the scripts that you''ll see throughout this book. (Just
    in case, I''ll leave plenty of comments in the code to help you along.) This time,
    I''ll provide a much higher-explanation of what is going on and offer suggestions
    for ways to test and develop this script one step at a time. I''ll also point
    out techniques that you can use to test and track the results of functions within
    the script so that you can validate their operation without having to first complete
    the entire script.


    # Designing the Game


    The overall design of the Hangman game is fairly complex. To simplify things,
    I''ll begin the game-development process by designing a flowchart, shown in Figure
    9.9, which breaks the game down into distinct units, each of which is responsible
    for performing a unique task.


    ![](img/337e6368245d3aad07236ff6d4dacf23_250_0.png)


    Figure 9.9 A flowchart providing a high-level design for the Hangman game.'
