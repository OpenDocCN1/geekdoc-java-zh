  md: '# 128 Microsoft WSH and VBScript Programming for the Absolute Beginner, Fourth
    Edition


    To see what I mean, look at the following example (I have bolded the embedded
    If statement to make it easier to see):


    X = 250


    If X = 250 Then


    ```

    WScript.Echo "It''s Sunday. The TV store is closed on Sundays."

    ```


    Else


    ```

    WScript.Echo "Go buy that TV!" & vbCrLf & \

    ```


    +   - Buy a TV guide while you are at it." & vbCrLf &


    +   - And do not forget to say thank you.


    End If


    Else


    ```

    WScript.Echo "OK. Just purchase the radio for today."

    ```


    End If


    In this example, the first statement performs a test to see whether the value
    assigned to a variable named X is equal to 250. If it''s not equal to 250, the
    script skips all the locations located between the If X = 250 Then line and displays
    the message "OK. Just purchase the radio for today." However, if the value of
    X is equal to 250, then the embedded If statement executes. This If begins by
    determining the current day of the week is Sunday. If it, the script informs the
    user that the TV store is closed. Otherwise, it tells the user to go and make
    the purchase.


    The test performed by the If statement in the previous example deserves a little
    extra explanation. As you saw, it retrieved a numeric value representing the current
    day of the week. Here''s how break down the logic used by this statement. First,
    it executed the built-in VBScript Date() function. The value retrieved by this
    function was then used by the built-in VBScript Weekday() function to determine
    the numeric value that represents the current day of the week. These values are
    as:


    +   - 1 = Sunday


    +   - 2 = Monday


    +   - 3 = Tuesday


    +   - 4 = Wednesday


    +   - 5 = Thursday


    +   - 6 = Friday


    +   - 7 = Saturday


    When this value was established, the If statement simply checked to see if it
    was equal to 1 (Sunday).


    By taking advantage of built-in VBScript functions, you can perform some fairly
    complex tasks with minimal coding. It''s a good idea to always check whether VBScript
    has a built-in function before attempting to write a piece of code to perform
    a generic task.'
