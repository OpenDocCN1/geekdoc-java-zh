    # Adding a Radio Button Control


    Like checkbox controls, radio button controls allow for the selection of preconfigured
    options. They differ from checkbox controls in radio button controls are designed
    to be organized into groups. This is accomplished by assigning the same name to
    every radio button control that is in the same group. Also, unlike checkbox controls,
    radio button controls are mutually exclusive, meaning that you can choose only
    one radio button out of the group.


    Like checkbox controls, you should use the <input> tag''s value attribute to assign
    a value to a radio control. This is necessary to be able to identify which radio
    button is selected. If beneficial, you can use the checked attribute to pre-select
    a given radio button control within its group.'
