  md: '# WSH Administrative Scripting


    In this book, you learned a great deal about both VBScript and the WSH by developing
    computer games. In the real world, of course, VBScript and the WSH are used to
    automate tasks. These tasks are typically mundane, repetitive, and time-consuming,
    or extremely complex and subject to human error. Automating such tasks using VBScript
    and the WSH makes perfect sense. The purpose of this appendix is to provide you
    with a collection of sample scripts that demonstrate some real-world tasks that
    can be scripted.


    None of the VBScripts that you will see in this appendix should be considered
    finished products. For example, you won''t see any complex programming logic or
    a lot of error checking. These scripts were developed on computers running Windows
    7 and Windows 8.1; you should review and test the scripts before running them
    on other operating systems. My intention for providing these sample scripts is
    to give you a feel for some of the real-world tasks that you can automate using
    VBScript and the WSH. I wanted to provide you with a collection of starter scripts
    from which you can begin to create and develop your own collection of scripts.
    Also included in this appendix are a pair of HTML Applications (HTAs) that demonstrate
    the execution of WSH administrative scripts that have been given a Windows graphical
    user interface.


    I won''t spend a lot of time going over the development of these scripts, nor
    will I attempt to explain every operation they perform. By now, you should be
    able to look at each of these scripts and determine what it is doing. To help
    you out a little, I made sure to include plenty of comments.'
  merge: -1
