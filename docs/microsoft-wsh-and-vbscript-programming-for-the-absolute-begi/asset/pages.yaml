  md: '# How Does It All Work?


    To execute a script using the WSH, you must first create the script using one
    of the WSH’s supported scripting languages. In this book, language is VBScript.
    Windows operating systems recognize the type of data stored in files by the file
    extension assigned to it. For example, a file with a .txt extension is a text
    file. Windows automatically associates files with this file extension with its
    Notepad application. Therefore, when you double-click a file with a .txt extension
    to open it, Windows automatically loads the file into Notepad.


    When you create your VBScripts, you need to save them as plain-text files and
    assign them a .vbs file extension. That way, Windows will know that the file contains
    VBScripts. In a similar fashion, to write a script using JavaScript, you must
    save the file with a .js file extension so that Windows can identify it as.


    # Trap


    Windows runs a script based on the authority of the person who starts it. Therefore,
    your scripts have no more access to Windows and its resources than you do. If
    you create a script to perform a task that you cannot perform manually via the
    GUI, your script will not work. If this is the case, you might want to talk to
    your system administrator to see if you can be assigned additional permissions
    and user rights.


    # Operating System Compatibility


    The current version of WSH is 5.8. This is the fifth version of the WSH released
    by Microsoft. The four previous versions were versions 5.7, 5.6, 2.0, and 1.0.
    Depending on operating system your computer puts runs, you may already have access
    to one of these versions. For example, if you are using Windows Server 2008 R2,
    Windows 7, Windows 8, or Windows 8.1, then you already have WSH 5.8. However,
    if you work with other operating systems, you likely have an older version of
    the WSH installed. Table 1.1 provides a list of Windows operating systems and
    the version of the WSH that is supplied with.


    This book covers WSH 5.8 and VBScript 5.7. However, because WSH 5.6 and WSH 5.7
    and VBScript 5.7 are nearly identical, everything that you learn in this book
    should apply to these earlier versions.'
  merge: -1
