  md: '# Chapter 13 • Working with the Windows Management Instrumentation


    # Identifying Managed Resources


    A managed resource is any hardware or software component exposed by the WMI (for
    which a class has been defined). The WMI uses providers to communicate with managed
    resources. Managed resources include such things as the Windows file system, disk
    drives, event logs, printers, the Registry, the motherboard, processes, services,
    and shares.


    # Scripting the WMI


    Thanks to the WMI scripting library, you can create scripts that interact with
    the WMI. These scripts can execute locally on your computer or remotely, across
    a network, on any computer for which you have administrative access. The scripts
    that you execute do not have to be pre-deployed on remote computers. The WMI will
    automatically create a temporary copy of any script that it is asked to execute
    to the remote computer, significantly simplifying the overall effort


    > A managed resource is a hardware or software component that is exposed and therefore
    manageable by the WMI.


    # Developing WMI Scripts


    As you are to learn, VBScripts that interact with the WMI do so by executing three
    basic steps:


    +   1. Connecting to the WMI

    2. Retrieving access to a WMI-managed resource

    3. Retrieving results or executing class methods


    To connect to the WMI, either on your own computer or remotely to a networked
    computer, you call upon the GetObject function, passing the name of the WMI scripting
    library and of the computer on which the script is to execute, as demonstrated
    here:


    ```

    set WMIServices = GetObject("winmgmts:\DEL-PC")

    ```


    The WMI moniker is "winmgmts:". The name of the computer is formed by typing the
    characters followed by the computer''s name. Specifying your computer name allows
    you to execute your VScript locally on your computer. By specifying the name of
    a remote computer, you can execute your script on a different network computer,
    you have provided permission to do so. As an alternative to specifying the name
    of your computer to run a script locally, you may instead execute the script by
    substituting ". in place of the computer''s name. As such, you could rewrite the
    following statement


    ```

    Set WMIServices = GetObject("winmgmts:\DEL-PC")

    ```


    as shown here:


    ```

    Set WMIServices = GetObject("winmgmts:\.\")"

    ```'
