    # Trap


    One of the easiest ways to mess things up on a computer is to modify the Windows
    Registry without knowing what you''re doing. The Windows Registry stores extremely
    critical system information. Incorrectly configuring keys and values stored in
    the Registry can have a disastrous effect on the computer, and could potentially
    prevent Windows from starting. Unless you''re absolutely sure how a change will
    affect the Registry, don''t make the.


    # Creating a Key and Value to Store Script Settings


    The WSH WShell object supplies three methods that provide VBScript with the capability
    to access, modify, and delete Registry keys and values. These methods, are demonstrated
    in the sections that follow, are as follows:


    +   - *RegWrite().* This provides the ability to create and modify a Registry
    key or value.

    - *RegRead().* This provides the ability to retrieve a Registry key or value.

    - *RegDelete().* This provides the ability to delete a Registry key or value.'
