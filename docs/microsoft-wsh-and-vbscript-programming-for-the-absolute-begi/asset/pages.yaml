  md: '# Chapter 1 • Getting Started with the WSH and VScript


    # Hint


    The VScript InputBox() function is just one of a number of options for collecting
    input. The InputBox() function facilitates direct interaction with users. When
    direct interaction is not required, you can also develop VBScripts that read input
    text files from the Windows Registry. I''ll show you how this works to read data
    from text files in Chapter 8, "Storing and Retrieving Data," and how to interact
