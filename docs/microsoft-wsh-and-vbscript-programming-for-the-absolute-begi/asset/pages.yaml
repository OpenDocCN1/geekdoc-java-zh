    # Setting Up Constants and Variables


    The next step in creating the Captain Adventure script is to specify the constants
    and variables that will be used by the script:


    ''Specify the message to appear in each pop-up dialog box title bar

    Const cGameTitle = "Captain Adventure"


    ''Specify variables used by the script

    Dim strWelcomeMsg, strName, strVocation, strObject, strFriend

    Dim strFood, strStory


    The first line of code defines a constant named cGameTitle. This constant will
    be used to define a message that will be displayed in the title area of any dialog
    boxes by the script. This allows you to define the title bar message just once,
    and to apply it as needed throughout without having to retype it each time.


    The last line of code defines seven variables that the script will use. The first
    variable, strWelcomeMsg, will store the message text that will be displayed in
    a splash screen that appears when the script first executes.


    > Sometimes splash screens are used to remind the user to register the application.
    In other instances, splash screens may distract the user when applications take
    a long time to load or may be used to advertise the website of the application
    or script developer. Adding a splash screen to your script gives you the chance
    to communicate with the user before the script begins its execution; it can be
    used to display instructions or other useful information.


    The next five variables (strName, strVocation, strObject, strFriend, and strFood)
    are used to store data collected from the user; they will be used in the script
    in assembling the Captain Adventure story. The last variable, strStory, is used
    to store the fully assembled Captain Adventure story.


    # Creating a Splash Screen


    As I said, a splash screen to your script gives you an opportunity to display
    your website address, game instructions, or other information you think will be
    useful to the user.


    The following statements show one way of building a splash screen. The StrWelcomeMsg
    is used to define the text that will be displayed in the splash screen. The message
    text to be displayed is formatted using VBScript string constants to make it more
    attractive.


    ''Specify the message to be displayed in the initial splash screen

    strWelcomeMsg = "Welcome to the story of ........................" & vbCrLf &
    _'
