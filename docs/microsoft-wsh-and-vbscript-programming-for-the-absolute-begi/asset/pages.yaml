    ```


    ''Procedure Section


    ''This function determines if the user wishes to proceed

    Function PromptForConfirmation()

    PromptForConfirmation = MsgBox("Set standard desktop background?", 36)

    End Function


    ''This subroutine alters screensaver settings

    Sub ModifySettings()

    ''Turn off the wallpaper setting

    objWshShl.RegWrite "HKCU\Control Panel\Desktop\Wallpaper", " "


    ''Setting the background color to white

    objWshShl.RegWrite "HKCU\Control Panel\Colors\Background", "255 255 255"

    End Sub


    The script begins by prompting for confirmation and then proceeds to modify the
    following Registry values:


    ```

    objWshShl.RegWrite "HKCU\Control Panel\Desktop\Wallpaper", ""

    objWshShl.RegWrite "HKCU\Control Panel\Colors\Background", "255 255 255"

    ```


    The first statement sets the Windows wallpaper setting to "*". This is equivalent
    to right-clicking the Windows desktop, selecting Properties, and then setting
    the Background on the Desktop tab of the Windows Properties dialog box to None.


    The second statement sets the value of the Background setting to 255 255 255.
    This is the equivalent of selecting white as the color setting on the Desktop
    tab.


    To test this script, run it and then log off and again.


