  md: '# An Introduction to the Windows Script Host


    Because VBScripts cannot execute without an execution host of some type, the WSH
    is at the heart of any VBScript that you run from the Windows desktop or command
    line. The WSH not only provides an environment in which VBScripts can execute,
    but it also provides scripts with direct access to Windows resources such as the
    Windows desktop, start menu, Registry, event logs, and network resources. To effectively
    create and execute VBScripts in this environment, it''s helpful to know a little
    something about the WSH core object model. It is also important that you know
    how to configure the WSH to best suit your needs. In this chapter, you will learn
    the following:


    +   - The objects that make up the WSH core object model

    - How to configure scripts for command-line execution

    - How to configure scripts for desktop execution

    - How to override host execution settings

    - How to enable and disable the WSH


    # Project Preview: The Rock, Paper, and Scissors


    In this chapter, you will learn how to create a computer version of the Rock,
    Paper, and Scissors game that you played as a child. The game begins by displaying
    its rules and asks the player to choose between one of the three possible choices.
    After the player makes a selection, the game randomly makes its own selection
    and displays the results. Figures 2.1 through 2.3 demonstrate the flow of the
    game.'
