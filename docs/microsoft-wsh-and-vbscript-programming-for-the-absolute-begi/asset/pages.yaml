  md: 'Microsoft WSH and VBScript Programming for the Absolute Beginner, Fourth Edition


    # Getting a Handle on the Size of Your Arrays


    VBScript provides you with two built-in functions that make it easier to work
    with arrays:


    +   - Ubound(). This returns a numeric value indicating the array''s upper bound
    or its highest element.

    - Lbound(). This returns a numeric value indicating the array''s lower bound or
    its lowest element.


    The Lbound() function isn''t really useful because the lower bound of all VBScript
    arrays is always equal to 0. On the other hand, the Ubound() function can be quite
    handy, especially when working with dynamic arrays. I''ll cover dynamic arrays
    a little later in this chapter. The syntax of the Ubound() function is as follows:


    ```

    Ubound(ArrayName, Dimension)

    ```


    ArrayName is the name of the array whose upper bound is to be returned. Dimension
    is used to specify the array dimension whose upper bound is to be returned. For
    example, you could retrieve the upper bound of a single-dimension array called
    astrItsMyParty as shown here:


    ```

    intSize = Ubound(astrItsMyParty)

    ```


    In this case, the upper bound of the array is assigned to a variable named intSize.
    Let''s look at a quick example of the Ubound() function in action:


    ```

    Dim intCounter = ''Define a variable to be used when processing array

    ''contents''

    Dim strMessage = ''Define a variable to be used to store display output

    ```


    ```

    Dim astrGameArray(2) ''Define an array that can hold three index elements

    astrGameArray(0) = ''Joe Blow'' ''The default username

    astrGameArray(1) = ''Nevada'' ''A place worth visiting

    astrGameArray(2) = ''soda can'' ''An interesting object

    ```


    ```

    intSize = Ubound(astrGameArray(intCounter))


    For intCounter = 0 to intSize

    strMessage = strMessage & astrGameArray(intCounter) & vbCrLf

    Next

    ```


    ```

    MsgBox strMessage

    ```


    Run this example and you''ll see that script displays all three elements in the
    array in a pop-up dialog box.'
