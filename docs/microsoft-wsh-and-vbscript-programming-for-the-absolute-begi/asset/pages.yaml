  md: '# Microsoft WSH and VBScript Programming for the Absolute Beginner, Fourth
    Edition


    # Deleting One or More Files


    You can delete one or more files using the FileSystemObject''s DeleteFile() method:


    ```

    Dim objFso

    Set objFso = WScript.CreateObject("Scripting.FileSystemObject")

    objFso.DeleteFile("C:\VBScriptGames\*.txt")

    ```


    In this example, all the files in the C:\VBScriptGames folder with a .txt extension
    are deleted.


    # Creating a New Folder


    You can create new folders using the FileSystemObject object''s CreateFolder()
    method. For example, the following script checks whether a folder named VBScriptGames
    already exists on the computer''s C: drive. If it does not exist, the script creates
    it.


    ```

    Dim objFso, strNewFolder

    Set objFso = WScript.CreateObject("Scripting.FileSystemObject")

    If (objFso.FolderExists("C:\VBScriptGames") = False) Then

    Set strNewFolder = objFso.CreateFolder("C:\VBScriptGames")

    End If

    ```


    # Trap


    > Always check to be sure that a folder does not exist before trying to create
    it. If the folder that you are trying to create already exists, your script will
    get an error.


    # Copying Folders


    The only differences between copying a folder and copying a file are that you
    specify the CopyFolder() method instead of the CopyFile() method and specify a
    name instead of a name. For example, not only is the specified folder copied to
    a new location, but also all its contents are copied, demonstrated in the following
    example:


    ```

    Dim objFso

    Set objFso = WScript.CreateObject("Scripting.FileSystemObject")

    objFso.CopyFolder("C:\Temp", "C:\VBScriptGames\Temp")

    ```


    Here, a complete copy of the Temp folder and everything stored in it is replicated
    inside the C:\VBScriptGames folder.


    # Trick


    If you want, you can give the new copy of the specified folder a new name when
    copying it by simply specifying a new folder name:


    ```

    objFso.CopyFolder("C:\Temp", "C:\VBScriptGames\Temporary")

    ```'
