    # The <resource> and </resource> Tags


    You have already learned about the advantages of defining constants within your
    VBScripts. However, these constants are available only within the script they
    defines. Using the XML <resource> and </resource> tags, you can define constants
    within your Windows Script Files that can be accessed by every script located
    within the same job. Therefore, when used, these tags must be placed within the
    <job> and </job> tags.


    The syntax of the <resource> and </resource> tags is as follows:


    ```

    <resource id="resourceID">

    </resource>

    ```


    resource id specifies the name of the constant whose value is assigned when you
    type it between the opening and closing tags, as demonstrated in the following
    example:


    ```

    <job>

    <resource id="cTitleBarMsg">TestScript.wsh</resource>

    <script language="VBScript">

    Set objWshSh = WScript.CreateObject("WScript.Shell")

    MsgBox "Greetings", getResource("cTitleBarMsg")

    </script>

    </job>

    ```


    # The <script> and </script> Tags


    You have already seen the <script> and </script> tags in action a number of times
    in this chapter. They are used to mark the beginning and ending of individual
    scripts embedded within jobs in Windows Script Files. The syntax for these tags
    is [src="externalscript"]


    ```

    <script language="language" [src="externalscript"]

    </script>

    ```


    language specifies the scripting language used to create a script. The src argument
    is used to specify an optional reference to an external script. If used, the external
    script is called and executed just as if it were embedded within the Windows Script
    File.'
