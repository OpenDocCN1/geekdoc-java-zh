    # Defining the Elements in the Initialization Section


    Next, let''s define the variables, objects, and array used by the VBScript. In
    most of the VBScripts that you''ve seen in this book, I''ve included a constant
    that defines the title bar message to be displayed in the script''s pop-up dialog
    boxes. However, this time I''ve omitted this constant in the VBScript because
    I have, instead, defined this using the `<reference>` and `</reference>` tags
    at the beginning of the Windows Script File. This allows me to retrieve and create
