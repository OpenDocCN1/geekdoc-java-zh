    # Performing More Complex Tests with VBScript Operators


    Up to this in the book, every example of an If or Select Case statement that you
    have seen involved a single type of comparison: equality. This is a powerful form
    of comparison, but there will be times when your scripts need to test for a wider
    range of values. For example, suppose you want to write a script that asks the
    user to type his age so you can determine whether the user is old enough to play
    your game.(Maybe you don''t want a user to play the game if he is younger than
    18.) It would be time-consuming to write a script that uses 100 statements or
    one Select Case statement with 100 corresponding Case statements just to test
    a person''s age. Instead, you could save a lot of time by comparing the user''s
    age against a range of values. To accomplish this task, you could use the VBScript
    less-than operator (<) as follows:

    intAge = InputBox("How old are you?")

    If intAge < 18 Then

    MsgBox("Sorry you are too young to play this game.")

    WScript.Quit()

    Else

    MsgBox("OK. Let''s play!")

    End If


    In this example, the VBScript InputBox() function collects the user''s age and
    assigns it to a variable called intAge. An If statement checks to whether intAge
    is less than 18, and if it is, the game is stopped.


    Another way you could write the previous example is using the VBScript less-than-or-equal
    operator (<=), like this:

    If intAge <= 17 Then'
