  md: '# Creating Shortcuts for Your Game


    Until now, you have been running your scripts in one of two ways. One is by opening
    the Windows Console and typing the name of an execution hot followed by the path
    and filename of your scripts at the Windows command prompt. The other is by locating
    the folder in which the script resides and opening it (that is, double-clicking
    it).


    Windows provides shortcuts as a convenient alternative for executing Windows applications
    and scripts from the Windows desktop. A shortcut provides access to a Windows
    resource without requiring the user to find or know the actual location of the
    resource it represents. For example, just about any new application that you install
    on your computer automatically adds a shortcut to the Programs menu located on
    the Windows Start menu. In addition, most installation procedures offer to add
    a shortcut for the application on the Windows desktop.


    Using VBScript and the WSH, you can create a script that configures shortcuts
    for your VBS games in any of these locations. Of course, you can manually create
    shortcuts for your scripts, but the advantage of creating their setup is that,
    once written, you can re-create these shortcuts on any computer. For example,
    if you purchase a new computer, all you''ll have to copy your VBScripts from your
    older computer and then run your VBScript setup, and your shortcuts will be re-created.
    Likewise, if you give copies of your VBScript games to all your friends, they''ll
    all have to do to set up shortcuts for the scripts is to run the setup script.


    > Shortcuts are links or pointers to Windows objects. These objects can be just
    about anything, including Windows applications, folders, files, printers, disk
    drives, and scripts.


    # Examining Shortcut Properties


    Windows shortcuts are identified by a small arrow in the lower-left corner of
    the icon that represents them. Shortcuts contain information, in the form of properties,
    about the Windows resources with which they are associated. The most important
    of these properties is the path and name of the Windows resource it represents.


    You can view the properties associated with any shortcut by right-clicking the
    shortcut and selecting Properties. The shortcut''s Properties dialog box appears.
    Click the Shortcut tab to view these properties, as shown in Figure 6.10.


    # Creating Desktop Shortcuts


    You can create a desktop shortcut in just five simple steps. To demonstrate, let''s
    create a shortcut for the GuessANNumber.vbs game on the Windows desktop.


    The first step in creating the game''s shortcut is to establish an instance of
    the WshShell object. The script will need to use this object''s SpecialFolders
    property to access the folder that represents the Windows desktop. In addition,
    you''ll need to use the WshShell object to instantiate the WshShortcut object
    in order to set shortcut properties.'
