  md: '# 13

    Working with the Windows Management Instrumentation


    This book has demonstrated the power and flexibility of the WSH and VBScript.
    This included you how to develop scripts that are capable of interacting with
    both the Windows file system and Registry and of executing system commands to
    perform all kinds of administrative tasks. All these types of tasks were performed
    using different WSH and VBScript objects and their associated properties and methods.
    In addition to administering system resources using WSH and VBScript objects,
    the WSH also enables you to interact with the Windows Management Instrumentation,
    or WMI, to query and interact with managed resources available on your computer
    and network. In this chapter, you will learn the following:


    +   - About the WMI infrastructure

    - The basic steps involved in retrieving WMI data and scripting WMI tasks

    - How to work with the WMI Query Language

    - How to develop VBScripts that execute WMI queries


    # Introducing the Windows Management Instrumentation


    The Windows Management Instrumentation (WMI) is Microsoft''s primary systems and
    applications management support technology for its Operating systems. The WMI
    provides the infrastructure through which Windows resources are accessed and managed.
    The WMI also provides a framework through which Windows resources are defined
    and exposed, making them available for monitoring and configuration, thus providing
    a means for administrating system, application, and network resources.'
  merge: -1
  pgno: 337
- img_proc: true
  md: '# Microsoft WSH and VBScript Programming for the Absolute Beginner, Fourth
    Edition


    Through interaction with the WMI, you can create and execute VBScripts that execute
    under the control of the WSH, which are capable of reporting on, interacting with,
    and administering many different resources, such as available disk space, the
    motherboard, and virtual memory. As will be demonstrated, the WMI provides the
    ability to access and manage a host of different resources, with the following:


    +   * The file system

    * Event logs

    * Printers

    * Disk drives

    * The Registry

    * Shares

    * Active processes

    * Services

    * The scheduler

    * Performance data

    * Network services (DHCP, DNS, and SNMP)

    * System hardware (motherboard, memory, etc.)


    In addition to providing data for all of these resources, the WMI also supports
    the ability to set the real-time monitoring of resources such as the generation
    of event log records or the modification of the Windows Registry or file system.


    Microsoft originally released the WMI as part of Service Pack 4 for Windows NT
    back in 1998. It has since come pre-installed on all Windows computers starting
    with Windows 2000. The WMI is actually a Microsoft implementation of a Web-Based
    Enterprise Management (WBEM) standard. WMI also complies with the Common Information
    Model (CIM) standard. Both of these standards were developed by the Distributed
    Management Task Force, also known as the DMTF.


    > The DMTF is an industry consortium composed of more than 100 companies, like
    Microsoft, IBM, Intel, Dell, Hewlett-Packardard, and Oracle. It is dedicated to
    the development of standards for systems manageability. You can learn more about
    it by visiting its website at www.dmtf.org.


    Among the benefits of WMI is the ability to control and remotely manage running
    Microsoft operating systems. Thus, using a scripting language like VBScript, along
    with the WSH, you can programmatically interact with and manage just every major
    component that operates on a Windows computer, both hardware and software. The
    WMI also provides access to network resources, including DNS and DHCP, enabling
    the administration of different network resources. The WMI also supports the remote
    administration of Windows computers across a network, provided that administrators
    executing the scripts have the appropriate access permissions to resources on
    remote systems.'
  merge: -1
  pgno: 338
- img_proc: true
  md: '# WMI Infrastructure Overview


    The WMI framework is composed of an architecture that is made up of three primary
    parts:


    +   - Consumers. A script, application, or management utility that accesses and
    admins managed resources using the WMI infrastructure.

    - The WMI infrastructure. Four components (WMI scripting library, CIM object manager,
    WMI providers, and Common Information Model) that provide the framework through
    which managed resources are defined and accessed.

    - Managed resources. Physical or logical components (such as a disk drives and
    Windows services) that are exposed by the WMI, allowing data to be collected regarding
    the state of resources and for resources to be monitored and managed.


    Figure 13.1 provides a depiction of how these different components interact and
    work together to support the operation of the WMI.


    ![](img/337e6368245d3aad07236ff6d4dacf23_339_0.png)


    A high-level understanding of what each of the components shown in Figure 13.1
    is essential to understanding how to work with the WMI and is provided in the
    sections that follow.'
  merge: -1
  pgno: 339
- img_proc: true
  md: '# Microsoft WSH and VBScript Programming for the Absolute Beginner, Fourth
    Edition


    # Identifying WMI Consumers


    The management resources exposed by the WMI are made available to WMI consumers.
    A WMI consumer is any script, program, or utility that accesses and administrators
    managed resources via the WMI infrastructure. WMI consumers occur in many forms,
    including enterprise management applications like Microsoft Systems Management
    Server and VBScripts executed by the WSH. This chapter will demonstrate how to
    develop VBScripts, which as WMI consumers, access and administer Windows resources.


    # Examining the WMI Infrastructure


    The WMI infrastructure consists of four major components. It is through these
    four components managed resources are exposed, accessed, and managed. The components
    are as follows:


    +   - WMI scripting library. This is a collection of objects that offer access
    to the WMI infrastructure, providing you with everything needed to programmatically
    retrieve WMI data and administer managed resources.

    - CIM object manager (CIMOM). This is the WMI component responsible for managing
    the exchange of data between consumer applications and WMI providers.

    - Common Information Model (CIM). This is a repository used to store and manage
    all WMI namespaces, which contain class definitions for every managed resource.

    - WMI providers. These serve as an interface through which the WMI interacts with
    and manages resources.


    # The WMI Scripting Library


    To develop WMI consumers using VBScript, you need to learn how scripts interact
    with the WMI scripting library. The WMI scripting library facilitates the scripting
    of WMI-managed resources by providing access to a set of objects that allow you
    access to the WMI infrastructure. The objects provides a consistent interface
    for accessing the WMI infrastructure.


    As you will learn later in this chapter, you can access WMI resources from within
    VBScripts by connecting to the WMI service and retrieving an instance of a WMI
    managed resource with which you can access properties and methods belonging to
    specific types of WMI classes. You can also execute queries that retrieve data
    based on your specified criteria.


    # The CIM Object Manager


    The CIM object manager, or CIMOM, manages the exchange of data between providers
    and consumers. In addition to managing the retrieval of data from managed resources,
    the CIMOM also serves as the interface through which consumers access the WMI
    and submit requests.'
  merge: -1
  pgno: 340
- img_proc: true
  md: '# Chapter 13 • Working with the Windows Management Instrumentation


    The CIMOM provides a range of services on behalf of the WMI, including the following:


    +   - Query management. CIMOM allows consumers to submit queries that collect
    WMI information using the WMI Query Language (WQL).


    +   - Routing management. CIMOM automatically routes information requests to the
    appropriate provider to retrieve data for a specified resource.


    +   - Remote access management. CIMOM facilitates remote access to network computers
    by establishing connections to the CIMOM running on other computers.


    +   - Provider registration. CIMOM allows providers to register with the WMI and
    to identify the types of data and tasks they can perform.


    +   - WMI security. CIMOM restricts access to WMI resources by ensuring that the
    user has appropriate security permissions.


    The CIMOM retrieves information from the Common Information Model (CIM). This
    enables the CIMOM to determine which provider to hand off requests in order to
    fulfill WMI requests.


    # The Common Information Model


    The WMI maintains information about the different types of resources through class
    definitions stored in the Common Information Model, or CIM. The CIM serves as
    a repository for information collected by WMI providers and is responsible for
    managing the definitions for all repositories.


    The CIM is an object-oriented theory that defines all the different objects that
    make up a managed system. The CIM organizes this information into classes. A class
    defines all the properties and methods that describe and control the interaction
    of managed resources. The CIM stores classes using a hierarchy, similar to the
    way Windows manages the file system. Within this hierarchy, the term namespace
    is roughly equivalent to that of a file system folder.


    The CIM maintains namespaces in a hierarchy, where child classes inherit from
    their parent classes. An example of a namespace is the root/cim2 namespace, within
    which a series of classes is stored to define managed resources for the computer
    and its operating system.


    The CIM contains a class for every managed resource. For example, the Win32_OperatingSystem
    class represents the computer''s operating system. This class defines an abundance
    of properties and methods. One such property is BootDevice, which identifies the
    disk used to load the Windows operating system when the computer is started. This
    class defines numerous methods, including the Win32_Shutdown method, which can
    be used to shut down a computer any of the options supported by Windows (log off,
    shutdown, reboot, etc.).


    | Definition | A class is a template used to define and create objects, which
    include properties that describe object attributes and methods for interacting
    and controlling objects that are instantiated on the class. |

    | | A namespace is a hierarchical container used to organize and maintain relationships
    between classes. |'
  merge: -1
  pgno: 341
- img_proc: true
  md: '# Microsoft WSH and VBScript Programming for the Absolute Beginner, Fourth
    Edition


    You will see examples of scripts that demonstrate how to work with and extract
    data using a number of different classes in this chapter. These classes include
    the following:


    +   * Win32_Service

    * Win32_BIOS

    * Win32_BaseBoard

    * Win32_NTLogEvent

    * Win32_OperatingSystem


    # Hint


    With the CIM, classes are used to outline descriptions of managed resources. Because
    of the dynamic nature of computer systems, data about managed resources is not
    stored in the CIM. Instead it is collected when needed, ensuring that it is always
    up to date and accurate. To interact with specific managed resources, you must
    instantiate instances of objects, using the appropriate classes as the basis for
    instantiating objects.


    # Working with WMI Providers


    The WMI provides access to managed resources through providers. Providers serve
    as intermediaries between WMI, or more specifically the CIMOM, and the different
    parts of the operating system, network, and applications. A different WMI provider
    exists for each type of managed resource.


    WMI providers are responsible for collecting data from managed resources and for
    sending management instructions to them. Examples of providers include the Win32,
    Registry, Event Log, and Active Directory providers. The Win32 provider gives
    you access to information about the computer, including the file systems, disk
    drives, operating system, printers, sharers, and. The Event Log provider offers
    the ability to access, read, delete, copy, and monitor event logs. The Registry
    provider offers the ability to programmatically access, modify, and delete Registry
    keys and values. The Active Directory provider allows you to interact with and
    manage Active Directory objects.


    The WMI is an extensible framework, enabling software developers to develop additional
    providers to expose different parts of their applications, allowing their management
    through WMI. Examples of such applications include the Internet Information Server
    and Systems Management Server applications.


    # Hint


    To learn more about the different types of WMI providers now available, visit
    the “WMI Providers” page at http://msdn.microsoft.com/en-us/library/aa394570(VS.85).aspx.'
  merge: -1
