  md: '# Testing for Matching Patterns


    The RegExp object''s Test() method performs a pattern match without actually performing
    a replacement operation. The syntax for the Test(string) method is as follows:


    ```

    RegExp.Test(string)

    ```


    The following statements demonstrate how to use this method. In this example,
    the script displays one of two messages, depending on the string assigned to the
    Pattern property is found within the search string.


    ```

    Dim objRegExp

    Set objRegExp = New RegExp


    objRegExp.Pattern = "planet"


    If objRegExp.Test("A long time ago on a far away planet") = "True" Then

    MsgBox "the word " & objRegExp.Pattern & " " was found!"

    Else

    MsgBox "the word " & objRegExp.Pattern & " " was not found!"

    End If

    ```


    # Creating Matches Collections


    Using the RegExp object''s Execute() method, you can generate a Matches collection
    as a result of a regular expression. The syntax of the Execute() method is as
    follows:


    ```

    RegExp.Execute(string)

    ```


    Once generated, the Matches collection is read-only. Each Match object has its
    own set of properties, which includes the following:


    +   - FirstIndex. This retrieves the starting characters of a match within a string.

    - Length. This returns the length of a match within a string.

    - Value. This retrieves the text of the match within a string.


    Once a Matches collection has been generated, you can process all the members
    of the collection using a loop, as demonstrated by the next example:


    ```

    Dim objRegExp, objMatchCollection, objMatch, strStory, strDisplayMsg

    Set objRegExp = New RegExp


    objRegExp.Pattern = "bear"

    objRegExp.Global = "True"

    ```'
