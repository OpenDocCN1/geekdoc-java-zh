  md: '# 10


    # # Using the Windows Registry to Configure Script Settings


    So far, all the scripts you''ve worked with in this book collected information
    and input from three places: the user, within the script itself, or INI files.
    I''ll show you another option for externalizing script settings by storing and
    retrieving configuration data using the Windows Registry. As a bonus, in this
    chapter''s game project, I''ll also demonstrate how to retrieve input data from
    files. Specifically, you will learn the following:


    +   - How to review the overall organization and design of the Windows Registry

    - To programmatically create, modify, and delete Registry keys and values

    - How to read data stored in external files and process it as input


    # ## Project Preview: Part 2 of the Hangman Game


    In this chapter, you will enhance the Hangman game you began developing in Chapter
    9, “Handling Script Errors.” You''ll begin by creating a new setup script that
    uses the Windows Registry to store the location of the folder where external text
    files are stored. These text files contains lists of words that the new version
    of the Hangman game will use to stamp the player. You''ll modify the Hangman script
    by removing the array that stores words within the script and tweaking the script
    so that it retrieves words from external files. You will also modify the game
    to allow the player to select the category of words to play in. For example, you
    might want to create different text files for categories such as “Foods” or “Places.”


    Figures 10.1 through 10.5 demonstrate the overall flow of the game from beginning
    to end on a computer running Windows 7.'
