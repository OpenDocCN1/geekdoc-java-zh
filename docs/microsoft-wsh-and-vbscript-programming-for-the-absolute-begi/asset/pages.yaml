  md: '# Defining Variables


    VBScript provides two ways of defining variables: dynamically, and formally, using
    the Dim statement. To dynamically create a variable within a script, you simply
    need to reference it that like this:


    MyBirthday = #November 20, 1964#


    Using this method, you can define variables anywhere within your script. However,
    I strongly recommend against creating variables in this manner. It is much better
    to formally define any variables used in a script all once at the beginning of
    the script. This helps things organized. In addition, I also strongly suggest
    that you use the Dim statement. The syntax of the Dim statement is as follows:


    ```

    Dim VariableName

    ```


    VariableName is the name of the variable defined. For example, the following statement
    defines a variable named MyBirthday:


    ```

    Dim MyBirthday

    ```


    After a variable has been defined, you can assign a value to it, like this:


    ```

    MyBirthday = #November 20, 1964#

    ```


    Always use the Dim statement to make your code more readable and to explicitly
    show your intentions. You can define multiple variables within your scripts using
    multiple Dim statements:


    ```

    Dim MyBirthday

    Dim MyName

    Dim MyAge

    ```


    However, to reduce the number of lines of code in your scripts, you have the option
    of defining more than one variable at a time using a single Dim statement, by
    separating each variable with a comma and space:


    MyBirthday, MyName, MyAge


    As I already stated, it''s better to formally define a variable before using it.
    One way to make sure that you follow this rule is to place the Option Explicit
    statement at the beginning of your scripts. The Option Explicit statement generates
    an error during script execution if you attempt to reference a variable without
    first defining it. Therefore, Option Explicit helps you to follow good programming
    practices when working with variables.


    To test the use of the Option Explicit statement, let''s take a look at another
    example:


    ```

    ****************

    ''Script Name: BigBadWolf.vbs

    ''Author: Jerry Ford

    ''Created: 01/29/14

    ```'
