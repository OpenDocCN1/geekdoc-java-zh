  md: '# User Account Administration


    User administration involves many tasks, including creating, modifying, and removing
    user accounts from the computer or the Windows domain to which the computer is
    a member. To perform user administration, you need to have administrative privileges
    within the context that the script will execute (that is, on the computer or at
    the domain level).


    One way to create a new user account is with the Windows net user command.


    # Trick


    You can also use the net group command to add a newly created user account into
    a global group account or the net localgroup command to add the user to a local
    group.


    For example, the following VBScript uses the WshShell object''s Run() method.
    The net user command can be used to create a new user account on Windows 7 or
    Windows 8.1.


    # Trap


    This script requires that you execute it with elevated privileges. To do so, locate
    and right-click the Windows Command Prompt icon and click Run as Administrator
    in the menu that appears. Once in this manner, navigate to the folder where the
    script resides and execute it.


    ```

    ****************************************************************

    ''Script Name: AccountCreator.vbs

    ''Author: Jerry Ford

    ''Created: 02/25/14

    ''Description: This script demonstrates how to use VBScript to create new

    ''user accounts.

    ****************************************************************


    ''Initialization Section


    Option Explicit

    On Error Resume Next


    Dim objFsoObject, objWshShell, strNewAcccts, strACCTName


    ''Instantiate the FileSystemObject object

    Set objFsoObject = CreateObject("Scripting.FileSystemObject")

    ```'
