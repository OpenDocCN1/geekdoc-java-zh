    Script Settings." You can also create VBScripts that process data passed to them
    at run-time. I''ll show you how this works in Chapter 4, "Constants, Variables,
    Arrays, and Dictionaries."


    To communicate with the player, the InputBox() function allows you to display
    a message. In this example, the message is simply "Knock Knock," just as easily
    be "Hello, what is your name?" or any other question that helps the player understand
    the type of information the script is trying to collect.


    Finally, the text typed by the player in the pop-up dialog box text is temporarily
    assigned to a variable Reply1. Variables provide scripts with the capability to
    store and later reference data by the script.


    Functions and variables are fundamental components of VBScript. Unfortunately,
    it is difficult to write even the simplest scripts without using them. Now, don''t
    worry too much about them and keep your focus on the overall steps to create and
    run the Knock Knock game. I''ll go over the use of variables in great detail in
    Chapter 4 and the use of functions in Chapter 7, "Using Procedures to Organize
    Scripts."


    # Validating User Input


    The player''s role in this game is to type the phrase "Who''s there?" Any variation
    in spelling or case will result in an error. After the player has typed this message
    and clicked the OK button, the script needs to perform a test that validates whether
    the player is playing the game properly.


    The three lines of code accomplish this task:


    ```

    If Reply1 = "Who''s there?" Then

    ```


    ```

    End If

    Reply1 <> "Who''s there?" Then MsgBox "Incorrect answer. Try again."

    ```


    The first two lines of actual code—If Reply1 = "Who''s there?" and End If—the
    dots between these lines of code are placeholders for more statements that will
    be inserted in the next section. The first of these two lines tests the value
    of Reply1. Remember that Reply1 is a variable that contains the response typed
    by the player. This statement checks if the values stored in Reply1 match the
    phrase "Who''s there?" If there is an exact match, the lines of code you will
    soon place within the first two statements are executed. Otherwise, these statements
    are not processed. The third line of code'
