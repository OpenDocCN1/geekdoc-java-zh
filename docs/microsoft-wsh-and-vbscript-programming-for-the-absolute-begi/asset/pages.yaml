    # Writing Lines


    You can modify the previous example to write text output to the line at a time
    by replacing the Write() method with the WriteLine() method:


    ```

    Set objFso = WScript.CreateObject("Scripting.FileSystemObject")

    Set objFileHandle =

    objFso.OpenTextFile("C:\Temp\Sample.txt", 2, "True")

    objFileHandle.WriteLine("Once upon a time there were three little bears.")

    objFileHandle.Close()

    ```


    If you save and run this example, you''ll find that the results are exactly as
    those produced by the previous example. One difference is that the cursor is now
    positioned at the beginning of the next row in the text file when you run it,
    whereas the cursor was left at the end of the first row when you ran the previous
    example. This is because the WriteLine() method automatically appends a newline
    to the end of each write operation.


    # Adding Blank Lines


    You can add lines to the output generated by your VBScripts to make it look better
    using the FileSystemObject object''s Writeblank() method. This method executes
    by writing a blank line and advancing the cursor to the beginning of the next
    row in the file.


    The following example demonstrates how to use the FileSystemObject object''s WriteLines()
    method:


    ```

    Set objFso = WScript.CreateObject("Scripting.FileSystemObject")

    Set strInputFile = objFso.GetFile("C:\VBScriptGames\Hangman.vbs")

    Set objFileHandle =

    objFso.OpenTextFile("C:\Temp\Sample.txt", 2, "True")

    ```'
