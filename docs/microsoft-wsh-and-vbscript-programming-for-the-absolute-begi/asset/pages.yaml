  md: '# Understanding VBScript Errors


    Errors can appear, even in small scripts, for many reasons. Errors may be generated
    when a script is first loaded or interpreted. Errors occurring at this stage are
    referred to syntax errors. Syntax errors are often the result of typos. For example,
    you might accidentally type a single quote when you mean to type a double quote.
    Syntax errors also occur when you inadvertently mistake a VBScript keyword. Because
    syntax errors are discovered during the initial loading of a script, they are
    usually easily caught and corrected during script development.


    Errors can also be generated during script execution. These types of errors are
    referred to as run-time errors. Run-time errors appear only when the statements
    that generate them are executed. As a result, some run-time errors might not be
    detected when the script executes (if the statement containing the error is not
    executed). For example, a run-time error might be hidden deep within a function
    or subroutine that seldom called.


    > A syntax error is an error that occurs as a result of improperly formatted statements
    within scripts.


    With proper testing of all components of a script, most run-time errors can be
    discovered and fixed during script development. I say "most" because not all run-time
    errors can be caught. For example, those caused by unforeseen circumstances may
    be impossible to detect during script development. Perhaps the person running
    the script incorrectly supplied input in a manner that you could not anticipated,
    or perhaps something is wrong with the environment in which the script is being
    executed. Or maybe the hard disk has become full, preventing your VBScript from
    writing to a file, or the network goes down. In such cases, the best you can do
    is to end the script gracefully, without confusing the user or making the situation
    worse.


    > A run-time error is an error that occurs when a script tries to perform an illegal
    action, such as multiplying a numeric and a character value.


    Another category of errors which can be scripted is logical errors. Logical errors
    are mistakes made by the script developer. For example, instead of looping 10
    times, you might accidentally set up an endless loop. Another example of a logical
    error is a situation in which a script adds two numbers that should have been
    multiplied.


    > A logical error is an error produced as a result of a programming mistake on
    the part of the script developer.


    # Understanding Error Messages


    VBScript errors are generated for both syntax and run-time errors. These errors
    are displayed in the form of pop-up dialog boxes, as shown in Figure 9.5, which
    shows the result of a script executed on a computer running Windows 7. Each error
    message displays information about the error, including a brief description of
    the error, an error number, and the source of the error.'
  merge: -1
  pgno: 241
- img_proc: true
  md: '# Microsoft WSH and VScript Programming for the Absolute Beginner, Fourth Edition


    ![](img/337e6368245d3aad07236ff6d4dacf23_242_0.png)


    **Figure 9.5** A typical VBS error message. Used with permission from Microsoft.

    © 2014 Microsoft Corporation.


    The error message displayed in Figure 9.5 is the result of a syntax error. As
    you can see, a lot of useful information about the error is automatically provided.
    The ability to interpret and understand this information is critical for troubleshooting
    and fixing VBScripts.


    The following information has been provided in this error message:


    +   - Script. The name and location of the VBScript that produced the error

    - Line. The line number within the VBScript where the error was detected

    - Char. The column number within the line where the error was detected

    - Error. An error number identifying the type of error

    - Source. The resource that reported the error


    You can see in Figure 9.5 a VBScript named Test.vbs in C:\Temp generated the error.
    Line 6 of the script that generated this error looks like the following statement:


    ```

    If X > 5 MsgBox "Hello World!"

    ```


    This statement uses the VBScript MsgBox() function to display a text string. The
    error message indicates that the problem is that VBScript expected the Then keyword
    and did not. If you look at the middle of this statement, you''ll see that, in,
    the Then keyword is absent. To correct this error, you would add the missing keyword,


    ```

    If X > 5 Then MsgBox "Hello World!"

    ```


    To verify that the error has been eliminated, you could save and run the script
    again.


    # Preventing Logical Errors


    Your VBScripts will do exactly what you tell them to do, even if that''s not what
    you really mean for them to do. Therefore, it is extremely important that you
    plan your VBScript project carefully. For example, you should begin with a pseudo
    code outline and translate that into a flowchart, outlining each of the script''s
    major components. You should, as much as possible, develop the script a component
    at a time,'
  merge: -1
  pgno: 242
- img_proc: true
  md: '# Chapter 9 • Handling Script Errors


    testing each component as you go. I''ll show you some different ways to test individual
    scripts as you develop the Hangman game.


    Logical errors often make their presence known by presenting incorrect or unexpected
    results, and can be the most difficult type of error to track down. Unlike syntax
    and run-time errors, which display messages describe the nature of their problems,
    logical errors force you to look through some or all of your script at a time
    to find the faulty logic. The good news is that with careful planning and design,
    logical errors can be avoided.


    # Dealing with Errors


    There are many measures you can take to prevent errors from occurring in your
    VBScripts. I''ve already mentioned the need to plan and carefully design and test
    your scripts. In addition, you can avoid any errors by taking the following advice:


    +   * Provide a simple, easy-to-use interface (such as pop-up dialog boxes).

    * Provide clear instructions so the user will understand exactly what is expected
    of him.

    * Reuse code from editing scripts whenever possible by cutting and pasting code
    that has already been thoroughly tested.

    * Validate input data as much as possible.

    * Explicitly declare all your variables.

    * Use a consistent naming scheme for all constants, variables, object references,
    arrays, functions, and subroutines.

    * Be on guard for endless loops.

    * Do your best to anticipate and handle specific situations where errors are likely
    to occur.


    Unfortunately, errors will occur. There are three basic ways that you can deal
    with them as they arise in your VBScripts:


    +   * Simply let them happen and deal with the consequences as problems are uncovered.

    * Tell VBScript to ignore errors and keep going.

    * Attempt to anticipate where errors are most likely to occur and try to handle
    them in a way that either terminates the script''s execution gracefully or allows
    the script to recover and keep going.


    # Letting Errors Happen


    Errors are going to happen. One way of dealing with them is to simply let them
    happen and instruct users to report them when they occur, along with as much information
    possible about what the user was doing when the error occurred. That way, you
    can attempt to reproduce the error, figure out what caused it, and then fix it.'
  merge: -1
  pgno: 243
- img_proc: true
  md: '# Microsoft WSH and VBScript Programming for the Absolute Beginner, Fourth
    Edition


    Normally I would not recommend this approach. After all, your reputation as a
    VBScript guru depends on the soundness and reliability of your scripts, a cost
    is associated with every VBScript you write. You may measure this in terms of
    time, effort, or by some other scale. Each time you sit down to create a new script,
    you must make a judgment call as to how much time and energy you have available
    to put into the project. You also need to consider the consequences of an error
    occurring in the script you are developing. After all, it is entirely possible
    to develop a simple script in a matter of minutes and spend another hour or more
    trying to make it bulletproof, only to find that something has gone wrong.


    If you''re developing an extremely important script that will have high visibility
    and for which you will be accountable if a problem arises, then you''ll need to
    do everything to keep errors from happening. On the other hand, if you have been
    asked to create a "quick and dirty" script to help some one perform a noncritical
    task, you might be able to get away with listing any errors occur. All you may
    need to tell the person for whom you wrote the script to give call if a problem
    arises so that you can make a quick modification to fix it.


    Just keep this thought in mind: Most users will have no idea what a typical VBScript
    error message means or what to do if they receive one. It''s important to, at
    a minimum, provide clear instructions on how to use your VBScripts and what to
    do if an error occurs.


    # Ignoring Errors


    Another option that you might want to consider when developing your scripts is
    to tell VBScript to ignore any errors that occur. In some cases, this will work
    just fine. For example, suppose you write a VBScript that was supposed to connect
    to a number of networked computers and copy over a file located in a folder at
    regular intervals throughout the day. As problems sometimes occur on networks,
    it may be acceptable to ignore situations in which the script is unable to connect
    to a particular network drive, especially if you know that the script will run
    again later and get another chance to copy the missing file.


    This approach, while effective, should be used with caution. There are few situations
    in which skipping an error will not result in the generation of another error
    later in a script. For example, if your script was supposed to perform another
    operation on each file copied from the network drive, depending on how you write
    the script, the part of the script performs this next step might generate an error.


    To tell VBScript to ignore errors within your script, add the following statement,
    as shown, to the beginning of your script:


    ```

    On Error Resume Next

    ```


    Even if you add this statement to your scripts, certain errors will still be reported.
    The key to using this statement is that it must be placed in your script before
    any statements in which you think an error is likely to occur. You can cancel
    the effects of this statement using the following statement:


    ```

    On Error GoTo

    ```'
  merge: -1
  pgno: 244
- img_proc: true
  md: '# Chapter 9 • Handling Script Errors


    For example, the following statement will produce an error message because the
    keyword WScript is misspelled:


    WScript.Echo "Hello world!"


    Adding On Error Resume Next before the statement prevents the error from appearing
    and allows the rest of the script to continue:


    On Error Resume Next

    WScript.Echo "Hello world!"


    Now look at two more statements:


    On Error Resume Next

    WScript.Echo "Hello world!"

    On Error Goto 0

    WScript.Echo "Goodbye world!"


    The On Error Goto 0 statement nullifies the effects of the On Error Resume Next
    statements for all statements that follow. The first error is ignored, but the
    second error is reported and the script halts execution.


    Like variables, VBScript allows you to localize the effects of the On Error Resume
    Next statement to the procedure level. In other words, if this statement is placed
    within a procedure, then it will be in effect only as long as the procedure executes,
    and will be nullified when the procedure (that is, the function or subroutine)
    finishes executing. Combining the On Error Resume Next statement with procedures
    enables you to significantly limit the effects of this powerful statement.


    # Creating Error Handlers


    The third option that you have for dealing with errors in your VBScripts is to
    create error handlers. To effectively use error handlers, you must be able to
    anticipate locations within your scripts where errors are likely to occur and
    then develop the programming logic to deal with, or handle, these errors.


    You can handle errors in different ways. For example, you can create error handlers
    that do:


    +   - Reword critical VBScript errors.

    - Provide the user with instructions.

    - Give the user another try.

    - Apologize for the error.

    - Ask the user to report the error.

    - Take a corrective action.

    - Log the occurrence of the error.


    | Definition | An error handler is an error-triggered routine that alters the
    execution environment''s default handling of an error condition. |'
  merge: -1
  pgno: 245
- img_proc: true
  md: '# Microsoft WSH and VBScript Programming for the Absolute Beginner, Fourth
    Edition


    To set up an error handler, you need to know how to work with the Err object.
    The Err object provides a number of properties and methods that allow your scripts
    to access error information and clear error conditions. To access information
    about an error, you need to reference the following three properties:


    +   - Number. This retrieves the last error number.

    - Description. This retrieves the last error message.

    - Source. This retrieves the name of the object that raised (or caused) the error.


    You can modify the contents of any of these three properties, which enables you
    to reassign a custom error number and message and even modify source information.
    For example, in a particularly complex script, you might want to create and document
    your custom set of error messages.


    The first step in creating an error handler is to add the On Error Resume Next
    statement to your VBScript. You can then add the error-handling statements like
    this:


    ```

    On Error Resume Next

    ```


    ```

    NonExistentFunction()

    ```


    ```

    If Err > 0 then

    Err.Number = 9999

    Err.Description = "This script is still a work in progress."

    MsgBox "Error: " & Err.Number & " - " & Err.Description

    Err.Clear

    End if

    ```


    Save these statements as a script and execute them. Because the script does not
    contain a procedure named NonExistentFunction(), an error will be generated. However,
    instead of displaying a VBScript-runtime error message, the error-handling routine
    creates and displays the error message shown in Figure 9.6.


    ![](img/337e6368245d3aad07236ff6d4dacf23_246_0.png)


    > Figure 9.6 A custom error message generated by a VBScript error handler, as
    seen on a computer running Windows 7. © 2014 Cengage Learning.


    The Err object also provides two very useful methods. One of them is the Clear()
    method. This method clears or removes the previous error, ensuring that the next
    script checks for an error, it will not get a false status (that is, it won''t
    see an already-handled error).'
  merge: -1
  pgno: 246
- img_proc: true
  md: 'To use the Clear() method, place it at the end of your error-handling routine,
    as demonstrated in the previous example. VBScript automatically executes the Clear()
    method on several occasions, including the following:


    +   * Whenever the On Error Resume Next statement executes

    * Whenever an Exit Sub statement executes

    * Whenever an Exit Function statement executes


    The second Err object uses the Raise() method. This allows you to generate error
    messages to test your error-handling routines. Without this method, the only way
    that you could test your error-handling routines would be to deliberately introduce
    an error situation into your code. This method is easy to use, as demonstrated
    by the following:


    ```

    Err.Raise(500)

    ```


    For example, if you save the previous statement as a script and run it on a computer
    running Windows 7, you will see the error message shown in 9.7.


    ![](img/337e6368245d3aad07236ff6d4dacf23_247_0.png)


    > Figure 9.7 Using the Err object''s Raise() method to generate a test error.

    © 2014 Microsoft Corporation. Used with permission from Microsoft.


    To use the Raise() method, add it, along with the error indicating that you want
    to generate, just before the error-handling procedure that you want to test in
    your script. After you have validated that the error handler is working as expected,
    remove the Raise() statement from your VBScript.


    # Reporting Errors


    The best solution for errors is to prevent them from occurring in the first place.
    However, that''s not always possible. The next best solution is to devise a way
    of dealing with errors, whether by handling them or simply ignoring them. Another
    option is to report errors by recording them to a log file for later review. This
    enables you to come back and see whether any errors have occurred. This is important
    because many users do not report errors when they occur, allowing the errors to
    go forever. By logging error messages, you create an audit log that you can come
    back and review from time to identify and fix any errors that may have occurred.'
  merge: -1
  pgno: 247
- img_proc: true
  md: '# Microsoft WSH and VBScript Programming for the Absolute Beginner, Fourth
    Edition


    When logging error messages, you have two options:


    +   - Creating your own custom log file

    - Recording error messages in the Windows application event log


    # Creating a Custom Log File


    To create a custom log file, you must instantiate the FileSystemObject object
    in VBScript and then use its OpenFile() method to open the log file so that your
    script can write to it, as demonstrated in the following example:


    On Error Resume Next


    ```

    Err.Raise(7)


    Set objFsoObject = WScript.CreateObject("Scripting.FileSystemObject")

    If objFsoObject.FileExists("C:\ScriptLog.txt") Then

    Set objLogFile = objFsoObject.OpenTextFile("C:\ScriptLog.txt", 8)

    Else

    Set objLogFile = objFsoObject.OpenTextFile("C:\ScriptLog.txt", 2, "True")

    End If

    ```


    ```

    objLogFile.WriteLine "Test.vbs Error: " & Err.Number & " \ , Description = " &
    & \

    Err.Description & " \ , Source = " & & Err.Source

    ```


    ```

    objLogFile.Close()

    ```


    In this example, the On Error Resume Next statement is used to allow the script
    to recover from errors and the Err.Raise(7) statement to simulate an "out of memory"
    error. The rest of the script logs in a file called ScriptLog.txt, located on
    the computer''s C drive. If the file does not exist, it is created. Error messages
    are appended to the bottom of the file each time they are written, allowing a
    running history of information to accumulate. For more information about how to
    work with the FileSystemObject object and its methods and properties, refer to
    Chapter 8, "Storing and Retrieving Data."


    You can adapt the previous example as the basis for developing an error-logging
    routine in your VBScripts. Simply copy and paste all the first two lines into
    a function and call it whenever error occurs. Make sure that you call the function
    before clearing the error. Alternatively, you can modify the example to use variable
    substitution and pass the function error number and description as arguments.


    # Trap


    Be sure you close any file that you open before allowing your script to terminate.
    If you don''t, you may have problems with the file next time you want to open
    it because its end-of-file marker may be missing.'
  merge: -1
  pgno: 248
- img_proc: true
  md: '# Recording an Error Message in the Application Event Log


    An alternative to creating custom log files for your scripts is to record error
    messages in the Windows application event log. This is achieved using the WshShell
    object''s LogEvent() method:


    On Error Resume Next


    ```

    Err.Raise(7)

    ```


    ```

    Set objWshShell = WScript.CreateObject("WScript.Shell")

    obWshShell.LogEvent 1, "Test.Vbs Error: " & Err.Number & " & Description = " &
    _ \

    Err.Description & " = , Source = " & Err.Source

    ```


    In this example, "out of memory" error has been again simulated, this time the
    error has been written to the Windows event log using the WshShell object''s LogEvent()
    method. Only two arguments were processed. The first is a number indicating the
    type of event being logged. Table 9.1 lists the different types of events that
    are supported by Windows. The second argument was the message to be recorded.
    Figure 9.8 shows how the message will appear when viewed from the Event Viewer
    on a computer running Windows 7.


    # Table 9.1 EVENT LOG ERROR INDICATORS


    | Value | Description |

    |---|---|n| 0 | Indicates a successful event |

    | 1 | Indicates an error event |

    | 2 | Indicates a warning event |

    | 4 | Indicates an informational event |

    | 8 | Indicates a successful audit event |

    | 16 | Indicates a failed audit event |


    ![](img/337e6368245d3aad07236ff6d4dacf23_249_0.png)


    Figure 9.8 writing out error messages to the application event log using the WshShell
    object''s LogEvent() method.'
  merge: -1
  pgno: 249
