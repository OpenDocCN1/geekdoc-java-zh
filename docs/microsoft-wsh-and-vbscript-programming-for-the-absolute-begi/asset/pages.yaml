    \ </package> | Enables multiple jobs to be defined within a single Windows Script\
    \ File |\n| <?resource> </resource> | Defines static data (constants) that can\
    \ be referenced by scripts within a Windows Script File |\n\n© Lee Ford, Jr. All\
    \ Rights Reserved.\n\n# Using the <?job ?> Tag\n\nThe <?job ?> tag allows you\
    \ to enable or disable error reporting and debugging within your Windows Script\
    \ Files. The use of this tag is optional. Unlike most tags, the <?job ?> tag does\
    \ not have a closing tag. The syntax for this tag is as follows:\n\n```\n<?job\
    \ error=\"flag\" debug=\"flag\" ?>\n```\n\nBoth error and debug are Boolean values.\
    \ By default, both are set to false. Setting error=\"true\" turns on error reporting,\
    \ allowing syntax and run-time errors to be reported. Setting debug=\"true\" turns\
    \ on debugging for Windows Script Files, allowing them to start the Windows script\
    \ debugger.\n\n# Trick\n\nTo take advantage of the <?job ?> tag's debug capability,\
    \ you'll need to install the Microsoft Windows script debugger utility. This utility\
    \ is designed to assist programmers in debugging script errors. To learn more\
    \ about this utility, check mdn.microsoft.com/en-us/library/ms875975(v=exchg65).aspx.\n\
    \nThe following example demonstrates how to use the <?job ?> tag within a Windows\
    \ Script File:\n\n```\n<?job>\n<?job error=\"true\" debug=\"true\"?>\n<script\
    \ language=\"VBScript\">\n  MsgBox \"Error handling and debugging have been enabled.\"\
    \n</script>\n</?job>\n```"
