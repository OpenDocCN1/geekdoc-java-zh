  md: '# Adding Comments


    One of the easiest VBScript statements to understand the comment statement. The
    comment statement gives the ability to add to your VBScripts descriptive text
    that you wrote the script the way you did. Documenting your scripts with comments
    makes them easier to support and helps others who may come after you to pick up
    where you left off. Comments do not have any effect on the execution of your scripts
    and you should use them liberally.


    Comments can be added to scripts using the VBScript Rem (short for “remark”) statement,
    as follows:


    Rem Use the VBScript MsgBox() function to display a message

    MsgBox "Thanks for playing!"


    Comments can also be created using the '' character:


    Use the VBScript MsgBox() function to display a message

    MsgBox "Thanks for playing!"


    The '' character is my preferred style. I find it less intrusive and just as effective.


    Also, you can add a comment to the end of any statement:


    MsgBox "Thank you for playing" ''Display a thank you message


    > Hint

    One sign of an experienced programmer is the number and usefulness of comments
    added to his scripts. Consider adding comments that describe the function of variables,
    constants, and arrays. Also use them to explain complicated pieces of coding.


    Comments can also be used to create a script template, which will provide additional
    structure to your VBScripts. For example, consider the following template:


    ```

    ********************************************************************

    ''Script Name: ScriptName.vbs

    ''Author: Author Name

    ''Created: MM/DD/YY

    ''Description: Xxxxxxxxxxxxxxxxxxxxx.

    ********************************************************************

    ```


    ```

    ''Initialization Section

    Option Explicit

    On Error Resume Next

    Dim...

    Const...

    ```'
