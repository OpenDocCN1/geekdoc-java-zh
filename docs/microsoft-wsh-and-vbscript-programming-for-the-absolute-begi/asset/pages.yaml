  md: '# Chapter 3 • VBScript Basics


    ![](img/337e6368245d3aad07236ff6d4dacf23_73_0.png)


    As you go through the steps involved in creating this game, you''ll learn how
    to use a number of VBScript and WShell object methods. You''ll also get a brief
