    # # Combining Different Scripting Languages


    In this chapter, you will learn how to develop a new type of script, called a
    Windows Script File, which enables you to combine VBScript with one or more other
    WSH-supported scripting languages to create a single executable script. Doing
    so enables you to take advantage of the strengths of each individual scripting
    language. Specifically, in this chapter I''ll demonstrate how to develop Windows
