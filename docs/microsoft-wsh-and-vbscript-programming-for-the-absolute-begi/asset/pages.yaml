  md: '# Microsoft WSH and VBScript Programming for the Absolute Beginner, Fourth
    Edition


    You should assign descriptive variable names in your scripts and use a standard
    approach in the way that you use in the spelling of your variables. Up to this
    point in the book, I have defined variables using complete words or parts of words,
    I have begun each word or part of a word with a capital letter, as in Dim MyBirthday.


    Another approach that many programmers take when naming variables is to add a
    three-character prefix, sometimes referred to as "Hungarian Notation," to the
    beginning of each variable name. For example, instead of naming a variable MyBirthday,
    you would name it dtmMyBirthday. This way, when someone examines the first three
    characters of the variable name, they''ll be able to tell that it contains a data.
    The following list identifies typical prefixes associated with each of the variables
    subtypes supported by VBScript.


    +   - Boolean: bln

    - Byte: byt

    - Currency: cur

    - Date: dtm

    - Double: dbl

    - Error: err

    - Integer: int

    - Long: lng

    - Object: obj

    - Single: sng

    - String: str

    - Variant: var


    # Variable Scope


    Another key that you need to understand when working with variables is variable
    scope. In this context, scope refers to the ability to reference a variable and
    its assigned value from various locations within a script.


    VBScript supports two different scopes: global and local. A variable with a global
    scope can be accessed from any location within the script. However, a variable
    with a local scope can only be referenced from within the procedure that defines
    it. VBScript supports two types of procedures, subroutines and functions, both
    of which are discussed in detail in Chapter 7.


    As you know, a procedure is a collection or group of statements that is executed
    as a unit. Without getting too far ahead of myself, for just note that a variable
    defined outside a procedure is global in scope, meaning that it can be accessed
    from any location within the script, including from within the script''s procedures.
    A variable that is local in scope is defined within a procedure.


    # Modifying Variable Values with Expressions


    Throughout this chapter, you have seen the equals sign (=) used to assign value
    to variables, like this:


    ```

    strName = "Jerry Lee Ford, Jr."

    ```


    To change the value assigned to a variable, all you have to do is use the equals
    sign again, along with a new value, like this:


    ```

    strName = "Jerry L. Ford, Jr."

    ```'
