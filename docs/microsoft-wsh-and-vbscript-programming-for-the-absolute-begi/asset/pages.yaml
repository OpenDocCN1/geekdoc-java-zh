  md: '# 3


    # VBScript Basics


    This chapter begins your VBScript education by teaching you a number of important
    concepts. You''ll learn about the objects that make up the VBScript core and run-time
    object models. In addition, you''ll learn about basic VBScript syntax, functions,
    reserved words, and special characters. You''ll also learn about VBScript and
    WSH output functions. Along the way, you will create a math game while learning
    more about how VBScript works with the WSH. You also will learn the following:


    +   * The rules that you must follow when writing VBScripts

    * The objects that make up the VBScript core and run-time object models

    * How to enhance your scripts using built-in VBScript functions

    * Different ways of displaying script output


    # Project Preview: The Math Game


    This chapter''s game project shows you a programming technique that enables you
    to write VBScripts that can open and interact with other Windows applications.
    It''s called MathGame.vbs, and it tests the player''s understanding of the principle
    of precedence in solving a numeric expression. If the user gets the answer correct,
    he or she is congratulated for possessing superior math skills. If the provider
    provides an incorrect answer, then the game offers to teach the player how to
    solve the expression.


    To teach the player how to solve the equation, the program opens the Microsoft
    Word application and types out instructions that explain the steps required to
    solve the problem. To further demonstrate how the equation is solved, the program
    starts the Windows Calculator application and uses it to solve the equation.'
