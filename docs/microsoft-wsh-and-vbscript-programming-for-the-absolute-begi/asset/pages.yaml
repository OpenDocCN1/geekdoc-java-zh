  md: '# Working with Built-in VBScript Objects


    To get any real work done, VBScript depends on access to objects and their associated
    properties and methods. So far, you have learned how to work with objects provided
    by the WSH and the VBScript run-time object model. Besides these collections of
    objects, your VBScripts have access to a small collection of built-in or core
    objects. Using these built-in VBScript objects, you can create scripts that react
    to errors, create their own custom objects, and perform a host of complex parsing
    operations by dissecting the contents of strings. Discussing VBScript''s built-in
    objects, this chapter also assists you in creating a Tic Tac Toe game. Specifically,
    you will learn about the following:


    +   - VBScript''s built-in objects and collections

    - How to define your custom objects

    - How to associate properties and methods with custom objects

    - How to trigger events associated with custom objects

    - How to perform advanced string parsing operations


    # Project Preview: The Tic Tac Toe Game


    In this chapter, you will develop a Tic Tac Toe game. Through the development
    of this game, you will learn how to create and control a two-player game. To do
    this, you will have to develop the logic that controls who goes next while simultaneously
    making that every player''s move is valid. Figures 11.1 through 11.5 demonstrate
    the overall flow of the game from beginning to end, as seen on a computer running
    Windows 8.1.'
  merge: -1
  pgno: 285
- img_proc: true
