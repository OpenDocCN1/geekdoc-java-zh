  md: '# Chapter 2 • An Introduction to the Windows Host


    # Working with the WScript object


    The WScript object is an extremely important object that you will find working
    with all the time in your VBScripts. It provides access to a number of very useful
    methods that''ll see throughout this book. These methods include the following:


    +   - CreateObject(). This establishes an instance of the specified object.

    * DisconnectObject(). This prevents a script from accessing a previously instantiated
    object.

    * Echo(). This displays a text message in the Windows Console or a pop-up dialog
    box, depending on which execution runs the script.

    * Quit(). This terminates a script''s execution.

    * Sleep(). This pauses the execution of a script for a specified number of seconds.


    The WScript object is referred to as a public or exposed object. The WSH core
    object model has three other objects: WshController, WshShell, and WshNetwork.
    Each of these objects must be instantiated within your scripts using the CreateObject()
    method. All the other objects in the WSH core object model can be instantiated
    only by using properties or methods associated with the WScript, WshController,
    WshShell, and WshNetwork objects.


    # Hint


    You will see more examples of how to work with the WScript object and most of
    the other objects that comprise the WSH core object model as you make your way
    through this. In addition, you will find a detailed technical overview of all
    14 of these objects, including their methods and properties, in Appendix C, "The
    WSH Core Object Model." As a peek at what lies ahead, you may want to jump to
    Appendix C and spend a few minutes looking it to get a better feel of the steps
    involved in instantiating objects and then working with their properties and methods.


    # Configuring WSH Execution Hosts


    So far you''ve used CScript.exe and WScript.exe execution hosts'' default settings
    for each script that you''ve created and run. If you want to, you can modify these
    default settings to suit your personal preferences. The WSH provides separate
    configuration settings for the WScript.exe and CScript.exe execution hosts. Because
    the WScript.exe execution host can process scripts from either the Windows GUI
    or the command line, there are two different ways to configure it. The WSH also
    allows you to override execution host settings on the fly by passing configuration
    arguments to the execution host when starting a script''s execution. Finally,
    the WScript.exe execution host allows you to set execution host settings unique
    to a particular script using a WSH file. Each examined in detail in the sections
    that follow.'
  merge: -1
