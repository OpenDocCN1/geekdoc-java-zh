  md: '# Building Dynamic Arrays


    Up to this point, all the arrays in this book have been static, meaning that their
    size was predetermined at execution time. In the real world, you won''t always
    know how many elements your arrays will need to store. For example, you might
    write a script that enables the user to supply a list of people to be invited
    to a party. Depending on the number of friends the user has, the amount of data
    to be stored in the array can vary significantly. VBScript''s solution to this
    type of situation is dynamic arrays. A dynamic array is an array that can be resized
    during execution as many times as necessary.


    You can use the Dim statement to define a dynamic array as shown here:


    ```

    Dim astrItsMyParty()

    ```


    Note that an index number for the array was not supplied inside the parentheses.
    This allows you to come back later on the script and resize the array using the
    ReDim statement as demonstrated here:


    ```

    ReDim astrItsMyParty(2)

    ```


    Once resized, you can add new entries:


    ```

    astritsMyParty(0) = "Molly"

    astrItsMyParty(1) = "William"

    astrItsMyParty(2) = "Alexander*

    ```


    If the script later needs to add more elements to the array, you can resize it
    again:


    ```

    ReDim Preserve astrItsMyParty(4)

    ```


    This statement increased the size of the array so that it can now hold an additional
    two elements. Note the use of the Preserve keyword on the ReDim statement. This
    parameter was required to prevent the array from losing any data stored in it
    before the array''s size was increased.


    # Trap


    Dynamic arrays can be increased or decreased in size. If you decrease the size
    of a dynamic array, all elements stored in the array are lost even if the Preserve
    keyword is added to the ReDim statement.


    Now let''s look at one more example of how to work with dynamic arrays. In this
    example, an array astrItsMyparty is initially set up with capacity to store one
    element. The user is prompted to provide a list of names to be added to the array.
    Each time a new name is supplied, the script dynamically increases the size of
    the array by 1, allowing it to hold additional information.


    ```

    Dim astrItsMyParty()

    ReDim astrItsMyParty(0)

    Dim intCounter, strListOfNames

    ```'
