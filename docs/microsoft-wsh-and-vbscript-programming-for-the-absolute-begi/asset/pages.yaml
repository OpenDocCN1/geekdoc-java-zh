  md: '# Improving Script Design with Procedures


    VBScript procedures improve the overall organization and readability of scripts,
    giving you a way to group related statements and execute them as a unit. Once,
    a VBScript procedure can be called from any location in your script and can be
    executed over and over again as needed. This enables you to create scripts that
    are smaller and easier to maintain.


    VBScript provides support for two types of procedures:


    +   - Subroutine. This is a VBScript procedure that executes a set of statements
    without returning a result.

    - Function. This is a VBScript procedure that executes a set of statements and,
    optionally, returns a result to the statement that called it.


    A procedure is simply a collection of VBScript statements, when called, are executed
    as a unit.


    # Trick


    I recommend using procedures as the primary organization tool for all VBScripts.
    By organizing a script into procedures, you break it down into a collection of
    units. This allows you to separate processes from one another, making it easier
    to develop scripts in a modular fashion, one component at a time.


    # Introducing Subroutines


    The VBScript Sub is used to create subroutines. Subroutines are great for grouping
    together statements that perform a common task from which a result is not required.
    When called, subroutines execute their statements and then returning control back
    to the calling statement.


    The syntax for this type of procedure is as follows:


    ```

    [Public | Private] Sub name [(arglist)]

    statements

    ```


    ```

    End Sub

    ```


    Private is an optional keyword that specifies the subroutine cannot be called
    by other procedures within the script, limiting its ability to reference it. Public
    is an optional keyword that specifies the subroutine can be called by other procedures
    within the script. name is the name assigned to the subroutine. As with variables,
    a subroutine''s name must be unique within the script that defines it. arglist
    represents a list of one or more comma-separated arguments that can be passed
    to the subroutine for processing, and statements represents the statements that
    make up the subroutine.


    For example, the next subroutine is called DisplayScreen(). It does not accept
    any arguments and does not return anything back to the VBScript statement that
    calls it. What does it display a splash screen any time it is called.'
  merge: -1
  pgno: 187
- img_proc: true
  md: '# Microsoft WSH and VBScript Programming for the Absolute Beginner, Fourth
    Edition


    ```

    Sub DisplaySplashScreen()

    MsgBox "Thank you for playing the game. © Jerry Ford 2014." & _

    vbCrLf & vbCrLf & "Please play again soon!", 4144, "Test Game"

    End Sub

    ```


    You can execute this by calling it from anywhere within your script using the
    following statement:

    DisplaySplashScreen()


    The following example is a rewrite of the previous subroutine, only this time
    the subroutine accepts an argument. The argument passed to the subroutine will
    be a message. Using a subroutine in this manner, you can develop scripts that
    display all their pop-up dialog boxes using one subroutine.


    ```

    Sub DisplaySplashScreen(strMessage)

    MsgBox strMessage, 4144, "Test Game"

    End Sub

    ```


    You can call this subroutine from anywhere within your script like this:

    DisplaySplashScreen("Thank you for playing the game. © Jerry Ford & _

    "2014." & vbCrLf & vbCrLf & "Please play again soon!")


    # Creating Functions


    Functions are almost exactly like subroutines. Functions can do anything that
    a subroutine can do. In addition, a function can return a result to the statement
    that it called. As a result (to keep things simple), I use functions, rather than
    subroutines, within my VBScripts.


    The syntax for a function is as follows:


    ```

    [Public | Private] Function name [(arglist)]

    statements

    End Function

    ```


    Private is an optional keyword that specifies that the function cannot be called
    by other procedures within the script, limiting the ability to reference it. Public
    is an optional keyword that specifies that the function can be called by other
    procedures within the script. name is the name assigned to the function. With
    variations, a function''s name must be unique within the script that defines it.
    arglist represents a list of one or more comma-separated arguments that can be
    passed to the function for processing, and statements represents the statements
    that make the function.


    Let''s look at an example of a function that does not return a result to its calling
    statement:


    ```

    Function DisplaySplashScreen()

    MsgBox "Thank you for playing the game. © Jerry Ford 2014." & _

    vbCrLf & vbCrLf & "Please play again soon!", 4144, "Test Game"

    End Function

    ```'
