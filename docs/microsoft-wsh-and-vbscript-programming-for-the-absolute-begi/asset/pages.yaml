  md: '# Introduction


    Welcome to the fourth edition of Microsoft WSH and VBScript Programming for the
    Absolute Beginner. Visual Basic Scripting language (VScript) is a member of the
    Visual Basic family of programming languages. Other members of this family include
    Visual Basic and Visual Basic for Applications (VBA). Visual Basic is a very powerful
    and complex programming language used by programming professionals all over the
    world. VBA is a programming language based on Visual Basic that is designed to
    provide a programming environment for Microsoft Office applications such as Excel
    and Access.


    Like VBA, WSH represents a subset of the Visual Basic programming language. VBScripts
    can run on any computer running Windows 95 or later as the Windows Script Host
    (WSH) is installed. The WSH represents one of several environments in which VBScripts
    can run. Other environments in which VBS can run include HTML pages processed
    by Internet Explorer-compatible browsers and within Microsoft Outlook or Active
    Server Pages (ASP). Of all the environments in which VBScripts can run, the most
    is commonly used. However, by learning to write VBScripts you are also learning
    much of the prerequisite knowledge required to write VBScripts that will run in
    each of these other environments.


    The WSH provides VBScripts with the capability to execute on Windows computers
    and to directly access and manipulate Windows resources, like the desktop, file
    system, Registry, printers, network resources, and so on. You can think of the
    relationship between VBScript and the WSH as follows: VBScript provides the capability
    to create scripts and apply logic to perform specific tasks that manipulate Windows
    resources, which are made available via the WSH.


    # Why VBScript?


    VBScript is an excellent first programming language to learn. Its simplicity makes
    basic programming concepts easy. Yet VBScript is a powerful scripting language
    from which you can learn even the most complex programming concepts as to perform
    object-based programming. Unlike Visual Basic, VBA, and many other programming
    languages, there is no complex development environment to learn. In fact, you
    can create all VBScripts using a simple text editor as Windows Notepad.


    VBScript provides a foundation that will later make learning Visual Basic and
    VBA a bit easier. VBScript is a great language for developing small but powerful
    scripts for all sorts of tasks. In fact, you will find that many VBScripts are
    not very big when compared to programs written using more traditional programming
    languages. As you read through this book, I think you will be amazed at just what
    you can do with only a handful of lines of Vscript code. This makes VBScript the
    perfect language for rapid development, meaning that you can write a VBScript
    to perform a task in a fraction of the time that it might take to write a program
    that performs the same task using a different programming language. Best of all,
    VBScript is free.'
  merge: -1
