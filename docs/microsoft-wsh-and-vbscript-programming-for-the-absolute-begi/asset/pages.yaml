    # The VBScript InputBox() Function


    VBScript provides two built-in functions that you can use to display text messages
    and interact with users. The InputBox() function displays your text message in
    a pop-up dialog box that also includes an entry field. You have already seen the
    InputBox() function in action both the Knock game and the Rock, Paper, and Scissors
    game.


    The syntax for this function is as follows:


    ```

    Response = InputBox(StrText[, TitleBarMsg[], default[], xpos][], ypos)\[, helpfile,
    context]]

    ```'
