    # The Final Result


    Take a few minutes to double-check all your work and then give this game a whirl.
    This is a pretty big script, so you may have to fix a few syntax errors introduced
    by typos you may have made when keying the script. Once everything is working
    correctly, you should have a really cool game to share with—and impress—all your
    friends!


    # Summary


    In this chapter, you learned how to use procedures to streamline the organization
    of your VBScripts, enabling you to develop larger and more complex scripts and,
    of course, games. In addition, you learned how to create reusable units of code,
    enabling you to make your scripts smaller and easier to manage. Finally, you learned
    how to control variable scope by localizing variables within procedures.


    +   1. Give the Blackjack Lite game''s splash screen a more polished look by providing
    additional information in the “Rules and Instructions” section of the dialog box.

    2. Improve the Blackjack Lite game by adding logic to include the selection of
    the card''s suit (club, heart, spade, or diamond).

