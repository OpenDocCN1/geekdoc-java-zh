  md: '# Game Development


    The following steps outline the process you''ll need to go through to complete
    the development of the game:


    +   1. Add the standard documentation template and fill in its information.


    +   2. Define the constants and variables that will be used by the script.


    +   3. Create the splash screen that welcomes the user to the game and determines
    whether the user wants to play the game.


    +   4. Use the InputBox() function to display questions, collect the player''s
