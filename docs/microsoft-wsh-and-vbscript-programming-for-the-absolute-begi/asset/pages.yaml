    # Opening and Closing Files


    Now that you know how to instantiate the FileSystemObject object within your VBScripts
    and have seen an example of how to use it to reference other run-time objects
    and their associated properties, you are ready to start how to work with files
    and folders.


    Before you open a file or create a new file, you must determine whether the file
    already exists. You can do this using the FileSystemObject object''s FileExists()
    method as demonstrated here:


    ```

    Set objFso = WScript.CreateObject("Scripting.FileSystemObject")

    If (objFso.FileExists("C:\Temp\Sample.txt")) Then

    ```


    ```

    End If

    ```


    To begin working with a file, you must open it. This is done using the FileSystemObject
    object''s OpenTextFile() method, which requires you to provide the following pieces
    of information:


    +   * Name and path of the file

    * How to open the file

    * Whether to create a new file if the file does not exist


    Table 8.1 defines the constants and the values you will use to tell the OpenTextFile()
    method how to open the file.


    | Table 8.1 OpenTextFile() Constants |

    | Constant | Description | Value |

    | ForReading | Opens a file in preparation for reading | 1 |

    | ForWriting | Opens a file in preparation for writing | 2 |

    | ForAppending | Opens a file allowing text to be written to the end of the file
    | 8 |'
