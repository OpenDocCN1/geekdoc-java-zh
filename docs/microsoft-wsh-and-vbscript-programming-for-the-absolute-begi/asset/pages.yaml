    # Storing Data That Changes During Script Execution


    Chances are most programs that you will have data in them that need to be modified.
    For example, you may write a script that asks the user for input and modifies
    the data while processing it. In this situation, you can define variables. Two
    categories of variables are available to your scripts: variables that you define
    in your scripts and environment variables that are maintained by Windows that
    your scripts can reference.


    # VBScript Data Types


    Unlike many programming languages, VBScript supports only one type of variable,
    called a *variant*. However, a variant is very flexible and can be used to store
    a number of different types of data. Table 4.4 lists data types supported by VBScript.


    > A variant is a type of variable that can contain any number of different types
    of data.


    | Table 4.4 VBSCRIPT SUPPORTED VARIANT SUBTYPES

    | Subtype | Description |

    | --- | --- |

    | Boolean | A variant with a value of `True` or `False` |

    | Byte | An integer value is between 0 and 255 |

    | Currency | A currency value between -922,337,203,685,477,580 and 922,337,203,685,477,580
    |

    | Date | A number representing a date between January 1, 100 and December 31,
    9999 |

    | Double | A floating-point number with a range of -1.79769313486232E308 to -4.94065458412472E-324
    or 1.79769313486232E308 |

    | Empty | A variant that has not been initialized |

    | Error | A VBScript error number |

    | Integer | An integer with a value that is between -32,768 and 32,767 |'
