  md: '# Chapter 2 • An Introduction to the Windows Script Host


    Now let''s look at some examples of how to modify the configuration of the execution
    hosts. By default, the WSH sets WScript.exe as the default execution host. However,
    you can change this by typing the following-command and pressing the Enter key:


    ```

    cscript //H:cscript //s

    ```


    The //H:cscript option makes CScript the default execution host and the //s option
    makes the change permanent. If you leave the //s option off the command, the change
    would be in effect for your current working session only.


    To change the default command-line execution host back to WScript.exe, type the
    following command and press the Enter key:


    ```

    wscript //H:wscript //s

    ```


    Now let''s try an example that sets more than one configuration option:


    ```

    wscript //H:nologologo //t:60

    ```


    In this example, the CScript execution host is set as the default. In addition,
    the //nologologo option prevents the display of the WScript logo during script
    execution. It also prevents the display of the following-text after any output
    text when scripts are executed from the command line:


    Microsoft (R) Windows Script Host Version 5.8

    Copyright (C) Microsoft Corporation. All rights reserved.


    The //t:60 option prevents any script from executing for more than 60 seconds.
    Finally, the //s option saves all specified settings.


    # Trick


    Even the best programmers can make mistakes. Sometimes these mistakes cause scripts
    to behave in unexpected ways, such as being stuck in a loop that executes forever.
    By setting the //t:nn option for both the WScript.exe and CScript execution hosts,
    you can set up a safety net that prevents any script that you run from executing
    for more than a specified amount of time.


    # Configuring WScript.exe Desktop Execution


    The WScript.exe execution host''s desktop configuration settings are different
    from its command-line configuration settings. For one thing, there are only two
    configuration settings. The first specifies an optional time for script execution,
    and the second whether the WScript logo is displayed when scripts are run from
    the Windows Console.'
  merge: -1
  pgno: 57
- img_proc: true
  md: '# Microsoft WSH and VBScript Programming for the Absolute Beginner, Fourth
    Edition


    The steps involved in configuring the WScript.exe execution host from the Windows
    desktop are as follows:


    +   1. Open a Windows Console.

    2. Type WScript and then click OK. The Windows Script Host Settings dialog box
    appears, as shown in Figure 2.6.


    ![](img/337e6368245d3aad07236ff6d4dacf23_58_0.png)


    > **Figure 2.6** Modifying the WScript.exe execution host''s desktop configuration.
    © 2014 Microsoft Corporation. Used with permission from Microsoft.


    +   3. By default, the WScript.exe execution host does not have an execution time
    setting. To configure one, select the Stop Script After Number of Seconds checkbox
    and then specify a time (in seconds).

    4. By default, the WScript.exe execution host displays its logo when scripts are
    executed from the Windows Console. To prevent this behavior, deselect the Display
    Logo When Executed in the Command Console checkbox.

    5. Click OK.


    The configuration settings established through this procedure are stored in the
    following registry key: HKLM\Software\Microsoft Script Host\Settings.


    # Overriding Command-Line Execution Settings


    So far, you''ve learned how to configure the default execution of the WScript.exe
    and CScript.exe hosts from the Windows command line and desktop. Now let''s see
    how to override the default command-line settings, without permanently changing
    them, to temporarily alter them for the execution of a specific script.'
  merge: -1
  pgno: 58
- img_proc: true
  md: '# Chapter 2 • An Introduction to the Windows Script Host


    The syntax for temporarily overriding WScript.exe and CScript.exe execution is
    as follows:


    ```

    wscript scriptname [/options] [arguments]

    cscript scriptname [/options] [arguments]

    ```


    First, open the Windows Console and type the name of the execution host you want
    to use to run the script. Next, type the name and path of the script to be executed.
    Then as many configuration settings as you want, preceding each with a pair of
    // characters. If the script''re executing any input to be passed to it execution
    time, specify the required arguments. Finally, press the Enter key.


    Now lets look at a few examples of how to override host execution settings. Let''s
    assume you are working with a script called Test.vbs and want to prevent it from
    executing more than 30 seconds. Open the Windows Command Console and type the
    following command to run the script using the WScript.exe execution host:


    ```

    wscript Test.vbs //T:30

    ```


    To execute the script using the CScript.exe execution host for a maximum of 30
    seconds, type the following command:


    ```

    cscript Test.vbs //T:30

    ```


    Now lets look at a slightly more complicated example, in which multiple configuration
    settings are overridden:


    ```

    wscript Test.vbs //T:30 //nologo

    ```


    In this example, the script is prevented from executing for more than 30 seconds
    using the WScript.exe execution host. In addition, the WScript.exe execution host''s
    logo is suppressed to prevent it from being displayed at the beginning of the
    script''s execution.


    # Customizing WScript.exe Settings for Individual Desktop Scripts


    The WSH also provides a way, using the WScript.exe execution host, to permanently
    override configuration settings for specific runs from the Windows desktop. This
    is done by creating a text file with the same name as the script and giving it
    a wsh extension. Then, within the WSH file, you can specify WSH configuration
    settings. For example, to set up a WSH for a script named Test.vbs, you need to
    create a file called Test.wsh and save it in the same folder where the Test.vbs
    script resides. Then run the script by double-clicking the WSH file or double-clicking
    the script itself. If you double click the WSH file, the WSH automatically finds
    the script that is associated with it and, after processing the configuration
    settings stored in the WSH file, runs the script. Conversely, when double-click
    a script, the WSH first looks to see if it has an associated WSH file before running
    it. If it does not, the WSH processes it using the execution host''s default configuration
    settings.


    > In the context of this discussion, an argument is a piece of data passed to
    a script for processing. For example, if you wrote a VBS to create new user accounts,
    your script might expect to pass it one or more usernames to process.'
  merge: -1
