  md: '# # 1

    Getting Started with the WSH and VBScript


    In this chapter, you''ll be introduced to a number of topics. These include a
    high-level overview of the Windows Script Host (WSH) and VBScript. You will learn
    how WSH and VBScript work together to provide a comprehensive scripting environment.
    You will also be introduced to HTML Applications (HTAs) and learn how an HTA can
    be used to provide your scripts with a graphical user interface (GUI). In addition,
    you''ll learn a little bit about VBScript''s history and its relationship to other
    languages in the Visual Basic programming family. As a wrap-up, you''ll learn
    how to create and execute your very first VBScript.


    Specifically, you will learn the following:


    +   - The basic mechanics of the WSH

    - How to write and execute VBScripts using the WSH

    - Background information about VBScript and its capabilities

    - How you can use HTAs to add GUIs to your scripts

    - How to create your first VBScript game


    # ## Project Preview: The Knock Knock Game


    In this chapter, as in all the chapters to follow, you will learn how to create
    a computer game using VBScript. This chapter''s game is called the Knock Knock
    game. Actually, it''s more of a riddle than a game, but it provides a great starting
    point for demonstrating how VBScript works and how it can be used to develop games
    and other useful scripts.'
