  md: '# 14


    # Adding a GUI to Your Scripts


    As you have no doubt come to understand, VBScripts executed by the WSH run within
    the constraints of either the WScript.exe or CScript.exe execution host. As, other
    than the ability to display text in a couple of pop-up dialog boxes, your scripts
    are invariably tied to the Windows command prompt. However, there is another Windows
    scripting technology capable of leveraging the WSH while at the same time enabling
    you to wrap your scripts inside a graphical user interface (GUI). This technology
    is known as HTML Applications (HTAs). This chapter will provide you with an overview
    of HTAs and examples of their usage.


    Specifically, you will learn the following:


    +   - About the components that make up HTAs

    - How to wrap your scripts in GUIs using HTML

    - How to create event driven scripts

    - How to configure the appearance of your GUI applications using Cascading Style
    Sheets (CSS)


    # Project Preview: The HTA Rock, Paper, Scissors Game


    As this book''s final project, you will learn how to update the Rock, Paper, Scissors
    game that you worked on in Chapter 5, "Conditional Logic". You will accomplish
    this by converting the Rock, Paper, Scissors game into an HTA, adding the HTML
    tags and content needed to create the game''s interface as well as a little CSS
    to implement the application''s presentation. Figures 14.1 and 14.2 demonstrate
    the operation of both the WSH and the new HTA version of the game as seen on a
    computer running 7.'
  merge: -1
