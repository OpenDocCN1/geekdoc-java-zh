    This game is fairly lengthy and requires a number of variables:


    +   - IntPlayGame. This stores the player''s reply when asked if he wants to play
    a game.

    - strCardImage. This stores the message displayed in the game''s initial pop-up
    dialog box.

    - intUserCard. This stores the total value of the cards dealt to the user.

    - intComputerCard. This stores the total value of the cards dealt to the computer.

    - intAnotherCard. This stores the player''s reply to the question of whether he
    wants another round.

    - intUserNextCard. This stores the value returned by the function that retrieves
    a random number and is later added to the value of the intUserCard variable.

    - strDone. This stores a value indicating whether the player is ready to hold.

    - intNewComputerCard. This stores the value returned by the function that retrieves
    a random number and is later added to the value of the intComputerCard variable.

    - intPlayAgain. This stores the player''s reply when asked he wants to play another
    game.

    - strBusted. This stores a value indicating whether the player has busted.

    - strTextMsg. This stores the text to appear in pop-up dialog boxes displayed
    by the game.


    # Developing the Logic for the Main Processing Section


    The script''s main processing section is very small and consists only of a call
    to the DoYouWantToPlay() function to determine whether the player wants to play
    the game, followed by the Select Case statement, which determines the player''s
    reply.


    ''Main Processing Section


    ```

    ''Ask the user if he or she wants to play

    intGame = DoYouWantToPlay()

    ```


    ```

    Select Case intPlayGame

    Case 6 ''User clicked on Yes

    NowGoPlay()

    Case 7 ''User clicked on No

    DisplaySplashScreen()

    End Select

    ```


    If the player clicks the button, then the NowGoPlay() function is called. Otherwise,
    the DisplaySplashScreen() function is called. This function displays a pop-up
    dialog box providing information about the game and then terminates the game''s
    execution.'
