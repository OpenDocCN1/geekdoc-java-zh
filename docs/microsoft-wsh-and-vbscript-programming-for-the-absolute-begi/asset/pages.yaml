  md: '# Resizing Arrays


    Sometimes it''s impossible to know how many elements an array will need to store
    when developing your scripts. For example, you might develop a script that uses
    the InputBox() function to prompt the developer to specify the data to be stored
    in the array. You might expect the user to specify only a few pieces of data,
    but the user may have an entirely different idea. To handle this type of situation,
    you need a way of resizing to allow it to store the additional data.


    One of dealing with this situation is to define the array without specifying its
    size, like as:


    ```

    Dim astrGameArray()

    ```


    This lets you define the array''s size later in the script. For example, you might
    want to define the array and later ask the user how many pieces of data he intends
    to provide. This is accomplished by using the ReDim statement:


    ```

    ReDim astrGameArray(9)

    ```


    This ReDim statement has set up the array to store up to 10 elements. After its
    size has finally been defined, you can begin populating the array with data.


    # Trap


    > If you use the ReDim statement to set up a new array by accidentally specifying
    the name of an array, the data stored in the existing array will be lost.


    Another, more flexible way of setting up an array so that it can be later resized
    is to replace the array''s original Dim definition statement with the ReDim statement.
    For example, the following statement sets up a new array capable of holding up
    to 10 elements:


    ```

    ReDim astrTestArray(9)

    ```


    However, if you populate this array with data and then later attempt to resize
    it, as shown next, you''ll lose all the data originally stored in the array.


    ```

    ReDim astrTestArray(19)

    ```


    To prevent this from happening, you can add the Preserve keyword to the ReDim
    statement, like as:


    ```

    ReDim Preserve astrTestArray(19)

    ```


    This statement uses VBS to expand the size of the array while preserving its current
    contents. After the array is expanded, you can then add more elements to it. For
    example, take a look at the next script. It defines an array with the capability
    to store five elements and then resizes the array to increase its storage capacity
    to eight elements. The script then uses a For...Each...Next loop to display the
    contents of the expanded array.'
  merge: -1
  pgno: 129
- img_proc: true
  md: "Microsoft WSH and VBScript Programming for the Absolute Beginner, Fourth Edition\n\
