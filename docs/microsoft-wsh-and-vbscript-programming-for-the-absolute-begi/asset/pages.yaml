    # VBScript Statements


    Like any programming language, VBScript is composed of programming statements.
    As you go through the chapters in this book, you''ll be introduced to the statements
    that make up the VBScript scripting language, learning a few different statements
    in every chapter, until by the end of the book, you''ve seen and worked with most
    of them.


    Table 3.1 lists the statements that make up the VBScript scripting language.


    | Table 3.1 VBSCRIPT STATEMENTS |

    | Statement | Description |

    |--- |--- |

    | Call | Executes a procedure |

    | Class | Defines a class name |

    | Const | Defines a constant |

    | Dim | Defines a variable |

    | Do..Loop | Repeatedly executes a collection of one or more statements as long
    as a condition remains True or until the condition becomes False |

    | Erase | Reinitializes the elements stored in an array |

    | Execute | Executes a specified statement |'
  merge: -1
