    | Subtype | Description |

    | --- | --- |

    | Long | An integer whose value is between -2,147,483,648 and 2,147,483,647 |

    | Null | A variant set to a null value |

    | Object | An object |

    | Single | A floating-point number whose value is between -3.402823E38 and -1.401298E-45
    or 1.401298E-45 and 3.402823E38 |

    | String | A string up to two billion characters long |


    > Jerry Lee Ford, Jr. All Rights Reserved.


    Variants automatically recognize the types of data that are assigned to and act
    accordingly. If a value is assigned to a variant, your script can use any of VBScript''s
    built-in functions to work with it. Likewise, if a string is assigned to a variant,
    your script can use any of VBScript''s built-in string functions to work with
    it.


    Like constants, VBScript provides you with some control over the way in which
    it identifies the types of values stored in a variant. For example, if you assign
    100 as the variable value, VBScript automatically interprets this as a number.
    But if you enclose the value in quotation marks, VBScript treats it as a string.


    VBScript also provides the capability to convert data from one type to another
    using VBScript functions. Your scripts to change the VBScript views works with
    data. For example, the following VBScript statement defines a variable MyBirthday
    and assigns it a text string of "November 20, 1964":


    ```

    MyBirthday = "November 20, 1964"

    ```


    VBScript views this variable''s value as a text string. However, using the CDate()
    function, you can convert the string value to date format:


    ```

    MyBirthday = CDate(MyBirthday)

    ```


    Now, instead of seeing the variable''s value as "November 20, 1964", VBScript
    sees it as 11/20/1964.


    # Hint


    VBScript provides a large number of conversion functions that you can use to convert
    from one data type to another. These functions include Asc(), CBool(), CByte(),
    Cbur(), CDate(), CDbl(), Chr(), CInt(), CLng(), CSng(), and CStr(). For more information
    about how to use these functions, see Chapter 7.


    ![](img/337e6368245d3aad07236ff6d4dacf23_112_0.png)'
