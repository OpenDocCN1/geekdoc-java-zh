  md: 'Chapter 11 • Working with Built-in VBScript Objects


    # # Designing the Game


    Besides its initialization and main processing sections, the game is made up of
    nine functions. Each function performs a specific task. Here is a list of the
    script''s functions along with a brief description of each associated tasks:


    +   * SetVariableDefaults(). This establishes default values for various script
    variables.


    +   * ClearGameBoard(). This resets each cell on the Tic Toe game board so that
    it appears blank or empty.


    +   * ManageGamePlay(). This controls the overall execution of the game, calling
    on other functions as necessary.


    +   * DisplayBoard(). This displays the game board along with instructions, error
    messages, and any move already made by each player.


    +   * DisplayGameResults(). This displays the final results of each game, identifying
    who won or whether the game resulted in a tie.


    +   * ValidateInput(). This ensures that players are only allowed to enter valid
    cell coordinates when taking their turns.


    +   * MarkPlayerSelection(). This associate input provided by players with the
    appropriate cell coordinates when they dominate on the game board.


    +   * SeeIfWon(). This checks the board to determine whether a player has won
    or whether the game has ended in a tie.


    +   * DisplaySplashScreen(). This displays information about the script and its
    author.


