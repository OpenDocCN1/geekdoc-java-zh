    # Adding Logic to Scripts


    One of VBScript''s best programming features is its strong support for looping
    or iterative statements. VBScript provides five different statements that can
    create loops. Loop your scripts with the capability to process large collections
    of data using a minimal number of statements that are repeatedly executed, either
    for each member of the collection or for a specified number of times.


    The following list provides a high-level description of VBScript''s looping statements:


    +   - For...Next. This establishes a loop that iterates for a specified number
    of times.

    - For...Each...Next. This establishes a loop that iterates through all the properties
    associated with an object.

    - Do...While. This establishes a loop that iterates for as long as a stated condition
    continues to be true.


    > Definition A loop is a collection of statements repeatedly executed to facilitate
    the processing of large amounts of data.'
