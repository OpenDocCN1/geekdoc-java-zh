  md: '# Introducing Remote WSH


    ne new WSH technology introduced in WSH 5.6 was Remote WSH. Remote WSH provides
    the ability to initiate and monitor the remote execution of scripts. Remote WSH
    initially faced some problems with deadlocks and error code reliability. These
    issues have been pretty much eliminated with Remote WSH 5.7. This appendix will
    introduce you to Remote WSH, explain its underlying architecture, and demonstrate
    its use.


    # Introducing Remote WSH


    Remote WSH provides programmers with the ability to remotely start and monitor
    the execution of scripts across a network. Data returned during script execution,
    you can programmatically react to remote execution, terminating it if necessary.
    For you to be able to take advantage of Remote WSH, the following requirements
    must be met:


    +   * The local computer must be running WSH version 5.6 or higher.

    * The remote computer must be running WSH version 5.6 or higher.

    * Both the local and remote computers must be running Windows 2000, XP, 2003,
    Vista, 2008, 2012, 7, or 8.

    * You must have administrative privileges over the remote computer.


    # Trap


    Remote WSH has several limitations. First, it cannot support the remote execution
    of statements that generate pop-up dialog boxes. These include the VBScript MsgBox()
    and InputBox() functions and the WSH Echo() and Popup() methods. In addition,
    Remote WSH scripts cannot access shared folders on remote computers. Finally,
    Remote WSH does not provide a message of returning output from remotely executed
    scripts.'
  merge: -1
  pgno: 425
- img_proc: true
  md: '# Microsoft WSH and VBScript Programming for the Absolute Beginner, Fourth
    Edition


    To work with Remote WSH, it must be enabled on any computer where remote scripts
    will be executed. To enable it, you must add a new value name Remote to the following
    Registry key and set it equal to 1:


    HKCU\Software\Microsoft\Windows Script Host\Settings\


    In addition to modify the Registry, you must also register the WScript execution
    host as a remote COM server by executing the following command on the remote Windows
    computer:


    ```

    WScript -regserver

    ```


    # Understanding Remote WSH’s Supporting Architecture


    Remote WSH is made up of three objects, each of which supports various methods,
    properties, and events. Figure B.1 shows the relationships that these objects
    and their properties, methods, and events have to one another.


    ![](img/337e6368245d3aad07236ff6d4dacf23_426_0.png)


    Figure B.1 The Remote WSH is made up of three high-level objects and their associated
    methods, properties, and events. © 2014 Cengage Learning.


    As shown in Figure B.1, the WshController object it the top-most of these three
    objects. The following statement demonstrates how to instantiate the WshController
    object:


    ```

    Set WshControl = CreateObject("WshController")

    ```'
  merge: -1
  pgno: 426
- img_proc: true
  md: '# Appendix B · Introducing Remote WSH


    The WshController object has a single method, CreateScript(), that is used when
    instantiating a WshRemote object. The CreateScript() method has the following
    syntax:


    ```

    ObjectReference.CreateScript(CommandLine,[CommandName])

    ```


    ObjectReference represents a reference to a WshController object. CommandLine
    is a text string identifying the location of the remote script and any switches
    that need to be included. ComputerName identifies the UNC name of the network
    computer on which the remote script is run. If it is omitted, the script will
    locally.


    The following statements demonstrate how to instantiate a WshController object
    named RemoteScript to copy and then a script Test.vbs to a remote computer named
    DSKTP001.


    ```

    Set WshControl = CreateObject("WshController")

    Set RemoteScript = WshControl.CreateScript(Test.vbs, DSKTP001)

    ```


    Although this example instantiates a WshRemote object and copies a script to a
    remote computer, it does not execute the script. You will learn how to do this
    shortly.


    # Executing Remote WSH Methods


    The WshRemote object supports two methods. The Execute() method provides the ability
    to initiate the remote execution of a script. The syntax supported by this method
    is outlined here:


    ```

    ObjectReference.Execute

    ```


    ObjectReference specifies the name of a WshRemote object. So to execute the Test.vbs
    script that was copied over the remote computer in the previous example, you would
    need to execute the following statement:


    ```

    RemoteScript.Execute

    ```


    The second method supported by the WshRemote object is the Terminate() method.
    This method gives you the ability to halt a remote script''s execution. This method
    has the following syntax:


    ```

    ObjectReference.Terminate

    ```


    ObjectReference specifies the name of a WshRemote object. So to halt the execution
    of the Test.vbs script on DSKTP001 computer, you could do so by executing the
    following statement:


    ```

    RemoteScript.Terminate

    ```


    # Responding to WSH Remote Events


    Remotely executed scripts generate any of three different events when they execute.
    These three types of events are outlined in Table B.1.'
  merge: -1
  pgno: 427
- img_proc: true
  md: '# Microsoft WSH and VBScript Programming for the Absolute Beginner, Fourth
    Edition


    | Event | Description |

    | --- | --- |

    | Start | Triggered when the remote script begins executing |

    | End | Triggered when the remote script stops executing |

    | Error | Triggered if the remote script experiences an error |


    © Jerry Lee, Jr. All Rights Reserved.


    You can capture and respond to these events. To capture these remote events, you
    must use the WScript object''s ConnectObject() method, which has the following
    syntax:


    ```

    ObjectReference.ConnectObject(TargetObject, EventPrefix)

    ```


    ObjectReference represents the WScript object. TargetObject identifies the object
    for which connection is being set up, and EventPrefix specifies the event''s prefix.

    Using the ConnectObject() method, you can connect an object''s events to a subroutine
    or function whose names contain the prefix. You must then create a procedure for
    each event you wish to capture. You do so by assigning each procedure a name that
    begins with the specified prefix followed by the underscore character and the
    event name. For example, the following statement would enable local script to
    capture events returned by a remote script with prefix of RemoteScript_


    ```

    WScript.ConnectObject RemoteScript, "RemoteScript_"

    ```


    Having established means of capturing remote events, you need to create event
    handlers for the events which you want to be able to respond, as demonstrated
    here:


    ```

    Function RemoteScript_Start()

    ''Add statements here to process the start event.

    End Function

    ```


    In this example, an event handler has been set up to execute when a remote script
    starts its execution. You can set similar event-handling procedures for both the
    End and Error events.


    # Accessing WSH Remote Object Properties


    If an error occurs with a remotely executed script, the Error event will trigger,
    which you can capture by setting up an event handler. Using this procedure, you
    can evaluate error information by examining different properties belonging to
    the WshRemoteError object. WSH Remote automatically captures and stores error
    information available through this object.'
  merge: -1
  pgno: 428
- img_proc: true
  md: '# Appendix B • Introducing Remote WSH


    If an error occurs, you can retrieve information about the error using the WshRemote
    object''s Error property. This property is used to access the WshRemoteError object,
    so that you can access WshRemoteError object properties where detailed error information
    is stored. Table B.2 provides a listing of all the properties belonging to the
    WshRemoteError object.


    Table B.2 Remote WSH Error Properties

    | Property | Description |

    |---|---|

    | Description | A description of error |

    | Number | The numeric error code associated with the error |

    | Line | The line number where the error occurred |

    | Source | The object responsible for reporting the error |

    | SourceText | The line of code that generated the error |

    | Character | The character position in the line of code where the error occurred
    |


    Jerry Lee Ford, Jr. All Rights Reserved.


    In addition to the Error property, the WshRemote object also has a Status property
    you can use to keep track of the status of remote scripts as they execute. Table
    B.3 provides a list of the possible range of values supported by this property
    and explains their meaning.


    Table B.3 WSH Remote Execution Status

    | Value | Description |

    |---|---|

    | 0 | The remote script has not started executing yet. |

    | 1 | The remote script is now executing. |

    | 2 | The remote script has finished executing. |


    Jerry Lee Ford, Jr. All Rights Reserved.


    # Working with Remote WSH: A Demonstration


    To understand how to work with Remote WSH, it helps to see an example in action.
    The following example demonstrates how to remotely execute a VBScript named Test.vbs
    on a remote computer named DSKTP001.'
  merge: -1
  pgno: 429
- img_proc: true
  md: '# Microsoft WSH and VBScript Programming for the Absolute Beginner, Fourth
    Edition


    *************************************************************************************

    ''Script Name: WSHRemoteDemo.vbs

    ''Author: Jerry Ford

    ''Created: 03/14/14

    ''Description: This script controls the remote execute of a VBScript named

    Test.vbs on a computer named DSKTP001.

    ************************************************************************************


    Initialization Section

    Option Explicit


    ```

    Set wshcontroller = CreateObject("WshController")

    Set wshRemote = wshcontroller.CreateScript("Test.vbs", "DSKTP001")

    ```


    Main Processing Section


    ```

    WshScript.ConnectObject wshRemote, "RemoteScript_"

    wshRemote.Execute


    Do Until wshRemote.Status = 2

    WshScript.Sleep 1000

    Loop

    ```


    Procedure Section


    ```

    Sub RemoteScript_Start()

    MsgBox "Test.vbs has started!"

    End Sub

    ```


    ```

    Sub RemoteScript_End()

    MsgBox "Test.vbs has terminated!"

    End Sub

    ```


    When executed, this script begins by setting up an instance of the WshController
    object. It sets up an instance of the WshRemote object and copies the Test.vbs
    script into the memory of the DSKTP001 computer. The ConnectObject() method is
    used to define an event prefix, allowing the script to capture events returned
    during the remote execution of Test.vbs. The WshRemote object''s Execute() method
    is then used to initiate the execution of the remote script. A loop is set up
    that executes every two seconds, stopping only when the value of the WshRemote
    object''s Status property indicates that the remote script finished executing.


    Two subroutines are defined in the script''s procedure section that serve as event
    handlers. The first subroutine executes when the Start event occurs and the second
    subroutine executes when the End event occurs.'
  merge: -1
