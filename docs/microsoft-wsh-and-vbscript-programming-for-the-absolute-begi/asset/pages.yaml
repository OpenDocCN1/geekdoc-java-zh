  md: '# Introducing Windows Script Files


    One the strengths of the WSH is that it supports a number of different scripting
    languages, including VBScript, JavaScript, Perl, Python, and REXX. Microsoft automatically
    equips the WSH with VBScript and JavaScript. Third-party software developers provide
    support for the other scripting languages. Besides executing scripts written in
    any of these scripting languages, the WSH enables you to put any combination of
    these into a single script file known as a Windows Script File.


    Extensible Markup Language, or XML, provides the glue for binding different scripts
    into a Windows Script File. In this chapter, I''ll cover some of the most commonly
    used WSH-supported XML statements. However, there is simply not enough space available
    in this book to completely cover every single XML element.


    Using XML, you specify the components that make up Windows Script Files. For example,
    you use XML to mark the locations within Windows Script Files where individual
    scripts (written in scripting language-such as VBScript or JavaScript) are embedded.
    Windows Script Files are saved as plain-text files with a .wsf extension and can
    be created using any plain-text or script editor.


    XML is case-sensitive and imposes a strict set of rules on the format of Windows
    Script Files. For example, within the context of the WSH, most XML tags occur
    in pairs with one opening and one closing tag. Failure to include a matching tag
    will result in an error.


    # Trick


    WSH XML version 1.0 supports both uppercase and lowercase spelling of tag elements.
    Lowercase spelling is preferred, and I recommend you use it. That way, if lowercase
    spelling becomes a requirement in a future version of XML, you will not have to
    retrofit your Windows Scripts Files for them to continue to run.


    # Examining WSH-Supported XML Tags


    XML represents an extensible and powerful multipurpose markup language. XML is
    therefore used in many environments, including the WSH. In this chapter, I''ll
    introduce you to a number of commonly used XML tags, and I will provide examples
    of how they''re used to build Windows Script Files.


    To begin, take a look at Table 12.1, which shows the XML tags that you''ll see
    demonstrated in this chapter''s examples.


    | Definition | A Windows Script File is a type of script that allows multiple
    scripts, written in any WSH-supported scripting language, to be created a single
    script. |

    | Definition | Extensible Markup Language, or XML, is a language similar in design
    and syntax to HTML. It is used within the context of the WSH to define the structure
    of Windows Script Files.'
  merge: -1
