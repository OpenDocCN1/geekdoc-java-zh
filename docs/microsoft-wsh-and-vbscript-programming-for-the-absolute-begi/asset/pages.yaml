    \ sets up the screensaver to begin running after a 10-minute period of user inactivity.\
    \ Finally, the last modification selects the screensaver that is to be run. To\
    \ test this script, run it and then log off and on again.\n\n# Network Administration\n\
    \nNetwork administration means many things to people. For one thing, it may mean\
    \ establishing connections to network drives so that a script can move, copy,\
    \ create, and delete files and folders on network computers. Network management\
    \ also means establishing or removing connections to network printers. In the\
    \ next sections, I will provide you with scripts that demonstrate how to connect,\
    \ and disconnect, from network drives and printers.\n\n# Mapping Network Drives\n\
    \nWhen you create a connection to a network drive (known as mapping), you may\
    \ make the network drive look as if it were local to your computer by assigning\
    \ it a drive letterthat is, as long as you have the appropriate set of security\
    \ permissions on the network drive. Connecting to and disconnecting from a network\
    \ drive is achieved using methods belonging to the WshNetwork object.\n\nTo create\
    \ a mapped drive, you must use the WshNetwork object's MapNetworkDrive() method:\n\
    \n```\nWshNetwork.MapNetworkDrive letter, name, [persistent, username],\n[password]\n\
    ```\n\nLetter is an available logical drive letter on your computer. The name\
    \ is the universal naming convention (UNC) name and network path of the network\
    \ drive. persistent is optional; it determines whether the mapping is permanent.\
    \ A value of True creates a permanent mapping. The default value of this setting\
    \ is False, which causes the connection to last only for the current working session.\
    \ username and password are optional and are used to supply the username and password\
    \ required to access the drive."
