  md: '# Chapter 12 • Combining Different Scripting Languages


    As you can see, both error reporting and script debugging have been enabled.


    # Using the &lt;xml&gt; Tag


    The &lt;xml&gt; tag is used to specify the version of XML required to support
    a Windows Script File. As with the &lt;job&gt; tag, the use of this is optional.


    When used, the &lt;xml ?&gt; tag must be the first statement in the Windows Script
    File. The syntax for the &lt;xml ?&gt; is as follows:


    ```

    <?xml version="version" standalone="DTDflag" ?>

    ```


    version specifies the version of XML required to support the Windows Script File.
    The current version is 1.0. standalone is used to specify an external document
    type definition, which is a feature not currently supported by the WSH. You can
    include it if you want, but you''ll have to specify it as having a value of Yes,
    and it will be ignored.


    When used, the &lt;xml ?&gt; tag enforces strict interpretation of all XML statements.
    It also enforces sensitivity while requiring that all values be specified within
    single or double quotes. Omitting this tag provides a less restrictive syntax.
    Let''s look at the following example, which demonstrates the placement of an &lt;xml
    ?&gt; tag at the beginning of a small Script File:


    ```

    <?xml version="1.0" standalone="yes" ?>

    <job>

    <job error="true" debug="true">

    <script language="VBScript">

    MsgBox "Error handling and debugging have been enabled."

    </script>

    </job>

    ```


    # The &lt;comment&gt; and &lt;/comment&gt; Tags


    You can document the XML statements within your Windows Script Files using the
    XML &lt;comment&gt; and &lt;/comment&gt; tags. Using these tags, you can spread
    comments over multiple lines. The syntax for the &lt;comment&gt; and &lt;/comment&gt;
    tags is as follows:


    ```

    <lt;comment&gt;Comment Text&lt;/comment&gt;

    ```


    The following example demonstrates the use of the XML &lt;comment&gt; and &lt;/comment&gt;
    tags.


    ```

    <?xml version="1.0" standalone="yes" ?>

    <job>

    <job error="true" debug="true">

    <lt;comment&gt;The following VBScript displays an information message&lt;/comment&gt;

    <script language="VBScript">

    ```'
