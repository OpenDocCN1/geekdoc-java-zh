  md: '# Appendix C • The WSH Core Model


    The next statement is very long. To improve the script''s readability, I decided
    to break it into three lines and end each of the first two lines with the & _
    characters. The _ character is a concatenation character and is used to indicate
    that a statement is continued on the next line. This statement displays the values
    of the following WshShell properties:


    +   - WshNetwork.UserDomain The name of the domain that the person running the
    script is logged in to

    - WshNetwork.ComputerName The name of the computer on which the script is being
    executed

    - WshNetwork.UserName The username of the person who ran the script


    To improve the presentation of the message, I formatted it using the VScript vbTab
    and vbCrLf constants. The vbTab constant is used to line up output at the point
    of the equals sign. The vbLf constant is used to execute a line feed and carry
    return at the end of each line of output. The last script does display the message
    using the following statement:


    MsgBox PropertyInfo , vb0Konly "WshNetwork Properties Example"

    Box() is a built-in VBS function that displays a text message in a pop-up dialog
    box. PropertyInfo is a variable that I used to store the output message. vb0Konly
    is a VBScript constant that tells the MessageBox() function to only display the
    OK button in the pop-up dialog box. The last part of the previous statement is
    a message that will be displayed in the pop-up dialog box title bar. If you save
    and execute this script on a computer running Windows 7, you should see a pop-up
    dialog box similar to the one shown in Figure C.2.


