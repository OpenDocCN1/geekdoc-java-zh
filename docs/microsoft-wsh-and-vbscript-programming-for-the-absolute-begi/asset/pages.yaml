  md: '# Storing Data in Dictionaries


    In addition to variables and arrays, VBScript also lets you store and manage data
    using Dictionary objects. With dictionaries, data is stored in an associative
    array and retrieved using key/value pairs as opposed to using the data index position,
    as is the case with arrays). Data is stored in a dictionary using Keys. Keys can
    be numbers, strings, or any other type of data supported by VBScript. Dictionaries
    provide the same benefits as arrays while providing greater flexibility in the
    way data is stored and retrieved. In addition, Dictionary objects provide you
    with access to a number of different properties and methods that provide access
    and manage data.


    The Dictionary object supports three properties, as listed here.


    +   * Count. This returns the total number of items in a Dictionary.

    * Item. This retrieves or adds an item using a specified key in a Dictionary object.

    * Key. This adds a key to a Dictionary object.


    The Dictionary object also provides access to a number of methods:


    +   * Add. This adds a key/item pair to a Dictionary object.

    * Exists. This returns a Boolean value of true if a specified key exists in the
    Dictionary object or false if the value does not exist.

    * Items. This returns an array of all items from a Dictionary object.

    * Keys. This returns an array of keys from a Dictionary object.

    * Remove. This deletes a key/item pair from a Dictionary object.

    * Remove All. This removes all key/item pairs from a Dictionary object.


    # Keys and Values


    To work the Dictionary object into a VBScript, you must first define a variable
    through which it can be referenced. Once this is done, you can create an instance
    of the object as demonstrated here:


    ```

    Dim dictObject

    Set dictObject = CreateObject("Scripting.Dictionary")

    ```


    # Adding Dictionary Items


    After you have instantiated a Dictionary object, you can begin storing items in
    it as key/value pairs, as demonstrated here:


    ```

    dictObject.Add "Model1555", "Red Bike"

    dictObject.Add "Model1888", "Blue Bike"

    dictObject.Item("Model1999") = "Green Bike"

    ```'
