    # Disconnecting Mapped Drives


    You can use the WshNetwork object''s RemoveNetworkDrive() method to disconnect
    a mapped drive when it''s no longer needed. For example, you might want to do
    this at the end of the script that created the drive mapping, after it has completed
    its assigned task. The syntax of the RemoveNetworkDrive() method is as follows:


    ```

    WshNetwork.RemoveNetworkDrive letter, [kill], [persistent]

    ```


    letter is the drive that has been assigned to the mapped drive. kill is an optional
    setting with a value of either True or False. Setting it to True disconnects a
    mapped drive even if it is currently in use. persistent is also optional. Set
    it to True to disconnect a permanently mapped drive.


    The following VBScript demonstrates how to disconnect the network drive that was
    mapped by the pre-script:


