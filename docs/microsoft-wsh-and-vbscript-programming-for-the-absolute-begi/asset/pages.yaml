  md: "# Microsoft WSH and VBScript Programming for the Absolute Beginner, Fourth\
    \ Edition\n\nUnlike WSH administrative scripts, which usually start and run to\
    \ completion immediately upon execution, HTAs start by displaying a GUI and then\
    \ wait to respond to events. Events occur for all sorts of reasons. When an HTA\
    \ starts, the window's onLoad event occurs. In addition, interface controls generate\
    \ an onClick event when selected or clicked. You can use these events to trigger\
    \ the execution of VBScript (functions and subroutines) by specifying the name\
    \ of a script to be executed when an event occurs.\n\nAn example of an event that\
    \ occurs with HTA is the onload event, which occurs when an HTA window is started.\
    \ You can automatically execute program statements when an application starts\
    \ by adding a Window_onload subroutine inside the <script> </script> tags with\
    \ any code statements you wish to execute. The following example demonstrates\
    \ how to work with this event:\n\n```\n<script language=\"VBScript\">\nSub Window_OnLoad\n\
    \  self.resizeTo 600, 300\nEnd Sub\n```\n\n```\nSub ShowResult\n  Msgbox \"Hello\
    \ \" & textbox.value\n  textbox.value = \"\"\nEnd Sub\n</script>\n```\n\nHere,\
    \ two scripts have been embedded within the <script> </script> tags of an HTA.\
    \ Each script has been saved as a subroutine. The first subroutine is named Window_onload\
    \ and the second subroutine is named ShowResult. As stated, the first script automatically\
    \ executes when the HTA's window is loaded. Using this, you can execute any programming\
    \ logic that needs to occur before the user has the opportunity to interact with\
    \ the HTA. This script consists of a single statement, which executes the object's\
    \ resizeTo() method. This resizes the width and length of the window, which in\
    \ the example is 600 pixels by 300 pixels.\n\nThe ShowResult subroutine can be\
    \ called by another script or triggered by a control. In the example, ShowResult\
    \ uses the VBScript MsgBox() function to display a text message.\n\n# The <body></body>>Tags\n\
    \nAn HTA's GUI is laid out using HTML tags defined in the application's <body></body>\
    \ section. The following HTML tags build out simple GUI made up of a label, a\
    \ text control, and a button control. All these tags are embedded within the <body></body>\
    \ tags."
  merge: -1
