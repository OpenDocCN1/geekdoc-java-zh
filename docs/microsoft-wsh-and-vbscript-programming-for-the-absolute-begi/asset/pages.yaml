    \ This script demonstrates how to resize an array during\nexecution\n\n************************************************************************************\n\
    \nPerform script initialization activities\nOption Explicit\n\nDefine variables\
    \ used in the script\nDim intCounter    'Variable used to control a For...Each\
    \ loop\nDim strMessage    'Message to be displayed in a pop-up dialog box\n\n\
    strMessage = \"The array contains the default game \" & & \\\n  \"information:\
    \ \" & vbCrLf & vbCrLf\n\nReDim strGameArray(4) = \"An array that can hold five\
    \ index elements\nstrGameArray(0) = \"Joe Blow\" 'The default username\nstrGameArray(1)\
    \ = \"Nevada\" 'A place worth visiting\nstrGameArray(2) = \"soda can\" 'An interesting\
    \ object\nstrGameArray(3) = \"Barney\" 'A close friend\nstrGameArray(4) = \"Pickle\"\
