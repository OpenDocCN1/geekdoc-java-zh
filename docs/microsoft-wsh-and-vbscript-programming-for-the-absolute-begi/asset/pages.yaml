    # Back to the BlackJack Lite Game


    Now let''s return to the development of the BlackJack Lite game. In this game,
    you''ll develop your own version of the casino blackjack. BlackJack Lite is a
    card game that pits the player against the computer. The object of the game is
    to come as close to 21 as possible without going over and to beat the computer''s
    hand. The computer, like a real casino blackjack dealer, waits for the player
    to finish playing. The computer must then take its hand until it busts (goes over
    21) or reaches at least 17, which time it must stop.


    # Designing the Game


    The BlackJack Lite game is more complex than the other VBScripts that you''ve
    seen so far in this book. The game itself has a large number of functions to perform.
    For example, the initial hand must be dealt for both the player and the computer.
    Then the game has to facilitate the dealing of cards to the player and later to
    the computer. In addition, numerous smaller processes must occur along the way.


    Because this script is rather complex, I decided to organize it into procedures.
    Each procedure will be assigned a specific activity to perform. As part of my
    preparation for the design of the game, I have drawn a high-level flowchart of
    the game''s overall structure and processing logic. This flowchart is shown in
    Figure-7.6.


    ![](img/337e6368245d3aad07236ff6d4dacf23_196_0.png)


    Figure 7.6 A flowchart outlining the overall design and execution flow of the
    BlackJack Lite game. © 2014 Cengage Learning.'
