  md: '# Trap


    Because it sends keystrokes to the currently active Windows application, it is
    very important that, when the script is running, the player does not open any
    new windows (applications). If he does, the script will begin sending keystrokes
    to whatever applications the player opened, causing any of a number of unpredictable
    problems.


    The syntax of the SendKeys() method is as follows:


    ```

    SendKeys(string)

    ```


    string is a value representing the keystrokes that are to be sent to the target
    application. You can send more keystrokes by simply typing them, out like this:


    ```

    SendKeys "I am"

    SendKeys "38"

    SendKeys " years old."

