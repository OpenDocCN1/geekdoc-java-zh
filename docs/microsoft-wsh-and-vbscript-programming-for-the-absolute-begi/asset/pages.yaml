    End Sub

    ```


    # Disconnecting from a Network Printer


    With network drives, removing a printer connection is a little easier to do connecting
    it initially. Printer connections need to be removed for a number of reasons.
    For example, every printer eventually breaks and must be replaced. Some people
    move from one location to another, necessitating changes to printer connections.
    By scripting the setup and removal of connections, you can automate this process.
    To remove a network printer connection, you need to use the WshNetwork object''s
    RemovePrinterConnection() method:


    ```

    WshNetwork.RemovePrinterConnection resource, [kill], [persistent]

    ```


    resource identifies the printer connection and may be either the connection''s
    assigned port number or its UNC name and path. kill is an optional setting with
    a value of True or False. Setting it to True disconnects a printer connection
    even if it is currently in use. persistent is also optional. Set it to True to
    disconnect a permanent printer connection.'
