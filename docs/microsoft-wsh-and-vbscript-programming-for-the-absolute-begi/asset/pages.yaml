  md: '# Built-in VBScript Functions


    VBScript provides an enormous collection of built-in functions, as outlined in
    Table D.1. You can use these functions in your VBScripts to shorten your development
    time and save yourself from having to reinvent the wheel.'
  merge: -1
  pgno: 441
- img_proc: true
  md: '# Table D.1 BUILT-IN VBScript Functions


    | Function Name | Description |

    | --- | --- |

    | Abs | Returns a number''s absolute value |

    | Array | Returns an array based on the supplied argument list |

    | Asc | Returns the ANSI code of the first letter in the supplied argument |

    | Atn | Inverse trigonometric function that returns the arctangent of the argument
    |

    | CBool | Converts an expression to a Boolean value and returns the result |

    | CByte | Converts an expression to a variant subtype of Byte and returns the
    result |

    | CCur | Converts an expression to a variant subtype of Currency and returns the
    result |

    | CDate | Converts an expression to a variant subtype of Date and returns the
    result |

    | CDbl | Converts an expression to a variant subtype of Double and returns the
    result |

    | Chr | Returns a character based on the supplied ANSI code |

    | Cint | Converts an expression to a variant subtype of Integer and returns the
    result |

    | CLng | Converts an expression to a variant subtype of Long and returns the result
    |

    | Cos | Trigonometric function that returns the cosine of the argument |

    | CreateObject | Creates an automation object and returns a reference to it |

    | CSng | Converts an expression to a variant subtype of Single and returns the
    result |

    | Date | Returns the current date |

    | DateAdd | Adds an additional time interval to the current date and returns the
    result |

    | DateDiff | Compares two dates and returns the number of intervals between them
    |

    | DatePart | Returns a portion of the specified date |

    | DateSerial | Returns a variant (Date) based on the supplied year, month, and
    day |

    |st | Converts a string into a variant of type Date and returns the result |

    | Day | Converts an expression representing a date into a number between 1 and
    31 and returns the result |

    | Eval | Returns the results of an evaluated expression |

    | Exp | Returns the value of an argument raised to a power |

    | Filter | Returns an array based on a filtered set of elements using supplied
    filter criteria |

    | FormatCurrency | Returns an expression that has been formatted as a currency
    value |

    | FormatDateTime | Returns an expression that has been formatted as a date or
    time value |

    | FormatNumber | Returns an expression that has been formatted as a numeric value
    |

    | FormatPercent | Returns an expression that has been formatted as a percentage
    (including the accompanying %) |'
