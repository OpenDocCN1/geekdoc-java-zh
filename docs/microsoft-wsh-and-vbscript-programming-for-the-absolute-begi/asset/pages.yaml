    # Erasing Arrays


    When your script is finished working with the data stored in an array, you can
    erase or delete it, thus freeing up a small portion of the computer''s memory
    for other work. This is accomplished using the Erase statement, which has the
    following syntax:


    ```

    Erase ArrayName

    ```


    For example, the following statement could be used to erase an array named astrGameArray:


    ```

    Erase astrGameArray

    ```'
