  md: '# 5


    # Conditional Logic


    Every programming language allows you to perform tests between two or more conditions.
    This capability is one of the cornerstones of programming logic. It lets you develop
    scripts that can test input from the user or the user''s computer and compare
    it to one or more conditions. Using the results of the tests, you can alter the
    execution of your scripts and create dynamic scripts that can adjust their execution
    according to the data with which they''re presented.


    By the time you have completed this chapter, you''ll have learned the following:


    +   - How to write scripts that test two conditions

    - How to write scripts that test two or more conditions against a single value

    - How to write scripts that can test for a variety of different types of conditions

    - How to write scripts that work with a variety of built-in VBScript functions


    # Project Preview: The Planet Trivia Quiz Game


    In this chapter, you''ll create a game that administers and scores a quiz based
    on the player''s knowledge of the planets in the solar system. The game asks the
    player a series of questions and then assigns a rank based on the player''s final
    score. Figures 5.1 through 5.3 show some of the interaction between the player
    and the game when played on a computer running Windows 8.1.'
  merge: -1
