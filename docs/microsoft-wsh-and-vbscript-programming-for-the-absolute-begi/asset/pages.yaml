    3. Multiply 17.8 by 10 to get a final result of 178.


    # Using the WSH to Work with Environment Variables


    Thus far, the scripts that you have worked with in this chapter have variables
    that are defined by the scripts themselves. A second type of variable, known as
    an environment variable, is also available to your VBScripts. Windows operating
    systems automatically create and maintain environment variables.


    The two types of environment variables are as follows:


    +   * User. Environment variables are created during user login and provide information
    specific to the currently logged on user.

    * System. Environment variables are created based on what Windows learns about
    the computer. They are available at all times, as opposed to user variables, which
    are available only when you''re logged in to the computer.


    > Hint

    You may end writing scripts that are designed to run when no one is logged on
    to the computer. This can be done using the Windows Scheduler Service to automate
    the execution scripts. In this case, user environment variables will not be available
    to your scripts. It will be up to you to make sure that your scripts do not depend
    on them.


    User and environment variables can be viewed from the Environment Variables dialog
    box. On Windows 7, you can access this dialog box using the following procedure:


    +   1. Click the Start button.

    2. Right-click Computer and select Properties. A window showing basic system information
    is displayed.

    3. Click the Advanced system settings link. The System Properties window appears.

    4. Click the Advanced tab and then click the Environment Variables button. A listing
    of environment variables is displayed.'
