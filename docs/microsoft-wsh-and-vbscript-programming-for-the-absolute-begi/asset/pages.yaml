  md: '# Microsoft WSH and VBScript Programming for the Absolute Beginner, Fourth
    Edition


    The following statements show the contents of a typical WSH file:


    ```

    [ScriptFile]

    Path=C:\Test.vbs

    [Options]

    Timeout=30

    DisplayLogo=0

    ```


    The first line contains the section label called [ScriptFile]. The next statement
    provides the name and path of the script associated with this WSH file. The next
    contains an [Options] section label. The last two lines contain configuration
    settings specific to the execution of this script. Timeout=30 specifies that this
    script will not be allowed to process for more than 30 seconds, and DisplayLogo=0
    specifies that the WScript object is to suppressed. An alternative setting for
    this option would be DisplayLogo=1, which would enable the display of the WScript
    logo.


    There are two ways to create a WSH file. One is to use a text editor, such as
    Windows Notepad, to manually create the file. The other is to let Windows create
    the WSH file for you using the following procedure:


    +   1. Locate the folder in which the VBScript is stored.


    +   2. Right-click to select Properties from the menu that appears. The script''s
    Properties dialog box, as shown in Figure 2.7.


