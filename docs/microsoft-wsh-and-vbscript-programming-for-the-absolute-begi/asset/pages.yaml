    WScript.Quit()


    # Modify the Registry


    The final step in creating this script is to define a function that creates the
    new Registry key and value. As you saw earlier in this chapter, this operation
    is accomplished using the WshShell object''s RegWrite() method.


    # Trap


    When deciding what Registry key and value to create in situations like this, it''s
    critical that you take steps to ensure you don''t accidentally overwrite an already
    existing key or value of the same name. Otherwise, you might accidentally disable
    another application or a Windows component. In the case of this script, it is
    virtually certain that the key and value I defined will not be in use. However,
    if there is any doubt, you can add logic to your VScripts first check to determine
    whether the key and value exist before proceeding.


    ''Procedure Section


    ```

    Function SetHangmanKeyAndValue()

    objWshShell.RegWrite "HKCU\VGames\Hangman\ListLocation", "c:\Hangman"

    End Function

    ```


    # Assembling the Entire Setup Script


    Now let''s put the three sections of this script together; run the script and
    click on Yes when prompted for confirmation. If you want, to can use the Regedit
    utility to go behind your script and make sure that it created the new Registry
    key and value as expected.


    You only need to run this script one time to set up a computer to play the Hangman
    game. However, you need to rerun this script if you decide to change the location
    of the folder in which you plan to store your Hangman word files.'
