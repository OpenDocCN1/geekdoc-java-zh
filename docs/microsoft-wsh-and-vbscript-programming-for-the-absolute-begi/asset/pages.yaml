    # Building the TestLetterGuess() Function


    The TestLetterGuess() function, shown here, checks to whether the letter is part
    of the word and keeps track of missed guesses. If the total number of missed guesses
    equals 6, then this function assigns a value of False to the bnWordGuessed variable.
    This variable is later checked to see whether the player has lost the game.


    ```

    Function TestLetterGuess()

    Instr(1, UCase(strGameWord), UCase(strChoice), 1) = 0 Then

    ''Add the letter to the list of incorrectly guessed letters

    strWrongGuesses = strWrongGuesses & " " & UCase(strChoice)

    ''Increment the number of the player has made by 1

    intNoMisses = intNoMisses + 1

    ''If the player has missed six guesses then he has used up all guesses

    If intNoMisses = 6 Then

    blnWordGuessed = "False"

    End If

    TestLetterGuess = "IncorrectGuess"

    Else

    TestLetterGuess = "CorrectGuess"

    End If

    End Function

    ```


