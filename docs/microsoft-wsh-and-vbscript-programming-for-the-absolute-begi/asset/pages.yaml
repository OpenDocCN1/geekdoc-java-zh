  md: '# Chapter 10 • Using the Windows Registry to Configure Script Settings


    You can, however, still interact with the remaining keys by specifying their full
    names (HKEY_CURRENT_CONFIG and HKEY_USERS).


    # Understanding How Data Is Stored in the Registry


    Data stored in the Windows Registry is organized into a hierarchy. This hierarchy
    consists of keys and values. A key is a container that holds values or actual
    data. All data stored in the Windows Registry has the following format:


    Key : key_type : value


    Key specifies the name of the Registry. For example, to reference the Control
    Panel subkey, you would specify HKCU\Control Panel\. To reference the Desktop
    subkey, which is located under the Control Panel subkey, you would specify HKCU\Control
    Panel\Desktop\. This character identifies what is being referenced is a key and
    not a value.


    value specifies the container used to store actual data. To reference a value,
    instead of the key you must, use the name of the value without the closing character.
    For example, to reference the ScreenSaveActive value stored in the Desktop subkey,
    you would specify HKCU\Control Panel\Desktop\ScreenSaveActive.


    key_type identifies the type of data that has been stored. The Registry is capable
    of storing many types of data, as shown in Table 10.2.


    | Definition | A Registry key is a container that stores other Registry keys and
    values. You can think of a key as being akin to a folder in the Windows file system.
    |

    |---||

    | Definition | Within the context of the Windows Registry, a value represents
    the name of an element to which data is assigned. Therefore, a Registry acts in
    many ways like a file, which is a container for storing data in a Windows file
    system. |


    # TABLE 10.2 DATA TYPES SUPPORTED BY THE WINDOWS REGISTRY


    | Data Type | Description |

    |---|---|n| REG_BINARY | Stores a binary value |

    | REG_DWORD | Stores a hexadecimal DWORD value |

    | REG_EXPAND_SZ | Stores an expandable string |

    | REG_MULTI_SZ | Stores multiple strings |

    | REG_SZ | Stores a string |


    © Lee Ford, Jr. All Rights Reserved.'
