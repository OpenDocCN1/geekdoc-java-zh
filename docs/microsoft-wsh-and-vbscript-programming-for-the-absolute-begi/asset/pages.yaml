  md: '# Who Should Read This Book?


    This book is designed to teach you how to begin developing VBScripts using the
    WSH. It does not assume that you have a programming background. However, a basic
    understanding of computers and Microsoft Windows is assumed.


    If you are a first timer looking for a friendly language with which to begin a
    programming career, or a more experienced programmer who is looking for a book
    that provides you with a quick WSH and VBScript learning curve, give this book
    a try.


    This book''s games-based teaching approach makes it very different from other
    books. This approach is not only more fun, but is also an extremely helpful technique
    for learning a new programming language.


    # What You Need to Begin


    To follow along and complete all the exercises that you''ll find in this book,
    you''ll need a number of things:


    +   - A computer running

    - The current version of the WSH, which is version 5.8. If you are running Windows
    7, Windows 8, or Windows 8.1, then you already have the version of WSH that you
    need. If you are using XP with Service Pack 3 or Windows Vista, you can download
    and install WSH 5.7 from www.microsoft.com/downloads/

    - A text editor that supports the creation of plain-text files to create and work
    with your Vscripts. For this book, you can use the Notepad application. Alternatively,
    you may prefer to download and install a VBScript-compatible script editor. Specialized
    VBScript editors provide numerous advanced features not by Notepad, including
    statement color-coding, a built-in debugger, line and column numbering, script
    execution from the editor, statement indentation, and more. A good example of
    a VBScript editor is Adobe Edit. It is distributed as shareware with a limited
    period of free trial and can be downloaded from vbsedit.com.


    # How This Book Is Organized


    The fourth edition of Microsoft WSH and VBScript Programming for the Absolute
    Beginner has been improved in a number of ways. For starters, it has been updated
    to cover WSH 5.8 and VBScript 5.8, both of which were updated with the release
    of Windows 7. All scripts have been tested and verified on both Windows 7 and
    Windows 8.1. In addition, a new chapter has been added that provides an introduction
    to HTML Applications (HTAs), which provide a mechanism for creating scripts that
    feature a graphical user interface (GUI). Lastly, I have streamlined coverage
    of many topics treated throughout the book to provide an even better learning
    experience.


    This book is organized into four parts with the intention that you read it sequentially
    from beginning to end. If you are a new or inexperienced programmer, you will
    want to read this book in this manner. However,'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'if you already know another programming language and feel that you have a strong
    enough background in basic programming concepts, you might want to skip around
    and tackle each chapter in the order that best suits your particular requirements.


    Part I, “Introducing the WSH and VScript,” consists of two chapters and provides
    an introduction to both WSH and VScript. Part II, “Learning VBScript and WSH Scripting,”
    contains five chapters, in addition, you’ll find coverage of the WSH statements
    that make the VBScript scripting language. The seven chapters in Part III, “Advanced
    Topics,” are dedicated to a collection of advanced topics that include file and
    folder administration, error handling, with the Windows Registry, working with
    built-in VBScript objects, using XML to create WSH files, working with Windows
    Management Instrumentation, and using graphical user interfaces to your scripts.
    Part IV, “Appendices,” is a collection of five appendices that provide you with
    additional avenues of exploration, including examples of real-world scripts, an
    introduction to Remote WSH, documentation of built-in VBScript functions, and
    a look at this book’s companion website.


    The basic outline of the book is as follows:


    +   - Chapter 1, “Getting Started with WSH and VBScript.” This chapter provides
    a high-level introduction to both the WSH and VBScript. This includes how to install
    the WSH and how to create and execute your first VBScript.

    - Chapter 2, “An Introduction to the Windows Script Host.” This chapter provides
    an introduction to the WSH core object model and the objects that comprise it.
    Particular attention is paid to the VScript root object. You’ll also learn how
    to configure the WSH and how to specify a default script execution.

    - Chapter 3, “VBScript Basics.” This chapter begins your VBScript education. You’ll
    learn about VBScript’s core and run-time objects and their properties and methods.
    You’ll learn about other VBScript elements including VBScript’s built-in functions,
    syntax rules, and output methods. You’ll also learn about WSH output functions.

    - Chapter 4, “Constants, Arrays, and Dictionaries.” This chapter shows how to
    create and reference data in the computer’s memory using constants, variables,
    and arrays. You’ll learn about VBScript’s built-in constants. This chapter also
    presents the rules for variable creation and the enforcement of variable use as
    well as the techniques required to store and retrieve collections of data in arrays.

    - Chapter 5, “Conditional Logic.” This chapter expands your scripting background
    to include an understanding of how to add execution paths for script execution.
    You’ll examine the VBScript If and Select Case statements. In addition, you’ll
    learn about VBScript operators and operator precedence.

    - Chapter 6, “Processing Collections of Data.” This chapter teaches you how to
    process collections of data and resources using VBScript looping statements (For_Next,
    Do While, Do_Until, While_End, and For Each_Next). You’ll learn how to write small
    scripts that can add shortcuts to your scripts on the Windows desktop and Start
    menu.'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'Chapter 7, "Using Procedures to Organize Scripts." In this chapter, you will
    learn how to improve the organization of your scripts using procedures. You''ll
    be introduced to the concept of creating reusable procedures. This will help you
    create scripts that are more complicated and easier to modify.


    Chapter 8, "Storing and Retrieving Data." This chapter teaches you how to create
    VBScripts that can write and read from text files. In addition to learning how
    to create reports and log files, this chapter shows you how to store and retrieve
    script configuration in INI files, allowing you to externalize key script settings.


    Chapter 9, "Handling Errors." This chapter focuses on how to deal with the errors
    that occur during script development and execution. This chapter introduces errors
    during script development and shows you how to troubleshoot them. In addition,
    you''ll learn how to bypass errors and develop code that handles specific error
    conditions.


    Chapter 10, "Using the Windows Registry to Configure Script Settings." This chapter
    provides an overview of the Windows Registry and shows you how to develop scripts
    that store and retrieve data from Registry keys and values. Because most Windows
    functionality is controlled from the Registry, your knowledge will provide the
    basic blocks required to manipulate any number of Windows settings.


    Chapter 11, "Using with Built-in VObject Objects." This chapter expands your understanding
    of object-based programming by reviewing VBScript''s built-in collection of objects.
    Specifically, you''ll learn new techniques for parsing and extracting data from
    strings.


    Chapter 12, "Combining Different Script Languages." In this chapter, you learn
    how to take advantage of the WSH''s support for Windows Script Files. Windows
    Script Files enable you to combine two or more WSH-supported scripting languages,
    such as VBScript and JScript, into a single script using XML. You''ll learn a
    little about XML and the XML tags supported by the WSH.


    Chapter 13, "Using with the Management Instrumentation." This chapter was added
    to the third edition of this book. It provides an overview of the WMI and the
    WMI model. You will learn all about WMI objects, namespaces, providers, and classes.
    You will also learn how to develop scripts using WMI to collect and process system
    information.


    Chapter 14, "Adding a GUI to Your Scripts." This chapter, is entirely new to this
    edition of the book, introduces HTML Applications (HTAs), which can be used to
    provide scripts with graphical user interfaces (GUIs). This chapter explains how
    HTAs work and teaches you how to add GUIs to your scripts, with radio buttons,
    checkboxes, text fields, drop-down lists, and other attributes associated with
    Windows applications.


    Appendix A, "WSH Administrative Scripting." In this appendix, we show some practical
    examples that demonstrate the use of VBScript and the WSH in real-world situations.
    This appendix will assist you in making a transition from the book''s game-based
    approach to real-world script development.


    Appendix B, "Introducing Remote WSH." This appendix was added to the third edition
    of this book. In it, you will learn how to execute, monitor, and terminate the
    execution of scripts using Remote WSH. You will learn about the objects that make
    up Remote WSH and how to work with their properties and methods.'
