  md: '# Microsoft WSH and VBScript Programming for the Absolute Beginner, Fourth
    Edition


    MsgBox() function is a built-in VBScript function that you call within your scripts
    displaying messages in pop-up dialog boxes. As you can see, the text “Hello World!”
    was displayed when you ran the script. This VBScript was run using WSH execution
    engine (for example VScript) and one of the WSH''s two execution hosts (either
    WScript.exe or CScript.exe). However, the code itself was all VBScript.


    Let''s modify the script just a bit to demonstrate how to operate the WScript
    object. The WScript object is one of a small number of objects that make up the
    WSH core object model. (I''ll go over this object in detail in Chapter 2 and Appendix
    C.) Using your editor, open the Hello.vbs script and modify it so it looks exactly
    like the following:


    ```

    Set WshShell1 = WScript.CreateObject("WScript.Shell")

    ```


    ```

    WshShell1.Popup("Hello World!")

    ```


    Now save the script and run it again. This time, unless you entered a typo, you
    should see a pop-up dialog box similar to the one shown in Figure 1.12.


    ![](img/337e6368245d3aad07236ff6d4dacf23_38_0.png)


    > Figure 1.12 The pop-up dialog box created by your modified VBScript.

    © 2014 Cengage Learning.


    As you can see, things look pretty much same. The same message is displayed and
    the words “Windows Script H...” are now displayed in the pop-up dialog box''s
    title bar. Let''s break it down and examine exactly how the script is written.
    Don''t worry if you don''t fully understand everything that is covered here—it''s
    fairly complex and you''ll be better prepared to understand it. For now, I''d
    like you to just read along with the steps I''ll present so that you''ll understand
    the process involved in creating and executing scripts using VBScript and the
    WSH.


    First, the script uses the Set command to define a variable named WshShell1. This
    variable is then assigned a value using the following expression:


    ```

    WScript.CreateObject("WScript.Shell")

    ```


    This statement executes the WScript object''s CreateObject() method. This method
    is used to instantiate (that is, create a new instance of) the WshShell object,
    which is another WSH core object. The second line of code in the example uses
    the WshShell Popup() method to display a pop-up dialog box.'
