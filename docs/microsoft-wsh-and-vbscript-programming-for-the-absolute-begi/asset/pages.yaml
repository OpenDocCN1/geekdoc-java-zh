  md: '# # Handling Script Errors


    Every programmer, no matter how good he may be, runs into errors when writing
    and testing scripts and programs. Like any other programming language, VBScript
    is subject to many types of errors. Errors may be inevitable, but you can minimize
    their number and lessen their effects. In this chapter, I''ll demonstrate a number
    of script-ing errors and show you how to deal with them. Specifically, you will
    learn the following:


    +   - How to fix errors by reading and analyzing error messages

    - How to write VBScripts that can ignore errors and keep going

    - How to create error-handling routines to recover from many error situations

    - How to generate test errors to validate the performance of your error-handling
    routines

    - How to keep a record of errors using log files and the Windows application event
    log


    # ## Project Preview: The Hangman Game


    This chapter''s programming project is the creation of a VBScript version of the
    classic children''s game Hangman. Developing this game will require you to use
    all the VBScript knowledge that you''ve accumulated so far, including applying
    advanced conditional logic, organizing critical processes into procedures, and
    validating player input to prevent errors from prematurely terminating the game.'
  merge: -1
  pgno: 239
- img_proc: true
