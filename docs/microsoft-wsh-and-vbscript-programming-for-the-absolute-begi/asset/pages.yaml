  md: "# Microsoft WSH and VBScript Programming for the Absolute Beginner, Fourth\
    \ Edition\n\n# Creating the DealAnotherCard() Function\n\nThe DealAnotherCard()\
    \ function is called from the PlayGame() function when the player elects to take\
    \ a hit (asks for another card). This function consists of two statements. The\
    \ first statement assigns the card number returned to it from the GetRandomNumber()\
    \ function to a variable named intNextCard. The second statement tallies the player's\
    \ hand by adding the value of the new card to the cards already in the player's\
    \ hand.\n\n```\nfunction DealAnotherCard()\n  intNextCard = GetRandomNumber()\n\
    \  intUserCard = intUserCard + intNextCard\nEnd Function\n```\n\n# Creating the\
    \ ComputerPlay() Function\n\nThe ComputerPlay() function, shown here, is responsible\
    \ for dealing the computer's hand. It uses a Do...While loop to continue dealing\
    \ the computer's hand until the computer's hand exceeds a total of 17 but remains\
    \ under 21 or busts.\n\n```\nfunction ComputerPlay()\n  While intComputerCard\
    \ < 17\n    intNewComputerCard = GetRandomNumber()\n    intComputerCard = intComputerCard\
    \ + intNewComputerCard\n  Loop\nEnd Function\n```\n\nInside the Do...While loop\
    \ are two statements. The first statement deals the new card by calling the GetRandomNumber()\
    \ function. The second statement uses the value returned by the GetRandomNumber()\
    \ function to update the computer's hand (that is, its total).\n\n# Creating the\
    \ DetermineWinner() Function\n\nThe DetermineWinner() function, shown here, checks\
    \ to see whether the value of strUserBusted is True. It also checks to see whether\
    \ the computer has busted by checking to see the value of intComputerCard is greater\
    \ than 21. If either of these conditions is true, the script assigns an appropriate\
    \ message to the strTextMsg variable. This variable is used as input in an InputBox()\
    \ pop-up box that shows the results of the game. If neither of these conditions\
    \ is true, the DetermineWinner() performs three tests to determine whether the\
    \ player won, or was a tie. The function sets the value of strTextMsg accordingly.\n\
    \n```\nfunction DetermineWinner()\n  If strUserBusted = \"True\" Then\n    strTextMsg\
    \ = \"The user has busted!\"\n  Else\n```"
