    # Back to the Tic Tac Toe Game


    The heart of the Tic Tac Toe game lies in the design of its game board, which
    is divided into three sections. Status and error messages are displayed at the
    top of the board to assist players when mistakes are made playing the game.


    In the middle of the game''s screen is an image of a traditional Tic Tac Toe board.
    To the right and top of the Tic Tac Toe board are numbers and letters, the coordinates
    of each cell that make up the game board. Players play the game by using these
    letters and numbers to specify what cell they want to select as their next move.
    Embedded within the board are variables representing each cell on the board. The
    values assigned to these variables are set to either X or 0 based on the moves
    made by each player as the game progresses.


    The bottom of the game board is made up of input text field that enables players
    to enter their moves. In addition, instruction is provided just above this text
    in the form of a text message, which is used to keep track of player turns.'
