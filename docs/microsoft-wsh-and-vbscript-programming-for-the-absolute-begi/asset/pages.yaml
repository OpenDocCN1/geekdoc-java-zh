    # ## Examining Object Properties


    By accessing object properties, your scripts gather all kinds of information when
    they execute. For example, using the properties associated with the WshNetwork
    object, your scripts can collect information about the Windows domain that the
    person who ran the script has logged in to, as well as the computer''s and the
    user''s name. This information could then be used, for example, to prevent the
    script from executing on certain domains or computers.


    More than three dozen properties are associated with various WSH objects. In many
    cases, properties are associated with more than one object. Refer to Table C.2
    to see which properties are associated with which objects. Table C.3 provides
    a complete review of WSH object properties.'
