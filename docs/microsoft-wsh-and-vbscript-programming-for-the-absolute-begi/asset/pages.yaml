    Loop strAddressEntry <> "Quit"


    MsgBox strAddressBook,."New Address Book Entries = " & intCounter


    One of the dangers of working with loops is that you may accidentally create a
    loop that has no way of terminating its execution. This is an endless loop. Endless
    loops run forever, needlessly consuming resources and degrading a computer''s
    performance. For example, look at the following:


    ```

    intCounter = 0

    Do While intCounter < 10

    intCounter = intCounter + 1

    WScript.Echo intCounter

    Loop

    ```


    > An endless loop is a piece of code that either has no terminating condition,
    or has a terminating condition that can never be met, and as such it iterates
    indefinitely.


    When executed, this script counts from 1 to 10.

    Now look at the next script:


    ```

    intCounter = 0

    Do While intCounter < 10

    intCounter = intCounter - 1

    WScript.Echo intCounter

    Loop

    ```


    It looks almost exactly like the previous example, now instead of incrementing
    the value of intCounter by 1, it increments the value of intCounter by -1, creating
    an endless loop. One way to protect against the creation of an endless loop is
    to put in a safety net, like this:


    ```

    intCounter = 0

    Do While intCounter < 10

    intCounter = intCounter - 1

    intNoExecutions = intNoExecutions + 1

    WScript.Echo intNoExecutions

    If intNoExecutions > 99 Then

    Exit Do

    End If

    Loop

    ```


    As you can see, I added to the script a variable intNoExecutions that I used to
    keep track of the number of times loop iterated. If the loop iterates 100 times,
    something is wrong. So I added an If statement to test the value of intNoExecutions
    each time the loop is processed and to execute the Exit Do statement in the event
    that something goes wrong. Of course, there is no substitute for good program
    design and careful testing.'
