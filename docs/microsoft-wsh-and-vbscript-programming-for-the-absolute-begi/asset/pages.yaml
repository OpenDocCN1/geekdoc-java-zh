    In the development of this game, you will learn how to apply sophisticated conditional
    logic. In addition, you''ll learn how to work with a number of built-in VBScript
    functions.


    # Examining Program Data


    In any programming language, you need to be able to test whether a condition is
    true or false to develop complex logical processes. VBScript provides two different
    statements that perform this function. The statements are as follows:


    +   * **If.** This is a statement that allows or skips the execution of a portion
    of a program based on the results of a logical expression or condition.

    * **Case.** This is a formal programming construct that allows a programmer to
    visually program flow when dealing with the results of a simple expression.


    You already saw short demonstrations of the If statement in earlier chapters of
    this book. This is because even the simplest scripts require some form of conditional
    logic.'
