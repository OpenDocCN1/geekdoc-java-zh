    This project will be completed in five steps, as follows:


    +   1. Present the player with the Knock pop-up dialog box and collect the player''s
    response.

    2. Validate the player''s reply and continue the game if appropriate. Otherwise,
    display an error message.

    3. Present the player with the name of the person at the door and collect his
    or her reply.

    4. Validate the player''s reply and continue the game if appropriate. Otherwise,
    display an error message.

    5. Display the game''s punch line.


    # Starting the Script Development Process


    The first step in creating the Knock Knock game is to start your script editor
    and use it to create an empty VBScript file. For example, to create the script
    using the Notepad editor on a computer running Windows XP, you would execute the
    following steps:


    +   1. Click the Start button, choose All Programs, select Accessories, and choose
    Notepad. The Notepad application opens.

    2. Open the File menu and choose Save. The Save As dialog box appears.

    3. Specify the location where you want the script to be stored. Then type KnockKnock.vbs
    in the Name field at the bottom of the dialog box and click Save.


    The Notepad editor should now display the name of the Knock Knock script in its
    title bar.


    # Starting the Game and Collecting Initial User Input


    Now let''s begin the script by writing your first VBScript statement. The first
    thing the game is supposed to do is display a pop-up dialog box with "Knock Knock"
    message and wait for the user response. This task is performed surprisingly easily
    using VBScript, and can be done with a single statement:


    ```

    Reply1 = InputBox("Knock Knock!")

    ```


    In plain English, this VBScript statement displays a pop-up dialog box with a
    "Knock Knock" message and waits for the player to type something into the dialog
    box''s text field and click the OK button.


    | Definition | A statement generally consists of a single line of code that can
    be spread over two or more lines depending on the size of the statement. |


    Let''s break this statement down into pieces and see how it works. First, the
    statement executes a built-in VBScript function called InputBox(). This function
    displays a pop-up dialog box with a text entry that allows the script to collect
    text input from the player.'
