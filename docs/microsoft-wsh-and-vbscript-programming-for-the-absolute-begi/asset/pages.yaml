    \ called when the player clicks the Yes button on the script's initial pop-up\
    \ dialog box, indicating that he wants to play the game.\n\n```\nfunction NowGoPlay(){\n\
    \  DealFirstHand()\n  PlayTheGame()\n  If strUserBusted = \"False\" Then\n   \
    \ ComputerPlay()\n  End If\n  DetermineWinner()\n```\n\nThis function controls\
    \ the actual play of the game. It is made up of calls to several other functions.\
    \ First it calls the DealFirstHand() function, which deals both the user and the\
    \ computer their initial cards. Next it calls the PlayTheGame() function, which\
    \ allows the user to continue take hits or hold, and determines whether the player\
    \ busted. The NowGoPlay() function checks the value of the strUserBusted variable\
    \ to see whether the game should continue. If the user decides to hold, then the\
    \ ComputerPlay() function is called so the computer (or dealer's) hand can finish\
    \ being dealt. Regardless of whether the user busts or the ComputerPlay() function\
    \ is called, eventually returns to the NowGoPlay() function and the DetermineWinner()\
    \ function is called. This function determines the winner of the hand and gives\
    \ the player an opportunity to play another hand.\n\n# Creating the DealFirstHand()\
    \ Function\n\nThe DealFirstHand() function makes two calls to the GetRandomNumber()\
    \ function to deal the player's and the computer's initial cards:\n\n```\nfunction\
    \ DealFirstHand(){\n  intUserCard = GetRandomNumber()\n  intComputerCard = GetRandomNumber()\n\
    End Function\n```\n\n# Creating the PlayTheGame() Function\n\nThe PlayTheGame()\
    \ function, shown sets up a Do Until loop that executes until the player either\
    \ busts or decides to hold. The first statement in the loop prompts the player\
    \ to decide whether he wants another card. If the player clicks Yes, the DealAnotherCard()\
    \ function is called. The PlayTheGame() function then checks to see whether the\
    \ player has busted, setting the value of the strUserBusted and strUserDone variables\
    \ as appropriate (True). If the player decides to hold and clicks the No button,\
    \ the value of strUserDone is also set to True."
