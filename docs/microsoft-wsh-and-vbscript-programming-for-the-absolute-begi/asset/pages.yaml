  md: '# Chapter 5 • Conditional Logic


    The power and importance of these two statements cannot be overstated. For example,
    let''s say you took a job from someone without knowing exactly what you''ll be
    paid, and now you''re finished with the job and are waiting to be paid. As you''re
    waiting, you think about what to do with your new fortune. After a few moments,
    you decide that if you''re paid $250, you''ll buy a TV. If you''re paid less,
    you''ll buy a radio instead. This kind of test lends itself well to an If statement.
    Let''s rewrite this scenario into a more program-like format:


    ```

    If your pay is equal to $250

    Then Buy a TV

    Else

    Buy a Radio

    EndIf

    ```


    As you can see, the logic is very straightforward and translates well from English
    into pseudo code. I used bold text to identify portions of the example to point
    out the key VBScript programming components that are involved. I''ll go into greater
    detail about what each of these keywords means a little later in the chapter.


    Back to our scenario: Perhaps after thinking about it a few more minutes, you
    decide there are a number of things that you might do with your pay, depending
    on how much money you receive. In this case, you can use the VBScript Select Case
    statement to outline the logic of your decisions in pseudo code.


    ```

    Select Case Your Pay

    Case If you get $250 you''ll buy a TV

    Case If you get $200 you''ll buy a VCR

    Case If you get $100 you''ll buy a radio

    Case Else You''ll just bust lunch

    End Select

    ```


    | Definition | Pseudo code is a rough, English-like outline sketch of a script.
    By writing out the steps you think will be required to write a script in pseudo
    code, you provide yourself with an initial first-level script design that will
    serve as a basis for building the final product. |


    Again, I have used bold text to identify portions of the example to point out
    key VBScript programming components involved. In the next two sections of this
    chapter, I''ll break down the components of the If and Select Case statements
    into greater detail and show you exactly how they work.


    # The If Statement


    The If statement lets you test values or conditions and alter the execution of
    the script based on the results of the test. The syntax of this statement is as
    follows:


    ```

    If condition Then

    statements

    ElseIf condition-n Then

    statements

    ```'
