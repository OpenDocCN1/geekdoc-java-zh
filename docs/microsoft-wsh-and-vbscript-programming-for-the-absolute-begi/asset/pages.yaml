  md: "# Microsoft WSH and VBScript Programming for the Absolute Beginner, Fourth\
    \ Edition\n\n# Trick\n\nA quick and easy way to determine a computer's name is\
    \ to log on it and type `hostname` at the command prompt, as demonstrated here:\n\
    \n```\nC:\\Users\\Jerry>hostname\nDELL-PC\n```\n\nHere, the computer's name is\
    \ DELL-PC.\n\nOnce executed, the `GetObject` function returns a reference to an\
    \ object named `SwbemServices`, which is one of the objects that the WMI makes\
    \ available through its scripting library. The `SwbemServices` object has a method\
    \ `InstancesOf`, which you can use to retrieve data from a WMI class, as demonstrated\
    \ here:\n\n```\nset WMICCollection = WMIServices.InstancesOf(\"Win32_OperatingSystem\"\
    )\n```\n\nThe `InstancesOf` method retrieves a collection named `SwbemObjectSet`,\
    \ which is automatically populated with a list of all instances of the managed\
    \ resources for the specified class name. Each item in the `SwbemObjectSet` collection\
    \ represents an instance of the specified managed resource. The `SwbemObjectSet`\
    \ collection has been generated, you can process its contents and use different\
    \ `SwbemObject` properties and methods.\n\n# Retrieving Operating System Data\n\
    \nOkay, that's enough information about the WMI's architecture. It is time to\
    \ begin putting your newfound understanding of the WMI to work. Let's begin by\
    \ developing a script that demonstrates how to retrieve information about the\
    \ operating system on which the script executes. This script, named GetOSInfo.vbs,\
    \ is here:\n\n********************************************************************\n\
    \n```\n'Script Name: GetOSInfo.vbs\n'Author: Jerry Ford\n'Created: 03/06/14\n\
    'Description: This script demonstrates how to use WMI to retrieve\n  operating\
    \ system information\n```\n\n********************************************************************\n\
    \n# 'Initialization Section\n\nOption Explicit\n\n# 'Main Processing Section\n\
    \n```\nDisplayData(\"DELL-PC\") 'Set the computer on which the script will execute\n\
    WScript.Quit() 'Terminate script execution\n```"
