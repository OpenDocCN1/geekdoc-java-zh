    # A Quick Introduction to the WSH Core Object Model


    The WSH core object model provides access to 14 objects through which you can
    programmatically access different types of Windows resources. The objects that
    make the WSH core object model are depicted in Figure 2.4. Each of these objects
    provides you with access to a specific category of Windows resources.


    ![](img/337e6368245d3aad07236ff6d4dacf23_54_0.png)


    Figure 2.4 Each of these 14 objects has properties and methods that expose different
    Windows operating system resources.


    © 2014 Cengage Learning.


    The WScript object lies at the top, or *root*, of the WSH core object model. All
    other WSH core object models are created, or instantiated, from this object. The
    WScript object is automatically created for you when the execution starts and
    can be referenced without first being instantiated within your scripts. Once instantiated,
    you can work with the properties and methods belonging to any of the objects that
    comprise the WSH core object model. For example, the following statement demonstrates
    how to create a one-line script Greeting.vbs that uses the WScript object''s *Echo*
    method to display a text string.


    ```

    WScript.Echo "Example: Using the WScript object''s Echo()""

    ```


    To test this, open your script editor and type this statement. Save the script
    (with a .vbs file extension), and run it by double-clicking. The pop-up dialog
    box, shown in Figure 2.5, should appear. As this script demonstrates, you can
    automatically access any of the properties and methods belonging to the WScript
    object directly from your scripts.


    > Instantiation describes the process of creating a new instance of an object.


    ![](img/337e6368245d3aad07236ff6d4dacf23_54_1.png)


    Figure 2.5 A pop-up dialog box created using the WScript object''s Echo() method.


    © 2014 Cengage Learning.'
