    Table 8.2 outlines the two available options that determine what the OpenTextFile()
    method should do if the file does not already exist.


    | Table 8.2 OpenTextFile() File Creation Options |

    | Value | Description |

    | True | Open a file if it already exists; create and open a new file if it does
    not already exist |

    | False | Open a file if it already exists; otherwise, take no additional |


    © Jerry Lee Ford, All Rights Reserved.


    You must be careful to always specify the appropriate constant value when telling
    the OpenTextFile() method to open a file. For example, if you accidentally open
    a file in ForCreate mode when you actually mean to append to the end of the file,
    then you will overwrite the contents already stored in the file.


    Let''s look at a VBScript that puts what you have learned into action. In this
