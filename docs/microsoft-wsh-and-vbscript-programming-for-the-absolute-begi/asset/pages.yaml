  md: '# Microsoft WSH and VBScript Programming for the Absolute Beginner, Fourth
    Edition


    # Desktop Administration


    The administration of the Windows desktop on a single computer isn''t terribly
    time-consuming. However, for those responsible for the maintenance and care of
    a large number of computers, scripting is a godsend. For example, a lot of small
    companies purchase computers directly from the manufacturer. These computers arrive
    with the operating system already installed. However, desktop settings such as
    the color of the Windows desktop background or screensaver settings will vary
    depending on how the computer master chose to set them up.


    Companies often try to keep the configuration of their computer settings standardized.
    This means maintaining their computers easier and reduces a lot of user confusion.
    One way of figuring computers in this scenario is to develop VBScripts that automate
    the configuration of desktop settings according to company policy. Then, all you
    need to do to prepare a new computer for deployment is to copy the scripts and
    have the user run them first time he logs on to the computer.


    # Configuring the Desktop Background


    The following VBScript demonstrates how to use the WshShell object''s RegWrite()
    method to configure values that are stored in the Windows Registry and affect
    the Windows desktop background:


    ```

    ****************************************************************

    ''Script Name: Background.vbs

    ''Author: Jerry Ford

    ''Created: 02/25/14

    ''Description: This script changes the user''s background selection to none

    '' and sets the default background color to white.

    ****************************************************

    ```


    ```

    ''Initialization Section

    Option Explicit

    On Error Resume Next

    ```


    ```

    Dim objWshShl, intChangeSettings

    Set objWshShl = WScript.CreateObject("WScript.Shell")

    ```


    ```

    ''Main Processing Section

    ''Verify that the user intends to change his screensaver settings

    intChangeSettings = PromptForConfirmation()

    ```'
