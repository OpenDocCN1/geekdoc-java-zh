    # Hint


    A complete review of CSS is beyond the scope of this book. Instead, you will be
    introduced to a small number of commonly used CSS rules needed to compile the
    HTA presented in this chapter. To learn more about CSS, you may wish to read HTML,
    XHTML, and CSS for the Absolute Beginner (ISBN: 978-1-4354-5423-1).


    CSS has a simple syntax based on English keywords that specify styles and their
    values. CSS style sheets are made up of lists of rules. As outlined in Figure
    14.7, CSS rules are made up of selectors and declaration blocks.


    | Selector | Declaration |

    | --- | --- |

    | | { font-family: Arial; font-size: 12; color: red; } |


    Figure 14.7 A CSS rule is made up of one or more selectors and a declaration block.
    © 2014 Cengage Learning.


    CSS rules identify the element(s) they affect through the selector. Selectors
    specify the HTML elements which rules apply. You can specify multiple selectors
    in a rule, provided you separate them by commas. A declaration block consists
    of one or more declarations that allow you to modify one or more aspects of an
    element''s presentation. Declarations are placed inside an opening { character
    and a closing }. They consist of one or more property/value pairs, as shown in
    Figure 14.8.


    A property identifies a presentation aspect that the rule will modify. Property
    names are separated from their corresponding values using a colon. A value is
    a setting applied to a property for the selected elements. Property/value pairs
    are separated from other property/value pairs using a semi-colon.


    | Definition | A selector identifies an HTML element to which a CSS rule is applied.


    | Definition | A declaration block is a CSS organization construct up of one or
    more declarations.


    | Definition | A declaration is a statement that modifies one or more aspects
    of an element''s presentation.


    | Definition | A property specifies the presentation aspect that a CSS rule modifies.


    | Property | Value |

    | --- | --- |

    | | { font-family: Arial; font-size: 12; color: red; } |


    | Definition | A value is a setting assigned to a property for a selected element.


    Figure 14.8 Declarations consist of property/value pairs.


    © 2014 Cengage Learning.'
