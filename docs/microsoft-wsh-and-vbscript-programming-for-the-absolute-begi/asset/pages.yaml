    # Trap


    When you run scripts from the Windows desktop or command line, they execute using
    your security credentials. If you choose the execution of your VBScript, then
    your scripts will not have the authority that you have and will be unable to establish
    a network drive connection. One way to get around this is to embed a username
    and password inside your script. However, doing so is really bad for security.
    Another option is to set up your script to prompt for a valid username and password
    at execution time and authorise someone might be around to supply these credentials.


