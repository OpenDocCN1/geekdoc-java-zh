    on the classic blackjack game played in casinos around the world. In this game,
    both the player and the computer are dealth a single card, face up. The object
    of the game is to try to get as close as possible to a value of 21 without going
    over. The player can ask for more extra cards (hits) as desired and stop (stick)
    at any time. If the player goes over 21, he busts. The computer plays its hand,
    stopping only after reaching a total of 17 or more or busting. Figures 7.1 through
    7.4 demonstrate the game in action as played on a computer running Windows 8.1.'
