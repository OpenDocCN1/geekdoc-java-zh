    # Printer Administration


    Printer administration involves many tasks. One task is setting network printer
    connections. Others include managing print jobs and physically managing the printer,
    including refilling its paper, ink, ribbon, or toner. Another task involves removing
    printer connections when they are no longer needed. The next two sections demonstrate
    how to use VBScript and the WSH to set up and disconnect network printer connections.


    # Connecting to a Network Printer


    To create a connection to a network printer, you need to use the WshNetwork object''s
    AddWindowsPrinterConnection() method. This method has two types of syntax, depending
    on the operating system on which the script is executed.


    The syntax for the AddWindowsPrinterConnection() method, when used on a computer
    running Windows 7 and Windows 8.1 is as follows:


    ```

    WshNetwork.AddWindowsPrinterConnection(strPrinterPath)

    ```


    strPrinterPath is the UNC path and for the network printer.


    The following VBScript demonstrates how to set up a network printer connection:


    ```

