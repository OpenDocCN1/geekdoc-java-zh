    # How Does It Work with VBScript?


    Microsoft originally designed VBScript to operate as a Web-scripting language.
    That means it could run

    only when embedded within HTML pages that were executed by Internet Explorer.
    VBScript''s success as

    a Web-scripting language has always been limited. One reason for this is that
    Netscape provided no sup-

    port in its Internet browser. In addition, from the beginning, Netscape provided
    JavaScript free of

    charge. There was hesitation on the part of many programmers to abandon JavaScript
    for VBScript,

    Microsoft maintained as a proprietary technology, meaning that Microsoft and almost
    alone owned

    controlled VBScript.


    Microsoft has created a modified version of VBScript that is designed to work
    with the WSH. This

    version of VBScript lacks many of the features found in browser-based versions
    of VBScript. For example,

    it does not work with forms and frames. Then again, as a WSH scripting language,
    VBScript doesn''t need

    this functionality because these types of resources are beyond the scope of the
    environment.


    # Hello World: Creating and Executing Your First VBScript


    Instead of being embedded within HTML pages, VBScripts run by the WSH are saved
    as standalone files

    a a .vbs file extension. For example, take a look at the following VBScript:


    ```

    MsgBox "Hello World!"

    ```


    As you can see, the script consists of just one line of code. To create this script,
    open your editor and

    the line of code exactly as I''ve shown here and save the script as Hello.vbs.
    That''s it. Now run it:

    First locate the folder where you saved the script and double-click on it. You
    should see a graphical

    pop-up dialog box similar to the one shown in Figure 1.11.


    Let''s talk about the script that you wrote and executed. First of all, because
    you executed it by double-clicking, you ran it using the default execution host.
    The default execution host is WScript.exe unless

    you''ve changed it. (I''ll go over how to change the execution host in the next
    chapter.) The script itself execute-c a VBScript function called MsgBox().


    ![](img/337e6368245d3aad07236ff6d4dacf23_37_0.png)


    Figure 1.11 Viewing the pop-up dialog box created by your first VBScript.


    © 2014 Cengage Learning.'
