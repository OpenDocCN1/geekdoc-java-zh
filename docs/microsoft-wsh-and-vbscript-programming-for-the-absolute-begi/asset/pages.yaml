  md: '# Chapter 8 • Storing and Retrieving Data 197


    To demonstrate how this works, the first builds up an example. For starters, create
    a VBScript and add the following statements to it:


    ```

    Dim objFso, objFileHandle, strDisplayString

    Set objFso = WScript.CreateObject("Scripting.FileSystemObject")

    Set objFileHandle = objFso.OpenTextFile("C:\Temp\Sample.txt", 1)

    ```


    The first statement defines variables to be used by the script. The next statement
    instantiates the FileSystemObject which sets up an object reference to the Sample.txt
    file and opens it for Reading mode. Now add the following statements to the script:


    ```

    Do While objFileHandle.EndOfStream = False

    strDisplayString = strDisplayString & objFileHandle.ReadLine() & vbCrLf

    Loop

    ```


    The first statement sets up a Do...While loop that checks on each iteration to
    determine whether the end-of-file marker has been reached. As long as the end
    of the file has not been reached, another line of the file is read and appended
    to the end of a variable named strDisplayString.


    Finally, close the file by adding the following statement:

    objFileHandle.Close


