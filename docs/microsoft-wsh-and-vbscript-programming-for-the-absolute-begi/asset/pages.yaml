  md: '# Chapter 7 • Using Procedures to Organize Scripts


    The script consists of nine functions. These functions and their purposes are
    as follows:


    +   - DoYouWantToPlay(). This displays the game''s splash screen and invites the
    user to play the game.

    - NoGoPlay(). This controls the overall execution of the game, calling upon other
    procedures as required.

    - DealFirstHand(). This presents the initial cards for both the player and the
    computer.

    - PlayTheGame(). This asks the player whether he would like another card and determines
    when the player has busted or decided to hold.

    - DealAnotherCard(). This retrieves another card for the player''s hand.

    - GetRandomNumber(). This function is called by several other functions in the
    script. It returns a random number between 1 and 13, representing the value of
    a playing card.

    - ComputerPlay(). This plays the computer''s hand, taking hits until the computer''s
    busted or is greater than 17.

    - DetermineWinner(). This compares the player''s hand to the computer''s hand
    to determine who has won. It offers to let the player play another hand. If the
    player accepts, the NoGoPlay() function is called, starting a new hand.

    - DisplaySplashScreen(). This displays information about the game and its author,
    and invites the player to return and play again after finally ending the game.


    # Setting Up the Initialization Section


    You begin the development of the Blackjack Lite game the same way that you''ve
    begun all your other games: by creating a new file and adding it to your VBScript
    template, and then setting up the variables, constants, and object references
    in script''s initialization section.


    ```

    ****************************************************************

    ''Script Name: Blackjack.vbs

    ''Author'': Jerry Ford

    ''Created: 02/03/14

    ''Description: This script creates a scaled-down version of the casino

    ''blackjack card game

    ****************************************************************

    ```


    ```

    '' Initialization Explicit


    Dim intPlayGame, strCardImage, intUserCard, intComputerCard, intAnotherCard

    Dim intUserNextCard, strUserDone, intNewComputerCard, intPlayAgain

    Dim strUserBusted, strTextMsg

    ```'
