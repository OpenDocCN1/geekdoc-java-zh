  md: '# Microsoft WSH and VBScript Programming for the Absolute Beginner, Fourth
    Edition


    Every value within the Registry falls into two types: named or unnamed. The most
    common type of value is named. Named values have been assigned an explicit name.
    This allows you to retrieve the data stored in the value by specifying its name.
    Unnamed values, if you might guess, do not have a name assigned to them. One unnamed
    value is stored under every key. This represents the key''s default value. In
    other words, it''s the value that would be retrieved if you did not specify a
    specific value by name. Windows graphically identifies unnamed values by displaying
    a label of “Default.” Figure 10.6 shows this on a computer running Windows 8.1.


    ![](img/337e6368245d3aad07236ff6d4dacf23_270_0.png)


    Figure 10.6 Unnamed values are assigned a label of “Default.”


    © 2014 Microsoft Corporation. Used with permission from Microsoft.


    # Accessing Registry Keys and Values


    You can manually view the contents of the Registry using the Regedit utility supplied
    with every version of Windows. (On Windows 7, type Regedit in the Start menu’s
    Search text field and press Enter. On Windows 8.1, type Regedit at the Windows
    Start screen and press Enter.) For example, Figure 10.7 provides a high-level
    view of the Registry on Windows 8.1. As you can see, the five root keys are visible,
    and one of them has been partially expanded to reveal its tree-like structure.'
