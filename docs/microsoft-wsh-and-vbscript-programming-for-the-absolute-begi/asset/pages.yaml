    # Executing WMI Queries


    In addition to collecting data by retrieving instances of specified managed resources,
    you can also use the WMI Query Language (WQL) to submit queries that, when processed,
    retrieve information for any matching WMI resources. The WQL is a retrieval-only
    language, derived from the standard SQL language. It consists of a small collection
    of statements, as outlined in Table 13.1.'
  merge: -1
  pgno: 347
- img_proc: true
  md: '# Microsoft WSH and VBScript Programming for the Absolute Beginner, Fourth
    Edition


    # ## TABLE 13.1 WQL KEYWORDS


    | Keyword | Description |

    | --- | --- |

    | and | Returns a result of true if the result returned by both of combined Boolean
    expressions is equal to true |

    | associates of | Returns a list of every instance of a given resource type |

    | class | Refers to the class associated with a specified query object |

    | from | Specifies the class to be used in the select statement |

    | group clause | Instructs the WMI to create a single notification representing
    a group of events |

    | having | Refines a select statement query by specifying the type of events to
    be processed during the group interval by the within keyword |

    | is | Performs a comparison of query data |

    | isa | Performs a comparison against the subclasses belonging to a specified
    class |

    | keysonly | Reduces query by populating query results with the keys of instances
    produced by references of and associations of queries |

    | like | Refines query by determining whether a string appears within the query
    results |

    | not | Inverts the logic when processing query results |

    | null | A value that indicates an object does not have an assigned value |

    | or | Combines two conditions when formulating a query |

    | references of | Returns all instances that refer to a specified source instance
    |

    | select | Indicates specific properties to be used when formulating a query |

    | true | A Boolean value representing a true result |

    | where | Refines a query''s scope by allowing the specification of required criteria
    |

    | within | Sets the polling or grouping interval to be used by an event query
    |

    | false | A Boolean value representing a false result |


    > © Jerry Lee Ford, Jr. All Rights Reserved.


    In addition to its language keywords, the WQL also supports a standard set of
    comparison operators that you can use in conjunction with the where keyword when
    developing select clauses. These operators are listed Table 13.2.


    The next couple of examples will demonstrate how to integrate WQL queries into
    your VBScripts.


    # Hint


    The WQL does not permit the creation of cross-namespace queries, limiting you
    to query a single class at a time.'
  merge: -1
