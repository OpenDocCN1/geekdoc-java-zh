    , \n\"C:\\Windows\\System32\\Mystify.scr\"\n\nEnd Sub\n\nAs you can see, this\
    \ script modifies four Registry values. The modification of the first value enables\
    \ the Windows screensaver. The modification of the second value enables screensaver\
