  md: '# Chapter 4 • Constants, Variables, Arrays, and Dictionaries


    VBScript supplies a number of different statements that enable you to define several
    types of data. These VBScript statements are outlined in Table 4.1.


    > Data is information that a computer program collects, modifies, stores, and
    retrieves during execution.


    | Statement | Description |

    | --- | --- |

    | Const | Defines a VBScript constant |

    | Dim | Defines a VBScript variable or array |

    | ReDim | Defines a dynamic VBScript array |


    The Const statement is used to define data that never changes throughout the execution
    of a script. For example, in this book you will sometimes use define strings to
    define a standard greeting message in a pop-up dialog box. The Dim statement is
    used to define a variable. A *variable stores an individual piece of data such
    as its name, number, or date. The ReDim statement is used to create an array.
    *Arrays are used to store groups of related information. For example, instead
    of defining 20 different variables to store information about 20 people, a single
    array could define these, and then information about each person could be stored
    in it. Each of these statements would be examined in greater detail throughout
    the rest of this chapter.


    > A *variable* is an individual piece of data such as a name, number, or date
    that is stored in memory. An *array* is used to store groups of related information.


    # Working with Data That Never Changes


    Data should be defined within a script according to the manner in which it will
    be used. If the script only needs to reference a piece of data that has a value
    which is known during script development, then the data can be defined as a constant.
    An example of a constant is the mathematical value of pi. Other examples of constants
    include specific dates in history, the name of places, and so.


    There are two sources of constants within scripts. First, you can define your
    own constants within your scripts. Another option is to reference a built-in collection
    of readily available constants provided by VBScript.


    > A *constant* is a VBScript construct that contains information that does not
    change during the execution of a script.'
  merge: -1
  pgno: 105
- img_proc: true
  md: '# Microsoft WSH and VBScript Programming for the Absolute Beginner, Fourth
    Edition


    # Assigning Data to Constants


    If you''re going to write a script and know for a fact that you need to reference
    one or more values that will not change during the execution of the script, then
    you can define each piece of data as a constant. One of the nice features of constants
    is, once defined, their value cannot be changed. This prevents their values from
    being accidentally modified during the execution of the script.


    If your script attempt to modify the value assigned to a constant after it has
    been initially assigned, you will see an "illegal assignment: name of constant"
    error message when the script executes. Open your script, do search for the name
    of the constant, and look for the statements that have attempted to modify your
    value to find the source of the error.


    To define a constant within a VBScript, you must use the Const statement. This
    statement has the following syntax:


    ```

    [Public | Private] Const ConstName = expression

    ```


    Public and Private are optional keywords and are used to determine the availability
    of constants throughout a script. Defining a constant as Public makes it available
    to all processes within the scripts. Defining a constant as Private makes it available
