    # Reading from Files


    VBScript makes it about as easy to read from a file as it is to write to one.
    However, before you attempt to read or process the contents of a file text, you
    should first make sure the file has data in. If the file has no data, opening
    the file and appending to read it is pointless.


    You can use the TestStream object''s AtEndOfStream property to determine whether
    a file contains data. Not only should you check the AtEndOfStream property before
    you begin reading a file, but your script should continue to check this property
    before each additional read operation to make sure data is still in the file for
    the script to read. In other words, you need to keep checking to make sure that
    your script has not reached the end-of-file marker.'
