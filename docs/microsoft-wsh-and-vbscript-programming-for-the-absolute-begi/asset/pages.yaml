    By the time you have created and run this game, you''ll have learned the fundamental
    steps involved in writing and executing VBScripts. At the same time, you will
    have prepared yourself for the more advanced programming concepts developed in
    later chapters, including how to use the WSH and VBScript to develop some cool
    games.


    # What Is the WSH?


    The Windows Script Host (WSH) is a programming environment that allows you to
    write and execute scripts that run on Windows operating systems. You can use the
    WSH to create and execute scripts—small text-based files written in an English-like
    programming language—from the Windows command prompt or directly from the Windows
    desktop. Scripts provide quick and easy ways to automate lengthy or monotonous
    tasks that take too much time or effort using the Windows graphical user interface
    (GUI). Scripts are also better suited for automating tasks that are not complex
    enough to justify the development of an application using a language such as C++
    or Visual Basic.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# Chapter 1 • Getting Started with the WSH and VBScript


    The WSH is made up of a number of different components. These components include
    the following:


    +   - Script engines

    - Script execution hosts

    - The WSH core object model


    The relationship of each of the components to one another is shown in Figure 1.5.


    ![](img/337e6368245d3aad07236ff6d4dacf23_25_0.png)


    Figure 1.5 The components that comprise the WSH.


    © 2014 Cengage Learning.


    # WSH Scripting Engines


    A script execution engine is a program that processes (interprets) the statements
    that make up scripts and translates them into machine-readable code that the computer
    can understand and execute. By creating an environment in which scripts can execute,
    the WSH makes script development a straightforward task.


    The WSH provides each script with a number of resources. The WSH provides script
    engines for processing scripts. By default, Microsoft provides two script engines
    for the WSH:


    +   - VBScript. A scripting language based on Microsoft’s Visual Basic programming
    language.

    - JScript. A scripting language based on Netscape’s JavaScript Web-scripting language.


    Therefore, by default, the WSH can process scripts written in either VBScript
    or JScript. The WSH is designed in a modular fashion, allowing Microsoft and third-party
    software developers to add support for additional scripting engines. For example,
    script execution engines have been developed for Perl, Python, and Rexx.'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# Microsoft WSH and VBScript Programming for the Absolute Beginner, Fourth
    Edition


    # Selecting a WSH Script Execution Host


    To run a script, the WSH uses a script execution host to process a script engine
    has interpreted that. The WSH supplies two different script execution hosts:


    +   - CSScript.exe: An execution host that enables scripts to execute from the
    Windows command prompt and display text-based messages.

    - WScript.exe: An execution host that enables scripts to execute from the Windows
    desktop, display messages, and collect user input pop-up dialog boxes.


    With the exception of the WScript.exe execution''s capability to display graphical
    pop-up dialog boxes, the functionality provided by the WSH''s two execution hosts
    is identical. If you run a script using the CScript.exe execution host, the script
    can, depending on how it is written, still display messages using pop-up dialog
    boxes.


    | Definition | Within the context of this discussion, the term host describes
    an environment that provides all the resources required for a script to execute.
    |


    As both hosts provide the same basic functionality, you''re probably wondering
    which one you should use. There''s no right or wrong answer here. Often, the selection
    of an execution host is simply a matter of personal preference. However, there
    are some circumstances in which you may want to choose one over the other. For
    example, if you plan to run your scripts in the background, or if you want to
    schedule your scripts using the Windows Task Scheduler service and have no requirement
    for interacting with the user, you might want to use CScript.exe. However, if
    your scripts need to interact with the user—which will be the case with the games
    you''ll create with this book—you''ll want to use the WScript.exe execution host.
    Another factor that may affect your selection of a script execution is your personal
    comfort of working with the Windows prompt.


    # Introducing the WSH Core Object Model


    The WSH provides one final component, called the core object model, which is critically
    important to the development and execution of scripts. The WSH core object model
    provides VBScript with direct access to Windows resources.


    Examples of the types of Windows resources to which the WSH core object model
    provides access to the following:


    +   - Windows desktop

    - Windows Start menu

    - Windows applications

    - Windows file system

    - Network printers

    - Network drives

    - Windows Registry'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# Chapter 1 • Getting Started with the WSH and VBScript


    The Windows operating system can be viewed as a collection of objects. For example,
    a file is an object. So is a folder, disk drive, printer, or any other resource
    that is part of the computer. What the core object model does is expose these
    objects in a format that allows scripts to view, access, and manipulate them.
    Each exposed object has associated properties and methods that scripts can use
    to interact with an object, as well as its behavior or status. For example, a
    file has number of associated properties, such as its name and extension. By exposing
    the Windows file system, the WSH enables scripts to access files and their properties
    and perform actions, such as renaming a particular file or its file extension.
    Files also have methods associated with them. Examples of these methods are that
    you can write scripts that move or copy files from one folder to another, if you
    are working on a network, from one computer to another.


    > In this book, the term property refers to an object-specific attribute, such
    as a file''s name, that can be used to affect the status of the object.


    Don''t worry if the WSH core object model seems a little confusing right now.
    You will learn more about it in Chapter 2, "Introduction to the Windows Script
    Host." In addition, you can jump to Appendix C, "The W Core Object Model," at
    any time for additional insight. The important thing to understand is that WSH
    enables scripts to access Windows resources (objects) and to change their attributes
    (properties) or perform actions that affect them (using object methods).


    > In this book, the term method is used to refer to a built-in function that your
    scripts execute to perform an action on an object, such to copy or move a file
    to another location.


    # How Does the WSH Compare to Windows Scripting?


    Windows scripts are plain text files that have a .bat or .cmd extension. Unlike
    scripts written to work with the WSH, which are written using specific scripting
    languages like VBScript and JScript, Windows shell scripts are developed using
    regular Windows commands and a collection of shell-scripting statements. The WSH
    provides a more complete scripting environment in large part due to its core object
    model. However, Windows scripts can execute any Windows command or command-line
    utility from a shell script. Windows shell scripting also provides a complete
    set of programming statements that include support for variables, looping, conditional
    logic, and procedures. For non-programmers, scripts may be easier to read and
    understand, and modify.


    Another difference between scripts written using the WSH and Windows shell scripts
    is that Windows scripts only support text-based communications with the user.
    In other words, shell scripts cannot display messages or prompt the user for information
    using graphical pop-up dialog boxes. Windows shell scripting does not provide
    support for any type of object model like the WSH. Therefore, Windows scripts
    are not capable of directly interacting with many Windows resources. For example,
    Windows scripts cannot directly edit the Windows Registry or create desktop shortcuts.
    However, Windows Resource Kits'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# Microsoft WSH and VBScript Programming for the Absolute Beginner, Fourth
    Edition


    provide Windows shell scripts with access to a number of command-line utilities
    that provide indirect access to many Windows resources.


    To write shell scripts, you must have a good understanding of Windows commands
    and their syntax. You must also be comfortable with the Windows command prompt.
    Conversely, to effectively use the WSH, you must be well versed in one of its
    supported scripting languages. There are many cases which you can accomplish the
    same task using Windows shell scripting or the WSH. As a general rule, however,
    the more complex the task, the more you''ll want, or need, to use the WSH.


    | A Windows Resource Kit is a combination of additional utilities and documentation
    designed for a particular Windows operating system but provided as a separate
    downloadable package. You can obtain Windows Resource Kits via the Microsoft Download
    Center (www.microsoft.com/en-us/download). | Definition


    # Hint


    If you''re really interested in learning about Windows shell scripting, read Microsoft
    Windows Shell Script Programming for the Absolute Beginner (ISBN 1-59200-085-1).


    # WSH Versus Windows PowerShell


    PowerShell is fully integrated into Microsoft''s .NET framework, providing system
    administrators with access to system resources. Like VBScript and the WSH, Windows
    PowerShell is object oriented. PowerShell lets you execute PowerShell commands,
    referred to as cmdlets, and develop and execute scripts that use your cmdlets.


    Like WSH and VBScript, Windows PowerShell provides access to system resources
    and can be used to programmatically interact with the file system, Windows Registry,
    .NET, and WMI. WSH, VBScript, and Windows PowerShell support a robust collection
    of language constructs that are variable, conditional logic, and functions.


    Unlike WSH and VBScript, PowerShell does not support the use of pop-up dialog
    boxes and is restricted to the command line. Unlike VBScript, which is based on
    the widely popular and easy-to-use BASIC programming language, Windows PowerShell
    represents a completely new scripting language, which is arguably more difficult
    for new programmers to learn and understand.


    Microsoft has put a lot of time and resources into the development of Windows
    PowerShell and is promoting it as the future of Windows scripting. However, Microsoft
    is continuing to support the WSH as a Windows scripting environment, as evidenced
    by the recent release of WSH 5.8. Microsoft will continue to support the WSH—and
    for good reason. Companies all over the world have invested significant time and
    resources in it have developed hundreds of millions of lines of code that are
    used to run mission-critical applications and administer servers and workstations.'
  merge: -1
  pgno: 28
- img_proc: true
  md: 'Companies continue to rely on the WSH and VBScript and extend their use. As
    such, WSH and VBScript programming will remain essential for application developers
    and systems administrators for the foresee-able future.


    # Hint


    If you''re really interested in learning more about Windows PowerShell, read Microsoft
    Windows PowerShell 2.0 Programming for the Absolute Beginner, Second Edition (ISBN-1-59863-899-8).


    # Understanding How the Windows Shell Works


    Even if you have used Windows operating systems for many years, chances are that
    you have only limited working experience with the Windows shell. To become a really
    efficient and proficient script programmer, you''ll need a solid understanding
    of what the Windows shell is and how to work with it.


    An understanding of how to work with the Windows shell is also important when
    learning how to work with the CScript.exe execution host, because scripts run
    by this execution host are generally started from the Windows command prompt.
    Finally, it''s important to understand the Windows shell when working with the
    VBScript execution host because it provides support for command-line script execution.


    > The command prompt enables you to submit commands to the Windows shell for processing.
    By default, the command prompt appears in the form of a drive followed by a colon,
    the backslash character, and the greater-than-character (for example, C\).


    You cannot touch the Windows operating system itself. This would be far too complex
    and difficult. Instead, you must go through an interface. Windows operating systems
    support two such interfaces:


    +   - The Windows GUI. The Windows GUI is provided in the form of the Windows
    desktop, Start menu, and other graphical elements which you normally interact
    with using your computer. The purpose of the GUI is to make the operating system
    easier to work with.


    +   - The Windows shell. The Windows shell is a text-based interface between you
    or your scripts and the operating system. You communicate with the Windows by
    typing commands in the Windows command prompt; the Windows shell translates these
    commands into a format that the operating system can process. The operating system
    then returns any results to the Windows shell, which displays them in the Windows
    Console.


    # Accessing the Windows Console in Normal Mode


    To access the Windows shell and begin working with it using the command prompt,
    you must first open a Windows Console. To open a Windows Console on a computer
    running Windows Vista or Windows 7 (see Figure 1.6), open the Start menu, choose
    All Programs, choose Accessories, and then choose Command.'
