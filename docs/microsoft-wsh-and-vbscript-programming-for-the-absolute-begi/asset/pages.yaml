    # Examining Built-in VBScript Functions


    One of the real advantages of working with VBScript is having access to its large
    number of built-in functions. In the previous example, you saw how to use the
    FormatNumber() function. There are too many built-in VBScript functions to try
    to list them all. For a complete list, see Appendix D, Built-in VBScript Functions.


    # Demo: The Square-Root Calculator


    By using functions, you can really streamline your scripts. VBScript''s built-in
    functions provide built-in code that you don''t have to write. The best way to
    illustrate this is to use two examples. In the first example, I''ve written a
    small VBScript that prompts the user to type a number so that the script can calculate
    its square root. The second script, discussed in the following section, is a rewrite
    of the first script, using the VBScript Sqr() function in place of the original
    programming logic.'
  merge: -1
  pgno: 86
- img_proc: true
  md: 'Here’s the first example:


    ```

    ****************************************************************************************************

    ''Script Name: SquareRoot-1.vbs

    ''Author: Jerry Ford

    ''Created: 01/22/14

    ''Description: This script demonstrates how to solve square-root

    ''calculations using a mathematic solution devised by Sir Isaac Newton

    ****************************************************************************************************

    ```


    # Initialization Section


    Option Explicit


    Dim UserInput, Counter, X


    ```

    UserInput = InputBox("Type a number", "Square Root Calculator")


    X = 1

    For Counter = 1 To 15

    X = X - ((X^2 - UserInput) / (2 * X))

    Next

    ```


    ```

    MsgBox "The square root of " & UserInput & " is " & X

    ```


    As you can, the first part of the script displays a pop-up dialog box to collect
    the number, and the last part displays the script''s final results. The middle
    is where the real work results:


    ```

    X = 1

    For Counter = 1 To 15

    X = X - ((X^2 - UserInput) / (2 * X))

    Next

    ```


    I won’t go into the mathematical logic behind these statements. Unless you’re
    a math major, it’s a bit of a challenge to understand. This solution is based
    on Sir Isaac Newton''s for solving square-root equations. Granted, it took only
    four lines of code to reproduce the formula, but would you like to have tried
    to write these four statements from scratch? I don''t think so.


    # Demo: A New and Improved Square-Root Calculator


    Now let''s look at a rewrite of the square-root calculator script in which I use
    VBS’s built-in Sqr() function to perform square-root calculations.'
