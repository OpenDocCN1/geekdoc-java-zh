    cGameTitle,"pickle")

    ```


    Notice that the user is only given a little bit of information about the type
    of script is looking for. This is intentional and is meant to provide a certain
    amount of unpredictability to the story line.


    You may also noticed the final argument on each of the InputBox() statements.
    I have added the argument so that each box that is displayed by the script will
