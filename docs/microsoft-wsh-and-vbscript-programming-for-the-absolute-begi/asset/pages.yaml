  md: '# Chapter 1 • Getting Started with the WSH and VScript


    # Hint


    The WScript object is one of the WSH''s core objects. Do not confuse it with the
    WSHScript.exe execution host. It is unfortunate that they share the same name
    because they are different.


    As the two versions of your script show, you can perform the same task using either
    a VScript function or a WSH method. This script also demonstrates how easy creation
    and execution can be, and even a one- or two-line script can perform some pretty
    neat tricks, such as displaying a pop-up dialog box.


    In the previous example, you created your first VScript by following the steps
    that I set. Depending on the size and complexity of the script that you''re going
    to develop, you can get away simply writing the script as you go. More than not,
    you''ll want to take a more methodical approach to script development. First,
    make sure you know what you want to achieve. Break the task down into specific
    steps that, combined, completes the task. Spend a little time sketching out the
    design of your script and try to break the script into different sections. Then
    develop a section at a time, making sure that one works before moving on to the
    next. I''ll try to point out ways to do this throughout the book.


    # Executing Your Script from the Command Prompt


    In the previous example, you executed your script by double-clicking on it, and
    everything worked fine. That''s the scripts were written so that they could run
    from the Windows desktop. Sometimes, the execution host you use to run your script
    from the Windows desktop can have a big impact on how the script operates. Let''s
    take a look at one


    +   1. Open the Hello.vbs script and replace the contents of the script with the
    following statement: WScript.Echo "Hello World"

    This statement uses the WScript object''s Echo() method to display a text message.

    2. Save the script and execute by double-clicking. Unless you have modified the
    default WSH configuration, the script will run using the WScript.exe execution
    host. The result is that the message is displayed in a pop-up dialog box.

    3. Copy the file to the C: drive on your computer and open a Windows Console.

    4. At the command prompt, type CD \ and press the Enter key. This command changes
    the working directory to the root of the C: drive, where Hello.vbs script now
    resides.

    5. Type the following command and press the Enter key:

    Script Hello.vbs


    What you see this time is quite different. Instead of a pop-up dialog box, the
    script''s output is written to the Windows console, as shown in Figure 1.13.'
