    `<h2></h2>` tags are two-level headings that display enclosed text in an enlarged
    font size.


    # Creating and Executing an HTA


    HTAs are developed in much the same way as HTML pages, the major difference being
    that they are saved with an .hta file extension. In fact, you can create an HTA
    by simply creating and saving a text file with an .hta extension. To test this
    out, use Notepad to create a new file. Type the following text in it and save
    the file with the name of HelloWorld.hta


    Hello World!


    The .hta extension identifies the file as an HTA. As a result, Windows will automatically
    run the HTA using the mhta.exe execution engine. To execute this HTA, double-click
    on it. A window similar to the one shown in Figure 14.4 will be displayed.


    A simple HTA is displayed using various defaults that specify its GUI window looks
    and operates. These defaults are called in Figure 14.4. However, you can configure
    window features by adding the `<HTA:APPLICATION>` tag to the script file. This
    optional tag exposes a collection of window attributes that you can specify and
    configure, determining which window features are added to the application window.
    These attributes also contain certain behaviors, such as whether more than one
    instance of the HTA can be run at a time.'
