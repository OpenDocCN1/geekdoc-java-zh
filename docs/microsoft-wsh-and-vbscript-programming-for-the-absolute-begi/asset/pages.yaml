  pgno: 189
- img_proc: true
  md: '# Microsoft WSH and VBScript Programming for the Absolute Beginner, Fourth
    Edition


    +   - It collects the player''s name.

    - It displays a story, substituting the player''s name at predetermined locations
    within the story.

    - It displays a dialog box, inviting the player to play on another day.


    One way to design your script box would be to define the variables, constants,
    and object references, and then create a series of functions and subroutine calls
    from the script''s main processing section. The rest of the script would then
    consist of individual functions and subroutines, each of which would be designed
    to perform one of the activities outlined in the previous list.


    One sign of a world-class programmer is the path that he leaves behind—in other
    words, the professional way in which the programmer organizes and documents his
    scripts. One organizational technique used by experienced programmers is to group
    all functions and subroutines together in one place, apart from the initialization
    and main processing sections of the script. This makes them easy to locate and
    maintain. Usually, you''ll find a script''s functions and subroutines located
    at the bottom of the script. I suggest you modify your script template to include
    a "procedure" section for this purpose.


    # Writing Reusable Code


    One of the biggest advantages of using functions and subroutines is the capability
    to create reusable code within your VBScripts. Any time you find yourself needing
    to perform the same task over and over in a script—such as displaying messages
    in pop-up dialog boxes or retrieving random numbers—consider creating a function
    or subroutine. Then, by using a single statement to call the appropriate procedure,
    you can reuse the statements located within the procedure and over again.


    Functions and subroutines make for smaller scripts. They also make maintenance
    and enhancement much easier and quicker. For example, it''s lot easier to change
    one line of code located in a procedure than it is to make that change in numerous
    places throughout a script.


    # The Guess a Number Game Revisited


    So far, you have seen small pieces of code that work with functions and subroutines.
    Now let''s take a look at how to apply procedures to a larger script. To, go back
    and review the Guess a Number game in Chapter 6, "Processing Collections of Data."
    This script, like all other scripts in this book prior to this chapter, was written
    without the use of procedures.


    I deliberately avoided procedures in the script from Chapter 6, so I had to use
    other techniques to organize the script''s programming logic. What I chose to
    do was to put everything in the script''s main processing section as follows:


    +   - I added statements to generate a random number.

    - I added a Do...Until loop to control the game''s execution.'
