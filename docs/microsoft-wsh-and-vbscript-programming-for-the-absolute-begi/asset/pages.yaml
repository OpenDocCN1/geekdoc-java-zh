    # Constructing an HTA


    To create an HTA that does something else than display plain text in a window,
    you must add some HTML to the HTA file. Before you can do this, you must understand
    how HTAs are organized. While structured as HTML pages, there are really three
    main parts and an optional fourth part to a HTA that you must focus on. These
    parts include the following:


    +   - <HTA:APPLICATION> tags. This provides control over the appearance of an
    HTA''s application window.

    - <script></script> tags. These contain the VScript statements, functions, subroutines,
    and the WSH objects that make your HTAs work.

    - <body></body> tags. These contain the HTML tags (elements) that make up an HTA''s
    interface.

    - <style></style> tags (optional). These contain Cascading Style Sheets (CSS),
    which are used to describe the way HTML content is presented.


    # Introducing the <HTA:APPLICATION> Tag


    HTA files are organized like HTML files. The <HTA:APPLICATION> tag is placed in
    an HTA file''s <head></head> section. This tag is optional. If not included, a
    default HTA window is displayed without any customization. This tag exposes the
    HTA DOM, providing access to a collection of attributes that allow HTA to customize
    the application window which it executes, specifying features like text box controls,
    radio buttons, checkbox controls, etc. The following example converts the preceding
    HTML page to an HTA (after adding the <HTA:APPLICATION> tag and saving it with
    an .hta extension).


    ```

    <html>

    <head>

    <title>My First HTA</title>

    <HTA:APPLICATION

    ```'
