  md: '# Acknowledgments


    There are a number of individuals to whom I owe many thanks for their help and
    assistance in the development of the fourth edition of this book. I would start
    by thanking Mitzi Kountz, who served as the book''s acquisitions editor. Special
    thanks also go out to Kate Shoup for serving as the book''s project editor and
    copy editor. I also want to thank Zac Hester for all his valuable technical input
    and advice. In addition, I would like to thank everyone else at Cengage Learning
    for all their hard work.


    # About the Author


    Jerry Lee Ford, Jr. is an author, educator, and IT professional with more than
    24 years of experience in information technology, including roles as an automation
    analyst, technical manager, technical support analyst, automation engineer, and
    security analyst. He is the author of 38 books and co-author of two additional
    books. His published works include Microsoft Windows PowerShell Programming for
    the Absolute Beginner; Microsoft Visual Basic 2008 Express Programming for the
    Absolute Beginner; HTML, XHTML, and CSS for the Absolute Beginner; XNA 3.1 Game
    Development for Teens; and VBScript Professional Projects. Jerry has a master''s
    degree in business administration from Virginia Commonwealth University in Richmond,
    Virginia, and has more than five years of experience as an adjunct instructor
    teaching networking courses in information technology.'
