  md: '# A Complete Shortcut Script


    Now let''s put together some of the shortcut examples you worked on previously
    to make a new script that creates shortcuts for GuessANumber.vbs on the Windows
    desktop and Programs menu.


    ```

    ****************************************************************

    ''Script Name: ShortcutMaker.vbs

    ''Author: Jerry Ford

    ''Created: 02/20/14

    ''Description: This script creates shortcuts for the GuessANumber.vbs

    ''VBScript ''on the Windows desktop and Programs menu.

    ****************************************************************

    ```


    ''Initialization Section

    Option WshExplicit


    ```

    Dim objWShSh, strTargetFolder, objDesktopShortcut, objProgramsShortcut

    Dim strAppDataPath

    ```


    ```

    ''Establish an instance of the WshShell object

    Set objWShSh = WScript.CreateObject("WScript.Shell")

    ```


    ```

    ''Create the desktop shortcut - Works on Windows 7 and Windows 8.1

    strTargetFolder = objWShSh.SpecialFolders("Desktop")

    Set objDesktopShortcut = objWShSh.CreateShortcut(strTargetFolder + "\GuessANumber.lnk")

    objDesktopShortcut.TargetPath = "C:\GuessANumber.vbs"

    objDesktopShortcut.Description = "Guess a Number Game"

    objDesktopShortcut.Hotkey = "Ctrl+Alt+G"

    objDesktopShortcut.Save

    ```


    ```

    ''Create the Programs menu shortcut on Windows 7 and a Apps group

    ''shortcut on Windows 8.1

    strTargetFolder = objWShSh.SpecialFolders("Programs")

    Set objProgramsShortcut = objWShSh.CreateShortcut(strTargetFolder & "\GuessANumber.lnk")

    objProgramsShortcut.TargetPath = "c:\GuessANumber.vbs"

    objProgramsShortcut.Save

    ```'
