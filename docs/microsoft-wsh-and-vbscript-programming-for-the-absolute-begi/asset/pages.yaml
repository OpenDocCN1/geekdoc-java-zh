    # Reserved Characters


    Like any programming language, VBScript has a collection of reserved words. Reserved
    words are words that you cannot use within your scripts because VBScript also
    assigns a special meaning to them. Some of these words are reserved because they
    are part of the language itself. Others are reserved for future use. Table 3.2
    lists VBScript''s reserved words. The important thing to remember when it comes
    to VBScript reserved words is that you can only use them as intended (that is,
    you cannot use them as variables, constants, or procedure names).


    | TABLE 3.2 VBSCRIPT''S COLLECTION OF RESERVED WORDS |

    | | | | |

    | And | EndIf | LSet | RSet |

    | As | Enum | Me | Select |

    | Boolean | Eqv | Mod | Set |

    | ByRef | Event | New | Shared |

    | Byte | Exit | Next | Single |

    | ByVal | False | Not | Static |

    | Call | For | Nothing | Stop |

    | Case | Function | Null | Sub |

    | Class | Get | On | Then |

    | Const | Goto | Option | To |

    | Currency | If | Optional | True |

    | Debug | Imp | Or | Type |

    | Dim | Implements | ParamArray | TypeOf |

    | Do | In | Preserve | Until |

    | Double | Integer | Private | Variant |

    | Each | Is | Public | Wend |

    | Else | Let | RaiseEvent | While |

    | ElseIf | Like | ReDim | With |

    | Empty | Long | Rem | Xor |

    | End | Loop | Resume | |'
