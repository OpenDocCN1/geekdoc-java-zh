  md: '# Storing Script Configuration Settings in External Files


    Up to this point in the book, all the scripts you''ve seen have been controlled
    by configuration settings embedded within the scripts themselves. By configuration
    settings, I mean constants and variables that were set up to store data that was
    then used to control how the scripts executed. For example, I''ve controlled the
    scripts display in pop-up dialog boxes by assigning a string to a constant that
    I''ve defined at the beginning of each script. To change this text for a given
    script, you must open the script and modify it. However, every time you open a
    script to make even the simplest change, you run the risk of accidentally making
    a typo that breaks something.


    It''s a good idea to remove or externalize script configuration settings. One
    way of doing this is to store the script configuration settings in external text
    files from which your scripts can open and retrieve the settings. This is accomplished
    using IN (pronounced "eye in eye"). Initialization files are plain-text files
    that have an .ini extension. Programmers use ini files to store configuration
    settings for the operating systems, hardware settings, and software settings.


    The nice thing about using ini files is that if you make a mistake when editing
    them, it''s much easier to find your typo in the INI file than it would be in
    your script. Also, if you plan to share your scripts with other people—especially
    without programming backgrounds—they''ll find modifying INI files relatively easy,
    whereas editing your scripts might overwhelm them.


    > Note

    You can also externalize script configuration settings by storing them in the
    Windows Registry. You''ll learn how to do this in Chapter 10, "Using the Windows
    Registry to Configure Script Settings."


    # INI File Structure


    INI files have a specific structure that you need follow when creating them, as
    shown here:

    ;Sample INI file


    ```

    [Section1]

    key1=value

    key2=value

    ```


    For starters, INI files are organized into sections. Each section''s beginning
    has a section header enclosed within a pair of brackets. In the example, Section1
    is the only section. Sections are made up of zero or more key-value pairs. In
    the example, there are two key-value pairs. You can think of a key as being akin
    to a variable name and a value as being the data that is assigned to the key.


    INI files also have comments, which begin with the : character, as demonstrated
    in the previous INI file. INI files also can contain any number of blank lines,
    which can be added to the INI file to make it easier to read.'
  merge: -1
