    | $ | Matches the end of the input string |

    | * | Matches the preceding expression (zero or more times) |

    | + | Matches the preceding expression (one or more times) |

    | ? | Matches the preceding expression (zero or one time) |

    | (n) | Matches exactly n times |

    | (n,m) | Matches a minimum of n and a maximum of m times |

    | . | Matches any individual character except the newline |

    | (pattern) | Matches a pattern and allows the matched substring to be retrieved
    from the Matches collection |

    | x|y | Matches x or y |

    | [xyz] | Matches any of the specified characters |

    | [xyz] | Matches any character except those specified |

    | [a-z] | Matches characters specified in the range |

    | [^a-z] | Matches characters except those specified in the range |

    | \b | Matches on a word boundary |

    | \B | Matches on a non-word boundary |

    | \cx | Matches the control character specified as x |

    | \d | Matches a single digit number |

    | \O | Matches any single non-numeric character |

    | \f | Matches the form-feed character |

    | \n | Matches the new-line character |

    | \r | Matches the carriage-return character |

    | \s | Matches any white-space character (for example, space, tab, form-feed)
    |

    | \S | Matches any non-white-space character |

    | \t | Matches the tab character |'
