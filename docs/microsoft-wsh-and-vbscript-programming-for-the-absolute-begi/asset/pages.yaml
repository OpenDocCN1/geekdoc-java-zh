  md: '# Working with the Windows File System


    The WSH core object model provides the capability to interact with all sorts of
    Windows resources, such as the Windows desktop and Registry. However, it fails
    to provide any access to the Windows file system, so you cannot use it to access
    local drives or to work with files and folders. Instead of providing this functionality
    as part of the WSH core object model, Microsoft chose to implement it via the
    FileSystem object which is one of VBScript''s run-time objects. Refer to Table
    3.4 in Chapter 3, "VBScript Basics," for a complete listing of VBScript''s run-time
    objects.


    The FileSystemObject object is VBScript''s primary run-time object. All other
    run-time objects, except for the Dictionary, are derived from it. To use the FileSystemObject
    object, you must instantiate it as here:


    ```

    Set objFso = CreateObject("Scripting.FileSystemObject")

    ```


    The first step in setting up an instance of the FileSystemObject object is to
    use the Set statement to associate a variable with it. This is accomplished by
    using the VBScript''s CreateObject() method and specifying the FileSystemObject
    as Scripting.FileSystemObject. Once instantiated, you can interact with the FileSystemObject
    object by referencing the variable that has been set up, providing access to all
    FileSystemObject object properties and methods.


    To jump-start your understanding of the FileSystemObject object and how to use
    it, let''s begin with an example, a VBScript is created that uses the FileSystemObject
    object to retrieve and display the properties associated with a file named Sample.txt.
    The script begins by instantiating the FileSystemObject object and associating
    it with a variable named objFso. Next, the FileSystemObject object''s GetFile()
    method retrieves a reference to the File that specifically refers to Sample.txt,
    which is located in the C:\Temp folder.


    The main processing of the script makes a series of procedure calls. The CreateDisplayString()
    function uses several File object properties to collect information about the
    Sample.txt file. The two functions display the information that has been collected
    about the file and terminate the script''s execution.


    ```

    ************************************************************************************

    ''Script Name: ExtractFileProperties.vbs

    ''Author'': Jerry Ford

    ''Created: 02/10/14

    ''Description: This script demonstrates how to retrieve file information

    ************************************************************************************

    ```


    Initialization Section

    Option Explicit'
