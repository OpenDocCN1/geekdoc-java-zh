  md: '# Chapter 10 • Using the Windows Registry to Configure Script Settings


    # Creating the Setup Script


    First, you''ll create a VBScript HangmanSetup.vbs. This script will create and
    store a Registry key called Hangman in the HKEY_CURRENT_USER key (referred to
    in the script as HKCU). Within this key, a value called ListLocation will be created
    and assigned a string identifying the location where you plan to store your Hangman
    words. The HangmanSetup.vbs script will be developed in three steps.


    +   1. Create a new script, adding your VBScript template and defining the variables
    and objects used by this VBScript.

    2. Set up the controlling logic in the Main Processing Section, first prompting
    for confirmation before continuing, and then calling the procedure that creates
    the Registry key and value.

    3. Set up the Procedure Section by adding the SetHangmanKeyKeyValue() function,
    which performs the actual modification of the Registry.


    # Defining Variables and Objects


    By now, this script will be very familiar to you. Begin by copying over your VBScript
    template and filling in information about the new script.


    ''Initialization Section


    Option Explicit


    Next, define the variables and objects required by the script. As you can see
    here, this is a very simple script, with only a few items to be defined:


    ```

    Dim objWshShl, intResponse

    Set objWshShl = WScript.CreateObject("WScript.Shell")

    ```


    The first variable represents the WshShell object, and the second variable stores
    the user''s response asked whether he wants to make the Registry change.


    # Get Confirmation First


    The Main Processing Section prompts the user for confirmation and then tests the
    results returned by the InputBox() function before proceeding. If the value returned
    is equal to 6, then the user elected to continue. Otherwise, the WScript object''s
    Quit() method terminates script execution.'
