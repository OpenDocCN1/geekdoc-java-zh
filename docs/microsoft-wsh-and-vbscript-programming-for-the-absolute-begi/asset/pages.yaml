    \n**Figure 5.7** The results of a typical game of the new version of RockPaperScissors.vbs.\
    \ © 2014 Cengage Learning.\n\n# The Select Case Statement\n\nThe If statement\
    \ provides a great tool for testing two expressions. Using Else, you can modify\
    \ the If statement to perform additional tests. VBScript supplies another, Select\
    \ Case, that also lets you perform comparative operations. Functionally, it's\
    \ not very different from the If statement. However, the Select Case statement\
    \ is better equipped to perform large numbers of tests against a single expression.\n\
    \nHere is the syntax of the Select Case statement:\n\n```\nSelect Case expression\n\
    Case value\n    statements\n\n\n\n```\n\n```\nCase value\n    statements\nCase\
    \ Else\n    statements\nEnd Select\n```\n\nThe Select Case statement begins with\
    \ Select Case. Then it specifies the expression to be compared against one or\
    \ more values in Select statements that follow the Select Case statement and precede\
    \ the End statement. Optionally, a Case Else statement can be added to provide\
    \ an alternative course of action should none of the Case statements' matches\
    \ up against the expression specified by the Select Case statement.\n\nTo demonstrate\
    \ how to work with the Select Case statement, I have rewritten most of the logic\
    \ implemented in the RockPaperScissors.vbs script. As the following complete script\
