  md: '# Chapter 7 • Using Procedures to Organize Scripts


    As written, this function performs the exact same operation as the subroutine
    you saw previously. This function can be called from anywhere in your script using
    the following statement:


    DisplaySplashScreen()


    As with subroutines, you may pass any number of arguments to your functions, as
    long as commas separate the arguments, like this:


    ```

    Function DisplaySplashScreen(strMessage)

    MsgBox strMessage, 4144, "Test Game"

    End Function

    ```


    Once again, this function is no different from the corresponding subroutine you
    just saw, and can be called as follows:


    ```

    DisplaySplashScreen("Thank you for playing the game. © Jerry Ford " &_

    "2014." & vbCrLf & vbCrLf & "Please play again soon.")

    ```


    Functions can also be set to return to their calling statement. This is achieved
    by creating a variable within the function that has the same name as the function,
    and by setting the variable equal to the result that you want the function to
    return.


    Again, this technique can be demonstrated with one example:


    ```

    strPlayersName = GetPlayersName()

    MsgBox "Greetings " & strPlayersName

    ```


    ```

    Function GetPlayersName()

    GetPlayersName = InputBox("What is your first name")

    End Function

    ```


    The first statement calls a function GetPlayersName(). The second statement displays
    the results returned by the function and stored in the variable PlayersName. The
    next three lines are the actual function, which consists of a single statement
    that collects the player''s name and assigns it to a variable named GetPlayersName
    so that it can be passed back to the calling statement.


    Another way to call a function is to reference it as part of another VScript statement,
    like this:


    ```

    MsgBox "Greeting " & GetPlayersName()

    ```


    # Improving Script Manageability


    As I said, by organizing your VBScripts into procedures, you make them more manageable,
    allowing you to create larger and more complex scripts without adding orders of
    complexity. As an example, you''re developing a game that performs the following
    five major activities:


    +   * It initializes variables, constants, and objects used by the script.


    +   * It asks the player whether he wants to play the game.'
