  md: '![](img/337e6368245d3aad07236ff6d4dacf23_431_0.png)


    # The WSH Core Object Model


    The WSH core object model provides programmatic access to Windows resources. There
    are 14 objects in the WSH core object model, as depicted in Figure C.1. Each of
    these objects provides access to a particular category of Windows resources.


    | WScript | | | | |

    |---|---|---|---|---|---|---|-|

    | WshArguments | WshController | WshShell | WshNetwork | | | | |

    | WshNamed | WshUnnamed | WshRemote | WshShortcut | WshEnvironment | WshURLShortcut
    | WshSpecialFolders | WshScriptExec |


    Figure C.1 The WSH core object model consists of 14 objects, all of which have
    properties and methods that expose various parts of the Windows operating system.
    © 2014 Cengage Learning.


    At the top, root, of the WSH core object model is the WScript object. All other
    objects are instantiated from this object. The WScript object is automatically
    established during the startup of the execution host and can therefore be referenced
    without first instantiated within your scripts. The WScript object is referred
    to as a public or exposed object. The WSH core object model has three other public
    objects: WshController, WshShell, and WshNetwork. Each of these three objects
    must be instantiated within your scripts using the WScript object''s CreateObject()
    method. All the other objects in the WSH core object model can only be instantiated
    using properties or methods associated with the WScript, WshController, WshShell,
    and WshNetwork.'
