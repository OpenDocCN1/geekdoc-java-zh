  md: '# Chapter 14 • Adding a GUI to Your Scripts 365


    # Adding a Drop-Down List Box


    Another control that is commonly used is the drop-down list box. This control
    is also formulated using the select and option tags. Drop-down list boxes are
    space savers, allowing a lot of items to be displayed on demand, in a list that
    down, without requiring all the space that a list control would otherwise need
    to display the same elements. The drop-down list box is formulated exactly like
    the list box except that the size attribute is set to 1. (Set it to anything higher,
    and you get a list box.)


    The following example converts the list box presented earlier into a drop-down
    list box:


    ```

    <p>

    <label>T-shirt Size Options:</label>

    <select size="1" name="PickSize" onChange="ShowResult">

    <option value="Small">Pick your size</option>

    <option value="Medium">Medium</option>

    <option value="Large">Large</option>

    <option value="X-Large">X-Large</option>

    </select>

    </p>

    ```


    Note the inclusion of an extra set of <option> </option> tags immediately following
    the opening <select> tag. Absent this item, the item that would otherwise appear
    first in the drop-down list box control is automatically made the default selection.
    By configuring the control with this extra item, you can programmatically determine
    whether the user has actually made a selection, as demonstrated when the control
    triggers the execution of the ShowResult subroutine:


    ```

    Sub ShowResult

    ```


    Figure 14.17 shows how the drop-down list box looks on a computer running Windows
    7 when initially selected by the user.


    ![](img/337e6368245d3aad07236ff6d4dacf23_385_0.png)


    Figure 14.17 No action is taken until the user makes a valid selection from the
    list. © 2014 Cengage Learning.'
