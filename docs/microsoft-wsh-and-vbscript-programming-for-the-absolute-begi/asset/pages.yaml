    # The VBScript MsgBox() Function


    The VBScript MsgBox() displays a pop-up dialog box that is very similar to the
    pop-up dialog box produced by the WSH Popup() method. It gives you the ability
    to customize the appearance of the dialog box by selecting the buttons and the
    icon to be displayed. You can also use it to determine which button the user clicked.


    The syntax for the MsgBox() function is as follows:


    ```

    MsgBox(TextMsg, buttons[, TitleBarMsg], helpfile, context)

    ```


    TextMsg is the message to be displayed in the dialog box. buttons is a representation
    of the buttons and icons to appear on the pop-up dialog box. TitleBarMsg is an
    optional message that will be displayed in the pop-up dialog box''s title bar.
    helpfile and context are optional; when used, they specify the location of an
    optional context-sensitive help box.


