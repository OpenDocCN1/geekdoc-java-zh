  md: '# Microsoft WSH and VBScript Programming for the Absolute Beginner, Fourth
    Edition


    | TABLE 3.1 VBSCRIPT STATEMENTS (CONTINUED) |

    | Statement | Description |

    | --- | --- |

    | ExecuteGlobal | Executes a specified statement in a script''s global namespace
    |

    | Exit | Ends a loop, subroutine, or function |

    | For Each...Next | Processes all the elements in an array or collection |

    | For...Next | Repeats a collection of one or more statements a specified number
    of times |

    | Function | Defines a function and its associated arguments |

    | If...Then...Else | Executes one or more statements depending on the value of
    a tested condition |

    | On Error | Enables error handling |

    | Option Explicit | Forces explicit variable declaration |

    | Private | Defines a private variable |

    | Property Get | Defines a property name and its arguments and returns its value
    |

    | Property Let | Defines a procedure''s name, its arguments, and code that allows
    the assignment of a property''s value |

    | Property Set | Defines a procedure''s name, its arguments, and code that allows
    the assignment of a property as a reference to an object |

    | Public | Defines a public variable |

    | Randomize | Initializes VBScript''s random-number generator |

    | ReDim | Defines or redefines the dimension of an array |

    | Rem | A comment statement |

    | Select Case | Defines a group of tests, of which only one will execute if a
    matching condition is found |

    | Set | Sets up a variable reference to an object |

    | Sub | Defines a subroutine and its arguments |

    | While...Wend | Executes one or more statements as long as the specified condition
    is True |

    | With | Associates one or more statements that are to be executed for a specified
    object |


    © Jerry Lee, Jr. All Rights Reserved.


    # VBScript Syntax Rules


    To properly apply the programming statements that make up the VBScript programming
    language, you must have an understanding of the syntax rules that govern these
    statements. Each VBScript statement has its own particular syntax.'
