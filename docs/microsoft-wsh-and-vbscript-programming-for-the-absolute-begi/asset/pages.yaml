    # The Do...While Statement


    The Do...While statement creates a loop that runs as long as a specified condition
    is true. VBScript supports two different versions of the Do...While loop. The
    syntax for the first version of the Do...While loop is as follows:


    ```

    Do While condition

    statements

    Loop

    ```


    condition is expressed in the form of an expression, like this:


    ```

    intCounter = 0

    Do While intCounter < 10

    intCounter = intCounter + 2

    Loop

    ```


    In this example, the expression (intCounter < 10) allows the loop to continue
    as long as the value of intCounter is less than 10. The value of intCounter is
    initially set to 0, but is increased by 2 every time the loop executes. As a result,
    the loop iterates five times.


    As the While keyword has been placed at the beginning of the loop, the loop will
    not execute if the value of counter is already 10 or greater.


    The syntax for the second format of the Do...While statement is as follows:


    ```

    Do

    statements

    Loop While condition

    ```


    As you can see, the While keyword has been moved from the beginning to the end
    of the loop. Therefore, the loop will always execute at least once, even if the
    condition is false.


