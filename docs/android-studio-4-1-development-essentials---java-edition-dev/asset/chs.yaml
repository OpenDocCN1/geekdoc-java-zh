  \ 67-1 所示。\n\n## 67.9 总结\n\nAndroid `TableLayout` 容器视图提供了一种以行和列配置排列视图组件的方法。虽然 `TableLayout`\
  \ 视图提供了整体容器，但每一行及其包含的单元格都是通过 `TableRow` 视图的实例实现的。在本章中，在 Android Studio 中使用 `TableLayout`\
  \ 和 `TableRow` 容器设计了一个用户界面。下一章将为此用户界面添加功能，使用仓库（repository）和 Room 持久库来实现 SQLite 数据库功能。\n\
  \n## 68. Android Room 数据库和仓库教程\n\n本章将把“Android Room 持久化库”章节中获得的知识与上一章创建的初始项目相结合，提供一个详细的教程，演示如何使用\
  \ Room 持久库实现基于 SQLite 的数据库存储。遵循 Android 架构指南，该项目将使用视图模型（view model）和仓库。教程将利用“Android\
  \ Room 持久化库”中涵盖的所有元素，包括实体（entities）、数据访问对象（DAO）、Room 数据库和异步数据库查询。\n\n### 68.1 关于\
  \ RoomDemo 项目\n\n上一章创建的用户界面布局是创建一个简易库存应用的第一步，该应用旨在存储产品的名称和数量。完成后，应用将提供添加、删除和搜索数据库条目的功能，同时显示当前存储在数据库中的所有产品的滚动列表。当数据库条目被添加或删除时，此产品列表将自动更新。\n\
  \n### 68.2 修改构建配置\n\n启动 Android Studio 并打开上一章开始的 `RoomDemo` 项目。在向项目添加任何新类之前，第一步是向构建配置添加一些额外的库，包括\
  \ Room 持久库。找到并编辑模块级 `build.gradle` 文件（`app -> Gradle Scripts -> build.gradle (Module:\
  \ RoomDemo.app)`）并进行如下修改：\n\n```gradle\ndependencies {\n    .\n    .\n    implementation\
  \ \"androidx.recyclerview:recyclerview:1.1.0\"\n    implementation \"androidx.room:room-runtime:2.2.5\"\
  \n    implementation \"androidx.fragment:fragment-ktx:1.2.5\"\n    annotationProcessor\
  \ \"androidx.room:room-compiler:2.2.5\"\n    .\n    .\n}\n```\n\n## 68.3 构建实体\n\n\
  该项目将从创建实体开始，实体定义了数据库表的结构。该实体将包含一个用于产品 ID 的整数、一个存储产品名称的字符串列以及另一个存储数量的整数值。`productid`\
  \ 列将作为主键并自动生成。表 68-3 总结了实体的结构：\n\n| 列 | 数据类型 |\n| :--- | :--- |\n| productid | Integer\
  \ / Primary Key / Auto Increment |\n| productname | String |\n| productquantity\
  \ | Integer |\n\n表 68-3\n\n通过右键点击项目（Project）工具窗口中的 `app -> java -> com.ebookfrenzy.roomdemo`\
  \ 条目并选择 `New -> Java Class` 菜单选项，为实体添加一个类文件。在新类对话框中，将类命名为 `Product` 并点击 OK 按钮生成文件。\n\
  \n当 `Product.java` 文件在编辑器中打开时，对其进行修改使其内容如下：\n\n```java\npackage com.ebookfrenzy.roomdemo;\n\
  \npublic class Product {\n    private int id;\n    private String name;\n    private\
  \ int quantity;\n\n    public Product(String name, int quantity) {\n        this.id\
  \ = id;\n        this.name = name;\n        this.quantity = quantity;\n    }\n\n\
  \    public int getId() {\n        return this.id;\n    }\n\n    public String getName()\
  \ {\n        return this.name;\n    }\n\n    public int getQuantity() {\n      \
  \  return this.quantity;\n    }\n\n    public void setId(int id) {\n        this.id\
  \ = id;\n    }\n\n    public void setName(String name) {\n        this.name = name;\n\
  \    }\n\n    public void setQuantity(int quantity) {\n        this.quantity = quantity;\n\
  \    }\n}\n```\n\n该类现在有了数据库表列的变量以及匹配的 getter 和 setter 方法。当然，在该类被注解之前，它成为实体。在编辑器中保持该类文件打开的情况下，添加注解和相应的导入语句：\n\
  \n```java\npackage com.ebookfrenzy.roomdemo;\n\nimport androidx.annotation.NonNull;\n\
  import androidx.room.ColumnInfo;\nimport androidx.room.Entity;\nimport androidx.room.PrimaryKey;\n\
  \n@Entity(tableName = \"products\")\npublic class Product {\n    @PrimaryKey(autoGenerate\
  \ = true)\n    @ColumnInfo(name = \"productId\")\n    private int id;\n    @ColumnInfo(name\
  \ = \"productName\")\n    private String name;\n\n    private int quantity;\n  \
  \  .\n    .\n}\n```\n\n这些注解声明此实体为名为 `products` 的表的实体，并为 `id` 和 `name` 分配了列名。`id`\
  \ 列也被配置为主键并自动生成。由于主键永远不能为空，因此应用了 `@NonNull` 注解。由于不需要引用 `quantity` 列，因此没有分配列名。\n\n\
  ## 68.4 创建数据访问对象\n\n定义好产品实体后，下一步是创建 DAO。再次参考项目（Project）工具窗口，右键点击 `app -> java ->\
  \ com.ebookfrenzy.roomdemo` 条目并选择 `New -> Java Class` 。在新类对话框中，在 Name 字段中输入 `ProductDao`\
  \ 并从列表中选择 `Interface`，如图 68-1 所示：\n\n![](img/as_4.1_room_demo_new_interface.jpg)\n\
  \n图 68-1\n\n点击 OK 生成新接口，并在 `ProductDao.java` 文件加载到代码编辑器后，进行以下更改：\n\n```java\npackage\
  \ com.ebookfrenzy.roomdemo;\n\nimport androidx.lifecycle.LiveData;\nimport androidx.room.Dao;\n\
  import androidx.room.Insert;\nimport androidx.room.Query;\nimport java.util.List;\n\
  \n@Dao\npublic interface ProductDao {\n    @Insert\n    void insertProduct(Product\
  \ product);\n\n    @Query(\"SELECT * FROM products WHERE productName = :name\")\n\
  \    List<Product> findProduct(String name);\n\n    @Query(\"DELETE FROM products\
  \ WHERE productName = :name\")\n    void deleteProduct(String name);\n\n    @Query(\"\
  SELECT * FROM products\")\n    LiveData<List<Product>> getAllProducts();\n}\n```\n\
  \nDAO 实现了从 products 数据库插入、查找和删除记录的方法。插入方法接收一个包含要存储数据的 `Product` 实体对象，而查找和删除记录的方法接收一个包含要操作产品名称的字符串。`getAllProducts()`\
  \ 方法返回一个包含数据库中所有记录的 `LiveData` 对象。此方法将用于保持用用用户界面中 `RecyclerView` 产品列表与数据库的同步。\n\n\
  ## 68.5 添加 Room 数据库\n\n在将仓库添加到项目之前的最后一个任务是实现 Room 数据库实例。向项目添加一个名为 `ProductRoomDatabase`\
  \ 的新类，这次选择 Class 选项。\n\n\n\n\n文件生成后，请按照“Android Room Persistence Library”章节中列出的步骤对其进行修改：\n\
  \n```java\npackage com.ebookfrenzy.roomdemo;\n\nimport android.content.Context;\n\
  \nimport androidx.room.Database;\n\nimport androidx.room.Room;\n\nimport androidx.room.RoomDatabase;\n\
  \n@Database(entities = {Product.class}, version = 1)\npublic abstract class ProductRoomDatabase\
  \ extends RoomDatabase {\n\n    public abstract ProductDao productDao();\n\n   \
  \ private static ProductRoomDatabase INSTANCE;\n\n    static ProductRoomDatabase\
  \ getDatabase(final Context context) {\n        if (INSTANCE == null) {\n      \
  \      synchronized (ProductRoomDatabase.class) {\n                if (INSTANCE\
  \ == null) {\n                    INSTANCE =\n                        Room.databaseBuilder(context.getApplicationContext(),\n\
  \                                            ProductRoomDatabase.class,\n      \
  \                                      \"product_database\").build();\n        \
  \        }\n            }\n        }\n        return INSTANCE;\n    }\n}\n```\n\n\
  ## 68.6 添加仓库 (Repository)\n\n向项目中添加名为 `ProductRepository` 的新类，并选择 `Class` 选项。\n\n\
  仓库类将负责代表 `ViewModel` 与 `Room` 数据库进行交互，并需要提供使用 `DAO` 插入、删除和查询产品记录的方法。除了 `getAllProducts()`\
  \ DAO 方法（返回一个 `LiveData` 对象）外，这些数据库操作都需要使用 `AsyncTask` 类在主线程之外的独立线程中执行。\n\n在 `ProductRepository.java`\
  \ 文件中，添加用于搜索的 `AsyncTask` 代码。同时添加一个名为 `asyncFinished()` 的方法，该方法将由查询 `AsyncTask`\
  \ 调用，以便将搜索结果返回给仓库线程：\n\n```java\npackage com.ebookfrenzy.roomdemo;\n\nimport android.os.AsyncTask;\n\
  \nimport androidx.lifecycle.MutableLiveData;\n\nimport java.util.List;\n\npublic\
  \ class ProductRepository {\n\n    private final MutableLiveData<List<Product>>\
  \ searchResults =\n            new MutableLiveData<>();\n\n    private void asyncFinished(List<Product>\
  \ results) {\n        searchResults.setValue(results);\n    }\n\n    private static\
  \ class QueryAsyncTask extends\n            AsyncTask<String, Void, List<Product>>\
  \ {\n\n        private final ProductDao asyncTaskDao;\n        private ProductRepository\
  \ delegate = null;\n\n        QueryAsyncTask(ProductDao dao) {\n            asyncTaskDao\
  \ = dao;\n        }\n\n        @Override\n        protected List<Product> doInBackground(final\
  \ String... params) {\n            return asyncTaskDao.findProduct(params[0]);\n\
  \        }\n\n        @Override\n        protected void onPostExecute(List<Product>\
  \ result) {\n            delegate.asyncFinished(result);\n        }\n    }\n}\n\
  ```\n\n上述代码声明了一个名为 `searchResults` 的 `MutableLiveData` 变量，当异步搜索任务完成时，搜索结果将存储其中（在教程稍后的部分，`ViewModel`\
  \ 内部的观察者将监控此实时数据对象）。\n\n`AsyncTask` 类包含一个构造方法，必须从中传入 `DAO` 对象的引用。`doInBackground()`\
  \ 方法接收一个包含产品名称的 `String` 用于执行搜索，将其传递给 DAO 的 `findProduct()` 方法，并返回匹配的 `Product`\
  \ 实体对象列表，该列表会被传递给 `onPostExecute()` 方法。最后，`onPostExecute()` 方法将匹配的产品列表存储在 `searchResults`\
  \ `MutableLiveData` 对象中。\n\n仓库还需要包含以下用于向数据库插入产品的 `AsyncTask` 实现：\n\n```java\nprivate\
  \ static class InsertAsyncTask extends AsyncTask<Product, Void, Void> {\n    private\
  \ final ProductDao asyncTaskDao;\n\n    InsertAsyncTask(ProductDao dao) {\n    \
  \    asyncTaskDao = dao;\n    }\n\n    @Override\n    protected Void doInBackground(final\
  \ Product... params) {\n        // 实现逻辑\n        return null; \n    }\n}\n```\n\n\
  在插入和删除的情况下，相应的 `AsyncTask` 实例将被创建并传递必要的参数。在 `findProduct()` 方法的情况下，该类的 `delegate`\
  \ 属性被设置为仓库实例，以便在搜索完成后调用 `asyncFinished()`。从数据库中删除产品的剩余 `AsyncTask` 应如下所示添加：\n\n\
  ```java\nprivate static class DeleteAsyncTask extends AsyncTask<String, Void, Void>\
  \ {\n    private final ProductDao asyncTaskDao;\n\n    DeleteAsyncTask(ProductDao\
  \ dao) {\n        asyncTaskDao = dao;\n    }\n\n    @Override\n    protected Void\
  \ doInBackground(final String... params) {\n        asyncTaskDao.delete(params[0]);\n\
  \        return null;\n    }\n}\n```\n\n有了 `AsyncTask` 类定义，仓库现在需要提供可以由 `ViewModel`\
  \ 用的方法。这些方法将创建 `AsyncTask` 实例并传递 `DAO`。为了这样做，仓库需要通过 `ProductRoomDatabase` 实例获取 `DAO`。为\
  \ `ProductRepository` 添加构造函数：\n\n```java\nimport android.app.Application;\n\npublic\
  \ class ProductRepository {\n    private final MutableLiveData<List<Product>> searchResults\
  \ = new MutableLiveData<>();\n    private final ProductDao productDao;\n\n    public\
  \ ProductRepository(Application application) {\n        ProductRoomDatabase db =\
  \ ProductRoomDatabase.getDatabase(application);\n        productDao = db.productDao();\n\
  \    }\n}\n```\n\n完成仓库类还有最后一个任务。用户界面布局中的 `RecyclerView` 需要能够更新数据库中存储的产品列表。`ProductDAO`\
  \ 类已经包含 `getAllProducts()` 方法，它使用 SQL 查询所有记录并封装在 `LiveData` 对象中。仓库需要在初始化调用此方法并将结果存储在\
  \ `LiveData` 对象中，该对象可以被 `ViewModel` 以及 UI 控制器观察。一旦设置完成，每当数据库表发生变化时，UI 控制器观察者都会收到通知，`RecyclerView`\
  \ 就可以用最新的产品列表进行更新。在 `ProductRepository.java` 文件中，在构造函数中添加 `LiveData` 变量并调用 DAO 的\
  \ `getAllProducts()` 方法：\n\n```java\nimport androidx.lifecycle.LiveData;\n\npublic\
  \ class ProductRepository {\n    private final MutableLiveData<List<Product>> searchResults\
  \ = new MutableLiveData<>();\n    private final LiveData<List<Product>> allProducts;\n\
  \    private final ProductDao productDao;\n\n    public ProductRepository(Application\
  \ application) {\n        ProductRoomDatabase db = ProductRoomDatabase.getDatabase(application);\n\
  \        productDao = db.productDao();\n        allProducts = productDao.getAllProducts();\n\
  \    }\n}\n```\n\n存储了 `DAO` 引用后，方法已准备好添加到类中：\n\n```java\npublic void insertProduct(Product\
  \ newproduct) {\n    InsertAsyncTask task = new InsertAsyncTask(productDao);\n \
  \   task.execute(newproduct);\n}\n\npublic void deleteProduct(String name) {\n \
  \   DeleteAsyncTask task = new DeleteAsyncTask(productDao);\n    task.execute(name);\n\
  }\n\npublic void findProduct(String name) {\n    QueryAsyncTask task = new QueryAsyncTask(productDao);\n\
  \    task.delegate = this;\n    task.execute(name);\n}\n```\n\n\n\n\n```java\nProductRoomDatabase\
  \ db;\n\ndb = ProductRoomDatabase.getDatabase(application);\n\nproductDao = db.productDao();\n\
  \nallProducts = productDao.getAllProducts();\n\n}\n\n.\n\n}\n```\n\n为了完成仓库（repository），请添加\
  \ `ViewModel` 可以调用的方法，以获取 `allProducts` 和 `searchResults` live 对象的引用：\n\n```java\n\
  public LiveData<List<Product>> getAllProducts() {\n    return allProducts;\n}\n\n\
  public MutableLiveData<List<Product>> getSearchResults() {\n    return searchResults;\n\
  }\n```\n\n## 68.7 修改 ViewModel\n\n`ViewModel` 负责创建仓库的实例，并提供可供 UI 控制器使用的方法和 `LiveData`\
  \ 对象，以保持用户界面与底层数据库的同步。在 `ProductRepository.java` 的实现中，仓库的构造函数需要访问应用上下文（application\
  \ context）以便获取 Room 数据库实例。为了让 `ViewModel` 内部可以访问应用上下文并将其传递给 `repository`，`ViewModel`\
  \ 需要继承 `AndroidViewModel` 而不是 `ViewModel`。因此，请从编辑 `MainViewModel.java` 文件（位于 Project\
  \ 工具窗口的 `app -> java -> com.ebookfrenzy.roomdemo -> ui.main` 下）开始，将类改为扩展 `AndroidViewModel`\
  \ 并实现构造函数：\n\n```java\npackage com.ebookfrenzy.roomdemo.ui.main;\n\nimport android.app.Application;\n\
  import androidx.lifecycle.AndroidViewModel;\nimport androidx.lifecycle.LiveData;\n\
  import androidx.lifecycle.MutableLiveData;\nimport com.ebookfrenzy.roomdemo.Product;\n\
  import com.ebookfrenzy.roomdemo.ProductRepository;\nimport java.util.List;\nimport\
  \ androidx.lifecycle.ViewModel;\n\npublic class MainViewModel extends AndroidViewModel\n\
  {\n    private ProductRepository repository;\n    private LiveData<List<Product>>\
  \ allProducts;\n    private MutableLiveData<List<Product>> searchResults;\n\n  \
  \  public MainViewModel (Application application) {\n        super(application);\n\
  \        repository = new ProductRepository(application);\n        allProducts =\
  \ repository.getAllProducts();\n        searchResults = repository.getSearchResults();\n\
  \    }\n}\n```\n\n构造函数本质上创建了一个仓库实例，然后使用它获取结果和 live data 对象的引用，以便 UI 控制器可以观察它们。现在\
  \ `ViewModel` 中剩下的工作是实现由 UI 控制器内部在响应按钮点击以及在 `LiveData` 对象上设置观察者时调用的方法：\n\n```java\n\
  MutableLiveData<List<Product>> getSearchResults() {\n    return searchResults;\n\
  }\n\nLiveData<List<Product>> getAllProducts() {\n    return allProducts;\n}\n\n\
  public void insertProduct(Product product) {\n    repository.insertProduct(product);\n\
  }\n\npublic void findProduct(String name) {\n    repository.findProduct(name);\n\
  }\n\npublic void deleteProduct(String name) {\n    repository.deleteProduct(name);\n\
  }\n```\n\n## 68.8 创建产品项布局\n\n数据库中每种产品的名称将显示在主用户界面的 `RecyclerView` 列表中。这需要一个包含 `TextView`\
  \ 的布局资源文件，用于列表中的每一行。现在，通过在 Project 工具窗口右键点击 `app -> res -> layout` 项并选择 `New ->\
  \ Layout resource file` 菜单选项添加此文件。将文件命名为 `product_list_item`，并在点击 OK 创建文件并将其加载到布局编辑器之前，将根元素更改为\
  \ `LinearLayout`。在布局编辑器处于 Design 模式时，从调色板将 `TextView` 对象拖到布局中，它将默认显示在布局的顶部：\n\n\
  ![](img/as_3.5_roomdemo_item_layout.jpg)\n\n图 68-2\n\n在布局中选中 `TextView` 后，使用 Attributes\
  \ 工具窗口将该视图的 `ID` 设置为 `product_row`，并将 `layout_height` 设置为 `30dp`。在 Component Tree\
  \ 窗口中选择 `LinearLayout` 项，并将 `layout_height` 属性设置为 `wrap_content`。\n\n## 68.9 添加\
  \ RecyclerView 适配器\n\n正如名为“使用 RecyclerView 和 CardView 组件”的章节详细概述的那样，`RecyclerView`\
  \ 实例需要一个适配器类来提供要显示的数据。现在通过在 Project 工具窗口右键点击 `app -> java -> com.ebookfrenzy.roomdemo\
  \ -> ui.main` 项并选择 `New -> Java Class...` 来添加此类。在对话框中，将类命名为 `ProductListAdapter`。将生成的\
  \ `ProductListAdapter.java` 类加载到编辑器后，按如下方式实现该类：\n\n```java\npackage com.ebookfrenzy.roomdemo.ui.main;\n\
  \nimport android.view.LayoutInflater;\nimport android.view.View;\nimport android.view.ViewGroup;\n\
  import android.widget.TextView;\nimport com.ebookfrenzy.roomdemo.R;\nimport androidx.recyclerview.widget.RecyclerView;\n\
  import androidx.annotation.NonNull;\nimport com.ebookfrenzy.roomdemo.Product;\n\
  import java.util.List;\n\npublic class ProductListAdapter extends RecyclerView.Adapter<ProductListAdapter.ViewHolder>\
  \ {\n    private int itemLayout;\n    private List<Product> productList;\n\n   \
  \ public ProductListAdapter(int layoutId) {\n        ItemLayout = layoutId;\n  \
  \  }\n\n    public void setList(List<Product> products) {\n        productList =\
  \ products;\n        notifyDataSetChanged();\n    }\n\n    @Override\n    public\
  \ int getItemCount() {\n        return productList == null ? 0 : productList.size();\n\
  \    }\n\n    @NonNull\n    @Override\n    public ViewHolder onCreateViewHolder(ViewGroup\
  \ parent, int viewType) {\n        View view = LayoutInflater.from(parent.getContext()).inflate(ItemLayout,\
  \ parent, false);\n        return new ViewHolder(view);\n    }\n\n    @Override\n\
  \    public void onBindViewHolder(final ViewHolder holder, final int listPosition)\
  \ {\n        TextView item = holder.item;\n        item.setText(productList.get(listPosition).getName());\n\
  \    }\n\n    static class ViewHolder extends RecyclerView.ViewHolder {\n      \
  \  TextView item;\n        ViewHolder(View itemView) {\n            super(itemView);\n\
  \            item = itemView.findViewById(R.id.product_row);\n        }\n    }\n\
  }\n```\n\n## 68.10 准备主 Fragment\n\n最后一个需要修改的组件是 `MainFragment` 类，它需要在 Button 视图上配置监听器，并在\
  \ `ViewModel` 类中的 live data 对象上配置观察者。在添加这些代码之前，需要进行一些准备工作，添加一些导入、变量并获取视图 ID 的引用。编辑\
  \ `MainFragment.java` 文件并进行如下修改：\n\n```java\nimport android.widget.EditText;\nimport\
  \ android.widget.TextView;\nimport com.ebookfrenzy.roomdemo.ProductListAdapter;\n\
  \npublic class MainFragment extends Fragment {\n    private MainViewModel mViewModel;\n\
  \    private ProductListAdapter adapter;\n    private TextView productId;\n    private\
  \ EditText productName;\n    private EditText productQuantity;\n\n    @Override\n\
  \    public void onActivityCreated(@Nullable Bundle savedInstanceState) {\n    \
  \    super.onActivityCreated(savedInstanceState);\n        mViewModel = new ViewModelProvider(this).get(MainViewModel.class);\n\
  \        productId = getView().findViewById(R.id.productID);\n        productName\
  \ = getView().findViewById(R.id.productName);\n        productQuantity = getView().findViewById(R.id.productQuantity);\n\
  \        listenerSetup();\n        observerSetup();\n        recyclerSetup();\n\
  \    }\n}\n```\n\n在代码的不同阶段，应用程序需要清除用户界面中显示的的产品信息。为了避免代码重复，添加以下 `clearFields()` 方便函数：\n\
  \n```java\nprivate void clearFields() {\n    productId.setText(\"\");\n    productName.setText(\"\
  \");\n    productQuantity.setText(\"\");\n}\n```\n\n在构建和测试应用程序之前，需要向类中添加上述 `onActivityCreated()`\
  \ 方法调用的三个设置方法。\n\n\n\n\n\n## 68.11 添加按钮监听器\n\n主 fragment 的界面布局包含三个按钮，每个按钮在用户点击时都需要执行一个特定的任务。编辑\
  \ `MainFragment.java` 文件并添加 `listenerSetup()` 方法：\n\n```java\nimport android.widget.Button;\n\
  import com.ebookfrenzy.roomdemo.Product;\n\nprivate void listenerSetup() {\n   \
  \ Button addButton = getView().findViewById(R.id.addButton);\n    Button findButton\
  \ = getView().findViewById(R.id.findButton);\n    Button deleteButton = getView().findViewById(R.id.deleteButton);\n\
  \    addButton.setOnClickListener(new View.OnClickListener() {\n        @Override\n\
  \        public void onClick(View view) {\n            String name = productName.getText().toString();\n\
  \            String quantity = productQuantity.getText().toString();\n         \
  \   if (!name.equals(\"\") && !quantity.equals(\"\")) {\n                Product\
  \ product = new Product(name, Integer.parseInt(quantity));\n                mViewModel.insertProduct(product);\n\
  \                clearFields();\n            } else {\n                productId.setText(\"\
  Incomplete information\");\n            }\n        }\n    });\n    findButton.setOnClickListener(new\
  \ View.OnClickListener() {\n        @Override\n        public void onClick(View\
  \ view) {\n            mViewModel.findProduct(productName.getText().toString());\n\
  \        }\n    });\n    deleteButton.setOnClickListener(new View.OnClickListener()\
  \ {\n        @Override\n        public void onClick(View view) {\n            mViewModel.deleteProduct(productName.getText().toString());\n\
  \            clearFields();\n        }\n    });\n}\n```\n\n`addButton` 监听器执行了一些基础验证，以确保用户同时输入了产品名称和数量，并使用这些数据创建一个新的\
  \ `Product` 实体对象（注意：数量字符串被转换为整数以匹配实体的数据类型）。在清空字段之前，调用了 `ViewModel.insertProduct()`\
  \ 方法并传入 `Product` 对象。\n\n`findButton` 和 `deleteButton` 监听器将产品名称传递给 `ViewModel.findProduct()`\
  \ 或 `deleteProduct()` 方法。\n\n## 68.12 添加 LiveData 观察者\n\n现在界面需要添加观察者，以便与 `ViewModel`\
  \ 中的 `searchResults` 和 `allProducts` 数据保持同步。留在 `Mainfragment.java` 文件中，按如下方式实现 `setup`\
  \ 方法：\n\n```java\nimport androidx.lifecycle.Observer;\nimport java.util.List;\n\
  import java.util.Locale;\n\nprivate void setup() {\n    mViewModel.getAllProducts().observe(getViewLifecycleOwner(),\
  \ new Observer<List<Product>>() {\n        @Override\n        public void onChanged(@Nullable\
  \ List<Product> products) {\n            adapter.setList(products);\n        }\n\
  \    });\n    mViewModel.getSearchResults().observe(getViewLifecycleOwner(), new\
  \ Observer<List<Product>>() {\n        @Override\n        public void onChanged(@Nullable\
  \ List<Product> products) {\n            if (products.size() > 0) {\n          \
  \      productId.setText(String.format(Locale.US, \"%d\", products.get(0).getId()));\n\
  \                productName.setText(products.get(0).getName());\n             \
  \   productQuantity.setText(String.format(Locale.US, \"%d\", products.get(0).getQuantity()));\n\
  \            } else {\n                productId.setText(\"No Match\");\n      \
  \      }\n        }\n    });\n}\n```\n\n“所有产品”观察者只是将当前的产品列表传递给 `RecyclerAdapter`\
  \ 的 `setList()` 方法，显示的列表将在那里更新。\n\n“搜索结果”观察者检查数据库中是否至少找到一个匹配的结果，从列表中提取第一个匹配的 `Product`\
  \ 实体对象，从对象中获取数据，需要时进行转换，并赋值给布局中的 `TextView` 和 `EditText` 视图。如果产品搜索失败，将通过显示在产品 ID\
  \ `TextView` 上的消息通知用户。\n\n## 68.13 初始化 RecyclerView\n\n添加最后的设置方法来初始化并配置 `RecyclerView`\
  \ 和 `adapter`，如下：\n\n```java\nimport androidx.recyclerview.widget.LinearLayoutManager;\n\
  import androidx.recyclerview.widget.RecyclerView;\n\nprivate void recyclerSetup()\
  \ {\n    RecyclerView recyclerView = getView().findViewById(R.id.recycler);\n  \
  \  adapter = new ProductListAdapter(R.layout.product_item);\n    recyclerView.setLayoutManager(new\
  \ LinearLayoutManager(getContext()));\n    recyclerView.setAdapter(adapter);\n}\n\
  ```\n\n## 68.14 测试 Room App\n\n在设备或模拟器上编译并运行应用，添加一些产品，并确保它们自动出现在 `RecyclerView`\
  \ 中。对现有产品进行搜索，并验证产品 ID 和数量字段是否更新。最后，输入现有产品的名称，从数据库中删除它，并确认它已从列表中移除。\n\n## 68.15\
  \ 使用数据库检查器\n\n正如之前在“Android 持久化库”中所述，可以使用 `Database Inspector` 工具窗口来检查与运行应用关联的 Room\
  \ 数据库的内容，并进行细微的数据更改。在使用 RoomDemo App 添加一些数据库记录后，使用图 68-3 所示的按钮显示 Database Inspector\
  \ 工具窗口。\n\n从检查器窗口中，从菜单中选择运行的应用。在 Databases 面板中，双击 `products` 表格以查看当前存储在数据库中的表行。启用\
  \ Live updates（实时更新）选项，然后使用运行的应用向数据库添加更多记录。请注意，Database Inspector 会实时更新表数据以反映更改。\n\
  \n关闭 Live updates 以使表不再是只读的，双击表行中的数量单元格并在按下键盘回车键之前更改该值。返回运行的应用并搜索该产品，以确认在检查器中进行的更改已保存到数据库表中。\n\
  \n最后，点击表格查询按钮（如图 68-5 所示的箭头指示）显示一个新的查询标签页，确保选中了 `product_database`，在查询文本字段中输入 SQL\
  \ 语句并点击 Run 按钮。行列表应该会更新以反映 SQL 查询的结果。\n\n## 68.16 总结\n\n本章演示了如何使用 Room 持久化库在 SQLite\
  \ 数据库中存储数据。完成的项目使用了仓库（repository）将 ViewModel 与所有数据库操作分离，并演示了实体、DAO 和 Room 数据库实例的创建，包括在执行某些数据库操作时使用异步任务。\n\
  \n\n\n\n近年来，远程存储服务（也称为“云存储”）被广泛用于存储用户文件和数据。驱动这一增长的因素有两个。其之一是，大多数移动设备现在都提供持续、高速的互联网连接，从而使得数据传输既快速又廉价。第二个因素是，与传统的计算机系统（如台式机和笔记本电脑）相比，这些移动设备在内部存储资源方面受到了限制。例如，今天一个高规格的\
  \ Android 平板通常带有 128Gb 的存储容量。与带有 750Gb 硬盘驱动器的中端笔记本系统相比，对文件进行无缝远程存储已成为许多移动应用的关键需求。\n\
  \n为了应对这一事实，Google 在 `Android 4.4 SDK` 的中引入了 `Storage Access Framework`（存储访问框架）。本章将对存储访问框架进行高层次概述，为下一章中更详细的教程做准备，该章节标题为\
  \ “Android 存储访问框架示例”。\n\n## 69.1 存储访问框架\n\n从用户的角度来看，`Storage Access Framework` 提供了一个直观的用户界面，允许用户在\
  \ Android 内部浏览、选择、删除和创建由存储服务（也称为文档提供者）托管的文件。通过使用此浏览界面（也称为选择器），用户可以浏览他们所选文档提供者托管的文件（如文档、音频、图像和视频）。例如，图\
  \ 69-1 显示了选择器界面展示了由文档提供者服务托管的一系列文件：\n\n![](img/as3.0_storage_demo_picker.jpg)\n\n\
  图 69-1\n\n文档提供者可以从云端服务到与客户端应用程序运行在同一设备上的本地文档提供者不一。在编写本文书时，兼容 `Storage Access Framework`\
  \ 的最著名文档提供者是 `Box` 以及意不而然的 `Google Drive`。很有可能其他云存储提供商和应用程序开发者很快也会提供符合 `Android\
  \ Storage Access Framework` 的服务。\n\n除了云端文档提供者外，选择器还提供了对设备内部存储的访问，为应用程序用户提供一系列文件存储选项。\n\
  \n通过一组 `Intents`，Android 开发者只需几行代码即可将这些存储能力集成到应用程序中。从开发者的角度来看，`Storage Access Framework`\
  \ 的一个特别吸引人的特点是，用户选择的底层文档提供者对应用程序是完全透明的。一旦在应用程序中使用框架实现了存储功能，它将与所有文档提供者一起工作，而无需任何代码修改。\n\
  \n# 69.2 使用存储访问框架\n\nAndroid 包含一组 `Intents`，旨在将 `Storage Access Framework` 的功能集成到\
  \ Android 应用程序中。这些 intent 向用户显示 `Storage Access Framework` 选择器用户界面，并通过调用启动 intent\
  \ 的 activity 的 `onActivityResult()` 方法将交互结果返回给应用程序。当调用 `onActivityResult()` 方法时，它会接收到所选文件的\
  \ `Uri` 以及一个指示操作成功与否的值。\n\n`Storage Access Framework` 的 `intent` 总结如下：\n\n- `ACTION_OPEN_DOCUMENT`\
  \ – 为用户提供访问选择器用户界面的权限，以便从设备上配置的文档提供者中选择文件。所选文件以 `Uri` 对象的的形式传回应用程序。\n- `ACTION_CREATE_DOCUMENT`\
  \ – 允许用户选择文档提供者、该提供者存储上的位置以及一个新文件的文件名。一旦选择完成，文件将由 `Storage Access Framework` 创建，并将该文件的\
  \ `Uri` 返回给应用程序以进行后续处理。\n\n# 69.3 过滤选择器文件列表\n\n当启动 intent 时，选择器用户界面中列出的文件可以使用各种选项进行过滤。例如，考虑以下启动\
  \ `ACTION_OPEN_DOCUMENT` intent 的代码：\n\n```java\nprivate static final int OPEN_REQUEST_CODE\
  \ = 41;\n\nIntent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);\nstartActivityForResult(intent,\
  \ OPEN_REQUEST_CODE);\n```\n\n执行上述代码后，将显示选择器界面，允许用户浏览并选择由可用文档提供者托管的任何文件。一旦用户选择了某个文件，应用程序将以\
  \ `Uri` 对象的形式获得该文件的引用。应用程序可以使用 `openFileDescriptor(Uri, String)` 方法打开文件。然而，存在某种风险，并非所有文档提供者列出的文件都能通过这种方式打开。可以通过使用\
  \ `CATEGORY_OPENABLE` 选项修改 intent 来在选择器中排除此类文件。例如：\n\n```java\nprivate static final\
  \ int OPEN_REQUEST_CODE = 41;\n\nIntent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);\n\
  intent.addCategory(Intent.CATEGORY_OPENABLE);\nstartActivityForResult(intent, OPEN_REQUEST_CODE);\n\
  ```\n\n现在显示选择器时，无法使用 `openFileDescriptor()` 方法打开的文件将被列出，但用户无法选择它们。\n\n另一种实用的过滤方法允许根据文件类型限制可供选择的文件。这涉及指定应用程序能够处理的文件类型。例如，图像编辑应用程序可能只想为用户提供从文档提供者中选择图像文件的选项。这是通过配置\
  \ intent 对象以可供用户选择的文件 `MIME` 类型来实现的。以下代码指定了选择器中仅适用于图像文件：\n\n```java\nintent.addCategory(Intent.CATEGORY_OPENABLE);\n\
  intent.setType(\"image/*\");\nstartActivityForResult(intent, OPEN_REQUEST_CODE);\n\
  ```\n\n这可以进一步限制为 JPEG ：\n\n```java\nintent.setType(\"image/jpeg\");\n```\n\n或者，音频播放器可能只能处理音频文件：\n\
  \n```java\nintent.setType(\"audio/*\");\n```\n\n音频应用可能进一步限制为仅播放 MP4 格式：\n\n```java\n\
  intent.setType(\"audio/mp4\");\n```\n\n在使用 `Storage Access Framework` 时，可以使用广泛的\
  \ `MIME` 类型设置，更常见的可以在网上找到：https://en.wikipedia.org/wiki/Internet_type#List_of_media_types\n\
  \n## 69.4 处理 Intent 结果\n\n当 intent 将控制权返回应用程序时，是通过调用启动 intent 的 activity 的 `onActivityResult()`\
  \ 方法来实现的。该方法接收启动 intent 时传递的请求码、一个指示 intent 是否成功的结果码以及一个包含所选文件 `Uri` 的结果数据对象。例如，以下代码可以作为处理上一节中概述\
  \ `ACTION_OPEN_DOCUMENT` intent 结果的基础：\n\n```java\npublic void onActivityResult(int\
  \ requestCode, int resultCode, Intent resultData) {\n    Uri currentUri = null;\n\
  \    if (resultCode == Activity.RESULT_OK) {\n        if (requestCode == OPEN_REQUEST_CODE)\
  \ {\n            if (resultData != null) {\n                currentUri = resultData.getData();\n\
  \                readFileContent(currentUri);\n            }\n        }\n    }\n\
  }\n```\n\n\n\n上述方法验证了意图（intent）执行成功，检查请求代码是否与打开文件请求的代码匹配，然后从意图数据中提取出 `Uri`。随后可以使用该\
  \ `Uri` 来读取文件的内容。\n\n## 69.5 读取文件内容\n\n读取由文档提供者（document provider）托管的文件内容的具体步骤在很大程度上取决于文件的类型。例如，从文本文件中读取行的步骤与读取图像或音频文件的步骤有所不同。\n\
  \n通过从 `Uri` 对象中提取文件描述符，然后将图像解码为 `BitmapFactory` 实例，可以将图像文件赋值给 `Bitmap` 对象。例如：\n\n\
  ```java\nParcelFileDescriptor pFileDescriptor = getContentResolver().openFileDescriptor(uri,\
  \ \"r\");\nFileDescriptor fileDescriptor = pFileDescriptor.getFileDescriptor();\n\
  Bitmap image = BitmapFactory.decodeFileDescriptor(fileDescriptor);\npFileDescriptor.close();\n\
  myImageView.setImageBitmap(image);\n```\n\n注意，文件描述符是以“r”模式打开的。这表示该文件将用于读取。其他选项还包括用于写入访问的“w”和用于读写访问的“rwt”，其中文件中的现有内容将被新内容截断。\n\
  \n读取文本文件的内容需要稍多的工作并使用 `InputStream` 对象。下面的代码演示了如何从文本文件中读取行：\n\n```java\nInputStream\
  \ inputStream = getContentResolver().openInputStream(uri);\nBufferedReader reader\
  \ = new BufferedReader(new InputStreamReader(inputStream));\nString readline;\n\
  while ((readline = reader.readLine()) != null) {\n    // 对文件中的每一行进行某些操作\n}\ninputStream.close();\n\
  ```\n\n## 69.6 向文件写入内容\n\n向由文档提供者托管的打开文件写入内容与读取类似，区别使用的是输出流而不是输入流。例如，以下代码将文本写入指定\
  \ `Uri` 引用的存储基础文件的输出流：\n\n```java\ntry {\n    ParcelFileDescriptor pFileDescriptor\
  \ = this.getContentResolver().openFileDescriptor(uri, \"w\");\n    FileOutputStream\
  \ fileOutputStream = new FileOutputStream(pFileDescriptor.getFileDescriptor());\n\
  \    String textContent = \"Some sample text\";\n    fileOutputStream.write(textContent.getBytes());\n\
  \    fileOutputStream.close();\n    pFileDescriptor.close();\n} catch (FileNotFoundException\
  \ e) {\n    e.printStackTrace();\n} catch (IOException e) {\n    e.printStackTrace();\n\
  }\n```\n\n首先，从 `Uri` 中提取文件描述符，这次请求对目标文件的写入权限。随后使用该文件描述符获取文件输出流的引用。内容（在本例中为某些文本）在关闭文件描述符和输出流之前被写入输出流中。\n\
  \n## 69.7 删除文件\n\n是否可以从存储器中删除文件取决于该文件的文档提供者是否支持删除文件。假设允许删除，可以按照如下方式对指定的 `Uri` 执行删除：\n\
  \n```java\nif (DocumentsContract.deleteDocument(getContentResolver(), uri))\n  \
  \  // 删除成功\nelse\n    // 删除失败\n```\n\n## 69.8 获取对文件的持久访问权限\n\n当应用程序通过存储访问框架（Storage\
  \ Access Framework）获取文件访问时，该访问将一直有效，直到运行该应用程序的 Android 设备重启。通过“获取”（taking）`Uri`\
  \ 所需的权限，可以对特定文件的持久访问。例如，以下代码为 `fileUri` `Uri` 实例引用的文件持久化读取和写入权限：\n\n```java\nfinal\
  \ int takeFlags = intent.getFlags()\n      & (Intent.FLAG_GRANT_READ_URI_PERMISSION\
  \ | Intent.FLAG_GRANT_WRITE_URI_PERMISSION);\ngetContentResolver().takePersistableUriPermission(fileUri,\
  \ takeFlags);\n```\n\n一旦应用程序获取了文件的权限，并且假设 `Uri` 已被应用程序保存，用户应该能够在设备重启后继续访问该文件。如果在任何时候不再需要这些权限，可以通过内容解析器的\
  \ `releasePersistableUriPermission()` 方法释放它们：\n\n```java\nfinal int releaseFlags\
  \ = intent.getFlags()\n      & (Intent.FLAG_GRANT_READ_URI_PERMISSION | Intent.FLAG_GRANT_WRITE_URI_PERMISSION);\n\
  getContentResolver().releasePersistableUriPermission(fileUri, releaseFlags);\n```\n\
  \n## 69.9 总结\n\n思考近几年人们对存储的感知是如何变化的很有意思的。“存储”一词曾是高容量内置硬盘驱动器的同义词，而现在它更多地指的是托管在云端的存储空间。对于资源受限且“始终连接”的移动设备来说，情况日益如此。\n\
  \n存储访问框架为用户和应用程序开发者提供了无缝访问存储在云端文件的机制。通过使用意图和内置的文档提供者选择界面，现在可以在 Android 应用程序中集成全面的云存储。\n\
  \n## 70. 存储访问框架示例\n\n如前所述，存储访问框架极大地简化了将云存储集成到 Android 应用程序的过程中。通过选择器用户界面和一组意图，现在可以在\
  \ Android 应用程序中构建对 Google Drive 或 Box 等文档提供者的文件访问。在前章介绍了存储访问框架的基础知识后，本章将通过创建一个使用存储访问框架来存储和管理的示例应用程序。\n\
  \n## 70.1 关于存储访问框架示例\n\n在本章创建的 Android 应用程序将采取原始文本编辑器的形式，用于创建并将远程存储到云端存储服务。在实践中，该示例适用于兼容存储访问框架的任何云端存储提供者，但本例假设使用\
  \ Google Drive。\n\n## 70.2 创建存储访问框架示例\n\n在欢迎屏幕上选择“New Project”快速启动选项，在弹出的新项目对话框中选择“Empty\
  \ Activity”模板，然后点击 Next 按钮。\n\n在 Name 字段输入 StorageDemo，并指定 `com.ebookfrenzy.storagedemo`\
  \ 为包名。在点击 Finish 按钮之前，将 Minimum API level 设置为 API 26: Android 8.0 (Oreo)，并将 Language\
  \ 菜单更改为 Java。\n\n## 70.3 设计用户界面\n\n用户界面需要由三个 `Button` 视图和一个 `EditText` 视图组成。在 Project\
  \ 工具窗口中，导航到 `app -> res -> layout` 下的 `activity_main.xml` 布局文件并双击将其加载到 Layout Editor\
  \ 工具中。在工具的 Design 模式下，选择并删除 Hello World! `TextView` 对象。\n\n\n\n\n将一个 `Button` 控件拖并放置到布局的左上角，以便在放置控件之前，会出现左侧和顶部的虚线边距指南。放置第二个\
  \ `Button`，使其显示中心和顶部的边距指南。第三个 `Button` 控件应被放置在显示顶部和右侧边距指南的位置。\n\n将将这三个按钮的文本属性分别更改为“New”、“Open”和“Save”。接下来，放置一个\
  \ `Plain Text` 控件，使其在水平上居中，并位于中心 `Button` 下方，使用户界面布局与图 70-1 所示所示。使用布局编辑器工具栏中的“Infer\
  \ Constraints”（推断约束）按钮添加任何缺失的约束。\n\n在布局中选择 `Plain Text` 控件，删除当前的文本属性设置以便该字段初始为空，并将\
  \ `ID` 设置为 `fileText`，记住将所有字符串属性提取为资源值：\n\n![](img/as_4.1_storage_demo_ui.jpg)\n\
  \n图 70-1\n\n使用属性（Attributes）窗口，配置 `Button` 控件上的 `onClick` 属性，分别调用名为 `newFile`、`openFile`\
  \ 和 `saveFile` 的方法。\n\n## 70.4 声明请求代码\n\n在 Storage Access Framework 中处理文件涉及根据要执行的具体操作触发多种意图（intent）。这会导致框架显示存储选择器用户界面，以便用户指定存储位置（例如\
  \ Google Drive 上的目录和文件名）。当意图工作完成后，应用程序将通过调用名为 `onActivityResult()` 的方法收到通知。\n\n\
  由于来自单个 Activity 的意图都会调用同一个 `onActivityResult()` 方法，因此需要一种机制来识别是哪个意图触发了调用。这可以通过启动意图时传递请求代码来实现。然后，该代码由意图传递给\
  \ `onActivityResult()` 方法，使方法能够识别用户请求了哪种操作。在实现创建、保存和打开文件的 `onClick` 处理器之前，第一步是为这三个操作声明一些请求代码。\n\
  \n找到并加载 `MainActivity.java` 文件到编辑器中，为应用程序执行的三个操作声明常量值。此外，添加一些代码来获取 `EditText` 对象的引用，该对象将在后续方法中被引用：\n\
  \n```java\npackage com.ebookfrenzy.storagedemo;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  \nimport android.os.Bundle;\n\nimport android.widget.EditText;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private EditText textView;\n\n    private static\
  \ final int CREATE_REQUEST_CODE = 40;\n\n    private static final int OPEN_REQUEST_CODE\
  \ = 41;\n\n    private static final int SAVE_REQUEST_CODE = 42;\n\n    @Override\n\
  \    protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.activity_storage_demo);\n        textView = findViewById(R.id.fileText);\n\
  \    }\n}\n```\n\n## 70.5 创建新的存储文件\n\n当选择 `New` 按钮时，应用程序需要触发一个配置为 `ACTION_CREATE_DOCUMENT`\
  \ 的意图，以创建一个具有纯文本 MIME 标识的文件。在设计用户界面时，`New` 按钮被配置为调用名为 `newFile()` 的方法。在该方法内部需要启动相应的意图。\n\
  \n留在 `MainActivity.java` 文件中，按照如下方式实现此方法：\n\n```java\npackage com.ebookfrenzy.storagedemo;\n\
  \nimport android.app.Activity;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  \nimport android.os.Bundle;\n\nimport android.widget.EditText;\n\nimport android.content.Intent;\n\
  \nimport android.view.View;\n\nimport android.net.Uri;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private static EditText textView;\n\n    private\
  \ static final int CREATE_REQUEST_CODE = 40;\n\n    private static final int OPEN_REQUEST_CODE\
  \ = 41;\n\n    private static final int SAVE_REQUEST_CODE = 42;\n\n.\n.\n.\n\n \
  \   public void newFile(View view)\n    {\n        Intent intent = new Intent(Intent.ACTION_CREATE_DOCUMENT);\n\
  \        intent.addCategory(Intent.CATEGORY_OPENABLE);\n        intent.setType(\"\
  text/plain\");\n        intent.putExtra(Intent.EXTRA_TITLE, \"newfile.txt\");\n\
  \        startActivityForResult(intent, CREATE_REQUEST_CODE);\n    }\n.\n.\n}\n\
  ```\n\n此代码创建了一个新的 `ACTION_CREATE_INTENT` Intent 对象。然后对该意图进行配置，使得只有可以使用文件描述符打开的文件会被返回（通过\
  \ `Intent.CATEGORY_OPENABLE` 类别设置）。\n\n接下来，代码指定要打开的文件具有纯文本 MIME 标识，并提供了一个占位符文件名（用户可以在选择器界面中更改该文件名）。最后，启动意图并传递之前声明的\
  \ `CREATE_REQUEST_CODE`。\n\n当执行此方法且意图已完成分配的任务时，将调用应用程序的 `onActivityResult()` 方法，并传递（其他参数之外）新创建文档的\
  \ `Uri` 以及启动意图时使用的请求代码。现在是开始实现此方法的理想时机。\n\n## 70.6 onActivityResult() 方法\n\n`onActivityResult()`\
  \ 方法将由应用程序生命周期内调用的所有意图共享。在每情况下，方法都将接收一个请求代码、一个结果代码和一组包含存储文件 `Uri` 的结果数据。该方法需要被实现，以检查意图操作是否成功、识别所执行的操作类型，并从结果数据中提取文件\
  \ `Uri`。在教程的此时，该方法只需要处理在所选的文档提供程序上创建新文件，因此修改 `MainActivity.java` 文件添加此方法：\n\n```java\n\
  public void onActivityResult(int requestCode, int resultCode, Intent resultData)\
  \ {\n    super.onActivityResult(requestCode, resultCode, resultData);\n    if (resultCode\
  \ == Activity.RESULT_OK) {\n        if (requestCode == CREATE_REQUEST_CODE) {\n\
  \            if (resultData != null) {\n                textView.setText(\"\");\n\
  \            }\n        }\n    }\n}\n```\n\n此方法中的代码非常直观。它检查 Activity 的结果，如果成功，则将请求代码与\
  \ `CREATE_REQUEST_CODE` 值进行比较，以验证用户正在创建一个新文件。如果是这样，则清除文本视图中的任何之前的文本，以表示创建了新文件。\n\
  \n编译并运行应用程序，选择 `New` 按钮。Storage Access Framework 随后应显示如图 70-3 所示的下载界面：\n\n![](img/as_3.5_storage_downloads_screen.jpg)\n\
  \n图 70-2\n\n选择上方高亮的菜单按钮，选择 `Drive` 选项，然后选择 `My Drive`，并导航到 Google Drive 存储上的适当位置以保存文件。在选择器界面底部的文本字段中，在选择\
  \ `Save` 选项之前将名称从“newfile.txt”更改为合适的名称（但保留 .txt 扩展名）。\n\n![](img/as_3.5_storage_destination_.jpg)\n\
  \n图 70-3\n\n一旦创建了新文件，应用程序应返回主 Activity，通知面板中将显示“1 file uploaded”的通知。\n\n![](img/as_3.5_storage_upload_notification.jpg)\n\
  \n图 70-4\n\n\n\n\n\n此时，你应该能够在浏览器窗口中登录 Google Drive 账号，并在请求的位置找到新创建的文件。如果文件不存在，请确保运行应用程序的\
  \ Android 设备已连接到网络。也可以通过运行 Google Drive 应用来验证设备对 Google Drive 的访问，该应用在许多 Android\
  \ 设备上默认安装，并可以在 Google Play 商店下载。\n\n## 70.7 保存到存储文件\n\n现在应用程序已经能够创建新的存储基础文件，下一步是添加将用户输入的任何文本保存到文件的功能。用户界面被配置为在用户选择保存（Save）按钮时调用\
  \ `saveFile()` 方法。该方法将负责启动一个类型为 `ACTION_OPEN_DOCUMENT` 的新 intent，这将导致选择器界面出现，使用户可以选择要存储文本的文件。由于我们只处理纯文本文件，因此需要配置\
  \ intent，将用户的选择选项限制为匹配 `text/plain` MIME 类型的现有文件。在确定了 `saveFile()` 方法要执行的操作后，现在可以将此内容添加到\
  \ `MainActivity.java` 类文件中：\n\n```java\npublic void saveFile(View view) {\n    Intent\
  \ intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);\n    intent.addCategory(Intent.CATEGORY_OPENABLE);\n\
  \    intent.setType(\"text/plain\");\n    startActivityForResult(intent, SAVE_REQUEST_CODE);\n\
  }\n```\n\n由于 `SAVE_REQUEST_CODE` 已传递给 intent，现在必须扩展 `onActivityResult()` 方法来处理保存操作：\n\
  \n```java\npublic void onActivityResult(int requestCode, int resultCode, Intent\
  \ resultData) {\n    super.onActivityResult(requestCode, resultCode, resultData);\n\
  \    Uri currentUri = null;\n    if (resultCode == Activity.RESULT_OK) {\n     \
  \   if (requestCode == CREATE_REQUEST_CODE) {\n            if (resultData != null)\
  \ {\n                textView.setText(\"\");\n            }\n        } else if (requestCode\
  \ == SAVE_REQUEST_CODE) {\n            if (resultData != null) {\n             \
  \   currentUri = resultData.getData();\n                writeFileContent(currentUri);\n\
  \            }\n        }\n    }\n}\n```\n\n该方法检查保存请求，从存储选择器中提取用户选择的文件 `Uri`，并调用方法\
  \ `writeFileContent()`，将要写入文本的文件 `Uri` 传递给该方法。继续在 `MainActivity.java` 文件中实现此方法，其代码如下：\n\
  \n```java\npackage com.ebookfzy.storagedemo;\n\nimport java.io.FileOutputStream;\n\
  import java.io.IOException;\nimport android.app.Activity;\nimport androidx.appcompat.app.AppCompatActivity;\n\
  import android.os.Bundle;\nimport android.widget.EditText;\nimport android.content.Intent;\n\
  import android.view.View;\nimport android.net.Uri;\nimport android.os.ParcelFileDescriptor;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private void writeFileContent(Uri\
  \ uri) {\n        try {\n            ParcelFileDescriptor pfd = this.getContentResolver().openFileDescriptor(uri,\
  \ \"w\");\n            FileOutputStream fileOutputStream = new FileOutputStream(pfd.getFileDescriptor());\n\
  \            String textContent = textView.getText().toString();\n            fileOutputStream.write(textContent.getBytes());\n\
  \            fileOutputStream.close();\n            pfd.close();\n        } catch\
  \ (IOException e) {\n            e.printStackTrace();\n        }\n    }\n}\n```\n\
  \n该方法首先从用户选择的文件 `Uri` 获取并打开文件描述符。由于代码需要写入文件，因此描述符以写入模式（`\"w\"`）打开。然后使用该文件描述符作为创建输出流的基础，以便应用程序能够写入文件。用户输入的文本从编辑框对象中提取，并在关闭文件描述符和流之前写入输出流。此外还添加了代码以处理在文件写入过程中遇到的任何\
  \ `IO` 异常。添加新方法后，编译并运行应用程序，在文本视图中输入一些文本并选择保存按钮。在选择器界面中，找到之前从 Google Drive 存储中创建的文件，并将文本保存到该文件。返回浏览器窗口中的\
  \ Google Drive 账号并选择该文件显示内容。现在该文件包含了在 Android 设备上的 StorageDemo 应用中输入的文本。\n\n## 70.8\
  \ 打开并读取文件\n\n在编写了创建和保存文件的代码后，最后一个任务是添加从存储器打开并读取文件的功能。这将涉及编写 `openFile()` 点击事件处理方法并实现它，使其启动一个\
  \ `ACTION_OPEN_DOCUMENT` intent：\n\n```java\npublic void openFile(View view) {\n\
  \    Intent intent = new Intent(Intent.ACTION_OPEN_DOCUMENT);\n    intent.addCategory(Intent.CATEGORY_OPENABLE);\n\
  \    intent.setType(\"text/plain\");\n    startActivityForResult(intent, OPEN_REQUEST_CODE);\n\
  }\n```\n\n在此代码中，intent 被配置为过滤应用程序可以打开的文件。当 activity 启动时，将传递一个打开请求常量，现在需要在 `onActivityResult()`\
  \ 方法中处理它：\n\n```java\npublic void onActivityResult(int requestCode, int resultCode,\
  \ Intent resultData) {\n    super.onActivityResult(requestCode, resultCode, resultData);\n\
  \    Uri currentUri;\n    if (resultCode == Activity.RESULT_OK) {\n        if (requestCode\
  \ == CREATE_REQUEST_CODE) {\n            if (resultData != null) {\n           \
  \     textView.setText(\"\");\n            }\n        } else if (requestCode ==\
  \ SAVE_REQUEST_CODE) {\n            if (resultData != null) {\n                currentUri\
  \ = resultData.getData();\n                writeFileContent(currentUri);\n     \
  \       }\n        } else if (requestCode == OPEN_REQUEST_CODE) {\n            if\
  \ (resultData != null) {\n                currentUri = resultData.getData();\n \
  \               try {\n                    String content = readFileContent(currentUri);\n\
  \                    textView.setText(content);\n                } catch (IOException\
  \ e) {\n                    // 在处处理错误\n                }\n            }\n      \
  \  }\n    }\n}\n```\n\n上述处理打开请求的新代码从选择器用户界面获取用户选择的文件 `Uri`，并将其传递给方法 `readFileContent()`，该方法预计以\
  \ String 对象的格式返回选定文件的的内容。将结果字符串赋值给编辑框视图的文本属性。显然，下一个任务是实现 `readFileContent()` 方法：\n\
  \n```java\npackage com.ebookfzy.storagedemo;\n\nimport java.io.FileOutputStream;\n\
  import java.io.IOException;\nimport java.io.BufferedReader;\nimport java.io.InputStream;\n\
  import java.io.InputStreamReader;\nimport android.app.Activity;\n```\n\n\n\n\n\n\
  ```java\nimport android.support.v7.app.AppCompatActivity;\nimport android.os.Bundle;\n\
  import android.widget.EditText;\nimport android.content.Intent;\nimport android.view.View;\n\
  import android.net.Uri;\nimport android.os.ParcelFileDescriptor;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n\n..\n\n    private String readFileContent(Uri\
  \ uri) throws IOException {\n        InputStream inputStream =\n            getContentResolver().openInputStream(uri);\n\
  \        BufferedReader reader =\n            new BufferedReader(new InputStreamReader(\n\
  \                inputStream));\n        StringBuilder stringBuilder = new StringBuilder();\n\
  \        String currentline;\n        while ((currentline = reader.readLine()) !=\
  \ null) {\n            stringBuilder.append(currentline).append(\"\\n\");\n    \
  \    }\n        inputStream.close();\n        return stringBuilder.toString();\n\
  \    }\n\n..\n}\n```\n\n该方法首先提取所选文本文件的文件描述符并打开以读取。随后，打开与 `Uri` 关联的输入流，并将其作为 `BufferedReader`\
  \ 实例的输入源。文件中的每一行都会被读取并存储在 `StringBuilder` 对象中。一旦所有行都读取完毕，输入流和文件描述符都将被关闭，文件内容将作为一个\
  \ `String` 对象返回。\n\n## 70.9 测试存储访问应用程序\n\n完成编码阶段后，应用程序现在已准备好进行全面测试。首先在 Android 设备或配置了你的\
  \ Google 账户身份的 AVD 上启动应用程序，并点击“New”（新建）按钮。在生成的存储选择器界面中，选择一个 Google Drive 位置，并在选择文件名字段右侧的\
  \ Save（保存）选项之前将文本文件命名为 `storagedemo.txt`。\n\n当控制权返回应用程序时，寻找文件上传通知，然后在选择“Save”按钮之前向文本区域输入一些文本。从选择器选择之前创建的\
  \ `storagedemo.txt` 文件将内容保存到文件中。返回应用程序后，删除文本并选择“Open”（打开）按钮，再次选择 `storagedemo.txt`\
  \ 文件。当控制权返回应用程序时，文本视图应该已经填充了文本文件的内容。\n\n注意的是，如果 Android 设备缺少活跃的互联网连接，存储访问框架（Storage\
  \ Access Framework）将在本地缓存存储文件。然而，一旦重新连接，任何缓存数据都将与远程存储服务同步。因此，作为应用程序的最终测试，在浏览器窗口中登录你的\
  \ Google Drive 账户，导航到 `storagedemo.txt` 文件并点击它查看内容，如果一切顺利，该内容应该包含应用程序保存的文本。\n\n\
  ## 70.10 总结\n\n本章详细介绍了如何创建一个 Android Studio 应用程序示例，该程序是一个非常基础的文本编辑器，旨在使用 Android\
  \ 存储访问框架利用云存储来创建、保存和打开文件。\n\n## 71 使用 VideoView 和 MediaController 类在 Android 上进行视频播放\n\
  \n智能手机和平板电脑的主要用途之一是提供在线内容。一种被广泛使用的内容形式（特别是在平板设备上）是视频。\n\nAndroid SDK 包含了两个类，使得在开发应用程序时在\
  \ Android 设备上实现视频播放变得极其简单。本章将在创建视频播放应用程序之前，对这两个类——`VideoView` 和 `MediaController`——进行概述。\n\
  \n## 71.1 介绍 Android VideoView 类\n\n到目前为止，在 Android 应用程序中显示视频简单的方法是使用 `VideoView`\
  \ 类。这是一个视觉组件，当它被添加到 Activity 的布局时，它提供了一个可以播放视频的表面。Android 目前支持以下视频格式：\n\n* H.263\n\
  * H.264 AVC\n* H.265 HEVC\n* MPEG-4 SP\n* VP8\n* VP9\n\n`VideoView` 类有一系列可以调用的方法来管理播放。其中一些常用的方法是：\n\
  \n* `setVideoPath(String)` – 指定要播放的视频的路径（字符串形式）。\n* `setVideoUri(Uri)` – 执行与 `setVideoPath()`\
  \ 相同的任务，但接收的是 `Uri` 而不是字符串。\n* `start()` – 开始视频播放。\n* `stopPlayback()` – 停止视频播放。\n\
  * `pause()` – 暂停视频播放。\n* `isPlaying()` – 返回一个布尔值，指示视频当前正在播放。\n* `setOnPreparedListener(MediaPlayer.OnPreparedListener)`\
  \ – 允许在视频准备好播放时调用回调方法。\n* `setOnErrorListener(MediaPlayer.OnErrorListener)` – 允许在视频播放发生错误时调用回调方法。\n\
  * `setOnCompletionListener(MediaPlayer.OnCompletionListener)` – 允许在视频结束时调用回调方法。\n\
  * `getDuration()` – 返回视频的持续时间。\n* `getCurrentPosition()` – 返回一个整数值，指示当前的播放位置。\n\
  * `setMediaController(MediaController)` – 指定一个 `MediaController` 实例，允许将播放控件显示给用户。\n\
  \n## 71.2 介绍 Android MediaController 类\n\n如果仅使用 `VideoView` 类播放视频，用户将无法对播放进行任何控制，视频将一直运行到结束。这个问题可以通过将\
  \ `MediaController` 类的实例附加到 `VideoView` 实例来解决。`MediaController` 将提供一组控件，允许用户管理播放（例如暂停以及在视频时间轴上向后/向前快进）。\n\
  \n控件的位置通过将控制器实例锚定到用户界面布局中的特定视图来指定。一旦附加并锚定。\n\n该类的一些关键方法包括：\n\n* `setAnchorView(View)`\
  \ – 指定要锚定的视图。这决定了控件在屏幕上的位置。\n* `show()` – 显示控件。\n* `show(int)` – 按指定的时间（毫秒）显示控件。\n\
  * `hide()` – 向用户隐藏控制器。\n* `isShowing()` – 返回一个布尔值，指示控制器当前对用户可见。\n\n## 71.3 创建视频播放示例\n\
  \n本章的剩余部分将创建一个示例应用程序，用于使用 `VideoView` 和 `MediaController` 类播放 MPEG-4 视频文件。从欢迎界面选择\
  \ Create New Project 快速选项，并在生成的新项目对话框中选择 Empty Activity 模板，然后点击 Next 按钮。\n\n在 Name\
  \ 字段输入 `VideoPlayer`，并指定 `com.ebookfrenzy.videoplayer` 为包名。在点击 Finish 按钮之前，将 Minimum\
  \ API level 设置为 API 26: Android 8.0 (Oreo)，并将语言菜单设置为 Java。\n\n## 71.4 设计 VideoPlayer\
  \ 布局\n\n主 Activity 的用户界面将仅由 `VideoView` 类实例组成。使用 Project 工具窗口找到 `app -> res -> layout\
  \ -> activity_main.xml` 文件，双击打开，将 Layout Editor 工具切换到 Design 模式，并删除默认的 `TextView`\
  \ 小部件。\n\n\n\n\n\n从调色板（Palette）面板的 Widgets 类中，将 `VideoView` 实例拖放到布局中，使其填充可用的画布区域，如图\
  \ 71-1 所示。使用属性（Attributes）面板，分别将 `layout_width` 和 `layout_height` 属性更改为 `match_constraint`\
  \ 和 `wrap_content`。此外，删除连接 `VideoView` 底部到父 `ConstraintLayout` 底部的约束。最后，将组件的 ID\
  \ 更改为 `videoView1`。\n\n![](img/as_3.5_videoplayer_ui.jpg)\n\n图 71-1\n\n## 71.5 下载视频文件\n\
  \n`VideoPlayer` 应用将播放的视频是一个 MPEG-4 格式编码的短动画电影。使用浏览器访问以下 URL 来播放视频：\n\n`https://www.ebookfrenzy.com/android_book/movie.mp4`\n\
  \n在浏览器窗口中，右键点击视频播放，选择保存或下载视频到本地文件的选项，并选择合适的临时文件系统位置，将文件命名为 `movie.mp4`。\n\n在 Android\
  \ Studio 中，在 Project 工具窗口中找到 `res` 文件夹，右键点击并选择 `New -> Directory` 菜单选项，在名称字段中输入\
  \ `raw`，然后点击 `OK` 按钮。使用操作系统的文件导航器找到上述下载的 `movie.mp4` 文件并复制。返回 Android Studio，右键点击新创建的\
  \ `raw` 目录并选择 `Paste` 选项将视频文件复制到项目中。添加完成后，Project 工具窗口中的 `raw` 文件夹应与图 71-2 一致：\n\
  \n![](img/as_3.6_video_player_raw_file_added.jpg)\n\n图 71-2\n\n## 71.6 配置 VideoView\n\
  \n下一步是为 `VideoView` 配置要播放的视频路径并开始播放。这将在主活动初始化后执行，因此将 `MainActivity.java` 文件加载到编辑器中，并按照下面的列表对其进行修改：\n\
  \n```java\npackage com.ebookfrenzy.videoplayer;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  \nimport android.os.Bundle;\nimport android.widget.VideoView;\n\nimport android.net.Uri;\n\
  \npublic class MainActivity extends AppCompatActivity {\n\n    private VideoView\
  \ videoView;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_video_player);\n\
  \        configureVideoView();\n    }\n\n    private void configureVideoView() {\n\
  \        videoView =\n            findViewById(R.id.videoView1);\n        videoView.setVideoURI(Uri.parse(\"\
  android.resource://\"\n            + getPackageName() + \"/\" + R.raw.movie));\n\
  \        videoView.start();\n    }\n}\n```\n\n这段代码的作用只是获取布局中 `VideoView` 实例的引用，为其分配一个指向\
  \ raw 资源目录中电影文件的 `URI` 对象，然后开始播放视频。\n\n在物理 Android 设备上运行应用以测试它。应用程序启动后，在视频开始播放之前，缓冲视频内容时可能会有短暂的延迟（图\
  \ 71-3）。\n\n![](img/as_3.6_video_player_playing.jpg)\n\n图 71-3\n\n这表明了将视频播放集成到 Android\
  \ 应用中是多么简单。在本示例中，目前为止的所有内容都是通过使用一个 `VideoView` 实例三行代码实现的。\n\n## 71.7 为 Video View\
  \ 添加 MediaController\n\n按照目前 `VideoPlayer` 应用的状态，用户没有办法控制播放。如前文所述，这可以使用 `MediaController`\
  \ 类来实现。要为 `VideoView` 添加控制器，请再次修改 `configureVideoView()` 方法：\n\n```java\npackage\
  \ com.ebookfrenzy.videoplayer;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  \nimport android.os.Bundle;\nimport android.widget.VideoView;\n\nimport android.net.Uri;\n\
  import android.widget.MediaController;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n\n    private VideoView videoView;\n    private MediaController mediaController;\n\
  \n.\n\n    private void configureVideoView() {\n        final VideoView videoView\
  \ =\n            findViewById(R.id.videoView1);\n        videoView.setVideoURI(Uri.parse(\"\
  android.resource://\"\n            + getPackageName() + \"/\" + R.raw.movie));\n\
  \        mediaController = new MediaController(this);\n        mediaController.setAnchorView(videoView);\n\
  \        videoView.setMediaController(mediaController);\n        videoView.start();\n\
  \    }\n}\n```\n\n当实现这些更改后应用时，点击 `VideoView` 画布将导致媒体控件出现在视频上方。这些控件包括一个进度条、快进、倒退以及播放/暂停按钮。在控件退去后，可以通过点击\
  \ `VideoView` 画布来恢复它们。\n\n## 71.8 设置 onPrepared\n\n作为处理媒体的最后一个示例，现在现在将扩展该活动以演示一个监听器。在这种情况下，将实现一个监听器以在\
  \ Android Logcat 面板中输出视频的持续时间。\n\n```java\npackage com.ebookfrenzy.videoplayer;\n\
  \nimport android.appcompat.app.AppCompatActivity;\nimport android.os.Bundle;\nimport\
  \ android.widget.VideoView;\nimport android.net.Uri;\nimport android.widget.MediaController;\n\
  import android.util.Log;\nimport android.media.MediaPlayer;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n\n    private VideoView videoView;\n    private MediaController\
  \ mediaController;\n    String TAG = \"VideoPlayer\";\n\n    private void configureVideoView()\
  \ {\n        final VideoView videoView =\n            findViewById(R.id.videoView1);\n\
  \        videoView.setVideoURI(Uri.parse(\"android.resource://\"\n            +\
  \ getPackageName() + \"/\" + R.raw.movie));\n        mediaController = new MediaController(this);\n\
  \        mediaController.setAnchorView(videoView);\n        videoView.setMediaController(mediaController);\n\
  \        videoView.setOnPrepared(new MediaPlayer.OnPreparedListener() {\n      \
  \      @Override\n            public void onPrepared(MediaPlayer mp) {\n       \
  \         mp.setLooping(true);\n                Log.i(TAG, \"Duration = \" + videoView.getDuration());\n\
  \            }\n        });\n        videoView.start();\n    }\n}\n```\n\n现在在视频开始播放之前，Android\
  \ Studio Logcat 面板中将出现如下所示的消息，并且视频将在播放结束后重启：\n\n`11-05 10:27:52.256 12542-12542/com.ebookfrenzy.videoplayer\
  \ I/VideoPlayer: Duration = 13504`\n\n## 71.9 总结\n\nAndroid 设备是向用户交付内容的优秀平台，特别是视频媒体形式。如本章所述，Android\
  \ SDK 提供了两个类，即 `VideoView` 和 `MediaController`，它们结合使得将视频播放集成到 Android 应用中变得快速且简单，通常只需要几行\
  \ Java 代码。\n\n\n\n\n\n在之前的章节中介绍 Android 多任务处理时，简要提到了画中画（PiP）模式，但没有进行任何详细介绍。画中画模式主要为视频播放设计，允许\
  \ activity 屏幕缩小尺寸并放置在屏幕上的任何位置。在此状态下，无论设备上运行着任何其他 activity，该 activity 都会继续运行且窗口保持可见。这允许用户在执行检查电子邮件或处理电子表格等任务的同时，例如继续观看视频播放。\n\
  \n本章将对画中画模式进行概述，在下一章中，我们将为 `VideoPlayer` 项目添加画中画的支持。\n\n## 72.1 画中画功能\n\n正如本章后部分将解释的并在下一章中演示的那样，可以通过从运行中的应用内部调用\
  \ API 将 activity 置于 PiP 模式。在进入 PiP 模式时，可以指定配置选项来控制 PiP 窗口的宽高比，并定义包含在窗口中的 activity\
  \ 屏幕区域。例如，图 72-1 显示了处于画中画模式的视频播放 activity：\n\n![](img/Image24273.jpg)\n\n图 72-1\n\
  \n图 72-2 显示了用户点击后的 PiP 模式窗口。在此模式下，窗口会变得更大，并在中心包含一个全屏操作，点击后会将窗口恢复到全屏模式；右上角有一个退出按钮，用于关闭窗口并将应用置于后台。添加到\
  \ PiP 窗口的任何自定义操作在在此模式下显示时也会显示在屏幕上。在图 72-2 中，PiP 窗口包含了自定义的播放和暂停操作按钮：\n\n![](img/Image24363.jpg)\n\
  \n图 72-2\n\n本章的剩余部分将概述如何在 Android 应用内部启用和管理 PiP 模式。\n\n## 72.2 启用画中画模式\n\nPiP 模式目前仅支持运行\
  \ API 26：Android 8.0 (Oreo) 或更高性的设备。实现 PiP 模式的第一步是在项目的 manifest 文件中启用它。通过向每个需要 PiP\
  \ 支持的 activity 元素添加以下行，可以按 activity 配置 PiP 模式：\n\n```xml\n<activity android:name=\"\
  .MyActivity\"\n    android:supportsPictureInPicture=\"true\"\n    android:configChanges=\n\
  \        \"screenSize|smallestScreenSize|screenLayout|orientation\">\n    <intent-filter>\n\
  \        <action android:name=\"android.intent.action.MAIN\" />\n        <category\
  \ android:name=\"android.intent.category.LAUNCHER\" />\n    </intent-filter>\n</activity>\n\
  ```\n\n`android:supportsPictureInPicture` 条目启用该 activity 的 PiP 功能，而 `android:configChanges`\
  \ 属性通知 Android 该 activity 能够处理布局配置更改。如果没有此设置，每次 activity 进入或退出 PiP 模式时，activity\
  \ 都将重启，导致视频在切换期间从开始重新播放。\n\n## 72.3 配置画中画参数\n\nPiP 行为通过使用 `PictureInPictureParams`\
  \ 类定义，可以使用 `Builder` 类创建其实例，如下：\n\n```java\nPictureInPictureParams params = new\
  \ PictureInPictureParams.Builder().build();\n```\n\n上述代码创建了一个带有定义的特殊参数的默认 `PictureInPictureParams`\
  \ 实例。也可以使用以下可选方法调用来自定义参数：\n\n- `setActions()` – 用于定义 activity 在处于 PiP 模式时可以在 PiP\
  \ 窗口内执行的操作。操作将在本章稍后部分详细介绍。\n- `setAspectRatio()` – 声明 PiP 窗口显示的首选宽高比。该方法接受一个包含高度/宽度/高度比例的\
  \ `Rational` 对象作为参数。\n- `setSourceRectHint()` – 接受一个 `Rect` 对象作为参数，定义 PiP 窗口内显示的\
  \ activity 屏幕区域。\n\n例如，以下代码在 `PictureInPictureParams` 对象中配置了宽高比和操作参数。在宽高比的情况下，它是使用\
  \ `VideoView` 实例的宽度和高度维度定义的：\n\n```java\nRational rational = new Rational(videoView.getWidth(),\
  \ videoView.getHeight());\n\nPictureInPictureParams params = new PictureInPictureParams.Builder()\n\
  \    .setAspectRatio(rational)\n    .setActions(actions)\n    .build();\n```\n\n\
  一旦定义，可以使用 `setPictureInParams(params)` 随时设置 `PictureInPictureParams`。\n\n## 72.4\
  \ 进入画中画模式\n\n通过调用 `enterPictureInMode()` 并传递 `PictureInParams` 对象将 activity 置于画中模式。如果不需要参数，只需创建一个默认的\
  \ `PictureInParams` 即可。\n\n## 72.5 检测画中画模式变化\n\n当 activity 进入 PiP 模式时，隐藏不必要的视图很重要，以便只有视频播放可见。当\
  \ activity 重新进入全屏模式时，需要恢复任何隐藏的界面组件。这些与其他应用特定的任务可以通过重写 `onPictureInModeChanged()`\
  \ 方法完成。该方法在每次 activity 在 PiP 和全屏模式之间切换时调用，并传递一个指示 activity 当前是否处于 PiP 模式的布尔值：\n\n\
  ```java\n@Override\npublic void onPictureInModeChanged(boolean isInPictureMode)\
  \ {\n    super.onPictureInModeChanged(isInPictureMode);\n    if (isInPictureMode)\
  \ {\n        // 进入画中模式\n    } else {\n        // 进入全屏模式\n    }\n}\n```\n\n## 72.6\
  \ 添加画中画操作\n\n画中画操作在用户点击 PiP 窗口时会以图标形式显示在窗口内。画中画操作的实现多步骤过程，首先要实现一种让 PiP 窗口通知应用已选择操作的方法。这是通过在应用内设置广播接收器来实现的，然后在\
  \ PiP 操作内部创建意图（pending intent），该意图配置为发送广播接收器正在监听的广播。当广播接收器由意图触发时，可以使用意图中存储的数据来识别执行的操作并在应用内采取相应行动。\n\
  \n画中画操作使用 `RemoteAction` 实例声明，这些实例使用图标、标题、描述和 `PendingIntent` 对象进行初始化。一旦创建了一个或多个操作，就会将它们添加到\
  \ `ArrayList` 中并在构建 `PictureInPictureParams` 对象时传递给 `setActions()` 方法。\n\n以下代码片段演示了\
  \ `Intent`、`PendingIntent` 和 `RemoteAction` 对象的创建，以及随后应用到应用 PiP 设置的 `PictureInPictureParams`\
  \ 实例：\n\n```java\nfinal ArrayList<RemoteAction> actions = new ArrayList<>();\nIntent\
  \ actionIntent = new Intent(\"MY_PIP_ACTION\");\nfinal PendingIntent pendingIntent\
  \ = PendingIntent.getBroadcast(MyActivity.this, REQUEST_CODE, actionIntent, 0);\n\
  \nfinal Icon icon = Icon.createWithResource(MyActivity.this,\n```\n\n\n\n\n\n```java\n\
  R.drawable.action_icon);\n\nRemoteAction remoteAction = new RemoteAction(icon,\n\
  \    \"My Action Title\",\n    \"My Action Description\",\n    pendingIntent);\n\
  actions.add(remoteAction);\n\nPictureInPictureParams params =\n    new PictureInPictureParams.Builder()\n\
  \        .setActions(actions)\n        .build();\nsetPictureInPictureParams(params);\n\
  ```\n\n## 72.7 总结\n\n画中画（Picture-in-Picture）模式是 Android 8.0 引入的一种多任务功能，专门允许用户在执行其他应用和其他活动任务时，在小窗口中继续播放。在使用\
  \ PiP 模式之前，必须首先在需要 PiP 支持的活动清单文件中启用它。\n\nPiP 模式的行为通过 `PictureInPictureParams` 类的实例进行配置，并通过在\
  \ Activity 内部调用 `enterPictureInPictureMode()` 方法启动。在 PiP 模式下，应该只有视频播放可见的，这意味着在选择全屏模式之前，必须隐藏任何其他用户界面元素。这些与其他模式切换相关的任务可以通过重写\
  \ `onPictureInPictureModeChanged()` 方法来完成。\n\n当用户点击 PiP 窗口时，PiP 操作将以图标的形式叠加在窗口上。当这些操作被选中时，会触发\
  \ Activity 内部的行为。PiP 窗口通过广播接收器和等待意图（pending intents）通知 Activity 执行操作。\n\n## 73.\
  \ Android 画中画教程\n\n接续前面的章节，本章将采用现有的 VideoPlayer 项目并对其增强，以添加画中画支持，包括检测 PiP 模式变化，以及添加一个用于显示当前运行视频信息的\
  \ PiP 操作。\n\n### 73.1 在 Manifest 文件中添加画中画支持\n\n在 Android 应用项目上添加 PiP 支持的第一步是在项目\
  \ Manifest 清单文件中启用它。打开 `manifests -> AndroidAndroidManifest.xml` 文件，并修改 activity\
  \ 元素以启用 PiP 支持：\n\n```xml\n<activity android:name=\".MainActivity\"\n  android:supportsPictureInPicture=\"\
  true\"\n  android:configChanges=\"screenSize|smallestScreenSize|screenLayout|orientation\"\
  >\n    <intent-filter>\n        <action android:name=\"android.intent.action.MAIN\"\
  \ />\n        <category android:name=\"android.intent.category.LAUNCHER\" />\n \
  \   </intent-filter>\n</activity>\n```\n\n## 73.2 添加画中画按钮\n\n按照目前的设计，VideoPlayer\
  \ 活动的布局仅包含一个 `VideoView` 实例。现在将向布局中添加一个按钮，用于切换到 PiP 模式。将 `activity_main.xml` 文件加载到布局编辑器中，从调色板拖入一个\
  \ `Button` 对象到布局中，使其位置如 [图 73-1] 所示。\n\n![](img/as_4.1_video_plater_pip_ui.jpg)\n\
  \n图 73-1\n\n更改按钮上的文本显示为“Enter PiP Mode”（进入 PiP 模式），并将字符串提取到名为 `enter_pip_mode` 的资源。在继续下一步之前，将按钮的\
  \ ID 更改为 `pipButton` 并配置按钮调用名为 `enterPipMode` 的方法。\n\n## 73.3 进入画中画模式\n\n现在需要将 `enterPipMode`\
  \ `onClick` 回调方法添加到 `MainActivity.java` 类文件中。找到该文件，在代码编辑器中打开并如下所示添加此方法：\n\n```java\n\
  import android.view.View;\nimport android.app.PictureInPictureParams;\nimport android.util.Rational;\n\
  import android.widget.Button;\n\npublic void enterPipMode(View view) {\n    Button\
  \ pipButton = findViewById(R.id.pipButton);\n    Rational rational = new Rational(videoView.getWidth(),\n\
  \            videoView.getHeight());\n    PictureInPictureParams params =\n    \
  \    new PictureInPictureParams.Builder()\n            .setActions(actions)\n  \
  \          .build();\n    setPictureInPictureParams(params);\n}\n```\n\n*(注：根据上下文逻辑，通常还需要重写回调方法来处理切换：)*\n\
  \n```java\n@Override\npublic void onPictureInPictureModeChanged(boolean isInPictureInMode)\
  \ {\n    super.onPictureInPictureModeChanged(isInPictureInMode);\n    Button pipButton\
  \ = findViewById(R.id.pipButton);\n    if (isInPictureInMode) {\n        pipButton.setVisibility(View.GONE);\n\
  \    } else {\n        pipButton.setVisibility(View.VISIBLE);\n        videoView.setMediaController(mediaController);\n\
  \    }\n}\n```\n\n\n\n\n\n项目的最后一步是为 PiP 窗口添加一个操作（action）。该操作的目的是显示一个包含当前播放视频名称的\
  \ `Toast` 消息。这需要在 PiP 窗口与活动（activity）之间进行通信。实现此点的简单方法之一是在活动内部实现 `broadcast receiver`（广播接收器），并使用\
  \ `pending intent`（挂起许可）从 PiP 窗口向活动广播消息。这些步骤每次活动进入 PiP 模式时都需要执行，因此需要在 `onPictureInPictureModeChanged()`\
  \ 方法中添加代码。现在找到该方法，并开始添加代码创建一个 `intent filter`（意图过滤器）并初始化广播接收器：\n\n```java\nimport\
  \ android.content.BroadcastReceiver;\nimport android.content.Context;\nimport android.content.Intent;\n\
  import android.content.IntentFilter;\nimport android.widget.Toast;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n    private BroadcastReceiver receiver;\n\
  \    private VideoView videoView;\n    private MediaController mediaController;\n\
  \    String TAG = \"VideoPlayer\";\n\n    @Override\n    public void onPictureInPictureModeChanged(boolean\
  \ isInPictureInPictureMode) {\n        super.onPictureInPictureModeChanged(isInPictureInPictureMode);\n\
  \        Button pipButton = findViewById(R.id.pipButton);\n        if (isInPictureInPictureMode)\
  \ {\n            IntentFilter filter = new IntentFilter();\n            filter.addAction(\"\
  com.ebookfrenzy.videoplayer.VIDEO_INFO\");\n            receiver = new BroadcastReceiver()\
  \ {\n                @Override\n                public void onReceive(Context context,\
  \ Intent intent) {\n                    Toast.makeText(context, \"Favorite Home\
  \ Movie Clips\", Toast.LENGTH_LONG).show();\n                }\n            };\n\
  \            registerReceiver(receiver, filter);\n        } else {\n           \
  \ pipButton.setVisibility(View.VISIBLE);\n            videoView.setMediaController(mediaController);\n\
  \            if (receiver != null) {\n                unregisterReceiver(receiver);\n\
  \            }\n        }\n    }\n}\n```\n\n# 73.6 添加 PiP 操作\n\n实现广播接收器后，下一步是创建一个\
  \ `RemoteAction` 对象，并配置一个图像来表示 PiP 窗口中的操作。为了本例而言，将使用一个名为 `ic_info_24dp.xml` 的图像图标文件。该文件可以在从以下\
  \ URL 下载的源代码包的 `project_icons` 文件夹中找到：`https://www.ebookfrenzy.com/retail/androidstudio4/index.php`。找到此文件并将其复制并粘贴到\
  \ Project 窗口中的 `app` -> `res` -> `drawables` 文件夹中：\n\n下一步是创建一个将发送到广播接收器的 `Intent`。然后，需要将该意图封装在\
  \ `PendingIntent` 对象中，以便在用户以后点击 PiP 窗口中的按钮时触发该意图。编辑 `MainActivity.java` 文件，添加一个创建\
  \ `Intent` 和 `PendingIntent` 对象的方法，如下所示：\n\n```java\nimport android.app.PendingIntent;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private static int\
  \ REQUEST_CODE = 1;\n\n    private void createPipAction() {\n        Intent actionIntent\
  \ = new Intent(\"com.ebookfrenzy.videoplayer.VIDEO_INFO\");\n        final PendingIntent\
  \ pendingIntent = PendingIntent.getBroadcast(MainActivity.this, REQUEST_CODE, actionIntent,\
  \ 0);\n    }\n}\n```\n\n现在 `Intent` 对象和 `PendingIntent` 实例都已创建，需要创建一个 `RemoteAction`\
  \ 对象，其中包含显示在 PiP 窗口中的图标以及 `PendingIntent` 对象。继续留在 `createPipAction()` 方法中，添加如下代码：\n\
  \n```java\nimport android.app.RemoteAction;\nimport android.graphics.drawable.Icon;\n\
  import java.util.ArrayList;\n\nprivate void createPipAction() {\n    final ArrayList<RemoteAction>\
  \ actions = new ArrayList<>();\n    Intent actionIntent = new Intent(\"com.ebookfrenzy.videoplayer.VIDEO_INFO\"\
  );\n    final PendingIntent pendingIntent = PendingIntent.getBroadcast(MainActivity.this,\
  \ REQUEST_CODE, actionIntent, 0);\n    final Icon icon = Icon.createWithResource(MainActivity.this,\
  \ R.drawable.ic_info_24dp);\n    RemoteAction remoteAction = new RemoteAction(icon,\
  \ \"Info\", \"Video Info\", pendingIntent);\n    actions.add(remoteAction);\n}\n\
  ```\n\n现在需要创建一个包含该操作的 `PictureInPictureParams` 对象并应用参数，以便该操作显示在 PiP 窗口中：\n\n```java\n\
  private void createPipAction() {\n    final ArrayList<RemoteAction> actions = new\
  \ ArrayList<>();\n    Intent actionIntent = new Intent(\"com.ebookfrenzy.videoplayer.VIDEO_INFO\"\
  );\n    final PendingIntent pendingIntent = PendingIntent.getBroadcast(MainActivity.this,\
  \ REQUEST_CODE, actionIntent, 0);\n    final Icon icon = Icon.createWithResource(MainActivity.this,\
  \ R.drawable.ic_info_24dp);\n    RemoteAction remoteAction = new RemoteAction(icon,\
  \ \"Info\", \"Video Info\", pendingIntent);\n    actions.add(remoteAction);\n\n\
  \    PictureInPictureParams params = new PictureInPictureParams.Builder()\n    \
  \        .setActions(actions)\n            .build();\n\n    setPictureInPictureParams(params);\n\
  }\n```\n\n在测试操作之前的最后一个任务是在活动进入 PiP 模式时调用 `createPipAction()`：\n\n```java\n@Override\n\
  public void onPictureInPictureModeChanged(boolean isInPictureInPictureMode) {\n\
  \    super.onPictureInPictureModeChanged(isInPictureInPictureMode);\n    ...\n \
  \   if (isInPictureInPictureMode) {\n        ...\n        registerReceiver(receiver,\
  \ filter);\n        createPipAction();\n    } else {\n        ...\n    }\n}\n```\n\
  \n# 73.7 测试画中画操作\n\n再次构建并运行应用程序，并将活动放入 PiP 模式。点击 PiP 窗口，出现如图 73-5 所示的新操作按钮。点击操作按钮并等待显示视频名称的\
  \ Toast 消息出现：\n\n# 73.8 总结\n\n本章演示了在 Android Studio 应用项目中添加画中画支持，包括启用和进入 PiP 模式，以及实现\
  \ PiP 操作。这包括使用广播接收器和挂起许可（pending intents）来实现 PiP 窗口与活动之间的通信。\n\n# 74. 在 Android\
  \ 中进行运行时权限请求\n\n在之前的章节中创建的许多示例项目中，已经对 `AndroidManifest.xml` 文件进行了修改，以请求应用程序执行特定任务的权限。在几个实例中，例如，请求了互联网访问权限以允许应用程序下载并显示网页。在此之前的每个案例中，只要在清单文件中添加请求，就是获取用户许可以执行指定任务的所有操作。\n\
  \n\n\n\n\n然而，当应用在 Android 6.0 或更高版本上运行时，某些权限需要额外的步骤才能使应用正常工作。在下一章中，我们将遇到这些所谓的“危险”权限的第一种。不过，在到达该点之前，本章将概述在最新版本的\
  \ Android 上运行时请求此类权限的涉及步骤。\n\n### 7.1 理解普通权限和危险权限\n\nAndroid 通过要求用户授予应用执行某些任务的权限来实施安全保护。在\
  \ Android 6 引入之前，权限总是在应用安装到设备时请求的。例如，图 74-1 显示了在通过 Google Play 安装应用期间寻求各种权限的典型屏幕。\n\
  \n![](img/Image24256.jpg)\n图 74-1\n\n对于许多类型的权限，这种场景对于 Android 6.0 或更高版本上的应用仍然适用。由于这些权限被称为**普通权限**（normal\
  \ permissions），仍然要求用户在安装时接受。第二种类型的权限被称为**危险权限**（dangerous permissions），它们也必须像普通权限一样在清单文件（manifest\
  \ file）中声明，但在应用程序首次启动时也必须向用户请求。当发出此类请求时，它将以对话框的形式出现，如图图 74-2 所示\n\n![](img/Image24346.jpg)\n\
  图 74-2\n\n属于危险类的权限完整列表包含在表 74-4 中：\n\n| 权限组 | 权限 |\n| :--- | :--- |\n| 日历 | READ_CALENDARWRITE_CALENDAR\
  \ |\n| 相机 | CAMERA |\n| 联系人 | READ_CONTACTSWRITE_CONTACTSGET_ACCOUNTS |\n| 位置 |\
  \ ACCESS_FINE_LOCATIONACCESS_COARSE_LOCATION |\n| 麦克风 | RECORD_AUDIO |\n| 电话 | READ_PHONE_STATECALL_PHONEREAD_CALL_LOGWRITE_CALL_LOGADD_VOICEMAILUSE_SIPPROCESS_OUTGOING_CALLS\
  \ |\n| 传感器 | BODY_SENSORS |\n| 短 | SEND_SMSRECEIVE_SMSREAD_SMSRECEIVE_WAP_PUSHRECEIVE_MMS\
  \ |\n| 存储 | READ_EXTERNAL_STORAGEWRITE_EXTERNAL_STORAGE |\n表 74-4\n\n### 7.2 创建权限示例项目\n\
  \n从欢迎屏幕上选择 Create New Project（创建新项目）快速启动选项，在生成的新项目对话框中，在点击 Next（下一步）按钮之前，选择 Empty\
  \ Activity（空活动）模板。\n\n在 Name（名称）字段中输入`PermissionDemo`，并指定`com.ebookfrenzy.permissiondemo`为包名。在点击\
  \ Finish（完成）按钮之前，将 Minimum API level（最低 API 级别）设置更改为`API 26: Android 8.0 (Oreo)`，并将\
  \ Language（语言）菜单更改为 Java。\n\n### 7.3 检查权限\n\nAndroid Support Library 包含许多方法，可以在\
  \ Android 应用代码中查找和管理危险权限。无论应用运行的 Android 版本如何，执行这些 API 调用都是安全的，但只有在 Android 6.0\
  \ 或更高版本上执行时，它们才会执行有意义的任务。\n\n在应用尝试使用需要危险权限批准的功能之前，无论之前是否授予了权限，代码都必须检查权限是否已授予。这可以通过调用`ContextCompat`类的`checkSelfPermission()`方法来实现，并将当前活动的引用和请求的权限作为参数传递。该方法将检查权限之前是否已授予，并返回一个与`PackageManager.PERMISSION_GRANTED`或`PackageManager.PERMISSION_DENIED`匹配的整数值。\n\
  \n在示例项目的`MainActivity.java`文件中，修改代码以检查是否已授予应用录音的权限：\n\n```java\npackage com.ebookfrenzy.permissiondemoactivity;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\nimport androidx.core.content.ContextCompat;\n\
  import android.os.Bundle;\nimport android.Manifest;\nimport android.content.pm.PackageManager;\n\
  import android.util.Log;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private static final String TAG = \"PermissionDemo\";\n\n    @Override\n\
  \    protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.activity_permission_demo);\n        setupPermissions();\n\
  \    }\n\n    private void setupPermissions() {\n        int permission = ContextCompat.checkSelfPermission(this,\n\
  \                Manifest.permission.RECORD_AUDIO);\n        if (permission != PackageManager.PERMISSION_GRANTED)\
  \ {\n            Log.i(TAG, \"Permission to record denied\");\n        }\n    }\n\
  }\n```\n\n在运行 6.0 之前的 Android 版本的设备或模拟器上运行应用并检查 Logcat。应用启动后，Logcat 输出应包含“Permission\
  \ to denied”。编辑`AndroidManifest.xml`文件（位于 Project 窗口下的 manifests 文件夹），并添加一行来请求权限，如下：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    package=\"com.ebookfrenzy.permissiondemo\"\
  >\n    <uses-permission android:name=\"android.permission.RECORD_AUDIO\" />\n  \
  \  <application android:allowBackup=\"true\"\n        android:icon=\"@mipmap/ic_launcher\"\
  \n        android:label=\"@string/app_name\"\n        android:supportsRtl=\"true\"\
  \n        android:theme=\"@style/AppTheme\">\n        <activity android:name=\"\
  .MainActivity\">\n            <intent-filter>\n                <action android:name=\"\
  android.intent.action.MAIN\" />\n                <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n\
  ```\n\n编译并运行应用一次，注意这次没有出现权限信息。显然，在旧版本 Android 上请求此权限所需的工作已经完成。然而，在运行 6.0 或更高版本的设备或模拟器上运行应用，注意尽管权限已添加到清单文件中，检查仍然报告权限被拒绝。这是因为\
  \ Android 6 及更高版本要求应用在运行时请求权限。\n\n### 7.4 在运行时请求权限\n\n通过调用`ActivityCompat`类的`requestPermissions()`方法发出权限请求。当调用此方法时，权限请求将被异步处理，并在任务完成后调用一个名为`onRequestPermissions()`的方法。\n\
  \n`requestPermissions()`方法的参数是当前活动的引用、所请求的权限标识符以及请求代码（request code）。请求代码可以是任意整数值，并将用于标识是哪个请求触发了`onRequestPermissions()`方法的调用。修改`MainActivity.java`文件以声明请求代码并在权限检查失败时请求权限：\n\
  \n```java\nimport androidx.core.app.ActivityCompat;\n\n// ... 在 MainActivity 类内部\
  \ ...\n    private static final String TAG = \"PermissionDemo\";\n    private static\
  \ final int RECORD_REQUEST_CODE = 101;\n\n    @Override\n    private void setupPermissions()\
  \ {\n        int permission = ContextCompat.checkSelfPermission(this,\n        \
  \        Manifest.permission.RECORD_AUDIO);\n        if (permission != PackageManager.PERMISSION_GRANTED)\
  \ {\n            Log.i(TAG, \"Permission to record denied\");\n            makeRequest();\n\
  \        }\n    }\n\n    protected void makeRequest() {\n        ActivityCompat.requestPermissions(this,\n\
  \                new String[]{Manifest.permission.RECORD_AUDIO},\n             \
  \   RECORD_REQUEST_CODE);\n    }\n```\n\n\n\n\n\n接下来，实现 `onRequestPermissionsResult()`\
  \ 方法，其代码如下：\n\n```java\n@Override\npublic void onRequestPermissionsResult(int requestCode,\n\
  \                                     String permissions[], int[] grantResults)\
  \ {\n    switch (requestCode) {\n        case RECORD_REQUEST_CODE: {\n         \
  \   if (grantResults.length == 0\n                    || grantResults[0] !=\n  \
  \                          PackageManager.PERMISSION_GRANTED) {\n              \
  \  Log.i(TAG, \"Permission has been denied by user\");\n            } else {\n \
  \               Log.i(TAG, \"Permission has been granted by user\");\n         \
  \   }\n        }\n    }\n}\n```\n\n在 Android 6 或更高版本的模拟器或设备上编译并运行该应用，并注意会出现如图 74-3\
  \ 所示的请求录制音频权限的对话框：\n\n![](img/as_4.1_permission_request.jpg)\n图 74-3\n\n点击“在使用应用时”（While\
  \ using the app）按钮，并检查 Logcat 面板是否出现了“用户已授权”（Permission has been granted by user）的消息。\n\
  \n一旦用户授予了请求的权限，在未来的应用调用中，`checkSelfPermission()` 方法将返回 `PERMISSION_GRANTED` 结果，直到用户卸载并重新安装应用，或者在设置中更改了该应用的权限。\n\
  \n## 74.5 为权限请求提供理由\n\n如图 74-3 所示，用户可以选择拒绝请求的权限。在这种情况下，每当用户启动应用时，应用都将继续请求该权限，除非用户在点击“拒绝”（Deny）按钮之前选择了“不再再次询问”（Never\
  \ ask again）选项。用户多次拒绝可能意味着用户不理解为什么应用需要该权限。因此，如果在发出请求时解释了需求的原因，用户可能会更有可能授予权限。遗憾的是，无法更改请求对话框的内容以包含此类解释。\n\
  \n最好是将解释包含在一个独立的对话框中，该对话框可以在向用户展示请求对话框之前。这引发了何时显示此解释对话框的问题。Android 文档建议，仅在用户之前拒绝过权限的情况下才显示解释对话框，并提供了一种方法来识别何时这种情况。\n\
  \n调用 `ActivityCompat` 类的 `shouldShowRequestPermissionRationale()` 方法时，如果用户之前拒绝过对特定权限的请求，将返回\
  \ `true` 结果；如果之前没有请求过，则返回 `false` 结果。在结果为 `true` 的情况下，应用应该显示一个包含权限理由的对话框，一旦用户阅读并关闭了对话框，应重复权限请求。\n\
  \n要向示例应用添加此功能，请修改 `onCreate()` 方法使其内容如下：\n\n```java\nimport android.app.AlertDialog;\n\
  import android.content.DialogInterface;\n\nprivate void setupPermissions() {\n \
  \   int permission = ContextCompat.checkSelfPermission(this,\n            Manifest.permission.RECORD_AUDIO);\n\
  \    if (permission != PackageManager.PERMISSION_GRANTED) {\n        Log.i(TAG,\
  \ \"Permission to record denied\");\n        if (ActivityCompat.shouldShowRequestPermissionRationale(this,\n\
  \                Manifest.permission.RECORD_AUDIO)) {\n            AlertDialog.Builder\
  \ builder =\n                    new AlertDialog.Builder(this);\n            builder.setMessage(\"\
  Permission to access the microphone is required for this app to record audio.\"\
  )\n                    .setTitle(\"Permission required\");\n            builder.setPositiveButton(\"\
  OK\",\n                    new DialogInterface.OnClickListener() {\n           \
  \             public void onClick(DialogInterface dialog, int id) {\n          \
  \                  Log.i(TAG, \"Clicked\");\n                            makeRequest();\n\
  \                        }\n                    });\n            AlertDialog dialog\
  \ = builder.create();\n            dialog.show();\n        } else {\n          \
  \  makeRequest();\n        }\n    }\n}\n```\n\n该方法仍然检查权限是否已授予，但现在还会识别是否需要显示理由。如果用户之前拒绝了请求，则会显示一个包含解释和\
  \ OK 按钮的对话框，并在该按钮上配置了监听器来调用 `makeRequest()`。如果之前没有进行权限请求，代码将直接跳转到请求权限。\n\n## 74.6\
  \ 测试权限应用\n\n在执行测试的 Android 6 或更高设备或模拟器会话上，启动“设置”应用，选择“应用与通知”（Apps & notifications）选项，向下滚动并选择“PermissionDemo”应用。在应用设置屏幕上，点击“卸载”按钮从设备中移除应用。\n\
  \n再次运行应用，当权限请求对话框出现时，点击“拒绝”（Deny）按钮。停止并重启应用，验证理由对话框是否出现。点击“OK”按钮，当权限请求对话框出现时，点击“允许”（Allow）按钮。\n\
  \n返回“设置”应用，选择“应用”选项并再次从列表中选择“PermissionDemo”应用。一旦列出应用设置，验证“权限”（Permissions）部分是否列出了“麦克风”权限：\n\
  \n![](img/as_3.5_settings_app_permission.jpg)\n图 74-4\n\n## 74.7 总结\n\n在 Android\
  \ 6.0 引入之前，应用请求访问某些功能的唯一必要步骤是在应用程序清单文件（manifest）中添加适当的行。用户在安装应用时将会被提示批准权限。对于大多数权限来说仍然如此，但一组被认为是“危险”的权限除外。被认为是危险的权限具有允许应用违反用户隐私的潜力，例如允许访问麦克风、联系人列表。\n\
  \n\n\n\n\n- `pause()` – 暂停播放。可以通过调用 `resume()` 方法恢复播放。\n- `stop()` – 停止播放。\n- `setVolume()`\
  \ – 接收两个浮点数参数，指定左、右通道的播放量。\n- `resume()` – 恢复之前暂停的播放会话。\n- `reset()` – 重置媒体播放器实例的状态。本质上是将实例重置为未初始化状态。至少，重置后的播放器需要重新设置数据源并调用\
  \ `prepare()` 方法。\n- `release()` – 在不再需要该播放器实例时调用。此方法确保播放器所持有的任何资源都被释放。\n\n在典型的实现中，应用程序将实例化\
  \ `MediaPlayer` 类的实例，设置要播放的音频源，然后调用 `prepare()` 随后调用 `start()`。例如：\n\n```java\n\
  MediaPlayer mediaPlayer = new MediaPlayer();\nmediaPlayer.setDataSource(\"https://www.yourcompany.com/myaudio.mp3\"\
  );\nmediaPlayer.prepare();\nmediaPlayer.start();\n```\n\n## 75.2 使用 MediaRecorder\
  \ 类录制音频和视频\n\n与音频播放一样，录制可以使用多种不同的技术完成。一种选择是使用 `MediaRecorder` 类，与 `MediaPlayer`\
  \ 类一样，它提供了许多用于录制音频的方法：\n\n- `setAudioSource()` – 指定要录制的音频源（通常对于设备麦克风，这将会是 `MediaRecorder.AudioSource.MIC`）。\n\
  - `setVideoSource()` – 指定要录制的视频源（例如 `MediaRecorder.VideoSource.CAMERA`）。\n- `setOutputFormat()`\
  \ – 指定录制的音频或视频存储的格式（例如 `MediaRecorder.OutputFormat.AAC_ADTS`）。\n- `setAudioEncoder()`\
  \ – 指定用于录制音频的音频编码器（例如 `MediaRecorder.AudioEncoder.AAC`）。\n- `setOutputFile()` –\
  \ 配置存储录制音频或视频的文件路径。\n- `prepare()` – 准备 `MediaRecorder` 实例以开始录制。\n- `start()` –\
  \ 开始录制过程。\n- `stop()` – 停止录制过程。一旦录制器停止，在重新启动之前需要完全重新配置并准备。\n- `reset()` – 重置录制器。实例在重新启动之前需要完全重新配置并准备。\n\
  - `release()` – 在录制器实例不再需要时调用。此方法确保实例持有的所有资源都被释放。\n\n使用此类的典型实现将设置源、输出、编码格式以及输出文件。然后将调用\
  \ `prepare()` 和 `start()` 方法。录制结束时将调用 `stop()` 方法，随后调用 `reset()` 方法。当应用程序不再需要录制器实例时，建议调用\
  \ `release()` 方法：\n\n```java\nMediaRecorder mediaRecorder = new MediaRecorder();\n\
  mediaRecorder.setAudioSource(MediaRecorder.AudioSource.MIC);\nmediaRecorder.setOutputFormat(MediaRecorder.OutputFormat.AAC_ADTS);\n\
  mediaRecorder.setAudioEncoder(MediaRecorder.AudioEncoder.AAC);\nmediaRecorder.setOutputFile(audioFilePath);\n\
  mediaRecorder.prepare();\nmediaRecorder.start();\n// ...\nmediaRecorder.stop();\n\
  mediaRecorder.reset();\nmediaRecorder.release();\n```\n\n为了录制音频，应用程序的清单文件必须包含 `android.permission.RECORD_AUDIO`\
  \ 权限：\n\n```xml\n<uses-permission android:name=\"android.permission.RECORD_AUDIO\"\
  \ />\n```\n\n正如“在 Android 中请求运行时权限”章节概述的那样，访问麦克风属于危险权限范畴。因此，为了支持 Android 6，在应用程序启动时必须对麦克风访问进行特定请求，这些步骤将在本章后续部分介绍。\n\
  \n## 75.3 关于示例项目\n\n本章的剩余部分将通过创建一个示例应用程序，旨在演示使用 `MediaPlayer` 和 `MediaRecorder`\
  \ 类在 Android 设备上实现音频的录制和播放。\n\n在开发使用特定硬件功能的应用程序时（麦克风就是一个例子），在尝试代码尝试访问该功能之前，检查该功能的可用性是重要的。因此，本章创建的应用程序还将包含检测设备上是否存在麦克风的代码。\n\
  \n完成后，该应用程序将提供一个非常简单的界面，允许用户录制和播放音频。录制的音频需要存储在设备上的音频文件中。既然如此，本教程还将简要探索使用 SD 卡存储的机制。\n\
  \n## 75.4 创建 AudioApp 项目\n\n从欢迎界面选择创建新项目（Create New Project）快速启动选项，在生成的项目项目对话框中，点击下一步（Next）按钮之前选择空活动（Empty\
  \ Activity）模板。\n\n在`Name`字段中输入 `AudioApp`，并指定 `com.ebookfrenzy.audioapp` 为包名。在点击完成（Finish）按钮之前，将最低\
  \ API 级别设置为 `API 26: Android 8.0 (Oreo)`，并将语言菜单改为 Java。\n\n## 75.5 设计用户界面\n\n创建新项目后，从项目工具窗口选择\
  \ `activity_main.xml` 文件，并在设计模式下使用布局编辑器工具，选择“Hello World!” `TextView` 并将其从布局中删除。\n\
  \n将三个 `Button` 视图拖放到布局中。按钮的位置对于本示例来说并不至关重要，但图 75-1 显示了使用垂直链的建议布局。\n\n为按钮配置显示 `Play`、`Record`\
  \ 和 `Stop` 的字符串资源，并分别为它们赋予 ID `playButton`、`recordButton` 和 `stopButton`。\n\n选择\
  \ Play 按钮，并在属性面板中配置 `onClick` 属性调用 `playAudio`。重复这些步骤配置剩余按钮调用 `recordAudio` 和 `stopAudio`。\n\
  \n## 75.6 检查麦克风可用性\n\n在没有麦克风的设备上尝试录音会导致 Android 系统抛出异常。因此，代码在进行此类尝试之前检查麦克风的存在至关重要。有许多种方法，包括检查设备的物理存在。另一种更简单且可能适用于不同设备的方法询问\
  \ Android 系统是否安装了特定功能的包。这涉及创建 `PackageManager` 类的实例，然后调用对象的 `hasSystemFeature()`\
  \ 方法。`PackageManager.FEATURE_MICROPHONE` 是本例中感兴趣的功能。\n\n为了本示例，我们将创建一个名为 `hasMicrophone()`\
  \ 的方法，并在调用以检查麦克风的存在。在项目工具窗口中，找到并双击 `MainActivity.java` 文件并进行修改以添加此方法：\n\n```java\n\
  package com.ebookfrenzy.audioapp;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  import android.content.pm.PackageManager;\nimport android.os.Bundle;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_audio_app);\n\
  \    }\n\n    protected boolean hasMicrophone() {\n        PackageManager pmanager\
  \ = this.getPackageManager();\n        return pmanager.hasSystemFeature(\n     \
  \       PackageManager.FEATURE_MICROPHONE);\n    }\n}\n```\n\n\n\n\n下一步是修改该活动以执行若干初始化任务。在\
  \ `MainActivity.java` 文件中，按照如下方式修改代码：\n\n```java\npackage com.ebookfrenzy.audioapp;\n\
  \nimport java.io.IOException;\n\n.\n\n.\n\nimport android.media.MediaRecorder;\n\
  import android.os.Environment;\nimport android.widget.Button;\nimport android.view.View;\n\
  import android.media.MediaPlayer; \n\npublic class MainActivity extends AppCompatActivity\
  \ {\n\n    private static MediaRecorder mediaRecorder;\n    private static MediaPlayer\
  \ mediaPlayer;\n    private static String audioFilePath;\n    private Button stopButton;\n\
  \    private Button playButton;\n    private Button recordButton;\n    private boolean\
  \ isRecording = false;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_audio_app);\n\
  \        audioSetup();\n    }\n\n    private void audioSetup()\n    {\n        recordButton\
  \ = findViewById(R.id.recordButton);\n        playButton = findViewById(R.id.playButton);\n\
  \        stopButton = findViewById(R.id.stopButton);\n        if (!hasMicrophone())\n\
  \        {\n            stopButton.setEnabled(false);\n            playButton.setEnabled(false);\n\
  \            recordButton.setEnabled(false);\n        } else {\n            playButton.setEnabled(false);\n\
  \            stopButton.setEnabled(false);\n        }\n        audioFilePath =\n\
  \            this.getExternalFilesDir(Environment.DIRECTORY_MUSIC).getAbsolutePath()\
  \ + \"/myaudio.3gp\";\n    }\n.\n\n.\n\n}\n```\n\n新增的代码首先获取用户界面中三个按钮视图的引用。接下来，调用之前实现的\
  \ `hasMicrophone()` 方法来确定设备是否包含麦克风。如果不包含，则会禁用所有按钮；否则，仅禁用 `Stop`（停止）和 `Play`（播放）按钮。\n\
  \n下一行代码需要进一步的解释：\n\n`audioFilePath = this.getExternalFilesDir(Environment.DIRECTORY_MUSIC).getAbsolutePath()\
  \ + \"/myaudio.3gp\";`\n\n这段代码的目的是识别设备上外部存储的位置（尽管在许多 Android 设备上它是内部的，但仍被称为外部存储），并利用该位置创建一个名为\
  \ `myaudio.3gp` 的文件路径，音频录制将存储其中。`getExternalFilesDir()` 方法的参数是所需的存储类型（在本例中，我们请求音乐目录的路径，但也提供了播客、有声书、电影、图片等选项）。\n\
  \n在处理外部存储工作时，必须意识到，执行的此类活动需要在应用程序清单文件中请求权限。例如：\n\n```xml\n<uses-permission android:name=\"\
  android.permission.WRITE_EXTERNAL_STORAGE\" />\n```\n\n### 75.8 实现 recordAudio()\
  \ 方法\n\n当用户触摸 Record（录音）按钮时，将调用 `recordAudio()` 方法。该方法需要启用和禁用相应的按钮，并配置 `MediaRecorder`\
  \ 实例，其包含有关音频源、输出格式和编码，以及要存储音频的文件位置的信息。最后，需要调用 `MediaRecorder` 对象的 `prepare()` 和\
  \ `start()` 方法。这些要求共同构成了 `MainActivity.java` 文件中的以下方法实现：\n\n```java\npublic void\
  \ recordAudio (View view)\n{\n    isRecording = true;\n    stopButton.setEnabled(true);\n\
  \    playButton.setEnabled(false);\n    recordButton.setEnabled(false);\n    try\
  \ {\n        mediaRecorder = new MediaRecorder();\n        mediaRecorder.setAudioSource(MediaRecorder.AudioSource.MIC);\n\
  \        mediaRecorder.setOutputFormat(MediaRecorder.OutputFormat.THREE_GPP);\n\
  \        mediaRecorder.setOutputFile(audioFilePath);\n        mediaRecorder.setAudioEncoder(MediaRecorder.AudioEncoder.AMR_NB);\n\
  \        mediaRecorder.prepare();\n    } catch (Exception e) {\n        e.printStackTrace();\n\
  \    }\n    mediaRecorder.start();\n}\n```\n\n### 75.9 实现 stopAudio() 方法\n\n`stopAudio()`\
  \ 方法负责启用 Play 按钮、禁用 Stop 按钮，然后停止并重置 `MediaRecorder` 实例。实现此点的代码如下所示，并应被添加到 `MainActivity.java`\
  \ 文件中：\n\n```java\npublic void stopAudio (View view)\n{\n    stopButton.setEnabled(false);\n\
  \    playButton.setEnabled(true);\n    if (isRecording)\n    {\n        recordButton.setEnabled(false);\n\
  \        mediaRecorder.stop();\n        mediaRecorder.release();\n        mediaRecorder\
  \ = null;\n        isRecording = false;\n    } else {\n        mediaPlayer.release();\n\
  \        mediaPlayer = null;\n        recordButton.setEnabled(true);\n    }\n}\n\
  ```\n\n### 75.10 实现 playAudio() 方法\n\n`playAudio()` 方法将创建一个新的 `MediaPlayer` 实例，将位于\
  \ SD 卡上的音频文件指定为数据源，然后准备并开始播放：\n\n```java\npublic void playAudio (View view) throws\
  \ IOException\n{\n    playButton.setEnabled(false);\n    recordButton.setEnabled(false);\n\
  \    stopButton.setEnabled(true);\n    mediaPlayer = new MediaPlayer();\n    mediaPlayer.setDataSource(audioFilePath);\n\
  \    mediaPlayer.prepare();\n    mediaPlayer.start();\n}\n```\n\n### 75.11 配置并请求权限\n\
  \n在测试应用程序之前，必须在清单文件中为应用程序请求适当权限。具体而言，应用程序需要录制音频和访问外部存储（SD 卡）的权限。在 Project 工具窗口中，找到并双击\
  \ `AndroidManifest.xml` 文件将其加载到编辑器中，并修改 XML 添加两个权限标签：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.audioapp\" >\n    <uses-permission android:name=\"\
  android.permission.WRITE_EXTERNAL_STORAGE\" />\n    <uses-permission android:name=\"\
  android.permission.RECORD_AUDIO\" />\n    <application\n.\n```\n\n上述步骤将足以确保用户在运行\
  \ Android 6.0 之前的版本的设备上安装应用时启用这些权限。麦克风访问和外部存储访问在 Android 中被归类为“危险”权限，因为它们使应用程序具有损害用户隐私的可能。因此，为了让示例应用在\
  \ Android 6 或更高版本的设备上运行，需要添加代码在运行时专门请求这两个权限。\n\n\n\n通过本书中“在 Android 中请求运行时权限”章节中概述的步骤，上述方法在发起请求之前会验证指定的权限是否已经授予，并将识别码作为参数传递。\n\
  \n当请求处理完毕后，活动（activity）将调用 `onRequestPermissionsResult()` 方法，并传递识别码和请求结果。因此，下一步是在\
  \ `MainActivity.java` 文件中如下所示实现该方法：\n\n```java\n@Override\npublic void onRequestPermissionsResult(int\
  \ requestCode, String permissions[], int[] grantResults) {\n    switch (requestCode)\
  \ {\n        case RECORD_REQUEST_CODE: {\n            if (grantResults.length ==\
  \ 0\n                    || grantResults[0] !=\n                        PackageManager.PERMISSION_GRANTED)\
  \ {\n                recordButton.setEnabled(false);\n                Toast.makeText(this,\n\
  \                        \"Record permission required\",\n                     \
  \   Toast.LENGTH_LONG).show();\n            } else {\n                requestPermission(\n\
  \                        Manifest.permission.WRITE_EXTERNAL_STORAGE,\n         \
  \               STORAGE_REQUEST_CODE);\n            }\n            return;\n   \
  \     }\n        case STORAGE_REQUEST_CODE: {\n            if (grantResults.length\
  \ == 0\n                    || grantResults[0] !=\n                        PackageManager.PERMISSION_GRANTED)\
  \ {\n                recordButton.setEnabled(false);\n                Toast.makeText(this,\n\
  \                        \"External Storage permission required\",\n           \
  \             Toast.LENGTH_LONG).show();\n            }\n        }\n    }\n}\n```\n\
  \n上述代码通过检查请求识别码，在检查相应权限是否授予之前识别是哪个权限请求返回的。如果用户授予了访问麦克风的权限，代码将请求访问外部存储。如果任何一个权限被拒绝，将向用户显示消息，指示应用将无法运行。在这两种情况下，录制按钮都会被禁用。在测试应用之前，剩下的工作是在应用启动时，调用新添加的麦克风访问\
  \ `requestPermission()` 方法。在 `MainActivity.java` 文件中，将 `audioSetup()` 方法修改如下：\n\n\
  ```java\nprivate void audioSetup(){\n    recordButton = findViewById(R.id.recordButton);\n\
  \    playButton = findViewById(R.id.playButton);\n    stopButton = findViewById(R.id.stopButton);\n\
  \    if (!hasMicrophone()) {\n        stopButton.setEnabled(false);\n        playButton.setEnabled(false);\n\
  \        recordButton.setEnabled(false);\n    } else {\n        playButton.setEnabled(false);\n\
  \        stopButton.setEnabled(false);\n    }\n    audioFilePath = Environment.getExternalStorageDirectory()\n\
  \            .getAbsolutePath() + \"/myaudio.3gp\";\n    requestPermission(Manifest.permission.RECORD_AUDIO,\
  \ RECORD_REQUEST_CODE);\n}\n```\n\n### 5.12 测试应用程序\n在带有麦克风的 Android 设备上编译并运行应用程序，允许请求的权限并点击\
  \ Record 按钮。录制后，点击 Play，此时录制的音频应通过设备扬声器播放。如果在 Android 6.0 或更高版本上运行，请注意应用会请求使用外部存储来录制音频。\n\
  \n### 5.13 总结\nAndroid SDK 提供了多种实现音频录制和播放的机制。本章以 `MediaPlayer` 和 `MediaRecorder`\
  \ 类的形式查看了其中两种。在涵盖了使用这些技术的理论后，本章演示了一个用于录制并播放音频的示例应用程序的创建。在 Android 中处理音频的过程中，本章还查看了在尝试录制音频之前，确保运行应用的设备具有麦克风的步骤。还涵盖了以\
  \ SD 卡形式使用外部存储的内容。\n\n### 6 在 Android Studio 中与 Google Maps API 工作\n当 Google 在多年前决定引入地图服务时，很难说他们是否预料过会有一个可以集成到移动应用程序的版本。当\
  \ 2005 年推出最终成为 Google Maps 的第一个基于 Web 版本时，iPhone 尚未引发智能手机革命，而那家开发 Android 操作系统的公司在另外六个月后才被\
  \ Google 收购。无论 Google 对 Google Maps 的未来有何种愿景，考虑到现在可以通过 Google Maps Android API 直接通过\
  \ Android 应用程序访问 Google Maps 的所有功能是非常令人惊的。\n\n本章旨在提供 Google Maps 系统和 Google Maps\
  \ Android API 的概述。本章将概述组成 API 的不同元素，详细介绍配置开发环境以用于 Google Maps 的必要步骤，然后通过一些代码示例演示\
  \ Google Maps 集成的一些基础知识。\n\n#### 6.1 Google Maps Android API 的元素\nGoogle Maps Android\
  \ API 由一组核心类组成，这些类组合在一起在 Android 应用程序中提供地图功能。地图的关键元素如下：\n\n*   `GoogleMap`：Google\
  \ Maps Android API 的主类。该类负责下载和显示地图瓦片，并显示和响应地图控件。`GoogleMap` 对象不是由应用程序直接创建的，而是在创建\
  \ `MapView` 或 `MapFragment` 实例时创建的。可以在应用程序代码中通过调用 `MapView`、`MapFragment` 或 `SupportMapFragment`\
  \ 实例的 `getMap()` 方法获取 `GoogleMap` 引用。\n*   `MapView`：`View` 类的子类，该类提供了画布，`GoogleMap`\
  \ 对象在其上绘制地图，允许将地图放置在活动（activity）的用户界面布局中。\n*   `SupportMapFragment`：`Fragment` 类的子类，该类允许在\
  \ Android 布局的 Fragment 中放置地图。\n*   `Marker`：`Marker` 类的作用是在地图上标记位置。通过获取与地图关联的 `GoogleMap`\
  \ 对象，然后调用该对象实例的 `addMarker()` 方法，可以将标记添加到地图中。标记的位置通过 `Longitude`（经度）和 `Latitude`（纬度）定义。可以通过多种方式配置标记，包括指定标题、文本和图标。标记还可以被设置为“可拖拽”，允许用户将标记移动到地图上的不同位置。\n\
  *   `Shapes`：通过使用 `Polyline`、`Polygon` 和 `Circle` 类可以在地图上绘制线条和形状。\n*   `UiSettings`：`UiSettings`\
  \ 类允许从应用程序内部控制地图上显示的用户界面控件。例如，使用该类应用程序可以控制缩放、当前位置和指南针控件是否显示在地图上。该类还可以用于配置地图识别哪些触摸屏幕手势。\n\
  *   `My Location Layer`：启用后，My Location Layer 在地图上显示一个按钮，用户选择后将地图中心置于用户当前的地理位置。如果用户静止，该位置在地图上由蓝色标记表示。如果用户正在移动，该位置由指示用户移动方向的箭头表示。\n\
  \n\n\n\n\n熟悉 Google Maps Android API 的最佳方法是通过示例进行操作。本章的剩余部分将创建一个基于 Google Maps 的应用程序，同时突出\
  \ API 的关键区域。\n\n## 76.2 创建 Google Maps 项目\n\n从欢迎界面选择 `Create New Project`（创建新项目）快速启动选项，在弹出的新项目对话框中，点击\
  \ `Next`（下一步）按钮之前，选择 `Google Maps Activity` 模板。\n\n在 `Name` 字段中输入 `MapDemo` 并指定\
  \ `com.ebookfrenzy.mapdemo` 为包名。在点击 `Finish`（完成）按钮之前，将 `Minimum API level` 设置更改为\
  \ `API 26: Android 8.0 (Oreo)`，并将 `Language` 菜单设置为 `Java`。\n\n## 76.3 获取您的开发者签名\n\
  \n在应用程序可以使用 Google Maps Android API 之前，必须首先在 Google APIs 控制台中进行注册。然而，在注册应用程序之前，必须识别与您的开发环境相关的开发者签名（也称为\
  \ `SHA-1 fingerprint`）。该签名包含在位于主目录下 `.android` 子目录下的 keystore 文件中，可以使用 Java SDK\
  \ 提供的 `keytool` 实用程序获取。为了方便操作，当在项目创建过程中选择 `Google Maps Activity` 时，Android Studio\
  \ 会向项目添加一些额外文件。其中一个文件名为 `google_maps_api.xml`，位于项目的 `app -> res -> values` 文件夹中。\n\
  \n`google_maps_api.xml` 文件包含指向 Google 开发者控制的链接。将此链接复制并粘贴到浏览器窗口中。加载后，将出现如下页面：\n\n\
  ![](img/Image24274.jpg)\n\n图 76-1\n\n在点击 `Continue`（继续）按钮之前，确认菜单设置为 `Create a new\
  \ project`（创建一个项目）。启用 API 后，点击 `Create API Key`（创建 API 密钥）按钮。稍等片将创建新项目并出现一个面板（图\
  \ 76-2），提供应用程序的 API 密钥。\n\n![](img/Image24364.jpg)\n\n图 76-2\n\n复制此密钥，返回 Android\
  \ Studio 并 API 密钥粘贴到文件的 `YOUR_KEY_HERE` 部分：\n\n```xml\n<string name=\"google_maps_key\"\
  \ntemplateMergeStrategy=\"preserve\" translatable=\"false\">YOUR_KEY_HERE</string>\n\
  ```\n\n## 76.4 添加 Apache HTTP Legacy 库需求\n\n由于此示例项目将为 Android 9.0 或更高版本构建，需要在 `AndroidManifest.xml`\
  \ 文件的 `<application>` 部分内按如下所示添加声明：\n\n```xml\n<application\n    android:allowBackup=\"\
  true\"\n    android:icon=\"@mipmap/ic_launcher\"\n    android:label=\"@string/app_name\"\
  \n    android:roundIcon=\"@mipmap/ic_launcher_round\"\n    android:supportsRtl=\"\
  true\"\n    android:theme=\"@style/Theme.MapDemo\">\n    <uses-library\n       \
  \ android:name=\"org.apache.http.legacy\"\n        android:required=\"false\" />\n\
  </application>\n```\n\n## 76.5 测试应用程序\n\n对应用程序进行测试运行以验证 API 密钥是否配置正确。假设配置正确，应用程序将运行并在屏幕上显示地图。\n\
  \n如果未显示地图，请检查以下区域：\n\n- 如果应用程序运行在模拟器上，请确保模拟器运行的是包含 Google APIs 的 Android 版本。可以通过选择\
  \ `Tools -> Android -> AVD Manager` 菜单选项更改 AVD 配置的操作系统，点击 AVD Actions 列中的铅笔图标，然后点击当前\
  \ Android 版本旁边的 `Change…` 按钮。在系统镜像对话框中，选择包含 Google APIs 的目标。\n- 检查 `Logcat` 输出是否存在任何与\
  \ Google Maps API 身份验证问题相关。这通常意味着 API 密钥输入错误，或者应用程序包名与生成 API 密钥时指定的名称不匹配。\n- 在 Google\
  \ API 控制台中验证 `Services` 面板中是否已启用 Google Maps Android API。\n\n## 76.6 了解地理编码与反向地理编码\n\
  \n如果不先介绍地理编码（Geocoding）主题，就无法谈论地图和地理位置。地理编码可以最好描述为将基于文本的地理位置（如街道地址）转换为以经纬度表示的地理坐标的过程。\n\
  \n可以使用 Android 的 `Geocoder` 类来实现地理编码。例如可以向 `Geocoder` 类的实例传递一个表示位置的字符串，如城市名称、街道地址或机场代码。`Geocoder`\
  \ 将尝试查找位置的匹配项并返回 `Address` 对象列表。\n\n例如，以下代码请求国家航空博物馆的位置：\n\n```java\nimport java.io.IOException;\n\
  import java.util.List;\nimport android.location.Address;\nimport android.location.Geocoder;\n\
  \ndouble latitude;\ndouble longitude;\nList<Address> geocodeMatches = null;\ntry\
  \ {\n    geocodeMatches = new Geocoder(this).getFromName(\"600 Independence SW,\
  \ Washington, DC\", 1);\n} catch (IOException e) {\n    e.printStackTrace();\n}\n\
  \nif (!geocodeMatches.isEmpty()) {\n    latitude = geocodeMatches.get(0).getLatitude();\n\
  \    longitude = geocodeMatches.get(0).getLongitude();\n}\n```\n\n注意，值 `1` 被作为参数传递给\
  \ `getFromName()` 方法。这仅仅是告诉 `Geocoder` 只返回一个结果。然而，对于模糊的位置名称，可能需要请求更多潜在匹配项并允许用户选择正确的项。\n\
  \n上面的代码是正向地理编码（forward-geocoding）的示例，坐标是基于文本位置计算的。反向地理编码（reverse-geocoding）顾其名，涉及将地理坐标转换为人类可读的地址。考虑以下代码：\n\
  \n```java\nimport java.io.IOException;\nimport java.util.List;\nimport android.location.Address;\n\
  import android.location.Geocoder;\n\nList<Address> geocodeMatches = null;\nString\
  \ Address1;\nString Address2;\nString State;\nString Zipcode;\nString Country;\n\
  try {\n    geocodeMatches = new Geocoder(this).getFromLocation(38.8874245, -77.0200729,\
  \ 1);\n} catch (IOException e) {\n    e.printStackTrace();\n}\n\nif (!geocodeMatches.isEmpty())\
  \ {\n    Address1 = geocodeMatches.get(0).getAddressLine(0);\n    Address2 = geocodeMatches.get(0).getAddressLine(1);\n\
  \    State = geocodeMatches.get(0).getAdminArea();\n    Zipcode = geocodeMatches.get(0).getPostalCode();\n\
  \    Country = geocodeMatches.get(0).getCountryName();\n}\n```\n\n在这种情况下，通过 `getFromLocation()`\
  \ 方法使用经度和纬度值初始化 `Geocoder` 对象。再次请求请求单个匹配结果。\n\n应该注意，地理编码并非实际上在 Android 设备上执行，而是在服务器上执行的，设备在需要翻译时连接到该服务器，并在翻译完成后返回结果。因此，地理编码只有在设备连接到互联网时才能进行。\n\
  \n\n\n\n\n向应用程序添加地图的最简单方法是在 activity 的用户界面布局 XML 文件中指定它。以下示例布局文件显示了由 Android Studio\
  \ 创建的 `activity_maps.xml` 文件中的 `SupportMapFragment` 实例：\n\n```xml\n<fragment xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    android:id=\"@+id/map\"\n    tools:context=\".MapsActivity\"\n    android:name=\"\
  com.google.android.gms.maps.SupportMapFragment\"/>\n```\n\n## 76.8 请求当前位置权限\n\n\
  正如在 Android 中发起运行时权限请求章节所述，某些权限被归类为危险权限，对于 Android 6.0 或更高版本，需要特殊处理。其中一种权限允许应用程序识别用户的当前位置。在默认情况下，Android\
  \ Studio 已在 `AndroidManifest.xml` 文件中放置了位置权限请求。在项目工具窗口中找到位于 `app` -> `manifests`\
  \ 下的文件，并找到以下权限行：\n\n```xml\n<uses-permission\n    android:name=\"android.permission.ACCESS_FINE_LOCATION\"\
  \ />\n```\n\n这将确保在旧版本的 Android 上安装应用时，应用有机会获得权限以获取位置信息；但为了完全支持 Android 6.0 或更高版本，应用还必须在运行时专门请求此权限。为了实现这一点，需要在\
  \ `MapsActivity.java` 文件中添加一些代码。\n\n首先添加一些导入指令和一个作为权限请求代码的常量：\n\n```java\npackage\
  \ com.ebookfrenzy.mapdemo;\n\n.\n.\n\nimport androidx.core.content.ContextCompat;\n\
  import androidx.core.app.ActivityCompat;\nimport android.Manifest;\nimport android.widget.Toast;\n\
  import android.content.pm.PackageManager;\n\n.\n.\n\npublic class MapsActivity extends\
  \ FragmentActivity implements OnMapReadyCallback {\n    private static final int\
  \ LOCATION_REQUEST_CODE = 101;\n    private GoogleMap mMap;\n.\n.\n}\n```\n\n接下来，需要在类中添加一个方法来向用户请求特定的权限。在\
  \ `MapsActivity.java` 类文件中，按如下方式实现此方法：\n\n```java\nprotected void requestPermission(String\
  \ permissionType, int requestCode) {\n    ActivityCompat.requestPermissions(this,\n\
  \        new String[]{permissionType}, requestCode\n    );\n}\n```\n\n当用户对权限请求做出响应后，活动将调用\
  \ `onRequestPermissionsResult()` 方法。留在 `MapsActivity.java` 文件中，现在实现此方法，其内容如下：\n\n\
  ```java\n@Override\npublic void onRequestPermissionsResult(int requestCode, String\
  \ permissions[], int[] grantResults) {\n    switch (requestCode) {\n        case\
  \ LOCATION_REQUEST_CODE: {\n            if (grantResults.length == 0\n         \
  \           || grantResults[0] != PackageManager.PERMISSION_GRANTED) {\n       \
  \         Toast.makeText(this,\n                    \"无法显示位置 - 需要权限\",\n       \
  \             Toast.LENGTH_LONG).show();\n            } else {\n               \
  \ SupportMapFragment mapFragment = (SupportMapFragment) getSupportFragmentManager()\n\
  \                    .findFragmentById(R.id.map);\n                mapFragment.getMapAsync(this);\n\
  \            }\n        }\n    }\n}\n```\n\n如果用户没有授予权限，应用将显示一条消息，指示无法显示当前位置。另一方面，如果授予了权限，地图将刷新，为显示位置标记提供机会。\n\
  \n## 76.9 显示用户的当前位置\n\n一旦授予了相应的权限，可以通过获取与地图关联的 `GoogleMap` 对象的引用并调用该实例的 `setMyLocationEnabled()`\
  \ 方法传递 `true` 值，在地图上显示用户的当前位置。\n\n当地图准备好显示时，会调用活动的 `onMapReady()` 方法。此方法在 `onRequestPermissionsResult()`\
  \ 方法内刷新地图时也会调用。默认情况下，Android Studio 已经实现了此方法并添加了一些代码，将地图对准澳大利亚，并在悉尼市上方放置一个标记。找到并编辑\
  \ `MapsActivity.java` 文件中的 `onMapReady()` 方法，删除此模板代码，并添加在启用显示当前位置之前检查是否授予权限的代码。如果未授予权限，将通过调用之前添加的\
  \ `requestPermission()` 方法向用户请求：\n\n```java\n@Override\npublic void onMapReady(GoogleMap\
  \ googleMap) {\n    mMap = googleMap;\n    // 在悉尼添加一个标记并移动相机\n    LatLng sydney\
  \ = new LatLng(-34, 151);\n    mMap.addMarker(new MarkerOptions().position(sydney).title(\"\
  Marker in Sydney\"));\n    mMap.moveCamera(CameraUpdateFactory.newLatLng(sydney));\n\
  \    if (mMap != null) {\n        int permission = ContextCompat.checkSelfPermission(this,\
  \ Manifest.permission.ACCESS_FINE_LOCATION);\n        if (permission == PackageManager.PERMISSION_GRANTED)\
  \ {\n            mMap.setMyLocationEnabled(true);\n        } else {\n          \
  \  requestPermission(\n                Manifest.permission.ACCESS_FINE_LOCATION,\n\
  \                LOCATION_REQUEST_CODE);\n        }\n    }\n}\n```\n\n现在运行应用时，会出现图\
  \ 76-3 所示所示。如果授予了权限，地图上会出现一个蓝点表示设备的当前位置。\n\n![图 76-3](img/as_4.1)\n\n## 76.10 更改地图类型\n\
  \n通过对相应的 `GoogleMap` 对象调用 `setMapType()` 方法传递以下值之一，可以动态修改显示的地图类型：\n\n* `GoogleMap.MAP_TYPE_NONE`：不显示地图瓦片的网格。\n\
  * `GoogleMap.MAP_TYPE_NORMAL`：由经典地图组成的标准视图。\n* `GoogleMap.MAP_TYPE_SATELLITE`：显示地图区域的卫星图像。\n\
  * `GoogleMap.MAP_TYPE_HYBRID`：在卫星图像上叠加地图。\n* `GoogleMap.MAP_TYPE_TERRAIN`：显示等高线等地形信息。\n\
  \n例如，对 `onMapReady()` 方法的以下更改会将地图切换到卫星模式：\n\n```java\n.\n.\nif (mMap != null) {\n\
  \    int permission = ContextCompat.checkSelfPermission(\n            this, Manifest.permission.ACCESS_FINE_LOCATION);\n\
  \    if (permission == PackageManager.PERMISSION_GRANTED) {\n        mMap.setMyLocationEnabled(true);\n\
  \    } else {\n        requestPermission(Manifest.permission.ACCESS_FINE_LOCATION,\n\
  \            LOCATION_REQUEST_CODE);\n    }\n    mMap.setMapType(GoogleMap.MAP_TYPE_SATELLITE);\n\
  }\n.\n```\n\n或者，可以在嵌入地图的 XML 布局文件中使用 `map:mapType` 属性配合 `none`、`normal`、`hybrid`、`satellite`\
  \ 或 `terrain` 值来指定地图类型。例如：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n\
  <fragment xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:map=\"\
  http://schemas.android.com/apk/res-auto\"\n    android:id=\"@+id/map\"\n    android:layout_width=\"\
  match_parent\"\n    android:layout_height=\"match_parent\"\n    map:mapType=\"hybrid\"\
  \n    android:name=\"com.google.android.gms.maps.SupportMapFragment\"/>\n```\n\n\
  ## 76.11 向用户显示地图控件\n\nGoogle Maps Android API 提供了了一些可选显示给用户的控件，包括放大和缩小按钮、“我的位置”按钮以及罗指南针。\n\
  \n\n\n\n\n缩放和指南针控件的显示可以通过程序化控制，也可以在 XML 布局资源中的地图元素内进行控制。为了通过程序化配置控件，必须获取与 `GoogleMap`\
  \ 对象关联的 `UiSettings` 引用：\n\n```javaimport com.google.android.gms.maps.UiSettings;\n\
  \n.\n\n.\n\nUiSettings mapSettings;\n\nmapSettings = mMap.getUiSettings();\n```\n\
  \n缩放控件通过调用 `UiSettings` 对象的 `setZoomControlsEnabled()` 方法来启用或禁用。例如：\n\n```java\n\
  mapSettings.setZoomControlsEnabled(true);\n```\n\n或者，可以在 XML 资源文件的地图元素中设置 `map:uiZoomControls`\
  \ 属性：\n\n```xml\nmap:uiZoomControls=\"false\"\n```\n\n指南针可以通过调用 `UiSettings` 实例的\
  \ `setCompassEnabled()` 方法显示，也可以通过 XML 资源使用 `map:uiCompass` 属性进行显示。请注意，只有当地图相机倾斜或旋转偏离朝向时，指南针图标才会出现。\n\
  \n“我的位置”按钮只有在在本章概述的启用“我的位置”模式时才会出现。即使在这种模式下，也可以通过调用 `UiSettings` 实例的 `setMyLocationEnabled()`\
  \ 方法来防止按钮出现。\n\n## 处理地图手势\n\nGoogle Maps API 能够响应许多不同的用户交互。这些交互可用于更改显示的地图区域、缩放级别甚至视角角度（从而显示地图区域的\
  \ 3D 表示）。\n\n### 缩放手势\n\n可以使用与 `GoogleMap` 实例关联的 `UiSettings` 对象的 `setZoomGestures()`\
  \ 方法来启用或禁用与地图放大和缩小相关的手势支持。例如，以下代码禁用了缩放手势：\n\n```java\nUiSettings mapSettings;\n\n\
  mapSettings = map.getUiSettings();\n\nmapSettings.setZoomGestures(false);\n```\n\
  \n在 XML 资源文件中通过将 `map:uiZoomGestures` 设置为 true 可以实现相同的结果。启用后，当用户在屏幕上进行双指捏合手势时将发生缩放。同样，双击将放大，而双指轻点将缩小。另一方面，单指缩放手势是通过双击两次但不释放第二次点击，然后在屏幕上上下滑动手指来分别放大或缩小来实现的。\n\
  \n### 滚动/平移手势\n\n滚动或平移手势允许用户通过单指动作在屏幕上拖动地图来移动地图。可以在代码中调用 `UiSettings` 实例的 `setScrollGestures()`\
  \ 方法来启用滚动手势：\n\n```java\nUiSettings mapSettings;\n\nmapSettings = mMap.getUiSettings();\n\
  \nmapSettings.setScrollGestures(true);\n```\n\n或者，可以在 XML 布局文件中使用 `map:uiScrollures`\
  \ 属性启用地图实例上的滚动功能。\n\n### 倾斜手势\n\n倾斜手势允许用户通过在屏幕上放置两个手指并上下移动来调整倾斜角度，从而改变地图的投影角度。可以通过调用\
  \ `UiSettings` 实例的 `setTiltGestures()` 方法启用或禁用倾斜手势，例如：\n\n```java\nUiSettings mapSettings;\n\
  \nmapSettings = mMap.getUiSettings();\n\nmapSettings.setTiltGestures(true);\n```\n\
  \n倾斜手势也可以使用 XML 布局文件中的 `map:uiTiltGestures` 属性启用或禁用。\n\n### 旋转手势\n\n在启用地图旋转手势时，用户可以通过在屏幕上放置两个手指并进行圆形运动来旋转地图的朝向。这种手势支持可以通过代码中调用\
  \ `UiSettings` 实例的 `setRotateGestures()` 方法来启用或禁用，例如：\n\n```java\nUiSettings mapSettings;\n\
  \nmapSettings = mMap.getUiSettings();\n\nmapSettings.setRotateGestures(true);\n\
  ```\n\n旋转手势也可以使用 XML 布局文件中的 `map:uiRotateGestures` 属性启用或禁用。\n\n## 创建地图标记\n\n标记（Markers）用于通知用户地图上的位置位置，其形式可以是标准图标或自定义图标。标记还可能包含标题和可选的文本（称为摘要/snippet），并可以配置为允许用户将其拖动到地图上的不同位置。当用户点击标记时，将弹出一个信息窗口（info\
  \ window），显示有关标记位置的额外信息。\n\n标记由 `Marker` 类的实例表示，并通过调用相应 `GoogleMap` 对象的 `addMarker()`\
  \ 方法添加到地图中。作为此方法的参数传递的是 `MarkerOptions` 实例，它包含了标记所需的各种选项，如标题和摘要文本。标记的位置通过指定纬度和经度值定义，这些值也包含在\
  \ `MarkerOptions` 实例中。例如，以下代码向地图上的特定位置添加了一个包含标题、摘要和位置的标记：\n\n```java\nimport com.google.android.gms.maps.model.Marker;\n\
  import com.google.android.gms.maps.model.LatLng;\nimport com.google.android.gms.maps.model.MarkerOptions;\n\
  \n.\n\n.\n\n.\n\nLatLng position = new LatLng(38.8874245, -77.0200729);\nMarker\
  \ museum = mMap.addMarker(new MarkerOptions()\n        .position(position)\n   \
  \     .title(\"Museum\")\n        .snippet(\"National Air and Space Museum\"));\n\
  ```\n\n执行上述代码将标记指定的位置，点击该位置将显示一个包含标题和摘要的信息窗口，如图 76-4 所示：\n\n![](img/Image24513.jpg)\n\
  \n图 76-4\n\n## 控制地图相机\n\n由于 Android 设备屏幕是平面的而地球是球体，Google Maps API 使用墨卡投影表示在平面上。地图的默认视图呈现给用户就像通过悬挂在地图上方并直接向下看的相机一样。Google\
  \ Maps API 允许在应用程序内部实时更改相机的目标、缩放、方位和倾斜度：\n\n- `target`：地图中心的位置，用经纬度指定。\n- `zoom`：相机的缩放级别，以级别指定。缩放级别增加\
  \ 1.0 会使显示的地图宽度翻倍。\n- `tilt`：相机的视角角度，以跨越可见地图区域中心的圆弧上的位置表示（从圆弧顶部测量，即相机直接向下看时的底点）。\n\
  - `bearing`：地图的方位，以从北方向开始顺时针方向的角度表示。\n\n相机更改通过创建 `CameraUpdate` 类的实例来实现。`CameraUpdate`\
  \ 实例通过调用 `CameraUpdateFactory` 类的方法创建。一旦创建了 `CameraUpdate` 实例，即可通过调用 `GoogleMap`\
  \ 实例的 `moveCamera()` 方法应用到地图上。为了在相机变化时获得平滑的动画效果，可以调用 `animateCamera()` 而不是 `moveCamera()`。\n\
  \n\n\n\n\n* `CameraUpdateFactory.zoomBy(float, Point)` - 创建一个 `CameraUpdate` 实例，按指定值增加或减少缩放级别。\n\
  * `CameraUpdateFactory.newLatLng(LatLng)` - 创建一个 `CameraUpdate` 实例，更改相机的目标纬度和经度。\n\
  * `CameraUpdateFactory.newLatLngZoom(LatLng, float)` - 生成一个 `CameraUpdate` 实例，更改相机的纬度、经度和缩放级别。\n\
  * `CameraUpdateFactory.newCameraPosition(CameraPosition)` - 返回一个 `CameraUpdate`\
  \ 实例，将相机移动到指定的位置。可以使用 `CameraPosition.Builder()` 获取 `CameraPosition` 实例。\n\n例如，以下代码使用动画将相机放大一级：\n\
  \n```\nmMap.animateCamera(CameraUpdateFactory.zoomIn());\n```\n\n另一方面，以下代码将相机移动到新位置，并将缩放级别调整为\
  \ 10，且不使用动画：\n\n```java\nprivate static final LatLng position =\n    new LatLng(38.8874245,\
  \ -77.0200729);\n\nmMap.moveCamera(CameraUpdateFactory.newLatLngZoom(position, 10));\n\
  ```\n\n最后，下一个代码示例使用 `CameraPosition.Builder()` 创建了一个具有目标、缩放、方位和倾角变化的 `CameraPosition`\
  \ 对象。然后使用动画将此更改应用于相机：\n\n```java\nimport com.google.android.gms.maps.model.CameraPosition;\n\
  import com.google.android.gms.maps.CameraUpdateFactory;\n\nCameraPosition cameraPosition\
  \ = new CameraPosition.Builder()\n    .target(position)\n    .zoom(50)\n    .bearing(70)\n\
  \    .tilt(25)\n    .build();\n\nmMap.animateCamera(CameraUpdateFactory.newCameraPosition(\n\
  \    cameraPosition));\n```\n\n# 76. 总结\n本章概述了 Google Maps Android API 的关键类和方法，并概述了准备开发环境和应用程序项目以使用该\
  \ API 的步骤。\n\n# 77. 使用 Android 打印框架打印\n随着 Android 4.4 KitKat 版本的发布，从 Android 应用程序内部打印内容已可行。虽然后续章节将详细探讨为自己的应用程序添加打印支持的选项，但本章将重点介绍\
  \ Android 现提供的各种打印选项以及启用这些选项的步骤。在涵盖这些基础主题后，本章将提供 Android 开发者在为应用程序构建打印支持方面可用的各种打印功能的概述。\n\
  \n## 77.1 Android 打印架构\nAndroid 打印由 `Printing` 框架提供。简单来说，该框架由一个打印管理器（Print Manager）和若干个打印服务插件组成。`Print\
  \ Manager` 的处理来自设备上应用程序的打印请求，并与设备上安装的打印服务插件交互，从而确保打印请求得到实现。默认情况下，许多 Android 设备安装了打印服务插件，以便使用\
  \ `Google Cloud Print` 和 `Google Drive` 服务进行打印。其他打印机类型的打印服务插件如果尚未安装，也可以从 Google\
  \ Play 商店获取。目前适用于 HP、爱普、三星和佳能（Canon）打印机的打印服务插件，未来极可能发布其他制造商的插件，尽管 `Google Cloud\
  \ Print` 服务插件也可以用于从 Android 设备打印到几乎任何打印机类型和型号。为了本书起，我们将使用 `HP Print Services Plugin`\
  \ 作为参考示例。\n\n## 77.2 打印服务插件\n打印服务插件的目的是让应用程序能够打印到通过本地局域无线网络或蓝牙对 Android 设备可见的兼容打印机。\n\
  \n可以通过加载 Google Play 应用并搜索“Print Service Plugin”来验证 Android 设备上是否存在 `Print Service\
  \ Plugin`。一旦插件在 Play Store 中列出，并且在插件尚未安装的情况下，可以通过选择 `Install`（安装）按钮进行安装。例如，图 77-1\
  \ 显示了 Google Play 中的 HP 打印服务插件。\n\n打印服务插件会自动检测 Android 设备当前连接的网络上的兼容打印机，并在从应用程序打印时将它们列为选项。\n\
  \n![](img/as_4.1_hp_printer_plugin.jpg)\n\n图 77-1\n\n## 77.3 Google Cloud Print\n\
  Google Cloud Print 是 Google 提供的一项服务，允许您从任何具有互联网连接的地方通过网络将内容打印到自己的打印机上。Google Cloud\
  \ Print 支持多种设备和打印机型号，形式包括云就型（Cloud Ready）和经典型（Classic）打印机。云就型打印机内置了支持网络打印的技术。提供云就型打印机的制造商包括博得（Brother）、佳能（Canon）、戴尔（Dell）、爱普生（Epson）、HP、柯达（Kodak）和三星（Samsung）。要识别您的打印机是否是云就型且受\
  \ Google Cloud Print 支持，请查看以下 URL 中的打印机列表：\n\n[`www.google.com/cloudprint/learn/printers.html`](https://www.google.com/cloudprint/learn/printers.html)\n\
  \n对于经典的非云就型打印机，Google Cloud Print 通过在连接到经典打印机的计算机系统（直接连接或通过家庭或办公室网络）上安装软件来实现云打印支持。\n\
  \n要设置 Google Cloud Print，请访问以下网页并使用与登录 Android 设备时相同的 Google 账户登录：\n\n[`www.google.com/cloudprint/learn/index.html`](https://www.google.com/cloudprint/learn/index.html)\n\
  \n一旦打印机添加到 Google Cloud Print 账户，从 Android 打印时，它们将列为打印目标选项。\n\n## 77.4 打印到 Google\
  \ Drive\n除了支持实体打印机，还可以将打印输出保存到 Google Drive。从设备打印时，选择打印面板中的 `Save to Google Drive`\
  \ 选项。随后打印内容将转换为 `PDF` 文件并保存到 Google Drive 云存储。\n\n## 77.5 保存为 PDF\nAndroid 提供的最后一个打印选项允许将打印内容本地保存为\
  \ Android 设备上的 `PDF` 文件。一旦选择，该选项将要求为 `PDF` 文件命名并指定保存到设备位置。\n\n`Save as PDF` 和 `Google\
  \ Drive` 选项在测试 Android 应用程序打印功能时，对于节省纸张非常有价值。\n\n## 77.6 从 Android 设备打印\nGoogle\
  \ 建议提供打印内容的应用程序通过将打印选项放在溢出菜单中来实现（该主题在在 Android 上创建和管理溢出菜单” 章节中有详细介绍）。许多与 Android\
  \ 自带的应用程序现在包含了“打印…”选项。例如，图 77-2 显示了通过选择 Chrome 浏览器溢出菜单中的 `Share…` 选项访问打印选项。\n\n\
  ![](img/as_3.5_chrome_print_option.jpg)\n\n图 77-2\n\n一旦在应用程序内选择了打印选项，将出现标准的 Android\
  \ 打印屏幕，显示打印内容的预览，如图 77-3 所示：\n\n![](img/as_3.5_chrome_print_panel.jpg)\n\n图 77-3\n\
  \n点击屏幕顶部的面板将显示完整的打印选项：\n\n![](img/as_3.5_save_as_pdf.jpg)\n\n图 77-4\n\n\n\n\n\n\
  Android 打印面板提供了常用的打印选项，如纸张大小、颜色、方向和打印次数。可以通过点击当前打印机或 PDF 输出选择来访问其他打印目标选项。\n\n##\
  \ 77.7 在 Android 应用中构建打印支持的选项\n\n打印框架（Printing framework）为在 Android 中集成打印支持提供了多种选项。这些选项可以分类如下：\n\
  \n### 77.7.1 图像打印\n\n顾如名，此选项允许将图像打印集成到 Android 应用中。在应用程序添加此功能时，第一步是创建一个 `PrintHelper`\
  \ 类的新实例：\n\n```java\nPrintHelper imagePrinter = new PrintHelper(context);\n```\n\
  \n接下来，可以通过调用 `PrintHelper` 实例的 `setScaleMode()` 方法来指定打印图像的缩放模式。选项如下：\n\n• `SCALE_MODE_FIT`\
  \ – 图像将适应纸张大小，而不进行任何裁剪或改变宽高比。这通常会导致在某个维度上出现空白。\n\n• `SCALE_MODE_FILL` – 图像将缩放以填充纸张大小，并在必要时进行裁剪，以避免打印输出中出现空白。\n\
  \n在没有设置缩放模式的情况下，系统将默认使用 `SCALE_MODE_FILL`。例如，下面的代码在之前声明的 `PrintHelper` 实例上设置了自适应模式：\n\
  \n```java\nimagePrinter.setScaleMode(PrintHelper.SCALE_MODE_FIT);\n```\n\n同样，也可以配置颜色模式，以指示打印输出是彩色还是黑白。这是通过向\
  \ `PrintHelper` 实例的 `setColorMode()` 方法传递以下选项之一来实现的：\n\n• `COLOR_MODE_COLOR` – 表示图像将以彩色打印。\n\
  \n• `COLOR_MODE_MONOCHROME` – 表示图像将以黑白打印。\n\n打印框架将默认彩色打印，除非按如下方式指定单色选项：\n\n```java\n\
  imagePrinter.setColorMode(PrintHelper.COLOR_MODE_MONOCHROME);\n```\n\n完成打印操作仅需要要打印的图像，并调用\
  \ `PrintHelper` 实例的 `printBitmap()` 方法。调用时需要传递一个代表分配给打印任务名称的字符串以及图像的引用（以 `Bitmap`\
  \ 对象或 `Uri` 引用的形式存在）：\n\n```java\nBitmap bitmap = BitmapFactory.decodeResource(getResources(),\n\
  \                R.drawable.oceanscene);\n\nimagePrinter.printBitmap(\"My Test Print\
  \ Job\", bitmap);\n```\n\n一旦打印任务启动，打印框架将显示打印对话框，并处理后续与用户的交互以及在用户选择的打印目标上打印图像。\n\n\
  ### 77.7.2 创建并打印 HTML 内容\n\nAndroid 打印框架还提供了从应用程序内部打印基于 HTML 内容的简单方法。这些内容可以是由网站托管页面\
  \ URL 引用的 HTML 内容，也可以是在应用程序内部动态创建的 HTML 内容。\n\n为了启用 HTML 打印，`WebView` 类已经过扩展，支持以极少的代码需求进行打印。\n\
  \n在动态创建 HTML 内容（而不是加载并打印现有网页）时，该过程涉及创建一个 `WebView` 对象并与其关联一个 `WebViewClient` 实例。然后配置该\
  \ web 视图客户端，在 HTML 加载到 `WebView` 完成后启动打印任务。配置好 web 客户端后，HTML 被加载到 `WebView` 中，此时触发打印过程。\n\
  \n例如，考虑以下代码：\n\n```java\npublic void printContent()\n{\n    WebView webView = new\
  \ WebView(this);\n    webView.setWebViewClient(new WebViewClient() {\n        public\
  \ boolean shouldOverrideUrlLoading(WebView view,\n                    String url)\n\
  \        {\n            return false;\n        }\n        @Override\n        public\
  \ void onPageFinished(WebView view, String url) {\n            createWebPrintJob(view);\n\
  \            myWebView = null;\n        }\n    });\n    // ... (文中描述的其余逻辑)\n}\n\
  ```\n\n*（注意：此节提供的文本在源文件中存在严重碎片化/重复；我根据所提供的变量名和代码片段重建了逻辑流。）*\n\n该逻辑涉及：\n1. 创建一个 `WebView`。\n\
  2. 附加一个 `WebViewClient`。\n3. 重写 `onPageFinished` 以调用 `createWebPrintJob(view)`。\n\
  4. 使用 `webView.loadDataWithURL` 加载 HTML 字符串。\n\n### 77.7.3 打印网页\n\n打印网页的步骤与上述类似，不同之处在于向\
  \ web 传递要打印网页的 URL，而不是动态创建的 HTML，例如：\n\n```java\nmyWebView.loadUrl(\"https://developer.android.com/google/index.html\"\
  );\n```\n\n\n\n\n\n### 77.7.4 打印自定义文档\n\n虽然 `Printing` 框架引入的 HTML 和网页打印功能为从 Android\
  \ 内部打印内容提供了方便路径，但显而易见，对于更高级的打印需求，这些选项过于简单。对于更复杂的打印任务，`Printing` 框架还提供了自定义文档打印支持。这允许将文本和图形形式的内容绘制到\
  \ `Canvas` 上然后进行打印。\n\n与相对容易实现的 HTML 和图像打印不同，自定义文档打印是一个更复杂的多阶段过程，该过程将在本书的[“Android\
  \ 自定义文档打印指南”(#Custom_Printing.xhtml__idTextAnchor1472)章节中进行概述。这些步骤可以总结如下：\n\n* \
  \  连接到 Android 打印管理器（Print Manager）\n*   创建一个继承自 `PrintDocumentAdapter` 类的自定义打印适配器（Custom\
  \ Print Adapter）\n*   创建一个 `PdfDocument` 实例来表示文档页面\n*   获取 `PdfDocument` 实例页面的引用，每个页面都关联着一个\
  \ `Canvas` 实例\n*   在页面画布上绘制内容\n*   通知打印框架文档已准备好打印\n\n上述步骤概述的自定义打印适配器需要实现若干方法，Android\
  \ 系统将在打印过程中调用这些方法来执行特定任务。其中最重要的是 `onLayout()` 方法，它负责根据用户更改设置（如纸张大小或页面方向）重新排列文档布局；以及\
  \ `onWrite()` 方法，它负责渲染要打印的页面。此主题将在题为[\"Android 自定义文档打印指南”(#Custom_Printing.xhtml__idTextAnchor1472)的章节中详细介绍。\n\
  \n## 77.8 总结\n\nAndroid SDK 包含了在运行的 App 中打印内容的能力。打印输出可以重定向到配置适当的打印机、本地 PDF 文件或通过\
  \ Google Drive 传输云端。从 Android 应用开发者的角度来看，可以通过使用 `Printing` 框架在应用程序中使用这些功能。到目前为止，最容易实现的打印选项是涉及图像和\
  \ HTML 内容的。然而，更高级的打印可以使用框架的自定义文档打印功能实现。\n\n# 78. 一个 Android HTML 和网页内容打印示例\n\n如前一章节[“使用\
  \ Android 打印框架打印”(#Printing.xhtml__idTextAnchor1435)] 概述的那样，Android 打印框架可以用于打印网页和动态创建的\
  \ HTML 内容。虽然这两种打印方法有许多相似之处，但也存在一些需要考虑的细微差别。本章将通过创建两个示例应用程序，来让这两个打印选项更加清晰。\n\n##\
  \ 78.1 创建 HTML 打印示例应用程序\n\n从欢迎屏幕上选择 Create New Project（创建新项目）快速启动选项，在随出现的新项目对话框中，在点击\
  \ Next（下一步）按钮之前，选择 Empty Activity（空活动）模板。\n\n在 Name（名称）字段中输入 `HTMLPrint`，并指定 `com.ebookfrenzy.htmlprint`\
  \ 为包名。在点击 Finish（完成）按钮之前，将 Minimum API level（最低 API 级别）设置更改为 `API 26: Android 8.0\
  \ (Oreo)`，并将 Language（语言）菜单更改为 `Java`。\n\n## 78.2 打印动态 HTML 内容\n\n教程的第一阶段是在项目中添加代码以创建一些\
  \ HTML 内容并以打印作业的形式发送给 `Printing` 框架。\n\n首先找到 `MainActivity.java` 文件（位于 Project 工具窗口的\
  \ `app -> java -> com.ebookfrenzy.htmlprint` 下）并将其加载到编辑面板中。加载后，修改代码使其如下列表所示所示：\n\
  \n```java\npackage com.ebookfrenzy.htmlprint;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  \nimport android.os.Bundle;\n\nimport android.webkit.WebView;\nimport android.webkit.WebViewClient;\n\
  import android.webkit.WebResourceRequest;\n\nimport android.print.PrintAttributes;\n\
  import android.print.PrintDocumentAdapter;\nimport android.print.PrintManager;\n\
  \nimport android.content.Context;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n\n    private WebView myWebView;\n\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_htmlprint);\n\
  \        printWebView();\n    }\n\n    private void printWebView() {\n        WebView\
  \ webView = new WebView(this);\n        webView.setWebViewClient(new WebViewClient()\
  \ {\n            public boolean shouldOverrideUrlLoading(WebView view,\n       \
  \                                            WebResourceRequest request) {\n   \
  \             return false;\n            }\n\n            @Override\n          \
  \  public void onPageFinished(WebView view, String url) {\n                createPrintJob(view);\n\
  \                myWebView = null;\n            }\n        });\n        String htmlDocument\
  \ = \"<html><body><h1>Android Test</h1><p>This is sample content.</p></body></html>\"\
  ;\n        webView.loadDataWithBase(null, htmlDocument, \"text/HTML\", \"UTF-8\"\
  , null);\n        myWebView = webView;\n    }\n}\n```\n\n代码更改从声明变量 `myWebView` 开始，其中将存储用于打印操作的\
  \ `WebView` 实例引用。在 `onCreate()` 方法中，创建了一个 `WebView` 类实例，并为其分配了一个 `WebViewClient`\
  \ 实例。\n\n分配给视图对象的 `WebViewClient` 被配置为指示 HTML 内容的加载由 `WebView` 实例处理（通过从 `shouldOverrideUrlLoading()`\
  \ 方法返回 `false`）。更重要的是，声明并实现 `onPageFinished()` 处理方法以调用 `createPrintJob()`。当所有 HTML\
  \ 内容加载到 视图时，`onPageFinished()` 方法将被自动调用。\n\n接下来，创建一个包含 HTML 的 `String` 对象并随后加载到视图中。一旦\
  \ HTML 加载，`onPageFinished()` 回调方法将触发。最后，该方法将视图引用存储在之前声明的 `myWebView` 变量中。如果没有这一步骤，Java\
  \ 运行时系统可能会认为应用程序不再需要该视图并将其丢弃以释放内存。\n\n示例中剩下的只需实现 `createPrintJob()` 方法，该方法目前配置为由\
  \ `onPageFinished()` 回调方法调用。因此，在 `MainActivity.java` 文件中实现此方法使其如下：\n\n```java\n\
  private void createPrintJob(WebView webView) {\n    PrintManager printManager =\
  \ (PrintManager) this\n            .getSystemService(Context.PRINT_SERVICE);\n \
  \   PrintDocumentAdapter printAdapter =\n            webView.createPrintDocumentAdapter(\"\
  MyDocument\");\n    String jobName = getString(R.string.app_name) + \" Print Test\"\
  ;\n    printManager.print(jobName, printAdapter,\n            new PrintAttributes.Builder().build());\n\
  }\n```\n\n此方法获取 `PrintManager` 服务的引用，并指示视图实例创建打印适配器。创建一个新字符串来存储打印作业名称（在此情况下基于应用程序名称和“Print\
  \ Test”字样）。\n\n\n\n\n最后，通过调用打印管理器的 `print()` 方法启动打印任务，并传递任务名称、打印适配器和一组默认打印属性。\n\n\
  在运行 Android `5.0` 或更高版本的设备或模拟器上编译并运行该应用程序。启动后，将出现标准的 Android 打印页面，如图 78-1 所示。\n\n\
  ![](img/Image24257.jpg)\n\n图 78-1\n\n如果你配置了物理打印机，则打印到物理打印机；保存到 Google Drive；或者，选择保存为\
  \ PDF 文件的选项。一旦启动打印任务，请在所选目标位置检查生成的输出。请注意，当使用“保存为 PDF”选项时，系统会请求 PDF 文件的名称和存储位置。`Downloads`\
  \ 文件夹是一个不错的选择，可以通过点击设备上其他应用图标之间的 `Downloads` 图标（在 Android `8` 上重命名为 `Files`）来查看其内容。\n\
  \n## 78.3 创建网页打印示例\n\n在本章中创建的第二个示例应用程序将为用户提供一个溢出菜单（Overflow menu）选项，用于打印当前在 `WebView`\
  \ 实例中显示的网页。\n\n从欢迎屏幕选择“Create New Project”（创建新项目）快速启动选项，在生成的新项目对话框中，点击“Next”（下一步）按钮之前选择\
  \ `Basic Activity` 模板。\n\n在“Name”（名称）字段中输入 `WebPrint`，并指定 `com.ebookfrenzy.webprint`\
  \ 为包名。在点击“Finish”（完成）按钮之前，将“Minimum API level”（最低 API 级别）设置改为 `API 26`：Android `8.0`\
  \ (Oreo)，并将语言菜单设置为 `Java`。\n\n## 78.4 移除悬浮操作按钮\n\n选择 `Basic Activity` 模板提供了一个上下文菜单和一个悬浮操作按钮。由于应用程序不需要悬浮操作按钮，可以在继续之前将其移除。将\
  \ `activity_main.xml` 布局文件加载到布局编辑器中，选择悬浮操作按钮并按键盘 `Delete` 键将对象从布局中删除。编辑 `MainActivity.java`\
  \ 文件，如下所示从 `onCreate` 方法中移除悬浮操作按钮代码：\n\n```java\n@Override\nprotected void onCreate(Bundle\
  \ savedInstanceState) {\n    super.onCreate(savedInstanceState);\n    setContentView(R.layout.activity_web_print);\n\
  \    Toolbar toolbar = findViewById(R.id.toolbar);\n    setSupportActionBar(toolbar);\n\
  \    FloatingActionButton fab =\n        findViewById(R.id.fab);\n    fab.setOnClickListener(new\
  \ View.OnClickListener() {\n        @Override\n        public void onClick(View\
  \ view) {\n            Snackbar.make(view, \"Replace with your own action\",\n \
  \                         Snackbar.LENGTH_LONG)\n                    .setAction(\"\
  Action\", null).show();\n        }\n    });\n}\n```\n\n## 78.5 移除导航功能\n\n正如“Android\
  \ Studio 布局编辑器指南”所示，`Basic Activity` 模板包含多个片段和按钮，用于在片段之间进行导航。对于本教程而言，这些功能是不必要的，如果不移除，稍后会导致问题。在继续教程之前，请按照以下方式修改项目：\n\
  \n1. 在 `Project` 工具窗口中，导航并双击 `app -> res -> navigation -> nav_graph.xml` 文件，将其加载到导航编辑器中。\n\
  2. 在编辑器中，选择组件树（Component Tree）面板中的 `SecondFragment` 条目，按键盘删除键将其从图中移除。\n3. 找到并删除\
  \ `SecondFragment.java`（`app -> java -> <package name> -> SecondFragment`）和 `fragment_second.xml`（`app\
  \ -> res -> layout -> fragment_second.xml`）文件。\n4. 最后的任务是从 `FirstFragment` 类中移除某些代码，使\
  \ `Button` 在点击时不再导航到已不存在的第二个片段。找到 `FirstFragment.java` 文件，双击将其加载到编辑器中，并删除 `onViewCreated()`\
  \ 方法中的代码，使其内容如下：\n\n```java\npublic void onViewCreated(@NonNull View view, Bundle\
  \ savedInstanceState) {\n    super.onViewCreated(view, savedInstanceState);\n  \
  \  view.findViewById(R.id.button_first).setOnClickListener(new View.OnClickListener()\
  \ {\n        @Override\n        public void onClick(View view) {\n            NavHostFragment.findNavController(FirstFragment.this)\n\
  \                .navigate(R.id.action_FirstFragment_to_SecondFragment);\n     \
  \   }\n    });\n}\n```\n\n## 78.6 设计用户界面\n\n如果尚未加载 `fragment_first.xml` 布局资源，请将其加载到布局编辑器，并在设计模式下选择并删除\
  \ `TextView` 和 `Button` 对象。从调面板的 `Widgets` 部分将 `WebView` 对象拖放到设备布局的中心。点击“Infer constraints”（推断约束）按钮，并使用属性窗口将\
  \ `WebView` 的 `layout_width` 和 `layout_height` 属性更改为 `match constraint`匹配约束），使其像图\
  \ 78-2 所示填充整个画布。\n\n![](img/as_3.6_webprint_ui.jpg)\n\n图 78-2\n\n选择新添加的 `WebView`\
  \ 实例，并将视图的 ID 改为 `myWebView`。\n\n在继续教程的下一步之前，需要向项目添加额外的权限，以允许 `WebView` 对象访问互联网并下载网页用于打印。在\
  \ Project 窗口中找到 `AndroidManifest.xml` 文件并双击将其加载，如下所示编辑 XML 内容以添加权限：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.webprint\" >\n    <uses-permission android:name=\"\
  android.permission.INTERNET\" />\n    <application\n```\n\n## 78.7 将网页加载到 WebView\n\
  \n在打印网页之前，需要将其加载到 `WebView` 实例中。对于本教程，这将通过调用 `WebView` 实例的 `loadUrl()` 方法来实现，该方法将放在\
  \ `configureWebView()` 方法中，并在 `MainActivity` 类的 `onStart()` 方法中调用。因此，编辑 `MainActivity.java`\
  \ 文件并修改如下：\n\n```java\npackage com.ebookfrenzy.webprint;\nimport android.os.Bundle;\n\
  import androidx.appcompat.app.AppCompatActivity;\nimport androidx.appcompat.widget.Toolbar;\n\
  import android.view.Menu;\nimport android.view.MenuItem;\nimport android.webkit.WebView;\n\
  import android.webkit.WebViewClient;\nimport android.webkit.WebResourceRequest;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private WebView myWebView;\n\
  \n    @Override\n    protected void onStart() {\n        super.onStart();\n    \
  \    configureWebView();\n    }\n\n    private void configureWebView() {\n     \
  \   myWebView = findViewById(R.id.myWebView);\n        myWebView.setWebViewClient(new\
  \ WebViewClient(){\n            @Override\n            public boolean shouldOverrideLoading(WebView\
  \ view, WebResourceRequest request) {\n                return super.shouldOverrideLoading(view,\
  \ request);\n            }\n        });\n        myWebView.loadUrl(\"https://developer.android.com/google/index.html\"\
  );\n    }\n}\n```\n\n## 78.8 添加打印菜单选项\n\n现在将根据“Android 上创建和管理溢出菜单”章节](#Overflow_Menu.xhtml__idTextAnchor830)中概述的技术将打印选项添加到溢出菜单中。第一个要求是用于标记菜单选项的字符串资源。在\
  \ `Project` 工具窗口中找到 `app -> res -> values -> strings.xml` 文件，双击将其加载到编辑器中并修改它以添加新的字符串资源：\n\
  \n```xml\n<resources>\n    <string name=\"app_name\">WebPrint</string>\n</resources>\n\
  ```\n\n\n\n\n```xml\n<string name=\"action_settings\">Settings</string>\n<string\
  \ name=\"print_string\">Print</string>\n</resources>\n```\n\n接下来，将 `app -> res ->\
  \ menu -> menu_main.xml` 文件加载到菜单编辑器中，切换到代码模式并将 Settings 菜单选项替换为打印选项：\n\n```xml\n\
  <menu xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\"\n    tools:context=\"com.ebookfrenzy.webprint.MainActivity\"\
  \ >\n    <item android:id=\"@+id/action_settings\"\n          android:title=\"@string/action_settings\"\
  \n          android:orderInCategory=\"100\"\n          app:showAsAction=\"never\"\
  \ />\n    <item\n          android:id=\"@+id/action_print\"\n          android:orderInCategory=\"\
  100\"\n          app:showAsAction=\"never\"\n          android:title=\"@string/print_string\"\
  />\n</menu>\n```\n\n菜单选项的配置最后剩下的工作是修改 `MainActivity.java` 文件中的 `onOptionsItemSelected()`\
  \ 处理程序方法：\n\n```java\n@Override\npublic boolean onOptionsItemSelected(MenuItem item)\
  \ {\n    int id = item.getItemId();\n    if (id == R.id.action_print) {\n      \
  \  createWebPrintJob(myWebView);\n        return true;\n    }\n    return super.onOptionsItemSelected(item);\n\
  }\n```\n\n在实现 `onOptionsItemSelected()` 方法后，当从溢出菜单中选择打印选项时，活动将调用名为 `createWebPrintJob()`\
  \ 的方法。该方法的实现与之前的 HTMLPrint 项目中使用的相同，现在可以将其添加到 `MainActivity.java` 文件中，读取内容如下：\n\n\
  ```java\npackage com.ebookfrenzy.webprint;\n\nimport android.print.PrintAttributes;\n\
  import android.print.PrintDocumentAdapter;\nimport android.print.PrintManager;\n\
  import android.content.Context;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private WebView myWebView;\n\n    private void createWebPrintJob(WebView\
  \ webView) {\n        PrintManager printManager = (PrintManager) this\n        \
  \            .getSystemService(Context.PRINT_SERVICE);\n        PrintDocumentAdapter\
  \ printAdapter =\n                    webView.createPrintDocumentAdapter(\"MyDocument\"\
  );\n        String jobName = getString(R.string.app_name) +\n                  \
  \  \" Print Test\";\n        printManager.print(jobName, printAdapter,\n       \
  \             new PrintAttributes.Builder().build());\n    }\n}\n```\n\n代码更改完成后，在物理\
  \ Android 设备或运行 Android 5.0 或更高版本的模拟器上运行应用程序。成功启动后，WebView 应该显示出来并加载了指定的网页。页面加载后，从溢出菜单（图\
  \ 78-3）中选择打印选项，并使用生成的打印面板将网页打印到合适的目标。\n\n![](img/Image24411.jpg)\n\n图 78-3\n\n##\
  \ 78.9 总结\n\nAndroid 打印框架包含了对 `WebView` 类的扩展，使得在 Android 内部打印基于 HTML 内容成为可能。这些内容可以是运行时在应用程序内动态创建的\
  \ HTML 形式，也可以加载到 `WebView` 实例中的预存在网页。对于动态创建的 HTML，使用 `WebViewClient` 实例是非常关重要的，以确保在\
  \ HTML 完全加载到 `WebView` 之前不开始打印。\n\n### 79. Android 自定义文档打印指南\n\n正如我们在前面的章节中所看到的，只要内容是图像或\
  \ HTML 标记的形式，Android 打印框架使得在应用程序中构建打印支持变得相对容易。更高级的打印需求可以通过利用打印框架的自定义文档打印功能来满足。\n\
  \n#### 79.1 Android 自定义文档打印概述\n\n正如我们在前面的章节中所看到的，只要内容是图像或 HTML 标记的形式，Android 打印框架使得在应用程序中构建打印支持变得相对容易。更高级的打印需求可以通过利用打印框架的自定义文档打印功能来满足。\n\
  \n简单来说，自定义文档打印使用画布（canvas）来表示页面。虽然这听起来简单，但实际上需要执行许多步骤，这些可以总结如下：\n\n- 实现继承自 `PrintDocumentAdapter`\
  \ 的自定义适配器子类\n- 获取 `PrintManager` 的引用\n- 创建 `PdfDocument` 实例\n- 向 `PdfDocument` 添加页面\n\
  - 在 `Canvas` 对象上绘制内容\n- 将 PDF 文档写入目标地\n- 通知打印框架文档已就绪\n\n在本章中，将提供这些步骤的概述，随后将通过详细的教程来演示自定义打印的实现。\n\
  \n### 79.1.1 自定义适配器\n\n打印适配器的作用是为打印框架提供打印内容，并确保其格式符合用户的偏好（如纸张大小和方向）。\n\n在打印 HTML\
  \ 和图像时，很大一部分工作是由打印框架提供的打印适配器完成的。例如，在打印网页时，当我们调用 `WebView` 实例的 `createPrintDocumentAdapter()`\
  \ 时，系统会为我们创建一个打印适配器。\n\n然而，在自定义文档打印的情况下，应用程序开发者负责设计打印适配器并实现绘制内容的代码。自定义打印适配器通过子类\
  \ `PrintDocumentAdapter` 类并重写该类中的一组回调方法来创建，这些方法将在打印过程的不同阶段被打印框架调用：\n\n- `onStart()`：此方法在打印过程开始时调用，以便应用程序代码有机会为创建打印作业执行任何必要的任务。在\
  \ `PrintDocumentAdapter` 子类中实现此方法是可选的。\n- `onLayout()`：此回调方法在调用 `onStart()` 之后，并在用户每次更改打印设置（如更改方向、纸张大小或颜色设置）时再次调用。该方法应根据需要调整内容和布局以适应这些更改。完成这些更改后，方法必须返回要打印的页面数。在\
  \ `PrintDocumentAdapter` 子类中实现 `onLayout()` 方法是强制的。\n- `onWrite()`：此方法在每次调用 `onLayout()`\
  \ 之后调用，负责在要打印的画布上渲染内容。除了其他参数外，此方法还会接收一个文件描述符，渲染完成后必须生成的 PDF 文档写入其中。然后调用 `onWriteFinished()`\
  \ 回调方法，并传递包含要打印页范围信息的参数。在 `PrintDocumentAdapter` 子类中实现 `onWrite()` 方法是强制的。\n- `onFinish()`：这是一个可选方法，如果实现，将在打印过程完成后由打印框架调用一次，从而为应用程序提供执行任何可能必要的清理操作。\n\
  \n### 79.2 准备自定义文档打印项目\n\n\n\n\n从欢迎屏幕选择 `Create New Project` 快速启动选项，在弹出的新项目对话框中，点击\
  \ `Next` 按钮之前选择 `Empty Activity` 模板。\n\n在 `Name` 字段中输入 `CustomPrint` 并指定 `com.ebookfrenzy.customprint`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置更改为 `API 26: Android 8.0 (Oreo)`，并将\
  \ `Language` 菜单更改为 `Java`。\n\n在 `Layout Editor` 工具中加载 `activity_main.xml` 布局文件，并在\
  \ `Design` 模式下选择并删除“Hello World!” `TextView` 对象。从调色板的 `Form Widgets` 部分拖入一个 `Button`\
  \ 视图，并将其放置在布局视图的中心。选中 `Button` 视图后，将 `text` 属性更改为“Print Document”并将字符串提取到新的资源中。完成后，用户界面布局应与图\
  \ 79-1 所示所示：\n\n![](img/as_4.1_custom_print_ui.jpg)\n\n图 79-1\n\n当在应用程序中选中按钮时，需要调用一个方法来启动文档打印过程。留在\
  \ `Attributes` 工具窗口中，将 `onClick` 属性设置为调用名为 `printDocument` 的方法。\n\n## 79.3 创建自定义打印适配器\n\
  \n在 Android 应用程序内部打印自定义文档的大部分工作都涉及自定义打印适配器的实现。此示例将需要一个实现了了 `onLayout()` 和 `onWrite()`\
  \ 回调方法的打印适配器。在 `MainActivity.java` 文件中，添加此新类的模板，使其读取如下：\n\n```java\npackage com.ebookfrenzy.customprint;\n\
  \nimport android.os.CancellationSignal;\nimport android.os.ParcelFileDescriptor;\n\
  import android.print.PageRange;\nimport android.print.PrintAttributes;\nimport android.print.PrintDocumentAdapter;\n\
  import android.content.Context;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    public static class MyPrintDocumentAdapter extends PrintDocumentAdapter\n\
  \    {\n        Context context;\n        MyPrintDocumentAdapter(Context context)\n\
  \        {\n            this.context = context;\n        }\n        @Override\n\
  \        public void onLayout(PrintAttributes oldAttributes,\n                 \
  \                                           PrintAttributes newAttributes,\n   \
  \                                                         CancellationSignal cancellationSignal,\n\
  \                                                            LayoutResultCallback\
  \ callback,\n                                                            Bundle\
  \ metadata) {\n        }\n        @Override\n        public void onWrite(final PageRange[]\
  \ pageRanges,\n                                            final ParcelFileDescriptor\
  \ destination,\n                                            final CancellationSignal\
  \ cancellationSignal,\n                                            final WriteResultCallback\
  \ callback) {\n        }\n    }\n}\n```\n\n目前新类的状态，它包含一个构造方法，该方法会在创建类的新实例时被调用。构造函数接受调用活动的\
  \ `context` 作为参数，然后将其存储，以便稍后在两个回调方法中引用它。在建立类的大纲后，下一步是开始实现两个回调方法，从 `onLayout()` 开始。\n\
  \n## 79.4 实现 onLayout() 回调\n\n留在 `MainActivity.java` 文件中，首先添加 `onLayout()` 方法中的代码所需的指令：\n\
  \n```java\npackage com.ebookfrenzy.customprint;\n\nimport android.print.PrintDocumentInfo;\n\
  import android.print.pdf.PrintedDocument;\nimport android.graphics.pdf.PdfDocument;\n\
  \npublic class MainActivity extends AppCompatActivity {\n}\n```\n\n接下来，修改 `MyPrintDocumentAdapter`\
  \ 类以声明在 `onLayout()` 方法中使用的变量：\n\n```java\npublic static class MyPrintDocumentAdapter\
  \ extends PrintDocumentAdapter\n{\n    Context context;\n    int pageHeight;\n \
  \   int pageWidth;\n    PdfDocument myPdfDocument;\n    int totalpages = 4;\n}\n\
  ```\n\n注意，就本示例而言，将打印一个四页的文档。在更复杂的情况下，应用程序可能需要根据内容数量、布局相对于用户纸张尺寸和方向的关系，动态计算要打印的页数。声明变量后，按照以下代码实现\
  \ `onLayout()` 方法：\n\n```java\n@Override\npublic void onLayout(PrintAttributes oldAttributes,\n\
  \                                            PrintAttributes newAttributes,\n  \
  \                                                          CancellationSignal cancellationSignal,\n\
  \                                                            LayoutResultCallback\
  \ callback,\n                                                            Bundle\
  \ metadata) {\n    myPdfDocument = new PrintedDocument(context, newAttributes);\n\
  \    pageHeight = newAttributes.getMediaSize().getHeightMils()/1000 * 72;\n    pageWidth\
  \ = newAttributes.getMediaSize().getWidthMils()/1000 * 72;\n    if (cancellationSignal.isCanceled()\
  \ ) {\n        callback.onLayoutCancelled();\n        return;\n    }\n    if (totalpages\
  \ > 0) {\n        PrintDocumentInfo.Builder builder = new PrintDocumentInfo\n  \
  \              .Builder(\"print_output.pdf\").setContentType(PrintDocumentInfo.CONTENT_TYPE_DOCUMENT)\n\
  \                .setPageCount(totalpages);\n        PrintDocumentInfo info = builder.build();\n\
  \        callback.onLayoutFinished(info, true);\n    } else {\n        callback.onLayoutFailed(\"\
  Page count is zero.\");\n    }\n}\n```\n\n显然，此方法执行了许多任务，每项任务都需要详细的解释。\n\n首先，以 `PdfDocument`\
  \ 类实例的形式创建一个新的 PDF 文档。打印框架调用 `onLayout()` 方法时传入的参数之一是 `PrintAttributes` 类型的对象，包含了用户为打印输出选择的纸张尺寸、分辨率和颜色设置。这些设置结合构造函数之前存储的\
  \ `context` 一起用于创建 PDF 文档：\n\n`myPdfDocument = new PrintedDocument(context, newAttributes);`\n\
  \n随后，该方法使用 `PrintAttributes` 对象提取文档页的高度和宽度值。这些尺寸在对象中是以英寸千分之一的形式存储的。由于示例中之后使用这些值的方法是以\
  \ 1/72 英寸为单位的，这些数字在存储之前进行了转换：\n\n`pageHeight = newAttributes.getMediaSize().getHeightMils()/1000\
  \ * 72;`\n\n`pageWidth = newAttributes.getMediaSize().getWidthMils()/1000 * 72;`\n\
  \n虽然此示例没有使用颜色选择，但可以通过调用 `PrintAttributes` 对象的 `getColorMode()` 方法获取该属性，该方法将返回 `COLOR_MODE_COLOR`\
  \ 或 `COLOR_MODE_MONOCHROME`。\n\n当调用 `onLayout()` 方法时，它接收一个 `LayoutResultCallback`\
  \ 类型的对象。该对象允许方法通过一组方法向打印框架通信状态信息。例如，`onLayout()` 方法会在用户取消打印过程时被调用。进程已取消的事实通过 `CancellationSignal`\
  \ 参数中的设置指示。在检测到取消时，`onLayout()` 方法必须调用 `LayoutResultCallback` 对象的 `onLayoutCancelled()`\
  \ 方法，以通知打印框架已收到取消请求并且布局任务已取消：\n\n```java\nif (cancellationSignal.isCanceled() )\
  \ {\n    callback.onLayoutCancelled();\n    return;\n}\n```\n\n\n\n\n当布局工作完成后，该方法调用\
  \ `LayoutResultCallback` 对象的 `onLayoutFinished()` 方法，并传入两个参数。第一个参数以 `PrintDocumentInfo`\
  \ 对象的形式存在，包含要打印文档的信息。这些信息包括用于 PDF 文档的名称、内容类型（在此情况下是文档而非图像）以及页数。第二个参数是一个 `Boolean`\
  \ 值，表示自上一次调用 `onLayout()` 方法以来布局是否发生了变化：\n\n```java\nif (totalpages > 0) {\n   \
  \ PrintDocumentInfo.Builder builder = new PrintDocumentInfo\n            .Builder(\"\
  print_output.pdf\")\n            .setContentType(\n                PrintDocumentInfo.CONTENT_TYPE_DOCUMENT)\n\
  \            .setPageCount(totalpages);\n    PrintDocumentInfo info = builder.build();\n\
  \    callback.onLayoutFinished(info, true);\n} else {\n    callback.onLayoutFailed(\"\
  Page count is zero.\");\n}\n```\n\n在页数为 0 的情况下，代码将通过调用 `LayoutResultCallback` 对象的\
  \ `onLayoutFailed()` 方法向打印框架（Printing framework）报告此失败。调用 `onLayoutFinished()` 方法会通知打印框架布局工作已完成，从而触发对\
  \ `onWrite()` 方法的。\n\n## 79.5 实现 onWrite() 回调方法\n\n`onWrite()` 回调方法负责渲染文档页面，然后通知打印框架文档已准备好进行打印。完成后，`onWrite()`\
  \ 方法的内容如下：\n\n```java\npackage com.ebookfrenzy.customprint;\n\nimport java.io.FileOutputStream;\n\
  import java.io.IOException;\n.\n.\nimport android.graphics.pdf.PdfDocument.PageInfo;\n\
  .\n.\n\n@Override\npublic void onWrite(final PageRange[] pageRanges,\n         \
  \           final ParcelFileDescriptor destination,\n                    final CancellationSignal\
  \ cancellationSignal,\n                    final WriteResultCallback callback) {\n\
  \    for (int i = 0; i < totalpages; i++) {\n        if (pageInRange(pageRanges,\
  \ i)) {\n            PageInfo newPage = new PageInfo.Builder(pageWidth,\n      \
  \              pageHeight, i).create();\n            PdfDocument.Page page =\n \
  \                   myPdfDocument.startPage(newPage);\n            if (cancellationSignal.isCanceled())\
  \ {\n                callback.onWriteCancelled();\n                myPdfDocument.close();\n\
  \                myPdfDocument = null;\n                return;\n            }\n\
  \            drawPage(page, i);\n            myPdfDocument.finishPage(page);\n \
  \       }\n    }\n    try {\n        myPdfDocument.writeTo(new FileOutputStream(\n\
  \            destination.getFileDescriptor()));\n    } catch (IOException e) {\n\
  \        callback.onWriteFailed(e.toString());\n        return;\n    } finally {\n\
  \        myPdfDocument.close();\n        myPdfDocument = null;\n    }\n    callback.onWriteFinished(pageRanges);\n\
  }\n```\n\n`onWrite()` 方法从循环遍历文档中的每一页开始。重要的是要考虑到，用户可能并没有请求打印组成文档的所有页面。事实上，打印框架的图形界面面板提供了指定特定页面或页范围的选项。图\
  \ 79-2 显示了配置为打印文档第 1-4 页、第 8-9 页以及第 11-13 页的打印面板。\n\n在将页面写入 PDF 文档时，`onWrite()`\
  \ 方法必须采取措施确保只打印用户指定的页面。为了实现这一点，打印框架将一个 `PageRange` 对象数组作为参数传入，指示要打印的页范围。在上述 `onWrite()`\
  \ 实现中，对每个页面都会调用一个名为 `pagesInRange()` 的方法，以验证该页是否在指定的范围内。`pagesInRange()` 方法的代码将在本章后面部分实现。\n\
  \n```java\nfor (int i = 0; i < totalpages; i++) {\n    if (pageInRange(pageRanges,\
  \ i)) {\n    }\n}\n```\n\n对于位于任何指定范围内的每一页，都会创建一个新的 `PdfDocument.Page` 对象。在创建新页面时，之前由\
  \ `onLayout()` 方法存储的高度和宽度值将作为参数传入，以便页面大小与用户选择的打印选项匹配：\n\n```java\nPageInfo newPage\
  \ = new PageInfo.Builder(pageWidth, pageHeight, i).create();\nPdfDocument.Page page\
  \ = myPdfDocument.startPage(newPage);\n```\n\n与 `onLayout()` 方法一样，`onWrite()` 方法需要响应取消请求。在这种情况下，代码在关闭并取消引用\
  \ `myPdfDocument` 变量之前，会通知打印框架已执行取消：\n\n```java\nif (cancellationSignal.isCanceled())\
  \ {\n    callback.onWriteCancelled();\n    myPdfDocument.close();\n    myPdfDocument\
  \ = null;\n    return;\n}\n```\n\n只要打印过程没有被取消，该方法就会调用一个方法在当前页面上绘制内容，然后调用 `myPdfDocument`\
  \ 对象的 `finishPage()` 方法。\n\n```java\ndrawPage(page, i);\nmyPdfDocument.finishPage(page);\n\
  ```\n\n`drawPage()` 方法负责将内容绘制到页面上，将在 `onWrite()` 方法完成后实现。\n\n当所需的页数已添加到 PDF 文档后，文档将使用作为参数传入\
  \ `onWrite()` 方法的文件描述符写入目标流。如果由于任何原因导致写入操作失败，该方法将通过调用 `WriteResultCallback` 对象的\
  \ `onWriteFailed()` 方法（该对象也作为参数传入 `onWrite()` 方法）通知框架：\n\n```java\ntry {\n    myPdfDocument.writeTo(new\
  \ FileOutputStream(\n        destination.getFileDescriptor()));\n} catch (IOException\
  \ e) {\n    callback.onWriteFailed(e.toString());\n    return;\n} finally {\n  \
  \  myPdfDocument.close();\n    myPdfDocument = null;\n}\n```\n\n最后，调用 `WriteCallback`\
  \ 对象的 `onWriteFinished()` 方法，通知打印框架文档已准备好打印。\n\n## 79.6 检查范围内的页面\n\n如前所述，当调用 `onWrite()`\
  \ 方法时，会传入一个 `PageRange` 对象数组，指示文档内要打印的页范围。`PageRange` 类设计用于存储页范围的起始页和结束页，这些页码可以通过类的\
  \ `getStart()` 和 `getEnd()` 方法访问。\n\n在上一节实现 `onWrite()` 方法时，调用了一个名为 `pageInRange()`\
  \ 的方法，该方法的参数为 `PageRange` 对象数组和一个页码。`pageInRange()` 方法的作用是识别指定的页码是否在指定的范围内，并可以在\
  \ `MainActivity.java` 类中的 `MyPrintDocumentAdapter` 类如下实现：\n\n```java\npublic class\
  \ MyPrintDocumentAdapter extends PrintDocumentAdapter {\n.\n.\n    private boolean\
  \ pageInRange(PageRange[] pageRanges, int page) {\n        for (PageRange pageRange\
  \ : pageRanges) {\n            if ((page >= pageRange.getStart()) &&\n         \
  \       (page <= pageRange.getEnd())) {\n                return true;\n        \
  \    }\n        }\n        return false;\n    }\n.\n.\n}\n```\n\n## 79.7 在页面画布上绘制内容\n\
  \n\n\n\n我们现在已经到了需要编写代码来在页面上绘制内容，以便其准备好打印的阶段。所绘制的内容完全取决于应用程序，并且仅限于使用 `Android Canvas`\
  \ 类所能实现的内容。然而，为了本示例的，将在画布上绘制一些简单的文本和图形。\n\n`onWrite()` 方法被设计为调用名为 `drawPage()` 的方法，该方法接收代表当前页的\
  \ `PdfDocument.Page` 对象和页码的整数作为参数。在 `MainActivity.java` 文件中，该方法的实现方式如下：\n\n```java\n\
  package com.ebookfrenzy.customprint;\n\n.\n\n.\n\nimport android.graphics.Canvas;\n\
  \nimport android.graphics.Color;\n\nimport android.graphics.Paint;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n\n.\n\n.\n\n    public static class\
  \ MyPrintDocumentAdapter extends PrintDocumentAdapter\n    {\n.\n\n.\n\n       \
  \ private void drawPage(PdfDocument.Page page, int pagenumber) {\n            Canvas\
  \ canvas = page.getCanvas();\n            pagenumber++; // 确保页码从 1 开始\n        \
  \    int titleBaseLine = 72;\n            int leftMargin = 54;\n            Paint\
  \ paint = new Paint();\n            paint.setColor(Color.BLACK);\n            paint.setTextSize(40);\n\
  \            canvas.drawText(\n                \"Test Print Document Page \" + pagenumber,\n\
  \                leftMargin,\n                titleBaseLine,\n                paint);\n\
  \            paint.setTextSize(14);\n            canvas.drawText(\"This is some\
  \ test content to verify that custom document printing works\", leftMargin, titleBaseLine\
  \ + 35, paint);\n            if (pagenumber % 2 == 0)\n                paint.setColor(Color.RED);\n\
  \            else\n                paint.setColor(Color.GREEN);\n            PageInfo\
  \ pageInfo = page.getInfo();\n            canvas.drawCircle(pageInfo.getPageWidth()/2,\n\
  \                pageInfo.getPageHeight()/2,\n                150, paint);\n   \
  \     }\n.\n\n}\n```\n\n代码中的页码从 `0` 开始。由于文档传统上从第 `1` 页开始，因此方法首先增加页码。然后获取与页面相关的 `Canvas`\
  \ 对象的引用，并声明了一些边距和基线值：\n\n```java\nCanvas canvas = page.getCanvas();\npagenumber++;\n\
  int titleBaseLine = 72;\nint leftMargin = 54;\n```\n\n接下来，代码创建了 `Paint` 和 `Color`\
  \ 对象用于绘制，设置了字体大小并绘制页面标题，包括当前页码：\n\n```java\nPaint paint = new Paint();\npaint.setColor(Color.BLACK);\n\
  paint.setTextSize(40);\ncanvas.drawText(\"Test Print Document Page \" + pagenumber,\n\
  \    leftMargin,\n    titleBaseLine,\n    paint);\n```\n\n然后减小字体大小并在标题下方绘制一些正文：\n\
  \n```java\npaint.setTextSize(14);\ncanvas.drawText(\"This is some test content to\
  \ verify that custom document printing works\", leftMargin, titleBaseLine + 35,\
  \ paint);\n```\n\n该方法执行的最后项任务是绘制一个圆（偶数页为红色，奇数页为绿色）。在确定页面是奇是偶后，方法获取页面的高度和宽度，然后使用这些信息将圆置于页面中心：\n\
  \n```java\nif (pagenumber % 2 == 0)\n    paint.setColor(Color.RED);\nelse\n    paint.setColor(Color.GREEN);\n\
  PageInfo pageInfo = page.getInfo();\ncanvas.drawCircle(pageInfo.getPageWidth()/2,\n\
  \    pageInfo.getPageHeight()/2,\n    150, paint);\n```\n\n在画布上绘制完成后，该方法将控制权交回 `onWrite()`\
  \ 方法。\n\n## 79.8 开始打印任务\n\n当点击“Print Document”按钮时，将调用 `printDocument()` 事件处理器。在开始测试之前，剩下的工作是将此方法添加到\
  \ `MainActivity.java` 中，特别注意确保将其放置在 `MyDocumentAdapter` 类之外：\n\n```java\npackage\
  \ com.ebookfrenzy.customprint;\n\nimport android.print.PrintManager;\nimport android.view.View;\n\
  \npublic class MainActivity extends AppCompatActivity {\n\n    public void printDocument(View\
  \ view) {\n        PrintManager printManager = (PrintManager) this.getSystemService(Context.PRINT_SERVICE);\n\
  \        String jobName = this.getString(R.string.app_name) + \" Document\";\n \
  \       printManager.print(jobName, new MyDocumentAdapter(this), null);\n    }\n\
  }\n```\n\n## 79.9 测试应用程序\n\n在运行 Android 4.4 或更高版本的设备或模拟器上编译并运行应用程序。当应用程序加载后，点击“Print\
  \ Document”按钮启动打印任务，并为输出选择合适的目标（保存为 PDF 选项是避免浪费纸张和墨水的有用选项）。\n\n检查打印输出，它应该包含文本和图形在内的\
  \ 4 个页面。例如，图 79-3](#Custom_Printing.xhtml__idAnchor1489) 显示了作为 PDF 文件查看的文档四页，准备保存到设备上。\n\
  \n尝试其他的打印配置选项，例如在打印面板中更改纸尺寸、方向和页面设置。每项设置更改都应该反映在打印输出中，表明自定义文档适配器正在正常工作。\n\n![](img/as_4.1_custom_print_running.jpg)\n\
  \n图 79-3\n\n## 79.10 总结\n\n虽然自定义文档打印实现比 Android 打印框架的 HTML 和图像打印选项更复杂，但在从 Android\
  \ 应用程序打印复杂内容方面，自定义文档打印提供了巨大的灵活性。实现自定义文档打印的大部分工作涉及创建一个自定义 Print Adapter 类，使其不仅能在文档页面上绘制内容，还能在用户更改打印设置（如页面大小和打印页面范围）时做出正确响应。\n\
  \n# 80 Android App Links 简介\n\n随着技术的演进，网页和移动内容之间的传统区别开始模糊。这一点在一个 true 领域是渐进式 Web\
  \ 应用（PWA）的日益普及，Web 应用的外观和行为与传统的移动应用非常相似。\n\n另一个趋势是让移动应用中的内容可以通过网页搜索和 URL 链接被发现。在\
  \ Android 应用开发背景下，App Links 功能专门设计用于让用户能够更容易发现并访问存储在 Android 应用中的内容，即使使用户没有安装该应用。\n\
  \n## 80.1 Android App Links 概述\n\n\n\n\n\n应用链接（App link）是一种标准的 HTTP URL，旨在从外部源（如网站或应用）直接链接到应用内特定位置的便捷方式。应用链接（也称为深度链接\
  \ deep links）主要用于鼓励用户与应用交互，并允许用户共享应用内容。\n\n应用链接的实现是一个多步骤过程，涉及在项目清单（manifest）中添加意图过滤器（intent\
  \ filters）、在关联 Activity 中实现链接处理代码，以及使用数字资产文件（digital assets files）将应用与基于网络的内容关联起来。\n\
  \n这些步骤可以通过手动修改项目内容来完成，也可以使用 Android Studio 应用链接助手（App Links Assistant）自动完成。\n\n\
  本章其余部分将从需要对项目进行的更改来概述应用链接的实现。下一章（“Android Studio 应用链接教程）将演示如何使用应用链接助手来实现相同的效果。\n\
  \n## 80.2 App Link 意图过滤器\n\n应用链接 URL 需要映射到应用项目中的特定 Activity。这通过向项目的 `AndroidManifest.xml`\
  \ 文件中添加意图过滤器来实现，这些过滤器设计用于响应 `android.intent.action.VIEW` 动作并启动 Activity。意图过滤器声明在要启动的\
  \ Activity 元素内部，并且包含概述应用链接 URL 的方案（scheme）、主机（host）和路径（path）的数据。例如，下面的清单片段声明了当检测到匹配\
  \ `http://www.example.com/welcome` 的应用链接时，启动名为 `MyActivity` 的 Activity：\n\n```xml\n\
  <activity android:name=\"com.ebookfrenzy.myapp.MyActivity\">\n    <intent-filter>\n\
  \        <action android:name=\"android.intent.action.VIEW\" />\n        <category\
  \ android:name=\"android.intent.category.DEFAULT\" />\n        <category android:name=\"\
  android.intent.category.BROWSABLE\" />\n        <data\n            android:scheme=\"\
  http\"\n            android:host=\"www.example.com\"\n            android:pathPrefix=\"\
  /welcome\" />\n    </intent-filter>\n</activity>\n```\n\n处理歧义意图过滤器的顺序可以使用意图过滤器标签的\
  \ `order` 属性进行指定，如下文所示：\n\n```xml\n<application>\n    <activity android:name=\"\
  \ com.ebookfrenzy.myapp.MyActivity\">\n        <intent-filter android:order=\"1\"\
  >\n...\n```\n\n意图过滤器会导致应用链接启动正确的 Activity，但仍需要在目标 Activity 中实现代码以妥善处理该意图。\n\n##\
  \ 80.3 处理 App Link 意图\n\n在大多数情况下，启动的 Activity 需要获取应用链接 URL 的访问权限，并根据 URL 的结构采取特定操作。接上上面的示例，如果通过包含\
  \ `/welcome/newuser` 路径的 URL 启动，Activity 显示的内容可能与路径设置为 `/welcome/existinguser` 的\
  \ URL 启动时不同。\n\n当 Activity 由链接启动时，它会接收一个 `intent` 对象，该对象包含有关启动 Activity 动作的数据，包括一个包含应用链接\
  \ URL 的 `Uri` 对象。在 Activity 的初始化阶段，可以添加代码来提取这些数据：\n\n```java\nIntent appLinkIntent\
  \ = getIntent();\nString appLinkAction = appLinkIntent.getAction();\nUri appLinkData\
  \ = appLinkIntent.getData();\n```\n\n获取应用链接的 `Uri` 后，可以使用构成 URL 路径的各种组件来对在 Activity\
  \ 内执行的操作做出决策。在接下来的代码示例中，URL 的最后一个组件被用于识别应该为新用户还是现有用户显示内容：\n\n```java\nString userType\
  \ = appLinkData.getLastPathSegment();\nif (userType.equals(\"newuser\")) {\n   \
  \ // 显示新用户内容\n} else {\n    // 显示现有用户内容\n}\n```\n\n## 80.4 将应用与网站关联\n\n默认情况下，Android\
  \ 将通过图 80-1 所示面板为用户提供处理应用链接的选项。这通常包括 Chrome 浏览器和目标应用。\n\n![](img/as_4.1_app_links_chooser.jpg)\n\
  图 80-1\n\n为了防止这种情况的发生，应用链接 URL 需要与其基础所在的网站关联。这通过创建一个名为 `assetlinks.json` 的数字资产链接文件并将其在网站的\
  \ `.well-known` 中来实现。注意，数字资产链接适用于基于 https 的网站。\n\n数字资产链接文件包含一个关系声明（relation statement），允许目标应用使用网站的链接\
  \ URL 启动，以及一个目标声明（target statement），声明该项目的配套应用包名和 SHA-256 证书指纹。一个典型的资产链接文件内容可能如下：\n\
  \n```json\n[\n  {\n    \"relation\": [\"delegate_permission/common.handle_urls\"\
  ],\n    \"target\": {\n      \"namespace\": \"android_app\",\n      \"package_name\"\
  : \"<app name>\",\n      \"sha256_cert_fingerprints\": [\"<app certificate>\"]\n\
  \    }\n  }\n]\n```\n\n`assetlinks.json` 文件可以包含多个数字资产链接，可能允许单个站点关联多个应用。\n\n## 80.5\
  \ 总结\n\nAndroid App Links 允许通过网站和应用的链接启动应用 Activity。应用链接的实现使用了项目清单中的意图过滤器与 Activity\
  \ 内部意图处理代码相结合。还可以通过使用数字资产文件将应用链接中使用的域名与相应的网站关联。一旦建立关联，在使用应用链接时，Android 不再需要用户选择目标应用。\n\
  \n## 81. Android Studio 应用链接教程\n\n本章的目标是提供应用链接和 Android Studio 助手的实用演示。本章将为现有应用添加链接支持，允许通过\
  \ URL 启动 Activity。除了启动 Activity 之外，显示的内容将在路径中指定。\n\n### 81.1 关于示例应用\n\n本章使用的项目名为\
  \ `AppLink`，是一个允许用户查询伦敦地标的基础应用。该应用通过标准内容提供者访问 SQLite 数据库。应用提供了一个包含游客景点的现有数据库。除了现有数据库条目外，应用还允许用户添加和删除地标描述。\n\
  \n在当前形式下，应用允许对现有记录进行搜索，并添加和删除新记录。\n\n项目由两个 Activity 组成：`AppLinkActivity` 和 `LandmarkActivity`。`AppLinkActivity`\
  \ 是应用启动的主 Activity。该活动允许用户输入搜索标准并向数据库添加额外记录。当搜索找到匹配记录时，`LandmarkActivity` 会启动并显示相关标记的信息。\n\
  \n本章的目标是增强应用以添加链接支持，以便可以使用 URL 在应用内显示特定的标记记录。\n\n## 81.2 数据库结构\n\n示例应用的数据位于项目层次结构\
  \ `app -> assets -> databases` 文件夹下的 `landmarks.db` 文件中。数据库包含一个名为 `locations` 的表，其结构如表\
  \ 81-5 所示：\n\n| 列 | 类型 | 描述 |\n| :--- | :--- | :--- |\n| `_id` | String | 主索引，此列包含唯一标识数据库中标记的字符串值。\
  \ |\n| `Title` | String | 地标的名称（例如伦敦桥）。 |\n\n\n\n\n\n| description | String | 地标的描述。\
  \ |\n| personal | Boolean | 表示该记录是个人的还是公共的。对于用户添加的所有记录，此值被设置为 `true`。数据库提供的现有记录被设置为\
  \ `false`。 |\n\n**表 81-5**\n\n---\n\n## 81.3 加载并运行项目\n\n该项目包含在示例源代码下载压缩包的 `AppLinking`\
  \ 文件夹中，该包 URL 如下：\n\n[`www.ebookfrenzy.com/retail/androidstudio41/index.php`](https://www.ebookfrenzy.com/retail/androidstudio41/index.php)\n\
  \n找到文件夹后，在 `Android Studio` 中打开它，并在设备或模拟器上运行该应用。一旦应用启动，屏幕将会出现下方图 81-1 所示的界面：\n\n\
  ![](img/Image24493.jpg)\n图 81-1\n\n按照目前的实现，地标是使用位置 ID 进行定位的。默认数据库配置当前包含两个由 ID `londonbridge`\
  \ 和 `toweroflondon` 引用的记录。在 ID 字段中输入 `londonbridge` 并点击 `Find` 按钮来测试搜索功能。当找到匹配的记录时，第二个活动（`LandmarkActivity`）将被启动，并传递有关要显示记录的信息。这些信息以添加到\
  \ `Intent` 对象的额外数据形式存在。`LandmarkActivity` 使用这些信息从数据库中提取记录，并使用图 81-2 所示的屏幕向用户显示它。\n\
  \n![](img/Image24581.jpg)\n图 81-2\n\n---\n\n## 81.4 添加 URL 映射\n\n现在应用已经加载到 `Android\
  \ Studio` 并经过了测试，项目已准备好添加应用链接（app link）支持。目标是让 `LandmarkActivity` 屏幕响应应用链接点击点击启动并显示信息。这是通过将\
  \ URL 映射到 `LandmarkActivity` 实现的。在本示例中，URL 的格式如下：\n\n`http://<website domain>/landmarks/<landmarkId>`\n\
  \n完成所有步骤后，例如以下 URL 应该导致应用显示伦敦塔（Tower of London）的信息：\n\n`http://www.yourdomain.com/landmarks/toweroflondon`\n\
  \n要向项目添加 URL 映射，首先通过 `Tools -> App Links Assistant` 菜单选项打开 `App Links Assistant`。打开后，助手程序将如图\
  \ 81-3 所示：\n\n![](img/as_4.1_app_links_assistant.jpg)\n图 81-3\n\n点击 `Open URL Mapping\
  \ Editor` 按钮开始将 URL 映射到活动。在映射屏幕中，点击 `+` 按钮（在图 81-4 中突出显示）来添加新的 URL：\n\n![](img/Image2473.jpg)\n\
  图 81-4\n\n在 `Add URL Mapping` 对话框的 `Host` 字段中，输入你网站的域名，或者如果没有，则输入 `http://www.example.com`。\n\
  \n`Path` 字段（在下方图 81-5 中标记为 A）是声明 URL 路径组件的地方。路径必须以 `/` 开头，因此在此字段中输入 `/landmarks`。\n\
  \n`Path` 菜单 (B) 提供了以下三个路径匹配选项：\n\n*   `path`：URL 必须完全匹配 URL 的路径组件才能启动活动。例如，如果路径设置为\
  \ `/landmarks`，则 `http://www.example.com/landmarks`将被视为匹配项。然而，`http://www.example.com/landmarks/londonbridge`\
  \ 将不被视为匹配项。\n*   `pathPrefix`：指定的路径仅被视为前缀。在 `/landmarks` 组件之后可以包含额外的路径组件（例如 `http://www.example.com/landmarks/londonbridge`\
  \ 仍将被视为匹配项）。\n*   `pathPattern`：允许使用基本正则表达式和通配符形式的模式匹配来指定路径，例如 `landmarks/*/[l-L]ondon/*`。\n\
  \n由于此示例中的路径是地标 ID 组件的前缀，请选择 `pathPrefix` 菜单选项。\n\n最后，使用 `Activity` 菜单 (C) 选择 `LandmarkActivity`\
  \ 作为响应应用链接启动的活动：\n\n![](img/Image24811.jpg)\n图 81-5\n\n完成对话框中的设置后，点击 `OK` 按钮提交更改。通过在映射屏幕的\
  \ `Check URL Mapping` 字段中输入以下 URL（其中 `<your domain>` 设置为上方 `Host` 字段中指定的域名），检查 URL\
  \ 格式是否正确并已分配给相应的活动：\n\n`http://<your domain>/landmarks/toweroflondon`\n\n如果映射配置正确，`LandmarkActivity`\
  \ 将列为已映射的活动：\n\n![](img/Image2489.jpg)\n图 81-6\n\n最新版本的 Android 要求同时为 HTTP 和 HTTPS\
  \ 协议声明 App Links，即使只使用了其中一个。因此，在继续后续步骤之前，请重复上述步骤添加 HTTPS 版本的 URL。\n\n保持 App Links\
  \ Assistant 中的映射选择状态。\n\n---\n\n## 81.5 添加意图过滤器\n\n正如前面的章节所述，需要一个意图过滤器（intent filter）允许目标活动响应应用链接。事实上，当添加\
  \ URL 映射时，意图过滤器已自动添加到清单。在 App Links Assistant 中选择映射屏幕，向下滚动屏幕直到意图过滤器进入视图。预览应包含新增的\
  \ `AndroidManifest.xml`：\n\n![](img/Image2496.jpg)\n图 81-7\n\n---\n\n## 81.6 添加意图处理代码\n\
  \n到为止的步骤确保了响应格式正确的应用链接启动正确的活动。下一步是在类内部处理意图。在对 `LandmarkActivity.java` 文件中的任何更改之前，值得查看代码的一些区域。在代码编辑器中打开\
  \ `LandmarkActivity.java` 文件并找到 `onCreate()` 和 `handleIntent()` 方法，它们目前如下：\n\n```java\n\
  @Override\nprotected void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    setContentView(R.layout.activity_landmark);\n    titleText = findViewById(R.id.titleText);\n\
  \    descriptionText = findViewById(R.id.descriptionText);\n    deleteButton = findViewById(R.id.deleteButton);\n\
  \    handleIntent(getIntent());\n}\n\nprivate void handleIntent(Intent intent) {\n\
  \    String landmarkId = intent.getStringExtra(AppLinkingActivity.LANDMARK_ID);\n\
  \    displayLandmark(landmarkId);\n}\n```\n\n在当前形式下，代码期望在 `Intent` 的额外数据中找到地标 ID。由于活动现在也可以通过应用链接启动，需要更改此代码以处理两种情况。首先删除\
  \ `onCreate()` 方法中对 `handleIntent()` 的调用：\n\n```java\n@Override\nprotected void\
  \ onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    setContentView(R.layout.activity_landmark);\n    titleText = findViewById(R.id.titleText);\n\
  \    descriptionText = findViewById(R.id.descriptionText);\n    deleteButton = findViewById(R.id.deleteButton);\n\
  }\n```\n\n要添加初始的应用链接意图处理代码，返回 App Links Assistant 面板并点击步骤 2 列出的 `Select Activity`\
  \ 按钮。在活动选择对话框中，选择 `LandmarkActivity` 条，然后点击 `Insert Code` 按钮：\n\n![](img/Image2504.jpg)\n\
  图 81-8\n\n返回 `LandmarkActivity.java` 文件并注意以下代码已插入到 `onCreate()` 方法中（如果 Android Studio\
  \ 无法完成请求，您可以手动添加此代码）：\n\n\n\n\n\n```java\n// ATTENTION: This was auto-generated\
  \ to handle app links.\n\nIntent appLinkIntent = getIntent();\n\nString appLinkAction\
  \ = appLinkIntent.getAction();\n\nUri appLinkData = appLinkIntent.getData();\n```\n\
  \n这段代码访问了 `Intent` 对象并提取 `Action` 字符串和 `Uri`。如果 Activity 的启动是由应用链接（app link）导致的，则\
  \ action 字符串将被设置为 `android.intent.action.VIEW`，这与添加到清单文件中意图过滤器（intent filter）中声明的\
  \ action 相匹配。相反，如果 Activity 是通过主 Activity 中 `findLandmark()` 方法中的标准启动启动代码启动的，则 action\
  \ 字符串将为 `null`。通过检查赋值给 action 字符串的值，可以编写代码来识别启动 Activity 的方式并采取相应的操作：\n\n```java\n\
  import android.net.Uri;\n\n@Override\nprotected void onCreate(Bundle savedInstanceState)\
  \ {\n    super.onCreate(savedInstanceState);\n    setContentView(R.layout.activity_landmark);\n\
  \n    // ATTENTION: This was auto-generated to handle app links.\n    Intent appLinkIntent\
  \ = getIntent();\n    String appLinkAction = appLinkIntent.getAction();\n    Uri\
  \ appLinkData = appLinkIntent.getData();\n    String landmarkId = appLinkData.getLastPathSegment();\n\
  \    if (landmarkId != null) {\n        displayLandmark(landmarkId);\n    }\n}\n\
  ```\n\n剩下的就是在该方法中添加一些额外的代码以识别应用链接 URL 路径中的最后一个组件，并在查询数据库时将其作为 landmark ID：\n\n```java\n\
  @Override\nprotected void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    setContentView(R.layout.activity_landmark);\n    titleText = findViewById(R.id.titleText);\n\
  \    descriptionText = findViewById(R.id.descriptionText);\n    deleteButton = findViewById(R.id.deleteButton);\n\
  \n    // ATTENTION: This was auto-generated to handle app links.\n    Intent appLinkIntent\
  \ = getIntent();\n    String appLinkAction = appLinkIntent.getAction();\n    Uri\
  \ appLinkData = appLinkIntent.getData();\n    if (appLinkAction != null) {\n   \
  \     if (appLinkAction.equals(\"android.intent.action.VIEW\")) {\n            String\
  \ landmarkId = appLinkData.getLastPathSegment();\n            if (landmarkId !=\
  \ null) {\n                Log.i(TAG, \"landmarkId = \" + landmarkId);\n       \
  \         displayLandmark(landmarkId);\n            }\n        }\n    } else {\n\
  \        handleIntent(appLinkIntent);\n    }\n}\n```\n\n如果 action 字符串不是 `null`，则会在提取\
  \ `Uri` 路径的最后一个组件之前进行检查以验证其是否被设置为 `android.intent.action.VIEW`。随后，该组件将在执行数据库查询时作为\
  \ landmark ID。相反，如果 action 字符串为 `null`，则调用现有的 `handleIntent()` 方法从 intent 数据中提取\
  \ ID。\n\n识别 Activity 启动方式的另一种方案是修改位于 `AppLinkingActivity.java` 文件中的 `findLandmark()`\
  \ 方法，使其也能通过 View 意图操作触发启动：\n\n```java\npublic void findLandmark(View view) {\n \
