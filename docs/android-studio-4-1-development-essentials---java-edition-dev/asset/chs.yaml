  \n![](img/as_3.4_linearlayout_change_orientation.jpg)\n\n图 67-5\n\n转换完成后，选择并删除布局中的默认\
  \ `TextView` 挂件。\n\n## 67.4 向用户界面添加 TableLayout\n\n继续留在 `main_fragment.xml` 文件中并参考\
  \ Palette（调色板）中的 `Layouts`（布局）类别，拖放一个 `TableLayout` 视图，使其位于 `LinearLayout` 画布区域顶部。\n\
