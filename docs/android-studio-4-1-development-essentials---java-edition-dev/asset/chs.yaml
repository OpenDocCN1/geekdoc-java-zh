  \ tab) {\n        }\n    });\n```\n\n## 47.9 测试应用程序\n\n在设备或模拟器上编译并运行应用，确保选择一个标签页会导致相应的片段显示在内容区域：\n\
  \n![](img/as_4.1_tab_layout_running.jpg) 图 47-6\n\n## 47.10 自定义 TabLayout\n\n此示例中的\
  \ `TabLayout` 使用固定模式（fixed mode）配置的。这种模式适用于数量有限且标题较短的标签页。如图 47-7 所示，如果标签页较多或标题较长，使用固定模式很快就会出现问题：\n\
  \n![](img/as_4.1_tab_layout_truncated.jpg) 图 47-7\n\n为了让标签页适应可用宽度，`TabLayout` 使用了多行文本。尽管如此，第二行明显被截断了，导致无法看到完整标题。解决此问题的最佳方案是将\
  \ `TabLayout` 切换到滚动模式（scrollable mode）。在这种模式下，标题将以全长度单行格式显示，允许用户如图 47-8 所示通过水平滑动来查看可用项目：\n\
  \n![](img/as_4.1_tab_layout_scrollable.jpg) 图 47-8\n\n要将 `TabLayout` 切换到滚动模式，只需将\
  \ `activity_main.xml` 布局资源文件中的 `app:tabMode` 属性从 \"fixed\" 更改为 \"scrollable\"：\n\
  \n```xml\n<android.support.design.widget.TabLayout\n    android:id=\"@+id/tab_layout\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"wrap_content\"\
  \n    app:tabMode=\"scrollable\"\n    app:tabGravity=\"fill\"/>\n</android.support.design.widget.AppBarLayout>\n\
  ```\n\n在固定模式下，可以配置 `TabLayout` 来控制标签项的显示方式以占据屏幕上的可用空间。这是通过 `app:tabGravity` 属性控制的，其结果在较宽的显示（如横屏模式下的平板）上更为明显。例如，设置为\
  \ \"fill\" 时，项目将均匀分布在 `TabLayout` 的宽度上，如图 47-9 所示：\n\n![](img/as_4.1_tab_layout_fill.jpg)\
  \ 图 47-9\n\n当设置为 \"center\" 时，项目将相对于标签栏的中心对齐：\n\n![](img/as_4.1_tab_layout_center.jpg)\
  \ 图 47-10\n\n在进行本章最后一步之前，将 `activity_main.xml` 文件中的 `tabMode` 和 `tabGravity` 属性恢复为\
  \ \"fixed\" 和 \"fill\"。\n\n## 47.11 显示图标标签项\n\n本教程的最后一步是将文本标签替换为图标。通过修改 `MainActivity.java`\
  \ 中的 `onCreate()` 方法为标签项分配一些内置的 drawable 图标来实现：\n\n```java\nprivate void configureTabLayout()\
  \ {\n    TabLayout tabLayout = findViewById(R.id.tab_layout);\n    tabLayout.addTab(tabLayout.newTab().setIcon(android.R.drawable.ic_dialog_email));\n\
  \    tabLayout.addTab(tabLayout.newTab().setIcon(android.R.drawable.ic_dialog_dialer));\n\
  \    tabLayout.addTab(tabLayout.newTab().setIcon(android.R.drawable.ic_dialog_map));\n\
  \    tabLayout.addTab(tabLayout.newTab().setIcon(android.R.drawable.ic_dialog_info));\n\
  }\n```\n\n不再使用标签项的 `setText()` 方法，代码现在调用 `setIcon()` 方法并传递图标引用。编译并运行时，标签栏现在应该如图\
  \ 47-11 所示。注意，如果使用热运行（Instant Run），需要使用 `Ctrl+Shift+R` 触发热交换使更改生效：\n\n![](img/as_4.1_tab_layout_icons.jpg)\
  \ 图 47-11\n\n## 47.12 总结\n\n`TabLayout` 是作为 Android Design 设计引入的组件之一。`TabLayout`\
  \ 组件的目的是展示一系列标签项，选择它们后向用户显示不同的内容。标签项可以显示文本、图像或两者结合。与 `ViewPager` 类和片段结合时，可以相对容易地创建标签布局，每个标签项的选择都会显示不同的片段。\n\
  \n## 48. 使用 RecyclerView 和 CardView 组件\n\n`RecyclerView` 和 `CardView` 组件协同工作，为用户提供可滚动的信息列表，信息以单个卡片的形式呈现。在本章中设计并实现一个示例项目之前，将介绍这两个类的详细信息。\n\
  \n## 48.1 RecyclerView 概述\n\n\n\n\n\n正如名为 \"使用悬浮操作按钮和 Snackbar\" 的章节中概述的 `ListView`\
  \ 类一样，`RecyclerView` 的目的是允许以滚动列表的形式向用户呈现信息。然而，`RecyclerView` 相比 `ListView` 具有许多优势。特别是，`RecyclerView`\
  \ 在管理组成列表的视图方面效率高得多，它本质上是在列表项滚动出屏幕时复用现有的列表项视图，而不是创建新视图（这就是“recycler”（复用器）一命名的由来）。这既提高了性能，又减少了列表消耗的资源，该特性在向用户展示大量数据时尤为有益。\n\
  \n与 `ListView` 不同，`RecyclerView` 还提供了三种内置布局管理器供选择，以控制列表项呈现给用户的方式：\n\n• `LinearLayoutManager`\
  \ – 列表项以水平或垂直滚动列表的形式呈现。\n\n![](img/Image2427.jpg) 图 48-1\n\n• `GridLayoutManager`\
  \ – 列表项以网格格式呈现。当列表项大小一致时，使用此管理器效果最好。\n\n![](img/Image2436.jpg) 图 48-2\n\n• `StaggeredGridLayoutManager`\
  \ - 列表项以交错网格格式呈现。当列表项大小不一致时，使用此管理器效果最好。\n\n![](img/Image2443.jpg) 图 48-3\n\n对于这三种内置管理器都无法提供所需布局的情况，可以通过子类化\
  \ `RecyclerView.LayoutManager` 类来实现自定义布局管理器。\n\n在 `RecyclerView` 中显示的每个列表项都是作为 `ViewHolder`\
  \ 类的实例创建的。`ViewHolder` 实例包含了 `RecyclerView` 显示列表项所需的所有内容，包括要显示的信息和用于显示该项的视图布局。\n\
  \n与 `ListView` 一样，`RecyclerView` 依赖于适配器（adapter）作为 `RecyclerView` 实例与要显示给用户的数据之间的中间媒介。适配器被创建为\
  \ `RecyclerView.Adapter` 类的子类，并且必须实现以下方法，这些方法会被分配给适配器的 `RecyclerView` 对象在不同的时间点调用：\n\
  \n• `getItemCount()` – 此方法必须返回在列表中要显示的项数计数。\n\n• `onCreateViewHolder()` – 此方法创建并返回一个\
  \ `ViewHolder` 对象，该对象使用用于显示数据的视图进行初始化。此视图通常是通过填充（inflate）XML 布局文件创建的。\n\n• `onBindViewHolder()`\
  \ – 此方法传递由 `onCreateViewHolder()` 方法创建的 `ViewHolder` 对象以及一个指示即将显示的列表项的整数值。`ViewHolder`\
  \ 对象中包含了 `onCreateViewHolder()` 方法分配的布局。`onBindViewHolder()` 方法的责任是用与指定项对应的文本和图形填充布局中的视图中，并将该对象返回给\
  \ `RecyclerView`，由其将其呈现给用户。\n\n在布局中添加 `RecyclerView` 只需要在显示它的活动（activity）的 XML 内容布局文件中添加相应的元素。例如：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    app:layout_behavior=\"@string/appbar_scrolling_view_behavior\"\n    tools:context=\"\
  .MainActivity\"\n    tools:showIn=\"@layout/activity_card_demo\">\n\n    <androidx.recyclerview.widget.RecyclerView\n\
  \        android:id=\"@+id/recycler_view\"\n        android:layout_width=\"0dp\"\
  \n        android:layout_height=\"0dp\"\n        app:layout_constraintBottom_toBottomOf=\"\
  parent\"\n        app:layout_constraintEnd_toEndOf=\"parent\"\n        app:layout_constraintStart_toStartOf=\"\
  parent\"\n        app:layout_constraintTop_toTopOf=\"parent\"\n        tools:listItem=\"\
  @layout/card_layout\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n在上面的示例中，`RecyclerView` 被嵌入到主活动布局文件的 `CoordinatorLayout` 中，与 `AppBar` 和 `Toolbar`\
  \ 在。这提供了一些额外功能，例如配置 `Toolbar` 和 `AppBar`，当用户在 `RecyclerView` 中向上滚动时让它们滚动出屏幕（该主题在名为\
  \ \"使用 AppBar 和折叠 Toolbar 布局\" 的章节中有更详细的介绍）。\n\n## 48.2 CardView 概述\n\n`CardView`\
  \ 类是一种允许使用卡片比喻呈现信息的用户界面。卡片通常使用 `RecyclerView` 实例以列表形式呈现，并可以配置为带有阴影和圆角出现。例如，图 48-4\
  \ (#RecyclerView.xhtml__idTextAnchor984) 显示了显示带有 `ImageView` 布局的 `CardView` 实例。使用\
  \ `CardView` 呈现的用户界面定义在 XML 文件中并在运行时加载到 `CardView` 中：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<androidx.cardview.widget.CardView\n    xmlns:card_view=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    android:id=\"@+id/card_view\"\n    android:layout_width=\"match_parent\"\n\
  \    android:layout_height=\"wrap_content\"\n    android:layout_margin=\"5dp\"\n\
  \    card_view:cardCornerRadius=\"12dp\"\n    card_view:cardElevation=\"3dp\"\n\
  \    card_view:contentPadding=\"4dp\">\n\n    <RelativeLayout\n        android:layout_width=\"\
  match_parent\"\n        android:layout_height=\"wrap_content\"\n        android:padding=\"\
  16dp\">\n\n        <ImageView\n            android:id=\"@+id/item_image\"\n    \
  \        android:layout_width=\"100dp\"\n            android:layout_height=\"100dp\"\
  \n            android:layout_alignParentLeft=\"true\"\n            android:layout_alignParentTop=\"\
  true\"\n            android:layout_marginRight=\"16dp\" />\n\n    </RelativeLayout>\n\
  </androidx.cardview.widget.CardView>\n```\n\n当与 `RecyclerView` 结合创建滚动卡片列表时，滚动视图的\
  \ `onCreateViewHolder()` 方法会填充卡片资源文件，将其分配给 `ViewHolder` 实例并将其返回给 `RecyclerView`\
  \ 实例。\n\n## 48.3 总结\n\n本章介绍了 Android `RecyclerView` 和 `CardView` 组件。`RecyclerView`\
  \ 为在 Android 应用中显示滚动列表提供了一种资源高效的方法。`CardView` 在以卡片形式呈现组数据（例如姓名和地址列表）时非常有用。正如前面所述的，并在下一章的教程中演示的那样，`RecyclerView`\
  \ 和 `CardView` 结合使用时特别有用。\n\n## 49. Android RecyclerView 和 CardView 教程\n\n\n\n\n\
  在本章中，我们将创建一个示例项目，该项目将同时利用 `CardView` 和 `RecyclerView` 组件来创建一个可滚动的卡片列表。完成的应用将显示一个包含图像和文本的卡片列表。除了显示卡片列表外，项目还将实现为点击卡片时会向用户显示消息，指示点击了哪一个卡片。\n\
  \n## 49.1 创建 CardDemo 项目\n\n从欢迎界面选择 `Create New Project` 快速启动选项，在弹出的新项目对话框中，点击 `Next`\
  \ 按钮之前选择 `Basic Activity` 模板。\n\n在 `Name` 字段中输入 `CardDemo`，并指定 `com.ebookfrenzy.carddemo`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将\
  \ `Language` 菜单更改为 `Java`。\n\n## 49.2 修改 Basic Activity 项目\n\n由于选择了 `Basic Activity`，布局中包含了一个悬浮动作按钮，但该项目不需要它。在\
  \ `Layout Editor` 工具中加载 `activity_main.xml` 布局文件，选择悬浮动作按钮并按下键盘上的删除键从布局中移除该对象。编辑\
  \ `MainActivity.java` 文件，如下所示从 `onCreate` 方法中移除悬浮动作按钮的代码：\n\n```java\n@Override\n\
  protected void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    setContentView(R.layout.activity_card_demo);\n    Toolbar toolbar = findViewById(R.id.toolbar);\n\
  \    setSupportActionBar(toolbar);\n    FloatingActionButton fab = findViewById(R.id.fab);\n\
  \    fab.setOnClickListener(new View.OnClickListener() {\n        @Override\n  \
  \      public void onClick(View view) {\n            Snackbar.make(view, \"Replace\
  \ with your own action\",\n                    Snackbar.LENGTH_LONG)\n         \
  \           .setAction(\"Action\", null).show();\n        }\n    });\n}\n```\n\n\
  项目不需要默认的导航功能，因此打开 `content_main.xml` 文件并从布局中删除 `NavHostFragment` 对象，只保留 `ConstraintLayout`\
  \ 父布局。\n\n## 49.3 设计 CardView 布局\n\n卡片内包含的视图布局将在单独的 XML 布局文件中定义。在 `Project` 工具窗口中，右键点击\
  \ `app -> res -> layout` 项并选择 `New -> Layout Resource File` 菜单选项。在 `New Resource\
  \ Dialog` 中，在 `File name:` 字段中输入 `card_layout`，并在点击 `OK` 按钮之前在根元素字段输入 `androidx.cardview.widget.CardView`。\n\
  \n在 `Layout Editor` 工具中加载 `card_layout.xml` 文件，切换到 `Code` 模式并修改布局如下：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.cardview.widget.CardView\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    android:layout_width=\"match_parent\"\
  \n    android:layout_height=\"wrap_content\"\n    android:id=\"@+id/card_view\"\n\
  \    android:layout_margin=\"5dp\"\n    app:cardBackgroundColor=\"#81C784\"\n  \
  \  app:cardCornerRadius=\"12dp\"\n    app:cardElevation=\"3dp\"\n    app:contentPadding=\"\
  4dp\">\n    <androidx.constraintlayout.widget.ConstraintLayout\n        android:id=\"\
  @+id/relativeLayout\"\n        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  wrap_content\"\n        android:padding=\"16dp\">\n        <ImageView\n        \
  \    android:id=\"@+id/item_image\"\n            android:layout_width=\"100dp\"\n\
  \            android:layout_height=\"100dp\"\n            app:layout_constraintLeft_toLeftOf=\"\
  parent\"\n            app:layout_constraintStart_toStartOf=\"parent\"\n        \
  \    app:layout_constraintTop_toTopOf=\"parent\" />\n        <TextView\n       \
  \     android:id=\"@+id/item_title\"\n            android:layout_width=\"236dp\"\
  \n            android:layout_height=\"39dp\"\n            android:layout_marginStart=\"\
  16dp\"\n            android:textSize=\"30sp\"\n            app:layout_constraintLeft_toRightOf=\"\
  @+id/item_image\"\n            app:layout_constraintStart_toEndOf=\"@+id/item_image\"\
  \n            app:layout_constraintTop_toTopOf=\"parent\" />\n        <TextView\n\
  \            android:id=\"@+id/item_detail\"\n            android:layout_width=\"\
  236dp\"\n            android:layout_height=\"16dp\"\n            android:layout_marginStart=\"\
  16dp\"\n            android:layout_marginTop=\"8dp\"\n            app:layout_constraintLeft_toRightOf=\"\
  @+id/item_image\"\n            app:layout_constraintStart_toEndOf=\"@+id/item_image\"\
  \n            app:layout_constraintTop_toBottomOf=\"@+id/item_title\" />\n    </androidx.constraintlayout.widget.ConstraintLayout>\n\
  </androidx.cardview.widget.CardView>\n```\n\n## 49.4 添加 RecyclerView\n\n选择 `content_main.xml`\
  \ 布局，从 `palette` 中将 `RecyclerView` 对象拖到布局中，使其位于屏幕中心，它将调整大小以填充整个屏幕。使用 `Infer constraints`\
  \ 按钮添加任何缺失的约束。使用 `Attributes` 窗口将 `RecyclerView` 实例的 `ID` 更改为 `recyclerView`，并将\
  \ `layout_width` 和 `layout_height` 属性设置为 `match_parent`。\n\n## 49.5 添加图像文件\n\n除了两个\
  \ `TextViews`，卡片布局还包含一个 `ImageView`，`Recycler adapter` 已配置为显示图像。在测试项目之前必须添加这些图像。项目使用的图像命名为\
  \ `android_image_`，可以从此处获取：https://www.ebookfrenzy.com/retail/androidstudio1/index.php\n\
  \n在操作系统文件管理器中找到这些图像并复制。右键点击 `Project` 工具中的 `app -> res -> drawable` 项并选择 `Paste`\
  \ 将文件添加到文件夹。\n\n## 49.6 创建 RecyclerView Adapter\n\n如上一节所述，`RecyclerView` 需要一个适配器来处理列表项目的创建。通过右键点击\
  \ `Project` 工具窗口中的 `app -> java -> com.ebookfrenzy.carddemo` 项并选择 `New -> Java Class`\
  \ 向项目添加此新类。在新类对话框中，在 `Name` 字段输入 `RecyclerAdapter`，按下 `Return` 键创建新的 Java 文件。\n\n\
  编辑新的 `RecyclerAdapter.java` 文件，添加一些导入指令并声明该类继承 `RecyclerView.Adapter`。与其创建一个单独的类来提供要显示的数据，我们在适配器中也添加了一些基础数组作为应用程序的数据：\n\
  \n```java\npackage com.ebookfrenzy.carddemo;\n\nimport android.view.LayoutInflater;\n\
  import android.view.View;\nimport android.view.ViewGroup;\nimport android.widget.ImageView;\n\
  import android.widget.TextView;\nimport androidx.recyclerview.widget.RecyclerView;\n\
  \npublic class RecyclerAdapter extends RecyclerView.Adapter<RecyclerAdapter.ViewHolder>\
  \ {\n    private String[] titles = {\"Chapter One\", \"Chapter Two\", \"Chapter\
  \ Three\", \"Chapter Four\", \"Chapter Five\", \"Chapter Six\", \"Chapter Seven\"\
  , \"Chapter Eight\"};\n    private String[] details = {\"Item one details\", \"\
  Item two details\", \"Item three details\", \"Item four details\", \"Item five details\"\
  , \"Item six details\", \"Item seven details\", \"Item eight details\"};\n    private\
  \ int[] images = { R.drawable.android_image_1, R.drawable.android_image_2, R.drawable.android_image_3,\
  \ R.drawable.android_image_4, R.drawable.android_image_5,\n```\n\n\n\n\n```java\n\
  R.drawable.android_image_6,\nR.drawable.android_image_7,\nR.drawable.android_image_8\
  \ };\n}\n```\n\n在 `RecyclerAdapter` 类中，我们现在需要一个自己的 `ViewHolder` 类实现，并配置其以引用 `card_layout.xml`\
  \ 文件中的视图元素。在 `RecyclerAdapter.java` 文件中，按照如下方式实现该类：\n\n```java\npublic class RecyclerAdapter\
  \ extends RecyclerView.Adapter<RecyclerAdapter.ViewHolder> {\n\n.\n\n.\n\n    class\
  \ ViewHolder extends RecyclerView.ViewHolder {\n\n        ImageView itemImage;\n\
  \        TextView itemTitle;\n        TextView itemDetail;\n\n        ViewHolder(View\
  \ itemView) {\n            super(itemView);\n            itemImage = itemView.findViewById(R.id.item_image);\n\
  \            itemTitle = itemView.findViewById(R.id.item_title);\n            itemDetail\
  \ = itemView.findViewById(R.id.item_detail);\n        }\n\n    }\n\n.\n\n.\n\n}\n\
  ```\n\n`ViewHolder` 类包含一个 `ImageView` 和两个 `TextView` 变量，以及一个构造方法，该方法通过指向 `card_layout.xml`\
  \ 文件中三个视图项的引用来初始化这些变量。\n\n下一个添加到 `RecyclerAdapter.java` 文件中的是 `onCreateViewHolder()`\
  \ 方法的实现：\n\n```java\n@Override\npublic ViewHolder onCreateViewHolder(ViewGroup viewGroup,\
  \ int i) {\n    View v = LayoutInflater.from(viewGroup.getContext())\n         \
  \    .inflate(R.layout.card_layout, viewGroup, false);\n    ViewHolder viewHolder\
  \ = new ViewHolder(v);\n    return viewHolder;\n}\n```\n\n此方法将由 `RecyclerView` 调用以获取\
  \ `ViewHolder` 对象。它会膨胀 `card_layout.xml` 文件，并创建一个带有视图层次结构的 `ViewHolder` 类实例，然后将其返回给\
  \ `RecyclerView`。\n\n`onBindViewHolder()` 方法的作用是向 `ViewHolder` 对象中的视图层次结构中填充要显示的数据。它接收一个\
  \ `ViewHolder` 对象和一个表示要显示的列表项的整数值。现在应该添加此方法，并使用项目编号作为数据中的索引。然后，这些数据将使用 `ViewHolder`\
  \ 类构造方法中创建的引用显示在布局视图上：\n\n```java\n@Override public void onBindViewHolder(ViewHolder\
  \ viewHolder, int i) {\n    viewHolder.itemTitle.setText(titles[i]);\n    viewHolder.itemDetail.setText(details[i]);\n\
  \    viewHolder.itemImage.setImageResource(images[i]);\n}\n```\n\n适配器类的最后一个要求是实现\
  \ `getItem()` 方法，在本文情况下，该方法返回 `titles` 数组中的项数：\n\n```java\n@Override\npublic int\
  \ getItem() {\n    return titles.length;\n}\n```\n\n## 49.7 初始化 RecyclerView 组件\n\
  \n此时，项目包含一个 `RecyclerView` 实例、一个用于 `CardView` 实例的 XML 布局文件以及一个 `RecyclerView` 适配器。测试前的最后一步是使用布局管理器（layout\
  \ manager）初始化 `RecyclerView`，创建适配器实例并将该实例分配给 `RecyclerView` 对象。为了本示例，`RecyclerView`\
  \ 将配置为使用 `LinearLayoutManager` 布局。编辑 `MainActivity.java` 文件并修改 `onCreate()` 方法以实现此初始化：\n\
  \n```java\npackage com.ebookrenzy.carddemo;\n\n.\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  import androidx.appcompat.widget.Toolbar;\nimport androidx.recyclerview.widget.LinearLayoutManager;\n\
  import androidx.recyclerview.widget.RecyclerView;\nimport android.view.View;\nimport\
  \ android.view.Menu;\nimport android.view.MenuItem;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    private RecyclerView recyclerView;\n    private\
  \ RecyclerView.LayoutManager layoutManager;\n    private RecyclerView.Adapter adapter;\n\
  \n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n    \
  \    super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_demo);\n\
  \        Toolbar toolbar = findViewById(R.id.toolbar);\n        setSupportActionBar(toolbar);\n\
  \        recyclerView = findViewById(R.id.recyclerView);\n        layoutManager\
  \ = new LinearLayoutManager(this);\n        recyclerView.setLayoutManager(layoutManager);\n\
  \        adapter = new RecyclerAdapter();\n        recyclerView.setAdapter(adapter);\n\
  \    }\n\n.\n}\n```\n\n## 49.8 测试应用程序\n\n在物理设备或模拟器会话中编译并运行应用，滚动列表中的不同的卡片项：\n\n![](img/Image2434.jpg)\n\
  图 49-2\n\n## 49.9 响应卡片选择\n\n该项目的最后阶段是使列表中的卡片变为可选，以便点击卡片时会触发应用内的事件。对于此示例，卡片将配置为在被用户点击时在屏幕上显示一条消息。为了响应点击，需要修改\
  \ `ViewHolder` 类，在每个项视图上分配一个 `OnClickListener`。编辑 `RecyclAdapter.java` 文件并修改 `ViewHolder`\
  \ 声明，如下所示：\n\n```java\n.\n\nimport com.google.android.material.snackbar.Snackbar;\n\
  \n.\n\nclass ViewHolder extends RecyclerView.ViewHolder{\n    ImageView itemImage;\n\
  \    TextView itemTitle;\n    TextView itemDetail;\n\n    ViewHolder(View itemView)\
  \ {\n        super(itemView);\n        itemImage = itemView.findViewById(R.id.item_image);\n\
  \        itemTitle = itemView.findViewById(R.id.item_title);\n        itemDetail\
  \ = itemView.findViewById(R.id.item_detail);\n        itemView.setOnClickListener(new\
  \ View.OnClickListener() {\n            @Override \n            public void onClick(View\
  \ v) {\n            }\n        });\n    }\n}\n```\n\n在 `onClick` 处理体内部，现在可以添加代码来显示一条指示卡片已被点击的消息。由于由于点击执行的操作可能取决于点击了哪张卡片，因此识别被选卡片也很重要。此信息可以通过调用\
  \ `RecyclerView.ViewHolder` 类的 `getAdapterPosition()` 方法获得。留在 `RecyclerAdapter.java`\
  \ 文件中，为 `onClick` 处理程序添加代码如下：\n\n```java\n@override\npublic void onClick(View v)\
  \ {\n    int position = getAdapterPosition();\n    Snackbar.make(v, \"点击了项目 \" +\
  \ (position + 1),\n             Snackbar.LENGTH_LONG)\n          .setAction(\"Action\"\
  , null).show();\n}\n```\n\n最后一个任务是启用点击时出现的波纹效果。这只需在 `card_layout.xml` 文件的 `CardView`\
  \ 实例声明中添加一些属性即可：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.cardview.widget.CardView\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:card_view=\"\
  http://schemas.android.com/apk/res-auto\"\n    android:layout_width=\"match_parent\"\
  \n    android:layout_height=\"match_parent\"\n    android:id=\"@+id/card_view\"\n\
  \    android:layout_margin=\"5dp\"\n    app:cardBackgroundColor=\"#81C784\"\n  \
  \  app:cardCornerRadius=\"12dp\"\n    app:cardElevation=\"3dp\"\n    app:contentPadding=\"\
  4dp\"\n    android:foreground=\"?selectableItemBackground\"\n    android:clickable=\"\
  true\" >\n```\n\n49.10 总结\n\n本章讲解了结合 `CardView` 和 `RecyclerView` 组件以显示滚动卡片列表的步骤。示例还涵盖了列表项的点击检测，包括识别被选项以及在被点击的\
  \ `CardView` 实例上启用波纹视觉反馈。\n\n50. 布局编辑器示例数据教程\n\n\n\n\n在上一章节中创建的 `CardDemo` 项目提供了一个很好的示例，说明了在完成应用测试之前，很难从布局编辑器内部准确评估用户界面最终将呈现何种样。当用户界面中要显示的内容只有在用户安装并运行应用后才能生成或获取时，这个问题就会频繁发生。\n\
  \n一段时间以来，Android Studio 布局编辑器一直提供了指定简单属性的能力，这些属性仅在设计布局时有效。例如，可以将一个仅限设计时的字符串资源分配给布局编辑器中的\
  \ `TextView`，而该资源在应用运行时不会显示。随着 Android Studio 布局编辑器中引入了样本数据支持，这一功能得到了显著扩展，在本章中，我们将使用它来改进\
  \ `CardDemo` 项目中布局编辑器的体验。\n\n## 50.1 为项目添加样本数据\n\n在用户界面布局的设计阶段，`RecyclerView` 实例（图\
  \ 50-1）与上一章结束时测试的运行应用相比几乎没有相似之处：\n\n![](img/as_3.6_recyclerview_no_sample_data.jpg)\n\
  图 50-1\n\n在本书前面的“使用 Jetpack 构建现代 Android 应用架构”章节中，介绍了样本数据的概念。为了演示样本数据的使用，现在将修改项目，以便在布局编辑器内部从\
  \ `RecyclerView` 中显示完全填充的卡片。在此之前，值得注意的是，布局编辑器有一组预配置的样本数据模板，可以在设计用户界面时使用。要查看这些模板的作用，请将\
  \ `content_main.xml` 布局文件加载到布局编辑器并选择 `RecyclerView` 实例。右键点击 `RecyclerView` 并选择 `Set\
  \ Sample Data`（设置样本数据）菜单选项以显示设计属性（Design-time View Attributes）面板：\n\n![](img/as_3.2_design_time_attributes.jpg)\n\
  \n图 50-2\n\n将模板更改为 `Email Client` 选项并将项目计数更改为 12，注意 `RecyclerView` 发生了变化，显示来自模板的数据：\n\
  \n![](img/as_3.6_recyclerview_sample_data_email.jpg)\n图 50-3\n\n这些模板对于在无需任何额外工作的情况下显示样本数据非常有用，并且通常能够提供完成布局设计所需的内容。然而对于此示例，将使用样本数据来显示\
  \ `RecyclerView` 中的卡片，就像它们在运行应用中的预期外观一样。在布局编辑器仍加载 `content_main.xml` 文件的情况下，切换到\
  \ Code（代码）模式并定位 `RecyclerView` 元素，其内容如下：\n\n```xml\n<androidx.recyclerview.widget.RecyclerView\n\
  \    android:id=\"@+id/recyclerView\"\n    android:layout_width=\"0dp\"\n    android:layout_height=\"\
  0dp\"\n    app:layout_constraintBottom_toBottomOf=\"parent\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\"\n    tools:itemCount=\"12\"\n    tools:listitem=\"@layout/recycler_view_item\"\
  \ />\n```\n\n注意当前配置的两个特殊 `tools` 属性，用于在列表中显示 12 个项目，每个项目都使用名为 `recycler_view_item.xml`\
  \ 的文件中包含的布局。布局编辑器提供了系列可以在布局文件中配置的 `tools` 选项。虽然这些设置的所有内容超出了本书的范围，可以在以下 URL 找到每个设置的完整描述：\n\
  \nhttps://developer.android.com/studio/write/tool-attributes#toolssample_resources\n\
  \n上述引 `recycler_view_item.xml` 文件是由布局编辑器在选择样本数据模板时自动生成的，可以在项目工具窗口中找到。\n\n切换回 Design（设计）模式，并在选中\
  \ `RecyclerView` 的情况下，使用设计属性面板将模板切回默认设置。`recycler_view_item.xml` 文件将从项目中删除，同时 `content_main.xml`\
  \ XML 文件中的那两个 `tools` 属性行也会被删除。\n\n要切换到使用卡片布局进行样本数据显示，添加一个 `listitem` 属性来引用 `card_layout.xml`\
  \ 文件。在布局中选中 `RecyclerView` 的情况下，在 Attributes（属性）工具窗口中搜索 `listitem` 属性，并在字段中输入 `@layout/card_layout`，如图\
  \ 50-4 所示：\n\n![](img/as_4.1_sample_data_list_item.jpg)\n\n图 50-4\n\n切换回 Design（设计）模式，注意每个列表项现在都显示了卡片布局，尽管没有任何图像且使用了样本文本数据：\n\
  \n![](img/as_3.6_recyclerview_sample_data_car_layout.jpg)\n\n图 50-5\n\n下一步是在卡片布局的视图中显示一些图像和不同的文本。这既可以是布局编辑器提供的模板样本数据形式，也可以是专门为此项目添加的自定义样本数据形式。将\
  \ `card_layout.xml` 文件加载到布局编辑器，选择 `ImageView` 并按照本章早些时候概述的设计属性面板。从 `srcCompat` 菜单中选择内置的背景/风景图集，如图\
  \ 50-6 所示：\n\n![](img/as_3.6_recyclerview_sample_data_background.jpg)\n\n图 50-6\n\
  \n接下来，右键点击 `item_title` `TextView`，选择 `Set Sample Data` 菜单选项，并在属性面板中选择 `cities`\
  \ 文本。对 `item_detail` 视图重复此步骤，这次选择 `full_names` 选项，如图 50-7 所示：\n\n![](img/as_3.6_recyclerview_sample_data_full_names.jpg)\n\
  \n图 50-7\n\n在 Design 模式下打开 `content_main.xml` 文件，注意 `RecyclerView` 现在使用了内置图像和样本数据：\n\
  \n![](img/as_3.6_recyclerview_sample_data_cities.jpg)\n\n图 50-8\n\n## 50.2 使用自定义样本数据\n\
  \n本章的最后一步是在布局编辑器中使用自定义样本数据。这需要创建样本数据目录并添加文本文件。在项目工具窗口中，右键点击 `app` 项并选择 `New -> Sample\
  \ Data Directory` 选项，此时项目窗口会出现一个名为 `sampledata` 的新目录。如果新文件夹可见，请将工具窗口从 `Android`\
  \ 切换到 `Project` 模式，并在 `CardDemo -> app -> build` 下找到文件夹，如图 50-9 所示：\n\n![](img/as_4.1_sample_data_project_list.jpg)\n\
  \n图 50-9\n\n再次右键点击 `sampledata` 目录，创建一个名为 `images` 的子目录，并按照之前的步骤将 Android 图像复制粘贴到新文件夹中。再次显示\
  \ `ImageView` 的属性面板，这次点击 `Browse` 链接并在资源对话框中选择新添加的 图像（如果文件夹未出现，请尝试重建项目）：\n\n![](img/as_4.1_sample_data_pick_drawing.jpg)\n\
  \n图 50-10\n\n再次右键点击 `sampledata` 目录，选择 `New File` 选项，将其命名为 `chapters` 并输入以下内容：\n\
  \nChapter One\n\nChapter Two\n\nChapter Three\n\nChapter Four\n\nChapter Five\n\n\
  Chapter Six\n\nChapter Seven\n\nChapter Eight\n\n接下来，创建一个名为 `items` 的第二个文本文件，内容如下：\n\
  \nItem one details\n\nItem two details\n\nItem three details\n\nItem four details\n\
  \nItem five details\n\nItem six details\n\nItem seven details\n\nItem eight details\n\
  \n创建样本数据文本文件后，只需在 `card_layout.xml` 文件的视图元素中按如下方式引用它们即可：\n\n```xml\n<TextView\n\
  \    android:layout_width=\"wrap_content\"\n    android:layout_height=\"wrap_content\"\
  \ />\n```\n\n\n\n\n```xml\nandroid:id=\"@+id/item_title\"\n    android:layout_toEndOf=\"\
  @+id/item_image\"\n    android:layout_toRightOf=\"@+id/item_image\"\n    android:layout_alignParentTop=\"\
  true\"\n    android:textSize=\"30sp\"\n    tools:text=\"@sample/chapters\" />\n\n\
  <TextView\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:id=\"@+id/item_detail\"\n    android:layout_toEndOf=\"\
  @+id/item_image\"\n    android:layout_toRightOf=\"@+id/item_image\"\n    android:layout_below=\"\
  @+id/item_title\"\n    tools:text=\"@sample/items\" />\n```\n\n回到 `content_main.xml`\
  \ 文件中的布局设计，现在自定义示例数据和图像现在应该显示在 `RecyclerView` 列表中：\n\n![](img/as_3.6_sample_data_running.jpg)\n\
  \n图 50-11\n\n除了使用两个独立的文本文件并对图片集的引用，另一种选项是在 JSON 文件中声明示例数据。例如：\n\n```json\n{\n  \"\
  mydata\": [\n    {\n      \"chapter\" : \"Chapter One\",\n      \"details\": \"\
  Item one details\",\n      \"image\": \"@sample/images\"\n    },\n    {\n      \"\
  chapter\" : \"Chapter Two\",\n      \"details\": \"Item two details\",\n      \"\
  image\": \"@sample/images\"\n    }\n  \n]\n}\n```\n\n假设上述内容包含在名为 `chapterdata.json`\
  \ 的文件中，则示例数据在视图 XML 元素中的引用如下：\n\n```xml\n<ImageView\n    tools:src=\"@sample/chapterdata.json/mydata/image\"\
  \ />\n\n<TextView\n    tools:text=\"@sample/chapterdata.json/mydata/chapter\" />\n\
  \n<TextView\n    tools:text=\"@sample/chapterdata.json/mydata/details\" />\n```\n\
  \n## 50.3 总结\n\n本章演示了如何在布局编辑器中使用示例数据，以提供更真实的界面，展示用户界面在运行时外观。本教程涵盖的步骤包括使用预存的示例数据模板以及集成自定义示例数据。\n\
  \n## 51. 使用 AppBar 和折叠工具栏布局\n\n在本章中，我们将探索如何自定义 Activity 布局中的应用 bar，并使其对屏幕上其他视图中发生的滚动事件做出响应。通过使用\
  \ `CoordinatorLayout` 配合 `AppBarLayout` 和 `CollapsingToolbarLayout` 容器，可以配置应用 bar\
  \ 显示图像并使其在视图中淡入淡出。例如，列表的向上滚动动作可以配置为使 app bar 从视图中退回，并在执行向下滚动动作时重新出现。\n\n本章将从组成 app\
  \ bar 的元素概述开始，然后各种 app bar 配置的示例。\n\n## 51.1 AppBar 的结构\n\nApp bar 是应用程序运行时出现在显示器顶部的区域，可以配置为包含各种不同的项目，包括状态栏、工具栏（toolbar）、标签栏（tab\
  \ bar）和灵活空间区域。例如，图 51-1 显示了一个包含状态栏、工具栏和标签栏的 app bar：\n\n![](img/Image24271.jpg)\n\
  \n图 51-1\n\n灵活空间区域可以用空白背景颜色填充，或者如图 51-2 所示，显示在 `ImageView` 对象上的图像：\n\n![](img/Image24361.jpg)\n\
  \n图 51-2\n\n正如本章其余部分将演示的那样，如果 Activity 用户界面布局的主内容区域包含滚动内容，则当屏幕内容滚动时，app bar 的元素可以配置为展开和收缩。\n\
  \n## 51.2 示例项目\n\n为了本示例，将对在前一章题为 Android RecyclerView 和 CardView 教程 创建的 `CardDemo`\
  \ 项目进行更改。首先启动 Android Studio 并加载此项目。\n\n项目加载后，运行应用并注意当向上滚动列表时，工具栏保持可见的，如图 51-3 所示：\n\
  \n![](img/Image24431.jpg)\n\n图 51-3\n\n第一步是进行一些配置更改，使工具栏在向上滚动过程中收缩，并在向下滚动时展开。\n\n\
  ## 51.3 协调 RecyclerView 和工具栏\n\n将 `activity_main.xml` 文件加载到布局编辑器工具中，切换到 Code 模式并查看\
  \ XML 布局设计，其层级结构如图 51-4](#AppBar.xhtml__idTextAnchor1024) 中的图所示：\n\n![](img/as3.0_appbar_coordinatorlayout_tree.jpg)\n\
  \n图 51-4\n\n层级结构的顶层是 `CoordinatorLayout`，正如名称所示，它协调其包含的各种子视图元素之间的交互。例如在使用悬浮操作按钮和\
  \ Snackbar 中所示，`CoordinatorLayout` 会自动向上滑动悬浮操作按钮以适应 `Snackbar` 的出现。\n\n`CoordinatorLayout`\
  \ 同样可以用于根据某些视图的滚动动作使 app bar 元素滑入或滑出视图。图 51-4 所示的一个元素是 `ConstraintLayout`。为了实现这种行为，需要在发生滚动的元素和与之协调滚动的元素上都设置属性。\n\
  \n在滚动元素（此例中为 `RecyclerView`）上，必须将 `layout_behavior` 属性设置为 `appbar_scrolling_behavior`。在\
  \ `content_main.xml` 文件中，找到顶层 `ConstraintLayout` 元素并注意此属性已设置：\n\n```xml\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    app:layout_behavior=\"@string/appbar_scrolling_behavior\">\n```\n\n接下来，在布局编辑器中打开\
  \ `activity_main.xml` 文件，切换到 Code 模式并找到 `AppBarLayout` 元素。注意层级结构中的唯一子元素是 `Toolbar`。为了响应\
  \ `RecyclerView` 中发生的滚动事件，必须在该元素上设置 `app:layout_scrollFlags` 属性。赋值此属性的值取决于所需的交互性质，必须由以下一个或多个组成：\n\
  \n- `scroll`: 指要滚动出屏幕。如果不设置此项，在滚动事件期间视图将固定在屏幕顶部。\n- `enterAlways`: 与 `scroll` 选项配合使用时，向上滚动会导致视图退回。在此模式下的任何向下滚动动作都会导致视图重新出现。\n\
  - `enterAlwaysCollapsed`: 设置在视图上，在向下滚动达到列表限制之前，该视图不会从折叠状态展开。如果设置了 `minHeight` 属性，视图在初始滚动期间会显示，但直到达到最小高度。它将保持该高度，直到到达列表顶部才会完全展开。注意此选项仅在同时与\
  \ `enterAlways` 和 `scroll` 选项配合使用时有效。\n- `exitUntilCollapsed`: 设置后，视图在向上滚动期间会收缩，直到达到\
  \ `minHeight` 阈值，此时在滚动方向改变之前将保持该高度。\n\n例如：\n\n```xml\napp:layout_scrollFlags=\"\
  scroll|enterAlways|enterAlwaysCollapsed\"\nandroid:minHeight=\"20dp\"\n```\n\n\n\
  \n\n\n在本例中，`scroll` 和 `enterAlways` 选项将对 `Toolbar` 进行如下设置：\n\n```xml\n<androidx.appcompat.widget.Toolbar\n\
  \    android:id=\"@+id/toolbar\"\n    android:layout_width=\"match_parent\"\n  \
  \  android:layout_height=\"?attr/actionBarSize\"\n    android:background=\"?attr/colorPrimary\"\
  \n    app:popupTheme=\"@style/Theme.CardDemo.PopupOverlay\"\n    app:layout_scrollFlags=\"\
  scroll|enterAlways\" />\n```\n\n设置好相应的属性后，再次运行应用，并在 `RecyclerView` 列表中向上滚动的动作。这将导致工具栏折叠并移出视图（图\
  \ 51-5）。向下滚动动作将使工具栏重新出现。\n\n![](img/Image24591.jpg)\n\n图 51-5\n\n## 51.4 引入折叠工具栏布局\n\
  \n`CollapsingToolbarLayout` 容器通过提供更多的选项和控制层级，增强了标准工具栏，使其能够响应协调滚动动作对应用栏及其子视图进行折叠。`CollapsingToolbarLayout`\
  \ 类旨在作为 `AppBarLayout` 的子项添加，并提供此类功能，例如随着工具栏的折叠和展开自动调整工具栏标题的字体大小。`parallax` 模式允许应用栏中的指定内容在折叠时淡消失，而\
  \ `pin` 模式则允许应用栏的元素在收缩期间保持在固定位置。\n\n还可以使用 `scrim` 选项来指定工具栏在折叠序列期间过渡的颜色。\n\n为了查看这些功能的实际效果，将修改\
  \ `activity_main.xml` 文件中包含的应用栏，使其使用 `CollapsingToolbarLayout` 类，并添加一个 `ImageView`\
  \ 以更好地演示 `parallax`（视差）模式的效果。使用 `CollapsingToolbarLayout` 的新视图层级如图 51-6 中的图所示：\n\
  \n![](img/as3.0_appbar_collapsing_tree.jpg)\n\n图 51-6\n\n在 Code 模式下将 `activity_main.xml`\
  \ 文件加载到布局编辑器工具中，并修改布局使其内容如下：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<androidx.coordinatorlayout.widget.CoordinatorLayout\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\"\n    android:layout_width=\"match_parent\"\n\
  \    android:layout_height=\"match_parent\"\n    tools:context=\".MainActivity\"\
  >\n    <com.google.android.material.appbar.AppBarLayout\n        android:layout_width=\"\
  match_parent\"\n        android:layout_height=\"wrap_content\"\n        android:theme=\"\
  @style/Theme.CardDemo.AppBarOverlay\">\n        <com.google.android.material.appbar.CollapsingToolbarLayout\n\
  \            android:id=\"@+id/collapsing_toolbar\"\n            android:layout_width=\"\
  match_parent\"\n            android:layout_height=\"match_parent\"\n           \
  \ app:layout_scrollFlags=\"scroll|enterAlways\"\n            android:fitsSystemWindows=\"\
  true\"\n            app:contentScrim=\"?attr/colorPrimary\"\n            app:expandedTitleMarginStart=\"\
  48dp\"\n            app:expandedTitleMarginEnd=\"64dp\">\n            <ImageView\n\
  \                android:id=\"@+id/backdrop\"\n                android:layout_width=\"\
  match_parent\"\n                android:layout_height=\"200dp\"\n              \
  \  android:scaleType=\"centerCrop\"\n                android:fitsSystemWindows=\"\
  true\"\n                app:layout_collapseMode=\"parallax\"\n                android:src=\"\
  @drawable/appbar_image\" />\n            <androidx.appcompat.widget.Toolbar\n  \
  \              android:id=\"@+id/toolbar\"\n                android:layout_width=\"\
  match_parent\"\n                android:layout_height=\"?attr/actionBarSize\"\n\
  \                android:background=\"?attr/colorPrimary\"\n                app:popupTheme=\"\
  @style/Theme.PopupOverlay\"\n                app:layout_scrollFlags=\"scroll|enterAlways\"\
  \n                app:layout_collapseMode=\"pin\" />\n        </com.google.android.material.appbar.CollapsingToolbarLayout>\n\
  \    </com.google.android.material.appbar.AppBarLayout>\n    <include layout=\"\
  @layout/content_main\" />\n</androidx.coordinatorlayout.widget.CoordinatorLayout>\n\
  ```\n\n除了向布局中添加新元素外，还移除了背景颜色设置。此更改的优点是提供了一个透明的工具栏，允许应用栏中显示更多的图像。\n\n使用操作系统的文件导航器，在代码示例的\
  \ `project_icons` 文件夹中找到 `appbar_image.jpg` 并复制它。在 Project 窗口中右键点击 `app` -> `res`\
  \ -> `drawable` 项，并在弹出的菜单中选择“粘贴”。\n\n运行时，应用栏应如图 51-7 所示：\n\n![](img/Image2474.jpg)\n\
  \n图 51-7\n\n向上滚动列表将导致应用栏逐渐折叠。在收缩期间，图像将淡出为 `scrim` 属性定义的颜色，同时标题文本的字体大小将以相应的速率减小，直到只看到工具栏：\n\
  \n![](img/Image2482.jpg)\n\n图 51-8\n\n由于 `activity_main.xml` 文件中的工具栏配置为 `pin` 模式，因此在折叠初始阶段工具栏仍然保持可见（如果继续向上滚动，工具栏将折叠）：\n\
  \n`app:layout_collapseMode=\"pin\"`\n\n如果将折叠模式设置为 `parallax`，工具栏将与图像一起收回。\n\n![](img/Image2491.jpg)\n\
  \n图 51-9\n\n由于 `CollapsingToolbarLayout` 元素的滚动标志包含 `enterAlways` 选项，向下滚动动作将导致应用栏再次展开。\n\
  \n要固定工具栏使其在向上滚动期间不再移出视图，请将 `activity_main.xml` 文件中 `CollapsingToolbarLayout` 元素的\
  \ `layout_scrollFlags` 属性中的 `enterAlways` 替换为 `exitCollapsed`：\n\n```xml\n<com.google.android.material.appbar.CollapsingToolbarLayout\n\
  \    android:id=\"@+id/collapsing_toolbar\"\n    android:layout_width=\"match_parent\"\
  \n    android:layout_height=\"match_parent\"\n    app:layout_scrollFlags=\"scroll|exitCollapsed\"\
  \n    android:fitsSystemWindows=\"true\"\n    app:contentScrim=\"?attr/colorPrimary\"\
  \n    app:expandedTitleMarginStart=\"48dp\"\n    app:expandedTitleMarginEnd=\"64dp\"\
  >\n```\n\n## 51.5 修改标题和遮罩颜色\n\n作为最后一个任务，编辑 `MainActivity.java` 文件并在 `onCreate()`\
  \ 方法中添加一些代码，以更改折叠布局实例上的标题文本并设置不同的 `scrim` 颜色（注意 `scrim` 颜色也可以在布局文件中设置）：\n\n```java\n\
  package com.ebookfrenzy.carddemo;\n\nimport com.google.android.material.appbar.CollapsingToolbarLayout;\n\
  import android.graphics.Color;\n\n@Override\nprotected void onCreate(Bundle savedInstanceState)\
  \ {\n    super.onCreate(savedInstanceState);\n    setContentView(R.layout.activity_card_demo);\n\
  \    Toolbar toolbar = findViewById(R.id.toolbar);\n    setSupportActionBar(toolbar);\n\
  \    CollapsingToolbarLayout collapsingToolbarLayout =\n        findViewById(R.id.collapsing_toolbar);\n\
  \    collapsingToolbarLayout.setTitle(\"My Toolbar Title\");\n    collapsingToolbarLayout.setContentScrimColor(Color.GREEN);\n\
  \    recyclerView = findViewById(R.id.recycler_view);\n    layoutManager = new LinearLayoutManager(this);\n\
  \    recyclerView.setLayoutManager(layoutManager);\n    adapter = new RecyclerAdapter();\n\
  \    recyclerView.setAdapter(adapter);\n}\n```\n\n\n\n\n\n## 51.6 总结\n\n出现在大多数 Android\
  \ 应用顶部的应用栏（app bar）可以由多个不同的元素组成，包括工具栏（toolbar）、标签布局（tab layout）甚至图像视图（image view）。当嵌入\
  \ `CoordinatorLayout` 父布局时，可以使用许多不同的选项来控制应用栏响应 Activity 主内容滚动事件的行为。为了对这种行为进行更强大的控制，`CollapsingToolbarLayout`\
  \ 管理器提供了系列额外的控制级别，用于控制应用栏内容相对于滚动活动的展开和收缩方式。\n\n## 52. Android Studio 主/详情流教程\n\n\
  本章将解释“主/详情”（Master/Detail）用户界面设计的概念，然后详细探索构成 Android Studio 自带的“主/详情流”模板的元素。将创建一个示例应用程序，演示修改模板以满足应用程序开发人员特定需求的各个步骤。\n\
  \n## 52.1 主/详情流\n\n主/详情流是一种界面设计概念，它向用户显示一个项目列表（称为主列表 master list）。当从列表中选择一个项目时，与该项目相关的额外将在详情窗格（detail\
  \ pane）中呈现给用户。例如，一个电子邮件应用程序可能包含一个接收消息的主列表，其中包含发送者地址和消息主题。从主列表中选择一条消息后，邮件的正文将出现在详情窗格中。\n\
  \n在横屏模式的平板尺寸 Android 设备屏幕上，主列表显示在屏幕左侧的窄垂直面板中。屏幕的其余部分用于详情窗格，这种布局被称为“双窗格模式”（two-pane\
  \ mode）。例如，图 52-1 显示了主/详情双窗格布局，其中列出了主项目，并将项目一的内容显示在详情窗格中：\n\n![](img/Image2428.jpg)\n\
  \n图 52-1\n\n在较小的手机尺寸 Android 设备上，主列表占据整个屏幕，而详情窗格则出现在另一个屏幕上，当从主列表中做出选择时它就会出现。在这种模式下，详情屏幕包含一个用于返回到主列表的操作栏条目（action\
  \ bar entry）。例如，图 52-2 展示了 4 英寸手机屏幕上同一项目列表的主屏幕和详情屏幕：\n\n![](img/Image24371.jpg)\n\
  \n图 52-2\n\n## 52.2 创建主/详情流 Activity\n\n在本章的下一节中，将详细介绍构成“主/详情流”模板的各种元素。实现此点的最佳方法是使用“主/详情流”模板创建一个项目，并在学习信息时使用它。该项目随后将作为章末教程的基础。\n\
  \n尽管项目创建向导包含了选择“主/详情流”模板的选项，但在项目创建后添加 Activity 可以在配置模板方面获得更大的灵活性。\n\n从欢迎界面选择 `Create\
  \ New Project`（新建项目）快速启动选项，在结果的新项目对话框中，点击 `Next` 按钮之前选择 `Add No Activity` 模板。\n\n\
  在 `Name` 字段中输入 `MasterDetailFlow` 并指定 `com.ebookfrenzy.masterdetailflow` 为包名。在点击\
  \ `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将 `Language`\
  \ 菜单设置为 `Java`。\n\n项目创建完成后，在 Project（项目）工具窗口中右键点击 `app` -> `java` -> `com.ebookfrenzy.masterdetailflow`\
  \ 项，并选择 `New` -> `Activity` -> `Master/Detail Flow` 菜单选项。\n\n新建 Android Activity\
  \ 屏幕（图 52-3\n\n图 52-3\n\n在点击 `Finish` 按钮之前，确保启用 `Launcher Activity` 选项并将 `Source\
  \ Language` 菜单设置为 `Java`。\n\n## 52.3 主/详情流模板的结构分析\n\n一旦使用“主/详情流”模板创建了新项目，将自动创建许多\
  \ Java 和 XML 布局资源文件。理解这些不同文件对于能够调整模板以特定特定至关重要。在 Android Studio 项目工具窗口中查看项目，将发现以下文件，其中\
  \ `<item>` 被替换为创建项目时指定的 `Object Kind` 名称（在 `MasterDetailFlow` 示例项目中显示为“Website”）：\n\
  \n- `activity_<item>_list.xml` – 主列表的顶层布局文件，该文件由 `<item>ListActivity` 类加载。此布局包含一个工具栏、一个悬操作按钮（floating\
  \ action button）并包含了 `<item>_list.xml` 文件。\n- `<item>ListActivity.java` – 负责显示和管理主列表（在\
  \ `activity_<item>_list.xml` 文件中声明）并负责显示和响应该列表内项目选择的 Activity 类。\n- `<item>_list.xml`\
  \ – 用于在单窗格模式下（主列表和详情窗格显示在不同屏幕上）显示项目列表的布局文件。该文件由一个配置为使用 `LinearLayoutManager` 的 `RecyclerView`\
  \ 对象组成。`RecyclerView` 元素声明主列表中的每个项目都使用 `item` 文件中的布局进行显示。\n- `<item>_list.xml (w900dp)`\
  \ – 用于横屏模式（主列表和详情窗格并排显示）平板电脑上的主列表布局文件。该文件包含一个水平 `LinearLayout` 父布局，其中包含一个用于显示主列表的\
  \ `RecyclerView` 和一个包含详情窗格内容的 `FrameLayout`。与此文件的单窗格变体一样，`RecyclerView` 元素声明列表中的每个项目都使用\
  \ `<item>_list_content.xml` 文件中的布局进行显示。\n- `<item>_list_content.xml` – 该文件包含用于主列表中每个项的布局。默认情况下，它由两个嵌入在水平\
  \ `LinearLayout` 中的 `TextView` 对象组成，但可以根据特定的应用程序需求进行进行更改。\n- `activity_<item>_detail.xml`\
  \ – 在单窗格模式运行时用于详情窗格的顶层布局文件。此布局包含一个应用栏、折叠工具栏（collapsing toolbar）、滚动视图（scrolling view）和一个悬操作按钮。运行时，此布局文件由\
  \ `<item>DetailActivity` 类加载并显示。\n- `<item>DetailActivity.java` – 该类显示 `activity_<item>_detail.xml`\
  \ 文件定义的布局。该类还初始化并显示由 `<item>_detail.xml` 和 `<item>DetailFragment.java` 文件定义的包含详情内容的片段。\n\
  - `<item>_detail.xml` – 随 `<item>DetailFragment` 类类的布局文件，包含详情窗格内容区域的布局。默认情况下，它包含单个\
  \ `TextView` 对象，但可以根据特定的应用程序需求更改。在单窗格模式下，此片段被加载到 `activity_<item>_detail.xml` 文件定义的布局中。在双窗格模式下，此布局被加载到\
  \ `<item>_list.xml (w900dp)` 文件的 `FrameLayout` 区域。\n\n\n\n\n\n- `DetailFragment.java`\
  \ – 片段类文件，负责显示 `_detail.xml` 布局并向其填充要在详情窗格中显示的内容。该片段在 `DetailActivity.java` 文件中初始化并显示，用于为单面板模式提供\
  \ `activity__detail.xml` 布局中的显示内容，并为双面板模式提供 `_list.xml` (w900dp) 布局的内容。\n- `DummyContent.java`\
  \ – 一个意图为模板提供示例数据的类文件。该类可以根据应用需求进行修改，也可以完全替换。默认情况下，此此类提供的内容仅由若干个字符串项组成。\n\n## 52.4\
  \ 修改主/详情流模板\n\n虽然主/详情流（Master/Detail Flow）模板的结构初看起来可能会令人困惑，但随着在本章后续对默认模板的修改，这些概念将变得清晰。显而易见，对于许多主类详情实现需求，模板提供的大部分功能可以保持不变。\n\
  \n在本章的剩余部分，将对 `MasterDetailFlow` 项目进行修改，使主列表显示网站名称列表，并将详情窗格更改为包含一个 `WebView` 对象而不是当前的\
  \ `TextView`。当用户选择某个网站时，相应的网页随后将在详情窗格中加载并显示。\n\n## 52.5 更改内容模型\n\n当前示例的内容由 `DummyContent`\
