  \n本书最初下载自 `sanet.st`。\n\n![sa_logo](img/sa_logo.jpg)\n\n# 2. 搭建 Android Studio 开发环境\n\
  \n在开始开发 Android 应用程序之前，第一步是配置计算机系统作为开发平台。这涉及多个步骤，包括安装 Android Studio 集成开发环境 (IDE)，它还包含了\
  \ Android 软件开发包 (SDK) 和 OpenJDK Java 开发环境。\n\n本章将介绍在 Windows、macOS 和 Linux 系统上安装\
  \ Android 应用开发所需组件的步骤。\n\n## 2.1 系统要求\n\nAndroid 应用程序开发可以在任何任何系统类型进行：\n\n• Windows\
  \ 7/8/10（32 位或 64 位，但 Android 模拟器仅能在 64 位系统上运行）\n• macOS 10.10 或更高版本（仅限 Intel 芯片系统）\n\
  • 配置 Intel i5 或更高处理器且至少 8GB RAM 的 ChromeOS 设备\n• 安装 2.19 或更高版本 GNU C 库 (`glibc`)\
  \ 的 Linux 系统\n• 至少 4GB RAM（建议 8GB）\n• 约 4GB 可用磁盘空间\n• 最低屏幕分辨率 1280 x 800\n\n## 2.2\
  \ 下载 Android Studio 包\n\n开发 Android 应用的大部分工作将使用 Android Studio 环境完成。书中的内容和示例是基于\
  \ Android Studio 4.1 版本并使用 Android 11.0 (Q) API 30 SDK 创建的，这些版本在编写时是最新版本。\n\n Android\
  \ Studio 频繁更新，因此自本书出版以来可能已经发布了更新版本。\n\n可以从以下 URL 的主下载页面下载最新的 Android Studio：\n\n\
  `https://developer.android.com/studio/index.html`\n\n如果该页面提供了下载新版本 Android Studio\
  \ 的说明，请注意本书与软件之间可能存在某些细微差异。如果这些差异导致问题，通过网页搜索“Android Studio 4.1”应该可以找到下载旧版本的选项。或者，访问以下网页在归档中找到\
  \ Android Studio 4.1：\n\n`https://developer.android.com/studio/archive/ \n\n## 2.3\
  \ 安装 Android Studio\n\n下载完成后，安装 Android Studio 的具体步骤取决于执行安装的操作系统。\n\n### 2.3.1 在\
  \ Windows 上安装\n\n在 Windows 资源管理器窗口中找到下载的 Android Studio 安装可执行文件（名为 `android-studio-ide-<version>-windows.exe`），并双击它开始安装过程。如果弹出用户账户控制对话框，点击“是”。\n\
  \n当 Android Studio 安装向导出现后，按照各个屏幕进行配置，以满足您的需求，包括 Android Studio 的安装文件系统位置，以及是否供系统其他用户使用。在提示选择要安装的组件时，确保勾选了\
  \ Android Studio 和 Android Virtual Device（Android 虚拟机）。\n\n虽然对 Android Studio 的安装位置没有严格规定，但本书的其余部分将假设安装在\
  \ `C:\\Program Files\\Android\\Android Studio`，并且 Android SDK 包已安装在用户的 `AppData\\\
  Local\\Android\\sdk` 子文件夹中。配置好选项后，点击“安装”按钮开始安装。\n\n在带有开始菜单的 Windows 版本上，可以从安装期间添加到该菜单的条目启动新安装的\
  \ Android Studio。可以通过导航到 `Android Studio\\bin` 目录，右键点击可执行文件并选择“固定到任务栏”菜单选项，将其固定以便方便访问。注意可执行文件提供了\
  \ 32 位 (`studio`) 和 64 位 (`studio64`) 的可执行版本。如果您运行的是 32 位系统，请务必使用 `studio` 可执行文件。\n\
  \n### 2.3.2 在 macOS 上安装\n\nmacOS 版 Android Studio 以磁盘镜像 (`.dmg`) 文件的形式下载。下载 `android-studio-ide-<version>-mac.dmg`\
  \ 文件后，在 Finder 窗口中找到它并双击打开它，如图 2-1 所示：\n\n![](img/as_3.5_install.jpg)\n\n图 2-1\n\
  \n要安装此包，只需将 Android Studio 图标拖到“应用程序”文件夹中。Android Studio 包将安装到应用程序文件夹中，此过程通常需要几分钟完成。\n\
  \n要启动 Android Studio，在 Finder 窗口的应用程序文件夹中找到可执行文件并双击它。\n\n为了以后方便访问，从 Finder 窗口将 Android\
  \ Studio 图标拖到 Dock 栏。\n\n### 2.3.3 在 Linux 上安装\n\n下载 Linux Android Studio 包后，打开终端，切换到要安装\
  \ Android Studio 的位置并执行以下命令：\n\n```bash\nunzip /path>/android-studio-ide-<version>.zip\n\
  ```\n\n注意 Android Studio 包将安装到名为 `android-studio` 的子目录。假设上述命令在 `/home/demo` 执行，则软件包将解压到\
  \ `/home/demo/android-studio`。\n\n要启动 Android Studio，打开终端，切换到 `android-studio/bin`\
  \ 子目录并执行以下命令：\n\n```bash\n./studio.sh\n```\n\n在 64 位 Linux 系统上运行时，在 Android Studio\
  \ 运行之前需要安装一些 32 位支持库。在 Ubuntu 上可以使用以下命令安装这些库：\n\n```bash\nsudo apt-get install libc6:i386\
  \ ncurses5:i386 libstdc++6:i386 lib32z1 libbz2-1.0:i386\n```\n\n在 Red Hat 和 Fedora\
  \ 的 64 位系统上，使用以下命令：\n\n```bash\nsudo yum install zlib.i686 ncurses-libs.i686 bzip2-libs.i686\n\
  ```\n\n## 2.4 Android Studio 设置向导\n\n安装后首次启动 Android Studio 时，会出现一个导入设置的对话框。如果您有之前的设置并希望将其导入最新安装中，请选择相应的选项和位置。或者，指示不需要导入任何之前的设置并点击“确定”继续。\n\
  \n接下来，可能会如图 2-2 所示出现向导，尽管该对话框并非在所有平台上都会出现：\n\n![](img/Image2448.jpg)\n\n图 2-2\n\n\
  如果出现了向导，点击“下一步”，选择“标准”安装选项并再次点击“下一步”。\n\n\n\n\nAndroid Studio 将继续下载并配置最新的 Android\
  \ SDK 以及一些额外的组件和包。一旦此过程完成，点击下载组件（Downloading Components）对话框中的 `Finish` 按钮，随后将出现\
  \ Welcome to Android Studio 界面：\n\n![](img/as_4.1_welcome.jpg)\n图 2-3\n\n## 2.5\
  \ 安装额外的 Android SDK 软件包\n\n到目前为止的操作已经安装了 Java、Android Studio IDE 以及当前默认的 Android\
  \ SDK 包包。在继续之前，值得花一些时间验证安装了哪些包，并安装任何缺失或更新的包。\n\n此任务可以使用 Android SDK 设置界面完成，可以通过在\
  \ Android Studio 欢迎对话框中选择 `Configure -> SDK Manager` 选项从 Android Studio 工具内部启动它。一旦调用，将显示默认设置对话框中的\
  \ Android SDK 界面，如下所示：\n\n![](img/as_4.1_sdk_manager.jpg)\n图 2-4\n\n在首次安装 Android\
  \ Studio 后，可能只安装了最新发布的 Android SDK 版本。要安装旧版本的 Android SDK，只需选择对应版本的复选框并点击 `Apply`\
  \ 按钮。\n\n可能还会列出最新 SDK 有可用更新。要访问有关可用更新包的详细信息，请启用屏幕右下角的 `Show Package Details` 。这将显示与图中所示的信息：\n\
  \n![](img/Image2471.jpg)\n图 2-5\n\n上图强调了更新可用可用。要安装更新，启用项目名称左侧的复选框并点击 `Apply` 按钮。\n\
  \n除了 Android SDK 包外，还安装了许多用于构建 Android 程序的工具。要查看当前安装的包并检查更新，请留在 SDK 设置界面并选择 `SDK\
  \ Tools` 选项卡，如下：\n\n![](img/as_4.0_sdk_tools.jpg)\n图 2-6\n\n在 Android SDK Tools\
  \ 界面中，请确保以下包在 Status（状态）列中被列为 Installed（已安装）：\n\n- Android SDK Build-tools\n- Android\
  \ Emulator\n- Android SDK Platform-tools\n- Android SDK Tools\n- Google Play Services\n\
  - Intel x86 Emulator Accelerator (HAXM installer)\n- Google USB Driver (仅限 Windows)\n\
  - Layout Inspector image server\n\n如果上述任何包被列为 Not Installed（未安装）或需要更新，只需选择这些包旁边的复选框并点击\
  \ `Apply` 按钮以启动安装过程。\n\n安装完成后，请检查包列表并确保所选包现在在 Status 列中被列为 Installed。如果有任何包列为 Not\
  \ installed，请确保它们已被选中并再次点击 `Apply` 按钮。\n\n## 2.6 使 Android SDK 工具可在命令行中访问\n\n在大多数情况下，Android\
  \ SDK 的底层工具将在 Android Studio 环境内部进行访问。尽管如此，在某些情况下，从命令提示符或终端窗口调用这些工具将是很有用的。为了让你开发运行的操作系统能够找到这些工具，有必要将它们添加到系统的\
  \ `PATH` 环境变量中。\n\n无论哪种操作系统，都需要配置 `PATH` 变量以包含以下路径（其中`<path_to_android_sdk_installation>`\
  \ 代表安装 Android SDK 的文件系统位置）：\n\n- `<path_to_android_sdk_installation>/sdk/tools`\n\
  - `<path_to_android_sdk_installation>/sdk/tools/bin`\n- `<path_to_android_sdk_installation>/sdk/platform-tools`\n\
  \n可以通过启动 `SDK Manager` 并参考设置面板顶部的 `Android SDK Location:` 字段来识别 SDK 在你系统上的位置，如下：\n\
  \n![](img/as_4.0_sdk_location.jpg)\n图 2-7\n\n一旦确定了 SDK 的位置，将其添加到 `PATH` 变量的步骤取决于操作系统：\n\
  \n### 2.6.1 Windows 7\n\n1. 右键点击桌面开始菜单中的 `Computer`，并从生成的菜单中选择 `Properties`。\n2.\
  \ 在属性面板中，选择 `Advanced System Settings` 链接，并在生成的对话框中点击 `Environment Variables…` 按钮。\n\
  3. 在 `Environment Variables` 对话框中，在系统变量列表中找到 `Path` 变量，选中它并点击 `Edit…` 。使用编辑对话框中的\
  \ `New` 按钮向路径添加三个新条目。例如，假设 Android SDK 安装在 `C:\\Users\\demo\\AppData\\Local\\Android\\\
  Sdk`，则需要添加以下条目：\n   - `C:\\Users\\demo\\AppData\\Local\\Android\\Sdk\\platform-tools`\n\
  \   - `C:\\Users\\demo\\AppData\\Local\\Android\\Sdk\\tools`\n   - `C:\\Users\\\
  demo\\AppData\\Local\\Android\\Sdk\\tools\\bin`\n4. 点击每个对话框中的 `OK` 并关闭系统属性控制面板。\n\
  \n完成上述步骤后，通过打开命令提示符窗口（开始 -> 所有程序 -> 附件 -> 命令提示符）并在提示符处输入以下内容来验证路径设置正确：\n\n```\n\
  echo %Path%\n```\n\n返回的路径变量值应包含 Android SDK 平台工具文件夹的路径。通过尝试如下运行 `adb` 工具来验证 `platform-tools`\
  \ 值是否正确：\n\n```\nadb\n```\n\n该工具执行时应输出命令行选项列表。\n\n同样，通过尝试运行 `avdmanager` 工具来检查工具路径设置（如果\
  \ `avdmanager` 工具报告 Java 问题，请忽略，稍后会处理）：\n\n```\navdmanager\n```\n\n如果这两个命令中的任何一个出现类似的消息，很可能是\
  \ `PATH` 附加了错误的路径：\n\n`'adb' 不是内部或外部命令、程序或批文件。`\n\n### 2.6.2 Windows 8.1\n\n1. 在启动屏幕，将鼠标移动到屏幕右下角，从生成的菜单中选择\
  \ `Search`。在搜索框中输入 `Control Panel`。当 `Control Panel` 图标出现在结果区域时，点击它启动工具。\n2. 在 `Control\
  \ Panel` 中，使用 `Category` 菜单将显示方式更改为 `Large Icons`。从列表中选择 `System`。\n3. 按照 Windows\
  \ 7 的说明，从第 2 步开始操作。\n\n打开命令提示符窗口（将鼠标移动到屏幕右下角，选择 `Search` 选项并在搜索框中输入 `cmd`）。从搜索结果中选择\
  \ `Command Prompt`。\n\n在命令提示符窗口中输入：\n\n```\necho %Path%\n```\n\n返回的路径变量值应包含 Android\
  \ SDK 平台工具文件夹的路径。通过尝试如下运行 `adb` 工具来验证 `platform-tools` 值是否正确：\n\n```\nadb\n```\n\
  \n该工具执行时应输出命令行选项列表。\n\n同样，通过尝试运行 `avdmanager` 工具来检查工具路径设置（如果 `avdmanager` 工具报告 Java\
  \ 问题，请忽略，稍后会处理）：\n\n```\navdmanager\n```\n\n如果这两个命令中的任何一个出现类似的消息的消息，很可能是 `PATH`\
  \ 附加了错误的路径：\n\n`'adb' 不是内部或外部命令、程序或批文件。`\n\n### 2.6.3 Windows 10\n\n\n\n\n右键点击开始菜单，从弹出的菜单中选择`设置`，并在“查找设置”文本框中输入“编辑系统环境变量”。在系统属性对话框中，点击`环境变量...`\
  \ 按钮。按照 Windows 7 的步骤说明从第 3 步开始后续操作。\n\n### 2.6.4 Linux\n\n在 Linux 上，此配置通常可以通过向家目录下的\
  \ `.bashrc` 文件中添加命令来实现（具体细节取决于所使用的特定 Linux 发行版）。假设 Android SDK 捆绑包安装在 `/home/demo/Android/sdk`，则\
  \ `.bashrc` 文件中的 `export` 行内容如下：\n\n```\nexport PATH=/home/demo/Android/sdk/platform-tools:/home/demo/Android/sdk/tools:/home/demo/Android/sdk/tools/bin:/home/demo/android-studio/bin:$PATH\n\
  ```\n\n请注意，上述命令将 `android-studio/bin` 目录添加到 `PATH` 变量中。这将使得无论在终端窗口的哪个目录下，都可以执行 `studio.sh`\
  \ 脚本。\n\n### 2.6.5 macOS\n\n在 macOS 上，可以使用多种技术来修改 `$PATH` 环境变量。认为最干净的方法是在 `/etc/paths.d`\
  \ 目录中创建一个新文件，其中包含要添加到 `$PATH` 的路径。假设 Android SDK 安装位置为 `/Users/demo/Library/Android/sdk`，可以通过在\
  \ `/etc/paths.d` 目录中创建一个名为 `android-sdk` 的新文件并包含以下行来配置路径：\n\n```\n/Users/demo/Library/Android/sdk/tools\n\
  /Users/demo/Library/Android/sdk/tools/bin\n/Users/demo/Library/Android/sdk/platform-tools\n\
  ```\n\n注意，由于这是一个系统目录，在创建文件时需要使用 `sudo` 命令。例如：\n\n```\nsudo vi /etc/paths.d/android-sdk\n\
  ```\n\n### 2.7 Android Studio 内存管理\n\nAndroid Studio 是一个大型且复杂的软件应用程序，由许多后台进程组成。尽管\
  \ Android Studio 过去因性能不佳而受到批评，但 Google 在最近的发布中进行了显著的性能改进，并在每个新版本中持续改进。这些改进的一部分包括允许用户配置\
  \ Android Studio IDE 以及用于构建和运行应用程序的后台进程所使用的内存。这允许软件充分利用具有较大 `RAM` 的系统。\n\n如果你运行\
  \ Android Studio 的系统具有足够的空闲 `RAM` 来增加这些值（此功能仅适用于具有 5GB 或更多 RAM 的 64 位系统），并且发现 Android\
  \ Studio 的性能似乎有所下降，那么尝试这些内存设置可能是值得的。Android Studio 还可能通过类似于下面所示的对话框通知你可以提高性能：\n\n\
  ![](img/as_3.5_increase_memory_notification.jpg)\n\n图 2-8\n\n要查看并修改当前的内存配置，请选择`File\
  \ -> Settings...`（macOS 上为 `Android Studio -> Preferences...`）菜单选项，并在弹出的对话框中，选择左侧导航面板中\
  \ `System Settings` 下的 `Memory Settings` 选项，如下方的图 2-9 所示。\n\n在更改内存分配时，请确保不要分配超过必要的内存，也不要在不减慢其他进程的情况下分配超过系统能承受的内存。\n\
  \n![](img/as_4.1_memory_settings.jpg)\n\n图 2-9\n\n### 2.8 更新 Android Studio 和 SDK\n\
  \nAndroid Studio 和 Android SDK 会不定期发布新版本。新版本的 SDK 使用 `Android SDK Manager` 安装。当有更新可供安装时，Android\
  \ Studio 通常会通知你。\n\n要手动检查 Android Studio 更新，请在 Android Studio 欢迎界面内点击`Configure\
  \ -> Check for Updates` 菜单选项，或从 Android Studio 主窗口内访问`Help -> Check for Updates...`（macOS\
  \ 上为 `Android Studio -> Check for Updates...`）菜单选项。\n\n## 2.9 总结\n\n在开始开发 Android\
  \ 应用程序之前，第一步是搭建合适的开发环境。这包括 Android SDKs 和 Android Studio IDE（它还包括 OpenJDK 开发环境）。在本章中，我们涵盖了在\
  \ Windows、macOS 和 Linux 上安装这些包的必要步骤。\n\n# 3. 在 Android Studio 中创建示例 Android 应用程序\n\
  \n本书前面的章节已经涵盖了使用 Android Studio IDE 配置适用于 Android 应用程序开发的环境的必要步骤。在进入稍高级的话题之前，现在是验证所有所需的开发包均已安装并正常运行的好时机。实现这一目标的最佳方法是创建一个\
  \ Android 应用程序并编译、运行它。本章将介绍如何使用 Android Studio 创建 Android 应用程序项目。项目创建完成后，随后的章节将探索如何使用\
  \ Android 模拟器环境对应用程序进行测试运行。\n\n## 3.1 关于项目\n\n在本章中创建的项目是一个原始的货币转换计算器（事实上，它非常简单，只进行从美元到欧元的转换，并使用估算的汇率进行转换）。该项目还将使用\
  \ Android Studio 项目模板的基础之一。这种简单性允许我们介绍 Android 应用开发的一些关键方面，而不会因一次性引入过多的概念（例如推荐的应用程序架构和\
  \ Android 架构组件）而让初学者无所措。在遵循本章的教程时，请放心，初始示例项目中使用的所有技术和代码将在后面的章节中进行更详细的介绍。\n\n## 3.2\
  \ 创建新 Android 项目\n\n应用程序开发过程的第一步是在 Android Studio 环境中创建一个新项目。因此，首先启动 Android Studio，出现如图\
  \ 3-1 所示的“Welcome to Android Studio”：\n\n![](img/as_4.1_welcome1.jpg)\n\n图 3-1\n\
  \n一旦出现此窗口，Android Studio 已准备好创建新项目。要创建新项目，只需点击`Create New Project` 选项即可显示项目向导的第一个屏幕。\n\
  \n## 3.3 创建 Activity\n\n第一步是定义为应用程序创建的初始 Activity 类型。提供了创建适用于手机和平板、Wear OS、电视、Android\
  \ Audio 或 Android Things 的项目。开发 Android 应用程序时有多种不同的 Activity 类型，其中许多将在后面的章节中详细介绍。然而，对于本示例而言，只需在手机和平板屏幕上选择创建\
  \ `Empty Activity`。`Empty Activity` 选项会创建一个由单个 `TextView` 对象的模板用户界面。\n\n![](img/as_4.0_activity_template.jpg)\n\
  \n图 3-2\n\n选择 `Empty Activity` 选项后，点击 Next 继续项目配置。\n\n### 3.4 定义项目和 SDK 设置\n\n\n\
  \n\n在项目配置窗口（图 3-3）中，将 `Name` 字段设置为 `AndroidSample`。应用程序名称是在 Android Studio 中引用和识别应用程序的名称，也是如果完成的应用程序要在\
  \ Google Play 商店发售时将使用的名称。\n\n`Package`（包名）用于在 Android 应用生态系统中唯一标识应用程序。虽然它可以设置为任何唯一标识您的应用的的字符串，但传统上，它是基于域名的反转\
  \ URL，后跟应用程序名称。例如，如果您的域名是 `www.mycompany.com`，且应用程序命名为 `AndroidSample`，那么包名可以指定如下：\n\
  \n```\ncom.mycompany.androidsample\n```\n\n如果您没有域名，可以在 `Company Domain`（公司域名）字段中输入任何其他字符串，或者为了测试目的可以使用\
  \ `example.com`，但在发布应用程序之前需要对其进行更改：\n\n```\ncom.example.androidsample\n```\n\n`Save\
  \ location`（保存位置）设置将默认位于您主目录下名为 `AndroidStudioProjects` 的文件夹中，可以通过点击包含当前路径设置的字段右侧的文件夹图标进行更改。\n\
  \n将 `minimum SDK` 设置为 `API 26`：Android 8.0 (Oreo)。除非某些功能仅在更高版本可用，否则本书创建的大多数项目将使用此\
  \ SDK。\n\n![](img/as_4.0_configure_project.jpg)\n\n图 3-3\n\n最后，将 `Language`（语言）菜单更改为\
  \ `Java` 并点击 `Finish`（完成）启动项目创建过程。\n\n## 3.5 修改示例应用程序\n\n此时，Android Studio 已经创建了一个最小的示例应用程序项目并打开了主窗口。\n\
  \n![](img/as_4.1_main_window.jpg)\n\n图 3-4\n\n新创建的项目和相关文件的引用列位于主项目窗口左侧的 `Project`（项目）工具窗口中。`Project`\
  \ 工具窗口有多种可以显示信息的模式。默认情况下，此面板应处于 `Android` 模式。此设置由面板顶部的菜单控制，如图 3-5 所示。如果面板当前未处于 `Android`\
  \ 模式，请使用菜单切换模式：\n\n![](img/as_4.0_project_tool_window_menu.jpg)\n\n图 3-5\n\n## 3.6\
  \ 修改用户界面\n\n我们的 Activity 用户界面设计存储在名为 `activity_main.xml` 的文件中，该文件位于项目文件层次结构中的 `app\
  \ -> res -> layout` 下。一旦在 `Project` 工具窗口中找到该文件，双击文件即可将其加载到用户界面 `Layout Editor`（布局编辑器）工具中，该工具将出现在\
  \ Android Studio 主窗口的中心面板中：\n\n![](img/as_4.1_layout_editor.jpg)\n\n图 3-6\n\n在 `Layout\
  \ Editor` 窗口顶部工具栏上有一个菜单（在上面的图中当前设置为 `Pixel`），它反映在 `Layout Editor` 面板中设备的视觉表示上。通过点击此菜单，可以选择广泛的其他设备选项。\n\
  \n若要在设备表示的横屏和竖屏之间切换方向，只需使用设备选择菜单立即左侧的下拉菜单即可，该菜单显示着 ![](img/as_4.1_orientation.jpg)\
  \ 图标。\n\n从设备屏幕可以看出，内容布局已经包含一个显示“Hello World!”消息的标签。面板左侧运行着调色板，其中包含用于构建用户界面的不同类别用户界面组件，例如按钮、标签和文本字段。然而，并不是所有用户界面组件对用户都是显而可见的。其中一类就是布局。Android\
  \ 支持多种布局，它们对屏幕上如何定位和管理视觉用户界面组件提供不同层级的控制。虽然从用户界面的视觉表示很难判断，但当前的设计是使用 `ConstraintLayout`（约束布局）创建的。这可以通过查看\
  \ `Component Tree`（组件树）面板中的信息来确认，该面板默认位于 `Layout Editor` 面板的左下角，如图 3-7 所示：\n\n![](img/as_4.1_component_tree.jpg)\n\
  \n图 3-7\n\n从组件树层次结构可以看出，用户界面布局由一个 `ConstraintLayout` 父对象和一个 `TextView` 子对象组成。\n\n\
  在继续之前，还要检查 `Layout Editor` 的 `Autoconnect`（自动连接）模式是否启用。这意味着当组件添加到布局中时，`Layout Editor`\
  \ 将自动添加约束，以确保组件在不同的屏幕尺寸和设备方向上正确定位（该主题将在后续章节中进行更详细的介绍）。`Autoconnect` 出现在 `Layout\
  \ Editor` 工具栏中，用磁铁图标表示。当禁用时，磁铁上会有一条斜线（图 3-8）。如有必要，通过点击此按钮重新启用 `Autoconnect` 模式。\n\
  \n![](img/as_4.0_layout_autoconnect_off.jpg)\n\n图 3-8\n\n修改应用程序的下一步是向布局中添加一些额外的组件，第一个将是\
  \ `Button`。\n\n`Palette`（调色板）面板由两列组成，左侧列包含视图类别列表，右侧列列出当前选择类别内的组件。在图 3-9 中，例如，选中了\
  \ `Buttons` 类别：\n\n![](img/as_4.1_palette.jpg)\n\n图 3-9\n\n从 `Buttons` 列表中拖动 `Button`\
  \ 对象并将其放置在用户界面设计的中心，使其位于现有的 `TextView` 小部件下方：\n\n![](img/as_4.1_androidsample.jpg)\n\
  \n图 3-10\n\n下一步是更改 `Button` 组件显示的文本。位于设计区域右侧的面板是 `Attributes`（属性）面板。此面板显示分配给当前组件的属性。在此面板中，找到\
  \ `Common Attributes`（常用属性）部分的 `text` 属性，并将值从“Button”更改为“Convert”，如图 3-11 所示：\n\n\
  ![](img/as_4.1_text_attribute.jpg)\n\n图 3-11\n\n带有扳手图标的第二个 `text` 属性允许设置仅在 `Layout\
  \ Editor` 中显示而在运行时显示的属性。这对于测试不同设置下视觉组件和布局的行为非常有用。\n\n万一 `Autoconnect` 系统未能设置所有布局连接，点击\
  \ `Infer constraints`按钮（图 3-12）为布局添加任何缺失的约束：\n\n![](img/as_4.1_infer_button.jpg)\n\
  \n图 3-12\n\n此时，重要的是说明位于 `Layout Editor` 工具右上角的警告按钮，如图 3-13 所示。显然，这表明布局存在潜在问题。要查看问题的详情，请点击该按钮：\n\
  \n![](img/as_3.6_layout_warnings.jpg)\n\n图 3-13\n\n点击后，将出现一个面板（图 3-14），描述问题的性质并提供一些可能的纠正措施：\n\
  \n![](img/as_3.6_hardcoded_text.jpg)\n\n图 3-14\n\n目前，列出的唯一警告内容如下：\n\n硬编码字符串 \"Convert\"\
  , 应使用 @string 资源\n\n\n\n\n\n此 I18N 消息是在告知我们项目未来的国际化方面存在一个潜在问题（“I18N”源于单词“internationalization”，该词以“I”开头，以“N”结尾，中间有\
  \ 18 个字母）。该警告提醒我们，在开发 Android 应用程序时，应尽可能将文本字符串等属性和值存储为资源的形式。这样做可以通修改资源文件来更改应用程序的外观，而无需更改应用程序的源代码。这在将用户界面翻译成不同的口语语言时尤为有价值。如果用户界面中的所有文本都包含在一个资源文件中，例如，可以将该文件交给翻译人员，由他们执行翻译工作并返回翻译后的文件以包含应用程序中。这使得在不需要修改任何源代码的情况下，就可以支持多种语言目标。在本例中，我们将创建一个名为\
  \ `convert_string` 的新资源，并为其分配字符串“Convert”。\n\n点击问题说明（Issue Explanation）面板中的 `Fix`\
  \ 按钮以显示“提取资源”（Extract Resource）面板（图 3-15）。在此面板中，将资源名称字段更改为 `convert_string`，并在点击\
  \ `OK` 按钮之前，将资源值设置为 `Convert`。\n\n![](img/as_4.1_extract_resource.jpg)\n图 3-15\n\
  \n下一个要添加的部件是一个 `EditText` 部件，用户将向其中输入要转换的美元金额。从部件调板中，选择 `Text` 类别，并点击拖动一个 `Number\
  \ (Decimal)` 组件到布局中，使其在水平方向上居中并位于现有 `TextView` 部件上方。选中部件后，使用 `Attributes`（属性）工具窗口将\
  \ `hint` 属性设置为“dollars”。点击警告图标并将字符串提取到名为 `dollars_hint` 的资源中。\n\n在本章稍后编写的代码将需要访问用户在\
  \ `EditText` 字段中输入的美元值值。它将通过引用分配给用户界面布局中部件的 `id`来实现。当在布局中选中部件时，可以在 `Attributes`\
  \ 工具窗口中查看并更改 Android Studio 为部件分配的默认 `id`，如图 3-16 所示：\n\n![](img/as_4.0_textview_id.jpg)\n\
  图 3-16\n\n将 `id` 更改为 `dollarText`，并在 `Rename`重命名）对话框中点击 `Refactor`重构）按钮。这将确保项目其他地方对旧\
  \ `id` 的任何引用自动更新为使用新 `id`：\n\n![](img/as_4.1_rename_dialog.jpg)\n图 3-17\n\n点击 `Infer\
  \ constraints（推断约束）按钮添加任何缺失的布局约束。此时，布局应该类似于图 3-18 所示：\n\n![](img/as_4.1_androidsample_ui.jpg)\n\
  图 3-18\n\n## 3.7 审查布局和资源文件\n\n在继续后续步骤之前，我们将查看用户界面设计和资源处理的一些内部方面。在上一节中，我们通过使用 `Layout\
  \ Editor`（布局编辑器）工具修改 `activity_main.xml` 文件，对用户界面进行了一些更改。事实上，`Layout Editor` 所做的只是提供了一种易于用户编辑文件底层\
  \ XML 内容的方法。在实践中，没有理由不直接修改 XML 以进行用户界面更改，在某些情况下，这实际上可能比使用 `Layout Editor` 工具更快。在\
  \ `Layout Editor` 面板的右上角有三个按钮，如下方的图 3-19 所示：\n\n![](img/as_4.0_layout_editor_buttons.jpg)\n\
  图 3-19\n\n默认情况下，编辑器将处于 `Design`设计`模式，此时仅显示布局的视觉表示。最左侧的按钮将切换到 `Code`代码`模式以显示布局的 XML，而中间的按钮进入\
  \ `Split`分割`模式，即同时显示布局和 XML，如图 3-20 所示：\n\n![](img/as_4.1_split_mode.jpg)\n图 3-20\n\
  \n从 XML 文件的结构可以看出，用户界面由 `ConstraintLayout` 组件组成，该组件又是 `TextView`、`Button` 和 `EditText`\
  \ 对象的父级。我们还可以看到，例如，`Button` 的 `text` 属性设置为我们的 `convert_string` 资源。尽管复杂性和内容不同，但所有用户界面布局都是按这种层次化的、基于\
  \ XML 的结构组织的。\n\n对 XML 布局进行更改时，这些更改将反映在布局画布上。也可以在布局画布面板内对布局进行视觉修改，更改将出现在 XML 列表中。要查看此操作，请切换到\
  \ `Split`模式并修改 XML 布局，将 `ConstraintLayout` 的背景颜色更改为红色系，如下：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    android:layout_width=\"\
  match_parent\"\n    android:layout_height=\"match_parent\"\n    tools:context=\"\
  .MainActivity\"\n    android:background=\"#ff2438\">\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n注意布局的颜色会实时匹配 XML 文件中的设置。此外，XML 编辑器左侧边距（也称为槽位 gutter）会出现一个小方块，这是已设置颜色的视觉提示。点击方块将显示颜色选择器，允许选择不同的颜色：\n\
  \n![](img/as_4.1_gutter_chooser.jpg)\n图 3-21\n\n在继续之前，从布局文件中删除 `background` 属性，使背景恢复默认。\n\
  \n最后，使用 `Project`面板找到 `app` -> `res` -> `values` -> `strings.xml` 文件，并双击将其加载到编辑器中。目前\
  \ XML 如下：\n\n```xml\n<resources>\n    <string name=\"app_name\">AndroidSample</string>\n\
  \    <string name=\"convert_string\">Convert</string>\n    <string name=\"dollars_hint\"\
  >dollars</string>\n</resources>\n```\n\n为了演示资源的作用，将分配给 `convert_string` 资源的字符串值更改为“Convert\
  \ to Euros”，然后通过布局文件返回 `Layout Editor` 工具。注意布局获取了字符串的新资源值。\n\n还有一种快速访问 XML 中引用值的方法。在\
  \ `Layout Editor` 工具的 `Split` 或 `Code` 模式下，点击 `@string/convert_string` 属性设置使其高亮，然后在键盘上按下\
  \ `Ctrl-B`（macOS 上为 `Cmd-B`）。Android Studio 随后将打开 `strings.xml` 文件并带您到定义该资源的位置。利用此机会将字符串资源还原为原始“Convert”文本，并添加以下供后续代码引用的额外资源条目：\n\
  \n```xml\n<resources>\n    <string name=\"convert_string\">Convert</string>\n  \
  \  <string name=\"dollars_hint\">dollars</string>\n    <string name=\"no_value_string\"\
  >No Value</string>\n</resources>\n```\n\n资源字符串也可以使用 Android Studio 的 `Translations\
  \ Editor（翻译编辑器）进行编辑。要打开此编辑器，右键点击 `app` -> `res` -> `values` -> `strings.xml` 文件并选择\
  \ `Open Translations Editor` 选项。将在 Android Studio 窗口的主面板中显示 `Translation Editor`：\n\
  \n![](img/as_3.6_translations_editor.jpg)\n图 3-22\n\n\n\n\n\n此编辑器允许对分配给资源键的字符串进行编辑，并管理多种语言的翻译。\n\
  \n## 3.8 添加交互\n\n此示例项目的最后一步是让应用程序具有交互性，以便当用户在 `EditText` 字段中输入美元值并点击转换按钮时，转换后的欧元值将显示在\
  \ `TextView` 上。这涉及在 `Button` 组件上实现某些事件处理。具体来说，需要配置 `Button`，以便在触发 `onClick` 事件时调用应用代码中的一个方法。事件处理可以通过多种不同的方式实现，并在后续标题为\
  \ Android 事件处理概述与示例的章节中进行详细介绍。返回布局编辑器到设计（Design）模式，在布局编辑器中选择 `Button` 组件，参考属性（Attributes）工具窗口，并如下所示指定名为\
  \ `convertCurrency` 的方法：\n\n![](img/as_3.6_set_onclick.jpg)\n\n图 3-23\n\n注意，`onClick`\
  \ 属性的文本字段现在用红色边框突出显示，警告我们按钮已配置为调用一个尚不存在的方法。为了解决这个问题，双击项目（Project）工具窗口中的 `MainActivity.java`\
  \ 文件（`app -> java -> <package name> -> MainActivity`）将其加载到代码编辑器中，并向类文件中添加 `convertCurrency`\
  \ 方法的代码，使其读取如下，请注意还需要导入一些额外的 Android 程序包：\n\n```java\npackage com.ebookfrenzy.androidsample;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\n\nimport android.os.Bundle;\n\
  \nimport android.view.View;\n\nimport android.widget.EditText;\n\nimport android.widget.TextView;\n\
  \npublic class MainActivity extends AppCompatActivity {\n\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.activity_main);\n    }\n\n    public void convertCurrency(View\
  \ view) {\n        EditText dollarText = findViewById(R.id.dollarText);\n      \
  \  TextView textView = findViewById(R.id.textView);\n        if (!dollarText.getText().toString().equals(\"\
  \")) {\n            Float dollarValue = Float.valueOf(dollarText.getText().toString());\n\
  \            Float euroValue = dollarValue * 0.85F;\n            textView.setText(euroValue.toString());\n\
  \        } else {\n            textView.setText(R.string.no_value_string);\n   \
  \     }\n    }\n}\n```\n\n该方法首先通过调用名为 `findViewById` 方法并传递布局文件中分配的 `id` 来获取 `EditText`\
  \ 和 `TextView` 对象的引用。然后进行检查以确保用户已输入了美元值，如果是，则提取该值，将其从 `String` 转换为浮点值并转换为欧元。最后，结果显示在\
  \ `TextView` 组件上。如果其中任何任何不清楚的地方，请放心，这些概念将在后面的章节中进行更详细的介绍。\n\n## 3.9 总结\n\n虽然并不复杂，但设置\
  \ Android 开发环境涉及许多步骤。在完成这些步骤后，通过运行一个示例来确保环境已正确安装和配置是值得的。在本章中，我们创建了一个示例应用程序，并使用 Android\
  \ Studio 布局编辑器工具修改了用户界面布局。在此过程中，我们探索了尽可能使用资源的重要性，特别是在字符串值的情况下，并简要触及了布局主题。接下来，我们查看了用于存储\
  \ Android 应用用户界面设计的底层 XML。\n\n最后，在 `Button` 上添加了 `onClick` 事件，该按钮连接到一个实现的方法，该方法从\
  \ `EditText` 组件中提取用户输入，将美元转换为欧元，然后在 `TextView` 上显示结果。\n\n由于应用程序已准备好进行测试，为测试目的设置模拟器所需的步骤将在下一章中进行详细介绍。\n\
  \n# 4. 在 Android Studio 中创建 Android 虚拟设备 (AVD)\n\n在 Android Studio 中开发 Android 应用的过程中，需要多次编译和运行应用程序。Android\
  \ 应用可以通过安装并运行在物理设备上，或者在 Android 虚拟设备 (AVD) 模拟器环境中运行来完成测试。在使用 AVD 之前，必须先创建并配置它以匹配特定设备模型的规格。因此，本章的目标是以\
  \ Pixel 3 手机作为参考示例，完成创建此类虚拟设备的涉及步骤。\n\n## 4.1 关于 Android 虚拟设备\n\nAVD 本质上是模拟器，允许在无需将应用程序安装在物理\
  \ Android 设备上的情况下测试 Android 应用程序。AVD 可以配置为模拟各种硬件功能，包括屏幕尺寸、内存容量、摄像头、GPS 导航支持或加速度计。作为标准\
  \ Android 安装的一部分，安装了许多模板，允许为不同的设备配置 AVD。AVD 会话可以独立出现也可以嵌入。例如，图 4-1 显示了一个 Pixel 3。新的\
  \ AVD 使用 Android 设备管理器（Android Device Manager）创建和管理，它可以在命令行模式下使用，也可以使用更友好的图形界面。\n\
  \n![](img/as_3.5_pixel3.jpg)\n\n图 4-1\n\n## 4.2 创建新的 AVD\n\n为了在没有物理设备的情况下测试应用程序的行为，需要为特定设备创建一个\
  \ AVD。创建新 AVD 的第一步是启动 AVD Manager。这可以通过 Android Studio 内部的 `Tools -> AVD Manager`\
  \ 菜单来实现。一旦启动，如果没有创建过 AVD 实例，该工具将如图 4-2 所示：\n\n![](img/as_3.5_empty.jpg)\n\n图 4-2\n\
  \n在对话框中，执行以下步骤创建一个兼容 Pixel 4 的模拟器：\n\n1. 从 `Category` 面板选择 `Phone` 选项，以显示可用 Android\
  \ 手机 AVD 模板列表。\n2. 选择 `Pixel 4` 设备选项并点击 `Next`。\n3. 在 `System Image` 屏幕上，为 `x86`\
  \ ABI 选择最新版本的 Android。注意，如果尚未安装系统镜像，`Release Name` 旁边将提供 `Download` 链接。点击此链接下载并安装系统镜像后再选择它。如果所需的镜像未列表，请点击\
  \ `x86 images` 和 `Other images` 选项卡查看备选列表。\n4. 点击 `Next` 继续，并在 `name` 字段中输入一个描述性名称（例如\
  \ `Pixel 4 API 30`），或直接接受默认名称。\n5. 点击 `Finish` 创建 AVD。\n6. AVD 创建后，现在可以关闭 AVD Manager。如果以后需要对\
  \ AVD 进行修改，只需重新打开 AVD Manager，从列表中选择 AVD，并点击 AVD Manager 中设备行 `Actions` 列中的铅笔图标。\n\
  \n![](img/as_4.1_select_hardware.jpg)\n\n图 4-3\n\n## 4.3 启动模拟器\n\n\n\n\n\n对新创建的\
  \ `AVD` 模拟器进行测试运行，只需从 `AVD Manager` 中选择该模拟器并点击启动按钮（Actions 列中的三角形）。模拟器将在新窗口中出现并开始启动过程。模拟器启动所需的时间取决于\
  \ `AVD` 本身及其运行运行系统的配置。\n\n尽管模拟器可能默认以竖屏方向显示，但此设置和其他默认选项是可以更改的。在 `AVD Manager` 中，选择新的\
  \ `Pixel 4` 条目，并点击设备行 Actions 列中的铅笔图标。在配置屏幕中找到 `Startup orientation`（启动方向）部分，并更改\
  \ `orientation`（方向）设置。退出并重启模拟器会以以此更改生效。关于模拟器的更多细节请参阅下一章（“使用和配置 Android Studio AVD\
  \ 模拟器”）。\n\n为了在本章的下一节中节省时间，请在继续之前保持模拟器运行。\n\n## 4.4 在 AVD 中运行应用程序\n\n配置好 `AVD` 模拟器后，之前章节中创建的示例应用程序\
  \ `AndroidSample` 现在可以编译和运行了。将 `AndroidSample` 项目加载到 `Android Studio` 后，确保新创建的 `Pixel\
  \ 4 AVD` 显示在设备菜单中（如下方图 4-4 中标记为 `A`），然后点击由绿色三角形 (B) 表示的运行按钮、选择 `Run -> Run ‘app’`\
  \ 菜单选项或使用键盘快捷键 `Ctrl-R`：\n\n```\n![](img/as_4.1_run_app_button.jpg\n```\n图 4-4\n\
  \n设备菜单 (A) 可用于选择不同的 `AVD` 实例或物理设备作为运行目标，并可以在多个设备上运行应用。该菜单还提供了访问 `AVD Manager` 和设备连接故障排除选项的接口：\n\
  \n```\n![](img/as_4.1_themes.jpg\n```\n图 13\n\n`themes.xml` 文件包含亮色模式的主题，而 `themes.xml`\
  \ (night) 文件包含设备深色模式时采用的主题如下：\n\n```\n<resources xmlns:tools=\"http://schemas.android.com/tools\"\
  >\n    <!-- 基础应用 -->\n    <style name=\"Theme.AndroidSample\" parent=\"MaterialComponents.DayNight.DarkActionBar\"\
  >\n        <!-- 主颜色 -->\n        <item name=\"colorPrimary\">@color/purple_200</item>\n\
  \        <item name=\"colorPrimaryDark\">@color/purple_700</item>\n        <item\
  \ name=\"colorOnPrimary\">@color/black</item>\n        <!-- 次要颜色 -->\n        <item\
  \ name=\"colorSecondary\">@color/teal_200</item>\n        <item name=\"colorSecondaryVariant\"\
  >@color/teal_200</item>\n        <item name=\"colorOnSecondary\">@color/black</item>\n\
  \        <!-- 状态栏颜色 -->\n        <item name=\"android:statusBarColor\" tools:targetApi=\"\
  l\">?attr/colorPrimaryVariant</item>\n        <!-- 在此处自定义您的主题 -->\n    </style>\n\
  </resources>\n```\n\n使用编辑器行隙中的颜色块进行颜色实验（例如为 `colorPrimary` 资源尝试不同的颜色）。进行更改后，再次运行应用以查看效果。\n\
  \n实验主题后，打开模拟器中的 `Settings` 应用，关闭深色模式并返回 `AndroidSample` 应用。应用程序应该会自动切换回亮色。\n\n##\
  \ 4.8 在工具窗口中运行模拟器\n\n在本章之前，我们只作为窗口使用模拟器。模拟器也可以作为嵌入工具窗口运行。要嵌入模拟器，选择 `File -> Settings...`\
  \ 菜单选项（macOS 上为 `Android Studio -> Preferences...`），在设置对话框的左侧导航面板中导航到 `Tools ->\
  \ Emulator`，并启用 `Launch in a tool window` 选项：\n\n```\n![](image/as_4.1_avd_in_tool_window_enable.jpg\n\
  ```\n图 4-14\n\n启用该选项后，点击 `Apply` 按钮以及 `OK` 提交更改，然后退出独立的模拟器会话。\n\n再次运行示例应用，此时模拟器将出现在\
  \ `Android Studio` 窗口内，如图 4-15 所示：\n\n```\n![](image/as_4.1_avd_in_tool_window.jpg\n\
  ```\n图 4-15\n\n\n\n\n\n## 图 4-15\n\n要隐藏或显示模拟器工具窗口，请点击模拟器工具窗口按钮（如上方的标记 A 处所示）。点击标签页旁边的“x”关闭按钮\
  \ (B) 即可退出模拟器。模拟器工具窗口可以容纳多个模拟器会话，每个会话都由一个标签页表示。例如，图 4-16 显示了一个包含两个模拟器会话的工具窗口：\n\n\
  ![](img/as_4.1_emulator_tool_window_two_sessions.jpg)\n\n### 图 4-16\n\n要在不同的会话之间切换，只需点击相应的标签页即可。\n\
  \n## 4.9 AVD 命令行创建\n\n如前所述，除了图形化用户界面外，还还可以直接从命令行创建新的 AVD。这是通过使用 `avdmanager` 工具结合某些命令行选项来实现的。一旦启动，工具将在创建新\
  \ AVD 之前提示你输入额外信息。\n\n`avdmanager` 工具需要访问 Java 运行时环境 (JRE) 才能运行。如果在尝试运行 `avdmanager`\
  \ 时出现错误消息提示找不到 `java` 命令，则可以配置运行命令的命令提示符或终端窗口，以使用 Android Studio 捆带的 OpenJDK 环境。首先按照以下方式识别\
  \ OpenJDK JRE 的位置：\n\n1. 启动 Android Studio 并打开书中之前创建的 AndroidSample 项目。\n2. 选择 `File\
  \ -> Project Structure...` 菜单选项。\n3. 复制 Project Structure 对话框中 `JDK location` 字段包含的路径。这代表了\
  \ Android Studio 捆带的 JRE 位置。\n\n在 Windows 上，在运行 `avdmanager` 的命令提示符窗口执行执行命令（`<path\
  \ to jre>` 替换为从 Project Structure 对话框复制的路径）：\n\n```bash\nset JAVA_HOME=<path to\
  \ jre>\n```\n\n在 macOS 或 Linux 上，执行以下命令：\n\n```bash\nexport JAVA_HOME=\"<path to\
  \ jre>\"\n```\n\n如果你预计频繁使用 `avdmanager` 工具，请按照“设置 Android Studio 开发环境”章节中列出的你操作系统的环境变量步骤，在系统级范围内配置\
  \ `JAVA_HOME`。\n\n假设系统已配置为将 Android SDK 工具目录包含在 `PATH` 环境变量中，可以通过在终端或命令窗口中发布以下命令获取新\
  \ AVD 的可用目标列表：\n\n```bash\navdmanager list targets\n```\n\n上述命令的输出结果将包含系统上可用的 Android\
  \ SDK 版本列表。例如：\n\nAvailable Android targets:\n\n----------\nid: 1 or \"android-29\"\
  \n     Name: Android API 29\n     Type: Platform\n     API level: 29\n     Revision:\
  \ 1\n----------\nid: 2 or \"android-26\"\n     Name: Android API 26\n     Type:\
  \ Platform\n     API level: 26\n     Revision: 1\n\n`avdmanager` 工具还允许从命令行创建新的 AVD\
  \ 实例。例如，要使用 x86 ABI 的 Android API level 29 设备的目标 ID 创建名为 `myAVD` 的新 AVD，可以使用以下命令：\n\
  \n```bash\navdmanager create avd -n myAVD -k \"system-images;android-29;google_apis_playstore;x86\"\
  \n```\n\n`android` 工具将根据基础 Android 8 设备所需的规格创建新 AVD，同时如果需要，还提供创建匹配特定设备规格的自定义配置的选项。一旦从命令行创建了新\
  \ AVD，它可能不会显示在 Android Device Manager 工具中，直到刷新。\n\n\n\n\n\n虽然工具栏中的许多选项都是显而易见的，但为了完整起见，我们将对每个选项进行介绍：\n\
  \n- **退出 / 最小化 (Exit / Minimize)** – 工具栏最顶部的“x”按钮在选中时会退出模拟器会话，而“-”选项则最小化整个窗口。\n\
  - **电源 (Power)** – 电源按钮模拟物理 Android 设备上的电源按钮。点击并释放此按钮将锁定设备并关闭屏幕。长按此按钮将启动设备的“关机”请求序列。\n\
  - **音量增大/减小 (Volume Up / Down)** – 控制模拟器环境内播放音频音量的两个按钮。\n- **左旋/右旋 (Rotate Left/Right)**\
  \ – 在模拟设备的纵屏和横屏方向之间切换旋转。\n- **截屏 (Take Screenshot)** – 截取设备屏幕上当前显示的内容。截取的图像存储在本章稍后介绍的扩展控制面板的设置界面中指定的位置。\n\
  - **缩放模式 (Zoom Mode)** – 此按钮切换进入和退出缩放模式，细节将在本章稍后介绍。\n- **返回 (Back)** – 模拟选择标准的 Android“返回”按钮。与下文介绍的“首页”和“概述”按钮一样，通过选择模拟器屏幕上的实际按钮也可以实现相同的结果。\n\
  - **主页 (Home)** – 模拟选择标准的 Android“主页”按钮。\n- **概述 (Overview)** – 模拟选择标准的 Android“概述”按钮，用于显示设备上正在运行的应用。\n\
  - **折叠设备 (Fold Device)** – 模拟折叠设备的折叠和展开。只有当模拟器运行折叠设备系统镜像时，此选项可用。\n- **扩展控制 (Extended\
  \ Controls)** – 显示扩展控制面板，允许配置模拟位置和电话活动、电池电、蜂窝网络类型和指纹识别等选项。\n\n## 5.3 在缩放模式下工作\n\n\
  模拟器工具栏上的缩放按钮用于进入和退出缩放模式。当缩放模式激活时，工具栏按钮处于按下状态，且鼠标指针在悬停于设备屏幕上时显示为放大镜。点击鼠标左键将导致显示相对于屏幕上的选定点放大，重复点击会增加缩放级别。相反，点击右键将减小缩放级别。关闭缩放按钮将显示恢复到默认大小。\n\
  \n在缩放模式下点击并拖动将定义一个矩形区域，释放鼠标按钮时视图将缩放至该区域。\n\n在缩放模式下，可以使用模拟器窗口内的水平和垂直滚动条对屏幕可见区域进行移动。\n\
  \n## 5.4 调整模拟器窗口大小\n\n模拟器窗口的大小（以及相应的设备表示）可以通过点击并拖动窗口的任何角或侧边来随时更改。\n\n## 5.5 扩展控制选项\n\
  \n扩展控制工具栏按钮会显示图 5-3 所示的面板。默认情况下，将显示位置设置。从左侧面板选择不同的类别将显示相应的控制组：\n\n![](img/as_3.6_avd_location_settings.jpg)\n\
  \n图 5-3\n\n### 5.5.1 位置 (Location)\n\n位置控制允许以十进制或六角坐标的形式将模拟位置信息发送到模拟器。位置信息可以是单个位置，也可以是代表设备移动的点序列，后者通过\
  \ GPS 交换 (`GPX`) 或 Keyhole 标记语言 (`KML`) 格式的文件提供。或者，可以使用集成的 Google Maps 面板视觉化选择点或旅行路线。\n\
  \n### 5.5.2 显示 (Displays)\n\n除了模拟器屏幕内显示的主显示外，“显示”选项允许在同一个 Android 实例中运行额外的显示器。这对于测试如\
  \ Microsoft Surface Duo 等双屏设备的应用非常有用。这些额外的屏幕可以配置为任何所需的尺寸，并出现在与主屏幕相同的同一个模拟器窗口中。\n\
  \n### 5.5.3 蜂窝 (Cellular)\n\n可以在蜂窝设置界面中更改模拟的蜂窝连接类型。可以选择模拟不同网络类型（如 `CSM`、`EDGE`、`HSDPA`\
  \ 等）以及一系列语音和数据场景，如漫游和拒绝访问。\n\n### 5.5.4 摄像头 (Camera)\n\n当摄像头激活时，模拟器会模拟 3D 场景。这是一个虚拟建筑内部，在模拟器内录制视频或拍照之前，可以通过按住\
  \ `Option` 键（Windows 上为 `Alt`）同时使用鼠标指针和键盘键在其中进行导航。此扩展配置选项允许上传不同的图像显示在虚拟环境中。\n\n\
  ### 5.5.5 电池 (Battery)\n\n在此扩展控制屏幕面板上可以模拟各种电池状态和充电条件，包括电池电量、电池健康状况以及当前是否连接了交流充电器。\n\
  \n### 5.5.6 电话 (Phone)\n\n电话扩展控制在模拟器内提供了两个简单但实用的模拟。第一个选项允许模拟来自指定电话号码的入电电话。这在测试应用如何处理此类高级中断时特别有用。\n\
  \n第二个选项允许在模拟器会话中模拟接收短信。与现实世界一样，这些消息出现在“消息”应用中，并触发模拟器内的标准通知。\n\n### 5.5.7 方向键 (Directional\
  \ Pad)\n\n方向键 (`D-Pad`) 是内置在 Android 设备中或外部连接（如游戏控制器）的另一组额外控件，提供方向控制（左、右、上、下）。方向键设置允许在模拟器内模拟\
  \ D-Pad 交互。\n\n### 5.5.8 麦克风 (Microphone)\n\n麦克风设置允许启用麦克风并模拟耳机和麦克风连接。还提供了一个按钮启动模拟器上的语音助手。\n\
  \n### 5.5.9 指纹 (Fingerprint)\n\n许多 Android 设备现在配备了内置指纹检测硬件。AVD 模拟器使得无需在带有指纹传感器的物理设备上测试指纹验证。如何在模拟器内配置指纹测试的细节将在本章稍后详细介绍。\n\
  \n### 5.5.10 虚拟传感器 (Virtual Sensors)\n\n虚拟传感器选项允许模拟加速度计和磁力计，通过偏航、俯仰和滚滚设置模拟设备的物理运动（如旋转、移动和倾斜）。\n\
  \n### 5.5.11 快照 (Snapshots)\n\n快照包含保存并快速恢复的当前运行 AVD 会话状态，可以让模拟器回到精确状态。快照在本章稍后详细介绍。\n\
  \n### 5.5.12 录制与播放 (Record and Playback)\n\n允许将模拟器屏幕和音频录制并保存为 WebM 或动画 GIF 格式。\n\
  \n### 5.5.13 Google Play\n\n如果模拟器运行的版本带有 Google Play 服务，此选项将显示当前的 Google Play 版本并提供更新模拟器到最新版本的选项。\n\
  \n### 5.5.14 设置 (Settings)\n\n设置面板提供了一组配置选项。使用此面板为工具栏和扩展控制面板选择更深色的主题、指定保存截图的文件系统位置、配置\
  \ OpenGL 支持级别，以及配置模拟器窗口位于桌面上其他窗口之上。\n\n### 5.5.15 帮助 (Help)\n\n\n\n\n帮助屏幕包含三个子面板，分别包含快捷键列表、访问模拟器在线文档/报告错误及发送反馈的链接，以及模拟器版本信息。\n\
  \n## 5.6 使用快照（Snapshots）\n\n当模拟器首次启动时，它会执行一次类似于物理 Android 设备开机时的冷启动。由于系统的加载和所有后台进程的启动，冷启动过程可能需要一些时间才能完成。为了避免每次启动模拟器时都经历此过程，系统被配置为每次退出时自动保存模拟器当前状态的快照（称为快速启动快照）。下次启动模拟器时，快速启动快照将加载到内存中，并从上次离开的地方继续执行，允许模拟器所需的时间仅为冷启动所需时间的一小部分。\n\
  \n扩展控制面板的 `Snapshots` 屏幕用于在模拟器运行期间的任何点存储额外的快照。这保存了整个模拟器的精确状态，允许模拟器恢复到拍摄快照时的精确时间点。在屏幕界面中，可以使用\
  \ `Take Snapshot` 按钮（在图 5-4 中标记为 A）拍摄快照。要恢复现有的快照，从列表中选择它 (B) 并点击屏幕底部的 `run` 按钮 (C)。还提供了选项来编辑\
  \ (D) 快照名称和描述，并删除 (E) 当前选中的快照：\n\n![](img/as_3.2_avd_snapshots.jpg)\n\n图 5-4\n\n\
  `Settings` 选项 (F) 配置自动保存快速启动快照（默认情况下，模拟器在每次退出时都会询问是否保存快速启动快照）以及重新加载最新快照的选项。要强制模拟器话执行冷启动而不是使用之前的快速启动快照，打开\
  \ `AVD Manager`（`Tools -> AVD Manager`），点击模拟器操作列中的向下箭头并选择 `Cold Boot Now` 菜单选项。\n\
  \n![](img/as_3.2_avd_cold_boot_now.jpg)\n\n图 5-5\n\n## 5.7 配置指纹模拟\n\n模拟器允许配置最多 10\
  \ 个模拟指纹，并用于测试 Android 应用内的指纹验证。要配置模拟指纹，首先启动模拟器，打开 `Settings` 应用并选择 `Security & Location`\
  \ 选项。\n\n在 `Security` 设置屏幕中，选择 `Use fingerprint` 选项。在弹出信息屏幕上点击 `Next` 按钮进入指纹设置屏幕。在启用指纹安全之前，必须配置备份屏幕解锁方法（如\
  \ PIN 码）。点击 `Fingerprint + PIN` 按钮，并在提示时选择在设备启动时不需要 PIN。输入并确认合适的 PIN 码，通过接受默认通知选项来完成\
  \ PIN 输入过程。\n\n继续通过后续屏幕，直到 `Settings` 应用请求在传感器上指纹。此时，显示扩展控制对话框，在左侧面板中选择 `Fingerprint`\
  \ 类别，并确保主设置面板中选择了 `Finger 1`：\n\n![](img/Image2468.jpg)\n\n图 5-6\n\n点击 `Touch the\
  \ Sensor` 按钮模拟 `Finger 1` 触摸指纹传感器。模拟器将报告指纹添加成功：\n\n![](img/Image2478.jpg)\n\n图 5-7\n\
  \n要添加更多指纹，点击 `Add Another` 按钮，并在再次点击 `Touch the Sensor` 按钮之前，从扩展控制面板菜单中选择另一个手指。关于在\
  \ Android 应用中构建指纹验证的主题，在名为“Android 生物识别认证教程”的章节中有详细介绍。\n\n## 5.8 工具窗口模式下的模拟器\n\n\
  如上一章所述（“在 Android Studio 中创建 Android 虚拟设备 (AVD)” ]），可以配置 Android Studio 以嵌入工具窗口的形式启动模拟器，这样它就不会出现在独立的窗口中。当在此模式下运行时运行时，工具栏中将提供独立模式下可用的一小部分控件，如图\
  \ 5-8 所示：\n\n![](img/as_4.1_tool_window_emulator_toolbar.jpg)\n\n图 5-8\n\n从左到右，这些按钮执行以下任务（详细信息与独立模式一致）：\n\
  \n- 电源（Power）\n- 音量增加（Volume Up）\n- 音量减小（Volume Down）\n- 左旋转（Rotate Left）\n- 右旋转（Rotate\
  \ Right）\n- 返回（Back）\n- 主页概览（Home Overview）\n- 截图（Take Screenshot）\n- 拍摄快照（Take\
  \ Snapshot）\n\n## 5.9 总结\n\nAndroid Studio 4.1 包含 Android 虚拟设备模拟器环境，旨在更方便地测试应用程序，无需在物理\
  \ Android 设备上运行。本章简要介绍了模拟器，并强调了配置和自定义环境以模拟不同测试条件的关键功能。\n\n## 6. Android Studio 用户界面漫览\n\
  \n虽然人们急于开始运行上一章创建的示例应用程序，但这样做涉及 Android Studio 用户界面的某些方面，这些方面最好先进行描述。\n\nAndroid\
  \ Studio 是一个强大且功能丰富的开发环境，在很大程度上是直观的。尽管如此，现在花时间熟悉 Android Studio 用户界面的布局和组织将大大缩短本书后续章节的学习曲线。考虑到这一点，本章将提供组成\
  \ Android Studio 环境的各个区域和组件的初步概述。\n\n## 6.1 欢迎屏幕\n\n欢迎屏幕（图 6-1）在 Android Studio\
  \ 运行时没有任何打开的项目时显示（可以随时通过选择 `File -> Close Project` 选项关闭打开的项目）。如果 Android Studio\
  \ 在有打开的项目时退出，下次启动时将跳过欢迎屏幕，自动打开之前激活的项目。\n\n![](img/as_4.1_welcome2.jpg)\n\n图 6-1\n\
  \n除了最近的项目列表，`Quick Start` 菜单提供了执行诸如打开、创建和导入项目等选项，并访问受版本控制的项目。此外，窗口底部的 `Configure`\
  \ 菜单提供了访问 `SDK` 以及大量设置和配置选项。通过这些选项可以很快发现，Android Studio 几乎没有方面是不根据你的特定需求进行配置的。\n\
  \n`Configure` 菜单还包含检查是否有可下载的 Android Studio 更新选项。\n\n## 6.2 主窗口\n\n当创建新项目或打开现有项目时，Android\
  \ Studio 主窗口将出现。当同时打开多个项目时，每个项目将拥有自己的主窗口。窗口的精确配置取决于上次打开项目时显示了工具和面板，但通常类似于图 6-2。\n\
  \n![](img/as_4.1_main_window_labeled.jpg)\n\n图 6-2\n\n主窗口的各种元素可以总结如下：\n\nA – `Menu\
  \ Bar`（菜单栏）——包含用于 Android Studio 环境内执行任务的一系列菜单。\n\n\n\n\n\n### B – 工具栏 (Toolbar)\n\
  一组用于常用操作的快捷键。工具栏按钮可以快速访问一组特定的菜单栏操作。可以通过在工具栏上点击右键并选择 `Customize Menus and Toolbars…`\
  \ 菜单选项来自定义工具栏。如果工具栏可见，可以使用 `View -> Appearance -> Toolbar` 菜单选项显示它。\n\n### C – 导航栏\
  \ (Navigation Bar)\n导航栏提供了在组成项目的文件和文件夹之间移动的便捷方式。点击导航栏中的某个元素将弹出一个菜单，列出该位置的子文件夹和文件以供选择。同样，点击类名将显示列出该类包含的方法的列表。从列表中选择一个方法，即可跳转到代码编辑器中相应的位置。使用\
  \ `View -> Appearance -> Navigation Bar` 菜单选项隐藏或显示此栏。\n\n### D – 编辑器窗口 (Editor Window)\n\
  编辑器窗口显示开发者当前工作的文件内容。然而，在此位置显示的内容取决于上下文。例如，在编辑代码时，将显示代码编辑器。相反，在处理用户界面布局文件时，将显示用户界面布局编辑器（Layout\
  \ Editor）工具。当打开多个文件时，每个文件都由编辑器顶部边缘的标签页表示，如图 6-3 所示。\n\n![](img/as_4.1_editor_File_tabs.jpg)\n\
  图 6-3\n\n### E – 状态栏 (Status Bar)\n状态栏显示关于项目和 Android Studio 活动的消息信息，以及位于最左角的工具菜单按钮。悬停在状态栏条目上将提供该字段的描述。许多字段是可交互的，允许用户点击以执行任务或获取更详细的状态信息。\n\
  \n### F – 项目工具窗口 (Project Tool Window)\n项目工具窗口提供了项目文件结构的层级概述，允许对特定的文件和文件夹进行导航。可以使用工具栏以多种不同的方式显示项目。默认设置是\
  \ Android 视图，这是书中其余部分使用的模式。\n\n项目工具窗口只是 Android Studio 环境中众多可用工具窗口之一。\n\n## 6.3\
  \ 工具窗口 (The Tool Windows)\n\n除了项目视图工具窗口外，Android Studio 还包含了许多其他窗口，启用后它们会显示在主窗口的底部和侧边。只需将鼠标指针悬停在状态栏最左角的按钮上（图\
  \ 6-4），即可访问工具窗口快速访问菜单无需点击鼠标。\n\n![](img/as_4.1_tool_window_menu.jpg)\n图 6-4\n\n\
  从快速访问菜单中选择项目将导致相应的工具窗口出现在主窗口中。\n\n或者，可以通过点击状态栏中的快速访问菜单图标显示一组工具窗口栏。这些栏出现在主窗口的左侧、右侧和底部边缘（如图\
  \ 6-5 中的箭头所示），并包含显示和隐藏每个工具窗口的按钮。当工具窗口栏显示时，再次点击状态栏中的按钮将把它们隐藏。\n\n![](img/as_4.1_tool_window_bars.jpg)\n\
  图 6-5\n\n点击按钮将显示相应的工具窗口，而再次点击将隐藏该窗口。带有数字开头的按钮（例如 1: Project）表示可以通过按下键盘上的 `Alt` 键（macOS\
  \ 为 `Command` 键）配合相应的数字来显示该工具窗口。\n\n工具窗口栏中按钮的位置表示窗口在显示时位于窗口的哪侧。可以通过点击并拖动按钮到其他窗口工具栏的不同位置来更改这些位置。\n\
  \n每个工具窗口在顶部边缘都有自己的工具栏。这些工具栏中的按钮随工具的不同而异，但所有工具窗口都包含一个由齿轮图标表示的设置选项，允许更改窗口的各个方面。图 6-6\
  \ 显示了项目视图工具窗口的设置菜单。提供可用选项，例如取消固定（undock）窗口使其浮动在 Android Studio 主窗口边界之外，以及移动和调整工具面板的大小。\n\
  \n![](img/as_4.0_project_tool_window_menu1.jpg)\n图 6-6\n\n所有窗口的工具栏最右侧都包含一个按钮，提供了隐藏工具窗口以备视图的额外方法。只需通过点击该窗口使其获取焦点，然后输入搜索术语（例如项目工具窗口中的文件名），即可对工具窗口内的条目进行搜索。搜索框将出现在窗口的工具栏中，匹配搜索词的条目将被高亮。\n\
  \nAndroid Studio 提供了广泛的工具窗口，最常用的如下：\n\n*   **Project (项目)**：项目视图提供了项目文件结构的概述，允许在文件之间快速导航。通常情况下，在项目视图中双击文件将导致该文件加载到适当的编辑工具中。\n\
  *   **Structure (结构)**：结构工具提供了当前编辑器中显示的源文件结构的高级视图。此信息包括文件中的类、方法和变量等条目的列表。从结构列表中选择一个项目将带您跳转到编辑器窗口中源文件的相应位置。\n\
  *   **Favorites (收藏)**：可以将各种项目条目添加到收藏列表。例如，在项目视图中右键点击文件可以提供 `Add to Favorites`（添加到收藏）菜单选项。同样，也可以在结构窗口中右键点击源文件中的方法将其添加为收藏。添加到收藏列表的任何内容都可以通过收藏工具窗口访问。\n\
  *   **Build Variants (构建变体)**：构建变体窗口为应用程序项目配置不同的构建目标提供了快速方法（例如调试版本和发布版本的不同构建，或针对不同设备类别的多个构建）。\n\
  *   **TODO**：如名称所示，此工具提供了一个查看项目中尚未完成事项的地方。Android Studio 通过扫描组成项目的源文件寻找匹配指定 TODO\
  \ 模式的注释来编译此列表。可以通过选择 `File -> Settings…` 菜单选项（macOS 为 Android Studio -> Preferences…）并导航到\
  \ Editor 下的 TODO 页面查看和更改这些模式。\n*   **Logcat**：Logcat 工具窗口提供了对运行应用程序监控日志输出的访问，以及拍摄应用程序截图、视频停止和重启进程的选项。\n\
  *   **Terminal (终端)**：提供了对运行 Android Studio 的系统的终端窗口的访问。在 Windows 系统上这是命令提示符，而在\
  \ Linux 和 macOS 系统上以终端提示符的形式存在。\n*   **Build (构建)**：构建工具窗口在项目编译和打包时显示构建过程的信息，并显示遇到任何错误时的详细信息。\n\
  *   **Run (运行)**：当应用程序运行时，运行工具窗口可用，并提供运行结果视图以及停止或重启运行进程的选项。如果应用程序无法在设备或模拟器上安装和运行，此窗口通常会提供与问题相关的诊断信息。\n\
  \n\n\n\n\n-   **事件日志 (Event Log)**：事件日志窗口显示与 Android Studio 内执行的事件和活动相关的消息。例如，项目的成功构建或应用程序正在运行等情况将在此工具窗口中报告。\n\
  -   **Gradle**：Gradle 工具窗口提供了组成项目构建配置的 Gradle 任务的视图。该窗口列出了在将项目的各种元素编译为可执行应用程序时涉及的任务。右键点击顶层\
  \ `Gradle` 任务并选择 `Open Gradle Config`（打开 Gradle 配置）菜单选项，可以将当前项目的 `Gradle` 构建文件加载到编辑器中。本书的后后部分将更详细地介绍\
  \ `Gradle`。\n-   **性能分析器 (Profiler)**：Android 分析器工具窗口提供了实时监控和分析工具，用于识别运行的应用程序中的性能问题，包括\
  \ CPU、内存和网络使用。当应用程序当前运行时，此选项将可用。\n-   **设备文件管理器 (Device File Explorer)**：设备文件管理器工具窗口提供了直接访问当前连接的\
  \ Android 设备或模拟器文件系统的权限，允许浏览文件并将文件复制到本地文件系统。\n-   **资源管理器 (Resource Manager)**：用于添加和管理项目包含的资源和资产工具，如图像、颜色和布局文件。\n\
  -   **布局检查器 (Layout Inspector)**：提供构成用户界面布局的组件层次结构的视觉 3D 渲染。\n-   **模拟器 (Emulator)**：如果已启用在工具窗口中运行模拟器的选项（如标题为在\
  \ Android Studio 中创建 Android 虚拟设备 (AVD)的章节所示），则其中包含 AVD 模拟器。\n\n## 6.4 Android Studio\
  \ 快捷键\n\nAndroid Studio 包含了大量的快捷键，旨在执行常用任务时节省时间。您可以在 Android Studio 项目窗口内选择 `Help\
  \ -> Keymap Reference`（帮助 -> 键映射引用）菜单选项来查看并打印完整的快捷键映射列表。您还可以通过选择 `File -> Settings...`（文件\
  \ -> 设置...）菜单选项（macOS 上为 `Android Studio -> Preferences...`）并点击下方的 `Keymap`（键映射）项来列出和修改快捷键，如下下方的图\
  \ 6-7：\n\n![](img/as_4.1_keymaps.jpg)\n\n图 6-7\n\n## 6.5 切换器与最近文件导航\n\n在 Android\
  \ Studio 主窗口内导航的另一种有用机制是使用 `Switcher`（切换器）。通过 `Ctrl-Tab` 快捷键访问，切换器显示为一个列出所有工具窗口和当前打开文件的面板（图\
  \ 6-8）。\n\n![](img/as_4.1_switcher.jpg)\n\n图 6-8\n\n一旦显示，只要 `Ctrl` 键保持按下，切换器就会保持可见。在按住\
  \ `Ctrl` 键的同时反复点击 `Tab` 键可以在各种选择选项之间循环，而释放 `Ctrl` 键会导致当前高亮的项选中并在主窗口中显示。\n\n除了切换器外，`Recent\
  \ Files`（最近文件）面板还提供了到最近打开文件的导航（图 6-9）。可以使用 `Ctrl-E` 快捷键（macOS 上为 `Cmd-E`）访问该面板。显示后，既可以使用鼠标指针选择选项，也可以使用键盘方向键在文件名和工具窗口选项之间滚动。按下\
  \ `Enter` 键将选中当前高亮的项。\n\n![](img/as_4.0_recent_files.jpg)\n\n图 6-9\n\n## 6.6 修改\
  \ Android Studio 主题\n\nAndroid Studio 环境的整体主题可以通过欢迎界面上的 `Configure -> Settings`（配置\
  \ -> 设置）选项，或者通过主窗口的 `File -> Settings…`（文件 -> 设置…）（macOS 上为 `Android Studio -> Preferences…`）菜单选项进行更改。\n\
  \n显示设置对话框后，在左面板选择 `Appearance & Behavior`（外观与行为）选项，随后选择 `Appearance`（外观），然后更改设置。在点击\
  \ `Apply` 按钮之前，图 6-10 显示了 `Light`、`IntelliJ`、`Windows` 以及 `Darcula` 等可用主题：\n\n![](img/as_3.6_darcula.jpg)\n\
  \n图 10\n\n## 6.7 总结\n\nAndroid Studio 环境的要素元素包括欢迎界面和主窗口。每个项目都分配了一个主窗口，该窗口由菜单栏、工具栏、编辑区域、状态栏和工具窗口组成。在\
  \ Android Studio 内，某些操作可以通过快捷键触发。可以随时从 Android Studio 访问快捷键映射。在物理设备上测试 Android 应用可以使用许多功能。\n\
  \n## 7. 在物理设备上测试 Android 应用\n\n虽然可以使用 Android 虚拟设备 (AVD) 测试应用程序，但某些功能只有在对物理设备进行测试时可用。与\
  \ AVD 实例和连接的 Android 设备通信由 Android 桥接 (`ADB`) 处理。\n\n## 7.1 Android 桥接 (ADB) 概述\n\
  \n`ADB` 的主要目的是促进开发系统（在本例中为 Android）与 AVD 模拟器以及物理设备之间的交互。\n\n`ADB` 由一个客户端、一个运行在开发系统上的服务器进程以及一个运行在\
  \ AVD 或真实设备上的守护进程组成。\n\n`ADB` 客户端有多种形式。例如，它以 Android SDK `platform-tools` 子目录下的名为\
  \ `adb` 的命令行工具的形式提供。同样，Android Studio 也内置了一个客户端。可以使用 `adb` 命令行工具执行各种任务。例如，可以使用 `devices`\
  \ 命令行参数获取当前虚拟或物理设备列表。以下命令输出表示系统中存在 AVD 但没有物理设备：\n\n```\nadb devices\nList of devices\
  \ attached\nemulator-5554 device\n```\n\n## 7.2 在 Android 设备上启用 ADB\n\n在 `ADB` 连接到\
  \ Android 设备之前，必须先配置该设备允许连接。对于运行 Android 6.0 或更高版本的手机和平板设备，实现此点的步骤如下：\n\n1. 打开设备上的\
  \ `Settings` 应用并选择 `About tablet` 或 `About phone` （在较新版本的 Android 可以在 `Settings`\
  \ 的 `System` 页面找到）。\n2. 在 `About` 屏幕上，滚动到 `Build number` 字段（图 7-1）并点击多次，直到出现已启用开发者模式的消息。如果\
  \ `Build number` 未列在 `About` 屏幕上，可以通过 `Software information` 访问。或者，如果可用，展开列表中的 `Advanced`\
  \ 部分。\n3. 返回设置主界面，注意出现了一个名为 `Developer options`（开发者选项）的新选项。选择此选项并找到开发者屏幕上名为 `USB\
  \ debugging`（USB 调试）的设置。启用该项目旁边的开关，如下所示图 7-2：\n\n![](img/Image2841.jpg)\n\n图 7-2\n\
  \n\n\n\n4. 从屏幕顶部向下滑动显示通知面板（图 7-3），并注意设备当前已连接用于调试。\n\n![](img/Image2848.jpg)\n\n\
  图 7-3\n\n此时，设备已配置好可以接受来自开发系统上 `adb` 的调试连接。剩下的工作工作是配置开发系统，以便在设备连接时能够检测到它。虽然这是一个相对简单的过程，但涉及的步骤取决于开发系统运行的是\
  \ Windows、macOS 还是 Linux。请注意，后续步骤假设 Android SDK 的 `platform-tools` 目录已包含在操作系统的 `PATH`\
  \ 环境变量中，这在“设置 Android Studio 开发环境”章节中所描述。\n\n### 7.2.1 macOS ADB 配置\n\n为了在 macOS\
  \ 系统上配置 `ADB` 环境，请使用 USB 数据线将设备连接到计算机系统，打开终端窗口并执行以下命令以重启 `adb` 服务：\n\n```bash\n\
  $ adb kill-server\n$ adb start-server\n```\n\n* daemon not running. starting it\
  \ now on port 5037 *\n* daemon started successfully *\n\n一旦服务器成功运行，执行以下命令验证是否已检测到设备：\n\
  \n```bash\n$ adb devices\nList of devices attached\n74CE000600000001 offline\n```\n\
  \n如果设备显示为 `offline`（离线），请前往 Android 设备并检查是否存在图 7-4 所示的对话框，请求权限以`允许 USB 调试`。在点击确定\
  \ 之前，勾选`始终来自此计算机`旁边的复选框。再次执行 `adb devices` 命令现在应该会将设备列为可用：\n\n```bash\nList of devices\
  \ attached\n015d41d4454bf80c device\n```\n\n如果设备未列出，请尝试注销并重新登录 macOS 桌面，如果问题仍然存在，请重启系统。\n\
  \n### 7.2.2 Windows ADB 配置\n\n配置基于 Windows 的开发系统通过 `ADB` 连接到 Android 设备的第一步是在系统上安装相应的\
  \ USB 驱动程序。要安装的 USB 驱动程序取决于 Android 设备的型号。如果您有 Google Nexus 设备，则需要在您的 Windows 系统上安装并配置\
  \ `Google USB Driver` 包。实现此操作的详细步骤在以下网页上概述：\n\n[`developer.android.com/sdk/win-usb.html`](http://developer.android.com/sdk/win-usb.html)\n\
  \n对于 Google USB 驱动程序不支持的 Android 设备，则需要下载设备制造商提供的驱动程序。可以在此处在线获取驱动程序列表以及下载和安装信息：\n\
  \n[`developer.android.com/tools/extras/oem-usb.html`](https://developer.android.com/tools/extras/oem-usb.html)\n\
  \n安装驱动程序后，设备现在会被识别为正确的设备类型，打开命令提示符窗口并执行以下命令：\n\n```cmd\nadb devices\n```\n\n此命令应输出连接设备的信息，如下所示：\n\
  \n```text\nList of devices attached\nHT4CTJT01906 offline\n```\n\n如果设备显示为 `offline`\
  \ 或 `unauthorized`（未授权），请查看设备显示器并检查是否存在图 7-4 所示的对话框，请求权限以`允许 USB 调试`。\n\n![](img/Image2856.jpg)\n\
  \n图 7-4\n\n在点击确定 之前，勾选`始终来自此计算机`旁边的复选框。再次执行 `adb devices` 命令现在会将设备列为已就绪：\n\n```text\n\
  List of devices attached\nHT4CTJT01906 device\n```\n\n如果设备未列出，执行以下命令以重启 `ADB` 服务：\n\
  \n```cmd\nadb kill-server\nadb start-server\n```\n\n如果设备仍然未列出，尝试执行以下命令：\n\n```cmd\n\
  android update adb\n```\n\n请注意，可能还需要重启系统。\n\n### 7.2.3 Linux adb 配置\n\n出于本章的需要，我们将再次使用\
  \ Ubuntu Linux 作为参考示例，介绍在 Linux 上配置 `adb` 以连接到物理 Android 设备进行应用程序测试。\n\n在 Ubuntu\
  \ Linux 上进行物理设备测试需要安装名为 `android-tools-adb` 的包，这反而要求 Android Studio 用户是 `plugdev`\
  \ 组的成员。这是大多数 Ubuntu 版本用户账户的默认设置，可以通过运行 `id` 命令进行验证。如果未列出 `plugdev` 组，请运行以下命令将您的账户添加到该组：\n\
  \n```bash\nsudo usermod -aG plugdev $LOGNAME\n```\n\n满足组成员要求后，可以通过执行以下命令来安装 `android-tools-adb`\
  \ 包：\n\n```bash\nsudo apt-get install android-tools-adb\n```\n\n完成上述更改后，重启 Ubuntu\
  \ 系统。系统重启后，打开终端窗口，启动 `adb` 服务并检查已连接设备列表：\n\n```bash\n$ adb start-server\n* daemon\
  \ not running. starting it now on port 5037 *\n* daemon started successfully *\n\
  \n$ adb devices\nList of devices attached\n015d41d4454bf80c offline\n```\n\n如果设备显示为\
  \ `offline` 或 `unauthorized`，请前往设备并检查是否存在图 7-4 所示的对话框，请求权限以`允许 USB 调试`。\n\n## 7.3\
  \ 测试 adb 连接\n\n假设在您选择的平台上 `adb` 配置成功，下一步是在设备上运行在“在 Android Studio 中创建 Android 应用”章节中创建的应用程序。启动\
  \ Android Studio，打开项目，并验证设备是否出现在图 7-5 所示的设备菜单中：\n\n![](img/3.5-device_in_menu.jpg)\n\
  \n图 7-5\n\n## 7.4 总结\n\n虽然 Android 虚拟机提供了一个极佳的测试环境，但请记住没有什么可以替代在真实设备上确保应用程序正常运行。但是，Android\
  \ Studio 环境默认未配置将 Android 设备作为测试设备。因此，需要执行某些步骤，以便从 Android Studio 环境中将应用程序加载到 Android\
  \ 设备。具体步骤取决于所使用的开发平台。在本章中，我们涵盖了适用于 Linux、macOS 和 Windows 平台的步骤。\n\n## 8. Android\
  \ 代码编辑器的基础\n\n为 Android 开发应用程序涉及大量的编程工作，根据定义，这涉及代码行的输入、审查和修改。这并不意外，开发者使用 Android\
  \ Studio 的大部分时间通常会在编辑器窗口内编辑代码。\n\n现代代码编辑器需要远超基础的输入、删除、剪切和粘贴。今天，代码编辑器的实用性通常根据以下因素衡量：它在多大程度上减少了程序员的输入量、在大型源文件中的导航便利性，以及编辑器在编写代码时实时检测并高亮编程错误的能力。正如本章将所示的，这些只是\
  \ Android Studio 编辑器出色的领域之一。\n\n虽然本章并不是 Android Studio 编辑器功能的详尽概述，但旨在提供该工具的关键功能指南。经验丰富的程序员会发现，其中某些功能是目前许多代码编辑器共有的，而另许多功能是此特定编辑环境所独特的。\n\
  \n### 8.1 Android Studio 编辑器\n\n\n\n\n当选中 Java、Kotlin、XML 或其他基于文本的文件进行编辑时，Android\
  \ Studio 编辑器出现在主窗口的中心。例如，图 8-1 显示了一个加载了 Java 源代码文件的典型编辑器会话：\n\n![](img/as_3.6_labelled_editor_java.jpg)\n\
  \n图 8-1\n\n构成编辑器窗口的元素可以总结如下：\n\n### A – 文档标签 (Document Tabs)\nAndroid Studio 能够同时打开多个文件进行编辑。每打开一个文件，它都会被分配一个文档标签，在编辑器窗口顶部边缘的标签栏中显示文件名。当空间不足以显示所有标签时，标签栏的最右侧会出现一个微小的下拉菜单。点击此菜单将列出其他已打开的文件列表。标签中文件名下方的红色波浪线表示该文件中的代码包含一个或多个错误，这些错误在项目编译和运行之前需要解决。\n\
  \n在文件之间切换只需点击相应的标签，或使用快捷键 `Alt-Left` 和 `Alt-Right`。文件之间的导航也可以也可以使用切换器（Switcher）机制（通过快捷键\
  \ `Ctrl-Tab` 访问\n\n要将编辑器面板从 Android Studio 主窗口分离并使其在单独窗口中显示，请点击标签并将其拖到主窗口之外的桌面区域。要将编辑器返回主窗口，请点击分离编辑器窗口中的文件标签，将其拖放到主窗口中的原始编辑器标签栏上。\n\
  \n### B – 编辑器行槽区域 (The Editor Gutter Area)\n行槽区域用于编辑器显示信息图标和控件。在该行槽区域出现的一些典型项目包括调试断点标记、折叠和展开代码块的控件、书签、更改标记和行号。行号默认开启，但可以通过在行槽中点击右键并选择\
  \ `Show Line Numbers`（显示行号）菜单选项来禁用。\n\n### C – 代码结构位置 (Code Structure Location)\n\
  编辑器底部的此栏显示光标相对于代码整体结构的当前位置。例如，在下面的图中，该栏表示当前正在编辑一个 `setOnClickListener` 方法调用，且该行代码包含\
  \ `MainActivity` 类的 `convertCurrency` 方法中。\n\n![](img/as_4.1_structure_location.jpg)\n\
  \n图 8-2\n\n双击栏中的元素会将光标移动到代码文件中的相应位置。例如，双击 `convertCurrency(view: View)` 条目将把光标移动到源代码中\
  \ `convertCurrency` 方法的顶部。同样，点击 `MainActivity` 条目将弹出一个可用的代码导航点列表供选择：\n\n![](img/as_4.1_code_editor_navigate_structure.jpg)\n\
  \n图 8-3\n\n### D – 编辑器区域 (The Editor Area)\n这是用户显示、输入和编辑代码的主区域。本章随后的章节将详细介绍编辑区域的关键功能。\n\
  \n### E – 验证与标记侧侧边栏 (The Validation and Marker Sidebar)\nAndroid Studio 整合了一项名为“即时代码分析”的功能。这本质上意味着当您编写代码时，编辑器正在分析代码以检查警告和语法错误。验证侧边栏顶部的指示器将从绿色标记（未检测到警告或错误）变为黄色正方形（检测到警告）或红色警报图标（已检测到错误）。点击此指示器将显示一个弹出窗口，其中包含编辑器代码发现的问题摘要，如图\
  \ 8-4 所示：\n\n![](img/as_3.5_code_editor_analysis.jpg)\n\n图 8-4\n\n侧边栏还使用相同的颜色代码在检测到问题的位置显示标记。当编辑器区域显示该行代码时，将鼠标指针悬停在标记上，将显示一个包含问题描述的弹出窗口（图\
  \ 8-5）：\n\n![](img/as_4.0_code_editor_error.jpg)\n\n图 8-5\n\n当某行代码目前滚动出编辑器可视区域时，将鼠标指针悬停在该行的标记上，将显示一个“透镜”（lens）覆盖层，其中包含问题所在的代码块（图\
  \ 8-6），从而无需滚动到编辑器的该位置即可查看：\n\n![](img/Image2460.jpg)\n\n图 8-6\n\n值得注意的是，透镜覆盖层不仅限于侧边栏中的警告和错误。悬停在侧边栏的任何部分都会出现一个透镜，其中包含源文件中该处的代码。\n\
  \n### F – 状态栏 (The Status Bar)\n虽然状态栏实际上是主窗口的一部分而非编辑器，但它包含有关当前活动编辑会话的信息。这些信息包括光标在行和字符方面的当前位置，以及文件的编码格式（UTF-8、ASCII\
  \ 等）。点击状态栏中的这些值可以更改相应的设置。例如，点击行号会显示 `Go to Line`（转到行）对话框。\n\n在提供了构成 Android Studio\
  \ 编辑器的元素概述后，本章的剩余部分将更详细探索编辑环境的关键功能。\n\n## 8.2 分屏编辑器窗口 (Splitting the Editor Window)\n\
  默认情况下，编辑器将显示当前选中文件内容的单个面板。在同时处理多个源文件时，一个特别实用的功能是将编辑器拆分为多个窗格。要拆分编辑器，右键点击编辑器窗口内的文件标签并选择\
  \ `Split Vertically`（垂直拆分）或 `Split Horizontally`（水平拆分）菜单选项。例如，图 8-7 显示了分屏器的用法，编辑器被拆分为三个面板：\n\
  \n![](img/Image2467.jpg)\n\n图 8-7\n\n可以随时通过右键点击相应的标签并选择 `Change Splitter Orientation`（更改拆分方向）菜单选项来更改分屏面板的方向。重复这些步骤可以取消单个面板，此时从菜单中选择\
  \ `Unsplit`。可以通过点击任何标签并选择 `Unsplit All` 移除所有分屏面板。\n\n窗口分屏可显示不同的文件，或为同一文件提供多个窗口，以便同时查看和编辑文件的不同区域。\n\
  \n## 8.3 代码完成 (Code Completion)\nAndroid Studio 编辑器拥有大量的 Java 编程语法和 Android SDK\
  \ 类方法的内置知识，以及对您代码库的了解。在输入代码时，编辑器会扫描输入内容，并在适当的情况下对完成语句或引用所需的内容建议。当编辑器检测到补全建议时，将出现一个包含建议列表的面板。在图\
  \ 8-8 中，编辑器正在为 `String` 声明的开头提供建议：\n\n![](img/Image2477.jpg)\n\n图 8-8\n\n如果自动补全建议都不正确，只需继续输入，编辑器将在适当的情况下继续完善建议。要接受最顶部的建议，只需按下键盘上的\
  \ `Enter` 或 `Tab` 键。要选择不同的建议，使用方向键在列表中上下移动，再次使用 `Enter` 或 `Tab` 键选中高亮项。\n\n\n\n\n\
  可以使用 `Ctrl-Space` 组合键手动调用补全建议。当在编辑器中更改单词或声明时，此功能非常有用。当光标置于编辑器中的某个单词上时，该单词将自动高亮。按下\
  \ `Ctrl-Space` 将显示一个备选建议列表。要将当前单词替换为建议列表中当前高所示的项，只需按下 `Tab` 键即可。\n\n除了实时自动补全功能，Android\
  \ Studio 编辑器还提供了一种名为“智能补全”（Smart Completion）的系统。智能补全通过 `Shift-Ctrl-Space` 组合键调用，选中后，它将根据代码的当前上下文提供更详细的建议。再次按下\
  \ `Shift-Ctrl-Space` 快捷键将从更广泛的可能范围内提供更多建议。\n\n对于许多程序员来说，代码补全可能取决于个人的喜好。考虑到这一事实，Android\
  \ Studio 对自动补全设置提供了高细粒度的控制。可以通过选择 `File -> Settings…`（macOS 上为 `Android Studio ->\
  \ Preferences…`）菜单选项，并在设置面板中选择 `Editor -> General -> Code Completion` 来查看和修改这些设置，如图图\
  \ 8-9 所示：\n\n![](img/as_3.6_code_completion_preferences.jpg)\n图 8-9\n\n## 8.4 语句补全\n\
  \nAndroid Studio 编辑器提供的另一种自动补全形式是语句补全。它可以用于自动填充方法和循环语句等项的括号和大括号。语句补全通过 `Shift-Ctrl-Enter`（macOS\
  \ 上为 `Shift-Cmd-Enter`）组合键调用。考虑以下代码：\n\n```\nmyMethod()\n```\n\n在编辑器中输入此代码后，触发语句补全将导致编辑器自动为该方法添加大括号：\n\
  \n```java\nmyMethod() {\n\n}\n```\n\n## 8.5 参数信息\n\n还可以请求编辑器提供有关方法接受的参数参数的信息。当光标置于方法调用的括号之间时，按下\
  \ `Ctrl-P`（macOS 上为 `Cmd-P`）组合键将显示已知该方法接受的参数，其中最可能的建议将以**粗体**显示：\n\n![](img/Image2491.jpg)\n\
  图 8-10\n\n## 8.6 参数名称提示\n\n代码编辑器可以配置为在方法调用中显示参数名称提示。例如，图 8-11 高亮了 `Snackbar` 类 `make()`\
  \ 和 `setAction()` 方法调用中的参数名称提示：\n\n![](img/Image2499.jpg)\n图 8-11\n\n此模式的设置可以通过选择\
  \ `File -> Settings`（macOS 上为 `Android Studio -> Preferences`）菜单选项，然后在左侧面板中选择 `Editor\
  \ -> Appearance` 来配置。在 Appearance（外观）屏幕上，启用或禁用 `Show parameter name hints` 。要调整提示设置，点击\
  \ `Configure...` 按钮，选择编程语言并进行任何调整。\n\n## 8.7 代码生成\n\n除了在输入时补全代码外，编辑器在某些条件下还可以为您生成代码。如图图\
  \ 8-12 所示的可用代码生成选项列表，当光标位于文件中需要生成代码的位置时，可以使用 `Alt-Insert`（macOS 上为 `Ctrl-N`）快捷键进行访问。\n\
  \n![](img/as_3.4_code_editor_generate.jpg)\n图 8-12\n\n为了演示示例，考虑一种情况：我们希望在项目中的 `Activity`\
  \ 将被操作系统销毁时收到通知。正如本书后续章节将概述的，这可以通过重写 `Activity` 超类的 `onStop()` 周期方法来实现。要让 Android\
  \ Studio 为此生成一个存根方法，只需从代码生成列表中选择 `Override Methods…` 选项，并在生成的可用方法列表中选择 `onStop()`\
  \ 方法：\n\n![](img/as_3.6_override_methods.jpg)\n图 8-13\n\n选择好要重写的方法后，点击 `OK` 将在 Java\
  \ 源文件的当前光标位置生成如下所示的存根方法：\n\n```java\n@Override\nprotected void onStop() {\n    super.onStop();\n\
  }\n```\n\n## 8.8 代码折叠\n\n一旦源代码文件达到一定大小，即使是格式最整齐、组织最良好的代码也可能变得难以处理和导航。Android Studio\
  \ 认为，并不总是需要让每个代码块的内容始终可见。通过使用 Android Studio 编辑器的代码折叠功能，可以使代码导航变得更容易。代码折叠通过出现在源文件每个代码块开头和结尾的编辑器行槽（gutter）中的标记来控制。例如，图\
  \ 8-14 高亮了当前未折叠的方法声明的起始和结束标记：\n\n![](img/as3.2_java_code_folding.jpg)\n图 8-14\n\n\
  点击这些标记中的任一个都会折叠该语句，使仅签名行可见，如图图 8-15 所示：\n\n![](img/Image2533.jpg)\n图 8-15\n\n要展开已折叠的代码段，只需点击编辑器行槽中的\
  \ `+` 标记。要在不展开的情况下查看隐藏的代码，请将鼠标指针悬停在 `{}` 指示器上，如图图 8-16 所示。编辑器将显示包含折叠代码的覆盖层：\n\n\
  ![](img/Image2540.jpg)\n图 8-16\n\n可以使用 `Ctrl-Shift-Plus` 和 `Ctrl-Shift-Minus` 序列折叠或展开文件中的代码块。默认情况下，Android\
  \ Studio 编辑器会在打开源文件时自动折叠代码。要配置发生这种情况条件，选择 `File -> Settings…`（macOS 上为 `Android\
  \ Studio -> Preferences…`）并在设置面板中选择 `Editor -> General -> Code Folding`（图 8-17):\n\
  \n![](img/as_3.6_code_folding_preferences.jpg)\n图 8-17\n\n## 8.9 快速文档查找\n\n可以通过光标置于所需的声明上并按下\
  \ `Ctrl-Q` 快捷键（macOS 上为 `Ctrl-J`）访问上下文相关的 Java 和 Android 文档。这将显示一个包含相关文档的弹出窗口。例如，图\
  \ 8-18 显示 `Snackbar` 类的文档。\n\n![](img/Image2557.jpg)\n图 8-18\n\n显示后，根据需要移动文档弹出窗口。点击标题栏右上角的图钉图标可以确保在焦点移回编辑器后弹出窗口保持可见，以便在编写代码时作为参考。\n\
  \n## 8.10 代码重格式化\n\n通常情况下，Android Studio 编辑器会在添加语句和代码块时自动对缩进、间距和嵌套进行格式化。在需要重新格式化行的情况下（例如从网站复制粘贴示例代码时），编辑器提供了源代码重格式化功能，选中后将自动格式化代码以匹配现的代码样式。\n\
  \n要格式化源代码，按下 `Ctrl-Alt-L`（macOS 上为 `Cmd-Opt-L`）组合键序列。要显示 `Reformat Code` 对话框 (图\
  \ 8-19)，使用 `Ctrl-Alt-Shift-L`（macOS 上为 `Cmd-Opt-Shift-L`）。此对话框提供了仅格式化当前选中的代码、整个编辑器中的活动源文件或仅作为源码控制更新结果而更改的代码的选项。\n\
  \n\n\n\n# 图 8-19\n\n所有的代码风格偏好都可以在项目设置对话框中更改。选择 `File -> Settings` 菜单选项（macOS 上为\
  \ `Android Studio -> Preferences…`），并在左侧面板中选择 `Code Style`，以访问支持的编程和标记语言列表。选择一种语言将提供大量的格式化样式选项，所有选项都可以从\
  \ Android Studio 默认值进行修改，以匹配你偏好的代码风格。例如，要配置上述对话框中 `Rearrange` 代码选项的设置，请先展开 `Code\
  \ Style` 部分，选择 `Java`，然后从 `Java` 设置中选择 `Arrangement` 选项卡。\n\n## 8.11 查找示例代码\n\n\
  Android Studio 编辑器提供了一种方法来访问与代码列表中当前高亮项相关的示例代码。此功能对于学习特定的 Android `class` 或方法如何非常有用。要查找示例代码，可以在编辑器中高亮方法或类名，右键点击它并选择\
  \ `Find Sample Code` 菜单选项。`Find Sample Code` 面板（图 8-20）将出现在编辑器下方，并列出匹配的示例。从列表中选择一个示例将相应的代码加载到右侧面板：\n\
  \n![](img/Image2571.jpg)\n\n图 8-20\n\n## 8.12 Live Templates\n\n在编写 Android 代码时，你会发现有一些经常使用的常用结构。例如，一个常见的需求是通过\
  \ `Toast` 类向用户显示弹出消息。Live templates（实时模板）是常用代码结构的集合，可以通过在编辑器中输入初始字符后按特殊键（默认设置为 `Tab`\
  \ 键）来插入模板代码。要体验这一效果，在代码编辑器中输入 `toast` 然后按 `Tab` 键，Android Studio 将在光标位置插入以下代码并供你编辑：\n\
  \n```\nToast.makeText(, \"\", Toast.LENGTH_SHORT).show()\n```\n\n要列出并编辑现有模板、更改特殊键或添加你自己的模板，请打开\
  \ `Preferences` 对话框，并在左侧导航面板的 `Editor` 部分选择 `Live Templates`：\n\n![](img/as_4.0_live_templates.jpg)\n\
  \n图 8-21\n\n使用上方 图 8-21 中标记为 A 的按钮添加、删除、复制或重置模板。要修改模板，请从列表中选择它 (B) 并更改标记为 C 的面板中的设置。\n\
  \n## 8.13 总结\n\nAndroid Studio 编辑器极力减少编写代码所需的打字量，并使代码更易阅读和导航。在本章中，我们涵盖了许多关键编辑器功能，包括代码补全、代码生成、编辑器窗口拆、代码折叠、重格式化、文档查询和\
  \ live templates。\n\n## 9. Android 架构概述\n\n到目前为止，本书已经采取了步骤来建立一个适用于使用 Android Studio\
  \ 开发 Android 应用的环境。通过创建 Android Studio 应用程序项目，也已经迈出了应用开发过程的第一步。\n\n然而，在深入研究 Android\
  \ 应用开发的实际操作问题之前，理解 Android SDK 以及通用的 Android 开发中一些较为抽象的概念是非常重要的。现在清晰地理解这些概念将为进一步构建知识提供坚实的基础。\n\
  \n从本章对 Android 架构的概述开始，并在本书的接几章中继续，目标是提供 Android 开发基础的详细概述。\n\n## 9.1 Android 软件栈\n\
  \nAndroid 以软件栈的形式结构化，由应用程序、操作系统、运行时环境、中间件、服务和库组成。这种架构或许可以通过图 9-1 所示的视觉方式表示得。栈的每一层以及每层中的相应元素都紧密集成并经过仔细调整，以为移动设备提供最佳的应用开发和执行环境。本章的其余部分将介绍\
  \ Android 栈的不同层，从底部的 `Linux Kernel` 开始。\n\n![](img/Image2438.jpg)\n\n图 9-1\n\n##\
  \ 9.2 Linux 内核\n\n`Linux Kernel` 位于 Android 软件栈底部，在设备硬件和 Android 软件栈上层之间提供了一种抽象。基于\
  \ Linux 版本 `2.6`，内核提供了抢式多任务处理、底层核心系统服务（如内存、进程和电源管理），还为显示器、Wi-Fi 和音频等硬件提供了网络栈和设备驱动程序。\n\
  \n原始的 `Linux kernel` 由 Linus Torvalds 于 1991 年开发，并与 Richard Stallman 在自由软件基金开发的一系列工具、实用程序和编译器相结合，创建了被称为\
  \ `GNU/Linux` 的完整操作系统。各种 Linux 发行版都是从这些基础衍生出来的，如 `Ubuntu` 和 `Red Hat Enterprise\
  \ Linux`。\n\n然而，重要的是，Android 仅使用 `Linux kernel`。尽管如此，值得注意的是，`Linux kernel` 最初是为台式机和服务器形式的传统计算机设计的。事实上，Linux\
  \ 现在最广泛地部署在任务关键型企业服务器环境中。我们发现这种软件位于 Android 软件栈的核心，这既证明了今天移动设备的强大，也证明了 `Linux kernel`\
  \ 的效率和性能。\n\n## 9.3 Android Runtime – ART\n\n当在 Android Studio 中构建 Android 应用时，它会被编译为中间字节码格式（称为\
  \ `DEX` 格式）。当应用程序随后加载到设备上时，Android Runtime (ART) 使用一种称为预编译 (AOT) 的过程将字节码翻译为设备处理器所需的的原生指令。这种格式被称为可执行和可链接格式\
  \ (ELF)。\n\n每当启动应用程序时，都会运行 ELF 版本，从而获得更快的性能和更长的电池寿命。\n\n这与旧版 Android 实现中即时编译 (JIT)\
  \ 方法形成对比，在旧方法中，每次启动应用程序时都会在虚拟机 (VM) 内翻译字节码。\n\n## 9.4 Android 库\n\n除了标准的 Java 开发库（提供字符串处理、网络和文件操作等通用任务的支持）外，Android\
  \ 开发环境还包含 Android 库。这些是特定于 Android 开发的 Java 库。此类库的示例包括应用框架库，以及有助于构建用户界面、图形绘制和数据库访问的库。\n\
  \nAndroid 开发者可用的一些核心 Android 库摘要如下：\n\n- `android.app` – 提供应用模型的访问，是所有 Android 应用程序的基础。\n\
  - `android.content` – 促进应用程序和应用程序组件之间的内容访问、发布和消息。\n- `android.database` – 用于访问由内容提供者发布的数据并包含\
  \ SQLite 数据库管理类。\n- `android.graphics` – 一个底层 2D 图形绘制 API，包括颜色、点、过滤器、矩形和画布。\n- `android.hardware`\
  \ – 提供了一个访问加速度计和光线传感器的硬件 API。\n- `android.opengl` – OpenGL ES 3D 图形渲染 API 的 Java\
  \ 接口。\n\n\n\n\n\n- `android.os` – 为应用程序提供对标准操作系统服务的访问，包括消息、系统服务和进程间通信。\n- `android.media`\
  \ – 提供用于音频和视频播放的类。\n- `android.net` – 一组提供对网络栈访问的 API。包括 `android.net.wifi`，它提供了对设备无线栈的访问。\n\
  - `android.print` – 包含一组类，允许从 Android 应用程序内部将内容发送到配置的打印机。\n- `android.provider`\
  \ – 一组便利类，提供对标准 Android 内容提供数据库的访问，例如由日历和联系人应用程序维护的数据库。\n- `android.text` – 用于在设备显示上渲染和操作文本。\n\
  - `android.util` – 一组工具类，用于执行字符串和数字转换、XML 处理以及日期和时间操作等任务。\n- `android.view` – 应用程序界面的基础构建块。\n\
  - `android.widget` - 丰富的预构建用户界面组件集合，如按钮、标签、列表视图、布局管理器、单选按钮等。\n- `android.webkit`\
  \ – 一组旨在让应用程序内置 Web 浏览能力的类。\n\n在涵盖了 Android 运行时基于 Java 的库之后，现在是将我们转向 Android 软件栈这一层包含的基于\
  \ C/C++ 的库。\n\n### 9.4.1 C/C++ 库\n\n在前节概述的 Android 运行时核心库是基于 Java 的，为编写 Android\
  \ 应用程序的开发者提供了主要的 API。然而，重要的是，核心库并没有执行许多实际工作，事实上，它们本质上是对一组基于 C/C++ 的库的 Java “封装”（wrapper）。例如，在调用\
  \ `android.opengl` 库在设备显示器上绘制 3D 图形时，该库最终实际上调用了 `OpenGL ES` C++ 库，而后者又与底层的 Linux\
  \ 内核协作执行绘图任务。\n\n包含 C/C++ 库是为了实现广泛多样的功能，包括 2D 和 3D 图形绘制、安全套接层 (SSL) 通信、SQLite 数据库管理、音频视频播放、位图和矢量字体渲染、显示子系统和图形层管理以及标准\
  \ C 库 (`libc`) 的实现。\n\n在实践中，典型的 Android 应用程序开发者将仅通过基于 Java 的 Android 核心库 API 访问这些库。在需要直接访问这些库的情况下，可以使用\
  \ Android Native 开发包 (NDK) 实现，其目的是通过 Java Native Interface (JNI) 从 Java 代码中调用非 Java\
  \ 或 Kotlin 编程语言（如 C 和 C++）的原生方法。\n\n## 9.5 应用程序框架\n\n应用程序框架是一组服务，共同构成了 Android 应用程序运行和管理的环境。该框架实现了这样一个概念：Android\
  \ 应用程序是由可重用、可交换和可替换的组件构建的。这一概念更进一步，即应用程序还可以发布其功能以及任何相关数据，以便其他应用程序发现并重用。\n\nAndroid\
  \ 框架包括以下关键服务：\n\n- `Activity Manager` – 控制应用程序生命周期的所有方面和活动堆栈。\n- `Content Providers`\
  \ – 允许应用程序发布并与其他应用程序共享数据。\n- `Resource Manager` – 提供对非代码嵌入资源的访问，如字符串、颜色设置和用户界面布局。\n\
  - `Notifications Manager` – 允许应用程序向用户显示警报和通知。\n- `View System` – 一组可扩展的视图，用于创建应用程序用户界面。\n\
  - `Package Manager` – 应用程序借此系统可以获取设备上当前安装的其他应用程序的信息。\n- `Telephony Manager` – 为应用程序提供有关设备上可用电话服务的信息，如状态和订阅者信息。\n\
  - `Location Manager` – 提供对位置服务的访问，允许应用程序接收位置更改的更新。\n\n## 9.6 应用程序\n\n位于 Android\
  \ 软件栈顶端的是应用程序。这些包含了由特定 Android 实现提供的原生应用程序（例如网络浏览器和电子邮件应用程序）以及用户在购买设备后安装的第三方应用程序。\n\
  \n## 9.7 总结\n\n良好的 Android 开发知识基础需要理解 Android 的整体架构。Android 以软件栈架构的形式实现，由 Linux\
  \ 内核、运行时环境及相应的库、应用程序框架和一组应用程序组成。应用程序主要用 Java 或 Kotlin 编写，并在 Android Studio 构建环境中编译为字节码格式。当应用程序随后安装在设备上时，这些字节码将由\
  \ Android 运行时 (ART) 编译为 CPU 使用的本地 格式。Android 架构的关键目标是性能和效率，这既体现在应用程序执行中，也体现在应用程序设计的重用实现中。\n\
  \n## 10. Android 应用程序的剖析\n\n无论你之前的编程经验是基于 Windows、macOS、Linux 甚至 iOS，Android 开发很有可能与你以前遇到过的任何东西都不同。\n\
  \n因此，本章的目标是提供对 Android 应用程序架构背后的高级概念的理解。在此，我们将详细探索用于构建应用程序的各种组件，以及允许这些组件协作以创建一个内贯应用程序的机制。\n\
  \n### 10.1 Android Activity\n\n熟悉 Java、Kotlin、C++ 或 C# 等面向对象编程语言的人会熟悉将应用程序功能元素封装在类中的概念，然后将类实例化为对象并进行操作以创建应用程序。由于\
  \ Android 应用程序是用 Java 和 Kotlin 编写的，这仍然非常适用。然而，Android 还进一步将可重用组件的概念提升到了更高的水平。\n\n\
  Android 应用程序是通过汇集一个或多个被称为 `Activities`（活动）的组件创建的。Activity 是一个独立的应用程序功能模块，通常直接对应于单个用户界面屏幕及其相应的功能。例如，一个预约应用程序可能会有一个\
  \ Activity 屏幕，显示当天设置的预约。该应用程序还可能使用第二个 Activity，该 Activity 由一个用户可以在其中输入新预约的屏幕组成。\n\
  \nActivity 的设计旨在作为完全可重用和可交换的构建块，可以在不同的应用程序之间共享。例如，一个现有的电子邮件应用程序可能包含一个专门用于编写和发送电子邮件消息的\
  \ Activity。开发者可能正在编写一个同样具有发送电子邮件消息要求的应用程序。开发者无需为新应用程序专门开发一个电子邮件编写 Activity，只需直接使用现有电子邮件应用程序中的\
  \ Activity 即可。\n\n\n\n\n\nActivity（活动）是作为 `Activity` 类的子类创建的，并且必须实现为与应用程序中的其他活动完全独立。换句话说，共享的活动不能依赖于在程序流的已知点被调用（因为其他应用程序可能会以意想不到的方式使用该活动），而且一个活动不能直接调用另一个活动的方法或访问其实例数据。相反，这种功能是通过`Intents`意图）和`Content\
  \ Providers`内容提供者）来实现的。\n\n默认情况下，活动无法向调用它的活动返回结果。如果需要此功能，则必须将该活动作为源活动的子活动专门地启动。\n\
  \n## 10.2 Android Fragments（片段）\n\n如上所述，Activity 通常代表应用中的一个单个用户界面屏幕。一种方案是使用单个用户界面布局和一个相应的活动类文件来构建该活动。然而，更好的替代方案是将活动\
  \ 拆分为不同的部分。这些部分中的每一个都被称为一个 `fragment`（片段），每个片段由用户界面布局的一部分和一个匹配的类文件组成（声明为 Android\
  \ `Fragment` 类的子类）。在这种情况下，Activity 仅仅变成了一个容器，一个或多个片段被嵌入其中。\n\n事实上，片段为每个用户界面屏幕由单独的活动表示提供了一种高效的替代方案。相反，一个应用可以由单个活动组成，在不同的片段之间切换，每个片段代表不同的应用屏幕。\n\
  \n## 10.3 Android Intents（Android 意图）\n\n`Intents`（意图）是通过这种机制，一个活动能够启动另一个活动，并实现构成应用程序的活动之间的流。`Intents`\
  \ 由对要执行的操作的描述以及可选的在该操作上执行的数据组成。\n\n`Intents` 可以是显式的（explicit），即通过通过类名引用活动来请求启动特定活动；也可以是隐式的（implicit），即通过说明要执行的操作类型或提供在该操作上执行的特定类型的数据。在隐式意图的情况下，Android\
  \ 运行时将使用一种称为 Intent Resolution（意图解析）的过程，选择最符合 `Intent` 指定准的活动进行启动。\n\n## 10.4 Broadcast\
  \ Intents（广播意图）\n\n另一种类型的 `Intent` 称为 `Broadcast Intent`（广播意图），它是一种系统范围的意图，发送给所有注册了“感兴趣”的\
  \ `Broadcast Receiver`（广播接收器）的应用程序。例如，Android 系统通常会发送 `Broadcast Intents` 以指示设备状态的变化，例如系统启动完成、外部电源连接到设备或屏幕的开启或关闭。\n\
  \n`Broadcast Intent` 可以是普通的（异步的），因为它是几乎在相同的时间内发送给所有感兴趣的 `Broadcast Receivers` 的；也可以是有序的（ordered），因为它是一次发送给一个接收器的，接收器可以对其进行处理，然后将其中止或允许传递给下一个\
  \ `Broadcast Receiver`。\n\n## 10.5 Broadcast Receivers（广播接收器）\n\n`Broadcast Receivers`（广播接收器）是应用程序响应\
  \ `Broadcast Intents` 的机制。`Broadcast Receiver` 必须由应用程序注册，并配置一个 `Intent Filter`（意图过滤器）以指示其感兴趣的广播类型。当一个匹配的意图被广播时，无论注册接收器的应用程序当前是否正在运行，Android\
  \ 运行时都会调用该接收器。接收器随后有 5 秒钟的时间来完成对其要求的任何任务（例如启动 `Service`、进行数据更新或向用户发出通知），然后返回。`Broadcast\
  \ Receivers` 在后台运行，并且没有用户界面。\n\n## 10.6 Android Services（Android 服务）\n\n`Android\
  \ Services` 是在后台运行的进程，没有用户界面。它们可以从活动、`Broadcast Receivers` 或其他 `Services` 启动并随后管理。`Android\
  \ Services` 适用于应用程序需要继续执行任务但不一定需要向用户可见的用户界面的情况。虽然 `Services` 缺乏用户界面，但它们仍然可以使用通知和吐司（在屏幕上显示但不中断当前可见活动的小型通知消息）来通知用户事件，并且能够发出\
  \ `Intents`。\n\nAndroid 运行时赋予了 `Services` 比许多其他进程更高的优先级，系统只有在为了释放资源而作为最后手段时，才会将其终止。然而，如果运行时确实需要杀死一个\
  \ `Service`，一旦再次获得足够的资源，它将自动重启。`Service` 可以通过将其声明为需要在前台运行来降低被终止的风险。这是通过调用 `startForeground()`\
  \ 实现的。这仅建议用于终止会对用户体验产生不利的情况（例如，如果用户正在听由 `Service` 传输的音频）。\n\n`Service` 可能作为实际解决方案的示例情况包括，如之前提到的，当应用程序不再活动时应继续的音频流，或者在股票达到指定价格时需要通知用户的股票市场跟踪应用程序。\n\
  \n## 10.7 Content Providers（内容提供者）\n\n`Content Providers`（内容提供者）实现了一种在应用程序之间共享数据的机制。任何应用程序都可以通过实现\
  \ `Content Provider` 为其他应用程序提供对其底层数据的访问，包括添加、删除和查询数据的能力（取决于权限）。对数据的访问通过 `Content\
  \ Provider` 定义的通用资源标识符 (`URI`）提供。数据可以以文件或整个 SQLite 数据库的形式共享。\n\n原生 Android 应用程序包含许多标准的\
  \ `Content Providers`，允许应用程序访问联系人和媒体文件等数据。Android 系统上当前可用的 `Content Providers` 可以使用\
  \ `Content Resolver`（内容解析器）进行定位。\n\n## 10.8 The Application Manifest（应用清单）\n\n将构成应用程序的各种元素结合在一起的胶水是\
  \ `Application Manifest`（应用清单）文件。在这个基于 XML 的文件中，应用程序概述了构成完整应用的活动、服务、广播接收器、数据提供和权限。\n\
  \n## 10.9 Application Resources（应用资源）\n\n除了清单文件和包含字节的 Dex 文件外，Android 包通常还会包含一组资源文件。这些文件包含了显示在界面上的字符串、图像、字体和颜色，以及用户界面布局的\
  \ XML 表示。默认情况下，这些文件存储在应用程序项目层次结构的 `/res` 子目录中。\n\n## 10.10 Application Context（应用上下文）\n\
  \n当应用程序编译时，会创建一个名为 `R` 的类，其中包含应用程序资源的引用。应用清单文件和这些资源结合产生 `Application Context`（应用上下文）。该上下文由\
  \ Android `Context` 类表示，可以在应用程序代码中使用以在运行时访问应用程序资源。此外，可以在上下文上调用广泛的方法来收集信息并在运行时更改应用程序的环境。\n\
  \n## 10.11 Summary（总结）\n\n可以通过组合不同的元素来创建一个 Android 应用程序。在本章中，我们提供了 Activities、Fragments、Services、Intents\
  \ 和 Broadcast Receivers 的高级概述，以及对清单文件和应用资源的概述。\n\n\n\n\n通过创建以活动（activities）和意图（intents）形式存在的独立功能模块，促进了最大的重用性和操作性，而应用程序之间的数据共享则通过实现内容提供者（content\
  \ providers）来实现。\n\n专注于用户与应用程序交互的区域（活动本质上等同于单个用户界面屏幕，通常由一个或多个片段 fragments 组成），而后台处理通常由\
  \ `Services` 和广播接收器（Broadcast Receivers）处理。\n\n构成应用程序的组件在清单文件中为 Android 系统概述，该文件结合应用程序的资源代表了应用程序的上下文（context）。\n\
  \n本章介绍了许多对普通开发者来说可能是新的内容。不过请放心，在后续章节中将对这些概念进行深入探索和实际应用，以确保为构建自己的应用程序打下坚实的知识基础。\n\
  \n# 11. Android 视图绑定（View Binding）概述\n\n开发 Android 应用的一个重要部分是代码与构成用户界面布局的视图之间的交互。本章将介绍在代码中访问布局视图的可用选项，特别是\
  \ Android Studio 3.6 引入的名为 `view binding` 的选项。在介绍视图绑定的基础之后，本章将概述将 `AndroidSample`\
  \ 项目转换为使用此方法所需的更改。\n\n## 11.1 通过 ID 查找视图\n\n正如“Android 应用程序结构”章节中概述的那样，构成应用程序的所有资源都被编译成一个名为\
  \ `R` 的类。这些资源中包含了定义布局的资源。`R` 类中有一个名为 `layout` 的子类，它包含了布局资源，包括构成用户界面的视图。大多数应用程序都需要实现代码与这些视图之间的交互，例如当读取在\
  \ `EditText` 视图中输入的值或更改在 `TextView` 上显示的内容时。\n\n在 Android Studio 3.6 引入之前，从应用代码内部访问视图唯一选项是编写代码通过名为\
  \ `findViewById()` 的方法根据其 id 手动查找视图。例如：\n\n```\nTextView exampleView = findViewById(R.id.exampleView);\n\
  ```\n\n获取引用后，就可以访问视图的属性。例如：\n\n```\nexampleView.setText(\"Hello\");\n```\n\n虽然通过\
  \ ID 查找视图仍然是一个可行的选项，但它具有一些局限性，`findViewById()` 最大的缺点可能是获取到布局中尚未创建的视图的引用，从而在尝试访问视图属性时导致空指针异常。\n\
  \n自 Android Studio 3.6 以来，已经以 `view bindings` 的形式提供了从应用代码访问视图的替代方法。\n\n## 11.2 视图绑定\n\
  \n当应用模块中启用视图绑定时，Android Studio 会自动为模块中的每个布局文件生成一个绑定类（binding class）。使用此绑定类，可以在代码内部访问布局视图，而无需使用\
  \ `findViewById()`。\n\nAndroid Studio 生成的绑定类的名称基于将布局文件名转换为所谓的“驼峰命名”，并在末尾附加单词“Binding”。例如，对于\
  \ `activity_main.xml` 文件，绑定类将命名为 `ActivityMainBinding`。\n\n在项目模块中使用视图绑定的过程可以总结如下：\n\
  \n1. 为任何需要支持的项目模块启用视图绑定。\n2. 编辑代码以导入自动生成的视图绑定类。\n3. 膨胀（Inflate）绑定类以获取绑定的引用。\n4.\
  \ 访问绑定中的根视图并使用它指定用户界面的内容视图。\n5. 作为绑定对象的属性通过名称访问视图。\n\n## 11.3 转换 AndroidSample 项目\n\
  \n本章的剩余部分将通过将 `AndroidSample` 项目转换为使用视图绑定而不是使用 `findViewById()` 来演示视图绑定的使用。\n\n\
  首先启动 Android Studio 并打开在在 Android Studio 中创建示例 Android 应用”章节中创建的 `AndroidSample`\
  \ 项目。\n\n## 11.4 启用视图绑定\n\n从 Android Studio 4.0 开始，视图绑定默认未启用。因此，要使用视图绑定，必须对需要视图绑定的模块的\
  \ `build.gradle` 文件进行一些更改。对于 `AndroidSample` 项目，这将需要更改 `Gradle Scripts -> build.gradle\
  \ (Module: AndroidSample.app)` 文件。首先，必须在文件的 `android` 部分中启用 `viewBinding` 属性：\n\n\
  ```\nandroid {\n    buildFeatures {\n        viewBinding = true\n    }\n}\n```\n\
  \n一旦执行了这些更改，使用 Build 菜单清理（clean）然后重新构建（rebuild）项目，以确保生成绑定类。下一步是在代码中使用绑定类。\n\n##\
  \ 11.5 使用视图绑定\n\n此过程的第一步是“膨胀”视图绑定类，以便我们可以访问布局中的根视图。该根视图将被用作布局的内容视图。\n\n执行这些任务的逻辑位置是在与布局相关的活动的\
  \ `onCreate()` 方法中。一个典型的 `onCreate()` 方法如下：\n\n```java\n@Override\nprotected void\
  \ onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    setContentView(R.layout.activity_main);\n}\n```\n\n要切换到使用视图绑定，需要导入视图绑定类并按如下方式修改类。注意，由于布局文件名为\
  \ `activity_main.xml`，我们可以推断 Android Studio 生成的绑定类将是 `ActivityMainBinding`。注意，如果你在创建项目时使用了\
  \ `com.example` 的域，则下面的导入语句需要更改以反映：\n\n```java\nimport android.widget.EditText;\n\
  import android.widget.TextView;\nimport com.ebookzy.androidsample.databinding.ActivityMainBinding;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private ActivityMainBinding\
  \ binding;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \        binding = ActivityMainBinding.inflate(getLayoutInflater());\n        View\
  \ view = binding.getRoot();\n        setContentView(view);\n    }\n\n// 现在我们有了绑定的引用，可以如下方式通过名称访问视图：\n\
  \npublic void convertCurrency(View view) {\n    EditText dollarText = findViewById(R.id.dollarText);\n\
  \    TextView textView = findViewById(R.id.textView);\n    if (!binding.dollarText.getText().toString().equals(\"\
  \")) {\n        Float dollarValue = Float.valueOf(binding.dollarText.getText().toString());\n\
  \        Float euroValue = dollarValue * 0.85F;\n        binding.textView.setText(euroValue.toString());\n\
  \    } else {\n        binding.textView.setText(R.string.no_value_string);\n   \
  \ }\n}\n```编译并运行应用程序，验证货币转换仍然像以前一样工作。\n\n## 11.6 选择选项\n\n视图绑定的引入并没有使之前的选项失效，在可可见的未来都会继续被广泛支持。但在避免空指针异常方面，与使用\
  \ `findViewById()` 方法相比，视图绑定显然是更安全的选项。因此，开发自己的项目时，应该使用视图绑定。\n\n\n\n关于书中的示例，需要注意的是，在\
  \ Android Studio 4.1 中，视图绑定（view bindings）并不是默认开启的。遗憾的是，如果要在书中的示例中使用视图绑定，则需要手动重复本章中对\
  \ `build.gradle` 和 `onCreate()` 方法的每次修改 50 多次。仅就此一点，书中的示例将继续使用 `findViewById()`。\n\
  \n尽管如此，如果你想这样做，完全没有理由不按照本章的步骤，将书中的示例适配为使用视图绑定。事实上，我们鼓励你至少将书中的几个教程转换为使用视图绑定，以此作为练习来熟悉熟悉这些概念。\n\
  \n## 11.7 总结\n\n在 Android Studio 3.6 引入之前，从应用代码内部访问布局视图（layout views）需要使用 `findViewById()`\
  \ 方法。现在有了视图绑定（view bindings）这一替代方案。视图绑定由 Android Studio 为每个 XML 布局文件自动生成的类组成。这些类包含了对对应布局中每个视图的绑定，提供了比\
  \ `findViewById()` 方法更高的选项。然而，从 Android Studio 3.6 开始，视图绑定并不是默认开启的，需要额外的步骤来在每个项目模块中手动启用和配置支持。\n\
  \n# 12 理解 Android 应用和 Activity 生命周期\n\n在较早的章节中，我们已经了解到 Android 应用运行在进程中，并且它们由活动（activities）、服务（services）和广播接收器（broadcast\
  \ receivers）等多个组件组成。本章的目标是通过查看 Android 运行时系统中应用和活动的生命周期来扩展这些知识。\n\n无论对于如今移动设备与过去的桌面系统相比拥有多少内存和计算能力有如何渲染，请记住，根据现代桌面和笔记本电脑系统的标准，这些设备仍被认为是“资源受限的”，特别是在内存方面。因此，Android\
  \ 系统的一项关键职责是确保这些有限资源得到有效管理，并确保操作系统和运行其上的应用程序始终对用户保持响应。为了实现这一目标，Android 对运行应用的进程以及组成这些应用的各个组件的生命周期和状态拥有完全控制权。\n\
  \n因此，开发 Android 应用的一个重要因素是理解 Android 的应用和 Activity 生命周期周期管理模型，以及应用程序在执行生命周期内对可能发生的状态变化反应的方式。\n\
  \n## 12.1 Android 应用与资源管理\n\n每个运行的 Android 应用都被操作系统视为一个独立的进程。如果系统识别出设备上的资源达到容量，它将采取措施终止进程以释放内存。\n\
  \n在决定终止哪个进程以释放内存时，系统会同时考虑所有当前运行进程的优先级和状态，结合这些因素创建 Google 所说的的“重要性层次结构”（importance\
  \ hierarchy）。进程将从最低优先级开始终止，按层级向上移动，直到释放出足够的资源供系统运行。\n\n## 12.2 Android 进程状态\n\n\
  进程宿载应用程序，而应用程序由组件组成。在 Android 系统中，进程的当前状态由其所宿载的应用中排名最高的活动组件定义。如图 12-1 所示，进程在任何时刻都可以处于以下五种状态之一：\n\
  \n![android_process_priorities.png](img/Image24381.jpg)\n\n图 12-1\n\n### 12.2.1\
  \ 前台进程\n\n这些进程被赋予了最高级别的优先级。在任何时刻，活跃的前台进程可能只有一个或两个，而且这些通常是系统最后终止的进程。进程必须满足以下一个或多个标准才能获得前台状态：\n\
  \n* 宿载用户当前正在交互的活动。\n* 宿载与用户正在交互的活动连接的服务（Service）。\n* 宿载一个通过调用 `startForeground()`\
  \ 指明终止会破坏用户体验的服务。\n* 宿载一个正在执行其 `onCreate()`、`onResume()` 或 `onStart()` 回调函数的服务。\n\
  * 宿载一个当前正在执行其 `onReceive()` 方法的广播接收器。\n\n### 12.2.2 可见进程\n\n包含一个对用户可见但不是用户正在交互的活动的进程被归类为“可见进程”（visible\
  \ process）。这通常发生在进程中的某个活动对用户可见，但另一个活动（如部分屏幕或对话框）处于前台时。如果一个进程宿载的某个 Service 本身绑定到可见或前台活动上，那么该进程也有资格获得可见状态。\n\
  \n### 12.2.3 服务进程\n\n包含已经启动且正在执行的服务的进程。\n\n### 12.2.4 后台进程\n\n包含一个或多个当前对用户不可见的活动，且没有宿载符合服务进程状态的服务的进程。属于此类别的进程在需要为更高优先级进程释放额外内存时，面临极高的终止风险。Android\
  \ 维护了一个后台进程的动态列表，按时间顺序终止进程，因此最久未处于前台的进程会被首先杀死。\n\n### 12.2.5 空进程\n\n空进程不再包含任何活跃的应用，并保留在内存中，准备作为新启动应用程序的宿主。这在某种程度上类似于为了等待乘客到达而保持巴士车门开启且引擎运转。此类进程显然被认为是优先级最低，是释放资源时最先杀死的。\n\
  \n## 12.3 进程间依赖关系\n\n确定最高优先级进程的情况比上一节概述的要复杂一些，其简单原因是进程之间往往是相互依赖的。因此，在确定进程的优先级时，Android\
  \ 系统还会考虑该进程是否以某种方式为另一个高优先级进程服务（例如，作为前台进程的内容提供者的服务进程）。作为一个基本规则，Android 文档说明一个进程的优先级永远不会低于它正在服务的另一个进程。\n\
  \n## 12.4 Activity 生命周期\n\n正如我们之前确定的，Android 进程的状态在很大程度上取决于其宿载的活动和组件的状态。因此，理解这些活动在应用程序执行生命周期内也会经历不同的状态是非常重要的。活动的当前状态在部分取决于它在被称为“活动栈”（Activity\
  \ Stack）中的位置。\n\n## 12.5 活动栈\n\n\n\n\n\n对于运行在 Android 设备上的每个应用程序，运行时系统都维护着一个 `Activity\
  \ Stack`（Activity 栈）。当应用程序启动时，首先启动的应用程序活动会被放入栈中。当启动第二个活动时，它会被放置在栈顶，而之前的活动则会被推到栈下方。位于栈顶的活动被称为活跃活动（或正在运行的活动）。当活跃活动退出时，运行时系统会会将其从栈中弹出，位于栈中紧邻其下方的活动将成为当前的活跃活动。例如，栈顶的活动可能因为其所负责的任务已完成而简单地退出。或者，用户可能选择了屏幕上的“返回”按钮以返回上一个活动，这会导致当前活动被运行时系统从栈中弹出并被销毁。Android\
  \ `Activity Stack` 的视觉化表示如图图 12-2 所示。\n\n如图所示，新活动在启动时会被推到栈顶。当前的活跃活动一直位于栈顶，直到它被新活动推到栈的后续位置，或者在它退出或用户导航到上一个活动时被从栈中弹出。在资源受限的情况下，运行时将杀死活动，从栈底开始。\n\
  \n`Activity Stack` 就是编程术语中所谓的“后进先出”（LIFO）栈，因为最后一个被推入栈的项是第一个被弹出的项。\n\n![android_activity_lifecycle_diagram.png](img/Image2447.jpg)\n\
  \n图 12-2\n\n## 12.6 Activity 状态\n\n在应用程序内部的执行过程中，活动可以处于以下若干不同状态之一：\n\n*   **活跃 /\
  \ 正在运行（Active / Running）** – 该活动位于 `Activity Stack` 栈顶，是设备屏幕上可见的前台任务，拥有焦点并且当前正在与用户交互。在资源短缺的情况下，这种活动被终止的概率最低。\n\
  *   **已暂停（Paused）** – 该活动对用户可见，但目前没有焦点（通常是因为该活动被当前的活跃活动部分遮挡）。已暂停的活动保留在内存中，仍与窗口管理器保持连接，保留所有的状态信息，并在移动到\
  \ `Activity Stack` 栈顶时可以快速地恢复到活跃状态。\n*   **已停止（Stopped）** – 该活动目前对用户不可见（换句话说，它在设备显示上被其他活动完全遮挡）。与已暂停的活动一样，它保留所有的状态和成员信息，但在低内存情况下被终止的风险更高。\n\
  *   **已杀死（Killed）** – 该活动已被运行时系统终止以释放内存，不再存在于 `Activity Stack` 中。如果应用程序需要，必须重新启动此类活动。\n\
  \n## 12.7 配置更改（Configuration Changes）\n\n在本章之前，我们已经了导致 Android 活动状态变化的两种原因，即活动在以前台和后台之间的移动，以及运行时系统为了释放内存而对活动进行的终止。事实上，还有第三种情况会导致活动状态发生剧烈变化，这涉及到设备配置的更改。\n\
  \n默认情况下，任何影响活动外观的配置更改（例如在竖屏和横屏模式之间旋转设备方向，或更改系统字体设置）都会导致活动被销毁并重建。这背后的原因是此类更改会影响如用户界面布局等资源，而简单地销毁并重建受影响的活动是活动响应配置更改最快的方法。然而，也可以配置活动，使其不会因响应特定的配置更改而被系统重启。\n\
  \n## 12.8 处理状态变化\n\n即便没有其他，本章也应该让人明确：应用程序以及根据定义，其内部组件会发生状态变化。\n\n\n\n\n本章的主要目的是提供关于活动如何接收状态更改通知的高级概述，并概述建议保存或恢复状态信息的区域。在介绍这些信息后，本章将简要介绍活动生命周期（lifetimes）的主题。\n\
  \n## 13.1 新旧生命周期技术\n\n直到最近，在应用中构建生命周期感知能力有一种标准方法。这就是本章所涵盖的方法，它涉及在 `activity` 或 `fragment`\
  \ 实例中实现一组方法（每个生命周期状态对应一个方法），这些方法会在对象的生命周期状态改变时由操作系统调用。这种方法自 Android 操作系统早期以来一直没有变化，虽然它在今天仍然是一个可行方案，但它确实存在一些局限性，这些局限性将在本章稍后部分进行解释。\n\
  \n随着 `Jetpack` Android 架构组件引入了生命周期类，现在已经有了更好的生命周期处理方法。这种现代的生命周期管理方法（结合 `Jetpack`\
  \ 组件和架构指南）将在后面的章节中进行详细介绍。然而，出于几个原因，理解传统的生命周期方法仍然很重要。首先，作为一名 Android 开发者，你无法完全隔离开传统的生命周期方法，并且仍然会使用其中一些。更重要的是，理解处理生命周期的旧方法将为你提供良好的知识基础，以便在书的后部分开始学习新方法。\n\
  \n## 13.2 Activity 和 Fragment 类\n\n除少数例外外，应用程序中的活动（activities）和碎片（fragments）分别创建为\
  \ Android `AppCompatActivity` 类和 `Fragment` 类的子类。\n\n例如，考虑在“在 Android Studio 中创建\
  \ Android 应用”中创建的 `AndroidSample` 项目。将此项目加载到 Android Studio 环境中并找到 `MainActivity.java`\
  \ 文件（位于 `app -> java -> com.<your domain>.androidsample`）。找到文件后，双击它将其加载到编辑器中，其内容如下：\n\
  \n```java\npackage com.ebookfrenzy.androidsample;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  \nimport android.os.Bundle;\n\nimport android.view.View;\n\nimport android.widget.EditText;\n\
  \nimport android.widget.TextView;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n\
  \        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \    }\n\n    public void convertCurrency(View view) {\n        EditText dollarText\
  \ = findViewById(R.id.dollarText);\n        TextView textView = findViewById(R.id.textView);\n\
  \        if (!dollarText.getText().toString().equals(\"\")) {\n            Float\
  \ dollarValue = Float.valueOf(dollarText.getText().toString());\n            Float\
  \ euroValue = dollarValue * 0.85F;\n            textView.setText(euroValue.toString());\n\
  \        } else {\n            textView.setText(R.string.no_value_string);\n   \
  \     }\n    }\n}\n```\n\n在创建项目时，我们指示 Android Studio 同时也创建一个名为 `MainActivity` 的初始活动。如上述代码所示，`MainActivity`\
  \ 类是 `AppCompatActivity` 类的子类。\n\n查看 `AppCompatActivity` 类的参考文档可以发现它本身也是 `Activity`\
  \ 类的子类。可以在 Android Studio 编辑器中使用层次结构（Hierarchy）工具窗口来验证这一点。当 `MainActivity.java`\
  \ 文件加载到编辑器中时，点击类声明行中的 `AppCompatActivity` 并按下快捷键 `Ctrl-H`。随后将出现层次结构窗口，显示所选类的类层次结构。如图图\
  \ 13-1 所示，`AppCompatActivity` 继承自 `FragmentActivity` 类，而 `FragmentActivity` 最终也是\
  \ `Activity` 类的子类：\n\n![](img/as_3.6_class_heirachy.jpg)\n\n图 13-1\n\n`Activity`\
  \ 和 `Fragment` 类包含了一系列方法，旨在由 Android 运行时调用，以便在对象状态更改时通知该对象。为了本章，我们将这些方法称为生命周期方法。`activity`\
  \ 或 `fragment` 类只需要重写这些方法并在其中实现必要的功能，以便对状态更改做出相应响应。\n\n其中一个方法命名为 `onCreate()`，再次回到上面的代码片段，我们可以该方法在\
  \ `MainActivity` 类中已经为我们重写并实现。在稍后的章节中，我们将详细探索 `onCreate()` 以及 `Activity` 和 `Fragment`\
  \ 类的其他相关生命周期方法。\n\n## 13.3 动态状态 vs. 持久化状态\n\n生命周期管理的一个目标是确保 `activity` 的状态在适当的时间被保存和恢复。当我们在此语境下讨论状态时，我们指的是当前活动中持的数据以及用户界面的显示。例如，活动可能会维护一个需要保存到数据库或文件的数据模型。这种状态信息因为在应用程序的多次调用之间持续，因此被称为**持久化状态**（persistent\
  \ state）。\n\n用户界面的显示（例如输入到字段中但尚未提交到数据模型的文本）被称为**动态状态**（dynamic state），因为它通常在应用程序的单次调用期间保留（也称为用户界面状态或实例状态）。理解这两种状态之间的区别很重要，因为它们的保存方式以及保存的原因都不同。\n\
  \n保存持久化状态的目的是避免活动在后台被杀死时可能导致的数据丢失。另一方面，动态状态的保存和恢复的原因稍微复杂。\n\n例如，假设应用程序包含一个活动（我们称之为\
  \ `Activity A`），其中包含一个文本框和一些单选按钮。在使用应用程序期间，用户在文本框中输入了文本并从单选按钮中进行了选择。然而，在执行保存更改的操作之前，用户切换到了另一个活动，导致\
  \ `Activity A` 推入活动栈并进入后台。一段时间后，运行时系统确定内存不足，因此杀死 `Activity A` 以释放资源。但对于用户来说，`Activity\
  \ A` 只是进入了后台，并随时随时返回前台。当 `Activity A` 回到前台时，用户理所当然地预期输入的文本和单选按钮的选择已被保留。然而在这种情况下，将创建一个\
  \ `Activity A` 的新实例，如果动态状态没有被保存和恢复，之前的用户输入将会丢失。\n\n因此，保存动态状态的主要目的是提供一种在前台和后台活动之间无缝切换的感知，无论活动实际上是否在用户不知情的情况下杀死并重启。\n\
  \n保存持久化和动态状态的机制将在本章后续章节中变得更加清晰。\n\n## 13.4 Android 生命周期方法\n\n正如前面提到的，`Activity`\
  \ 和 `Fragment` 类包含许多生命周期方法，它们在实例状态更改时作为事件处理器。Android `Activity` 和 `Fragment` 类支持的主要方法如下：\n\
  \n\n\n\n\n## Activity 生命周期方法\n\n- `onCreate(Bundle savedInstanceState)` – 在 activity\
  \ 首次创建时调用的方法，是执行大多数初始化任务的理想位置。该方法接收一个 `Bundle` 对象的形式的参数，该对象可能包含来自 activity 之前调用的动态状态信息（通常与用户界面状态有关）。\n\
  - `onRestart()` – 在 activity 在被运行时系统停止后准备重新启动时调用。\n- `onStart()` – 通常在调用 `onCreate()`\
  \ 或 `onRestart()` 方法后立即被调用，此方法通知 activity 它即将对用户可见。如果 activity 移动到 activity 栈的顶端，则此调用将随后调用\
  \ `onResume()`；如果它被另一个 activity 推入栈底端，则将调用 `onStop()`。\n- `onResume()` – 表示 activity\
  \ 现在处于 activity 栈的顶端，并且是用户当前正在交互的 activity。\n- `onPause()` – 表示上一个 activity 即将成为前台\
  \ activity。此调用将随后调用 `onResume()` 或 `onStop()` 方法，取决于 activity 是返回前台还是对用户不可见。在此方法中可以采取措施存储尚未被应用保存的持久化状态信息。为了避免切换\
  \ activity 之间的延迟，应避免在此方法中执行耗时操作，如将数据存储到数据库或执行网络操作。此方法还应该停止任何 CPU 密集型任务（如动画）。\n-\
  \ `onStop()` – activity 现在对用户不再可见。此之后有两种可能：如果 activity 再次移动前台，则调用 `onRestart()`；如果\
  \ activity 将被终止，则调用 `onDestroy()`。\n- `onDestroy()` – activity 即将被销毁，可能是因为 activity\
  \ 完成了任务并调用了 `finish()` 方法，也可能是因为运行时为了释放内存或由于配置更改（如设备方向改变）而终止它。需要注意的是，当 activity\
  \ 终止时并不总是会调用 `onDestroy()`。\n- `onConfigurationChanged()` – 当发生配置更改且 activity 指明其不需要重启时调用。该方法接收一个\
  \ `Configuration` 对象，该对象概述了新的设备配置，然后由 activity 负责对更改做出响应。\n\n### Fragment 生命周期方法\n\
  \n以下生命周期方法仅适用于 `Fragment` 类：\n\n- `onAttach()` - 当 fragment 分配给 activity 时调用。\n\
  - `onCreateView()` - 用于创建并返回 fragment 的用户界面布局层级结构。\n- `onActivityCreated()` - fragment\
  \ 所关联的 activity 的 `onCreate()` 方法已执行完毕。\n- `onViewStatusRestored()` - fragment 保存的视图层级结构已恢复。\n\
  \n### 状态保存与恢复\n\n除了上述生命周期方法外，还有两个专门用于保存和恢复 activity 的动态状态：\n\n- `onRestoreInstanceState(Bundle\
  \ savedInstanceState)` – 当 activity 从之前保存了状态的调用重新启动时，此方法在调用 `onStart()` 方法后立即被调用。与\
  \ `onCreate()` 一一样，此方法传递一个包含之前状态数据的 `Bundle` 对象。此方法通常用于以下情况：即在 `onCreate()` 和 `onStart()`\
  \ 中完成 activity 初始化后，恢复之前的状态更具意义。\n- `onSaveInstanceState(Bundle outState)` – 在 activity\
  \ 销毁之前调用，以便保存当前的动态状态（通常与用户界面有关）。该方法接收一个应将状态保存到其中的 `Bundle` 对象，该状态随后会在 activity 重启时传递给\
  \ `onCreate()` 和 `onRestoreInstanceState()` 方法。请注意，此方法仅在运行时确定需要保存动态状态时才会被调用。\n\n\
  在重写上述方法时，重要的是记住，除了 `onRestoreInstanceState()` 和 `onSaveInstanceState()` 之外，方法实现必须包含对父类中对应方法的调用。例如，以下方法重写了\
  \ `onRestart()` 方法，但也包含了对父类实例该方法的调用：\n\n```java\nprotected void onRestart() {\n\
  \    super.onRestart();\n    Log.i(TAG, \"onRestart\");\n}\n```\n\n在方法重写中未调用父类方法将导致运行时在执行期间抛出异常。虽然在\
  \ `onRestoreInstanceState()` 和 `onSaveInstanceState()` 方法中对父类的调用是可选的（例如，在实现自定义保存和恢复行为时可以省略它们），但使用它们有显著益处，该主题将在“[保存和恢复\
  \ Android Activity 状态]”章节中介绍。\n\n## 13.5 生命周期\n\n最后一个要涵盖的话题是 activity 或 fragment\
  \ 在执行期间将经历的整个、可见和前台生命期的概述：\n\n- **整个生命 (Entire Lifetime)** – “整个生命”一术语用于描述从首次调用\
  \ `onCreate()` 方法到对象终止前调用 `onDestroy()` 之间发生的一切。\n- **可见生命 (Visible Lifetime)**\
  \ – 涵盖了调用 `onStart()` 和 `onStop()` 之间的执行期。在此期间，activity 或 fragment 对用户是可见的，尽管它可能不是用户当前正在交互的对象。\n\
  - **前台生命 (Foreground Lifetime)** – 指在调用 `onResume()` 和 `onPause()` 方法之间的执行期。\n\n\
  需要注意的是，activity 或 fragment 在整个生命周期内可能会多次经过前台和可见生命。\n\n生命和生命周期方法的概念如图 13-2 所示：\n\n\
  ![android_activity_lifecycle_methods.png](img/Image2446.jpg)\n\n图 13-2\n\n## 13.6\
  \ 折叠屏设备与多恢复\n\n\n\n\n\n如前所述，在发生某些配置更改时，活动可以指示其不要被重启。这通过在项目清单文件中的 `activity` 元素中添加\
  \ `android:configChanges` 指令来实现。例如，下面的清单文件片段指明，当发生与方向或设备级字体大小相关的配置更改时，该活动不应重启：\n\
  \n```xml\n<activity android:name=\".MainActivity\"\n          android:configChanges=\"\
  orientation|fontScale\"\n          android:label=\"@string/app_name\">\n```\n\n\
  ## 13.8 生命周期周期方法的局限性\n\n正如在本章开头讨论的，生命周期方法已经使用了多年，直到最近，它们一直是处理活动和 fragment 生命周期周期状态变化的唯一机制。然而，这种方法存在缺点。\n\
  \n生命周期方法的一个问题是，它们没有提供一种简单的方法，让活动或 fragment 在应用执行过程中的任何一点发现其当前的生命周期状态。相反，对象需要在内部跟踪状态，或者等待下一次生命周期方法的调用。\n\
  \n此外，这些方法没有提供一种简单的方法让一个对象观察应用内其他对象的生命周期状态变化。这是一个严肃考虑，因为应用中的许多其他对象都可能受到特定活动或 fragment\
  \ 生命周期状态变化的影响。\n\n生命周期方法仅适用于 `Fragment` 和 `Activity` 类的子类。因此，无法构建真正感知生命周期的自定义类。\n\
  \n最后，生命周期方法导致大多数生命周期处理代码被写在活动或 fragment 内部，这可能导致代码复杂且易出错。理想情况下，这些代码大部分应该位于受状态变化影响的其他类中。例如，一个流媒体视频的应用可能包含一个专门用于管理输入流的类。如果应用需要在主活动停止时暂停流，那么执行此操作的代码应该位于流类中，而不是主活动。\n\
  \n所有这些以及更多问题都可以通过使用生命感知组件来解决，该主题将从标题为使用 Jetpack 构建现代 Android 应用架构的章节开始介绍。\n\n##\
  \ 13.9 总结\n\n所有活动都派自 `Activity` 类，该类包含许多生命周期方法，这些方法旨在由运行时系统在活动状态更改时调用。同样，`Fragment`\
  \ 类也包含许多类似的方法。通过重写这些方法，活动和 fragment 可以对状态变化做出响应，并在必要时采取步骤保存并恢复活动以及应用的当前状态。生命周期状态可以被认为有两种形式。持久状态是指在应用调用之间需要存储的数据（例如存储到文件或数据库）。动态状态则与用户界面的当前显示有关。\n\
  \n尽管生命周期方法有很多局限性，可以通过生命感知组件来避免，但理解这些方法对于充分理解书中后面介绍的生命周期管理新方法非常重要。\n\n在本章中，我们强调了活动提供的生命周期方法，并涵盖了活动生命周期的概念。在下一章标题为通过示例理解\
  \ Android 活动状态变化的章节中，我们将实现一个示例应用，将这些理论付诸实践。\n\n## 14. 通过示例理解 Android 活动状态变化\n\n\
  之前的章节详细讨论了构成 Android 应用程序的活动的不同状态和生命周期。在本章中，我们将通过创建一个示例应用，将处理活动状态变化的理论付诸实践。该示例应用的目的是提供一个活动在\
  \ Android 运行时经过各种不同状态的真实世界演示。在下一章标题为保存和恢复 Android 活动状态的章节中，在本章中构建的示例项目将被扩展，以演示动态活动状态的保存和恢复。\n\
  \n### 14.1 创建状态变化示例项目\n\n此练习的第一步是创建新项目。首先启动 Android Studio，如果有必要，使用 `File -> Close\
  \ Project` 菜单选项关闭任何当前打开的项目，以便显示欢迎界面。\n\n从欢迎界面选择 `Create New Project` 快速启动选项，在生成的新项目对话框中，在点击\
  \ `Next` 按钮之前选择 `Empty Activity` 模板。\n\n在 `Name` 字段中输入 `StateChange`，并指定 `com.ebookfrenzy.statechange`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置更改为 `API 26: Android 8.0 (Oreo)`并将`Language`\
  \ 菜单更改为 `Java`。项目创建过程完成后，`StateChange` 项目应列在位于 Android Studio 主窗口左侧边缘的 `Project`\
  \ 工具窗口中。\n\n接下来的操作涉及活动用户界面的设计。它存储在名为 `activity_main.xml` 的文件中，该文件应该已经加载到 `Layout\
  \ Editor` 工具中。如果没有加载，请在项目工具窗口中导航到此处，可以在 `app -> res -> layout` 文件夹中找到。一旦找到，双击该文件将其加载到\
  \ Android Studio Layout Editor 工具中。\n\n![](img/as_4.1_state_change_layout_editor.jpg)\n\
  \n图 14-1\n\n## 14.2 设计用户界面\n\n当用户界面布局加载到 `Layout Editor` 工具后，现在是为示例应用设计用户界面了。用户界面中目前有一个“Hello\
  \ World!” `TextView`，活动实际上需要一个 `EditText` 。在 Layout Editor 画布上选择 `TextView` 对象并按键盘上的\
  \ `Delete` 键将其从设计中删除。\n\n从 Layout Editor 左侧的 `Palette` 中，选择 `Text` 类别，从文本组件列表中点击并拖动\
  \ `Plain Text` 组件到设备屏幕的视觉表示上。将组件移动到显示器中心，使中心引导线出现并将其放置到位，使布局类似于图 14-2。\n\n![](img/as_3.6_state_change_ui.jpg)\n\
  \n图 14-2\n\n在使用 `EditText` 小控件时，有必要为视图指定输入类型。这简单地定义了用户将输入的文本或数据类型。例如，如果输入类型设置为 `Phone`，则用户将被限制在视图中输入数字。或者，如果输入类型设置为\
  \ `TextCapCharacters`，则输入将默认为大写字母。输入类型设置也可以组合。\n\n出于本示例的考虑，我们将设置输入类型以支持普通文本输入。要这样做，在布局中选择\
  \ `EditText` 小控件，并在 `Attributes` 工具窗口中找到 `inputType` 条目。点击当前设置左侧的标志图标打开选项列表，并在列表中关闭\
  \ `textPersonName` 并启用 `text`，然后点击 `Apply` 按钮。继续留在 `Attributes` 工具窗口中，将视图的 `id`\
  \ 更改为 `editText` 并在生成的对话框中点击 `Refactor` 按钮。\n\n\n\n\n\n默认情况下，`EditText` 显示的文本为“Name”。请留在“属性（Attributes）”面板中，删除\
  \ `text` 属性字段中的该内容，这样布局中的视图将保持为空白。\n\n## 14.3 重写 Activity 生命周期周期方法\n\n此时，项目包含一个名为\
  \ `MainActivity` 的单一 activity，它派自 Android 的 `AppCompatActivity` 类。该 activity 的源代码包含在\
  \ `MainActivity.java` 文件中，它已经在编辑器会话中打开，并在编辑器标签栏中以标签页显示。如果该文件未打开，请在项目（Project）工具窗口面板中导航到此处（`app\
  \ -> java -> com.ebookfrenzy.statechange -> MainActivity`），并双击将其加载到编辑器中。加载后，代码如下：\n\
  \n```java\npackage com.ebookfrenzy.statechange;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  \nimport android.os.Bundle;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n\
  \        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \    }\n}\n```\n\n到目前为止，activity 重写的唯一生命周期方法是 `onCreate()` 方法，该方法已实现为在为 activity\
  \ 设置用户界面之前调用该方法的父类实例。我们现在将修改此方法，使其在每次执行时都在 Android Studio 的 Logcat 面板中输出一条诊断消息。为了实现这一点，我们将使用\
  \ `Log` 类，这要求导入 `android.util.Log` 并声明一个标签（tag），以便我们在日志输出中过滤这些消息：\n\n```java\npackage\
  \ com.ebookfrenzy.statechange;\n\nimport android.util.Log;\nimport androidx.annotation.NonNull;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private static final\
  \ String TAG = \"StateChange\";\n\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \        Log.i(TAG, \"onCreate\");\n    }\n}\n```\n\n下一个任务是重写更多方法，每个方法都包含一个相应的日志调用。这些重写方法可以手动添加，也可以使用“Android\
  \ Studio 代码编辑器基础”章节中概述的 `Alt-Insert` 快捷键生成。注意，如果方法是自动生成的，仍然需要手动添加 Log 调用：\n\n```java\n\
  @Override\nprotected void onStart() {\n    super.onStart();\n    Log.i(TAG, \"onStart\"\
  );\n}\n\n@Override\nprotected void onResume() {\n    super.onResume();\n    Log.i(TAG,\
  \ \"onResume\");\n}\n\n@Override\nprotected void onPause() {\n    super.onPause();\n\
  \    Log.i(TAG, \"onPause\");\n}\n\n@Override\nprotected void onStop() {\n    super.onStop();\n\
  \    Log.i(TAG, \"onStop\");\n}\n\n@Override\nprotected void onRestart() {\n   \
  \ super.onRestart();\n    Log.i(TAG, \"onRestart\");\n}\n\n@Override\nprotected\
  \ void onDestroy() {\n    super.onDestroy();\n    Log.i(TAG, \"onDestroy\");\n}\n\
  \n@Override\nprotected void onSaveInstanceState(@NonNull Bundle outState) {\n  \
  \  super.onSaveInstanceState(outState);\n    Log.i(TAG, \"onSaveInstanceState\"\
  );\n}\n\n@Override\nprotected void onRestoreInstanceState(@NonNull Bundle savedInstanceState)\
  \ {\n    super.onRestoreInstanceState(savedInstanceState);\n    Log.i(TAG, \"onRestoreInstanceState\"\
  );\n}\n```\n\n## 14.4 过滤 Logcat 面\n\n在 `MainActivity.java` 的重写方法中添加代码目的是将日志信息输出到\
  \ Logcat 工具窗口。此输出可以配置为显示与设备或模拟器会话的所有事件，也可以限制为与当前选定应用相关的事件。输出还可以进一步限制为仅匹配特定过滤器的日志事件。\n\
  \n显示 Logcat 工具窗口并点击过滤器菜单（在图 14-3 中标记为 B），以查看可用选项。当此菜单被设置为“仅显示选定的应用程序（Show only selected\
  \ application）”时，Logcat 面将只显示与标记为 A 的菜单应用相关的消息。相反，选择“无过滤器（No Filters）”将显示设备或模拟器生成的所有消息。\n\
  \n![](img/as_4.0_statechange_logcat.jpg)\n图 14-3\n\n在运行应用程序之前，值得演示创建一个过滤器，当选择它时，将进一步限制我们感兴趣的日志输出。从过滤器菜单\
  \ (B) 选择“编辑配置（Edit Configuration）”选项。在创建新 Logcat 对话框（图 14-4）中，将过滤器命名为 Lifecycle，并在\
  \ Tag 字段中输入在 `MainActivity.java` 中声明的值（在上述代码中为 `StateChange`）。\n\n![](img/Image2459.jpg)\n\
  图 14-4\n\n在 Package Name 字段中输入包标识符，更改完成后，点击 OK 按钮创建过滤器并关闭对话框。Logcat 窗口中现在不再显示“无过滤器”，而是选中了新创建的过滤器。\n\
  \n## 14.5 运行应用程序\n\n为了获得最佳结果，应在物理设备或模拟器上运行应用程序。在设备配置好并连接到开发电脑后，点击 Android Studio\
  \ 工具栏上的绿色三角形运行按钮（如下图 14-5 所示），选择 Run -> Run… 选项或使用快捷键 `Shift+F10`：\n\n![](img/as_3.5_run_app.jpg)\n\
  图 14-5\n\n如果出现选择设备对话框，请选择物理 Android 设备（假设你尚未将其配置为默认目标）。在 Android Studio 构建应用程序并将其安装到设备上后，它应该启动并在前台运行。查看\
  \ Logcat 面板可以指示到为止触发了哪些方法（请确保选择了上一节创建的 Lifecycle 过滤器，以过滤掉我们目前感兴趣的日志事件）：\n\n![](img/Image2476.jpg)\n\
  图 14-6\n\n## 14.6 测试 Activity\n\n诊断功能正常后，现在是时候通过运行应用程序来理解 activity 生命周期状态了。首先，考虑\
  \ Logcat 面板中的初始日志事件序列：\n\n```\nonCreate\nonStart\nonResume\n```\n\n显然，初始状态变化与“理解\
  \ Android 应用和 Activity 生命周期`中概述的完全一致。注意，并没有调用 `onRestoreInstanceState()`，因为 Android\
  \ 运行时检测到在这种没有需要恢复的状态。\n\n点击设备屏幕底部状态栏上的主图标，并注意日志中报告的方法调用序列如下：\n\n```\nonPause\nonStop\n\
  onSaveInstanceState\n```\n\n在这种情况下，运行时注意到 activity 不再处于前台、对用户不可见并停止了活动，但在此并未提供 activity\
  \ 保存动态状态的机会。取决于运行时最终销毁了 activity 还是重新启动了它，当用户返回 activity 时，activity 将通过 `onRestart()`\
  \ 被通知其已重新启动，或者将再次经历创建序列。\n\n\n\n\n\n正如“理解 Android 应用程序和 Activity 生命周期”中所概述，Activity\
  \ 的销毁和重建可以通过对设备进行配置更改触发，例如从竖屏旋转到横屏。要直观观察这一过程，只需在`StateChange`应用程序处于前台时旋转设备即可。当使用模拟器时，可以使用模拟器工具栏上的旋转按钮来模拟设备旋转。为了完成旋转，还需要点击设备或模拟器屏幕工具栏中出现的旋转按钮，如图\
  \ 14-7 所示：\n\n![](img/as_4.1_rotate_screen_button.jpg)\n\n图 14-7\n\n日志中产生的方法调用序列应该如下所示：\n\
  \n```\nonPause\nonStop\nonSaveInstanceState\nonDestroy\nonCreate\nonStart\nonRestoreInstanceState\n\
  onResume\n```\n\n显然，运行时系统在 Activity 被销毁和重启之前，确实为它提供了一个保存状态的机会。\n\n## 14.7 总结\n\n\
  “一画胜千言”这句古谚语在学习新的编程范式的示例中同样适用。在本章中，我们创建了一个示例 Android 应用程序，旨在演示 Activity 可能会经过的各种生命周期状态。在本章的项目开发过程中，我们还了从\
  \ Activity 内部生成诊断日志信息的机制。\n\n在下一章中，我们将扩展 `StateChange` 示例项目，以演示如何保存和恢复 Activity\
  \ 的动态状态。\n\n## 15. 保存和恢复 Android Activity 的状态\n\n如果前面的几个章节已经实现了目标，那么现在对于在 Activity\
  \ 生命周期内的特定时间点保存和恢复用户界面状态的重要性，应该会变得更清晰一些了。\n\n在本章中，我们将扩展在“通过示例理解 Android Activity\
  \ 状态变化”中创建的示例应用程序，演示当 Activity 被运行时系统销毁和重建时保存和恢复状态的步骤。\n\n保存和恢复动态状态的关键组件涉及使用 Android\
  \ SDK 中的 `Bundle` 类，该主题在本章也将会介绍。\n\n## 15.1 保存动态状态\n\n正如我们已经学到的，Activity 有机会通过运行时系统调用\
  \ Activity 实现的 `onSaveInstanceState()` 方法来保存动态状态信息。作为方法的参数传递的是一个 `Bundle` 对象的引用，该方法需要向该对象存储任何需要保存的动态数据。`Bundle`\
  \ 对象随后由运行时系统代表 Activity 进行存储，并在随后调用 Activity 的 `onCreate()` 和 `onRestoreInstanceState()`\
  \ 方法时，它将作为参数传递给这些方法。然后可以从这些方法内部的 `Bundle` 对象中检索数据，并用于恢复 Activity 的状态。\n\n### 15.2\
  \ 用户界面状态的默认保存\n\n在上一章中，`StateChange` 示例应用程序的诊断输出显示，当运行它的设备旋转得足够以触发方向变化时，Activity\
  \ 会经历多次状态变化。\n\n再次启动 `StateChange` 应用程序，这次在执行设备旋转之前，向 `EditText` 字段中输入一些文本（在运行 Android\
  \ 9 或更高版本的设备或模拟器上，可能需要点击位于状态栏中的旋转按钮来完成旋转）。旋转设备后，Logcat 窗口中会出现以下状态变化序列：\n\n```\n\
  onPause\nonStop\nonSaveInstanceState\nonDestroy\nonCreate\nonStart\nonRestoreInstanceState\n\
  onResume\n```\n\n显然，这导致了 Activity 的销毁和重建。然而，检查运行中应用程序的用户界面，应该发现输入到 `EditText` 字段中的文本已被保留。鉴于\
  \ Activity 被销毁并重建了，且我们没有添加任何特定代码来确保文本被保存和恢复，这种行为需要一些解释。\n\n事实上，Android SDK 包含的绝大多数视图控件（widgets）已经实现了在\
  \ Activity 重启时自动保存和恢复状态所需的行为。启用此行为的唯一要求是 Activity 中的重写方法 `onSaveInstanceState()`\
  \ 和 `onRestoreInstanceState()` 必须包含对父类对应方法的调用：\n\n```java\n@Override\nprotected\
  \ void onSaveInstanceState(@NonNull Bundle outState) {\n    super.onSaveInstanceState(outState);\n\
  }\n\n@Override\nprotected void onRestoreInstanceState(@NonNull Bundle savedInstanceState)\
  \ {\n    super.onRestoreInstanceState(savedInstanceState);\n}\n```\n\n在 XML 布局文件中，可以通过将\
  \ `android:saveEnabled` 属性设置为 `false` 来禁用用户界面视图状态的自动保存。为了示例演示，我们将禁用用户界面布局中 `EditText`\
  \ 视图的自动状态保存机制，然后在应用程序中添加代码来手动保存和恢复视图的状态。\n\n要配置 `EditText` 视图以便在 Activity 重启时不再保存和恢复状态，请编辑\
  \ `activity_main.xml` 文件，使该视图的条目如下（注意，可以通过 Layout Editor 面板底部的 Text 标签页直接编辑 XML）：\n\
  \n```xml\n<EditText\n    android:id=\"@+id/editText\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:ems=\"10\"\
  \n    android:inputType=\"text\"\n    android:saveEnabled=\"false\"\n    app:layout_constraintBottom_toBottomOf=\"\
  parent\"\n    app:layout_constraintEnd_toEndOf=\"parent\"\n    app:layout_constraintStart_toStartOf=\"\
  parent\"\n    app:layout_constraintTop_toTopOf=\"parent\" />\n```\n\n更改后，运行应用程序，输入文本并旋转设备，以验证文本不再保存。\n\
  \n## 15.3 Bundle 类\n\n对于需要在界面组件提供的默认功能之外保存状态的情况，`Bundle` 类提供了一个使用键值对机制存储数据的容器。键的形式为字符串值，而与这些键关联的值可以是原始值，也可以任何实现了\
  \ Android `Parcelable` 接口的对象。广泛的类已经实现了 `Parcelable` 接口。自定义类可以通过实现 `Parcelable` 接口定义的方法集来变为“可序列化的”，细节可以在\
  \ Android 文档中找到：\n\n[`developer.android.com/reference/android/os/Parcelable.html`](https://developer.android.com/reference/android/os/Parcelable.html)\n\
  \n`Bundle` 类还包含一组用于设置各种数据类型键值对的方法，包括原始类型（包括布尔、字符、双精度浮点值）和对象（如 String 和 CharSequence）。\n\
  \n为了本示例，由于已经禁用了 `EditText` 视图的文本自动保存，我们需要确保用户输入到 `EditText` 字段中的文本保存到 `Bundle` 对象中，并在随后恢复。这将通过分别使用\
  \ `Bundle` 类的 `putCharSequence()` 和 `getCharSequence()` 方法演示如何在 Android 应用程序中手动保存和恢复状态。\n\
  \n## 15.4 保存状态\n\n\n\n\n扩展 `StateChange` 应用的第一步是确保将用户输入的文本从 `MainActivity` 活动的 `onSaveInstanceState()`\
  \ 方法中的 `EditText` 组件中提取出来，然后以键值对的形式保存到 `Bundle` 对象中。\n\n为了从 `EditText` 对象中提取文本，我们首先需要在用户界面中识别出该对象。显然，这涉及到在\
  \ Activity 的 Java 代码（包含在 `MainActivity.java` 源文件中）与用户界面的 XML 表示（包含在 `activity_main.xml`\
  \ 资源文件中）之间建立桥梁。为了提取输入到 `EditText` 组件的文本，我们需要获取该用户界面对象的访问权限。\n\n用户界面中的每个组件都关联有一个唯一的标识符。默认情况下，`Layout\
  \ Editor` 工具会根据对象类型为新添加的组件构建 `id`。如果布局中包含多个同种类型的视图，则类型名称后面会跟一个顺序数字（尽管开发者可以并且应该将其更改为更有意义的内容）。正如在选中\
  \ `activity_main.xml` 文件并显示 `Layout Editor` 工具时，检查 Android Studio 主窗口中的 `Component\
  \ Tree`（组件树）面板所所示，`EditText` 组件被分配了 `id editText`：\n\n![](img/as_4.1_state_change_component_tree.jpg)\n\
  \n图 15-1\n\n在了解视图 `id` 后，我们可以从 Activity 代码内部获取该视图的引用：\n\n```java\nfinal EditText\
  \ editText = findViewById(R.id.editText);\n```\n\n我们现在可以通过对象的 `getText()` 方法获取 `editText`\
  \ 视图包含的文本，该方法反过来返回当前文本：\n\n```java\nCharSequence userText = editText.getText();\n\
  ```\n\n最后，我们可以使用 `Bundle` 对象的 `putCharSequence()` 方法保存文本，将键（这可以是任何字符串值，在本例中，我们将其声明为“savedText”）和\
  \ `userText` 对象作为参数传递：\n\n```java\noutState.putCharSequence(\"savedText\", userText);\n\
  ```\n\n将所有这些整合在一起，我们在 `MainActivity.java` 文件中得到了一个修改后的 `onSaveInstanceState()` 方法，内容如下（同时注意对\
  \ `android.widget.EditText` 的额外导入指令）：\n\n```java\npackage com.ebookfrenzy.statechange;\n\
  \n.\n.\n\nimport android.widget.EditText;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n.\n.\n.\n    protected void onSaveInstanceState(@NonNull Bundle outState) {\n\
  \            super.onSaveInstanceState(outState);\n            Log.i(TAG, \"onSaveInstanceState\"\
  );\n            final EditText editText =\n                        findViewById(R.id.editText);\n\
  \            CharSequence userText = editText.getText();\n            outState.putCharSequence(\"\
  savedText\", userText);\n        }\n.\n.\n}\n```\n\n现在采取了保存状态的步骤，下一阶段是确保在需要时恢复它。\n\
  \n## 15.5 恢复状态\n\n保存的动态状态可以在传递 `Bundle` 对象作为参数的生命周期方法中恢复。这让开发者可以选择 `onCreate()`\
  \ 或 `onRestoreInstanceState()`。使用哪种方法取决于 Activity 的性质。在 Activity 执行初始化任务后最适合恢复状态的情况下，`onRestoreInstanceState()`\
  \ 方法通常更合适。为了本例的目的，我们向 `onRestoreInstanceState()` 方法中添加代码，使用“savedText”键从 `Bundle`\
  \ 中提取保存的状态。然后，我们可以使用对象的 `setText()` 方法在 `editText` 组件上显示文本：\n\n```java\n@Override\n\
  protected void onRestoreInstanceState(@NonNull Bundle savedInstanceState) {\n  \
  \ super.onRestoreInstanceState(savedInstanceState);\n   Log.i(TAG, \"onRestoreInstanceState\"\
  );\n   final EditText editText =\n        findViewById(R.id.editText);\n   CharSequence\
  \ userText =\n               savedInstanceState.getCharSequence(\"savedText\");\n\
  \   editText.setText(userText);\n}\n```\n\n## 15.6 测试应用\n\n剩下的只是再次构建并运行 `StateChange`\
  \ 应用。运行并处于前景状态时，在旋转设备到另一种方向之前，触摸 `EditText` 组件并输入一些文本。以前文本更改会丢失，但得益于我们在本章向 Activity\
  \ 中添加的代码，新文本将保留在 `editText` 组件中。\n\n验证代码按预期执行后，从这两个方法中注释掉 `super.onSaveInstanceState()`\
  \ 和 `super.onRestoreInstanceState()` 调用，重新启动应用，并注意在设备旋转后文本仍然被保留。默认的保存和恢复系统本质上被自定义实现取代了，从而提供了一种动态和恢复状态的方法。\n\
  \n## 15.7 总结\n\n在 Android 应用中保存和恢复动态状态简单来说是在适当的生命周期方法中实现适当的代码。对于大多数用户界面视图，这由 `Activity`\
  \ 超类自动处理。在其他情况下，这通常涉及在 `onSaveInstanceState()` 方法中提取值，并将数据作为键值对保存在传递给 Activity 的\
  \ `Bundle` 对象中。\n\n可以通过 Activity 的 `onCreate()` 或 `onRestoreInstanceState()` 方法从\
  \ `Bundle` 对象中提取值来恢复状态。\n\n在本章中，我们使用了这些技术更新了 `StateChange` 项目，使 Activity 能够在在销毁及随后的重建过程中保留更改。\n\
  \n# 16 理解 Android 视图、视图组和布局\n\n除了可能的流媒体音频外，用户与 Android 设备的交互主要是视觉和触觉的。所有这些交互都通过安装在设备上的应用程序的用户界面进行，包括内置应用程序和用户安装的任何第三方应用程序。因此，这并不意外，开发\
  \ Android 应用的一个关键要素涉及用户界面的设计和创建。\n\n在本章中，我们将涵盖 Android 用户界面结构主题，并概述组成用户界面的不同元素；即\
  \ `Views`、`View Groups` 和 `Layouts`。\n\n## 16.1 为不同的 Android 设备进行设计\n\n\n\n\n\n\
  用户界面中的每一个项目都是 `Android View` 类的子类（确切地说是 `android.view.View`）。Android SDK 提供了一组预构建的视图，可用于构建用户界面。典型示例包括标准项，如\
  \ `Button`、`CheckBox`、`ProgressBar` 和 `TextView` 类。这些视图也被称为控件（widgets）或组件（components）。对于\
  \ SDK 提供的控件无法满足的需求，可以通过子类并扩展现有类来创建新视图，也可以通过直接在 `View` 类之上构建一个全新的组件来创建新视图。\n\n视图也可以由多个其他视图组成（也称为复合视图，composite\
  \ view）。此类视图派自 `Android ViewGroup` 类（`android.view.ViewGroup`），而 `ViewGroup` 本身也是\
  \ `View` 的子类。这种视图的一个示例是 `RadioGroup`，它旨在用于包含多个 `RadioButton` 对象，使得在任何时候只有一个对象可以处于“开启”状态。从结构上来说，复合视图由单个父视图（派生自\
  \ `ViewGroup` 类，另称为容器视图或根元素）组成，该父视图能够包含其他视图（称为子视图）。\n\n另一类基于 `ViewGroup` 的容器视图是布局管理器。\n\
  \n### 16.3 Android 布局管理器\n\n除了上一节讨论的控件式视图外，SDK 还包含了一组被称为布局（layouts）的视图。布局是容器视图（因此派自\
  \ `ViewGroup`），其设计的唯一目的是控制子视图在屏幕上的对齐和定位方式。\n\nAndroid SDK 包含了以下可能在 Android 用户界面设计中使用的布局视图：\n\
  \n-   `ConstraintLayout` – 引入自 Android 7，对于大多数布局需求，都建议使用此布局管理器。`ConstraintLayout`\
  \ 允许通过分配给每个子视图的简单约束设置，来定义布局中视图的位置和行为。该布局的灵活性允许快速、方便地创建复杂布局，而无需在其他布局类型内部嵌套其他布局类型，从而提升了布局性能。`ConstraintLayout`\
  \ 还被紧密集成到 Android Studio 布局编辑器（Layout Editor）工具中。除非另有说明，它是书中大部分示例的优选布局。\n-   `LinearLayout`\
  \ – 根据所选的方向（orientation），将子视图对齐在单行或单列中。可以在每个子视图上设置权重值（weight），以指定该子视图相对于其他子视图应占据布局空间的比例。\n\
  -   `TableLayout` – 将子视图按行和列的网格格式排列。表格中的每一行由一个 `TableRow` 对象子表示，该对象反过来又包含每个单元格的视图对象。\n\
  -   `FrameLayout` – `FrameLayout` 的目的是分配屏幕区域，通常用于显示单个视图。如果添加了多个子视图，默认情况下它们将堆叠在一起，并位于布局区域的左上角。通过为每个子视图设置重力值（gravity），可以实现单个子视图的交替定位。例如，在子视图上设置\
  \ `center_vertical` 重力值将导致它位于包含它的 `FrameLayout` 视图的垂直中心。\n-   `RelativeLayout` –\
  \ `RelativeLayout` 允许通过指定子视图的对齐方式（alignments）和外边（margins），使子视图相对于彼此以及容器布局视图进行定位。例如，可以将子视图\
  \ `View A` 配置为位于包含它的 `RelativeLayout` 视图的水平和垂直中心。另一方面，`View B` 也可以配置为在布局视图中水平居中，但位于\
  \ `View A` 顶部上方 30 像素处，从而使其垂直位置相对于 `View A` 确定。在设计必须适应各种屏幕尺寸和方向的用户界面时，`RelativeLayout`\
  \ 管理器可能特别有用。\n-   `AbsoluteLayout` – 允许将子视图定定在容器布局视图内特定的 `X` 和 `Y` 坐标处。不建议使用此布局，因为它缺乏响应尺寸变化的灵活性。\n\
  -   `GridLayout` – `GridLayout` 是由行和列划分的网格，允许将视图放置在网格单元中。可以通过指定行数和列数来定义网格，并允许视图跨越多个行或列。\n\
  -   `Space` – `Space` 是一个不可见的视图，用于在布局中留出空白区域。它在 `GridLayout` 中可以通过放置相邻网格单元的 `Space`\
  \ 视图来实现网格之间的间隙，或者通过设置布局参数来实现。\n\n### ` `.` 布局。\n\n## 16.4 视图层级（View Hierarchy）\n\
  \n用户界面中的每一个项都是 `Android View` 类的子类（确.view....View）。\n\n视图也可以由多个其他视图组成（也称为复合视图，composite\
  \ view）。此类视图派自 `Android ViewGroup` 类（`android.view.ViewGroup`），而 `ViewGroup` 本身也是\
  \ `View` 的子类。这种视图的一个示例是 `RadioGroup`，它旨在用于包含多个 `RadioButton` 对象，使得在任何时候只有一个对象可以处于“开启”状态。从结构上来说，复合视图由单个父视图（派生自\
  \ `ViewGroup` 类，另称为容器视图或根元素）组成，该父视图能够包含其他视图（称为子视图）。\n\n另一类基于 `ViewGroup` 的容器视图是布局管理器。\n\
  \n### 16.3 Android 布局管理器\n\n除了上一节讨论的控件式视图外，SDK 还包含了一组被称为布局（layouts）的视图。布局是容器视图（因此派自\
  \ `ViewGroup`），其设计的唯一目的是控制子视图在屏幕上的对齐和定位方式。\n\nAndroid SDK 包含了以下可能在 Android 用户界面设计中使用的布局视图：\n\
  \n-   `ConstraintLayout` – 引入自 Android 7，对于大多数布局需求，都建议使用此布局管理器。`ConstraintLayout`\
  \ 允许通过分配给每个子视图的简单约束设置，来定义布局中视图的位置和行为。该布局的灵活性允许快速、方便地创建复杂布局，而无需在其他布局类型内部嵌套其他布局类型，从而提升了布局性能。`ConstraintLayout`\
  \ 还被紧密集成到 Android Studio 布局编辑器（Layout Editor）工具中。除非另有说明，它是书中大部分示例的优选布局。\n-   `LinearLayout`\
  \ – 根据所选的方向（orientation），将子视图对齐在单行或单列中。可以在每个子视图上设置权重值（weight），以指定该子视图相对于其他子视图应占据布局空间的比例。\n\
  -   `TableLayout` – 将子视图按行和列的网格格式排列。表格中的每一行由一个 `TableRow` 对象子表示，该对象反过来又包含每个单元格的视图对象。\n\
  -   `FrameLayout` – `FrameLayout` 的目的是分配屏幕区域，通常用于显示单个视图。如果添加了多个子视图，默认情况下它们将堆叠在一起，并位于布局区域的左上角。通过为每个子视图设置重力值（gravity），可以实现单个子视图的交替定位。例如，在子视图上设置\
  \ `center_vertical` 重力值将导致它位于包含它的 `FrameLayout` 视图的垂直中心。\n-   `RelativeLayout` –\
  \ `RelativeLayout` 允许通过指定子视图的对齐方式（alignments）和外边（margins），使子视图相对于彼此以及容器布局视图进行定位。例如，可以将子视图\
  \ `View A` 配置为位于包含它的 `RelativeLayout` 视图的水平和垂直中心。另一方面，`View B` 也可以配置为在布局视图中水平居中，但位于\
  \ `View A` 顶部上方 30 像素处，从而使其垂直位置相对于 `View A` 确定。在设计必须适应各种屏幕尺寸和方向的用户界面时，`RelativeLayout`\
  \ 管理器可能特别有用。\n-   `AbsoluteLayout` – 允许将子视图固定在容器布局视图内特定的 `X` 和 `Y` 坐标处。不建议使用此布局，因为它缺乏响应尺寸变化的灵活性。\n\
  -   `GridLayout` – `GridLayout` 是由行和列划分的网格，允许将视图放置在网格单元中。可以通过指定行数和列数来定义网格，并允许视图跨越多个行或列。\n\
  -   `Space` – `Space` 是一个不可见的视图，用于在布局中留出空白区域。它在 `GridLayout` 中可以通过放置相邻网格单元的 `Space`\
  \ 视图来实现网格之间的间隙，或者通过设置布局参数来实现。\n\n## 16.4 视图层级（View Hierarchy）\n\n用户界面中的每一个视图代表一个矩形区域。视图负责在该区域内绘制内容，并响应发生在该区域的事件（例如触摸事件）。\n\
  \n用户界面屏幕由一个视图层级组成，根视图位于顶部，子视图位于下方。容器视图的子显示在父视图之上，并被限制在父视图的边界内。\n\n## 16.5 创建用户界面\n\
  \n在对视图、布局和视图层级概念有了更清晰的理解之后，后续章节将重点关注为 Android Activity 创建用户界面的步骤。事实上，有三种设计用户界面的方法：使用\
  \ Android Studio 布局编辑器工具、手写 XML 布局资源文件或编写 Java 代码，每种方法都将被涵盖。\n\n## 16.6 总结\n\n\n\
  \n\n\nAndroid 应用用户界面中的每个元素都是视图（view），它们最终都继承自 `android.view.View` 类。每个视图代表设备显示器上的一个矩形区域，既负责该区域内显示的内容，又负责处理发生在视图边界内的事件。多个视图可以组合成单个复合视图。复合视图中的视图是容器视图的子视图，容器视图通常是\
  \ `android.view.ViewGroup` 的子类（而它本身又是 `android.view.View` 的子类）。用户界面是由以视图层次结构构建的视图组成的。\n\
  \nAndroid SDK 包含了一系列预构建的视图，用于创建用户界面。这些视图包括文本字段和按钮等基本组件，以及一系列可用于控制子视图位置的布局管理器。如果提供的视图不能满足特定需求，可以通过扩展或组合现有视图，或者通过继承\
  \ `android.view.View` 并创建一个完全全新的视图类来创建自定义视图。\n\n用户界面可以使用 Android Studio 布局编辑器（Layout\
  \ Editor）工具、手动编写 XML 布局资源文件或编写 Java 代码来创建。这些方法都将在接下来的章节中进行介绍。\n\n# 17. Android Studio\
  \ 布局编辑器工具指南\n\n很难想象有一个不需要某种用户界面的 Android 应用概念。大多数 Android 设备都配备了触摸屏和键盘（虚拟或物理），点击和滑动是用户与应用程序之间交互的主要形式。这些交互不可避免地通过应用程序的用户界面进行。\n\
  \n设计良好且实现的用户界面是创建一个成功且流行的 Android 应用的重要因素，根据单个应用程序的设计需求，它可以从简单到极其复杂不等。无论复杂程度如何，Android\
  \ Studio 布局编辑器工具都显著简化了设计和实现 Android 用户界面的任务。\n\n## 17.1 基础活动 vs. 空活动模板\n\n正如名为“Android\
  \ 应用的剖析”(#App_Anatomy.xhtml__idTextAnchor236)的章节概述的，Android 应用由一个或多个活动（activity）组成。活动是应用程序功能的一个独立模块，通常直接对应于单个用户界面屏幕。因此，当使用\
  \ Android Studio 布局编辑器时，我们总是在为某个活动编写布局。\n\n在创建新的 Android Studio 项目时，可以使用许多不同的模板作为主活动用户界面的起点。这些模板中最是最基础的是基础活动（Basic\
  \ Activity）模板和空活动（Empty Activity）模板。尽管它们初看之下很相似，但这两个选项之间实际上存在显著差异。要在布局编辑器中查看这些差异，请使用视图选项（View\
  \ Options）菜单启用“显示系统 UI（Show System UI）”，如下图 17-1（Layout_Editor.xhtml__idTextAnchor335）所示：\n\
  \n![](img/as_4.1_layout_editor_system_ui.jpg)\n图 17-1\n\n空活动模板创建一个单一布局文件，由一个包含 `TextView`\
  \ 对象的 `ConstraintLayout` 管理器实例组成，如下图 17-2（Layout_Editor.xhtml__idTextAnchor337）所示：\n\
  \n![](img/as_4.1_empty_activity_ui.jpg)\n\n图 17-2\n\n另一方面，基础活动由多个布局文件组成。顶层布局文件具有\
  \ `CoordinatorLayout` 作为根视图、一个可配置的应用程序栏（也称为操作栏），它显示在设备屏幕顶部（在图 17-3（Layout_Editor.xhtml__idTextAnchor339）中标记为\
  \ A），以及一个悬浮按钮（标记为 B 的邮件按钮）。除了这些项目，`activity_main.xml` 布局文件还包含对名为 `content_main.xml`\
  \ 的第二个文件的引用，该文件包含内容布局（标记为 C）：\n\n![](img/as_4.1_basic_activity_ui.jpg)\n图 17-3\n\
  \n基础活动包含两个屏幕的布局，两者都包含一个按钮和一个文本视图。此模板的目的是演示如何在应用内实现多个屏幕之间的导航。如果运行一个使用基础活动模板的未修改的应用程序，将显示这两个屏幕中的第一个（在图\
  \ 17-4（Layout_Editor.xhtml__idTextAnchor340）中标记为 A）。按下“下一步（Next）”按钮将导航到第二个屏幕（B），该屏幕反过来包含一个返回第一个屏幕的按钮：\n\
  \n![](img/as_4.1_layout_editor_basic_navigation.jpg)\n图 17-4\n\n这种应用行为使用了两个 Android\
  \ 特性，分别称为碎片（片/fragments）和导航（navigation），这两者都将分别从名为“Android 片片简介”(#Fragments.xhtml__idTextAnchor663)和“导航架构组件概述”(#Navigation_Overview.xhtml__idTextAnchor792)的章节开始介绍。\n\
  \n`content_main.xml` 文件包含一个特殊的碎片，称为导航主机碎片（Navigation Host Fragment），它允许根据 `res ->\
  \ layout -> nav_graph.xml` 文件中配置的设置在视图中切换不同的内容。在基础活动模板的情况下，`nav_graph.xml` 文件配置为根据用户做出的“下一步”和“上一步”按钮选择，在\
  \ `fragment_first.xml` 和 `fragment_second.xml` 文件中定义的用户界面布局之间切换。\n\n显然，如果你在活动中既不需要悬浮按钮也不需要菜单，不需要\
  \ `CoordinatorLayout` 提供的特殊应用栏行为（例如在滚动操作期间使应用栏和服务栏从视图中折叠的选项，该主题在“使用 AppBar 和折叠工具栏布局”(#AppBar.xhtml__idTextAnchor1012)章节中介绍），那么空活动模板是非常有用的。然而，基础活动的有用之处在于它默认提供了这些元素。事实上，与其使用基础活动模板创建一个新活动并删除不需要的元素，比使用空活动模板手动实现折叠工具栏、菜单或悬浮按钮要快得多。\n\
  \n然而，由于书中并非所有示例都需要基础活动模板的功能，因此本章的大多数示例将使用空活动模板，除非示例需要基础活动模板提供的一个或多个功能。\n\n为了以后参考，如果你需要菜单但不需要悬浮按钮，请使用基础活动并按照以下步骤删除悬浮按钮：\n\
  \n1. 在项目窗口的 `app -> res -> layout` 下双击 `activity_main.xml` 布局文件，将其加载到布局编辑器中。布局加载到布局编辑器工具后，选择悬浮按钮并按下键盘\
  \ Delete 键从布局中删除该对象。\n2. 定位并编辑活动的 Java 代码（位于 `app -> java -> <package name> -> <activity\
  \ class name>`），如下所示从 `onCreate` 方法中删除悬浮按钮代码：\n\n```java\n@Override\nprotected void\
  \ onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    setContentView(R.layout.activity_main);\n    Toolbar toolbar = findViewById(R.id.toolbar);\n\
  \    setSupportActionBar(toolbar);\n    FloatingActionButton fab =\n        findViewById(R.id.fab);\n\
  \    fab.setOnClickListener(new View.OnClickListener() {\n        @Override\n  \
  \      public void onClick(View view) {\n            Snackbar.make(view, \"替换为自己的操作\"\
  ,\n                Snackbar.LENGTH_LONG)\n                .setAction(\"Action\"\
  , null).show();\n        }\n    });\n}\n```\n\n\n\n\n\n如果你需要一个悬浮操作按钮但不需要菜单，使用 `Basic\
  \ Activity` 模板并按照以下步骤操作：\n\n1. 编辑 activity 类文件并删除 `onCreateOptionsMenu` 和 `onOptionsItemSelected`\
  \ 方法。\n2. 在 Project 工具窗口中选择 `res -> menu` 项，并按下键盘上的 `Delete` 键从项目中删除该文件夹和相应的菜单资源文件。\n\
  \n如果你需要使用 `Basic Activity` 模板，但既不需要导航功能也不需要第二个内容片段，请按照以下步骤操作：\n\n1. 在 Project 工具窗口中，导航并双击\
  \ `app -> res -> navigation -> nav_graph.xml` 文件以将其加载到导航编辑器中。\n2. 在编辑器中，在 `Destinations`\
  \ 面板中选择 `SecondFragment` 条，并按下键盘上的 `delete` 键将其从图中移除。\n3. 找到并删除 `SecondFragment.java`\
  \ (`app -> java -> <package name> -> SecondFragment`）和 `fragment_second.xml` (`app\
  \ -> res -> layout -> fragment_second.xml`）文件。\n4. 最后的任务是从 `FirstFragment` 类中移除一些代码，以便\
  \ `Button` 视图在点击时不再导航到已不存在的第二个片段。找到 `FirstFragment.java` 文件，双击它将其加载到编辑器，并从 `onViewCreated()`\
  \ 方法中的代码，使其内容如下：\n\n```java\npublic void onViewCreated(@NonNull View view, Bundle\
  \ savedInstanceState) {\n    super.onViewCreated(view, savedInstanceState);\n  \
  \  view.findViewById(R.id.button_first).setOnClickListener(new View.OnClickListener()\
  \ {\n        @Override\n        public void onClick(View view) {\n            NavHostFragment.findNavController(FirstFragment.this)\n\
  \                          .navigate(R.id.action_FirstFragment_to_SecondFragment);\n\
  \        }\n    });\n}\n```\n\n 17.2 Android Studio 布局编辑器\n\n如前面的章节所演示，`Layout Editor`\
  \ 工具提供了一个“所见即所得”（WYSIWYG）的环境，在该环境中，可以从调色板中选择视图，然后将其放置在代表 Android 设备显示的画布上。一旦视图放置在画布上，就可以对其进行移动、删除和调整大小（受父视图约束的限制）。此外，可以使用\
  \ `Attributes` 工具窗口修改与所选视图相关的各种属性。\n\n在底层，`Layout Editor` 工具实际上会构建一个包含正在设计的用户界面定义的\
  \ XML 资源文件。因此，`Layout Editor` 以三种不同的模式运行，称为 `Design`、`Code` 和 `Split` 模式。\n\n##\
  \ 17.3 设计模式\n\n在设计模式下，可以通过直接操作视图调色板和布局的图形表示来视觉化处理用户界面。图 17-5 突出了 Android Studio\
  \ 布局编辑器在设计模式下的关键区域：\n\n![](img/as_4.1_layout_editor_labeled.jpg)\n\n图 17-5\n\n*\
  \ **A – 调色板 (Palette)** – 调色板提供了 Android SDK 提供的系列视图组件的访问。这些组件被分类以便于导航。可以通过从调色板拖入视图组件并将其放置在布局上的所需位置来向布局添加项。\n\
  * **B – 设备屏幕 (Device Screen)** – 设备屏幕提供了正在设计中的用户界面布局的视觉化“所见即所得”表示。此布局允许对设计进行直接操作，允许选择、删除、移动和调整视图的大小。可以使用工具栏中的菜单随时更改布局表示的设备模型。\n\
  * **C – 组件树 (Component Tree)** – 如前一节所述（“理解 Android Views、View Groups 和 Layouts”），用户界面是使用分级结构构建的。组件树提供了用户界面设计层次结构的视觉概览。从组件树中选择元素将选中布局中相应的视图。同样，从设备屏幕布局中选择视图将选中组件树层次中的该视图。\n\
  * **D – 属性 (Attributes)** – 调色板中列出的所有组件视图都有一组相关的属性，用于调整该视图的行为和外观。布局编辑器的属性面板提供了对布局中当前选中视图属性的访问，以便进行更改。\n\
  * **E – 工具栏 (Toolbar)** – 布局编辑器工具栏提供了许多选项的快速访问，包括放大和缩放设备屏幕布局、更改当前显示的设备模型、在竖屏和横屏之间旋转布局以及切换到不同的\
  \ Android SDK API 。工具栏还有一组上下文相关按钮，当在设备屏幕布局中选择相关的视图类型时，这些按钮将会出现。\n* **F – 模式切换控制\
  \ (Mode Switching Controls)** – 这三个按钮提供了在布局编辑器工具的 `Design`、`Code` 和 `Split` 模式之间切换的方法。\n\
  * **G - 缩放和平移控制 (Zoom and Pan Controls)** - 此控制面板允许你对设计画布进行放大和缩小，并抓取画布进行移动以找到放大时被遮挡的区域。\n\
  \n## 17.4 调色板 (Palette)\n\n布局编辑器调色板分为两个面板，旨在便于查找和预览要添加到布局中的视图组件。类别面板（在图 17-6 中标记为\
  \ A）列出了 SDK 支持的不同类别的视图组件。当选择某个类别时，第二个面板将更新以显示该类别下的组件列表：\n\n![](img/as_4.1_layout_editor_palette.jpg)\n\
  \n图 17-6\n\n要将调色板中的组件添加到画布上，只需从组件列表或预览面板选择该项，将其拖到画布上的所需位置并释放即可。\n\n在当前选择的类别内搜索特定组件可以通过点击调色板工具栏上的搜索按钮（在图\
  \ 17-6 中标记为 C）并输入组件名称来实现。随着字符的输入，匹配的结果将出现在组件列表中。如果你不确定组件所在的类别，只需在搜索操作之前或期间选择全部（All）类别。\n\
  \n## 17.5 设计模式与布局视图\n\n默认情况下，布局编辑器以设计模式出现，如图 17-5 所示。此模式提供了用户界面的视觉表示。可以通过点击图 17-7\
  \ 所示的最右侧模式切换控件随时选择设计模式：\n\n![](img/as_4.0_layout_editor_design_button.jpg)\n\n图\
  \ 17-7\n\n当布局编辑器工具处于设计模式时，可以通过两种方式查看布局。图 17-5 所示的视图是设计视图，显示了在运行应用程序中显示的布局和控件。另一种模式被称为蓝图视图（Blueprint\
  \ view），可以替换设计视图显示，也可以与设计视图同时显示。图 17-8 所示的工具栏菜单提供了显示设计、蓝图或两种视图的选项。第四种选项“强制刷新布局”（Force\
  \ Refresh Layout）会导致布局重新构建并重绘。当布局进入意外状态或未能准确反映当前设计设置时，这非常有用：\n\n![](img/as_3.6_layout_editor_design_blueprint.jpg)\n\
  \n图 17-8\n\n\n\n\n显示布局视图、设计视图或两者都取决于个人喜好。一种好的方法是从同时显示两者开始，如图 17-9 所示：\n\n![](img/as_3.5_show_layout_design_and_blueprint.jpg)\n\
  图 17-9\n\n## 17.6 代码模式\n\n在使用 Android Studio 布局编辑器工具时，重要的是记住，它实际上所做的仅仅是为创建 XML 布局资源文件提供了一种用户友好的方法。在设计过程的任何时候，只需通过点击位于布局编辑器工具面板右上角的\
  \ `Code` 按钮，即可查看并直接底层的 XML，如图 17-10 所示：\n\n![](img/as_4.0_layout_editor_code_button.jpg)\n\
  图 17-10\n\n图 17-11 显示了代码模式下的 Android Studio 布局编辑器工具，允许通过修改 XML 对用户界面声明进行更改：\n\n\
  ![](img/as_3.6_layout_editor_code_mode.jpg)\n图 17-11\n\n## 17.7 分屏模式\n\n在分屏模式下，编辑器并排显示设计和代码视图，允许用户通过设计画布进行视觉上的用户界面修改，并通过直接更改\
  \ XML 声明进行修改。要进入分屏模式，点击下方图 17-12 所示的中间按钮：\n\n![](img/as_4.1_layout_split_button.jpg)\n\
  图 17-12\n\n对 XML 的任何更改都会自动反映在设计画布上，反之亦然。图 17-13 显示了分屏模式下的编辑器：\n\n![](img/as_4.1_layout_split_mode.jpg)\n\
  图 17-13\n\n## 17.8 设置属性\n\n属性面板（Attributes panel）提供了当前所选组件的所有可用设置访问。例如，图 17-14 显示了\
  \ `TextView` 小部件的属性：\n\n![](img/as_4.1_layout_attributes.jpg)\n图 17-14\n\n属性工具窗口分为以下不同部分。\n\
  \n- `id`：包含 `id` 属性，定义了在应用程序源码中引用当前所选对象时的名称。\n- `Declared Attributes`（已声明属性）：包含所有已赋值的属性。\n\
  - `Layout`（布局）：定义当前所选视图对象相对于屏幕和布局中对象的定位和尺寸的设置。\n- `Transforms`（变换）：包含允许当前所选对象旋转、缩放和偏移的控件。\n\
  - `Common Attributes`（常用属性）：当前所选视图对象类通常需要更改的属性列表。\n- `All Attributes`（所有属性）：当前所选对象所有可用属性的完整列表。\n\
  \n也可以通过选择属性窗口工具栏中的搜索按钮并输入属性名称来搜索特定属性。\n\n某些属性在值字段右侧有一个窄按钮。这表示可以使用资源对话框（Resources\
  \ dialog）来协助选择合适的属性值。要显示该对话框，只需点击该按钮。该按钮的外观会 way，以反映相应的属性值是存储在资源文件中还是硬编码的。如果值存储在资源文件中，`text`\
  \ 属性字段右侧的按钮将填充，以指示该值不是硬编码，如下方的图 17-15 所示：\n\n![](img/as_3.4_resource_extracted.jpg)\n\
  图 17-15\n\n具有有限数量有效选项的属性将呈现一个下拉菜单（图 17-16），可以从中进行选择。\n\n![](img/as_4.0_type_face_menu.jpg)\n\
  图 17-16\n\n点击滴管图标（如上方图 17-15 中 `backgroundTint` 字段所示）可以显示颜色选择调色板。同样，当此位置出现旗帜图标时，点击它可以显示该属性的选项列表，而图像图标会打开资源管理器面板，允许为属性选择图像和其他资源类型。\n\
  \n## 17.9 变换\n\n属性工具窗口内的变换面板（图 17-17）提供了一组控件和属性，用于控制当前所选对象在旋转、透明度（用于视图淡入淡出）、缩放（尺寸）和平移（当前位置的偏移）方面的视觉方面：\n\
  \n![](img/as_4.1_layout_editor_transforms.jpg)\n图 17-17\n\n面板包含视图的视觉表示，该表示随属性的更改而更新。这些更改也会反映在布局画布内的视图上。\n\
  \n## 17.10 工具可见性切换\n\n在代码模式下查看 Android Studio XML 布局文件的内容时，你会注意到许多定义视图外观和行为的属性都以特定的前缀开头（此处原文未给出前缀词，但语境为属性定义）。\n\
  \n*(注：由于提供的文本在 17.10 之后似乎是后续示例描述的开头，此处翻译根据您提供的文本逻辑进行。)*\n\n\n\n\n\n这些切换开关控制 `android`\
  \ 和 `tools` 命名空间对应视图的可见性，并提供 `not set`、`visible`、`invisible` 和 `gone` 选项。当设置了冲突的属性时（例如\
  \ `android` 命名空间开关被设置为 `visible`，而 `tools` 值被设置为 `invisible`），在布局预览中，`tools` 命名空间具有优先级。当选了切换选项时，Android\
  \ Studio 会自动在布局文件的 XML 视图元素中添加相应的属性。\n\n除了 `Component Tree`（组件树）面板中的可见性切换开关外，布局编辑器还包含了下方图\
  \ 17-20 中所示高亮显示的 `tools` 可见性和位置切换按钮：\n\n![](img/as_4.1_layout_editor_tools_toggle.jpg)\n\
  \n图 17-20\n\n此按钮切换当前的 `tools` 可见性设置。例如，如果上方显示的 `Button` 视图当前 `tools` 可见性属性设置为 `gone`，则切换此按钮将使其可见。这使得在视图添加到布局或从布局中移除时，能够快速检查布局行为。此切换开关也有助于检查布局中的视图是否正确约束，该主题将在“在\
  \ Android Studio 中使用 ConstraintLayout 的指南”章节中介绍。\n\n## 17.11 转换视图\n\n在布局中将视图从一种类型转换为另一种类型（例如将\
  \ `TextView` 转换为 `EditText`）可以在 Android Studio 布局编辑器中轻松完成，只需在屏幕布局或 `Component tree`\
  \ 窗口中右键点击该视图，并选择 `Convert view...` 菜单选项（图 17-21）：\n\n![](img/as_3.4_convert_view_menu_option.jpg)\n\
  \n图 17-21\n\n一旦选中，将出现一个对话框，其中包含所选对象有资格转换的兼容视图类型列表。例如，图 17-22 显示了现有 `TextView` 视图可以转换的类型：\n\
  \n![](img/as_3.2_convert_layout_textview.jpg)\n\n图 17-22\n\n这种技术也适用于将布局从一种类型转换为另一种类型（例如将\
  \ `ConstraintLayout` 转换为 `LinearLayout`）。\n\n## 17.12 显示示例数据\n\n在 Android Studio\
  \ 中设计布局时，会出现这样的情况：用户界面中要显示的内容在应用完成并运行之前无法可用。这有时会很难从布局编辑器内部评估布局在应用运行时的外观。为了解决这个问题，布局编辑器允许指定示例数据，这些数据将用示例图像和数据填充布局编辑器中的视图。这些示例数据仅在布局编辑器中显示，在应用运行时不会显示。可以通过直接编辑布局的\
  \ XML 或通过可视化使用设计时助手（右键点击设计区域中的小部件并选择 `Set Sample Data` 菜单选项）来配置示例数据。设计时助手面板将为所选的视图项显示一系列预配置的示例数据选项，包括各种配置下的文本和图像的组合。例如，图\
  \ 17-23 显示了在选择在 `RecyclerView` 列表中示例数据时显示的示例数据选项：\n\n![](img/as_3.4_sample_data_menu.jpg)\n\
  \n图 17-23\n\n或者，可以在布局设计过程中提供自定义的文本和图像进行显示。在布局编辑器中使用示例数据的示例包含在随后的章节“布局编辑器示例数据教程”中。由于示例数据是实现为\
  \ `tools` 属性的，预览中数据的可见性可以使用上文图 17-20 中高亮显示的切换按钮进行进行控制。\n\n## 17.13 创建自定义设备定义\n\n\
  布局编辑器工具栏中的设备菜单（图 17-24）提供了一个预配置的设备类型列表，选中后它们将作为设备屏幕画布出现。除了预配置的设备类型外，之前在 Android\
  \ Studio 环境中配置过的任何 `AVD` 实例也将列在菜单中。要添加额外的设备配置，显示设备菜单，选择 `Add Device Definition…`\
  \ 选项，并按照“在 Android Studio 中创建 Android 虚拟设备 (AVD)”章节中概述的步骤进行。\n\n![](img/as_3.6_layout_editor_select_device.jpg)\n\
  \n图 17-24\n\n## 17.14 更改当前设备\n\n作为设备选择菜单的替代，可以通过从设备菜单选择 `Custom` 选项，点击位于设备屏幕右下角的缩放手（图\
  \ 17-25）并拖动以选择备用设备显示格式。随着屏幕调整大小，将出现标记，指示可选的各种尺寸选项和方向：\n\n![](img/as_3.5_show_layout_resize_device.jpg)\n\
  \n图 17-25\n\n## 17.15 布局验证（多预览）\n\n布局验证（也称为多预览）选项允许在范围内的多个 Pixel 尺寸屏幕上同时预览用户界面布局。要访问多预览，请点击位于\
  \ Android Studio 主窗口右上角附近的标签页，如图 17-26 所示：\n\n![](img/as_4.0_layout_validation_tab.jpg)\n\
  \n图 17-26\n\n加载后，面板将如图 17-27 所示出现，在多个 Pixel 设备配置上渲染布局：\n\n![](img/as_3.6_layout_editor_multi_preview.jpg)\n\
  \n图 17-27\n\n## 17.16 总结\n\n开发 Android 应用的关键部分是创建用户界面。在 Android Studio 环境中，这是通过布局编辑器完成的，具有三种模式。在\
  \ `Design` 模式下，从调板中选择组件并放置在代表 Android 设备屏幕的布局上，使用属性列表进行配置。在 `Code` 模式下，可以直接编辑表示用户界面布局的底层\
  \ XML。另一方面，`Split` 模式允许通过可视化和直接编辑 XML 来创建和修改布局。这些模式提供了丰富且直观的用户界面设计环境。\n\n布局验证允许在各种屏幕尺寸范围内快速预览用户界面布局。\n\
  \n## 18 Android ConstraintLayout 指南\n\n正如“理解 Android 视图、视图组和布局”章节中所提到的，Android 提供了多种布局管理器用于设计用户界面。从\
  \ Android 7 开始，Google 引入了一种新的布局，旨在解决许多布局管理器的缺点。这种新布局称为 `ConstraintLayout`，它将简单、表达且灵活的布局系统与\
  \ Android Studio 布局编辑器内置的强大功能相结合，从而有助于创建适应不同屏幕尺寸和设备方向变化的响应式用户界面布局。\n\n本章将概述 `ConstraintLayout`\
  \ 的基本概念，而下一章将详细概述如何在 Android Studio 布局编辑器工具中使用 `ConstraintLayout` 创建基于约束的布局。\n\n\
  ## 18.1 ConstraintLayout 如何工作\n\n\n\n\n\n与所有其他布局一样，`ConstraintLayout` 负责管理其包含的视觉组件（也称为\
  \ `widgets`）的定位和尺寸调整行为。它是根据设置在每个子 `widget` 上的约束连接来实现此点的。\n\n为了完全理解和使用 `ConstraintLayout`，掌握以下核心概念至关重要：\n\
  \n- 约束 (Constraints)\n- 边距 (Margins)\n- 对抗约束 (Opposing Constraints)\n- 约束偏置 (Constraint\
  \ Bias)\n- 链 (Chains)\n- 链样式 (Chain Styles)\n- 辅助 (Guidelines)\n- 组 (Groups)\n-\
  \ 屏障 (Barriers)\n- 流 (Flow)\n\n### 18.1.1 约束\n约束本质上是一组规则，规定了 widget 相其他 widget、容器\
  \ `ConstraintLayout` 的边缘以及名为 `guidelines` 的特殊元素的对齐方式和间距。约束还决定了 activity 的界面布局如何响应设备方向的变化，或者在不同屏幕尺寸的设备上显示时的表现。为了进行充分配置，widget\
  \ 必须具有足够的约束连接，以便 `ConstraintLayout` 布局引擎能够在水平和垂直平面上解析其位置。\n\n### 18.1.2 边距\n边距是指定固定距离的约束形式。考虑一个需要放置在设备屏幕右上角的\
  \ `Button` 对象。这可以通过实现从 `Button` 顶部和右侧边缘的边距约束来实现，并连接到父级 `ConstraintLayout` 的对应侧边，如\
  \ 图 18-1 所示：\n\n![](img/Image2437.jpg)\n图 18-1\n\n如上图所示，这些约束连接中的每一个都关联有一个边距值，规定了\
  \ widget 距离父布局两侧的固定距离。在这种配置下，无论屏幕大小或设备方向如何，`Button` 对象将始终根据两个约束连接的指定，分别距离父级 `ConstraintLayout`\
  \ 的顶部和右侧边缘 20 和 15 个设备独立像素 (dp)。\n\n虽然上述配置在某些情况下是可以接受的，但它没有提供任何让 `ConstraintLayout`\
  \ 布局引擎调整 widget 位置以响应设备旋转并支持不同尺寸屏幕的灵活性。若要在布局中添加这种响应性，则必须实现对抗约束。\n\n### 18.1.3 对抗约束\n\
  在单个 widget 上沿同一轴运行的两个约束被称为对抗约束。换句话说，左侧和右侧都具有约束的 widget 被认为具有水平对抗约束。例如，图 18-2 展示了在之前的布局中同时添加了水平和垂直对抗约束：\n\
  \n![](img/Image2446.jpg)\n图 18-2\n\n这里需要理解的关键点是，一旦在特定轴上实现了对抗约束，widget 的定位将变为基于百分比而不是坐标。例如，widget\
  \ 不再固定在距离布局顶部 20dp 处，而是定位在距离布局顶部 30% 的位置。在不同的方向以及在更大或更小的屏幕上运行时，`Button` 相对于父布局的尺寸始终位于相同的位置。\n\
  \n现在需要理解的是，图 18-2](#Constraint_Layout.xhtml__idTextAnchor400) 中列出的布局不仅使用了对抗约束，还通过应用约束偏置实现的。\n\
  \n### 18.1.4 约束偏置\n现在已经确定，`ConstraintLayout` 中的 widget 可能会受到对抗约束连接的影响。默认情况下，对抗约束是相等的，导致对应的\
  \ widget 在对抗轴上居中。例如，图 18-3 显示了一个 widget 在包含的 `ConstraintLayout` 中通过水平和垂直对抗约束居中：\n\
  \n![](img/Image2453.jpg)\n图 18-3\n\n为了在对抗约束的情况下调整 widget 位置，`ConstraintLayout` 实现了一项名为\
  \ `constraint bias`（约束偏置）的功能。`Constraint bias` 允许 widget 沿对抗轴的定位通过百分比进行偏移。例如，图 18-4\
  \ 显示了具有 75% 水平偏置和 10% 垂直偏置的上述布局：\n\n![](img/Image2461.jpg)\n图 18-4\n\n下一章题为 在 Android\
  \ Studio 中使用 ConstraintLayout 的指南，将更详细地涵盖这些概念，并解释这些功能是如何集成到 Android Studio 工具中的。然而，在此还需要涵盖\
  \ `ConstraintLayout` 的另外几个领域。\n\n### 18.1.5 链\n`ConstraintLayout` 链提供了一种方法，可以将两个或多个\
  \ widget 的布局行为定义为一个组。链可以在垂直或水平轴上声明，并配置为定义 widget 之间的间距。当 widget 通过双向约束连接时，它们就构成了链。例如，图\
  \ 18-5 展示了三个以此方式连接成链的 widget：\n\n![](img/Image2468.jpg)\n图 18-5\n\n链中的第一个元素是 `chain\
  \ head`（链头），它在垂直链中对应顶部的 widget，或者在水平链中对应最左侧的 widget。整个链的布局行为主要通过设置 `chain head`\
  \ 上的属性来配置。\n\n### 18.1.6 链样式\n`ConstraintLayout` 链的布局行为由应用到 `chain head` widget\
  \ 上的 `chain style` 设置决定。`ConstraintLayout` 类支持以下链样式：\n\n- **Spread Chain（扩散链）**：链内的\
  \ widget 均匀分布在可用空间中。这是链的默认行为。\n![](img/Image2478.jpg)\n图 18-6\n- **Spread Inside\
  \ Chain（内部链）**：链内的 widget 在链头和最后一个 widget 之间均匀分布。链头和最后一个 widget 不在间距分布内。\n![](img/Image2485.jpg)\n\
  图 18-7\n- **Weighted Chain（权重链）**：允许通过权重属性定义链中每个 widget 占据的空间。\n![](img/Image2492.jpg)\n\
  图 18-8\n- **Packed Chain（排列链）**：构成链的 widget 紧凑在一起，没有任何间距。可以使用偏置来控制链相对于父容器的水平或垂直位置。\n\
  ![](img/Image2500.jpg)\n图 18-9\n\n## 18.2 基线对齐\n到为止，本章仅提到了相对于 widget 侧的对齐约束（通常称为侧约束）。然而，一种常见的需求是让\
  \ widget 相对于其显示的内容进行对齐，而不是 widget 自身的边界。为了满足这一需求，`ConstraintLayout` 提供了基线对齐支持。\n\
  \n例如，假设之前的 图 18-1 布局需要一个 `TextView` widget 放置在 `Button` 左侧 40dp 处。在这种情况下，`TextView`\
  \ 需要与 `Button` 视图基线对齐。这意味着 `Button` 内的文本需要与 `TextView` 内的文本垂直对齐。该布局的额外约束需要如 图 18-10\
  \ 所示进行连接：\n\n![](img/Image2508.jpg)\n图 18-10\n\n\n\n\n`TextView` 现在沿 `Button` 的基线垂直对齐，并在水平方向上距离\
  \ `Button` 对象的左边缘 40dp。\n\n## 18.3 配置组件尺寸\n\n控制组件的尺寸是用户界面设计过程中的关键元素。`ConstraintLayout`\
  \ 提供了三个可以设置在单个组件上的选项，用以管理尺寸行为。这些设置针对高度和宽度维度进行单独配置：\n\n- `Fixed`（固定）—— 组件固定为指定的尺寸。\n\
  - `Match Constraint`（匹配约束）—— 允许布局引擎调整组件的大小以满足现有的约束条件。也称为 `AnySize` 或 `MATCH_CONSTRAINT`\
  \ 选项。\n- `Wrap Content`（包裹内容）—— 组件的大小由其包含的内容（即文本或图形）决定。\n\n## 18.4 指南线助手 (Guideline\
  \ Helper)\n\n指南线是 `ConstraintLayout` 中提供的特殊元素，它们为约束条件的连接提供了一个额外的目标。可以在 `ConstraintLayout`\
  \ 实例中添加多个指南线，这些指南线可以被配置为水平或垂直方向。一旦添加，就可以建立布局中的组件到指南线的约束连接。当多个组件需要沿某个轴对齐时，这特别有用。例如，在图\
  \ 18-11 中，包含在 `ConstraintLayout` 中的三个 `Button` 对象沿一条垂直指南线进行约束：\n\n![](img/Image2519.jpg)\n\
  \n图 18-11\n\n## 18.5 组助手 (Group Helper)\n\n`ConstraintLayout` 的此功能允许将组件放置在逻辑组中，并作为一个实体控制这些组件的可见性。`Group`\
  \ 本质上是布局中其他组件的引用列表。一旦定义，更改 `group` 实例的可见性属性（`visible`、`invisible` 或 `gone`）将应用到所有组成员。这使得通过更改单个属性即可轻松隐藏和显示多个组件。单个布局可以包含多个组，一个组件也可以属于多个组。如果组之间发生冲突，则\
  \ XML 文件中最后声明的组具有优先级。\n\n## 18.6 屏障助手 (Barrier Helper)\n\n与指南线类似，屏障（Barrier）是用于约束布局内视图的虚拟视图。与指南线一样，屏障可以是垂直或水平的，并且一个或多个视图可以约束到它（为了避免混淆，这些被称为受约束视图）。然而，与指南线在布局中保持固定位置不同，屏障的位置是由一组所谓的参考视图定义的。引入屏障是为了解决某些情况下频繁发生的视图重叠的问题。例如，考虑下方的图\
  \ 18-12 所示的布局：\n\n![](img/Image2526.jpg)\n\n图 18-12\n\n关于上述布局需要注意的要点是，`View 3` 的宽度设置为匹配约束模式，且该视图的左边缘连接到\
  \ `View 1` 的右边缘。按照目前的实现，增加 `View 1` 的宽度将产生缩小 `View 3` 宽度的效果：\n\n![](img/Image25331.jpg)\n\
  \n图 18-13\n\n但是，如果增加的是 `View 2` 的宽度而不是 `View 1`，就会出现一个问题：\n\n![](img/Image25401.jpg)\n\
  \n图 18-14\n\n显然，由于 `View 3` 仅受 `View 1` 约束，它不会为了适应 `View 2`宽度的增加而调整大小，导致视图重叠。\n\n\
  解决此问题的方法是添加一个垂直屏障并将 `Views 1` 和 `View 2` 分配为屏障的参考视图，以便它们控制屏障的位置。`View 3` 的左边缘将相对于屏障进行约束，使其成为受约束视图。\n\
  \n现在，当 `View 1` 或 `View 2` 的任一宽度增加时，屏障将移动以适应两个中最宽的一个，导致 `View 3` 的宽度相对于新的屏障位置发生变化：\n\
  \n![](img/Image2548.jpg)\n\n图 18-15\n\n在使用屏障时，与单个屏障关联的参考视图和受约束视图的数量没有。\n\n## 18.7\
  \ 流助手 (Flow Helper)\n\n`ConstraintLayout` Flow 助手允许视图组以流式网格布局样式显示。与 `Group` 助手一样，`Flow`\
  \ 包含了对其负责定位的视图引用，并提供了多种配置选项，包括垂直和水平方向、换行行为（包括换行之前的最大组件数量）、间距和对齐属性。链行为也可以应用于 `Flow`\
  \ 布局，包括分散（spread）、内部分散（spread inside）和打包（packed）选项。\n\n图 18-16 表示使用 `Flow` 助手实例以水平模式且无换行设置定位的五个大小相同的按钮的布局：\n\
  \n![](img/as_4.1_flow_no_wrap.jpg)\n\n图 18-16\n\n图 18-17 显示了相同的按钮在水平流配置下，并设置为每第三个组件后换行：\n\
  \n![](img/as_4.1_flow_with_wrap.jpg)\n\n图 18-17\n\n另一方面，图 18-18 显示了设置换行并在链模式使用内部分散的按钮（其效果仅在第二行是可见的）。该配置还设置了\
  \ `gap` 属性以在按钮之间添加间距：\n\n![](img/as_4.1_flow_chain_inside.jpg)\n\n图 18-18\n\n作为\
  \ Flow 助手灵活性的最后一个演示，图 18-19 显示了在水平打包模式下每三个组件换行的五个不同大小的按钮。此外，通过设置 `horizontal-bias`\
  \ 值为 `1.0` 使网格内容右对齐（`0.0` 值会导致左对齐，而 `0.5` 则将网格内容居中）：\n\n![](img/as_4.1_flow_right_align.jpg)\n\
  \n图 18-19\n\n## 18.8 比例\n\n可以使用比例设置定义组件的。例如，可以使用比例约束组件，使得无论如何调整大小，宽度都是高度的两倍。\n\n\
  ## 18.9 ConstraintLayout 的优势\n\n`ConstraintLayout` 提供的灵活性使得旧布局的许多功能可以通过单个布局实例实现，而以前可能需要嵌套多个布局。这具有避免布局嵌套固有问题的优点，因为它允许设计所谓的“扁平化”或“浅层”布局层次，从而减少了布局的复杂性并提高了运行时的用户界面性能。\n\
  \n`ConstraintLayout` 的实现也是为了解决目前市场上各种 Android 设备屏幕尺寸的问题。`ConstraintLayout` 的灵活性使得设计能够响应并适应运行应用程序设备的用户界面变得更容易。\n\
  \n最后，正如在 Android Studio 中使用 ConstraintLayout 的指南章节所示，Android Studio 布局编辑器工具已针对基于\
  \ `ConstraintLayout`的用户界面设计进行了增强。\n\n## 18.10 ConstraintLayout 的可用性\n\n虽然 `ConstraintLayout`\
  \ 是随 Android 7 引入的，但它是作为独立的 Android SDK 支持库提供的，可以兼容到 API  9（Gingerbread）的更旧 Android\
  \ 版本。这使得使用这种新布局的应用程序可以在运行较旧版本 Android 的设备上运行。\n\n## 18.11 总结\n\n\n\n\n\n`ConstraintLayout`\
  \ 是随 Android 7 引入的一种布局管理器。它的设计旨在便于创建灵活的布局，以适应目前市面上许多 Android 设备的尺寸和方向。`ConstraintLayout`\
  \ 使用约束（constraints）来控制控件相对于父 `ConstraintLayout` 实例、辅助线（guidelines）、栅障（barriers）以及布局中其他控件的对齐和定位。`ConstraintLayout`\
  \ 是新创建的 Android Studio 项目的默认布局，也是设计用户界面布局时的推荐选择。通过这种简单而灵活的布局管理方法，可以极其轻松地实现复杂且响应式的用户界面。\n\
  \n## 19. 在 Android Studio 中使用 ConstraintLayout 的指南\n\n正如前面的章节中多次提到的，Google 对 Android\
  \ Studio 布局编辑器工具进行了重大更改，其中许多更改仅是为了支持使用 `ConstraintLayout` 进行用户界面布局设计。在上一节概述了 `ConstraintLayout`\
  \ 的基本概念后，本章将详细详细探讨这些概念，同时概述布局编辑器工具如何允许设计和实现基于 `ConstraintLayout` 的用户界面。\n\n## 19.1\
  \ 设计与布局视图\n\n标题为“Android Studio 布局编辑器指南”的章节解释了 Android Studio 布局编辑器工具提供了两种方式来查看活动\
  \ 的用户界面布局，即设计视图（Design）和布局视图（Layout，也称为蓝图视图）。这些布局视图可以单独显示，也可以像图 19-1 那样并排显示：\n\n\
  ![](img/as_4.1_layout_editor_previews.jpg)\n\n图 19-1\n\n`Design` 视图（位于图左侧）呈现了布局的“所见即所得”表示，其中布局以其在运行应用中的形式显示。相反，`Layout`\
  \ 视图显示蓝图风格的视图，其中控件由阴影轮廓表示。如上面的图 19-1 所示，`Layout` 视图还显示了约束连接（在本例中，是用于将按钮在布局中居中的相对约束）。当选择布局中的特定控件或当鼠标指针悬停在设计区域上时，这些约束也会叠加到\
  \ `Design` 视图上，如图图 19-2 所示：\n\n![](img/as_4.1_layout_editor_design_view.jpg)\n\n\
  图 19-2\n\n两种视图中约束连接的外观可以使用图 19-3 所示的 `View Options` 菜单进行更改：\n\n![](img/as_4.0_layout_view_options.jpg)\n\
  \n图 19-3\n\n除了显示用户界面布局的两种模式外，布局编辑器工具还提供了三种不同的方法为特定的布局设计建立所需的约束。\n\n## 19.2 自动连接模式\n\
  \n`Autoconnect`（自动连接）顾其实名，会在项目添加到布局时自动建立约束连接。可以使用图 19-4 所示的工具栏按钮启用或禁用 `Autoconnect`\
  \ 模式：\n\n![](img/as_3.2_constraint_autoconnect_button.jpg)\n\n图 19-4\n\n`Autoconnect`\
  \ 模式使用算法根据控件的位置以及控件与父布局边界和布局中其他元素的接近程度来决定建立的最佳约束。如果任何自动约束连接未能提供预期的行为，可以像本章稍后概述的那样手动修改。\n\
  \n## 19.3 推断模式\n\n`Inference`（推断）模式使用涉及算法和概率的启发式方法，在控件已添加到布局中后自动实现约束连接。这种模式通常在关闭\
  \ `Autoconnect` 功能且在没有任何约束连接的情况下将对象添加到布局时使用。这允许通过从调色板将对象拖放到布局画布上，并不断更改尺寸和位置，直到布局符合要求，从而简单地设计布局。从本质上说这涉及到在不担心约束的情况下“绘制”布局。`Inference`\
  \ 模式也可以在设计过程中的任何时候使用，填充布局中缺失的约束。\n\n点击 `Infer constraints`（推断约束）按钮（图 19-5）时，约束会自动添加到布局中：\n\
  \n![](img/as_3.2_constraint_infer_button.jpg)\n\n图 19-5\n\n与 `Autoconnect` 模式一样，布局编辑器工具始终存在推断错误约束的可能性，尽管可以手动进行修改和修正。\n\
  \n## 19.4 手动操作约束\n\n实现约束连接的第三种选择是手动进行。这样做时，理解布局编辑器工具中控件周围出现的各种手将非常有帮助。例如，考虑图 19-6\
  \ 所示的控件：\n\n![](img/as_4.1_constraint_handles.jpg)\n\n图 19-6\n\n很显然，像弹簧一样的线条 (A)\
  \ 代表从控件侧边到目标的已建立的约束连接。对象每个角的小正方形标记 (B) 是缩放手柄，点击并拖动它们时可以调整控件大小。位于控件每侧的小圆形手柄 (C) 是侧约束锚点。要创建约束连接，点击手柄并将生成的线拖到要连接的元素（例如辅助线、父布局边界或另一个控件），如图图\
  \ 19-7 所示。当连接到另一个控件侧侧时，只需将线拖到该控件的侧约束手柄并在高亮时释放。\n\n![](img/as_4.1_constraint_drag_line.jpg)\n\
  \n图 19-7\n\n如果将约束线拖到控件但未连接到约束手柄，布局编辑器将显示一个包含可以连接的侧列表菜单。例如，在图 19-8 中，约束可以连接到目标按钮控件的顶部或底部：\n\
  \n![](img/as_4.1_constraint_between_widgets.jpg)\n\n图 19-8\n\n额外的标记指示基线约束的锚点，使用控件内部的内容（而非外部边缘）作为对齐点。要显示此标记，只需右键点击控件并选择\
  \ `Show Baseline` 菜单选项。从基线约束手柄建立约束连接，只需将鼠标指针悬停手柄上直到开始闪烁，然后点击并拖到目标（例如另一个控件的基线锚点，如图图\
  \ 19-9 所示）。当目标锚点开始闪绿光时，释放鼠标按钮建立约束连接：\n\n![](img/as_4.1_constraint_highlighted.jpg)\n\
  \n图 19-9\n\n要隐藏基线锚点，再次右键点击控件并选择 `Hide Baseline` 菜单选项。\n\n\n\n\n\n也可以通过位于 `Attributes`\
  \ 工具窗口的 `Inspector` 面板向 Android Studio 布局编辑器工具中的视图添加约束，如 图 19-10 所示。中心正方形表示当前选中的视图，正方形周围的区域则表示约束（如果有的话），这些约束应用在视图的相应边上：\n\
  \n![](img/as_3.5_constraint_attributes.jpg)\n\n图 19-10\n\n视图某侧缺少约束将由一条指向包含加号的蓝色圆圈的虚线表示（如上图中视图底部边缘所示）。要添加约束，只需点击此蓝色圆圈，布局编辑器将添加一个约束，连接到它认为布局内最合适的目标上。\n\
  \n### 19.6 在 Attributes 窗口中查看约束\n\n通过显示 `Attributes` 工具窗口的 `Constraints` 部分，可以查看当前选中小部件上配置的约束列表，如下方的\
  \ 图 19-11 所示：\n\n![](img/as_3.5_attributes_constraints_list.jpg)\n\n图 19-11\n\n\
  点击列表中的约束将在设计布局中选中该约束。\n\n### 19.7 删除约束\n\n要删除单个约束，只需在设计布局或 `Attributes` 工具窗口中选中该约束使其高亮（例如，在\
  \ 图 19-12 中所示，选中了最右侧的约束），然后按下键盘上的 delete 键。该约束将从布局中移除。\n\n![](img/as_4.1_constraint_highlighted1.jpg)\n\
  \n图 19-12\n\n另一种选项是在按住 `Ctrl`（macOS 上为 `Cmd`）键的同时，将鼠标指针悬停在约束锚点上，并在它变为红色后点击该锚点：\n\
  \n![](img/as_4.1_constraint_delete.jpg)\n\n图 19-13\n\n或者，通过右键点击小部件并选择 `Clear Constraints\
  \ of Selection` 菜单选项来移除该小部件上的所有约束。\n\n要移除布局中每个小部件的所有约束，请使用 图 19-14 中高亮的工具栏按钮：\n\n\
  ![](img/as_3.2_constraint_remove_all.jpg)\n\n图 19-14\n\n### 19.8 调整约束偏置 (Bias)\n\
  \n在上一章中，概述了使用偏置设置来倾向于一个相对约束而非另一个的概念。Android Studio 布局编辑器工具中的偏置是通过位于 `Attributes`\
  \ 工具窗口的 `Inspector` 进行调整的如 图 19-15 所示。图中箭头指示的两个滑块用于控制当前选中小部件的垂直和水平相对约束的偏置。\n\n![](img/as_3.2_constraint_bias_sliders.jpg)\n\
  \n图 19-15\n\n### 19.9 理解 ConstraintLayout 边距\n\n约束可以配合边距（margins）使用，以便在部件与另一个元素（如另一个小部件、辅助线或父布局的边缘）之间实现固定间隙。例如，考虑应用于\
  \ 图 19-16 中 `Button` 对象的水平约束：\n\n![](img/as_4.1_constraint_no_margins.jpg)\n\n图\
  \ 19-16\n\n按照目前的配置，水平约束运行到父 `ConstraintLayout` 的左边缘和右边缘。因此，该小部件具有相对水平约束，表明 `ConstraintLayout`\
  \ 布局引擎在运行时小部件的实际位置方面有一定的裁量权。这使得布局具有灵活性，以适应不同的屏幕尺寸和设备方向。水平偏置设置还能控制小部件的位置，一直到布局的右侧。例如，图\
  \ 19-17 显示了应用了 100% 水平偏置的同一个按钮：\n\n![](img/as_4.1_constraint_bias_100.jpg)\n\n图\
  \ 19-17\n\n`ConstraintLayout` 边距可能会出现在约束连接的末端，代表一个固定间隙，即使在调整偏置或响应活动中其他地方的变化时，部件也无法移动到该间隙内。在\
  \ 图 19-18 中，右侧约束现在包含一个 `50dp` 的边距，即使偏置仍设为 100%，部件也无法移动到其中。\n\n![](img/as_4.1_constraint_margin_50.jpg)\n\
  \n图 19-18\n\n小部件上现有的边距值可以在 `Inspector` 中进行修改。如 图 19-19 所示，正在使用下拉菜单将当前选中小部件的右侧边距更改为\
  \ `16dp`。或者，点击当前值也允许在字段中输入数字。\n\n![](img/as_3.2_constraint_set_margins.jpg)\n\n\
  图 19-19\n\n新约束的默认边距可以通过 图 19-20 所示的工具栏选项随时更改：\n\n![](img/as_3.2_constraint_margin.jpg)\n\
  \n图 19-20\n\n### 19.10 相对约束与偏置的重要性\n\n正如上一章中讨论的，在使用 `ConstraintLayout` 时，相对约束、边距和偏置是响应式布局设计的基石。当小部件没有相对约束时，这些约束本质上是边距约束。这在布局编辑器中通过带有边距测量值的实线表示，如\
  \ 图 19-21 所示：\n\n![](img/as_4.1_constraints_opposing.jpg)\n\n图 19-21\n\n上述约束将将部件固定在该位置。结果是，当设备旋转到横屏模式时，部件将不再可见，因为垂直约束将其推出了设备边缘（如\
  \ 图 19-22 所示）。如果在比设计时更小的设备上运行程序，也会出现类似的问题。\n\n![](img/as_4.1_constraints_opposing_landscape.jpg)\n\
  \n图 19-22\n\n当实现相对约束时，约束连接由弹簧状锯齿线表示（弹簧比喻旨在指示部件的位置未固定在绝对 `X` 和 `Y` 坐标上）：\n\n![](img/as_4.1_constraints_opposing_constrained.jpg)\n\
  \n图 19-23\n\n在上述布局中，垂直和水平偏置设置已配置，使得部件始终距离底部 90%，距离左侧边缘 35%。因此，当旋转时，小部件仍然可见，并相对于屏幕尺寸保持在相同位置：\n\
  \n![](img/as_4.1_constraints_opposing_constrained_landscape.jpg)\n\n图 19-24\n\n\
  在设计响应式且自适应的用户界面布局时，手动设计用户界面布局以及修正自动创建的约束时，考虑到偏置和相对约束是非常重要的。\n\n### 19.11 配置小部件尺寸\n\
  \n`ConstraintLayout` 中小部件的内部尺寸也可以通过 `Inspector` 进行配置。正如上一章概述的，小部件尺寸可以设置为 `wrap content`、`fixed`\
  \ 或 `match constraint` 模式。当前选中小部件每个维的现行设置显示在 `Inspector` 中代表小部件的正方形内，如 图 19-25 所示：\n\
  \n![](img/as_3.2_constraint_widget_dimensions.jpg)\n\n图 19-25\n\n\n\n\n\n在上方图中，水平和垂直维度都被设置为“包裹内容”（wrap\
  \ content）模式（由向内的箭头符号指示）。检查器使用以下视觉指示器表示三种维度模式：\n\n| 固定大小 (Fixed Size) | 图像 (Image)\
  \ |\n| :--- | :--- |\n| 固定大小 (Fixed Size) | ![](img/Image2826.jpg) |\n| 匹配约束 (Match\
  \ Constraint) | ![](img/Image2834.jpg) |\n| 包裹内容 (Wrap Content) | ![](img/Image2844.jpg)\
  \ |\n\n表 19-1\n\n只需点击指示器即可在三个不同的设置之间切换。当布局编辑器中视图的维度设置为匹配约束（match constraint）模式时，视图相应的边将用类似弹簧的线条而不是普通的直线绘制。例如，在图\
  \ 19-26 中，仅视图的宽度设置为匹配约束：\n\n![](img/Image2855.jpg)\n\n图 19-26\n\n此外，可以使用“水平扩展”（Expand\
  \ horizontally）和“垂直扩展”（Expand vertically）选项将组件的大小在水平或垂直方向上扩展到布局约束和其他组件允许的最大值。这些选项可以通过右键点击布局内的组件并从生成的菜单中选择“组织”（Organize）选项来访问（图\
  \ 19-27）。使用时，当前选中的组件将在水平或垂直方向上增大以填充其周围的可用空间。\n\n![](img/as_4.1_constraint_organize_menu.jpg)\n\
  \n图 19-27\n\n## 19.12 设计时定位\n\n名为“Android Studio 布局编辑器工具指南”的章节介绍了 `tools` 命名空间的概念，并解释了如何使用它来设置仅在布局编辑器中生效可见性属性。在后台，Android\
  \ Studio 还使用 `tools` 属性在组件在没有约束的情况下放置在布局上时将其保持在位置。例如，想象在禁用自动连接模式时将一个 `Button` 放置在布局上。虽然组件在预览画布上似乎处于正确位置，但当运行应用时，它将出现在屏幕的左上角。这是因为组件没有约束告诉父布局\
  \ `ConstraintLayout` 应该将其放在哪里。\n\n组件在布局编辑器中出现在正确位置的原因是 Android Studio 设置了绝对的 `X`\
  \ 和 `Y` 定位 `tools` 属性，以便在添加约束之前将其保持在正确位置。在 XML 布局文件中，读取可能如下：\n\n```xml\n<Button\n\
  \    android:id=\"@+id/button4\"\n    android:layout_width=\"wrap_content\"\n  \
  \  android:layout_height=\"wrap_content\"\n    android:text=\"Button\"\n    tools:layout_editor_absoluteX=\"\
  111dp\"\n    tools:layout_editor_absoluteY=\"88dp\" />\n```\n\n一旦为组件添加了足够的约束，布局编辑器将移除这些\
  \ `tools` 属性。快速识别哪些组件缺少约束（无需等待应用运行）的实用技巧是：点击图 19-28 中高亮显示的按钮来切换 `tools` 位置可见性。任何跳转到左上角的组件都未完全约束，并通过临时的\
  \ `tools` 绝对 `X` 和 `Y` 定位属性保持位置。\n\n![](img/as_4.1_toggle_tools_positions.jpg)\n\
  \n图 19-28\n\n## 19.13 添加辅助线\n\n辅助线提供了额外的元素，约束可以锚定在其。可以通过右键点击布局并选择“添加垂直辅助线”（Add Vertical\
  \ Guideline）或“添加水平辅助线”（Add Horizontal Guideline）菜单选项，或使用如图 19-29 所示的工具栏菜单选项来添加辅助线：\n\
  \n![](img/as_4.1_guidelines_menu.jpg)\n\n图 19-29\n\n也可以从调色板（Palette）的“帮助”（Helpers）部分拖动水平和垂直\
  \ `Guidelines` 并将其到布局画布或“组件树”（Component Tree）面板：\n\n![](img/as_4.1_add_guideline_from_palette.jpg)\n\
  \n图 19-30\n\n添加后，辅助线将以虚线的形式显示在布局中，只需点击并拖动线条即可移动。要建立到辅助线的约束连接，点击组件的约束处理程序，并在释放之前拖动到辅助线。在图\
  \ 19-31 中，两个 `Buttons` 的左侧通过约束连接到一条垂直辅助线。\n\n垂直辅助线的位置可以指定为距离父布局左侧或右侧的绝对距离（水平辅助线为顶部或底部）。例如，上方图中的垂直辅助线距离父布局左边缘\
  \ `96dp`。\n\n![](img/as_4.1_constraint_guidline.jpg)\n\n图 19-31\n\n或者，辅助线可以定位为父布局总宽度或高度的百分比。要在这三种模式之间切换，请选择辅助线并点击辅助线顶部或起始处的圆（取决于辅助线是垂直还是水平的）。图\
  \ 19-32 显示了按百分比定位的辅助线：\n\n![](img/as_4.1_constraint_guidline.jpg)\n\n图 19-32\n\n\
  ## 19.14 添加屏障\n\n屏障可以通过右键点击布局并从“帮助”菜单中选择“添加垂直屏障”（Add Vertical Barrier）或“添加水平屏障”（Add\
  \ Horizontal Barrier），或使用如图 19-29 所示的工具栏选项来添加。或者，在调色板的“帮助”部分找到 `Barrier` 类型并将其拖放到布局画布或“组件树”面板。\n\
  \n一旦向布局添加了屏障，它将作为一个项出现在“组件树”中：\n\n![](img/as_4.1_layout_barrier.jpg)\n\n图 19-33\n\
  \n要将视图作为引用视图（即控制屏障位置的视图），只需从“组件树”中将组件拖到屏障项上。在图 19-34 中，名为 `textView1` 和 `textView2`\
  \ 的组件已被分配为 `barrier1` 的引用组件：\n\n![](img/as_4.1_layout_barrier_widgets.jpg)\n\n图\
  \ 19-34\n\n在添加引用视图后，需要配置屏障以指定屏障相对于这些视图的方向。这是 `barrier direction` 设置，当在“组件树”中选择屏障时，在“属性”（Attributes）窗口中定义：\n\
  \n![](img/as_4.1_layout_barrier_direction.jpg)\n\n图 19-35\n\n下图显示了一个包含屏障的布局，其中 `textView1`\
  \ 和 `textView2` 作为引用视图，`textView3` 作为约束视图。由于屏障从引用视图的末端推向约束视图，因此屏障方向设置为 `end`：\n\n\
  ![](img/as_3.5_constraints_barrier.jpg)\n\n图 19-36\n\n## 19.15 添加分组\n\n要向布局添加组（Group），右键点击布局并从“帮助”菜单中选择“添加分组”（Add\
  \ Group）选项，或使用如图 19-29 所示的工具栏选项。或者，在调色板的“帮助”部分找到 `Group` 项并将其拖放到布局画布或“组件树”面板。\n\n\
  要将组件添加到组中，在“组件树”中选择它们并将其拖放到分组项上。图 19-37 显示了三个选中的组件被添加到一个组中：\n\n![](img/as_4.1_add_widgets_to_group.jpg)\n\
  \n图 19-37\n\n\n\n\n\n组引用的任何组件都将以斜体形式显示在 `Component Tree`（组件树）中组条目下方，如图 19-38 所示。要从组中移除组件，只需选择该组件并按下键盘上的删除键：\n\
  \n![](img/as_4.1_group_widget_list.jpg)\n图 19-38\n\n一旦将组件分配给组，可以使用 `Attributes`（属性）工具窗口的\
  \ `Constraints`（约束）部分修改可见性设置：\n\n![](img/as_4.1_group_visibility.jpg)\n图 19-39\n\
  \n### 19.16 使用 Flow（流）辅助工具\n\n可以使用菜单或 `Palette`（调色板）添加流辅助工具，如之前其他辅助工具所述。与 `Group`（组）辅助工具（图\
  \ 19-37）一样，通过将组件在 `Component Tree` 中拖动到 `Flow` 条目上，即可将其添加到 `Flow` 实例中。添加流辅助工具并分配组件后，在\
  \ `Component Tree` 中选择它，并使用 `Attribute` 工具窗口的 `Common Attributes`（通用属性）部分配置流布局行为：\n\
  \n![](img/as_4.1_flow_attributes.jpg)\n图 19-40\n\n### 19.17 组件组的对齐与分布\n\n`Android\
  \ Studio Layout Editor`（布局编辑器）工具提供了一系列在布局中选择两个或多个组件时可以执行的对齐和分布操作。只需按住 Shift 点击要包含在操作中的每个组件，在布局上点击鼠标右键，并从\
  \ `Align`（对齐）菜单显示的许多选项中选择一项：\n\n![](img/as_4.1_constraints_align.jpg)\n图 19-41\n\
  \n如下方的图 19-42 所示，这些选项作为 `Layout Editor` 工具栏上的按钮可用：\n\n![](img/as_4.1_constraints_align_menu.jpg)\n\
  图 19-42\n\n同样，`Pack`（打包）菜单（图 19-43）可用于共同重新定位所选组件，使其在垂直或水平方向上紧凑排列在一起。它通过更改组件的绝对 `x`\
  \ 和 `y` 坐标来实现，但不会应用任何约束。相反，`Pack` 菜单中的两个分布选项会移动所选组件，使其在垂直或水平轴上间距均匀，并在视图之间应用约束以保持这种间距。\n\
  \n![](img/as_3.2_constraints_pack_menu.jpg)\n图 19-43\n\n### 19.18 将其他布局转换为 ConstraintLayout\n\
  \n对于使用了一个或多个其他 Android 布局类（如 `RelativeLayout` 或 `LinearLayout`）的现有用户界面布局，`Layout\
  \ Editor` 工具提供了将用户界面转换为使用 `ConstraintLayout` 的选项。\n\n当 `Layout Editor` 工具打开并处于 `Design\
  \ mode`（设计模式）时，`Component Tree` 面板显示在 `Palette` 下方。要将布局转换为 `ConstraintLayout`，在\
  \ `Component Tree` 中找到它，右键点击它并选择 `Convert <current layout> to Constraint Layout`\
  \ 菜单选项：\n\n![](img/as_3.4_convert_to_constraintlayout.jpg)\n图 19-44\n\n选择此菜单选项时，Android\
  \ Studio 将将所选布局转换为 `ConstraintLayout`，并使用推理建立设计以匹配原始布局类型行为的约束。\n\n## 19.19 总结\n\n\
  重新设计的 `Layout Editor` 工具结合 `ConstraintLayout`，使得使用 Android Studio 设计复杂的用户界面布局成为一个相对快速且直观的过程。本章详细介绍了约束（constraints）、外边距（margins）和偏置（bias）的概念，同时探索了基于\
  \ `ConstraintLayout` 的设计如何集成到 `Layout Editor` 工具中。\n\n### 20. 在 Android Studio 中处理\
  \ ConstraintLayout 链（Chains）和比例（Ratios）\n\n之前的章节介绍了 `ConstraintLayout` 类的关键功能，并概述了在\
  \ `Android Studio Layout Editor` 中基于 `ConstraintLayout` 的用户界面设计的最佳实践。尽管 `ConstraintLayout`\
  \ 链和比例的概念在名为“A Guide to the Android ConstraintLayout`的章节中已经过，但我们尚未讨论如何在 `Layout\
  \ Editor` 中利用这些功能。因此，本章的重点是提供在使用 `ConstraintLayout` 类时创建和管理链和比例的实际步骤。\n\n## 20.1\
  \ 创建链（Chain）\n\n链可以通过在 Activity 的 XML 布局资源文件中添加几行代码，或者使用 `Layout Editor` 的某些链特定功能来实现。\n\
  \n考虑一个由三个 `Button` 组件组成的布局，这些组件被约束为定位在 `ConstraintLayout` 父容器的左上角、顶部中央和右上角，如图 20-1\
  \ 所示：\n\n![](img/as_4.1_layout_buttons_no_chain.jpg)\n图 20-1\n\n为了表示此类布局，XML 布局资源文件可能包含以下按钮组件的条目：\n\
  \n```xml\n<Button\n    android:id=\"@+id/button1\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:layout_marginStart=\"\
  8dp\"\n    android:layout_marginTop=\"16dp\"\n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"\
  0.5\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n<Button\n    android:id=\"@+id/button2\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:layout_marginEnd=\"\
  8dp\"\n    android:layout_marginStart=\"8dp\"\n    android:layout_marginTop=\"16dp\"\
  \n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"0.5\"\n\
  \    app:layout_constraintEnd_toStartOf=\"button3\"\n    app:layout_constraintStart_toEndOf=\"\
  button1\"\n    app:layout_constraintTop_toTopOf=\"parent\" />\n<Button\n    android:id=\"\
  @+id/button3\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:layout_marginEnd=\"8dp\"\n    android:layout_marginTop=\"\
  16dp\"\n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"\
  0.5\"\n    app:layout_constraintEnd_toEndOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n```\n\n目前的配置下，没有双向约束将这些组件组合成链。为了解决这个问题，需要添加从 `button1` 的右侧到 `button2`\
  \ 的左侧，以及从 `button3` 的左侧到 `button2` 的右侧的约束，如下：\n\n```xml\n<Button\n    android:id=\"\
  @+id/button1\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:layout_marginStart=\"8dp\"\n    android:layout_marginTop=\"\
  16dp\"\n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"\
  0.5\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\"\n    app:layout_constraintEnd_toStartOf=\"button2\" />\n<Button\n    android:id=\"\
  @+id/button2\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:layout_marginEnd=\"8dp\"\n    android:layout_marginStart=\"\
  8dp\"\n    android:layout_marginTop=\"16dp\"\n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"\
  0.5\"\n    app:layout_constraintEnd_toStartOf=\"button3\"\n    app:layout_constraintStart_toEndOf=\"\
  button1\"\n    app:layout_constraintTop_toTopOf=\"parent\" />\n<Button\n    android:id=\"\
  @+id/button3\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:layout_marginEnd=\"8dp\"\n    android:layout_marginTop=\"\
  16dp\"\n    android:text=\"Button\"\n    app:layout_constraintHorizontal_bias=\"\
  0.5\"\n    app:layout_constraintEnd_toEndOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\"\n    app:layout_constraintStart_toEndOf=\"button2\" />\n```\n\n\n\n\n\n\
  通过这些更改，小部件现在配置了双向水平约束。这在本质上构成了一个 `ConstraintLayout` 链，它在布局编辑器中通过链连接以视觉形式表示，如下方的图\
  \ 20-2 所示。请注意，在此配置下，链默认使用了散开（spread）链样式。\n\n![](img/as_4.1_layout_horizontal_chain.jpg)\n\
  \n图 20-2\n\n也可以通过右键点击其中一个视图并选择 `Chains` -> `Create Horizontal Chain（创建水平链）或 `Chains`\
  \ -> `Create Vertical Chain（创建垂直链）菜单选项来创建链。\n\n## 20.2 更改链样式\n\n如果没有配置任何链样式，`ConstraintLayout`\
  \ 将默认使用散开链样式。可以通过右键点击链中的任何小部件并选择 `Cycle Chain Mode`循环链模式菜单选项来更改链样式。每点击一次菜单选项，样式就会按照散开（spread）、内部散开（spread\
  \ inside）和打包（packed）的顺序切换到另一个设置。\n\n或者，也可以在属性工具窗口中指定样式，展开 `layout_constraints` 属性，并根据链的方向更改\
  \ `horizontal_chainStyle` 或 `vertical_chainStyle` 属性：\n\n![](img/as_4.1_chain_style_attribute.jpg)\n\
  \n图 20-3\n\n## 20.3 内部散开链样式\n\n图 20-4 插图了使用上述技术将链样式更改为内部散开链的效果：\n\n![](img/as_4.1_layout_horizontal_chain_spread_inside.jpg)\n\
  \n图 20-4\n\n## 20.4 打包链样式\n\n使用相同的技术，将链样式属性更改为 `packed（打包）`会导致布局发生变化，如图 20-5 所示：\n\
  \n![](img/as_4.1_layout_horizontal_chain_packed.jpg)\n\n图 20-5\n\n## 20.5 带有偏性的打包链样式\n\
  \n打包链的位置可以通过应用偏性（bias）值来影响。偏性可以是 0.0 到 1.0 之间的任何值，其中 0.5 代表父容器的中心。偏性通过选择链头小部件并在属性面板的\
  \ `layout_constraintHorizontal_bias` 或 `layout_constraintVertical_bias` 属性中赋值来控制。图\
  \ 20-6 展示了一个水平偏性 设置为 0.2 的打包链：\n\n![](img/as_4.1_layout_horizontal_chain_packed_bias.jpg)\n\
  \n图 20-6\n\n## 20.6 加权链\n\n要探索的链的最后一个区域涉及对单个小部件进行加权，以控制链中每个小部件在可用空间中所占据的空间。加权链可以使用散开链样式实现，且链中任何要响应权重属性的小部件都必须将相应的尺寸属性（垂直链为\
  \ `height`，水平链为 `width`）配置为匹配约束（match constraint）模式。小部件尺寸的匹配约束模式可以通过选择小部件、显示属性面板并将尺寸更改为\
  \ `match_constraint`（等同于 `0dp`）来配置。例如，在图 20-7 中，按钮的 `layout_width` 约束已设置为 `match_constraint`\
  \ (`0dp`)，表示该小部件的宽度将根据现有的约束设置确定：\n\n![](img/as_3.5_chain_match_constraints.jpg)\n\
  \n图 20-7\n\n假设已选择散开链样式，并且三个按钮都已配置为宽度设置为匹配约束，则链中的小部件将等量扩展以填充可用空间：\n\n![](img/as_4.1_layout_horizontal_chain_match_constraints.jpg)\n\
  \n图 20-8\n\n每个小部件相对于链中其他小部件占据的空间量可以通过向小部件添加权重属性来控制。图 20-9 展示了将 `button1` 的 `layout_constraintHorizontal_weight`\
  \ 属性设置为 4，将 `button2` 和 `button3` 分别设置为 2 的效果：\n\n![](img/as_4.1_layout_horizontal_chain_weight.jpg)\n\
  \n图 20-9\n\n由于这些权重值，`button1` 占据了一半的空间 (4/8)，而 `button2` 和 `button3` 分别占据空间的四分之一\
  \ (2/8)。\n\n## 20.7 使用比例\n\n`ConstraintLayout` 比例允许小部件的一个维度相对于该小部件的另一个维度（也称为宽高比）进行尺寸调整。例如，可以将宽高比设置应用到\
  \ `ImageView` 上，以确保其宽度始终是高度的两倍。\n\n尺寸比例约束通过将受约束的维度设置为匹配约束模式，并在该小部件上将 `layout_constraintDimensionRatio`\
  \ 属性配置为所需的比例来实现。该比例值可以指定为浮点值或宽:高比例设置。例如，下面的 XML 片段在 `ImageView` 小部件上配置了 2:1 的比例：\n\
  \n```xml\n<ImageView\n    android:layout_width=\"0dp\"\n    android:layout_height=\"\
  100dp\"\n    app:layout_constraintDimensionRatio=\"2:1\" />\n```\n\n上面的示例演示了当仅设置一个维度为匹配约束时如何配置比例。当两个维度都设置为匹配约束时，也可以应用比例。这涉及在指定的比例前面加上\
  \ `H` 或 `W`，以指示哪个维度是相对于另一个维度受约束的。例如，考虑下面的 XML 片段：\n\n```xml\n<ImageView\n    android:layout_width=\"\
  0dp\"\n    android:layout_height=\"0dp\"\n    android:id=\"@+id/imageView\"\n  \
  \  app:layout_constraintBottom_toBottomOf=\"parent\"\n    app:layout_constraintRight_toRight=\"\
  parent\"\n    app:layout_constraintLeft_toLeft=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\"\n    app:layout_constraintDimensionRatio=\"W,1:3\" />\n```\n\n在上面的示例中，高度将根据应用于其上的约束来定义。在这种情况下，约束配置为使其附加到父容器的顶部和底部，实质上拉伸小部件以填充整个父容器的高度。另一方面，宽度维度被约束为高度的三分之一。因此，无论布局在什么尺寸的屏幕或方向上显示，`ImageView`\
  \ 的高度始终与父容器相同，宽度为高度的三分之一。\n\n相同的结果也可以无需手动编辑 XML 资源文件来实现。每当小部件维度设置为匹配约束模式时，属性面板的检查器区域就会出现比例切换开关。图\
  \ 20-10 展示了按钮小部件的布局宽度和高度属性分别设置为匹配约束模式和 10dp，并突出显示了部件尺寸预览中的比例切换开关：\n\n![](img/as_3.2_toggle_aspect_ratio_constraint.jpg)\n\
  \n图 20-10\n\n默认情况下，比例尺寸开关是关闭的。点击该开关将启用比例约束并显示可以更改比例的额外字段：\n\n![](img/as_3.2_toggle_aspect_ratio_settings.jpg)\n\
  \n图 20-11\n\n## 20.8 总结\n\n链和比例都是 `ConstraintLayout` 类的强大功能，旨在为 Android 应用程序中设计灵活且响应式的用户界面布局提供更多选项。如本文所述，Android\
  \ Studio 布局编辑器已经增强，以便在用户界面设计过程中使用这些功能更加方便。\n\n## 21\\. Android Studio 布局编辑器 ConstraintLayout\
  \ 教程\n\n\n\n\n\n到目前为止，为 Android 应用设计用户界面最简单且高效的方法是使用 Android Studio Layout Editor（布局编辑器）。本章的目标概述如何使用这种方法创建一个基于\
  \ `ConstraintLayout` 的用户界面。本章包含的练习也将作为一次机会，概述从一个“裸壳”Android Studio 项目开始创建一个 Activity（活动）的过程。\n\
  \n在介绍了 Android Studio Layout Editor 之后，本章还将介绍 Layout Inspector（布局检查器）工具。\n\n## 21.1\
  \ Android Studio Layout Editor 工具示例\n\n本示例的第一步是创建一个新的 Android Studio 项目。因此，请先启动\
  \ Android Studio，并通过选择 `File -> Close Project` 菜单选项关闭之前打开的项目。\n\n从欢迎界面选择 `Create\
  \ New Project`（创建新项目）快速启动选项。在之前的示例中，我们要求 Android Studio 为项目创建一个模板 Activity。然而，我们将通过本教程学习如何手动创建一个全新的\
  \ Activity 以及相应的布局资源文件，因此在点击 `Next` 按钮之前，请确保选择了 `No Activity`（无 Activity）选项。\n\n\
  在 `Name` 字段中输入 `LayoutSample`，并指定 `com.ebookfrenzy.layoutsample` 为包名。在点击 `Finish`\
  \ 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将 `Language` 菜单改为\
  \ `Java`。\n\n## 21.2 创建新 Activity\n\n一旦项目创建过程完成，将出现 Android Studio 主窗口。项目的第一步是创建一个新的\
  \ Activity。这将是一次非常有价值的学习练习，因为在开发 Android 应用的过程中，有很多情况需要从零开始创建新的 Activity。\n\n如果\
  \ `Project` 工具窗口尚未显示，请使用快捷键 `Alt-1/Cmd-1` 将其显示。显示后，通过点击 `Project` 窗口中条目右侧指向右的箭头来展开层级结构。这里的目标是访问项目层级中的\
  \ `app -> java -> com.ebookfrenzy.layoutsample` 文件夹。一旦包名可见，右键点击它，并如图 21-1 所示所示选择\
  \ `New -> Activity -> Empty Activity` 菜单选项。或者，选择 `New -> Activity -> Gallery...`\
  \ 选项来浏览可用模板并在 `New Android Activity` 对话框中进行选择。\n\n![](img/Image2435.jpg)\n\n图 21-1\n\
  \n在生成的 `New Android Activity` 对话框中，将新 Activity 命名为 `MainActivity`，布局命名为 `activity_main`。Activity\
  \ 当然需要一个布局资源文件，因此确保启用 `Generate Layout File`（生成布局文件）选项。\n\n为了让应用程序能够在设备上运行，需要指定一个\
  \ Activity 作为启动 Activity（launcher activity）。如果没有启动 Activity，操作系统将不知道在应用程序首次启动时启动哪个\
  \ Activity，导致应用程序无法启动。由于此示例只有一个 Activity，它需要被指定为应用程序的启动 Activity，因此在点击 `Finish`\
  \ 按钮之前，请确保 `Launcher Activity` 选项已启用。\n\n此时，Android Studio 应该已向项目添加两个文件。Activity\
  \ 的 Java 源代码文件位于 `app -> java -> com.ebookfrenzy.layoutsample` 文件夹中。\n\n此外，用户界面的\
  \ XML 布局文件应该已在 `app -> res -> layout` 文件夹中创建。注意此 Activity 使用了 `Empty Activity` 模板，因此布局完全包含\
  \ `activity_main.xml` 文件中，没有单独的内容布局文件。\n\n最后，新的 Activity 应该已添加到 `AndroidManifest.xml`\
  \ 文件中并指定为启动 Activity。清单文件可以在项目窗口的 `app -> manifests` 文件夹下找到，并包含以下 XML：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.layoutsample\">\n    <application\n        android:allowBackup=\"\
  true\"\n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\
  \n        android:roundIcon=\"@mipmap/ic_launcher_round\"\n        android:supportsRtl=\"\
  true\"\n        android:theme=\"@style/AppTheme\">\n        <activity android:name=\"\
  .MainActivity\">\n            <intent-filter>\n                <action android:name=\"\
  android.intent.action.MAIN\" />\n                <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n\
  ```\n\n## 21.3 准备布局编辑器\n\n找到并双击 `app -> res -> layout` 下的 `activity_main.xml` 文件，将其加载到布局编辑器中。由于本教程的目的是获得约束方面的经验，请使用布局编辑器中的按钮关闭\
  \ `Autoconnect`（自动连接）功能。禁用后，该按钮将显示一条划线，如图 21-2 所示：\n\n![](img/as_3.2_layoutsample_disable_autoconnect.jpg)\n\
  \n图 21-2\n\n如果 Autoconnect 右侧的默认边距值未设置为 `0`，请点击它并在生成的面板中选择 `8dp`。用户界面设计也将使用 `ImageView`\
  \ 对象来显示图像。在继续之前，此图像应已添加到项目中准备使用。该文件名为 `galaxys.png`，可以在以下 URL 找到：\n\n[`www.ebookfrenzy.com/retail/androidstudio41/index.php`](https://www.ebookfrenzy.com/retail/androidstudio41/index.php)\n\
  \n在 Android Studio 中，显示 `Resource`（资源管理器）工具窗口（`View -> Tool Windows -> Resource\
  \ Manager`）。在文件系统导航器中找到 `galaxys.png` 图像，并将其拖到 `Resource Manager` 工具窗口。在生成的对话框中，点击\
  \ `Next` 然后点击 `Import` 按钮将图像添加到项目。图像现在应该出现在 `Resource Manager` 中，如下方图 21-3 所示：\n\
  \n![](img/as_4.1_resource_manager.jpg)\n\n图 21-3\n\n图像也会出现在 `Project` 工具窗口的 `res\
  \ -> drawables` 部分：\n\n![](img/Image2451.jpg)\n\n图 21-4\n\n## 21.4 向用户界面添加组件\n\n\
  从 `Common` 类别中，将 `ImageView` 对象拖到显示视图的中心。注意会出现水平和垂直虚线表示显示的中心轴。对齐后，释放鼠标按钮将视图放置到位。一旦放置在布局中，将出现\
  \ `Resources` 对话框，寻求要在视图内显示的图像。在对话框顶部的搜索栏中输入“galaxy”以找到 `galaxys.png` 资源，如图 21-5\
  \ 所示：\n\n![](img/as_3.6_resources_dialog.jpg)\n\n图 21-5\n\n选择图像并点击 `OK` 将其分配给 `ImageView`\
  \ 对象。如有必要，使用调整大小手柄调整 `ImageView` 的大小，并重新定位到布局中心。此时，布局应与图 21-6 匹配：\n\n![](img/as_3.5_layout_sample_imageview_added.jpg)\n\
  \n图 21-6\n\n从色面板的 `Common` 部分点击并拖拽 `TextView` 对象，并将其置于 `ImageView` 上方，如图 21-7 所示。\n\
  \n\n\n\n使用`Attributes`（属性）面板，展开`Common Attributes`（通用属性）部分的`textAppearance`属性条目，将`textSize`属性更改为`24sp`，将`textAlignment`设置设置为`center`（居中），并将文本改为“Samsung\
  \ Galaxy S6”。\n\n![](img/as_3.5_layout_sample_textview_added.jpg)\n\n图 21-7\n\n\
  接下来，在布局底部添加三个`Button`（按钮）控件，并将这些视图的`text`属性设置为“Buy Now”（立即购买）、“Pricing”（定价）和“Details”（详情）。完成后的布局应当与图\
  \ 21-8 匹配：\n\n![](img/as_4.1_layout_sample_ui.jpg)\n\n图 21-8\n\n此时，控件的约束条件还不足以让布局引擎能够在运行时对它们进行定位和尺寸调整。如果现在运行该应用程序，所有控件都将定位在屏幕的左上角。\n\
  \n将控件添加到布局后，使用位于`Layout Editor`（布局编辑器）工具栏中的设备旋转按钮（如图 21-9 中的箭头所示）以横屏模式查看用户界面：\n\n\
  ![](img/as_3.5_layout_sample_rotate.jpg)\n\n图 21-9\n\n由于缺少约束，布局无法适应设备方向的变化，导致内容未居中，且部分图像以及所有三个按钮都位于屏幕的可视区域之外。显然，仍然需要进行一些工作才能将其变为响应式用户界面。\n\
  \n## 21.5 添加约束\n\n约束是创建能够适应设备方向变化和不同屏幕尺寸布局的关键。首先，将布局旋转回竖屏模式，并选择位于`ImageView`之上的`TextView`控件。选中控件后，从`TextView`的左侧、右侧和顶部建立到父级`ConstraintLayout`对应侧边缘的约束，如图\
  \ 21-10 所示：\n\n![](img/as_3.5_layout_sample_textview_constraints.jpg)\n\n图 21-10\n\
  \n约束`TextView`控件后，选择`ImageView`实例，并在左右两侧建立对等约束，每个约束连接到父级布局的对应侧。接下来，从`ImageView`的顶部到`TextView`的底部建立连接，从`ImageView`的底部到中间`Button`控件的顶部建立连接。如有必要，点击并拖动`ImageView`，使其保持在布局的垂直中心。\n\
  \n在仍选中`ImageView`的情况下，使用`attributes`面板中的`Inspector`（检查器）将`ImageView`的顶部和底部边距分别更改为`24`和`8`，并将控件的高度和宽度维度属性均更改为`match_constraint`，以便控件调整大小以匹配约束。这些设置将允许布局引擎在需要时放大或缩小`ImageView`的大小以适应布局变化：\n\
  \n![](img/as_33_layout_attributes.jpg)\n\n图 21-11\n\n图 21-12 显示了`ImageView`相对于布局中其他元素的当前实现约束：\n\
  \n![](img/as_4.1_layout_sample_ui_constrained.jpg)\n\n图 21-12\n\n最后一个任务是为三个`Button`控件添加约束。在本例中，按钮将放置在一个链中。首先，通过点击图\
  \ 21-2 中突出显示的工具栏按钮，在`Layout Editor`中开启`Autoconnect`（自动连接）。\n\n接下来，点击`Buy Now`按钮，然后按\
  \ Shift 键点击另外两个按钮，使三个按钮都被选中。右键点击`Buy Now`按钮，并在弹出菜单中选择`Chains -> Create Horizontal\
  \ Chain`（链 -> 创建水平链）选项。默认情况下，链将使用`spread`（分布）样式显示，这是本例正确的行为。\n\n最后，在`Buy Now`按钮底部和布局底部之间建立约束。对剩余按钮重复此步骤。\n\
  \n完成这些步骤后，按钮应当如图 21-13 所示受到约束：\n\n![](img/as_4.1_layout_sample_chain.jpg)\n\n图 21-13\n\
  \n## 21.6 测试布局\n\n在布局中添加约束后，将屏幕旋转到横屏模式，验证布局是否适应以适应新的屏幕尺寸。\n\n虽然`Layout Editor`工具提供了一个实用的视觉环境来设计用户界面布局，但在测试方面，运行应用程序测试是不可替代的。在物理\
  \ Android 设备或模拟器会话上启动应用，并验证用户界面是否反映了在`Layout Editor`中创建的布局。例如，图 21-14 显示了横屏下运行的应用程序：\n\
  \n![](img/as_4.1_layout_sample_completed.jpg)\n\n图 21-14\n\n用户界面设计现在已完成。设计更复杂的用户界面布局是上述步骤的延续。只需将视图拖到显示器上，根据需要进行定位、约束并设置属性即可。\n\
  \n### 21.7 使用布局检查器\n\n可以使用`Layout Inspector`（布局检查器）随时查看构成用户界面布局的层次结构。为了访问此信息，应用程序必须运行。程序运行后，选择`Tools\
  \ -> Layout Inspector`菜单选项，然后按照图 21-15 中标记的 A 所示选择要检查的过程。\n\n一旦检查器加载，左侧的面板（B）显示构成用户界面布局的层次结构。中间面板（C）显示布局的视觉表示。点击布局中的控件会导致该项在层次结构中高亮，从而轻松找到其所在位置。\n\
  \n最后，最右侧的面板（图 21-15 标记为 D）包含当前选中控件的所有设置，允许对配置进行深入分析。在适当的情况下，值单元格将包含指向源代码中属性位置的链接。\n\
  \n![](img/as_4.1_layout_inspector.jpg)\n\n图 21-15\n\n要以 3D 视图查看布局，请点击布局预览区域的任意位置。这将显示层次结构的“爆炸”表示，以便进行旋转和检查。这对于识别被遮挡的视图非常有帮助：\n\
  \n![](img/as_4.1_layout_inspector_layer_spacing.jpg)\n\n图 21-16\n\n点击并拖动渲染图进行三维旋转，使用图中箭头所示的滑块增加层之间的间距。点击标记为\
  \ E 的按钮可将渲染图重置为原始位置。\n\n## 21.8 总结\n\nAndroid Studio 中的 Layout Editor 工具与`ConstraintLayout`\
  \ 类紧密集成。本章通过创建一个示例用户界面，概述了使用 Layout Editor 工具通过添加控件和设置约束来实现基于 ConstraintLayout 的用户界面的方法。本章还介绍了实时布局检查器工具，它用于分析用户界面的结构组成。\n\
  \n### 22 在 Android Studio 中手动创建 XML 布局\n\n虽然使用 Android Studio Layout Editor 工具设计布局大大提高了效率，但仍然可以通过手动编辑\
  \ XML 来创建 XML 布局。本章将介绍 Android XML 布局格式的基础。\n\n### 22.1 手动创建 XML 布局\n\n\n\n\n\n\
  XML 布局文件的结构实际上非常简单，并遵循视图树（view tree）的层级方法。XML 资源文件的第一行理想情况下包含以下标准声明：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n```\n\n该声明之后紧应该是布局的根元素，通常是一个容器视图，例如布局管理器。它由起始标签和结束标签表示，并包含需要在视图上设置的任何属性。例如，接下来的\
  \ XML 将一个 `ConstraintLayout` 视图声明为根元素，分配了 ID `activity_main` 并设置了 `match_parent`\
  \ 属性，使其填充设备显示屏的所有可用空间：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n\n\
  <androidx.constraintlayout.widget.ConstraintLayout\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\"\n    android:layout_width=\"match_parent\"\n\
  \    android:layout_height=\"match_parent\"\n    android:paddingLeft=\"16dp\"\n\
  \    android:paddingRight=\"16dp\"\n    android:paddingTop=\"16dp\"\n    android:paddingBottom=\"\
  16dp\"\n    tools:context=\".MainActivity\">\n\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n注意，在上面的示例中，布局元素在每个侧都配置了 `16dp`（密度无关像素）的内边距（padding）。Android 布局中的任何间隔指定都必须使用以下单位之一：\n\
  \n*   `in` – 英寸。\n*   `mm` – 毫米。\n*   `pt` – 磅（1/72 英寸）。\n*   `dp` – 密度无关像素。一种基于设备显示屏相对于\
  \ 160dpi 显示屏基准的物理密度的抽象测量单位。\n*   `sp` – 比例无关像素。与 `dp` 类似，但会根据用户的字体偏好进行缩放。\n*   `px`\
  \ – 实际屏幕像素。不建议使用，因为不同的显示器每英寸像素数不同。优先于此单位使用 `dp`。\n\n任何需要添加到 `ConstraintLayout` 父元素的子元素都必须嵌套在起始和结束标签之间。在下面的示例中，添加了一个\
  \ `Button` 控件作为 `ConstraintLayout` 的子元素：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n\n<androidx.constraintlayout.widget.ConstraintLayout\n    xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    android:id=\"@+id/activity_main\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  \n    android:paddingLeft=\"16dp\"\n    android:paddingRight=\"16dp\"\n    android:paddingTop=\"\
  16dp\"\n    android:paddingBottom=\"16dp\"\n    tools:context=\".MainActivity\"\
  >\n    <Button\n        android:text=\"@string/button_string\"\n        android:layout_width=\"\
  wrap_content\"\n        android:layout_height=\"wrap_content\"\n        android:id=\"\
  @+id/button\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n```\n\n\
  按照目前的实现，按钮没有任何约束连接。因此，在运行时，按钮将出现在屏幕的左上角（尽管由于父布局分配的内边距而缩进了 `16dp`）。然而，如果在按钮的两侧添加了相反的约束，它将显示在布局正中：\n\
  \n```xml\n<Button\n    android:text=\"@string/button_string\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:id=\"@+id/button\"\
  \n    app:layout_constraintBottom_toBottomOf=\"parent\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n```\n\n注意，每个约束都附着在名为 `activity_main` 的元素上，在这种情况下，它是父级 `ConstraintLayout`\
  \ 实例。\n\n要向布局中添加第二个控件，只需将其嵌入 `ConstraintLayout` 元素的体内部即可。例如，下面的修改向布局中添加了一个 `TextView`\
  \ 控件：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:id=\"@+id/activity_main\"\n    android:layout_width=\"match_parent\"\
  \n    android:layout_height=\"match_parent\"\n    android:paddingLeft=\"16dp\"\n\
  \    android:paddingTop=\"16dp\"\n    android:paddingRight=\"16dp\"\n    android:paddingBottom=\"\
  16dp\"\n    tools:context=\".MainActivity\">\n    <Button\n        android:text=\"\
  @string/button_string\"\n        android:layout_width=\"wrap_content\"\n       \
  \ android:layout_height=\"wrap_content\"\n        android:id=\"@+id/button\"\n \
  \       app:layout_constraintBottom_toBottomOf=\"parent\"\n        app:layout_constraintEnd_toEndOf=\"\
  parent\"\n        app:layout_constraintStart_toStartOf=\"parent\"\n        app:layout_constraintTop_toTopOf=\"\
  parent\" />\n    <TextView\n        android:text=\"@string/text_string\"\n     \
  \   android:layout_width=\"wrap_content\"\n        android:layout_height=\"wrap_content\"\
  \n        android:id=\"@+id/textView\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  \n再次注意，由于新添加的 TextView 没有约束，它在运行时将出现在左上角。下面的修改通过向父布局添加相反的约束将控件水平居中，并将 TextView 的底部连接到按钮顶部：\n\
  \n```xml\n<TextView\n    android:text=\"@string/text_string\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:id=\"@+id/textView\"\
  \n    app:layout_constraintBottom_toTopOf=\"@+id/button\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintHorizontal_bias=\"0.498\"\n    app:layout_constraintStart_toStartOf=\"\
  parent\" />\n```\n\n此外，Button 和 TextView 视图都声明了许多属性。两个视图都分配了 ID，并配置为显示由字符串资源 `button_string`\
  \ 和 `text_string` 表示的文本。此外，两个对象都声明了 `wrap_content` 高宽属性，以适应内容。\n\n### 手动 XML 可视化布局设计\n\
  \n手动编写 XML 还是使用设计模式下的布局编辑器取决于个人偏好。然而，使用设计模式具有优势。\n\n首先，设计模式通常更快，因为它避免了输入 XML 行。此外，设计模式避免了学习\
  \ Android SDK 视图类各种属性值的复杂性。与其不断参考 Android 文档来查找正确的关键字和值，大多数属性可以通过属性面板（Attributes\
  \ panel）找到。\n\n\n\n\n\nAndroid Studio 布局编辑器工具为用户界面的设计提供了一种视觉直观的方法。该工具结合了拖放范式和一系列属性编辑器，为应用程序开发者带来了显著的生产力优势。\n\
  \n用户界面设计也可以通过手动编写 XML 布局资源文件来实现，这些文件的格式结构良好且易于理解。\n\n布局编辑器工具可以生成 XML 资源文件，这一事实意味着这两种界面设计方法可以相结合，为用户界面开发提供一种“兼顾两者优点”的方法。\n\
  \n# 23. 使用约束集（Constraint Sets）管理约束\n\n到本书为止，所有的用户界面设计任务都是使用 Android Studio 布局编辑器工具完成的，无论是使用文本模式还是设计模式。编写\
  \ XML 资源文件或使用 Android Studio 布局编辑器的替代方案是编写 `Java` 代码来直接创建、配置和操作组成 Android Activity\
  \ 用户界面的视图对象。在本章的上下文中，在描述如视图属性以及布局约束的创建与管理等关键概念之前，我们将先探索使用 Java 代码创建用户界面的的一些优缺点。\n\
  \n在下一章节中，将创建并使用一个示例项目，以演示这种 Android 用户界面创建方法中涉及的一些典型步骤。\n\n## 23.1 Java 代码与 XML\
  \ 布局文件\n\n与编写 Java 代码相比，使用 XML 资源文件设计用户界面具有许多关键优势。事实上，Google 在 Android 文档中花费大量精力来赞扬\
  \ XML 资源优于 Java 代码的这些处。如上一一节所述，XML 方法的一个关键优势包括可以使用 Android Studio 布局编辑器工具，该工具本身会生成\
  \ XML 资源。另一个优势是，一旦创建了应用程序，可以通过修改 XML 文件来更改用户界面屏幕，从而避免了重新编译应用程序的必要。此外，即使是手动编写 XML\
  \ 布局，也可以通过 Android Studio 布局编辑器的预览功能获取用户界面外观的实时反馈。为了测试由 Java 创建的用户界面的外观，开发者不可避免地反复循环“编写代码-编译-测试”的循环，以完成设计工作。\n\
  \n在 Java 代码创建布局的优势方面，Java 相比 XML 资源文件最显著的优势可能是在处理动态用户界面时发挥作用。XML 资源文件在定义静态布局时本质上最有用，换句话说，就是\
  \ Activity 的每次调用之间不太可能发生显著变化的布局。而 Java 代码非常适合在运行时动态创建用户界面。这在用户界面可能受外部因素影响而在每次 Activity\
  \ 执行时显示得不同的情况下特别有用。\n\n当需要在 Activity 运行时对基于静态 XML 资源的布局进行实时动态更改时，在 Java 代码中操作用户界面组件的知识也会有用。\n\
  \n最后，一些开发者简单地倾向于编写 Java 代码而不是使用布局工具和 XML，无论后者提供了哪些优势。\n\n## 23.2 创建视图\n\n如前所述，Android\
  \ SDK 包含了一个视图类工具箱，旨在满足大多数基础用户界面设计需求。在 Java 中创建视图只需创建这些类的类的实例，并将与该视图关联的 Activity\
  \ 引用作为参数传递即可。\n\n第一个视图（通常是一个可以添加额外子视图的容器视图）通过调用 Activity 的 `setContentView()` 方法向用户显示。可以通过调用对象的\
  \ `addView()` 方法向根视图添加额外的视图。\n\n当使用 Java 代码操作包含在 XML 布局资源文件中的视图时，必须获取视图的 ID。对于在\
  \ Java 中创建的视图也遵循相同的规则。因此，对于在后续 Java 代码中需要进行某些类型访问的任何视图，必须为其分配一个 ID。这是通过调用相关视图对象的\
  \ `setId()` 方法实现的。在随后的代码中，可以通过对象的 `getId()` 方法获取视图的 ID。\n\n## 23.3 视图属性\n\n每个视图类都关联有一系列属性。这些属性设置直接设置在视图实例上，通常定义了视图对象的外观或行为。属性的示例例如显示在\
  \ `Button` 对象上的文本，或 `ConstraintLayout` 视图的背景颜色。Android SDK 中的每个视图类都有一组预定义的方法，允许用户设置和获取这些属性值。例如，`Button`\
  \ 类有一个 `setText()` 方法，可以在 Java 代码中调用，将按钮上显示的文本设置为特定的字符串值。另一方面，`ConstraintLayout`\
  \ 对象的背景颜色可以通过调用对象的 `setBackgroundColor()` 方法来设置。\n\n## 23.4 约束集\n\n虽然属性设置是视图内部的，并决定了视图外观和行为，但约束集（constraint\
  \ sets）用于控制视图相对于其父视图和其他兄弟视图的外观。每个 `ConstraintLayout` 实例都关联一组约束，定义了其子视图是如何定位和受限的。\n\
  \n在 Java 代码中操作约束集的关键是 `ConstraintSet` 类。该类包含一系列方法，允许执行如创建、配置和将约束应用于 `ConstraintLayout`\
  \ 实例等任务。此外，`ConstraintLayout` 实例的当前约束可以复制到 `ConstraintSet` 对象中，并用于将相同的约束应用于其他布局（带有或带有修改）。\n\
  \n`ConstraintSet` 实例的创建方式与其他任何 Java 对象一样：\n\n```\nConstraintSet set = new ConstraintSet();\n\
  ```\n\n一旦创建了约束集，就可以在实例上调用方法来执行广泛的任务。\n\n### 23.4.1 建立连接\n\n`ConstraintSet` 类的 `connect()`\
  \ 方法用于建立视图之间的连接。以下代码配置了一个约束集，其中 `Button` 的左侧连接到 `EditText` 的右侧，间距为 70dp：\n\n```\n\
  set.connect(button1.getId(), ConstraintSet.LEFT, editText1.getId(), ConstraintSet.RIGHT,\
  \ 70);\n```\n\n### 23.4.2 应用布局约束\n\n一旦配置了约束集，必须将其应用于 `ConstraintLayout` 实例才能生效。约束集的应用是通过调用\
  \ `applyTo()` 方法实现的，并传入要应用的布局引用：\n\n```\nset.applyTo(myLayout);\n```\n\n### 23.4.3\
  \ 父约束连接\n\n通过引用 `ConstraintSet.PARENT_ID` 常量，也可以在子视图与其父 `ConstraintLayout` 之间建立连接。在以下示例中，配置约束集将\
  \ `Button` 视图的顶部连接到父布局的顶部，间距为 100dp：\n\n```\nset.connect(button1.getId(), ConstraintSet.TOP,\
  \ ConstraintSet.PARENT_ID, ConstraintSet.TOP, 100);\n```\n\n### 23.4.4 尺寸约束\n\n\
  有许多方法可以控制视图的行为。例如，以下代码将 `Button` 视图的水平尺寸设置为 `wrap_content`，并将 `ImageView` 实例的垂直尺寸最大设置为\
  \ 250dp：\n\n\n\n\n\n```java\nset.constrainWidth(button1.getId(), ConstraintSet.WRAP_CONTENT);\n\
  set.constrainMaxHeight(imageView1.getId(), 250);\n```\n\n### 23.4.5 约束偏移 (Constraint\
  \ Bias)\n\n正如“在 Android Studio 中使用 ConstraintLayout 的指南章节概述的，当一个视图具有对立的约束时，它将沿着约束轴（即水平或垂直方向）居中。这种居中方式可以通过在特定的约束轴上应用偏移（bias）来调整。在使用\
  \ Android Studio 布局编辑器时，这是通过属性（Attributes）工具窗口中的控件实现的。然而，在使用约束集时，可以使用 `setHorizontalBias()`\
  \ 和 `setVerticalBias()` 方法添加偏移，这些方法引用视图 ID，并将 0 到 1 之间的浮点值作为偏移量。\n\n例如，下面的代码将 `Button`\
  \ 的左侧和右侧约束到父布局相应的侧边，然后应用 25% 的水平偏移：\n\n```java\nset.connect(button1.getId(), ConstraintSet.LEFT,\
  \ ConstraintSet.PARENT_ID, ConstraintSet.LEFT, 0);\nset.connect(button1.getId(),\
  \ ConstraintSet.RIGHT, ConstraintSet.PARENT_ID, ConstraintSet.RIGHT, 0);\nset.setHorizontalBias(button1.getId(),\
  \ 0.25f);\n```\n\n### 23.4.6 对齐约束 (Alignment Constraints)\n\n也可以使用约束集应用对齐。Android\
  \ Studio 布局编辑器中提供的全套对齐选项也可以通过约束集使用 `centerVertically()` 和 `centerHorizontally()`\
  \ 方法进行配置，这两个方法都会根据正在配置的对齐方式接收不同的参数。此外，可以使用 `center()` 方法将视图在两个其他视图之间居中。\n\n在下面的代码中，`button2`\
  \ 的位置设置使其与 `button1` 水平对齐：\n\n```java\nset.centerHorizontally(button2.getId(), button1.getId());\n\
  ```\n\n### 23.4.7 复制与应用约束集 (Copying and Applying Constraint Sets)\n\n`ConstraintLayout`\
  \ 实例的当前约束集可以使用 `clone()` 方法复制到约束集对象中。例如，下面行代码将从名为 `myLayout` 的 `ConstraintLayout`\
  \ 实例的约束设置复制到一个约束集对象中：\n\n```java\nset.clone(myLayout);\n```\n\n一旦复制，约束集就可以直接应用到另一个布局，或者像下面的示例一样，在应用到第二个布局之前进行修改：\n\
  \n```java\nConstraintSet set = new ConstraintSet();\nset.clone(myLayout);\nset.constrainWidth(button1.getId(),\
  \ ConstraintSet.WRAP_CONTENT);\nset.applyTo(mySecondLayout);\n```\n\n### 23.4.8\
  \ ConstraintLayout 链 (ConstraintLayout Chains)\n\n也可以在约束集中使用 `createHorizontalChain()`\
  \ 和 `createVerticalChain()` 方法创建垂直和水平链。使用这些方法的语法如下：\n\n```java\ncreateHorizontalChain(int\
  \ leftId, int leftSide, int rightId, int rightSide, int[] chainIds, float[] weights,\
  \ int style);\n```\n\n根据上面的语法，下面的示例创建了一个从 `button1` 开始到 `button4` 结束的水平分布链（spread\
  \ chain）。在这些视图之间是 `button2` 和 `button3`，两者的权重都设置为零：\n\n```java\nint[] chainViews\
  \ = {button2.getId(), button3.getId()};\nfloat[] chainWeights = {0, 0};\nset.createHorizontalChain(button1.getId(),\
  \ ConstraintSet.LEFT, button4.getId(), ConstraintSet.RIGHT, chainViews, chainWeights,\
  \ ConstraintSet.CHAIN_SPREAD);\n```\n\n可以通过将要移除的视图 ID 传递给 `removeFromHorizontalChain()`\
  \ 或 `removeFromVerticalChain()` 方法来从链中移除视图。可以使用 `addToHorizontalChain()` 或 `addToVerticalChain()`\
  \ 方法将视图添加到现有链中。在这两种情况下，方法接收的参数是新视图要插入的两个视图之间的 ID，如下：\n\n```java\nset.addToHorizontalChain(newViewId,\
  \ leftViewId, rightViewId);\n```\n\n### 23.4.9 辅助线 (Guidelines)\n\n使用 `create()`\
  \ 方法向约束集添加辅助线，然后使用 `setGuidelineBegin()`、`setGuidelineEnd()` 或 `setGuidelinePercent()`\
  \ 方法进行定位。在下面的代码中，创建垂直辅助线并将其定位在父布局宽度的 50% 处。然后将按钮视图的左侧连接到该辅助线，且没有间距：\n\n```java\n\
  set.create(R.id.myGuideline, ConstraintSet.VERTICAL_GUIDELINE);\nset.setGuidelinePercent(R.id.myGuideline,\
  \ 0.5f);\nset.connect(button.getId(), ConstraintSet.LEFT, R.id.myGuideline, ConstraintSet.RIGHT,\
  \ 0);\nset.applyTo(layout);\n```\n\n### 23.4.10 移除约束 (Removing Constraints)\n\n\
  可以使用 `clear()` 方法从视图中移除约束，并将视图 ID 和锚点作为参数。同样，通过在 `clear()` 调用中引用视图可以一次性移除视图上的所有约束：\n\
  \n（注意：逻辑已优化）\n\n### 23.4.11 缩放 (Scaling)\n\n可以使用 `setScaleX()` 和 `setScaleY()` 方法调整布局内视图的缩放，这些方法接收执行操作的视图以及表示缩放比例的浮点值。在下面的代码中，按钮对象被缩放为宽的两倍和高度的一半：\n\
  \n```java\nset.setScaleX(myButton.getId(), 2f);\nset.setScaleY(myButton.getId(),\
  \ 0.5f);\n```\n\n### 23.4.12 旋转 (Rotation)\n\n可以使用 `setRotationX()` 和 `setRotationY()`\
  \ 分别在 X 轴或 Y 轴上旋转视图，这两个方法必须传递要旋转视图的 ID 和表示旋转角度的浮点值。旋转发生的轴点可以通过调用 `setTransformPivot()`、`setTransformPivotX()`\
  \ 和 `setTransformPivotY()` 方法来定义。下面的代码使用位于 500, 500 的轴点在 Y 轴上旋转按钮 30 度：\n\n```java\n\
  set.setTransformPivot(button.getId(), 500, 500);\nset.setRotationY(button.getId(),\
  \ 30);\nset.applyTo(layout);\n```\n\n## 23.5 总结 (Summary)\n\n作为编写 XML 布局资源文件或使用\
  \ Android Studio 布局编辑器的替代方案，Android 用户界面也可以在 Java 代码中动态创建。\n\n在 Java 代码中创建布局包括实例化视图类，并对这些对象设置属性以定义所需的显示和行为。\n\
  \n视图相对于其 `ConstraintLayout` 父视图以及任何兄弟视图的定位和大小是通过使用约束集定义的。约束集由 `ConstraintSet` 类的实例表示，一旦创建，就可以使用广泛的方法对其进行配置，以执行诸如建立约束连接、控制视图大小行为和创建链等任务。\n\
  \n## 24. Android ConstraintSet 教程\n\n## 24.1 在 Android Studio 中创建示例项目\n\n\n\n\n\n\
  启动 `Android Studio`，并在欢迎界面的快速启动菜单中选择 `Create New Project`。在生成的新项目对话框中，点击 `Next`\
  \ 按钮之前选择 `Empty Activity` 模板。\n\n在 `Name` 字段中输入 `JavaLayout`，并指定 `com.ebookfrenzy.javalayout`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将\
  \ `Language` 菜单更改为 `Java`。\n\n项目创建完成后，`MainActivity.java` 文件将自动加载到编辑面板中。正如我们预期的那样，`Android\
  \ Studio` 创建了一个模板 Activity 并重写了 `onCreate()` 方法，为添加 Java 代码以创建用户界面提供了理想的位置。\n\n\
  ## 24.2 向 Activity 添加视图 \n\n`onCreate()` 方法目前设计为使用资源布局文件作为用户界面。因此，首先从该方法中删除此行：\n\
  \n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState) {\n   \
  \ super.onCreate(savedInstanceState);\n    setContentView(R.layout.activity_main);\n\
  }\n```\n\n下一个修改是向 Activity 添加一个带有单个 `Button` 视图子元素的 `ConstraintLayout` 对象。这涉及创建\
  \ `ConstraintLayout` 和 `Button` 类的新实例。然后，需要将 `Button` 视图作为子视图添加到 `ConstraintLayout`\
  \ 视图中，而该视图通过调用 Activity 实例的 `setContentView()` 方法进行显示：\n\n```java\npackage com.ebookfrenzy.javalayout;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\nimport android.os.Bundle;\n\
  import androidx.constraintlayout.widget.ConstraintLayout;\nimport android.widget.Button;\n\
  import android.widget.EditText;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n \
  \       super.onCreate(savedInstanceState);\n        configureLayout();\n    }\n\
  \n    private void configureLayout() {\n        Button myButton = new Button(this);\n\
  \        ConstraintLayout myLayout = new ConstraintLayout(this);\n        myLayout.addView(myButton);\n\
  \        setContentView(myLayout);\n    }\n}\n```\n\n当以此方式创建用户界面对象的新实例时，必须向构造方法传递创建对象时的上下文，在本例中，上下文是当前\
  \ Activity。由于上述代码位于 Activity 类内部，因此通过标准的 `this` 关键字引用上下文：\n\n```java\nButton myButton\
  \ = new Button(this);\n```\n\n完成上述添加后，编译并运行应用程序（在物理设备或模拟器上）。启动后，可见的结果是在 `ConstraintLayout`\
  \ 视图的左上角出现一个没有文本的按钮，如图 24-1 所示：\n\n![](img/Image24351.jpg)\n\n图 24-1\n\n## 24.3\
  \ 设置视图属性\n\n为了本次练习，我们需要 `ConstraintLayout` 视图的背景为蓝色，并让 `Button` 视图在黄色背景上显示内容为“Press\
  \ Me”的文本。这两项任务都可以通过如下代码段所示，在 Java 代码中设置视图的属性来实现。为了让按钮上的文本能够轻松翻译到其他语言，将将其作为 String\
  \ 资源添加。在 Project 工具窗口中，找到 `app -> res -> values -> strings.xml` 文件并对其进行修改，为“Press\
  \ Me”字符串添加一个资源值：\n\n```xml\n<resources>\n    <string name=\"app_name\">JavaLayout</string>\n\
  \    <string name=\"press_me\">Press Me</string>\n</resources>\n```\n\n虽然这是处理代码中直接引用字符串的推荐方法，但为了避免在书中剩余部分重复此步骤，后续许多代码示例将直接在代码中输入字符串。\n\
  \n一旦字符串存储为资源，就可以如下从代码内部访问它：\n\n```java\ngetString(R.string.press_me);\n```\n\n创建字符串资源后，向\
  \ `configureLayout()` 方法添加代码以设置按钮的文本和颜色属性：\n\n```java\nimport android.graphics.Color;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private void configureLayout()\
  \ {\n        Button myButton = new Button(this);\n        myButton.setText(getString(R.string.press_me));\n\
  \        myButton.setBackgroundColor(Color.YELLOW);\n        ConstraintLayout myLayout\
  \ = new ConstraintLayout(this);\n        myLayout.setBackgroundColor(Color.BLUE);\n\
  \        myLayout.addView(myButton);\n        setContentView(myLayout);\n    }\n\
  }\n```\n\n当应用程序编译并运行时，布局将反映这些设置，布局将呈现蓝色背景。\n\n## 24.4 创建视图 ID\n\n当布局完成后，它将包含 `Button`\
  \ 和 `EditText`。在 `ConstraintSet` 类的方法中引用这些视图之前，必须为它们分配唯一的 ID。此过程的第一步是创建一个资源文件。右键点击\
  \ `app -> res -> values`，选择 `New -> Resource file` 并将文件命名为 `ids`。创建资源文件后，将其编辑为：\n\
  \n```xml\n<resources>\n    <id name=\"myButton\" />\n</resources>\n\n\n此时已创建了 `Button`，因此编辑\
  \ `configureLayout()` 方法为对象分配相应的 ID：\n\n```java\nprivate void configureLayout()\
  \ {\n    Button myButton = new Button(this);\n    myButton.setText(getString(R.string.press_me));\n\
  \    myButton.setBackgroundColor(Color.YELLOW);\n    myButton.setId(R.id.myButton);\n\
  \    ...\n}\n```\n\n## 24.5 配置约束集\n\n在没有任何约束的情况下，`ConstraintLayout` 视图将 `Button`\
  \ 视图放在左上角。为了指示布局视图将按钮放置在不同的位置（在本例中为水平垂直居中），需要创建一个 `ConstraintSet` 实例，对其进行初始化并将其应用于父布局。对于此示例，需要配置按钮，使其宽度和高度约束为文本的大小。编辑\
  \ `configureLayout()` 方法以进行这些更改：\n\n```java\nimport androidx.constraintlayout.widget.ConstraintSet;\n\
  \nprivate void configureLayout() {\n    Button myButton = new Button(this);\n  \
  \  myButton.setText(getString(R.string.press_me));\n    myButton.setBackgroundColor(Color.YELLOW);\n\
  \    myButton.setId(R.id.myButton);\n    ConstraintLayout myLayout = new ConstraintLayout(this);\n\
  \    myLayout.setBackgroundColor(Color.BLUE);\n    myLayout.addView(myButton);\n\
  \    setContentView(myLayout);\n\n    ConstraintSet set = new ConstraintSet();\n\
  \    set.constrainHeight(myButton.getId(), ConstraintSet.WRAP_CONTENT);\n    set.constrainWidth(myButton.getId(),\
  \ ConstraintSet.WRAP_CONTENT);\n    set.connect(myButton.getId(), ConstraintSet.START,\
  \ ConstraintSet.PARENT_ID, ConstraintSet.START, 0);\n    set.connect(myButton.getId(),\
  \ ConstraintSet.END, ConstraintSet.PARENT_ID, ConstraintSet.END, 0);\n    set.connect(myButton.getId(),\
  \ ConstraintSet.TOP, ConstraintSet.PARENT_ID, ConstraintSet.TOP, 0);\n    set.connect(myButton.getId(),\
  \ ConstraintSet.BOTTOM, ConstraintSet.PARENT_ID, ConstraintSet.BOTTOM, 0);\n   \
  \ set.applyTo(myLayout);\n}\n```\n\n\n\n下一个要添加到布局中的项是 `EditText` 视图。第一步是创建 `EditText`\
  \ 对象，为其分配在 `id.xml` 资源文件中声明的 ID，并将其添加到布局中。现在需要对 `configureLayout()` 方法进行如下代码更改以来实现这些步骤：\n\
  \n```java\nprivate void configureLayout() {\n    Button myButton = new Button(this);\n\
  \    myButton.setText(getString(R.string.press_me));\n    myButton.setBackgroundColor(Color.YELLOW);\n\
  \    myButton.setId(R.id.myButton);\n    EditText myEditText = new EditText(this);\n\
  \    myEditText.setId(R.id.myEditText);\n    ConstraintLayout myLayout = new ConstraintLayout(this);\n\
  \    myLayout.setBackgroundColor(Color.BLUE);\n    myLayout.addView(myButton);\n\
  \    myLayout.addView(myEditText);\n    setContentView(myLayout);\n}\n```\n\n`EditText`\
  \ 部件的大小将根据其显示的内容进行调整，在布局中水平居中，并位于现有 `Button` 视图上方 70dp 处。在 `configureLayout()` 方法中添加如下代码，使其内容如下：\n\
  \n```java\nset.connect(myButton.getId(), ConstraintSet.START,\n            ConstraintSet.PARENT_ID,\
  \ ConstraintSet.START, 0);\nset.connect(myButton.getId(), ConstraintSet.END,\n \
  \           ConstraintSet.PARENT_ID, ConstraintSet.END, 0);\nset.connect(myButton.getId(),\
  \ ConstraintSet.TOP,\n            ConstraintSet.PARENT_ID, ConstraintSet.TOP, 0);\n\
  set.connect(myButton.getId(), ConstraintSet.BOTTOM,\n            ConstraintSet.PARENT_ID,\
  \ ConstraintSet.BOTTOM, 0);\nset.constrainHeight(myEditText.getId(),\n         \
  \           ConstraintSet.WRAP_CONTENT);\nset.constrainWidth(myEditText.getId(),\n\
  \                    ConstraintSet.WRAP_CONTENT);\nset.connect(myEditText.getId(),\
  \ ConstraintSet.START,\n            ConstraintSet.PARENT_ID, ConstraintSet.START,\
  \ 0);\nset.connect(myEditText.getId(), ConstraintSet.END,\n            ConstraintSet.PARENT_ID,\
  \ ConstraintSet.END, 0);\nset.connect(myEditText.getId(), ConstraintSet.BOTTOM,\n\
  \            myButton.getId(), ConstraintSet.TOP, 70);\nset.applyTo(myLayout);\n\
  ```\n\n运行应用程序，应显示 `EditText` 字段位于按钮正上方，并有 70dp 的间距。\n\n## 24.7 将密度无关像素 (dp) 转换为像素\
  \ (px)\n\n本次练习的下一个任务是将 `EditText` 视图的宽度设置为 200dp。正如 Android Studio 布局编辑器 ConstraintLayout\
  \ 教程章节所述，在用户界面布局中设置尺寸和位置时，使用密度无关像素 (dp)优于像素 (px)。为了使用 dp 设置位置，必须在运行时将 dp 值转换为 px\
  \ 值，并考虑设备显示器的密度。因此，为了将 `EditText` 视图的宽度设置为 200dp，需要向类中添加以下代码：\n\n```java\npackage\
  \ com.ebookfrenzy.javalayout;\n\nimport android.content.res.Resources;\nimport android.util.TypedValue;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private int convertToPx(int\
  \ value) {\n        Resources r = getResources();\n        int px = (int) TypedValue.applyDimension(\n\
  \                TypedValue.COMPLEX_UNIT_DIP, value, r.getDisplayMetrics().density);\n\
  \        return px;\n    }\n\n    private void configureLayout() {\n        Button\
  \ myButton = new Button(this);\n        myButton.setText(getString(R.string.press_me));\n\
  \        myButton.setBackgroundColor(Color.YELLOW);\n        myButton.setId(R.id.myButton);\n\
  \        EditText myEditText = new EditText(this);\n        myEditText.setId(R.id.myEditText);\n\
  \        ConstraintLayout myLayout = new ConstraintLayout(this);\n        myLayout.setBackgroundColor(Color.BLUE);\n\
  \        myLayout.addView(myButton);\n        myLayout.addView(myEditText);\n  \
  \      setContentView(myLayout);\n    }\n}\n```\n\n## 25. Android Studio 更改使用指南\n\
  \n现在已经涵盖了使用 Android Studio 进行 Android 开发的一些基本概念，是引入应用更改（Apply Changes）功能的好时机。正如所有经验丰富的开发人员所知，等待应用编译的每一秒都是浪费在编写和完善代码的时间。\n\
  \n## 25.1 引入应用更改\n\n在 Android Studio 的早期版本中，每当需要测试项目的更改时，Android Studio 都会重新编译代码，将其转换为\
  \ Dex 格式，生成 APK 包文件并安装到设备或模拟器上。完成这些步骤后，应用程序才能准备好测试。即使在快速的开发系统上，这也是一个需要大量时间完成的过程。\n\
  \n相比之下，应用更改（Apply Changes）允许项目中的许多代码和资源更改在运行时即时反映。举例来说，考虑在 Android Studio 中开发并已经在设备或模拟器上启动的应用。如果对资源设置或方法中的代码进行了更改，应用更改将更新后的代码和资源推送到运行的应用中并动态地“交换”更改。随后更改将反映在运行的应用中，而无需构建、部署和重新启动整个应用程序。在许多情况下，这使得测试可以在远短于以往的时间完成。\n\
  \n### 25.2 理解应用更改选项\n\nAndroid Studio 提供了三种针对运行应用应用更改的形式，即运行应用（Run App）、应用更改（Apply\
  \ Changes）以及重启活动并应用代码更改（Restart Activity and Apply Code Changes）。\n\n- **运行应用 (Run\
  \ App)**：停止当前运行的应用并重新启动。如果自上次启动以来项目未发生任何更改，此选项将简单地重启应用。相反，如果项目已发生更改，Android Studio\
  \ 将重新构建并将应用安装到设备或模拟器上然后启动。\n- **应用代码更改 (Apply Code Changes)**：当对项目所更改仅涉及现有方法的体修改，或者添加了新类或方法时，可以使用此选项。选择后，更改将应用于运行的应用，无需重启应用或当前运行的活动。然而，如果对任何项目资源（如布局文件）进行了更改，则无法使用此模式。其他限制还包括删除方法、更改方法签名、重命名类以及其他结构性代码更改。当项目清单（Manifest）发生更改时也无法使用此选项。\n\
  \n\n\n\n- **应用更改并重启活动** - 选中后，此模式将动态应用项目内所做的任何代码或资源更改，并在无需重新安装或重启应用的情况下重启活动。与 `Apply\
  \ Code`（应用代码更改）选项不同，此选项可以在项目代码和资源已更改时使用，但仍然适用于涉及某些结构性代码更改和 manifest 修改的相同限制。\n\n\
  ## 25.3 使用应用更改\n\n当项目已加载到 Android Studio 中但尚未在设备或模拟器上运行时，可以像往常一样使用工具栏上的运行（在图 25-1\
  \ 中标记为 `A`）或调试（标记为 `B`）按钮来启动：\n\n![](img/as_3.6_run_debug_toolbar_buttons.jpg)\n\
  \n图 25-1\n\n应用启动并运行后，运行按钮上的图标将更改，表示应用正在运行，并且“应用更改并重启活动”和“应用代码更改”按钮将如下方图 25-2 所示启用：\n\
  \n![](img/as_3.5_apply_changes_labelled_buttons.jpg)\n\n图 25-2\n\n如果在选择其中一个 `Apply\
  \ Changes` 按钮时无法应用更改，Android Studio 将显示一条失败的消息以及解释。例如，图 25-3 显示了在对资源文件进行更改后选择 `Apply\
  \ Code Changes` 选项时 Android Studio 显示的消息：\n\n![](img/as_3.5_apply_changes_fail_resources.jpg)\n\
  \n图 25-3\n\n在这种情况下，解决方案是使用 `Apply Changes and Restart Activity` 选项（此处提供了链接）。同样，当尝试应用涉及添加或删除方法的更改更改时，将出现以下消息：\n\
  \n![](img/as_3.5_apply_changes_methods.jpg)\n\n图 25-4\n\n在这种情况下，唯一的选项是点击 `Run App`（运行应用）按钮重新安装并重启应用。作为在这些情况下手动选择正确选项的替代方案，Android\
  \ Studio 可以配置为自动回退到执行 `Run App` 操作。\n\n## 25.4 配置应用更改回退设置\n\n`Apply Changes` 回退设置位于\
  \ Android Studio 的 `Preferences` 窗口，通过选择 `File -> Settings`get（macOS 上为 `Android\
  \ Studio -> Preferences`）显示。在 `Preferences` 对话框中，在左侧面板中选择 `Build, Execution, Deployment`，然后选择\
  \ `Deployment`，如图 25-5 所示：\n\n![](img/as_3.5_apply_changes_preferences.jpg)\n\n\
  图 25-5\n\n一旦启用所需的选项，点击 `Apply` 然后点击 `OK` 按钮以提交更改并关闭对话框。启用这些默认设置后，Android Studio\
  \ 将根据需要自动重新安装并重启应用。\n\n## 25.5 应用更改教程\n\n启动 Android Studio，从欢迎界面选择 `Create New Project`（创建新项目）快速启动选项，并在生成的项目对话框中，点击\
  \ `Next`（下一步）按钮之前选择 `Basic Activity`（基础活动）模板。\n\n在 `Name` 字段中输入 `ApplyChanges` 并指定\
  \ `com.ebookrenzy.applychanges` 为包名。在点击 `Finish`（完成）按钮之前，将 `Minimum API level` 设置更改为\
  \ `26: Android 8.0 (Oreo)`，并将 `Language` 菜单改为 `Java`。\n\n## 25.6 使用应用代码更改\n\n首先点击\
  \ `run` 按钮并选择合适的模拟器或物理设备作为运行目标。点击 `run` 按钮后，跟踪示例应用在设备或模拟器上出现之前的时间。\n\n运行后，点击操作按钮（位于屏幕右下角的显示信封图标的按钮）。注意会出现\
  \ `Snackbar` 实例，显示为“Replace with own action”（替换为自己的操作）的消息，如图 25-6 所示：\n\n![](img/as_4.1_apply_changes_snackbar.jpg)\n\
  \n图 25-6\n\n一旦应用运行，`Apply Changes` 按钮应该已经启用，表示某些项目更改可以在无需重新安装和重启应用的情况下应用。要查看此效果，编辑\
  \ `MainActivity.java` 文件，找到 `onCreate` 方法并修改操作代码，以便在选择操作按钮时显示不同的消息：\n\n```java\n\
  FloatingActionButton fab = findViewById(R.id.fab);\nfab.setOnClickListener(new View.OnClickListener()\
  \ {\n    @Override\n    public void onClick(View view) {\n        Snackbar.make(view,\
  \ \"Apply Changes is Amazing!\", Snackbar.LENGTH_LONG)\n            .setAction(\"\
  Action\", null).show();\n    }\n});\n```\n\n实现代码更改后，点击 `Apply Code Changes` 按钮，注意几秒钟内会出现消息，指示应用已更新。点击操作按钮并注意现在\
  \ `Snackbar` 中显示了新消息。\n\n## 25.7 使用应用更改并重启活动\n\n任何资源更改都要求使用 `Apply Changes and Restart\
  \ Activity` 选项。在 Android Studio 中，选择 `app -> res -> layout -> fragment_first.xml`\
  \ 布局文件。在 `Design` 模式下使用 `Layout Editor` 工具，选择默认的 `TextView` 组件并在属性工具窗口中将 `text`\
  \ 属性更改为“Hello Android”。\n\n在点击 `Apply Code Changes` 按钮之前，确保关闭了上述“Configuring Apply\
  \ Changes Fallback Settings”中概述的回退选项。注意请求失败是因为此更改涉及项目资源。点击 `Apply Changes and Restart\
  \ Activity` 按钮并验证活动已重启并在 `TextView` 部件上显示了新文本。\n\n## 25.8 使用运行应用\n\n如之前所述，删除方法需要完全重新安装并重启正在运行的应用。要体验这一点，请编辑\
  \ `MainActivity.java` 文件并在 `onCreate` 方法之后按所示添加新方法：\n\n```java\npublic void demoMethod()\
  \ {\n}\n```\n\n使用 `Apply Code Changes` 按钮并确认更改在无需重新安装应用的情况下已应用。\n\n接下来，删除新方法并验证点击两个\
  \ `Apply Changes` 按钮之一都会导致请求失败。在此类更改后运行应用的唯一方法是点击 `Run App` 按钮。\n\n## 25.9 总结\n\n\
  `Apply Changes` 是 Android Studio 的一项功能，旨在显著加速开发应用时的代码、构建和运行周期。`Apply Changes` 功能能够在许多情况下无需重新安装或重启应用即可向运行应用推送更新。\n\
  \n## 26. Android 事件处理概述与示例\n\n之前的章节已经涵盖了许多关于 Android 应用程序界面设计的内容。然而，一个尚未涵盖的领域涉及用户与用户界面交互触发底层活动执行任务的方式。换句话说，我们从之前的章节中知道如何创建一个包含按钮视图的用户界面，但不知道当用户触摸时会发生什么。\n\
  \n因此，本章的主要目标是提供 Android 应用程序事件处理的概述，以及基于 Android Studio 的示例项目。\n\n## 26.1 理解 Android\
  \ 事件\n\nAndroid 事件可以有多种形式，但通常是响应外部操作产生的。常见的事件形式（特别是对于平板电脑和智能手机等设备）涉及与触摸屏的某种交互。此类事件属于输入事件。\n\
  \n\n\n\n\nAndroid 框架维护着事件队列，事件在发生时会被放入该队列中。随后，事件按照先进先出（FIFO）的原则从队列中移除。对于像屏幕触摸这样的输入事件，事件将传递给屏幕上触摸发生位置处位置的视图（view）。除了事件通知外，视图还会接收到有关事件性质的一系列信息（取决于事件类型），例如用户手指与屏幕之间接触点的坐标。\n\
  \n为了能够处理传递过的事件，视图必须就绪一个事件监听器（event listener）。所有用户界面组件都派生自 `View` 类，该类包含了一系列事件监听器接口，每个接口都包含一个回调方法的抽象声明。为了能够响应特定类型的事件，视图必须注册适当的事件监听器并实现相应的回调。例如，如果一个按钮要响应点击事件（等同于用户触摸并释放按钮视图，就像点击物理按钮一样），它必须既注册\
  \ `View.onClickListener` 事件监听器（通过调用目标视图的 `setOnClickListener()` 方法），又实现相应的 `onClick()`\
  \ 回调方法。当在屏幕上按钮视图的位置检测到“点击”事件时，Android 框架会在该事件从事件队列中移除时调用该视图的 `onClick()` 方法。当然，任何任务的执行或响应按钮点击的其他方法调用都应该在\
  \ `onClick()` 回调方法的实现内部完成。\n\n## 26.2 使用 `android:onClick` 资源\n\n在详细探索事件监听器之前，值得注意的是，当仅需在用户在用户界面“点击”按钮视图时调用回调方法时，可以使用一种快捷方法。考虑一个包含名为\
  \ `button1` 的按钮视图的用户界面布局，其要求是当用户触摸按钮时，调用 activity 类中声明的名为 `buttonClick()` 方法。实现此行为只需要编写\
  \ `buttonClick()` 方法（该方法接收一个触发点击事件的视图引用作为参数），并在 XML 文件中的按钮视图声明中添加一行即可。例如：\n\n```xml\n\
  <Button\n    android:id=\"@+id/button1\"\n    android:layout_width=\"wrap_content\"\
  \n    android:layout_height=\"wrap_content\"\n    android:onClick=\"buttonClick\"\
  \n    android:text=\"Click me\" />\n```\n\n这提供了一种捕获点击事件的简单方法。然而，它并没有提供处理程序（event\
  \ handlers）所提供的范围范围，后者是本章其余部分的主题。正如后续章节将概述的，`onClick` 属性在涉及 fragment 的布局中也有局限性。在\
  \ Android Studio Layout 编辑器中工作时，当设备屏幕布局中选择了合适的视图类型时，可以在属性面板中找到并配置 `onClick` 属性。\n\
  \n## 26.3 事件监听器和回调方法\n\n在本章后面概述的示例 activity 中，将详细介绍注册事件监听器和实现回调方法的涉及步骤。在此之前，值得花些时间概述\
  \ Android 框架中提供的事件监听器以及每个关联的回调方法。\n\n*   `onClickListener` – 用于检测点击式事件，即用户触摸然后释放由视图占据的设备显示区域。对应于\
  \ `onClick()` 回调方法，该方法将接收事件的视图引用作为参数传递。\n*   `onLongClickListener` – 用于检测用户是否在视图上长时间按住触摸状态。对应于\
  \ `onLongClick()` 回调方法，该方法将接收事件的视图作为参数传递。\n*   `onTouchListener` – 用于检测与触摸屏的任何形式接触，包括单个或多次触摸以及手势动作。与\
  \ `onTouch()` 回调对应，此主题将在题为 “Android Touch and Multi-touch Event Handling” 的章节中进行详细介绍。回调方法将接收事件的视图和一个\
  \ `MotionEvent` 对象作为参数传递。\n*   `onCreateContextMenuListener` – 监听由于长按产生的上下文菜单的创建。对应于\
  \ `onCreateContextMenu()` 回调方法。回调将接收 `menu`、接收事件的视图和一个菜单上下文对象。\n*   `onFocusChangeListener`\
  \ – 检测当由于与轨迹球或导航键交互时，焦点移出当前视图的情况。对应于 `onFocusChange()` 回调方法，该方法将接收事件的视图和一个指示焦点是否获得或丢失的\
  \ `Boolean` 值传递。\n*   `onKeyListener` – 用于检测当视图拥有焦点时设备上的按键被按下。对应于 `onKey()` 回调方法。作为参数传递的是接收事件的视图、被按下物理键的\
  \ `KeyCode` 以及一个 `KeyEvent` 对象。\n\n## 26.4 事件处理示例\n\n在本章的剩余部分中，我们将完成一个 Android Studio\
  \ 项目的创建，旨在演示事件监听器和相应回调方法的实现，以检测用户何时点击了按钮。回调方法中的代码将更新文本视图，以指示事件已处理。\n\n从欢迎界面选择“Create\
  \ New Project”快速启动选项，在生成的新项目对话框中，点击“Next”按钮之前，选择 `Empty Activity` 模板。\n\n在 Name\
  \ 字段中输入 `EventExample`，并指定 `com.bookrenzy.eventexample` 为包名。在点击“Finish”按钮之前，将 API\
  \ 级别设置为 `API 26: Android 8.0 (Oreo)`，并将语言菜单改为 `Java`。\n\n## 26.5 设计用户界面\n\n示例中 `MainActivity`\
  \ 类的用户界面布局由一个 `ConstraintLayout`、一个 `Button` 和一个 `TextView` 组成，如图 26-1 所示。\n\n![](img/4.1_event_example_ui.jpg)\n\
  图 26-1\n\n找到并选择 Android Studio 创建的 `activity_main.xml` 文件（位于 Project 工具窗口的 `app\
  \ -> res -> layouts` 下），并双击将其加载到布局编辑器中。\n\n确保已启用 Autoconnect（自动连接），然后从调色板中拖入一个 `Button`\
  \ 组件并移动使其位于布局的水平中心且位于现有 `TextView` 组件下方。当位置正确时，将组件放置在指定位置，以便自动连接系统添加相应的约束。\n\n选择“Hello\
  \ World!” `TextView` 组件，并使用属性面板将 ID 设置为 `statusText`。重复此步骤将 `Button` 组件的 ID 改为 `myButton`。\n\
  \n点击布局编辑器工具栏上的 Infer Constraints（推断约束）按钮添加任何缺失的约束。\n\n选中 `Button` 组件后，使用属性面板将文本属性设置为\
  \ `Press Me`。使用布局编辑器右上角的黄色警告按钮（图 26-2）显示警告列表，并点击 Fix 按钮将按钮上的文本字符串提取到名为 `press_me`\
  \ 的资源：\n\n![](img/4.1_layout_warning.jpg)\n图 26-2\n\n\n\n\n\n为了本示例的目的，需要为 `myButton`\
  \ 视图注册一个 `onClickListener`。这通过调用按钮视图的 `setOnClickListener()` 方法来实现，并将一个新的 `onClickListener`\
  \ 对象作为参数传递，同时实现 `onClick()` 回调方法。由于该任务只需要在 activity 创建时执行，因此合适的位置是 `MainActivity`\
  \ 类的 `onCreate()` 方法。\n\n如果 `MainActivity.java` 文件已经在编辑器会话中打开，请通过点击编辑器面板中的标签页来选择它。或者，通过导航到\
  \ `(app -> java -> com.ebookfrenzy.eventexample -> MainActivity)` 在 `Project` 工具窗口中找到它，并双击它将其加载到代码编辑器中。加载完成后，找到模板方法\
  \ `onCreate()` 并对其进行修改，以获取按钮视图的引用、注册监听器并实现 `onClick()` 回调方法：\n\n```java\npackage\
  \ com.ebookfrenzy.eventexample;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  \nimport android.os.Bundle;\n\nimport android.view.View;\n\nimport android.widget.Button;\n\
  \nimport android.widget.TextView;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n \
  \       super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_event_example);\n\
  \        Button button = findViewById(R.id.myButton);\n        button.setOnClickListener(\n\
  \                    new Button.OnClickListener() {\n                        public\
  \ void onClick(View v) {\n                        }\n                    }\n   \
  \     );\n    }\n}\n```\n\n上述代码现在已经在按钮上注册了事件监听器并实现了 `onClick()` 方法。然而，如果此时运行应用程序，将没有任何迹表明安装在按钮上的事件监听器正在工作，因为目前\
  \ `onClick()` 回调方法的体内尚未实现任何代码。本示例的目标是在点击按钮时在 `TextView` 上显示一条消息，因此需要进行一些进一步的代码更改：\n\
  \n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState) {\n   \
  \ super.onCreate(savedInstanceState);\n    setContentView(R.layout.activity_event_example);\n\
  \    Button button = findViewById(R.id.myButton);\n    button.setOnClickListener(\n\
  \        new Button.OnClickListener() {\n            public void onClick(View v)\
  \ {\n                TextView statusText = findViewById(R.id.statusText);\n    \
  \            statusText.setText(\"Button clicked\");\n            }\n        }\n\
  \    );\n}\n```\n\n在 AVD 模拟器或物理 Android 设备上编译并运行应用程序以完成教程的这一阶段。触摸并释放按钮视图（也称为“点击”），文本视图应该改变并显示“Button\
  \ clicked”文本。\n\n## 26.7 消费事件\n\n在视图上检测标准点击（相对于长点击）是事件处理中非常简单的一种情况。现在示例将扩展为包含对长点击事件的检测，长点击发生在用户点击并按住屏幕上的视图时，从而涵盖了事件消费的主题。考虑本章上一节中\
  \ `onClick()` 方法的代码。该回调被声明为 `void`，因此在执行后不会向 Android 框架返回任何值。另一方面，分配给 `onLongClickListener`\
  \ 的代码需要向 Android 框架返回一个 `Boolean` 值。此返回值的目的是向 Android 运行时指示该回调是否已经消费了该事件。如果回调返回\
  \ `true` 值，框架将丢弃该事件。相反，如果回调返回 `false` 值，Android 框架将认为该事件是活跃的，并随之传递给注册在同一视图上的下一个事件监听器。由于涉及许多编程概念，可能通过示例来演示最好。第一步为示例活动中的按钮视图添加长点击的事件监听器和回调：\n\
  \n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState) {\n   \
  \ super.onCreate(savedInstanceState);\n    setContentView(R.layout.activity_event_example);\n\
  \    Button button = findViewById(R.id.myButton);\n    button.setOnClickListener(\n\
  \        new Button.OnClickListener() {\n            public void onClick(View v)\
  \ {\n                TextView statusText = findViewById(R.id.statusText);\n    \
  \            statusText.setText(\"Button clicked\");\n            }\n        }\n\
  \    );\n    button.setOnLongClickListener(\n        new Button.OnLongClickListener()\
  \ {\n            public boolean onLongClick(View v) {\n                TextView\
  \ statusText = findViewById(R.id.statusText);\n                statusText.setText(\"\
  Long button click\");\n                return true;\n            }\n        }\n\
  \    );\n}\n```\n\n显然，当检测到长点击时，`onLongClick()` 回调方法将在文本视图上显示“Long button click”。但注意，回调方法还返回了\
  \ `true` 值以表示它已消费了该事件。运行应用程序并按住 `Button` 视图，直到文本视图中出现“Long button click”文本。释放按钮时，文本视图继续显示“Long\
  \ button click”文本，表明 `onClick` 监听器代码未被调用。\n\n接下来，修改代码使 `onLongClickListener` 监听器现在返回\
  \ `false` 值：\n\n```java\nbutton.setOnLongClickListener(\n    new Button.OnLongClickListener()\
  \ {\n        public boolean onLongClick(View v) {\n            TextView statusText\
  \ = findViewById(R.id.statusText);\n            statusText.setText(\"Long button\
  \ click\");\n            return false;\n        }\n    }\n);\n```\n\n再次编译并运行应用程序，对按钮执行长点击，直到出现长点击消息。然而，这次释放按钮时，请注意\
  \ `onClick` 监听器也被触发了，文本变为“Button clicked”。这是因为 `onLongClick` 监听器代码返回的 `false` 值向\
  \ Android 框架指示事件未被消费，可以被传递。\n\n## 26.8 总结\n\n如果用户界面包含的视图不对用户交互做出任何响应，那么它几乎没有实际用处。Android\
  \ 通过事件监听器和回调方法的概念弥合了用户界面与应用程序后端代码之间的差距。`View` 类定义了一组事件监听器，这些监听器可以注册在视图对象。每个事件监听器还关联了一个回调方法。\n\
  \n当事件发生在用户界面视图上时，该事件被放入事件队列并由 Android 运行时按先顺序处理。如果发生事件的视图注册了与事件类型匹配的监听器，将调用相应的回调方法。该代码随后将执行活动所需的任何任务。\n\
  \n\n\n\n\n在涵盖了事件处理的基础知识后，下一章将深入探讨触摸事件主题，特别强调多点触摸的处理。\n\n## 27. Android 触摸与多点事件处理\n\
  \n大多数基于 Android 的设备都使用触摸屏作为用户与设备之间的主要接口。上一章介绍了将屏幕触摸操作转换为运行中的 Android 应用程序内动作的机制。然而，触摸事件的处理远比对视图对象上的单指点击响应要复杂得多。例如，大多数\
  \ Android 设备可以同时检测到多个触摸点。触摸也不局限于设备显示器上的单点。当然，当用户在屏幕表面上滑动一个或多个接触点时，触摸也可以是动态的。\n\n\
  应用程序还可以将触摸解释为一种手势。例如，考虑水平滑动通常用于翻阅电子书的页码，或者如何使用捏合动作对屏幕上显示的图像进行放大或缩小。\n\n本章将解释涉及运动的触摸处理，并探索拦截多个并发触摸的概念。识别不同手势的主将在下一章介绍。\n\
  \n## 27.1 拦截触摸事件\n\n视图对象可以通过注册 `onTouchListener` 事件监听器并实现相应的 `onTouch()` 回调方法来拦截触摸事件。例如，下面的代码确保了对名为\
  \ `myLayout` 的 `ConstraintLayout` 视图实例上的任何触摸都会调用 `onTouch()` 方法：\n\n```\nmyLayout.setOnTouchListener(\n\
  \    new ConstraintLayout.OnTouchListener() {\n        public boolean onTouch(View\
  \ v, MotionEvent m) {\n            // 在此处执行任务\n            return true;\n      \
  \  }\n    }\n);\n```\n\n如示例所示，`onTouch()` 回调需要返回一个 `Boolean` 值，指示 Android 运行时系统是将该事件传递给在同一视图上注册的其他事件监听器，还是将其丢弃。方法传递了触发事件的视图引用和一个类型为\
  \ `MotionEvent` 的对象。\n\n## 27.2 MotionEvent 对象\n\n传递给 `onTouch()` 回调方法的 `MotionEvent`\
  \ 对象是获取事件信息的关键。对象中包含的信息包括触摸在视图中的位置以及所执行的操作类型。`MotionEvent` 对象也是处理多点触摸的关键。\n\n##\
  \ 27.3 理解触摸动作\n\n触摸事件处理的一个重要方面是能够识别用户执行的操作类型。通过对传递给 `onTouch()` 回调方法的 `MotionEvent`\
  \ 对象对象调用 `getActionMasked()` 方法，可以获取与事件关联的操作类型。当视图上的第一次触摸发生时，`MotionEvent` 对象将包含动作类型\
  \ `ACTION_DOWN` 以及触摸坐标。当触摸从屏幕上抬起时，会产生一个 `ACTION_UP` 事件。在 `ACTION_DOWN` 和 `ACTION_UP`\
  \ 事件之间的任何触摸运动都将由 `ACTION_MOVE` 事件表示。\n\n当在视图上同时进行多个触摸时，这些触摸被称为指针（pointers）。在多点触摸场景下，指针分别以类型为\
  \ `ACTION_POINTER_DOWN` 和 `ACTION_POINTER_UP` 的事件动作开始和结束。为了识别触发事件的指针索引，必须调用 `MotionEvent`\
  \ 对象的 `getActionIndex()` 回调方法。\n\n## 27.4 处理多点触摸\n\n标题为 Android 事件处理概述与示例（#Event_Handling.xhtml__idTextAnchor596）”的章节开始在单点触摸事件的狭窄背景下探索事件处理。在实践中，大多数\
  \ Android 设备都具备响应多个连续连续触摸的能力（尽管注意的是，可以同时检测到的触摸数量取决于设备）。\n\n如前所述，多点触摸情况下的每个触摸都被 Android\
  \ 框架视为一个指针。每个指针反过来通过一个索引值引用并分配一个 ID。可以通过调用当前 `MotionEvent` 对象的 `getPointerCount()`\
  \ 方法获取指针的当前。当前指针列表中特定索引处的指针的 ID 可以通过调用 `MotionEvent.getPointerId()` 方法获取。例如，下面的代码段获取了指针计数以及索引为\
  \ 0 的指针的 ID：\n\n```\npublic boolean onTouch(View v, MotionEvent m) {\n    int pointerCount\
  \ = m.getPointerCount();\n    int pointerId = m.getPointerId(0);\n    return true;\n\
  }\n```\n\n请注意，当 `onTouch` 监听器被触发时，指针点计数将始终大于或等于 1（因为至少发生了一次触摸，回调才会被触发）。\n\n视图上的触摸，特别是涉及跨屏幕运动的触摸，会在接触点抬起之前产生一系列事件。因此，应用程序可能需要跟踪单个触摸。这应该通过通过\
  \ `MotionEvent` 的 `findPointerIndex()` 方法将 ID 转换为相应的索引值来实现。\n\n## 27.5 一个多点触摸应用程序示例\n\
  \n在本章剩余部分创建的示例应用程序将跟踪跨越布局的最多两个触摸手势。当每个触摸的事件触发时，每个触摸的坐标、索引和 ID 将显示在屏幕上。\n\n从欢迎屏幕选择“创建新项目”（Create\
  \ New Project）快速启动选项，在生成的新项目对话框中，点击“下一步”（Next）按钮之前选择“空 Activity”（Empty Activity）模板。\n\
  \n在名称字段中输入 `MotionEvent` 并指定包名为 `com.ebookzy.motvent`。在点击完成（Finish）按钮之前，将最低 API\
  \ 级别设置为 API 26: Android 8.0 (Oreo)，并将语言菜单设置为 Java。\n\n## 27.6 设计 Activity 用户界面\n\
  \n应用程序唯一 Activity 的界面由一个包含两个 `TextView` 对象的 `ConstraintLayout` 视图组成。在项目窗口中导航到 `app\
  \ -> res -> layout` 并双击 `activity_main.xml` 布局资源文件将其加载到 Android Studio 布局编辑器。\n\n\
  选择并删除默认的“Hello World!” `TextView` 组件，然后在开启自动连接（autoconnect）的情况下，拖放一个新的 `TextView`\
  \ 组件，使其水平居中并位于布局顶部 16dp 边距线处：\n\n![](img/as_4.1_motion_event_one_textview.jpg)\n\
  Figure 27-1\n\n拖入第二个 `TextView` 组件并进行定位和约束，使其与第一个组件底部之间保持 32dp 的间距：\n\n![](img/as_4.1_motion_event_two_textviews.jpg)\n\
  Figure 27-2\n\n使用属性（Attributes）工具窗口将 `TextView` 组件的 ID 分别更改为 `textView1` 和 `textView2`。将组件显示的文本改为“Touch\
  \ One Status”和“Touch Two Status”，并使用编辑器右上角的警告按钮将字符串提取到资源中。\n\n选择组件树（Component Tree）中的\
  \ `ConstraintLayout` ，并使用属性面板将 ID 更改为 `activity_main`。\n\n\n\n\n\n## 27.7 实现触摸事件监听器\n\
  \n为了接收触摸事件通知，有必要在 `MainActivity` 类的 `onCreate()` 方法中对布局视图注册一个触摸监听器。从 Android Studio\
  \ 编辑器面板中选择 `MainActivity.java` 标签以显示源代码。在 `onCreate()` 方法中，添加代码来识别 `ConstraintLayout`\
  \ 视图对象、注册触摸监听器并实现代码；在此情况下，代码将调用名为 `handleTouch()` 的第二个方法并向其传递 `MotionEvent` 对象：\n\
  \n```java\npackage com.ebookfrenzy.motionevent;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  \nimport android.os.Bundle;\nimport android.view.MotionEvent;\nimport android.view.View;\n\
  import androidx.constraintlayout.widget.ConstraintLayout;\nimport android.widget.TextView;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.activity_main);\n        ConstraintLayout myLayout\
  \ =\n                findViewById(R.id.activity_main);\n        myLayout.setOnTouchListener(\n\
  \                new ConstraintLayout.OnTouchListener() {\n                    public\
  \ boolean onTouch(View v,\n                                           MotionEvent\
  \ m) {\n                        handleTouch(m);\n                        return\
  \ true;\n                    }\n                }\n        );\n    }\n}\n```\n\n\
  在测试应用程序之前的最后一个任务是实现由监听器调用的 `handleTouch()` 方法。该方法的代码如下：\n\n```java\nvoid handleTouch(MotionEvent\
  \ m)\n{\n    TextView textView1 = findViewById(R.id.textView1);\n    TextView textView2\
  \ = findViewById(R.id.textView2);\n    int pointerCount = m.getPointerCount();\n\
  \    for (int i = 0; i < pointerCount; i++)\n    {\n        int x = (int) m.getX(i);\n\
  \        int y = (int) m.getY(i);\n        int id = m.getPointerId(i);\n       \
  \ int action = m.getActionMasked();\n        int actionIndex = m.getActionIndex();\n\
  \        String actionString;\n        switch (action)\n        {\n            case\
  \ MotionEvent.ACTION_DOWN:\n                actionString = \"DOWN\";\n         \
  \       break;\n            case MotionEvent.ACTION_UP:\n                actionString\
  \ = \"UP\";\n                break;\n            case MotionEvent.ACTION_POINTER_DOWN:\n\
  \                actionString = \"PNTR DOWN\";\n                break;\n       \
  \     case MotionEvent.ACTION_POINTER_UP:\n                actionString = \"PNTR\
  \ UP\";\n                break;\n            case MotionEvent.ACTION_MOVE:\n   \
  \             actionString = \"MOVE\";\n                break;\n            default:\n\
  \                actionString = \"\";\n        }\n        String touchStatus = \"\
  Action: \" + actionString + \" Index: \" + actionIndex + \" ID: \" + id + \" X:\
  \ \" + x + \" Y: \" + y;\n        if (id == 0)\n        textView1.setText(touchStatus);\n\
  \        else\n        textView2.setText(touchStatus);\n}\n```\n\n在编译和运行应用程序之前，值得花时间系统地梳理这段代码，以突出所执行的任务。\n\
  \n代码首先获取用户界面中两个 `TextView` 对象的引用，并识别视图上有多少个活动指针：\n\n```java\ntextView1 = findViewById(R.id.textView1);\n\
  textView2 = findViewById(R.id.textView2);\nint pointerCount = m.getPointerCount();\n\
  ```\n\n接下来，使用 `pointerCount` 变量启动 `for` 循环，为每个活动指针执行一组任务。循环的前几行获取了触摸的 `X` 和 `Y`\
  \ 坐标，以及相应的 `ID`、动作类型和动作索引。最后，声明了一个 `string` 变量：\n\n```java\nfor (int i = 0; i <\
  \ pointerCount; i++)\n{\n    int x = (int) m.getX(i);\n    int y = (int) m.getY(i);\n\
  \    int id = m.getPointerId(i);\n    int action = m.getActionMasked();\n    int\
  \ actionIndex = m.getActionIndex();\n    String actionString;\n```\n\n由于动作类型等于整数值，因此使用\
  \ `switch` 语句将动作类型转换为更有意义的字符串，并存储在之前声明的 `actionString` 变量中：\n\n```java\nswitch (action)\n\
  {\n    case MotionEvent.ACTION_DOWN:\n        actionString = \"DOWN\";\n       \
  \ break;\n    case MotionEvent.ACTION_UP:\n        actionString = \"UP\";\n    \
  \    break;\n    case MotionEvent.ACTION_POINTER_DOWN:\n        actionString = \"\
  PNTR DOWN\";\n        break;\n    case MotionEvent.ACTION_POINTER_UP:\n        actionString\
  \ = \"PNTR UP\";\n        break;\n    case MotionEvent.ACTION_MOVE:\n        actionString\
  \ = \"MOVE\";\n        break;\n    default:\n        actionString = \"\";\n}\n```\n\
  \n最后，使用 `actionString` 值、动作索引、触摸 ID 以及 `X` 和 `Y` 坐标构建字符串消息。然后使用 `ID` 值决定该字符串应该显示在第一个或第二个\
  \ `TextView` 对象上：\n\n```java\nString touchStatus = \"Action: \" + actionString +\
  \ \" Index: \" + actionIndex + \" ID: \" + id + \" X: \" + x + \" Y: \" + y;\nif\
  \ (id == 0)\ntextView1.setText(touchStatus);\nelse\ntextView2.setText(touchStatus);\n\
  ```\n\n## 27.8 运行示例应用程序\n\n编译并运行应用程序，启动后，在屏幕上尝试单次和多次触摸，并注意如图 27-3 所示文本视图的更新。在模拟器上运行时，可以通过按住\
  \ Ctrl 键（macOS 上为 Cmd）点击鼠标按钮来模拟多次触摸（注意如果模拟器在工具窗口中运行，模拟多次触摸可能无效）：\n\n![](img/as_4.1_motion_event_running.jpg)\n\
  \n图 27-3\n\n## 27.9 总结\n\nActivity 通过注册 `onTouchListener` 并实现 `onTouch()` 回调方法来接收触摸事件通知，该方法在被\
  \ Android 运行时时接收一个 `MotionEvent` 对象。该对象包含了触摸的信息，例如触摸事件类型、触摸坐标以及当前接触视图的数量。\n\n当涉及多次触摸时，每个接触点被称为指针，每个指针都分配了一个索引和一个\
  \ ID。虽然触摸索引会在不同事件之间发生变化，但在触摸结束之前 ID 将保持不变。\n\n本章介绍了如何创建一个示例 Android 应用程序，该程序用于显示设备屏幕上多两个同时触摸的坐标和动作类型。\n\
  \n在涵盖了通用触摸之后，下一章将通过实现手势识别进一步研究触摸屏幕事件处理。\n\n\n\n\n\n“手势”（gesture）一词用于定义触摸屏幕与用户之间连续的交互序列。典型的手势开始于屏幕首次触摸的点，并在最后一个手指或指针设备离开显示表面时结束。当正确利用时，手势可以实现用户与应用程序之间的一种通信形式。翻页电子书页面的滑动动作，或涉及两次触摸以放大或缩小图像的捏合动作，都是使用手势来与应用程序交互的典型示例。\n\
  \nAndroid SDK 提供了在应用内检测常用手势和自定义手势的机制。常用手势涉及点击（tap）、双击（double tap）、长按（long press）或水平或垂直方向的滑动动作（在\
  \ Android 术语中称为 fling）等交互。\n\n本章的目标是探索使用 `GestureDetector` 类检测在 Android 设备屏幕上执行常用手势。下一章标题为在\
  \ Android 上实现自定义手势和双指缩放，将涵盖更复杂的自定义手势的检测，如圆形运动和捏合动作。\n\n## 28.1 实现常用手势检测\n\n当用户与\
  \ Android 设备的屏幕进行交互时，系统会调用当前活跃应用程序的 `onTouchEvent()` 方法，并传递包含用户与屏幕接触数据的 `MotionEvent`\
  \ 对象。这些数据可以被解释，用以识别屏幕上的动作是否匹配常用手势（如点击或滑动）。通过使用 `GestureDetectorCompat` 类，只需极少的编程工作即可实现这一点。该类专门设计用于接收应用程序的运动事件信息，并根据检测到的常用手势类型（如果有）触发方法调用。\n\
  \n检测常用手势的基本步骤如下：\n\n1. 声明一个实现 `GestureDetector.OnGestureListener` 接口的类，包括所需的 `onFling()`、`onDown()`、`onScroll()`、`onShowPress()`、`onSingleTapUp()`\
  \ 和 `onLongPress()` 回调方法。注意，这可以是一个全新的类，也可以是所在的 Activity 类。如果需要检测双击手势，该类还必须实现 `GestureDetector.OnDoubleTapListener`\
  \ 接口并包含相应的 `onDoubleTap()` 方法。\n\n2. 创建 `GestureDetectorCompat` 类的实例，并将步骤 1 中创建的类实例作为参数传递。\n\
  \n3. 可选调用 `GestureDetectorCompat` 实例的 `setOnDoubleTapListener()` 方法，以便在需要时启用双击检测。\n\
  \n4. 在所在的 Activity 中实现 `onTouchEvent()` 回调方法，该方法反过来必须调用 `GestureDetectorCompat`\
  \ 实例的 `onTouchEvent()` 方法，并将当前的运动事件对象作为参数传递给该方法。\n\n一旦实现，结果就是在应用程序代码中一组当检测到特定类型的手势时会被调的方法。这些方法中的代码可以用来执行响应相应手势需要执行的任何任务。\n\
  \n在本章的剩余部分，我们将通过创建一个示例项目来将上述步骤付诸实践。\n\n## 28.2 创建示例手势检测项目\n\n项目的目标是检测 `GestureDetectorCompat`\
  \ 类目前支持的所有常用手势，并向用户显示指示已检测手势类型的状态信息。\n\n从欢迎屏幕选择“新建项目”（Create New Project）快速启动选项，在生成的新项目对话框中，点击“下一步”（Next）按钮之前选择\
  \ Empty Activity 模板。\n\n在 Name 字段输入 `CommonGestures` 并指定 `com.ebookfrenzy.commongestures`\
  \ 为包名。在点击“完成”（Finish）按钮之前，将 Minimum API 级别设置为 API 26: Android 8.0 (Oreo)，并将 Language\
  \ 菜单设置为 Java。\n\n一旦创建新项目，在 Project 工具窗口中导航到 `app -> res -> layout -> activity_main.xml`\
  \ 文件并双击它将其加载到 Layout Editor 工具中。\n\n在 Layout Editor 工具中，选择“Hello, World!”TextView\
  \ 组件，并在 Attributes（属性）工具窗口中输入 `gestureStatusText` 作为 ID。\n\n## 28.3 实现监听器类\n\n如前所述，有创建一个实现\
  \ `GestureDetector.OnGestureListener` 接口的类，如果需要双击检测，还需要实现 `GestureDetector.OnDoubleTapListener`\
  \ 接口。虽然这可以是一个全新的类，但在当前 Activity 类中实现也是完全有效的。因此，为了本示例，我们将修改 `MainActivity` 类来实现这些监听器接口。编辑\
  \ `MainActivity.java` 文件，使其内容如下，以便声明接口并提取和存储用户界面中 TextView 组件的引用：\n\n```java\npackage\
  \ com.ebookfrenzy.commongestures;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  \nimport android.os.Bundle;\n\nimport android.view.GestureDetector;\n\nimport android.widget.TextView;\n\
  \npublic class MainActivity extends AppCompatActivity\n      implements GestureDetector.OnGestureListener,\n\
  \      GestureDetector.OnDoubleTapListener\n{\n\n    private TextView gestureText;\n\
  \n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n    \
  \    super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_common_gestures);\n\
  \        gestureText = findViewById(R.id.gestureStatusText);\n    }\n}\n```\n\n\
  声明类实现了监听器强制要求实现对应的方法：\n\n```java\npackage com.ebookfrenzy.commongestures;\n\nimport\
  \ androidx.appcompat.app.AppCompatActivity;\nimport android.os.Bundle;\nimport android.view.GestureDetector;\n\
  import android.widget.TextView;\nimport android.view.MotionEvent;\n\npublic class\
  \ MainActivity extends AppCompatActivity\n      implements GestureDetector.OnGestureListener,\n\
  \      GestureDetector.OnDoubleTapListener {\n\n    private TextView gestureText;\n\
  \n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n    \
  \    super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_common_gestures);\n\
  \        gestureText = findViewById(R.id.gestureStatusText);\n    }\n\n    @Override\n\
  \    public boolean onDown(MotionEvent event) {\n        gestureText.setText(\"\
  onDown\");\n        return true;\n    }\n\n    @Override\n    public boolean onFling(MotionEvent\
  \ event1, MotionEvent event2, float velocityX, float velocityY) {\n        gestureText.setText(\"\
  onFling\");\n        return true;\n    }\n\n    @Override\n    public void onLongPress(MotionEvent\
  \ event) {\n        gestureText.setText(\"onLongPress\");\n    }\n\n    @Override\n\
  \    public boolean onScroll(MotionEvent e1, MotionEvent e2, float distanceX, float\
  \ distanceY) {\n        gestureText.setText(\"onScroll\");\n        return true;\n\
  \    }\n\n    @Override\n    public void onShowPress(MotionEvent event) {\n    \
  \    gestureText.setText(\"onShowPress\");\n    }\n\n    @Override\n    public boolean\
  \ onSingleTapUp(MotionEvent event) {\n        gestureText.setText(\"onSingleTapUp\"\
  );\n        return true;\n    }\n\n    @Override\n    public boolean onDoubleTap(MotionEvent\
  \ event) {\n        gestureText.setText(\"onDoubleTap\");\n        return true;\n\
  \    }\n\n    @Override\n    public boolean onDoubleTapEvent(MotionEvent event)\
  \ {\n        gestureText.setText(\"onDoubleTapEvent\");\n        return true;\n\
  \    }\n\n    @Override\n    public boolean onSingleTapConfirmed(MotionEvent event)\
  \ {\n    }\n}\n```\n\n\n\n\n\n```java\ngestureText.setText(\"onSingleTapConfirmed\"\
  );\n\nreturn true;\n\n}\n\n}\n```\n\n请注意，这些方法中的许多会返回 true。这向 Android 框架表明该事件已被该方法消费，不需要传递给栈中的下一个事件处理器。\n\
  \n## 28.4 创建 GestureDetectorCompat 实例\n\n现在 activity 类已更新以实现监听器接口，下一步是创建 `GestureDetectorCompat`\
  \ 类的实例。由于这只需要在 activity 创建时执行一次，因此此代码的最佳位置是 `onCreate()` 方法。由于我们还想检测双击，代码还需要调用 `GestureDetectorCompat`\
  \ 实例的 `setOnDoubleTapListener()` 方法：\n\n```java\npackage com.ebookfrenzy.commongestures;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\n\nimport android.os.Bundle;\n\
  \nimport android.view.GestureDetector;\n\nimport android.widget.TextView;\n\nimport\
  \ android.view.MotionEvent;\nimport androidx.core.view.GestureDetectorCompat;\n\n\
  public class MainActivity extends AppCompatActivity\n        implements GestureDetector.OnGestureListener,\n\
  \        GestureDetector.OnDoubleTapListener {\n\n    private TextView gestureText;\n\
  \    private GestureDetectorCompat gDetector;\n\n    @Override\n    protected void\
  \ onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.activity_common_gestures);\n        gestureText\
  \ = findViewById(R.id.gestureStatusText);\n        this.gDetector = new GestureDetectorCompat(this,this);\n\
  \        gDetector.setOnDoubleTapListener(this);\n    }\n}\n```\n\n## 28.5 实现 onTouchEvent()\
  \ 方法\n\n如果此时编译并运行应用程序，即使在设备显示屏上执行手势，也不会发生任何事情。这是因为还没有添加代码来拦截触摸事件并将其传递给 `GestureDetectorCompat`\
  \ 实例。为了实现这一点，必须在 activity 类中重写 `onTouchEvent()` 方法并对其进行实现，使其调用 `GestureDetectorCompat`\
  \ 实例的 `onTouchEvent()` 方法。因此，在 `MainActivity.java` 文件中实现该方法，代码如下：\n\n```java\n@Override\n\
  public boolean onTouchEvent(MotionEvent event) {\n    this.gDetector.onTouchEvent(event);\n\
  \    // 确保调用父类的实现\n    return super.onTouchEvent(event);\n}\n```\n\n## 28.6 测试应用程序\n\
  \n在物理 Android 设备或 AVD 模拟器上编译并运行应用程序。启动后，尝试滑动、按下、滚动动作以及双击和单击。注意，文本视图会更新以反映这些事件，如图\
  \ 28-1 所示：\n\n![](img/Image2425.jpg)\n\n图 28-1\n\n## 28.7 总结\n\n用户与设备触摸屏显示之间的任何物理接触都可以被视为“手势”。由于缺乏传统计算机系统的物理键盘和鼠标指针，手势被广泛用作用户与应用程序之间交互的方法。虽然手势可以由几乎任何动作序列组成，但有一套广泛使用的触摸屏设备用户已经熟悉的常用手势。通过使用\
  \ Android Gesture Detector 类，可以轻松地在应用程序中检测许多“常用手势”。在本章中，我们已经从理论和示例项目实现方面概述了该技术的使用。\n\
  \n在本章涵盖了常用手势之后，下一章将介绍检测更广泛的手势类型，包括同时设计和检测自定义手势的能力。\n\n## 29. 在 Android 上实现自定义手势和缩放识别\n\
  \n上一章涵盖了在 Android 应用程序内部检测所谓的“常用手势”。然而，在实践中，一个手势理论上可以涉及 Android 设备屏幕上的几乎任何触摸动作序列。由于这一事实，Android\
  \ SDK 允许应用程序开发者定义几乎任何性质的自定义手势，并在用户执行这些手势时触发事件。这是一个多阶段的过程，其细节是本章的主题。\n\n## 29.1 Android\
  \ Gesture Builder 应用程序\n\nAndroid SDK 允许开发者设计自定义手势，然后将手势存储在与 Android 应用程序包一起的手势文件中。这些自定义手势文件最简单的创建方法是使用\
  \ Gesture Builder 应用程序，它是作为 Android SDK 示例包的一部分。创建手势文件涉及在物理设备或模拟器上启动 Gesture Builder\
  \ 程序，并“绘制”应用程序需要检测的手势。一旦设计好手势，就可以将包含手势的文件从 SD 卡中取出并添加到应用程序中。在应用程序代码中，该文件会被加载到 `GestureLibrary`\
  \ 实例中，并在其中用于检测用户执行的手势。\n\n## 29.2 GestureOverlayView 类\n\n为了方便在应用程序中检测手势，Android\
  \ SDK 提供了 `GestureOverlayView` 类。这是一个透明视图，可以放置在其他视图之上，唯一目的是为了检测手势。\n\n## 29.3 检测手势\n\
  \n手势是通过加载使用 Gesture Builder 创建的手势文件，然后在 `GestureOverlayView` 实例上注册 `GesturePerformedListener`\
  \ 事件监听器来检测的。然后声明包装类实现 `OnPerformedListener` 接口以及该接口所需的 `onGesturePerformed` 回调方法。当监听器检测到手势时，Android\
  \ 运行时将触发 `onGesturePerformed` 回调方法的调用。\n\n## 29.4 识别特定手势\n\n当检测到手势时，会调用 `onGesturePerformed`\
  \ 回调方法并将检测手势的 `GestureOverlayView` 对象以及包含手势信息的 `Gesture` 对象作为参数传递。\n\n获取 `Gesture`\
  \ 对象后，可以使用 `GestureLibrary` 将检测到的手势与之前加载到应用程序的手势文件进行比较。`GestureLibrary` 通过计算预测分数来报告用户执行的手势与手势文件条目的匹配概率。1.0\
  \ 或更高的预测分数通常被认为文件中存储的手势与用户在设备显示屏上执行的手势之间良好匹配。\n\n## 29.5 安装和运行 Gesture Builder 应用程序\n\
  \n创建手势文件的简单方法是使用允许捕和保存手势动作的应用程序。虽然 Google 最初提供过一个此类用途的应用程序，但它对于较新版本的 Android 并没有得到良好的维护。幸运的是，有一个\
  \ Manan Gandhi 开发的 Gesture Builder 应用程序作为替代方案，可以通过 Google Play 商店中的以下 URL 获取：\n\n\
  `https://play.google.com/store/apps/details?id=pack.GestureApp`\n\n注意，该程序在运行 Android\
  \ 9.0 (API 28) 或更旧设备或模拟器上效果最好。\n\n## 29.6 创建手势文件\n\n\n\n\n\n一旦 Gesture Builder 应用加载完成，点击设备屏幕底部的\
  \ Add（添加）按钮，在随后的屏幕上，通过在屏幕上的圆形运动“画”出一个手势，如图图 29-1 所示。假设手势按要求显示（用设备屏幕上的黄色线条表示），点击\
  \ save（保存）按钮将手势添加到手势文件中，在提示输入名称时输入“Circle Gesture”：\n\n![](img/as_3.4_gesture_builder.jpg)\n\
  \n图 29-1\n\n手势保存后，返回主屏幕，Gesture Builder 应用将显示当前定义的手势列表，此时该列表将仅包含新创建的 Circle Gesture（圆形手势）。在继续之前，使用\
  \ Test（测试）按钮验证该手势工作是否符合预期。\n\n## 29.7 创建示例项目\n\n从欢迎界面选择 Create New Project（新建项目）快速启动选项，在生成的新项目对话框中，点击\
  \ Next（下一步）按钮之前选择 Empty Activity（空活动）模板。\n\n在 `Name`（名称）字段中输入 `CustomGestures`，并指定\
  \ `com.ebookfrenzy.customgestures` 为包名。在点击 Finish（完成）按钮之前，将 Minimum API level（最低\
  \ API ）设置改为 `API 26`：Android 8.0 (Oreo)，并将语言菜单改为 `Java`。\n\n## 29.8 从 SD 卡提取手势文件\n\
  \n由于每个手势都是在 Gesture Builder 应用中创建的，它们被添加到运行该应用的模拟器或设备存储中名为 `gesture.txt` 的文件中。然而，在将此文件添加到\
  \ Android Studio 项目之前，必须先从设备存储中复制并保存到本地文件系统中。最简单的方法是使用 Android Studio 的 Device File\
  \ Explorer（设备文件管理器）工具窗口。通过 `View -> Tool Windows -> Device File Explorer` 菜单显示此工具。显示后，从下拉菜单中选择创建手势文件的设备或模拟器，然后导航文件系统到以下文件夹：\n\
  \n`sdcard/Android/data/pack.GestureApp/files`\n\n在该文件夹中找到 `gesture.txt` 文件，右键点击它，选择\
  \ `Save as…`（另存为……）菜单选项并将文件保存到临时位置，命名为 `gestures`。\n\n![](img/as_3.5_gestures_file_in_device_explorer.jpg)\n\
  \n图 29-2\n\n一旦手势文件被创建并从设备存储中拉取，就可以作为资源文件添加到 Android Studio 项目中了。\n\n## 29.9 将手势文件添加到项目\n\
  \n在 Android Studio Project 工具窗口中，找到并右键点击 `res` 文件夹（位于 `app` 下），从生成的菜单中选择 `New ->\
  \ Directory`（新建 目录）。在 New Directory（新建目录）对话框中，输入 `raw` 作为文件夹名称并点击 OK（确定）按钮。使用适用于你操作系统的相应文件管理器工具，找到之前从设备存储中提取的\
  \ `gestures` 文件，并将其复制粘贴到 Project 工具窗口中新的 `raw` 文件夹中。\n\n## 29.10 设计用户界面\n\n此示例应用程序需要一个由\
  \ `ConstraintLayout` 视图组成的用户界面，在其上层叠加一个 `GestureOverlayView` 以拦截用户执行的任何手势。找到 `app\
  \ -> res -> layout -> activity_main.xml` 文件，双击它将其加载到 Layout Editor（布局编辑器）工具中，并选择删除默认的\
  \ `TextView` 控件。\n\n切换布局编辑器的 Code（代码）模式并修改 XML，使其内容如下：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  >\n\n    <com.example.gesture.GestureOverlayView\n        android:id=\"@+id/gOverlay\"\
  \n        android:layout_width=\"0dp\"\n        android:layout_height=\"0dp\"\n\
  \        app:layout_constraintBottom_toBottomOf=\"parent\"\n        app:layout_constraintLeft_toLeftOf=\"\
  parent\"\n        app:layout_constraintRight_toRightOf=\"parent\"\n        app:layout_constraintTop_toTopOf=\"\
  parent\" />\n\n</androidx.constraintlayout.widget.ConstraintLayout>\n```\n\n## 29.11\
  \ 加载手势文件\n\n手势文件已添加到项目，下一步是让应用程序在启动时加载该文件。为了实现这一目的，以下代码将添加到 `MainActivity` 源文件中：\n\
  \n```java\npackage com.ebookfrenzy.customgestures;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  import android.os.Bundle;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private GestureLibrary gLibrary;\n\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \        setup();\n    }\n\n    private void setup() {\n        gLibrary = GestureLibraries.fromResource(this,\
  \ R.raw.gestures);\n        if (!gLibrary.load()) {\n            finish();\n   \
  \     }\n    }\n}\n```\n\n## 29.12 注册事件\n\n为了让活动接收用户在屏幕上执行手势的通知，需要在 `layout` 视图上注册\
  \ `OnListener` 监听器，可以通过如下所示的方法获取其引用：\n\n```java\nprivate void setup() {\n    gLibrary\
  \ = GestureLibraries.fromResource(this, R.raw.gestures);\n    if (!gLibrary.load())\
  \ {\n        finish();\n    }\n    GestureOverlayView gOverlay = findViewById(R.id.gOverlay);\n\
  \    gOverlay.addOnGestureListener(this);\n}\n```\n\n## 29.13 实现 onGesturePerformed\
  \ 方法\n\n现在只需对初始测试运行是实现 `onGesturePerformed` 方法。这是在 `GestureOverlayView` 实例上执行手势时会被调用的方法：\n\
  \n```java\npublic void onGesturePerformed(GestureOverlayView overlay, Gesture gesture)\
  \ {\n    ArrayList<Prediction> predictions = gLibrary.recognize(gesture);\n    if\
  \ (predictions.size() > 0 && predictions.get(0).score > 1.0) {\n        String action\
  \ = predictions.get(0).name;\n        Toast.makeText(this, action, Toast.LENGTH_SHORT).show();\n\
  \    }\n}\n```\n\n\n\n当 Android 运行时在 `GestureOverlayView` 视图对象上检测到手势时，会调用 `onGesturePerformed`\
  \ 方法。作为参数传递的是检测到手势的 `GestureOverlayView` 对象的引用，以及一个 `Gesture` 类型的对象。`Gesture` 类用于存储定义特定手势的信息（本质上是屏幕上一系列带时间点，描绘了构成手势的笔画路径）。\n\
  \n`Gesture` 对象被传递给 `gLibrary` 实例的 `recognize()` 方法，其目的是将当前手势与从手势文件中的每个手势进行比较。一旦任务完成，`recognize()`\
  \ 方法将返回一个 `ArrayList` 对象，其中包含每次比较执行所需的 `Prediction` 对象。该列表按匹配程度从最好（数组位置 0 位）到最差进行排序。每个预测对象中包含了来自手势文件的对应手势名称，以及一个指示其与当前手势匹配程度的预测评分。\n\
  \n因此，上述方法中的代码获取位置 0（最匹配的项）的预测，确保其评分大于 1.0，然后显示一个 `Toast` 消息（一种用于向用户显示通知弹窗的 Android\
  \ 类），用以显示匹配的手势名称。\n\n## 29.14 测试应用程序\n\n在模拟器或物理 Android 设备上构建并运行应用程序，并在屏幕上执行圆形手势。执行后，应该出现一个包含检测到的手势名称的\
  \ toast 提示通知。请注意，当手势被识别时，它会在屏幕上用亮黄色的线条轮勒形式显示，而覆盖层表示不确定的手势则显示为淡黄色的线条。虽然这在开发期间很有用，但对于实际应用来说可能并不理想。显然，因此还有一些配置工作需要完成。\n\
  \n## 29.15 配置 GestureOverlayView\n\n默认情况下，`GestureOverlayView` 配置为在手势期间显示黄色线条。用于绘制已识别和未识别手势的颜色可以通过\
  \ `android:gestureColor` 和 `android:uncertainGestureColor` 属性定义。例如，要隐藏手势线条，请如下所示修改示例项目中的\
  \ `activity_main.xml` 文件：\n\n```xml\n<android.gesture.GestureOverlayView\n    android:id=\"\
  @+id/gOverlay\"\n    android:layout_width=\"0dp\"\n    android:layout_height=\"\
  0dp\"\n    app:layout_constraintBottom_toBottomOf=\"parent\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\"\n    android:gestureColor=\"#00000000\"\n    android:uncertainGestureColor=\"\
  #00000000\" />\n```\n\n重新运行应用程序后，手势现在应该是不可见的（因为它们是在 `ConstraintLayout` 视图的白色背景上以白色绘制）。\n\
  \n## 29.16 拦截手势\n\n如前所述，`GestureOverlayView` 是一个透明覆盖层，可以放置在其他视图之上。这引出了问题：当手势被识别时，手势覆盖层拦截的事件是否应该传递给底层视图？这通过\
  \ `GestureOverlayView` 实例的 `android:eventsInterceptionEnabled` 属性进行控制。设置为 `true`\
  \ 时，当识别出手势时，手势事件不会传递给底层视图。当手势在可能配置为响应某些手势而滚动的视图上执行时，此设置可能特别有用。将此属性设置为 `true` 可以避免手势同时被解释为底层视图向特定方向滚动的指令。\n\
  \n## 29.17 检测缩放手势\n\n在离开通用触摸处理特别是手势识别之前，本章的最后一个主题是处理缩放手势（pinch gestures）。虽然可以使用本章之前节节概述的步骤创建并检测各种手势，但实际上，使用目前为止讨论的技术无法检测缩放手势（即使用两个手指进行拉伸和捏合动作，通常用于放大或缩小视图或图像）。\n\
  \n检测缩放手势最简单的方法是使用 Android 的 `ScaleGestureDetector` 类。泛来说，检测缩放手势涉及以下三个步骤：\n\n1. 声明实现\
  \ `SimpleOnScaleGestureListener` 接口的新类，包括所需的 `onScale()`、`onScaleBegin()` 和 `onScaleEnd()`\
  \ 回调方法。\n2. 创建 `ScaleGestureDetector` 类实例，并将创建的类实例作为参数传递。\n3. 在封装的 activity 中实现\
  \ `onTouchEvent()` 回调方法，该方法反过来调用 `ScaleGestureDetector` 的 `onTouchEvent()` 方法。\n\
  \n在本章的剩余部分中，我们将创建一个示例来演示缩放手势识别的实现。\n\n## 29.18 缩放手势示例项目\n\n从欢迎屏幕选择 `Create New Project`\
  \ 快速启动，并在生成的新项目对话框中，点击 `Next` 按钮之前选择 `Empty Activity` 模板。\n\n在 `Name` 字段输入 `PinchExample`\
  \ 并指定 `com.ebookfrenzy.pinchexample` 为包名。在点击 `Finish` 按钮之前，将最低 API 设置为 `API 26:\
  \ Android 8.0 (Oreo)`，并将语言菜单设置为 `Java`。\n\n在 `activity_main.xml` 文件中，选择默认的 `TextView`\
  \ 对象并使用属性工具窗口将 ID 设置为 `myTextView`。\n\n找到并加载 `MainActivity.java` 文件到 Android Studio\
  \ 编辑器中，并如下所示修改文件：\n\n\n\n\n\n在 `onCreate()` 方法中，获取文本视图对象的引用并将其赋值给变量 `scaleText`。接下来，创建一个新的\
  \ `ScaleGestureDetector` 实例，并将所包含 activity 的引用以及我们新创建的 `MyOnScaleGestureListener`\
  \ 类的实例作为参数传递。最后，为 activity 实现 `onTouchEvent()` 回调方法，该方法简单地调用 `ScaleGestureDetector`\
  \ 对象对应的 `onTouchEvent()` 方法，并将 `MotionEvent` 对象作为参数传递。\n\n在模拟器或物理 Android 设备上编译并运行该应用程序，并在屏幕上执行捏合手势。注意，文本视图会根据捏合动作显示放大或缩出的消息。在模拟器的独立模式下，可以通过按住\
  \ `Ctrl`（或 `Cmd`）键并点击和拖动鼠标指针来模拟捏合手势，如图 29-3 所示：\n\n![](img/Image2449.jpg)\n\n图 29-3\n\
  \n## 29.19 总结\n\n手势本质上是触摸屏幕上接触点的运动，涉及一次或多次笔画，可以作为用户与应用程序之间的通信方法。Android 允许使用 Gesture\
  \ Builder 应用程序设计手势。一旦创建，手势就可以保存到手势文件中，并在应用程序运行时使用 `GestureLibrary` 加载到 activity\
  \ 中。\n\n通过在现有视图上覆盖透明的 `GestureOverlayView` 类的实例并实现 `OnGesturePerformedListener`\
  \ 事件监听器，可以在显示区域上检测手势。使用 `GestureLibrary`，可以生成用户执行的手势与存储在手势文件中的势之间的匹配列表，并使用预测分数判断手势是否足够匹配。\n\
  \n捏合手势可以通过实现 `ScaleGestureDetector` 类来检测，本章也提供了该类的示例。\n\n## 30. Android Fragment（片段）简介\n\
  \n随着你对本书章节的深入学习，你会发现 Android 系统背后的许多设计概念其构想目标都是促进构成应用程序的不同元素之间的复用和交互。本章将探讨的一个领域涉及\
  \ Fragment（片段）的使用。\n\n本章将概述 Fragment 的基础知识，包括它们是什么，以及如何在应用程序中创建和使用。下一章将通过一个教程，展示在\
  \ Android Studio 中开发应用程序时 Fragment 的运行情况，包括片段之间的通信实现。\n\n## 30.1 什么是 Fragment？\n\
  \nFragment 是应用程序用户界面及其相应行为的自包含、模块化部分，可以嵌入到 activity 中。Fragment 可以在应用程序设计阶段组合以创建一个\
  \ activity，并在应用程序运行时添加到 activity 中或从 activity 中移除，以创建动态变化的用户界面。\n\nFragment 只能作为\
  \ activity 的一部分使用，不能被实例化为独立的应用程序元素。尽管如此，一个 fragment 可以被认为是一个功能性的“子 activity”，它具有与完整\
  \ activity 类似的生命周期。\n\nFragment 以 XML 布局文件的形式存储，可以通过在 activity 的布局文件中放置适当的 `<fragment>`\
  \ 元素或直接通过 activity 类实现中的代码将其添加到 activity 中。\n\n## 30.2 创建 Fragment\n\n构成 Fragment\
  \ 的两个组件都是一个 XML 布局文件和一个对应的 Java 类。Fragment 的 XML 布局文件格式与任何其他 activity 布局的格式相同，可以包含任何组合和任何复杂度的布局管理器和视图。例如，下面的\
  \ XML 布局用于一个由 `ConstraintLayout` 组成的片段，该布局具有红色背景，并包含一个白色前景的 `TextView`：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:id=\"@+id/constraintLayout\"\n    android:layout_width=\"match_parent\"\
  \n    android:layout_height=\"match_parent\"\n    android:background=\"@android:color/holo_red_dark\"\
  \n    tools:context=\".FragmentOne\">\n    <TextView\n        android:id=\"@+id/textView1\"\
  \n        android:layout_width=\"wrap_content\"\n        android:layout_height=\"\
  wrap_content\"\n        android:text=\"My First Fragment\"\n        android:textAppearance=\"\
  @style/TextAppearance.AppCompat.Large\"\n        android:textColor=\"@color/white\"\
  \n        app:layout_constraintBottom_toBottomOf=\"parent\"\n        app:layout_constraintEnd_toEndOf=\"\
  parent\"\n        app:layout_constraintStart_toStartOf=\"parent\"\n        app:layout_constraintTop_toTopOf=\"\
  parent\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n```\n\n与布局对应的类必须是\
  \ `Fragment` 类的子类。该类至少应该重写 `onCreateView()` 方法，该方法负责加载 fragment。例如：\n\n```java\n\
  package com.example.fragmentdemo;\nimport android.os.Bundle;\nimport android.view.LayoutInflater;\n\
  import android.view.View;\nimport android.view.ViewGroup;\nimport androidx.fragment.app.Fragment;\n\
  \npublic class FragmentOne extends Fragment {\n    @Override\n    public View onCreateView(LayoutInflater\
  \ inflater, ViewGroup container, Bundle savedInstanceState) {\n        // 加载此片段的布局\n\
  \        return inflater.inflate(R.layout.fragment_one, container, false);\n   \
  \ }\n}\n```\n除了 `onCreateView()` 方法外，该类还可以重写标准的生命周期方法。一旦 fragment 布局和类创建完成，就可以在\
  \ activity 中使用了。\n\n### 30.3 使用布局 XML 将 Fragment 添加到 Activity\n\n可以通过编写 Java 代码或将\
  \ fragment 嵌入 activity 的布局文件将其纳入 activity。无论采用哪种方法，需要注意的关键点是，当旧版本使用支持库时，任何使用 fragment\
  \ 的 activity 必须实现为 `FragmentActivity` 的子类，而不是 `AppCompatActivity` 类：\n\n```java\n\
  package com.example.fragmentdemo;\nimport android.os.Bundle;\nimport androidx.fragment.app.FragmentActivity;\n\
  import android.view.Menu;\n\npublic class MainActivity extends FragmentActivity\
  \ {\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n \
  \       super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_demo);\n\
  \    }\n}\n```\n\nFragment 使用 `<fragment>` 元素嵌入到 activity 布局文件中。下面的示例布局将本章上一节创建的\
  \ fragment 嵌入到 activity 布局中：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<androidx.constraintlayout.widget.ConstraintLayout xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\"\n    android:layout_width=\"match_parent\"\n\
  \    android:layout_height=\"match_parent\"\n    tools:context=\".MainActivity\"\
  >\n    <fragment\n        android:id=\"@+id/fragment2\"\n        android:name=\"\
  com.ebookfrenzy.myfragmentdemo.FragmentOne\"\n        android:layout_width=\"0dp\"\
  \n        android:layout_height=\"wrap_content\"\n        android:layout_marginStart=\"\
  32dp\"\n        android:layout_marginEnd=\"32dp\"\n        app:layout_constraintBottom_toBottomOf=\"\
  parent\" />\n</androidx.constraintlayout.widget.ConstraintLayout>\n```\n\n\n\n\n\
  \n```xml\napp:layout_constraintEnd_toEndOf=\"parent\"\napp:layout_constraintStart_toStartOf=\"\
  parent\"\napp:layout_constraintTop_toTopOf=\"parent\"\ntools:layout=\"@layout/fragment_one\"\
  \ />\n</androidx.constraintlayout.widget.ConstraintLayout>\n```\n\n`<fragment>`\
  \ 元素中的关键属性是 `android:name`（必须引用与 fragment 的类）和 `tools:layout`（必须引用包含 fragment 布局的\
  \ XML 资源文件）。\n\n一旦添加到 activity 的布局中，就可以在 Android Studio 布局编辑器（Layout Editor）工具中查看和操作\
  \ fragment。例如图 30-1 显示了 Android Studio 布局编辑器中嵌入 fragment 的上述布局：\n\n![](img/as_4.1_my_first_fragment.jpg)\n\
  \n图 30-1\n\n## 30.4 在代码中添加和管理 Fragment\n\n通过 activity 的 XML 布局文件添加 fragment 虽然方便，但代价是\
  \ activity 无法在运行时移除该 fragment。为了在运行时对 fragment 实现完全的动态控制，必须通过代码添加这些 activity。这样做的优点是，在应用程序运行时，可以动态地添加、移除甚至让它们相互替换。\n\
  \n使用代码管理 fragment 时，fragment 本身仍然由一个 XML 布局文件和一个相应的类组成。区别在于在宿主 activity 中操作 fragment\
  \ 的方式。使用代码向 activity 添加 fragment 时，有一套标准的步骤序列：\n\n1. 创建 fragment 类实例。\n2. 将任何额外的意图参数（intent\
  \ arguments）传递给类实例。\n3. 获取 fragment 管理器（fragment manager）实例的引用。\n4. 调用 fragment\
  \ 管理器实例的 `beginTransaction()` 方法。这将返回一个 fragment 事务（fragment transaction）实例。\n5.\
  \ 调用 fragment 事务实例的 `add()` 方法，将包含 fragment 的视图资源 ID 和 fragment 类实例作为参数传递。\n6. 调用\
  \ fragment 事务的 `commit()` 方法。\n\n例如，下面的代码添加了由 `FragmentOne` 类定义的 fragment，使其显示在\
  \ ID 为 `LinearLayout1` 的容器视图中：\n\n```java\nFragmentOne firstFragment = new FragmentOne();\n\
  firstFragment.setArguments(getIntent().getExtras());\nFragmentManager fragManager\
  \ = getSupportFragmentManager();\nFragmentTransaction transaction = fragManager.beginTransaction();\n\
  transaction.add(R.id.LinearLayout1, firstFragment);\ntransaction.commit();\n```\n\
  \n上面的代码为了清晰起见，将每个步骤拆分为单独语句。然而，最后四行可以简写为一行代码：\n\n```java\ngetSupportFragmentManager().beginTransaction()\n\
  \    .add(R.id.LinearLayout1, firstFragment).commit();\n```\n\n一旦添加到容器中，随后可以通过调用\
  \ fragment 事务实例的 `remove()` 方法来移除 fragment，并传递要移除的 fragment 实例引用：\n\n```java\ntransaction.remove(firstFragment);\n\
  ```\n\n同样，可以通过调用 fragment 事务实例的 `replace()` 方法用一个 fragment 替换另一个。该方法的参数是包含 fragment\
  \ 的视图 ID 和新 fragment 的实例。被替换的 fragment 也可以放置在所谓的回栈（back stack）中，以便在用户导航返回时快速恢复。这是通过在调用\
  \ `commit()` 方法之前，调用 fragment 事务对象的 `addToBackStack()` 方法实现的：\n\n```java\nFragmentTwo\
  \ secondFragment = new FragmentTwo();\ntransaction.replace(R.id.LinearLayout1, secondFragment);\n\
  transaction.addToBackStack(null);\ntransaction.commit();\n```\n\n## 30.5 处理 Fragment\
  \ 事件\n\n如前所述，fragment 非常别像一个子 activity，拥有它自己的布局、类和生命周期。fragment 内部的视图组件（如按钮和文本视图）能够像普通\
  \ activity 一样产生事件。这引出了一个问题：哪个类来接收来自 fragment 中视图的事件？是 fragment 本身，还是嵌入 fragment\
  \ 的 activity？问题的答案取决于事件处理程序是如何声明的。\n\n在标题为 Android 事件处理概述与示例的章节中，讨论了两种处理事件的方法。第一方法涉及在\
  \ activity 的代码中配置事件监听器和回调方法。例如：\n\n```java\nbutton.setOnClickListener(\n    new\
  \ Button.OnClickListener() {\n        public void onClick(View v) {\n          \
  \  // 当按钮被点击时\n            // 执行的代码\n        }\n    }\n);\n```\n\n在拦截事件的情况下，第二种方法涉及在布局中设置\
  \ `android:onClick` 属性：\n\n```xml\n<Button\n    android:id=\"@+id/button1\"\n  \
  \  android:layout_width=\"wrap_content\"\n    android:layout_height=\"wrap_content\"\
  \n    android:onClick=\"onClick\"\n    android:text=\"Click me\" />\n```\n\n fragment\
  \ 中视图生成的事件通用规则是：如果使用事件监听器和回调方法在 fragment 类中声明了事件监听器，则事件将首先由 fragment 处理。如果使用了 `android:onClick`\
  \ 资源，事件将传递给包含该 fragment 的 activity。\n\n## 30.6 实现 Fragment 通信\n\n一旦一个或多个 fragment\
  \ 被嵌入 activity 中，fragment 与 activity 之间以及 fragment 之间很可能需要某种形式的通信。事实上，良好的实践要求 fragment\
  \ 之间不直接通信。所有通信应通过封装它的 activity 进行。\n\n为了 activity 与 fragment 通信，activity 必须通过分配的\
  \ ID 识别 fragment。一旦获取引用，activity 就可以调用 fragment 的公共方法。\n\n反向通信（从 fragment 到 activity）稍微复杂一些。首先，fragment\
  \ 必须定义一个监听接口，然后在 activity 类中实现它。例如，下面的代码在 `ToolbarFragment` 类中定义了一个名为 `ToolbarListener`\
  \ 的接口。代码还声明了一个变量，稍后存储 activity 的引用：\n\n```java\npublic class ToolbarFragment extends\
  \ Fragment {\n    ToolbarListener activityCallback;\n\n    public interface ToolbarListener\
  \ {\n        void onButtonClick(int position, String text);\n    }\n}\n```\n\n上面的代码规定任何实现\
  \ `ToolbarListener` 接口的类都必须实现名为 `onButtonClick` 的回调方法，该方法接受一个 `int` 和一个 `String`\
  \ 作为参数。\n\n接下来，需要重写并实现 fragment 类的 `onAttach()` 方法。Android 系统在 fragment 初始化并关联 activity\
  \ 时会自动调用该方法。该方法传递包含 fragment 的 activity 引用。该方法必须存储该 activity 的本地引用，并验证它是否实现了 `ToolbarListener`\
  \ 接口：\n\n```java\n@Override\npublic void onAttach(Context context) {\n    super.onAttach(context);\n\
  \    try {\n        activityCallback = (ToolbarListener) activity;\n    } catch\
  \ (ClassCastException e) {\n        throw new ClassCastException(activity.toString()\
  \ + \" must implement ToolbarListener\");\n    }\n}\n```\n\n\n\n\n\n执行此示例后，该 activity\
  \ 的引用将存储在本地变量 `activityCallback` 中，如果该 activity 没有实现 `ToolbarListener` 接口，则会抛出异常。\n\
  \n下一步是从 fragment 内部调用 activity 的回调方法。这在何时以及如何发生，完全取决于 fragment 需要联系 activity 的具体情况。例如，以下代码在点击按钮时调用\
  \ activity 的回调方法：\n\n```java\npublic void buttonClicked (View view) {\n    activityCallback.onButtonClick(arg1,\
  \ arg2);\n}\n```\n\n剩下的工作是修改 activity 类以实现 `ToolbarListener` 接口。例如：\n\n```java\n\
  public class MainActivity extends FragmentActivity\n               implements ToolbarFragment.ToolbarListener\
  \ {\n\n        public void onButtonClick(String arg1, int arg2) {\n            //\
  \ 实现回调方法的代码\n        }\n}\n```\n\n从上述代码中我们可以看到，activity 声明了它实现了 `ToolbarFragment`\
  \ 类的 `ToolbarListener` 接口，然后按照接口的要求实现了 `onButtonClick()` 方法。\n\n## 30.7 总结\n\nFragment\
  \ 为创建可重用的用户界面布局和应用行为模块提供了一种强大的机制，这些模块一旦创建，就可以嵌入到 activity 中。一个 fragment 由一个用户界面布局文件和一个类组成。可以通过将\
  \ fragment 添加到 activity 的布局文件中或者通过编写代码在运行时管理 fragment 来在 activity 中使用 fragment。通过代码添加到\
  \ activity 的 fragment 可以在运行时动态地删除和替换。fragment 之间的所有通信应该通过嵌入这些 fragment 的 activity\
  \ 进行。\n\n在本章涵盖了 fragment 的基础知识后，下一章将通过一个教程来强化本章中概述的技术。\n\n# 31. 在 Android Studio\
  \ 中使用 Fragments - 示例\n\n正如上一章所述，fragment 为创建可重用的应用功能模块提供了一种方便的机制，这些模块由用户界面的部分和相应的行为组成。一旦创建，fragment\
  \ 就可以嵌入到 activity 中。\n\n在上一章探索了 fragment 的整体理论后，本章的目标是使用 Android Studio 创建一个 Android\
  \ 应用程序示例，用于演示创建和使用 fragment 的实际步骤，并实现 activity 内部两个 fragment 之间的通信。\n\n## 31.1 关于示例\
  \ Fragment 应用\n\n在本章创建的应用程序将由一个 activity 和两个 fragment 组成。第一个 fragment 的用户界面将包含某种类型的工具栏，由一个\
  \ `EditText` 视图、一个 `SeekBar` 和一个 `Button` 组成，都包含在一个 `ConstraintLayout` 视图中。第二个 fragment\
  \ 将仅由一个 `TextView` 对象组成，同样包含在一个 `ConstraintLayout` 视图中。\n\n这两个 fragment 将嵌入应用程序的主\
  \ activity 中，并实现此类通信：当第一个 fragment 中的按钮被按下时，输入到 `EditText` 视图中的文本将出现在第二个 fragment\
  \ 的 `TextView` 上，其字体大小由第一个 fragment 中 `SeekBar` 的位置决定。\n\n由于此应用程序旨在运行在旧版本的 Android\
  \ 上，因此也需要使用适当的 Android 支持库。\n\n## 31.2 创建示例项目\n\n从欢迎界面选择 `Create New Project` 快速启动选项，在生成的新项目对话框中，点击\
  \ `Next` 按钮之前选择 `Empty Activity` 模板。\n\n在 `Name` 字段中输入 `FragmentExample`，并指定 `com.ebookfrenzy.fragmentexample`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为 `API 26: Android 8.0 (Oreo)`，并将\
  \ `Language` 菜单更改为 `Java`。\n\n## 31.3 创建第一个 Fragment 布局\n\n下一步是为将在我们的 activity 中使用的第一个\
  \ fragment 创建用户界面。\n\n该用户界面将由一个 XML 布局文件和一个 fragment 类组成。虽然可以手动添加，但让 Android Studio\
  \ 为我们创建会更快。在项目工具窗口中，找到 `app -> java -> com.ebookfrenzy.fragmentexample` 条目并右键点击它。从生成的菜单中，选择\
  \ `New -> Fragment -> Gallery...` 选项显示下方图 31-1 所示的对话框：\n\n![](img/as_4.0_fragment_gallery.jpg)\n\
  \n图 31-1\n\n点击 `Next` 按钮之前选择 `Fragment (Blank)` 模板。在后续屏幕上，将 fragment 命名为 `ToolbarFragment`，布局文件命名为\
  \ `fragment_toolbar`：\n\n![](img/as_4.0_configure_fragment.jpg)\n\n图 31-2\n\n使用\
  \ `Design` 模式将 `fragment_toolbar.xml` 文件加载到布局编辑器，在 Component Tree 面板中右键点击 `FrameLayout`\
  \ 条目并选择 `Convert FrameLayout to ConstraintLayout` 菜单选项，并在确认对话框中接受默认设置。将 `id` 从 `frameLayout`\
  \ 改为 `constraintLayout`。选择并删除默认的 `TextView`，向布局中添加 `Plain EditText`、`Seekbar` 和\
  \ `Button`，并将视图 id 分别更改为 `editText1`、`button1` 和 `seekBar1`。\n\n将按钮上的文本改为“Change\
  \ Text”，将文本提取到命名为 `change_text` 的字符串资源，并移除 `EditText` 视图中的 `Name` 文本。最后，将 Seekbar\
  \ 的 `layout_width` 属性设置为 `match_constraint`，左右边缘的边距设置为 16dp。\n\n使用 `Infer constraints`\
  \ 按钮添加任何缺失的约束，此时布局应与下方图 31-3 所示：\n\n![](img/as_4.1_toolbar_fragment.jpg)\n\n图 31-3\n\
  \n## 31.4 添加第二个 Fragment\n\n重复创建 toolbar fragment 的步骤，添加另一个命名为 `TextFragment` 的空\
  \ fragment，布局文件命名为 `fragment_text`。再次将 `FrameLayout` 容器转换为 `ConstraintLayout`（将\
