  \ != null) {\n            Uri uri = Uri.parse(\"http://<your_domain>/landmarks/\"\
  \ + landmark.getID());\n            Intent intent = new Intent(Intent.ACTION_VIEW,\
  \ uri);\n            startActivity(intent);\n        } else {\n            titleText.setText(\"\
  No match\");\n        }\n    }\n}\n```\n\n\n\n\nAndroid Profiler 出现在一个工具窗口中，可以通过\
  \ `View -> Tool Windows -> Android Profiler` 菜单选项，或通过任何用于显示 Android Studio 工具窗口的常规工具栏选项来启动。一旦显示，Profiler\
  \ 工具窗口将如图 82-1 所示所示：\n\n![](img/as_4.0_profiler_no_processes.jpg)\n图 82-1\n\n在上面的图中，在任何连接的设备或当前运行的模拟器上都未检测到任何进程。要查看分析信息，需要启动一个应用程序。然而，在此之前，可能需要配置项目以启用收集高级分析信息。\n\
  \n## 82.2 启用高级分析\n\n如果应用是使用早于 `API 26` 的 SDK 构建的，则有必要在编译期间插入一些额外的监控代码来构建应用，以便能够监控\
  \ Android Profiler 支持的所有指标。要启用高级分析，请从 Android Studio 工具栏菜单（如图 82-2 所示）中开始编辑构建目标的构建配置设置：\n\
  \n![](img/as_3.5_profiler_edit_configurations.jpg)\n图 82-2\n\n在 `Run/Debug` 配置对话框中，选择\
  \ `Profiling` 选项卡，并在点击 `Apply` 和 `OK` 按钮之前启用 `Enable advanced profiling` 选项。\n\n\
  ## 82.3 Android Profiler 工具窗口\n\n监控运行中应用程序的活动 Profiler 工具窗口如图 82-3 所示：\n\n![](img/as_3.2_main_profiler_window.jpg)\n\
  图 82-3\n\n`Sessions` 面板（标记为 A）列出了当前的分析会话以及自 Android Studio 上次启动以来执行的任何其他存储的会话。`Sessions`\
  \ 面板的右侧是实时分析窗口。除非使用 `Live` 按钮 (B) 暂停，否则窗口将继续随着最新指标进行滚动。再次点击该按钮将跳转到当前时间并恢复滚动。可以使用水平滚动在记录的时间轴内手动前后移动。\n\
  \n窗口的顶行 (C) 是事件时间轴，显示了应用活动状态的变化，以及其他事件，如用户触摸屏幕、输入文本或更改设备方向。底部时间轴 (D) 画了自应用启动以来的已时间。\n\
  \n其余时间轴显示了 `CPU`、`memory`、`network` 和 `energy` 使用的实时数据。将鼠标指针悬停在时间轴上的任何点上（不点击）将显示类似于图\
  \ 82-4 所示的额外信息：\n\n![](img/Image24514.jpg)\n图 82-4\n\n点击 `CPU`、`memory`、`networking`\
  \ 或 `energy` 时间轴内部，将显示相应的分析器窗口，每个窗口将在本章的剩余部分进行介绍。\n\n## 82.4 Sessions 面板\n\n当应用运行并显示\
  \ Profiler 工具窗口时，分析器会自动附加到应用并开始分析。显示应用名称、运行该应用的设备或模拟器以及开始时间的条目将出现在 `Sessions` 面板中，如图\
  \ 82-5 所示。时间旁边的绿色圆圈表示当前活跃的分析会话。按下红色停止按钮将结束当前会话，但数据和图表将保持可用，直到 Android Studio 退出。可以通过点击\
  \ `+` 按钮并选择设备和应用来启动额外的分析会话：\n\n![](img/as_3.2_profiler_sessions.jpg)\n图 82-5\n\n\
  时间旁边的绿色圆圈表示当前活跃的分析会话。按下红色停止按钮将结束当前会话，但数据和图表将保持可用，直到 Android Studio 退出。可以通过点击 `+`\
  \ 按钮并选择设备和应用来启动额外的分析会话：\n\n![](img/as_3.2_profiler_session_menu.jpg)\n图 82-6\n\n\
  `Load from file...` 菜单选项将之前从 `CPU profiler` 内部保存的 `CPU trace` 加载到 `Profiler` 中进行检查。\n\
  \n要在应用启动时自动对其进行分析（而不是在应用启动后手动启动分析会话），请先按照上述图 82-2 所示的概述打开 `Run / Debug Configurations`\
  \ 对话框。\n\n在对话框中，选择 `Profiling` 屏幕并启用 `Start this recording on startup` 和 `CPU activity`\
  \ 选项：\n\n![](img/as_4.1_profiler_start_recording.jpg)\n图 82-7\n\n要使此设置生效，必须使用 Android\
  \ Studio 的 `Run -> Profile ‘app’` 菜单选项启动应用。\n\n## 82.5 CPU Profiler\n\n显示时，`CPU\
  \ Profiler` 窗口将如图 82-8 所示。与主窗口一样，数据是实时显示的，包括事件时间轴 (A) 和显示实时 `CPU usage` (B) 的滚动图表，涵盖了当前应用以及设备上所有其他进程的总和：\n\
  \n![](img/as_4.0_cpu_profiler.jpg)\n图表下方是与当前关联的所有线程列表 (C)。被称为 `thread activity timeline`，它以滚动时间轴的形式呈现，用颜色块表示每个线程的状态（绿色表示活跃，黄色表示等待磁盘或网络\
  \ I/O 完成，灰色表示线程睡眠）。\n\nCPU Profiler 支持两种类型方法分析（即对运行应用内部的方法进行分析）。当前跟踪类型使用标记为 D 的菜单选择\
  \ `sampled` 或 `instrumented`。跟踪类型总结如下：\n\n- `Sampled (Java)`：频繁捕捉调用栈以收集 Java 代码的跟踪数据。相比于插分析分析入侵性较小，但采样分析可能会在间隔期间丢失方法调用。可以通过选择类型菜单中的\
  \ `Edit configurations` 按钮更改快照频率。\n- `Instrumented (Java)`：跟踪运行应用内所有方法调用的开始和结束。这种方法的优点是分析过程中不会丢失方法调用，但由于跟踪所有方法调用的开销可能会影响应用性能，导致误导性的性能数据。\n\
  - `Sampled (Native)`：频繁捕捉调用栈以收集应用内原生（例如 C 或 C++）代码执行的跟踪数据。\n- `System Trace`：分析设备运行时系统级\
  \ CPU 和线程活动（即发生在应用进程之外的 CPU 活动）。\n\n在点击 `record` 按钮 (E) 后才会开始方法分析并持续到停止记录。记录完成后，Profiler\
  \ 工具窗口将如图 82-12 所示以调用图格式显示方法跟踪，包括方法的执行时间信息。记录的跟踪也将出现在 Sessions 面板中。点击磁盘图标（如下方图 82-9\
  \ 所示）允许跟踪保存到文件，以便日后在分析器中进行检查：\n\n![](img/as_3.2_profiler_save_trace.jpg)\n图 82-9\n\
  \n跟踪结果可以在 `Top Down`、`Bottom Up`、`Call Chart` 和 `Flame Chart` 模式下查看，每种模式总结如下：\n\n\
  - `Top Down`：以分级格式显示跟踪期间调调用的方法。选择一个方法将展开层次结构的下一级并显示调用该方法的任何方法：\n\n![](img/as_4.0_profiler_top_down.jpg)\n\
  \n\n\n\n图 82-10\n\n-   **自底向上（Bottom Up）** – 显示跟踪期间调用的方法的反转层级列表。选择一个方法会显示调用该方法的方法列表：\n\
  \n![](img/as_4.0_profiler_bottom_up.jpg)\n\n图 82-11\n\n-   **调用图（Call Chart）** –\
  \ 提供方法跟踪列表的图形化表示，其中横轴表示方法调用的开始、结束和持续时间。在纵轴上，每一行代表上方方法所调用的方法。应用包含的方法显示为绿色，API 方法为橙色，第三方方法显示为蓝色：\n\
  \n![](img/as_4.0_profiler_call_chart.jpg)\n\n图 82-12\n\n-   **火焰图（Flame Chart）**\
  \ – 提供方法跟踪列表的反转图形化表示，其中每个方法在横轴上的大小根据其相对于其他方法的执行时间来确定。图中较宽的条目代表相对于其他方法使用最多执行时间的方法，这易于识别哪些方法消耗了最长时间。请注意，具有相同调用栈的方法调用（换句话说，由于同一序列前置方法调用结果而重复调用方法的情况）在此视图中合并，以提供该方法在跟踪期间性能的整体表示：\n\
  \n![](img/as_4.0_profiler_flame_chart.jpg)\n\n在上述任何视图中右键点击方法条目，提供了在代码编辑器窗口打开该方法源代码的选项。\n\
  \n## 82.6 内存分析器 (Memory Profiler)\n\n在主 Android Profiler 工具窗口中点击内存时间轴时，会显示内存分析器，并如图\
  \ 82-14 所示：\n\n![](img/as_3.2_memory_profiler_window.jpg)\n\n图 82-14\n\n内存时间轴显示了根据颜色图例所示的不同类别相对于时间轴右侧刻度的内存分配情况。虚线\
  \ `(A)` 代表相对于时间轴图左侧刻度为应用分配的对象数量。\n\n垃圾桶图标 `(B)` 表示垃圾回收事件。当 Android 运行时认为内存中的某个对象不再需要并自动将其移除以释放内存时，就会发生垃圾回收事件。\n\
  \n除了常规的时间轴外，窗口还包含强制执行垃圾回收事件和捕捉堆转储的按钮 `(C)`。\n\n堆转储（图 82-15）列出了执行转储时应用内所有使用内存的对象，显示了堆中对象的实例数量（分配计数）、该对象所有实例的大小（浅大小\
  \ shallow size）以及 Android 运行时系统为这些对象持有的内存总量（保留大小 retained size）。\n\n![](img/as_3.2_heap_profiler_window.jpg)\n\
  \n图 82-15\n\n双击堆列表中的对象将显示实例视图面板（如图 82-16 中标记为 `A`），该面板显示应用内该对象的实例列表。从列表中选择一个实例将显示引用面板\
  \ `(B)`，列出引用该对象的地方。例如，图 82-16 显示已选择了一个 `String` 实例，它被列为由应用 `MainActivity` 类中名为 `myString`\
  \ 的变量引用：\n\n![](img/Image2514.jpg)\n\n图 82-16\n\n右键点击引用将提供跳转到堆列表中 `MainActivity`\
  \ 类的选项，或跳转到该类的源代码。\n\n## 82.7 网络分析器 (Network Profiler)\n\n网络分析器是 Android Profiler\
  \ 提供的工具中最不复杂的。当选中时，网络工具窗口如图 82-17 所示所示：\n\n![](img/as_3.2_network_profiler_window.jpg)\n\
  \n图 82-17\n\n与其他分析器窗口一样，网络分析器窗口包含事件时间轴。无线电时间轴（图 82-17 中标记为 `A`）显示相对于 Wi-Fi 连接（如果有）的无线电状态。时间轴图\
  \ `(B)` 包括发送和接收的数据以及当前连接的数量。目前，网络分析器能够监控由 `HttpURLConnection` 和 `OkHttp` 连接执行的网络活动。\n\
  \n要查看发送或接收的信息，请点击并拖动时间轴以选择一段时间。完成选择后，图 82-18 中标记为 `A` 的面板将出现并列出文件。从列表中选择文件将显示详细面板\
  \ `(B)`，从中可以获得更多信息，包括响应、头部和调用栈信息：\n\n![](img/Image2544.jpg)\n\n图 82-18\n\n## 82.8\
  \ 能量分析器 (Energy Profiler)\n\n能量分析器（图 82-19）对当前运行应用的能量使用进行实时分析，分为 CPU、网络和位置跟踪活动。\n\
  \n![](img/as_3.2_energy_profiler_window.jpg)\n\n19\n\n能量分析器包含一个事件时间轴 `(A)` 和一个指示当前能量使用的图\
  \ `(B)`。该图根据图例 `(C)` 染色，该图例也指示了能量使用水平。选择图的某部分将列出任何贡献的系统进程。\n\nAndroid Profiler 实时监控应用的\
  \ CPU、内存、网络和能量使用，提供了一个视觉环境，用于定位内存泄漏、性能问题以及过度或低效的电池使用或网络连接上的数据传输。由不同的分析器视图组成，Android\
  \ Profile 允许对详细指标进行监控、记录和分析。\n\n## 83. Android 生物识别认证教程\n\n许多 Android 设备现在内置了触控传感器，用于识别用户并提供对设备和应用功能的访问，例如使用指纹识别的应用内支付选项。指纹识别当然是多种身份验证方法（包括密码、PIN\
  \ 码和最近的面部识别）之一。\n\n尽管目前市场上只有少数 Android 设备提供面部识别，但在不久的将来这可能会变得更加常见。由于此，Google 开始从以指纹为中心的应用添加身份验证的方法转变为一种更通用的方法，即生物识别。在\
  \ Android 8 的初始版本中，这些生物识别特征仅涵盖指纹识别，但在 Android 操作系统和 SDK 的未来发布和更新中将会发生。\n\n本章提供了生物识别的概述以及一个详细的分步骤教程，演示了在\
  \ Android 应用项目中实现生物识别的实用方法。\n\n## 83.1 生物识别概述\n\n关键的生物识别组件是 `BiometricPrompt` 类。该类执行了许多在早期\
  \ Android 版本中需要编写代码完成的工作，包括显示标准对话框以引导用户通过身份验证过程、执行身份验证并将结果报告给应用。该类还处理了多次失败的身份验证尝试，并在用户重试之前强制超时。\n\
  \n\n\n\n`BiometricPrompt` 类包含一个伴侣类 `Builder`，该类可用于配置和创建 `BiometricPrompt` 实例，包括定义显示在生物识别认证对话框中的文本，以及对对话框中取消按钮（也称为负向按钮）进行自定义。\n\
  \n`BiometricPrompt` 实例还分配了一组身份验证回调，这些回调将被调用以为应用程序提供身份验证操作的结果。还会使用 `CancellationSignal`\
  \ 实例允许应用程序在认证过程中取消认证。\n\n在涵盖这些基础知识后，本章的剩余部分将在示例项目中实现基于指纹的生物识别认证。\n\n## 83.2 创建生物识别认证项目\n\
  \n从欢迎界面选择 `Create New Project` 启动选项，在生成的新项目对话框中，点击 `Next` 按钮之前选择 `Empty Activity`\
  \ 模板。\n\n在 `Name` 字段中输入 `BiometricDemo` 并指定 `com.ebookfrenzy.biometricdemo` 为包名。在点击\
  \ `Finish` 按钮之前，将 `Minimum API level` 设置更改为 `API 29: Android 9.0 (Pie)`，并将 `Language`\
  \ 菜单更改为 `Java`。\n\n## 83.3 配置设备指纹认证\n\n指纹认证仅在包含触摸传感器的设备上可用，并且已采取了适当的配置步骤来保护设备并注册至少一个指纹。有关配置模拟器会话以测试指纹认证的步骤，请参考标题为使用和配置\
  \ Android Studio AVD 模拟器的章节。\n\n要在物理设备上配置指纹认证，首先打开 `Settings` 应用并选择 `Security` 选项。在\
  \ `Security` 设置屏幕内，选择 `Fingerprint` 选项。在生成的信息屏幕上点击 `Next` 按钮进入 `Fingerprint` 设置屏幕。在启用指纹安全之前，必须配置备用锁屏解锁方法（例如\
  \ `PIN` ）。如果锁屏尚未受保护，请按照步骤配置 `PIN`、`pattern` 或 `password` 安全。\n\n锁屏受保护后，进入指纹检测屏幕，并在提示时触摸传感器（图\
  \ 83-1），如果需要，重复此过程以添加额外的指纹。\n\n![](img/Image24258.jpg)\n\n图 83-1\n\n## 83.4 在 Manifest\
  \ 文件添加生物识别权限\n\n生物识别认证要求应用程序在项目清单文件中请求 `USE_BIOMETRIC` 权限。在 Android Studio 项目工具窗口中，找到并编辑\
  \ `app` -> `manifests` -> `AndroidManifest.xml` 文件，按如下方式添加权限请求：\n\n```xml\n<?xml\
  \ version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.biometricdemo\">\n    <uses-permission\n       \
  \ android:name=\"android.permission.USE_BIOMETRIC\" />\n..\n```\n\n## 83.5 设计用户界面\n\
  \n为了保持示例尽可能简单，用户界面中的唯一视觉元素将是一个 `Button` 视图。定位并选择 `activity_main.xml` 布局资源文件，将其加载到布局编辑器工具中。\n\
  \n删除示例 `TextView` 对象，从调色板的 `Common` 类别中拖放一个 `Button` 对象，并将其放置在布局画布的中央。使用 `Attributes`\
  \ 工具窗口更改按钮上的 `text` 属性为“Authenticate”，并将字符串提取到资源中。最后，配置 `onClick` 属性以调用名为 `authenticateUser`\
  \ 的方法。\n\n完成上述步骤后，布局应与图 83-2 所示所示：\n\n![](img/as_4.1_biometric_demo_ui.jpg)\n\n\
  图 83-2\n\n## 83.6 添加 Toast 便捷方法\n\n在本示例代码的各个位置，应用程序将设计为通过 `Toast` 消息向用户显示信息。为了避免多次重复相同的\
  \ `Toast` 代码，将在主活动中添加一个名为 `notifyUser()` 的便利方法。该方法将接受单个 `String` 值并以 `Toast` 消息的形式显示给用户。现在编辑\
  \ `MainActivity.java` 文件并如下所示添加此方法：\n\n```java\n.\nimport android.widget.Toast;\n\
  .\nprivate void notifyUser(String message) {\n    Toast.makeText(this,\n       \
  \          message,\n                 Toast.LENGTH_LONG).show();\n}\n.\n```\n\n\
  ## 83.7 检查安全设置\n\n在本章前面的部分，已经在要在测试应用程序的设备或模拟器上配置了锁屏并注册了指纹。然而，在尝试请求指纹认证之前，在应用程序中包含防御性代码以确保已了这些要求。这些步骤将在\
  \ `MainActivity.java` 文件中的 `onCreate` 方法中执行，利用 `Keyguard` 和 `PackageManager` 管理服务。注意，还添加了代码来验证已为应用程序配置了\
  \ `USE_BIOMETRIC` 权限：\n\n```java\npackage com.ebookfrenzy.biometricdemo;\n\nimport\
  \ androidx.appcompat.app.AppCompatActivity;\nimport androidx.core.app.ActivityCompat;\n\
  import android.widget.Toast;\nimport android.Manifest;\nimport android.content.pm.PackageManager;\n\
  import android.app.Keyguard;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n\
  \        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \        checkBiometric();\n    }\n\n    private Boolean checkBiometric() {\n  \
  \      Keyguard keyguardManager = (Keyguard) getSystemService(KEYGUARD_SERVICE);\n\
  \        PackageManager packageManager = this.getPackageManager();\n        if (!keyguardManager.isKeyguardSecure())\
  \ {\n            notifyUser(\"Lock screen not enabled\");\n            return false;\n\
  \        }\n        if (ActivityCompat.checkSelfPermission(this, Manifest.permission.USE_BIOMETRIC)\
  \ != PackageManager.PERMISSION_GRANTED) {\n            notifyUser(\"Fingerprint\
  \ permission not enabled\");\n            return false;\n        }\n        if (packageManager.hasSystemFeature(PackageManager.FEATURE_FINGERPRINT))\
  \ {\n            return true;\n        }\n        return true;\n    }\n}\n```\n\n\
  上述代码首先使用 `Keyguard` 管理器验证是否已配置备用锁屏解锁方法（句话说，可以使用 `PIN` 或其他认证方法作为指纹认证的替代方案来解锁屏幕）。如果锁屏未受保护，代码将向用户报告问题并返回方法。\n\
  \n然后，该方法将检查用户是否为应用程序启用了生物识别权限，然后使用 `PackageManager` 验证设备上是否存在指纹认证。\n\n## 83.8 配置身份验证回调\n\
  \n当配置生物识别提示对话框时，需要分配一组身份验证回调方法，这些方法将被调用以通知应用程序认证过程的成功或失败。这些方法需要封装在 `BiometricPrompt.AuthenticationCallback`\
  \ 类实例中。在 `MainActivity.java` 文件中，添加一个方法来创建并返回该类的实例，并实现相应的方法：\n\n```java\nimport\
  \ android.hardware.biometrics.BiometricPrompt;\n\nprivate BiometricPrompt.AuthenticationCallback\
  \ getAuthenticationCallback() {\n    return new BiometricPrompt.AuthenticationCallback()\
  \ {\n        @Override\n```\n\n\n\n\n```java\npublic void onAuthenticationError(int\
  \ errorCode, CharSequence errString) {\n    notifyUser(\"Authentication error: \"\
  \ + errString);\n    super.onAuthenticationError(errorCode, errString);\n}\n\n@Override\n\
  public void onAuthenticationHelp(int helpCode, CharSequence helpString) {\n    super.onAuthenticationHelp(helpCode,\
  \ helpString);\n}\n\n@Override\npublic void onAuthenticationFailed() {\n    super.onAuthenticationFailed();\n\
  }\n\n@Override\npublic void onAuthenticationSucceeded(BiometricPrompt.AuthenticationResult\
  \ result) {\n    notifyUser(\"Authentication Succeeded\");\n    super.onAuthenticationSucceeded(result);\n\
  }\n```\n\n## 83.9 添加 CancellationSignal\n\n一旦启动，生物识别身份验证过程将独立于应用程序执行。为了给应用程序提供取消操作的方法，可以创建一个\
  \ `CancellationSignal` 类的实例并将其传递给生物识别身份验证过程。随后该 `CancellationSignal` 实例可以在需要时取消该过程。取消信号实例可以配置一个监听器，该监听器将在取消完成后被调用。在活动类中添加一个新方法，如下所示，用于配置并返回\
  \ `CancellationSignal` 对象：\n\n```java\nimport android.os.CancellationSignal;\n\n\
  private CancellationSignal cancellationSignal;\n\nprivate CancellationSignal getCancellationSignal()\
  \ {\n    cancellationSignal = new CancellationSignal();\n    cancellationSignal.setOnCancelListener(new\
  \ CancellationSignal.OnCancelListener() {\n        @Override\n        public void\
  \ onCancel() {\n            notifyUser(\"Cancelled via signal\");\n        }\n \
  \   });\n    return cancellationSignal;\n}\n```\n\n## 83.10 启动生物识别提示\n\n剩下的工作是在\
  \ `authenticateUser()` 方法中添加代码，创建并配置 `BiometricPrompt` 实例并启动身份验证。如下添加 `authenticateUser()`\
  \ 方法：\n\n```java\nimport android.view.View;\nimport android.content.DialogInterface;\n\
  \npublic void authenticateUser(View view) {\n    BiometricPrompt biometricPrompt\
  \ = new BiometricPrompt.Builder(this)\n        .setTitle(\"Biometric Demo\")\n \
  \       .setSubtitle(\"Authentication is required to continue\")\n        .setDescription(\"\
  This app uses biometric authentication to protect your data.\")\n        .setNegativeButton(\"\
  Cancel\", this.getMainExecutor(), new DialogInterface.OnClickListener() {\n    \
  \        @Override\n            public void onClick(DialogInterface dialogInterface,\
  \ int i) {\n                notifyUser(\"Authentication cancelled\");\n        \
  \    }\n        })\n        .build();\n    biometricPrompt.authenticate(getCancellationSignal(),\
  \ getMainExecutor(), getAuthenticationCallback());\n}\n```\n\n`BiometricPrompt.Builder`\
  \ 类用于创建一个新的 `BiometricPrompt` 实例，并配置标题、副标题和描述文本，以显示在提示对话框中。负按钮被配置为显示“Cancel”文本，并配置了一个在点击此按钮时显示消息的监听器。最后，调用\
  \ `BiometricPrompt` 实例的 `authenticate()` 方法，并传递 `AuthenticationCallback` 和 `CancellationSignal`\
  \ 实例。生物识别提示还需要知道在哪个线程上执行身份验证。这是通过传递一个配置为所需线程的 `Executor` 对象来定义的。在这种情况下，使用 `getMainExecutor()`\
  \ 方法将主 `Executor` 对象传递给 `BiometricPrompt` 实例，以便身份验证过程在应用程序的主线程上进行。\n\n## 83.11 测试项目\n\
  \n现在项目已完成，请在物理 Android 设备或模拟器会话上运行应用程序，并点击身份验证（Authenticate）按钮，显示如图 83-3 所示的 `BiometricPrompt`\
  \ 对话框：\n\n![](img/as_3.2_biometric_prompt.jpg)\n图 83-3\n\n运行后，触碰指纹传感器或使用模拟器内的扩展控制面板，按照“使用和配置\
  \ Android Studio AVD 模拟器”章节概述的方法来模拟指纹触摸。假设检测到已注册的指纹，提示对话框将返回主活动，此时将出现来自成功身份验证回调方法的吐司（toast）消息。\n\
  \n再次点击身份验证按钮，这次使用未注册的指纹尝试进行身份验证。这一次，生物识别提示对话框将指示指纹未被识别：\n\n![](img/as_3.2_biometric_prompt_failed.jpg)\n\
  图 83-4\n\n点击生物识别提示对话框外的区域来验证错误处理回调是否正常工作。提示对话框将消失，并显示带有以下消息的吐司：\n\nAuthentication\
  \ error: Fingerprint operation cancelled by user.\n\n检查使用取消按钮取消提示对话框是否会触发“Authentication\
  \ Cancelled”吐司消息。最后，尝试使用未注册的指纹多次进行身份验证，并注意在尝试多次后，提示对话框会指示失败过多，在稍后之前无法再次尝试。\n\n##\
  \ 83.12 总结\n\n本章概述了如何将生物识别身份验证集成到 Android 应用程序项目中。这涉及对 `BiometricPrompt` 类的使用，该类一旦配置了适当的消息文本和回调，就能自动处理大部分身份验证过程。\n\
  \n# 84 创建、测试和上传 Android App Bundle\n\n一旦 Android 应用程序的开发工作完成，并且该程序已在广泛的 Android\
  \ 设备上通过了测试，下一步是准备将应用程序提交到 Google Play。然而，在提交之前，必须对应用程序进行发布打包并使用私钥进行签名。本章将介绍获取私钥、为项目准备\
  \ Android App Bundle 以及将其上传到 Google Play 的步骤。\n\n## 84.1 发布准备流程\n\n到本书目前为止，我们一直在以适用于测试和调试的模式构建应用程序项目。相反，通过\
  \ Google Play 向客户发布应用程序包需要采取一些额外的步骤。第一个要求是使用发布模式而不是调试模式编译应用程序。其次，应用程序必须使用私钥进行签名，该密钥将唯一标识您作为应用程序的开发者。最后，应用程序必须打包成\
  \ Android App Bundle。\n\n虽然这些任务都可以在 Android Studio 环境外执行，但正如本章剩余部分概述的，使用 Android\
  \ Studio 构建机制可以更容易地完成这些操作。不过，了解更多关于 Android App Bundles 的信息是重要的。\n\n## 84.2 Android\
  \ App Bundles\n\n\n\n\n\n当用户从 Google Play 安装应用时，该应用会以 `APK` 文件的形式下载。该文件包含了在用户设备上安装和运行该应用所需的所有内容。在\
  \ `Android Studio 3.2` 引入之前，开发者会使用 `Android Studio` 生成一个或多个 `APK` 文件并将其上传到 Google\
  \ Play。为了支持多种设备类型、屏幕尺寸和本地语言，这通常需要为每个目标设备和语言创建并上传多个自定义的 `APK` 文件，或者生成一个包含所有不同配置资源和平台二进制的大型通用\
  \ `APK` 包。\n\n创建多个 `APK` 文件涉及大量工作，且每次需要更新应用时都要重复这些工作，这给应用发布过程带来了相当的时间开销。\n\n通用 `APK`\
  \ 选项虽然减轻了开发者的负担，但也导致了一个完全意料之外的问题。通过分析应用安装指标，Google 发现安装包 `APK` 文件越大（导致下载时间变长和设备存储占用增加），应用获得的转化率就越低。转化率的计算方式为：在\
  \ Google Play 上查看该应用后完成安装的用户占的百分比。事实上，Google 估计 `APK` 文件大小每增加 6MB，应用的转化率就会下降 1%。\n\
  \nAndroid App Bundle（Android 应用包）通过提供一种方式解决了这两个问题：开发者可以在 `Android Studio` 内部创建一个单一包，并让\
  \ Google Play 为每个单独支持的配置自动生成自定义 `APK` 文件（这一概念被称为动态交付 Dynamic Delivery）。\n\nAndroid\
  \ App Bundle 本质上是一个 `ZIP` 文件，包含了所有必要的文件，用于为应用项目中支持的设备和本地语言构建 `APK` 文件。例如，项目可能包含不同屏幕尺寸的资源和图像。当用户安装应用时，Google\
  \ Play 会接收有关用户设备的信息，包括显示器、处理器架构和本地语言。利用这些信息，会将相应的预生成 `APK` 文件传输到用户的设备上。\n\n动态交付的额外优势是能够将应用拆分为多个模块（称为动态功能模块），每个模块包含应用内特定功能区域的代码和资源。每个动态功能模块都包含在与基础模块分离的独立\
  \ `APK` 文件中，并且只有在用户需要该功能时才会下载到设备上。动态交付和应用包还允许创建即时动态功能模块，这些可以在无需安装整个应用的情况下在设备上立即运行。这些主题将从题为“Android\
  \ 动态功能模块概述”的章节开始详细介绍。\n\n尽管仍然可以从 `Android Studio` 生成 `APK` 文件，但应用包现在是向 Google Play\
  \ 上传应用的推荐方式。\n\n## 84.3 注册 Google Play 开发者控制台账户\n\n应用提交过程的第一步是创建一个 Google Play 开发者控制台账户。要执行操作，请导航到\
  \ `https://play.google.com/apps/publish/signup/` 并按照说明完成注册过程。注意，注册需要支付一次性费用 25 美。一旦应用开始发售，Google\
  \ 将保留与应用相关的所有收入的 30%。\n\n创建账户后，下一步是收集有关应用的信息。为了将您的应用推向市场，需要以下信息：\n\n- **标题 (Title)**\
  \ – 应用名称。\n- **短描述 (Short Description)** - 最多 80 个字的应用描述。\n- **完整描述 (Full Description)**\
  \ – 最多 4000 个字的应用描述。\n- **截图 (Screenshots)** – 最多 8 张应用运行截图（至少需要两张）。Google 建议提交在\
  \ 7 英寸或 10 英寸平板上运行的应用截图。\n- **语言 (Language)** – 应用语言（默认为美式英语）。\n- **宣传文本 (Promotional\
  \ Text)** – 当您的应用出现在 Google Play 环境内的特殊推广功能时使用的文本。\n- **应用类型 (Application Type)**\
  \ – 您的应用被视为游戏还是应用。\n- **类别 (Category)** – 最能描述您应用的类别（例如金融、健康与健身、教育、体育等）。\n- **地区\
  \ (Locations)** – 您希望您的应用可供购买的地理位置。\n- **联系详情 (Contact Details)** – 用户可以通过哪些方式联系您获取有关应用的支持。选项包括网页、电子邮件和电话。\n\
  - **定价与投放 (Pricing & Distribution)** – 关于应用价格以及营销和销售地理位置的信息。\n\n收集完上述信息后，点击 Google\
  \ Play Console 中的`创建应用 (Create app)` 按钮开始创建过程。\n\n## 84.4 在控制台中配置应用\n\n当首次点击`创建应用`按钮时，将显示应用详情和声明屏幕，如下方的图\
  \ 84-1 所示：\n\n```\nimage/as_4.1_play_create_app.jpg\n```\n图 84-1\n\n应用配置完成后，点击`创建应用`按钮以添加应用并显示仪表板屏幕。在仪表板中，找到`初始设置\
  \ (Initial setup)`部分并展开步骤列表：\n\n```\nimage/as_4.1_play_app_steps.jpg\n```\n图 84-2\n\
  \n按照列表进行操作，为您的应用提供所需的信息。\n\n## 84.5 启用 Google Play 应用签名\n\n直到最近，Google Play 的上传都是使用\
  \ `Android Studio` 内部的发布签名密钥进行签名，然后上传到 Google Play。虽然这种选项仍然可用，但现在推荐的上传方式是使用所谓的 Google\
  \ Play 应用签名。对于新创建的应用，这涉及启用 Google Play 应用签名，并随后 `Android Studio` 内部生成一个上传密钥。当上传由\
  \ `Android Studio` 生成的应用包文件时，Google Play 会移除上传密钥，并使用存储在 Google Play 服务器中的应用签名密钥进行签名。对于现有应用，还需要额外的步骤来启用\
  \ Google Play 签名，将在本书末尾介绍。\n\n在 Google Play 控制台中，从`所有应用 (All Apps)`屏幕选择新添加的应用条（通过左侧导航面板顶部选项访问），展开`设置\
  \ (Setup)`部分（如图 84-3 中的 A 所示），并选择`应用签名 (App Signing)`选项（B）。\n\n```\nimage/as_4.1_play_enable_app_signing.jpg\n\
  ```\n图 84-3\n\n## 84.6 创建密钥库文件\n\n要创建密钥库文件，选择`Android Studio 构建 -> 生成签名包或 APK (Build\
  \ -> Generate Signed Bundle / APK…)` 菜单选项，显示`生成签名包或 APK 向导`对话框，如图 84-4 所示：\n\n```\n\
  image/android_studio_3.2_select_app_bundle.jpg\n```\n图 84-4\n\n\n\n\n在点击 `Next`\
  \ 按钮之前，请确认已选择 Android App Bundle（Android 应用包）。\n\n如果您已有有的发布密钥库（keystore）文件，请点击下一屏幕上的\
  \ `Choose existing…` 按钮，导航并选择该文件。如果您尚未创建密钥库文件，请点击 `Create new…` 按钮显示 `New Key Store`\
  \ 对话框（图 84-5）。点击 Key store 路径字段右侧的按钮，导航到文件系统中的合适位置，为密钥库文件输入名称（例如 `release.keystore.jks`），并点击\
  \ `OK` 按钮。\n\n`New Key Store` 对话框分为两个部分。上半部分与密钥库文件相关。在此部分中，在 `Password` 和 `Confirm`\
  \ 字段中输入一个强密码来保护密钥库文件。对话框的下半部分与将存储在密钥库文件中的上传密钥相关。\n\n![](img/Image2483.jpg)\n图 84-5\n\
  \n在 `New Key Store` 对话框的 `Certificate`（证书）部分中，输入以下信息：\n\n• 引用密钥的别名（alias）。可以是任何字符序列，但系统仅使用前\
  \ 8 个字符。\n• 用于保护密钥的足够强力的密码。\n• 密钥的年数（谷歌建议时长超过 25 年）。\n\n此外，必须为剩余字段中的至少一个提供信息（例如，您的姓和名，或组织名称）。\n\
  \n![](img/Image24921.jpg)\n图 84-6\n\n信息输入完成后，点击 `OK` 按钮继续创建应用包。\n\n## 84.7 创建 Android\
  \ App Bundle\n\n下一步是指示 Android Studio 在发布模式下构建应用程序应用包文件，然后使用新创建的私钥对其进行签名。此时，`Generate\
  \ Signed Bundle or APK`（生成签名的应用包或 APK）对话框应仍显示，且密钥库路径、密码和密钥别名字段已填充了信息：\n\n![](img/android_studio_3.2_keystore_info.jpg)\n\
  图 84-7\n\n确保已启用 `Export Encrypted Key`（导出加密密钥）选项，并在假设其他设置正确的情况下，点击 `Next` 按钮进入应用包生成屏幕（图\
  \ 84-8）。在此屏幕中，检查 `Destination Folder:`（目标文件夹）设置，以验证生成应用包文件的位置是可接受的。如果希望其他位置，请点击文本字段右侧的按钮并导航到所需的文件系统位置。\n\
  \n![](img/android_studio_3.2_generate_app_bundle.jpg)\n图 84-8\n\n点击 `Finish` 按钮并等待\
  \ `Gradle` 系统构建应用包。构建完成后，将出现一个对话框，提供在资源管理器窗口中打开包含应用包文件的的选项，或将文件加载到 `APK Analyzer`\
  \ 中：\n\n![](img/android_studio_3.2_app_bundle_generated.jpg)\n图 84-9\n\n此时，应用程序已准备好提交到\
  \ Google Play。点击 `locate` 链接打开文件系统浏览器窗口。文件名称应为 `bundle.aab`，并位于项目文件夹的 `app/release`\
  \ 子目录下，除非指定了其他位置。\n\n在此过程中生成的私钥应在签名和发布未来的应用程序时使用，因此应保存在安全的地方并进行安全备份。\n\n## 84.8\
  \ 生成测试 APK 文件\n\n此阶段的一个可选步骤是从应用包生成 APK 文件，并在设备或模拟器会话上安装并运行。谷歌提供了一个名为 `bundletool`\
  \ 的命令行工具，专门为此目的设计，可以通过以下 URL 下载：\n\n[`github.com/google/bundletool/releases`](https://github.com/google/bundletool/releases)\n\
  \n在编写时，`bundletool` 以 `.jar` 形式提供，可以如下所示从命令行执行（注意版本号自本书出版以来可能已经更改）：\n\n```\njava\
  \ -jar bundletool-all-0.9.0.jar\n```\n\n运行上述命令将列出工具中所有可用选项。要从应用包生成 APK 文件，使用 `build-apks`\
  \ 选项。要生成可以安装到设备或模拟器上的 APK 文件，还需要对其进行签名。为了实现这一点，请包含 `--ks` 选项（指定在本章之前创建的密钥库文件路径），以及\
  \ `--ks-key-alias` 选项（指定生成密钥时提供的别名）。\n\n最后，必须使用 `--output` 标志来指定生成 APK 文件的路径（称为\
  \ APK Set）。该文件不能已存在，并且必须具有 `.apks` 文件扩展名。将这些要求结合起来得到如下命令行（允许您的操作系统路径结构存在差异）：\n\n\
  ```\njava -jar bundletool-all-0.9.0.jar build-apks --bundle=/tmp/MyApps/app/release/bundle.aab\
  \ --output=/tmp/MyApks.apks --ks=/MyKeys/release.keystore.jks --ks-key-alias=MyReleaseKey\n\
  ```\n\n执行此命令时，将提示输入生成 APK 文件的路径（即 APK Set）。在生成 APK 文件之前，会弹出一个请求密钥库密码的提示。该 APK 文件包含了从应用包生成的生成的\
  \ APK 文件。\n\n要将相应的 APK 文件安装到连接的设备或模拟器上，使用类似下面的命令：\n\n```\njava -jar bundletool-all-0.9.0.jar\
  \ install-apks=/tmp/MyApks\n```\n\n此命令将识别并安装文件，以便应用程序可以启动。\n\n也可以在不安装的情况下从 APK Set\
  \ 提取 APK 文件。此过程的第一步是获取设备的规格：\n\n```\njava -jar bundletool-all-0.9.0.jar get-device-spec\
  \ --output=/tmp/device.json\n```\n\n上述命令将生成如下的 JSON 文件：\n\n```json\n{\n  \"supportedAbis\"\
  : [\"x86\"],\n  \"supportedLocales\": [\"en-US\"],\n  \"screenDensity\": 420,\n\
  \  \"sdkVersion\": 27\n}\n```\n\n接下来，使用此规格文件提取对应的 APK 文件：\n\n```\njava -jar bundletool-all-0.9.0.jar\
  \ extract-apks --apks=/tmp/MyApks --output-dir=/tmp/nexus --device-spec=/tmp/device.json\n\
  ```\n\n执行后，通过 `--output-dir` 指定目录将包含正确的 APK 文件。\n\n## 84.9 将应用包上到 Google Play Console\n\
  \n将 Android 应用程序推向市场的下一步是将其提交到 Google Play Console 进行测试。\n\n返回 Google Play Console，在导航面板的“测试”部分选择\
  \ `Internal testing`（内部测试）选项（图 84-10 中标记为 A 处），然后点击 `Create new release`（创建新版本）按钮（B）：\n\
  \n![](img/as_4.1_play_create_new_release.jpg)\n图 84-10\n\n在生成的屏幕上，点击 `Continue`（继续）按钮（下方标记为\
  \ A）确认使用 Google Play 应用签名，然后将由 Android Studio 生成的包文件拖入上传投放点（B）：\n\n![](img/as_4.1_play_upload_bundle.jpg)\n\
  图 84-11\n\n上传完成后，向下滚动屏幕并输入版本名称和可选的发布说明。发布版本名称可以是任何帮助您识别该版本的信息，且对用户不可见。\n\n在应用包文件上传后，Google\
  \ Play 将为测试生成所有所需的 APK 文件。一旦 APK 文件生成完毕，滚动到屏幕底部并点击 `Save`（保存）按钮。设置保存后，点击 `Review\
  \ release`（检查版本）按钮。\n\n## 84.10 探索应用包\n\n\n\n在审核界面上，如图 84-12 所示，点击上传应用包右侧的箭头：\n\n\
  ![](img/as_4.1_play_app_bundle_review.jpg)\n图 84-12\n\n在生成的面板中，点击 `Explore`（浏览）应用包链接以加载应用包探路器。这将提供有关该应用包所支持的\
  \ API 级别、屏幕布局和平台的相关摘要信息：\n\n![](img/as_4.1_play_app_bundle_explorer.jpg)\n图 84-13\n\
  \n点击 `Go to device catalog`（前往设备目录）链接将显示 APK 文件支持的设备：\n\n![](img/as_4.1_play_device_catalog.jpg)\n\
  图 84-14\n\n此时，应用已准备好进行测试，但在控制台中设置好某些测试人员之前，无法发布。\n\n## 84.11 管理测试人员\n\n如果应用仍处于内部（Internal）、Alpha\
  \ 或 Beta 测试阶段，可以通过在 Google Play 控制台中选择该应用，点击导航面板中的 `Internal testing`（内部测试），并选择\
  \ `Testers`（测试人员）选项卡（如图 84-15\n图 84-15\n\n要添加测试人员，点击 `Create email list`（创建电子邮件列表）按钮，为列表命名并手动或通过上传\
  \ `CSV` 文件为测试用户指定电子邮件地址。\n\n现在可以从屏幕复制“Join on the web”（在网页加入）URL 并提供给测试人员，以便他们接受测试邀请并下载应用。\n\
  \n### 84.12 发布应用进行测试\n\n现在已经创建了内部版本并添加了测试人员列表，应用已准备好发布进行测试。留在内部测试界面中，选择 `Releases`（发布）选项卡，然后点击最近创建的版本的\
  \ `Edit`（编辑）按钮：\n\n![](img/as_4.1_play_ready_for_rollout.jpg)\n图 84-16\n\n在审核界面上，滚动到页面底部并点击\
  \ `Start rollout to Internal testing`（开始发布到内部测试）按钮。在发布处理片刻后，应用将可以供指定用户下载和测试。\n\n\
  ### 84.13 上传新的应用包版本\n\n为您的应用程序上传的第一个应用包文件版本号始终为 `1`。如果尝试上传另一个具有相同版本号的包文件文件，控制台将通过以下错误拒绝该文件：\n\
  \n`You need to use a different version code for your APK because you already have\
  \ one with version code 1.`\n\n要解决这个问题，需要增加嵌入到包文件文件中的版本号。这在项目的模块级 `build.gradle`\
  \ 文件中完成，如图 84-17 所示，该文件在图中已进行高亮显示：\n\n![](img/Image2561.jpg)\n图 84-17\n\n默认情况下，该文件的内容通常如下：\n\
  \n```gradle\nplugins {\n    id 'com.android.application'\n}\n\nandroid {\n    compileSdkVersion\
  \ 29\n    buildToolsVersion \"30.0.0\"\n    defaultConfig {\n        applicationId\
  \ \"com.example.myapplication\"\n        minSdkVersion 26\n        targetSdkVersion\
  \ 29\n        versionCode 1\n        versionName \"1.0\"\n    }\n}\n```\n\n要更改版本号，只需更改\
  \ `versionCode` 旁边声明的数字。要同时更改显示给应用程序用户的版本号，请更改 `versionName` 字符串。例如：\n\n```gradle\n\
  versionCode 2\nversionName \"2.0\"\n```\n\n完成这些更改后，重新构建 APK 文件并再次执行上传。\n\n### 84.14\
  \ 分析应用包文件\n\nAndroid Studio 分析应用包文件内容的能力。要分析包文件，选择 `Android Studio Build -> Analyze\
  \ APK…`（分析 APK…）菜单选项，并导航到选择要审核的包文件。一旦加载到工具中，将显示有关包的原始大小和下载大小的信息，以及包的文件结构列表，如图 84-18\
  \ 所示：\n\n![](img/android_studio_3.2_bundle_analyzer.jpg)\n图 84-18\n\n选择 `classes.dex`\
  \ 文件将在下方面板中显示该文件的类结构。在此面板中，可以探索各个类的详细信息，一直到类中的方法级别：\n\n![](img/Image2583.jpg)\n\
  图 84-19\n\n同样，在文件列表中选择资源或图像文件将在下方的面板中显示文件内容。可以通过点击 `Compare with previous APK…`（与之前的\
  \ APK 比较…）按钮并选择第二个包文件来查看两个包文件之间的大小差异。\n\n## 84.15 总结\n\n一旦应用项目完成或准备好进行用户测试，就可以将其上传到\
  \ Google Play 控制台并发布生产、内部、Alpha 或 Beta 测试。在上传应用之前，必须在控制台中创建一个应用条目，包括应用信息以及用于 Play\
  \ 商店的截图。随后在 Android Studio 内部生成并使用上传密钥签名的 Android 应用 Bundle 文件。包文件生成后，即可上传。\n\n\
  [/content]\n\n*(注：根据要求，最后部分的翻译如下：)*\n\n[content]\n一旦应用项目完成或准备好进行用户测试，就可以将其上传到 Google\
  \ Play 控制台并发布生产、内部、Alpha 或 Beta 测试。在上传应用之前，必须在控制台中创建一个应用条目，包括应用信息以及用于 Play 商店的截图。随后在\
  \ Android Studio 内部生成并使用上传密钥签名的 Android 应用 Bundle 文件。包文件生成后，即可上传。\n\n包文件的内容可以随时通过加载到分析工具中进行查看。\n\
  \n# 85. 动态功能模块概述\n\n*(注：由于原文最后一段出现了重复的 85 标题和内容，此处已按照逻辑进行了对应翻译：)*\n\n# 85. 动态功能模块概述\n\
  \n如前章所述，应用包和动态交付的引入显著减少了用户在安装应用时需要下载的文件大小。尽管最初是为了为每种可能的设备配置生成单独的软件包，但动态交付的另一个关键优势是将应用拆分为多个按需安装的动态功能模块。\n\
  \n在本章中，我们将开始探索动态功能模块的基本概念，为在下一章中进行详细的操作示例做准备。\n\n## 85.1 动态功能模块概述\n\n动态交付的主要目标是减少从应用商店安装应用的时间和带宽，同时确保应用在安装后占用最小的存储空间。\n\
  \n动态功能模块（也称为按需模块）允许组成 Android 应用的不同功能被封装在单独的模块中，只有在用户需要时才进行下载和安装。应用可能包含新闻和讨论功能。在这种情况下，应用可能默认只安装新闻功能，并将讨论功能分离为动态功能模块。当用户尝试访问讨论功能时，应用将从\
  \ Google Play 下载该功能模块并启动它。如果用户从未访问该功能，则该模块永远不会安装，从而确保只使用了绝对最小的存储。\n\n使用动态功能模块的应用对模块何时以及如何安装具有完全控制权。事实上，应用还可以监控用户访问特定功能的频率，并临时移除任何不常用的功能。\n\
  \n动态功能模块还可以被标记为“即时”模块。这取代了早期 Android 版本的即时应用概念，允许在不安装应用的情况下运行动态功能模块。\n\n\n\n\n从一开始初，Android\
  \ 的设计就考虑了模块化，特别是在 `Intents` 和 `Activities` 概念方面。动态功能将这一哲学推向了逻辑终，允许应用在用户需要时、按需安装用户所需的内容。鉴于这种能力的灵活性和强大，动态特性模块的实现相对简单。\n\
  \n简单来说，动态特性模块是用拆分 APK 文件（split APK files）构建的，这些文件允许多个 APK 文件组合成一个单一应用。\n\n正如我们在“创建、测试和上传\
  \ Android App Bundle”中学习到的那样，动态交付（dynamic delivery）和应用包（app bundles）通过生成一个自定义的 APK\
  \ 文件来工作，该文件仅包含在特定设备配置上运行应用所需的所需的字节码和资源。在这种情况下，应用仍然通过单个 APK 文件进行安装，尽管该文件是针对用户设备定制的。\n\
  \n相比之下，动态特性模块通过将应用拆分为多个称为拆分 APK 文件的 APK 文件来工作。\n\n当应用使用拆分 APK 文件时，在首次下载应用时只会安装基础模块（base\
  \ module）。基础模块通过一个可启动的活动（activity）作为进入应用的入口，并包含了应用基础功能的字节码和资源，以及应用其他部分所需的配置和构建资源。例如，基础模块的清单文件（manifest\
  \ file）包含了与应用绑定的任何动态特性模块清单文件的合并。此外，所有动态特性模块的版本号由基础模块构建配置文件中的版本代码设置决定。\n\n基础模块还包含一个应用包中包含的动态特性模块列表，且所有动态特性模块必须在它们的构建配置中将基础模块列为依赖项。\n\
  \n每个动态特性都以模块的形式存在，包含字节码、清单、资源和构建配置，以及该特定特性的其他资产（如图像或数据文件）。\n\n当用户从应用商店请求安装应用时，商店将为该模块生成基础\
  \ APK 文件，该文件包含了所有设备配置通用的字节码和资源，此外还有一组专门为用户设备配置的配置 APK 文件。同样，对动态特性模块的安装请求除了生成相应的配置\
  \ APK 文件外，还会生成一个动态特性 APK 文件，如下方的图 85-1 所示：\n\n![](img/android_dynamic_feature_diagram.jpg)\n\
  \n图 85-1\n\n## 85.3 创建动态特性模块\n\n可以通过添加全新的新模块或迁移现有模块来向项目添加动态特性。要添加新模块，只需选择 Android\
  \ Studio 的 `File -> New -> New Module...` 菜单选项。在弹出的对话框中，选择 `Dynamic Feature Module`（动态特性模块）或\
  \ `Instant Dynamic Feature Module`（快速动态特性模块）模板，取决于你正在创建的动态特性类型：\n\n![](img/as_4.0_module_type.jpg)\n\
  \n图 85-2\n\n选择合适的动态特性选项后，点击`Next` 按钮并在配置屏幕上命名模块并更改最小 API 设置，使其与基础模块选择的 API 级别匹配（如果这些版本不匹配，项目将无法构建）。\n\
  \n再次点击`Next` 按钮配置 `On-Demand`（按需）选项：\n\n![](img/as_3.5_dynamic_feature_download_options.jpg)\n\
  \n图 85-3\n\n当启用 `Fusing` 选项时，在运行旧版本 Android（Android 4.4 API 20 或更旧版本）的设备上，该模块将与基础\
  \ APK 一起下载，这些版本早于动态交付的引入。`Module Title` 字符串长度可达 50 个字符，Google Play 在消息和通知中向用户描述该特性时将使用。\n\
  \n`Install-time inclusion`（安装时包含）菜单提供了控制模块按需安装条件的选项，而不是包含在用户设备上应用的初始安装中。该菜单提供以下选项：\n\
  \n- `Do not include module at install time (on-demand only)` - 安装时不包含模块（仅按需）：无论设备配置和用户国家如何，在应用请求之前不会安装该模块。\n\
  - `Include module at install time` - 安装时包含模块：禁用所有设备和用户国家的按需动态安装。模块将在应用安装到设备时同时安装。\n\
  - `Only include module at install-time for devices with specified features` - 针对具有指定特性的设备安装时包含模块：对于符合指定标准的设备配置和用户国家，将在安装时包含模块。所有其他国家和设备配置将使用动态按需安装。选择此选项时，将出现额外选项允许输入设备特性。例如，在图\
  \ 85-4\n\n图 85-4\n\n其他标准如国家和 API 级别必须在项目清单（`AndroidManifest.xml`）文件中声明。例如，以下项目将禁用法国用户和运行比\
  \ API 21 旧的 Android 版本的动态按需特性安装：\n\n```xml\n<dist:conditions>\n  <dist:user-countries\
  \ dist:exclude=\"true\">\n    <dist:country dist:code=\"FR\"/>\n  </dist:user-countries>\n\
  \  <dist:min-sdk dist:value=\"21\"/>\n</dist:conditions>\n```\n\n## 85.4 将现有模块动态交付\n\
  \n如果应用包含一个适合动态交付的现有特性，可以通过几个步骤转换为动态特性。例如，考虑以下项目结构：\n\n![](img/andor_dynamic_feature_tree.jpg)\n\
  \n图 85-5\n\n在此项目中，`app` 模块将作为基础模块，而 `secondfeature` 模块是转换为动态特性的理想选择。\n\n要将应用中的现有模块转换为动态特性，首先编辑模块级\
  \ `build.gradle` 文件（上述示例中的 `Gradle Scripts -> build.gradle (Module: secondfeature)`），将其修改为使用\
  \ `com.android.dynamic-feature` 替代 `com.android.application` 插件，并更改依赖项使该模块仅依赖于基础（`app`）模块。例如：\n\
  \n```gradle\napply plugin: 'com.android.application'\napply plugin: 'com.android.dynamic-feature'\n\
  \ndependencies {\n  implementation fileTree(dir: 'libs', include: ['*.jar'])\n \
  \ api 'androidx.appcompat:1.0.2'\n  api 'androidx.constraintlayout:1.1.3'\n  testImplementation\
  \ 'junit:4:12'\n  androidTestImplementation 'androidx.test.ext:junit:1.1.1'\n  androidTestImplementation\
  \ 'androidx.test.espresso:espresso-core:3.2.0'\n  implementation project(':app')\n\
  }\n```\n\n接下来，编辑模块的 `AndroidManifest.xml` 文件并进行如下修改（注意在此示例中，这是一个按需模块，而非快速模块）：\n\n\
  ```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:dist=\"http://schemas.android.com/apk/distribution\"\n    package=\"\
  com.ebookfrenzy.mymodule\">\n  <dist:module\n      dist:instant=\"false\"\n    \
  \  dist:onDemand=\"true\"\n      dist:title=\"@string/title_my_dynamic_feature\"\
  >\n    <dist:fusing dist:include=\"true\" />\n  </dist:module>\n  <application\n\
  \      android:allowBackup=\"true\">\n```\n\n\n\n\n注意 `title` 属性引用了一个字符串资源，该资源也需要在\
  \ `strings.xml` 文件中声明。对于此属性，必须使用字符串资源而不是硬编码字符串。\n\n接下来，需要修改基础模块的 `build.gradle`\
  \ 文件（`build.gradle (Module: app)`）以引用动态功能模块，并将 Play Core Library 作为依赖项：\n\n```gradle\n\
  apply plugin: 'com.android.application'\n\nandroid {\n    compileSdkVersion 29\n\
  \    dynamicFeatures = [\":secondfeature\"]\n}\n\ndependencies {\n    api 'com.google.android.play:core:1.5.0'\n\
  }\n```\n\n最后，编辑基础模块的 `AndroidManifest.xml` 文件，将该模块声明为 `SplitCompatApplication` 的子类：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    package=\"com.ebookfrenzy.mydemoapp\"\
  >\n    <application\n        android:name=\"com.google.android.play.core.splitcompat.SplitCompatApplication\"\
  \n        android:allowBackup=\"true\">\n```\n\n## 85.5 与动态功能模块交互\n\n一旦应用项目添加了一个或多个动态功能模块，就需要编写代码来安装和管理这些模块。这将涉及执行许多任务，例如检查模块是否已经安装、安装模块、跟踪安装进度以及删除不再需要的已安装模块。所有这些任务都是使用\
  \ Play Core Library 提供的 API 完成的，大多数这些 API 调用涉及使用 `SplitInstallManager` 实例，该实例可以通过以下方式创建：\n\
  \n```java\nprivate SplitInstallManager manager;\nmanager = SplitInstallManagerFactory.create(this);\n\
  ```\n\n通常，在允许用户启动动态功能之前，第一步是检查相应的模块是否已经安装。例如，以下代码获取已安装模块的列表，并检查特定模块是否已安装：\n\n```java\n\
  if (manager.getInstalledModules().contains(\"my_dynamic_feature\")) {\n    // 模块已安装\n\
  }\n```\n\n通过构建 `SplitInstallRequest` 对象并将其传递给 `SplitInstallManager` 实例的 `startInstall()`\
  \ 方法，可以安装一个或多个模块：\n\n```java\nprivate int mySessionID = 0;\n\nSplitInstallRequest\
  \ request =\n        SplitInstallRequest\n            .newBuilder()\n          \
  \  .addModule(\"my_dynamic_feature\")\n            .addModule(\"my_dynamic_feature2\"\
  )\n            .build();\nmanager.startInstall(request)\n    .addOnSuccessListener(new\
  \ OnSuccessListener<Integer>() {\n        @Override\n        public void onSuccess(Integer\
  \ sessionId) {\n            mySessionID = sessionId;\n        }\n    })\n    .addOnFailureListener(new\
  \ OnFailureListener() {\n        @Override\n        public void onFailure(Exception\
  \ exception) {\n        }\n    });\n```\n\n执行上述代码时，模块安装将立即开始。或者，也可以通过向 `deferredInstall()`\
  \ 方法传递功能模块名称的数组来执行延迟安装，如下所示：\n\n```java\nmanager.deferredInstall(Arrays.asList(\"\
  my_dynamic_feature\", \"my_dynamic_feature2\"));\n```\n\n延迟下载由操作系统根据情况在后台执行。虽然无法跟踪延迟安装的状态，但可以通过向计时器添加监听器来跟踪非延迟的安装：\n\
  \n```java\nSplitStateUpdatedListener listener = new SplitStateUpdatedListener()\
  \ {\n    @Override\n    public void onUpdate(SplitSessionState state) {\n      \
  \  if (state.sessionId() == mySessionID) {\n            switch (state.status())\
  \ {\n                case SplitInstallStatus.REQUIRES_USER_CONFIRMATION: // 大型模块需要用户权限\n\
  \                    break;\n                case SplitInstallStatus.DOWNLOADING:\
  \ // 模块正在下载\n                    break;\n                case SplitInstallStatus.INSTALLING:\
  \ // 正在安装下载的模块\n                    break;\n                case SplitInstallStatus.DOWNLOADED:\
  \ // 模块下载完成\n                    break;\n                case SplitInstallStatus.INSTALLED:\
  \ // 模块已成功安装\n                    break;\n                case SplitInstallStatus.CANCELED:\
  \ // 用户取消了下载\n                    break;\n                case SplitInstallStatus.PENDING:\
  \ // 安装延迟\n                    break;\n                case SplitInstallStatus.FAILED:\
  \ // 安装失败\n                    break;\n            }\n        }\n    }\n};\n```\n\
  \n一旦实现了监听器，就需要将其与 `SplitInstallManager` 实例中注册，并在不再需要时将其注销。\n\n```java\nmanager.registerListener(listener);\n\
  manager.unregisterListener(listener);\n```\n\n## 85.6 处理大型动态功能模块\n\nAndroid 动态交付系统在未向用户请求权限的情况下，不允许下载大于\
  \ 10MB 的动态功能模块。当请求下载大型功能模块时，监听器会被调用并传递一个 `REQUIRES_USER_CONFIRMATION` 状态。此时，应用的责任显示确认对话框，并可选地实现\
  \ `onActivityResult()` 处理方法以识别用户是批准了还是拒绝了下载。\n\n```java\nprivate static final int\
  \ REQUEST_CODE = 101;\n\nSplitInstallStateUpdatedListener listener = new SplitInstallStateUpdatedListener()\
  \ {\n    @Override\n    public void onUpdate(SplitSessionState state) {\n      \
  \  if (state.sessionId() == mySessionID) {\n            switch (state.status())\
  \ {\n                case SplitInstallStatus.REQUIRES_USER_CONFIRMATION:\n     \
  \               try {\n                        manager.startConfirmationDialog(state,\
  \ MainActivity.this, REQUEST_CODE);\n                    } catch (IntentSender.SendIntentException\
  \ ex) {\n                        // 请求失败\n                    }\n              \
  \      break;\n                // 其他情况\n            }\n        }\n    }\n};\n```\n\
  \n上述代码启动了一个 Intent，该 Intent 随后显示内置的确认对话框。该 Intent 将结果结果返回到 `onActivityResult()`\
  \ 方法，该方法可以如下实现：\n\n```java\n@Override\npublic void onActivityResult(int requestCode,\
  \ int resultCode, Intent data) {\n    if (requestCode == REQUEST_CODE) {\n     \
  \   if (resultCode == RESULT_OK) {\n            // 用户批准安装\n        } else {\n  \
  \          // 用户拒绝安装\n        }\n    }\n}\n```\n\n如果用户批准了请求，动态功能模块将自动下载并安装。\n\n\
  ## 85.7 总结\n\n动态功能模块允许将 Android 应用拆分为单独的功能，这些功能在用户需要时按需下载。动态功能模块还可以被配置为即时功能（instant\
  \ features）。即时功能可以在不向设备上安装应用的情况下运行，用户可以通过应用商店页面上的“立即试用”（Try Now）按钮或通过 Web URL 访问它们。\n\
  \n## 86. 一个 Android Studio 动态功能教程\n\n\n\n\n\n在前章中涵盖了 Android 动态交付（Dynamic Delivery）和动态特性（Dynamic\
  \ Features）的基础概念，本章将通过示例项目的形式将这些理论付诸实践。本章创建的应用将包含两个 Activity，其中第一个作为 App 的基础模块（base\
  \ module），第二个被指定为动态特性，可以在运行中的 App 内部按需下载。本教程将包括在 Android Studio 内部创建动态模块的步骤、将 App\
  \ Bundle 上传到 Google Play Store 进行测试，以及使用 Play Core 库下载和管理动态特性。本章还将探索延迟动态特性安装的使用。\n\
  \n## 86.1 创建 DynamicFeature 项目\n\n从欢迎界面选择`Create New Project`（创建新项目）快速启动选项，在弹出的新项目对话框中，点击`Next`下一步）按钮之前选择`Empty\
  \ Activity`（空活动）模板。\n\n在`Name`名称）字段中输入 `DynamicFeature`，指定一个在 Google Play 生态系统中唯一标识您的\
  \ App 的包名（例如 `com.<your company>.dynamicfeature`）。在点击`Finish`完成）按钮之前，将`Minimum API\
  \ level`（最低 API 级别）设置改为 `API 26: Android 8.0 (Oreo)`，并将`Language`（语言）菜单改为 `Java`。\n\
  \n## 86.2 为项目添加动态特性支持\n\n在开始实现应用之前，需要对项目进行两个更改以添加动态特性的支持。由于项目将大量使用 Play Core 库，需要向构建配置添加一条指令以包含此库。在\
  \ Android Studio 中，打开 App 级别的 `build.gradle` 文件（`Gradle Scripts -> build.gradle\
  \ (Module: DynamicFeature.app)`），找到`dependencies`部分并如下所示添加 Play Core 库（请像既往一样记住，现在可能有该库的新版本）：\n\
  \n```\ndependencies {\n    implementation 'com.google.android.play:core:1.8.0'\n\
  }\n```\n\n一旦下载了动态特性模块，用户很可能需要立即访问组成该特性的代码和资源资产。然而，默认情况下，新安装的特性模块在 App 重启之前对 App\
  \ 的其他部分不可用。幸运的是，通过在项目中启用`SplitCompat`库可以避免这一缺陷。目前实现此点的简单方法是在主`AndroidManifest.xml`\
  \ 文件（也称为基础模块清单）中将应用程序声明为`SplitCompatApplication`的子类，如下：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.dynamicfeature\">\n<application\n      android:name=\"\
  com.google.android.play.core.splitcompat.SplitCompatApplication\"\n      android:allowBackup=\"\
  true\"\n      android:icon=\"@mipmap/ic_launcher\"\n      android:label=\"@string/app_name\"\
  \n      android:roundIcon=\"@mipmap/ic_launcher_round\">\n```\n\n## 86.3 设计基础 Activity\
  \ 用户界面\n\n此时，项目包含一个 Activity，它将作为 App 基础模块的入口点。该基础模块将负责请求、安装和管理动态特性模块。\n\n为了演示动态特性的使用，基础\
  \ Activity 将由一系列按钮组成，允许动态特性模块的安装、启动和删除。界面还将包含一个`TextView`对象，用于显示与动态特性模块相关的状态信息。考虑到这些要求，将`activity_main.xml`布局文件加载到布局编辑器中，删除默认的`TextView`对象，并实现设计，使其类似于下方的[图\
  \ 86-1]。\n\n![](img/as_4.1_dynamic_feature_ui.jpg)\n图 86-1\n\n一旦定位了对象，选择`TextView`组件并使用`Attributes`（属性）工具窗口将`id`属性设置为`status_text`。开始应用布局约束，选择布局中的所有对象，右键点击`TextView`对象并从菜单中选择`Center\
  \ -> Horizontally in Parent`（在父水平居中）选项，从而将所有四个对象限制在屏幕的水平中心。\n\n在所有对象仍选中的情况下，再次右键点击`TextView`，这次选择`Chains\
  \ -> Create Vertical Chain`（创建垂直链）菜单选项。在继续之前，将所有按钮文本字符串提取到资源，并配置三个按钮分别调用名为`launchFeature`、`installFeature`和`deleteFeature`的方法。\n\
  \n## 86.4 添加动态特性模块\n\n要向项目添加动态特性模块，选择`File -> New -> New Module...`（文件 -> 新 -> 新模块...）菜单选项，并在弹出的对话框中，如[图\
  \ 86-2]所示选择`Dynamic Feature Module`（动态特性模块）选项：\n\n![](img/as_4.0_module_type1.jpg)\n\
  图 86-2\n\n选中`Dynamic Feature Module`选项后，点击`Next`按钮，并在配置屏幕上，将模块命名为`my_dynamic_feature`并将最小\
  \ API 设置改为`API 26: Android 8.0 (Oreo)`，以便与基础模块选择的 API 级别匹配：\n\n![](img/as_4.1_dynamic_feature.jpg)\n\
  图 86-3\n\n再次点击`Next`按钮配置`On-Demand`（按需）选项，确保启用了`Fusing`（融合）选项。在`Module Title`（模块标题）字段中输入`My\
  \ Dynamic Feature`：\n\n![](img/as_4.1_dynamic_feature_options.jpg)\n图 86-4\n\n在点击`Finish`按钮之前，将`Install-time`（安装时）设置为`Do\
  \ not include module (on-demand only)`（不包含模块（仅按需））以提交更改并将动态特性添加到项目中。\n\n## 86.5\
  \ 审查动态特性模块\n\n在进行下一步之前，值得花时间审查 Android Studio 对项目所做的更改。理解这些更改对于解决问题以及将现有应用特性转换为特性都是非常有用的。\n\
  \n首先参考`Project`窗口，那里将出现一个包含动态特性的文件夹条目：\n\n![](img/as_3.5_dynamic_feature_window.jpg)\n\
  图 86-5\n\n注意特性具有了自己的子结构，包括一个清单文件、可以添加代码的包和一个`res`文件夹。打开并审查`AndroidManifest.xml`文件，它应该包含创建特性期间选择的属性设置，包括按需、融合和特性标题值：\n\
  \n```xml\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:dist=\"http://schemas.android.com/distribution\"\n    package=\"com.ebookfrenzy.my_dynamic_feature\"\
  >\n    <dist:module\n        dist:instant=\"false\"\n        dist:title=\"@string/title_dynamic_feature\"\
  >\n        <dist:delivery>\n            <dist:on-demand />\n        </dist:delivery>\n\
  \        <dist:fusing include=\"true\" />\n    </dist:module>\n</manifest>\n```\n\
  \n一个特别值得关注的点是，模块标题字符串存储在字符串资源中，而不是直接输入清单文件中。这是标题字符串的前提条件，可以在基础模块的`strings.xml`文件（`app\
  \ -> res -> values -> strings.xml`）中找到并在需要时修改该资源。\n\n动态特性模块的构建配置可以在`Gradle Scripts\
  \ -> build.gradle (Module: DynamicFeature.my_dynamic_feature)`文件中找到，并应如下：\n\n```gradle\n\
  plugins {\n    id 'com.android.dynamic-feature'\n}\n\nandroid {\n    compileSdkVersion\
  \ 29\n    buildToolsVersion \"30.0.0\"\n}\n\ndependencies {\n    implementation\
  \ project(\":app\")\n}\n```\n\n\n\n\n此文件中的关键条目是 `com.android.dynamic-feature` 插件的应用，它确保该模块被视为动态功能（dynamic\
  \ feature），以及指示该功能依赖于基础（app）模块的实现行。\n\n基础模块的 `build.gradle` 文件（`Gradle Scripts`\
  \ -> `build.gradle` (Module: `DynamicFeature.app`））也包含一个列出动态功能模块的新条目：\n\n```gradle\n\
  plugins {\n    id 'com.android.application'\n}\n\nandroid {\n    compileSdkVersion\
  \ 29\n    buildToolsVersion \"30.0.0\"\n    dynamicFeatures = [':my_dynamic_feature']\n\
  }\n```\n\n向项目中添加的任何额外 `dynamic-features` 都需要在此处引用，例如：\n\n`dynamicFeatures = [\"\
  :my_dynamic_feature\", \":my_second_feature\", ...]`\n\n## 86.6 添加动态功能 Activity\n\
  \n从上方图 86-5 所示的项目窗口中，可以明显看出，动态功能模块目前几乎只包含一个清单文件。下一步是向模块添加一个 activity，以便该功能从基础模块内部启动时能够执行实际操作。在项目窗口中，右键点击位于\
  \ `my_dynamic_feature` -> `java` 下的包名，选择 `New` -> `Activity` -> `Empty Activity`\
  \ 菜单选项。将活动命名为 `MyFeatureActivity`，启用 `Generate Layout File` ，但在点击 `Finish` 按钮之前禁用\
  \ `Launcher Activity` 选项。\n\n![](img/as_3.4_dynamic_feature_add_activity.jpg)\n\n\
  图 86-6\n\n一旦将 activity 添加到模块，请编辑 `AndroidManifest.xml` 文件并进行修改，添加意图过滤器（intent filter），该过滤器允许基础模块启动此\
  \ activity（将 `<com.yourcompany>` 替换为您选择的包名，以确保您的应用在 Google Play 上是唯一的）：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:dist=\"http://schemas.android.com/apk/distribution\"\n    package=\"\
  com.ebookfrenzy.my_dynamic_feature\">\n    <dist:module\n        dist:instant=\"\
  false\"\n        dist:title=\"@string/title_my_dynamic_feature\">\n        <dist:delivery>\n\
  \            <dist:on-demand />\n        </dist:delivery>\n        <dist:fusing\
  \ dist:include=\"true\" />\n    </dist:module>\n    <application>\n        <activity\
  \ android:name=\".MyFeatureActivity\">\n            <intent-filter>\n          \
  \      <action android:name=\"android.intent.action.VIEW\" />\n                <action\
  \ android:name=\"com.yourcompany>.my_dynamic_feature.MyFeatureActivity\" />\n  \
  \              <category android:name=\"android.intent.category.DEFAULT\" />\n \
  \           </intent-filter>\n        </activity>\n    </application>\n</manifest>\n\
  ```\n\n接下来，编辑 `build.gradle` (Module: `DynamicFeature.my_dynamic_feature`) 文件的 `dependencies`\
  \ 部分以包含 Google Play 库：\n\n```gradle\ndependencies {\n    implementation 'com.google.android.play:core:1.8.0'\n\
  }\n```\n\n为了能够从动态模块内部访问资源，需要在 `MyFeatureActivity` 内部调用 `SplitCompat.install()` 方法。编辑\
  \ `MyFeatureActivity.java` 文件并如下修改 `onCreate()` 方法：\n\n```java\nimport com.google.android.play.core.splitcompat.SplitCompat;\n\
  \n@Override\nprotected void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    SplitCompat.install(this);\n    setContentView(R.layout.activity_feature);\n\
  }\n```\n\n未执行此步骤通常会导致应用崩溃，并出现类似类似的错误：\n\n`Android: java.lang.RuntimeException: Unable\
  \ to start activity{com.ebookfrenzy.my_dynamic_feature/MyFeatureActivity}: android.content.Resources$NotFound:\
  \ Resource ID 0x7f020000`\n\n图 86-7 (image/activity_feature_ui.jpg)\n\n## 86.7 实现\
  \ launch() 方法\n\n当项目结构和用户界面完成后，是时候使用 Play Core 开始处理动态功能了。第一步是实现 `launch()` 方法，其目的是使用一个意图（intent）启动动态功能活动。然而，尝试在尚未安装的动态功能中启动活动将导致应用崩溃。因此，`launch()`\
  \ 方法需要包含一些防御性代码以确保动态功能已安装。为了实现这一点，请创建一个 `SplitInstallManager` 实例。在 `MainActivity.java`\
  \ 中对类进行以下更改：\n\n```java\nimport android.widget.TextView;\nimport android.view.View;\n\
  import android.content.Intent;\nimport android.os.Bundle;\nimport androidx.appcompat.app.AppCompatActivity;\n\
  import com.google.android.play.core.splitinstall.SplitInstallManager;\nimport com.google.android.play.core.splitinstall.SplitInstallFactory;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    private TextView statusText;\n\
  \    private SplitInstallManager manager;\n\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \        statusText = findViewById(R.id.status_text);\n        manager = SplitInstallFactory.create(this);\n\
  \    }\n\n    public void launchFeature(View view) {\n        if (manager.getInstalledModules().contains(\"\
  my_feature\")) {\n            Intent i = new Intent(this, \"com.ebookfrenzy.my_dynamic_feature.MyFeatureActivity\"\
  );\n            startActivity(i);\n        } else {\n            statusText.setText(\"\
  Feature not installed\");\n        }\n    }\n}\n```\n\n## 86.8 上传 App Bundle 进行测试\n\
  \n现在已准备好进行第一阶段测试。这涉及生成一个应用 bundle 并将其上传到 Google Play Console。实现这些点的步骤在创建、测试和上传 Android\
  \ App Bundle 章节中有所概述，但总结如下：\n\n1. 登录 Google Play Console 并创建一个应用程序。\n2. 按照步骤配置应用的标题、描述、分类和图像资源（示例图像可以在示例代码的\
  \ `image_assets` 文件夹中找到），并保存草稿设置。还要为 bundle 启用 Google Play 应用签名。\n3. 使用 Android\
  \ Studio `Build` -> `Generate Signed App Bundle / APK...` 菜单生成签名的发布版 bundle。\n4.\
  \ 在 Google Play Console 中，从左侧导航面板选择 `Testing` -> `Internal testing` 选项。\n5. 在内部测试屏幕上，点击\
  \ `Create Release` 按钮，并点击接受让 Google 管理密钥签名任务。将上方生成的 app bundle 文件拖放到上传框中并点击 Save。\n\
  6. 切换到内部测试屏幕内的 `Testers` 标签页，添加用于在一个或多个物理设备上测试应用的账户邮箱地址。\n7. 返回 `Releases` 标签页并点击\
  \ `Edit` 按钮。滚动到生成页面的底部，点击 `Review release` 按钮。\n8. 在确认屏幕上，点击 `Start rollout to Internal\
  \ testing` 按钮。该应用将列为待发布（Pending publication）。\n\n\n\n\n\n一旦发布并开始测试，系统将向所有内部测试轨道上的用户发送通知，要求他们加入该应用程序的测试轨道。或者，复制“测试人员”屏幕上列出的\
  \ URL 并发送给测试用户。一旦用户加入，将提供一个链接，在设备上打开该链接时，将启动 Play Store 应用并打开 `DynamicFeature` 应用程序的下载页面，如图\
  \ 86-8 所示：\n\n![](img/as_3.6_install_dynamic_feature_app.jpg)\n\n图 86-8\n\n点击按钮安装应用程序，然后打开它并点击“启动功能（Launch\
  \ Feature）”按钮。动态功能尚未安装的状态应当反映在状态文本中。\n\n## 86.9 实现 `installFeature()` 方法\n\n`installFeature()`\
  \ 方法将为 `my_dynamic_feature` 创建一个 `SplitInstallRequest` 对象，然后使用 `SplitInstallManager`\
  \ 实例启动安装过程。还将实现监听器以显示 `Toast` 消息，指示安装请求的状态。在 `MainActivity.java` 文件中，按照如下方式添加 `installFeature()`\
  \ 方法：\n\n```java\nimport android.widget.Toast;\nimport com.google.android.play.core.splitinstall.SplitInstallRequest;\n\
  import com.google.android.play.core.tasks.OnFailureListener;\nimport com.google.android.play.core.tasks.OnSuccessListener;\n\
  \npublic void installFeature(View view) {\n    SplitInstallRequest request =\n \
  \           SplitInstallRequest\n                    .newBuilder()\n           \
  \         .addModule(\"my_dynamic_feature\")\n                    .build();\n  \
  \  manager.startInstall(request)\n            .addOnSuccessListener(new OnSuccessListener<Integer>()\
  \ {\n                @Override\n                public void onSuccess(Integer sessionId)\
  \ {\n                    Toast.makeText(MainActivity.this,\n                   \
  \         \"Module installation started\",\n                            Toast.LENGTH_SHORT).show();\n\
  \                }\n            })\n            .addOnFailureListener(new OnFailureListener()\
  \ {\n                @Override\n                public void onFailure(Exception\
  \ exception) {\n                    Toast.makeText(MainActivity.this,\n        \
  \                \"Module installation failed\" + exception.toString(),\n      \
  \                  Toast.LENGTH_SHORT).show();\n                }\n            });\n\
  }\n```\n\n编辑 `Gradle Scripts -> build.gradle (Module: DynamicFeature.app)` 文件并增加\
  \ `versionCode` 和 `versionName` 值，以便可以将新版本的应用程序上传以进行测试：\n\n```gradle\nandroid {\n\
  \    versionCode 2\n    versionName \"2.0\"\n}\n```\n\n重复此步骤，在 `Gradle Scripts ->\
  \ build.gradle (Module: DynamicFeature.my_dynamic_feature)` 中声明一个匹配的版本号。生成新的应用 bundle，然后返回\
  \ Google Play Console 中该应用程序的 `Testing -> Internal testing` 页面，此时“创建新发布（Create new\
  \ release）”按钮如图 86-9 所示：\n\n![](img/as_4.1_dynamic_feature_new_release.jpg)\n\n\
  图 86-9\n\n按照步骤上传新的应用 bundle 并将其推出内部测试。在测试设备上，打开 Google Store 应用并确保“安装（Install）”按钮已变为“更新（Update）”按钮（如果没有，请关闭应用并在等待几分钟后重试）。更新完成后，运行应用程序，点击“安装功能（Install\
  \ Feature）”并检查 `Toast` 消息以确保安装已开始。在下载功能时，屏幕顶部的状态栏将短暂出现下载图标。下载完成后，点击“启动功能（Launch\
  \ Feature）”显示第二个活动。\n\n如果安装失败或应用程序崩溃，通常可以从 LogCat 输出确定原因。要查看此输出，将设备连接到开发计算机，打开终端或命令提示符并执行以下命令：\n\
  \n```bash\nadb logcat\n```\n此 `adb` 命令将实时显示 LogCat 输出，包括应用程序遇到问题或崩溃时生成的任何异常或诊断错误。\n\
  \n## 86.10 添加更新监听器\n\n为了更详细地跟踪动态功能模块的安装进度，可以为应用程序添加 `SplitInstallUpdatedListener`\
  \ 实例。由于可能同时安装多个功能，需要添加代码来跟踪分配给安装过程的会话 ID。首先添加一些导入，在 `MainActivity.java` 文件声明一个变量来包含当前会话\
  \ ID，并修改 `installFeature()` 方法在每次启动安装时存储会话 ID 并注册监听器：\n\n```java\nimport com.google.android.play.core.splitinstall.SplitInstallState;\n\
  import com.google.android.play.core.splitinstall.SplitInstallUpdatedListener;\n\
  import com.google.android.play.core.splitinstall.model.SplitInstallStatus;\nimport\
  \ java.util.Locale;\n\npublic class MainActivity extends AppCompatActivity {\n \
  \   private TextView statusText;\n    private SplitInstallManager manager;\n   \
  \ private int mySessionId = 0;\n\n    public void installFeature(View view) {\n\
  \        manager.registerListener(listener);\n        manager.startInstall(request)\n\
  \                .addOnSuccessListener(new OnSuccessListener<Integer>() {\n    \
  \                @Override\n                    public void onSuccess(Integer sessionId)\
  \ {\n                        mySessionId = sessionId;\n                        Toast.makeText(MainActivity.this,\n\
  \                                \"Module installation started\",\n            \
  \                    Toast.LENGTH_SHORT).show();\n                    }\n      \
  \          });\n```\n\n接下来，按照如下方式实现监听器代码：\n\n```java\nSplitInstallUpdatedListener\
  \ listener = new SplitInstallUpdatedListener() {\n    @Override\n    public void\
  \ onUpdate(SplitInstallState state) {\n        if (state.sessionId() == mySessionId)\
  \ {\n            switch (state.status()) {\n                case SplitInstallStatus.LOADING:\n\
  \                    long size = state.totalBytesToDownload();\n               \
  \     long downloaded = state.bytesDownloaded();\n                    statusText.setText(String.format(Locale.getDefault(),\n\
  \                            \"%d of %d downloaded.\", downloaded, size));\n   \
  \                 break;\n                case SplitInstallStatus.INSTALLING:\n\
  \                    statusText.setText(\"Installing feature\");\n             \
  \       break;\n                case SplitInstallStatus.DOWNLOADED:\n          \
  \          statusText.setText(\"Download Complete\");\n                    break;\n\
  \                case SplitInstallStatus.INSTALLED:\n                    statusText.setText(\"\
  Installed - Feature is ready\");\n                    break;\n                case\
  \ SplitInstallStatus.CANCELED:\n                    statusText.setText(\"Installation\
  \ cancelled\");\n                    break;\n                case SplitInstallStatus.PENDING:\n\
  \                    statusText.setText(\"Installation pending\");\n           \
  \         break;\n                case SplitInstallStatus.FAILED:\n            \
  \        statusText.setText(\"Installation Failed. Error code: \" +\n          \
  \                  state.errorCode());\n                    break;\n           \
  \ }\n        }\n    }\n};\n```\n\n\n\n\n\n监听器会捕获许多常见的安装状态并相应地更新状态文本，包括提供下载大小信息以及目前已下载字节数的累计总量。在继续之前，请添加\
  \ `onPause()` 和 `onResume()` 生命周期方法，以确保在 App 未处于活动状态时注销监听器：\n\n```java\n@Override\n\
  public void onResume() {\n    manager.registerListener(listener);\n    super.onResume();\n\
  }\n\n@Override\npublic void onPause() {\n    manager.unregisterListener(listener);\n\
  \    super.onPause();\n}\n```\n\n通过增加两个模块级 `build.gradle` 文件中的版本号信息、生成并上传新的发布版应用包，然后发布测试，来验证监听器代码运行正常。如果设备上已经安装了动态功能模块，`Play\
  \ Core Library` 类将忽略再次下载该模块的尝试。因此，为了充分测试监听器，必须在 Play Store 应用中先卸载 App，然后再安装更新后的发布版本。当然，由于删除了\
  \ App，将没有“更新”按钮来我们新版本已准备就绪。若要查看 Play Store 应用将安装哪个版本，请向下滚动应用页面直到点击 `Read More` 按钮，选择它并检查下方图\
  \ 86-10 所示的 `App Info` 部分中的 `Version` 字段：\n\n![](img/as_3.4_dynamic_feature_app_store_details.jpg)\n\
  \n图 86-10\n\n如果仍列出之前的版本，请退出 Play 应用等待几分钟后再检查。一旦列出新版本，完成安装，打开 App 并检查在下载动态功能模块时状态文本是否相应更新。\n\
  \n### 86.11 处理大文件下载\n\n此项目的下一个任务是通过在监听器实现中的 `switch` 语句中添加额外的分支，集成对大功能模块的支持，如下：\n\
  \n```\n.\n.\nimport android.content.IntentSender;\n.\n.\npublic class MainActivity\
  \ extends AppCompatActivity {\n.\n.\n    private static final int REQUEST_CODE =\
  \ 101;\n.\n.\nSplitInstallStateUpdatedListener listener =\n                new SplitInstallStateUpdatedListener()\
  \ {\n    @Override\n    public void onStateUpdate(SplitInstallSessionState state)\
  \ {\n        if (state.sessionId() == mySessionId) {\n            switch (state.status())\
  \ {\n                case SplitInstallSessionStatus.REQUIRES_USER_CONFIRMATION:\n\
  \                    statusText.setText(\n                        \"Large Feature\
  \ Module. Requesting Confirmation\");\n                    try {\n             \
  \           manager.startConfirmationDialogForResult(state,\n                  \
  \      MainActivity.this, REQUEST_CODE);\n                    } catch (IntentSender.SendIntentException\
  \ ex) {\n                        statusText.setText(\"Confirmation Request Failed.\"\
  );\n                    }\n                    break;\n.\n.\n```\n\n此外，添加 `onActivityResult()`\
  \ 方法，以便 App 接收用户决策的通知：\n\n```java\n@Override\npublic void onActivityResult(int requestCode,\
  \ int resultCode, Intent data) {\n    if (requestCode == REQUEST_CODE) {\n     \
  \   if (resultCode == RESULT_OK) {\n            statusText.setText(\"Beginning Installation.\"\
  );\n        } else {\n            statusText.setText(\"User declined.\");\n    \
  \    }\n    }\n}\n```\n\n\n\n\n\n构建项目的配置规则声明在基于 Groovy 编程语言的 Gradle 构建文件和脚本中。\n\n\
  ## 87.2 Gradle 与 Android Studio\n\n`Gradle` 为构建 Android 应用项目引入了许多强大的功能。其中一些关键特性如下：\n\
  \n### 87.2.1 合理默认值\n\n`Gradle` 实现了一种被称为“约定优于配置”（convention over configuration）的概念。这简单意味着\
  \ `Gradle` 拥有一组预定义的合理默认配置设置，除非被构建文件中的设置覆盖，否则将使用这些设置。这意味着开发者只需最少的配置即可完成构建。只有当默认配置无法满足你的构建需求时，才需要修改构建文件。\n\
  \n### 87.2.2 依赖\n\nGradle 功能的另一个关键领域是依赖项。例如，考虑 Android Studio 项目中的一个模块，它触发意图（intent）来加载项目中的另一个模块。第一个模块实际上对第二个模块有依赖，因为如果在运行时无法找到并启动第二个模块，应用程序将无法构建。这种依赖可以在第一个模块的\
  \ `Gradle` 构建文件中声明，以便将第二个模块包含在应用构建中，或者在无法找到或构建第二个模块时标记错误。依赖项的其他示例是项目为了编译和运行而依赖的库和\
  \ `JAR` 文件。\n\n`Gradle` 依赖可以分为本地或远程。本地依赖引用存在执行构建的计算机系统本地文件系统上的项。远程依赖引用存在远程服务器（通常称为仓库，repository）上的项。\n\
  \nAndroid Studio 项目的远程依赖使用另一个名为 `Maven` 的项目管理工具处理。如果在 `Gradle` 构建文件中使用 `Maven` 语法声明了远程依赖项，则该依赖项将从指定的仓库自动下载并包含在构建过程中。例如，下面的依赖项声明会导致\
  \ `AppCompat` 库从 Google 仓库添加到项目中：\n\n```\nimplementation 'androidx.appcompat:appcompat:1.2.0'\n\
  ```\n\n### 87.2.3 构建变体\n\n除了依赖项之外，`Gradle` 还为 Android Studio 项目提供了构建变体（build variant）支持。这允许从单个项目构建应用程序的多个变。Android\
  \ 运行在许多不同的设备上，涵盖了各种处理器类型和屏幕尺寸。为了尽可能针对广泛设备类型和尺寸，通常需要构建应用程序的多个不同变体（例如，一个带有手机用户界面，另一个用于平板电脑大小的屏幕）。通过使用\
  \ `Gradle`，这在 Android Studio 中是可行的。\n\n### 87.2.4 Manifest 条目\n\n每个 Android Studio\
  \ 项目都关联着一个 `AndroidManifest.xml` 文件，其中包含有关应用程序的配置细节。在 `Gradle` 构建文件中可以指定多个清单项，这些条目在项目构建时会自动生成到清单文件中。这种功能与构建变体功能互补，允许为每个构建变体对应用版本号、应用\
  \ ID 和 SDK 版本信息等元素进行不同的配置。\n\n### 87.2.5 APK 签名\n\n标题为[创建、测试和上传 Android App Bundle]的章节涵盖了如何使用\
  \ Android Studio 环境创建签名的发布版 `APK` 文件。也可以将通过 Android Studio 用户界面输入的签名信息包含在 `Gradle`\
  \ 构建文件中，以便从命令行生成签名的 `APK` 文件。\n\n### 87.2.6 ProGuard 支持\n\n`ProGuard` 是 Android\
  \ Studio 自带的一个工具，它可以优化、收缩和混淆 Java 字节码，使其更高效且更难被反向工程（即他人通过分析编译后的 Java 字节码来识别应用程序逻辑的方法）。`Gradle`\
  \ 构建文件提供了在构建应用程序时控制是否运行 `ProGuard` 的能力。\n\n# 87.3 顶层 Gradle 构建文件\n\n完整的 Android\
  \ Studio 项目包含了构建 Android 应用程序所需的一切，由模块、库、清单文件和 `Gradle` 构建文件组成。\n\n每个项目包含一个顶层 `Gradle`\
  \ 构建文件。该文件列为 `build.gradle` (Project: `<project name>`)，可以在项目工具窗口中找到，如图 87-1 高亮所示：\n\
  \n![](img/as_4.1_project_gradle_file.jpg)\n\n图 87-1\n\n默认情况下，顶层 `Gradle` 构建文件的内容如下：\n\
  \n```gradle\n// 顶层构建文件，可以在此处添加适用于所有子项目/模块的配置选项。\n\nbuildscript {\n    repositories\
  \ {\n        google()\n        jcenter()\n    }\n    dependencies {\n        classpath\
  \ \"com.android.tools.build:gradle:4.1.0-rc03\"\n        // 注意：不要将你的应用程序依赖放在这里；它们属于\n\
  \        // 单个模块的 build.gradle 文件\n    }\n}\n\nallprojects {\n    repositories {\n\
  \        google()\n        jcenter()\n    }\n}\n\ntask clean(type: Delete) {\n \
  \   delete rootProject.buildDir\n}\n```\n\n目前，该文件声明了使用 `jcenter` 仓库获取远程库，并且构建依赖于\
  \ Android 插件。\n\n# 87.4 模块级构建文件\n\nAndroid Studio 项目由一个或多个模块组成。例如，一个名为 `Demo` 的假设项目，它包含两个模块\
  \ `Module1` 和 `Module2`。在这种情况下，每个模块都需要它们自己的构建文件。在项目结构中，这些文件位于如下位置：\n\n- `Module1/build.gradle`\n\
  - `Module2/build.gradle`\n\n默认情况下，`Module1/build.gradle` 文件类似于所示：\n\n```gradle\n\
  plugins {\n    id 'com.android.application'\n}\n\nandroid {\n    compileSdkVersion\
  \ 29\n    buildToolsVersion \"30.0.0\"\n    defaultConfig {\n        applicationId\
  \ \"com.frenzy.demoapp\"\n        minSdkVersion 26\n        targetSdkVersion 29\n\
  \        versionCode 1\n        versionName \"1.0\"\n        testInstrumentationRunner\
  \ \"androidx.test.runner.AndroidJUnitRunner\"\n    }\n\n    buildTypes {\n     \
  \   release {\n            minifyEnabled false\n            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),\
  \ 'proguard-rules.pro'\n        }\n    }\n\n    compileOptions {\n        sourceCompatibility\
  \ JavaVersion.VERSION_1_8\n        targetCompatibility JavaVersion.VERSION_1_8\n\
  \    }\n}\n\ndependencies {\n    implementation 'androidx.appcompat:appcompat:1.2.0'\n\
  \    implementation 'com.google.android.material:material:1.2.1'\n    implementation\
  \ 'androidx.constraintlayout:constraintlayout:2.0.1'\n    testImplementation 'junit:junit:4.+'\n\
  \    androidTestImplementation 'androidx.test.ext:junit:1.1.2'\n    androidTestImplementation\
  \ 'androidx.test.espresso:espresso-core:3.3.0'\n}\n```\n\n\n\n\n```gradle\ndefaultConfig\
  \ {\n    applicationId \"com.ebookfrenzy.demoapp\"\n    minSdkVersion 26\n    targetSdkVersion\
  \ 29\n    versionCode 1\n    versionName \"1.0\"\n    testInstrumentationRunner\
  \ \"androidx.test.runner.AndroidJUnitRunner\"\n}\n```\n\n`buildTypes` 部分包含了关于在构建应用程序发布版本时，是否以及如何对\
  \ APK 文件上运行 `ProGuard` 的指令：\n\n```gradle\nbuildTypes {\n    release {\n        minifyEnabled\
  \ false\n        proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),\
  \ 'proguard-rules.pro'\n    }\n}\n```\n\n按照目前的配置，在构建 `Module1` 时不会运行 `ProGuard`。要启用\
  \ `ProGuard`，需要将 `minifyEnabled` 属性从 `false` 改为 `true`。`proguard-rules.pro` 文件可以在项目的模块目录下找到。对该文件进行的更改将覆盖位于\
  \ Android SDK 安装目录下 `/sdk/tools/proguard` 下的 `proguard-android.txt` 文件中的默认设置。\n\n\
  由于此文件中没有声明 `debug buildType`，将使用默认设置（不带 ProGuard 进行构建，使用调试密钥签名，并启用调试符号）。\n\n模块构建文件中还可以包含一个名为\
  \ `productFlavors` 的额外部分，以便创建多个构建变体。\n\n接下来，包含了指令，用于指定构建项目时要使用的 Java 编译器版本：\n\n\
  ```gradle\ncompileOptions {\n    sourceCompatibility JavaVersion.VERSION_1_8\n \
  \   targetCompatibility JavaVersion.VERSION_1_8\n}\n```\n\n最后，`dependencies` 部分列出了模块所依赖的任何本地和远程依赖。上述示例中的依赖行指定了需要从\
  \ Android 仓库包含的 Android 库：\n\n```gradle\nimplementation 'androidx.core:core-ktx:1.3.1'\n\
  implementation 'androidx.appcompat:appcompat:1.2.0'\n```\n\n注意，依赖声明包含了版本号，以指示应该包含哪个版本的库。\n\
  \n## 87.5 在构建文件中配置签名设置\n\n本书的“创建、测试和上传 Android App Bundle”章节涵盖了使用 Android Studio\
  \ 用户界面设置密钥和生成签名发布版 APK 文件的步骤。这些设置也可以在 `build.gradle` 文件的 `signingSettings` 中声明。例如：\n\
  \n```gradle\ndefaultConfig {\n    //\n}\nsigningConfigs {\n    release {\n     \
  \   storeFile file(\"keystore.release\")\n        storePassword \"your keystore\
  \ password here\"\n        keyAlias \"your key alias here\"\n        keyPassword\
  \ \"your key password here\"\n    }\n}\nbuildTypes {\n    //\n}\n```\n\n上述示例将密钥密码信息直接嵌入到构建文件中。这种方法的另一种替代方案是从系统环境变量中提取这些值：\n\
  \n```gradle\nsigningConfigs {\n    release {\n        storeFile file(\"keystore.release\"\
  )\n        storePassword System.getenv(\"KEYSTOREPASSWD\")\n        keyAlias \"\
  your key alias here\"\n        keyPassword System.getenv(\"KEYPASSWD\")\n    }\n\
  }\n```\n\n另一种方法是配置构建文件，让 `Gradle` 在构建过程中提示用户输入密码：\n\n```gradle\nsigningConfigs {\n\
  \    release {\n        storeFile file(\"keystore.release\")\n        storePassword\
  \ System.console().readLine(\"\\nEnter Keystore password: \")\n        keyAlias\
  \ \"your key alias here\"\n        keyPassword System.console().readLIne(\"\\nEnter\
  \ Key password: \")\n    }\n}\n```\n\n## 87.6 从命令行运行 Gradle 任务\n\n每个 Android Studio\
  \ 项目包含一个 `Gradle wrapper` 工具。`Gradle wrapper` 位于项目的根目录下。要从命令行运行 Gradle 任务，请使用 `./gradlew`\
  \ 脚本（Unix/macOS）或 `gradlew.bat`（Windows）。例如，构建项目请运行：\n\n```bash\n./gradlew assembleDebug\n\
