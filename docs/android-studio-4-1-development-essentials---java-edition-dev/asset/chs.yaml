  \ 在构建文件中配置签名\n## 87.6 从命令行运行 Gradle \n## 87.7 总结\n\n# 索引\n\n1.1 导言\n\nGoogle 在 2018\
  \ 年向开发者社区引入了 Jetpack。Jetpack 旨在更快速、更更容易开发现代且可靠的应用，它由一系列工具、库和架构指南组成。Jetpack 的主要元素包括\
  \ Android Studio 集成开发环境 (IDE)、架构组件 (Architecture Components) 和架构指南。\n\n本书已针对 Android\
  \ Studio 4.1 进行了完全更新，目标是教授使用 Java 语言开发 Android 应用所需的技能。\n\n本书从基础知识开始，提供了设置 Android\
  \ 开发和测试环境所需的步骤大纲。书中包含了对 Android Studio 的概述，涵盖了工具窗口、代码编辑器和布局编辑器 (Layout Editor) 等领域。在介绍\
  \ Android 架构之后，深入探讨了如何使用 Android Studio 环境设计 Android 应用和用户界面。\n\n章节还涵盖了 Android\
  \ 架构组件，包括视图 (ViewModels)、生命周期管理、Room 数据库访问、数据库检查器 (Database Inspector)、应用导航、活动数据\
  \ (Live Data) 和数据绑定 (Data Binding)。\n\n书中还涵盖了如 Intent 等更高级的话，以及触摸屏处理、手势识别以及音频的录制和播放。本版还涵盖了打印、过渡、云存储和对折叠设备的支持。\n\
  \n书中还详细介绍了材料设计 (Material Design) 的概念，包括悬浮操作按钮 (FAB)、Snbars、标签页界面、卡片视图 (Card Views)、导航抽屉和折叠工具栏。\n\
  \n此外还详细介绍了 Android Studio 4.1 和 Android 的其他关键特性，包括布局编辑器、`ConstraintLayout` 和 `ConstraintSet`\
  \ 类、MotionLayout 编辑器、视图绑定、约束链 (Constraint Chains)、屏障 (Barriers) 和直接回复通知。\n\n假设你已经具备\
  \ Java 编程经验，已准备好下载 Android Studio 和 Android SDK，拥有 Windows、Mac 或 Linux 系统，并对要开发的应用有一些想法，那么你就可以开始了。\n\
  \n1.1 下载代码示例\n\n书中包含的示例源码和 Android Studio 项目文件可以在以下处下载：\n\nhttps://www.ebookfrenzy.com/retail/androidstudio41/index.php\n\
  \n从代码示例将项目加载到 Android Studio 的步骤如下：\n\n1. 从“Welcome to Android Studio”对话框中，选择“Open\
  \ an Existing Project”（打开现有项目）选项。\n2. 在项目选择对话框中，导航到选择包含要导入项目的文件夹并点击 OK。\n\n1.2 反馈\n\
