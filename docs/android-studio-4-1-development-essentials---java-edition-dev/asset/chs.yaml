  \ `<fragment>` 条目，将其放置在水平居中的位置并位于第一个 fragment 的下边缘下方。在弹出提示时，从 fragment 对话框中选择 `TextFragment`\
  \ 条目，然后点击 `OK` 按钮。再次显示错误面板并点击 `Use @layout/fragment_text` 选项。使用 `Infer constraints`\
  \ 按钮建立任何缺失的布局约束。\n\n注意，fragment 现在在布局中可见了，如 图 31-8 所示：\n\n![](img/as_4.1_fragments_added.jpg)\n\
  \n图 31-8\n\n在继续下一步之前，在布局中选择 `TextFragment` 实例，并在 Attributes 工具窗口中将 fragment 的 ID\
  \ 更改为 `text_fragment`。\n\n### 31.6 让 Tool 栏 Fragment 与 Activity 通信\n\n当用户触摸 toolbar\
  \ fragment 中的按钮时，fragment 类需要从 `EditText` 视图获取文本以及 `SeekBar` 的当前值，并将它们发送到文本 fragment。正如\
  \ “Android Fragments 简介” 所述，fragment 之间不应直接通信，而应该使用嵌入它们的 activity 作为中间媒介。\n\n此过程的第一步是确保\
  \ toolbar fragment 对应按钮点击事件有响应。我们还需要实现一些代码来跟踪 `SeekBar` 视图的值。为了本例的起见，我们将在 `ToolbarFragment`\
  \ 类中实现这些监听器。选择 `ToolbarFragment.java` 文件并进行修改，使其读取内容如下所示：\n\n```java\npackage com.ebookfrenzy.fragmentexample;\n\
  \nimport android.os.Bundle;\nimport androidx.fragment.app.Fragment;\nimport android.view.LayoutInflater;\n\
  import android.view.View;\nimport android.view.ViewGroup;\nimport android.content.Context;\n\
  import android.widget.Button;\nimport android.widget.EditText;\nimport android.widget.SeekBar;\n\
  import android.widget.SeekBar.OnSeekBarChangeListener;\n\npublic class ToolbarFragment\
  \ extends Fragment implements OnSeekBarChangeListener {\n\n    private static int\
  \ seekvalue = 10;\n    private static EditText edittext;\n\n    @Override\n    public\
  \ View onCreateView(LayoutInflater inflater, ViewGroup container, Bundle savedInstanceState)\
  \ {\n        // Inflate the layout for this fragment\n        return inflater.inflate(R.layout.fragment_toolbar,\
  \ container, false);\n        View view = inflater.inflate(R.layout.fragment_toolbar,\
  \ container, false);\n        edittext = view.findViewById(R.id.editText1);\n  \
  \      final SeekBar seekbar = view.findViewById(R.id.seekBar1);\n        seekbar.setOnSeekBarChangeListener(this);\n\
  \        final Button button = view.findViewById(R.id.button1);\n        button.setOnClickListener(new\
  \ View.OnClickListener() {\n            public void onClick(View v) {\n        \
  \        buttonClicked(v);\n            }\n        });\n        return view;\n \
  \   }\n\n    public void buttonClicked (View view) {\n    }\n\n    @Override\n \
  \   public void onProgressChanged(SeekBar seekBar, int progress, boolean fromUser)\
  \ {\n        seekvalue = progress;\n    }\n\n    @Override\n    public void onStartTrackingTouch(SeekBar\
  \ arg0) {\n    }\n\n    @Override\n    public void onStopTrackingTouch(SeekBar arg0)\
  \ {\n    }\n}\n```\n\n在继续之前，我们需要花时间解释一下上面的代码。首先，该类声明实现了 `OnSeekBarChangeListener`。这是因为用户包含一个\
  \ `SeekBar` 实例，且 fragment 需要在用户滑动条时接收通知。`OnSeekBarChangeListener` 要求实现 `onProgressChanged()`、`onStartTrackingTouch()`\
  \ 和 `onStopTrackingTouch()`。这些方法都已实现，但实际上只需要实现 `onProgressChanged()`，在此情况下，它将新值存储在开头声明的变量\
  \ `seekvalue` 中。此外，还声明了一个用于存储 `EditText` 引用的变量。添加 `onCreateView()`是为了获取布局中 `EditText`\
  \ 和 `Button` 视图的引用。一旦获取了按钮的引用，它被用于在按钮上设置 `OnClickListener`，并配置为在检测到事件时调用 `buttonClicked()`\
  \ 方法。该方法也已实现，尽管目前它什么都没做。此阶段的阶段是设置监听器，允许 fragment 在按钮被点击时调用 activity。这遵循了上一章的内容：\n\
  \n```java\nclass ToolbarFragment extends Fragment implements OnSeekBarChangeListener\
  \ {\n\n    private static int seekvalue = 10;\n    private static EditText edittext;\n\
  \n    public interface ToolbarListener {\n        void onButtonClick(int position,\
  \ String text);\n    }\n\n    @Override\n    public void onAttach(Context context)\
  \ {\n        super.onAttach(context);\n        try {\n            activityCallback\
  \ = (ToolbarListener) context;\n        } catch (ClassCastException e) {\n     \
  \       throw new ClassCastException(context.toString() + \" must implement ToolbarListener\"\
  );\n        }\n    }\n\n    public void buttonClicked (View view) {\n        activityCallback.onButtonClick(seekvalue,\
  \ edittext.toString());\n    }\n}\n```\n\n上述实现将导致当用户点击按钮时，调用属于 activity 类的名为 `onButtonClick()`\
  \ 方法。因此，剩下的工作是声明 activity 类实现了新创建的 `ToolbarListener` 接口并实现 `onButtonClick()` 方法。\n\
  \n由于在早期 Android 版本中使用 Android Support Library 来支持 fragment，activity 还需要更改为子自 `FragmentActivity`\
  \ 而不是 `AppCompatActivity`。将这些要求结合起来得到了如下修改后的 `MainActivity.java` 文件：\n\n```java\n\
  package com.ebookfrenzy.fragmentexample;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  import androidx.fragment.app.FragmentActivity;\nimport android.os.Bundle;\n\npublic\
  \ class MainActivity extends FragmentActivity implements ToolbarFragment.ToolbarListener\
  \ {\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n\
  \        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_fragment_example);\n\
  \    }\n\n    public void onButtonClick(int fontsize, String text) {\n    }\n}\n\
  ```\n\n\n\n按照目前的代码更改，工具栏片段（toolbar fragment）将检测用户点击按钮的操作，并调用 activity 的方法，传递 `EditText`\
  \ 字段的内容和 `SeekBar` 视图的当前设置。现在轮到 activity 与文本片段（Text Fragment）进行通信并传递这些值，以便片段能够相应地更新\
  \ `TextView` 对象。\n\n### 31.7 让 Activity 与文本片段进行通信\n\n如“Android Fragments 简介”所述，activity\
  \ 可以通过获取片段类实例的引用，然后调用对象上的公共方法与片段进行通信。因此，在 `TextFragment` 类中，我们现在实现一个名为 `changeTextProperties()`\
  \ 的公共方法，该方法接受一个表示字体大小的整数和一个表示要显示的新文本的字符串作为参数。该方法将使用这些值来修改 `TextView` 对象。在 Android\
  \ Studio 编辑面板中，找到并修改 `TextFragment.java` 文件以添加此新方法，并在 `onCreateView()` 方法中添加代码以获取\
  \ `TextView` 对象的 ID：\n\n```java\npackage com.ebookfrenzy.fragmentexample;\n\nimport\
  \ android.os.Bundle;\n\nimport androidx.fragment.app.Fragment;\n\nimport android.view.LayoutInflater;\n\
  \nimport android.view.View;\n\nimport android.view.ViewGroup;\n\nimport android.widget.TextView;\n\
  \npublic class TextFragment extends Fragment {\n    private static TextView textview;\n\
  \n    @Override\n    public View onCreateView(LayoutInflater inflater,\n       \
  \                      ViewGroup container,\n                             Bundle\
  \ savedInstanceState) {\n        // Inflate the layout for this fragment\n     \
  \   return inflater.inflate(R.layout.fragment_text, container, false);\n       \
  \ View view = inflater.inflate(R.layout.fragment_text,\n                    container,\
  \ false);\n        textview = view.findViewById(R.id.textView1);\n        return\
  \ view;\n    }\n\n    public void changeTextProperties(int fontsize, String text)\n\
  \    {\n        textview.setTextSize(fontsize);\n        textview.setText(text);\n\
  \    }\n}\n```\n\n当 `TextFragment` 片段放入 activity 的布局中，它被赋予了 ID `text_fragment`。通过使用此\
  \ ID，activity 现在可以获取片段实例的引用并调用对象上的 `changeTextProperties()` 方法。编辑 `MainActivity.java`\
  \ 文件并按如下方式修改 `onButtonClick()` 方法：\n\n```java\npublic void onButtonClick(int fontsize,\
  \ String text) {\n    TextFragment textFragment =\n    (TextFragment)\n      getSupportFragmentManager().findFragmentById(R.id.text_fragment);\n\
  \    textFragment.changeTextProperties(fontsize, text);\n}\n```\n\n### 31.8 测试应用程序\n\
  \n该项目的编码工作现在已经完成，最后一个任务是运行应用程序。当应用程序启动时，主 activity 将启动，并转创建并显示两个片段。当用户触摸工具栏片段中的按钮时，工具栏片段将调用\
  \ activity 的 `onButtonClick()` 方法，并传递来自 `EditText` 视图的文本和 `SeekBar` 的当前值。随后 activity\
  \ 将调用第二个片段的 `changeTextProperties()` 方法，该方法将修改 `TextView` 以反映新的文本和字体大小：\n\n![](img/as_4.1_fragment_example_running.jpg)\n\
  \n图 31-9\n\n### 31.9 总结\n\n本章的目标是创建一个示例项目，该项目专门用于演示 Android 应用程序中使用片段的步骤。涵盖的主题包括使用\
  \ Android Support Library 以兼容引入片段之前的 Android 版本，在 activity 布局中包含片段，以及实现片段间的通信。\n\
  \n# 32. 使用 Jetpack 构建现代 Android 应用架构\n\n直到最近，Google 并没有推荐构建 Android 应用的特定方法，而是提供工具和开发工具包，让开发者自行决定什么方法对特定项目或个人编程风格有效。这种情况在\
  \ 2017 年随着 Android Architecture Components 的引入而发生了，它随后在 2018 年发布时成为了 Android Jetpack\
  \ 的一部分。\n\n本章的目的是提供 Jetpack 概念、Android 应用架构建议以及一些关键架构组件的概述。在涵盖基础知识后，这些主题将在后续章节中详细介绍并通过实际示例进行演示。\n\
  \n### 32.1 什么是 Android Jetpack？\n\nAndroid Jetpack 由 Android Studio、Android Architecture\
  \ Components 和 Android Support Library 连同一组建议 Android 应用应该如何构建的指南组成。Android Architecture\
  \ Components 的设计是为了在开发 Android 应用时让执行常用任务变得更快、更简单，同时符合架构指南的核心原则。\n\n虽然本书将涵盖所有的 Android\
  \ Architecture Components，但本章的目标是介绍关键架构指南以及 `ViewModel`、`LiveData`、`Lifecycle` 组件，同时引入数据绑定（Data\
  \ Binding）和存储库（Repositories）的使用。\n\n在继续之前，了解 Jetpack 应用开发方法并非强制性的，这一点很重要。虽然 Google\
  \ 强调了一些多年来越来越受欢迎的其他技术的缺点，但 Google 并没有完全谴责那些应用开发方法。Google 似乎采取了这样的立场：虽然开发应用没有绝对对错之分，但存在一种推荐的方法。\n\
  \n## 32.2 “旧”架构\n\n在名为“在 Android Studio 中创建 Android 应用”的章节中，创建了一个 Android 项目，由单个\
  \ activity 组成，该 activity 包含了呈现和管理用户界面的所有代码以及应用程序的后端逻辑。在 Jetpack 引入之前，最常见的架构遵循这种范式，应用由多个\
  \ activity（应用中的每个屏幕对应一个）组成，且每个 activity 类在某种程度上混合了用户界面和后端代码。\n\n这种方法导致了一系列与应用生命周期相关的问题（例如，当用户旋转设备时，activity\
  \ 会被销毁并重建，导致未保存到某种持久化存储中的应用数据丢失），以及如导航低效等问题（为用户访问的每个应用屏幕启动新的 activity）。\n\n### 32.3\
  \ 现代 Android 架构\n\n在最基础层面，Google 现在提倡单 activity 应用，不同的屏幕作为内容加载到同一个 activity 中。\n\
  \n现代架构指南还建议将应用内部的不同职责区域划分到完全独立的模块（Google 将此称为“关注点分离”）。这种方法的关键之一是 `ViewModel` 组件。\n\
  \n### 32.4 ViewModel 组件\n\nViewModel 的目的是将应用中用户界面相关的数据模型和逻辑与负责实际显示、管理用户界面以及与操作系统交互的代码分离。通过这种设计，应用将由一个或多个\
  \ UI 控制器（如 activity）以及负责处理这些控制器所需数据的 ViewModel 实例组成。\n\n\n\n\n实际上，`ViewModel` 只感知数据模型和相应的逻辑。它对用户界面一无所知，也不会尝试直接访问或响应与用户界面内视图相关的事件。当\
  \ UI 控制器需要数据进行显示时，它只需请求 `ViewModel` 提供即可。同样，当用户在用户界面内的视图中输入数据时，UI 控制器会将其传递给 `ViewModel`\
  \ 进行处理。\n\n这种职责的分离解决了与 UI 控制器生命周期相关的问题。无论 UI 控制器在应用生命周期内被重建多少次，`ViewModel` 实例都会保留在内存中，从而保持数据的一致性。例如，activity\
  \ 使用的 `ViewModel` 将一直保留在内存中，直到 activity 完全结束；在单 activity 应用中，这意味着要等到应用退出时才会结束。\n\
  \n![](img/jetpack_diagram_1.jpg)\n图 32-1\n\n## 32.5 LiveData 组件\n\n考虑一个显示实时数据（如金融股票的当前价格）的应用。该应用可能会使用某种形式的股票价格\
  \ Web 服务，用最新信息持续更新 `ViewModel` 中的数据模型。显然，如果这些实时数据不能及时显示给用户，它们将毫无用处。UI 控制器只有两种方式可以确保在用户界面显示最新数据。一种方案是控制器持续检查\
  \ `ViewModel`，以确定数据自上次显示以来是否发生了变化。然而，这种方法的问题在于它效率低下。为了保持数据流的实时性，UI 控制器必须在循环中运行，持续检查数据是否变化。\n\
  \n更好的解决方案是当 `ViewModel` 中的某个特定数据项发生变化时，UI 控制器接收到一个通知。这通过使用 `LiveData` 组件实现。`LiveData`\
  \ 是一个数据持有者，允许一个值变得可观察。简单来说，可观察对象具有在对其数据发生变化时通知其他对象的能力，从而解决了确保用户界面始终与 `ViewModel`\
  \ 中的数据匹配的问题。\n\n这意味着，例如，对 `ViewModel` 值感兴趣的 UI 控制器可以设置一个观察者，该观察者会在该值变化时反过来收到通知。在我们假设的应用中，例如，股票价格将被封装在\
  \ `ViewModel` 内部的 `LiveData` 对象中，UI 控制器为该值分配一个观察者，声明一个在值变化时调用的方法。当该方法被数据变化触发时，将从\
  \ `ViewModel` 读取更新后的值并使用它来更新用户界面。\n\n![](img/Jetpack_diagram_2.jpg)\n图 32-2\n\n\
  `LiveData` 实例也可以被声明为可变的，允许观察实体更新 `LiveData` 对象中持有的底层值。例如，用户可能会在用户界面中输入一个需要覆盖存储在\
  \ `ViewModel` 中的值。\n\n使用 `LiveData` 的另一个关键优势是它能够感知观察者的生命周期状态。例如，如果一个 activity 包含一个\
  \ `LiveData` 观察者，相应的 `LiveData` 对象将知道 activity 的生命周期状态何时变化并做出相应响应。如果 activity 被暂停（可能是应用被放入后台），`LiveData`\
  \ 对象将停止向观察者发送事件。如果 activity 刚刚启动或在暂停后恢复，`LiveData` 对象将向观察者发送一个 `LiveData` 事件，以便\
  \ activity 拥有最新的值。同样，`LiveData` 实例将知道 activity 何时销毁，并移除观察者以释放资源。\n\n到为止，我们只谈到了 UI\
  \ 控制器使用观察者。但在实践中，观察者可以在任何符合 Jetpack 生命周期周期管理方法的对象内部使用。\n\n## 32.6 ViewModel 保存状态\n\
  \nAndroid 允许用户将活动应用放入后台，并在在设备上执行其他任务（包括运行其他应用）后返回。当设备资源不足时，操作系统将通过终止后台应用进程来纠正这个问题，从最久使用的应用开始。然而，当用户返回被终止的后台应用时，它应该显示为被放入后台时相同的状态，无论它是否被终止。对于与\
  \ `ViewModel` 关联的数据，可以通过 `ViewModel Saved State`（ViewModel 保存状态）模块来实现。该模块允许将值存储在应用的保存状态中，并在系统启动的进程终止时恢复，该主题将在书中后面标题为\
  \ Android ViewModel 保存状态教程”(#ViewModel_Saved_State.xhtml__idTextAnchor766) 的章节中介绍。\n\
  \n## 32.7 LiveData 和数据绑定\n\nAndroid Jetpack 包含了数据绑定库（Data Binding Library），它允许将\
  \ `ViewModel` 中的数据直接映射到 XML 用户界面布局文件中的特定视图。在之前创建的 `AndroidSample` 项目中，必须编写代码来同时获取\
  \ `EditText` 和 `TextView` 视图的引用，并编写代码设置和获取文本属性以反映数据变化。数据绑定允许存储在 `ViewModel` 中的 `LiveData`\
  \ 值直接在 XML 布局文件中被引用，避免了编写代码来保持布局视图更新的需求。\n\n![\n图 32-3\n\n数据绑定将在标题为 [“Android Jetpack\
  \ 数据绑定概览”(#Data_Binding_Overview.xhtml__idTextAnchor737) 的章节开始进行更详细的介绍。\n\n## 32.8\
  \ Android 生命周期\n\n从 Android 组件创建到其被销毁的时间被称为生命周期。在这一生命周期内，组件将在不同的生命周期状态之间切换，通常受操作系统的控制并响应用户操作。例如，activity\
  \ 将从初始化状态开始，然后过渡到创建状态。一旦 activity 开始运行，它将切换到启动状态，并在此之后创建、启动、恢复和销毁等状态之间循环。\n\n许多\
  \ Android 框架类和组件允许其他对象访问其当前状态。也可以使用生命周期观察者，以便在另一个对象的生命周期状态变化时接收通知。这是 `ViewModel`\
  \ 组件在背后使用的技术，用于识别观察者何时已重启或销毁。此功能不仅限于 Android 框架和架构组件，也可以构建在任何使用架构组件包含的组件的类中。\n\n\
  能够检测并响应其他对象生命周期变化的对象被称为生命周期感知型（lifecycle-aware），而提供其生命周期状态的对象被称为生命周期所有者（lifecycle-owners）。生命周期将在标题为\
  \ [“使用 Android 生命周期感知组件”(#Lifecycle_Components.xhtml__idTextAnchor773) 的章节中进行更详细的介绍。\n\
  \n## 32.9 仓库模块\n\n如果 `ViewModel` 从一个或多个外部源（如数据库或 Web 服务）获取数据，那么将处理这些数据源的代码与 `ViewModel`\
  \ 类分离是非常关重要的。毕竟，这样做将违反关注点分离原则。为了避免将此功能与 `ViewModel` 混合在一起，Google 的架构指南建议将此代码放置在独立的仓库（Repository）模块中。\n\
  \n\n\n\n\nRepository（仓库）并不是 Android 架构组件，而是由应用开发者创建的 Java 类，负责与各种数据源进行交互。该类随后为 `ViewModel`\
  \ 提供一个接口，允许数据存储在模型中。\n\n![](img/Jetpack_diagram_4.jpg)\n\n图 32-4\n\n## 32.10 总结\n\
  \n直到去年，Google 倾向于不推荐任何特定的 Android 应用结构方法。随着 Android Jetpack 的引入，这种情况现在发生了变化。Jetpack\
  \ 包含了一套工具、组件、库和架构指南。Google 现在建议将应用项目划分为单独模块，每个模块负责特定的功能区域，即所谓的“关注点分离”（separation\
  \ of concerns）。\n\n特别是，指南建议将应用的视图数据模型与负责处理用户面的代码分离。此外，负责从网络服务或数据库等数据源收集数据的代码应该构建在独立的\
  \ repository 模块中，而不是与 ViewModel 绑定。\n\nAndroid Jetpack 包含了 Android 架构组件（Android\
  \ Architecture Components），这些组件专门设计用于便于开发符合推荐指南的应用程序。本章介绍了 `ViewModel`、`LiveData`\
  \ 和 `Lifecycle` 组件。从下一章开始，我们将详细介绍这些内容。本书后面将介绍本章未提到的其他架构组件。\n\n## 33. Android Jetpack\
  \ ViewModel 教程\n\n上一章介绍了 Android Jetpack 的核心概念，并概述了现代 Android 应用架构的基础。Jetpack 本质上定义了一\
  \ set 建议，描述了 Android 应用项目应该如何构建，同时提供了一系列库和组件，使其更容易符合这些指南，目标是用更少的代码和更少的错误开发出可靠的应用。\n\
  \n为了帮助强化和澄清上一章提供的信息，本章将逐步演示创建一个使用 `ViewModel` 组件的示例应用项目。该示例将在下一章中通过包含 `LiveData`\
  \ 和数据绑定支持来进一步增强。\n\n## 33.1 关于项目\n\n在题为“在 Android Studio 中创建示例 Android 应用”的章节中，创建了一个名为\
  \ `AndroidSample` 的项目，应用的所有代码都封装在主 `Activity` 类文件中。在随后的章节中，创建了一个 AVD 模拟器并使用它运行该应用。在应用运行时，我们亲身经历了以这种方式开发应用时发生的问题：当\
  \ `TextView` 小部件上显示的数据在设备旋转期间会丢失。\n\n本章将实现相同的货币转换器应用，这次将使用 `ViewModel` 组件并遵循 Google\
  \ 应用架构指南，以避免 `Activity` 生命周期带来的复杂性。\n\n### 33.2 创建 ViewModel 示例项目\n\n此练习的第一步是创建新项目。首先启动\
  \ Android Studio，如有必要，使用 `File -> Close Project` 菜单选项关闭任何当前打开的项目，以便出现欢迎界面。\n\n创建\
  \ `AndroidSample` 项目时，选择了 `Empty Activity` 模板作为项目的的基础。然而，对于此项目，将使用 `Fragment + ViewModel`\
  \ 模板。这将生成一个结构符合架构指南的 Android Studio 项目。\n\n从欢迎界面选择 `Create New Project` 快速启动选项，在生成的新项目对话框中，点击\
  \ `Next` 按钮之前选择 `Fragment + ViewModel` 模板。\n\n在 `Name` 字段中输入 `ViewModelDemo`，并指定\
  \ `com.ebookfrenzy.viewmodeldemo` 为包名。在点击 `Finish` 按钮之前，将 `Minimum API level` 设置为\
  \ `API 26: Android 8.0 (Oreo)`，并将 `Language` 菜单改为 `Java`。\n\n## 33.3 检查项目\n\n使用\
  \ `Fragment + ViewModel` 模板创建项目时，其结构在许多方面与创建 `AndroidSample` 项目时使用的 `Empty Activity`\
  \ 不同。项目的关键组件如下：\n\n### 33.3.1 主 Activity\n\n首先需要注意的是，主 Activity 的用户界面结构经过了处理，允许单个活动作为完成应用最终所需的所有屏幕的容器。活动的主用户界面布局包含在\
  \ `app -> res -> layout -> main_activity.xml` 文件中，并以 `FrameLayout`（如图 33-1 所示）的形式提供了一个空容器空间，屏幕内容将出现在其中：\n\
  \n![](img/android_studio_view_model_container_area.jpg)\n\n图 33-1\n\n### 33.3.2\
  \ 内容 Fragment\n\n`FrameLayout` 容器只是一个占位符，将在运行时由应用启动时显示的第一个屏幕的内容替换。该内容通常以 `Fragment`\
  \ 形式存在由 XML 布局资源文件和相应的类文件组成。事实上，在创建项目时，Android Studio 为此目的创建了一个初始 fragment。该 fragment\
  \ 的布局资源文件可以在 `app -> res -> layout -> main_fragment.xml` 找到，当加载到布局编辑器时，将如图 33-2\
  \ 所示：\n\n![](img/as_3.5_viewmodel_main_fragment.jpg)\n\n图 33-2\n\n默认情况下，该 fragment\
  \ 包含一个显示文本“MainFragment”的 `TextView`，但其他方面已准备好被修改以包含第一个应用屏幕的布局。此时值得花时间查看 Android\
  \ Studio 已经生成的在 activity 容器区域显示此 fragment 代码。\n\n将 `FrameLayout` 占位符替换为 fragment\
  \ 的过程从 `MainActivity` 类文件（`app -> java -> <package name> -> MainActivity`）开始。关键代码出现在该类的\
  \ `onCreate()` 方法中，将 id 为 `container` 的对象（已分配给 `FrameLayout`）替换为 `MainFragment`\
  \ 类：\n\n```java\n@Override\nprotected void onCreate(Bundle savedInstanceState) {\n\
  \    super.onCreate(savedInstanceState);\n    setContentView(R.layout.main_activity);\n\
  \    if (savedInstanceState == null) {\n        getSupportFragmentManager().beginTransaction()\n\
  \            .replace(R.id.container, MainFragment.newInstance())\n            .commitNow();\n\
  \    }\n}\n```\n\n伴随 fragment 的代码可以在 `MainFragment.java` 文件（`app -> <package name>\
  \ -> ui.main -> MainFragment`）中找到。该类包含 `onCreateView()` 方法，该方法在 fragment 创建时被调用。此方法加载\
  \ `main_fragment.xml` 布局文件，使其显示在主布局的容器区域：\n\n```java\n@Override\npublic View onCreateView(@NonNull\
  \ LayoutInflater inflater, @Nullable ViewGroup container, @Nullable Bundle savedInstanceState)\
  \ {\n    return inflater.inflate(R.layout.main_fragment, container, false);\n}\n\
  ```\n\n### 33.3.3 ViewModel\n\n活动的 ViewModel 包含在 `MainViewModel.java` 类文件中，位于 `app\
  \ -> java -> ui.main -> MainViewModel`。它被声明为 Android 架构组件类的子类，并准备好被修改以存储应用的数据模型：\n\
  \n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\nimport androidx.lifecycle.ViewModel;\n\
  \npublic class MainViewModel extends ViewModel {\n    // TODO: Implement the ViewModel\n\
  }\n```\n\n## 33.4 设计 Fragment 布局\n\n\n\n\n\n下一步是设计 fragment 的布局。在 Project（项目）工具窗口中找到\
  \ `main_fragment.xml` 文件，双击它将其加载到布局编辑器中。布局加载完成后，选择现有的 `TextView` 组件，并使用 Attributes（属性）工具窗口将\
  \ `id` 属性更改为 `resultText`。\n\n从调色板（palette）中拖入一个 `Number (Decimal)` 视图视图，并将其放置在现有\
  \ `TextView` 之上。在布局中选中该视图后，参考 Attributes 工具窗口并将 `id` 改为 `dollarText`。\n\n将一个 `Button`（按钮）组件拖到布局中，使其位于\
  \ `TextView` 下方，并将文本（text）属性改为“Convert”（转换）。在按钮仍处于选中状态时，将 `id` 属性更改为 `convertButton`。此时，布局应该类似于图\
  \ 33-3 所示：\n\n![](img/as_4.1_view_model_ui.jpg)\n\n图 33-3\n\n点击 `Infer constraints`（推断约束）按钮（图\
  \ 33-4）来添加任何缺失的布局约束：\n\n![](img/android_studio_layout_infer_constraints.jpg)\n\n\
  图 33-4\n\n最后，点击布局编辑器右上角的警告图标，并将硬编码字符串转换为资源。\n\n## 33.5 实现 View Model\n\n完成用户界面布局后，需要在\
  \ view model 中创建应用的数据模型。在 Project 工具窗口中，找到 `MainViewModel.java` 文件，双击它将其加载到代码编辑器中，并修改该类使其内容如下：\n\
  \n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\nimport androidx.lifecycle.ViewModel;\n\
  \npublic class MainViewModel extends ViewModel {\n    private static final Float\
  \ usd_to_eu_rate = 0.74F;\n    private String dollarText = \"\";\n    private Float\
  \ result = 0F;\n\n    public void setAmount(String value) {\n        this.dollarText\
  \ = value;\n        result = Float.parseFloat(dollarText)*usd_to_eu_rate;\n    }\n\
  \n    public Float getResult()\n    {\n        return result;\n    }\n}\n```\n\n\
  该类声明了变量来存储当前的美元字符串值以及转换后的金额，并配有 getter 和 setter 方法以访问这些数据值。当调用 `setAmount()` 方法时，它接收当前美元金额作为参数并将其存储在局部变量\
  \ `dollarText` 中。美元字符串值被转换为浮点数，乘以一个虚构的汇率，并将生成的欧元值存储在 `result` 变量中。另一方面，`getResult()`\
  \ 方法只需返回赋值给 `result` 变量的当前值。\n\n## 33. 将 Fragment 与 View Model 关联\n\n显然，fragment\
  \ 需要某种方式来获取 `ViewModel` 的引用，以便访问模型并观察数据变化。`Fragment` 或 `Activity` 使用 `ViewModelProvider`\
  \ 类的实例来维护其赖以获取数据的 `ViewModels` 。\n\n在 `Fragment` 内部使用 `ViewModelProvider` 类创建 `ViewModelProvider`\
  \ 实例。调用时，类初始化器会接收当前 `Fragment` 或 `Activity` 的引用，并返回如下 `ViewModelProvider` 实例：\n\n\
  ```java\nViewModelProvider viewModelProvider = new ViewModelProvider(this);\n```\n\
  \n一旦创建了 `ViewModelProvider` 实例，就可以在该实例上调用 `get()` 方法，并传递所需的特定 `ViewModel` 类。提供者将随后创建该\
  \ `ViewModel` 类的新实例，或者返回一个已存在的实例：\n\n```java\nViewModel viewModel = viewModelProvider.get(MainViewModel.class);\n\
  ```\n\n编辑 `MainFragment.java` 文件，并验证 Android Studio 是否已经在 `onActivityCreated()`\
  \ 方法中包含了此步骤（为了简洁起见，在单行代码中执行该操作）：\n\n```java\nviewModel = new ViewModelProvider(this).get(MainViewModel.class);\n\
  ```\n\n访问模型视图后，现在可以向 `Fragment` 中添加代码以开始处理数据模型。\n\n## 33.7 修改 Fragment\n\n现在需要更新\
  \ fragment 类以响应按钮点击并与存储在 `ViewModel` 中的数据值进行交互。该类还需要用户界面布局中三个视图的引用，以便响应按钮点击、提取当前美元值并显示转换后的货币金额。在将\
  \ `MainFragment` 类文件加载到代码编辑器后，修改 `onActivityCreated()` 方法，如下所示获取并存储三个视图对象的引用：\n\n\
  ```java\nimport android.widget.Button;\nimport android.widget.EditText;\nimport\
  \ android.widget.TextView;\nimport com.ebookfrenzy.viewmodeldemo.R;\n\npublic class\
  \ MainFragment extends Fragment {\n    private MainViewModel mViewModel;\n    private\
  \ EditText dollarText;\n    private TextView resultText;\n    private Button convertButton;\n\
  \n    @Override\n    public void onActivityCreated(@Nullable Bundle savedInstanceState)\
  \ {\n        super.onActivityCreated(savedInstanceState);\n        mViewModel =\
  \ new ViewModelProvider(this).get(MainViewModel.class);\n        dollarText = getView().findViewById(R.id.dollarText);\n\
  \        resultText = getView().findViewById(R.id.resultText);\n        convertButton\
  \ = getView().findViewById(R.id.convertButton);\n    }\n}\n```\n\n在章节创建一个 Android\
  \ 应用 中，曾使用 `Button` 的 `onClick` 属性来指定点击按钮时调用的方法。遗憾的是，该属性只能调用 `Activity` 的方法，而不能用于调用\
  \ `Fragment` 中的方法。为了解决这个问题，我们需要在 `Fragment` 中添加代码来设置 `onClick`。可以将此代码添加到 `MainFragment.java`\
  \ 的 `onActivityCreated()` 方法中，如下：\n\n```java\n@Override\npublic void onActivityCreated(@Nullable\
  \ Bundle savedInstanceState) {\n    super.onActivityCreated(savedInstanceState);\n\
  \    mViewModel = new ViewModelProvider(this).get(MainViewModel.class);\n    dollarText\
  \ = getView().findViewById(R.id.dollarText);\n    resultText = getView().findViewById(R.id.resultText);\n\
  \    convertButton = getView().findViewById(R.id.convertButton);\n    convertButton.setOnClickListener(new\
  \ View.OnClickListener() {\n        @Override\n        public void onClick(View\
  \ v) {\n        }\n    });\n}\n```\n\n添加监听器后，每当用户点击按钮时，放置 `onClick()` 方法中的代码都会被调用。\n\
  \n## 33.8 访问 ViewModel 数据\n\n点击按钮时，`onClick()` 方法需要从 `EditText` 读取当前值，确认字段为空，然后调用\
  \ `ViewModel` 的 `setAmount()` 方法。随后方法需要调用 `ViewModel` 的 `getResult()` 方法并将转换后的值显示在\
  \ `TextView` 上。\n\n由于项目尚未使用 `LiveData`，因此每次创建 `Fragment` 时，都有必要从 `ViewModel` 获取最新结果。\n\
  \n在 `MainFragment.java` 文件中，在 `onActivityCreated()` 方法中实现这些需求：\n\n```java\n@Override\n\
  public void onActivityCreated(@Nullable Bundle savedInstanceState) {\n    super.onActivityCreated(savedInstanceState);\n\
  \    mViewModel = new ViewModelProvider(this).get(MainViewModel.class);\n    dollarText\
  \ = getView().findViewById(R.id.dollarText);\n    resultText = getView().findViewById(R.id.resultText);\n\
  \    convertButton = getView().findViewById(R.id.convertButton);\n    resultText.setText(mViewModel.getResult().toString());\n\
  \    convertButton.setOnClickListener(new View.OnClickListener() {\n        @Override\n\
  \        public void onClick(View v) {\n            if (!dollarText.getText().toString().equals(\"\
  \")) {\n                mViewModel.setAmount(dollarText.getText().toString());\n\
  \                resultText.setText(mViewModel.getResult().toString());\n      \
  \      }\n        }\n    });\n}\n```\n\n\n\n\n\n```java\n        } else {\n    \
  \        resultText.setText(\"No Value\");\n        }\n    });\n}\n```\n\n## 33.9\
  \ 测试项目\n\n随着项目开发阶段的完成，请在模拟器或物理设备上构建并运行应用，输入美元金额并点击 `Convert` 按钮。转换后的金额应显示在 `TextView`\
  \ 上，这表明 UI 控制器和 `ViewModel` 的重构似乎按预期工作。\n\n当运行原始的 `AndroidSample` 应用时，旋转设备会导致 `resultText`\
  \ `TextView` 控件上显示的值丢失。现在对 `ViewModelDemo` 应用重复此此测试，你会注意到旋转后当前的欧元值被保留了。这是因为当 `Fragment`\
  \ 被销毁和重建时，`ViewModel` 继续保留在内存中，并且在 `onActivityCreated()` 方法中添加了代码，每次 `Fragment`\
  \ 重新启动时都会使用 `ViewModel` 中的结果数据值更新 `TextView`。\n\n虽然这是对原始 `AndroidSample` 应用的改进，但通过利用\
  \ `LiveData` 和数据绑定（data binding），可以进一步简化项目，这两者都是后续章节的主题。\n\n# 33.10 总结\n\n在本章中，我们重新回顾了书中之前创建的\
  \ `AndroidSample` 项目，并创建了一个新版本，其结构符合 Android Jetpack 架构指南。本章概述了 `Fragment` + `ViewModel`\
  \ 项目模板的结构，并解释了基于单一 `Activity` 构建应用、使用 `Fragments` 在单个 `Activity` 布局中呈现不同屏幕的概念。示例项目还演示了使用\
  \ `ViewModels` 将数据处理与用户界面相关的代码分离。最后，本章展示了 `ViewModel` 方法如何避免处理 `Fragment` 和 `Activity`\
  \ 生命周期时出现的一些某些问题。\n\n## 34. Android Jetpack LiveData 教程\n\n上一章开始了设计符合推荐 Jetpack\
  \ 架构指南的应用过程。这些初始步骤包括选择 `Fragment`+`ViewModel` 项目模板，以及在 `ViewModel` 实例中为应用用户界面实现数据模型。\n\
  \n本章将通过使用 `LiveData` 架构组件进一步增强应用设计。一旦在本章为项目添加了 `LiveData` 支持，接下来的章节将利用 Jetpack Data\
  \ Binding 库从项目中消除更多代码。\n\n## 34.1 LiveData - 回顾\n\n`LiveData` 在此前的“使用 Jetpack 构建现代\
  \ Android 应用架构”章节中介绍过。如前所述，`LiveData` 组件可以用作 view model 中数据值的包装器。一旦包含在 `LiveData`\
  \ 实例中，这些变量对应用内的其他对象（通常是 UI 控制器，如 `Activities` 和 `Fragments`）变得可见。这允许 UI 控制器在底层 `LiveData`\
  \ 值发生变化时接收通知。通过创建 `Observer` 类的实例并定义 `onChange()` 方法（当 `LiveData` 值发生变化时调用）来设置观察者。一旦创建了\
  \ `Observer` 实例，就会通过调用 `LiveData` 对象的 `observe()` 方法将其附加到 `LiveData` 对象上。\n\n`LiveData`\
  \ 实例可以使用 `MutableLiveData` 类声明为可变，允许 `ViewModel` 和 UI 控制器对底层数据值进行更改。\n\n## 34.2\
  \ 为 ViewModel 添加 LiveData\n\n启动 Android Studio，打开上一章创建的 `ViewModelDemo` 项目，并编辑 `MainViewModel.java`\
  \ 文件，该文件目前的内容如下：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\n\
  import androidx.lifecycle.ViewModel;\n\npublic class MainViewModel extends ViewModel\
  \ {\n    private static final Float usd_to_eu_rate = 0.74F;\n    private String\
  \ dollarText = \"\";\n    private Float result = 0F;\n\n    public void setAmount(String\
  \ value) {\n        this.dollarText = value;\n        result = Float.valueOf(dollarText)*usd_to_eu_rate;\n\
  \    }\n\n    public Float getResult()\n    {\n        return result;\n    }\n}\n\
  ```\n\n本章此阶段的目标是将 `result` 变量封装在 `MutableLiveData` 实例中（该对象需要是可变的，以便在用户每次请求货币转换时都能更改值）。首先修改该类，使其内容如下所示，请注意在使用\
  \ `LiveData` 时需要导入额外的包：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\
  \nimport androidx.lifecycle.MutableLiveData;\nimport androidx.lifecycle.ViewModel;\n\
  \npublic class MainViewModel extends ViewModel {\n    private static final Float\
  \ usd_to_eu_rate = 0.74F;\n    private String dollarText = \"\";\n    private Float\
  \ result = 0F;\n    private MutableLiveData<Float> result = new MutableLiveData<>();\n\
  \n    public void setAmount(String value) {\n        this.dollarText = value;\n\
  \        result = Float.valueOf(dollarText)*usd_to_eu_rate;\n    }\n\n    public\
  \ Float getResult()\n    {\n        return result;\n    }\n}\n```\n\n既然 `result`\
  \ 变量包含在 `MutableLiveData` 实例中，`setAmount()` 和 `getResult()` 方法都都需要修改。在 `setAmount()`\
  \ 方法中，不能再使用赋值运算符为 `result` 变量赋值。相反，必须调用 `setValue()` 方法并将新值作为参数传递。按照目前的实现，`getResult()`\
  \ 方法被声明为返回 `Float`，现在需要更改为返回 `MutableLiveData` 对象。进行这些更改后，类如下：\n\n```java\npackage\
  \ com.ebookfrenzy.viewmodeldemo.ui.main;\n\nimport androidx.lifecycle.MutableLiveData;\n\
  import androidx.lifecycle.ViewModel;\n\npublic class MainViewModel extends ViewModel\
  \ {\n    private static final Float usd_to_eu_rate = 0.74F;\n    private String\
  \ dollarText = \"\";\n    private Float result = 0F;\n    private MutableLiveData<Float>\
  \ result = new MutableLiveData<>();\n\n    public void setAmount(String value) {\n\
  \        this.dollarText = value;\n        result = Float.valueOf(dollarText)*usd_to_eu_rate;\n\
  \        result.setValue(Float.valueOf(dollarText)*usd_to_eu_rate);\n    }\n\n \
  \   public MutableLiveData<Float> getResult()\n    {\n        return result;\n \
  \   }\n}\n```\n\n## 34.3 实现观察者\n\n现在转换结果包含在 `LiveData` 实例中，下一步是在 UI 控制器中配置观察者，在示例中是\
  \ `MainFragment` 类。找到 `MainFragment.java` 类（app -> java -> `<package name>` -> `MainFragment`），双击它将其加载到编辑器，并修改\
  \ `onActivityCreated()` 方法创建一个名为 `resultObserver` 的新 `Observer` 实例：\n\n```java\n\
  package com.ebookfrenzy.viewmodeldemo.ui.main;\n\nimport androidx.lifecycle.Observer;\n\
  \n@Override\npublic void onActivityCreated(@Nullable Bundle savedInstanceState)\
  \ {\n    dollarText = getView().findViewById(R.id.dollarText);\n    resultText =\
  \ getView().findViewById(R.id.resultText);\n    convertButton = getView().findViewById(R.id.convertButton);\n\
  \    resultText.setText(mViewModel.getResult().toString());\n\n    final Observer<Float>\
  \ resultObserver = new Observer<Float>() {\n        @Override\n        public void\
  \ onChanged(@Nullable final Float result) {\n            resultText.setText(result.toString());\n\
  \        }\n    };\n}\n```\n\n\n\n\n\n`resultObserver` 实例声明了 `onChanged()` 方法，该方法在调用时会接收到当前的结果值，然后将其转换为字符串并显示在\
  \ `result TextView` 对象上。下一步是将观察者添加到 `result LiveData` 对象中，可以通过调用 `ViewModel` 对象的\
  \ `getResult()` 方法获取该对象的引用。由于更新 `result TextView` 的责任现在由 `onChanged()` 回调方法承担，现在可以删除执行此任务的现有代码行：\n\
  \n```java\n@Override\npublic void onActivityCreated(@Nullable Bundle savedInstanceState)\
  \ {\n    super.onActivityCreated(savedInstanceState);\n    mViewModel = new ViewModelProvider(this).get(MainViewModel.class);\n\
  \    dollarText = getView().findViewById(R.id.dollarText);\n    resultText = getView().findViewById(R.id.resultText);\n\
  \    convertButton = getView().findViewById(R.id.convertButton);\n    resultText.setText(mViewModel.getResult().toString());\n\
  \    final Observer<Float> resultObserver = new Observer<Float>() {\n        @Override\n\
  \        public void onChanged(@Nullable final Float result) {\n            resultText.setText(result.toString());\n\
  \        }\n    };\n    mViewModel.getResult().observe(getViewLifecycleOwner(),\
  \ resultObserver);\n    convertButton.setOnClickListener(new View.OnClickListener()\
  \ {\n        @Override\n        public void onClick(View v) {\n            if (!dollarText.getText().toString().equals(\"\
  \")) {\n                mViewModel.setAmount(Float.valueOf(dollarText.getText().toString()));\n\
  \                resultText.setText(mViewModel.getResult().toString());\n      \
  \      } else {\n                resultText.setText(\"No Value\");\n           \
  \ }\n        }\n    });\n}\n```\n\n编译并运行应用，在美元字段中输入一个值，点击 `Convert` 按钮并验证转换后的欧元金额是否显示在\
  \ `TextView` 上。这确认了观察者收到了结果值变化的通知，并调用了 `onChanged()` 方法来显示最新数据。\n\n注意在上述 `onActivityCreated()`\
  \ 方法的实现中，每次调用该方法时负责显示当前结果值的代码行被删除了。最初这样做是为了确保在 `Fragment` 因任何原因被重建时，显示的值不会丢失。由于\
  \ `LiveData` 会监控其观察者的生命周期状态，这一步不再是必要的。当 `LiveData` 检测到 UI 控制器被重建时，它会自动触发任何相关的观察者并提供最新数据。通过在\
  \ `TextView` 对象上显示欧元值时旋转设备并确认该值没有丢失，可以验证这一点。\n\n在进入下一章之前，请关闭项目，复制 `ViewModelDemo`\
  \ 项目文件夹并将其保存为 `ViewModelDemo_LiveData`，以便以后在查看保存 ViewModel 状态时可以使用。\n\n## 34.4 总结\n\
  \n本章演示了如何使用 Android `LiveData` 组件来确保显示给用户的数据始终与存储在 `ViewModel` 中的数据匹配。这个相对简单的过程包括将\
  \ `ViewModel` 数据值封装在 `LiveData` 对象中，并在 UI 控制器中设置一个订阅该 `LiveData` 值的观察者。每当 `LiveData`\
  \ 值发生变化时，观察者就会收到通知，并调用 `onChanged()` 方法，同时传入更新后的值。\n\n在项目添加添加 `LiveData` 支持在很大程度上简化了项目设计。通过使用\
  \ `Data Binding Library`（数据绑定库），还可以实现额外且重大的改进，其细节将在后面的章节中介绍。然而，在此之前，我们将查看如何保存 ViewModel\
  \ 状态。\n\n## 35. Android Jetpack Data Binding 概述\n\n在名为“使用 Jetpack 构建现代 Android 应用架构”的章节中，我们引入了\
  \ Android `Data Binding`（数据绑定）的概念，并简要解释了如何如何将用户界面布局中的视图直接连接到应用中其他对象的方法和数据，而无需编写代码。本章将提供更多关于数据绑定的细节，重点解释如何在\
  \ Android Studio 项目中实现数据绑定。下一章的教程（“Android Jetpack Data Binding 教程”）将提供数据绑定的实际示例。\n\
  \n## 35.1 数据绑定概述\n\n数据绑定支持由 Android Jetpack Data Binding Library 提供，其主要目的是提供一种简单的方法，将用户界面布局中的视图连接到方法。\n\
  \n当数据绑定与 `LiveData` 结合使用时，会变得特别强大。例如，考虑一个绑定到 `ViewModel` 中 `LiveData` 变量的 `EditText`\
  \ 视图。通过这种方式连接后，`ViewModel` 中数据的任何变化将自动显示在 `EditText` 视图中，并且使用双向绑定，输入 `EditText`\
  \ 的任何数据将自动更新 `LiveData` 值。\n\n传统上，将交互式视图（如 `Button` 组件）连接到 UI 控制器中的方法需要开发者编写代码来实现一个监听器方法，该方法在按钮被点击时被调用。数据绑定使得这变得像在布局文件中引用该方法一样简单。\n\
  \n### 35.2 数据绑的关键组件\n\n默认情况下，Android Studio 项目未配置数据绑定。事实上，在应用开始使用数据绑定之前，需要组合许多不同的元素。这些涉及项目构建配置、布局\
  \ XML 文件、数据绑定类以及表达式语言的使用。虽然初初看起来可能有些无从从，但实际上，这些其实是简单的步骤，一旦完成，在节省编码工作量方面是非常值得的。在本章的剩余部分中，将详细介绍这些元素中的每一个。\n\
  \n#### 35.2.1 项目构建配置\n\n在项目可以使用数据绑定之前，必须先配置为使用 Android Data Binding Library，并启用对数据绑定类和表达式语法的支持。幸运的是，这只需要在模块级\
  \ `build.gradle` 文件（项目工具窗口中 Gradle Scripts 下列出的 `build.gradle (Module: app)`）中添加几行即可实现。以下列出了一个启数据绑定的部分构建文件：\n\
  \n```gradle\napply plugin: 'com.android.application'\n\nandroid {\n    compileSdkVersion\
  \ 28\n    buildFeatures {\n        dataBinding = true\n    }\n    defaultConfig\
  \ {\n        applicationId \"com.ebookfrenzy.myapplication\"\n    }\n}\n```\n\n\
  ### 35.2.2 数据绑定布局文件\n\n正如我们在之前的章节中看到的，应用的用户界面通常包含在 XML 布局文件中。在这些布局文件之一中的视图能够利用数据绑定之前，必须先将该布局文件转换为数据绑定布局文件。\n\
  \n\n\n\n\n正如书中早期概述，XML 布局文件定义了布局中组件的层级结构，从顶层视图或根视图开始。通常，此根视图采用布局容器的形式，例如 `ConstraintLayout`、`FrameLayout`\
  \ 或 `LinearLayout` 实例，如 `ViewModelDemo` 项目中的 `main_fragment.xml` 文件：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.constraintlayout.widget.ConstraintLayout\n\
  \    xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:id=\"@+id/main\"\n    android:layout_width=\"match_parent\"\n    android:layout_height=\"\
  match_parent\"\n    tools:context=\".ui.main.MainFragment\">\n.\n.\n</androidx.constraintlayout.widget.ConstraintLayout>\n\
  ```\n\n为了能够使用数据绑定（data binding），布局层级必须有一个布局组件作为根视图，该组件反过来成为当前根视图的父级。在上述示例中，这意味着需要对现有布局文件进行以下更改：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<layout xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  >\n    <androidx.constraintlayout.widget.ConstraintLayout\n        xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n        xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n        xmlns:tools=\"http://schemas.android.com/tools\"\n        android:id=\"\
  @+id/main\"\n        android:layout_width=\"match_parent\"\n        android:layout_height=\"\
  match_parent\"\n        tools:context=\".ui.main.MainFragment\">\n.\n.\n    </androidx.constraintlayout.widget.ConstraintLayout>\n\
  </layout>\n```\n\n### 35.2.3 布局文件 data 元素\n\n数据绑定布局文件需要某种方式来声明项目中的类，布局中的视图将绑定到这些类（例如\
  \ `ViewModel` 或 UI 控制器）。在声明这些类后，布局文件还需要一个变量名称，以便在绑定表达式中引用这些实例。这是通过使用 `data` 元素实现的，如下所示：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<layout xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  >\n    <data>\n        <variable\n            name=\"myViewModel\"\n           \
  \ type=\"com.ebookfrenzy.myapp.ui.main.MainViewModel\" />\n    </data>\n    <androidx.constraintlayout.widget.ConstraintLayout\n\
  \        android:id=\"@+id/main\"\n        android:layout_width=\"match_parent\"\
  \n        android:layout_height=\"match_parent\"\n        tools:context=\".ui.main.MainFragment\"\
  >\n.\n.\n</layout>\n```\n\n上述 `data` 元素声明了一个名为 `myViewModel` 的新变量，类型为 `MainViewModel`（注意，在声明变量时，必须声明\
  \ `MyViewModel` 类的完整包名）。\n\n`data` 元素还可以导入其他类，这些类可以在布局文件的其他地方绑定表达式中引用。例如，如果你有一个类，其中包含在显示给用户之前需要对某个值调用的方法，可以导入该类：\n\
  \n```xml\n<data>\n    <import type=\"com.ebookfrenzy.MyFormatting\"/>\n    <variable\n\
  \        name=\"viewModel\"\n        type=\"com.ebookfrenzy.myapp.ui.main.MainViewModel\"\
  \ />\n</data>\n```\n\n### 35.2.4 绑定类\n\n对于每个包含数据绑定的布局文件，Android Studio 都会生成一个绑定类。该类提供了访问布局中视图的方法。例如，对于\
  \ `activity_main.xml`，生成的类将是 `MainBinding`。\n\n在 `Activity` 中，你如下使用绑定类：\n\n```java\n\
  MainBinding binding = DataBindingUtil.inflate(getLayoutInflater(), R.layout.activity_main,\
  \ null, false);\nsetContentView(binding.getRoot());\n```\n\n在 `Fragment` 中，过程略有不同，使用\
  \ `onCreateView()`：\n\n```java\nbinding = DataBindingUtil.inflate(inflater, R.layout.fragment_main,\
  \ container, false);\nbinding.setLifecycleOwner(getViewLifecycleOwner());\nreturn\
  \ binding.getRoot();\n```\n\n### 35.2.5 数据绑定变量配置\n\n如上所述，数据绑定布局文件包含 `data` 元素，该元素包含由变量名和类类型组成的变量元素。例如：\n\
  \n```xml\n<data>\n    <variable\n        name=\"viewModel\"\n        type=\"com.ebookfrenzy.myapp.ui.main.MainViewModel\"\
  \ />\n    <variable\n        name=\"uiController\"\n        type=\"com.ebookfrenzy.viewdatabinding.MainFragment\"\
  \ />\n</data>\n```\n\n在上述示例中，第一个变量知道它将绑定到 `ViewModel` 的实例，但尚未连接到实际的 `MainViewModel`\
  \ 对象实例。这需要一个额外的步骤，将应用内部使用的 `MainViewModel` 实例赋值给该变量。这是通过调用数据绑定实例的 `setVariable()`\
  \ 方法实现的：\n\n```java\nMainViewModel mViewModel = new ViewModelProvider(this).get(MainViewModel.class);\n\
  binding.setVariable(viewModel, mViewModel);\n```\n\n上述数据元素中的第二个变量引用了 `Fragment`\
  \ 形式的 UI 控制器类。在这种情况下，UI 控制器（无论是 Activity 还是 Fragment）内部的代码只需要将自身赋值给变量即可：\n\n```java\n\
  binding.setVariable(uiController, this);\n```\n\n### 35.2.6 绑定表达式（单向）\n\n绑定表达式定义了特定视图如何与绑定对象交互。例如，`Button`\
  \ 上的绑定表达式可以声明点击时调用对象的哪个方法。或者，绑定表达式可以定义 `ViewModel` 中存储的数据值将显示在 `TextView` 中，以及如何进行展示和格式化。\n\
  \n绑定表达式使用声明式语言，允许使用逻辑以及对其他类和方法的访问来决定如何使用绑定数据。表达式可以包括：数学表达式、方法调用、字符串拼接、数组元素访问和比较操作。此外，所有标准\
  \ Java 语言库都默认导入，因此许多在 Java 中实现的功能也可以在绑定表达式中完成。\n\n\n\n\n\n绑定表达式（binding expression）以\
  \ `@` 符号开头，后跟用大括号 `{}` 包起来的内容。\n\n例如，考虑一个包含名为 `result` 变量的 `ViewModel` 实例。假设该类已赋值给数据绑定布局文件中名为\
  \ `viewModel` 的变量，并且需要绑定到 `TextView` 对象，以便该视图始终显示最新的 `result` 值。如果此值是以 `String`\
  \ 对象的形式存储的，则在布局文件中的声明如下：\n\n```xml\n<TextView\n    android:id=\"@+id/resultText\"\
  \n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"wrap_content\"\
  \n    android:text=\"@{viewModel.result}\"\n    app:layout_constraintBottom_toBottomOf=\"\
  parent\"\n    app:layout_constraintEnd_toEndOf=\"parent\"\n    app:layout_constraintStart_toStartOf=\"\
  parent\"\n    app:layout_constraintTop_toTopOf=\"parent\" />\n```\n\n在上述 XML 中，`text`\
  \ 属性被设置为 `viewModel` 对象中 `result` `LiveData` 属性所包含存储的值。\n\n然而，考虑如果 `result` 在模型中是以\
  \ `Float` 值而不是 `String` 存储。在这种情况下，上述表达式将导致编译错误。显然，在 `TextView` 显示它之前，需要将 `Float`\
  \ 值转换为字符串。为了解决此类问题，绑定表达式可以包含使用标准 Java 语言类完成转换所需的步骤：\n\n```xml\nandroid:text=\"@{String.valueOf(viewModel.result)}\"\
  \n```\n\n在进行此更改后运行应用时，需要注意 Android Studio 控制台中可能会出现警告：\n\n`warning: myViewModel.result.getValue()\
  \ is a boxed field but needs to be un-boxed to execute String.valueOf(viewModel.result.getValue()).`\n\
  \nJava 中的值可以以原始值的形式（如 `boolean` 类型，称为未装箱）或包装在 Java 对象（如 `Boolean` 类型）中并通过该对象的引用进行访问（即装箱）。拆箱过程涉及从对象中拆出原始值。\n\
  \n为了避免此消息，请按照如下所示使用 `safeUnbox()` 调用将引起的操作封装起来：\n\n```xml\nandroid:text=\"@{String.valueOf(safeUnbox(myViewModel.result))}\"\
  \n```\n\n也可以使用字符串拼接。例如，要在结果字符串值后包含单词“dollars”，将使用以下表达式：\n\n```xml\nandroid:text='@{String.valueOf(safeUnbox(myViewModel.result))\
  \ + \" dollars\"}'\n```\n\n注意，由于附加的结果字符串被封装在双引号中，现在表达式本身使用单引号封装，以避免语法错误。\n\n表达式语法还允许声明三元语句。在以下表达式中，视图将根据\
  \ `result` 值是否大于 10 显示不同的文本。\n\n```xml\n@{myViewModel.result > 10 ? \"Out of range\"\
  \ : \"In range\"}\n```\n\n表达式还可以构造用于访问数据数组中的特定元素：\n\n```xml\n@{myViewModel.resultsArray[3]}\n\
  ```\n\n### 35.2.7 绑定表达式（双向）\n\n到目前为止涵盖的表达式类型被称为单向绑定。换句话说，随着相应值的变化，布局会不断更新，但从布局内部对值的更改不会更新存储的值。\n\
  \n另一方面，双向绑定允许数据模型以响应布局的变化而进行更新。例如，`EditText` 视图可以配置双向绑定，这样当用户输入不同的值时，该值将被用于更新对应的数据模型值。在声明双向表达式时，语法与单向表达式相似，区别在于它以\
  \ `@=` 开头。例如：\n\n```xml\nandroid:text=\"@={myViewModel.result}\"\n```\n\n### 35.2.8\
  \ 事件和监听器绑定\n\n绑定表达式还可用于响应视图上的事件来触发方法调用。例如，`Button` 视图可以配置为点击时调用某个方法。在标题为“在 Android\
  \ Studio 中创建一个 Android 应用”的章节中，例如，按钮的 `onClick` 属性被配置为调用应用主 Activity 中名为 `convertCurrency()`\
  \ 的方法。在 XML 文件中，其表示如下：\n\n```xml\nandroid:onClick=\"convertCurrency\"\n```\n\n`convertCurrency()`\
  \ 方法在以下几行中被声明：\n\n```java\npublic void convertCurrency(View view) {\n.\n.\n}\n```\n\
  \n注意，这种类型的方法调用总是会接收一个发生事件的视图的引用。在数据绑定中，可以使用以下表达式实现相同的效果（假设布局已绑定到一个变量名为 `uiController`\
  \ 的类）：\n\n```xml\nandroid:onClick=\"@{uiController::convertCurrency}\"\n```\n\n\
  另一个选项，也是一种提供了向方法传递参数的能力，被称为监听器绑定。以下表达式使用这种方法调用了同一个 `viewModel` 实例上的无参数方法：\n\n```xml\n\
  android:onClick='@{() -> myViewModel.methodOne()}'\n```\n\n以下表达式调用了一个需要三个参数的方法：\n\
  \n```xml\nandroid:onClick='@{() -> myViewModel.methodTwo(viewModel.result, 10, \"\
  A String\")}'\n```\n\n绑定表达式提供了一种丰富且灵活的语言，可以将用户界面视图绑定到其他对象的数据和方法，本章仅涵盖了最常见的用例。要了解更多关于表达式的信息，请查看在线文档：\n\
  \nhttps://developer.android.com/topic/libraries/data-binding/expressions\n\n## 35.3\
  \ 总结\n\nAndroid 数据绑定提供了一种视图与其他对象的数据和方法之间建立连接的方法，无需编写代码。在完成某些配置步骤后，数据绑定只需在布局文件中使用表达式。这些表达式可以是单向或双向的，并用于响应按钮点击等事件。\n\
  \n## 36. Android Jetpack 教程\n\n到目前我们涵盖了现代架构的基本概念，并详细介绍了 `ViewModel` 和 `LiveData`\
  \ 组件。数据绑的概念在之前的章节中也涵盖过，现在将在本章中使用它来进一步修改 `ViewModelDemo` 应用。\n\n## 36.1 冗余代码\n\n\
  如果你还没有这样做，请复制 `ViewModelDemo` 项目文件夹并将其保存为 `ViewModelDemo_LiveData`，以便在后续章节中使用。复制完成后，打开原始的\
  \ `ViewModelDemo` 项目准备实现数据绑定。\n\n在 `ViewModelDemo` 应用中实现数据绑定之前，通过删除项目中不再需要的代码来演示数据绑定的威力。\n\
  \n启动 Android Studio，打开 `ViewModelDemo` 项目，编辑 `MainFragment.java` 文件如下如下：\n\n```java\n\
  package com.ebookfrenzy.viewmodeldemo.ui.main;\n\nimport android.arch.lifecycle.Observer;\n\
  import androidx.lifecycle.ViewModelProvider;\nimport android.os.Bundle;\nimport\
  \ android.support.annotation.NonNull;\nimport android.support.annotation.Nullable;\n\
  import android.support.v4.app.Fragment;\nimport android.view.LayoutInflater;\nimport\
  \ android.view.View;\nimport android.view.ViewGroup;\nimport android.widget.Button;\n\
  import android.widget.EditText;\nimport android.widget.TextView;\nimport com.ebookfrenzy.viewmodeldemo.R;\n\
  \npublic class MainFragment extends Fragment {\n    private MainViewModel mViewModel;\n\
  \    private EditText dollarText;\n    private TextView resultText;\n    private\
  \ Button convertButton;\n\n.\n    @Override\n    public void onActivityCreated(@Nullable\
  \ Bundle savedInstanceState) {\n        super.onActivityCreated(savedInstanceState);\n\
  \        mViewModel = new ViewModelProvider(this).get(MainViewModel.class);\n  \
  \  }\n}\n```\n\n\n\n\n```java\ndollarText = getView().findViewById(R.id.dollarText);\n\
  resultText = getView().findViewById(R.id.resultText);\nconvertButton = getView().findViewById(R.id.convertButton);\n\
  final Observer<Float> resultObserver = new Observer<Float>() {\n    @Override\n\
  \    public void onChanged(@Nullable final Float result) {\n        resultText.setText(result.toString());\n\
  \    }\n};\nmViewModel.getResult().observe(this, resultObserver);\nconvertButton.setOnClickListener(new\
  \ View.OnClickListener() {\n    @Override\n    public void onClick(View v) {\n \
  \       if (!dollarText.getText().toString().equals(\"\")) {\n            mViewModel.setAmount(dollarText.getText().toString());\n\
  \        } else {\n            resultText.setText(\"No Value\");\n        }\n  \
  \  }\n});\n}\n```\n\n接下来，编辑 `MainViewModel.java` 文件并继续按照如下所示删除代码（同时注意 `dollarText`\
  \ 变量转换为 `LiveData`）：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\
  \nimport android.arch.lifecycle.MutableLiveData;\nimport android.arch.lifecycle.ViewModel;\n\
  \npublic class MainViewModel extends ViewModel {\n    private static final Float\
  \ usd_to_eu_rate = 0.74F;\n    public MutableLiveData<String> dollarValue = new\
  \ MutableLiveData<>();\n    private String dollarText = \"\";\n    private public\
  \ MutableLiveData<Float> result = new MutableLiveData<>();\n\n    public void setAmount(String\
  \ value) {\n        this.dollarText = value;\n        result.setValue(Float.valueOf(dollarText)*usd_to_eu_rate);\n\
  \    }\n\n    public MutableLiveData<Float> getResult() {\n        return result;\n\
  \    }\n}\n```\n\n虽然我们在实现数据绑定的过程中会添加几行额外的代码，但显然数据绑定显著减少了需要编写的代码量。\n\n## 36.2 启用数据绑定\n\
  \n使用数据绑定的第一步是在 Android Studio 项目中启用它。这涉及向 Module 级的 `build.gradle` 文件添加一个新属性，因此打开此文件（`app\
  \ -> Gradle Scripts -> build.gradle (Module: ViewModelDemo.app)`），如图 36-1 所示：\n\n\
  ![](img/as_4.1_data_binding_gradle.jpg)\n\n图 36-1\n\n在 `build.gradle` 文件中，添加所示元素以在项目内启用数据绑定：\n\
  \n```gradle\nplugins {\n    id 'com.android.application'\n}\n\nandroid {\n    buildFeatures\
  \ {\n        dataBinding = true\n    }\n    compileSdkVersion 29\n}\n```\n\n一旦添加了该项，编辑器顶部会出现一个带有\
  \ `Sync Now`（立即同步）链接的黄色条。点击此链接以用新的构建配置重新同步项目：\n\n![](img/as_4.1_sync_now.jpg)\n\n\
  图 36-2\n\n## 36.3 添加布局元素\n\n正如“Android 数据绑定概述”所述，为了使用数据绑定，布局层次结构必须有一个 `layout` 组件作为根节点。这需要对\
  \ `main_fragment.xml` 布局（`app -> res -> layout -> main_fragment.xml`）进行以下更改。在布局编辑器中打开此文件，切换到\
  \ Code 模式并进行这些更改：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<layout\
  \ xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <androidx.constraintlayout.widget.ConstraintLayout\n\
  \        android:id=\"@+id/main\"\n        android:layout_width=\"match_parent\"\
  \n        android:layout_height=\"match_parent\"\n        tools:context=\".ui.main.MainFragment\"\
  >\n    </androidx.constraintlayout.widget.ConstraintLayout>\n</layout>\n```\n\n\
  完成这些更改后，切换回 Design 模式，注意新的根视图虽然在布局画布上不可见，但在组件树中列出，如图 36-3 所示：\n\n![](img/as_3.5_databinding_layout.jpg)\n\
  \n图 36-3\n\n编译并运行应用，以验证 `layout` 元素的添加没有改变改变用户界面。\n\n## 36.4 在布局文件中添加数据元素\n\n将布局文件转换为数据绑定布局文件的下一步是添加\
  \ `data` 元素。在本示例中，布局将绑定到 `MainViewModel`，因此编辑 `main_fragment.xml` 文件并如下所示添加 `data`\
  \ 元素：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<layout xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    xmlns:android=\"http://schemas.android.com/apk/res/android\">\n    <data>\n\
  \        <variable\n            name=\"myViewModel\"\n            type=\"com.ebookfrenzy.viewmodeldemo.ui.main.MainViewModel\"\
  \ />\n    </data>\n    <androidx.constraintlayout.widget.ConstraintLayout\n    \
  \    android:id=\"@+id/main\"\n        android:layout_width=\"match_parent\"\n \
  \       android:layout_height=\"match_parent\"\n        tools:context=\".ui.main.MainFragment\"\
  >\n</layout>\n```\n\n编译并运行应用，以确保这些更改生效。\n\n## 36.5 使用绑定类工作\n\n下一步是修改 `MainFragment.java`\
  \ 文件中的代码以获取绑定类实例。最有效的方法是重写 `onCreateView()` 方法：\n\n```java\nimport androidx.databinding.DataBindingUtil;\n\
  import com.ebookfrenzy.viewmodeldemo.databinding.MainFragmentBinding;\n\npublic\
  \ class MainFragment extends Fragment {\n    private MainViewModel mViewModel;\n\
  \    public MainFragmentBinding binding;\n\n    @Nullable\n    @Override\n    public\
  \ View onCreateView(@NonNull LayoutInflater inflater,\n            @Nullable ViewGroup\
  \ container,\n            @Nullable Bundle savedInstanceState) {\n        binding\
  \ = DataBindingUtil.inflate(\n                inflater, R.layout.main_fragment,\
  \ container, false);\n        binding.setLifecycleOwner(this);\n        return binding.getRoot();\n\
  \    }\n```\n\n// 旧代码简单地填充了 `main_fragment.xml` 布局文件（换句话说创建了包含视图对象的布局），并返回根视图（顶层布局容器）。数据绑定库包含一个工具类，提供了一个特殊的膨方法，在构建\
  \ UI 的同时还初始化并返回布局的数据绑定类实例。新代码调用该方法并将绑定类实例存储在变量中：\n\n`binding = DataBindingUtil.inflate(inflater,\
  \ R.layout.main_fragment, container, false);`\n\n绑定对象只需要在 fragment 存在期间保留在内存中。为了确保实例在\
  \ fragment 消失时被销毁，将当前 fragment 声明为绑定对象的生命周期所有：\n\n`binding.setLifecycleOwner(this);`\n\
  \n尽管 `onCreateView()` 方法的代码已被重写，但它返回布局根视图的基本要求没有改变。幸运的是，可以通过调用绑定对象的 `getRoot()`\
  \ 方法获取它：\n\n`return binding.getRoot();`\n\n\n\n\n\n此时，数据绑定已经知道它将绑定到类型为 `MainViewModel`\
  \ 的类实例上，但尚未连接到实际的 `MainViewModel` 对象。这需要一个额外的步骤，将 App 内部使用的 `MainViewModel` 实例赋值给布局文件中声明的\
  \ `viewModel` 变量。由于 ViewModel 的引用是在 `onActivityCreated()` 方法中获取的，因此在该处进行赋值是合理的：\n\
  \n```java\nimport static com.ebookfrenzy.viewmodeldemo.BR.myViewModel;\n\n@Override\n\
  public void onActivityCreated(@Nullable Bundle savedInstanceState) {\n    super.onActivityCreated(savedInstanceState);\n\
  \    mViewModel = new ViewModelProvider(this).get(MainViewModel.class);\n    binding.setVariable(myViewModel,\
  \ mViewModel);\n}\n```\n\n如果 Android Studio 报告 `myViewModel` 未定义，请使用 `Build` ->\
  \ `Make Project` 菜单选项重新构建项目，以强制生成该类。完成这些更改后，下一步是开始在数据绑定布局文件的视图元素中插入绑定表达式。\n\n##\
  \ 36.7 添加绑定表达式\n\n第一个绑定表达式将 `resultText` TextView 绑定到模型视图中的 `result` 值。编辑 `main_fragment.xml`\
  \ 文件，找到 `resultText` 元素并修改 `text` 属性，使元素内容如下：\n\n```xml\n<TextView\n    android:id=\"\
  @+id/resultText\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:text=\"MainFragment\"\n    android:text='@{safeUnbox(myViewModel.result)\
  \ == 0.0 ? \"Enter value\" : String.valueOf(safeUnbox(myViewModel.result)) + \"\
  \ euros\"}'\n    app:layout_constraintBottom_toBottomOf=\"parent\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toTopOf=\"\
  parent\" />\n```\n\n该表达式首先检查 `result` 值当前是否为零，如果是，则显示一条指示用户输入数值的消息。然而，如果结果不为零，则该值转换为字符串与单词“euros”拼接，然后显示给用户。\n\
  \n`result` 值只需要单向绑定，因为布局永远不需要更新存储在 `ViewModel` 中的值。相比之下，`dollarValue` EditText 视图需要使用双向绑定，以便数据模型可以用用户输入的最新值进行更新，并在由于设备旋转等生命周期事件触发时，允许将当前值在视图中重新显示。`dollarText`\
  \ 元素现在声明如下：\n\n```xml\n<EditText\n    android:id=\"@+id/dollarText\"\n    android:layout_width=\"\
  wrap_content\"\n    android:layout_height=\"wrap_content\"\n    android:layout_marginTop=\"\
  96dp\"\n    android:ems=\"10\"\n    android:importantForAutofill=\"no\"\n    android:inputType=\"\
  numberDecimal\"\n    android:text=\"@={myViewModel.dollarValue}\"\n    app:layout_constraintEnd_toEndOf=\"\
  parent\"\n    app:layout_constraintHorizontal_bias=\"0.502\"\n    app:layout_constraintStart_toStartOf=\"\
  parent\"\n    app:layout_constraintTop_toTopOf=\"parent\" />\n```\n\n现在已经添加了这些初始绑定表达式，现在需要编写一个方法，在用户点击\
  \ `Button` 组件时执行转换。\n\n## 36.8 添加转换方法\n\n当点击 `Convert` 按钮时，它将调用 `ViewModel` 上的方法来执行转换计算，并将欧元值存入\
  \ `result` `LiveData` 变量。现在在 `MainViewModel.java` 文件添加此方法：\n\n```java\npublic class\
  \ MainViewModel extends ViewModel {\n    private static final Float usd_to_eu_rate\
  \ = 0.74F;\n    public MutableLiveData<String> dollarValue = new MutableLiveData<>();\n\
  \    public MutableLiveData<Float> result = new MutableLiveData<>();\n    public\
  \ void convertValue() {\n        if ((dollarValue.getValue() != null) &&\n     \
  \       (!dollarValue.getValue().equals(\"\"))) {\n            result.setValue(Float.parseFloat(dollarValue.getValue()))\
  \ * usd_to_eu_rate);\n        } else {\n            result.setValue(0F);\n     \
  \   }\n    }\n}\n```\n\n注意，在没有有效值的情况下，`result` 被赋值为 0。\n\n## 36.9 添加监听器\n\n测试前的最后一步是对\
  \ `Button` 添加监听器绑定以调用 `convertValue()`。再次编辑 `main_fragment.xml` 文件，找到 `convertButton`\
  \ 元素并按如下方式添加 `onClick`：\n\n```xml\n<Button\n    android:id=\"@+id/convertButton\"\
  \n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"wrap_content\"\
  \n    android:layout_marginTop=\"77dp\"\n    android:text=\"Convert\"\n    android:onClick=\"\
  @{() -> myViewModel.convertValue()}\"\n    app:layout_constraintEnd_toEndOf=\"parent\"\
  \n    app:layout_constraintStart_toStartOf=\"parent\"\n    app:layout_constraintTop_toBottomOf=\"\
  @+id/resultText\" />\n```\n\n## 36.10 测试 App\n\n编译并运行 App，测试在 `dollar` 字段中输入值并点击\
  \ `Convert` 按钮是否会在 `TextView` 中显示正确的结果（带有 euros 后），以及当字段为空时是否显示“Enter value”提示。此外，验证用户界面中的信息在设备旋转后是否保留。\n\
  \n## 36.11 总结\n\n本章的主要目标是完成设置项目使用绑定的步骤，并演示单向、双向和监听器绑定表达式的使用。本章提供了一个实际示例，说明了如何结合\
  \ `LiveData` 使用数据绑定来连接用户界面与 App 的后端数据和逻辑，从而减少多少代码编写。\n\n## 37. Android ViewModel\
  \ 保存状态教程\n\n应用状态的保存与恢复是为了在 App 进入后台后，在外观和行为上为用户提供连续性。用户期望从一个 App 切换到另一个 App，并在返回原始\
  \ App 时，发现它处于切换之前的完全相同的状态。\n\n## 37.1 理解 ViewModel 状态保存\n\n如前面的章节所述，ViewModel 为应用开发带来了许多好处，包括在配置更改（如设备旋转）发生时恢复\
  \ UI 状态。要体验这一点，请运行 `ViewModelDemo` App。\n\n\n\n\n运行后，输入一个美元值并将其转换为欧元。在同时显示美元和欧元值的情况下，旋转设备或模拟器，并请注意，一旦应用响应了方向变化，两个值仍然可见的。\n\
  \n遗憾的是，这种行为并不适用于后台应用进程的终止。在应用仍运行状态下，点击设备主页将 `ViewModelDemo` 应用置于后台，然后通过打开 Android\
  \ Studio 中的 `Logcat` 工具窗口并点击如图 37-1 所示的高亮终止（terminate）按钮来终止它（不要点击 Android Studio\
  \ 工具栏上的停止按钮）：\n\n![](img/as_3.5_logcat_terminate.jpg)\n\n图 37-1\n\n一旦应用被终止，返回设备或模拟器并从启动器（launcher）选择该应用（不要直接在\
  \ Android Studio 内部重新运行应用）。一旦应用出现，它的表现就像是刚刚启动一样，之前的美元和欧元值都丢失了。然而，从用户的角度来看，应用仅仅是从后台恢复的，并且本应该仍然包含原始数据。在这种情况下，应用未能提供用户对\
  \ Android 应用所期望的连续性。\n\n## 37.2 实现 ViewModel 状态保存\n\n基本的 ViewModel 状态保存通过引入 ViewModel\
  \ Saved State 库得以实现。该库本质上扩展了 `ViewModel` 类，以支持在后台进程终止及随后的重新启动期间维护状态。\n\n保存状态的关键是\
  \ `SavedStateHandle` 类，它用于保存和恢复 view model 实例的状态。`SavedStateHandle` 对象包含一个键值映射，允许通过引用相应的键对数据值进行保存和恢复。\n\
  \n为了支持保存状态，需要声明不同的 `ViewModel` 子类，在这种情况下，该类应包含一个可以接收 `SavedStateHandle` 实例的构造函数。一旦声明，就可以在创建时包含一个\
  \ `SavedStateViewModelFactory` 对象来创建此类类型的 `ViewModel` 实例。考虑以下摘自标准 ViewModel 声明的代码片段：\n\
  \n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\nimport androidx.lifecycle.ViewModel;\n\
  import androidx.lifecycle.MutableLiveData;\n\npublic class MainViewModel extends\
  \ ViewModel {\n\n.\n.\n\n}\n```\n\n创建此类类实例的代码可能类似于以下：\n\n```java\nprivate MainViewModel\
  \ mViewModel;\n\nmViewModel = new ViewModelProvider(this).get(MainViewModel.class);\n\
  ```\n\n另一方面，旨在支持保存状态的 `ViewModel` 子类需要如下所示声明：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\
  \nimport android.util.Log;\nimport androidx.lifecycle.ViewModel;\nimport androidx.lifecycle.MutableLiveData;\n\
  import androidx.lifecycle.SavedStateHandle;\n\npublic class MainViewModel extends\
  \ ViewModel {\n    private SavedStateHandle savedStateHandle;\n\n    public MainViewModel(SavedStateHandle\
  \ savedStateHandle) {\n        this.savedStateHandle = savedStateHandle;\n    }\n\
  .\n.\n}\n```\n\n当创建上述 `ViewModel` 实例时，必须像如下向 `ViewModelProvider` 类初始化器传递一个 `SavedStateViewModelFactory`\
  \ 实例：\n\n```java\nSavedStateViewModelFactory factory =\n      new SavedStateViewModelFactory(getActivity().getApplication(),this);\n\
  \nmViewModel = new ViewModelProvider(this).get(MainViewModel.class);\n```\n\n##\
  \ 37.3 保存和恢复状态\n\n可以通过将对象或值传递给 `SavedStateHandle` 实例的 `set()` 方法来从 `ViewModel` 内部保存它，并提供在执行检索时用于引用的键字符串：\n\
  \n```java\nprivate static final String NAME_KEY = \"Customer Name\";\n\nsavedStateHandle.set(NAME_KEY,\
  \ customerName);\n```\n\n当与 `LiveData` 对象一起使用，可以使用 `SavedStateHandle` 实例的 `getLiveData()`\
  \ 方法恢复之前保存的值，再次如所示引用相应的键：\n\n```java\nMutableLiveData<String> restoredName = savedStateHandle.getLiveData(NAME_KEY);\n\
  ```\n\n要恢复一个普通的（非 LiveData）对象，只需使用 `SavedStateHandle` 的 `get()` 方法即可：\n\n```java\n\
  String restoredName = savedStateHandle.get(NAME_KEY);\n```\n\n其他有用的 `SavedStateHandle`\
  \ 方法包括：\n\n-   `contains(String key)` - 返回一个布尔值，表示保存的状态是否包含指定键的值。\n-   `remove(String\
  \ key)` - 从保存的状态中移除该值和键。返回被移除的值。\n-   `keys()` - 返回包含在保存状态中的所有键的字符串集合。\n\n## 37.4\
  \ 为 ViewModelDemo 项目添加保存状态支持\n\n在涵盖了 ViewModel 保存状态的基础知识后，可以扩展 `ViewModelDemo` 应用以包含此支持。首先，将在\
  \ \"An Android Jetpack LiveData Tutorial\" 中创建的 `ViewModelDemo_LiveData` 项目加载到 Android\
  \ Studio，打开 `build.gradle` (Module: ViewModelDemo.app) 文件并添加 Saved State 库依赖（如既往常一样检查是否有更新的库版本）：\n\
  \n```gradle\ndependencies {\n.\n.\n    implementation \"androidx.savedstate:savedstate:1.0.0\"\
  \n    implementation \"androidx.lifecycle:lifecycle-viewmodel-savedstate:2.2.0\"\
  \n.\n.\n}\n```\n\n接下来，修改 `MainViewModel.java` 文件，使其构造函数包含一个可以接收 `SavedStateHandle`\
  \ 实例。一旦声明，就可以在创建时包含一个 `SavedStateViewModelFactory` 对象来创建此类类型的 `ViewModel` 实例。考虑以下摘自标准\
  \ ViewModel 声明的代码片段：：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\
  \nimport android.util.Log;\nimport androidx.lifecycle.ViewModel;\nimport androidx.lifecycle.MutableLiveData;\n\
  import androidx.lifecycle.SavedStateHandle;\n\npublic class MainViewModel extends\
  \ ViewModel {\n    private SavedStateHandle savedStateHandle;\n\n    public MainViewModel(SavedStateHandle\
  \ savedStateHandle) {\n        this.savedStateHandle = savedStateHandle;\n    }\n\
  .\n.\n}\n```\n\n当创建上述 `ViewModel` 实例时，必须像如下向 `ViewModelProvider` 类初始化器传递一个 `SavedStateViewModelFactory`\
  \ 实例：\n\n```java\nSavedStateViewModelFactory factory =\n      new SavedStateViewModelFactory(getActivity().getApplication(),this);\n\
  \nmViewModel = new ViewModelProvider(this).get(MainViewModel.class);\n```\n\n接下来，修改\
  \ `MainViewModel.java` 文件，使其构造函数接收并存储 `SavedStateHandle` 实例。同时导入 `androidx.lifecycle.SavedStateHandle`，声明键常量并修改\
  \ `result` 变量，使其现在从保存状态获取值：\n\n```java\npackage com.ebookfrenzy.viewmodeldemo.ui.main;\n\
  \nimport android.util.Log;\nimport androidx.lifecycle.ViewModel;\nimport androidx.lifecycle.MutableLiveData;\n\
  import androidx.lifecycle.SavedStateHandle;\n\npublic class MainViewModel extends\
  \ ViewModel {\n    private static final String RESULT_KEY = \"Euro Value\";\n  \
  \  private static final Float usd_to_eu_rate = 0.74;\n    private String dollarText\
  \ = \"\";\n    private SavedStateHandle savedStateHandle;\n    private MutableLiveData<Float>\
  \ result = new MutableLiveData<>();\n\n    public MainViewModel(SavedStateHandle\
  \ savedStateHandle) {\n        this.savedStateHandle = savedStateHandle;\n     \
  \   result = savedStateHandle.getLiveData(RESULT_KEY);\n    }\n.\n.\n}\n```\n\n\
  留在 `MainViewModel.java` 中，修改 `setAmount()` 方法，在计算新的欧元金额时包含保存结果值的代码：\n\n```java\n\
  public void setAmount(String value) {\n    this.dollarText = value;\n    result.setValue(Float.valueOf(dollarText)*usd_to_eu_rate);\n\
  \    Float convertedValue = Float.valueOf(dollarText)*usd_to_eu_rate;\n    result.setValue(convertedValue);\n\
  \    savedStateHandle.set(RESULT_KEY, convertedValue);\n}\n```\n\n在完成 ViewModel\
  \ 的更改后，打开 `MainFragment.java` 文件并进行以下更改，以便在 ViewModel 创建过程中包含 `Saved State` 工厂实例：\n\
  \n```java\n.\n.\nimport androidx.lifecycle.SavedStateViewModelFactory;\n\n.\n.\n\
  \    @Override\n    public void onActivityCreated(@Nullable Bundle savedInstanceState)\
  \ {\n        super.onActivityCreated(savedInstanceState);\n        SavedStateViewModelFactory\
  \ factory =\n              new SavedStateViewModelFactory(getActivity().getApplication(),this);\n\
  \n        mViewModel = new ViewModelProvider(this).get(MainViewModel.class);\n \
  \   }\n\n.\n.\n```\n\n完成更改后，构建并运行应用进行货币转换。当屏幕 UI 填充了美元和欧元值后，将应用置于后台，从 Logcat 工具窗口终止它，然后从设备或模拟器屏幕重新启动。重启后，之前的货币金额仍然显示在\
  \ TextView 和 EditText 组件中，确认状态已成功保存并恢复。\n\n## 37.5 总结\n\n\n\n\n\n一个设计良好的应用在从后台返回前台时，应该始终向用户呈现相同的状态，无论包含该应用的进程在此期间是否被操作系统终止。在处理\
  \ `ViewModels` 时，可以通过利用 `ViewModel Saved State` 模块来实现这一点。这涉及到修改 `ViewModel` 构造函数以接受一个\
  \ `SavedStateHandle` 实例，该实例反过来可以通过一系列方法调用来保存和恢复数据值。在创建 `ViewModel` 实例时，必须传递一个 `SavedStateViewModelFactory`\
  \ 实例。一旦实现了这些步骤，应用将在进程被后台终止时自动保存和恢复状态。\n\n# 38 使用 Android 生命周期感知组件\n\n早些之前标题为“理解\
  \ Android 应用程序和 Activity 生命周期”的章节描述了如何使用生命周期方法来跟踪 UI 控制器（如 activity 或 fragment）内部生命周期状态的变化。这些方法的主要问题之一是它们将处理生命周期变化的负担转嫁给了\
  \ UI 控制器。从表面上看，这似乎是逻辑上的方法，因为 UI 控制器毕竟是经历状态变化的对象。然而事实是，通常受状态变化影响的代码始终位于应用中的其他类中。这导致\
  \ UI 控制器中出现了复杂的代码，需要响应生命周期状态的变化来管理和操作其他对象。显然，在遵循 Android 架构指南时，这是应该避免的场景。\n\n更清晰且符合逻辑的方法是应用中的对象能够观察其他对象的生命周期状态，并负责对变化采取任何必要的操作。例如，负责跟踪用户位置的类可以观察\
  \ UI 控制器的生命周期状态，并在控制器进入暂停状态时挂位置更新。当控制器进入恢复状态时，重新开始跟踪。这是通过与 Android 架构组件绑定的 `Lifecycle`\
  \ 包中提供的类和接口实现的。\n\n本章将引入使生命感知功能能够构建到 Android 应用中的术语和关键组件。\n\n## 38.1 生命周期感知\n\n\
  如果一个对象能够检测并响应应用内其他对象生命周期状态的变化，则称该对象是生命感知的。某些 Android 组件（以 `LiveData` 为主要示例）已经是生命感知的。还可以通过在类中实现\
  \ `LifecycleObserver` 接口来配置任何类为生命感知对象。\n\n## 38.2 生命周期所有者 (Lifecycle Owners)\n\n\
  生命感知组件只能观察那些作为生命所有者的对象的状态。生命所有者实现 `LifecycleOwner` 接口，并分配一个伴侣 `Lifecycle` 对象，该对象负责存储组件的当前状态并向生命观察者提供状态信息。大多数标准的\
  \ Android Framework 组件（如 activity 和 fragment 类）都是生命所有者。自定义类也可以通过 `LifecycleRegistry`\
  \ 类并实现 `LifecycleObserver` 接口来配置为生命所有者。例如：\n\n```java\npublic class SampleOwner\
  \ implements LifecycleOwner {\n\n    private LifecycleRegistry lifecycleRegistry;\n\
  \n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n    \
  \    super.onCreate(savedInstanceState);\n        lifecycleRegistry = new LifecycleRegistry(this);\n\
  \    }\n\n    @NonNull\n    @Override\n    public Lifecycle getLifecycle() {\n \
  \       return lifecycleRegistry;\n    }\n}\n```\n\n除非生命所有者是另一个生命感知组件的子类，否则该类需要通过通过调用\
  \ `LifecycleRegistry` 类的方法来触发生命周期状态变化。可以使用 `markState()` 方法通过传递新状态值来触发生命周期状态变化：\n\
  \n```java\npublic void resuming() {\n    lifecycleRegistry.markState(Lifecycle.State.RESUMED);\n\
  }\n```\n\n上述调用也将导致对相应的事件处理程序的调用。或者，可以调用 `LifecycleRegistry.handleLifecycleEvent()`\
  \ 方法并传递要触发的生命周期事件（这将导致生命周期状态改变）。例如：\n\n```java\nlifecycleRegistry.handleLifecycleEvent(Lifecycle.Event.ON_START);\n\
  ```\n\n## 38.3 生命周期观察者 (Lifecycle Observers)\n\n为了让生命感知组件能够观察生命所有者的状态，它必须实现 `LifecycleObserver`\
  \ 接口，并包含它需要观察的任何生命周期变化事件的事件监听处理器。\n\n```java\npublic class SampleObserver implements\
  \ LifecycleObserver {\n\n    // 生命周期事件方法写在这里\n}\n```\n\n然后创建此观察者类的实例并将其添加到由 `Lifecycle`\
  \ 对象维护的观察者列表中。\n\n```java\ngetLifecycle().addObserver(new SampleObserver());\n```\n\
  \n如果观察者不再需要跟踪生命周期状态，也可以随时从 `Lifecycle` 对象中移除该观察者。\n\n图 38-1 明了提供生命感知的关键元素之间的关系：\n\
  \n![](img/lifecycle_component_diagram.jpg)\n\n图 38-1\n\n## 38.4 生命周期状态和事件\n\n当生命所有者的状态发生变化时，分配的\
  \ `Lifecycle` 对象将用新状态更新。在任何时刻，生命所有者将处于以下五个状态之一：\n\n- `Lifecycle.State.INITIALIZED`\n\
  - `Lifecycle.State.CREATED`\n- `Lifecycle.State.STARTED`\n- `Lifecycle.State.RESUMED`\n\
  - `Lifecycle.State.DESTROYED`\n\n随着组件在不同状态之间转换，`Lifecycle` 对象将对任何已添加到列表的观察者触发事件。在生命周期观察者内部可以实现以下事件：\n\
  \n- `Lifecycle.Event.ON_CREATE`\n- `Lifecycle.Event.ON_START`\n- `Lifecycle.Event.ON_RESUME`\n\
  - `Lifecycle.Event.ON_PAUSE`\n- `Lifecycle.Event.ON_STOP`\n- `Lifecycle.Event.ON_DESTROY`\n\
  - `Lifecycle.Event.ON_ANY`\n\n在观察者类中使用注解将方法与生命周期事件关联。例如，以下代码配置了观察者中的一个方法，以响应 `ON_RESUME`\
  \ 生命周期事件：\n\n```java\n@OnLifecycleEvent(Lifecycle.Event.ON_RESUME)\npublic void\
  \ onResume() {\n    // 在响应进入恢复状态时执行任务\n}\n```\n\n分配给 `ON_ANY` 事件的方法将为所有生命周期事件调用。此事件类型的方法传递了一个生命所有者的引用和一个事件对象，该对象用于查找当前状态和事件类型。例如，以下方法提取了当前状态和事件名称：\n\
  \n```java\n@OnLifecycleEvent(Lifecycle.Event.ON_ANY)\npublic void onAny(LifecycleOwner\
  \ owner, Lifecycle.Event event) {\n    String currentState = getLifecycle().getCurrentState().name();\n\
  \    String eventName = event.name();\n}\n```\n\n当所有者状态需要达到某个生命周期级别时，也可以使用状态对象的\
  \ `isAtLeast()` 方法：\n\n```java\nif (getLifecycle().getCurrentState().isAtLeast(Lifecycle.State.STARTED))\
  \ {\n\n}\n```\n\n图 38-2 中的流程图说明了生命所有者状态变化的顺序，以及在每个状态转换之间会在观察者触发的生命周期事件：\n\n![](img/android_lifecycle_states_diagram.jpg)\n\
  \n图 38-2\n\n## 38.5 总结\n\n\n\n\n\n本章介绍了生命周期感知的基础知识，以及 Android Jetpack 的 `Android\
  \ Lifecycle` 包中的类和接口。该包包含许多用于创建生命周期所有者（lifecycle owners）、生命周期观察者（lifecycle observers）和生命周期感知组件的类和接口。生命周期所有者被分配了一个\
  \ `Lifecycle` 对象，该对象维护了所有者状态的记录以及一个订阅的观察者列表。当所有者的状态发生变化时，观察者会通过生命周期事件方法通知，以便对变化做出响应。\n\
  \n下一章将创建一个 Android Studio 项目，演示如何使用和创建生命周期感知组件，包括创建生命周期观察者和所有者，以及对生命周期状态变化和事件的处理。\n\
  \n# 39. Android Jetpack 生命周期感知感知教程\n\n上一章概述了生命周期感知，并列勒了在 Android 应用项目中实现该功能的关键类和接口。本章将在此知识的基础上，通过构建一个\
  \ Android Studio 项目，来突出实际运行中的生命周期感知。\n\n## 39.1 创建示例生命周期项目\n\n从欢迎界面选择 `Create New\
  \ Project`（新建项目）快速启动选项，在弹出的新项目对话框中，选择 `Fragment + ViewModel` 模板，然后点击 `Next`（下一步）按钮。\n\
  \n在 `Name` 字段输入 `LifecycleDemo`，并指定包名为 `com.ebookfrenzy.lifecycledemo`。在点击 `Finish`（完成）之前，将\
  \ `Minimum API level`（最低 API 级别）设置为 `API 26: Android 8.0 (Oreo)`，并将 `Language`（语言）菜单设置为\
  \ `Java`。\n\n## 39.2 创建生命周期观察者\n\n如前所述，activity 和碎片已经实现了 `LifecycleOwner` 接口，并准备好被其他对象观察。为了在实践中看到这一点，教程的下一步是向项目添加一个新类，该类能够观察\
  \ `MainFragment` 实例。\n\n要添加新类，在 Project 工具窗口右键点击 `app` -> `java` -> `com.ebookfrenzy.lifecycledemo`，从结果菜单中选择\
  \ `New` -> `Java Class...`。在 `New Class` 对话框中，将类命名为 `DemoObserver` 并按键盘的回车键创建 `DemoObserver.java`\
  \ 文件。新文件将自动在编辑器中打开，其内容如下：\n\n```\npackage com.ebookfrenzy.lifecycledemo;\n\npublic\
  \ class DemoObserver {\n\n}\n```\n\n留在编辑器中，修改类文件以声明它将实现 `LifecycleObserver` 接口：\n\
  \n```java\npackage com.ebookfrenzy.lifecycledemo;\n\nimport androidx.lifecycle.LifecycleObserver;\n\
  \npublic class DemoObserver implements LifecycleObserver {\n\n}\n```\n\n下一步是添加生命周期方法并将它们分配为生命周期事件处理器。出于本示例的考虑，所有事件都将被处理，每个事件都会向\
  \ Logcat 面板输出一条显示事件类型的消息。按照下面的列表更新观察者类：\n\n```java\npackage com.ebookfrenzy.lifecycledemo;\n\
  \nimport android.util.Log;\n\nimport androidx.lifecycle.Lifecycle;\nimport androidx.lifecycle.LifecycleObserver;\n\
  import androidx.lifecycle.LifecycleOwner;\nimport androidx.lifecycle.OnLifecycleEvent;\n\
  \npublic class DemoObserver implements LifecycleObserver {\n    private String LOG_TAG\
  \ = \"DemoObserver\";\n\n    @OnLifecycleEvent(Lifecycle.Event.ON_RESUME)\n    public\
  \ void onResume() {\n        Log.i(LOG_TAG, \"onResume\");\n    }\n\n    @OnLifecycleEvent(Lifecycle.Event.ON_PAUSE)\n\
  \    public void onPause() {\n        Log.i(LOG_TAG, \"onPause\");\n    }\n\n  \
  \  @OnLifecycleEvent(Lifecycle.Event.ON_CREATE)\n    public void onCreate() {\n\
  \        Log.i(LOG_TAG, \"onCreate\");\n    }\n\n    @OnLifecycleEvent(Lifecycle.Event.ON_START)\n\
  \    public void onStart() {\n        Log.i(LOG_TAG, \"onStart\");\n    }\n\n  \
  \  @OnLifecycleEvent(Lifecycle.Event.ON_STOP)\n    public void onStop() {\n    \
  \    Log.i(LOG_TAG, \"onStop\");\n    }\n\n    @OnLifecycleEvent(Lifecycle.Event.ON_DESTROY)\n\
  \    public void onDestroy() {\n        Log.i(LOG_TAG, \"onDestroy\");\n    }\n\
  }\n```\n\n为了能够跟踪与碎片当前状态相关的事件，还将添加一个 `ON_ANY` 事件处理器。由于该方法传递了生命周期所有者的引用，因此可以添加代码来获取当前状态。留在\
  \ `DemoObserver.java` 文件中，添加以下方法：\n\n```java\n@OnLifecycleEvent(Lifecycle.Event.ON_ANY)\n\
  public void onAny(LifecycleOwner owner, Lifecycle.Event event) {\n    Log.i(LOG_TAG,\
  \ owner.getLifecycle().getCurrentState().name());\n}\n```\n\nDemoObserver 类完成后完成后，下一步是将其作为观察者添加。\n\
  \n## 39.3 添加观察者\n\n观察者通过 `Lifecycle` 对象的 `addObserver()` 方法添加到生命周期所有者，该对象的引用通过 `Lifecycle()`\
  \ 方法获取。编辑 `MainFragment` 类并在 `onCreateCreated()` 方法中添加代码：\n\n```java\nimport com.ebookfrenzy.lifecemo.DemoObserver;\n\
  \n@Override\npublic void onActivityCreated(@Nullable Bundle savedInstanceState)\
  \ {\n    super.onActivityCreated(savedInstanceState);\n    mViewModel = new ViewModelProvider(this).get(MainViewModel.class);\n\
  \    getLifecycle().addObserver(new DemoObserver());\n}\n```\n\n观察者创建并添加到生命周期所有者后，应用就可以进行测试了。\n\
  \n## 39.4 测试观察者\n\n由于 `DemoObserver` 类会将诊断信息输出到 Logcat 控制台，如果配置了过滤器将更容易看到输出。运行应用之前，使用之前的步骤为\
  \ `DemoObserver` 标签配置过滤器。\n\n成功启动应用后，Logcat 输出指示以下状态变化和事件：\n\n```\nCREATED\nSTARTED\n\
  RESUMED\n```\n\n在应用运行时，旋转设备以触发碎片的销毁和重建，产生以下输出：\n\n```\nPAUSE\nSTARTED\nCREATED\n\
  DESTROYED\nCREATED\nSTARTED\nRESUMED\n```\n\n在移动本章的下一节之前，花时间将应用输出与上一章的图表进行对比。\n\n\
  ## 39.5 创建生命周期所有者\n\n本章的最后一个任务是创建一个自定义生命周期所有者类，并演示如何在类内部触发事件并修改生命周期状态。\n\n在 Project\
  \ 工具窗口中右键点击 `app` -> `java` -> `com.ebookfrenzy.lifecycledemo` 添加新类，在 `Create Class`\
  \ 对话框中将类命名为 `DemoOwner` 然后按键盘的回车键。将新的 `DemoOwner.java` 文件加载到代码编辑器中，修改如下：\n\n```java\n\
  package com.ebookfrenzy.lifecemo;\n\nimport androidx.lifecycle.Lifecycle;\nimport\
  \ androidx.lifecycle.LifecycleOwner;\nimport androidx.lifecycle.LifecycleRegistry;\n\
  import org.jetbrains.annotations.NotNull;\n\npublic class DemoOwner implements LifecycleOwner\
  \ {\n\n}\n```\n\n该类需要一个用自身引用初始化的 `LifecycleRegistry` 实例，以及一个配置为返回 `LifecycleRegistry`\
  \ 实例的 `getLifecycle()` 方法。声明一个存储 `LifecycleRegistry` 引用的变量、一个初始化 `LifecycleRegistry`\
  \ 实例的构造函数并添加 `getLifecycle()` 方法：\n\n```java\npublic class DemoOwner implements\
  \ LifecycleOwner {\n    private final LifecycleRegistry lifecycleRegistry;\n\n \
  \   public DemoOwner() {\n        lifecycleRegistry = new LifecycleRegistry(this);\n\
  \    }\n\n    @NotNull\n    @Override\n    public Lifecycle getLifecycle() {\n```\n\
  \n\n\n\n\n```java\n    return lifecycleRegistry;\n\n    }\n}\n```\n\n接下来，该类需要向注册表通知生命周期状态的变化。可以通过使用\
  \ `LifecycleRegistry` 对象的 `markState()` 方法标记状态，或者通过使用 `handleLifecycleEvent()` 方法触发生命周期事件来实现。在自定义类中，什么构成状态更改取决于该类的目的。在本示例中，我们将添加一些方法，它们在调用时只需触发生命周期事件：\n\
  \n```java\nprivate LifecycleRegistry lifecycleRegistry;\n\n    public void startOwner()\
  \ {\n        lifecycleRegistry.handleLifecycleEvent(Lifecycle.Event.ON_START);\n\
  \    }\n\n    public void stopOwner() {\n        lifecycleRegistry.handleLifecycleEvent(Lifecycle.Event.ON_STOP);\n\
  \    }\n\n    @NotNull\n    @Override\n    public Lifecycle getLifecycle() {\n \
  \       return lifecycleRegistry;\n    }\n```\n\n`DemoOwner` 类中的最后一项改动是添加 `DemoObserver`\
  \ 类作为观察者。该调用将在构造函数中如下所示：\n\n```java\npublic DemoOwner() {\n    lifecycleRegistry\
  \ = new LifecycleRegistry(this);\n    getLifecycle().addObserver(new DemoObserver());\n\
  }\n```\n\n将 `MainFragment.java` 文件加载到代码编辑器中，找到 `onActivityCreated()` 方法并添加代码创建 `DemoOwner`\
  \ 类的实例，并调用 `startOwner()` 和 `stopOwner()` 方法。请注意，添加 `DemoObserver` 作为观察者的调用已被移除。虽然一个观察者可以与多个所有者配合使用，但在在本例中将其移除是为了以避免在\
  \ Logcat 工具窗口中出现重复且混淆的输出：\n\n```java\nimport com.ebookfrenzy.lifecycledemo.DemoOwner;\n\
  \nprivate DemoOwner demoOwner;\n\n@Override\npublic void onActivityCreated(@Nullable\
  \ Bundle savedInstanceState) {\n    super.onActivityCreated(savedInstanceState);\n\
  \    mViewModel = new ViewModelProvider(this).get(MainViewModel.class);\n    demoOwner\
  \ = new DemoOwner();\n    demoOwner.startOwner();\n    demoOwner.stopOwner();\n\
  \    getLifecycle().addObserver(new DemoObserver());\n}\n```\n\n## 39.6 测试自定义生命周期\
  \ Owner\n\n最后一次构建并运行应用，参考 `Logcat` 工具窗口并确认观察者按照以下顺序检测到创建、启动和停止生命周期事件：\n\n- `onCreate`\n\
  - `CREATED`\n- `onStart`\n- `STARTED`\n- `onStop`\n- `CREATED`\n\n注意，尽管没有在 `DemoOwner`\
  \ 类中添加代码来手动执行，但“created”状态更改仍被触发了。事实上，这些更改是在所有者实例首次创建时以及随后处理 `ON_STOP` 事件时自动触发的。\n\
  \n## 39.7 总结\n\n本章为在 Android 应用中实现生命周期感知所需的步骤提供了实际演示。这包括生命周期观察者的创建以及基础生命周期所有者类的设计与实现。\n\
  \n## 40. 导航架构组件概述\n\n如今很少有 Android 应用仅由单个屏幕组成。事实上，大多数应用包含多个屏幕，用户通过屏幕手势、按钮点击和菜单选择在屏幕之间进行导航。在引入\
  \ Android Jetpack 之前，应用内的导航实现很大程度上是一个手动编码过程，没有简单的方法来查看和组织可能复杂的导航路径。然而，随着 Android\
  \ 导航架构组件的引入以及 Android Studio 对导航图的支持，这种情况得到了显著改善。\n\n## 40.1 理解导航\n\n每个应用都有一个主屏幕，在应用启动以及任何启动屏出现（启动屏是应用加载时临时显示的应用品牌屏幕）之后就会出现。从这个主屏幕开始，用户通常会执行会导致其他屏幕出现的任务。这些屏幕通常以应用内其他\
  \ activity 和 fragment 的形式存在。例如，一个消息应用可能有一个列出当前消息的主屏幕，用户可以从那里导航到另一个屏幕访问联系人列表，或导航到设置屏幕。联系人列表屏幕可能会允许用户导航到其他屏幕，在其中可以添加新用户或更新现有联系人。在图形上，应用的导航图可以像[图\
  \ 40-1]所示表示。\n\n![](img/jetpack_navigation_graph_diagram.jpg)\n\n图 40-1\n\n构成应用的每个屏幕（包括主屏幕）被称为“目的地”（destination），通常是一个\
  \ fragment 或 activity。Android 导航架构使用导航栈来跟踪用户在应用内目的地之间的路径。当应用首次启动时，主屏幕是第一个被放置在栈顶的目的地，并成为当前目的地。当用户导航到另一个目的地时，该屏幕将成为当前目的地并推到主目的地之上的栈中。当用户导航到其他屏幕时，它们也会被推入栈中。[图\
  \ 40-2]显示了用户启动并导航到“添加联系人”屏幕后导航栈的当前状态：\n\n![](img/jetpack_navigation_diagram.jpg)\n\
  \n图 40-2\n\n当用户返回屏幕导航时，每个目的地都会从栈中弹出，直到屏幕再次回到主屏幕。在[图 40-3]中，用户从“添加联系人”屏幕返回，将其从栈中弹出并使联系人列表屏幕成为当前目的地：\n\
  \n![](img/jetpack_stack_pop.jpg)\n\n导航和处理导航栈的操作由 `NavController` 类负责处理。使用导航架构组件为\
  \ Android 项目添加导航是一个简单直接的过程，涉及导航主机（navigation host）、导航图、导航动作以及极少量的用于获取引用并与导航控制器实例进行交互。\n\
  \n## 40.2 声明导航主机\n\n导航主机（navigation host）仅仅是一个特殊的 fragment（`NavHostFragment`），它嵌入到\
  \ activity 的用户界面布局中，作为用户导航的目的地的占位符。例如，[图 40-4]显示了一个典型的 activity 屏幕并突出显示了由导航主机表示的区域：\n\
  \n![](img/jetpack_navhost.jpg)\n\n图 40-4\n\n在 Android Studio 编辑器中，可以通过从调板的容器（Containers）部分拖放实例到\
  \ activity 布局中，或者通过以下方式手动编辑 XML 来放置 XML：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<FrameLayout xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\"\n    android:id=\"@+id/container\"\n    android:layout_width=\"\
  match_parent\"\n    android:layout_height=\"match_parent\"\n    tools:context=\"\
  .MainActivity\" >\n\n    <fragment\n        android:id=\"@+id/demo_nav_host_fragment\"\
  \n        android:name=\"androidx.navigation.fragment.NavHostFragment\"\n      \
  \  android:layout_width=\"match_parent\"\n        android:layout_height=\"match_parent\"\
  \n        app:defaultNavHost=\"true\"\n        app:navGraph=\"@navigation/navigation_graph\"\
  \ />\n\n</FrameLayout>\n```\n\n\n\n\n上述导航宿主片段元素的注意事项包括：在 `name` 属性中对 `NavHostFragment`\
  \ 的引用、将 `defaultNavHost` 设置为 `true` 以及将包含导航图的文件分配给 `navGraph` 属性。\n\n当 Activity\
  \ 启动时，此导航宿主片段将被导航图中指定的首页目的地所替换。当用户在应用屏幕之间导航时，宿主片段将被用于目标地点的相应 Fragment 替换。\n\n##\
  \ 40.3 导航图\n\n导航图是一个 XML 文件，包含了将包含在应用导航中的目的地（destinations）。除了这些目的地，该文件还包含了定义目的地之间导航的导航动作（actions），以及用于从一个目的地传递数据到另一个目的可选参数。Android\
  \ Studio 包含一个导航图编辑器，可以通过可视化方式或手动编辑 XML 来设计图表并实现动作。\n\n图 40-5 显示了设计模式下的 Android Studio\
  \ 导航图编辑器：\n\n![](img/as_4.1_navigation_graph_editor.jpg)\n\n图 40-5\n\n目的地列表 (A)\
  \ 提供了当前图中包含的所有目的地的列表。从列表中选择一个目的地将定位并选中图中对应的目的地（这对于在大型图中定位特定目的地特别有用）。导航图面板 (B) 包含每个目的地的对话框，显示了用户界面布局的表示。在示例示例中，此图包含两个名为\
  \ `mainFragment` 和 `secondFragment` 的目的地。目的地之间的箭头 (C) 代表导航动作的连接。添加动作的方法是将鼠标指针悬停在起点边缘直到出现一个圆圈，然后从该圆圈点击并拖动到目的地。属性面板\
  \ (D) 允许查看和修改当前所选目的地或动作连接的属性。在上方图中，显示了动作的属性。通过点击标记为 E 的按钮并从菜单中选择选项可以添加新目的地。可以选择现有的\
  \ Fragment 或 Activity 作为目的地，也可以创建新的空白 Fragment 目的地。组件树面板 (F) 提供了导航图的层级概览。\n\n通过将编辑器切换到代码（Code）模式，可以查看和修改导航图的底层\
  \ XML。以下 XML 列表表示上方 图 40-5 所示目的地和动作连接的导航图：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<navigation xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\"\n    android:id=\"@+id/navigation_graph\"\n \
  \   app:startDestination=\"@id/mainFragment\">\n    <fragment\n        android:id=\"\
  @+id/mainFragment\"\n        android:name=\"com.ebookfrenzy.navigationdemo.ui.main.MainFragment\"\
  \n        android:label=\"main_fragment\"\n        tools:layout=\"@layout/main_fragment\"\
  \ >\n        <action\n            android:id=\"@+id/mainToSecond\"\n           \
  \ app:destination=\"@id/secondFragment\" />\n    </fragment>\n    <fragment\n  \
  \      android:id=\"@+id/secondFragment\"\n        android:name=\"com.ebookfrenzy.navigationdemo.SecondFragment\"\
  \n        android:label=\"fragment_second\"\n        tools:layout=\"@layout/fragment_second\"\
  \ >\n    </fragment>\n</navigation>\n```\n\n如有必要，导航图也可以拆分为多个文件以改进组织并促进重用。以这种方式结构化，嵌套图会被嵌入到根图中。要创建嵌套图，只需对要嵌套的目的地按\
  \ Shift+点击，在第一个目的地上右键并选择 `Move to Nested Graph -> New Graph`（移动到嵌套图 -> 新图）菜单选项。嵌套图将作为图中的新节点出现。要访问嵌套图，只需双击嵌套图节点将图文件加载到编辑器中。\n\
  \n## 40.4 访问导航控制器\n\n从一个目的地导航到另一个目的地通常是在响应应用内的某种事件（例如按钮点击或菜单选择）而发生的。在触发导航动作之前，代码必须先获取导航控制器实例的引用。这需要调用\
  \ `Navigation` 或 `NavHostFragment` 类的 `findNavController()` 方法。例如，以下代码可以用于访问 Activity\
  \ 的导航控制器。注意，为了使代码生效，Activity 必须包含导航宿主片段：\n\n```java\nNavController controller =\
  \ Navigation.findNavController(activity, R.id.nav_fragment);\n```\n\n在这种情况下，方法传递了\
  \ Activity 的引用和嵌入布局中的 `NavHostFragment` 的 ID。\n\n或者，通过将该视图传递给方法即可识别与任何视图关联的导航控制器：\n\
  \n```java\nButton button = getView().findViewById(R.id.button);\nNavController controller\
  \ = Navigation.findNavController(button);\n```\n\n最后一种选项通过调用 `NavHostFragment` 类的\
  \ `findNavController()` 方法并传递 Fragment 来查找 Fragment 的导航控制器：\n\n```java\nNavController\
  \ controller = NavHostFragment.findNavController(fragment);\n```\n\n## 40.5 触发导航动作\n\
  \n一旦找到导航控制器，可以通过调用控制器的 `navigate()` 方法并传递要执行动作的资源 ID 来触发导航动作。例如：\n\n```java\ncontroller.navigate(R.id.goToList);\n\
  ```\n\n动作的 ID 是在选中动作连接时在导航图编辑器的属性面板中定义的。\n\n## 40.6 传递参数\n\n在导航动作期间，可以使用定义在导航图中的参数从一个目的地传递数据到另一个目的地。参数由名称、类型和可选默认值组成，并可以在\
  \ XML 中手动添加，也可以在图中选择动作或目的地时使用属性面板添加。在 图 40-6 中，例如，声明了一个名为 `contactsCount` 的整数参数，默认值为\
  \ `0`：\n\n![](img/jetpack_navigation_action.jpg)\n\n图 40-6\n\n添加后，参数放置在接收目的地的 XML\
  \ 元素中，例如：\n\n```xml\n<fragment\n    android:id=\"@+id/secondFragment\"\n    android:name=\"\
  com.ebookfrenzy.navigationdemo.SecondFragment\"\n    android:label=\"fragment_second\"\
  \n    tools:layout=\"@layout/fragment_second\" >\n    <argument\n        android:name=\"\
  contactsCount\"\n        android:defaultValue=\"0\"\n        app:type=\"integer\"\
  \ />\n</fragment>\n```\n\n导航架构组件提供了两种在目的地之间传递数据的技术。一种方法是将数据放入一个 `Bundle` 对象中，并在动作期间将其传递给目的地，然后在目的地处对其进行解包并提取参数。\n\
  \n这种特定方法的主要缺点是它不是“类型安全”的。换句话说，如果接收目的地将参数处理为与其声明不同的类型（例如将字符串视为整数），此错误将不会被编译器捕获，并可能在运行时引起问题。\n\
  \n\n\n\n\n更好的选项也是本书所采用的方法是使用 `safeargs`。`safeargs` 是一个用于 Android Studio Gradle 构建系统的插件，它可以自动生成特殊的类，允许以类型安全的方式传递参数。使用\
  \ `safeargs` 传递参数的方法将在下一章中进行描述和演示（“Android Jetpack Navigation 组件教程”）。\n\n## 40.7\
  \ 总结\n\n在 Android 应用用户界面的范围内，`Navigation`（导航）一词指的是用户在不同屏幕之间来回移动的能力。曾经实现非常耗时且难以组织，而\
  \ Android Studio 和导航 架构组件（Navigation Architecture Component）现在让 Android 应用项目中的导航实现和管理变得更容易。\n\
  \n应用中的不同屏幕被称为目的地（destinations），通常由片段（fragments）或活动（activities）表示。所有应用都有一个主页（home\
  \ destination），包括应用首次加载时显示的屏幕。该布局的内容区域被一个导航主机片段（navigation host fragment）取代，当用户导航应用时，该片段会切换为其他目的地片段。导航路径由导航图文件（navigation\
  \ graph）定义，该文件由目的地以及连接它们的操作（actions）以及目的地之间传递的任何参数组成。导航由导航控制器（navigation controllers）处理，它们除了管理导航栈外，还提供了从应用代码启动导航动作的方法。\n\
  \n## 41. Android Jetpack Navigation 组件教程\n\n上一章描述了 Android Jetpack 导航组件以及它如何与 Android\
  \ Studio 的导航图表功能集成，为在 Android 应用屏幕之间实现导航提供了一种简单的方法。在本章中，将创建一个新的 Android Studio 项目，该项目将利用这些导航功能来实现一个包含多个屏幕的示例应用。除了演示\
  \ Android Studio 导航图编辑器的使用外，示例项目还将实现使用类型安全参数在源屏幕和目的地屏幕之间传递数据。\n\n## 41.1 创建 NavigationDemo\
  \ 项目\n\n从欢迎界面选择 `Create New Project`（新建项目）快速启动选项，在生成的新项目对话框中，点击 `Next`（下一步）按钮之前选择\
  \ `Fragment + ViewModel` 模板。\n\n在 `Name`（名称）字段中输入 `NavigationDemo`，并指定 `com.ebookfrenzy.navigationdemo`\
  \ 为包名。在点击 `Finish`（完成）按钮之前，将 `Minimum API level`（最低 API 级别）设置更改 `API 26: Android\
  \ 8.0 (Oreo)`，并将 `Language`（语言）菜单更改为 `Java`。\n\n### 41.2 向构建配置添加导航\n\n新的 Android\
  \ Studio 项目默认不会在构建文件中包含导航组件库。因此，在执行任何其他任务之前，第一步是修改应用级的 `build.gradle` 文件。在项目工具窗口中找到此文件（Gradle\
  \ Scripts -> `build.gradle (Module: NavigationDemo.app)`），双击它将其加载到代码编辑器中，并修改 `dependencies`\
  \ 部分以添加导航库：\n\n```gradle\ndependencies {\n    implementation 'androidx.navigation:navigation-fragment:2.3.0'\n\
  \    implementation 'androidx.navigation:navigation-ui:2.3.0'\n}\n```\n\n注意，自本书出版以来，可能已经发布了这些库的新版本。要识别并使用更高版本的库，请将上述行添加到构建文件中，然后打开\
  \ `Project Structure`（项目结构）对话框（`File -> Project Structure...`）。在 `Project Structure`\
  \ 对话框中，选择 `Suggestions`（建议）选项以显示可用的更新。如果有新的库版本，点击 `Update` 按钮，以在点击 `Apply`（应用）按钮之前确保\
  \ `build.gradle` 文件中使用这些最新版本：\n\n![](img/as_3.4_project_structure_suggestions.jpg)\n\
  图 41-1\n\n在文件中添加导航依赖项后，点击 `Sync Now`（立即同步）链接重新同步项目的构建配置。\n\n### 41.3 创建导航图资源文件\n\
  \n在构建配置中添加导航库后，现在可以将导航图资源文件添加到项目中了。正如“导航架构组件概述”所述概述，这是一个 XML 文件，其中包含了用户可以进行导航的片段和活动，以及执行转换的操作和在目的地之间传递的任何数据。\n\
  \n在 Project 工具窗口中，找到 `res` 文件夹（`app -> res`），右键点击它并选择 `New ->Android Resource File`（新建\
  \ -> Android 资源文件）菜单选项：\n\n![](img/as_3.2_navigation_new_resource_menu.jpg)\n图 41-2\n\
  \n选择菜单项后，将出现 `New Resource File`（新建资源文件）对话框。在此对话框中，将文件命名为 `navigation_graph`，并在点击\
  \ `OK` 按钮创建文件之前，如图 41-3 所示将 `Resource type`（资源类型）菜单更改为 `Navigation`。\n\n![](img/as_3.2_navigation_new_resource_file.jpg)\n\
  图 41-3\n\n导航图资源文件添加到项目后，它将出现在主面板中，准备添加新的目的地。将编辑器切换到 `Code` 模式，并在添加任何目的地之前检查图图的 XML：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<navigation xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    android:id=\"@+id/navigation_graph\">\n</navigation>\n```\n\n在编辑器中切换回 `Design`\
  \ 模式，注意 `Host` 部分显示尚未检测到导航主机片段：\n\n![](img/as_4.1_navigation_hosts.jpg)\n图 41-4\n\
  \n在向导航图添加任何目的地之前，下一步是添加导航主机片段。\n\n### 41.4 声明导航主机\n\n对于本项目，导航主机片段将包含在主活动的用户界面中。这意味着导航图中的目的地片段将出现在由\
  \ `main_activity.xml` 布局占据的内容区域。在项目工具窗口中找到主活动布局文件（`app -> res -> layout -> main_activity.xml`）并将其加载到布局编辑器。\n\
  \n当布局编辑器处于 `Design` 模式时，从 `Palette` 的 `Containers` 部分拖入 `NavHostFragment` 元素并将其到到容器区域，如图\
  \ 41-5 所示：\n\n![](img/as_3.6_add_navfragment.jpg)\n图 41-5\n\n在生成的 `Navigation Graphs`\
  \ 对话框中，选择之前创建的 `navigation_graph.xml` 文件并点击 `OK` 按钮。\n\n在布局中选中新添加 `NavHostFragment`\
  \ 实例，使用 `Attributes` 工具窗口将元素的 ID 更改为 `demo_nav_host_fragment`。\n\n将布局编辑器切换到 `Code`\
  \ 模式并检查 XML 文件。注意编辑器已正确配置 `graph` 属性以引用 `navigation_graph.xml` 文件，并且 `defaultNavHost`\
  \ 属性已设置为 `true`：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<FrameLayout\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:id=\"@+id/container\"\n    android:layout_width=\"match_parent\"\n\
  \    android:layout_height=\"match_parent\"\n    tools:context=\".MainActivity\"\
  \ >\n\n    <fragment\n        android:id=\"@+id/demo_nav_host_fragment\"\n     \
  \   android:name=\"androidx.navigation.fragment.NavHostFragment\"\n        android:layout_width=\"\
  match_parent\"\n        android:layout_height=\"match_parent\"\n        app:defaultNavHost=\"\
  true\" />\n</FrameLayout>\n```\n\n\n\n\n\n```xml\napp:navGraph=\"@navigation/navigation_graph\"\
  \ />\n\n</FrameLayout>\n```\n\n在主 Activity 布局文件中配置了 `NavHostFragment` 后，需要从 `MainActivity.java`\
  \ 类文件中删除一些代码，以防止 Activity 在运行时加载 `main_fragment.xml` 文件。将此文件加载到代码编辑器，找到 `onCreate()`\
  \ 方法并删除负责显示主 fragment 的代码：\n\n```java\n@Override\nprotected void onCreate(Bundle\
  \ savedInstanceState) {\n    super.onCreate(savedInstanceState);\n    setContentView(R.layout.main_activity);\n\
  \    if (savedInstanceState == null) {\n        getSupportFragmentManager().beginTransaction()\n\
  \                .replace(R.id.container, MainFragment.newInstance())\n        \
  \        .commitNow();\n    }\n}\n```\n\n返回 `navigation_graph.xml` 文件并确认已检测到 `NavHostFragment`\
  \ 实例（可能需要关闭并重新打开文件才能显示更改）：\n\n![](img/as_4.1_navigation_host_added.jpg)\n\n插图 41-6\n\
  \n### 41.5 添加导航目的地\n\n现在留在导航图中，是时候添加第一个目的地了。由于项目已经有一个用于第一个屏幕的 fragment（`main_fragment.xml`），它将成为被添加到图中第一个目的地。点击如图\
  \ 41-7 所示的新目的地按钮，来选择或创建目的地：\n\n![](img/as_4.1_navigation_add_destination.jpg)\n\n\
  插图 41-7\n\n选择 `main_fragment` 作为目的地，使其它显示在导航图中：\n\n![](img/as_4.1_navigation_first_fragment_added.jpg)\n\
  \n插图 41-8\n\n位于目的地节点上方的首页图标表示这是起始目的地。这意味着当包含 `NavHostFragment` 的 Activity 创建时，该目的地将是第一个显示的内容。要将起始目的地更改为另一个，请在图中选择该节点并点击工具栏上的主页按钮。\n\
  \n通过将编辑器切换到代码（Code）模式来查看导航图的 XML 内容：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<navigation xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"\
  http://schemas.android.com/tools\"\n    android:id=\"@+id/navigation_graph\"\n \
  \   app:startDestination=\"@id/mainFragment\">\n    <fragment\n        android:id=\"\
  @+id/mainFragment\"\n        android:name=\"com.ebookfrenzy.navigationdemo.ui.main.MainFragment\"\
  \n        android:label=\"main_fragment\"\n        tools:layout=\"@layout/main_fragment\"\
  \ />\n</navigation>\n```\n\n在执行任何导航之前，图至少还需要另一个目的地。这次，将使用导航图编辑器来创建一个新的空白目的地。切换回设计（Design）模式并再次点击新目的地（New\
  \ Destination）按钮，这次从菜单中选择创建新目的地选项。在弹出的对话框中，选择 Fragment（Blank）模板，将新 fragment 命名为\
  \ `SecondFragment`，布局命名为 `fragment_second`，然后点击完成（Finish）按钮。在项目重新构建的短暂等待后，新 fragment\
  \ 将作为另一个目的地出现在图中，如图 41-9 所示：\n\n![](img/as_3.2_navigation_second_destination.jpg)\n\
  \n插图 41-9\n\n### 41.6 设计目的地 fragment 布局\n\n在添加在目的地之间跳转的动作之前，现在是为图中两个目的地 fragment\
  \ 添加一些用户界面组件的好时机。首先，双击 `mainFragment` 目的地，使 `main_fragment.xml` 文件加载到布局编辑器。选择并删除当前的\
  \ `TextView` 小控件，然后将 `Button` 和 `Plain Text EditText` 小控件拖放到布局中，使其看起来像下方的图 41-10\
  \ 所示：\n\n![](img/as_4.1_navigation_demo_ui.jpg)\n\n插图 41-10\n\n一旦视图位置正确，点击工具栏上的推断约束（Infer\
  \ constraints）按钮，为布局添加任何缺失的约束。选择 `EditText` 视图，并使用属性（Attributes）工具窗口删除默认的“Name”文本，并将控件的\
  \ ID 更改为 `userText`。\n\n返回 `navigation_graph.xml` 文件并双击 `secondFragment` 目的地，将 `fragment_second.xml`\
  \ 文件加载到布局编辑器，然后选择并删除默认的 `TextView` 实例。在组件树（Component Tree）面板中，右键点击 `FrameLayout`\
  \ 并选择转换为约束布局（Convert to ConstraintLayout）选项，接受默认设置：\n\n![](img/as_3.2_navigation_layout.jpg)\n\
  \n插图 41-11\n\n使用属性（Attributes）窗口更改 `ConstraintLayout` 的 ID。由于 fragment 的布局现在已转换，拖入一个\
  \ `TextView` 使其位于布局中心，并点击推断约束。在选中 `TextView` 后，将 ID 更改为 `arg`。\n\n### 41.7 向导航图中添加动作\n\
  \n现在目的地已经添加到图中，相应的界面布局也已设计完成，项目现在需要一种方法让用户户从主 fragment 导航到第二个 fragment。这将通过向图中添加动作来实现，随后可以在代码中引用该动作。\n\
  \n要建立一个以主 fragment 为起点、第二个 fragment 为目的地的动作，打开导航图并将鼠标指针悬停在 `mainFragment` 边缘，会出现如图\
  \ 41-12 所示的圆圈：\n\n![](img/as_4.1_navigation_circle.jpg)\n\n插图 41-12\n\n点击圆圈并将线条连接到\
  \ `secondFragment`：\n\n![](img/as_4.1_navigation_connecting.jpg)\n\n插图 41-13\n\n\
  释放线条以建立动作，此时线条将变为箭头，如图 41-14 所示：\n\n![](img/as_4.1_navigation_connected.jpg)\n\n\
  插图 41-14\n\n可以通过删除键删除动作连接。选中箭头后，查看属性（Attributes）窗口中的属性并将 ID 更改为 `mainToSecond`。这是代码中引用动作的\
  \ ID。将编辑器切换到代码模式，注意动作现在包含在：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<navigation xmlns:android=\"http://schemas.android.com/apk/res/android\"\n \
  \   xmlns:app=\"http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    android:id=\"@+id/navigation_graph\"\n    app:startDestination=\"@id/mainFragment\"\
  >\n    <fragment\n        android:id=\"@+id/mainFragment\"\n        android:name=\"\
  com.ebookfrenzy.navigationdemo.ui.main.MainFragment\"\n        android:label=\"\
  main_fragment\"\n        tools:layout=\"@layout/main_fragment\" >\n        <action\n\
  \            android:id=\"@+id/mainToSecond\"\n            app:destination=\"@id/secondFragment\"\
  \ />\n    </fragment>\n    <fragment\n        android:id=\"@+id/secondFragment\"\
  \n        android:name=\"com.ebookfrenzy.navigationdemo.SecondFragment\"\n     \
  \   android:label=\"fragment_second\"\n        tools:layout=\"@layout/fragment_second\"\
  \ />\n</navigation>\n```\n\n### 41.8 实现 OnFragmentInteractionListener\n\n\n\n\n\n\
  在添加触发操作的代码之前，需要修改 `MainActivity` 类以实现 `OnFragmentInteractionListener` 接口。该接口是在导航图编辑器中创建空白碎片时，在\
  \ `SecondFragment` 类中生成的。为了符合该接口，activity 需要实现一个名为 `onFragmentInteraction()` 的方法，该方法用于实现碎片与\
  \ activity 之间的通信。\n\n编辑 `MainActivity.java` 文件并将其修改为如下内容所示：\n\n```java\nimport android.net.Uri;\n\
  \npublic class MainActivity extends AppCompatActivity implements SecondFragment.OnFragmentInteractionListener\
  \ {\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n\
  \        super.onCreate(savedInstanceState);\n        setContentView(R.layout.main_activity);\n\
  \    }\n\n    @Override\n    public void onFragmentInteraction(Uri uri) {\n    }\n\
  }\n```\n\n如果 Android Studio 报告 `OnFragmentInteractionListener` 未定义（某些 Android Studio\
  \ 版本会自动添加它，而某些则不会），请编辑 `SecondFragment.java` 文件并如下所示添加：\n\n```java\nimport android.net.Uri;\n\
  \npublic interface OnFragmentInteractionListener {\n    // TODO: Update argument\
  \ type and name\n    void onFragmentInteraction(Uri uri);\n}\n```\n\n## 41.9 触发操作\n\
  \n现在操作已经添加到导航图中，下一步是在主碎片中添加一些代码，以便在点击 `Button` 控件时触发该操作。找到 `MainFragment.java` 文件，将其加载到代码编辑器中并修改\
  \ `onActivityCreated()` 方法，获取按钮实例的引用，并配置一个 `onClickListener` 实例以便在用户点击按钮时调用：\n\n\
  ```java\nimport android.widget.Button;\nimport androidx.navigation.Navigation;\n\
  \npublic class MainFragment extends Fragment {\n\n    @Override\n    public void\
  \ onActivityCreated(@Nullable Bundle savedInstanceState) {\n        super.onActivityCreated(savedInstanceState);\n\
  \        mViewModel = new ViewModelProvider(this).get(MainViewModel.class);\n  \
  \      Button button = getView().findViewById(R.id.button);\n        button.setOnClickListener(new\
  \ View.OnClickListener() {\n            @Override\n            public void onClick(View\
  \ view) {\n                Navigation.findNavController(view).navigate(\n      \
  \              R.id.mainToSecond);\n            }\n        });\n    }\n}\n```\n\n\
  上述代码获取了导航控制器的引用，并在该实例上调用了 `navigate()` 方法，将导航操作的资源 ID 作为参数传递。\n\n编译并运行应用，验证点击主碎片中的按钮是否跳转到第二个碎片。\n\
  \n作为这种设置监听器方法的替代方案，`Navigation` 类还包含一个名为 `createNavigateOnClickListener()` 的方法，它提供了一种更高效的方法来设置监听器并导航到目的地。因此，可以使用以下单行代码来实现相同的结果并启动跳转：\n\
  \n```java\nbutton.setOnClickListener(Navigation.createNavigateOnClickListener(\n\
  \    R.id.mainToSecond, null));\n```\n\n## 41.10 使用 Safeargs 传递数据\n\n本教程的下一个目标是将主碎片中\
  \ `EditText` 视图输入的文本传递给第二个碎片，并在那里将其显示在 `TextView` 控件上。如上一章所述，Android Navigation\
  \ 组件支持两种传递数据的方法。本章将使用类型安全的参数传递。\n\n使用 `safeargs` 的第一步是在 Gradle 构建配置中添加 `safeargs`\
  \ 插件。使用项目（Project）工具窗口，找到并编辑项目级 `build.gradle` 文件（Gradle Scripts -> `build.gradle\
  \ (Project: NavigationDemo)`），如下所示将插件添加到依赖项中（再次记住，现在可能有更新版本可用）：\n\n```gradle\nbuildscript\
  \ {\n    repositories {\n        google()\n        jcenter()\n    }\n    dependencies\
  \ {\n        classpath 'com.android.tools.build:gradle:4.1.9'\n        classpath\
  \ \"androidx.navigation:navigation-safe-args-gradle-plugin:2.3.0\"\n    }\n}\n```\n\
  \n接下来，编辑应用级 `build.gradle`（Gradle Scripts -> `build.gradle (Module: App)`）以应用插件并同步项目：\n\
  \n```gradle\nplugins {\n    id 'com.android.application'\n    id 'androidx.navigation.safeargs'\n\
  }\n```\n\n下一步是定义将被接收的任何参数。编辑导航图，选择 `secondFragment` 目的地并找到 `Arguments` 部分。点击 `+`\
  \ 按钮添加新参数。点击 `+` 按钮后，会弹对话框，需要在其中输入参数名称、类型和默认值。将参数命名为 `message`，将类型设置为 `String`，并在默认值中输入\
  \ `No Message`：\n\n```xml\n<fragment\n    android:id=\"@+id/secondFragment\"\n \
  \   android:name=\"com.frenzy.navigation.SecondFragment\"\n    android:label=\"\
  fragment_second\"\n    tools:layout=\"@layout/fragment_second\">\n    <argument\n\
  \        android:name=\"message\"\n        app:argType=\"string\"\n        android:defaultValue=\"\
  No Message\" />\n</fragment>\n```\n\n下一步是在 `MainFragment.java` 中添加代码，从 `EditText`\
  \ 提取文本并在导航操作期间将其传递给第二个碎片。这将涉及使用由 `safeargs` 插件生成的特殊导航类。目前导航涉及 `MainFragment` 类、`SecondFragment`\
  \ 类、名为 `mainToSecond` 的操作以及名为 `message` 的参数。\n\n当项目构建时，`safeargs` 插件将生成以下额外的类，用于在导航期间传递和接收参数：\n\
  \n- `MainFragmentDirections`：该类代表操作的起点（使用导航源类的名称并在结尾加上 \"Directions\" 命名），并提供对操作对象的访问。\n\
  - `ActionMainToSecond`：执行跳转的操作类（根据导航图文件中分配给操作的 ID 命名，并带有前缀 \"Action\"）。该类包含为目的地配置的每个参数的设置方法。例如，由于第二个碎片碎片包含名为\
  \ `message` 的参数，该类包含一个名为 `setMessage()` 的方法。一旦配置完成，该实例将被传递给导航控制器的 `navigate()` 方法以导航到目的地。\n\
  - `SecondFragmentArgs`：用于目的地碎片中访问从起点传递的参数的类（使用导航目的类的名称并在结尾加上 \"Args\"）。该类包含传递到目的地的每个参数的访问方法（即\
  \ `getMessage()`）。\n\n使用这些类，可以对 `MainFragment.java` 文件中 `onActivityCreated()` 方法内的\
  \ `onClickListener` 代码进行修改，以提取 `EditText` 控件中的当前文本，将其应用于操作并启动到第二个碎片的跳转：\n\n```java\n\
  import android.widget.EditText;\n\n// ... inside onClick\nEditText editText = getView().findViewById(R.id.editText);\n\
  String message = editText.getText().toString();\nAction action = MainFragmentDirections.actionMainToSecond(message);\n\
  Navigation.findNavController(view).navigate(action);\n```\n\n\n\n\n\n```java\nR.id.mainToSecond);\n\
  \nEditText userText = getView().findViewById(R.id.userText);\n\nMainFragmentDirections.MainToSecond\
  \ action =\n    MainFragmentDirections.mainToSecond();\n\naction.setMessage(userText.getText().toString());\n\
  \nNavigation.findNavController(view).navigate(action);\n\n});\n```\n\n上述代码获取 `action`\
  \ 对象的引用，使用 `setMessage()` 方法设置消息参数字符串，然后调用导航控制器的 `navigate()` 方法传递 `action` 对象。如果\
  \ Android Studio 报告 `MainFragmentDirections` 未定义，请使用 `Build -> Make Project` 菜单选项重新构建项目以生成该类。\n\
  \n剩下的工作是修改 `SecondFragment.java` 类文件，以便在导航执行后接收参数并显示在 `TextView` 部件上。对于此示例，将使用 `onStart()`\
  \ 周期方法添加实现这些任务的代码。编辑 `SecondFragment.java` 文件并添加该方法，使其内容如下：\n\n```java\nimport android.widget.TextView;\n\
  \n@Override\npublic void onStart() {\n    super.onStart();\n    TextView argText\
  \ = getView().findViewById(R.id.argText);\n    SecondFragmentArgs args = SecondFragmentArgs.fromBundle(getArguments());\n\
  \    String message = args.getMessage();\n    argText.setText(message);\n}\n```\n\
  \n上述方法代码首先获取 `TextView` 部件的引用。接下来，调用 `SecondFragmentArgs` 类的 `fromBundle()` 方法提取从源端接收到的\
  \ `SecondFragmentArgs` 对象。由于示例中的参数在 `navigation_graph.xml` 文件中命名为 `message`，因此在\
  \ `args` 对象上调用相应的 `getMessage()` 方法来获取字符串值。然后将此字符串显示在 `TextView` 部件上。\n\n编译并运行应用，在点击\
  \ `Button` 部件之前输入一些文本。当第二个 fragment 目标出现时，`TextView` 现在应该显示在主 fragment 中输入的文本，这表明数据已在导航目标之间成功传递。\n\
  \n## 41.11 总结\n\n本章提供了一个关于如何使用导航架构组件（Navigation Architecture Component）结合 Android\
  \ Studio 导航图编辑器实现 Android 应用导航的实际示例。涵盖的主题包括创建包含现有和新目标 fragment 的导航图、在 activity 布局中嵌入导航宿主\
  \ fragment（navigation host fragment）、编写触发导航事件的代码以及使用 Gradle `safeargs` 插件在目标之间传递参数。\n\
  \n## 42. 在 Android 上创建和管理溢出菜单\n\n本书中尚未涵盖的用户界面设计领域之一是 Android 应用中的菜单概念。菜单提供了一种机制，可以在用户界面布局中存在的视图组件之外为用户提供额外的选择。虽然\
  \ Android 开发者可以使用多种不同的菜单系统，但本章将重点介绍更常用的溢出菜单（Overflow menu）。本章将涵盖如何通过 XML 手动以及使用\
  \ Android Studio 布局编辑器工具视觉化地创建菜单。\n\n## 42.1 溢出菜单\n\n溢出菜单（也称为选项菜单）是用户从设备显示器访问的菜单，允许开发者包含应用程序用户界面中包含之外的其他应用程序选项。溢出菜单的位置取决于设备上运行的\
  \ Android 版本。从 Android 4.0 及更高版本开始，溢出菜单按钮位于操作栏（action toolbar）的右上角，由三个堆叠的正方形图标表示：\n\
  \n![](img/Image24251.jpg)\n\n图 42-1\n\n## 42.2 创建溢出菜单\n\n菜单中的项可以在 XML 文件中声明，然后根据需要进行加载（inflate）并显示给用户。这涉及使用\
  \ `<menu>` 元素，每个菜单项包含一个 `<item>` 子元素。例如，以下 XML 定义了一个由两个与颜色选择相关的菜单项组成的菜单：\n\n```xml\n\
  <menu xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    tools:context=\".MainActivity\">\n    <item\n        android:id=\"@+id/menu_red\"\
  \n        android:orderInCategory=\"1\"\n        app:showAsAction=\"never\"\n  \
  \      android:title=\"@string/red\"/>\n    <item\n        android:id=\"@+id/menu_green\"\
  \n        android:orderInCategory=\"2\"\n        app:showAsAction=\"never\"\n  \
  \      android:title=\"@string/green\"/>\n</menu>\n```\n\n在上述 XML 中，`android:id`\
  \ 属性决定了菜单项出现的顺序。另一方面，`app:showAsAction` 属性控制项是否出现在操作栏中。如果设置为 `never`，则项将出现在溢出菜单中。\n\
  \n![](img/Image243.jpg)\n\n图 42-2\n\n此属性应谨慎使用。默认情况下，在创建新的 Android 项目时，Android Studio\
  \ 会创建一个菜单文件。该文件位于 `res -> menu` 文件夹中，包含一个名为“Settings”的单个项：\n\n```xml\n<menu xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"http://schemas.android.com/apk/res-auto\"\
  \n    xmlns:tools=\"http://schemas.android.com/tools\"\n    tools:context=\".MainActivity\"\
  >\n    <item\n        android:id=\"@+id/settings\"\n        android:title=\"@string/settings\"\
  \n        android:orderInCategory=\"100\"\n        app:showAsAction=\"never\"/>\n\
  </menu>\n```\n\n此菜单已配置为在应用运行时用户选择溢出菜单时显示，只需根据需要对其进行修改。\n\n## 42.3 显示溢出菜单\n\n溢出菜单通过重写对应\
  \ activity 的 `OptionsMenu()` 方法并加载菜单的 XML 文件来创建。例如，以下代码创建了名为 `menu_main` 的菜单文件中的菜单：\n\
  \n```java\n@Override\npublic boolean onCreateOptionsMenu(Menu menu) {\n    getMenuInflater().inflate(R.menu.menu_main,\
  \ menu);\n    return true;\n}\n```\n\n与菜单 XML 文件一样，Android Studio 已经在新创建的 Android\
  \ 应用中重写了此方法。如果 activity 不需要溢出菜单，请删除或注释掉此方法。\n\n### 42.4 响应菜单选择\n\n一旦实现了菜单，问题变为应用程序如何在用户做出菜单选择时接收通知。activity\
  \ 接收选择通知唯一需要的是重写 `onOptionsItemSelected()` 方法。作为参数传递给方法的是所选菜单项的引用。可以在该项上调用 `getItemId()`\
  \ 方法来获取 ID，该 ID 可用于识别选中了哪一项。例如：\n\n```java\n@Override\npublic boolean onOptionsItemSelected(MenuItem\
  \ item) {\n    switch (item.getItemId()) {\n        case R.id.menu_red:\n      \
  \      // 红色项被选中\n            return true;\n        case R.id.menu_green:\n    \
  \        // 绿色项被选中\n            return true;\n        default:\n            return\
  \ super.onOptionsItemSelected(item);\n    }\n}\n```\n\n## 42.5 创建可勾选项组\n\n\n\n\n\
  \n除了配置独立的菜单项外，还可以创建菜单组。这在创建可检查的菜单项时特别有用，即在任何时刻从多个选项中选择一个。可以通过将菜单项封装在 `<group>` 标签中将其分配到一个组。使用\
  \ `android:checkableBehavior` 属性将组声明为可检查，将其值设置为 `single`、`all` 或 `none`。以下 XML 声明两个菜单项组成一个组，在任何时刻只能选择其中一项：\n\
  \n```xml\n<menu xmlns:android=\"http://schemas.android.com/apk/res/android\"\n \
  \   xmlns:app=\"http://schemas.android.com/apk/res-auto\">\n    <group android:checkableBehavior=\"\
  single\">\n        <item\n              android:id=\"@+id/menu_red\"\n         \
  \     android:title=\"@string/red_string\"/>\n        <item\n              android:id=\"\
  @+id/menu_green\"\n              android:title=\"@string/green_string\"/>\n    </group>\n\
  </menu>\n```\n\n当菜单组被配置为可检查时，菜单中的项旁边会出现一个小圆圈，如图图 42-3 所示。需要注意的是，此指示器的设置和取消不会自动发生。因此，检查和取消勾选菜单项是应用程序的责任。\n\
  \n![](img/Image2441.jpg)\n图 42-3\n\n继续本章之前使用的颜色示例，其实现方式如下：\n\n```java\n@Override\n\
  public boolean onOptionsItemSelected(MenuItem item) {\n    switch (item.getItemId())\
  \ {\n        case R.id.menu_red:\n            if (item.isChecked()) item.setChecked(false);\n\
  \            else item.setChecked(true);\n            return true;\n        case\
  \ R.id.menu_green:\n            if (item.isChecked()) item.setChecked(false);\n\
  \            else item.setChecked(true);\n            return true;\n        default:\n\
  \            return super.onOptionsItemSelected(item);\n    }\n}\n```\n\n## 42.6\
  \ 菜单与 Android Studio 菜单编辑器\n\nAndroid Studio 允许通过简单将菜单资源文件加载到菜单编辑器工具、从调色板拖放菜单元素并设置属性来视觉化地设计菜单。这极大地简化了菜单设计过程，但必须意识到，仍然需要在\
  \ `onOptionsItemSelected()` 方法中编写代码来实现菜单行为。\n\n要视觉化设计菜单，请找到菜单资源文件并双击它将其加载到菜单编辑器工具。例如，图\
  \ 42-4 显示了在设计模式下加载到菜单编辑器的基础 Activity 菜单资源文件：\n\n![](img/as_4.1_menu_editor.jpg)\n\
  图 42-4\n\n调色板 (A) 包含可以添加到设计区域 (C) 菜单中的项。组件树 (B) 是识别菜单层级结构的有用工具。属性面板 (D) 包含了当前选中项的常用属性的子集。\n\
  \n可以通过将对象拖动到布局画布或组件树上向菜单中添加新元素。在布局编辑器工具中操作菜单时，有时将项丢弃到组件树上会更简单，因为这对该项在树中的放置位置提供了更大的控制。这在某些情况下特别有用，例如向组中添加项时。\n\
  \n尽管菜单编辑器提供了构建菜单的视觉化方法，但底层菜单仍然存储在 XML 格式中，可以通过使用标签 F 切换从设计模式到代码模式来手动查看和编辑。\n\n##\
  \ 42.7 创建示例项目\n\n要查看溢出菜单的操作，从欢迎界面选择 `Create New Project`（新建项目）选项，并在生成的项目对话框中点击 `Next`（下一步）之前选择\
  \ `Basic Activity` 模板。\n\n在 `Name` 字段中输入 `Menu` 并指定 `com.ebookfrenzy.menuexample`\
  \ 为包名。在点击 `Finish`（完成）按钮之前，将最小 API 级别设置为 `API 26: Android 8.0 (Oreo)`，并将语言菜单设置为\
  \ `Java`。\n\n项目创建后，在 Project 窗口中导航到 `app -> res -> layout` 文件夹并双击 `content_main.xml`\
  \ 文件将其加载到 Android Studio 菜单编辑器。将工具切换到设计模式，从组件树面板选择 `ConstraintLayout` 并在属性面板的 ID\
  \ 字段中输入 `layoutView`。\n\n## 42.8 设计菜单\n\n在 Project 窗口中，找到项目的 `app -> res -> menu\
  \ -> menu_main.xml` 文件并双击它将其加载到布局编辑器工具。如有必要，切换到设计模式并选择并删除 Android Studio 添加的默认菜单项，使菜单没有任何项。\n\
  \n从调色板中点击并将菜单组对象拖到布局画布的标题栏上，如图 42-5 所示：\n\n![](img/as_3.6_menu_group.jpg)\n图 42-5\n\
  \n尽管已添加了组项，但它在布局中是不可见的。要验证该元素的存在，请参考组件树，组将作为菜单的子项列出：\n\n![](img/as_4.1_menu_group.jpg)\n\
  图 42-6\n\n在组件树中选择组项，并参考属性面板将 `checkable` 属性设置为 `single`，以便在任何时刻只能选择一个项：\n\n![](img/as_3.4_checkable_setting.jpg)\n\
  图 42-7\n\n接下来，从调色板拖动四个菜单项元素到组元素上。选择第一项并使用属性面板将标题更改为“Red”，并将 ID 更改为 `menu_red`：\n\
  \n![](img/as_3.4_menu_title.jpg)\n图 42-8\n\n对其余三个项重复这些步骤，将标题设置为“Green”、“Yellow”和“Blue”，对应的\
  \ ID 为 `menu_green`、`menu_yellow` 和 `menu_blue`。使用组件树中菜单项右侧的按钮将字符串提取出来：\n\n![](img/as_4.1_menu_tree.jpg)\n\
  图 42-9\n\n完成这些步骤后，菜单布局应与下方图 42-10](#Overflow_Menu.xhtml__idTextAnchor850)所示：\n\n\
  ![](img/Image2498.jpg)\n图 42-10\n\n将布局编辑器切换到代码模式并检查菜单的 XML 表示，应如下：\n\n```xml\n<menu\
  \ xmlns:android=\"http://schemas.android.com/apk/res/android\"\n    xmlns:app=\"\
  http://schemas.android.com/apk/res-auto\"\n    xmlns:tools=\"http://schemas.android.com/tools\"\
  \n    tools:context=\"com.ebookfrenzy.menuexample.MainActivity\">\n    <group android:checkableBehavior=\"\
  single\">\n        <item title=\"@string/red_string\" android:id=\"@+id/menu_red\"\
  />\n        <item title=\"@string/green_string\" android:id=\"@+id/menu_green\"\
  />\n        <item title=\"@string/yellow_string\" android:id=\"@+id/menu_yellow\"\
  />\n        <item title=\"@string/blue_string\" android:id=\"@+id/menu_blue\"/>\n\
  \    </group>\n</menu>\n```\n\n## 42.9 修改 onOptionsItemSelected() 方法\n\n当从菜单中选择项时，应用程序重写的\
  \ `onOptionsItemSelected()` 方法将被调用。该方法的作用是识别选择了哪一项并将布局的背景颜色更改为相应的颜色。找到并双击 `app ->\
  \ java -> com.ebookfrenzy.menuexample -> MainActivity` 文件并按如下方式修改方法：\n\n```java\n\
  package com.ebookfrenzy.menuexample;\n\nimport com.google.android.material.floatingactionbutton.FloatingActionButton;\n\
  import com.google.android.material.snackbar.Snackbar;\nimport androidx.appcompat.app.AppCompatActivity;\n\
  import androidx.appcompat.widget.Toolbar;\n```\n\n\n\n\n\n```java\nimport androidx.constraintlayout.widget.ConstraintLayout;\n\
  \nimport android.view.View;\n\nimport android.view.Menu;\n\nimport android.view.MenuItem;\n\
  \npublic class MainActivity extends AppCompatActivity {\n\n.\n\n.\n\n    @Override\n\
  \    public boolean onOptionsItemSelected(MenuItem item) {\n        ConstraintLayout\
  \ mainLayout =\n                findViewById(R.id.layoutView);\n        switch (item.getItemId())\
  \ {\n            case R.id.menu_red:\n                if (item.isChecked()) item.setChecked(false);\n\
  \                else item.setChecked(true);\n                mainLayout.setBackgroundColor(android.graphics.Color.RED);\n\
  \                return true;\n            case R.id.menu_green:\n             \
  \   if (item.isChecked()) item.setChecked(false);\n                else item.setChecked(true);\n\
  \                mainLayout.setBackgroundColor(android.graphics.Color.GREEN);\n\
  \                return true;\n            case R.id.menu_yellow:\n            \
  \    if (item.isChecked()) item.setChecked(false);\n                else item.setChecked(true);\n\
  \                mainLayout.setBackgroundColor(android.graphics.Color.YELLOW);\n\
  \                return true;\n            case R.id.menu_blue:\n              \
  \  if (item.isChecked()) item.setChecked(false);\n                else item.setChecked(true);\n\
  \                mainLayout.setBackgroundColor(android.graphics.Color.BLUE);\n \
  \               return true;\n            default:\n                return super.onOptionsItemSelected(item);\n\
  \        }\n    }\n\n.\n\n.\n}\n```\n\n## 42.10 测试应用程序\n\n在模拟器或物理 Android 设备上构建并运行应用程序。使用溢出菜单（overflow\
  \ menu），选择菜单项并验证布局背景颜色是否发生了相应的变化。注意，当前选中的颜色将作为菜单中的被选中项显示。\n\n![](img/Image2505.jpg)\n\
  \n图 42-11\n\n## 42.11 总结\n\nAndroid 溢出菜单可以通过运行应用屏幕顶部操作栏的最右侧访问。该菜单为应用程序向用户提供额外选项提供了位置。\n\
  \n菜单结构在 XML 文件中定义最为简单，应用程序活动通过重写并实现 `onOptionsItemSelected()` 方法来接收菜单项选择的通知。\n\n\
  ## 43 MotionLayout 简介\n\n`MotionLayout` 类提供了一种添加动画的简单方法。本章将从 `MotionLayout` 的概述开始，引入\
  \ `MotionScenes` 和关键帧（keyframes）的概念。在涵盖这些基础知识后，接两章（`MotionLayout Tutorial` 和 `Cycle\
  \ Tutorial`）将提供 `MotionLayout` 的更多细节和示例。\n\n## 43.1 MotionLayout 概述\n\n`MotionLayout`\
  \ 是一个容器，其主要目的是将视图从一个状态动画到另一个状态。`MotionLayout` 是 `ConstraintLayout` 的子类，支持所有的 `ConstraintLayout`\
  \ 特性。`MotionLayout` 可以用于将视图从一个状态动画到另一个状态。\n\n## 43.2 到 Motion\n\n\n\n `MotionLayout`\
  \ 可以用于将视图从一个状态动画到另一个状态。`MotionLayout` 可以用于将视图从一个状态动画到另一个状态。`MotionLayout` 可以用于将视图从一个状态动画到另一个状态。`MotionLayout`\
  \ 可以用于将视图从一个状态动画到另一个状态。`MotionLayout` 可以用于将视图从一个状态动画到另一个状态。`MotionLayout` 可以用于将视图从一个状态动画到另一个状态。`MotionLayout`\
  \ 可以用于将视图从一个状态动画到另一个状态。`MotionLayout` 可以用于将视图从一个状态动画到另一个状态。\n\n## 43.3 MotionScene\n\
  \n正如我们在前面的章节中所看到的，一个 XML 文件包含了配置起始和结束 `ConstraintSets` 以及 `Transition` 所需的信息。对于将进行动画的视图，起始、结束状态和过渡存储在名为\
  \ `MotionScene` 的独立 XML 文件中。该文件被导入布局中，并包含用于动画的 `Transition` 元素。\n\n以下列表了 `MotionScene`\
  \ 的模板：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<MotionScene xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:motion=\"http://schemas.android.com/apk/res-auto\"\
  >\n    <Transition motion:constraintSetEnd=\"@+id/end\"\n        motion:constraintSetStart=\"\
  @id/start\"\n        motion:duration=\"1000\">\n        <KeyFrameSet>\n        </KeyFrameSet>\n\
  \    </Transition>\n    <ConstraintSet android:id=\"@+id/start\">\n    </ConstraintSet>\n\
  \    <ConstraintSet android:id=\"@+id/end\">\n    </ConstraintSet>\n</MotionScene>\n\
  ```\n\n## 43.4 配置 ConstraintSets\n\n`MotionScene` 文件中的 `ConstraintSets` 允许在定位、尺寸以及与父视图和其他视图的关系方面将全套\
  \ `ConstraintLayout` 设置应用于视图。此外，以下属性也可以包含在 `ConstraintSet` 声明中：\n\n- `alpha`\n-\
  \ `visibility`\n- `elevation`\n- `rotation`\n- `rotationX`\n- `rotationY`\n- `translationX`\n\
  - `translationY`\n\n\n\n\n\n- `translationZ`\n- `scaleX`\n- `scaleY`\n\n例如，要在动画过程中将视图旋转\
  \ 180°，可以在起始和结束约束中声明以下内容：\n\n```xml\n<ConstraintSet android:id=\"@+id/start\">\n\
  \    <Constraint\n        motion:layout_constraintStart_toStartOf=\"parent\"\n \
  \       android:rotation=\"0\">\n    </Constraint>\n</ConstraintSet>\n\n<ConstraintSet\
  \ android:id=\"@+id/end\">\n    <Constraint\n        motion:layout_constraintBottom_toBottomOf=\"\
  parent\"\n        android:rotation=\"180\">\n    </Constraint>\n</ConstraintSet>\n\
  ```\n\n上述更改告诉 `MotionLayout` 视图将从 0° 开始，然后在动画过程中旋转完整的 180°，最后以倒置的状态停止。\n\n---\n\n\
  ## 43.5 自定义属性 (Custom Attributes)\n\n除了上述列出的标准属性外，还可以指定范围内的自定义属性（使用 `CustomAttribute`\
  \ 声明）。事实上，视图类型上可用的几乎任何属性都可以指定为自定义属性以包含在动画中。要识别属性的名称，请从目标视图类的文档中查找 getter/setter\
  \ 名称，删除 `get/set` 前缀并将剩余的第一个字母转换为小写。例如，在代码中更改 `Button` 视图的背景颜色时，我们可以如下调用 `setBackgroundColor()`\
  \ setter 方法：\n\n```\nmyButton.setBackgroundColor(Color.RED)\n```\n\n在约束集或关键帧中设置此属性时，属性名称将为\
  \ `backgroundColor`。除了属性名称外，值必须使用以下列表中的适当类型：\n\n- `motion:customBoolean` - 布尔属性值。\n\
  - `motion:customColorValue` - 颜色属性值。\n- `motion:customDimension` - 维度属性值。\n- `motion:customFloatValue`\
  \ - 浮点属性值。\n- `motion:customIntegerValue` - 整数属性值。\n- `motion:customStringValue`\
  \ - 字符串属性值。\n\n例如，颜色设置需要使用 `customColorValue` 类型进行赋值：\n\n```xml\n<CustomAttribute\n\
  \    motion:attributeName=\"backgroundColor\"\n    motion:customColorValue=\"#43CC76\"\
  \ />\n```\n\n例如，以下来自 `MotionScene` 文件的片段声明了视图的起始和结束约束，并将背景颜色从绿色改为红色：\n\n```xml\n\
  <ConstraintSet android:id=\"@+id/start\">\n    <Constraint\n        android:layout_width=\"\
  wrap_content\"\n        android:layout_height=\"wrap_content\"\n        motion:layout_editor_absoluteX=\"\
  21dp\"\n        android:id=\"@+id/button\"\n        motion:layout_constraintTop_toTopOf=\"\
  parent\"\n        motion:layout_constraintStart_toStartOf=\"parent\" >\n       \
  \ <CustomAttribute\n            motion:attributeName=\"backgroundColor\"\n     \
  \       motion:customColorValue=\"#33CC33\" />\n    </Constraint>\n</ConstraintSet>\n\
  \n<ConstraintSet android:id=\"@+id/end\">\n    <Constraint\n        android:layout_width=\"\
  wrap_content\"\n        android:layout_height=\"wrap_content\"\n        motion:layout_editor_absoluteY=\"\
  21dp\"\n        android:id=\"@+id/button\"\n        motion:layout_constraintEnd_toEndOf=\"\
  parent\"\n        motion:layout_constraintBottom_toBottomOf=\"parent\" >\n     \
  \   <CustomAttribute\n            motion:attributeName=\"backgroundColor\"\n   \
  \         motion:customColorValue=\"#F80A1F\" />\n</Constraint>\n</ConstraintSet>\n\
  ```\n\n---\n\n## 43.6 触发动画 (Triggering an Animation)\n\n如果没有某种形式的事件告诉 `MotionLayout`\
  \ 开始动画，`MotionScene` 文件中的任何设置都不会产生任何效果（视图将根据起始 `ConstraintSet` 进行定位除外）。\n\n动画可以配置为响应屏幕点击\
  \ (`OnClick`) 或滑动动作 (`OnSwipe`) 来启动。`OnClick` 处理器会导致动画开始并运行到完成，而 `OnSwipe` 则将同步动画，使其沿触触摸运动来回移动。`OnSwipe`\
  \ 处理器还会响应“飞掷”（flinging）动作。`OnSwipe` 处理器还提供了选项，用于配置动画如何对不同方向的拖做出反应，以及滑动附锚的目标视图的侧边。这允许例如通过向左拖动动作移动视图，同时防止向上运动导致视图横向移动（除非这确实是需要的行为）。\n\
  \n`OnSwipe` 和 `OnClick` 声明包含在 `MotionScene` 文件的 `Transition` 元素中。在两种情况下，必须指定视图 ID。例如，要实现一个响应锚定在名为\
  \ `button` 的视图底部的向下动作的 `OnSwipe` 处理器，可以将以下 XML 放在 `Transition` 元素中：\n\n```xml\n\
  <Transition\n    motion:constraintSetEnd=\"@+id/end\"\n    motion:constraintSetStart=\"\
  @id/start\"\n    motion:duration=\"1000\">\n    <KeyFrameSet>\n    </KeyFrameSet>\n\
  \    <OnSwipe\n        motion:touchAnchorId=\"@+id/button\"\n        motion:dragDirection=\"\
  dragDown\"\n        motion:touchAnchorSide=\"bottom\" />\n</Transition>\n```\n\n\
  或者，为同一个按钮添加 `OnClick` 处理器：\n\n```xml\n<OnClick motion:targetId=\"@id/button\"\n\
  \    motion:clickAction=\"toggle\" />\n```\n\n在上面的示例中，动作已设置为 `toggle` 模式。上述模式模式，其他可用选项总结如下：\n\
  \n- `toggle` - 切换到相反状态。例如，如果当前处于起始点，它将切换到结束点。\n- `jumpToStart` - 立即跳转到起始状态。\n- `jumpToEnd`\
  \ - 立即跳转到结束状态。\n- `transitionToStart` - 带动画过渡到起始状态。\n- `transitionToEnd` - 带动画过渡到结束状态。\n\
  \n---\n\n## 43.7 弧线运动 (Arc Motion)\n\n默认情况下，视图位置的将在起始和结束点之间沿直线。要将运动改为弧线路径，只需在起始约束中使用\
  \ `pathMotionArc` 属性，并配置 `startHorizontal` 或 `startVertical` 来定义弧线是凹还是凸的：\n\n```xml\n\
  <ConstraintSet android:id=\"@+id/start\">\n    <Constraint\n        android:layout_width=\"\
  wrap_content\"\n        android:layout_height=\"wrap_content\"\n        motion:layout_editor_absoluteX=\"\
  21dp\"\n        android:id=\"@+id/button\"\n        motion:layout_constraintTop_toTopOf=\"\
  parent\"\n        motion:layout_constraintStart_toStartOf=\"parent\"\n        motion:pathMotionArc=\"\
  startVertical\" />\n</ConstraintSet>\n```\n\n图 43-1 展示了 `startVertical` 和 `startHorizontal`\
  \ 弧与默认直线运动的对比：\n\n![](img/motionlayout_arcMotion_three.jpg)\n\n图 43-1\n\n---\n\n\
  ## 43.8 关键帧 (Keyframes)\n\n到为止概述的所有 `ConstraintSet` 属性仅适用于动画的起始和结束点。换句话说，如果 `rotation`\
  \ 属性在结束点设置为 180°，则旋转将在动画开始时开始并在到达结束点时完成。因此，无法配置旋转在动画进行到 50% 处达到完全 180°，然后在动画结束时旋转回原始方向。幸运的是，这种效果可以通过关键帧来实现。\n\
  \n关键帧用于定义动画过程中发生状态变化的中间点。例如，可以声明关键帧，使视图的背景颜色在动画进行到 50% 处过渡到蓝色，在 75% 处变为绿色，并在动画结束时回到原始颜色。关键帧在\
  \ `MotionScene` 文件的 `Transition` 元素内部实现，嵌入在 `KeyFrameSet` 元素中。\n\nMotionLayout 支持多种类型的关键帧，总结如下：\n\
  \n\n\n\n\n# 43.8.1 属性关键帧 (Attribute Keyframes)\n\n属性关键帧（使用 `KeyAttribute` 声明）允许在动画时间线的中间点更改视图属性。`KeyAttribute`\
  \ 支持上述为 `ConstraintSets` 列出的相同属性集，并可以指定更改在动画时间轴的何位置生效。例如，以下关键帧声明将导致按钮视图在水平（`scaleX`）和垂直（`scaleY`）方向上逐渐增大一倍，在时间轴\
  \ 50% 处达到完全尺寸。在时间轴的剩余时间内，视图的尺寸将缩小到原始尺寸：\n\n```xml\n<Transition\n    motion:constraintSetEnd=\"\
  @+id/end\"\n    motion:constraintSetStart=\"@id/start\"\n    motion:duration=\"\
  1000\">\n    <KeyFrameSet>\n        <KeyAttribute\n              motion:motionTarget=\"\
  @+id/button\"\n              motion:framePosition=\"50\"\n              android:scaleX=\"\
  2.0\" />\n        <KeyAttribute\n              motion:motionTarget=\"@+id/button\"\
  \n              motion:framePosition=\"50\"\n              android:scaleY=\"2.0\"\
  \ />\n    </KeyFrameSet>\n</Transition>\n```\n\n# 43.8.2 位置关键帧 (Position Keyframes)\n\
  \n位置关键帧（`KeyPosition`）用于修改视图在起始位置和结束位置之间移动时遵循的路径。通过在时间轴上的不同点放置关键位置，可以为动画应用任意复杂度的路径。位置使用\
  \ `x` 和 `y` 坐标结合转换时间轴中的相应点来声明。这些坐标必须相对于以下坐标系之一声明：\n\n* `parentRelative`（相对于父级）：`x`\
  \ 和 `y` 坐标相对于指定指定坐标的父容器，以百分比表示（表现为 0.0 到 1.0 之间的值）：\n  ![](img/motionlayout_parentRelative.jpg)\n\
  \  图 43-2\n\n* `deltaRelative`（相对偏移量）：`x` 和 `y` 坐标相对于起始和结束位置，而不是父容器。例如，起点为 (0, 0)，终点为\
  \ (1, 1)。请记住 `x` 和 `y` 坐标可以是负值：\n  ![](img/motionlayout_deltaRelative.jpg)\n  图\
  \ 43-3\n\n* `pathRelative`（相对于路径）：`x` 和 `y` 坐标相对于路径，其中起点和终点之间的直线作为图表的 X 轴。同样，坐标以百分比（0.0\
  \ 到 1.0）表示。这与 `deltaRelative` 坐标空间相似，但考虑了路径的角度。同样，坐标可以是负值：\n  ![](img/motionlayout_pathRelative.jpg)\n\
  \  图 43-4\n\n例如，以下 `ConstraintSets` 声明了设备屏幕两侧的起点和终点。默认情况下，使用这些点的视图过渡将像图 43-5 所示所示，跨越屏幕沿直线移动：\n\
  \  ![](img/motionlayout_straight_path.jpg)\n  图 43-5\n\n然而，假设视图需要遵循类似于下方图 43-6 所示的路径：\n\
  \  ![](img/motionlayout_wave_path.jpg)\n  图 43-6\n\n为了实现这一点，可以在转换内按如下声明关键帧位置点：\n\
  \n```xml\n<KeyPosition\n    motion:motionTarget=\"@+id/button\"\n    motion:framePosition=\"\
  25\"\n    motion:keyPositionType=\"pathRelative\"\n    motion:percentY=\"0.3\"\n\
  \    motion:percentX=\"0.25\"/>\n<KeyPosition\n    motion:motionTarget=\"@+id/button\"\
  \n    motion:framePosition=\"75\"\n    motion:keyPositionType=\"pathRelative\"\n\
  \    motion:percentY=\"-0.3\"\n    motion:percentX=\"0.75\"/>\n```\n\n上述元素使用 `pathRelative`\
  \ 坐标系在路径的 25% 和 75% 处创建了关键帧位置点。第一个位置位于坐标 (0.25, 0.3)，第二个位置位于 (0.75, -0.3)。这些位置关键帧可以像下方图\
  \ 43-7 所示进行可视化：\n  ![](img/motionlayout_curve_path.jpg)\n  图 43-7\n\n# 43.9 时间线性度\
  \ (Time Linearity)\n\n在没有任何额外设置的情况下，上述动画将以恒速执行。为了改变动画速度（例如，使其加速和减速），可以在 `ConstraintSet`\
  \ 或 `Keyframe` 中使用转换缓动属性（`transitionEasing`）。\n\n对于复杂的缓动需求，可以通过在三次贝塞尔曲线（曲线）上绘制点来定义线性度，例如：\n\
  \n```xml\n...\nmotion:layout_constraintBottom_toBottomOf=\"parent\"\nmotion:transitionEasing=\"\
  cubic(0.2, 0.7, 0.3, 1)\"\nandroid:rotation=\"360\"\n...\n```\n\n如果你不熟悉贝塞尔曲线，可以考虑使用以下\
  \ URL 中的在线曲线生成器：[`cubic-bezier.com/`](https://cubic-bezier.com/)\n\n然而，对于大多数需求，可以使用内置标准指定缓动：\n\
  \n```xml\n...\nmotion:layout_constraintBottom_toBottomOf=\"parent\"\nmotion:transitionEasing=\"\
  standard\"\n...\n```\n\n# 43.10 触发器 (KeyTrigger)\n\n关键触发器（`KeyTrigger`）允许在动画到达指定的帧位置时调用视图上的方法。这还考虑了动画的方向。例如，可以根据动画是正向还是反向运行调用不同的方法。假设在动画到达时间轴\
  \ 20% 处时显示按钮，可以在转换中如下使用 `onCross` 属性：\n\n```xml\n<KeyFrameSet>\n    <KeyTrigger\n\
  \          motion:motionTarget=\"@+id/button\"\n          motion:framePosition=\"\
  20\"\n          motion:onCross=\"show\"/>\n</KeyFrameSet>\n```\n\n同样，如果动画反向降至 10%\
  \ 时要隐藏按钮，可以使用 `onNegativeCross` 属性添加第二个触发器：\n\n```xml\n<KeyTrigger\n      motion:motionTarget=\"\
  @+id/button\"\n      motion:framePosition=\"10\"\n      motion:onNegativeCross=\"\
  hide\"/>\n```\n\n如果动画使用切换，只需使用 `onCross` 属性：\n\n```xml\n<KeyTrigger\n      motion:motionTarget=\"\
  @+id/button\"\n      motion:framePosition=\"20\"\n      motion:onCross=\"toggle\"\
  />\n```\n\n# 43.11 循环与时间循环关键帧 (Cycle and Time Cycle Keyframes)\n\n虽然位置关键帧可以用于向动画添加中间更改，但如果需要实现大量重复的位置更改，这将很快变得非常复杂。对于需要执行预测性更改的情况，MotionLayout\
  \ 包含了 `Cycle` 和 `Time Cycle` 关键帧，该主题将在 KeyCycle 教程章节中详细介绍。\n\n# 43.12 从代码启动动画 (Starting\
  \ an Animation from Code)\n\n到目前，我们只查看了使用 `OnSwipe` 和 `OnClick` 处理程序控制动画。也可以通过调用\
  \ `MotionLayout` 实例的方法从代码启动动画。例如，以下代码将以 2000ms 的持续运行名为 `motionLayout` 的布局：\n\n```java\n\
  motionLayout.setTransitionDuration(2000);\nmotionLayout.transitionToEnd();\n```\n\
  \n在没有额外设置的情况下，使用的起始和结束状态将是 `MotionScene` 文件中 `Transition` 声明的状态。要使用特定的起始和结束约束集，只需在调用\
  \ `MotionLayout` 实例的 `setTransition()` 方法时引用它们的 ID 即可：\n\n```java\nmotionLayout.setTransition(R.id.my_transition);\n\
  ```\n\n为了在动画运行时监控状态，如下所示为 `MotionLayout` 实例添加转换监听器：\n\n```java\nmotionLayout.setTransitionListener(transitionListener);\n\
  MotionLayout.TransitionListener transitionListener =\n```\n\n\n\n\n\n```java\nnew\
  \ MotionLayout.TransitionListener() {\n    @Override\n    public void onTransitionStarted(MotionLayout\
  \ motionLayout, int startId, int endId) {\n        // 在过渡开始时被调用\n    }\n\n    @Override\n\
  \    public void onTransitionChange(MotionLayout motionLayout, int startId, int\
  \ endId, float progress) {\n        // 在属性每次变化时调用。跟踪进度值以找到\n        // 当前位置\n  \
  \  }\n\n    @Override\n    public void onTransitionCompleted(MotionLayout motionLayout,\
  \ int currentId) {\n        // 在过渡完成后被调用\n    }\n\n    @Override\n    public void\
  \ onTransitionTrigger(MotionLayout motionLayout, int triggerId, boolean positive,\
  \ float progress) {\n        // 在跨触发关键帧阈值时调用\n    }\n};\n```\n\n# 总结\n\n`MotionLayout`\
  \ 是 `ConstraintLayout` 的一个子类，专门用于为用户界面布局中的视图添加动画效果而设计。`MotionLayout` 的工作原理是通过动画由起始和结束约束集（constraint\
  \ sets）定义的两个状态之间的过渡来实现。通过使用关键帧（keyframes），可以在这些起始和结束点之间添加额外的动画效果。\n\n动画可以通过 `OnClick`\
  \ 或 `OnSwipe` 处理程序触发，也可以通过对 `MotionLayout` 实例调用方法进行编程触发。\n\n# 44. Android MotionLayout\
  \ 编辑器教程\n\n现在已经涵盖了 `MotionLayout` 的基础知识，本章将提供一个在示例项目中尝试 `MotionLayout` 的机会。除了继续探索\
  \ `MotionLayout` 的主要功能外，本章还将介绍 `MotionLayout` 编辑器，并探索如何使用它来视觉化构建和修改 `MotionLayout`\
  \ 动画。\n\n在本章创建的项目将使用起始和结束 `ConstraintSets`、手势处理器以及属性（`Attribute`）和位置关键帧（`Position\
  \ Keyframes`）。\n\n## 44.1 创建 MotionLayoutDemo 项目\n\n从欢迎界面选择“Create New Project”（新建项目）快速启动选项，在生成的新项目对话中，点击“Next”（下一步）按钮之前选择“Empty\
  \ Activity”（空活动）模板。\n\n在“Name”字段中输入 `MotionLayoutDemo`，并指定 `com.ebookfrenzy.motionlayoutdemo`\
  \ 为包名。在点击“Finish”（完成）按钮之前，将 `Minimum API level`（最低 API 级别）设置为 `API 26: Android 8.0\
  \ (Oreo)`，并将“Language”（语言）菜单更改为 `Java`。\n\n## 44.2 ConstraintLayout 转换为 MotionLayout\n\
  \n与 usual，Android Studio 会在 `activity_main.xml` 布局文件中放置一个 `ConstraintLayout` 容器作为父视图。下一步是将此容器转换为\
  \ `MotionLayout` 实例。在“Component Tree”（组件树）中，右键点击 `ConstraintLayout` 项，并选择“Convert\
  \ to MotionLayout”（转换为 MotionLayout）菜单选项：\n\n![](img/as_4.0_motionlayout_conversion.jpg)\n\
  \n图 44-1\n\n做出选择后，点击确认对话框中的“Convert”（转换）按钮。一旦转换完成，`MotionLayout` 编辑器将出现在 Android\
  \ Studio 主窗口中，如图 44-2 所示：\n\n![](img/as_4.0_motionlayout_editor.jpg)\n\n图 44-2\n\
  \n作为转换过程的一部分，Android Studio 还会创建一个名为 `res -> xml` 的新文件夹，并在其中放置一个名为 `activity_main_scene.xml`\
  \ 的 `MotionLayout` 场景文件：\n\n![](img/as_4.0_motionlayout_scene_file.jpg)\n\n图 44-3\n\
  \n该文件由一个顶层 `MotionScene` 元素组成，包含 `ConstraintSet` 和 `Transition` 项，这将定义在主布局中执行的动画。默认情况下，该文件将包含起始和结束约束集的空元素以及初始过渡：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<MotionScene\n    xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    xmlns:motion=\"http://schemas.android.com/apk/res-auto\"\
  >\n    <Transition\n        motion:constraintSetEnd=\"@+id/end\"\n        motion:constraintStart=\"\
  @id/start\"\n        motion:duration=\"1000\">\n        <KeyFrame />\n    </Transition>\n\
  \    <ConstraintSet android:id=\"@+start\"/>\n    <ConstraintSet android:id=\"@+end\"\
  />\n</MotionScene>\n```\n\n对 `MotionLayout` 编辑器做的任何更改都将存储在该文件中。在 `MotionLayout`\
  \ 编辑器中，起始点将是顶部的角。\n\n## 44.3 配置起始和结束约束\n\n加载 `activity_main.xml` 文件后，确保选中了 `MotionLayout`\
  \ 框（如图 44-5 中标记 E 所示），然后在将 `Button` 视图拖放并释放到画布上之前，删除默认的 `TextView`，如图 44-4 所示：\n\
  \n![](img/as_4.1_motionlayout_added.jpg)\n\n图 44-4\n\n在 `Button` 选中的状态下，使用“Attributes”（属性）窗口将\
  \ `id` 更改为 `myButton`。正如上一章所述，`MotionLayout` 动画主要是指定视图如何在两个状态之间切换的用例。实现动画的第一步是指定定义这些状态的约束。对于此示例，起始点将是左上角。要配置这些约束，请在编辑器中选择起始约束项：\n\
  \n![](img/as_4.0_motionlayout_editor_start.jpg)\n\n图 44-6\n\n起始约束集需要将按钮位于布局顶部，带有\
  \ `8dp` 的偏移量并水平居中。在 `myButton` 仍被选中的情况下，使用“Attributes”窗口为视图的顶部、左侧和右侧设置约束：\n\n![](img/as_4.0_motionlayout_start_constraints.jpg)\n\
  \n图 44-7\n\n选择结束约束项（如图 44-5 上方标记为 D 的处），并重复步骤创建一个新约束，这次将按钮放置在布局的水平中心，但距离布局底部有 `8p`\
  \ 的偏移量：\n\n![](img/as_4.0_motionlayout_end_constraints.jpg)\n\n图 44-8\n\n配置好起始和结束约束后，打开\
  \ `activity_main_scene.xml` 文件并注意约束已添加到到文件中。\n\n\n\n\n\n```xml\n<ConstraintSet android:id=\"\
  @+id/start\">\n    <Constraint\n        android:id=\"@+id/myButton\"\n        android:layout_width=\"\
  wrap_content\"\n        android:layout_height=\"wrap_content\"\n        motion:layout_constraintTop_toTopOf=\"\
  parent\"\n        android:layout_marginTop=\"8dp\"\n        motion:layout_constraintStart_toStartOf=\"\
  parent\"\n        motion:layout_constraintEnd_toEndOf=\"parent\" />\n</ConstraintSet>\n\
  <ConstraintSet android:id=\"@+id/end\">\n    <Constraint\n        android:id=\"\
  @+id/myButton\"\n        android:layout_width=\"wrap_content\"\n        android:layout_height=\"\
  wrap_content\"\n        motion:layout_editor_absoluteY=\"6dp\"\n        motion:layout_constraintStart_toStartOf=\"\
  parent\"\n        motion:layout_constraintEnd_toEndOf=\"parent\"\n        motion:layout_constraintBottom_toBottomOf=\"\
  parent\"\n        android:layout_marginBottom=\"8dp\" />\n</ConstraintSet>\n</MotionScene>\n\
  ```\n\n请注意，`Transition` 元素已经预先配置为在 1000 毫秒内对起点和终点之间的过渡进行动画处理。尽管我们还没有添加启动过渡的动作，但仍然可以在\
  \ MotionLayout 编辑器中预览动画。\n\n## 44.4 预览 MotionLayout 动画\n\n要在不构建和运行应用的情况下预览动画，请选择\
  \ MotionLayout 编辑器中下所示 图 44-9 标记为 A 的过渡箭头。这将显示时间线面板（标记为 B）：\n\n![](img/as_4.0_motionlayout_labeled_timeline.jpg)\n\
  \n图 44-9\n\n要测试动画，请点击滑块 (C) 并沿着时间线拖动。随着滑块的移动，布局画布中的按钮将沿着虚线 (D) 移动。使用工具栏按钮 (E) 执行全量动画，或以不同的速度连续重复动画（正向、反向或来回往替）。\n\
  \n## 44.5 添加 OnClick 点击手势\n\n虽然已经创建了一个简单的 `MotionLayout` 动画过渡，但我们仍然需要一种方法从运行的应用内部启动动画。这可以通过分配点击或滑动处理程序来实现。在本例中，我们将配置为在用户点击按钮时启动动画。在\
  \ MotionLayout 编辑器中，如果时间线动画当前处于循环设置并运行，请先暂停它。接下来，选择 `Transition` 箭头（如上方 图 44-9 所示标记为\
  \ A），在属性工具窗口中找到 `OnClick` 属性部分，并点击下所示 图 44-10 中箭头指示的 `+` 按钮：\n\n![](img/as_4.0_motionlayout_onclick_add.jpg)\n\
  \n图 44-10\n\n`OnClick` 面板中为第一个属性出现一个空行。对于属性名，输入 `targetId`，在值字段中输入按钮的 ID `@id/myButton`。再次点击一次\
  \ `+` 按钮，这次在属性名字段中输入 `clickAction`。在值字段中，点击向下箭头显示有效选项菜单：\n\n![](img/as_4.0_motionlayout_onclick_actions.jpg)\n\
  \n图 44-11\n\n在本例中，选择切换动作（toggle action）。这将导致视图在被点击时动画到相反的位置。一旦输入了这些设置，它们应该与 图 44-12\
  \ 中所示的：\n\n![](img/as_4.0_motionlayout_onclick_added.jpg)\n\n图 44-12\n\n再次打开 `activity_main_scene.xml`\
  \ 文件并检查 `Transition` 条目中的 `OnClick` 属性：\n\n```xml\n<Transition\n    motion:constraintSetEnd=\"\
  @+id/end\"\n    motion:constraintSetStart=\"@id/start\"\n    motion:duration=\"\
  1000\">\n    <KeyFrameSet>\n    </KeyFrameSet>\n    <OnClick motion:targetId=\"\
  @id/myButton\"\n    motion:clickAction=\"toggle\" />\n</Transition>\n```\n\n在设备或模拟器上编译并运行应用，确认点击按钮会导致它在\
  \ `MotionScene` 文件中定义的起点和终点之间来回过渡。\n\n## 44.6 为过渡添加属性关键帧\n\n到目前为止，示例项目仅在演示按钮视图从一个位置到另一个位置的运动。属性关键帧（`KeyAttribute`）提供了一种方法，可以在过渡期间指定其他更改生效的点。例如，可以定义一个\
  \ `KeyAttribute`，使得当视图移动到时间线 30% 时，其尺寸必须增  50%。在本例中，我们将添加一个位于中点的旋转效果。\n\n首先，在 MotionLayout\
  \ 编辑器中打开 `activity_main.xml` 文件，选择过渡箭头以显示时间线，然后点击 图 44-13 中高亮显示的按钮：\n\n![](img/as_4.0_motionlayout_timeline_add_key_button.jpg)\n\
  \n图 44-13\n\n从菜单中选择 `KeyAttribute` 选项：\n\n![](img/as_4.0_motionlayout_timeline_add_key_menu.jpg)\n\
  \n图 44-14\n\n一旦选择，将出现如 图 44-15 所示的对话框。在对话框中，确保选中了 ID 选项并引用了 `myButton`。在位置字段中，输入\
  \ 50（这以百分比指定，0 是起点，100 是终点）。最后在点击 `Add` 按钮之前，从 `Attribute` 下拉菜单中选择旋转（rotation）项：\n\
  \n![](img/as_4.0_motionlayout_timeline_key_attr_dialog.jpg)\n\n图 44-15\n\n添加 `KeyAttribute`\
  \ 后，时间线内会出现该属性的一行。点击该行将其高亮，然后点击行最左侧的展开箭头以展开属性过渡图。注意，时间线上出现了一个小的菱形标记（如下方的 图 44-16\
  \ 所示），指示了关键帧的位置。图表表示效果的线性。在这种情况下，按钮将平稳地旋转到指定的角度，在关键帧位置达到最大旋转。当它到达终点时，按钮将旋转回 0 度：\n\
  \n![](img/as_4.0_motionlayout_timeline_graph.jpg)\n\n图 44-16\n\n要更改 `KeyAttribute`\
  \ 的属性，请在时间线上选择它，然后参考属性工具窗口。在 `KeyAttribute` 面板中，将 `rotation` 属性更改为 360 度：\n\n![](img/as_4.0_motionlayout_timeline_key_attr_rotation_angle.jpg)\n\
  \n图 44-17\n\n通过来回拖动滑块并观察按钮在遍历画布中动画路径时的旋转来检查属性是否有效。查看 `activity_main_scene.xml` 文件，它现在应该如下：\n\
  \n```xml\n<Transition\n    motion:constraintSetEnd=\"@+id/end\"\n    motion:constraintSetStart=\"\
  @id/start\"\n    motion:duration=\"1000\">\n    <KeyFrameSet>\n        <KeyAttribute\n\
  \            motion:motionTarget=\"@+id/myButton\"\n            motion:framePosition=\"\
  50\"\n            android:rotation=\"360\" />\n    </KeyFrameSet>\n    <OnClick\
  \ motion:targetId=\"@id/myButton\"\n    motion:clickAction=\"toggle\" />\n</Transition>\n\
  ```\n\n测试动画，可以使用过渡滑块，或者通过编译并运行应用来验证按钮现在在动画期间会旋转。\n\n## 44.7 为过渡添加自定义属性\n\n\n\n\n\
  `KeyAttribute` 属性仅限于缩放和旋转等内置效果。通过声明 `CustomAttributes` 也可以实现额外的更改。与存储在 `Transition`\
  \ 元素中的 `KeyAttributes` 不同，`CustomAttributes` 位于起始和结束约束集中。因此，这些属性只能声明在起始和结束点处生效（也就是说，你不能在过渡时间轴的中途位置指定属性关键帧）。\n\
  \n在本示例中，我们将配置按钮颜色从红色逐渐变为绿色。首先，在图 44-18 中标记为 `A` 的起始框，然后选择 `myButton` 视图约束集（`B`）：\n\
  \n![](img/as_4.0_motionlayout_start_and_view.jpg)\n\n图 44-18\n\n参考 `Attributes`\
  \ 工具窗口，点击下方所示的 `CustomAttributes` 区域中的 `+` 按钮：\n\n![](img/as_4.0_motionlayout_timeline_custom_attr_add.jpg)\n\
  \n图 44-19\n\n在弹出的对话框（图 44-20）中，将属性类型更改为 `Color` 并在 `Attribute Name` 字段中输入 `backgroundColor`。最后，将值设置为\
  \ `#F80A1F`：\n\n![](img/as_4.0_motionlayout_custom_attr_color.jpg)\n\n图 44-20\n\n\
  点击 `OK` 提交更改，然后选择结束约束集（上方图 44-18 中标记为 `C`），并重复步骤添加自定义属性，这次指定 `#33CC33` 为颜色的 RGB\
  \ 值。\n\n使用时间轴滑块或运行应用，确保按钮在动画期间颜色改变。\n\n添加 `CustomAttributes` 将反映在 `activity_main_scene.xml`\
  \ 文件中如下：\n\n```xml\n<ConstraintSet android:id=\"@+id/start\">\n    <Constraint>\n\
  \        <CustomAttribute\n            motion:attributeName=\"backgroundColor\"\n\
  \            motion:customColorValue=\"#F80A1F\" />\n    </Constraint>\n</ConstraintSet>\n\
  <ConstraintSet android:id=\"@+id/end\">\n    <Constraint>\n        <CustomAttribute\n\
  \            motion:attributeName=\"backgroundColor\"\n            motion:customColorValue=\"\
  #33CC33\" />\n    </Constraint>\n</ConstraintSet>\n```\n\n## 44.8 添加位置关键帧\n\n本教程的最后一个任务是在动画路径上添加两个位置关键帧（`KeyPosition`），为动画引入一些横向移动。在\
  \ `MotionLayout` 编辑器显示过渡时间轴的情况下，点击按钮创建一个如上方图 44-13 所示的关键帧，并从菜单中选择下方图 44-21 所示的 `KeyPosition`\
  \ ：\n\n![](img/as_4.0_motionlayout_add_keyposition.jpg)\n\n图 44-21\n\n在弹出的对话框中，按照图\
  \ 44-22 所示设置属性：\n\n![](img/as_4.0_motionlayout_keyposition_1.jpg)\n\n图 44-22\n\n\
  点击 `Add` 按钮提交更改，然后重复上述步骤添加配置如下的第二个位置关键帧：\n\n- `Position`: `75`\n- `Type`: `parentRelative`\n\
  - `PercentX`: `0.85`\n- `PercentY`: `0.75`\n\n完成这些更改后，`activity_main_scene.xml`\
  \ 文件中的 `transition` 元素将添加以下关键帧项：\n\n```xml\n<KeyFrameSet>\n    <KeyPosition\n  \
  \      motion:motionTarget=\"@+id/myButton\"\n        motion:framePosition=\"25\"\
  \n        motion:keyPositionType=\"parentRelative\"\n        motion:percentX=\"\
  0.15\"\n        motion:percentY=\"0.25\" />\n    <KeyPosition\n        motion:motionTarget=\"\
  @+id/myButton\"\n        motion:framePosition=\"75\"\n        motion:keyPositionType=\"\
  parentRelative\"\n        motion:percentX=\"0.85\"\n        motion:percentY=\"0.75\"\
  \ />\n</KeyFrameSet>\n```\n\n\n\n\n```xml\n      motion:framePosition=\"25\"\n \
  \     motion:motionTarget=\"@+id/button\"\n      motion:wavePeriod=\"1\"\n     \
  \ motion:waveOffset=\"0dp\"\n      motion:waveShape=\"sin\"\n      android:translationY=\"\
  50dp\"/>\n<KeyCycle\n    motion:framePosition=\"50\"\n    motion:motionTarget=\"\
  @+id/button\"\n    motion:wavePeriod=\"1\"\n    motion:waveOffset=\"0dp\"\n    motion:waveShape=\"\
  sin\"\n    android:translationY=\"50dp\"/>\n<KeyCycle\n    motion:framePosition=\"\
  75\"\n    motion:motionTarget=\"@+id/button\"\n    motion:wavePeriod=\"1\"\n   \
  \ motion:waveOffset=\"0dp\"\n    motion:waveShape=\"sin\"\n    android:translationY=\"\
  50dp\"/>\n<KeyCycle\n    motion:framePosition=\"100\"\n    motion:motionTarget=\"\
  @+id/button\"\n    motion:wavePeriod=\"1\"\n    motion:waveOffset=\"0dp\"\n    motion:waveShape=\"\
  sin\"\n    android:translationY=\"50dp\"/>\n</KeyFrameSet>\n```\n\n上述关键帧集将时间线划分为四个等周期。每个周期都配置为包含一个\
  \ `sin` 正弦波形状，该形状将按钮的 `translationY` 属性调整 `50dp`。执行时，此动画将导致按钮在指定范围内多次垂直振荡。此关键帧集可以可视化，如\
  \ 图 45-1 所示，其中四个点代表关键帧的位置：\n\n![](img/as_4.0_keycycle_simple_sin.jpg)\n\n图 45-1\n\
  \n按照目前的实现方式，每个周期包含单个波形。假设我们需要的不再是这些均匀分布的波形，而是在最后一个周期内包含四个波形。这可以通过增加最后一个 `KeyCycle`\
  \ 元素的 `wavePeriod` 属性轻松实现，如下所示：\n\n.\n\n.\n\n      <KeyCycle\n        motion:framePosition=\"\
  75\"\n        motion:motionTarget=\"@+id/button\"\n        motion:wavePeriod=\"\
  4\"\n        motion:waveOffset=\"0dp\"\n        motion:waveShape=\"sin\"\n     \
  \   android:translationY=\"50dp\"/>\n.\n\n.\n\n进行此更改后，帧集可以按波形形式渲染如下：\n\n![](img/as_4.0_keycycle_sin_waveperiod.jpg)\n\
  \n图 45-2\n\n到为止，本章中的示例一直使用 `sin` 波。事实上，在 `MotionLayout` 中处理循环关键帧时，有许多不同的波形可用。例如，图\
  \ 45-3 展示了将所有循环关键帧的 `waveShape` 属性更改为锯齿波的效果：\n\n![](img/as_4.0_keycycle_sawtooth.jpg)\n\
  \n图 45-3\n\n除了 `sin` 和锯齿波，`MotionLayout` 还支持三角形（三角形）、`square`（方形）、`bounce`（弹性）和\
  \ `reverseSawtooth`（反锯齿）波形。\n\n在上面的示例中，每个周期都沿 Y 轴在相同范围内移动按钮。然而，假设我们需要第二个周期沿正 Y 轴移动按钮的距离更远。这涉及对第二个周期的\
  \ `waveOffset` 属性进行调整，如下：\n\n```xml\n<KeyCycle\n    motion:framePosition=\"25\"\n\
  \    motion:target=\"@+id/button\"\n    motion:wavePeriod=\"1\"\n    motion:waveOffset=\"\
  100dp\"\n    motion:waveShape=\"sin\"\n    android:translationY=\"50dp\"/>\n```\n\
  \n通过此更改，帧集可以按波形形式渲染如下：\n\n![](img/as_4.0_keycycle_sin_waveoffset.jpg)\n\n图 45-4\n\
  \n现在按钮在第二个周期内的运动范围将介于 Y 轴上大约 0 到 150dp 之间。如果我们仍然需要范围的低端与其他波形匹配，我们当然向 `translationY`\
  \ 值添加了 `100dp`：\n\n```xml\n<KeyCycle\n    motion:framePosition=\"25\"\n    motion:target=\"\
  @+id/button\"\n    motion:wavePeriod=\"1\"\n    motion:waveOffset=\"100dp\"\n  \
  \  motion:waveShape=\"sin\"\n    android:translationY=\"150dp\"/>\n```\n\n此更改现在为我们提供了以下波形：\n\
  \n![](img/as_4.0_keycycle_sin_waveoffset_flat.jpg)\n\n图 45-5\n\n## 45.2 使用 Cycle\
  \ 编辑器\n\n尽管并不复杂，但通过直接在 `MotionScene` 文件中编辑 XML `KeyCycle` 条目来获取所需的精确配置可能需要一些时间。由于此，Google\
  \ 的 Android 工程师开发了 Cycle Editor（循环编辑器编辑器）。这是一个基于 Java 的独立工具，不是 Android Studio 的一部分。`Cycle\
  \ Editor` 允许你可视化地设计和测试循环帧集。\n\n`Cycle Editor` 工具以 Java 归文件（`.jar`）的形式提供，这需要在开发系统上安装\
  \ Java 运行时。安装 Java 的步骤取决于您的操作系统。\n\n一旦安装了 Java，可以从以下 URL 下载 `CycleEditor.jar` 文件：\n\
  \n[`github.com/googlesamples/android-ConstraintLayoutExamples/releases/download/1.0/CycleEditor.jar`](https://github.com/googlesamples/android-ConstraintLayoutExamples/releases/download/1.0/CycleEditor.jar)\n\
  \n下载后，打开命令行提示符或终端，进入 jar 文件所在的目录并运行以下命令：\n\n```bash\njava -jar CycleEditor.jar\n\
  ```\n\n工具加载后将显示如 图 45-6 所示：\n\n![](img/as_4.0_keycycle_editor_main.jpg)\n\n图 45-6\n\
  \n图中标记 A 显示了帧集的 XML，可以直接编辑或使用面板 B 中的控件。面板 C 显示了波形形式的渲染。遗憾的是，它在更改时不会重绘。相反，必须通过选择\
  \ `File -> Parse XML` 选项进行刷新。点击面板 B 中的播放按钮后，标记 D 的面板将显示动画。`Examples` 菜单提供了用于学习或作为动画基础的示例集。\n\
  \n为了演示编辑器的用法，本章的剩余部分将创建一个实现循环动画的项目。\n\n## 45.3 创建 CycleDemo 项目\n\n从欢迎屏幕选择 `Create\
  \ New Project` 启动选项，并在新建项目对话框中选择 `Empty Activity` 模板，然后点击 Next 按钮。\n\n在 Name 字段中输入\
  \ `CycleDemo`，并将包名指定为 `com.ebook.keycycledemo`。在点击 Finish 按钮之前，将 Minimum API level\
  \ 设置为 `API 26: Android 8.0 (Oreo)` 并 Language 设置为 Java。\n\n当布局编辑器处于 Design 模式并打开\
  \ `activity_main.xml` 时，右键点击 `ConstraintLayout` 条目并选择 `Convert to MotionLayout`\
  \ 选项：\n\n![](img/as_4.0_motionlayout_conversion.jpg)\n\n图 45-7\n\n选择后，点击确认对话框中的\
  \ `Convert` 按钮。\n\n## 45.4 配置开始和结束约束\n\n教程的目标是制作按钮从屏幕一侧移动到另一侧，包括导致视图沿 Y 轴上下移动的循环效果。第一步是配置开始和结束约束。\n\
  \n当 MotionLayout 编辑器加载 `activity_main.xml` 文件时，选择并删除默认的 `TextView` 组件。在选中下方（如 图\
  \ 45-9） Motion Layout 框之前，从调色板中拖入 `Button` 视图，使其在垂直方向居中并位于布局画布的左边缘：\n\n![](img/as_4.1_keycycledemo_button_added.jpg)\n\
  \n图 45-8\n\n要配置起始点的约束，选择编辑器窗口中的开始约束集条目（如 图 45-9 中的标记 A）：\n\n![](img/as_4.0_keycycle_motionlayout_editor_labelled.jpg)\n\
  \n图 45-9\n\n\n\n\n接下来，在 `ConstraintSet` 列表中选择按钮项 (B)。在按钮项仍被选中的情况下，点击编辑按钮 (C) 并从菜单中选择\
  \ `Create Constraint`。\n\n在按钮仍被选中的情况下，使用 `Attributes` 工具窗口为视图的顶部、左侧和底部设置约束，如下所示：\n\
  \n![](img/as_4.0_keycycle_start_constraint.jpg)\n图 45-10\n\n选择结束约束集项（在下方的 图 45-9\
  \ 中标记为 D），并重复这些步骤创建一个新的约束，这次为按钮的顶部、底部和右侧边缘设置约束：\n\n![](img/as_4.0_keycycle_end_constraint.jpg)\n\
  图 45-11\n\n## 45.5 创建循环（Cycles）\n\n下一步是使用 `Cycle Editor` 为动画生成循环关键帧。在 `Cycle Editor`\
  \ 运行时，请参考下方的控制面板（图 45-12）：\n\n![](img/as_4.0_keycycle_control_panel_labelled.jpg)\n\
  图 45-12\n\n使用标记为 A 的菜单，将要修改的属性从 `rotation` 改为 `translationY`。\n\n接下来，使用 `KeyCycle`\
  \ 控件 (B) 选择循环 `0`，这样对面板其他位置的更改将应用于第一个循环。将 `Period` 滑块移动到 `1`，并将 `translationY` 滑块移动到\
  \ `60`，如 图 45-13 所示（移动滑块时，请参考 XML 面板查看 `translationY` 值的精确设置）：\n\n![](img/as_4.0_keycycle_editor_cyclekey_0.jpg)\n\
  图 45-13\n\n要在图表中查看目前为止的变化，请选择 `File -> Parse XML` 菜单选项。使用 表 45-2 中列出的值，配置 `KeyFrames`\
  \ 1 到 `4` 的设置（请记住你已经配置了 `KeyCycle 0` 列中的设置）：\n\n| | KeyCycle 0 | KeyCycle 1 | KeyCycle\
  \ 2 | KeyCycle 3 | KeyCycle 4 |\n| --- | --- | --- | --- | --- | --- |\n| Position\
  \ | 0 | 25 | 50 | 75 | 100 |\n| Period | 1 | 2 | 3 | 2 | 1 |\n| translationY | 60\
  \ | 60 | 150 | 60 | 60 |\n\n表 45-2\n\n完成这些更改后，关键帧集 XML 的内容如下：\n\n```xml\n<KeyFrameSet>\n\
  \    <KeyCycle\n        motion:framePosition=\"0\"\n        motion:motionTarget=\"\
  @+id/button\"\n        motion:wavePeriod=\"1\"\n        motion:waveOffset=\"0dp\"\
  \n        motion:waveShape=\"sin\"\n        android:translationY=\"60dp\"/>\n  \
  \  <KeyCycle\n        motion:framePosition=\"25\"\n        motion:motionTarget=\"\
  @+id/button\"\n        motion:wavePeriod=\"2\"\n        motion:waveOffset=\"0dp\"\
  \n        motion:waveShape=\"sin\"\n        android:translationY=\"60dp\"/>\n  \
  \  <KeyCycle\n        motion:framePosition=\"50\"\n        motion:motionTarget=\"\
  @+id/button\"\n        motion:wavePeriod=\"3\"\n        motion:waveOffset=\"0dp\"\
  \n        motion:waveShape=\"sin\"\n        android:translationY=\"150dp\"/>\n \
  \   <KeyCycle\n        motion:framePosition=\"75\"\n        motion:motionTarget=\"\
  @+id/button\"\n        motion:wavePeriod=\"2\"\n        motion:waveOffset=\"0dp\"\
  \n        motion:waveShape=\"sin\"\n        android:translationY=\"60dp\"/>\n  \
  \  <KeyCycle\n        motion:framePosition=\"100\"\n        motion:motionTarget=\"\
  @+id/button\"\n        motion:wavePeriod=\"1\"\n        motion:waveOffset=\"0dp\"\
  \n        motion:waveShape=\"sin\"\n        android:translationY=\"60dp\"/>\n</KeyFrameSet>\n\
  ```\n\n要查看带有新循环的图表，选择 `File -> Parse XML` 菜单选项以刷新波形，该波形现在应该如 图 45-14 所示：\n\n![](img/as_4.0_keycycle_editor_cycle_complete.jpg)\n\
  图 45-14\n\n## 45.6 预览动画\n\n现在可以从 `Cycle Editor` 内部预览基于循环的动画。点击播放按钮（图 45-15 中标记为\
  \ A）开始运行动画。要将循环与水平移动结合，将第二个菜单 (B) 从 `Stationary` 改为 `East`。此外，花些时间实验时间和线性的设置（C 和\
  \ D）。\n\n![](img/as_4.0_keycycle_play_buttons.jpg)\n图 45-15\n\n## 45.7 将 KeyFrameSet\
  \ 添加到 MotionScene\n\n在 Cycle Editor 中，选中并复制 `KeyCycle` 元素，将其粘贴到 `main_scene.xml`\
  \ 文件的 `Transition` 部分，使它们放置在 `Motion` 标签之间。注意增加的 `duration` 设置以及 `OnClick` 处理器的添加，如下：\n\
  \n```xml\n<Transition\n    motion:constraintEnd=\"@+id/end\"\n    motion:constraintStart=\"\
  @+id/start\"\n    motion:duration=\"7000\">\n    <KeyFrameSet>\n        <KeyCycle\n\
  \            motion:framePosition=\"0\"\n            motion:motionTarget=\"@+id/button\"\
  \n            motion:wavePeriod=\"1\"\n            motion:waveOffset=\"0dp\"\n \
  \           motion:waveShape=\"sin\"\n            android:translationY=\"60dp\"\
  />\n    </KeyFrameSet>\n</Transition>\n```\n\n在继续之前，检查每个 `target` 属性是否已正确声明。例如，循环波形也可以在\
  \ Android Studio Layout 编辑器中查看，如 图 45-16 所示：\n\n![](img/as_4.0_keycycle_motionlayout_waves.jpg)\n\
  图 45-16\n\n循环关键帧集不仅限于每个动画一个。例如，在 `main_scene.xml` 文件的 `Transition` 部分添加以下 `KeyFrameSet`，为按钮移动添加一些旋转效果：\n\
  \n```xml\n<KeyFrameSet>\n    <KeyCycle\n        motion:framePosition=\"0\"\n   \
  \     motion:motionTarget=\"@+id/button\"\n        motion:wavePeriod=\"1\"\n   \
  \     motion:waveOffset=\"0dp\"\n        motion:waveShape=\"sin\"\n        android:translationY=\"\
  60dp\"\n        android:rotation=\"45\"/>\n    <KeyCycle\n        motion:framePosition=\"\
  25\"\n        motion:motionTarget=\"@+id/button\"\n        motion:wavePeriod=\"\
  2\"\n        motion:waveOffset=\"0dp\"\n        motion:waveShape=\"sin\"\n     \
  \   android:translationY=\"60dp\"\n        android:rotation=\"80\"/>\n    <KeyCycle\n\
  \        motion:framePosition=\"50\"\n        motion:motionTarget=\"@+id/button\"\
  \n        motion:wavePeriod=\"3\"\n        motion:waveOffset=\"0dp\"\n        motion:waveShape=\"\
  sin\"\n        android:translationY=\"150dp\"\n        android:rotation=\"45\"/>\n\
  \    <KeyCycle\n        motion:framePosition=\"75\"\n        motion:motionTarget=\"\
  @+id/button\"\n        motion:wavePeriod=\"2\"\n        motion:waveOffset=\"0dp\"\
  \n        motion:waveShape=\"sin\"\n        android:translationY=\"60dp\"\n    \
  \    android:rotation=\"80\"/>\n    <KeyCycle\n        motion:framePosition=\"100\"\
  \n        motion:motionTarget=\"@+id/button\"\n        motion:wavePeriod=\"1\"\n\
  \        motion:waveOffset=\"0dp\"\n        motion:waveShape=\"sin\"\n        android:translationY=\"\
  60dp\"\n        android:rotation=\"45\"/>\n</KeyFrameSet>\n```\n\n## 45.8 总结\n\n\
  循环关键帧提供了一种实用的方法，用于构建符合波形模式的涉及大量状态变化的帧动画。本章所述，通过使用 `Cycle Editor` 应用可以显著简化生成循环关键帧的过程。\n\
  \n## 46. 使用悬浮操作按钮和 Snackbar\n\n\n\n\n\n本章的目标之一是提供材料设计（material design）概念的概述。材料设计最初作为\
  \ Android 5.0 的一部分引入，是一套设计指南，规定了 Android 用户界面以及在 Android 上运行的应用程序的显示和行为。\n\n作为材料设计概念实现的一部分，Google\
  \ 还引入了 Android 设计支持库（Android Design Support Library）。该库包含许多不同的组件，允许将材料设计的许多关键功能构建到\
  \ Android 应用中。这些组件中的两个——悬浮操作按钮（floating action button）和 `Snackbar` 将在本章中进行介绍，并在随后的章节中将介绍许多其他组件。\n\
  \n## 46.1 材料设计\n\nAndroid 环境的整体外观由材料设计的原则定义。材料设计由 Google 的 Android 团队创建，规定了构成 Android\
  \ 用户界面和运行在其上的应用程序的元素在行为、阴影、动画和样式方面以特定方式显示和运行。材料设计的核心原则之一是，用户界面的元素看起来具有物理深度，并且感觉这些物品是由物理材料层构建而成的。例如，按钮通过阴影效果看起来像是浮在它所在的布局表面之上。按下按钮时，按钮会发生弯曲和抬起，仿佛由薄薄的材料制成，释放时会产生涟漪。\n\
  \n材料设计还规定了许多标准用户界面元素的布局和行为。一个关键示例是位于屏幕顶部的应用栏（app bar）显示的方式，以及它相对于活动主内容内发生的滚动操作的响应方式。\n\
  \n事实上，材料设计涵盖了从推荐的颜色样式到对象动画方式的广泛领域。可以通过以下链接在网上找到材料设计概念和指南的完整描述，这是所有 Android 开发者的推荐阅读材料：\n\
  \n[`www.google.com/design/spec/material-design/introduction.html`](https://www.google.com/design/spec/material-design/introduction.html)\n\
  \n## 46.2 设计库\n\n实现采用材料设计原则的 Android 应用所需的许多构建块包含在 Android 设计支持库中。该库包含了一系列用户界面组件，可以包含在\
  \ Android 应用中以实现材料设计的大部分外观、感觉和行为。该库中的两个组件——悬浮操作按钮和 `Snackbar` 将在本章中介绍，而其他将在后面的章节中介绍。\n\
  \n## 46.3 悬浮操作按钮 (FAB)\n\n悬浮操作按钮是一种看起来浮在应用用户界面表面之上的按钮，通常用于促进用户界面屏幕内最常见的操作。例如，悬浮操作按钮可以放置在屏幕上，允许用户向联系人列表添加条目或从应用内发送电子邮件。例如，图\
  \ 46-1 展示了允许用户在标准 Android 联系人应用中添加新联系人的悬浮操作按钮：\n\n![](img/Image24252.jpg)\n\n图 46-1\n\
  \n为了符合材料设计指南，在使用悬浮操作按钮时应遵循许多规则。悬浮操作按钮必须是圆形的，且尺寸可以是 `56 x 56dp`（默认）或 `40 x 40dp`（微型）。按钮在手机上距离屏幕边缘至少\
  \ `16dp`，在桌面电脑和和平板设备上至少 `24dp`。无论尺寸如何，按钮都必须包含一个大小为 `24x24dp` 的内部图标，并且建议每个用户界面屏幕只有一个悬浮操作按钮。\n\
  \n悬浮操作按钮可以带有动画，或者设计为在触摸时变形为其他项目。例如，悬浮操作按钮在被点击时可能会旋转，或者变形为另一个元素，如工具栏或列出相关操作的面板。\n\
  \n## 46.4 Snackbar\n\n`Snackbar` 组件提供了一种以屏幕底部面板的形式向用户呈现信息的方法，如图 46-2 所示。`Snackbar`\
  \ 实例包含一条简短的文本消息和一个可选的操作按钮，该按钮在用户点击时将执行某项任务。一旦显示，`Snackbar` 将自动超时关闭，或者可以由用户通过滑动操作手动移除。在\
  \ `Snackbar` 显示期间，应用程序将继续运行并以正常方式响应用户交互。\n\n![](img/Image24341.jpg)\n\n图 46-2\n\n\
  在本章的剩余部分，将创建一个示例应用程序，该程序将利用悬浮操作按钮和 `Snackbar` 的基本功能向项目列表添加条目。\n\n## 46.5 创建示例项目\n\
  \n从欢迎界面选择 `Create New Project`（新建项目）快速启动选项，在生成的新项目对话框中，点击 `Next`（下一步）按钮之前选择 `Basic\
  \ Activity`（基础活动）模板。\n\n在 `Name` 字段中输入 `FabExample`，并指定 `com.ebookfrenzy.fabexample`\
  \ 为包名。在点击 `Finish`（完成）按钮之前，将 `Minimum API level`（最低 API 级别）设置为 `API 26: Android\
  \ 8.0 (Oreo)`并将`Language`（语言）菜单设置为 `Java`。\n\n## 46.6 检查项目\n\n由于选择了 `Basic Activity`\
  \ 模板，该活动包含四个布局文件。`activity_main.xml` 文件由一个 `CoordinatorLayout` 管理器组成，包含应用栏、工具栏和悬浮操作按钮的条目。\n\
  \n`content_main.xml` 文件代表活动内容的布局，包含一个 `NavHostFragment` 实例。该文件通过以下包含指令嵌入 `activity_main.xml`\
  \ 文件中：\n\n```xml\n<include layout=\"@layout/content_main\" />\n```\n\n`activity_main.xml`\
  \ 文件中的悬浮操作按钮元素如下：\n\n```xml\n<com.google.android.material.floatingactionbutton.FloatingActionButton\n\
  \    android:id=\"@+id/fab\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:layout_gravity=\"bottom|end\"\n    android:layout_margin=\"\
  @dimen/fab_margin\"\n    app:srcCompat=\"@android:drawable/ic_dialog_email\" />\n\
  ```\n\n这声明按钮将出现在屏幕右下角，间距由 `values/dimens.xml` 文件中的 `fab_margin` 标识表示（在此情况下设置为 `16dp`）。XML\
  \ 进一步声明按钮的内部图标将采用标准内置电子邮件图标的形式。\n\n空白模板还配置了悬浮操作按钮，在用户点击时显示 `Snackbar` 实例。实现此功能的代码位于\
  \ `MainActivity.java` 文件的 `onCreate()` 方法中，如下：\n\n```java\nFloatingActionButton\
  \ fab = findViewById(R.id.fab);\nfab.setOnClickListener(new View.OnClickListener()\
  \ {\n    @Override\n    public void onClick(View view) {\n        Snackbar.make(view,\
  \ \"Replace with your own action\",\n                Snackbar.LENGTH_LONG)\n   \
  \             .setAction(\"Action\", null).show();\n    }\n});\n```\n\n该代码通过按钮的\
  \ ID 获取悬浮操作按钮的引用，并为其添加了一个 `OnClickListener` 处理程序，在按钮被点击时调用。该方法仅显示了一个配置了消息但没有操作的\
  \ `Snackbar` 实例。\n\n当项目编译并运行时，悬浮操作按钮将出现在屏幕底部，如图 46-3 所示：\n\n![](img/as_4.1_fab.jpg)\n\
  \n图 46-3\n\n\n\n\n点击悬浮按钮将触发 `onClickListener` 处理器方法，导致 `Snackbar` 显示在屏幕底部：\n\n![](img/as_4.1_fab_snackbar.jpg)\n\
  图 46-4\n\n当 `Snackbar` 显示在较窄的设备上（如上方图 46-4 所示），请注意悬浮按钮会向上移动以为 `Snackbar` 的出现留出空间。这由\
  \ `activity_main.xml` 布局资源文件中的 `CoordinatorLayout` 容器自动完成处理。\n\n## 46.7 移除导航功能\n\
  \n正如“Android Studio 布局编辑器工具指南](#Layout_Editor.xhtml__idTextAnchor332)”概述，`Basic\
  \ Activity` 模板包含多个片段（fragments）和按钮，用于在片段之间进行导航。对于本教程而言，这些功能是不必要的，如果不移除，稍后会导致问题。在继续教程之前，请按照以下方式修改项目：\n\
  \n1.  在 `Project` 工具窗口中，导航并双击 `app -> res -> navigation -> nav_graph.xml` 文件，将其加载到导航编辑器中。\n\
  2.  在编辑器中，在 `Component Tree` 面板中选择 `SecondFragment` 项，并按键盘删除键将其从图中移除。\n3.  找到并删除\
  \ `SecondFragment.java` (`app -> java -> <package name> -> SecondFragment`）和 `fragment_second.xml`\
  \ (`app -> res -> layout -> fragment_second.xml`）文件。\n4.  找到 `FirstFragment.java`\
  \ 文件，双击将其加载到编辑器，并移除 `onViewCreated()` 方法中的代码，使其如下：\n\n```java\npublic void onViewCreated(@NonNull\
  \ View view, Bundle savedInstanceState) {\n    super.onViewCreated(view, savedInstanceState);\n\
  \    view.findViewById(R.id.button_first).setOnClickListener(new View.OnClickListener()\
  \ {\n        @Override\n        public void onClick(View view) {\n            NavHostFragment.findNavController(FirstFragment.this)\n\
  \                          .navigate(R.id.action_FirstFragment_to_SecondFragment);\n\
  \        }\n    });\n}\n```\n\n## 46.8 更改悬浮按钮\n\n由于本示例的目标是配置悬浮按钮以向列表添加条目，因此目前按钮上显示的电子邮件图标需要更改为更能指示执行操作的内容。用于按钮的图标命名为\
  \ `ic_add_entry.png`，可以在此处 URL 下载的示例代码的 `project_icons` 文件夹中找到：[`www.ebookfrenzy.com/retail/androidstudio41/index.php`](https://www.ebookfrenzy.com/retail/androidstudio41/index.php)\n\
  \n在操作系统的文件系统导航器中找到此图像并复制图像文件。在 `Project` 工具窗口的 `app -> res -> drawable` 项上点击右键，并从菜单中选择`粘贴`\
  \ 以将文件添加到文件夹：\n\n![](img/as_3.6_fab_icon_added.jpg)\n图 46-5\n\n接下来，编辑 `activity_main.xml`\
  \ 文件，将图标的图像源从 `@android:drawable/ic_dialog_email` 更改为 `@drawable/ic_add_entry`，如下：\n\
  \n```xml\n<com.google.android.material.floatingactionbutton.FloatingActionButton\n\
  \    android:id=\"@+id/fab\"\n    android:layout_width=\"wrap_content\"\n    android:layout_height=\"\
  wrap_content\"\n    android:layout_gravity=\"bottom|end\"\n    android:layout_margin=\"\
  @dimen/fab_margin\"\n    app:srcCompat=\"@drawable/ic_add_entry\" />\n```\n\n在布局预览中，按钮的内部图标将更改为加号。\n\
  \n## 46.9 将 ListView 添加到内容布局\n\n本教程的下一步是将 `ListView` 实例添加到 `fragment_first.xml`\
  \ 文件中。`ListView` 类提供了一种以列表格式显示项目的方法，并可以在 `Layout Editor` 工具调板的 `Legacy` 部分找到。\n\n\
  将 `fragment_first.xml` 文件加载到 `Layout Editor` 工具中，必要时选择 `Design` 模式，选择并删除默认的 `TextView`\
  \ 和 `Button` 对象。在调板的 `Legacy` 类别中找到 `ListView` 对象，在启用 `autoconnect` 模式的情况下，将其拖放到布局画布的中心。选择\
  \ `ListView` 对象并在 `Attributes` 工具窗口中将 `ID` 更改为 `listView`。`Layout Editor` 应该已经调整了\
  \ `ListView` 的大小以填充整个容器，但可能没有应用任何约束。点击 `Infer Constraints` 按钮添加缺失的约束，此时布局应如图 46-6\
  \ 所示：\n\n![](img/as_3.6_fab_listview.jpg)\n图 46-6\n\n选中 `ListView` 对象后，使用 `Attributes`\
  \ 工具窗口将 `layout_width` 和 `layout_height` 设置为 `0dp`。\n\n## 46.10 向 ListView 添加项目\n\
  \n用户每点击一次悬浮按钮，`ListView` 就会添加一个新项目。为了实现这一点，需要对 `MainActivity.java` 进行一些更改。首先实现 `onStart()`\
  \ 方法以获取 `ListView` 的引用并初始化 `adapter` 实例：\n\n```java\npackage com.ebookfrenzy.fabexample;\n\
  \nimport android.os.Bundle;\nimport com.google.android.material.floatingactionbutton.FloatingActionButton;\n\
  import com.google.android.material.snackbar.Snackbar;\nimport androidx.appcompat.app.AppCompatActivity;\n\
  import android.view.View;\nimport android.widget.ArrayAdapter;\nimport android.widget.ListView;\n\
  import java.util.ArrayList;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    ArrayList<String> listItems = new ArrayList<>();\n    ArrayAdapter<String>\
  \ adapter;\n    private ListView listView;\n\n    @Override\n    protected void\
  \ onStart() {\n        super.onStart();\n        listView = findViewById(R.id.listView);\n\
  \        adapter = new ArrayAdapter<String>(this, android.R.layout.simple_item_1,\
  \ listItems);\n        listView.setAdapter(adapter);\n    }\n}\n```\n\n注意，使用的是 `onStart()`\
  \ 方法而不是通常的 `onCreate()` 方法。这是因为在调用 `onCreate()` 时，片段尚未初始化，会导致应用程序崩溃。`ListView` 需要一个项目数组、一个管理项目的\
  \ `adapter` 以及一个规定项目如何呈现的布局定义。在上述代码中，项目存储在分配给 `adapter` 的 `ArrayList` 中。添加到列表中的项目将使用\
  \ `simple_item_1` 在 `ListView` 中显示，`simple_item_1` 是 Android 提供的用于显示简单字符串项的内置布局。\n\
  \n接下来，编辑悬浮按钮的 `onClickListener` 代码，以便在 `Snackbar` 中显示不同的消息并调用向列表添加项目的方法：\n\n```java\n\
  FloatingActionButton fab = findViewById(R.id.fab);\nfab.setOnClickListener(new View.OnClickListener()\
  \ {\n    @Override\n    public void onClick(View view) {\n        addListItem();\n\
  \        Snackbar.make(view, \"Item added to list\", Snackbar.LENGTH_LONG)\n   \
  \              .setAction(\"Action\", null)\n                 .show();\n    }\n\
  });\n```\n\n在 `MainActivity.java` 文件中，添加 `addListItem()` 方法如下：\n\n```java\nprivate\
  \ void addListItem() {\n    SimpleDateFormat dateformat = new SimpleDateFormat(\"\
  HH:mm:ss MM/dd/yyyy\", Locale.US);\n    listItems.add(dateformat.format(new Date()));\n\
  \    adapter.notifyDataSetChanged();\n}\n```\n\n\n\n\n\n`addListItem()` 方法中的代码识别并格式化当前日期和时间，并将其添加到列表项数组中。随后通知分配给\
  \ `ListView` 的适配器列表数据已发生更改，导致 `ListView` 更新以显示最新的列表项。\n\n编译并运行应用，测试点击悬浮操作按钮是否向 `ListView`\
  \ 添加了新的时间和日期条目，并且每次点击都显示 `Snackbar`，如图 46-7 所示：\n\n![](img/as_4.1_fab_example_running.jpg)\n\
  \n图 46-7\n\n## 46.11 为 Snackbar 添加操作\n\n此项目的最后一个任务是为 Snackbar 添加一个操作，允许用户撤销对列表的最近一次添加。编辑\
  \ `MainActivity.java` 文件并修改 Snackbar 的创建代码，添加一个标题为“Undo（撤销）”的操作，并配置名为 `undoOnClickListener`\
  \ 的 `OnClickListener`：\n\n```java\nfab.setOnClickListener(new View.OnClickListener()\
  \ {\n    @Override\n    public void onClick(View view) {\n        addListItem();\n\
  \        Snackbar.make(view, \"Item added to list\",\n                Snackbar.LENGTH_LONG)\n\
  \                .setAction(\"Undo\", undoOnClickListener).show();\n    }\n});\n\
  ```\n\n在 `MainActivity.java` 文件中添加监听器处理器：\n\n```java\nView.OnClickListener undoOnClickListener\
  \ = new View.OnClickListener() {\n    @Override\n    public void onClick(View view)\
  \ {\n        listItems.remove(listItems.size() -1);\n        adapter.notifyDataSetChanged();\n\
  \        Snackbar.make(view, \"Item removed\", Snackbar.LENGTH_LONG)\n         \
  \         .setAction(\"Action\", null).show();\n    }\n};\n```\n\n`onClick` 方法中的代码识别列表数组中最后一个项的位置，并在触发列表视图执行更新之前将其从列表中移除。随后将显示一个新的\
  \ Snackbar，指示上最后一个项已从列表中移除。\n\n再次运行应用并向列表添加一些项目。在最后一次添加时，点击 Snackbar 中的 Undo 按钮（图\
  \ 46-8）来从列表中移除最后一个项：\n\n![](img/as_4.1_fab_snackbar_undo.jpg)\n\n图 46-8\n\n值得注意的是，Undo\
  \ 按钮使用了在本章节之前通过主题编辑器分配给 `accentColor` 属性的相同颜色。\n\n## 46.12 总结\n\n本章提供了物设计（Material\
  \ Design）、悬浮操作按钮和 Snackbar 的总体概述，并完成了一个使用这些功能的示例项目。\n\n悬浮操作按钮和 Snackbar 都是 Android\
  \ 用户界面实现中物设计方法的一部分。悬浮操作按钮提供了一种在 Android 应用特定屏幕内推广最常用操作的方法。Snackbar 则为应用程序提供了一种既能向用户展示信息，又能允许用户对该信息采取行动的方法。\n\
  \n# 47. 使用 TabLayout 组件创建标签页界面\n\n上一章概述了 Android 中物设计的概念，并引入了设计支持库提供的两个组件：悬浮操作按钮和\
  \ Snackbar。本章将演示如何使用设计库的另一个组件——`TabLayout`，它可以与 `ViewPager` 类结合，在 Android Activity\
  \ 中创建一个基于标签页的界面。\n\n## 47.1 ViewPager 简介\n\n虽然 `ViewPager` 并不是设计支持库的一部分，但在与 `TabLayout`\
  \ 组件配合使用实现标签页用户界面时，它是非常有用的辅助类。`ViewPager` 的主要作用是允许用户翻阅不同的信息页面，每个页面通常由一个布局碎片（layout\
  \ fragment）表示。与 `ViewPager` 关联的碎片由 `FragmentPagerAdapter` 类的实例管理。\n\n至少，分配给 `ViewPager`\
  \ 的页面适配器必须实现两个方法。第一个方法名为 `getCount()`，必须返回可显示给用户的所有页面碎片总数。第二个方法 `getItem()` 接收一个页码，并必须返回准备好给用户的相应碎片对象。\n\
  \n## 47.2 TabLayout 组件概述\n\n如前所述，`TabLayout` 是作为物设计一部分引入的组件之一，并包含在设计支持库中。`TabLayout`\
  \ 的目的是向用户展示一行标签页，用户可以通过选择标签来向用户显示不同的页面。标签可以是固定的，也可以是可滚动的，用户可以向左或向右滑动以查看比当前屏幕能容纳的更多的标签。标签上显示的信息可以是基于文本的、图像或文本与图像的组合。例如，图\
  \ 47-1 显示了一个包含四个显示图像标签的 App 标签栏：\n\n![](img/Image2425.jpg)\n\n图 47-1\n\n另一方面，图 47-2\
  \ 显示了由四个显示文本标签组成的 TabLayout 配置：\n\n![](img/Image2434.jpg)\n\n图 47-2\n\n本章的剩余部分将通过完成一个示例项目的创建，演示如何将\
  \ `TabLayout` 组件与 `ViewPager` 以及四个碎片一起使用。\n\n## 47.3 创建 TabLayout 项目\n\n从欢迎界面选择\
  \ New Project（新建项目）快速启动选项，在新项目对话框中，在点击 Next（下一步）按钮之前选择 Basic Activity（基础活动）模板。在\
  \ Name（名称）字段中输入 `TabLayoutDemo` 并指定包名为 `com.ebookren.tabdemo`。在点击 Finish（完成）按钮之前，将\
  \ Minimum API level 设置为 API 26: Android 8.0 (Oreo)，语言设置为 Java。\n\n项目创建后，加载布局编辑器加载\
  \ `content_main.xml` 文件，选择 `NavHostFragment` 对象并将其删除。\n\n## 47.4 创建第一个碎片\n\n`TabLayout`上的每个标签在选中时都会显示不同的碎片。通过右键点击项目窗口中的\
  \ `app -> java -> com.ebookren.tabdemo` 条目并选择 New -> Fragment -> Fragment (Blank)，创建这些碎片中的第一个。在生成的对话框中，在\
  \ Fragment Name 字段中输入 `Tab1Fragment`，在 Layout Name 字段中输入 `fragment_tab1`。点击 Finish\
  \ 按钮创建新碎片：\n\n![](img/as_3.5_create_tab_fragment_java.jpg)\n\n图 47-3\n\n编辑 `Tab1Fragment.java`\
  \ 文件，如果 Android Studio 没有自动添加，请添加以下 `OnInteractionListener` 接口声明：\n\n```java\nimport\
  \ android.net.Uri;\n\npublic interface OnInteractionListener {\n    // TODO: Update\
  \ argument type and name\n    void onFragmentInteraction(Uri uri);\n}\n```\n\n加载布局编辑器加载新的\
  \ `fragment_tab1.xml` 文件（位于 `app -> res -> layout`），在组件树面板中右键点击 `FrameLayout` 项并选择\
  \ Convert FrameLayout to ConstraintLayout 选项。在点击对话 OK 之前，将布局的 ID 更改为 `constraintLayout`。\n\
  \n一旦布局转换为 `ConstraintLayout`，从布局中删除 `TextView`。从调色板（Palette）中找到 `TextView` 控件并将其拖放到布局中心。编辑该对象的\
  \ text 属性使其显示为“Tab 1 Fragment”，并将字符串提取为名为 `tab_1_fragment` 的资源，此时布局应与图 47-4 所示的匹配：\n\
  \n![](img/as_3.5_tab_layout_fragment_ui.jpg)\n\n图 47-4\n\n## 47.5 复制碎片\n\n\n\n\n\
  到目前为止，项目包含了四个所需的片段中的一个。与其使用之前的步骤创建其余三个片段，不如复制第一个片段来得。每个片段由一个布局 XML 文件和一个 Java 类文件组成，每个文件都需要复制。\n\
  \n在 Project 工具窗口中，右键点击 `fragment_tab1.xml` 文件，并在弹出的菜单中选择 `Copy`（复制）选项。再次右键点击布局项，这次选择\
  \ `Paste`（粘贴）选项。在弹出的对话框中，点击 `OK` 按钮之前，将新布局文件重命名为 `fragment_tab2.xml`。编辑新的 `fragment_tab2.xml`\
  \ 文件，将 `Text View` 上的文本改为“Tab 2 Fragment”，并按照通常步骤将字符串提取到名为 `tab_2_fragment` 的资源中。\n\
  \n要复制 `Tab1Fragment` 类文件，右键点击 `app` -> `java` -> `com.ebookfrenzy.tablayoutdemo`\
  \ 下列出的类，并选择 `Copy`。右键点击 `com.ebookfrenzy.tablayoutdemo` 项并选择 `Paste`。在 `Copy Class`\
  \ 对话框中，在 `New name:` 字段中输入 `Tab2Fragment` 并点击 `OK`。编辑新的 `Tab2Fragment.java` 文件，更改类名和\
  \ `onCreateView()` 方法以加载 `fragment_tab2` 布局文件：\n\n```java\n@Override\npublic View\
  \ onCreateView(LayoutInflater inflater, ViewGroup container,\n                 \
  \        Bundle savedInstanceState) {\n    // 加载此片段的布局\n    return inflater.inflate(R.layout.fragment_tab2,\
  \ container, false);\n}\n```\n\n再次执行上述复制步骤两次，为其余两个片段创建片段布局和类文件。完成这些步骤后，项目结构应与图 47-5\
  \ 匹配：\n\n![](img/Image2457.jpg)\n\n图 47-5\n\n## 47.6 添加 TabLayout 和 ViewPager\n\n\
  片段创建过程现在已完成，下一步是在主活动布局文件中添加 `TabLayout` 和 `ViewPager`。编辑 `activity_main.xml` 文件，并按照下面的\
  \ XML 列表所示添加这些元素。注意 `TabLayout` 组件嵌入在 `AppBarLayout` 元素中，而 `ViewPager` 放置在 `AppBarLayout`\
  \ 之后：\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<androidx.coordinatorlayout.widget.CoordinatorLayout\
