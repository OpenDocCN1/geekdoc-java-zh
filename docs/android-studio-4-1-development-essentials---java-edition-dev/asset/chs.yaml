  ```\n\n## 54.6 创建意图\n\n`MainActivity` 的目标是在用户触摸“Send Text”按钮时创建并启动意图。在创建意图的过程中，用户在\
  \ `EditText` 视图输入的字符串将作为键值对添加到意图对象。当创建 `MainActivity` 的用户界面时，按钮对象已配置为在用户点击时调用名为\
  \ `sendText()` 的方法。现在需要将该方法添加到 `MainActivity` 类 `MainActivity.java` 源文件中：\n\n```java\n\
  package com.ebookfrenzy.explicitintent;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  import android.os.Bundle;\nimport android.content.Intent;\nimport android.view.View;\n\
  import android.widget.EditText;\nimport android.widget.TextView;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_a);\n\
  \    }\n\n    public void sendText(View view) {\n        Intent i = new Intent(this,\
  \ ActivityB.class);\n        final EditText editText1 = findViewById(R.id.editText1);\n\
  \        String myString = editText1.getText().toString();\n        i.putExtra(\"\
  qString\", myString);\n    }\n}\n```\n\n\n\n\n```java\n        startActivity(i);\n\
  \n    }\n}\n```\n\n`sendText()` 方法的代码遵循了“Android Intents 概述”中概述的技巧。首先，创建一个新的 `Intent`\
  \ 实例，并将当前活动 和 `ActivityB` 的类名作为参数传递。接下来，将 `EditText` 对象中输入的文本以键值对的形式添加到 `intent`\
  \ 对象中，并通过调用 `startActivity()` 启动该 `intent`，将 `intent` 对象作为参数传递。\n\n编译并运行应用程序，点击“Send\
  \ Text”按钮启动 `ActivityB`，点击返回按钮（位于显示屏底部工具栏中）返回 `MainActivity`。\n\n## 54.7 提取 Intent\
  \ 数据\n\n现在 `ActivityB` 已经从 `MainActivity` 启动，下一步是提取 `intent` 中包含的 `String` 数据值，并将其赋值给\
  \ `ActivityB` 用户界面中的 `TextView` 对象。这需要在 `ActivityB.java` 源文件的 `onCreate()` 方法中添加一些代码：\n\
  \n```java\npackage com.ebookfrenzy.explicitintent;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  \nimport android.os.Bundle;\n\nimport android.content.Intent;\nimport android.view.View;\n\
  import android.widget.TextView;\nimport android.widget.EditText;\n\npublic class\
  \ ActivityB extends AppCompatActivity {\n    public void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activityb);\n\
  \        Bundle extras = getIntent().getExtras();\n        if (extras == null) {\n\
  \            return;\n        }\n        String qString = extras.getString(\"qString\"\
  );\n        final TextView textView = findViewById(R.id.textView2);\n        textView.setText(qString);\n\
  \    }\n}\n```\n\n在模拟器或物理 Android 设备上编译并运行应用程序。在点击“Send Text”按钮之前，在 `MainActivity`\
  \ 的文本框中输入一个问题。该消息现在应该出现在 `ActivityB` 用户界面的 `TextView` 组件上。\n\n## 54.8 将 ActivityB\
  \ 作为子活动启动\n\n为了让 `ActivityB` 能够向 `MainActivity` 返回数据，`ActivityB` 必须作为 `MainActivity`\
  \ 的子活动启动。这意味着 `MainActivity` 中 `returnText()` 方法对 `startActivity()` 的调用需要替换为对 `startActivityForResult()`\
  \ 的调用。与仅接受 `intent` 对象作为参数的 `startActivity()` 方法不同，`startActivityForResult()` 要求还要传递请求代码。请求代码可以是任意数值，用于识别哪个子活动与哪组返回数据相关。为了本例的演示，将使用请求代码\
  \ 5，这使我们得到了如下的修改后的 `MainActivity` 类：\n\n```java\npublic class MainActivity extends\
  \ AppCompatActivity {\n    private static final int request_code = 5;\n\n    @Override\n\
  \    public void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.main);\n    }\n\n    public void sendText(View\
  \ view) {\n        Intent i = new Intent(this, ActivityB.class);\n        final\
  \ EditText editText1 = findViewById(R.id.editText1);\n        String myString =\
  \ editText1.getText().toString();\n        i.putExtra(\"qString\", myString);\n\
  \        startActivity(i);\n        startActivityForResult(i, request_code);\n \
  \   }\n}\n```\n\n当子活动退出时，父活动的 `onActivityResult()` 方法被调用，并作为参数传递请求代码、一个表示成功的结果码，以及一个包含子活动返回的任何数据的\
  \ `intent` 对象。在 `MainActivity` 类类中，请实现此方法：\n\n```java\nprotected void onActivityResult(int\
  \ requestCode, int resultCode, Intent data) {\n    super.onActivityResult(requestCode,\
  \ data);\n    if (requestCode == request_code && resultCode == RESULT_OK) {\n  \
  \      TextView textView1 = findViewById(R.id.textView2);\n        String returnString\
  \ = data.getExtras().getString(\"qString\");\n        textView1.setText(returnString);\n\
  \    }\n}\n```\n\n## 54.9 从子活动返回数据\n\n为了让 `ActivityB` 能够向 `MainActivity` 返回数据，`ActivityB`\
  \ 必须作为 `MainActivity` 的子活动启动。这意味着 `MainActivity` 中 `returnText()` 方法对 `startActivity()`\
  \ 的调用需要替换为对 `startActivityForResult()` 的调用。与仅接受 `intent` 对象作为参数的 `startActivity()`\
  \ 方法不同，`startActivityForResult()` 要求还要传递请求代码。请求代码可以是任意数值，用于识别哪个子活动与哪组返回数据相关。为了本例的演示，将使用请求代码\
  \ 5。\n\n## 54.10 测试应用程序\n\n编译并运行应用程序，在 `MainActivity` 的文本字段中输入一个问题并点击“Send Text”按钮。当\
  \ `ActivityB` 出现时，将文本输入 `EditText`，并使用返回按钮或“Return Text”按钮返回 `MainActivity`，响应应该出现在文本视图中。\n\
  \n## 54.11 总结\n\n在上一章中涵盖了 intent 的基础知识后，本章的目标是在 Android Studio 中创建一个应用程序项目，用于演示显式\
  \ intent 的使用以及父活动与子活动之间数据传输的概念。\n\n## 55. Android 隐式 Intent – 实例演示\n\n在本章中，将在 Android\
  \ Studio 中创建一个示例应用程序，用于演示隐式 intent 的实际实现。目标是创建并发送一个意请求加载并显示特定网页的内容。由于示例应用程序本身不包含执行此任务的活动，将发布一个隐式\
  \ intent，以便触发 Android intent 解析算法来识别并启动另一个应用程序中的合适活动。\n\n## 55.1 创建 Android Studio\
  \ Implicit Intent 示例项目\n\n在欢迎界面上选择 New Project 快速启动选项，并在后续的新项目对话框中选择 Empty Activity\
  \ 模板，然后点击 Next 按钮。\n\n在 Name 字段中输入 `ImplicitIntent`，并指定包名为 `com.ebookfrenzy.implicitintent`。在点击\
  \ Finish 按钮之前，将 Minimum API level 设置更改为 `API 26: Android 8.0 (Oreo)`并将 Language\
  \ 菜单更改为 Java。\n\n\n\n\n`MainActivity` 类的用户界面非常简单，仅由一个 `ConstraintLayout`和一个 `Button`\
  \ 对象。在 Project（项目）工具窗口中，找到 `app -> res -> layout -> activity_main.xml` 文件并双击它将其加载到\
  \ Layout Editor（布局编辑器）工具中。\n\n删除默认的 `TextView`，并在启用 `Autoconnect`（自动连接）模式的情况下，放置一个\
  \ `Button` 组件，使其在布局中居中。请注意，按钮上的文本（“Show Web Page”）已提取到名为 `show_web_page` 的字符串资源。\n\
  \n![](img/as_4.1_implicit_intent_ui.jpg)\n\n图 55-1\n\n选中 `Button` 后，使用 Attributes（属性）工具窗口配置\
  \ `onClick` 属性，以调用名为 `showWebPage` 的方法。\n\n### 55.3 创建隐式意图\n\n如上所述，隐式意图将在名为 `showWebPage()`\
  \ 的方法内部创建并发出，而该方法反过来需要在 `MainActivity` 类中实现，而该类的代码位于 `MainActivity.java` 源文件中。在\
  \ Project 工具窗口中找到该文件并双击它将其加载到编辑面板。加载后，修改代码以添加 `showWebPage()` 方法以及一些必要的导入语句：\n\n\
  ```java\npackage com.ebookfrenzy.implicitintent;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  \nimport android.os.Bundle;\n\nimport android.net.Uri;\nimport android.content.Intent;\n\
  import android.view.View;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n \
  \       super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_implicit_intent);\n\
  \    }\n    public void showWebPage(View view) {\n        Intent intent = new Intent(Intent.ACTION_VIEW,\n\
  \                    Uri.parse(\"https://www.ebookfrenzy.com\"));\n        startActivity(intent);\n\
  \    }\n}\n```\n\n此方法执行的任务实际上非常简单。首先创建一个新的意图对象。然而，代码并没有指定意图的类名，而是使用 `ACTION_VIEW`\
  \ 选项指明意图的性质（向用户显示某些内容）。意图对象还包含一个包含要显示的 URL 的 `URI`。这向 Android 意图解析系统表明该活动正在请求显示网页。然后，意图通过调用\
  \ `startActivity()` 方法发出。\n\n在模拟器或物理 Android 设备上编译并运行应用程序，一旦运行，点击“Show Web Page”按钮。点击后，应该出现一个网页浏览器视图并加载由\
  \ URL 指定的网页。一个成功的隐式意图现在已经执行完毕。\n\n### 55.4 添加第二个匹配的活动\n\n本章的剩余部分将用于演示当设备上安装了多个符合隐式意图要求的活动时，其存在所产生的影响。为了实现这一点，将在设备或模拟器上创建并安装第二个应用程序。因此，首先在\
  \ Android Studio 中创建一个新项目，将应用程序名称设置为 `MyWebView`，使用与本章较早时候创建 `ImplicitIntent` 项目时相同的\
  \ SDK 配置选项，并再次选择 `Empty Activity`（空活动）。\n\n### 55.5 将 Web View 添加到 UI 中\n\n新 `MyWebView`\
  \ 项目中包含的唯一活动的用户界面将由一个 Android `WebView` 组件的实例组成。在 Project 工具窗口中，找到 `activity_main.xml`\
  \ 文件（该文件包含该活动的用户界面描述），并双击它将其加载到 Layout Editor 工具中。\n\n在 Layout Editor 工具的 Design\
  \ 模式下，选择默认的 `TextView` 组件并使用键盘删除键从布局中移除它。\n\n从调色板的 Widgets 部分将 `WebView` 对象拖放并到现有的\
  \ `ConstraintLayout` 视图上，如图 55-2\n\n图 55-2\n\n在继续之前，将 `WebView` 实例 ID 更改为 `webView1`，并使用\
  \ `Infer`（推断）约束按钮添加任何缺失的约束。\n\n### 55.6 获取 Intent URL\n\n当创建隐式意图对象以显示网页浏览器窗口时，要显示的网页\
  \ URL 将被封装在意图对象的 `Uri` 对象中。`MainActivity` 类中 `onCreate()` 方法的任务是从意图对象中提取此 `Uri`，将其转换为\
  \ URL 字符串并分配给 `WebView` 对象。为了实现此功能，修改 `MainActivity.java` 文件，使其读取如下：\n\n```java\n\
  package com.ebookfrenzy.mywebview;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  \nimport android.os.Bundle;\nimport java.net.URL;\nimport android.net.Uri;\nimport\
  \ android.content.Intent;\nimport android.webkit.WebView;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main_intent);\n\
  \        handleIntent();\n    }\n    private void handleIntent() {\n        Intent\
  \ intent = getIntent();\n        Uri data = intent.getData();\n        URL url =\
  \ null;\n        try {\n            url = new URL(data.getScheme(), data.getHost(),\
  \ data.getPath());\n        } catch (Exception e) {\n            e.printStackTrace();\n\
  \        }\n        WebView webView = findViewById(R.id.webView1);\n        webView.loadUrl(url.toString());\n\
  \    }\n}\n```\n\n添加到 `onCreate()` 的新代码执行以下任务：\n- 获取导致此活动的意图\n- 从意图中提取 `Uri` 数据\n\
  - 将 `Uri` 数据转换为 `URL` 对象\n- 获取用户界面中的 `WebView` 对象\n- 将 URL 加载到视图\n\nMyWebView 项目的代码部分已经完成。剩下的只是修改清单文件。\n\
  \n### 55.7 修改 MyWebView 项目清单文件\n\n在测试该项目之前，必须对 MainActivity 清单文件进行若干更改。首先，该活动需要访问互联网的权限（因为它需要加载网页）。这通过在清单文件中添加适当权限行来实现：\n\
  \n```xml\n<uses-permission android:name=\"android.permission.INTERNET\" />\n```\n\
  \n此外，查看 MyWebView 项目的 `AndroidManifest.xml` 文件的意图过滤器部分，将显示以下设置：\n\n```xml\n<intent-filter>\n\
  \    <action android:name=\"android.intent.action.MAIN\" />\n    <category android:name=\"\
  android.intent.category.LAUNCHER\" />\n</intent-filter>\n```\n\n在上述 XML 中，`android.intent.action.MAIN`\
  \ 表示该活动是在没有任何数据输入时应用程序的入口点。而 `android.intent.category.LAUNCHER` 指令表示该活动应该列在设备的应用程序启动器屏幕上。\n\
  \n由于该活动不需要作为应用程序的入口点、在没有数据输入（在此例中为 URL）的情况下无法运行且不需要出现在启动器中，因此该活动的清单文件中不需要 `MAIN`\
  \ 或 `LAUNCHER` 指令。\n\n然而，`MainActivity` 活动的意图过滤器确实需要修改，以表明它能够处理 `http` 数据方案的 `ACTION_VIEW`\
  \ 意图操作。\n\nAndroid 还要求任何能够处理隐式意图但不包含 `MAIN` 和 `LAUNCHER` 条目的活动，在意图过滤器中也包含所谓的 `browsable`\
  \ 和 `default` 类别。因此，修改后的意图过滤器部分应该如下：\n\n```xml\n<intent-filter>\n    <action android:name=\"\
  android.intent.action.VIEW\" />\n</intent-filter>\n```\n\n\n\n\n```xml\n<category\
  \ android:name=\"android.intent.category.BROWSABLE\" />\n<category android:name=\"\
  android.intent.category.DEFAULT\" />\n<data android:scheme=\"http\" android:host=\"\
  www.ebookfrenzy.com\" />\n</intent-filter>\n```\n\n注意上述的 `android:host` 条目引用了一个特定的\
  \ URL。也可以使用通配符，例如支持所有的 URL：\n\n```xml\n<data android:scheme=\"http\" android:host=\"\
  *\" />\n```\n\n将这些要求结合在一起，得到了完整的 `AndroidManifest.xml` 文件：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.mywebview\" >\n    <uses-permission android:name=\"\
  android.permission.INTERNET\" />\n    <application\n        android:allowBackup=\"\
  true\"\n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\
  \n        android:theme=\"@style/AppTheme\" >\n        <activity\n            android:name=\"\
  .MainActivity\"\n            android:label=\"@string/app_name\" >\n            <intent-filter>\n\
  \                <action android:name=\"android.intent.action.VIEW\" />\n      \
  \          <category android:name=\"android.intent.category.BROWSABLE\" />\n   \
  \             <category android:name=\"android.intent.category.DEFAULT\" />\n  \
  \              <data android:scheme=\"https\" android:host=\"www.ebookfrenzy.com\"\
  />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n\
  ```\n\n通过双击 Project 窗口中的名称将 `AndroidManifest.xml` 文件加载到 manifest 编辑器中。一旦加载后，修改 XML\
  \ 以匹配上述更改。对 manifest 文件进行适当修改后，新的 activity 就可以准备好安装到设备上了。\n\n### 5.8 在设备上安装 WebView\
  \ 包\n\n在 `WebView` 主活动可以作为隐式意图的接收者之前，必须先将其安装到设备上。这通过正常方式运行应用程序来实现。由于 manifest 文件既不包含\
  \ `android.intent.action.MAIN` 也不包含 `android.intent.category.LAUNCHER`，因此需要指示 Android\
  \ Studio 安装但不启动该应用。要配置此行为，请从工具栏上选择 `app -> Edit configurations...` 菜单，如图 5-3 所示：\n\
  \n![](img/as_3.5_implicit_intent_edit_configuration.jpg)\n图 5-3\n\n在 `Run/Debug\
  \ Configurations` 对话框中，将位于 `Launch Options` 部分的 `Launch` 选项改为 `Nothing`，然后点击 `Apply`\
  \ 最后点击 `OK`：\n\n![](img/as_3.5_implicit_intent_launch_nothing.jpg)\n图 5-4\n\n使用此设置照常运行程序。注意，应用已安装到设备上，但并未启动。\n\
  \n### 5.9 测试应用程序\n\n为了测试 `WebView`，只需重新启动本章之前创建的隐式意图，并点击 `Show Web Page` 按钮。然而，这次意图解析过程将找到两个与隐式意图匹配的带有过滤活动。因此，系统将显示一个对话框（图\
  \ 5-5），为用户提供要启动活动的选择。\n\n![](img/as_4.1_implicit_intent_chooser.jpg)\n图 5-5\n\n\
  选择 `WebView` 选项后点击 `OK`，将导致意图由我们新的 `WebView` 主活动处理，该活动随后出现并显示指定的网页。如果网页加载到 `Chrome`\
  \ 浏览器而没有出现选择对话框，可能是 `Chrome` 已被配置为设备上的默认浏览器。可以通过进入设备上的 `Settings -> Apps & notifications`\
  \ 然后点击 `App info` 来更改。向下滚动应用列表并选择 `Chrome`。在 `Chrome app info` 屏幕上，点击高级设置中的 `Open\
  \ by default` 选项，然后点击 `Clear Defaults`。\n\n### 5.10 总结\n\n隐式意图提供了一种机制，一个活动可以通过指定操作类型以及（可选的）在该操作上要执行的数据，来请求另一个活动的服务。然而，为了成为隐式意图的目标，一个活动必须配置为从传入的意图中提取适当的数据，并被包含在配置正确的\
  \ manifest 文件中，其中应包括适当的权限和意图过滤器。当在意图解析搜索期间发现多个与隐式意图匹配的活动时，系统会提示用户选择使用哪一个。在本章中，创建了一个示例来演示隐式意图的发送以及能够处理此类意图的示例活动的创建。\n\
  \n# 56. Android 广播意图和广播接收器\n\n除了提供一种启动应用程序活动的机制外，意图还被用于向系统中的其他组件广播系统范围的消息。这涉及广播意图（Broadcast\
  \ Intents）和广播接收器（Broadcast Receivers）的实现，两者都是本章的主题。\n\n## 56.1 广播意图概述\n\n广播意图是 `Intent`\
  \ 对象，通过调用 `Activity` 类的 `sendBroadcast()`、`sendStickyBroadcast()` 或 `sendOrderedBroadcast()`\
  \ 方法进行广播（后者在需要从广播中获取结果时使用）。除了在应用程序组件之间提供消息传递和事件系统外，广播意图还被 Android 系统用于通知感兴趣的应用有关关键系统事件（例如外部电源或耳机被连接或断开）。\n\
  \n在创建广播意图时，除了可选的数据和分类字符串外，它必须包含一个操作字符串。与标准意图一样，使用键值对结合意图对象的 `putExtra()` 方法将数据添加到广播意图中。可选的分类字符串可以通过调用\
  \ `addCategory()` 方法分配给广播意图。\n\n标识广播事件的操作字符串必须是唯一的，通常使用应用程序包名的语法。例如，下面的代码片段创建并发送了一个包含唯一操作字符串和数据的广播意图：\n\
  \n```java\nIntent intent = new Intent();\nintent.setAction(\"com.example.Broadcast\"\
  );\nintent.putExtra(\"MyData\", 1000);\nsendBroadcast(intent);\n```\n\n上述代码将在运行\
  \ Android 3.0 的设备上成功启动相应的广播接收器。然而，在较新的 Android 版本上，该意图不会被广播接收器接收。这是因为 Android 3.0\
  \ 引入了启动控制安全措施，防止通过意图启动停止的应用组件。如果应用程序刚刚安装且尚未启动过，或者被用户使用设备上的应用程序管理器手动停止，则该应用程序被认为处于停止状态。为了解决这个问题，可以在发送意图之前向意图添加一个标记，以指示允许启动停止的应用的组件。该标记是\
  \ `FLAG_INCLUDE_STOPPED_PACKAGES`，并将按述之前代码的适配方式使用：\n\n```java\nIntent intent = new\
  \ Intent();\nintent.addFlags(Intent.FLAG_INCLUDE_STOPPED_PACKAGES);\nintent.setAction(\"\
  com.example.Broadcast\");\nintent.putExtra(\"MyData\", 1000);\nsendBroadcast(intent);\n\
  ```\n\n## 56.2 广播接收器概述\n\n\n\n\n\n# 广播接收器 (Broadcast Receivers)\n\n应用程序通过注册广播接收器来监听特定的广播意图。广播接收器通过扩展\
  \ Android `BroadcastReceiver` 类并重写 `onReceive()` 方法来实现。广播接收器可以注册在代码中（例如在 `activity`\
  \ 内部），也可以注册在清单文件中。注册实现的一部分工作涉及创建意图过滤器（intent filters），以指示接收器需要监听的特定广播意图。这是通过引用广播意图的动作（action）字符串来实现。当检测到匹配的广播时，会调用广播接收器的\
  \ `onReceive()` 方法，此时该方法有 5 秒的时间来执行任何必要的任务然后返回。需要注意的是，广播接收器不需要一直运行。当检测到匹配的意图时，Android\
  \ 运行时系统会自动启动广播接收器并调用 `onReceive()` 方法。\n\n以下代码概述了一个广播接收器子类的模板：\n\n```java\npackage\
  \ com.example.broadcastdetector;\n\nimport android.content.BroadcastReceiver;\n\
  import android.content.Context;\nimport android.content.Intent;\n\npublic class\
  \ MyReceiver extends BroadcastReceiver {\n    public MyReceiver() {\n    }\n\n \
  \   @Override\n    public void onReceive(Context context, Intent intent) {\n   \
  \     // 在检测到广播时\n        // 在此处执行的代码\n    }\n}\n```\n\n在清单文件中注册广播接收器时，必须为接收器添加一个\
  \ `<receiver>` 条目。以下示例清单文件注册了上述示例广播接收器：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.example.broadcastdetector.broadcastdetector\"\n    android:versionCode=\"\
  1\"\n    android:versionName=\"1.0\" >\n    <uses-sdk android:minSdkVersion=\"17\"\
  \ />\n    <application\n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"\
  @string/app_name\" >\n        <receiver android:name=\"MyReceiver\" >\n        </receiver>\n\
  \    </application>\n</manifest>\n```\n\n在 Android 8.0 之前的 Android 版本上运行时，与接收器相关的意图过滤器可以放置在清单文件的\
  \ `receiver` 元素中，如下所示：\n\n```xml\n<receiver android:name=\"MyReceiver\" >\n    <intent-filter>\n\
  \        <action android:name=\"com.example.Broadcast\" >\n        </action>\n \
  \   </intent-filter>\n</receiver>\n```\n\n在 Android 8.0 或更高版本上，必须使用 `Activity` 类的\
  \ `registerReceiver()` 方法在代码中注册接收器，并配合适当的 `IntentFilter` 对象：\n\n```java\nIntentFilter\
  \ filter = new IntentFilter(\"com.example.Broadcast\");\nMyReceiver receiver = new\
  \ MyReceiver();\nregisterReceiver(receiver, filter);\n```\n\n当代码中注册的广播接收器不再需要时，可以通过调用\
  \ `activity` 类的 `unregisterReceiver()` 方法来注销，并将接收器对象的引用作为参数。例如，以下代码将注销上述广播接收器：\n\
  \n```java\nunregisterReceiver(receiver);\n```\n\n需要注意的是，某些系统广播意图只有在接收器注册在代码中而非清单文件中时才能被广播接收器检测到。请查看\
  \ Android `Intent` 类文档获取有关系统广播意图及相应要求的详细概述：\n\n`https://developer.android.com/reference/android/content/Intent`\n\
  \n## 56.3 从广播中获取结果\n\n当使用 `sendBroadcast()` 方法发送广播意图时，发起的 activity 无法从接收该广播的任何广播接收器获取结果。如果需要返回结果，则必须使用\
  \ `sendOrderedBroadcast()` 方法。当使用此方法发送广播意图时，它将按顺序依次传递给每个注册了感兴趣的广播接收器。\n\n调用 `sendOrderedBroadcast()`\
  \ 方法时带有多个参数，包括指向另一个广播接收器的引用（称为结果接收器），该接收器将在所有广播接收器处理完意图后被通知，以及一组供这些接收器放置结果数据的数据引用集合。当所有广播接收器都获得机会处理广播后，将调用结果接收器的\
  \ `onReceive()` 方法并传递结果数据。\n\n## 56.4 粘性广播意图 (Sticky Broadcast Intents)\n\n默认情况下，广播意图一旦发送并被任何感兴趣的广播接收器处理就会消失。然而，广播意图可以被定义为“粘性”。粘性意图及其包含的数据在完成后仍然存在于系统中。可以通过调用\
  \ `registerReceiver()` 的返回值（使用通常的参数：广播接收器和意图的引用）获取存储在粘性意图中的数据。许多 Android 系统广播都是粘性的，一个典型的例子是与电池状态相关的广播。\n\
  \n粘性广播可以通过调用 `removeSticky()` 随时移除，并将广播意图作为参数传递。\n\n## 56.5 广播意图示例\n\n本章的剩余部分将通过创建一个运行中的广播意图\
  \ Android Studio 示例。在第一个实例中，将创建一个简单的应用程序，用于发布自定义广播意图。然后将创建一个相应的广播接收器，它在检测到广播时会在\
  \ Android 设备的屏幕上显示消息。最后，将修改广播接收器以检测系统关于外部电源已从设备断开通知。\n\n## 56.6 创建示例应用程序\n\n从欢迎界面选择\
  \ `Create New Project`（新建项目）快速启动选项，并在出现的新项目对话框中，点击 `Next` 按钮之前选择 `Empty Activity`\
  \ 模板。\n\n在 `Name` 字段输入 `SendBroadcast`，指定 `com.ebookzy.sendbroadcast` 为包名。在点击 `Finish`\
  \ 按钮之前，将 `Minimum API` 级别设置为 `API 26: Android 8.0 (Oreo)`，并将 `Language` 菜单设置为 `Java`。\n\
  \n新项目创建后，找到并加载 Project 窗口中 `app -> res -> layout` 下的 `activity_main.xml` 布局文件，并在布局编辑器的\
  \ Design 模式下，将 `TextView` 对象替换为 `Button` 视图，并设置文本属性为“Send Broadcast”。一旦设置了文本值，按照通常步骤将其提取到命名为\
  \ `send_broadcast` 的资源。\n\n在布局中选中按钮的情况下，在 Attributes 面中找到 `onClick` 属性并将其配置为调用名为\
  \ `broadcastIntent` 的方法。\n\n## 56.7 创建并发送广播意图\n\n已经创建了 `SendBroadcast` 应用程序的框架，现在是实现发送广播意图的代码了。这涉及实现之前指定的作为用户界面\
  \ `Button` 视图 `onClick` 目标的 `broadcastIntent()` 方法。找到并双击 `MainActivity.java` 文件并对其进行修改以添加发送广播意图的代码。修改后，该类的源代码应如下：\n\
  \n```java\npackage com.ebookzy.sendbroadcast;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  import android.os.Bundle;\nimport android.content.Intent;\nimport android.view.View;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n```\n\n\n\n\n\n```java\n        super.onCreate(savedInstanceState);\n\
  \n        setContentView(R.layout.activity_send_broadcast);\n\n    }\n\n    public\
  \ void broadcastIntent(View view)\n    {\n        Intent intent = new Intent();\n\
  \        intent.setAction(\"com.ebookfrenzy.sendbroadcast\");\n        intent.addFlags(Intent.FLAG_INCLUDE_STOPPED_PACKAGES);\n\
  \        sendBroadcast(intent);\n    }\n}\n```\n\n请注意，在此实例中，意图动作字符串为 `com.ebookfrenzy.sendbroadcast`。当在本章后续章节中创建广播接收器类时，意图过滤器（intent\
  \ filter）声明必须与此动作字符串匹配。\n\n到此，发送广播意的应用创建结束。剩下的工作是构建一个匹配的广播接收器。\n\n## 56.8 创建广播接收器\n\
  \n为了创建广播接收器，需要创建一个自 `BroadcastReceiver` 超类的新类。在 Project（项目）工具窗口中，导航到 `app` -> `java`\
  \ 并右键点击包名。在弹出的菜单中，选择 `New` -> `Other` -> `Broadcast Receiver` 菜单选项，将类命名为 `MyReceiver`，并确保选择了\
  \ `Exported`（导出）和 `Enabled`（启用）选项。这些设置允许 Android 系统在需要时启动接收器，并确保该类可以接收设备上其他应用程序发送的消息。配置好类后，点击\
  \ `Finish`。\n\n一旦创建，Android Studio 将自动将新的 `MyReceiver.java` 类文件加载到编辑器中，其内容如下：\n\n\
  ```java\npackage com.ebookfrenzy.sendbroadcast;\n\nimport android.content.BroadcastReceiver;\n\
  \nimport android.content.Context;\nimport android.content.Intent;\n\npublic class\
  \ MyReceiver extends BroadcastReceiver {\n\n    @Override\n    public void onReceive(Context\
  \ context, Intent intent) {\n        // TODO: 当 BroadcastReceiver 接收到\n        //\
  \ Intent 广播时，会调用此方法。\n        throw new UnsupportedOperationException(\"Not yet\
  \ implemented\");\n    }\n}\n```\n\n如代码所示，Android Studio 已为新类生成了模板，并为 `onReceive()`\
  \ 方法生成了存根方法。现在需要对该类进行一些更改以实现所需的功能。因此，在 `MyReceiver.java` 文件中，修改代码使其如下所示：\n\n```java\n\
  package com.ebookfrenzy.sendbroadcast;\n\nimport android.content.BroadcastReceiver;\n\
  \nimport android.content.Context;\nimport android.content.Intent;\nimport android.widget.Toast;\n\
  \npublic class MyReceiver extends BroadcastReceiver {\n\n    public MyReceiver()\
  \ {\n\n    }\n\n    @Override\n    public void onReceive(Context context, Intent\
  \ intent) {\n        // TODO: 当 BroadcastReceiver 接收到\n        // Intent 广播时，会调用此方法。\n\
  \        throw new UnsupportedOperationException(\"Not yet implemented\");\n   \
  \     Toast.makeText(context, \"Broadcast Intent Detected.\",\n                \
  \     Toast.LENGTH_LONG).show();\n    }\n}\n```\n\n广播接收器的代码现在已经完成。\n\n## 56.9 注册广播接收器\n\
  \n项目需要公开广播接收器的存在，并且必须包含一个意图过滤器以指定接收器感兴趣的广播意图。当在上一节创建 `BroadcastReceiver` 类时，Android\
  \ Studio 自动在清单文件中添加了 `<receiver>` 元素。因此，剩下的工作是在 `MainActivity.java` 文件中添加代码以创建意图过滤器并注册接收器：\n\
  \n```java\npackage com.ebookfrenzy.sendbroadcast;\n\n// ...\n\nimport android.content.BroadcastReceiver;\n\
  import android.content.IntentFilter;\n\n// ...\n\npublic class MainActivity extends\
  \ AppCompatActivity {\n    BroadcastReceiver receiver;\n\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.activity_send_broadcast);\n        configureReceiver();\n\
  \    }\n\n    private void configureReceiver() {\n        IntentFilter filter =\
  \ new IntentFilter();\n        filter.addAction(\"com.ebookfrenzy.sendbroadcast\"\
  );\n        receiver = new MyReceiver();\n        registerReceiver(receiver, filter);\n\
  \    }\n\n    @Override\n    protected void onDestroy() {\n        super.onDestroy();\n\
  \        unregisterReceiver(receiver);\n    }\n}\n```\n\n## 56.10 测试广播\n\n为了测试广播，请在\
  \ AVD（安卓虚拟设备）上运行应用并等待其出现。运行后，点击按钮，此时“Broadcast Intent Detected.”的 toast 消息应该弹出几秒钟。\n\
  \n## 56.11 监听系统广播\n\n本示例的最后一个阶段是修改意图过滤器，以监听当外部电源断开设备时广播的系统意图。该动作是 `Intent.ACTION_POWER_DISCONNECTED`。修改\
  \ `MainActivity.java` 文件中的 `configureReceiver()` 方法以添加此过滤器：\n\n```java\nprivate\
  \ void configureReceiver() {\n    IntentFilter filter = new IntentFilter();\n  \
  \  filter.addAction(\"com.ebookfrenzy.sendbroadcast\");\n    filter.addAction(Intent.ACTION_POWER_CONNECTED);\n\
  \    receiver = new MyReceiver();\n    registerReceiver(receiver, filter);\n}\n\
  ```\n\n由于 `onReceive()` 方法现在将监听两种广播，值得修改代码将当前意图的动作字符串也显示在 toast 消息中。此字符串可以通过调用作为参数传递给\
  \ `onReceive()` 方法的 `intent` 对象的 `getAction()` 方法获取：\n\n```java\npublic void onReceive(Context\
  \ context, Intent intent) {\n    String message = \"Broadcast detected \" + intent.getAction();\n\
  \    Toast.makeText(context, message, Toast.LENGTH_LONG).show();\n}\n```\n\n通过重新安装修改后的\
  \ Receiver 包来测试接收器。在 SendBroadcast 应用中点击按钮现在会产生包含自定义动作字符串的新消息：\n\n`Broadcast detected\
  \ com.ebookfrenzy.sendbroadcast`\n\n接下来，断开当前为 Android 设备供电 USB 连接器，此时接收器应在 toast\
  \ 消息中报告。如果应用运行在模拟器上，请显示扩展控制，选择电池选项并将充电器连接设置为 None：\n\n`Broadcast detected android.intent.action.disconnected`\n\
  \n为了避免每次断开电源时都出现此消息，请启动设备上的设置应用并选择应用与通知。从结果列表中选择 BroadcastReceiver 应用并点击卸载。\n\n\
  ## 56.12 总结\n\n广播意图是一种用于向多个组件分发意图的机制。通过注册 `BroadcastReceiver` 可以检测广播，该接收器被配置为监听匹配特定动作字符串的意图。通常情况下，广播接收器处于休眠状态，直到检测到匹配的意图时被系统唤醒。Android\
  \ 系统也使用广播意图来发布低电量警告以及外部电源连接或断开的通知。\n\n本章不仅提供了广播接收器的概述，还通过了一个发送广播意图以及实现监听自定义和系统广播的接收器的示例。\n\
  \n\n\n\n下一章将是系列章节的第一章，旨在介绍如何使用 Android 服务在后台执行应用程序任务。然而，如果首先对 Android 应用程序中的线程概念有基本的了解，将无法理解实现服务的各个步骤。因此，线程和\
  \ `AsyncTask` 类是本章的主题。\n\n## 57.1 线程概述\n\n线程是任何多任务操作系统的基石，可以被认为是运行在主进程中的微进程，其目的是让应用程序内部至少出现并行执行路径。\n\
  \n## 57.2 应用程序主线程\n\n当 Android 应用程序首次启动时，运行时系统会创建一个线程，所有应用程序组件默认将在该线程中运行。此线程通常被称为主线程。主线程的主要作用是处理用户界面的事件处理以及与用户界面视图的交互。应用程序中启动的任何额外组件默认情况下也会运行在主线程上。\n\
  \n应用程序中任何使用主线程执行耗时任务的组件都将导致整个应用程序看起来处于锁死状态，直到任务完成为止。这通常会导致操作系统向用户显示“应用程序未响应”的警告。显然，这远不是任何应用程序所期望的行为。这可以通过简单将要执行的任务启动在单独的线程来避免，允许主线程不受干扰地继续执行其他任务。\n\
  \n## 57.3 线程处理器\n\n显然，Android 开发的关键规则之一是永远不要在应用程序的主线程执行耗时操作。第二个同样重要的规则是，单独线程中的代码在任何情况下都绝不能直接更新用户界面的任何部分。对用户界面的任何更改必须始终在主线程中执行。此的原因是\
  \ Android UI 工具包不是线程安全的。在多个线程中尝试处理非线程安全的代码通常会导致间歇性问题和不可预测的应用程序行为。\n\n如果一个耗时任务需要在后台线程中运行并同时更新用户界面，最佳方法是通过子类化\
  \ `AsyncTask` 类来实现一个异步任务。\n\n## 57.4 基础 AsyncTask 示例\n\n本章的剩余部分将通过一些示例来介绍线程和 `AsyncTask`\
  \ 类的使用。第一步将强调在主线程之外的单独线程中执行耗时任务的重要性。\n\n从欢迎界面选择“创建新项目”（Create New Project）快速启动选项，在出现的新项目对话框中，点击`Next`按钮之前选择“空活动”（Empty\
  \ Activity）模板。\n\n在 `Name` 字段中输入 `AsyncDemo`，并指定 `com.ebookfrenzy.asyncdemo` 为包名。在点击`Finish`按钮之前，将最小\
  \ API 级别更改为 `API 26`: Android 8.0 (Oreo)，并将语言菜单更改为 `Java`。\n\n将项目的 `activity_main.xml`\
  \ 文件加载到布局编辑器（Layout Editor）工具中。选择默认的 `TextView` 组件，并在属性工具窗口中将视图的 ID 更改为 `myTextView`。\n\
  \n在用户界面上添加一个 `Button` 视图，直接置在现有 `TextView` 对象下方，如图图 57-1 所示。添加按钮后，点击工具栏上的“推断约束”（Infer\
  \ Constraints）按钮以添加任何缺失的约束。\n\n将文本更改为“Press Me”，并将字符串提取到名为 `press_me` 的资源。在布局中仍选定按钮视图的情况下，找到\
  \ `onClick` 属性并输入 `buttonClick` 作为方法名。\n\n![](img/as_4.1_async_demo_ui.jpg)\n\n\
  图 57-1\n\n接下来，将 `MainActivity.java` 文件加载到编辑面板中，并添加代码实现 `buttonClick()` 方法，该方法将在用户触摸\
  \ `Button` 视图时被调用。由于这里的目标是演示在主线程上执行长时间任务的问题，代码将简单地暂停 20 秒，然后在 `TextView` 对象上显示不同的不同的文本：\n\
  \n```java\npackage com.ebookfrenzy.asyncdemo;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  \nimport android.os.Bundle;\nimport android.view.View;\nimport android.widget.TextView;\n\
  \npublic class MainActivity extends AppCompatActivity {\n\n    private TextView\
  \ myTextView;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \        myTextView = findViewById(R.id.myTextView);\n    }\n\n    public void buttonClick(View\
  \ view) {\n        int i = 0;\n        while (i <= 20) {\n            try {\n  \
  \              Thread.sleep(1000);\n                i++;\n            } catch (Exception\
  \ e) {\n            }\n        }\n        myTextView.setText(\"Pressed\");\n   \
  \ }\n}\n```\n\n代码完成后，在物理设备或模拟器上运行应用程序。一旦应用程序运行，触摸按钮，此时应用程序将看起来冻结。例如，将无法第二次触摸按钮，在某些情况下，操作系统将报告应用程序未响应：\n\
  \n![](img/2)\n\n显然，`buttonClick()` 方法中任何需要时间的操作都需要在单独的线程中执行。\n\n## 57.5 子类化 AsyncTask\n\
  \n为了创建一个新线程，在该线程中执行的代码需要在 `AsyncTask` 实例中执行。第一步是在 `MainActivity.java` 文件中如下所示子类化\
  \ `AsyncTask`：\n\n```java\nimport android.os.AsyncTask;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n\n    private class MyTask extends AsyncTask<String,\
  \ Void, String> {\n\n        @Override\n        protected void onPreExecute() {\n\
  \        }\n\n        @Override\n        protected String doInBackground(String...\
  \ params) {\n        }\n\n        @Override\n        protected void onProgressUpdate(Void...\
  \ values) {\n        }\n\n        @Override\n        protected void onPostExecute(String\
  \ result) {\n        }\n    }\n}\n```\n\n`AsyncTask` 类使用了三个不同的类型，在类签名中声明如下：`private\
  \ class MyTask extends AsyncTask<Type 1, Type 2, Type 3>`\n\n这三个类型分别对应 `doInBackground()`、`onProgressUpdate()`\
  \ 和 `onPostExecute()` 方法的参数类型。如果方法不期望参数，则使用 `Void`，上述代码中的 `onProgressUpdate()` 就是如此。要更改方法的参数类型，需要在类声明和方法签名中更改类型声明。对于此示例，`onProgressUpdate()`\
  \ 方法将传递一个 `Integer`，因此修改类声明如下：\n\n```java\nprivate class MyTask extends AsyncTask<String,\
  \ Integer, String> {\n\n    @Override\n    protected void onProgressUpdate(Integer...\
  \ values) {\n    }\n}\n```\n\n`onPreExecute()` 方法在后台任务启动之前调用，可执行初始化步骤。此方法运行在主线程上，因此可以用于更新用户界面。\n\
  \n\n\n在后台通过不同主线程的线程执行的代码位于 `doInBackground()` 方法中。此方法无法访问主线程，因此无法对用户界面进行更改。然而，每当从\
  \ `doInBackground()` 方法调用 `publishProgress()` 方法时，`onProgressUpdate()` 方法就会被调用，并可用进度信息更新用户界面。\n\
  \n当 `doInBackground()` 方法中执行的任务完成后，会调用 `onPostExecute()` 方法。此方法接收 `doInBackground()`\
  \ 方法返回的值并在主线程中运行，允许对用户界面进行更新。\n\n修改代码，将计时器代码从 `buttonClick()` 方法移动到 `doInBackground()`\
  \ 方法，如下：\n\n```java\n@Override\nprotected String doInBackground(String... params)\
  \ {\n    int i = 0;\n    while (i <= 20) {\n        try {\n            Thread.sleep(1000);\n\
  \            i++;\n        }\n        catch (Exception e) {\n            return(e.getLocalizedMessage());\n\
  \        }\n    }\n    return \"Button Pressed\";\n}\n```\n\n接下来，将 TextView 更新代码移动到\
  \ `onPostExecute()` 方法中，它将显示由 `doInBackground()` 方法返回的文本：\n\n```java\n@Override\n\
  protected void onPostExecute(String result) {\n    myTextView.setText(result);\n\
  }\n```\n\n为了通过 `doInBackground()` 方法提供定期更新，修改类并在计时器循环代码中添加对 `publishProgress()`\
  \ 方法的调用（传递当前的循环计数器），并在 `onProgressUpdate()` 方法中显示当前计数值：\n\n```java\n@Override\n\
  protected String doInBackground(String... params) {\n    int i = 0;\n    while (i\
  \ <= 20) {\n        publishProgress(i);\n        try {\n            Thread.sleep(1000);\n\
  \            i++;\n        }\n        catch (Exception e) {\n            return(e.getLocalizedMessage());\n\
  \        }\n    }\n    return \"Button Pressed\";\n}\n\n@Override\nprotected void\
  \ onProgressUpdate(Integer... values) {\n    myTextView.setText(\"Counter = \" +\
  \ values[0]);\n}\n```\n\n最后，修改 `buttonClicked()` 方法以开始异步任务执行：\n\n```java\npublic\
  \ void buttonClick(View view) {\n    AsyncTask task = new MyTask().execute();\n\
  }\n```\n\n默认情况下，异步任务是串行执行的。换句话说，如果应用执行了多个任务，只有第一个任务会开始执行。其余任务被放置在队列中，并在每个任务完成后按顺序执行。要并行执行异步任务，这些任务必须使用\
  \ `AsyncTask` 线程池执行器执行，如下：\n\n```java\nAsyncTask task = new MyTask().executeOnExecutor(AsyncTask.THREAD_POOL_EXECUTOR);\n\
  ```\n\n使用此方法并行执行的任务数量受设备上核心池大小的限制，而该大小又由可用 CPU 核心数的决定。在应用内部可以使用以下代码识别设备上的可用 CPU\
  \ 核心数：\n\n```java\nint cpu_cores = Runtime.getRuntime().availableProcessors();\n\
  ```\n\nAndroid 使用算法来计算默认池线程数。最小线程数为 2，而最大默认值等于 4 或 CPU 核心数减 1（取两者中较小者）。任何设备上池可用的最大线程数是通过\
  \ CPU 核心数乘以倍加 1 计算出的。\n\n## 57.6 测试应用程序\n\n现在运行应用程序时，点击按钮会导致延迟在新线程中执行，让主线程继续处理用户界面，包括响应额外的按钮点击。在延迟期间，用户界面每秒更新一次以显示计数器值。超时完成后，TextView\
  \ 将显示“Button Pressed”消息。\n\n## 57.7 取消任务\n\n正在运行的任务可以通过调用任务对象的 `cancel()` 方法来取消，并传递一个布尔值，表示在正在进行的任务完成之前是否可以中断任务：\n\
  \n```java\nAsyncTask task = new MyTask().execute();\ntask.cancel(true);\n```\n\n\
  ## 57.8 总结\n\n本章概述了 Android 中的多线程处理。当应用程序首次启动时，运行时系统会创建一个主线程来处理用户界面，因此，耗时任务必须在单独线程中执行。由于\
  \ Android 界面工具包不是线程安全的，不应在主线程之外任何线程中对用户界面进行更改。可以通过子类 `AsyncTask` 类并实现其方法在单独线程中执行后台任务。\n\
  \n## 58. 启动（Started）服务和绑定（Bound）服务的概述\n\n`Service` 类专门设计用于允许应用程序启动并执行后台任务。与旨在快速执行任务后退出的广播接收器不同，服务设计用于执行耗时较的任务（例如通过互联网连接下载文件或流音乐），但不需要用户界面。在本章中，将涵盖可用不同类型服务的概述，包括启动服务、绑定服务和\
  \ `IntentService`。\n\n## 58.1 启动服务（Started Services）\n\n启动服务由其他组件（如 Activity 甚至广播接收器）启动，并可能在后台无限运行，直到服务停止或被运行时系统销毁以释放资源。如果启动它的应用程序不再处于前台，即使在启动服务的组件被销毁的情况下，服务也会继续运行。\n\
  \n默认情况下，服务将运行在启动它的应用程序相同的进程线程中（称为本地服务）。因此，确保任何 CPU 密集型任务在新线程中执行是非常重要的。除非服务在清单文件中被专门配置为私有（再次通过清单文件设置），否则该服务可以由同一\
  \ Android 设备上的其他组件启动。这是通过使用 `Intent` 机制实现的，正如前面的章节所述，一个 Activity 可以启动另一个 Activity\
  \ 一样。\n\n启动服务通过调用 `startService()` 启动，并传递一个标识要启动服务的 `Intent` 对象。当启动服务完成任务后，应通过调用\
  \ `stopSelf()` 停止自己。或者，运行的服务可以由另一个组件通过调用 `stopService()` 来停止，并传递一个匹配的用于停止服务的 `Intent`。\n\
  \nAndroid 系统赋予服务较高的优先级，它们通常是释放资源时最后被终止的项。\n\n## 58.2 Intent 服务（Intent Service）\n\
  \n正如前面所述，服务默认情况下运行在与启动它的组件相同的进程主线程中。因此，任何由服务执行的 CPU 密集型任务都应在新线程中进行，从而避免影响调用应用程序的性能。\n\
  \n\n\n\n\n# IntentService\n\n`IntentService` 类是一个便利类（继承自 `Service` 类），它会设置一个工作线程来处理后台任务，并以异步方式处理每个请求。一旦服务处理了所有队列中的请求，它就会直接退出。使用\
  \ `IntentService` 类时，只需要实现 `onHandleIntent()` 方法，并在其中包含为每个请求要执行的代码即可。\n\n对于不需要对请求进行同步处理的服务，`IntentService`\
  \ 是推荐的选项。然而，需要同步处理请求的服务则需要从 `Service` 类进行子化，并手动实现和管理线程，以高效地处理任何 CPU 密集型任务。\n\n##\
  \ 58.3 绑定服务 (Bound Service)\n\n绑定服务与启动服务（started service）类似，区别在于启动服务通常不会返回结果，也不允许与启动它的组件进行交互。相比之下，绑定服务允许启动组件与服务进行交互并从服务处接收结果。通过进程间通信（IPC）的实现，这种交互也可以跨越进程边界进行。例如，一个\
  \ Activity 可以启动一个服务来处理音频播放。该 Activity 极可能包含一个用户界面，为用户提供控制控件，用于暂停播放或跳到下一曲。同样，该服务也很可能需要向调用的\
  \ Activity 通信信息，指示当前音频轨道已完成，并提供即将开始播放的下一目的详细信息。\n\n组件（在此上下文中也称为客户端）通过调用 `bindService()`\
  \ 方法启动并绑定到绑定服务。此外，多个组件可以同时绑定到一个服务。当客户端不再需要服务绑定关系时，应该调用 `unbindService()` 方法。当最后一个绑定的客户端从服务上解绑时，Android\
  \ 运行时系统将终止该服务。需要注意的是，绑定服务也可以通过调用 `startService()` 来启动。一旦启动，组件就可以通过 `bindService()`\
  \ 调用绑定到它。当通过调用 `startService()` 启动绑定服务时，即使在最后一个客户端从其解绑后，它也将继续运行。\n\n绑定服务必须包含 `onBind()`\
  \ 方法的实现，该方法在服务首次创建以及其他客户端随后绑定到正在运行的服务时都会被调用。该方法的目的是向绑定的客户端返回一个类型为 `IBinder` 的对象，该对象包含了客户端与服务通信所需的信息。\n\
  \n在实现客户端与绑定服务之间的通信方面，推荐的技术取决于客户端和服务是否位于相同或不同的进程中，以及服务是否对客户端私有。本地通信可以通过扩展 `Binder`\
  \ 类并从 `onBind()` 方法返回一个实例来实现。另一方面，进程间通信则需要 `Messenger` 和 `Handler` 的实现。这两种方法的细节将在后面的章节中介绍。\n\
  \n## 58.4 服务的结构 (The Anatomy of a Service)\n\n正如提到的，服务必须创建为 Android `Service` 类的子类（具体为\
  \ `android.app.Service`）或其子类（如 `android.app.IntentService`）。在子化过程中，取决于所创建服务的具体性质，必须重写以下一个或多个父类回调方法：\n\
  \n- `onStartCommand()` – 当另一个组件通过调用 `startService()` 方法启动服务时调用的方法。绑定服务不需要实现此方法。\n\
  - `onBind()` – 当组件通过调用 `bindService()` 方法绑定到服务时调用。在实现绑定服务时，此方法必须返回一个 `IBinder` 对象以促进与客户端的通信。对于启动服务，此方法必须实现并返回\
  \ `NULL` 值。\n- `onCreate()` – 旨在执行初始化任务的位置，该方法在调用 `onStartCommand()` 或第一次调用 `onBind()`\
  \ 方法之前立即被调用。\n- `onDestroy()` – 在服务被销毁时调用。\n- `onHandleIntent()` – 仅适用于 `IntentService`\
  \ 子类。此方法被用于处理服务的业务逻辑。它在与主应用程序不同的单独线程中执行。\n\n注意，`IntentService` 类包含了它自己的 `onStartCommand()`\
  \ 和 `onBind()` 回调方法的实现，因此在子类中不需要实现这些方法。\n\n## 58.5 控制被销毁服务的重启选项\n\n`onStartCommand()`\
  \ 回调方法需要返回一个整数值，以定义当服务被 Android 运行时系统销毁时服务应该发生什么。这些方法的可能的返回值如下：\n\n- `START_NOT_STICKY`\
  \ – 告知系统在服务被销毁的情况下，除非有待处理的 intent，否则不应重启服务。\n- `START_STICKY` – 表明如果没有等待的 intent，服务在销毁后应尽快重启。\n\
  - `START_REDELIVER_INTENT` – 表明如果服务在返回后被销毁，则应使用当前 intent 重启服务。\n\n## 58.6 在 Manifest\
  \ 文件声明服务\n\n为了使服务可用，必须首先在 manifest 文件中声明。这涉及在现有的 `<application>` 条目中嵌入一个配置适当的 `<service>`\
  \ 元素。至少`<service>` 元素必须包含一个声明服务类名的属性，如下片段所示：\n\n```xml\n<manifest>\n    <application\n\
  \        android:icon=\"@mipmap/launcher\"\n        android:label=\"@string/app_name\"\
  \ >\n        <activity\n            android:label=\"@string/app_name\"\n       \
  \     android:name=\".MainActivity\" >\n            <intent-filter>\n          \
  \      <action android:name=\"android.intent.action.MAIN\" />\n                <category\
  \ android:name=\"android.intent.category.LAUNCHER\" />\n            </intent-filter>\n\
  \        </activity>\n        <service android:name=\"MyService\">\n    </application>\n\
  </manifest>\n```\n\n默认情况下，服务被声明为公共，这意味着可以被应用程序包之外的组件访问。为了使服务变为私有，必须在 manifest 文件的\
  \ `<service>` 元素中将 `android:exported` 属性声明为 `false`。例如：\n\n```xml\n<service android:name=\"\
  MyService\" android:exported=\"false\">\n\n```\n\n如前所述，服务默认在与调用组件相同的进程中运行。为了强制服务在自己的进程中运行，请在\
  \ `<service>` 元素中添加 `android:process` 属性，并声明一个以冒号（:`）开头的进程名称：\n\n```xml\n<service\
  \ android:name=\"MyService\"\n    android:exported=\"false\"\n    android:process=\"\
  :myprocess\">\n</service>\n```\n\n冒号前缀表示新进程对于本地应用程序是私有的。然而，如果进程名是以小写字母而不是冒号开头，该进程将是全局的，并供其他组件使用。\n\
  \n\n\n\n最后，通过与 Activity 相同的意图过滤器机制，服务也可以向运行在设备上的其他应用程序发布功能。有关意图过滤器的更多细节，请参阅标题为\"\
  Android Intent 概述\"的章节。\n\n## 58.7 在系统启动时启动服务\n\n鉴于服务的后台运行特性，在 Android 系统首次启动时需要启动服务并不罕见。这可以通过创建一个广播接收器来实现，并配置意图过滤器以监听系统\
  \ `android.intent.action.BOOT_COMPLETED` 意图。当检测到此类意图时，广播接收器将调用所需的服务并返回。请注意，为了能够运行，此类广播接收器需要请求\
  \ `android.permission.RECEIVE_BOOT_COMPLETED` 权限。\n\n## 58.8 总结\n\nAndroid 服务是一种强大的机制，允许应用程序在后台执行任务。服务一旦启动，无论调用它的应用程序是否为前台任务，即使在启动服务的组件被销毁的情况下，它都会继续运行。\n\
  \n服务继承自 `Android Service` 类，分为启动型服务（started services）或绑定服务（bound services）。启动型服务一直运行到被停止或销毁为止，它们本身不提供与其他组件进行交互或数据交换的机制。另一方面，绑定服务为其他客户端组件提供了通信接口，通常一直运行到最后一个客户端从服务中解除绑定为止。\n\
  \n默认情况下，服务在调用应用程序相同的进程和主线程中本地运行。因此，应该在服务内部创建一个新线程，用于处理 CPU 密集型任务。通过对应用程序清单文件中相应的\
  \ `<service>` 条目进行细小的配置更改，可以在单独进程中启动远程服务。\n\n`IntentService` 类（其本身是 `Android Service`\
  \ 类的子类）为在独立的工作线程中处理异步服务请求提供了一种方便的机制。\n\n## 59. 实现一个 Android 启动型服务 – 实例演练\n\n上一章涵盖了大量与\
  \ Android 服务相关的信息，到目前，服务的概念可能看起来有些复杂晦懂。为了加强对上一章内容的记忆，本章将通过一个 Android Studio 教程，旨在逐步介绍启动型服务的实现概念。\n\
  \n在本章中，将创建一个示例应用程序并将其作为实现 Android 服务的的基础。首先，将使用 `IntentService` 类创建服务。随后，将扩展此示例以演示\
  \ `Service` 类的使用。最后，将实现使用 `Service` 类在独立线程中执行任务的步骤。在本章涵盖了启动型服务后，下一章标题为\"Android\
  \ 本地绑定服务 – 实例演练\"，将重点关注绑定服务的实现以及客户端与服务之间的通信。\n\n## 59.1 创建示例项目\n\n从欢迎界面选择 `Create\
  \ New Project`（创建新项目）快速启动选项，在出现的新项目对话框中，选择 `Empty Activity` 模板然后点击 `Next` 按钮。\n\n\
  在 `Name` 字段中输入 `ServiceExample`，并指定 `com.ebookfrenzy.serviceexample` 为包名。在点击 `Finish`\
  \ 按钮之前，将 `Minimum API` 设置为 `API 26: Android 8.0 (Oreo)`，并将 `Language` 菜单改为 `Java`。\n\
  \n## 59.2 创建服务类\n\n在编写任何代码之前，第一步是向项目添加一个新类来包含服务。本教程中演示的第一种服务是基于 `IntentService`\
  \ 类。正如前面的章节（\"Android 启动型和绑定服务概述\"）所述，`IntentService` 类的目的是为开发者提供一种方便的机制，用于创建在调用应用程序独立线程中异步执行任务的服务。\n\
  \n在 Project 工具窗口中右键点击 `app -> java` 下的 `com.ebookfrenzy.serviceexample` 包名，选择 `New\
  \ -> Java Class` 菜单选项向项目添加新类。在结果对话框中，将新类命名为 `MyIntentService`。最后，点击 `OK` 按钮创建新类。\n\
  \n检查 Android Studio 编辑器中的 `MyIntentService.java` 文件，其内容应如下：\n\n```java\npackage\
  \ com.ebookfrenzy.serviceexample;\n\npublic class MyIntentService {\n\n}\n```\n\n\
  需要修改该类使其继承自 `IntentService` 类。在继承 `IntentService` 类时，必须遵循两个规则：首先，必须实现该类的构造函数，该函数调用父类构造函数并传递服务的类名。其次，类必须重写\
  \ `onHandleIntent()` 方法。因此，修改 `MyIntentService.java` 文件中的代码，使其如下：\n\n```java\npackage\
  \ com.ebookfrenzy.serviceexample;\n\nimport android.app.IntentService;\n\nimport\
  \ android.content.Intent;\n\npublic class MyIntentService extends IntentService\
  \ {\n\n    @Override\n    protected void onHandleIntent(Intent arg0) {\n\n    }\n\
  \n    public MyIntentService() {\n        super(\"MyIntentService\");\n    }\n}\n\
  ```\n\n现在剩下的是在 `onHandleIntent()` 方法中实现一些代码，以便服务在被调用时实际执行某些操作。通常，这将涉及执行某些需要时间完成的任务，例如下载大文件或播放音频。但对于本示例而言，处理器将仅向\
  \ Android Studio Logcat 输出一条消息：\n\n```java\npackage com.ebookfrenzy.serviceexample;\n\
  \nimport android.app.IntentService;\nimport android.content.Intent;\nimport android.util.Log;\n\
  \npublic class MyIntentService extends IntentService {\n    private final String\
  \ TAG = \"Service\";\n    @Override\n    protected void onHandleIntent(Intent arg0)\
  \ {\n        Log.i(TAG, \"Intent started\");\n    }\n\n    public MyIntentService()\
  \ {\n        super(\"MyIntentService\");\n    }\n}\n```\n\n## 59.3 将服务添加到清单文件\n\n\
  在服务被调用之前，必须先将其添加到所属应用程序的清单文件中。至少涉及添加一个 `<service>` 元素以及服务的类名。\n\n双击当前项目的 `AndroidManifest.xml`\
  \ 文件（`app -> manifests`）将其加载到编辑器，并修改 XML 添加如下所示的服务元素：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.serviceexample\">\n    <application\n        android:allowBackup=\"\
  true\"\n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\
  \n        android:supportsRtl=\"true\"\n        android:theme=\"@style/AppTheme\"\
  >\n        <activity android:name=\".MainActivity\">\n            <intent-filter>\n\
  \                <action android:name=\"android.intent.action.MAIN\" />\n      \
  \          <category android:name=\"android.intent.category.LAUNCHER\" />\n    \
  \        </intent-filter>\n        </activity>\n        <service android:name=\"\
  .MyIntentService\" />\n    </application>\n</manifest>\n```\n\n## 59.4 启动服务\n\n\n\
  \n\n\n现在既然服务已经在 manifest 文件中实现并声明，下一步是添加代码以在应用程序启动时启动服务。按照通常情况，此类代码的理想位置是 activity\
  \ 类的 `onCreate()` 回调方法（在本例中，它可以在 `MainActivity.java` 文件中找到）。找到并加载此文件到编辑器中，并修改 `onCreate()`\
  \ 方法以添加启动服务的代码：\n\n```java\npackage com.ebookfrenzy.serviceexample;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  \nimport android.os.Bundle;\n\nimport android.content.Intent;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \        Intent intent = new Intent(this, MyIntentService.class);\n        startService(intent);\n\
  \    }\n}\n```\n\n添加的代码所需要做的就是创建一个新的 `Intent` 对象，并准备好服务的类名以启动，然后将其作为 `startService()`\
  \ 方法的参数。\n\n## 59.5 测试 IntentService 示例\n\n基于 `IntentService` 的示例服务现在已完成并准备好进行测试。由于服务显示的消息将出现在\
  \ Logcat 面板中，因此在 Android Studio 环境中对其进行配置至关重要。\n\n首先显示 Logcat 工具窗口，点击面板右上角的菜单（该菜单目前可能显示为\
  \ `Show only selected application`）。从此菜单中，选择 `Edit Filter Configuration` 选项。\n\n\
  在 `Create New Logcat Filter` 对话框中将过滤器命名为 `ServiceExample`，并在 `by Log Tag` 字段中输入在\
  \ `MyIntentService.java` 中声明的 `TAG` 值（在上面的代码示例中该值为 `ServiceExample`）。\n\n更改完成后，点击\
  \ `OK` 按钮创建过滤器并关闭对话框。新创建的过滤器现在应该在 Android 工具窗口被选中。\n\n配置好后，在物理设备或 AVD 模拟器会话上运行应用程序，并注意\
  \ Logcat 面板中出现了“Intent Service Started”消息。注意，在应用程序启动后可能需要将过滤器菜单设置回 `ServiceExample`：\n\
  \n```\n06-29 09:05:16.887 3389-3948/com.ebookfrenzy.serviceexample I/ServiceExample:\
  \ Intent Service started\n```\n\n如果给服务分配了长期运行的任务，该服务将在后台的独立线程中继续运行直到任务完成，从而允许应用程序继续运行并对用户做出响应。由于我们所有的服务只是记录了一条消息，它在完成后将简单地停止。\n\
  \n## 59.6 使用 Service 类\n\n虽然 `IntentService` 类允许用极少的代码实现服务，但在某些情况下，需要 `Service`\
  \ 类的灵性和同步特性。正如本章将变得清晰的那样，这涉及到一些额外的编程工作来实现。\n\n为了避免一次性引入过多的概念，并作为在应用程序同一线程中执行耗时任务固有风险的演示，这里创建的示例服务将不会在新线程中运行服务，而是依赖应用程序的主线程。在服务内部创建和管理新线程将在下一阶段介绍。\n\
  \n## 59.7 创建新服务\n\n为了本示例，将向项目添加一个类自 `Service` 类的新类。因此，在 Project 工具窗口中右键点击 `app ->\
  \ java` 下列出的包名，选择 `New -> Service` 菜单选项。创建一个名为 `MyService` 的新类，并同时勾选 `Exported`\
  \ 和 `Enabled` 选项。\n\n创建一个运行服务的最小要求是实现一个在服务启动时调用的 `onStartCommand()` 回调。此外，`onBind()`\
  \ 方法必须返回 `null` 以服务不是绑定的。为了完整性，`onCreate()` 和 `onDestroy()` 方法将在 `MyService.java`\
  \ 中实现，如下：\n\n```java\npackage com.ebookfrenzy.serviceexample;\n\nimport android.app.Service;\n\
  import android.content.Intent;\nimport android.os.IBinder;\nimport android.util.Log;\n\
  \npublic class MyService extends Service {\n    public MyService() {\n    }\n  \
  \  private final String TAG = \"ServiceExample\";\n\n    @Override\n    public void\
  \ onCreate() {\n        Log.i(TAG, \"onCreate\");\n    }\n\n    @Override\n    public\
  \ int onStartCommand(Intent intent, int flags, int startId) {\n        Log.i(TAG,\
  \ \"onStartCommand \" + startId);\n        int i = 0;\n        while (i <= 3) {\n\
  \            try {\n                Thread.sleep(10000);\n                i++;\n\
  \            } catch (Exception e) {\n            }\n        }\n        Log.i(TAG,\
  \ \"Service running\");\n        return Service.START_STICKY;\n    }\n\n    @Override\n\
  \    public IBinder onBind(Intent arg0) {\n        Log.i(TAG, \"onBind\");\n   \
  \     return null;\n    }\n\n    @Override\n    public void onDestroy() {\n    \
  \    Log.i(TAG, \"onDestroy\");\n    }\n}\n```\n\n服务实现后，加载 `AndroidManifest.xml`\
  \ 文件到编辑器并验证 Android Studio 添加了相应的条目：\n\n```xml\n<service\n    android:name=\".MyService\"\
  \n    android:enabled=\"true\"\n    android:exported=\"true\">\n\n## 59.8 修改用户界面\n\
  \n正如运行时所示，未为服务创建新线程会导致严重的可用性问题。为了能够充分体会这一问题的严重，需要在 `MainActivity` 的用户界面中添加一个 `Button`\
  \ 视图，并配置它在用户“点击”时调用一个方法。\n\n在 Project 工具窗口中找到并加载 `activity_main.xml` 文件（`app ->\
  \ res -> layout -> activity_main.xml`）。删除 `TextView` 并向布局添加一个 `Button` 视图。选择新按钮，将文本更改为“Start\
  \ Service”并提取为名为 `start_service` 的资源。\n\n保持选中新的 `Button`，在 Attributes 面板中找到 `onClick`\
  \ 属性并为其分配一个名为 `buttonClick` 的方法。\n\n接下来，编辑 `MainActivity.java` 文件添加 `buttonClick()`\
  \ 方法，并移除之前用于启动 `MyIntentService` 服务的代码：\n\n```java\npackage com.ebookfrenzy.serviceexample;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\n\nimport android.os.Bundle;\n\
  import android.content.Intent;\nimport android.view.View;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    @Override\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_service_example);\n\
  \        Intent intent = new Intent(this, MyIntentService.class);\n        startService(intent);\n\
  \    }\n\n    public void buttonClick(View view)\n    {\n        Intent intent =\
  \ new Intent(this, MyService.class);\n        startService(intent);\n    }\n}\n\
  ```\n\n`buttonClick()` 方法所做的就是为新服务创建一个 `intent` 对象然后启动它运行。\n\n## 59.9 运行应用程序\n\n\
  运行应用程序并在加载后触摸 Start Service 按钮。在 Logcat 工具窗口（使用之前创建的 `ServiceExample` 过滤器）中将出现日志消息，表示\
  \ `buttonClick()` 方法被调用且 `onStartCommand()` 方法中的循环正在执行。\n\n\n\n\n\n在最后的循环消息出现之前，尝试再次点击“启动服务”（Start\
  \ Service）按钮。注意，此时按钮将没有响应。大约 20 秒后，系统可能会显示一个包含消息“ServiceExample 未响应”（ServiceExample\
  \ isn’t responding）的警告对话。这是因为应用程序的主线程当前被执行循环任务的服务所阻塞。这不仅阻止了应用程序对用户的响应，还会导致系统无法响应，系统最终会认为应用程序已以某种方式锁定。\n\
  \n显然，需要修改服务的代码，以便在独立于主线程的线程中执行任务。\n\n## 59.10 为服务任务创建 AsyncTask\n\n正如“线程和 AsyncTask\
  \ 概述”所示，当 Android 应用程序首次启动时，运行时系统会创建一个线程，所有应用程序组件默认都会在该线程中运行。该线程通常被称为主线程（main thread）。主线程的主要作用是处理用户界面的事件处理以及与用户界面视图的交互。在应用程序内部启动的任何额外组件默认也会运行在主线程上。\n\
  \n正如上一节所示，任何在主线程上执行耗时操作的组件都会导致应用程序在任务完成之前处于无响应状态。因此，Android 提供了一个允许应用程序创建和使用额外线程的\
  \ API。在独立于主线程的线程中执行的任务本质上是在后台执行的。此类线程通常被称为后台线程或工作线程（worker threads）。\n\n解决此问题的非常简单的方法是在\
  \ `AsyncTask` 实例中执行服务任务。要为应用添加此支持，请修改 `MyService.java` 文件，创建一个包含 `onStartCommand()`\
  \ 方法中计时器代码的 `AsyncTask` 子类：\n\n```java\nimport android.os.AsyncTask;\n\nprivate\
  \ class SrvTask extends AsyncTask<Integer, Integer, String> {\n\n    @Override\n\
  \    protected String doInBackground(Integer... params) {\n        int startId =\
  \ params[0];\n        int i = 0;\n        while (i <= 3) {\n            publishProgress(params[0]);\n\
  \            try {\n                Thread.sleep(10000);\n                i++;\n\
  \            } catch (Exception e) {\n            }\n        }\n        return(\"\
  Service complete \" + startId);\n    }\n\n    @Override\n    protected void onPostExecute(String\
  \ result) {\n        Log.i(TAG, result);\n    }\n\n    @Override\n    protected\
  \ void onPreExecute() {\n    }\n\n    @Override\n    protected void onProgressUpdate(Integer...\
  \ values) {\n        Log.i(TAG, \"Service Running \" + values[0]);\n    }\n}\n```\n\
  \n接下来，修改 `onStartCommand()` 方法以在后台执行任务，这次使用线程池执行器允许多个任务实例并行运行：\n\n```java\n@Override\n\
  public int onStartCommand(Intent intent, int flags, int startId) {\n    AsyncTask\
  \ task = new SrvTask().executeOnExecutor(\n            AsyncTask.THREAD_POOL_EXECUTOR,\
  \ startId);\n    return Service.START_STICKY;\n}\n```\n\n现在运行应用程序时，应该可以多次点击“启动服务”按钮。在这样做时，Logcat\
  \ 输出应显示有多个任务在同时运行（取决于 CPU 核心限制）：\n\n```\nI/ServiceExample: Service onStartCommand\
  \ 1\nI/ServiceExample: Service onStartCommand 2\nI/ServiceExample: Service onStartCommand\
  \ 3\nI/ServiceExample: Service running 1\nI/ServiceExample: Service running 2\n\
  I/ServiceExample: Service running 3\n```\n\n由于服务现在在主线程之外处理请求，应用程序对用户和 Android 系统都保持响应状态。\n\
  \n## 59.11 总结\n\n本章讲解了一个 IntentService 示例。该示例还演示了在服务内部使用异步任务，以避免应用程序无响应。\n\n## 60.\
  \ Android 绑定服务 – 实例示例\n\n正如在前几节中详细概述的，绑定服务（bound services）与启动服务（started services）不同，它们提供了一种客户端组件之间的通信机制。本章的目标是在开始本地服务示例之前，在绑定服务的概述基础上进行扩展。\n\
  \n## 60.1 理解绑定服务\n\n与启动服务相同，提供绑定服务允许应用程序在后台执行任务。然而，与启动服务不同，多个客户端组件可以绑定到一个服务。绑定服务是作为\
  \ Android Service 类的子类创建的，并且至少实现 `onBind()` 方法。客户端通过 `bindService()` 方法绑定到服务。对服务的第一次绑定请求将导致调用该服务的\
  \ `onBind()`（随后的绑定请求不会触发 `onBind()`）。想要绑定到服务的客户端还必须实现 `ServiceConnection` 子类，其中包含\
  \ `onServiceConnected()` 和 `onServiceDisconnected()` 方法，这两个方法分别会在客户端-服务器连接建立或断开后调用。在\
  \ `onServiceConnected()` 方法中，将传递一个 `IBinder` 对象，其中包含了客户端与服务交互所需的信息。\n\n## 60.2 绑定服务的交互选项\n\
  \n实现客户端组件与绑定服务之间交互有两种推荐的机制。如果绑定服务是本地的且与客户端组件属于同一个应用程序（换说是，它在同一个进程中运行，并且对其他应用程序不可用），推荐的方法是创建一个\
  \ `Binder` 类的子类并扩展它以为服务提供接口。`onBind()` 方法返回该 `Binder` 对象的实例，随后客户端组件使用它直接访问服务中持有的方法和数据。\n\
  \n在绑定服务不是本地的情况下（换说是，它在与客户端组件不同的进程中运行），最佳交互方式是使用 `Messenger/Handler` 实现。\n\n在本章的剩余部分，将创建一个示例，旨在演示创建、启动和与本地私有绑定交互交互步骤。\n\
  \n## 60.3 一个 Android Studio 绑定服务示例\n\n在本章剩余部分创建的示例应用程序将由一个 Activity 和绑定服务组成。该服务的目的是从系统获取当前时间，并将该信息返回给\
  \ Activity 显示给用户。绑定服务将是 Activity 所在同一个应用程序的本地私有服务。\n\n## 60.4 向项目添加绑定服务\n\n\n\n\n\
  要向项目添加新类，请在 Project 窗口中右键点击包名（位于 `app -> java -> com.ebookfrenzy.localbound` 下），并选择\
  \ `New -> Service -> Service` 菜单选项。指定 `BoundService` 为类名，并在点击 `Finish` 创建类之前，确保勾选了\
  \ `Exported` 和 `Enabled` 选项。Android Studio 将将 `BoundService.java` 文件加载到编辑器中，内容如下：\n\
  \n```java\npackage com.ebookfrenzy.localbound;\n\nimport android.app.Service;\n\n\
  import android.content.Intent;\n\nimport android.os.IBinder;\n\npublic class BoundService\
  \ extends Service {\n    public BoundService() {\n    }\n\n    @Override\n    public\
  \ IBinder onBind(Intent intent) {\n        // TODO: Return the communication channel\
  \ to the service.\n        throw new UnsupportedOperationException(\"Not yet implemented\"\
  );\n    }\n}\n```\n\n## 60.5 实现 Binder\n\n如前所述，本地绑定服务（local bound services）可以通过向客户端传递适当的\
  \ `Binder` 对象来与绑定客户端进行通信。这是通过在绑定服务类内部创建一个 `Binder` 子类，并通过添加一个或多个可以被客户端调用的新方法来扩展它的。在大多数情况下，这只需实现一个返回绑定服务实例引用的方法。有了该实例的引用，客户端就可以直接访问绑定服务中的数据并调用其中的方法。\n\
  \n因此，为了本示例演示，需要对上一节创建的模板类 `BoundService` 进行一些更改。首先，需要声明一个 `Binder` 子类。该类将包含一个名为\
  \ `getService()` 的方法，该方法将简单地返回当前服务对象实例的引用（由 `this` 关键字表示）。考虑到这些要求，编辑 `BoundService.java`\
  \ 文件并修改如下：\n\n```java\npackage com.ebookfrenzy.localbound;\n\nimport android.app.Service;\n\
  \nimport android.content.Intent;\n\nimport android.os.IBinder;\n\nimport android.os.Binder;\n\
  \npublic class BoundService extends Service {\n    private final IBinder myBinder\
  \ = new MyLocalBinder();\n\n    public BoundService() {\n    }\n\n    @Override\n\
  \    public IBinder onBind(Intent intent) {\n        // TODO: Return the communication\
  \ channel to the service.\n        throw new UnsupportedOperationException(\"Not\
  \ yet implemented\");\n    }\n\n    public class MyLocalBinder extends Binder {\n\
  \        BoundService getService() {\n            return BoundService.this;\n  \
  \      }\n    }\n}\n```\n\n对类进行修改后，值得花一点时间回顾一下这里执行的步骤。首先，声明了一个 `Binder` 的新子类（命名为\
  \ `MyLocalBinder`）。该类包含一个单一方法，其唯一目的是返回 `BoundService` 类当前实例的引用。创建 `MyLocalBinder`\
  \ 类的新实例并将其赋值给 `myBinder` `IBinder` 引用（由于 `Binder` 是 `IBinder` 的子类，因此在此赋值中不存在类型不匹配）。\n\
  \n接下来，需要修改 `onBind()` 方法以返回 `myBinder` 对象的引用，并实现了一个新的公共方法，当被任何绑定到服务的客户端调用时，它可以返回当前时间：\n\
  \n```java\npackage com.ebookfrenzy.localbound;\n\nimport java.text.SimpleDateFormat;\n\
  import java.util.Date;\nimport java.util.Locale;\nimport android.app.Service;\n\
  import android.content.Intent;\nimport android.os.IBinder;\nimport android.os.Binder;\n\
  \npublic class BoundService extends Service {\n    private final IBinder myBinder\
  \ = new MyLocalBinder();\n\n    public BoundService() {\n    }\n\n    @Override\n\
  \    public IBinder onBind(Intent intent) {\n        return myBinder;\n    }\n\n\
  \    public String getCurrentTime() {\n        SimpleDateFormat dateformat = new\
  \ SimpleDateFormat(\"HH:mm:ss MM/dd/yyyy\", Locale.US);\n        return (dateformat.format(new\
  \ Date()));\n    }\n    public class MyLocalBinder extends Binder {\n        BoundService\
  \ getService() {\n            return BoundService.this;\n        }\n    }\n}\n```\n\
  \n此时，绑定服务已完成，并准备好添加到项目清单文件中。在 Project 窗口中找到并双击 `LocalBound` 项目的 `AndroidManifest.xml`\
  \ 文件，一旦加载到 Manifest 编辑器中，请验证 Android Studio 是否已添加了如下 `<service>` 条目：\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \ package=\"com.ebookfrenzy.localbound.localbound\">\n    <application android:allowBackup=\"\
  true\" android:icon=\"@mipmap/launcher\" android:label=\"@string/app_name\" android:theme=\"\
  @style/AppTheme\">\n        <service android:name=\".BoundService\" android:enabled=\"\
  true\" android:exported=\"true\" />\n        <activity android:name=\".MainActivity\"\
  >\n            <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\"\
  \ />\n                <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n\
  ```\n\n下一阶段是在 activity 中实现必要的代码，以绑定服务并调用 `getCurrentTime()` 方法。\n\n## 60.6 将客户端绑定到服务\n\
  \n为了本教程演示，客户端是运行中的 `MainActivity` 实例。如前所述，为了成功绑定服务并接收服务 `onBind()` 方法返回的 `IBinder`\
  \ 对象，需要创建一个 `ServiceConnection` 子类并实现 `onServiceConnected()` 和 `onServiceDisconnected()`\
  \ 回调方法。编辑 `MainActivity.java` 文件并修改如下：\n\n```java\npackage com.ebookfrenzy.localbound;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\nimport android.os.Bundle;\n\
  import android.os.IBinder;\nimport android.content.Context;\nimport android.content.Intent;\n\
  import android.content.ComponentName;\nimport android.content.ServiceConnection;\n\
  import com.ebookfrenzy.localbound.BoundService.MyLocalBinder;\n\npublic class MainActivity\
  \ extends AppCompatActivity {\n    BoundService myService;\n    boolean isBound\
  \ = false;\n\n    @Override\n    protected void onCreate(Bundle savedInstanceState)\
  \ {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \    }\n\n    private ServiceConnection myConnection = new ServiceConnection() {\n\
  \        @Override\n        public void onServiceConnected(ComponentName className,\
  \ IBinder service) {\n            MyLocalBinder binder = (MyLocalBinder) service;\n\
  \            myService = binder.getService();\n            isBound = true;\n   \
  \     }\n\n        @Override\n        public void onServiceDisconnected(ComponentName\
  \ name) {\n            isBound = false;\n        }\n    };\n}\n```\n\n在建立连接后，下一步是修改\
  \ activity 以绑定到服务。这涉及到创建一个 `intent` 并调用 `bindService()` 方法，这些操作可以在 activity 的 `onCreate()`\
  \ 方法中执行：\n\n```java\n@Override\npublic void onCreate(Bundle savedInstanceState)\
  \ {\n    super.onCreate(savedInstanceState);\n}\n```\n\n\n\n\n```java\nsetContentView(R.layout.activity_main);\n\
  \nIntent intent = new Intent(this, BoundService.class);\n\nbindService(intent, myConnection,\
  \ Context.BIND_AUTO_CREATE);\n\n}\n```\n\n## 60.7 完成示例\n\n剩下的工作是实现一种调用 `getCurrentTime()`\
  \ 方法并将结果显示给用户的机制。按照现在的惯例，Android Studio 已经为 activity 创建了一个 `activity_main.xml` 模板文件，其中仅包含一个\
  \ `TextView`。将此文件加载到布局编辑器（Layout Editor）工具中，使用设计（Design）模式选择 `TextView` 组件并将 ID\
  \ 更改为 `myTextView`。在 `TextView` 之下添加一个 `Button` 视图，并将按钮文本更改为“Show Time”，将其文本提取为名为\
  \ `show_time` 的字符串资源。完成这些更改后，布局应该类似于图 60-1 所示。如果缺少任何约束，请点击布局编辑器工具栏中的“推断约束”（Infer\
  \ Constraints）按钮。\n\n![](img/as_4.1_local_bound_ui.jpg)\n\n图 60-1\n\n通过选择 `Button`\
  \ 并配置 `onClick` 属性调用名为 `showTime` 的方法来完成用户界面设计。\n\n最后，编辑 `MainActivity.java` 文件中的代码以实现\
  \ `showTime()` 方法。该方法简单地调用服务的 `getCurrentTime()` 方法（得益于 `onServiceConnected()` 方法，现在可以通过\
  \ `myService` 引用从 activity 内部），并将生成的字符串赋值给 `TextView`：\n\n```java\npackage com.ebookfrenzy.localbound;\n\
  \nimport androidx.appcompat.app.AppCompatActivity;\n\nimport android.os.Bundle;\n\
  \nimport android.os.IBinder;\n\nimport android.content.Context;\n\nimport android.content.Intent;\n\
  \nimport android.content.ComponentName;\n\nimport android.content.ServiceConnection;\n\
  \nimport android.view.View;\n\nimport android.widget.TextView;\n\nimport com.ebookfrenzy.localbound.BoundService.MyLocalBinder;\n\
  \npublic class MainActivity extends AppCompatActivity {\n    BoundService myService;\n\
  \n    boolean isBound = false;\n\n    public void showTime(View view)\n    {\n \
  \       String currentTime = myService.getCurrentTime();\n        TextView myTextView\
  \ = findViewById(R.id.myTextView);\n        myTextView.setText(currentTime);\n \
  \   }\n}\n```\n\n## 60.8 测试应用程序\n\n代码更改完成后，对应用程序进行测试运行。一旦可见，触摸按钮并注意文本视图已更改为显示当前日期和时间。该示例已成功启动并绑定到一个服务，然后调用了该服务的方法来执行任务并将结果返回给\
  \ activity。\n\n## 60.9 总结\n\n当绑定的服务是本地的且对应用程序私有的时，该应用程序中的组件可以与服务进行交互，而无需诉助于进程间通信（IPC）。通俗地说，服务的\
  \ `onBind()` 方法返回一个 `IBinder` 对象，该对象包含指向运行中服务实例的引用。客户端组件实现 `ServiceConnection` 子类，其中包含回调方法，这些方法在服务连接和断开连接时被调用。前一个方法接收到由\
  \ `onBind()` 方法返回的 `IBinder` 对象，允许调用服务中的公共方法。\n\n在涵盖了本地绑定服务的实现后，下一章将重点关注使用 IPC 与远程绑定服务进行交互。\n\
  \n## 61. Android 远程绑定服务 – 实例示例\n\n在本章关于 Android 服务的最后一章中，将开发一个示例应用程序，演示如何使用 `messenger`\
  \ 和 `handler` 配置来促进客户端与远程绑定服务之间的交互。\n\n## 61.1 客户端到远程服务的通信\n\n正如上一章所述，客户端与本地服务之间的交互可以通过向客户端返回一个包含服务对象引用的\
  \ `IBinder` 对象来实现。然而，对于远程服务，这种方法行不可行的，因为远程服务运行在不同的进程中，因此无法从客户端直接访问。\n\n在远程服务的情况下，必须创建一个\
  \ `Messenger` 和 `Handler` 配置，允许消息在客户端和服务之间跨进程边界进行传递。\n\n具体而言，服务会创建一个 `Handler` 实例，该实例在收到来自客户端的消息时会被调用。在初始化方面，`Handler`\
  \ 的职责是创建一个 `Messenger` 对象，该对象反过来创建一个 `IBinder` 对象并在 `onBind()` 方法中返回给客户端。客户端使用此\
  \ `IBinder` 对象创建 `Messenger` 对象的实例，随后向服务处理器发送消息。每当客户端发送一条消息时，处理器的 `handleMessage()`\
  \ 方法就会被调用，并传递消息对象。\n\n本章创建的示例将由一个在单独进程中运行的 activity 和一个绑定服务组成。使用 `Messenger/Handler`\
  \ 机制将字符串发送给服务，服务随后将在 `Toast`set 中显示该字符串。\n\n## 61.2 创建示例应用程序\n\n从欢迎界面选择“新建项目”（Create\
  \ New Project）快速启动选项，在出现的新项目对话框中，点击“下一步”（Next）按钮之前选择“Empty Activity”模板。\n\n在“Name”字段中输入\
  \ `RemoteBound` 并指定 `com.ebookfrenzy.remotebound` 为包名。在点击“完成”（Finish）按钮之前，将“Minimum\
  \ API” 级设置为 `26: Android 8.0 (Oreo)`，并将语言设置为 `Java`。\n\n## 61.3 设计用户界面\n\n在项目窗口找到\
  \ `activity_main.xml` 文件并双击将其加载到布局编辑器中。在设计模式下，右键点击 `TextView` 实例，选择“转换视图...”（Convert\
  \ view...选项并在对话框中选择 `Button`。将按钮的文本属性更改为“Send Message”，并将其提取为名为 `send_message` 的资源。最后，配置\
  \ `onClick` 属性调用名为 `sendMessage` 的方法。\n\n## 61.4 实现远程绑定服务\n\n为了实现示例的远程绑定服务，通过右键点击项目窗口\
  \ `app -> java` 下的包名向项目添加新类，选择 `New -> Service` 选项。指定 `RemoteService` 为类名，并在点击完成之前确保勾选\
  \ `Exported` 和 `Enabled` 选项。\n\n下一步是为新服务实现处理器类。这通过扩展 `Handler` 类并实现 `handleMessage()`\
  \ 方法来实现。该方法在收到来自客户端的消息时会被调用。它接收一个 `Message` 对象作为参数，包含客户端需要传递给服务的任何数据。在此实例中，这是一个包含显示给用户的字符串的\
  \ `Bundle` 对象。完成此操作后，RemoteService.java` 文件中的修改后的类如下：\n\n```java\npackage com.ebookfrenzy.remotebound;\n\
  \nimport android.app.Service;\nimport android.content.Intent;\nimport android.os.IBinder;\n\
  import android.os.Bundle;\nimport android.os.Handler;\nimport android.os.Message;\n\
  import android.widget.Toast;\nimport android.os.Messenger;\n\npublic class RemoteService\
  \ extends Service {\n    public RemoteService() {\n    }\n    class IncomingHandler\
  \ extends Handler {\n        @Override\n        public void handleMessage(Message\
  \ msg) {\n            Bundle data = msg.getData();\n            String dataString\
  \ = data.getString(\"MyString\");\n            Toast.makeText(getApplicationContext(),\n\
  \                dataString, Toast.LENGTH_SHORT).show();\n        }\n    }\n\n \
  \   @Override\n    public IBinder onBind(Intent intent) {\n        // TODO: 返回通信通道给服务。\n\
  \    }\n}\n```\n\n\n\n\n\n```java\n        throw new UnsupportedOperationException(\"\
  Not yet implemented\");\n\n    }\n}\n```\n\n一旦实现了处理程序，服务代码方面唯一的剩余任务就是修改 `onBind()`\
  \ 方法，使其返回一个包含 `Messenger` 对象的 `IBinder` 对象，而该 `Messenger` 对象又包含指向处理程序的引用：\n\n```java\n\
  final Messenger myMessenger = new Messenger(new IncomingHandler());\n\n@Override\n\
  public IBinder onBind(Intent intent) {\n    return myMessenger.getBinder();\n}\n\
  ```\n\n上述代码片段的第一行创建了我们处理器类的新实例，并将其传递给新 `Messenger` 对象的构造函数。在 `onBind()` 方法中，调用了\
  \ `messenger` 对象的 `getBinder()` 方法来返回该消息器的 `IBinder` 对象。\n\n## 61.5 在 Manifest 文件中配置远程服务\n\
  \n为了准确地描述客户端与远程服务之间的通信，有必要将服务配置为在与应用程序其他部分分离的进程中运行。这通过在清单文件中为该服务的 `<service>` 标签内添加\
  \ `android:process` 属性来实现。为了启动远程服务，还需要为该服务提供一个意图过滤器（intent filter）。为了实现这些更改，请修改\
  \ `AndroidManifest.xml` 文件以添加所需的项：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.remotebound\" >\n    <application\n        android:allowBackup=\"\
  true\"\n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"@string/app_name\"\
  \n        android:supportsRtl=\"true\"\n        android:theme=\"@style/AppTheme\"\
  \ >\n        <service\n            android:name=\".RemoteService\"\n           \
  \ android:enabled=\"true\"\n            android:exported=\"true\"\n            android:process=\"\
  :my_process\" >\n        </service>\n        <activity\n            android:name=\"\
  .MainActivity\" >\n            <intent-filter>\n                <action android:name=\"\
  android.intent.action.MAIN\" />\n                <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n            </intent-filter>\n        </activity>\n    </application>\n</manifest>\n\
  ```\n\n## 61.6 启动并绑定远程服务\n\n与本地绑定服务一样，客户端组件需要实现 `ServiceConnection` 类的实例，并包含 `onServiceConnected()`\
  \ 和 `onServiceDisconnected()` 方法。同样，与本地服务相同，`onServiceConnected()` 方法将接收由远程服务的 `onBind()`\
  \ 方法返回的 `IBinder` 对象，并将用于向服务器处理器发送消息。在本示例中，客户端是 `MainActivity`，其代码位于 `MainActivity.java`\
  \ 中。加载此文件并修改它，以添加 `ServiceConnection` 类、一个用于存储接收到的 `Messenger` 对象引用的变量，以及一个用于指示连接是否已建立的\
  \ `Boolean` 标志：\n\n```java\npackage com.ebookfrenzy.remotebound;\n\nimport androidx.appcompat.app.AppCompatActivity;\n\
  import android.os.Bundle;\nimport android.os.IBinder;\nimport android.os.Message;\n\
  import android.os.Messenger;\nimport android.os.RemoteException;\nimport android.content.ComponentName;\n\
  import android.content.Context;\nimport android.content.Intent;\nimport android.content.ServiceConnection;\n\
  import android.view.View;\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    Messenger myService = null;\n    boolean isBound;\n\n    @Override\n  \
  \  protected void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.activity_remote_bound);\n    }\n\n    final ServiceConnection\
  \ myConnection = new ServiceConnection() {\n        public void onServiceConnected(ComponentName\
  \ className, IBinder service) {\n            myService = new Messenger(service);\n\
  \            isBound = true;\n        }\n        public void onServiceDisconnected(ComponentName\
  \ className) {\n            myService = null;\n            isBound = false;\n  \
  \      }\n    };\n```\n\n接下来，需要添加代码来绑定服务。这涉及到创建一个与服务意图过滤器匹配的 `intent`，然后调用 `bindService()`\
  \ 方法并将 `ServiceConnection` 实例作为参数。对于本示例，这些代码将实现在 activity 的 `onCreate()` 方法中：\n\n\
  ```java\n@Override\nprotected void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    setContentView(R.layout.activity_remote_bound);\n    Intent intent = new Intent(getApplicationContext(),\
  \ RemoteService.class);\n    bindService(intent, myConnection, Context.BIND_AUTO_CREATE);\n\
  }\n```\n\n## 61.7 向远程服务发送消息\n\n测试应用程序之前的所有工作是在 `MainActivity` 类中实现 `sendMessage()`\
  \ 方法，该方法在用户触摸按钮时调用。此方法需要检查服务是否连接，创建一个包含要显示字符串的 `bundle` 对象，将其添加到 `Message` 对象并发送到服务器：\n\
  \n```java\npublic void sendMessage(View view) {\n    if (!isBound) return;\n   \
  \ Message msg = Message.obtain();\n    Bundle bundle = new Bundle();\n    bundle.putString(\"\
  MyString\", \"Message Received\");\n    msg.setData(bundle);\n    try {\n      \
  \  myService.send(msg);\n    } catch (RemoteException e) {\n        e.printStackTrace();\n\
  \    }\n}\n```\n\n代码更改完成后，编译并运行应用程序。加载后，触摸界面上的按钮，此时应该出现显示“Message Received”的 Toast\
  \ 消息。\n\n## 61.8 总结\n\n为了实现客户端与远程服务之间的交互，需要实现一个处理器/消息通信框架。本章已经涵盖了该技术的基本概念，并实现了一个演示运行在独立进程中的客户端和服务之间通信的示例应用程序。\n\
  \n## 62 Android 通知教程\n\n通知提供了一种方式，让应用程序未运行或在后台运行时向用户传递信息。例如，消息应用可能会发布通知，让用户知道收到了联系人的新消息。通知可以分为本地和远程两种。本地通知是由运行设备上的应用程序本身触发的。相反，远程通知由远程服务器启动并递送到设备上供用户查看。\n\
  \n通知出现在从屏幕状态栏下拉的通知栏中，每个通知都可以包含操作，例如打开发送通知的应用程序的按钮。Android 还支持直接回复通知（Direct Reply），该功能允许用户在通知面板中输入并提交对通知的回复。\n\
  \n本章的目标是概述并演示如何在 Android 应用中实现本地通知。下一章（Android 直接回复通知教程）将涵盖直接回复通知的实现。\n\n## 62.1\
  \ 通知概览\n\n\n\n\n\n当 Android 设备上触发通知时，它会以图标的形式出现在状态栏中。例如，图 62-1 显示了带有包含多个通知图标的状态栏：\n\
  \n![](img/Image24255.jpg)\n\n图 62-1\n\n要查看通知，用户需要从状态栏开始执行向下滑动的动作，以拉下通知抽屉，如图 62-2\
  \ 所示：\n\n![](img/as_4.1_android_11_notifications.jpg)\n\n图 62-2\n\n在运行 Android 8\
  \ 或更高版本的设备上，长按应用启动器图标将显示与该应用相关的任何待处理通知，如图 62-3 所示：\n\n![](img/Image2442.jpg)\n\n\
  图 62-3\n\nAndroid 8 及更高版本还支持通知点，当有通知等待用户查看时，该点会出现在应用启动器图标上。\n\n典型的通知只会简单地显示一条消息，并在点击时启动负责发布该通知的应用程序。通知还可能包含操作按钮，点击这些按钮时会执行与对应应用特定的任务。例如，图\
  \ 62-4 显示了一个包含两个操作按钮的通知，允许用户删除或保存收到的消息。\n\n![](img/Image2450.jpg)\n\n图 62-4\n\n\
  用户可能还可以在通知中输入内联文本回复并将其发送给应用，如下方的图 62-5 所示。这允许用户在无需将相应的应用调到前台的情况下响应通知。\n\n![](img/Image2458.jpg)\n\
  \n图 62-5\n\n本章的剩余部分将介绍创建和发布包含操作的简单通知的涉及步骤。直接回复支持的主题将在下一章介绍，标题标题为“Android 直接回复通知教程”。\n\
  \n## 62.2 创建 NotifyDemo 项目\n\n从欢迎界面选择“启动新的 Android Studio 项目（Start a new Android\
  \ Studio project）”快速启动选项，并在生成的新项目对话框中，点击“下一步（Next）”按钮之前选择“空活动（Empty Activity）”模板。\n\
  \n在 `Name` 字段中输入 `NotifyDemo` 并指定 `com.ebookfrenzy.notifydemo` 为包名。在点击“完成（Finish）”按钮之前，将最低\
  \ API 设置为 `API 26`：Android 8.0 (Oreo)，并将语言菜单设置为 `Java`。\n\n## 62.3 设计用户界面\n\n主活动将包含一个按钮，其目的是创建并发布一个意图（intent）。找到\
  \ `activity_main.xml` 文件并加载到布局编辑器（Layout Editor）工具中，删除默认的 `TextView` 组件。\n\n在启用自动连接（Autoconnect）的情况下，从面板中将\
  \ `Button` 对象拖放到布局画布的中心，如图 62-6 所示。\n\n在布局中选中 `Button` 小部件后，使用属性（Attributes）面板配置\
  \ `onClick` 属性，以调用名为 `sendNotification` 的方法。\n\n![](img/as_4.1_notify_demo_ui.jpg)\n\
  \n图 62-6\n\n选中 `Button` 小部件，在属性工具窗口中将 `text` 属性更改为“Notify”，并将属性值提取到字符串资源。\n\n##\
  \ 62.4 创建第二个活动\n\n为了本例，该应用将包含第二个活动，该活动将由用户从通知内部启动。通过右键点击 `app -> java` 下的 `com.ebookfrenzy.notifydemo`\
  \ 包名，并选择 `New -> Activity -> Empty Activity` 菜单选项来显示“新建 Android Activity”对话框，从而将此新活动添加到项目中。\n\
  \n在 `Activity Name` 字段中输入 `ResultActivity` 并布局文件命名为 `activity_result`。由于此活动不会在应用程序启动时启动（它将通过通知内部的意图启动），因此在点击“完成（Finish）”按钮之前确保禁用了启动器活动（Launcher\
  \ Activity）选项是非常重要的。\n\n打开第二个活动的布局（`app -> res -> layout -> activity_result.xml`），并拖放\
  \ `TextView` 组件，使其位于布局中心。编辑 `TextView` 的文本，使其显示为“Result Activity”，并将属性值提取到字符串资源。\n\
  \n## 62.5 创建通知通道\n\n在应用发送通知之前，它必须首先创建一个通知通道。通知通道由一个唯一标识应用内通道的 `ID`、一个通道名称和一个通道描述组成（只有后两个会被用户看到）。通道是通过配置\
  \ `NotificationChannel` 实例并创建的，然后将该对象传递给 `NotificationManager` 类的 `createNotificationChannel()`\
  \ 方法来创建。对于此示例，该应用将包含一个名为“NotifyDemo News”的单一通知通道。编辑 `MainActivity.java` 文件并实现当应用启动时创建通道的代码：\n\
  \n.\n\n.\n\n```java\nimport android.app.NotificationManager;\n\nimport android.app.NotificationChannel;\n\
  \nimport android.content.Context;\n\nimport android.graphics.Color;\n\npublic class\
  \ MainActivity extends AppCompatActivity {\n    NotificationManager notificationManager;\n\
  \n    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n    \
  \    super.onCreate(savedInstanceState);\n        setContentView(R.layout.activity_main);\n\
  \        notificationManager = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);\n\
  \        createChannel(\"com.ebookfrenzy.notifydemo.news\", \"NotifyDemo News\"\
  , \"Example Channel\");\n    }\n\n    protected void createChannel(String id, String\
  \ name, String description) {\n        int importance = NotificationManager.IMPORTANCE_LOW;\n\
  \        NotificationChannel channel = new NotificationChannel(id, name, importance);\n\
  \        channel.setDescription(description);\n        channel.enableLights(true);\n\
  \        channel.setLightColor(Color.RED);\n        channel.enableVibration(true);\n\
  \        channel.setVibrationPattern(new long[]{100, 200, 300, 400, 500, 400, 300,\
  \ 200, 400});\n        notificationManager.createNotificationChannel(channel);\n\
  \    }\n}\n```\n\n代码声明并初始化了 `NotificationManager` 实例，然后以低优先级创建新通道（其他选项为高、最大、最小和无），并配置了名称和描述。通道还添加了一些可选设置，以自定义用户感知通知到达的方式。这些设置适用于发送到该通道的所有通知。最后通过将通道对象传递给\
  \ `notificationManager` 实例的 `createNotificationChannel()` 方法来创建通道。\n\n代码更改完成后，编译并在运行\
  \ Android 10 或更高版本的设备或模拟器上运行应用。在应用启动后，将其置于后台并打开设置应用。在设置应用中，选择“应用和通知”选项，然后是“应用信息”。在应用信息屏幕上找到并选择\
  \ NotifyDemo 项目，在后续屏幕上点击“通知”。通知屏幕应显示 NotifyDemo News 类别对用户处于激活状态：\n\n![](img/as_3.5_notifications_enabled.jpg)\n\
  \n图 62-7\n\n在继续之前，检查高级设置以确保该应用已启用通知点和气泡。\n\n虽然这不是本例的要求，但值得注意的是，可以通过调用 `notificationManager`\
  \ 的 `deleteNotificationChannel()` 方法并传递通道的 ID 来从应用内部删除通道：\n\n```java\nString channelID\
  \ = \"com.ebookfrenzy.notifydemo.news\";\nnotificationManager.deleteNotificationChannel(channelID);\n\
  ```\n\n\n\n\n\n`notificationManager.deleteNotificationChannel(channelID);`\n\n##\
  \ 62.6 创建和发布基础通知\n\n通知是使用 `Notification.Builder` 类创建的，并且包含图标、标题和内容。打开 `MainActivity.java`\
  \ 文件并按照如下方式实现 `sendNotification()` 方法以构建基础通知：\n\n```java\nimport android.app.Notification;\n\
  import android.view.View;\n\npublic void sendNotification(View view) {\n    String\
  \ channelID = \"com.ebookfrenzy.notifydemo.news\";\n    Notification notification\
  \ =\n            new Notification.Builder(MainActivity.this,\n                 \
  \   channelID)\n            .setContentTitle(\"Example Notification\")\n       \
  \     .setContentText(\"This is an example notification.\")\n            .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \            .setChannelId(channelID)\n            .build();\n}\n```\n\n一旦构建了通知，就需要使用\
  \ `NotificationManager` 实例的 `notify()` 方法进行发布。访问 `NotificationManager` 并发布通知的代码需要按如下方式添加到\
  \ `sendNotification()` 方法中：\n\n```java\nprotected void sendNotification(View view)\
  \ {\n    int notificationID = 101;\n    String channelID = \"com.ebookfrenzy.notifydemo.news\"\
  ;\n    Notification notification =\n            new Notification.Builder(MainActivity.this,\n\
  \                    channelID)\n            .setContentTitle(\"New Message\")\n\
  \            .setContentText(\"You've received new messages.\")\n            .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \            .setChannelId(channelID)\n            .build();\n    notificationManager.notify(notificationID,\
  \ notification);\n}\n```\n\n注意，当发布通知时，它会被分配一个通知 ID。这可以是任何整数，并在稍后更新通知时使用。\n\n编译并运行应用，点击主活动界面上的按钮。当通知图标出现在状态栏时，触摸并向下拖动状态栏以查看完整通知：\n\
  \n![](img/Image2481.jpg)\n图 62-8\n\n点击并向右侧滑动通知，然后选择设置齿轮图标以查看有关通知的额外信息：\n\n![](img/as_3.5_notification_settings.jpg)\n\
  图 62-9\n\n接下来，将应用置于后台，导航到显示所有应用启动器图标的桌面，并注意 NotifyDemo 启动器图标上出现了一个通知点，如图 62-10 所示：\n\
  \n![](img/Image24991.jpg)\n图 62-10\n\n如果没有出现该点，请检查“设置”应用中 NotifyDemo 的通知选项，以确认已按照本章前面的介绍启用了通知点。如果该点仍未出现，请触摸并长按设备主屏幕的空白区域，从生成的菜单中选择`主屏幕设置`选项并启用`通知点`选项。\n\
  \n长按启动器图标将显示一个包含通知的弹出窗口：\n\n![](img/as_3.5_notifydemo_long_press_popup.jpg)\n图 62-11\n\
  \n如果一个应用有多个待处理的通知，长按菜单弹出窗口将包含通知数量（如上图高所示）。此数字可以在构建通知时通过调用 `setNumber()` 方法在应用内部进行配置：\n\
  \n```java\nNotification notification = new Notification.Builder(MainActivity.this,\
  \ CHANNEL_ID)\n    .setContentTitle(\"Example Notification\")\n    .setContentText(\"\
  This is an example notification.\")\n    .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \    .setChannelId(CHANNEL_ID)\n    .setNumber(10)\n    .build();\n```\n\n按照目前的实现方式，无论在何处访问，点击通知都没有效果。下一步是配置通知在点击时启动一个活动（activity）。\n\
  \n## 2.7 从通知启动活动\n\n理想情况下，通知应该允许用户执行某些形式的操作，例如启动相应的应用，或响应通知采取其他形式的操作。一个常见的需求是在用户点击通知时简单启动属于该应用的活动。这种方法需要启动一个活动以及一个启动该活动的\
  \ `Intent`。假设应用包含一个名为 `ResultActivity` 的活动，`intent` 的创建方式如下：\n\n```java\nIntent\
  \ resultIntent = new Intent(this, ResultActivity.class);\n```\n\n此 `intent` 需要被封装在\
  \ `PendingIntent` 实例中。`PendingIntent` 对象的设计允许将 `intent` 传递给其他应用程序，实质上授予这些应用程序在未来某个时刻执行该意图权限。在这种情况下，`PendingIntent`\
  \ 对象被用于为通知系统提供一种方式，当用户点击通知面板时启动 `ResultActivity` 活动：\n\n```java\nPendingIntent pendingIntent\
  \ =\n    PendingIntent.getActivity(\n            this,\n            0,\n       \
  \     resultIntent,\n            PendingIntent.FLAG_UPDATE_CURRENT);\n```\n\n剩下的工作是在构建通知期间使用\
  \ `setContentIntent()` 方法分配 `PendingIntent` 对象。将这些更改整合在一起将得到修改后的 `sendNotification()`\
  \ 方法，如下：\n\n```java\nimport android.app.PendingIntent;\nimport android.content.Intent;\n\
  import android.graphics.drawable.Icon;\n\nprotected void sendNotification(View view)\
  \ {\n    int notificationId = 101;\n    Intent resultIntent = new Intent(this, ResultActivity.class);\n\
  \    PendingIntent pendingIntent =\n            PendingIntent.getActivity(\n   \
  \                 this,\n                    0,\n                    resultIntent,\n\
  \                    PendingIntent.FLAG_UPDATE_CURRENT);\n    String CHANNEL_ID\
  \ = \"com.ebookfrenzy.notifydemo.news\";\n    Notification notification = new Notification.Builder(MainActivity.this,\n\
  \                    CHANNEL_ID)\n            .setContentTitle(\"Example Notification\"\
  )\n            .setContentText(\"This is an example notification.\")\n         \
  \   .setSmallIcon(android.R.drawable.ic_dialog_info)\n            .setChannelId(channelID)\n\
  \            .setContentIntent(pendingIntent)\n            .build();\n    notificationManager.notify(notificationId,\
  \ notification);\n}\n```\n\n再次编译并运行应用，点击按钮并显示通知栏。这次，点击通知会导致 `ResultActivity` 启动。\n\
  \n## 62.8 为通知添加操作\n\n为通知添加交互性的另一种方法是创建操作（actions）。它们显示为消息下方的按钮，并被设计为用户点击时触发特定的意图。以下代码如果添加到\
  \ `sendNotification()` 方法中，将添加一个标记为“打开”的操作按钮，用于启动引用的等待意图：\n\n```java\nfinal Icon\
  \ icon = Icon.createResource(MainActivity.this,\n        android.R.drawable.ic_dialog_info);\n\
  Notification.Action action =\n        new Notification.Action.Builder(icon, \"Open\"\
  , pendingIntent)\n            .build();\nNotification notification = new Notification.Builder(MainActivity.this,\
  \ CHANNEL_ID)\n    .setContentTitle(\"Example Notification\")\n    .setContentText(\"\
  This is an example notification.\")\n    .setSmallIcon(R.drawable.ic_info_24dp)\n\
  \    .setChannelId(channelID)\n    .setContentIntent(pendingIntent)\n    .setActions(action)\n\
  \    .build();\n\nnotificationManager.notify(notificationId, notification);\n```\n\
  \n将上述代码添加到方法并运行应用。发布通知并注意通知中出现的“打开”操作（取决于 Android 版本，可能需要下拉通知面板以显示“打开”操作）：\n\n\n\
  \n\n\n![](img/as_3.5_notification_with_action.jpg)\n图 62-12\n\n点击操作将触发挂起的意 并启动 `ResultActivity`。\n\
  \n## 62.9 组合通知 (Bundled Notifications)\n\n如果应用程序倾向于定期发送通知，可能会导致这些通知迅速堆满状态栏和通知栏，从而给用户带来欠佳的体验。这对于新闻或消息类应用尤为如此，因为每当有突发新闻或来自联系人的新消息到达时，它们都会发送通知。请参考图\
  \ 62-13 中的通知：\n\n![](img/as_3.2_unbundled_notifications.jpg)\n图 62-13\n\n现在想象一下如果收到了十条甚至二十条新消息。为了避免这类问题，Android\
  \ 允许将通知组合成组。\n\n要进行组合通知，必须通过 `setGroup()` 方法将每个通知指定为同一组，并且必须发布一条额外的通知并配置为摘要通知（summary\
  \ notification）。例如，以下代码创建并发布了上述图 62-13 所示三个通知，但将它们组合在同一个组中。代码还发布了一条作为摘要的通知：\n\n\
  ```java\nfinal String GROUP_KEY_NOTIFY = \"group_key_notify\";\n\nNotification.Builder\
  \ builderSummary =\n    new Notification.Builder(this, channelID)\n        .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \        .setContentTitle(\"一个组合示例\")\n        .setContentText(\"你有 3 条新消息\")\n\
  \        .setGroup(GROUP_KEY_NOTIFY)\n        .setGroupSummary(true);\n\nNotification.Builder\
  \ builder1 =\n    new Notification.Builder(this, channelID)\n        .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \        .setContentTitle(\"新消息\")\n        .setContentText(\"你收到来自 Kassidy 的新消息\"\
  )\n        .setGroup(GROUP_KEY_NOTIFY);\n\nNotification.Builder builder2 =\n   \
  \ new Notification.Builder(this, channelID)\n        .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \        .setContentTitle(\"新消息\")\n        .setContentText(\"你收到来自 Caitlyn 的新消息\"\
  )\n        .setGroup(GROUP_KEY_NOTIFY);\n\nNotification.Builder builder3 =\n   \
  \ new Notification.Builder(this, channelID)\n        .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \        .setContentTitle(\"新消息\")\n        .setContentText(\"你收到来自 Jason 的新消息\"\
  )\n        .setGroup(GROUP_KEY_NOTIFY);\n\nint notificationId0 = 100;\nint notificationId1\
  \ = 101;\nint notificationId2 = 102;\nint notificationId3 = 103;\n\nnotificationManager.notify(notificationId1,\
  \ builder1.build());\nnotificationManager.notify(notificationId2, builder2.build());\n\
  notificationManager.notify(notificationId3, builder3.build());\nnotificationManager.notify(notificationId0,\
  \ builderSummary.build());\n```\n\n当代码执行时，尽管应用程序发布了四个通知，状态栏中只会显示一个通知图标。在通知栏中，会显示一个单一的摘要通知，列出每个组合通知的信息：\n\
  \n![](img/Image228.jpg)\n图 62-14\n\n在通知条目上进一步滑动可以展开面板，显示每个组合通知的详情：\n\n![](img/Image236.jpg)\n\
  图 62-15\n\n## 62.1 总结\n\n通知提供了一种让应用程序在未运行或处于后台时传递消息的方式。通知显示在状态栏和通知栏中。本地通知由运行的应用程序在设备上触发，而远程通知由远程服务器启动并递送到设备。本地通知使用\
  \ `NotificationCompat.Builder` 创建，并使用 `NotificationManager` 发布。如本章所示，通过利用意图（intents）和\
  \ `PendingIntent` 类，可以配置通知以为用户提供选项（例如启动活动或保存消息）。通知组合提供了一种将通知分组的机制，为发送大量通知的应用程序提供了改进体验。\n\
  \n## 63. 直接回复教程 (An Direct Reply Tutorial)\n\n直接回复是 Android 7 中引入的一项功能，允许用户在通知中输入文本并将其发送到与通知关联的应用程序。这使用户无需启动应用内的活动即可直接回复通知中的消息。本章将基于上一章所学到的知识，创建一个使用此功能的示例应用。\n\
  \n### 63.1 创建 DirectReply 项目\n\n从欢迎屏幕选择 `Create New Project` 启动选项，在生成的项目对话框中，选择\
  \ `Empty Activity` 模板。在 `Name` 字段中输入 `DirectReply`，并指定 `com.ebookfrenzy.directreply`\
  \ 为包名。在点击 `Finish` 按钮之前，将 `Minimum API` 设置为 `API 26: Android 8.0 (Oreo)`，并将 `Language`\
  \ 菜单改为 `Java`。\n\n## 63.2 设计用户界面\n\n在布局工具中加载 `activity_main.xml` 文件。在启用 Autocon\
  \ 的情况下，在现有“Hello World!”标签的下方添加一个 `Button` 对象，如图 63-1 所示。在布局中选中 `Button` 小部件，使用\
  \ `Attributes` 窗口将 `onClick` 属性设置为调用名为 `sendNotification` 方法。如有必要，使用 `Constraints`\
  \ 按钮为布局添加缺失的约束。在继续之前，选择“Hello World!” `TextView`，将 `ID` 属性更改为 `textView` 并修改文本为“Notify”。\n\
  \n![](img/as_4.1_direct_reply_ui.jpg)\n图 63-1\n\n### 63.3 创建通知通道\n\n与上一章示例一样，发送通知之前必须创建一个通道。编辑\
  \ `MainActivity.java` 文件并添加以下代码创建新通道：\n\n```java\n...\nimport android.app.NotificationChannel;\n\
  import android.app.NotificationManager;\nimport android.content.Context;\nimport\
  \ android.graphics.Color;\n...\n\npublic class MainActivity extends AppCompatActivity\
  \ {\n    private NotificationManager notificationManager;\n    private final String\
  \ channelID = \"com.ebookfrenzy.directreply.news\";\n\n    @Override\n    protected\
  \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.activity_direct_reply);\n        notificationManager\
  \ = (NotificationManager)\n            getSystemService(Context.NOTIFICATION_SERVICE);\n\
  \        createNotificationChannel(channelID, \"DirectReply News\", \"Example News\
  \ Channel\");\n    }\n\n    protected void createNotificationChannel(String id,\
  \ String name, String description) {\n        int importance = NotificationManager.IMPORTANCE_HIGH;\n\
  \        NotificationChannel channel =\n            new NotificationChannel(id,\
  \ name, importance);\n        channel.setDescription(description);\n        channel.enableLights(true);\n\
  \        channel.setLightColor(Color.RED);\n        channel.enableVibration(true);\n\
  \        channel.setVibrationPattern(new long[]{100, 200, 300, 400,\n          \
  \  500, 400, 300, 200, 400});\n        notificationManager.createNotificationChannel(channel);\n\
  \    }\n}\n...\n}\n```\n\n### 63.4 构建 RemoteInput 对象\n\n\n\n\n在通知中实现直接内联回复的关键元素是\
  \ `RemoteInput` 类。之前的章节介绍了 `PendingIntent` 类，并解释了它如何允许应用程序创建一个意图（intent），然后授予其他应用程序或服务从原始应用之外启动该意图的能力。在标题为“Android\
  \ 通知教程的章节中，创建了一个等待意图，允许从通知内部启动原始应用中的活动（activity）。`RemoteInput` 类允许将用户输入请求随意图一起包含\
  \ `PendingIntent` 对象中。当 `PendingIntent` 对象中的意图被触发（例如启动一个活动）时，该活动也会接收到用户提供的任何输入。\n\
  \n在通知中实现直接回复的第一步是创建 `RemoteInput` 对象。这通过使用 `RemoteInput.Builder()` 方法实现。要构建 `RemoteInput`\
  \ 对象，需要一个键字符串，用于从生成的意图中提取输入。该对象还需要一个标签字符串，它将显示在通知的文本输入字段中。编辑 `MainActivity.java`\
  \ 文件并开始实现 `sendNotification()` 方法。请注意还添加了一些导入指令和变量，它们将在章节的后续内容中使用：\n\n```java\n\
  package com.ebookfrenzy.directreply;\n\n.\n\n.\n\nimport android.view.View;\n\n\
  import android.app.PendingIntent;\n\nimport android.app.RemoteInput;\n\nimport android.content.Intent;\n\
  \n.\n\n.\n\npublic class MainActivity extends AppCompatActivity {\n    private static\
  \ final int notificationId = 101;\n    private static final String KEY_TEXT_REPLY\
  \ = \"key_text_reply\";\n    private NotificationManager notificationManager;\n\
  \    private static final String channelID = \"com.ebookfrenzy.directreply.news\"\
  ;\n\n.\n\n.\n\n.\n\n    public void sendNotification(View view) {\n        String\
  \ replyLabel = \"Enter your reply here\";\n        RemoteInput remoteInput =\n \
  \           new RemoteInput.Builder(KEY_TEXT_REPLY)\n                .setLabel(replyLabel)\n\
  \                .build();\n    }\n\n...\n}\n```\n\n现在 `RemoteInput` 对象已经通过键和标签字符串进行了初始化，它需要被放置在通知操作对象中。在执行该步骤之前，需要创建\
  \ `PendingIntent` 实例。\n\n### 63.5 创建 PendingIntent\n\n创建 `PendingIntent` 的步骤与“Android\
  \ 通知教程章节中概述的相同，不同之处意图将配置为启动 `MainActivity`。在 `MainActivity.java` 文件中，添加以下代码来创建 `PendingIntent`：\n\
  \n```java\npublic void sendNotification(View view) {\n    String replyLabel = \"\
  Enter your reply here\";\n    RemoteInput remoteInput =\n        new RemoteInput.Builder(KEY_TEXT_REPLY)\n\
  \                .setLabel(replyLabel)\n                .build();\n    Intent resultIntent\
  \ = new Intent(this, MainActivity.class);\n    PendingIntent resultPendingIntent\
  \ =\n        PendingIntent.getActivity(\n            this,\n            0,\n   \
  \         resultIntent,\n            PendingIntent.FLAG_UPDATE_CURRENT\n       \
  \ );\n}\n```\n\n### 63.6 创建回复操作\n\n内联回复将可以通过通知中的操作按钮进行访问。现在需要创建此操作，并使用图标、显示在按钮上的标签、`PendingIntent`\
  \ 对象和 `RemoteInput` 对象进行配置。修改 `sendNotification()` 方法以添加创建此操作的代码：\n\n```java\nimport\
  \ android.graphics.drawable.Icon;\nimport android.app.Notification;\nimport android.graphics.Color;\n\
  import androidx.core.content.ContextCompat;\n\n.\n\npublic void sendNotification(View\
  \ view) {\n    String replyLabel = \"Enter your reply here\";\n    RemoteInput remoteInput\
  \ =\n        new RemoteInput.Builder(KEY_TEXT_REPLY)\n                .setLabel(replyLabel)\n\
  \                .build();\n    Intent resultIntent = new Intent(this, MainActivity.class);\n\
  \    PendingIntent resultPendingIntent =\n        PendingIntent.getActivity(\n \
  \           this,\n            0,\n            resultIntent,\n            PendingIntent.FLAG_UPDATE_CURRENT\n\
  \        );\n    final Icon icon =\n        Icon.createWithResource(MainActivity.this,\n\
  \        android.R.drawable.ic_dialog_info);\n    Notification.Action replyAction\
  \ =\n        new Notification.Action.Builder(\n            icon,\n            \"\
  Reply\", resultPendingIntent)\n                .addRemoteInput(remoteInput)\n  \
  \              .build();\n}\n\n.\n```\n\n在教程的这一阶段，我们已经构建并准备好使用 `RemoteInput`、`PendingIntent`\
  \ 和 `Notification Action` 对象。下一阶段是构建通知并发布它：\n\n```java\npublic void sendNotification(View\
  \ view) {\n    String replyLabel = \"Enter your reply here\";\n    RemoteInput remoteInput\
  \ =\n        new RemoteInput.Builder(KEY_TEXT_REPLY)\n                .setLabel(replyLabel)\n\
  \                .build();\n    Intent resultIntent = new Intent(this, MainActivity.class);\n\
  \    PendingIntent resultPendingIntent =\n        PendingIntent.getActivity(\n \
