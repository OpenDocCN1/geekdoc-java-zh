  \                R.color.design_color_primary))\n                .setSmallIcon(android.R.drawable.ic_dialog_info)\n\
  \                .setContentTitle(\"My Notification\")\n                .setContentText(\"\
  This is a test message\")\n                .addAction(replyAction).build();\n  \
  \  NotificationManager notificationManager =\n        (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);\n\
  \    notificationManager.notify(notificationId, newMessageNotification);\n}\n```\n\
  \n完成修改后，编译并运行应用程序，测试点击按钮是否成功发布了通知。查看通知栏时，通知应该如图 63-2（Direct_Reply.xhtml__idTextAnchor1201）所示。\n\
  \n### 63.7 接收直接回复输入\n\n现在通知已成功获取用户的输入，应用程序需要对这些输入进行处理。本教程的目标是让用户在通知中输入的文本显示在活动用户界面的\
  \ `TextView` 上。\n\n\n\n\n当用户输入文本并点击发送按钮时，`MainActivity` 将通过 `PendingIntent` 对象中包含的\
  \ `intent` 启动。该 `intent` 中包含了用户通过通知输入的文本。在 activity 的 `onCreate()` 方法中，调用 `getIntent()`\
  \ 方法将返回启动该 activity 的 `intent` 副本。将其传递给 `RemoteInput.getResultsFromIntent()` 方法，反过来将返回一个包含回复文本的\
  \ `Bundle` 对象，该文本可以被提取并赋值给 `TextView` 小部件。这导致了 `MainActivity.java` 文件中的 `onCreate()`\
  \ 方法被修改，其内容如下：\n\n```java\nimport android.widget.TextView;\n\n@Override\nprotected\
  \ void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    setContentView(R.layout.activity_direct_reply);\n    notificationManager =\n\
  \            (NotificationManager)\n                getSystemService(Context.NOTIFICATION_SERVICE);\n\
  \    createNotificationChannel(channelID, \"DirectReply News\",\n              \
  \                       Example News Channel\");\n    handleIntent();\n}\n\nprivate\
  \ void handleIntent() {\n    Intent intent = this.getIntent();\n    Bundle remoteInput\
  \ = RemoteInput.getResultsFromIntent(intent);\n    if (remoteInput != null) {\n\
  \        TextView myTextView = findViewById(R.id.textView);\n        String inputString\
  \ = remoteInput.getCharSequence(\n                KEY_TEXT_REPLY).toString();\n\
  \        myTextView.setText(inputString);\n    }\n}\n```\n\n在这些代码更改后，再次编译并运行应用。点击按钮发出通知，并在通知面板中输入并发送一些文本。注意，`MainActivity`\
  \ 中的 `TextView` 小部件已更新，以显示所输入的内联文本。\n\n## 63.8 更新通知\n\n在通知中发送回复后，你可能会注意到如图 63-4\
  \ 所示，进度指示器仍在通知面板内旋转：\n\n![](img/Image24491.jpg)\n\n图 63-4\n\n通知显示此指示器是因为它正在等待 activity\
  \ 的响应，以确认已收到发送的文本。执行此任务推荐的方法是更新通知，使用一条新消息表示回复已收到并处理。由于原始通知在发布时已分配了一个 ID，可以再次使用该\
  \ ID 执行更新。在 `handleIntent()` 方法中添加以下代码来执行此任务：\n\n```java\nprivate void handleIntent()\
  \ {\n    Intent intent = this.getIntent();\n    Bundle remoteInput = RemoteInput.getResultsFromIntent(intent);\n\
  \    if (remoteInput != null) {\n        TextView myTextView = findViewById(R.id.textView);\n\
  \        String inputString = remoteInput.getCharSequence(\n                KEY_TEXT_REPLY).toString();\n\
  \        myTextView.setText(inputString);\n        Notification repliedNotification\
  \ =\n                new Notification.Builder(this, channelID)\n               \
  \         .setSmallIcon(\n                                            android.R.drawable.ic_dialog_info)\n\
  \                        .setContentText(\"Reply received\")\n                 \
  \       .build();\n        notificationManager.notify(id, repliedNotification);\n\
  \    }\n}\n```\n\n最后一次一次应用，并验证进度指示器已消失：\n\n![](img/Image2451.jpg)\n\n图 63-5\n\n\
  ## 64. 折叠屏与多窗口\n\n折叠屏设备无论我们是否准备好都会到来。为了准备这一类别，了解应用在折叠屏设备上运行时应该采取的一些步骤是非常重要的。\n\n\
  ### 64.1 折叠屏与多窗口\n\n当应用运行在折叠屏设备上时，处理配置更改非常重要。虽然多窗口最初是在 Android 7 中引入的，但多窗口允许同时显示多个\
  \ activity。多窗口支持提供了不同形式的窗口。分屏模式（在大多数手机和平板设备上可用）提供了一个分屏环境，其中两个 activity 并排或一个一在上地显示。它提供了一个可移动的分割线，当用户拖动时，它可以调整分配给每个\
  \ activity 的屏幕百分比：\n\n![](img/Image2427.jpg)\n\n图 64-1\n\n自由模式（Freeform mode）为较大的屏幕提供了一个窗口化环境，允许每个\
  \ activity 在可调整的窗口中出现，并且不限于同时显示两个 activity。例如，图 64-2 显示了一个处于自由模式下的设备，同时显示了计算器和第二个应用：\n\
  \n![](img/Image2436.jpg)\n\n图 64-2\n\n画中画（Picture-in-picture）支持正如其名义，允许视频在用户执行其他任务时在较小的窗口中继续播放，主题将在题为`Android\
  \ 画中画`的章节中开始介绍。\n\n### 64.2 使用折叠屏模拟器\n\n尽管在编写时，市场上还没有可用于应用测试的折叠屏设备，但 Android SDK\
  \ 包含了折叠屏模拟器。要创建一个折叠屏模拟器，选择 Android Studio Tools -> AVD Manager 菜单选项，点击 Create Virtual\
  \ Device 按钮，并在硬件选择屏幕中，选择下方图 64-3 所示的折叠屏选项之一：\n\n![](img/as_3.5_foldable_emulator.jpg)\n\
  \n图 64-3\n\n选择折叠屏选项后，继续创建过程，选择 Android 10 API 29 或更高版本作为系统镜像。一旦模拟器启动运行，工具栏上会出现一个额外的按钮，允许模拟器在折叠和展开配置之间进行切换：\n\
  \n![](img/as_3.5_foldable_emulator_fold_button.jpg)\n\n图 64-4\n\n### 64.3 进入多窗口模式\n\
  \n进入分屏模式的方法是显示最近屏幕（Overview screen），长按列出应用工具栏中的应用图标，并选择如图 64-5 所示的“Split screen”菜单选项：\n\
  \n![](img/as_3.5_split_screen_button.jpg)\n\n图 64-5\n\n\n\n\n一旦进入分屏模式，“概览”按钮将变为显示两个矩形（在图\
  \ 64-6 中标记为 A），当前活动将占据屏幕部分 (B)，概览屏幕将出现在屏幕的相邻部分，允许选择第二个活动进行显示 (C)：\n\n![](img/as_3.5_split_screen_select_second_app.jpg)\n\
  \n图 64-6\n\n一旦选择了第二个应用，屏幕将如上文图 64-1 所示被平分。\n\n要退出分屏模式，只需将分隔两个活动的分隔线拖动到最边缘，使一个活动占据整个屏幕，或者长按“概览”按钮，直到它变恢复为单个正方形。\n\
  \n## 64.4 启用和使用自由窗口（Freeform）支持\n\n尽管并非所有设备都受到官方支持，但在大屏设备和模拟器上可以启用自由窗口多窗口模式。要启用此模式，请在模拟器运行或设备连接时，运行以下\
  \ `adb` 命令：\n\n```\nadb shell settings put global enable_freeform_support 1\n```\n\
  \n进行此更改后，可能需要重启设备以使设置生效。\n\n一旦启用，在概览屏幕中长按应用图标时，将出现一个额外选项，如图 64-7 所示：\n\n![](img/as_3.5_freeform_button.jpg)\n\
  \n图 64-7\n\n## 64.5 检查是否支持自由窗口\n\n正如本章早些提到的，Google 将是否启用自由窗口多窗口模式的选择权交给了各个 Android\
  \ 设备制造商。由于由于只有在较大的设备上使用自由窗口才有意义，因此无法保证每个可能运行应用程序的设备上都提供自由窗口功能。幸运的是，如果设备不支持自由窗口模式，系统将忽略所有自由自由窗口的方法和属性，因此使用这些功能不会导致应用在非自由窗口设备上崩溃。然而，可能会出现某些情况，此时检测设备是否支持自由窗口多窗口会有用。幸运的是，可以通过检查包管理器中的自由窗口窗口管理功能来实现。以下代码示例检查了自由窗口多窗口支持，并根据测试结果返回布尔值：\n\
  \n```java\npublic Boolean checkFreeform() {\n    return getPackageManager().hasSystemFeature(\n\
  \            PackageManager.FEATURE_FREEFORM_WINDOW_MANAGEMENT);\n}\n```\n\n## 64.6\
  \ 在应用中启用多窗口支持\n\n`android:resizableActivity` 清清单文件设置控制应用是否支持多窗口行为。此设置可以在应用程序级或单个活动级进行配置。例如，下面的代码片段配置了名为\
  \ `MainActivity` 的活动以支持分屏和自由窗口多窗口模式：\n\n```xml\n<activity\n    android:name=\".MainActivity\"\
  \n    android:resizeableActivity=\"true\"\n    android:label=\"@string/app_name\"\
  \n    android:theme=\"@style/AppTheme.NoActionBar\">\n    <intent-filter>\n    \
  \    <action android:name=\"android.intent.action.MAIN\" />\n        <category android:name=\"\
  android.intent.category.LAUNCHER\" />\n    </intent-filter>\n</activity>\n```\n\n\
  将该属性设置为 `false` 将防止该活动在分屏或自由窗口模式下出现，且相应的按钮将不会出现在应用的概览菜单中。在分屏配置中选择一个禁用多窗口支持的活动作为第二个活动时，将显示一条消息，指示该应用可能不支持多窗口模式。\n\
  \n## 64.7 指定多窗口属性\n\n`<layout>` 元素提供了若干属性，可用于指定活动在多窗口模式下启动时的尺寸和位置。当在自由窗口模式下启动时，活动的初始高度、宽度和位置可以使用以下属性指定：\n\
  \n- `android:defaultWidth` – 指定活动的默认宽度。\n- `android:defaultHeight` – 指定活动的默认高度。\n\
  - `android:gravity` – 指定活动的初始位置（起始、结束、左侧、右侧、顶部等）。\n\n请注意，上述属性仅在活动于自由窗口模式下显示时生效。以下示例配置了活动使其在屏幕起始边缘的顶部以特定的高度和宽度出现：\n\
  \n```xml\n<activity android:name=\".MainActivity \">\n    <layout android:defaultHeight=\"\
  350dp\"\n             android:defaultWidth=\"450dp\"\n             android:gravity=\"\
  start|end\" />\n</activity>\n```\n\n以下 `<layout>` 属性可用于指定活动在分屏视图或自由窗口模式下可以缩小的最小宽度和高度：\n\
  \n- `android:minimalHeight` – 指定活动在分屏视图或自由窗口模式下可以缩小的最小高度。\n- `android:minimalWidth`\
  \ – 指定活动在分屏视图或自由窗口模式下可以缩小的最小宽度。\n\n当用户将分屏分隔线滑动超出高度或宽度边界时，系统将停止调整活动大小并简单地对用户进行裁剪。以下清清单文件实现了活动的最小宽度和高度：\n\
  \n```xml\n<activity android:name=\".MainActivity \">\n    <layout android:minimalHeight=\"\
  400dp\"\n    android:minimalWidth=\"290dp\" />\n</activity>\n```\n\n## 64.8 在活动中检测窗口模式\n\
  \n可能会出现某些情况，需要检测活动是否正以多窗口模式显示。当前状态可以通过调用 `Activity` 类的 `isInWindowMode()` 方法获取。调用时，该方法根据活动是否为全屏返回\
  \ true 或 false 值：\n\n```java\nif (isInWindowMode()) {\n    // 正在多窗口模式运行\n} else\
  \ {\n    // 不在多窗口模式运行\n}\n```\n\n## 64.9 接收多窗口通知\n\n如果活动重写了 `onWindowChanged()`\
  \ 回调方法，则将接收进入或退出多窗口模式的通知。传递给方法的第一个参数在进入多窗口模式时为 true，在退出时为 false。新设置包含在第二个参数的 `Configuration`\
  \ 对象中：\n\n```java\n@Override\npublic void onWindowChanged(boolean isInWindowMode,\
  \ Configuration newConfig) {\n    super.onWindowChanged(isInWindowMode, newConfig);\n\
  \    if (isInWindowMode) {\n        // 进入了多窗口模式\n    } else {\n        // 退出多窗口模式\n\
  \    }\n}\n```\n\n正如处理 Android 活动状态变化 章节中所述，Android 10 及更高版本允许多个活动同时处于恢复状态（也称为多恢复）。用户最近交互的活动被称为顶部恢复活动。为了跟踪活动获取和丢失顶部恢复状态的过程，可以在活动中实现\
  \ `onTopResumedActivityChanged()` 回调方法，例如：\n\n```java\n@Override\npublic void onTopResumedActivityChanged(boolean\
  \ isTopResumedActivity) {\n    super.onTopResumedActivityChanged(isTopResumedActivity);\n\
  \    if (isTopResumedActivity) {\n        // 活动现在是顶部恢复活动\n    } else {\n       \
  \ // 活动不再是顶部恢复活动\n    }\n}\n```\n\n在某些运行 Android 9 的设备上，通过在应用清清单文件中启用以下属性，可能也可以在应用中利用多恢复：\n\
  \n```xml\n<meta-data\n    android:name=\"android.window.multi_resume\"\n    android:value=\"\
  true\" />\n```\n\n\n\n\n\n`android:name=\"android.allow_multiple_resumed_activities\"\
  \ android:value=\"true\" />`\n\n## 64.10 在多窗口模式下启动 Activity\n\n在本本书的 Android 显式意图——示例章节中，创建了一个示例应用，其中一个\
  \ activity 使用 `intent` 启动第二个 activity。默认情况下，通过 `intent` 启动的 activity 被认为与源 activity\
  \ 位于同一个任务栈（task stack）中。然而，通过向 `intent` 传递适当的标志，可以将 activity 启动到新的任务栈中。\n\n当多窗口模式下的\
  \ activity 在同一个任务栈内启动另一个 activity 时，新 activity 将替换分屏或自由窗口窗口（freeform window）中的源\
  \ activity（用户可以通过返回键回到原始 activity）。\n\n然而，如果在分屏模式下启动到新的任务栈中，第二个 activity 将出现在原始\
  \ activity 邻的窗口中，从而允许同时查看两个 activity。在自由模式（freeform mode）下，启动的 activity 将在与原始 activity\
  \ 独立的窗口中显示。\n\n为了将 activity 启动到新的任务栈中，必须在启动 `intent` 之前在其上设置以下标志：\n\n• `Intent.FLAG_ACTIVITY_LAUNCH_ADJACENT`\n\
  • `Intent.FLAG_ACTIVITY_MULTIPLE_TASK`\n• `Intent.FLAG_ACTIVITY_NEW_TASK`\n\n例如，以下代码配置并启动了一个设计在独立窗口中显示的第二个\
  \ activity：\n\n```\nIntent i = new Intent(this, SecondActivity.class);\n\ni.addFlags(Intent.FLAG_ACTIVITY_LAUNCH_ADJACENT|\n\
  \          Intent.FLAG_ACTIVITY_MULTIPLE_TASK|\n          Intent.FLAG_ACTIVITY_NEW_TASK);\n\
  \nstartActivity(i);\n```\n\n## 64.11 配置自由窗口 Activity 的大小和位置\n\n默认情况下，在自由模式下启动到不同任务栈的\
  \ activity 将位于屏幕中心，大小由系统决定。此窗口的位置和尺寸可以通过通过 `ActivityOptions` 类向 `intent` 传递启动边界（launch\
  \ bounds）设置来控制。该过程的第一步是创建一个 `Rect` 对象，并配置为代表 activity 窗口的矩形的左侧 (`X`)、顶部 (`Y`)、右侧\
  \ (`X`) 和底部 (`Y`) 坐标。例如，以下代码创建了一个 `Rect` 对象，其左上角位于坐标 (0, 0)，右下角位于 (100, 100)：\n\n\
  ```\nRect rect = new Rect(100, 800, 900, 700);\n```\n\n下一步是创建一个 `ActivityOptions`\
  \ 类的基本实例，并通过 `setLaunchBounds()` 方法使用 `Rect` 设置对其初始化：\n\n```\nActivityOptions options\
  \ = ActivityOptions.makeBasic();\n\nActivityOptions bounds = options.setLaunchBounds(rect);\n\
  ```\n\n最后，将 `ActivityOptions` 实例转换为 `Bundle` 对象，并与 `Intent` 对象一起传递给 `startActivity()`\
  \ 方法：\n\n```\nstartActivity(i, bounds.toBundle());\n```\n\n将这些步骤结合起来，得到的代码序列如下：\n\
  \n```\nIntent i = new Intent(this, SecondActivity.class);\n\ni.addFlags(Intent.FLAG_ACTIVITY_LAUNCH_ADJACENT|\n\
  \          Intent.FLAG_ACTIVITY_MULTIPLE_TASK|\n          Intent.FLAG_ACTIVITY_NEW_TASK);\n\
  \nRect rect = new Rect(100, 800, 900, 700);\n\nActivityOptions options = ActivityOptions.makeBasic();\n\
  \nActivityOptions bounds = options.setLaunchBounds(rect);\n\nstartActivity(i, bounds.toBundle());\n\
  ```\n\n当源 activity 处于自由模式时，通过 `intent` 启动第二个 activity，新 activity 窗口将按照 `Rect` 对象中定义的位置和尺寸显示。\n\
  \n## 64.12 总结\n\nAndroid 7 引入了多窗口支持，这是一个允许在屏幕上任何时候显示多个 activity 的系统。此功能现在构为折叠设备提供支持的基础。多窗口支持提供的三种模式是分屏（split-screen）、自由窗口（freeform）和画中画（picture-in-picture）。在分屏模式下，屏幕水平或垂直划分为两个窗格，每个窗格显示一个\
  \ activity。自由模式仅支持某些 Android 设备，允许每个 activity 出现在独立的可移动且可调整大小的窗口中。正如本章概述，Android\
  \ SDK 提供了许多方法和属性设置，用于检测、响应和控制应用内部的多窗口行为。\n\n## 65. Android SQLite 数据库概述\n\n很少有移动应用不需要存储至少一些持久化数据。数据库的使用是大多数应用程序中不可或缺的方面，从几乎完全由数据驱动的应用到只需要存储少量数据（如游戏的当前得分）的应用均如此。\n\
  \n考虑到典型的 Android 应用具有某种瞬态的生命周期，持久化数据存储的重要性变得更加明显。由于 Android 运行时系统存在随时可能终止应用程序组件以释放资源的风险，因此制定一个全面的数据存储策略以避免数据丢失，是任何应用开发策略设计和实现的关键因素。\n\
  \n本章将概述 Android 操作系统捆带的 SQLite 数据库管理系统，并概述辅助持久化 SQLite 数据库存储的 Android SDK 类。\n\n\
  ### 65.1 理解数据库表\n\n数据库表（Database Tables）提供了数据库中最基础的数据结构。每个数据库可以包含多个表，每个表设计用于存储特定类型的信息。例如，一个数据库可能包含一个客户表，存储每个客户的名称、地址和电话。数据库中的每个表都将被分配一个名称，该名称在数据库内部是唯一的。\n\
  \n## 65.2 数据库模式（Schema）\n\n数据库模式（Database Schema）定义了数据库中存储数据的特征。例如，客户表的模式可能会定义客户名称为长度不超过\
  \ 20 个字符的字符串，并且客户电话为特定格式的数值数据字段。\n\n模式还用于定义整个数据库的结构以及其中包含的表之间的关系。\n\n### 65.3 列和数据类型\n\
  \n在此阶段，将数据库表视为类似于电子表格是有帮助的，数据以行和列的形式存储。\n\n每一列代表对应表中的一个数据字段。例如，表的名称、地址和电话数据字段都是列。\n\
  \n每一列反都被定义为包含某种类型的数据。因此，设计用于存储数字的列将被定义为包含数值数据。\n\n### 65.4 数据库行\n\n每个保存到表中的新记录都存储在行中。每行反过来由与保存记录关联的列组成。\n\
  \n\n\n\n行（Rows）有时也被称为记录（records）或条目（entries），这些术语通常通用。\n\n## 65.5 介绍主键\n\n每个数据库表都应该包含一个或多个列，用于唯一标识表中的每一行。这在数据库术语中被称为\
  \ `Primary Key`（主键）。例如，一个表可以使用银行账户号码列作为主键。或者，客户表可以使用客户的社会安全号作为主键。\n\n主键允许数据库管理系统唯一地标识表中的特定行。如果没有主键，将无法检索或删除表中的特定行，因为无法确定是否选中了正确的行。例如，假设存在一个表，客户的姓氏（last\
  \ name）被定义为主键。想象一下，如果数据库中记录了多个姓“Smith”的客户，可能会出现什么问题。如果没有某种能够保证的方法来唯一标识特定行，就无法确保在任何时候访问的都是正确的数据。\n\
  \n主键可以由由表中的单列组成，也可以由多列组成。要符合单列主键的条件，任何两行都不能包含相同的主键值。当使用多个列构造主键时，单个列的值不需要是唯一的，但所有列的值组合在一起必须是唯一的。\n\
  \n## 65.6 什么是 SQLite?\n\nSQLite 是一个嵌入型关系型数据库管理系统（RDBMS）。大多数关系型数据库（`Oracle`、`SQL\
  \ Server` 和 `MySQL` 是例子）是独立的服务器进程，它们与需要数据库访问的应用程序协作运行。SQLite 被称为嵌入式，因为它是以库的形式提供的，并链接到应用程序中。因此，后台没有运行独立的数据库服务器。所有的数据库操作都是在应用程序内部通过调用\
  \ `SQLite` 库包含的函数来处理。\n\n`SQLite` 的开发者已将该技术投入公有领域，因此它现在是一种广泛部署的数据库解决方案。\n\n`SQLite`\
  \ 使用 `C` 语言编写，因此 `Android SDK` 为底层数据库接口提供了一个基于 `Java` 的“封装”（wrapper）。这本质上由一组类组成，可以在应用程序的\
  \ `Java` 或 `Kotlin` 代码中创建并管理基于 `SQLite` 的数据库。\n\n有关 `SQLite` 的更多信息，请参阅 [`www.sqlite.org`](http://www.sqlite.org)。\n\
  \n## 65.7 结构化查询语言 (SQL)\n\n在 `SQLite` 数据库中，使用名为结构化查询语言（Structured Query Language）的高级语言访问数据。这通常缩写为\
  \ `SQL`，读作 sequel。`SQL` 是大多数关系型数据库管理系统的标准语言。`SQLite` 大多符合 `SQL-92` 标准。\n\n`SQL`\
  \ 本质上是一种非常简单且易用的语言，专门设计用于数据库数据的读取和写入。由于 `SQL` 包含一组很小的关键字，因此可以快速学习。此外，大多数 `DBMS`\
  \ 实现之间的 `SQL` 语法大同小异，因此在学习了某个系统的 `SQL` 后，你的技能很可能会迁移到其他数据库管理系统。\n\n虽然本章将使用一些基础的 `SQL`\
  \ 语句，但对 `SQL` 的详细概述超出了本书的范围。然而，还有许多其他资源可以提供比我们在这里单个章节中能提供的详尽得多的 `SQL` 概述。\n\n##\
  \ 65.8 在 Android 虚拟设备 (AVD) 上尝试 SQLite\n\n对于不熟悉熟悉数据库（特别是 `SQLite`）的读者来说，直接开始创建一个使用\
  \ `SQLite` 的 Android 应用程序可能看起来有些令畏。幸运的是，Android 预装了 `SQLite`，包括一个交互环境，可以从连接到运行中的\
  \ Android `AVD` 模拟器实例的 `adb shell` 会话发出 `SQL` 命令。这既是学习 `SQLite` 和 `SQL` 的有效方法，也是识别运行在模拟器中的应用程序所创建的数据库问题的无贵工具。\n\
  \n要启动交互式 `SQLite` 会话，首先运行 `AVD` 会话。这可以通过 `Android Studio` 内部启动 `Android Virtual\
  \ Device Manager`（`Tools` -> `AVD Manager`），选择之前配置过的 `AVD` 并点击启动按钮来实现。\n\n一旦 `AVD`\
  \ 启动运行，打开 `Terminal` 或 `Command-Prompt` 窗口，并如下使用 `adb` 命令行工具连接到模拟器（注意 `-e` 标志指示工具查找要连接的模拟器，而不是物理设备）：\n\
  \n```bash\nadb –e shell\n```\n\n连接后，shell 环境将提供一个命令提示符，可以在其中输入命令。首先使用 `su` 命令获取超级用户权限：\n\
  \n```\nGeneric_x86:/ su\nroot@android:/ #\n```\n\n如果出现指示不允许超级用户权限的消息，可能是因为 `AVD`\
  \ 实例包含了 `Google Play` 支持。要解决这个问题，请创建一个 `AVD`，并在“Choose a device definition”屏幕上选择一个在“Play\
  \ Store”列中没有标记的设备。\n\n存储在 `SQLite` 数据库中的数据实际上存储在运行应用程序的 Android 设备的文件系统的数据库文件中。默认情况下，这些数据库文件的文件系统路径为：\n\
  \n`/data/data/<package name>/databases/<database filename>`\n\n例如，如果包名为 `com.example`\
  \ 的应用程序创建一个名为 `mydabase.db` 的数据库，则设备上的路径如下：\n\n`/data/data/com.example/databases/mydabase.db`\n\
  \n\n\n\n要提取符合特定标准的行：\n\n```sqlite\nsqlite> select * from contacts where name=\"\
  Mike Parks\";\n2|Mike Parks|10 Upping Street, Idaho|444-444-1212\n```\n\n退出 sqlite3\
  \ 交互环境：\n\n```sqlite\nsqlite> .exit\n```\n\n在模拟器环境中运行 Android 应用程序时，任何数据库文件将使用之前讨论的路径约定创建在模拟器的文件系统中。这样做的处是，你可以通过\
  \ `adb` 连接，导航到数据库文件所在，将其加载到 `sqlite3` 交互工具中，并对数据进行操作，以识别应用程序代码中可能出现的问题。\n\n同样重要的是，虽然可以通过\
  \ `adb shell` 连接到物理 Android 设备，但 shell 默认没有获得足够的权限来创建和管理 SQLite 数据库。因此，调试数据库问题最好在\
  \ AVD 会话中进行。\n\n# 65.9 The Android Room 持久化库\n\n如前所述，SQLite 是用 C 编程语言编写的，而 Android\
  \ 应用程序主要使用 `Java` 或 `Kotlin` 开发。为了弥补过去这种“语言鸿沟”，Android SDK 包含了一组类，它们在 SQLite 数据库管理系统之上提供了一个层。尽管这些类在\
  \ SDK 中仍然可用，但使用它们仍然需要编写大量的代码，并且没有利用新的架构指南和功能（如 `LiveData` 和生命周期管理）。为了解决这些缺点，Android\
  \ Jetpack 架构组件包含了 `Room` 持久化库。该库在 SQLite 数据库系统之上提供了一个高级接口，使得能够以极少的代码在 Android 设备上本地存储数据，同时符合现代应用程序架构的建议。\n\
  \n接下来的几章将提供使用 `Room` 持久化库进行 SQLite 数据库管理的概述和教程。\n\n# 65.10 总结\n\nSQLite 是一种轻量级、嵌入式的关系型数据库管理系统，作为\
  \ Android 框架的一部分包含，并为 Android 应用程序实现组织化的持久化数据存储提供了机制。与 `Room` 持久化库结合时，Android 提供了一种从\
  \ Android 应用程序内部实现数据存储的现代方法。\n\n本章的目标是提供 Android 应用程序开发背景下对通用数据库（特别是 SQLite）的概述。接下来的章节将提供\
  \ `Room` 持久化库的概述，之后我们将完成示例应用程序的创建。\n\n# 66. The Android Room 持久化库\n\n`Room` 持久化库包含在\
  \ Android 架构组件中，专门设计用于更容易地为 Android 应用程序添加数据库存储支持，这种方式符合 Android 架构指南。在上一章涵盖了 SQLite\
  \ 数据库基础知识后，本章将探索基于 `Room` 的数据库管理的基本概念、协同工作并在 Android 应用程序中实现 `Room` 支持的关键元素，以及这些元素在架构和编码方面是如何实现的。在涵盖这些主题后，接下来的两章将示例\
  \ `Room` 数据库项目的形式将理论付诸实践。\n\n## 66.1 重温现代应用架构\n\n标题为 \"Modern Android App Architecture\
  \ with Jetpack\" 的章节引入了现代应用架构的概念，并强调了分离应用内不同职责区域的重要性。图 66-1 所示的图概述了典型 Android 应用程序的推荐架构：\n\
  \n![](img/room_diagram_1.jpg)\n\n图 66-1\n\n由于该架构的前三个层已经在本书之前的章节中进行了详细介绍，现在是时候开始在\
  \ `Room` 持久化库的背景下探索仓库和数据库架构层了。\n\n## 66.2 Room 数据库持久化的关键元素\n\n在章节后面后的详细讨论之前，首先值得总结使用\
  \ `Room` 持久化库操作 SQLite 数据库时涉及的关键元素：\n\n### 66.2.1 仓库 (Repository)\n\n如之前所述，仓库模块包含了直接处理应用程序使用的所有数据源所需的所有。这避免了\
  \ UI 控制器和 `ViewModel` 需要包含直接访问数据库或网络服务的代码。\n\n### 66.2.2 Room 数据库\n\n`room` 数据库对象提供了指向底层\
  \ SQLite 数据库的接口。它还为仓库提供了访问数据访问对象 (`DAO`) 的权限。应用程序应该只有一个 `room` 数据库实例，然后可以使用它来访问多个数据库表。\n\
  \n### 66.2.3 数据访问对象 (DAO)\n\n`DAO` 包含了仓库在 SQLite 数据库中插入、检索和删除数据所需的 SQL 语句。这些 SQL\
  \ 语句映射到方法，然后从仓库内部调用这些方法来执行相应的查询。\n\n### 66.2.4 实体 (Entities)\n\n实体是一个定义数据库中表模式的类，定义了表名、列名和数据类型，并指定哪一列为主键。除了声明表模式外，实体类还包含\
  \ getter 和 setter 方法，提供访问这些数据字段的。`DAO` 响应 SQL 查询方法调用返回给仓库的数据将以这些实体实例的形式存在。然后将调用\
  \ getter 方法以从实体对象中提取数据。同样，当仓库需要向数据库写入新记录时，它会创建一个实体实例，通过 setter 调用在对象上配置值，然后调用在 `DAO`\
  \ 中声明的 insert 方法，传递要保存的实体实例。\n\n### 66.2.5 SQLite 数据库\n\n负责存储和提供数据访问的实际 SQLite 数据库。应用程序代码（包括仓库）永远不应直接访问此底层数据库。所有的数据库操作都是通过\
  \ `room` 数据库、`DAO` 和实体的结合完成的。\n\n图 66-2 中的架构图说明了这些不同元素交互并在 Android 应用程序中提供基于 `Room`\
  \ 的数据库存储的方式：\n\n![](img/room_architecture_diagram.jpg)\n\n图 66-2\n\n上述架构图中编号连接可以总结如下：\n\
  \n1. 仓库与 `Room` 数据库交互以获取数据库实例，该实例反过来用于获取 `DAO` 实例引用。\n2. 仓库创建实体实例并配置数据，然后传递给 `DAO`\
  \ 用于搜索和插入操作。\n3. 仓库调用 `DAO` 的方法，传递要插入数据库的实体，并在响应查询时接收实体实例。\n4. 当 `DAO` 有结果返回给仓库时，它会将这些结果封装成实体对象。\n\
  5. `DAO` 与 `Room` 数据库交互以启动数据库操作并处理结果。\n6. `Room` 数据库处理与底层 SQLite 数据库的所有底层交互，提交查询并接收结果。\n\
  \n在涵盖了使用 `Room` 持久化库进行数据库访问的关键元素的概述后，现在是时候详细探索实体、`DAO`、`room` 数据库和仓库了。\n\n## 66.3\
  \ 理解实体\n\n\n\n\n\n每个数据库表都关联着一个实体类。该类定义了表的结构（schema），其形式为标准的 Java 类，并穿插了一些特殊的 Room\
  \ 注解（annotations）。一个声明要存储在数据库表中数据的 Java 类示例如下：\n\n```java\npublic class Customer\
  \ {\n    private int id;\n    private String name;\n    private string address;\n\
  \n    public Customer(String name, String address) {\n        this.id = id;\n  \
  \      this.name = name;\n        this.address = address;\n    }\n\n    public int\
  \ getId() {\n        return this.id;\n    }\n\n    public String getName() {\n \
  \       return this.name;\n    }\n\n    public int getAddress() {\n        return\
  \ this.address;\n    }\n\n    public void setId(int id) {\n        this.id = id;\n\
  \    }\n\n    public void setName(String name) {\n        this.name = name;\n  \
  \  }\n\n    public void setAddress(int quantity) {\n        this.address = address;\n\
  \    }\n}\n```\n\n按照目前的实现，上述代码声明了一个基础 Java 类，其中包含若干个代表数据库表字段的变量以及一组 getter 和 setter\
  \ 方法。然而，该类尚未还一个实体。要使此类成为实体并使其能够在 SQL 语句中访问，需要按照所示添加一些 Room 注解：\n\n```java\n@Entity(tableName\
  \ = \"customers\")\npublic class Customer {\n    @PrimaryKey(autoGenerate = true)\n\
  \    @NonNull\n    @ColumnInfo(name = \"customerId\")\n    private int id;\n\n \
  \   @ColumnInfo(name = \"customerName\")\n    private String name;\n    private\
  \ string address;\n\n    public Customer(String name, String address) {\n      \
  \  this.id = id;\n        this.name = name;\n        this.address = address;\n \
  \   }\n\n    public int getId() {\n        return this.id;\n    }\n\n    public\
  \ String getName() {\n        return this.name;\n    }\n\n    public int getAddress()\
  \ {\n        return this.address;\n    }\n\n    public void setId(@NonNull int id)\
  \ {\n        this.id = id;\n    }\n\n    public void setName(String name) {\n  \
  \      this.name = name;\n    }\n\n    public void setAddress(int quantity) {\n\
  \        this.address = address;\n    }\n}\n```\n\n上述注解首先声明该类代表一个实体，并分配了一个名为“customers”的表名。这是在\
  \ DAO SQL 语句中引用该表的名称：\n\n`@Entity(tableName = \"customers\")`\n\n每个数据库表都需要一个列作为主键。在本例中，customer\
  \ id 被声明为主键。还添加了注解来指定在 SQL 查询中引用的列名，并指示该字段不能存储空值（null）。最后，`id` 值被配置为自动生成。这意味着分配给新记录的\
  \ `id` 将由系统自动生成，以避免键冲突。\n\n`@PrimaryKey(autoGenerate = true)`\n`@NonNull`\n`@ColumnInfo(name\
  \ = \"customerId\")`\n`private int id;`\n\ncustomer name 字段分配了一个列名。但注意，上面的示例中并没有使用\
  \ `address` 字段。`id` 值被配置为自动生成。这意味着分配给新记录的 `id` 将由系统自动生成，以避免键冲突。\n\n### 6.4 数据访问对象\
  \ (Data Access Objects)\n\n数据访问对象（DAO）提供了一种访问存储在 SQLite 中的的方法。第一步是创建接口并使用 `@Dao`\
  \ 注解对其声明：\n\n```java\n@Dao\npublic interface CustomerDao {\n}\n```\n\n接下来，添加包含 SQL\
  \ 语句的条目。以下示例允许通过调用 `getAllCustomers()` 获取表中的所有行：\n\n```java\n@Dao\n@Query(\"SELECT\
  \ * FROM customers\")\nLiveData<List<Customer>> getAllCustomers();\n```\n\n注意，`getAllCustomers()`\
  \ 方法返回一个包含每个记录对应的 `Customer` 对象的 `List` 对象。DAO 还使用了 `LiveData`，以便存储库（repository）能够观察数据库的变化。也可以将参数传递给方法并在\
  \ SQL 语句中引用。考虑以下 DAO 声明，它搜索与客户名称（`customerName`）匹配的数据库记录：\n\n```java\n@Query(\"\
  SELECT * FROM customers WHERE name = :customerName\")\nList<Customer> findCustomer(String\
  \ customerName);\n```\n\n在此示例中，方法传递了一个字符串值，该值随后通过在变量名前名前加冒号（`:`）被包含在 SQL 语句中。可以使用\
  \ `@Insert` 方便注解声明一个基础的插入操作：\n\n```java\n@Insert\nvoid addCustomer(Customer customer);\n\
  ```\n\n这之所以被称为方便注解，是因为 Room 持久化库可以推导出传递给 `addCustomer()` 方法的 `Customer` 实体是要插入数据库的，而无需提供\
  \ SQL 语句。也可以在单个事务中插入多条数据库记录，如下：\n\n```java\n@Insert\npublic void insertCustomers(Customer...\
  \ customers);\n```\n\n接下来的 DAO 声明使用 `@Query` 注解删除所有与提供的客户名称匹配的记录。作为使用 `@Query` 注解执行删除的替代方案，也可以使用\
  \ `@Delete` 方便注解。在以下示例中，所有与传递给 `deleteCustomers()` 方法的实体集匹配的 `Customer` 记录将从数据库删除：\n\
  \n```java\n@Delete\npublic void deleteCustomers(Customer... customers);\n```\n\n\
  `@Update` 方便注解在更新记录时提供了类似的行为：\n\n```java\n@Update\npublic void updateCustomers(Customer...\
  \ customers);\n```\n\n此类数据库操作的 DAO 方法也可以声明为返回一个 `int` 值，表示受事务影响的行数，例如：\n\n```java\n\
  @Delete\npublic int deleteCustomers(Customer... customers);\n```\n\n### 6.5 Room\
  \ Database\n\nRoom 数据库类通过扩展 `RoomDatabase` 类创建，它是嵌入在 Android 操作系统的实际 SQLite 数据库之上的层。该类负责创建并返回新的\
  \ Room 数据库实例，并提供与数据库关联的 DAO 实例的访问。\n\nRoom 持久化库提供了一个用于创建数据库的构建器。每个 Android 应用只有一个\
  \ Room 数据库实例，因此最好在类中实现防御性代码以防止创建多个实例。\n\n\n\n\n\n以下代码列表概述了一个用于与示例客户表配合的 Room 数据库实现：\n\
  \n```java\nimport android.content.Context;\n\nimport android.arch.persistence.room.Database;\n\
  \nimport android.arch.persistence.room.Room;\n\nimport android.arch.persistence.room.RoomDatabase;\n\
  \n@Database(entities = {Customer.class}, version = 1)\npublic class CustomerRoomDatabase\
  \ extends RoomDatabase {\n\n    public abstract CustomerDao customerDao();\n\n \
  \   private static CustomerRoomDatabase INSTANCE;\n\n    static CustomerRoomDatabase\
  \ getDatabase(final Context context) {\n        if (INSTANCE == null) {\n      \
  \      synchronized (CustomerRoomDatabase.class) {\n                if (INSTANCE\
  \ == null) {\n                    INSTANCE = Room.databaseBuilder(\n           \
  \                 context.getApplicationContext(),\n                           \
  \ CustomerRoomDatabase.class, \"customer_database\")\n                         \
  \   .build();\n                }\n            }\n        }\n        return INSTANCE;\n\
  \    }\n}\n```\n\n上述示例中需要注意的重要区域包括：类声明上方的注解，它声明了数据库要操作的实体；检查是否已经创建了类实例的代码；以及为实例分配名称\
  \ `customer_database`。\n\n## 66.6 存储库 (Repository)\n\n存储库负责获取 Room 数据库实例，使用该实例访问关联\
  \ DAO，然后调用 DAO 方法来执行数据库操作。一个用于与 Room 数据库配合工作的典型存储库构造函数如下：\n\n```java\npublic class\
  \ CustomerRepository {\n\n    private CustomerDao customerDao;\n\n    private CustomerRoomDatabase\
  \ db;\n\n    public CustomerRepository(Application application) {\n        db =\
  \ CustomerRoomDatabase.getDatabase(application);\n        customerDao = db.customerDao();\n\
  \    }\n}\n```\n\n一旦存储库访问了 DAO，就可以调用数据访问方法。例如，下面的代码调用了 `getAllCustomers()` DAO 方法：\n\
  \n```java\nprivate LiveData<List<Customer>> allCustomers;\nallCustomers = customerDao.getAllCustomers();\n\
  ```\n\n在调用 DAO 方法时，需要注意的是，除非该方法返回 `LiveData` 实例（该实例会自动在单独的线程上运行查询），否则无法在应用的主线程上执行该操作。事实上，尝试这样做会导致应用崩溃并产生如下诊断输出：\n\
  \n`Cannot access database on the main thread since it may potentially lock the UI\
  \ for a long period of time`\n\n由于某些数据库事务可能需要较长时间才能完成，在单独线程上运行操作可以避免应用出现假死。正如标题为\
  \ \"Android Room 数据库和存储库教程\" 的章节将演示的，这个问题可以通过使用 `AsyncTask` 类轻松解决（更多信息或关于如何使用 `AsyncTask`\
  \ 的提醒，请参阅标题为 \"线程和 AsyncTask 概述\" 的章节）。\n\n## 66.7 内存数据库\n\n本章概述的示例使用了以数据库文件形式存在\
  \ Android 设备持久化存储上的 SQLite 数据库。这确保了即使在应用进程终止后数据仍然存在。\n\nRoom 数据库持久化库也支持内存数据库。这些数据库完全位于内存中，并在应用终止时丢失。要使用内存数据库，唯一的更改是调用\
  \ `Room Database` 类的 `Room.inMemoryDatabaseBuilder()` 方法，而不是 `Room.databaseBuilder()`。下面的代码显示了方法调用之间的区别（注意内存数据库不需要数据库名称）：\n\
  \n```java\n// 创建一个基于文件存储的数据库\nINSTANCE = Room.databaseBuilder(context.getApplicationContext(),\n\
  \        CustomerRoomDatabase.class, \"customer_database\")\n        .build();\n\
  \n// 创建一个内存数据库\nINSTANCE = Room.inMemoryDatabaseBuilder(context.getApplicationContext(),\n\
  \        CustomerRoomDatabase.class)\n        .build();\n```\n\n## 66.8 数据库检查器 (Database\
  \ Inspector)\n\nAndroid Studio 包含一个数据库检查器工具，允许对与应用相关的数据库进行查看、搜索和修改，如图 66-3 所示：\n\
  \n![](img/4.1)\n\n图 66-3\n\n## 66.9 总结\n\nAndroid 持久化库与架构组件一起打包，作为底层 SQLite 之上的抽象层。该库的设计是为了更容易地操作数据库。本章介绍了构建数据库的不同元素，包括实体、存储库、数据访问对象和注解。\n\
  \n在涵盖了 SQLite 基础和 Room 组件之后，下一步是创建一个将理论付诸实践的应用程序。由于示例的用户界面需要表单布局，标题为 \"TableLayout\
  \ 和 TableRow 教程\" 的章节将稍微偏离主题，介绍表格布局的基础。\n\n## 67. TableLayout 和 TableRow 教程\n\n\
  当本书的下一章节（\"Android Room 数据库和存储库教程\"）开始编写时，最初计划包含设计用户界面的步骤。然而，很快发现实现用户界面的最佳方法是使用\
  \ `TableLayout` 和 `TableRow` 视图，该主题应该有一个独立的章节。因此，本章将专门专注于下一章节中完成的用户界面设计，并在此花时间介绍表格布局的基础。\n\
  \n### 67.1 TableLayout 和 TableRow 布局\n\n`TableLayout` 容器视图的作用允许用户界面元素以行和列的格式组织在屏幕上。`TableLayout`\
  \ 中的每行由一个 `TableRow` 实例占据，`TableRow` 又被分为单元格，每个单元格包含一个子视图（该子视图本身可以是包含多个子视图的容器）。\n\
  \n表格的列数由列最多的行决定，默认每列宽度由该列中最宽的单元格定义。列可以配置为可收缩或可扩展（或两者都是），以便相对于父 `TableLayout` 变化。此外，单个单元格可以配置为跨越多个列。\n\
  \n考虑图 67-1 所示的用户界面布局：\n\n![](img/4.1_room_demo_ui.jpg)\n\n图 67-1\n\n从布局的视觉外观，很难识别设计界面时使用的\
  \ `TableLayout` 结构。然而，图 67-2 所示的层级树使得结构变得更容易理解：\n\n![](img/3.2_tablelayout_tree.jpg)\n\
  \n图 67-2\n\n\n\n\n\n显然，该布局包含一个父级 `LinearLayout` 视图，其带有 `TableLayout`、`LinearLayout`\
  \ 和 `RecyclerView` 子视图。`TableLayout` 包含三个 `TableRow` 子视图，代表表格中的三行。每个 `TableRow`\
  \ 包含两个子视图，每个子视图代表表格列单元格的内容。`LinearLayout` 子视图包含三个 `Button` 子视图。\n\n图 67-2 所示的布局是下章节中将完成的数据库示例所恰切需要的布局。因此，本章的剩余部分将用于使用\
  \ Android Studio 布局编辑器（Layout Editor）工具逐步完成该用户界面的设计。\n\n## 67.2 创建 Room 数据库项目\n\n\
  从欢迎屏幕界面中选择 `Create New Project`（创建新项目）快速启动选项，在弹出的新项目对话框中，在点击 `Next`（下一步）按钮之前，选择\
  \ `Fragment + ViewModel` 模板。\n\n在 `Name`（名称）字段中输入 `RoomDemo`，并指定包名（package name）为\
  \ `com.ebookfrenzy.roomdemo`。在点击 `Finish`（完成）按钮之前，将 `Minimum API level`（最低 API ）设置改为\
  \ `API 26: Android 8.0 (Oreo)`，并将 `Language`（语言）菜单更改为 `Java`。\n\n## 67.3 转换为 LinearLayout\n\
  \n在 Project（项目）工具窗口（`app -> res -> layout`）中找到 `main_fragment.xml` 文件，并双击它将其加载到布局编辑器工具中。默认情况下，Android\
  \ Studio 使用 `ConstraintLayout` 作为用户界面的根布局元素。这需要被转换为垂直方向的 `LinearLayout`。在 Design（设计）模式下使用布局编辑器工具，在\
  \ Component Tree（组件树）中找到主 `ConstraintLayout` 组件，并右键点击它以显示 图 67-3 所示的菜单，然后选择 `Convert\
  \ View...`（转换视图...）选项：\n\n![](img/as_4.1_room_demo_convert_view.jpg)\n\n图 67-3\n\
