  \ `TableRow` 实例。可以随时通过从调色板拖入 `TableRow` 对象并将其置于 Component Tree 工具窗口中的 `TableLayout`\
  \ 项上来向 `TableLayout` 添加更多行。\n\n选中 `TableLayout` 后，使用 Attributes 工具窗口将 `layout_height`\
  \ 属性更改为 `wrap_content`并将 `layout_width` 更改为 `match_parent`。\n\n## 67.5 配置 TableRows\n\
  \n在调色板的 `Text` 区域中，将两个 `TextView` 对象拖放到 Component Tree 中顶部的 `TableRow` 项上（图 67-7）：\n\
