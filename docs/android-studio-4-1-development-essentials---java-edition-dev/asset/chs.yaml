  \ `Infer constraints` 按钮添加任何缺失的约束。将视图的 `id` 更改为 `textView1`，文本改为“Fragment Two”，并修改\
  \ `textAppearance` 属性为 `Large`。\n\n完成后，布局应与下方图 31-4 所示：\n\n![](img/as_4.0_fragment_layout.jpg)\n\
  \n图 31-4\n\n## 31.5 将 Fragments 添加到 Activity\n\n主 activity 有关联名为 `activity_main.xml`\
  \ 的 XML 布局文件。在本例中，将使用该文件中的 `<fragment>`元素将 fragment 添加到 activity 中。使用项目工具窗口，导航到\
  \ `FragmentExample` 项目的 `app -> res -> layout` 部分，双击 `activity_main.xml` 文件将其加载到\
  \ Android Studio 布局编辑器。\n\n使布局编辑器处于 `Design` 模式，选择并删除布局中默认的 `TextView` 对象，并在调色板中选择\
  \ `Common` 类别。从视图列表中拖动 `<fragment>` 组件丢到布局上，使其水平居中并位于虚线出现在顶部布局边缘的位置：\n\n![](img/as_3.5_fragment_example_add_fragment.jpg)\n\
  \n图 31-5\n\n将 fragment 丢到布局上后，将出现对话框，显示当前项目中可 Fragments 列表，如图 31-6 所示：\n\n![](img/as_4.1_fragment_list.jpg)\n\
  \n图 31-6\n\n\n\n\n从列表中选择 `ToolbarFragment` 条目并点击 `OK` 按钮关闭 `Fragments` 对话框。添加后，点击布局编辑器右上角的红色警告按钮以显示警告面板。将列出一条“未知\
  \ fragment”（unknown fragments）的消息（图 31-7），这表明布局编辑器工具在预览期间需要知道显示哪一个 fragment。点击消息中的\
