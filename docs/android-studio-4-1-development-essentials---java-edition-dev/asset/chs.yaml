  \ 所示布局中的所有控件，并在 Attributes 工具窗口将 `textSize` 属性设置为 `18sp`：\n\n![](img/as_4.1_room_demo_views_selected.jpg)\n\
  \n67-9\n\n在继续之前，确保将上述所有 `text` 属性提取到字符串资源。\n\n## 67.6 为布局添加按钮栏\n\n下一步是在父级 `LinearLayout`\
  \ 视图中添加 `LinearLayout (horizontal)`。首先，点击 Component Tree 中 `TableLayout` 项左侧的展开箭头，将\
