  \ `ID` 值为 `productID`。\n\n向 Component Tree 中的第二个 `TableRow` 项拖放另一个 `TextView` 挂件，并将视图上的文本更改为“Product\
  \ Name”。在调色板中找到 `Plain Text`（纯文本）对象并将其拖放，使其在 Component Tree 中如 图 67-8 所示，位于 Product\
  \ Name `TextView` 下方。选中 `EditText` 对象后，将 `inputType` 属性从 `textPersonName` 更改为 `none`，从\
  \ `text` 属性中删除“Name”字符串并将 `ID` 设置为 `productName`。\n\n![](img/as_3.6_tablelayout_produnt_name_row.jpg)\n\
  \n图 67-8\n\n将另一个 `TextView` 和一个 `Number (Decimal) Text Field`（数字（小数）文本字段）拖放到第三个\
