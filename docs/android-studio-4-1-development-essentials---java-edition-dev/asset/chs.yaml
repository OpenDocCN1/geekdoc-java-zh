  ## 52.9 添加清单权限\n\n最后一步是通过清单文件为应用程序添加互联网权限。这将允许 `WebView` 对象访问互联网并下载网页。在 Project\
  \ 工具窗口中（app -> manifests）导航到并加载 `AndroidManifest.xml` 文件，双击它将其加载到编辑器中。加载完成后，向文件中添加适当的权限行：\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    package=\"com.ebookfrenzy.masterdetailflow\"\
  \ >\n    <uses-permission android:name=\"android.permission.INTERNET\" />\n    <application\n\
  \        android:allowBackup=\"true\"\n        android:icon=\"@mipmap/ic_launcher\"\
  \n        android:label=\"@string/app_name\"\n        android:theme=\"@style/AppTheme\"\
  \ >\n```\n\n## 52.10 运行应用程序\n\n在配置适当的模拟器或连接的 Android 设备上编译并运行应用程序。根据显示屏的大小，应用程序将以小屏或双窗格模式显示。无论如何，主列表都应该预先加载内容模型中定义的三个网站的名称。选择一个项目将导致相应的网站出现在详情窗格中，如双窗格模式下的图\
  \ 52-5 所示：\n\n![](img/Image24682.jpg)\n\n图 52-5\n\n## 52.11 总结\n\n主/详情用户界面由一个主列表组成，当选择某一项时，会在详情窗格中显示关于该选择的额外信息。主/详情流（Master/Detail\
  \ Flow）是 Android Studio 提供的一个模板，允许快速且轻松地创建主/详情布局。如本章所示，通过对默认模板文件进行细微修改，就可以用极少的代码和设计实现广泛基于主/详情的功能。\n\
  \n## 53. Android Intent 概述\n\n到本书的这一阶段，应该已经清楚 Android 应用程序是由一个或多个活动（activity）组成的。然而，一个尚未详细介绍的领域是一个活动触发另一个活动启动的机制。正如标题为\
  \ Android 应用程序剖析的章节简述的那样，这主要通过使用 Intent 实现。\n\n在后续章节中通过基于 Android Studio 的某些 Intent\
  \ 示例实现之前，本章的目标是以显式意（explicit intents）和隐式意（implicit intents）的形式提供 Intent 的概述，并介绍意过滤器（intent\
  \ filters）。\n\n## 53.1 Intent 概述\n\nIntent（`android.content.Intent`）是一个活动能够启动另一个活动的消息系统。例如，活动可以发出一个\
  \ Intent 来请求启动同一应用程序中的另一个活动。然而，Intent 的概念超出了此范围，它允许活动请求设备上任何其他配置了权限的适当注册的活动的服务。例如，考虑应用程序中的一个活动，它需要加载并向用户显示一个网页。应用程序不需要包含第二个活动来执行此任务，代码仅需向\
  \ Android 运行时发送 Intent，请求任何注册了显示网页能力的活动的服务。运行时系统会将请求与设备上的可用活动进行匹配，并启动匹配的活动，或者在有多个匹配的情况下允许用户决定使用哪一个活动。\n\
  \nIntent 还允许将数据从发送活动传输到接收活动。在之前描述的场景中，例如，发送活动需要将要显示的网页 URL 发送给第二个活动。同样，接收活动也可以配置为在完成所需任务后向发送活动返回数据。\n\
  \n虽然在后面的章节才会介绍，但值得注意的是，除了启动活动外，Intent 还用于与服务（services）和广播接收器（broadcast receivers）通信。Intent\
  \ 分为显式或隐式式。\n\n## 53.2 显式意\n\n显式意通过引用组件名称（实际上是类名）请求启动特定的活动。这种方法对于启动位于同一应用程序中的活动最为常见（因为类名对开发者是知的）。\n\
  \n显式意是通过创建 Intent 类实例并传递活动上下文和要启动活动的名称来实现的。调用 `startActivity()` 方法并将 Intent 对象作为参数。例如，以下代码片段发出启动类名为\
  \ `ActivityB` 活动的意：\n\n```java\nIntent i = new Intent(this, ActivityB.class);\n\
  startActivity(i);\n```\n\n在启动 之前，可以通过调用 Intent 对象的 `putExtra()` 方法将数据传输到接收活动。数据必须以键值对的形式添加。以下代码扩展了之前的示例，分别向\
  \ Intent 添加了键名为 `myString` 和 `myInt` 的字符串和整数值：\n\n```java\nIntent i = new Intent(this,\
  \ ActivityB.class);\ni.putExtra(\"myString\", \"This is a message for ActivityB\"\
  );\ni.putExtra(\"myInt\", 100);\nstartActivity(i);\n```\n\n目标活动作为 Bundle 对象的一部分接收数据，可以通过调用\
  \ `getIntent().getExtras()` 获取数据。Activity 类的 `getIntent()` 方法返回启动活动的意，而 Intent 类的\
  \ `getExtras()` 方法返回一个包含数据的 Bundle 对象。例如，提取传递给 `ActivityB` 的数据值：\n\n```java\nBundle\
  \ extras = getIntent().getExtras();\nif (extras != null) {\n    String myString\
  \ = extras.getString(\"myString\");\n    int myInt = extras.getInt(\"myInt\");\n\
  }\n```\n\n在使用 Intent 启动同一应用程序内的其他活动时，确保这些活动在应用程序清单文件中列出是重要的。以下 `AndroidManifest.xml`\
  \ 内容正确适用于包含名为 `ActivityA` 和 `ActivityB` 活动的应用程序：\n\n```xml\n<?xml version=\"1.0\"\
  \ encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy.intent1.intent1\" >\n    <application\n```\n\n\n\
  \n\n\n```xml\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  >\n    <application\n        android:icon=\"@mipmap/ic_launcher\"\n        android:label=\"\
  @string/app_name\">\n        <activity\n            android:label=\"@string/app_name\"\
  \n            android:name=\"com.ebookfrenzy.intent1.intent1.ActivityA\">\n    \
  \        <intent-filter>\n                <action android:name=\"android.intent.action.MAIN\"\
  \ />\n                <category android:name=\"android.intent.category.LAUNCHER\"\
  \ />\n            </intent-filter>\n        </activity>\n        <activity\n   \
  \         android:name=\"ActivityB\"\n            android:label=\"ActivityB\">\n\
  \        </activity>\n    </application>\n</manifest>\n```\n\n## 53.3 从 Activity\
  \ 返回数据\n\n如上一节的示例所示，虽然数据被传输到了 `ActivityB`，但没有办法将数据返回给第一个活动（我们称之为 `ActivityA`）。然而，这可以通过\
  \ `ActivityB` 启动为 `ActivityA` 的子活动来实现。如果通过调用 `startActivityForResult()` 方法而不是使用\
  \ `startActivity()` 来启动 intent，则活动将作为子活动启动。除了 intent 对象外，该方法还会传递一个请求代码值，该值可用于在活动返回时识别返回的数据。例如：\n\
  \n```java\nstartActivityForResult(i, REQUEST_CODE);\n```\n\n为了向父活动返回数据，子活动必须实现 `finish()`\
  \ 方法，该方法的目的是创建一个包含要返回数据的新 intent 对象，然后调用封装的的 `setResult()` 方法，并传递一个结果代码和一个包含返回数据的\
  \ intent。结果代码通常为 `RESULT_OK` 或 `RESULT_CANCELED`，但也可以根据开发者的需求自定义值。如果子活动崩溃，父活动将接收\
  \ `RESULT_CANCELED` 结果代码。\n\n例如，以下代码说明了典型的子活动 `finish()` 方法的实现：\n\n```java\npublic\
  \ void finish() {\n    Intent data = new Intent();\n    data.putExtra(\"returnString1\"\
  , \"Message to parent activity\");\n    setResult(RESULT_OK, data);\n    super.finish();\n\
  }\n```\n\n为了获取并提取返回的数据，父活动必须实现 `onActivityResult()` 方法，例如：\n\n```java\nprotected\
  \ void onActivityResult(int requestCode, int resultCode, Intent data) {\n    String\
  \ returnString;\n    if (requestCode == REQUEST_CODE && resultCode == RESULT_OK)\
  \ {\n        if (data.hasExtra(\"returnString1\")) {\n            returnString =\
  \ data.getExtras().getString(\"returnString1\");\n        }\n    }\n}\n```\n\n注意，上述方法检查了返回的请求代码值，以确保它与通过\
  \ `startActivityForResult()` 方法传递的值匹配。启动多个子活动时，使用请求代码来跟踪哪个活动正在返回结果尤为重要，因为所有活动在退出时都会调用同一个\
  \ `onActivityResult()` 方法。\n\n## 53.4 隐式意图\n\n与显式意图（引用要启动活动的类名）不同，隐式意图通过指定要执行的操作和接收活动要处理的数据类型来标识要启动的活动。例如，`ACTION_VIEW`\
  \ 动作类型配以 `URI` 对象形式的网页 URL，将指示 Android 系统搜索并随后启动能够处理该内容的网页浏览器活动。以下隐式意图在 Android\
  \ 设备上执行时，将导致指定的网页在网页浏览器活动中显示：\n\n```java\nIntent intent = new Intent(Intent.ACTION_VIEW,\
  \ Uri.parse(\"https://www.ebookfrenzy.com\"));\nstartActivity(intent);\n```\n\n\
  当由活动发出上述隐式意图时，Android 系统将搜索设备上注册了处理该意图能力的活动。如果找到一个匹配项，将启动该活动。如果找到多个匹配项，将提示用户进行选择。\n\
  \n## 53.5 意图过滤器\n\n意图过滤器是活动向 Android 意图“宣告”其支持的操作和数据能力的机制。继续上一节的示例，能够显示页面的活动会在其\
  \ manifest 中包含一个意图过滤器，表示对 `http` 的支持。需要注意的是，发送活动和接收活动都必须针对该类型请求权限。这通过在 manifest\
  \ 中添加 `uses-permission` 标签来实现。例如，以下 manifest 请求了访问权限：\n\n```xml\n<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    package=\"com.ebookfrenzy\"\n    android:versionCode=\"1\">\n    <uses-permission\
  \ android:name=\"android.permission.INTERNET\" />\n    <application\n        android:icon=\"\
  @mipmap/ic_launcher\"\n        android:label=\"@string/app_name\">\n        <activity\n\
  \            android:label=\"@string/app_name\"\n            android:name=\".MainActivity\"\
  >\n            <intent-filter>\n                <action android:name=\"android.intent.action.VIEW\"\
  \ />\n                <category android:name=\"android.intent.category.DEFAULT\"\
  \ />\n                <data android:scheme=\"http\" />\n            </intent-filter>\n\
  \        </activity>\n    </application>\n</manifest>\n```\n\n## 53.6 检查意图可用性\n\n\
  假设某个活动对特定意图可用是不明智的，因为缺少匹配项通常会导致应用程序崩溃。幸运的是，可以在发送到运行时系统之前识别活动的可用性。以下方法可以用于识别指定意图动作的活动可用性：\n\
  \n```java\npublic static boolean isIntentAvailable(Context context, String action)\
  \ {\n    final PackageManager packageManager = context.getPackageManager();\n  \
  \  final Intent intent = new Intent(action);\n    List<ResolveInfo> list = packageManager.queryIntentActivities(intent,\
  \ PackageManager.MATCH_DEFAULT_ONLY);\n    return list.size() > 0;\n}\n```\n\n##\
  \ 53.7 总结\n\n意图是一个 Android 活动启动另一个活动的消息传递机制。显式意图通过引用接收活动的类名来引用要启动的特定活动。显式意图通常（但不限于）用于启动包含在相同应用程序中的活动。隐式意图指定要执行的操作和处理的数据类型，并让\
  \ Android 运行时找到匹配的活动进行启动。隐式意图通常用于启动位于不同应用程序的活动。\n\n活动可以通过键值对的形式将数据封装到 intent 对象中向接收活动发送数据。只有当活动作为发送活动的子活动启动时，才能从该活动返回数据。\n\
  \n\n\n\nActivity 通过在应用程序文件中指定意图过滤器（intent-filters），向 Android 意图解析过程宣告其功能。发送和接收 Activity\
  \ 都必须请求适当的权限以执行如访问设备联系人数据库或互联网等任务。\n\n在介绍了意图（intent）的理论之后，接下来的几章将在 Android Studio\
  \ 中创建一些示例，演示显式和隐式意图的操作。\n\n# 54 Android 显式意图——实例演示\n\n标题为 \"Android 意图概述\" 的章节涵盖了使用意图启动\
  \ Activity 的理论。本章将通过创建一个示例应用程序将该理论付诸实践。\n\n在本章中创建 Android Studio 项目将演示使用显式意图启动 Activity，包括在发送和接收\
  \ Activity 之间传输数据。下一章 (Android 隐式意图——实例演示) 将演示隐式意图的使用。\n\n## 54.1 创建显式意图应用程序\n\n\
