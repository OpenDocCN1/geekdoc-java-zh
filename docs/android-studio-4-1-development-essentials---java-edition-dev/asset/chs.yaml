  ```\n\n## 47.7 创建 Pager Adapter\n\n此示例将使用 `ViewPager` 方法来处理分配给 `TabLayout` 的片段。将\
  \ `ViewPager` 添加到布局文件后，需要向项目添加一个子类自 `FragmentPagerAdapter` 的新类，用于管理用户选择标签项时显示的片段。\n\
