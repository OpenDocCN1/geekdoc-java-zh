    \ = document.getElementsByTagName(\"div\");\nfor (let dEl of divElems) {\n  console.log(dEl.id);\n\
    }\n```\n\n### 2.1.4 Template Literals\n\nare enclosed by backtick characters (like\
    \ ` ` ) instead of double or single quotes and allow a concise syntax for (possibly\
