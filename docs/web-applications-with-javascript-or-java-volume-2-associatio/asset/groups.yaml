    Since classical OO programming languages do not support associations as first
    class citizens, but only classes and reference properties representing unidirectional
    associations, we have to eliminate all explicit associations from general information
    design models for obtaining OO class.


    ### 1.7.1 The Basic Elimination Procedure


    The starting point of our restricted association elimination procedure is an information
    design model with various kinds of unidirectional associations, such as the model
    shown in Figure 1.6 above. If the model still contains any non-directional associations,
    we first have to turn them into directional ones. A unidirectional association
    connecting a source with a target class is replaced with a corresponding reference
    property having


    - 1. the same name as the target class, if there is any,

    - 2. the target class (possibly pluralized), if the reference property is multivalent;

    - 3. the same multiplicity as the target end,

    - 4. a uniqueness constraint if the unidirectional association is functional.


    This replacement procedure is illustrated for the case of a one-to-one association
    in Figure 1.8, where the non-functional association end at the target class is
    expressed by the {key} property modifier.


    | Committee | ClubMember |

    | name : String | 0..1 |


    | Committee | ClubMember |

    | name : String | chairedCommittee] |


    **Figure 1.8:** Turning a functional association into a reference property.


    For the case of a unidirectional one-to-many association, Figure 1.9 provides
    an illustration of the elimination procedure. Here, the non-functional association
    end at the target class is turned into the pluralized form of the target class.


    | Polygon | Point |

    | 3.* | Integer |


    **Figure 1.9:** Turning a non-functional association end into a multi-valued reference
    property.


    ### 1.7.2 Eliminating Associations from the Design Model


    In the case of our running example, the Publisher-Book information design model,
