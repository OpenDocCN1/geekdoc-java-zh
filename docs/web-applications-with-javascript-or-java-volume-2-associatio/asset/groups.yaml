    When specializing an object type, we define additional features for the newly
    added subtype. In many cases, these additional features are more specific properties.
    For instance, in the case of TextBook specializing Book, we define the additional
    attribute subjectArea. In some programming languages, such as in Java, it is said
    that the subtype extends the supertype.


    However, we can also specialize an object type without defining additional properties
    or operations/methods, but by defining additional constraints.


