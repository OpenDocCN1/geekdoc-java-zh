    ```\n\n# 9.2.7 Entity Managers and Cached Entities\n\nUnfortunately, JPA does\
    \ not provide automatic maintenance of inverse references. According to the Java\
    \ Persistence Wiki, we have to implement the (direct and inverse) relations management\
    \ with set/add/remove methods:\n\n> A common problem with bidirectional relationships\
    \ is the application updates one side of the relationship, while the other side\
    \ does not get updated, and becomes out of sync. In JPA, as in general, it is\
    \ the responsibility of the application or the object model to maintain relationships.\
    \ If your application adds to one side of the relationship, then it must add to\
    \ the other side. This is commonly resolved through add or set methods in the\
    \ object model that handles both sides of the relationships, so the application\
    \ code does not need to worry about it. There are two ways to go about this: you\
    \ can either add the relationship maintenance code to only one side use the setter\
    \ from that side (such as making the other side protected), or add to both sides\
    \ and ensure you avoid an infinite loop.\n\nWe have used an entity manager for\
    \ each controller class. Every entity manager maintains a set of cached entities\
    \ which can be “shared” with other entity managers by using the merge method.\
    \ In our example, as part of the create and update methods of each model class,\
    \ we have to merge the updated entities that belong to another entity manager.\
    \ For example, in the Book.create method, we need to merge the new book's publisher,\
    \ managed by the PublisherController's entity manager, all its authors, managed\
    \ by the AuthorController's entity manager:\n\n```java\npublic class Book {\n\
    \    public static void create(EntityManager em,\n        UserTransaction ut,\n\
    \        String isbn, String title, Integer year,\n        Publisher publisher,\
    \ Set<Author> authors)\n        throws Exception {\n        ut.begin();\n    \
    \    Book book = new Book(isbn, title, year,\n            publisher, authors);\n\
    \        em.persist(book);\n        if (publisher != null) {\n            em.merge(publisher);\n\
    \        }\n        for (Author a : authors) {\n            em.merge(a);\n   \
    \     }\n        ut.commit();\n    }\n}\n```\n\nWithout using merge, the publisher\
    \ as well as all author instances from the authors list, do not represent references\
    \ to the originally cached entities, and are not to retain our changes. For more\
    \ details, please check the Java Persistence documentation related to this.\n\n\
    It is also possible to disable the JPA caching, so the entities are reloaded from\
    \ the database for every new instance, e.g., when EntityManager.find method is\
    \ called. This can be achieved by adding the following line in the persistence.xml\
    \ file:\n\n`<property name=\"eclisink.cache.shared.default\" value=\"false\"/>`\n\
    \nThe above configuration works for eclisink implementation and it may be different\
    \ for other API implementations. Notice that disabling entity caching is not recommended\
    \ without a serious reason, since it degrades the app's performance and may produce\
    \ unexpected behavior in some cases, such as when using @SessionScoped managed\
    \ entities.\n\n# 9.3 Exploiting Derived Inverse Reference Properties in the User\
    \ Interface\n\nWe can now exploit the derived inverse reference properties Publisher::publishedBooks\
    \ and Author::authoredBooks for more efficiently creating a list of associated\
    \ books in the retrieve/list all publishers and retrieve/list all authors use\
    \ case.\n\n## 9.3.1 Show Information About Published Books in Retrieve/List All\n\
    \nFor showing information about published books in retrieve/list all publishers,\
    \ we can now exploit the derived inverse reference:\n\n```xml\n<h:composition\
    \ template=\"/WEB-INF/templates/page.xhtml\">\n<h:define name=\"content\">\n<h:dataTable\
    \ value=\"#{publisherController.publishers}\" var=\"p\">\n<h:column>\n  <f:facet\
    \ name=\"header\">Published books</f:facet>\n  <h:outputText value=\"#{p.publishedBooks}\"\
    \ escape=\"false\"\n    converter=\"m.converter.ListConverter\"/>\n</h:column>\n\
    </h:dataTable>\n<h:button value=\"Back\" outcome=\"index\" />\n</h:define>\n</h:composition>\n\
    ```\n\nIn the case of unidirectional associations, we have used a method in the\
    \ Book class, getAuthorNames(), which returns a comma-separated string:\n\n```java\n\
    public class Book {\n  ..\n  public String getAuthorNames() {\n    String result\
    \ = \"\";\n    int i = 0, n = 0;\n    if (authors == null) {\n      return null;\n\
    \    } else if (authors instanceof Set<?>) {\n      n = ((Set<Author>)authors).size();\n\
    \      for (Author author : (Set<Author>)authors) {\n        result += author.getName();\n\
    \        if (i<n-1) {\n            result += \"<br/>\";\n        }\n        i++;\n\
    \      }\n    }\n    return result;\n  }\n}\n```\n\nThen, we use the converter\
    \ attribute in the facet to specify that our converter class, e.g., m.converter.ListConverter,\
    \ has to be used when the respective view component needs to be rendered:\n\n\
    ```java\n@FacesConverter(value=\"m.converter.ListConverter\")\npublic class ListConverter\
    \ implements Converter {\n    @Override\n    public Object getObject(FacesContext\
    \ context, UIComponent component, String value) {\n        return null; // this\
