    , personId);\nList<Book> books = query.getResultList();\n// Remove the author\
    \ reference from the books' authors list\nfor (Book b : books) {\n  b.getAuthors().remove(author);\n\
    }\n\n// Delete the author record (table row)\nem.remove(author);\nut.commit();\n\
    ```\n\nEssentially, the delete operation consists of three steps:\n\n+   1. Create\
    \ a JPQL query which selects all books of this author (since this is a unidirectional\
