    \ Tables\n\nTable 1.1 Functionality types — 8\n\n# Part I: Associations\n\nThe\
    \ three example apps that we have discussed in Volume 1, the minimal app, the\
    \ validation app, and the enumeration app, have been limited to managing the data\
    \ of one object type only. A real app, however, has to manage the data of several\
    \ object types, which are typically related to each other in various ways. In\
    \ particular, there may be associations and subtype (inheritance) relationships\
    \ between object types. Handling associations and subtype relationships are advanced\
    \ issues in software application engineering. They are often not sufficiently\
    \ discussed in text books and not well supported by application development frameworks.\n\
    \nAssociations are important elements of information models. Software applications\
    \ have to implement them in a proper way, especially in their model layer within\
    \ a model-view-controller (MVC) architecture. Unfortunately, application development\
    \ frameworks do not provide much support for dealing with associations.\n\n- There\
    \ are two important distinctions, which are independent of:\n  1. Functional versus\
    \ many-to-many.\n  2. Unidirectional versus bidirectional.\n\nIn mathematics,\
    \ associations have been formalized as sets of tuples. In Entity-Relationship\
    \ (ER) modeling, which is the classical information modeling approach in information\
    \ systems, objects are called entities, and associations are relationship types.\
    \ The Unified Modeling Language (UML) includes the UML Class Diagram for information\
    \ modeling. In UML, object types are called classes, relationship types are called\
    \ associations, and individual relationships are called links. These terminologies\
    \ are summarized in the following table:\n\n| Our preferred term(s) | UML | ER\
    \ Diagrams | Mathematics |\n|---|---|---|---|\n| object | object | entity | individual\
    \ |\n| object type (class) | class | entity type | relation |\n| relationship\
    \ | link | relationship | tuple |\n| association (relationship type) | association\
    \ | relationship type | relation |\n\nWe first discuss reference properties, which\
    \ implicitly represent binary associations in an “association-free” class model\
    \ (a model without any explicit association element).\n\n# 1.1 References and\
    \ Reference Properties\n\nA reference can be either human-readable or an internal\
    \ object reference. Human-readable references refer to identifiers that are used\
    \ in human communication, such as the unique names of astronomical bodies, the\
    \ ISBN of books and the employee numbers of the employees of a company. Internal\
    \ object references refer to the computer memory addresses of OOP objects, providing\
    \ an efficient mechanism for accessing objects in the main memory of a computer.\n\
    \nSome languages, like SQL and XML, only support human-readable but not internal\
    \ references. In SQL, human-readable references are called *foreign keys*, and\
    \ the identifiers they refer to are called *primary keys*. In XML, human-readable\
    \ references are called *ID references* and the corresponding attribute type is\
    \ IDREF.\n\nObjects in an OO program can be referenced either with the help of\
    \ human-readable references (such as integer codes) or with internal object references,\
    \ which are preferable for accessing objects efficiently in main memory.\n"
