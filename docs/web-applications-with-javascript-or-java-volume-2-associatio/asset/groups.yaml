    \ |\n| Novosibirsk |\n| Paris |\n\nMore data about countries can be found in the\
    \ CIA World Factbook.\n\n## 7 Bidirectional Associations\n\nIn OO modeling and\
    \ programming, a bidirectional association is an association that is represented\
    \ as a pair of mutually inverse reference properties, which allow 'navigation'\
    \ (object access) in both directions.\n\nThe model shown in Figure 7.1 below (about\
    \ publishers, books and their authors) serves as our running example. Notice that\
    \ it contains two bidirectional associations, as indicated by the ownership dots\
    \ at both association ends.\n\n| Publisher | published Books | Book | authored\
    \ Books | Author |\n| --- | --- | --- | --- | --- |\n| name : String (id) | |\
    \ isbn : String (id) | * | personid : Integer (id) |\n| address : String | 0.1\
    \ | * | year : Integer | * | name : String |\n\nFigure 7.1: The Publisher-Book-Author\
    \ information model with two bidirectional associations.\n\n### 7.1 Inverse Reference\
    \ Properties\n\nFor being able to easily retrieve the committees that are chaired\
    \ or co-chaired by a club member, we add two reference properties to our Committee-ClubMember\
    \ example: the property of a club member to be the chair of a committee (ClubMember::Committee)\
    \ and the property of a club member to be the chair-of-a-committee (ClubMember::coChairedCommittee)\
    \ may chair or co-chair at most one committee (where the disjunction is non-exclusive).\
    \ We get the following model:\n\n| Committee | ClubMember |\n| --- | --- |\n|\
    \ name : String | chairedCommittee[..] : Committee |\n| chair : ClubMember | coChairedCommittee[..]\
    \ : Committee |\n\nNotice that there is a correspondence between the two reference\
    \ properties Committee::chair and ClubMember::coChaired. They are the inverse\
    \ of each other: when the club member Tom is the chair of the budget committee,\
    \ expressed by the tuple (\"budget committee\", \"Tom\"), then the budget committee\
    \ is chaired by the club member Tom, expressed by the inverse tuple (\"Tom\",\
    \ \"budget committee\"). For expressing this inverse correspondence in the diagram,\
    \ we append an inverse property constraint, inverse of chair, in curly braces\n\
    \nto the declaration of the property ClubMember::chairedCommittee, and a similar\
    \ one to the property Committee::chair, as shown in the following diagram:\n\n\
    | Committee | ClubMember |\n|--- |--- |\n| name : String | chairedCommittee[0..1]\
    \ : Committee (inverse of chair) |\n| chair : ClubMember (inverse of chairedCommittee)\
    \ | coChairedCommittee[0..1] : Committee |\n\nUsing the reference path notation\
    \ of OOP languages, with c referencing a Committee object, we obtain the equation:\n\
    \nc.chair.chairedCommittee = c\n\nOr, the other way, with m referencing a ClubMember\
    \ object, we obtain the equation:\n\nm.chairedCommittee.chair = m\n\nNotice when\
    \ the property $p_2$ is the inverse of a property $p_1$, this implies, that the\
    \ other way, $p_1$ is the inverse of $p_2$. Therefore, we declare the property\
    \ ClubMember::chairedCommittee to be the inverse of Committee::chair, then, implicitly,\
    \ Committee::chair is the inverse of ClubMember::chairedCommittee. We therefore\
    \ call Committee::chair and ClubMember::chairedCommittee a pair of **mutually\
    \ inverse reference properties**. Having such a pair in a model implies *redundancy*\
    \ because each of the two reference properties can be derived from the other by\
    \ inversion. This type of redundancy implies *data storage overhead* and *update-overhead*,\
    \ which is the price to pay for the bidirectional navigability that supports efficient\
    \ object access in both directions.\n\nFor maintaining the duplicate information\
    \ of a mutually inverse reference pair, it is common to treat one of the inverse\
    \ properties as the *master*, and the other as the *slave*, and take this distinction\
    \ into consideration in the methods (such as the setters) of the affected classes.\
    \ We indicate the slave of an inverse property in a model using a slash (/) as\
    \ a prefix of the name as shown in the diagram:\n\n| Committee | ClubMember |\n\
    | --- | --- |\n| name : String | chairedCommittee[0..1] : Committee |\n| chair\
    \ : ClubMember | coChairedCommittee[0..1] : Committee |\n\nThe property chairedCommittee\
    \ in ClubMember is now *derived* (as indicated by its prefix). Its annotation\
    \ {inverse of chair} defines a *derivation rule* according to which it is derived\
    \ by inverting the property Committee::chair.\n\n### 7.1 Inverse Reference Properties\n\
    \nIn a UML class diagram, the derivation of a property can be specified by an\
    \ OCL derive that evaluates the value of the derived property for a given object.\
    \ In the case of a property being the inverse of another, specified by the constraint\
    \ expression (inverse of anotherProperty) appended to the property declaration,\
    \ the derivation expression is implied. In our example, for any club member m,\
    \ it evaluates the committee object such that c.chair = m. In OCL, this derivation\
    \ would be executed like\n\n```\ncontext ClubMember::chairedCommittee: Committee\n\
    drive:\nif Committee.allInstances().exists(c | c.chair = m) then c\n```\n\nThere\
    \ are two ways to realize the derivation of a property: it may be derived via\
    \ a read-time computation, or it may be derived on update via an update-time computation\
    \ performed whenever one of the variables in the derivation expression (typically,\
    \ another property) changes its value. The latter corresponds to a materialized\
    \ view in a database. While a reference property that is derived on read may not\
    \ guarantee efficient navigation, because the on-read computation may create unacceptable\
    \ latencies, a reference property that is derived on update does provide efficient\
    \ navigation.\n\nIn the case of a derived reference property, we have to deal\
    \ with life-cycle dependencies between the affected model classes requiring special\
    \ change management mechanisms based on the functionality of the represented association\
    \ (either one-to-one many-to-one or many-to-many).\n\nIn our example of the derived\
    \ inverse reference property ClubMember::chairedCommittee, which is single-valued\
    \ and optional, this means that\n1. whenever a new committee object is created\
    \ (with a mandatory chair assignment), the corresponding ClubMember::chairedCommittee\
    \ property has to be assigned accordingly;\n2. whenever the chair property is\
    \ updated (that is, a new chair is assigned to a committee), the corresponding\
    \ ClubMember::chairedCommittee property has to be unset for the club member who\
    \ was the previous chair and set for the one being the new chair;\n3. whenever\
    \ a committee object is destroyed, the corresponding ClubMember::chairedCommittee\
    \ property has to be unset.\n"
