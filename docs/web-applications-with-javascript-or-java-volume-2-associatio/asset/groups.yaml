    \ Book class hierarchy.\n\n## 14.2.3 The Classes of the Java Entity Class Model\n\
    \nThe Java Entity class model can be directly coded for getting the code of the\
    \ model classes of our Java EE back-end app.\n\n## 14.2 Case Study 1: Implement\
    \ a Class Hierarchy with Single Inheritance — 163\n\n### 14.2.3.1 Summary\n\n\
    - 1. Code the enumeration type (to be used in the facelets).\n- 2. Code the model\
    \ classes and add the corresponding JPA annotations for class hierarchy.\n\nThese\
    \ steps are discussed in more detail in the following sections.\n\n### 14.2.3.2\
    \ Code the Enumeration Type BookCategoryEL\n\nThe enumeration type BookCategoryEL\
    \ is coded as a Java enum, providing enumeration literals as well (human-readable)\
    \ labels:\n\n```java\npublic enum BookCategoryEL {\n    TEXTBOOK(\"TextBook\"\
    ), BIOGRAPHY(\"Biography\");\n    private final String label;\n\n    private BookCategoryEL(String\
    \ label) {\n        this.label = label;\n    }\n    public String getLabel() {return\
    \ this.label;}\n}\n```\n\n### 14.2.3.2.1 Code the Model Classes\n\nWe code the\
    \ model classes Book, TextBook and Biography in the form of Java Entity classes\
    \ using suitable JPA annotations:\n\n```java\n@Entity\n@Table(name=\"books\")\n\
    @Inheritance(strategy=InheritanceType.SINGLE_TABLE)\n@DiscriminatorColumn(name=\"\
    category\", discriminatorType=DiscriminatorType.STRING, length=16)\n@DiscriminatorValue(value=\"\
    BOOK\")\n@ManagedBean\npublic class Book {\n    @Id\n    @Column(length=10)\n\
    \    @NotNull(message=\"An ISBN is required!\")\n    @Pattern(regex=\"\\\\d(\\\
    \\d|X)\\b\", message=\"The ISBN must be a . . !\")\n    private String isbn;\n\
    \    @Column(nullable=false)@NotNull(message=\"A title is required!\")\n    private\
    \ String title;\n    @Column(nullable=false)@NotNull(message=\"A year is required!\"\
    )\n    @UpToNextYear\n    @Min(value=1459, message=\"The year must not be before\
    \ 1459!\")\n    private Integer year;\n    constructors, set, get and other methods\n\
    ```\n\nWhen using the JPA Single Table Inheritance technique for a class hierarchy,\
    \ the @Inheritance annotation must be set for the superclass (e.g. Book in our\
    \ example). It provides the strategy parameter with the value InheritanceType.SINGLE_TABLE.\
    \ The @DiscriminatorColumn annotation specifies the name of the table column storing\
    \ the values between different types of subclasses (Textbook and Biography, in\
    \ our example).\n\nUnfortunately, we cannot use our BookCategoryEL enumeration\
    \ for defining the type of the discriminator column, because Java expressions\
    \ like BookCategoryEL.TEXTBOOK.name() are not constant, so a Java compiler throws\
    \ exception. Instead, we use DiscriminatorType.STRING. The @DiscriminatorValue\
    \ annotation specifies a unique value to be stored in the discriminator column\
    \ of table rows representing an instance of the class.\n\nFurther, we define the\
    \ subtypes Textbook and Biography:\n\n```java\n@Entity(name=\"textbooks\")\n@DiscriminatorValue(value=\"\
    TEXTBOOK\")\n@ManagedBean(name=\"text\") @ViewScoped\npublic class Textbook extends\
    \ Book {\n  @Column( nullable=false) @NotNull(\n    message=\"A subject area value\
    \ is required\")\n  private String subjectArea;\n  constructors, set, get and\
    \ other methods\n}\n```\n\nTextbook and Biography are subclasses of Book, so we\
    \ define them with extends Book. For each subclass, we add a @DiscriminatorValue\
    \ annotation with a value from the BookCategoryEL enumeration.\n\n## 14.2.4 STI\
    \ Database Schema\n\nAs a result of the annotation\n\n```java\n@Inheritance(strategy=InheritanceType.SINGLE_TABLE)\n\
    ```\n\n## 14.2 Case Study 1: Implement a Class Hierarchy with Single Inheritance\
    \ — 163\n\nAs a result of the annotation\n\n```java\n@Inheritance(strategy=InheritanceType.SINGLE_TABLE)\n\
    ```\n\nonly one table is used for representing a class hierarchy. In our example,\
    \ the table contains the following: isbn, title, year, subjectArea, about and\
    \ category. The simplified SQLDL to generate is shown below:\n\n```sql\nCREATE\
    \ TABLE IF EXISTS books (\n  `ISBN` varchar(10) NOT NULL,\n  `TITLE` varchar(255)\
    \ NOT NULL,\n  `YEAR` int NOT NULL,\n  `SUBJECTAREA` varchar(255) NULL,\n  `ABOUT`\
    \ varchar(255) NULL,\n  `category` varchar(16) NULL\n)\n```\n\n## 14.2.5 Write\
    \ the View And Controller\n\nThe user interface (UI) consists of a start page\
    \ that allows navigating to the management pages (in our example, to index.xhtml\
    \ in the folder WebContent/views/books/). Such a management page contains four\
    \ sections: retrieve/list, create, update and delete.\n\n### 14.2.5.1 Summary\n\
    \nWe have to take care of handling the category and subjectArea both in “List\
    \ all books” as well as in “Create book” and “Update book”.\n\n- 1. Adding a segment\
    \ information column (“Special type”) to the display table of the Retrieve/List\
    \ use case.\n- 2. Adding a \"Special type\" select control, and corresponding\
    \ form fields for all segment properties, in the forms of the \"Create book\"\
    \ and \"Update book\" cases in create.xhtml and update.xhtml.\n\n### 14.2.5.2\
    \ Add a Segment Information Column in Retrieve/List\n\nWe add a \"Special type\"\
    \ column to the display table of the list use case in books.xhtml:\n\n```xml\n\
    <h:dataTable value=\"#{bookController.books}\" var=\"b\">\n  <h:column>\n    <f:facet\
    \ name=\"header\">Special type</f:facet>\n    #{b.getClass().getSimpleName() !=\
    \ 'Book' ? b.getClass().getSimpleName() : ''}\n  </h:column>\n</h:dataTable>\n\
    ```\n\nA conditional expression is used to check if the Java bean name is Book,\
    \ in which case we don't show it, or if it is something else (e.g. Textbook or\
    \ Biography), and then it is shown. This expression also shows how you call various\
    \ Java bean methods, not only custom methods.\n\n### 14.2.5.3 Add a \"Special\
    \ Type\" Select Control in Create and Update\n\nIn use cases, we need to allow\
    \ selecting a special category of books ('textbook' or 'biography') with the help\
    \ of a select control in a panel grid element:\n\n```xml\n<h:panelGrid id=\"bookPanel\"\
    \ columns=\"3\">\n  <h:outputText value=\"Special type:\" />\n  <h:selectOneMenu\
    \ id=\"bookType\" value=\"#{viewScope.bookTypeVal}\">\n    <f:selectItem label=\"\
    --\" />\n    <f:selectItems value=\"#{book.typeItems}\" />\n    <f:ajax event=\"\
    change\" execute=\"@this\" render=\"textBookPanel standardBookPanel\"/>\n  </h:selectOneMenu>\n\
    \  <h:message for=\"bookType\" errorClass=\"error\" />\n</h:panelGrid>\n```\n\n\
    In the select control, three alternative panel groups are referenced:\n\n- 1.\
    \ A \"standardBookPanel\":\n\n```xml\n<h:panelGroup id=\"standardBookPanel\">\n\
    \  <h:commandButton value=\"#{viewScope.bookTypeVal == null rendered=\"#{bookController.create(book.isbn,\
    \ book.title, book.year)}\"/>\n```\n"
