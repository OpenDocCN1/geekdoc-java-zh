  mdcn: "\n\n# 2 使用原生 JS 实现单向函数关联\n\n注意，发布者（publisher）名称被用作 ID 引用，因为它是 Publisher 类的标准\
    \ ID。\n\n## 2.3 构建 JS 类模型\n\n构建 JS 类模型的起点是如图 1.10 所示的面向对象（OO）类模型。\n\n我们现在展示如何通过四个步骤从该\
    \ OO 类模型推导出 JS 类模型。对于 OO 类模型中的每个类：\n\n- 1. 为所有（非派生的）单值属性添加 `<get/set>` 构型，意味着它们具有隐式的\
    \ getter（获取）和 setter（设置）。回想一下，在 setter 中会调用相应的检查操作，只有当检查没有检测到违反约束时，属性才会被赋值。\n\
    - 2. 为每个（非派生的）属性创建一个检查操作（check operation），以便在集中位置实现属性约束。对于标准的 ID 属性（如 `Book::isbn`），需要两个或三个检查操作：\n\
    \    1. 一个基础检查操作，如 `checkIsbn`，用于检查语法约束，但不检查强制性值约束和唯一性约束。\n    2. 一个标准的 ID 检查操作，如\
    \ `checkIsbnAsId`，用于检查标准 ID 属性所隐含的强制性值约束和唯一性约束。\n    3. 如果其他类有一个引用正在考虑的类的属性，添加一个\
    \ ID 引用检查操作，用于检查对 ID 引用（或外键）属性的引用完整性约束。例如，由于 `Book::publisher` 属性引用 `Publisher`\
    \ 对象，我们需要在 `Publisher` 类中一个 `checkNameAsRef` 操作。\n- 3. 为 `toString` 添加序列化函数，用于在错误消息和日志消息中显示对象的状态。\n\
    - 4. 为 `toRecord()` 添加对象到存储的转换函数，为模型对象准备好存储为实体表中的某行，该行可以通过 `JSON.stringify` 序列化为\
    \ JSON 字符串，从而存储为应用 `localStorage` 数据存储的值。\n\n对于像 `Book::publisher` 这样的引用属性，检查操作\
