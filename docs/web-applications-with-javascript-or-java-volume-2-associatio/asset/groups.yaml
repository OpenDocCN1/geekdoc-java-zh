    \ 和 `Publisher` 类的 JS 类模型。\n\n## 2.4 新问题\n\n与第 1 卷讨论的验证和枚举应用相比，我们必须处理许多新的技术问题：\n\
    \n- 1. 在模型中，我们现在需要处理满足以下要求的引用属性：\n    1. 维护引用完整性；\n    2. 选择实现 1.2 节讨论的两种可能的删除策略之一，用于在属性范围类的\
