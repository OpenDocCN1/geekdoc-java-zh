    \ 块中调用，其中 `catch` 子句负责记录日志。\n\n对于每个模型类 C，我们定义一个类级属性 `instances`，表示由应用程序管理的实例集合（记录的映射）。该属性初始化为\
    \ `{}`。例如，在 `Publisher` 类的情况下，我们定义：\n\n`Publisher.instances = {};`\n\nJS 模型中的\
    \ `Book` 类以类似的方式编写：\n\n```javascript\nclass Book {\n  constructor ({isbn, title,\
    \ year, authors, authorRefs, publisher, publisher_id}) {\n    this.isbn = isbn;\n\
    \    this.title = title;\n    this.year = year;\n    this.authors = authors ||\
    \ authorRefs;\n    if (publisher || publisher_id) {\n      this.publisher = publisher\
    \ || publisher_id;\n    }\n  }\n}\n```\n\n注意，`Book` 构造函数既可以用对象引用 `authors` 调用，也可以用\
    \ ID 引用 `authorRefs` 和 `publisher_id` 调用。这种方法使得 `Book` 构造函数更加灵活健健。\n\n### 2.5.3\
    \ 编写属性检查\n\n确保 JS 模型中指定的属性所有约束在其检查函数中正确实现，正如第 1 卷第 8 章所示。回想约束违反（或验证错误）类定义在 `lib/errorTypes.js`\
    \ 文件中。例如，对于 `Publisher.checkName` 函数我们得到以下代码：\n\n```javascript\nclass Publisher\
    \ {\n  \n  static checkName(n) {\n    if (n === undefined) {\n      return new\
    \ NoConstraintViolation(); // 非强制\n    } else {\n      if (typeof n !== \"string\"\
    \ || n.trim() === \"\") {\n        return new RangeConstraintViolation(\n    \
    \      \"名称必须是非空字符串!\"\n        );\n      } else {\n        return new NoConstraintViolation();\n\
    \      }\n    }\n  }\n  static checkNameAsId(n) { . . }\n  ..\n}\n```\n\n"
