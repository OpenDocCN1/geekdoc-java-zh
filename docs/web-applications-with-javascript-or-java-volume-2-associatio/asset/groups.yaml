    \ Java Entity 类模型 — 162\n\n图 14.2 人（Person）类层次结构的 Java Entity 类模型 — 169\n\n# 表列表\n\
    \n表 1.1 功能类型 — 8\n\n# 第一部分：关联\n\n我们在第一卷中讨论过的三个示例应用程序——最小化应用、验证应用和枚举应用，它们都局限于仅管理一种对象类型的数据。然而，一个真实的应用程序必须管理多个对象类型的数据，这些类型之间通常以各种方式相互关联。特别是，对象类型之间可能存在关联和子类型（继承）关系。处理关联和子类型关系是软件应用工程中的高级问题。它们在教科书中往往没有得到充分讨论，也没有得到应用程序框架的良好支持。\n\
    \n关联是信息模型的重要元素。应用程序必须在模型-视图-控制器（MVC）架构的模型层中以正确的方式实现它们。遗憾的是，应用程序框架对处理关联的支持并不完善。\n\
    \n- 关联存在两种重要的区别，它们独立于：\n  1. 功能性与多对多。\n  2. 单向与双向。\n\n在数学中，关联被形式化为元组集。在实体关系（ER）建模中（这是信息系统的经典信息建模方法），对象被称为实体，关联被称为关系类型。统一建模语言（UML）包含了用于信息建模的类图。在\
    \ UML 中，对象类型被称为类，关系类型被称为关联，个体关系被称为链接。这些术语总结如下表：\n\n| 我们首选的术语 | UML | ER 图 | 数学\
    \ |\n|---|---|---|---|\n| 对象 | object | entity | individual |\n| 对象类型（类） | class\
    \ | entity type | relation |\n| 关系 | link | relationship | tuple |\n| 关联（关系类型）\
    \ | association | relationship type | relation |\n\n我们讨论引用属性，它们在“无关联”类模型（即没有显式关联元素的模型）中隐含地表示二进制关联。\n\
    \n# 1.1 引用与引用属性\n\n引用可以是人类可读的，也可以是对象引用。人类可读引用指的是人类通信中使用的标识符，例如天体的唯一名称、书籍的 ISBN\
    \ 以及公司员工的工号。内部对象引用指的是 OOP 对象的计算机内存地址，为访问计算机主内存中的对象提供了高效机制。\n\n某些语言（如 SQL 和 XML）只支持人类可读引用不支持内部引用。在\
    \ SQL 中，人类可读引用被称为*外键*，它们所引用的标识符被称为*主键*。在 XML 中，人类可读引用被称为 *ID 引用*，对应的属性类型是 IDREF。\n\
    \nOO 程序中的对象既可以通过人类可读引用（例如整数代码），也可以通过内部对象引用进行引用，后者更有利于访问主内存中的对象。\n\n"
