    \ name, empNo, category, department}) {\n    super({personId, name});\n    this.empNo\
    \ = empNo;\n    if (category) this.category = category;\n    if (department) this.department\
    \ = department;\n  }\n}\n```\n\n### 13.3.4.2 Loading the Instances of the Root\
    \ Class Person\n\nWhen retrieving the instances of a class hierarchy's root class\
    \ (in our example, Person) from a persistent data store organized according to\
    \ the TCI approach, we have to retrieve not only its direct instances from the\
    \ table representing the root class (people), but also indirect instances from\
    \ all tables representing its subclasses (employees and authors), as shown in\
    \ the following code:\n\n```javascript\nPerson.retrieve = function () {\n  var\
    \ people = {}, employees = {}, authors = {};\n  if (!localStorage[\"authors\"\
    ]) localStorage[\"authors\"] = \"{}\";\n  if (!localStorage[\"employees\"]) localStorage[\"\
    employees\"] = \"{}\";\n  if (!localStorage[\"people\"]) localStorage[\"people\"\
    ] = \"{}\";\n  try {\n    people = JSON.parse(localStorage[\"people\"]);\n   \
    \ employees = JSON.parse(localStorage[\"employees\"]);\n    authors = JSON.parse(localStorage[\"\
    authors\"]);\n  } catch (e) {\n    console.log(\"Error reading from Local Storage\\\
    n\" + e);\n  }\n  for (let key of Object.keys(authors)) {\n    try { // convert\
    \ record to (typed) object\n      Author.instances[key] = new Author(authors[key]);\n\
    \      // create superclass extension\n      Person.instances[key] = Author.instances[key];\n\
    \    } catch (e) {\n      console.log(`${e.constructor.name} while deserializing`\
    \ + `author ${key}: ${e.message}`);\n    }\n  }\n}\n```\n\nEach record of the\
    \ authors table is retrieved and converted to an Author object, a reference to\
    \ which is copied. Also the records of the employees table are processed in this\
    \ way, while the records of the people table are simply retrieved and converted\
    \ to Person objects:\n\n```javascript\nPerson.retrieveAll = function () {\n  ..\n\
    \  for (let key of Object.keys(employees)) {\n  }\n```\n\n## 13.3 Case Study 2:\
    \ Implementing a Class Hierarchy — 159\n\n```javascript\nfor (let key of Object.keys(people))\
    \ {\n  try { // convert record to (typed) object\n    Person.instances[key] =\
    \ new Person(people[key]);\n  } catch (e) {\n    console.log(`${e.constructor.name}\
    \ while deserializing ` + \n      `${key}: ${e.message}`);\n  }\n}\n```\n\n###\
    \ 13.3.4.3 Saving the Supertable when Saving a Subtable\n\nSince the app's data\
    \ is kept in main memory as long as the app is running (which is as long as the\
    \ app's webpage is kept open in the browser), the data has to be saved to persistent\
    \ storage when the app is exited (e.g., by closing its browser tab). When saving\
    \ the instances of Employee and Author to persistent storage in pl.v.employees.manage.exit\
    \ and pl.v.authors.manage.exit, we also save the direct instances of Person (as\
    \ records of the people table). This is necessary because changes to Employee\
    \ or Author instances may imply changes of `Person.instances`.\n\nFor instance,\
    \ for Employee data management, we define in v/employees.js:\n\n```javascript\n\
    pl.v..employees.manage = {\n  exit: function () {\n    Employee.saveAll();\n \
    \   Person.saveAll();\n  },\n..}\n```\n\n## 14 Subtyping with Java EE\n\nIn this\
    \ chapter, we explain two case studies based on fragments of the information model\
    \ of our running example, the Public Library. In the first case study, we consider\
    \ the single-level hierarchy with Book shown in 12.1, which is an incomplete segmentation.\
    \ We use the Single Table approach for mapping this hierarchy to a single table.\n\
    \nIn the second case study, we consider the multi-level hierarchy with Person,\
    \ Employee and Author, shown in Figure 12.8. We use the Joined Inheritance approach\
    \ for mapping this hierarchy to a set of tables that are related with foreign\
    \ key.\n\nIn both cases we show:\n\n1. how to derive a Java Entity model,\n2.\
    \ how to code the model in the form of Entity classes,\n3. how to write the view\
    \ and controller code based on the model.\n\n## 14.1 Subtyping in Java\n\nJava\
    \ provides built-in support for subtyping with its extends keyword, but it does\
    \ not support multiple inheritance. Consider the following design model:\n\n|\
    \ Person |\n| :--- |\n| firstName | String |\n| lastName | String |\n| Student\
    \ |\n| studNo | Integer |\n\nFirst, we define the superclass Person. Then, we\
    \ define the subclass Student and its subtype relationship to Person by means\
    \ of extends keyword:\n\n```java\npublic class Person {\n    private String firstName;\n\
    \    private String lastName;\n    ...\n}\npublic class Student extends Person\
    \ {\n    private int studentNo;\n```\n\n## 14.2 Case Study 1: Implementing a Class\
    \ Hierarchy — Single Inheritance — 161\n\n```java\npublic Student(String first,\
    \ String last, int studNo) {\n    super(first, last);\n    this.setStudentNo(studNo);\n\
    }\n```\n\nNote that in the Student class, we define a constructor with all the\
    \ parameters required to create an instance of Student. In this subclass constructor\
    \ we use super to invoke the constructor of the superclass Person.\n\n### 14.2\
    \ Case Study 1: Implement a Class Hierarchy with Single Table Inheritance\n\n\
    In this example we implement the Book hierarchy shown in Figure 12.1. The Java\
    \ Entity model is derived from this design model.\n\n### 14.2.1 Make the Java\
    \ Entity Class Model\n\nRecall that we obtain a Java Entity class model from an\
    \ OO class model by (1) making all properties private, (2) using datatype classes,\
    \ (3) adding public getters and setters, (4) adding a toString function, (5) adding\
    \ the (static) data storage methods create, retrieve, update and delete, resulting\
    \ in the model shown in Figure 14.1.\n\n### 14.2.2 New Issues\n\nWe have to deal\
    \ with a number of new issues:\n\n- 1. In the model code we have the enumeration\
    \ type (BookCategoryEL) that is used in the UI code for creating a selection list\
    \ widget that allows choosing the category of book.\n- 2. Code each class from\
    \ the Book hierarchy using suitable JPA annotations for persistent storage in\
    \ a corresponding database table, like books.\n- 3. In the UI code we have to\
    \ take care of:\n   1. Adding a \"Special type\" column to the display table of\
    \ the \"retrieve/list all books\" use case in retrieveAndList.xhtml in the folder\
    \ WebContent/views/books/. A book without a special category will have an empty\
    \ table\n"
