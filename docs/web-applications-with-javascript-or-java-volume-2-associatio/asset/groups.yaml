    \ projects. For avoiding repetitive boilerplate code, generic forms of these methods\
    \ are needed, such that they can be reused in all model classes of an app. For\
    \ instance, the cCLASSjs library provides such an approach.\n\n## 4 Implementing\
    \ Unidirectional Functional Associations with Java EE\n\nA unidirectional functional\
    \ association is either one-to-one or many-to-one. In both cases such association\
    \ is represented, or implemented, with the help of a single-valued reference property.\n\
    \nIn this chapter, we show:\n\n- 1. how to derive a data model in the form of\
    \ a Java Entity class model from an OO class model with single-valued reference\
    \ properties representing unidirectional functional associations,\n- 2. how to\
    \ code the Java Entity class model in the form of entity classes (implementing\
    \ model classes),\n- 3. how to write the view and controller code based on the\
    \ entity classes.\n\n## 4.1 Implementing Single-Valued Reference Properties in\
    \ Java\n\nA single-valued reference property, such as the publisher of the object\
    \ type Book, allows storing internal references to objects of another type, such\
    \ as Publisher. When creating a new object, the constructor function needs to\
    \ have a parameter for allowing to assign a suitable value to the reference property.\
    \ In a typed programming language, as Java, we may have to take a decision if\
    \ this value is expected is an internal object reference or an ID reference. Using\
    \ the JPA object-to-storage mapping technology, we can work with object references\
    \ and leave the mapping to corresponding ID references to JPA. The Book class\
    \ is extended as follows:\n\n```java\n@Entity @Table(name=\"books\")\n@ViewScoped\
    \ ManagedBean(name=\"Book\")\npublic class Book {\n\n    private Publisher publisher;\n\
    \n    public Book() {}\n\n    public Book(String isbn, String title, Integer year,\n\
    \        Publisher publisher) { . . }\n\n    public Publisher getPublisher() {\
    \ . . . }\n\n    public void setPublisher( Publisher publisher) { . . .\n}\n```\n\
    \n## 4.2 Make a Java Entity Class Model\n\nThe starting point for making a Java\
    \ Entity class model is an OO class model like the one shown in Figure 1.10.\n\
    \nAs explained before, we obtain the Java Entity class Publisher from the corresponding\
    \ OO design class by (1) making all properties private, (2) using Java data-type\
    \ classes (String, Integer, etc.), (3) adding the stereotype «get/set» to properties\
    \ (specifying public getters and setters), (4) adding a toString function, (5)\
    \ adding the (class-level) data methods to retrieve, update, and delete:\n\n|\
    \ Java Entity |\n| :--- |\n| Publisher |\n| <get/set>-name : String |\n| <get/set>-address\
    \ : String |\n| +checkNameAid(in : String, em : EntityManager) : ConstraintViolation\
    \ |\n| +toString() : String |\n| +retrieveAll(in : EntityManager) : List<Publisher>\
    \ |\n| +retrieve(em : EntityManager, name : String) : Publisher |\n| +create(em\
    \ : EntityManager, name : String, address : String) |\n| +update(em : EntityManager,\
    \ name : String, address : String) |\n| +delete(em : EntityManager, name : String)\
    \ |\n\nIn a Java Entity class model, for any association end, we show the association\
    \ end and annotate it with:\n\n| Java Entity |\n| :--- |\n| Book |\n| <get/set>-isbn\
    \ : String |\n| <get/set>-title : String |\n| <get/set>-year : Integer |\n| <get/set>-publisher\
    \ : Publisher (manyToOne) |\n\n## 4.3 New Issues\n\nCompared to the single-valued\
    \ properties, we have to deal with a number of technical issues:\n\n- 1. In the\
    \ model code we now have to take care of reference properties that require defining\
    \ referential constraints with help of JPA annotations;\n- 2. Extending the create,\
    \ update and delete operations by fetch type;\n- 3. In the user interface (view)\
    \ code we now have to take care of showing information about associated objects\
    \ and allowing an associated object from a list in create and update cases.\n\n\
    ## 4.4 Write the Model Code\n\nThe Java Entity class model can be directly coded\
    \ for the model layer of our back-end.\n\n### 4.4.1 Summary\n\n- 1. Code each\
    \ class from the Java Entity model as a corresponding entity class.\n- 2. Code\
    \ an [id] property modifier with the JPA annotation @Id.\n- 3. Code any property\
    \ denoting the functionality type of a reference property, such as [manyToOne],\
    \ with the corresponding JPA annotation, such as @ToOne.\n- 4. Code the integrity\
    \ constraints specified in the model with help Java Bean Validation annotations.\n\
    - 5. Code the getters and setters.\n- 6. Code the create, retrieve, update and\
    \ delete storage operations as class-level methods.\n\n### 4.4.2 Code Each Class\
    \ of the Entity Model\n\nEach class of the entity class model is coded as an annotated\
    \ class with name having a default constructor (with no parameters) and a constructor\
    \ with entity creation parameters.\n\nFor instance, the Book class from the Entity\
    \ model is coded the following:\n\n```java\n@Entity @Table(name=\"books\")\n@ViewScoped(name=\"\
    book\")\npublic class Book {\n    @Id @NotNull(message=\"An ISBN is required!\"\
    )\n    private String isbn;\n    @Column(nullable=false)\n    @NotNull(message=\"\
    A title is required!\")\n    private String title;\n    @Column(nullable=false)\n\
    \    @NotNull(message=\"A year is required!\")\n    private Integer year;\n  \
    \  @ToOne(fetch=FetchType.EAGER)\n    private Publisher publisher;\n\n    public\
    \ Book() {}\n    public Book(String isbn, String title, Integer year, Publisher\
    \ publisher) {\n        this.setIsbn(isbn);\n        this.setTitle(title);\n \
    \       this.setYear(year);\n        this.setPublisher(publisher);\n    }\n  \
    \  ... // getters, etc.\n}\n```\n\nThe @ManyToMany annotation on the publisher\
    \ is used for specifying the functionality type of the association Book has Publisher\
    \ since it holds that a book has one publisher and a publisher has many books.\
    \ This annotation also allows to specify a fetch type with the parameter taking\
    \ one of the following two values:\n\n- FetchType.EAGER, implying that a retrieval\
    \ of an entity includes a retrieval of the associated entity referenced by this\
    \ property. In our example, this means that when a Book entity is retrieved, the\
    \ Publisher entity referenced by the book's publisher property is also retrieved.\
    \ This behavior is very\n"
