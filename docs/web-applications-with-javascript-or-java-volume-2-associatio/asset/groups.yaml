    # 134 12 Subtyping and Inheritance


    SQL99 features for subtyping, but have to model inheritance hierarchies in database
    design models by means of plain tables and foreign key dependencies. This mapping
    from class hierarchies to relational tables (and back) is the business of Object-Relational-Mapping
    frameworks such as JPA Providers (like Hibernate), Microsoft''s Entity Framework,
    or the Active Record approach of the Rails framework.


    There are essentially three alternative approaches to how to represent a class
    hierarchy with database tables:


    +   1. **Single Table Inheritance (STI)** is the simplest approach, where the
    entire class hierarchy is represented by a single table, containing columns for
    all attributes of the root class and all of its subclasses, named after the name
    of the root class.

    2. **Table per Class Inheritance (TCI)** is an approach, where each class of the
    hierarchy is represented by a corresponding table containing columns for inherited
    properties, repeating the columns of the tables that represents its superclasses.

    3. **Joined Tables Inheritance (JTI)** is a more logical approach, where each
    subclass is represented by a corresponding table (subtable) connected to the table
    representing its superclass (supertable) via its primary key referencing the primary
    key of the superclass, such that the (inherited) properties of the subclass are
    not represented as columns in subtables.


    Notice that the STI approach is closely related to the Class Hierarchy Merge design
    pattern discussed in Section 12.6 above. Whenever this design pattern has already
    been applied in the design model, or the design model has already been refactored
    according to this design pattern, class hierarchies (their subclasses) have been
    eliminated in the design, and consequently also in the data model to be coded
    in the form of class definitions in the app''s model layer, so there is no anymore
    to map class hierarchies to single tables. Otherwise, the design model contains
    a class hierarchy that is implemented with a corresponding class hierarchy in
    the app''s model layer, which would be mapped to database tables with the help
    of the STI approach.


