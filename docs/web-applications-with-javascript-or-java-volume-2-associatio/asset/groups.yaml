    authors\"]);\n  } catch (e) {\n    console.log(\"Error reading from Local Storage\\\
    n\" + e);\n  }\n  for (let key of Object.keys(authors)) {\n    try { // 将记录转换为（类型化的）对象\n\
    \      Author.instances[key] = new Author(authors[key]);\n      // 创建父类扩展\n  \
    \    Person.instances[key] = Author.instances[key];\n    } catch (e) {\n     \
    \ console.log(`${e.constructor.name} while deserializing` + `author ${key}: ${e.message}`);\n\
    \    }\n  }\n}\n```\n\n`authors` 表的每条记录都被检索并转换为 `Author` 对象，并复制其引用。同样，`employees`\
    \ 表的记录也这样处理，而 `people` 表的记录仅被检索并转换为 `Person` 对象：\n\n```javascript\nPerson.retrieveAll\
    \ = function () {\n  ..\n  for (let key of Object.keys(employees)) {\n  }\n```\n\
    \n## 13.3 案例 2：实现类层次结构 — 159\n\n```javascript\nfor (let key of Object.keys(people))\
    \ {\n  try { // 将记录转换为（类型化的）对象\n    Person.instances[key] = new Person(people[key]);\n\
    \  } catch (e) {\n    console.log(`${e.constructor.name} while deserializing `\
    \ + \n      `${key}: ${e.message}`);\n  }\n}\n```\n\n### 13.3.4.3 保存子表时保存主表\n\n\
    由于只要应用程序运行，数据就会保存在主内存中（只要应用程序的网页在浏览器中打开），因此当程序退出时必须将数据保存到持久化存储（例如关闭浏览器标签页）。在 `pl.v.employees.manage.exit`\
    \ 和 `pl.v.authors.manage.exit` 中将 `Employee` 和 `Author` 实例保存到持久化存储时，我们还需要保存 `Person`\
    \ 的直接实例（作为 `people` 表的记录）。这是必要的，因为 `Employee` 或 `Author` 实例的更改可能意味着 `Person.instances`\
    \ 的变化。\n\n例如，对于 `Employee` 数据管理，我们在 `v/employees.js` 中定义：\n\n```javascript\npl.v..employees.manage\
    \ = {\n  exit: function () {\n    Employee.saveAll();\n    Person.saveAll();\n\
    \  },\n..}\n```\n\n## 14 使用 Java EE 进行子类型化\n\n在本章中，我们将根据运行示例——公共图书馆（Public Library）的信息模型片段，解释两个案例。在第一个案例中，我们考虑了\
    \ 12.1 所示的带有 `Book` 的单级层次结构，这是一个不完整的划分。在第二个案例中，我们考虑了 12.8 所示的带有 `Person`、`Employee`\
    \ 和 `Author` 的多级层次结构。我们使用连接继承将其映射到表。\n\n在两种情况下，我们都展示了：\n\n1. 如何导出实体模型；\n2. 如何以实体类的形式编写模型；\n\
    3. 如何基于模型编写视图和控制器代码。\n\n## 14 Java 中的子类型化\n\nJava 通过 `extends` 关键字内置支持子类型化，但不支持多重继承。考虑以下设计模型：\n\
    \n| Person |\n| :--- |\n| firstName | String |\n| lastName | String |\n\n| Student\
    \ |\n| studNo | Integer |\n\n首先，我们定义父类 `Person`。然后，我们通过 `extends` 关键字定义子类 `Student`\
    \ 及其与 `Person` 的子类型关系：\n\n```java\npublic class Person {\n    private String firstName;\n\
    \    private String lastName;\n    ...\n}\npublic class Student extends Person\
    \ {\n    private int studentNo;\n}\n```\n\n## 14.2 案例 1：实现类层次结构 — 单一继承 — 161\n\
    \n```java\npublic Student(String first, String last, int stdNo) {\n    super(first,\
    \ last);\n    this.setStudentNo(studNo);\n}\n```\n\n注意在 `Student` 类中，我们定义了一个包含创建\
    \ `Student` 实例所需的所有参数的构造函数。在这个子类构造函数中，我们使用 `super` 调用父类的构造函数。\n\n### 14.2 案例 1：使用单表继承实现类层次结构\n\
    \n在本示例中，我们实现了 12.1 所示的 `Book` 层次结构。Java 实体模型派自该设计模型。\n\n### 14.2.1 构建 Java 实体类\n\
    \n回顾从 OO 模型获取 Java 实体类的方法：(1) 将所有属性私有化；(2) 使用数据类型；(3) 添加公共 getter 和 setter；(4)\
    \ 添加 `toString` 函数；(5) 添加静态数据存储方法 `create`、`retrieve`、`update` 和 `delete`，从而得到如图\
    \ 14.1 所示的模型。\n\n### 14.2.2 新问题\n\n我们需要处理以下几个新问题：\n\n- 1. 在模型代码中，我们有一个枚举类型 `BookCategoryEL`，它用于\
    \ UI 代码创建选择列表组件，允许选择书籍类别。\n- 2. 使用适当的 JPA 注解编码 `Book` 层次结构中的每个类，以便持久化到相应的数据库表中（如\
    \ `books`）。\n- 3. 在 UI 代码中，我们需要处理：\n   1. 在“检索/列出所有书籍”用例的 `retrieveAndList.xhtml`（位于\
    \ `WebContent/views/books/` 文件夹）的显示表中添加“特殊类型”列。没有特殊分类的书籍该单元将为空。\n\n"
