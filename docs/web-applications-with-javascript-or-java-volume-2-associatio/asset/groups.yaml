    \ Object.keys(a)) {\n      this.addAuthor(a[idRef]);\n    }\n  }\n}\n```\n\nIn\
    \ JS, a collection-valued reference property can be implemented in two ways:\n\
    1. having an array list (JS array) as its value,\n2. having a map as its value,\
    \ such that the values of the object's standard ID attribute are the keys, which\
    \ are mapped to internal JS object references.\n\nWe prefer using maps for set-valued\
    \ reference properties since they guarantee that each element is unique, while\
    \ with an array we would to prevent duplicate elements. Also, an element of a\
    \ map can be easily deleted (with the help of the delete operator), while this\
    \ requires more effort in the case of an array. However, for implementing ordered\
    \ (or nonunique) association ends corresponding to ordered-collection-valued (or\
    \ bag/sequence-valued) reference properties, we use JS arrays.\n\n# 3.2 Make a\
