    # Foreword

    This two-volume book shows how to design and implement web applications with a
    model-based approach, using the two most relevant platforms for web development:
    JavaScript and Java. Web apps are designed with the help of models in the form
    of UML diagrams and implemented as:


    - JavaScript front-ends, using one of the two local storage technologies offered
    by browsers;

    - Java back-ends, using Java Server Faces (JSF) as the user interface technology,
    Java Persistence API (JPA) for object-to-storage mapping, and MySQL/MariaDB database
    management system.


    The focus of the book is general concepts and techniques concerning the fundamental
    management issues of:

    - integrity constraints and data validation,

    - enumerations and attributes,

    - unidirectional and bidirectional associations between object types,

    - subtyping and inheritance in class hierarchies.


    The first two issues are discussed in Volume 1, while the last two are discussed
    in Volume 2. We assume that the reader is already familiar with HTML and with
    at least one object-oriented programming language, such as C++, Java, PHP or C#.
    In addition, we assume that the reader has some familiarity with CSS and JavaScript,
    and is interested to learn more about programming with JavaScript or Java. The
    book can be used in web development courses for students of Computer Science or
    Information Systems and related disciplines; by JavaScript developers for learning
    Java; by Java developers for learning JavaScript; and by JavaScript and Java (and
    PHP/C#) developers for learning-object-oriented (OO) programming with JavaScript
    or Java, how to implement basic information management concepts and build complete
    web apps with JavaScript. The book comes with the complete source code of six
    example apps that you can run or download from our server.


