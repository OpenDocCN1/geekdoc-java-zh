    # 术语表


    Web 本体语言 (OWL) 是一种用于在 Web 上进行知识表示的格式化逻辑语言。它允许定义词汇（主要是带有属性的类），并支持对它们表达许多类型的完整性约束。OWL
    是执行自动推理的基础，例如检查 OWL 词汇的一致性。以 UML 类模型形式定义的词汇或数据模型可以转换为 OWL 词汇，然后检查其一致性。


    # P


    便携式网络图形填充 (PNG Polyfill) 是一种开放的（非专利）图形文件格式，支持无损数据压缩。填充程序（polyfill）是一段 JavaScript
    代码，用于在不支持该方法的浏览器中模拟标准的 JavaScript 方法。


    # R


    资源描述框架 (RDF) 是一种 W3C 语言，用于在 Web 上表示机器可读的命题陈述信息。


    # S


    标准泛化标记语言 (SGML) 是一种用于定义语言的 ISO 规范。HTML4 是用 SGML 定义。XML 是 SGML 的简化继任者。HTML5 不再基于
    SGML，而是有自己的解析规则。


    可缩放矢量图形 (SVG) 是一种基于 XML 的 2D 图像格式。SVG 可以使用 CSS 进行样式化，并使用 JavaScript 实现交互。HTML5
    允许在 HTML 文档中直接嵌入 SVG 内容。


    槽位（slot）是一个键值对。在面向对象的程序的对象中（例如，在 Java 对象中），槽位通常是一个属性-值对。但在 JavaScript 对象中，槽位也可能由方法名和方法体组成，或者可能是
    map 中的一个键值对。


    # U


    Unicode（统一编码）


    一种与平台无关的字符集，包含了世界上大多数脚本语言的几乎所有字符，包括印地语、缅甸语和盖尔克语。每个字符被分配一个 0 到 1,114,111 范围之间的唯一整数代码。例如，希腊字母
    π 的代码为 960。Unicode 包含 ASCII 和 ISO-8859-1 (Latin-1) 等旧字符集作为子集。XML 基于 Unicode，希腊字母
    π（代码为 960）可以作为 &#960; 插入 XML 文档中。XML 文档中 Unicode 字符的 XML 语法编码是 UTF-8，它对 ASCII
    字符仅使用一个字节，而对不常用的字符使用三个字节。


    统一资源标识符 (URI)


    URI 或是统一资源定位符 (URL) 或是统一资源名称 (URN)。


    统一资源定位符 (URL)


    URL 是一种资源名称，包含一个在 Web 上定位该资源的 Web 地址。


    统一建模语言 (UML)


    UML 是一种行业标准，定义了一组建模语言，用于创建各种模型和图表，以支持面向对象的问题分析和软件设计。它的核心语言是用于信息/数据建模的类图，以及用于过程/行为建模的序列图、活动图和状态图（或状态图）。


    统一资源名称 (URN)


    URN 指向一个资源而不指定其位置。


    用户代理 (User Agent)


    用户代理是指前端 Web 程序，例如 Web 浏览器。


    # W


    WebM


    WebM 是一种由 Google Chrome 和 Mozilla Firefox 支持的开放（免版税）视频格式，但不支持 Microsoft Internet
    Explorer 和 Apple Safari 的支持。


    Web 超文本应用技术工作组 (WHATWG)


    WHATWG 由 Apple、Mozilla 和 Opera 的前员工于 2004 年建立，他们对 W3C 选择专注于 XHTML2 的标准化导致 Web
    技术标准化进展缓慢感到不满。在 Ian Hickson 的领导下，它在与 W3C 的竞争与合作中开发了 HTML5 以及相关的 JavaScript API。


    万维网 (World Wide Web)


    WWW（或简单称为“Web”）是一个基于 HTTP、HTML 和 XML 的巨大客户端-服务器网络，其中 Web 浏览器（以及其他“用户代理”）作为 HTTP
    客户端访问作为 HTTP 服务器的 Web 服务器程序。W3C 是负责开发和维护 Web 标准的国际组织。


    万维网联盟 (World Wide Web Consortium)


    # X


    XML HTTP 请求 (XHR)


    XML HTTP 请求 (XHR) API 允许 JavaScript 程序与后端程序交换 HTTP 消息。它可以用于在不提交 HTML 表单的情况下，从或向后端程序检索/提交信息。基于
    XHR 的方法过去已统归入“AJAX”这一缩写下。


