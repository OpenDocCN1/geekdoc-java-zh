    # 10 Special Topics on Associations


    ## 10.1 Part-Whole Associations


    A part-whole association represents a relationship between a part type and a whole
    type. Its instances are part-whole relationships between two objects where one
    of them is a part of the other (the UML). The UML makes a distinction between
    two kinds of part-whole associations: *aggregation* and *composition*. While these
    two terms are defined in a pretty precise, albeit unsatisfactory, way in the UML,
    many software developers have a different interpretation following a terminological
    tradition of the C++ programming community: unlike the parts of an ‘aggregation’,
    the parts of a ‘composition’ cannot exist independently of the composite that
    references them.


    We follow the UML and improve their definition of composition by introducing a
    distinction between two kinds of compositions: those with *separable* parts and
    those with *inseparable* parts.


    ### 10.1.1 Aggregation


    An aggregation is a special form of a part-whole association, where the parts
    of a whole can be shared with other wholes. For instance, we can model an aggregation
    between the classes *DegreeProgram* and *Course*, as shown in the following diagram,
    since a course is part of a degree program and can be shared among two or more
    degree programs (e.g. an engineering degree could share a C programming course
    with a computer science degree).


    | DegreeProgram | Course |

    | --- | --- |

    | name : String | id : String |

    | name : String |


    However, the concept of an aggregation with *shareable parts* doesn’t mean much,
    really, so it has no implications on how to code the association and many developers
    therefore prefer not to use the white diamond in their class graphs, but UML spec
    says: “Precise semantics of shared aggregation varies by application area and
    modeler”.


    The *multiplicity* of an aggregation’s association end at the whole side may be
    any number (*) because a part may belong to, or *shared* among, any number of
    wholes.


    ### 10.1.2 Composition


    It''s amazing how much confusion exists about the distinction between the part-whole
    association concepts aggregation and composition. The main problem is the widespread
    misunderstanding (even among expert software developers and the authors of UML)
    that the concept of composition implies a life-cycle dependency between the whole
    and its parts that the parts cannot exist without the whole. But this view ignores
    that there are also cases of part-whole associations with non-shareable parts
    where the parts can be detached and survive the destruction of the whole.


    In the UML specification document, the definition of the term “composition” has
    always implied non-shareable parts, but it has not been clear what is merely an
    optional characteristic. Even in the UML version 2.5 (as of 2015), after an attempt
    to provide the definition of the term “composition”, it remains still ambiguous
    and doesn’t provide any guidance how to model part-whole associations with non-shareable
    parts where the parts can be detached from, and survive the destruction of, the
    whole as opposed to the case where the parts cannot be detached and are destroyed
    with the whole. They say:


    > If a composite object is deleted, all of its part instances are destroyed with
    it.


    But at the same time they also:


    > A part may be removed from a composite object before the composite object is
    deleted, and thus not be deleted as part of the composite object.


    This confusion points to an incompleteness of the UML definition, which does not
    account for life-cycle dependencies between components and composites. It''s therefore
    important to understand how the UML definition can be enhanced, e.g. by introducing
    a UML stereotype for “inseparable” compositions, or by introducing a constraint
    key word for characterizing the association end at the component side.


    Martin Fowler has explained, the main issue for characterizing composition relationships
    is that “an object can only be the part of one composition relationship”. This
    is also explained in the blog post UML Composition with Aggregation as Association
    by G. Bellekenens. In addition to defining this characteristic of a composition
    (to have exclusive, or non-shareable, parts), a composition may also come with
    a life-cycle dependency between the composite and its components. In fact, there
    are two kind of dependencies:


    - 1. Whenever a composite must be attached to a composite, or in other words,
    when it has a mandatory composition, as expressed by the “exactly one” multiplicity
    at the composite side of the composition line, then it must either be reused in
    (or re-attached to) another composite, or destroyed, when its current composite
    is destroyed. This is exemplified by the composition between Person and Heart,
    shown in the diagram below. A heart is either destroyed or transplanted to another
    person, when its owner has died.

    - 2. Whenever a component must not be detached from its composite, or, in other
    words, when it is inseparable, then, and only then, the component has to be destroyed,
    when its composite is destroyed. An example of a composition with inseparable
    parts is the composition between Person and Brain.


    ![](img/1a8b608b42ede8e4d7e1a974745ae019_130_0.png)


    In summary


    When a life-cycle dependency applies, it represents a special form of Existential
    Dependency, which implies the CASCADE deletion policy discussed in Section 1.2.


    In the example of a Car-Engine composition, as shown in the following diagram,
    it''s clearly the case that the engine can be detached from the car before the
    car is destroyed, in which case the engine is not destroyed and can be re-used.
    This is implied by the zero or one multiplicity at the composite side of the composition
    line.


    | Car | Engine |

    | --- | --- |

    | licenseNo : String | id : String |

    | color : String | 0.1 |

    | cylinderCapacity : Decimal |


    The multiplicity of a composition''s association at the composite side is either
    1 or 0.1, depending on the fact if components have a mandatory composite or not.
    Of course, the fact that a component is inseparable implies it has a mandatory
    composite, and consequently the composite''s multiplicity must be 1.


    ### 10.1.3 Example


    As an example of part-whole association, we consider the association between textbooks
    and their chapters. Normally, a chapter of a textbook cannot be reused in another
    book (e.g. because it may reference other parts of textbook). Also, it doesn''t
    make sense to allow having textbook chapters that are not part of textbook. We
    therefore model this association as an inseparable composition, as shown in the
    following diagram.


    ```

    «invariant (The combination of the textbook''s ISBN and the chapter''s sequenceNo
    is unique.)

    ```


    Wait, the diagram is missing, let''s re-examine the text flow.


    An object class representing an inseparable component type, like Chapter, does
    not need to have a standard identifier attribute because there is no need for
    inseparable components to be referenced independently of their composite object.
    For referencing inseparable components, a composite key that is composed of the
    primary key of the composite and a suitable (relatively unique) attribute of the
    component type is used. For instance, a textbook chapter is referenced by a combination
    of the textbook''s ISBN and the chapter''s sequence number.


    Since Chapter objects, as inseparable components of Textbook objects, cannot continue
    to exist when their textbook ceases to exist, we need to use the CASCADE deletion
    policy, requiring to delete all associated chapters with deleting a textbook,
    in the implementation of the *Delete Textbook* operation.


    An inseparable component type does not require its own CRUD data management interfaces.
    Rather, all CRUD operations are provided within the data management user interfaces
    of its composite type. For instance, creating, retrieving, updating and deleting
    textbook chapters is done within one interfaces for managing textbook data.


    ## 10.2 Association Classes


    An association class is a class that represents an association.


    Recall that simple associations are eliminated in an OO class model by turning
    them into reference properties of the involved object classes, as shown in Section
