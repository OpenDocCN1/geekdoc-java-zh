    # 前言

    本两卷本展示了如何使用基于模型的方法设计并实现 Web 应用，并了 Web 开发中最相关的两个平台：JavaScript 和 Java。Web 应用通过 UML
    图形式的模型进行设计，并实现为：


    - JavaScript 前端：使用浏览器提供的两种本地存储技术之一；

    - Java 后端：使用 Java Server Faces (JSF) 作为用户界面技术，Java Persistence API (JPA) 用于对象到存储的映射，以及
    MySQL/MariaDB 数据库系统。


    本书的重点是关于以下通用概念和技术：

    - 完整性约束和数据验证，

    - 枚举和属性，

    - 类型之间的单向和双向关联，

    - 类层次结构中的子类型。


    前两个问题将在第一卷中讨论，后两个将在第二卷。假设读者熟悉 HTML 以及至少一种面向对象的语言，如 C++、Java 或 C#。此外，我们假设读者对 CSS
    和 JavaScript 有一定了解，并兴趣学习使用 JavaScript 或 Java 进行面向对象的编程。适用于计算机科学或信息系统及相关专业的 Web
    开发课程；适用于 JavaScript 开发者学习 Java；适用于 Java 开发者学习 JavaScript；适用于 JavaScript 和 Java（以及
    PHP/C#）开发者。书中带有六应用程序的完整源代码，您可以从我们的服务器下载。


