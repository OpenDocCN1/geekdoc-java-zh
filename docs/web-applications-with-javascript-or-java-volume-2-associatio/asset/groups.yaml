    \  ... // getter 等\n}\n```\n\npublisher 上的 @ManyToMany 注解用于指定 Book 与 Publisher\
    \ 关联的功能类型，因为它持有了书有一个发布者，而发布者有很多书籍。该注解允许通过参数取以下两个值之一指定获取类型：\n\n- FetchType.EAGER，意味着检索实体时包含对该属性引用的关联实体的检索。在我们的示例中，这意味着当检索一个\
    \ Book 实体时，其发布者属性引用的 Publisher 实体也会被检索。这种行为非常\n\n"
