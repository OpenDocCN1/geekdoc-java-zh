    | +toString() : string |\n| +-() |\n\n## 5.3 新问题\n\n与上一节讨论的处理单向函数关联相比，我们必须处理以下新的技术问题：\n\
    1. 在**模型类**中，我们必须处理需要用 `@OneToOne` 或 `@ManyToMany` 注解的**多值引用属性**。\n2. 在**用户界面**代码中，我们需要处理：\n\
    - 在**检索**（retrieve）列表对象的列表用例中，在视图表格列中显示渲染多值引用属性的关联对象集合的信息；\n- 在**创建**（create）对象和**更新**（update）对象的用例中，允许从目标类的所有现有实例列表中选择关联对象集合。\n\
    \n最后一个问题，即从某些类的所有现有实例列表中选择关联对象集合，通常由于可用性问题，无法通过 HTML `select multiple` 元素来解决。每当可选选项集大于某个阈值（由滚动时屏幕上可见的选项数量定义）时，HTML\
    \ `select multiple` 元素将不再可用，此时应使用替代的**多选**小部件。\n\n## 5.4 编写模型代码\n\nJava 实体类模型可以直接编写代码，以实现我们\
    \ Java 后端应用的模型层。\n\n### 5.4.1 总结\n\n将 Java 实体类模型中的每个类编码为对应的实体类。\n\n1. 为任何 `[id]`\
    \ 属性修饰符使用 JPA 属性注解 `@Id` 进行编码。\n2. 为任何表示引用属性功能类型的修饰符（如 `[ManyToOne]`）使用相应的 JPA\
    \ 注解（如 `@ManyToOne`）进行编码。\n3. 使用 Java Bean Validation 注解（或自定义验证注解）对模型中指定的完整性约束进行编码。\n\
    4. 为多值属性编写 getter、setter 以及 `add` 和 `remove` 方法。\n5. 将创建、检索、更新和删除存储管理操作编码为类级方法。\n\
    \n这些步骤将在接下来的章节中进行更详细的讨论。\n\n### 5.4.2 Java 实体类模型的每个类\n\n对于多值引用属性 `Book::authors`，我们使用了一个参数化的\
    \ `Set` 类型：\n\n```java\n@Entity @Table (name=\"books\")\n@ViewScoped @ManagedBean\
    \ (name=\"book\")\npublic class Book {\n\n    @ManyToMany (fetch=FetchType.EAGER)\n\
    \    private Set<Author> authors;\n\n    public Book() {}\n    public Book(String\
    \ isbn, String title, Integer year,\n               Publisher publisher, Set<Author>\
    \ authors) { . . . }\n\n    public Set<Author> getAuthors() { return this.authors;\
    \ }\n    public void setAuthors(Set<Author> authors) { this.authors=authors; }\n\
    \n}\n```\n\nJPA `@ManyToMany` 注解允许指定 `Book` 和 `Author` 之间的多对多关系。使用了注解参数 `FetchType.EAGER`，因此当创建一个\
    \ `Book` 实例时，作者列表将用相应的 `Author` 实例填充。由于该注解，会创建一个 `Book` 和 `Author` 之间的关系表，生成的\
    \ SQL 代码所示：\n\n```sql\nCREATE TABLE IF NOT EXISTS 'books_author' (\n  'Book_ISBN'\
    \ varchar(10) NOT NULL,\n  'Author_ID' int(11) NOT NULL\n);\n```\n\n`books_author`\
    \ 关系表是 `Book` 和 `Author` 之间的关系，生成的 SQL 代码所示（见上文）。\n\n上文 `books_author` 表中的主键。通过使用\
    \ `@JoinTable` 注解来控制这些参数。在我们的应用程序中，保持默认，因此不使用 `@JoinTable`。\n\nJava 实体类创建如下：\n\
    \n```java\n@Entity @Table (name=\"author\")\n@ViewScoped @ManagedBean (name=\"\
    book\")\npublic class Author {\n  // 属性\n  @Id (nullable=false)\n  private Integer\
    \ personId;\n  @NotNull (message=\"required\")\n  private String name;\n  @Positive\n\
    \  private Date dateBirth;\n  @Positive\n  private Date dateOfDeath;\n\n  // 构造函数\n\
    \  public Author(Integer personId, String name, Date dateBirth, Date dateOfDeath)\
    \ { . . }\n\n  // Setter 和 getter\n  // 数据管理操作\n  public static void create(EntityManager\
    \ em, UserTransaction ut, Integer personId, String name, Date dateBirth, Date\
    \ dateOfDeath) { . . }\n  public static void update(..) { . . }\n  public static\
    \ void delete(..) { . . }\n}\n```\n\n## 5.4.3 实现删除策略\n\n对于引用属性 `Book::authors`，我们必须\
    \ `Author` 类中实现删除策略。如果我们尝试删除一个作者，而该作者被任何书籍引用，则会抛出完整性约束违反，导致无法删除。我们有两种处理方式：\n1.\
    \ 删除所有由该作者编写的书；\n2. 从所有由该作者编写的书移除对该作者的引用。\n\n我们选择第二种方案。如下所示的 `Author.delete` 方法：\n\
    \n```java\npublic static void delete(EntityManager em, UserTransaction ut, Integer\
    \ personId) throws Exception {\n  ut.begin();\n  Author author = em.find(Author.class,\
    \ personId);\n  // 查找该作者的所有书籍\n  Query query = em.createQuery(\"SELECT DISTINCT\
    \ b FROM Book b \" +\n  \"INNER JOIN b.authors a WHERE a.personId = :personId\"\
    );\n  query.setParameter(\"personId\", personId);\n  List<Book> books = query.getResultList();\n\
    \  // 从书籍的作者列表中移除作者\n  for (Book b : books) {\n    b.getAuthors().remove(author);\n\
    \  }\n\n  // 删除作者记录（表行）\n  em.remove(author);\n  ut.commit();\n}\n```\n\n本质上，删除操作包含三个步骤：\n\
    1. 创建查询该作者所有书籍的 JPQL 查询。\n2. 对于找到的每个引用该作者的书籍，我们必须在其作者列表中移除该作者引用。\n3. 最后，删除作者记录。\n\
    \n"
