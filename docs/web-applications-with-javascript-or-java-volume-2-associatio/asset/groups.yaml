    \ is updated.\n\nThis concerns the two derived inverse reference properties Publisher:/publishedBooks\
    \ and Author:/authoredBooks. Thus, we get the following JavaScript class model:\n\
    \n| Book | Publisher |\n| :--- | :--- |\n| <get/set/isbn> : string (id) | <get/set/name[1]>\
