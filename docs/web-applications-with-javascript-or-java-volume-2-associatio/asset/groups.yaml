    \ update and delete methods by taking the reference properties into consideration;\n\
    \   3. a method for converting between (internal) object references and corresponding\
    \ (external) ID references in serialization and de-serialization operations.\n\
    2. In the user interface (view) code we now have to take care of\n   1. showing\
    \ information about associated objects in the retrieve/list all use case;\n  \
    \ 2. allowing to select an associated object from a list of all existing instances\
    \ of the target class in the create object and update object cases.\n\n# 4.4 Write\
    \ the Model Code\n\nThe Java Entity class model can be directly coded for getting\
    \ the model layer code of our Java back-end app.\n\n# 4.4.1 Summary\n\n+   1.\
    \ Code each class from the Java Entity class model as a corresponding entity class.\n\
    2. Code an [id] property modifier with the JPA annotation @Id\n3. Code any property\
    \ modifier denoting the functionality type of a reference property, such as [manyToOne],\
    \ with the corresponding JPA annotation, such as @ManyToOne.\n4. Code the integrity\
    \ constraints specified in the model with the help of Java Bean Validation annotations\
    \ (or custom validation annotations).\n5. Code the getters and setters.\n6. Code\
    \ the create, retrieve, update and delete storage management operations as class-level\
