    - 3. 编写序列化函数 `toString()` 和存储函数 `toRecord()`。\n- 4. 处理删除依赖。\n\n这些步骤将在后续章节中详细讨论。\n\
    \n### 2.5.2 将每个类编写为 ES15 类\n\nJS 模型中的每个类 C 都编写为具有隐式 getter 和 setter 的 ES15 类。在构造函数体内，将记录字段赋值给属性。这些赋值会调用相应的\
    \ setter。\n\n例如，JS 模型中的 `Publisher` 类如下所示编写：\n\n```javascript\nclass Publisher\
    \ {\n  constructor ({name, address}) {\n    this.name = name;\n    this.address\
