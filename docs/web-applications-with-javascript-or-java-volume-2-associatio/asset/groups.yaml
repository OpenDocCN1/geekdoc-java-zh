    \ of their personId property are equal:\n\n```java\n@Override\npublic boolean\
    \ equals(Object obj) {\n  if (obj instanceof Author) {\n    Author author = (Author)\
    \ obj;\n    return (this.personId.equals(author.personId));\n  } else return false;\n\
    }\n```\n\nLike the case of Publisher, a JSF converter is used to serialize objects\
    \ to strings when select list is populated, and back to objects when create method\
    \ of BookController is called (the “Create” button was pushed by the user). The\
