    在术语中，我们把人类可读的引用称为 ID 引用（ID references）。我们遵循 ID 引用属性的标准命名规范，即在类 A 中定义并引用类 B对象的
    ID 引用属性名称为 `b_id`，并使用后缀 `_id`。当我们将持久化对象存储在形式化表单记录或表行中时，我们需要将存储在如 `publisher_id`
    等属性中的内部对象引用转换为存储在 `publisher_id` 等属性中的 ID 引用。这种转换是在对象序列化过程的一部分，通过将被引用对象的标准标识符值分配给引用对象的
    ID 引用属性来实现的。


    在面向对象（OO）语言中，属性是针对对象类型（或类）定义的，它是它的作用域。属性的值要么是来自某些数据类型的值，在这种情况下该属性被称为属性（attribute），要么是引用某个类中对象的对象引用，在这种情况下该属性被称为引用属性（reference
    property）。例如，图 1.1 所示的 `Committee` 类有一个范围为 `String` 的属性 `name`，以及一个范围为 `ClubMember`
    的引用属性 `chair`。


    | Committee | ClubMember |

    | :--- | :--- |

    | name: String | |

    | chair: ClubMember | | |


    **图 1.1：** 一个委员会有一个俱乐部成员担任主席，通过引用属性 `chair` 表达。


    面向对象的编程语言（如 JavaScript、PHP、Java 和 C#）直接支持引用属性的概念，这些属性的引用不是数据类型，而是引用类型或类，其值是该该类实例的对象引用。


    默认情况下，属性的重基数为 1，这意味着该属性是强制的且功能性的（换句话说，是单值的），恰好有一个值，例如图 1.1 所示的 `Committee` 类中的
    `chair` 属性。功能性属性是可选的（非强制），其重基数为为 0..1，这意味着该属性的最小基数为 0，最大基数为 1。


    引用属性可以是单值的（功能性的），也可以是多值的（非功能性的）。例如，图 1.1 所示的 `Committee::chair` 引用属性是单值的，因为它为一个俱乐部分配了一个唯一的俱乐部成员作为主席。图
    1.11 所示的 `Book::authors` 属性是多值引用属性的示例。


    通常，多值引用属性的集合值是一组引用，这意味着引用的顺序并不重要。然而，在某些情况下，顺序是重要的，因此，此类多值引用属性的集合值是一个有序的引用集合，通常以列表（list）的形式实现。


    ## 1.2 引用完整性


    引用是我们应用程序数据库中的重要信息项。然而，只有当应用程序维护它们的引用完整性时，它们才具有意义。这意味着对于任何引用，数据库中必须存在一个被引用对象。因此，任何作用域为
    `C` 且范围为类 `D` 的引用属性 `p` 都带有一个引用完整性约束，在每当以下情况下必须检查：


    - 1. 创建类型为 `C` 的新对象时，

