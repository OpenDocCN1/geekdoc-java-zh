    \ name);\n    p.setPublishedBooks(null);\n    em.remove(p);\n    ut.commit();\n\
    \  }\n}\n```\n\n# 9.2.7 实体管理器与缓存实体\n\n遗憾的是，JPA 不提供反向引用的自动维护。根据 Java Persistence\
    \ Wiki，我们必须通过 `set/add/remove` 方法来实现（直接和反向的）关系管理：\n\n> 双向关系中的一个常见问题是，应用程序更新了关系的一侧，而另一侧没有更新，导致不同步。在\
    \ JPA 中，与通常情况一样，维护关系是应用程序或对象模型的职责。如果你的应用程序向关系的一侧添加了内容，那么它也必须向另一侧添加。这通常通过对象模型中处理关系双边的\
    \ `add` 或 `set` 方法来解决，这样应用程序代码就不需要担心这个问题。有两种方法可以实现：你可以在仅一侧添加关系维护代码并仅使用该侧的 setter（例如将另一侧设为\
    \ `protected`），或者在两侧都添加，并确保避免无限循环。\n\n我们为每个控制器类都使用了一个实体管理器（entity manager）。每个实体管理器都维护一组缓存实体，这些可以通过\
    \ `merge` 方法与其他实体管理器“共享”。在我们的示例中，作为每个模型类 `create` 和 `update` 方法的一部分，我们必须合并属于另一个实体管理器的更新实体。例如，在\
    \ `Book.create` 方法中，我们需要合并新书籍的出版社（由 `PublisherController` 的实体管理器管理）以及所有的作者（由 `AuthorController`\
    \ 的实体管理器管理）：\n\n```java\npublic class Book {\n    public static void create(EntityManager\
    \ em,\n        UserTransaction ut,\n        String isbn, String title, Integer\
    \ year,\n        Publisher publisher, Set<Author> authors)\n        throws Exception\
    \ {\n        ut.begin();\n        Book book = new Book(isbn, title, year,\n  \
    \          publisher, authors);\n        em.persist(book);\n        if (publisher\
    \ != null) {\n            em.merge(publisher);\n        }\n        for (Author\
    \ a : authors) {\n            em.merge(a);\n        }\n        ut.commit();\n\
    \    }\n}\n```\n\n如果不使用 `merge`，出版社以及 `authors` 列表中所有作者实例将不会表示对原始缓存实体的引用，并且不会保留我们的更改。更多详细信息，请检查与此相关的\
    \ Java Persistence 文档。\n\n也可以禁用 JPA 缓存，以便为每个新实例从数据库中重新加载，例如当调用 `EntityManager.find`\
    \ 方法时。这可以通过 `persistence.xml` 文件中添加以下行来实现：\n\n`<property name=\"eclisink.cache.shared.default\"\
    \ value=\"false\"/>`\n\n上述配置适用于 `eclisink` 实现，对于其他 API 实现可能会有所不同。请注意，如果没有严重理由，不建议禁用实体缓存，因为会降低应用的性能，并在某些情况下可能会产生意外行为，例如使用\
