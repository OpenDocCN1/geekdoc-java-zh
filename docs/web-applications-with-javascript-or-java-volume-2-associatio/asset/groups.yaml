    通常，对象创建依赖是在用户界面中管理的。


    ## 1.3 以引用属性表示单向关联


    源类和目标类之间的单向关联可以表示为源类的引用属性。下图 1.3 展示了两个单向关联的示例：多对一关联和多对多关联。


