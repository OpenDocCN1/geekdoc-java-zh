    ## 1.5 为非方向性关联添加方向性


    当我们以 UML 类图的形式制作信息模型时，我们最终通常会得到一个包含一个或多个关联的模型，这些关联的末端没有定义任何所有权，例如图 1.4 所示。当关联的末端都没有所有权点时（如本例所示），这意味着模型没有指定如何通过引用属性来表示（或实现）该关联。这种关联没有方向性。根据
    UML 2.5 规范，此类关联的末端由其自身“所有”，而不是由参与其中的任何一个类所所有。


    | Committee | chairedCommittee | ClubMember |

    | --- | --- | --- |

    | name : String | 0.1 | 1 |


    **图 1.4：** Committee 和 ClubMember 之间非方向性关联的模型。


    包含没有关联所有权点的关联的信息设计模型作为关系型数据库设计模型是可以接受的，但作为 OO 语言的设计模型，它是不完整的。


    例如，图 1.4 的模型提供了一个关系型数据库设计，包含两个实体表：committees 和 clubmembers，以及一个单独的一一一关系表：committee_clubmember_as_chair。它没有为
    Java 类提供设计，因为它没有指定如何通过引用属性来实现该关联。


    有三种方案可以将非方向性关联（不包含任何关联所有权点）的信息设计模型转换为所有关联均为单向或双向的信息设计模型：我们可以在关联的任一末端或两端末端放置所有权点。这三个方案中的每一个都定义了通过引用属性表示或实现关联的不同方法。因此，对于上述图
    1.4 所示的关联，我们有以下选项：


    - 1. 在 chair 关联末端放置所有权点，这将产生图 1.2 所示的模型，该模型可以转换为上述图 1.1 所示的 OO 类模型。


