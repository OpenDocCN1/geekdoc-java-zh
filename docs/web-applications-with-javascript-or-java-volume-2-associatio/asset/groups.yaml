- md: "\n## 6.4 Implementing Unidirectional Functional Associations with Java EE\n\
    \nstrings and vice versa by means of converters, which are classes annotated with\
    \ @FacesConverter and implementing the jax.faces.converter.Converter interface:\n\
    \n```java\n@FacesConverter(value=\"pl.m.converter.PublisherConverter\")\npublic\
    \ class PublisherConverter implements Converter {\n    @Override\n    public Object\
    \ getAsObject(FacesContext context,\n        UIComponent component, String value)\
    \ {\n        PublisherController ac = FacesContext\n            .getCurrentInstance()\n\
    \            .getApplication()\n            .evaluateExpressionGet(context, \"\
    #{publisherCtrl}\",\n                PublisherController.class);\n        EntityManager\
    \ em = ac.getEntityManager();\n        if (value == null) return null;\n     \
    \   else return em.find(Publisher.class, value);\n    }\n    @Override\n    public\
    \ String getAsString(FacesContext context,\n        UIComponent component, Object\
    \ value) {\n        if (value == null) return null;\n        else if (value instanceof\
    \ Publisher) {\n            return ((Publisher) value).getName();\n        }\n\
    \        else return null;\n    }\n}\n```\n\nA converter defines two methods:\
    \ getAsObject and getAsString, which are responsible for the two conversions.\
    \ For being able to retrieve an object from a database we need an EntityManager,\
    \ which can be obtained from a controller (e.g., the managed bean publisherCtrl).\
    \ The controller can be obtained via the FacesContext singleton:\n\n```java\n\
    PublisherController ac = FacesContext.getCurrentInstance()\n    .getApplication()\n\
    \    .evaluateExpressionGet( context, \"#{publisherCtrl}\",\n        PublisherController.class);\n\
    ```\n\n## 4.5 The View and Controller Layers\n\nIn addition, we need to add a\
    \ getEntityManager method in the controller class as follows:\n\n```java\n@Bean(name=\"\
    publisherCtrl\") @SessionScoped\npublic class PublisherContext {\n    @PersistenceContext(unitName=\"\
    UnidirAssocApp\")\n    private EntityManager em;\n    @Resource\n    UserTransaction\
    \ ut;\n\n    public EntityManager getEntityManager() {\n        return this.em;\n\
    \    }\n}\n```\n\nJSF needs to compare two publisher instances, when the publisher\
    \ list has to auto-select the current publisher, in the update book use case.\
    \ For this reason, the Publisher model class needs to implement the equals method.\
    \ In our case, two publishers are \"one and the same\", if the values of their\
    \ name property are equal:\n\n```java\n@Override\npublic boolean equals(Object\
    \ obj) {\n    if (obj instanceof Publisher) {\n        Publisher publisher = (Publisher)\
    \ obj;\n        return this.name.equals(publisher.name);\n    } else return false;\n\
    }\n```\n\n### 4.5.3.2 Write the View Code\n\nTo allow selection of objects which\
    \ have to be associated with the currently edited object from the create and update\
    \ use cases, an HTML selection list (a select element) is populated with the instances\
    \ of the associated object type with the help of a h:selectOneMenu. The create.xhtml\
    \ file in the folder WebContent/views/books/ is updated as follows:\n\n```xml\n\
    <ui:composition template=\"/WEB-INF/templates/page.xhtml\">\n<ui:define name=\"\
    content\">\n<h:form id=\"createBookForm\" styleClass=\"pure-form pure-form-aligned\"\
    >\n```\n\n```xml\n<h:panelGrid columns=\"3\">\n<h:outputLabel for=\"publisher\"\
    \ value=\"Publisher:\" />\n<h:selectOneMenu id=\"publisher\" value=\"#{book.publisher}\"\
    >\n<f:selectItem value=\"\" itemLabel=\"----\" />\n<f:selectItems value=\"#{publisherCtrl.publishers}\"\
    \ var=\"p\" itemLabel=\"#{p.name}\" itemValue=\"#{p}\" />\n<f:converter converter=\"\
    pl.m.converter.PublisherConverter\" />\n</h:selectOneMenu>\n<h:message for=\"\
    publisher\" errorClass=\"error\" />\n</h:panelGrid>\n<h:commandButton value=\"\
    Create\"\naction=\"#{bookCtrl.create(book.isbn, book.title, book.year, book.publisher.name)}\"\
    \ />\n</h:form>\n</ui:define>\n</ui:composition>\n```\n\nThe converter is specified\
    \ by the f:converter element and its associated @ConverterId. The value of this\
    \ attribute must be the same as the one specified by the value attribute of the\
    \ annotation @FacesConverter used when the converter class is defined, e.g.,\n\
    \n```java\n@FacesConverter( value = \"pl.m.converter.PublisherConverter\")\n```\n\
    \nIn general, the converter's local class name can be used (e.g., PublisherConverter),\
    \ or the fully qualified class name, if there is a risk of naming conflicts (e.g.,\
    \ pl.m.converter.PublisherConverter). We recommend using the fully qualified name\
    \ in all cases.\n\nThe #{publisherCtrl.publishers} expression results in calling\
    \ the getPublishers method of the PublisherController class, which is responsible\
    \ to return the list of available publishers:\n\n```java\npublic List<Publisher>\
    \ getPublishers () {\n  return Publisher.retrieveAll ( em );\n}\n```\n\nThe creation\
    \ of the book is obtained by using the h:commandButton element. It results in\
    \ the invocation of the create method of the BookController class:\n\n```java\n\
    public String create(String isbn, String title, Integer year,\nPublisher (publisher)\
    \ {\n    Book.create(em, ut, isbn, title, year, publisher);\n    // clearing the\
    \ form after creating the Book row\n    FacesContext faces = FacesContext.getCurrentInstance();\n\
    \    faces.getExternalContext().getRequestMap().remove(\"book\");\n} catch (EntityException\
    \ e) {\n    ut.rollback();\n    } catch (Exception e) {\n    e.printStackTrace();\n\
    \    }\n    return \"create\";\n}\n```\n\nIt simply calls the Book.create method\
    \ for creating a new row. The code for update case is very similar, the only difference\
    \ is the addition of select element (i.e., h:selectMenu) for to update:\n\n```xml\n\
    <ui:composition template=\"/WEB-INF/templates/page.xhtml\">\n<ui:define name=\"\
    content\">\n<h:form id=\"updateBookForm\" styleClass=\"pure-form pure-form-aligned\"\
    >\n<h:panelGrid columns=\"3\">\n<h:outputLabel for=\"publisher\" value=\"Publisher:\"\
    \ />\n<h:selectOneMenu id=\"publisher\" value=\"#{book.publisher}\">\n<f:selectItem\
    \ value=\"\" itemLabel=\"----\" />\n<f:selectItems value=\"#{publisherCtrl.publishers}\"\
    \ var=\"p\" itemLabel=\"#{p.name}\" itemValue=\"#{p}\" />\n<f:converter converter=\"\
    pl.m.converter.PublisherConverter\" />\n</h:selectOneMenu>\n<h:message for=\"\
    publisher\" errorClass=\"error\" />\n</h:panelGrid>\n<h:commandButton value=\"\
    Update\"\naction=\"#{bookCtrl.update(book.isbn, book.title, book.year, book.publisher.name,\
    \ book.authors)}\" />\n</h:form>\n</ui:define>\n</ui:composition>\n```\n\n## 5\
    \ Unidirectional Functional Associations with Java EE\n\nA unidirectional functional\
    \ association is either one-to-many or many-to-many. In both cases such an association\
    \ is represented with multi-valued reference property. In this chapter, we show\n\
    \n1. how to derive a Java Entity model from an OO class with multi-valued reference\
    \ properties,\n2. how to code the Entity model (implementing classes),\n3. how\
    \ to write the view and controller code.\n\n### 5.1 Implementing Multi-Valued\
    \ Properties\n\nA multi-valued reference property, as Book::authors, allows collection\
    \ of internal references to some type, such as Author. When creating a new type\
    \ of Book, the constructor needs a parameter for providing this property. In general,\
    \ the value can be a set of internal references or ID references. With JPA, we\
    \ use object references:\n\n```java\n@Entity@Table (name=\"books\")\n@ManagedBean\
    \ (name=\"book\")\n@ViewScoped\npublic class Book {\n\n    private Set<Author>\
    \ authors;\n\n    public Book() { // required by JPA\n    public Book( String\
    \ isbn, String title, Integer year,\n        Publisher publisher, Set<Author>\
    \ authors) { ... }\n\n    public Set<Author> getAuthors() { return authors; }\n\
    \    public void setAuthors( Set<Author> authors) { this.authors = authors; }\n\
    }\n```\n\n### 5.2 Make a Java Entity Model\n\nOur starting point for making a\
    \ Java Entity model is the following OO class:\n\n| Book | Publisher |\n|---|---|---|\n\
    | isbn[1] : String (id) | name : String (id) |\n| title[1] : String | adress :\
    \ String |\n| year[1] : Integer | |\n| publisher[0..1] : Publisher | |\n| authors[*]\
    \ : Author | |\n| | Author |\n| | personid : integer (id) |\n| | name : String\
    \ |\n\nThis model contains, in addition to the single-valued-one reference property\
    \ Book::publisher representing the unidirectional many-to-one association Book-has-Publisher,\
    \ the multi-valued reference property Book::authors representing the unidirectional\
    \ many-to-many association Book-has-Author.\n\nRecall that we obtain a Java Entity\
    \ class, like Author, from the corresponding class in the OO class model, by (1)\
    \ making all properties private, (2) using Java data-type classes, (3) adding\
    \ public getters and setters, (4) adding a toString function, (5) adding the data\
    \ storage methods create, retrieve, update and delete:\n\n| «Java Entity» Author\
    \ |\n|---|\n| +get/set-personid : Integer (id) |\n| +get/set-name : String |\n\
    | +checkPersonidAid(in pid : Integer, in em : EntityManager) : ConstraintViolation\
    \ |\n| +toString() : String |\n| +(...) |\n\nIn the Java Entity class model, any\
    \ reference property specified in the OO model is annotated with the functionality\
    \ type of the association represented by it.\n"
  mdcn: "\n\n## 6.4 使用 Java EE 实现单向功能关联\n\n通过转换器（Converters）实现字符串与对象之间的转换，转换器是带有 `@FacesConverter`\
    \ 注解并实现 `jax.faces.converter.Converter` 接口的类：\n\n```java\n@FacesConverter(value=\"\
    pl.m.converter.PublisherConverter\")\npublic class PublisherConverter implements\
    \ Converter {\n    @Override\n    public Object getAsObject(FacesContext context,\n\
    \        UIComponent component, String value) {\n        PublisherController ac\
    \ = FacesContext\n            .getCurrentInstance()\n            .getApplication()\n\
    \            .evaluateExpressionGet(context, \"#{publisherCtrl}\",\n         \
    \       PublisherController.class);\n        EntityManager em = ac.getEntityManager();\n\
    \        if (value == null) return null;\n        else return em.find(Publisher.class,\
    \ value);\n    }\n    @Override\n    public String getAsString(FacesContext context,\n\
    \        UIComponent component, Object value) {\n        if (value == null) return\
    \ null;\n        else if (value instanceof Publisher) {\n            return ((Publisher)\
    \ value).getName();\n        }\n        else return null;\n    }\n}\n```\n\n转换器定义了两个方法：`getAsObject`\
    \ 和 `getAsString`，它们负责两种转换。为了能够从数据库检索对象，我们需要一个 `EntityManager`，它可以从控制器中获取（例如，托管\
    \ Bean `publisherCtrl`）。可以通过 `FacesContext` 单例获取控制器：\n\n```java\nPublisherController\
    \ ac = FacesContext.getCurrentInstance()\n    .getApplication()\n    .evaluateExpressionGet(\
    \ context, \"#{publisherCtrl}\",\n        PublisherController.class);\n```\n\n\
    ## 4.5 视图层与控制层\n\n此外，我们需要在控制器类中添加如下 `getEntityManager` 方法：\n\n```java\n@Bean(name=\"\
    publisherCtrl\") @SessionScoped\npublic class PublisherContext {\n    @PersistenceContext(unitName=\"\
    UnidirAssocApp\")\n    private EntityManager em;\n    @Resource\n    UserTransaction\
    \ ut;\n\n    public EntityManager getEntityManager() {\n        return this.em;\n\
    \    }\n}\n```\n\n在“更新书籍”的用例中，当出版社列表需要自动选择当前出版社时，JSF 需要比较两个出版社实例。因此，Publisher\
    \ 模型类需要实现 `equals` 方法。在我们的情况下，如果两个出版者的 `name` 属性值相等，则它们是“同一个”：\n\n```java\n@Override\n\
    public boolean equals(Object obj) {\n    if (obj instanceof Publisher) {\n   \
    \     Publisher publisher = (Publisher) obj;\n        return this.name.equals(publisher.name);\n\
    \    } else return false;\n}\n```\n\n### 4.5.3.2 编写视图代码\n\n为了在“创建”和“更新”用例中允许选择与当前编辑对象关联的对象，通过\
    \ `h:selectOneMenu` 向一个 HTML 选择列表（`select` 元素）中填充关联对象类型的实例。`WebContent/views/books/`\
    \ 文件夹下的 `create.xhtml` 文件更新如下：\n\n```xml\n<ui:composition template=\"/WEB-INF/templates/page.xhtml\"\
    >\n<ui:define name=\"content\">\n<h:form id=\"createBookForm\" styleClass=\"pure-form\
    \ pure-form-aligned\">\n```\n\n```xml\n<h:panelGrid columns=\"3\">\n<h:outputLabel\
    \ for=\"publisher\" value=\"Publisher:\" />\n<h:selectOneMenu id=\"publisher\"\
    \ value=\"#{book.publisher}\">\n<f:selectItem value=\"\" itemLabel=\"----\" />\n\
    <f:selectItems value=\"#{publisherCtrl.publishers}\" var=\"p\" itemLabel=\"#{p.name}\"\
    \ itemValue=\"#{p}\" />\n<f:converter converter=\"pl.m.converter.PublisherConverter\"\
    \ />\n</h:selectOneMenu>\n<h:message for=\"publisher\" errorClass=\"error\" />\n\
    </h:panelGrid>\n<h:commandButton value=\"Create\"\naction=\"#{bookCtrl.create(book.isbn,\
    \ book.title, book.year, book.publisher.name)}\" />\n</h:form>\n</ui:define>\n\
    </ui:composition>\n```\n\n转换器由 `f:converter` 元素及其关联的 `converter` 指定。该属性的值必须与定义转换器类时使用的\
    \ `@FacesConverter` 注解的 `value` 属性指定的值相同，例如：\n\n```java\n@FacesConverter( value\
    \ = \"pl.m.converter.PublisherConverter\")\n```\n\n通常，可以使用转换器的本地类名（例如 `PublisherConverter`），或者在存在命名冲突风险时使用全限定类名（例如\
    \ `pl.m.converter.PublisherConverter`）。我们建议在所有情况下使用全限定名。\n\n`#{publisherCtrl.publishers}`\
    \ 表达式的结果调用 `PublisherController` 类的 `getPublishers` 方法，该方法负责返回可用出版社的列表：\n\n```java\n\
    public List<Publisher> getPublishers () {\n  return Publisher.retrieveAll ( em\
    \ );\n}\n```\n\n书籍的是通过使用 `h:commandButton` 元素实现的。这将调用 `BookController` 类的 `create`\
    \ 方法：\n\n```java\npublic String create(String isbn, String title, Integer year,\n\
    Publisher (publisher) {\n    Book.create(em, ut, isbn, title, year, publisher);\n\
    \    // 在创建 Book 行后清除表单\n    FacesContext faces = FacesContext.getCurrentInstance();\n\
    \    faces.getExternalContext().getRequestMap().remove(\"book\");\n} catch (EntityException\
    \ e) {\n    ut.rollback();\n    } catch (Exception e) {\n    e.printStackTrace();\n\
    \    }\n    return \"create\";\n}\n```\n\n创建书籍的操作通过调用 `Book.create` 方法。更新用例的代码与创建非常相似，不同之处在于添加了\
    \ `select` 元素，即：\n\n```xml\n<ui:composition template=\"/WEB-INF/templates/page.xhtml\"\
    >\n<ui:define name=\"content\">\n<h:form id=\"updateBookForm\" styleClass=\"pure-form\
    \ pure-form-aligned\">\n<h:panelGrid columns=\"3\">\n<h:outputLabel for=\"publisher\"\
    \ value=\"Publisher:\" />\n<h:selectOneMenu id=\"publisher\" value=\"#{book.publisher}\"\
    >\n<f:selectItem value=\"\" itemLabel=\"----\" />\n<f:selectItems value=\"#{publisherCtrl.publishers}\"\
    \ var=\"p\" itemLabel=\"#{p.name}\" itemValue=\"#{p}\" />\n<f:converter converter=\"\
    pl.m.converter.PublisherConverter\" />\n</h:selectOneMenu>\n<h:message for=\"\
    publisher\" errorClass=\"error\" />\n</h:panelGrid>\n<h:commandButton value=\"\
    Update\"\naction=\"#{bookCtrl.update(book.isbn, book.title, book.year, book.publisher.name)}\"\
    \ />\n</h:form>\n</ui:define>\n</ui:composition>\n```\n\n## 5 使用 Java EE 实现单向功能关联\n\
    \n单向功能关联可以是多对一或多对多的。在本章中，我们将展示：\n\n1. 如何从 OO 类推导出具有多值引用属性的 Java 实体模型；\n2. 如何实现实体类；\n\
    3. 如何编写视图和控制器代码。\n\n### 5.1 多值属性\n\n多值引用属性如 `Book::authors` 允许对某些类型（如 `Author`）的集合。创建新的\
    \ `Book` 类型时，构造函数需要该属性的参数。通常可以使用 ID 引用，但 JPA 使用对象引用：\n\n```java\n@Entity@Table\
    \ (name=\"books\")\n@ManagedBean (name=\"book\")\n@ViewScoped\npublic class Book\
    \ {\n\n    private Set<Author> authors;\n\n    public Book() { // JPA 需要\n   \
    \ public Book( String isbn, String title, Integer year,\n        Publisher publisher,\
    \ Set<Author> authors) { ... }\n\n    public Set<Author> getAuthors() { return\
    \ authors; }\n    public void setAuthors( Set<Author> authors) { this.authors\
    \ = authors; }\n}\n```\n\n### 5.2 制作 Java 实体模型\n\n制作 Java 实体模型的起点是以下 OO 类：\n\n\
    | Book | Publisher |\n|---|---|\n| isbn[1] : String (id) | name : String (id)\
    \ |\n| title[1] : String | adress : String |\n| year[1] : Integer | |\n| publisher[0..1]\
    \ : Publisher | |\n| authors[*] : Author | |\n| | Author |\n| | personid : integer\
    \ (id) |\n| | name : String |\n\n该模型除了代表多对一关联 `Book-has-Publisher` 的单值引用属性 `Book::publisher`\
    \ 外，还包含了代表多对多关联 `Book-has-Author` 的多值引用属性 `Book::authors`。\n\n回顾我们如何从 OO 类模型获取\
    \ Java 实体类（例如 `Author`）：(1) 将所有属性设为私有；(2) 使用 Java 类型类；(3) 添加公共 getter 和 setter；(4)\
    \ 添加 `toString` 函数；(5) 添加数据存储方法创建、检索、更新和删除：\n\n| «Java Entity» Author |\n|---|\n\
    | +get/set-personid : Integer (id) |\n| +get/set-name : String |\n| +checkPersonidAid(in\
    \ pid : Integer, in em : EntityManager) : ConstraintViolation |\n| +toString()\
    \ : String |\n| +(...) |\n\n在 Java 实体类模型中，OO 模型中指定的任何引用属性都将用其所代表的关联的功能类型进行注解。\n\
    \n"
