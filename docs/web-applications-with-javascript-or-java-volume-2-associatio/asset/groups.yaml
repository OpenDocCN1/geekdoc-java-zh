    \ get/set 操作：\n    - 1. 以实例方法编写 add/remove 方法调用相应的属性检查。\n    - 2. 编写 setter，使其对要赋值的集合中的项调用\
    \ add 操作。\n    - 3. 如果该属性是派生属性的反向引用（对应双向关联），确保 add/remove 方法也分配/取消（或添加/移除）反向引用到/从（集合值）。\n\
