    \    }\n    e.printStackTrace();\n  } catch (Exception e) {\n    e.printStackTrace();\n\
    \  }\n  return \"create\";\n}\n```\n\nThe update book case is similar to create\
    \ book case.\n\n## 5.6 Run the App and Get the Code\n\nFor running your application,\
    \ you may first have to stop your Tomcat/EE server (with bin/shutdown.bat for\
    \ Windows or bin/shutdown.sh for Linux). Next, download and unzip our ZIP archive\
    \ containing all the source code of the app and the ANT script file that you have\
    \ to edit (modify the server.folder property value). Now, execute the deploy command\
    \ in your console or terminal:\n\n`ant deploy -Dappname=UnidirectionalApp`\n\n\
    Finally, start your Tomcat web server (by using bin/startup.bat for Windows or\
    \ bin/startup.sh for Linux). Please be patient, this can take some time depending\
    \ the speed of your computer. It will be ready when the console displays the message:\
    \ INFO: Initializing Mojarra [some library versions and paths are shown here]\
    \ for context \"webappapp\". Finally, open a web browser of type:\n\n`http://localhost:8080/UnidirectionalApp/WebContent/views/app/index.xhtml`\n\
    \n## 5.7 Sets Versus Ordered Sets as the Values of Reference Properties\n\nRecall\
    \ that a set is an unordered collection that has unique elements, while a list\
    \ is an ordered collection that may contain the same element more than once.\n\
    \nWhen a non-functional association end is ordered, like Book::authors, in the\
    \ class diagram shown in Figure 5.1, this implies that the range of the corresponding\
    \ reference property needs to be an ordered collection type, such as the Java\
    \ interface uses SortedSet and List.\n\n| Book | authored | Author |\n| --- |\
    \ --- | --- |\n| isbn : String | Books | personId[1]: Integer, name[1]: String\
    \ |\n| title : String | * | |\n| year : Integer | (ordered) | |\n\nFigure 5.1:\
    \ A set-valued reference property authoredBooks and an ordered-set-valued reference\
    \ property authors.\n\nIn theory, set-valued reference properties should be defined\
    \ with Set<T>, such as declaring Set<Book> as the range of Author::authoredBooks,\
    \ while ordered-set-valued reference properties should be defined with SortedSet<T>,\
    \ such as declaring SortedSet<Author> as the range of authors. The Java interface\
    \ type is typically implemented by the Java class HashSet, while SortedSet is\
    \ typically implemented by TreeSet.\n\nHowever, if there is no concern about avoiding\
    \ duplicate elements, both set-valued and ordered-set-valued reference properties\
    \ can also be defined with the generic interface type List<T> as their range,\
    \ which is typically implemented with ArrayList.\n\nWhen the main use cases are\
    \ adding elements to the collection and later iterate over them, the best choice\
    \ is using List implemented by ArrayList, which is more memory efficient than\
    \ LinkedList or any implementation of Set, and has fast insertion, iteration,\
    \ and random access. Using HashSet provides a performance benefit only in the\
    \ use case of finding an element in the collection.\n\n## 6 Unidirectional Associations\
    \ Practice Projects\n\nAll projects include the following tasks:\n\n- 1. Make\
    \ an OO class model derived from the given design model. Hint: replace associations\
    \ with corresponding reference properties.\n- 2. Make a JavaScript class model\
    \ or a Java Entity class model derived from the OO class model. Hint: add check\
    \ and setter methods.\n- 3. Code your JS class model or Java Entity class model,\
    \ following the provided guidelines.\n\nMake sure that your pages comply with\
    \ the XML syntax of HTML5, and that your JavaScript code complies with our Coding\
    \ Guidelines and is checked with (JHint).\n\n### 6.1 Assign a Director and Actors\
    \ to a Movie\n\nThis project is based on the information design model shown below.\
    \ The app from the previous assignments is to be extended by adding the possibility\
    \ to manage data about the actors and the director of a movie. This is achieved\
    \ by adding a model class Person and two unidirectional associations between Movie\
    \ and Person:\n\n- 1. a many-to-one association assigning exactly one person as\
    \ the director of a movie, and\n- 2. a many-to-many association assigning zero\
    \ or more persons as the actors of a movie.\n"
