- md: "\n## 2.6 Code the View and Controller — 35\n\nThe Create user interface is\
    \ set up by the following procedure:\n\n```javascript\npl.v.books.create = {\n\
    \  setupInterface: function () {\n    const formEl = document.querySelector(\"\
    section#Book-C > form\"),\n    selectPublisher = formEl.selectPublisher,\n   \
    \ saveButton = formEl.commit;\n    // // add event listeners for responsive validation\n\
    \    formEl.isbn.addEventListener(\"input\", function () {\n      formEl.isbn.setCustomValidity(\n\
    \        Book.checkIsbnId(formEl.isbn.value);\n      );\n    });\n    // set up\
    \ a single select list for selecting a publisher\n    util.fillSelectWithOptions(selectPublisher,\n\
    \      Publisher.instances, \"name\");\n    // // define event handler for submit\
    \ button click\n    saveButton.addEventListener(\"click\",\n      this.handleSaveButtonClick);\n\
    \    // // define event handler for neutralizing the submit event\n    formEl.addEventListener(\"\
    submit\", function (e) {\n      e.preventDefault();\n      formEl.reset();\n \
    \   });\n    // // replace the manage form with the create form\n    document.getElementById(\"\
    Book-M\").style.display = \"none\";\n    document.getElementById(\"Book-C\").style.display\
    \ = \"block\";\n    formEl.reset();\n  },\n  handleSaveButtonClick: function ()\
    \ {\n    ...\n  };\n};\n```\n\nWhen the user clicks (or touches) the save button,\
    \ all form control values, including the value of the select control, are copied\
    \ to a slots list, which is used as the argument for invoking the add method after\
    \ all form fields have been checked for validity, as shown in the following program\
    \ list:\n\n```javascript\nhandleSaveButtonClick = function () {\n  const formEl\
    \ = document.querySelector(\"section#Book-C > form\");\n  const slots = {\n  \
    \  isbn:formEl.isbn.value,\n    title:formEl.title.value,\n    year:formEl.year.value,\n\
    \    publisher_id:formEl.selectPublisher.value\n  }\n// validate all form controls\
    \ and show error messages\nformEl.isbn.customValidity(\nBook.checkIsbnAsId(slots.isbn).message);\n\
    /* .. (the same with title and year) */\n// save the input data only if all form\
    \ fields are valid\nif (formEl.checkValidity()) {\n  Book.add (slots);\n}\n```\n\
    \nThe setupInterface code for the update book use case is similar.\n\n## 36 —\
    \ Implementing Unidirectional Functional Associations with Plain JS\n\n## 2.7\
    \ Quiz Questions\n\n### 2.7.1 Question 1: JS Class Model\n\nWhich is the correct\
    \ JS class model for the Committee class derived from the given OO class model?\n\
    \n| Committee | ClubMember |\n| :--- | :--- |\n| name : String (id) | memberId\
    \ : Integer (id) |\n| chair : ClubMember | firstName : String |\n\nSelect one:\n\
    \n- 1. O\n\n| Committee |\n| :--- |\n| <<get/set> name : string (id) |\n| <<get/set>\
    \ chair : ClubMember |\n| checkName(in n : string) : ConstraintViolation |\n|\
    \ checkChair(in c : ClubMember) : ConstraintViolation |\n| toString() : string\
