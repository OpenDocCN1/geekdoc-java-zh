    After the platform-specific OO class model has been completed, one or more platform-specific
    implementation models, for a choice of specific implementation platforms, can
    be derived from it. Examples of types of platform-specific implementation models
    are JS class models, Java Entity class models and SQL table models.


    A platform-specific implementation model can still be expressed in the form of
    a UML class diagram, but it contains only modeling elements that can be directly
    coded in the chosen platform. Thus, for any platform considered, two guidelines
    are needed: 1) how to make the platform-specific implementation model, and 2)
    how to code this model.


    ## 1.8 Rendering Reference Properties in the User Interface


    The widgets used for data input and output in a CRUD data management interface
    normally correspond to properties defined in a model class of an app. We have
    to distinguish between (various types of) input fields corresponding to (various
    kinds of) attributes, and widgets (such as selection lists) corresponding to enumeration
    attributes or to reference properties. Representing reference properties in the
    UI with select controls, instead of input fields, prevents the user from entering
    invalid ID references, so it takes care of referential integrity.


    In general, a single-valued reference property can be rendered as a single-selection
    list in the UI, no matter how many objects populate the reference range, from
    which one specific choice to be made. If the cardinality of the reference property''s
    range is sufficiently small (say, not greater than 7), then we can also use a
    radio button group of a selection list.


    A multi-valued reference property can be rendered as a multiple-selection list
    in the UI. However, the corresponding multiple-select control of HTML is not really
    usable as soon as there are many (more than 20) different options to choose from
    the way the reader chooses is visually too scattered. In the special case of having
    only a few (say, not more than 7) options, we can also use a checkbox group instead
    of multi-selection list. But for the general case of having in the UI a list containing
    all associated objects chosen from the reference property''s range class, we need
    to develop a special UI widget that allows to add (remove) objects to (from) list
    of chosen objects.


    Such a multiple-choice widget consists of:


    - 1. an HTML list element containing the (associated) objects, where each list
    item contains a push button for removing the object from the choice;

    - 2. a single-select control that, in combination with a push button, allows to
    add a new associated object from the range of the multi-valued reference property.


    ## 1.9 Collection Types for Multi-Valued Reference Properties


    By default, a non-functional association end associates a set of instances of
    the target class to any instance of the source class, means that the collection
    values of the corresponding multi-valued reference property are sets. There are
    also cases, where a non-functional association end is ordered and, consequently,
    the collection values of the corresponding reference property take the form of
    ordered sets.


    In the following example, the association end publishedBooks is not ordered, while
    the association end authors is ordered since the order of the authors of a book
    is meaningful. Notice that in a UML class diagram, an association end is marked
    up with the annotation {ordered}.


    ## 16 Reference Properties and Unidirectional Associations


    | Publisher | published Books | authors (ordered) | Author |

    |---|---|---|---|

    | name: String {id} | isbn: String {id} * | personId: Integer {id} | name: String
    |

    | address: String 0.1 * | title: String year: Integer | | |


    An ordered association should not represent anything based on the properties of
    the target class. In our example, this implies that the ordering of the authors
    of a book should, for example, not represent their alphabetical ordering, but
    rather it should represent information that is not available via the properties
    of Author. This is, indeed, the case, since it represents some sort of significance,
    which is not expressed by any property.


    Notice that ordered association in information design models is just a convenience,
    because an ordered association can always be transformed into an unordered one
    by adding one more attributes to the association''s target class, such that these
    attributes values can be used for ordering. Ordered association allows more concise
    information model, and more efficient implementation, by not requiring the ordering
    explicit with the help of auxiliary ordering attributes.


    The two important types of collections for multi-valued reference properties are
    sets and ordered sets, while use cases for bags (multi-sets) and sequences (ordered
    multi-sets) the collection type of a multi-valued reference property is bag (or
    sequence), this can be expressed in the class diagram with the help of the annotation
    {nonunique} (or ordered, nonunique) in the annotation of the association or property.
    Notice, that it is quite common to use lists (such as arrays or the Java interface
    type List) as the range of multi-valued properties, both for ordered and unordered.


    ## 1.10 Quiz Questions


    If you would like to look up the answers for the following quiz questions, you
    can check our discussion forum. If you don''t find an answer in the forum, you
    may create a post asking for an answer to a particular question.


    ### 1.10.1 Question 1: Meaning of “one-to-one”


    What does it mean to say that an association is “one-to-one”? It means that it
    is (select one):


    - 1. Bidirectional

    - 2. Both functional and total

    - 3. Functional

    - 4. Both functional and inverse


    ### 1.10.2 Question 2: When to Check Referential Integrity


    A referential integrity constraint for a reference property p with domain C and
    range D has to be checked whenever (select one or many):


    - 1. An object of type C is destroyed.

    - 2. The value of p is changed for some object of type C.

    - 3. A new object of type C is created.

    - 4. An object of type D is destroyed.

    - 5. A new object of type D is created.


    ### 1.10.3 Question 3: Meaning of “Functional”


    A unidirectional association is functional if and only if (select one):


    - 1. Each object of the source class is linked to at most one object of the target
