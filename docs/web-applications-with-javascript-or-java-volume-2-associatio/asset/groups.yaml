- md: "\nNotice that, since the name attribute is the standard ID attribute of Publisher,\
    \ we only check syntactic mandatory constraints in checkName, and check the mandatory\
    \ value and uniqueness constraints in checkNameAsId, which invokes checkName:\n\
    \n```\nstatic checkNameAsId(n) {\n  var validationResult = Publisher.checkName(n);\n\
    \  if ((validationResult instanceof NoConstraintViolation) {\n    if (n === undefined)\
    \ {\n      return new MandatoryValueConstraintViolation(\n        \"A publisher\
    \ name is required!\");\n    } else if (Publisher.instances[n]) {\n      validationResult\
    \ = new UniquenessConstraintViolation(\n        \"There is already a publisher\
    \ record with this name!\");\n    } else {\n      validationResult = new NoConstraintViolation();\n\
    \    }\n  }\n}\n```\n\nIf we have to deal with ID references (foreign keys) in\
    \ other classes, we need to provide a further check, called checkNameAsIdRef,\
    \ for checking the referential integrity constraint:\n\n```\nstatic checkNameAsIdRef(n)\
    \ {\n  var validationResult = Publisher.checkName(n);\n  if ((validationResult\
    \ instanceof NoConstraintViolation) &&\n    n === undefined) {\n    if (!Publisher.instances[n])\
    \ {\n      validationResult = new ReferentialIntegrityConstraintViolation(\n \
    \       \"There is no publisher record with this name!\");\n    }\n  }\n  return\
    \ validationResult;\n}\n```\n\nThe condition !Publisher.instances[n] checks if\
    \ there is no publisher object with the given name n, and then creates a validationResult\
    \ object as an instance of the exception class ReferentialIntegrityConstraintViolation.\
    \ The Book.checkNameAsIdRef is called by the Book.checkPublisher function:\n\n\
    ```\nclass Book {\n  ..\n  static checkPublisher(publisher_id) {\n    var validationResult\
    \ = null;\n    if (publisher_id === undefined || publisher_id === \"\") {\n  \
    \    validationResult = new NoConstraintViolation(); // optional\n    } else {\n\
    \      // invoke foreign key check\n      validationResult = Publisher.checkNameAsIdRef(publisher_id);\n\
    \    }\n    return validationResult;\n  }\n  ..\n}\n```\n\n## 2.5.4 Code the Property\
    \ Setters\n\nIn the setters, the corresponding check function is called and the\
    \ property is only set, if the check does not detect constraint violation. In\
    \ the case of a reference property, we allow invoking the setter with an object\
    \ reference or an ID reference. The resulting ambiguity is resolved by testing\
    \ if the argument provided in the invocation of the setter is an object or not.\
    \ For instance, the publisher setter is coded in the following way:\n\n```\nclass\
    \ Book {\n  ..\n  set publisher(p) {\n    if (!p) // unset publisher\n      delete\
    \ this._publisher;\n    } else {\n      // p can be an ID reference or an object\
    \ reference\n      const publisher_id = (typeof p==\"object\") ? p : p.name;\n\
    \      const validationResult = Book.checkPublisher(publisher_id);\n      if (validationResult\
    \ instanceof NoConstraintViolation) {\n        // create the new publisher reference\n\
    \        this._publisher = Publisher.instances[publisher_id];\n      } else {\n\
    \        throw validationResult;\n      }\n    }\n  }\n  ..\n}\n```\n\n## 2.5.5\
    \ Choose and Implement a Deletion Policy\n\nFor any reference property, we have\
    \ to choose and implement one of the two possible deletions policies discussed\
    \ in Section 1.2 for managing the corresponding object destruction dependency\
    \ in the destroy method of the property's range class. In our case, when deleting\
    \ a publisher record, we have to choose between:\n\n- 1. deleting all records\
    \ of books published by the deleted publisher (Existential Dependency);\n- 2.\
    \ dropping from all books published by the deleted publisher reference to the\
    \ deleted publisher (Existential Independence).\n\nAssuming books do not existentially\
    \ depend on their publishers, we choose the second option. This is shown in the\
    \ following code of the Publisher.destroy method where for all concerned book\
    \ objects the property book.publisher is cleared:\n\nNote that the deletion of\
    \ all references to the deleted publisher is performed in a sequential scan through\
    \ all book objects, which may be inefficient when there are many of them. It would\
    \ be much more efficient when each publisher object would hold a list of references\
    \ to all books published by this publisher. Creating and maintaining a list would\
    \ make the association between books and their publisher bidirectional.\n\n##\
    \ 2.5.6 Serialization and Object-to-Storage Mapping\n\nIn the case of a reference\
    \ property, Book::publisher, the serialization function Book::toString() has to\
    \ show a human-readable identifier of the referred object, like this publisher.name:\n\
    \n```\ntoString() {\n  var bookStr = `Book: ISBN: ${this.isbn}, title: ${this.title},`\
    \ +\n  `year: ${this.year}`;\n  if (this.publisher) bookStr += `, publisher: ${this.publisher.name}`;\n\
    \  return bookStr + \";\";\n}\n```\n\nThe object-to-storage conversion function\
    \ Book::toRecord() converts typed objects with object references (untyped) record\
    \ objects with ID references:\n\n```\ntoRecord() {\n  var rec = {};\n  for (let\
    \ p of Object.keys(this)) {\n    // copy only property slots with underscore prefix\n\
    \    if (p.charAt(0) === \"_\") {\n      switch (p) {\n        case \"_publisher\"\
    :\n          // convert object reference to ID reference\n          if (this._publisher)\
    \ rec.publisher_id = this._publisher.name;\n          break;\n        default:\n\
    \          // removing underscore prefix\n          rec[p.substr(1)] = this[p];\n\
    \      }\n    }\n  }\n  return rec;\n}\n```\n\nThe inverse conversion, from untyped\
    \ objects with ID references to typed objects with object references, is performed\
    \ by the Book constructor, which tolerates both ID and object references as arguments.\n\
    \n## 2.6 Code the View\n\nThe user interface (UI) consists of start page that\
    \ allows navigating to data management pages (in our example, books.html and publishers.html).\
    \ Each of these data management UI contains sections: Retrieve books, Create book,\
    \ Update book and Delete book, such that only one of them is displayed at any\
    \ time (by setting the CSS property display:none for others).\n\n### 2.6.1 Initialize\
    \ the App\n\nFor initializing book data the required data (for instance, publisher\
    \ and book records) have to be loaded from persistent storage. This is performed\
    \ in controller as c/books.js with the following code:\n\n```javascript\npl.c.books.manage\
    \ = {\n  initialize: function () {\n    Publisher.retrieveAll();\n    Book.retrieveAll();\n\
    \    pl.v.books.manage.setUserInterface();\n  }\n};\n```\n\nThe initialize method\
    \ for managing book first loads the publishers table.\n\n### 2.6.2 Showing Associated\
    \ Objects in Retrieve All\n\nIn our example, we have one reference property, Book::publisher,\
    \ which is functional and optional. For showing information about the optional\
    \ publisher of a book in the Retrieve/list all use case, the corresponding cell\
    \ in the HTML table is filled with the name of the publisher, if there is any:\n\
    \n```javascript\npl.v.books.retrieveAndAll = {\n  setupUserInterface: function\
    \ () {\n    const tableBodyEl = document.querySelector(\"#section-Book table tbody\"\
    );\n    tableBodyEl.innerHTML = \"\"; // drop old contents\n    for (let key of\
    \ Object.keys(Book.instances)) {\n      const book = Book.instances[key];\n  \
    \    const row = tableBodyEl.insertRow(-1);\n      row.insertCell(0).textContent\
    \ = book.isbn;\n      row.insertCell(1).textContent = book.title;\n      row.insertCell(2).textContent\
    \ = book.year;\n      // if the book has a publisher, show its name\n      row.insertCell(3).textContent\
    \ =\n        book.publisher ? book.publisher.name : \"\";\n    }\n  }\n  document.getElementById(\"\
    Book-M\").style.display = \"none\";\n  document.getElementById(\"Book-R\").style.display\
    \ = \"block\";\n};\n```\n\nFor a multi-valued reference property, the table cell\
    \ would have to be filled with a list of all associated objects referenced by\
    \ the property.\n\n### 2.6.3 Selecting Associated Objects in the Create and Update\
    \ Cases\n\nFor allowing select objects to be associated with the currently edited\
    \ object from the Create and Update use cases, an HTML selection list (i.e., a\
    \ select element) is populated with option elements formed from the instances\
    \ of the associated object type with the help of a utility method fillSelectWithOptions.\
    \ The HTML element is defined in the books.html view file:\n\n```html\n<section\
    \ id=\"Book-C\" class=\"UI-Page\">\n<h1>Public Library: Create a new book record</h1>\n\
    <form> ...\n  <div class=\"select-one\">\n    <label>Publisher: <select name=\"\
    selectPublisher\"></select></label>\n  </div>\n  ...\n</form>\n</section>\n```\n"
  mdcn: "\n注意，由于 `name` 属性是 `Publisher` 的标准 ID 属性，我们只在 `checkName` 中检查语法强制性约束，并在 `checkNameAsId`\
    \ 中检查强制性值和唯一性约束，后者会调用 `checkName`：\n\n```\nstatic checkNameAsId(n) {\n  var validationResult\
    \ = Publisher.checkName(n);\n  if ((validationResult instanceof NoConstraintViolation)\
    \ {\n    if (n === undefined) {\n      return new MandatoryValueConstraintViolation(\n\
    \        \"A publisher name is required!\");\n    } else if (Publisher.instances[n])\
    \ {\n      validationResult = new UniquenessConstraintViolation(\n        \"There\
    \ is already a publisher record with this name!\");\n    } else {\n      validationResult\
    \ = new NoConstraintViolation();\n    }\n  }\n}\n```\n\n如果我们必须处理其他类中的 ID 引用（外键），我们需要提供进一步的检查，称为\
    \ `checkNameAsIdRef`，用于检查引用完整性约束：\n\n```\nstatic checkNameAsIdRef(n) {\n  var\
    \ validationResult = Publisher.checkName(n);\n  if ((validationResult instanceof\
    \ NoConstraintViolation) &&\n    n === undefined) {\n    if (!Publisher.instances[n])\
    \ {\n      validationResult = new ReferentialIntegrityConstraintViolation(\n \
    \       \"There is no publisher record with this name!\");\n    }\n  }\n  return\
    \ validationResult;\n}\n```\n\n条件 `!Publisher.instances[n]` 检查是否存在具有给定名称 `n` 的出版社对象，然后创建一个作为\
    \ `ReferentialIntegrityConstraintViolation` 异常类实例的 `validationResult` 对象。`Book.checkNameAsIdRef`\
    \ 由 `Book.checkPublisher` 函数调用：\n\n```\nclass Book {\n  ..\n  static checkPublisher(publisher_id)\
    \ {\n    var validationResult = null;\n    if (publisher_id === undefined || publisher_id\
    \ === \"\") {\n      validationResult = new NoConstraintViolation(); // 可选\n \
    \   } else {\n      // 调用外键检查\n      validationResult = Publisher.checkNameAsIdRef(publisher_id);\n\
    \    }\n    return validationResult;\n  }\n  ..\n}\n```\n\n## 2.5.4 编写属性设置器 (Setters)\n\
    \n在设置器中，会调用相应的检查函数，只有当检查没有检测到约束违反时，才会设置属性。对于引用属性，我们允许使用对象引用或 ID 引用调用设置器。产生的歧义通过测试在设置器调用中提供的参数是否为对象来解决。例如，出版社的设置器代码如下：\n\
    \n```\nclass Book {\n  ..\n  set publisher(p) {\n    if (!p) // 取消设置出版社\n    \
    \  delete this._publisher;\n    } else {\n      // p 可以是 ID 引用或对象引用\n      const\
    \ publisher_id = (typeof p==\"object\") ? p : p.name;\n      const validationResult\
    \ = Book.checkPublisher(publisher_id);\n      if (validationResult instanceof\
    \ NoConstraintViolation) {\n        // 创建新的出版社引用\n        this._publisher = Publisher.instances[publisher_id];\n\
    \      } else {\n        throw validationResult;\n      }\n    }\n  }\n  ..\n\
    }\n```\n\n## 2.5.5 选择并实现删除策略\n\n对于任何引用属性，我们必须在第 1.2 节中讨论的两种删除策略中进行选择并实现，并在属性范围类的\
    \ `destroy` 方法中管理相应的对象销毁依赖。在我们的情况下，删除出版社记录时，我们必须在以下之间选择：\n\n- 1. 删除所有由被删除出版社出版的书（生存依赖）；\n\
    - 2. 从所有由被删除出版社出版的书中删除对该出版社的引用（生存独立）。\n\n假设书籍并不生存上依赖其出版社，我们选择第二种方案。在以下 `Publisher.destroy`\
    \ 方法的代码中显示，对于所有相关的书籍对象，属性 `book.publisher` 将被清空：\n\n注意，对被删除出版社引用的删除是通过扫描所有书籍对象执行的，当有很多书籍时，这种方法效率很低。维护书籍列表会更有效，建立书籍与出版社之间的双向关系。\n\
    \n## 2.5.6 序列化与对象到对象的映射\n\n对于引用属性 `Book::publisher`，序列化函数 `toString()` 需要显示引用对象的可读标识符，如出版社的名称：\n\
    \n```\ntoString() {\n  var bookStr = `ISBN: ${this.isbn}, title: ${this.title},`\
    \ +\n  `year: ${this.year};`;\n  if (this.publisher) bookStr += `, publisher:\
    \ ${this.publisher.name}`;\n  return bookStr;\n}\n```\n\n对象到存储转换函数 `toRecord()`\
    \ 将带下划线的无类型对象转换为 ID 引用：\n\n```\ntoRecord() {\n  var rec = {};\n  for (let p of\
    \ Object.keys(this)) {\n    // 仅处理带下划线的属性\n    if (p.charAt(0) === \"_\") {\n\
    \      switch (p) {\n        case \"_publisher\":\n          // 将出版社转换为 ID 引用\n\
    \          if (this._publisher) rec.publisher_id = this._publisher.name;\n   \
    \       break;\n        default:\n          // 移除下划线\n          rec[p.substr(1)]\
    \ = this[p];\n      }\n    }\n  }\n  return rec;\n}\n```\n\n用户界面 (UI) 由允许导航到数据管理页面的页面组成（在示例中为\
    \ `books.html` 和 `publishers.html`）。这些数据管理 UI 包含以下部分：\n\n### 2.6.1 初始化应用\n\n初始化书籍数据（例如出版社和书籍记录）必须从持久化存储中加载。这是在控制器\
    \ `c/books.js` 中执行的：\n\n```javascript\npl.c.books.manage = {\n  initialize: function\
    \ () {\n    Publisher.retrieveAll();\n    Book.retrieveAll();\n    pl.v.books.manage.setUserInterface();\n\
    \  }\n};\n```\n\n初始化方法首先加载出版社。\n\n### 2.6.2 在列表中显示关联对象\n\n在示例中，我们有一个引用属性 `Book::publisher`，它是可选的。为了在列所有用例中显示书籍的可选出版社信息，HTML\
    \ 表格中对应的单元格将填充出版社名称：\n\n```javascript\npl.v.books.retrieveAndAll = {\n  setupUserInterface:\
    \ function () {\n    const tableBodyEl = document.querySelector(\"#section-Book\
    \ table tbody\");\n    tableBodyEl.innerHTML = \"\"; // 清空旧内容\n    for (let key\
    \ of Object.keys(Book.instances)) {\n      const book = Book.instances[key];\n\
    \      const row = tableBodyEl.insertRow(-1);\n      row.insertCell(0).textContent\
    \ = book.isbn;\n      row.insertCell(1).textContent = book.title;\n      row.insertCell(2).textContent\
    \ = book.year;\n      // 如果书籍有出版社，显示其名称\n      row.insertCell(3).textContent =\n\
    \        book.publisher ? book.publisher.name : \"\";\n    }\n  }\n  document.getElementById(\"\
    Book-M\").style.display = \"none\";\n  document.getElementById(\"Book-R\").style.display\
    \ = \"block\";\n};\n```\n\n对于多值引用属性，表格单元格必须填充所有被该属性引用的关联对象列表。\n\n### 2.6.3 在创建和更新用例中选择关联对象\n\
    \n为了在创建和更新用例中允许为当前编辑的对象关联关联对象，HTML 选择列表（即 `select` 元素）将通过工具方法 `fillSelectWithOptions`\
    \ 从关联对象的实例进行填充。该 HTML 元素在 `books.html` 视图文件中定义：\n\n```html\n<section id=\"Book-C\"\
    \ class=\"UI-Page\">\n<h1>Public Library: Create a new book record</h1>\n<form>\
    \ ...\n  <div class=\"select-one\">\n    <label>Publisher: <select name=\"selectPublisher\"\
    ></select></label>\n  </div>\n  ...\n</form>\n</section>\n```\n"
