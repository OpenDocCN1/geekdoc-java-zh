    \ Publisher): ConstraintViolation |\n| | toString(): String |\n| | toRecord():\
    \ Object |\n\n我们必须对 `Publisher` 类执行类似的转换。这为我们提供了从上述 OO 类模型推导出的完整 JS 类模型，如图 2.1\
