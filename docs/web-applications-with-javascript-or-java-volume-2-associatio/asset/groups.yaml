    \ reference properties representing unidirectional non-functional associations,\n\
    2. how to code the JS class model in the form of JavaScript model classes,\n3.\
    \ how to write the view and controller code based on the model code.\n\n# ## 3.1\
    \ Implementing Multi-Valued Reference Properties\n\nA multi-valued reference property,\
    \ such as the property ::authors, allows a collection of references to objects\
    \ of some type, such as Author objects. When creating a new object of type Book,\
    \ the constructor function needs to have a parameter for providing a suitable\
    \ value for this property. We can allow this value to be either a collection of\
    \ internal object references or of ID references, as shown in the following example:\n\
    \n```\nclass Book {\n  constructor({isbn, title, year, authors, authorIdRefs,\n\
    \    publisher, publisher_id}) {\n    this.isbn = isbn;\n    this.title = title;\n\
    \    this.year = year;\n    // assign object reference or ID reference\n    this.authors\
    \ = authors || authorIdRefs;\n    if (publisher || publisher_id) this.publisher\
    \ = publisher || publisher_id;\n  }\n}\n```\n\nNotice that the constructor's parameter\
    \ record is expected to contain either authors or an authorIdRefs slot. The JavaScript\
    \ expression authors || authorIdRefs, using the disjunction operator ||, evaluates\
    \ to a map authors, if there is a slot with name authors, or to an array authorIdRefs,\
    \ otherwise. We handle the resulting"
