    \n最后，启动你的 Tomcat Web 服务器（Windows 使用 `bin/startup.bat` 或 Linux 使用 `bin/startup.sh`）。请耐心等待，这取决于计算机的速度，可能需要一些时间。当控制台显示消息：`INFO:\
    \ Initializing Mojarra [此处显示某些库的版本和路径] for context \"webappapp\"` 时，即表示就绪。最后，打开以下类型的浏览器：\n\
    \n`http://localhost:8080/UnidirectionalApp/WebContent/views/app.xhtml`\n\n## 5.7\
    \ 集合与有序集合作为属性值\n\n回想，集合是无序且元素唯一的集合，而列表是可以包含重复元素的有序集合。\n\n当非功能关联端是有序的，例如 `Book::authors`，如图\
    \ 5.1 所示，这意味着相应属性的范围需要是一个有序类型，例如 Java 接口 `SortedSet` 和 `List`。\n\n| Book | authored\
    \ | Author |\n| --- | --- | --- |\n| isbn : String | | personId[1]: Integer, name[1]:\
    \ String |\n| title : String | | |\n| year : Integer | (ordered) | |\n\n图 5.1：集合属性\
    \ authored 和有序集合属性 authors。\n\n在理论上，集合属性应使用 `Set<T>` 定义，例如将 `Set<Book>` 作为 `authored`\
    \ 的范围；而有序集合属性应使用 `SortedSet<T>` 定义，例如将 `SortedSet<Author>` 作为 `authors` 的范围。Java\
    \ 接口通常由 `HashSet` 实现，而 `SortedSet` 通常由 `TreeSet` 实现。\n\n然而如果不担心避免重复元素，集合属性和有序集合属性都可以使用泛型接口类型\
    \ `List<T>` 定义其范围，该类型通常由 `ArrayList` 实现。\n\n当主要的用例是向集合添加元素并在随后遍历时，最佳选择是使用 `ArrayList`\
    \ 实现的 `List`，它比 `LinkedList` 或任何 `Set` 的实现都节省内存，且插入、迭代和随机访问速度快。`HashSet` 仅在查找元素的用例中具有性能优势。\n\
    \n## 6 单向关联练习项目\n\n所有项目包含以下任务：\n\n- 1. 根据给定的设计模型构建类模型。提示：将关联替换为相应的属性。\n- 2. 根据类模型构建\
    \ JavaScript 模型或 Java 实体模型。提示：添加检查方法。\n- 3. 按照提供的指南编写你的 JS 模型或 Java 实体模型。\n\n\
    确保你的页面符合 HTML5 的 XML 语法，并且你的 JavaScript 代码符合编码规范并经过 (JHint) 检查。\n\n### 6.1 为电影分配导演和演员\n\
    \n此项目基于下方的信息设计模型。需要扩展之前的作业应用，增加管理电影导演和演员数据的功能。这通过添加一个 `Person` 模型类以及 `Movie` 与\
    \ `Person` 之间的两个单向关联来实现：\n\n- 1. 多对一关联，分配恰好一个个人作为电影导演；\n- 2. 多对多关联，分配零或多个个人作为电影演员。"
