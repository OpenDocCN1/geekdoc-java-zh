    \    document.getElementById(\"Publisher-M\").style.display = \"none\";\n    document.getElementById(\"\
    Publisher-R\").style.display = \"block\";\n  }\n};\n```\n\n## 9 使用 Java 实现双向关联\n\
    \n在本章中，我们将展示：\n\n- 1. 如何从面向对象模型推导出 Java 实体类（代表了实体类模型），\n- 2. 如何在实体类实现双向关联，\n-\
    \ 3. 如何根据实体类编写控制器代码。\n\n## 9.1 制作 Java 实体类模型\n\n制作 Java 实体类的起点是具有派生属性的 OO 模型，如图\
