    \ id=\"createForm\">\n<h:panelGrid columns=\"3\">\n<h:outputLabel for=\"authors\"\
    \ value=\"Authors\"/>\n<h:selectManybox id=\"authors\" value=\"#{book.authors}\"\
    \ var=\"a\">\n  <f:item label=\"#{a.name}\" itemValue=\"#{a}\" />\n  <f:converter\
    \ id=\"AuthorConverter\"/>\n</h:selectManybox>\n<h:message for=\"authors\" errorClass=\"\
