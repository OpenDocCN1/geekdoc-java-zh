    \ | | |\n| toString() | | |\n| tRecord() : Object | | |\n\n## 8.2 Write the Model\
    \ Code\n\nThe JS class model can be directly coded for getting the code of the\
    \ model layer of our JavaScript frontend.\n\n### 8.2.1 New Issues\n\nCompared\
    \ to the unidirectional association app, we have to deal with a number of new\
    \ technical issues:\n\n- 1. We define the derived inverse reference properties,\
    \ like Publisher:/publishedBooks, without a check operation and without a set\
    \ operation.\n- 2. We also have to take care of maintaining the derived inverse\
    \ reference properties by maintaining the derived (sets) of inverse reference\
    \ properties that form the collection value of a derived inverse reference property.\
    \ This requires in particular that whenever the value of a single-valued reference\
    \ property is initialized or updated with the help of a setter (such as assigning\
    \ a reference to a Publisher instance p to b for a Book instance), an inverse\
    \ reference has to be assigned or added to the corresponding value of the derived\
    \ inverse reference property (such as adding b to p.publishedBooks); when the\
    \ value of the master reference property is updated and the derived property is\
    \ multi-valued, then the obsolete inverse reference to the previous value of the\
    \ single-valued master reference property has to be deleted;\n- 5. whenever the\
    \ value of an optional single-valued master reference property is unset (e.g.,\
    \ by assigning null to b.publisher for a Book instance b), the inverse reference\
    \ has to be removed from the corresponding value of the derived inverse reference\
    \ property (such as removing b from p.publishedBooks), if the derived inverse\
    \ reference property is multi-valued, otherwise the corresponding value of the\
    \ derived inverse reference property has to be unset or updated;\n- 3. whenever\
    \ a reference is added to a multi-valued master reference property with the help\
    \ of a method (such as adding an Author to b. for Book instance b), an inverse\
    \ reference has to be assigned or added to the corresponding value of the derived\
    \ inverse reference property (such as adding b to a.authoredBooks);\n- 4. whenever\
    \ a reference is removed from a multi-valued master reference property with the\
    \ help of a remove method (such as removing a reference to an instance a for Book\
    \ instance b), the inverse reference has to be removed from the corresponding\
    \ value of the derived inverse reference property (such as removing b from p.publishedBooks),\
    \ if the derived inverse reference property is multi-valued, otherwise the corresponding\
    \ value of the derived inverse reference property has to be unset or updated;\n\
    \n## 8.2.2 Coding Summary\n\nCode each class as ES2015 class with implicit getters\
    \ and setters (or, alternatively, as ES5 constructor function with explicit setters):\n\
    \n- 1. Code the property checks in the form of class-level ('static') methods.\n\
    - 2. For each single-valued property, code the specified getter and setter:\n\
    \    - 1. In each setter, the corresponding property check is invoked and the\
    \ property is only set/unset, if the check does not detect any violation.\n  \
    \  - 2. If the concerned property is the inverse of a derived property (representing\
    \ a bidirectional association), make sure that the multi-valued property, code\
    \ its add and remove operations, as well as the specified get/set operations:\n\
    \    - 1. Code the add/remove operations as (instance-level) methods that invoke\
    \ the corresponding property checks.\n    - 2. Code the setter such that it invokes\
    \ the add operation for each item of the collection to be assigned.\n    - 3.\
    \ If the concerned property is the inverse of a derived property (representing\
    \ a bidirectional association), make sure that the add/remove methods also assign/unset\
    \ (or add/remove) the corresponding inverse reference to/from (the collection\
    \ value) of the inverse property.\n- 4. Write the code of the serialization function\
