    \ : String |\n| a3[0..1] : String |\n\n# 13 Subtyping with Plain JS\n\nIn this\
    \ chapter, we first explain the general approach to constructor-based subtyping\
    \ in JavaScript before presenting two case studies based on fragments of the information\
    \ model of our running example, the Public Library app, has shown above.\n\nIn\
    \ the first case study, we consider the single-level class hierarchy with root\
    \ Book shown in Figure 12.1, as an incomplete disjoint rigid segmentation. We\
    \ use the Class Hierarchy Merge design pattern for re-factoring this simple hierarchy\
    \ to a single class that can be mapped to a persistent database table.\n\nIn the\
    \ second case study, we consider the multi-level class hierarchy consisting of\
    \ the Person roles Employee, Manager and Author, shown in Figure 12.8. The segmentation\
    \ of Person into Employee and Author does not have any constraints, which means\
    \ it is complete, overlapping (non-disjoint). We use the Class Hierarchy Merge\
    \ design pattern for re-factoring the simple Manager-is-Employee sub-hierarchy,\
    \ and Joined Inheritance approach for mapping the Employee-and-Author-is-a-Person\
    \ hierarchy to a set of three tables that are related with each other via key\
    \ dependencies. In both case studies we show\n\n1. how to derive a JS class model,\
    \ and a corresponding entity table, from the information design model,\n2. how\
    \ to code the JS class in form of model classes,\n3. how to write controller code\
    \ based on the model.\n\n## 13.1 Subtyping with Constructor-Based Classes\n\n\
    Before version ES2015, JavaScript did not have an explicit class concept and subtyping\
    \ was not directly supported, it had to be implemented with the help of certain\
    \ patterns providing two inheritance mechanisms: (1) inheritance of properties\
    \ and (2) inheritance of methods. As we explained in Chapter 1 of Volume 1, classes\
    \ can be defined in two alternative ways: constructor-based and factory-based.\
    \ Both approaches have their own way of implementing inheritance. We summarize\
    \ the ES2015 code for defining a superclass and a subclass in a constructor-based\
    \ single-inheritance hierarchy with the help of the following example:\n\n| Person\
    \ |\n|---|\n| firstName : String |\n| lastName |\n\n| Student |\n|---|\n| studNo\
    \ : Integer |\n\nFirst, we define a base class, Person, with two properties, firstName\
    \ and lastName, defined with getters and setters:\n\n```javascript\nclass Person\
    \ {\n    constructor ({first, last}) {\n        // assign properties by invoking\
    \ setters\n        this.firstName = first;\n        this.lastName = last;\n  \
    \  }\n\n    getFirstName () {return this._firstName};\n    setFirstName (f) {\n\
    \        // ... check constraints\n        this._firstName = f;\n    }\n\n   \
    \ getLastName () {return this._lastName};\n    setLastName (l) {\n        // ...\
    \ check constraints\n        this._lastName = l;\n    }\n}\n```\n\nThen, we define\
    \ a subclass, Student, with one additional property, studNo:\n\n```javascript\n\
    class Student extends Person {\n    constructor ({first, last, studNo}) {\n  \
    \      // invoke constructor of superclass\n        super(first, last);\n    \
    \    // assign additional properties\n        this.studNo = studNo;\n    }\n\n\
    \    get studNo () {return this._studNo;}\n    set studNo (sn) {\n      // check\
    \ constraints\n      this._studNo = sn;\n    }\n}\n```\n\nNotice how the constructor\
    \ of the superclass is invoked: super(first, last).\n\n## 13.2 Case Study 1: Eliminating\
    \ a Class Hierarchy\n\nSimple class hierarchies can be eliminated by applying\
    \ the Class Hierarchy Merge design pattern. The starting point for our case study\
    \ is the simple class hierarchy shown in the information design model of Figure\
    \ 12.1, representing a disjoint (but incomplete) rigid segmentation of Book into\
    \ TextBook and Biography. This model is first simplified by applying Class Hierarchy\
    \ Merge pattern, resulting in the following model:\n\n| isbn[1]: String (id) |\
    \ <<enumeration> | own|---|---|\n| title[1]: String | BookTypeEL |\n| year[1]:\
    \ Integer | TextBook | own| category[0..1]: BookTypeEL (frozen) | Biography |\n\
    | subjectArea[0..1]: String | |\n| about[0..1]: String | |\n\n> invariant ((category=\"\
    TextBook\" NOT subjectArea=undefined) AND (category=\"Biography\" NOT about=undefined))\n\
    \nWe now derive a JS class model from this design model.\n\n### 13.2.1 Make the\
    \ JS Class Model\n\nWe make the JS class model in 3 steps:\n\n- Replace the platform-independent\
    \ datatypes (used as the ranges of attributes and parameters) with JS datatypes.\
    \ This includes the case of enumeration-valued attributes, such as category, which\
    \ are turned into number-valued attributes restricted to the enumeration integers\
    \ of the underlying enumeration type.\n- Decorate all properties with a «get/set»\
    \ stereotype indicating that they have implicit getters and setters.\n- Add property\
    \ check functions, as described in Chapter 8 of Volume 1. The checkCategory function,\
    \ as well as the checks of the segment properties need special consideration according\
    \ to their implied semantics. In particular, a segment property check function\
    \ must ensure that the property can only be assigned if the category attribute\
    \ has a value representing the corresponding segment. We explain this validation\
    \ semantics in more detail below when we discuss how the JS class model is coded.\n\
    \nThis leads to the JS class model shown in 13.1, where the class-level ('static')\
    \ methods are underlined:\n\n| Book | «enumeration» |\n|---|---|\n| «get/set»\
    \ isbn: string | BookCategoryEL |\n| «get/set» title: string | TEXTBOOK |\n| «get/set»\
    \ year[1]: number | BIOGRAPHY |\n| «get/set» category[0..1]: number (from BookCategory,\
    \ frozen) | |\n| «get/set» subjectArea[0..1]: string | |\n| checkIsbn(isbn: string,\
    \ string): ConstraintViolation |\n| checkIsbn(isbn: string): string: ConstraintViolation\
    \ |\n| checkTitle(title: string): ConstraintViolation |\n| checkYear(year: number):\
    \ ConstraintViolation |\n| checkCategory(in type: number): ConstraintViolation\
    \ |\n| checkSubjectArea(in subjectArea: string): ConstraintViolation |\n| checkAbout(in\
    \ about: string): ConstraintViolation |\n\n**Figure 13.1:** The JS class model\
    \ of the merged class hierarchy.\n\n### 13.2.2 New Issues\n\nCompared to the enumeration\
    \ discussed in Chapter 11 of Volume 1, we have to deal with a number of new issues:\n\
    \n1. In the model code we have to take care of\n   1. Adding the constraint violation\
    \ class FrozenValueConstraintViolation.js.\n   2. Coding the enumeration used\
    \ to be as the range of the category attribute BookCategoryEL in our example.\n\
    \   3. Coding the checkCategory function for the category attribute. In our example\
    \ this attribute is *optional*, due to the fact that the Book segmentation is\
    \ incomplete. If the segmentation, to which the Class Hierarchy Merge pattern\
    \ is applied, is complete, then the category attribute is *mandatory.*\n"
