    | name : String | chairedCommittee[0..1] : Committee (inverse of chair) |

    | chair : ClubMember (inverse of chairedCommittee) | coChairedCommittee[0..1]
    : Committee |


    Using the reference path notation of OOP languages, with c referencing a Committee
    object, we obtain the equation:


    c.chair.chairedCommittee = c


    Or, the other way, with m referencing a ClubMember object, we obtain the equation:


    m.chairedCommittee.chair = m


    Notice when the property $p_2$ is the inverse of a property $p_1$, this implies,
    that the other way, $p_1$ is the inverse of $p_2$. Therefore, we declare the property
    ClubMember::chairedCommittee to be the inverse of Committee::chair, then, implicitly,
    Committee::chair is the inverse of ClubMember::chairedCommittee. We therefore
    call Committee::chair and ClubMember::chairedCommittee a pair of **mutually inverse
    reference properties**. Having such a pair in a model implies *redundancy* because
    each of the two reference properties can be derived from the other by inversion.
    This type of redundancy implies *data storage overhead* and *update-overhead*,
    which is the price to pay for the bidirectional navigability that supports efficient
    object access in both directions.


    For maintaining the duplicate information of a mutually inverse reference pair,
    it is common to treat one of the inverse properties as the *master*, and the other
    as the *slave*, and take this distinction into consideration in the code of the
    methods (such as the property setters) of the affected model classes. We indicate
    the slave of an inverse reference property pair in a model diagram by declaring
    the slave property to be a *derived* property using the UML notation of a slash
    (/) as a prefix of the property name as shown in the diagram:


    | Committee | ClubMember |

    |--- |--- |

    | name : String | chairedCommittee[0..1] : Committee (inverse of chair) |

    | chair : ClubMember | coChairedCommittee[0..1] : Committee |


    The property chairedCommittee in ClubMember is now *derived* (as indicated by
    its slash prefix). Its annotation {inverse of chair} defines a *derivation rule*
    according to which it is derived by inverting the property Committee::chair.'
  - '[PAGE 100]


    # 7.1 Inverse Reference Properties — 85


    In a UML class diagram, the derivation of a property can be specified by an OCL
    derive that evaluates the value of the derived property for a given object. In
    the case of a property being the inverse of another property, specified by the
    constraint expression (inverse of anotherProperty) appended to the property declaration,
    the derivation expression is implied. In our example, for any club member m, it
    evaluates the committee object c such that c.chair = m. In OCL, this derivation
    would be executed like object


    ```

    context ClubMember::chairedCommittee: Committee

    drive:

    if Committee.allInstances().exists(c | c.chair = self) then c

    ```


    There are two ways to realize the derivation of a property: it may be derived
    via a read-time computation of value, or it may be derived on update via an update-time
    computation performed whenever one of the variables in the derivation expression
    (typically, another property) changes its value. The latter corresponds to a materialized
    view in a database. While a reference property that is derived on read may not
    guarantee efficient navigation, because the on-read computation may create unacceptable
    latencies, a reference property that is derived on update does provide efficient
    navigation.


    In the case of a derived reference property, we have to deal with life-cycle dependencies
    between the affected model classes requiring special change management mechanisms
    based on the functionality of the represented association (either one-to-one,
    many-to-one or many-to-many).


    +   In our example of the derived inverse reference property ClubMember::chairedCommittee,
    which is single-valued and optional, this means that

    1. whenever a new committee object is created (with a mandatory chair assignment),
    the corresponding ClubMember::chairedCommittee property has to be assigned accordingly;

    2. whenever the chair property is updated (that is, a new chair is assigned to
    a committee), the corresponding ClubMember::chairedCommittee property has to be
    unset for the club member who was the previous chair and set for the one being
    the new chair;

    3. whenever a committee object is destroyed, the corresponding ClubMember::chairedCommittee
    property has to be unset.'
- md: '

    ## 8.7 Bidirectional Associations


    In the case of a derived inverse reference property that is multi-valued while
    its inverse property is single-valued (like Publisher::publishedBooks in Figure
    7.4 below being derived from Book::publisher), the life cycle dependencies imply
    that:


    - 1. whenever a ''base object'' (such as a book) is created, the corresponding
    inverse property has to be updated by adding a reference to the new base object
    to its value set (like adding a reference to the new object to Publisher::publishedBooks);

    - 2. whenever the base property is updated (e.g., a new publisher is assigned
    to a book), the corresponding inverse property (in our example, Publisher::publishedBooks)
    has to be updated as well by removing the old object reference from its value
    set and adding the new one;

    - 3. whenever a base object (such as a book) is destroyed, the corresponding inverse
    property has to be updated by removing the base object from its value set (like
    removing a reference to the object from Publisher::publishedBooks).


    Notice that from a purely computational view, we are free to choose either of
    the two inverse reference properties (like Book::authors and Author::authoredBooks)
    to be the master. However, in many cases, associations represent asymmetrical
    dependencies that dictate which of the two inverse reference properties is the
    master. For instance, the association between the classes Book and Author represents
    an ontological dependency of books on their authors, while an author does not
    existentially depend on any books. Consequently, the bidirectional association
    is maintained by maintaining Book::authors as master property, while Author::authoredBooks
    is the slave property, which is derived from Book::authors.


    ## 7.2 Making an OO Class Model


    Since classical programming languages do not support explicit associations as
    first-class citizens, but only with reference properties representing implicit
    associations, we have to eliminate all explicit associations obtaining an OO class
    model.


    ### 7.2.1 The Basic Property


    The starting point of our elimination procedure is a design model with various
    kinds of unidirectional and bidirectional associations, such as the model shown
    in Figure 7.1 which still contains non-directed associations; we first have to
    turn them into directed by making a decision on the ownership of their ends, which
    is typically based on navigability requirements. Notice that both associations
    in the Publisher-Book-Author design model, publisher-publishedBooks and authored-authors,
    are bidirectional as indicated by ownership at ends. For eliminating all explicit
    associations from the design model, we have to perform the following steps:


    - 1. Eliminate unidirectional associations, connecting a source with a target
    class, by replacing them with a reference property in the source such that the
    target class is its range.

    - 2. Eliminate bidirectional associations by replacing them with a pair of inverse
    reference properties.


    ### 7.2.2 How to Eliminate Unidirectional Associations


    A unidirectional association connecting a source with a target class is replaced
    with a reference property in the source having the target class as its range.
    Its multiplicity is the same as the multiplicity of the target end. Its name is
    the name of the association end if there is any, otherwise it is set to the name
    of the target class (possibly pluralized if the reference property is multi-valued).


    ### 7.2.3 How to Eliminate Bidirectional Associations


    A bidirectional association between the classes Book and Author in the model shown
    in Figure 7.1 above is replaced with a pair of inverse reference properties, as
    Book::authors and Author::authoredBooks. Since both reference properties represent
    the same information (the same set of relationships), there is an option to consider
    one of them the "master" and the other "slave", which is derived from the master
    property.


    - 1. In the case of a bidirectional one-to-one association, this leads to a pair
    of inverse single-valued reference properties in each of the two associated classes.
    In one of the classes, one has to choose which of them is considered the master
    property such that the other is the slave property. In the class, the slave property
    is designated as a *derived property* that is automatically updated whenever 1)
    a new master object is created, 2) the master reference property is updated, or
    3) a master object is destroyed. This transformation is illustrated in Figure
    7.2.


    | Committee | chairedCommittee | ClubMember |

    | :--- | :--- | :--- |

    | name : String | 0..1 | 1 |


    ![img/1a8b608b42ede8e4d7e1a97445ae019_1330.png)


    **Figure 7.2:** Turn a bidirectional one-to-one association into a master-slave
    pair of mutually inverse single-valued reference properties.


    | Committee | ClubMember |

    | :--- | :--- |

    | name : String | chairedCommittee[0..1] : Committee (inverse of chair) |

    | | ClubMember |


    - 2. A bidirectional many-to-many association is mapped to a pair of mutually
    inverse multi-valued reference properties in each of the two classes participating
    in the association. Again, in one of the classes, the multi-valued reference property
    representing the (inverse) association is designated as a *derived property* that
    is automatically updated whenever the corresponding property in the other class
    (where the association is maintained) is updated. The transformation is illustrated
    in Figure 7.3.


    | Book | Author |

    | :--- | :--- |

    | isbn : String (id) | personid : Integer (id) |

    | title : String | name : String |


    ![img/1a8b608b42ede8e4d7e1a97445ae019_1331.png)


    | Book | Author |

    | :--- | :--- |

    | isbn[1] : String (id) | personID[1] : Integer (id) |

    | title[1] : String | name[1] : String |

    | authors[*] : Author | authoredBooks[*] : Book (inverse of chair) |


    **Figure 7.3:** Turn a bidirectional many-to-many association into a master-slave
    pair of mutually inverse multi-valued reference properties.


    ### 7.2.4 The Resulting OO Class Model


    After replacing both bidirectional associations with reference properties, we
    obtain the OO class model shown in 7.4.


    | Book | Publisher |

    | :--- | :--- |

    | isbn[1]: String (id) | name[1]: String |

    | title[1]: String | publishedBooks[*]: Book (inverse of publisher) |

    | year[1]: Integer | Author |

    | publisher[0..1]: Publisher | personId[1]: Integer (id) |

    | authors[*]: Author | name[1]: String |

    | | authoredBooks[*]: Book (inverse of authors) |


    Figure 7.4: The OO class model with two pairs of mutually inverse reference properties.


    Since books are entities that essentially depend on and possibly on publishers,
    and not the other way around, it''s natural to maintain the master references
    in book objects and consider the inverse references in publisher and author objects
    derived (or ''slave'') data. Therefore, we define publishedBooks and authoredBooks
    as inverse reference properties, which is indicated by their slash prefix in the
    OO class model.


    The meaning of this OO class model can be illustrated by a sample data population
    for the three model classes involved:


    | Name | Address | Published books |

    | :--- | :--- | :--- |

    | Bantam Books | New York, USA | 0553345842 |

    | Basic Books | New York, USA | 0465030793 |

    '
  mdcn: '


    ## 8.7 双向关联


    当一个派生的反向引用属性是多值的，而其反向属性是单值的时（例如图7.4中所示的 `Publisher::publishedBooks` 是由 `Book::publisher`
    派生的），生命周期依赖关系意味着：


    - 1. 每当创建一个“基对象”（例如书籍）时，都必须通过向其值集中添加指向该新基对象的引用来更新对应的反向属性（例如向 `Publisher::publishedBooks`
    中添加指向该新对象的引用）；

    - 2. 每当基属性更新时（例如，为某本书分配了新的出版社），对应的反向属性（在示例中为 `Publisher::publishedBooks`）也必须进行更新，即从其值集中移除旧的对象引用并添加新的引用；

    - 3. 每当一个基对象（例如书籍）被销毁时，都必须通过从其值集中移除该基对象来更新对应的反向属性（例如从 `Publisher::publishedBooks`
    中移除指向该对象的引用）。


    请注意，从纯粹计算的角度来看，我们可以自由地选择两个反向引用属性之一（如 `Book::authors` 和 `Author::authoredBooks`）作为主属性。然而，在许多情况下，关联代表了非对称的依赖关系，这决定了两个反向引用属性哪一个是主。例如，`Book`
    和 `Author` 类之间的关联代表了书籍对其作者的本体论依赖，而作者在存在上并不依赖于任何书籍。因此，双向关联通过将 `Book::authors` 保持为主属性来维护，而
    `Author::authoredBooks` 是从 `Book::authors` 派生的从属性。


    ## 7.2 构建面向对象（OO）类模型


    由于经典编程语言不支持将显式关联作为一等公民，而仅支持表示隐式关联的引用属性，因此，我们在获取 OO 类模型时必须消除所有显式关联。


    ### 7.2.1 基础属性


    我们消除过程的起点是一个包含各种类型单向和双向关联的设计模型，例如图 7.1 所示的模型，它仍然包含非方向性关联；我们首先必须通过对其端点的所有权做出决策来将其转变为有向的，这种决策通常基于导航需求。请注意，在
    `Publisher-Book-Author` 设计模型中的两个关联——`publisher-publishedBooks` 和 `authored-authors`——根据端点所有权的指示，都是双向的。为了消除设计模型中的所有显式关联，我们必须执行以下步骤：


    - 1. 消除连接源类与目标类的单向关联，通过将它们替换为源类中的引用属性，使目标类成为其范围。

    - 2. 通过将它们替换为一对反向引用属性来消除双向关联。


    ### 7.2.2 如何消除单向关联


    连接源类与目标类的单向关联被替换为源类中的一个引用属性，其范围为该目标类。其多重性与目标端的多重性相同。如果存在名称，其名称为关联端点的名称，否则设置为目标类的名称（如果引用属性是多值的，则可能使用复数形式）。


    ### 7.2.3 如何消除双向关联


    图 7.1 所示模型中 `Book` 和 `Author` 类之间的双向关联被替换为一对反向引用属性，即 `Book::authors` 和 `Author::authoredBooks`。由于这两个引用属性表示相同的信息（相同的关系集合），因此有一个选项可以将其中一个视为“主”属性，另一个“从”属性，后者是从主属性派生的。


    - 1. 在双向一对一关联的情况下，这会导致两个关联类中的每个类都有一对反向单值引用属性。在其中一个类中，必须选择哪一个作为主属性，使得另一个成为从属性。在该类中，从属性被指定为*派生属性*，每当满足以下情况时会自动更新：1)
    创建了新的主对象，2) 主引用属性被更新，或 3) 主对象被销毁。这种转换如图 7.2 所示。


    | Committee | chairedCommittee | ClubMember |

    | :--- | :--- | :--- |

    | name : String | 0..1 | 1 |


    ![img/1a8b608b42ede8e4d7e1a97445ae019_1330.png)


    **图 7.2：** 将双向一对一关联转换为互为反向的单值引用属性的主从对。


    | Committee | ClubMember |

    | :--- | :--- |

    | name : String | chairedCommittee[0..1] : Committee (inverse of chair) |

    | | ClubMember |


    - 2. 双向多对多关联映射到参与关联的两个类中的各一对互为反向的多值引用属性。同样，在其中一个类中，表示（反向）关联的多值引用属性被指定为*派生属性*，每当另一个类（维护关联的地方）中的对应属性被更新时，它会自动更新。这种转换如图
    7.3 所示。


    | Book | Author |

    | :--- | :--- |

    | isbn : String (id) | personid : Integer (id) |

    | title : String | name : String |


    ![img/1a8b608b42ede8e4d7e1a97445ae019_1331.png)


    | Book | Author |

    | :--- | :--- |

    | isbn[1] : String (id) | personID[1] : Integer (id) |

    | title[1] : String | name[1] : String |

    | authors[*] : Author | authoredBooks[*] : Book (inverse of chair) |


    **图 7.3：** 将双向多对多关联转换为互为反向的多值引用属性的主从对。


    ### 7.2.4 得到的 OO 类模型


    将所有双向关联替换为引用属性后，我们得到了 7.4 所示的 OO 类模型。


    | Book | Publisher |

    | :--- | :--- |

    | isbn[1]: String (id) | name[1]: String |

    | title[1]: String | publishedBooks[*]: Book (inverse of publisher) |

    | year[1]: Integer | Author |

    | publisher[0..1]: Publisher | personId[1]: Integer (id) |

    | authors[*]: Author |


    图 7.4：具有两对互为反向的引用属性的 OO 类模型。


    由于书籍本质上依赖于并可能依赖出版社，反之则不然，在书籍对象中维护主引用并将出版社和作者对象中的反向引用视为派生（或“从”）数据是自然的。因此，我们将 `publishedBooks`
    和 `authoredBooks` 定义为反向引用属性，这在 OO 类模型中通过它们的斜杠前缀来表示。


    该 OO 类模型的意义可以通过涉及的三个模型类的示例数据填充来说明：


    | Name | Address | Published books |

    | :--- | :--- | :--- |

    | Bantam Books | New York, USA | 0553345842 |

    | Basic Books | New York, USA | 0465030793 |


    '
