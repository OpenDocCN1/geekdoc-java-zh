    >\n<p>Hello ${name}!</p>\n</div>`;\n```\n\n### 2.1.5 The Spread Operator\n\nallows\
    \ spreading (1) the elements of an iterable collection in places where arguments\
    \ for function calls are expected, or (2) the slots of a JS object in places where\
    \ name-value pairs are expected. For instance,\n\n```javascript\nlet nums = [3,\
    \ 4, 5], otherNums = [1, 2, ...nums]; // cloning an array\nlet numsClone = [...nums];\n\
    // cloning an object\nlet book = {title:\"JavaScript: The Good Parts\"};\nlet\
    \ bookClone = {...book};\n```\n\n### 2.1.6 Destructuring Assignments\n\nallow\
    \ a concise syntax for assigning the property values of a JS object or the elements\
    \ of a JS array to corresponding variables. For instance,\n\n```javascript\nvar\
    \ point1 = [10, 5];\nvar [x,y]=point1; // a destructuring assignment\nconsole.log(`x\
    \ = ${x} | y = ${y}`); // x = 10 | y = 5\n\nvar person = {firstName:\"James\"\
    , lastName:\"Bond\"};\nvar {first, last} = person;\nconsole.log(`first: ${first}\
    \ | last: ${last}`); // Output: first: James | last: Bond\n```\n\n**Example 2.3.**\
    \ Dealing with multiple return values of a function\n\n```javascript\nfunction\
    \ getRectangle() {\n  return {width: 50, height: 20};\n}\nconst {a, b} = getRectangle();\n\
    drawRectangle(a, b);\n```\n\n**Example 2.4.** Swapping two variables\nvar a =\
    \ 1, b = 2;\n[a,b] = [b,a];\nconsole.log(`a = ${a} | b = ${b}`); // Output: a\
    \ = 2 | b = 1\n\n**Example 2.5.** Cloning arrays\nconst list = ['red', 'orange',\
    \ 'yellow'];\nconst [...listClone] = list;\n\n**Example 2.6.** Simplifying functions\
    \ with parameter records\nA function parameter record allows named arguments in\
    \ function calls instead of using list like so:\n\n```javascript\nfunction displayName(paramRec)\
    \ {\n    alert(paramRec.first + \" \" + paramRec.last);\n}\ndisplayName({first:\"\
    James\", last:\"Bond\"});\n```\n\nUsing Destructuring, the parameter fields are\
    \ assigned to ordinary variables:\n\n```javascript\nfunction displayName({first,\
    \ last}) {\n    alert(first + \" \" + last);\n}\ndisplayName({first:\"James\"\
    , last:\"Bond\"});\n```\n\n## 2.2 Single-Valued Reference Properties\n\nWhen coding\
    \ a class, the ES215 feature of function parameter destructuring allows a simplified\
