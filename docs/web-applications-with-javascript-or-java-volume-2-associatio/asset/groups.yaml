    \ the ES2015 feature of function parameter destructuring. We code the `checkCategory`\
    \ and `setCategory` methods for the category attribute in the following way:\n\
    \n```javascript\nstatic checkCategory(c) {\n    if (c === undefined || c === \"\
    \") {\n        return new NoConstraintViolation(); // c is optional\n    } else\
    \ if (!util.isIntegerOrIntegerString(c) || parseInt(c) < 1 ||\n        parseInt(c)\
    \ > CategoryEL.MAX) {\n        return new NoConstraintViolation(\n           \
    \ \"Invalid value for category: \" + c);\n    } else {\n        return new NoConstraintViolation();\n\
    \    }\n}\nset category(c) {\n    var validationResult = null;\n    if (this.category)\
    \ { // already set/assigned\n        validationResult = new FrozenConstraintViolation(\n\
    \            \"The category cannot be changed!\");\n    } else {\n        validationResult\
    \ = Book.checkCategory(c);\n    }\n    if (validationResult instanceof NoConstraintViolation)\
    \ {\n        this._category = parseInt(c);\n    } else {\n        throw validationResult;\n\
    \    }\n}\n```\n\nWhile the getters for segment properties (in this example: `subjectArea`\
    \ and `about`) follow the standard pattern, their checks and setters have to make\
    \ sure that the property applies to the category of the instance being checked.\
    \ This is achieved by checking a combination of property value and category, as\
    \ in the following example:\n\n```javascript\nstatic checkSubjectArea(sa, c) {\n\
    \  if (c === CategoryEL.TEXTBOOK && !sa) {\n    return new MandatoryViolation(\"\
    subject area must be provided!\");\n  } else if (c !== CategoryEL.TEXTBOOK &&\
    \ sa) {\n    return new ConstraintViolation(\"subject area not for textbook!\"\
    );\n  } else if (sa && (typeof sa !== \"String\" || sa.trim() === \"\")) {\n \
    \   return new RangeViolation(\"subject area must be non-empty string!\");\n \
    \ } else return new NoConstraintViolation();\n}\n```\n\nIn the serialization function\
    \ `toString()`, we serialize the category attribute and the segment properties\
    \ in a switch statement:\n\n```javascript\ntoString() {\n  var bookStr = \"ISBN:\"\
    \ + this.isbn + \", title:\" + this.title + \", year:\" + this.year;\n  switch\
    \ (this.category) {\n    case CategoryEL.TEXTBOOK:\n      bookStr += \", subject\
    \ area:\" + this.subjectArea;\n      break;\n    case CategoryEL.BIOGRAPHY:\n\
    \      bookStr += \", about:\" + this.about;\n      break;\n  }\n  return bookStr;\n\
    }\n```\n\nIn the `update` method of model class, we make sure that it can only\
    \ be updated if it has not yet been assigned, as follows:\n\n```javascript\nupdate\
    \ = function ({isbn, title, year, category, subjectArea, about}) {\n  const book\
    \ = instances[isbn];\n  var objectBefore = util.clone(book);\n  var updatedProperties=[];\n\
    \  try {\n    if (category && book.category !== category) {\n      book.category\
    \ = category;\n      updatedProperties.push(\"category\");\n    } else if (\"\
    category\" in book) {\n      throw FrozenConstraintViolation(\"The category cannot\
    \ be changed!\");\n    }\n    if (subjectArea && book.subjectArea !== subjectArea)\
    \ {\n      book.subjectArea = subjectArea;\n      updatedProperties.push(\"subjectArea\"\
    );\n    }\n    if (about && book.about !== about) {\n      book.about = about;\n\
    \      updatedProperties.push(\"about\");\n    }\n  } catch (e) {\n    // handle\
    \ error\n  }\n};\n```\n\n### 13.2.4 Write the View and Controller\n\nThe app's\
    \ user interface (UI) consists of a start page that allows navigating to data\
    \ management pages (in our example, books.html). Such a data management page contains\
    \ 5 sections: manage books, list all books, create book, update book and delete\
    \ book, such that only one of them is displayed at any time (by setting CSS display:none\
    \ for others).\n\n#### 13.2.4.1 Summary\n\nWe have take care of handling the category\
    \ attribute and the segment properties `subjectArea` and `about` in the “Retrieve\
    \ and list books” use case as well as in the “Create book” and “Update book” use\
    \ by\n\n- 1. Adding a segment information column (with heading “Category”) to\
