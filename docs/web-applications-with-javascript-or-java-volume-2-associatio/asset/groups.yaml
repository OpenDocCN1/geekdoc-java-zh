    \ | Bcd |\n| a2[1] : String | Cde |\n| a3[0..1] : String | |\n\n- 3. 0\n\n| Abc\
    \ | <enumeration> |\n|---|---|\n| a1[1] : Integer (id) | AbctypeEL |\n| category[1]\
    \ : AbctypeEL | Bcd |\n| a2[0..1] : String | Cde |\n| a3[0..1] : String | |\n\n\
    - 4. 0\n\n| Abc |\n|---||\n| a1[1] : Integer (id) |\n| a2[1] : String |\n| a3[0..1]\
    \ : String |\n\n# 13 使用原生 JS 实现子类型化\n\n在本章中，我们首先介绍 JavaScript 中基于构造函数的子类型化的通用方法，然后根据上文所示的运行示例（公共图书馆应用）的信息模型片段，展示两个案例研究。\n\
    \n在第一个案例研究中，我们考虑图 12.1 所示的根类为 Book 的单级类层次结构，作为一个不完全的不相交刚性分段。我们使用类层次合并设计模式将此简单层次结构重构为可以映射到持久化数据库表的单个类。\n\
    \n在第二个案例研究中，我们考虑图 12.8 所示的由 Person 角色 Employee、Manager 和 Author 组成的多级类层次结构。将 Person\
    \ 划分为 Employee 和 Author 的分段没有任何约束，这意味着它是完全的、重叠的（非相交的）。我们使用类层次合并设计模式重构简单的 Manager-is-Employee\
    \ 层次，并使用连接继承（Joined Inheritance）方法将 Employee-and-Author-is-Person 层次映射到三个通过键依赖关联的表中。在两个案例研究中，我们展示了：\n\
    \n1. 如何从信息设计模型推导出 JS 类模型和实体表；\n2. 如何以模型形式编写 JS 类；\n3. 如何根据模型编写代码。\n\n## 13.1 基于构造函数的类的子类型化\n\
    \n在 ES2015 版本之前，JavaScript 没有显式的类概念，且不支持支持子类型化，必须通过两种继承机制来实现：(1) 属性继承和 (2) 方法继承。正如我们在第一卷第一章中所述，类可以通过两种替代方式定义：基于构造的和基于工厂的。我们通过以下示例总结了在单继承层次结构中定义父类和子类的\
    \ ES2015 代码：\n\n| Person |\n|---|\n| firstName : String |\n| lastName |\n\n| Student\
    \ |\n|---|\n| stdNo : Integer |\n\n首先，我们定义带有 firstName 和 lastName setter 的基类 Person：\n\
    \n```javascript\nclass Person {\n    constructor ({first, last}) {\n        //\
    \ 通过 setter 赋值属性\n        this.firstName = first;\n        this.lastName = last;\n\
    \    }\n\n    getFirstName () {return this._firstName};\n    setFirstName (f)\
    \ {\n        // ... 约束\n        this._firstName = f;\n    }\n\n    getLastName\
    \ () {return this._lastName};\n    setLastName (l) {\n        // ... 约束\n    \
    \    this._lastName = l;\n    }\n}\n```\n\n然后，我们定义一个带有额外属性 stdNo 的子类 Student：\n\
    \n```javascript\nclass Student extends Person {\n    constructor ({first, last,\
    \ stdNo}) {\n        // 调用父类构造函数\n        super(first, last);\n        // 赋值额外属性\n\
    \        this.stdNo = stdNo;\n    }\n\n    get stdNo () {return this._stdNo;}\n\
    \    set stdNo (sn) {\n      // 约束\n      this._stdNo = sn;\n    }\n}\n```\n\n\
    注意父类构造函数的调用：`super(first, last)`。\n\n13.2 案例研究1：消除类层次\n\n可以通过应用类层次合并设计模式消除简单的类层次结构。我们案例研究的起点是图\
    \ 12.1 的信息设计模型所示的简单类层次结构，它将 Book 划分为 TextBook 和 Biography 的不相交（但不完全的）刚性分段。该模型首先通过类层次合并模式简化如下模型：\n\
    \n| isbn[1]: String (id) | <<enumeration> |\n|---|---|\n| title[1]: String | BookTypeEL\
    \ |\n| year[1]: Integer | TextBook |\n| category[0..1]: BookTypeEL (frozen) |\
    \ Biography |\n| subjectArea[0..1]: String | |\n| about[0..1]: String | |\n\n\
    > invariant ((category=\"TextBook\" NOT subjectArea=undefined) AND (category=\"\
    Biography\" NOT about=undefined))\n\n现在我们从这个设计模型推导出 JS 类模型。\n\n### 13.2.1 构建 JS\
    \ 类模型\n\n我们通过三个步骤构建 JS 类模型：\n\n- 将与平台无关的类型（用于属性范围和参数）替换为 JS 类型。这包括枚举值属性（如 category），转换为底层枚举类型整数限制的数值属性。\n\
    - 为所有属性装饰«get/set»立体型，表示它们具有隐式的 getter 和 setter。\n- 添加如第一卷第八章描述的属性检查函数。根据其隐含语义，`checkCategory`\
    \ 函数以及段属性的检查需要特别考虑。特别是，段属性检查函数必须确保只有在类别属性代表对应段的值时才能赋值。我们在下文讨论如何编写 JS 类模型时更详细地解释这种验证语义。\n\
    \n这导致了 13.1 所示的 JS 类模型，其中类级（静态）方法带有下划线标记：\n\n| Book | «enumeration» |\n|---|---|\n\
    | «get/set» isbn: string | BookCategoryEL |\n| «get/set» title: string | TEXTBOOK\
    \ |\n| «get/set» year[1]: number | BIOGRAPHY |\n| «get/set» category[0..1]: number\
    \ (from BookCategory, frozen) | |\n| «get/set» subjectArea[0..1]: string | |\n\
    | checkIsbn(isbn: string, string): ConstraintViolation |\n| checkIsbn(isbn: string):\
    \ string: ConstraintViolation |\n| checkTitle(title: string): ConstraintViolation\
    \ |\n| checkYear(year: number): ConstraintViolation |\n| checkCategory(in type:\
    \ number): ConstraintViolation |\n| checkSubjectArea(in subjectArea: string):\
    \ ConstraintViolation |\n| checkAbout(in about: string): ConstraintViolation |\n\
    \n**图 13.1:** 合并后类层次结构的 JS 类模型。\n\n### 13.2.2 新问题\n\n与第一卷第11章讨论的枚举相比，我们必须处理许多新问题：\n\
    \n1. 在模型代码中我们需要处理：\n   1. 添加约束违反类 `FrozenValueConstraintViolation.js`。\n   2.\
    \ 编写示例中作为类别属性 `BookCategoryEL` 范围的枚举。\n   3. 编写类别属性的 `checkCategory` 函数。在我们的示例中，由于\
