    represented by it, add a corresponding keyword as property modifier. For the given
    OO class model, add the following property modifiers:


    +   * oneToMany to the derived reference property Publisher ::/publishedBooks,

    * manyToOne to the reference property Book :::publisher

    * manyToMany to the reference property Book :::authors

    * manyToMany to the derived reference property Author ::/authoredBooks


    6. For any reference property designated as the inverse of... reference property,
    replace its (inverse of... ) property with a corresponding (mappedBy="...") property
    modifier.


