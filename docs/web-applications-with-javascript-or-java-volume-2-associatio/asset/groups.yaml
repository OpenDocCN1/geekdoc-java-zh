    and to identify authors by their personId.


    We consider the following extension of our original example model, shown in Figure
    12.4:


    - 1. the disjoint (but incomplete) segmentation of Book into TextBook and Biography,

    - 2. the overlapping and incomplete segmentation of Person into Author and Employee,
    which is further specialized by Manager.


    # 12.3 Intension versus Extension


    The intention of an object type is given by the set of its features, including
    attributes, associations, constraints and operations.


    The extension of an object type is the set of all objects instantiating the object
    type. The extension of an object type is also called its population.


    # 126 — 12 Subtyping and Inheritance


    | Employee | Person |

    | :--- | :--- |

    | employeeNo: Integer (key) salary : Decimal | personid[1]: Integer (id) name[1]:
    String dateOfBirth[1]: Date dateOfDeath[0..1]: Date |

    | * 0..1 | |

    | Publisher published Books Book authored Books |

    | name: String (id) address : String | isbn: String (id) title: String year: Integer
    | biography: Text |

    | 0.1 * | |

    | managed Publisher 0.1 | (disjoint) |

    | TextBook | Biography |

    | subjectArea : String | about : String |

    | Manager | |

    | 1 | |


    Figure 12.4: An information model with two class hierarchies.


    We have the following duality: while all features of a supertype are included
    in the intentions, or feature sets, of its subtypes (intensional inclusion), are
    included in the extensions, or instance sets, of its supertypes (extensional inclusion).
    This formal structure has been investigated in formal concept analysis.


    Due to the intention/extension duality we can specialize a given type in two different
    ways:


    - 1. **By extending the type’s intention** through adding features to the new
    subtype (such as adding the attribute subjectArea to the subtype TextBook).

    - 2. **By restricting the type’s extension** through adding a constraint (such
    as defining a subtype MathTextBook as a Textbook where the attribute subjectArea
    has the specific value “Mathematics”).


    Typical OO programming languages, such as Java and C#, only support the first
    possibility (specializing a given type by extending its intention), while XML
    Schema and SQL99 also support the second possibility (specializing a given type
    by restricting its extension).


    # 12.4 Type Hierarchies


    A *type hierarchy* (or class hierarchy) consists of two or more types, one of
    them being the *root* (or *top-level*) type, and all others having at least one
    direct supertype.


    # 12.4 Type Hierarchies 127


    When all non-root types have a unique direct supertype, the type hierarchy is
    a **single-inheritance hierarchy**, otherwise it''s a **multiple-inheritance hierarchy**.
    For instance, in Figure 12.5 below, the class Vehicle is the root of a single-inheritance
    hierarchy, while Figure 12.6 shows an example of a multiple-inheritance hierarchy,
    due to the fact that AmphianVehicle has two direct superclasses: LandVehicle and
    WaterVehicle.


    ![](img/1a8b608b42ede8e4d7e1a974745ae019_142_0.png)


    **Figure 12.5:** A class hierarchy having the root class Vehicle.


    The simplest case of a class hierarchy, which has only one level of subtyping,
    is called a *generalization* set in UML, but may be more naturally called *segmentation*.
    A segmentation is *complete*, if the union of all subclasses is equal to the extent
    of the superclass (or, in other words, if all instances of the superclass instantiate
    some subclass). A segmentation is *disjoint*, if all subclasses are pairwise disjoint
    (or, in other words, if no instance of the superclass instantiates more than one
    subclass). Otherwise, it is called *overlapping*. A complete and disjoint segmentation
    is a *partition*.


    ![](img/1a8b608b42ede8e4d7e1a974745ae019_142_1.png)

    **Figure 12.6:** A multiple inheritance hierarchy.


    In a class diagram, we can express these by annotating the segmentation with *complete*
    and *disjoint*. For instance, the segmentation of Vehicle into LandVehicle and
    WaterVehicle in Figure 12.6 above is incomplete and overlapping.


    An information model may contain any number of class hierarchies.

