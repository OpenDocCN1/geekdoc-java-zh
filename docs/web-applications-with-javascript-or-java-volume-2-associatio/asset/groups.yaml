  mdcn: "\n\n## 9.2 编写模型\n\n可以直接为 Java 实体模型类编码，以获取我们 Java 后端应用程序的模型层代码。\n\n### 9.2.1\
    \ 新问题\n\n与之前讨论的单向关联应用相比，我们必须处理许多新的技术问题：\n\n- 1. 在模型代码中，你现在必须维护派生的反向引用属性（derived\
    \ inverse reference properties），方法是维护构成派生反向引用属性值的派生反向引用（集合）。具体而言：\n    1. 每当单值主引用属性的值通过\
    \ setter 初始化或更新时（例如通过为 `Book` 实例 `b` 的 `b.publisher` 分配一个 `Publisher p` 引用），必须向派生反向引用属性对应的值分配或添加反向引用（例如将\
    \ `b` 添加 `p.publishedBooks`）；当主引用属性的值被更新且派生的反向引用属性为多值时，必须删除对该单值主引用属性旧值的过时引用；\n\
    \    2. 每当可选的单值主引用属性的值被取消设置时（例如通过为 `Book` 实例 `b` 的 `b.publisher` 分配 `null`），必须从派生反向引用属性对应的值中移除反向引用（例如将\
    \ `b` 从 `p.publishedBooks` 中移除）；如果派生反向引用属性是多值的，否则必须取消设置或更新派生反向引用属性对应的值；\n    3.\
    \ 每当通过 add 方法向多值主引用属性的值添加引用时（例如为 `Book` 实例 `b` 的 `b.authors` 添加一个 `Author` 引用），必须向反向引用属性对应的值分配或添加反向引用（例如将\
    \ `b` 添加 `a.authoredBooks`）；\n    4. 每当通过 remove-remove- 方法从多值主引用属性的值中移除引用时（例如从\
    \ `Book` 实例 `b` 的 `b.authors` 中移除对 `Author` 实例的引用），如果派生反向引用属性是多值的，则必须从派生反向引用属性对应的值中移除反向引用（例如将\
    \ `b` 从 `a.authoredBooks` 中移除），否则必须取消设置或更新派生反向引用属性对应的值；\n\n- 每当具有单引用或多引用作为主引用属性值的对象被销毁时（例如当一个具有单引用\
    \ `b.publisher` 指向 `Publisher` 实例 `p` 的 `Book` 实例被销毁时），必须首先移除派生引用（例如通过从 `p.publishedBooks`\
    \ 中移除 `b`）。\n\n注意，当创建一个具有单引用或多属性作为主引用属性的对象时（例如具有单引用 `b.publisher` 的新 `Book` 实例），其\
    \ setter 或 add 方法将被调用并处理反向引用的创建。\n\n- 在 UI 中，我们现在可以利用反向引用属性在列表对象用例中高效地创建关联对象列表。例如，我们可以高效地为每个出版社创建所有出版书籍列表。\n\
