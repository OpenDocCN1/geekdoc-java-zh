    ## 1.2 Referential Integrity


    References are important information items in our application''s database. However,
    they are only meaningful, when their referential integrity is maintained by the
    app. This requires that for any reference, there is a referred object in the database.
    Consequently, any reference property p with domain C and range class D comes with
    a referential integrity constraint that has to be checked whenever


    - 1. a new object of type C is created,

    2. the value of p is changed for some object of type C,

    3. an object of type D is destroyed.


    A referential constraint also implies two change dependencies:


    - 1. An object creation dependency: an object with a reference to another object
    can only be created after the referenced object has been created.

    2. An object destruction dependency: an object that is referenced by another object
    can only be destroyed after

    1. the referencing object is destroyed first (the CASCADE deletion policy),

    2. the reference in the referencing object is either dropped (the DROP-REFERENCE
    deletion policy) or replaced by another reference.


