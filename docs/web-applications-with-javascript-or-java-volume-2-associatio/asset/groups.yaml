    ) can be used for expressing that an association is neither functional nor inverse\
    \ functional?\n\nAnswer: ______________________\n\n## 2 Implementing Unidirectional\
    \ Functional Associations with Plain JS\n\nA unidirectional functional association\
    \ is either one-to-one or many-to-one. In both cases such an association is represented,\
    \ or implemented, with the help of a single-valued reference property.\n\nIn this\
    \ chapter, we show\n\n- 1. how to derive a plain JS class from an OO class model\
