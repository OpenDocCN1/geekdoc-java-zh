    \ Book (inverse of publisher) |\n| publisher[0..1]: Publisher | /authoredBooks[*]:\
    \ Book (inverse of authors) |\n\nNotice the model contains two derived inverse\
    \ reference properties: Publisher:/publishedBooks and Author:/authoredBooks. Each\
    \ of them is linked to a master property, from which it is derived. Consequently,\
    \ each of represents a pair of mutually inverse reference properties corresponding\
    \ to a bidirectional association.\n\nCompared to making JS class models with unidirectional\
    \ associations, the only new issue is:\n\n- 1. Add a «get> stereotype to all derived\
