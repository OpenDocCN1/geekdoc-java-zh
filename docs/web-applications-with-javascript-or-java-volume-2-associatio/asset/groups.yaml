    **Pros of the TCI approach:** (1) The structure of the given class hierarchy in
    terms of its elements (classes) is explicitly represented. (2) When the segmentations
    of the given class hierarchy are disjoint, TCI leads to memory-efficient non-redundant
    storage.


    **Cons:** (1) The TCI approach does not yield a faithful representation of the
    subtype relationships expressed in the original class hierarchy. In particular,
    for any row representing a subclass instance (an employee, manager or author)
    there is no information that it does not inform about the represented subtype
    relationships; rather, this meta-information, which is kept in the app''s class
    model, is de-coupled from the database. (2) The TCI approach requires repeating
    column definitions, which is a form of schema redundancy. (3) The TCI approach
    may imply data redundancy whenever the segment subclasses overlap. In our example,
    authors can be employees, so for any person in the overlap, we would need to duplicate
    the data storage for all columns representing properties of the superclass (in
    our example, this only concerns the property name).


    # 12.7.4.3 Joined Inheritance


    For avoiding the data redundancy problem of TCI in the case of overlapping segments,
    we could use the JTI approach as exemplified in the SQL table model shown in Figure
    12.12 below. This model connects representing subclasses (*subtables*) to tables
    representing their superclasses (*supertables*) by defining their primary key
    column(s) to be at the same time a foreign key referencing their super''s primary
    key. Notice that foreign keys are visualized in the form of UML dependency arrows
    stereotyped with «fkey» and annotated at their source table side with the name
    of the foreign key column.'
