    \ = empNo;\n    if (category) this.category = category;\n    if (department) this.department\
    \ = department;\n  }\n}\n```\n\n### 13.3.4.2 加载根类 Person 的实例\n\n当从根据 TCI 方法组织的持久化数据存储中检索类层次结构根类（在我们的示例中为\
    \ `Person`）的实例时，我们不仅从代表根类的表（`people`）检索其直接实例，还需要从代表其所有子类的表（`employees` 和 `authors`）检索间接实例，如下代码所示：\n\
    \n```javascript\nPerson.retrieve = function () {\n  var people = {}, employees\
