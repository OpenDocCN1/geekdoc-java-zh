    ## 1.8 在用户界面中渲染引用属性


    CRUD 数据管理接口中用于数据输入输出的控件（widgets）通常对应于应用模型类中定义的属性。我们需要区分对应（各种类型）属性的（各种类型）输入字段，以及对应于枚举属性或引用属性的控件（如选择列表）。在
    UI 中使用选择控件而非输入字段来表示引用属性，可以防止用户输入无效的 ID 引用，从而维护引用完整性。


    通常情况下，单值引用属性可以渲染为 UI 中的单选列表，无论引用的范围内填充了多少对象，都从中做出一个特定的选择。如果引用属性范围的基数足够小（例如，不超过
    7），那么我们也可以使用单选按钮组选择列表。


    多值引用属性可以渲染为 UI 中的多选列表。然而，一旦有许多（超过 20 个）不同选项可供选择，HTML 对应的多选控件就变得不可用，因为读者的选择在视觉上太分散了。在只有少数（例如，不超过
    7 个）选项的特殊情况下，我们也可以使用复框组代替多选列表。但对于在 UI 中列出从引用属性范围类中选择的所有关联对象的通用情况，我们需要开发一种特殊的 UI
    控件，允许向已选对象列表添加（删除）对象。


    这种多选控件由以下组成：


    - 1. 一个包含（关联）对象的 HTML 列表元素，其中每个列表项包含一个用于从选择中移除对象的推按钮（push button）；

    - 2. 一个单选控件，结合推按钮，允许从多值引用属性的范围中添加新的关联对象。


    ## 1.9 多值引用属性的集合类型


    默认情况下，非功能关联端会将目标类的一组实例关联到源类的任何实例，这意味着相应多值引用属性的集合值是集合（sets）。某些情况下，非功能关联端是有序的，因此相应引用属性的集合值采用有序集合的形式。


    在下面的示例中，关联端 `publishedBooks` 是无序的，而关联端 `authors` 是有序的，因为书籍作者的顺序是有意义的。注意，在 UML
    类图中，关联端用注释 `{ordered}` 标记。


    ## 16 引用属性与单向关联


    | 出版社 | 已出版书籍 | 作者 (有序) |  |

    |---|---|---|---|

    | name: String {id} | isbn: String {id} * | personId: Integer {id} | name: String
    |

    | address: String 0.1 * | title: String year: Integer | | |


    有序关联不应基于目标类的属性表示任何内容。在我们的示例中，这意味着书籍作者的顺序，例如，不应该代表他们的字母顺序，而应该代表某种无法通过 `Author`
    属性获取的信息。事实确实如此，因为它代表了某种意义，而这种意义无法通过任何属性表达的。


    注意，信息设计模型中的有序关联仅仅是为了方便，因为有序关联始终可以通过向关联的目标类添加一个额外的属性来转换为无序关联，使得这些属性的值可以用于排序。有序关联允许更简洁的信息模型和更高效的实现，因为它不需要借助辅助排序属性来显式地进行排序。


    多值引用属性的两种重要集合类型是集合和有序集合，而使用包（多集合）和序列（有序多集合）的用例时，多值引用属性的集合类型为包（或序列），这可以在类图中使用注释
    `{nonunique}`（或有序）来表示。注意，对于有序或无序的属性，使用列表（如 Java List 类型）是非常常见的。


