    \n我们仍然在模型层中每个类和每个属性中包含了重复的代码结构（称为样板代码），用于约束验证（检查和设置器），以及每个类中用于数据存储管理方法（添加、更新和删除）。虽然为了学习应用开发而编写几次这些代码是好事，但在处理真实项目时，你不想反复编写它们。为了避免重复的样板代码，需要这些方法的通用泛化形式，以便它们可以在应用的所有模型类中被复用。例如，cCLASSjs\
    \ 库就提供了这种方法。\n\n## 4 使用 Java EE 实现单向功能关联\n\n单向功能关联可以是一对一的也可以是多一的。在这两种情况下，这种关联都是通过单个单值引用属性来表示或实现的。\n\
    \n在本章中，我们将展示：\n\n- 1. 如何从具有代表单向功能关联的单值引用属性的 OO 类模型中，推导出以 Java 实体类模型形式的数据模型，\n\
    - 2. 如何以实体类（实现模型类）的形式编写 Java 实体类模型代码，\n- 3. 如何基于实体类编写视图和控制器代码。\n\n## 4.1 在 Java\
    \ 中实现单值引用属性\n\n单值引用属性（例如对象类型 Book 的发布者）允许存储对另一种类型对象（例如 Publisher）的内部引用。在创建新对象时，构造函数需要一个参数，以便允许为引用属性分配合适的值。在\
    \ Java 等强类型编程语言中，我们可能需要决定此值预期是内部对象引用还是 ID 引用。使用 JPA 对象到存储的映射技术，我们可以处理对象引用，并将映射到相应\
    \ ID 引用的工作交给 JPA。Book 类扩展如下：\n\n```java\n@Entity @Table(name=\"books\")\n@ViewScoped\
    \ ManagedBean(name=\"Book\")\npublic class Book {\n\n    private Publisher publisher;\n\
    \n    public Book() {}\n\n    public Book(String isbn, String title, Integer year,\n\
    \        Publisher publisher) { . . }\n\n    public Publisher getPublisher() {\
    \ . . . }\n\n    public void setPublisher( Publisher publisher) { . . .\n}\n```\n\
    \n## 4.2 制作 Java 实体类模型\n\n制作 Java 实体类模型的起点是如图 1.10 所示的 OO 类模型。\n\n如前所述，我们通过以下方式从相应的\
    \ OO 设计类获取 Java 实体类 Publisher：(1) 将所有属性设为私有，(2) 使用 Java 数据类型类（String、Integer 等），(3)\
    \ 为属性添加 get/set 刻型（指定公共的 getter 和 setter），(4) 添加 toString 函数，(5) 添加用于检索、更新和删除的（类级）数据方法：\n\
    \n| Java 实体 |\n| :--- |\n| Publisher |\n| <get/set>-name : String |\n| <get/set>-address\
    \ : String |\n| +checkNameAid(in : String, em : EntityManager) : ConstraintViolation\
    \ |\n| +toString() : String |\n| +retrieveAll(in : EntityManager) : List<Publisher>\
    \ |\n| +retrieve(em : EntityManager, name : String) : Publisher |\n| +create(em\
    \ : EntityManager, name : String, address : String) |\n| +update(em : EntityManager,\
    \ name : String, address : String) |\n| +delete(em : EntityManager, name : String)\
    \ |\n\n在 Java 实体类模型中，对于任何关联端，我们都显示该关联端并用以下内容对其注解：\n\n| Java 实体 |\n| :--- |\n|\
    \ Book |\n| <get/set>-isbn : String |\n| <get/set>-title : String |\n| <get/set>-year\
    \ : Integer |\n| <get/set>-publisher |\n\n## 4.3 新产生的问题\n\n与单值属性相比，我们必须处理许多技术问题：\n\
    \n- 1. 在模型代码中，我们需要通过 JPA 注解为引用属性定义引用约束；\n- 2. 通过获取类型扩展创建、更新和删除操作；\n- 3. 在用户界面（视图）代码中，我们现在需要在创建和更新情况下显示关联的对象。\n\
    \n## 4.4 编写模型代码\n\nJava 实体类模型可以直接为后端模型层编写。\n\n### 4.4.1 总结\n\n- 1. 将 实体模型中的每个类编写为相应的实体类。\n\
    - 2. 使用 JPA 注解 @Id 编写 id 属性。\n- 3. 为代表功能类型的属性（如 manyToOne）编写相应的 JPA 注解，如 @ToOne。\n\
    - 4. 使用 Bean Validation 注解编写模型中指定的完整性约束。\n- 5. 编写 getter 和 setter。\n- 6. 以类方法的形式编写创建、检索、更新和删除存储操作。\n\
    \n### 4.4.2 实体模型的每个类\n\n实体模型的每个类都被编写为注解类，具有默认构造函数（无参数）和一个带有实体创建参数的构造函数。\n\n例如，实体模型中的\
    \ Book 类编写如下：\n\n```java\n@Entity @Table(name=\"books\")\n@ViewScoped(name=\"\
