    \            }\n                i++;\n            }\n        }\n        return\
    \ result;\n    }\n}\n```\n\nSince the serialization text contains HTML elements,\
    \ i.e., <br /> to produce HTML new lines, we have to specify the @escape=\"false\"\
    \ attribute, otherwise < and > will be replaced with the corresponding &lt; &gt;\
    \ entities.\n\nThe main advantage of JSF converters is that we do not mix model\
