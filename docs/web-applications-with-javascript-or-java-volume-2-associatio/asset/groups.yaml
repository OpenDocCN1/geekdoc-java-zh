  - "[PAGE 71]\n\n# 4.4.2 Code Each Class of the Entity Model\n\nEach class of the\
    \ Java entity class model is coded as an annotated class with name C having a\
    \ default constructor (with no parameters) and a constructor with entity creation\
    \ parameters.\n\nFor instance, the Book class from the Entity class model is coded\
    \ in the following-way:\n\n```\n@Entity @Table(name=\"books\")\n@ViewScoped(name=\"\
    book\")\npublic class Book {\n    @Id @NotNull(message=\"An ISBN is required!\"\
    )\n    private String isbn;\n    @Column(nullable=false)\n    @NotNull(message=\"\
    A title is required!\")\n    private String title;\n    @Column(nullable=false)\n\
    \    @NotNull(message=\"A year is required!\")\n    private Integer year;\n  \
    \  @ToOne(fetch=FetchType.EAGER)\n    private Publisher publisher;\n\n    public\
    \ Book() {}\n    public Book(String isbn, String title, Integer year, Publisher\
    \ publisher) {\n        this.setIsbn(isbn);\n        this.setTitle(title);\n \
    \       this.setYear(year);\n        this.setPublisher(publisher);\n    }\n  \
    \  ... // getters, etc.\n}\n```\n\nThe @ManyToMany annotation on the publisher\
    \ is used for specifying the functionality type of the association Book has Publisher\
    \ represented by the reference publisher since it holds that a book has one publisher\
    \ and a publisher has many books. This annotation also allows to specify a fetch\
    \ type with the parameter taking one of the following two values:\n\n+   - FetchType.EAGER,\
    \ implying that a retrieval of an entity includes a retrieval of the associated\
    \ entity referenced by this property. In our example, this means that when a Book\
    \ entity is retrieved, the Publisher entity referenced by the book's publisher\
    \ property is also retrieved. This behavior is very"
- md: "\n## 4.4 Write the Model Code\n\nuseful and it should be used whenever the\
    \ data to be retrieved can be handled in main memory.\n\n- FetchType.LAZY, implying\
    \ that referenced entities are not automatically retrieved when referencing entity\
    \ is retrieved. In our example, this means that the referenced Publisher entity\
    \ is not retrieved with a referencing Book entity, leaving the value of the publisher\
    \ property to null. With this fetching behavior, a referenced entity has been\
    \ retrieved separately by invoking the property's getter in the context of a transaction\
    \ (in our example by invoking getPublisher).\n\nIn the case of a single-valued\
    \ property (representing a functional association) annotated with either @ToOne\
    \ or @ManyToOne, the default value is FetchType.EAGER, so referenced entities\
    \ are fetched together with referencing entities, while in the case of a non-functional\
    \ association (with either @OneToMany or @ManyToMany), the default value is FetchType.LAZY,\
    \ so referenced entities are not fetched together with referencing entities, but\
    \ have to be retrieved separately, if needed.\n\nAs a result of JPA annotations,\
    \ the following SQL table creation statement for creating the table is generated:\n\
    \n```sql\nCREATE TABLE IF NOT EXISTS `books` (\n  `ISBN` varchar(10) NOT NULL,\n\
    \  `TITLE` varchar(255) NOT NULL,\n  `YEAR` int(11) NOT NULL,\n  `PUBLISHER_NAME`\
    \ varchar(255) DEFAULT NULL,\n  FOREIGN KEY (`PUBLISHER_NAME`) REFERENCES `publishers`\
    \ (`NAME`)\n);\n```\n\n### 4.4.3 Code the Constraints\n\nTake care that all property\
    \ constraints specified in the entity class model are properly coded using suitable\
    \ Bean Validation annotations. For instance, for the attribute name, we have to\
    \ use the JPA annotation @Id for specifying that the primary key column of the\
    \ database table to which the entity class is mapped, and the Bean Validation\
    \ annotation @NotNull for defining a mandatory value constraint that is checked\
    \ before an entity is saved to the database.\n\nIn the case of the address attribute,\
    \ we have to define a mandatory value constraint in two forms: with the JPA annotation\
    \ @Column(nullable=false) for the corresponding table column, and with the Bean\
    \ Validation annotation @NotNull for the attribute.\n\n```java\n@Id @NotNull(message=\"\
    A name is required!\")\nprivate String name;\n```\n\n```java\n@Column(nullable=False)\n\
    @NotNull(message=\"An address is required!\")\nprivate String address;\n```\n\n\
    Notice that, unfortunately, the current Java EE technology requires defining the\
    \ same constraint twice, once for the database in the form of a JPA annotation,\
    \ and for the Java app in the form of a Bean Validation annotation.\n\n### 4.4.4\
    \ Code Getters and Setters\n\nCode the setter operations as (instance-level) methods.\
    \ The setters only assign values and do not perform any validation, since the\
    \ property constraints are only checked before save by the Java EE execution environment.\
    \ The getters simply return the actual values of properties.\n\n### 4.4.5 Implement\
    \ Deletion Policy\n\nFor any reference property, we have to choose and implement\
    \ a deletion policy for taking care of the corresponding object destruction dependency\
    \ in the delete method of the reference property's class range. In our case, we\
    \ have to choose between:\n\n1. deleting all books published by the deleted publisher;\n\
    2. dropping from all books published by the deleted publisher the reference to\
    \ the deleted publisher.\n\nWe choose the second policy, which can only be used\
    \ in the case of an optional reference property such as book.publisher. This is\
    \ shown in the following code of the Publisher.delete method where for all entities\
    \ concerned the property book is cleared:\n\n```java\npublic static void delete(EntityManager\
    \ em, UserTransaction ut, String name) throws Exception {\n    ut.begin();\n \
    \   Publisher publisher = em.find(Publisher.class, name);\n    // find All Books\
    \ which has this publisher\n    Query query = em.createQuery(\n    \"SELECT b\
    \ FROM Book b WHERE b.publisher.name = :name\");\n    query.setParameter(\"name\"\
    , name);\n    // ... (rest of the logic)\n}\n```\n\n```java\nList<Book> books\
    \ = query.getResultList();\n// clear these books' publisher reference\nfor ( Book\
    \ b: books) { \n    b.setPublisher(null);\n}\nem.remove(publisher);\nut.commit();\n\
    ```\n\nThe method loops through all Book entities referencing the publisher to\
    \ be destroyed and sets its publisher property to null.\n\n### 4.4.6 Serialization\
    \ and De-Serialization\n\nBased on JPA annotations, together with suitable converter\
    \ classes when needed, serialization (from Java objects to table rows) as well\
    \ as the corresponding de-serialization (from table columns to Java objects) are\
    \ performed automatically.\n\n## 4.5 The View and Controller Layers\n\nUser interface\
    \ (UI) consists of a start page for navigating to the data management UI pages\
    \ and one UI page for each object type and data management use case. All UI pages\
    \ are defined in the form of JSF view files in subfolders of WebContent/Views/\
    \ folder. We create the Main page index.xhtml in the subfolder WebContent/Views/content\
    \ with the following content:\n\n```xml\n<!DOCTYPE html>\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
    \ xmlns:ui=\"..\" xmlns:f=\"..\">\n<ui:composition template=\"/WEB-INF/templates/page.xhtml\"\
    >\n  <ui:define name=\"content\">\n    <h2>Public Library</h2>\n    <h:button\
    \ value=\"Manage publishers\" outcome=\"/views/publishers/index\" />\n    <h:button\
    \ value=\"Manage books\" outcome=\"/views/books/index\" />\n    <h:form>\n   \
    \   <h:commandButton value=\"Clear database\" action=\"#{appCtrl.clearData()}\"\
    \ />\n      <h:commandButton value=\"Create test data\" action=\"#{appCtrl.createTestData()}\"\
    \ />\n    </h:form>\n  </ui:define>\n</ui:composition>\n</html>\n```\n\nIt creates\
    \ the menu buttons which provide the corresponding views for each. Additionally,\
    \ we need to create a corresponding AppController class which is responsible for\
    \ the creation and deletion of test data. The controller is used to combine code\
    \ of Publisher and Book methods as follows:\n\n```java\n@ManagedBean(name=\"appCtrl\"\
    ) @SessionScoped\npublic class AppController {\n    @PersistenceContext(unitName=\"\
    UnidirocApp\")\n    private EntityManager em;\n    @Resource\n    UserTransaction\
    \ ut;\n\n    public String clearData() {\n        try {\n            ut.begin();\n\
    \            // ... logic to clear data\n            ut.commit();\n        } catch\
    \ (Exception e) {\n            e.printStackTrace();\n        }\n        return\
    \ \"index\";\n    }\n\n    public String createTestData() {\n        try {\n \
    \           ut.begin();\n            // ... logic to create data\n           \
    \ ut.commit();\n        } catch (Exception e) {\n            e.printStackTrace();\n\
    \        }\n        return \"index\";\n    }\n}\n```\n\nThe deletion of Book and\
    \ Publisher data must be done in a particular order (books have to be deleted\
    \ first, before their publishers).\n\n### 4.5.1 Initialize the App\n\nSince the\
    \ code runs in a Tomcat container, the initialization is made internally by the\
    \ container.\n\n### 4.5.2 Show Information About Associated Objects in Retrieve/List\n\
    \nIn our example we have only one reference property, Book::publisher, which is\
    \ functional. For showing information about the optional publisher of a book in\
    \ the retrieve/list all books we use, the corresponding column in the HTML table\
    \ is filled with names of publishers, for there is:\n\n```xml\n<ui:composition\
    \ template=\"/WEB-INF/templates/page.xhtml\">\n  <ui:define name=\"content\">\n\
    \    <h:dataTable value=\"#{bookCtrl.books}\" var=\"b\">\n      <h:column>\n \
    \       <f:facet name=\"header\">Publisher</f:facet>\n        #{b.publisher.name}\n\
    \      </h:column>\n    </h:dataTable>\n    <h:button value=\"Main menu\" outcome=\"\
    index\" />\n  </ui:define>\n</ui:composition>\n```\n\nNotice the cascade call\
    \ used in the #{b.publisher.name} JSF expression, accessing the property name\
    \ of the publisher which is a property of the book instance b.\n\n### 4.5.3 Allow\
    \ Selecting Associated Objects in Create and Update\n\nIn this section, we discuss\
    \ how to create and update an object which has reference properties, such as a\
    \ Book object with the reference property publisher.\n\n### 4.5.3.1 Create the\
    \ Object-to-String Converter\n\nHTML requires string or number values to populate\
    \ forms. In our case, the property publisher of the Book class is an object reference.\
    \ JSF allows converting objects to\n"
  mdcn: "\n\n## 4.4 编写模型代码\n\n这种方式非常有用，当要检索的数据可以在主内存中处理时，应该尽可能使用它。\n\n-   FetchType.LAZY，意味着在检索引用实体时不会自动检索引用的实体。在我们的示例中，这意味着在检索引用实体\
    \ `Book` 时，不会检索引用的 `Publisher` 实体，导致 `publisher` 属性的值为 `null`。通过这种获取行为，引用的实体是在事务上下文中通过调用属性的\
    \ getter（在我们的示例中通过调用 `getPublisher`）单独获取的。\n\n对于标记了 @ToOne 或 @ManyToOne 注解的单值属性（表示功能关联），默认值为\
    \ `FetchType.EAGER`，因此引用的实体会与引用实体一起获取；而在非功能关联（使用 @OneToMany 或 @ManyToMany）的情况下，默认值为\
    \ `FetchType.LAZY`，因此引用的实体不会与引用实体一起获取，而如果需要，必须单独获取。\n\n由于 JPA 注解的作用，将生成用于创建表的\
    \ SQL 表创建语句：\n\n```sql\nCREATE TABLE IF NOT EXISTS `books` (\n  `ISBN` varchar(10)\
    \ NOT NULL,\n  `TITLE` varchar(255) NOT NULL,\n  `YEAR` int(11) NOT NULL,\n  `PUBLISHER_NAME`\
    \ varchar(255) DEFAULT NULL,\n  FOREIGN KEY (`PUBLISHER_NAME`) REFERENCES `publishers`\
    \ (`NAME`)\n);\n```\n\n### 4.4.3 编写约束\n\n请确保实体类模型中指定的所有属性约束都已使用合适的 Bean Validation\
    \ 注解正确编码。例如，对于属性名，我们必须使用 JPA 注解 @Id 来指定映射到实体类的的数据库表的主键列，并使用 Bean Validation 注解\
    \ @NotNull 来定义强制性值约束，该约束在实体保存到数据库之前会进行检查。\n\n在 `address` 属性的情况下，我们必须以两种形式定义强制性值约束：使用\
    \ JPA 注解 @Column(nullable=false) 对应表列，以及使用 Bean Validation 注解 @NotNull 对应该属性。\n\
    \n```java\n@Id @NotNull(message=\"A name is required!\")\nprivate String name;\n\
    ```\n\n```java\n@Column(nullable=False)\n@NotNull(message=\"An address is required!\"\
    )\nprivate String address;\n```\n\n请注意，遗憾的是，当前的 Java EE 技术需要定义两次相同的约束：一次是以 JPA\
    \ 注解的形式针对数据库，另一次是以 Bean Validation 注解的形式针对 Java 应用。\n\n### 4.4.4 编写 Getter 和 Setter\n\
    \n将 setter 操作编写为（实例级）方法。setters 只负责赋值，不执行任何验证，因为属性约束仅在 Java EE 执行环境在保存之前进行检查。getters\
    \ 只是简单地返回属性的实际值。\n\n### 4.4.5 实现删除策略\n\n对于任何引用属性，我们必须选择并实现一种删除策略，以处理引用属性类范围的 `delete`\
    \ 方法中相应的对象销毁依赖。在我们的案例中，我们必须在以下两者之间选择：\n\n1. 删除所有由被删除出版者出版的书；\n2. 从所有由被删除出版者出版的书中删除对该删除出版者的引用。\n\
    \n我们选择第二种策略，该策略仅适用于可选的引用属性（如 `book.publisher`）。这在下面 `Publisher.delete` 方法的代码中显示，其中对于所有相关的实体，`book`\
    \ 属性都被清空了：\n\n```java\npublic static void delete(EntityManager em, UserTransaction\
    \ ut, String name) throws Exception {\n    ut.begin();\n    Publisher publisher\
    \ = em.find(Publisher.class, name);\n    // 查找所有拥有此出版者的书籍\n    Query query = em.createQuery(\n\
    \    \"SELECT b FROM Book b WHERE b.publisher.name = :name\");\n    query.setParameter(\"\
    name\", name);\n    // ... (其余逻辑)\n}\n```\n\n```java\nList<Book> books = query.getResultList();\n\
    // 清空这些书籍的出版者引用\nfor ( Book b: books) { \n    b.setPublisher(null);\n}\nem.remove(publisher);\n\
    ut.commit();\n```\n\n方法遍历所有引用待销毁出版者的 Book 实体，并将其 publisher 属性设置为 null。\n\n###\
    \ 4.4.6 序列化与反序列化\n\n基于 JPA 注解，结合需要时合适的转换器类，序列化（从 Java 对象到表行）以及相应的反序列化（从表列到 Java\
    \ 对象）会自动完成。\n\n## 4.5 视图与控制器层\n\n用户界面（UI）包含一个用于导航到数据管理 UI 页面的起始页，以及每个对象类型和每个数据管理用例的\
    \ UI 页面。所有 UI 页面都定义在 WebContent/Views/ 文件夹子目录下的 JSF 视图文件中。我们在 WebContent/Views/content\
    \ 子文件夹中创建主页 `index.xhtml`，内容如下：\n\n```xml\n<!DOCTYPE html>\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
    \ xmlns:ui=\"..\" xmlns:f=\"..\">\n<ui:composition template=\"/WEB-INF/templates/page.xhtml\"\
    >\n  <ui:define name=\"content\">\n    <h2>Public Library</h2>\n    <h:button\
    \ value=\"Manage publishers\" outcome=\"/views/publishers/index\" />\n    <h:button\
    \ value=\"Manage books\" outcome=\"/views/books/index\" />\n    <h:form>\n   \
    \   <h:commandButton value=\"Clear database\" action=\"#{appCtrl.clearData()}\"\
    \ />\n      <h:commandButton value=\"Create test data\" action=\"#{appCtrl.createTestData()}\"\
    \ />\n    </h:form>\n  </ui:define>\n</ui:composition>\n</html>\n```\n\n它创建了菜单，为每个视图提供了相应的按钮。此外，我们需要创建一个对应的\
    \ `AppController` 类，负责测试数据的创建和删除。控制器结合了 `Publisher` 和 `Book` 方法：\n\n```java\n\
    @ManagedBean(name=\"appCtrl\") @SessionScoped\npublic class AppController {\n\
    \    @PersistenceContext(unitName=\"UnidiroApp\")\n    private EntityManager em;\n\
    \    @Resource\n    UserTransaction ut;\n\n    public String clearData() {\n \
    \       try {\n            ut.begin();\n            // 清空数据的逻辑\n            ut.commit();\n\
    \        } catch (Exception e) {\n            e.printStackTrace();\n        }\n\
    \        return \"index\";\n    }\n\n    public String createTestData() {\n  \
    \      try {\n            ut.begin();\n            // 创建数据的逻辑\n            ut.commit();\n\
    \        } catch (Exception e) {\n            e.printStackTrace();\n        }\n\
    \        return \"index\";\n    }\n}\n```\n\nBook 和 Publisher数据的删除必须按照特定顺序进行（先删除书籍）。\n\
    \n### 4.5.1 初始化应用\n\n由于代码运行在 Tomcat 容器中，初始化由容器内部完成。\n\n### 4.5.2 在检索/列表中显示关联对象信息\n\
    \n在我们的示例中，我们只有一个引用属性 `Book::publisher`，它是功能性的。为了在检索所有书籍时显示可选出版者的信息，我们使用如下代码，相应的表格列将填充出版者的名称：\n\
    \n```xml\n<ui:composition template=\"/WEB-INF/templates/page.xhtml\">\n  <ui:define\
    \ name=\"content\">\n    <h:dataTable value=\"#{bookCtrl.books}\" var=\"b\">\n\
    \      <h:column>\n        <f:facet name=\"header\">Publisher</f:facet>\n    \
    \    #{b.publisher.name}\n      </h:column>\n    </h:dataTable>\n    <h:button\
    \ value=\"Main menu\" outcome=\"index\" />\n  </ui:define>\n</ui:composition>\n\
    ```\n\n注意 #{b.publisher.name} JSF 表达式中的级联调用，它访问了书籍实例 b 的出版者属性的属性。\n\n### 4.5.3\
    \ 在创建和更新中选择关联对象\n\n在本节中，我们将讨论如何创建和更新具有引用属性的对象，例如具有 `publisher` 引用属性的 `Book` 对象。\n\
    \n### 4.5.3.1 创建对象到字符串的转换器\n\nHTML 需要字符串或数值来填充表单。在我们的案例中，`Book` 类的 `publisher`\
    \ 属性是一个对象引用。JSF 允许将对象转换为\n\n"
