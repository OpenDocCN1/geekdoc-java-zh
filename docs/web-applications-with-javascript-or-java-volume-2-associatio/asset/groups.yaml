    \    </h:dataTable>\n<h:button value=\"Back\" outcome=\"index\" />\n</ui:define>\n\
    </ui:composition>\n```\n\nRecall that using b.authorNames results in invoking\
    \ a method named getAuthorNames on the given b object.\n\n### 5.5.2 Allow Selecting\
    \ Associated Objects in Create\n\nFor allowing to select multiple authors to be\
    \ associated with a book in the create book case, a multiple selection list (a\
    \ select element with multiple=\"multiple\"), as shown in the facet code, is populated\
