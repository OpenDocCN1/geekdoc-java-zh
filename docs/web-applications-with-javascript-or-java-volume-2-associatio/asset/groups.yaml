    \ which we are going to use throughout the JavaScript code discussed in this book.\n\
    \n## 2.1 New JavaScript Elements\n\nIn this section, we present the most important\
    \ new language elements introduced to JavaScript by ECMAScript 2015+ (that is,\
    \ 2015+16+17+18+19+20+…).\n\n### 2.1.1 Block-Scope Variable Declarations with\
    \ let and const\n\nES5 did not allow declaring the scope which is a block delimited\
    \ by curly braces, { }. Rather, all variables declared with var, if declared within\
    \ a block, have either a function scope or the global scope. The new feature of\
    \ block-scope variable declarations with let and const allows declaring local\
    \ variables with a finer-grained scope, which helps avoiding duplications and\
    \ leads to more modular code. There is one difference between let and const. Variables\
    \ with const are frozen or immutable, and in this sense constant, while let variables\
    \ are not. It is preferable to use const for all variables that are not supposed\
    \ to change their values. Otherwise, if this is not clear, one should declare\
    \ the variable with let if it is block-scoped variable, or with var if it is function-scoped\
    \ variable.\n\n### 2.1.2 Arrow Functions\n\nCompared to classical functions, arrow\
    \ functions (with =>) provide a more concise expression syntax, and allow using\
    \ JavaScript's outer environment (its *closure*) in their function body, see Ex.\n\
    \n```javascript\nlet evens = [0, 2, 4, 6, 8];\nodds = evens.map(v => v+1); //\
    \ instead of evens.map(function (v) { return v+1; });\n```\n\n### 2.1.3 For-Of\
    \ Loop over Iterable Objects\n\nIterable objects include strings, array-like objects\
    \ (e.g. HTMLCollection and NodeList), datatype TypedArray, Map, and Set, and user-defined\
    \ iterables. For-of loop is often more handy than forEach loop whenever a counter\
