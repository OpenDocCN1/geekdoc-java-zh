    # 5.2 Make a Java Entity Class Model


    Our starting point for making a Java Entity class model is the following OO class:


    | Book | Publisher |

    |--- |--- |

    | isbn[1] : String (id) | name : String (id) |

    | title[1] : String | adress : String |

    | year[1] : Integer | |

    | publisher[0..1] : Publisher | |

    | authors[*] : Author | |

    | | Author |

    | | personid : integer (id) |

    | | name : String |


    This model contains, in addition to the single-valued-one reference property Book::publisher
    representing the unidirectional many-to-one association Book-has-Publisher, the
    multi-valued reference property Book::authors representing the unidirectional
    many-to-many association Book-has-Author.


    Recall that we obtain a Java Entity class, like Author, from the corresponding
    class in the OO class model, by (1) making all properties private, (2) using Java
    data-type classes, (3) adding public getters and setters, (4) adding a toString
    function, (5) adding the data storage methods create, retrieve, update and delete:


    | «Java Entity» Author |

    |---|

    | +get/set-personid : Integer (id) |

    | +get/set-name : String |

    | +checkPersonidAid(in pid : Integer, in em : EntityManager) : ConstraintViolation
    |

    | +toString() : String |

    | +(...) |


    In the Java Entity class model, any reference property specified in the OO model
    is annotated with the functionality type of the association represented by it.'
- md: "\nIn our example, we annotate the property authors in the Entity class Book\
    \ with manyToMany:\n\n| «Java Entity |\n| --- |\n| <<get/set>-isbn[1] : String\
    \ (id) |\n| <<get/set>-title[1] : String |\n| <<get/set>-year[1] : Integer |\n\
    | <<get/set>-publisher[0..1] : Publisher (manyToOne) |\n| <<get/set>-authors[*]\
    \ : Author (manyToMany) |\n| +checkisbnAid(in isbn : String, in em : EntityManager)\
    \ : ConstraintViolation |\n| +addAuthor(in author : Author) |\n| +removeAuthor(in\
    \ author : Author) |\n| +toString() : string |\n| +-() |\n\n## 5.3 New Issues\n\
    \nCompared to dealing with a unidirectional functional association, as discussed\
    \ in the previous section, we have to deal with the following new technical issues:\n\
    1. In **model classes** we have to take care of **multi-valued reference properties**\
    \ that have to be annotated with `@OneToOne` or `@ManyToMany`.\n2. In the **user\
    \ interface** code we have to take care of:\n- 1. showing information about a\
    \ collection of associated objects in the view table columns that render multi-valued\
    \ reference properties in the **retrieve**-list all objects use case;\n- 2. allowing\
    \ to select a collection of associated objects from a list of all existing instances\
    \ of the target class in the **create** object and **update** object use cases.\n\
    \nThe last issue, allowing to select a collection of associated objects from a\
    \ list of all existing instances of some class, in general, cannot be solved with\
    \ the help of an HTML select multiple element because of usability problems. Whenever\
    \ the set selectable options is greater than a certain threshold (defined by the\
    \ number of options that can be seen on the screen while scrolling), the HTML\
    \ select multiple element is no longer usable, and an alternative **multi-selection**\
    \ widget to be used.\n\n## 5.4 Write the Model Code\n\nThe Java Entity class model\
    \ can be directly coded for implementing the model layer of our Java back-end\
    \ app.\n\n### 5.4.1 Summary\n\nCode each class of the Java Entity class model\
    \ as a corresponding entity class.\n\n1. Code any id [id] property modifier with\
    \ the JPA property annotation @Id.\n2. Code any property modifier denoting the\
    \ functionality type of a reference property, such as [ManyToOne], with the corresponding\
    \ JPA annotation, such as @ManyToOne.\n3. Code the integrity constraints specified\
    \ in the model with the help of Java Bean Validation annotations (or custom validation\
    \ annotations).\n4. Code the getters and setters as well as the add and remove\
    \ methods for multi-valued properties.\n5. Code the create, retrieve, update and\
    \ delete storage management operations as class-level methods.\n\nThese steps\
    \ are discussed in more detail in the following sections.\n\n### 5.4.2 Each Class\
    \ of the Java Entity Class Model\n\nFor the multi-valued reference property Book::authors\
    \ we use a parametrized Set type:\n\n```java\n@Entity @Table (name=\"books\")\n\
    @ViewScoped @ManagedBean (name=\"book\")\npublic class Book {\n\n    @ManyToMany\
    \ (fetch=FetchType.EAGER)\n    private Set<Author> authors;\n\n    public Book()\
    \ {}\n    public Book(String isbn, String title, Integer year,\n             \
    \  Publisher publisher, Set<Author> authors) { . . . }\n\n    public Set<Author>\
    \ getAuthors() { return this.authors; }\n    public void setAuthors(Set<Author>\
    \ authors) { this.authors=authors; }\n\n}\n```\n\nThe JPA annotation @ManyToMany\
    \ allows to specify the Many-To-Many relation between the Book and Author. The\
    \ annotation parameter FetchType.EAGER is used, so when a Book instance is created,\
    \ the list of authors is populated with the corresponding Author instances. As\
    \ a result of this annotation, a relation table between Book and Author is created,\
    \ and the resulting SQL code is shown below:\n\n```sql\nCREATE TABLE IF NOT EXISTS\
    \ 'books_author' (\n  'Book_ISBN' varchar(10) NOT NULL,\n  'authors_PERSONID'\
    \ int(11) NOT NULL\n);\n```\n\nThe resulting class name is the underscore-separated\
    \ concatenation of the corresponding table names (e.g., books_author). The primary\
    \ key columns from each of the two tables are used to implement the relation.\
    \ The corresponding column names are created as follows:\n- for the table (e.g.,\
    \ books), the primary key is used.\n\nIt is possible to control these parameters,\
    \ i.e., by using @JoinTable annotation. In our application, we keep the default,\
    \ so @JoinTable is not used.\n\nThe Java Entity class is created as follows:\n\
    \n```java\n@Entity @Table (name=\"author\")\n@ViewScoped @ManagedBean (name=\"\
    book\")\npublic class Author {\n  // Properties\n  @Id (nullable=false)\n  private\
    \ Integer personId;\n  @NotNull (message=\"required\")\n  private String name;\n\
    \  @Positive\n  private Date dateBirth;\n  @Positive\n  private Date dateOfDeath;\n\
    \n  // Constructors\n  public Author(Integer personId, String name, Date dateBirth,\
    \ Date dateOfDeath) { . . }\n\n  // Setters/getters\n  // Data management operations\n\
    \  public static void create(EntityManager em, UserTransaction ut, Integer personId,\
    \ String name, Date dateBirth, Date dateOfDeath) { . . }\n  public static void\
    \ update(.. .) { . . }\n  public static void delete(.. .) { . . }\n}\n```\n\n\
    ## 5.4.3 Implement a Deletion Policy\n\nFor the reference property Book::authors,\
    \ we have to implement a deletion policy in the delete method of Author class.\
    \ If we just try to delete an author, and the author is referenced by any of the\
    \ book records, then an integrity constraint violation is raised, and the author\
    \ cannot be deleted. We have two possibilities for dealing with this:\n1. delete\
    \ all books (co-)authored by the deleted author;\n2. drop from all books (co-)authored\
    \ by the deleted author the reference to the deleted author.\n\nWe go for the\
    \ second option. This is shown in the following code of the Author.delete method:\n\
    \n```java\npublic static void delete(EntityManager em, UserTransaction ut, Integer\
    \ personId) throws Exception {\n  ut.begin();\n  Author author = em.find(Author.class,\
    \ personId);\n  // Find all books of this author\n  Query query = em.createQuery(\"\
    SELECT DISTINCT b FROM Book b \" +\n  \"INNER JOIN b.authors WHERE a.personId\
    \ = :personId\");\n  query.setParameter(\"personId\", personId);\n  List<Book>\
    \ books = query.getResultList();\n  // Remove the author reference from the books'\
    \ authors list\n  for (Book b : books) {\n    b.getAuthors().remove(author);\n\
    \  }\n\n  // Delete the author record (table row)\n  em.remove(author);\n  ut.commit();\n\
    }\n```\n\nEssentially, the delete operation consists of three steps:\n1. Create\
    \ a JPQL query which selects all books of this author.\n2. For every found book\
    \ referencing this author, we have to remove the author reference from its authors\
    \ list.\n3. Finally, delete the author record.\n\n## 5.4.4 Serialization and De-Serialization\n\
    \nIn Java EE, the serialization from objects to corresponding database records\
    \ as well as the de-serialization from database records to objects are performed\
    \ automatically by the Java EE execution environment based on JPA annotations\
    \ and converter classes for custom conversions.\n"
