    Based on JPA annotations, together with suitable converter classes when needed,
    serialization (from Java objects to table rows) as well as the corresponding de-serialization
    (from table columns to Java objects) are performed automatically.


    # 4.5 The View and Controller Layers


    User interface (UI) consists of a start page for navigating to the data management
    UI pages and one UI page for each object type and data management use case. All
    UI pages are defined in the form of JSF view files in subfolders of WebContent/Views/
    folder. We create the Main page index.xhtml in the subfolder WebContent/Views/content
    with the following content:


