- md: "\n## 5.5 Write the User Interface Code\n\n### 5.5.1 Show Information About\
    \ Associated Objects in Retrieve/List All\n\nFor showing information about the\
    \ authors of a book in the retrieve/list all books case, the corresponding cell\
    \ in the HTML table has to be filled with a list of the names of all authors.\
    \ For this, we implement a method in the Book class which returns the serialized\
    \ list of author names (the form, authorName_1, authorName_2, ..., authorName_n):\n\
    \n```java\npublic String getAuthorNames() {\n  String result = \"\";\n  int i\
    \ = 0, n = 0;\n  if (this.authors != null) {\n    n = this.authors.size();\n \
    \   for (Author author : this.authors) {\n      result += author.getName();\n\
    \      if (i < n-1) {\n        result += \",\";\n      }\n      i++;\n    }\n\
    \  }\n  return result;\n}\n```\n\nIn the file retrieveAndList.xhtml in the folder\
    \ WebContent/views/books/, this method is invoked in the JSF expression of the\
