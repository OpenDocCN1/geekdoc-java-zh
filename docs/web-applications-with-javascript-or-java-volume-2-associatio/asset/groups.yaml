    \ 之间的子类型关系。例如，在 `m/Employee.js` 中我们定义：\n\n`EmployeeCategoryEL = new Enumeration([\"\
    Manager\"])`\n\n```javascript\nclass Employee extends Person {\n  constructor({personId,\
