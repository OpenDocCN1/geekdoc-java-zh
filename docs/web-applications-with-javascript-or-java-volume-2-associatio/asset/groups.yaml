    each concrete class of the class hierarchy as a table, such that each subclass
    is represented by a table that also contains columns for inherited properties,
    thus repeating the columns of the table that represents superclass.


    | SQL table | SQL table |

    | :--- | :--- |

    | people | employees |

    | person_id : INTEGER (pkey) | person_id : INTEGER (pkey) |

    | name : VARCHAR | name : VARCHAR |

    | | emp_no : INTEGER (unique) |

    | authors | managers |

