    The book can be used


    +   1. in web development courses for students of Computer Science or Information
    Systems and related disciplines;

    2. by JavaScript developers for learning Java;

    3. by Java developers for learning JavaScript;

    4. by JavaScript and Java (and PHP/Python/C#) developers for learning

    - object-oriented (OO) programming with JavaScript or Java,

    - how to implement basic information management concepts and build complete web
    apps with plain JavaScript or Java.


    The book comes with the complete source code of six example apps that you can
    run or download from our web server.'
