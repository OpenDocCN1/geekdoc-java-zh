    This *Hierarchy Merge* design pattern comes in two. In its simplest form, the
    segmentations of the original class hierarchy are disjoint, which allows to use
    a single-valued category attribute for representing the specific category of each
    instance of the root class corresponding to the unique subclass instantiated by
    it. When the segmentations of the original class hierarchy are not disjoint, that
    is, when at least one of them is overlapping, we need to use a multi-valued category
    attribute for representing the set of types instantiated by an object. We only
    discuss the simpler case of *Hierarchy Merge* re-factoring for disjoint segmentations,
    where we take the following re-factoring steps:


    +   1. Add an enumeration datatype that contains a corresponding enumeration for
    each segment subclass. In our example, we add the enumeration datatype CategoryEL.


    +   2. Add a category attribute to the root class with this enumeration as its
    range. The category attribute is mandatory [1], if the segment is complete, and
    optional [..]. In our example, we add a category attribute with range BookCategoryEL
    to the class. The category attribute is optional because the segmentation of Book
    into Textbook and Biography is incomplete.


    +   3. When the segmentation is rigid, we designate the category attribute as
    frozen, which means that it can only be assigned by setting its value when creating
    a new object, but it cannot be changed.


    +   4. Move the properties of the segment subclasses to the root class, and make
    them optional. We call these properties, which are typically listed below the
    category attribute, segment properties. In our example, we move the attributes
    subjectArea from Textbook and about Biography to Book, making them subjectArea
    optional, that is [..].


    +   5. Add a constraint (in an invariant box about the expanded root class angle)
    enforcing that the optional subclass properties have a value if only if the instance
    of the root class instantiates the corresponding category. In our example, this
    means that an instance of Book is of category “Textbook” and if only if its attribute
    subjectArea has a value, and it is of category “Biography” if and only if its
    attribute has a value.


    +   6. Drop the segment subclasses from the model.


    In the case of our example, this design re-factoring is shown in Figure 12.7 below.
    Notice that the constraint (or “invariant”) represents a logical sentence where
    the logical operator keyword “IFF” stands for the logical equivalence “if and
    only if” and the property condition prop=undefined tests if the property does
