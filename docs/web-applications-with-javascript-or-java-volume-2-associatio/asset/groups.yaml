    \ `get/set` 方法和静态检查函数。然而，在我们的应用中，将**类层次结构合并**设计模式（在 12.6 节讨论）应用于 `Employee` 的单子子类分段，通过消除\
    \ `Manager` 子类来简化类模型。这导致了图 13.2 所示的模型。注意，`Person` 可以是 `Employee` 也可以是 `Author`。\n\
    \n| Person |\n| :--- |\n| «get/set» personid: Integer (id) |\n| «get/set» name:\
