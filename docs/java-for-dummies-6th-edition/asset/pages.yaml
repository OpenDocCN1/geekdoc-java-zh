    \ Well, a Java program is like an outline. The program in Listing 3-1 starts with\
    \ a big header that says, \"Here comes a class named Display.\" After that first\
    \ big header, a subheader announces, \"Here comes a method named main.\"\n\nNow,\
    \ if a Java program is like an outline, why doesn't a program look like an outline?\
    \ What takes the place of the Roman numerals, capital letters, and other things?\
    \ The answer is twofold:\n\n+   - In a program, curly braces enclose meaningful\
    \ units of code.\n- You, the programmer, can (and) indent lines that other programmers\
    \ can see the outline form of your code at a glance.\n\nIn an outline, everything\
    \ is subordinate to the item in Roman numeral I. In a Java program, everything\
    \ is subordinate to the top line — the line class in it. To indicate that everything\
    \ else in the code is subordinate to this class line, you use curly braces. Everything\
    \ else in the code goes inside these curly braces (See Listing 3-4).\n\n# Listing\
    \ 3-4: Curly Braces for a Java Class\n\n```\npublic class Displayer {\n\n    public\
    \ static void main(String[] args[]) {\n        System.out.println(\"You'll love\
    \ Java!\");\n    }\n}\n```\n\nIn an outline, some stuff is subordinate to a capital\
    \ letter A. In a Java program, some lines are subordinate to the method header.\
    \ To indicate that something is subordinate to a method header, you use curly\
