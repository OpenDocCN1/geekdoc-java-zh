  md: '# Chapter 4: Making the Most of Variables and Their Values


    A subtle, almost unnoticeable difference exists between a variable and a variable''s
    name. In formal writing, I often use the variable when I mean variable name. Strictly
    speaking, amountAccount is a variable name, and all the memory storage associated
    with amountAccount (including the type that amountAccount has and whatever value
    amountAccount currently presents) is the variable itself. If you think this distinction
    between variable and variable name is too subtle to worry about, join the club.


    Every variable name is an identifier — a name that you can make up in code. In
    Preparing 4-1, I made up the name amountAccount.


    For more information on the kinds of names in a Java program, see Chapter 3.


    Before the sun on Listing 4-1, you will need to notice one part of the listing.
    The listing has 50.22 and 1000000.00 in. Anyone or his right mind would call these
    numbers, but in a Java program it helps to call these literals.


    And what''s literal about 50.22 and 1000000.00? Well, think about the variable
    amountAccount in Listing 4-1. The variable amountAccount stands for 50.22 some
    of the time, but it stands for 100050.22 the rest of the time. You could use the
    word number to talk about amountAccount. But really, what amountAccount stands
    depends on the fashion of the moment. On the other hand, 50.22 literally stands
    for the value 50/float.


    A variable value changes; a literal''s does.


    Starting with Java 7, you can add underscores to your numeric literals. Instead
    of using the old 1000000.00 in Listing 4-1, you can write amountAccount = amountAccount
    + 1_000_000_00. Unfortunately, you can''t easily do what you''re tempted to do.
    You can''t write 1,000,000.00 (as you would in the United States), nor can you
    write 1.000.000.00 (as you would in Germany). If you want to write 1,000,000.00,
    you have to use some fancy formatting tricks. For more information about formatting,
    check Chapters 10 and 11.


    # Assignment Statements


    Statements like the ones in Listing 4-1 are called assignment statements. In an
    assignment statement, you assign a value to something. In many cases, this something
    is a variable.


    I recommend getting into the habit of reading assignment statements from right
    to left. Figure 4-2 illustrates the action of the first line in Listing 4-1.'
