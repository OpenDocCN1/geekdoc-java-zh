- pgno: 366
  md: "# Chapter 15: Responding to Keystrokes and Mouse C 353\n\n+   * A class can\
    \ extend only one parent class, but a class can implement more than one interface.\n\
    \nFor instance, if you want GameFrame to listen for keystrokes as well as button\
    \ clicks, you can say\n\n```\nclass GameFrame extends JFrame\nimplements ActionListener,\
    \ ItemListener\n```\n\n+   * An interface's methods have no bodies of their own.\n\
    \nHere's a copy of the API code for the ActionListener interface:\n\n```\npackage\
    \ java.awt;\n\nimport java.util.EventListener;\n\npublic interface ActionListener\n\
    \    extends EventListener {\n\n    public void actionPerformed(ActionEvent e);\n\
    }\n```\n\nI've removed the comments, but I have avoided messing with the API code\
    \ in any significant ways. In this code, the actionPerformed method has no body\
    \ — no braces and no statements to execute. In place of a body, there's just a\
    \ semicolon.\n\nA method with no body, like the method defined in the ActionListener\
    \ interface, is called an abstract method.\n\n+   * When you implement an interface,\
    \ you provide bodies for all the interface's methods.\n\nThat's why an actionPerformed\
    \ method appears in Listing 15-1. By announcing that the code will implement the\
    \ ActionListener interface, the code in Listing 15-1 agrees that it will give\
    \ meaning to the interface's actionPerformed method. In this situation, giving\
    \ means declaring an actionPerformed method with curly braces, a body, and maybe\
    \ some statements to execute.\n\nWhen you're going to implement an interface,\
    \ the Java compiler takes this announcement seriously. Later on in the code, if\
    \ you fail to give meaning to any of the interface's methods, the compiler tells\
    \ you.\n\nIf you're really lazy, you can quickly find out what methods need to\
    \ be declared in your interface-implementing code. Try to compile the code, and\
    \ the compiler lists all the methods that you should have declared but didn't.\n\
    \n![](img/be49a553c8cd52419c36f97f5ee90278_366_0.png)\n\n![](img/be49a553c8cd52419c36f97f5ee90278_366_1.png)"
