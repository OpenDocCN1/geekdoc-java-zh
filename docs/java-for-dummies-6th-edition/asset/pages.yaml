  md: '# Part II: Writing Own Java Programs


    # Creating randomness


    Achieving real randomness is surprisingly difficult. Mathematician Pers Diaconis
    says that if you flip a coin several times, always starting with the head up,
    you''re likely to toss heads more often than tails. If you toss several times,
    always starting with the tail side up, you''ll likely toss tails more than heads.
    In other words, tossing isn''t really fair.


    Computers aren''t much better than coins and human thanks. Computer mimics the
    generation of random sequences, but in the end, the computer does what it''s told
    and does all this in a purely deterministic fashion. In Listing 5-1, when the
    computer executes


    ```

    import java.util.Random;

    int randomNumber = new Random().nextInt(10) + 1;

    ```


    the computer appears to give a randomly generated number — a whole number between
    1 and 10. But it''s all a fake. The computer just follows instructions. It''s
    not really random, but without bending a curve over backwards, it''s the best
    that anyone can do.


    Once again, I ask you to take this code on blind faith. Don''t worry about new
    Random().nextInt means until you have and have fun with it. And if you copy this
    code into your own programs and find the numbers from 1 to 10 in your flight plans,
    don''t fret. To roll an imaginary die, write the statement


    ```

    int rollEmBaby = new Random().nextInt(6) + 1;

    ```


    With the execution of this statement, the variable rollEmBaby gets a value from
    1 to 6.


    # The if statement


    At the core of Listing 5-1 is a if statement. This if statement represents a fork
    in the road. (See Figure 5-2.) The computer follows one of two prongs — the prong
    that prints You win or the prong that You lose. The computer decides which prong
    to take by testing the truth or falsehood of a condition. In Listing 5-1, the
    condition being tested


    ```

    inputNumber == randomNumber

    ```


    > * Diaconis, Persi. "The Search for Randomness." American Association for the
    Advancement of Science annual meeting. Seattle: Feb. 2004.'
