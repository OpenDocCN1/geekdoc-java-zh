  md: "# Chapter 3: Using the Basic Building Blocks\n\nThe word main plays a special\
    \ role in Java. In particular, you never write code that explicitly calls a main\
    \ method into action. The word main is the name of the method that is called into\
    \ action automatically when the program begins running.\n\nSo look back at Figure\
    \ 3-1. When the Display program runs, the computer automatically finds the main\
    \ method and executes any instructions inside the method's body. In the Display\
    \ program, the main method's body has only one instruction. That instruction tells\
    \ the computer to print You'll love Java on the screen. So in Figure 3-1, You'll\
    \ Java! appears on the computer screen.\n\nThe instructions in a method are not\
    \ executed until the method is called into action. But, if you give a method the\
    \ main name, that method is called into action automatically.\n\nAlmost every\
    \ programming language has something akin to Java's methods. If you've worked\
    \ with other languages, you may remember things like subprograms, procedures,\
    \ functions, subroutines, subprocedures, or PERFORM statements. Whatever you call\
    \ it in your favorite programming language, a method is a bunch of instructions\
    \ collected and given a new name.\n\n![](img/be49a553c8cd52419c36f97f5ee90278_60_0.png)\n\
    \n# How you finally tell the computer to do something\n\nBuried deep in the heart\
    \ of Listing 3-1 is the single line that actually issues a direct instruction\
    \ to the computer. The line, which is highlighted in Figure 3-4, tells the computer\
    \ to display You'll love Java! This line is a statement. In Java, a statement\
    \ is a direct instruction that tells the computer to do something (for example,\
