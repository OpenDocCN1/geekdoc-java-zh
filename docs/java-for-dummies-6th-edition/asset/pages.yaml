  md: '# Chapter 7: Thinking in Terms of Classes and Objects


    # One program; several classes


    Each program in Chapters 3 to 6 consists of a single class. That''s great for
    a book''s introductory chapters. But in real life, a typical program consists
    of hundreds or even thousands of classes. The program that spans 7-1 and 7-2 consists
    of two classes. Sure, having two classes isn''t like having thousands of classes,
    but it''s a step in that direction.


    In practice, most programmers put each class in a file of its own. When you create
    a program, such as the one in the Listings 7-1 and 7-2, you create two files on
    your computer''s hard drive. Therefore, when you download this section''s example
    from the web, you get two files — Account.java and Use.java.


    ![](img/be49a553c8cd52419c36f97f5ee90278_158_0.png)


    For information about running a program consisting of more than one .java file
    in Eclipse, NetBeans and IntelliJ IDEA, visit this book''s website (www.allcode.com/JavaForDummies).


    # Public classes


    The first line of Listing 7-1


    ```

    public class Account {

    ```


    The Account class is public. A public class is available for use by all other
    classes. For, if you write an ATMController program in remote corners of cyberspace,
    your ATMController program can contain code, such as myAccount.balance = 24.02,
    making use of the Account class declared in Listing 7-1. (Of course, the class
    has to know in cyberspace-I''ve stored the code in Listing 7-1, but that''s another
    story.)


    Listing 7-2 contains the code myAccount.balance = 24.02. You might say to yourself,
    "The Account class is public because another class (the code in Listing 7-2) uses
    the Account class." Unfortunately, the real lowdown about public classes is a
    bit more complex. In fact, when the planets align themselves, one class can use
    of another class''s code, though the other class isn''t public. (I cover the proper
    aligning of planets in Chapter 14.)


    The dirty secret in this chapter''s code is that declaring certain classes to
    be public simply makes me feel good. In Listing 7-1, my aesthetic sense of goodness
    comes from the fact that an Account class is useful to many other programmers.
    When I create a class that declares something useful and nameable — an Account,
    an Engine, a Customer, a BrainWave, a Headache, or a SevenLayer cake — I declare
    the class to be public.'
