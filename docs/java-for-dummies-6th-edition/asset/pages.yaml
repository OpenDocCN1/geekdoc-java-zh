    \n# Writing to a file\n\nThe code in Listing 11-4 uses from other chapters and\
    \ sections of this book. The code's only brand-new feature is the use of PrintStream\
    \ to write to a disk file. Think about any example in this book that calls System.out.print,\
    \ print.out.println, or their variants. What's really going on when you call one\
    \ of these methods?\n\nThe thing called System.out is an object. The object is\
    \ defined in the Java API. In fact, System.out is an instance of a class named\
    \ java.io.PrintStream (or just PrintStream to close friends). Each object created\
    \ from the PrintStream class has methods print and println. As each Account object\
    \ in Listing 7-3 has a display method, and as the DecimalFormat object in Listing\
    \ 10-1 has a format method, so the PrintStream object named has print and println\
    \ methods. When you call System.out.println, you're calling a method that belongs\
    \ to a PrintStream instance.\n\nOkay, so what of it? System.out always stands\
    \ for some text on your computer screen. If you create your PrintStream object\
    \ and make that object refer to a disk file, that PrintStream object refers to\
    \ the disk file. When you call that object's print method, you write text to a\
    \ file on your hard drive.\n\nSo in Listing 11-4, when you say\n\n```\nPrintStream\
    \ listOut =\n    new PrintStream(\"GuestList.txt\");\nlistOut.print(guests[roomNum]);\n\
    listOut.print(\" \");\n```"
