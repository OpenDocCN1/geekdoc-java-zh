  md: '# 12 Part I: Getting Started with Java


    +   1959: Grace Hopper Remington Rand develops the COBOL programming language.


    The B in COBOL stands for Business, and business is just what COBOL is all about.
    The language''s primary feature is the processing of one record after another,
    one customer after another, or one employee after another.


    Within a few years after its initial development, COBOL became the most widely
    used language for business processing. Even today, COBOL represents a large part
    of the computer programming industry.


    +   1972: Dennis Ritchie at AT&T Bell Labs develops the C programming language.


    The "look and feel" that you see in this book''s examples comes from the C programming
    language. Code in C uses curly braces, if-statements, and so on.


    In terms of power, you can use C to solve the problems that you can solve by using
    FORTRAN, Java, or any other modern programming language. (You can write a scientific
    calculator in COBOL, but doing that thing would feel really strange.) The difference
    between programming language and another is not power. The difference is ease
    and appropriateness of use. That''s where the Java language excels.


    +   1986: Bjarne Stroustrup (again at AT&T Bell Labs) develops C++.


    Unlike its C ancestor, the language C supports object-oriented programming. This
    support represents a huge step forward. (See the next section in this chapter).


    +   May 23, 1995: Sun Microsystems releases its first version of the Java programming
    language.


    Java improves upon the concepts in C++. Java''s "Write Once, Run Anywhere" philosophy
    makes the language ideal for distributing code across the Internet.


    Additionally, Java is a great general-purpose programming language. With Java,
    you can write networked applications, build and explore databases, control handheld
    devices, and more. Within five years, the Java language had 2.5 million developers
    worldwide. (I know. I have a commemorative T-shirt to prove it.)


    +   November 2000: The College Board announces that, in the year 2003, the Computer
    Science Advanced Placement exams will be based on Java.


    Wanna know what that-noted kid living down the street is learning in high school?
    You guessed it — Java.


    +   2002: Microsoft introduces a new language C#.


    Many of the C# language features come directly from features in Java.'
