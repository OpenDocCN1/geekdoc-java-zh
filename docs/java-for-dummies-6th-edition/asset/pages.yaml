    # Using generics


    Look again at Listing 12-1, earlier, and notice the funky ArrayList declaration:


    ```

    ArrayList<String> people = new ArrayList<String>();

    ```


    Starting with Java 5.0, each collection class is genified. Ugly-sounding word
    means that every collection declaration should contain some bracketed stuff, like
    <String>. The thing that''s sandwiched between < and > tells what kind of values
    the new collection can hold. For example, in Listing 12-1, the ArrayList<String>
    people tells Java that people is a bunch of strings (not Room objects, not Account
    objects, not Employee objects, nothing other than String objects).


    > Most of this section''s material applies to Java 5.0 and later. You can''t use
    generics in any version of Java before Java 5.0. For more about generics, see
    the sidebar. For more about Java''s numbers, see Chapter 2.


    In Listing 12-1 the ArrayList<String> people say that the people variable can
    refer only to a collection of String values. From that point, any reference to
    an item from the people collection is treated exclusively as a String. If you
    write


    ```

    people.add(new Room());

    ```


    then the compiler coughs up your code and spits it out because a Room (created
    in Chapter 11) isn''t the same as a String. (This coughing and spitting happens
    if the compiler has access to the Room class''s code — the code in Chapter 11)
    But the statement


    ```

    people.add("George Gott");

    ```


    is just fine. "George Gott" has type String, the compiler smiles happily.

    Java 7 and later versions have a cool feature allowing you to abbreviate generic
    declarations. In Listing 12-1, you can use ArrayList<String> people = new ArrayList<String>()
    without repeating the word String a second time in the declaration. The <>> symbol
    without any words inside it is called a diamond operator. The diamond operator
    allows you from having to rewrite it using <String> and over and over.


    ![](img/be49a553c8cd52419c36f97f5ee90278_288_0.png)


    ![](img/be49a553c8cd52419c36f97f5ee90278_288_1.png)'
