  md: '# 190 Part III: Working with the Big Picture: Object-Oriented Programming


    According to the official terminology


    # A Java annotation


    The word @Override in Listing 8-7 is an example of an annotation. A Java annotation
    tells your computer about your code. In particular, the @Override annotation in
    Listing 8-7 tells the Java compiler to be on the lookout for a common coding error.
    The annotation says, "Make sure that the method immediately following this annotation
    has the stuff (the same name, the same parameters, and so on) as one of the methods
    in the superclass. If not, display an error message.


    So if accidentally


    ```

    public double findPaymentAmount(double hours) {

    ```


    instead of it hours as in Listings 8-5 and 8-7, the compiler reminds me that my
    findPaymentAmount method doesn''t really override anything that''s in Listing
    8-5.


    Java has other kinds of annotations (such as @Deprecated and @SuppressWarnings
    Warnings). You can read a bit about the @SuppressWarnings annotation in Chapter
    9.


    Java annotations are optional. If you remove the @Override from Listing 8-7, then
    your code still runs correctly. The @Override annotation gives your code some
    added safety. With @Override, the compiler checks to make sure that you''re doing
    that you intend to do (namely, overriding one of the subclasses'' methods). And
    with apologies to George Orwell, some types of annotations are less optional than
    others. You can omit annotations from your code only if you''re willing to replace
    the annotation with lots and lots of unannotated Java code.


    ![](img/be49a553c8cd52419c36f97f5ee90278_203_0.png)


    # Using methods from classes and subclasses


    If you need clarification on this notion of overriding a method, look at the code
    in Listing 8-8. A run of that is shown in Figure 8-10.'
