  md: '# Chapter 3


    # Using the Basic Building Blocks


    In This Chapter


    +   - Speaking the Java language: the API and the Language Specification

    - Understanding the parts of a simple program

    - Documenting your code


    > "Все мысли, которые имеют огромные последствия всегда просты.

    (All great ideas are simple.)"

    — Leo Tolstoy


    The quotation applies to all kinds of things — things like life, love, and computer
    programming. That''s why this chapter takes a multilayer approach. In this chapter,
    you get your first details about Java programming. And in discovering details,
    you''ll see the simplicities.


    # Speaking the Java Language


    If you try to picture in your mind the entire English language, what do you see?
    May you see words, words, words. (That''s what Hamlet say.) Looking at the language
    under a microscope, but you see one word after another. The bunch-of-words image
    is fine, if you step back a bit, you may see two other things:


    +   - The language grammar

    - Thousands of expressions, sayings, idioms, and historical names


    The first category (grammar) includes rules like, "The verb agrees with the noun
    and number." The second category (expressions, sayings, and stuff) includes knowledge
    like, "Julius Caesar was a famous Roman emperor, so don''t name your son Julius
    Caesar, unless you want him be beaten every day after school."'
  merge: -1
  img_proc: true
- pgno: 51
  md: '# 38 Part I: Getting Started with Java


    The Java programming language has all the aspects of a spoken language like English.
    Java has words, grammar, commonly used names, stylistic idioms, and other things.


    # The grammar and the common names


    The people at Sun Microsystems who created Java thought of Java as having two
    parts. Just as English has its grammar and commonly used names, the Java programming
    language has its specification (its grammar) and its Programming Interface (Its
    commonly used names). Whenever I write Java programs, I keep two important pieces
    of documentation — one for each part of the language — on my desk:


    +   - The Application Programming Interface: Java''s Application Programming Interface
    (API) contains thousands of tools that were added to Java after the grammar was
    defined. These tools range from commonplace to the exotic. For instance, the tools
    include a routine noun that can raise 5 to the 10th for power. A more razzle-dazzle
    tool (JFrame) displays a window on your computer''s screen. Other tools for the
    user''s button clicks, query databases, and do all kinds of useful things.


    ![](img/be49a553c8cd52419c36f97f5ee90278_51_0.png)


    You can download the Language Specification, the API documents, and all the other
    Java documentation (or view the documents online) by poking around at http://docs.oracle.com/java/specs.
    But watch out! This web page is a moving target. By the time you read this, the
    link in this paragraph will be out of date. The safest thing to do is to start
    at Java.Sun.com and then look for links like "Java SE" (short for "Java Standard
    Edition") and "reference" or "documentation".


    The first part of Java, the Language Specification, is relatively small. That
    doesn''t mean you won''t take plenty of time finding out how to use the rules
    in the Language Specification. Other programming languages, however, have double,
    triple, or ten times the number of rules.


    The second part of Java — the API — is intimidating because it''s large. The API
    contains nearly 4000 tools and keeps growing with each new Java language release.
    Pretty scary, eh? The good news is that you don''t have to memorize anything in
    the API. Nothing of it. You can look up the stuff you need to use in the documentation
    and ignore the stuff you don''t need. What you use often, you''ll remember. What
    you don''t use often, you''ll forget (like any other programmer).'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# Chapter 3: Using the Basic Building Blocks


    No all knows there is to know about the Java API. If you''re a Java programmer
    who frequently writes programs that open new windows, you know how to use the
    API JFrame class. If you seldom write programs that open windows, the first few
    you need to create a window, you can look up the JFrame class in the API documentation.
    My guess is that if you took a typical Java programmer and kept that from looking
    up anything in the API documentation, the programmer would be able to use up to
    2 percent of all the tools in the Java API.


    You may love the *Dummies* style, but unfortunately, Java''s official API documentation
    isn''t written that way. The API documentation is both concise and precise. For
    some help deciphering the API documentation''s language and style, see this website
    (www.allmycode.com/JavaForDummies).


    In a way, about the Java API is simple. Whenever you write a Java program — even
    the smallest, Java program — you create a class that''s on par with any of the
    classes defined in the official Java API. The API is just a set of classes and
    other tools that were created by ordinary programmers who happen to participate
    in the official Java Community Process (JCP) and in the OpenJDK Project. Unlike
    the tools that you use, the tools in the API are distributed with every version
    of Java. (I''m assuming that you, the reader, are not a participant in the Java
    Community Process or the OpenJDK Project. But, with a fine book like Java For
    Dummies, 6th Edition, you never knows.)


    If you''re interested in the JCP''s activities, visit www.jcp.org. If you''re
    interested in the OpenJDK Project, visit http://openjdk.java.net.


    The folks don''t keep the programs in the official Java API is a secret. If you
    want, you can look at all these programs. When you install Java on your computer,
    the installation puts a file named src.zip on your hard drive. You can open src.zip
    with your favorite unzipping program. There, before your eyes, is all the Java
    API code.


    # The words in a Java program


    A hard-core Javater will say that the Java programming language has two kinds
    of words: keywords and identifiers. This is true. But the bare truth, without
    any other explanation, is sometimes misleading. I recommend dressing up a bit
    and thinking in terms of three kinds of words: keywords, identifiers that ordinary
    programmers like you and create, and identifiers from the API.'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# 40 Part I: Getting Started with Java


    The differences among these three kinds of words are similar to the differences
    among words in the English language. In the sentence "Sam is a person," the word
    person is like a Java keyword. No matter who uses the word person, the word always
    means roughly the same thing (Sure, you can think of bizarre exceptions in English
    usage, but please don''t).


    The word Sam is like a Java identifier because Sam is a particular. Words like
    Sam, Dinswald, and McGillimaroo aren''t prepared with meaning in the English language.
    These words apply to different people depending on the context and become names
    when people pick one for their newborn kid.


    Consider the sentence "Julius Caesar is a person." If you utter this sentence,
    you''re probably talking about the fellow who ruled Rome until the Ides of March.
    Although the name Julius Caesar isn''t hard-wired into the English language, almost
    everyone uses the name to refer to the same person. If English were a programming
    language, the name Julius Caesar would be an API identifier.


    +   Keywords: A keyword is a word that has its own special meaning in the Java
    programming language, and that meaning doesn''t change from one program to another.
    Examples of keywords in Java include if, else, and do.


    The JCP members, who have the final say on what constitutes a Java program, have
    chosen all the Java keywords. If you think about the two parts of Java, which
    I discuss earlier in the "Grammar and common names" section, the Java keywords
    belong solidly to the Language Specification.


    +   Identifiers: An identifier is a name for something. The identifier''s meaning
    can change from one program to another, but some identifiers'' meanings tend to
    change.


    +   Identifiers created by you and me: As a Java programmer (you a novice programmer),
    you create new names for classes and other things that you describe in your programs.
    Of course, you may name something Prime, and the guy writing your cubicles down
    the hall can call it r-prime. It''s okay because Java doesn''t have a predetermined
    meaning for Prime. In your program, you can make Prime stand for the Federal Reserve''s
    prime rate, and the guy down the hall can make Prime stand for the "bread, roll,
    preserves, and prime rib." A conflict doesn''t arise, because you and your co-worker
    are writing two different Java programs.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# Chapter 3: Using the Basic Building Blocks


    +   * Identifiers from the API: The JCP members have created names for many things
    and thrown almost 40,000 of these names into the Java API. The API comes with
    each version of Java, so these names are available to anyone who writes a Java
    program. Examples of such names are String, Integer, JButton, J JTextField, and
    File.


    Strictly speaking, the meanings of the identifiers in the Java API aren''t cast
    in stone. Though you can make up your own meanings for JButton or JTextField,
    this isn''t a good idea. If you do, you would confuse the dickens out of other
    programmers, who are used to the standard API meanings for these familiar identifier
    names. And even worse, when your code assigns a new meaning to an identifier like
    JButton, you lose any computational power that was created for the identifier
    in the API code. The programmers of Sun Microsystems, the Java Community Process,
    and the JDK Project did all the writing Java code to handle buttons. If you assign
    your own meaning to JButton, you''re be turning back on all the progress made
    in creating the API.


    ![](img/be49a553c8cd52419c36f97f5ee90278_54_0.png)


    Check the list of Java keywords, visit this book''s website (www.allmycode.com/JavaForDummies).


    # Checking Out Java Code for the First Time


    The first time you look at somebody''s Java program, you tend to feel a bit queer.
    The realization that you don''t understand something (or many things) in the code
    can make you nervous. I''ve written hundreds (maybe thousands) of Java programs,
    but I still feel insecure reading someone''s code.


    The truth is finding out about a Java program is a bootstrapping experience. First,
    you gawk in aw of the code. Then you run the program to see what it does. Then
    you stay at the program for a while or read someone''s explanation of the program
    and its parts. Then you gawk a little more and run the program again. Eventually,
    you come to terms with the program. (Don''t believe the wise guys who say they
    never go through these steps. The experienced programmers approach a new project
    safely and carefully.)


    In Listing 3-1, you get a blast of Java code. (Like all novice programmers, you''re
    expected to gawk humbly at the code.) Hidden in the code, I''ve placed some important
    ideas, which I explain in detail in the next section. These ideas include the
    use of classes, methods, and Java statements.'
