  md: "# 330 Part IV: Savvy Java Techniques\n\n```\npublic class Drawing {\n    //\
    \ Your code goes here\n}\n```\n\nIn Java, the public keyword has two slightly\
    \ different meanings — one meaning for members and another meaning for classes.\
    \ Most of this chapter deals with the meaning of public (and other keywords) for\
    \ members. The last part of this chapter (appropriately titled \"Access Modifiers\
    \ for Java Classes\") deals with the meaning for classes.\n\n# Access modifiers\
    \ for members\n\nSure, this is about members. But that doesn't mean that you can\
    \ ignore classes. Members or not, the Java class is still where all the action\
    \ takes place. Each field is declared in a particular class, belongs to that class,\
    \ and is a member of that class. The same is of methods. Each method is declared\
    \ in a particular class, belongs to that class, and is a member of that class.\
    \ Can you use a certain member name in your code? To begin answering the question,\
    \ check whether that place is inside or outside of the member's class:\n\n+  \
    \ If the member is private, only code that's inside the member's class can refer\
    \ directly to that member's name.\n\n```\nclass SomeClass {\n    private int myField\
    \ = 10;\n}\n\nclass SomeObjectClass {\n    public static void main(String args[])\
    \ {\n        SomeClass someObject = new SomeClass();\n\n        //This doesn't\
    \ work:\n        System.out.println(someObject.myField);\n    }\n}\n```"
