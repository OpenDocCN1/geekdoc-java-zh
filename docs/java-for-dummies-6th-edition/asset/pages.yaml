  md: "# 226 Part IV: Savvy Java Techniques\n\nGoing along with your passion for subclasses,\
    \ you put code for team-wide\ntallies in a subclass of the Player class. The code\
    \ is shown in Listing 10-4.\n\n# Listing 10-4: Creating a Team Batting Average\n\
    \n```\nimport java.text.DecimalFormat;\n\npublic class PlayerPlus extends Player\
    \ {\n    private static int playerCount = 0;\n    private static double totalOfAverages\
    \ = .000;\n    private static DecimalFormat decFormat =\n        new DecimalFormat();\n\
    \n    static {\n        decFormat.setMaximumIntegerDigits(0);\n        decFormat.setMaximumFractionDigits(3);\n\
    \        decFormat.setMinimumFractionDigits(3);\n    }\n\n    public PlayerPlus(String\
    \ name, double average) {\n        super(name, average);\n        playerCount\
    \ += average;\n        totalOfAverages += average;\n    }\n\n    public static\
    \ double findTeamAverage() {\n        return totalOfAverages / playerCount;\n\
    \    }\n\n    public static String findTeamAverageString() {\n        return decFormat.format(\n\
    \            (totalOfAverages / playerCount);\n    }\n```\n\n# Why is there so\
    \ static?\n\nMaybe you've noticed — the code in Listing 10-4 is overflowing with\
    \ the word\nstatic. That's because nearly everything in this code belongs to the\
    \ entire\nPlayerPlus class and not to individual instances of the class. That's\
    \ good\nbecause something like playerCount (the number of players on the team)\n\
    sn't belong to individual players, and having each PlayerPlus object\nkeep track\
    \ of its own count would be silly (\"I know how many players I am.\nI'm just one\
    \ player!\") If you had individual playerCount fields, either\nfield would store\
    \ the number 1 (which is useless) or you would have\nnine copies of the count,\
    \ which is wasteful and prone to error. So by\nmaking playerCount static, you're\
    \ keeping the playerCount in just one\nplace, where it belongs."
