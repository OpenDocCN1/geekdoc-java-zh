  md: '# 62 Part II: Writing Your Own Java Programs


    | Listing 4-1: Using a Variable |

    | amountInAccount = 50.22;

    amountInAccount = amountInAccount + 1000000.00; |


    You don''t have to type the code in Listing 4-1 (or in any of this book''s listings).
    To download all the code in this book, visit the book''s website (www.allmycode.com/JavaForDummies).


    The code in Listing 4-1 makes use of the amountInAccount variable. A variable
    is a placeholder. You can stick a number like 50.22 into a variable. After you
    place a number in the variable, you can change your number and put a different
    number into the variable. (That''s what varies in a variable. ) Of course, when
    you put a new number in a variable, the old number is no longer there. If you
    didn''t save the old number somewhere else the old number is gone.


    Figure 4-1 gives a before-and-after picture of the code in Listing 4-1. After
    the first statement in Listing 4-1 is executed, the variable amountInAccount has
    the 50.22 in it. Then, the second statement of Listing 4-1 is executed, the amountInAccount
    suddenly has 1000000.20 in it. When you think about a variable, picture a place
    in the computer''s memory where wires and transistors store 50.22, 1000000.22,
    or whatever. On the left side of Figure 4-1, imagine that the box with 50.22 in
    it is surrounded by millions of other boxes.


    ![](img/be49a553c8cd52419c36f97f5ee90278_75_0.png)


    You now need some terminology. The thing stored in a variable is a value. A variable''s
    value can change during the run of a program (when Jack gives you a million bucks,
    for instance). The value that''s stored in a variable isn''t necessarily a number.
    (For instance, you can create a variable that always stores a letter.) The kind
    of value that''s stored in a variable is a variable''s type.


    You can read more about types in the section “Understanding the Types of Variables
    That May Have,” later in this chapter.'
