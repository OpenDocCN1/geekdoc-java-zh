  md: '# 276 Part IV: Savvy Java Techniques


    # All generics


    One of the original design goals for Java was to keep the language as simple as
    possible. The language''s developer took some unnecessarily complicated features
    of C++ and tossed them out the window. The result was a language that was elegant
    and sleek. Some said the language was too sleek. After several years of discussion
    and squabbling, Java became a bit more complicated. By the year 2004, Java had
    *enum types*, for loops, static inner, and some other interesting features. But
    the most talked-about new feature was the introduction of generics.


    ```

    ArrayList<String> people = new ArrayList<String>();

    ```


    The use of anything `<String>` was new in Java 5.0. In old-style Java, you''d
    write


    ```

    ArrayList people = new ArrayList();

    ```


    In those days, ArrayList could store anything you wanted to put in it — a number,
    an Account, a String... anything. The ArrayList was very versatile, but with this
    versatility could mean headaches. If you put anything into an ArrayList, you couldn''t
    easily predict what you would get out of an ArrayList. In particular, you couldn''t
    easily code that assumed had types of values in the ArrayList. Here''s an example:


    ```

    ArrayList things = new ArrayList();

    things.add(new Account());

    Account account = things.get(0);

    // DON''T USE THIS. IT''S BAD CODE.

    ```


    In the third line, the call to get(0) gathers the earliest value in the things
    collection. The call to get(0) is okay, but the compiler chokers the attempted
    assignment to myAccount. You get a message on the third line saying that whatever
    you get from the things can''t be stuffed into the myAccount variable. You get
    this message because the compiler reaches the third line, it has forgotten that
    the item added on the second line is type Account!


    The introduction of generics fixes this:


    ```

    ArrayList<Account> things = new ArrayList<Account>();

    things.add(new Account());

    Account account = things.get(0);

    // USE THIS CODE INSTEAD. IT''S GOOD CODE.

    ```


    Adding `<Account>` in new places tells the compiler that stores Account instances
    — nothing else, so, in the third line of the code, you get values from the things
    collection. Then, because things stores only Account objects, you can make myAccount
    refer to that new value.


    Java 5.0 added generics to Java. But after the birth of Java 5.0, programmers
    noticed how the code for generics can be. After all, you can create generics within
    generics. An ArrayList can contain a bunch of arrays, each of which can be an
    ArrayList. So you can write


    ```

    ArrayList<ArrayList<String>[]> mess = new ArrayList<ArrayList<String>>>();

    ```'
