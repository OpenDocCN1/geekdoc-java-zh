  md: '# 48 Part I: Getting Started with Java


    REMEMBER


    In System.out.println, the next-to-last character is a lowercase letter l, not
    a digit I.


    Of course, Java has different kinds of statements. A method call, which I introduce
    in the earlier "The Java method" section, is one of the many kinds of Java statements.
    Listing 3-3 shows you what a method call looks like, and Figure 3-4 also contains
    a method that looks like this:


    ```

    System.out.println("You''ll love Java!");

    ```


    When the computer executes this statement, the computer calls a method named System.out.println.
    (Yes, in Java, a name can have dots in it. The dots mean something.)


    WARNING!

    I already said, but this worth repeating: In System.out.println, the next-to-last
    character is a lowercase letter (as in the word "line”), not a digit I (as in
    the number "one”). If you use a digit I, your code will not work. Just println
    as a way of saying "print line," and you won''t have any problem.


    To learn the meaning behind the dots in Java names, see Chapter 9.


    Figure 3-5 illustrates the System.out.println situation. Actually, two methods
    play active roles in the running of the Displayer program. Here''s how they work:


    +   There''s a declaration for a main method. I wrote the main method myself.
    This main method is called whenever I run the Displayer program.


    +   There''s a call to the System.out.println method. The method call for System.out.println
    is the only statement in the body of the main method. In other words, calling
    the System.out.println method is the only thing on the main method''s to-do list.


    The declaration for the System.out.println method is buried inside the official
    Java API. For a refresher on the Java API, see the sections "The grammar and the
    common names" and "The words in a Java program," earlier in this chapter.'
