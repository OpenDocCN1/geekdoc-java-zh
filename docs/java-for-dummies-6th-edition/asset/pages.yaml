  md: '# 104 Part II: Writing Your Java Programs


    The examples in the printed book are mostly text-based, but you can find fancier
    versions of most examples on this book''s website (www.allmycode.com/JavaForummies).
    These fancier versions have windows, buttons, fields, and other elements of a
    typical graphical user interface (GUI).


    ![](img/be49a553c8cd52419c36f97f5ee90278_117_0.png)


    The more appropriate of the two techniques uses Java''s equals method. The equals
    method looks funny because when you call it, you put a dot after string and put
    the other in parentheses. But that''s the way you have to do.


    In calling Java''s equals method, it doesn''t matter what string gets the dot
    and gets the parentheses. For instance, in Listing 5-3, you could have


    ```

    if ("swordfish".equals(swordfish))

    ```


    The method would work just well.


    A call to Java''s equals method looks unbalanced, but it''s not. There''s a reason
    behind the apparent imbalance between the dot and the parentheses. The idea is
    that you have two objects: the password object and the "swordfish" object. Each
    of these two objects is of type String. (However, password is a variable of type
    String, and "swordfish" is a String literal.) When you write password.equals("swordfish"),
    you call an equals method that belongs to the password object. When you call that
    method, you''re feeding "swordfish" to the method as the method''s parameter (pun
    intended).


    ![](img/be49a553c8cd52419c36f97f5ee90278_117_1.png)


