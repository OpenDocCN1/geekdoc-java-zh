    methods so you do not have to declare these methods yourself. The only

    methods you have to put in your code are the methods that you want to

    custom.


    Here''s a list of JApplet and JPanel methods that your web browser auto-

    matically calls:


    +   - init: The browser calls init when you visit the page containing

    t applet. Imagine that you close the browser. Later, you start the

    browser running again and revisit the page containing the applet. Then

    the browser calls the applet''s init method again.

    - start: The browser calls start right after it calls init. If your applet

    performs any continuous work, then being in your code could be the

    applet''s start method. For instance, if your applet has any animation,

    t code to begin running that is in your start method.

    - paint: The browser calls the paint method in Listing 16-5 right after it

    calls start.(Yes, the start method and the paint method are in diff-

