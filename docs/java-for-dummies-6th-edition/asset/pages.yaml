    ```\n\n# Pass by reference\n\nIn the previous section or two, I take great pains\
    \ to emphasize a certain point — that when a parameter has one of the eight primitives,\
    \ the parameter is passed by value. If you read this, you probably missed the\
    \ emphasis on the parameter's having one of the eight primitive types. The emphasis\
    \ is needed because passing objects (reference types) doesn't work the same way.\n\
    \nWhen you pass an object to a method, the object is passed by reference. What\
    \ this means is that whatever statements in the called method can change any values\
    \ that are stored in the object's variables. These changes affect the values that\
    \ are seen by whatever code called the method. Listings 10-12 and 13 illustrate\
    \ the point.\n\nListing 10-12: What Is a City?\n\n```\nclass City {\n    int population;\n\
    }\n```\n\nListing 10-13: Passing an Object to a Method\n\n```\npublic class TrackPopulation3\
    \ {\n\n    public static void main(String args[]) {\n        City smackoverAR\
    \ = new City();\n        smackoverAR.population = 2232;\n        birth(smackoverAR);\n\
    \        System.out.println(smackoverAR.population);\n    }\n}\n```\n\n(continued)"
