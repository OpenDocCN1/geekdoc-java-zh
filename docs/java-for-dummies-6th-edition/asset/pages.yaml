  md: '# Chapter 7: Thinking in Terms of Classes and Objects


    Instead of referencing myAccount.name, the UseAccount programmer must call myAccount.setName
    or method myAccount.getName. These methods, setName and getName, are called methods
    because they provide access to the Account class name field. (Actually, the accessor
    method isn''t formally part of the Java programming language. It''s just the term
    that people use for methods that do this sort of thing.) To zoom in even more,
    setName is called a setter method, and getName is called a getter method.


    With many IDs, you don''t have to type your own accessor methods. First, you type
    a field declaration like private String name. Then, in your IDE''s menu bar, you
    choose Source:Generate Getters and Setters, or choose Code:Insert Cell:Setter
    or some of these commands. After you make your choices, the IDE creates accessor
    methods and adds them to your code.


    Notice that all the setter and getter methods in Listing 7-8 are declared to be
    public. This ensures that anyone from anywhere can call these two methods. The
    idea here is that not manipulating the fields outside the Account class is impossible,
    but you can easily reach the approved setter and getter methods using those fields.


    Think again about the automatic teller machine. Someone using the ATM can''t type
    a command that directly changes the value in his or account''s balance, but the
    procedure for depositing a million-dollar check is easy to follow. The people
    who built the teller machines know that the depositing procedure is complicated,
    plenty of customers will mess it up really. So that''s the task—make impossible
    anything that people shouldn''t do and make sure that the tasks people should
    be doing are easy.


    Nothing about setter and getter methods is gratis. You don''t have to write any
    setter and methods that you''re going to use. For instance, in Listing 7-8, I
    can omit the declaration of method getAddress, and everything still works. The
    only problem I do have is that anyone who wants to use your Account class and
    retrieve the address of an existing account is a creep.


    When you create to set the value in a balance field, you don''t have to name your
    method setName. You can have it name tunaField or whatever you like. The trouble
    is that the setFieldName convention (with lowercase letter in set and an uppercase
    letter to the Fieldname part) is an established stylistic convention in the world
    of Java programming. If you don''t follow the convention, you confuse the kumquats
    out of other Java programmers. If your integrated development environment has
    drag-and-drop GUI design you may temporarily lose that capability. (For a word
    about drag-and-drop GUI design, see Chapters 2 and 15.)


