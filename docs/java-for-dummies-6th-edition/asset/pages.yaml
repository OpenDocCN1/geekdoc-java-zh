    \ the name e stores a bunch of information about the exception. To take advantage\
    \ of this, you can call some of the exception's methods.\n\n```\ncatch (NumberFormatException\
    \ e) {\n    out.println(\"Message: ****\\\"\" + e.getMessage() + \"\\****\\\"\
    );\n    e.printStackTrace();\n}\n```\n\nWith this catch clause, a run of the inventory\
