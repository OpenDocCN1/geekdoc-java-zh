  md: "# Chapter 14: Sharing Names among the Parts of a Java Program 333\n\n# Putting\
    \ a drawing on a frame\n\nTo make this business about access modifiers clear,\
    \ you need an example or two. In this chapter's first example, almost everything\
    \ is public. With public access, you don't have to worry about who can use.\n\n\
    The code for this first example comes in several parts. The first part, which\
    \ is in Listing 14-1, displays an ArtFrame. On the face of the ArtFrame is a Drawing.\
    \ If all the right pieces are in place, running the code of Listing 14-1 displays\
    \ a window like the one shown in Figure 14-4.\n\nListing 14-1: Displaying a Frame\n\
    \n```\nimport com.burbrain.drawings.Drawing;\nimport com.burbrain.frames.ArtFrame;\n\
    \nclass ShowFrame {\n    public static void main(String args[]) {\n        ArtFrame\
    \ artFrame = new ArtFrame(new Drawing());\n\n        artFrame.setSize(200, 100);\n\
    \        artFrame.setVisible(true);\n    }\n}\n```\n\n![](img/be49a553c8cd52419c36f97f5ee90278_346_0.png)\n\
    \nIn Listing 14-1 creates a new ArtFrame instance. You may suspect that ArtFrame\
    \ is a subclass of a Java class, and that's certainly the case. Chapter 9 says\
    \ that Java frames are, by default, invisible. So, in Listing 14-1, to make the\
    \ ArtFrame instance visible, use the setVisible method.\n\nNow that Listing 14-1\
    \ starts with two import declarations. The first import declaration allows you\
    \ to abbreviate the name Drawing from the com.burbrain.drawings package. The second\
    \ import declaration allows you to abbreviate the name ArtFrame from com.burbrain.frames.\n\
    \nFor a review of import declarations, see Chapter 4."
