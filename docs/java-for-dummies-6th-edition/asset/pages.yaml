    It a Wonderful Life, Key Largo, and Dr. Kildare''s Wedding Day. In addition, Barrymore
    was a writer, composer, and director. Barrymore did the voice of Ebenezer Scrooge
    every year on radio. ."


    Interesting stuff? Now consider the paragraphs above with a lecture in which the
    instructor doesn''t begin by:


    > "Welcome once again to the History of Film."


    > "Born in Philadelphia, Lionel Barrymore appeared in more than 200 films, including
    It a Wonderful Life, Key Largo, and Dr. Kildare''s Wedding Day. In addition, Barrymore
    (not Ethel, John, or Drew) was a writer, composer, and director. Lionel Barrymore
