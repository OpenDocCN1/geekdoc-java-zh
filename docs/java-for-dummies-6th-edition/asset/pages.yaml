- pgno: 30
  md: 'Starting with a class, however, is like starting with a blueprint. If you decide
    to have both three- and four-bedroom houses, you can start with a blueprint called
    the house that has a ground floor and a second floor, but has no indoor walls
    drawn on the second floor. Then you make two second-floor blueprints—one for the
    three-bedroom house and another for the four-bedroom house. (You name these new
    blueprints the three-bedroom house and the four-bedroom house blueprint.)


    Your colleagues are amazed with your sense of logic and organization, but they
    have concerns. They pose a question. "You called one of the blueprints ‘three-bedroom
    house’ blueprint. How can you do that if it’s a blueprint for a second floor and
    not for a whole house?"


    You smile knowingly and answer, "The three-bedroom house blueprint can say, ‘For
    about the lower floors, see the original house blueprint.’ That way, the three-bedroom
    house blueprint describes a whole house. The four-bedroom house blueprint can
    say the same thing. With this setup, we can take advantage of all the work we
    already did to create the original house blueprint and save lots of."


    In the language of object-oriented programming, the three- and four-bedroom house
    classes are inheriting the features of the original class. You can also say that
    the three- and four-bedroom house classes are extending the original house class.
    (See Figure 1-1.)


    | Superclass Parent | The house class is the superclass of the three-bedroom house
    class, the parent class of the three-bedroom house class, the superclass of the
    four-bedroom house class, the parent class of the four-bedroom house class. |

    | --- | --- |

    | Subclass Child | Subclass Child

    | three-bedroom house class | four-bedroom house class |


    Figure 1-1: Terminology in object-oriented programming.


    The three-bedroom house class extends the house class, inherits the features of
    the house class, is a subclass of the house class, is a child class of the house
    class. The four-bedroom house class extends the house class, inherits the features
    of the house class, is a subclass of the house class, is a child class of the
    house class.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# 18 Part I: Getting Started with Java


    The original house class is called the subclass of the three- and four-bedroom
    house classes. In that vein, the three- and four-bedroom house classes are subclasses
    of the original house class. Put another way, the original house class is called
    the parent class of three- and four-bedroom house classes. The three- and four-bedroom
    house classes are child classes of the original house class. (See Figure 1-1).


    Needless to say, your homebuyers colleagues are jealous. A crowd of homebuilders
    is moving you to hear about your great ideas. So, at that moment, you drop one
    more bombshell: "By creating with classes, we can reuse the blueprint in the future.
    If someone comes along and wants a five-bedroom house, we can extend our original
    house blueprint by making a five-bedroom house blueprint. We''ll never have to
    spend money for an original again.


    "But," as a colleague in the back, "what happens if someone wants a different
    first-floor design? Do we trash the original house blueprint or scribbling over
    the entire blueprint? That''ll cost big bucks, won''t?


    In a confident tone, you reply, "We don''t have to make with the original house
    blueprint. If someone wants a Jacuzzi in his living room, we can make a new, small
    Jacuzzi-in-living-room house blueprint. Then, this new blueprint can refer to
    the original house blueprint for info on the rest of the house (the part that''s
    not in the living room). In the language of object-oriented programming, the Jacuzzi-in-living-room
    blueprint extends the original house blueprint. The Jacuzzi blueprint is still
    a subclass of the original house blueprint. In fact, all the terminology over
    superclass, parent class, and child class still applies. The only thing that''s
    new is that the Jacuzzi blueprint overrides the living room features in the original
    house blueprint.


    In the days before object-oriented languages, the programming world experienced
    a crisis in software development. Programmers wrote code, then discovered new
    needs, and had to trash their code and start from scratch. This problem happened
    over and again because the code that the programmers were writing couldn''t be
    reused. Object-oriented programming changed all of this for the better (and, as
    Burd said, Java is "A Great Object-Oriented Language").


    # Refining your understanding of classes and objects


    When you program in Java, you work constantly with classes and objects. These
    two ideas are really important. That''s why, in this chapter, I hit you over the
    head with one analogy after another about classes and objects.'
