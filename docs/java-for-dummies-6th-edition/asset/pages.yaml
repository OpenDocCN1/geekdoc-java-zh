  md: '# Chapter 9: Constructing New Objects


    # # What is a temperature scale?

    (Java''s enum type )


    Java provides lots of ways for you to group things together. In Chapter 11, you
    group things together to form an array. And in Chapter 12, you group things together
    to form a collection. (Of course, you can''t group anything unless you can pronounce
    enum. The word enum is pronounced *ee-noom*, like the first syllables of the word
    enumeration.)


    Creating a complicated enum type isn''t easy, but to create a simple enum type,
    just write a bunch of words inside a pair of curly braces. Listing 9-1 defines
    an enum type. The name of the enum type is TempScale.


    Listing 9-1: The TempScale enum type


    ```

    public enum TempScale {

    CELSIUS, FAHRENHEIT, KELVIN, RANKINE,

    NEWTON, DELISLE, RÄUMUR, RØMER, LEIDEN

    };

    ```


    When you define an enum type, two important things happen:


    +   - You create values.

    - Just as 13 and 151 are int values, CELSIUS and FAHRENHEIT are TempScale values.

    - You can create variables to refer to those values.

    - In Listing 9-2, we declare the fields number and scale. Just as double number
    declares a number is of type double, TempScale scale declares variable scale to
    be of type TempScale.

    - Being of type TempScale means that you can have values CELSIUS, FAHRENHEIT,
    KELVIN, and so on. So in Listing 9-2, I can give the scale variable the value
    FAHRENHEIT (or TempScale, to be more precise).


    An enum type is a Java class in disguise. That''s why Listing 9-1 contains an
    entire file devoted to one thing; namely, the declaration of the TempScale enum
    type. Like the declaration of a class, an enum type declaration belongs in a file
    all its own. The code in Listing 9-1 belongs in a file named TempScale.java.


    ![](img/be49a553c8cd52419c36f97f5ee90278_208_0.png)'
