  md: "# Chapter 14: Sharing Names among the Parts of a Java Program\n\n# Making a\
    \ frame\n\nThis chapter's first three listings develop one multipart example.\
    \ This section has the last of three pieces in this example. This last piece isnt\
    \ crucial for the understanding of access modifiers, which is the main topic of\
    \ this chapter. So, if you want to skip past the explanation of Listing 14-3,\
    \ you can do so without losing the chapter's thread. On the other hand, if you\
    \ want to know more about the Java Swing classes, read on.\n\nListing 14-3: The\
    \ Artframe Class\n\n```\npackage com.burdbrain.frames;\nimport java.awt.Graphics;\n\
    import javax.swing.JFrame;\nimport com.burdbrain.drawings.Drawing;\npublic class\
    \ ArtFrame extends JFrame {\n    private static final long serialVersionUID =\
    \ 1L;\nDrawingDrawing;\n    public ArtFrame(Drawing drawing) {\n        this.drawing\
    \ = drawing;\n        setTitle(\"Abstract Art\");\n        setDefaultCloseOperation(EXIT_ON_CLOSE);\n\
    \    }\n    public void paint(Graphics g) {\n        drawing.paint(g);\n    }\n\
    }\n```\n\nListing 14-3 has all the gadgetry you need for putting a drawing on\
    \ a Java frame. The code uses several names from the Java API (Application Programming\
    \ Interface). I explain most of these names in Chapters 9 and 10.\n\nThe only\
    \ new in Listing 14-3 is the paint method. The paint in Listing 14-3 defers to\
    \ another method — the paint method belonging to a Drawing object. The ArtFrame\
    \ object creates a floating window on your computer screen. What's drawn in that\
    \ floating window depends on whatever Drawing object was passed to the ArtFrame\
    \ constructor."
  merge: -1
