  md: '# Chapter 8: Saving Time and Money: Reusing Code 175


    +   - You must pass the file scanner''s name to the payOneEmployee method.


    In Listing 7-5 in Chapter 7, the getInterest method has a parameter named percentageRate.
    Whenever you call the getInterest method, you hand an extra, up-to-date piece
    of information to the method. (You hand a number — an interest rate — to the method.
    Figure 7-7 illustrates the idea.)


    The same thing happens in Listing 8-2. The payOneEmployee method has a parameter
    named aScanner. Whenever you call the payOneEmployee method, you hand an extra,
    up-to-date piece of information to the method. (You hand a scanner — a reference
    to a disk file — to the method.)


    You might wonder why the payOneEmployee method needs a parameter. After all, in
    Listing 8-2, the payOneEmployee method always reads data from the same file. Why
    however informing this, each time you call it, that disk file is still the EmployeeInfo.txt
    file?


    Well, there are plenty of ways to shuffle the code in Listing 8-2. Some ways don''t
    involve a parameter. But the way that this example has arranged things, you have
    two methods — a main method and a payOneEmployee method. You create a scanner
    inside the main method and then use the scanner three times — once inside each
    call to the payOneEmployee method.


    Anything that define inside a method is like a private joke that''s known only
    to the code inside that method. So, the diskScanner that you define the main method
    isn''t automatically known inside the payOneEmployee method. To make the payOneEmployee
    aware of the disk file, you pass diskScanner from the main method to the payOneEmployee
    method.


    To read more about things that you decide inside (and outside of) methods, see
    Chapter 10.


