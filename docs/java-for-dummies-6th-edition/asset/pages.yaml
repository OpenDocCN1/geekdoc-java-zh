    # # Making Static (Finding the Team Average)


    Thinking about the code in Listings 10-1 through 10-3, you decide that you''d
    like to find the team''s batting average: Not a bad idea! The Hankees in Figure
    10-1 have an average of .106, so the team needs intensive training. While the
    players are practicing on the ball field, you have a philosophical hurdle to overcome.


    In Listings 10-1 through 10-3, you have three classes: a Player class and two
    others that display data from the Player class. So in this class morass, which
    do the variables storing your overall, team-average tally go?


    +   - makes no sense to put tally variables in either of the displaying classes
    (TeamFrame and ShowTeamFrame). After all, the tally has something or other to
    do with players, teams, and baseball. The displaying classes are about creating
    windows, not about playing baseball.


    +   - You''re uncomfortable putting an overall team average in an instance of
    the Player class because an instance of the Player class represents just one player
    on the team. What business does a single player have storing total average data?
    Sure, you could make the code work, but it wouldn''t be an elegant solution to
    the problem.


    Finally, you discover the keyword static. Anything that''s declared belongs to
    the whole class, not to any particular instance of the class. When you create
    the static field, totalOfAverage, you create just one copy of the field. This
    copy stays with the other Players class. No matter how many instances of the Player
    class you create — one, nine or none — you have just one totalOfAverage field.
    And, while you''re at it, you create other static fields (playerCount and decFormat)
    and static methods (findTeamAverage and findTeamAverageString). To see what I
    mean, look at Figure 10-5.


    | Figure 10-5: static and non-static fields and methods. | | instance | instance
