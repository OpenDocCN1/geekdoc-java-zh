  md: '# 178 Part III: Working with the Big Picture: Object-Oriented Programming


    ![](img/be49a553c8cd52419c36f97f5ee90278_191_0.png)


    So after reading the number 5000.00, you need two calls to nextLine in order to
    scoop the name Harriet Ritter. The mistake I usually make is to forget the first
    of those two calls.


    Look again at the file in Figure 8-3 for code to work correctly, you must have
    a line break after the last 10000.00. If you don''t, a final call to nextLine
    makes your program crash and burn. The error message reads NoSuchElementException:
    No line found.


    I''m always surprised by the number of quirks that I find in each programming
    language''s scanning methods. For example, the first nextLine that reads from
    the file in Figure 8-3 devours Barry Burd [LineBreak] from the file. But that
    nextLine delivers Barry Burd (without any line break) to the running code. so
    nextLine looks for a line break, and then nextLine loses the line break. This
    is a subtle point. And no, this point hardly ever causes problems for anyone.


    If this about nextDouble and nextLine confuses you, please don''t put the blame
    on Java. Mixing input calls is delicate work in any computer programming language.
    And the really nasty thing is that each programming language approaches the problem
    differently. What you find out about nextLine in Java helps you understand the
    issues when you get to know C++ or Visual Basic, but it doesn''t tell you all
    the details. Each language''s details are unique to that language. (Yes, it''s
    a big pain. But because all computer programmers become rich and famous, the pain
    eventually pays off.)'
