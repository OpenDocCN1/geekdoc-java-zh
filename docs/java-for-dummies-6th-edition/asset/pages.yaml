  md: '# 194 Part III: Working with the Big Picture: Object-Oriented Programming


    # Defining Constructors (What It Means to Be a Temperature)


    Here''s a statement that creates an object:


    ```

    Account myAccount = new Account();

    ```


    I know this works — I got it from one of my examples in Chapter 7. Anyway, in
    Chapter 7, I say, "when the computer executes new Account (), you''re creating
    an object by calling the Account class''s constructor." What does this mean?


    Well, when you ask the computer to create a new object, the computer responds
    by performing certain actions. For starters, the computer finds a place in its
    memory to store information about the new object. If the object has fields, the
    fields should eventually have meaningful values.


    ![](img/be49a553c8cd52419c36f97f5ee90278_207_0.png)


    To find out fields, see Chapter 7.


    So one question is, when you ask the computer to create a new object, can you
    control what''s placed in the object''s fields? And what if you''re interested
    in doing more than filling fields? Perhaps, when the computer creates a new object,
    you have a whole list of jobs for the computer to carry out. For instance, when
    the computer creates a new window object, you want the computer to realize the
    sizes of all the buttons in that window.


    Creating a new object can involve all kinds of tasks, so in this chapter, you
    create constructors. A constructor tells the computer to perform a new object''s
    startup tasks.


    # What is a temperature?


    "Good morning, and welcome to Object News. The local temperature in your area
    is a pleasant 73 degrees Fahrenheit."


    Each temperature consists of two things: a number and a temperature scale. A number
    is just a double value, such as 32.0 or 70.52. But what''s a temperature scale?
    It is a string of characters, like "Fahrenheit" or "Celsius"? Not really, some
