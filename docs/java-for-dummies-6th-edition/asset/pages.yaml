  md: '# 384 Part IV: Savvy Java Techniques


    Listing 17-2 starts with the usual calls to setName, getConnection, and createStatement.
    Then the code calls executeQuery and supplies the call with an SQL command. For
    those who know SQL commands, this particular command gets all data from the ACCOUNTS
    table (the table you get in Listing 17-1).


    The thing returned from calling executeQuery is of type java.ResultSet. (That''s
    the difference between executeUpdate and executeQuery—executeQuery returns a result
    set, and executeUpdate doesn''t.) This result is very much like a database table.
    Like the original table, the result set is divided into rows and columns. Each
    row has the data for one account. Each row has an address, and a balance amount.


    After you call executeQuery and get your result set, you can step through the
    result set one row at a time. To do this, go into a little loop and test the condition
    resultset.next() at the top of each loop iteration. Each time, the call to resultset.next()
    does two things:


    +   - It moves to the next row of the result set (the next account) if another
    row exists.

    - It tells you whether another row exists by returning a boolean value — true
    or false.


    If the condition resultset.next() is true, the result set has another row. The
    computer moves to that row from that. On the other hand, if resultset.next() is
    false, the result set doesn''t have any rows. You jump out of the loop and start
    closing everything.


    Now, imagine that the computer is pointing to a row of the result set, and you''re
    inside the loop in Listing 17-2. You''re retrieving data from the result set''s
    row by calling the result''s getString and getFloat methods. Back in Listing 17-1,
    you set up the ACCOUNTS table with the columns NAME, ADDRESS, and BALANCE. So,
    in Listing 17-2, you''re getting data from these columns by calling your getSomeTypeOrOther
    methods and feeding the original column names to these methods. After you have
    the data, you display the data on the computer screen.


    Each ResultSet instance has several nice get getTypeOrOther methods. Depending
    on the type of data you put into a column, you can call methods getArray, getBigDecimal,
    getBlob, getInt, getObject, getTimestamp, and several others.


