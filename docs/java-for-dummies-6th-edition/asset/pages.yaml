  md: '# Chapter 4: Making the Most of Variables and Their Values


    # ## Digits beyond the decimal point


    Java has two different types that have digits beyond the decimal point: type double
    and type float. So what''s the difference? When you declare a variable to be of
    type double, you''re telling the computer to keep track of 64 bits when it stores
    the variable''s values. When you declare a variable to be of type float, the computer
    keeps track of 32 bits.


    You could change Listing 4-2 and declare amountInAccount to be of type float.


    ```

    float amountInAccount;

    ```


    32 bits are enough to store a small number like 50.22, right? Well, they are and
    aren''t. You could easily store 50.00 with 32 bits. But, you could store 50.00
    with only 6 bits. The size of the number doesn''t matter. The accuracy matters.
    In a 64-bit double variable, you''re using most of the bits to store the decimal
    point. The .22 part of 50.22 needs more than measly 32 bits that you get with
    float.


    Do you really believe what you read — that it takes more than 32 bits to store
    .22? To convince you, I made a few changes to the code in Listing 4-2. I made
    amountInAccount be of type float. I changed the first three statements in my method
    as follows:


    ```

    float amountInAccount;

    amountInAccount = 50.22F;

    amountInAccount = amountInAccount + 1000000.0F;

    ```


    (To understand why I used the letter F in 50.22F and 1000000.0F, see Table 4-1.)
    The output I got


    You have 500050.25 in your account.


    Compare this with the output in Figure 4-5. When I switch from type double to
    type float, Charles has an three cents in his account. By changing to the 32-bit
    float variable, I''ve observed the accuracy in the amountInAccount''s hundredths
    place. That''s bad.


    Another difficulty with float is purely cosmetic. Look again at the literals,
    50.22 and 1000000.0. In Java says that literals like these take 64 bits each.
    This means if you declare amountInAccount to be of type float, you''re going to
    run into trouble. You''ll trouble storing these 64-bits into your little 32-bit
    amountInAccount variable. To compensate, you can switch from double literals to
    float literals by adding an F to each double, but a number with an extra F at
    the end looks funny.


    ```

    float amountInAccount;

    amountInAccount = 50.22F;

    amountInAccount = amountInAccount + 1000000.0F;

    ```


    To experiment with numbers, visit http://babbage.cs.qc.edu/IEEE-754. The page
    takes any number you enter and shows you how the number would be represented as
    32 bits and as 64 bits.'
