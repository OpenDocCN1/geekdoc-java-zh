- pgno: 69
  md: '# What''s Barry''s excuse?


    For years, I''ve been telling my students to put comments in their code, and for
    years, I''ve been creating sample code (like the code in Listing 3-1) with no
    comments in it. Why?


    Three little words: “Know your audience.” When you write complicated, real-life
    code, your audience is programmers, technology managers, and people who need help
    deciphering what you''ve done. When I write simple samples of code for this book,
    my audience is — the novice programmer. Instead of reading my comments, my best
    strategy is to stare at my Java statements — the statements that Java''s compiler
    deciphers. That''s why I put few comments in this book''s listings.


    Besides, I''m a little lazy.


    # Using comments to experiment with your code


    You may have programmers talk about commenting out certain parts of their code.
    When you''re writing a program and something''s not working correctly, it often
    helps to try removing some of the code. If nothing else, you find out what happens
    when suspicious code is removed. Of course, you may not like what happens when
    the code is removed, so you don''t want to delete the code completely. Instead,
    you turn your ordinary Java statements into comments.


    ```

    System.out.println("I love Java!");

    ```


    into the comment


    ```

    // System.out.println("I love Java!");

    ```


    This change keeps the Java compiler from seeing the code while you try to figure
    out what''s wrong with your program.


    Traditional comments aren''t very useful for commenting out code. The big problem
    is that you can''t put one traditional comment inside of another. For instance,
    suppose you want to comment out the following statements:'
