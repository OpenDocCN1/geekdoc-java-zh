    button is centered near the top of the frame. If the frame had eight buttons,
    five of them might be lined up in a row across the top of the frame and the remaining
    three would be centered along a second row.

    - setLayout: Calling setLayout puts the new Flowlayout in charge of arranging
    components, such as buttons, on the frame. (The new SimpleFrame object is calling
    its own setLayout)

    - setDefaultCloseOperation: Calling setDefaultCloseOperation tells what to do
    when you click the < in the frame''s upper-right corner. With this method, the
    frame itself disappears, the Java Virtual Machine (JVM) keeps running. If you
    use Eclipse, you have to halt the JVM by clicking the red square near the top
    of the Console (See Figure 9-4).


    Calling setDefaultCloseOperation (EXIT_CLOSE) tells Java to shut itself down when
    you click the x in the frame''s upper-right corner. The alternatives to EXIT_ON_CLOSE
