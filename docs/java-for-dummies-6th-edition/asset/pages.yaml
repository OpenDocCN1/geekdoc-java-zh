  md: '# 362 Part IV: Savvy Java Techniques


    +   - Another label: In Figure 15-4, the label displays £33.06.

    - A combo box: In Figure 15-4, the combo box displays US to UK. In Figure 15-5,
    the user selects an item in the box. In Figure 15-6, the selected item is UK to
    US.


    In Java, a JComboBox (commonly called a drop-down list) can display items of any
    kind. In Listing 15-3, the generic new JComboBox<String>() code constructs a JComboBox
    whose entries have String type. That seems sensible, but if your application has
    a Person class, you can construct new JComboBox<Person>(). In that situation,
    Java knows how to display each object in the drop-down list (It isn''t a big deal).
    Java finds out how to display a person by looking for a toString() method inside
    the Person class.


    The MoneyFrame implements three interfaces — the KeyListener, ItemListener, and
    MouseListener interfaces. Because it implements three interfaces, the code can
    listen for three kinds of events. I discuss the interfaces and events in the following
    list:


    +   - KeyListener: A class that implements the KeyListener interface must have
    three methods named keyReleased, keyPressed, and keyTyped. When you lift your
    finger off the key, the event-handling thread calls keyReleased.


    In Listing 15-3, the keyReleased method calls setTextOnLabel. My setTextOnLabel
    method checks to see what''s currently selected in the box. If the user selects
    the US to UK, the setTextOnLabel method converts to dollars. If the user selects
    the UK to US, the setTextOnLabel method converts pounds to dollars.


    In the setTextOnLabel method, I use the "u00A3" code is Java''s pound sign. (The
    u in £ stands for Unicode — an international standard for representing characters
    in the world''s alphabets). If my operating system''s settings defaulted to UK
    currency, in the runs of Java programs, the pound sign would appear on its own.
    For information about all this, check the Locale class in Java''s API documentation.


    By the way, if you''re thinking in terms of real currency conversion, forget about
    it. This program uses rates that may or not have accurate at one time. Sure, a
    program can reach out to the Internet for the most up-to-date currency rates,
    but at the moment, you have other Javaafish to fry.


    ![](img/be49a553c8cd52419c36f97f5ee90278_375_0.png)


    ![](img/be49a553c8cd52419c36f97f5ee90278_375_1.png)'
