  md: '# Chapter 12: Using Collections and Streams (When Arrays Aren’t Good Enough)


    All was well well until 2007 when, for the first time, computers sold to consumers
    had multicore processors. A multicore processor can perform more than one instruction
    at a time. Figure 12-4 shows what happens when you try to squeeze an imperative
    program into a multicore processor.


    It doesn''t fit easily, so... ...squeeze it all into one core.


    ![](img/be49a553c8cd52419c36f97f5ee90278_294_0.png)


    To get the most out of a four-core processor, you divide your code into four pieces
    — one piece for each core. But with imperative programming, your program''s pieces
    don''t fit neatly into your processor''s cores.


    In imperative programming, your code''s pieces interact with one another. All
    the pieces might be updating the current price of Oracle stock shares (ticker
    ORCL). The simultaneous updates become tangled. It''s like high-school boys asking
    the same girl to the senior prom. Nothing good ever comes of it. You''ve experienced
    the same phenomenon if you''ve ever clicked a website''s Purchase button only
    to find the item you''re trying to purchase out of stock. Someone else completed
    a purchase while you were filling your credit card information. Too many customers
    were grabbing for the goods at the same time.


    Figure 12-3 suggests that with imperative programming, you divide your code into
    several pieces. Functional programming also divides code into pieces, but it does
    so along different lines. (See Figure 12-5.) And here''s the good news: With functional
    programming, the pieces of the code fit neatly into the processor''s cores. (See
    Figure 12-6.)'
