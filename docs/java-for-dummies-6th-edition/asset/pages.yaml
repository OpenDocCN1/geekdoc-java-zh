    # Events and event handling


    The big news in Listing 15-1, shown in the preceding section, is the handling
    of the user''s button click. When you''re working in a graphical user interface
    (GUI), anything the user does (like pressing a key, moving the mouse, clicking
    the mouse, or whatever) is called an *event*. The code that responds to the user''s
    press, movement, or click is called *eventhandling code*.


    Listing 15-1 deals with the button-click event with three parts of its code:


    +   - The top of the GameFrame class declaration says that this class implements
    ActionListener.

    - The constructor for the GameFrame class adds this to the button''s list of listeners.

    - The code for the GameFrame class has an actionPerformed method.


    Taken together, all three of these tricks make the GameFrame class handle button
    clicks. To understand how it works, you have to know about something called an
    *interface*, which I discuss in the following section.


    # The Java interface


    You may have noticed that, in Java, you never get a class to extend more than
    one parent class. In other words, you never get


    ```

    class DontDoThis extends FirstClass, SecondClass

    ```


    A class can have only one parent class, and that''s fine when you want your new
    class to be like a frame. But what if you want your new class to be like a frame
    and a button-click-listening thing? Can your new class be like both things?


    Yes, it can be. Java has this thing called an *interface*. An interface is like
    a class, but it''s different. (So, what else is new? A cow is like a planet, but
    it''s in space.) Anyway, when you hear the word *interface*, you can start thinking
    of a class. Then, in your head, note the following things:'
