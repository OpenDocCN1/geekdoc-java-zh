- pgno: 334
  md: "# Chapter 13: Looking Good When Things Take Unexpected Turns 321\n\nTo better\
    \ understand the throws clause, imagine a volleyball game in which the volleyball\
    \ is an exception. When a player on the other team serves, that player is throwing\
    \ the exception. The ball crosses the net and comes right to you. If you pass\
    \ the ball back the net, you're catching the exception. If you pass the ball to\
    \ another player, you're using the throws clause. In essence, you're saying, \"\
    Here, other player. You deal with this exception.\"\n\n![](img/be49a553c8cd52419c36f97f5ee90278_334_0.png)\n\
    \nA statement in code can throw an exception that's not matched by a catch clause.\
    \ This includes situations where the statement throwing exception isn't even inside\
    \ a try block. When this happens, execution of the program jumps out of the method\
    \ that contains the offending statement. Execution jumps back to whatever code\
    \ called the method in the first place.\n\nA method can name more than one exception\
    \ type in its throws clause. Just use commas to separate the names of the exception\
    \ types, in the following example:\n\n```\nthrows InterruptedException, IOException,\n\
    \      ArithmeticException\n```\n\nThe Java API has hundreds of exception types.\
    \ Several of them are subclasses of the RuntimeException class (a sub-subclass,\
    \ sub-sub-subclass, and so on) is unchecked. Any unchecked exception includes\
    \ things that would be hard for the computer to predict. Such things include the\
    \ NumberFormatException (of Listings 13-2, 13-4, and others), the ArithmeticException,\
    \ the IndexOfBoundsException, the infamous NullPointerException, and many others.\
    \ When you write Java code, your code is susceptible to these exceptions, encoding\
    \ the code in throws clause (or passing the ball with throws clauses) is completely\
    \ optional.\n\nThe Java API also has its share of checked exceptions. The computer\
    \ can readily detect exceptions of this kind. So Java insists that, for an exception\
    \ of this kind, any potential exception-throwing statement is acknowledged with\
    \ either a try statement or a throws clause. Java's checked exceptions include\
    \ InterruptedException (Listings 13-9 and 13-10), the IOException, the SQLException,\
    \ and a gang of other interesting exceptions."
  merge: -1
