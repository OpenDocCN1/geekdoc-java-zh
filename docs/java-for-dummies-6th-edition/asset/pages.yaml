  md: "Here's a hypothetical situation: Imagine that you run the Linux operating system\
    \ on a computer with an old Pentium processor. Your friend runs Linux on a computer\
    \ with a different kind of processor — a PowerPC processor. (In the 1990s, Intel\
    \ Corporation made Pentium processors, and IBM made PowerPC processors.)\n\nListing\
    \ 2-3 contains a set of instructions to display Hello world! on the computer screen.\
    \ The instructions work on a Pentium processor running the Linux operating system.\n\
    \n# Listing 2-3: A Simple Program for a Pentium Processor\n\n```\n.data\nmsg:\n\
    \    ascii \"Hello, world!\\n\"\n    len = - msg\n\n.text\n    .global _start\n\
    _start:\n    mov $len,%edx\n    mov $msg,%ecx\n    mov $1,$ebx\n    mov $4,$eax\n\
    \    int $0x80\n\n    mov $0,%ebx\n    mov $1,%eax\n    int $0x80\n```\n\nListing\
    \ 2-4 contains another set of instructions to display Hello world! on the screen.\
    \ The instructions in Listing 2-4 work on a PowerPC processor running Linux.\n\
    \n> I paraphrase Intel instructions from Konstantin Boldyshev's Linux Assembly\
    \ HOWTO (http://tldp.org/HOWTO/Assembly-HOWTO/hello.html).\n\n> I paraphrase the\
    \ PowerPC code from Hollis Blanchard's PowerPC Assembly page (www.ibm.com/developerworks/library/l-ppc).\
    \ Hollis also reviewed and critiqued this \"What is a Java Virtual Machine?\"\
    \ section for me. Thank you; Hollis."
  merge: -1
  img_proc: true
- pgno: 41
  md: "# Part I: Getting Started with Java\n\n# Listing 2-4: A Simple Program for\
    \ a PowerPC Processor\n\n```\ndata\n\nmsg:\n  .string \"Hello, world!\\n\"\n \
    \ len = .msg\n\n.text\n  .global _start:\n\nstart:\n  li 0,4\n  li 3,1\n\n  lis\
    \ 4,msg@ha\n  addi 4,4,msg@l\n  li 5,len\n\n  li 0,1\n  li 3,1\n  sc\n```\n\n\
    The instructions in Listing 2-3 run smoothly on a Pentium processor. But these\
    \ instructions mean nothing to a PowerPC processor. Likewise, the instructions\
    \ in Listing 2-4 run nicely on a PowerPC, but these instructions are complete\
    \ gibberish to a computer with a Pentium processor. So your friend's PC software\
    \ might not be available on your computer. And your Intel computer's software\
    \ might not run at all on your friend's computer.\n\nNow go to your cousin's house.\
    \ Your cousin's computer has a Pentium processor (just like yours), but your cousin's\
    \ computer runs Windows instead of Linux. But what does your cousin's computer\
    \ do when you fetch the Pentium code in Listing 2-3? It screams, \"Not a valid\
    \ Win32 application\" or \"Windows can't open this file! What a mess\"\n\nJava\
    \ bytecode creates order from all this chaos. Java bytecode is the code in Listings\
    \ 2-3 and 2-4, but Java bytecode is specific to one kind of processor or one operating\
    \ system. Instead, if you write a Java program and compile that program into bytecode,\
    \ then your computer can run the bytecode, your friend's computer can run the\
    \ bytecode, and with any luck, your grandmother's supercomputer can run the bytecode,\
    \ and your cellphone or tablet can run the bytecode.\n\nFor a look at some bytecode,\
    \ see Listing 2-2. But remember, you never have to write or decipher Java bytecode.\
    \ Writing bytecode is the compiler's job. Deciphering bytecode is the Java Virtual\
    \ Machine's job.\n\n![](img/be49a553c8cd52419c36f97f5ee90278_41_0.png)"
  merge: -1
  img_proc: true
- pgno: 42
  md: '# Chapter 2: All about Software


    With Java, you can take a bytecode file that you created with a Windows computer,
    copy the bytecode to who-knows-what kind of computer, and then run the bytecode
    with no trouble at all. That''s one of the many reasons Java has become popular
    so quickly. This outstanding feature, gives you the ability to run code on many
    different kinds of computers, is called portability.


    What makes Java bytecode versatile? This fantastic versatility enjoyed by Java
    programs comes from the Java Virtual Machine. The Java Virtual Machine is one
    of three those that you must have on your right,


    Imagine that you''re the Windows representative to the United Nations Security
    Council. (See Figure 2-1) The Macintosh representative is on your left. (Naturally,
    you don''t get along with either of these people: You''re always cordial to one
    another, but you''re never sinner. What do you expect? It''s politics!) The distinguished
    representative from Java is at the podium. The Java representative is speaking
    in bytecode, and neither nor your fellow ambassadors understand a word of Java
    bytecode.


    ![](img/be49a553c8cd52419c36f97f5ee90278_42_0.png)


    +   Figure 2-1: An imaginary meeting of the UN Security Council.


    But each of you has an interpreter. Your interpreter translates bytecode to Windows
    while the Java representative speaks. Another interpreter translates from bytecode
    to Macintosh-ese. And a third interpreter translates bytecode into Linux-speak.'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# 30 Part I: Getting Started with Java


    Think of your interpreter as a virtual ambassador. The interpreter doesn''t really
    represent your country, but the interpreter performs one of the important tasks
    that a real ambassador performs. The interpreter listens to bytecode on your behalf.
    The interpreter does what you would do if your native language was Java bytecode.
    The interpreter pretends to be the Windows ambassador, and sits through the boring
    bytecode speaking, in every word, and processing each word in some way or other.


    You have an interpreter — a virtual ambassador. In case a Windows computer runs
    its own bytecode-interpreting software. That software is the Java Virtual Machine.


    A Java Virtual Machine is a proxy, an errand boy, a go-between. The JVM serves
    as an interpreter between Java''s runanywhere bytecode and your computer''s system.
    While it runs, the JVM works your computer through the execution of bytecode instructions.
    The JVM examines your code, bit by bit, and carries out the instructions described
    in bytecode. The JVM interprets bytecode for your Windows system, your Mac, or
    your Linux box, or for whatever kind of computer you''re using. That''s a good
    thing. It makes Java programs more portable than programs in any language.


    # What on is Java 2 Standard Edition 1.2?


    If you poke around the web looking for Java tools, you find things with all kinds
    of strange names. The Java Development Kit, the Software Development Kit, the
    Java Runtime Environment, and other confusing names.


    +   * The Java Development Kit (JDK) and Software Development Kit (SDK) for different
    versions of the same tool — a tool whose component is a Java compiler.

    * The Java Runtime Environment (JRE) stands for a tool whose component is a Java
    Virtual Machine.


    If you install the JDK on your computer, the JRE comes with it. You can also get
    the JRE on its own. In fact, you may have many combinations of JDK and JRE on
    your computer. For example, my Windows computer currently has JDK 1.8, JDK 1.8,
    and JRE 8 in c:\program files\Java


    directory has JRE in its c:\program files (x86)\Java directory. Only occasionally
    do I run into any version conflicts. If you suspect you''re experiencing a version
    conflict, it''s best to uninstall all JDK and JRE versions except the latest (for
    example, JDK 1.8 or JRE 8). number of Java versions can be confusing. Instead
    of "Java 1," "Java 2," and "Java 3," the number of Java versions winds through
    an obstacle course. This sidebar''s figure describes the development of new Java
    versions over time. Each Java version has several names. The product version is
    an official name that the developer version is a number in general, and that identifies
    versions so that programs can keep track of them. (In casual conversation, developers
    use all kinds of names for the various Java versions.) The code name is a most
    playful name that identifies a version while it''s created.


