- pgno: 349
  md: "# 336 Part IV: Savvy Java Techniques\n\nThe directory that houses this project's\
    \ code\n\nShowFrame (Listing 13-1) in unnamed package\n\n![](img/be49a553c8cd52419c36f97f5ee90278_349_0.png)\n\
    \nFigure 14-5: The files and directories in our project.\n\n| drawings |\n Drawing\
    \ (Listing 13-2) in package com.burdbrain.drawings |\n\n| frames |\n ArtFrame\
    \ (Listing 13-3) in package com.burdbrain.frames |\n\n# Looking for files in all\
    \ the right places\n\nIf you try to compile the program in Listing 14-1. The Java\
    \ compiler poles through the code and stumbles upon some missing pieces. First\
    \ there is this missing ArtFrame. Then you have this Drawing business. Listing\
    \ 14-1 defines a class named ShowFrame, not ArtFrame or Drawing. So does the compiler\
    \ find for information about the ArtFrame and Drawing classes?\n\nTo this problem,\
    \ Java defines something called CLASSSPATH. The CLASSSPATH is a list of places\
    \ where the compiler and the JVM looks for. There are several ways to set a CLASSSPATH.\
    \ Some programmers create a new CLASSSPATH each time they run a Java program.\
    \ Others create a system-wide CLASSSPATH variable. (If you are familiar with the\
    \ PATH variable on Windows or UNIX you may already know how this works.) One way\
    \ or another, the compiler and the JVM need a list of places to look for. Without\
    \ such a list, these Java tools don't look anywhere. They don't find classes like\
    \ ArtFrame or Drawing. So you get a symbol message or a NoClassDefFoundError message\
    \ and you're unhappy.\n\nIf you think about it, the problem can be daunting. Should\
    \ the compiler search all your hard drive for files named ArtFrame, Java or Drawing?\
    \ How large is your new drive? 700GB? 8,000,000GB? What about references to network\
    \ drives? The search space is potentially unlimited. What if the compiler eventually\
    \ resolves all these issues? Then you try to run your code, and the Java Virtual\
    \ Machine (JVM) starts all over again. (For info on the Java Virtual Machine,\
    \ see Chapter 2.)"
  merge: -1
  img_proc: true
