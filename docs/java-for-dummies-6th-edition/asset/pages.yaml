  md: '# 324 Part IV: Savvy Java Techniques


    Figure 13-14: Running the code from Listing 13-11.

    > Exception caught in doSomething. I''ll get printed


    In the catch clause, that lowlife doSomething method divides 0 by 0 again, the
    statement that says the division isn''t a protective try clause. That''s okay,
    because an ArithmeticException isn''t checked. It''s one of those RuntimeException
    subclasses. It''s an exception that doesn''t have to be acknowledged in a try
    or a throws clause. For details, see the previous section.


    Well, checked or not, the throwing of another ArithmeticException causes control
    to jump out of the doSomething method. But, before leaving the computer executes
    the statement''s last will testament — namely, the statement inside the finally
    clause. That''s why in Figure 13-14 you see the words I''ll get printed.


    Interestingly enough, you don''t see the words I won''t printed in Figure 13-14.
    Because the catch clause''s execution throws its own uncaught exception, the computer
    never makes it past the try-catch-finally statement.


    So, the computer goes back to where it left off in the main method. Back in the
    main method, word of the doSomething method''s ArithmeticException mismaps causes
    execution to jump into a catch clause. The computer prints Exception caught in
    main, and then this terrible nightmare of a run is finished.


