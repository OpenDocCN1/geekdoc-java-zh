  md: '# Chapter 4: Making the Most of Variables and Their Values


    When you do this, you don''t say that you''re assigning values to variables.

    The pieces of the declarations with equal signs in them aren''t really called
    assignment statements. Instead, you say that you''re initializing the variables.

    Believe or not, keeping this distinction in mind is helpful.


    Like everything else in life, initializing a variable has advantages and disadvantages:


    +   * When you combine six lines of Listing 4-3 to just one declaration, the code
    becomes more concise. Sometimes, concise code is easier to read. Sometimes it''s
    not. As a programmer, it''s your judgment call.

    * By initializing a variable, you might automatically avoid certain programming
    errors. For an example, see Chapter 7.

    * In some situations, you have no choice. The nature of your code forces you to
    initialize or not to initialize. For an example that doesn''t lend itself to variable
    initialization, the deleting-evidence program in Chapter 6.


    # ## The Atoms: Java''s Primitive Types


    The words int and double that I describe in the previous sections are examples
    of primitive types (also known as simple types) in Java. The Java language has
    exactly eight primitive types. As a newcomer to Java, you can pretty much ignore
    all four of these types. (As programming languages go, Java is nice and compact
    that way.) Table 4-1 shows the complete list of primitive types.


    | Table 4-1 | Java''s Primitive Types |

    | Type Name | What a Literal Looks Like | Range of Values |

    |---|---|---|

    | Whole number types | | |

    | byte | (byte) 42 | -128 to 127 |

    | short | (short) 42 | -32768 to 32767 |

    | int | 42 | -2147483648 to 2147483647 |

    | long | 42L | -9223372036854475808 to -9223372036854475807 |

    | Decimal number types | | |

    | float | 42.0F | -3.4 × 10³⁸ to 3.4 × 10³⁸ |

    | double | 42.0 | -1.8 × 10³⁰⁸ to 1.8 × 10³⁰⁸ |


    (continued)'
