    \ true, the thing on the right side is true, or both\nthings are true. For instance,\
    \ the expression 2 < 10 || 20 < 30 is true.\n\nIn Java, you can't combine combinations\
    \ the way you do in ordinary English.\nIn English, you'll have between three and\
    \ ten people at the\ndinner table.\" But in Java, you get an error message if\
    \ you write 3 <= people\n<= 10. To do this comparison, you need something like\
    \ 3 <= people &&\npeople <= 10.\n\nIn Listing 5-4, if the statement's condition\
    \ has more than a dozen parentheses.\nWhat happens if you omit two of them?\n\n\
    ```\nif (\n    username != null &&\n    password != null &&\n// open parenthesis\
