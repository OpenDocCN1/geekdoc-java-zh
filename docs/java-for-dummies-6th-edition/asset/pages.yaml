  md: '# Chapter 9: Constructing New Objects


    In the display method of Listing 9-5, notice the calls to the Temperature class''s
    getNumber and getScale methods. Why do I do this? Well, inside the TemperatureNice
    class''s code, any direct references to the number and scale fields would generate
    error messages. It''s true that every TemperatureNice object has its own number
    and scale fields. (After all, TemperatureNice is a subclass of the Temperature
    class, and the code for the Temperature class defines the number and scale fields.)
    But because number and scale are declared private inside the Temperature class,
    only that''s right TemperatureNice class can directly use these fields.


    ![](img/be49a553c8cd52419c36f97f5ee90278_218_0.png)


    Don''t put all declarations of the number and scale fields inside the TemperatureNice
    class''s code. If you do, you inadvertently create four different variables (two
    called number, and two called scale). You''ll assign values to one of them. Then
    you''ll be shocked, when you display the other variables, those seem to have disappeared.


    ![](img/be49a553c8cd52419c36f97f5ee90278_218_1.png)


    When an object''s code contains a call to one of its object''s methods, for instance,
    in the last state of Listing 9-5, the object calls its methods with getNumber()
    and getScale(), not with someObject.getNumber() and somethingOrOther.getScale().
    If doing that makes you queasy, you can compensate by taking advantage of yet
    another one for the this keyword. Just write this.getNumber() and this.getScale()
    in the last line of Listing 9-5.


    # Constructors for subclasses


    By far, the news in Listing 9-5 is what the code declares constructors. The TemperatureNice
    class has four of its own constructors. If you''ve gotten in gear thinking about
    subclass inheritance, you might wonder why these constructor declarations are
    necessary. Doesn''t TemperatureNice inherit the parent Temperature class''s constructors?
    No, subclasses don''t inherit constructors.


    ![](img/be49a553c8cd52419c36f97f5ee90278_218_2.png)


    Subclasses do not inherit constructors.


    That''s right. Subclasses do not inherit constructors. In one oddball case, a
    constructor may look like it''s being inherited, but that oddball situation is
    a fluke, the norm. In general, when you define a subclass, you declare new constructors
    to go with the subclass.


    I describe the oddball case (in which a constructor looks like it''s being inherited)
    later in this chapter, in the section "The default constructor."'
