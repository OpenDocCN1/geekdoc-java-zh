  md: '# Chapter 10: Putting Variables and Methods Where They Belong


    # Static is old hat


    This section makes a big noise about static fields and methods, but static things
    have been part of the picture since early in this book. For example, Chapter 3
    introduces System.out.println. The name System refers to a class, and out a static
    field in that class. That''s why, in Chapter 4 and beyond, I use the static keyword
    to import the out field:


    ```

    import java.lang.System.out;

    ```


    In Java, static fields and methods show up over the place. When they''re declared
    in someone else''s code, and you''re making use of them in your code, you had
    ever to worry about them. But when you''re declaring your own fields and methods
    must decide whether to make them static, you have to think a little harder.


    ![](img/be49a553c8cd52419c36f97f5ee90278_244_0.png)


    In this book, my first use of the word static is back in Listing 3-1. I use the
    static keyword as part of every main method (and lots of main methods are in this
    book''s listings). Remember that static things belong to objects, not classes.
    Why does main method be static? If the main method isn''t static, you can''t have
    a method until you create an object. But, when you start up a Java program, no
    objects have been created yet. The statements that are executed in the main method
    start creating objects. So, if the main method isn''t static, you have a big chicken-and-egg
    problem.


    # Could use static; handle with care


    When I started writing Java, I had recurring dreams about getting a certain error
    message. The message was non-static variable or method cannot be referenced from
    a static context. So often I did see this message, so thoroughly was I perplexed,
    that the memory of this message became into my subconscious existence.


    These days, I know why that error occurs so often. I can even make the message
    occur if I want. But I still feel a little shiver when I see this message on screen.


    Before you understand why the message occurs and how to fix the problem, you need
    to get some terminology under your belt. If a field or method isn''t static, it''s
    called non-static. (Real surprising, hey?) Given that terminology, there are at
    least two ways to make the dreaded appear:


    +   * Put Class.nonstaticThing somewhere in your program.

    * Put nonstaticThing somewhere inside a static method.'
