  md: "# Chapter 10: Putting Variables and Methods Where They Belong\n\n# # Returning\
    \ an object from a method\n\nBelieve it or not, the previous sections on parameter\
    \ passing left one nook and cranny of Java methods unexplored. When you call a\
    \ method, the method can return something right back to the calling code. In previous\
    \ chapters and sections, I return primitive values, such as int values, or nothing\
    \ (otherwise known as void). In this section, I return a whole object. It's an\
    \ object of type City from Listing 10-12. The code that makes this happen is in\
    \ Listing 10-14.\n\nListing 10-14: Here, Have a City\n\n```\npublic class TrackPopulation\
    \ {\n    public static void main(String[] args) {\n        City smackoverAR =\
    \ new City();\n        smackoverAR.population = 2232;\n        smackoverAR = doBirth(smackoverAR);\n\
    \        System.out.println(smackoverAR);\n    }\n\n    static City doBirth(City\
    \ aCity) {\n        City myCity = new City();\n        myCity.population = aCity.population\
    \ + 1;\n        return myCity;\n    }\n}\n```\n\nIf you run the code in Listing\
    \ 10-14, you get the number 2,233. That's good. The code works by telling the\
    \ doBirth method to create another City instance. The new instance, the value\
    \ of population is 2333. (See Figure 10-13.)\n\n![](img/be49a553c8cd52419c36f97f5ee90278_256_0.png)"
  merge: -1
