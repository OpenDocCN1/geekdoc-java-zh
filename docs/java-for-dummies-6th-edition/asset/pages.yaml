  md: '# 284 Part IV: Savvy Java Techniques


    In Chapter 11, you step through an array by using an enhanced for-statement. Listing
    12-4 has its own enhanced for statement. But in Listing 12-4, the enhanced for
    statement steps through the values in a collection. Each value is a sale. The
    loop repeatedly checks a sale to find out whether the item is sold a DVD. If so,
    the code adds the sale''s price to the running total. The program''s output is
    $36.00—the running total displayed as a currency amount.


    The scenario in Listing 12-4 isn''t unusual. You have a collection of things (such
    as sales). You step through the things in the collection, finding the things that
    meet certain criteria (being the sale of a DVD, for example). You grab a value
    (such as the sale price) of each thing that meets your criteria. Then you do something
    useful with the values that you''ve grabbed (for example, adding the values together).


    Here are some examples:


    +   * Step through your list of employees. Find each employee whose performance
    evaluation has score 3 or above. Give each a $100 bonus and then determine the
    total amount of money you''ll pay in bonuses.


    +   * Step through your list of customers. For each customer who has shown interest
    in buying a smartphone, send the customer an email about their month''s discount
    plans.


    +   * Step through the list of planets that have been discovered. For each M-class
    planet, find the probability of finding intelligent life on the planet. Then find
    the average of all such probabilities.


    This scenario is so common that it''s worth finding better and better ways to
    deal with it. One way is to use of the new functional programming features in
    Java 8.


    # Streams


    The "Using iterator" section introduces iterators. You use an iterator''s next
    method to spit out a collection''s values. Java 8 takes this concept step further
    with the notion of a stream. A stream is an iterator that, with a stream, you
    don''t have to call a next method. A stream spits out a collection''s values automatically.
    To get values from a stream, you don''t call a stream''s next method. In fact,
    a typical stream has no next method.'
