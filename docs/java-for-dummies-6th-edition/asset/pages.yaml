  md: '# 90 Part II: Writing Your Own Java Programs


    Lo and behold, the last line of Listing 4-8 shows how you can do the same thing
    with Java''s plain-old equal sign. The thing that I call an assignment statement
    near the start of this chapter is really one of the assignment operators that
    I describe in this section. Therefore, whenever you\u2019 assign a value to something,
    you can make that assignment part of a larger statement.


    Each use of an assignment operator does double duty as a statement and an expression.
    In all cases, the expression''s value equals whatever you assign. For example,
    before executing the code System.out.println(numberOfBunnies -= 7), the value
    of numberOfBunnies is 172. As a statement, numberOfBunnies -= 7 tells the computer
    to subtract 7 from numberOfBunnies (so the value of numberOfBunnies goes from
    172 to 165). As an expression, the value of numberOfBunnies -= 7 is 165. So the
    code System.out.println(numberOfBunnies -= 7) really means System.out.println(165).
    The number 165 displays on the computer screen.


    For a richer explanation of this kind of thing, see the sidebar "Statements and
    expressions,\uu2019 earlier in this chapter.


