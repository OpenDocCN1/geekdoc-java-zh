    # Packages and import declarations


    Java has a feature that lets you lump classes into groups of classes. Each lump
    of classes is called a package. In the Java world, programmers customarily use
    these packages, dotted names. For instance, I''ve registered the domain name allmycode.com,
    I name a package allmycode.com.textUtils. The Java API is actually a big collection
    of packages. The API has classes with names java.lang, java.util, java.awt, and
    so on.


    the name of the package in which the class is defined. You can find out all this
    about java.util and Scanner by reading Java''s API documentation. For tips on
    reading the documentation, see Chapter 3 and this book''s website.


    Here''s another example. The declaration


    ```

    import java.swing.*;

    ```


    is valid because java.swing is not of a package in the Java API, and the asterisk
    refers to all classes in the java.swing package. With this declaration at the
    top of your code, you can use abbreviations for classes in the java.swing package
    — names like JFrame, JButton, JMenuBar, JCheckBox, and many others.


    With this information about packages, I can clear up some of the confusion about
    import declarations. Any import declaration doesn''t use the static import with
    the name of the package and must end with either


    +   - The name of a class with that package

    - An asterisk (indicating all classes within that package)


    For example, the declaration


    ```

    import java.util.Scanner;

    ```


    is valid because java.util is the name of a package in the Java API, and Scanner
    is the name of a class in the java.util package. The dotted named name is the
    fully qualified name of java.util.Scanner class. A class''s fully qualified name
    includes


    Here''s one example. A line like


    ```

    import java.swing.*; //Bad!!

    ```


    is not a valid import declaration. The Java API has no package with the one-word
    name java. You may think that line allows you to abbreviate all names with java
    (names like java.swing.JFrame and java.sound.midi), but that''s not the import
    declaration works. Because java isn''t the name of a package, the line java.*
    just angels the Java compiler.


    All the methods in the JFrame constructor come from the parent class, JFrame.
    The JFrame lives in the java.swing package. This package and another package,
    java.awt, have classes that help you put windows, images, drawings, and other
    gizmos on a computer screen.


    (In the java.awt package, the letters aw stand for abstract window


