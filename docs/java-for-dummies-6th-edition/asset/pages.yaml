    In Listing 10-2, by the time you''ve reached the call to pack, you''ve already
    called addPlayerInfo nine times and added 18 labels to the frame. In executing
    the pack method, the computer picks a nice size for each label, whatever you''ve
    put inside the label. Then, the computer picks a nice size for the whole frame,
    given that the frame has labels inside.


    When you stop onto frames, you have quite a bit of leeway with the order in which
    you do things. For instance, you can set the layout before you''ve added labels
    and other stuff to the frame. If you call setLayout and add labels, the labels
    appear in nice, orderly positions on the frame. If you reverse this order (add
    labels and then call setLayout), the calling of setLayout rearranges the labels
    in a nice, orderly fashion. It works either way.


    In setting up a frame, the one thing that you shouldn''t violate is the following
    sequence:


    ```

    Add things to the frame, then

    pack();

    setVisible(true);

    ```


    If you call pack and add more things to the frame, the pack method doesn''t take
    the more recent things that you''ve added into consideration. If you call setVisible
    before you add things or call pack, the user sees the frame as if it''s being
    constructed. Finally, if you forget to set the frame''s size (by calling pack
    or some other sizing method), the frame that you looks like the one in Figure
