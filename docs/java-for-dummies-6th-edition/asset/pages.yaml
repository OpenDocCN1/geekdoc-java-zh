  md: '# # Chapter 13: Looking Good When Things Take Unexpected Turns


    The text @SuppressWarnings("serial") in Listing 13-3 is a Java annotation. For
    an introduction to annotations, see Chapter 8. For a few words about the SuppressWarnings
    annotation, see Chapter 9.


    If you use Eclipse, you may see a yellow warning marker next to the new OutOfRangeException
    line in Listing 13-4. When you hover pointer over the warning marker, Eclipse
    says, "Resource leak: ''keyboard'' is not closed at this location." Eclipse is
    very fussy to make sure that your code executes the keyboard.close() statement.
    (yes, under certain circumstances, throwing your OutOfRangeException can cause
    the program to skip the keyboard.close() statement. But no, in my opinion, you
    can safely ignore this when you run the code in Listing 13-4.


    # # Who''s going to catch the exception?


    Take one more look at Listing 13-4. Notice that one catch clause can accompany
    a single try clause. When an exception is thrown inside a try clause, the computer
    starts going down the accompanying list of catch clauses. The computer starts
    at whatever catch clause comes immediately after the try clause and works its
    way down the program''s text.


    For each catch clause, the computer asks itself, "Is the exception that was just
    thrown an instance of the class in this clause''s parameter list"


    +   - If not, the computer skips this catch clause and moves on to the next catch
    line.

    - If so, the computer executes this catch clause and then skips all the other
    catch clauses that come with this try clause. The computer goes on and executes
    whatever statements come after the whole try-catch statement.


    For some concrete examples, see Listings 13-5 and 13-6.


    # Listing 13-5: Yet Another Exception


    ```

    @SuppressWarnings("serial")

    class NumberTooLargeException

    extends OutOfRangeException {

    }

    ```'
