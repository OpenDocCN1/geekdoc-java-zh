- pgno: 32
  md: '# Chapter 1: All about Java


    # 19


    Close your eyes for a minute and think about what it means for something to be
    a chair. . . .


    A chair has a seat, a back, and legs. Each seat has a shape, a color, a degree
    of softness, and so on. These are the properties that a chair possesses. What
    I describe as **chairness**— the notion of something being a chair. In object-oriented
    terminology, I am describing the *Chair* class.


    Now peek over the edge of this chair''s margin and take a minute to look around
    your room. (If you''re not sitting in a chair right now, feel it.)


    Several chairs are in the room, and each chair is an object. Each of these objects
    is an example of ethereal thing called the *Chair* class. So that''s how it works—
    the class is the idea of **chairness**, and each individual chair is an object.


    A chair isn''t a collection of things. Instead, a class is the idea behind certain
    kind of thing. When I talk about the class of chairs in your room, I''m talking
    about the fact that each chair has legs, a seat, a color, and so on.  The colors
    may be different for different chairs in the room, but that doesn''t matter. When
    you talk about a class of things, you''re focusing on the properties that each
    of them possesses.


    ![](img/be49a553c8cd52419c36f97f5ee90278_32_0.png)


    It makes sense to think of an object as being a concrete instance of a class.
    In fact, the official terminology is consistent with this thinking. If you define
    a *Chair* class, each actual chair (the chair that you''re sitting on, the empty
    chair right next to you, and so on) is called an *instance* of the *Chair* class.


    Here''s another way to think about a class. Imagine a table displaying all three
    of your bank accounts. (See Table 1-1.)


    | Table 1-1 |

    | A Table of Accounts |

    | Account Number | Type | Balance |

    |---|---|---|

    | 16-13154-22864-7 | Checking | 174.87 |

    | 1011 1234 2122 0000 | Credit | -471.03 |

    | 16-17238-13344-7 | Savings | 247.38 |


    Think of the table''s column headings as a class, and how each row of the table
    as an object. The table''s column headings describe the *Account* class.'
