    # A taxonomy of lambda expressions


    Java 8 divides lambda expressions into about 45 different categories. Table 12-2
    lists a few of the categories.


    | Table 12-2 | A Few Kinds of Lambda Expressions |

    |---|---|

    | Name Description Example | Function Accepts one parameter; produces a result
    of any type | (sale) -> price |

    | Predicate | Accepts one parameter; produces a boolean valued result | (sale)
    -> sale.item.equals("DVID") |

    | BinaryOperator | Accepts two parameters of the same type; produces a result
    of the same type | (price1, price2) -> price1 + price2 |

    | Consumer | Accepts one parameter; produces no result | (sale) -> System.out.println(sale.price)
    |


    The categories in Table 12-2 aren’t mutually exclusive. For example, every Predicate
    is a Function. (Every Predicate accepts one parameter and returns a result. The
    result happens to be boolean.)


    # Using streams and lambda expressions


    Java 8 has fancy methods that make optimal use of streams and lambda expressions.
    With streams and lambda expressions, you can create an assembly line that elegantly
    solves your chapter’s problem. Unlike the code in Listing 12-4, the new assembly
    line solution uses concepts from functional programming.


    The assembly line consists of several methods. Each method takes the data, transforms
    the data in some way or other, and hands its results to the next method in line.
    Figure 12-10 illustrates the assembly line for this chapter’s sales problem.'
