- pgno: 428
  md: '# About the Author


    Barry Burd earned a Master of Science degree in computer science at Rutgers University
    and a PhD in mathematics at the University of Illinois. As a teaching assistant
    in Champaign-Urbana, Illinois, he was elected five times to the university-wide
    List of Teachers Ranked as Excellent by Their Students.


    Since 1980, Burd has been a professor in the Department of Mathematics and Computer
    Science at Drew University in Madison, New Jersey. When he''s not lecturing at
    Drew University, Dr. Burd leads training courses for professional programmers
    in business and industry. He has lectured at conferences in the United States,
    Europe, Australia, and Asia. He is the author of several articles and books, including
    Beginning Programming with Java For Dummies, Java Programming for Android Developers
    For Dummies, and Android Application Development All-in-One For Dummies, all from
    Wiley Publishing, Inc.


    Dr. Burd lives in Madison, New Jersey, with his wife and two kids (both in their
    20s and not on their own). In his spare time, he enjoys being a workaholic.


    # Dedication


    for


    Jennie, Sam, and Harriet,


    Jennie and Benjamin, Katie and Abram,


    and Basheva


    # Author''s Acknowledgments


    I love having my name on the cover of this book. But honestly, I''m not the only
    person responsible for the creation of this work. I want to thank everyone involved,
    with special thanks to Connie Santieb, Brian Walls, and Virginia Sanders for their
    work on this 6th edition.'
