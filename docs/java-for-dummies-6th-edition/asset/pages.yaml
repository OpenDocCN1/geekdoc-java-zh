  md: '# 88 Part II: Writing Your Own Java Programs


    Are you trying to decide between using preincrement or postincrement? Try no longer.
    Most programmers use postincrement. In a typical Java program, you often see things
    like numberOfOfBunnies++. You see them things like ++numberOfBunnies.


    In addition to preincrement and postincrement, Java has two operators that use
    --. These operators are called decrement and postdecrement.


    +   With predecrement (--numberOfBunnies), the computer subtracts 1 from the variable''s
    value before the variable is used in the rest of the statement.


    +   With postdecrement (numberOfBunnies--), the computer subtracts 1 from the
    variable''s value after the variable is used in the rest of the statement.


    Instead of writing ++numberOfBunnies, you could achieve the same effect by writing
    numberOfBunnies = numberOfBunnies + 1. Some people conclude that ++ and -- operators
    are for saving keystrokes — keep those poor fingers from overworking themselves.
    This is entirely incorrect. The best reason for using them is to avoid the inefficient
    and error-prone practice of writing the same variable name twice. If you write
    numberOfBunnies only once (as you do with ++ or --), the computer has to figure
    out what numberOfBunnies means only once. On top of that, when you write only
    once, you only have one chance (instead of two chances) to type the variable incorrectly.
    With simple expressions like numberOfBunnies++, these advantages hardly made a
    difference. But with more complicated expressions, such as inventoryItems[quantityReceived---items]++,
    the efficiency and accuracy that you gain by using ++ and -- are significant.


    # Assignment operators


    If you read the preceding section, which is about operators that add 1, you may
    be wondering whether you can manipulate these operators to add 2 or 5 or 100000.
    Can you write numberOfBunnies++++ and still call yourself a programmer? Well,
    you can''t. If you try it, an error message appears when you try to compile your
    code.


    So what can you do? As would have it, Java has plenty of assignment operators
    that you can use. With an assignment operator, you can add, subtract, multiply,
    or divide by anything you want. You can do other cooler operations, too. Listing
    4-8 has a smorgasbord of assignment operators (the things with equal signs). Figure
    4-16 shows the output from running 4-8.'
