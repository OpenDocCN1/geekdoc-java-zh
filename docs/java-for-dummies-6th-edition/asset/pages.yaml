  md: '# 130 Part II: Writing Your Own Java Programs


    In spite of this silly twoPlusTwo example, the while statement turns out to be
    the most versatile of Java''s looping constructs. In particular, the while loop
    is good for situations in which you must look before you leap. For example, “While
    money is in my account, write a mortgage check every month.” When you encounter
    this statement, if your account has a zero balance, you don''t want to write a
    mortgage check — not even one check.


    But at times (many), you want to leap before you leap. Take, for instance, the
    situation in which you''re asking the user for a response. Maybe the response
    makes sense, but maybe it doesn''t. If it doesn''t, you want to ask again. Maybe
    the user''s finger slipped, or perhaps the user didn''t understand the question.


    6-5 shows some runs of a program to delete a file. Before deleting the file, the
    program asks the user whether the deletion is okay. If the user answers y or n,
    the program proceeds according to the user''s wishes. But if the user enters other
    character (any digit, uppercase letter, punctuation), the program asks the user
    for another response.


    | Delete evidence? (y/n) | |

    |---|---|

    | Sorry, buddy. Just asking. | |

    | Delete evidence? (y/n) | u |

    | Delete evidence? (y/n) | Y |

    | Delete evidence? (y/n) | L |

    | Delete evidence? (y/n) | S |

    | Delete evidence? (y/n) | |

    | Delete evidence? (y/n) | Y |

    | The evidence has been deleted. |


    > **Figure 6-5:** Two runs of the code in **Listing 6-4.**


    To write this program, you need a loop — a loop that repeatedly asks the user
    whether the file should be deleted. The loop keeps asking until the user gets
    a meaningful response. Now, the thing to notice is that the loop doesn''t need
    to check anything before asking the user first. Indeed, before the user gives
    the first response, the loop has nothing to check. The loop doesn''t start with
    “as long as such-and-such is true, then it gets a response from the user.” Instead,
    the loop just jumps ahead, and then checks the response to the user to see whether
    it makes sense.


    That''s why the program in Listing 6-4 has a do loop (also known as a do-while
    loop). With a do loop, the program jumps right in, takes action, and then checks
    a condition to see whether the result of the action makes sense. If the result
    makes sense, execution of the loop is done. If not, the program goes back to the
    top of the loop for another go-around.'
