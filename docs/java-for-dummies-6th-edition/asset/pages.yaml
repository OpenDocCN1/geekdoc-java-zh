    # Using SQL commands


    In Listing 17-1, the header of the code in three calls to executeUpdate Each contains
    a string ~a normal, Java double-quoted string of characters. To keep the code
    readable, I chopped each string into parts and I separate the parts with plus
    signs (Java''s string concatenation operator).


    Java''s plus sign does double duty. For strings, the plus sign performs addition.
    For strings, the plus sign squishes two strings together, creating one big combined
    string.


    ![](img/be49a553c8cd52419c36f97f5ee90278_393_1.png)


    You can make a double-quoted string as long as you like. When you come to the
    right edge of your screen, keep typing. If you want to see the whole string without
    scrolling, however, you can break the string into pieces, as I did in Listing
    17-1. Just separate the pieces with plus signs.


    You cannot break a string into pieces by pressing Enter and moving to the next
    line. When you start with the double-quote (""), the ending double-quote must
    be on the same line of code.


    If you''re familiar with SQL (Structured Query Language), the command strings
    in the calls to executeUpdate make sense to you. If not, pick up a copy of SQL
    For Dummies, 8th Edition, by Allen G. Taylor. One or another, don''t go fishing
    around for this explanation of create table and insert into. You will find the
    explanations these command strings aren''t part of Java. These commands are just
    strings of characters that you feed to the executeUpdate method. These strings,
    are written in SQL, create a new database and add rows of data to that table.
    When you write a Java database program, that''s what you do. You write ordinary
    SQL commands and surround those commands with Java methods.


    ![](img/be49a553c8cd52419c36f97f5ee90278_393_2.png)


    The code here adheres to the techniques defined in JDBC version 1.0. Later versions
    of the JDBC classes support something called scrollable results. With a scrollable
    result set, you have methods like insertRow — methods that save the effort of
    writing complete SQL'
