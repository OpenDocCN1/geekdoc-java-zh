  md: '# Chapter 12: Using Collections and Streams (When Arrays Aren’t Good Enough)


    # Why bother?


    The chain of method calls in Listing 12-5 accomplishes everything that the loop
    in Listing 12-4 accomplishes. But the code in Figure 12-15 uses concepts from
    functional programming. So what''s the big deal? Are you better off with Listing
    12-5 than with Listing 12-4?


    You are. For the past several years, the big trend in chip design has multicore
    processors. With several cores, a processor can execute several statements at
    once, speeding up a program''s execution by a factor of 2, or 4 or even more.
    Programs run much faster if you divide the work among several cores. How do you
    divide the work?


    You can modify the imperative code in Listing 12-4. For example, with some fancy
    features, you can handle loop iterations to different cores. The resulting code
    is very messy. For the code to work properly, you have to micromanage the loop
    iterations, checking carefully to make sure that the final total is correct.


    In contrast, the functional code is easy to modify. To take advantage of multicore
    processors, you can change only one word in Listing 12-5!


    A parallel stream is like an ordinary stream except that objects are not processed
    in any particular order. A parallel stream''s values don''t depend on one another,
    so you can process several of the values at the same time. If your processor has
    more than one core (and most processors do these days) you can divide the stream''s
    values among the available cores. Each core works independently of the others,
    and each core dumps its result into a final tally. The reduce method combines
    the cores'' results into a final tally, and your answer is computed in lightning-fast
    time. It''s a win for everyone.


    # Method references


    Take a critical look at the last lambda expression in Listing 12-5:


    ```

    (price1, price2) -> price1 + price2

    ```'
