    # What to put into all these methods


    The code in Listings 16-4 and 16-5 uses a standard formula for creating animation
    inside an applet. Here''s a very brief explanation:


    +   - The applet implements the ActionListener interface.

    - The start creates a new timer with the following code:

    ```

    new Timer(100, this);

    ```

    Every 100 milliseconds (every tenth of a second), the timer in Listing 16-4 rings
    its alarm.

    When it rings its alarm, the timer actually calls Java to call an actionPerformed
    method. And whose actionPerformed method does Java call? Once again, the keyword
    answers the question. In Listing 16-4, the world refers to this very same code—this
    instance of the Odometer object that contains the new Timer(100, this) call. So
    every tenth of a second, when the timer rings its alarm, Java calls the actionPerformed
    method in Listing 16-4. How nice and tidy is it!

    The actionPerformed method calls the repaint method. Under the hood, the repaint
    always calls somebody''s paint method. In this example, somebody is the code in
    Listing 16-5. This paint method draws the words you are visitor whatever on the
    screen.

    - At some point, the day is done, and your browser calls the stop method. When
    this happens, the stop method tosses the timer into the dumpster.


    If it''s not standard code, I''d feel guilty explaining this so briefly. But,
    really, to achieve motion in your own applet, just copy Listings 16-4 and 16-5.
    Then replace the listing''s init and paint methods with your own code.


