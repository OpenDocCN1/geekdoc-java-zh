  md: "# Chapter 5: Controlling Program Flow with Decision-Making Statements 113\n\
    \n# Choosing among Many Alternatives\n(Java switch Statements)\n\nI am the first\
    \ to admit that I hate making decisions. If things go wrong, I would rather have\
    \ the problem be someone else's. Writing the previous sections (on making decisions\
    \ with Java's if statement) knocked the stuff right out of me. That's why my mind\
    \ boggles as I begin this section on choosing many alternatives. A relief is that\
    \ he that confession out of the way!\n\n# Your basic switch statement\n\nNow,\
    \ it is time to explore situations in which you have a decision with many branches.\
    \ Take, for instance, the popular crimson song \"Al's All Wet.\" (For a review\
    \ of the lyrics, see the sidebar). You're eager to write code that prints this\
    \ song's lyrics. Fortunately, you don't have to type all the words over again.\
    \ Instead, you can take advantage of the repetition in the lyrics.\n\nA complete\
    \ program to display the \"Al's All Wet\" lyrics won't come until Chapter 6. In\
    \ the meantime, assume that you have a variable named verse. The value of verse\
    \ is 1, 2, 3, or 4, depending on which version of \"Al's All Wet\" you're trying\
    \ to print. You could have a big, clumsy bunch of if statements that checks each\
    \ possible verse number.\n\n```\nif (verse == 1) {\n    out.println(\"That's because\
    \ he has no brain.\");\n}\nif (verse == 2) {\n    out.println(\"That's because\
    \ he is a pain.\");\n}\nif (verse == 3) {\n    out.println(\"Cause this is the\
    \ last refrain.\");\n}\n```\n\nBut that approach seems wasteful. Why not create\
    \ a statement that checks the value of verse just once and then takes an action\
    \ on the value that it finds? Fortunately, just such a statement exists. It's\
