  md: "# 354 Part IV: Savvy Java Techniques\n\nChapter 8 introduces the use of @Override\
    \ — a Java annotation. Normally, you use @Override to signal the replacement of\
    \ a method that's already been declared in a superclass. From Java 6 onwards,\
    \ you can also use @Override to signal an interface method's implementation. That's\
    \ what I do in Listing 15-1.\n\n![](img/be49a553c8cd52419c36f97f5ee90278_367_0.png)\n\
    \n# Threads of execution\n\nHere's a well-kept secret: Java programs are multithreaded,\
    \ which means several things are going on at once whenever you run a Java program.\
    \ Sure, the computer is executing the code you've written, but it's executing\
    \ other code as well (code you didn't write and don't see). All this code is being\
    \ executed at the same time. While the computer executes your main method's statements,\
    \ one after another, the computer takes time out, sneaks away and executes statements\
    \ from some other, unseen methods. For most simple Java programs, these statements\
    \ are ones that are defined as part of the Java Virtual Machine (JVM).\n\nFor\
    \ instance, Java has an event-handling thread. While your code runs, the event-handling\
    \ thread's code runs in the background. The event-handling thread's code listens\
    \ for mouse clicks and takes appropriate action whenever a user clicks the mouse.\
    \ Figure 15-3 illustrates how this works.\n\n| Your code's thread | The event-handling\
    \ thread |\n|--- |--- |\n| setLayout(new FlowLayout())); add(textField); add(button);\
    \ add(label); | Did the user click the mouse? |\n| | Did the user click the mouse?\
    \ |\n| button.addActionListener(this); pack(); setVisible(true); | Did the user\
    \ click the mouse? Yes? Okay, then, I'll call the actionPerformed method. |\n\n\
    When the user clicks the button, the event-handling thread says, \"Okay, the button\
    \ was clicked. So, what should I do about that?\" And the answer is, \"Call actionPerformed\
    \ methods.\" It's as if the event-handling thread has code like this:\n\n```\n\
    if (buttonJustGotClicked()) {\n  object1.actionPerformed(infoAboutTheClick);\n\
    \  object2.actionPerformed(infoAboutTheClick);\n  object3.actionPerformed(infoAboutTheClick);\n\
    }\n```"
