    # # No variables? No problem!


    Consider the problems posed at the start of the “New in Java 8: Functional Programming”
    section. Several clients try to update Oracle''s stock price at the same time,
    or two visitors try to buy the same item on a website. The source of the problem
    is shared data. How many clients share access to a web page? How many of your
    processor cores can modify the same variable? If you get rid of shared data, your
    programming problems go away.


