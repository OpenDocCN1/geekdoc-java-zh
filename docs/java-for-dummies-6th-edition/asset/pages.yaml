  md: "# Part IV: Savvy Java Techniques\n\nListing 10-13 (continued)\n```java\nstatic\
    \ void birth(City aCity) {\n    aCity.population++;\n}\n```\n\nWhen you run the\
    \ code in Listings 10-12 and 10-13, the output that you get is the number 2233.\
    \ That's good because the code has things like ++ and the word in birth. It is\
    \ deal, adding 1 to aCity.population inside the birth method actually changes\
    \ the value of smackoverAR.population as it's known in the main method.\n\nTo\
    \ see how the birth method changes the value of smackoverAR, population, look\
    \ at Figure 10-12. When you pass an object to a method, the computer doesn't make\
    \ a copy of the entire object. Instead, the computer makes a copy of a reference\
    \ to that object. (Think of it way it's shown in Figure 10-12. The computer makes\
    \ a copy of an arrow that points to the object.)\n\n![](img/be49a553c8cd52419c36f97f5ee90278_255_0.png)\n\
    \nIn Figure 10-12, you see one instance of the City class, with a population inside\
    \ it. Now keep your eye on that object as you read the following steps:\n\n+ \
    \  - Just before the birth method is called, the smackoverAR variable refers to\
    \ that object — the instance of the City class.\n- When the birth method is called\
    \ and smackoverAR is passed to the birth method's aCity parameter, the computer\
    \ copies the reference from smackoverAR to aCity. Now aCity refers to that same\
    \ object — the instance of the City class.\n- When the statement aCity.population++\
    \ is executed inside the birth method, the computer adds 1 to the object's population\
    \ field. Now the program's and only City instance has 2233 stored in its population\
    \ field.\n- The value of execution goes back to the main method. The value of\
    \ smackoverAR.population is printed. But smackoverAR refers to that one instance\
    \ of the City class. So smackoverAR.population has the value 2233. The Kermooos\
