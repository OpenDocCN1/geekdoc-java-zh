    \n# The parameter in a catch clause\n\nTake a look at the catch clause in Listing\
    \ 13-2 and pay particular attention to the words (NumberFormatException e). This\
    \ looks a lot like a method's parameter list, doesn't it? In fact, every catch\
    \ clause is like a little mini-method with its own parameter list. The parameter\
    \ list always has a name and a parameter.\n\nIn 13-2, I don't do anything with\
    \ the catch clause's e, but I could certainly do if I wanted. The exception that\
    \ thrown is an object — an instance of the NumberFormatException class. When an\
    \ exception is caught, the computer makes the catch clause's reference to that\
