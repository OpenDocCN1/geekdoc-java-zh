  md: '# Chapter 11: Using Arrays to Juggle Values 247


    +   - The room number (a number from 0 to 9), which is called an index of the
    array

    - A number of guests, which is a value stored in a component of the array


    Using an array saves you all from the repetitive nonsense in the sample code shown
    at the beginning of this section. For instance, to declare an array with ten values
    in it, you can write one fairly short statement:


    ```

    int guests[] = new int [10];

    ```


    If you''re especially verbose, you can expand this statement so that it becomes
    two separate statements:


    ```

    int guests[];

    guests = new int [10];

    ```


    In either of these code snippets, notice the use of the number 10. This number
    tells the computer to make the guests array have ten components. Each component
    of the array has a name of its own. The starting component is named guests[0],
    and so on. The last of the ten components is named guests[9].


    In an array, you always specify the number of components. The array''s indices
    start with 0 and end with the number that''s one less than the total number of
    components.


    The snippets that I show you give two ways to create an array. The first way uses
    one line. The second way uses two lines. If you take the single line, you can
    put it inside or outside a method. The choice is yours. On the other hand, if
    you use two separate lines, the second line, guests = new int [10], should be
    inside a method.


    In an array declaration, you can put the square brackets before or after the variable
    name. In other words, you can write int guests[] or int[] guests. The computer
    creates the same guests variable no matter form you use.


    ![](img/be49a553c8cd52419c36f97f5ee90278_260_0.png)


    # Creating an array in two easy steps


    Look once again at the two lines that you can use to create an array:


    ```

    int guests[];

    guests = new int [10];

    ```'
