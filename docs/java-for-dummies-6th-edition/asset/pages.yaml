  md: '# # Chapter 18


    # # Ten Ways to Avoid Mistakes


    In This Chapter


    +   - Checking your capitalization and value comparisons

    - Watching out for fall-through

    - Putting methods, listeners, and constructors where they belong

    - Using static and non-static references

    - Avoiding other heinous errors


    > > he only people who never make mistakes are the people who never do anything
    at all." One of my college professors said that. I don''t remember the professor''s
    name, so I can''t give him proper credit. I guess that''s my mistake.


    # # Putting Capital Letters Where They Belong


    Java is a case-sensitive language, so you really have to mind your Ps and QS —
    along with every other letter of the alphabet. Here are some details to keep in
    mind as you create Java programs:


    +   - Java''s keywords are all completely lowercase. For instance, in a Java statement,
    the word can''t be If or IF.

    - When you use names from the Java API (Application Programming Interface), the
    case of the names has to match what appears in the API.

    - You also need to make sure that the names you make yourself are capitalized
    the same way throughout your entire program. If you declare a myAccount variable,
    you can''t refer to it as MyAccount, myaccount, or MyAccount. If you capitalize
    the variable name two different ways, Java thinks you''re referring to two completely
    different variables.


    For more info on Java''s case-sensitivity, see Chapter 3.'
