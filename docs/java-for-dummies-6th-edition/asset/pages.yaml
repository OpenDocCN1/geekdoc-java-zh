  md: "# Chapter 6: Controlling Program Flow with Loops\n\n# The anatomy of a for\
    \ statement\n\nAfter the word *for*, you always put three things in parentheses.\
    \ The first of these three things is called an *initialization*, the second is\
    \ an *expression*, and the third thing is called an *update*.\n\n```\nfor ( initialization\
    \ ; expression ; update )\n```\n\nEach of the three items in parentheses plays\
    \ its own distinct role:\n\n+   * The **initialization** is executed once, when\
    \ the run of your program reaches the for statement.\n* The **expression** is\
    \ evaluated several times (before each iteration).\n* The **update** is also evaluated\
    \ several times (at the end of each iteration).\n\nIf it helps, think of the loop\
    \ as if it is shifted around:\n\n```\nint count = 1\nfor count <= 10 {\n    out.print(\"\
    The value of count is \");\n    out.print(count);\n    out.println(\".\");\n \
    \   count++;\n}\n```\n\nYou can write a for statement this way. Even so, this\
    \ is the order in which the parts of the statement are executed.\n\nIf you declare\
    \ a variable in the initialization of a *for* loop, you can't use that variable\
    \ outside the loop. For instance, in Listing 6-2, you get an error message if\
    \ you try putting `out.println(count)` after the end of the loop.\n\nAnything\
    \ that can be done with a *for* loop can also be done with a *while* loop. Choosing\
    \ to use a *for* loop is a matter of style and convenience, not necessity.\n\n\
    ![](img/be49a553c8cd52419c36f97f5ee90278_140_0.png)\n\n# The world premiere of\
