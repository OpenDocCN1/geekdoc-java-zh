    Figure 6-3. Counting to ten.


    With count now equal to 2, the for statement checks again to make sure that count
    is less than or equal to 10. (Yes, 2 is smaller than 10.) Because the test turns
    out okay, the for statement marches back into the curly braced statements and
    prints The value of count is 2 on the screen. Finally, the for statement does
    that last inside its parentheses — it adds 1 to the value of count, incrementing
    the value of count to 3.


    And so on. This whole thing repeats until, after 10 iterations, the value of count
    finally reaches 11. When this happens, the check for count being less than or
    equal to 10 fails, and the loop''s execution ends. The computer jumps to whatever
    statement comes immediately after the for statement. In Listing 6-2, the computer
    prints Done! Figure 6-4 illustrates the whole process.


