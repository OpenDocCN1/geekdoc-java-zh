    \            new Scanner(new File(\"GuestList.txt\"));\n            PrintStream\
    \ listOut =\n                new PrintStream(\"GuestList.txt\");\n           \
    \ guests[0] = diskScanner.nextInt();\n            listOut.print(5);\n        \
    \    diskScanner.close();\n            listOut.close();\n        }\n}\n```\n\n\
    Like many methods and constructors of its kind, the PrintStream constructor doesn't\
    \ pussyfoot around files. If it can't find a GuestList.txt file, the constructor\
    \ creates a GuestList.txt file and prepares to write values into it. If a GuestList.txt\
    \ file already exists, the PrintStream constructor deletes the existing file and\
    \ prepares to write to a new, empty GuestList.txt file. So, in the BadCode case,\
    \ the new PrintStream constructor deletes whatever GuestList.txt file already\
    \ exists. This delete comes before the call to diskScanner.nextInt(). So diskScanner.can't\
    \ read whatever was originally in the GuestList.txt file. That's bad!\n\nTo avoid\
    \ this, I carefully separated the two uses of the GuestList.txt file in Listing\
    \ 11-4. The top of the listing, I construct diskScanner, then read from the original\
    \ GuestList.txt file, and then close diskScanner. Later, toward the end of the\
    \ listing, I construct listOut, then write to a new GuestList.txt file, and then\
    \ close listOut. With writing separated from reading, everything works correctly.\n\
