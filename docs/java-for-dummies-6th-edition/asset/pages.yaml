  md: "# Chapter 13: Looking Good When Things Take Unexpected Turns\n\n# Listing 13-11:\
    \ Jumping Around\n\n```\nimport static java.lang.System.out;\npublic class DemoFinally\
    \ {\n    public static void main(String args[]) {\n        try {\n           \
    \ doSomething();\n        } catch (Exception e) {\n            out.println(\"\
    Exception caught in main.\");\n        }\n    }\n\n    static void doSomething()\
    \ {\n        try {\n            out.println(0 / 0);\n        } catch (Exception\
    \ e) {\n            out.println(\"Exception caught in doSomething.\");\n     \
    \   }\n        finally {\n            out.println(\"I'll get printed.\");\n  \
    \      }\n    }\n    out.println(\"I won't get printed.\");\n}\n```\n\nNormally,\
    \ when I think about a try statement, I think about the computer recovering from\
    \ an unpleasant situation. The recovery takes place inside a catch clause, and\
    \ the computer marches on to whatever statements come after the try statement.\
    \ Well, if something goes wrong during execution of a catch clause, this picture\
    \ can start looking.\n\nListing 13-11 gets a workout in Figure 13-14. First, the\
    \ main method calls out Something. Then, the stupid doSomething method goes out\
    \ of its way to cause trouble. The doSomething method divides 0 by 0, which is\
    \ illegal and undoable in anyone's programming language. This foolish action by\
    \ the doSomething method throws an ArithmeticException, which is caught by the\
    \ try statement's one and only catch clause."
