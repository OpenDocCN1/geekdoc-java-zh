    ) ||\n    username.equals(\"hritter\") &&\n    password.equals(\"preakston\")\n\
    // close parenthesis omitted\n)\n```\n\nJava tries to protect your wishes by grouping\
    \ everything before the \"or\"\n(the || operator).\n\n```\nif (\n    username\
    \ != null &&\n    password != null &&\n    username.equals(\"bburd\") &&\n   \
