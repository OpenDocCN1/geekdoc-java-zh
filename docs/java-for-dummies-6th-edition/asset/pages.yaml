  md: '# Waiting to be called


    When you look at the code in Listings 16-1 and 16-2, you may notice one thing
    — an applet doesn''t have a main method. That''s because an applet isn''t a complete
    program. An applet is a class that contains methods, and your browser calls those
    methods (directly or indirectly). Do you see the init method in Listing 16-1?
    The browser calls this init method. Then the init method''s call to setContent
    drags the code from Listing 16-2.


    Now, take a look at the paint method in Listing 16-2. The browser calls this paint
    method automatically, and the paint method tells the browser how to draw your
    applet on the screen.


    For a list of applet methods that your web browser calls, see the section titled
    "The methods in an applet," later in this chapter.


    # A public class


    Notice that the SimpleApplet in Listing 16-1 is a public class. If you create
    an applet and don''t make the class public, you get an Applet not initiated or
    a Loading Java Failed error. To state things very plainly, any class that extends
    Japplet must be public. If the class isn''t public, your web browser can''t call
    the class''s methods.


    To state things a little less, a class can have either default or public access.
    The only code that can reference a default access class is code''s in the same
    package as the default access call. Remember that your browser calls to tell methods
    will be buried inside your applet because the web browser isn''t likely to be
    in the same package as your applet (believe me, it''s not), the applet must be
    public. If the applet isn''t public, your web browser can''t call any of your
    applet''s methods.


    For more information on public and default access, see Chapter 14.


    # The Java API (again)


