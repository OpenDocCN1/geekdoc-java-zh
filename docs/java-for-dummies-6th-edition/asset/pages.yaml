  md: '# Four ways to store whole numbers


    Java has four types of numbers. The types are byte, short, int, and long. Unlike
    the complicated story about the accuracy of types float and double, the only thing
    that matters when you choose among the number types is the size of the number
    you''re trying to store. If you want to use numbers larger than 127, don''t use
    byte. To store numbers larger than 32767, don''t use short.


    Most of the time, you''ll use int. But if you need to store numbers larger than
    2147483647, forsake int in favor of long. (A long number can be as big as 922337203685475807)
    For the whole story, see Table 4-1.


    (as you do with the slash in Listing 4-3), you get another int. When you divide
    1400 by 150, you get 9 — not 9. You see this in Figure 4-6. Taken together, the
    following statements display 9 onscreen:


    ```

    numberOfPeople =nelatorWeightLimit / weightOfAPerson;

    System.out.print(numberOfPeople);

    ```


    # Combining Declarations and Initializing Variables


    Look back at Listing 4-3. In that listing, you see three variable declarations
    — one for each of the program''s three int variables. I could have done the same
    with one declaration:


    ```

    int weightOfAPerson, elevatorWeightLimit, numberOfPeople;

    ```


    If two variables have completely different types, you can''t create both variables
    in the declaration. For instance, to create an int named weightOfFred and a double
    named amountInFedsAccount, you need two separate declarations.


    ![](img/be49a553c8cd52419c36f97f5ee90278_83_0.png)


    You can give their starting values in a declaration. In Listing 4-3 for instance,
    one declaration can replace several lines in the main method (all the calls to
    print println).


    ```

    int weightOfAPerson = 150, elevatorWeightLimit = 1400,

    numberOfPeople = elevatorWeightLimit/weightOfAPerson;

    ```'
