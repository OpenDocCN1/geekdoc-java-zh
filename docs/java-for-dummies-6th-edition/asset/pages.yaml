  md: '# 98 Part II: Writing Your Own Java Programs


    or an initialization. In an if statement''s condition, you can''t replace the
    double equal sign with a single equal sign. If you do, your program just won''t
    work.(You almost always get an error message when you try to compile your code.)


    On the other hand, if you never make the mistake of using a single equal sign
    in a condition, you''re not normal. Not long ago, while I was teaching an introductory
    Java course, I promised I''d swallow my laser pointer if no one made the single
    equal sign mistake during any of the lab sessions. This wasn''t an idle promise.
    I''ve never had to keep it. Even if I ignored the first ten times anyone made
    the single equal sign mistake during those lab sessions, I would still be laser-pointer
    free. Everybody uses the single equal sign several times in his or her programming
    career.


    The trick is not to avoiding the single equal sign mistake; the trick is to catch
    the mistake whenever you make it.


    ![](img/be49a553c8cd52419c36f97f5ee90278_111_0.png)


    # Brace yourself


    If the statement in Listing 5-1 has two halves — a top half and a bottom half,
    I have names for these two parts of an if statement. I call them the if part (the
    top half) and the else part (the bottom half).


    The if part in Listing 5-1 seems to have more than one statement in it. I make
    this happen by enclosing the three statements of the if part in a pair of curly
    braces. When I do this, I form a block. A block is a bunch of statements scrunched
    together by a pair of curly braces.


    With this block, three calls to println are tucked away inside the if part. With
    the curly braces, the rows of asterisks and the words You display only until the
    user''s guess is correct.


    This business with blocks and curly braces applies to the else part as well. In
    Listing 5-1, wherever inputNumber doesn''t equal randomNumber, the computer executes
    print/println. To convince the computer that all three of these are inside the
    else clause, I put these calls into a block. That is, I enclose these in a pair
    of curly braces.


    Strictly speaking, Listing 5-1 has only one statement between the if and the else
    statements and only one statement after the else statement. The trick is that
    when you place a bunch of statements inside curly braces, you get a block, and
    a block behaves, in facts, like a single statement. In fact, the official Java
    documentation lists blocks as one of the many kinds of statements. So, in Listing
    5-1, the block that prints You win and asterisks is a single statement that has,
    within it, three smaller statements.


    ![](img/be49a553c8cd52419c36f97f5ee90278_111_1.png)'
