  md: '# 322 Part IV: Savvy Java Techniques


    # # Finishing the Job with a finally Clause


    Once upon a time, I was a young fellow, living with my parents in Philadelphia,
    just starting to drive a car. I was heading toward a friend''s house and thinking
    about who knows when another car came from nowhere and bashed my car''s passenger
    driver. This kind of thing is called a RunARedLightException.


    Anyway, both cars were still drivable, and we were right in the middle of a busy
    intersection. To avoid causing a traffic jam, we both pulled over to the nearest
    curb. (which had a very young picture of me on) and opened the door to get out
    of my car.


    And that''s when the second accident happened. As I was getting out of my car,
    a city bus was coming by. The bus hit me and rolled against my car a few times.
    This kind of thing is called a DealWithLawyersException.


    The truth is that everything came just fine. I was bruised but not battered. My
    parents paid for the damage to the car, so I never suffered any financial consequences.
    (I managed to pass on the financial burden by putting the RunARedLightException
    into my catch clause.)


    This incident helps to explain why the way I do about exception handling. In particular,
    I wonder, ''What happens if, while the computer is recovering from one exception,
    a second exception is thrown?'' After all, the statements inside a catch clause
    aren''t immune to calamities.


    Well, the answer to this question is anything but simple. For starters, you can
    put a try statement inside a catch clause. This protects you against unexpected,
    potentially embarrassing incidents that can crop up during the execution of the
    catch clause. But when you starting about cascading exceptions, you upon a very
    slippery can of worms. The number of scenarios is large, and things can become
    complicated quickly.


    One-to-complicated thing that you can do is create a finally clause. Like a catch
    clause, a finally clause comes after a try clause. The big difference is that
    the statements in a finally clause are executed whether or not an exception is
    thrown. The idea is, "No matter what happens, good or bad, execute the statements
    inside this finally clause." Listing 13-11 has an example.'
