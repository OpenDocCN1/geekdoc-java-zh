  md: "# Adding Components to a GUI\n\nHere's a constructor for a Java frame:\n\n\
    ```\npublic SimpleFrame() {\n    JButton button = new JButton(\"Thank you...\"\
    );\n    setTitle(\"...Connie Santeban and Brian Walls\");\n    setLayout(new FlowLayout());\n\
    \    add(button);\n    button.addActionListener(this);\n    setSize(300, 100);\n\
    \    setVisible(true);\n}\n```\n\nWhatever you do, don't forget the call to the\
    \ add method. Without this call, you go to all the work of creating a button,\
    \ but the button doesn't show up on your frame. For an introduction to issues,\
    \ see Chapter 9.\n\n# Adding Listeners to Handle Events\n\nLook again at the previous\
    \ section's code to construct a JFrame. If you forget the call to addActionListener,\
    \ nothing happens when you click the button. Clicking the button harder a second\
    \ time doesn't help. For the rundown on listeners, see Chapter 15.\n\n# Defining\
    \ the Required Constructors\n\nWhen you define a constructor with parameters,\
    \ as in\n\n```\npublic Temperature(double number)\n```\n\nthen the computer no\
    \ longer creates a default parameterless constructor for you. In other words,\
    \ you can no longer call\n\n```\nTemperature roomTemp = new Temperature();\n```\n\
    \nunless you explicitly define your own parameterless Temperature constructor.\
    \ For all the gory details on constructors, see Chapter 9."
