  md: '# Java For Dummies, 6th Edition


    # How This Book Is Organized


    This book is divided into subsections, which are grouped into sections, which
    come together to make chapters, which are lumped finally into five parts. (When
    you write a book, you get to know your book''s structure pretty well. After months
    of writing, you find yourself dreaming in sections and chapters when you go to
    bed at night.) The parts of the book are listed here.


    # Part 1: Getting Started with Java


    This part is your complete, executive briefing on Java. It includes some “What
    is Java?” material and a jump-start chapter — Chapter 3, you visit the major technical
    ideas and dissect a simple program.


    # Part II: Writing Your Own Java Program


    Chapters 4 through 6 cover the fundamentals. These chapters describe the things
    that you need to know so you can get your computer humming along.


    If you''ve written programs in Visual Basic, C++, or any other language, some
    of the material in Part II may be familiar to you. If so, you can skip some sections
    or read this stuff quickly. But don''t read too quickly. Java is a little different
    from other programming languages, especially in the things I describe in Chapter
    4.


    # Part III: Working with the Big Picture: Object-Oriented Programming


    Part III has some of my favorite chapters. This part covers the all-important
    topic of object-oriented programming. In these chapters, you find out how to map
    solutions to big problems. (Sure, the examples in these chapters aren''t big,
    but the examples involve big ideas.) Bite-wise increments, you discover cover
    how to design classes, using existing classes, and construct objects.


    Have you read any of those books that explain object-oriented programming in vague,
    general terms? I''m very proud to say that Java For Dummies, 6th Edition, isn''t
    like that. In this book, I illustrate each concept with a simple-concrete program
    example.'
