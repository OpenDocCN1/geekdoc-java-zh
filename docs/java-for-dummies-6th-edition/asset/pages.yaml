  md: '# Part III: Working with the Big Picture: Object-Oriented Programming


    When I tried to compile the new code, I got this error message: variable yourAccount
    might not have been initialized. That settles it. Before you do new Account(),
    you can''t print the name variable of an object because an object doesn''t exist.


    ![](img/be49a553c8cd52419c36f97f5ee90278_157_0.png)


    When a variable has a reference type, simply declaring the variable isn''t enough.
    You don''t get an object until you call a constructor and use the keyword new.


    For information about reference types, see Chapter 4.


    # Initializing a variable


    In Chapter 4, I announce that you can initialize a primitive type variable as
    part of the variable''s declaration.


    ```

    int weightOfAPerson = 150;

    ```


    You can do the thing with reference type variables, such as myAccount and yourAccount
    in Listing 7-2. You can combine the first lines in the listing''s main method
    into just two lines, like this:


    ```

    Account myAccount = new Account();

    Account yourAccount = new Account();

    ```


    If you combine this way, you automatically avoid the variable might not have been
    initialized error that I describe in the previous section. Sometimes you find
    a situation in which you can''t initialize a variable. When you can initialize,
    it''s usually a plus.


    # Using an object''s fields


    After you''ve bitten off and chewed the main method''s first four lines, the rest
    of the code in the earlier Listing 7-2 is sensible and straightforward. You have
    three lines that put value in the myAccount object''s fields, three lines that
    put values in the yourAccount object''s fields, and four lines that do some printing.
    Figure 7-3 shows the program''s output.


