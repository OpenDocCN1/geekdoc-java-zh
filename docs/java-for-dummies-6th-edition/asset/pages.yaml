  md: '# Chapter 7: Thinking in Terms of Classes and Objects 143


    Instead, the line Account yourAccount means, "If and when I make the variable
    yourAccount refer to something, that something will be an instance of the Account
    class." So, what''s the difference?


    The difference is simply declaring Account yourAccount doesn''t make the yourAccount
    variable refer to an object. All the declaration reserves the variable name yourAccount
    so that the name can eventually refer to an instance of the Account class. The
    creation of an actual object doesn''t come until later in the code, when the computer
    executes new Account ().


    Technically, when the computer executes new Account(), you''re creating an object
    by calling the Account class''s constructor. I have more to say about that in
    Chapter 9.


    When the computer executes the assignment yourAccount = new Account(), the computer
    creates a new object (an instance of the Account class) and makes the variable
    yourAccount refer to that object. The equal sign makes the variable refer to the
    new object.) Figure 7-2 illustrates the situation.


