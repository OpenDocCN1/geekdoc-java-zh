  md: '# Chapter 5: Controlling Program Flow with Decision-Making Statements


    # Indenting statements in your code


    Notice how, in Listing 5-1, the print and println calls inside the if statement
    are indented. (This includes both the win and lose statements. The print and println
    calls that come after the world else are still part of the if statement.) Strictly
    speaking, you don''t have to indent the statements that are inside an if statement.
    For all the compilers, you can write your whole program on a single line or place
    all your statements in an artful, misshagen zigzag. The problem is that neither
    you nor anyone else make sense of your code if you don''t indent your statements
    in some logical fashion. In Listing 5-1, the indenting of the print and println
    statements helps your eye (and brain) see quickly that these statements are subordinate
    to the overall if/else flow.


    In a small program, unind or poorly indented code is barely tolerable. But in
    a complicated program, indentation doesn''t follow a neat, logical pattern is
    a big, ugly nightmare.


    Many Java IDEs have tools to indent your code automatically. In fact, code indentation
    is one of my favorite IDE features. So''t walk—run—to a computer, and visit this
    book''s website (www.almycode.com/JavaForDummies) for more information on what
    Java IDEs can offer.


    When you write if statements, you may be tempted to chuck all the curly braces
    out of the window and just rely on indentation. Unfortunately, this seldom works.
    If you indent three statements after the world else and forget to enclose those
    statements in curly braces, the computer thinks that the else part includes only
    the first of the three statements. What''s worse, the indentation misleads you
    into believing that the else part includes all three statements. This makes it
    more difficult to figure out why your code isn''t behaving the way you think it.
    So watch those braces!


    # Elseless in Ifrica


    Okay, so the title of this section is contrived. Big deal! The idea is that you
    can create an if statement without the else part. Take, for instance, the code
    in Listing 5-1, shown earlier. Maybe you''d not rub it in in whenever the user
    loses the game. The modified code in Listing 5-2 shows you how to do this (and
    Figure 5-3 shows you the result).'
