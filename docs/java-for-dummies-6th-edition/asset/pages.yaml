    \ or the code for an app on your mobile phone.\n\nHow many tools do you need for\
    \ creating Java programs? As a novice, you need three tools:\n\n+   **You need\
    \ a compiler.**\n A compiler takes the Java code that you write and turns that\
    \ code into something that can run on your computer.\n\n+   **You need a Java\
    \ Virtual Machine (JVM).**\n A Java Virtual Machine runs your code (and other\
