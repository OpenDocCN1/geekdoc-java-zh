  md: '# 146 Part III: Working with the Big Picture: Object-Oriented Programming


    The UseAccount class in Listing 7-2 is also public. When a class contains a main
    method, Java programmers tend to make the class public without thinking much about
    who uses it. So even if no other classes use of my main method, I declare the
    UseAccount class to be public. Most of the classes in this book contain main methods,
    most of the classes in this book are public.


    ![](img/be49a553c8cd52419c36f97f5ee90278_159_0.png)


    When you declare a class to be public, you must declare the class in a file whose
    name is exactly the name of the class (but with the .java extension). For example,
    if you declare public class MyImportantCode, you must put the code in a file MyImportantCode.java,
    with uppercase M, I, and C and all other letters lowercase. This file-naming rule
    has an important consequence: if your code declares two public classes, your code
    must consist of at least two .java files. In other words, you can''t declare two
    public classes in one .java file.


    For more news about the word public and other words, see Chapter 14.


    # Defining a Method within a Class (Displaying an Account)


    Imagine a table containing the information about two accounts. (If you have trouble
    imagining such thing, just look at Table 7-1.)


    | Table 7-1 Without Object-Oriented Programming |

    | :--- | :--- | :--- |

    | Name | Address | Balance |

    | Barry Burd | 222 Cyberspace Lane | 24.02 |

    | Jane Q. Public | 111 Consumer Street | 55.63 |


    In Table 7-1, each account has three things — a name, an address, and a balance.
    That''s how things were done before object-oriented programming came along. Object-oriented
    programming involved a big shift in thinking. With object-oriented programming,
    each account can have a name, an address, a balance, and a way of being displayed.


    In object-oriented programming, each object has its own built-in functionality.
    An account knows how to display itself. A string can tell you whether it has the
    same characters inside it as another string has. A PrintStream instance, such
    as System.out, knows how to do println. In object-oriented programming, each object
    has its methods. These methods are little subprograms that you can call to have
    an object do to (or for) itself.


    ![](img/be49a553c8cd52419c36f97f5ee90278_159_1.png)'
