    **Figure 5-2:** An if statement is like a fork in the road.


    Does the value of `inputNumber` equal the value of `randomNumber`? When the condition
    is true, the computer does the stuff between the condition and the word `else`.
    When the condition turns out to be false, the computer does the stuff after the
    `else`. Either way, the computer goes to execute the last `printf` call, which
    displays Thank you for playing.


    The condition in an if statement must be enclosed in parentheses. However, a line
    like if (inputNumber == randomNumber) is not a complete statement (just as "If
    I had a hammer == a complete sentence.). So this line if (inputNumber == randomNumber)
    wouldn''t end with a semicolon.


    Sometimes, when I''m writing about a condition that''s being tested, I slip into
    using the word `expression` instead of `condition`. That''s okay because every
    condition is an expression. An expression is something that has a value, and sure
    enough, every condition has a value. The condition''s value is either `true` or
    `false`. (For revealing information about expressions and values `true` and `false`,
    see Chapter 4).


    # The double equal sign


    In Listing 5-1, in the statement''s condition, notice the use of the double equal
    sign. Comparing two numbers to see whether they''re the same isn''t the same as
    setting something equal to something else. That''s why the symbol to compare for
    equality isn''t the same as the symbol that''s used in an assignment'
