  md: '# 26 Part I: Getting Started with Java


    The instructions in Listing 2-2 aren''t Java source code instructions. They''re
    Java bytecode instructions. When you write a Java program, you write source code
    instructions (like the instructions in Listing 2-1). After writing the source
    code, you run a program (that is, you apply a tool) to your source code. The program
    is a compiler. The compiler translates your source code instructions into Java
    bytecode. In other words, the compiler takes code that you can write and understand
    (like the code in Listing 2-1) and translates it into code that a computer can
    execute (like the code in Listing 2-2).


    You might put your source code in a file named Hotel.java. The compiler probably
    puts the Java bytecode in another file Hotel.class. Normally, you don''t bother
    looking at the bytecode in the Hotel.class file. In fact, the compiler doesn''t
    execute the Hotel.class file as ordinary text, so you can''t examine the bytecode
    with an ordinary editor. If you try to open Hotel.class with Notepad, TextEdit,
    KWrite, or even Microsoft Word, you see nothing but squiggles, and other gobledygook.
    To create Listing 2-2, I had to apply another tool to my Hotel.class file. That
    tool displays a text-version of a Java bytecode file. I used Ando Saab''s Java
    Bytecode Editor (www.cs.loc.ie/~/jbe).


    ![](img/be49a553c8cd52419c36f97f5ee90278_39_0.png)


    No one (except for a few crazy developers in isolated labs in faraway places)
    writes Java bytecode. You run software (a compiler) to create Java bytecode. The
    only reason to look at Listing 2-2 is to understand what a hard worker your computer
    is.


    ![](img/be49a553c8cd52419c36f97f5ee90278_39_1.png)


    # What is a Java Virtual Machine?


    > "A Java Virtual Machine runs your code (and other people''s Java code) on your
    computer."

    -Barry Burd, Java For Dummies, 6th Edition


    In the preceding "What is a compiler?" section, I make a big fuss about following
    instructions like the ones in Listing 2-2. As fuses goes, it''s a very nice fuss.
    But if you don''t read every fussy word, you may be misguided. The exact wording
    is "computers follow cryptic instructions like the ones in Listing 2-2 are a lot
    like instructions that a computer can execute, but generally, computers don''t
    execute Java bytecode instructions. Instead, each kind of processor has its own
    set of executable instructions, and each computer operating system uses the processor''s
    instructions in a slightly different way.'
