    ;\n```\n\nOf course, a call such as myAccount.setName(\"Joe Schmoe\") still works\
    \ because \"Joe Schmoe\" doesn't equal the empty string \"\".\n\nThat's cool.\
    \ With a private field and an accessor method, you can prevent someone from assigning\
    \ the empty string to an account's name field. With more elaborate if statements,\
    \ you can enforce any rules you want."
