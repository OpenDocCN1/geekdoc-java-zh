  md: '# New in Java 8: Functional Programming


    From 1953 to 1957, John Backus and others developed the FORTRAN programming language,
    which contained the basic framework for thousands of 20th century programming
    languages. The framework has come to be known as imperative programming because
    of its “do this, then that” nature.


    A few years after the rise of FORTRAN, John McCarthy created another language
    named Lisp. Unlike FORTRAN, the underlying framework for Lisp is functional programming.
    In a purely functional program, you avoid “do this, then that.” Instead, you write
    things like “here’s how you will be forming this into that when you get around
    to doing the transformation.


    For one reason or another, imperative programming became the dominant mode. As
    such, Java is fundamentally an imperative programming language. But recently,
    functional programming has emerged as a powerful and useful way of thinking about
    code.


    I have read lists of and attended dozens of presentations describing functional
    programming. Frankly, most of these descriptions aren’t very helpful. Some of
    them feed you a bunch of rigorous definitions and expect you to form your own
    intuitions. Others describe the intuitive ideas without giving you any concrete
    examples to work with.


    So instead of describing functional programming in detail, I start this section
    with an analogy. Then, in the rest of this chapter, I present some Java 8 examples.


    The analogy that I use to describe functional programming is very rough. A friend
    of mine called this analogy stretch because it applies to many different programming
    frameworks, not only to functional programming. One way or another, I think the
    analogy is helpful.


    Here’s the analogy: Imagine a programming problem as a cube, and imagine an imperative
    programming solution as a way of slicing the cube into manageable pieces. (See
    Figure 12-3.)


    ![](img/be49a553c8cd52419c36f97f5ee90278_293_0.png)


    Imperative programming'
