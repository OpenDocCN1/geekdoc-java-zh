  md: '# 318 Part IV: Savvy Java Techniques


    For the purpose of understanding exceptions in general, you don''t need to know
    exactly what an InterruptedException is. All you really have to know is that a
    call to Thread.sleep can throw one of these InterruptedException objects. But
    if you''re really curious, an InterruptedException is thrown when some code interrupts
    some other code''s sleep. Imagine that you have two pieces of code running at
    the same time. One piece of code calls the Thread.sleep method. At the same time,
    another piece of code calls the interrupt method. By calling the interrupt method,
    the second code brings the first code''s Thread.sleep method to a screeching halt.
    The Thread.sleep method responds by spitting out an InterruptedException.


    Now, the Java programming language has two kinds of exceptions. They''re called
    checked and unchecked exceptions:


    +   - The potential throwing of a checked exception must be acknowledged

    - The potential throwing of an unchecked exception doesn''t need to be acknowledged
    in the code.


    An InterruptedException is one of Java''s checked exception types. When you call
    a method that has the potential to throw an InterruptedException, you need to
    acknowledge that in the code.


    Now, when I say that an exception is acknowledged in the code, what do I mean?


    ```

    // The author wishes to thank that InterruptedException,

    // without which this code could not have been written.

    ```


    No, that''s not what it means to be acknowledged in the code. Acknowledging an
    exception in the code means one of two things:


    +   - The statements (including method calls) that can throw the exception are
    inside a try clause. That clause has a catch clause with a matching exception
    type in its parameter list.

    - The statements (including method calls) that can throw the exception are inside
    a method that has a throws clause in its header. The throws clause contains a
    matching exception type.


    If you''re confused by the wording of these two bullets, don''t worry. The next
    two listings illustrate the points made in the bullets.


    In Listing 13-9, the method call that can throw an InterruptedException is inside
    a try clause. That clause has a catch clause with exception type InterruptedException.'
