  md: '# Chapter 15: Responding to Keystrokes and Mouse Clicks 357


    # The serialVersionUID


    Chapter 9 introduces the Suppress annotation to avoid dealing with something called
    a serialVersionUID. A serialVersionUID helps Java avoid version conflicts when
    you send an object from one place to another. For example, you can send the state
    of your JFrame object to another computer''s. Then the other computer can check
    the frame''s version number to make sure no funny business is taking place.


    In Chapter 9, I de-step the serialVersionUID issue by telling Java to ignore any
    warnings about missing serial numbers. But in Listing-15, I take a holder approach.
    I give my JFrame object real serialVersionUID. This is my first version of GameFrame,
    so I give this GameFrame the version number 1. (Actually, I give this GameFrame
    the long value 1. See Chapter 4).


    So when would you to change a class''s serialVersionUID number? If version 1 is
    nice, is version 2 even better? The answer is complicated, but the bottom line
    is, don''t change the serialVersionUID unless you make incompatible changes to
    the class''s code. By "incompatible changes," I mean changes that makes it impossible
    for the receiving computer''s existing code to handle your newly objects.


    ![](img/be49a553c8cd52419c36f97f5ee90278_370_0.png)


    For more details about the serialVersionUID and what constitutes an incompatible
    code change,


    ```

    http://download.oracle.com/javase/7/docs/platform/serialization/spec/version.html#6678

    ```


    Java has some visual tools to help you design a GUI interface. If you visit eclipse.org/windowbuilder,
    you can read about WindowBuilder for Eclipse. With WindowBuilder, you drag components
    from a palette onto a frame (The components includes buttons, text fields, and
    others.). Using your mouse, you can move and resize each component. As you design
    the frame visually, Eclipse creates the frame''s code automatically. Each component
    on the frame has a little spreadsheet showing the component''s properties. For
    example, you can change the text on a button''s face by changing the text entry
    in its spreadsheet. When you right-click or control-click the picture of a component,
    you get the option of jumping to the component''s actionPerformed method. In the
    actionPerformed method, you add Java code, such as button.setText("you clicked
    me!"). A tool like WindowBuilder makes the design of GUI interfaces quicker, more
    natural, and more intuitive.'
