  md: '# 14 Part I: Getting Started with Java


    Come morning, hardly remember the conversation with the reporter. In fact, I don''t
    remember how I answered the question. Did I tell the reporter where he could put
    his article about Java?


    I put on my robe and rush to the front of my house''s driveway. As I pick up the
    morning paper, I glance at the front page and see the two-inch headline:


    Burd Calls Java "A Great Object-Oriented Language"


    # Object-oriented languages


    Java is object-oriented. What does that mean? Unlike languages, such as FORTRAN,
    that focus on giving the computer imperative "Do this/that" commands, object-oriented
    languages focus on data. Of course, object-oriented programs still tell the computer
    what to do. They start, however, by organizing the data, and the commands come
    later.


    Object-oriented languages are better than "Do this/that" because they organize
    data in a way that helps people do all kinds of things with it. To modify the
    data, you can build on what you already have rather than scrap everything you''ve
    done and start over each time you need to do something new. Although computer
    programmers are generally smart people, they took a while to figure this out.
    For the full history lesson, the sidebar "The winding road from FORTRAN to Java"
    (but I won''t make you feel guilty if you don''t read it).


    # Objects and their classes


    In an object-oriented language, you use objects and classes to organize your data.


    Imagine that you''re writing a computer program to keep track of the houses in
    a condominium development (still under construction). The houses differ only slightly
    from one another. Each house has a distinctive siding color, indoor paint color,
    a kitchen cabinet style, and so on. In your object-oriented computer program,
    each house is an object.


    But objects aren''t the whole story. Although the houses differ slightly from
    another, all the houses share the same list of characteristics. For instance,
    each house has a characteristic known as siding color. Each house has another
    characteristic known as kitchen cabinet style. In your object-oriented program,
    you need a master list containing all the characteristics that a house object
    possess. This master list of characteristics is called a class.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# Chapter 1: All Java


    # The winding road from FORTRAN to Java


    In the mid-1950s, a team of people created a programming language named FORTRAN.
    It was a good language, but it was based on the idea that you should direct, imperative
    commands to the computer. "Do this, computer. Then do that." (Of course, the commands
    in a real FORTRAN program were much more precise than "This does" or "Do that.")


    In the years that followed, teams developed many new languages, and many of the
    languages copied the "This/Do that" model. One of the most popular "This/Do that"
    languages went the one-letter name C. Of course, the "This/Do that" camp had renamed.
    Languages named SIMULA and Smalltalk, moved the imperative "Do this" into the
    backend and concentrated on data descriptions. In these languages, you couldn''t
    right out and say, "Print a list of delinquent accounts." Instead, you began by
    saying, "This is what it means to make an account. An account has a name and a
    balance. "This is how you ask an account when it''s delinquent," the database
    came in. An account was a thing that had a name, a balance, and a way of telling
    you about delinqu.


    Languages that focus first on the data are object-oriented programming languages.
    These object-oriented languages make easier programming possible. Here''s why:


    +   - Thinking first about the data makes you a good programmer.


    +   - You can extract and reuse the descriptions of data over and again. When
    you want to try old FORTRAN programs new tricks, the old programs show how brittle
    they are. They break.


    In the 1970s, object-oriented languages, such as SIMULA and Smalltalk, were buried
    in the computer hobbyist magazine articles. In the meantime, languages based on
    the old FORTRAN model were multiplying like


    So in 1986, a famous named Bjarne Stroustrup created a language named C++. The
    C++ became very popular because it mixed the old C terminology with the improved
    object-oriented structure. Many companies turned their backs on the FORTRAN/C
    style and adopted C++ as their standard.


    But C++ had a flaw. C++ could bypass all the object-oriented features and write
    a program using the old FORTRAN/C programming style. When you wrote a C++ accounting
    program, you could write either


    +   - You could start issuing "Do this" commands to the computer, saying the mathematical
    equivalent of "Print a list of delinquent accounts, and make it snappy."


    +   - You could take the object-oriented approach and begin by describing what
    is to be an account.


    Some people said that C++ offered the best of both worlds, but others argued the
    first (the world of FORTRAN and C) shouldn''t be part of modern programming. If
    you gave a programmer opportunity to write either way, the programmer would often
    choose to write the code their way.


    In 1995, James Gosling of Micro Systems created the language named Java. In Java,
    Gosling borrowed the look and feel of C++. But Gosling removed most of the old
    "Do that" and threw them in the trash. He then added features that made the development
    of objects smoother and easier. All in all, Gosling created a language whose object-oriented
    philosophy is pure and clean. When you program in Java, you have no choice but
    to work with objects. That''s the way it should be.


    ![](img/be49a553c8cd52419c36f97f5ee90278_28_0.png)'
  merge: -1
  img_proc: true
