- pgno: 351
  md: "# 338 Part IV: Savvy Java Techniques\n\nIf you trace the flow of method in\
    \ Listing 14-1 through 14-3, you may notice something peculiar. The paint method\
    \ in Listing 14-3 never seems to be called. Well, for many of Java's window-making\
    \ components, you just declare a paint method and let the method sit quite quietly\
    \ in the code. When the program runs, the computer calls the paint method automatically.\n\
    \nThat's what happens with javax.swing.JFrame objects. In Listing 14-3, the frame's\
    \ paint method is called from the scenes. Then, the frame's paint method calls\
    \ the Drawing object's paint method, which in turn, draws an oval on the frame.\
    \ That's how you get the stuff you see in Figure 14-4.\n\n# Sneaking Away from\
    \ the Original Code\n\nYour preferred software vendor, Burd Brain Consulting,\
    \ has you two files —Drawing.class and ArtFrame.class. As a customer, you can't\
    \ see the code inside the files Drawing.java and ArtFrame.java. So, you have to\
    \ live with whatever happens to be inside these two files. (If you'd purchased\
    \ a copy of Java For Dummies, 6th Edition, which has the code for these files\
    \ in Listings 14-2 and 14-3) Anyway, you want to tweak the way the oval looks\
    \ in Figure 14-4 so it's a bit wider. To do this, you create a subclass of the\
    \ Drawing class DrawingWide —and put it in Listing 14-4.\n\n# Listing 14-4: A\
    \ Subclass of the Drawing Class\n\n```\nimport java.awt.Graphics;\nimport com.burdbrain.drawings.Drawing;\n\
    \npublic class DrawingWide extends Drawing {\n    int width = 100, height = 30;\n\
    \n    public void paint(Graphics g) {\n        g.drawOval(x, y, width, height);\n\
    \    }\n}\n```\n\nTo use of the code in Listing 14-4, you remember to change one\
    \ of the lines in Listing 14-1. You change the line to\n\n```\nArtFrame artFrame\
    \ = new ArtFrame(new DrawingWide());\n```\n\nIn Listing 14-1 you can also remove\
    \ the com.burdbrain.drawings. Drawing import declaration because you no longer\
    \ need it."
  merge: -1
  img_proc: true
