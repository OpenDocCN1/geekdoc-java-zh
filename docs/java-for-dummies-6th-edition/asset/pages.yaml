  md: '# Chapter 1: All about Java


    # Why You Should Use Java


    It''s time to celebrate! You''ve just picked up a copy of Java For Dummies, 6th
    Edition, and you''re reading Chapter 1. At this rate, you''ll be an expert Java
    programmer in no time at all, so rejoice in your eventual success by throwing
    a big party.


    To prepare for the party, I''ll bake a cake. I''m lazy, so I''ll use a ready-to-bake
    cake mix. Let me see . . add water to the mix and then add butter and eggs ...
    Hey, wait! I just looked at the list of ingredients. What''s MSG? And what about
    propylene glycol? That''s used in antifreeze, isn''t it?


    I''ll change plans and make the cake from scratch. Sure, it''s a little harder,
    but that way I get exactly what I want.


    Computer programs work the same way. You can use someone''s program or write your
    own. If you use somebody else''s program, you can use whatever you get. When you
    write your own program, you can tailor the program especially for your needs.


    Writing code is a big, worldwide industry. Companies do it, freelance professionals
    do it, hobbyists do it — all kinds of people do it. A typical company has teams,
    departments, and divisions that write programs for company. You can write programs
    for yourself or someone else, for a living or fun. In a recent estimate, the number
    of lines of code written each day by programmers in the United States exceeds
    the number of methane molecules on the planet Jupiter Take almost anything that
    can be done with a computer. With the right amount of time, you can write your
    own program to do it. (Of course, the "right amount of time" may be long, but
    not that long. Many interesting and useful programs can be written in hours or
    minutes.)


    # Getting Perspective: Where Java Fits In


    Here''s a brief history of modern computer programming:


    +   1954–1957: FORTRAN is developed.


    FORTRAN was the first modern programming language. For scientific programming,
    FORTRAN is a real racehorse. After year, FORTRAN is a leading language among computer
    programmers throughout the world.


    > *I made up this fact by myself.'
