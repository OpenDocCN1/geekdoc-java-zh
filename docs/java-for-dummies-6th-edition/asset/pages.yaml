  md: '# Chapter 14: Sharing Names among the Parts of a Java Program


    For more information on public and nonpublic classes, see the section entitled
    "Access Modifiers for Java Classes," later in this chapter.


    The code has a paint method. This paint method uses a standard Java trick for
    making things appear onscreen. The parameter g in Listing 14-2 is calling a graphics
    buffer. To make things appear, all you do is draw on this buffer, and the buffer
    is eventually rendered on the computer screen.


    Here''s a little more detail: In Listing 14-2, the paint method takes a g parameter.
    This g parameter refers to an instance of the java.awt.Graphics class. Because
    a Graphics instance is a buffer, the things that you put into this buffer are
    eventually displayed on the screen. Like all instances of the java.awt.Graphics
    class, this buffer has several drawing methods—one of them drawOval. When you
    call drawOval, you specify a starting position (x pixels from the left edge of
    the frame and y pixels from the top of the frame). You also specify an oval by
    putting numbers of pixels in the width and height parameters. Calling the drawOval
    method puts a little round thing into the Graphics buffer. That Graphics buffer,
    round thing and all, is onscreen.


    # Directory structure


    The code in Listing 14-2 belongs to the com.burbrain.drawings package. When you
    put a class into a package, you have to create a directory structure that mirrors
    the name of the package.


    To house code''s in the com.burbrain.drawings package, you have to three directories:
    a com directory, a subdirectory of com named burbrain, and a subdirectory of burbrain
    named drawings. The overall directory structure is shown in Figure 14-5.


    If you don''t have the code in the appropriate directories, you get a repulsive
    NoClassDefFoundError. This error is never fun to get. When you see this error,
    you don''t have any clues to help you figure out where the missing class is or
    where the compiler expects to find it. If you stay calm, you can figure out all
    this stuff on your own. If you panic, you''ll be poking around for hours. As a
    seasoned Java programmer, I can remember plenty of scraped knuckles that came
    from that heinous NoClassDefFoundError.


    ![](img/be49a553c8cd52419c36f97f5ee90278_348_0.png)


    ![](img/be49a553c8cd52419c36f97f5ee90278_348_1.png)'
