  md: "# 302 Part IV: Savvy Java Techniques\n\nThe whole thing is done with the aid\
    \ of several Java keywords. These keywords are as follows:\n\n+   - throw: Creates\
    \ a new exception object.\n- throws: Passes the buck from a method up to whatever\
    \ code called the method.\n- try: Encloses code that has the potential to create\
    \ a new exception object. In the usual scenario, the code inside a try clause\
    \ contains calls to methods whose code can create one or more exceptions.\n- catch:\
    \ Deals with the exception, buries it, and then moves on.\n\nThe truth is out.\
    \ Through some chain of events like the one in Figure 13-2, the method Integer.parseInt\
    \ can throw a NumberFormatException. When you call Integer.parseInt, this NumberFormat\
    \ Exception is passed on to you.\n\nThe Java API (Application Programming Interface)\
    \ documentation for the parseInt method says, \"Throws: NumberFormatException\
    \ — if the string does not contain a parsable integer.\" Once in a while, reading\
    \ the documentation actually pays.\n\n![](img/be49a553c8cd52419c36f97f5ee90278_315_0.png)\n\
    \n```\nvoid method1() {\n    try {\n        method2();\n    } catch (Exception\
    \ e) {\n    }\n}\n```\n\n```\nvoid method2() throws Exception {\n    method3();\n\
    }\n```\n\n```\nvoid method1() throws Exception {\n    method4();\n}\n```\n\n```\n\
    void method4() throws Exception {\n    throw new Exception();\n}\n```\n\nIf you\
    \ call yourself a hero, you'd better catch the exception so that all the other\
    \ code can get on its regular business. Listing 13-2 shows the catching of an\
    \ exception."
