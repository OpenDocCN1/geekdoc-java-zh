  md: '# 346 Part IV: Savvy Java Techniques


    available in two (somewhat unrelated) places. Look again at Figure 14-9. A protected
    member is available to subclasses outside the package, but the member is also
    available to code (subclasses or not) within the member''s package.


    Listing 14-10 has a main method, which is inside a class, which is in turn inside
    the com.burdbrain.drawings package. With Integrated Development Environments (IDEs),
    you don''t think twice about running a main method that''s in a named package.
    If you run programs from the command line, you may need to type a fully qualified
    class name. For example, to run the code in Listing 14-10, you type java com.burdbrain.drawings.ShowWideBB.


    The real story about protected access is one more complicated than the story I
    describe in this section. The Java Language Specification mentions a hair-splitting
    point about code being responsible for an object''s implementation. When you''re
    figuring out how to program in Java, don''t worry about this point. Then, wait
    until you''ve written many Java programs. When stumble upon a variable has protected
    access error message, you can start worrying. Better yet, skip the worrying and
    take a careful look at the protected access specification in the Java Language
    Specification.


    ![](img/be49a553c8cd52419c36f97f5ee90278_359_0.png)


    For info about the Java Language Specification, visit Chapter 3.


    # Access Modifiers for Java Classes


    Maybe the things you read about access modifiers for members make you tad dizzy.
    After all, member access in Java is a very complicated subject with lots of twists
    and cliffhangers. Well, the dizziness is over. Compared with the saga for fields
    and methods, the access story for classes is rather simple.


    A class can be either public or nonpublic. If you see something like


    ```

    public class Drawing

    ```


    you''re looking at the declaration of a public class. But, if you see plain old


    ```

    class ShowFrame

    ```


    the class that''s being declared isn''t public.'
