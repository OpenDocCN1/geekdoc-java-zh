  md: '# Chapter 17: Using Java Database Connectivity 381


    # Connecting and disconnecting


    Aside from the calls to the executeUpdate method, the code in Listing 17-1 is
    cut-and-paste stuff. Here''s a rundown on what each part of the code means:


    +   - Class.forName: Find a database driver.


    +   To talk to a database, you need an intermediary piece of software, or a database
    driver. Drivers come in all shapes and sizes, and many of them are expensive.
    But Listing 17-1 uses a small, freebie driver — the Derby JDBC Embedded driver
    is kept in the EmbeddedDriver class (which is a Java class). This class lives
    inside the org.apache.derby.jdbc package.


    +   To use this `\EmbeddedDriver` class, you call the Class.forName method. Believe
    it or not, the Java API has a class named Class. The Class class contains information
    about classes that are available to the Java Virtual Machine (JVM). In Listing
    17-1, the call to Class.forName looks for the org.apache.derby.jdbc.EmbeddedDriver
    class. After that is loaded, you can connect to a database.


    +   - DriverManager.getConnection: Establish a session with a particular database.


    The getConnection method lives in a Java class named DriverManager. In Listing
    17-1, the call to getConnection creates an AccountDatabase and opens a connection
    to it. Of course, you may already have an AccountDatabase before you start running
    the code in Listing 17-1. If you do, the `create=true` string in the getConnection
    has no effect.


    In the parameter for getConnection (refer to Listing 17-1), notice the colons:
    the code doesn''t simply name the AccountDatabase, it tells the DriverManager
    class which protocols to use to connect with the database. The code `jdbc:derby:`
    — which is the same as the `http:` in a web address — tells the computer to use
    the jdbc protocol to talk to the derby protocol, which turn talks directly to
    your AccountDatabase.


    +   - connection.createStatement: Make a statement.


    It seems strange, but in Java Connectivity, you create a single statement object.
    After you''ve created a statement object, you can use that many times with different
    SQL strings, to issue many different commands to the database. So, before you
    calling the statement.executeUpdate method, you have to create an actual statement
    object. The call to connection.createStatement creates that statement object for
    you.


    +   - try...catch: Acknowledge exceptions that can be thrown in the code.


    If you read Chapter 13, you know that some method throw exceptions. A checked
    exception is one that has to be acknowledged somewhere in the calling code. A
    call to Class.forName can throw'
