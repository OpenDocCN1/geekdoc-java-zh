    # Good programming


    When it comes to computer programming, one word stands out all others — simplicity.
    When you''re writing complicated code, the last thing you want is to deal with
    somebody else''s misnamed variables, convoluted solutions to problems, or late-minute
    kludges. A clean interface that makes your own problems and no one''s else.


    In the automatic teller machine scenario I described earlier, the big problem
    is that the machine''s design forces you to worry about other people''s concerns.
    When you should be thinking about getting money for lunch, you''re thinking about
    variables and storage locations. Someone has to work out the teller machine''s
    engineering problems, but the banking customer isn''t the person.


    ![](img/be49a553c8cd52419c36f97f5ee90278_173_0.png)


    This section is about safety, not security. Safe code keeps you from making accidental
    programming errors. Secure code (a completely different story) keeps malicious
    hackers from doing intentional damage.


    So, everything connected with every aspect of a computer program has to be simple,
    right? Well, no. That''s not right. Sometimes, to make things simple in the long
    run, you have to do lots of preparatory work up front. The people who built the
    automatic teller machine worked hard to make sure that the machine is consumer-proof.
    The machine''s interface, with its screen messages and buttons, makes a very complicated,
    carefully designed.


    The point is that making things simple takes some taking. In the case of object-oriented
    programming, one of the ways to make things simple is to prevent code outside
    a class from directly using fields inside the class. You take a peek at the code
    in Listing 7-1. You''re working at a company that has just spent $10 million for
    the code in the Account class. (That''s more than a million and a half per line!)
    Now your job is to write the UseAccount class.


    ```

    myAccount.name = "Barry Burd";

    ```


    but doing so would be getting you too far inside the guts of the Account class.
    After all, people who use an automatic teller machine aren''t allowed to program
    the machine''s variables. They can''t use the machine''s keypad to type the statement'
