  md: '# 356 Part IV: Savvy Java Techniques


    The this keyword works the same way. It sits inside the code that defines the
    GameFrame class. Whenever an instance of GameFrame is constructed, the instance
    calls addActionListener(this). In that call, the keyword stands for instance itself.


    ```

    button.addActionListener(thisGameFrameInstance);

    ```


    By calling button.addActionListener(this), the GameFrame instance is saying, "Add
    my actionPerformed method to the list of methods that are called whenever the
    button is clicked." And indeed, the GameFrame instance has to have an actionPerformed
    method because the GameFrame class implements the ActionListener interface. It
    is funny how all fits together.


    # Inside the actionPerformed method


    The actionPerformed method in Listing 15-1 uses a bunch of tricks from the Java
    API. Here''s a brief list of these tricks:


    +   Every instance of JTextField(and of JLabel) has its own getter and setter
    methods, calling getText and setText whatever string of characters is in the component.
    Calling setText changes the characters that are in the component. In Listing 15-1,
    judicious use of getText and setText pulls a number out of the text field and
    replaces the number with neither (the empty string " ") followed by the word Yes!


    +   Every component in the java.swing package (JField, JButton, or whatever) has
    a setEnabled method. When you call setEnabled(false), the component will limp,
    washed-out look and can no longer receive clicks or keystrokes.


