    You can look up String and JFrame in Java''s API documentation. But even before
    you go, I can tell you what you''ll find. You''ll find that String and JFrame
    are the names of Java classes. So that''s the big news. Every class is the name
    of a reference type. You can reserve amountInAccount for double values by writing


    ```

