  md: '# Chapter 4: Making the Most of Variables and Their Values 79


    # Primitive type stew


    While I''m on the subject of frames, what a frame anyway? A frame is a window
    that has a certain height and width a certain location on your computer''s screen.
    Therefore, deep inside the declaration of the Frame class, you can find variable
    declarations that look something like:


    ```

    int width;

    int height;

    int x;

    int y;

    ```


    Here''s another example — An instance of the Time class may have an hour (from
    1 to 12), a minutes (from 0 to 59), and a letter (a for a.m.; p for p.m.).


    ```

    int hour;

    int minutes;

    char amOr;

    ```


    Notice that this high and mighty thing called a Java API class is neither high
    nor mighty. A class is a collection of declarations. Some of these declarations
    are the declarations of variables. Some of variable declarations use primitive
    types, and other variable declarations use reference types. These reference types,
    however, from other classes, and the declarations of those classes have variables.
    The chain goes on and on. Ultimately, everything comes, in one way or another,
    from the primitive types.


