    ```


    To review the notion of a Java class, see the sections on object-oriented programming
    (OOP) in Chapter 1.


    Every Java class is a reference type. If you declare a variable to have some that''s
    not a primitive type, the variable''s type is (most of the) the name of a Java
    class.


    Now, when you declare a variable to have type int, you can visualize that declaration
    means in a fairly straightforward way. It means, some-where inside the computer''s
    memory, a storage location is reserved for that variable''s value. In the storage
    location is a bunch of bits. The arrangement of the bits ensures that certain
    whole number is represented.


    That explanation is fine for primitive types like int or double, but what does
    it mean when you declare a variable to have a reference type? What does it mean
