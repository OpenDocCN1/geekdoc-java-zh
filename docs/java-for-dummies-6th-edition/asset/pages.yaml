  md: '# Chapter 15: Responding to Keystrokes and Mouse Clicks


    +   EventListener: A class that implements the ItemListener interface must have
    an itemStateChanged method. When you select an item in a combo box, the event-handling
    thread calls itemStateChanged.


    In 15-3, when the user selects US to UK or UK to US in the combo box, the event-handling
    thread calls the itemStateChanged method. In turn, the itemStateChanged method
    calls setTextOnLabel, and so on.


    +   CompleteListener: A class that implements the MouseListener interface has
    mouseEntered, mouseClicked, mousePressed, and mouseReleased methods. Implementing
    MouseListener is different from implementing MouseListener. When you implement
    ActionListener, as in 15-1, the event-handling thread responds only to mouse clicks.
    With MouseListener, the thread responds to the user pressing the mouse, and releasing
    the mouse.


    In 15-3, the mouseEntered and mouseExited methods are called whenever you move
    over or away from the label. How do you know that the label is involved? Just
    look at the code in the MoneyFrame constructor. The label variable''s addMouseListener
    method is the one that''s called.


    Look at the mouseEntered and mouseExited methods in Listing 15-3. When mouseEntered
    or mouseExited is called, the computer forces ahead and calls setForeground. This
    setForeground method changes the color of the label''s text.


    Isn''t life wonderful? The Java API has a Color class with names like Color.red
    and Color.black.


    Listing 15-3 has several methods that aren''t really used. For instance, when
    you implement MouseListener, your code has to have its own mouseReleased method.
    You need the mouseReleased method not because you''re going to do anything special
    when the user releases the mouse button, but because you made a promise to the
    Java compiler and have to keep that.


