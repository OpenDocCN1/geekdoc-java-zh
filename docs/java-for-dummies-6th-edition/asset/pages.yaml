    # Sending Values to and from Methods (Calculating Interest)


    Think about sending someone to the supermarket to buy bread. When you do this,
    you say, "Go to the supermarket and buy some bread." (Try it at home. You''ll
    have a fresh load of bread in no time at all!) Of course, some other time, you
    send someone to the supermarket to buy bananas. You say, "Go to the supermarket
    and buy some bananas." And what''s the point of all this? Well, you have a method,
    and you have some on-the-fly information that you pass to the method when you
    call it. The method is named goToTheSupermarketAndBuySome. The on-the-fly information
    is either bread or bananas, depending on your culinary needs. In Java, the method
    calls could look like this:


    ```

    goToTheSupermarketAndBuySome(bread);

    gotoTheSupermarketAndBuySome(bananas);

    ```


    The things in parentheses are called parameters or parameter lists. With parameters,
    the same thing becomes much more versatile. Instead of getting the same thing
    each time, you can send somebody to the supermarket'
