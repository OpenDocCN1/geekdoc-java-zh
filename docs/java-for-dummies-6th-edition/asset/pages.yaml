  md: '# Part IV: Savvy Java Techniques


    If you compare the formatting statements in Listings 10-1 and 11-5, you dont see
    much difference.


    +   One listing using a constructor: the other listing calls getCurrencyInstance
    method is a good example of what a factory method does. A factory method is a
    convenient tool for creating commonly used objects. People always need code that
    displays dollar amounts. The getCurrencyrencyInstance method creates a dollar
    format without forcing you to write new DecimalFormat("####,#.00; ($####.00)").


    Like a constructor, a factory method returns a new-bound object. Unlike a constructor,
    a factory method has no special status. When you create a factory method, you
    can name anything you want. When you call a factory method, you dont use the keyword
    want.


    +   One listing uses DecimalFormat; the other uses NumberFormat. A decimal number
    is a kind of number. (In fact, a decimal number is a number in the base-10 system).
    Accordingly, the DecimalFormat class is a subclass of the NumberFormat class.
    The DecimalFormat methods are more specific, for most purposes, I use DecimalFormat.
    But it''s harder to use the DecimalFormat class''s getCurrencyInstance method.
    So for programs that involve money, I tend to use NumberFormat.


    +   Both listings use format methods. In the end, you just write something like
    currency.format(rate) or decFormat.format(average). After that, Java does the
    work for you.


    ![](img/be49a553c8cd52419c36f97f5ee90278_277_0.png)


    From Chapter 4 onward, I issue general warnings against using types as double
    and float for storing currency values. For the most accurate currency calculations,
    use int, long, or best of all, BigDecimal.


    You can read more about the dangers of double types, float types, and currency
    values in Chapter 5.


