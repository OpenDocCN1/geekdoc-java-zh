    follow-up question is: “Where does the event-handling thread find actionPerformed
    methods to call?” And there’s another question: “What if you don’t want the event-handling
    thread to call certain actionPerformed methods that are lurking in your code?”


    Well, that’s why you call the addActionListener method. In Listing 15-1, the call


    ```

    button.addActionListener(this);

    ```


    tells the event-handling thread, “Put this code’s actionPerformed method on your
    list of methods to be called. Call this code’s actionPerformed method whenever
    the button is clicked.”


    So, how to work. The Java’s event-handling thread. You do this registration by
    calling addActionListener. The addActionListener method belongs to the object
    whose clicks (and other events) you’re waiting for. In Listing 15-1, you’re waiting
    for the button object to be clicked, and the addActionListener method belongs
    to button object.


    # The keyword this


    In Chapters 9 and 10, the keyword gives you access to instance variables from
    the code inside a method. So, what does the keyword really mean? Compare it with
    the English phrase “state your name.”


    > I, (state your name), do solemnly swear, to uphold the constitution of the Philadelphia
    Central High School Photography Society.\ . . .


    The phrase “state your name” is a placeholder. A space in which each person puts
    his or her own name.


    > I, Bob, do solemnly swear. . . .

    I, Fred, do solemnly swear. . . .


    Think of the pledge “I… do solemnly swear…” as a piece of code in a Java class.
    In that piece of code is the placeholder phrase, “state your name.” Whenever an
    instance of the class (a person) executes the code (that is, takes the pledge),
    the instance fills in its own name in place of the phrase “state your name.”'
