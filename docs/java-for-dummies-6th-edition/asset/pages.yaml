  md: '# Chapter 5-4: Controlling Program Flow with Decision-Making Statements


    In Listing 5-4, the comparisons username != null and password != null are not
    optional. If you forget to include these and cancel when the program runs, you
    get a NullPointerException message, and the program crashes before your eyes.
    The word null reports nothing, and in Java, you can''t compare nothing to a string
    like "bburd" or "swordfish". In, the purpose of the comparison username != null
    is to prevent Java from moving on to check username.equals("bburd") whenever you
    happen to cancel. Without this preliminary username != null test, you''re courting
    trouble.


    The last couple of nulls in Listing 5-4 are different from the others. In the
    code JOptionPane.showMessage(dialog, "You''re in."), the word null stands for
    "no other dialog box". In particular, the showMessageDialog tells Java to pop
    up a new dialog box, and the null indicates that the new dialog box doesn''t grow
    out of any existing dialog box. One or another, Java insists that you say something
    about the origin of the newly popped dialog box. (For some reason, Java doesn''t
    insist you specify the origin of the showInputDialogDialog. Go figure!) Anyway,
    in Listing 5-4, having a showMessageDialog pop up from nowhere is quite ideal.


    # (Conditions in parentheses)


    Keep an eye on those parentheses! When you''re combining conditions with logical
    operators, it''s better to waste typing effort and add unnecessary parentheses
    than using too few parentheses. Take, for example, the expression


    ```

    2 < 5 || 100 < 6 && 27 < 1

    ```


    By misreading this expression, you might conclude that the expression is false.
    That is, you could easily read the expression as meaning (something-or-other)
    && 27 < 1. Because 27 < 1 is false, you would conclude that the whole expression
    is false. The fact is that, in Java, any && operator is evaluated before || operator.
    So the expression asks if 2 < 5 || (something-or-other). Because 2 < 5 is true,
    the whole expression is true.


    To change the expression''s value from true to false, you can put the expression''s
    first two comparisons in parentheses, like this:


    ```

    (2 < 5 || 100 < 6) && 27 < 1

    ```'
