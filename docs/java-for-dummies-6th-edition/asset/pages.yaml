  md: '# Chapter 14: Sharing Names among the Parts of a Java Program


    The code doesn''t compile, because a field that has default access can''t be directly
    referenced outside its package — not even by a subclass of the class containing
    the field. The same holds true for any methods that have default access.


    A class''s fields and methods are called members of the class. The rules for access
    — default and otherwise — apply to all members of classes.


    The rules I describe in this chapter don''t apply to method-local variables. A
    method-local variable can be accessed only within its own method.


    ![](img/be49a553c8cd52419c36f97f5ee90278_354_0.png)


    For the rundown on method-local variables, see Chapter 10.


    In Java, the default access for a member of a class is package-wide access. A
    member declared without the word public, private, or protected in front of it
    is accessible in the package in which its class resides. Figures 14-7 and 14-8
    illustrate the point.


    ![](img/be49a553c8cd52419c36f97f5ee90278_354_1.png)


    The names of packages, with all their dots and subparts, can be slightly misleading.
    For instance, when you write a program that responds to button clicks, you normally
    import classes from two separate packages. On one line, you may have import java.awt.*;.
    On another line, you may have import java.awt.event.*;. Importing all classes
    from the java.awt.event package doesn''t automatically import classes from its
    own


    | class1 | classA | classX | Legend: |

    | --- | --- | --- | --- |

    | | | | A package |

    | class2 extends class1 | classB extends classA | classY extends classX | Another
    package |

    | class3 extends class2 | classC extends classB | classZ extends classY | Yet
    another package |


    Figure 14-7: Packages across subclass hierarchies.'
