  md: '# 124 Part II: Writing Your Own Java Programs


    When you look at Listing 6-1, you see the code that does all this work. At the
    core of the code is a thing called a *while* statement (also known as a *while
    loop*). Rephrased in English, the while statement says:


    ```

    while the inputNumber is not equal to the randomNumber

    keep doing all the stuff in curly braces: {


    }

    ```


    The stuff in curly braces (the stuff that repeats) is the code that prints *Try
    again* and *Enter int...*, gets a value from the keyboard, and adds 1 to the count
    of the user''s guesses.


    When you''re dealing with counters, like `numGuesses` in Listing 6-1, you may
    easily become confused and be off by 1 in either direction. You can avoid this
    headache by making sure that the ++ statements stay close to the statements whose
    events you are counting. For example, in Listing 6-1, the variable `numGuesses`
    starts with a value of 0. That''s, when the program starts, the user hasn''t made
    any guesses. Later in the program, right after each call to `keyboard.nextInt()`,
    is a `numGuesses++` statement. That''s how you do — increment the counter as the
    user enters another guess.


    The statements in curly braces are repeated as long as `inputNumber != randomNumber`
    is true. Each repetition of the statements in the loop is an iteration of loop.
    In Loop 6-1, the loop undergoes three iterations. (If you don''t believe that
    Figure 6-1 has exactly three iterations, the count of *Try again* prints in the
    program''s output A appears for each incorrect guess.)


    When, at last, the user enters the correct guess, the computer goes back to the
    top of the while statement, checks the condition in parentheses, and finds itself
    in double double-negative. The not (!=) between `inputNumber` and `randomNumber`
    no longer holds. In other words, the while statement says, `inputNumber != randomNumber`
    is false. Because the while statement is false, the computer jumps past the while
    loop and goes to the statements below the while loop. In two statements, the computer
    prints you after 4 guesses.


    With code of the kind shown in Listing 6-1, the computer never jumps out of mid-loop.
    When the computer finds that `inputNumber` isn''t equal to `randomNumber`, the
    computer marches on and executes all five statements inside the loop''s curly
    braces. The computer performs again (to see whether `inputNumber` is still not
    equal to `randomNumber`) only after it executes all five statements in the loop.


    ![](img/be49a553c8cd52419c36f97f5ee90278_137_0.png)


    ![](img/be49a553c8cd52419c36f97f5ee90278_137_1.png)'
