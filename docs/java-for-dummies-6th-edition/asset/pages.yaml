  md: '# Chapter 5: Controlling Program Flow with Decision-Making Statements


    # Building a Nest


    Have you seen those Russian Matryoshka nesting dolls? Open one, and another one
    is inside. Open the second, and a third is inside it. You can do the same thing
    with Java''s if statements. (Talk about fun!) Listing 5-5 shows you how.


    # Listing 5-5: Nested if Statements


    Figure 5-6 shows several runs of the code in Listing 5-5. The main idea is that
    to log on (In other words, conditions must be true). The first condition tests
    for a valid username; the second condition tests for the correct password. If
    you pass the first test (the username test), you march right into another if statement
    that performs a second test (the password test). If you fail the first test, you
    never make it to the second test. Figure 5-7 shows the overall plan.'
