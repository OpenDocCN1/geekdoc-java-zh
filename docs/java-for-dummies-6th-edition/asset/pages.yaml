    object has gray siding. The blueprint says, "kitchen cabinet." The actual

    object has Louis XIV kitchen cabinets.


    The analogy does not end with lists of characteristics. Another important parallel

    exists between blueprints and classes. A year you architect the blueprint,

    yuse it to build ten houses. It is the same with classes and objects. First, the

    programmer writes code to describe a class. Then when the program runs, the

    computer creates objects from the (blueprint) class.


    So that''s the real relationship between classes and objects. The programmer

    defines a class, and from the class definition, the computer makes objects.


    # What''s so good about an object-orientednlanguage?


    From the previous section''s story about home building, imagine that

    you''ve already written a computer program to keep track of the building

    instructions for houses in a new development. Then, the boss decides on

    a modified plan — a plan in which half the houses have three bedrooms and

    the other have four.


    If you use the FORTRAN/C style of computer programming, your instructions

    look like this:


    ```

    Dig a ditch for the basement.

    Lay concrete along the sides of the ditch.

    Put two-by-fours along the sides for the basement''s frame.

    ```


    This would be like an architect creating a long list of instructions instead

    a blueprint. To modify the plan, you have to sort through the list to find the

    instructions for building bedrooms. To make things worse, the instructions

    could be scattered among pages 234, 394–410, 739, 10, and 2. If the builder

    had to decipher other people'' complicated instructions, the task would be

    ten times harder.'
