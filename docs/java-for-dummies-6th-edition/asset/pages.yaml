    14-2 is in this package.

    - The com.burdbrain.frames package: The ArtFrame class from Listing 14-3 is in
    this package.

    - An ever-present, unnamed package: In Java, when you don''t start a file with
    a package declaration, all the code in that file goes into one big. Listings 14-1
    and 14-4 are in the same unnamed package. fact, most of the listings from the
    first 13 chapters of this book are in Java''s unnamed package.


    At this point, your project has two drawing classes — the original Drawing class
    and your new DrawingWide class. Similar as these classes may be, they live in
    two separate packages. That''s not surprising. The Drawing class, developed by
    your projects at Bird Brain Consulting, lives in a package whose name starts with
    com.burdbrain. But you developed DrawingWide in yours, so you shouldn''t put it
    in a com.burdbrain package.


    The most sensible thing to do is to put it in one of your packages, such as com.myhomomedomain.drawings;
    but putting your class in the unnamed package will do for none.


    One way or another, your DrawingWide subclass compiles and runs as planned. You
    go home, beaming with the confidence of having written useful, working code.


