  md: '# 248 Part IV: Savvy Java Techniques


    Each line serves its own distinct purpose:


    +   - int guests[]: This first line is a declaration. The declaration reserves
    the array name (a name like guests) for use in the rest of the program. In the
    Java metaphor, this line says, ''I plan to build a hotel and put a certain number
    of guests in each room.'' (See Figure 11-2).

    - Never mind what the declaration int guests[] actually does. It''s more important
    to notice what the declaration int guests[] doesn''t do. The declaration doesn''t
    reserve ten memory locations. Indeed, a declaration like int guests[] doesn''t
    create an array. All the declaration does is set up the guests variable. At that
    point in the code, the guests variable still refers to an array (In other words,
    the motel has a name, but the motel hasn''t been built yet).

    - guests = new int[10]: This second line is an assignment statement. The assignment
    statement reserves space in the computer''s memory for ten int values. In terms
    of real estate, this line says, ''I''ve finally built the motel. Go ahead and
    put guests in each room.'' (Again, see Figure 11-2):


    ![](img/be49a553c8cd52419c36f97f5ee90278_261_0.png)


    # Storing values


    After you''ve created an array, you can put values into the array''s components.
    For instance, you would like to store the fact that Room 6 contains 4 guests.
    To put the value 4 in the component with index 6, you write guests[6] = 4.


    Now business starts to pick up. A big bus pulls up to the motel. On the side of
