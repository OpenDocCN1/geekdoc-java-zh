    # Tossing an exception from method to method


    Chapter 8 introduces input from a disk file, and along with that topic comes the
    notion of an exception. When you tinker with a disk file, you need to acknowledge
    the possibility of raising IOException. That''s the lesson from Chapter 8, and
    that''s why the constructor in Listing 10-2 has a throws IOException clause.


    But about the main method in Listing 10-3? With no reference to disk files in
    this main method, why does the method need its own throws IOException? Well, an
    exception is a hot potato. If you have one, you either have to eat it (as you
    can see in Chapter 13) or use a throws clause to toss it to someone else. If you
    toss an exception with a throws clause, someone else is stuck with the exception
    just the way you were.


    The constructor in Listing 10-2 throws an IOException, but to whom is this exception
    thrown? Who in this chain of code becomes the bearer of responsibility for the
    problematic IOException? Well, who called the constructor in Listing 10-2? It
    was the main method in Listing 10-3—that calls the TeamFrame constructor. Because
    the TeamFrame constructor throws its hot potato to the main method in Listing
    10-3, the main method has to deal with it. As shown in Listing 10-3, the main
    method deals with it by tossing the IOException (by having a throws clause of
    its own). That''s how the throws clause works in Java programs.


    If a method calls another method and the called method has a throws clause, the
    calling method must contain code that deals with the exception. To find out more
    about dealing with exceptions, read Chapter 13.


    ![](img/be49a553c8cd52419c36f97f5ee90278_237_1.png)


    At this point in the book, astute For Dummies readers may follow-up question or
    two. "When a main method has a throws clause, someone else has to deal with the
    exception in that throws clause. But who called the main method? Who deals with
    the IOException in the throws clause of Listing 10-3? The answer is that the Java
    Virtual Machine (or, JVM, that runs all your Java code) makes the main method.
    If the JVM takes care of the Hankees.txt file, the responsibility ultimately falls
    on the JVM. The JVM takes care of things by displaying an error message and ending
    the run of your program. Convenient,!'
