- pgno: 404
  md: "# Chapter 18: Ten Ways to Avoid Mistakes\n\n```\nString dir[] = myFile.list();\n\
    for (String fileName : dir) {\n    out.println(fileName);\n}\n```\n\nThis program\
    \ displays a list of all the files in the windows directory. For clarification\
    \ on the use of the double backslash in \"\\\\windows\", see Chapter 8.0.\n\n\
    But what happens if you change \\windows to something else — something that doesn't\
    \ represent the name of a directory?\n\n```\nmyFile = new File(\"*&$!\");\n```\n\
    \nThen new File call returns null (a special word meaning nothing), so the variableFile\
    \ has nothing in it. Later in the code, the dir refers to nothing, and the attempt\
    \ to loop through all the dir values fails miserably. You get a big NullPointerException,\
    \ and the program crashes down you.\n\nTo avoid this kind of calamity, check Java's\
    \ API documentation. If you're calling a method that can return null, exception-handling\
    \ code to your program.\n\nFor the story on handling exceptions, see Chapter 13.\
    \ For some advice on reading the API documentation, see Chapter 3 and this book's\
    \ website (www.allmycode.com/JavaForDummies).\n\n# Helping Java Finds Its Files\n\
    \nYou're compiling Java code, mind your own business, when the computer gives\
    \ you a NoFileNotFoundError. All kinds of things can be going wrong, but chances\
    \ are good that the computer can't find a particular Java file. To fix this, you\
    \ must align all planets correctly:\n\n+   - Your project directory has to contain\
    \ all the Java files whose names are used in your code.\n\n+   - If you used packages,\
    \ your project directory has to have appropriately named subdirectories.\n\n+\
    \   - Your CLSPATH must be properly set.\n\nFor specific guidelines, see Chapter\
    \ 14 and this book's website (www.allmycode.com/JavaForDummies)."
