  md: '# 32 Part I: Getting Started with Java


    # Developing software


    > "All this has happened before, and it will happen again."

    -Peter Pan (J.M. Barrie) and Battlestar Galactic (2003–2009, NBC Universal)


    When you create a Java program, you repeat the same steps over and over again.
    Figure 2-2 illustrates the cycle.


    ![](img/be49a553c8cd52419c36f97f5ee90278_45_0.png)


    First, you write a program. After writing the first draft, you repeatedly compile,
    run, and modify the program. With a little experience, the compile and run steps
    become very easy. In many cases, one mouse click starts the compilation or the
    run.


    However, writing the first draft and modifying the code are not one-click tasks.
    Developing code requires time and concentration.


    Never be discouraged when the first draft of your code doesn''t work. For that
    matter, never be discouraged when the 25th draft of your code doesn''t work. Rewriting
    code is one of the most important things you can do (aside from ensuring world
    peace).


    For detailed instructions on compiling and running Java programs, visit this book''s
    website (www.alldummies.com/JavaForDummies).


    When people talk about writing programs, they use the wording in Figure 2-2. They
    say, “You compile the code” and “You run the code.” But the “you” isn''t always
    accurate, and the “code” differs slightly from one part of the cycle to the next.
    Figure 2-3 describes the cycle from Figure 2-2 in a bit more detail.'
