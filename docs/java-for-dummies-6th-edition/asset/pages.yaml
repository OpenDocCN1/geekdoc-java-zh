    # Reading a line at a time


    In 8-2, the payOneEmployee method illustrates some useful tricks for reading data.
    In particular, every scanner that you create has a nextLine method.(You might
    not use that nextLine method, but the method is available nonetheless.) When you
    call a scanner''s nextLine method, the method grabs everything up to the end of
    the current line of text. In Listing 8-2, a call to nextLine can read a whole
    line from the EmployeeInfo.txt file. In another program, a scanner''s nextLine
    can read whatever the user types on the keyboard up to the pressing of the Enter
    key.


    Notice my careful choice of words: nextLine reads everything up to the end of
    the current line. Unfortunately, what it means to read up to the end of the current
    line isn''t always what you think it means. Intermingling nextInt, nextDouble,
    and nextLine can be messy. You have to watch what you are doing and check your
    program''s output.


    To understand all, you need to be painfully aware of a data file''s line breaks.
    Think of a line break as an extra character, stuck between one of line and the
    text. Imagine that calling nextLine means to read every-thing up and including
    the line break.


    Now take a look at Figure 8-4.


    +   - If one call to nextLine reads Barry [LineBreak], the subsequent call to
    nextLine reads CEO [LineBreak].

    - If one call to nextDouble reads the number 5000.00, the subsequent call to nextLine
    reads the [LineBreak] that comes immediately after the number 5000.00.(That''s
    all the nextLine reads — [LineBreak] and nothing more).

    - If a call to nextLine reads the [LineBreak] after the number 5000.00, the subsequent
    call to nextLine reads Ritter [LineBreak].'
