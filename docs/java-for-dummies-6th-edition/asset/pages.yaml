    don''t worry. You''re reading Java For Dummies, 6th Edition, and like most humans
    beings, you can learn to read and write the code in Listing 2-1. The code in Listing
    2-1 is called Java source code.


    So here''s the catch: Computers aren''t human beings. Computers don''t follow
    instructions like the instructions in Listing 2-1. That is, computers don''t follow
    Java source code instructions. Instead, computers follow cyclic instructions like
    the ones in Listing 2-2


