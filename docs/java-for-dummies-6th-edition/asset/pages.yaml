  md: '# 244 Part IV: Savvy Java Techniques


    After the doBirth method is executed, that City instance is returned to the main
    method. Then, back in the main method, that instance (the one that doBirth returns)
    is assigned to the smackoverAR variable. (See Figure 10-14) Now smackoverAR refers
    to a brand-new City instance — an instance whose population is 2,233.


    ![](img/be49a553c8cd52419c36f97f5ee90278_257_0.png)


    In Listing 10-14, notice the type consistency in the calling and returning of
    the doBirth method:


    +   * The smackoverAR variable has type City. The smackoverAR variable is passed
    to the aCity parameter, which is also of type City.

    * The myCity variable is of type City. The myCity variable is sent back in the
    doBirth method''s return statement. That''s consistent, because the doBirth method''s
    header begins with static City doBirth(blah, blah, blah...) — a promise to return
    an object of type City.

    * The doBirth method returns an object of type City. Back in the main method,
    the object that the call to doBirth returns is assigned to the smackoverAR variable,
    and (you guessed it) the smackoverAR variable is of type City.


    Aside from being very harmonious, all this type agreement is absolutely necessary.
    If you write a program in which your types don''t agree with another, the compiler
    spits out an unsympathetic incompatible types message.


