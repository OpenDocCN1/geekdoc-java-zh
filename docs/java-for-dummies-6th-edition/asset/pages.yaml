    for (int i = 0; i < 100; i++) {

    name[i] = new String();

    }

    ```


    All is well until, one day, customer number 101 shows up. As your program runs,
    you enter data for customer 101, hoping desperately that the array with 100 components
    can expand to fit your growing needs.'
