  md: '# Introduction 3

    Foolish Assumptions


    In this book, I make a few assumptions about you, the reader. If one of these
    assumptions is incorrect, you''re probably okay. If all these assumptions are
    incorrect ... well, buy the book anyway.


    +   - I assume that you have access to a computer. Here''s the good news: you
    can run most of the code in this book on almost any computer. The only computers
    that you can''t use to run this are ancient things that are more than ten years
    old (give or a few years).

    - I assume that you can navigate through your computer''s menus and dialog boxes.
    You don''t have to be a Windows, Linux, or Macintosh power user, but you should
    be able to start a program, find a file, put it into a certain directory ... that
    sort of thing. Most of the time, when you practice the stuff in this book, you''re
    typing code on your keyboard, not pointing and clicking your mouse.

    On those rare occasions when you need to drag and drop, cut and paste, or plug
    or play. I guide you through the steps. But your computer may be configured in
    any of several billion ways, and my instructions may not quite your special situation.
    So, when you reach one of these platform-specific tasks, try following the steps
    in this book. If the steps don''t fit, consult a book with instructions tailored
    to your system.

    - I assume that you can think logically. That is all there is to programming in
    Java — thinking logically. If you can think logically, you''ve got it made. If
    you don''t believe that you can think logically, read on. You may be pleasantly
    surprised.

    - I make very few assumptions about computer programming experience (or your lack
    of experience). In writing this book, I tried to do the impossible. I tried to
    make the book interesting for experienced programmers, yet accessible to people
    with little or no programming background. This means that I don''t assume any
    particular programming background on your part. If you''ve never created a loop
    or an array, on the other hand, you done these things (maybe in Visual Basic,
    COBOL, or C++), you''ll discover some interesting plot twists in Java. The developers
    of Java took the best ideas in object-oriented programming, streamlined them,
    reworked them, and reorganized them into a sleek, powerful way of thinking about
    problems. You''ll find many new, thought-provoking features in Java. As you find
    out about these features, many of them will seem very natural to you. One way
    or another, you''ll feel good about using Java.'
