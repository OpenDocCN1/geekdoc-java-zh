  md: '# 54 Part I: Getting Started with Java


    The Java language has three kinds of comments:


    +   Traditional comments: The first five lines of Listing 3-6 form one traditional
    comment. The comment begins with /* and ends with /. Everything between the opening
    /* and the closing *// is for human eyes only. No information about "Java For
    Dummies, 6th Edition" or Wiley Publishing, Inc. is translated by the compiler.

    To read comments, see Chapter 2

    The second, third, fourth, and fifth lines in Listing 3-6 have extra asterisks
    (*). I call them extra asterisks are required when you create a comment. They
    just make the comment look pretty. I include them in Listing 3-6, for some reason
    that I don''t understand, most Java programmers add these extra asterisks.


    +   End-line comments: The text //IT in Listing 3-6 is an end-of-line comment.
    An end-of-line comment starts with two slashes and goes to the end of a line of
    type. Once again, the compiler doesn''t translate the end inside the end-line
    comment.


    +   Javadoc comments: A Javadoc comment begins with a slash and two asterisks
    (/**). Listing 3-6 has javadoc comments — one with the text The Descriptor class...
    and another with the text Main method is...


    A Javadoc comment is a special kind of comment. A Javadoc comment is meant to
    be read by people who never look at the Java Code. But that doesn''t make sense.
    How can you see the javadoc comments in Listing 3-6 if you never look at Listing
    3-6?


    Well, a program called javadoc (what else?) can find all the javadoc comments
    in Listing 3-6 and turn these comments into a nice-looking web page. Figure 3-8
    shows the page.


    Javadoc comments are great. Here are several things about them:


    +   The only person who looks at a piece of Java code is the programmer who writes
    the code. Other people who use the code can find out what the code does by viewing
    the automatically generated web page.


    +   Because other people don''t look at the Java code, other people don''t make
    changes to the Java code. (In other words, other people don''t introduce errors
    into the existing Java code).


    +   Because other people don''t look at the Java code, other people don''t have
    to decipher the inner workings of the Java code. All these people need to know
    about the code is what they read on the code''s web page.


    +   The programmer doesn''t create two separate things over here and some documentation
    about the code there. Instead, the programmer creates one piece of Java code and
    embeds the documentation (in the form of javadoc comments) right inside the code.


    ![](img/be49a553c8cd52419c36f97f5ee90278_67_0.png)'
