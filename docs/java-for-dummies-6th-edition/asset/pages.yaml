  md: '# 176 Part III: Working with the Big Picture: Object-Oriented Programming


    In general, when you get a FileNotFoundException, some file that your program
    isn''t available to it. This is an easy mistake to make. It can be frustrating
    because to you, a file such as EmployeeInfo.txt may look like it''s available
    to your program. But remember—computers are stupid. If you make a mistake, the
    computer can''t read between the lines for you. If your EmployeeInfo.txt file
    isn''t in the right directory on your hard drive or the filename is spelled incorrectly,
    the computer chokes when it tries to run your code.


    Sometimes you know well that an EmployeeInfo.txt (or whatever.xyz) file exists
    on your hard drive. But when you run your program, you will get a meaning-FileNotFoundException.
    When this happens, the file is usually in the wrong directory on your hard drive.
    (Of course, it depends on your point of view. Maybe the file is in the right directory,
    but you''ve told your Java program to look for it in the wrong directory.) When
    this happens, copying the file to some other directories on your hard drive and
    resuming your code. Carefully read and reread the names and locations of your
    hard drive until you figure out what''s wrong.


    On this book''s website (www.allcode.com/JavaForDummies), you can find tips on
    the proper location of the EmployeeInfo.txt file. Look for tips that apply to
    your operating system (Windows, Macintosh, or Linux) or to your IDE (Eclipse,
    NetBeans, or IntelliJ).


    ![](img/be49a553c8cd52419c36f97f5ee90278_189_0.png)


    # Adding directory names to your filenames


    You can specify a file''s location in your Java code. Code new File("C:\Users\bburd\workspace\Listing08-01-02\EmployeeInfo.txt")
    looks really ugly, but it works.


    In the previous paragraph, notice the double backslashes in "C: \Users\bburd\workspace...".
    If you''re a Windows user, you''d be tempted to use single backslashes. But in
    Java, the single backslash has its special meaning (For example, back in Listing
    7-\n means to go to the next line.) So in Java, to indicate a backslash inside
    a quoted string, you use a double backslash.


    Macintosh and Linux users find comfort in the fact that their separator /, has
    no special meaning in a Java string. On a Mac, the code new File("/Users/bburd/workspace/Listing08-01-02/EmployeeInfo.txt")
    is normal as breathing. (Well, it''s almost normal!) But Mac users and Linux won''t
    claim superiority too quickly. Likes as new File("/Users/bburd/workspace... work
    in Windows as.'
