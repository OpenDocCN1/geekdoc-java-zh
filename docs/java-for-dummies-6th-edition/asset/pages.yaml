  md: '# Chapter 17


    # Using Java Database Connectivity


    **In This Chapter**


    +   - Connecting to a database

    - Inserting values into a database

    - Making queries to a database


    Whenever I teach Java to professional programmers, I always hear the same old
    thing. "We don’t need to make any cute little characters fly across the screen.
    No blinking buttons for us. We need to access databases. Yup, just show how to
    write Java programs that talk to databases."


    So here it is, folks — Java Database Connectivity.


    # JDBC and Java DB


    When I first started with databases, my toughest problem was connecting to a database.
    I had written all the Java code. (Well, I copied all the Java code from some book.)
    The Java part was easy. The hard part was getting my code to find the database
    on the system.


    Part of the problem was that you get your code to talk to the data-depends on
    the kind of system you have and the kind of database that you''re running on your
    system. The books that I was using couldn''t be specific on all the details the
    details (nothing to do with Java) varied from one reader''s computer to another.
    And now I''m writing my own chapter about database connectivity. What''s answer
    to do?


    Fortunately, the Java Development Kit (JDK) comes with its own built-in database
    — Java DB. Based on the Apache Derby database, Java DB is secure, lightweight,
    and standards-based. Java DB runs seamlessly along with the rest of the Java JDK.
    The Java introduced Java DB with the release of Java 6.'
