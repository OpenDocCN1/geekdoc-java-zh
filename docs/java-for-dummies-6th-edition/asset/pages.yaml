  md: "# Chapter 14: Sharing Names among the Parts of a Java Program\n\nWhen you run\
    \ Listing 14-7 alongside the Drawing class in Listing 14-5, everything works fine.\
    \ The reason? It's because Drawing and DrawingWideBB are in the same package.\
    \ Look back at Figure 14-8 and notice the shaded region spans across an entire\
    \ package. The code in the DrawingWideBB class has every right to use the x and\
    \ y fields, which are defined with default access in the Drawing class because\
    \ Drawing and DrawingWideBB are in the same package.\n\n![](img/be49a553c8cd52419c36f97f5ee90278_356_0.png)\n\
    \nTo use the DrawingWideBB class in Listing 14-7, you make two changes in the\
    \ original Listing 14-1. Change the first import declaration\n\n```\nimport com.burdbrain.DrawingWideBB;\n\
    ```\n\nAlso, change the ArtFrame object's constructor call to new ArtFrame (new\
    \ DrawingWideBB()).\n\n# Protected Access\n\nWhen I first got to know Java, I\
    \ thought the word protected meant nice and secure, or something like that. \"\
    Wow, that field is protected. It must be hard to get at.\" Well, this notion turned\
    \ out to be wrong. In Java, a member that's protected is less hidden, less secure,\
    \ and easier to use than one that has default access. The concept is strange\n\
    \nThink of protected access this way. You start with a field that has a default\
    \ access (a field without the public, private, or protected in its declaration).\
    \ That field can be accessed only inside the package in which it lives. Now add\
    \ the word protected to the front of the field's declaration. Suddenly, classes\
    \ outside that the field's package has some access to the field. You can now reference\
    \ the field from a subclass (of the class in which the field is declared). You\
    \ also reference the field from a sub-subclass, a sub-sub-subclass, and so on.\
    \ Any descendant will do. For an example, see Listings 14-8 and 14-9.\n\n# Listing\
    \ 14-8: Protected Fields\n\n```\npackage com.burdbrain.drawing;\n\nimport java.awt.Graphics;\n\
    \npublic class Drawing {\n    protected int x = 40, y = 40, width = 40, height\
    \ = 40;\n\n    public void paint(Graphics g) {\n        g.drawOval(x, y, width,\
    \ height);\n    }\n}\n```"
