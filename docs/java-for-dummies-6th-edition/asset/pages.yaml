    # Testing for the presence of more data


    Here''s a pleasant surprise. When you write a program like the one previously
    in Listing 12-1, you don''t have to know how many names are in the input file.
    Having to know the number of names may defeat the purpose of using the easily
    expandable ArrayList class. Instead of looping until you exactly nine names, you
    can loop until out of data.


    The Scanner has several nice methods such as hasNext, hasNextDouble, and plain
    old hasNext. Each of these methods checks for more data. If there''s more data,
    the method returns true. Otherwise, the method returns false.


    Listing 12-1 uses the general-purpose hasNext method. This hasNext method returns
    true as long as there''s anything to read from the program''s input. So after
    the program scoops up what Lucy R. DaReader line in Figure 12-1, the subsequent
    hasNext call returns false. This false condition ends execution of the while loop
    and plummets the counter towards the remainder of the Listing 12-1 code.


    The hasNext is very handy. In fact, hasNext is so that it''s part of a bigger
    concept known as an iterator, and iterators are baked into all of Java''s collection
    classes.'
