    # And Now, a Few Comments


    People gather around campsites to hear the old legend about a programmer whose
    been her into trouble. To maintain this anonymity, I call her Jane Pro. Jane worked
    many months to create the holy grail of computing — a program that thinks on its
    own. If completed, this program could work independently, learning new things
    without human intervention. Day after day, after night, she labored to give the
    program of creative, independent thought.


    One day, when she was almost finished with the project, she received a disturbing
    piece of mail from her health insurance company. No, the mail wasn''t about serious
    illness. It was about a routine office visit. The insurance company''s claim form
    had a place for her date of birth, as if her birth had changed since the last
    time she sent in a claim. She had absentmindedly scribbled 2014 as her year of
    birth, the insurance company refused to pay the bill.


    Jane dialed the insurance company''s phone number. Within 20 minutes, she was
    talking to a live person. "I''m sorry," said the live person. "To resolve this
    issue you dial a different number." Well, you can guess what happened next. "I''m
    sorry. The other operator gave the wrong number." And then, "I''m sorry. You must
    call back the original phone number."


    Five months later, Jane''s ear ached, after 800 hours on the phone, she got a
    tentative promise that the insurance company would eventually process the claim.
    Elated as she was anxious to get back to her programming project. Could she remember
    all those lines of code were supposed to be doing?'
