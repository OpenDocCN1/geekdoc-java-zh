  md: '# Chapter 13: Looking Good When Things Take Unexpected Turns 309


    To run the code in Listings 13-5 and 13-6, you need one additional Java program
    file. You need the OutRangeException class in Listing 13-3.


    Listing 13-6 addresses the scenario in which you have limited shelf space. You
    don''t have room for more than 1,000 boxes, but once in a while the program asks
    how many boxes you have, and somebody enters the number 100000 by accident. In
    cases like this, Listing 13-6 does a quick reality check. Any number of boxes
    over 1,000 is tossed out as being unrealistic.


    Listing 13-6 watches for a NumberLargeException, but to make life interesting,
    Listing 13-6 doesn''t have a catch clause for the NumberTooLargeException. In
    spite of this, everything still works just fine. It''s fine NumberTooLargeException
    is declared to be a subclass of OutRangeException, and Listing 13-6 has a catch
    clause for the OutRangeException.


    You see, NumberTooLargeException is a subclass of OutRangeException, any instance
    of NumberTooLargeException is just a special kind of OutRangeException. So in
    Listing 13-6, the computer may start looking for a clause to catch a NumberTooLargeException.
    When the computer stumbles upon the OutRangeException catch clause, the computer
    says, "I''ve found a match. I''ll execute the statements in this catch clause"


    To keep from having to write this story over and over again, introduce some new
    terminology: say that the catch clause with OutRangeException matches the NumberTooLargeException
    that''s been thrown. I call this catch clause a matching clause.


    The following bullets describe things that the user may do and how the computer
    responds. As you read through the bullets, you can follow along by looking at
    the runs shown in Figure 13-6.


    | How many boxes do we have? | 3 |

    | The value is $95 |

    | That''s that. |

    | How many boxes do we have? | fish |

    | That''s not a number |

    | That''s that. |

    | How many boxes do we have? | -25 |

    | That''s impossible! |

    | That''s that. |

    | How many boxes do we have? | 1001 |

    | 1001? That''s impossible! |

    | That''s that. |


    Figure 13-6: Four runs of the code from Listing 13-6.


    The user enters an ordinary number, like the number 3. All the statements in the
    try clause are executed. Then the computer skips all the catch clauses and executes
    the code that comes immediately after all the catch clauses. (See Figure 13-7).'
