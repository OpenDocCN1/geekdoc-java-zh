    # Access Modifiers


    If you''ve read this into Java For Dummies, 6th Edition, you probably know one
    thing: Object-oriented programming is big on hiding details. Programmers who write
    one piece of code should not tinker with the details inside another programmer''s
    code. It is not a matter of security and secrecy. It is a matter of modularity.
    When you hide details, you keep the intricacies inside one piece of code from
    being twisted and broken by another piece of code. Your comes in nice, discrete,
    manageable lumps. You keep complexity to a minimum. You make fewer mistakes. You
    save promote world.


    Other chapters have plenty of examples of the use of private fields. When a field
    is declared, it''s hidden from all outside meddling. This hiding enhances modularity,
    minimizes complexity, and so on.


    Elsewhere in the annals of Java For Dummies, 6th Edition, are examples of things
    that are declared public. Just like a celebrity, a field''s declared public is
    left wide open. Plenty of people probably know what kind of toothpaste Elvis,
    and any programmer can reference a public field, even a field that''s not named
    Elvis.


    In Java, the words public and private are called access modifiers. No doubt you''ve
    seen fields and methods without access modifiers in their declarations. A method
    or field of this kind is said to have default access. Many examples in this chapter
    use default access without making a fuss about it. That''s okay in some chapters,
    but not in this chapter. In describe the nifty-gritty details about default access.


    And you can find out yet another access modifier that isn''t used in any example
    before this chapter. (At least, I don''t remember using it in any earlier examples.)
    It''s the protected access modifier. Yes, this chapter covers some of the slimy,
    slimy facts about protected access.'
