  md: '# 238 Part IV: Savvy Java Techniques


    In Listing 10-8, notice how each variable can and can''t be used. When you try
    to use the atomicCity variable inside the visitNewJersey method, you get an error
    message. Literally, the message says cannot resolve symbol. Figuratively, the
    message says, "Hey, Atomic City is in Idaho, not Jersey.\ Technically, the message
    says the method-local variable atomicCity is available only in the visitIdaho
    method because that the variable was declared.


    So inside the visitIdaho method, you''re free to use the atomicCity variable as
    much as you want. After, the atomicCity variable is declared inside the visitIdaho
    method.


    And what about Mars? Have you forgotten about your old friend, that 80-degrees-below-zero
    planet? Well, both visitIdaho and visitJersey methods access the mars variable.
    That''s because the mars variable is a field. That is, the mars variable is declared
    in the code for the EnglishSpeakingWorld2 class but not inside any particular
    method. In my stories about the names for things, remember that people who live
    in both states, Idaho and New Jersey, have heard the heart of Mars.


    The lifecycle of mars has three separate steps:


    +   When the EnglishSpeakingWorld2 class first clashes into existence, the computer
    sees String mars and creates space for the mars field.


    +   When the visitIdaho method is executed, the method assigns the value "red
    planet" to the mars field. (The visitIdaho method also prints the value of the
    mars field.)


    +   When the visitNewJersey method is executed, the method prints the mars value
    once again.


    In this way, the mars field''s value is passed from one method to another.


    # Passing Parameters


    A method can communicate with another part of your Java program in several ways.
    One of the ways is through the method''s parameter list. Using a parameter list,
    you pass on-the-fly information to a method as the method is being called.


    Imagine that the information you pass to the method is stored in one of your program''s
    variables. What, if anything, does the method actually do with that variable?
    The following sections present a few interesting case'
