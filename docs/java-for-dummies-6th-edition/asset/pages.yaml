  md: '# Chapter 8: Saving Time and Money: Reusing Existing Code 179


    # Closing the connection to a disk file


    To the average user, a keyboard doesn''t feel anything like a file stored on a
    computer''s hard drive. But disk files and keyboard input have a lot in common.
    In fact, a basic principle of computer operating systems dictates that, for the
    programmer, differences between two kinds of input be as blurry as possible. As
    a Java programmer, you should treat disk files and keyboard input almost the same
    way. That''s why Listing 8-2 contains a diskScanner.close() call.


    When you run a Java program, you normally execute the main method''s statements,
    starting with the first statement in the method and ending with the last statement
    in the method body. You detours along the way, skipping else parts and diving
    into method bodies, but basically, you executing statements at the end of the
    main method. That''s why, in Listing 8-2, the close is at the end of the main
    method''s body. When you run the code in Listing 8-2, the last thing you do is
    disconnect from the disk file. And, fortunately, that disconnection takes place
    after you''ve executed all the next calls.


    # Defining Subclasses (What It Means To Be a Full-Time or Part-Time Employee)


    This last year, your company paid $10 million for a piece of software. That software
    came in the Employee.class file. People at Brain Consulting (the company that
    created the software) don''t want you to know the innards of the software. (Otherwise,
    you may steal their ideas.) So you don''t have the Java program file that the
    software came from. (In other words, you have Employee.java.) You can run the
    bytecode in the Employee.class file. You can also read the documentation in a
    web page named Employee.html. But you can''t see the statements inside the Employee.java
    program, and you can change any of your program''s code.


    Since this last year, your company has grown. Unlike the old days, your company
    now has two kinds of employees: full-time and part-time. Each full-time employee
    is on a fixed, weekly salary. (If the employee works nights and weekends, then
    in return for this monumental effort, the employee receives a hearty handshake.)
    In contrast, each part-time employee works for an hourly wage. Your company deducts
    an amount from each full-time employee''s paycheck to pay for the company''s benefits
    package. Part-time employees, however, don''t get benefits.'
