    \n# Enforcing rules with accessor methods\n\nGo back to Listing 7-8 and take a\
    \ quick look at the setName method. Imagine putting the method's assignment statement\
    \ inside an if statement.\n\n```\npublic void setName(String n) {\n    if (in.equals(\"\
    \")) {\n        name = n;\n    }\n}\n```\n\nNow, if the programmer in charge of\
    \ the UseAccount class writes myAccount.setName(\"\"), the call to setName doesn't\
