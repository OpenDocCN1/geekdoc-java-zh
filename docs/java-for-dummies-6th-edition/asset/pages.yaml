  md: "# Part V: The Part of Tens\n\n# Fixing Non-Static References\n\nIf you try\
    \ to compile the following code, you get an error message:\n\n```\nclass WillNotWork\
    \ {\n    String greeting = \"Hello\";\n    public static void main(String args[])\
    \ {\n        System.out.println(greeting);\n    }\n}\n```\n\nYou get an error\
    \ message because main is static, greeting isn't static. For the complete guide\
    \ to finding and fixing this problem, see Chapter 10.\n\n# Staying within Bounds\
    \ in an Array\n\nWhen you declare an array with ten components, the components\
    \ have indices 0 through 9. In other words, you declare\n\n```\nint guests[] =\
    \ new int[10];\n```\n\nthen you can free the guests array's components by writing\
    \ guests[0], guests[1], and so on, all the way up to guests[9]. You can't write\
    \ guests[10], because the guests array has no component with index 10.\n\nFor\
    \ the latest gossip on arrays, see Chapter 11.\n\n# Anticipating Null Pointers\n\
    \nThis book's examples are prone to throwing the NullPointerException, but in\
    \ real-life Java programming, you see that exception all the time. A NullPointerException\
    \ comes about when you call a method that's supposed to return an object, but\
    \ instead the method returns nothing. Here's a cheap example:\n\n```\nimport java.lang.System.out;\n\
    import java.io.File;\nclass ListMyFiles {\n    public static void main(String\
    \ args[]) {\n        File myFile = new File(\"\\\\windows\");\n}\n```"
  merge: -1
