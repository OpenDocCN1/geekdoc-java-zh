  md: '# 66 Part II: Writing Your Own Java Programs


    Most of the programs in this book are text-based. A text-based program has no
    windows, no dialog boxes — nothing of that kind. All you see is line after plain,
    un text. The user types something, and the computer displays a response beneath
    each line of input. As visually exciting as such programs may be, they contain
    the basic concepts for all computer programming. They are also easier for the
    novice to read, and understand. So in this book I take a two-pronged approach.
    The examples in the printed books are mostly text-based, but you can find fancier
    versions of them on this book''s website (www.alymcode.com/JavaForDummies). These
    fancier versions involve buttons, text fields, and other elements of a typical
    graphical interface (GUI).


    In Listing 4-2, look at the first line in the body of the method.


    ```

    double amountAccount;

    ```


    This line is called a *variable declaration*. Putting this line in your program
    is saying, "I''m declaring my intention to have a variable amountAccount in my
    program." "This line reserves the name amountAccount for your use in the program.


    In variable declaration, the word **double** is what kind of values you intend
    to store in `amountAccount`. In particular, the word double stands for numbers
    -1.8 × 10³⁰⁸ and 1.8 × 10³⁰⁸ (These are enormous numbers with 308 zeros before
    the decimal point. Only the world''s richest people check with 308 zeros in them.
    The second of these numbers is one-point eight gazillion-zillion-killing, by the
    International Bureau of Weights and Measures, is the number of programmers between
    Sunnyvale, California, and the M31 Andromeda Galaxy.


    More than the humongous range of the **double** keyword is the fact that a *double*
    value can have digits beyond the decimal point. After you declare `amountAccount`
    to be of type double, you can store all of numbers in `amountAccount`. You can
    store 50.22, 0.02398479, or -0.3. In Listing 4-2, if I hadn''t declared `amountAccount`
    to be of type double, I might not have been able to store 50.22. Instead, I would
    have had to store 50, without any digits beyond the decimal point.


    Another type — *float* — also allows you to have digits beyond the decimal point.
    But float values are as accurate as double values.


    In many situations, you have a choice. You can declare certain values to be either
    *float* values or *double* values. But don''t sweat the choice between **float**
    and **double**. For most programs, use **double**. With today''s fancy processors,
    the space you are using the **float** type is almost never worth the loss of accuracy.
    (For more details, see the nearby sidebar, "Digits beyond the decimal point.")


    ![](img/be49a553c8cd52419c36f97f5ee90278_79_0.png)'
