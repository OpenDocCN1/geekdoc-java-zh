  md: "# 334 Part IV: Savvy Java Techniques\n\nThe detective in you may be thinking,\
    \ \"He must have written more code (code that I don't see here) and put that code\
    \ in packages that he named com.burdbrain.drawings and com.burbrain.frames.\"\
    \ And, indeed, you are correct. To make Listing 14-1 work, I create something\
    \ called a Drawing, I'm putting all my drawings in the com.burbrain.drawings package.\
    \ I also need an ArtFrame class, and I'm putting all such classes in com.burbrain.frames\
    \ package.\n\nSo, really, what's a Drawing? Well, if you're so anxious to know,\
    \ look at Listing 14-2.\n\n# Listing 14-2: The Drawing Class\n\n```\npackage com.burdbrain.drawings;\n\
    \nimport java.awt.Graphics;\n\npublic class Drawing {\n    public int x = 40,\
    \ y = 40, width = 40, height = 40;\n\n    public void paint(Graphics g) {\n  \
    \      g.drawOval(x, y, width, height);\n    }\nn\n```\n\nThe code for the Drawing\
    \ class is pretty slim. It contains a few fields and a paint method. That's all.\
    \ Well, when I create my classes, I try to keep 'em away. Here are some notes\
    \ about my Drawing class:\n\n+   At the top of the code is a package declaration.\
    \ Lo behold! I've made my Drawing class belong to a package — the com.burbrain.drawings\
    \ package. I didn't pull this package name out of the air. The convention (handed\
    \ down by the people who created Java) says that you start a package name by reversing\
    \ the parts of your domain name, so I reversed burbrain.com. Then, you add one\
    \ or more names, separated by dots. I added the name drawings because I intend\
    \ to put all my goodies in this package.\n\n+   The Drawing class is public. A\
    \ public class is vulnerable to intrusion from the outside. In general, I avoid\
    \ placing the public keyword in front of any old class. But in Listing 14-2, I\
    \ have to declare my Drawing class to be public. If I don't, classes that aren't\
    \ in the com.burbrain.drawings package can't use the goodies in Listing 14-2.\
    \ In particular, the line\n\n```\nArtFrame artFrame = new ArtFrame (new Drawing());\n\
    ```\n\nIn Listing 14-1 is illegal the Drawing class is public."
