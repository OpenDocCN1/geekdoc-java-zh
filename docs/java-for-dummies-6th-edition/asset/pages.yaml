  md: "# 326 Part IV: Savvy Java Techniques\n\nNow you have a real predicate. Inside\
    \ the finally clause, the value of scan1 is null. The call to scan1.close() fails,\
    \ the program throws a NullPointerException and stops running before reaching\
    \ the call to scan2.close(). In the worst of circumstances, scan2 isn't closed,\
    \ and your program has File2.txt locked up so that no other program can use the\
    \ file.\n\nWhen a program uses several resources (many files, a database and a\
    \ file, or whatever) the buildup of try statements becomes very complicated. You\
    \ can make try statements with catch clauses and all kinds of crazy combinations.\
    \ But Java has a better way to solve the problem. In Java 7 (and later versions\
    \ of Java), you can create a try-with-resources statement. Listing 13-13 shows\
    \ you how.\n\n# Listing 13-13: Making Sure to Close Resources\n\n```\nimport java.io.*;nimport\
    \ java.io.IOException;\nimport java.util.Scanner;\n\npublic class NewMain {\n\
    \    public static void main(String[] args[]) {\n        try (Scanner scan1 =\
    \ \n                new Scanner (new File(\"File1.txt\"));\n             Scanner\
    \ scan2 =\n                new Scanner (new File(\"File2.txt\"))) {\n        \
    \    // Do useful stuff\n        } catch (IOException e) {\n            // Oops!\n\
    \        }\n        System.out.println(\"Done!\");\n    }\n}\n```\n\nIn 13-13,\
    \ the declarations of scan1 and scan2 are in parentheses after the try word. The\
    \ parenthesized declarations let Java close scan1 and scan2 automatically after\
    \ execution of the statements in the try clause. You can declare several resources\
    \ inside one try statement's parentheses. When you do, Java closes all the resources\
    \ automatically after execution of the try clause's statements. You can add catch\
    \ clauses and a finally clause if you want. You can access all kinds of resources\
    \ (files, databases, connections to servers, and others) and have peace of mind\
    \ knowing that Java will serve the whatever.\n\nLife is good."
