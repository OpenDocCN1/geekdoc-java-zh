    The first is that international NGOs need to acknowledge their role in the current
    system and take active steps to develop respectful relationships with civil society
    conservation actors and facilitate these genuine, unpasteised voices into international
    process. This is possible and viable, and there many NGOs already with these relationships
    in place. They are already tuned to take on this role, they just need the MEA
    system to evolve to accommodate them.'
  merge: -1
  pgno: 199
- img_proc: true
  md: 'The second step is that governments need to loosen their grip on governance
    and invite new perspectives, and new actors, to legitimately sit at the governance
    table. They need to make space for cosmopolitan biome delegations to be a voice
    for local conservation and to respectfully include those in their deliberations
    as equals.


    The United National General Assembly can assist this progression, by acknowledging
    the steps NGOs, Ramsar and CMS have already taken, and voicing support for this
    work to continue.


    I believe we are on the cusp of a transitional moment in human history and I believe
    we have to be conscious about the decisions we make in the near future. The past
    decade has witnessed scientific publication after being released that calls out
    with distress and anguish at the rate of species and ecosystem loss. Governments
    have committed to a series of biodiversity targets for the last two decades, but
    they are never met and simply renegotiated forward in the next round. The most
    recent are the Aichi Targets and the new Sustainable Development Goals (SDGs).


    In 2006 Paul Crutzen called our current age the Anthropocene to highlight that
    human activities are exerting impacts on the environment. On all scales we are
    outperforming our home.[53] Alarmingly, Colin Waters and his colleagues have made
    the case that humans have pushed the Earth into a new epoch.[54] There is no language
    available to emphasise the urgency with greater clarity. It has been said, time
    and time again.


    Something much like the thunderhead fed by climate change and broken politics
    is forming above us. Very soon the gusts of wind will begin to whip and sail.
    Some of us, on the very margins of the storm are already feeling the tempest’s
    best. It will get worse before it gets better. And, it will only get better if
    we take steps now.


    The cosmopolitan wildlife governance I propose is not polished, nor finished.
    It is the product of one mind and one point of view. It deserves to be robustly
    debated, pulled apart and built anew – for that is what cosmopolitan requires.
    I hope it will contribute to a path through the storm and that when we emerge
    we will hear birdsong.


    As I finish this book I have scanned the latest United Nations General Assembly
    Resolutions. Buried deep, as document A/RES/70/208, almost obscured between Resolutions
    on ‘financing of the International Criminal Tribunal’, ‘telecommunications of
    international security’, ‘oil slick on Lebanese shores’, and ‘external debt sustainability'
  merge: -1
  pgno: 200
- img_proc: true
  md: 'and development’s sits a Resolution entitled Harmony with Nature. It was adopted
    by the General Assembly in all its wisdom on 11 December 2015. It wasn’t the first
    time this gem had been on the agenda. The principle of harmony with nature has
    been quietly agreed each year for the past five years, seeing it again gives me
    hope. In my briefest summary it says:


    +   [Gross domestic product was not designed as an indicator for measuring environmental
    degradation resulting from human activity and the need to overcome this limitation
    with regard to sustainable development and the work carried out in this regard
    ...

    [M]any civilizations, indigenous peoples and indigenous cultures have a history
    of understanding the symbiotic connection between human beings and nature that
    fosters a mutually beneficial relationship.

    [The UN General Assembly calls] for holistic and integrated approaches to sustainable
    development, in its three dimensions, will give humanity to live in harmony with
    nature and lead to efforts to restore the health and integrity of the Earth’s
    ecosystems.

    [The UN General Assembly will initiate] a virtual dialogue on Harmony with Nature
    among, inter alia, experts on Earth jurisprudence worldwide, ... in order to inspire
    citizens and societies to reconsider how they interact with the natural world
    in order to implement the Sustainable Development Goals in harmony with nature,
    ... and requests that the experts submit a summary to the General Assembly at
    its seventy-first session and that the virtual dialogue be hosted on the website
    on Harmony with Nature.[55]


    The invitation has been given. Radical dreams can foster new belief and ideas
    how we should organise our lives and society. Instead of limiting ourselves to
    the way we have been taught to see the world, we can dare to think beyond capitalism;
    beyond states as the ultimate power; beyond the notion that in order to save what
    we love we have to monetise it.


    I invite you to embark on such radical dreaming. Richard Falk has invited normative
    thinkers to inhabit a ‘shadowland’ – a conceptual space where we are outraged
    by contemporary conditions, mindful of past realities and devoted to exploring
    future possibilities.[56] Slavoj Žižek, a radical'
  merge: -1
  pgno: 201
- img_proc: true
  md: 'philosopher, has dared not to assume that the catastrophic future dread has
    already happened and to work backwards to work out what we should have done. Both
    of these great thinkers have implorled us to mobilise ourselves to change that
    destiny.[57]


    In 2014 I stood in the shadowland and imagined my version of a catastrophic future.
    It was one where the world was monetised and wildness is gone Tiger’s footprints
    are not seen in snowdrifts or the deep, pungent smell of elephant musk is not
    carried on the wind. Cranes no longer walk with grace shallow pools of water.
    Ancient trees that have borne witness to hundreds of human generations no longer
    cast welcome shadow. Soaring albatross are not seen cresting waves of miles from
    land. The black nose of polar bear no longer emerges from blizzards of snow. A
    child does not stand on a river bank and squeal with delight under the spray from
    a hippopotamus’ surfacing nostrils. A gorilla’s eye no longer catches our hearts
    and our souls propelling us to be better than we are right now. The twirling song
    of the red-headed malm own is only a silent echo across the wetland.


    In my catastrophic future all of these precious moments, and millions of others
    as well, are only stories we tell our grandchildren. If our people came from the
    forest or the mountain or the desert or the sea we tell the stories with added
    sadness for our place has also been lost to time. Humans may have survived, but
    the world is brittle and harsh.


    That catastrophic future does not need to happen.


    Each of us has a short flash of time on Earth, yet we carry a profound responsibility
    for all who call this place home, now and in the future. I have stood in the shadowland
    and dreamed a path. I offer it to you.


    Spark your own dreaming.


    The storm is upon us now.


    *** *** ***


    My imaginary journey through the storm concludes.


    The gorilla and I still sit together under the ancient tree. Our sentinel of comfort
    is stripped of its leaves, but it still presses against our back with what comfort
    it can give.'
