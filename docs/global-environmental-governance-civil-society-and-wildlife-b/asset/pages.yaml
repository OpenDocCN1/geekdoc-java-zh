  md: 'This is a unique and beautiful region on the margins of survival. Lake Nokoué,
    20 km wide and 11 km long, is formed by the deltas of the So and Ouémém rivers
    in southern Benin. A rich, alluvial region it is the most productive in West Africa.
    Wetland forests, marshes and flood plains rise and recede with the ebb and flow
    of seasonal water. Originally farmers, villagers on around Nokoué now live from
    fishing, fish-farming and tourism. To the south sit the city of Cotonou, the economic
    centre of Benin; to the east, the country''s capital, Porto Novo. These waters
    are relied upon by tens of thousands of fisherpeople.


    While comprehensive scientific surveys of the region are still to be completed,
    so far 168 species of bird and 78 species of fish have been recognised in Nokoué,
    along with sitanga, pythons, manatee and tortoises. Close to 100,000 hectares
    of Lake Nokoué were declared a Ramsar Wetland of International Importance in 2000,[1]
    yet Benin struggles to overcome some serious problems for the wetland. Mangrove
