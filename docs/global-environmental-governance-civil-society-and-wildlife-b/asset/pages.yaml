  md: 'I propose the terrestrial biomes have a different, more rooted cosmopolitan
    value. They can be the foundations grouping for the cosmopolitan delegations.
    Ecoregions and biomes are well defined for the terrestrial and management environment,
    and are able to capture the view and information of people’s connections to their
    landscape and wildlife community, unimpeded by state boundaries or politics. Eoregions
    reflect the distribution of species and communities. Communities living in similar
    biomes across the world can share information and learnings, based on their similar
    ecological experiences.


    Facilitating so localised discussions will require considerable commitment from
    international NGOs. They will need to redirect their current focus, time and resources
    to assume the role of ecoregion and biome advocates, a role often referred to
    as ‘bridging organisations’ in governance literature.[[38] Communities will need
    skilled and committed facilitation and support. This is a role that NGOs, with
    their pre-existing expertise, experience and resources, can embrace. By build
    enough trust to advocate for a community will genuinely give ‘free, prior and
    informed consent’ to wildlife conservation actions on their lands and waters.
    The presumption should be that the community remains, and they develop proposals
    for how their activities can adapt, modify or evolve. They should have the option
    for voluntary area closures, or of considering if new activities should start.


    Garnering this level of commitment takes time and trust. But, the community gains
    empowerment to manage the place where they live. They can stand as the recognised
    guardians of the wildlife who share the same space, through access to processes
    they previously couldn''t influence. What everyone gains is certainty of permanent
    and unconditional conservation.


    This principle requires a new leap of faith and commitment from minority world
    NGOs and government actors, to devolve decision-making to the community level
    and adapt the MEA system to embrace a multitude of expressions – a tapestry of
    conservation diversity.


    # Monitoring and transparency


    The second principle is to establish monitoring and transparency. This is how
    certainty and commitment is maintained. Monitoring of scientific'
