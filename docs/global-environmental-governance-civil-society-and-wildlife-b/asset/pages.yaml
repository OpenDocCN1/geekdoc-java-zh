  md: '# Minority and majority worldviews


    Understanding how I discuss different groups of people in the world order is important
    to understanding my core arguments. Again, I draw on Timothy Doyle for a definition
    of the dualistic division of ''minority'' and ''majority'' worldviews.[73, 74]
    I resist the labels that stem from the colonial and Cold War past (first, second
    and third world) as well as those that describe our societies according to economic
    value (developed, developing, less-developed, under-developed). In many cases
    economically poor countries are countries that have been colonised. Some argue
    that they continue to be colonised through globalised forms of control,[75, 76]
    I also resist the grouping of north and south. The labels of north, south, developing
    each contain inherent internal contradictions. Pockets of human communities everywhere
    are impoverished and disadvantaged, including acute deprivation in health, education
    and standard of living.[77, 78]


    To avoid contradiction and to speak more clearly about the inequality of the elite
    choosing over the majority, I consciously use the groupings of ''minority'' and
    ''majority''. In so I am making clear who should be and who is empowered to participate
    in international political discussions and who is not.


    Minority worldviews encompasses wealthy societies that have, often, historically
    exploited the majority world – Western Europe, Russia, North America, Australia,
    New Zealand, South Africa and at times Brazil and China.


    Majority worldviews encompasses the vast population of the world that sit outside
    these reality spaces – including Africa, Central and South America, South and
    South East Asia and the Middle East, and also the pockets of extreme poverty and
    depravity in Australia, South Africa and Brazil. The majority world is the politically
    disempowered. Yet, this is also the world that retains the most biodiverse and
    precious places left on Earth; a factor that is of core importance to this book.


    These first two elements – my involvement with the subject, and a minority and
    majority worldview – led naturally to my philosophical home of normative international
    relations.'
