- img_proc: true
  md: 'The sky gently opens to illuminate the world, making visible a new, deeper
    pain – the damage of the storm.


    Trees are blown over. Branches torn from trunks are scattered around us. Thrown
    across the landscape like small twigs.


    Those left standing have no leaves.


    Water streams across the ground, gathering leaves and debris, scouring it clean.


    I look at the gorilla and her deep ache. She is doubly bruised from the assault
    of the storm and the loss of her world.


    Eyes closed, her head is still bowed, her arms still around her body in protective
    embrace.


    Her gift was to become my muse, to propel me to write, with hope that birdsong
    will be there for generations to come.


    In time wind becomes breeze and whispers from a new direction, drawing with a
    gentle dryness. The whisper murmurs about what is gone, what is swept away.


    Then, in the distance, a small song begins. It twirls and flits, and begins again.


    She lifts her eyes to see. The pirouetting song answers the whisper of loss in
    the breeze.


    With heartbeat I watch my gorilla muse for a long, precious moment, then I follow
    my gaze to the promise of birdsong.


