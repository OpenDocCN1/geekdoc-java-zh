  md: '# #7 Birdsong after the storm


    # ## ‘We the peoples’


    The UN Charter begins ‘We the peoples’[1] evoking a democratic ideal of popular,
    genuinely representative governance implying a role for everyone, not just an
    elite few. There is a legion of fans for this phrase. Academics have written significant
    and important books about it. Careers have been forged around it, including mine.
    But the phrase means little unless it is interpreted well.


    A few brave and influential souls have kept the dream alive. In 1996, the late
    Secretary-General Boutros Boutros-Ghali stated:


    > Our global society must invent rules which take into account not only the wishes
    of political actors, namely States, but also the behaviour of economic agents
    and the aspirations of social and cultural actors. These new actors in international
    life are the guarantors of an open, living democracy ... I have said repeatedly
    that I would like to see non-State institutions and non-governmental organizations
    accorded an increasing role within the United Nations itself.[[2]


    In 2000 Kofi Annan captured the hearts and minds of my sector when he said:


    > I see a United Nations keenly aware that the global agenda is to be properly
    addressed, a partnership with civil society is not an option; it is a necessity.
    I see a United Nations which recognizes the NGO revolution – the new global people-power
    – is the best thing that has happened to our Organization in a long time ... Civil
    society organizations have already given new life and new meaning to the idea
