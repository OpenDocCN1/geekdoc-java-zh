  md: 'the plight of the gorillas and the international conservation efforts on their
    behalf. They spoke of researchers from Europe and America. They spoke of international
    campaigns. They didn’t mention the community surrounding the centre. We heard
    nothing about their crops or their lives. The signs and the materials were handmade,
    raw and genuine, yet I recognised the ‘westernness’ of the message they contained,
    planted there by NGOs from afar.


    Without doubt, questions were influencing my experience of the day. I love wildlife
    and had invested life in wildlife protection, without compromise. By 2005 I was
    starting to question the wisdom of imposing solutions on people from other worldviews.
    I was also uneasy about the conservation movement developing tourism dependency
    in communities, without a corresponding conservation commitment that would endure
    if the tourism evaporated. I took this gorilla trek with these questions in mind.
    Aware that I was taking part in the system I self-consciously interrogating, I
    wanted to experience another layer. I wanted to understand whether the conservation
    effort was serving the gorillas and the community. Without doubt, it would to
    be a memorable day and would change me profoundly.


    After another short bus we began our trek up the first of many hills; led by confident
    and quiet local guides. They kept each other’s company rather than engaging with
    the trekkers. Notably these fit and agile men carried guns. The trek went on for
    hours as we climbed one hill after the next, tumbling into the valleys between.
    At times we walked sideways around the hillsides, following signs of the gorillas
    – their beds from the previous night, their breakfast grazing, the echo of a youngster’s
    somersault tumble in the vegetation. Occasionally the guides called out a series
    of deep, resonant sounds. It was a shared language between humans and these gorillas,
    they shyly explained. They were letting the silverback know we were approaching.
    They were seeking his permission to come closer. I asked what would happen if
    he said ‘no’. ‘We would leave’ was the assured answer.


    The jungle around us was dense, lush, expansive and alive. In truth I would have
    been happy to just been on this mountain. The trip would have been worthwhile.
    Birds and insects hummed and buzzed, called and sang everywhere that my senses
    reached.'
