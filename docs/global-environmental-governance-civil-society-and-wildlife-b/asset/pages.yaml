    profound and moving comments that have been me from page one. You are too many
    to mention, but I have watched you and listened to your courage for decades, as
    you have advocated for your people (human and non-human) across the table of international
    affairs.


    I extend deep appreciation to Timothy Doyle, Rob Sorsby and Ashgate Publishing
