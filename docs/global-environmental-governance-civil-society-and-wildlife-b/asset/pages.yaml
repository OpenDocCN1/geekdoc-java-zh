  md: 'governance arrangements already extend government resources, developing new
    solutions, and enabling decisions that go beyond mere compliance.[44–46]


    The principles for cosmopol wildlife governance that I propose are not such a
    leap beyond what already exists.[45,47] What is novel is connecting local issues
    directly to international governance, where the profound decisions about our future
    are already being made and triage decisions will be discussed in the near future.


    If we don''t connect local wisdom to these discussions, those in charge will make
    arbitrary decisions without the full knowledge of what is possible – about what
    we value and want to save for the other side of the storm upon us.


    *** *** ***


    My imaginary journey with the gorilla in the storm continues.


    The tempest rages. We are exhausted, soaked and bruised.


    Her coat hangs wet and water streams off her body. She shakes with fear and holds
    herself tight. Powerless, all she can do is wait for the nightmare to pass.


    This storm is not of her making and the shelter she deserves is stripped away.
    The rain is like bullets, scarcely broken by the bare branches above us.


    The only sound is the scream of the wind.


    With deep sadness, I can do nothing but ride through hell with her. silently pledge
    to do better on the other side.


