  md: 'These relationships and insights are only possible with time. It was through
    Yash Veer that I came to understand the depth of continuous work that had been
    invested in Kibber since 1995. The Nature Conservation Foundation and Snow Leopard
    researchers had become part of the village family – with all the various tensions
    and differences that come with working in groups of people, even those who share
    a bond. This was a measure of Charudutt’s to the snow leopard project. Yash Veer
    recounted how Charudutt had lived in the village for extended periods, had helped
    the local school with teaching mathematics, played sports, shared their celebrations
    and sadness, and became a part of the community. The children Charudutt taught
    were now the adults making village decisions. Over time a deep trust, friendship
    and respect had developed.


    This allowed insights and understanding to be uncovered. Each in their way, Yash
    Veer and Kulbhushanshing explained that wildlife conservation must have context
    for people who are caretakers of this wildlife. This means understanding the layers
    and permutation of people’s perspectives and motivations.


    Decades of minority world assumptions have been made about people’s relationships
    with predators. Presumptions are reinforced by simple surveys that seek people’s
    thoughts, without necessarily overlaying other factors. Too often these shallow
    investigations reinforce what the researcher believes, without checking whether
    that belief is actually true.


    The Nature Conservation Foundation had taken a different route and invested the
    time to really understand the problem. This understanding helped them to work
    more constructively and collaboratively with the community to build long-term
    solutions tuned to the community’s needs. Kulbhushanshing is now leading work
    to investigate an even deeper picture. He has discovered that individual attitudes
    are influenced by different factors at different levels of social organisations.
    We now know that gender, education and age, income sources in the family, agricultural
    production and type of livestock holder are all factors that influence perspectives.
    With this information, overlaid with numbers of livestock taken, new patterns
    have started to emerge.


    Charudutt, Kulbhushanshing and Yash Veer, and their many colleagues, believe the
    future of snow leopards is in the hands of the people who share the region – the
    people who look across the same landscape, share the same seasons and feel the
    same wind, rain and snow. They strive to empower the'
