  md: 'world, and had a broader spectrum of views from animal welfare through sustainable
    hunting. In summary, the review findings were that:


    +   - civil society – both NGOs and local civil society groups – are the implementers
    and sometimes even the coordinators of work under the convention and its agreements.


    +   - most CMS agreements are poorly linked to other MEAs (the Convention of Biological
    Diversity – CBD, the Convention on International Trade in Endangered Species of
    Wild Flora and Fauna – CITES, the Convention on Wetlands of International Importance
    – Ramsar and the United Nations Environment Assembly – UNEA) and consequently
    NGOs often find their agreement-focused work in other fora – either by CMS or
    governments.


    +   - civil society programmes are necessarily localised – this is the scale where
    conservation takes place. Without the means to draw these efforts together, acknowledgement
    about them quickly becomes scattered. Governments frequently overlook them.


    +   - there is significant scope for civil society to provide additional types
    of implementation activity (such as scientific, technical, practical, local, popular,
    capacity-related) especially where priority taxonomic or geographical gaps are
    identified or capacity building is needed in developing regions.


    +   - civil society wants a formal mechanism to inform/report on their activities
    so that efforts made by civil society are seen as relevant and respected. It is
    important that civil society contributions are codified and accepted as a contribution
    against an agreed plan, that Parties or Signatories recognise the value, and build
    this work fully into the progression of the CMS agenda. At present, only a fraction
    of NGO/civil society CMS-related activities are reported to CMS processes.


    +   - CMS needs a monitoring and evaluation process that defines and tracks the
    main benchmarks for the convention’s work – a legally enforceable peer review
    mechanism (compliance regime) – that civil society should have access to.


    +   - the CMS Family offers unique attributes by providing for high-level policy
    discussions (through the CMS CoP) as well as detailed and region-specific species
    actions plans and activities coordinated through agreements. If facilitated properly,
    CMS could usefully draw local'
