    but the 0.001 per cent. A mere 111,000 people control a fifth of the world’s gross
    national product (GNP) – US$16.3 trillion.[114]


    The Davos Class has been quietly progressing what it calls the Davos Global Redesign
    Initiative, as a reflection of how these elites envision the future of governance.
    Nick Buxton characterises the motivations: ‘In the world of Davos, the tired old
    world of democratic demands channelled through states is replaced by a slicker,
    fast moving, corporate-governance.’[115]


    They want to replace intergovernmental decision making with a system of multi-stakeholder
    governance, with carefully selected stakeholders.[116]


    While most of the G20 leaders participate in the Davos Round, these discussions
    and decisions are being progressed so far from democratic view that the majority
    world one day wake to a reality it no longer recognises. I feel the chill of storm
    when Ian Harris Gleckman’s summary of the Davos Global Redesign Initiative:


    > Who is ingenious and disturbing is that the [World Economic Forum] multi-stakeholder
    governance proposal does not require approval or disapproval by any intergovernmental
    action the informal transition to MSG [multi-stakeholder governance] as a partial
    replacement of multilateralism can just happen.[116]


    The Global Redesign Initiative is centred on the corporation, with stakeholders
    associated with the corporation – principally those with commercial ties to the
    company: customers, creditors, suppliers, collaborators, owners and national economies.
    Those who would be in charge of the multi-stakeholder governance arrangements
    (an important, subtle evolution of the terminology) would be either appointed
    by Davos or by self-selection of leading firms interested in managing a particular
    global challenge with other constituents. There will be no need to wait for the
    intergovernmental system to come to consensus about acting; the multi-stakeholder
    will make these decisions themselves. The first transformative step proposed in
    the Global Redesign Initiative is to:'
  merge: -1
  pgno: 69
- img_proc: true
  md: 'redefine the international system as constituting a wider, multifaceted system
    of global cooperation in which intergovernmental legal frameworks and institutions
    are embedded as a core, but not the sole and sometimes not the most crucial, component.[116]


    There are many layers of concern with this proposal, but an acute concern from
    the perspective of this book is who decides who is included and who is excluded.
    At the moment, the selection process is biased those with an explicit state (presumably
    economic) in the outcome and other categories of stakeholder who are likely to
    agree with the approach of the sponsor of the multi-stakeholder governance arrangement.
    It is also not determined how the balance of power of the multi-stakeholder participants
    will be established. There are already strong reasons for concern when looking
    at a number of the existing multi-stakeholder initiatives including for palm oil,[82]
    biofuels[117] and forestry.[118].


    Proponents argue that spanning the public–private domain can harness the essence
    of ‘governance from below\’, counter the participation gap and address the implementation
    gap in global environmental politics. Just as many critics argue that these partnerships
    consolidate the privatisationisation of governance and reinforce dominant neoliberal
    modes of globalisation.[119] They lack accountability and legitimacy.[120, 121]
    I lean towards the critics. At its core, multi-stakeholder governance is proposing
    a route past the limits of multilateralism, while Westphalian-based intergovernmental
    diplomacy alone has proved it cannot grapple with the pressing problems and complex
    dimensions of sustainable development.


    The Davos agenda exposes the incremental challenge to Westphalia already in play.
    Governments are speeding their own redundancy. Caught within short political-term
    timelines and ongoing financial crises, they are contracting the budgets and mandates
    for all the issues that sit outside the market, throwing away important detail
    and replacing it with broad sweeping statements that cost little and achieve less.
    At some point soon the result of the governance retreat will become publicly evident.
    The Davos Class will be welcomed with desperate arms.


    I believe there is another option. A different post-Westphalian rooted cosmopolitan
    option to reform multilateral environment agreements (MEAs) to give civil society
    a formal seat at the decision-making table.'
