  md: '# Inhabiting the shadowland – normative international relations and rooted
    cosmopolitanism


    Our present-day understanding of politics has become a muted, depoliticised discussion.
    We have become accustomed to politics focused on the authority of the state and
    the decisions the state makes on our behalf. We have lost our connection to politics
    originating with the’polis’, or the political community, as was so eloquently
    described by Aristotle many years ago.


    By muting half of the discussion we have given greater legitimacy to a one-sided
    consideration. We have hampered our ability to discuss questions about agency
    and authority. We have persuaded ourselves that all problems are addressed through
    channel by the state.[79] Whole academic disciplines have grown around this state-centered
    perspective. While politics (the ability to decide which things ought to be done)
    is confined to the state, power (the ability to get things done) is shifting quickly
    to the transnational.[39] Only a few scholars are examining the capacity and perhaps
    even the legitimacy of the system as the sole mediator between the global and
    the local, when the individual capacity of different states is unequal.[80]


    Most of us agree that the democratic ideal is political power and governance at
    all levels should involve the polis – the people. Yet, beyond the state no such
    ideals are applied.[45,81] On the international stage civil society has precarious
    few rights, it is mostly forced to request access and has only limited influence.
    There is no participatory discussion, no mechanism to seek redress. There is no
    accountability.[82]


    Normative international relations suggest that it is time to reimagine politics:
    to accommodate changes now and to discuss what we might become. This is an academic
