  md: 'Over the next year I interviewed and surveyed more than 100 NGOs and civil
    society organisations from around the world. Together we formed a series of recommendations
    for CMS to consider. In 2014, I submitted the report to CMS. With the support
    of the Government of Ghana we secured a Resolution: *Enhancing the Relationship
    between the CMS Family and Civil Society.* It established a process for CMS to
    investigate the recommendations further. The points were made and accepted, at
    least on the surface, and I was pleased to put down the marker. However, I was
    still operating within the old rules and present order. Our civil society message
    was positive, conciliatory and habitually deferential to them. Even the title
    of the resolution was soft. Inside, I wanted to thump my fists on the diplomatic
    table – to make governments hear. I had imagined the dystopian future and worked,
    stepwise, back to what we should be doing now to change it. I had sought the wisdom
    of hundreds of colleagues and together we had framed something important. But
    I had spent my career as a negotiator and NGO diplomat and I realised I wasn''t
    brave enough to say it out loud.


    So, I ran the process again, with a different group of civil society organisations
    and a different governance process. This time I focused on the Convention on Wetlands
    of International Importance (Ramsar) and worked with the World Wetland Network
    (WWN) – an amazing international collaboration of almost 2,000 small civil society
    organisations and NGOs from around the world. This time we gathered together 190
    surveys.


    Without any prompting me, the message from the CMS and Ramsar groups was the same.


    The day I submitted the Ramsar report in early 2015, I fully stepped across the
    Falk''s shadow. It was obvious what I needed to write. With the wisdom of hundreds
    of colleagues alive in my mind, and a feeling of responsibility to be a voice
    for that collective insight, I was clear that civil society needs to be organised
    and empowered, and then recognised respected as an equal at the governance table.


    The civil society shared narrative for this book was born.


    Margi Prideaux'
