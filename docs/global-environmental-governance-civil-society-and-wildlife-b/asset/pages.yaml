  md: 'Westphalia – a series of peace treaties signed between May and October 1648
    in the Westphalian cities of Osnabrück and Münster. These treaties ended the Thirty
    Years'' War (1618–1648) in the Holy Roman Empire, and the Eighty Years'' War (1568–1648)
    with Spain formally recognising the independence of the Dutch Republic.[^31]


    The Peace of Westphalia established an important precedent of peace by ''diplomatic
    congress'' – meaning officials from each of the states to agree mutual terms.
    Time progressed and this new system of political order in central Europe, became
    known as Westphalian sovereignty, based upon the concept of co-existing sovereign
    states. Aggression between states was, more or less, held in check by a balance
    of power and a norm established against interfering in another state''s domestic
    affairs. It is easy to slip into the fable that this root because enlightened
    Europeans sought peace. In truth, it took root because it provided stability for
    commerce between states.


    As European influence aggressively spread across the globe, the Westphalian principles
    of sovereignty and inter-state commerce became central to international law and
    to the prevailing world order.[31–33] Eventually they overtook all pre-existing
    systems outside Europe. A number of treaties articulated greater levels of regulation
    and control on how states relate to each other and finally influenced the creation
    of the United Nations (UN) directly after World War II, which maintains the Westphalian
    principles.[^34]


    Most international relations scholars know this truncated version of history well,
    but for other disciplines it is useful to recount only to point out that the current
    world order is recent and that has facilitated the growth of economies as the
    primary driver for international affairs.


    Even as colonised populations have thrown off the shackles of their oppressors
    in Africa, Asia, the Americas and the Pacific, these same populations have little
    choice but cast their newly independent ''nation states'' according to the Westphalian
    world order. They are then pitted against economically powerful countries that
    have had centuries to hone their systems and establish their relationships with
    the economic engine. It is no wonder they struggle.


    This is a simplistic snapshot of the evolution of the current order. I wish it
    could remain so simple, but human affairs never are. Over this same period the
    idea of sovereignty has been more clearly defined, and in seeking the definitions,
    many forms of sovereignty have been legally'
