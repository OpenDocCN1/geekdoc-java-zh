    In the next chapter I will describe more about how this might work, first it is
    important to establish the core principles that would need to be applied. Combining
    the example of Project Snow Leopard, the discussions of the previous chapters,
    useful recommendations developed by the Rainforest Foundation[^33] and IUCN’s
    Environmental and Social Management Framework[^34] with the philosophy of rooted
    cosmopolitanism, I propose three initial principles of future cosmopolitan wildlife
    governance:


    +   - building connectivity up from community landscapes, ecoregions and to biomes

    - establishing monitoring and transparency from the start

    - committing to perpetual capacity.


    # Community landscapes, ecoregions, to biomes


    The foundation principle I propose is to tune wildlife conservation to community
    landscape conservation that respects cultural identity and expression and the
    connectedness of human and non-human members of the community, and to channel
    this to international discussions.


    Building on the excellent leadership demonstrated by the Nature Foundation, the
    Snow Leopard Trust and the people of the Spiti in the Himalaya, I suggest similar
    tiers of management conduits, beginning at the village level and iteratively forming
    collective agreement at the landscape level. Once this is reached the views and
    preferences of the landscape level information are fed to ecoregional discussions,
    before being captured by biome level cosmopolitan delegations.


    David Olson and his colleagues have defined 14 terrestrial bioregions, with over
    867 terrestrial ecoregions,[^35] reflecting extensive collaboration with over
    1,000 biogeographers, taxonomists, conservation biologists, and ecologists'
