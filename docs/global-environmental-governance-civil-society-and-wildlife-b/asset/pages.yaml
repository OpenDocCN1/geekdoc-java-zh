  md: 'With these solutions and relationships, the attitude of people towards wildlife
    conservation has also evolved. Most villagers have stopped killing carnivores
    or driving them away from kills.[4, 5] It is a remarkable story of tenacious decades-long
    commitment to these villagers and these species. Indeed, in speaking with Yash
    Veer, I discovered that the Nature Conservation Foundation is coming to understand
    there may be no exit point for their involvement. The community needs their permanent
    presence to be a voice for the snow leopards.


    So, how does an NGO sustain such a commitment? This has been Yash Veer’s focus
    for a few years now. Early on, they had assumed the insurance scheme would become
    self-funded. But, inflation and the reality that the predator–prey relationship
    was changing in the Spiti, forced the Nature Conservation Foundation to reconsider.
    They now understand they will be for many years to come, perhaps even permanently.
    The Foundation has tapped into the creativity of the sub-continent possesses in
    spades, and conceived ‘Project Snow Leopard’. The programme has been embraced
    by the Indian Government as part of the National Indian High Altitude Programme,
    and with this it took a lot of work and time they developed a Management Plan
    for the Upper Spiti Landscape including the Kibber Wildlife Sanctuary based on
    the philosophy of community landscape conservation.[8]


    As Yash Veer described the management plan, I was also hearing an example of the
    longer-term role of civil society in wildlife conservation.


    He might not use this term of phrase, but Yash Veer was describing his role with
    the Spiti community as an interpreter or conduit between the community and government.
    The Nature Conservation Foundation effectively acts as a telescopic connection,
    that carries the community landscape conservation plan, up through each level
    of local and regional government, retaining the community’s connection throughout
    and into the national government discussions. It builds participation from the
    ground up, flowing from village level ‘wildlife committees’, through ‘landscape
    committees’ and finally to national level management. The Foundation has a seat
    at the table to speak for the snow leopards, alongside community representatives
    and government officials.


    The Project Snow Leopard Management Plan is profoundly different from many others
    I have read. For a start it is designed and developed by an NGO and the community.
    It inherently recognises the value and role of traditional,'
