  md: 'cultivation. Yet, the minority conservation NGOs persist in their ''command
    and control'' approach.[42]


    I can hear the howls of furious objection by conservationists in the minority
    world to these comments. But I also hear the quite thanks of conservationists
    and community leaders almost everywhere else.


    I wish it wasn''t possible to defend this statement as easily as it is. Unfortunately
    minority world NGOs have left a trail of incriminating evidence behind them.


    # Coopting funding


    An incredible power has grown in a few large NGOs, particularly in the United
    States. This problem was cracked open in 2004, when Mac Chapin of the World Watch
    Institute released a discussion paper that confirmed many of our fears and shook
    the ground under our feet. He begins:


    > In June 2003, representatives of major foundations concerned with the planet’s
    threatened biodiversity gathered in South Dakota for a meeting of the Consultative
    Group on Biodiversity. On the second evening, after dinner, several of the attendees
    met to discuss a problem about which they had become increasingly disturbed. In
    recent years, they foundations had given millions of dollars of support to nonprofit
    conservation organizations, and had even helped some of those groups get launched.
    Now, however, there were indications that three of the largest of these organizations
    – World Wildlife Fund (WWF), Conservation International (CI), and The Nature Conservancy
    (TNC) – increasingly excluding, from full involvement in their programs, the indigenous
    and traditional peoples living in territories the conservationists were trying
    to protect.[63]


    Mac Chapin bravely went to reveal a disturbing underbelly to a movement of many
    had invested our lives in. Not only was funding being fuelled to these few organisations,
    but their agendas were dictating what many local NGOs were able to work on. The
    intent of the foundations had that these big NGOs would re-grant to local NGOs,
    to ease the foundation’s paperwork, but it gave these NGOs considerable power
    over where money was directed. In dealing with local NGOs they either used their
    ‘sheer heft’ to use Chapin’s language or they starved groups out of'
