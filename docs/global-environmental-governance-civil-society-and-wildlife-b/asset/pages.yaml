  md: '# Lightning cracks


    # Southern right whales – José Truda Palazzo, Jr


    After a successful 60 million years, less than two centuries of industrial whaling
    brought the southern right whale to the edge of survival. By the 1970s fewer than
    400 individuals were thought to survive.


    Majority participation in the whale hunts was shaped and directed from far beyond
    their geographical, political and social boundaries. Indeed, the Latin American
    relationship with industrial whaling was established by North American and European
    fleets well before the 1946 Convention for the Regulation of Whaling was even
    drafted. These whalers decimated southern right whales in the western South Atlantic
    as early as the eighteenth century, and Norwegian whalers operated in the region
    during the early twentieth century. Without question, this was a minority world,
    capitalist agenda. Most of these whaling grounds were taken over by Japanese whaling
    companies in the third-quarter of the twentieth century, promoted into Japan as
    economic and food relief by the United States of America after World War II.[1]


    But against the odds, when whaling was banned and groups of committed individuals
    fought to protect ancient calving grounds from other threats, southern right whales
    slowly made a comeback. In the mythology of the conservation movement, there is
    a tendency to believe individuals were all from the ‘enlightened west’ – the United
    States, the United Kingdom and Australia. What few consciously recognise is that
    a brave few also turned the tide of political momentum for Latin America, from
    whaling and towards a deep appreciation for whales.


    Giant and beautiful, southern right whales spend their summers deep in the vastness
    of the Southern Ocean feeding on tiny crustaceans. We know little about their
    activities during this season, except that they are building'
  merge: -1
  pgno: 77
- img_proc: true
  md: 'blubber insulation from the cold and vital food reserves for their annual northbound
    migration to give birth to the next generation.


    In 1996 José Truda Palazzo, Jr, one of the southern right''s most stalwart and
    tenacious champions, floated in the coastal waters off Santa Catarina, Brazil
    waiting for the return of a few heavily pregnant whales to their calving ground.
    He was with the journalist Todd Lewan who captured the moment:


    Her bulk is black and oily smooth and tapered like a submarine. And when she crashes
    back into the sea, the spray roars up in a curtain of crystalline drops ... She
    submerges in a slow slant, then rises again, the hump of her back awash she breaks
    the surface to breathe. Up goes a spout, humid like a geyser.


    ‘For the love of God,’ gasps Palazzo. ‘She’s got to be 40, no, 50 feet long.’


    Suddenly, there is another boil in the water — a four-ton calf jumping. He leaps
