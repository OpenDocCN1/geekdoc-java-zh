  md: '# Facing the storm


    In the past four chapters I have highlighted the neoliberal path global governance
    is currently on and who is involved. Some of my reflections have been bruising,
    but hopefully fatally so. In the coming chapters I describe how we can embrace
    a rooted cosmopolitan ethic and prepare for the coming storm of change. If the
    conservation movement is brave enough to recast the way it works, we can serve
    the rise of local civil society. We can connect with local communities and provide
    them with the information they need to understand the wildlife around; to make
    their own decisions how they want to respond to their changing environment; and
    to buffer them from the external forces pressuring. We can devolve our grip on
    how conservation should be done and respond to their wisdom how to protect wildlife
    and wild places – how to protect their homes. We can facilitate these voices into
    international environmental governance and we can demand a seat for these communities
    at the governance table. We have a lot to offer. Minority world conservation NGOs
    are skilled and experienced; we have access to science; we understand the cut
    and thrust of international process.


    Like political journalists who have a press gallery ‘beat’ in Washington, Brussels
    or London, NGOs who work on MEA issues are similarly tuned. We have a depth of
    understanding that allows them to intuit what is happening and what words mean.
    We know ‘who is who’ and why discussions are moving in particular directions.
    Many of us have had this for longer than the many government officials they observe.
    Like political journalists, we have expert, detailed, valuable knowledge and they
    project as authoritative. Like political journalists, our staying power fills
    their brains with context informs all kinds of judgments. In the past, this built
    audience trust.[220] But, NGOs are now faced with a more active and informed civil
    society community. To continue in the role NGOs need to be worthy of trust and
    we need to listen to voices and perspectives other than our own.


    If we turn ourselves into messengers for communities who are free from corporate
    pressure and gripping poverty we become stronger than before. The existential
    impact of climate change will soon overtake the capacity of the current international
    system – a system that is already failing to deliver. We need nimble feet and
    committed capacity if we are to save even a fraction of what we now stand to lose.
    It is time to face the storm.'
