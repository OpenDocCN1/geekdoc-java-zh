- img_proc: true
  md: 'people in Europe, North America and Australia had already forgotten the tragedy.


    At last I stepped across into the country and directly onto a small bus that bounced
    over the rutted road of Kigali and swiftly out into the countryside. Months of
    anticipation we were on our way to see mountain gorillas.


    Hours of thin roads snaked through crop-covered hillsides. Men, woman and children
    stood conscious by the road in occasional groups. It took some time for me to
    be there there almost no-one with age etched into their face. No creases echoed
    back wisdom or experience. I wondered how a country hereof of its elders could
    cope in the world.


    The slow punctuation of one-room mud huts and makeshift yards, gave way to a denser
    rural population. Dozens of tightly grouped shanties were separated by small fields
    of sustenance crops. The earth was rich and dark. The cropping was basic human
    toil. An agrarian snapshot of most to recognise, but vicariously. Adults bent
    double, tending their daily food.


    I guilty smiled at the too-familiar scene of children chasing the bus yelling
    ''pen – pen – pen''. In my travels around the world I knew very well. Poverty
    accounted for such small towns of progress.


    In time the human density grew thicker, and people now even closer to the road.
    The casual ease of their nearness to the dangers of a bouncing, bounding bus was
    unsettling. Mothers stood in door frames with infants on their hips. Behind them,
    in, dark rooms other women bent over cooking fires.


    Hut after passed, and I sank deep into thought.


    My internal reflections were splintered as we turned into a driveway and through
    a tall gate. Suddenly we were still. At rest, in a serenely quiet compound. Large
    trees on the edge of dense woodland marked the boundary. An oasis of soundless
    shade. The children''s voices were silent echoes in my. Ahead, hushed and large,
    was our hotel.


    It was beautiful. My heart leapt in my chest as I realised that this town of people,
    tilling the soil as their ran after the bus, was a constellation around a space
    designed for wealthy gorilla trekkers. We were an island of the ''minority'' standing
    in a sea of the ''majority''.


    Was this what it meant to save gorillas? My soul ached at the thought.


    The next morning had us back in our bounding bus for a short ride to the interpretive
    centre. Earnest, educated and articulate locals explained the'
