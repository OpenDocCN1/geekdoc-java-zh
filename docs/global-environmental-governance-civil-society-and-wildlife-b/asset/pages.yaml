  md: 'The area most critical to mountain gorilla tourism lies at the centre of the
    Great Lakes region of Africa – the Virunga mountain range, shared by Rwanda, Uganda
    and the Democratic Republic of the Congo (DRC). Each of these three countries
    shares borders and a transboundary park that is broken into each country’s owned
    protected area. These are National Volcanoes in Rwanda, Mgahinga Gorilla National
    Park in Uganda and Parc National des Virunga in the DRC – the last World Heritage
    Site since 1979 and added to the sites of World Heritage in Danger in 1994.[4]
    The shared park contains about half of the region’s mountain gorilla population.
    The Bwindi Impenetrable National Park in Uganda is home to the other half of the
    mountain gorilla population.


    Rwanda, Uganda and the DRC are among the poorest countries in the world, and population
    densities surrounding the parks are the highest in the world – up to 700 people
    per square kilometre.[5, 6] There are few places that encapsulate the concept
    of the disempowered majority better than this region.


    Although the Virungas were given national park status in 1925, major conservation
    programmes only began in the 1970s, concentrating on three issues: developing
    sustainable and economically viable gorilla-based tourism; supporting anti-poaching
    programmes; and launching education for the local communities around the Virunga
    mountain range. According to a 2005 African Wildlife Foundation study, gorilla
    tourism in this region generates US$20.6 million per year in benefits, with 53
    cent benefiting the government and agencies, 41 cent international actors (including
    funders and NGOs) and 6 per cent local communities.[7]


    In Rwanda, where I visited the gorillas, the reports certainly indicate that protected
    area forests generate positive benefits, both tangible and intangible, for the
    local community. There are financial gains from the sale of products to visitors
    and some support through national and regional revenue-sharing schemes. Mike Maeda
    and colleagues reported in 2013 that the revenue-sharing scheme had disbursed
    an estimated US$1,830,000 to community projects since 2005. Ten schools had been
    constructed accommodating approximately 3,640 pupils; 88 water tanks were built
    providing water to around 40,000 people; and ten community associations were supported
    to build income-generating activities. Other community projects have included
    health facilities, local tile and brick factories, bee-'
