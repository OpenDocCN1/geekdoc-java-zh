  md: 'It achieves conservation through two elements. The first is the identification
    of key areas that are core importance for wildlife. Across the broader landscape
    they find ways for people and wildlife to co-exist, to reduce people''s dependence
    or use, so these core areas can be left for wildlife. Outside these core areas
    they find management balance between community use of the landscape''s resources
    and wildlife needs. No-one is moving; no villages are being relocated. The community
    is the root of the wildlife management plan from the start.


    Project Snow Leopard functions through decentralised decision-making. Four levels
    are identified. Discussions and decisions begin at the village or village cluster
    level, through Village Wildlife Conservation Committees. These Village Committees
    include representatives of the gram sabha (village councils) and Gompa (monasteries)
    as well as youth, women, local NGOs, the scientists and government officials.
    The deliberations of the Village Committees are communicated into Landscape-Level
    Implementation Committees that have oversight for a number of areas. The Village
    Committees have representatives in the Landscape-Level Committees to ensure there
    is consistent communication and equitable agreement. These Landscape-Level Committees
    communicate their deliberations to the national level through a Project Snow Leopard
    National Steering Committee.


    The Project Snow Leopard Steering Committee, within the Ministry of Environment
    and Forests, is ultimately legally responsible for oversight of the plan. The
    Nature Conservation Foundation has been identified as the ‘anchor institution’
    assisting the Ministry with all technical aspects related to the programme.\[18]
    It is no coincidence that it is also the Nature Conservation Foundation that is
    on the ground working with the local communities at the village level as well.
    This is what Yash Veer was referring to when he recognised there was no exit point.
    They would remain involved as this important conduit, in perpetuity, or would
    facilitate others into their role.


    The Project Snow Leopard Management Plan contains a series of recommendations
    to address the issues that the scientists have identified as important, including:


    +   - livestock depredation by snow leopards and other species

    - retaliatory persecution for loss of stock

    - excessive grazing by local livestock and migratory herders'
