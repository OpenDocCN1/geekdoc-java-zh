    # Speaking for ecosystems and the services they provide


    About 30 years ago a brilliant and insightful group of ecological economists worked
    out that the services provided by ecosystems should be described with a monetary
    value for what they contribute to the healthy function of the biosphere. Their
    intention was that damage to these services would have a reciprocal cost. I was
    first introduced to this concept by Herman Daly and John Cobb in 1995 in their
    book For the Common Good: Redirecting the Economy towards Community, the Environment,
    and a Sustainable Future. [22] By then the book was already it its second edition,
    having first been released in the eighties. Their partnership – an economist and
    theologian – produced a profound thesis that opened a generation of activists’
    minds to the flaws of the current economic order. A philosophical thread about
    community and connection ran through the pages – about how much we needed the
    natural world had failed to value it for what it provides. It was inspiring to
    read then, and it is still now.


    In 1997, another published piece of work from Robert Costanza and a large group
    of his colleagues crunched the numbers about what ‘natural capital’ was actually
    worth. I remember being stunned by the numbers and revisiting these papers back
    into my dusty and rarely opened filing cabinet to retrieve them. Thumbing through
    the folders, past faded faxes, hand scribbled notes in the margins of old photocopies,
    and articles I recall waiting impatiently for weeks to receive, reminds of how
    we processed information in that time. There was time to think, reflect and deeply
    consider implications.


    I remember these works having a significant impact on the direction of my career,
    because they revealed that the market was doing to the world. They estimated the
    economic value of the Earth’s biosphere to be in the range of US$16–54 trillion
    (recalling this was 20 years ago), most of which sat outside of the market system.
    [23, 24]


    There was much more than raw number crunching in this collective work. Herman
    Daly, John Cobb and Robert Costanza, and the tribe of economists working together
    on this project, were trying to make a point – one that has sadly been lost as
    time has moved on – that the economic'
