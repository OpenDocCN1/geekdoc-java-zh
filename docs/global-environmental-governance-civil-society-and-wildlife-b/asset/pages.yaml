  md: '– CBD, CITES, Ramsar and CMS – can respond to this agenda if they choose to
    (chapter 4).


    The notion of developing a transnational democratic culture might have been difficult
    to conceive 20 years ago. Governance by the people requires different political
    communities for different issues to be formed. Today, civil society discern organically,
    connecting people with shared views and concerns across the world (chapter 5).
    Our local understanding is changing, even now. Angel Parham and Danielle Allen
    call this our ‘socipatial imagination’. They have investigated how we imagine
    the globally distributed localities to which we have connections, and the social
    relations that are overlaid on those geographical notions in our current digitally
    age.[[22] People around the world routinely encounter the stories and appeals
    of ‘distant others’ with a frequency and intensity unknown in the pre-internet
    era. This exposure is already shaping how we think of ourselves in relation to
    these who are socially, culturally, and geographically removed from us.


    Digital connectivity supports the development of our sociospatial imagination
    in three directions. First, we can see ourselves as mutually dependent on faraway
    directions. Second, we have opportunities to share knowledge and experience with
    these faraway others. This raises our appreciation in a third direction of the
    kinds of cultural, political, and environmental goods that can be realized only
    by working collectively at the global level. These three orientations prepare
    our sociospatial imaginations to change our experience and dependency so that
    we can appreciate and understand narratives from all corners of the globe.[[22]]


    In the right hands and with the right intent, digital connectivity can provide
    rich, multilayer portraits on complex issues, cultivating conscious, globally
    oriented equitable that remains rooted in local experience. It can expand the
    boundaries of the self while also equipping cosmopolitans with tools and resources
    that help them to enter the worlds of others to more fully experience and more
    effectively interpret unfamiliar narratives. It provides an opportunity for communities
    to participate in framing directions and decisions.[[22-24]]


    Harnessing and directing this potential is important. David Held suggests that
    states should assume the role of facilitator and enabler, rather than that of
    a top-down agency, while ‘energiz[ing] a diversity of groups to reach solutions
    to collective action problems.[[25]] For wildlife and environment'
