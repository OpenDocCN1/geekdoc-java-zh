    # Rooted cosmopolitanism requires a shift to collaboration


    Bringing new voices to the table will change the dynamic and challenge the status
    quo of historical power relationship between governments. It will also shift the
    focus of which agenda are the priorities to discuss and when. Suddenly the voiceless
    will be heard. Collaborative governance is already a well-explored path and there
    is a significant amount already ready to draw upon.


    Chris Anselm and Alison Gash have developed an important model for successful
    collaborative governance arrangements that provide a useful structure for the
    ME evaluation I propose. Their model has four broad variables – starting conditions,
    leadership, institutional design and collaborative process.[45]


    Starting conditions set the basic level of trust, conflict and social capital
    that become resources or liabilities during collaboration. Power/resource imbalances
    must be addressed, and in this proposal are overcome by minority NGOs assuming
    a facilitation role for cosmopolitan biome delegations. The history of involvement
    between the actors must be transparently known. This develops the incentive to
    participate.[45] I believe this history is now well understood between the actors
    in CMS and Ramsar.


    Leadership provides essential mediation and facilitation for the collaborative
    process and is a critical ingredient in bringing parties to the table and for
    steering them through the rough patches of the collaborative process.[45, 46]
    In my proposal, leadership needs to be provided by the MEA Parties – governments
    – in assessing and permitting the entry of cosmopolitan biome delegations, as
    well as in overseeing the institutional design and maintaining the collaborative
    process.


    Institutional design provides direction to the institutional body (in this case
    the MEA Secretariat), establishes basic protocols and ground rules for collaboration,
    which are critical for the procedural legitimacy of the collaborative process.
    Access to the collaborative process itself is the most fundamental design issue.
    Participation should not be simply tolerated. It must be actively sought.[45]


    Building on Chris Anselm and Alison Gash’s design, a model for the proposed collaborative
    governance arrangements can be illustrated this way:'
