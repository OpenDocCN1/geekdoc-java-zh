  md: '# Global Environmental Governance, Civil Society and Wildlife


    The world is entering a period of unprecedented environmental and political change.
    By mid-century, climate change will cause dramatic ecosystem shifts. Hundreds,
    if not thousands, of species will disappear from the earth including icons like
    polar bears, gorillas, Asiatic lions and bluefin tuna. For many cultures ‘species’
    are ‘place’. As our cultivated global community erodes, international decisions
    about species and local ecosystems will commence and if we are not alert, these
    decisions will be made on our collective behave, without local perspective or
    accountability. Global Environmental Governance, Civil Society and Wildlife illuminates
    a clear pathway for the environmental, nongovernment community to transition into
    a co-governance role. Many NGO diplomats have deeper experience and more technical
    knowledge about policy discussions than their government counterparts and are
    unburdened by sovereign constraints. The book puts forward the perspectives of
    developing world civil society and the case that it must play a more significant
    role in future decision making. Civil society from around the world must be welcomed
    by governments at the global environmental governance table if we are to hear
    birdsong after the storm.


    Margi Prideux is a specialist in wildlife policy development. She has a PhD on
    the development of wildlife policy and law. Dr Prideux’s research focus is on
    international policy relating to migratory species conservation, regional agreement
    development, marine protected areas and the role of local and global civil society
    in ‘track one’ and ‘track two’ international diplomacy. She has participated in
    more than 20 different international processes, has worked with a number of international
    conservation organisations and has served as Marine Policy Advisor to the Convention
    on Migratory Species (CMS). Dr Prideux is the Policy Director for Wild'
