  md: '# Rain pours


    # Orangutan – Linda Irwin-Oak


    In 2012 an infant orangutan was confiscated from a villager in Southwest Aceh,
    Sumatra. The villager intended to sell him as a pet. He was two when he was found,
    malnourished, and very thin. His prospects for survival were poor. He was transferred
    to a quarantine and care centre where he began his recovery and growth.


    A year later Linda Irwin-Oak was online campaigning against palm oil. She stumbled
    on the organisation rehabilitating this little orphan. Linda is a passionate,
    deeply intelligent and tenacious thirty-something activist. She comes from an
    impressive family background of conservation and, pleased to have a way to directly
    help the orangutan and the local community, she signed up to sponsor him. For
    her, this ape signalled the beginning of a three-year connection with this little
    ape and her journey back to the wild.


    I mostly look with disdain on wildlife adoption programmes. I have firsthand experience
    running them and while I know nongovernment organisations’ (NGOs) intentions are
    usually good, over time these programmes slip into marketing exercises more than
    conservation services. Tough messages are toned down, bad news is disguised. Frequently,
    there is no actual relationship between the organisation and the animal. If you
    ‘adopt’ a wild tiger, or panda, or even a dolphin, chances that animal is part
    of an existing wild population. The organisation is legitimately campaigning to
    conserve species habitat, but it is not directly intervening in an individual
    animal’s life. I do not seek to discredit the intended conservation work in any
    way. I am sure it is noble and valuable; I wish NGOs would call it conservation.
    To label this form of fundraising ‘adoption’ is disengenuous.'
  merge: -1
  pgno: 133
- img_proc: true
  md: 'The exception to my disdain is wildlife rehabilitation and re-release programmes
    – with some strong caveats. When they are done well, with the interest of the
    animal paramount, they work. These infant orphans – most open apes or elephants
    – know every bottle they receive is coming from hands of handlers. The process
    is intensive, one-on-one care for a number of years as the animal grows, learns
    the skills needed for survival and is eventually facilitated to take back a wild
    and free life. I applaud programmes when they work with, employ and listen to
    the local community. Sadly, too often, this last step is not taken. Even minority
    wildlife rescue NGOs, who arguably have the most natural opportunity to work closely
    with the local community, fall into the destructive trap of believing their worldview
    is better, treating the local community as an impediment to overcome.


    Sately, there are few wildlife issues more tangled and complicated than orangutan
    conservation. You would think it would be simple, but the toxic mix of REDD+ and
    the money it can unlock for conservation areas, political corruption and minority
    world blindness to the needs and rights of local communities, mean that the gentle
    ‘person of the forest’, is caught in a boiling cauldron of conflict. Orangutan
    rainforest habitats in Sumatra and Borneo are disappearing at an alarming rate,
    mostly to clear the land for pulp paper and palm oil plantations. Sumatran orangutans
    may be extinct in the next few decades, and Bornean orangutans soon after that.
    The IUCN Red List has declared the Sumatran species critically endangered and
    the Borneo species endangered. It is very difficult for people outside the region
    to know how to best help.


    A key decision point for Linda was the knowledge that most of the staff in the
    centre were supported from the local villages. The local community also financially
    benefited from growing and selling the fruits and vegetables for the centre animals.
    Her assessment was that the programme was built on an equitable foundation. This
    is actually not a simple thing for an NGO to achieve and should be supported when
    they do. Linda had specifically made sure that the programme she supported worked
    with the local community, not against it.


    Rescued orangutans in rehabilitation programmes are often young and require intensive
    care in specialised sites where veterinary attention and oversight is viable.
    When they are old and healthy enough to enter the release programme they are moved
    to the release sites, their'
  merge: -1
  pgno: 134
- img_proc: true
  md: 'journey back to the wild can be supervised and gradual. Having community support
    for the programme is vital to long-term success.


    When I met with Linda in a small town in rural Australia, near where we both live,
    the 2015 fires in Indonesia were raging out of control, and dangerously close
    to the rescue centre. She told me about her motivation – the little orangutan
    was proving himself to be a survivor.


    He had regained weight, had been integrated and socialising with the other orphans.
    In his second year at the centre he started using leaves as a nest – a vital skill
    that all orangans need to have when living in the forest. He was learning cooperative
    skills, working with another orangutan to open coconuts, and had started to share
    his nest with other orphans. By the end of his second year in the centre and in
    his fourth year of life, he began to naturally wean himself off the milk every
    day. The next year he was introduced to older orangutans and learned the complex
    social skills of a bigger group. He bonded with an older female orangutan who
    taught him wider behaviours and in time became less interested in interactions
    with the keepers.


    I could see this little orangutan was tugging at Linda’s heart – he was her motivation.
    The animal she adopted was soon going into the release programme – a process that
    takes months, and even years before they are ready. But to survive, they needed
    habitat. His future home was on fire. And this is where Linda’s adoption programme
    missed a step. They kept the news flowing about the orphans who were shy about
    communicating the threat of the fires. The shame of it is that their adopters
    are a tribe of people like Linda, willing and able to join one online activism
    if asked.


    Even with the programme communicating much, Linda’s phone was swamped with pictures
    of rescuing into the fire zone and hauling animals to safety. She was doing her
    research. Spreading her own message. she felt the threat to the small orphan and
    doing what she could from a distance. It was heartbreaking. I felt it as keenly
    as she did.


    I had to meet with Linda to get some first-hand insight into the growth in online
    activism. The prism of the Indonesian fires was a poignant example to use. We
    are from two different activist generations, yet share passion about community
    and protecting wildlife. There is a familiar language between us – a vocabulary
    common to activists – but how we work and how we think is miles and miles apart.
    The difference is'
  merge: -1
  pgno: 135
- img_proc: true
  md: 'harmonious and respected by both generations, but it was a difference I wanted
    to explore.


    Activists can sustain the energy for their work through a bond with the activist
    community they join. Raging against injustice is strong glue. But, I have often
    found that activists who work at the heart-felt end of the spectrum – be poverty,
    indigenous rights, child slavery or indeed wildlife campaigns – have a lonelier,
    more difficult road to walk. Despite this she keeps a lightness of spirit that
    is, without doubt, part of her success. It is a shame her online community doesn''t
    get to meet her in person. Her eyes fire up sparkle with happiness. I admire her
    immensely.


    She has a massive network of online connections and if you didn''t know better,
    looking at her online activity you could easily mistake it for random information
    sharing. None of the rules I had been taught while working for large NGOs seemed
    to apply. Years of lecturing from professional communications taught me to ‘keep
    it light, keep it simple’, and ‘don’t post too often’. This was the model being
    used by her adoption programme. Yet, Linda seemed to be doing the opposite.


    Her primary platforms are Facebook and Instagram, so she wasn''t a direct part
    of the #Melawan Whatsapp (which predominantly happened on Twitter), but was very
    much involved with the effort to expose the corruption of the palm oil industry.
    The love and connection for the wildlife in the fires remained a touchdown through
    the months I watched her work online, but she very effectively repackaged it,
    powerfully and quickly, into a palm oil campaign. Her messages were targeted,
    frank and punchy.


    All of this effort was unpaid. Linda had no desire to work for an NGO and had
    never done so. She enjoyed her autonomy and noleness. She respected the work of
    NGOs and regarded their constraints and self-focus as an impediment. Her preference
    was for ‘free-style campaigning’. She also wanted to be able to access information
    as the source as possible. It wasn''t until I started gathering information from
    Indonesian campaigners I realised how strategic and valuable this was, especially
    at a time when shallow ‘clickivism’ generated by the bigger NGOs is being criticised
    as ineffective.


    Linda also had a strong and very solid code how she works. She checked her facts
    diligently. She documented online activity carefully, so that if'
  merge: -1
  pgno: 136
- img_proc: true
  md: 'pages are taken down she still had records. She screened who lets into her
    network and has a rigid policy about who remains in her inner group. Her office
    was her smartphone. She had honed her system so that individuals in her network
    receive specific pieces of information directly, capitalising on the fact that
    social activism information flows so swiftly that any repeats inherent in her
    system are simply absorbed. It is impressive. Really impressive. Imagine how powerful
    100 or 1,000 Lindas could be.


    As we she showed me her arsenal specific to her current focus. There were apps
    for scanning barcodes to determine whether products contained palm oil and lists
    of palm oil products. She was gathering the scant English news and redistributing
    it as fast as she could. There were a few local groups she had identified as solid
    targets for donor funds if people wanted to give. She showed me how to put individual
    messages on people''s timelines. She explained what information to be a graphic
    and why. Her message was “share with care – make sure it is real”! It was amazing
    to see the cornucopia of brands and information all collected together into a
    remarkably coherent campaign – a whole campaign in phrase. ‘One little thing can
    set off a chain reaction,’ she said. ‘It’s no just telling someone that they should
    change. You have to show them what they can do.’ meant empowering other people
    to spread the message too. She felt no sense of ownership of it, and cared little
    about whose brand profile. If the message was being spread, and multiplying as
    it went, that was a good day.


    In my mind I was struck by how many campaigns being run by hundreds and hundreds
    of organisations in Europe and North America were telling not empowering. Sure,
    NGOs are good at getting messages out, but often the ‘action’ is a plea for donation
    so that the NGO can do something itself. Sometimes it’s a plea to write to a politician.
    NGOs just can’t be nimble enough to do what Linda does – provide individuals with
    actions that are tuned to them – because often the best action for that individual
    is under the brand of another NGO. I couldn''t help chuck at how big NGOs would
    be dismayed by this free-style campaigning. They had absolutely no way to penetrate
    and dominate it.


    When I asked how many people she reached and where they were her reply was about
    layers. She hadn’t met many of her core network in person, and had no idea where
    they even lived in the world, but they were her tribe. She gave little consideration
    to national boundaries, economic'
  merge: -1
  pgno: 137
- img_proc: true
  md: 'status, language, gender, colour or religion. What was important was shared
    values about a subject. When I asked again where they came from, she replied the
    ''world''! Her reach, when it folded out through additional layers of networks
    could be as many as 500,000 people. That is an impressive number. More impressive
    that it was being fed by a solo activist in a small country in rural Australia.


    A few months after my interview with Linda I had the good fortune to communicate
    with Armet Met. It was only then that connection to Linda''s decisions about which
    NGO she supported for orangutan rehabilitation became even more relevant. Armet
    worked for a period for an orangutan adoption programme in Borneo. His motivations
    a combined love of orangutans, the wider ecosystem and the Dayak communities in
    the region. Armet''s experience was one where a number of international NGOs and
    research organisations active in the region put the interests of their programme
    above the people who called Kalimantan for countless generations. Land was taken
    from Dayak community control, without their ''free, prior and informed consent''
    to establish the orangutan rehabilitation centre.[3] I wasn''t shocked to hear
    this, but the confirmation was sad. It is simply not good enough for NGOs to say
    that the Government had given approval. NGOs should – putting it bluntly – know
    better than to game the system.


    The power of online activism cuts both ways. When I reported this to Linda, she
    responded by immediately notifying her vast network.


    *** *** ***


    # The power of connection


    If the corporate elite have motivations that need to be tempered and watched,
    and governments have no capacity, international NGOs need to'
  merge: -1
  pgno: 138
- img_proc: true
  md: 'find ways to connect with a broader sweep of civil society across the globe.
    Sticking with brands will limit the potential. But, there is hope.


    We are living in an age where new forms of cosmopolitan revolutions are already
    being trialed around the world.[4] After decades of frustration with political
    inaction, communities and activists have taken to electronic communication (social
    media platforms, blogs, video, citizen journalism sites) to mobilise change.[5]
    They are using social media as virtual spaces where individuals can learn, evolve
    and transfer cultural and social capital.[6]


    There is an explosion of analysis about the role of social activism, and its success
    or failure, as a political change agent.[7] The desire for change is not new.
    Grassroots movements have been alive and for most of the last century, but their
    nature has been different. Recent social activism has facilitated mass communication
    that has, at times, braver and more international than before. But, it must also
    be said, as a form of protest online activism is not necessarily pushing the political
    boundaries very far.[8–11] Most of the battles that have come to prominence through
    social activism remain unresolved battle grounds.


    Micah White in 2010 that online activism was undermining realworld change. In
    some respects I agree with his views, but I limit that agreement to online activism
    in the minority world. Having worked for the conservation movement I am acutely
    aware that minority world NGO campaigns are increasingly focused on ‘easy asks’
    and ‘simple clicks’, with the goal of amassed a large volume of signatures and
    hopefully a member database that can be plumbed for futures donations. Of the
    message gets lost in the quest for a high level of online ‘exposure’.[12, 13]
    Many of these campaigns are run by specialised agencies that treat the content
    in the same way they would when marketing a product. As White says:


    we find ourselves in the bizarre situation where the celebrated international
    climate change organization TkTckTck with 10+ million members and 350+ partner
    organizations – including Greenpeace, 350, WWF, OXFAM etc – is overtly run by
    Havas Worldwide, the world’s sixth largest advertising company. Havas’ clients
    include Wal-Mart, Coca-Cola, Pfizer, BP and the rest of the ones who are to blame.[14]'
  merge: -1
  pgno: 139
- img_proc: true
  md: 'White’s concerns are valid when applied to orchestrated campaigns by large
    minority world NGOs.[4] These campaigns are often about organisational profile
    and convincing the community to fund the organisation’s own professionals to fight
    the battle. It is a one-way communication, modelled on market capital. These campaigns
    do not represent genuine social movements or the use of the online networks to
    swiftly communicate messages and disseminate information, across boundaries and
    across the world.


    I concede that social activism has problems inherent in the medium. It does lend
    itself to facilitating deliberative discourses on complex, difficult issues. Yet,
    I want to make the case that judging what is happening from clickivism and tangible
    political change masks important information from view. The diffusion of the internet
    and social activism in civil society itself is not, and will never be, a black-box
    process.[155] Face-to-face communication will always be, if not more, influential
    in mobilising people to act. But mobilisation is not the totality of what online
    activism is. When used to enable people to express shared concern and understanding
    it can, draws millions of individuals together – to find each other, to collaborate,
    to learn and be intellectually empowered; and yes, some to organise and act.[9,
    13, 16–18].


    I am interested to look at the potential of this new frontier of discussions and
    networking, across borders of many kinds. There are around 280 million people
    (87 per of the population) using the internet in the United States of America,
    but this pales in comparison to China which has 674 million (49 per of the population)
    and India with 375 million (30 per of the population). Perhaps these numbers are
    not surprising, but the potential for growth in India and China is genuinely staggering.


    Brazil has an impressively large number with 118 million (58 per of the population).
    Indonesia already has 78 million people using the internet, yet is ranked 110th
    for human development by the World Bank. Compare this to Germany’s 71 million
    people online and its sixth human development ranking. Indeed, Kenya has more
    people at 29 million (63 per of the population) than Australia with 21 million
    (93 per of the population).[19]


    As connectivity numbers continue to grow in the majority world, and technologies
    continue to develop allow larger numbers of people to either receive information
    or participate in discussions, there is great potential to'
  merge: -1
  pgno: 140
- img_proc: true
  md: 'unite people from different parts of the world, and different cultural and
    social contexts, under commonly held beliefs, ideals and ideas, transcending the
    politics of the state.


    It is worth picking out a few examples to illustrate that social communication
    of information, an important element of activism, flourishing in this new borderless
    sphere. These examples are deliberately diverse to demonstrate the breadth of
    expressions and the potential to connect with populations of people not usually
    drawn into minority world environmental discourse.


    Perhaps the most profound recent civil movement – one that will live in the written
    history of our time – has been the Arab Spring. More accurately it should be called
    the Arab Revolutions and the Day of Rage. I start with this to illustrate trans-border
    social activism focused on politics. As I write, other movements are erupting
    and I am sure by the time this book has gone to the publisher there will be more.
    So, this is a snapshot in time, written from late 2015.


    # #Jan25 and the Arab Revolutions – an example of mobilisation


    phrase that is synonymous with this time in history. But the issue hashtag speaks
    to it is not new. It is the western hashtag to describe the revolutionary wave
    of demonstrations and protests (both non-violent and violent), riots and civil
    wars in the Arab world that began on 18 December 2010 in Tunisia and proliferated,
    leading to similar revolts later, in Egypt, Libya, Yemen, Bahrain and other Arab
    nations.[20] More accurately, we should call it #Jan25 – the Day of Rage.[21]


    The impetus for the protest was born of many problems – dictatorship or absolute
    monarchy, human rights violation, political corruption, economic decline, unemployment,
    extreme poverty, and a number of demographic structural factors including a large
    percentage of educated but dissatisfied youth. Increasing food prices and famine
    rates associated with climate change were very likely additional stressors that
    also contributed to unrest.[22] The protests that began in December 2010 united
    people from across political, economic, class and religious divides in opposition
    to their autocratic governments.[23]


    The Arab online campaigners are the modern incarnation of early twentieth century
    nationalist networks from this ancient and politically'
  merge: -1
  pgno: 141
- img_proc: true
  md: 'sophisticated region whose broadsheets disseminated strategies for civil disobedience
    throughout the region in the years after World War I.[24, 25]


    Egypt''s activists shifted the shared knowledge space into the ''cloud'' by witnessing,
    putting on record and imbuing political meaning to symbolic struggles against
    social injustice, harassment and censorship as part of a broader movement for
    political reform.[25-27] Although they shared a common call for personal dignity
    and responsive government, revolutions across Tunisia, Egypt and Libya reflected
    divergent economic and social dynamics. What united them under the label #Jan25
    was a shared moment to build new political institutions. Online communications
    had little to do with the underlying socio-political and socio-economic factors
    before the protest movement, but it helped coordinate the efforts of the different
    protest groups, under the one banner we now know as the Arab Revolutions.[16]


    As Ilhem Allagui and Johannes Kuebler have written:


    > If we learned leadership and coalition building from the Russian Revolution
    and popular initiative from the French Revolution, the Arab revolutions in Tunisia
    and Egypt demonstrated the power of networks ... people aligned against their
    enemy, the president, and their attitudes and beliefs changed by their political
    engagement. Suddenly, old and young found or discovered themselves to be both
    patriotic and in revolt. Some did so through the power of the communication technologies
    they used for informing and freeing themselves; others by responding to the call
    for taking to the streets. Communication technologies empowered citizens, some
    of whom used these technologies spontaneously and not strategically.[20]


    The protests shared traditional techniques of civil resistance including strikes,
    demonstrations, marches, and rallies. They also used social media to organise,
    communicate, and raise awareness in the face of state repression and internet
    censorship. Social networking pages that distributed information and content worked
    codependently with blogs, networking sites, and traditional media institutions.
    When the Tunisian Government attempted to censor Facebook pages, the activism
    group Anonymous relayed antigovernment information and provided fax bridges to
    enable news to spread despite online censorship. When governments blocked and'
  merge: -1
  pgno: 142
- img_proc: true
  md: 'censored opposition websites, internet hosts were moved to other countries.


    [20] As Manuel Castells puts it – power was shifted from the state to the ‘network
    society’.;[28]


    The most popular trending hashtags across the Arab region in the first quarter
    of 2011 were #hashtag (with 1.4 million mentions in the tweets generated during
    this period) #jan25 (with 1.2 million mentions), #libya (with 990,000 mentions),
    #bahrain (640,000 mentions), and #protest (620,000).[29]


    In the week before Egypt’s Hosni Mubarak resigned (February 2011) related tweets
    from Egypt – and around the world – ballooned from 2,300 a 230,000.[10] The Dubai
    School of Government reported that in 2011 nearly in 9 Egyptians and Tunisians
    surveyed they were using social media to organise protests or spread awareness.
    In essence, Facebook and Twitter were already enabling a discussion about a historic
    region-wide uprising.;[29]


    The spike in online revolutionary conversations preceded major events on the ground.[10]
    This is an extraordinary level of social organisation beyond state or mainstream
    control.


    The Internet Society in Tunisia reported that before the revolution there were
    million users of Facebook. Three months before Mohamed Bouazazi burned himself
    in Sidi Bouzid (December 2010) in protest at food prices and political repression,
    there had been a similar case in Monastir. But no one knew about it because it
    was not filmed. Yet, because images and video of Bouaziaz were put on YouTube
    and Facebook his action was a powerful, motivating siren. The audio attracted
    152,894 views on YouTube, most within a few days of its upload on 18 December
    2010.;[25, 30]


    Previous movements in Tunisia, when social activism penetration was low, but by
    December 2010, the news of the self-immolation of Mohamed Bouazazi spread easily
    and freely, triggering mass protests. The Tunisian revolution spilled over into
    Egypt under the banner of the Jasmine Revolution. There is no question that the
    social media platforms played a vital role in organising and publishing social
    protests. Control of conventional media made the role of new media more relevant.
    During the anti-Mubarak protests, an Egyptian activist put it succinctly in a
    tweet: ‘we use Facebook to schedule the protests, Twitter to coordinate, and YouTube
    to tell the world’[25] The movement that spread across Tunisia,'
  merge: -1
  pgno: 143
- img_proc: true
  md: 'Egypt, Libya, Syria, Yemen and Bahrain was fed quality information by traditional
    media, but gained coordination power through social media.[30]


    In 2012, a follow-up report by the Dubai School of Government investigated what
    extent individuals felt they agreed with the statement: ‘I’m more of a global
    citizen today’ (after interacting with people around the globe using social media
    in 2010 and 2011). The positive responses were remarkably high, with many people
    expressing that social media and, by association, the exposure to a variety of
    ideas and opinions, led them to become more open and tolerant of broader views.[31]


    An important element to draw from this summary of these extraordinary events is
    #Jan25 – the Day of Rage – was predominantly directed by individual activists,
    not large well-funded and staffed minority world organisations. I can’t quantify
    my hunch, but I feel certain that a traditional campaign by a large NGO could
    not have achieved that level of penetration.


    # Weibo: an example of discussion


    Pollution has become a cornerstone environmental issue in China, and for good
    reason. China is 16 of the world’s 20 most polluted cities. Coal has been the
    main culprit in annihilating China’s air quality. It is the source of as much
    as 90 per cent of the country’s sulphur dioxide emissions and half of its particulate
    emissions.


    Water pollution is also a massive problem. Overuse, contamination and waste in
    waters have produced water shortages; approximately two-thirds of China’s roughly
    660 cities don’t have enough water despite the fact that China controls the river
    water supply of 13 neighbouring countries and has dammed every major river on
    the Tibetan plateau. Some 300 to 500 million people, mostly in rural areas, lack
    access to piped water. Almost 90 per cent of underground water in cities and 70
    per cent of China’s rivers and lakes are now polluted. Combined with negligent
    semi-industrialised practices, the water crisis has turned much of China’s arable
    land into desert, which today claims around one-quarter of China’s total land
    mass.[32]


    Despite a rich historical culture of popular protest, social movements, including
    a sustained environment movement, have been absent from China’s contemporary political
    landscape.[33] Nonetheless, as technology'
  merge: -1
  pgno: 144
- img_proc: true
  md: 'has prospered, internet activism has begun to surface.[34, 35] The messages
    typically mix text with photography and video, through social activism platforms
    unique to this region – Weibo and WeChat. Online expressions are often highly
    emotional, with a subtle undertone the politics of transparency and accountability,
    and there is a growing trend for online discussion to begin online and then spill
    onto the street as protest.


    The environmental protests in Xiamen, Dalian, Shanghai and Ningbo in the past
    five years have involved intense interactions between online mobilisation and
    offline protests.[36] Leslie Hook covered an outburst of environmental protest
