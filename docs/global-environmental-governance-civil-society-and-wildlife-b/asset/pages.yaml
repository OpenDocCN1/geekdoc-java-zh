    # Tokenism


    CIVICUS (The World Alliance for Citizen Participation) reports that in many countries
    relations between the state and civil society are getting worse. This is certainly
    borne out in the experiences that José and I share Where minority NGOs have no
    relationships with majority world governments they often hire, mostly on a short-term
    basis, local activists to represent their interests either in-country for a specific
    outcome or at international meetings. [111] If these NGOs fund locals it is mostly
    to deliver materials and props to government delegations. The local activist plays
    little or no part in developing materials. They are a veneer of involvement and
    expected to portray belief in the words on the page. More often not the local
    እንደሚ fade from the scene soon after the meeting is over. During my interview with
    José he summed it well: ‘When meetings are in Africa they hire African faces,
    in South America they hire Latin faces, and in Asia we see Asian faces, but these
    people are never seen again’ [69]


    There are significant costs to this strategy. Foremost, the majority world government
    and minority world NGO partnership lacks a solid base, and is often rely on the
    minority world NGO maintaining a funding flow to the relationship and projects
    they share. It is also debatable whether these NGOs are affecting real policy
    change. Indeed, in many cases they might be hampers it. In recent years many world
    governments have become adept at exploiting the relationship with large NGOs and
    large foundations to increase funding. But, without a genuine local civil society
    component there was little or no public engagement – the projects and police risk
    poor traction to make and long-term changes. The NGOs are vulnerable to being
