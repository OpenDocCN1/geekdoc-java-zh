    # The Westphalian world order


    To understand how such a misfit as I have described can exist requires understanding
    the system in which the minority world NGOs operate, the context and what influences
    their produmes. This requires a step back in time.


    Many centuries ago the European world was carved into parcels of land and, where
    met the oceans, the adjoining sea was included as territory. Borders were agreed
    and within these borders, various systems of governance were formed – monarchies,
    dictatorships, democracies, theocracies and a myriad of formulations. These parcels
    and their governance system became known as sovereign states.


    Wars were fought. Borders were made. States were subsumed into other states. States
    divided and became new states. All the while European mercantilism, colonialism
    and imperialism stretched out to subjugate the rest of the world. Gradually, the
    international system of sovereign states we know today took shape.[28–30]


    It is unlikely that the moment happened suddenly, but many international relations
    scholars symbolically anchor the evolution to the Peace of'
