  md: 'community to forge a harmonious relationship with snow leopards (and wolves).[3]
    They have developed solutions that address their real-world problems. Rather than
    simply campaigning for a massive park to be declared and re-locating the people
    out of the region (a frequently used NGO solution), they work on better enclosures
    to protect smaller livestock. They work with the community to change herding practices
    like moving bigger livestock to areas where they are not easily preyed upon. They
    have created an insurance scheme to compensate the community when snow leopards
    (or wolves) kill livestock. They are backing these plans with sustained research
    to confirm how many snow leopards and wolf kills there actually are, and what
    livestock is actually being taken. They are also exploring new problems like why
    snow leopards take large livestock.


    At times the Nature Conservation Foundation has discovered that their science
    doesn’t match community perception. At other times their science has revealed
    uncomfortable truths, like the discovery that an increase in wild prey has not
    a decrease in livestock stocks. Because this is a partnership between the Nature
    Conservation Foundation and the community all information is shared and discussed.
    They build solutions together.[4-7] They know have decades of work ahead of them
    to solve new conundrums.


    The Nature Conservation Foundation village insurance programme is a particularly
    novel solution, designed to both offset economic losses from livestock depredation
    and to reduce the extent of depredation by providing financial rewards for anti-predatory
    solutions to herding. The insurance programme began with one village. Three years
    later, overcoming initial scepticism, the villages of Gete, Tashigang and Kee
    joined the programme. The Nature Conservation Foundation has now started a new
    insurance programme for the larger village of Chichim. More than 100 herding families
    are participating across the Spiti, and similar programmes have been developed
    in four villages in the Gya-Mir region of Ladakh as well.[4] Not only is this
    solution important in recognising that snow leopards cause significant economic
    hardship for people, but it is an instructive example that doesn’t rely on wealthy
    tourists trekking in the region. The programme creates its own financial support
    and is beautifully self-contained.'
