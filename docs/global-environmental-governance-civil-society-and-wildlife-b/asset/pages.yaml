    # Series Blurb


    The theory and practice of environmental politics and policy are rapidly emerging
    as key areas of intense concern in the first, third and industrializing worlds.
    People of diverse nationalities, religions and cultures wrestle daily with environment
    and development issues central to human and non-human survival on the planet Earth.
    Air, Water, Earth, Fire. These central elements mix together in so many ways,
    spinning off new constellations of issues, ideas and actions, gathering under
    a multitude of banners: energy security, food sovereignty, climate change, genetic
    modification, environmental justice and sustainability, population growth, water
    quality and access, air pollution, mal-distribution'
