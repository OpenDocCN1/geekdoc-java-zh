    and it is failing to address the existential, global issues of our time.


    Decades of negotiation have been invested and yet climate change remains technically
    addressed. Nuclear weapon possession is still a problem, even today. World trade
    is cementing huge inequities. The powerful continue to lord over the powerless.
    Communities are disfranchised from decisions. This book has sought to trigger
    us to ask questions about the neoliberal worldview that is creeping in dominate
    every aspect of our lives.


    I don''t suggest that we need to turn the clock back, to go without electricity,
    telecommunications, medical advances and wear ‘hair shirts’ (a common accusation
