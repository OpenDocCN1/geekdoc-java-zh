  md: '# The barometer is rising


    # A storm is coming


    A storm is coming; a maelstrom like we have never experienced before. The combined
    forces of climate change and political upheaval will play out with more of us
    aware than at any other time in human history.


    Global warming is not hypothetical. It is happening now. Wave after wave of data
    confirms it. Each of the past several decades has been significantly warmer than
    the previous ones. The period 2011–2015 was the hottest on record, as was the
    year 2015 – with an extra boost from a powerful El Niño. The record-breaking trend
    continued in 2016. Climate change is increasing the frequency and intensity of
    extreme events like heat waves, droughts and heavy rainfall.[1] The World Meteorological
    Organization Hurricane Committee reported that the Eastern North Pacific experienced
    major hurricanes (above Category 3) in 2015 – the most since reliable began in
    1971. The Accumulated Cyclone Energy, which measures the combined strength and
    duration of tropical storms and hurricanes, were about 63 percent higher than
    the 1981–1920 average.[2] India and Pakistan suffered the traumatic and devastating
    effects of heat waves right through 2015. Thousands of lives were lost. The India
    Meteorological Department has warned of heat-wave conditions still to come.[3]
    Global average sea level has risen by about 17 cm between 1900 and 2005 at a much
    faster rate than the previous 3,000 years.[4] Record rainfall led to flooding
    that impacted on tens of thousands of people across South America, West Africa
    and Europe. At the same time, unusual dry conditions in southern Africa and Brazil
    exacerbated multi-year droughts. The global average near-surface temperature for
    2015, when the core of this book was written, was the warmest on record by a clear
    margin.[4]


    The first dangerous milestone was crossed in 2013 with Hawaii’s Mauna Loa Observatory,
    a key scientific facility run by the University of'
