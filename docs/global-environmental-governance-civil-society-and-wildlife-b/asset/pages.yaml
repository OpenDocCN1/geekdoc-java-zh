  md: 'I silently, gratefully, thanked her, and we left.


    The return trek was shorter and more direct, but still took some hours and included
    many hills. At the foot of the mountain we clamoured over a rough stone fence
    that marked the boundary between wilderness fields of crops. I asked a guide what
    the fence was for. He explained it marked a demarcation between the gorillas and
    the people. Did the gorillas ever come into the croplands, I asked? He said no.
    I wondered, to myself, if people venturedपणे into the mountains. A while later
    I gently asked about the guns. He replied they were for poachers on the border.
    I knew what this meant and didn''t need to ask him. His eyes spoke of the dangers
    he faced.


    My experience transitioned somewhere in the mountains to something more reflective
    of the guides and their community. When we met the gorilla family it was tangible
    and honest. The pride the guides had in their relationship with these animals
    was real. The understanding between these young men and the silverback was their
    own. Unquestionably, these men knew each gorilla personally. I was confident that
    they shared the highs and lows of death with these animals. I suspected that they
    planned to do this work for their lifetime.


    But, I was still haunted by the fact that gorilla trekkers were being served.
    The whole scene – the village around the hotel, the guides and the gorillas –
    was for our enjoyment, like a massive amusement park for wealthy tourists. Would
    it endure if tourism stopped? Was this what it took to save gorillas?


    # Serving the minority


    At one point in conservation history, tourism funding wildlife conservation was
    new. In countries where there was little economic incentive to protect wildlife,
    conservation organisations across the world understandably turned to a market-based
    answer. It was a good answer at the time. It provided an education opportunity
    for both the local community and the tourists visiting the wildlife. Without doubt,
    awareness about the unique and often problematic conservation needs of many species
    took a massive leap forward. I commend those who developed these programmes for
    overcoming the complications and difficulties they faced. I do not question the
    motivation, the integrity or the intent of any these efforts, or'
