  md: 'Then it rained. Distant views disappeared and the world contracted to a series
    of beautiful rain-soaked trees around us. Between raindrops the air was thick
    mist, almost as if we had been transported to a cloud.


    We crouched huddled for a while. The dialogue between our guides and gorillas
    began again. The family was approaching. Two of our guides disappeared quietly
    through the curtain of rain. When they returned we were edged quietly and onto
    a tangle of vines growing from the side of a steep hill. The rain eased.


    Inept in this environment, I focused on finding a foothold and readied myself
    to scan for gorillas some distance away. When I looked up, it was directly into
    her eyes that touched my soul. Only metres away, she was one of the elders of
    the group. I could recognise so much in gaze. My mind tumbled with a complex mixture
    of guilt and awe. I was overwhelmingly grateful for the honour of meeting her
    and deeply apologetic for invading her family’s peace and space.


    To my left her family. A young mother sat happily with an infant in her arms.
    Nearby a few youngsters were absorbed in their meal, their dark heads cloaked
    in a twinkling blanket of water droplets. Further along the hill were more black
    shapes, gorillas huddled in the mist. To my right the silverback; on a branch
    he had bent to serve as a throne. He was huge. A majestic sovereign. It was indubitable
    that we were in his family’s presence with his permission. His posture clearly
    communicated the limit of this permission. Subconsciously, I registered the continuing
    dialogue he was having with our guides and would recall it later.


    A youngster rolled down from the hill above our heads, reaching out to touch my
    boot as he tumbled past – a simple, but forbidden, act for us both. His freedom
    and joy tugged at my heart. I knew the risks his family faced every day. I knew
    of their precarious survival on the slimmest edge of what could sustain them.
    I knew the risk of disease trekk brought by the poachers who sought to hunt them.


    Tears veiled when I sank into the beauty of the scene and I lost time for a while.


    A guide gently touched my shoulder – a signal to move quietly back the way we
    had come. The audience was over.


    Feeling a chasm of loss already swelling inside, I turned to go, but looked back
    at the eyes that had captured me moments ago. She blinked, held my gaze and imprinted
    a gift in my heart. It sustains me to this day.'
