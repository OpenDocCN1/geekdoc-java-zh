    Workers and Trade Unions

    Business and Industry

    Scientific and Technological Community

    Farmers


    Most accredited NGOs operate through the Major Groups process, although some also
    seek representation in their own right. Access privileges for accredited NGOs
    include limited participation in the agenda-setting process and in policy-making
    and decision-making process. Designated seats are reserved for Major Groups in
    all public meetings of the Assembly and its subsidiary organs. Accredited stakeholders
    have access to all public documents, but experience has demonstrated that many
    documents are withheld from public view by placing them under the restricted agenda
    items including financial arrangements, so transparency is never as comprehensive
    as the policies make appear. Both the United Nations Environment Programme (UNEP)
    and the ECOSOC NGOs branch comprehensive written input ahead of meetings and circulate
    this faithfully to government delegations. Stakeholders have speaking rights,
    but no voting rights.[25]


    This has been an excellent start and on the surface appears to provide civil society
    access, but in my experience governments still sit around the table as Westphalian
    sovereign actors protecting their individual economic interest. Even environment
    delegations adhere, often rigidly, to briefs developed months in advance of the
    meeting – briefs that have passed'
  merge: -1
  pgno: 118
- img_proc: true
  md: 'review by their economic and foreign affairs ministries and been developed
    with the aggressive input of economic partners. Very little that is said, by NGOS
    or other governments, sways positions during meetings.

    Consequently the gains we celebrate are very often painfully, shamefully small.


    The most recent area where Major Group participation is being facilitated is the
    High Level Political Forum on Sustainable Development (HLPF) – the main UN platform
    dealing with sustainable development, formally established in July 2013. It meets
    every year under the auspices of ECOSOC and General Assembly. The coordination
    of input to intergovernmental processes on sustainable development has been led
    by the United Nations Department of Economic and Social Affairs (UNDESA)/Division
    for Sustainable Development (DSD). Major Groups and other stakeholders have been
    granted significant participatory opportunities in the HLPF through the UN General
    Assembly Resolution: ‘Format and organizational aspects of the high-level political
    forum on sustainable development’,[26] The Resolution states that, while retaining
    the intergovernmental character of the HLPF, Major Groups representatives and
    other relevant stakeholders are allowed to:


    +   - attend all official meetings of the forum

    - have access to all official information and documents

    - intervene in official meetings

    - submit documents and present written and oral contributions

    - make recommendations

    - organise side events and round tables, in cooperation with Member States and
    the Secretariat.[26]


    UNDESA has been remarkably flexible in the interpretation of the Resolution and
    the flow of information between Major Groups and the HLPF has been participated
    in many meetings with forum delegations and the Chair of the process has remained
    committed and open to civil society participation.


    Although these commitments are positive engagement steps taken by ECOSOC and UNEA/UNEP,
    and the admirable extension from the HLPF, NGOs are still placed in the outer
    circle. Their engagement is articulated in'
  merge: -1
  pgno: 119
- img_proc: true
  md: 'principle, but the depth of engagement falls considerably short of the engagement
    rights of governments. NGOs may be able to influence governance, but they are
    not genuinely part of the governance process.


    # The current limitation of global governance for wildlife


    Underneath the UNEA, ECOSOC and the HLPF, a staggering number of inter-governmental
    organisations (IGOs) and MEAs also exist in the global environmental governance
    space. They have gradually formed over the past 40 years as governments and NGOs
    have grappled with large-scale problems that do not restrict themselves to borders
    and cannot be solved by states alone. This is the world I have worked in for the
    last 27 years, and I know very well how the ripple of decisions impact, or the
    laws and priorities at a national level. I also know very well that global governance
    is a space rife with non-decision-making. This space is notoriously disconnected
    from the results of decisions and most MEAs engage poorly with civil society.


    For wildlife concerns, the key MEAs are: the Convention on Biological Diversity
    (CBD), the Convention on International Trade in Endangered Species of Wild Fauna
    and Flora (CITES), the Convention on the Conservation of Migratory Species of
    Wild Animals (CMS) and Ramsar. There is another rich layer of dozens of regional
    agreements beneath these of these as well as important stand-alone instruments
    that sit to the side. These include 26 CMS species agreements, 17 separate fisheries
    management organisations, Arctic and Antarctic instruments, regional seas instruments,
    the International Whaling Commission, and of course the climate change negotiations.


    Almost all MEAs and instruments express a commitment to work with civil society.
    Very few actually, tangibly, do.


    # The science agenda


    Each of these MEAs is reliant on the information being deliberated in what could
    be described as a global biodiversity science network. These include the IPCC,
    the Intergovernmental Science-Policy Platform on Biodiversity and Ecosystem Services
    (IPBES), the IUCN Species Survival Commission (IUCN SSC) and CBD’s Subsidiary
    Body on Scientific, Technical and Technological Advice (SBSTTA). These science
    bodies provide important'
  merge: -1
  pgno: 120
- img_proc: true
  md: 'advice to influence the policy deliberations of MEAs and governments, and facilitate
    a suite of tools to help streamline future conservation.


    The IPCC is the leading international body for the assessment of climate change.
    It reviews and assesses the most recent scientific, technical and socio-economic
    information produced worldwide relevant to the understanding of climate change.
    Thousands of scientists from all over the world contribute to the work of the
    IPCC.


    IPBES is the intergovernmental body that assesses the state of global biodiversity
    and strengthens the science—policy interface for biodiversity and ecosystem services
    for the conservation and sustainable use of biodiversity, long-term human well-being
    and sustainable development.


    In chapter 3 I referred to IUCN as a quasi-NGO and I retain that definition, because
    also IUCN has government membership, and nongovernment membership, the decisions
    it takes are not binding on governments. There are significant sensitivities about
    this in IUCN circles, but regardless of how it is defined, it is a vitally important
    body that sits somewhere between governments and civil society.


    IUCN SSC is a science-based network of more than 10,000 volunteer experts from
    almost every country of the world. The work is divided over 140 specialist groups,
    disciplinary groups and task forces. The SSC’s major role is to provide information
    to IUCN on biodiversity conservation, the inherent value of species, their role
    in ecosystem health and functioning, the provision of ecosystem services, and
    their support to human livelihoods. This information is fed into The IUCN Red
    List of Threatened Species.


    SBSTTA is a multidisciplinary body that provides assessments of the status of
    biological diversity, assessments of the types of measures to conserve biodiversity
    and responses to questions raised by the CBD Conference of the Parties. Thousands
    of scientists from all over the world contribute to the work of SBSTTA.


    There is a connection between the MEAs and each of these major science platforms,
    but almost no formal, tangible links to local conservation efforts. If links exist
    it is through the ad hoc participation of scientists that are themselves committed
    to local conservation. However, each provides a wealth of detailed and important
    scientific information that should form a core part of environmental governance
    deliberations and also community conservation efforts.'
