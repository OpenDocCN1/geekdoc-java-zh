  md: 'My proposal does not impinge on any state sensibilities about interference
    in national law-making. As I stated earlier, states retain the same rights and
    responsibilities as they currently hold when they engage in any international
    process. They can commit, they can withdraw or they can lodge a ‘formal reservation’.
    What I propose is to develop political institutions at the global level that responds
    to rooted cosmopolitan direction and serves as a constructive supplement to the
    laws of the state.


    # Rooted cosmopolitan governance in CBD, CITES, Ramsar and CMS


    # Establishing cosmopolitan delegations


    At first glance it might seem that the cosmopolitan delegations should be modelled
    on the principles behind the Major Group process in UNEA and ECOSOC. The nine
    Major Groups are the sectors: Women; Children and Youth; Indigenous Peoples; Non-Governmental
    Organizations; Local Authorities; Workers and Trade Unions; Business and Industry;
    Scientific and Technological Community; and Farmers.[37] I have proposed (chapter
    6) that instead of separate groups according to sectors for engagement with the
    MEAs, it would make more sense to assemble according to biomes especially for
    CBD, Ramsar, CMS and CITES.


    It would be necessary for governments to first agree on what constitutes a legitimate
    cosmopolitan delegation and the diplomatic standards that must be met. This book
    has attempted to make the case that the constituency should be sufficiently broad
    to encompass a fair and reasonable representation of civil society interests from
    across a region, or if appropriate, across the globe. Once agreed, cosmopolitan
    biome delegations could be invited to self organise according to these standards.


    Governments normally sign an MEA, with a written commitment to abide by the principles
    of the MEA and the goals and principles it establishes; they are then obliged
    to reflect this intent in domestic laws. This sounds like a high bar, but in practice
    it is a fairly loose arrangement that the states often disregard. The cosmopolitan
    biome delegations could also be required to sign the MEAs and their governing
    documents to also reflect their intent, with the understanding that their commitment
    takes a different form, but is nonetheless a significant commitment.'
