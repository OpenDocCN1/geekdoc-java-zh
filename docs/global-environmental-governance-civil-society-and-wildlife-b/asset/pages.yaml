    We recommended that Ramsar invite NGO and civil society input into reporting on
    the state of wetlands, as well the wetland nomination process and inclusions in
    Montreux Record. We made the case that governments should acknowledge that a great
    proportion of the Ramsar work was being done by civil society, often with no funding
    or support. We urged Ramsar to prioritise funding and support for NGOs and civil
    society organisations that are working on Ramsar-listed wetlands.[^15]


    Ramsar did not progress during the meeting directly after we released the review,
    but this could easily be because the NGO community didn''t aggressively seek it.
    The World Wetland Network (WWN) NGOs decided to treat softly during the meeting,
    to avoid government concern about an IOP application that was being considered
    at the time. Perhaps at the next Ramsar CoP the agenda can be more forcefully
    put.


    # A cosmopolitan plan of wildlife governance


    Andrew Strauss and Richard Falk have championed a Global Peoples Assembly – a
    global parliamentary body established independently of the United Nations.[^16]
    Dieter Heinrich proposed a World Parliamentary Assembly within the UN structure.[^17]
    For me, these ideas are the ultimate manifestation of this connected political
    life. Indeed, many scholars have hoped that a worldwide, popularly elected, legislative
    assembly would be established at some point in the future.[^18–20] Until recently,
    such a prospect reek of utopianism. Yet, a question always sits in the back of
    our minds: if democracy is so appropriate in the state setting, why isn’t democracy
    just as important in the global setting?[16] In 2012 Joseph Schwartzberg published
    a persuasive roadmap for how a World Parliamentary Assembly might form[^19] and
    the release in 2015 of the Report of the Commission of Global Security, Justice
    and Governance offers a tangible hope that the dream might still come true.'
