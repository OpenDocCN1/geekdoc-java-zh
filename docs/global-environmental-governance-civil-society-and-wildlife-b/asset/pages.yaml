  md: '# Convention on Biological Diversity


    In the 1980s there was international recognition that the Earth''s biological
    resources were vital to humanity and species extinction caused by human activities
    was happening at an alarming rate. In the late 1980s, the UN convened a number
    of ad hoc working groups to explore developing a new convention. The Convention
    on Biological Diversity (CBD) was opened for signature in 1992 at the United Nations
    Conference on Environment and Development and by June 1993 it had received 168
    signatures. The Convention entered into force in December 1993.[27] CBD was important
    for its time, representing a dramatic step forward in the conservation of biological
    diversity, the sustainable use of its components, and the fair and equitable sharing
    of benefits arising from the use of genetic resources. It remains deeply impot
    today, although the complexities of what it now considers have made for a weighty
    and often impenetrable system.


    As the most persuasive international forum relating to wildlife and wild places,
    it is no surprise that many NGOs attend the full cycle of meetings, but involvement
    is always as observers and one step removed. Many of the minority world''s NGOs
    attend in their own right; other groups, such as the CBD Alliance that counts
    400 members from around the world, attend together. The CBD Alliance brings together
    civil society organisations to enable better internal communication, and to coordinate
    work with Parties and CBD bodies. The parallel Indigenous Forum on Biodiversity
    (IIFB) brings together indigenous peoples and local communities in the CBD process,
    and a close relationship exists between the two organisations.[28] But, they represent
    precious voices in a sea of dialogue, so their impact is not as great as it deserves
    to be.


    Like most UN Conventions, CBD goes to great pains to make clear that states are
    the decision-making authority and that NGOs, or indeed civil society, are invited
    to the room to listen.[29] Contributions are welcome, when they conform to the
    agreed direction. I checked again, this week, and the page has been populated
    with information. So this comment is no longer true.


    # Convention on International Trade in Endangered Species'
  merge: -1
  pgno: 122
- img_proc: true
  md: 'Discussions on the need for Convention on International Trade in Endangered
    Species of Wild Fauna and Flora (CITES) began in the 1960s. International wildlife
    trade is estimated to be worth billions of dollars and to include hundreds of
    millions of plant and animal specimens. Because the trade in wild animals and
    plants crosses borders between countries, the effort to regulate it requires international
    cooperation. CITES was drafted as a result of a resolution adopted in 1963 at
    a meeting of members of IUCN. The Convention was opened for signature in 1973
    and entered into force in 1975.


    CITES works by controlling international trade in specimens of selected species.
    All import, export, re-export and introduction from the sea of species covered
    by the Convention must be authorised through a licensing system. Each Party to
    the Convention must designate one or more management authority in charge of administering
    that licensing system and one or more scientific authority to advise on the effects
    of trade on the status of the species.


    The species covered by CITES are listed in three appendices, according to the
    degree of protection they need. CITES Appendix I includes species threatened with
    extinction, and trade of these species is permitted only in exceptional circumstances.
    CITES Appendix II includes species not necessarily threatened with extinction
    but may become so unless trade is closely controlled. Appendix III contains species
    that are protected in at least one country, and that country has asked other CITES
    Parties for assistance in controlling the trade. In the case of Appendix I and
    II species that are taken from the wild at sea and landed in a specific port,
    are ‘introduced from the sea’. A certificate must be issued by the management
    authority of the state into which the species is brought.


    There is strength in the rigour required to allow a permit to trade to be issued.
    This is reinforced by the requirement for the scientific authority of each Party
    to monitor exports of specimens of Appendix II species and, whenever necessary,
    to advise the management authority of measures to be taken such exports to maintain
    the species – throughout their range – to ensure that trade will not be detrimental
    to the survival of that species. The guidelines for the so-called ‘non-detriment
    findings’ have evolved over many years. [30]


    Not surprising, this very technical and legalistic agenda requires a high level
    of understanding for participation. As with CBD, many minority'
  merge: -1
  pgno: 123
- img_proc: true
  md: 'world NGOs participate and an alliance of NGOs does exist – the Species Survival
    Network – but membership of this network is limited to those who have the capacity
    for self participation.


    Like CBD, CITES itself make no particular effort to involve civil society more
    broadly.


    # Convention on Wetlands of International Importance


    The Convention on Wetlands of International Importance (Ramsar) is the oldest
    and the most softly spoken of the modern global intergovernmental environmental
    agreements. The treaty was negotiated through the 1960s by countries and nong
    organisations concerned about the increasing loss and degradation of wetland habitat
    for migratory waterbirds. Ramsar was adopted in the Iranian city of Ramsar in
    1971 and came into force in 1975. The governance of this culture is quite different
    and there is a significant effort to progress conservation actions, rather than
    push answer.


    Since 1999, the Ramsar has recognised a small group of NGOs as International Organisation
    Partners (IOPs), conferring an additional participation status to the groups:
    Birdlife International, Wetlands International, IUCN, the World Wildlife Fund
    (WWF), the International Water Management Institute, and the Wildfowl and Wetlands
    Trust.[31, 32] An important element of the IOP relationship is agreement that
    both the Secretariat and the IOPs have a responsibility to maintain the relationship
    and the implicit expectation that progress will be reported. This is evidenced
    in the Memorandum of Cooperation between the Ramsar Secretariat and the IOPs in
    2011 and the reports to the Ramsar Standing Committee in 2006 and 2011.[33–35]
    IOPs play an active role, able to contribute directly to discussions and meetings.
    They also work together to produce statements from the IOPs as a group and are
    members of the Scientific and Technical Review Panel (STRP).


    In practice the IOPs often act as facilitators between governments, donors, foundations
    and other bodies and they can, upon request from the Ramsar Secretariat, intervene
    on its behalf at specific meetings where/when the Ramsar Secretariat can’t be
    represented. Importantly, the IOPs provide advice and recommendations on Ramsar
    processes such as the'
  merge: -1
  pgno: 124
- img_proc: true
  md: 'Montreux Record – wetlands where an adverse change in ecological character
    has occurred.\[36, 37]


    Ramsar’s recognition and involvement of the IOPs is progressive and very important,
    although it is key to recognise IOP status is restricted to large international
    NGOs.


    # Convention on the Conservation of Migratory Species of Wild Animals


    As a further response to drastic biodiversity declines and a recognition that
    cooperation was needed between states for the conservation of species that cross
    national boundaries, the government of Germany enlisted the legal experts of the
    IUCN’s Environmental Law Centre in the 1970s to produce the text which formed
    the basis of negotiation for the Convention on the Conservation of Migratory Species
    of Wild Animals (CMS). The Convention was adopted in Bonn in 1979 and came into
    force in 1983. Migratory species threatened with extinction are listed on Appendix
    I of the Convention. Migratory species that need or would significantly benefit
    from international cooperation are listed in Appendix II and the Convention encourages
    the Range States to conclude global or regional agreements for their conservation.
    In this respect, CMS acts as a framework convention to develop conservation models
    that are tailored to the conservation needs of a particular species or group of
    species across their migratory range.\[38]


    CMS’s relationship with NGOs has been similar to Ramsar in that it pursues partnerships
    with NGOs and assures them of access to key meetings including the Standing Committee
    and the Scientific Council,\[39\] but it is not on CITES and CBD in other areas.
    Governments maintain a firm posture of control and many NGOs have found the partnership
    status meaningless in practice.\[140\] However, there are signs that CMS may be
    prepared to transform.


    # Can CMS be the first to evolve?


    In 2013 CIVICUS conducted a multi-dimensional survey of civil society engagement
    with ten IGO processes: the Food and Agricultural Organization of the United Nations
    (FAO), Office of the High Commissioner for Human Rights International Labour Organisation,
    United Nations AIDS Programme, United Nations Development Programme, United Nations
    High Commissioner for Refugees, United Nations Women,'
  merge: -1
  pgno: 125
- img_proc: true
  md: 'The World Bank Group, the World Food Programme of the United Nations and the
    World Trade Organisation (WTO). The resulting CIVICUS message to IGOs and governments
    is that there is a need to move away from the state-centric model of international
    governance towards a citizen-oriented model. Their recommendations mirror my own
    research findings for Ramsar and CMS,[19, 21] New approaches to representation
    and involvement should be explored. IGOs should consider their ability to respond
    and achieve progress on issues identified by people rather than governments, and
    to especially make their decision-making processes more open and democratic. Efforts
    should be made to give civil society delegations a legitimate seat at the table.
    Civil society involvement should be inclusive of broader worldviews, and not limited
    to organisations that bring financial resources to the process. New media, including
    mobile, social media and video streaming, should also be used to encourage participation
    and the exercise of social accountability. In order to strengthen civil society
    participation, greater outreach should be offered and dedicated spaces for civil
    society participation established, with civil society helping to define and govern
    these, with funding earmarked to enable broad civil society participation. Most
    importantly, efforts should be made from the local to the global level to ensure
    that the practical realisation of civil society rights is enshrined in various
    international treaties and agreements.[19–21, 41]


    Such steps require reciproc. NGOs and civil society organisations should make
    influencing global governance institutions a programmatic priority. This will
    require considerable levels of information sharing and peer learning. The larger,
    better resourced NGOs with an established presence in key IGOs should take the
    initiative to democratise the space they hold and involve a wider range of civil
    society groups in engaging international governance institutions, including by
    sharing their organisational accreditation and financial resources,[19–21, 41]


    CMS and Ramsar provide a conservation policy framework for nearly 600 migratory
    species, 29 regional species agreements and over 2,000 wetlands of international
    importance. CMS has 124 contracting Parties with additional governments participating
    in the 26 regional species agreements that have been concluded under the CMS umbrella.
    Ramsar has 169 contracting Parties. Both conventions benefit from strong majority
    representation and commitment.'
