    # Perpetual capacity


    The third principle is that cosmopolitan wildlife governance needs to be adaptive
    and perpetual. This requires continual capacity in community landscape conservation
    management committees and conservation science programmes.


    Funding should be directed to civil society and local communities to strengthen
    their capacity and ownership of conservation activities. Active conservation science
    designed to deliver systematic, transparent, independent monitoring and evaluation
    of conservation projects is also vital.


    The final element of this principle is that partnerships between NGOs and local
    communities need to be invested in. Trust needs to be built so that NGOs can serve
    as conduits and advocates for the community.


