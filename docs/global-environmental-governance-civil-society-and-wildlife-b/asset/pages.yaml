  md: 'many of whom have a longer history of direct experience with key environment
    conventions and more technical knowledge about the issues being discussed than
    some of their government counterparts.[70, 106] Much of their diplomacy is focused
    on leveraging transboundary or ‘borderless’ information into the essentially state-based
    system of international governance, but their conception of public diplomacy[101]
    is more in tune with the social reality of vanishing borders between domestic
    and international.


    When these professionalised NGOs operate as rooted cosmopolitans, working as part
    of transnational civil society networks, learning and being influenced by others,
    there is considerable strength. They increase the power and resources of otherwise
    marginalised voices.[88] Sadly, this type of partnership is rare. Often not than
    minority world NGOs choose to operate as autonomous actors serving the mandate
    of their organisation and the existing global neoliberal power structure. They
    join the positioning reinforces their own construction of nature, the environment
    and human relationships with them, silent differing interpretations and viewpoints.[107]
    These transnational elite control funding and policy directions, discipline populations
    into accepting condition attached to aid and support, including a neoliberal market
    acceptance. They serve a limited, toothless version of environmentalism that ignores
    the colonial debt of historical resources harvest.[88, 107] Unlike the rooted
    cosmopolitans above, these actors learn from others and instead substitute communities,
    including the non-human animals members, in their quest for a homogenised world.
    To borrow from Thomas Berry cease to be a ‘communion of subjects’ and become a
    ‘collection of objects’.


    Cosmopolitanism responds to the knowledge that there are issues we must grapple
    with the capacity or the powers of states. It provides the principles of building
    democratic culture from the local to the global – to be a conduit for local information,
    through the layers of national process and in global governance.[82, 109, 110]
    Like many international issues, current MEAs are deficient along what David Held
    has called the democratic fault lines of inclusiveness and accountability.[82]


    My thesis is that we must expand political authority beyond the commonly held
    idea of sovereignty and nation states to include a greater'
