  md: 'Once the cosmopolitan biome delegations have signed the MEA, and are given
    approval by the MEA administrative processes, their engagement would be facilitated
    in the same way that any government currently engages. This is where the proposal
    for the the cosmopolitan biome delegations differs dramatically from the UNEA
    and ECOSOC Major Groups format. The objective is for these delegations to have
    a formal seat at the table as equals – not as observers at the back of the room,
