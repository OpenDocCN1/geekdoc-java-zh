    It was a hot and muggy day in November 2005. I stood in the terminal of Kigali
    Airport, Rwanda, my energy frayed. Seven days of intense intergovernmental discussions
    in Kenya had taken a toll. The organisation worked for boldly and optim reached
    for recognition of nongovernment organisation (NGO) work in conserving wildlife.
    Our case had been months in careful preparation and I had rolled up my sleeves
    for the contest.

    In honesty, I still went expecting defeat. Governments don’t usually like to recognise
    that NGOs contribute much value to the world. I was still reeling from the unexpected,
    incremental, success and hadn''t adjusted my disbelief yet. It was surreal to
    be standing at the border to Rwanda; like moving from one waking dream into another.

    Border control ushered through all my colleagues from Europe and North America
    without delay or question. Here, I was with my Australian papers, a headache and
    exhausted legs that were threatening to crumble beneath me at any moment. An eternity
    seemed to pass with each page turn. Never before had a passport been so studied.
    I was tired.

    Rwanda was then and now a country deep in unimaginable pain – slowly adjusting
    to being demographically young, after the massacre of its mature and wise population
    just 11 years earlier. During the Rwandan Genocide 500,000–1,000,000 Tutsi were
    slaughtered by their countrymen between April and July of 1994. This was probably
    20 per cent the country’s total population and 70 per cent the Tutsi then living
    in Rwanda. Coverage of the Rwandan civil war and the genocide received a few mentions
    through international media, but it was a war half world away for many. As I stood
    at this fragile county’s border I knew that many'
  merge: -1
