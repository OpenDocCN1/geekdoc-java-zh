  md: 'California measured a carbon dioxide (CO₂) concentration in the atmosphere
    at over 400 parts per million – around 40 per cent higher than before the Industrial
    Revolution and higher than any time in human history. This milestone was the trigger
    for me to begin thinking about this book. The year 2015 was the impetus to start
    writing. As I write, news has been released that atmospheric CO₂ concentration
    of the entire southern hemisphere is now at or above 400 parts per million, much
    earlier than the experts predicted. Casey Station on Antarctica exceed 400 parts
    per million on 10 May 2016.[55] The last time CO₂ levels were high, some three
