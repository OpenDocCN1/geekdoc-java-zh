  md: '*** *** ***


    I think back to my trek to see gorillas in Rwanda and the gorilla who held my
    gaze and touched my heart.


    In many ways she is my guide through the metaphorical storm of this book.


    I imagine that I am standing on the edge of a field of golden wheat, watching
    the sky. It is big and blue. The breeze light and cool. The sun shines and it
    is easy to presume it is by this way tomorrow.


    The gorilla sits alone, surrounded by the gentle swaying stalks. An idyllic scene.
    She seems contents.


    As I watch, deep grey clouds slide towards us, gliding on a pane of glass. The
    air becomes heavy and heavy. The clouds advance the light dims.


    I imagined gorilla is unsettled. Occasionally she glances up. Something is happening,
    but she is not sure what is wrong.


    I ache that she is so vulnerable.


