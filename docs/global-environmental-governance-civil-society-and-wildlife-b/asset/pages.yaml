  md: 'Over the past three decades, a wide group of NGOs have demonstrated a considerable
    commitment to all four of the MEAs. For the most part, CBD and CITES keep their
    NGOs at arms length. Ramsar and CMS have both sought a slightly closer relationship.
    While CBD and CITES continue to enjoy considerable loyalty and profile generated
    by NGOs, it is Ramsar and CMS that have grown accustomed to informally using the
    services of NGOs for certain activities. For a time this was acceptable, but recently
    NGOs have come to feel that their commitment has not been matched, in their view,
    by an institutional commitment within Ramsar or the CMS Family (the parent convention
    and the 26 species agreements) to implement progress.[[20]


    To discuss this view I organised a ‘Civil Society Dialogue’ in the margins of
    the Tenth Meeting of the Conference of the Parties to CMS (CMS Co10) in 2012.
    It was apparent to those participating in the dialogue NGO commitments to the
    CMS Family were not well understood by CMS Parties and that NGOs could be more
    effective contributors if facilitated in doing so.[20] A subsequent review process,
    in 2013, comprehensively engaged with around 100 wildlife NGOs from around the
    globe. The review sought to better define the relationship between NGOs and CMS
    in its present form in order to contribute to enhancing that relationship into
    the future. The NGOs came from minority and majority world perspectives. They
    included organisations that worked closely with the CMS Family right through to
    critics challenging CMS and its effectiveness.[20]


    I conducted a similar survey through the World Wetland Network and the broader
    wetland conservation community in 2014. The 190 wetland NGOs and civil society
    organisations involved also came from minority and majority world perspectives.[21]


    These two processes were important measures, and both provided similar results.
    In summary, NGOs from around the world understand that involvement has a cycle:
    that they must commit to, and participate before and during Ramsar and CMS processes
    to raise the profile of species issues, such as threats, species conservation
    status, linkages to other MEAs and the impacts of other decisions. They respect
    that these discussions and accords. They know that they may be needed for on-ground
    implementation and support may them prepare for this developing close working
    relationships with governments as well as seeking funding to'
  merge: -1
  pgno: 127
- img_proc: true
  md: 'facilitate work before, during and after meetings. NGOs judge the value of
    Ramsar and the CMS Family on implementation of the commitments made by governments,
    the number of meetings that have been held or plans that have been developed.[19,
    21, 40]


    Both reviews found that there is significant scope for NGOs to provide specific
    types of implementation activity, especially where priority taxonomic or geographical
    gaps are identified or capacity building is needed in developing regions. NGOs
    would welcome a more structured and systematic long-term approach to joint planning
    (and evaluation) so that they could better contribute to Ramsar and CMS implementation.


    This is a significant offer from civil society, especially when the practicalities
    of state capacity are acknowledged. During CMS CoP11, more than half of the assessed
    59 Party reports identified a need for financial support to address their commitment
    to CMS; 27 identified a need for capacity building/knowledge exchange, 23 for
    technical or material support, 18 for scientific support and 11 for regional or
    international cooperation.[42]


    NGOs have voiced and demonstrated a willingness to step into capacity breach,
    offering an opportunity to increase the human resource and financial effort in
    support of CMS and Ramsar. But, it is clear that progressing greater collaboration
    in Ramsar and the CMS Family requires a new dynamic to be created where NGOs contribute
    more systematically, consistently and transparently to the work of these two MEAs.
    Their work must influence directions. Their views must be legitimately heard.
    Both reviews emphasised that NGO contributions need to be codified and accepted
    as a contribution against an agreed plan so that governments recognise the value
    and build this work more fully into the progression of the Ramsar and CMS agendas.
    NGOs should be able, for example, to formally represent their own work and have
    that work accepted and acknowledged as a contribution.[21, 40]


    It is clear that progressing NGOs and governments working together requires active
    dialogue, mutual transparency and accountability, trust building and the development
    of a shared understanding.[43–46] The tacit agreement underlying any increase
    in NGO commitment will be that – once policies are established, implementation
    will follow.[20]'
