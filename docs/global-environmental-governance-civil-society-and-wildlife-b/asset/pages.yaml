    # New opportunities


    I have tried to demonstrate that the very essence of the internet and social activism
    is its ability to network; to reach those who are usually unreachable. Yet, the
    potential to network individuals or groups will not be harnessed unless users
    themselves engage in networking activities. Networking should empower civil society.
    Participatory action should not be ‘manufactured’ or ‘captured’ by politicians,
    minority world NGOs or elites seeking to use it for their own ends. It decentralise
    knowledge and enable knowledge sharing.[15] Where participatory action has occurred
    but turns out to be simply legitimising decisions perceived to have already been
    made by powerful actors, the trust deficit is significant.[53] Engaged people
    benefit from a thickening of alliances and relationships, which in turn can strengthen
    their participation.[53]


    What interests me most about these examples, and numerous others not mentioned,
    is that people are becoming attuned to thinking about what someone else, somewhere
    else, is, saying. They are connecting with like-'
