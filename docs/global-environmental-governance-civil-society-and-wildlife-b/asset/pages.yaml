    Governance is inevitably a long-term process. It requires a commitment to layers
    of procedure and consultation. The challenge is to evolve long-term institutionalised
    decision-making processes to be systematically influenced where there is no organisational
    structure to aggregate people’s opinions.[17] There is a need to network participation
    and widen the involvement, to capture the views of organisations and communities
    who are ultimately the beneficiaries of the governance.[55] The internet does
    not solve all obstacles to collective action, but it can provide a networked infrastructure
    and tools for organising, coordinating and campaigning. Indeed, technically skilled,
    and sometimes resource poor, actors can take advantage of networked collaboration
    to discover, learn about and challenge policy-making.[56] The internet and social
    activism has to be appropriate so it helps create relationships between individuals
    and the civil society movements in which they participate.[115] These concerned
    groups should be deliberately – and strategically – facilitated to contribute
    to cosmopolitan governance.


    As we look into the approaching storm, we can garner strength about what is to
    come with our knowledge that technological age connects us across the world. We
    can, if we choose, agree to work together, to share goals and aspirations, and
    learn from each other’s experiences. But, we need the international governance
    system to evolve to allow for organic and adaptive cultural expressions of conservation
    and protection. This requires leaders who allow our voices to be heard against
    the wind and rain as it lathes around us.


