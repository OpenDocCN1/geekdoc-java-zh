  md: 'issues, at least, I believe this enabling governance should continue to be
    facilitated through CBD, CITES, Ramsar and CMS and that these MEAs should be evolved
    into inclusive and broadly representative global decisionmaking channels.


    NGOs are now recognised and consistent observer participants in these MEAs.[26–30]
    The significant step forward from this current arrangement would be for a representative
    delegation to be formally at the table, as a conduit to convey local voices on
    matters that directly affect them. This would require an alliance of local civil
    society (community landscape conservation bodies) that share a perspective on
    an issue. This is unashamedly a rooted cosmopolitan proposal – a radical localisation
    of power and authority. Forming such alliances overcomes the democratic accountability
    legitimacy concerns about NGO participation, that representation is on behalf
    of a clearly defined group and doesn''t extend to speak for all civil society,
    everywhere.[29, 31] I advocate that individual community programmes should combine
    across regions to form a series of cosmopolitan delegations. These delegations
    should have input in the international law-making process, with formal standing
    and a vote. My proposal does not imply any state sensibilities about interference
    in national law-making. States would retain the same rights and responsibilities
    they currently hold when they engage in any international process. They can commit,
    withdraw or lodge a reservation.


    Establishing these new delegations in CBD, CITES, Ramsar and CMS would be the
    smoothest process for NGOs to create. These MEAs retain the best of what we have
    – the structures and iterative process of conservation decisions. The caveat is
    that NGOs would need to play a brave and central role as conduits and advocates,
    representing local community voices. I do not advocate for international NGOs
    to gain more individual power or a seat for self-representation.


    Anthony Burke, Stefanie Fishel and their colleagues have proposed an Earth System
    Council, with representation of Earth scientists, major ecosystems (the Amazon
    basin, the Arctic and Antarctic, etc), species groups, and states as a new level
    of governance with similar standing to the UN Security Council. Their proposal
    acknowledges that the Earth is shared by human communities and a huge collective
    of non-humans who also have a right to existence. We are entangled. No being truly
    autonomous or separate and we ignore the destruction of our severance from the
    non-'
