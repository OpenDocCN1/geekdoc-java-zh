  md: 'identified, each with its own rules and norms. In its simplest form Westphalian
    sovereignty is about the authority and legitimacy of the state, and the exclusion
    of external actors, whether de facto or jure, from the territory of that state.
    When states are focused on exercising their authority on the population they govern,
    they are engaged in domestic sovereignty. When recognition is extended to territorial
    entities that have formal jurid independence, it is called international legal
    sovereignty. When states regulate movements across their borders, it is called
    interdependence sovereignty.[35] I mention all of these to be clear that the world
    has evolved since 1648, and the rules have had to evolve with it. The evolution
    has still encompassed the basic principles that the states are in control, and
    their priority is to gain economic advantage and maintain national security to
    protect that advantage.


    The Westphalian world order has not evolved because diplomats are all inherently
    selfish. Our world emerged through the political negotiations in the 1600s, long
    before there was recognition of the need for collective actions.[32] Between Westphalia
    and now we have facilitated expanding capitalist production across the globe,
    by strategic integration between banks and industry, the export of capital, accelerated
    technological innovation, now a permanent military economy, the growth of transnational
    corporations and the expansion of credit, with resultant global indebtedness.
    The corporate actors involved in this dance have risen to prominence through neoliberal
    privileged access relationship they hold with states.


    Obviously there is more to life than protecting borders and making money. There
    are global norms that we all share about human rights and dignity; the myriad
