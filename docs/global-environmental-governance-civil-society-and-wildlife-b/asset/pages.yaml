  md: 'minded individuals despite traditional boundaries. They are becoming accustomed
    to messages outside of the normal channels we use – formal political process and
    the media. They are operating as rooted cosmopolitans.


    Jill Hopke identified two mutually supportive but separate ways the activists
    communicated through online twitter. Twitter and Facebook serve as real-time curated
    and episodic news feeds, by hashtag indexing, allowing both activists and more
    casual tweeters to engage with the day of action-in-the-moment events took place
    in widely disparate geographical locations on a transnational scale. The activists
    communicated and reported in more detail in longer-term, organised structures
    of closed listservices. She identified that listsservers (or websites) helped
    the movement to persist over time and space by enabling activists to enhance trust
    in diffused networks. They used the listsservers (or websites) to make sense of
    complex scientific and technical information, as well as to connect with experts.[54]


    Social media platforms are themselves grappling with what this all means. During
    the Arab Revolution, technology firms ‘leaned forward’ with new tools or applications
    introduced to serve an ever public (and in doing so, capture market) such as Google’s
    speak-to-tweet service, an application designed to translate voicemails into tweets
    that was used by the activists as a means of bypassing Mubarak’s Twitter blockade.
    Several tech firms built dedicated portals to allow in-country users to share
    content. Others, as Facebook, responded poorly – working against the campaign
    by shutting down one of the protest-group pages because they used a pseudonym
    to avoid government harassment. Supporters persuaded Facebook to reinstate the
    page, but the incident showed how businesses such as Facebook, YouTube and Twitter
    may not fully appreciate the way in which their world users engage with these
    tools as public-information infrastructure and not as ‘cool’, minority world applications
    in the service of personal amusement.[27]


    Of course, we should remain critical and of implying cyber-utopianism or ‘internet
    connectivity’ and should remain alert to how a given technology might negatively
    affect a network or group. Internet and social activism are not detached from
    daily lives. Scholars should continue to debate the extent to which social activism
    facilitates actual action. These discussions are worthy, but are not my core focus.
    My interest lies in'
