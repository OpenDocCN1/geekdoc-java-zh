    in international protests campaigns.[101] This was packaged in the 1990s by Margaret
    Keck and Kathryn Sikkink as ‘activists without borders.’[91]


    I am compelled by the reality that the world has changed. Very few communities
    are truly isolated now. Information and ideas flow powerfully around the world,
    with little impediment or control.[102] It is virtually impossible not to know
    about the diversity of humanity. If we don’t consciously empower communities,
    as for individual voices to be expressed, we risk the very that cosmopolitan critics
    fear – homogenised culture driven and fed by an elite.


    Evaluating stories together is one of the central ways of learning to align our
    responses to the world. Alignment of responses is, in turn, one of the ways we
    maintain the social fabric, the texture of our relationships.[100] By empowering
    the voices of local, traditional and indigenous people and their often broader
    perspective about who is within their community, including in many cases non-human
    animals as well[55] – providing them the space to use ‘a reflective openness to
    the new with a reflective loyalty to the known’ – ecologically informed management
    strategies can be formed.[188] The points of entry to these cross-cultural complex
    conversations are things that are shared by those who are part of the conversation.
    They do not need to be universal; all they need to be in common.[100]


    In my experience, and that of some scholars, many civil society networks engaged
    with environmental concerns already ascribed to a form of rooted cosmopolitanism[88]
    – these are many individuals, more commonly involved in domestic politics or movements,
    who reach beyond their base to join an international network.[101] They regularly
    ‘meet’ either physically or electronically. They share information and draw on
    international materials from webpages, reports, discussions forums and journals
    to pursue mutual'
  merge: -1
