    My work contributes to the normative international relations tradition as engaged
    scholarship.


    nOccupying Richard Falk’s shadowland has inspired this book and the metaphor of
    a storm that carries the thread from this chapter to the end. My overriding intent
    is to tell the story of my own professional journey and the often bleak conclusions
    I have personally come to at this unique and important point in human history.


    nI follow the academic conventions of fair description, analysis and argument.
    I believe in them. I want, above all, not to disparage the lifelong efforts of
    many who have advanced the various disciplines I skim over everywhere I have worked
    for wildlife conservation. I respect everyone’s integrity, commitment and keenness
    of insight. Yet, I am moved by Herman Daly and John Cobb who, in 1994, wrote:


    > [it was hard] to suppress the cry of anguish, the scream of horror – the wild
    words to express wild realities. Human beings are being led to a dead end – all
    too literally. We are living by an ideology of death and accordingly we are destroying
    our humanity and killing the planet.[111]


    I cannot find better words to express what compels me to write. Complex ideas
    are often best illuminated by real world stories. I offer mine while I discuss
    how we can carve out an alternative for our future.


