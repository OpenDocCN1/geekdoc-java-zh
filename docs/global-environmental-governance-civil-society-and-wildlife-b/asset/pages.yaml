  md: '# # 6 Through the storm


    # Snow Leopards – Yash Veer Bhattnagar and Kulbhushanshing Suryawanshi


    The small Buddhist town of Kibber, in the Spiti Valley of northern India’s Trans-Himalaya,
    offers important insights about a new role for nongovernment organisations (NGOs)
    as conduits between government and the community.


    Finding effective ways to conserve large carnivores is challenging in almost every
    region of the world – in the Himalaya large home ranges and the threats the animals
    themselves pose to livestock makes coexistence with humans difficult. In other
    parts of the world, programmes designed by minority world NGOs have tended towards
    a command and control approach – hunting bans, eco-guards and pushing communities
    off their land. This worldview causes conflict and understandable resistance.
    In many cases it is ethically bankrupt. In this wild Himalayan region the Nature
    Conservation Foundation in India, working closely with the international Snow
    Leopard Trust, has walked a road less travelled. Their path has been informed
    by their experience with snow leopards and the rugged, noble people who live alongside
    them. This example illustrates a way out of the conflict with morality and grace.


