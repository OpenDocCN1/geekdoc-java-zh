    garner even more power.[1546-60]


    # Blinded by our own pride


    Through these three decades, minority world NGOs have developed a layer or arrogance
    that matches their major funders. From the safety of Washington, Brussels or London
    they believe their wisdom is sufficient to encompass the world. Franchising their
    global brands, they have manoeuvrred themselves to capture the flow of financing
    and support, crowding out majority world voices.[61]


    In the previous two chapters I levelled the accusation of nepotism, corruption
    and self-interests at governments and corporations. But, we are all part of an
    international system that no longer works, and neoliberal environmentalists and
    some philanthropists also contribute hubris to the failing mix. It is conceived
    to presume that majority world perspectives are simple, unsophisticated or small.
    Indeed, the economic standing of a country in the global community rarely reflects
    the sophistication of its citizens. Where communities and indigenous peoples have
    secure tenure they are often the most capable custodians of the planet''s natural
    capital. A review of 130 local studies in 14 countries, conducted jointly by the
    Rights and Resources Initiative and the World Resources Institute, found that
    community-run forests suffer less deforestation and store more carbon than other
    forests.[62] This evidence contradicts decades of conservation thinking, which
    has believed that forest communities were widely responsible for deforestation
    through shifting'
