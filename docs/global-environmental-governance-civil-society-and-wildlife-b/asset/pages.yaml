  md: 'pulpwood and palm oil giants have been burning tropical rainforest, opening
    up massive peat swamps and installing extensive networks of canals across Indonesian
    and Malaysian forests for decades. Their effort is concentrated in Sumatra and
    Borneo. Peat canals lower the water table and dry out the land. Fires burn in
    areas where they would never naturally occur, smouldering for weeks in underground
    peat deposits.


    Plantation clearance activities are the largest sources of carbon pollution in
    the world today. The World Resources Institute estimates that the 2015 Indonesian
    fires produced more carbon pollution than the emissions from the whole of US economic
    activity over the same period. By the end of October 2015 emissions had reached
    1.62 billion metric tons of CO2 – bumping Indonesia from the sixth-largest emitter
    in 2015, up to the fourth largest in six weeks.


    Indonesia already provides 52 per cent of the world’s palm oil supply, and with
    investment from Malaysia and Singapore the country aims to continue be the world’s
    largest supplier of the commodity. Almost 11 million hectares of palm oil plantations
    – owned by Indonesian, Malaysian and Singaporean companies – are exporting 33
    million tons of palm oil, reaping revenues of US18.4 billion in 2014. Indonesia
    further plans to allocate hectares of land for agricultural development, including
    9 million hectares for smallholders that include palm oil. So, just as Singapore
    and Malaysia share the profits of Indonesia’s palm oil, so they share the responsibility
    for fire and haze.[4] Linda, and many activists like her, argue that manufacturers
    using palm oil in products must also share responsibility, along with consumers
    of the processed foods and household products that use this cheap and poorly regulated
    oil source.


    The big palm oil companies have engaged in marketing spin, suggesting the blame
    for the fires mostly with small farmers and villagers. In truth, a number of actors
    – large and small – are involved in burning land and forest, including communities
    whose forest-dependent livelihoods have been disrupted by plantation development.
    Because of complex and profoundly unjust land tenure arrangements in Indonesia,
    they are forced to clear new land to survive, but theirs is a small contribution.
    Large corporations leveling blame in their direction is profoundly unjust. It
    is corporations in close cooperation with the Indonesian, Singaporean and Malaysian
    Governments that are complicit in complex patronage networks and tiered revenue
