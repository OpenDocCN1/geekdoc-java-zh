    MEAs must also adapt to welcome NGO/civil society delegations at the table of
    global environmental governance to provide input into the law-making process with
    formal standing and a vote, and as much right to direct the administrative support
    for the MEAs as any government has.


    This two-part precondition is as important as the three core principles.


    # Imagine another future


    Traditional governance approaches are proving incapable of addressing the changes
    we face[32, 39]. They have led us down a path where those that govern are increasingly
    self-interested, and those that are governed pushed outside of any legitimate
    collaboration. Even in the face of popular nationalism, the Westphalian system
    is crumbling, by design and by force. Social policy literature for other sectors
    already foresee a future where governments and their agencies play an essential
    leadership and strategic function role, while relying on civil society as the
    ‘delegated implementers’


    To be successful, governance that collaborates in this way must construct an institutional
    framework that facilitates a complex mix of policy, discourse, negotiation and
    arbitration. History of conflict or cooperation, power and resource imbalances,
    leadership, institutional design and incentives for participation are all factors
    that must be consciously known. [39–43] It sounds complicated, but the evidence
    shows that collaborative'
