    We rushed out but all we saw was a blank cliff. The ''grey ghost'' had vanished[1]


    These endangered leopards[2] are an integral part of Central and South Asia. They
    range from Afghanistan to Kazakhstan, Russia in the north and across China in
    the west. Their habitat is fragmented with little connection in between. Human
    communities across this region have a similar sparse and disconnected pattern.

    Yash Veer, Kulbushshansingh and their colleague Charudutt Mishra focus their conservation
    research in the Spiti, a desert mountain valley located high in the mountains
    in the north-eastern part of the Indian state of Himachal Pradesh. The name Spiti
    means ''Middle Land''. Quite literally, this is the land between Tibet and India.
    The region''s Buddhist culture is similar to that found in the nearby Tibet Autonomous
    Region and the Ladakh region in India. The Kibber village has around 80 homes,
    made by hand of stone. Life here is modest, harsh but proud.'
