  md: 'In today’s world, states retain their authority by delegation from their citizens.
    If people choose to circumvent the state and create an elected authority themselves
    – a Global Peoples Assembly – and there is little states can do. If it happens,
    they will no longer be able to claim that they are the sole authority.[20] As
    Andrew Strauss has carefully described, this assembly doesn’t automatically change
    the system or solve the inherent problems we currently face, but over time its
    influence will grow. The more details the assembly addresses, the more relevance
    it will hold.[20] The centre of political gravity will eventually shift towards
    it. Its role in law making will be mainstreamed.


    While I am philosophically on board with the Global Peoples Assembly project,
    I am also someone who has spent a long time in the storm shelter and I have two
    fundamental reservations about its viability at this point in history.


    Setting aside the major shift required by the entrenched national elites, I believe
    we don’t have to wait for the project to unfold. Purely from a wildlife and environment
    perspective we are on the brink of irreversible collapse, right now. The storm
    is upon us and we have to take definitive steps towards a new form of global environmental
    governance in this decade.


    My second reservation relates to the level of detail and deliberation that needs
    to be facilitated to genuinely overcome the world’s current list of global problems
    – climate change, nuclear weapon possession along with other weapons of mass destruction,
    pandemics or world order gone wrong to just name a few. The world is far too complex
    to have governance mattersated by one body of people, no matter how large.[21]


    We are already in a post-Westphalian world, even if many international relations
    scholars are reluctant to acknowledge it. There is an alarming resurgence of popular
    nationalism, the neoliberal agenda is still transferring power incrementally to
    the corporate elite (chapter 2), away from multilateralism and towards multi-stakeholderism.
    International NGOs are complic in the shift (chapter 3) without recognising the
    implications of the model they are producing. The Report of the Commission of
    Global Security, Justice and Governance comprehend the storm that is coming and
    attempts a resort for ‘just peace’, proposing to revitalise the UN General Assembly
    and developing a transnational democratic culture that brings nonstate actors
    into governance discourse. The MEA structures we already have'
