  md: '# Preface


    Numbers can be staggering – some because of the intense compassion they reveal,
    others for their bleak immensity.


    The top trending Twitter hashtags for 2015 included: #JeSuisParis and #PrayForParis,
    #BlackLivesMatter, #RefugeesWelcome, #IStandWithAhmed, #LoveLives#MarriageEquality.
    The online world has a significant capacity to care for something bigger than
    themselves. #JeSuisParis was included in 3.4 million tweets in the first 24 hours
    after the terrorist attack. On the other side of the Atlantic #BlackLivesMatter
    was used over 9 million times during the year. Each of these interactions were
    moments of passions that together became greater, albeit for a fleeting movement.


    The year 2015 also brought the news that the International Union for the Conservation
    of Nature (IUCN) Red List now included 22,784 species that are threatened with
    extinction. Habitat loss and degradation is the main threat for 85 per cent of
    all 77,340 species described on the list. 2,300 birds have been identified as
    particularly vulnerable to climate change. 200 amphibians are already gone. Confronting
    – with brittle clarity – the world is changing. We are not winning the battle.


    I want to make a revolutionary case – civil society needs a seat at the governance
    table. I can feel the visceral reaction from governments and transnational corporations
    as I type. What I propose erodes the pillars of power that have been so carefully
    constructed, but this revolution might not be as impossible as we think.


    I was first struck with this when I read Clive Hamilton’s *Requiem for a Species*
    and it was reinforced when I recently read Micah White’s *The End of Protest*.
    Both authors advocate disruption. For Clive Hamilton it is civil disobedience
    and overcoming passivity to collectively build new democracies that can ensure
    the best defences against a more hostile climate. Micah White challenges us to
    unleash a spiritual, political and and'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'social revolution. Indeed, as I finish this manuscript Anthony Burke, Stefananie
    Fishel and her colleagues have published Plant Politics: A Manifesto from the
    End of IR, calling for legal and institutional reform of global environmental
    governance.


    The call for revolution is not new for the field of international relations. It
    has been building for few decades. In 1983 Richard Falk, who is for many the father
    of normative international relations, urged normative thinkers to inhabit the
    ‘shadowland’ – a conceptual space where one is outraged by contemporary conditions,
    mindful of past realities and devoted to exploring future possibilities. Slavoj
    Žižek, in The Year of Dreaming Dangerously, picks this theme up as well. He challenges
    that we have to start from the assumption that the catastrophic future we have
    already happened and work backwards to figure out what we should have done. We
    then mobilise ourselves to perform the actions that will change that destiny.


    So, a few years ago, I allowed the negativity to surface. I stood on the edges
    of Falk’s shadowland with a dash of Žižek. I intentionally engaged in a project
    born of anger – wasted energy and dismissed action, bureaucrats who revelled in
    the power of their position keeping civil society at arm’s length to the detriment
    of the issues we collectively strove to repair, and anger at years of hard won
    international decisions that were ignored soon as governments returned home, never
    to be questioned or considered again.


    I hosted a meeting of nongovernmental organisations (NGOs) at an intergovernmental
    meeting that is held every three years to discuss shared actions for wildlife
    conservation – the Convention on the Conservation of Migratory Species of Wild
    Animals (CMS). I made sure the room was filled with diversity. There were professional
    activists working for the big international NGOs and a few from smaller operations.
    There were perspectives from Africa, Russia, the United States of America and
    Latin America, from pro-hunter and pro-welfare worldviews. We discussed what was
    missing in our relationship with CMS. They told me that civil society is very
    often the implementer and sometimes even the coordinator of work under the convention
    and its agreements. Their work is rooted in the cultural context of the places
    and the people where the conservation action is needed. They were angry that their
    work remained invisible. If as were busy with ‘real world’ conservation, while
    the secretariats and governments, oblivious to this activity, were content to
    shuffle paper.'
