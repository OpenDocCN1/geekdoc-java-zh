  md: 'I am a ronin, having left behind institutional cover to now freely wander among
    the wisdom of a great many scholars while I strive to make sense of the world
    in which I operate. I carry two swords. The first is that I am and will remain,
    consciously, an actor within my research. The other is that I purposely frame
    my thinking from minority and majority perspectives. My yumi (bow) is my academic
    philosophy of normative international relations, informed by rooted cosmopolitanism.


    # Involvement with the subject


    While my work is grounded in academic discipline and understanding, I ask that
    readers accept my involvement as an actor within this story unfolding as well
    as an observer looking on.


    Political and environmental studies have traditionally sought a ‘cool separation
    from objective political analysis and subjective environmental engagement’.[73]
    As Timothy Doyle notes, this tradition loses a deal of the texture, flavour and
    side discussions of many international discussions. All that is left to draw upon
    are the published and smoothed accounts. But, there is crucial in the margins
    as well. I draw on my experience and fully acknowledge that my political insights
    may be subjective. Significant other works have walked this path and there is
    no reason to shrink from it. Some of what is contained in this book is born of
    my first-hand participation, or that of colleagues, in international meetings.
    Much of what I discuss know because of my practitioner insight, reflecting my
    experience and conversations during specific meetings and events. While not betraying
    confidences, I draw on the inner workings of international political discourse
    to help illuminate the discussion.


    In addition, I must be transparent and place myself within the world order. I
    am child of the new world – a Canadian by birth and an Australian for my life.
    I acknowledge that I have a subconscious new perspective on many points. But,
    I also believe that life experiences can influence worldviews and I am fortunate
    to have a career working with activists and colleagues from many other worldviews.
