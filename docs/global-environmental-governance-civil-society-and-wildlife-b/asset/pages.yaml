- img_proc: true
  md: 'goals. They respect, listen and learn from the perspectives of their network.
    They then apply their broader knowledge and the agreement they develop to their
    localised efforts to protect what is culturally and socially important to their
    community.[89].


    The activities of these network actors are informed and influenced by the social
    and political systems they seek to influence or work within. Through association
    with others in their network individuals shape their perspectives and views of
    their own community and their place in the world. They move, communicate and absorb
    information from outside, but continue to be linked to their place of origin,
    their individual social environment and surroundings that offer meaning as resources,
    experiences and opportunities. Their most important ties are domestic, but they
    participate in the complex of international society.[89, 100] They are the ‘connective
    tissue’ between the global and the local, working as actors, brokers and advocates
    for claims that are both domestic and international.[103] While a great many cosmopolitan
    actors focus on domestic issues, some participate in United Nations or MEA processes
    – which nearly all of the most important environmental negotiations – as a means
    to pressure for change.


    Within civil society organized, often professional, NGOs also operate. Some NGOs
    deliberately operate within, and engage with, established global environmental
    governance space that includes governments, intergovernmental organisations (IGOs)
    and individual experts on a range of issues. Other NGOs maintain a focus on raising
    public awareness on specific issues.[90, 94] Many specialist NGOs contribute considerable
    work and effort to policy agendas of these. They recognise a role of work within
    the system and not against it and adhere to norms of conduct and to be bound to
    the protocols and the culture of the international diplomatic community, as willing
    participants in the traditional vertical governance structure. This increases
    trust and builds important relationships. They consciously nest themselves within
    the process in which they are working.[62, 104, 105] They typically have capacity
    and time to focus on the detail of specific issues between and during meetings
    in ways government delegations, especially those that are small and under-resourced,
    struggle to match.[90–93] They employ skilled negotiators and diplomats that understand
    the pulse and process of international policy,'
