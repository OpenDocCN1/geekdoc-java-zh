  md: '# Thunder rumbles


    # Night heron – Maximin Djondo


    The phone rings. Drawn bleary-eyed from the depths of pre-dawn sleep, Maximin
    Djondo turns to his clock. It is 5am.


    ‘Mr Bird,’ a stranger’s voice echoes down the line. ‘We hear gunshots.

    think they are killing the birds.’


    Minutes later, another unknown caller from a second village confirms the report.


    To this day he doesn’t know how they got his number, but there is pride he recounts
    the calls. This is grassroots conservation in action. For decades waterfowl on
    the lake had been hunted. Some hunting was traditional, but more problematic were
    wealthy sport-hunters with European guides. All that has changed.


    A year or two passes, and dawn breaks across Nokoué Lake, southern Benin – this
    place that Maximin is committed to.


    I imagine a hoarse call – quawk, quawk, quawk – vibrates across the wetland from
    black-crowned night herons returning from their nocturnal forage. Pale belly flash
    in the morning light, as they settle on mangrove branches. Some of the males sport
    their breeding plumage – slim, snowy white feathers extend from their heads, their
    legs and feet in transition from mutated yellow to red.


    Nearby a manatee and her dark calf cuddle along the lake bed. Her flat paddle-tail
    gently fans the water – so gentle that the muds and water without noting her.
    Small eyes in a broad, tranquil head blink a welcome to the morning light. Her
    feeding done, it is to find a place to rest – shallow water with mangroves as
    cover is what she knows.


    Maximin is the Director for Benin Environment and Education Society (BEES), an
    impressive local NGO which represents so much of what is possible for the future.
    He is dedicated to facilitating wildlife research and'
  merge: -1
  pgno: 102
- img_proc: true
  md: 'conservation activities in his region, and has spearheaded the development
    of sustainable income generating opportunities for communities in north and south
    Benin.


    His enlightened perspective has grown from an early programme he worked on for
    the conservation of the Lama Forest and the red-bellied guenon, a critically endangered
    monkey only in Benin. For a time the species was considered extinct, wiped out
    in a race for its fur. This black-faced monkey has the misfortune of having an
    attractive mouse-brown coat with a ruff of white around its throat and a deep
    red belly. Now rediscovered, this enigmatic fruit eaters are still rare and by
    no secure. Their habitat is heavily degraded and remaining patches threatened
    by timber extraction and conversion to agricultural land. And, these little monkeys
    are still hunted for bushmeat.


    A little over a decade ago, a team of scientists and Benin based conservationists
    conceived of a programme to create new local business for the local community
    in return for forest protection. In 2008, BEES created an ecotourism centre in
    Lama. Maxim and his team work with the communities neighbour the forest in an
    ongoing process where individuals become aware of their environment and acquire
    the knowledge, skills and experience to enable them collectively solve the environment
    problems they face. Residents are organised into a Participatory Forest Management
    Committee, that oversees their local governance and makes money from offering
    visitors a tourism service. In return, they care for the forest. Housewives, farmers,
    artisans and youngsters all participate. This is an excellent example of forest
    co-management – a partnership between government and a local community, with an
    NGO as the communicator between. Slowly, but surely, the little guenon''s calls
    are heard again.


    As I set up the computer to call Maxim, the lyrical dance of a red-headed malimbe
    song might be twirling around the water from the forest edge. Perhaps a situnga
    lifts herself up onto a floating island of vegetation. Her shaggy coat, rusty-brown,
    streams water, like oil off glass. In the morning light, the pale stripes of this
    wetland-dwelling antelope shine, just a moment. She has swum through water hyacinth
    and reeds to the safety of this spot. At times she will have submerged herself
    while predators pass, hooves splayed against the lake bed leaving only her nose
    above water. She is safe in Nokoué. Today, no snares have been set.'
