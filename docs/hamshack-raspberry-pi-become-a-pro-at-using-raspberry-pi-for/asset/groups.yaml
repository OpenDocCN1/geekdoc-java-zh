    # Configuring the Packet Node


    After making sure that AX.25 is up and running, we can now setup the packet node,
    in a way that it startup automatically after boot, as well as listen for incoming
    connections with the right prompt, commands, and permissions.


    Let''s first edit the file in charge for controlling the node''s main settings,
    and that is the node.conf file.


    ```

    pi@raspberrypi:~~$ sudo nano /etc/ax25/node.conf

    ```


    Although for most of the file you won''t have to change the default settings,
    the HostName and NodeId should be altered. Pay attention that you also configure
    the Nport to the already specified port name.


    Here is an example of what that should look:


    ```

    Host KE7SAL-9

    NodeId CARMEL:KE7SAL-9

    NrPort netrom

    ```


    Let''s add the node''s permission. If you want to, you can make it that way that
    your user needs a password.


    ```

    pi@raspberrypi:~~$ sudo nano /etc/ax25/node.perms

    ```


    Read the node.perms page to see what are the settings and permissions. In this
    example, this is what the node.perms file looks like:


    ```

    # user type passwd perms

    ke7sal * * PASS 25 5

    ```


    ```

    # Default permissions per connection type.

    #

    * ax25** * 7

    * netrom ** * 7

    * local ** * 7

    * ampr ** * 7

    * inet ** * 7

    * host ** * 7

    ```


    Now, let''s configure the broadcasting of netrom. This is important as it will
    tell the node how to actually process other nodes'' broadcasts. Plus, it allows
    you to configure the settings of your broadcasts.

