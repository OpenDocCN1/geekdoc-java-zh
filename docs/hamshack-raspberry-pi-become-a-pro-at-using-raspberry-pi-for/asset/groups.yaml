    no Windows clients in my network, you may think. Well, even if that is the case,
    you will still benefit a lot from Samba. For instance, you have the Photo Mate
    RAW – a processing application for Android – can access pictures that are stored
    on PCs. And if you wish to access files from your Pi on an Android, then Samba
    is the way to do it.


