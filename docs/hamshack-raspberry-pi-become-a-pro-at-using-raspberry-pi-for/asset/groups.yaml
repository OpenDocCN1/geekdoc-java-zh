    创建了一个类型为“扩展”、大小为 29.7 GiB 的分区 2。


    5. 代被删除分区创建一个新的逻辑分区并确保该分区与旧的起始扇区匹配：


    Command (m for help): n


    Partition type:

    * p primary (1 primary, 1 extended, 2 free)

    * logical (numbered from 5)


    Select (default p): 1


