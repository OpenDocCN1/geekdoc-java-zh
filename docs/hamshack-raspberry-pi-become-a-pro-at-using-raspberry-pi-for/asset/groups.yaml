    \nCreated a new partition 5 of type 'Linux' and of size 29.7 GiB.\n\n+   6. Display\
    \ the partition table and make sure that the end sectors are the only things that\
    \ are different:\n\nCommand (m for help): p\nDisk /dev/mmblk0: 29.7 GiB, 31918653440\
    \ bytes, 62341120 sectors\nUnits: sectors of 1 * 512 = 512 bytes\nSector size\
    \ (logical/physical): 512 bytes / 512 bytes\nI/O size (minimum/optimal): 512 bytes\
    \ / 512 bytes\nDisklabel type: dos\nDisk identifier: 0x417ee54b\n\n| Device |\
    \ Boot | Start | End | Blocks |\n|---|---|---|---|---|\n| Id System /dev/mmblk0p1\
    \ | 2048 | 186367 | 92160 | c |\n| W95 FAT32 (LBA) /dev/mmblk0p2 | 186368 | 62341119\
    \ | | |\n| 31077376 5 | Extended | | | |\n| /dev/mmblk0p5 | 188416 | 62341119\
    \ | | |\n| 31076352 83 | Linux | | | |\n\n+   7. Write the partition table to\
    \ disk:\n\nCommand (m for help): w\n\n+   8. Restart your Raspberry Pi:\n\n```bash\n\
    # reboot\n```\n\n+   9. Now login to resize the filesystem:\n\n```bash\n# resize2fs\
    \ /dev/mmblk0\n```\n\n# User Management\n\nAfter installing your OS, the next\
    \ step you should take is to set up an actual user account. As you have probably\
    \ noticed, the Raspberrybian has already a default user called pi and a default\
    \ password raspberry. So why change them? Well, the username and password is widely\
    \ known and a system that runs with these default setting is not secure at all.\
    \ If you want to avoid any security issues in the future, I suggest you change\
    \ your password.\n\nThe installation doesn't have a root password, so the user\
    \ should use sudo to run the commands that way. It is important to have a root\
    \ password set because it will allow for the administrative tasks to be performed\
    \ in the root shell. Here is how you can standardize the install:\n\n+   1. Log\
    \ in as a pi user.\n\n+   2. Change the default password with this command:\n\n\
    ```bash\n# passwd\n```\n\n+   3. Enter a root shell:\n\n```bash\n# sudo -i\n```\n\
    \n+   4. Run passwd one more time to change the password. Since you are in a root\
    \ shell this will automatically change the root password.\n\n+   5. Choose a new\
    \ user name and add it with this command (I have used John as a new user name\
    \ in this example):\n\n```bash\n# adduser john\n```\n\n+   6. If you want your\
    \ user to perform certain tasks, it has to be part of certain groups. To ensure\
    \ that, type the command below. Again, replace john with your user name of choice:\n\
    \n```bash\n# usermod -a -G m,dialout,cdrom,sudo,audio,video,plugdev,games,users,netdev,input,spi,gpio\
    \ john\n```\n\nIf you want to boot your desktop as a new user, you can actually\
    \ do this without the raspi-config. Here is how to do it:\n\n+   1. Enable the\
    \ LightDM service:\n\n```bash\n# update-rc.d lightdm enable 2\n```\n\n+   2. In\
    \ /etc/lightdm/lightdm.conf, set the autologin-user variable, as it is required.\
    \ Know that commenting with a # will provide you with a login window every time\
    \ that you boot your Pi, which is way more secure, and especially beneficial if\
    \ you have more than one user.\n\nIf you want to accomplish the reverse, simply\
    \ disable the LightDM.\n\n# Accessing Pi Remotely\n\nAfter installing your OS,\
    \ you can start developing with a USB keyboard, USB mouse, and an HDMI screen.\
    \ However, if you don't have these accessories, all is not lost. You can still\
    \ access your Pi remotely. There are a couple of ways to do this.\n\n# SSH Remote\
    \ Server\n\nSSH is a great remote server that can be used for most of the remote\
    \ administration processes. And since Pi is a great ‘headless’ server, the remote\
    \ server can be installed by default in the Raspian. In Linux, you can connect\
    \ to SSH easily with the ssh command:\n\n```bash\nssh user@IP:port\n```\n\nIf\
    \ you are using Windows, the SSH connection can be made with PuTTY, that you can\
    \ download from http://www.chiark.greenend.org/~sgtaham/putty/. Securing the SSH\n\
    \nIn case you want to access the Pi from outside the local network, then you should\
    \ be super careful and do everything you can protect it from unwanted bots and\
    \ hackers. Most bots tend to connect to the port 22 and then brute force the password,\
    \ and even if the password is secure, this can still file the logs with multiple\
    \ failed attempts to establish a connection.\n\nThe simplest way to protect yourself\
    \ is by changing the port number and disabling the option for root login over\
    \ the SSH. To do this, edit the /etc/ssh/sshd_config and set up these options:\n\
    \n```bash\nPort 1286 #Any unused port number is fine\nPermitRootLogin no\n```\n\
    \nBut this won't stop someone from scanning your open ports. The ideal thing is\
    \ to disable any password login and use only keys for this purpose. To do this,\
    \ you need to generate two keys – public and private. Send the public key to a\
    \ remote server, and keep the private key, well, private, and use it instead of\
    \ a password for login.\n\nIf using Windows, you can generate the keys with the\
    \ PuTTY:\n\n+ - Copy the public key here ~/.ssh/authorized_keys , and save the\
    \ private key on your PC.\n- Change the authorized_keys permissions, if you want\
    \ to protect the key:\n  `# chmod 600 ~/.ssh/authorized_keys`\n- In PuTTY, click\
    \ ‘Save Private Key’.\n\nIn Linux, you can generate the keys this way:\n\n+ -\
    \ By typing ssh-keygen -t rsa\n- Now, accept recommended save location and enter\
    \ your passphrase. The content from id_rsa.pub should be copied to ~/.ssh/authorized_keys,\
    \ but that can be easily done with:\n  `# ssh-copy-id user@IP -p PORTNUMBER`\n\
    - Once you see that you can connect to your Pi with the private key, go back to\
    \ /etc/ssh/sshd_config to disable the password logins:\n  `PasswordAuthentication\
    \ no`\nThe best thing is that you can actually add multiple public keys. For instance,\
    \ if you want to allow someone else to access your Pi, you can simply ask them\
    \ for their public key and add the key to your authorized_keys file.\n\n+ There\
    \ is one more thing to do, and that is to install fail2ban. This will ban all\
    \ of the malicious IPs and fight various attacks:\n\n```bash\n# apt-get install\
    \ fail2ban\n```\n\nNow, open the configuration file in order to edit the Sudo\
    \ nano /etc/fail2ban/jail.local , and paste this:\n\n```ini\n# SSH\n# 3 failed\
    \ retry: Ban for 10 minutes\n[ssh]\nenabled = true\nmaxretry = 3\nbantime = 600\n\
    ignoreip = 192.168.0.0/24\n\n[ssh-ddos]\nenabled = true\nmaxretry = 10\nbantime\
    \ = 60\nignoreip = 192.168.0.0/24\n```\n\n+ Now restart fail2ban;\n\n```bash\n\
    sudo /etc/init.d/fail2ban restart\n```\n\n# Transferring Files\n\nIf you thought\
    \ that SSH was only great for allowing us to execute commands, you were wrong.\
    \ SSH also gives us the chance to transfer files.\n\nIf you want to perform a\
    \ simple file transfer, this command will help you do:\n\n```bash\n$ scp /path/to/src\
    \ user@IP:/path/to/dst\n```\n\nHowever, if you are looking for a bit more powerful\
    \ command, then this is the one:\n\n```bash\n$ rsync /path/to/src user@IP:/path/to/dst\
    \ -av\n```\n\nIf you are a Windows user, you can do this with WinSCP, which can\
    \ be found at http://winscp.net . Its GUI uses T for private keys, and also allows\
    \ you to transfer files between your PC and Pi.\n\n# X11 Forwarding\n\nGreat,\
    \ you can now execute commands and transfer files. But the other thing you need\
    \ to have in mind is the GUI. The X Window System can use a remote display in\
    \ mind, and you can use SSH to forward GUI programs to the local X server remotely.\n\
    \nIf you use Linux, you can launch SSH as before, only with the addition of the\
    \ -Y option. When your SSH session is ready, launch leafpad\n\nIf you are a Windows\
    \ user, you will need to have an X server running. Here are some options for that:\n\
    \n- Cygwin/X that can be found at http://x.cywin.com/.\n- Xming, found at http://sourceforge.net/projects/xming/.\n\
    - VcXrv is available here: http://sourceforge.net/projects/vcxsrv/.\n\n# Maintaining\
    \ the Remote Session with Screen\n\nAlthough screen and ssh are not exactly related,\
    \ they make a combo. Think about what would happen if your connection dropped\
    \ during a SSH session. Obviously, everything would be lost. That is why screen\
    \ is so important. With screen, you can easily re-attach and detach as needed.\
    \ For instance, if your connection drops, you can re-attach\n"
  mdcn: "\n添加逻辑分区 5\n第一个扇区 (188416-62341119，默认 188416):\n最后一个扇区，+sectors 或 +size{K,M,G,T,P}\
    \ (188416-62341119)，\n默认 62341119):\n\n创建了一个类型为 'Linux' 大小为 29.7 GiB 的新分区 5。\n\
    \n+   6. 显示分区表并确保结束扇区是唯一的不同：\n\n命令（m 获取帮助）：p\n磁盘 /dev/mmblk0: 29.7 GiB, 31918653440\
    \ 字节, 62341120 扇区\n单位: 1 * 512 = 512 字节的扇区\n扇区大小 (逻辑/物理): 512 字节 / 512 字节\nI/O\
    \ 大小 (最小/最优): 512 字节 / 512 字节\n磁盘标签类型: dos\n磁盘标识: 0x417ee54b\n\n| 设备 |  | 开始 |\
