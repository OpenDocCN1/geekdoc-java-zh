    # Introduction\n\nWhether you have already received your Ham license, or plan\
    \ on receiving one, choosing to read this book is definitely a smart move.\n\n\
    Everything cool that you have ever heard about radio stations such as communicating\
    \ in Morse code, tracking satellites, or even playing a simple game over the air,\
    \ this book will teach you in no time.\n\nAnd the best part? You don't have to\
    \ spend thousands or even hundreds of dollars to do so. A cheap Raspberry Pi computer\
    \ and some other inexpensive tools, is all you need to start your amateur radio\
    \ journey.\n\nAnd if you think that just because you haven't been properly introduced\
    \ to the tiny computer called Raspberry Pi is a reason to skip reading this book,\
    \ then you couldn't be more wrong.\n\nFrom the moment you buy your Pi, to the\
    \ actual playing with your hamshack RPi, this book will guide you through the\
    \ whole process of learning to install, configure, and operate with Raspberry\
    \ Pi in order to enjoy the coolest hobby in the world.\n\nSounds like a great\
    \ deal? Now let's play with the airwaves, shall we?\n\n# Introducing Raspberry\
    \ Pi\n\nRaspberry Pi (pronounced raspberry pie) is a tiny computer that has the\
    \ size of a credit card. Seriously, the Raspberry Pi foundation used an actual\
    \ credit card to be their template for the design of the printed circuit board\
    \ (PCB) of this small computer.\n\nRaspberry Pi, or the Pi, or RasPi, or RPi,\
    \ whatever nickname you like the most, believe it or not an actual computer. Its\
    \ board features the typical hardware that is found in the desktop computers (such\
    \ as RAM, processor, etc.), which means that this credit card-sized computer also\
    \ enables you to edit documents, play audio and video, play games, do some coding,\
    \ etc.\n\nOf course, its tiny size is not able to provide as much power as a normal\
    \ desktop PC, however, its cheap price of approximately $35 makes up for everything.\
    \ Actually, the main idea behind the birth of such a computer was to teach kids\
    \ and about the basics of computer science with a minimal investment. It's a lot\
    \ more convenient to break a Raspberry Pi and replace it with a new one, learn\
    \ about the software science with an actual desktop computer and spend a fortune\
    \ to replace or fix what you've broken.\n\nRaspberry Pi is as yummy as its sounds.\
    \ With this tiny computer you can actually move past the 'visible', surface-level\
    \ software and dive deeply into its 'black box' – the internals that most people\
    \ are unaware of. Starting the software education with a Raspberry Pi has proven\
    \ to be the easiest way for people to adopt highly appreciated and super valuable\
    \ software and hardware engineering skills.\n\nBut Raspberry Pi isn't only for\
    \ these 'academics'. What's even amazing about this credit card-like computer\
    \ is that its fan base is super versatile. There are many DIYers and hackers that\
    \ make Raspberry Pi an essential part of their computer experiments.\n\n# A Quick\
    \ Ride Through History\n\nFor those that are casually observing the development\
    \ of the computer technology, it may seem that Raspberry Pi is brand new. And\
    \ it'd seem like it, since most blogs and websites treat this computer that way.\
    \ However, the truth is that Raspberry Pi has been around for years. In fact,\
    \ the creators of the Pi – Rob Mullins, Eben Upton, Alan Mycroft, and Jack Lang\
    \ – first came with the idea of making a tiny computer in 2006. This came as a\
    \ result of their observation that the available cheap computers at that time\
    \ (like the Amiga or the Spectrum) had a rather negative effect on the programming\
    \ education, as they were slowing down the ability to learn the software science\
    \ significantly. And since laptops and desktop computers cost hundreds, some even\
    \ thousands of dollars, kids back then really couldn't afford to mess with the\
    \ main family computer that way. So it is understandable just how much a cheap\
    \ learning platform was needed.\n\nTrying to realize their idea, the Pi creators\
    \ played around with various microcontrollers, PCBs, and breadboards, but it wasn't\
    \ until 2008 that their concept became a reality thanks to the newer technology\
    \ and cheaper chips. The new powerful tools helped them create a platform that\
    \ was not only able to teach command-line programming but also supported media.\
    \ Joined by David Braben and Pete Lomas, the original creators formed the now-popular\
    \ Raspberry Pi Foundation, and only three years later, in 2011, the first Raspberry\
    \ Pi hit the market.\n\nWith the rise of technology many different models of Raspberry\
    \ Pi have been created, each of them offering better features than their ancestors.\n\
    \n# The Hardware\n\nIf you have already purchased your Raspberry Pi, you may have\
    \ already noticed how ‘naked’ the device actually comes. Its price may be cheap,\
    \ about $35, but there are some hidden costs involved. The Pi may be a computer\
    \ on its own for sure, however, you need a couple of other things to make it work\
    \ as it should.\n\nA 5V Power Supply. For a device that is USB-powered, everyone\
    \ can agree that the Raspberry Pi, no matter what flavor you have, is hungry for\
    \ power. It draws around 600 to 700 mA. And while it can be powered from the USB\
    \ port — which is rated around 500 mA, it is important that you use an actual\
    \ powered adapter. You can use a modern smartphone charger since most of them\
    \ supply 700 mA at 5V, however, to check if yours are at the bottom of the charger.\n\
    \nIf you don’t have a quality charger, once other devices such as a camera module\
    \ or a simple Wi-Fi dong are connected, they will draw more power from the Pi\
    \ and it may become unstable.\n\nOn the other hand, if the power supply doesn’t\
    \ deliver solid 5V, and maybe provides too much power, the board can easily get\
    \ tired.\nGreat third-party vendors who can provide your Pi with adequate power\
    \ are:\n\n- AdaFruit\n- MoodMyPi\n- SparkFun\n\nSD Card. Its small and its super\
    \ powerful, but the Raspberry Pi does not have the capability to store data onboard.\
    \ That is why an SD (Secure Digital) Card — a removable storage device – is essential.\n\
    Here is what you need to look for when shopping for an SD card for your Raspberry\
    \ Pi:\n\n- A Standard SD Card. Your Pi supports a standard SD card, not a Mini\
    \ or a Micro SD, however, you can use an adapter to convert these if you happen\
    \ to have a Micro or Mini.\n\n- A trustworthy brand. Avoid the cheap choices and\
    \ choose good quality SD card such as Kingston, SanDisk or Transcend.\n"
  mdcn: "\n\n# HAMSHACK\n树莓派 (RASPBERRY PI)\n\n成为树莓派业余无线电专家\n\n![](img/2cb396b278b4689ca2ae10896df42604_0_0.png)\n\
    \nJeremy Stephens\n\n![](img/2cb396b278b4689ca2ae10896df42604_1_0.png)\n\n# Hamshack\
    \ 树莓派\n\n业余无线电活动树莓派入门指南\n\nJeremy Stephens\n© 2017\n\n© Copyright 2017 by Jeremy\
    \ Stephens\n保留所有权利。\n\n本文档旨在就其涵盖的主题和问题提供准确且可靠的信息。本书的销售基于以下理念：出版者不要求提供会计、官方许可或其他任何形式的合规服务。如果需要法律或专业方面的建议，应聘请该领域具有经验的专业人士。\n\
    \n+ 摘自一份由美国律师协会委员会和出版者协会委员会共同接受并批准的原则宣言。\n\n严禁以任何方式通过电子手段或打印格式复制、复制或传输本文档的任何部分。严禁对出版物进行记录，除非获得出版者的书面许可，否则不允许本文档进行任何存储。保留所有权利。\n\
    \n此处提供的信息被声明是真实且一致的，但由于任何疏忽、滥用政策、说明或指示导致的责任由读者自行承担。在任何情况下，出版者对因此处信息导致的任何修理、损坏或经济损失不承担法律责任或责任。\n\
    \n相应的版权归出版者所有。\n\n此处提供的信息仅供参考且具有通用性。呈现不构成合同或任何形式的保证。\n\n此处使用的商标均未经许可，商标归其所有者所有。书中的所有商标仅供说明之用，归所有者所有，与本文无关。\n\
    \n# 目录\n\n- 引言\n- 介绍树莓派\n    - 简述历史\n    - 硬件\n    - 开始使用 Pi\n    - 安装\n    -\
    \ 用户管理\n    - 远程访问 Pi\n    - 无线连接\n    - 安装 Samba\n    - 设置树莓派无线电\n    - 设置系统\n\
    \    - 安装与配置 AX25\n    - 配置无线电节点\n    - 启动节点\n    - 空中无线\n    - 针对 RPI 的业余无线电项目\n\
    \    - 数字调制\n    - 无线电世界\n    - SDR 与 GNU Radio\n    - 业余卫星跟踪\n    - 日志\n    -\
    \ 图形收发器控制\n    - 电码无线电\n- 结论\n\n# 引言\n\n无论你已经获得了无线电执照还是打算获取，选择阅读这本书都是明智之举。\n\n\
    你听过的所有酷的无线电活动，例如电码通信、卫星跟踪甚至简单的无线电操作，这本书将很快教会你。\n\n而最棒的部分是？你不需要花费数千甚至数百美元。只需要一台廉价的树莓派电脑和其他工具，就可以开启你的无线电之旅。\n\
    \n如果你认为因为没有被介绍过名为树莓派的微型电脑就跳过这本书，那么你就大错错了。\n\n从你购买 Pi 的那一刻起，到实际操作 hamshack，这本书将引导你学习安装、配置和操作\
    \ Pi 以享受世界上最有趣的爱好。\n\n听起来很划算吧？现在让我们玩玩无线电吧？\n\n# 介绍树莓派\n\n树莓派（读作 raspberry pie）是一种只有信用卡大小的微型电脑。树莓派基金会将信用卡作为这种电脑打印电路板（PCB）的设计模板。\n\
    \n树莓派或 Pi、RasPi 或 RPi（随你最喜欢的称呼），信你信信。它的主板包含了桌面电脑中常见的硬件（如内存、处理器等），这意味着这种信用卡大小的电脑也能让你编辑文档、播放视频、玩游戏等。\n\
    \n当然，它的尺寸无法提供像普通 PC 那样的动力，但其约 35 美元的廉价解决了一切问题。实际上，这种电脑诞生的核心思想是用最小投资让孩子们学习计算机科学。弄坏树莓派并更换一个新的要方便得多。\n\
    \n树莓派正如听起来那样趣。通过这种微型电脑，你可以超越“表面”层，深入探索大多数人并不熟悉的“黑盒”。学习树莓派已被证明是人们采用软件和硬件工程技能的最简单方法。\n\
    \n但树莓派不仅适用于这些“学者”。这种信用卡式电脑更神奇的地方在于它的粉丝群体非常多元。有很多 DIY 爱好者和黑客让树莓派成为他们电脑实验的重要部分。\n\
    \n# 简述历史\n\n对于偶尔关注电脑技术的人来说，树莓派似乎是全新的。大多数博客和网站都是这样对待这种电脑的，所以看起来如此。但事实是树莓派已经存在多年。事实上，Pi\
    \ 的创造者 Rob Mullins、Eben Upton、Alan Mycroft 和 Jack Lang 在 2006 年首次提出了微型电脑的想法。这是由于他们观察到当时市廉价电脑（如\
    \ Amiga 或 Spectrum）对编程教育产生了负面影响，因为它们大大降低了学习计算机科学的能力。由于笔记本电脑和桌面电脑花费数百甚至数千美元，当时的孩子们真的负担不起这种家庭电脑。因此，需要一个廉价的学习平台是可以理解的。\n\
    \n为了实现他们的想法，Pi 的创造者尝试了各种微控制器、PCB 和面包板，但直到 2008 年，由于更新的技术和更便宜的芯片，他们的概念才变为现实。新的强大工具帮助他们创建了一个不仅能够命令行编程而且支持媒体的平台。在\
    \ David Braben 和 Pete Lomas 的加入下，原始创造者形成了现在盛名的树莓派基金会，并在三年的后（2011 年），第一台树莓派上市了。\n\
    \n随着技术的进步，出现了许多不同型号的树莓派，每种都比其祖先提供更好的功能。\n\n# 硬件\n\n如果你已经购买了树莓派，你可能已经注意到设备送来时实际上有多么“裸”。它的价格可能很廉，，大约\
    \ 35 美元，但涉及一些隐藏成本。Pi 确实是一台电脑，但你还需要其他东西才能让它正常工作。\n\n5V 电源。对于一个 USB 供电的设备，大家都会同意树莓派（无论你的是哪种型号）是电渴的。它的抽电流约为\
    \ 600 到 700 mA。虽然它可以通过 USB 端口供电（额定约为 500 mA），但使用实际的电源适配器至关重要。你可以使用现代智能手机充电器，因为大多数在\
    \ 5V 下提供 700 mA，但要检查你的充电器是否处于该功率的底部。\n\n如果你没有优质的充电器，一旦连接了摄像头模块或简单的 Wi-Fi 适配器等设备，它们将从\
    \ Pi 抽取更多电源，导致其变得不稳定。\n\n另一方面，如果电源没有提供稳定的 5V，可能提供了过电压，主板很容易损坏。\n\n能为你的树莓派提供充足电源的优质第三方供应商有：\n\
    \n- AdaFruit\n- MoodMyPi\n- SparkFun\n\nSD 卡。它很小且强大，但树莓派本身没有存储数据的能力。因此，SD（安全数字）卡——一种可移动存储设备——是必不可少的。\n\
    为树莓派购买 SD 卡时，你需要寻找以下内容：\n\n- 标准 SD 卡。你的 Pi 支持标准 SD 卡，而不是 Mini 或 Micro SD，但如果你恰好有\
    \ Micro 或 Mini，可以使用适配器进行转换。\n\n- 可信赖的品牌。避免廉价选择，选择优质的 SD 卡，如金士、闪迪或威达。\n\n"
