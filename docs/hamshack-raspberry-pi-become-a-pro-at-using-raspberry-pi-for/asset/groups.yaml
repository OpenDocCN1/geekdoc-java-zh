    # Installing and Configuring AX.25


    Everything that is needed for the packet radio, actually works on top of the protocol
    of AX.25. That is why installing it at this point is essential:


    ```

    pi@raspberrypi:~ $ sudo apt-get install ax25-tools ax25-node ax25-apps tunnel

    ```


    Now, let''s configure the AX.25 port that is actually your packet radio''s network
    interface:


    ```

    pi@raspberrypi:~ $ sudo nano /etc/ax25/exports

    ```


    The file is supposed to have two example lines that are commented with #. Now
    add this:


    ```

    0 CALLSIGN-N 9600 255 2 145.030 MHz (1200bps)

    ```


    Let''s break down the line from above:


    - 0 – this is the name of the port. It can be a text or a number

    - CALLSIGN-N – This is your callsign and it has to have a number after the name.

    - 9600 – this represents the port''s speed. Actually, this is not the speed of
    the radio connection, but the speed between the TNC and the computer. In this
    case is 9600 band.

    - 255 – this is the PacLen.

    - 2 – this is the window

    - 145.030 MHz (1200 bps) – this serves as a reminder. You can basically any text
    description here that will remind you what this port is.


    Moving forward, it is time to set up a netrom (a packet protocol that also runs
    on top of AX.25 port). In order to set up the node, you need to set up the netrom
    first. If you wish to connect solely to other nodes, then configuring the netrom
    is not mandatory, however, keep in mind that it will make the process of connecting
    to remote nodes much easier.


    ```

    pi@raspberrypi:~ $ sudo nano /etc/ax25/nrports

    ```


    Now, add something like this:


    ```

    netrom CALLSIGN-N #ALIAS 255 145.030 MHz (1200bps)

    ```


    Let''s break down once again:


    - Netrom – The name of the port

    - CALLSIGN-N – Same as before, the callsign followed by a number

    - #ALIAS – the alias of the netrom packed code. Think of this as an alternate
    name under which other people can connect to your node.

    - 255 – PaClen

    - 145.030 MHz (12000 bps) – Just like before this serves as a description of the
    netrom port.


    Let''s edit a daemon config file. Delete everything from the file and replace
    it with the text found below. Be careful, you must edit it in a way that it will
    match the configured ports:


    ```

    [CALLSIGN-N VIA 0]

    NOCALL ***** L

    default ***** - root /usr/sbin/ax25-node ax25-node e

    <netrom>

    NOCALL ***** L

    default ***** - root /usr/sbin/ax25-node ax25-node

    ```


    Do not forget to update the headings of the section with the actual ones. For
    instance, the CALLSIGN-N should be your callsign followed by the number you have
    chosen. VIA 0 should be updated and contain the name of the AX,25 port, etc.


    Let''s now bring up the interface of the AX25 port:


    ```

    sudo kissattach /dev/ttyUSB0

    ```


    /dev/ttyUSB0 needs to be replaced with the corresponding serial port for your
    own KISS TNC. Remember, the 0 here is actually the name of the AX25 file that
    you configured earlier. By using ifconfig you can now check that the port AX25
    is online:


    ```

    pi@raspberrypi:~ $ ifconfig ax0

    ax0 Link encap:AMPR AX.25 WHDaddr CALLSIGN-N

