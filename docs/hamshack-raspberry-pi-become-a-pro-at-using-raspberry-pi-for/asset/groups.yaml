    \ Linux | | | |\n\n+   7. 将分区表写入磁盘：\n\n命令（m 获取帮助）：w\n\n+   8. 重启你的树莓派：\n\n```bash\n\
    # reboot\n```\n\n+   9. 现在登录以调整文件系统大小：\n\n```bash\n# resize2fs /dev/mmblk0\n```\n\
    \n# 用户管理\n\n安装好操作系统后，你应该采取的下一步是设置一个实际的用户账户。正如你可能注意到的，Raspberrybian 已经有一个名为 pi\
    \ 的默认用户以及默认密码 raspberry。那么为什么要更改它们呢？嗯，用户名和密码是众所周知的，运行这些默认设置的系统完全不安全。如果你想在将来避免任何安全问题，我建议你更改密码。\n\
    \n安装程序没有设置 root 密码，因此用户应该使用 `sudo` 来运行此类命令。设置 root 密码非常重要，因为它将允许在 root shell 中执行管理任务。以下是你可以如何标准化安装的方法：\n\
    \n+   1. 以 pi 用户身份登录。\n\n+   2. 使用此命令更改默认密码：\n\n```bash\n# passwd\n```\n\n+  \
    \ 3. 进入 root shell：\n\n```bash\n# sudo -i\n```\n\n+   4. 再次运行 `passwd` 来更改密码。由于你正处于\
    \ root shell 中，这将自动更改 root 密码。\n\n+   5. 选择一个新的用户名并使用此命令添加它（在示例中，我使用了 John 作为新用户名）：\n\
    \n```bash\n# adduser john\n```\n\n+   6. 如果你想让你的用户执行某些任务，它必须是某些组的一部分。为了确保这一点，输入以下命令。再次，将\
    \ john 替换为你选择的用户名：\n\n```bash\n# usermod -a -G m,dialout,cdrom,sudo,audio,video,plugdev,games,users,netdev,input,spi,gpio\
    \ john\n```\n\n如果你想以新用户的身份启动桌面，实际上可以在不使用 `raspi-config` 的情况下实现。以下是操作方法：\n\n+ \
    \  1. 启用 LightDM 服务：\n\n```bash\n# update-rc.d lightdm enable 2\n```\n\n+   2.\
    \ 在 /etc/lightdm/lightdm.conf 中设置 `autologin-user` 变量，这是必须的。请注意，使用 `#` 注释将会在你每次启动\
    \ Pi 时为你提供登录窗口，这要安全得多，特别是当你有多个用户时非常有益。\n\n如果你想实现相反的操作，只需禁用 LightDM 即可。\n\n# 远程访问树莓派\n\
    \n安装好操作系统后，你可以使用 USB 键盘、USB 鼠标和 HDMI 屏幕开始开发。然而，如果你没有这些配件，一切也无可救。你仍然可以远程访问你的树莓派。这里有几种实现方法。\n\
    \n# SSH 远程服务器\n\nSSH 是一个非常棒远程服务器，可以用于大多数远程管理过程。由于 Pi 是一个极好的“无头”服务器，Raspbian 默认就可能安装了远程服务器。在\
    \ Linux 中，你可以通过 `ssh` 命令轻松地连接到 SSH：\n\n```bash\nssh user@IP:port\n```\n\n如果你使用的是\
    \ Windows，可以使用 PuTTY 建立 SSH 连接，你可以从 http://www.chiark.greenend.org/~sgtaham/putty/\
    \ 下载它。\n\n确保 SSH 安全\n\n如果你想从本地网络外部访问树莓派，那么你应该非常小心，并尽一切保护它免受不受的机器人和黑客的攻击。大多数机器人倾向于连接到\
    \ 22 端口并暴力破解密码，即使密码是安全的，这仍会导致日志中充满多次建立连接的尝试。\n\n保护自己最简单的方法是更改端口号并禁用 SSH 的 root\
    \ 登录选项。要做到这一点，编辑 /etc/ssh/sshd_config 并设置这些选项：\n\n```bash\nPort 1286 # 任何未使用的端口号均可\n\
    PermitRootLogin no\n```\n\n但这无法阻止别人扫描你的开放端口。最理想的情况是禁用任何密码登录，并仅为此目的使用密钥。要做到这一点，你需要生成两个密钥——公钥和私钥。将公钥发送到远程服务器，并将私钥妥善地保密，并用它代替密码进行登录。\n\
    \n如果使用 Windows，可以使用 PuTTY 生成密钥：\n\n+ - 将公钥拷贝到这里 ~/.ssh/authorized_keys ，并将私钥保存在\
    \ PC 上。\n- 如果你想保护密钥，更改 authorized_keys 的权限：\n  `# chmod 600 ~/.ssh/authorized_keys`\n\
    - 在 PuTTY 中，点击“Save Private Key”。\n\n在 Linux 中，你可以通过这种方式生成密钥：\n\n+ - 输入 `ssh-keygen\
    \ -t rsa`\n- 现在，接受推荐的保存位置并输入你的密码短语。id_rsa.pub 的内容应该被复制到 ~/.ssh/authorized_keys，但这可以轻松完成：\n\
    \  `# ssh-copy-id user@IP -p PORTNUMBER`\n- 一旦你看到可以使用私钥连接到树莓派，返回 /etc/ssh/sshd_config\
    \ 禁用密码登录：\n  `PasswordAuthentication no`\n最棒的一点是你实际上可以添加多个公钥。例如，如果你想允许他人访问你的树莓派，只需向他们索要公钥并将密钥添加到你的\
    \ authorized_keys 文件中即可。\n\n+ 还有一件事要做，就是安装 fail2ban。这将封禁所有恶意 IP 并对抗各种攻击：\n\n```bash\n\
    # apt-get install fail2ban\n```\n\n现在，打开配置文件以编辑 `sudo nano /etc/fail2ban/jail.local`，并粘贴以下：\n\
    \n```ini\n# SSH\n# 3次重试失败：封禁 10 分钟\n[ssh]\nenabled = true\nmaxretry = 3\nbantime\
    \ = 600\nignoreip = 192.168.0.0/24\n\n[ssh-ddos]\nenabled = true\nmaxretry = 10\n\
    bantime = 60\nignoreip = 192.168.0.0/24\n```\n\n+ 现在重启 fail2ban：\n\n```bash\n\
    sudo /etc/init.d/fail2ban restart\n```\n\n# 传输文件\n\n如果你认为 SSH 仅用于执行命令，那么你就错了。SSH\
    \ 也提供了传输文件的机会。\n\n如果你想执行简单的文件传输，这个命令可以帮助你：\n\n```bash\n$ scp /path/to/src user@IP:/path/to\n\
    ```\n\n然而，如果你在寻找更强大的命令，可以使用这个：\n\n```bash\n$ rsync /path/to/src user@IP:/path/to\
    \ -av\n```\n\n如果你是 Windows 用户，可以使用 WinSCP，可以从 http://winscp.net 。它的 GUI 使用密钥，并允许你在\
    \ PC 和 Pi 之间传输文件。\n\n# X11 转发\n\n好了，你现在可以执行命令并传输文件。但你还需要考虑到 GUI。X 窗口系统可以使用远程显示，你可以使用\
    \ SSH 将 GUI 程序转发到本地 X 服务器。\n\n如果你使用 Linux，可以像以前一样启动 SSH，只需增加 -Y 参数。当你的 SSH 会话准备就绪，启动\
    \ leafpad\n\n如果你是 Windows 用户，你需要运行一个 X 服务器。这里是一些可选方案：\n\n- Cygwin/X 可以从 http://x.cywin.com/\
    \ 找到。\n- Xming，位于 http://sourceforge.net/projects/xming/。\n- VcXrv 可在此获取：http://sourceforge.net/projects/vcxsrv/\n\
    \n# 使用 Screen 维持远程会话\n\n虽然 screen 和 ssh 并不直接相关，但它们是黄金组合。思考一下如果在你的 SSH 会话期间连接中断会发生什么。显然，一切都会丢失。这就是为什么\
    \ screen 如此重要。通过 screen，你可以根据需要轻松地重新连接和分离。例如，如果你的连接中断了，你可以重新连接\n\n"
