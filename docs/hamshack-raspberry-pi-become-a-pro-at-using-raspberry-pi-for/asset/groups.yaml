    # Transferring Files'
  - '[PAGE 20]


    If you thought that SSH was only great for allowing us to execute remote commands,
    you were wrong. SSH also gives us the chance to transfer files.


    If you want to perform a simple file transfer, this command will help you do that:


    ```

    $ scp /path/to/src user@IP:/path/to/dst

    ```


    However, if you are looking for a bit more powerful command, then this is the
    one:


    ```

    $ rsync /path/to/src user@IP:/path/to/dst -av

    ```


    If you are a Windows user, you can do this with WinSCP, which can be found at
    http://winscp.net . Its GUI usesTTY for private keys, and also allows you to transfer
    files between your PC and Pi.


    # X11 Forwarding


    Great, you can now execute commands and transfer files remotely. But the other
    thing you need to have in mind is the GUI. The X Window System can use a remote
    display in mind, and you can use SSH to forward GUI programs to the local X server
    remotely.


    If you use Linux, you can launch SSH as before, only with the addition of the
    -Y option. When your SSH session is ready, launch leafpad


    If you are a Windows user, you will need to have an X server running. Here are
    some options for that:


    +   - Cygwin/X that can be found at http://x.cywin.com/.

    - Xming, found at http://sourceforge.net/projects/xming/.

    - VcXrv is available here:

    http://sourceforge.net/projects/vcxsrv/.


    # Maintaining the Remote Session with Screen


    Although screen and ssh are not exactly related, they make a combo.

    Think about what would happen if your connection dropped during a SSH session.
    Obviously, everything would be lost. That is why screen is so important. With
    screen, you can easily re-attach and detach as needed. For instance, if your connection
    drops, you can re-attach'
