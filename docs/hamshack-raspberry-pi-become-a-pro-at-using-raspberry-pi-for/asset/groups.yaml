    # Introduction


    Whether you have already received your Ham license, or plan on receiving one,
    choosing to read this book is definitely a smart move.


    Everything cool that you have ever heard about radio stations such as communicating
    in Morse code, tracking satellites, or even playing a simple game over the air,
    this book will teach you in no time.


    And the best part? You don''t have to spend thousands or even hundreds of dollars
    to do so. A cheap Raspberry Pi computer and some other inexpensive tools, is all
    all you need to start your amateur radio journey.


    And if you think that just because you haven''t been properly introduced to the
    tiny computer called Raspberry Pi is a reason to skip reading this book, then
    you couldn''t be more wrong.


    From the moment you buy your Pi, to the actual playing with your hamshack RPi,
    this book will guide you through the whole process of learning to install, configure,
    and operate with Raspberry Pi in order to enjoy the coolest hobby in the world.


    Sounds like a great deal? Now let''s play with the airwaves, shall we?'
