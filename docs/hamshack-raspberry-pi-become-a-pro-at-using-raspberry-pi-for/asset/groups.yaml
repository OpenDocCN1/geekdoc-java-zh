    # 安装并配置 AX.25


    无线电所需的一切都运行在 AX.25 协议之上。这就是为什么安装它至关重要：


    ```

    pi@raspberrypi:~ $ sudo apt-get install ax25-tools ax25-node ax25-apps

    ```


    现在，让我们配置作为无线电网络接口的 AX.25 端口：


    ```

    pi@raspberrypi:~ $ sudo nano /etc/ax25/exports

