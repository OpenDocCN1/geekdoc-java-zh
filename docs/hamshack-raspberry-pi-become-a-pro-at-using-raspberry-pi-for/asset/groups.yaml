    +   2. In /etc/lightdm/lightdm.conf, set the autologin-user variable, as it is
    required. Know that commenting with a # will provide you with a login window every
    time that you boot your Pi, which is way more secure, and especially beneficial
    if you have more than one user.


    If you want to accomplish the reverse, simply disable the LightDM.


    # Accessing Pi Remotely


    After installing your OS, you can start developing with a USB keyboard, USB mouse,
    and an HDMI screen. However, if you don''t have these accessories, all is not
    lost. You can still access your Pi remotely. There are a couple of ways to do
    this.


    # SSH Remote Server


    SSH is a great remote server that can be used for most of the remote administration
    processes. And since Pi is a great ‘headless’ server, the remote server can be
    installed by default in the Raspian. In Linux, you can connect to SSH easily with
    the ssh command:


    ```

    ssh user@IP:port

    ```


    If you are using Windows, the SSH connection can be made with PuTTY, that you
    can download from http://www.chiark.greenend.org/~sgtaham/putty/. Securing the
    SSH


    In case you want to access the Pi from outside the local network, then you should
    be super careful and do everything you can protect it from unwanted bots and hackers.
    Most bots tend to connect to the port 22 and then brute force the password, and
    even if the password is secure, this can still file the logs with multiple failed
    attempts to establish a connection.'
  - "[PAGE 18]\n\nThe simplest way to protect yourself is by changing the port number\
    \ and disabling the option for root login over the SSH. To do this, edit the /etc/ssh/sshd_config\
    \ and set up these options:\n\n```\nPort 1286 #Any unused port number is fine\n\
    PermitRootLogin no\n```\n\nBut this won't stop someone from scanning your open\
    \ ports. The ideal thing is to disable any password login and use only keys for\
    \ this purpose. To do this, you need to generate two keys – public and private.\
    \ Send the public key to a remote server, and keep the private key, well, private,\
    \ and use it instead of a password for login.\n\nIf using Windows, you can generate\
    \ the keys with the PuTTY:\n\n+   - Copy the public key here ~/.ssh/authorized_keys\
    \ , and save the private key on your PC.\n- Change the authorized_keys permissions,\
    \ if you want to protect the key:\n# chmod 600 ~/.ssh/authorized_keys\n- In PuTTY,\
    \ click ‘Save Private Key’.\n\nIn Linux, you can generate the keys this way:\n\
    \n+   - By typing ssh-keygen -t rsa\n- Now, accept recommended save location and\
    \ enter your passphrase. The content from id_rsa.pb should be copied to ~/.ssh/authorized_keys,\
    \ but that can be easily done with:\n# ssh-copy-id user@IP -p PORTNUMBER\n- Once\
    \ you see that you can connect to your Pi with the private key, go back to /etc/ssh/sshd_config\
    \ to disable the password logins:\nPasswordAuthentication no\n The best thing\
    \ is that you can actually add multiple public keys. For instance, if you want\
    \ to allow someone else to access your Pi,"
  - '[PAGE 19]


    you can simply ask them for their public key and add the key to

    your authorized_keys file.\n


    +   There is one more thing to do, and that is to install fail2ban. This will
    ban all of the malicious IPs and fight various attacks:


    ```

    # apt-get install fail2ban

    ```


    Now, open the configuration file in order to edit the Sudo nano

    /etc/fail2ban/jail.local , and paste this:


    ```

    # SSH

    # 3 failed retry: Ban for 10 minutes

    [ssh]

    enabled = true

    port = ssh

    filter = iptables[name=SSH, port=ssh, protocol=tcp]

    mail-whos-lines[name=%(__name__)s,dest=%destemail)s,

    logpath=%(logpath)s

    logpath = /var/log/auth.log

    maxretry = 3

    bantime = 600

    ignoreip = 192.168.0/10


    [ssh-ddos]

    enabled = true

    port = ssh

    filter = sshd-ddos

    action = iptables[name=SSH, port=ssh, protocol=tcp]

