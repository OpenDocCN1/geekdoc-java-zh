    way. So it is understandable just how much a cheap learning platform was needed.


    Trying to realize their idea, the Pi creators played around with various microcontrollers,
    PCBs, and breadboards, but it wasn''t until 2008 that their concept became a reality
    thanks to the newer technology and cheaper chips. The new powerful tools helped
    them create a platform that was not only able to teach command-line programming
    but also supported media. Joined by David Braben and Pete Lomas, the original
    creators formed the now-popular Raspberry Pi Foundation, and only three years
    later, in 2011, the first Raspberry Pi hit the market.


    With the rise of technology many different models of Raspberry Pi have been created,
    each of them offering better features than their ancestors.'
  - '[PAGE 8]


    # The Hardware


    If you have already purchased your Raspberry Pi, you may have already noticed
    how ‘naked’ the device actually comes. Its price may be cheap, about $35, but
    there are some hidden costs involved. The Pi may be a computer on its own for
    sure, however, you need a couple of other things to make it work as it should.


    A 5V Power Supply. For a device that is USB-powered, everyone can agree that the
    Raspberry Pi, no matter what flavor you have, is hungry for power. It draws around
    600 to 700 mA. And while it can be powered from the USB port — which is rated
    at around 500 mA, it is important that you use an actual powered adapter. You
    can use a modern smartphone charger since most of them supply 700 mA at 5V, however,
    to check if yours are at the bottom of the charger.


    If you don’t have a quality charger, once other devices such as a camera module
    or a simple Wi-Fi dong are connected, they will draw more power from the Pi and
    it may become unstable.


    On the other hand, if the power supply doesn’t deliver solid 5V, and maybe provides
    too much power, the board can easily get tired.

    Great third-party vendors who can provide your Pi with adequate power are:


    +   - AdaFruit

    - MoodMyPi

    - SparkFun


    **SD Card.** Its small and its super powerful, but the Raspberry Pi does not have
    the capability to store data onboard. That is why, and SD (Secure Digital) Card
    — a removable storage device – is essential.

    Here is what you need to look for when shopping for an SD card for your Raspberry
    Pi:


    +   - A Standard SD Card. Your Pi supports a standard SD card, not a Mini or a
    Micro SD, however, you can use an adapter to convert these if you happen to have
    a Micro or Mini.


    +   - A trustworthy brand. Avoid the cheap choices and choose good quality SD
    card such as Kingston, SanDisk or Transcend.'
- md: '

    - At least 4 GB of capacity

    - Class 4 or higher. The class is important because it indicates how quickly the
    card can actually write and read data. For instance, an SD card of class 4 can
    read and write MB per second. Class 6 is faster with 6 MB per second, class 10
    can read 10 MB per second, . . .


    Keep in mind that the Standard SD card comes in SDHC (Secure Digital High Capacity)
    and SDXC (Secure Digital Extended Capacity). Make sure to check your Pi''s compatibility
    and see which one is best for your device. The SDHC goes up to 32 GB, and the
    SDXC up to 2T.


    **Powered USB Hub.** An USB hub is a compact device that can host a couple of
    USB devices. For instance, if you have the low-cost Raspberry Pi, you may have
    only one or two ports. Plug your mouse and keyboard and you have no way to plug
    anything else. That is why an USB hub is one of the main things Raspberry Pi owners
    buy right after purchasing their computer.


    **Ethernet Cable.** If you want to connect your Raspberry Pi to the Internet (and
    of course you do), then, besides the obvious Internet connectivity, you will need
    an Ethernet cable to do so. You plug one end of the Ethernet cable in your Pi
    and the other in your Wireless router, cable modem, or whatever device you have
    for connecting to the internet.


    **Monitor.** Even if you plan on using the Raspberry Pi headlessly and remotely,
    chances are that sooner than later, you''ll want to plug your computer into a
    monitor or a TV.


    **Cables.** To plug your Raspberry Pi into a monitor or TV, you will need cables.
    For this purpose, you will probably need an HDMI cable or a composite video cable.

    In case you will be using analog video, you will also need a 3.5 mm stereo audio
    cable whether you want to get a sound after connecting it to your TV or monitor,
    or plan on connecting it to external speakers.


    **USB Mouse and Keyboard.** As a computer, the Raspberry Pi also requires a keyboard
    and a mouse. You can use both wired and wireless, however, know that many users
    have reported some issues with the wireless keyboards and mice, as most Pi models
    require that you unplug and plug back in, when the Pi reboots.


    # Getting Started with Pi


    Now that you know what you need to start your Raspberry Pi journey, the next step
    is to actually get started with this amazing tiny computer. Before we begin setting
    up the radio and learn about different radio program for your Ham Shack home,
    it is essential that we first learn how to actually set everything in order to
    be able to let your DJ skills run wild.


    In this chapter you will learn everything about installing and getting started
    with your new Raspberry Pi. I promise that when you go to the next chapter, you
    will no longer feel intimidated by the raw computer board you bought the other
    day. So let''s get started, shall we?


    # The Installation


    Now, it is time to actually install an operating system on your Raspberry Pi.
    Unlike traditional computers, the OS on the Raspberry Pi is not installed on a
    hard drive (since the Pi doesn''t have one), but on the SD card. There are many
    ways in which you can install an OS on your Pi, however, this is the best and
    most convenient one.


    # NOOBS and BerryBoot


    NOOBS or New Out of the Box Setup is the official installation method created
    by the Raspberry Pi Foundation, with the purpose of simplifying things for beginners
    and adding multiple support tools for different operating systems on a single
    card. It is the BerryBoot precedes NOOBS and actually supports more operating
    systems, has the ability to actually install them on a USB stick, as well as back
    up, clone, and restore OS.


    Here is what you need to do in install NOOBS and BerryBoot:


    - Go to http://www.berryterminal.com/doku.php/berryboot and download BerryBoot,
    or go to http://www.raspberrypi.org/downloads to download NOOBS.

    - Depending on which OS you use, format your SD card as FAT32.

    - If you have Windows, then it is suggested that you use the SD Association''s
    SD Formatter. Go to https://www.sdcard.org/downloads/formatter_4/ to access it.

    - If you are a Linux user, stick to GParted.

    - Now it is time to extract the downloaded archive on the SD card.


    # Installing Raspbian with RAW Images


    This is the original method used for installing an operating system on an SD card.
    The RAW images have all the necessary binary data, including the Master Boot Record,
    as well as all the partitions.

    The biggest advantage of this method is that it supports every OS, and there is
    not much that can go wrong, however, the disadvantage lies in the fact that it
    is not that flexible. It is somewhat hard to boot multiple system on the same
    card. Besides, the image file has a static partition table which means that you
    will have a lot of free, but unused space.


    # Writing Images with Windows


    - Go to https://launchpad.net/win32-image-writer and download the Win32 Disk.

    - Select the right image file.

    - In the drop-down menu, find and select your SD card.

    - Click ‘Write’ and eject the card.


    # Writing Images with Linux


    - First, make sure that the SD card is not mounted.

    - Replace the mmcblk0 with the right device in order to write to the disk. To
    do this, you have to run this command:

    `# dd if=file.img of=/dev/mmcblk0 bs=4M`


    - It is important that you run this command: `# sync`, in order to flush the filesystem
    buffers before you remove the SD card.


    # Booting


    Now that you have installed Raspbian and have the image written, it is time to
    perform the initial setup by booting your Pi for the very first time. The best
    way to do so is by using a keyboard, monitor, and a mouse.


    Insert the card and connect the monitor, keyboard, and mouse. When asked for a
    username, type pi, and when asked for a password, type raspberry. Finally, type
    startx and load the familiar UI.

    After simply connect the Ethernet cable to the Raspberry Pi.


    # Expanding the Filesystem


    If you have Raspbian, you can do this automatically by choosing Expand Filesystem
    found in the raspi-config script. There is also a way for you to manually launch
    it if you choose to run sudo raspi-config . However, if you are not provided with
    an automated way to do it, you can actually expand the filesystem on the Raspberry
    Pi.


    1. Launch the fdisk by typing:

    `# fdisk /dev/mmcblk0`

    2. Press p and enter. The display should read something like:

    ```

    Command (m for help): p

    Disk /dev/mmcblk0: 29.7 GiB, 31918653440 bytes, 62341120 sectors

    Units: sectors of 1 * 512 = 512 bytes

    Sector size (logical/physical): 512 bytes / 512 bytes

    I/O size (minimum/optimal): 512 bytes / 512 bytes

    Disklabel type: dos

    Disk identifier: 0x417ee54b

    ```


    | Device | Boot | Start | End | Blocks | Id | System |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | /dev/mmcblk0p1 | | 2048 | 186367 | 92160 | c | W95 FAT32 (LBA) |

    | /dev/mmcblk0p2 | | 186368 | 3667967 | 1740800 | 5 | Extended |

    | /dev/mmcblk0p5 | | 188416 | 3667967 | 1739776 | 83 | Linux |


    3. The card has an extended partition P2 that has a logical side, a partition
    p5. You need to remove P2 so that P5 can be deleted automatically.


    Command (m for help): d

    Partition number (1,2,5, default 5): 2


    Partition 2 has been deleted.


    4. Now you need to create a new extended partition in place of the one you have
    just deleted. The first sector of that partition has to match the sector of the
    deleted partition. After that, simply accept the recommended last sector so that
    it can use up the free space automatically.


    Command (m for help): n


    Partition type :

    * p primary (1 primary, 0 extended, 3 free)

    * extended


    Select (default p): e

    Partition number (2-4, default 2): 2

    First sector (186368-62341119), +size{K,M,G,T,P} (186368-62341119):

    Last sector, +sectors or +size{K,M,G,T,P} (186368-62341119), default 62341119):

    Created a new partition 2 of type ''Extended'' and of size 29.7 GiB.


    5. Create a new logical partition instead of the deleted one and also make sure
    that this matches the old one''s start sector:


    Command (m for help): n


    Partition type:

    * p primary (1 primary, 1 extended, 2 free)

    * logical (numbered from 5)


    Select (default p): 1

