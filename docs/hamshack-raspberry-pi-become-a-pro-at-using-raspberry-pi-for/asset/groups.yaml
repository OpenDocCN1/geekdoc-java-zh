    After making sure that the AX.25 is up and running, we can now setup the packet
    node, in a way that it can startup automatically right after boot, as well as
    listen for incoming connections with the right prompt, commands, and permissions.


    Let''s first edit the file in charge for controlling the node''s main settings,
    and that is the node.conf file.


    ```

    pi@raspberrypi:~$ sudo nano /etc/ax25/node.conf

    ```


    Although for most of the file you won''t have to change the default settings,
    the HostName and the NodeId should be altered. Pay attention that you also configure
    the Nport to the already specified port name.


    Here is an example of what that should look like:


    ```

    Host KE7SAL-9

    NodeId CARMEL:KE7SAL-9

    NrPort netrom

    ```


    Let''s add the node''s permission. If you want to, you can make it that way that
    your user needs a password.


    ```

    Letpi@raspberrypi:~$ sudo nano /etc/ax25/node.perms

    ```


    Read the node.perms page to see what are the settings and permissions. In this
    example, this is what the node.perms file looks like:


    ```

    .pe# user type passwd perms

    ke7sal * * PASS 25 5

    ```


    ```

    # Default permissions per connection type.

    #

    * ax25** * 7

    * netrom ** * 7

    * local ** * 7

    * ampr ** * 7

    * inet ** * 7

    * host ** * 7

    ```


    Now, let''s configure the broadcasting of netrom. This is important as it will
    tell the node how to actually process other nodes'' broadcasts. Plus, it allows
    you to configure the settings of your broadcasts.'
- md: "\n```\npi@raspberrypi:~ $ sudo nano /etc/ax25/nrbroadcast\n```\n\nThe main\
    \ page holds a lot of information. The setup of this example looks like this:\n\
    \n```\n# ax25_name min_obs def_qual worst_qual verbose\n0 5 192 100 0\n```\n\n\
    It is now time to create the netrom port:\n\n```\npi@raspberrypi:~ $ sudo nrattach\
    \ notch m\n```\n\nSetting it up as a TCP/IP service will make it an easier to\
    \ connect to the local packet node directly from the shell. Let's define the port\
    \ and service first though:\n\n```\npi@raspberrypi:~ $ sudo nano /etc/services\n\
    ```\n\nAt the bottom, add this line:\n\n```\nax25-node    4444/tcp    # KE7SAL\
    \ packet node\n```\n\nHere you can actually change the 4444 port to any other\
    \ port that is unused. Let's make the service start automatically right after\
    \ boot:\n\n```\npi@raspberrypi:~ $ sudo nano /etc/inetd.conf\n```\n\nAt the bottom:\n\
    \n```\nax25-node stream tcp nowait root /usr/bin/ax25-node ax25-node\n```\n\n\
    Now, you can restart the service:\n\n```\npi@raspberrypi:~ $ sudo service inetd\
    \ restart\n```\n\nAll of this enables you to telnet into the local packet node\
    \ straight from the command line. Also, you can telnet it from any other system,\
    \ just as long as your Raspberry Pi is on that same network, and the 4444 port\
    \ is opened to remote the connections.\n\n```\nSpi@raspberrypi:~ $ telnet localhost\
    \ 4444\nTrying ::1...\nTrying 127.0.0.1...\nConnected to localhost.\n```\n\nEscape\
    \ character is '^]'.\n\nLinuxNode v0.3.2 (KE7SAL-9)\n\nlogin:\n\nGreat! Now simply\
    \ log in with your callsign. You should see something like this:\n\n#CARMEL:KE7SAL-9\
    \ Welcome to KE7SAL-9 network node\n\nType ? for a list of commands. help <commandname>\
    \ gives a description of the named command.\n\n--\n\nIf you want to get a list\
    \ of all the commands, just type ‘?’. Now, tune the radio of the node, and issue\
    \ a call with AX25. You can change this with your node, by adding:\n\nC 0 WALKER\n\
    \nOf course you will need to update this command line. C means CONNECT, and it\
    \ doesn’t necessarily have to be changed. 0 represents the AX.25 port that we\
    \ configured earlier. And WALKER is an alias of a local packet node. You will\
    \ have to change this with the alias of your own local packet node. You should\
    \ get something like this:\n\n```\n#CARMEL:KE7SAL-9 Trying WALKER on port 0...\
    \ Type <RETURN> to abort\n#CARMEL:KE7SAL-9 Connected to WALKER on port 0 (Escape:\
    \ CTRL-T)\n```\n\nNow, disconnect:\n\n```\n#CARMEL:KE7SAL-9 Trying WALKER on port\
    \ 0... Type <RETURN> to abort\n#CARMEL:KE7SAL-9 Connected to WALKER on port 0\
    \ (Escape: CTRL-T)\nbye\n#CARMEL:KE7SAL-9 Reconnected to KE7SAL-9\n```\n\nbye\n\
    #CARMEL:KE7SAL-9 Goodbye\nConnection closed by foreign host.\n\nWe want our node\
    \ to listen for other nodes’ netrom broadcasts, as well as to ensure that we actually\
    \ have a server that is listening for other systems’ incoming connections. That\
    \ can be done with two simple lines:\n\n```\npi@raspberrypi:~ $ sudo netromd\n\
    pi@raspberrypi:~ $ sudo ax25d\n```\n\nAnd we have successfully configured it.\n\
    \n## Starting the Node Boot\n\nThere are a couple of ways to do this, however,\
    \ we will choose the simplest option. We will simply dump all the command in one\
    \ place - /etc/rc.local\n\n```\npi@raspberrypi:~ $ sudo nano /etc/rc.local\n```\n\
    \nBefore the edit line, add the text from below:\n\n```\n/sbin/modprobe ax25 #\
    \ Load ax.25 kernel module\n/sbin/modprobe netrom # Load netrom kernel module\n\
    /usr/sbin/kissatatch /dev/ttyUSB0 0 # Create the AX.25 interface\n/usr/sbin/nratatch\
    \ netrom # Create the netrom interface\n/usr/sbin/netromd # Start the netrom service\n\
    /usr/sbin/ax25d # Start ax.25 service and start listening\n```\n\nNow, simply\
    \ reboot your Raspberry Pi: \n\n```\npi@raspberrypi:~ $ sudo reboot\n```\n\n##\
    \ Back Up the Node List\n\nUsually, the node broadcast list every 30 – 60 minutes.\
    \ Once the node sees a list, it automatically updates its table. After rebooting\
    \ the node, the list is emptied, and the node becomes more difficult to use. In\
    \ that case you simply need to wait for more broadcasts. If you want to make things\
    \ a bit smoother, back up your node on regular basis, and restore the list at\
    \ boot.\n\nFirst, you need to create the restore script:\n\n```\npi@raspberrypi:~\
    \ $ sudo touch /etc/ax25/nodebackup.sh\npi@raspberrypi:~ $ sudo chmod u+x /etc/ax25/nodebackup.sh\n\
    ```\n\nIf you create a cron job you can backup the nodes regularly:\n\n```\npi@raspberrypi:~\
    \ $ sudo crontab -e\n```\n\nIn this example, this line sets it to run every 60\
    \ minutes:\n\n```\n0 * * * * /usr/sbin/nodesave /etc/ax25/nodebackup.sh\n```\n\
    \nMake the file to be executable, and run it at boot:\n\n```\n/etc/ax25/nodebackup.sh\n\
    ```\n\nYou need to wait for the node list to populate first, before checking how\
    \ this works.\n\n```\npi@raspberrypi:~ $ sg cat /etc/ax25/nodebackup.sh\n```\n\
    \nNow simply reboot. When your Raspberry Pi is online again, log back into the\
    \ packet node to list the known nodes. If it's not empty, then everything works\
    \ fine.\n\n## Playing Zork over the Air\n\nHaving a packet node is really amazing.\
    \ And while the nodes mostly exist for emergency purposes, there are some pretty\
    \ great uses you can find for your packet radio. And since everything in this\
    \ set will probably cost you around $100, I say that it is a pretty affordable\
    \ hobby.\n\nIf waiting for an emergency or hopping from node to node, mapping\
    \ them all together gets kind of boring, here is a great use for your brand new\
    \ radio packet node. With this example, you can learn how to play Zork over the\
    \ air, and if that's not amazing, I really don't know what is.\n\nBut in order\
    \ for you to be able to play Zork on Linux, you will first need an emulator. A\
    \ great emulator for this purpose is frotz:\n\n```\npi@raspberrypi:~ $ sudo apt-get\
    \ install frotz\n```\n\nAfter that, you can simply download Zork directly from\
    \ infocom:\n\n```\npi@raspberry:~ $ mkdir ~/games\npi@raspberry:~ $ mkdir ~/games/zork\n\
    pi@raspberry:~ $ cd ~/games/zork\npi@raspberry:~/games/zork $ curl http://www.infocom.org/downloads/zork1.Zip\
    \ > zork.zip\npi@raspberry:~/games/zork $ unzip zork.zip\n```\n\nAfter your download\
    \ completes successfully, you can launch Zork locally:\n\n```\npi@raspberry:~/games/zork\
    \ $ frotz DATA/ZORK1.DAT\n```\n\nNow you have to find a way in which the node\
    \ users can actually launch the Frotz emulator and play Zork. In order to launch\
    \ the application right way, first have to create a shell script:\n\n```\npi@raspberry:~\
    \ ~ nano zork.sh\n```\n\nAfter you have created the script, add this:\n\n```bash\n\
    #!/bin/bash\nexport HOME=\"/home/pi\"\nexport TERM=\"linux\"\n/usr/games/frotz/home/pi/zork/DATA/ZORK1.DAT\n\
    ```\n\nAllow the execution:\n\n```\npi@raspberry:~ ~ chmod u+x zork.sh\n```\n\n\
    Normally, when you launch Zork you have to type the last line only. However, when\
    \ you launch it from AX25 port, Frotz will not launch if you do not export the\
    \ terminal variables. Since we already have the script, the only thing we need\
    \ to do is to create a new command on the node:\n\n```\npi@raspberrypi:~ ~ sudo\
    \ nano /etc/ax25/node.conf\n```\n\nGo to the bottom of the ExtCmd section, and\
    \ add the following:\n\n```\nExtCmd Zork 1 /home/pi/zork.sh NULL\n```\n\nThis\
    \ will create the command Zork. We use capital ZO so you don't have to use the\
    \ entire name all the time. Make sure that you have the NULL portion there, otherwise\
    \ the note will not execute.\n"
