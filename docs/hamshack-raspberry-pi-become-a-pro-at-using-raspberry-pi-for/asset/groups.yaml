    Command (m for help): d

    Partition number (1,2,5, default 5): 2


    分区 2 已删除。


    4. 现在你需要在刚刚删除的地方创建一个新的扩展分区。该分区的扇区必须与被删除区的扇区匹配。之后，只需接受建议的最后一个扇区即可用尽空闲空间。


