    # Ham Radio Projects for the RPi


    Once you get your own ham radio up and running, you will notice that there are
    literally dozens of things you can actually do with it, and not have to use it
    for emergency purposes only. It may seem overwhelming or even impossible for you
    to be able to send and track radio signals at this point, but believe me, once
    you try the amazing projects from this chapter, you will not only see how great
    of a hobby having a ham radio is, but that it can also be easily mastered.


    Although you can try any of these programs first, I really suggest that you follow
    the order in which they are listed since I have put a lot of thought to arrange
    them in a way that will help you to quickly master Ham Radio. Shall we start?


    # Digital Modulation with Fldig


    First of all, let me briefly explain what digital modes are and why they are important.
    Digital modes represent a means of Amateur operating with the help of a keyboard.
    The computer here acts as a modem, or a modulator–demodulator, allows you to type,
    as well as to see what someone else types. It is in charge of controlling the
    transmitter, providing helpful features, as well as changing the modes as needed.
    In this case, the modes are used on high frequency bands, which is especially
    the case with the chat modes – those that are used to have a conversation with
    Morse – that will let different operators to take part in a single net.


    Raspberry Pi can use the USB card''s audio input in order to decode these digital
    modes. The most popular and effective program that supports these modes that ham
    radio users use today, is Fldigi. This program operates in conjunction with a
    HF SSB radio transceiver and uses the USB card to input from, and sends output
    to the radio.


    The best thing about Fldigi is that it is multi-mode, which basically means that
    it can operate multiple modes, without having to switch programs. Fldigi includes
    all of the popular modes:


    - THOR

    - CW

    - PSK

    - Concordia

    - Throb

    - NAVTEXT/SITB

    - Hell

    - Olivia

    - 8PSK

    - RTTY

    - DominoX

    - MFSK

    - MT63

    - QPSK

    - WEFAX


    Here is how you can install Fldigi with the PIXEL Desktop GUI:


    1. Open the top left Application Menu from the PIXEL GUI. Select Preferences,
    and then choose Add/Remove Software

    2. Search for Fldigi, and check on the box to select

    3. Find the Apply button and click on it in order to install Fldigi


    After installing it, you can launch the program by simply opening the top left
    Application Menu in the PIXEL GUI and selecting Internet, Fldigi.


    Hardware Configuration for Modulation and Demodulation:


    - Yaesu Data Cable, CT-39

    - CT-39 Data Out cable, 1200 bps – plugged into the FT-857D

    - CT-39 Data Out, connected to the Behringer Xenyx 320 USB’s line input

    - CT-39 Data In, plugged into the speaker jack of the Raspberry Pi


    Hardware Configuration for Radio Control:


    - Raspberry Pi P3 Model B

    - Yaesu Cat Cable, CT-62

    - USB Dual Serial Adapter (Micro Connectors. Inc)

    - Yaesu transceiver, FT-857D


    Configuring the Ports of the Pi:


    - Make sure that the Raspberry Pi P3 Model B is powered on.

    - With a powered USB Hub, plug the USB Dual Serial Adapter into the USB port of
    the Pi

    - This is what should appear in the /dev/ directory: dev/ttyUSB0 /ttyUSB1

    - Plug the Yaesu CT-62 Cat Cable into the FT-857D transceiver

    - Turn on the FT-857D transceiver

    - Connect the Yaesu CT-62 cable to the Serial Dual Adapter RS-232 S1. The RS-232
    S1 connector is /dev/ttyUSB0.


    # Ham Radio World Clock


    There are a couple of clock programs that you can find, however, I strongly believe
    that Twclock is by far the best one. This program not only display the GMT and
    local time, but it will also display the time from hundreds of cities from all
    around the world. Besides, it comes with a built-in alarm that will tell you the
    time for station ID codes.

    This alarm can actually notify you in a couple of different ways. It can either
    blink the alarm button, send your call through your sound call in CW, or simply
    beep the connected speakers.


    The installation process is really simple, and it can be done with the CLI.


    First, you need to update the Pi’s repository index. That can be done with this
    command:


    ```

    sudo apt-get update

    ```


    Then, you will have to search the repository index and find the twclock program:


    ```

    apt-cache search twclock

    ```


    Finally, you can install the twclock with this command:

    ```bash

    sudo apt-get install twclock

    ```


    To start the Twclock, open the PIXEL’s top left Application Menu, then select
    Accessories, and Twclock. You will notice that this will open two twclock programs.
    One of them is for displaying the local time, and the other one is for the GMT
    time.


    If, for any reason, you want to uninstall the twclock, you can do it by typing
    this command:


    ```

    sudo apt-get uninstall twclock

    ```


    # SDR and GNU Radio


    Before explaining what GNU Radio is and how to install it, let me just tell that
    with Raspberry Pi, you can actually set up the cheapest SDR (Software Defined
    Radio) receiver. For this purpose, besides the Raspberry PI, you will also need
    a cheap RTL Dongle, and a USB sound card. And if you think that this is probably
    shabby, you will be surprised to hear that you can actually receive anywhere from
    25 MHz to incredible 1800 MHz. To create a pretty capable scanner, you simply
    need to attach this to a disco antenna.


    Of course, to turn this all into a reality, you will need to run SDR in the Raspbian.


    Now, about the GNU. GNU radio is a free software toolkit that is in charge of
    processing blocks in order to implement software defined radios. This can be used
    with some low-cost external hardware to create SDRs, or even in an environment
    that is simulation-like, without the hardware. This is mostly used by hobbyists
    who want to support the real-world radios, as well as their Wi-Fi communication
    research.


    In most cases, the applications for GNU Radio are written with the Python programming
    language, where the supplied signal processed path is implemented in the C++ language,
    and if possible, with some processor-floating extensions.


    This particular package comes with the gnuradio-companion, which is a graphical
    tool that can create signal flow graphs, as well as generate your source code.
    Many other helpful tools are also included.


    The installation method, again, uses the CLI. First of all, you will need to update
    the repository index of your Raspberry Pi:


    ```bash

    sudo apt-get update

    ```


    Then, you need to search the index to find gnuradio programs. You can do this
    with this command:


    ```bash

    apt-cache search gnuradio

    ```


    This is what you should find:


    ```

    pi@raspberrypi:~ $ apt-cache search gnuradio

    gnuradio - GNU Radio Software Radio Toolkit

    gnuradio-dev - GNU Software Defined Radio toolkit development

    gnuradio-doc - GNU Software Defined Radio toolkit documentation

    gr-air-modes - GNU Radio Mode-S/ADS-B radio

