    # 开始使用 Pi


    现在你已经知道开始树莓派之旅需要什么了，下一步是实际开始使用这台神奇的微型计算机。在我们开始设置无线电台并学习适用于你火电台（Ham Shack）的各种无线电程序之前，必须先学会如何安排一切，以便让你的
    DJ 技巧尽情发挥。


    在本章中你将学习关于安装和开始使用新树莓派的所有知识。我保证，当你进入下一章时，你将不再对几天前买的原始主板感到畏惧。那么，让我们开始吧？


    # 安装


    现在是时候在你的树莓派上安装操作系统了。与传统电脑不同，树莓派上的操作系统不是安装在硬盘上（因为 Pi 没有硬盘），而是安装在 SD 卡上。虽然有许多方法可以在
    Pi 上安装操作系统，但这种是最好也最方便的。


    # NOOBS 和 BerryBoot


    NOOBS（即 New Out of The Box Setup）是树莓派基金会创建的官方安装方法，目的是简化初学者的操作，并在单张卡上为不同的操作系统添加多个支持工具。BerryBoot
    先于 NOOBS 出现，它实际上支持更多的操作系统，并能够将它们安装在 USB 闪盘上，还可以备份、克隆和恢复操作系统。


    安装 NOOBS 和 BerryBoot 你需要执行以下操作：


    - 访问 http://www.berryterminal.com/doku.php/berryboot 下载 BerryBoot，或者访问 http://www.raspberrypi.org/downloads
    下载 NOOBS。

    - 根据你使用的操作系统，将你的 SD 卡格式化为 FAT32。

    - 如果你使用 Windows，建议使用 SD 协会的 SD Formatter。访问 https://www.sdcard.org/downloads/formatter_4/
    获取它。

    - 如果你是 Linux 用户，请坚持使用 GParted。

    - 现在是在向 SD 卡上解压下载的压缩包了。


    # 使用 RAW 镜像安装 Raspbian


    这是用于在 SD 卡上安装操作系统的原始方法。RAW 镜像包含了所有必要的二进制数据，包括主引导记录（MBR）以及所有分区。

    这种方法的最大优势是它支持每个操作系统，而且几乎不会出错，但缺点在于它的灵活性不够。在同一张卡上启动多个系统相当困难。此外，镜像文件具有静态分区表，这意味着你将有很多空闲但未使用的空间。


    # 在 Windows 上写入镜像


    - 访问 https://launchpad.net/win32-image-writer 并下载 Win32 Disk。

    - 选择正确的镜像文件。

    - 在下拉菜单中找到并选择你的 SD 卡。

    - 点击“写入”并弹出卡片。


    # 在 Linux 上写入镜像


    - 首先，确保 SD 卡未被挂载。

    - 将 `mmcblk0` 替换为正确的设备以向磁盘写入。为此，你必须运行此命令：

    `# dd if=file.img of=/dev/mmcblk0 bs=4M`


    - 运行此命令 `# sync` 是非常重要的，以便在移除 SD 卡之前刷新文件系统缓冲区。


    # 启动


    现在你已经安装了 Raspbian 并写入了镜像，是时候通过首次启动你的 Pi 来进行初始设置了。最好的方法是使用键盘、显示器和鼠标。


    插入卡片并连接显示器、键盘和鼠标。当提示用户名时，输入 `pi`，当提示密码时，输入 `raspberry`。最后，输入 `startx` 加载熟悉的 UI。

    只需将以太网线连接到树莓派即可。


    # 扩展文件系统


    如果你使用 Raspbian，可以通过 `raspi-config` 脚本中的 `Expand Filesystem`（扩展文件系统）自动完成此操作。如果你选择运行
    `sudo raspi-config`，也有手动启动它的方法。然而，如果没有提供自动处理的方法，你实际上可以在树莓派上扩展文件系统。


    1. 输入以下命令启动 fdisk：

    `# fdisk /dev/mmcblk0`

    2. 按 `p` 并回车。显示内容应类似于类似于：

    ```

    Command (m for help): p

    Disk /dev/mmcblk0: 29.7 GiB, 31918653440 bytes, 62341120 sectors

    Units: sectors of 1 * 512 = 512 bytes

    Sector size (logical/physical): 512 bytes / 512 bytes

    I/O size (minimum/optimal): 512 bytes / 512 bytes

    Disklabel type: dos

    Disk identifier: 0x417ee54b

