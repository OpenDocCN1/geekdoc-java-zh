    0000 Lane County ARES/RACES OADN RMS GatewayM

    0: fm KE7SAL-9 to W7EUG-10 ctl RR1v

    ```


    If you want to disconnect at this point, simply type Bye and then hit Enter.


    # Configuring the Packet Node'
