  md: 'After making sure that the AX.25 is up and running, we can now setup the packet
    node, in a way that it can startup automatically right after boot, as well as
    listen for incoming connections with the right prompt, commands, and permissions.


    Let''s first edit the file in charge for controlling the node''s main settings,
    and that is the node.conf file.


    ```

    pi@raspberrypi:~$ sudo nano /etc/ax25/node.conf

    ```


    Although for most of the file you won''t have to change the default settings,
    the HostName and the NodeId should be altered. Pay attention that you also configure
    the Nport to the already specified port name.


    Here is an example of what that should look like:


    ```

    Host KE7SAL-9

    NodeId CARMEL:KE7SAL-9

    NrPort netrom

    ```


    Let''s add the node''s permission. If you want to, you can make it that way that
    your user needs a password.


    ```

    Letpi@raspberrypi:~$ sudo nano /etc/ax25/node.perms

    ```


    Read the node.perms page to see what are the settings and permissions. In this
    example, this is what the node.perms file looks like:


    ```

    .pe# user type passwd perms

    ke7sal * * PASS 25 5

    ```


    ```

    # Default permissions per connection type.

    #

    * ax25** * 7

    * netrom ** * 7

    * local ** * 7

    * ampr ** * 7

    * inet ** * 7

    * host ** * 7

    ```


    Now, let''s configure the broadcasting of netrom. This is important as it will
    tell the node how to actually process other nodes'' broadcasts. Plus, it allows
    you to configure the settings of your broadcasts.'
  merge: -1
  pgno: 33
- img_proc: true
  md: '```

    pi@raspberrypi:~ $ sudo nano /etc/ax25/nrbroadcast

    ```


    The main page holds a lot of information. The setup of this example looks like
    this:


    ```

    # ax25_name min_obs def_qual worst_qual verbose

    0 5 192 100 0

    ```


    It is now time to create the netrom port:


    ```

    pi@raspberrypi:~ $ sudo nrattach notch m

    ```


    Setting it up as a TCP/IP service will make it a easier to connect to the local
    packet node directly from the shell. Let''s define the port and service first
    though:


    ```

    pi@raspberrypi:~ $ sudo nano /etc/services

    ```


    At the bottom, add this line:


    ```

    ax25-node    4444/tcp    # KE7SAL packet node

    ```


    Here you can actually change the 444 port to any other port that us unused. Let''s
    make the service start automatically right after boot:


    ```

    pi@raspberrypi:~ $ sudo nano /etc/inetd.conf

    ```


    At this at the bottom:


    ```

    ax25-node stream tcp nowait root /usr/bin/ax5-node ax25-node

    ```


    Now, you can restart the service:


    ```

    pi@raspberrypi:~ $ sudo service indes restart t

    ```


    All of enables you to telnet into the local packet node straight from the command
    line. Also, you can telnet it from any other system, just as long as your Raspberry
    Pi is on that same network, and the 4444 port is opened to remote the connections.


    ```

    Spi@raspberrypi:~ $ telnet localhost 4444

    Trying ::1...

    Trying 127.0.0.1...

    Connected to localhost.

    ```'
