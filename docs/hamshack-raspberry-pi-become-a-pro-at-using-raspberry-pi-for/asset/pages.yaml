    RX packets:0 errors:0 dropped:0 overruns:0 frame:0

    TX packets:0 errors:0 dropped:0 overruns:0 carrier:0

    collisions:0 txquencelen:10

    RX bytes:0 (0.0 B) TX bytes:0 (0.0 B)

    ```


    Now you should have no trouble testing your settings. First, set up a listener
    on the AX25 port, and then open a new SSH session, and run this this command:


    ```

    pi@raspberrypi:~ $ sudo axlisten -c -a

    ```


    After running this program, you will see that the program will go blank. You may
    think that the program is actually listening to the AX25 port and will display
    the packets spotted by your modem. If you stay tuned to a frequency that is active,
    some time you will be able to see the packet data displayed.


    You can also connect to a local packet station as a different test. Leave the
    axlisten command running, and you will see the outbound packets, just like any
    other response, really. This is excellent for debugging.\ Assuming that in this
    example, the radio is tuned to a frequency of 145.030 MHz, let''s initiate the
    connection now :


    ```

