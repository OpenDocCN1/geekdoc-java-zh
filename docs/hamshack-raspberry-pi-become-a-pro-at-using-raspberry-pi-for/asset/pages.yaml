- img_proc: true
  md: 'to the screen session and pick up where you left off. And since the Raspian
    doesn’t have the screen in its default setting, you need to install it with this
    command:


    ```

    # apt-get install screen

    ```


    After the installation, you can launch it by running:


    ```

    # screen n

    ```


    To get started, you need to add some bindings. You can do this with CTRL + and
    then another key. For instance, if you want to detach the screen session, you
    can do that by CTRL + and then d. Once you detach, you can go back by running:


    ```

    # screen -x

    ```


    # The Reverse SSH


    If your Pi is behind a firewall and doesn’t have access to port forwarding, then
    you cannot access it directly. But, in a case where the computer you want to connect
    to is not behind a firewall and is with an active SSH server, using a reverse
    SSH is the best choice.


    Start SSH with this command:


    ```

    $ ssh -N -R 2222:localhost:22 user@IP

    ```


    Here, -N means that you don’t want to execute other commands, and -R 2222:localhost:2
    means that the remote computer will tunnel the port 22 to port 2222.


    After that, you can connect to the port 2222 which will redirect you to port 22
    :


    ```

    $ ssh user@localhost -p 222 2

    ```


    # VNC and Virtual Display


    You can also use VNC to access the Pi remotely. VNC comes in two flavors. The
    first one x1lvnc allows that the display that the Pi is attached to mirrored remotely.
    The other one is called virtual display. Virtual display is not shown in the display,
    and is useful for those situations when you need to launch multiple VNC sessions
    that are independent. But,'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'you cannot connect to VNC without a VNC client. A perfect example is TightVNC.


    So, the only way you can actually use the display is if you have the x11vnc installed,
    and that can be done by running this:


    ```

    # apt-get install x11vnc

    ```


    However, to use the virtual display you will need to have TightVNC installed,
    which can be done by running this:


    ```

    # apt-get install tightvncserver

    ```


    When you run the vncserver the first time you will notice a couple of procedures.
    You need to pay attention to what the output is because you will find the display
    that the server is actually running on\If you want to stop running VNC you can
    do it by using the -kill option. This will kill the server with the display :1
    :


    ```

    $ vncserver -kill :1

    ```


    # Synergy


    There is also an option of sharing your mouse and keyboard across different systems.
    For instance, you can have a display that is connected to your Pi, and you can
    actually run it by the mouse and keyboard that are connected on your PC.


    Here is how you can do this:


    +   - Download a synergy server on your PC. You can find it at http://synergy-foss.org
    . Run it and follow the setup''s steps.

    - Install it on Pi with this command:

    # apt-get install synergy

    - Launch Synergy from the Pi''s desktop with this command:

    # synergyc IP'
