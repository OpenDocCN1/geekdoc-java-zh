    \ networks. That can be done with the command: sudo iwlist wlan0 scan . This will\
    \ give you a list of all the available wireless network, as well as some other\
    \ related information. Here is what you should look out for:\n- ‘ESSID:testing’\
    \ - that is the name of the wireless network.\n- IE: IEEE 802.11i/WPA2 Version\
    \ 1’ – that is the authentication that has been used. You will also need to know\
    \ the network’s password, which is mainly found at the bottom of the router. The\
    \ examples below have the ESSID – testing , and a password testingPassword\n\n\
    +   - Now, open this configuration file: wpa-supplicant in nano:\n\n```\nsudo\
    \ nano /etc/wpa_supplicant/wpa_supplicant.conf\n```\n\nGo to the bottom and add\
    \ paste this:\n\n```\nnetwork={\n  ssid=\"testing\"\n  psk=\"testingPassword\"\
    \n}\n```\n\nTo generate the encrypted password, you can use wpa_passphrase . Using\
    \ the examples from above, you can generate it with wpa_passphrase \"testing\"\
    \ \"testingPassword\" . You will get this output:\n\n```\nnetwork={\n  ssid=\"\
    testing\"\n  #psk=\"testingPassword\"\n```"
