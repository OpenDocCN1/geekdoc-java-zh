- img_proc: true
  md: '# Introducing Raspberry Pi


    Raspberry Pi (pronounced raspberry pie) is a tiny computer that has the size of
    a credit card. Seriously, the Raspberry Pi foundation used an actual credit card
    to be their template for the design of the printed circuit board (PCB) of this
    small computer.


    Raspberry Pi, or the Pi, or RasPi , or RPi , whatever nickname you like the most,
    believe it or not an actual computer. Its board features the typical hardware
    that is found in the desktop computers (such as RAM, processor, etc.), which means
    that this credit card-sized computer also enables you to edit documents, play
    audio and video, play games, do some coding, etc.


    Of course, its tiny size is not able to provide as much power as a normal desktop
    PC, however, its cheap price of approximately $35 makes up for everything. Actually,
    the main idea behind the birth of such a computer was to teach kids and about
    the basics of computer science with a minimal investment. It''s a lot more convenient
    to break a Raspberry Pi and replace it with a new one, learn about the software
    science with an actual desktop computer and spend a fortune to replace or fix
    what you''ve broken.


    Raspberry Pi is as yummy as its sounds. With this tiny computer you can actually
    move past the ''visible'', surface-level software and dive deeply into its ''black
    box'' – the internals that most people are unaware of. Starting the software education
    with a Raspberry Pi has proven to be the easiest way for people to adopt highly
    appreciated and super valuable software and hardware engineering skills.


    But Raspberry Pi isn''t only for these ''academics''. What''s even amazing about
    this credit card-like computer is that its fan base is super versatile. There
    are many DIYers and hackers that make Raspberry Pi an essential part of their
    computer experiments.


    # A Quick Ride Through History


    For those that are casually observing the development of the computer technology,
    it may seem that Raspberry Pi is brand new. And it''d'
  merge: -1
  pgno: 6
- img_proc: true
  md: 'seem like it, since most blogs and websites treat this computer that way. However,
    the truth is that Raspberry Pi has been around for years. In fact, the creators
    of the Pi – Rob Mullins, Eben Upton, Alan Mycroft, and Jack Lang – first came
    with the idea of making a tiny computer in 2006. This came as a result of their
    observation that the available cheap computers at that time (like the Amiga or
    the Spectrum) had a rather negative effect on the programming education, as they
    were slowing down the ability to learn the software science significantly. And
    since laptops and desktop computers cost hundreds, some even thousands of dollars,
    kids back then really couldn''t afford to mess with the main family computer that
    way. So it is understandable just how much a cheap learning platform was needed.


    Trying to realize their idea, the Pi creators played around with various microcontrollers,
    PCBs, and breadboards, but it wasn''t until 2008 that their concept became a reality
    thanks to the newer technology and cheaper chips. The new powerful tools helped
    them create a platform that was not only able to teach command-line programming
    but also supported media. Joined by David Braben and Pete Lomas, the original
    creators formed the now-popular Raspberry Pi Foundation, and only three years
    later, in 2011, the first Raspberry Pi hit the market.


    With the rise of technology many different models of Raspberry Pi have been created,
    each of them offering better features than their ancestors.'
  merge: -1
