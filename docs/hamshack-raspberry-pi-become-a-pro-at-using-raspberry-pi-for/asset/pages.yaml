    \ /etc/rc.local\n```\n\nBefore the edit line, add the text from below:\n\n```\n\
    /sbin/modprobe ax25 # Load ax.25 kernel modul\n/sbin/modprobe netrom # Load netrom\
    \ kernel module\n/usr/sbin/kississatatch /dev/ttyUSB0 0 # Create the AX.25 interface\n\
    /usr/sbin/nratatch netrom # Create the netrom interface\n/usr/sbin/netromd # Start\
    \ the netrom service\n/usr/sbin/ax25d # Start ax.25 service and start listening\n\
    ```\n\nNow, simply reboot your Raspberry Pi: \n\n```\npi@raspberrypi:~ $ sudo\
    \ reboot\n```\n\n# Back Up the Node List\n\nUsually, the node broadcast list every\
