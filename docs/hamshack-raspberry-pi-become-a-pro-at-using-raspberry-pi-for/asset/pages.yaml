    # Amateur Satellite Tracking


    Satellite tracking is definitely one of the simplest fun projects you can do with
    your Hamshank Raspberry Pi. In order for you to have fun tracking satellites,
    you will have to have the GPredict software installed first. GPredict or Gnome
    Predict, is a free and real-time satellite tracking program. This is an absolutely
    amazing software that includes these incredible features:


    +   - The tracking number of satellites is unlimited. Well, it is limited only
    by your computer''s processing power.

    - You can display the data in maps, lists, polar plots, or even combine them all
    together.

    - You can have multiple open modules at the same time.

    - You can also use many ground stations.

    - The information about the real time data, as well as the predicted passes, is
    extremely detailed.

    - Via Hamlib rigtd, it actually allows doppler radio tunings.


    Again, the installation process uses the CLI.


    First, you need to update your Pi''s repository index:


    sudo apt-get update


    Then, you need to search the index for GPredict programs:


    apt-cache search gpredict


    Now, install the software:'
