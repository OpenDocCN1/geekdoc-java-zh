  md: '# Ham Radio Projects for the RPi


    Once you get your own ham radio up and running, you will notice that there are
    literally dozens of things you can actually do with it, and not have to use it
    for emergency purposes only. It may seem overwhelming or even impossible for you
    to be able to send and track radio signals at this point, but believe me, once
    you try the amazing projects from this chapter, you will not only see how great
    of a hobby having a ham radio is, but that it can also be easily mastered.


    Although you can try any of these programs first, I really suggest that you follow
    the order in which they are listed since I have put a lot of thought to arrange
    them in a way that will help you to quickly master Hamshock. Shall we start?


    # Digital Modulation with Fldgi


    First of all, let me briefly explain what digital modes are and why they are important.
    Digital modes represent a means of Amateur operating with the help of a keyboard.
    The computer here acts as a modem, or a modulator – demodulator, allows you to
    type, as well as to see what someone else types. It is in charge of controlling
    the transmitter, providing helpful features, as well as changing the modes as
    needed. In this case, the modes are used on high frequency bands, which is especially
    the case with the chat modes – those that are used to have a conversation with
    Morse – that will let different operators to take part in a single net.


    Raspberry Pi can use the USB card''s audio input in order to decode these digital
    modes. The most popular and effective program that supports these modes that ham
    radio users use today, is Fldgi. This program operates in conjunction with a HF
    SSB radio transceiver and uses the USB card to input from, and sends output to
    the radio.


    The best thing about Fldgi is that it is multi-mode, which basically means that
    it can operate multiple modes, without having to switch programs. Fldgi includes
    all of the popular modes:


    +   - THOR

    - CW'
  merge: -1
  pgno: 40
- img_proc: true
  md: '+   - PSKR

    - Contestia

    - Throb

