  md: '# Getting Started with Pi


    Now that you know what you need to start your Raspberry Pi journey, the next step
    is to actually get started with this amazingisng tiny computer. Before we begin
    setting up the radio and learn about different radio program for your Ham Shack
    home, it is essential that we first learn how to actually set everything in order
    to be able to let your DJ skills run wild.


    In this chapter you will learn everything about installing and getting started
    with your new Raspberry Pi. I promise that when you go to the next chapter, you
    will no longer feel intimidated by the raw computer board you bought the other
    day. So let''s get started, shall we?


    # The Installation


    Now, it is time to actually install an operating system on your Raspberry Pi.
    Unlike traditional computers, the OS on the Raspberry Pi is not installed on a
    hard drive (since the Pi doesn''have one), but on the SD card. There are many
    ways in which you can install an OS on your Pi, however, this is the best and
    most convenient one.


    # NOOBS and BerryBoot


    NOOBS or New Out of the Box Setup is the official installation method created
    by the Raspberry Pi Foundation, with the purpose of simplifying things for beginners
    and adding multiple support tools for different operating systems on a single
    card. It is the BerryBoot precedes NOOBS and actually supports more operating
    systems, has the ability to actually install them on a USB stick, as well as back
    up, clone, and restore OS.


    Here is what you need to do in install NOOBS and BerryBoot:


    +   - Go to http://www.berryterminal.com/doku.php/berryboot and download BerryBoot,
    or go to http://www.raspberrypi.org/downloads to download NOOBS.

    - Depending on which OS you use, format your SD card as FAT32.

    - If you have Windows, then it is suggested that you use the SD Association''s
    SD Formatter. Go to'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'https://www.sdcard.org/downloads/formatter_4/ to access it.


    +   - If you are a Linux user, stick to GParted.

    - Now it is time to extract the downloaded archive on the SD card .


    # Installing Rasp with RAW Images


    This is the original method used for installing an operating system on an SD card.
    The RAW images have all the necessary binary data, including the Master Boot Record,
    as well as all the partitions.

    The biggest advantage of this method is that it supports every OS, and there is
    not much that can go wrong, however, the disadvantage lies in the fact that it
    is not that flexible. It is somewhat hard to boot multiple system on the same
    card. Besides, the image file has a static partition table which means that you
    will have a lot of free, but unused space.


    # Writing Images with Windows


    +   - Go to https://launchpad.net/win32-image-writer and download the Win32 Disk.

    - Select the right image file.

    - In the drop-down menu, find and select your SD card.

    - Click ‘Write’ and eject the card.'
  merge: -1
