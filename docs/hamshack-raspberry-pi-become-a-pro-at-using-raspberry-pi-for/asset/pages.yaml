    node to list the known nodes. If it''s not empty, then everything works fine.


    # Playing Zork over the Air


    Having a packet node is really amazing. And while the nodes mostly exist for emergency
    purposes, there are some pretty great uses you can find for your packet radio.
    And since everything in this set will probably cost you around $100, I say that
    it is a pretty affordable hobby.


    If waiting for an emergency or hopping from node to node, mapping them all together
    gets kind of boring, here is a great use for your brand new radio packet node.
    With this example, you can learn how to play Zork over the air, and if that''s
    not amazing, I really don''t know what is.


    But in order for you to be able to play Zork on Linux, you will first need an
    emulator. A great emulator for this purpose is Fortz:


    ```

    pi@raspberrypi:~ $ sudo apt-get install frotz

    ```


    After that, you can simply download Zork directly from infocomc:'
