  md: 'After installing your OS, the next step you should take is to set up an actual
    user account. As you have probably noticed, the Raspberrybian has already a default
    user called pi and a default password raspberry . So why change them? Well, the
    username and password is widely known and a system that runs with these default
    setting is not secure at all. If you want to avoid any security issues in the
    future, I suggest you change your password.


    The installation doesn''t have a root password, so the user should use sudo to
    run the commands that way. It is important to have a root password set because
    it will allow allow for the administrative tasks to be performed in the root shell.
    Here is how you can standardize the install:


    +   1. Log in as a pi user.


    +   2. Change the default password with this command:


    ```

    # passwd

    ```


    +   3. Enter a root shell:


    ```

    # sudo –i

    ```


    +   4. Run passwd one more time to change the password. Since you are in a root
    shell this will automatically change the root password.


    +   5. Choose a new user name and add it with this command (I have used John as
    a new user name in this example):


    ```

    # adduser john

    ```


    +   6. If you want your user to perform certain tasks, it has to be part of certain
    groups. To ensure that, type the command below. Again, replace john with your
    user name of choice:


    ```

    # usermod -a -G

    m,dialout,cdrom,sudo,audio,video,plugdev,games,users,netdev,\input,spi,gpio john

    ```'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'If you want to boot your desktop as a new user, you can actually do this without
    the raspi-config. Here is how to do it:


    +   1. Enable the LightDM service:


    ```

    # update-rc.cd lightdm enable 2

    ```


    +   2. In /etc/lightdm/lightdm.conf, set the autologin-user variable, as it is
    required. Know that commenting with a # will provide you with a login window every
    time that you boot your Pi, which is way more secure, and especially beneficial
    if you have more than one user.


    If you want to accomplish the reverse, simply disable the LightDM.


    # Accessing Pi Remotely


    After installing your OS, you can start developing with a USB keyboard, USB mouse,
    and an HDMI screen. However, if you don''t have these accessories, all is not
    lost. You can still access your Pi remotely. There are a couple of ways to do
    this.


    # SSH Remote Server


    SSH is a great remote server that can be used for most of the remote administration
    processes. And since Pi is a great ‘headless’ server, the remote server can be
    installed by default in the Raspian. In Linux, you can connect to SSH easily with
    the ssh command:


    ```

    ssh user@IP:port

    ```


    If you are using Windows, the SSH connection can be made with PuTTY, that you
    can download from http://www.chiark.greenend.org/~sgtaham/putty/. Securing the
    SSH


    In case you want to access the Pi from outside the local network, then you should
    be super careful and do everything you can protect it from unwanted bots and hackers.
    Most bots tend to connect to the port 22 and then brute force the password, and
    even if the password is secure, this can still file the logs with multiple failed
    attempts to establish a connection.'
  merge: -1
  pgno: 17
- img_proc: true
  md: "The simplest way to protect yourself is by changing the port number and disabling\
    \ the option for root login over the SSH. To do this, edit the /etc/ssh/sshd_config\
    \ and set up these options:\n\n```\nPort 1286 #Any unused port number is fine\n\
    PermitRootLogin no\n```\n\nBut this won't stop someone from scanning your open\
    \ ports. The ideal thing is to disable any password login and use only keys for\
    \ this purpose. To do this, you need to generate two keys – public and private.\
    \ Send the public key to a remote server, and keep the private key, well, private,\
    \ and use it instead of a password for login.\n\nIf using Windows, you can generate\
    \ the keys with the PuTTY:\n\n+   - Copy the public key here ~/.ssh/authorized_keys\
    \ , and save the private key on your PC.\n- Change the authorized_keys permissions,\
    \ if you want to protect the key:\n# chmod 600 ~/.ssh/authorized_keys\n- In PuTTY,\
    \ click ‘Save Private Key’.\n\nIn Linux, you can generate the keys this way:\n\
    \n+   - By typing ssh-keygen -t rsa\n- Now, accept recommended save location and\
    \ enter your passphrase. The content from id_rsa.pb should be copied to ~/.ssh/authorized_keys,\
    \ but that can be easily done with:\n# ssh-copy-id user@IP -p PORTNUMBER\n- Once\
    \ you see that you can connect to your Pi with the private key, go back to /etc/ssh/sshd_config\
    \ to disable the password logins:\nPasswordAuthentication no\n The best thing\
    \ is that you can actually add multiple public keys. For instance, if you want\
    \ to allow someone else to access your Pi,"
  merge: -1
  pgno: 18
- img_proc: true
  md: 'you can simply ask them for their public key and add the key to

    your authorized_keys file.\n


    +   There is one more thing to do, and that is to install fail2ban. This will
    ban all of the malicious IPs and fight various attacks:


    ```

    # apt-get install fail2ban

    ```


    Now, open the configuration file in order to edit the Sudo nano

    /etc/fail2ban/jail.local , and paste this:


    ```

    # SSH

    # 3 failed retry: Ban for 10 minutes

    [ssh]

    enabled = true

    port = ssh

    filter = iptables[name=SSH, port=ssh, protocol=tcp]

    mail-whos-lines[name=%(__name__)s,dest=%destemail)s,

    logpath=%(logpath)s

    logpath = /var/log/auth.log

    maxretry = 3

    bantime = 600

    ignoreip = 192.168.0/10


    [ssh-ddos]

    enabled = true

    port = ssh

    filter = sshd-ddos

    action = iptables[name=SSH, port=ssh, protocol=tcp]

    logpath = /var/log/auth.log

    maxretry = 10

    ignoreip = 192.168.0/10

    ```


    +   Now restart the fail2ban;


    sudo /etc/init.d/fail2ban restart


    # Transferring Files'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'If you thought that SSH was only great for allowing us to execute remote commands,
    you were wrong. SSH also gives us the chance to transfer files.


    If you want to perform a simple file transfer, this command will help you do that:


    ```

    $ scp /path/to/src user@IP:/path/to/dst

    ```


    However, if you are looking for a bit more powerful command, then this is the
    one:


    ```

    $ rsync /path/to/src user@IP:/path/to/dst -av

    ```


    If you are a Windows user, you can do this with WinSCP, which can be found at
    http://winscp.net . Its GUI usesTTY for private keys, and also allows you to transfer
    files between your PC and Pi.


    # X11 Forwarding


    Great, you can now execute commands and transfer files remotely. But the other
    thing you need to have in mind is the GUI. The X Window System can use a remote
    display in mind, and you can use SSH to forward GUI programs to the local X server
    remotely.


    If you use Linux, you can launch SSH as before, only with the addition of the
    -Y option. When your SSH session is ready, launch leafpad


    If you are a Windows user, you will need to have an X server running. Here are
    some options for that:


    +   - Cygwin/X that can be found at http://x.cywin.com/.

    - Xming, found at http://sourceforge.net/projects/xming/.

    - VcXrv is available here:

    http://sourceforge.net/projects/vcxsrv/.


    # Maintaining the Remote Session with Screen


    Although screen and ssh are not exactly related, they make a combo.

    Think about what would happen if your connection dropped during a SSH session.
    Obviously, everything would be lost. That is why screen is so important. With
    screen, you can easily re-attach and detach as needed. For instance, if your connection
    drops, you can re-attach'
