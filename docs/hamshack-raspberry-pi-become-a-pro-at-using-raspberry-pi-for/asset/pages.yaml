- img_proc: true
  md: 'sudo apt-get install gpredict


    To open GPredict, go to the top left Application Menu of the PIXEL GUI,

    select Education, and then GNOME Predict .


    If you want to uninstall it, you can do it with this command:


    sudo apt-get uninstall gpredict


    Once you have the GPredict installed on your Pi, you can actually track any

    real-time conceivable satellite from all around the world.


    The next step is only to interface your Pi with an antenna controller, and

    starting fun with tracking real-world satellites.


    # XLog Logging


    Just like your phone, your ham radio also needs to have an ordered log list.

    Keeping track of the logs is very important. XLog is actually an amateur

    logging program that keeps track of the logs, and places the most

    recent contacts on top of the list. The logs are kept in a text file, and the

    QSOs are shown in a list.


    This program is super convenient because it actually enables you to add,

    remove, and even update the list .


    There is a dxcc information displayed for every contact, where the

    distance and bearing are calculated, whether it is a long or a short path.


    The installation of XLog is done through the PIXEL GUI of your Desktop:


    +   - Open the top left Application Menu from the PIXEL GUI, hit

    Preferences, and then click on Add/Remove Software.

    - Search for the XLog in the window that has appeared.

    - Check both of the XLog boxes in order to select them.

    - To install XLOG, simply click on the Apply button.


    To launch the XLog program, click on the top left Application Menu in the

    PIXEL GUI, choose Applications, and then click on XLog.'
