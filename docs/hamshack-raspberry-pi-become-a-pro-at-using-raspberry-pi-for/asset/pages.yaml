  md: '# Wireless Connectivity


    It is only obvious that you would want to establish an internet connection on
    your Raspberry Pi. There are a couple of ways to do so, but since you are probably
    most interested in setting up a wireless connection, in this section I will talk
    about how you can get your Pi online wirelessly.


    # Pixel Desktop


    There is a GUI provided that can help you set up the wireless connectivity in
    Raspbian with PIXEL desktop. If you take a look at the right hand of the Pi’s
    menu bar, you will see the network icon. If your Wi-Fi dongle is plugged in, after
    clicking on the icon, a list of available wireless networks will appear. Click
    the network that you wish to connect to. If the network is not secured, a dialogue
    box will appear where you will have to enter the network key. Click ‘ok’ and wait
    for the connection establishment.


    If there are no available networks found, a message saying “No Aps found scanning...”.'
