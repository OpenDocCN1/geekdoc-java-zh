  md: "# Connecting the Morse Key to the GPIO Pins\n\nFor this purpose, you will need\
    \ to do some physical computing. The goal here is to switch the voltage for the\
    \ GPIO pin, on and off, to enable changing the reading of the pin whenever we\
    \ press the key. \n\nA Pull-Up Circuit:\n\nThrough a large 10k Ω resistor, wire\
    \ your GPIO pin to 3.3 volts, to sure that it will read HIGH. To make the pin\
    \ go LOW when we press it, we need to short it to the ground with the Morse key.\n\
    \nA Pull-Down Circuit\n\nHere the GPIO pin is wired through the 10k Ω resistor\
    \ in a way that it always reads LOW. Then, we short it to 3.3 volts through the\
    \ Morse key to ensure that it will go HIGH when pressed.\n\nIt's important to\
    \ know what both of these methods will do, as they both work fine. Choosing one\
    \ to go with is often just a personal preference.\n\nNow, take two jump wires,\
    \ and screw their male ends to the Morse Code key's terminal blocks. Choose either\
    \ the pull up or pull down configuration, and then connect the female ends to\
    \ the corresponding GPIO Pins of your Pi.\n\nFor this example, we are using the\
    \ pull up option. You can choose the pull down configuration instead, just remember\
    \ that in that case the code has to be altered.\n\n# Detecting the Key Position\n\
