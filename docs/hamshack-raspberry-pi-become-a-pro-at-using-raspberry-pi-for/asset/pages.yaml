  md: '# The Hardware


    If you have already purchased your Raspberry Pi, you may have already noticed
    how ‘naked’ the device actually comes. Its price may be cheap, about $35, but
    there are some hidden costs involved. The Pi may be a computer on its own for
    sure, however, you need a couple of other things to make it work as it should.


    A 5V Power Supply. For a device that is USB-powered, everyone can agree that the
    Raspberry Pi, no matter what flavor you have, is hungry for power. It draws around
    600 to 700 mA. And while it can be powered from the USB port — which is rated
    at around 500 mA, it is important that you use an actual powered adapter. You
    can use a modern smartphone charger since most of them supply 700 mA at 5V, however,
    to check if yours are at the bottom of the charger.


    If you don’t have a quality charger, once other devices such as a camera module
    or a simple Wi-Fi dong are connected, they will draw more power from the Pi and
    it may become unstable.


    On the other hand, if the power supply doesn’t deliver solid 5V, and maybe provides
    too much power, the board can easily get tired.

    Great third-party vendors who can provide your Pi with adequate power are:


    +   - AdaFruit

    - MoodMyPi

    - SparkFun


    **SD Card.** Its small and its super powerful, but the Raspberry Pi does not have
    the capability to store data onboard. That is why, and SD (Secure Digital) Card
    — a removable storage device – is essential.

    Here is what you need to look for when shopping for an SD card for your Raspberry
    Pi:


    +   - A Standard SD Card. Your Pi supports a standard SD card, not a Mini or a
    Micro SD, however, you can use an adapter to convert these if you happen to have
    a Micro or Mini.


    +   - A trustworthy brand. Avoid the cheap choices and choose good quality SD
    card such as Kingston, SanDisk or Transcend.'
  merge: -1
  pgno: 8
- img_proc: true
  md: '- At least 4 GB of capacity

    - Class 4 or higher. The class is important because it indicates how quickly the
    card can actually write and read data. For instance, an SD card of class 4 can
    read and write MB per second. Class 6 is faster with 6 MB per second, class 10
    can read 10 MB per second, . . .


    Keep in mind that the Standard SD card comes in SDHC (Secure Digital High Capacity)
    and SDXC (Secure Digital Extended Capacity). Make sure to check your Pi''s compatibility
    and see which one is best for your device. The SDHC goes up to 32 GB, and the
    SDXC up to 2T.


    **Powered USB Hub.** An USB hub is a compact device that can host a couple of
    USB devices. For instance, if you have the low-cost Raspberry Pi, you may have
    only one or two ports. Plug your mouse and keyboard and you have no way to plug
    anything else. That is why an USB hub is one of the main things Raspberry Pi owners
    buy right after purchasing their computer.


    **Ethernet Cable.** If you want to connect your Raspberry Pi to the Internet (and
    of course you do), then, besides the obvious Internet connectivity, you will need
    an Ethernet cable to do so. You plug one end of the Ethernet cable in your Pi
    and the other in your Wireless router, cable modem, or whatever device you have
    for connecting to the internet.


    **Monitor.** Even if you plan on using the Raspberry Pi headlessly and remotely,
    chances are that sooner than later, you''ll want to plug your computer into a
    monitor or a TV.


    **Cables.** To plug your Raspberry Pi into a monitor or TV, you will need cables.
    For this purpose, you will probably need an HDMI cable or a composite video cable.

    In case you will be using analog video, you will also need a 3.5 mm stereo audio
    cable whether you want to get a sound after connecting it to your TV or monitor,
    or plan on connecting it to external speakers.


    **USB Mouse and Keyboard.** As a computer, the Raspberry Pi also requires a keyboard
    and a mouse. You can use both wired and wireless, however, know that many users
    have reported some issues with the wireless'
