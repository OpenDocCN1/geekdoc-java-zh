  md: '# # Setting Up a Raspberry Pi Packet Radio


    If you have already received your Ham license, you must be super excited about
    the amateur radio journey that lies ahead of you. And now that you know how to
    setup, configure, as well as operate with the amazing Raspberry Pi, then you probably
    cannot wait for the actual adventure and the chance to experience some great projects
    with your Hamshack Raspberry Pi. But before we having fun, there is one huge step
    that you need to take care of – setting up the actual radio.


    If you think that setting up a radio station is a real hassle, it is probably
    because it usually is. But that doesn’t mean that you have to start your adventure
    the most expensive way, purchasing high-tech equipment and all sorts of fancy
    tools. Your Hamshack raspberry pi can be simple, and extremely effective in executing
    all of the most popular RPi projects.


    Although there are many different ways you can turn your computer into an amateur
    radio station, I chose this simple Raspberry Pi packet radio node as your beginner’s
    starting point, because I believe that is the simplest way for you to build and
    sending data over the airwaves . This example turns your Raspberry Pi into a packet
    radio node, and then runs Zork on it. How amazing is that?


    What you will need:


    +   - Raspberry Pi (SD card included)

    - USB to Serial Adapter

    - Amateur Radio Transceiver and an Antenna

    - KISS TNC with a Serial Cable

    - List of Some Pocket Nodes from Your Area


    # ## Setting up the System


    Although we have already gone into details about how to set up and configure your
    Raspberry Pi, going through these simple steps again is the perfect way for you
    to master your berry skills.'
