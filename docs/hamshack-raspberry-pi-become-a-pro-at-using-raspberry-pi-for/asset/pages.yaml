- img_proc: true
  md: '```

    pi@raspberry:~ $ mkdir ~/games

    pi@raspberry:~ $ mkdir ~/games/zork

    pi@raspberry:~ $ cd ~/games/zork k

    pi@raspberry:~~/games/zork $ curl http://www.infocom-

    if.org/downloads/zork1.Zip > zork.zip

    pi@raspberry:~~/games/zork $ unzip zork.zip

    ```


    After your download completes successfully, you can launch Zork locally:


    ```

    pi@raspberry:~~/games/zork $ frotz DATA/ZORK1.DAT

    ```


    Now you have to find a way in which the node users can actually launch the Frotz
    emulator and play Zork. In order to launch the application right way, first have
    to create a shell script:


    ```

    pi@raspberry:~ ~ nano zork.sh

    ```


    After you have created the shell script, add this:


    ```

    #!/bin/bash

    export HOME="home/pi"

    export TERM="linux"

    /usr/games/frotz/home/pi/games/zork/DATA/ZORK1.DAT

    ```


    Allow the execution:


    ```

    pi@raspberry:~ ~ chmod u+x zork.sh

    ```


    Normally, when you launch Zork you have to type the last line only. However, when
    you launch it from the AX25 port, the Frotz will not launch if you do not export
    the terminal variables. Since we already have the script, the only thing we need
    to do is to create a new command on the node, that Zork can be launched:


    ```

    pi@raspberry:~ ~ sudo nano /etc/ax25/node.conf

    ```


    Go to the bottom of the ExtCmd section, and add the following:


    ```

    ExtCmd Zork 1 /home/pi/zork.sh NULL

    ```


    This will create the command Zork. We use capital ZO, so you don''t have to use
    the entire name all the time. Make sure that you have the NULL portion there,
    otherwise, the note will not execute.'
