  md: '# Writing Images with Linux


    +   - First, make sure that the SD card is not mounted.

    - Replace the mmcblk0 with the right device in order to write to the disk. To
    do this, you have to run this command:

    # dd if=file.img of=/dev/mmcblk0 bs=4M


    +   - It is important that you run this command: # sync , in order to flush the
    filesystem buffers before you remove the SD card.


    # Booting


    Now that you have installed Raspbian and have the image written, it is time to
    perform the initial setup by booting your Pi for the very first time. The best
    way to do so is by using a keyboard, monitor, and a mouse.


    Insert the card and connect the monitor, keyboard, and mouse. When asked for a
    username, type pi, and when asked for a password, type raspberry. Finally, type
    startx and load the familiar UI.

    After simply connect the Ethernet cable to the Raspberry Pi .


    # Expanding the Filesystem


    If you have Raspbian, you can do this automatically by choosing Expand Filesystem
    found in the raspi-config script. There is also a way for you to manually launch
    it if you choose to run sudo raspi-config . However, if you are not provided with
    an automated way to do it, you can actually expand the filesystem on the Raspberry
    Pi.


    +   1. Launch the fdisk by typing:

    # fdisk /dev/mmcblk0

    2. Press p and enter . The display should read something like:

    Command (m for help): p

    Disk /dev/mmcblk0: 29.7 GiB, 31918653440 bytes, 62341120 sectors

    Units: sectors of 1 * 512 = 512 bytes

    Sector size (logical/physical): 512 bytes / 512 bytes

    I/O size (minimum/optimal): 512 bytes / 512 bytes

    Disklabel type: dos

    Disk identifier: 0x417ee54b'
