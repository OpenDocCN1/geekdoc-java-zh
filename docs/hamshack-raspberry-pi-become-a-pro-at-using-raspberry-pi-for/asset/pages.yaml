  md: "bye\n#CARMEL:KE7SAL-9 Goodbye\nConnection closed by foreign host.\n\nWe want\
    \ our node to listen for other nodes’ netrom broadcasts, as well as to ensure\
    \ that we actually have a server that is listening for other systems’ incoming\
    \ connections. That can be done with two simple lines:\n\n```\npi@raspberrypi:~\
    \ $ sudo netromd\npi@raspberrypi:~ $ sudo ax25d\n```\n\nAnd we have successfully\
