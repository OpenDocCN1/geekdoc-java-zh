  \ args)\n    {\n        Node ROOT = null;\n        String[] items = new String[]{\"\
  Stan\",\"Steve\",\"Sally\",\"Nancy\",\"Sara\"};\n        // 将项添加到列表：\n        for(String\
  \ item : items) {\n            ROOT = appendNode(ROOT, item)\n        }\n      \
  \  System.out.println(\"Contents of circular list:\");\n        displayList(ROOT);\n\
  \    }\n}\n```\n\n列表 5.7 定义了与之前相同的 `Node` 类，随其后的是 Java 函数 `appendNode()`，该方法包含了初始化单向链表的逻辑，以及向该列表添加节点的逻辑。\n\
