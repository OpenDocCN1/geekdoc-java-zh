  \ ChatGPT 为了使用数组实现栈而生成的代码。\n\n## 列表 9.x: ArrayStack.java\n\n```java\n// 下面是一个 Java\
  \ 代码段，演示了如何使用数组实现栈。该示例包含了向栈中插入值（push）和从中移除值（pop）的方法。\n\npublic class ArrayStack\
  \ {\n    private int capacity;\n    private int top;\n    private int[] array;\n\
  \n    public ArrayStack(int capacity) {\n        this.capacity = capacity;\n   \
  \     this.top = -1;\n        this.array = new int[capacity];\n    }\n    // 检查栈是否满\n\
  \    public boolean isFull() {\n        return top == capacity - 1;\n    }\n   \
  \ // 检查栈是否为空\n    public boolean isEmpty() {\n        return top == -1;\n    }\n\
  \    // 向栈添加元素\n    public void push(int item) {\n        if (isFull()) {\n    \
  \        System.out.println(\"Stack is full. Cannot push.\");\n            return;\n\
  \        }\n        array[++top] = item;\n        System.out.println(\"Pushed: \"\
  \ + item);\n    }\n    // 从栈中移除元素\n    public int pop() {\n        if (isEmpty())\
  \ {\n            System.out.println(\"Stack is empty. Cannot pop.\");\n        \
  \    return Integer.MIN_VALUE;\n        }\n        return array[top--];\n    }\n\
  \    public static void main(String[] args) {\n        ArrayStack stack = new ArrayStack(5);\n\
  \        // 向栈推入元素\n        stack.push(1);\n        stack.push(2);\n        stack.push(3);\n\
  \        stack.push(4);\n        stack.push(5);\n        // 在栈满时尝试推入\n        stack.push(6);\n\
  \        // 从栈中弹出元素\n        System.out.println(\"Popped: \" + stack.pop());\n \
  \       System.out.println(\"Popped: \" + stack.pop());\n        // 推入更多元素\n   \
  \     stack.push(6);\n        stack.push(7);\n    }\n}\n```\n\nListing 9.12 附带对\
  \ ChatGPT 生成代码的以下说明。\n\n### 代码说明\n\n- **初始化**：`ArrayStack` 类使用 `capacity` 进行初始化、一个初始化为\
  \ `-1` 的 `top` 索引以及一个用于存储栈元素的 `array`。\n- **isFull 和 isEmpty**：这些方法分别检查栈是否满或是否为空。\n\
  - **push**：`push` 方法向栈顶添加一个元素。如果栈满，它会打印一条消息并返回，不再添加元素。\n- **pop**：`pop` 方法从栈顶移除一个元素并返回它。如果栈为空，它会打印一条消息并返回\
  \ `Integer.MIN_VALUE`。\n- **Main 方法**：`main` 方法是程序的入口。它创建了一个容量为 `5` 的 `ArrayStack`\
  \ 对象，向其推入了一些元素，然后弹出了一些元素。\n\n### 如何运行代码\n\n1. 将代码保存为名为 `ArrayStack.java` 的文件。\n\
  2. 打开终端并进入保存 `ArrayStack.java` 的目录。\n3. 使用 `javac` 命令编译代码：`javac ArrayStack.java`。\n\
  4. 使用 `java` 命令运行编译后的类：`java ArrayStack`。\n\n你应该能看到终端打印出的消息，指示正在推入和弹出的元素，以及栈满或栈时的任何错误信息。\n\
  \nListing 9.12 的输出为：\nPushed: 1\nPushed: 2\nPushed: 3\nPushed: 4\nPushed: 5\nStack\
  \ is full. Cannot push.\nPopped: 5\nPopped: 4\nPushed: 6\nPushed: 7\n\n## 总结\n\n\
