  \n\n\n\n\n## 寻找中间元素\n\n- 不允许统计元素的个数\n- 不允许使用额外的数据结构\n- 列表中的任何元素都不能修改或标记\n- 偶长度的列表可以有两个中间元素\n\
  \n此任务属于一组使用相同技术的任务：使用一个变量顺序遍历列表，而使用第二个变量以两倍的速度遍历同一个列表。事实上，这种技术被用于判断列表是否包含环（将在下一节中讨论）。\n\
  \n列表 6.12 显示了 `MiddleSLNode.py` 的内容，它说明了如何在单链表中确定中间元素。\n\n### 列表 6.12: MiddleSLNode.java\n\
  \n```java\npublic class MiddleSLNode {\n    static class Node {\n        String\
  \ data = \"\";\n        Node next = null;\n        public Node(String data) {\n\
  \            this.data = data;\n            this.next = null;\n        }\n    }\n\
  \n    public static Node[] appendNode(Node ROOT, Node LAST, String item) {\n   \
  \     Node[] results = new Node[2];\n        if(ROOT == null) {\n            ROOT\
  \ = new Node(item);\n        } else {\n            if(ROOT.next == null) {\n   \
  \             Node NEWNODE = new Node(item);\n                LAST = NEWNODE;\n\
  \                ROOT.next = LAST;\n            } else {\n                Node NEWNODE\
  \ = new Node(item);\n                LAST.next = NEWNODE;\n                LAST\
  \ = NEWNODE;\n            }\n        }\n        results[0] = ROOT;\n        results[1]\
  \ = LAST;\n        return results;\n    }\n\n    public static Node[] findMiddle(Node\
  \ ROOT) {\n        Node[] results = new Node[2];\n        Node empty = new Node(\"\
  empty\");\n        Node even = new Node(\"even\");\n        Node odd = new Node(\"\
  odd\");\n        Node result = new Node(\"\");\n        Node CURR = ROOT;\n    \
  \    Node SEEK = ROOT;\n        int count = 0;\n        if(ROOT == null) {\n   \
  \         results[0] = empty;\n            results[1] = even;\n            return\
  \ results;\n        } else if (ROOT.next == null) {\n            count += 1;\n \
  \           results[0] = ROOT;\n            results[1] = odd;\n            return\
  \ results;\n        }\n        count += 1;\n        while (SEEK != null) {\n   \
  \         if(SEEK == null) {\n                break;\n            } else if(SEEK.next\
  \ == null) {\n                count += 1;\n                break;\n            }\
  \ else {\n                SEEK = SEEK.next;\n                CURR = CURR.next;\n\
  \            }\n        }\n        if(count % 2 == 0) {\n            result = even;\n\
  \        } else {\n            result = odd;\n        }\n        results[0] = CURR;\n\
  \        results[1] = result;\n        return results;\n    }\n\n    public static\
