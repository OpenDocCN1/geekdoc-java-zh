  \n## LISTING 4.6: SelectionSort.java\n\n```java\npublic class SelectionSort\n{\n\
  \  public static void main(String[] args)\n  {\n      int[] arr1 = new int[]{64,\
  \ 25, 12, 22, 11};\n      System.out.print(\"Initial: \");\n      for(int i=0; i<arr1.length;\
  \ i++) {\n          System.out.print(arr1[i]+\" \");\n      }\n      System.out.println\
  \ (\"\");\n      //遍历所有数组元素\n      for(int i=0; i<arr1.length; i++) {\n        \
  \  //在剩余的未排序数组中找到最小元素\n          int min_idx = i;\n          for(int j=i+1; j<arr1.length;\
  \ j++) {\n              if(arr1[min_idx] > arr1[j])\n              min_idx = j;\n\
  \          }\n          //将找到的最小元素与第一个元素交换\n          int temp = arr1[i];\n    \
  \      arr1[i] = arr1[min_idx];\n          arr1[min_idx] = temp;\n      }\n    \
  \  System.out.print(\"Sorted: \");\n      for(int i=0; i<arr1.length; i++) {\n \
  \         System.out.print(arr1[i]+\" \");\n      }\n      System.out.println();\n\
  \  }\n}\n```\n\n`Listing` 4.6 首先用一些整数初始化数组 `arr1`，接着是一个遍历 `arr1` 元素的循环。在此循环的每次迭代中，另一个内部循环将当前数组元素与当前元素右侧的每个元素进行比较。如果这些元素中任何一个小于当前数组元素，则前者的索引位置将保留在变量\
  \ `min_idx` 中。在内部循环完成后，通过以下代码片段将当前元素与找到的较元素（如果有）进行“交换”：`arr1[i], arr1[min_idx] =\
  \ arr1[min_idx], arr1[i]`\n\n在前面的代码段中，`arr1[i]` 是“当前”元素，`arr1[min_idx]` 是位于索引 `i`\
  \ 右侧且小于 `arr1[i]` 的元素。如果这两个值相同，则代码片段将 `arr1[i]` 与自身交换。现在运行 `Listing` 4.6 中的代码，你将看到以下输出：\n\
  \nInitial: 64 25 12 22 11\nSorted: 11 12 25 64\n\n## INSERTION SORT\n\n`Listing`\
  \ 4.7 显示了 `InsertionSort.java` 的内容，说明了如何对数字数组执行选择排序。\n\n## LISTING 4.7: InsertionSort.java\n\
  \n```java\npublic class InsertionSort\n{\n  public static void insertionSort(int[]\
  \ arr1)\n  {\n    // 遍历 1 到 len(arr1)\n    for(int i=1; i<arr1.length; i++) {\n\
  \        int key = arr1[i];\n        // 将 arr1[0..i-1] 中大于\n        // key 的元素移动到其当前位置\n\
  \        // 前一个位置\n        int j = i-1;\n        while((j >=0) && (key < arr1[j]))\
  \ {\n            arr1[j+1] = arr1[j];\n            j -= 1;\n        }\n        arr1[j+1]\
  \ = key;\n        //System.out.println(\"New order: \"+arr1);\n    }\n  }\n\n  public\
  \ static void main(String[] args)\n  {\n      int[] arr1 = new int[]{64, 25, 12,\
  \ 22, 11};\n      System.out.print(\"Initial: \");\n      for(int i=0; i<arr1.length;\
  \ i++) {\n          System.out.print(arr1[i]+\" \");\n      }\n      System.out.println\
  \ (\"\");\n      insertionSort(arr1);\n      System.out.print(\"Sorted: \");\n \
  \     for(int i=0; i<arr1.length; i++) {\n          System.out.print(arr1[i]+\"\
  \ \");\n      }\n      System.out.println();\n  }\n}\n```\n\n\n\n\n前图中最右侧的一列列出了包含每个数字的数组（数组\
