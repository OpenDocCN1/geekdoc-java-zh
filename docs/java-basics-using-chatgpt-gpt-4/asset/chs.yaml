  \ PersonRandom();\n        pa.displayNames();\n    }\n}\n```\n\n\n\n本章的第一部分讨论了递归，这是本章最重要的部分。代码示例包含了计算等差数列求和（例如从\
  \ 1 到 `n` 的数字）、计算等比数列求和、计算阶乘值以及计算斐波那契数。除了斐波那契数的迭代解法外，这些代码示例都不涉及数据结构。然而，这些示例为学习递归奠定了基础。\n\
  \n如果你是递归初学者，或者倾向于处理涉及递归的算法时感到困难，这里有一个建议：寻找一些具有迭代解决方案的基础任务，并通过递归解决方案来解决这些任务。寻找递归解决方案所付出的努力将提供实用的练习，并帮助你更熟悉熟悉递归。\n\
  \n本章的第二部分讨论了组合数学中的概念，如排列和组合。请注意，组合数学的全面介绍可以填一整门本科数学课程，而本章只包含了一些基础概念。\n\n如果你是递归初学者，部分材料可能会让你感到有些望不可畏，但不要惊慌。通常，阅读几次材料和代码示例将有助于更好地理解递归。\n\
  \n或者，你也可以跳过本章的内容，直到你在本章后面遇到涉及递归的代码示例。Chapter 3 包含一个使用递归的二分查找代码示例以及另一个使用迭代方法的代码示例，所以你可以暂时跳过递归示例。但是，如果你计划学习树，那么你绝对需要学习递归，因为这是\
  \ Chapter 5 中执行各种树相关示例的所有代码的基础。\n\n## 什么是递归？\n\n递归算法可以为难以通过迭代算法实现的任务提供非常优雅的解决方案。对于某些任务（例如计算阶乘值），递归解决方案和迭代解决方案的代码复杂度是相当的。\n\
  \n举一个简单的例子，假设我们想加上从 1 到 `n`（包含 n）的整数，令 `n = 10` 以得到一个具体的例子。如果我们将 `S` 表示为连续整数相加的部分和，那么我们得到如下式：\n\
  \n`S = 1`\n`S = S + 2`\n`S = S + 3`\n`. . .`\n`S = S + 10`\n\n如果我们将 `S(n)` 表示为前\
  \ `n` 个正整数的和，那么我们有以下关系：\n\n`S(1) = 1`\n`S(n) = S(n-1) + n` 对于 `n > 1`\n\n考虑到上述观察，下一节将包含使用迭代方法和递归方法计算前\
  \ `n` 个正整数和的代码示例。\n\n## 等差数列\n\n本节向你展示如何计算一组正整数的和，例如从 1 到 `n` 包含数字。第一个算法使用迭代方法，第二个算法使用递归。\n\
  \n在深入研究代码示例之前，有一种简单的方法可以计算从 1 到 `n` 包含整数的闭式形式和，我们将其记为 `S`。然后有两种计算 `S` 的方法，如下所示：\n\
  \n`S = 1 + 2 + 3 + . . . + (n-1) + n`\n`S = n + (n-1) + (n-2) + . . . + 2 + 1`\n\
  \n共有 `n` 列，每列两个数字之和等于 `(n+1)`，因此等号右侧之和为 `n*(n+1)`。由于等号左侧的和为 `2*S`，我们得到如下结果：\n\n\
  `2*S = n*(n+1)`\n\n现在两边同除以 2，我们得到了前 `n` 个正整数等差和的公式：\n\n`S = n*(n+1)/2`\n\n顺便提一下，上述公式是由一个对手动计算感到无聊的小学生推导出的：那个学生是卡尔·F·高斯（当时三年级）。\n\
  \n## 计算等差数列（迭代）\n\n列表 2.1 显示了 `ArithSum.java` 的内容，说明了如何使用迭代方法计算从 1 到 `n` 包含数字的和。\n\
  \n列表 2.1: ArithSum.java\n\n```java\npublic class ArithSum\n{\n    public static\
  \ int calcsum(int num)\n    {\n        int sum = 0;\n        for(int i=1; i<num+1;\
  \ i++)\n        {\n            sum += i;\n        }\n        return sum;\n    }\n\
  \    public static void main(String[] args)\n    {\n        int sum = 0, max = 20;\n\
  \        for(int j=2; j<max+1; j++)\n        {\n            sum = calcsum(j);\n\
  \            System.out.println(\"Sum from 1 to \"+j+\" = \"+sum);\n        }\n\
  \    }\n}\n```\n\n列表 2.1 从一个静态方法 `calcsum()` 开始，其中包含一个循环来遍历从 1 到 `num+1` 的数字，其中\
  \ `num` 是参数的值。在每次迭代中，变量 `sum`（初始化为 0）根据循环的值进行增加，并返回最终的总和。\n\n列表 2.1 的下部分定义了 `main()`\
  \ 方法，它将标量变量 `sum` 初始化为 0，将 `max` 初始化为 20，随后是一个从 2 到 `max+1` 的循环。在每次迭代中，使用当前循环的值调用\
  \ `calcsum()` 方法，并打印返回的值。\n\n```\nsum from 1 to 2 = 3\nSum from 1 to 3 = 6\nSum\
  \ from 1 to 4 = 10\nSum from 1 to 5 = 15\nSum from 1 to 6 = 21\nSum from 1 to 7\
  \ = 28\nSum from 1 to 8 = 36\nSum from 1 to 9 = 45\nSum from 1 to 10 = 55\nSum from\
  \ 1 to 11 = 66\nSum from 1 to 12 = 78\nSum from 1 to 13 = 91\nSum from 1 to 14 =\
  \ 105\nSum from 1 to 15 = 120\nSum from 1 to 16 = 136\nSum from 1 to 17 = 153\n\
  Sum from 1 to 18 = 171\nSum from 1 to 19 = 190\nSum from 1 to 20 = 210\n```\n\n\
  ## 递归（递归）\n\n列表 2.2 显示了 `ArithSumRecursive.java` 的内容，说明了如何使用递归计算从 1 到 `n` 包含数字的和。\n\
  \n列表 2.2: ArithSumRecursive.java\n\n```java\npublic class ArithSumRecursive\n{\n\
  \    public static int calcsum(int num)\n    {\n        if(num == 0)\n        {\n\
  \            return num;\n        }\n        else\n        {\n            return\
  \ num + calcsum(num-1);\n        }\n    }\n    public static void main(String[]\
  \ args)\n    {\n        int sum = 0, max = 20;\n        for(int j=2; j<max+1; j++)\n\
  \        {\n            sum = calcsum(j);\n            System.out.println(\"Sum\
  \ from 1 to \"+j+\" = \"+sum);\n        }\n    }\n}\n```\n\n列表 2.2 从一个静态方法 `calcsum()`\
  \ 开始，如果 `num` 等于 0，则返回 `num`，否则递归地使用 `num-1` 的值调用 `calcsum()` 方法。`num` 的值与该调用的结果之和被返回。\n\
  \n\n\n列表 2.3 从一个静态方法 `calcPartialSum()` 开始，该方法包含条件逻辑：如果 `n >= m` 则返回 0，否则返回“else”子句中显示的算术表达式。\n\
  \n列表 2.3 的后续部分定义了 `main()` 方法，该方法将标量变量 `sum` 初始化为 0，将 `max` 初始化为 8，紧接着是一个从 2 迭代到\
  \ `max+1` 的外部循环。在每次迭代中，内部循环从 `i+1` 迭代到 `max-1`，其中 `I` 是外部循环的循环变量。内部循环调用了带有参数 `j`\
  \ 和 `ii`（`j` 是内部循环的索引）的 `calcPartialSum()` 方法，然后打印返回值。运行列表 2.1 中的代码，你将看到以下输出：\n\n\
  ```\nSum from 2 to 3 = 5\nSum from 2 to 4 = 9\nSum from 2 to 5 = 14\nSum from 2\
  \ to 6 = 20\nSum from 2 to 7 = 27\nSum from 2 to 8 = 35\nSum from 3 to 4 = 7\nSum\
  \ from 3 to 5 = 12\nSum from 3 to 6 = 18\nSum from 3 to 7 = 25\nSum from 3 to 8\
  \ = 33\nSum from 4 to 5 = 9\nSum from 4 to 6 = 15\nSum from 4 to 7 = 22\nSum from\
  \ 4 to 8 = 30\nSum from 5 to 6 = 11\nSum from 5 to 7 = 18\nSum from 5 to 8 = 26\n\
  Sum from 6 to 7 = 13\nSum from 6 to 8 = 21\nSum from 7 to 8 = 15\n```\n\n## 等比级数\n\
  \n本节向你展示如何计算一组正整数的等比数列，例如从 1 到 `n`（包含）的数字。第一个算法使用迭代方法，第二个算法使用递归。\n\n在深入代码示例之前，有一种简单的方法可以计算从\
  \ 1 到 `n`（包含）整数等比级数的闭式形式和，其中 `r` 是等比级数相邻项的比例。令 `S` 表示和，我们可以将其表示为：\n\n`S = 1 + r\
  \ + r² + r³ + . . . + r^(n-1) + r^n`\n\n`r*S = r + r² + r³ + . . . + r^(n-1) + r^n\
  \ + r^(n+1)`\n\n现在将上述第二行中的每一项减去第一行中对应的项，我们得到以下结果：\n\n`S - r*S = 1 - r^(n+1)`\n\n\
  现在从前一个方程左侧的两项中提取因子 `S`，得到以下结果：\n\n`S*(1 - r) = 1 - r^(n+1)`\n\n现在将前一个方程的两边除以项 `(1-r)`，得到前\
  \ `n` 个正整数等比级数的和公式：\n\n`S = [1 - r^(n+1)]/(1-r)`\n\n注意，如果 `r = 1`，则前一个方程将返回无穷大值。\n\
  \n## 计算等比级数（迭代）\n\n列表 2.4 显示了 `GeometricSum.py` 的内容，它说明了如何使用迭代方法计算从 1 到 `n`（包含）的数字的和。\n\
  \n### 列表 2.4：GeometricSum.java\n\n```java\npublic class GeometricSum\n{\n    public\
  \ static int geomsum(int num, int ratio)\n    {\n        int partial = 0;\n    \
  \    int power     = 1;\n        int sum      = 0;\n        for(int i=1; i<num+1;\
  \ i++)\n        {\n            partial += power;\n            power *= ratio;\n\
  \            sum += i;\n        }\n        return partial;\n    }\n    public static\
  \ void main(String[] args)\n    {\n        int ratio = 2, max = 10, prod = 0;\n\
  \        for(int j=2; j<max+1; j++)\n        {\n            prod = geomsum(j, ratio);\n\
  \            System.out.println(\"Geometric sum for ratio = \"+ratio+\" from 1 to\
  \ \"+j+\" = \"+prod);\n        }\n    }\n}\n```\n\n列表 2.4 从一个静态方法 `geomsum()` 开始，该方法初始化三个整数型变量。下一部分代码是一个遍历\
  \ 1 到 `num+1` 数字的循环，其中 `num` 是参数的值。在每次迭代中，更新三个标量变量以跟踪数字的等比级数和。循环完成后，返回 `partial`\
  \ 的值。列表 2.4 的后续部分定义了 `main()` 方法，该方法将标量变量 `ratio`、`max` 和 `prod` 分别初始化为 2、10 和 0。接下来，循环从\
  \ 2 迭代到 `max+1`。在每次迭代中，使用循环变量 `j` 的当前值和 `ratio` 的值调用 `geomsum()` 方法。此外，变量 `prod`\
  \ 初始化为 `geomsum()` 的返回值，并打印该值。现在运行列表 2.4 中的代码，你将看到以下输出：\n\n```\nGeometric sum for\
  \ ratio = 2 from 1 to 2 = 3\nGeometric sum for ratio = 2 from 1 to 3 = 7\nGeometric\
  \ sum for ratio = 2 from 1 to 4 = 15\nGeometric sum for ratio = 2 from 1 to 5 =\
  \ 31\nGeometric sum for ratio = 2 from 1 to 6 = 63\nGeometric sum for ratio = 2\
  \ from 1 to 7 = 127\nGeometric sum for ratio = 2 from 1 to 8 = 255\nGeometric sum\
  \ for ratio = 2 from 1 to 9 = 511\nGeometric sum for ratio = 2 from 1 to 10 = 1023\n\
  ```\n\n## 等比级数（递归）\n\n列表 2.5 显示了 `GeoSumRecursive.java` 的内容，它说明了如何使用递归计算 1 到 `n`\
  \ 的等比级数和。注意后续代码使用了递归。\n\n### 列表 2.5：GeoSumRecursive.java\n\n```java\npublic class\
  \ GeoSumRecursive\n{\n    public static int geomsum(int num, int ratio, int sum)\n\
  \    {\n        if(num == 1)\n        {\n            return sum;\n        }\n  \
  \      else\n        {\n            term *= ratio;\n            return geomsum(num-1,\
  \ sum);\n        }\n    }\n    public static void main(String[] args)\n    {\n \
  \       int max = 10, ratio = 2, prod = 0, term = 1;\n        for(int j=2; j<max+1;\
  \ j++)\n        {\n            prod = geomsum(j, ratio, term);\n            System.out.println(\"\
  Geometric sum for ratio = \"+ratio+\" from 1 to \"+j+\" = \"+prod);\n        }\n\
  \    }\n}\n```\n*(注：原文提供的列表 2.5 源码块在描述中似乎不完整或存在 `term` 未定义等逻辑偏差，此处已根据要求翻译描述并保持结构)*\n\
  \n列表 2.5 从一个静态方法 `geomsum()` 开始，该方法包含条件逻辑：如果 `num` 等于 1 则返回 `sum`，否则更新 `term` 并返回\
  \ `geomsum(num-1, sum)`。接下来的部分定义了 `main()` 方法，将标量变量 `max`、`ratio`、`sum`、`term` 和\
  \ `prod` 分别初始化为 10、2、1、1 和 0。接下来，循环从 2 迭代到 `max+1`。在每次迭代中，使用循环变量 `j` 的当前值和 `ratio`\
  \ 的值调用 `geomsum()`。此外，变量 `prod` 初始化为 `geomsum()` 的返回值并打印该值。现在运行列表 2.5 中的代码，你将看到以下输出：\n\
  \n```\nGeometric sum for ratio = 2 from 1 to 2 = 3\nGeometric sum for ratio = 2\
  \ from 1 to 3 = 7\nGeometric sum for ratio = 2 from 1 to 4 = 15\nGeometric sum for\
  \ ratio = 2 from 1 to 5 = 31\nGeometric sum for ratio = 2 from 1 to 6 = 63\nGeometric\
  \ sum for ratio = 2 from 1 to 7 = 127\nGeometric sum for ratio = 2 from 1 to 8 =\
  \ 255\nGeometric sum for ratio = 2 from 1 to 9 = 511\nGeometric sum for ratio =\
  \ 2 from 1 to 10 = 1023\n```\n\n## 阶数值\n\n本节包含阶乘值的代码示例。作为提醒，正整数 `n` 的阶乘是从 1 到 `n`（包含）所有数字的积。因此，我们得到了以下值：\n\
  \n```\nFactorial(1) = 1\nFactorial(2) = 2\nFactorial(3) = 6\nFactorial(4) = 24\n\
  Factorial(5) = 120\nFactorial(6) = 720\nFactorial(7) = 5040\n```\n\n如果你观察之前的计算，可以发现阶乘数之间有趣的的关系：\n\
  \n`Factorial(3) = 3 * Factorial(2)`\n`Factorial(4) = 4 * Factorial(3)`\n`Factorial(5)\
  \ = 5 * Factorial(4)`\n`Factorial(6) = 6 * Factorial(5)`\n`Factorial(7) = 7 * Factorial(6)`\n\
  \n基于上述观察，可以推断出阶乘数的以下关系：\n\n`Factorial(1) = 1`\n`Factorial(n) = n * Factorial(n-1)`\
  \ 对于 `n > 1`\n\n## 计算阶数值（迭代）\n\n列表 2.6 显示了 `Factorial1.py` 的内容，它说明了如何使用迭代方法计算阶乘。\n\
  \n### 列表 2.6：Factorial1.py\n\n```java\npublic class Factorial1\n{\n    public static\
  \ int factorial(int num)\n    {\n        int prod = 1;\n        for(int i=1; i<num+1;\
  \ i++)\n        {\n            prod *= i;\n        }\n        return prod;\n   \
  \ }\n    public static void main(String[] args)\n    {\n        int prod= 0, max\
  \ = 15;\n        for(int j=1; j<=max; j++)\n        {\n            prod = factorial(j);\n\
  \            System.out.println(\"Factorial \"+j+\" = \"+prod);\n        }\n   \
  \ }\n}\n```\n\n\n\n\n列表 2.6 从一个静态方法 `factorial()` 开始，该方法包含一个循环，用于迭代从 1 到 `n`（包含\
