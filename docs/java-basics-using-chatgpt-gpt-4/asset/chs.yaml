  \ = 3 + 19\n22 = 5 + 17\n24 = 5 + 19\n```\n\n## 任务：计算 GCD（最大公约数）\n\n列表 2.17 显示了\
  \ `GCD.java` 的内容，演示了如何计算两个正整数的最大公约数。\n\n### 列表 2.17: GCD.java\n\n```java\npublic\
  \ class GCD\n{\n    public GCD() {}\n    public int gcd(int num1, int num2)\n  \
  \  {\n        if(num1 % num2 == 0) {\n            return num2;\n        }\n    \
  \    else if (num1 < num2) {\n            System.out.println(\"Switching \"+num1+\"\
  \ and \"+num2);\n            return gcd(num2, num1);\n        }\n        else {\n\
  \            System.out.println(\"Reducing \"+num1+\" and \"+num2);\n          \
  \  return gcd(num1-num2, num2);\n        }\n    }\n\n    public static void main(String\
  \ args[])\n    {\n        GCD g = new GCD();\n        int result = g.gcd(24,10);\n\
  \        System.out.println(\"The GCD of 24 and 10 = \"+result);\n    }\n}\n```\n\
  \n列表 2.18 从一个 `gcd()` 方法开始，它接收两个整数参数 `num1` 和 `num2`。第一个条件逻辑部分检查 `num1 % num2 ==\
  \ 0`：如果是，则返回 `num2`。第二个条件逻辑部分检查 `num1 < num2`：如果是，则递归调用 `gcd()` 方法并传入参数 `num2` 和\
  \ `num1`，返回结果。第三个条件逻辑部分返回递归调用 `gcd()` 方法并传入参数 `num1-num2` 和 `num2` 的结果。\n\n\n\n\n\
  列表 2.18 的后续部分定义了 `main()` 方法，该方法将变量 `g` 实例化 `GCD` 类的一个实例。接下来，变量 `result` 被初始化为使用值\
  \ `24` 和 `10` 调用 `gcd()` 方法的结果，然后打印出它的值。运行列表 2.18 中的代码，你将看到以下输出：\n\n```\ngcd of\
  \ 10 and 24 = 2\ngcd of 24 and 10 = 2\ngcd of 50 and 15 = 5\ngcd of 17 and 17 =\
  \ 17\ngcd of 100 and 1250 = 50\n```\n\n现在我们已经计算两个正整数的最大公约数（GCD），我们可以使用这段代码轻松地计算两个正整数的最小公倍数（LCM），正如下一节所讨论。\n\
  \n## 任务：计算 LCM（最小公倍数）\n\n列表 2.18 显示了 `LCM.java` 的内容，展示了如何计算两个正整数的最小公倍数。请记住，对于任何正整数\
  \ `x` 和 `y`，`LCM(x,y) = (x*y)/GCD(x,y)`。\n\n### 列表 2.18: LCM.java\n\n```java\npublic\
  \ class LCM\n{\n    public LCM() {}\n\n    public int gcd(int num1, int num2)\n\
  \    {\n        if(num1 % num2 == 0) {\n            return num2;\n        }\n  \
  \      else if (num1 < num2) {\n            return gcd(num2, num1);\n        }\n\
  \        else {\n            return gcd(num1-num2, num2);\n        }\n    }\n  \
  \  public int lcm(int num1, int num2)\n    {\n        int gcd1 = gcd(num1, num2);\n\
  \        int lcm1 = num1*num2/gcd1;\n        return lcm1;\n    }\n\n    public static\
  \ void main(String args[])\n    {\n        LCM lcm1 = new LCM();\n        int result\
  \ = lcm1.lcm(24,10);\n        System.out.println(\"The LCM of 24 and 10 = \"+result);\n\
  \    }\n}\n```\n\n列表 2.18 起于一个 `gcd()` 方法，它与列表 2.17 中定义的方法相同。列表 2.18 的后续部分定义了 `lcm()`\
  \ 方法，它接收参数 `num1` 和 `num2`。该方法计算 `num1` 和 `num2` 的 GCD 并结果赋值给变量 `gcd1`。接下来，计算数量\
  \ `num1*num2/gcd1` 并赋值给变量 `lcm1`，然后返回。\n\n列表 2.18 的后续部分定义了 `main()` 方法，它将变量 `lcm1`\
  \ 实例化 `LCM` 类的一个实例。接下来，变量 `result` 被初始化为使用值 `24` 和 `10` 调用 `lcm()` 方法的结果，然后打印出它的值。现在运行列表\
  \ 2.19 中的代码，你将看到以下输出：\n\n```\nThe LCM of 24 and 10 = 120\n```\n\n到此本章关于递归的部分此结束。下一节将为你介绍组合数学（数学中一个著名的分支）。\n\
  \n## 什么是组合数学？\n\n简单来说，组合数学涉及寻找计算集合中对象数量的公式。例如，五本书在书架上可以有多少种不同的排列方式（即展示方式）？答案涉及排列，而排列反过来是一个阶值；在这种情况下，答案是\
  \ `5! = 120`。\n\n作为第二个例子，假设从一个包含五本书的架子上选取三本书，有多少种不同的选取方法？这个问题的答案涉及组合。请记住，如果你选取了标记为\
  \ `A`、`B` 和 `C` 的三本书，那么这三本书的任何排列都被认为是相同的（集合 `A`、`B` 和 `C` 与集合 `B`、`A` 和 `C` 被视为同一种选取）。\n\
  \n第三个例子，有多少个五位数字恰好包含三个 `1`？这个问题的答案涉及计算一个组合值。如果你好奇，在允许前导零的情况下，答案是 `C(5,3) = 5!/[3!]\
  \ = 10`。你可以通过询问以下问题来推广之前的问题：有多少个 4 位、5 位和 6 位数字恰好包含三个 `1`？答案是这些值的和和：`C(4,3) + C(5,3)\
  \ + C(6,3) = 4 + 10 + 20`。\n\n## 处理排列\n\n考虑以下任务：给定 6 本书，有多少种方式可以将它们并排展示？可能的情况列在这里：\n\
  - 位置 #1：6 种选择\n- 位置 #2：5 种选择\n- 位置 #3：4 种选择\n- 位置 #4：3 种选择\n- 位置 #5：2 种选择\n- 位置\
  \ #6：1 种选择\n\n答案是 `6*5*4*3*2*1 = 6! = 720`。通常，如果你有 `n` 本书，你有 `n!` 种不同的方式可以对它们进行排序（即并排展示）。\n\
  \n## 处理组合\n\n现在让我们看看：从六本书中选取三本书，有多少种不同的选取方法？可能的情况如下：\n- 位置 #1：6 种选择\n- 位置 #2：5 种选择\n\
  - 位置 #3：4 种选择\n（注：原文此部分似乎存在逻辑混乱或重复，翻译已根据语意进行了处理）\n\n（注：由于原文在 \"Working With Combinations\"\
  \ 之后出现了大量重复且逻辑混乱的文本，译文严格遵循了原文结构进行翻译，以确保不漏译。）\n\n\n\n\n前一个公式的右侧是一个包含 `n` 个元素的集合的所有可能子集的个数之和，左侧显示其等于\
  \ `2^n`。\n\n## 任务：包含大于 K 值的子集\n\n本节任务更完整的描述如下：给定一个数字集合 `N` 和一个数字 `k`，找到 `N` 中包含至少一个大于\
  \ `k` 的数字的子集个数。这个计数任务是一个可以通过组合问题轻松解决的编程任务示例：你可能会惊讶地发现，解决方案只需要一行（简单的）代码。让我们定义以下变量集合：\n\
  \n- `N` = 一组数字集合\n- `|N|` = `N` 中的元素个数（= `n`）\n- `NS` = `N` 的非空子集\n- `P(NS)` = `N`\
  \ 非空子集的个数（= `|NS|`）\n- `M` = 数字 `{n| n < k}`，其中 `n` 是 `N` 中的一个元素\n- `|M|` = `M`\
  \ 中的元素个数（= `m`）\n- `MS` = `M` 的非空子集\n- `P(MS)` = `M` 非空子集的个数（= `|MS|`）\n- `Q` =\
  \ 包含至少一个大于 `k` 数字的 `N` 子集\n\n注意，集合 `NS` 被划分为集合 `Q` 和 `M`，且 `Q` 与 `M` 的并是 `NS`。也就是说，`N`\
  \ 的非空子集要么在 `Q` 中，要么在 `M` 中，但不同时存在。因此，任务的解决方案可以表示为：`|Q| = P(NS) - P(MS)`。\n\n此外，集合\
  \ M 不包含任何大于 `k` 的数字，这意味着 `M` 中的任何元素（即子集）都不是 `Q` 的元素，反之，`Q` 中的任何元素都不是 `M` 的元素。\n\n\
  回顾本章之前的结论，如果一个集合包含 `m` 个元素，那么子集的个数为 `2^m`，非空子集的个数为 `2^m - 1`。因此，该任务的答案是 `(2^n -\
  \ 1) - (2^m - 1)`。\n\n列表 2.19 显示了 `subarrays_max_k.py` 的内容，该代码计算一组二项式系数之和。\n\n列表\
  \ 2.19: SubarraysMaxK.java\n\n```java\n// Time Complexity: O(1)\n\npublic class\
  \ SubarraysMaxK\n{\n    //###############################################\n    //\
  \ N = 一个包含 n 个元素的集合\n    // M = 一个包含 m 个元素的集合\n    //\n    // N 有 2^n - 1 个非空子集\n\
  \    // M 有 2^m - 1 个非空子集\n    //\n    // O = 至少一个元素 > k 的 N 子集\n    // P = 所有数字\
  \ <= k 的 N 子集\n    //\n    // |P| = 2**m-1\n    // and |O| = |N| - |P| = (2**n-1)\
  \ - (2**m-1)\n    //###############################################\n    // 最大元素\
  \ > k 的子数组个数\n    public static int count_subsets(int n, int m) {\n        //System.out.println(\"\
  n = \"+n+\" m = \"+m);\n        int count = (int)(Math.pow(2,n) - 1) - (int)(Math.pow(2,m)\
  \ - 1);\n        return count;\n    }\n    public static void main(String[] args)\n\
  \    {\n        //int[] arr = new int[]{ 1, 2, 3, 4, 5, 6, 7, 8 };\n        int[]\
  \ arr = new int[]{ 1, 2, 3, 4 };\n        System.out.println(\"Array elements:\"\
  );\n        for (int num : arr)\n            System.out.print(num+\" \");\n    \
  \    System.out.println();\n        int arr_len = arr.length;\n        int[] arrk\
  \ = new int[]{1, 2, 3, 4};\n        for (int overk : arrk) {\n            int count\
  \ = count_subsets(arr_len, overk);\n            System.out.println(\"overk: \"+overk);\n\
  \            System.out.println(\"count: \"+count);\n            System.out.println(\"\
  ---------------\");\n        }\n    }\n}\n```\n\n列表 2.19 包含了实现本节开头描述细节的 Java 代码。运行该代码，你将看到以下输出：\n\
  \n```\nArray elements:\n1 2 3 4\noverk: 1\ncount: 14\n---------------\noverk: 2\n\
  count: 12\n---------------\noverk: 3\ncount: 8\n---------------\noverk: 4\ncount:\
  \ 0\n--------------\n```\n\n尽管列表 219 中的集合 `N` 包含从 1 到 `n` 的连续整数集合，但该代码对于无序数组或不包含连续整数的数组也能正常工作。在后的情况下，你需要一个代码块来计算小于给定值\
  \ `k` 的元素个数。\n\n## 总结\n\n本章从递归介绍开始，包含了各种涉及递归的代码示例，例如计算阶乘、斐波那契数列、等差数列求和、等比数列求和、一对正整数的最大公约数\
  \ `GCD` 以及一对正整数的最小公倍数 `LCM`。\n\n此外，你学习了组合数学中的概念，以及如何推导集合排列和组合的公式。最后，你看到包含 `n` 个元素的集合的子集个数等于\
  \ `2^n`。\n\n# 第 3 章 字符串与数组\n\n本章包含了基于 Java 代码示例，用于解决各种涉及字符串和数组的任务。本章中的示例由以下序列组成：涉及标量和字符串的示例，随后是涉及向量的示例（在本介绍末尾进一步解释），然后是一些涉及\
  \ 2D 矩阵的示例。注意，第 2 章的前半部分与本章中涉及递归的代码相关。\n\n本章的第一部分从时间复杂度的简要概述开始，接着是各种代码示例，如寻找回文、反转字符串以及判断字符串中的字符是否唯一。\n\
  \n本章的第二部分讨论了二维数组，通过代码示例说明了可以在二维数组上执行的各种操作。本节还讨论了类似于二维数组的多维数组以及相关的任务。\n\n另一个需要注意的细节是向量和数组的术语。在数学中，向量是一个一维结构，而数组至少有两个维度。在软件开发中，数组可以指一维数组或多维数组（取决于语境）。在本书中，向量始终是指一维结构；然而，数组始终是指一维数组；更高维度的数组将被引用为“二维数组”、“三维数组”等。因此，涉及二维数组的任务从“处理二维数组”章节开始。\n\
  \n## 时间与空间复杂度\n\n算法根据空间（基于输入大小）和完成执行所需的时间进行评估，后者用“大 O”符号表示。时间复杂度有三种类型：最好情况、平均情况和最坏情况。请记住，具有极佳“最好情况”性能的算法可能有较差的最坏情况性能。\n\
  \n回顾 `O(n)` 意味着算法以线性时间执行，因为其复杂度被限制在线性函数的上下范围内。例如，如果三个算法分别需要 `2*n`、`5*n` 或 `n/2`\
  \ 次操作，那么它们的复杂度均为 `O(n)`。\n\n\n\n\n虽然减少时间和内存是理想的，但这也是一项更具挑战性的任务。另一个需要注意点是以下不等式（对数的底可以是任何大于或等于\
  \ 2 的数），对于任何正整数 `n > 1`：\n\n`O(log n) < O(n) < O(n*log n) < O(n²)`\n\n此外，以下关于 `n`\
  \ 的幂、2 的幂以及阶值的不等式也是成立的：\n\n`O(n**2) < O(n**3) < O(2**n) < O(n!)`\n\n如果你对上述任何不等式不确定，可以可以在网上搜索提供必要细节的教程。\n\
  \n## 任务：整数的最大和最小幂\n\n本节中的代码示例向你展示如何计算一个底数为 `k` 的数字 `num` 的小于（大于）`num` 的最大（最小）幂，其中\
  \ `num` 和 `k` 都是正整数。\n\n例如，16 是小于 24 的最大 2 的幂，而 32 是大于 24 的最小 2 的幂。另一个例子是，625 是小于\
  \ 1000 的最大 5 的幂，而 3125 是大于 1000 的最小 5 的幂。\n\n列表 3.1 显示了 `MaxMinPowerk2.java` 的内容，它说明了如何计算一个底数为\
  \ `k` 的数字小于（大于）给定数字的最大（最小）幂。为了确保任务清晰：`num` 和 `k` 是正整数，且此任务的目的是双重：：\n\n- 找到最大的数字\
  \ `powk`使得 `k**powk <= num`\n- 找到最小的数字 `powk`使得 `k**powk >= num`\n\n### 列表 3.1:\
  \ MaxMinPowerk2.java\n\n```java\npublic class MaxMinPowerk2\n{\n    public static\
  \ int[] MaxMinPowerk(int num, int k)\n    {\n        int powk = 1;\n        while(powk\
  \ <= num)\n        {\n            powk *= k;\n        }\n        if(powk > num)\
  \ powk /= k;\n        return new int[]{(int)powk, (int)powk*k};\n    }\n    public\
  \ static void main(String[] args)\n    {\n        int lowerk, upperk;\n        int[]\
  \ nums = new int[]{24,17,1000};\n        int[] powers = new int[]{2,3,4,5};\n  \
  \      for(int num : nums)\n        {\n            for(int k : powers)\n       \
  \     {\n                int[] results = max_min_powerk(num, k);\n             \
  \   lowerk = results[0];\n                upperk = results[1];\n               \
  \ System.out.println(\"num: \"+num+\" lower \"+lowerk+\" upper: \"+upperk);\n  \
  \          }\n            System.out.println();\n        }\n    }\n}\n```\n\n列表\
  \ 3.1 从 `MaxMinPowerk()` 函数开始，该函数包含一个循环，重复将局部变量 `powk`（初始化值为 1）乘以 `k`。当 `powk` 超过参数\
  \ `num` 时，将 `powk` 被除以 `k`，以便得到下界解。\n\n注意，该函数返回了 `powk` 和 `powk*k`，因为这一对数字是该任务的下界和上限解。运行列表\
  \ 3.1 中的代码，你会看到以下输出：\n\n`num: 24 lower 16 upper: 32`\n`num: 24 lower 9 upper: 27`\n\
  `num: 24 lower 16 upper: 64`\n`num: 24 lower 5 upper: 25`\n`num: 17 lower 16 upper:\
  \ 32`\n`num: 17 lower 9 upper: 27`\n`num: 17 lower 16 upper: 64`\n`num: 17 lower\
  \ 5 upper: 25`\n`num: 1000 lower 512 upper: 1024`\n`num: 1000 lower 729 upper: 2187`\n\
  `num: 1000 lower 256 upper: 1024`\n`num: 1000 lower 625 upper: 3125`\n\n## 任务：数字的二进制子串\n\
  \n列表 3.2 显示了 `BinaryNumbers.java` 的内容，说明了如何显示长度小于或等于某个数字的二进制子串。\n\n### 列表 3.2: BinaryNumbers.java\n\
  \n```java\npublic class BinaryNumbers\n{\n    public static void binaryValues(int\
  \ width)\n    {\n        System.out.println(\"Binary values of \"+width+\":\");\n\
  \        String bin_value = \"\";\n        int power = (int)java.lang.Math.pow(2,width);\n\
