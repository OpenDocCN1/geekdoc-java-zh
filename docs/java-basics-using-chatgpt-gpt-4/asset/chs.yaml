  \ 80 200 500\n\n## 总结\n\n本章从搜索算法（如线性搜索和二分搜索（迭代和递归））开始。你还看到了线性搜索和二分搜索之间的比较。接下，你学习了一些著名的排序算法，例如冒泡排序、选择排序、插入排序和合并排序。最后，你学习了可以在项目数组上执行的快速排序。\n\
  \n# 第 5 章：链表\n\n本章向你介绍了一种名为链表的数据结构，包括单链表、双向链表和循环列表。链表支持各种操作，如创建、遍历、插入和删除操作。本章将向你展示如何实现链表以及如何在链表上执行某些操作。第\
  \ 6 章包含了各种任务相关的代码示例，涉及比链表基础操作的操作。请记住，链表的算法通常涉及递归，这在第 2 章中有所讨论。\n\n本章的第一部分向你介绍链表，随后是执行单链表上各种操作的示例，例如创建和显示链表内容，以及更新节点和删除单链表节点。\n\
  \n本章的第二部分向你介绍双向链表，随后是执行双向链表上各种操作的示例，这些示例是单链表代码示例的对应。\n\n在本章和其他章节中还需要的另一点：代码示例提供的解决方案倾向于清晰性而非优化。此外，许多代码示例包含了“被注释掉”的\
  \ `print()` 语句。如果代码示例让你感到困惑，请取消 `print()` 语句以跟踪代码的执行路径：这样做可以使代码更容易于理解，还能为你节省大量时间。事实上，在你读完每个代码示例并完全理解代码后，尝试优化代码，或者使用不同的算法，这将增强你的解决问题能力并增加你的信心。\n\
  \n关于本章以及第 6 章变量命名规范的另一个细节。对于涉及链表的代码示例，“根”节点标记为 `ROOT`，“当前”节点标记为 `CURR`，“最后一个”节点标记为\
  \ `LAST`。这种风格旨在当关联列表元素被创建或修改时引起你对这些变量的注意。然而，你也可以采用其他编码风格，其中先前的变量使用小写而不是大写。\n\n最后，如果你已经熟悉了链表，那么你可能已经为第\
  \ 6 章中与链表相关的任务做好了准备。\n\n## 数据结构类型\n\n本节向你介绍了线性数据结构（栈和队列）和非线性数据结构（树和图）的概念，其中一些在第\
  \ 5、6 和 7 章中有所讨论。这些章节指出了这些数据结构非常适合的任务（例如插入新元素或查找现有元素）。此外，你将看到每种数据结构的 Java 代码示例，执行诸如如何插入、更新和删除元素的操作。\n\
  \n\n\n\n\n线性数据结构是指元素在顺序内存位置中出现或在逻辑上连接的数据结构，例如栈和队列。正如你在第 6 章中将看到的，栈是后进先出（LIFO）数据结构，这意味着最后一个插入的元素是第一个移除的元素。此外，操作是在栈的末端进行的。栈在现实中的对应物是一个只有一个入口且该入口也是唯一出口的电梯。\n\
  \n在第 7 章中，你将学习队列，队列是先进先出（FIFO）数据结构，这意味着第一个插入的元素是第一个移除的元素。与栈相比，插入操作在队列所谓的“前端”执行，删除操作在队列的“尾部”执行。队列在现实中的对应物是一排队买电影票的人。\n\
  \n## 非线性数据结构\n\n非线性数据结构是指元素不是顺序排列的数据结构，例如树和图。正如你在第 7 章中将看到的，树有一个被称为根节点的单一节点，它没有父节点，而所有其他节点恰好有一个父节点。如果两个节点之间有一条边连接，则这两个节点是相关的。事实上，树中的节点具有层次结构关系。正如你在第\
  \ 7 章中将看到的，树可以具有无向边、有向边和环。\n\n图是树的泛化，图中的节点可以有多个父节点。此外，图没有根节点：相反，图可以有一个“源”和一个“汇”，它们有点类似于“开始”节点和“结束”节点。这种标记出现在表示传输网络的图中，图中边可以分配权重。想象从仓库（“源”）运输食物或其他商品并有多条路线到达目的地（“汇”）的卡车。\n\
  \n# 数据结构与操作\n\n在书中，单链表的数据结构是一个自定义的 `Node` 结构，包含以下内容：\n- 一个键/值对\n- 指向下一个节点的指针\n\n\
  双链表的数据结构是一个自定义的 `Node`，包含以下内容：\n- 一个键/值对\n- 指向下一个节点的指针\n- 指向上一个节点的指针\n\n栈和队列的数据结构都是\
  \ Java list。\n\n树的数据结构是一个自定义节点，包含以下内容：\n- 一个键/值对\n- 指向左节点的指针\n- 指向右节点的指针\n\n哈希表的数据结构是一个\
  \ Java dictionary。之前的结构是基于简单性考虑的；但请记住也存在其他结构。例如，你可以使用数组来实现列表、栈、队列，甚至是树。\n\n## 数据结构上的操作\n\
  \n正如你在本章后续以及其他章节中将看到的，对这些数据结构的操作通常涉及以下内容：\n- 插入（包括追加）\n- 删除\n- 搜索\n- 更新（现有元素）\n\
  - 检查结构是否为空\n- 检查结构是否满（队列和栈）\n\n## 什么是单链表？\n\n虽然数组是有用的数据结构，但它们的缺点之一是数组的大小或元素数量必须提前预知。另一种不具有这种缺点的替代方案是“链表”，它正是本章的主题。\n\
  \n单链表是数据元素的集合，通常称为节点。节点包含两个内容：\n- 存储在节点中的值\n- 下一个节点的位置（称为其继继节点）\n\n通过类比，想象跳康加舞：每个舞者都是一个节点，舞者将手放在另一位舞者的臀部上：后一个舞者就是下一个节点的位置。\n\
  \n与数组不同，链表是根据需要动态创建的。此外，之前的类比清楚了这样一点：存在一个“最后一个”节点，它没有下一个节点。因此，列表中的最后一个节点其继继节点为 `None`（即下一个节点）。\n\
  \n通常情况下，单链表中的节点可以是以下三种类型之一：\n- “根”节点\n- 中间节点\n- 最后一个节点（没有后继元素）\n\n当然，，当链表为空时，上述列表中的节点将不会被初始化。\n\
  \n## 链表的权衡\n\n每个数据结构都有权衡，也就是说有优点和缺点。特别是，链表具有以下优势：\n- 易于向列表中追加元素\n- 易于向列表中插入元素\n\
  - 易于从列表中删除元素\n- 不需要提前预知列表中的项目数量\n\n与数组不同，上述项目符号列表中的操作不需要“移动”数组的元素：只需要更新指针即可。\n\n\
  然而，链表确实有缺点：\n- 搜索元素更困难（更耗时）\n- 需要更大的内存\n\n因此，当元素数量提前预知且没有插入或删除（只有更新）时，数组效果更好；当数据元素数量无法预知时，链表效果更好。\n\
  \n与数组不同，链表的元素可以存储在非连续的内存位置：next 字段的值提供了链表中下一个节点的位置（但具有 `None` 作为下一个节点的“最后一个”节点除外）。\n\
  \n## 单链表：创建与追加操作\n\n链表支持多种操作，包括插入（添加新节点）、删除（现有节点）、更新（更改值）和遍历（列出所有节点）。后续章节将详细讨论这些操作。\n\
  \n### 单链表的 Node 类\n\n列表 5.1 显示了 `SLNode.java` 内容，说明了如何定义单链表中单个节点的 `Node` 类。\n\n\
  ```java\npublic class SLNode {\n    static class Node {\n        String data = \"\
  \";\n        Node next = null;\n        Node(String data) {\n            this.data\
  \ = data;\n            this.next = null;\n        }\n    }\n    public static void\
