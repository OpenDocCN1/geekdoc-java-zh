  \n## 在单向链表中更新节点\n\n以下伪代码解释了如何在链表中搜索一个元素，如果该元素存在，则更新其内容：\n\n```text\nCURR = ROOT\n\
  Found = False\nOLDDATA = \"something old\";\nNEWDATA = \"something new\";\n\nif\
  \ (ROOT == NULL)\n{\n    print(\"* 空链表 *\");\n}\n\nwhile (CURR != NULL)\n{\n   \
  \ if(CURR->data == OLDDATA)\n    {\n        print(\"找到值为\",OLD 节点\",OLDDATA);\n\
  \        CURR->data = NEWDATA;\n    }\n    if(Found == True) { break; }\n    PREV\
  \ = CURR;\n    CURR = CURR->next;\n}\n```\n\n### 更新节点的 Java 代码\n\n列表 5.5 显示了 `UpdateSLNode.java`\
