  \n## 来自 GPT-4 的“HELLO WORLD”\n\n既然你现在已经对 `ChatGPT` 和 `GPT-4` 有了基本的了解，让我们来看看使用 `ChatGPT`\
  \ 的“Hello World”代码示例。列表 8.1 显示了 `ChatGPT` 生成的代码示例 `HelloWorld.java` 的内容。\n\n###\
  \ 列表 8.1：HelloWorld.java\n\n```java\npublic class HelloWorld {\n    public static\
