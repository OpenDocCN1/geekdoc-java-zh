  \n此外，你学习了处理字符串的方法、如何检查字符串中的唯一字符、如何在字符串中插入字符以及如何找到字符串的排列。接下来，你学习了如何判断一个字符串是否为回文。\n\
  \n此外，你学习了如何计算矩阵的转置，这等同于将图像的位图旋转 90 度。\n\n# 第 4 章：搜索与排序算法\n\n本章的前半部分介绍了一些著名的搜索算法，后半部分讨论了各种排序算法。\n\
  \n本章的第一节介绍了一些搜索算法，如 `linear search`（线性搜索）和 `binary search`（二分查找），当你在 `array` 中搜索项目（可以是数字或字符）时可以使用这些算法。`linear\
  \ search` 的效率较低，因为它平均需要 `n/2`（复杂度为 `O[n]`）次比较来确定搜索元素是否存在于 `array` 中，其中 `n` 是列表或\
  \ `array` 中的元素数量。\n\n相比之下，`binary search` 需要 `O (log n)` 次比较，在处理较大的项目集时效率高得多。例如，如果一个\
  \ `array` 包含 1024 个项目，最多只需要十次比较就能找到一个元素，因为 `2**10 = 1024`，所以 `log(1024) = 10`（以\
  \ 2 底）。然而，`binary search` 算法要求项目是有序的。\n\n本章的第二部分讨论了一些著名的排序算法，如 `bubble sort`（泡沫排序）、`selection\
  \ sort`（选择排序）、`insertion sort`（插入排序）、`merge sort`（合并排序）以及 `quicksort`（快速排序），你可以在项目\
  \ `array` 上执行这些算法。\n\n## 搜索算法\n\n以下列表包含了将在几个小节中讨论的一些著名搜索算法：\n\n- `linear search`\n\
  - `binary search`\n- `jump search`（跳跃搜索）\n- `Fibonacci search`（斐波那契搜索）\n\n`linear\
  \ search` 算法可能是所有搜索算法中最简单的：该算法检查 `array` 中的每一个元素，直到找到所需的项目或到达 `array` 的末。\n\n然而，正如你在本章引言中学到的，当\
  \ `array` 包含大量数值时，`linear search` 是低效的。如果 `array` 非常小，`linear search` 和 `binary\
  \ search` 之间的性能差异可能很小；在这种情况下，`linear search` 可能是一个可以接受的算法选择。\n\n在 RDBMS（关系型数据库管理系统）世界，表通常有一个索引（有时是多个），以便更有效地执行表搜索。然而，索引涉及额外的计算开销，索引是存储在磁盘上的独立数据结构。相反，`linear\
  \ search` 只涉及表中的数据。根据经验，当表行数超过 300 行时，基于索引的搜索更有效（但结果可能有所不同）。下一节包含一个在数字 `array` 上执行\
  \ `linear search` 的代码示例。\n\n## 线性搜索\n\n列表 4.1 显示了 `LinearSearch.java` 的内容，它说明了如何对数字\
  \ `array` 执行 `linear search`。\n\n列表 4.1: LinearSearch.java\n\n```java\npublic class\
  \ LinearSearch\n{\n    public static void main(String[] args)\n    {\n        int\
  \ found = -1, item = 123;\n        int[] arr1 = new int[]{1,3,5,123,400};\n    \
  \    for(int i=0; i<arr1.length; i++) {\n            if (item == arr1[i]) {\n  \
  \              found = i;\n                break;\n            }\n        }\n  \
  \      if (found >= 0)\n            System.out.println(\"found \"+item+\" in position\
  \ \"+found);\n        else\n            System.out.println(item+\" not found\");\n\
  \    }\n}\n```\n\n列表 4.1 从变量 `found` 开始，其初始化值为 -1，随后是搜索项目 123，以及包含数字数组的数组 `arr1`。接下来是一个循环，遍历整数\
  \ `array` `arr1` 的元素，将每个元素与 `item` 的值进行比较。如果发生匹配，变量 `found` 设置为循环变量 `i` 的值，然后提前退出。\n\
  \n列表 4.1 的最后部分检查变量 `found` 的值：如果是非负数，则找到了搜索项目（否则它不在 `array` 中）。运行列表 4.1 中的代码，你将看到以下输出：\n\
  \n`found 123 in position 3`\n\n记住以下一点：尽管 `array` `arr1` 包含一个有序数字列表，但该代码对于无序列表同样可以工作。\n\
  \n### 二分查找演练\n\n`binary search` 需要一个有序的 `array`，可以通过迭代算法实现，也可以通过递归解决方案。核心思想是将排序元素\
  \ `array` 的中间元素与搜索元素进行比较。如果它们相等，则找到了该项目；如果中间元素小于搜索元素，则对 `array` 的右半部分重复之前的步骤；如果中间元素大于搜索元素，则对\
  \ `array` 的左半部分重复之前的步骤。最终会被元素（如果它出现在 `array` 中），或者当子数组只有一个元素时停止分割（即无法进一步拆分）。\n\n\
  让我们对有序 `array` 中的项目进行 `binary search` 演练。\n\n示例 1：假设 `item` 为 25 且 `arr1` 为 [10,\
  \ 20, 25, 40, 100]。中间索引为 3。由于 `arr1[3]` == item，算法终止。\n\n示例 2：假设 `item` 为 25 且 `arr1`\
  \ 为 [1, 5, 10, 15, 20, 30]。中间索引为 2。由于 `arr1[2]` < item，我们搜索右半部分。\n\n示例 3：假设 `item`\
  \ 为 25 且 `arr1` 为 [1, 5, 10, 15, 20, 30, 40, 100]。中间索引为 3。由于 `arr1[3]` < item，我们搜索右半部分。\n\
  \n列表 4.2 显示了 `binary search` 的迭代解决方案。\n\n列表 4.2: BinarySearch.java\n\n```java\n\
  public class BinarySearch\n{\n    public static void main(String[] args)\n    {\n\
  \        int[] arr1 = {1,3,5,123,400};\n        int left = 0, found = -1, item =\
  \ 123;\n        int right = arr1.length-1;\n        System.out.print(\"array: \"\
  );\n        for(int i=0; i<arr1.length; i++) {\n            System.out.print(arr1[i]+\"\
  \ \");\n        }\n        System.out.println(\"\");\n        while(left <= right)\
  \ {\n            int mid = (int)(left + (right-left)/2);\n            if(arr1[mid]\
  \ == item) {\n                found = mid;\n                break;\n           \
  \ } else if (arr1[mid] < item) {\n                left = mid+1;\n            } else\
  \ {\n                right = mid-1;\n            }\n        }\n        if( found\
  \ >= 0)\n            System.out.println(\"found \"+item+\" in position \"+found);\n\
  \        else\n            System.out.println(item+\" not found\");\n    }\n}\n\
  ```\n\n\n\n\n列表 4.2 初始化了一个数字数组和一些标量变量，用于跟踪我们每次划分数组时要搜索的子数组的左、右索引位置。列表 4.2 的后续部分包含了条件逻辑，实现了你在你在节节示例中看到的步骤序列。运行列表\
  \ 4.2 中的代码，你将看到以下输出：\n\narray: [ 1   3   5 123 400]\n\n在位置 3 找到 123\n\n## 二分查找（递归解）\n\
  \n列表 4.3 显示了 `BinarySearchRecursive.java` 的内容，说明了如何对数字数组进行递归二分查找。\n\n### 列表 4.3：BinarySearchRecursive.java\n\
  \n```java\npublic class BinarySearchRecursive\n{\n    public static Boolean binarySearch(int[]\
  \ data, int item, int left, int right)\n    {\n        if( left > right ) {\n  \
  \          return false;\n        } else {\n            //错误的（可能导致溢出）：\n       \
  \     //int mid = (left + right) / 2\n            int mid = (int)(left + (right-left)/2);\n\
  \            if(item == data[mid]) {\n                return true;\n           \
  \ } else if(item < data[mid]) {\n                //递归地搜索左半部分\n                return\
  \ binarySearch(data, item, left, mid-1);\n            } else {\n               \
  \ //递归地搜索右半部分\n                return binarySearch(data, item, mid+1, right);\n\
  \            }\n        }\n    }\n    public static void main(String[] args)\n \
  \   {\n        int[] items = new int[]{-100, 123, 200, 400};\n        int[] arr1\
