  \ str2: Sally$\nstr3: *?) str4: +.@$\nstr5: $\n$  str6: ^I$\n```\n\n`$` 符号表示上述输出块中的行尾。注意最后一行显示为\
  \ `^I$`，这表示存在制表符，它是列表 1.5 中变量 `str6` 的值。\n\n### JAVA 的 NEW 运算符\n\n上一节包含了多个直接在 Java\
  \ 中直接赋值字符串的示例。实现此操作的另一种方法涉及 `new` 运算符，它在表面上看起来是一样的，但有一个重要的区别。当你以列表 1.6 所示的方式初始化两个相同字符串的变量时，它们占据相同的内存位置。当你使用\
  \ `new` 运算符时，两个变量将占据不同的内存位置。\n\n列表 1.6 显示了 `ShowPeople.java` 的内容，该文件使用 `new` 运算符初始化两个字符串并打印它们的值。\n\
  \n### 列表 1.6: ShowPeople.java\n\n```java\npublic class ShowPeople\n{\n    // cannot\
