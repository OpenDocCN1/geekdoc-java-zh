  ```\n\n再次，双向链表中的节点可以是以下类型之一：\n\n1) “根”节点\n2) 中间节点\n3) 最后一个节点（没有下一个节点）\n\n当然，当链表为空时，前述列表中的节点为\
  \ `None`。\n\n## 在双向链表中添加节点\n\n当你创建一个链表时，必须始终检查根节点是否为空：如果是，则你创建一个根节点；否则，你将新节点附加到最后一个节点。让我们将前面的句子翻译成伪代码，描述如何向链表添加新元素：\n\
  \n```text\n让 ROOT 为链表的根节点（初始为 NULL）\n让 LAST 为链表的最后一个节点（初始为 NULL）\n让 NEW 为一个新节点，其\
  \ NEW->next = NULL 且 NEW->prev = NULL\n# 决定在何处插入该节点：\nif (ROOT == NULL) {\n    ROOT\
  \ = NEW;\n    ROOT->next = NULL;\n    ROOT->prev = NULL;\n    LAST = NEW;\n    LAST->next\
  \ = NULL;\n    LAST->prev = NULL;\n}\nelse {\n    NEW->prev = LAST;\n    LAST->next\
  \ = NEW;\n    NEW->next = NULL;\n    LAST = NEW;\n}\n```\n\n在双向链表中，最后一个节点总是指向空值。\n\
