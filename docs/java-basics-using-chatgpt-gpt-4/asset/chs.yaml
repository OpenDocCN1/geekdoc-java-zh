  My name is John Smith\");\n        // str3 and str4 occupy the same memory location\n\
  \        str3 = \"My name is Jane Andrews\";\n        str4 = \"My name is Jane Andrews\"\
  ;\n        System.out.println(str1);\n        System.out.println(str2);\n      \
