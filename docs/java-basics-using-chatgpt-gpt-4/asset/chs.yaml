  \ 的内容，展示了如何解决此任务。\n\n## 列表 3.29：SwapAdjacentBits.java\n\n```java\npublic class SwapAdjacentBits\n\
  {\n    public static String toBinaryString(int n)\n    {\n        return String.format(\"\
  %32s\", Integer.toBinaryString(n))\n                             .replaceAll(\"\
  \ \", \"0\");\n    }\n    // 交换给定数字相邻位的函数\n    public static int swapAdjacentBits(int\
