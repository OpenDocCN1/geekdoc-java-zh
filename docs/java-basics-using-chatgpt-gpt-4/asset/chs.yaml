  \            ROOT.next = ROOT;\n            //System.out.println(\"1NEW initialized\
  \ Root: \"+ROOT.data);\n        } else {\n            if(ROOT.next == ROOT) {\n\
  \                //System.out.println(\"Found SINGLE NODE Root: \"+ROOT.data);\n\
  \                Node NEWNODE = new Node(item);\n                ROOT.next = NEWNODE;\n\
  \                NEWNODE.next = ROOT;\n                //System.out.println(\"Root:\
  \ \"+ROOT.data+\" NEWNODE: \"+NEWNODE.data);\n            } else {\n           \
  \     // 遍历列表找到 ROOT 之前的节点：\n                Node LAST = ROOT;\n               \
  \ LAST = LAST.next;\n                while(LAST.next != ROOT) {\n              \
  \      LAST = LAST.next;\n                }\n                Node NEWNODE = new\
  \ Node(item);\n                NEWNODE.next = ROOT;\n                LAST.next =\
  \ NEWNODE;\n                //System.out.println(\"3Node NEW LAST: \"+NEWNODE.data);\n\
  \            }\n        }\n        //System.out.println(\"Returning ROOT: \"+ROOT.data);\n\
  \        return ROOT;\n    }\n    public static void displayList(Node ROOT)\n  \
  \  {\n        Node CURR = ROOT;\n        if( ROOT == null ) {\n            System.out.print(\"\
  * empty list *\");\n            return;\n        }\n        System.out.print(CURR.data+\"\
  \ \");\n        CURR = CURR.next;\n        // 显示列表中的项：\n        while(CURR != ROOT)\
  \ {\n            System.out.print(CURR.data+\" \");\n            CURR = CURR.next;\n\
