  0 0 0 1 1 1 2 2 2\n\n# 任务：生成一个出现概率是 1 三倍的 0\n\n该任务的解决方案基于这样一个观察：一个带有两个输入输入的 AND\
  \ 运算符会生成三个 0 和一个 1：我们只需要随机生成一个 0 和一个 1，并将这些随机数提供给它。列表 3.22 显示了 `GenerateZeroOr.java`\
  \ 的内容，展示了如何生成 0 和 1。\n\nLISTING 3.22: GenerateZeroOr.java\n```java\npublic class\
  \ GenerateZeroOr {\n    public static void main(String[] args) {\n        int zeroes=0,\
  \ ones=0, max=100;\n        for(int i=0; i<max; i++) {\n            int x = (int)(Math.random()*2);\n\
  \            int y = (int)(Math.random()*2);\n            int xy = x & y;\n    \
  \        if(xy == 0) zeroes++;\n            if(xy == 1) ones++;\n        }\n   \
  \     System.out.println(\"Percentages (\"+max+\" iterations):\");\n        System.out.println(\"\
  ones: \"+(100*ones/max));\n        System.out.println(\"zeroes: \"+(100*zeroes/max));\n\
  \    }\n}\n```\n\n列表 3.22 定义了一个 `main()` 方法，将 `zeroes`、`ones` 和 `max` 初始化为 0、0 和\
  \ 100。接下来的代码部分包含一个 `max` 次循环，每次迭代随机生成 0 或 1 的整数 `x` 和 `y`，然后将 `xy` 赋值为 `x` 和 `y`\
  \ 的逻辑与结果。根据 `xy` 是否等于 0 或 1 增加 `ones` 或 `zeroes`。列表 3.22 显示了 `max`、`ones` 和 `zeroes`\
  \ 的值。运行列表 3.22 中的代码，你将看到以下输出：\n\nPercentages (100 iterations):\nones: 74\nzeroes:\
  \ 26\n\n# 任务：反转偶数位的位\n\n此任务的解决方案涉及两个部分：第一部分提取偶数位并右移一位，第二部分提取奇数位并左移一位。列表 3.23 显示了\
  \ `SwitchPairs.java` 的内容，展示了如何解决此任务。\n\nLISTING 3.23: SwitchPairs.java\n```java\n\
  public class SwitchPairs {\n    public static void main(String[] args) {\n     \
  \   // 此任务涉及两个二进制掩码：\n        // A 用于偶数位，5 用于奇数位\n        // hex A = 8 + 2 = 1010\n\
  \        // hex 5 = 4 + 1 = 0101\n        // 01010101 1+4+16+64 = 85\n        //\
  \ 10101010 2+8+32+128 = 170\n        int[] numbers = {42, 37, 52, 63};\n       \
  \ for(int num : numbers) {\n            String bnum = Integer.toBinaryString(num);\n\
