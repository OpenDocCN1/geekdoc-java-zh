  \     abcdxyz\nreversed: zyxdcba\n\n## 任务：寻找栈回文\n\n列表 7.9 显示了 `StackPalindrome.java`\
  \ 的内容，它说明了如何定义栈以及在栈上执行各种操作。\n\n#### 列表 7.9：StackPalindrome.java\n\n```java\nimport\
  \ java.util.ArrayList;\n\npublic class StackPalindrome\n{\n    static int MAX =\
  \ 40; // 100\n    static ArrayList mystack = new ArrayList();\n    public static\
  \ Boolean isEmpty()\n    {\n        return mystack.size() == 0;\n    }\n    public\
  \ static Boolean isFull()\n    {\n        return mystack.size() == MAX;\n    }\n\
  \    public static void push(char item)\n    {\n        if(isFull() == false) {\n\
  \            mystack.add(item);\n            //System.out.println(\"appended stack\
  \ item: \"+item);\n        } else {\n            System.out.println(\"stack is full:\
  \ cannot append \"+item);\n            //System.out.println(\"Current stack size:\
  \ \"+mystack.size());\n        }\n    }\n    public static void main(String[] args)\n\
  \    {\n        Boolean palindrome = true;\n        String[] myStrings = new String[]\n\
  \            {\"abc\", \"bob\", \"radar\", \"abcdefdcba\"};\n        // compare\
  \ characters from opposite ends of the ArrayList:\n        for(String currStr :\
  \ myStrings)\n        {\n            palindrome = true;\n            char item1,\
  \ item2;\n            for(int idx=0; idx<currStr.length()/2; idx++)\n          \
  \  {\n                item1 = currStr.charAt(idx);\n                item2 = currStr.charAt(currStr.length()-idx-1);\n\
  \                if(item1 != item2) {\n                    palindrome = false;\n\
  \                    break;\n                }\n            }\n            System.out.println(\"\
  string:      \"+currStr);\n            System.out.println(\"palindrome: \"+palindrome);\n\
  \            System.out.println();\n        }\n    }\n}\n```\n\n列表 7.9 首先将变量 `mystic`\
  \ 定义为 `ArrayList` 类的一个实例，该结构代表一个栈。此外，列表 7.9 包含了 `isEmpty()`、`isFull()`、`push()`\
  \ 和 `main()` 方法，分别用于检查栈是否为空、检查栈是否满、在栈上放入新元素以及 `main()` 方法。\n\n`isEmpty()` 方法根据栈的大小是否为\
  \ 0 返回一个 `Boolean` 值，而 `isFull()` 方法根据栈的大小是否为 `MAX` 返回一个 `Boolean` 值，`MAX` 是栈允许的最大尺寸。`push()`\
  \ 方法首先检查 `isFull()` 方法是否返回 `false`；如果是，则将一个元素添加到栈中。否则，将打印一条消息表示栈已满。\n\n`main()`\
  \ 方法将变量 `myStrings` 初始化为字符串数组，随后通过一个循环遍历 `myStrings` 的各个元素。在每次迭代中，都会对给定字符串的末端元素进行比较：如果它们不同，则该字符串不是回文，变量\
  \ `palindrome` 被设置为 `false`，并通过 `break` 语句提前退出循环。在循环执行完毕后，将显示当前字符串以及一条指示该字符串是否为回文的消息。运行\
  \ 7.9 中的代码，你将看到如下输出：\n\nstring:  abc\npalindrome: false\nstring:  bob\npalindrome:\
  \ true\nstring:  radar\npalindrome: true\nstring:  abcdefdcba\npalindrome: false\n\
  \n## 任务：平衡括号\n\n列表 7.10 显示了 `ArrayParens.java` 的内容，它说明了如何使用数组来判断字符串是否包含平衡括号。\n\n\
  #### 列表 7.10：ArrayParens.java\n\n```java\nimport java.util.ArrayList;\npublic class\
  \ StackParentheses\n{\n    static int MAX = 100;\n    static ArrayList mystack =\
  \ new ArrayList();\n    public static Boolean isEmpty()\n    {\n        return mystack.size()\
  \ == 0;\n    }\n    public static Boolean isFull()\n    {\n        return mystack.size()\
  \ == MAX;\n    }\n    public static void push(char item)\n    {\n        if(isFull()\
  \ == false) {\n            mystack.add(item);\n        } else {\n            System.out.println(\"\
  stack full: cannot append \"+item);\n        }\n    }\n    public static Boolean\
  \ pairInBPairs(String[] balan_pairs, String str)\n    {\n        for(String elem\
  \ : balan_pairs)\n            if(elem.contains(str))\n                return true;\n\
  \        return false;\n    }\n    public static Boolean checkBalanced(String my_expr)\n\
  \    {\n        String left_chars = \"([{\";\n        String right_chars = \")]}\"\
  ;\n        String[] balan_pairs = new String[]{\"()\",\"[]\",\"{}};\n        ArrayList\
  \ mystack = new ArrayList();\n        System.out.println(\"checking: \"+my_expr);\n\
  \        for(int idx=0; idx<my_expr.length(); idx++) {\n            char char1 =\
  \ my_expr.charAt(idx);\n            String char1Str = String.valueOf(char1);\n \
  \           if(left_chars.contains(char1Str)) {\n                mystack.add(char1Str);\n\
  \            } else if (right_chars.contains(char1Str)) {\n                if(mystack.size()\
  \ > 0) {\n                    String top1Str = (String)mystack.get(mystack.size()-1);\n\
  \                    String two_chars = top1Str + char1Str;\n                  \
  \  if(pairInBPairs(balan_pairs, two_chars) == true) {\n                        mystack.remove(mystack.size()-1);\n\
  \                        if(mystack.size() == 0) {\n                           \
  \ mystack = new ArrayList();\n                            continue;\n          \
  \              } else {\n                            break;\n                  \
  \      }\n                    }\n                } else {\n                    System.out.println(\"\
  empty stack: invalid string \"+my_expr);\n                    return false;\n  \
  \              }\n            } else {\n                return false;\n        \
  \    }\n        }\n        return (mystack.size() == 0);\n    }\n    public static\
  \ void main(String[] args)\n    {\n        String[] exprs = new String[]{\"()}{[()]}\"\
  , \"(())(()()]\"};\n        for(String expr : exprs) {\n            if(checkBalanced(expr))\n\
  \                System.out.println(\"=> balanced: \"+expr);\n            else\n\
  \                System.out.println(\"=> unbalanced: \"+expr);\n            System.out.println();\n\
  \        }\n    }\n}\n```\n\n（注：列表 7.10 是本章中最代码示例，它还揭示了结合栈和递归来解决当前任务的用处，即判断字符串是否构成平衡括号。）\n\
  \n\n\n\n此代码示例的核心思想涉及两个操作和一个逻辑比较，如下所示：\n\n1.  每当在当前字符串中遇到左括号 `(` 时，将该括号推入栈中。\n2.\
  \  每当在当前字符串中遇到右括号 `)` 时，我们检查栈顶元素，看它是否与对应的左括号相等。\n3.  如果 #2 中的比较为真，我们从栈中弹出顶部元素。\n\
  4.  如果 #2 中的比较为假，则该字符串是不平衡的。\n\n重复上述步骤直到我们到达字符串末尾：如果栈为空，则该表达式是平衡的；否则，表达式是不平衡的。\n\
  \n例如，假设我们将字符串 `my_expr` 初始化为“()”。第一个字符是 `(`，它是一个左括号：上述步骤 #1 告诉我们将 `(` 推入我们（起初为空的）名为\
  \ `mystack` 的栈中。`my_expr` 中的下一个字符是 `)`，它是一个右括号：上列表中的步骤 #2 告诉我们将 `)` 与栈顶的元素 `(` 进行比较。由于\
  \ `(` 和 `)` 构成了一对平衡的括号，我们从栈中弹出元素 `(`。我们也已经到达了 `my_expr` 的末尾，由于栈是空的，我们得出结论“()”是一个平衡表达式（我们已经知道了）。\n\
  \n现在假设我们将字符串 `my_expr` 初始化为“((”。第一个字符是 `(`，是一个左括号，上列表中的步骤 #1 告诉我们将 `(` 推入我们（起初为空的）名为\
  \ `mystack` 的栈中。`my_expr` 中的下一个字符是 `(`，是一个左括号：上列表中的步骤 #1 告诉我们将 `(` 推入栈中。我们已经到达了\
  \ `my_expr` 的末尾，由于栈不为空，我们确定 `my_expr` 是平衡的。\n\n第三个例子，假设我们将字符串 `my_expr` 初始化为“(()”。第一个字符是\
  \ `(`，是一个左括号：上列表中的步骤 #1 告诉我们将 `(` 推入我们（起初为空的）名为 `mystack` 的栈中。`my_expr` 中的下一个字符是\
  \ `(`，是一个左括号：上列表中的步骤 #1 告诉我们将另一个 `(` 推入栈中。`my_expr` 中的下一个字符是 `)`，步骤 #2 告诉我们将 `)`\
  \ 与栈顶的元素 `(` 进行比较。由于 `(` 和 `)` 构成了一对平衡的括号，我们弹出栈中最顶部的元素。此时，我们已经到达了 `my_expr` 的末尾，由于栈不为空，我们知道\
  \ `my_expr` 是不平衡的。\n\n尝试用包含括号序列的额外字符串跟踪执行代码。在完成之后，列表格 7.13 中的代码细节将变得易于理解。\n\n列表格\
  \ 7.10 中的下一个代码块将变量 `my_expr` 初始化为字符串数组，每个字符串由各种括号（圆括号、方括号和大括号）组成。下半部分是一个循环，它遍历 `my_expr`\
  \ 的元素，并依次调用函数 `checkBalanced()` 来确定哪些元素（如果有）构成了平衡括号。运行列表格 7.10 中的代码，你将看到如下输出：\n\n\
  ```\nchecking string: [()]{}{[()()]()}\n=> balanced:          [()]{}{[()()]()}\n\
  \nchecking string: [()]{}{[()()]()]\n=> unbalanced:      [()]{}{[()()]()]\n\nchecking\
  \ string: (()]{}{[()()]()]\n=> unbalanced:      (()]{}{[()()]()]\n\nchecking string:\
  \ (())(()()()()()]\n=> unbalanced:      (())(()()()()()]\n```\n\n考虑增强列表格 7.13，使得对于包含不平衡括号的字符串显示无效字符。\n\
