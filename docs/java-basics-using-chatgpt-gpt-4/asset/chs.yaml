  \ \"+upper);\n    }\n}\n```\n\nListing 1.10 定义了 Java 类 `CapitalizeAll` 以及一个 `main()`\
  \ 方法，该方法用文本字符串初始化字符串 `line1`。`main()` 方法的下一部分通过 `split()` 方法将 `line1` 分词为单词数组。接下来，循环遍历\
  \ `words` 中的每个单词，并将 `first` 设置为当前单词首字母的大写版本，并与剩余字母拼接，所示：`first = word.substring(0,1).toUpperCase()+word.substring(1)`。循环还将将\
  \ `first` 和一个空格拼接到字符串 `line2` 中，`line2` 将由每个单词首字母大写的单词组成。`main` 函数的最后部分显示修改后的句子内容以及句子的小写版本，最后是原始的大写版本。运行列表\
  \ 1.16 中的代码，你将看到：\n\nline1: this is a SIMPLE sentence.\nline2: This Is A Sentence.\n\
  Lower: this is a simple sentence.\nUpper: THIS IS A SENTENCE.\n\n## 在 Java 中解析字符串\n\
  \nJava 支持命令行参数，这允许你从命令行启动程序。使用 `equals()` 方法比较 Java 字符串以确定值是否相同。虽然某些语言通过 `==` 比较字符串，但在\
  \ Java 中 `==` 只比较两个字符串的引用（而不是值）。\n\n## Java 中的条件逻辑\n\n条件逻辑允许你根据条件做出决策。最简单的类型是 `if`\
  \ 语句，但也可以使用 `else` 以及 `else-if` 语句。Java 的另一种结构是 `switch` 语句，它也涉及条件逻辑，并且某些任务用 `switch`\
  \ 语句处理比多个 `if-else` 语句更简单。\n\nListing 1.11 显示了 `Conditional1.java` 的内容，它将两个数字除以整数并使用整数余数打印各种消息。\n\
  \n### 列表 1.11: Conditional1.java\n\n```java\npublic class Conditional1\n{\n    int\
  \ x = 12, y = 15;\n    public Conditional1() {}\n    public void IfElseLogic()\n\
  \    {\n        if(x % 2 == 0) {\n            System.out.println(\"x is even: \"\
  +x);\n        } else if(x % 4 == 0) {\n            System.out.println(\"x is divisible\
  \ by 4: \"+x);\n        } else {\n            System.out.println(\"x is odd: \"\
  +x);\n        }\n        if(x % 2 == 0) {\n            if(x % 4 == 0) {\n      \
  \          System.out.println(\"x is divisible by 4: \"+x);\n            }\n   \
  \     }\n        if(y % 3 == 0 && y % 5 == 0) {\n            System.out.println(\"\
  y is divisible by 3 and 5: \"+y);\n        } else if(y % 3 == 0) {\n           \
  \ System.out.println(\"y is divisible only by 3: \"+y);\n        } else if(y % 5\
  \ == 0) {\n            System.out.println(\"y is divisible only by 5: \"+y);\n \
  \       } else {\n            System.out.println(\"y is not divisible by 3 or 5:\
  \ \"+y);\n        }\n    }\n\n    public static void main(String args[])\n    {\n\
  \        Conditional1 c1 = new Conditional1();\n        c1.IfElseLogic();\n    }\n\
  }\n```\n\n\n\n\n如果 `x % 2` 等于 0，则 `x` 是偶数；如果 `x % 4` 等于 0，则 `x` 是 4 的倍数；如果 `y %\
  \ 3` 等于 0，则 `y` 是 3 的倍数。列表 1.11 包含了 if-else 代码块以及嵌套的条件逻辑块，你可以通过视觉计算来将你的结果与生成的输出进行比较。\n\
  \n运行列表 1.11 中的代码，你将看到以下输出：\n\n```\nx is even: 12\nx is divisible by 4: 12\ny is\
  \ divisible by 3 and 5: 15\n```\n\n你可以创建更复杂的、涉及“and”、“or”和“not”多种组合的布尔表达式（这涉及“!=”）。使用列表\
  \ 1.1 1 中的代码作为基准，然后添加你自己的变体。\n\n配套文件包含 `BooleanExamples.java`，它向你展示了 Java 中各种类型的布尔表达式。\n\
  \n## 确定闰年\n\n列表 1.12 显示了 `LeapYear.java` 的内容，该程序确定一个给定年份是否为闰年。如果你忘记了，闰年必须是 4 的倍数。然而，如果一个给定年份不是\
  \ 400 的倍数的世纪年份，那么该年份就闰年。因此，2000 年是闰年，而 1700、1800 和 1900 年不是闰年。\n\n这个代码示例是嵌套条件语句的一个很好的例子。尝试编写你自己的伪代码并将其与列表\
  \ 1.12 的内容进行比较。\n\n### 列表 1.12: LeapYear.java\n\n```java\npublic class LeapYear\n\
  {\n    public LeapYear() {}\n    // 闰年是 4 的倍数，但\n    // 400 的倍数的世纪除外\n    public\
  \ void checkYear(int year)\n    {\n        if(year % 4 == 0)\n        {\n      \
  \      if(year % 100 == 0)\n            {\n                if(year % 400 == 0)\n\
  \                {\n                    System.out.println(year + \" is a leap year\"\
  );\n                }\n                else\n                {\n               \
  \     System.out.println(year + \" is not a leap year\");\n                }\n \
  \           }\n            else\n            {\n                System.out.println(year\
  \ + \" is a leap year\");\n            }\n        }\n        else\n        {\n \
  \           System.out.println(year + \" is not a leap year\");\n        }\n   \
  \ }\n    public static void main(String args[])\n    {\n        LeapYear ly = new\
  \ LeapYear();\n        int[] years = {1234, 1900, 2000, 3000, 5588};\n        for\
  \ (int year : years)\n        {\n            ly.checkYear(year);\n        }\n  \
  \  }\n}\n```\n\n列表 1.12 定义了 `LeapYear` 类，该类包含 `checkYear` 方法，用于确定给定年份是否为闰年。如果你查看列表\
  \ 1.12 开头附近的注释，你会发现 `checkYear` 方法实现了相同的逻辑。运行列表 1.12 中的代码，你将看到以下输出：\n\n```1234 is\
  \ not a leap year\n1900 is not a leap year\n2000 is a leap year\n3000 is not a leap\
  \ year\n5588 is a leap year\n```\n\n## 寻找数字的约数\n\n列表 1.13 包含一个 `while` 循环、条件逻辑和\
  \ `%`（取模）运算符，用于寻找任何大于 1 的整数的质因数。\n\n### 列表 1.13: Divisors.java\n\n```java\npublic\
  \ class Divisors1\n{\n    public Divisors1() {}\n    public void divisors(int num)\n\
  \    {\n        int div = 2;\n        System.out.println(\"Number: \"+num);\n  \
  \      while(num > 1)\n        {\n            if( num % div == 0)\n            {\n\
  \                System.out.println(\"divisor: \"+div);\n                num /=\
  \ div;\n            }\n            else\n            {\n                ++div;\n\
  \            }\n        }\n    }\n    public static void main(String args[])\n \
  \   {\n        Divisors1 d1 = new Divisors1();\n        d1.divisors(12);\n    }\n\
  }\n```\n\n列表 1.13 定义了 Java 类 `Divisors1`，该类包含 `divisors` 方法，用于确定正整数 `num` 的约数。`divisors`\
  \ 方法包含一个 `while` 循环，当 `num` 大于 1 时循环持续执行。\n\n在每次迭代中，如果 `num` 能被 `div` 整除，则显示 `div`\
  \ 的值，然后通过将 `num` 除以 `div` 的值来减小 `num`。如果 `num` 不能被 `div` 整除，则 `div` 加 1。列表 1.8 的输出在这里：\n\
  \n```\nNumber: 12\ndivisor: 2\ndivisor: 2\ndivisor: 3\n```\n\n## 检查回文\n\n如果你忘记了，回文是指正反读都相同的（即从左到右和从右到左）的数字或字符序列。\n\
  \n例如，`racecar` 是回文，但 `hello` 不是。\n\n列表 1.14 显示了 `Palindromes.java` 的内容，它检查一个给定的字符串或数字是否为回文。\n\
  \n### 列表 1.14: Palindromes.java\n\n```java\npublic class Palindromes\n{\n    public\
  \ Palindromes() {}\n    public void checkPalindrome(String str)\n    {\n       \
  \ boolean result = true;\n        int len = str.length();\n        for (int i =\
  \ 0; i < len / 2; i++)\n        {\n            if (str.charAt(i) != str.charAt(len\
  \ - i - 1))\n            {\n                result = false;\n                break;\n\
  \            }\n        }\n        if (result)\n        {\n            System.out.println(str\
  \ + \" is a palindrome\");\n        }\n        else\n        {\n            System.out.println(str\
  \ + \" is not a palindrome\");\n        }\n    }\n    public static void main(String\
  \ args[])\n    {\n        Palindromes p = new Palindromes();\n        String[] words\
  \ = {\"racecar\", \"hello\", \"level\", \"12321\", \"world\"};\n        for (String\
  \ word : words)\n        {\n            p.checkPalindrome(word);\n        }\n  \
  \      int[] numbers = {12321, 456, 7887};\n        for (int num : numbers)\n  \
  \      {\n            p.checkPalindrome(Integer.toString(num));\n        }\n   \
  \ }\n}\n```\n\n列表 1.14 定义了 Java 类 `Palindromes`，该类包含 `checkPalindrome` 方法，用于确定一个字符串是否为回文。`main`\
  \ 方法定义了 `words` 数组和 `numbers` 数组。\n\n接下来，`main()` 方法实例化 `Palindromes` 类，并对 `words`\
  \ 数组中的每个字符串调用 `checkPalindrome()` 方法。同样，它通过 `Integer.toString()` 将 `numbers` 数组中的每个数字转换为字符串并调用\
  \ `checkPalindrome()` 方法。输出如下：\n\n```\nracecar is a palindrome\nhello is not a palindrome\n\
  level is a palindrome\n12321 is a palindrome\nworld is not a palindrome\n12321 is\
  \ a palindrome\n456 is not a palindrome\n7887 is a palindrome\n```\n\n\n\n\n请记住，Java\
  \ 的 `String` 类创建的是不可变的字符序列，对于许多大型字符串，这可能会消耗大量的内存。另一方面，Java 的 `StringBuilder` 类是\
  \ `String` 类的替代方案，它支持可变的字符序列。\n\n`StringBuilder` 类有许多实用方法，每个方法的返回类型都是 `StringBuilder`，如下所示：\n\
  \n- `capacity()`\n- `charAt()`\n- `delete()`\n- `codePointAt()`\n- `codePointBefore()`\n\
  - `codePointCount()`\n- `deleteCharAt()`\n- `ensureCapacity()`\n- `getChars()`\n\
  - `length()`\n- `replace()`\n- `reverse()`\n- `setCharAt()`\n- `setLength()`\n-\
  \ `subSequence()`\n\n列表 1.16 显示了 `PersonRandom.java` 的内容，该程序使用随机生成的索引来访问姓名数组，以便打印一个人的姓和名。\n\
  \n列表 1.16: PersonRandom.java\n\n```java\npublic class PersonRandom\n{\n    private\
