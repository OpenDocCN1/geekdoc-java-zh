  ## 著名的排序算法\n\n排序算法在性能方面有最好情况、平均情况和最坏情况。有趣的是，有时高效的算法（如 `quicksort`）在给定数组已经排序时性能反而最差。以下子节包含了以下著名排序算法的代码示例：\n\
  - 冒泡排序 (bubble sort)\n- 选择排序 (selection sort)\n- 插入排序 (insertion sort)\n- 合并排序 (merge\
  \ sort)\n- 快速排序 (quicksort)\n- 桶排序 (bucket sort)\n- 柯式排序 (Shell sort)\n- 堆排序 (heap\
  \ sort)\n- 原地排序 (in-place sort)\n- 计数排序 (counting sort)\n- 基数排序 (radix sort)\n\n\
  如果你想更深入地探索排序算法，请搜索其他算法。\n\n## 冒泡排序\n\n泡排序涉及嵌套循环，其中数组的每个元素都与给定元素右侧的元素进行比较。如果数组元素小于当前元素，则交换这两个值（“交换”），这意味着数组最终将从小到大的顺序排列。这里有一个例子：\n\
  \n```java\nclass BubbleSort\n{\n    public static void main(String[] args)\n   \
  \ {\n        int[] arr1 = new int[]{40, 10, 30, 20};\n        System.out.print(\"\
  Initial: \");\n        for(int i=0; i<arr1.length; i++) {\n            System.out.print(arr1[i]+\"\
  \ \");\n        }\n        System.out.println(\"\");\n        for(int i=0; i<arr1.length-1;\
  \ i++) {\n            for(int j=i+1; j<arr1.length; j++) {\n                if(arr1[i]\
  \ > arr1[j]) {\n                    int temp = arr1[i];\n                    arr1[i]\
  \ = arr1[j];\n                    arr1[j] = temp;\n                }\n         \
  \   }\n        }\n        System.out.print(\"Sorted: \");\n        for(int i=0;\
  \ i<arr1.length; i++) {\n            System.out.print(arr1[i]+\" \");\n        }\n\
  \        System.out.println(\"\");\n    }\n}\n```\n你可以手动执行列表 4.4 中的代码来确认该代码是正确的。（注：此处原文应为\
