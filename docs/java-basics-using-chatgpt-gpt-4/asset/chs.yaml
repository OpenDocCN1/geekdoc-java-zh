  \n## 任务：检查回文\n\n判断一个字符串是否为回文的一种方法是将与其反转后的字符串进行比较：如果两个字符串相等，则该字符串是回文。此外，有两种方法反转字符串：一种涉及\
  \ `reverse()` 函数，另一种方法是从右到左处理给定字符串中的字符，并将每个字符添加到新字符串中。\n\n列表 3.11 显示了 `Palindrome1.java`\
  \ 的内容，说明了如何判断一个字符串或正整数是否为回文。\n\n### 列表 3.11：Palindrome1.java\n\n```java\npublic\
  \ class Palindrome1\n{\n    public static Boolean palindrome1(String str) {\n  \
  \      int full_len = str.length();\n        int half_len = str.length()/2;\n  \
  \      for(int i=0; i<half_len; i++) {\n            char lchar = str.charAt(i);\n\
  \            char rchar = str.charAt(full_len-1-i);\n            if(lchar != rchar)\n\
  \                return false;\n        }\n        return true;\n    }\n    public\
  \ static void main(String[] args)\n    {\n        String[] arr1 = new String[]{\"\
  rotor\", \"tomato\", \"radar\",\"maam\"};\n        String[] arr2 = new String[]{\"\
  123\", \"12321\", \"555\"};\n    }\n}\n```\n\n\n\n\n```java\n// 检查字符串回文：\nfor(String\
  \ str : arr1)\n{\n    Boolean result = palindrome1(str);\n    System.out.println(\"\
  String: \"+str+ \" palindrome: \"+result);\n}\n// 检查数字回文：\nfor(String num : arr2)\n\
  {\n    System.out.print(\"Number: \"+num);\n    String str1 = num;\n    String str2\
  \ = \"\";\n    for(int i=0; i<str1.length(); i++) {\n        str2 = str2 + str1.charAt(i);\n\
  \    }\n    Boolean result = palindrome1(str2);\n    System.out.println(\" palindrome:\
  \ \"+result);\n}\n}\n```\n\n列表 3.11 从函数 `palindrome1()` 开始，其参数 `str` 是一个字符串。该函数包含一个循环，首先将字符串\
  \ `str` 最左侧的字符与最右侧的字符进行比较。循环的下次迭代移动到字符串左侧的第二个位置，并将该字符与字符串从右数数第二个字符进行比较。这种步进式的比较一直持续到字符串的中间。在循环的每次迭代中，如果一对字符不同，则返回值\
  \ `False`。如果所有字符对都相等，则该字符串必须是回文，在这种情况下返回值 `True`。\n\n列表 3.11 的下部分包含一个字符串数组 `arr1`\
  \ 和一个正整数数组 `arr2`。接下来，另一个循环遍历 `arr1` 的元素，并调用 `palindrome1` 函数来确定 `arr1` 的当前元素是否为回文。同样，第二个循环遍历\
  \ `arr2` 的元素，并调用 `palindrome1` 函数来确定 `arr2` 的当前元素是否为回文。运行列表 3.11 中的代码，你将看到以下输出：\n\
  \nString: rotor palindrome: true\nString: tomato palindrome: false\nString: radar\
  \ palindrome: true\nString: maam palindrome: true\nNumber: 123 palindrome: false\n\
  Number: 12321 palindrome: true\nNumber: 555 palindrome: true\n\n## 任务：检查最长回文\n\n\
