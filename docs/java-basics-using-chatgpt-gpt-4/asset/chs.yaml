  \ this is a simple sentence.\nline1 and line2 are case-insensitive same\nline1 is\
  \ mixed case\n\n## 在 Java 中查找子字符串\n\nListing 1.9 显示了 `SearchString.java` 的内容，说明了如何使用\
  \ `indexOf()` 方法确定一个字符串是否是另一个字符串的子字符串。注意，此代码示例涉及一个 `if` 语句，该语句在本章的最后一个代码示例中进行了详细讨论。\n\
  \n### 列表 1.9: SearchString.java\n\n```java\npublic class SearchString\n{\n    public\
  \ SearchString(){}\n    public static void main (String args[])\n    {\n       \
  \ int index;\n        String str1 = \"zz\", str2 = \"Pizza\";\n        index = str2.indexOf(str1);\n\
