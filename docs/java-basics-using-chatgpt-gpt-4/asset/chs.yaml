  \ args)\n    {\n        String[] arr1 =\n            new String[]{\"a string\",\
  \ \"second string\", \"hello world\"};\n        for(String str : arr1)\n       \
  \ {\n            System.out.println(\"string: \"+str);\n            boolean result\
  \ = uniqueChars(str);\n            System.out.println(\"unique: \"+result);\n  \
  \          System.out.println();\n        }\n    }\n}\n```\n\n列表 3.8 从 `uniqueChars()`\
  \ 函数开始，该函数将其参数 `str` 转换为小写字母，然后初始化全为 0 的 1x128 整数数组 `char_set`。该函数的下部分部分遍历字符串 `str`\
  \ 的字符，并将整数变量 `val` 初始化为每个字符相对于字符 `z` 的偏移位置。\n\n如果该位置在 `char_set` 中的值等于 1，则找到了重复字符；否则，将该位置初始化为值\
  \ 1。注意，如果字符串 `str` 包含重复字母，则返回值 `False`而如果字符串 `str` 包含唯一字符，则返回值 `True`。运行列表 3.8 中的代码，你将看到以下输出：\n\
  \n```\nstring: a string\nunique: True\nstring: second string\nunique: False\nstring:\
  \ hello world\nunique: False\n```\n\n## 任务：在字符串中插入字符\n\n列表 3.9 显示了 `InsertChars.java`\
