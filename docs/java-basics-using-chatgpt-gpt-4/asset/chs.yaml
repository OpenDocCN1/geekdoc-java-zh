  \n### 列表 3.8：UniqueChars.java\n\n```java\n//128 characters for ASCII and 256 characters\
  \ for extended ASCII\n\npublic class UniqueChars\n{\n    public static Boolean uniqueChars(String\
  \ str)\n    {\n        boolean result = false;\n        if (str.length() > 128)\n\
  \            return result;\n        str = str.toLowerCase();\n        int[] char1_set\
  \ = new int[128];\n        for(int idx=0; idx<str.length(); idx++)\n        {\n\
  \            char char1 = str.charAt(idx);\n            int val = 'z' - char1; //\
  \ # error\n            //System.out.println(\"val: \"+val);\n            if (char1_set[val]\
  \ == 1)\n                return result;\n            else\n                char1_set[val]\
