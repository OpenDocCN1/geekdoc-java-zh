  \ `CURR` 和 `SEEK` 遍历给定列表，这两者都是元素。此外，`CURR` 是线性迭代的，而 `SEEK` 使用了“双倍时间”技术，使得 `SEEK`\
  \ 在给定列表中移动的速度是 `CURR` 的两倍。因此，当 `SEEK` 到达列表末尾时，`CURR` 正好位于给定列表的中点。`main()` 方法首先构建并显示来自\
  \ `items` 数组的初始链表。`main()` 方法的后续部分调用 `findMiddle()` 来确定列表的中间点。注意，如果列表长度为偶数，`findMiddle()`\
