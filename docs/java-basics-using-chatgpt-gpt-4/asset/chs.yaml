  \ 列表 9.5：`PalindromeChecker.java`\n\n```java\npublic static boolean isPalindrome(String\
  \ str) {\n    // 忽略大小写敏感和空格以进行更健壮的检查\n    str = str.toLowerCase().replaceAll(\"\\\
  \\s+\", \"\");\n    // 基础情况：长度为 0 或 1 的字符串是回文\n    if (str.length() <= 1) {\n  \
  \      return true;\n    }\n    // 比较第一个和最后一个字符\n    if (str.charAt(0) != str.charAt(str.length()\
  \ - 1)) {\n        return false;\n    }\n    // 递归情况：检查排除第一个和最后一个字符的子字符串\n    return\
  \ isPalindrome(str.substring(1, str.length() - 1));\n}\n\npublic static void main(String[]\
  \ args) {\n    String testString1 = \"radar\";\n    String testString2 = \"hello\"\
  ;\n    String testString3 = \"A man a plan a canal Panama\";\n    System.out.println(testString1\
  \ + \" is a palindrome: \" + isPalindrome(testString1));\n    System.out.println(testString2\
  \ + \" is a palindrome: \" + isPalindrome(testString2));\n    System.out.println(testString3\
  \ + \" is a palindrome: \" + isPalindrome(testString3));\n}\n```\n\n列表 9.5 附带了 ChatGPT\
