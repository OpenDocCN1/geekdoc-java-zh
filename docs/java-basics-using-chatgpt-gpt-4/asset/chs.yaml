  \ `halfway` 初始化为 `even_num/2` 的整数部分，其中 `even_num` 是该方法的参数。代码的后续部分是一个从 0 运行到 `halfway`\
  \ 的循环，循环变量为 `num`。在每次迭代中，如果运行 `isPrime(num)` 的结果等于 `1`，则检查 `isPrime(even_num-num)`\
  \ 是否也等于 `1`：如果后者为真，则 `even_num` 和 `num` 符合哥德赫猜，因此打印它们的值。2.9 的下部分定义了 `main()` 方法，该方法将\
  \ `upperBound` 初始化为值 20。接下来，循环从 0 迭代到 `upperBound`，在每次迭代中，`findPrimeFactors()` 方法涉及当前的循环变量\
  \ `num`。现在运行列表 2.8 中的代码，你将看到以下输出：\n\n```\n8 = 3 + 5\n10 = 3 + 7\n12 = 5 + 7\n14\
