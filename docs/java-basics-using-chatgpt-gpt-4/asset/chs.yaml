  node1.data: Jane\nnode2.data: Dave\nnode3.data: Stan\nnode4.data: Alex\n\n### 追加节点的\
  \ Java 代码\n\n列表 5.2 显示了 `AppendSLNode.java` 内容，说明了创建链表并向其添加节点的更好方法。\n\n```java\n\
