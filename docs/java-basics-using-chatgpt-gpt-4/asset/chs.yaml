  \      System.out.println(num + \" binary: \" + toBinaryString(num));\n        \
  \    int num2 = swapAdjacentBits(num);\n            System.out.println(\"After Swapping:\"\
  );\n            System.out.println(num + \" binary: \" + toBinaryString(num2)+\"\
  \\n\");\n        }\n    }\n}\n```\n\nListing 3.29 起于函数 `toBinaryString()` 的定义，该函数生成一个左侧填充\
  \ 0 的 32 位二进制字符串。Listing 3.29 的下部分定义了函数 `swapAdjacentBits()`，该函数通过对两个数量进行或操作来交换相邻位。左侧数量计算整数\
