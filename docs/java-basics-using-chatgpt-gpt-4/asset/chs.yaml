  \n### 列表 5.7：CircularSLNode.java\n\n```java\npublic class CircularSLNode\n{\n  \
  \  static class Node {\n        String data = \"\";\n        Node next = null;\n\
  \        public Node(String data) {\n            this.data = data;\n           \
  \ this.next = null;\n        }\n    }\n    /*\n    代码遵循以下插入节点时处理情况：\n    NULL（空列表）\n\
  \    x（一个节点）\n    x<->x（两个节点）\n    x y z x（多个节点）\n    */\n    public static Node\
