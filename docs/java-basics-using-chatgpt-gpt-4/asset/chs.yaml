- "# ChatGPT / GPT-4 Java 基础使用指南\n\n\n\n![](img/cover.jpg)\n\n![image](img/cover.jpg)\n\
  \n\n\n\n\n\n\n\n\n\n![](img/ML-LOGO.jpg)\n\n\n\n\n\n\n\n\n\n\n\n我想将这本书献给我的父母\n–\
  \ 愿这能给他们的生活带来快乐和幸福。\n\n\n\n\n\n\n\n\n总而言之，将 ChatGPT 与传统的手写代码示例相结合，可以为读者提供更动态、更多维的学习体验。速度快、观点对比、调试帮助以及适应性等优势，使\
  \ ChatGPT 成为任何技术教育材料中极具吸引力的补充。\n\n## 目标读者\n\n本书主要面向对 `Java` 接触有限且对学习数据结构感兴趣的人群。本书也旨在接触具有极其多元背景、不同年龄段的国际读者。虽然许多读者知道如何读懂英语，但他们的母语不是英语（英语可能是他们的第二种、第三种甚至第四种语言）。因此，本书使用了标准英语，而不是可能让这些读者感到困惑的口语化表达。如此，本书力求为目标读者提供舒适且有意义的学习体验。\n\
  \n## 我能从这本书中学学到什么？\n\n本书涵盖了 `Java` 编程和开发环境的基础知识，包括理解递归、字符串、数组、基础数据结构、算法分析、队列和栈，并随后讨论了\
  \ ChatGPT 在生成、解释和调试代码方面的作用。本书将手工编写的 `Java` 代码与 ChatGPT 生成的示例相结合，以提供多维的学习体验。\n\n\
  ## 我需要学习书中的理论部分吗？\n\n再次，答案取决于你计划参与数据分析的程度。例如，如果你计划学习机器学习，那么你可能需要学习如何创建和训练模型，这是一项在数据清洗任务之后执行的任务。总的来说，如果你计划成为一名机器学习工程师，你可能需要学习你在书中遇到的所有内容。\n\
  \n## 如何从本书中获得最大收益\n\n有些程序员通过通过文字叙述中学习，而另一些则擅长从示例代码（以及大量的代码）中学习，这意味着没有一种单一风格适用于所有人。\n\
  \n此外，有些程序员想先运行代码，看看它是做什么的，然后再回到代码深入研究细节（而另一些人则采用相反的方法）。\n\n因此，书中有多种类型的代码示例：有的短，有的长，还有一些代码示例是从早期的代码示例“构建”而来的。\n\
  \n## 学习本书我需要具备什么知识？\n\n`Java` 的基础知识是最有技能，对递归和数据结构的某些接触显然会有帮助。对其他编程语言的知识也很有帮助，因为可以接触编程概念和结构。你掌握的技术性知识越少，就越需要勤奋来理解所涵盖的各种主题。\n\
  \n如果你想确保自己能够掌握书中的材料，可以快速浏览一些代码示例，以了解你熟悉多少内容，有多少是新内容。\n\n## 附带文件是否消除了对本书的需求？\n\n\
  附带文件包含了所有的代码示例，以节省你手动将代码输入文本文件这一易出错过程的精力和精力。此外，在某些情况下，你可能无法方便地访问文件。而且，书中的代码示例提供了配套文件中未提供的解释。\n\
  \n书中的所有代码示例和图表都可以通过邮件至 `info@merclearning.com` 获取。\n\n## 本书包含生产级代码示例吗？\n\n书中代码示例的主要目的是向你展示如何使用\
  \ `Java` 来解决各种编程任务。清晰度比编写更紧凑但更难理解（且可能更容易出错）的代码具有优先级。如果你决定在生产环境中使用书中的任何代码，你理应对对该代码进行与你代码库其他部分相同的严谨分析。\n\
  \n另一个需要记住的细节是，书中许多代码示例包含了“注释掉”的代码片段（通常是 `println()` 语句），这些片段是在开发代码示例期间使用的。特意包含这些代码片段是为了以便在你想查看代码示例的执行路径时，取消其中任何一个片段的注释。\n\
  \n## 本书的非技术要求是什么？\n\n虽然这个问题的答案很难量化，但具备对学习数据分析的强烈渴望，以及阅读和理解代码示例的动力和自律是非常重要的。\n\n\
  ## 我如何设置命令行（Shell）？\n\n如果你是 Mac 用户，有三种方法。第一种方法是使用 Finder 导航到 `Applications > Utilities`，然后双击\
  \ Utilities 应用程序。接下来，如果你已经有一个可用的命令行，可以通过输入以下命令启动一个新的命令行：\n\n```\nopen /Applications/Utilities/Terminal.app\n\
  ```\n\nMac 用户的第二种方法是在已经可见的命令行中，简单通过点击 `command+n` 在 MacBook 上打开一个新的命令行，这样你的 Mac\
  \ 就会启动另一个命令行。\n\n如果你是 PC 用户，可以安装 `Cygwin`（开源 `https://cygwin.com/`）来模拟 `bash` 命令，或使用其他工具包如\
  \ `MKS`（一种商业产品）。请阅读描述下载和安装过程的在线文档。注意，如果自定义别名是在主启动文件（如 `.bash_login`）之外的文件中定义的，则不会自动设置。\n\
  \n## 完成本书后的“后续步骤”是什么？\n\n这个问题的答案差异很大，主要因为答案很大程度上取决于你的目标。一种可能是学习更复杂的数据结构并在 `Java`\
  \ 中实现它们。另一个选择是为涉及 `Java` 的工作面试做准备。另一种可能性是将 ChatGPT（或其继任者）融入你的日常工作。\n\nO. Campesato\n\
  \n2023 年 12 月\n\n# 第一章\n# JAVA 简介\n\n这个节奏快的章节向你介绍了 `Java` 的各种主题。在很多情况下，解释是简洁的，特别是当代码的是直观的时候。\n\
  \n本章的第一部分包含了关于在你的机器上下载 `Java` 的信息。你还将学习 `Java` 数据类型、操作符以及它们的优先级。\n\n第二部分向你展示如何从命令行创建、编译和启动\
  \ `Java` 类。你将学习如何创建一个“Hello World”代码示例，该示例将在第二章中扩展，以帮助你理解 `Java` 中的构造函数。\n\n第三部分讨论了\
  \ `Java` 中的数字、随机数和三角函数。第四部分简要涵盖了 Java 字符和字符串，以及新运算符的意义。你还将学习如何判断两个字符串是否相等，以及 Java\
  \ 中的其他一些与字符串相关的函数。\n\n## Java 的极简介绍\n\nJava 是一种面向对象的编程语言，使你能够在许多不同的硬件平台上运行代码，包括桌面电脑、移动设备和树莓派。你需要为每个打算运行\
  \ `Java` 代码的平台安装特定于平台的 `Java` 发行版（详情请见下一节）。\n\n以下链接包含 Java 2023 路线图的图以及 Java 特性的布局：\n\
  \n[`medium.com/javarevisited/the-java-programmer-roadmap-f9db163ef2c2`](https://medium.com/javarevisited/the-java-programmer-roadmap-f9db163ef2c2)\n\
  \n如果你想了解在不同 Java 版本中引入的新特性，请访问以下网站：\n\n\n\n\n\n- [Java SE 支持路线图](https://www.oracle.com/java/technologies/java-se-support-roadmap.html)\n\
  \n## 下载 Java 版本（简短版）\n\n考虑到目前有很多 Java 版本可用，你如何决定哪一个最适合你？这个问题的答案可能涉及以下一个或多个方面：\n\n\
  - 你的公司使用的 Java 版本\n- 最新的 LTS（长期支持）版本\n- 你偏好的 Java 版本\n- 最新的 Java 版本\n- 你需要的 Java\
  \ 特性\n\n另一个需要注意点是：如果你想满足上述列表中的所有点，你也可以在机器上下载多个版本的 Java。\n\n在决定了最适合你的 Java 版本后，请访问以下网站并下载适用于你机器的\
  \ Java 分发版：\n\n[`docs.oracle.com/javase/10/install/toc.htm`](https://docs.oracle.com/javase/10/install/toc.htm)\n\
  \n## 选择 Java 版本（详细版）\n\n在本书印刷时，Java 20 已发布，而 Java 21 计划于 2023 年 9 月发布（日期可能会变动）。旧版本的\
  \ Java 发布周期有时涉及三年或更久，而较新版本的 Java 将每六个月发布一次。同时，新版本的更新范围会受限得多。\n\n### Java 8 和 Java\
  \ 11\n\nJava 8 和 Java 11 曾拥有 LTS（长期支持）状态，目前 Java 17 和 Java 21 具有 LTS 状态。由于各种因素，一些大型公司仍在使用\
  \ Java 8，它是 Java 历史上最重要的发布之一。如果你感兴趣，Oracle 网站包含了 Java 8 特特性的列表。事实上，Java 8 中的几乎所有特性在后续的所有版本中（直到及包含\
  \ Java 17）都能正常工作。\n\n然而，Java 8 和 Java 11 已被弃用，目前 Java 17 具有 LTS 状态。那么，推荐哪个 Java\
  \ 版本呢？答案取决于你的需求。如果你没有维护或开发旧版 Java 版本代码的负担，那么使用 Java 17 可能是安全的。如果你没有选择，请考虑使用 Java\
  \ 13、Java 11 或 Java 8（按此顺序考虑）。\n\n访问以下 URL 获取有关 Java 早期版本的信息以及未来 Java 版本发布日期的信息：\n\
  \n[`www.oracle.com/java/technologies/java-se-support-roadmap.html`](https://www.oracle.com/java/technologies/java-se-support-roadmap.html)\n\
  \n### Java 版本号\n\n在 Java 8 之前，版本命名序列的形式为 1.x。因此，Java 7 也称为 Java 1.7，而 Java 8 被称为\
  \ Java 8。然而，这种旧的命名规范从 Java 9 开始被废弃了。例如，如果你在机器上输入命令 `java -version` 且安装了 Java 13，你将看到类似下面的输出：\n\
  \n```\njava 13.0\n```\n\n### JRE 与 JDK\n\n使用 Java 需要理解 JRE（Java 运行环境）和 JDK（Java\
  \ 开发工具包）之间的区别。JRE 提供运行 Java 应用程序所需的库，而 JDK 包含了开发这些程序所需的工具，例如编译器。\n\n要编译 Java 文件，你使用命令：\n\
  ```bashjavac MyProgram.java\n```\n\n要运行编译后的类，你使用命令：\n```bash\njava MyProgram\n```\n\
  \n### Java 分发版\n\n目前有多个 JDK 分发版可用。最常见的是 Oracle JDK，但也有一些开源替代方案，如 OpenJDK、Amazon\
  \ Corretto 和 Azul Zulu。选择最适合你特定需求和环境的一个。\n\n\n\n\n```java\n/* this is a multi-line\
  \ comment\n\nthat uses a C-style syntax\n\n// and can include the one-line comment\
  \ style\n\n*/\n```\n\n然而，Java 不支持嵌套注释（C/C++ 也是如此），所以这是一个错误：\n\n```java\n/* start\
  \ of first comment /* start of second comment */ end of first */\n```\n\n根据之前的示例，以下语法对于注释是正确的：\n\
  \n```java\n/* start of first comment // start of second comment end of first */\n\
  ```\n\n## Java 运算符\n\nJava 支持常用的算术运算符，并具有标准的优先级（幂运算高于乘法 `*` 和除法 `/`，这两者的优先级都高于加法\
  \ `+` 和减法 `-`）。此外，Java 还支持以下运算符：\n\n- 算术运算符：`+`, `-`, `*`, `/`, `%`, `++` 和 `--`\n\
  - 赋值运算符：`=`， `+=`, `-=`, `*=`, `/=`, `%=`, `<<=`, `>>=`, `&=`, `^=`, 和 `!=`\n- 位运算运算符：`&`,\
  \ `|`, `^`, 和 `~`\n- 布尔运算：`and`, `or`, `not`, 和 `xor`\n- 逻辑运算符：`&&`, `||`, 和 `!`\n\
  - 关系运算符：`==`, `!=`, `>`, `<`, `>=`, 和 `<=`\n\nJava 还支持三元运算符 `?` 和 `instanceOf` 运算符（用于检查变量是否是特定类的实例）。\n\
  \n## 创建和编译 Java 类\n\n让我们从最简单的 Java 类开始，它的作用仅仅是向你展示 Java 类的基本结构。列表 1.1 显示了 `MyClass.java`\
  \ 的内容，它定义了 Java 类 `MyClass`。\n\n### 列表 1.1: MyClass.java\n\n```java\npublic class\
  \ MyClass\n{\n\n}\n```\n\n第一个需要注意的点是，列表 1.12 中的文件名与 Java 类名相同。列表 1.1 定义了由 `public`\
  \ 和 `class` 关键字限定的 Java 类 `MyClass`。你可以在 Java 文件中拥有多个类，但只能有一个类是 `public` 的，且该 `public`\
  \ 类必须与文件名匹配。\n\n打开命令行窗口，导航到包含 `MyClass.java` 的目录，并使用 `javac` 可执行程序从命令行编译 `MyClass.java`：\n\
  \n```bash\njavac MyClass.java\n```\n\n`javac` 可执行程序会创建一个名为 `MyClass.class` 的文件，包含\
  \ Java 字节码。使用 `java` 可执行程序启动 Java 字节码（不要包含任何扩展名）：\n\n```bash\njava MyClass\n```\n\
  \n注意，在启动 Java 字节码时不需要指定 `.java` 或 `.class` 后缀。上一个命令的输出如下：\n\n```\nException in thread\
  \ \"main\" java.lang.NoSuchMethodError: main\n```\n\n**注意**\n\n Java 源代码文件名必须与文件中的\
  \ `public` Java 类匹配。例如，文件 `MyClass.java` 必须定义名为 `MyClass` 的 Java 类。\n\n列表 1.2 包含一个\
  \ `main` 方法，作为从命令行启动 Java 类的初始“入口点”，解决了列表 1.1 中发生的错误。\n\n### 列表 1.2: MyClass.java\n\
  \n```java\npublic class MyClass\n{\n    public static void main(String[] args){}\n\
  }\n```\n\n列表 1.2 包含 `main()` 函数，其返回类型为 `void`，因为它没有返回任何内容。`main()` 函数也是 `static`（静态），这确保了当我们从命令行启动\
  \ Java 类时它是可用的。现在编译代码：\n\n```bash\njavac MyClass.java\n```\n\n从命令行启动该类：\n\n```bash\n\
  java MyClass\n```\n\n你现在已成功创建、编译并启动了一个名为 `MyClass` 的 Java 类，它除了成功编译外，仍然一无所事。下一步将涉及在\
  \ Java 类中显示文本字符串，这将在下一节中讨论。\n\n## “HELLO WORLD”与数字操作\n\n列表 1.3 显示了 `HelloWorld1.java`\
  \ 的内容，它从 Java 类打印字符串“Hello World”。\n\n### 列表 1.3: HelloWorld1.java\n\n```java\n\
  public class HelloWorld1\n{\n\tpublic static void main (String args[])\n\t{\n\t\t\
  System.out.println(\"Hello World\");\n\t}\n}\n```\n\n列表 1.3 中的代码非常直观：`main()` 函数包含一个简单的打印语句，用于打印字符串“Hello\
  \ World”。打开命令行窗口来编译并运行列表 1.3 中的 Java 代码：\n\n```bash\njavac HelloWorld1.java\n```\n\
  \n输入以下命令运行编译后的代码：\n\n```bash\njava HelloWorld1\n```\n\n上一个命令的输出如下：\n\n```\nHello\
  \ World\n```\n\n辅助文件包含了本章节的额外代码示例，说明了如何在 Java 中处理数字、随机数、三角函数和位运算运算符：\n\n- `Numbers.java`\n\
  - `RandomNumbers.java`\n- `MathFunctions.java`\n- `TrigFunctions.java`\n- `Bitwise.java`\n\
  \n让我们来看一些 Java 中处理数字的（稍微）更有趣的示例。\n\n## JAVA STRING 类\n\n`char` 类型的 Java 变量是单个字符，你可以通过\
  \ `char` 关键字这样定义：\n\n```java\nchar ch1 = 'Z';\n```\n\n`String` 类型的 Java 变量是一个对象，由多个字符组成。一个\
  \ `String` 类型的 Java 变量是字符序列。稍后你会看到，它支持 ASCII、UTF8 和 Unicode 字符。`java.lang.String`\
  \ 类实现了 `Serializable`, `Comparable` 和 `CharSequence` 接口。\n\n记住：`String` 类是不可变的。为了修改字符串（例如追加或删除），Java\
  \ 提供了 `StringBuffer` 和 `StringBuilder`。\n\n```java\nchar[] chars = {'h','e','l','o'};\n\
  String str1 = new String(chars);\nString str2 = \"hello\";\n```\n\n你可以通过 `charAt()`\
  \ 方法在字符串中访问字符：\n\n```java\nchar ch = str1.charAt(1);\n```\n\n代码片段将字母“e”赋值给变量 `ch`。列表\
  \ 1.4 显示了 `CharsStrings.java`，展示了如何定义字符、数组和字符串。\n\n### 列表 1.4: CharsStrings.java\n\
  \n```java\npublic class CharsStrings\n    public static void main (String args[])\
  \ {\n        char ch1 = 'Z';\n        char ch2 = ' ';\n        char[] chars = {'h','e','l','o'};\n\
  \        String str1 = new String(chars);\n        String str2 = \"hello\";\n  \
  \      String str3 = new String(chars);\n        String str4 = Character.toString(ch2);\n\
  \        System.out.println(\"ch1: \" + ch1);\n        System.out.println(\"ch2:\
  \ \" + ch2);\n        System.out.println(\"chars: \" + chars);\n        System.out.println(\"\
  str1: \" + str1);\n        System.out.println(\"str2: \" + str2);\n        System.out.println(\"\
  str3: \" + str3);\n        System.out.println(\"str4: \" + str4);\n    }\n}\n```\n\
  \n列表 1.4 包含一个 `main()` 方法，初始化了字符变量 `ch2`、字符数组变量 `chars` 以及字符串变量 `str1` 到 `str4`。`main()`\
  \ 方法的剩余部分只是打印这些变量的值。运行列表 1.4 中的代码，你将看到如下输出：\n\n```\nch1: Z\nch2: \nchars: [C@541ca8\n\
  str1: hello\nstr2: hello\nstr3: hello\nstr4: \n```\n\n`chars` 变量的输出可能与你的预期不同。你可以使用循环来显示\
  \ `chars` 变量中的字符。虽然循环在第 3 章中讨论，但这里有一个显示 `chars` 变量内容的快速预览：\n\n```java\nSystem.out.print(\"\
  chars: \");\nfor(char ch : chars) {\n    System.out.print(ch);\n}\nSystem.out.println();\n\
  ```\n\n上一个循环的输出如下：\n\n```\nchars: hello\n```\n\n## 带有元字符的 Java 字符串\n\n\n\n\nJava\
  \ 处理字符串变量中的元字符的方式与任何其他字母数字字符相同。因此，你不需要在 Java 字符串中转义元字符，而在定义 `char` 变量时，这是必须的（参见前一个代码示例中的\
  \ `ch2`）。\n\n你可以通过 `+` 运算符拼接两个 Java 字符串，如下：\n\n```java\nString first = \"John\"\
  ;\nString last = \"Smith\";\nString full = first + \" \" + last;\n```\n\nJava 处理以下代码段的方式略有不同：\n\
  \n```java\nString first = \"John\";\nString last = \"Smith\";\nfirst = first + \"\
  \ \" + last;\n```\n\n变量 `first` 和 `last` 被用字符串值初始化，然后会分配一块足够大的内存，以容纳变量 `first` 的内容、空格以及变量\
  \ `second` 的内容。这三个部分被复制到新的内存块中，然后由变量 `full` 引用该内存块。\n\n列表 1.5 显示了 `Strings.java`\
  \ 的内容，该文件初始化并打印了几个字符串。\n\n### 列表 1.5: MyStrings.java\n\n```java\npublic class Strings\n\
  {\n    public static void main (String args[])\n    {\n        String str1 = \"\
