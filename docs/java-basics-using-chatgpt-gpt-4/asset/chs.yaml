  \ = 4;\n        for (int i=1; i<max_width; i++)\n        {\n            binaryValues(i);\n\
  \        }\n    }\n```\n\n列表 3.2 从 `binaryValues()` 方法开始，其循环从 0 迭代到 `2**width`，其中\
  \ `width` 是该函数的参数。循环变量是 `i`，在每次迭代中，`bin_value` 初始化为 `i` 的二进制值。接下来，变量 `str_value`\
  \ 是 `bin_value` 的字符串值，去掉了前导的 `0`。运行列表 3.2 中的代码，你会看到以下输出：\n\n`Binary values of 1:`\n\
  `0`\n`1`\n`Binary values of 2:`\n`0`\n`1`\n`10`\n`11`\n`Binary values of 3:`\n`0`\n\
  `1`\n`10`\n`11`\n`100`\n`101`\n`110`\n\n#两个数字的公共子串\n\n列表 3.3 显示了 `CommonBits.java`\
  \ 的内容，说明了如何找到两个二进制字符串的最长公共子串。\n\n### 列表 3.3: CommonBits.java\n\n```java\npublic\
  \ class CommonBits\n{\n    public static int commonBits(int num1, int num2)\n  \
  \  {\n        String bin_str1 = Integer.toBinaryString(num1);\n        String bin_str2\
  \ = Integer.toBinaryString(num2);\n        if(bin_str2.length() < bin_str1.length())\n\
  \        {\n            while(bin_str2.length() < bin_str1.length())\n         \
  \       bin_str2 = \"0\" + bin_str2;\n        }\n        if(bin_str1.length() <\
  \ bin_str2.length())\n        {\n            while(bin_str1.length() < bin_str2.length())\n\
