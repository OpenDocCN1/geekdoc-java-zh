  \ `A` 在末尾有足够的未初始化元素，以容纳矩阵 `B` 的所有值，如图 4.1 所示。\n\n![](img/Figure4-1.jpg)\n\n图 4.1。合并两个数组。\n\
  \n## 快速排序是如何工作的？\n\n快速排序算法使用分治法来对元素数组进行排序。其核心思想是从给定列表中选择一个元素作为基准值（pivot item，该元素可以是列表中的任意元素），用它将给定列表划分为两个子列表，然后递归地排序这两个子列表。\n\
  \n由于该算法的递归性质，每次递归调用都会产生更小的子列表。因此，子列表最终会达到基础情况，即子列表包含 0 或 1 个元素（这些元素显然是有序的）。\n\n\
  另一个关键点：一个子列表包含小于基准值的值，而另一个子列表包含大于基准值的值。在理想情况下，两个子列表的长度大致相等。这导致子列表发生类似于二分的拆分，涉及到\
  \ `log N` 次快速排序算法的调用，其中 `N` 是列表中元素的数量。\n\n关于快速排序，有几点需要注意。首先，两个子列表长度大致相等的情况是最最高的情况。然而，为了达到最优效果，这种情况需要对给定列表中的数据分布有先验知识。\n\
  \n其次，如果列表包含接近随机分布的值，在这种情况下，第一个值或最后一个值是选择基准值的常见选择。第三，当列表中的值已经排序好时，快速排序的性能最差。在这种情况下，通过以下方式之一选择基准值：\n\
  \n- 选择列表中的中间的元素。\n- 选择列表中第一个、中间和最后一个元素的中位数。\n\n## 快速排序代码示例\n\n列表 4.10 显示了 `QuickSort.java`\
  \ 的内容，它说明了如何对数字数组进行快速排序。\n\n列表 4.10：`QuickSort.java`\n\n```java\npublic class QuickSort\
  \ {\n    public static void sort(int[] values) {\n        quicksort(values);\n \
  \   }\n    public static void quicksort(int[] arr) {\n        if(arr.length == 0)\n\
  \            return;\n        else\n            quicksort(arr, 0, arr.length - 1);\n\
  \    }\n    // 递归地对区间 [lo, hi] 进行原地排序\n    public static void quicksort (int[] arr,\
  \ int lo, int hi) {\n        if (lo < hi) {\n            int splitPoint = partition(arr,\
  \ lo, hi);\n            quicksort(arr, lo, splitPoint);\n            quicksort(arr,\
  \ splitPoint + 1, hi);\n        }\n    }\n    // 为快速排序执行 Hoare 分算法\n    public static\
  \ int partition(int[] arr, int lo, int hi) {\n        int pivot = arr[lo];\n   \
  \     int i = lo - 1;\n        int j = hi + 1;\n        while (true) {\n       \
  \     do {\n                i += 1;\n            } while (arr[i] < pivot);\n   \
  \         do {\n                j -= 1;\n            } while (arr[j] > pivot);\n\
  \            if (i < j) swap(arr, i, j);\n            else return j;\n        }\n\
  \    }\n    // 交换两个元素\n    public static void swap(int[] arr, int i, int j) {\n\
  \        int tmp = arr[i];\n        arr[i] = arr[j];\n        arr[j] = tmp;\n  \
  \  }\n    public static void main(String[] args) {\n        int[] array = new int[]{10,\
  \ 4, 6, 4, -13, 2, 3};\n        System.out.println(\"Initial array:\");\n      \
  \  for (int num : array ) {\n            System.out.print(num+\" \");\n        }\n\
  \        System.out.println();\n        sort(array);\n        System.out.println(\"\
  Sorted array:\");\n        for (int num : array ) {\n            System.out.print(num+\"\
  \ \");\n        }\n        System.out.println();\n    }\n}\n```\n\n列表 4.10 包含了以下静态方法的定义，其后是\
  \ `main()` 方法：\n- `sort()`\n- `quicksort()`\n- `partition()`\n- `swap()`\n\n方法 `sort()`\
  \ 调用了重载方法 `quicksort()`，该方法如果参数 `arr`（一个数组）的长度不零，则会调用第二个 `quicksort()` 方法。\n\n接下来，第二个\
  \ `quicksort()` 方法包含了当参数 `lo` 小于参数 `hi` 时执行的条件逻辑，这涉及到三个代码段。第一个代码段通过执行方法 `partition()`\
  \ 的结果来初始化值 `splitPoint`，该方法稍后会讨论。第二个代码段使用一组参数递归地调用当前的 `quicksort()` 方法，紧接着使用另一组参数执行另一个当前\
  \ `quicksort()` 方法的递归调用。\n\n列表 4.10 的下部分是 `partition()` 方法，它执行了快速排序算法的“重型工作”。该方法通过初始化变量\
  \ `pivot`、`i` 和 `j` 开始，它们分别是 `arr[lo]`、`lo-1` 和 `hi+1`。`partition()` 方法的剩余部分由一个\
  \ `while` 循环组成，包含两个 `do-while` 循环和一个 `if-else` 语句。第一个 `while` 循环在 `arr[i]` 小于 `pivot`\
  \ 时增加 `i` 值；第二个 `while` 循环在 `arr[j]` 大于 `pivot` 时减少 `j` 值。如果 `i < j`，则调用 `swap(arr,\
  \ i, j)`；否则返回 `j`。壳排序（由 Donald L. Shell 发明）与泡排序相似：两种算法都比较元素对并在顺序错误时进行交换。然而，与泡排序不同，壳排序在迭代迭代并不比较相邻元素。相反，它首先比较相距远的元素，并在每次传递时缩小间隔的大小。通过这种方式，它在早期处理了位置错误的元素，减少了后续传递的工作量。\n\
  \n列表 4.11 显示了 `ShellSort.java` 的内容，它说明了如何在 Java 中实现壳排序算法。\n\n列表 4.11：`ShellSort.java`\n\
  \n```java\npublic class ShellSort {\n    public static int[] shellSort(int num,\
  \ int[] arr) {\n        int gap = (int)(num/2);\n        while(gap > 0) {\n    \
  \        for(int i=gap; i<num; i++) {\n                int j = i;\n            \
  \    while(j >= 0 && arr[j] > arr[j+gap]) {\n                    // 交换 arr[j] 和\
  \ arr[j+gap]\n                    int temp = arr[j];\n                    arr[j]\
  \ = arr[j+gap];\n                    arr[j+gap] = temp;\n                    j =\
  \ j-gap;\n                }\n            }\n            gap = (int)(gap/2);\n  \
  \      }\n        return arr;\n    }\n    public static void main(String[] args)\
  \ {\n        int num = 6;\n        int[] arr = new int[]{50,20,80,-100,500,200};\n\
  \        System.out.println(\"Original:\");\n        for (int num1 : arr ) {\n \
  \           System.out.print(num1+\" \");\n        }\n        System.out.println();\n\
  \        int[] result = shellSort(num, arr);\n        System.out.println(\"Sorted:\"\
  );\n        for (int num2 : result ) {\n            System.out.print(num2+\" \"\
  );\n        }\n        System.out.println();\n    }\n}\n```\n\n\n\n列表 4.11 定义了包含\
  \ Shell 排序算法的静态方法 `shellSort()`。第一行代码将整型变量 `gap` 初始化为包含整数值的数组 `arr` 的中点。接下来，只要变量\
  \ `gap` 大于 0，`while` 循环就会一直执行。在每次迭代中，都会会执行一个嵌套的 `for` 循环和另一个 `while` 循环。`for` 循环将循环变量\
  \ `i` 初始化为 `gap` 的值，并增加 `i` 的值直到 `num-1`，同时将变量 `j` 初始化为 `i-gap`，如下：\n\n```java\n\
  for(int i=gap; i<num; i++) {\n    int j = i-gap;\n```\n\n接下来，嵌套的 `while` 循环交换索引位置\
  \ `j` 和 `j+gap` 的元素，并将 `j` 的值替换为 `j-gap`。当嵌套的 `for` 循环执行完成后，`gap` 的值被除以 2，外层循环再次执行。\n\
  \n列表 4.11 的下部分定义了 `main()` 方法，该方法用六个整数初始化数组 `arr`，并将变量 `num` 初始化为 `arr` 的长度。`main()`\
  \ 方法的剩余部分显示 `area` 的值，调用 `shellSort()` 方法，然后显示数组 `arr` 中排序后的值。运行列表 4.11 中的代码，你将看到以下输出：\n\
  \n原始：\n50 20 80 -100 500 200\n\n排序后：\n-100 20 50 80 200 500\n\n## 任务：排序数组和两个数字之和\n\
