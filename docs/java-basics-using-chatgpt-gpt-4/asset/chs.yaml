  My name is Jane Andrews\nMy name is Jane Andrews\n```\n\n列表 1.6 中的代码虽然直观，但它包含了硬编码的值，因此没有重用性。例如，如果你想打印数组中定义的所有名称，或者从这些数组中随机打印名称，或者从命令行获取一个人的姓和名然后打印该人的姓名。在本章的稍后部分中，你将学习如何处理数组，之后你将学习如何定义访问器（accessors）和修改器（mutators）来获取和设置变量的值。\n\
  \n下一节将提供更多关于 `==` 和 `equals()` 方法之间差异的细节。\n\n### 字符串的相等性\n\n与其他语言不同，`==` 运算符并不确定两个字符串是否相同：它只确定两个变量是否引用相同的内存位置。`equals()`\
  \ 方法会比较两个字符串的内容，而 `==` 运算符仅判断引用。\n\n列表 1.7 显示了 `Strings.java` 的内容，展示了如何比较两个字符串并确定它们是否具有相同的值或相同的引用。\n\
  \n### 字符串的相等性\n\n（注：此处根据原文逻辑翻译，原文描述似乎与列表 1.7 标题内容有交叉，此处遵循原文翻译）\n\n###字符串的相等性\n\n\
  与其他语言不同，`==` 运算符并不确定两个字符串是否相同：它只确定两个变量是否引用相同的内存位置。`equals()` 方法会比较两个字符串的内容，而 `==`\
  \ 运算符仅判断引用。\n\n列表 1.7 显示了 `EqualStrings.java` 的内容，展示了如何比较两个字符串并确定它们是否具有相同的值或相同的引用。\n\
  \n### 列表 1.7: EqualStrings.java\n\n```java\nimport java.io.IOException;\npublic\
  \ class EqualStrings\n{\n    public static void main(String[] args) throws IOException\n\
  {\n        String str1 = \"Pizza\";\n        String str2 = \"Pizza\";\n        if\
  \ (str1.equals(str2)) {\n            System.out.println(\"str1 and str2: equal values\"\
  );\n        }\n        if (str1 == str2) {\n            System.out.println(\"str1\
  \ and str2: equal references\");\n        }\n        System.out.println(\"\");\n\
  \        String str3 = \"Pasta\";\n        String str4 = new String(\"Pasta\");\n\
  \        if (str3.equals(str4)) {\n            System.out.println(\"str3 and str4:\
  \ equal values\");\n        } else {\n            System.out.println(\"str3 and\
  \ str4: unequal values\");\n        }\n        if (str3 == str4) {\n           \
  \ System.out.println(\"str3 and str4: equal references\");\n        } else {\n \
  \           System.out.println(\"str3 and str4: unequal references\");\n       \
  \ }\n    }\n}\n```\n\n列表 1.7 定义了 Java 类 `EqualStrings` 和一个 `main()` 函数，它定义了变量 `str1`、`str2`、`str3`\
  \ 和 `str4`。运行列表 1.7 中的代码，你将看到：\n\n```\nstr1 and str2: equal values\nstr1 and str2:\
  \ equal references\n\nstr3 and str4: equal values\nstr3 and str4: unequal references\n\
  ```\n\n记住：当你创建一个字符串字面量时，JVM（Java 虚拟机）会检查字符串池中是否存在该字符串。如果该字符串在池中，Java 将直接返回池实例的引用；否则，将创建一个新的字符串实例（并将其放入池中）。为了确定\
  \ Java 中的两个字符串是否完全相同，请使用 `compareTo(str)` 方法，其示例将在下一节中讨论。\n\n### 比较字符串\n\n列表 1.8\
