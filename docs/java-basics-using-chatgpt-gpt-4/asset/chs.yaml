  \ `str1` 到 `str6`。三个 `println()` 语句显示了它们的值，如下：\n\n```\nstr1: John str2: Sally\n\
  str3: *?) str4: +.@\nstr5:\n\n  str6:\n```\n\n在上述输出中，空格字符和制表符之间没有可见的区别。然而，如果将输出重定向到名为\
