  \ 0 到 2 之间，这意味着我们可以生成成百上行输出。当然，会有许多重复的输出行，因为实际上只有三个不同的人。\n\n## 使用 STRINGBUFFER 类\n\
  \n`StringBuilder` 类与 `StringBuffer` 类相似：它们都通过创建可变的字符序列来提供 `String` 类的替代方案，但它们在同步方面的行为有所不同。\n\
  \n`StringBuilder` 类不是线程安全的，而 `StringBuffer` 类保证了同步。因此，如果你需要线程安全的代码，请使用 `StringBuffer`\
  \ 类；如果你的代码是单线程的，请使用 `StringBuilder` 类，因为在大多数情况下它的速度更快。\n\n列表 1.17 显示了 `PersonRandom.java`\
  \ 的内容，该程序使用随机生成的索引来访问姓名数组，以便打印一个人的姓和名。\n\n列表 1.17: PersonRandom.java\n\n```java\n\
  public class PersonRandom\n{\n    private String[] firstNames = {\"Jane\",\"John\"\
  ,\"Bob\"};\n    private String[] lastNames = {\"Smith\",\"Jones\",\"Stone\"};\n\
