  \ \"()(\"\nS4 = \"(())\"\nS5 = \"()()(\"\n```\n\n如你所示，`S1`、`S3` 和 `S4` 具有平衡括号，而\
  \ `S2` 和 `S5` 的括号是不平衡的。\n\n列表 2.12 展示了 `BalancedParentheses.java` 的内容，说明了如何判断一个字符串是否由平衡括号组成。\n\
  \n### 列表 2.12: BalancedParentheses.java\n\n```java\n// https://stackoverflow.com/questions/31849977/balanced-parenthesis-how-to-count-them\n\
  \npublic class BalancedParens\n{\n    public BalancedParens(){}\n    public static\
  \ void main(String[] args)\n    {\n        String[] exprs = new String[]{\"(){}[]\"\
  ,\"((}\",\"(())\"};\n        for(int idx=0; idx<exprs.length; idx++)\n        {\n\
  \            String str = exprs[idx];\n            int counter = 0;\n          \
  \  for (char ch : str.toCharArray())\n            {\n                if (ch == '(')\
  \ counter++;\n                else if (ch == ')') counter--;\n                if\
  \ (counter < 0) break;\n            }\n            if (counter == 0) {\n       \
  \         System.out.println(\"balanced string:\"+n);\n            } else {\n  \
  \              System.out.println(\"unbalanced string:\"+n);\n            }\n  \
  \      }\n    }\n}\n```\n\n该代码的直觉涉及一个整数变量 `counter` 来计数括号：每遇到一个左括号 `counter` 加 1，每遇到一个右括号\
  \ `counter` 减 1。\n\n列表 2.12 定义了 `main()` 方法，该方法将字符串数组 `exprs` 初始化为三个包含括号和大括号的字符串值。接下来，外层循环遍历\
  \ `exprs` 数组的每个元素，内部循环通过变量 `ch` 遍历当前字符串的字符。循环包含条件逻辑：如果 `ch` 等于 `(` 则 `counter` 增，如果\
  \ `ch` 等于 `)` 则 `counter` 减小。此外，如果 `counter` 为负数，则提前退出循环。\n\n列表 2.12 的最后代码部分包含条件逻辑：如果\
  \ `counter` 等于 0，则当前字符串是平衡的，否则当前字符串是不平衡的。运行列表 2.8 中的代码，你将看到以下输出：\n\n```text\nbalanced\
