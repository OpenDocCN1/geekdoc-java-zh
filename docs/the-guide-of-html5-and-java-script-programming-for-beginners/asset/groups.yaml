    # The Map Application


    The next application, mapabase.html, recreates the first application, but uses
    a separate file for the content. You can easily make this own by changing the
    content. You need to obtain the latitude/longitude coordinates for your locations.
    To do so, you can use Maps directly, or look them up in atlas. A quick summary
    of the application follows:


    - **init**: Performs initialization, including the call to **loadcontent**.

    - **loadcontent**: Uses variables, significantly the **content** array included
    in the external script element to create markup. It also invokes **makemap**.

    - **makemap**: Brings in the map and sets up event handling, including the call
    to **checkit**.

    - **checkit**: Compares the clicked location with **content** array. If one is
    close enough, then the associated media is shown and played.

    - **dist**: Computes the distance between two locations, describing the invoked
    application and calling relationships for mapabase.html application is similar
    for all the applications.


