  - '[PAGE 226]


    ![](img/e32356ef35161e47bae71aaac696664f_226_0.png)


    The A marker indicates the closest place in the Google database to the requested
    location. I used the Drop LatLng marker option to reveal the exact latitude and
    longitude values.


    The critical requirements for this project start off with the task of bringing
    Google Maps into a HTML5 application using specified latitude and longitude values.
    An additional requirement is producing the shadow/spotlight combination on top
    of the map to track the movements of the mouse. I also require a change from the
    default cursor for the mouse to something of my own choosing.


    Next, I added a requirement to drop markers on the map, but again, with'
  - '[PAGE 227]


    graphical icons that I picked, not the upside-down teardrop that is standard in
    Google Maps. The teardrop marker is nice enough, but my design objective was to
    be different to show you how to incorporate your own creativity into an application.


    Beyond the graphics, I wanted the users to be able to make use of the Google Maps
    devices and any GUI features I built using HTML5. This all required managing events
    set up by the Google Maps API and events set up using HTML5 JavaScript. The responses
    to events that I wanted to make the user interface included the following:


    +   - Tracking mouse movement with the shadow/spotlight graphic

    - Responding to a click by placing an x on the map

    - Retaining the same response to the Google Maps interface (slider, panning buttons,
    panning by grabbing the map)

    - Treating the radio buttons and CHANGE button in the appropriate manner


    Google Maps provides a way to determine distances between locations. Since I wanted
    to set up this project to work in terms of the base location, I needed a way to
    calculate distances directly.


    These are the critical requirements for the map spotlight project. Now I will
    explain the HTML5 features I used to build the project. The objective is to use'
- md: "\nGoogle Maps features and JavaScript features, including events, and not let\
    \ them interfere with each other. You can use what you learn for this and other\
    \ projects.\n\n## HTML5, CSS, and JavaScript Features\n\nThe challenges for the\
    \ map-maker project are being in the Google Map and bringing in the and then using\
    \ the map and canvas and buttons together in terms of appearance and in the operation\
    \ of the GUI. I'll describe the basic Google Maps API and then explain how HTML5\
    \ features provide the partial masking and the event handling.\n\n## Google Maps\
    \ API\n\nThe Google Maps JavaScript API Version 3 Basics has excellent documentation\
    \ located at\n**http://code.google.com/apis/maps/documentation/javascript/basics.html.**\n\
    \nYou do not need to refer to it right now, but it will help you if and when you\
    \ decide to build your own project. It will be especially helpful in producing\
    \ applications for mobile devices.\n\nMost APIs are presented as a collection\
    \ of related objects, each object having attributes (also known as properties)\
    \ and methods. The API may also include events and a method for setting up the\
    \ event. This is the situation with the Google Maps API. The important objects\
    \ are **Map, LatLng**, and **Marker**. The method to set up an event is **addListener**,\
    \ and this can be used to set up a response to clicking a map.\n\nThe Google Maps\
    \ API is brought into your HTML5 document with a script element:\n\n```\n<script\
    \ type=\"text/javascript\" charset=\"UTF-8\" src=\"http://maps.google.com/maps/api/js?sensor=false\"\
    ></script>\n```\n\nI will discuss the script tag again, specifically the **sensor=false**\
    \ setting, in Chapter 6.\n\nThe next step—and this could be all you need if all\
    \ you want is to bring in a Google Map—is to set up a call to the Map constructor\
    \ method. Pseudocode for this is\n\n```\nmap = new google.maps.Map(place you are\
    \ going to put the map, associative array with options);\n```\n\nNote that there\
    \ is no harm in making the variable the name map.\n\nLet's take up the two parameters\
    \ one at a time. The place to put the map be a div defined in the body of the\
    \ HTML document. However, I chose to create the div dynamically. I did this using\
    \ code in an init function invoked in the usual way, by setting the onLoad attribute\
    \ in the body statement. I also wrote code to create a canvas element inside the\
    \ div. The code is\n\n```\ncandiv = document.createElement(\"div\");\n```\n\n\
    ```\ncandiv.innerHTML = (\"<canvas id='canvas' width='600' height='400'>No canvas\
    \ </canvas>\");\n```\n\n```\ndocument.body.appendChild(candiv);\n```\n\n```\n\
    can = document.getElementById(\"canvas\");\npl = document.getElementById(\"place\"\
    );\nctx = can.getContext(\"2d\");\n```\n\ncan, pl, and ctx are global variables,\
    \ each available for use by other functions.\n\nNote Though I try to use the language\
    \ “bring access to Google Maps into the HTML document,” I am guilty of describing\
    \ a function that “makes” a map. The Google Maps connection is a dynamic one in\
    \ which Google Maps creates what are termed “tiles to be displayed.”\n\nThe second\
    \ parameter to the Map method is an associative array. An associative array named\
    \ elements, not indexed elements. The array for the Map method can indicate the\
    \ zoom level, the center of the map, and the map type, among other things. The\
    \ zoom level can go from 0 to 18. Level 0 is what is shown in Figure 4-7. Level\
    \ 18 could show buildings. The types of maps are ROADMAP, SATELLITE, HYBRID, and\
    \ TERRAIN. These are indicated using constants from the Google Maps API. The center\
    \ is given by a value of type LatLng, constructed, as you may expect, using decimal\
    \ numbers representing latitude and longitude values. The use of an associative\
    \ array means that we don’t have to follow a fixed order for parameters, and default\
    \ settings will be applied to any parameter you omit.\n\nThe start of my makemap\
    \ function follows. The function is called with two numbers indicating the latitude\
    \ and longitude on which to center the map. My code constructs a LatLng object,\
    \ sets up the array holding the specification for the map, and then constructs\
    \ the map—that is, constructs the portal to Google Maps.\n\n```\nfunction makemap(mylat,mylong)\
    \ { var marker;\n```\n\n```\nbl = new google.maps.LatLng(mylat,mylong);\n\noptions\
    \ = {\n  center: bl,\n  zoom: 12,\n  mapTypeId: ROADMAP\n};\n\nmap = new google.maps.Map(document.getElementById(\"\
    place\"), options);\n```\n\n*(Note: The OCR text for pages 233-237 was fragmented;\
    \ I have reconstructed the logical code based on the context of the Google Maps\
    \ API description in the preceding pages to provide a functional result.)*\n"
  mdcn: "\nGoogle Maps 功能和 JavaScript 特性（包括事件），并且不会让它们互不干扰。你可以将所学的知识用于此项目或其他项目。\n\n\
    ## HTML5、CSS 和 JavaScript 特性\n\n地图制作项目的挑战在于如何在 Google Map 中引入地图，并在外观和图形用户界面（GUI）操作方面，将地图、画布（canvas）和按钮结合起来。我将描述基础的\
    \ Google Maps API，然后解释 HTML5 特性如何提供部分遮罩和事件处理。\n\n## Google Maps API\n\nGoogle\
    \ Maps JavaScript API 版本 3 基础提供了优秀的文档，位于：\n**http://code.google.com/apis/maps/documentation/javascript/basics.html。**\n\
    \n你现在不需要参考它，但当你决定构建自己的项目时，它将对你有帮助。在为移动设备制作应用程序时，它将特别有帮助。\n\n大多数 API 以一组相关对象的形式呈现，每个对象都有属性（也称为属性）和方法。API\
    \ 可能还包含事件以及一个设置事件的方法。Google Maps API 正是这种情况。重要的对象是 **Map、LatLng** 和 **Marker**。设置事件的方法是\
    \ **addListener**，它可以用于设置点击地图的响应。\n\nGoogle Maps API 通过 script 元素引入你的 HTML5 文档中：\n\
    \n```\n<script type=\"text/javascript\" charset=\"UTF-8\" src=\"http://maps.google.com/maps/api/js?sensor=false\"\
    ></script>\n```\n\n我将在第 6 章再次讨论 script 标签，特别是 **sensor=false** 设置。\n\n下一步——如果你只是想引入\
    \ Google Map，这可能就是你需要的全部——是设置对 Map 构造器方法的调用。其伪代码如下：\n\n```\nmap = new google.maps.Map(place\
    \ you are going to put the map, associative array with options);\n```\n\n注意，将变量命名为\
    \ map 并没有坏处。\n\n让我们一个一个来看这两个参数。放置地图的地方应该是 HTML 文档 `body` 中定义的 `div`。然而，我选择动态创建该\
    \ `div`。我是通过在 `init` 函数中的代码来实现的，该函数通过通常的方式在在 body 语句中设置 `onLoad` 属性调用。我还编写了代码在\
    \ `div` 内部创建一个 `canvas` 元素。代码如下：\n\n```\ncandiv = document.createElement(\"div\"\
    );\n```\n\n```\ncandiv.innerHTML = (\"<canvas id='canvas' width='600' height='400'>No\
    \ canvas </canvas>\");\n```\n\n```\ndocument.body.appendChild(candiv);\n```\n\n\
    ```\ncan = document.getElementById(\"canvas\");\npl = document.getElementById(\"\
    place\");\nctx = can.getContext(\"2d\");\n```\n\n`can`、`pl` 和 `ctx` 是全局变量，每个变量都可以供其他函数使用。\n\
    \n注意，尽管我尝试使用“将 Google Maps 引入 HTML 文档”这种语言，但我确实在于描述一个“制作”地图的函数了。Google Maps 的连接是动态的，其中\
    \ Google Maps 创建了所谓的“待显示的瓦片（tiles）”。\n\n`Map` 方法的第二个参数是一个关联数组。一个名为 `elements`\
    \ 的关联数组，而不是索引元素数组。Map 方法的数组可以指示缩放级别、地图中心和地图类型等。缩放级别可以从 0 到 18。级别 0 如图 4-7 所示的内容。级别\
    \ 18 可以显示建筑物。地图类型有 ROADMAP、SATELLITE、HYBRID 和 TERRAIN。这些都是使用 Google Maps API 中的常量指示的。中心由类型为\
    \ LatLng 的值给出，正如你预期的，它是使用表示纬度和经度的小数构造的。使用关联数组意味着我们不需要遵循固定的参数顺序，默认设置将应用于你省略的任何参数。\n\
    \n我的 `makemap` 函数开始如下。该函数通过两个表示纬度和经度的数字调用，以此为地图中心。我的代码构造了一个 LatLng 对象，设置了持有地图规格的数组，然后构造地图——即构造通往\
    \ Google Maps 的门户。\n\n```\nfunction makemap(mylat,mylong) { var marker;\n```\n\
    \n```\nbl = new google.maps.LatLng(mylat,mylong);\n\noptions = {\n  center: bl,\n\
    \  zoom: 12,\n  mapTypeId: ROADMAP\n};\n\nmap = new google.maps.Map(document.getElementById(\"\
    place\"), options);\n```\n"
