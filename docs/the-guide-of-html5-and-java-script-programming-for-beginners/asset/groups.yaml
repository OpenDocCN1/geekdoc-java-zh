    It also invokes **makemap**.

    3. **makemap**: Brings in the map and sets up event handling, including the call
    to **checkit**.

    4. **checkit**: Compares the clicked location with the locations described in
    the **content** array. If one is close enough, then the associated media is shown
    and played.

    5. **dist**: Computes the distance between two locations.


