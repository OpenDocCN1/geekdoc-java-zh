    ```javascript

    ctx.fill();

    ```


    If you haven''t done any drawing on canvas, here is the whole HTML script needed
    to produce the 5-sided shape. The onLoad attribute in the <body> tag causes the
    init function to be invoked when the document is loaded. The init function sets
    the ctx variable, sets the fillStyle property and draws the path.


    ```html

    <!DOCTYPE html><html>

    <head>

    <title>HTML 5 Logo</title>

    <meta charset="UTF-8">

    <script>

    function init() {

    ctx = document.getElementById(''canvas'').getContext(''2d''); ctx.fillStyle =
    "#E34C26";

    ctx.beginPath();

    ctx.moveTo(39, 250);

    ctx.lineTo(17, 0);

    ctx.lineTo(262, 0);

    ctx.lineTo(239, 250);

    ```


    ```javascript

    ctx.lineTo(139, 278);

    ctx.closePath();

    ctx.fill();

    }

    </script>

    </head>

    ```


    ```html

    <body onload="init();">

    <canvas id="canvas" width="600" height="400">

    Your browser does not support the canvas element .

    </canvas>

    </body>

    </html>

    ```


    Do practice and experiment with drawing on the canvas if you haven''t done so
    before, but I will go on. The other shapes are produced in a similar manner. By
    the way, if you see a line down the middle of the shield, this is an optical illusion.


    ## Placing text on canvas and in the body of a document


    Text is drawn on the canvas using methods and attributes of the context. The text
    can be filled in, using the fillText method or drawn as an outline using the strokeText
    method. The color is whatever the current fillStyle property or strokeStyle property
    holds. Another property of the context is the font. This property can contain
    the size of the text and one or more fonts. The purpose of including more than
    one font is to provide options to the browser if the first font is unavailable
    on the computer running the browser. For this project, I use


    ```javascript

    var fontFamily = "65px ''Gill Sans Ultra Bold'', sans-serif";

    ```


    and in the init function


    ```javascript

    ctx.font = fontFamily;

    ```


    This directs the browser to use the Gill Sans Ultra Bold font if it is available
    and if not, use whatever the default sans-serif font on the computer.


    I could have put this all in one statement, but chose to make it a variable. You
    can decide my choice of font was close enough to the official W3C logo.


    **Note**- There are at least two other approaches to take for this example. One
    possibility is to NOT use text but to draw the letters as filled-in paths. The
    other is to locate and acquire a font and place it on the server holding the HTML5
    document and reference it directly using @font-face.


    With the font and color set, the methods for drawing text require a string and
    a position: x and y coordinates. The statement in this project to draw the letters
    is


    ```javascript

    ctx.fillText("HTML", 31,60);

    ```


    Formatting the rest in the rest of the HTML document, that is, outside a canvas
    element, requires the same attention to fonts. In this project, I choose to make
    use of the semantic elements new to HTML5 and follow the practice of putting formatting
    in the style element. The body of my HTML script contains two article elements
    and one footer elements. One article holds the input element with a comment and
    the other article holds the rest of the explanation. The footer element contains
    the reference to W3C. Formatting and usage of these are up to the developer/programmer.
    This includes making sure the footer is the last thing in the document. If I placed
    the footer before one or both articles, it would no longer be displayed at the
    foot, that is, the bottom of the document. The style directives for this project
    are the following:


    ```css

    footer {display:block; border-top: 1px solid orange; margin: 10px;

    font-family: "Trebuchet MS", Arial, Helvetica, sans-serif; font-weight: bold;}


    article {display:block; font-family: Georgia, "Times New Roman", Times, serif;
    margin: 5px;}

    ```


    The styles each set up all instances of these elements to be displayed blocks.
    This puts a line break before and after. The footer has a border on the top, which
    produces the line above the text. Both styles specify a list of four fonts each.
    So the browser first sees if Trebuchet MS is available, then checks for Arial,
    then for Helvetica and then, if still unsuccessful, uses the system default sans-serif
    font for the footer element. Similarly, the browser checks for Georgia, then Times
    New roman, then Times and then, if unsuccessful, uses the standard serif font.
    This probably is overkill, but it is the secure way to operate. The footer text
    is displayed in bold and the articles each have a margin around them of 5 pixels.


    Formatting, including fonts, is important. HTML5 provides many features for formatting
    and for separating formatting from structure and content. You need to treat the
    text on the canvas differently than the text in the other elements.


    ## Coordinate transformations


    I have given motivation for using coordinate transformations, specifically to
    keep using a set of coordinates. To review, a coordinate system is the way to
    specify positions on the canvas. Positions are specified as distances from an
    origin point. For the two-dimensional canvas, two coordinates are necessary: the
    first coordinate, governing the horizontal, often called the x and the second
    coordinate, governing the vertical, called the y. A pesky fact is that when drawing
    to screens the y axis is flipped so the vertical is measured from the top of the
    canvas. The horizontal is measured from the left. This means that the point (100,200)
    is further down the screen than the point (100,100).


    In the logo project, I wrote code to display the letters HTML and then move the
    origin to draw the rest of the logo. An analogy would be that I know the location
    of my house from the center of my town and so I can give directions to the center
    of town and then give directions to my house. The situation in which I draw the
    letters in the logo and ''move down the screen'' requires the translate transformation.
    The translation is done just in the vertical. The amount of the translation is
    stored in a variable I named offset:


    ```javascript

    var offset = 80; ...

    ```


    ```javascript

    ctx.fillText("HTML", 31, 60);

    ```


    ```javascript

    ctx.translate(0, offset);

    ```


    Since I decided to provide a way for the viewer to change the size of the logo,
    I made use of the scale transformation. Continuing the analogy of directions,
    this is equivalent to changing the units. You may give some directions in miles
    (or kilometers) and other directions in yards or feet or maybe, blocks. The scaling
    can be saved separately for each dimension. In this application, there is a variable
    called factor value that is set by the function when the input is changed. The
    statement


    ```javascript

    ctx.scale(factorvalue, factorvalue);

    ```


    changes the units for both the horizontal and vertical direction.


    HTML5 provides a way to save the current state of the coordinate system and restore
    what you saved. This is important if you need your code to get back to a previous
    state. The saving and restoring is done using what is termed a stack: last in
    first out. Restoring the coordinate state is termed popping the stack and saving
    the coordinate state is pushing something onto the stack. My logo project does
    not use this in its full power, but it is something to remember to investigate
    if you are doing more complex applications. In the logo project, my code saves
    the original state when the document is first loaded. Before drawing the logo,
    it restores what was saved and then saves again so it is available the next time.
    The code at the start of the function dologo, which draws the logo, starts off
    as follows:


    ```javascript

    function dologo() { var offset = 80 ;

    ```


    ```javascript

    ctx.restore();

    ctx.save();

    ctx.clearRect(0,0,600,400);

    ctx.scale(factorvalue,factorvalue);

    ctx.fillText("HTML", 31,60);

    ctx.translate(0,offsety);


    // 5 sided orange background ctx.fillStyle = "#E34C26"

    ctx.beginPath();

    ctx.moveTo(39, 250);

    ctx.lineTo(17, 0);

    ctx.lineTo(262, 0);

    ctx.lineTo(239, 250);

    ctx.lineTo(139, 278);

    ctx.closePath();

    ctx.fill();


    // right hand, lighter orange part of the background ctx.fillStyle = "#F06529"

    ctx.beginPath();

    ```

