    on top of the map. A quick summary of the application follows:


    +   1. init: Performs initialization, including invoking makemap for bringing
    in the map. The init function constructs the content array using data constructed
    as references to elements in the body.


    +   2. makemap: Brings in a map and sets up event handling, including the call
    to checkit.


    +   3. checkit: Compares the clicked location with the locations described in
    the content array. If one is close enough, then the associated media is shown
    and played.


    +   4. dist: Computes the distance between two locations.


    Table 5-2 outlines the functions in the mapvideos project. The function table
    describing the invoked/called by and calling relationships is similar for all
    the applications.


    | Function | Invoked/Called By | Calls |

    |---|---|--|

    | init | Invoked by action of the onLoad attribute in the <body> tag | |'
