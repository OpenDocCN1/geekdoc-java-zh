    \ = drawheart;\nthis.overcheck = overheart;\nthis.ang = .25*Math.PI;\n}\n```\n\
    \n`ang` 属性是我的一种留后路做法。你会注意到它是一个常量，我可以避免将其设为属性。稍后当我解释 `drawheart` 时，你会看到我的代码是如何使用它来使心形变圆的。我把它设为属性是为了防万以后我想修改它以允许心形具有更多变体。\n\
    \n## 绘制\n\n我有不同的方法函数需要解释，但让我们直接进入绘制发生的地方，以演示这一切是如何协同工作的。我定义了一个数组，初始为空：\n\n```\n\
    var stuff = [];\n```\n\n然后我的代码通过如下述语句向此数组中添加内容：\n\n- stuff.push(pic1);\n- stuff.push(pic2);\n\
