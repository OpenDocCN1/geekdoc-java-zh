    基点位置（小红色 x）是 Friends of ED, NYC

    从基点到最近的标记点 (40.7257, -74.0049) 的距离为 0.01 公里。

    更改基点位置：


    + - Friends of ED, NYC

    - Purchase College

    - Illinois Institute of Technology


    ```

    CHANGE

    ```


    ![](img/e32356ef35161e47bae71aaac696664f_217_0.png)


    图 4-9. 缩放至最大


    通过使用界面进行缩小、平移并再次放大，我可以确定从任何基点位置到世界上任何其他位置的距离！我还可以使用此应用程序来确定任何位置的经纬度和经度值。在更改或添加基点位置列表，以及确定第
    5 章项目位置时，您需要知道纬度和经度。我将在下一节中回顾纬度和经度。


    Google Maps 本身就是一个极其实用的应用程序。本章和接下来的两章将演示如何将功能引入你自己的应用程序中。也就是说，我们将 Google Maps
    的通用功能与使用 HTML5 和 JavaScript 开发的任何（或几乎任何）内容相结合。


    # 纬度、经度和其他关键需求


    该项目（以及后续章节）最基本的要求是对理解地理坐标系。就像在画布上指定点或在屏幕上指定位置需要坐标系一样，地球上的地点也需要使用一套系统。经纬度系统在过去的几百年里已经开发并标准了。这些值是角度，纬度表示距离赤道的度数，经度表示距离英国格林威治本午线的度数。后者是一个任意的选择，并于
    19 世纪后期成为标准。这里存在一个北半球的偏向：纬度值从赤道的 0 度到北极的 90 度，再到南极的 –90 度。同样，经度值从格林威治本午线开始，向东为正数，向西为负数。纬度通常被称为纬线，通常表现为水平线；经度通常被称为经线，通常表现为垂直线。这种取向是任意的，但已经非常稳固。


    我将使用小数值（这是 Google Maps 的默认显示方式），但你会看到度、分（1  1/60）和秒（1 分的 1/60）的组合。没有必要背诵经纬度值，但对该系统建立一些直觉感是有益的。你可以通过我所谓的“双向奔赴”来实现这一点。首先，识别并比较你熟悉的地方的经纬度值；其次，选取数值并查看它们是什么。例如，我这个版本的项目基值如下：


    + - [40.725592–74.00495, “friends of ED, NYC”]

    + - [41.04796–73.70539, “Purchase College/SUNY”]

    + - [41.878928–87.641926, “Illinois Institute of Technology”]]


    首先要到，纬度值非常接近，而经度值是负数且并不接近。纽约市的 friends of ED 办公室位于 Purchase College 1 度纬度和 1 度经度的范围内。根据
    Google Maps 显示，距离为 27.4 英里。伊利诺理工学院的经度值更负，表明它比那两个纽约州的地点更靠西。这些都合情合理，但你需要花时间仔细思考。


    寻找特定位置的经纬度有很多种方法。你可以这样使用 Google Maps：


    + 1. 启动 Google Maps（访问 www.google.com 并点击 Maps 或访问 http://maps.google.com）。

    + 2. 在右上角点击齿轮图标打开下拉菜单。点击 Maps Labs 选项。会出现一个标题为 Google Maps Labs 的窗口。滚动到 LatLng
    Marker 选项并点击圆圈启用。如果你登录，所有设置将在下次登录时依然有效。保存并关闭窗口。

    + 3. 在位置字段中输入你感兴趣的位置。

    + 4. 点击地图上的位置以查看坐标。

    + 5. 经纬度将出现在屏幕底部。


    你也可以在地图上的任何地方点击右键以查看该点的坐标。

    '
