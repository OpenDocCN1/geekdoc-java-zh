    ## PHP 语言简介绍


    发送电子邮件是服务器提供的功能，而不是客户端计算机的功能。有几种语言可以编写所谓的服务器端脚本，PHP 就是其中之一。它在 www.php.net 上有良好的维护和文档支持。你将在第
    10 节数据库项目的描述中读到更多关于 PHP 的内容。


    上一节展示了如何作为提交表单的结果来调用 PHP 脚本。表单输入可以通过两种方式之一传递给脚本：`POST` 和 `GET`。`GET` 方式利用所谓的查询字符串。`POST`
    方式是使用 HTTP 头部完成。我选择在此示例中使用 `POST`。


    PHP 脚本的主要目的是在服务器上执行某些操作，可能是使用 HTML 文档的表单输入，并生成一个 HTML 文档传回浏览器进行显示。本项目的示例并非如此，但许多
    PHP 脚本由 HTML 和 PHP 混合组成。PHP 部分由分隔符 `<?php` 和 `?>` 指明。`echo` 函数将其输入添加到正在创建的 HTML
    文档中。


