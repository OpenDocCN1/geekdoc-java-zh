    # Testing and Uploading the Application


    As has been mentioned, but is worth repeating, you need to acquire a suitable
    video clip. At the time of writing this book, you then need to use a program such
    as Miro to produce the WEBM, mp4, OGG versions because browsers recognize different
    video encodings (codecs). This situation may change. Again, if you are content
    with implementing this for just one browser, you can check which video encoding
    works for that browser and just prepare one video file. The video files and the
    html file need to be in the same folder on your computer and in the same folder
    on your server if and when you upload this application to your server account.
    Alternatively, you can use a complete web address or the correct relative address
    in the source elements.


    # Summary


    In this chapter, you learned different ways to manipulate video. These included
    the following:


    - Drawing the current frame of video as an image onto a canvas

    - Repositioning of a video element on the screen by changing the left top style
    attributes

    - Using style directives to layer a video, a canvas, and a button

    - Creating a moving mask on a canvas

    - Acquiring information on the dimensions of the window to adapt an application
    to different situations


    The next chapter will show you how to use the Google Maps Application Programming
    Interface (API) in an HTML5 project. The project will involve using a canvas and
    changing the z-index so that the canvas is alternatively under and over the material
    produced by Google Maps.


    # CHAPTER 4


    # Map Maker: Combining Google Maps and the Canvas


    In this chapter, you will learn how to do the following:


    - Use the Google Maps API to display a map at a specific location

    - Draw graphics on a canvas using transparency (also known as the alpha or opacity
    level) and a customized cursor icon

    - Provide a graphical user interface (GUI) to your users by combining the use
    of Google Maps and HTML5 features by managing the events and the z-index levels

    - Calculate the distance between two geographical locations


