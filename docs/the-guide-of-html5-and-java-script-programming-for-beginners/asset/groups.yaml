    # 地图应用


    下一个应用 mapabase.html 重新创建了第一个应用，但使用独立的文件作为内容。你可以通过更改内容轻松创建属于自己的应用。你需要获取位置的纬度/经度坐标。你可以直接使用
    Maps，或者在地图集中查找。以下是该应用的快速摘要：


    - **init**: 执行初始化，包括对 **loadcontent** 的调用。

    - **loadcontent**: 使用变量，特别是外部脚本元素中包含的 **content** 数组来创建标记。它还调用了 **makemap**。

    - **makemap**: 引入地图并设置事件处理，包括对 **checkit** 的调用。

    - **checkit**: 将点击的位置与 **content** 数组进行比较。如果一个足够近，则显示并播放相关的媒体文件。

    - **dist**: 计算两个位置之间的距离，mapabase.1 应用中描述的应用和调用关系对于所有应用都是类似的。


    ## 表 5-4. 第二个门户应用中的函数


    | 函数 | 调用者/调用 |

    | --- | --- |

    | init | 在 <body> 标签中调用 |

    | loadcontent | 在 init 中调用 |

    | makemap | 在 loadcontent 中调用 |

    | checkit | 在 makemap 中调用 |

    | dist | 在 checkit 中调用 |


    5-5. 第二个门户应用的完整代码


    | 代码行 | 描述 |

    | --- | --- |


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>点击地图</title>

    <meta charset="UTF-8">

    <style>

    body{font-family:Georgia,serif;}

    header{display:block;}

    #answer{display:block;}

    video{display:block;}

    audio{display:block;}

    canvas{display:block;}

    </style>

    <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY"></script>

    <script>

    var content = [];

