    # Who Is This Book For?


    I do believe my explanations are complete, but I am not claiming, as I did for
    my previous book, The Essential Guide to HTML5, that this book is for the total
    beginner. This book is for the developer who has some knowledge of programming
    and who wants to build (more) substantial applications by combining basic features
    and combining JavaScript with other technologies. It can also serve as an idea
    book for someone working with programmers to get an understanding of what is possible.


    # How Is This Book Structured?


    This book consists of ten chapters, each organized around an application or type
    of application. You can skip around. However, it probably makes sense to read
    Chapter 4 before 5 or 6. Also, the PHP server-side language is used in a simple
    way in Chapter 6 and then more fully in Chapter 10. Other cross-references are
    indicated in the text. Each chapter starts with an introduction to the application,
    with screenshots of the applications in use. In several cases, the differences
    between browsers are shown. The chapters continue with a discussion of the critical
    requirements, where concepts are introduced before diving into the technical details.
    The next sections describe how the requirements are satisfied, with specific constructs
    in HTML5, JavaScript, PHP, and/or SQL, and with standard programming techniques.
    I then show the application coding line by line with comments. Each chapter ends
    with instructions and tips for testing and uploading the application to a server,
    and a summary of what you learned. The code (with certain exceptions noted for
    Chapter 10) is all included as downloads available from the publisher. In addition,
    the figures are available as full-color TIFF files. Of course, you will want to
    use your own media for the projects shown in the book.


    # CHAPTER 1


    # Building the HTML5 Logo – Drawing on Canvas, with Scaling, and Semantic Tags


    In this chapter, we will review


    - Drawing paths on a canvas

    - Placing text on canvas

    - Coordinate transformations

    - Fonts for text drawn on canvas and in other elements

    - Semantic tags

    - The range input element


    # Introduction:


    The project for this chapter is a presentation of the official HTML5 logo, with
    accompanying text. The shield and letters of the logo are drawn on a canvas and
    the accompanying text demonstrates the use of semantic tags. The viewer can change
    the size of the logo using a slider input device. It is an appropriate start to
    this book, a collection of projects making use of HTML5, JavaScript and other
    technologies, because of the subject matter and because it serves as a good review
    of basic event-driven programming. The way I developed the project, building on
    the work of others, is typical of how most of us work. In particular, the circumstances
    provide motivation for coordinate transformations. Lastly, at the time of writing,
    Firefox does not fully implement the slider element. Unfortunately, this also
    is a common situation and I will discuss the implications. The approach of this
    book is to explain HTML5, Cascading Style Sheets and JavaScript in the context
    of specific examples. The projects represent a variety of applications and, hopefully,
    you will find something in each one you will learn and adapt for your purposes.


    Note If you need an introduction to programming using HTML5 and JavaScript, you
    can consult my book the Essential Guide to HTML5 or other books published by Après
    or others. There is also considerable material available online.


    Figure 1-1 shows the opening screen for the logo project on the Chrome browser.
    (Skip ahead to Figure 1-3 for the appearance on Firefox.)


    ![](img/e32356ef35161e47bae71aaac696664f_16_0.png)


    > Note: slider treated as text field in some browsers.

    Built on work by Daniel Davis, et al., but don''t blame them for the fonts. Check
    out the use of font-family in the style element and the formally variable in the
    script element for safe ways to do forms. I did the scaling. Note also use of
    semantic elements.


    HTML5 Logo by W3C.

