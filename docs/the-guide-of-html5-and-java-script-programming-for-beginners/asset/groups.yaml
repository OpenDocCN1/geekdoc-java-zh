    ```

    codecs="avc1.42E01E, mp4a.40.2">


    <source src="joshuahemerun.webmvp8.webm" type=''video/webm''

    codec="vp8, verbis">


    <source src="joshuahemerun.theora.ogv" type=''video/ogg''

    codecs="theora, verbis">


    Your browser does not accept the video tag. </video>


    <button id="revbtn" onclick="reverse();">Reverse </button><br>


    <canvas id="canvas">


    This browser doesn''t support the HTML5 canvas element.

    </canvas>


    </body>

    ```


    Style directives will change the location of the three elements: video, canvas,
    and button.


    In the init function invoked when the document is loaded, the following statements
    set the dimensions of the canvas to match the dimensions of the window:


    ```

    canvas1 = document.getElementById(''canvas'');


    ctx = canvas1.getContext(''2d'');

    ```


    ```

    canvas1.width = window.innerWidth;


    cwidth = canvas1.width;


    canvas1.height = window.innerHeight;


    height = canvas1.height;

    ```


    These statements also set variables that will be used later. So the task of adapting
    the canvas to the window is accomplished.


    Now the next task takes more thought. How much do I want to adapt the video to
    the window dimensions? I decided that I would reduce the video width and height
    to one-third of the original width and height in all situations. However, I would
    reduce it further if the window were very small. Math.min method returns the smallest
    of its operands, so the statements


    ```

    v = document.getElementById("vid");


    v.width = Math.min(v.videoWidth/3,5*width);


    v.height = Math.min(v.videoHeight/3,5*height);

    ```


    start by setting the variable v to point to the video element, which you can see
    I coded in the body to have the id "vid". It then sets the width of the video
    to either one-third of the original, intrinsic width of the video clip or to half
    the width of the canvas, whichever is less. The next statement does the same for
    the height of the video. This approach does not make the video clip proportional
    to the canvas. When you are working on this or another application, you will need
    to decide the approach you want to take.


    Certain other variables are set in the **init** function and used for the drawing
    of the box and for the mask. The code is


    ```

    videow = v.width;

    videoh = v.height;

    ballrad = Math.min(50,.5*videow,.5*videoh);

    maskkrad = .4*Math.min(videow,videoh); ctx.lineWidth = ballrad;

    ```


    The **ballrad** variable is inherited from the previous applications. It is the
    radius of the ball, assuming the video height and width are equal and less than
    50 pixels. Its use in the videbounce applications is to set the width of the line
    to draw the box. The radius of the hole in the mask is set to .4 of the minimum
    of the width and height of the video. You certainly can experiment with these
    values and also experiment with the shape of the mask.


    # Animation


    Animation is the trick by which still images are presented in succession fast
    enough that our eye and brain interprets what we see as motion. The exact mechanics
    of how things are drawn will be explained in the next two sections. Keep in mind
    that there are two animations going on: the presentation of the video and the
    location of the video in the box. In this section, I talk about the location of
    the video in the box.


    The way to get animation in HTML and JavaScript is to use the `setInterval` function.
    This function is called with two parameters. The first is the name of a function
    that we want to call and the second indicates the length of the time interval
    between each call to the function. The unit of time is milliseconds.


    The following statement, which is in the `init` function, sets up the animation:


    ```

    setInterval(drawscene,50);

    ```


    `drawscene` refers to a function that will do all the work. The 50 stands for
    50 milliseconds. This means that every 50 milliseconds (or 20 times per second),
    the `drawscene` function will be invoked. Presumably, `drawscene` will do what
    needs to be done to display something showing the video clip at a new location.
    You can experiment with interval duration.


    If you want to enhance this application or build another one in which it makes
    sense to stop the animation, you would declare a local variable for the setInterval
    call (let''s call it tid) and use the statement


    ```

    tid = setInterval(drawscene,50);

    ```


    At the point when you need to stop the animation, or more formally, stop the interval-timing
    event, you code


    ```

    clearInterval(tid);

    ```


    If you have more than one timing event, you would assign the output for each of
    them to a new variable. Be careful not to call setInterval multiple times with
    the same function. Doing so has the effect of adding new timing events and invoking
    the function multiple times.


    Much of the details of the drawscene function will be described in the next sections.
    However, two critical tasks are erasing the canvas and then determining the next
    position of the video clip. The statement for erasing the whole canvas is


    ```

    ctx.clearRect(0,0,width,cheight);

    ```


    Notice that it makes use of the width and height. The simulation of bouncing is
