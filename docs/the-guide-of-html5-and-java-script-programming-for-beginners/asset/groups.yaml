  - '[PAGE 299]


    # Project History and Critical Requirements


    A senior at Purchase College had collected and made video clips and photographs
    about the ethnic neighborhoods of Queens, New York, and wanted a way to present
    the work. The Google Maps API and the new facilities in HTML5 seemed perfect for
    the task. Keep in mind that the student only needed a way to present the work
    on a computer set up at the senior project show, so the issue of noncompliant
    browsers was not a concern. The critical requirements include what is supplied
    by the Google Maps API. As you learned in the previous chapter, we can write code
    to access a map centered at a specified geographic location, set at an initial
    zoom level, and showing views of roads or satellite terrain or a hybrid. In addition,
    the API provides a way to respond to the event of the viewer clicking the map.
    We need a way to define specific locations to be compared with the location corresponding
    to the viewer''s click.


    My first system for the student just used video and images. I later decided to
    add the image-and-audio combination. The critical requirement for the application
    is displaying and playing the designated media at the correct time and stopping
    and removing the media when appropriate, such as when it is time for the next
    presentation.


    After developing the initial project, I thought of changes. The first one was
    the addition of the image-and-audio combination. I decided I did not want'
  - '[PAGE 300]


    audio just by itself. The next change was to separate the specific content from
    the general coding. This, in turn, required a way to create markup for video and
    audio elements dynamically.


    I always like games and lessons, and it seemed like a natural step to build an
    application with questions or prompts that the viewer—now best described as player
    or student. The player gives the answer by finding the right position on the map.
    Both the general application and the quiz application have a requirement to define
    a tolerance with respect to the answers. The viewer/player/student cannot be expected
    to click exactly on the correct spot.


    When testing the quiz, I realized I needed some way to help the player get past
    a particularly difficult question. Because I am a teacher, I decided to show the
    player the answer, rather than just skipping the question. However, as I indicated
    earlier, you may be able to devise a better way to produce hints.


    Games should have some randomness feature, so I decided to shuffle the questions,
    though I did this somewhat later in the process.


    Having described the critical requirements, the next section will contain explanation
    of the specific HTML5 features that can be used to build the projects.'
  - '[PAGE 301]


    # HTML5, CSS, and JavaScript Features


    Like the map maker project in Chapter 4, these projects are implemented by combining
    the use of the Google Maps API with features of HTML5. The combination for this
    project is not as tricky. The map stays on the left side of the window and the
    media is presented on the right. I will review quickly how to get access to a
    map and how to set up the event handling, and then go on to the HTML5, CSS, and
    JavaScript features for satisfying the rest of the critical requirements.'
