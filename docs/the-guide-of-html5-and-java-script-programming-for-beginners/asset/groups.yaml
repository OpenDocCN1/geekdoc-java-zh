    ![](img/e32356ef35161e47bae71aaac696664f_224_0.png)


    Figure 4-13. Decimal results for query to Wolfram Alpha


    Notice that the longitude still appears with W for West as opposed to the negative
    value given by Google Maps.


    Doing what I call “going in the opposite direction,” you can put latitude and'
