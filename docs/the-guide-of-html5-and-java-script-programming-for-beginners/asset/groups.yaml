    # 图 1-1. HTML5 Logo 启动界面


    注意滑块功能、随附文本（其中包含一个看似链接的内容）以及黄色线条下方页脚中的文本。页脚也包含一个链接。正如我后将解释的，页脚及其他语义元素的功能和格式完全由我决定，但为
    Logo 的所有者万维网联盟（The World Wide Web Consortium）提供引用是恰当的。


    可以使用滑块更改 Logo 的大小。图 1-2 显示了调整滑块后的应用，此时 Logo 缩小到宽度和高度的三分之一。


    ![](img/e32356ef35161e47bae71aaac696664f_17_0.png)


    > 缩放比例：注意：在某些浏览器中，滑块被视为文本字段。

    > 基于 Daniel Davis 等人的工作，但字体不要归他们他们的。查看 style 元素中 `font-family` 的使用以及 script 元素中
    `fontfamily` 变量，这些是处理字体的方法。缩放是我完成的。还要注意语义元素的使用。


    由 W3C 提供的 HTML5 Logo。


    # 图 1-2. 缩小后的 Logo


    HTML5 的实现尚未被任何浏览器完成，而且事实证明，Firefox 将所有滑块输入视为简单的文本字段。这被称为“优雅降级”（graceful degradation），这确实比什么都不产生要好。图
    1-3 显示了 Firefox 中的启动界面。注意初始值显示为 100。


    # 图 1-3. 使用 Firefox 的应用程序


    正如每一章的惯做法，我现在解释应用程序的关键需求，这些需求在很大程度上独立于使用 HTML5 的事实，然后根据需要描述实现中将使用的 HTML5、JavaScript
    以及其他特性。“构建”（Building）部分包含一个带有每行代码注释的表格，以及如何构建类似应用程序的指导。“测试”（Testing）部分提供了上传和测试的细节。该部分对于某些项目比其他项目更关键。最后，有一个总结（Summary），回顾了所涵盖的编程概念并预览书中接下来的内容。


    # 项目历史与关键需求


    该项目的关键需求有些人为，并且不容易表述为与 HTML 独立的内容。例如，我想画出 Logo，而不是从网上复制图像。我的设计目标始终包括练习编程并为我的学生准备示例。Logo
    盾牌部分的形状似乎适合在画布上绘制，而 HTML 字母可以使用绘制文本功能完成。此外，绘制图像比使用图像文件有实际优势。单独的文件需要管理、存储和下载。图
    1-4 显示的图像为 90KB。持有程序代码的文件仅为 4KB。绘制 Logo 或图形意味着可以动态更改缩放和其他属性。


    ![](img/e32356ef35161e47bae71aaac696664f_20_0.png)


    # 图 1-4. Logo 图像


    我在网上查找并找到了在 Opera 工作的 Daniel Davis 制作的盾牌示例。这太棒了，因为这意味着我不需要测量 Logo 图像副本来获取坐标。这引出了他如何确定坐标的问题。我并不知道答案，尽管我们进行过愉快的邮件交流。一种可能性是下载图像并使用
    Adobe Photoshop 或 Corel Paint Shop Pro 等程序的网格功能。另一种可能性是使用（旧式的）透明网格纸。


    然而，在 Daniel Davis 的工作基础上进行构建存在问题。他的应用程序没有包含 HTML 字母。解决办法是将字母在在屏幕上定位，然后所谓的向下移动，以便使用
    Daniel 示例中提供的坐标对盾牌进行定位。“在屏幕上向下移动”的技术术语是执行坐标变换。因此，执行坐标变换的能力成为该项目的关键需求。


    我选择写一些关于 Logo 的内容，特别是以链接的形式给予荣誉和引用。我决定在文档底部的线条下方通过简短文本作为 Logo 官方来源的引用。对 Daniel
    Davis 的引用是正文写作的一部分。我们在字体选择上交换了意见，我将在下一节中详细讨论这一点。


    为了让观众对 Logo 做些什么，我决定提供一种更改大小的方法。实现此目的的良好设备是指定了最小值、最大值和步进的滑块。因此，该应用程序的关键需求包括在特定字体中绘制形状和字母、坐标变换、带有带有主部分和页脚部分的文档格式，以及包含链接。


    # HTML5、CSS 和 JavaScript 特性


    假设你（读者）对 HTML 和文档有一定经验。HTML5 最重要的新特性之一是用于绘制的 `canvas` 元素。我简要描述了适当颜色的填充路径和填充文本的绘制。接下来，我描述了坐标变换，它在项目中用于
    Logo 本身的两个部分以及整个 Logo 的缩放和大小更改。最后，我描述了 `range` 输入元素。它产生了滑块。


    # 在画布上绘制路径


    `canvas` 是 HTML5 引入的一种元素类型。所有 `canvas` 元素都有一个属性（或属性）称为 `2D context`。


    ```javascript

    const ctx = document.getElementById(''canvas'').getContext(''2d'');

    ```


    理解 `canvas` 是一个位图很重要，一旦你绘制了东西，画布就会“忘记”它画了什么；它只知道像素。要更改绘制，必须清除画布并重新绘制。画布的坐标系是笛卡尔坐标系，(0,0）位于左上角。当你向右移动时，x
    轴增加；当你向下移动时，y 轴增加。


    绘制线，使用以下方法：


    ```javascript

    ctx.beginPath();

    ctx.moveTo(10, 10);

    ctx.lineTo(100, 100);

    ctx.stroke();

    ```


    绘制圆，使用 `arc` 方法：


    ```javascript

    ctx.beginPath();

    ctx.arc(75, 75, 50, 0, 2 * Math.PI);

    ctx.stroke();

    ```


    绘制矩形，使用 `fillRect` 或 `strokeRect` 方法：


    ```javascript

    ctx.fillRect(20, 20, 150, 100);

    ```


    # 图 1-5. 绘制路径序列


    图中，我选择了以下代码来绘制盾牌：


    ```javascript

    ctx.fillStyle = "#E34C26";

    ctx.beginPath();

    ctx.moveTo(39, 250);

    ctx.lineTo(17, 0);

    ctx.lineTo(62, 0);

    ctx.lineTo(239, 250);

    ctx.lineTo(139, 278);

    ctx.closePath();

    ctx.fill();

    ```

