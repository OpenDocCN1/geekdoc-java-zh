  - '[PAGE 219]


    # Latitude & Longitude and Other Critical Requirements


    The most fundamental requirement for this project, and the ones in the next chapters,
    is an understanding of the coordinate system for geography. Just as a coordinate
    system is required for specifying points on a canvas or positions on the screen,
    it is necessary to use a system for places on planet earth. The latitude and longitude
    system has been developed and standardized over the last several hundred years.
    The values are angles, with latitude indicating degrees from the equator and longitude
    indicating degrees from the Greenwich prime meridian in the United Kingdom. The
    latter is an arbitrary choice that became standard in the late 1800s. There is
    a northern hemisphere bias here: latitude values go from 0 degrees at the equator
    to 90 degrees at the North Pole and –90 degrees at the South Pole. Similarly,
    longitude values are positive going east from the Greenwich prime meridian and
    negative going west. Latitudes are often called parallels and typically appear
    as horizontal lines, and longitudes are called meridians and typically appear
    as verticals. This orientation is arbitrary, but fairly solidly established.


    I will use decimal values, which is the default displayed in Google Maps, but
    you will see combinations of degree, minute (1/60 of a degree), and second (1/60
    of a minute). It is not necessary that you memorize latitude longitude'
  - '[PAGE 220]


    values, but it is beneficial to develop some intuitive sense of the system. You
    can do this by doing what I call “going both ways.” First, identify and compare
    latitude longitude values for places you know, second, pick values and see what
    they are. For example, the base values for my version of the project are as follows:


    +   - [40.725592–74.00495, “friends of ED, NYC"]


    +   - [41.04796–73.70539, “Purchase College/SUNY"]


    +   - [41.878928–87.641926, “Illinois Institute of Technology"]


    The first thing to notice is that the latitude values are fairly close and the
    longitude values are negative and not quite close. The friends of ED office in
    New York City is within 1 degree of latitude and 1 degree of longitude of Purchase
    College. The distance according to Google Maps is 27.4 miles. The longitude value
    for Illinois Institute of Technology is more negative indicating that it''s more
    westerly than the two New York State locations. all makes sense, but you need
    to take the time to think it through.


    There are many ways to find the latitude and longitude of a specific location.
    You can use Google Maps as follows:


    +   1. Invoke Google Maps (go to www.google.com and click Maps or go to'
  - '[PAGE 221]


    http://maps.google.com).


    +   2. At the upper right, click the gear icon for a drop-down menu. Click the
    Maps Labs option. A window will appear titled Google Maps Labs. Scroll down to
    the LatLng Marker option and click the circle to Enable. If you sign in, all settings
    will remain in force the next time you sign in. Save and close the window.


    +   3. Type in the location you are interested in into the location field.


    +   4. Right/Ctrl+click the location to get a drop-down menu, as shown in Figure
    4-10.


    +   5. Click Drop LatLng marker to get the result shown in Figure 4-11.'
  - '[PAGE 222]


