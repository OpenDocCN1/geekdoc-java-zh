  - '[PAGE 60]


    # Critical Requirements


    The critical requirements for this project include constructing a framework for
    manipulating objects on the screen, including detecting mouse events on the objects,
    deleting objects and creating copies of objects. The current framework provides
    a way to specify rectangles, ovals, hearts and images, but the approach can accommodate
    other shapes and this is an important lesson of the chapter.


    The objective is for the drag and drop operations to be reasonably precise: not
    merely moving something from one region of the window to another. I will revisit
    this topic in the Chapters 8 and 9 on making jigsaw puzzles.


    I also made the decision to control the look of the cursor. The cursor when the
    mouse is not on the canvas is the standard arrow. When on the canvas element,
    the cursor will be the cross-hairs. When the user presses down on the mouse button
    and drags an object, the cursor changes to a hand with pointer finger.


    When the work is complete, it is a natural desire to save it, perhaps as an image
    file, so this also is a requirement for the project.'
  - '[PAGE 61]


    # HTML5, CSS, and JavaScript features


    We now explore the features of HTML5 and JavaScript that are used for the Family
    Collage project. The idea is to maintain a list of the material on the canvas.
    This list will be a JavaScript array. The information will include the position
    of each item, how it is to be drawn on the canvas and how to determine if the
    mouse cursor is on the item.'
  - '[PAGE 62]


    # JavaScript objects


    Object oriented programming is a standard of computer science and a critical part
    of most programming languages. Objects have attributes, also called properties,
    and methods. A method is a function. Put another way, an object has data and code
    that may make use of the data. HTML and JavaScript have many built-in objects,
    such as document and window and also arrays and strings. For the Family Picture
    project, I make use of a basic facility in JavaScript (established before HTML5)
    for defining my own objects. These are called user-defined objects, but the term
    I and others prefer programmer-defined objects. This is an important distinction
    for the Family Collage project in which you, the programmer, may create an application,
    with pictures and other shapes you identify and design, and then offer it to a
    family member to use.


