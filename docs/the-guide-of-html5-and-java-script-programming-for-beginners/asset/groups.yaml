    下一章描述了另一个使用 Google Maps 的项目。你将学习如何构建一个应用程序，你可以将图片、视频片段或图片与音频片段的组合与特定的地理位置相关联，并在用户点击地图上或地图附近的位置时，显示并播放指定的媒体。


