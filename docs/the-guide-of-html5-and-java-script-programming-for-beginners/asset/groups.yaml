    You need to decide on your set of base locations. Again, there is nothing special
    about three. If your base list is too large, you may consider using <optgroup>
    to produce a drop-down list. In any case, you need to define a set of locations.
    Each location has two numbers—latitude and longitude—and a string of text comprising
    the name. This text is repeated in the HTML coding in the form.


    # Testing and Uploading the Application


    This project consists of the HTML file and three image files. For my version of
    the project, the image files were the lightbulb, **light.gif**; the red x, **rxmarker.png**;
    and the black x, **bxmarker.png**. There is nothing special about these image
    file types. You can use whatever you like. It could be argued that x markers are
    too tiny, so think about your customers when deciding what to do.


    This application does require you to be online to test since that is the only
    way to make contact with Google Maps.


    # Summary


    In this chapter, you learned how to do the following:


    - Use the Google Maps API

    - Combine Google Maps with canvas graphics

    - Produce a GUI that includes Google Maps events and HTML5 events

    - Draw using the alpha setting controlling transparency/opacity

    - Change to a custom-made cursor

    - Calculate distances between geographic points

    - Round off decimal values for suitable display


    The next chapter describes another project using Google Maps. You will learn how
    to build an application in which you can associate a picture, a video clip, or
    a picture-and-audio-clip combination with specific geographic locations, and display
    and play the specified media when a user clicks at or near the locations on a
    map.


    # CHAPTER 5


    # Map Portal: Using Google Maps to Access Your Media:


    In this chapter, you will explore the following:


    - Using the Google Maps API to play and display video, audio, and images

    - Creating HTML5 markup dynamically

    - Separating the program from descriptions of content

    - Building a geography game


    # Introduction:


    The projects in this chapter make use of the Google Maps API as a way to play
    video, display images, or play audio *and* display an image, all based on geographic
    locations. You can use these projects as models to build a study of a geographic
    area, report on a business or vacation trip, or create a geography quiz. I will
    describe three distinct applications. For all three applications, I have acquired
    media, such as video files, audio files, and image files, and I have defined in
    code an association between the files and specific geographic locations. To give
    you an idea of what I mean, for my projects, associations between a target location
    (which is given in latitude and longitude coordinates in the code) and media are
    shown in Table 5-1.


    Table 5-1. Outline of Content


    | Description of Location | Media |

    | --- | --- |

    | Purchase College | Video from robotics class |

    | Mount Kisco | Picture of Esther and an audio file of her playing piano |

    | Dixon, Illinois | Picture of Aviva |


    # Statue of Liberty, New York City Video of fireworks


    All three applications proceed smoothly with the different types of media. This
    is due to the features of HTML5 and, I say modestly, my programming. The media
    files are separate and the same for all three applications.


    The first application, consisting of one HTML file, named mapvideos.html, invites
    the viewer to click the map. If the click is close enough to one of the locations,
    the viewer either sees the corresponding image, sees the corresponding video,
    or both sees the corresponding audio file. The program handles all three types
    of media.


    The second application appears to the viewer to be the same as the first, but
    there is an important difference in the implementation. This application consists
    of two files: mapmediabase.html and mediacontext.js. The mediacontext.js file
    holds the information describing the specific media content of the application.
    The mapmediabase.html program brings in the mediacontext.js file and creates during
    runtime what is necessary to replicate the first application.


    I include both the first and second application because the first one is easier
    to understand, since all the information is in one place. When you develop your
    own applications, you can try to go straight to an implementation that separates
    coding from content, but don''t feel too bad if you don''t. The third application
    is a quiz. Like the second, it consists of two files: mapmediaquiz.html and mediaquizcontent.js.
    The mediaquizcontent.js file contains information connecting the media to the
    locations and also contains the text for the questions.


    The three applications have much of the same coding. The process of creating the
    second and third applications will show you how to scale up your applications
    by separating the details of a specific set of media (or other things) from the
    bulk of the program.


