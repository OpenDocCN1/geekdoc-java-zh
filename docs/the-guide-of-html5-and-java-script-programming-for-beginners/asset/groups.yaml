    ## Shuffling


    The algorithm determines a random location. Since I need to keep the arrays in
    parallel, the swap operation must be made for each array. In the code that follows,
    you see


    ```javascript

    function shufflecontent() {

    var i=content.length-1;

    var s;

    var hold;

    var holdq; while(i>0) {

    s = Math.floor(Math.random()*(i+1));

    hold = content[s]; content[s]=content[i];

    content[i] = hold; holdq = questions[s];

    questions[s]=questions[i];

    questions[i] = holdq;

    i--;

    }

    }

    ```


