    ## Building the Application and Making Your Own


    The first and critical step in making the application your own is to decide on
    the content. You can choose to not implement the first application, mapvideos,
    which has the content hard-coded, so to speak, with all the other coding. Again,
    I included it because I wrote it first and it is the easiest to understand. I
    strongly believe that most people would develop something like it, and then possibly
    decide to separate content from coding. You may go straight to mapmediabase or
    mapmediaquiz if you like.


    ## The Mapvideos Application


    The mapvideos application sets up the combination of Google Maps functionality
    with HTML5 coding for video, audio, and pictures on canvas. The canvas is not
    on top of the map. A quick summary of the application follows:


    - init: Performs initialization, including invoking makemap for bringing in the
    map. The init function constructs the content array using data constructed as
    references to elements in the body.

    - makemap: Brings in a map and sets up event handling, including the call to checkit.

    - checkit: Compares the clicked location with the locations described in the content
    array. If one is close enough, then the associated media is shown and played.

    - dist: Computes the distance between two locations.


    Table 5-2 outlines the functions in the mapvideos project. The function table
    describing the invoked/called by and calling relationships is similar for all
    the applications.


    | Function | Invoked/Called By | Calls |

    |---|---|--|

    | init | Invoked by action of the onLoad attribute in the <body> tag | makemap
    |

    | makemap | init | checkit |

    | checkit | makemap | dist |

    | dist | checkit | |

