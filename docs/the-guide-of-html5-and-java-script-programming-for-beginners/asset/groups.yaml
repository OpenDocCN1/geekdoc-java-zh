    shuffles the **content** array and the **questions** array, keeping the items
    in parallel. The shuffle algorithm I used is the same Fisher-Yates algorithm demonstrated
    in Chapter 10 of *The Essential Guide to HTML5*. See also **http://eli.thegreenplace.net/2010/05/28/the-intuition-**


    behind-fisher-yates-shuffling/**/ for an explanation on how the shuffling works.


    This algorithm determines a random location for each element. Since I need to
    keep the two arrays in parallel, the same swap operation must be made for each
    array. In the code that follows, you see that it is determined that the **s**
    and **i** elements are to change locations. Two variables, **hold** and **holdq**,
    are the extra places used in the swap operation.


    ```

    function shufflecontent() {

    \var i=content.length-1;

