    如果你汽车、手机或平板电脑上有全球定位系统（GPS）芯片，那么计算机程序确定位置的概念已非常普遍。GPS 芯片使用环绕地球的24颗卫星中的某些信息来确定位置。天空中的单颗卫星并不发送告诉我们在哪里的信息。相反，地面的
    GPS 设备接收来自多颗卫星的信号。设备使用当前时间和信号离开卫星的指定时间来计算每个信号的传输时间。利用这些传输时间计算与卫星的距离，并结合这些距离以及卫星的位置进行计算。使用三颗卫星可以确定纬度和经度；使用四颗卫星可以确定纬度、经度和高度。软件可以对代表地球的球体假设，但可能并不准确，正如我有一次使用
    GPS 时被“告知”我在布鲁克林桥匝道下一样。汽车或手机中的导航设备也可能利用存储在设备上的数据进行


