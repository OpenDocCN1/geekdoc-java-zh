  - '[PAGE 58]


    Figure 2-2. Sample final product: rearranged objects


    I decided on including a heart, not just for sentimental reasons, but because
    required me to use algebra and geometry. Don''t be afraid of mathematics. It is
    very useful. I invented, so to speak, a canonical heart. For other shapes, you
    may be able to find a standard definition in terms of mathematical expressions.


    In this situation, I created the set of objects and then I used the program to
    make a composition. You can plan your application to take family photographs or
    photographs categorized by another theme and some set of circles, ovals, rectangles,
    and hearts. When you are finished, you can offer this program for others to use.
    This is analogous to building a game program for players. The end-users for this
    application may be family members, friends, or colleagues.


    Of course, it certainly is possible to use a drawing program such as Adobe Photoshop
    or Corel Paint Shop Pro to create compositions such as these, but this application
    provides considerable ease-of-use for its specific purpose. The project also serves
    as a vehicle to learn important programming techniques as'
- md: "\nwell as features of HTML5 and JavaScript. And, as will be a continual refrain,\
    \ there are differences among the browsers to discuss.\n\n# Critical Requirements\n\
    \nThe critical requirements for this project include constructing a framework\
    \ for manipulating objects on the screen, including detecting mouse events on\
    \ the objects, deleting objects and creating copies of objects. The current framework\
    \ provides a way to specify rectangles, ovals, hearts and images, but the approach\
    \ can accommodate other shapes and this is an important lesson of the chapter.\n\
    \nThe objective is for the drag and drop operations to be reasonably precise:\
    \ not merely moving something from one region of the window to another. I will\
    \ revisit this topic in the Chapters 8 and 9 on making jigsaw puzzles.\n\nI also\
    \ made the decision to control the look of the cursor. The cursor when the mouse\
    \ is not on the canvas is the standard arrow. When on the canvas element, the\
    \ cursor will be the cross-hairs. When the user presses down on the mouse button\
    \ and drags an object, the cursor changes to a hand with pointer finger.\n\nWhen\
    \ the work is complete, it is a natural desire to save it, perhaps as an image\
    \ file, so this also is a requirement for the project.\n\n# HTML5, CSS, and JavaScript\
    \ features\n\nWe now explore the features of HTML5 and JavaScript that are used\
    \ for the Family Collage project. The idea is to maintain a list of the material\
    \ on the canvas. This list will be a JavaScript array. The information will include\
    \ the position of each item, how it is to be drawn on the canvas and how to determine\
    \ if the mouse cursor is on the item.\n\n# JavaScript objects\n\nObject oriented\
    \ programming is a standard of computer science and a critical part of most programming\
    \ languages. Objects have attributes, also called properties, and methods. A method\
    \ is a function. Put another way, an object has data and code that may make use\
    \ of the data. HTML and JavaScript have many built-in objects, such as document\
    \ and window and also arrays and strings. For the Family Picture project, I make\
    \ use of a basic facility in JavaScript (established before HTML5) for defining\
    \ my own objects. These are called user-defined objects, but the term I and others\
    \ prefer programmer-defined objects. This is an important distinction for the\
    \ Family Collage project in which you, the programmer, may create an application,\
    \ with pictures and other shapes you identify and design, and then offer it to\
    \ a family member to use.\n\nThe objective of this project is to set up a framework\
    \ for creating and manipulating different shapes on the canvas, keeping in mind\
    \ that once something is drawn to the canvas, its identity as a rectangle or image\
    \ is lost. The first step for each shape is to define what is called a constructor\
    \ function that stores the information that specifies the shape. The next step\
    \ is to define the methods, code for using the information to do what needs to\
    \ be done.\n\nMy approach gives the appearance of moving things on the canvas.\
    \ In fact, information kept in internal variables is changed and the canvas is\
    \ cleared new drawings made each time something happens to change the look of\
    \ the canvas.\n\nMy strategy is to define new types of objects, each of which\
    \ will have two methods defined:\n\n- **draw** for drawing the object on the canvas\n\
    - **overcheck** for determining if a given position, specifically the mouse position,\
    \ is on the object\n\nThese methods reference the attributes of the object and\
    \ use these values in mathematical expressions to produce the results. Once the\
    \ constructor functions are defined, values can be created as new instances of\
    \ these objects. An array called **stuff** holds all the object instances.\n\n\
    **Note** Object oriented programming in all its glory has a rich and often daunting\
    \ vocabulary. Classes are what define objects. I have hinted here at what is called\
    \ an interface. Classes can be subclasses of other classes and this may have been\
    \ useful for pictures and rectangles. I'm aiming for a more casual tone here.\
