    \ Picture and Heart. These will be what are called the constructor functions for\
    \ the Rect, Oval, Picture and Heart object instances. It is a convention to give\
    \ such functions names starting with capital letters.\n\nRect\n\nThe definition\
    \ of the Rect constructor function is:\n\n```javascript\nfunction Rect(x,y,w,h,c)\
    \ {\n  this.x = x;\n  this.y = y;\n  this.w = w;\n  this.h = h;\n  this.draw =\
    \ drawrect;\n  this.color = c;\n  this.overcheck = overrect;\n}\n```\n\nThe variable\
    \ r1 is created and initialized as follows:\n\n```javascript\nvar r1 = new Rect(10,10,50,50,\"\
    red\");\n```\n\nThe definition of the Oval constructor function is similar to\
    \ the Rect function:\n\n```javascript\nfunction Oval(x,y,r,hor,ver,c) {\n  this.x\
    \ = x;\n  this.y = y;\n  this.r = r;\n  this.radsq = r*r;\n  this.hor = hor;\n\
    \  this.ver = ver;\n  this.draw = drawoval;\n  this.color = c;\n  this.overcheck\
    \ = overoval;\n}\n```\n\nThe variable oval1 is created as follows:\n\n```javascript\n\
    var oval1 = new Oval(200,30,20,20,\"teal\");\n```\n\nIn contrast, the purple circle\
    \ is declared as follows:\n\n```javascript\nvar cir1 = new Oval(300,30,20,20,\"\
    purple\");\n```\n\n# Picture\n\nThe constructor for Picture objects stores position,\
    \ width and height, and the name of an Image object.\n\n```javascript\nfunction\
    \ Picture(x,y,w,h,imagename) {\n  this.x = x;\n  this.y = y;\n  this.w = w;\n\
    \  this.h = h;\n  this.imagename = imageName;\n  this.draw = drawpic;\n  this.overcheck\
    \ = overrect;\n}\n```\n\nMy example has four Picture objects. Here is code for\
