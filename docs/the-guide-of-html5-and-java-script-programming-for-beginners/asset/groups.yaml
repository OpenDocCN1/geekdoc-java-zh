    # 第 6 章


    # 我在哪里：使用地理定位、Google Maps API 和 PHP


    在本章中，你将学习以下内容：


    - 如何使用地理定位确定你的用户/客户/客户端的位置

    - 关于 Google Maps API 中的反向地理编码，用于查找给定经纬度的地址

    - 关于 Google Maps API 中某些操作的异步性质

    - 如何使用服务器端函数发送电子邮件


    # 引言


    本章的项目涉及 Google Maps API、地理定位和 PHP。我将描述两个应用程序：第一个仅用于演示地理定位，这是一项浏览器通过多种手段确定用户位置的功能。此应用程序让你发现你认为位置服务所在的地方，并将其与实际所在的位置进行比较。第二个应用程序提供了一种方法，让用户利用地理信息和其他数据生成电子邮件并发送给他人。这利用服务器端
    PHP 脚本来发送电子邮件，并使用 HTML5 验证来确认电子邮件地址。


    地理定位规范正与 HTML5 并行开发，并被视为一项独立的规范。它也与 Google Maps 不同，尽管 Google 位置服务是地理定位信息的来源之一。对位置数据进行的一种明显操作是显示
    Google Maps，但你可以对这些信息进行任何操作。


    地理定位规范的一个重要特性是，用户——即在客户端计算机上浏览网页的人——必须批准确定位置。这被称为所谓的“选择性加入”（opt-in）。屏幕的具体外观随不同的浏览器而异。术语也不同：一个特定的地址可能想要知道、跟踪或使用。它们都是一回事。图
