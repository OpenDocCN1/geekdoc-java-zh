    ## 计算距离并对显示数值进行舍入


    正如我们许多人所知，Google Maps 提供了距离信息，甚至区分了步行和开车。对于这个应用程序，我需要更精确地指定想要计算距离的两个位置，因此我决定在
    JavaScript 中开发一个函数。确定两个点（每个点代表纬度和经度值）之间的距离是使用球面余弦定理完成的。我的参考来源是 www.movable-type.co.uk/scripts/latlong.html。以下是代码：


    ```javascript

    function dist(point1, point2) {


    var R = 6371; // km


    // var R = 3959; // miles


    var lat1 = point1.lat()*Math.PI/180;


    var lat2 = point2.lat()*Math.PI/180 ;


    var lon1 = point1.lng()*Math.PI/180;


    var lon2 = point2.lng()*Math.PI/180;


    var d = Math.acos(Math.sin(lat1)*Math.sin(lat2) +

    Math.cos(lat1)*Math.cos(lat2) *

    Math.cos(lon2-lon1)) * R;


    return d;


    }

    ```


    **注意** 我在代码中没有包含很多注释，因为我附带了每一行注释的表格。然而，注释是非常重要的。我强烈建议在 `dist` 函数中保留关于 **km** 和
    **miles** 的注释，以便你可以根据需要调整程序。或者，你也可以显示这两个值，或者让用户进行选择。


    最后一个函数用于对数值进行舍入处理。当一个数量取决于人的鼠标移动时，你不应该显示带有过多小数位的值。然而，我们应该记住，纬度代表的是很大的单位。我决定让距离显示两位小数，而纬度显示四位。


    我写的这个函数是非常通用的。它接受两个参数，一个数字 **num** 和另一个数字 **places**，表示取值的小数位数。你可以在其他情况下使用它。它会通过添加我称之为
    *increment*（增量）的值，然后计算不大于该值的最大整数，从而适地进行向上或向下舍入。因此：


    - **round(9.147,2)** 将产生 9.15；而

    - **round(9.143, 2)** 将产生 9.14。


    代码的工作原理是首先确定我所说的 *factor*（因子），即 10 幂目标位数的次方。对于 2，这将是 100。然后我计算增量。对于两位小数，这将是 `5
    / 100 * 10`，即 `5 / 1,000`，即 `.005`。


