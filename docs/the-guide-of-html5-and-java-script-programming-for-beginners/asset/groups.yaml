    For the videbounceC application, the mask is on top of the video drawn on canvas
    because the two white filled-in paths are drawn after the drawImage statement
    draws a frame from the video. I achieve the same effect in the videbounceE application
    by specifying the z-index of the video element to be 0 and the z-index of the
    canvas to be 10. Remember that the z-axis is the axis that comes out of the screen.
    Higher values are closer to us and on top of lower values. The canvas with the
    z-index set to 10 is on top of the video element with the z-index set to 0. The
    next chapter, which demonstrates a spotlight moving on top of a map from Google
    Maps, will feature changing the z-index using JavaScript.'
  - '[PAGE 168]


    # User Interface


    The user interface for both versions of the videobounce project only includes
    one action for the user: the user can reverse the direction of travel. The button
    is defined by an element in the body:


    ```

    <button id="revbtn" onclick="reverse();">Reverse </button><br/>

    ```


    The effect of the onClick setting is to invoke the function named reverse. This
    function is defined to change the signs of the horizontal and vertical displacements:


    ```

    function reverse() { ballvx = -ballvx; ballvy = -ballvy;

    -}

    ```


    There is one important consideration for any user interface. You need to make
    sure it is visible. This is accomplished by the following style directive:


    ```

    #revbtn{position:absolute; z-index:20; }

    ```


    The z-index places the button on top of the canvas, which in turn is on top of
    the video.


    Having explained the individual HTML5, CSS, and JavaScript features that can be
    used to satisfy the critical requirements for bouncing video, I''ll now show the
    code in the two videobounce applications along with the code used to show the
    trajectory in Figure 3-2.'
