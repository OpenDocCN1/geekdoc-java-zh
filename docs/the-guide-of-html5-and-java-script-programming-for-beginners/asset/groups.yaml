    directions will be in proportion all the time. Yet another alternative, though
    I think this will be disconcerting, is to make reference to the window dimensions
    at each time interval and make changes in the canvas, and possibly the video,
    each time. There is an event that can be inserted into the body tag:


    ```

    <body onresize="changedims();" ... ... >

    ```


    This coding assumes that you have defined a function named changedims that includes
    some of the statements in the current init function to extract the window.innerWidth
    and window.innerHeight attributes to set the dimensions of the canvas and the
    video.


    More generally, the objective of this chapter is to show you ways to incorporate
    video into your projects in a dynamic fashion, both in terms of position on the
    screen and timing. In particular, it is possible to combine playing of video with
    drawings on a canvas for exciting effects.


    Screen savers exist in which the screen is filled up by a bouncing object similar
    to the trajectory program. You can change the drawscene function to produce different
    shapes. Also, as I mentioned before, you can apply the techniques explained in
    The Essential Guide to HTML5 to provide actions to the viewer. You can refer to
    Chapter 1 in this book for the use of a range input (slider). Yet another possibility
    is to provide the viewer a way to change the color of the circle (or other shape
    you design) using the input type of color.'
