    # 跳动的视频：HTML5 动画与遮罩


    ## 视频：


    在本章中，你将学习如何实现以下内容：


    - 通过画布上的不同位置绘制视频的当前帧来产生移动的视频片段

    - 通过重新定位文档中的视频元素来产生移动的视频片段

    - 对视频进行遮罩处理，使其在两种情况下看起来都像一个圆圈

    - 构建一个能够适应不同窗口大小的应用程序


    ## 引言


    本章的项目是显示一个在盒子里弹跳的球形状的视频片段。HTML5 的重要新特性之一是对视频（以及音频）的原生支持。Silvia Pfeiffer 写的《The
    Definitive Guide to HTML5 Video》（Apress, 2010）是一本非常好的参考书籍。本项目的挑战在于让视频片段在屏幕上移动。我将描述实现该应用程序的两种不同方法。截图并没有看出其中的区别。


    图 3-1 显示了该应用程序在 Opera 全窗口视图下的外观。视频是一个标准的矩形视频片段。由于我的代码编写，它看起来像一个球。你可以直接跳到图 3-8，了解为了跟随视频移动而创建的遮罩概念。所有图片都是动画的静态屏幕截图。你需要相信我的话，视频确实在盒子内移动并弹跳。


    ![](img/e32356ef35161e47bae71aaac696664f_133_0.png)


    图 3-1 屏幕截图，全窗口


    在所有情况下，当虚拟球撞击墙壁时，它似乎是从墙上反弹的。例如，如果虚拟球正在向屏幕右下方移动，当它撞击盒子的右侧时，它将向左移动但继续向下移动。当虚拟球随后撞击盒子的底墙时，它将向左弹跳，向屏幕上方移动。轨迹如图
    3-2 所示。为了制作图像，我将虚拟球改为简单的圆，并且没有编写在每个时间间隔清除画布的代码。你可以将其想象为定格摄影。改变虚拟球是必要的，因为它具有复杂性：一个来自视频片段的图像和一个全白的遮罩。我在“构建应用程序并将其个性化”部分中包含了轨迹程序的代码。


    ![](img/e32356ef35161e47bae71aaac696664f_134_0.png)


    图 3-2 虚拟球的轨迹


    如果我将浏览器窗口调得小一点并重新加载应用程序，代码将调整画布大小以产生图 3-3 所示：一个较小的盒子。


    图 3-3 较小窗口中的应用程序


    如果将窗口调得很小，这将强制视频片段本身以及画布和盒子的尺寸发生变化，如图 3–4 所示。


    ![](img/e32356ef35161e47bae71aaac696664f_137_0.png)


    图 3-4 窗口被调整为非常小


    应用程序会在 HTML 文档首次加载时，根据当时的窗口尺寸调整盒子的大小，可能还会调整虚拟视频球的大小。如果观众稍后在程序运行期间调整了窗口，画布和视频片段将不会调整大小。在这种情况下，你将看到类似图
    3-5 的效果，大窗口中的一个小盒子。


    图 3-5 运行期间调整窗口变大


    同样，如果你使用全尺寸窗口或任何大窗口启动应用程序，并在程序运行期间将其调整为较小尺寸，你将看到类似图 3-6 的效果，浏览器会显示滚动条以指示内容大于窗口。如果你选择不使用滚动条，那么视频片段将周期性地消失在视野之外然后重新出现。


    ![](img/e32356ef35161e47bae71aaac696664f_140_0.png)


    图 3-6 调整后的窗口


