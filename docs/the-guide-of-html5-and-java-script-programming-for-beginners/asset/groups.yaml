    \ Location Services）和其他地理定位应用已经确定了许多基站的位置并将信息存储在数据库中。如果范围内只有一个手机基站，那么非常粗略的估计就是该基站的位置。然而，如果你的电脑可以接收到多个基站的信号，它就可以计算出更准确的位置估计值。它利用基站不同的信号强度，而不是\
    \ GPS 卫星不同的信号传输时间，通过已知点的已知距离来计算你的位置。\n\n如果你的电脑没有 GPS 或手机无线电器，但通过短线连接到 Wi-Fi 无电器，那么浏览器可能可以使用附近\
    \ Wi-Fi 无电器的信号强度来确定位置。事实证明，某些公司（如谷歌位置服务）拥有许多 Wi-Fi 热点已知位置的数据库。即使 Wi-Fi 热点是私有且安全的，也可以确定其位置。谷歌、苹果以及可能的其他公司收集这些信息的做法存在争议。收集这些信息的一种方式是通过穿梭在街道上的面包车获取谷歌地图街景服务所需的图像。另一种方法是保留人们在使用手机某些应用程序时使用的数据，并将其转发给公司以添加到它们的数据库中。无论如何，这些数据库都被引用以为地理定位计算提供热点位置。你的电脑可以使用邻近热点的信号强度来估计与热点的距离，从数据库中获取它们的位置，并计算出自己的位置。当然，它的位置也会进入数据库，供其他计算使用！\n\
    \n注意：谷歌、苹果等公司声称收集的数据已去除了个人信息。我不同情秘密收集信息的公司。然而，我们确实需要接受，许多服务的提供并没有明确的按次付费。正如谚语/陈词所说，“一分钱分货”，我们还可以加上类似的话，“我们不付钱的东西，由大众或社区承担了负担。”\n\
    \n最后，如果你的电脑没有 GPS、手机或 Wi-Fi 无电器呢？IP 地址——在 Web 上识别你电脑的数字与组合——与纬度和经度值相关。如果电脑与局域网上的许多其他电脑共享\
    \ IP 地址，这种方法的效果就不理想——位置可能会偏差很大。然而，这种方法允许即使是孤立的电脑也能从已知电脑大致位置的应用程序中受益。我的经验是，我台式电脑上的浏览器没有使用\
    \ Wi-Fi，而是使用 IP 方法，或者在 Safari 的情况下，要么失败要么超时（请见下一节的超时选项）。相比之下，我家里笔记本电脑、iPhone 和\
    \ iPad 上的浏览器利用连接到我台式电脑的 Wi-Fi 网络，确实利用了 Wi-Fi 进行地理定位，结果要好得多。\n\n这些是确定位置的主要技术。W3C\
    \ 正在开发的地理定位标准为程序员访问信息（如果可用的话）确立了一系列方法、属性和事件。\n\n我的项目还利用了反向地理编码（reverse geocoding），即确定街道地址或关于位置的某种描述性信息。推测，谷歌位置服务和其他类似服务拥有关于与纬经度值相关的地理描述性术语的海量数据库——显然不是针对每个值，而是针对值的范围。下一节中描述的\
    \ HTML5 设施提供了提供了由反向地理编码产生的多个结果，你需要决定什么对你的应用程序是合适的。这取决于所在国家和世界的地区。\n\n这两个项目都需要对用户点击地图做出响应。这包括以一种方式标记位置，即使在移动或缩放地图时该标记依然存在。项目还计算了从基础位置到标记位置的距离。\n\
    \n发送电子邮件首先需要一种让用户输入电子邮件的方法。发送电子邮件超出了普通的 JavaScript 处理范围，因此为了满足这一要求，必须采取不同的方法——即在服务器上运行程序。回想\
    \ Web 的基本机制：文件（包括 HTML 文档）位于服务器站点。浏览器程序（如 Firefox 或 Opera）运行在所谓的“客户端电脑”上——即我的电脑，或者我们在家里、咖啡馆或图书馆里的你的电脑。浏览器程序从服务器获取文件并对其进行解释。要执行如发送电子邮件之类的服务器操作，浏览器必须调用运行在服务器上的程序。\n\
    \n在发送电子邮件之前，程序需要获取电子邮件地址、收件人地址（To）以便发送消息，以及发件人地址（From）以便回复正常工作。程序应该进行某种检查以确保地址有效。你会发现，收集和验证信息是在客户端电脑上完成的，就在你或你的用户面前的电脑上。处理和发送电子邮件是由运行在服务器上的\
