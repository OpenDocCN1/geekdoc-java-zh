    # The Quiz Application


    The third and last application for this chapter was a quiz. The implementation
    was built on the second application. It makes use of an external script file.
    Look back at the “External Script File” section for the contents. A quick summary
    of the application follows:


    +   1. **init**: Performs initialization, including the call to `loadcontent`.


    +   2. **loadcontent**: Uses the variables, most significantly the **precontent**
    array included in the external script element, to create new markup for the media.
    It also invokes `makemap`. The **questions** array does not need any more work.


    +   3. **makemap**: Brings in the map and sets up event handling, including the
    call to `checkit`.


    +   4. **shufflecontent**: Shuffles the **content** and **questions** arrays (keeping
    them in correspondence).


    +   5. **asknewquestion**: Displays the questions.


    +   6. **checkit**: Compares the clicked location with the location for this question.


    +   7. **dist**: Computes the distance between two locations.


    +   8. **giveup**: Brings in a new map centered at the location for the current
    question.'
