    So what happens if your computer does not have a GPS chip inside it, or is in
    a location from which it cannot receive satellite signals, but does have a cell
    phone radio and is in a cell phone service area? Another way to calculate position
    is to use the strengths of signals from one or more cell phone towers. Google
    Location Services and other geolocation applications have determined where many
    the towers are and have stored that information in databases. If only a single
    cell phone tower is in range, a very rough estimate is the location of that tower.
    However, if your computer can receive signals from several towers, then it can
    compute a much better estimate of your position. It uses the towers'' different
    signal strengths instead of GPS satellites'' different signal-travel times to
    compute your position by using known distances from known points.


    If your computer has no GPS or cell phone radios but does connect by a short wire
    to a Wi-Fi radio, then the browser may be able to determine its position using
    the strengths of signals from nearby Wi-Fi radios. It turns out that certain companies,
    such as Google Location Services, have databases with the known position of many,
    many Wi-Fi hot spots. The location of a Wi-Fi hot spot can be determined even
    if the hot spot is private and secure. The fact that Google, Apple, and probably
    other companies collect this information is controversial. One way of collecting
    the information has been through the vans that travel streets to get the images
    used for the Google Maps Street View service. Another way is to keep the data
    used when people use certain apps on their phones and forward it to the companies
    to add to their databases. In any case, these databases are referenced to provide
    hot spot positions for the geolocation calculations. Your computer can use the
    signal strengths of neighboring hot spots to estimate their distances from them,
    get their locations from the databases, and compute its own position. Of course,
    its'
  - '[PAGE 408]


    position goes into the databases for other calculations to use!

    Note Google, Apple, and others claim that data collected is stripped of personal
    information. I am not sympathetic to companies gathering information secretly.
    However, we do need to accept that many services are supplied for no explicit,
    per-use charge. To the adage/cliché, “you get what you pay for,” we may add something
    like, “The crowd or community bears a burden for what we don’t pay for.”


    Lastly, what if your computer has no GPS, cell phone, or Wi-Fi radio? The IP address—the-number
    combination that identifies your computer on the Web—is associated with a latitude
    and longitude value. It does not work well—the positions may be way off—if the
    computer shares an IP address with many others on a local network. However, this
    method allows the use of even an isolated computer to benefit from applications
    knowing the approximate position of your computer. My experience has been that
    the browsers on my desktop computer did not use Wi-Fi, but used the IP method,
    or, in the case of Safari, either failed or timed out (see the next section for
    the timeout option). In contrast, browsers on laptops and iPhones and iPads in
    my house, making use of the Wi-Fi network attached to my desktop computer, did
    make use of Wi-Fi for geolocation, with much better results.


    These are the major technologies for determining position. The geolocation standard
    under development by the W3C establishes methods, attributes, and events for the
    use of programmers to access the information, if available.


    My projects also make use of reverse geocoding, determining a street address or
    some sort of descriptive information about the position. Presumably, Google Location
    Services and other similar services have extensive databases on geographically
    descriptive terms associated with latitude and longitude values—not each value,
    certainly, but ranges of values. The HTML5 facility described in the next section
    provides several results produced by reverse geocoding, and you need to decide
    what is appropriate for your application. It will be dependent on the region of
    the country and the world.'
  - '[PAGE 409]


    Both projects require a response to the user clicking the map. This includes marking
    the position in a way that persists even when the map is moved or scaled. The
    projects also calculate the distance from the base location to the marked location.


    Sending e-mail requires first all a way for the user to enter the e-mail address.
    Sending e-mail is something beyond normal JavaScript processing, so to fulfill
    this requirement, it will be necessary to do something different—namely, to run
    a program on the server. Recall the basic mechanism of the Web is that files,
    including HTML documents, are located on server sites. A browser program, such
    as Firefox or Opera, runs on what is called the client computer—my computer or
    your computer in our house or at the coffee shop or library. The browser program
    fetches files from the server and interprets them. To perform a server operation
    such as sending e-mail, the browser must invoke a program running on the server.


    Prior to sending the e-mail, the program needs to get the e-mail addresses, the
    To address to know where to send the message, and the From address so that reply
    will work. The program should do some sort of checking to make sure the addresses
    are valid. You will see that collecting and validating the information is done
    on the client computer, the one right in front of you or your user. Processing
    the e-mail and sending it are done by a PHP program running on the server, the
    computer holding the files for the project.


    These are the requirements to build the projects demonstrated in the “Introduction”
    section. In the next section, I’ll describe the HTML5 and PHP features to implement
    the projects.'
