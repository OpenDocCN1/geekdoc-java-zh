    Firefox treats all slider inputs as simple text fields. This is termed ''graceful
    degradation'' and it certainly is better than producing nothing at all. Figure
    1-3 shows the opening screen in Firefox. Notice the initial value is displayed
    as 100.'
  - '[PAGE 19]


    # Figure 1-3. Application using Firefox


    As will be the practice in each chapter, I now explain the critical requirements
    of the application, more or less independent of the fact that the implementation
    will be in HTML5, and then describe the features of HTML5, JavaScript, and other
    technologies as needed that will be used in the implementation. The Building section
    includes a table with comments for each line of code and also guidance for building
    similar applications. The Testing section provides details for uploading and testing.
    This section is more critical for some projects than others. Lastly, there is
    a Summary that reviews the programming concepts covered and previews what is next
    in the book.'
  - '[PAGE 20]


    # Project History and Critical Requirements


    The critical requirements for this project are somewhat artificial and not easily
    stated as something separate from HTML. For example, I wanted to draw the logo
    as opposed to copying an image from the Web. My design objectives always include
    wanting to practice programming and prepare examples for my students. The shape
    of the shield part of the logo seemed amenable to drawing on canvas and the HTML
    letters could be done using the draw text feature. In addition, there are practical
    advantages to drawing images instead of using image files. Separate files need
    to be managed, stored, and downloaded. The image shown in Figure 1-4 is 90KB.
    The file holding the code for the program is only 4KB. Drawing a logo or other
    graphic means that the scale and other attributes can be changed dynamically


    ![](img/e32356ef35161e47bae71aaac696664f_20_0.png)'
  - '[PAGE 21]


    # Figure 1-4. Image of logo


    I looked online and found an example of just the shield done by Daniel Davis,
    who works for Opera. This was great because it meant that I did not have to measure
    a copy of the logo image to get the coordinates. This begs the question of how
    he determined the coordinates. I don''t know the answer, even though we had a
    pleasant exchange of emails. One possibility is to download the image and use
    the grid feature of programs such as Adobe Photoshop or Corel Paint Shop Pro.
    Another possibility is to use (old-fashioned) transparent graph paper.


    However, there was a problem with building on Daniel Davis''s work. His application
    did not include the HTML letters. The solution to this was to position the letters
    on the screen and then move down so to speak to position the drawing of the shield
    using the coordinates provided in Daniel''s example. The technical term for ''moving
    down the screen'' is performing a coordinate transformation. So the ability to
    perform coordinate transformations became a critical requirement for this project.


    I chose to write something about the logo and, in particular, give credit and
    references in the form of hyperlinks. I made the decision to reference the official
    source of the logo as brief text at the bottom of the document below a line. The
    reference to Daniel Davis was part of the writing in the body. We exchanged notes
    on font choices and I will discuss that more in the next'
  - '[PAGE 22]


    section.


    In order to give the viewer something to do with the logo, I decided to present
    a means of changing the size. A good device for this is a slider with the minimum
    and maximum values and steps all specified. So the critical requirements for this
    application include drawing shapes and letters in a specific font, coordinate
    transformations, formatting a document with a main section and a footer section,
    and including hyperlinks.'
