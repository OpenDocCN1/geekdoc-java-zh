  - '[PAGE 157]


    # Video Drawn on Canvas


    As I mentioned previously, HTML5 does provide the facility to draw video on the
    canvas as one would draw an image. This actually is a misnomer. Video clips are
    made up of sequences of still images called frames. Frame rates vary but typically
    are15 to 32 frames per second, so you can understand that video files tend to
    be large. Video is stored using different types of encodings, each of which make
    different technical trade-offs in terms of quality and storage size. We do not
    need to be concerned with these technicalities, but can think of the video as
    a sequence of frames. Playing a video involves presenting the frames in sequence.
    What happens in the drawImage command is that the current frame of the video clip
    is the image drawn on the canvas. If this operation is performed through a timed
    interval event, then the viewer will see a frame at each interval of time. There
    is no guarantee that the images shown are successive frames from the video clip,
    but if done fast enough, the frames drawn


    will be close enough to the actual sequence that our eye and brain experience
    it as the live action of the video clip.


    The command in pseudocode


    ```

    ctx.drawImage(video element, x position, y position, width, height);

    ```


    This command, formally a method of the ctx canvas context, extracts the'
  - '[PAGE 158]


    image corresponding to the current frame of the video and draws it at the x and
    y values, with the indicated width and height. If the image does not have the
    specified width and height, the image is scaled. This will not occur for this
    situation.


    The goal is to make the traveling video clip resemble a ball. For this application,
    this means we want to mask out all but a circle in the center of the rectangular
    video clip. I accomplish this by creating a traveling mask. The mask is a drawing
    in the canvas. Since I want to place the video element on the canvas element,
    and also position a shape created by a path on top of the image drawn from the
    video clip, I use CSS directives to make both video and canvas can be positioned
    using absolute positioning. I want the Reverse button to be on top of the canvas.
    These directives do the trick:


    ```

    #vid {position:absolute; display:none; }

    ```


    ```

    #canvas {position:absolute; z-index:10; top:0px; left:0px;} #revbtn {position:absolute;
    z-index:20; }

    ```


    A way to remember how the layering works is to think of the z-axis out of the
    screen. Elements at higher values are on top of elements set at lower values.
    The top and left properties of the canvas are each set to 0 pixels to position
    the upper-left corner of the canvas in the upper-left corner of the window.


    Note When the z-index is referenced or modified in JavaScript, its name is zIndex.'
