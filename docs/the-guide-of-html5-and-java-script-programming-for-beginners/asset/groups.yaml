    # 测试与上传应用程序


    正如前面提到的，但值得重复的是，你需要获取合适的视频片段。在编写本书时，你需要使用如 Miro 等程序生成 WEBM、mp4、OGG 版本的视频，因为浏览器识别不同的视频编码（解码器）。这种情况可能会发生变化。同样，如果你只想为一个浏览器实现此功能，可以检查哪种视频编码适用于该浏览器，并只准备一个视频文件。视频文件和
    HTML 文件需要位于电脑上的同一个文件夹中，并且在你将此应用程序上传到服务器账户时，也需要位于服务器上的同一个文件夹中。或者，你可以在源元素中使用完整的网络地址或正确的相对地址。


    # 总结


    在本章中，你学习了操作视频的不同方法。这些方法包括：


    -   将视频的当前帧作为图像绘制在画布（canvas）上

    -   通过更改左上角的样式属性重新调整视频元素在屏幕上的位置

    -   使用样式指令对视频、画布和按钮进行层叠

    -   在画布上创建移动遮罩

    -   获取窗口尺寸信息以适应应用程序的不同情况


    下一章将向你展示如何在 HTML5 项目中使用 Google Maps 应用程序接口（API）。该项目将涉及使用画布并更改 z-index，以便画布交替位于
    Google Maps 生成的内容上方或下方。


    # 第 4 章


    # 地图制作：结合 Google Maps 与画布


    在本章中，你将学习如何执行以下操作：


    -   使用 Google Maps API 在特定位置显示地图

    -   使用透明度（也称为 alpha 或不透明度级别）和自定义光标图标在画布上绘制图形

    -   通过结合 Google Google Maps 和 HTML5 特性的使用，并管理事件和 z-index 级，为用户提供图形用户界面（GUI）

    -   计算两个地理位置之间的距离


    # 引言


    本章的项目是一个涉及地理地图的应用程序。现在的许多应用程序都涉及使用他人或其他组织提供的应用程序接口（API）。本章将介绍 Google Maps API
