    # Cursor


    The cursor—the small graphic that moves on the screen when you move the mouse—can
    be set in the style element or in JavaScript. There are several built-in choices
    for the graphic (e.g., crosshair, pointer), and we also can refer to our own designs
    for a custom-made cursor, which is what I demonstrate in this project. I included
    the statement


    ```javascript

    can.onmousedown = function () { return false; }

    ```


    in the init function to prevent a change to the default cursor when pressing down
    on the mouse. This may not be necessary since the default may not be triggered.


    To change the cursor for moving the mouse to something that conveyed a spotlight,
    I created a picture of a red compact fluorescent lightbulb and saved it in the
    file light.gif. I then used the following statement in the function showshadow.
    The showshadow function has been set as the event handler for mousemove:


    ```javascript

    can.style.cursor = "url(''light.gif''), pointer";

    ```


    To indicate that JavaScript should use that address for the image for the cursor
    when on top of the can element. Furthermore, if the file ''light.gif'' is not
    available, the statement directs JavaScript to use the built-in pointer icon.
    This is similar to the way that fonts can be specified with a priority listing
    of choices. The variable **can** has been set to reference the canvas element.
    The cursor will not be used when the canvas has been pushed under the Google Map,
    as will be discussed in the next section.


    # Events


    The handling of events—namely mouse events, but also events for changing the slider
    on the Google Map or clicking the radio buttons—seemed the most daunting when
    I started work on this project. However, the actual implementation turned out
    to be straightforward. In the init function, I write code to set up event handling
    for movement of the mouse, mouse button down, and mouse button up, all regarding
    the canvas element:


    ```javascript

    can.onmousedown = function () { return false; }

    can.addEventListener(''mousemove'',showshadow,true);

    can.addEventListener(''mousedown'',pushcanvasunder,true);

    can.addEventListener("mouseout",clearshadow,true);

    ```


    The true value for the third parameter indicates that this event is bubble, meaning
    that it is to signal other listeners. However, more work was needed to achieve
    the event handling I wanted for this project. I will explain the three functions
    and then go on to describe one more event.


    The showshadow function, as indicated previously, calls the drawshadowmask function.
    I could have combined these two functions, but dividing tasks into smaller tasks
    generally is a good practice. The showshadow function determines the mouse position,
    makes an adjustment so the lightbulb base is at the center of the spotlight, and
    then makes the call to drawshadowmask:


    ```javascript

    function showshadow(ev) {

    var mx;

    var my;

    if ( ev.layerX || ev.layerX == 0) {

    mx= ev.layerX;

    my = ev.layerY;

    }

    else if (ev.offsetX || ev.offsetX == 0) {

    mx = ev.offsetX;

    my = ev.offsetY;

    }

    can.style.cursor = "url(''light.gif''), pointer";

    mx = mx+10;

    my = my + 12;

    drawshadowmask(mx,my);

    }

    ```


    Now I needed to think what I wanted to do when the user pressed down on the mouse.
    I decided that I wanted the shadow to go away and the map to be displayed in its
    full brightness. In addition to the appearance of things, I also wanted the Google
    Maps API to resume control. A critical reason for wanting the Google Maps API
    to take over is that I wanted to place a marker on the map, as opposed to the
    canvas, to mark a location. This is because I wanted the marker to move with the
    map, and that would be very difficult to do by drawing on the canvas. I would
    need to synchronize the marker on the canvas with panning and zooming of the map.
    Instead, the API does all this for me. In addition, I needed the Google Maps API
    to produce latitude and longitude values for the location.


    The way to put Google Maps back in control, so to speak, was “push the canvas
    under.” The function is


    ```javascript

    function pushcanvasunder(ev) {

    can.style.zIndex = 1;

    pl.style.zIndex = 100;

    }

    ```


    The operation of pushing the canvas under or bringing it back on top is not instantaneous.
    I am open to suggestions on (1) how to define the interface and (2) how to implement
    what you have defined. There is room for improvement here.


    One more situation to take care of is what I want to occur if and when the user
    moves the mouse off from the canvas? The mouseout event is available as something
    to be listened for, so I wrote the code setting up the event (see the can.addEventListener
    statements shown above) to be handled by the clearshadow function. The clearshadow
    function accomplishes just that: clearing the whole canvas, including the shadow:


    ```javascript

    function clearshadow(ev) {

    ctx.clearRect(0,0,600,400);

    }

    ```


    In the function that brings in the Google Map, I set up an event handler for mouseup
    for maps.


    ```javascript

    listener = google.maps.event.addEventListener(map, ''mouseup'', function(event)
    { checkit(event.LatLng); });

    ```


    The call to addListener, a method that is part of the Google Maps API as opposed
    to JavaScript proper, sets up the call to the checkit function. The checkit function
    is invoked using the event object as a parameter. As you can guess, event.LatLng
    is the latitude and longitude values at the position of the mouse when the mouse
    button was released on the map. The checkit function will use those values to
    calculate the distance from the base location and print out the values on the
    screen.


    The checkit function, called with a parameter holding the latitude and longitude
    value, follows:


    ```javascript

    function checkit(latlng) {

    var distance = dist(latlng,blatlng);

    ndistance = round(distance,2);

    var distanceString = String(distance)+" km"; marker = new google.maps.Marker({

    position: latlng,

    title: distanceString,

    icon: bxmarker,

    map: map });

    var clat = clat.lat();

    var clng = clat.lng();

    clat = round(clat,4);

    clng = round(clng,4);

    document.getElementById("answer").innerHTML =

    "The distance from base to most recent marker("+clat+", "+clng+")"

    "+String(distance)+"+ km.";


    can.style.zIndex = 100; pl.style.zIndex = 1;

    }

    ```


    Notice that the last thing that the function does is put the canvas back on top
    of the map.


