    # Testing and Uploading the Application


    This project consists of the HTML file and three image files. For my version of
    the project, the image files were the lightbulb, **light.gif**; the red x, **rxmarker.png**;
    and the black x, **bxmarker.png**. There is nothing special about these image
    file types. You can use whatever you like. It could be argued that x markers are
    too tiny, so think about your customers when deciding what to do.


    This application does require you to be online to test since that is the only
    way to make contact with Google Maps.'
