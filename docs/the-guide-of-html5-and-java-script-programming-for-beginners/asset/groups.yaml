    # THE GUIDE OF HTML5 AND JAVA SCRIPT

    PROGRAMMING FOR BEGINNERS


    STEP BY STEP GUIDE TO BUILDING YOUR FIRST HTML AND JAVA SCRIPT PROJECTS


    ![](img/e32356ef35161e47bae71aaac696664f_0_0.png)


    BY :- JEANINE MEYER


    # The Guide Of HTML5 AND JAVA SCRIPT

    Programming for Beginners


    # By :- Jeanine Meyer


    Illustrator by :- Mark Nunney


    Page:- 678


    # HTML News


    ## HTML Tutorial: Step by Step Guide to Building Your First HTML and Java Script
    Application


    May 30, 2019


    HTML 5 ~ This is a New Edition Book. By Which You will Become Proficient in HTML
    in step-by-step, We Have Made Our Books in such a way that it will Help you to
    Understand the New One. You can Easily and Freshly use your Home / Office.


    # Contents


    # Chapter 1: Building the HTML5 Logo – Drawing on Canvas, with Scaling, and Semantic
    Tags.


    - Introduction

    - Project History and Critical Requirements

    - HTML5, CSS, and JavaScript features

    - Drawing paths on canvas

    - Placing text on canvas and in the body of a document

    - Coordinate transformations

    - Using the range input element

    - Building the application and making it your own

    - Testing and uploading the application

    - Summary


