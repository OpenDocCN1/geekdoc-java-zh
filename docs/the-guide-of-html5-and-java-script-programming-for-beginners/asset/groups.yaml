    # Map Portal: Using Google Maps to Access Your Media:


    In this chapter, you will explore the following:


    +   - Using the Google Maps API to play and display video, audio, and images


    +   - Creating HTML5 markup dynamically


    +   - Separating the program from descriptions of content


    +   - Building a geography game'
  - '[PAGE 283]


    # Introduction:


    The projects in this chapter make use of the Google Maps API as a way to play
    video, display images, or play audio *and* display an image, all based on geographic
    locations. You can use these projects as models to build a study of a geographic
    area, report on a business or vacation trip, or create a geography quiz. I will
    describe three distinct applications. For all three applications, I have acquired
    media, such as video files, audio files, and image files, and I have defined in
    code an association between the files and specific geographic locations. To give
    you an idea of what I mean, for my projects, associations between a target location
    (which is given in latitude and longitude coordinates in the code) and media are
    shown in Table 5-1.


    Table 5-1. Outline of Content


    | Description of Location | Media |

    |---|---|

    | Purchase College | Video from robotics class |

    | Mount Kisco | Picture of Esther and an audio file of her playing piano |

    | Dixon, Illinois | Picture of Aviva |'
  - '[PAGE 284]


    # Statue of Liberty, New York City Video of fireworks


    All three applications proceed smoothly with the different types of media. This
    is due to the features of HTML5 and, I say modestly, my programming. The media
    files are separate and the same for all three applications. It is still recommended
    that you supply multiple video and audio formats to make sure your application
    will work in the different browsers. The media types recognized by browsers may
    change so that fewer types are required, but this is not the case at this time.


    The first application, consisting of one HTML file, named mapvideos.html, invites
    the viewer to click the map. If the click is close enough to one of the targeted
    locations, the viewer either sees the corresponding image, sees the corresponding
    video playing, or both sees the corresponding audio file. The program handles
    all three types of media and media combinations.


    The second application appears to the viewer to be the same as the first, but
    there is an important difference in the implementation. This application consists
    of two html files: mapmediabase.html and mediacontext.js. The mediacontext.js
    file holds the information describing the specific media content of the application.
    The mapmediabase.html program brings in the mediacontext.js file and creates during
    runtime what is necessary to replicate the first application.'
  - '[PAGE 285]


    I include both the first and second application because the first one is easier
    to understand, since all the information is in one place. When you develop your
    own applications, you can try to go straight to an implementation that separates
    coding from content, but don''t feel too bad if you don''t.


    The third application is a quiz. Like the second, it consists of two files: **mapmediaquiz.html**
    and **mediaquizcontent.js**. The **mediaquizcontent.js** file contains information
    connecting the media to the locations and also contains the text for the questions.


    The three applications have much of the same coding. The process of creating the
    second and third applications will show you how to scale up your applications
    by separating the details of a specific set of media (or other things) from the
    bulk of the programmin'
