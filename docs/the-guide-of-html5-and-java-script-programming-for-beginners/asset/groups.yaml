  mdcn: "\n以及 HTML5 和 JavaScript 的特性。而且，正如我将反复强调的那样，浏览器之间存在差异需要讨论。\n\n# 关键需求\n\n该项目的关键需求包括构建一个用于操作屏幕上对象的框架，包括检测对象上的鼠标事件、删除对象以及创建对象的副本。目前的框架提供了一种指定矩形、椭圆、心形和图像的方法，但这种方法可以容纳其他形状，这是本章的一个重要教训。\n\
    \n目标是让拖放操作尽可能精确：而不仅仅是将某个东西从窗口的一个区域移动到另一个区域。我将在第 8 章和第 9 章关于制作拼图的内容中重新这个主题。\n\n\
    我还决定控制光标的外观。当鼠标不在画布上时，光标是标准箭头。当在画布元素上时，光标将变为十字。当用户按下鼠标按钮并拖动对象时，光标会变为带有指向手指的手形。\n\
    \n工作完成后，人们自然会有保存它的愿望，或许保存为图像文件，因此这也是项目的一个需求。\n\n# HTML5、CSS 和 JavaScript 特性\n\n\
    我们现在探索用于“家庭合贴”（Family Collage）项目的 HTML5 和 JavaScript 特性。其核心思想是维护画布上材料的列表。这个列表将是一个\
    \ JavaScript 数组。信息将包括每个项目的位置、如何在画布上绘制它以及如何判断鼠标光标是否在项目上。\n\n# JavaScript 对象\n\n\
    面向对象编程是计算机科学的标准，也是大多数编程语言的关键组成部分。对象具有属性（也称为属性）和方法。方法是一个函数。换句话说，对象拥有数据以及可能使用这些数据的代码。HTML\
    \ 和 JavaScript 有许多内置对象，如 `document`、`window` 以及数组和字符串。对于“家庭照片”项目，我利用了 JavaScript\
    \ 的一项基础功能（在 HTML5 之前已建立）来定义我自己的对象。这些被称为“用户定义对象”，但我和其他更倾向于称为“程序员定义对象”。对于“家庭合贴”项目来说，这是一个重要的区别，因为你（作为程序员）可能会创建一个包含你识别并设计的图片和其他形状的应用程序，然后将其提供给家庭成员使用。\n\
    \n该项目的目标是建立一个在画布上创建和操作不同形状的框架，考虑到一旦某个东西被绘制到画布上，它作为矩形或图像的身份就会丢失。每个形状的第一步是定义所谓的“构造函数”，它用于存储指定形状的信息。下一步是定义方法，即使用这些信息来完成所需操作的代码。\n\
    \n我的方法呈现出在画布上移动事物的假象。实际上，存储在内部变量中的信息被改变了，每当发生改变外观的变化时，画布都会被清除并进行新的绘制。\n\n我的策略是定义新类型的对象，每个对象将定义两个方法：\n\
    \n- **draw**：用于在画布上绘制对象\n- **overcheck**：用于判断给定位置（具体为鼠标位置）是否在对象上\n\n这些方法引用了对象的属性，并在数学表达式中使用这些值来产生结果。一旦定义了构造函数，就可以作为这些对象的新实例来创建值。一个名为\
    \ **stuff** 的数组持有所有的对象实例。\n\n**注意** 面向对象编程在其所有的光辉中拥有一套丰富且往往令人敬畏的词汇。类（Classes）是定义对象的实体。我在这里暗示了所谓的“接口”（interface）。类可以是其他类的子类，这对于图片和矩形可能有用。我在这里的目标是采用更随意的语气。例如，我会谈论对象和对象实例。\n\
    \n让我们离开泛泛而谈，展示它是如何工作的。我创建了名为 `Rect`、`Oval`、`Picture` 和 `Heart` 的函数。这些将是 `Rect`、`Oval`、`Picture`\
    \ 和 `Heart` 对象实例的构造函数。给此类函数命名为大写开头是一种惯例。\n\nRect\n\n`Rect` 构造函数的定义为：\n\n```javascript\n\
    function Rect(x,y,w,h,c) {\n  this.x = x;\n  this.y = y;\n  this.w = w;\n  this.h\
    \ = h;\n  this.draw = drawrect;\n  this.color = c;\n  this.overcheck = overrect;\n\
    }\n```\n\n变量 `r1` 的创建和初始化如下：\n\n```javascript\nvar r1 = new Rect(10,10,50,50,\"\
    red\");\n```\n\n`Oval` 构造函数的定义类似于 `Rect` 函数：\n\n```javascript\nfunction Oval(x,y,r,hor,ver,c)\
    \ {\n  this.x = x;\n  this.y = y;\n  this.r = r;\n  this.radsq = r*r;\n  this.hor\
    \ = hor;\n  this.ver = ver;\n  this.draw = drawoval;\n  this.color = c;\n  this.overcheck\
    \ = overoval;\n}\n```\n\n变量 `oval1` 的创建如下：\n\n```javascript\nvar oval1 = new Oval(200,30,20,20,\"\
    teal\");\n```\n\n相比之下，紫色的圆声明如下：\n\n```javascript\nvar cir1 = new Oval(300,30,20,20,\"\
    purple\");\n```\n\n# Picture\n\n`Picture` 对象的构造函数存储了位置、宽度、高度以及 `Image` 对象的名称。\n\
    \n```javascript\nfunction Picture(x,y,w,h,imagename) {\n  this.x = x;\n  this.y\
    \ = y;\n  this.w = w;\n  this.h = h;\n  this.imagename = imageName;\n  this.draw\
    \ = drawpic;\n  this.overcheck = overrect;\n}\n```\n\n我的示例中有四个 `Picture` 对象。以下设置其中一个对象的代码：\n\
    \n```javascript\nvar dad = new Image();\ndad.src = \"daniel1.jpg\";\nvar pic1\
    \ = new Picture(10,100,100,100,dad);\n```\n"
