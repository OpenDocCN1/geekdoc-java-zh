    # Traveling Mask


    The objective of the mask is to mask out—that is, cover up—all of the video except
    for a circle in the center. The style directives ensure that I can use the same
    variables—namely ballx and bally—to refer to the video and mask in both situations:
    video drawn and video element moved. So now the question how to make a mask that
    is a rectangular donut with a round hole.


    I accomplish this by writing code to draw two paths and filling them in with white.
    Since the shape of the mask can be difficult to visualize, I have created two
    figures to show you what it is. Figure 3-8 shows the outline of the two paths'
  - '[PAGE 164]


    ![](img/e32356ef35161e47bae71aaac696664f_164_0.png)


    Figure 3-8. Outline of paths for the mask


    ![](img/e32356ef35161e47bae71aaac696664f_164_1.png)


    Figure 3-9 shows the outline and the paths filled in'
  - '[PAGE 165]


    Figure 3-9. Paths for the mask after a fill and a stroke


    Now, the actual path has only the fill, and the fill color is white. You need
    to imagine these two white shapes traveling along top of the video. The effect
    of the mask is to cover most of the video clip. The parts of the canvas that have
    no paint on them, so to speak, are transparent, and the video clip content shows
    through. Putting it another way, the canvas is on top of the video element, but
    it is equivalent to a sheet of glass. Each pixel that has nothing drawn in it
    is transparent.


    The code drawing the masks is the same for both video drawn on canvas (videobounceC)
    and video element moving on the screen (videobounceE). The first path starts at
    the upper-left corner, and then goes over, down to the midway point, and finally
    back left. The path then is a semicircular arc. The last parameter indicating
    the sense of the arc is true for counterclockwise. The path continues with a line
    to the left edge and then back up to the start. The second path starts in the
    middle of the left edge, proceeds down to the lower-left corner, goes to the lower-right
    corner, moves up to the middle of the right side, and then moves to the left.
    The arc time has false as the value of the parameter for direction, indicating
    the arc is clockwise. The path ends where it started.


