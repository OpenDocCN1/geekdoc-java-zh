    ## Calculating Distance and Rounding Values for Display


    Google Maps, as many of us know, provides information on distances and even distinguishes
    between walking and driving. For this application, I needed more control on specifying
    the two locations for which I wanted the distance calculated, so I decided to
    develop a function in JavaScript. Determining the distance between two points,
    each representing latitude and longitude values, is done using the spherical law
    of cosines. My source was www.movable-type.co.uk/scripts/latlong.html. Here is
    the code:


    ```javascript

    function dist(point1, point2) {


    var R = 6371; // km


    // var R = 3959; // miles


    var lat1 = point1.lat()*Math.PI/180;


    var lat2 = point2.lat()*Math.PI/180 ;


    var lon1 = point1.lng()*Math.PI/180;


    var lon2 = point2.lng()*Math.PI/180;


    var d = Math.acos(Math.sin(lat1)*Math.sin(lat2) +

    Math.cos(lat1)*Math.cos(lat2) *

    Math.cos(lon2-lon1)) * R;


    return d;


    }

    ```


    **Caution** I don’t include many comments in the code because I include the tables
    with each line annotated. However, comments are important. I strongly recommend
    leaving the comments on **km** and **miles** in the **dist** function so you can
    adjust your program as appropriate. Alternatively, you could display both values
    or give the user a choice.


    The last function is for rounding values. When a quantity is dependent on a person
    moving a mouse, you shouldn’t display a value to a great number of decimal places.
    However, we should keep in mind that latitude and longitude represent big units.
    I decided I wanted the distances to be shown with two decimal places and the latitude
    and longitude with four.


    The function I wrote is quite general. It takes two parameters, one number **num**
    and the other **places**, indicating how many decimal places to take the value.
    You can use it in other circumstances. It rounds up or down, as appropriate, by
    adding in the value I call the *increment* and then calculating the biggest integer
    not bigger than the value. So


    - **round(9.147,2)** will produce 9.15; and

    - **round(9.143, 2)** will produce 9.14.


    The way the code works is first to determine what I term the *factor*, 10 raised
    to the desired number of places. For 2, this will be 100. I then calculate the
    increment. For two places, this will be 5 / 100 * 10, which is 5 / 1,000, which
    is .005. My code does the following:


    - 1. Multiplies the increment to the original number

    - 2. Multiplies the result by the factor

    - 3. Calculates the largest whole number not bigger than the result (this is called
    the floor)—producing a whole number

    - 4. Divides the result by the factor


    The code follows:


    ```javascript

    function round (num,places) {

    var factor = Math.pow(10,places);

    var increment = 5/(factor*10);

    return Math.floor((num+increment)*factor)/factor; }

    ```


    I use the **round** function to run off distances to two decimal places and latitude
    and longitude to four decimal places.


    **Tip** JavaScript has a method called **toFixed** that essentially performs the
    task of my round. If **num** holds a number—say, 51.5621—then **num.toFixed()**
    will produce 51 and **num.toFixed(2)** will produce 51.56. I''ve read that there
    can be inaccuracies with this method, so I chose to create my own function. You
    may be happy to go with **toFixed()** in your own applications, though.


    With the explanation of the relevant HTML5 and Google Maps API features, we can
    now put it all together.


