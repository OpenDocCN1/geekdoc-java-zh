    - 总结


    # 这本书适合谁读？


    我相信我的解释是完整的，但我并不像像我之前的书籍《HTML5 必备指南》中所称的那样，这本书是写给完全初学者的。这本书是针对具有某些编程知识、并希望通过结合基础功能并将
    JavaScript 与其他技术来构建（更多）实质性应用的开发者。它也可以作为与程序员合作的人的灵感来源，帮助他们理解哪些可能性。


    # 这本书是如何结构的？


    这本书由十章组成，每章都围绕一个应用或应用类型展开。你可以跳着读。不过，在读第 5 或 6 章之前读第 4 章可能更有意义。此外，PHP 服务器语言在第 6
    章中以简单方式使用，然后在第 10 章中更全面。文中指示了其他交叉引用。每章都从应用的介绍开始，并附有应用运行的截图。在某些情况下，展示了浏览器之间的差异。章节继续讨论关键需求，在深入技术细节之前介绍概念。接下来的部分描述了如何通过
    HTML5、JavaScript、PHP 和/或 SQL 中的特定结构以及标准编程技术来满足这些需求。然后我将逐行展示应用代码并附带注释。每章都以测试和将应用上传到服务器的说明与技巧，以及对所学内容的总结结束。代码（第
    10 章另有说明外）均包含在出版商提供的下载中。此外，插图以 TIFF 文件形式提供。


    # 第1 章


    # 构建 HTML5 标志 – 在画布上绘图、缩放与语义化标签


    在本章中，我们将回顾：


    - 在画布上绘制路径

    - 在画布上放置文本

    - 坐标变换

    - 画布上和其他元素中的字体

    - 语义化标签

    - range 元素元素


    # 引言：


    本章的项目是官方 HTML5 标志的展示，并带有文本。盾牌和字母绘制在画布上，辅助文本演示了语义化标签的使用。观众可以使用滑动输入设备更改标志的大小。这是本本书的一个合适开始，这是一个使用
    HTML5、JavaScript 和其他技术的项目集合，不仅是因为主题本身，而且作为基础事件驱动编程的良好回顾。我开发项目的方式（在他人工作的基础上）是大多数大多数人的工作方式。特别是，这种情况为坐标变换提供了动力。最后，在编写时，Firefox
    尚未完全实现滑动元素。遗憾的是，这也是常见情况，我将讨论其影响。本书的方法是在特定示例背景下解释 HTML5、层叠样式表和 JavaScript。项目代表了各种应用，希望你能在每个项目中找到可以学习并适用于你目的的内容。


    注意：如果你需要使用 HTML5 和 JavaScript 的编程介绍，可以参考我的书籍《HTML5 必备指南》或其他出版商的书籍。网上也有大量的可用资源。


    图 1-1 显示了 Chrome 浏览器上标志项目的启动界面。（请跳至图 1-3 查看 Firefox 上的外观。）


    ![](img/e32356ef35161e47bae71aaac696664f_16_0.png)


    > 注意：在某些浏览器中被视为文本字段。

    基于 Daniel Davis 等人的工作构建，但字体问题归他们负责。查看样式元素中 `font-family` 的使用，以及脚本元素中用于安全处理表单的常量变量。我处理了缩放。同时注意语义化元素的使用。


    HTML5 标志由 W3C 所有。


