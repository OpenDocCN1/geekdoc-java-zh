    \ }\n}\n```\n\n“引言”部分展示了地理定位的成功示例。现在，在解释如何使用这些信息之前，我将展示处理可能且确实发生的问题的方法。\n\n外层\
    \ **if** 的条件测试 **navigator.geolocation** 是否为浏览器识别的对象。如果*不是*，那么在检查是否存在名为 **place**\
