- md: "\n## Distances and Tolerances\n\nThe calculation of distance between two latitude/longitude\
    \ points was described in the previous chapter. The issue to be explained here\
    \ concerns how to make comparisons of distances. For the portal application, I\
    \ need to write code to determine the location specified in the content array\
    \ that is closest to the position the viewer clicked. I do this using a for loop.\
    \ As is typical in these “best so far” calculations, I start the process by computing\
    \ the distance to the 0th (i.e., the first) element in the content array. This\
    \ is the best so far. The for loop then proceeds, starting with index 1.\n\n```javascript\n\
    function checkit(clatng) {\n  var i;\n  var latlng = new google.maps.LatLng(content[0][0],content[0][1]);\n\
    \  var bestyet = 0;\n  var closestdistance = dist(clatng,latlng);\n  var distance;\n\
    \  for (i=1;i<content.length;i++) {\n    latlng = new google.maps.LatLng(content[i][0],content[i][1]);\n\
    \    distance = dist(clatng,latlng);\n    if (distance < closestdistance) {\n\
    \      closestdistance = distance;\n      bestyet = i;\n    }\n  }\n}\n```\n\n\
    When the for loop is complete, bestyet holds the index to the best yet, meaning\
    \ the closest, and closestdistance holds the distance to that element, which has\
    \ been determined to be the closest (smallest) distance.\n\nI need to write code\
    \ that checks if that element—the one with index named in bestyet—is close enough\
    \ to proceed. In gaming and other applications, the term tolerance or margin are\
    \ used. You can't expect a person to click exactly on a location. That is not\
    \ possible when the units are pixels, and it definitely isn't possible when the\
    \ units are latitude and longitude and the exact point may not be available to\
    \ the user under the current zoom level.\n\nThe variable maxdistance holds the\
    \ value I choose to use for this test. Here is the rest of the checkit function\
    \ (without repeating the whole switch statement):\n\n```javascript\nif (distance\
    \ < maxdistance) {\n  marker = new google.maps.Marker({\n    position: clatng,\n\
    \    title: content[bestyet][2],\n    icon: xmarker,\n    map: map \n  });\n\n\
    \  switch (content[bestyet][3]) {\n    ...\n  }\n} else {\n  answer.innerHTML=\"\
    Not close enough to any [new] target\";\n}\n```\n\n## Regular Expressions\n\n\
    Regular expressions are a powerful facility for describing patterns of character\
    \ strings (text) for checking and for manipulation. It is a whole language for\
