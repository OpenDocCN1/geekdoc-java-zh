    }

    if (nbally < 0) {


    nbally = 0;


    ballvy = -ballvy;

    }


    ballx = nballx;


    bally = nbally;

    ```


    注意，`videobounceC` 版本将 `ballx + vx + .5*videow` 与 `cwidth` 进行比较，而 `videobounceE`
    将 `ballx + vx + videow` 与 `cwidth` 进行比较。这意味着与右侧墙相比，videobounceE 程序将强制更早地反弹——即更早地转向。检查底部墙的情况也是如此。我这样做是为了避免涉及自动滚动的问题。视频元素并不局限于画布（canvas），因此，如果它移出了画布范围，它仍然文档的一部分并会被显示。由于新的显示区域比窗口大，这会导致滚动。滚动条会出现，尽管你什么也看不见，但我并不喜欢这种效果。如果你从较小的窗口开始，并在程序执行期间将其放大，你就能看到类似图
    3-7 所示的内容。


    图 3-7. 检查限制较少的视频元素反弹


    为了避免这种情况，你会发现我更改了视频球应用程序的检查方式。这样做的缺点是视频球几乎没有触碰到右侧和底部墙。


    这些效果之所以在画布上绘制视频的应用程序 `videobounceC` 中没有发生，是因为在画布之外的坐标在画布上进行绘制没有可见效果。你可以回看第一章的图
    1-6，查看一个在“线条之外”绘制导致画布外不产生任何内容的示例。


    > 注意：可能还有其他方法可以避免滚动问题。但这无法防止图 3-7 所示的不美观。在浏览器中阻止滚动可能是可能的。可以阻止用户滚动，但自动滚动似乎是一个更具挑战性的问题。


    # 画布绘制视频以及移动元素


    现在我将描述两种不同的实现方式：一种是将视频内容绘制在画布上，另一种是在文档中移动视频元素元素。


    # 在画布上绘制视频


    正如我之前提到的，HTML5 确实提供了在画布上绘制视频的功能，就像绘制图像一样。这实际上是一个术语误。视频片段由一系列被称为“帧”的静态图像序列组成。帧率各异，但通常为每秒
    15 到 32 帧，因此你可以理解视频文件往往很大。视频使用不同类型的编码存储，每种编码在质量和存储大小方面都做了不同的技术权衡。我们不需要担心这些技术细节，但可以将视频看作一系列帧的序列。播放视频涉及按顺序呈现帧。在
    `drawImage` 命令中发生的是，视频片段的当前帧就是绘制在画布上的图像。如果此操作是通过定时间隔事件（timed interval event）执行的，那么查看者将在每个时间间隔看到一帧。这不能保证显示的图像是视频片段的连续帧，但如果执行得足够快，绘制的帧将足够接近实际序列，以至于我们的眼睛和大脑将其体验为视频片段的实时动作。


    伪代码中的命令为：


    ```javascript

    ctx.drawImage(video element, x position, y position, width, height);

    ```


    该命令正式上是 `ctx` 画布上下文的一个方法，它提取与视频当前帧对应的图像，并根据指定的宽度和高度将其绘制在 x 和 y 轴值处。如果图像没有指定的宽度和高度，则对图像进行缩放。在这种情况下不会发生。


    目标是让移动的视频片段看起来像球。对于这个应用程序，这意味着我们想要遮住矩形视频片段中心圆以外的所有部分。我通过创建一个移动的遮罩来实现这一点。遮罩是画布上的一个绘图。由于我想将视频元素放置在画布元素上，并将由路径创建的形状放置在从视频片段绘制的图像之上，我使用了
    CSS 指令使视频和画布都能使用绝对定位进行定位。我希望“返回”按钮位于画布上方。这些指令实现了效果：


    ```css

    #vid {position:absolute; display:none; }

    #canvas {position:absolute; z-index:10; top:0px; left:0px;}

    #revbtn {position:absolute; z-index:20; }

    ```


    记忆图层工作原理的一种方法是想象面向屏幕外的 z 轴。值较高的元素位于设置值较低的元素之上。画布的 `top` 和 `left` 属性各设置为 0 像素，以便将画布的左上角置在窗口的左上角。


    注意：当在 JavaScript 中引用或修改 `z-index` 时，它的名称是 `zIndex`。


    希望你能理解为什么 `z-index` 这个名称不起作用：连字符（-）会被解释为减法运算符。


    视频元素在样式指令中被设置为不显示（display:none）。这是因为作为一个元素本身，它不应该显示任何内容。相反，当前帧的内容通过以下语句绘制到画布上：


    ```javascript

    ctx.drawImage(v, ballx, bally, videow, videoh);

    ```


    `ballx` 和 `bally` 值在 `init` 函数中初始化，并按照上一节所述进行递增。视频的宽度和高度已经修改以适应窗口。理解这一点的一种方法是想象视频元素替换了
    `drawImage` 命令。


    # 移动元素


    移动视频元素需要让视频可见并开始播放。`videobounceC` 应用程序在文档中移动视频元素。以下代码


    ```javascript

    v.style.left = String(ballx)+"px";

    v.style.top = String(bally)+"px";

    v.play();

    v.style.visibility = "visible";

    v.style.display = "block";

    ```


    在 `init` 函数中执行。注意视频的初始位置更改为初始的 `ballx` 和 `bally` 值。数值值需要转换为字符串，然后将 "px" 拼接到字符串末。这是因为
    HTML/JavaScript 假设样式属性是字符串。我在 `drawscene` 函数中使用相同的代码设置视频元素的 `top` 和 `left` 属性为对应
    `ballx` 和 `bally` 的值。替换 `drawImage` 命令的语句为：


    ```javascript

    v.style.left = String(ballx)+"px";

    v.style.top = String(bally)+"px";

    ```


    # 循环视频


    你可能已经注意到视频标签带有 `loop="loop"` 属性。这表示当视频播放结束时，视频将循环——即每次重新开始。在编写时，这在 Firefox 中不起作用，因此我使用语句


    ```javascript

    v.addEventListener("ended", restart, false);

    ```


    来设置在 `ended` 事件发生时调用指定的函数。`false` 参数意味着该事件不会冒泡到任何其他应用程序。不太可能有其他应用程序在监听此事件，但停止冒泡动作并无害。我定义了名为
    `restart` 的函数。


    ```javascript

    function restart() {


    v.currentTime=0;


    v.play();

    }

    ```


