    ## Checking E-mail Address Input and Invoking PHP to send e-mail


    As described in the “Introduction” section, any application involving the sending
    of e-mails based on user input should attempt to check that the input fits the
    format for an e-mail address. Fortunately, this is one of the new features of
    HTML5. The input elements have a type attribute, and one type is e-mail. Standard
    HTML (4 and earlier) provides a way to specify submission of the form is to cause
    invoking of a file on the server. I describe this more in the next section, including
    the significance of the method setting. The complete form for e-mail follows:


    ```

    <form name="msg" action="sendmail.php" method="post">

    <p>Your email (for reply

    <input type="email" name="from" required/>

    To email

    <input type="email" name="to" required />

    </p>

    Subject: <input type="text" name="subject" size="100" />

    <p>

    Body of message (you may change it) <br/>

    <TEXTAREA NAME="body" COLS=40 ROWS=5>

    My geolocation is at the address given in the subject line. </TEXTAREA>

    </p>

    <input type="submit" value="SEND" />

    </form>

    ```


    This code produces the error checking shown in Figures 6-12 to 6-15 (shown previously),
    and should be appreciated as removing responsibilities from the programmer.


    The action attribute in the form tag specified the php file sendemail.php. This
    means that when the form is submitted, assuming the input is valid, the browser
    will send a message to the server (the computer from which it downloaded the HTML
    document). The message will be to invoke sendemail.php. The input data will be
    passed along. I will now give a brief introduction to php. Chapter 10 on the database
    project will contain more information.


    ## A Brief Introduction to the PHP Language


    The sending of e-mail is a facility provided on servers, not client-side computers.
    There are several languages for writing what are server-side scripts, and PHP
    is one of them. It is well-maintained and well-documented at www.php.net. You
    will read more about PHP in the description of a database project in Chapter 10.


    The previous session showed how to invoke a PHP script as the result of submission
    of a form. The form input can be passed to the script in one of two ways: POST
    and GET. The GET way makes use of what is called the query string. The POST way
    is done using the HTTP headers. I chose to use POST for this example.


    The main purpose of a PHP script is to do something on the server, probably using
    form input from an HTML document, and generate an HTML document to be passed back
    to the browser for display. It is not the case for the example for this project,
    but many PHP scripts consist of a mixture of HTML and PHP. The PHP portions are
    indicated by the delimiters <?php and ?>. The function echo adds its input to
    the HTML document being created.


    A feature of PHP is that variables, built in and programmer defined, start with
    dollar signs. For example, if the PHP script has been invoked by the action of
    a form, with the method specified as POST, and the form had an input element named
    to, then the line


    ```

    $to = $_POST[''to''];

    ```


    would access the form input named to and assign to the variable $to. As mentioned,
    PHP scripts compose HTML documents, so a frequent operation is concatenation of
    strings. The operator in PHP for this is . (dot). The line


    ```

    $Sheaders = "From: " . $_POST[''from''];

    ```


    extracts the form input named from and adds it to the literal string "From: "
    to form a longer string, which is assigned to the variable


    ## $Headers..


    Another feature of PHP, which probably is the strangest to experienced programmers,
    is that variables can be included in strings. The statement


    ```

    echo("There was a problem: <br>the body is $body,<br> the to is $To,<br> subject
    $subject,<br> headers is $Headers.");

    ```


    produces the output shown in Figure 6-21.


    There was a problem:

    the body is My geolocation at the address given in the subject line. ,

    the to is jeanine.meyer@gmail.com,

    subject is 99 E Main St, Mt Kisco, NY 10549, USA,

    headers is From: jeanine.meyer@purchase.edu.


    Figure 6-21. Demonstration of PHP echo of composed string


    The values of the variables $body, $to, $subject, and $Headers have been extracted
    and made part of the string. Notice also that the string contains the HTML markup
    <br>.


    The sending of e-mail is fairly straightforward. There is a built-in PHP function,
    mail, that does the work, using parameters the To address, the subject, the message
    body, and any header material. The function returns true if the sending operation
    was successful and false otherwise. Note that the sending operation was successful
    and the recipient e-mail service may still reject the address as nonexistent.
    The complete code for sendemail.php is shown in the next section.


