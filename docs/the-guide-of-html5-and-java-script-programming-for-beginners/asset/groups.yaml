- md: "\n## Heart\n\nWe have one more of the programmer defined objects to cover.\
    \ The challenge I set myself was to define values that specify a heart shape.\
    \ I came up with the following: a heart shape is defined by the position, an x,\
    \ y pair of values that will be the location of the cleft of the heart; the distance\
    \ from the cleft to the bottom point, and the radius for the two partial circles\
    \ representing the curved parts of the heart. You can think of this as a canonical\
    \ heart. The critical pieces of information are shown in Figure 2-3. If and when\
    \ you add new types of shapes to your application, you will need to invent or\
    \ discover the data that defines the shape.\n\n![](img/e32356ef35161e47bae71aaac696664f_70_0.png)\n\
    \nFigure 2-3. Data defining a heart\n\nThe constructor function saves the indicated\
    \ values, along with the color, into any newly constructed object. You might be\
    \ suspecting that the drawing and the overcheck will be somewhat more complicated\
    \ than the functions for rectangles and you would be correct. The constructor\
    \ function resembles the other constructor function.\n\n### function Heart(x,y,h,drx,color)\n\
    \n```\n{ this.x = x;\nthis.y = y;\nthis.h = h;\nthis.drx = drx;\nthis.radsq =\
    \ drx*drx;\nthis.color = color;\nthis.draw = drawheart;\nthis.overcheck = overheart;\n\
    this.ang = .25*Math.PI;\n}\n```\n\nThe ang attribute is a case of my hedging my\
    \ bets. You notice that it is a constant and I could avoid making it an attribute.\
    \ You will see later when I explain drawheart how my coding uses it to make the\
    \ heart rounded. I made it an attribute just in case I want to change to allow\
    \ hearts to have more variability.\n\n## Drawing\n\nI have the different method\
    \ functions to explain, but let's go to where the drawing is done in order to\
    \ demonstrate how all of this works together. I define an array, initially empty,\n\
    \n```\nvar stuff = [];\n```\n\nThen my code adds to this array with statements\
    \ such as\n\n- stuff.push(pic1);\n- stuff.push(pic2);\n- stuff.push(pic3);\n-\
    \ stuff.push(pic4);\n- stuff.push(r1);\n- stuff.push(s1);\n- stuff.push(oval1);\n\
    - stuff.push(cir1);\n\nAt appropriate times, namely after any changes, the function\
    \ drawstuff is invoked. It works by erasing the canvas, drawing a rectangle to\
    \ make a frame, and then iterating over each element in the stuff array and invoking\
    \ the draw methods. The function is\n\n```javascript\nfunction drawstuff() {\n\
    \  ctx.clearRect(0,0,600,400);\n\n  ctx.strokeStyle = \"black\";\n\n  ctx.lineWidth\
    \ = 2;\n\n  ctx.strokeRect(0,0,600,400);\n\n  for (var i=0;i<stuff.length;i++)\
    \ {\n    stuff[i].draw();\n  }\n}\n```\n\nNotice that there is no coding that\
    \ asks, is this an oval, if so do this, or is it a picture, if so do that....\
    \ Instead, the draw method that has been established for each member of the array\
    \ does its work! The same magic happens when checking if a position (the mouse)\
    \ is on an object. The benefit of this approach increases as more object types\
    \ are added.\n\nI did that since my code never changes the strokeStyle or the\
    \ lineWidth, I could move those statements to the init function and just do them\
    \ one time. However, it occurred to me that I might have a shape that does change\
    \ these values and so to prepare for that possible change in the application at\
    \ a later time, I would set strokeStyle and lineWidth in drawstuff.\n\nNow I will\
    \ explain the methods for drawing and the methods for checking if a position is\
    \ on the object. The drawrect function is pretty straight-forward:\n\n```javascript\n\
    function drawrect() {\nctx.fillStyle = this.color;\nctx.fillRect(this.x, this.y,\
    \ this.w, this.h);\n}\n```\n\nRemember the term this refers to the object for\
    \ which drawrect serves as a method. The drawrect function is the method for rectangles\
    \ and for pictures. The drawoval function is slightly, but only slightly, more\
    \ complex. You need to recall how transformations work. HTML5 only allows circular\
    \ arcs but does allow scaling the coordinates to produce ovals (ellipses) that\
    \ are not circles. What the coding in theoval function does is to save the current\
    \ state of the coordinate system and then perform a translation to the center\
    \ of the object. Then a scaling transformation is applied, using the hor and ver\
    \ properties. Now, after setting the fill to be the color specified in the attribute,\
    \ I use the coding for drawing a path made up of a circular arc and filling the\
    \ path. The last step is to restore the original state of the coordinate system.\n\
    \n```javascript\nfunction drawoval() {\n  ctx.save();\n  ctx.translate(this.x,this.y);\n\
    \  ctx.scale(hor,ver);\n  ctx.fillStyle = this.color;\n  ctx.beginPath();\n  ctx.arc(0,0,this.r,0,2*Math.PI,true);\n\
    \  ctx.closePath();\n  ctx.fill();\n  ctx.restore();\n}\n```\n\nThis is the way\
    \ ovals that may or not be circles are drawn on the canvas. Since my code restored\
    \ the original state of the coordinate system, this has the effect of undoing\
    \ the scaling and transformations. The drawpic function is the easiest one, just\
    \ one line:\n\n```javascript\ndrawpic() {\n  ctx.drawImage(this.image,this.x,this.y,this.w,this.h);\n\
    }\n```\n\nThe tricky thing was to determine where the arc stops on the right side.\
    \ My code uses trig expressions to set the **cx** and **cy** values. The cx, cy\
    \ position is where the arc meets the straight line. Figure 2-4 indicates the\
    \ meaning of the variables.\n\n![](img/e32356ef35161e47bae71aaac696664f_78_0.png)\n\
    \nFigure 2-4. Pieces of data used in functions\n\nThe path will start at what\
    \ we are calling the cleft and draw the arc on the left, draw a line to the bottom\
    \ point, then up to the cx,cy point and finish with the arc on the right. The\
    \ function is the following:\n\n```javascript\nfunction drawheart() {\n  var leftctx\
    \ = this.x-this.drx;\n  var rightctx = this.x+this.drx;\n  var cx = rightctx+this.drx*Math.cos(this.ang);\n\
    \  var cy = this.y+this.drx*Math.sin(this.ang);\n\n  ctx.fillStyle = this.color;\n\
    \  ctx.beginPath();\n  ctx.moveTo(this.x,this.y);\n  ctx.arc(leftctx,this.y,this.drx,0,Math.PI-this.ang,true);\n\
    \  ctx.arc(rightctx,this.y,this.drx,this.ang,Math.PI,true);\n  ctx.closePath();\n\
    \  ctx.fill();\n}\n```\n\n## Checking for mouse over\n\nBefore describing the\
    \ functions for the over check, I will preview why it is needed. HTML5 and are\
    \ three functions to explain for the over check since Picture and Rect refer to\
    \ the same function. Each function takes two parameters. Think of the mx, my as\
    \ the location of the mouse. The overrect function checks for four conditions\
