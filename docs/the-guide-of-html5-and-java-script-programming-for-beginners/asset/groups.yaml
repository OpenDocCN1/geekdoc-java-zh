- md: "\n# Figure 1-1. Opening Screen for HTML5 Logo\n\nNotice the slider feature,\
    \ the accompanying text, which contains what appears to be a hyperlink, and the\
    \ text in a footer below a yellow line. The footer also includes a hyperlink.\
    \ As I will explain later, the function and the formatting of the footer and any\
    \ other semantic element is totally up to me, but providing a reference to the\
    \ owners of the logo, The World Wide Web Consortium would be an appropriate use.\n\
    \nThe viewer can use the slider to change the size of the logo. Figure 1-2 shows\
    \ the application after the slider has been adjusted to show the logo reduced\
    \ to about a third in width and in height.\n\n![](img/e32356ef35161e47bae71aaac696664f_17_0.png)\n\
    \n> Scale percentage: Note: slider treated as text field in some browsers.\nBuilt\
    \ on work by Daniel Davis, et al., but don't blame them for the fonts. Check out\
    \ the use of font-family in the style element and the fontfamily variable in the\
    \ script element for safe ways to do fonts. I did the scaling. Note also use of\
    \ semantic elements.\n\nHTML5 Logo by W3C.\n\n# Figure 1-2. Logo scaled down\n\
    \nThe implementation of HTML5 is not complete by any browsers and, as it turns\
    \ out, Firefox treats all slider inputs as simple text fields. This is termed\
    \ 'graceful degradation' and it certainly is better than producing nothing at\
    \ all. Figure 1-3 shows the opening screen in Firefox. Notice the initial value\
    \ is displayed as 100.\n\n# Figure 1-3. Application using Firefox\n\nAs will be\
    \ the practice in each chapter, I now explain the critical requirements of the\
    \ application, more or less independent of the fact that the implementation will\
    \ be in HTML5, and then describe the features of HTML5, JavaScript, and other\
    \ technologies as needed that will be used in the implementation. The Building\
    \ section includes a table with comments for each line of code and also guidance\
    \ for building similar applications. The Testing section provides details for\
    \ uploading and testing. This section is more critical for some projects than\
    \ others. Lastly, there is a Summary that reviews the programming concepts covered\
    \ and previews what is next in the book.\n\n# Project History and Critical Requirements\n\
    \nThe critical requirements for this project are somewhat artificial and not easily\
    \ stated as something separate from HTML. For example, I wanted to draw the logo\
    \ as opposed to copying an image from the Web. My design objectives always include\
    \ wanting to practice programming and prepare examples for my students. The shape\
    \ of the shield part of the logo seemed amenable to drawing on canvas and the\
    \ HTML letters could be done using the draw text feature. In addition, there are\
    \ practical advantages to drawing images instead of using image files. Separate\
