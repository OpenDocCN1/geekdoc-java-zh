  md: '# Regular Expressions


    Regular expressions are a powerful facility for describing patterns of character
    strings (text) for checking and for manipulation. It is a whole language for specifying
    patterns. For example, to give you a flavor of this large topic, the pattern


    ```

    /^5[1-5]\d{2}-?\d{4}-?\d{4}-?\d{4}$/

    ```


    can be used detect MasterCard numbers. These numbers start with 51 to 55, followed
    by two more digits, and then three groups of four digits. This pattern accepts
    the dashes, but does not require them. The ^ symbol means the pattern must be
    present at the start of the string, and the $ means it must go to the end of the
    string. The forward slashes (/) are delimiters for the pattern and the backslashes
    are escape characters. Interpreting this pattern starting at the start goes as
    follows:


    +   ^ Start at the start of the string.

    * 5 : Pattern must contain a 5.

    * [1-5]: Pattern must contain one of the numbers 1, 2, 3, 4, or 5.

    * \d{2}: Pattern must contain exactly two digits.

    * -?: Pattern must contain 0 or 1 -.

    * \d{4}: Pattern must contain exactly four digits.'
  merge: -1
  pgno: 317
- img_proc: true
  md: '+   - -?: Pattern must contain 0 or 1 -


    +   - \d{4}: Pattern must contain exactly four digits.


    +   - -?: Pattern must contain 0 or 1 -


    +   - \d{4}: Pattern must contain exactly four digits.


    +   - $ : End of string.


    MasterCard numbers must obey other rules as well, and you can do the research
    to find out how to verify them further. Don''t worry, we''ll be using a much simpler
    regular expression (also known as a *regex*) than that.


    The use of regular expressions predates HTML. Regular expressions can be used
    in forms to specify the format of the input. For this application, we will use
    the **replace** method for strings to find all instances of a specific small piece
    of text within a long string and replace it with something else. One of the statements
    I use is


    ```

    videomarkup = videomarkup.replace(/XXXX/g,name);

    ```


    What this does is find all occurrences (this is what the g does) of the string
    XXXX and replace them with the value of the variable **name**.


    I could and probably should have made even more use of regular expressions to
    verify the data defining the content of the applications. Maybe that''s something
    you want to experiment with in your own applications.'
