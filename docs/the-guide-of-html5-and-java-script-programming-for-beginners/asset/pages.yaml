- img_proc: true
  md: '# Critical Requirements


    The critical requirements for this project include constructing a framework for
    manipulating objects on the screen, including detecting mouse events on the objects,
    deleting objects and creating copies of objects. The current framework provides
    a way to specify rectangles, ovals, hearts and images, but the approach can accommodate
    other shapes and this is an important lesson of the chapter.


    The objective is for the drag and drop operations to be reasonably precise: not
    merely moving something from one region of the window to another. I will revisit
    this topic in the Chapters 8 and 9 on making jigsaw puzzles.


    I also made the decision to control the look of the cursor. The cursor when the
    mouse is not on the canvas is the standard arrow. When on the canvas element,
    the cursor will be the cross-hairs. When the user presses down on the mouse button
    and drags an object, the cursor changes to a hand with pointer finger.


    When the work is complete, it is a natural desire to save it, perhaps as an image
    file, so this also is a requirement for the project.'
  merge: -1
