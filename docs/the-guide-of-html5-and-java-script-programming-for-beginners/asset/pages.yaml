  md: '# # The Mapmediabase Application


    The next application, mapmediabase.html, recreates the first application, but
    uses a separate file for the content. You can easily make this one your own by
    changing the content. You need to obtain the latitude/longitude coordinates for
    your locations. To do so, you can use the mapspotlight.html application covered
    in the last chapter, you can use Google Maps directly, you can use Wolfram Alpha,
    or you can look them up in an atlas. A quick summary of the application follows:


    +   1. **init**: Performs initialization, including the call to **loadcontent**.

    2. **loadcontent**: Uses the variables, most significantly the **precontent**
    array included in the external script element to create new markup for the media.
    It also invokes **makemap**.

    3. **makemap**: Brings in the map and sets up event handling, including the call
    to **checkit**.

    4. **checkit**: Compares the clicked location with the locations described in
    the **content** array. If one is close enough, then the associated media is shown
    and played.

    5. **dist**: Computes the distance between two locations.


    Table 5-4 outlines the functions in the second portal application. The'
