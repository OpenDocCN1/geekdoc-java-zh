    Firefox browser makes this easy. You can right-click on the canvas when using
    a PC or do the equivalent operation on a MAC and a pop-up menu will appear with
    the option to Save Image As... However, Chrome, Safari and Opera do not provide
    that facility. If you right-click, the options concern the HTML document. There
    is, however, an alternative provided in HTML5.


    A canvas element has a method called toDataURL that will produce an image from
    the canvas. The method provides a choice of image file types from among png, jpg,
    or bmp. What I choose to do with the result of this operation is write code to
    open a new window with the image as the content. The user can save this image
    as a file either by the save file option or the right-click for the image. However,
    there is one more consideration. Chrome and Firefox require that this code run
