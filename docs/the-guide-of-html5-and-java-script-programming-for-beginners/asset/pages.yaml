  md: '# Family Collage: Manipulating Programmer-defined

    Objects on a Canvas


    In this chapter, you will learn about


    +   - Creating and manipulating object-oriented programming for drawing on canvas

    - Handling mouse events, including double-click

    - saving the canvas to an image

    - Using try and catch to trap errors

    - Browser differences involving the location of the code

    - Using algebra and geometry to construct shapes and determine when the cursor
    is over a specific object

    - Controlling the icon used for the cursor'
  merge: -1
  pgno: 54
- img_proc: true
  md: '# Introduction


    The project for this chapter is a utility for manipulating objects on a canvas
    to produce a picture. I call it a utility because one person does the programming
    and gathers photographs and designs and then can offer the program to friends,
    family members, colleagues and others to produce the compositions / collages.
    The result can be anything from an abstract design to a collage of photographs.
    The objects in my example include two rectangles, an oval, a circle, a heart,
    and five family photographs. It is possible for you, or, perhaps, your end-user/customer/client/player,
    to make duplicate copies of any of the objects or to remove any of the objects.
    The end-user positions the object using drag and drop with the mouse. When the
    picture is judged to be complete, it is possible to create an image that can be
    downloaded into a file.


    Figure 2-1 shows the opening screen for my program. Notice that you start off
    with ten objects to arrange.'
  merge: -1
