  md: '# Project History and Critical Requirements


    I have always liked the application of simulating a ball bouncing in a box.

    Chapter 3 in The Essential Guide to HTML5 features projects showing a ball produced
    by a path drawing and a ball produced by an image, each bouncing in a two-dimensional
    enclosure. I decided I wanted to make a video clip do the same thing. My explanation
    of the coding is complete in this chapter. However, if the first book is available
    to you (shameless plug), you may benefit from seeing what is the same and what
    is different among the various versions. In the ball and image applications, the
    canvas was set to fixed dimensions and was located with other material in the
    document. Because I did not want my video clip to be too small, I decided to use
    the whole window in this case. This objective produced the challenge of determining
    the dimensions of the document window. In the old ball and image applications,
    I wanted to demonstrate form validation, so the program provided form elements
    to change the vertical and horizontal speed. For the bouncing video clip, the
    application just provides one action for the user: a button to reverse direction.
    After studying this chapter, you should be able to add the other interface operations
    to the video application.


    Since the ability to draw video on canvas is a feature of HTML5, this was the
    first approach I took for doing the project. However, my reading indicated that
    this is considered too much of a computation hog and is something to be'
  merge: -1
  pgno: 142
- img_proc: true
  md: 'avoided, so I also developed another approach: moving a video element moving
    an element on a canvas on top of it.


    Putting off the implementation details, the critical requirements, in addition
    to determining the dimensions of the window, are to move—position—and animate
    a video clip simultaneously with a graphical element that acts as a mask. The
    effect of the mask is to make the video clip appear as a circle instead of the
    standard rectangular shape. The video clip is playing while it is moving. The
    application is to simulate a ball-like object bouncing within a box. Therefore,
    the application must display the walls of the box and perform calculations so
    that when the video clip appears to collide with any of the walls, the direction
    of motion changes in the appropriate way. A fancy way to describe the change is
    that the angle of reflection must equal the angle of incidence. In practical terms,
    what it means is that the video clip virtually hits the bottom or top walls, it
    keeps going in the same direction horizontally (to the left if it was traveling
    to the left and to the right if it was traveling to the right), but switches direction
    vertically. When the video clip virtually hits either the left or the right wall,
    it keeps going in the same direction vertically (traveling up if it was traveling
    up and traveling down if it was traveling down), but switches direction horizontally.
    If you are interested in simulating real-life physics, you can slow down the motion
    at each virtual hit of a wall.'
