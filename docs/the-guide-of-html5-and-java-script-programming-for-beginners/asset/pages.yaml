    I assume that you, the reader, have some experience with HTML and documents. One
    of the most important new features in HTML5 is the canvas element for drawing.
    I describe briefly the drawing of filled-in paths of the appropriate color and
    filled-in text. Next, I describe coordinate transformations, used in this project
