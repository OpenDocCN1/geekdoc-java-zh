  md: '# Who Is This Book For?


    I do believe my explanations are complete, but I am not claiming, as I did for
    my previous book, The Essential Guide to HTML5, that this book is for the total
    beginner. This book is for the developer who has some knowledge of programming
    and who wants to build (more) substantial applications by combining basic features
    and combining JavaScript with other technologies. It can also serve as an idea
    book for someone working with programmers to get an understanding of what is possible.'
  merge: -1
