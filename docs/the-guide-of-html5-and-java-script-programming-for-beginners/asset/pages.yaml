  md: '# Building the Application and Making It Your Own


    The two applications for simulating the bouncing of a video clip ball in a dimensional
    box contain similar code, as the program that produced the picture of the trajectory.
    A quick summary of the applications follows. The video applications are summarized
    by the following:


    +   1. **init**: initialization, including adapting to fit the window and setting
    up the timed event for invoking **drawscene**


    +   2. **drawscene**:


    a. Erase the canvas.

    b. Determine new location of video (virtual ball) using **moveandcheck**.

    c. Either draw the the image from video at a specified location on the canvas
    or reposition the video element to a specified position.

    d. Draw paths on canvas to act as a mask to the video.

    e. Draw the box.


    +   3. **moveandcheck**: Check if the virtual ball will hit any wall. If so, change
    the appropriate displacement value.


    The trajectory function also uses **init** and **moveandcheck**, but has a simpler
    **drawscene** function:


    +   1. Determine the new location of the circle (virtual ball) using'
