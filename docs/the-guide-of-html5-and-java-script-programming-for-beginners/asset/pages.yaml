  md: '# JavaScript objects


    Object oriented programming is a standard of computer science and a critical part
    of most programming languages. Objects have attributes, also called properties,
    and methods. A method is a function. Put another way, an object has data and code
    that may make use of the data. HTML and JavaScript have many built-in objects,
    such as document and window and also arrays and strings. For the Family Picture
    project, I make use of a basic facility in JavaScript (established before HTML5)
    for defining my own objects. These are called user-defined objects, but the term
    I and others prefer programmer-defined objects. This is an important distinction
    for the Family Collage project in which you, the programmer, may create an application,
    with pictures and other shapes you identify and design, and then offer it to a
    family member to use.


    The objective of this project is to set up a framework for creating and manipulating
    different shapes on the canvas, keeping in mind that once something is drawn to
    the canvas, its identity as a rectangle or image is lost. The first step for each
    shape is to define what is called a constructor function that stores the information
    that specifies the shape. The next step is to define the methods, code for using
    the information to do what needs to be done.


    My approach gives the appearance of moving things on the canvas. In fact, information
    kept in internal variables is changed and the canvas is cleared'
  merge: -1
  pgno: 62
- img_proc: true
  md: 'new drawings made each time something happens to change the look of the canvas.


    My strategy is to define new types of objects, each of which will have two methods
    defined


    +   - **draw** for drawing the object on the canvas


    +   - **over check** for determining if a given position, specifically the mouse
    position, is on the object


    These methods reference the attributes of the object and use these values in mathematical
    expressions to produce the results. Once the constructor functions are defined,
    values can be created as new instances of these objects. An array called **stuff**
    holds all the object instances.


    **Note** Object oriented programming in all its glory has a rich and often daunting
    vocabulary. Classes are what define objects. I have hinted here at what is called
    an interface. Classes can be subclasses of other classes and this may have been
    useful for pictures and rectangles. I''m aiming for a more casual tone here. For
    example, I will speak of objects and object instances.


