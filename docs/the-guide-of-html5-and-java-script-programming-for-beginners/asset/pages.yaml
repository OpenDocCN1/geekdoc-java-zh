  md: '# Google Maps API for Map Access and Event


    # Handling


    Access to the Google Maps API requires a script element with reference to an external
    file. For this application, I used


    ```

    <script type="text/javascript" charset="UTF-8"src="http://maps.google.com/maps/api/js?sensor=false"></script>

    ```


    I set up the map using a function named makemap. It has two parameters: two decimal
    numbers that represent the latitude and longitude values:


    ```

    function makemap(mylat, myong)

    ```


    The global variables zoomlevel, holding a number from 0 to 18, and xmarker, holding
    the address of an image file, are set before the function makemap is invoked.


    The code to bring in a map is an invocation of the google.maps.Map constructor
    method. It takes two parameters. The first is the location in the HTML document
