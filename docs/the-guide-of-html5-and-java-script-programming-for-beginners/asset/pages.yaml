  md: '# Google Maps API


    The Google Maps JavaScript API Version 3 Basics has excellent documentation located
    at

    **http://code.google.com/apis/maps/documentation/javascript/basics.html.**


    You do not need to refer to it right now, but it will help you if and when you
    decide to build your own project. It will be especially helpful in producing applications
    for mobile devices.


    Most APIs are presented as a collection of related objects, each object having
    attributes (also known as properties) and methods. The API may also include events
    and a method for setting up the event. This is the situation with the Google Maps
    API. The important objects are **Map, LatLng**, and **Marker**. The method to
    set up an event is **addListener**, and this can be used to set up a response
    to clicking a map.


    The Google Maps API is brought into your HTML5 document with a script element:


    ```

    <script type="text/javascript" charset="UTF-8"src="http://maps.google.com/maps/api/js?sensor=false"></script>

    ```


    I will discuss the script tag again, specifically the **sensor=false** setting,
    in Chapter 6.'
  merge: -1
  pgno: 230
- img_proc: true
  md: 'The next step—and this could be all you need if all you want is to bring in
    a Google Map—is to set up a call to the Map constructor method. Pseudocode for
    this is


    ```

    map = new google.maps.Map(place you are going to put the map, associative array
    with options);

    ```


    Note that there is no harm in making the variable the name map.


    Let''s take up the two parameters one at a time. The place to put the map be a
    div defined in the body of the HTML document. However, I chose to create the div
    dynamically. I did this using code in an init function invoked in the usual way,
    by setting the onLoad attribute in the body statement. I also wrote code to create
    a canvas element inside the div. The code is


    ```

    candiv = document.createElement("div");

    ```


    ```

    candiv.innerHTML = ("<canvas id=''canvas'' width=''600'' height=''400''>No canvas
    </canvas>");

    ```


    ```

    document.body.appendChild(candiv);

    ```


    ```

    can = document.getElementById("canvas");

    pl = document.getElementById("place");

    ctx = can.getContext("2d");

    ```


    can, pl, and ctx are global variables, each available for use by other functions.'
