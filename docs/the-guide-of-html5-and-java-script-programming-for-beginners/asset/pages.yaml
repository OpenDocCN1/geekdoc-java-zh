  md: '# Introduction :


    The project for this chapter is a presentation of the official HTML5 logo, with
    accompanying text. The shield and letters of the logo are drawn on a canvas element
    and the accompanying text demonstrates the use of semantic tags. The viewer can
    change the size of the logo using a slider input device. It is an appropriate
    start to this book, a collection of projects making use of HTML5, JavaScript and
    other technologies, because of the subject matter and because it serves as a good
    review of basic event-driven programming and other important features in HTML5.
    The way I developed the project, building on the work of others, is typical of
    how most of us work. In particular, the circumstances provide motivation for the
    use of coordinate transformations. Lastly, at the time of writing, Firefox does
    not fully implement the slider input element. Unfortunately, this also is a common
    situation and I will discuss the implications. The approach of this book is to
    explain HTML5, Cascading Style Sheets and JavaScript chapters in the context of
    specific examples. The projects represent a variety of applications and, hopefully,
    you will find something in each one you will learn and adapt for your purposes.


    +   - Note If you need an introduction to programming using HTML5 and JavaScript,
    you can consult my book the Essential Guide to HTML5 or other books published
    by Après or others. There is also considerable material available online'
