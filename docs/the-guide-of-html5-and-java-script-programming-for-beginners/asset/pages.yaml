  md: 'article {display:block; font-family: Georgia, "Times New Roman", Times, serif;
    margin: 5px;}


    The styles each set up all instances of these elements to be displayed blocks.
    This puts a line break before and after. The footer has a border on the top, which
    produces the line above the text. Both styles specify a list of four fonts each.
    So the browser first sees if Trebuchet MS is available, then checks for Arial,
    then for Helvetica and then, if still unsuccessful, uses the system default sans-serif
    font for the footer element. Similarly, the browser checks for Georgia, then Times
    New roman, then Times and then, if unsuccessful, uses the standard serif font.
    This probably is overkill, but it is the secure way to operate. The footer text
    is displayed in bold and the articles each have a margin around them of 5 pixels.


    Formatting, including fonts, is important. HTML5 provides many features for formatting
    and for separating formatting from structure and content. You need to treat the
    text on the canvas differently than the text in the other elements.'
