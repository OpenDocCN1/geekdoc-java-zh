    \ geocoding. Control moves to the next statement before the task is complete.\
    \ Most asynchronous methods work by specifying a function to be invoked when the\
    \ task is complete. The call to the **geocode** method designates a function.\
    \ The way I designated the function was to define what is called an *anonymous\
    \ function* in the method call itself. The function definition in its entirety\
