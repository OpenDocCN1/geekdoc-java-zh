  md: 'As I indicated earlier, the clone function makes a copy of an element in the

    stuff array. You may ask, why not just write


    item = stuff[i];


    The answer is that this assignment does not create a new, distinct value.

    JavaScript merely sets the item variable to point to the same thing as the ith

    member of stuff. This is called ‘copy by reference’. We don’t want that. We

    want a brand new, separate thing that we can change. The way to copy is

    demonstrated in the clone function. A new object is created and then a for-

    loop is invoked. The for(var info in obj) says: for every attribute of obj ,

    set an equivalently named attribute in item to the value of the attribute.


    ```

    function clone(obj) {

    var item = new Object();

    for (var info in obj) {

    item[info] = obj[info];

    }

    return item;

    }

    ```


    So the effect of the two functions is to duplicate whatever element is under

    mouse cursor. You or your end-user can then mouse down on the original'
