  md: '# Using the range input element


    The input device, which I call a slider, is the new HTML5 input type range, and
    is placed in the body of the HTML document. Mine is placed inside an article element.
    The attributes of this type and other input elements provide ways of specifying
    the initial value, the minimum and maximum values, the smallest increment adjustment
    and the action to take if the viewer changes the slider. The code is


    ```

    <input id="slider" type="range" min="0" value="100" onChange="changescale(this.value)"
    step="10"/>

    ```


    The min, max, (initial) value, and the step can be set to whatever you like. Since
    I was using percentage and since I did not want the logo to get bigger than the
    initial value or deal with negative values, I used 0 and 100.


    In the proper implementation of the slider, the viewer does not see the initial
    value or the maximum or minimum. My code uses the input as a percentage. The expression
