  md: '# Testing and Uploading the Application


    You need to be online to test the first application since that is the only way
    to make contact with Google Maps, but the HTML file and the files for the marker
    icons (bx1.png and rx1.png ) can be on your local computer.


    To test the e-mail application, you need to upload all the files to the server.
    My files are geolocationkmemail.html, rx1.png, and sendmailp.php. Moreover, I’ll
    repeat what I mentioned earlier: you need to check that the server allows PHP
    and allows PHP to send e-mail. To make this concrete, for example, my standard
    server at my college allows some use of PHP, but not e-mail. The local IT group
    set up a special server for my database course that does the job!'
