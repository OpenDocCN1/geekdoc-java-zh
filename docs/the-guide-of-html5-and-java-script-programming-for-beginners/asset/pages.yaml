  md: '# Summary


    In this chapter, you learned how make a specific drawing and also steps to take
    in producing other, similar, applications. The features used include


    +   - paths

    - text on the canvas and text in semantic elements in the body

    - the range input element and its associated change event

    - coordinate transformations, namely translate and scale

    - specification of sets of fonts

    - styles for semantic elements, including the border top to make a line to go
    before the footer


    The next chapter describes how to build a utility application for making compositions
    or collages of photographs and shapes. It combines techniques of drawing on canvas
    and creating HTML elements with a standard technique for computing, objects. It
    also makes use of coordinate transformations.


    # CHAPTER 2'
  merge: -1
