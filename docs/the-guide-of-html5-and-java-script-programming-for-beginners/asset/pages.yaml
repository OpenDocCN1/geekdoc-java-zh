  md: '# Animation


    Animation is the trick by which still images are presented in succession fast
    enough that our eye and brain interprets what we see as motion. The exact mechanics
    of how things are drawn will be explained in the next two sections. Keep in mind
    that there are two animations going on: the presentation of the video and the
    location of the video in the box. In this section, I talk about the location of
    the video in the box.


    The way to get animation in HTML and JavaScript is to use the `setInterval` function.
    This function is called with two parameters. The first is the name of a function
    that we want to call and the second indicates the length of the time interval
    between each call to the function. The unit of time is milliseconds.


    The following statement, which is in the `init` function, sets up the animation:


    ```

    setInterval(drawscene,50);

    ```


    `drawscene` refers to a function that will do all the work. The 50 stands for
    50 milliseconds. This means that every 50 milliseconds (or 20 times per second),
    the `drawscene` function will be invoked. Presumably, `drawscene` will do what
    needs to be done to display something showing the video clip at a new location.
    You can experiment with interval duration.


    If you want to enhance this application or build another one in which it'
  merge: -1
  pgno: 149
- img_proc: true
  md: 'makes sense to stop the animation, you would declare a local variable for the
    setInterval call (let''s call it tid) and use the statement


    ```

    tid = setInterval(drawscene,50);

    ```


    At the point when you need to stop the animation, or more formally, stop the interval-timing
    event, you code


    ```

    clearInterval(tid);

    ```


    If you have more than one timing event, you would assign the output for each of
    them to a new variable. Be careful not to call setInterval multiple times with
    the same function. Doing so has the effect of adding new timing events and invoking
    the function multiple times.


