    means that when the form is submitted, assuming the input is valid, the browser
    will send a message to the server (the computer from which it downloaded the HTML
    document). The message will be to invoke sendemail.php. The input data will be
    passed along. I will now give a brief introduction to php. Chapter 10 on the database
