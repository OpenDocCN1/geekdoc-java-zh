    In all cases, the coding referenced the media. I used the same video files for
    the two video clips, the audio files for the single audio clip, and the two image
    files in all three cases. I used the image of a small hand-drawn x to mark locations
    on the map, instead of the default teardrop shape for markers in Google Maps.


