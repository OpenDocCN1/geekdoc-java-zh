- img_proc: true
  md: '# How Is This Book Structured?


    This book consists of ten chapters, each organized around an application or type
    of application. You can skip around. However, it probably makes sense to read
    Chapter 4 before 5 or 6. Also, the PHP server-side language is used in a simple
    way in Chapter 6 and then more fully in Chapter 10. Other cross-references are
    indicated in the text. Each chapter starts with an introduction to the application,
    with screenshots of the applications in use. In several cases, the differences
    between browsers are shown. The chapters continue with a discussion of the critical
    requirements, where concepts are introduced before diving into the technical details.
    The next sections describe how the requirements are satisfied, with specific constructs
    in HTML5, JavaScript, PHP, and/or SQL, and with standard programming techniques.
    I then show the application coding line by line with comments. Each chapter ends
    with instructions and tips for testing and uploading the application to a server,
    and a summary of what you learned. The code (with certain exceptions noted for
    Chapter 10) is all included as downloads available from the publisher. In addition,
    the figures are available as full-color TIFF files. Of course, you will want to
    use your own media for the projects shown in Chapters 2, 3, 5, and 8. My media
