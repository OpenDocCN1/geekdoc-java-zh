  md: 'Figure 2-2. Sample final product: rearranged objects


    I decided on including a heart, not just for sentimental reasons, but because
    required me to use algebra and geometry. Don''t be afraid of mathematics. It is
    very useful. I invented, so to speak, a canonical heart. For other shapes, you
    may be able to find a standard definition in terms of mathematical expressions.


    In this situation, I created the set of objects and then I used the program to
    make a composition. You can plan your application to take family photographs or
    photographs categorized by another theme and some set of circles, ovals, rectangles,
    and hearts. When you are finished, you can offer this program for others to use.
    This is analogous to building a game program for players. The end-users for this
    application may be family members, friends, or colleagues.


    Of course, it certainly is possible to use a drawing program such as Adobe Photoshop
    or Corel Paint Shop Pro to create compositions such as these, but this application
    provides considerable ease-of-use for its specific purpose. The project also serves
    as a vehicle to learn important programming techniques as'
