  md: '# Introduction


    The projects for this chapter involve the Google Maps API, geolocation, and PHP.
    I will describe two applications: the first just to show geolocation, a facility
    in which the browser determines the user''s location using one of a variety of
    means. This application lets you find out where the location services you think
    are and compare it to where you really are. The second application provides a
    way for the user to generate an e-mail using the geolocation information along
    with other data and send it to someone. This makes use of a server-side PHP script
    to send the e-mail, and HTML5 validation to confirm the e-mail addresses.


    The geolocation specification is under development in parallel with HTML5 and
    is considered a distinct specification. It is also different from Google Maps,
    though Google Location Services is one of the main sources of geolocation information.
    An obvious thing to do with the location data is to display a Google Map, but
    you can do anything you want with the information.


    One important feature of the geolocation specification is that the user—that is,
    the person on the client computer browsing the web page—must give approval for
    the location to be determined. This is so-called “opt-in.” The exact look of the
    screen varies with the different browsers. The terminology varies: a specific
    address may want to know, to track, or to use. It is all the same thing. Figure
    6-1 shows the opening screen using Firefox.'
