  md: '# Events


    The handling of events—namely mouse events, but also events for changing the slider
    on the Google Map or clicking the radio buttons—seemed the most daunting when
    I started work on this project. However, the actual implementation turned out
    to be straightforward. In the init function, I write code to set up event handling
    for movement of the mouse, mouse button down, and mouse button up, all regarding
    the canvas element:


    ```

    can.onmousedown = function () { return false; }


    can.addEventListener(''mousemove'',showshadow,true);


    can.addEventListener(''mousedown'',pushcanvasunder,true);


    can.addEventListener("mouseout",clearshadow,true);

    ```


    The true value for the third parameter indicates that this event is bubble, meaning
    that it is to signal other listeners. However, more work was needed to achieve
    the event handling I wanted for this project. I will explain the three functions
    and then go on to describe one more event.


    The showshadow function, as indicated previously, calls the drawshadowmask function.
    I could have combined these two functions, but dividing tasks into smaller tasks
    generally is a good practice. The showshadow function determines the mouse position,
    makes an adjustment so the lightbulb base is at the center of the spotlight, and
    then makes the call to drawshadowmask:'
