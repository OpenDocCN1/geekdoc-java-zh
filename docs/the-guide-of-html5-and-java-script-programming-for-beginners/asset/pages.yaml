  md: '# Drawing paths on canvas


    Canvas is a type of element introduced in HTML5. All canvas elements have a property
    (aka attribute) called the 2D context. Typically, a variable is set to this property
    after the document is loaded:


    ```

    ctx = document.getElementById(''canvas'').getContext(''2d'');

    ```


    It is important to understand that canvas is a good name: code applies colors
    to the pixels of the canvas, just like paint. Code written later can put a deffer
    color on the canvas. The old color does not show through. Even though our code
    causes rectangles and shapes and letters to appear, these distinct entities do
    not retain their identity as objects to be re-positioned.


    The shield is produced by drawing six filled-in paths in succession with the accumulated
    results as shown in Figure 1-5. You can refer to this picture when examining the
    code. Keep in mind that in the coordinates, the first number is the distance from
    the left edge of the canvas and the second number is the distance from the top
    edge of the canvas.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# Figure 1-5. Sequence of paths for drawing logo


    By the way, I chose to show you the sequence with the accumulated results. If
    I displayed what is drawn, you would not see the white parts making up the left
    side of the five. You can see it because it is two white filled-in paths on top
    of the orange.


    All drawing is done using methods and properties of the ctx variable holding the
    2D context property of the canvas. The color for any subsequent fill operation
    is set by assigning a color to the fillStyleproperty of the canvas


    ```

    ctx.fillStyle = "#E34C26";

    ```


    This particular color, given in the hexadecimal format, where the first two hexadecimal
    (base 16) digits represent red, the second two hexadecimal digits represent green
    and the last two represent blue, is provided by the W3C website, along with the
    other colors, as the particular orange for the background of the shield. It may
    be counterintuitive, but in this system, white is specified by the value #FFFFFF.
    Think of this as all together make white. The absence of color is black and specified
    by #000000. The pearly gray used for the right side of the 5 in the logo has the
    value #EBEBEB. This is a high value, close to white. It is not necessary that
    you memorize any of these values, but it is useful'
  merge: -1
  pgno: 25
- img_proc: true
  md: 'to know black and white, and that a pure red is #FF0000, a pure green is #00FF00
    and a pure blue #0000FF. You can use the eyedropper/color picker tool in drawing
    programs such as Adobe Photoshop, Corel Paint Shop Pro on the online: http://pixlr.com/
    to find values of colors in images OR you can use the official designation, when
    available, for official images.


    All drawing is done using the 2 dimensional coordinate systems. Shapes produced
    using the path methods. These assume a current location, which you can think of
    as the position of a pen or paint brush over the canvas. The critical methods
    are moving to a location and setting up a line from the current location to the
    indicated location. The following set of statements draws the five sided orange
    shape starting at the lower, left corner. The closePath method closes up the path
    by drawing a line back to the starting point.


    ```

    ctx.fillStyle = "#E34C26";nctx.beginPath();

    ctx.moveTo(39, 250);

    ctx.lineTo(17, 0);

    ctx.lineTo(262, 0);

    ctx.lineTo(239, 250);

    ctx.lineTo(139, 278);

    ctx.closePath();

    ```'
