    The first and critical step in making the application your own is to decide on
    the content. You can choose to not implement the first application, mapvideos,
    which has the content hard-coded, so to speak, with all the other coding. Again,
    I included it because I wrote it first and it is the easiest to understand. I
    strongly believe that most people would develop something like it, and then possibly
    decide to separate content from coding. You may go straight to mapmediabase or
    mapmediaquiz if you like.'
