  md: '# Clicking the Map


    The requirements I have stipulated for these projects allow the user to click
    the map. As was discussed in the previous two chapters, the Google Maps API provides
    a way to set up event handling. In the makemap function, I include the line


    ```

    listener = google.maps.event.addListener(map, ''click'', function(event) {

    checkit(event.latLng);

    });

    ```


    The checkit function uses the clicked location to make a marker, calculate an
    address using reversegeo, calculate the distance from the base to the clicked
    location, and display information. In the basic geolocation application, the definition
    for checkit is the following:


    ```

    function checkit(latLng) {

    ```


    ```

    var distance = dist(latLng,blLng);

    var result;

    distance = Math.floor((distance+.005)*100)/100;

    var distanceString = String(distance);

    marker = new google.maps.Marker({

    position: latLng,

    title: distanceString,

    icon: bxmarker,

    map: map });

    markersArray.push(marker);

    ```'
