    of distances. For the portal application, I need to write code to determine the
    location specified in the content array that is closest to the position the viewer
    clicked. I do this using a for loop. As is typical in these “best so far” calculations,
    I start the process by computing the distance to the 0th (i.e., the first) element
    in the content array. This is the best so far. The for loop then proceeds, starting
    with index 1.


    ```

    function checkit(clatng) {

    var i;

    var latlng = new google.maps.LatLng(content[0][0],content[0][1]);

    var bestyet = 0;

    var closestdistance = dist(clatng,latlng);

    var distance;

    for (i=1;i<content.length;i++) {

    latlng = new google.maps.LatLng(content[i][0],content[i][1]);

    distanceistance = dist(clatng,latlng);

    if (distance < closestdistance) {

    closestdistance = distance;

    bestyet = i;

    }

    }

    ```'
