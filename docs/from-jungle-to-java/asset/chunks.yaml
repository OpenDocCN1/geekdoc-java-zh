- fmt: "\n# Life by the Cottage\n\nLife was so smooth and even in this little cottage\
    \ by the river that days flew by with that pleasant rapidity which leaves nothing\
    \ to record except a general sense of restful enjoyment. One expedition, however,\
    \ might be described, a visit paid to a neighbouring estate which had been advertised\
    \ for sale, as giving a glimpse of a typical phase of up-country life. The call\
    \ was paid about noon, and after riding down a steep hill, where natives were\
    \ busily engaged in planting tea, the two Englishmen came upon a little square\
    \ white house half hidden in a bend in the stream. \n\nThis building had a deserted,\
    \ untidy look which was intensified by the state of the garden which surrounded\
    \ it; even at some distance from the house the scent of roses was perceptible,\
    \ and in the garden itself, if such a wilderness deserves the name, the odour\
    \ was almost overpowering. The place was a miniature forest of rose-bushes, loaded\
    \ with lovely blossoms, roses such as `X.` had not seen since he left his native\
    \ land. Everything looked untidy and ragged and ruined; the house, the creepers,\
    \ the rose bushes, the grass, the pigeon lofts all spoke of neglect and want of\
    \ money to put them straight, a want caused by the fall in the price of cinchona,\
    \ a misfortune which had involved many a fair estate and reduced it to the desolate\
    \ and unkempt condition exemplified by the one now visited. But even unkempt and\
    \ uncared for, what a picture it made! It was the realisation of a poetic death—the\
    \ victim smothered by roses beside the singing waters of a brook.\n\n## The Unexpected\
    \ Host\n\nIt was a long time before any one came, and the two visitors sat in\
    \ the verandah feeling rather shy and uncomfortable, for this was the neighbour's\
    \ first visit, and the native, who had ushered them in, vanished, sending weird\
    \ cries around the tangled garden paths as though to summon his master home. At\
    \ length, after long waiting, the silence and suspense, and the wonder of who\
    \ would come, from which direction, and when, grew almost unbearable, and the\
    \ absurd situation so wrought on their nerves that both visitors gave vent to\
    \ little gasps of laughter, brought on probably by the same nervous sensations\
    \ which compel children to misbehave in church—direct promptings of the evil one,\
    \ inducing a desire to do that which we know we should not do. \n\nAt length,\
    \ after it had been debated in hurried whispers whether a departure could not\
    \ be effected, the lady of the house appeared upon the scene. She was a tall,\
    \ large lady, in appearance typically Dutch. She wore the usual white linen jacket\
    \ and skimpy sarong, and her legs were bare. She gave a cordial greeting in Dutch,\
    \ at least to `X.` it was Dutch, for he knew nothing whatever of the language.\
    \ This his friend carefully explained, so he surmised, as the lady gave vent to\
    \ various guttural exclamations of astonishment and turned to gaze at him as though\
    \ he were indeed a strange person to behold.\n\n## The Language Barrier\n\nThe\
    \ conversation between the two then continued glibly, and `X.` was quite forgotten,\
    \ and he felt neglected and grew fidgety, realizing that he extremely disliked\
    \ this novel sensation of being ignored, without the possibility of attracting\
    \ any attention to himself by a remark. He was soon to learn however, that those\
    \ trifling inconveniences of which we are cognizant are generally less unpleasant\
    \ than those we do not know, for presently there was a stir and a general rising\
    \ from seats as the husband of the good lady emerged from the house on to the\
    \ verandah. \n\nThis gentleman was tall and dark, with a pointed grey beard like\
    \ an American in a caricature. He was clothed in a strange *deshabille*, which\
    \ ended in bare feet thrust loosely into carpet slippers, and when the eyes of\
    \ the visitors reached thus far they realized why his complexion was so dark.\
    \ After the first greetings the host—who `X.` afterwards learnt had once held\
    \ high office under Government, which he gave up for planting—turned towards him\
    \ and proceeded to harangue him without full stops. There is no other way to describe\
    \ what took place, as he continued to pour language at his guest without the least\
    \ apparent desire for reply. \n\nTo say that the visitor felt uncomfortable would\
    \ be to mildly describe his feelings—he had wished for recognition, and surely\
    \ had it now. What would his host think of him, if he allowed him to continue\
    \ to talk and never informed him that he could not understand one word of Dutch?\
    \ Again and again he endeavoured to stem the torrent of words and explain both\
