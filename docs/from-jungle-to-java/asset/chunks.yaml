    X. longed to impress this on more than one tourist whom he met on his travels.Few
    Dutch ladies in Java mind being seen in what to us appears undress—a sarong and
    kabaya—and frequently, when without guests, it is the custom to dine in this scanty
    apparel. In consequence there is a dislike to dining out, which involves the wearing
    of European clothes in all their fashionable tightness, and many a story is told
    in Batavia of sudden illness amongst lady guests during the evening—illness easily
    attributable to the unusual compression of garments, worn only on such rare occasions.There
    is seldom necessity for dressing since Europeans scarcely ever call in Java—of
    ladies it may be said they never call—though in the mornings they drive round
    in covered carriages visiting their intimate friends, clad in the skirts of the
    country so universally adopted.


    * * *


    ## CHAPTER XI.


    AN UNTIMELY CALL.'
