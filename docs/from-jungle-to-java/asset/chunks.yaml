    Arrived at the house of the Wodena, the traveller had to submit to more pumping,
    nor would his host rest until he knew, or was persuaded he knew, each word which
    `X.` had written in his letter of thanks to the Assistant Resident at `Tjilatjap`.
    That night it was very hot, and it was borne in upon the sleepless traveller that
    he had exhausted the resources of the place. Therefore at an early hour next morning
    his miscellaneous fairings were packed, the cost of his entertainment liberally
    repaid, and accepted without demur, and the visitors, after earnestly commending
    the picturesque little village at `Tambak` to special official protection, departed
    for the station.


    `X.` had intended to now perform the usual round and visit the temples at `Djaokjakerta`,
    `Solo` and `Semarang`, but when almost in the act of asking for his ticket, a
    spirit of revolt infected him, and he rebelled at the thought that he must go
    here and there just because all others did, when his inclinations really called
    him elsewhere, for his inclinations were bidding him go back to the cottage in
    the hills, where the tea and coffee grew. And so without hesitation he took his
    ticket and sent a telegram to announce his intended return.


    `Bandong` was to be the first halting-place, which meant travel in that crawling
    train from `6 a.m.` to `6 p.m.`, and stopping at twenty-eight stations on the
    way. There was no first-class compartment and the seats of the second-class were
    hard and narrow, and the cramped space after the first few hours became almost
    unbearable. Things looked brighter, the guard flattered the hopes of passengers
    by asking who would buy tickets for lunch at some halting-place further on, so
    that he could telegraph for the meal to be prepared. Hope is eternal, and experience
    of Java hotels had not yet robbed the traveller of the fond pleasure of anticipation.


    The `Swindon` of the line was reached, and there, sure enough, was a table spread
    with food. After the first bite of the first dish `X.` realized sadly that he
    had been done, since it would have been impossible to make any impression on that
    meat with aught less than an axe. Thus, with reluctance, his portion, albeit paid
    for in advance, was relinquished, to be again paid for probably and again to flatter
    and deceive some other passing and hungry stranger.


    The remainder of the journey proved agreeable, thanks to the companionship of
    a young officer who, invalided home from the `Lomboh` war, was `en route` to `Buitenzorg`,
    where he lived. This poor warrior had undergone a time of much hardship, and related
    how he and his men had slept shelterless on the wet ground and for nights had
    nothing but rice to eat. And this only half a day''s journey from the principal
    port in Java, and with as much money collected for aid to the soldiers as would
    have, if necessary, paid for the whole cost of the war.


    This companion told many interesting anecdotes of the war, and related some almost
    incredible tales of the treachery and ingratitude of the natives. The Englishman
    also availed himself of this opportunity for hearing something of social etiquette
    in time of peace, and the unwritten rules which guided those attending entertainments
    where Dutch and natives met. As for instance, when the Sultan of `Djoedja` gives
    a ball, each official must stand upon a step, high or low, in proportion to his
    rank, while the Resident is met and escorted to the same lofty altitude as the
    Sultan, on the top. To the Governor-General, however, the Sultan must do obeisance.


    This might be a convenient place to mention the great regard officially paid to
    caste. Reverence for rank amongst the people is fostered and aided by their rulers,
    and if a man of position is ever suspected or accused so that inquiry becomes
    necessary, it must take place with closed doors and in private.


    That night the party lay at `Bandong` (fresh from reading the "Red Cockade" its
    language seems the most descriptive). The train reached that considerable town
    at dusk. Here the traveller had the good fortune to again meet his friend the
    President of the `Lraad`, and was introduced by him to the `Club`. Being introduced
    to the `Club` meant being separately introduced to every member then in it, with
    that punctilious formality which `X.` had observed in `Batavia`.


    The hotel at `Bandong` was the best which the traveller had yet visited, and,
    contrary to expectation, dinner was warm and comforting. The others of the party,
    however, `Usoof` and `Abu`, were not so fortunate, for they had no means of getting
    anything to eat. It was not permitted them to go out after dark without lights,
    and they could not get lights. Added to this it was raining hard. The hotel apparently
    could not supply natives with food at such an hour, and it was necessary for them
    to go and look for it. This sad story greeted `X.` when his own dinner was done.
    But the kind President of the `Lraad` cut the knot of this dilemma and soon provided
    a caterer, protector, and guide for the hungry pair.


    As usual next morning, the time fixed for the train to leave was very early, and
    other trains were starting too, and of these `Abu` selected the one on the point
    of departure for `Maos` in which to stow all the portable luggage—no small amount—and
    this was only rescued as the train was actually on the move. This, of course,
    necessitated hurried action, making those who hurried hot.


    Then the scene at the ticket window was scarcely to be described. For a country
    where, in public, such a gulf is fixed between Europeans and natives, it is a
    strange thing to find the one aperture for the purchase of tickets, besieged by
    a serging clamouring throng of both races, and no one had any idea of waiting
    his turn. `X.` attempted to force his way to the little window, but as he stopped
    to observe the rules of the game, as played in civilized countries of the West,
    he was each time passed over, when the tickets were almost in his grasp.


    At length, disgusted at having to take part in such scene, he retired. Then `Usoof`,
    with much insinuation of elbows and words in Javanese (words as his mother may
    not have approved), managed to obtain tickets just in time to catch the train.
    This train duly landed them at the familiar station, where, as before, the ponies
    waited to carry them up that hill of wonderful views.


