    there was evidently a country fair in full swing, and rows of people lined the
    roadside selling quaint cakes and fruit, and here and there a stall was gay and
    sweet-smelling with little heaps of gathered rose leaves and yellow blooms of
    fragrant chimpaka. The Wodena and his visitor called on the chief Chinese of the
    town, of which race he informed him there were two hundred all told. These people
    scarcely resembled the Chinamen as known to X., since they had all been born and
    bred in the neighbourhood, and not one of them had experience of life beyond the
    island of Java. The head Chinaman produced various curios—so considered—for inspection,
