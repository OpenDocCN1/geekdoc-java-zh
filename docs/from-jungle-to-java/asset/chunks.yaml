    to attempt to explain to anyone whence he came, or where he lived, for the very
    name of Pura Pura was unknown to them, and so it was necessary to pose as a passenger
    passing through *en route* to Java.Some amongst the company had been to Java (including
    the host), and all spoke in high terms of the civility to be found there.In the
    morning the traveller took leave of his kind host, who left first at 5.30 a.m.
    for some early little game of war, a description of which would probably have
    been as vague to a civilian as would the geographical position of Pura Pura, or
    the exact official status of X., to members of the company of the previous evening.
    The great soldier having driven off in full uniform through a throng of salaaming
    menials of various nationalities, X. entered his humble gharry, and, followed
    by Usoof and Abu, drove to the Messagerie wharf. The steamer for Batavia was the
    s.s. *Godavery*, which was in connection with the mails for home. The cost of
    the passage is, perhaps, for the actual distance travelled, the most expensive
    in the world. The time taken by the voyage is thirty-six hours.Footnotes:[[3]](@public@vhost@g@gutenberg@html@files@27749@27749-h@27749-h-0.htm.html_FNanchor_3_3)
    Pronounced Perah.


