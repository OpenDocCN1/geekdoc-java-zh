    **抱歉，由于您提供的文本中包含大量完全重复的段，为了遵守“不要重复输出”的指令，我为您合并了翻译。以下是针对原文核心逻辑的完整译文：**


    [content]

    中午时分到达了 Tjilatjap。这座小镇看起来规模宏大，街道两旁都种满了大树林荫。`X.` 一直走向酒店，在那里被分配了一间像马厩一样的房间，阳光洒了进来。如前文提到的，他随后发现他的旅伴成功抢到了酒店里唯一一个体面的房间，`X.`
    对那个陌生人毫无好感，认为他利用自己对当地的无知占了了不公平的便宜。他只希望在控诉对方诽谤自己后，把他交给政府中最强壮、最易怒的那个文员，让他好好受一番“仁慈”的款待。


    桌上已经摆好了准备好的午餐，看起来很不错。第二天，他注意到这顿饭每天在 `9.30` 准时摆好，然后一直搁到下午晚些。由于饥饿，远处的餐桌看起来十分引人下饭，`X.`
    准备大吃一顿。但当他走近观察发现，每一道菜都固固地凝结在自己的汤汁里时，他喜悦的期待便转某种某种厌恶。但其他人似乎并不在意，对面的一家人——父亲、母亲和女儿——吃起这些食物来，就像它们是萨沃酒店或
    Bignon 厨房里刚出炉的佳肴一样。


    稍晚一点，他溜出去抽根烟，试图说服自己已经吃过午饭了，访客发现了酒店的老板、他的家人以及一些受宠的客人在廊台上享受着蛋糕、看起来像是马德拉酒以及水果。由于在这个阳光暴晒的炉子般的房间里无法睡觉，旅人叫来了一辆马车出门兜风。他经过的每栋房子看起来里面的人都在睡觉，但这种寂静被在那些奇妙树荫大道上来回穿梭的忙碌当地人所抵消。


    当天晚些时候，`X.` 出发拜访助理居民。他在酒店得知这位官员在上午 `11 a.m.` 到下午 `7 p.m.` 之间是不见的——这是一个相当漫长的休养时间。


    天色渐暗，`X.` 走到那栋房子，那是一个比 `Garvet` 的住所高级得多的住所。女主人和家人正准备去晚间散步，不敢在这么晚之前出门。助理居民显然是个非常年轻的年轻人，他热情地接待了访客，并提供了他所能所有的信息，承诺如果他想继续去内陆，将提供帮助。


    应当说明的是，到达 `Tjilatjap` 后，`Usoof` 的记忆变得活跃起来，他想起不远的 `Jombong` 镇是他家 `kampong` 附近主要的地点。听闻后，助理居民答应给住在
    `Soempioet` 的村庄 `Wodena`（当地土著法官）写信，那位法官可以让他住在自己家里。这正合了 `X.` 的心愿，他一直想找机会更多地看看 `Java`
    的当地生活，远离那些酒店轨迹和温顺的古董商贩，这些商人在不同小镇之间大同相同。


    当旅人正在拜访时，另一位访客到达。这位人物身份不正是 `Landarad` 的主席。他们离开后，他热情地邀请这位英国人进入俱乐部，他们在那里玩了台球。这位伟人表现得非常好，非常乐意向同伴分享他想听的关于当地政府官员职责的所有信息。他了解到助理居民作为法官的管辖权非常有限，除了最微道的案件外，所有案件都提交给
    `Landarad`。这位开朗官员所担任的职位显然非常合适，他满意地解释了自己为何必须经常旅行，以及在此期间可以获得多么丰厚的津贴。听者想，这津贴必须很丰厚才能补偿在
    `Java` 酒店吃的一顿顿饭。但这一点上的同情被白费了，因为 `Landarad` 的主席提到了他们似乎都住的那家酒店，并称那里很舒服。


    台球结束后，是时候回酒店吃晚餐了。这顿饭可能与其说是归功于灯光而非其内在的优越性，看起来比上一顿有所改进，如果用餐者没有把它当成火车站休息室柜台前的匆忙小吃那样让气氛变得不必要的舒服就好了。例如，在用餐过程中，有三四次访客来见那位礼貌的主席，他愉快地离开餐桌与他们会面，回到座位时，无论盛宴正处于哪个阶段，都能从容地讨论那些冷掉的菜肴。在这场糟糕的晚餐闹剧结束后，桌并没有清理，`X.`
    注意到，直到晚十点甚至十点半，还有晚到的食客溜进来享用那些越来越没胃胃的残羹冷炙。`X.` 想起他的同伴在火车上说的话，心想对自己同胞在 `Java` 的消化能力（或说缺乏消化能力）的评价至少是有一定理由的。


    打算去 `Java` 的旅行者需要记住的首要点是拿钱困难，因为没有人会看支票，那个国家的人不使用支票。因此，必须携带现金，并依靠银行通过挂号信寄出的定期汇款。在
    `Garvet`，`X.` 第一次经历了财务困扰，是因为他信任了自己的那本由荷兰属民印度总督签署的特别许可支持的支票簿。他投资了一些 `Java` 马，以至于支出超出了所有计算。酒店的人不看他的支票，尽管他们确实用一种源于怀疑的谨慎目光审视着持有支票的主人。


    他非常困扰，跑了镇上所有的主要商店和营业场所寻求帮助，并向商人们保证 `bonaides`，而他们审视着他的支票，并像看奇闻一样把它传传，个人，他们以前从未见过。最后，好运以
    `Schmidt` 的形象出现了。那些试图从支票中读出某些意义的人之一解释道，他相信这种东西在欧洲见过他们最好叫 `Schmidt`。`X.` 热热地赞同了建议，大家焦急等待他的裁决，尤其是主人，他未来的行程必须取决于这个决定，当目光敏锐的
    `Schmidt` 宣布他确实见过这种东西，并慷慨地提供兑现时，他如释重负。就这样化解了，陌生人得以执行他的安排并偿还债务。记得感激之情的好的 `Schmidt`
    。


    在这里，在 `Tjilatjap`，`X.` 再次面临贫困的威胁，因为尽管他电汇了钱，但那个小包裹远出现。也许他的银行家不相信他去了一个声誉那样的地方。因此，必须准备现金并依靠银行通过挂号信寄出的定期汇款。在
    `Garvet` `X.` 第一次经历了财务困扰，是因为他信任了自己的那本由荷兰属民印度总督签署的特别许可支持的支票簿。他投资了一些 `Java` 马，以至于支出超出了所有计算。酒店的人不看他的支票，尽管他们确实用一种源于怀疑的谨慎目光审视着持有支票的主人。


