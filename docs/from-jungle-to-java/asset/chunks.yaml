    sleeves. Though in the native states from whence X. came it is no uncommon thing
    to see Malays wait at table, yet in Singapore, with the exception of Indian servants,
    it is very seldom that there are any attendants but Chinese.Perhaps the most striking
    feature of the meal was the absence of bread. This could be procured, when asked
    for, but was not provided, as it is elsewhere, as a matter of course, and was
    regarded as an extra. An excellent arrangement of this marble hall was that it
    was permitted to smoke immediately after lunch. As, availing himself of this,
    X. smoked his cigarette and meditated contentedly, he noted all the various details
    which might interest The Community at home. One rather prominent detail was a
    lady at a neighbouring table dressed only in a sarong and kabaya, with her extremities
    bare. The lower portion of these were thrust into some loose sandal slippers,
    the upper turned back as far under the chair as the stretch of the sarong would
    allow. It was not a costume which, from X.'s point of view, appeared elegant,
    though, like most articles of apparel worn by beauty, capable of becoming elegant
    if elegantly worn; still in the present instance more natural elegance would be
    required in proportion to that of the costume, there being so little of the latter.
    Returning to the publicity of his apartment, X. was met by Usoof and Abu, both
    with very long faces and evidently in considerable distress. On being interrogated
    it transpired that they had nowhere to bathe. Now to bathe, and bathe constantly,
    is as necessary to a Malay as are regular meals to a European. X., being sadly
    aware that he would be held responsible for everything that went wrong or did
    not fit in with the exact views of these children of nature, thought it best to
    be brave at the commencement of things and affect an indifference which he was
    far from really feeling, and, therefore, with a jerk of his head towards the canal,
    replied that that was where people bathed. "Yes, perhaps *people*," said Abu,
    with meaning, and then for fear X. should not be sufficiently intelligent to catch
    the tone, added "people who don't mind filth or water like that in a drain." This
    seemed to need no answer, and as Usoof had reserved his remarks X. knew that worse
    was to come, and he would be more prudent to wait and reply on the whole question,
    instead of being drawn into argument as though he were actually to blame for this
    terrible state of affairs. But as Usoof still kept silence X. rashly thought he
    had gained an easy victory, and airily added, "All right, you must make the best
    of it and go to the canal." Then the reserved remarks found vent, "Was the Tuan
    aware that all the women in the place bathed there?" "Yes," this had to be admitted,
    since the Tuan himself had noticed it, and, as has been recorded above, not without
    some comments of his own. "Then how can I bathe there at the same time?" continued
    Usoof, "I should be ashamed." "Well, if they are not you need not be," rather
    frivolously replied his master, as he sought escape from further conversation
    by burrowing in a box full of books. It may as well be recorded here that the
    couple never did bathe in that canal, and eventually drove some miles into the
    country, where they performed their modest ablutions by a village well. They also
    refused to permit any clothes to be sent to the wash in Batavia, and they were
    not far wrong, since the water of the canal was equally unfitted for washing either
    clothes or the human body it was their office to adorn.
