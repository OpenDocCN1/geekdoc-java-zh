- fmt: "\nThe voyage on board the `Godavery` resembled similar ones, with the notable\
    \ difference that the excellent cuisine made X. wish that the time to be spent\
    \ in transit were longer. The only people who were not contented were Usoof and\
    \ Abu, for each of whom their employer was paying the sum of three dollars a night.\
    \ These particular Mahomedans refused to touch the food shovelled out to them,\
    \ and to crowds of natives of all colour and class—by the rough and ready Chinese\
    \ servants, and towards the end of the second day, having eaten nothing, they\
    \ presented a very woebegone and miserable appearance. However, a few more judiciously\
    \ placed dollars produced them a square meal of bread and tea, after which they\
    \ smiled.\n\nThere is perhaps no sensation so agreeable as the arrival in a strange\
    \ port. Thoughts and conjectures as to the possibilities that lie beyond the landing\
    \ place are innumerable, and fancy and anticipation are equally strong. When the\
    \ `Godavery` steamed into Batavia it was still dark and the rain was coming down\
    \ in torrents. It all looked miserable enough, but, once alongside the wharf,\
    \ daylight began to appear and the passengers trooped ashore. The station was\
    \ more than a quarter of a mile from the place of landing, and this distance the\
    \ poor people had to hurry along in the rain.\n\nThe unfortunate natives—carrying\
    \ bundles containing their belongings—were drenched to the skin. Also the European\
    \ passengers—less objects of pity, as only the portion of their wardrobe actually\
    \ worn was exposed to the rain—came in for a considerable share of the moisture\
    \ of that wet arrival. It is true there was a magnificent covered way, but this\
    \ was hopelessly blocked up with trucks and other railway gear, which were, presumably,\
    \ more susceptible to cold than the passengers. The luggage was quickly and courteously\
    \ passed by the Custom House officials, and the travellers entered a luxuriously\
    \ fitted train—apparently a show train, as X. never met another like it in Java.\
    \ \n\nArrival in Batavia town created a good first impression, as there were no\
    \ pestering crowds, as there are in Singapore, and there were many carriages waiting\
    \ for hire, all two-horsed and good. The drive to the hotel was a long one, through\
    \ the business portions of the town, till the residential side was reached. Here\
    \ detached houses are situated alongside the principal road, on the other side\
    \ of which flows a canal, giving to the place an appropriate Dutch appearance.\n\
    \nThe hotel was a most imposing building outside, with apparently countless rooms,\
    \ but the thing which immediately struck X. as something uncommon was the fact\
    \ that the floors of the apartments were level with the ground and not raised\
    \ as is the case in Singapore and the Peninsula, and he felt feverish as he noticed\
    \ it. The traveller was allotted a fair sized room opening on to a court yard,\
    \ with other rooms and other openings to the right and to the left, and in fact\
    \ all round him, and in front of these rooms sat people in every stage of deshabille.\
    \ There seemed to be no privacy and what, perhaps, under the circumstances was\
    \ fortunate,—no shyness. X. however had not yet reached that point of his observations,\
    \ and, entering his room, he shut the door and ordered his first meal in Java.\
    \ \n\nThis turned out to be a terrible repast, consisting of a plate of cold clammy\
    \ selections from the interior of some edible beast, two cold hard-boiled eggs,\
    \ three small cold fish roasted in cocoanut oil, and something intended to resemble\
    \ ham and eggs. This first meal is mentioned in detail as it was but a foretaste\
    \ of an equally trying series. X. thought of Dagonet and that power of description\
    \ which, when relating dyspeptic woes, will compel the sympathy of the hardiest\
    \ feeder.\n\nIt did not take long to skim hastily over the surface of these uninviting\
    \ viands, and now X. turned his attention to the notices which stared at him from\
    \ every wall. These in many languages threatened all travellers with penalties\
    \ if, immediately after their arrival, they neglected to obtain permission to\
    \ reside in Netherlands India. After reading this, X. lost no time in sending\
    \ for a conveyance to drive to the British Consulate. The gentleman who received\
    \ him there was extremely civil and gave him all the information in his power.\
    \ It appeared that if the traveller was anxious for facts about Java, the officials\
    \ of that country were equally so in requiring the same from him, and he was obliged\
    \ to fill in a printed form stating his age, birthplace, residence and occupation,\
    \ etc., and, when this was done, pay one guilder and a half for his trouble. \n\
    \nThe next step was to go to the Bank, and nothing could exceed the kindness with\
    \ which he was received at this place, and the thoughtful manager assisted the\
    \ stranger to decide where he had better go in order to best see something of\
    \ the country, and what was most to the point, wrote for him the names of places\
    \ and hotels which seem outlandish and terrible on first meeting with them. X.\
    \ learnt to his dismay that the system of obtaining money by cheque was almost\
    \ unknown, and it would always be necessary to carry money and, when more was\
    \ wanted, receive it by registered letter through the post. The idea of carrying\
    \ ready money to a person who had for years followed the customs of the East and\
    \ depended on cheques and \"chits,\" seemed a new trouble for which he had not\
    \ been prepared.\n\nOn the drive back to the hotel through streets sloppy with\
    \ mud, the first new impression made upon the traveller was caused by the number\
    \ of natives selling vegetables—good wholesome English looking specimens, especially\
    \ carrots. This was a refreshing sight after years of seeing no familiar vegetables,\
    \ except those which passed long periods of imprisonment in tins.\n\nAll along\
    \ the route natives of either sex were bathing in the filthy water of the canal\
    \ without even a suspicion of that modesty which characterises the Malays. Impression\
    \ No. 2 was noted to the effect that none of the natives wore boots or shoes,\
    \ and all plashed barefooted through the mud. He had already had his attention\
    \ called to this absence of shoes when coming up in the train by the notice (not\
    \ to say the excitement) attracted by the neatly-booted feet of his followers.\
    \ \n\nCould it be possible that they would also be obliged to go barefooted through\
    \ the muddy streets? And still worse thought—would it fall his lot to break it?\
    \ The natives all appeared larger and more built than the Malays of the Peninsula,\
    \ but, as in Singapore, they were a hybrid lot, and more remarkable still, no\
    \ Arabs. To those readers who may not visited that part of the world of which\
    \ I write, it should be explained that Singapore is almost entirely populated\
    \ by Chinese, and in the native states they materially outnumber the Malays, so\
    \ that the eye is accustomed to see them everywhere and regard them as the real\
    \ inhabitants.\n\nReaching the hotel X. was relieved to find that Usoof and Abu\
    \ had discarded their boots, and were picking their way delicately across the\
    \ courtyard. Then he prepared to get ready for his own lunch, and next to bathe.\
    \ In order to do this it was necessary to run the gauntlet of many eyes, as the\
    \ bathroom was some distance off, and to reach it, the entire length of the verandah\
    \ must be passed. This verandah opened the doors of bedrooms, and sitting in front—exactly,\
    \ as Abu remarked, like vendors holding stalls in a market. The long chairs were\
    \ of the luxurious kind, with short seats and long movable arms, and on which\
    \ the occupants extended their naked feet. Ladies also sat there, in what X. subsequently\
    \ learnt was not considered deshabille, namely, the sarong and kabaya of the country.\
    \ It required some courage to take that first walk along the verandah, but things\
    \ seldom continue to seem strange, unless other people look as if they thought\
    \ them so, as these reclining rows of visitors lay back doing nothing, not even\
    \ reading, with an air of unconcern, it was not difficult for X. to assume one\
    \ too, himself clad in wondrous garments made of gaudy silks woven by the skilled\
    \ natives.\n\nLunch was perhaps the first real revelation of life in Java, since\
    \ it introduced the traveller to that which a majority of the people seem to live\
    \ for (and always sleep after)—the rice-table. This rice-table has been so often\
    \ described that it need not be done in detail here; but the basis, as it were,\
    \ of this rice-table is, as may be supposed, rice, and with this foundation in\
    \ your plate, innumerable dishes of eggs, fish, meat, etc., are offered by a string\
    \ of attendants, who expect you to put some of each on the top. Probably this\
    \ is only a literal and exaggerated interpretation of a Malay curry, which is\
    \ incomplete without the countless relishes which should accompany it. This particular\
    \ dish, or rather function, is seen in its fullest development in the up-country\
    \ places, visited later, and the one in Batavia was scarcely a fair sample, as\
    \ though X. was unaware of this at the time, its proportions had evidently been\
    \ toned down and diminished out of deference to the cosmopolitan character of\
    \ the guests, who, probably like our traveller, had on former occasions given\
    \ their ignorance away by asking for more plates and taking each dish seriously,\
    \ as though it were a separate course, sent up before its time, at the risk of\
    \ getting cold. To a person accustomed to Singapore there was something novel\
    \ and cheering about the first meal in the vast dining-hall of this hotel. The\
    \ floor was of marble—scrupulously clean—and the Javanese waiters were dressed\
    \ in a uniform of white trimmed with red, presenting a pleasing contrast to the\
    \ slipshod dirty \"boy\" of an ordinary hotel, whose habit it is to clatter round\
    \ flapping your face and brushing your food with his long, unclean, hanging sleeves.\
    \ Though in the native states from whence X. came it is no uncommon thing to see\
    \ Malays wait at table, yet in Singapore, with the exception of Indian servants,\
    \ it is very seldom that there are any attendants but Chinese.\n\nPerhaps the\
    \ most striking feature of the meal was the absence of bread. This could be procured,\
    \ when asked for, but was not provided, as it is elsewhere, as a matter of course,\
    \ and was regarded as an extra. An excellent arrangement of this marble hall was\
    \ that it was permitted to smoke immediately after lunch. As, availing himself\
    \ of this, X. smoked his cigarette and meditated contentedly, he noted all the\
    \ various details which might interest The Community at home. One rather prominent\
    \ detail was a lady at a neighbouring table dressed only in a sarong and kabaya,\
    \ with her extremities bare. The lower portion of these were thrust into some\
    \ loose sandal slippers, the upper turned back as far under the chair as the stretch\
    \ of the sarong would allow. It was not a costume which, from X's point of view,\
    \ appeared elegant, though, like most articles of apparel worn by beauty, capable\
    \ of becoming elegant if elegantly worn; still in the present instance more natural\
    \ elegance would be required in proportion to that of the costume, there being\
    \ no blank.\n"
