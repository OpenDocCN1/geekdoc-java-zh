    ## CHAPTER XX.


    BACK TO THE JUNGLE.'
  toc: []
  trans: '


    对于 Usoof 和他的母亲来说，伟大的 Wodena 本身就是善良化身，她用爪语与他们交谈，非常亲切。X. 渴望看到真正的乡村乡村，并在避开当地当局无处不在的目光下与人们交谈，便承诺那天下午去拜访这位老太太的祖宅。几小时后，他乘上火车前往下一站
    `Tambak`。显然，以前从未有欧洲做过这种事，车站里为了找一张一等甚至二等座票而引起了一阵骚动。在寻找过程中，铁路官员表现出最天真的好奇心，毫无顾忌地向这位旅行者提问。`X.`
    到达 `Tambak` 后下车，站长立刻迎了上来，礼貌地向他保证他错了，因为大镇 `Gombong` 是再往一站。他显然无法相信会有欧洲人会特意在 `Tambak`
    下车，并将 `X.` 礼貌地坚持自己知道要去哪里看作是某种神智异常的表现，并决定视其无害而忽略掉。这位体面的绅士比划着手，惊叹着，吸引了一小群围观者，只见那个白人在
    `Usoof` 的跟随下悠闲地走出车站。一旦消失在视线外，站长看到 `X.`——这个其实完全不知道自己要去哪里的人——转身向他的随从问路，将会感到无比欣慰。于是他们向左转，沿着一条喧闹河流的岸绕行，走在水边旁成林道的巨树树荫下。在他们右侧是无边无际的稻田，有初期的翠绿和成熟的金黄，在阳光下同样闪烁着光芒。成熟稻谷与新种秧苗并存的景象，形成了爪哇农业的一个显著特征。当他凝视着这幅温暖的画面，并庆幸有人先见地种了这排宜人的树时，后方传来
    `Usoof` 的声音，宣布现在必须右转。向右转自然意味着穿过那片阳光照射的平原。`X.` 的手不由地摸向他僵硬的立领，尽管他看不到随从者的脸，但他通过背部感觉到对方在微笑。爬过一个简陋的木栅后，他们向右转，走过稻田，那里昏黄的光线在玉米上方闪烁。不久，一个村庄的红屋映入眼帘，`Usoof`
    的声音再次响起，介绍他的出生地。这很有趣，补充信息也如此：他们现在必须跨过的小河就是他祖传土地的边界。他们远道而来看的房子深在无数果树的阴影中，上方耸立着树龄巨大的棕榈树。修剪得如此整齐的绿草坪，以及围绕中心房屋的小的小建筑群，共同构成了一幅如画的风景。


    在这些草屋前的绿草坪上是客房——一座方形建筑，四周环绕着长凳，中间放着桌子。在这里，这位异乡人在无数爪哇亲戚、堂兄弟姐妹和婶婶的簇拥迎接下——因为这看起来不像一个家庭，而像是一个聚在一起为他尽荣的部落。然后，客人坐在主位上，面前摆着大铜盆，盛着各种水果。这真是一个令人愉快的地方，一想到在几乎没有引导的情况下，他们没有经过漫长的寻找就找到了这里，便感到格外满足。随后是对话，在此期间，访客得知并传达了许多事情。在得知的信息中，他听到以前在修铁路时，附近曾见过一个白人，但这次是村子里第一次近距离见到白人。而这位陌生人告诉他们关于马来人以及与他们一起的生活，他们的房屋和习俗与他们很相似；而只有
    `Usoof` 勇敢地保持正直，充当翻译，这时一群棕色皮肤的年轻亲戚抓着他的手，无情地抢夺了他的怀表和链条、铜纽扣，以及口袋里所有的零硬币。然后，心怀财产权的
    `X.` 要求查看他们土地的契据，契据被拿出来并检查了，他们被嘱咐了如何办理，以便在时候来临时，缺席的 `Usoof` 作为长子能获得他应有的继承份额。


    接着，随着影子拉长，稻田上的折线光已已被晚风吹拂的柔和醇和的光所取代，`X.` 发出了出发的信号，宣布必须告别了。他匆忙完成自己的告别，朝河流走去，这样他就不会目睹那位母亲再次失去失去多年的儿子的痛苦，但他无法逃避身后传来的抽咽声。那两个人的小队伍——那个戴着歪斜领子的欧洲人和失去了所有华服的爪哇人——再次开始穿过平原。但队伍越来越大，因为亲爱的亲戚们一个接一个匆忙跟在后面，只为多看一眼离开的兄弟或多说一句。这时，旅行者开始觉得自己比以前任何时候都像个野兽，便建议
    `Usoof` 向他告别，并永远回到他哭泣的家庭怀抱中。但他拒绝这样做，在那个简陋的木栅处，真正的离别发生了。


    到达火车时，那位好心的站长仍在张望并走动，仿佛发生了什么不寻常的事，但由于疲倦又炎热，`X.` 有些生地回答了他的提问。但这位采访者非常执着，就像是伦敦晚报的记者一样，在拿出一个倒置的小推车供
    `X.` 坐后，去他屋子里拿了威士忌苏打——当地人称之为“荷兰水”。在阳光下走了之后，由于吞食了奇异的水果和调料导致整个生理和神经系统变得紊乱，加上目睹了令人心碎的家庭告别，这突如其来的威士忌苏打，在那种这种恢复剂似乎像刚刚出现的月亮一样不可得时，实在受欢迎了。站长立刻掌握了局面，而那个此前沉默寡的英国人在口渴得到缓解、四肢得到休息后，变得像职业明星一样健于交流，并像自己律师手中的自愿证人一样，完整且顺从地回答了所有问题。


