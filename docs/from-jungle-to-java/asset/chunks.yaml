    ## 第十四章。加尔维特。


    离开`X.` 庄园小屋后，他出发前往加尔维特。当火车到达目的地时，窗外的景色无疑是想象中所及的最美风景之一。绵延的稻田，背景是高强度开垦的丘陵，整片土地被细细的奔涌小溪流环绕，在四周环绕的阳光下显得清凉宜人。言语已无法描述旅行者眼中的景象，也无法以任何方式恰恰呈现它的美。这种景观完全是全新的，与在其他国家看到的任何景象都不同，也许只有锡兰或日本除外，值得从欧洲专程来此一看。


    加尔维特的酒店是由许多小建筑组成的，散布在主建筑周围的花园里，或者在路对面的独立围栏内。`X.` 入住了其中一座小屋，本以为会过得相当舒适，直到对沐浴设施的检查令他打了个冷颤。晚餐时间到了，*自助晚餐*（table
    d''hote）也消灭了他的幻象。那里同样没有风扇（punkah），同样有刺眼的光线，以及接接一个半熟且湿腻的菜肴。那里只有几位食客，显然大多是住在酒店里的当地住客。这些绅士穿上了黑色大外套，为晚餐做了一番装扮。但他们忍受的苦罚是短暂的，因为在匆忙吃掉足够满足个人需求的食物后，他们就回到了自己的阳台，`X.`
    很快就看到他们穿着睡衣、光着脚，正舒服地躺着。显然，文明的外壳并不薄到足以让人感到自在。


    早晨，旅行者去拜访助理驻守（Assistant-Resident），对方非常友地接待了他，并提供了所需的所有信息。这在某种程度上干扰了办公室的工作，因为每当助理驻守向任何员工询问某地有多远，或者车费标准等时，被问及的人无论多忙，在回答之前都会立即跪在地上。摄政（The
    Regent）也正在拜访政府代表，并向他介绍了这位英国人。这位当地官员胖胖的的长相不错，但看起来并不算聪慧。


    助理驻守非常友好地与访客自由讨论了影响当地人的事务，并给了他大量信息，这些信息由于他在 `Pura Pura` 的工作性质，让他产生了极大兴趣。对于对该主题感兴趣的人来说，爪哇的土地制度已广为人知，无需在此评论，但
    `X.` 学到了一些事实，可以消除那些未研究过此问题的人对法律残酷或复杂的误解。事实上，这些法律似乎达到了简洁和简单，这正是对待当地农民时的极大追求。因此，在土地产之前之前人们无需支付租金。咖啡是唯一必须向政府出售的产品。所有土地都经过分类并缴纳固定租金，因此有了确保业主的成果不会被征税。任何人如果认为土地定价过高应属于较低等级，都可以投诉，且投诉会得到立即关注。尽管人口众多，但稻田的边界标记很少出现纠纷。所有者满足于长期的习俗和当地知识，他们对当地官员的依赖从没有失败过。所有新土地如果与政府土地相邻，就必须围起来，在所有种植园里，人们必须自己种树作为边界并进行维护。只需一份填满栏目并根据耕作和分类签字的权属登记簿，就能解决所有问题。最后，必须提到有一条金律：当地人不能将土地卖给本国以外的任何人，无论是卖给欧洲人、阿拉伯人还是中国人。因此，任何个人受投机诱惑，都不会通过其自私行为给邻居造成伤害或困扰。上述提到的这份权属登记簿随着土地的开发而逐渐填写并签字，从而对每块当地人土地的实际状况保持了准确记录。当最终签字且土地产出时，就会要求缴纳租金。这种简单的优势只有那些命中注定要扮演报喜者的人才能体会到——他们必须向无知的当地人口解释最后那部新土地法及其众多条款的优点，而这些人人是不理性的，顽强地紧抓着他们已经拥有并认为自己理解的头衔，固执地拒绝无论说话者表现得多么有说服力，去交换现存最先进土地法中能给他们的最新条款。


    在与那位礼貌的官员面谈后，`X.` 离开了，思考着他听到的这一切，并带了一份备忘录，上面写着被推荐访问的附近感兴趣的地方。回到酒店时，旅行者经过了一个看起来像当地俱乐部的地方。一个在印度或半岛外站工作的英国官员，对于带着介绍而来的陌生人，做的第一件事就是提议让他入住俱乐部，除非有强力理由反对，否则他可能会邀请他吃晚饭。显然这里没有这种习俗，所以
    `X.` 可以自由地在小镇上闲逛探索，没有什么更令人期待的，就是和那些穿着午餐服的受苦租户一起，重温昨晚那顿令人毛骨的晚餐。


    ## 第十五章。温泉与火山。


    '
- fmt: '

    Garvet seemed to boast of an enormous population for there were endless rows,
    or rather groups of houses, crowded together, face to face, back to back, and
    side by side, giving the idea of a casual conglomeration of several villages.
    All these were scrupulously clean and neat, and fenced round with little bamboo
    rails. Nearly every house had a tiled roof, and all were of a superior class to
    the majority of those up country in the Peninsula. The streets were little short
    of marvellously swept and clean, and it was decided by `X.` during that walk that
    Garvet was the cleanest Eastern town he had ever seen—the capital of `Pura Pura`
    of course excepted.


    Much had been talked of about the hot baths at `Tji Panao`, and so the traveller
    determined to make that his first excursion. Hiring a conveyance drawn by three
    ponies abreast—reminding him of his early youth when he would wonder at a smart
    turn-out in the Park at home—three ponies abreast driven by a well known leader
    of society and fashion, before the days of two-wheeled pony carts and bicycles,
    `X.` told the driver to go to `Tji Panao`, and looked forward to spending a delicious
    half hour lying in warm water like that of the springs in `New Zealand`, which
    send the bather forth invigorated and refreshed.


    Another disillusion was in store for him, however, in this country where nature
    has done so much and man—for comfort—so little. The baths were located in a shed
    on the side of a hill. This shed had three partitions. In each partition was a
    shallow brick hole in which it was possible to sit. The hot water was conveyed
    into these holes by means of pipes, one at the head of each. The floor all round
    the bath was dirty, and the only furniture was one cane chair. The depth of the
    water in the baths was about three inches, and in this on slimy bricks the bather
    had to sit miserably, with the lower portion of his body immersed in warm water
    while the upper remained high and dry in the comparatively cool air above. `X.`
    had made preparations for a prolonged stay in the water, and came provided with
    literature to pass the time, but a very brief dip under the circumstances proved
    enough, and he soon unhitched his clothing from the back of the chair and prepared
    to depart.


    Close by these baths was a building containing four rooms, apparently a `Government
    Rest House`, very well furnished and comfortable, so it was evident that people
    came there on purpose to make use of the baths. The hot water springs possess
    great capabilities, and with a little trouble and expenditure of money they should
    become both enjoyable and a source of revenue.


    There were one or two other excursions to be made from Garvet, but the only one
    worthy of mention was that which was made to the volcano at `Tjiseroepan`. One
    morning, together with `Usoof` and `Abu`, for `X.` was growing tired of sight
    seeing all alone, having obtained permission from the kind `Assistant-Resident`
    to use the `Government Rest House`, he drove to `Tjiseroepan`. The road was excellent
    and the route, needless to say, lay through a beautiful country. Here, as everywhere
    else, all well-to-do natives were riding ponies. The distance was thirteen miles.
    `Tjiseroepan` is a little village in the hills at the foot of the mountain which
    it was proposed to ascend on the following day.


    The traveller was received by the `Assistant Wodena`, a native official who had
    been riding suspiciously behind and before the carriage during the last two miles.
    After reading the credentials of the stranger and finding that he could converse
    in Malay, the local magnate became quite cordial, and made `X.` free of the `Government
    Rest House`. This was well furnished with beds and tables, etc., but glass and
    crockery were not provided.


    The `Assistant Wodena` conducted the visitor round the village, which was a model
    of neatness. Each house stood in a garden, growing coffee, vegetables, and strawberries.
    The head of the village and a few others live in very good houses, and there seemed
    to be ponies without number. The village perched on a slope and the cultivated
    hillside bore some resemblance to a scene in the South of Italy. The usual signs
    of prosperity and content reigned everywhere, and neither in this village, nor
    elsewhere, where `X.` conversed with the natives could he find anything to explain
    the commonly accepted view that the people of Java are inimical to their rulers.


    The `Rest House` proved comfortable, `X.` had brought his own provisions, which
    his servants cooked, and for once he enjoyed a hot and palatable meal. There was
    plenty of opportunity for conversation with the `Assistant Wodena`, who was quite
    willing to discourse on the customs of the country, and he gave a most interesting
    account of the elaborate etiquette of `Javanese Rajas`, and of the extraordinary
    deference paid by commoners to rank. He in his turn asked many questions concerning
    `Malacca` and the `Malay Straits`, about which his interlocutor was able to give
    him all the information sought for.


    The next morning the sightseer and his followers ascended the mountain on ponies
    to see the volcano. This was a kind of inferno with wicked mouths which looked
    like ventilators from the bowels of the earth spitting and hissing blinding steam.
    The whole face of the mountain was yellow with sulphur, and the air was sickening
    from its smell. `Usoof` and `Abu` were not a little terrified by this awful experience,
    and grasped their `Tuan` by the arm entreating him not to venture near what, they
    evidently thought, were the gates of hell.


    I feel that I have paid sufficient deference to my instructions in recording the
    impressions the scenery made upon the traveller, and shall therefore omit all
    mention of what he saw while descending the mountain. He described it as wonderful,
    and those of my readers who have arrived thus far will be prepared to admit the
    accuracy of the description. The party reached Garvet in time to catch the two
    o''clock train to `Tassikmalaja`, and thus make a start for `Tjilatjap`.


