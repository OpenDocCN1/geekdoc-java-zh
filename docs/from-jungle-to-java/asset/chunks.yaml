    在他抵达的周日下午，`X.` 拒绝了一份前往剧院的热情邀请，决定动身前往布滕佐格（Buitenzorg）。他觉得自己在一楼的房间里闻到了除了其他明显气味外混杂着发热的味道，而
    `Usoof` 和 `Abu` 不仅无法洗澡，甚至无法把衣服送去清洗。各种理由与气味的交织令人十分强烈。


    这里可以提一句，这在当地和任何其他地方一样合适：爪哇所有的活动，从总督的招待会到巡回表演，都在周日举行。火车于下午 4:30 离开巴达达，`X.` 于六点到达布滕佐格。


    关于布滕佐格的误导性描述太多了——它是爪哇的华盛顿，让 `X.` 被深深地欺骗了。那里确实是一个美丽的地方——事实上精美绝伦，但当一个旅行者付了钱却得不到人类的舒适时，他对自然之美是难以满足的。对于一个长期被半岛茂密丛林所困的陌生人来说，旅途中中最令人愉快的特征无疑是那长片开阔的土地，让他想起了家乡窗外掠过的牧场和田野。牛群和小马增添了这种幻觉，`X.`
    几乎无法抑制内心的喜悦赞叹。


    ### 抵达 Belle Vue 酒店


    旅行者被反复告知，务必在 Belle Vue 酒店获得一间房间，如果可能，最好是一间能俯瞰后方著名景观的房间。这通过电报达成了。抵达后，一辆由三匹小马拉的马车将他送到酒店——那是一座位于优美位置的简陋建筑，处处充满了可能。


    著名的后露台房间位于入口对面的院子深处，安置好后，`X.` 对窗外的景色非常满意。窗户正下方就是铁路线——下方是一条宽大、平缓且浅浅的山河，一半当地人似乎都在那里沐浴。远处延伸着一片连绵不断的、风景如画的村庄景色，散落的红屋房屋在棕榈树和其他优雅的树木间若隐若现。再往外是山——山上有五个明显的糖锥峰，当山峰在悬挂的云层中交替出现和消失时，数数的时候必须时刻盯着。是的，这景色绝没有被高估，`X.`
    庆幸自己来了。


    ### 晚餐体验


    `Usoof` 和 `Abu` 拒绝考虑任何美事，只能对河里沐浴的人感到惊恐并惊呼，这些人显然冲击了他们对得体的观念。他们的主人对这些评价并不感到意外，但他自己的观点更开阔，道德直觉或许更迟钝，而且经验教会了他关于罗马和罗马人的禁令在得体上的正确性。但尽管如此，可以肯定的是，即使是最温和的伦敦郡议员，也无法在看到那条河流而不受到心理冲击。


    在走廊上尽情欣赏了景色后，他换上一件黑色大外套吃晚餐，随后他发现这让自己显得格外显眼，于是他穿过院子进入餐厅，准备享用鲜鱼、羊肉和其他当地特产大餐。尽管汤已经放在桌上变凉，客人们仍坐在外面的小桌旁，喝着金酒苦味水。`X.`
    不想要（正如 `Clark Russell` 会说的那样），他在风中徘徊，几秒钟后——看到晚餐确实准备好了——他坐了下来。这个孤立的行为让他几乎和他的外套一样显眼，那件外套在阴郁的光彩中也显得格外孤独。


    不久其他人也效仿这位陌生人的做法，晚餐开始了。紧接着是一段幻灭期。没有蒲扇（风扇），灯光刺得人睁眼，而且食物——所有的食物——都是粗糙、油腻且冰冷的。等在那里的汤是种所谓的罐装汤，这是一个老朋友，`X.`
    原本希望把它留在丛林里直到他回来。这些汤和其他菜肴，本不会变得那么重要，但由于酒店的老板——一个傲慢的绅士（`X.` 事后得知他是赛马俱乐部的主席）守在门口，一排仆人端着盘子从那里出来，严密监视着每位客人吃了什么，并用鹰利的眼睛察觉那些失败的食客试图用刀叉掩盖的无法下咽的残渣。


    用餐过程中最有趣的事情是一对老英国夫妇的对话，他们以一种典型的英国游客风格似乎以为自己是独处的，而周围的人只是蜡人，既听不见也无法受到他们所说的话的影响。“噢，他们怎么把鱼浸在油脂里，”女士会惊呼道；或者，“这肉不错，但坏了，是的，完全是在烹饪上彻底坏了；看啊，亲爱的，它是（怀疑地嗅了嗅她的盘子），它完全浸透了油脂——噢，真可惜，亲爱的，你怎么能吃得下去——但你什么都吃，”，”说话的人喋喋不休地继续道，“因为你昨天在那艘蒸汽轮上吃那条鱼时，它已经快烂了——在我们出发前，我在舱房里就闻到了，等等，”等等，还有很多类似的话。对于所有这些家常闲话，她的同伴没有回应，而是继续吃他的晚餐，仿佛习惯了这种伴奏一般。


    ### 咖啡事件


    `X.` 忍住不笑已经竭尽全力了，由于担心伤害他人的感受，他在老板看过来时又盛了一份，并对同胞的行为感到异常“火大”。然而，更糟糕的事情在后头，在晚餐结束后，当那些“小伙子”送来按照当地习惯冲泡的咖啡——杯子里只有几滴咖啡精，这种做法在当地很常见——由于杯底只有几滴咖啡，必须用牛奶或水加满——这位英国女士无法抑制自己的愤怒，她大声责备仆人放得太少，因为“咖啡应该是便宜的”，然后把杯子里的内容倒成两份，一份自己的，一份丈夫的，一边笑着说“我们要喝咖啡，不是别的。”


    这时当她喝着那满杯咖啡时，不情愿地意识到自己犯了错，女士进一步询问仆人：“你们在爪哇总是这样喝冷咖啡吗？”仆人在这种“抢劫”发生时只能被动接受——因为全场客都在等第二壶咖啡——用他仅有的英语单词回答道：“是的。”`X.`
    拥有既能听又能看到一切的优势，在看到自己被剥夺了餐中唯一可能美味的部分时，他狠狠地瞪着，甚至觉得可以用餐巾和面包当作弹弓和石头来引起干扰。那个当地人的“是的”似乎平息了女士开始感尴尬，她胜利地惊呼道：“天哪，什么地方啊。”然后丈夫不舒服地揉鼻子，引起了她的注意，他的贤妻惊呼道：“亲爱的，你感冒了，我们去睡觉吧，”他们走了。`X.`
    以及可能的其他人，对人们在吃了像这对夫妇那样的东西后还能睡觉的想法感到满足，但他们绝不会睡着。他们也没有睡，正如后续所示。因为这对夫妇也有一间露台套房，而这间房间与
    `X.` 的房间只隔着一层薄墙，尽管他不想听，但第二天早晨迎接他满足的耳朵的第一句话是：“噢，亲爱的，我昨晚过得太糟糕了；我没合过眼。”`X.` 没有再听下去，他小心地把头埋进枕头里，以免被卷入更多的家事；但他已经听够了——他报仇了。


    '
