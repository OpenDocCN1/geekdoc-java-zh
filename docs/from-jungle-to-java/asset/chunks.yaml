    前往朱拉恰普（Tjilatjap）的程程如此不寻常，以至于单独成章。显然已经多年没有人从加维特（Garvet）前往朱拉恰普了，因为那里被称为岛上最不健康的地方之一。旅行者的正确做法是先去塔西马拉雅（Tassikmalaya）住一晚，然后从那里乘火车前往乔恰（Djoeja），再乘车到达波罗（Beroboeddoer），并在政府宾馆住宿。车程二十五英里。第二天早上，旅行者应该再开车十英里到达望格兰（Magelang），而行李则通过火车或牛车运。从望格兰出发再开车二十英里到达安伯拉瓦（Amberawa），从这里可以乘坐火车前往三宝（Semerang）或返回乔恰，然后从那里前往三罗梭（Solo），那是一段三小时的路程。


    `X.` 被告知大家都走的是这条路线，但他坚持要前往朱拉恰普，尽管酒店的女主人向他保证，那里是该国发热最严重的港口。如果他当时知道像他后来了解的关于该地恶名的那许多信息，这位旅行者可能会改变计划。事实是，他只回答说他对发热已经习惯了，不在意。那时他并没有特别的理由去某个地方而不是另一个地方，因此驱使他朝这个方向走的地方足以满足他的目的了。


    `Usoof` 希望开始寻找他的母亲。他不记得出生的村庄，但认为是在海岸附近的某处，考虑到这个国家是一个岛屿，这个说法有些模糊。在协助他的主人（`Tuan`）研究地图后，他惊呼道朱拉恰普这个名字听起来很熟悉，事实证明那确实是沿海的一个大镇。现在，他辩称，除非他以前听过，否则就不可能熟悉，而那只可能是在他在爪哇的时候，由于那时他只不过只是个婴儿，只有出生地附近的地名才是他熟悉的。


    对于 `X.` 来说，去哪里并不重要，越是远离偏僻路线，就有越多机会研究当地人并了解他们的生活。因此，他乐意同意前往朱拉恰普。只有在所有计划都确定之后，才听说了那里发热的恶名。


    旅程的第一阶段是前往塔西马拉雅（Tassimalaja），他们在两点离开加维特，到达那里时正好赶上晚餐。从在黑暗时刻和清晨的短暂逗留来看，这里似乎是一个很小的乡村小镇，但火车走得很早，没什么时间闲逛。第一个重要的停站是马奥斯（Maos），在那里必须换乘。乘客中有一位英国人，`X.`
    十年前在纽约见过他。他正打算沿着正规路线前往乔恰（Ojoedja）和三宝。这两位英国人都是经验丰富的旅行者，交换了对爪哇的各自印象，并一致认为，无论他们去哪里，所得到的礼遇和帮助至少不亚于甚至超过了他们在游历世界其他地方时的遭遇。在马奥斯，他们分道扬扬，但命运让他们在前往新加坡的轮船上再次重聚。


    旅途的另一位伴侣是一个学多才的荷兰年轻人，他通多种语言，证明是一个非常好的伴侣。这位先生显然对他在爪哇看到的同胞没有太大的赞赏。他同样无偏见地抨击那里的食物和生活方式，并宣布爪哇的荷兰人既没有消化能力也没有精力。他们实际上已经因为糟糕的食物和过度睡眠而半死了。这位健谈的伴侣还发表他对文官制度的看法，该制度已从那种任何人都可以被塞进去的阶段，逐渐发展到如今既需要大脑又需要兴趣才能进入该阶级的状况。一个人一旦进入（这些是那位健谈的荷兰人的观点），只要他保持安静并满足于在平庸的轨道上滑动，他的财富就有了。他必须盲从地遵循规定的规则并盲目地服从直属上司，放弃所有的个人良知和身份。如果他有自我晋升或帮助民众的打算，如果他节省政府资金并减少道路苦力或警察（这些人实际上在家里担任厨师、园丁或马夫）的数量，如果他试图树立榜样并放弃津贴，“那个人，”演讲者叫道，“完蛋了，最好立刻回荷兰。”


    这就是他的旅行伴侣的观点，但他有什么机会形成这些观点的，以及这些观点是否有实际事实的支持，`X.` 并也不知道也不在乎，只要他觉得这个伴侣很有趣，直到他们到达朱拉恰普。在这里他的意见发生了一些变化，因为他那口若悬河的伴侣凭借丰富的经验，预订了酒店里唯一体面的房间，并为自己获得这个房间的計策感到得意。


    当 `X.` 第一次在火车上宣布他要去朱拉恰普时，现场爆发了一阵惊叹声，他的同伴们显然认为他很古怪。如果他也解释了去那里的原因，这件事就不会有太大疑问了。那时他得知朱拉恰普曾是一个驻军镇，但由于士兵死亡率过高，发现必须放弃它。直到在马奥斯换乘之后，那个荷兰年轻人才承认朱拉恰普也是他的目的地，可能是不想在留在乔恰车厢里的同胞面前显得太古怪。


    ***


    ## 第十七章。继续探索——朱拉恰普。


    '
- fmt: '

    Tjilatjap was reached at midday. The town had an imposing appearance, all the
    streets being planted with avenues of large trees. `X.` drove at once to the hotel,
    where he was given a room like a horse-box with the sun streaming into it. As
    mentioned above, he subsequently ascertained that his travelling companion had
    managed to secure the only decent room in the hotel, and `X.` did not feel any
    love for the stranger, who had taken what he felt to be an unfair advantage of
    his local innocence. He only wished he could hand him over to the tender mercies
    of the most muscular and irritable member of the civil service, after relating
    how he had libelled it.


    There was lunch lying ready spread on the table and its appearance was satisfactory.
    Next day he noticed that this meal was laid hot at `9.30` daily, and left cooling
    until far on in the afternoon. Being hungry, the distant view of the table looked
    inviting, and `X.` prepared for a hearty meal. But his joyful expectation gave
    way to something like disgust on discovering, what a nearer approach revealed,
    that each article of food was firmly congealed in its own gravy. But no one else
    seemed to mind, and a party opposite—father, mother and daughter—ate of these
    provisions as though they were delicacies hot from the kitchen of the Savoy or
    Bignon''s.


    Strolling out a little later to smoke a cigarette and try to persuade himself
    he had lunched, the visitor spied the proprietor of the hotel, his family and
    some favoured guests, enjoying cakes, and what appeared to be Madeira, and fruit
    in the verandah. As sleep in that sunbaked oven of a room was impossible, the
    traveller sent for a carriage and went for a drive. The appearance of all the
    houses that he passed gave the idea that every one inside them was asleep, but
    their stillness was counterbalanced by the busy crowds of natives going to and
    fro along those avenues of wonderful trees.


    Later in the day `X.` sallied forth to call on the Assistant Resident. He had
    been informed at the hotel that this official was not visible between the hours
    of `11 a.m.` and `7 p.m.`—rather a long period of retirement.


    As it was growing dark `X.` walked up to the house, a far superior residence to
    the one at `Garvet`. The lady of the house and her family were starting for the
    evening drive, not daring to venture out before this late hour. The Assistant
    Resident, apparently a very young man, received his visitor with great cordiality
    and gave him all the information in his power, promising his assistance if he
    wished to go further up country.


    It should be stated that, arrived at `Tjilatjap`, `Usoof''s` memory received a
    filip, and he recollected that the town of `Jombong`, not far off, had been the
    chief place near his `kampong`. On hearing this, the Assistant Resident promised
    to send a letter to the `Wodena` or native magistrate of the village, who lived
    at `Soempioet` and could let him stay in his house. This exactly met the wishes
    of `X.`, who had been only wanting an opportunity to see more of the native life
    in `Java`, away from the track of hotels and tame curio sellers, who differed
    but little in one town from another.


    While the traveller was paying this call, another visitor arrived. This was no
    less a personage than the President of the `Landarad`. After they had left, he
    hospitably invited the Englishman into the club, where they played billiards.
    The great man made himself most agreeable and was quite ready to impart to his
    companion all he might wish to hear about the duties of the local government officers.
    He learnt that the Assistant Resident exercised a very limited jurisdiction as
    magistrate, and all cases, excepting the most trivial, are brought before the
    `Landarad`. The post held by this cheery official was evidently most congenial,
    and he explained with much satisfaction how he had to be frequently travelling,
    and what a liberal allowance he could draw while doing so. It need be liberal,
    thought his hearer, to compensate for a course of feeding in `Java` hotels. But
    sympathy on this point was wasted, as the President of the `Landarad` alluded
    to the one, at which it appeared they were both staying, and spoke of it as comfortable.


    Billiards over, it was time to return to the hotel for dinner. This meal, probably
    more owing to the lamp-light than to any inherent superiority, seemed an improvement
    on the last one, had not the diners made it unnecessarily uncomfortable by treating
    it as though it were a hurried snack at the counter of a railway refreshment room.
    For instance, three or four times during the progress of the meal callers came
    to see the courteous President, who cheerfully left the table to interview them,
    returning with equanimity to the discussion of the chilled dishes at whatever
    stage of the feast he chanced on when he returned. The table was not cleared away
    after the sorry farce of dinner was over, and `X.` noticed, as late as ten and
    even half-past ten o''clock, late diners strolling in to feed on the ever less
    appetising remains. `X.` recalled the words of his companion in the train, and
    thought he at least had some justification for his remarks on the digestions,
    or the want of them, of his fellow-countrymen in `Java`.


    The chief thing for intending travellers in `Java` to recollect is the difficulty
    of obtaining money, since no one will look at a cheque, as people in that country
    do not use them. It is necessary, therefore, to take ready money and rely upon
    periodical remittances sent by registered letter from the bank. At `Garvet` `X.`
    had his first experience of pecuniary trouble through having placed confidence
    in his cheque book, backed by the special permit signed by the Governor General
    of the Netherlands India. He had invested in some `Java` ponies and thus outrun
    all calculations as to expenditure. The hotel people would not look at his cheque,
    though they certainly looked at the owner of it with the careful scrutiny born
    of suspicion.


    Very troubled, he had called at all the chief shops and places of business in
    the town asking assistance, and assuring merchants of `bonaides`, as they scanned
    his cheque and passed it from one to another as a curiosity as none of them had
    ever before. At length good fortune appeared in the shape of `Schmidt`. One of
    those who had endeavoured to grasp some meaning from the cheque, explained that
    he believed this kind of thing was seen in Europe, and they had better call `Schmidt`.
    `X.` eagerly seconded the suggestion, and his verdict was anxiously awaited, but
    especially by the owner, whose future movements must depend on the decision, and
    his relief was great when the discerning `Schmidt` declared that he certainly
    had seen such before, and generously offered to cash it. Thus the situation was
    saved, and the stranger was able to carry out his arrangements and pay his debts.
    Good Schmidt that remembers you with gratitude.


    Here, in `Tjilatjap`, `X.` was again threatened with penury, for though he had
    telegraphed for money, the little packet had far not appeared. Perhaps his bankers
    could not credit that he had gone to a place with such reputation as `Tjilatjap`.
    But it was because of this reputation that `X.` was unwilling to prolong his stay
    beyond what was actually necessary, and therefore sending off the Malays with
    the luggage, remained behind, relying upon the arrival of the money by the morning.
    As a forlorn hope `X.` sallied forth in the sun to pay one more visit to the post-office.


    The whole building was a picture of neatness and cleanliness. The walls were made
    of bertam so as be easily destroyed and the floors were of cement and raised off
    the ground. This hospital has only been started two years, and at the present
    time, possesses fifty beds. The bathing places in particular merited attention,
    the floors being tiled, while large tanks of brick and cement contained the water
    supply—the most elaborate building was the dead-house, where all the latest improvements
    were to be. There was, and is, a European ward where patients can be treated for
    three guilders a day. Another building, standing a little apart, was for Europeans
    of a better class who could afford to pay six guilders a day, "but," the doctor
    added, "they never come." The hospital is free for all natives,, contrary to what
    is frequently the case elsewhere, the authorities seem to experience no difficulty
    in inducing them to go there. The doctor has one assistant to help him in managing
    the hospital. He spoke very highly of the native dressers, and said that they
    frequently turn out well. To `X.`, accustomed to see similar hospitals crowded
    with Chinese, it was curious only to find one in the whole.


    After his visit to the hospital the traveller went to the post office to ask if
    his registered letter had come, and was considerably depressed to find that, though
    the post had arrived, there was no letter by him. There was nothing to be done
    but to accept the information and return to the hotel and think it out. He was
    alone—servants and luggage had gone, and some ten guilders of money only remained.
    Where could he find a local? The landlord suggested that perhaps the people at
    the `Factory` might change his cheque. `X.` was not certain, but believed the
    `Factory` to be the name for the offices of the chief trading firm in `Java`.
    Acting on this advice, he took a carriage and drove there. The haughty young gentleman
    who presided behind the counter received him suspiciously, and at once disdainfully
    and very firmly refused to have anything to do with the cheque, which he turned
    over and over in his fingers as though it might bite him, and then returned to
    its owner.


    Bowed out and baffled, the traveller returned to his hotel. The situation was
    now growing serious, for the train to `Soempioeh` went in half-an-hour, and, after
    paying his bill, there would be no money for the fare, even could he start penniless.
    This building was closed, and the hard-worked officials had retired to their private
    apartments in the back premises. Bold to desperation, the visitor skirted round
    the post-office and peered into the privacies beyond. Seeing an open door he walked
    in, and found the chief official in his shirt sleeves partaking of his midday
    meal. With profuse apologies for his intrusion, `X.` stated his anxiety about
    his remittance, and rather feebly asked the officer if he were "quite sure" the
    letter had not come. "Quite sure," grumbled the official in excellent English,
    "but to satisfy you I''ll let you come and look yourself." `X.` almost begged
    him not to take what surely must be superfluous trouble, but, luckily, refrained,
    and accompanying the officer into the post-office, walked towards a pile of papers
    stacked in pigeon-holes. "There," exclaimed his guide, "see—see for yourself";
    and he did, for on the top lay a blue envelope duly registered and addressed to
    himself.


    Thus the hotel bill was paid, and he caught the train to `Soempioeh`. There he
    was met by `Abu` and messengers from the `Wodena`, who accompanied him to that
    officer''s house.

