  trans: '

    清晨，X. 出发去探索。自然而然，他的第一站是那些奇妙的花园，这些花园是世界之首，也是来自世界各地自然学者的聚集地。在这样一份速记中，若试图描述这座花园的奇观将是自妄的，它是东方奇观之一，值得特意前往爪哇岛一游。在散步期间，旅行者在每个转角都对当地人的富足感到惊讶：瓦顶顶的房屋、果实累累的果园和花园，而山羊和羊随处觅食。在街道上，每个人似乎都在卖东西——似乎已经没有人在买东西了——他们卖着最诱人的水果和蔬菜，以及各种花卉。这里人口众多，在城镇四周延伸着一排一排紧密建造的土著房屋，在每个角度和位置上背向而，这表明人们一定生活得团结在一起，*全家人地*或更确说是*成群地*，这与马来村形成了鲜明对比，在马来村，通常每户房子都位于自己的围合院落内。但在那里他们拥有无限的空间，而这里显然他们拥有无限的人口。


    由于自己在一个土著族群中过着孤独的生活，X. 比普通旅行者更倾向于注意到这个国家及其周围的环境也是自然的。他听过许多关于他们受到荷兰人压迫以及生活条件艰劣的故事，因此当地人的真实面让他感到惊讶，随着他在爪哇岛看到的越多、走得越远，这种惊讶与之增加。至于爪哇的高层生活，对于任何去过那里或了解该国家的人来说，其社会状况是众所周知的。但无论此前听过多少，每当一个普通的英国人第一次在现实中面对这些情况时，难免会感到震惊。与当地人通婚不仅被纵容，而且几乎受到鼓励，在高级社交圈中遇到这些婚姻的后代并不罕见。有些情况是，位居高位的人将其子女合法化，在多年的非正式交往后，送它们的母亲走向祭坛。许多孩子的母亲在荷兰接受过教育，未来可能进入政府部门，而她们仅仅是居住在村子里的土著妇女。出身的偶然在攀升官位时很少被视为阻碍，混血背景对于这种身份来说也不是任何障碍。X.
    在访问期间观察到了许多此类实例，尽管这种事态在他看来相当奇怪，但他不得不承认，从荷兰人的角度来看，这有许多且有力的理由支持；关于这种问题的*利与弊*显然超出了本书的范畴，因为这本书仅旨在为有意出行的旅行者记录那些值得观察的事物。


    据我所了解，从布滕佐博（Buitenzorg）出发的远足很少，景点也寥寥；但下午，他开车去看了一块刻有印度教铭文的石碑，这是他注意到的关于如今穆斯林人民真实起源的第一个迹象。


    傍晚，X. 决定拜访一位职位相当于英国殖民地秘书的官员，并请求他协助获得一张继续进入内陆旅行的通行证。尽管被警告不要在下午 7 点之前拜访，但在黄昏降临时，旅行者感到紧张且坐立不安，无法真正相信自己这么晚拜访是正确的，于是六点时，他正走向那位高级官员居住的看起来非常简朴的住所。一眼就足以证明他错了，而他的信息源是对的，因为在他面前，在走廊旁房间的一个桌子旁，他的主主还穿着睡衣——还没有开始晚洗漱。然而，尽管
    X. 感到自己犯了*失礼（gaucherie）*，但这种感觉完全源于他自己的意识，完全不是来自被他打扰的绅士，因为对方脸上没有一丝恼怒或惊讶的迹象，就好像一个陌生人和外国人的不期而至是日常发生一样，他以礼貌而热诚的态度欢迎了他。


    这位官员像旅行者见过的任何人一样平易近人且知识渊源，X. 在谈起他时总是充满热情。他带着真正的礼貌立即放弃了正在进行的工作，没有对桌子最后顾一眼（这种顾一眼往往会破坏类似牺牲的优雅），并立刻对客人的事务表现出极大的兴趣。关于他的通行证，官员很快地安慰了他；在得知他与海峡对岸政府有某种联系后，立即承诺为他办一张特别许可，使他能够随心所欲地旅行，并确保与他接触的人都会提供帮助。尽管此时
    X. 依靠自己安排行程的能力，可能没有看重这张许可在未来将起的作用，但在旅行结束时，他乐意地承认它证明了极大的用处，并且不止不止一次，他觉得有必要向那位周到提供这种许可的人表达感激之情。


    *关于*拜访时间，这里可以提到，这是许多英国人会碰壁的一块社交礁石。我使用这个航海比喻是深思熟虑的，因为不久前，甚至有一位希望遵循习惯时间的英国海军上将，在五点钟拜访了荷兰海军指挥官。那位荷兰海军将当时没有穿正装，且打算等到七点钟才换衣服，他拒绝在这样一个不寻常的时间接待他，而着装问题——这在英国海军中一直是首要问题之一——当时便变成了一个相当棘手的问题，直到通情的调解者为更成功的访问铺平了道路。


    '
- fmt: '

    It was this same custom which caused discomfiture to X. on the following day,
    when having received the promised special permit, a document calling upon all
    officials to assist him, in the name of the Governor-General himself, he decided
    that it would be only right that he should present himself at the house of the
    ruler who had signed it, and in token of gratitude and respect inscribe his name
    in his book.


    As the traveller had no intention of seeing anyone or attempting to enter the
    gorgeous palace which stands in the midst of the famous gardens, there seemed
    no need to trouble about the time for the call, and therefore it seemed well to
    make it the excuse for a walk and fit it in with his afternoon stroll. Accordingly
    about 5 o''clock found him walking up the broad avenue, on either side of which
    were browsing deer in great numbers—a very novel feature to anyone who for years
    had only seen such creatures wild excepting one time when—but no I must withhold
    the temptation to wander off the broad avenue which leads the visitor up to the
    stately pile in front of him as, like he did a little further on, I would wish
    to get it over. For it is not pleasant even to record the admittedly awkward situations
    in which X., who had always prided himself on his `savoir faire`, now so often
    found himself.


    As he approached the portico (it reminded him much of Gorhambury, the seat of
    Lord Verulam, in Hertfordshire) the stranger became aware, rather than actually
    saw, that there were two figures seated on the main verandah having tea. He almost
    felt their eyes upon him in wonder and amusement, and, as he gradually neared
    the steps without in any way looking up, it was in some mysterious manner conveyed
    to him that these figures were ladies, and their dress, the sarong and kabaya!


    What was he to do. He could not turn and fly, nor could he diverge from the broad
    path and wander across the grass like any common trespasser—and, even while he
    wondered, his steps took him deliberately on, feeling self-conscious in the most
    literal understanding of the word—and inexorably each moment took him nearer,
    though in the endeavour to put off the evil moment he had, perhaps unknown to
    himself, slowed down his previously deliberate saunter until his feet were now
    doing little more than marking slow time. However, the visitor gazed alternately
    at the tops of the trees and the roof of the palace, as though things of absorbing
    interest were there taking place, and at last he was obliged to realize that he
    had reached the lowest step of the imposing staircase.


    X. assures me that it is a fact, he never once lowered his eyes or focussed the
    little party before him, although ultimately the tea table could not have been
    more than a few yards off. There stood the stranger with a vacant expression which
    would have made the fortune of a performer in a waxwork show, and hoped and almost
    prayed that a servant of some kind would appear, receive his signature or his
    card and allow him to return to the comfortless obscurity of his hotel. There
    was no bell, and no servant came, and the silence at length became unbearable.
    Relief came at last from the tea party for the voice of a lady suddenly fairly
    shrieked for a "boy." After this explosion the tension of the situation was relieved,
    and there was a sound as of chairs hastily pushed back and the patter of little
    feet and the rustle of sarongs, which led X. to infer that there had been some
    sort of a retreat.


    Then a flurried native appeared, he seemed a kind of gardener hastily fetched
    from his duties, possibly the mowing machine, and pouring forth words in a strange
    dialect he pointed wildly to another flight of steps and another door. Following
    this menial, a veritable `deus ex machina`, X. was led down those palatial steps
    and up another flight round the corner. There the gardener threw open a door and
    seemed disposed to resign his custody of the stranger, preparing to return again
    to his machine. But X. steadily declined to enter alone into that vast hall, nor
    would he even stay to look for a book in which to write his name, for he felt
    that the hasty retreat he had heard was not carried beyond the nearest pillars,
    and each moment he tarried, the fugitives were wondering what he could be doing
    while, alas, their tea was getting cold.


    And so he thrust his card, his only guarantee of good faith, into the soiled hand
    of the solitary attendant of this Eastern palace and fled—but fled he hoped with
    dignity. As he walked down the avenue with conscious and deliberate steps—admiring
    the view on the right of him and the view on the left of him—never looking back,
    though the desire for one glance was so overpowering that the nape of his neck
    actually ached, he conquered, and finally emerged from those great gates without
    any further satisfaction to the curiosity aroused by his first involuntary glimpse.
    But so long as he remained in Java he never paid another call before dusk, a more
    convenient time, when such `contretemps` are not likely to occur.


    ***


    ## CHAPTER XII


    ### A MODEL ESTATE

    '
