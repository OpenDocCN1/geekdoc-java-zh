    ## CHAPTER XVI.


    THE QUEST FOR A MOTHER.'
  toc: []
  trans: '

    加维特（Garvet）似乎在夸耀那里的人口众多，因为那里有无尽的房屋——或者说是房群——密密麻麻地挤在一起，面对、背对、并排，给人一种几个村庄随意聚集的感觉。所有这些房屋都收拾得极其整洁利落，周围围着低矮的竹栅栏。几乎每栋房子都盖着瓦顶，而且档次优于半岛内陆地区的大多数房屋。街道干净得简直像经过精细打扫过一样，`X.`
    在那次散步中决定，加维特是他见过的最干净的东方城镇——当然，除了 `Pura Pura` 的首之外。


    人们对 `Tji Panao` 的温泉有很多议论，因此旅行者决定将那里作为他的第一次远足。他租了一辆由三匹马并排拉引的交通工具——这让他想起了年少时的时光，那时他会对家乡公园里一套时髦的装扮感到惊叹——在双轮小马车和自行车出现之前的，由一位著名的社交界和时尚人物驱着三匹并排的小马，`X.`
    告诉司机前往 `Tji Panao`，并期待在像 `New Zealand` 泉水那样的温水中度过美味的半小时，那种泉水会让浴者离开时感到精神振奋、神清气爽。


    然而，在这个国家，另一个失望等着他，这里大自然做了很多工作，而人类为了舒适却寥寥无几。温泉位于山坡上的一个小屋里。这间小屋有三个隔间。每个隔间里都有一个浅的砖池，里面可以坐下。热水通过管道引入这些池子，每个池子头部有一个入口。浴池周围的地面很脏，唯一的家具只有一把藤椅。浴池的水深大约有三英寸，在这些湿滑的砖块上，浴者不得不凄惨地坐着，身体下半部分浸在温水中，而上半部分则在上方相对凉爽的空气中保持干燥高干。`X.`
    原本准备好在水里泡很久，并带了读物来打时间，但在这种情况下，简短地泡一下就足够了，他很快从椅子背上解下衣服，准备出发。


    这些温泉附近有一栋有四间房间的建筑，显然是一座 `政府休息馆`（Government Rest House），家具非常齐全且舒适，显然人们是特意来这里使用温泉的。温泉泉具有巨大的潜力，只要花一点精力和金钱，它们就能成为一种享受，并成为一种收入来源。


    从加维特出发还有一两个可以进行的远足，但唯一值得一提的是前往 `Tjiseroepan` 火山的行程。一天早晨，`X.` 与 `Usoof` 和 `Abu`
    一起出发，因为他厌倦了独自观光；在得到亲切的 `助理居民`（Assistant-Resident）许可使用 `政府休息馆` 后，他开车前往 `Tjiseroepan`。道路非常好，路线不用说，穿过了一片美丽的土地。在这里，和处处一样，所有富裕的当地人都骑马。距离有十三英里。`Tjiseroepan`
    是山脚处的一个村庄，他们计划第二天登上那座山。


    旅行者受到了 `助理土长`（Assistant Wodena）的接待，这位当地官员在最后两英里一直疑疑神备地在马车前后骑行。在阅读了陌生人的证明信并发现他能说马来语后，这位当地名流变得非常热诚，并让
    `X.` 免费入住 `政府休息馆`。这里配备了床、桌子等家具，但没有提供玻璃器和瓷器。


    `助理土长` 带领游客参观了村庄，村庄是整洁的典范。每栋房子都位于花园里，种着咖啡、蔬菜和草莓。村长和其他几个人住在非常好的房子里，似乎有数不完的小马。村庄坐在一个坡上，耕种的山坡与意大利南部的景象有些相似。繁荣和知足的通常迹象随处可见，无论在这个村庄还是其他地方，当
    `X.` 与当地人交流时，他找不到任何可以解释那种普遍观点——即爪哇人对他们的统治者具有敌意。


    `休息馆` 证明很舒适，`X.` 带了自己的食物，由他的仆人烹饪，他难得享受了一顿热热且可口的午餐。他有很多机会与 `助理土长` 交流，对方非常愿意论述这个国家的习俗，并详细介绍了
    `爪哇君公`（Javanese Rajas）复杂的礼仪，以及平民对等级所付出的异常尊重。他反过来问了许多关于 `马六甲` 和 `马六甲海峡`的问题，他的对话者能够提供他所需的所有信息。


    第二天早晨，观光者和他的随从们骑马上山去看火山。这是一种像地狱般的火炉，恶毒的山口像从地底钻出来的通风口，喷出并嘶嘶着刺眼的蒸汽。整座山体呈硫黄色，空气中散发的气味令人作呕。`Usoof`
    和 `Abu` 对这番可怕的经历感到非常恐惧，他们抓住他们的 `主人`（Tuan）的手臂，恳求他不要靠近那些他们显然认为是地狱之门的地方。


    我觉得在记录风景给旅行者留下的印象时，已经对指令给予了足够的尊重，因此将省略关于他下山时所看到的一切描述。他将其描述为奇妙，一直读到这里的读者应该准备好承认这一描述的准确性。该小组准时到达加维特，赶上了前往
    `Tassikmalaja` 的两点钟火车，从而开始前往 `Tjilatjap`。


    ***


    第十六章


    ### 寻找母亲之之旅。

    '
- fmt: '

    To start for Tjilatjap was such an unusual departure that it merits a chapter
    all to itself. No one had apparently left Garvet for Tjilatjap for years, since
    it had been pronounced to be one of the most unhealthy places in the island. The
    correct thing for every traveller to do is to go to Tassikmalaya for the night
    and proceed from thence to Djoeja by train, go by carriage to Beroboeddoer, where
    a halt for the night can be made at a Government Rest House. The drive is twenty-five
    miles. The next morning the traveller should drive ten miles further to Magelang,
    while his luggage goes by train or bullock cart. From Magelang Amberawa is reached
    by another drive of twenty miles, and from here the railway can be taken to Semerang
    or back to Djoeja, and from there to Solo, a three hours'' journey.


    `X.` was informed that everyone took this route, but he persisted in starting
    for Tjilatjap, notwithstanding that the lady who presided over the hotel assured
    him that it was the most fever stricken port in the country. Had he known then
    as much as he subsequently learnt of the evil reputation of the place it is probable
    that the traveller might have changed his plans. As it was, he only replied that
    he was inured to fever and did not mind. At that time he had no particular reason
    for going to one place more than another, and therefore the one which drove him
    in this direction was good enough to serve his purpose.


    `Usoof` desired to commence the search for his mother. He had no recollection
    of the village where he was born, but believed it to be somewhere near the coast
    which, considering the country was an island, was somewhat a vague indication.
    After assisting his `Tuan` to study a map he exclaimed that the name Tjilatjap
    sounded familiar to him, and sure enough it was a large town on the coast. Now,
    he argued, it could not be familiar unless he had heard it before, and that could
    only have been when he was in Java, and as he was then little more than a baby,
    only the names of places in the neighbourhood of his birth place could have been
    familiar to him.


    It mattered little to `X.` where he went, the further away from the beaten track,
    the more opportunity for studying the natives and learning something of their
    lives. So he readily agreed to go to Tjilatjap. It was only after all plans had
    been settled that its evil reputation for fever was heard of.


    The first stage of the journey was to Tassimalaja, and, leaving Garvet at two,
    they arrived there in time for dinner. So far as could be judged from a very brief
    stay during the dark hours and early morning, this seemed a pretty little country
    town, but the train left early and there was little time to look about. The first
    important stop was at Maos, where a change had to be made. Among the passengers
    was an Englishman whom `X.` had met some ten years before in New York. He was
    going the orthodox round to Ojoedja and Semarang. The two Englishmen, both experienced
    travellers, exchanged views as to their respective impressions of Java, and both
    agreed that, wherever they went, the courtesy and assistance received equalled
    if they did not exceed any they had met with in other portions of the globe they
    had trotted over. At Maos their ways separated, though fate brought them together
    again on board the steamer to Singapore.


    Another companion of the journey was a versatile young Dutchman who spoke many
    languages and proved to be very good company. This gentleman apparently had no
    great admiration for his fellow-countrymen, as he saw them in Java. He abused
    with equal impartiality the food and the manner of life, and declared that the
    Dutch in Java were devoid both of digestion and energy. They were in fact half
    dead from bad food and too much sleep. This communicative companion also gave
    his views on the civil service, which had gradually grown from the stage, when
    anyone could be pitchforked into it, to its present condition, when both brains
    and interest are required to achieve the entry to its rank. Let a man once get
    in (the views are those of the communicative Dutchman), his fortune was made,
    if he only kept quiet and was satisfied to slip along in the common groove. He
    must implicitly follow prescribed rules and obey his immediate superior blindly,
    sinking all individual conscience and identity. Should he have views for his own
    self-advancement or to assist the people, should he economize Government money
    and reduce the number of road-coolies or police, who actually officiate in the
    household as cooks, gardeners, or grooms, should he try to set a good example
    and relinquish perquisites, "that man" exclaimed the speaker "is lost, and had
    better return to Holland forthwith."


    Such were the views of his travelling companion, but what opportunity he had had
    for forming them, and whether they were justified by actual facts, `X.` did not
    know, or greatly care, so long as he found his company amusing, which he did until
    their arrival at Tjilatjap. Here his opinion was somewhat modified, when his voluble
    companion, profiting by superior experience, annexed the only decent room in the
    hotel and exulted over the ruse which secured it for him.


    When `X.` first announced in the train that he was bound for Tjilatjap there was
    a chorus of exclamations, and his companions evidently thought him eccentric.
    Had he also explained his reason for going, there would have been little doubt
    on the subject. It was then he learnt that Tjilatjap had formerly been a garrison
    town, but it had been found necessary to abandon it on account of the high rate
    of mortality among the troops. It was not till after the change at Maos that the
    young Dutchman acknowledged that Tjilatjap was also his destination, being probably
    unwilling to appear eccentric in the eyes of his fellow-countrymen who remained
    in the Djoeja carriage.


    ***


    ## CHAPTER XVII. THE QUEST CONTINUED—TJILATJAP.

