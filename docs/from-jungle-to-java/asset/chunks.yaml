    ## CHAPTER V.


    BATAVIA.'
  toc: []
  trans: '

    第二天，`X.` 记得人们对他的期望，便租了一辆马车（gharry），开始履行礼仪对他这种特殊官方身份所要求的一切义务。其中首要的一点是在殖民秘书处办公室候客室的一本簿子上签下自己的名字。这本书上的名字读起来很有趣，`X.`
    想想，如果能把这本书带进伦敦俱乐部的吸烟室，并打十比一，赌在场的人中没有三个人能在地图上找到所标注的地点，那么这可能会成为财富的来源。`Perak`[[3]](@public@vhost@g@gutenberg@html@files@27749@27749-h@27749-h-0.htm.html_Footnote_3_3)——或者他们在吸烟室里称其为
    Pea rack——雪兰莪（Selangor）、彭亨（Pahang）——在家里被称为 Pahhang——柔佛布（Jelebu）、乌戎江（Sungei Ujong）——在这里被伦敦化为
    Sonjeyajang——以及许多其他不熟悉的发音。


    官方例行结束了（这应该是半官方的例行，`X.` 这样暗示，他担心自己可能对作者的任何错误负责，这可能导致人们认为他在自封任何真实的殖民地官职——然而，很难如此留意这些细微的区别——`X.`
    接着访问了 `Messrs. John Little and Co.`。每个去过新加坡的人都去过 `John Little''s`，因为它对当地人来说熟悉程度甚至超过了伦敦人对
    `Whitely`   `Whitely` 有对手，而 `John Little` 则没有。从这家著名的提供必需品和奢侈品的商店到这家好客的俱乐部仅一步之遥，旅行者就在那里吃了午餐。这家俱乐部是新加坡所有显赫商人的聚会场所。建筑非常精美，有一个俯海的海廊，成员们总是热烈欢迎陌生游客和来自邻近半岛的邻居。说了这么多，我觉得我必须冒着引起
    `X.` 的不悦（他会被归功于我告诉了他这些），并补充道，这家公司比菜肴更好。饮料的质量和数量无可挑剔，但那食物！——那是他们在丛林里处理得更好的事情之一。


    下午，将军再次如他所言，带着客人去兜风，让他那惊讶的眼睛目睹了新供水工程的所有美景。中国邮件在早上已经送达，这个喜爱的去处挤满了明显的乘客，其中一些还是环球旅行者。如果这位头衔显赫的旅行者匆忙路过那里，他会说什么呢？晚上，阁下为二十位客人举办了晚宴，这些人选自新加坡最精英的圈子。与这么多欧洲人同桌吃饭对
    `X.` 来说任何时候都是一种新鲜，但突然发现自己处于这样一个显赫的伙伴之中，这种新奇感几乎令人心惊。然而，由于幸运地坐在美女身边，气氛通常变得轻松起来，如果当时社区的任何成员在观察，他可能会认为
    `X.` 背背了这样一个信念：对于一个人来说，没有哪个地方比 `Pura Pura` 更适合居住。


    对其他食客来说是家常事，对他来说既是当下的快乐，也是对过去的一瞥。当然，试图向任何人解释他来自哪里或住在哪里是完全徒劳劳的，因为 `Pura Pura` 这个名字对他们来说是陌生的，因此有必要假装成一名前往
    `Java` 的*路过的*乘客。公司中的一些人去过 `Java`（包括主人），他们对那里的礼节赞誉有加。


    早晨，旅行者向他亲切的主人告别，主人于凌晨 `5.30` 出去参加一场早起的小战争，对那种战争的描述对一个平民来说，可能就像 `Pura Pura` 的地理位置或
    `X.` 的确切官方身份对前一天晚上公司成员来说那样模糊。这位伟大的士兵身着全制服穿过一群不同国籍、鞠躬的仆从开车离开，`X.` 进了他简陋的马车，在 `Usoof`
    和 `Abu` 的跟随下来到 `Messagerie` 码头。前往 `Batavia` 的蒸汽船是 `s.s. Godavery`，它与回国邮件相连。票价根据实际行驶距离计算，可能是世界上最昂贵的。航程耗时三十六小时。


