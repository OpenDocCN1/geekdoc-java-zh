    speak the speaker never so plausibly, to exchange it for the very newest that
    can be given to them from the most up-to-date land code in existence.After his
    interview with the courteous official, X. departed, pondering on all he had heard,
    and bearing with him a memo, on which was written the various places of interest
    which he had been recommended to visit in the neighbourhood. On his return to
    the hotel the traveller passed what appeared to be the local club.The first thing
    an English official in an outstation in India or the Peninsula will do for a stranger
    arriving with introductions, is to offer to put him up for the club, and unless
    there seem strong reason against it, he will most probably ask him to dinner.
    Apparently this was not the custom here, and so X. was free to wander about the
    little town and explore, with nothing more exciting to look forward to than a
    repetition of last night''s gruesome meal in company with the suffering tenants
    of the prandial coats.


    * * *


    ## CHAPTER XV.


    BATHS AND VOLCANOES.'
