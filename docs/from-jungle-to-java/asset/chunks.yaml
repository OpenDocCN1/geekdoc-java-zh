  trans: '


    这位旅行者自然对协和俱乐部（Concordia Club）的景象留下了深刻印象。灯火辉煌的美丽园林里，人们漫步或坐着，仿佛置身英国的夏夜一般。但正如在东方，健康和饮食观念在任何在那里居住过一段时间的人心中都占据着极其重要的地位一样，最令这位陌生人惊讶的是，那些在这片危险土地上树下徘徊的`flaneurs`（闲逛者）对发热表现出近乎鲁莽的漠不关心，仿佛这里是家乡赫灵汉姆（Hurlingham）无害的草地一样。当他随后从一位女士那里听到这让他让他松了一口气——他向她表达了这种惊讶——医生们宣布这个户外音乐会季节确实是感冒和发热的高发时期。


    驻守官及其随同人员坐在通往俱乐部的大理石阶梯顶端的一个圆桌旁。这组中的每人都轮流介绍给`X.`，随后他荣幸坐在主人的右侧，从而充分有机会享受周围的新奇感和乐队出色的音乐。当聚会成员围坐在桌边时，其中包括该国一些声名显赫的人物，这些人对近期事件有深入了解，对话被证明既有趣又富有启发性。


    于是，这位英国人听了关于巴里尼战争的故事——在那位将军指挥下荷兰军队遭受的惨重失败和屠杀，那位将军最终扭转了局势，今晚所有人聚在一起是为了向他致敬。`X.`听着人们讲述当地人无与伦比的背叛、士兵的苦难，以及欧洲人进口武器向敌方提供的援助。针对后这一事件，人们发表了严厉的评论，在场的一些人坚持认为罪祸首是一个来自新加坡的英国人。战争的气息在弥漫——每个人都在谈论战争，这件事给`X.`留下了如此深刻印象，以至于在他停留期间，无论走到哪里都能听到人们对战役的讨论，他认为在单独的章节中给出关于近期战争的种种传闻可能会感兴趣。


    所有在露台上参加聚会的人都说英语，这让`X.` 感到宽慰——随着新客人加入圈子，他们按照美国流行的精确方式被逐一正式介绍给在场的每位成员。同样，当任何个人起身离开时，他都会向聚会的每个成员逐一道晚安。


    当我着手编写关于`X.`如何前往爪哇的小记述时，我本打算按顺序安排他所见和所闻，但从他观察方式的性质来看，我发现是不可能的，因此必须将他接收的每一个印象和听到的有趣事实按照他们出现的方式进行记录，而不考虑它们是否有明显的联系。由于这份草稿的主要目的是帮助那些打算在我们邻国这个美丽岛上度过短假的人，这种小小的原创性可以接受。


    因此，在此场合旅行者得知，与他以前对此事的想法相反，文官的薪水非常低，尽管其在考试标准等方面与我们的印度文官团相当，但薪资和养老金的标准远低于其原型。在这里可以提到一点，以说明海军军在荷属东印度预计扮演的重要角色：所有中尉都必须通过马来语考试。在荷属印度水域指挥舰队是该兵种的荣誉，最卓越的海军军都向往这一目标。荷兰在东方殖民地的总督在任期内被称为阁下。在那里担任指挥的将将不仅在指挥期间拥有相同的头衔，还有权终身保留这一头衔。


    在交谈中，驻守官友好地告知`X.`，不必因被迫获得旅行许可而感到恼恼，因为事实证明即使是他自己的同胞也必须这样做，他最近已在所有轮船和酒店发布并张贴告示，以免在这件事上产生误解。音乐会结束后，在一个极其愉快的夜晚之后，`X.`被介绍到和谐俱乐部（Harmonic
    Club），并在那里吃了晚餐。


    这里和协和俱乐部一样，是一座拥有大石石柱子和地板的宏伟建筑，比旅行者早期对华丽东方的任何想法都更加符合。和谐俱乐部是在爪哇作为英国殖民地期间建造的——他的信息来源，那位英国人叹了口气。没多久，来者也叹了口气，在见证了这片光荣国家的美丽后，他想起如果不是由于以前某些统治者的盲目、不听取当地知情人士的建议，英国本可以拥有另一个印度。但由于国家的自然美景因普遍繁荣和满足的景象得到了增强和完善，一位英国访客发出这样的叹息，是现任所有者能获得的最大赞誉。


    `X.`在爪哇的第一天结束了——在丛林中长时间隐居后，他向自己承认这是一个足够愉快的一天——毕竟，他最后的思绪停留在那里，那片快乐的丛林及其友善的居民——在他眼前，是由房间角落里用木箱围成的围栏遮挡后的两个无生命的包裹所代表的。这些是忠诚的`Usoof`和`Abu`，它们早已安息——遗忘了在新国家第一天所有的烦恼。


    ***


    ## 第八章


    ### 关于 LOMOH 战争。


    '
- fmt: "\nLomboh is an island to the east of Java. The Raja of Lomboh did not come\
    \ to Batavia at a time when it was expected of him, and after some correspondence\
    \ the Resident of the nearest district was sent to see him. \n\nAfter—in true\
    \ oriental fashion—promising to give him audience, and then failing to do so—keeping\
    \ the Resident waiting a week—he finally sent a message refusing to meet him.\
    \ Then troops were sent. But their departure was not effected without a commencement\
    \ of that bickering which marked the whole subsequent course of events. The General\
    \ in command was junior to the Admiral over whom he was put. A compromise was\
    \ effected by a second general being appointed. \n\nWhen the expedition reached\
    \ its destination the Balineri showed great astonishment at this parade of force,\
    \ and affected to be at a total loss to understand why they had come. This unexpected\
    \ turn of events finally ended in a great \"chumming up\" which developed into\
    \ social functions and the taking of a photograph, in which the Raja's generals\
    \ and other chiefs of the expedition were all taken in one large group. This photograph\
    \ was sent to Buitenzorg`—the seat of Government—as a proof of the unreality of\
    \ the scare, and the diplomatic ease with which the expedition had been able to\
    \ come, see and conquer.\n\nThe photograph is not now to be purchased. After the\
    \ festivities and photography the Dutch force camped by the Palace walls, and\
    \ the general in command reported officially that the matter was settled. On receipt\
    \ of this welcome news the Governor General was so delighted that he gave a dinner\
    \ party that same evening, and after the meal was over stood on the billiard table\
    \ and made a little speech announcing the bloodless success and happy termination\
    \ of the affair Lomboh.\n\nThe Palace where the troops had camped was a kind of\
    \ village—a collection of houses surrounded by a huge wall. Each day the Dutch\
    \ held parades and drill outside the village, and tried to astonish the natives\
    \ with the wonders of their Winchesters and field guns. At these the people professed\
    \ great astonishment, examining those modern weapons with intense interest, and\
    \ asking questions innumerable as to their construction and cost. The latter is\
    \ almost invariably the first question which occurs to a native mind.\n\nThe Balinese\
    \ must be clever actors, since all the while they possessed hundreds of Winchesters\
    \ and many pieces of field ordnance within those deceitful walls. They were deceitful\
    \ walls, for they were extensively loop-holed, the apertures being cunningly stopped\
    \ up with mortar. \n\nOne evening the crisis came. The officers while playing\
    \ whist—dressed in their lounge clothes of sarong and their feet bare, were attacked\
    \ and shot down almost to a man. When the poor fellows sought refuge under the\
    \ walls, hand grenades were fired to dislodge them. A general panic and flight\
    \ followed. Those fugitives who had managed to effect an orderly retreat, took\
    \ refuge in a temple about half way between their camp and that of another detachment.\
    \ It was only then that they realized to the full extent the nature of the terrible\
    \ disaster, for here they met a poor remnant of that other detachment fighting\
    \ their way to them for help—they also having been treacherously attacked.\n\n\
    But this was not all, no warning had yet been sent to a third detachment which\
    \ had been left on the coast. This column, ignorant of any disaster, marched in\
