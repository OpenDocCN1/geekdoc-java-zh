    that the way the Chinese in Singapore were allowed to treat the Europeans was
    "nothing less than a disgrace to civilization." In the Singapore local press at
    the time of writing there is now appearing a series of indignant letters from
    a Chinaman in Selangor who signs himself as "Speaking Pig Tail." This scribe complains
    to "Mr. Editor" that he has not the same rights as a European. I wonder what "Speaking
