    is fostered and aided by their rulers, and if a man of position is ever suspected
    or accused so that inquiry becomes necessary, it must take place with closed doors
    and in private.That night the party lay at Bandong (fresh from reading the "Red
    Cockade" its language seems the most descriptive). The train reached that considerable
    town at dusk. Here the traveller had the good fortune to again meet his friend
    the President of the Landraad, and was introduced by him to the Club. Being introduced
    to the Club meant being separately introduced to every member then in it, with
    that punctilious formality which X. had observed in Batavia. The hotel at Bandong
    was the best which the traveller had yet visited, and, contrary to expectation,
    dinner was warm and comforting. The others of the party, however, Usoof and Abu,
    were not so fortunate, for they had no means of getting anything to eat. It was
    not permitted them to go out after dark without lights, and they could not get
    lights. Added to this it was raining hard. The hotel apparently could not supply
    natives with food at such an hour, and it was necessary for them to go and look
    for it. This sad story greeted X. when his own dinner was done. But the kind President
    of the Landraad cut the knot of this dilemma and soon provided a caterer, protector,
    and guide for the hungry pair.As usual next morning, the time fixed for the train
