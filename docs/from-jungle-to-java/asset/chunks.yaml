    However, worse was to come, for at the end of dinner, when the "boys" brought
    coffee made in the way usual to the country—a few drops of cold essence of coffee
    at the bottom of the cups, which had to be filled up with boiling milk or water—the
    lady from England could not contain her indignation, but loudly scolded the waiter
    for such a stingy way of putting so little in the cup, since "coffee should surely
    be cheap in Java," and then proceeded to empty the contents of all the cups into
    two, one for herself and one for her husband, while saying with a smile "we like
    a cup of coffee, not a drop." Then while she sipped her full cup like one on whom
    there unwillingly dawns the unpleasant consciousness of having made a mistake,
    the lady further addressed the waiter and asked, "Do they always drink cold coffee
    in Java?" The waiter, who could only stand passive while this calm robbery was
    committed—for had not the whole company to wait for a second brew—made reply with
    the only English of his vocabulary, "yes." X., who had the doubtful advantage
    of understanding as well as seeing all that was going on, glared fiercely as he
    saw himself deprived of the only portion of the meal which was at all likely to
    be good, and could willingly have caused an interruption by using his napkin and
    bread as a sling and a stone. The "yes" of the native apparently checked the embarrassment
    which the lady was beginning to feel, and triumphantly she exclaimed, "My goodness,
    what a country." Then the husband blew his nose with discomfort, and, her attention
    attracted, his good wife exclaimed, "My dear, you have a cold, let us go to bed,"
    and they went. X., and possibly others, found satisfaction in the thought that
    people might go to bed after partaking of such a concoction as that couple had
    done, but that they certainly would not sleep. Nor did they, as the sequel showed.
    For the lady and her husband also had a room on the terrace suite, and this was
    divided only by a thin partition from that of X., and though he did not wish to
    listen, the first words which greeted his gratified ears on the following morning
    were, "Oh, darling, I have had such a dreadful night; I never closed my eyes."
    X. heard no more as he delicately buried his head in the pillows, lest he should
    be dragged too deep in domestic confidences; but he had heard enough—he was avenged.
    And they knew themselves it was the coffee, since it was noticed that this night
    after dinner the sleepless couple each firmly declined the brimming cups, which,
    with kind forethought for the public good, the proprietor had ordered to be handed
    to them.
