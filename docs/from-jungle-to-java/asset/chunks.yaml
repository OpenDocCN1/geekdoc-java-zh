    # 第十八章 任务的完成——沃德纳的家。


    沃德纳的房子是一座相对较大的建筑，由`alang-lalang`墙壁筑成，地板与地面齐平。[[4]](@public@vhost@g@gutenberg@html@files@27749@27749-h@27749-h-2.htm.html_Footnote_4_4)
    房子的正面完全敞开，尽管屋顶伸出的出的檐遮挡了刺眼的阳光。在前景，整齐地排列着三张桌子和相应的椅子，显得有些刻板，仿佛在酒店的门廊上。在角落里有一个像储物柜的小隔间，`X.`
    发现那里就是他的卧室。


    这里并没有尝试用席子铺盖裸露的地面，即使是贫穷的马来房屋也会这样做。在那个大客厅的后方立着一张大气派的长桌。房子的窗外是一片长满长草的杂乱荒地——在一个如此处处整洁的国家，这种凌乱是不寻常的迹象。不远处，一座供政府使用的新房子正在施工中。这栋建筑结合了`alang-lalang`墙壁和瓦顶这种有些奇特的组合。


    欢迎`X.` 入门的主人正如之前提到的，是`沃德纳`，即当地的土著行政事法官。处于这种职位的马来人肯定会有礼貌的风度，并且可能是一个愉快的伴侣。这位官员虽然显然想表现得诚恳，却很笨拙且显得愚蠢。他的马来语很糟糕，对于这个职位来说，似乎是个没受过教育的人。他头上戴着一顶可怕的老遮阳帽，外表怪异。


    喝完茶后，主人带`X.` 绕着走了一圈向他介绍，当他们经过时，所有人都伏在地上。穿制服的随从跟在他们身后，偶尔对那些没有立即倒地的人大吼，同时用权杖的顶端暗示性地戳着他们加快动作。遇到的少数几个华人像向王室行礼的女士一样低头鞠躬，这对于刚离开新加坡的
    `X.` 来说是一次相当惊人的经历，在新加坡，中国人会在人行道上挤欧洲人，并在路过时向他们脸上吐劣质烟草。*谈及此*，这里可以提到，爪哇的一位高级荷兰官员曾表示，他认为新加坡华人对待欧洲人的方式“简直是文明的耻辱”。在写作当时，新加坡当地报纸上正出现一系列来自雪兰莪一位华人的愤慨信，他署名为`会说话的辫尾`。这位写作者向`编辑先生`抱怨，他没有欧洲人同等的权利。我很奇`会说话的辫尾`会对上述荷兰官员说什么。


    然而，在索姆皮耶的这些特定华人对`沃德纳`深深地鞠躬了好几寸，而 `X.` 则带着一种淡然的自知，将自己标榜为该地唯一的白人。这在索姆皮耶的这次漫步充满了趣味，`沃德纳`还尽所能地回答了所有的提问。眼所及之处，整个地区是一片广大的稻田、山谷和丘陵，在
    `X.` 看来，没有任何人口密度能足够消耗这种看似无尽的供应，但`沃德纳`告诉他并没有。


    城镇呈现出一派繁忙的景象，且令人难以忘怀；如果相信`沃德纳`的话，这是任何白人第一次见到这种景象。无论事实是否如此，又或许并非如此，`X.` 让自己满足于认为这是任何英国人第一次见到这种景象。集市结束后，旅行者回了家，在那里接到了`Usoof`
    及其母亲的拜访。他找到了她，前往爪哇之行的目的达成了。看来他在沿着河边的小路行走时遇到了她，这唤醒了他的记忆，那段记忆将引导他带回家。她注意到他不寻常的装束和像陌生人一样的样子，停下来询问他是否有关于她儿子的消息——她的儿子多年前去了新加坡，她曾多次给他写信，但没有收到过回复。她担心他已经死了，但由于这位友善的陌生人来自海外异乡，他可能在新加坡的爪哇人殖民地中听过她失散多年的儿子的消息。


    见面就是这样，并为这段看似凄凉的任务画上了一个戏剧性且成功的圆满句号。如果我有`Swettenham`或`Clifford`的笔触——这两个善于编织迷人故事的同情者，他们笔下的种族那种童真的信仰非常适合成为故事——我可能会在这里找到几页迷人浪漫的素材。但现实中，`Usoof`身上并没有什么浪漫，更多的是坚毅的诚实与深情，他带着穿着简陋衣裳的贫母亲将她介绍给他的`Tuan`；而此时的
    `Tuan`正被善良的主人闷得要命，因为主人一直坐在他身边保持专注的沉默，以此不打扰他，对他来说，任何消遣都是一种恩赐。但那位可怜的夫人根据当地习俗，只能在房子外伏地，不敢靠近十来码，或许她把她那新发现的、直直站着的儿子看作某个自寻死死的恶棍。这种行礼制度让
    `X.` 感到相当尴尬，因为主人的所有随从都弯着腰爬行，而自己的随从一直保持着惯常的姿态，偶尔偏离垂直位置。


    因为在夜里有些时候，`Abu` 意识到自己显眼的地位，会笨拙地蜷缩着身体走来走去，从桌腿间的某处提供香烟和凉饮，在意想不到的地方像猫一样突然出现让他的主人吃一惊，同时他的眼神里写着：“别指望回到你家后这种事还会持续。”
    第二天是周日，每周集市在中午十二点达到高潮。成百上千、也许几千的人挤在一排排小棚下，卖着各种颜色的纱笼和布料、帽子以及各种土著饰品。

    '
- fmt: '

    To Usoof and his mother the great Wodena was kindness itself, and conversed with
    them in Javanese with much affability. X. wishing to see a real country village,
    and obtain speech with its people, away from the all-subduing eye of the local
    authority, promised to go that afternoon and visit the good lady in her ancestral
    home, and a few hours later he took the train for the next station, `Tambak`.
    No European had ever done such a thing before apparently, and there was quite
    a fuss at the station to find a first or even a second-class ticket. And during
    the search the railway officials displayed the most naive curiosity, and questioned
    the traveller without restraint. Arrived at `Tambak` `X.` descended, and immediately
    the station-master hurried forward and politely assured him that he had made a
    mistake, since `Gombong`, the large town, was the next station but one. He obviously
    could not believe it possible that any European should get out at `Tambak` on
    purpose, and regarded the polite insistence of `X.` that he knew where he wanted
    to go as evidence of some sort of want of sanity, to be passed over as harmless.
    Gesticulating and ejaculating, the worthy gentleman collected quite a little crowd
    of gazers as the white man, followed by `Usoof`, sauntered out of the station.
    Once out of sight, the station-master would have been intensely gratified to see
    `X.`, who did not really in the least know where he was going, turn round and
    ask his follower the way. So they branched off to the left and wended their route
    along the banks of a noisy river, beneath the shade of huge trees which formed
    an avenue by the side of the water. On their right lay the endless padi fields
    of early green and ripening gold, all equally shimmering in the sun. This combination
    of ripe padi, side by side with newly sown, forms a striking feature of Javanese
    agriculture. While gazing upon this warm picture, and congratulating himself that
    someone had had the forethought to plant this pleasant row of trees, the voice
    of `Usoof` from the rear announced that they must now turn to the right. To turn
    to the right naturally meant to go across that sunlit plain. The hand of `X.`
    involuntarily went up to his stiff stand-up collar, and though he could not see
    the face of his attendant, he was aware through his back that he smiled. So climbing
    a rustic stile they branched off to the right and walked across the padi, where
    the lurid light was zigzagging above the corn. Presently the red roofs of a village
    were in sight, and once more the voice of `Usoof` spoke to introduce his birthplace.
    This was interesting, as was the additional information that the little river
    they had now to cross was the boundary of his ancestral land. The house they had
    come all this way to see was deep in the shadow of countless fruit trees, over
    which towered palms of considerable age. The green turf so scrupulously neat,
    and the little group of buildings set round the central house, all combined to
    make a picturesque scene.


    In the front of these cottages, on the green turf, was the reception house—a square
    building, surrounded by benches with a table in the middle. Here the stranger
    was escorted by a crowd of Javanese, cousins and sisters and brothers and aunts,
    without number—for it seemed less of a family than a tribe which had come together
    to do him honour. Then the guest was seated in the place of state, and fruit of
    many kinds in large brass dishes was set before him. It was truly a pleasant spot,
    and there was additional satisfaction in the thought that with so little to guide
    them they had been able to light upon it without lengthy search. Then ensued a
    conversation, during which the visitor learnt and imparted many things. Amongst
    the former he heard that once before, when the railway was being made, a white
    man had been seen in the neighbourhood, but the present occasion was the first,
    when the village had beheld one close. And this stranger told them of the Malays
    and his life amongst them, and how their houses and customs resembled theirs,
    while `Usoof`, alone venturing to remain upright, acted as interpreter as a swarm
    of young brown relations clasped his hands and ruthlessly robbed him of his watch
    and chain, his brass buttons, and all the loose coins in his pockets. Then `X.`,
    who has a material mind, asked to see the title deeds of their lands, which were
    produced and inspected, and they were instructed how to proceed, so that when
    the time came the absent `Usoof`, as the eldest son, should obtain his fair share
    of the inheritance.


    Then, as the shadows were lengthening, and the zigzags on the padi had given way
    to a soft and mellow light fanned by an evening breeze, `X.` gave the signal to
    depart and announced that farewells must be made. Hurrying over his own, he wandered
    towards the river so that he might not witness the anguish of the mother bereaved
    anew of her long lost son, but he could not escape hearing the sounds of sobs
    which arose behind him. And the little procession of two—the European with his
    limp collar, and the Javanese bereft of all his finery—started once more across
    the plain. But the procession grew and grew, as one by one the fond relations
    hurried after it for one more glimpse or one more word for the departing brother.
    Then the traveller began to feel as near a brute as ever in his life before, and
    suggested to `Usoof` that he should bid him good-bye and return for good to the
    bosom of his weeping family. But this he declined to do, and at the rustic stile
    the actual parting came.


    Arrived at the train, the good station-master was still on the look-out and walking
    around as though something unusual had happened, but, tired and hot, `X.` parried
    his questionings with some abruptness. But the interviewer was as persistent as
    if he were on the staff of a London evening paper, and after producing an inverted
    wheelbarrow, which he offered `X.` as a seat, went to his house for a whisky and
    soda—called by the natives "Dutch water." After that walk in the sun, his whole
    physical and nervous system disorganized by the deglutition of strange fruits
    and condiments, and by witnessing heartrending family farewells, an unexpected
    whisky and soda, when such a restorative had seemed as unobtainable as the very
    moon which was beginning to appear, was welcome indeed. The station-master was
    at once the master of the situation, and the hitherto taciturn Englishman, his
    thirst assuaged and his limbs at rest, became as communicative as a star of the
    profession, and answered all questions as fully and docilely as a willing witness
    in the hands of his own counsel.


    ***


    ## CHAPTER XX


    ### BACK TO THE JUNGLE

    '
