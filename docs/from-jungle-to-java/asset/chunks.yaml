    搭乘 `Godavery` 号的航程与之前的航程相似，不同之处在于，那里的美食佳肴让 X. 希望过途中的时间能更长一些。唯一感到不满意的是 Usoof 和
    Abu，因为他们的雇主每晚只给他们三美元。这几位穆斯林人拒绝触碰被盛给他们的食物——那些食物正被粗旷且简练的中国仆人分给一大群各种肤色和阶层的当地人。在第二天结束时，由于他们一直什么都没吃，显得非常凄惨和难过。然而，在多付了几美元花得当的钱后，他们换来了一顿面包和茶的丰盛晚餐，随后他们露出了笑容。


    抵达一个陌生的港口或许没有什么比这更令人愉悦的感受了。对于登陆地之外种种可能，思绪和推测数不胜，想象与期待也同样强烈。当 `Godavery` 号驶入巴达雅（Batavia）时，天还黑暗，雨倾盆而下。一切看起来相当凄惨，但一旦靠岸码头，日光便开始显现，乘客们纷纷上岸。车站距离登陆点有四分之一英里远，这些可怜的人必须在雨中匆忙赶。


    不幸的当地人——提着装有行李的包——被淋透了。欧洲乘客——虽然没那么可怜，因为只有实际穿着的那部分衣服暴露在雨中——也在这场潮湿的抵达中分担了大量的水汽。确实有一条华丽的遮雨走廊，但被货物和其他铁路设备完全堵住了，这些东西似乎比乘客更容易受潮湿影响。行李很快由海关官员礼貌地运过，乘客们进入了一辆装饰豪华的马车——显然，X.
    在爪哇从未见过这种车。。


    抵达巴达雅留下了良好的第一印象，因为这里没有像新加坡那样纠缠的人群，而且有许多马车供租。前往酒店的旅程很长，穿过了城市的商业区，直到到达住宅区。这里的独栋房屋坐落在主路旁，另一侧是一条运河，赋予了该地恰当的荷兰风情。酒店是一座最宏伟的建筑，外面显然有无数间房间，但
    X. 立即感到不寻常的是，房间的地板与地面齐平，不像新加坡和半岛地区那样架空。旅客被分配到一个大小适中的房间，面对着一个院子，左右各是其他房间，事实上，在这些房间前坐着身穿便装的人。这里似乎没有隐私，也许在那种情况下这算是幸运的——然而，X.
    尚未观察到这一点。进入房间后，他关上门，点了他的第一顿饭。


    事实证明这是一顿糟糕的晚餐，由一些令人胃口的食物组成：一盘冷菜、两个水煮蛋、三条椰子油炸的小鱼以及一些像火腿的东西。这第一顿饭可以详细描述，但它只是这种苦涩尝试的尝试，会让
    X. 感到胃部不适。在快速扫过这些毫无食欲的食物表面后，X. 的注意力转向了墙上贴着的告示。这些告示用多种语言写着，警告旅客：如果抵达后没有获得居住许可，将面临处罚。读完这些后，X.
    没有浪费时间叫了一辆交通工具前往英国领事馆。接待他的男士非常有礼貌，提供了他所能的所有信息。似乎如果旅客想了解关于爪哇的事实，该国的官员也同样如此。他不得不填写一份打印好的表格，写下年龄、出生地、居住地和职业等，完成后，为他的辛劳支付了一比半几尔林德。


    下一步是去银行，没有什么能比他在那里受到的热情更让他惊讶的了。那位周到的经理帮助这位陌生人决定去哪里能最好观察这个国家，并且最关键的一点，为他写下了地点和酒店的名字。令
    X. 失望的是，支票取款系统几乎不为人知，总是需要携带现金，如果需要更多，则通过挂号信接收。对于一个多年来遵循东方习俗并依赖支票和“借条”的人来说，携带现金是一个他未准备好的新麻烦。


    在穿过泥泞的街道返回酒店的途中，给旅客留下的第一个新印象是许多售卖蔬菜的当地人——那些看起来很健康的品种，尤其是胡萝卜。在多年没有看到除了在锡罐里长期监禁以外的熟悉蔬菜后，这真是一个令人耳目一新的景象。


    沿途路上，当地男女都在运河的脏水里洗澡，完全没有一丝马来人特有的那种羞涩感。第二点印象是，当地人没有一个穿靴子或鞋子的，他们都赤脚踩在泥泞中穿行。当坐马车过来时，他已经注意到了这种鞋子的缺失，随后被追随者们穿着整齐靴子的脚吸引了注意力。


    难道他们以后也必须在泥泞的街道上赤脚穿行吗？更糟糕的想法是——打破这种局面会落在他头上吗？当地人看起来比半岛的马来人更高、更强壮，但像新加坡一样，他们是混合群体，更显著的是，没有阿拉伯人。对于可能没有访问过我所描述的这个地区的读者，应该解释：新加坡几乎完全由华人居住，而在土著国家，华人的数量远远超过了马来人，以至于人们习惯了随处见到他们，并将他们视为真正的居民。


    到达酒店，X. 松了一口气，发现 Usoof 和 Abu 已经脱了靴子，正轻巧地穿过院子。然后他准备自己自己的午餐，接着是洗澡。为了这样做，必须经过许多目光的注视，因为浴室在不远的地方，到达那里必须穿过整条走廊。这条走廊通向卧室的门，坐在门前的人——正如
    Abu 所评论的——就像市集上摆摊的商贩一样。长椅是豪华款式，有短座垫和长可移动扶手，坐在上面的人们伸着赤脚。女士们也坐在那里，X. 事后得知那并不被视为便装，即当地的纱笼（sarong）和卡巴雅（kabaya）。沿着走廊走第一步需要一些勇气，但除非别人看起来也觉得这很奇怪，否则事情很少持续显得怪异，由于这些斜坐着的游客靠在那里无所事事，甚至不看书，神情无忧无虑，这并不让他感到困难。


    他的午餐或许是当地生活的第一次揭示，这顿饭在华丽的餐厅里吃。这种第一顿饭的详细描述在之后是不需要了的。这种饭餐的基础，可以说是米饭，而伴随米饭的是数无数的菜肴，鱼、肉等。当
    X. 意识到时，这种比例显然有所降低，这只是对马来咖喱的字面且夸张的解释，如果没有那些配菜，咖喱是不完整的。

    '
