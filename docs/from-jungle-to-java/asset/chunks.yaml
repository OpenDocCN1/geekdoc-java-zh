    # THE ROXBURGHE ROMANCES.


    THE BEST VALUE OF ANY BOOKS AT THE SAME PRICE.

    Published on the First and Fifteenth of each month.


    A Series of bright, well-written Stories, etc., daintily produced, with designed
    Art Cover. SIXPENCE EACH: OR IN "Strakeria" Cloth, One Shilling. Each contains
    from 20,000 to 30,000 words, and is well and clearly printed on good paper.


    ## Titles and Authors


    | Title | Author |

    | :--- | :--- |

    | A WIDOW WELL LEFT | R. Manifold Craig. (Ready November the First, 1896) |

    | ONE WEAK MOMENT | E. White. |

    | WITHOUT BLOODSHED | Harold E. Gorst. |

    | THAT CHARMING WIDOW | Clarence Hamlyn. |

    | A ROMANCE OF THE FAIR | L. & H. Cranmer-Byng. |

    | MADEMOISELLE SOPHIE | Arthur J. Ireland. |

    | AN AFTERNOON RIDE | Anne Page. |

    | THE DIAMOND SHOE BUCKLES | Mary Albert. |

    | BLOTTED OUT (Or a Puritan''s Curse) | E. Pullen Burry. |

    | THE PRIEST AND THE ACTRESS (Some Idylls of St. Giles) | Ethel Walker. |

    | MARIE VASELLIS | Josephine Stockwell. |

    | THE DEALER IN DEATH | Arthur Morris. |

    | TOLD AT THE CLUB | Charles F. Rideal. |


    And others in preparation, by Mrs. Cecil Marryat Norris; Mr. Massey Shaw; Mr.
    J. L. Owen; Mr. C. Gordon Winter; The Hon. Stuart Erskine; Mr. Walter Herries
    Pollock; Mr. R. Brinsley; Mr. Graham Everett; Mr. Richard Davey; Mrs. Graham and
    other attractive writers.


    May be obtained through all Booksellers, Newsagents, and Railway Book Stalls;
