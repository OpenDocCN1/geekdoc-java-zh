    # 农小屋生活


    在河边的这间小屋里，生活是如此平稳而均匀，日子以一种愉快的节奏流逝，除了一种整体宁静的享受感外，没有什么可记录。然而，有一次远足值得描述：那是访问邻近处挂牌出售的庄园，此行让人窥见了乡间生活的典型侧面。他们在中午左右接到访客，在下过了一座陡峭的山坡后（当地人正忙着种植茶树），两名英国人发现了一座半隐在溪流弯道处的白色小方屋。


    这栋建筑透着一种荒凉、凌乱感，而周围花园的状况更加剧了这种感觉；即使在离房子有一段距离的地方也能闻到玫瑰的香气，而在花园本身（如果那片荒地称得上这个名字的话），那股气味几乎令人窒息。那里是一片玫瑰丛构成的微型森林，缀满了迷人的花朵，那些玫瑰是
    `X.` 自离开家乡后从未见过的。一切看起来都凌乱、破败且颓废；房屋、藤蔓植物、玫瑰丛、草地、鸽子笼，无不诉说着被疏弃以及缺乏修整的资金——而这种匮乏源于金鸡价格的下跌，这种不幸让许多优良的庄园遭受了，并沦落到如今所访问的这般荒凉荒芜的境地。但即便荒废且无人照看，它构成了一幅何等的画面！那是诗意死亡的实现——一个受害者在歌唱的溪水旁被玫瑰窒息。


    ## 出意之外的主人


    过了很久才有人人来，两位访客坐在门廊上感到有些局促和不安，因为这是他们对邻居的首次拜访，而那位领他们入座的当地人已经消失了，在错综的花园小径发出怪异的叫声，仿佛在呼唤他的主人回家。终于，在漫长的等待之后，沉默、悬念以及对谁会来、从哪个方向来、何时来的惊奇变得几乎无法忍受，这种荒谬的情境严重冲击了他们的神经，以至于两位访客都发出了短促的笑声，这可能源于同样的让孩子在教堂里表现不佳的紧张感——那是恶魔的直接诱导，诱人生出那种我们明知不该做事的欲望。


    终于，在匆促地低语争论是否可以离开后，女主人出现了。她是一位高大、体壮的女士，外表是典型的荷兰人。她穿着常见的白色亚麻外套和短围裙（sarong），双腿是裸露的。她用荷兰语表达了热诚的问候，至少对
    `X.` 来说是荷兰语，因为他对这种语言一无所知。他的朋友仔细地向他解释了这一点，他推断如此，因为女士发出了各种表示惊讶的喉音感叹，转过头看向他，仿佛他确实是一个值得观察的怪人。


    ## 语言障碍


    两人的对话随后变得流利起来，`X.` 完全被遗忘了，他感到被冷落并变得坐立不安，意识到自己极度厌恶这种被忽视的新奇感觉，而且还无法通过发言来吸引任何注意力。然而，他很快得知，我们所察觉的那些微小不便通常远比我们未知的不便那么令人不快，因为这时发生了骚动，那位好女士的丈夫从房子走到门廊时，人们纷纷起身。


    这位绅士身材高且肤色深，留着灰色的尖胡须，像讽刺画里的美国人。他穿着一种奇怪的居家便装（*deshabille*），光脚松散地插在地毯拖鞋里，当访客的目光及到这里时，他们明白了为什么他的肤色如此深。在第一次问候后，主人（`X.`
    后来了解到曾在政府担任过高职，为了种植而放弃了职位）转向他，开始毫无停顿地对他滔演起来。没有其他方式可以描述发生的事情了，因为他不断向客人倾倒语言，完全没有表现出任何回复的意思。


    说访客感到不安只是对他感受的轻描描写——他渴望被认可，而现在他确实得到了。如果他允许主人继续说下去，却不告诉对方自己完全听不懂一句荷兰语，主人会怎么想他？他反复尝试阻挡这股词语的洪流，并用英语和法语解释，在徒无果后，冒着显得无礼和不经心的风险，`X.`
    转向他的朋友，请求他把事情说清楚。朋友用荷兰语说了什么，但他似乎说错了话，因为这完全没有效果，主人继续他的谈话，可能全是关于他想要出售的庄园的优势。


    ## 揭示


    随后，由于形势已毫无希望，`X.` 将神情固定在理性的关注上，等待他停下。但他并没有那么专注，以至于立刻听到好女士对他的朋友说了什么，导致他惊讶得像一样惊叫了一声，并带着压抑的笑声转向
    `X.` 说：“没关系。夫人刚刚告诉我他是全聋，什么话也听不见，所以我说什么都没用，他同样也听不懂你的。”


    “但夫人不能告诉他我不懂荷兰语吗？”`X.` 几乎绝望地惊呼道——但太晚了，因为此时他的朋友再次与女主人陷入交谈，除了再次对主人假装专注之外，别无他法。真是一种奇妙的境地，第一次去别人家里却表现得让你确信他很快就会相信你是故意要侮辱并耍弄他。`X.`
    永远不会忘记那十分钟。


    '
- fmt: '

    ## CHAPTER XIV. GARVET.


    After leaving the cottage on the estate `X.` started for Garvet. The view from
    the train, as it reached its destination, was certainly one of the most beautiful
    that could be imagined. Long reaches of padi fields, backed by hills in a high
    state of cultivation, and the whole watered by little gushing torrents that looked
    cool and refreshing in the all-surrounding sun. It is impossible to describe the
    scenery as it appeared to the traveller, or in any way to do it justice. It is
    altogether new and unlike anything seen in other countries, with the exception,
    perhaps, of Ceylon or Japan, and it is worth a journey from Europe to see.


    The hotel at Garvet proved to be a combination of little buildings, scattered
    about in the gardens surrounding the main buildings, or across the road in enclosures
    of their own. `X.` obtained one of these cottages, and felt that he would be fairly
    comfortable, till an inspection of the bathing arrangements made him shudder.
    When dinner time arrived, *table d''hote* also served to dispel illusions. There
    was the same absence of punkah, the same glaring light, and succession of half-cooked
    clammy dishes. There were only a few diners, apparently mostly residents of the
    place who boarded at the hotel. These gentlemen had put on black coats, and made
    a kind of toilet for the evening meal. But the penance they thus endured was brief,
    as, after hastily disposing of sufficient of the viands to satisfy their individual
    wants, they retired to their verandahs, where `X.` soon saw them reclining in
    all the comfort of pyjamas and bare feet. Apparently the coating of civilization
    was not sufficiently thin to be congenial.


    In the morning the traveller went to pay his respects to the Assistant-Resident,
    who received him very kindly, and gave him all the information he required. This
    rather interrupted the work of the office as, whenever the Assistant-Resident
    turned to any employee to ask how far such and such a place might be distant,
    or the tariff of carriages, etc., the person so addressed, no matter how engaged,
    would, before reply, immediately flop on to his knees. The Regent was also calling
    on the representative of the Government, and to him the Englishman was introduced.
    This native functionary was fat and well-looking, but did not seem to exactly
    bristle with intelligence.


    The Assistant-Resident very kindly conversed freely with his visitor about matters
    affecting the natives, and gave him much information, which, from the nature of
    his own work in `Pura Pura`, interested him greatly. To those whom the subject
    interests, the land system in Java is too well known to need comment here, but
    there were a few facts learnt by `X.` which should remove any idea amongst those
    who have not studied the question, that the laws were either harsh or intricate.
    Indeed, they seem to attain that brevity and simplicity which are the great desideratum
    when dealing with a native peasantry. Thus, a man need pay no rent until his land
    is in bearing. Coffee is the only product whose sale to Government is compulsory.
    All land is classified and subject to a fixed rent, there is therefore a safeguard
    that the fruits of an owner''s industry will not be taxed. Anyone can complain
    if he thinks his land is rated too high, and should be in a lower class, and the
    complaint receives immediate attention. Though the population is large, there
    is seldom any trouble about boundary marks in the padi fields. Owners are content
    with long custom and local knowledge, and their reliance on their host of native
    officials never fails. All new land must be fenced round, if it is contiguous
    to Government land, and on all plantations people must themselves plant trees
    as boundaries and upkeep them. And one register of titles with columns filled
    in and signed, according to its cultivation and classification, answers for all.
    Lastly, let it be mentioned that there is a golden rule, that a native cannot
    sell his land to anyone but his own countrymen, neither to European, Arab or Chinese.
    Thus no individual, tempted by the speculation, can by his selfish action, cause
    harm or annoyance to his neighbours. This one register of titles, mentioned above,
    is gradually filled in and signed as the land is brought into cultivation, and
    an exact record is thus kept of the actual present condition of each native holding.
    When finally signed, and the land yields produce, rent is demanded. The advantage
    of simplicity can only be realized by those whose lot it has been to pose as the
    bringer of glad tidings, and expound the advantages of the last new land code
    with its many paragraphs to an ignorant native population, who, unreasoning, tenaciously
    cling to the title which they already hold and think they understand, obstinately
    refusing, speak the speaker never so plausibly, to exchange it for the very newest
    that can be given to them from the most up-to-date land code in existence.


    After his interview with the courteous official, `X.` departed, pondering on all
    he had heard, and bearing with him a memo, on which was written the various places
    of interest which he had been recommended to visit in the neighbourhood. On his
    return to the hotel the traveller passed what appeared to be the local club. The
    first thing an English official in an outstation in India or the Peninsula will
    do for a stranger arriving with introductions, is to offer to put him up for the
    club, and unless there seem strong reason against it, he will most probably ask
    him to dinner. Apparently this was not the custom here, and so `X.` was free to
    wander about the little town and explore, with nothing more exciting to look forward
    to than a repetition of last night''s gruesome meal in company with the suffering
    tenants of the prandial coats.


    ## CHAPTER XV. BATHS AND VOLCANOES.

