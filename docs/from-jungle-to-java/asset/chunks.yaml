    ## CHAPTER II.


    THE START.'
  toc: []
  trans: '

    X 先生的印象和一些细微的冒险经历由我着手编辑，他要求我将他的个人介绍缩小到符合对读者礼貌的范围（如果我恰好找到了任何读者的话）。正如他的笔名暗示的那样，他倾向于保持一个无名之士。我只需要解释一下，他是马来半岛某个小国家的一名官员，这些国家（很大程度上）处于海峡殖地殖民政府的保护下。后者为了那些爱好安逸的统治者周周考虑，任命官员来分担他们行政管理的忧虑和职责，并免除他们对政府的责任——因为如果没有这种外部援助，该政府在政策上可能会比东方观念所能接受的进步得多。


    正如标题所暗示的，X 先生的职责迫使他必须丛林中定居。“丛林”一词在东方有许多含义，通常用来表达远离文明的地区，尽管那里可能只是荒凉的山脉或没有树的平原。然而，X
    先生的丛林却体现了未足迹世界的英国人所想象的模样。那里是一片充满了茂密森林的山丘和山谷，在河流（大自然的干道或人造的主干道）两旁星星分布着小小的耕绿洲。这是一片美丽的土地，气候被住在那里的人——他们是最好的证人——描述为健康且宜人。由欧洲人组成的小型社区成员对他们这个美丽避风港的设施感到由衷自豪，那里有常青的绿意，并为他们的“辉煌的孤立”感到光荣。批评是被反感的，而认为由于气候影响导致不适的建议则被认为无异于叛徒。


    所以，正如想象到的，当 X 不仅抱怨身体不适，还表现出长期不满的迹象时，这是一件非寻常的事。对于 X 来说——在那个小圆桌俱乐部里不需要称呼先生了——他确实身体不适。这一点不容置疑，这种身体状况简直无异于对该地特权的滥用。但由于他无法对自己的感受给出真实的解释，在参加俱乐部每天午餐前的台球游戏时只是模糊地叹息，大家认为最好忽视他的新动向，对这个问题闭口不提。


    然而，这种明智处理的结果被一位医生的到来完全抵毁了，这位医生带着“驻地医生”这一响亮的官方头衔。这位先生通常对疾病持怀疑态度，只承认那些诚实的、直截了当且值得一位医生关注的疾病，这位医生的名字面前有一连串令人生畏的荣誉头衔，多到他无法一一介绍。但即使真正伟大的人也不总是严格如一，偶尔也会在先例的直径上产生微小的偏差——于是，这位科学家竟然对
    X 的病情投射了兴趣的目光。仅仅是值得注意这一点就足以让这位备受推崇的病人的同伴们感到震惊了，但当这位伟人通过赋予一个古典名字来增加关注时，同情的表达变得无止境了，那种不寻常的关怀几乎让受者难以承受，而受者也保持着符合场合的、自觉的庄严态度。


    这里发生了一些相当*精致（distingué）*的事情，一些全新的事情。庸的抱怨是受谴责的对象而非同情的对象，因为会损害这个健康避风港的名声；但一个由希腊词典中两个词组成的疾病，却赋予了一种或许关口之外更大社区所不知且令其羡慕的特殊地位。这件事经过了严肃的讨论，得出了结论：X
    需要一个改变。并不完全是因为改变对他有好处，而是因为当他回来时，从他去的地方回到他在普拉普拉（Pura Pura）的家，这种改变会对他的健康产生奇迹。由于医生认可了裁决的前半部分，并稍作修改，建议说对于一个辛勤工作的官员来说，很少有种健康状况是不益于改变的，因此剩下的就是选择
    X——获得许可后——必须去的地方了。


    当然，他去槟城、甚至去香港或日本是不行的，那样的远征太过于平凡和陈调了。大家觉得 X 先生应该做些符合这一场合的事，通过前往一个在人和风景上与其尽可能相似的地方，来表达对他居住之地的感激。因此，当主要相关者在知道大家对他的期望后提议去爪维时，这个想法被接受了，并决定就此去爪维。


    那天晚上，俱乐部里进行了一场长时间的聚会，耐心的调酒师 Manop 不得不记录下许多额外的“半杯酒（stengahs）”的消失，因为大家正从各个方面讨论这件事。社区中去过爪维的人回起了对那个国家的经历和回忆，这让另一些人感到恼恼，尽管他们的旅行路程可能更长，但没有走向同一个方向，因此不得不接受沉默倾听者这一不受欢迎的角色。然而，在长期忍耐的刺激下，其中一方（他的故事背景大多在南半球）评论道，当
    X 从爪维回来时，他必须写一本关于那里的书，因为如果他交流的信息只有目前发言者的一半，那本书也将充满信息。这句小讽刺完全由于被字面化理解而搞砸了，因为大家立刻决定
    X 必须写一本书。他徒劳地抗议说，仅仅访问过一个地方是不可能写书的，因为他只能写下别人已知的内容；他的反对被驳回了，他被提醒说，就在前几天，当总阁下“进展”（这是“旅行过”的官方说法）通过一个邻国时（在场的人对此太痛苦地记得，那是他们在丛林中探索并实际修建这条随后进行这一“进展”的道路时经历的许多疲惫的日子），其中一方写了一本书，宣布了一个新发现的地点，甚至严厉地鄙视那些经历过早期艰辛劳作之人的傲慢，因为某些感激的先驱者在定居的第一几个月里用帮助过他们的朋友命名各种地标。


    脚注：[1] “peg”的当地称呼。

