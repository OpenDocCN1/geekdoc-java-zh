    ## 第三章 新加坡。


    我看到 `X.` 在笔记中写道，这座城市的第一印象是远方中最美的——他指的是进城的路线、景色，还是城市本身？这也许并不重要，但可以肯定，他记录了一个事实：对于像他这样一个贫穷的丛林人来说，当他穿好衣服准备重新回到他离开已久的世界时，这里看起来非常广阔且充满生机。一辆
    `gharry`——一种四轮近程马车，配着一个看起来脏兮兮的马夫和一匹小马——正将旅客，或者说正准备将其送到一位居住在新加坡的显赫将军的友好家中。


    新加坡是一个以难以认路闻名的城市，因为所有的路看起来都一样——它们都非常完美——房子也是如此。如果我不是打算告诉你们 `X.` 是如何去爪哇的，我很想停下来讲述有一次因为这件事，作者在错的家里吃了晚餐——而且吃得很好——而他的主人（他从未知道对方的名字）保持了极度的
    `sang-froid`（冷静），从未表现出任何惊讶；但这种自我主义的离题可能会打扰 `X.`，而他有权在这段小历史中占据首位。


    马夫显然并不知道任何具体的个人住在哪里，完全依赖于只有当地居民才知道的奇特描述，因此，`X.` 试图解释他想去哪里是徒劳的。从对路人的质问中得知，没有哪个
    `gharry` 马夫或马来警察听过过那位将军，甚至不知道有这样一位人物存在——`X.` 并没有告诉那位将军这件事——于是，载着 `X.` 的马车以及后面紧随随从和行李的两辆马车，来回穿梭，让路的人感到困惑，因为这种曲折的说明了对当地情况的无知，而对当地的无知意味着是一个环球旅行家，然而并没有邮轮抵达，而且，环球旅行家通常会有两个马来人跟随。


    随后，他再次试图用有力的马来语解释他想去的地方——这让问题变得更加困难——直到路人（大多是去菜市场的厨师）放弃了，认为这个问题太深奥或太琐碎，无法解决。早晨的行程一直持续到那些早去上班的欧洲人坐着他们精神抖爽的马车、赶着快马出现。这时，其中一位商业巨头来救援，他向
    `gharry` 马夫解释道：全军指挥官居住在一栋 `某某先生`曾经住过的房子里，在著名的 `某某先生` 卖了他的赛马并搬出那栋房子之后——“难道马夫不记得吗？”“是的，Omad
    不就是那位绅士提到的首席马夫吗？”听到这里，马夫大喊道：“当然”，然后鞭起小马，脸上带着轻蔑的眼神（仿佛在说“要是他早点告诉我就好了”），径直驶了小镇上最大、最气派的豪宅之一。


    从新加坡的酒店里解脱出来（那里有迷路的旅行者抱怨，还有长相奇异的丛林人来喝酒），`X.` 感到所有半沉睡的文明记忆都回到了身上，当他经过哨兵，进入宽敞的大厅时，受到了主人的友善欢迎。


    正如书中所说，在去除了旅途的痕迹（在这种情况下并没有明显的迹，因为在 `s.s. Malacca` 号上洗澡是可行且惯行的）后，`X.` 与他的主人共进早餐，并被告知了当天的行程——包括下午游览、傍晚外出用餐，然后去花园听月光下的军乐团演奏。对于
    `X.` 来说，新加坡看起来是多么一个欢快的地方，他每晚都是独自用餐，对他而言，乐队的声响是往日的记忆——而且还是月光下的乐队声。是的，那也有它自己的记忆。在月色光好的夜晚，他习惯于坐在露台上，听着居住在他山下村庄的马来人发出的昏沉而单调的歌声。那种吟唱声在升起时非常悦耳听，诉说着陪伴与知足，尽管正因如此，它让孤独的欧洲人感到更加孤独。当地仆人给他送来晚餐后离开，让他去寻找自己的乐子。他像是一项任务，一件已经完成并在夜里收起来的事，被孤独地遗留在宽阔的台上，几分羡慕那些能在朋友相伴下享受月光的当地人。


    在新加坡，`X.` 不需要羡慕任何人，因为他难道不是要在晚后出去，在月光下听一支乐队，而且还是欧洲人演奏的乐队吗？现实等同于预期，因为在新加坡美丽的花园里，月光伴着社会
    `elite` 坐在马车里或湖边草地上散步，即使对于比 `X.` 更 `blasé`（厌世嫉俗）的人来说也是一个愉快的夜晚；而此人在看到 `Usoof` 和
    `Abu` 在这一群陌生人中孤独地站立时，这种感受并不比他在家里孤独沉思时少过，而此时他们正对着月光为朋友们唱歌。


    夜晚在军营食堂的华丽宵宴中结束了。这次外出的直接直接结果是愉悦，随之而来的结果——可能是给那个标识 `X.` 疾病的复合希腊词又增加了一个音节。


    ## 第四章 通往爪哇的路。


    '
- fmt: '

    On the following day, remembering what was expected of him, `X.` hired a gharry
    and proceeded to discharge all such obligations as etiquette demanded from one
    in his peculiar official position. The first and foremost of these was to inscribe
    his name in a book in the ante-room of the office of the Colonial Secretary. The
    names in this book would make interesting reading, and, thought `X.`, probably
    become a source of wealth could one take it into the smoking-room of a London
    club and lay ten to one that no three people present could locate the places named
    upon a map. `Perak`[[3]](@public@vhost@g@gutenberg@html@files@27749@27749-h@27749-h-0.htm.html_Footnote_3_3)—or
    as they would call it in the smoking-room, Pea rack—Selangor, Pahang—called at
    home Pahhang—Jelebu, Sungei Ujong—also Londonized into Sonjeyajang—and many others
    of unaccustomed sound.


    Official routine over (this should be semi-official routine, suggests `X.`, who
    fears that he may be held responsible for any error of the writer, which may lead
    it to be supposed that he is arrogating to himself any real Colonial Office rank)—however,
    it is difficult to be so observant of nice distinctions—`X.` next paid a visit
    to `Messrs. John Little and Co.`. Every one who has been to Singapore has been
    to `John Little''s`, for it is better known to the dwellers in that city than
    even `Whitely` to Londoners. `Whitely` has rivals, `John Little` has none. From
    this famous provider of necessaries and superfluities to the hospitable club is
    but a step, and there the traveller lunched. This club is the meeting-place of
    all the prominent merchants in Singapore. The building is a fine one, with a verandah
    overlooking the sea, and the members always cordially welcome strangers and neighbours
    from the adjoining peninsula. Having said this much I feel compelled to risk incurring
    the displeasure of `X.`, who will be credited with having told me, and add that
    the company is better than the cooking. The quality of the fluids and the quantity
    are without reproach, but the food!—that is one of the things they manage better
    in the jungle.


    In the afternoon the General was again as good as his word, and took his guest
    for a drive, showing to his wondering eyes all the beauties of the new water-works.
    The China mail had that morning come in, and this favourite resort was dotted
    over with evident passengers, some of them globe-trotters. What would the titled
    traveller have said had his hurried steps taken him that way? In the evening His
    Excellency gave a dinner party to twenty guests culled from the most select circles
    in Singapore. To sit at table with so many Europeans would at any time have been
    a new sensation to `X.`, but to suddenly find himself one of such a distinguished
    company was almost alarming in its novelty. However, being happily situated by
    the side of Beauty, the situation expanded generally, and had any member of The
    Community been watching, he might have thought that `X.` was proving false to
    the creed that there was no place like `Pura Pura` for a man to dwell in.


    That which to the other diners was a matter of every day, to him was both a present
    pleasure and a glimpse of the past. It was, of course, quite hopeless to attempt
    to explain to anyone whence he came, or where he lived, for the very name of `Pura
    Pura` was unknown to them, and so it was necessary to pose as a passenger passing
    through *en route* to `Java`. Some amongst the company had been to `Java` (including
    the host), and all spoke in high terms of the civility to be found there.


    In the morning the traveller took leave of his kind host, who left first at `5.30
    a.m.` for some early little game of war, a description of which would probably
    have been as vague to a civilian as would the geographical position of `Pura Pura`,
    or the exact official status of `X.`, to members of the company of the previous
    evening. The great soldier having driven off in full uniform through a throng
    of salaaming menials of various nationalities, `X.` entered his humble gharry,
    and, followed by `Usoof` and `Abu`, drove to the `Messagerie` wharf. The steamer
    for `Batavia` was the `s.s. Godavery`, which was in connection with the mails
    for home. The cost of the passage is, perhaps, for the actual distance travelled,
    the most expensive in the world. The time taken by the voyage is thirty-six hours.


    Footnotes:[[3]](@public@vhost@g@gutenberg@html@files@27749@27749-h@27749-h-0.htm.html_FNanchor_3_3)
    Pronounced Perah.


    * * *


    ## CHAPTER V


    ### BATAVIA.

