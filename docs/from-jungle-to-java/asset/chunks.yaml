  trans: '

    X. 得知从 Buitenzorg 出发的恰当行程是乘坐马车 `via` `Poentjuk` 到达 `Sindanglaya`，在那里确保好一间楼房后，应在
    `Gezondleid''s` 所稍留。旅程的下一阶段是前往 `Tjandjoer`，然后到达 `Garvet`。在 `Garvet` 呆一周后，再次前往
    `Djoedja`、`Solo`、`Semarang` 等地，但旅行者已经对爪哇岛的酒店生活厌倦了，因此决定立即接受收到的一份友善邀请，住在离 `Soekaboemi`
    不几英里的一个庄园里。在乘坐头等车厢行驶了几个小时后（这一事实值得记录，因为即使买了了头等票，也很少能有这样的住宿），他如期到达了指示他下车的车站。在这里，他的房主已经派了两匹小马接他，一匹供他自己，一匹供他的仆人用，还有几个苦力搬运他的行李。于是，`Abu`
    被留在站长的家中照看剩下的行李（数量惊人，运输费用几乎等同于主人的头等票价），X. 在 `Usoof` 的跟随下，开始了通往目的地的十英里骑行。道路非常崎岖，在路程的前半段，穿过一片目力所及、种满了
    `padi` 的开阔土地。那些小马并不在意石子路，有力地向前走，仿佛习惯了在坚硬的高公路上驰骋。过山谷后，路线开始攀爬山脊，庄园就坐落在海拔 `2,000`
    英尺的山顶。在爬山的几乎整个过程中，景色如此壮丽，以至于旅行者不断惊叹地让同伴停下来观察。正如前文提到的，`Usoof` 是当地人，他装出一副主人般漠不在乎的神情注视着，只是提醒他的主人，他一直说过这里是一片非常好的土地。数英之外，`padi`
    田向展开来，在远处逐渐收窄，在这片翠绿色的毯野中，星星分布着一些色调较深的绿色小丛，这些是环绕在幸运的地主们房屋群周围的树木。每隔一段时间，在下方铺开的绿色毯上，就会闪烁的水带在阳光下像银子一样发光。山丘也都种满了
    `padi`，看起来像多草的山坡，背景由山顶的梯田组成。它们层层叠叠地连成山脉，直到在最远处，高耸入云的山如巨人般屹立在所有山峰之上。这确实是一个值得远道而去的奇景，一种未旅行过的眼睛甚至无法隐约想象的绿色财富。如果报酬是这样的，那么旅途的劳顿、油腻的菜肴或没有面包的餐食将微不足道。即使通往这里的路只通向一家最简陋的路边旅馆，这景色也让这次远行变得值得，但对即将访问一对以款待外客闻名的夫妇的期待，让这种喜悦倍增了。房主是一位同胞，幸运地娶了一位出身名门显赫的荷兰女士。几乎在山顶上，距离车站约八英里处，立着一座小小的小屋，挂着一个英国风格的招牌，上面写着“猪与哨子”字样。这里有点心等待旅行者，随后行程沿着一条丛林小径继续，不久进入了庄园的耕地坡地。这些坡地覆盖满了
    `cinchona` 树，X. 后来得知这些树正在被茶树迅速取代。这时，在道路的一处凹洼处，一眼看到了下方的房子。看起来是一座小小的英国小屋，舒适地坐落在一个谷中，紧邻一条山溪。近距离观察发现小屋覆盖满了牵旋花和其他藤类植物，走廊封起来了玻璃。这在某种程度上让他想起了
    `Boulter''s Lock` 旁的一座著名的小屋，看到这典型的英式家居，心中涌起一阵奇妙的乡乡愁。溪流对岸立着一座独立的小亭，按照东方所有荷兰房屋的风格，专供客人使用。这栋附属楼通常被认为是长子的房子，但更多是建成并用于客房；在一个招待者和宾客都偶尔想要穿着最适合气候的轻便服装休息的国家，这是一个极佳的安排。一座乡村小桥连接了两栋建筑，桥正上方就是浴室，一部分溪水被引入其中，形成了一个天然的淋浴。溪流、桥和小屋，以背景的山丘和前景的玫瑰为衬托，构成了一幅画面，以至于
    X. 渴望能把它画下来带走并收藏。这间小屋的内部像外面承诺的那样舒适且像家一样，而且，奇迹发生了！墙上竟然贴着真正的墙纸。这种在东方几乎闻所未见的奢侈是女主人技艺的胜利，并且到目前已成功抵御了霉菌和潮湿的侵蚀。房子的主要特征是它看起来像家，其雅的装饰和陈设表明居住者是打算长留的。东方的大多数房子都有一种明显的临时避难所的气息，主人们只是在那里寄宿，直到他们能回到那些目前储存在“家里”的家具用品中。这是
    X. 在这个世界上看到的第二个这样的房子，那里的主人看起来就像是住在那里的（另一处在 `Selangor`）。在这片理想之地，旅行者很幸运地度过了几天时光——在庄园里愉快地骑行的日子——他很快开始渴望这种，并看着茶树的种植，希望这最终能让善良的主夫妇带着财富回到故乡。这个海拔处的气候宜人、凉爽且令人精神振奋，可以遵循英国的时间习惯。不需要像在
    `Pura Pura` 那样清晨 `5` 点起床骑行，X. 发现自己自己在早餐后大约十点开始骑行，不必担心阳光，这种完全的改变提升了他的心情，他在心中默默感谢建议去
    `Java` 游玩的人。

    '
