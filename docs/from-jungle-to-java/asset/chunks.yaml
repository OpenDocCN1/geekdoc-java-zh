  trans: '


    在 `X.` 获得离开丛林的正式许可生效前的这几天里，人们可能会注意到他发生了变化。这位一向很稳重的人变得变得焦躁而不安，`The Community` 的成员们一致认为他处于“旅途自豪感”（journey-proud）——这是邻近一位马来领主用来描述一个人在离开自己的避风港、准备出发时心情的一种愉悦表达。


    但有很多工作要做——那些衣服自从他们离开山口口彼岸的那些城市以来，就再没被打量过，现在必须进行检查，并将它们所有的破绽暴露无遗——蠹虫在最显眼的地方咬了洞，而在其他地方，老鼠简直直接在上面筑了巢。那些衬衫看起来是白白的假象，它们那样躺着，无非是一排排“假衬衫”（dickeys），因为展开后发现，它们已经失去了下摆，下摆早已沦了蟑螂的猎物，或是小鼠幼崽的垫子；领子从磨损处脱落后，高度也遗憾地缩水了；而对靴子部门的检查发现，没有任何东西能经受
    `The Community` 更挑刻的审视了。然而，面对糟糕的情况只能尽力而为，一位缝制皮革的 `Bo Ping` 在这件事上确实尽了最大的努力。


    ### 出发准备


    随后，`Usoof` 和 `Abu` 的衣橱也需要同样的准备，他们是被选择陪伴 `X.` 行走的两个随从。这意味着当地裁缝会多次造访，他们在后房度过很长时间，身边还围着所有的朋友亲戚——因为在
    `Pura Pura`，正如许多其他东方民族一样，有一个人在工作，总会有十个人在看。


    因此，对这些行程的关注并不集中在 `X.` 身上——对某些人来说，他在这件事中完全处于次要角色，只是与 `Usoof` 出发相关的插曲。众所周知，他是要去他的出生地
    `Java`——“Tuan”[[2]](@public@vhost@g@gutenberg@html@files@27749@27749-h@27749-h-0.htm.html_Footnote_2_2)
    `X.` 恰好要去那里。`Usoof` 回家是为了寻找亲人并告诉他们关于自己的所有事，而众所周知，他多年前就离开那里了，那时他只是个怀中婴儿。


    由于这一事实在每天晚上直到深夜都被广泛报道和讨论，期间朋友们吃着面包加糖的轻便点心，并用粉色的糖水冲服，因此 `X.` 最后开始感到，已经既定此行主要是去寻找
    `Usoof` 的母亲，那位母亲可能居住在 `Java` 某个村庄，但她的名字无人知；事实上，她是否还在人世还是一个推测的问题。然而，这项搜寻由于其目标已知的信息极少，反而引起了额外的兴趣，在此处被提及，以便在此后叙述这段搜寻如何引导
    `X.` 离开游客的常路时，人们不会感到惊讶，因为可以理解，如果不尝试完成那些对他期待的事情，他是不可能回到 `Pura Pura` 的。


    ### 行程


    允许 `X.` 离开 `Pura Pura` 的文件如期送达，出发日期也确定了。`Usoof` 和 `Abu` 已经赶着牛车先行出发，`X.` 将于第二天早上离开。`The
    Community` 的几位成员好意来送别，坐在长长的“半小时”（stengahs）上显得平静而优越，而这位即将出发的旅行者则试图在十五分钟内完成关于他不在期间事务处理的最后指示。


    然而，在写下各种小备忘录，并对马夫和租户们下了许多关于照顾家中马、羊、鹅、狗、熊、驯化的白鹭、豪鼠和其他牲畜的指令后，旅行者坐上了他的双人轻马车，心中涌起了一种所有即将暂时离开
    `Pura Pura` 幽静之地的人都会产生的失落感。就这样，他向着外面广阔的人间出发。第一次远见是在二十四英里之外，在穿过一些想象中最美丽的丛林风景后到达。这片文明的绿洲是他登船港口所在的国家首都。`X.`
    在此留了一晚，接受了那位好医生的招待，那位医生看过了他的症状，并以科学的方式对其进行了定位和命名。对于一个刚从丛林出来的人来说，由于有陌生的面孔，这个夜晚看起来充满了新奇和活力。伙伴中的一个是一个法国罗马教神父，在各国广为人知是一个实干派且志同道合的伙伴。还有一位带有头衔的绅士——一位刚从英国来的访客——如果不是他在用餐期间感谢天佑，他在那些地区没有遇到那种类型的人，他本该被称为环球旅行者。


    这位对没有环球旅行者感到高兴的绅士，要在如此短的时间内前往如此多的地方，`X.` 只能困惑而羡慕地看着他。因为他是在经过一个月深思熟虑后才开始旅程，期间关于请假和医学证明的信件已达到了官方规模；而这位旅行者随身带着所有的计划文件，如果得知这位访客真的在规定时间内完成了任务并看到了他所计划的一切，将很有趣。也许，等他回到家，他的圈子——其他有头衔的人——会逼他写一本书，以满足我们合理的好奇心。

