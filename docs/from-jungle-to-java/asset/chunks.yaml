    ## 第六章。正式的拜访。


    午餐后，X. 去兜了车。巴达达的所有最值得关注的特征都在指南书中详述了，因此建议只提到那些与英国殖民地城市不同、且令旅行者认为值得的几点。主要的一点是，所有居民的房屋都建在高马路旁；不像在新加坡那样，有坐落在自己院子里的隐蔽豪宅。所有的房子都*显而易见*，以至于那些社交活跃的人在傍晚开车散步时，通过开启的灯光，一眼就能看出谁在家并准备好接待。而那些未准备好招待的人就坐在半黑暗中。这些房子缺乏隐私的程度，正如酒店的门廊一样。。


    马路两旁种着高大入云的树，它们的存在证明了这座城市并非雨后春笋般生长。没有遇到任何欧洲人；后来得知，这是因为在这个时间他们都在睡觉。起初看起来这里没有商店，但仔细观察发现，商店就在一些私人住宅的同一个屋顶下，且它们离道路较远。英国教堂显得空冷清清，关闭着且无人问津。也许是司机在告诉旅行者那里从不被使用时，是在诽谤这个社区。普通的马车是一种*双向背坐*（dos-à-dos），一种像倒过头的爱尔兰车一样不舒服的交通工具，但酒店提供了优质马车。


    随后，我们的旅行者提议去拜访`Resident`（驻守）——当地的权威——并递上介绍信。他被告知在晚上`7.30`之前不能拜访，而且必须穿礼服。在在大天化日之时在酒店里穿上礼服，并在晚餐时间出门拜访，这似乎是一件荒谬的事；而当他召唤`Usoof`来协助他时，那位面色严肃的个人带着一种无声的怜悯，看着自己的主人在一个异国他乡被迫做这些不可思议的事情。


    然而，当 X. 穿戴得像是要外出用餐一样时，他心下发虚。他觉得，在晚餐时间点这样去一个陌生人的家里，而不表现得像希望被留下来吃晚饭，是不可能的。于是，他羞愧地解开了白色领结，让`Usoof`为他提供了一件晨礼服。然而，这种担心本可以避免的；拜访并未真正发生，因为在通往`Resident`住宅的路上，他遇到一辆迎面而来的马车，里面有一位先生和三位女士。事实证明那是`Resident`和他的妻子女儿们。发现马车停下来真是一个意外的惊喜，旅行者承担了颇为困难的任务：在黑暗中自我介绍并解释自己的装扮。`Resident`英语非常好，他非常热情友善。他很抱歉不在家迎接预中的拜访，但他必须参加一个为纪念`Lomboh
    War`英雄`General`而举办的招待会。接着，这位高级官员表示希望 X.已经获得了他的许可，并告诉他当到达`Buitensug`（那是他管辖范围的边界）时必须更新。X.
    注意到`Resident`没有穿礼服，心里暗自庆幸也没有穿，否则在马车离开时，他看起来就像个没吃上晚饭而失望的人。


    酒店用电光照亮得极其华丽，大理石餐厅更是奢华得有些俗眼。如果 X. 考虑到自己的方便，他本该戴上黑色太阳镜，但实际上他担心在来到陌生国家的第一天表现出更多古怪倾向会惊扰他的随从者，因此他在吃整顿饭期间像猫头鹰一样眨着眼睛。没有他习惯的`punkah`（风扇）也是一种考验。然而，不必担心在桌上过度放纵而发热，因为那些冰冷的椰子油菜肴对任何不雅的食欲表现都是很好的克制。


    用餐结束时，酒店老板告诉 X.，巴达达的`Resident`想通过`telephone`与他交谈。如果说有一个地方让他显得不得光，那就是在那个可怕的、嗡嗡的、含糊不清的仪器面前。在经历了介绍性的“谁在那？”以及重复*令人作呕*的询问身份信息后，你的耳边会响起最令人心恼的轰鸣声，充满了意义却又传不出任何信息，以至于电话那头似乎在嘲笑你，他的语气听起来如此令人生气，你恨不得扔掉电话冲向他。然而，在这一次，X.
    明智地将整件事交给了老板，老板随后告诉他，`Resident`邀请他参加在`Concordia Club`举办的场外音乐会，以纪念当时的焦点人物`General`，并且如果他愿意的话，一位英国朋友稍后会来酒店接他。对于这样一份热情的邀请，唯一的回答已如期传达。


    根据他自己的叙述，X 一生都是一个非常幸运的人。无论他去到哪里，他总是能像俗语说的那样，“脚着陆”。在这次探险中，他的运气没有抛弃他，随着他的同胞的出现（准确地说，这一已成为历史的事件发生在晚上`9
    p.m.`），了一个新的开始，开启了事件链的第一环，这链链最终幸运地将他带到了见过的最美丽的国家。从以后，X. 对电话的看法一直变得友好许多。


    ## 第七章。Concordia 俱乐部的音乐会。


    '
- fmt: '

    The traveller was naturally much impressed with the scene at the Concordia Club.
    In the beautiful gardens, which were gorgeously illuminated, people were walking
    about and sitting down as though it were an English summer night. But, as in the
    East thoughts of health and diet always occupy an extraordinarily prominent place
    in the minds of all who have dwelt there for any length of time, that which chiefly
    struck the stranger was the apparently reckless indifference to fever displayed
    by those `flaneurs` who dawdled about under the trees on this treacherous soil,
    as though it were the harmless green grass of Hurlingham at home. And it almost
    relieved him to hear presently from a lady, to whom he expressed this astonishment,
    that the doctors declared this season of open air concerts was certainly the most
    busy time for colds and fever.


    The Resident and his party were seated at a round table on the top of the flight
    of marble steps leading to the Club. To each person of this group `X.` was presented
    in turn, after which he had the honour of a seat on the right hand of his host
    and thus full opportunity to enjoy the novelty of the surroundings and the excellent
    music of the band. As the party gathered round the table included some of the
    greatest names in the country, people who were in a position to have an intimate
    knowledge of recent events, the conversation proved interesting and instructive.


    Thus the Englishman heard the story of the Balineri war—that terrible defeat and
    massacre of the Dutch troops under the command of the general, who ultimately
    retrieved the position, and to do honour to whom all were assembled to-night.
    `X.` listened as people spoke of the unparalleled treachery of the natives, the
    sufferings of the troops, and the assistance rendered to the enemy by the importation
    of arms by a European. And severe remarks were made as to this latter incident,
    some present insisting that the culprit was an Englishman from Singapore. War
    was in the air—everyone talked of the war, and such an impression did the matter
    make upon `X.`, who heard the conduct of the campaign discussed wherever he went,
    throughout his stay, that it may be of interest to give in a separate chapter
    the story of what was said about the recent war.


    All those who joined the party on the terrace spoke English, to the relief of
    `X.`—and as new guests arrived to join the circle they were formally introduced
    by name to each one among the company in that precise manner which is the fashion
    in America. And likewise when any individual rose to leave he would bid good-night
    to each separate member of the party.


    When I undertook to compile this little account of how `X.` went to Java, it had
    been my intention to arrange what he saw and what he heard in some order of sequence,
    but from the nature of his manner of observation, I find this to be impossible,
    and therefore must record each impression he received and facts of interest which
    he heard, just as they came to him, regardless of apparent want of connection.
    As the chief object of this sketch is to assist others intending to spend a short
    holiday in that beautiful island belonging to our neighbours, this little originality
    may pass.


    Thus on this occasion the traveller learnt that, contrary to his former ideas
    on the matter, the Civil Service was much underpaid, and that, though it corresponds
    with our Indian Civil Service in standard of examination, etc., the scale of pay
    and of pensions falls far short of its prototype. And it may be mentioned here,
    as showing what an important part naval officers are expected to play in Dutch
    East India, that all midshipmen have to pass in the Malay language. The command
    of the squadron on the waters of Netherlands India is the prize of the service,
    to the holding of which the most distinguished naval officers look forward. The
    Governor General of the Dutch possessions in the East is known as His Excellency
    during his term of office. The admiral who commands there not only has the same
    title during the years of his command, but is entitled to retain it for the remainder
    of his life.


    In the course of conversation the Resident kindly informed `X.` that he must not
    be annoyed at being obliged to obtain a permit to travel, since it had been found
    necessary to insist that even his own countrymen should do so, and he had recently
    caused notices to be issued and posted in all the steamers and hotels, so that
    there might be no misunderstanding in the matter. After the concert and the conclusion
    of a most agreeable evening `X.` was introduced to the Harmonic Club, where he
    had supper.


    This, like the Concordia, is a magnificent building with marble pillars and floors,
    more in accordance with his early ideas of the gorgeous East than anything which
    the traveller had seen. The Harmonic Club was built during the time when Java
    was an English possession—and his informant, the Englishman, sighed. It was not
    long before the comer also sighed, when, having seen the beauties of this glorious
    country, he remembered that but for the blindness of some former rulers, unmindful
    of the advice of those on the spot who should know, another India might have been
    held for England. But as the natural beauty of the country was enhanced and made
    complete by the sight of universal prosperity and content, the sound of such a
    sigh from an English visitor is the greatest compliment the present proprietors
    could be paid.


    The first day of `X.''s` stay in Java was now over—a pleasant day enough, as he
    admitted to himself, after a long seclusion in the jungle—the place on which,
    after all, his last thoughts rested, that happy jungle and its kindly inhabitants—represented
    to his immediate view by two inanimate bundles on the floor entrenched behind
    a barricade of boxes in a corner of the room. These were the faithful `Usoof`
    and `Abu`, long since gone to rest—forgetful of all the troubles of their first
    day in a new country.


    ***


    ## CHAPTER VIII


    ### CONCERNING THE LOMOH WAR.

