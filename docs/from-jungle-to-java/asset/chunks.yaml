    \ a certain message deprecating any prompt action, the Governor General took a\
    \ popular step in deciding to send every available man to the seat of war, and\
    \ to render all possible assistance.\n\nThis was done, and the Dutch forces subsequently\
    \ retrieved their fortunes, in some measure avenging the death of their comrades.\
    \ But it was at no small sacrifice, since Java—the Government of which place much\
    \ reliance on military display—was almost destitute of troops. As an illustration\
    \ of this it is related that during this war the Sultan of Deli elected to pay\
    \ a visit to Batavia. As only two battalions of troops were left it was considered\
    \ impolitic that he should know it, therefore the men were marched past him first\
    \ when he was dining in the capital, and then dispatched by train to represent\
    \ other battalions, and march past him once again on the occasion of his visit\
    \ to Buitenzorg the following day. \n\nThe description of the tears of the aged\
    \ Sultan of Lomboh at the destruction of his beautiful palace, and the marvellous\
    \ stories of how jewels and millions of treasure were borne away by the victorious\
    \ General more resembled a page for the \"Arabian Nights\" than a record of facts\
