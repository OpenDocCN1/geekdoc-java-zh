    the work we were to do. It was exhausting, distracting us, robbing us of our righteous
    power and place in the world.


    I sat in the front row, transfixed. It wasn''t the content, on which I barely
    focused. There was nothing in my quick read of The Beauty Myth that was new or
    revelatory to someone raised by a second-wave feminist who had made a documentary
    film about pornography eleven years before. That year, my friends and I had organized
    screenings of the documentary Killing Softly, which carefully deconstructed representations
    of female beauty and docile in advertising, the same ground covered in The Beauty
    Myth. In the question period, a friend of mine gently challenged Wolf on why she
    had so little to say about the particular pressures on Black and Asian women to
    bleach their skin and surgically lift their eyelids in order to conform to Eurocentric
    beauty ideals. We were already ahead of her.


    None of this took away from her magnetism, though. Because what was revelatory
    was Wolf''s person. The fact that these words about beauty were coming from someone
    so young, confident, and conventionally beautiful. She was like a pot-smoking
    older sister who had come of age in the freewheeling 1970s, whereas we had been
    teens in the glossy and suffocating 1980s. It might seem like a small thing, but
    Wolf didn''t dress like a power author. Back then, she faded jeans and T-shirts.
    She had a'
