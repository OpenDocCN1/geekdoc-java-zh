    colleagues applaud this peak personal-branding success in their corner of the
    academy. The trouble, of course, is the comet in question turns out to be a “planet
    killer,” which means Comet Dibiasky is the last kind of brand anyone would want
    (or, indeed, the last brand anyone will have).


