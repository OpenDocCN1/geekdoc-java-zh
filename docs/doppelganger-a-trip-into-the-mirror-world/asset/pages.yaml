  md: 'assault. The first Intifada was raging, and one week earlier I had published
    an angry article in our campus newspaper about Israeli human rights abuses. As
    Wolf’s writing would do two and half decades later, it had caused a firestorm.
    There had been furious excommunications and thousands of copies of the student
    newspaper were thrown in the dumpster outside our offices. There was a campaign
    to get university donors to threaten to withdraw funding unless the paper was
    sanctioned, and at least one tried, without success. I suppose it was my first
    experience with what today is called cancel culture.


    So Wolf could well picked up a trauma vibe from me; she guessed the wrong source.
    When I explained the situation, she was reassuring. She said I had a story to
    tell and encouraged me to write it. She said she would help me place it in The
    New York Times; her boyfriend was an editor. I wrote it, and it was rejected by
    the Times (obviously), but it was published in a small feminist journal called
    Fireweed, in a special issue opposing Israel’s occupation and colonization of
    Palestine. It was my first professional publication; I stroked the journal’s smooth
    glossy cover, amazed.


    For a little after we met, Wolf and I stayed in touch. I remember a late-night
    conversation with her in which I confessed an inability to ever shed my own self-consciousness.
    It was as if I hovered over myself watching, even in the most intimate situations,
    like there was a double of me, always criticizing, correcting my flaws (“I don’t
    know how to be myself. If I’m permanently outside myself,” Simon tells me doppelganger
    in The Double.)) Wolf had an explanation for me, one that seemed to make sense
    of my guardedness. “That is the male gaze,” she said, and I was sure she right.


    We lost too soon after, and I kept only hazy track of her work—the power-feminism
    manifesto With Fire, the advice to Al Gore on being more alpha. I could not relate
    to this shoulder-pad person she had become, a woman who wanted to see so much
    of the kind of power.


    Wolf may well not remember any of this. Provoking emotional reactions from undergrads
    was apparently unusual for her. According to a 2005 article in the San Francisco
    Chronicle, “Her intense energy, deepened with high expectations for her students,
    can bring young women to tears.” I wonder if she used that just-raped line on
    any of them.'
