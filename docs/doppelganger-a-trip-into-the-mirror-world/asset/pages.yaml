  md: '# 1

    OCCUPIED


    The first time it happened I was in a stall in a public bathroom just off Wall
    Street in Manhattan. I was about to open the door when I heard two women talking
    about me.


    “Did you see what Naomi Klein said?”


    I froze, flashing back to every mean girl in high school, pre-humiliated. What
    had I said?


    “Something about how the march today is a bad idea.”


    “Who asked her? I really don’t think she understands our demands.”


    Wait. I hadn’t said anything about the march—or the demands. Then it hit me: I
    knew who had. I casually strolled to the sink, made eye contact with one of the
    women in the mirror, and said words I would repeat far too many times in the months
    and years to come.


    “I think you are talking about Naomi Wolf.”


    That was November 2011, at the height of Occupy Wall Street, the movement that
    saw groups of young people camp out in public parks and squares in cities across
    the United States, Canada, Asia, and the United Kingdom. The uprising was inspired
    by the Arab Spring and youth-led occupations of squares in southern Europe—a collective
    howl against economic inequality and financial crimes that would, eventually,
    birth a new generational politics. That day, the organizers of the original Manhattan
    encampment had called for a mass march through the financial district, and you
    could could tell by all the black clothing and heavy liquid eyeliner that no one
    in that bathroom was on break of derivative trading.


    I could see why some of my fellow marchers had their Naomiis mixed up. We both
    write big-idea books (my No Logo, her Beauty Myth; my Shock *'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'Doctrine, her End of America; my This Changes Everything, Vagina). We both
    have brown hair that sometimes goes blond from over-highlighting (hers is longer
    and more voluminous than mine). We''re both Jewish. Most confusingly, we once
    had distinct writerly lines (hers being women''s bodies, sexuality, and leadership;
    mine being corporate assaults on democracy and climate change). But by the time
    Occupy happened, the once-sharp yellow line divided those lanes had begun to wobbly.


    At the time of the bathroom incident, I had visited the Occupy plaza a couple
    of times. I was mainly there to conduct interviews about the relationship between
    market logic and climate breakdown for what would become This Changes Everything.
    While I was there, organizers asked me to give a short talk about the shock of
    the 2008 financial crisis and the raging injustices that followed—the trillions
    marshaled to save the banks whose reckless trades had caused the crisis, the punishing
    austerity offered to pretty much everyone, the legalized corruption that all of
    this laid bare. These were the seeds of discontent that right-wing populists in
    dozens of countries would eventually exploit for a fiercely anti-immigrant and
    anti—“globalist” political project, including Donald Trump, under the tutelage
    of his chief advisor, Stephen K. Bannon. At the time, however, many of us still
    held out hope that the crash could catalyze a democratic revival and a new era
    of left power, one that would discipline corporate might and empower failing democracies
    to address our many surging emergencies, including the climate emergency. That''s
    what my speech at Occupy was. You could look it up and weep how naive I was.


    Naomi Wolf, once a standard-bearer of 1990s feminism, had intersected with the
    protests all, and I suppose''s where the confusion began. She had written several
    articles arguing that the United States was tipping into a police state. This
    was the subject of her book The End of America, which outlined “ten steps” she
    claimed every government takes on its way out to outright fascism. Her evidence
    that this evil future was now upon us was the aggressive way that Occupy deonstrators
    were having their freedom restricted. The city was not allowing megaphones and
    sound systems to be used in the park, and there had been a series of mass arrests.
    Wolf, in her articles, argued that activists should defy restrictions on their
    freedom of speech and assembly in order to prevent the coup that she insisted
    was unfolding under their noses.'
