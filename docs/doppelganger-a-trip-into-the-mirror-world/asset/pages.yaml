  md: 'its fires of selective belonging and ferocious despising. The figure of the
    doppelganger has been used for centuries to warn us of these shadow versions of
    our collective selves, of these monstrous possible futures.


    Are we not all, at least not quite. But the pandemic, layered on top of so many
    other long-repressed emergencies, has taken humanity we have not been before,
    somewhere close but different. That difference is what accounts for the strangeness
