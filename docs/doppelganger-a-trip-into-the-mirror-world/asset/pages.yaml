  md: 'Looking back I cringe at how easy I had it. If I felt immune to shock, it was
    mainly because of my distance from its sources. It wasn''t my family members who
    were killed by the air. It wasn''t my neighborhood that was in line for demolition,
    nor was it my kid''s teachers who were getting fired so that public schools could
    be converted to private ones.


    But ... Covid was different. It scrambled my world, as it did all of ours. For
    the first four months, while I was still living in New Jersey, I was confined
    to our home with my neurotypical son, trying in vain to help him learn online,
    and more importantly, to soothe his porous soul, which could not help but absorb
    the terror that surrounded us. Ambulances picked up our neighbors, the virus tore
    through our friend group. I was still lucky—I wasn''t on the front lines in the
    Covid wards, but neither was I protected from the pandemic with my usual reportorial
    distance. I woke up every morning exhausted and stared at my various screens in
    a stunned daze. For the first time, this wasn''t someone else''s shock. And then
    the shocks kept coming.


    A state of shock is what happens to us—individually or as a society—when we experience
    a sudden and unprecedented event for which we do not yet have an adequate explanation.
    At its essence, a shock is the gap that opens between event and existing narratives
    to explain that event. Being creatures of narrative, humans tend to be very uncomfortable
    with meaning vacuums—which is why these opportunistic players, the people I have
    termed “disaster capitalists,” have been able to rush into the gap with their
    preexisting lists and simplistic stories of good and evil. The stories themselves
    may be cartoonishly wrong (“You are either with us or with the terrorists”), they
    told us after September 11, along with “They hate our freedoms”). But at least
    those stories exist—and that alone is enough to make them better than the nothingness
    of the gap.


    Gather together, find your footing and your story.” That is the advice I have
    been giving for two decades about how to stay out of shock during moments of collective
    trauma. Metabolize the shock, I would tell people, create meaning together. Resist
    the tin-pot tyrants who will tell you that the world is now a blank sheet for
    them to write their violent stories upon.


    It was solid advice. But Covid made it so very hard to act on. Controlling the
    virus forced upon many of us, including me, the very conditions that make'
