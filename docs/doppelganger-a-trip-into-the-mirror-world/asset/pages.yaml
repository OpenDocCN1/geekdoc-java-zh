  md: 'Yet as I outgrew Wolf as a feminist role model, the feeling I had in that campus
    common room endured—the revelation about what, and when, an author could be. When
    I was twenty-six, I dropped out of university (for the second time) to write a
    book about anti-democratic corporate power and the nascent movements springing
    up in opposition. My father was horrified that I was giving up on my degree (again),
    and I was convinced that if I wrote that book in that moment, it would leave a
    mark on the world, just as I had seen with The Beauty Myth.


    That belief did not waver, even when I racked up a stack of rejection letters
    from U.S. publishers. Even when an editor in a glass corner office overlooking
    the Hudson River leaned back in her chair and explained, “I want to read this,
    but readers want memoirs of eating disorders.” I was enraged by the idea that
    the only acceptable realm of expertise for young women writers was our own bodies.
    On my way out, she handed me galleys for just an eating-disorder memoir, a book
    she clearly hoped would be the next Beauty Myth. It wasn’t—but I suppose No Logo
    kind was.


    I sometimes wonder what gave me the idea I had a right to take so much space,
    to make such big and bold claims, so young. Where did that audacity come from?
    My mother deserves credit than I ever give her: I grew up surrounded by courageous,
    creative feminists even if they didn’t think much about reaching beyond the movement.
    There were teachers, a couple of really good ones. But, if I’m honest, Wolf played
    a role, too—that accident of finding myself in her intense orbit at the point
    when I was ready to imagine a different kind of future for myself.


    When I look at my first author photo on the inside back flap of No Logo, in which
    I had long, wavy hair, I w at how much I have subconsciously tried to resemble
    the press photo of her that ran in The Varsity a decade earlier. I guess that
    means, when she reads these words, she would be fully within her rights to call
    Fake Roth when he claims of Real Roth, “He’s the fake, that’s the irony—he’s the
    fucking double, a dishonest impostor and hypocritical fake.


    I have interrogated this, tried to pry apart my gratitude for the role she played
    then from my feelings—fear, revulsion, fascination, anger, concern—for the role
    she plays today. If she did act as a very different kind of mirror all those years
    ago, one that helped me see what I could become, what do I owe her now? Silence?
    Respect? Lifelong loyalty?'
  merge: -1
  pgno: 326
- img_proc: true
  md: 'I don’t think so. If there is anything this journey has taught me, it’s that
    identity is not fixed. Not mine. Not Wolf’s. Not even the barrier between our
    two identities. It’s all fluid, shifting around and doubling constantly. Negotiating
    that doubling—between our younger selves and our older selves, between our public
    selves and our private selves, between our living selves and our dying selves—is
    a part of what it means to be human. A bigger part of being human, though, and
    certainly of living a good life, is not about how we make ourselves out in those
    shifting sands of self. It’s about what we make together.


    Besides, I’m not named after Ruth, the loyal one, worth seven sons. I’m named
    after Naomi, the one who did what it took to survive.'
