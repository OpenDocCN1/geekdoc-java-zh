  md: 'companies use these data troves to train machines to create artificial simulations
    of human intelligence and human functions, lifelike doubles that carry their own
    agendas, their own logics, and their own threats. What, I have kept asking myself,
    is all of this duplication doing to us? How is steering what we pay attention
