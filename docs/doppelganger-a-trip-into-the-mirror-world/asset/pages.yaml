  md: 'humans most vulnerable to states of shock: prolonged stress and isolation.
    My own isolation grew more extreme when, four months into the pandemic, we returned
    to Canada. It was supposed to be a temporary trip to be close to my parents, but
    like so many others, we got stuck. We now live full-time up a rock at the dead
