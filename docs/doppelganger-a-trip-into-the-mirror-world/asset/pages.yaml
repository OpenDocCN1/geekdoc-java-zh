  md: '# ACKNOWLEDGMENTS


    After a quarter century writing books in a particularly political and editorial
    style, it can be tough to shift gears. I was so fortunate to work with a brilliant
    editorial team that greeted this change in direction with excitement. Kimberly
    Witherspoon of Inkwell Management, my agent, was on board for all the right reasons
    from first phone call. She jumped in with confidence, and we have collaborated
    with a rare warmth and collegiality ever since. I will always be grateful to Sue
    Halpern for introducing us.


    Kim was determined to find an editor and a house that would break many rules of
    corporate publishing as required let this book become what it wanted to be. We
    found that and more in Alexander Star and the whole team at Farrar, Straus and
    Giroux. After an hour talking literary doubles and conspiracy theories with Alex,
    I knew I had someone who would fall down the rabbit hole with me when I needed
    her out. On the best days, the work felt like play. Alex sharpened and deepened
    the text in countless ways, while closely collaborating and drawing wisdom from
    my Canadian editor, Louise Denny, our publisher of Penguin House Canada, as well
    as Martha Kanya-Foster, publisher of Knopf Canada and Thomas Penn, publisher at
    Penguin Books UK. I am deeply grateful to Mitzi Angel and Stefan McGrath for their
    faith in me.


    Before there were agents and editors, there was Harriet Clark. At a moment of
    particularly acute vertigo, I decided to use the restrictions on travel, and the
    wonders of Zoom, to go to the school I had never attended. Harriet made this project
    take root. As for a couple of months of feeling a little underclad, and after
    school, Harriet never stopped teaching me, and by debt this literary douce is
    immense.


    Another great debt is to Kendra Jewel, lead researcher on this project. While
    completing their anthropology PhD at the University of British Columbia, Kendra
    made time to do everything from toppers in psychoanalysis to charter schools in
    Florida. Kendra''s mind is a marvel, and having them have been one of the joys
    of my professional life. We were fortunate to work closely with two other top-notch
    research assistants, Isabelle Jenner and J Mazzuccotelli, both completing master''s
    degree at UBC. This research team worked with tremendous dedication for months,
    conducting literature reviews, checking and checking facts, coming over endnotes—and
    they all deserve pay for the number of Zoom episodes they had to transcribe. I
    am also grateful to Nicole Weber, my former research assistant at Rutgers University,
    who was a wonderful colleague in this book''s early stages.


    I owe thanks to several friends, colleagues, and family members for feedback:
    Bill McKibben, Alex Kelly, Harsa Walia, Cecile Surasky, Jacqueline Rose, Johann
    Hari, Katherine Viber, Rajiv Sicora, Celeste Celeste, Larry Zucker, Nancy Fried,
    MJ Shaw, Christine Boyle, Michele Landsberg, and Stephen Lewis, as well as Beth,
    Michael, and Misha Kline. All came back'
