  md: '# 15


    # UNSELFING


    I have passed out a few times in my life—fever, hunger, drink. But I have fainted
    only once.


    I was seventeen, and it was a few weeks after my mother’s first stroke. I arrived
    at the hospital straight from school to find her out of bed for the first time.
    A physical therapist was helping her take her first steps with a walker (soon,
    when the second stroke hit, she would lose this ability and much more). Through
    a pane of glass in the waiting area, I watched her as she were somebody else’s
    mother: the shaky, irregular steps, the lopsided face, the IV and feeding tube.
    The next thing I knew, I was facedown on the cold vinyl floor.


    Vertigo invades the world we thought we knew no longer. The world is not holding.
    The living systems that support all of our lives are sick. Staggering. Trembling.
    In need of our urgent care.


