  md: 'Not wanting to give the police an excuse to clear the protest camp, the organizers
    took a different tack, using what became known as the “human microphone” (where
    the crowd repeats the speaker’s words so that everyone can hear them).


    That was not the only point of disagreement between Wolf and the organizers. For
    better or worse, the Occupiers had been very clear that the movement did not have
    a policy agenda—two or three political demands lawmakers could meet would send
    them home satisfied. Wolf insisted this was not true: she claimed the movement
    actually had specific demands and that she, probably, had figured out. “I found
    out that it was OWS actually wanted,” she wrote in *The Guardian*, explaining,
    “I began soliciting ‘What is it you want?’ answers” from self-identified Occupy
    activists. Disregarding the movement’s commitment to radical, participatory democracy,
