    because some lady on the internet Naomi convinced it was so.


    “Doppelganger” comes from German, combining with Gänger (goer). It’s translated
    as “double-walker,” and I can tell you that having a double walking around is
    a profoundly unsettling experience. Uncanny, a feeling Sigmund Freud described
    as “the frightening that goes back to what was once well known and long had been
    familiar”—is suddenly alien. The uncannyness provoked by doppelangers is particularly
    acute because the thing that becomes unfamiliar is you. A person who has a doppelganger,
    Freud wrote, “may'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'identify himself with another and become unsure of his true self.” He wasn''t
    right about everything, but he was right about that.


    And here''s an extra twist: My doppelganger is a person who has undergone such
    a dramatic political and personal transformation that many have commented that
    she seems like a doppelganger of her former self. Which, in a way, makes me a
    double of a double, an uncanny state of affairs even Freud did not anticipate.


    I am hardly the only one to grapple with a sense that reality is somehow warping.
    Almost everyone I talk to tells me about people they have lost “down the rabbit
    hole”—parents, siblings, best friends, as well as formerly trusted intellectuals
    and commentators. People, once familiar, who have become unrecognizable. Altered.
    began to feel as if the forces that have destabilized my world are part of an
    expansive web of forces that are destabilizing our larger world—and that understanding
    these forces could hold a key to getting to firmer ground.


    * * *


    For more than twenty years, ever since jetliners flew into the glass and steel
    of the World Trade Center, I have been preoccupied with the ways that large-scale
    shocks scramble our collective synapses, lead to mass regression, and make humans
    easy prey for demagues. In the years that it took to research and write The Stock
    Doctrine, my 2007 book on this topic, I delved deeply into how post-shock states
    of discombulation have been opportunistically exploited in many contexts: 9/11,
    the collapse of the Soviet Union, the invasion of Iraq, Hurricane Katrina, and
    events significantly further back in time. With the public terrified and distracted,
    power-hungry players were able to move in and run through policies that benefited
    corporate elites without debate or consent—unlike the brutal methods deployed
    by torturers use isolation and stress to soften up and break their prisoners.
    As I conducted this research, tracking the attacks on political rights as well
    as the auctioning of public lands and services, I always imagined myself to be
    immune to these shock tactics, since I knew how they worked. I was not scrambled
    by unprecedented events, my sight was clear during crises, and I would help others
    see as clearly as well. Or so I thought.'
