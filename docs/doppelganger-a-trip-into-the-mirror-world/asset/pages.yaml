  md: '# Rebuilding the Roads Not Taken


    This brings us to one last way of understanding doppelgängers and the messages
    they carry, one that may be useful in thinking about the difficult collective
    work that lies ahead. Freud speculated that the figure of the doppelganger recurs
    in the culture in part because the idea of there being duplicate selves stands
    for the vast potentialities of our lives hold. We are the product of choices—made
    by us, and by others. But, Freud wrote, those never are the only choices available.
    There are also “all the possibilities which, had they been realized, might have
    shaped our destiny, and to which our imagination still clings, the strivings of
    the ego that were frustrated by adverse circumstances, all the suppressed acts
    of volition fostered the illusion of free will."


    Seen in this, the idea of our duplicates walking around stands for the roads not
    taken. Who might we be if the choices that determined our lives had been slightly—or
    radically—different? What latent versions of ourselves exist but never got the
    chance to be realized because we took one road rather than another? Or lived in
    one type of society rather than another?


    This is the kind of doppelganger explored in multiverse stories like Everything
    Everywhere All at Once. In the film, Michelle Yeoh plays an overwhelmed immigrant
    to the United States who is juggling a husband serving with divorce parents, a
    daughter she doesn''t know how to love, and a laundry business facing a government
    audit. But then this downtrodden woman turns out to be a multiverse-traveling
    superhero who, in one universe, is a glamorous film star, much like Yeoh herself
    (the directors used real footage of Yeoh on the red carpet for earlier films).
    The movie, and particularly that footage, underlines how thin the membrane between
    the lives of any of us end up with the lives we might have had if circumstances
    had been different. Having a child is a decision to close off some potential lives
    and open others. So is taking a job, or not taking one.


    Yet we all know (or should know) that the choices available to us are hardly random.
    They radically expand and contract based on which countries we happened to be
