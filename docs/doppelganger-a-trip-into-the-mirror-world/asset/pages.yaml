  md: 'as it does, one''s interchangeability and/or forgettableness. That''s the trouble
    with doppelgängers: anything you might do to dispel the confusion just draws attention
    to it, and runs the risk of further cementing the unwanted association in people''s
    minds.


    In this way, confrontations with your doppelgängers inevitably raise existentially
    destabilizing questions. Am I who I think I, or am I others perceive me to be?
    And if others start seeing someone else as me, who am I, then? Doppelgängers are
    not the only way we lose control over ourselves, of course. The carefully constructed
    self can be undone in many ways and in an instant—by a disabling accident, by
    a psychotic break, or, these days, by a hacked account or a deep fake. This is
    the perilous appeal of doppelgängers in novels and films: the idea that two strangers
    are indistinguishable from each other taps into the precariousness at core of
    identity—the painful truth that no matter deliberately we tend to our personal
    lives and public personas, the person we think we are is fundamentally vulnerable
    to forces outside of our control.


    François Brunelle, a Montreal artist who has been photographing hundreds of pairs
    of doppelgängers over decades for a project called I''m Not a Look-Alike; put
    it like this: "Someone, out in this world, is looking at himself in the mirror
    and seeing more or less the same thing that I am seeing in my own mirror. Which
    brings us down to the question: Who am I exactly? Am what I see in my reflection
    or something else that cannot be defined and is invisible to the eyes, even my
    own?"


    In the dozens of books that have been written about people who encounter their
    doubles, doppelgängers consistently signal that the protagonist''s life is about
    to be upended, with the double turning their friends and colleagues against them,
    destroying their career, or framing them for crimes, and—very often—having sex
    with their spouse or lover. A standard trope in the genre is a nagging uncertainty
    about whether the double is real or are a long-lost twin. Worse, is the double
    a figment of the protagonist''s imagination—an expression of an unhinged subconscious?


    In Edgar Allan Poe''s short story “William Wilson,” for instance, the reader begins
