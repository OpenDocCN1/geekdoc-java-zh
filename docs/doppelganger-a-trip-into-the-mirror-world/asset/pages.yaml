  md: '# A Note About the Author


    ![](img/b6a319fa2115efb8b1b5faf00f50e136_383_0.png)


    Naomi Klein is an award-winning journalist and documentary filmmaker, and a New
    York Times bestselling author of books including No Logo, The Shock Doctrine,
    This Changes Everything, No Is Enough, and On Fire, which have been translated
    into more than thirty-five languages. She is an associate professor in the department
    of geography at the University of British Columbia, the founding codirector of
    UBC''s Centre for Climate Justice, and an honorary professor of Media and Climate
    at Sydney University. She is the recipient of numerous honorary degrees and doctorates,
    was awarded the Sydney Peace Prize in 2016, and was nominated for an Emmy. The
    Guardian picked No Logo as one of its top 100 nonfiction books of all time, and
    Time chose No Logo as one of its top 100 nonfiction books published since 1923.


    She speaks and lectures widely and her appears in leading publications around
    the world. Doppelganger is her ninth book.


    Visit her online at naomilein.org, or sign up for email updates here.'
