  md: '# INTRODUCTION: OFF-BRAND ME


    In my defense, it was never my intent to write this book. I did not have time.
    No one asked me to. And several people strongly cautioned against it. Not now—not
    with the literal and figurative figures roiling our planet. We certainly not not
    about this.


    Other Naomithat is how I refer to her now. This person with whom I have been chronically
    confused for over a decade. My big-haired doppelganger. A person whom so many
    others appear to find indistinguishable from me. A person who does many extreme
    things that cause strangers to chastise me or express my pity for me.


    The very fact that I refer to her with any kind of code speaks to the absurdity
    of my situation. For a quarter of a century, I have been a person who writes about
    corporate power and its ravages. I sneak into factories in faraway countries and
    across borders to military occupations; I report in the aftermath of oil spills
    and category 5 hurricanes. I write books of Big Ideas About Serious Subjects.
    And yet in the months and years during which this text came into being—a time
    when cemeteries ran out of space, and billionaires blasted themselves into outer
    space—everything as an unwanted intrusion, a rude interruption. Would I participate
    in events leading up to a key United Nations Climate Summit? No, I’m sorry, I
    am overcommitted. Comment on the U.S. withdrawal from Afghanistan? The twentieth
    anniversary of 9/11? The Russian invasion of Ukraine? No, no, and no again.


    In June 2021, this project began to truly spiral out of my control, a strange
    new weather event dubbed “heat dome” descended on the southern coast of British
    Columbia, the part of Canada where I now live with my family. The thick air felt
    like a snarling, invasive entity with'
  merge: -1
  pgno: 6
- img_proc: true
  md: 'malevolent intent. More than six hundred people died, most of them elderly;
    an estimated ten billion marine creatures were cooked alive on our shores; an
    entire town went up in flames. It’s rare for this out-of-the-way, sparsely populated
    spot to make international headlines, the heat dome made us briefly famous. An
    editor asked if I, as someone engaged in the climate change fight for fifteen
    years, would file a report about what it was like to live through this unprecedented
    climate event.


    “I’m working on something else,” I told him, the stench of death filling my nostrils.


    “Can I ask what?”


    “You cannot.”


    There were plenty of other important things I neglected during this time of feverish
    subter. I allowed my nine-year-old to spend so many hours watching a gory nature
    series called Animal Fight Club that he began to ram me at my desk “like a white
    shark.” I did not spend nearly enough time with my octogenarian parents, who live
    a mere half hour’s drive away, despite their vulnerability to the deadly pandemic
    that was ramping through the globe and despite lethal heat dome. In the fall,
    my husband ran for office in a national election; though I did go on a few campaign
    trips, I know I could have done more.


    I engaged in all of this neglect that I could ... what? Check her seriously suspended
    Twitter account? Study her appearances on Steve Bannon’s livestreames for insights
    into their electric chemistry? Read or listen to yet another of her warnings that
    basic health measures were actually a covert plot orchestrated by the Chinese
    Communist Party, Bill Gates, Anthony Fauci, and the World Economic Forum to sow
