    The one I think about is Red Vienna, and the extraordinary childcentered society
    it built in the rubble of the First World War. That experiment fell under the
    boot of fascist force—but the spirit that built metaphorical palaces for children
    in order to tear down prisons was an enormous success. Democratic socialists organized
    at every level—from the workplace to the neighborhood to elected office—and enacted
    policies that were staggeringly popular and effective. The armies of care workers.
    The free diapers and social housing for workers, much of which still stands today.
    The parks and the swimming pools. The right to nature. The artistic and creative
    approaches to children’s education. The refusal to wait off poor or neurodiverse
    children. The insistent welcoming of refugees and victims of ethnic hatred. The
    commitment to providing an alternative to the evils of nationalism was sweeping
    the continent.


    The First World War maimed a generation of soldiers on the field of battle and
    left them disabled, while also creating countless orphans. It was in that context
    Red Vienna’s soaring vision transformed an impoverished, disease-ridden city into
