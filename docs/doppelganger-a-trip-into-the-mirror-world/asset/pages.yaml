  md: 'leather jacket on in her author photo. All of this, and she had written a book
    that people were paying attention to. A Big Book about Big Ideas.


    It had never occurred to me that such a thing was possible. I wasn’t one of those
    kids who mapped their career paths at puberty. I joined no clubs, had no goals.
    I got kicked out of high school once, and I flunked out of junior college when
    my mom got sick, before finally making it to university, where I would drop out
    again. I had no picture of what my life could be beyond a vague sense that I wanted
    to do something with words that let me travel and afford a loft of the kind I
    saw on the television Moonlighting. But what Wolf had done—write a book of ideas,
    command an international audience before hitting thirty, all by calling bullshit
    on patriarchy? That felt like something worthy asiring.


    After the Q&A wrapped up and the mingling began, I introduced myself as the student
    journalist with a shared first name who was scheduled to interview her.


    Wolf locked her eyes on mine. “I knew it was you,” she said. “You look like’ve
    just been raped.”


    I can still feel the jolt she sent through my body. It was a wildly inappropriate
    thing to say, I see that now. In retrospect, it was also an early flag about a
    propensity for jumping to conclusions before having all, or, of the facts. Thinking
    back to the certainty with which she spoke words, I can feel her hunger for intimacy,
    as well as her compulsion to be in the know, to be the expert in every interaction.
    Having learned a little since then about the techniques of charismatic leaders
    in the commingling worlds of spirituality, women’s wellness, and conspiracy, I
    now see it as a textbook power move: I think Wolf was asserting her access to
    some special vein of knowledge to gain my instant trust.


    Absolutely none of this occurred to me at the time, however. Because at the time
    it felt like fact that Naomi Wolf was seeing directly into my soul.


    I interviewed her about The Beauty Myth, in a vestibule off the common room, and
    the article took up a full page in The Varsity, right across from a piece denouncing
    the first Gulf War (“U.S. Out of the Gulf: No More Vietnams!”). And we talked
    more about the book as well. Her instant-intimacy stunt worked, and I spilled
    my guts. I had not just been raped, not recently. But I was in the middle of a
