    it isn’t choked by heat and wildfire smoke or lashed by storms for which we keep
    learning new names (“bomb cyclone”), “atmospheric river,” and “pineapple express”
    all in one long, winter. But it is isolated. Maybe that’s what finally pushed
    me to (or is it “over”?) the edge. The months and months without humans in bodies
