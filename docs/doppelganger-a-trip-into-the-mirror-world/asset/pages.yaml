  md: 'with sharp and useful insights. The results of my never-ending conversations
    with Kyo Maclaear and V can be felt on every page, as my Thursday forest hikes
    with Kara Stanley.


    I owe a particular debt to two extremely busy writers and intellectuals: Keenga-Yamahatta
    Taylor and Chanie Miève. Both engaged enthusiastically with early versions of
    this manuscript and influenced it by both large and small. A conversation with
    Molly Crabble the Jewish Labor Bund had a profound impact at a crucial point,
    as did her interventions later on. I am intensely grateful to my dear friend and
    colleague Anthony, who continues to present various titles on my work. Anthony
    gave feedback on this manuscript and was very helpful in steering me to texts
    about the "Jewish question" in Marxist thought. Roger Hotge at The Intercept edited
    several articles that are mentioned in this text, and supported this project even
    when it meant long disagreements, as did Bess Rusty.


    I am always at loss to know how the talented Jackie Jones, who has been managing
    my professional and personal life since 2005. All I see is that she makes everything
    possible and does so with unwavering kindness and good humor—while being a publishing
    saint.


    In the early stages of researching this book, I had a conversation with Gage Agerill,
    now proved of UBC, which changed my life. I am grateful to him for bringing me
    to UBC and to all my colleagues in the Geography Department and the Centre for
    Climate Justice, particularly Geraldine Pratt and Jessica Dempsey (both readers),
    as well as Mohammed Rafi Arefin, Sara Nelson, Alec Blair, and Jarrett Martineau.
    My seminar students at Rutgers and UBC have been a steadying force in tumultuous
    times: our weekly three-hour discussions never fail to renew my faith in the possible.
    I am also grateful to the remarkable Barbara Mosby for including me as a fellow
    in the University of Illinois’s Social Justice Portal Project, a space for cross-disciplinary
    conversations with activists and scholars who challenged and inspired me.


    There were periods when I needed to run away home for a few weeks and I some truly
    wonderful hosts: the Indigo cottage in Pender Harbour, Jane Walker, Nancy and
    Craig in Seattle. But nothing could have been more nourishing than being springtime
    housemates with V and Celeste in the Hudson Valley. In these pages, I wrote about
    the teachers and education assistants who support and celebrate neurodivergence.
    They also made my writing life possible: Jeanette Lewis, Erin Wilson, Nikki Underwood,
    Robin Hansen, and Tania Obalek. Care labor is true the foundation of the next
    world.


    When richness it is to live a web shimmering with so much creativity, commitment,
    and generosity. And all of this is on top of the more private support and replenishment
    that is my immediate family: Avi, my forever rock on the rock, and T., my northern
    light. This is a book about the instability of the self, but the truth is that
    as long as I have you, I will always know who I am.'
