    And, that going online to find some simulation of the friendships and communities
    I missed, and finding, and instead, The Confusion: a torrent of people discussing
    me and what I said and what I’d done—only it wasn’t me. Her was Which raised an
    alarming question: Who, then, was I?


    In an attempt to make sense of my predicament, I began reading and watching everything
    I could find about doubles and doppelgangers, from Carl Jung to Ursula K. Le Guin;
    Fyodor Dostoevsky to Jordan Peele. The figure of the double can fascinate me—its
    meaning in ancient mythology and in the birth of psychoanalysis. The we twinned
    self stands in our highest aspiration—the eternal soul, ephemeral being that supposedly
    outlives the body. And the double also represents the most repressed, deprived,
    and rejected parts of ourselves that we cannot bear to see—the evil twin, the
    shadow self, the anti-self, the Hyde to our Jekyll. From these stories, I quickly
    learned that my identity crisis was likely unavoidable: the appearance of one’s
    doppelganger is almost always chaotic, stressful, and paranoia-inducing, and the
    person encountering their double is invariably pushed to their limits by the frustration
    and uneasness of it all.


    Doppelgangers, however, are not only forms of torment. For centuries, doubles
    have been understood as warnings or harbers. When reality starts doubling, refracting
    off itself, it often means something important'
