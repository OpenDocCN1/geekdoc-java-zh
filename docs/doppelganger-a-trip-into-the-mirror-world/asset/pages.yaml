    # Feel Like Coral, Like Fish


    The director and screenwriter Adam McKay’s thinly veiled allegory Don’t Look Up
    (2021) is very much about not looking. While monitoring the night sky, Jennifer
    Lawrence’s character, the Michigan State doctoral candidate Kate Dibiasky, discovers
