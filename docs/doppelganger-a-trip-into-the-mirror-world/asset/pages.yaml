  md: 'I tracked her new alliances with some of the most malevolent on the planet,
    the ones sowing information chaos on a mass scale and gleefully egging on insurrections
    in country after country. I investigated their rewards—political, emotional, and
    financial—and explored the deep racial, cultural, and historical fears and denials
    off of which they feed. Most of all, I tried to figure out what kind of responses
    might drain these heavily armed, anti-democratic forces of their fast-growing
    power.


    I felt justified in this pursuit. I have been confused with Other Naomi for so
    long and so frequently that I often felt that she was following me. It seemed
    right that I should follow back.


    In stories about doubles, twins, and imposters, it is often the case that the
    doppelganger acts as an unwelcome kind of mirror, showing the protagonist a vain
    and venal version of themselves. It will not give too much to say, while watching
    my doppelganger, I felt that unwelcome wince of recognition more than once. Yet
    what drove me to write this book, sticking with it all good judgment, and the
    more I looked at her—her disastrous choices and the cruel ways she was often treated
    by others—the more I came to feel as if I were seeing not only undesirable parts
    of myself but a magnification of many undesirable aspects of our shared culture
    as well. The ambient and all-pervasive hunger for ever-fleeting relevance; which
    we treat people who mess up; the trivialization of words and displacements of
    responsibility, and much else. In the end, looking at her helped me see myself
    more clearly, but it also, helped me see better the dangerous systems and dynamics
    we are all trapped inside.


    This, then, is not a biography of Other Naomi, nor does it offer a psychoanalytic
    diagnosis of her behaviors. It is an attempt to use my own doppelganger experience—the
    havoc wrought and the lessons learned about me, and us—as a guide into and through
    what I have come to understand as our doppelganger culture. A culture crowded
    with various forms of doubling, in which all of us maintain a persona or avatar
    online create our own doppelgangers—virtual versions of ourselves that represent
    us to others. A culture in which many of us have to think of ourselves as personal
    brands, forging a partitioned identity that is both us and not us, a doppelganger
    we perform ceaselessly in the digital ether as the price of admission in a rapacious
    attention economy. And all the while, tech'
