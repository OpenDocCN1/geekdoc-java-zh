    Employee name: \" + name);\n        System.out.println(\"Salary : $\"+salary);\n\
    \    }\n}\n```\n\n`Employee` 类是超类，在参数化构造函数中初始化私有变量，并有一个显示详情的方法：\n\n```java\npublic\
    \ class ContractEmployee extends Employee {\n    int duration;\n\n    public ContractEmployee(String\
