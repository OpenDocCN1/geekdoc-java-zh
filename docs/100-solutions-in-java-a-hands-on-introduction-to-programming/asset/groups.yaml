  mdcn: "\n\n## 1.4 Java SE 平台组件\n\n两个重要的 Java SE 平台组件是 Java 环境 (JRE) 和 Java 开发包 (JDK)。JRE\
    \ 包含了执行 Java 程序所需的所有 Java 库，而 JDK 包含了开发 Java 程序所需的库，并针对 Windows、MacOS、Linux 等不同平台进行发布。JDK\
    \ 包含了应用程序开发、编译、调试等所需的工具。它还拥有自己的 JRE，用于运行和测试 Java 应用程序。下图显示了不同的 Java SE 平台组件：\n\
    \n![](img/70651ebceef5c0cb89ccc7cad7a12eef_45_0.png)\n\n**图 1.4：工具和库**\n\n以下是工具和库的简要描述：\n\
    \n- 开发工具和 API：这些工具和实用程序构成了 Java 开发的基础。开发工具包括 `javac` 编译器、Java 启动器、Javadoc 文档工具等。Java\
    \ APIs 是针对不同功能（如网络、XML 解析、GUI 创建、数据库操作等）的即即用的类和接口。\n\n- 部署工具：JDK 提供了在目标机器上部署应用程序的软件。Java\
    \ Web Start 和 Java Plug-In 是部署工具的示例。\n\n- 用户界面工具包：JDK 附带了 Swing、Java2D 和抽象窗口工具\
    \ (AWT) 等 UI 工具包，用于 Java 应用程序的图形用户界面。\n\n- 集成库：Java 数据库连接 (JDBC)、Java 命名和目录接口\
    \ (JNDI) 等集成库提供了访问数据库和远程对象以用于数据操作和网络访问。\n\n- 其他基础库：这些库包含了文件操作、网络、XML 解析、安全、国际化等的\
    \ API。\n\n- 语言和实用库：这些库包括 Math、Collections、Logging、Regular Expressions 等，允许你在 Java\
    \ 程序中进行数据操作。\n\n## 1.5 Java SE 版本历史\n\nJava 标准版 (Java SE) 是一个平台，通过 Java 开发包（JDK）提供的开发工具、API、实用程序和运行时环境来开发健壮、可靠且安全的应用程序。多年来，JDK\
    \ 经历了多次修改，每个新版本都会添加一些增强和新功能。下表列出了 JDK 的不同版本及其对应的特性增强：\n\n| 版本 | 特性 | 增强 |\n| :---\
    \ | :--- | :--- |\n| Java 1.0 | | |\n| Java 1.1 | | | |\n| Java 1.2 | | | |\n\
    | Java 1.3 | | | |\n| Java 1.4 | | | |\n| Java 5 | | | |\n| Java 6 | | | |\n|\
    \ Java 7 | | | |\n| Java 8 | | | |\n| Java 9 | | | |\n| Java 10 | | | |\n\n表 1.1：Java\
    \ 版本\n\n## 1.6 Java SE 9 和 Java SE 10 的特性\n\nJava 8 的发布充满了各种新特性，这些特性对 Java 应用程序开发产生了重大影响。在\
    \ JDK 8 之前，每个 JRE 都将运行时所需的所有类打包在一个名为 `rt.jar` 的 Java 归档 (JAR) 中，它位于 lib 目录下。这导致大量不必要的类进入运行时，增加了\
    \ JVM 的开销。因此，JAR 文件变得体积臃肿，且执行环境无论是否使用，都必须处理所有类。\n\n但 Java SE 9 具有更强的通用性、定制性以及大量的新功能。其中最重要的是\
    \ Jigsaw 项目，它应用新的模块系统将 JRE 拆分为可重用和可交互的组件。程序代码被划分为包含待执行任务的模块。这使得程序更易于重用和管理。\n\n\
    模块化的另一个优势是它让 Java 平台更加轻量且可扩展，使得程序可以在资源较少的较设备上运行。模块化的 JRE 甚至可以用于嵌入式系统。\n\n- Java\
    \ 模块系统 (JPMS)：这是 Java SE 9 最重要的特性。随着系统代码库增长，遇到的重要问题包括：\n    - 代码封装困难\n    - 各部分（JAR）之间的依赖关系缺乏清晰度\n\
    \    - 类路径上的公共类易于访问，导致不当使用\n    - 对所有所需 JAR 的可用性缺乏保证\n\n这些问题都通过模块系统在模块化 JAR 中使用模块描述符来解决。在该文件中，模块可以使用\
    \ `requires` 语句定义其所依赖的所有其他模块列表。此外，为了让模块的包可以被其他模块访问，使用了 `exports` 关键字。如果对某个包没有使用\
