    - Lambda 表达式\n\n# 目标\n\n- 理解继承概念\n- 实现不同类型的继承\n- 理解方法重写\n- 使用抽象类和抽象方法\n- 使用嵌套类\n\
    - 理解接口和 Lambda 表达式\n\n# 5.1 Java 中的继承\n\nJava 提供了继承概念来将具有相似特征的类分组，并创建类层次结构。共同的特征和行为合并到一个类中，称为超类（superclass）或父类（parent\
    \ class），所有其他继承这些特征和行为的类称为子类（subclasses）或子类（child classes）。\n\n子类继承私有成员以外的所有成员和方法。父类的构造函数不被继承，但可以从子类构造函数直接调用，或通过\
    \ `super` 调用。子类除了继承父类的特征外，拥有自己的特征。在子类中声明与父类相同名称的成员会导致父类成员被隐藏（hiding）。\n\n下图显示了\
    \ Java 中不同的继承类型：\n\n![](img/70651ebceef5c0cb89ccc7cad7a12eef_330_0.png)\n\n# 图\
    \ 5.1：继承的类型\n\nJava 中不同的继承类型如下：\n\n**单继承 (Single inheritance)：** 在单继承中，子类只能继承一个父类/超类。\n\
    \n**多级继承 (Multilevel inheritance)：** 在多级继承中，子类继承自一个父类，而该父类本身可以继承另一个单类。\n\n**层级继承\
    \ (Hierarchical inheritance)：** 在层级继承中，父类/超类可以有多个子类，这些子类反又可以在不同层次上有其他子类。\n\n**多重继承\
    \ (Multiple inheritance)：** 在多重继承中，子类可以继承多个父类/超类。由于存在“菱问题”（diamond problem），Java\
    \ 不支持类的多重继承。\n\n菱问题是指当一个抽象类 A 被两个子类 B 和 C 继承的情况。假设该抽象类有一个名为 `test()` 的方法。该方法在两个子类中都会被重写。现在，另一个类\
    \ D 继承了这两个具有相同名称和签名的 `test()` 方法的子类。在这种情况下，子类对象中将创建两个 `test()` 方法的副本。当创建子类对象来访问\
    \ `test()` 方法时，编译器将面临模糊处境，无法决定调用哪个方法。这个问题在 Java 中被称为菱问题，如下所示：\n\n```\n  A\n /\\\
    \nB C\n /\\\n  D\n```\n\nJava 以接口的形式为菱问题提供了解决方案。可以通过在类中实现多个接口来模拟多重继承。你还可以使用 Java\
    \ 8 在接口中引入的接口默认方法（default methods）。\n\n# 5.1.1 创建子类\n\n为了在 Java 中实现继承，使用 `extends`\
    \ 关键字在两个或多个类之间创建父子关系。语法：\n\n```\npublic class Child extends Parent {\n// 子类成员\n\
    }\n```\n\n要访问超类的构造函数，使用 `super()` 方法。以下示例显示了 Java 中单继承的实现：\n\n```\npublic class\
