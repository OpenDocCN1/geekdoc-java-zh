    \    System.out.println(\"Today is: \" + day);\n  }\n}\n```\n\n代码的输出如下：\n\n```\n\
    Today is: Fri\n```\n\n## 2.7 Java 中的运算符\n\nJava 提供了用于对变量存储的数据执行操作的运算符。用于执行操作的符号称为运算符。\n\
    \n例如：\n\n`c = a + b;`\n\n在这里，`c = a + b` 是一个表达式，其中 `+` 是加法运算符，`a` 和 `b` 是操作数。Java\
    \ 支持不同类型的运算符见后续章节。\n\n### 赋值\n\n赋值运算符 `=` 用于将右侧操作数的值赋给左侧操作数。可以同时为多个变量赋值。\n\n例如：\n\
