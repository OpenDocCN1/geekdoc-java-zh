    \ |\n| 性能较快 | 性能较慢 |\n\n**表 5.1：** 静态绑定与动态绑定的区别\n\n## 区分引用类型和对象类型\n\n对象的类型由赋值运算符左侧的类名指示，例如\
    \ `Employee`。引用类型由右侧被调用构造函数的类指示，例如 `Employee objEmp = new ContractEmployee();`。\n\
    \n在这种情况下，对象的类型和引用类型是相同的。然而，Java 允许分配属于继承体系体系中不同类的引用。例如，`Employee objEmp1 = new\
    \ ContractEmployee();`。在这里，对象的类型是 `Employee`，但引用类型是 `ContractEmployee`。因此，在运行时，对方法或变量的任何调用都将被认为来自\
    \ `ContractEmployee` 类而不是 `Employee` 类。\n\n将子类实例转换为其父类是可能的，这被称为向上转型 (upcasting)。例如：\n\
    \n```java\nContractEmployee objCE = new ContractEmployee();\nEmployee objEmp =\
    \ objCE; // upcasting\n```\n\n在向上转型时，父对象无法访问子类特有的成员。\n\n将父引用转换回子类类型也是可能的，这被称为向下转型\
    \ (downcasting)。然而，向下转型需要通过在括号中指定子类类名来进行显式类型转换。例如：\n\n```java\nContractEmployee\
    \ emp = (ContractEmployee) objEmp;\n```\n\n以下示例演示了向上转型和向下转型的区别：\n\n```java\npublic\
    \ class TestEmployee {\n    public static void main(String[] args) {\n       \
    \ ContractEmployee emp1 = new ContractEmployee(\"Emp1\",\"John Smith\", 4000f,\
    \ 6);\n        Employee objEmp = emp1; // upcasting\n        objEmp.displayDetails();\n\
    \n        ContractEmployee emp2 = (ContractEmployee) objEmp; // downcasting\n\
    \        emp2.displayDetails();\n    }\n}\n```\n\n## 5.2 抽象方法和类\n\nJava 允许创建声明方法作为标准，但将实现留给继承类。此类方法被称为抽象方法，并可以使用\
