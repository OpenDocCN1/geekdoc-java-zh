- md: "\n## 5.4 Interfaces\n\nAn interface is a contract that sets the standards to\
    \ be followed by the types that implement it. It is a workaround for implementing\
    \ multiple inheritance. An interface is also a .java file saved with the same\
    \ name as that of the interface. The bytecode of an interface is also converted\
    \ to .class file similar to normal classes.\n\nHowever, unlike classes, interfaces\
    \ cannot have constructors and hence, cannot be instantiated. Methods of an interface\
    \ are implicitly abstract. Fields of an interface must be static and final, and\
    \ it cannot have instance fields. The interface is not extended but implemented\
    \ by classes. A class can implement multiple interfaces. An interface can extend\
    \ multiple interfaces.\n\nUntil Java SE 7, interfaces supported only method declarations,\
    \ that is, methods without a body. However, with Java SE 8, default methods were\
    \ introduced and in Java 9, private methods have been introduced.\n\nInterfaces\
    \ are not used for implementing inheritance hierarchy. Rather, they are used to\
    \ group common methods that can be implemented by different entities as per requirement,\
    \ even if they are not a type of the interface. As a naming convention, the letter\
    \ I is generally prefixed with the name of interfaces to differentiate the interface\
    \ .java files from the class .java files. Interface names are written in CamelCase\
    \ with the first letter of word capitalized. The interface name should imply the\
    \ functionality it performs.\n\nFor example:\n\n```\ninterface IEnumerable\ninterface\
    \ IComparable\n```\n\n### Syntax:\n\n```java\ninterface extends ... ><n{\n// declare\
    \ constants\n// abstract, default, private methods\n}\n```\n\nFor example:\n\n\
    ```java\npublic interface ITestInterface extends Interface1{\n    static final\
    \ int num;\n    public void interfaceMethod();\n}\n```\n\nA class implementing\
    \ an interface must implement all abstract methods, else it must be marked abstract.\
    \ If the class implementing the interface is declared abstract, one of its subclasses\
    \ must implement the unimplemented methods. If none of the abstract class's subclasses\
    \ implement the interface methods, the subclasses also must be marked abstract.\n\
    \n### Syntax:\n\n```java\nclass implements ...\n{\n// class members\n// overridden\
    \ methods of the interface(s)\n}\n```\n\nTo create a new interface in NetBeans,\
