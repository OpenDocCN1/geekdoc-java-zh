    This feature is incorporated to simplify and streamline development.


    Local-Variable Type Inference: This enhancement allows you to extend type inference
    to declarations of local variables with initializers. It also introduces var to
    Java.


    Thread Callbacks: JDK 10 introduces the possibility to stop individual threads
    instead of all threads on threads without performing a global VM safepoint.


    Time-Based Release Versioning: It introduces a new time-based release versioning
    for the version-string scheme of the Java SE Platform and the JDK.


    Other features: Several other high-level features include:


    A default set of root Certification Authority (CA) certificates in the JDK.


    Enabling heap allocation on alternative memory devices specified by the user.


    Using Graal, the Java-based JIT compiler, as an experimental JIT compiler on the
    Linux/x64 platform.'
