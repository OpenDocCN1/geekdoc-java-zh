    ```\n\n## 5.1.2 Method overriding\n\nMethod overriding is a concept that allows\
    \ you to create a child class method with the same signature and return type as\
    \ that of the parent class. This allows the child class to modify or enhance the\
    \ functionality of the parent class method without having to use a new name for\
    \ it. Method overriding is also one of the ways to implement polymorphism in Java.\n\
    \nNote that the overriding method must have the same signature (name, type, and\
    \ number of arguments) and return type as that of the parent class method. The\
    \ access specifier of the overridden method cannot be weaker than that of the\
    \ superclass method.\n\nAt times, the child class might need to use the functionality\
    \ of the parent class method along with that of its overridden version. This can\
    \ be done by invoking the super keyword, that is, super.parentMethodName. Similarly,\
    \ if the child class has a data member with the same name as that of a parent\
    \ class data member, the super keyword can be used to access the parent member,\
    \ that is,\n\nThe following example shows the use of method overriding and super\
    \ keyword:\n\n```java\npublic class Employee {\n    private String id, name;\n\
    \    private float salary;\n\n    public Employee(String id, String name, float\
    \ salary) {\n        this.id=id;\n        this.name=name;\n        this.salary=salary;\n\
    \    }\n\n    public void displayDetails() {\n        System.out.println(\"Employee\
    \ id: \" + id);\n        System.out.println(\"Employee name: \" + name);\n   \
    \     System.out.println(\"Salary : $\"+salary);\n    }\n}\n```\n\nThe Employee\
    \ class is the super class with private variables initialized in the parameterized\
    \ constructor and a method to display the details:\n\n```java\npublic class ContractEmployee\
    \ extends Employee {\n    int duration;\n\n    public ContractEmployee(String\
    \ id, String name, float salary, int duration) {\n        super(id,name,salary);\n\
    \        this.duration=duration;\n    }\n\n    // overridden method\n    @Override\n\
    \    public void displayDetails() {\n        System.out.println(\"Employee Details\"\
    );\n        super.displayDetails();\n        System.out.println(\"Contract duration:\
    \ \"+duration+\" months\");\n    }\n}\n```\n\nThe ContractEmployee class inherits\
    \ the Employee class and initializes the super class variables by calling the\
    \ superclass constructor by using the super() method. It also initializes its\
    \ own variable. The displayDetails() method has been overridden in the ContractEmployee\
    \ class. To use the functionality of the method, the super keyword is used to\
    \ invoke the displayDetails() method of the superclass.\n\nThe @Override is an\
    \ annotation that informs the compiler that the method is overridden from the\
    \ parent class.\n\n```java\npublic class TestEmployee {\n    public static void\
    \ main(String[] args) {\n        ContractEmployee emp1 = new ContractEmployee(\"\
    Emp1\",\"John Smith\", 4000f, 6);\n        emp1.displayDetails();\n    }\n}\n\
    ```\n\nThe TestEmployee class creates an object of the ContractEmployee class\
    \ and initializes the variables by passing appropriate arguments to the constructor.\
    \ The object invokes the displayDetails() method. Note that since the object is\
    \ of the ContractEmployee class, the displayDetails() method of the child class\
    \ is invoked and not of the parent class:\n\n![](img/70651ebceef5c0cb89ccc7cad7a12eef_341_0.png)\n\
    \n**Figure 5.4:** Method overriding\n\n## 5.1.3 Static v/s dynamic binding\n\n\
    Binding of methods and method calls during compile time is called static/early\
    \ binding and at runtime is called dynamic/late binding. All static method calls\
    \ are resolved at compile time and for instance methods at runtime. Java variable\
    \ access also follows static binding.\n\nThe following table lists the differences\
    \ between static and dynamic binding:\n\n| Static Binding | Dynamic Binding |\n\
    | :--- | :--- |\n| Compile time | Runtime |\n| Used for static methods | Used\
    \ for instance methods |\n| Variable access access | Method calls (overriding)\
    \ |\n| Performance is faster | Performance is slower |\n\n**Table 5.1:** Difference\
    \ between Static and Dynamic binding\n\n## Differentiate between the type of reference\
    \ and type of object\n\nThe type of object is indicated by the name of the class\
    \ on the left of the assignment operator, for example, Employee. The type of reference\
    \ is indicated by the class on the right whose constructor is invoked, for example,\
    \ Employee objEmp = new ContractEmployee();\n\nIn this case, the type of object\
    \ and type of reference is the same. However, Java allows assigning reference\
    \ of a different class that is part of the inheritance hierarchy. For example,\
    \ Employee objEmp1 = new ContractEmployee(); Here, the type of object is Employee\
    \ but the type of reference is ContractEmployee. Hence, at runtime, any call to\
    \ methods or variables will be considered from the ContractEmployee class and\
    \ not from the Employee class.\n\nIt is possible to cast an instance of a subclass\
    \ to its parent class which is termed as upcasting. For example:\n\n```java\n\
    ContractEmployee objCE = new ContractEmployee();\nEmployee objEmp = objCE; //\
    \ upcasting\n```\n\nWhile upcasting, the parent object cannot access the members\
    \ that are specific to the child class.\n\nIt is also possible to cast the parent\
    \ reference back to the child type which is termed as downcasting. However, downcasting\
    \ requires explicit type casting by specifying the child class name in parenthesis.\
    \ For example:\n\n```java\nContractEmployee emp = (ContractEmployee) objEmp;\n\
    ```\n\nThe following example demonstrates the difference between upcasting and\
    \ downcasting:\n\n```java\npublic class TestEmployee {\n    public static void\
    \ main(String[] args) {\n        ContractEmployee emp1 = new ContractEmployee(\"\
    Emp1\",\"John Smith\", 4000f, 6);\n        Employee objEmp = emp1; // upcasting\n\
    \        objEmp.displayDetails();\n\n        ContractEmployee emp2 = (ContractEmployee)\
    \ objEmp; // downcasting\n        emp2.displayDetails();\n    }\n}\n```\n\n##\
    \ 5.2 Abstract methods and classes\n\nJava allows creating classes that declare\
    \ methods to serve as a standard but leave the implementation to inheriting classes.\
    \ Such methods are called abstract methods and can be created by using the abstract\
    \ keyword. Abstract methods do not have any method definition, that is, they end\
    \ with a semicolon.\n\nA class with abstract methods is considered as an abstract\
    \ class. It acts as a base for inheriting classes. The requirement-specific behavior\
    \ is then implemented by subclasses.\n\nSyntax:\n\n```java\nabstract class Shape\
    \ {\n    protected float PI = 3.14;\n\n    // concrete method\n    public float\
    \ getPI() {\n        return PI;\n    }\n\n    // abstract method\n    public abstract\
    \ void calculateArea();\n}\n```\n\nThe Shape class is an abstract class with one\
    \ concrete method and one abstract. The Rectangle class inherits the abstract\
    \ class:\n\n```java\npublic class Rectangle extends Shape {\n    private float\
    \ length, width;\n\n    public Rectangle(float length, float width) {\n      \
    \  this.length = length;\n        this.width = width;\n    }\n\n    @Override\n\
    \    public void calculateArea() {\n        System.out.println(\"Length: \" +\
    \ length);\n        System.out.println(\"Width: \" + width);\n        System.out.println(\"\
    Area of rectangle: \" + (length * width));\n    }\n}\n```\n\nThe Rectangle class\
    \ inherits the abstract class Shape and implements the calculateArea() method\
    \ as per its requirement. Similarly, more classes can be inherited from the Shape\
    \ class, such as etc. and the calculateArea() method can be implemented by each\
    \ of these classes in their own way:\n\n```java\npublic class TestShapes {\n \
    \   public static void main(String[] args) {\n        Rectangle obj = new Rectangle(2.3f,\
    \ 4.0f);\n        obj.calculateArea();\n    }\n}\n```\n\nThe output of the code\
    \ is as follows:\nLength: 2.3\nWidth: 4.0\nArea of rectangle: 9.2\n"
