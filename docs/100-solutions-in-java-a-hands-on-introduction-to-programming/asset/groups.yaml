    复用现有类的功能。新类/继承的类被称为子类、派生类或子类。


    多态是词 *poly*（意为多）和 *morph*（意为形式）的组合。多态是一个可以具有多种形式/行为的对象。例如，变色龙可以根据环境改变颜色以保护自己免受捕食者的侵害。在编程中，多态是指对象根据需求以不同方式行为的能力。根据所使用的编程语言，多态可以通过编程中的多种方式实现。


    ## 1.2 Java 编程语言


    Java 是一种流行的面向对象、平台无关编程语言。它允许你开发可以在不同硬件和操作系统上运行各种应用程序。Java 还提供了一个运行时环境，用于在不同设备上执行
    Java 应用程序。


    Java 最初由 James Gosling 和 Sun Microsystems 的工程师团队于 1991 年开发，该公司后被 Oracle 公司收购。它最初是为洗衣机、电视机等消费设备设计的。对于此类设备，需要一种体积小、速度快且平台无关的语言。C
    和 C++ 等语言并不被青，因为它们的编译器对特定的 CPU 有依赖性，而且开发时间和成本较高。因此，Java 成为一种可移植且平台无关的语言，可以在任何平台上执行代码。最初它被命名为
    Oak，后来更名为 Java。


    尽管 Java 的开发是为了满足较小设备的编程需求，但人们发现它能够解决更大的问题，包括 Web 和移动应用程序的后端处理。它迅速获得了普及，并在全球范围内被用于开发嵌入式、桌面应用、Web
    和移动应用等各类应用程序。Java 可用于为中、大型企业甚至为超级计算机创建应用程序。


    ## 1.2.1 Java 的特性和优势


    以下是 Java 编程语言的一些特性和优势：


    - 简单且健壮：Java 的语法源于其前身编程语言，如 C、C++。这使得开发者能够快速学习 Java。此外，Java 删除了指针、运算符重载、多继承等其他特性的复杂性。相反，它通过高效的内存管理和异常处理特性变得更加健壮。


    - Java 基于面向对象的编程范式。因此，它非常适合开发真实世界的应用程序。


    - 平台无关：Java 为早期语言面临的一个大问题——代码的可移植性——提供了解决方案。在编译期间，它将源代码转换为一种中间的、架构中性的格式，称为字节码。这种字节码可以在任何安装了
    Java 虚拟机 (JVM) 的平台上执行。此外，甚至连语言规范（如原始数据类型和运算符的大小）也被定义为与硬件无关。这确保了当操作系统、处理器或系统资源发生变化时，代码能够正常运行。


    - 安全是 Java 应用程序中的重要问题，因为它们是为多个和分布式平台设计的。Java 在应用程序开发过程中在不同级别提供安全检查。JVM 设计在代码执行期间应用其安全特性，以确保代码是良好且按照
    Java 标准编写的。


    - Java 支持多线程应用程序开发，以便并发执行多个任务。在多线程应用程序中，单个程序可以有多个线程独立且并发地执行任务。Java 允许你创建线程池，需要时获取线程。


    - **Java** 支持分布式编程，以便跨网络部署和访问资源。它提供了多个应用程序编程接口 (APIs) 来处理网络上的远程传输和请求。Java 还允许通过将类存储在单独的位置并在运行时动态加载必要的类来实现类的的动态执行。


    - **模块化**：模块化概念从 Java 9 开始引入。它本应整合到 Java 7 和 Java 8 中，但未能实现。直到 Java 1.8，包被封装成可执行的
    .jar 文件供 Java 使用。但从 Java 9 开始，引入了一种名为 Module (模块) 的新结构。模块类似于 JAR 文件，但与 JAR 文件不同，它还以
    module-info.java 形式包含配置信息。这使得模块比 JAR 文件更强大、灵活，因为所有依赖都定义在 module-info.java 文件。使用
    JAR 文件时，应用程序执行期间会加载整个 JAR 文件，但使用模块时，只有依赖列表中的模块会被加载。这使得应用程序能够保持轻量级并运行得更快。


    ## 1.3 Java 平台和版本


    Java 平台是 Java 应用程序的开发和执行环境，是软件和硬件组件的混合。下图显示了 Java 平台的组件：


    ![](img/70651ebceef5c0cb89ccc7cad7a12eef_42_0.png)


    图 1.3：Java 平台


    上图描述了 Java 平台的组件。它由 Java 运行环境 (JRE)组成，其中包含 Java 库 (Java API) 和 Java 虚拟机 (JVM)。在
    C 和 C++ 等语言中，编译后的代码是平台相关的，因为它们以可执行二进制代码的形式存在。然而，Java 编译器将代码转换为中间字节码，这是一组经过优化的指令，可以在任何安装了适当
    JVM 的机器上执行。因此，JVM 为 Java 代码提供了平台无关性。每个操作系统（如 Windows、Linux、Mac 等）都有自己的 JVM。因此，Java
    代码遵循“一次编写，到处运行”的原则。


    Java API/库是一系列准备即用的组件集合，如调用和接口，可用于创建应用程序。例如，Swing 库用于创建 Java 应用程序的用户界面 (UI)。Java
    以多个版本发布以满足特定类型设备的需求。以下是不同 Java 版本的简单描述：


    - **Java 标准版 (Java SE)**：Java SE 平台是创建控制台应用程序或网络应用程序的基础。它包含了核心 API，包括用于高级编程（如网络、安全、图形用户界面
    GUI、数据库操作和 XML 数据解析）的基本类型和类。它提供了虚拟机、开发和部署工具，以及用于高级编程的其他工具包和库。


    - **Java 企业版 (Java EE)**：Java EE 平台是 Java SE 平台的扩展。它为创建和部署具有复杂业务逻辑的大、分布式、可扩展、多层、可靠且安全的企业应用程序提供了工具和
    API。


    - **Java 微型 (Java ME)**：Java ME 平台主要用于为手机、电视机顶盒等小微设备创建嵌入式 Java 应用程序。它包含 Java SE
    API 的子集和一个较小的虚拟机，用于在内存和存储空间较小的设备上执行 Java 程序。Java ME 应用程序通常作为 Java EE 服务的客户端。


    - **JavaFX**：JavaFX 平台提供了轻量级用户界面 API，用于创建使用硬件加速图形和媒体引擎的富网络应用程序。JavaFX 允许你创建具有现代外观的高性能图形应用程序。它还提供了高级
    API 来连接网络上的数据源。JavaFX 应用程序也可以作为 Java EE 服务的客户端。

    '
