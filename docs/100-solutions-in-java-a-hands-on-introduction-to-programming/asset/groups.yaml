    \nJava 类是封装概念的构造。Java 是一种高度封装的语言，因此，没有任何内容可以在类之外声明，即使是 `main()` 方法也不行。在 Java 中，类也是一种数据类型，可以创建该类型的对象来访问和操作类的成员。\n\
    \n类由存储数据的属性/字段（fields）和对属性执行某些操作的方法（methods）组成。语法如下：\n\n```\nclass {\n// 变量声明\n\
    // 方法定义\n}\n```\n\n注意，类的成员被包含在花括号 `{}` 内部。类名必须遵循某些约定：\n\n- 类名应该是一个简单且有意义的名词，例如，\n\
    - 类名可以是大小写混合，但每个后续单词的第一个字母应该大写，例如，\n- Java 关键字不能用作类名。\n- 类名不能以数字或任何符号（美元符号或下划线）开头，例如\
    \ `_Calc` 或 `$Calc`。\n\n以下代码显示了名为 `Calculator` 的类的声明：\n\n```\nclass Calculator\
    \ {\n// class members\n}\n```\n\n在这里，`Calculator` 类也是一种数据类型声明，稍后可以创建多个对象。要创建类的对象或实例，使用\
    \ `new` 运算符，它允许 JVM 为对象分配内存，并将表示该对象的引用/内存地址返回给变量。该变量被称为引用变量。语法如下：\n\n`ClassName\
    \ = new ClassName();`\n\n例如：\n\n`Calculator objCalc = new Calculator();`\n\n在这里，`new\
    \ Calculator()` 语句在运行时为对象 `objCalc` 分配内存，并将内存位置的引用返回给引用变量。Java 允许你先声明对象，稍后初始化/分配内存。例如：\n\
    \n```\nCalculator objCalc;\n```\n\n在这里，`objCalc` 是一个引用变量，尚未指向任何内存位置。也就是说，它是 `null`。此时任何使用此变量的操作将导致错误。要使用此变量，必须对其进行初始化。例如：\n\
    \n```\nobjCalc = new Calculator();\n```\n\n现在，内存已分配给对象，它的引用存储在 `objCalc` 变量中。\n\
    \n# 3.2 访问修饰符\n\n在 Java 中，除了封装数据成员外，可以通过访问修饰符提供进一步的访问限制。当对类未指定修饰符时，默认访问权限是包级。Java\
    \ 支持的访问修饰符如下：\n\n`public` 修饰符使字段、方法或类对相同包或其他包中的任何类可见。因此，它是所有访问修饰符中限制最小的。随着 JDK\
    \ 9 引入模块系统（JPMS），`public` 的含义也提升到了模块级别，基于 `module-info.java` 中的 `exports` 声明。在模块中，`public`\
    \ 关键字可以应用于：\n\n**模块内可见**：未使用 `exports` 关键字导出的模块内的公共类仅在模块内可见。例如：\n\n```\nmodule\
    \ com.ModuleA{\n}\n```\n\n在这里，由于没有导出包，所有类都在模块内可见。\n\n**所有人可见**：使用 `exports` 关键字导出的模块内的公共类对其他模块的类可见。例如：\n\
    \n```\nmodule com.ModuleA{\nexports pkg1.test;\n}\nmodule com.ModuleB{\nrequires\
    \ com.ModuleA // 读取 ModuleA\n}\n```\n\n在这里，pkg1 包被导出，因此其公共类可以被其他模块访问。\n\n**特定模块可见**：仅导出到特定模块的模块内的公共类仅对该模块的类可见。例如：\n\
    \n```\nmodule com.ModuleA{\nexports pkg1.test to com.ModuleB;\n}\nmodule com.ModuleB{\n\
    requires com.ModuleA // 有效\n}\nmodule com.ModuleC{\nrequires com.ModuleA // 不允许\n\
    }\n```\n\n在这里，ModuleA 仅允许访问，因此 ModuleC 将得到错误。\n\n`private` 访问修饰符用于防止类外部访问字段和方法。它是所有访问修饰符中限制最严格的。它不能应用于类和接口。从\
    \ JDK 9 开始，接口中允许私有方法。`private` 访问修饰符通常用于无法直接共享的重要字段。所有此类字段都声明为私有，并使用公共的访问器方法或\
    \ getter 方法来访问它们。\n\n`protected` 访问修饰符用于类之间存在父子关系的情况。声明为 `protected` 的成员可以被相同包中的所有类访问，也可以被其他包中的子类访问。`protected`\
    \ 关键字不能应用于类和接口或接口的字段和方法。\n\n**默认**：当未指定访问修饰符时，应用默认访问修饰符。它仅允许相同包内的类访问类、字段或方法。\n\
    \n"
