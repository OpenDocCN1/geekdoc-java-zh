    # 6.3 Exception handling in Java


    The checked exceptions that a method/constructor is liable to throw must be declared
    in the throws clause. However, for runtime exceptions, the compiler does not make
    this a mandate since more than one runtime exception can occur anywhere in a program,
    and adding code to handle them in every method can affect the clarity of the code.


    For example, if a method expects three arguments before execution, one can check
    the arguments before invoking the method. Thus, if it is possible to recover from
    an exception, it can be made a checked exception, else it can be unchecked.


    To create an exception handler for any code that is liable to cause the error,
    the try-catch block is used.


    Syntax:


    ```

    try{

    // statements that may raise exception

    // statement 1

    // statement 2

    }

    catch() {

    // handling exception

    ```'
