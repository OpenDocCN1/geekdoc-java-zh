    \ of characters must be used as follows:\n\n```\nchar[] message = {'H','e','l','l','o'};\n\
    ```\n\nIn the case of more than one value, a two-dimensional array is required.\
    \ But, the array size is fixed during declaration; hence, it is not possible to\
    \ store string values of different sizes, such as names of persons or addresses,\
    \ etc. Moreover, manipulating a character array can be a cumbersome task.\n\n\
    To overcome this, Java provides the String data type to store multiple characters\
    \ without creating an array. A String variable is an instance of the String class\
    \ and its value is stored within double quotes, for example:\n\nAn instance of\
    \ a String class can also be created explicitly using the new keyword, as follows:\n\
    \n```\nString msg = new String();\n```\n\nTo concatenate strings, Java provides\
    \ the plus + operator. For example:\n\n```\nString msg = \"Hello\";\nString msg1\
    \ = \"World\";\nSystem.out.println(msg + msg1);\n```\n\nA character array can\
    \ be converted to a string as follows:\n\n```\nchar[] msg = {'H', 'e', 'l', 'l',\
    \ 'o'};\nString message = new String(msg);\n```\n\nThe String class provides several\
    \ methods for string manipulation.\nThe following table lists the commonly used\
    \ methods of String class. Consider the string:\n\n| Method | Description |\n\
    |---|---|\n| | |\n| | |\n\n**Table 4.1:** Methods of String class\n\nThe following\
    \ example shows the use of different String class methods:\n\n```java\npublic\
    \ class StringDemo {\n  String msg = \"Hello\";\n  Integer num = 6;\n  public\
    \ void display() {\n    System.out.println(\"Length of string is \" + msg.length());\n\
    \    System.out.println(\"New string after concatenation is \" + msg.concat(\"\
    World\"));\n    System.out.println(\"Extracted substring is \" + msg.substring(2,\
    \ 5));\n    System.out.println(\"String format of Integer is \" + num.toString());\n\
    \    System.out.println(\"Difference after comparison is \" + msg.compareTo(\"\
    World\"));\n  }\n}\n```\n\n```java\nSystem.out.println(\"Character at index 1\
    \ is: \" + msg.charAt(2));\nSystem.out.println(\"First index of character l is:\
    \ \" + msg.indexOf(\"l\"));\nSystem.out.println(\"Last index of character l is:\
    \ \" + msg.lastIndexOf(\"l\"));\nSystem.out.println(\"New string after replacement\
    \ is \" + msg.replace('o', 'a'));\nSystem.out.println(\"Uppercase String is:\"\
    \ + msg.toUpperCase());\nSystem.out.println(\"Lowercase String is:\" + msg.toLowerCase());\n\
    String msg1 = \" Hello\";\nSystem.out.println(\"String before trimming: \" + msg1);\n\
    System.out.println(\"String after trimming:\" + msg1.trim());\n```\n\n```java\n\
    public static void main(String[] args) {\n  StringDemo obj = new StringDemo();\n\
    \  obj.display();\n}\n```\n\nThe code prints the output of different String class\
    \ methods applied on the String. The output of the code is shown in the following\
    \ screenshot:\n\n| Length of string is 5 |\n| New string after concatenation is\
    \ HelloWorld |\n| Extracted substring is llo |\n| String format of Integer is\
    \ 6 |\n| Difference after comparison is -15 |\n| Character at index 1 is: 1 |\n\
    | First index of character l is: 2 |\n| Last index of character l is: 3 |\n| New\
    \ string after replacement is Hella |\n| Uppercase String is:HELLO |\n| Lowercase\
    \ String is:hello |\n| String before trimming: Hello |\n| String after trimming:Hello\
    \ |\n\nFigure 4.7: String class methods\n\n## 4.3 String_arrays\n\nString arrays\
    \ are used to store multiple strings in the same variable. String arrays are created\
    \ in the same manner as arrays of primitive data types. For example:\n\n```java\n\
    String[] items = new String[5];\n```\n\nHere, memory is allocated to store references\
    \ of 5 strings. To manipulate String arrays, loops such as for and enhanced for\
    \ can be used.\n\nThe following code shows the use of a String array:\n\n```java\n\
    public class StringArrayDemo {\n  String[] itemId = new String[5];\n\n  public\
    \ StringArrayDemo() {\n    System.out.println(\"Products Added\");\n    for (int\
    \ count = 0; count < itemId.length; count++) {\n      itemId[count] = \"Item\"\
    \ + (count+1);\n    }\n  }\n\n  public void displayProducts() {\n    System.out.println(\"\
    Products in the inventory are:\");\n    for (String item : itemId) {\n      System.out.println(item);\n\
    \    }\n  }\n\n  public static void main(String[] args) {\n    StringArrayDemo\
    \ obj = new StringArrayDemo();\n    obj.displayProducts();\n  }\n}\n```\n\nHere,\
    \ a string array named itemId is created and initialized in the constructor by\
    \ using the for loop. The enhanced for loop is used to display the elements of\
    \ the array. The output of the code is shown in the following screenshot:\n\n\
    | Products Added |\n| Products in the inventory are: |\n| Item1 |\n| Item2 |\n\
    | Item3 |\n| Item4 |\n| Item5 |\n\nFigure 4.8: String array\n\nThe java.lang.String\
    \ class cannot be inherited as it is final. Strings are immutable hence they cannot\
    \ change later. But, StringBuilder class was used to create mutable strings it\
    \ is much faster.\n\n## 4.4 StringBuilder class in Java\n\nUnlike String objects,\
    \ StringBuilder objects are mutable. The StringBuilder class allows modification\
    \ of the string. StringBuilder offers a simpler choice to concatenate strings.\n\
    \nConstructors of the StringBuilder class:\n\n- StringBuilder(): This is the default\
    \ constructor that provides space for 16 characters.\n- StringBuilder(int capacity):\
    \ This constructor creates an empty object but reserves space for the number of\
    \ characters.\n- StringBuilder(String str): This constructor creates an object\
    \ that is initialized with the contents of the specified string.\n\nThe following\
    \ table lists the commonly used methods of StringBuilder class: \n\n**Table 4.2:**\
    \ Methods of StringBuilder class\n\nThe following example shows the use of different\
    \ StringBuilder class methods:\n\n```java\npublic class StringBuilderDemo {\n\
    \  StringBuilder msg = new StringBuilder(\"StringBuilder was introduced in Java\
    \ \");\n\n  public void display() {\n    System.out.println(\"String length:\"\
    \ + msg.length());\n    System.out.println(\"String after appending: \" + msg.append(\"\
    9\"));\n    System.out.println(\"String after insertion: \" + msg.insert(28, \"\
    SE \"));\n    System.out.println(\"String after deletion: \" + msg.delete(28,\
    \ 31));\n    System.out.println(\"Reversed string: \" + msg.reverse());\n  }\n\
    \n  public static void main(String[] args) {\n    StringBuilderDemo obj = new\
    \ StringBuilderDemo();\n    obj.display();\n  }\n}\n```\n\nThe code prints the\
    \ output of different StringBuilder class methods applied on the string. The output\
    \ of the code is shown in the following screenshot:\n\n| String length:28 |\n\
    | String after appending: StringBuilder was introduced in Java 9 |\n| String after\
    \ insertion: StringBuilder was introduced in Java SE 9 |\n| String after deletion:\
    \ StringBuilder was introduced in Java 9 |\n| Reversed string: 9 avaJ ni deducortni\
    \ saw rediebB |\n\nFigure 4.9: StringBuilder class methods\n\n## 4.5 StringTokenizer\
    \ class in Java\n\nThe java.util.StringTokenizer class provides methods to break\
    \ a string into tokens.\n\nConstructors of the StringTokenizer class are as follows:\n\
    \n- StringTokenizer(String str): Creates StringTokenizer with the specified string.\n\
    - StringTokenizer(String str, String delim): Creates StringTokenizer with the\
    \ specified string and delimiter.\n- StringTokenizer(String str, String delim,\
    \ boolean returnValue): Creates StringTokenizer with the specified string, delimiter,\
    \ and return. If returnValue is true, the delimiter character is also considered\
    \ as a token. If it is false, the delimiter characters are used to separate the\
    \ tokens.\n\nMethods of StringTokenizer class are as follows:\n\n- hasMoreTokens():\
    \ Checks whether there are more tokens available.\n- hasMoreElements(): Works\
    \ similar to the hasMoreTokens() method.\n"
  mdcn: "\n\n## 4.2 Java 中的 String 类\n\nJava 没有提供可以存储多个字符（即字符串）的原始类型。为了实现这一点，必须像如下所示使用字符数组：\n\
