    # 6.1.1 Types of Exceptions


    Java exceptions can be caused by a number of reasons such as user errors, logical
    errors, or systemic errors from some system resources. Therefore, exceptions can
    be broadly categorized as follows:


    Checked exceptions


    Unchecked exceptions


    Let''s take a look at them in detail.'
  - '[PAGE 411]


    # Checked exceptions


    Checked exceptions are anticipated in a program and appropriate handlers are provided
    for them. For example, suppose a user is prompted to enter a number but the user
    specifies a string, this causes a However, this will not affect the program fatally
    as it will have the code to handle this exception and inform the user with an
    appropriate message. In Java, all exceptions are checked except Error and


    Here are some of the checked exceptions:


    InstantiationException: This occurs when an attempt is made to create an instance
    of an abstract class.


    InterruptedException: This occurs when a thread is interrupted.


    NoSuchMethodException: This occurs when the runtime is unable to resolve the method
    that needs to be invoked.'
  - '[PAGE 412]


    # Unchecked exceptions


    Errors and runtime exceptions collectively form the unchecked exceptions:


    **Errors**: Errors are not raised by an application but raised externally. For
    example, java.io.IOException is raised if the runtime fails to open a file that
    exists on the system due to some hardware/system issues. The classes for errors
    are provided in the Error class hierarchy. An application may catch this exception
    or leave it to the program to print a stack trace and exit.


    **Runtime exceptions**: The runtime exceptions are caused within an application
    but are not anticipated such as logical errors or inappropriate use of an API.
    Hence, the application does not have any means to recover from such exceptions.
    For example, the user passes the correct value as a method argument but to some
    logical issue, null is passed which leads to an exception. The application may
    handle this exception or eradicate the error that led to the exception. The classes
    for runtime exceptions are provided by the RuntimeException class hierarchy.


    Here are some commonly observed unchecked exceptions:


    ArithmeticException: This occurs when there is an error in an arithmetic expression,
    for example, divide by zero.'
  - '[PAGE 413]


    ArrayIndexOutOfBoundsException: This occurs when an attempt is made to access
    an array index less than zero or greater than the size of the array.


    IllegalArgumentException: This occurs when an illegal argument is passed to a
    method.


    NegativeArraySizeException: This occurs if the array size is less than zero.


    NullPointerException: This occurs when an attempt is made to access a null object
    member.


    NumberFormatException: This occurs when an attempt is made to convert a string
    to a number.


    StringIndexOutOfBoundsException: This occurs if the index is negative or greater
    than the size of the string.


    The base class for any class in Java is the Object class and for all the exception
    classes, the Throwableable class is the base class. The Throwableable class is
    the child class of the Object class. The two direct subclasses of the Throwable
    class are the Exception class and the Error class.


    The following figure shows the Throwable class hierarchy:'
