    \  }\n  @Override\n  public void defaultMethod() {\n```\n\n```\n// invoke defaultMethod()\
    \ of interfaces\nInterface1.super.defaultMethod();\nInterface2.super.defaultMethod();\n\
    }\n```\n\nNow, an interface can extend another interface. If both contain a default\
