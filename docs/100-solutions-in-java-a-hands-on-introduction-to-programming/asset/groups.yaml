    \n在 Java 中使用哪个命令执行 .class 文件？\n\n- javac\n- java\n- javah\n- jmod\n\n## 答案\n\n\
    c\nb\na\nd\nb\n\n## 作业\n\n研究最新/即将发布的 JDK 版本的新功能。\n\n下载并安装 JDK 10 和 NetBeans IDE。在\
    \ NetBeans 中创建一个新的 Java 模块化项目（Modular Project）。创建一个包含主类文件的新模块并执行 Java 程序。\n\n\
    ## 2 章\n\n## Java 编程构造\n\n在本章中，你将学习如何使用 Java 语言的不同编程构造，例如注释、变量、数据类型和运算符。你还将学习使用决策结构、循环结构和分支语句。\n\
    \n## 结构\n\n- Java 注释\n- Java 中的变量\n- Java 中的数据类型\n- 类型转换\n- 字面量和转义序列\n- 常量和枚举\n\
    - Java 中的运算符\n- 运算符优先级和结合性\n- 输出格式化\n- 用于输入的 Scanner 类\n- 决策结构\n- 循环结构\n- 跳转语句\n\
    \n## 目标\n\n- 学习使用注释、变量、常量和枚举\n- 处理数据类型和运算符\n- 理解不同的决策结构\n- 学习各种循环结构和分支语句\n\n##\
    \ 2.1 Java 注释\n\n注释用于记录程序，以便理解代码或逻辑。它们会被编译器忽略，仅用于描述程序的操作。Java 支持三种类型的注释，将在接下来的章节中进行解释。\n\
    \n### 单行注释\n\n单行注释用于描述单行代码。\n\n语法：\n\n```\n// 注释文本\n```\n\n示例：\n\n```\n// 定义 main\
    \ 方法\npublic static void main(String args[]){\n}\n```\n\n单行注释可以用以下两种方式之一进行使用：\n\
    \n- 行首注释：放在代码之前\n- 行尾注释：放在同一行代码的末尾\n\n示例：\n\n```java\n// 定义 main 方法\npublic static\
    \ void main(String args[]){\n} // main 方法的结束\n```\n\n### 多行注释\n\n多行注释跨多行编写。它以\
    \ `/**` 符号开始，以 `*/` 符号结束。这两个符号之间的所有内容都会被编译器忽略。\n\n示例：\n\n```java\n/*\n * main\
    \ 方法是 Java 程序的\n * 执行点\n */\npublic static void main(String args[]){\n}\n```\n\
    \n### Javadoc 注释\n\nJavadoc 注释样式通常用于记录程序的类、方法等。Javadoc 注释以 `/**` 开始，以 ` */` 结束。注释可以跨多行，符号之间的所有内容都会被编译器忽略。使用\
    \ javadoc 命令生成 Javadoc 注释。\n\n示例：\n\n```java\n/**\n * 这是执行点，main 方法。\n * @param\
    \ args 未使用。\n * @return 无。\n */\npublic static void main(String[] args){\n}\n\
    ```\n\n在这里，`@param` 和 `@return` 是 Javadoc 注释识别的内置标签示例。\n\n## 2.2 Java 中的变量\n\n\
    任何程序的基本实现都是存储和处理数据。Java 支持不同类型的数据，如数字、字符、布尔值等。为了存储这些类型的值，Java 使用变量，变量是赋予存储数据的内存位置的名称。变量根据其存储的数据类型具有不同的数据类型。Java\
    \ 是强类型语言；因此，在编译期间，每个变量都会被检查其存储的类型。如果发现类型不匹配，将抛出编译错误。\n\n语法：\n\n```\ndatatype variableName;\n\
    ```\n\nJava 支持的任何类型。\n有效的变量名。\n\n示例：\n\n```java\n...\nint userId;\nString password;\n\
    ...\n```\n\n在这里，声明了两个变量，即 `userId` 和 `password`。`userId` 的类型是整数，`password` 的类型是字符串。根据数据类型为变量分配内存。在代码中使用变量之前，必须对其进行声明。\n\
    \n变量名遵循某些约定：\n\n- 变量名不能是 `static`、`void`、`int` 等关键字。\n- 变量名可以包含字母、数字或下划线 (`_`）。\n\
    - 变量名对大小写敏感。\n- 单单词的变量名应该是小写，例如。\n- 多个单词的变量名首字母应大写。\n\n下表列出了一些有效和无效的变量名：\n\n|\
    \ | |\n| :--- | :--- |\n| 有效： | 无效： |\n| userId | 1variable |\n| password | variable-\
    \ |\n| age | _variable |\n| totalAmount | static |\n\n变量初始化示例：\n\n```java\n//\
    \ 声明两个变量\nint a, b;\n\n// 初始化 a 和 b\na=20; b=10;\n\n// 声明一个变量并初始化两个\nint x = 4,\
    \ y;\n\n// 声明一个变量\nbyte age = 20;\n\n// 声明并初始化多个变量\nint val1 = val2 = 10;\n```\n\
    \n"
