    \ Creating and executing a Java program using JDK 10\n\nUntil JDK 8, developers\
    \ generally used the directory structure src/main/java for the source directory.\
    \ For example, the main class file Hello.java would typically be present in a\
    \ package com.pkg1.app and the overall path would be src/main/com/pkg1/Hello.java.\
    \ This has been the traditional mode of organizing code so far. However, with\
    \ the new JPMS from Java SE 9 onwards, the mode of structuring and writing code\
    \ has been modified.\n\nA Java 9 module is a self-describing collection of code\
    \ and data. It can contain several packages that in turn may have one or more\
    \ classes, interfaces, etc. The module may also contain resource files, property\
    \ files, etc. To create a complete application, a collection of such modules needs\
    \ to be integrated. Each module is a building block with a larger structure. In\
    \ short, instead of creating one huge Java project, now it is possible to create\
    \ multiple modular functional units that can be integrated to form an application\
    \ and also can be reused for other applications.\n\nTo create and execute a Java\
    \ program in JDK 10, perform the following steps:\n\nCreate a module with a unique\
    \ name, for example,\n\nCreate a root folder for the module – this needs to be\
    \ done for each module. The module root folder should have the same name as the\
    \ module. So, the root folder for the module in this case would be\n\nAdd the\
    \ module code inside the module root folder. Begin with packages from the module\
    \ root folder onwards. For example, create a package hierarchy mypkg\\util inside\
    \ the module folder moduleleone and add a class Hello.java in the com.mypkg.util\
    \ package. The folder structure, in this case, is shown in the following screenshot:\n\
    \n![](img/70651ebceef5c0cb89ccc7cad7a12eef_86_0.png)\n\n**Figure 1.20:** Modular\
    \ Structure of Java Application\n\nUntil JDK 8, the packages were directly stored\
    \ under the source folder whereas JDK 9 onwards, the packages are now stored under\
    \ a module root folder. From the module root folder, the structure is again the\
    \ same as earlier versions.\n\nThe steps for Java SE 8 and earlier versions are\
    \ as follows:\n\n- Create one or more source folders.\n- In a source folder, create\
    \ package folders to match the package names.\n- Place the source files in the\
    \ appropriate package folders.\n\nThe steps for Java SE 9 onwards are as follows:\n\
    \n- Create one or more source folders.\n- In each source folder, create a module\
    \ folder for each module.\n- In the module folders, create package folders to\
    \ match the package names.\n- Place the source files in the appropriate package\
    \ folders.\n- Create a module descriptor file that has metadata about the module,\
    \ that it, its exports, and dependencies. Save the file directly in the module\
    \ root folder with the name module-info.java. For example, the module descriptor\
    \ for the module moduleone is shown as follows:\n\n```\nmodule moduleone {\n//\
    \ module exports and dependencies\n}\n```\n\nThe file begins with the module keyword\
    \ which indicates that the succeeding text is the name of the module. The module\
    \ name should be the same as the name of the module root folder. Within the curly\
    \ braces, the module dependencies and exports are specified.\n\nThe final folder\
    \ structure with the module descriptor is shown as follows:\n\n![](img/70651ebceef5c0cb89ccc7cad7a12eef_88_0.png)\n\
    \n**Figure 1.21:** Module Descriptor of a Java Module\n\nNote that the module\
    \ descriptor file is a .java file but it does not follow the class naming conventions\
    \ of the Java language. That is, the use of the hyphen (-) character is not allowed\
    \ for a Java type name. Also, the name of the .java file should match the name\
    \ of the public type declared in the file, which is not observed with the module\
    \ descriptor name. This is similar to the file used in Java since Java 1.5, though\
    \ not so widely used. These files have been given invalid Java type deliberately\
    \ to indicate their special purpose and distinguish them from the other Java files\
    \ in the application.\n\nThe following code is the code for the Hello.java source\
    \ file and the module-info.java module descriptor file:\n\n```\n//Hello.java\n\
    package mypkg.util;\npublic class Hello {\n    public static void main(String[]\
    \ args) {\n        System.out.println(\"Hello World!\");\n    }\n}\n```\n\n```\n\
    // module-info.java\nmodule moduleone {\n}\n```\n\nThe following screenshot shows\
    \ the compilation and execution of the Hello.java file using JDK 10:\n\n![](img/70651ebceef5c0cb89ccc7cad7a12eef_89_0.png)\n\
    \n> Figure 1.22: Compiling and Executing Java Code with JDK 10\n\nThe module descriptor\
    \ modue-into.java is mandatory for every module. If the file is not available\
    \ during compilation, then the code will not compile and will throw error, error:\
    \ moduleone not found in module source path.\n\nThe module is compiled by using\
    \ the javac command with the option which indicates that the modules are present\
    \ in the src folder. The generated file for the Hello.java source file will be\
    \ saved in the out folder as mentioned in the option. The option points to the\
    \ location of the module descriptor and the source file to be compiled. Next,\
    \ the .class file is executed and the output Hello World! is displayed on the\
    \ console.\n\nHere are the ways ways of executing a module using the java command:\n\
    \nThe following screenshot shows the folder hierarchy of the src and out folders:\n\
    \n![](img/70651ebceef5c0cb89ccc7cad7a12eef_91_0.png)\n\n**Figure 1.23:** Source\
    \ and Output Folders of a Java Application\n\nWith the command line, all tasks\
    \ for project creation, compilation and execution are done manually which can\
    \ be time consuming and prone to errors. To avoid this, JDK 8 and JDK 10 projects\
    \ can also be created in IDEs like NetBeans, Eclipse, etc. that have support for\
    \ the appropriate version.\n\n## 1.14 Creating and executing a Java 8 project\
    \ in NetBeans\n\nTo create a Java 8 project, perform the following steps:\n\n\
    - Download and install NetBeans 8.1 or earlier that has support for JDK 8 from\
    \ the NetBeans official site\n\n![](img/70651ebceef5c0cb89ccc7cad7a12eef_92_0.png)\n\
    \nFigure 1.24: NetBeans IDE 8.1 Download Page\n\nDownload the full bundle and\
    \ install it as per the instructions from the wizard. Ensure to select the correct\
    \ path of JDK 1.8 during installation.\n\nOnce installed, start NetBeans 8.1 and\
    \ click on Project as shown in the following screenshot:\n\n![](img/70651ebceef5c0cb89ccc7cad7a12eef_93_0.png)\n\
    \nFigure 1.25: Creating a new project in NetBeans 8.1\n\nIt will open the New\
    \ Project window.\n\nFrom the Categories pane, select Java and from the Projects\
    \ pane, select Java Application as shown in the following screenshot:\n\n![](img/70651ebceef5c0cb89ccc7cad7a12eef_94_0.png)\n\
    \n**Figure 1.26:** New Project Dialog Box\n\nClick on\n\nOn the **Name and Location**\
    \ screen, specify the name of the project, the location where it must be saved,\
    \ and a name for the main class file as shown in the following screenshot:\n\n\
    ![](img/70651ebceef5c0cb89ccc7cad7a12eef_95_0.png)\n\nBy default, it takes the\
    \ name of the application as the name of the package and main class file. It can\
    \ be changed as per requirement.\n\nClick on This will create a new project with\
    \ the folder hierarchy and main class file.\n"
