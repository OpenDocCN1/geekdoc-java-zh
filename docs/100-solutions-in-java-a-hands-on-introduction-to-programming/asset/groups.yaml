    \ 印刷。\n\nwww.bpbonline.com\n\n献给\n\nSwara 和 Aaria\n\n她们是我生命中的光芒，我的侄女们。\n\n# 关于作者\n\
    \nDhruti Shah 是一位多才艺、精通技术的人士，在 IT 教育行业担任软件培训师、技术作家和经理已超过 15 年。在过去的 10 年里，她一直致力于\
    \ Java 技术的工作。她是微软认证培训专家，曾在全球范围内针对 10 多种技术培训了超过 2000 名学员。\n\n她因完美管理两个享负盛誉的国际项目——在巴拿马和哥斯达黎加建立并升级信息技术卓越中心（这是印度政府与巴拿马和哥斯达黎加政府的合作项目）而被誉为印度模范代表。\n\
    \n# 致谢\n\n写一本我从多年前第一次接触它起就痴迷的技术书籍，是一次非常有成就感的经历。然而，如果没有我所有家人和朋友的支持，这一切绝是不可能的。他们一直信任我，鼓励我追逐梦想，并给我面对困难的信心。\n\
    \n我想感谢我的母亲，她一直相信我，鼓励我追逐梦想，并给我面对困难的信心。\n\n我想感谢我的朋友 Ushakaran Shah，她在本书过程中给予了支持，确保了信息的准确性。最后，我想感谢\
    \ BPB Publications 的整个团队，他们在本书编写过程中提供的宝贵建议。\n\n# 前言\n\nJava 作为一种强大的编程语言，已经发展了数十年，被广泛应用于服务器、移动设备、Web\
    \ 应用程序等领域。本书旨在帮助初学者了解 Java 的新特性。Java 正在不断演进，已成为最受欢迎的编程语言之一。本书假设读者对编程有基本概念，并旨在帮助你开始\
    \ Java 开发。在本书的 12 章中，你将学习到以下内容：\n\n- 第 1 章介绍了 Java 的编程基础，包括变量、数据类型、运算符等。\n- 第\
    \ 2 章讨论了编程控制结构，如决策语句和循环语句。\n- 第 3 章介绍了类、对象、方法、访问修饰符和构造函数。\n- 第 4 章讨论了数组类型和 String\
    \ 类，并介绍了 StringBuilder 和 StringTokenizer 类的使用。\n- 第 5 章深入讨论了 Java 中的继承概念，以及使用抽象类、嵌套类的方法。\n\
    - 第 6 章描述了异常处理，包括内置异常类和自定义异常，并介绍了 java.lang 和 java.util 包中的重要类。\n- 第 7 章介绍了集合框架，以及\
    \ java.util 包中的不同工具类和接口。\n- 第 8 章描述了泛型在 Java 中的应用，创建泛型类、方法和集合。还提供了更好的日期和时间 API。\n\
    - 第 9 章描述了 java.io 包中的不同流类型，进一步介绍了 java.util.zip 和 java.nio 包。\n- 第 10 章解释了如何创建线程和多线程以提高应用程序性能，并描述了如何使用\
    \ JDBC API 连接数据库。\n- 第 11 章解释了设计模式作为软件开发过程中常见问题的解决方案。还介绍了应用程序的国际化和本地化。\n- 第 12\
    \ 章描述了 Java 8 到 10 的一些新特性，如 Java 模块系统 (JPMS)、JShell、JLink 工具、本地变量类型推断等。\n\n"
