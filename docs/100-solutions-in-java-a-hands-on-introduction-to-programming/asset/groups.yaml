  - '[PAGE 430]


    # 6.3.3 Best practices for handling exceptions


    Here is a list of the best practices of handling exceptions:


    A try statement must be followed by at least one catch or a finally block.


    Use the finally block to write clean up code.


    Avoid using java.lang.Exception or java.lang.Throwable class to catch exceptions
    that cannot be handled.


    Always provide an appropriate message along with the default message in a catch
    block when an exception occurs.


    Try to handle the exception as near to the source code as possible so that it
    is easy to trace the source.


    Avoid repeated re-throwing of the same exception as it may slow down the program.'
  - '[PAGE 431]


    # 6.4 Using the try-with-resources statement


    A resource is any object that needs to be closed once the program is done using
    it. For example, a JDBC connection, a File resource, or a Socket connection. Before
    Java 7, it was required to explicitly close the resources, usually in the finally
    block as there was no auto resource management. However, this approach used to
    cause memory leaks and poor performance if one forgot to close the resource.


    Java SE 7 introduced the try-with-resources statement to declare more than one
    resource at a time and also to ensure that all resources are closed after completion
    of code execution. A resource is any object that implements the java.lang.AutoCloseable
    or java.io.Closeable interface.


    The Closeable interface extends the AutoCloseable interface.


    A Closeable resource is a source or destination of data that can be closed and
    the AutoCloseable interface is used to close a resource when it is no longer needed.'
- md: "\n```java\nclose() method\n```\n\nThe close() method of the Closeable and AutoCloseable\
    \ interfaces has the following characteristics:\n\n- It releases the resources\
    \ that the object is holding, for example, open files.\n- The close() method of\
    \ the Closeable interface throws exceptions of type IOException.\n- The close()\
    \ method of the AutoCloseable interface throws exceptions of type Exception.\n\
    - The close() method can be overridden in the subclasses of the AutoCloseable\
    \ interface. This allows the overridden close() method to throw specialized exceptions,\
    \ such as IOException or no exception at all.\n\nThe following example shows the\
    \ use of the finally block to close resources:\n\n```java\nstatic void readFile(String[]\
    \ args) {\n    BufferedReader br = null;\n    try {\n        br = new BufferedReader(new\
    \ FileReader(\"F:\\\\myfile.txt\"));\n        System.out.println(br.readLine());\n\
    \    } catch (IOException e) {\n      e.printStackTrace();\n    } finally {\n\
    \      try {\n        if (br != null) {\n          br.close();\n        } catch\
    \ (IOException ex) {\n          ex.printStackTrace();\n        }\n      }\n  \
    \  }\n}\n```\n\nHere, the BufferedReader object is closed within the finally block.\n\
    The following example shows the use of the try-with-resources statement to automatically\
    \ close resources:\n\n```java\npublic static void main(String[] args) {\n  try\
    \ (BufferedReader br = new BufferedReader(new FileReader(\"F:\\\\myfile.txt\"\
    ))) {\n    System.out.println(br.readLine());\n  } catch (IOException e) {\n \
    \   e.printStackTrace();\n  }\n}\n```\n\nThe following are the benefits of the\
    \ try-with-resources statement:\n\n- It reduces the number of lines of code.\n\
    - Code becomes more readable code and easy to maintain.\n- It performs automatic\
    \ resource management.\n- The use of finally block for explicitly closing resources\
    \ is avoided.\n- It allows you to open multiple resources in the try-with-resources\
    \ statement separated by a semicolon.\n\nThe following example shows the use of\
    \ the try-with-resources statement to open multiple resources at a time:\n\n```java\n\
    try (BufferedReader br = new BufferedReader(new FileReader(\"F:\\\\myfile.txt\"\
    )),\n     java.io.BufferedWriter writer = java.nio.file.Files.newBufferedWriter(FileSystems.getDefault().getPath(\"\
    F:\\\\myfile.txt\"), Charset.defaultCharset())) {\n    System.out.println(br.readLine());\n\
    \ // code to write to file\n} catch (IOException e) {\n e.printStackTrace();\n\
    }\n```\n\nHere, the two resources, BufferedReader and BufferedWriter are opened\
    \ together within the try-with-resources statement. Note that when multiple resources\
    \ are opened in-they they are closed in the reverse order to avoid any dependency\
    \ issue.\n\n# Try with resources exceptions\n\nThe method of handling exceptions\
    \ is different in the try-catch-finally and try with resources statements. For\
    \ the try-catch-finally block, when an exception is thrown from the try block\
    \ as well as the finally block, the method returns the exception thrown by the\
    \ finally block. If both try block and try-with-resources throw an exception,\
    \ the method returns the exception thrown by the try block.\n\n# 6.5 Custom exceptions\n\
    \nJava provides a wide range of built-in exceptions. However, at times, none of\
    \ the built-in exceptions may fulfill the requirement of a certain code. In such\
    \ cases, one can create a custom exception class. Custom exceptions are also useful\
    \ when the code is liable to throw more than one related exception or to differentiate\
    \ from the exceptions thrown from classes created by other vendors.\n\nTo create\
    \ a custom exception, the class must inherit from the built-in Exception class.\n\
    \nSyntax:\n\n```java\npublic class My extends Exception {\n    // custom coded\n\
    }\n```\n\nThe following code shows the creation of a custom exception class:\n\
    \n```java\npublic class FileException extends Exception {\n    public FileException()\
    \ {\n    }\n\n    // Overriding the getMessage() method\n    @Override\n    public\
    \ String getMessage() {\n        return \"Could not open file\";\n    }\n}\n```\n\
    \nThe FileException class is a custom exception class that extends the built-in\
    \ Exception class and overrides its getMessage() method. To raise a custom exception,\
    \ a method needs to throw the exception at runtime and needs to be handled by\
    \ the caller of the method:\n\n```java\npublic class FileManager {\n\n    String\
    \ filepath;\n    String mode;\n\n    public FileManager() {\n    }\n\n    public\
    \ FileManager(String filepath, String mode) {\n        this.filepath = filepath;\n\
    \        this.mode = mode;\n    }\n    // creating a method that throws the custom\
    \ exception\n    public void openFile() throws FileException {\n        if (filepath.equals(\"\
    \") || mode.equals(\"\")) {\n            throw new FileException();\n        }\
    \ else {\n            System.out.println(\"Opening File...\");\n        }\n  \
    \  }\n}\n```\n\nHere, the openFile method of the FileManager class throws the\
    \ custom FileException if the filepath or mode values are empty:\n\n```java\n\
    public class TestFileException {\n    public static void main(String[] args) {\n\
    \        FileManager obj = new FileManager(\"\", \"\");\n        try {\n     \
    \       obj.openFile();\n        } catch (FileException e) {\n            System.out.println(\"\
    Exception occurred: \" + e.getMessage());\n        }\n    }\n}\n```\n\nThe main()\
    \ method creates an object of the FileManager class with empty strings as arguments\
    \ to the constructor and invokes the openFile()() method within a try block. The\
    \ catch block catches the custom exception FileException and invokes the overridden\
    \ getMessage() method. The output of the code is as follows:\n\nException occurred:\
    \ Could not open file\n\n# 6.6 Wrapper exceptions\n\nJava allows chaining of exceptions\
    \ by wrapping one exception inside another. Exception chaining was introduced\
    \ since JDK 1.4 and in order to support it, Java introduced getCause() and initCause(Throwable).\
    \ This prevents the code using the method from losing the original exception.\n\
    \nThe following example shows the use of Wrapper exception:\n\n```java\npublic\
    \ class StandardException extends Exception {\n\n    public StandardException()\
    \ {\n    }\n\n    public StandardException(Throwable cause) {\n        super(cause);\n\
    \    }\n\n    public StandardException(String message, Throwable cause) {\n  \
    \      super(message, cause);\n    }\n}\n```\n\nHere, the StandardException class\
    \ is a custom exception class with three overloaded constructors. The last constructor\
    \ accepts a custom message and the Throwable object for the cause:\n\n```java\n\
    import java.util.Scanner;\npublic class StandardCalculator {\n\n    public static\
    \ void main(String[] args) {\n        Scanner s = new Scanner(System.in);\n  \
    \      System.out.println(\"Enter first number\");\n        int num1 = s.nextInt();\n\
    \        System.out.println(\"Enter second number\");\n        int num2 = s.nextInt();\n\
    \n        try {\n            StandardCalculator obj = new StandardCalculator();\n\
    \            obj.calculate(num1, num2);\n        } catch (StandardException e)\
    \ {\n            Throwable t = e.getCause();\n            // print the message\
    \ and the cause\n            System.out.println(\"Error: \" + e.getMessage());\n\
    \            System.out.println(\"Cause: \" + t);\n        } finally {\n     \
    \       System.out.println(\"--------------------------------\");\n        }\n\
    \    }\n\n    public void calculate(int a, int b) throws StandardException {\n\
    \        try {\n            int c = a / b;\n            System.out.println(\"\
    Division of \" + a + \" and \" + b + \" is \" + c);\n\n            int arr[] =\
    \ new int[c];\n            for (int i = 0; i <= arr.length; i++) {\n         \
    \       arr[i] = i + 1;\n            }\n        } catch (ArithmeticException e)\
    \ {\n            throw new StandardException(\"Divide by zero\", e);\n       \
    \ } catch (ArrayIndexOutOfBoundsException e) {\n            throw new StandardException(\"\
    Array Index out of bounds\", e);\n        }\n    }\n}\n```\n"
  mdcn: "\n\n```java\nclose() method\n```\n\nCloseable 和 AutoCloseable 接口的 `close()`\
    \ 方法具有以下特点：\n\n- 它释放对象所持有的资源，例如打开的文件。\n- Closeable 接口的 `close()` 方法抛出 `IOException`\
    \ 类型的异常。\n- AutoCloseable 接口的 `close()` 方法抛出 `Exception` 类型的异常。\n- 在 AutoCloseable\
    \ 接口的子类中重写 `close()` 方法。这允许重写的 `close()` 方法抛出特殊的异常，例如 `IOException` 或不抛出任何异常。\n\
    \n以下示例展示了如何使用 `finally` 块关闭资源：\n\n```java\nstatic void readFile(String[] args)\
    \ {\n    BufferedReader br = null;\n    try {\n        br = new BufferedReader(new\
    \ FileReader(\"F:\\\\myfile.txt\"));\n        System.out.println(br.readLine());\n\
    \    } catch (IOException e) {\n      e.printStackTrace();\n    } finally {\n\
    \      try {\n        if (br != null) {\n          br.close();\n        } catch\
    \ (IOException ex) {\n          ex.printStackTrace();\n        }\n      }\n  \
    \  }\n}\n```\n\n在这里，`BufferedReader` 对象在 `finally` 块中被关闭。\n以下示例展示了如何使用 `try-with-resources`\
    \ 语句自动关闭资源：\n\n```java\npublic static void main(String[] args) {\n  try (BufferedReader\
    \ br = new BufferedReader(new FileReader(\"F:\\\\myfile.txt\"))) {\n    System.out.println(br.readLine());\n\
    \  } catch (IOException e) {\n    e.printStackTrace();\n  }\n}\n```\n\n以下是 `try-with-resources`\
    \ 语句的好处：\n\n- 它减少了代码行数。\n- 代码更具可读性且于维护。\n- 它实现了自动资源管理。\n- 避免了使用 `finally` 块显式关闭资源。\n\
    - 它允许在 `try-with-resources` 语句中使用分号打开多个资源。\n\n以下示例展示了如何使用 `try-with-resources`\
    \ 语句同时打开多个资源：\n\n```java\ntry (BufferedReader br = new BufferedReader(new FileReader(\"\
    F:\\\\myfile.txt\")),\n     java.io.BufferedWriter writer = java.nio.file.Files.newBufferedWriter(FileSystems.getDefault().getPath(\"\
    F:\\\\myfile.txt\"), Charset.defaultCharset())) {\n    System.out.println(br.readLine());\n\
    \ // code to write to file\n} catch (IOException e) {\n e.printStackTrace();\n\
    }\n```\n\n在这里，两个资源 `BufferedReader` 和 `BufferedWriter` 在 `try-with-resources`\
    \ 语句中一起打开。请注意，当同时打开多个资源时，它们会按照反顺序关闭，以避免任何依赖问题。\n\n# Try with resources 异常\n\n\
    `try-catch-finally` 和 `try with resources` 语句处理异常的方法不同。对于 `try-catch-finally`\
    \ 块，当 `try` 块和 `finally` 块都抛出异常时，方法将返回 `finally` 块抛出的异常。如果 try 块和 try with resources\
    \ 同时都抛出异常，方法将返回 try 块抛出的异常。\n\n# 6.5 自定义异常\n\nJava 提供了大量的内置异常。然而，有时没有任何内置异常可以满足某些代码的需求。在这种情况下，可以创建一个自定义异常类。当代码可能抛出多个相关的异常，或者需要与其他供应商创建的类所抛出的异常进行区分时，自定义异常也很有用。\n\
    \n要创建自定义异常，类必须继承自内置的 `Exception` 类。\n\n语法：\n\n```java\npublic class My extends\
    \ Exception {\n    // 自定义代码\n}\n```\n\n以下代码展示了如何创建一个自定义异常类：\n\n```java\npublic\
    \ class FileException extends Exception {\n    public FileException() {\n    }\n\
    \n    // 重写 getMessage() 方法\n    @Override\n    public String getMessage() {\n\
    \        return \"Could not open file\";\n    }\n}\n```\n\n`FileException` 类是一个自定义异常类，它继承自内置的\
    \ `Exception` 类并重写它的 `getMessage()` 方法。要抛出自定义异常，方法需要在运行时抛出该异常，并由方法的调用者进行处理：\n\n\
    ```java\npublic class FileManager {\n\n    String filepath;\n    String mode;\n\
    \n    public FileManager() {\n    }\n\n    public FileManager(String filepath,\
    \ String mode) {\n        this.filepath = filepath;\n        this.mode = mode;\n\
    \    }\n    // 创建一个抛出自定义异常的方法\n    public void openFile() throws FileException\
    \ {\n        if (filepath.equals(\"\") || mode.equals(\"\")) {\n            throw\
    \ new FileException();\n        } else {\n            System.out.println(\"Opening\
    \ File...\");\n        }\n    }\n}\n```\n\n在这里，如果 `filepath` 或 `mode` 值为空，`FileManager`\
    \ 类的 `openFile` 方法将抛出自定义的 `FileException`：\n\n```java\npublic class TestFileException\
    \ {\n    public static void main(String[] args) {\n        FileManager obj = new\
    \ FileManager(\"\", \"\");\n        try {\n            obj.openFile();\n     \
    \   } catch (FileException e) {\n            System.out.println(\"Exception occurred:\
    \ \" + e.getMessage());\n        }\n    }\n}\n```\n\n`main()` 方法使用空字符串作为构造函数的参数创建\
    \ `FileManager` 类的对象，并在 `try` 块中调用 `openFile()` 方法。`catch` 块捕获自定义异常 `FileException`\
    \ 并调用重写的 `getMessage()` 方法。代码的输出如下：\n\nException occurred: Could not open file\n\
    \n# 6.6 包装异常\n\nJava 通过将一个异常包装在另一个异常内部来实现异常链。异常链自 JDK 1.4 开始引入，为了支持这一功能，Java 引入了\
    \ `getCause()` 和 `initCause(Throwable)`。这防止使用方法的代码丢失原始异常。\n\n以下示例展示了包装异常的使用：\n\
    \n```java\npublic class StandardException extends Exception {\n\n    public StandardException()\
    \ {\n    }\n\n    public StandardException(Throwable cause) {\n        super(cause);\n\
    \    }\n\n    public StandardException(String message, Throwable cause) {\n  \
    \      super(message, cause);\n    }\n}\n```\n\n在这里，`StandardException` 类是一个具有三个重载构造函数的自定义异常类。最后一个构造函数接受自定义消息和作为原因的\
    \ `Throwable` 对象：\n\n```java\nimport java.util.Scanner;\npublic class StandardCalculator\
