    # 5.4.2 Default, static, and private methods of interfaces


    The interface design has always been a challenge because any modification/addition
    done to an interface requires changes to be done all implementing classes. As
    the application grows, the number of classes implementing an interface also increases
    which makes it difficult to modify/extend the functionality of the interface without
    affecting so many classes. A workaround used earlier was the creation of a base
    implementation class which can be extended and its methods could be overridden
    in other classes as required.


    In Java SE 7 and earlier versions, an interface can have only two types of members:


    Static constant variables


    Abstract methods


    The method could not have implementations in interfaces. To use both abstract
    methods and non-abstract/concrete methods (methods with implementation), the abstract
    class was the only option. With Java 8, Oracle Corporation introduced the default
    methods and static methods feature which allowed methods to have implementations
    in an interface.


    In Java 8, an interface can have:'
- md: "\n# Static constant variables\n\n# Abstract methods\n\n# Default methods\n\n\
    # Static methods\n\nThe default methods or defender methods allow new methods\
    \ to be added to the interface without affecting the existing implementation of\
    \ interfaces. These default methods have a method definition that will be used\
    \ as default in case an implementing concrete class fails to provide an implementation\
    \ for that method. The default methods come with a default implementation that\
    \ can be used, overridden, or ignored without causing any problems to existing\
    \ classes that have implemented an interface.\n\nJava interface static methods\
    \ are useful for creating utility methods for common activities such as null check,\
    \ collection sorting, etc. They also help in securing the code by preventing implementation\
    \ classes from overriding them. The default keyword is used to create a default\
    \ method in an interface.\n\nThe following example shows the use of default and\
    \ static methods in an interface:\n\n```java\npublic interface ILog {\n\n    String\
    \ MYSQL_DB_NAME = \"MySQLDb\";\n\n    // abstract method\n    void logMsg(String\
    \ message);\n\n    // default methods\n    default void logWarning(String message)\
    \ {\n        System.out.println(\"Logging Warning: \" + message);\n        //\
    \ Connect to Database\n        // Log Warning\n        // Close Database connection\n\
    \    }\n\n    default void logFatal(String message) {\n        System.out.println(\"\
    Logging Fatal Error: \" + message);\n        // Connect to Database\n        //\
    \ Log Fatal Error\n        // Close Database connection\n    }\n\n    // static\
    \ method\n    static boolean checkNull(String str) {\n        System.out.println(\"\
    Interface Check for Null\");\n        return str == null;\n    }\n}\n```\n\nThe\
    \ ILog interface declares an abstract method, two default methods, and one static\
    \ method:\n\n```java\npublic class DBTransaction implements ILog {\n\n@Override\n\
    public void logMsg(String message) {\n    System.out.println(message);\n}\n\n\
    public static void main(String[] args) {\n    System.out.println(\"Connecting\
    \ to: \" + ILog.MYSQL_DB_NAME);\n    DBTransaction obj = new DBTransaction();\n\
    \    obj.logMsg(\"Database Connected Successfully\");\n    obj.logFatalError(\"\
    Fatal Error while closing DB\");\n    System.out.println(\"Null check: \" + ILog.checkNull(\"\
    Hello\"));\n}\n```\n\nThe DBTransaction class implements the ILog interface and\
    \ overrides the logMsg method. Note that it does not implement the default methods\
    \ and the static method anyways cannot be overridden. Thus, the interface now\
    \ has the flexibility for classes to not implement all methods of the interface.\n\
    \nThe main() method creates an object of the class and invokes the logMsg method\
    \ which is the overridden version as well as the default method It also accesses\
    \ the constant variable and static method by directly using the ILog interface\
    \ name. The output of the code is shown in the following screenshot:\n\n![](img/70651ebceef5c0cb89ccc7cad7a12eef_375_0.png)\n\
    \nFigure 5.11: Default and static methods in interfaces\n\nIn the code, note the\
    \ redundancy in all the log methods created for establishing the connection and\
    \ closing database connection. This issue can be solved if a common method is\
    \ used for database connection, but that would be a public method that is accessible\
    \ to all other classes. To create a reusable method and make it private, the only\
    \ option is an abstract class with a private method for the common code.\n\nJava\
    \ 9 addresses this issue by introducing private methods in interfaces. Java 9\
    \ onwards, interfaces can have private methods by using a private access modifier.\
    \ In Java 9 and later versions, an interface can have the following types of members:\n\
    \n- Static constant variables\n- Abstract methods\n- Default methods\n- Static\
    \ methods\n- Private methods\n- Private static methods\n\nSo now, the code of\
    \ the ILog interface can be optimized for reusability as follows:\n\n```java\n\
    public interface ILog {\n    String MYSQL_DB_NAME = \"MySQLDb\";\n    // abstract\
    \ method\n    default void logMsg(String message) {\n        System.out.println(\"\
    Logging Information: \" + message);\n        logData(message, \"Information\"\
    );\n    }\n\n    // default methods\n    default void logWarning(String message)\
    \ {\n        System.out.println(\"Logging Warning: \" + message);\n        logData(message,\
    \ \"Warning\");\n    }\n\n    default void logFatalError(String message) {\n \
    \       System.out.println(\"Logging Fatal Error: \" + message);\n        logData(message,\
    \ \"Fatal Error\");\n    }\n\n    private void logData(String message, String\
    \ type) {\n        // Connect to Database\n        // Log Message\n        //\
    \ Close Database connection\n    }\n\n    // static method example\n    static\
    \ boolean checkNull(String str) {\n        System.out.println(\"Interface Check\
    \ for Null\");\n        return str == null;\n    }\n}\n```\n\nThe use of the private\
    \ method logData() allows reusability in other log methods and also prevents direct\
    \ access to implementing classes. The usage of private methods helps to make default\
    \ methods less bulky and more maintainable.\n\n## 5.4.3 Issues with default methods\n\
    \nA class can implement multiple interfaces that may have different default methods\
    \ each. However, if each of the interfaces contains the same default method with\
    \ the same name and signature, the code will fail to compile and raise the following\
    \ error:\n\n```java\njava: class ClassWithTwoInterfaces inherits unrelated defaults\
    \ for defaultMethod() from types Interface1 and Interface2\n```\n\nThis is because\
    \ the compiler fails to determine which default method should be used. To fix\
    \ this issue, the class can provide an implementation of the default method which\
    \ will remove the ambiguity. Further, a class can override the default method\
    \ of interfaces by using super keyword. This is applicable even if one interface\
    \ is implemented.\n\nFor example:\n\n```java\npublic class ClassWithTwoInterfaces\
    \ implements Interface1, Interface2 {\n  @Override\n  public void abstractMethod()\
    \ {\n    // some implementation\n  }\n  @Override\n  public void defaultMethod()\
    \ {\n    // invoke defaultMethod() of interfaces\n    Interface1.super.defaultMethod();\n\
    \    Interface2.super.defaultMethod();\n  }\n}\n```\n\nNow, an interface can extend\
    \ another interface. If both contain a default method with the same name, the\
    \ compiler will consider the implementation from the child interface that is lowest\
    \ down in inheritance tree.\n\nFor example:\n\n```java\npublic interface Interface1\
    \ {\n  default void defaultMethod() {\n    System.out.println(\"Hello from parent\
    \ Interface1\");\n  }\n}\n\npublic interface IChildInterface extends Interface1\
    \ {\n  default void defaultMethod() {\n    System.out.println(\"Hello from IChildInterface\"\
    );\n  }\n}\n```\n\nHere, both parent and child interfaces have a default method.\
    \ When a class will implement the child interface, a call to defaultMethod() will\
    \ give the following output:\n\n# Hello from IChildInterface\n\nThat is, the compiler\
    \ has invoked defaultMethod of the child interface.\n\n## 5.5 Java functional\
    \ interfaces\n\nAn interface with exactly one abstract method is called a functional\
    \ interface. The @FunctionalInterface annotation has been added to Java to mark\
    \ an interface as a functional interface. It is not required to use the annotation,\
    \ but advisable as a best practice to avoid the addition of extra methods accidentally.\
    \ If more than one abstract method is added to an interface annotated with the\
    \ @FunctionalInterface annotation, it throws a compiler error.\n\nThe most important\
    \ benefit of functional interfaces is that lambda expressions can be used to instantiate\
    \ them to avoid bulky anonymous class implementation.\n\nJava 8 Collections API\
    \ has been rewritten and the new Stream API has been added which uses a lot of\
    \ functional interfaces. A new package called java.util.function, including several\
    \ functional interfaces has been added to provide target types for lambda expressions\
    \ and method references. Some of the useful Java 8 functional interfaces are Consumer,\
    \ Supplier, Function, and Predicate. java.lang.Runnable is a great example of\
    \ a functional interface with a single abstract method functional interface is\
    \ also referred to as Single Abstract Method (SAM) Interfaces. It helps to achieve\
    \ a functional programming approach. The rules for the functional interface are\
    \ as follows:\n"
  mdcn: "\n\n# 静态常量变量\n\n# 抽象方法\n\n# 默认方法\n\n# 静态方法\n\n默认方法（defender methods）允许向接口中添加新方法，而不影响接口的现有实现。这些默认方法具有方法定义，当实现的具体类未能为该方法提供实现时，将使用作为默认实现。默认方法带有一个默认实现，可以被使用、重写或忽略，而不会对已实现接口的现有类造成任何问题。\n\
    \nJava 接口静态方法对于创建用于空值检查、集合排序等常见操作的工具方法非常有用。它们还通过防止实现类重写这些方法来帮助保护代码安全。`default`\
    \ 关键字用于在接口中创建默认方法。\n\n以下示例展示了接口中默认方法和静态方法的使用：\n\n```java\npublic interface ILog\
    \ {\n\n    String MYSQL_DB_NAME = \"MySQLDb\";\n\n    // 抽象方法\n    void logMsg(String\
    \ message);\n\n    // 默认方法\n    default void logWarning(String message) {\n  \
    \      System.out.println(\"Logging Warning: \" + message);\n        // 连接到数据库\n\
    \        // 记录警告\n        // 关闭数据库连接\n    }\n\n    default void logFatal(String\
    \ message) {\n        System.out.println(\"Logging Fatal Error: \" + message);\n\
    \        // 连接到数据库\n        // 记录致命错误\n        // 关闭数据库连接\n    }\n\n    // 静态方法\n\
    \    static boolean checkNull(String str) {\n        System.out.println(\"Interface\
    \ Check for Null\");\n        return str == null;\n    }\n}\n```\n\nILog 接口声明了一个抽象方法、两个默认方法和一个静态方法：\n\
    \n```java\npublic class DBTransaction implements ILog {\n\n@Override\npublic void\
    \ logMsg(String message) {\n    System.out.println(message);\n}\n\npublic static\
    \ void main(String[] args) {\n    System.out.println(\"Connecting to: \" + ILog.MYSQL_DB_NAME);\n\
    \    DBTransaction obj = new DBTransaction();\n    obj.logMsg(\"Database Connected\
    \ Successfully\");\n    obj.logFatalError(\"Fatal Error while closing DB\");\n\
    \    System.out.println(\"Null check: \" + ILog.checkNull(\"Hello\"));\n}\n```\n\
    \nDBTransaction 类实现了 ILog 接口并重写了 `logMsg` 方法。注意，它没有实现默认方法，而且静态方法无论如何都无法重写。因此，接口现在具有灵活性，允许类不实现接口的所有方法。\n\
    \n`main()` 方法创建了该类的对象并调用了 `logMsg` 方法（重写后的版本）以及默认方法。它还通过直接使用 ILog 接口名称访问常量变量和静态方法。代码的输出如所示：\n\
