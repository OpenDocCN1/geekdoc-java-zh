    \ |\n| 4 |\n| Enter second number: |\n| 5 |\n| Dear, John |\n| Sum of 4 and 5\
    \ is 9 |\n\nFigure 3.2: Instance variables and methods\n\n## 3.4 Constructors\n\
    \nA constructor is a method that has the same name as the class name. It may have\
    \ parameters but cannot have any return type. It can be used to initialize variables\
    \ with default values and also to instantiate objects. It is executed automatically\
    \ as soon as an object of the class is instantiated.\n\nA constructor can be default\
    \ or parameterized. Syntax:\n\n```\n// Default\n() {\n// Initialization statements\n\
    }\n\n// Parameterized\n()\n// Initialization statements\n}\n```\n\nIf no constructor\
    \ is defined in a class, the JVM invokes an implicit constructor called the no-argument\
    \ or default constructor. The default constructor initializes the instance variables\
    \ of the created object to their default values. For example:\n\n```java\nCalculator\
    \ objCalc = new Calculator();\n```\n\nThe following example shows the use of explicit\
    \ no-argument constructor and parameterized constructor:\n\n```java\npublic class\
    \ Calculator {\n\nprivate String name;\n\npublic Calculator() {\n    name = \"\
