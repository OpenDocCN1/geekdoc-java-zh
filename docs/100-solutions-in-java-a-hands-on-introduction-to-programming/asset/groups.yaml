    ### 1.1 Introduction to object-oriented programming

    With the advancement in technology and the increasing complexity of software,
    a requirement of new and flexible modes of programming was observed. A need to
    make reliable software, reduce the overall development and maintenance cost, and
    deliver the software within timelines resulted in the development of the object-oriented
    programming model.


    The primary focus of object-oriented programming is on objects. Any real-world
    entity that has certain characteristics and behavior that can be used to describe
    it is considered as an object. There are several objects that have common characteristics.
    These can be grouped into categories or classes. Thereby every object of a class
    will be considered as an instance of that class. Programmatically, a class is
    a structure that contains the data (characteristics) and methods (behavior) to
    work on that data.


    For example, a class Vehicle can have such characteristics as color and type,
    and behavior such as start, stop, accelerate, etc. The following image shows a
    Unified Modeling Language (UML) class diagram representation of the Vehicle class:


    ![](img/70651ebceef5c0cb89ccc7cada12eef_34_0.png)

    Figure 1.1: Class Diagram


    Here, the **Fields** represent the characteristics and **Methods** represent the
    behavior of the object. The Vehicle class can then have instances of types of
    vehicles such as bike, bicycle, car, etc. This is explained in detail in the following
    image:


    ![](img/70651ebceef5c0cb89ccc7cada12eef_34_1.png)

    Figure 1.2: Object of Vehicle Class


    Here, the object bike has the characteristics color=blue and type=motorcycle with
    the behavior, including start, stop, and accelerate. Similarly, there can be other
    instances of the class such as car, bicycle, etc. with the same or different values
    for characteristics and similar behavior.


    An object-oriented programming language is based on the following principles:


    To encapsulate means to enclose. Hence, encapsulation allows you to enclose the
    data members and methods into a closed structure called a class. Encapsulation
    ensures data security through data hiding so that a user cannot access the members
    of a class directly.


    Abstraction is a programming concept in which the non-essential details of an
    entity are hidden from user view. For example, in the case of a washing machine,
    the user only presses the button on a digital panel to set up the process and
    start the machine. However, the internal functioning of the washing machine is
    not known to the user. This means that the non-essential aspect of how the washing
    machine washes the clothes is abstracted from the user. Similarly, abstraction
    can also be implemented in code to hide the unnecessary details from the user.


    To inherit means to acquire some feature or asset from an ancestor. For example,
    a child acquires certain aspects of physical appearance and certain behavior of
    his/her biological parents. In programming also, inheritance plays a similar role.
    It allows us to combine the common characteristics and behavior of objects into
    a parent class also called a superclass. This class can then be inherited by other
    classes that allow a developer to extend and

