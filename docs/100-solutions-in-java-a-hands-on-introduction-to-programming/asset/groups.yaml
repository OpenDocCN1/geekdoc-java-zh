    # About the Author


    Dhruti Shah is a multi-skilled, tech-savvy person with over 15 years of experience
    as a software trainer, technical writer, and manager in the IT education industry.
    She has been working extensively with Java technology for the last 10 years. She
    is a Microsoft Certified Training Specialist who has trained over 2000 candidates
    worldwide on more than 10 technologies.


    She has been appreciated as a model representative for India for flawlessly managing
    two prestigious International projects to set up and upgrade the Centre of Excellence
    in Information Technology in Panama and Costa Rica, Central America (a collaboration
    project of the Indian government with the governments of Panama and Costa Rica).


    # Acknowledgement


    Writing a book on a technology that I have been obsessed with since I first learned
    about it years ago was a gratifying experience. However, it could never have been
    possible without the support of all my family members and friends. They always
    believed in me, encouraged me to follow my dreams, and gave me the confidence
    to face my struggles.


    I would like to thank my mother, Mrs. Ushakaran Shah, who is my friend, philosopher,
    and guide. Her belief in me and my aspirations has given me the courage to face
    challenges head-on and emerge a victor. Further, I would like to thank all my
    colleagues who have given me valuable advice time and again during the journey
    of writing this book.


    Finally, I would like to extend my gratitude to the entire team of BPB publications
    for their support and appreciation of my work.


    # Preface


    Java is a programming language that has been around for decades and has proved
    its potential as a versatile programming language. Over the years, Java has advanced
    tremendously and has become one of the most preferred programming languages for
    the development of applications ranging from standalone to web applications as
    well as mobile apps. It is longer a simple client-side language but is more dynamic
    and supports the development for application servers, embedded devices, and much
    more.


    This book is a result of several years of application development in Java and
    the experience gained by using different features introduced with each new version
    of Java. The goal of this book is to give a beginner enough knowledge to start
    application development in Java. Java is an evolving technology, and this book
    attempts to introduce the readers to the basic features of Java and the new features
    of Java 8, 9, and 10. It aims to gradually introduce the reader to a new programming
    approach called modular programming.


    The book presumes the reader has a basic idea about programming and aspires to
    begin development using Java. It has been written after extensive research and
    provides ample examples and demonstrations to help you take the first step to
    learn the new technology. This book will prove to be a great reference for beginners
    as well as professionals to begin development in Java. Over the 12 chapters in
    this book, you will learn the following:


    - Chapter 1 introduces the concept of object-oriented programming and explains
    how Java has evolved as an object-oriented programming (OOP) language. It explains
    the versions and features of Java and steps to create an application by using
    JDK and JDK 10.


    - Chapter 2 discusses the different programming constructs of the Java language
    such as comments, variables, data types, and operators. It also shows you the
    use of decision-making constructs, looping constructs, and branch statements.


    - Chapter 3 introduces Java classes, objects, variables, methods, access specifiers,
    and constructors. It explains the implementation of polymorphism, the creation
    of packages, and the use of keywords such as static, final, and this keyword.


    - Chapter 4 discusses the different types of Arrays and String class. It also
    shows you the use of StringBuilder and StringTokenizer classes, command-line arguments,
    and wrapper classes.


    - Chapter 5 discusses the concept of inheritance in Java in depth and different
    ways of implementing inheritance by using abstract classes, nested classes, and
    so on. It also explains the user interfaces and lambda expressions.


    - Chapter 6 describes exception handling with built-in exception classes and custom
    exceptions. It further introduces the important classes of the java.lang and java.util.regex
    packages.


    - Chapter 7 introduces the more advanced features such as the Collections framework
    with the different utility classes and interfaces of the java.util package.


    - Chapter 8 describes the use of generics in Java to create generic classes, methods,
    and collections. It also introduces the Time API that provides better support
    for date and time.


    - Chapter 9 describes different types of streams of the java.io package for file
    management. Further, it introduces the different classes of the java.util.zip
    and java.nio packages.


    - Chapter 10 explains how to create thread and multithreading to improve the performance
    of applications. It also describes how to connect to databases by using the JDBC
    API.


    - Chapter 11 explains the use of design patterns as solutions to common problems
    encountered during software development. It also describes internationalization
    and localization of an application.


    - Chapter 12 describes some prominent new features of Java 8 to 10 such as the
    Java Platform Module System (JPMS), JShell, JLink tool, local variable type Inference,
    and so on.


