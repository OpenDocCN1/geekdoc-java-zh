    # ## 1.4 Java SE platform components


    The two important Java SE platform components are Java Runtime Environment (JRE)
    and Java Development Kit (JDK). The JRE contains all the Java libraries required
    to execute a Java program whereas the JDK contains the libraries required to develop
    Java programs and is distributed for different platforms like Windows, MacOS,
    Linux, etc. The JDK comprises the tools required for application development,
    compilation, debugging, etc. It also has its own JRE to execute and test Java
    applications. The following image shows the different Java SE platform components:


    ![](img/70651ebceef5c0cb89ccc7cad7a12eef_45_0.png)


    **Figure 1.4: The tools and libraries**


    The brief descriptions of the tools and libraries are given below:'
  - '[PAGE 46]


    Development Tools and APIs: The tools and utilities form the base for Java development.
    The development tools include the javac compiler, Java launcher, a Javadoc documentation
    tool, etc. The Java APIs are ready-to-use classes and interfaces for different
    functionalities such as networking, XML parsing, GUI creation, database manipulation,
    and many more.


    Deployment Tools: The JDK provides software for deploying applications on target
    machines. Java Web Start and Java Plug-In are examples of deployment tools.


    User Interface Toolkits: The JDK comes bundled with UI toolkits such as Swing,
    Java2D, and Abstract Window Toolkit (AWT) for the development of graphical user
    interfaces in Java applications.


    Integration Libraries: Integration libraries such as Java Database Connectivity
    (JDBC), Java Naming and Directory Interface (JNDI), etc. provide access to databases
    and remote objects for data manipulation and network access.


    Other Base Libraries: These libraries include APIs for file manipulation, networking,
    XML parsing, security, internationalization, and so on.


    Language and Utility Libraries: These libraries include Math, Collections, Logging,
    Regular Expressions, etc. that allow you to perform manipulation of data in a
    Java program.'
