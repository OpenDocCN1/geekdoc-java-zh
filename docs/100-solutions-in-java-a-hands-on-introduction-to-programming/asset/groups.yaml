    \n### 4.1.1 一维数组\n\n一维数组在垂直方向表示时，具有单列和多行数据。通过数组的名称和其索引来访问每个元素。例如，考虑下图中所示的学生数组：\n\
    \n| score[5] | |\n|---|---|\n| score[0] | 40 |\n| score[1] | 56 |\n| score[2]\
