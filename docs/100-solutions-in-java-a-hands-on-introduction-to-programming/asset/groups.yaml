    \ |\n\n图 4.9：StringBuilder 类方法\n\n## 4.5 Java 中的 StringTokenizer 类\n\njava.util.StringTokenizer\
    \ 类提供了将字符串拆分为标记的方法。\n\nStringTokenizer 构造函数如下：\n\n- StringTokenizer(String str)：使用指定的字符串创建\
    \ StringTokenizer。\n- StringTokenizer(String str, String delim)：使用指定的字符串和分隔符创建\
    \ StringTokenizer。\n- StringTokenizer(String str, String delim, boolean returnValue)：使用指定的字符串、分隔符和返回值创建\
    \ StringTokenizer。如果 `returnValue` 为 `true`，则分隔符也被视为标记。如果为 `false`，则使用分隔符来分隔标记。\n\
    \nStringTokenizer 类的方法如下：\n\n- hasMoreTokens()：检查是否有更多标记可用。\n- hasMoreElements()：作用原理与\
    \ `hasMoreTokens()` 方法类似。\n\n"
