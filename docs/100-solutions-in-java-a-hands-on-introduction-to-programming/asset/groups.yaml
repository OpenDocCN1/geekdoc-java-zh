    Logical operators work on two boolean expressions. The logical operators supported
    in Java are as follows:


    Logical AND (&&): Returns true if both the boolean expressions are true, else
    returns false.


    Logical OR (||): Returns true if either or both the operations are true, else
    returns false.'
