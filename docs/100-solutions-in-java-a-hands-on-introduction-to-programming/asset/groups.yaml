    \ the java.util package and the Collections framework\n- Work with Lists, Set\
    \ and Map collections\n- Work with the Arrays class\n- Learn about collection\
    \ sorting interfaces\n- Work with Stream API\n\n# 7.1 Collections framework\n\n\
    The java.util package provides several utility classes and interfaces for different\
    \ functionalities. It contains classes for data and time manipulation, event model,\
    \ collections framework, internationalization, legacy collection classes, and\
    \ other utility classes such as a random-number generator, and a bit array.\n\n\
    A collection is a container object which helps to group multiple elements into\
    \ a single unit. Some real-world examples of collections include contacts directory\
    \ where names are mapped with phone numbers or a stack of plates, etc. Collections\
    \ help to store, retrieve, manipulate, and communicate collective data.\n\nA collections\
    \ framework is used to create and manipulate collections and it is composed of\
    \ the following:\n\n**Interfaces:** Interfaces are abstract data types and can\
    \ be used to manipulate collections independently without the need for the representation\
    \ details.\n\n**Implementations:** These are the concrete implementations of the\
    \ collection interfaces and are reusable.\n\n**Algorithms:** Algorithms are a\
    \ set of methods that are reusable/polymorphic and provide ready computations\
    \ for processes like sort and search on objects implementing the collection interfaces.\n\
    \nThe benefits of the Java Collections framework are as follows:\n\n- It provides\
    \ useful algorithms and data structures that reduce the programming effort and\
    \ allow interoperability between different APIs.\n- The high-performance implementation\
    \ of these data structures increases the quality and speed of a program.\n- Standard\
    \ collection interfaces allow easy input and output of many APIs.\n- Standard\
    \ collection APIs also reduce the effort to design new APIs.\n- Since the new\
    \ data structures and algorithms conform to the standard interfaces, the Collections\
    \ framework is reusable by default.\n\n# 7.2 Iterable interface\n\nThe Iterable\
    \ interface belongs to the java.lang package and it is a top-level interface for\
    \ classes and interfaces that need iterator functionality. Implementing this interface\
    \ allows an object to be the target of the foreach statement. Java 8 added the\
    \ for method to the Iterable interface.\n\nThe methods of the Iterable interface\
    \ are as follows:\n\n- default void foreach(Consumer super T> action): Performs\
    \ an action for each element of the Iterable interface until all elements have\
    \ been processed or the action throws an exception.\n- Iterator iterator(): Returns\
    \ an iterator over elements of T.\n- default Spliterator spliterator(): Creates\
    \ a Spliterator over the elements described by this.\n\nThe enhanced (for-each)\
    \ and forEach() methods both provide the same functionality of looping through\
    \ elements in a collection. However, the enhanced for-loop is an external iterator\
    \ whereas the forEach() method is an internal one.\n\nThe internal iterator manages\
    \ the iteration in the background so that the programmer can focus on what is\
    \ to be done with the elements of the collection instead of managing the iteration\
    \ and ensuring that all elements are processed.\n\nIn the case of an external\
    \ iterator, the programmer has to manually specify how the iteration will be performed.\n\
    \nEnumerations, Iterators, and enhanced for-loop are all external iterators with\
    \ methods such as iterator(), next(), and hasNext() for manipulating collections.\n\
    \n# 7.3 Collection interface\n\nThe Collection interface belongs to the java.util\
    \ package and it is at the top level of the interfaces and classes belonging to\
    \ the collections framework. The collections can be ordered or unordered. Some\
    \ collections permit duplicate elements while others do not.\n\nThe Collection\
    \ interface is inherited by several specific sub-interfaces such as Set, and.\
    \ These interfaces allow passing and manipulating collections as well as the conversion\
    \ of a collection type to another. To implement the interfaces, the Collections\
    \ framework provides several abstract and concrete classes in the hierarchy. The\
    \ Collection interface hierarchy is shown in the following figure:\n\n![](img/70651ebceef5c0cb89ccc7cad7a12eef_504_0.png)\n"
