    The private access specifier is used to prevent access to fields and methods outside
    the enclosing class. It is the most restrictive of all access specifiers. It cannot
    be applied to classes and interfaces. JDK 9 onwards, private methods are allowed
    in interfaces. The private; access specifier is generally used with fields that
    have important data that cannot be shared directly. All such fields are declared
    private and public accessor or getter methods are used to access them.


    The protected access specifier is used when classes have a parent-child relationship.
    Members declared that protected can be accessed by all classes in the same package
    but only by the subclasses in other packages. The protected keyword cannot be
    applied to classes and interfaces or fields and methods of an interface.


    Default: The default access specifier is applied when no access specifier is mentioned.
    It allows access to class, field, or method only to the classes of the same package.'
- md: "\n## 3.3 Instance variables and methods\n\nThe instance variables and methods\
    \ are members of a class and define the state and behavior of an objects, respectively.\
    \ These can be accessed by creating an object of the class. Each instance of a\
    \ class has its own copy of instance variables but the instance methods are shared\
