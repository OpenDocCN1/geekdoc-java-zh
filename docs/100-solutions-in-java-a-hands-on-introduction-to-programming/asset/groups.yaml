- md: "\nHere, the size of the array is 5, that is, it can store a maximum of 5 elements.\
    \ Hence, the first element will be at index 0 and the last element will be at\
    \ index size-1 = 5-1 = 4. From the figure, it can be seen that the value at index\
    \ 4 is 88 which is the last or 5th value of the array.\n\nArrays are an optimal\
    \ way of storing multiple elements of the same type because memory is allocated\
    \ to an array only when the array is used.\n\n### 4.1.1 Single-dimensional array\n\
    \nA single-dimensional array, when represented vertically, has a single column\
    \ with multiple rows of data. Each element is accessed with the name of the array\
    \ and its index. For example, consider the array of students shown in the following\
    \ screenshot:\n\n| score[5] | |\n|---|---|\n| score[0] | 40 |\n| score[1] | 56\
    \ |\n| score[2] | 76 |\n| score[3] | 60 |\n| score[4] | 85 |\n\n**Figure 4.2:**\
    \ Single-dimensional array\n\nThe array score is declared with size 5 in the square\
    \ brackets []. Hence, it can hold a maximum of 5 values. To access any value,\
    \ the name of the array with the corresponding index is used. For example, to\
    \ access the value the syntax is score[index]. Note that the last index is 4 that\
    \ is. So, an attempt to access score[5] will raise an error/exception.\n\nTo create\
    \ a single-dimensional array in Java, it must be declared, instantiated and initialized.\n\
    \n**Declaration Syntax:**\n\n```java\ndatatype[] name;\n```\n\n**Instantiation\
    \ Syntax:**\n\n```java\nname = new datatype[size];\n```\n\n**Initialization:**\n\
    \nArray can be initialized in two ways: \n\n- During declaration:\n\n```java\n\
    int[] score = {40, 56, 76, 60, 85};\n```\n\nNote that the size is not specified\
    \ and new operator is not used when array is initialized during creation.\n\n\
    - After declaration and instantiation:\n\n```java\nint[] score = new int[5];\n\
    score[0] = 40;\nscore[1] = 56;\nscore[2] = 76;\nscore[3] = 60;\nscore[4] = 85;\n\
    ```\n\nThe following example shows the use of a single-dimensional array:\n\n\
    ```java\npublic class OneDimenArray {\n    int score[]; // declaring the array\n\
    \n    public OneDimenArray() {\n        score = new int[5]; // instantiating the\
    \ array\n\n        // initializing the array\n        score[0] = 40;\n       \
    \ score[1] = 56;\n        score[2] = 76;\n        score[3] = 60;\n        score[4]\
    \ = 85;\n        System.out.println(\"Scores Added\");\n    }\n\n    public void\
    \ viewScores() {\n        System.out.println(\"Scores are listed below:\");\n\
    \        System.out.println(score[0] + \"\\n\" + score[1] + \"\\n\" + score[2]\
    \ + \"\\n\" + score[3] + \"\\n\" + score[4]);\n    }\n\n    public static void\
    \ main(String[] args) {\n        OneDimenArray obj1 = new OneDimenArray();\n \
    \       obj1.viewScores();\n    }\n}\n```\n\nHere, a one-dimensional array is\
    \ declared and then instantiated and initialized in the constructor. The values\
    \ of the array are printed by invoking the viewScores() method from the main()\
    \ method. The output of the code is shown in the following screenshot:\n\n![](img/70651ebceef5c0cb89ccc7cad7a12eef_286_0.png)\n\
    \n**Figure 4.3:** One-dimensional array\n\n### 4.1.2 Multi-dimensional array\n\
    \nA multi-dimensional array is an array of arrays; the most common being the two-dimensional\
    \ array declared with an additional set of square brackets, for example, int[][]\
    \ score. In this case, each element is accessed with an index for each dimension.\n\
    \nThe following figure shows a two-dimensional array:\n\n| Index | 0 | 1 |\n|---|---|---|\n\
    | 0 | 40 | 60 |\n| 1 | 56 | 45 |\n| 2 | 76 | 65 |\n| 3 | 60 | 74 |\n| 4 | 85 |\
    \ 90 |\n\n**Figure 4.4:** Multi-dimensional array\n\nThe array score is declared\
    \ with size 5x2 []. Hence, it can hold a maximum of 5 rows and 2 columns with\
    \ values. To access any value, the name of the array with the corresponding indices\
    \ of the row and column is used. For example, to access the value the syntax is\
    \ score[row][column]. Note that the last index of the row is 4 and that of the\
    \ column is 1. So, an attempt to access the score[5][2] will raise an error/exception.\n\
    \nTo create a multi-dimensional array in Java, it must be declared, instantiated\
    \ and initialized.\n\n**Declaration and Instantiation Syntax:**\n\n```java\ndatatype[][]\
    \ name = new datatype[rows][columns];\n```\n\nFor example:\n\n```java\nint[][]\
    \ score = new int[5][2];\n```\n\n**Initialization:**\n\nA multi-dimensional array\
    \ can be initialized in two ways:\n\n- During declaration:\n\n```java\nint[][]\
    \ score = {{40,60}, {56,45}, {76,65}, {60,74}, {85,90}};\n```\n\nNotice that the\
    \ row elements are specified in set of curly brackets separated by a comma. Also,\
