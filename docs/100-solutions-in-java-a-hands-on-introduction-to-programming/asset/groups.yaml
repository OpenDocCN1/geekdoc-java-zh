    ```\n\n# Figure 2.3: Using Escape Sequences\n\nThe hexadecimal escape sequence\
    \ contains a \\u symbol followed by four hexadecimal digits. The octal escape\
    \ sequence contains a backslash followed by three digits.\n\n## 2.6 Constants\
    \ and enumerations\n\nJava constants are variables whose values cannot change\
    \ once they have been assigned. Constants are declared by using the final keyword.\n\
    \nSyntax:\n\n```java\nfinal type variable = value;\n```\n\nExample:\n\n```java\n\
    final int discount = 10;\n```\n\nHere, the value of the discount variable is fixed\
    \ to It. It cannot be modified later since the variable is constant as indicated\
    \ by the final keyword. \n\nWhen the final keyword is applied to methods, they\
    \ cannot be overridden and if applied to a class, it cannot be extended.\n\nEnumeration\
    \ is a class type that contains a collection of constant values. It can also contain\
    \ instance variables and constructors. It is defined using the enum keyword.\n\
    \nSyntax:\n\n```java\nenum Name {\n  constant1, constant2, .. constantN\n}\n```\n\
    \nUnlike a class that is instantiated by using the new operator, the enumeration\
    \ is used by creating a variable of type similar to a primitive type. Enumerations\
    \ are generally used with decision-making constructs such as:\n\nExample:\n\n\
    ```java\npublic class EnumDays {\n  // Defining an enumeration of days of the\
