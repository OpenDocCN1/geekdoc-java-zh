    \n## CHAPTER 2\n\n## Java Programming Constructs\n\nIn this chapter, you will\
    \ learn how to use the different programming constructs of Java language such\
    \ as comments, variables, datatypes, and operators. You will also learn the use\
    \ of decision-making constructs, looping constructs, and branch statements.\n\n\
    ## Structure\n\n- Java comments\n- Variables in Java\n- Data types in Java\n-\
    \ Type casting\n- Literals and escape sequences\n- Constants and enumerations\n\
    - Operators in Java\n- Operator precedence and associativity\n- Formatting the\
    \ output\n- Scanner class for input\n- Decision-making constructs\n- Looping constructs\n\
    - Jump statements\n\n## Objectives\n\n- Learn to use comments, variables, constants,\
    \ and enumeration\n- Work with data types and operators\n- Understand the different\
    \ decision-making constructs\n- Work with the various looping constructs and branch\
    \ statements\n\n## 2.1 Java comments\n\nComments are used to document a program\
    \ for understanding the code or logic. It is ignored by the compiler and simply\
    \ used to describe the operations of the program. Java supports three types of\
    \ comments which are explained in the following sections.\n\n### Single-line comments\n\
    \nA single-line comment is used to describe code in a single line.\n\nSyntax:\n\
    \n```\n// Comment text\n```\n\nExample:\n\n```\n//Defining the main method\npublic\
    \ static void main(String args[]){\n}\n```\n\nSingle-line comments can be used\
    \ in the following two ways:\n\n- Beginning-of-line comment which is placed before\
    \ the code\n- End-of-line comment which is placed at the end of the code on the\
    \ same line\n\nExample:\n\n```java\n//Defining the main method\npublic static\
    \ void main(String args[]){\n} // End of the main method\n```\n\n### Multi-line\
    \ comments\n\nA multi-line comment is written over multiple lines. It begins with\
    \ a /** symbol and ends with a */ symbol. Everything between the two symbols is\
    \ ignored by the compiler.\n\nExample:\n\n```java\n/*\n * The main method is the\
    \ point of\n * execution of a Java program\n */\npublic static void main(String\
    \ args[]){\n}\n```\n\n### Javadoc comments\n\nThe Javadoc commenting style is\
    \ generally used to document the classes, methods, etc. of a program. Javadoc\
    \ comments begin with /** and end with /** symbols. The comment can span across\
    \ multiple lines and everything between the symbols is ignored by the compiler.\
    \ The javadoc command is used to generate Javadoc comments.\n\nExample:\n\n```java\n\
    /**\n * This is the main method which is the point of execution.\n * @param args\
    \ Not used.\n * @return Nothing.\n */\npublic static void main(String[] args){\n\
    }\n```\n\nHere, @param, @return are examples of built-in tags recognized by Javadoc\
    \ comments.\n\n## 2.2 Variables in Java\n\nThe most basic implementation of any\
    \ program is to store and manipulate data. Java supports different types of data\
    \ such as numbers, characters, boolean, etc. To store these types of values, Java\
    \ uses a variable which is a name given to a memory location where the data will\
    \ be stored. A variable can have different data types based on the type of data\
    \ that it stores. Java is strongly typed; therefore, during compilation, each\
    \ variable is checked for the type that it stores. If a type mismatch is found,\
    \ a compilation error is raised.\n\nSyntax:\n\n```\ndatatype variableName;\n```\n\
    \nAny type supported by Java.\nA valid variable name.\n\nExample:\n\n```java\n\
    ...\nint userId;\nString password;\n...\n```\n\nHere, two variables have been\
    \ declared namely, userId and password. The userId is of type integer and password\
    \ is of type String. Based on the datatype, memory is allocated to the variables.\
    \ It is mandatory to declare a variable before using it in code.\n\nVariable names\
    \ follow some conventions:\n\n- A variable name cannot be a keyword such as static,\
    \ void, int, etc.\n- A variable name can have letters, digits, or underscore (_).\n\
    - A variable name is case sensitive.\n- A variable name with a single word should\
    \ be lowercase, for example.\n- A variable name with multiple words should have\
    \ the first letter capitalized.\n\nThe following table lists some valid and invalid\
    \ variable names:\n\n| | |\n| :--- | :--- |\n| Valid: | Invalid: |\n| userId |\
    \ 1variable |\n| password | variable- |\n| age | _variable |\n| totalAmount |\
    \ static |\n\nExample of initializing variables:\n\n```java\n// Declaring two\
    \ variables\nint a, b;\n\n// Initializing a and b\na=20; b=10;\n\n// Declaring\
    \ one variable and initializing two\nint x = 4, y;\n\n// Declaring a variable\n\
    byte age = 20;\n\n// Declaring and initializing multiple variables\nint val1 =\
    \ val2 = 10;\n```\n\nJava supports instance, static, and local variables. Each\
    \ variable is explained briefly as follows:\n\nInstance variables can be accessed\
    \ by using an instance of a class. There exists a separate copy of the instance\
    \ variable for each instance.\n\nStatic variables do not require an instance to\
    \ access them as these are class-level variables. The static keyword is used to\
    \ declare a static variable and a common copy of the variable is shared by all\
    \ instances.\n\nLocal variables are declared inside blocks or methods and cannot\
    \ be accessed outside of them. A block begins with '{' and ends with '}' curly\
    \ braces symbol.\n\nThe following figure shows the use of instance and static\
    \ variables:\n\n![](img/70651ebceef5c0cb89ccc7cad7a12eef_134_0.png)\n\n## Figure\
    \ 2.1: Instance and Static Variables\n\nHere, the variable num is an instance\
    \ variable and count is a static variable. The objects object1 and object2 have\
    \ their own copies of values for the variable But the value of the count is the\
    \ same for both objects since it is a static variable. So, the objects share the\
    \ same copy of the variable count.\n\nApart from the variable types, Java also\
    \ defines a scope for each variable. The scope is decided by the location where\
    \ the variables are declared and at what point they are accessed. Broadly classifying,\
    \ the variable scope can be class level or method level (local). Class level scope\
    \ includes instance and static variables whereas local variables are declared\
    \ within a method.\n\nThe lifetime of the instance variable is till the existence\
    \ of the object and that of the static variable is till the existence of the class.\
    \ The lifetime of method level variables is dependent on the execution of the\
    \ methods. These variables are allocated memory during method execution and are\
    \ destroyed after the method completes. Another set of variables are the parameters\n"
