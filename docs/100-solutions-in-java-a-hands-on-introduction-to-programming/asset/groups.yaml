    \ command: |\n| command: command: |\n\n表 1.5: java 命令的选项\n\n## 1.13 使用 JDK 10\
    \ 创建和执行 Java 程序\n\n在 JDK 8 之前，开发者通常使用 `src/main/java` 目录结构作为源目录。例如，主类文件 `Hello.java`\
    \ 通常位于 `com.pkg1.app` 包中，整体路径为 `src/main/com/pkg1/Hello.java`。到目前为止，这是组织代码的传统模式。然而，从\
    \ Java SE 9 开始引入新的 JPMS（Java 模块系统），结构化和编写代码的模式发生了变化。\n\nJava 9 模块（module）是代码和数据的自描述集合。它可以包含多个包（package），这些包反过来可能包含一个或多个类、接口等。模块还可能包含资源文件、属性文件等。为了创建一个完整的应用程序，需要集成此类模块的集合。每个模块都是更大结构中的构建块。简而言之，现在不再是创建一个巨大的\
    \ Java 项目，而是可以创建多个模块化的功能单元，这些单元可以集成形成一个应用程序，并可以在其他应用程序中用。\n\n要在 JDK 10 中创建并执行\
    \ Java 程序，请执行以下步骤：\n\n创建一个唯一名称的模块，例如，\n\n为模块创建一个根文件夹——这需要为每个模块执行。模块根文件夹的名称应与模块名称相同。因此，在这种情况下，模块的根文件夹将是\n\
    \n在模块根文件夹内部模块代码。从模块根文件夹开始创建包。例如，在 `moduleleone` 文件夹内创建 `mypkg\\util` 包层次结构，并在\
    \ `com.mypkg.util` 包中添加 `Hello.java` 类。这种情况下的文件夹结构如下截图所示：\n\n![](img/70651ebceef5c0cb89ccc7cad7a12eef_86_0.png)\n\
    \n**图 1.20:** Java 应用程序的模块化结构\n\n在 JDK 8 之前，包直接存储在源文件夹下，而从 JDK 9 开始，包现在存储在模块根文件夹下。从模块根文件夹开始，结构与之前的版本相同。\n\
    \nJava SE 8 及更早版本的步骤如下：\n\n- 创建一个或多个源文件夹。\n- 在源文件夹中，创建与包名匹配的包文件夹。\n- 将源文件放在相应的包文件夹中。\n\
    \nJava SE 9 及更高版本的步骤如下：\n\n- 创建一个或多个源文件夹。\n- 在每个源文件夹中，为每个模块创建一个模块文件夹。\n- 在模块文件夹中，创建与包名匹配的包文件夹。\n\
    - 将源文件放在相应的包文件夹中。\n- 创建一个模块描述符文件，其中包含模块的元数据，即模块本身、导出和依赖。将该文件直接保存在模块根文件夹中，命名为 `module-info.java`。例如，`moduleone`\
    \ 模块的模块描述符所示：\n\n```\nmodule moduleone {\n// module exports and dependencies\n\
    }\n```\n\n文件以 `module` 关键字开头，指示后续文本是模块名称。模块名称应与模块根文件夹的名称相同。在大括号内指定模块的依赖关系和导出。\n\
    \n带有模块描述符的最终文件夹结构所示：\n\n![](img/70651ebceef5c0cb89ccc7cad7a12eef_88_0.png)\n\n\
    **图 1.21:** Java 模块的模块描述符\n\n注意，模块描述符文件是一个 .java 文件，但它不遵循 Java 语言的类命名规范。也就是说，Java\
    \ 类型名不允许使用连字符 (`-`)。此外，`.java` 文件的名称应与文件中声明的公共类型名称匹配，这在模块描述符名称中并未被遵守。这与自 Java\
    \ 1.5 以来使用的文件类似，尽管其并不广泛使用。这些文件被刻意赋予了无效的 Java 类型名称，以指示它们的特殊用途，并将它们与应用程序中的其他 Java\
    \ 文件区分开来。\n\n以下代码是 `Hello.java` 源文件和 `module-info.java` 模块描述符的代码：\n\n```\n//Hello.java\n\
    package mypkg.util;\npublic class Hello {\n    public static void main(String[]\
    \ args) {\n        System.out.println(\"Hello World!\");\n    }\n}\n```\n\n```\n\
    // module-info.java\nmodule moduleone {\n}\n```\n\n以下截图显示了使用 JDK 10 编译和执行 `Hello.java`\
    \ 文件的过程：\n\n![](img/70651ebceef5c0cb89ccc7cad7a12eef_89_0.png)\n\n> 图 1.22: 使用\
    \ JDK 10 编译和执行 Java 代码\n\n模块描述符 `module-info.java` 是每个模块强制要求的。如果在编译期间找不到该文件，代码将无法编译并报错：`error:\
    \ moduleone not found in module source path`。\n\n使用 `javac` 命令编译模块，并带有选项指示模块存在于\
    \ `src` 文件夹。为 `Hello.java` 源文件生成的文件将保存在选项提到的 `out` 文件夹中。该选项指向模块描述符和要编译的源文件的位置。接下来，执行\
    \ `.class` 文件并显示输出 `Hello World!`。\n\n使用 `java` 命令执行模块的方法：\n\n以下截图显示了 `src` 和\
    \ `out` 文件夹的结构：\n\n![](img/70651ebceef5c0cb89ccc7cad7a12eef_91_0.png)\n\n**图 1.23:**\
    \ Java 应用程序的源和输出文件夹\n\n通过命令行进行创建、编译和执行的所有任务都是手动完成的，这可能耗时且容易出错。为了避免这种情况，也可以在支持相应版本的\
    \ NetBeans、Eclipse 等 IDE 中创建 JDK 8 和 JDK 10 项目。\n\n## 1.14 在 NetBeans 中创建 Java\
    \ 8 项目\n\n创建 Java 8 项目请执行以下步骤：\n\n- 从 NetBeans 官网下载并安装支持 JDK 8 的 NetBeans 8.1\
    \ 或更早版本\n\n![](img/70651ebceef5c0cb89ccc7cad7a12eef_92_0.png)\n\n图 1.24: NetBeans\
    \ IDE 8.1 下载页面\n\n下载完整包并按照向导进行安装。确保在安装期间选择了正确的 JDK 路径。\n\n安装完成后，启动 NetBeans 8.1\
    \ 并如下所示点击 Project：\n\n![](img/70651ebceef5c0cb89ccc7cad7a12eef_93_0.png)\n\n图\
    \ 1.25: 在 NetBeans 8.1 中创建新项目\n\n它将打开新项目窗口。\n\n在 Categories 窗格中选择 Java，在 Projects\
