    The module is compiled by using the javac command with the option which indicates
    that the modules are present in the src folder. The generated file for the Hello.java
    source file will be saved in the out folder as mentioned in the option. The previous
    two paths indicate the location of the module descriptor and the source file to
    be compiled.


    Here are the different ways of compiling a module by using the javac command.


    javac --module-source-path src -d out -m moduleone


    javac --module-source-path src -d out --module moduleone


    javac --module-source-path src -d out src/moduleone/module-info.java src/moduleone/mypkg/util/Hello.java


    javac --module-source-path src -d out F:/java10codes/src/moduleone/module-info.java
    F:/java10codes/src/moduleone/mypkg/util/Hello.java


    Next, the java command is used to run the .class file option which indicates that
    the compiled module is present in the out folder. The option points to the location
    of the file. Finally, the .class file is executed and the output Hello World!
    is displayed on the console.'
