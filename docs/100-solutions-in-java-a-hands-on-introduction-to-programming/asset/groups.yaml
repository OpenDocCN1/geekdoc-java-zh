    # 4.5 StringTokenizer class in Java


    The java.util.StringTokenizer class provides methods to break a string into tokens.


    Constructors of the StringTokenizer class are as follows:


    StringTokenizer(String str): Creates StringTokenizer with the specified string.


    StringTokenizer(String str, String delim): Creates StringTokenizer with the specified
    string and delimiter.


    StringTokenizer(String str, String delim, boolean returnValue): Creates StringTokenizer
    with the specified string, delimiter, and return If returnValue is true, the delimiter
