    # 5.1 Inheritance in Java


    Java provides the concept of inheritance to group classes with similar characteristics
    and creates a class hierarchy. The common characteristics and behaviors are combined
    into a single class termed as the superclass or parent class and all other classes
    that inherit these characteristics and behaviors are termed as subclasses or child
    classes.


    Subclasses inherit all members and methods except the private ones. Constructors
    of the superclass are not inherited but can be invoked from the child class constructor
    directly or by using Subclasses will have its own features along with those inherited
    from the superclass. Declaring members with similar names in the subclass as that
    of the parent class will lead to the hiding of members of the parent class.


    The following figure shows the different types of inheritance in Java:


    ![](img/70651ebceef5c0cb89ccc7cad7a12eef_330_0.png)'
