    \n# 5.1 Inheritance in Java\n\nJava provides the concept of inheritance to group\
    \ classes with similar characteristics and creates a class hierarchy. The common\
    \ characteristics and behaviors are combined into a single class termed as the\
    \ superclass or parent class and all other classes that inherit these characteristics\
    \ and behaviors are termed as subclasses or child classes.\n\nSubclasses inherit\
    \ all members and methods except the private ones. Constructors of the superclass\
    \ are not inherited but can be invoked from the child class constructor directly\
    \ or by using Subclasses. Subclasses will have its own features along with those\
    \ inherited from the superclass. Declaring members with similar names in the subclass\
    \ as that of the parent class will lead to the hiding of members of the parent\
    \ class.\n\nThe following figure shows the different types of inheritance in Java:\n\
    \n![](img/70651ebceef5c0cb89ccc7cad7a12eef_330_0.png)\n\n# Figure 5.1: Types of\
    \ Inheritance\n\nThe different types of inheritance in Java are as follows:\n\n\
    **Single inheritance:** In single inheritance, a child class can inherit from\
    \ only one parent/superclass.\n\n**Multilevel inheritance:** In multilevel inheritance,\
    \ a child class inherits from a single parent and the parent can inherit from\
    \ another single class itself.\n\n**Hierarchical inheritance:** In hierarchical\
    \ inheritance, a parent/superclass can have more than one child classes that in\
    \ turn may have other child classes at different levels.\n\n**Multiple inheritance:**\
    \ In multiple inheritance, a child class can inherit from more than one parent/superclasses.\
    \ Java does not support multiple inheritance with classes due to an issue called\
    \ the diamond problem.\n\nThe diamond problem is a situation when there is one\
    \ abstract class A that is inherited by two subclasses, B and C. Assume that the\
    \ abstract class has a method called test(). This method will be overridden in\
    \ both subclasses. Now, another class, D, inherits the two subclasses that have\
    \ the test() method with the same name and signature. In this case, a copy of\
    \ both the test() methods will be created in the subclass object. When an object\
    \ of the subclass is created to access the test() method, the compiler faces an\
    \ ambiguous situation and cannot decide which method to call. This issue is known\
    \ as the diamond problem in Java which is shown as follows:\n\n```\n  A\n /\\\n\
    B C\n /\\\n  D\n```\n\nJava offers a solution to the diamond problem in the form\
    \ of interfaces. Multiple inheritance can be simulated by implementing more than\
    \ one interface in a class. You can also use default methods introduced in interfaces\
    \ in Java 8.\n\n# 5.1.1 Creating a subclass\n\nTo implement inheritance in Java,\
    \ a parent-child relationship is created between two or more classes by using\
    \ the extends keyword. Syntax:\n\n```\npublic class Child extends Parent {\n//\
    \ child class members\n}\n```\n\nTo access the superclass constructor, the super()\
    \ method is used. The following example shows the implementation of single inheritance\
    \ in Java:\n\n```\npublic class Shape {\n  private final float PI = 3.14f;\n \
    \ protected float width;\n  private String shape;\n\n  public Shape(String shape)\
    \ {\n    this.shape = shape;\n  }\n\n  public void area(float length) {\n    switch\
    \ (shape.toLowerCase()) {\n      case \"circle\":\n        System.out.println(\"\
    Area of Circle is \" + (PI * length * length));\n        break;\n      case \"\
    square\":\n        System.out.println(\"Area of Square is \" + (length * length));\n\
    \        break;\n      case \"rectangle\":\n        System.out.println(\"Area\
    \ of Rectangle is \" + (length * width));\n        break;\n      case \"triangle\"\
    :\n        System.out.println(\"Area of Triangle is \" + (1 / 2 * length * width));\n\
    \        break;\n    }\n  }\n}\n\npublic class Rectangle extends Shape {\n  public\
    \ Rectangle() {\n    super(\"rectangle\");\n    width = 20;\n  }\n\n  public void\
    \ drawRect() {\n    System.out.println(\"Drawing a Rectangle\");\n  }\n}\n```\n\
    \nThe Shape class with data members and a method is the parent/superclass. The\
    \ Rectangle class is the child/subclass that inherits the Shape class by using\
    \ the extends keyword. It initializes the width variable that it has inherited\
    \ from the parent class. Note that the call to the superclass constructor using\
    \ the super() method sets the value of the shape variable. The drawRect() method\
    \ is specific to the Rectangle class:\n\n```java\npublic class TestShapes {\n\
    \  public static void main(String[] args) {\n    Rectangle obj = new Rectangle();\n\
    \    obj.drawRect();\n    obj.area(40);\n  }\n}\n```\n\nThe TestShape class has\
    \ a main() method that creates an object of the Rectangle class. The object is\
    \ used to invoke the drawRect() method and the inherited area() method to set\
    \ the value of the length variable and display the area of the rectangle.\n\n\
    The output of the code is shown in the following screenshot:\n\n![](img/70651ebceef5c0cb89ccc7cad7a12eef_335_0.png)\n\
    \nFigure 5.2: Single Inheritance\n\nSimilarly, more classes can be inherited from\
