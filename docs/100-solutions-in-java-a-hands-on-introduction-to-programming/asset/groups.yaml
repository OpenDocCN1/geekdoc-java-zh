    \n- equals(Object o): 将指定的对象与此集合进行比较，以检查它们是否相等。\n\nCollection 接口提供了一些方法用于对整个集合执行批量操作。这些方法如下：\n\
    \n- containsAll(Collection c): 如果此集合包含指定集合的所有元素，则返回 true。\n\n- addAll(Collection<?\
    \ extends E> c): 将指定的 Collection 中的所有元素添加到此集合中。\n\n- removeAll(Collection c):\
    \ 移除此 Collection 中存在于指定集合中的所有元素。\n\n- retainAll(Collection c): 保留此集合中仅存在于指定集合的元素。\n\
    \n## 7.3.1 遍历集合\n\n遍历意味着意味着遍历集合以访问/操作其元素。在 Java 中，通常使用两种方法用于遍历集合：\n\n**For-each/增强\
    \ for 循环**：for-each 循环（增强 for 循环）于 Java SE 5，是一种用于遍历集合的控制流语句。然而，与 for 结构不同，for-each\
    \ 循环不维护显式的计数器，也就是说，for-each 循环会对集合中的每个元素执行此操作。\n\n内部，for-each 的行为与 Iterator 相同。因此，在逐个按顺序读取每个元素时，它优于\
    \ Iterator，因为 for-each 更加方便和简洁。\n\n语法：\n\n```\nfor(Object obj : collection) {\n\
    \    System.out.println(obj);\n}\n```\n\n由于 for-each 结构不维护显式索引，因此不允许使用 `remove()`\
    \ 方法删除当前元素。\n\n**Iterator**: Iterator 接口提供了遍历和操作集合的方法。要获取集合的 Iterator，请使用 `iterator()`\
    \ 方法。以下是 Iterator 接口的一些重要方法：\n\n- hasNext(): 如果迭代还有更多元素，则返回 true。\n\n- next():\
    \ 返回迭代中的下一个元素。\n\n- remove(): 移除由 `next()` 方法从集合返回的最后一个元素。对于每次调用 `next()` 方法，`remove()`\
    \ 方法只能调用一次。`remove()` 方法是迭代期间安全修改集合的唯一方法。\n\n## 7.3.2 Collection 工厂方法\n\n工厂方法随\
    \ Java 9 引入。这些是用于创建不可变集合的特殊静态方法。你可以使用这些方法为较小的元素集创建 List 和 Map。每个接口都有自己的工厂方法。尝试添加新元素将抛出\
    \ `UnsupportedOperationException`。\n\n## 7.4 List 接口\n\nList 是通过实现 List 接口创建的集合，该接口是\
    \ Collection 接口的扩展。List 是有序集合，允许重复值和多个空元素。可以使用整数索引访问/搜索列表的索引元素。与 Java 数组类似，列表索引从\
    \ 0 开始，最后一个索引为 size-1。可以通过 List 接口的方法通过基于位置的操作对集合进行处理。List 接口内部使用索引对添加到列表的元素进行排序。List\
    \ 接口还提供了添加、搜索元素以及执行范围操作的方法。\n\nList 接口提供了 ListIterator 以按顺序访问列表的元素。它用于插入和替换元素，并结合普通操作进行双向访问。以下是\
    \ List 接口除继承自 Collection 接口之外的其他方法：\n\n- add(int index, E element): 在索引指定的位置向列表添加指定的元素。\n\
    \n- addAll(int index, Collection<? extends E> c): 从指定的索引位置开始，将指定集合 c 的所有元素添加到列表中。\n\
    \n- get(int index): 从指定的索引位置获取此列表的元素。\n\n- set(int index, E element): 用指定的元素替换此列表中从索引指定位置的元素。\n\
    \n- remove(int index): 移除列表中给定索引位置的元素。\n\n- subList(int start, int end): 返回一个子列表，包含此列表从\
    \ start 到 end - 1 的元素。\n\n- indexOf(Object o): 返回指定元素在列表中第一次出现的位置索引，如果未在列表中找到该元素，则返回\
    \ -1。\n\n- lastIndexOf(Object o): 返回指定元素在列表中最后一次出现的位置索引，如果未在列表中找到该元素，则返回 -1。\n\
    \n`equals()` 方法有益于检查两个 List 对象的逻辑相等性。如果两个 List 对象包含相同顺序的相同元素，则它们是相等。以下是 List 接口的工厂方法列表：\n\
    \n- static List of(): 返回一个包含零元素的不可变列表。\n\n- static List of(E e1): 返回一个包含一个元素的不可变列表。\n\
    \n- static List of(E... elements): 返回一个包含任意数量元素的不可变列表。\n\n- static List of(E e1,\
    \ E e2): 返回一个包含两个元素的不可变列表。\n\n- static List of(E e1, E e2, E e3): 返回一个包含三个元素的不可变列表。\n\
    \n- static List of(E e1, E e2, E e3, E4): 返回一个包含四个元素的不可变列表。（注：此处 E4 可能是指四个元素）\n\
    \n以下示例展示了 List 工厂方法的使用：\n\n```java\nimport java.util.List;\n\npublic class ListDemo\
    \ {\n\n    public static void main(String[] args) {\n        //工厂方法创建一个不可变的 List\n\
    \        List list1 = List.of(\"Java\", \"Java EE\", \"Spring\", \"Hibernate\"\
    , \"Struts\");\n\n        System.out.println(\"Java Topics\");\n        for (String\
    \ l : list1) {\n            System.out.println(l);\n        }\n    }\n}\n```\n\
    \n代码输出为：\n\nJava Topics\nJava\nJava EE\nSpring\nHibernate\nStruts\n\n图 7.2: List\
    \ 接口工厂方法\n\n### 7.4.1 ArrayList 类\n\nArrayList 类实现了 List 接口及其方法。它是原始类型固定大小数组的解决方案，因为它允许创建可以动态伸缩的对象的数组。在创建\
    \ ArrayList 对象时，必须指定初始大小，该大小根据对 ArrayList 元素的操作而增加或减少。\n\nArrayList 类允许所有元素，包括\
    \ null。当在末尾进行插入/删除元素时，ArrayList 类最为。每个 ArrayList 实例都有一个容量，在添加到列表时会自动增加。\n\nArrayList\
    \ 类的构造函数如下：\n\n- ArrayList(): 创建一个初始容量为 10 的空列表。\n\n- ArrayList(Collection<? extends\
    \ E> c): 创建一个包含集合元素的列表，按集合迭代器返回的顺序存储。\n\n- ArrayList(int initialCapacity): 创建一个指定容量的空列表。\n\
    \n例如：\n\n```java\nimport java.util.ArrayList;\nimport java.util.List;\n\nList\
    \ list1 = new ArrayList<>();\n```\n\nARRAYLIST 类的方法的方法：\n\nArrayList 类继承了 List\
    \ 接口的所有方法。某些方法列如下：\n\n- add(E obj): 将指定的元素添加到此列表的末尾。\n\n- contains(Object obj):\
    \ 如果此列表包含指定的元素，则返回 true。\n\n- size(): 返回此列表中元素的个数。\n\n- trimSize(): 将 ArrayList\
    \ 的大小调整为列表的大小。\n\n- ensureCapacity(int minCap): 增加 ArrayList 的容量，并确保它可以容纳至少指定数量的元素。\n\
    \n- clear(): 移除此列表中的所有元素。\n\n"
