  - "[PAGE 407]\n\n# 6.1 Exceptions in Java\n\nAny abnormal or unexpected event occurring\
    \ in a program that disrupts its normal execution is termed as an exception. There\
    \ can be different types of exceptions and reasons for exceptions such as an attempt\
    \ to open a file that does not exist, invalid data specified to a method, network\
    \ connection error, or out of memory error. The information about the error is\
    \ stored in the exception object that is passed to the runtime.\n\nAn exception\
    \ occurring in a method can be thrown by using the exception object of the type\
    \ of exception that occurred. The runtime looks for a handler code that can handle\
    \ the exception in the same method. If it does not find a handler, it searches\
    \ the entire method call stack to find an appropriate exception handler. If the\
    \ runtime does not find a handler in the entire call stack, it will eventually\
    \ terminate the program.\n\nThe sequence in which methods are invoked inside another\
    \ method(s) is called a call stack. A stack trace shows the sequence in which\
    \ methods were invoked that led to the exception.\n\nFor example, consider the\
    \ following partial code:\n\n```\npublic void methodOne(){\n    methodTwo();\n\
    }\n```"
- md: "\n```java\npublic void methodTwo(){\n  methodThree();\n}\npublic void methodThree(){\n\
    \  // code that causes exception\n}\n```\n\nAs seen in the preceding code, methodOne\
    \ calls methodTwo which in turn calls methodThree. Here, the methodThree has a\
    \ code that causes an exception, but it does not have any handler. So, the runtime\
    \ will look for the handler in methodTwo and since none of the methods have a\
    \ handler, the program will terminate.\n\nIn case a handler was found, the exception\
    \ is passed to the handler which can handle it. Note that an appropriate handler\
    \ is one that can handle or catch the same type of exception as thrown by the\
    \ method.\n\nThe advantages of exception handlers are as follows:\n\n- Help to\
    \ separate the normal code from the error handling code.\n- They can handle errors\
    \ anywhere within the method call stack.\n- They help categorize similar error\
    \ types to have common handlers for them. For example, the IOException class of\
    \ java.io package can handle most of the I/O exceptions. For more specific exceptions,\
    \ the descendants of IOException class are used.\n\n## 6.1.1 Types of Exceptions\n\
    \nJava exceptions can be caused by a number of reasons such as user errors, logical\
    \ errors, or systemic errors from some system resources. Therefore, exceptions\
    \ can be broadly categorized as follows:\n\n- Checked exceptions\n- Unchecked\
    \ exceptions\n\nLet's take a look at them in detail.\n\n## Checked exceptions\n\
    \nChecked exceptions are anticipated in a program and appropriate handlers are\
    \ provided for them. For example, suppose a user is prompted to enter a number\
    \ but the user specifies a string, this causes an exception. However, this will\
    \ not affect the program fatally as it will have the code to handle this exception\
    \ and inform the user with an appropriate message. In Java, all exceptions are\
    \ checked except Error and Runtime.\n\nHere are some of the checked exceptions:\n\
    \n- InstantiationException: This occurs when an attempt is made to create an instance\
    \ of an abstract class.\n- InterruptedException: This occurs when a thread is\
    \ interrupted.\n- NoSuchMethodException: This occurs when the runtime is unable\
    \ to resolve the method that needs to be invoked.\n\n## Unchecked exceptions\n\
    \nErrors and runtime exceptions collectively form the unchecked exceptions:\n\n\
    - **Errors**: Errors are not raised by an application but raised externally. For\
    \ example, java.io.IOException is raised if the runtime fails to open a file that\
    \ exists on the system due to some hardware/system issues. The classes for errors\
    \ are provided in the Error class hierarchy. An application may catch this exception\
    \ or leave it to the program to print a stack trace and exit.\n- **Runtime exceptions**:\
    \ The runtime exceptions are caused within an application but are not anticipated\
    \ such as logical errors or inappropriate use of an API. Hence, the application\
    \ does not have any means to recover from such exceptions. For example, the user\
    \ passes the correct value as a method argument but to some logical issue, null\
    \ is passed which leads to an exception. The application may handle this exception\
    \ or eradicate the error that led to the exception. The classes for runtime exceptions\
    \ are provided by the RuntimeException class hierarchy.\n\nHere are some commonly\
    \ observed unchecked exceptions:\n\n- ArithmeticException: This occurs when there\
    \ is an error in an arithmetic expression, for example, divide by zero.\n- ArrayIndexOutOfBoundsException:\
    \ This occurs when an attempt is made to access an array index less than zero\
    \ or greater than the size of the array.\n- IllegalArgumentException: This occurs\
    \ when an illegal argument is passed to a method.\n- NegativeArraySizeException:\
    \ This occurs if the array size is less than zero.\n- NullPointerException: This\
    \ occurs when an attempt is made to access a null object member.\n- NumberFormatException:\
    \ This occurs when an attempt is made to convert a string to a number.\n- StringIndexOutOfBoundsException:\
    \ This occurs if the index is negative or greater than the size of the string.\n\
    \nThe base class for any class in Java is the Object class and for all the exception\
    \ classes, the Throwable class is the base class. The Throwable class is the child\
    \ class of the Object class. The two direct subclasses of the Throwable class\
    \ are the Exception class and the Error class.\n\nThe following figure shows the\
    \ Throwable class hierarchy:\n\n![](img/70651ebceef5c0cb89ccc7cad7a12eef_414_0.png)\n\
    \n## 6.2 Exception class in Java\n\nThe Exception class is the parent class of\
    \ all checked exceptions and it is a subclass of the Throwable class:\n\n```java\n\
    public class Exception extends Throwable{\n...\n}\n```\n\nHere are the constructors\
    \ of the Exception class:\n\n- Exception(): No argument/default constructor creates\
    \ an exception with the error message set to null.\n- Exception(String message):\
    \ Creates an exception with the error message specified in the String argument.\n\
    - Exception(String message, Throwable cause): Creates an exception with the error\
    \ message specified in the String argument with the cause.\n- Exception(Throwable\
    \ cause): Creates an exception with the specified cause. If the cause is null,\
    \ it will return null of the message, else it will return the String representation\
    \ of the message. The message includes the class name and the detailed information\
    \ of the cause.\n\nHere are some of the methods of the Exception class:\n\n- public\
    \ String getMessage(): Returns the details about the exception that has occurred.\n\
    - public Throwable getCause(): Returns the cause of the exception indicated by\
    \ the Throwable object.\n- public String toString(): Returns the result of the\
    \ getMessage() method with the name of the exception class concatenated to it,\
    \ if the Throwable object is created with a message string that is not null. Returns\
    \ the name of the actual class of the exception object, if the Throwable object\
    \ is created with a null message string.\n- public void printTrace(): Prints the\
    \ result of the method to the error stream, that is,\n- public StackTraceElement[]\
    \ getTrace(): Returns an array where each element contains a frame of the method\
    \ call trace index for the method at the top of the stack and the last element\
    \ for the method at the bottom of the stack.\n- public Throwable fillInStackTrace():\
    \ Fills the stack trace of this Throwable object with the current stack trace\
    \ and also adds to any previous information in the stack trace.\n\nThe Exception\
    \ class has several subclasses that represent different types of exceptions such\
    \ as the RuntimeException subclass of the Exception class further contains subclasses\
    \ which indicate exceptions occurring due to improper use of API. For example,\
    \ the IllegalArgumentException class occurs when incorrect argument is passed\
    \ to a method.\n\n## 6.3 Exception handling in Java\n\nThe checked exceptions\
    \ that a method/constructor is liable to throw must be declared in the throws\
    \ clause. However, for runtime exceptions, the compiler does not make this a mandate\
    \ since more than one runtime exception can occur anywhere in a program, and adding\
    \ code to handle them in every method can affect the clarity of the code.\n\n\
    For example, if a method expects three arguments before execution, one can check\
    \ the arguments before invoking the method. Thus, if it is possible to recover\
    \ from an exception, it can be made a checked exception, else it can be unchecked.\n\
    \nTo create an exception handler for any code that is liable to cause the error,\
    \ the try-catch block is used.\n\nSyntax:\n\n```\ntry {\n    // statements that\
    \ may raise exception\n    // statement 1\n    // statement 2\n}\ncatch () {\n\
    \    // handling exception\n}\n```\n\nThe statements that may throw an exception\
    \ are enclosed within the try block. To handle the exception(s), the appropriate\
    \ catch block is provided with the exception type object as a parameter. The catch\
    \ block can be in the same method or anywhere higher in the method call stack.\n\
    \nTo handle multiple types of exceptions, a try block can be followed by more\
    \ than one catch block for each specific type of exception.\n\n# Syntax:\n\n```\n\
    try {...}\ncatch () {...}\ncatch () {...}\n```\n\nTo ensure that some important\
    \ statements can be executed even if an exception occurs, Java provides the finally\
    \ block. The finally block is always executed irrespective of whether an exception\
    \ occurs or not. It is mainly used to execute cleanup code such as closing database\
    \ connections, file streams, etc. to avoid resource leaks.\n\nThe finally block\
    \ may not execute under the following conditions:\n"
  mdcn: "\n\n```java\npublic void methodTwo(){\n  methodThree();\n}\npublic void methodThree(){\n\
    \  // code that causes exception\n}\n```\n\n如前面的代码所示，`methodOne` 调用 `methodTwo`，而\
    \ `methodTwo` 又调用 `methodThree`。在这里，`methodThree` 包含导致异常的代码，但它没有任何处理器。因此，运行时将在\
    \ `methodTwo` 中查找处理器，由于没有任何方法拥有处理器，程序将终止。\n\n如果找到了处理器，异常将传递给该处理器并由其进行处理。请注意，适当的处理器是指处理或捕获与方法抛出的异常类型相同的异常的处理器。\n\
    \n异常处理器的优势如下：\n\n- 帮助将正常代码与错误处理代码分离。\n- 它们可以处理方法调用栈中任何位置错误。\n- 它们有助于对相似的错误类型进行分类，以便为它们提供公共处理器。例如，java.io\
    \ 包中的 `IOException` 类可以处理大多数 I/O 异常。对于更具体的异常，使用 `IOException` 类的子类。\n\n## 6.1.1\
    \ 异常的类型\n\nJava 异常可能由多种原因引起，例如用户错误、逻辑错误或来自某些系统资源的系统错误。因此，异常可以大致分类如下：\n\n- 编译异常（Checked\
    \ exceptions）\n- 未编译异常（Unchecked exceptions）\n\n让我们详细查看它们。\n\n## 编译异常\n\n编译异常是程序中可以预期的，并为它们提供了适当的处理器。例如，假设提示用户输入数字，但用户指定了字符串，这会导致异常。然而，这不会致命地影响程序，因为将会有代码来处理此异常并用适当的消息通知用户。在\
    \ Java 中，除了 `Error` 和 `RuntimeException` 之外，所有异常都是受检查的。\n\n以下是一些编译异常：\n\n- `InstantiationException`：当尝试创建抽象类的实例时发生。\n\
    - `InterruptedException`：当线程被中断时发生。\n- `NoSuchMethodException`：当运行时无法解析需要调用的方法时发生。\n\
    \n## 未编译异常\n\n错误和运行时异常共同形成了未编译异常：\n\n- **Errors（错误）**：错误不是由应用程序抛出的，而是外部抛出的。例如，由于某些硬件/系统问题导致无法打开系统中存在的文件，就会抛出\
    \ `java.io.IOException`。错误类在 `Error` 类层次结构中提供。应用程序可以捕获此异常，也可以让程序打印堆栈跟踪并退出。\n-\
    \ **Runtime exceptions（运行时异常）**：运行时异常是由应用程序内部引起的，但是不可预见的，例如逻辑错误或对 API 的不当使用。因此，应用程序没有办法从此类异常中恢复。例如，用户传递了正确的值作为方法参数，但由于某些逻辑问题，传递了\
    \ `null` 导致了异常。应用程序可以处理此异常，也可以消除导致异常的错误。运行时异常类由 `RuntimeException` 类层次结构提供。\n\n\
    以下是一些常见的未编译异常：\n\n- `ArithmeticException`：当算术表达式出现错误时发生，例如除以零。\n- `ArrayIndexOutOfBoundsException`：当尝试访问小于\
    \ 0 或大于数组大小的数组索引时发生。\n- `IllegalArgumentException`：当向方法传递非法参数时发生。\n- `NegativeArraySizeException`：当数组大小小于\
    \ 0 时发生发生。\n- `NullPointerException`：当尝试访问 `null` 对象成员时发生。\n- `NumberFormatException`：当尝试将字符串转换为数字时发生。\n\
    - `StringIndexOutOfBoundsException`：当索引为负数或大于字符串大小时发生。\n\nJava 中任何类的基类都是 `Object`\
    \ 类，而对于所有异常类，`Throwable` 类都是基类。`Throwable` 类是 `Object` 类的子类。`Throwable` 类的直接子类是\
    \ `Exception` 类和 `Error` 类。\n\n下面的图显示了 `Throwable` 类层次结构：\n\n![](img/70651ebceef5c0cb89ccc7cad7a12eef_414_0.png)\n\
    \n## 6.2 Java 中的 Exception 类\n\n`Exception` 类是所有编译异常的父类，并且它是 `Throwable` 类的子类：\n\
    \n```java\npublic class Exception extends Throwable{\n...\n}\n```\n\n以下是 `Exception`\
    \ 类的构造函数：\n\n- `Exception()`：无参数/默认构造函数，创建一个错误消息设置为 `null` 的异常。\n- `Exception(String\
    \ message)`：创建一个在 `String` 参数中指定消息的异常。\n- `Exception(String message, Throwable\
    \ cause)`：创建一个在 `String` 参数中指定消息并带有原因的异常。\n- `Exception(Throwable cause)`：创建一个带有指定原因的异常。如果原因是\
    \ `null`，它将返回 `null` 消息，否则将返回消息的字符串表示。消息包含了类名和原因的详细信息。\n\n以下是 `Exception` 类的一些方法：\n\
    \n- `public String getMessage()`：返回有关已发生异常的详细信息。\n- `public Throwable getCause()`：返回由\
    \ `Throwable` 对象指示的异常原因。\n- `public String toString()`：如果创建 `Throwable` 对象时带有非\
    \ `null` 的消息字符串，则将异常类名拼接在 `getMessage()` 方法的结果之后并返回。如果 `Throwable` 对象是带有 `null`\
    \ 消息字符串创建的，则返回异常对象的实际类名。\n- \n- `public void printTrace()`：将方法的结果打印到错误流中，即：\n\
    - `public StackTraceElement[] getTrace()`：返回一个数组，其中每个元素包含栈顶方法的调用调用跟踪索引的帧，最后一个元素是栈底方法的帧。\n\
    - `public Throwable fillInStackTrace()`：用当前堆栈跟踪填充此 `Throwable` 对象的堆栈跟踪，并添加到之前的任何堆栈跟踪信息中。\n\
    \n`Exception` 类有多个子类，表示不同类型的异常，例如 `RuntimeException` 类子类进一步包含了由于不当使用 API 引起的异常。例如，`IllegalArgumentException`\
    \ 在向方法传递错误参数时发生。\n\n## 6.3 Java 中的异常处理\n\n方法/构造函数可能抛出的编译异常必须在 `throws` 子句中声明。然而，对于运行时异常，编译器并不强制要求，因为运行时异常可能发生在程序的任何位置，且在每个方法中添加处理它们的代码会影响代码的清晰度。\n\
    \n因此，如果可以从异常中恢复，可以将其变为编译异常，否则可以是运行时。\n\n为任何可能导致错误的代码创建异常处理器，使用了 `try-catch` 块。\n\
    \n语法：\n\n```\ntry {\n    // 可能抛出异常的语句\n    // 语句 1\n    // 语句 2\n}\ncatch () {\n\
