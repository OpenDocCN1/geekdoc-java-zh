    ## 1.2 Java programming language


    Java is a popular object-oriented, platform-independent programming language.
    It allows you to develop a variety of applications that can run on different hardware
    and operating systems. Java also provides a runtime environment for executing
    Java applications on different devices.


    Java was originally developed in 1991 by James Gosling and a team of engineers
    at Sun Microsystems which was later acquired by Oracle Corporation. It was initially
    designed for consumer devices such as washing machines, televisions, etc. For
    such devices, it was necessary to have a language that was small, fast, and platform-independent.
    Languages such as C and C++ were not preferred due to the compiler''s dependence
    on specific CPUs and also high development time and cost. Thus, Java was developed
    as a portable and platform-independent language that could execute code on any
    platform. Initially, it was named Oak but later renamed to Java.


    Even though Java was developed to cater to the programming needs for smaller devices,
    it was found to be able to address larger problems, including check casing of
    Web and mobile applications. It gained instant popularity and was adopted all
    over the world for the development of applications, ranging from embedded, desktop,
    Web, and mobile applications. Java can be used to create applications for small
    to large businesses and even for supercomputers.


    ## 1.2.1 Features and advantages of Java


    Following are some features and advantages of the Java programming language:


    - Simple and robust: The Java syntax is derived from its predecessor programming
    languages like C, C++. This makes it easy for developers to learn Java quickly.
    Further, the complexity of pointers, operator overloading, multiple inheritances
    and other such features has been removed in Java. Instead, it has been made more
    robust through efficient memory management and exception handling features.


    - Java is based on the object-oriented programming paradigm. Thereby, it is well
    suited for the development of real-world applications.


    - Platform independent: Java provides a solution to a major problem faced by earlier
    languages, that is, code portability. During compilation, it converts the source
    code into an intermediate, architecture-neutral format called bytecode. This bytecode
    can be executed on any platform which has a Java Virtual Machine (JVM) installed.
    Further, even the language specifications, such as the size of primitive data
    types and operators, have been defined to be independent of the hardware. This
    ensures that the code will function properly in case of a change in the operating
    system, processor, or system resources.


    - Security is an important issue in Java applications since they are designed
    for multiple and distributed platforms. Java provides security checks at different
    levels during application development. The JVM is designed to apply its security
    features during code execution to ensure that the code is well-formed and written
    as per Java standards.


    - Java supports the development of multithreaded applications to perform multiple
    tasks concurrently. In a multithreaded application, a single program can have
    multiple threads performing tasks independently and concurrently. Java allows
    you to create thread pools that can be used to obtain threads when required.


    - **Java** supports distributed programming to deploy and access resources across
    the network. It provides several Application Programming Interfaces (APIs) to
    handle remote transmission and requests over a network. Java also allows dynamic
    execution of classes by storing them in a separate location and loading the necessary
    classes dynamically at runtime.


    - **Modular:** The concept of modularity has been introduced since Java 9. It
    was supposed to be incorporated in Java 7 and Java 8 but was not accomplished.
    Until Java 1.8, the packages were bundled into executable .jar files for a Java
    application. But, with Java 9, a new construct called Module has been introduced.
    A module is similar to the JAR file but unlike the JAR file, it also contains
    the configuration information in the form of a module-info.java file. This allows
    a module to be more powerful and flexible as compared to a JAR file since all
    dependencies are specified in the module-info.java file. While using a JAR file,
    the entire JAR file is loaded during application execution, but with the module,
    only those modules that are part of the dependency list will be loaded. This allows
    applications to remain light-weight as well as execute faster.


    ## 1.3 Java platform and editions


    The Java platform is a development and execution environment for Java applications
    which is a mixture of software and hardware components. The following image shows
    the components of a Java platform:


    ![](img/70651ebceef5c0cb89ccc7cad7a12eef_42_0.png)


    Figure 1.3: Java platform


    The above figure depicts the components of a Java platform. It is formed of the
    Java Runtime Environment (JRE) which contains the Java library (Java API) and
    Java Virtual Machine (JVM). In languages such as C and C++, the compiled code
    is platform dependent as it is in the form of executable binary code. However,
    the Java compiler converts the code into an intermediate bytecode which is an
    optimized set of instructions that can be executed on any machine that has the
    appropriate JVM. Thus, JVM provides platform independence to Java code. Each operating
    system such as Windows, Linux, Mac, etc. has its JVM. Thus, Java code follows
    the principle of write-once use many.


    The Java API/library is a collection of ready-to-use components such as calls
    and interfaces that can be used to create applications. For example, the Swing
    library is used to create a user interface (UI) of a Java application. Java is
    released under several editions to meet the requirements of a specific type of
    device. The following is a brief description of the different Java editions:


    - **Java Standard Edition (Java SE The Java SE platform is the base for creating
    applications that are console or network-based applications mainly for desktop
    computers. It contains the core APIs which include the basic types and classes
    for higher-level programming such as networking, security, Graphical User Interface
    (GUI), database manipulation, and parsing of XML data. It also provides the virtual
    machine, development and deployment tools, and other toolkits and libraries for
    advanced programming.


    - **Java Enterprise Edition (Java EE**: The Java EE platform is an extension of
    the Java SE platform. It provides the tools and APIs for the creation and deployment
    of large-scale, distributed, scalable, multi-tier, reliable, and secure enterprise
    applications with complex business logic.


    - **Java Micro Edition (Java ME**: The Java ME platform is mainly used for creating
    embedded Java applications for small devices such as mobiles, TVs set-top boxes,
    etc. It contains a subset of Java SE APIs and a smaller virtual machine to execute
    Java programs on small devices with lesser memory and storage space. Java ME applications
    are generally used as clients of Java EE platform services.


    - **JavaFX**: The JavaFX platform provides lightweight user interface APIs for
    creating rich internet applications that use hardware-accelerated graphics and
    media engines. Java FX allows you to create high-performance graphic applications
    with a modern look-feel. It also provides high-level APIs to connect with data
    sources over the network. JavaFX applications can also be used as clients of Java
    EE platform services.

    '
