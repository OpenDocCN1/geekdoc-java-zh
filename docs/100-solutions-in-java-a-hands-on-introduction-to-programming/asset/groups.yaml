    # 6.7 Assertions in Java


    An assertion is a statement in Java which allows a developer to test certain assumptions
    about code in a program. When an assertion is added to code, it is expected to
    be true. If the assertion fails, the runtime will throw the


    The following are the advantages of assertions:


    It is an effective way to test code to detect and correct programming errors.


    It is used to test for failing of various conditions. If the condition fails,
    the application can be terminated to view the debugging information.


    It helps to document the inner working of the program to simplify code maintenance.


    An assertion is composed of a boolean expression which is expected to be true
    as it confirms the assumption of the behavior of the code being tested. There
    are two ways of using assertions:


    First form:


    ```

    assert ;

    ```'
  - '[PAGE 444]


    Second form:


    assert : ;


    Here, the detail-expression has a value. It cannot have the invocation of a method
    that is declared void. Use the second form of the assertion statement only if
    the program contains some additional information that might help analyze the failure.


    Generally, assertion failures are labeled in the stack trace with the file name
    and line number similar to all uncaught exceptions. To avoid performance issues
    in deployed applications, assertions can be enabled or disabled during execution
    if required. By default, assertions are disabled. Assertions should not be used
    for checks that need to be done every time at runtime as the assertions may be
    disabled. Instead, use logic to perform the checks in such cases.


    Assertions can be enabled by using the following command at the command line:


    ```

    java -ea

    ```


    or


    ```

    java -enableassertions

    ```'
