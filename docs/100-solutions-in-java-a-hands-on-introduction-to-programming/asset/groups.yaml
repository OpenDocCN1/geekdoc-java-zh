    # Features of Java SE 10


    JDK 10 follows the modular model of JDK 9 and provides enhancements on the features
    and functionalities of JDK 9. JDK 10 does not bring any major changes or improvements
    over JDK 9 but it does act as the first release in the new, six-monthly release
    cadence announced by Oracle. Slated to be just short-term release, the public
    updates for JDK 10 will end in 6 months. The next version JDK 11 is scheduled
    for release in September 2020 and it will be a long-term support (LTS) version
    of Java.


    Listed below are the new features and enhancements in Java SE 10:


    Application Data-Class Sharing (CDS): This JDK Enhancement Proposal (JEP) is an
    extension to the existing CDS feature which allows you to store the application
    classes into a shared archive to improve startup.


    Parallel Full GC for A full parallel GC improves the worst-case latencies of the
    F1 garbage collector.


    Garbage Collector Interface: JDK 10 introduces the garbage collector (GC) interface
    to improve the source code isolation of different garbage collectors.'
