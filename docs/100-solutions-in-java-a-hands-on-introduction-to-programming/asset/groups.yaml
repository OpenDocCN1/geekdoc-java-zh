  - '[PAGE 73]


    The package statement: A package in Java is similar to a namespace where classes
    of similar functionalities are saved. The package keyword is used to indicate
    that the succeeding text is the name of a package to which the class belongs.
    In Java, a class is always within a package. If no package is specified, the class
    belongs to the default package. Examples of built-in packages are java.swing,
    java.io, etc. The classes related to GUI are stored in the java.swing package
    and those related to the input/output functionality are stored in java.io package
    and so on.


    The import statement: The import statement is used to include external packages
    and classes in a Java class. In order to use classes from another package, they
    must be imported by using the import keyword. However, some packages are included
    by default in a Java program, namely, java.lang. These need not be explicitly
    imported for using the classes of these packages. Further, it is not required
    to import classes that are in the same package or classes that are used with the
    fully qualified name of their package. For example, java.io.File fi = new java.io.File("myfile");


    The class declaration statement: A Java class declaration is identified by the
    class keyword followed by the name of the class. The use of the public keyword
    indicates the visibility of the class to other classes within and outside a package.


    Variables in a Java program represent the attributes of the entity and are also
    referred to as fields. Instance variables are those for which the instance or
    object of a class has its own copy of that variable.'
- md: "\nMethods in a Java program represent the behavior or functions to be performed\
    \ by an object. Instance methods can be invoked by creating an object of a class.\n\
    \nConstructors in a Java program are special methods with the same name as the\
    \ name of the class. They are invoked during the creation of an object and are\
    \ generally used to initialize the data members of a class.\n\nTo create a Java\
    \ program, any text editor such as Notepad can be used. The basic steps to create\
    \ the Java program are as follows:\n\n- Create a class and save it with the .java\
    \ extension.\n- Compile the file.\n- Build and execute the Java program.\n\nThe\
    \ following code demonstrates a simple Hello World program in Java. It is written\
    \ in the Notepad text editor of Windows OS:\n\n```\npublic class Hello {\n   \
    \ public static void main(String[] args) {\n        System.out.println(\"Hello\
    \ World!\");\n    }\n}\n```\n\nThe class declaration is composed of an access\
    \ modifier, class keyword, and name of the class followed by the curly braces,\
    \ {}.\n\nJava is a tightly encapsulated language; hence, nothing can be placed\
    \ outside the class. In the example, the name of the class is Hello. Within the\
    \ class is the main() method which is the entry point of the application, that\
    \ is, the execution of every Java program begins by invoking the main() method.\n\
    \n## Syntax:\n\n```\npublic static void main(String[] args) {\n// code statements\n\
    }\n```\n\nHere is a brief description of the important keywords in the program:\n\
    \n- public Enables the JVM to access the main() method.\n- static Allows you to\
    \ access a method of a class without creating an instance of the class.\n- void\
    \ Indicates the data type of the value returned by the main() method. Data type\
    \ void means the method will not return any value.\n- String args stores the arguments\
    \ passed at the command line.\n\nThe String class is a built-in Java class and\
    \ data type that allows a variable to store a group of characters.\n\nWithin the\
    \ main() method, the actual functionality of the program is specified by using\
    \ the System.out.println() statement.\n\nThe println() method takes a String argument\
    \ and displays it on the console. The System class is a predefined class in Java\
    \ that allows access to system resources such as a console. The keyword out represents\
    \ the output stream connected to the console.\n\nSave the file as Hello.java.\
    \ To save the Hello.java program, click on File > Save As in Notepad and enter\
    \ Hello.java in the File name box. The quotation marks avoid saving the file with\
    \ the extension HelloWorld.java.txt.\n\n## 1.11 Java code compilation and execution\n\
    \nA Java program file with the extension .java is converted into a bytecode file\
    \ with the .class extension using the javac compiler. The resulting .class file\
    \ can then be executed on any platform that has its appropriate JVM as shown in\
    \ the following figure:\n\n![](img/70651ebceef5c0cb89ccc7cad7a12eef_77_0.png)\n\
    \n**Figure 1.15:** Java code compilation\n\nThe following figure shows the task\
    \ of the JRE during code execution:\n\n![](img/70651ebceef5c0cb89ccc7cad7a12eef_78_0.png)\n\
    \nThe file generated by the compiler is not dependent on the hardware or software\
    \ platform of the target system. The file that contains the main class is passed\
    \ to the JVM. Within the JVM, the file passes through certain components which\
    \ are as follows:\n\n**Class Loader:** Once the main class is loaded in the memory\
    \ by the JVM, the other classes referenced in the program are loaded through the\
    \ class loader.\n\n**Bytecode:** The bytecode of the loaded class is checked by\
    \ the bytecode verifier for the presence of any damaged instructions. The checks\
    \ performed by the bytecode verifier are as follows:\n\n- Initialization of variables\
    \ before usage.\n- Method calls and types of object references should match.\n\
    - There is no violation of the rules for accessing private data and methods.\n\
    - Access to a local variable is within the runtime stack.\n- There should not\
    \ be any run-time stack overflow.\n\nIf any of the above checks fail, the verifier\
    \ does not allow the class to be loaded. Next, the bytecode is executed by the\
    \ interpreter.\n\n**Just-In-Time (JIT) Compiler:** Java 2.0 onwards, the JIT compiler\
    \ was included at runtime to enhance the speed of execution. The job of the JIT\
    \ compiler is to convert the bytecode to native code or platform-specific code\
    \ to increase the performance.\n\n## 1.12 Creating and executing a Java program\
    \ using JDK 8\n\nIn JDK 8 and earlier versions, compile the source file Hello.java\
    \ by using the built-in javac.exe compiler as shown in the following screenshot:\n\
    \n```\nC:\\WINDOWS\\system32\\cmd.exe\nMicrosoft Windows [Version 10.0.17134.112]\n\
    (c) 2018 Microsoft Corporation. All rights reserved.\nC:\\Users\\Admin32>set path=\"\
    C:\\Program Files\\Java\\jdk1.8.0_45\\bin\"\nC:\\Users\\Admin32:F:\nF:\\>cd pkg1\n\
    F:\\pkg1>javac Hello.java\nF:\\pkg1>\n```\n\nFigure 1.17: Compiling Java code\
    \ with the javac compiler\n\nFirst, move to the folder where the Hello.java file\
    \ is saved and then execute the javac command. The command will generate a file\
    \ named Hello.class in the current directory which will be used for execution\
    \ by the runtime.\n\nThe path is set to JDK 8 version's bin folder.\n\nThe dir\
    \ command in the current directory to view the file generated by the javac:\n\n\
    ```\nF:\\pkg1>dir\nVolume in drive F is New Volume\nVolume Serial Number is 30A1-25D\n\
    \nDirectory of F:\\pkg1\n14-06-2018  17:40  <DIR> .\n14-06-2018  17:40  <DIR>\
    \ .\n14-06-2018  17:40               416 Hello.class\n14-06-2018  17:40      \
    \              120 Hello.java\n14-06-2018  17:35                2 File(s)    \
    \     536 bytes\n                               2 Dir(s)         368,896,656 bytes\n\
    ```\n\nThe files allows write once, run anywhere to be possible for Java codes.\
    \ Now, use the Java interpreter java.exe to interpret and convert the bytecode\
    \ to machine code and execute the program. The java command takes the class file\
    \ name as an argument for execution.\n\nThe following screenshot shows the execution\
    \ of the Hello.class by the java command:\n\n```\nC:\\WINDOWS\\system32\\cmd.exe\n\
    F:\\>cd pkg1\nF:\\pkg1>javac Hello.java\nF:\\pkg1>dir\nVolume in drive F is New\
    \ Volume\nVolume Serial Number is 30A1-25D\n\nDirectory of F:\\pkg1\n14-06-2018\
    \  17:40  <DIR> .\n14-06-2018  17:40  <DIR> .\n14-06-2018  17:40             \
    \  416 Hello.class\n14-06-2018  17:40                    120 Hello.java\n14-06-2018\
    \  17:35                2 File(s)         536 bytes\n                        \
    \       2 Dir(s)         368,896,656 bytes\nF:\\pkg1>java Hello\nHello World!\n\
    ```\n\nFigure 1.19: Java Code Executed with the java Command\n"
  mdcn: "\nJava 程序中的方法代表了对象要执行的行为或功能。实例方法可以通过创建类的对象来调用。\n\nJava 程序中的构造函数是与类名同名的特殊方法。它们在创建对象期间被调用，通常用于初始化类的数据成员。\n\
    \n要创建一个 Java 程序，可以使用任何文本编辑器（如记事本）。创建 Java 程序的基本步骤如下：\n\n-   创建一个类并将其以 `.java`\
    \ 扩展名保存。\n-   编译该文件。\n-   构建并执行 Java 程序。\n\n下面的代码演示了一个简单的 Java Hello World 程序。它是在\
    \ Windows 系统的记事本编辑器中编写的：\n\n```\npublic class Hello {\n    public static void\
    \ main(String[] args) {\n        System.out.println(\"Hello World!\");\n    }\n\
    }\n```\n\n类声明由访问修饰符、类关键字和类名组成，后面跟着大括号 `{}`。\n\nJava 是一种封装非常严格的语言；因此，没有任何内容可以放在类之外。在示例中，类名为\
    \ Hello。类内部是 `main()` 方法，它是程序的入口点，也就是说，每个 Java 程序的执行都是通过调用 `main()` 方法开始的。\n\n\
    ## 语法：\n\n```\npublic static void main(String[] args) {\n// 代码语句\n}\n```\n\n以下是程序中重要关键字的简要描述：\n\
    \n-   `public` 允许 JVM 访问 `main()` 方法。\n-   `static` 允许你在不创建类实例的情况下访问类的方法。\n- \
    \  `void` 表明 `main()` 方法返回的值的数据类型。`void` 类型意味着该方法不返回任何值。\n-   `String args` 存储在命令行传递的参数。\n\
    \n`String` 类是 Java 内置的类和数据类型，允许变量存储一组字符。\n\n在 `main()` 方法中，通过使用 `System.out.println()`\
    \ 语句来指定程序的实际功能。\n\n`println()` 方法接收一个 `String` 参数并将其显示在控制台上。`System` 类是 Java 中的一个预定义类，允许访问控制台等系统资源。关键字\
    \ `out` 代表连接到控制台的输出流。\n\n将文件保存为 `Hello.java`。要保存 `Hello.java` 程序，在记事本中点击“文件 >\
    \ 另存为”，并在文件名框中输入 `Hello.java`。引号可以避免将文件保存为带有扩展名的 `HelloWorld.java.txt`。\n\n##\
    \ 1.11 Java 代码的编译与执行\n\n扩展名为 `.java` 的 Java 程序文件通过使用 `javac` 编译器转换为具有 `.class`\
    \ 扩展名的字节码文件。生成的 `.class` 文件可以在任何具有相应 JVM 的平台上执行，如下图所示：\n\n![](img/70651ebceef5c0cb89ccc7cad7a12eef_77_0.png)\n\
    \n**图 1.15：** Java 代码编译\n\n接下来的图显示了 JRE 在代码执行期间的任务：\n\n![](img/70651ebceef5c0cb89ccc7cad7a12eef_78_0.png)\n\
    \n由编译器生成的文件不依赖于目标系统的硬件或软件平台。包含主类的文件被传递给 JVM。在 JVM 内部，文件会通过以下组件：\n\n**类加载器 (Class\
    \ Loader)：** 一旦主类被 JVM 加载到内存中，程序引用的其他类将通过类加载器加载。\n\n**字节码 (Bytecode)：** 加载的类的字节码由字节码验证器检查以确认是否存在任何损坏的指令。字节码验证器执行的检查如下：\n\
    \n-   使用前的变量初始化。\n-   方法调用和对象引用的类型应当匹配。\n-   没有违反访问私有数据和方法的规则。\n-   对局部变量的访问在运行时栈范围内。\n\
    -   不应出现任何运行时栈溢出。\n\n如果上述任何检查失败，验证器将不允许加载该类。接下来，字节码将由解释器执行。\n\n**即时编译 (JIT) Compiler：**\
    \ 从 Java 2.0 开始，运行时包含了 JIT 编译器以提高执行速度。JIT 编译器的工作是将字节码转换为本地代码或特定平台的代码以提高性能。\n\n\
    ## 1.12 使用 JDK 8 创建并执行 Java 程序\n\n在 JDK 8 及更早版本中，使用内置的 `javac.exe` 编译器来编译源文件 `Hello.java`，如下所示的截图所示：\n\
    \n```\nC:\\WINDOWS\\system32\\cmd.exe\nMicrosoft Windows [Version 10.0.17134.112]\n\
    (c) 2018 Microsoft Corporation. All rights reserved.\nC:\\Users\\Admin32>set path=\"\
    C:\\Program Files\\Java\\jdk1.8.0_45\\bin\"\nC:\\Users\\Admin32:F:\nF:\\>cd pkg1\n\
    F:\\pkg1>javac Hello.java\nF:\\pkg1>\n```\n\n图 1.17：使用 javac 编译器编译 Java 代码\n\n\
    首先，移动到保存 `Hello.java` 文件的文件夹，然后执行 `javac` 命令。该命令将在当前目录生成一个名为 `Hello.class` 的文件，该文件将被运行时执行。\n\
    \n路径设置为 JDK 8 版本的 `bin` 文件夹。\n\n在当前目录中使用 `dir` 命令查看由 `javac` 生成的文件：\n\n```\nF:\\\
    pkg1>dir\nVolume in drive F is New Volume\nVolume Serial Number is 30A1-25D\n\n\
    Directory of F:\\pkg1\n14-06-2018  17:40  <DIR> .\n14-06-2018  17:40  <DIR> .\n\
    14-06-2018  17:40               416 Hello.class\n14-06-2018  17:40           \
    \         120 Hello.java\n14-06-2018  17:35                2 File(s)         536\
    \ bytes\n                               2 Dir(s)         368,896,656 bytes\n```\n\
    \n这些文件使得 Java 代码能够“编写一次，到处运行”。现在，使用 Java 解释器 `java.exe` 来并将字节码转换为机器码并执行程序。`java`\
    \ 命令接收类文件名作为执行参数。\n\n下面的截图显示了通过 `java` 命令执行 `Hello.class`：\n\n```\nC:\\WINDOWS\\\
