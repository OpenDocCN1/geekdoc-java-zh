- md: "\n## 1.4 Java SE platform components\n\nThe two important Java SE platform\
    \ components are Java Runtime Environment (JRE) and Java Development Kit (JDK).\
    \ The JRE contains all the Java libraries required to execute a Java program whereas\
    \ the JDK contains the libraries required to develop Java programs and is distributed\
    \ for different platforms like Windows, MacOS, Linux, etc. The JDK comprises the\
    \ tools required for application development, compilation, debugging, etc. It\
    \ also has its own JRE to execute and test Java applications. The following image\
    \ shows the different Java SE platform components:\n\n![](img/70651ebceef5c0cb89ccc7cad7a12eef_45_0.png)\n\
    \n**Figure 1.4: The tools and libraries**\n\nThe brief descriptions of the tools\
    \ and libraries are given below:\n\n- Development Tools and APIs: The tools and\
    \ utilities form the base for Java development. The development tools include\
    \ the javac compiler, Java launcher, a Javadoc documentation tool, etc. The Java\
    \ APIs are ready-to-use classes and interfaces for different functionalities such\
    \ as networking, XML parsing, GUI creation, database manipulation, and many more.\n\
    \n- Deployment Tools: The JDK provides software for deploying applications on\
    \ target machines. Java Web Start and Java Plug-In are examples of deployment\
    \ tools.\n\n- User Interface Toolkits: The JDK comes bundled with UI toolkits\
    \ such as Swing, Java2D, and Abstract Window Toolkit (AWT) for the development\
    \ of graphical user interfaces in Java applications.\n\n- Integration Libraries:\
    \ Integration libraries such as Java Database Connectivity (JDBC), Java Naming\
    \ and Directory Interface (JNDI), etc. provide access to databases and remote\
    \ objects for data manipulation and network access.\n\n- Other Base Libraries:\
    \ These libraries include APIs for file manipulation, networking, XML parsing,\
    \ security, internationalization, and so on.\n\n- Language and Utility Libraries:\
    \ These libraries include Math, Collections, Logging, Regular Expressions, etc.\
    \ that allow you to perform manipulation of data in a Java program.\n\n## 1.5\
    \ Java SE version history\n\nThe Java Standard Edition (Java SE) is a platform\
    \ for the development of robust, reliable, and secure applications with the development\
    \ tools, APIs, utilities, and runtime environment provided by the Java Development\
    \ Kit. The JDK has undergone several modifications over the years with some major\
    \ enhancements and new features added with every new release. The following table\
    \ lists the different releases of JDK with the corresponding features and enhancements:\n\
    \n| Version | Features | Enhancements |\n| :--- | :--- | :--- |\n| Java 1.0 |\
    \ | |\n| Java 1.1 | | |\n| Java 1.2 | | |\n| Java 1.3 | | |\n| Java 1.4 | | |\n\
    | Java 5 | | |\n| Java 6 | | |\n| Java 7 | | |\n| Java 8 | | |\n| Java 9 | | |\n\
    | Java 10 | | |\n\nTable 1.1: Versions of Java\n\n## 1.6 Features of Java SE 9\
    \ and Java SE 10\n\nThe release, Java 8, was full of various new features that\
    \ had made a significant impact on application development with Java. Until JDK\
    \ 8, every JRE had all the classes for the runtime bundled into a single Java\
    \ Archive (JAR) called rt.jar that was present in the lib directory. This led\
    \ to a large number of unnecessary classes getting to the runtime leading to overhead\
    \ for the JVM. Thus, the JAR becomes bulky in size and the execution environment\
    \ is forced to deal with all the classes whether or not they are used.\n\nBut\
    \ Java SE 9 comes with more versatility and customization and a hoard of new features.\
    \ The most important of them is the Jigsaw project which applies the new module\
    \ system to break the JRE into reusable and interoperable components. The programming\
    \ code is divided into modules that contain the tasks to be executed. This makes\
    \ programs reusable and easier to manage.\n\nAnother advantage of modularity is\
    \ that it makes the Java platform more lightweight and scalable so that programs\
    \ can run on smaller devices with fewer resources. The modular JRE can be used\
    \ even with embedded systems.\n\n- Java Platform Module System (JPMS): This is\
    \ the most important feature of Java SE 9. The important issues encountered with\
    \ the growing codebase of a system are:\n    - Difficulty to encapsulate code\n\
    \    - Lack of clarity of dependencies among the various aspects (JARs)\n    -\
    \ Easy access of public classes on the classpath leading to injicious usage\n\
    \    - Lack of surety about the availability of all required JARs\n\nAll these\
    \ issues are addressed by the module system by using a module descriptor within\
    \ the modular JARs. In this file, a module can define the list of all other modules\
    \ on which it is dependent by using the requires statements. Further, to make\
    \ packages of a module accessible to other modules, the exports keyword is used.\
    \ If the exports keyword is not used with a package, it is encapsulated in that\
    \ module by default as shown in the following image:\n\n| mod1 | requires | mod2\
    \ |\n|---|---|---|\n| com.mod1 | | com.mod2 |\n| com.mod1.pkg1 com.mod1.pkg2 |\
    \ | com.mod2.pkg3 com.mod2.pkg4 |\n\n**Figure 1.5:** Module dependencies\n\nNote\
    \ that module mod1 requires the module Both modules have packages that are encapsulated\
    \ (as indicated by the shield symbol) as they are not exported. Programmatically,\
    \ this can be depicted as shown below:\n\n```\nmodule mod1 {\nexports com.mod1;\n\
