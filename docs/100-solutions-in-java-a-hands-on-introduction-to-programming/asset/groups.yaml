  mdcn: "\n\n## 5.4 接口\n\n接口（interface）是一种契约，规定了实现它的类型必须遵循的标准。它是实现多重继承的一种变通方法。接口也是一个与接口同名的\
    \ .java 文件。接口的字节码也会像普通类一样被转换为 .class 文件。\n\n然而，与类不同，接口不能有构造函数，因此无法实例化。接口的方法是隐式抽象的。接口的字段必须是静态的（static）且最终的（final），不能有实例字段。接口不是被扩展的而是被类实现的。一个类可以实现多个接口。一个接口可以扩展多个接口。\n\
