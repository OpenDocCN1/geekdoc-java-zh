    \ 在方括号 `[]` 中声明大小为 5。因此，它最多可以容纳 5 个值。要访问任何值，使用数组名称加上相应的索引。例如，访问该值的语法是 `score[index]`。注意最后一个索引是\
    \ 4。因此，尝试访问 `score[5]` 将抛出错误/异常。\n\n在 Java 中创建一维数组，必须对其进行声明、实例化和初始化。\n\n**声明语法：**\n\
    \n```java\ndatatype[] name;\n```\n\n**实例化语法：**\n\n```java\nname = new datatype[size];\n\
    ```\n\n**初始化：**\n\n数组可以通过两种方式初始化： \n\n- 在声明期间：\n\n```java\nint[] score = {40,\
    \ 56, 76, 60, 85};\n```\n\n注意，在在创建时初始化数组时不指定大小，也不需要使用 `new` 运算符。\n\n- 在声明和实例化之后：\n\
    \n```java\nint[] score = new int[5];\nscore[0] = 40;\nscore[1] = 56;\nscore[2]\
    \ = 76;\nscore[3] = 60;\nscore[4] = 85;\n```\n\n以下示例展示了一维数组的用法：\n\n```java\npublic\
    \ class OneDimenArray {\n    int score[]; // 声明数组\n\n    public OneDimenArray()\
