    \ + msg.toLowerCase());\nString msg1 = \" Hello\";\nSystem.out.println(\"String\
    \ before trimming: \" + msg1);\nSystem.out.println(\"String after trimming:\"\
    \ + msg1.trim());\n```\n\n```java\npublic static void main(String[] args) {\n\
    \  StringDemo obj = new StringDemo();\n  obj.display();\n}\n```\n\n该代码打印了应用于 String\
    \ 的不同 String 类方法的输出。代码的输出结果如下方的所示：\n\n| Length of string is 5 |\n| New string\
    \ after concatenation is HelloWorld |\n| Extracted substring is llo |\n| String\
