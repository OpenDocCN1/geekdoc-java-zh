    # 5.4_Interfaces


    An interface is a contract that sets the standards to be followed by the types
    that implement it. It is a workaround for implementing multiple inheritance. An
    interface is also a .java file saved with the same name as that of the interface.
    The bytecode of an interface is also converted to .class file similar to normal
    classes.


    However, unlike classes, interfaces cannot have constructors and hence, cannot
    be instantiated. Methods of an interface are implicitly abstract. Fields of an
    interface must be static and final, and it cannot have instance fields. The interface
    is not extended but implemented by classes. A class can implement multiple interfaces.
    An interface can extend multiple interfaces.


    Until Java SE 7, interfaces supported only method declarations, that is, methods
    without a body. However, with Java SE 8, default methods were introduced and in
    Java 9, private methods have been introduced.


    Interfaces are not used for implementing inheritance hierarchy. Rather, they are
    used to group common methods that can be implemented by different entities as
    per requirement, even if they are not a type of the interface. As a naming convention,
    the letter I is generally prefixed with the name of interfaces to differentiate
    the interface .java files from the class .java files. Interface names'
  - '[PAGE 362]


