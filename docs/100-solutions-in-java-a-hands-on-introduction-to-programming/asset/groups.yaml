    \ to the object, and its reference is stored in objCalc variable.\n\n# 3.2 Access\
    \ specifiers\n\nIn Java, apart from encapsulating the data members, further restriction\
    \ on access can be provided by access specifiers. When no access specifier is\
    \ mentioned for a class, the default accessibility is package. The access specifiers\
    \ supported by Java are as follows:\n\nThe public specifier makes a field, method,\
