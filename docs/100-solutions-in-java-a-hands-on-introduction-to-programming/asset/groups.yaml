    The statements that may throw an exception are enclosed within the try block.
    To handle the exception(s), the appropriate catch block is provided with the exception
    type object as a parameter. The catch block can be in the same method or anywhere
    higher in the method call stack.


    To handle multiple types of exceptions, a try block can be followed by more than
    one catch block for each specific type of exception.


    # Syntax:


    ```

    try

    {...}

    catch ()

    {...}

    catch ()

    {...}

    ```


    To ensure that some important statements can be executed even if an exception
    occurs, Java provides the finally block. The finally block is always executed
    irrespective of whether an exception occurs or not. It is mainly used to execute
    cleanup code such as closing database connections, file streams, etc. to avoid
    resource leaks.


