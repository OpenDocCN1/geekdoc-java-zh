    ## 5.4.3 默认方法的问题\n\n一个类可以实现多个接口，每个接口可以有不同的默认方法。然而，如果每个接口包含相同名称和签名的默认方法，代码将无法编译并抛出以下错误：\n\
    \n```java\njava: class ClassWithTwoInterfaces inherits unrelated defaults for\
    \ defaultMethod() from types Interface1 and Interface2\n```\n\n这是因为编译器无法确定应该使用哪个默认方法。要解决这个问题，类可以提供该默认方法的实现，从而消除歧义。此外，类可以使用\
    \ `super` 关键字重写接口的默认方法。这在只实现了一个接口时也适用。\n\n例如：\n\n```java\npublic class ClassWithTwoInterfaces\
    \ implements Interface1, Interface2 {\n  @Override\n  public void abstractMethod()\
    \ {\n    // 某些实现\n  }\n  @Override\n  public void defaultMethod() {\n    // 调用接口的\
    \ defaultMethod()\n    Interface1.super.defaultMethod();\n    Interface2.super.defaultMethod();\n\
    \  }\n}\n```\n\n现在，接口可以扩展另一个接口。如果两者都包含相同的默认方法，编译器将考虑继承树中靠下的子接口的实现。\n\n例如：\n\n\
    ```java\npublic interface Interface1 {\n  default void defaultMethod() {\n   \
    \ System.out.println(\"Hello from parent Interface1\");\n  }\n}\n\npublic interface\
    \ IChildInterface extends Interface1 {\n  default void defaultMethod() {\n   \
    \ System.out.println(\"Hello from IChildInterface\");\n  }\n}\n```\n\n在这里，父接口和子接口都有默认方法。当类实现子接口时，调用\
    \ `defaultMethod()` 将输出：\n\n# Hello from IChildInterface\n\n这意味着编译器调用了子接口的 defaultMethod。\n\
    \n## 5.5 Java 函数式接口\n\n只有一个抽象方法的接口被称为函数式接口。`@FunctionalInterface` 注解已添加到 Java\
    \ 中，用于标记接口为函数式接口。并不是强制使用该注解，但作为最佳实践建议使用，以避免意外添加额外的方法。如果在标记了 `@FunctionalInterface`\
