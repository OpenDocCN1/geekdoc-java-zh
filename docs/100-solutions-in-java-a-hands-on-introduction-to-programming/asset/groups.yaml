    # 2.5 Literals and escape sequences


    The values assigned to variables are called literals. Here are the different types
    of literals assigned to variables of the corresponding type:


    Integer Integer literals can be any whole numbers. Decimal values with base 10
    from o to 9, such as 40, binary values with base 2, that is o and 1, such as oc1001,
    hexadecimal values with base 16, that is, numbers o to 9 and letters A to F, such
    as ox1d.


    Floating-point Floating-point literals are numbers with fractional components
    such as 2.9, 2.11, etc. The use of E or e at the end of the number indicates exponentiation.
    For example, 8.37E6, e+394, etc.


    With Java SE 7, the support for the underscore (_) character in numeric literals
    was added to improve the readability of large data. However, a number cannot begin
    or end with an underscore. An underscore cannot be placed beside the decimal point
    in a floatingpoint number, before a suffix, L or F, before or after binary/hexadecimal
    symbols like b or x. Examples of valid use of underscore are 9449_3848_3948_2944L,
    2.43_37F, ob11010111_11100100_00010111. Examples of invalid use of underscores
    are _3837, 2._43_37F, ox83.'
