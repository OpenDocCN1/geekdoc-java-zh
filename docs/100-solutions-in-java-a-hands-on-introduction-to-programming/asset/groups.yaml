    \n为了连接字符串，Java 提供了加法运算符 `+`。例如：\n\n```java\nString msg = \"Hello\";\nString msg1\
    \ = \"World\";\nSystem.out.println(msg + msg1);\n```\n\n可以将字符数组转换为字符串，如下：\n\n\
    ```java\nchar[] msg = {'H', 'e', 'l', 'l', 'o'};\nString message = new String(msg);\n\
    ```\n\nString 类提供了几个方法用于字符串处理。\n下表列出了 String 类常用的方法。考虑以下字符串：\n\n| 方法 | 描述 |\n\
    |---|---|\n| | |\n| | |\n\n**表 4.1：** String 类的方法\n\n下面的示例展示了不同 String 类方法的用法：\n\
    \n```java\npublic class StringDemo {\n  String msg = \"Hello\";\n  Integer num\
    \ = 6;\n  public void display() {\n    System.out.println(\"Length of string is\
    \ \" + msg.length());\n    System.out.println(\"New string after concatenation\
    \ is \" + msg.concat(\"World\"));\n    System.out.println(\"Extracted substring\
    \ is \" + msg.substring(2, 5));\n    System.out.println(\"String format of Integer\
    \ is \" + num.toString());\n    System.out.println(\"Difference after comparison\
    \ is \" + msg.compareTo(\"World\"));\n  }\n}\n```\n\n```java\nSystem.out.println(\"\
    Character at index 1 is: \" + msg.charAt(2));\nSystem.out.println(\"First index\
    \ of character l is: \" + msg.indexOf(\"l\"));\nSystem.out.println(\"Last index\
