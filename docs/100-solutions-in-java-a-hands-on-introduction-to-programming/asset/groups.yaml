    \n```\nprivate int count;\n```\n\nInstance methods are used to perform operations\
    \ on the instance variables. Syntax:\n\n```\n([.]) {\n// Method definition\n}\n\
    ```\n\nFor example:\n\n```java\npublic void add(int a, int b){\nSystem.out.println(\"\
    Sum of a and b is \"+ (a+b));\n}\n```\n\nHere, the add method is a public method\
    \ and returns nothing, indicated by void. It takes two parameters of type integer.\
    \ Within the method body, a print statement displays the sum of the parameters\
    \ whose values will be specified by the user at runtime during method invocation.\
    \ Naming conventions for a method name are listed as follows:\n\n- Java keywords\
    \ cannot be used for the method name.\n- Method names cannot contain spaces and\
    \ cannot begin with a digit.\n- The method name should be a simple and meaningful\
    \ verb that describes its function.\n- The method name can begin with a letter,\
    \ underscore or dollar symbol.\n- A multi-word method name should have the first\
    \ word in lowercase and succeeding words with the first letter capitalized, for\
    \ example.\n\nTo access instance variables and methods from a class, an object\
    \ of the class must be created within the main() method. The methods must be invoked\
    \ by using the object name followed by the dot (.) operator and the method name.\
    \ In Java, a method is always invoked/called from within another method called\
    \ the calling method. Once all statements of the called methods are executed,\
    \ the control is returned to the calling method. Generally, all methods are invoked\
    \ from the main() method of a class. The main() method is the execution point\
    \ of the program.\n\nThe following figure shows the class diagram of the class\
