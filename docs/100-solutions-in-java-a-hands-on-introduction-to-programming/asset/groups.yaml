    \nFigure 1.12: JDK 8 and JDK 10 Installation Folder Structure\n\nThe following\
    \ table provides a brief description of the common directories of a typical JDK\
    \ 8 installation:\n"
  mdcn: "\n使用 Java 9 提供的新 `jlink` 工具，模块化的 JDK 以及包含显式依赖关系的模块描述符文件使得创建这种精简的运行时环境成为可能。因此，你可以创建一个精简且优化的运行时环境，并避免臃大的\
    \ JDK 安装。\n\nJShell 是 JDK 9 的一种全新的读取-评估-打印循环（REPL）交互式终端。你可以从控制台启动 jshell，并直接在其中输入并执行代码。当执行代码时，它会提供即时反馈，允许你尝试和探索新的\
    \ API 和语言特性。你还可以使用交互式外壳在 Java 中测试正则表达式。\n\n增强后的 Javadoc 现在在 API 文档中提供了内置搜索功能。此外，新的\
    \ Javadoc 符合 HTML5 标准，并且每个页面都包含有关类或接口所属的 JDK 模块的信息。\n\nJava SE 9 集合工厂引入了一项新功能，为\
    \ `List`、`Set` 等集合提供了工厂方法。这有助于开发者通过一条语句快速填充集合集合，而无需使用多个 `add` 调用。例如：\n\n```\n\
    Set set1 = Set.of(3,4,5);\n```\n\n这些集合是不可变的，也就是说，创建后无法向这些集合添加项，否则将抛出 `UnsupportedOperationException`\
    \ 异常。使用工厂方法使代码更短，并避免了特定集合类型的实现。\n\nStream API 的增强：Java SE 9 通过允许对集合进行声明式的转换流水线，为\
    \ Streams API 添加了更多功能。它在 `Stream` 接口中添加了新方法，即 `dropWhile`、`takeWhile`，并提供了 `iterate`\
    \ 方法的重载版本以提供用于迭代的表达式。如下例所示：\n\n```\nIntStream.iterate(1, num -> num < 10, num\
    \ -> num + 1).forEach(System.out.println);\n```\n\n第二个参数中的 lambda 表达式在 `num` 变为\
    \ 10 之前返回 true，并打印从 1 到 99 的整数。\n\n此外，可以将 `Optional` 对象转换为 `Stream` 对象。\n\n```\n\
    Stream num = Optional.of(1).stream();\n```\n\n私有接口方法：Java SE 8 引入了接口默认方法的概念。但接口当时只有方法签名，没有任何实现。在\
    \ Java SE 9 中，接口也可以拥有具有行为的方法以及私有辅助方法，用于实现可以从多个默认方法调用的共享代码。如下代码所示：\n\n```\npublic\
    \ interface Interface {\n    void interfaceMethodWithOnlySignature();\n    default\
    \ void interfaceDefaultMethod() {initProcess();}\n    default void interfaceDefaultMethod1()\
    \ {initProcess();}\n    // 不属于 Interface 暴露的公共 API 的私有方法\n    private void initProcess()\
    \ {\n        System.out.println(\"Initializing the Process\");\n    }\n}\n```\n\
    \n因此，私有接口方法可以帮助构建默认方法的 API 实现。\n\nJava 9 引入了使用 `HttpClient` API 执行 HTTP 调的新方法，以取代旧的\
    \ `HttpClientConnection` API，后者同时也支持 WebSockets 和 HTTP/2：\n\n```\nHttpClient client\
    \ = HttpClient.newHttpClient();\n```\n\n多版本 Java SE 9 引入了多版本 JAR（multi-release\
    \ JARS）特性，解决了为了向兼容而保留弃用库导致的臃肿 JAR 问题。此功能允许你创建类的备用版本，这些版本仅当库运行在特定的 Java 版本时才会被使用。\n\
    \n如下图所示：\n\n![](img/70651ebceef5c0cb89ccc7cad7a12eef_56_0.png)\n\n# 图 1.6：多版本\
    \ JAR\n\n上面的图像显示了一个 multirelease.jar 文件，其顶层有一个 Helper 类，还有一个 Java 9 特有的版本。这表明在与\
    \ Java 9 工作时，将使用 `META-INF/versions/9` 文件夹下的类，它可以使用 Java 9 的特性和库。然而，该 JAR 也适用于更早的版本，在这种情况下，将使用顶层的\
    \ Helper 类。\n\n## Java SE 10 的特性\n\nJDK 10 遵循 JDK 9 的模块模型，并对 JDK 9 的特性和功能进行了增强。JDK\
    \ 10 相比 JDK 9 没有引入任何重大变化或改进，但它是 Oracle 宣布的全新每六个月一次发布周期中的第一个版本。由于计划仅作为短期发布，JDK\
    \ 10 的公共更新将在 6 个月后结束。下一个版本 JDK 11 计划于 2020 年 9 月发布，它将是 Java 的长期支持（LTS）版本。\n\n\
    以下列出了 Java SE 10 中的新功能和增强：\n\n-   应用数据类共享 (CDS)：此 JDK 增强提案 (JEP) 是现有 CDS 特性的扩展，允许你将应用类存储到共享归档中以提高启动。\n\
    -   并行全 GC：全并行 GC 改进了 F1 垃圾回收器最坏情况下的延迟。\n-   垃圾回收器接口：JDK 10 引入了垃圾回收器（GC）接口，以提高不同垃圾回收器的源码隔离。\n\
    -   将多个 JDK 仓库合并为单个仓库：合并此功能以简化和流线开发流程。\n-   局部变量类型推断：此增强允许你将类型推断扩展到带有初始化器的局部变量声明中。它还向\
    \ Java 引入了 `var`。\n-   线程回调：JDK 10 引入了在不执行全局 VM 安全点（safepoint）的情况下停止单个线程而非所有线程的可能（在线程中）。\n\
    -   基于时间的版本控制：为 Java SE 平台和 JDK 的版本字符串方案引入了新的基于时间的版本控制。\n-   其他特性：其他几个高级特性包括：\n\
    \    - 一组默认的根证书机构 (CA) 集合。\n    - 堆分配。\n    - 实验性的 Graal JIT 编译器。\n    - java.util\
    \ 相关的 API。\n    - 实施额外的 Unicode 扩展。\n"
