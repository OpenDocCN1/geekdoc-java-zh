- md: "\n## 6.8.4 ThreadGroup_class\n\nA thread in Java is the path followed when\
    \ executing a program. All Java programs have at least one thread which is the\
    \ main thread created by the JVM when the program starts and the main() method\
    \ is invoked with the main thread.\n\nA thread group represents a set of threads\
    \ and can also include other thread groups. In a thread group hierarchy, every\
    \ thread group except the initial thread group has a parent. A thread can access\
    \ information of only its own thread group and cannot access even its parent thread\
    \ group.\n\nHere are some methods of the ThreadGroup class:\n\n- int activeCount():\
    \ Returns the number of active threads in this thread group and its subgroups.\n\
    - int activeGroupCount(): Returns the number of active groups in this thread group\
    \ and its subgroups.\n- int getMaxPriority(): Returns the maximum priority of\
    \ this thread group.\n- String getName(): Returns the name of this thread group.\n\
    - ThreadGroup getParent(): Returns the parent of this thread group.\n- void interrupt():\
    \ Interrupts all threads in this thread group.\n- void destroy(): Destroys this\
    \ thread group and all its subgroups.\n- void checkAccess(): Determines if the\
    \ currently running thread has access to modify this thread group.\n- void list():\
    \ Prints information about this thread group to the standard output.\n- int enumerate(Thread[]\
    \ list): Copies every active thread in this thread group and its subgroups into\
    \ the specified array.\n- int enumerate(ThreadGroup[] list): Copies references\
    \ to every active subgroup in this thread group and its subgroups into the specified\
    \ array.\n- boolean isDaemon(): Verifies if this thread group is a daemon thread\
    \ group.\n- boolean isDestroyed(): Verifies if this thread group has been destroyed.\n\
    - boolean parentOf(ThreadGroup g): Verifies if this thread group is either the\
    \ thread group argument or one of its ancestor thread groups.\n- void setDaemon(boolean\
    \ daemon): Modifies the daemon status of this thread group.\n- void setMaxPriority(int\
    \ pri): Sets the maximum priority of the thread group.\n- String toString(): Returns\
    \ a string representation of this Thread group.\n\n## 6.8.5 System_class\n\nThe\
    \ System class provides several methods for accessing system properties, environment\
    \ variables, standard I/O and error streams, loading files/libraries, etc.\n\n\
    Here are some of the commonly used methods of the System class:\n\n- static void\
    \ arraycopy(Object src, int srcPos, Object dest, int destPos, int length): Copies\
    \ an array from the specified source array, starting at the source position, to\
    \ the destination position.\n- static long currentTimeMillis(): Returns the current\
    \ time in milliseconds.\n- static String getenv(String name): Fetches the value\
    \ of the specified environment variable.\n- static Properties getProperties():\
    \ Returns the current system properties.\n- static void exit(int status): Terminates\
    \ the currently running JVM.\n- static void gc(): Runs the garbage collector.\n\
    - static void loadLibrary(String libname): Loads the system library specified\
    \ by the libname argument.\n- static void setSecurityManager(SecurityManager s):\
    \ Sets the system security.\n\nThe following example shows the use of the System\
    \ class methods:\n\n```\npublic class SystemClassDemo {\n\n    static String str1[]\
    \ = {\"Mon\", \"Tue\", \"Wed\", \"Thu\"};\n    static String str2[] = {\"East\"\
    , \"West\", \"North\", \"South\"};\n\n    public static void main(String[] args)\
    \ {\n\n        System.out.println(\"Current time in milliseconds is: \" + \n \
    \       System.currentTimeMillis());\n        System.out.println(\"Value of Path\
    \ variable is: \" + \n        System.getenv(\"PATH\"));\n        System.arraycopy(str1,\
    \ 0, str2, 0, 3);\n        System.out.println(\"Copied array is: \");\n      \
    \  for (int i = 0; i < 4; i++) {\n            System.out.println(str2[i]);\n \
    \       }\n    }\n}\n```\n\nThe output of the code is shown in the following screenshot:\n\
    \n```\nCurrent time in milliseconds is: 1531903964804\nValue of Path variable\
    \ is: C:\\Program Files (x86)\nCopied array is:\nMon\nTue\nWed\nSouth\n```\n\n\
    Figure 6.8: System class methods\n\n## 6.8.6 Runtime class\n\nTo allow a Java\
    \ application to interact with the system environment, there is always a single\
    \ instance of the Runtime class. However, an application cannot create its own\
    \ instance of this class.\n\nHere are some of the commonly used methods of the\
    \ Runtime class:\n\n- static Runtime getRuntime(): Returns the runtime object\
    \ associated with the current Java application.\n- void loadLibrary(String libname):\
    \ Loads the dynamic library with the library specified in the argument.\n- long\
    \ maxMemory(): Returns the maximum amount of memory that the JVM may use.\n- int\
    \ availableProcessors(): Returns the number of processors available to the JVM.\n\
    - long freeMemory(): Returns the amount of free memory in the JVM.\n- long totalMemory():\
    \ Returns the total amount of memory in the JVM.\n- Process exec(String command):\
    \ Executes the string command specified in the argument in a separate process.\n\
    - void exit(int status): Terminates the currently running JVM by initiating its\
    \ shutdown sequence.\n- void halt(int status): Forcibly terminates the currently\
    \ running JVM.\n- void load(String filename): Loads the filename specified in\
    \ the argument as a dynamic library.\n- void gc(): Executes the garbage collector.\n\
    - void runFinalization(): Executes the finalization methods of any objects pending\
    \ finalization.\n\n## 6.9 Regular expressions\n\nRegular expressions are used\
    \ to manipulate text and data. They are commonly used to define constraints on\
    \ data.\n\n### 6.9.1 Pattern class\n\nAn instance of the Pattern class is a compiled\
    \ form of a regular expression. Pattern class does not have any public constructors\
    \ and hence, it cannot be instantiated. It provides overloaded static methods\
    \ to create different patterns. For example:\n\n```java\nimport java.util.regex.Pattern;\n\
    import java.util.regex.Matcher;\n\npublic class PatternDemo {\n    public static\
    \ void main(String[] args) {\n        Pattern pt = Pattern.compile(\"b.*\");\n\
    \        // create the Matcher object using the Pattern object\n        Matcher\
    \ mt = pt.matcher(\"bbbx\");\n        // check for a match\n        boolean result\
    \ = mt.matches();\n        System.out.println(\"Pattern Match: \"+result);\n \
    \   }\n}\n```\n\nThe matches() method of the Matcher class is used to verify if\
    \ the pattern specified by the Pattern matches the string. Note that the matches()\
    \ method is useful when a regular expression has to be used only once. This method\
    \ will compile an expression and match it against an input sequence in a single\
    \ invocation. The output of the code is as follows:\n\nPattern Match: true\n\n\
    Here are some methods of the Pattern class:\n\n- matches(): The Pattern class\
    \ also defines the matches(String, CharSequence) method to check whether a pattern\
    \ is present in a given input string. For example, the three lines of code used\
    \ in the previous example can be reduced to just one statement by using the matches()\
    \ method of the Pattern class as follows:\n\nboolean result = Pattern.matches(\"\
    b.*x\", \"bbbx\");\n\nThe matches() method of the Matcher class is less efficient\
    \ for repeated matches as it does not allow the compiled pattern to be reused.\
    \ Objects of the Pattern class are immutable and can be used safely by multiple\
    \ concurrent threads as instances of the Matcher class are not safe for such use.\n\
    \nAnother example of the matches() method of the Pattern class is shown as follows:\n\
    \nPattern.matches(\"\\\\d\",\"4\");\n\nHere, \\d indicates a single digit. The\
    \ method will return true because the digit 4 matches the regular expression \\\
    d. Since the backslash '\\\\' character has a special meaning in Java, it must\
    \ be used with the escape sequence '\\\\', that is, '\\\\d' while specifying a\
    \ pattern.\n\n- split(String): The split() method of the Pattern class is used\
    \ to extract text that lies on either side of the pattern being matched. The following\
    \ example shows the use of split() method:\n\n```java\nimport java.util.regex.Pattern;\n\
    public class SplitDemo {\n    private static final String REGEX = \":\";\n   \
    \ private static final String DIRECTION = \"East:West:North:South\";\n}\n```"
  mdcn: "\n\n## 6.8.4 ThreadGroup_class\n\nJava 中的线程是执行程序时遵循的路径。所有的 Java 程序都至少有一个线程，即\
    \ JVM 在程序启动时创建的主线程，且 `main()` 方法是由主线程调用的。\n\n线程组（ThreadGroup）代表了一组线程，也可以包含其他的线程组。在线程组的层级结构中，除了初始线程组外，每个线程组都有一个父节点。线程只能访问其所属线程组的信息，甚至无法访问其父线程组。\n\
    \n以下是 ThreadGroup 类的一些方法：\n\n- int activeCount(): 返回此线程组及其子线程组中活跃线程的数量。\n- int\
    \ activeGroupCount(): 返回此线程组及其子线程组中活跃线程组的数量。\n- int getMaxPriority(): 返回此线程组的最大优先级。\n\
    - String getName(): 返回该线程组的名字。\n- ThreadGroup getParent(): 返回该线程组的父分组。\n- void\
    \ interrupt(): 中断此线程组中的所有线程。\n- void destroy(): 破坏此线程组及其所有的子组。\n- void checkAccess():\
    \ 确定当前运行的线程是否有权限修改此线程组。\n- void list(): 将此线程组的信息打印到标准输出。\n- int enumerate(Thread[]\
    \ list): 将此线程组及其子线程组中的每个活跃线程复制到指定的数组中。\n- int enumerate(ThreadGroup[] list): 将此线程组及其子线程组中每个活跃分组的引用复制到指定的数组中。\n\
    - boolean isDaemon(): 验证此线程组是否为守护线程组。\n- boolean isDestroyed(): 验证此线程组是否已被破坏。\n\
    - boolean parentOf(ThreadGroup g): 验证此线程组是否为参数线程组或其任一个祖线程组。\n- void setDaemon(boolean\
    \ daemon): 修改此线程组的守护状态。\n- void setMaxPriority(int pri): 设置线程组的最大优先级。\n- String\
    \ toString(): 返回该线程组的字符串表示。\n\n## 6.8.5 System_class\n\nSystem 类提供了多个方法，用于访问系统属性、环境变量、标准\
    \ I/O 和错误流、加载文件/库等。\n\n以下是 System 类的一些常用方法：\n\n- static void arraycopy(Object\
    \ src, int srcPos, Object dest, int destPos, int length): 从指定的源数组（从源位置开始）将数组复制到目标位置。\n\
    - static long currentTimeMillis(): 返回当前的毫秒级时间。\n- static String getenv(String\
    \ name): 获取指定的环境变量的值。\n- static Properties getProperties(): 返回当前的系统属性。\n- static\
    \ void exit(int status): 终止当前运行的 JVM。\n- static void gc(): 运行垃圾收集。\n- static void\
    \ loadLibrary(String libname): 加载由 libname 参数指定的系统库。\n- static void setSecurityManager(SecurityManager\
    \ s): 设置系统安全。\n\n以下示例显示了 System 类方法的用法：\n\n```\npublic class SystemClassDemo {\n\
    \n    static String str1[] = {\"Mon\", \"Tue\", \"Wed\", \"Thu\"};\n    static\
    \ String str2[] = {\"East\", \"West\", \"North\", \"South\"};\n\n    public static\
    \ void main(String[] args) {\n\n        System.out.println(\"Current time in milliseconds\
    \ is: \" + \n        System.currentTimeMillis());\n        System.out.println(\"\
    Value of Path variable is: \" + \n        System.getenv(\"PATH\"));\n        System.arraycopy(str1,\
    \ 0, str2, 0, 3);\n        System.out.println(\"Copied array is: \");\n      \
    \  for (int i = 0; i < 4; i++) {\n            System.out.println(str2[i]);\n \
    \       }\n    }\n}\n```\n\n代码的输出如下截图所示：\n\n```\nCurrent time in milliseconds\
    \ is: 1531903964804\nValue of Path variable is: C:\\Program Files (x86)\nCopied\
    \ array is:\nMon\nTue\nWed\nSouth\n```\n\n图 6.8: System 类方法\n\n## 6.8.6 Runtime\
    \ class\n\n为了让 Java 应用程序与系统环境交互，Runtime 类始终只有一个实例。然而，应用程序无法创建该类的自己的实例。\n\n以下是\
    \ Runtime 类的一些常用方法：\n\n- static Runtime getRuntime(): 返回与当前 Java 应用程序关联的运行时对象。\n\
    - void loadLibrary(String libname): 加载由参数中指定的动态库。\n- long maxMemory(): 返回 JVM\
    \ 可能使用的最大内存量。\n- int availableProcessors(): 返回 JVM 可用的处理器数量。\n- long freeMemory():\
    \ 返回 JVM 中的空闲内存量。\n- long totalMemory(): 返回 JVM 中的总内存量。\n- Process exec(String\
    \ command): 在单独进程中执行参数中指定的字符串命令。\n- void exit(int status): 通过启动关闭序列终止当前运行的 JVM。\n\
    - void halt(int status): 强制终止当前运行的 JVM。\n- void load(String filename): 将参数中指定的文件作为动态库加载。\n\
    - void gc(): 执行垃圾收集器。\n- void runFinalization(): 执行任何等待待最终化的对象的 finalization 方法。\n\
    \n## 6.9 正则表达式\n\n正则表达式用于处理文本和数据。它们通常被用于定义数据约束条件。\n\n### 6.9.1 Pattern class\n\
    \nPattern 类的实例是正则表达式的编译形式。Pattern 类是编译形式的形式，没有公共的构造函数，因此无法实例化。它提供了重载的静态方法来创建不同的模式。例如：\n\
    \n```java\nimport java.util.regex.Pattern;\nimport java.util.regex.Matcher;\n\n\
    public class PatternDemo {\n    public static void main(String[] args) {\n   \
    \     Pattern pt = Pattern.compile(\"b.*\");\n        // 使用 Pattern 对象创建 Matcher\
    \ 对象\n        Matcher mt = pt.matcher(\"bbbx\");\n        // 检查匹配\n        boolean\
    \ result = mt.matches();\n        System.out.println(\"Pattern Match: \"+result);\n\
    \    }\n}\n```\n\nMatcher 类的 matches() 方法用于验证 Pattern 指定模式是否匹配字符串。注意，matches()\
    \ 方法在正则表达式只需要使用一次非常有用。该方法会编译表达式并对输入序列进行匹配。代码的输出如下：\n\nPattern Match: true\n\n\
    以下是 Pattern 类的一些方法：\n\n- matches(): Pattern 类还定义了 matches(String, CharSequence)\
