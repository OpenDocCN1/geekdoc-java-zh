    \     objCalc.name = \"John\";\n        System.out.println(\"Your name is \" +\
    \ objCalc.name);\n    }\n}\n```\n\nHere, the initializer block {} initializes\
    \ the value of the variable. Within the main method, the object objCalc is instantiated\
    \ and the value of name is printed. Next, the variable is explicitly assigned\
    \ a value and then printed on the screen.\n\nThe output of the code is shown in\
    \ the following screenshot:\n\n```\nsun:\nYour name is Unknown\nYour name is John\n\
    BUILD SUCCESSFUL (total time: 0 seconds)\n```\n\nFigure 3.4: Using Initializer\
    \ Block\n\n## 3.6 Pass-by-value and pass-by-reference\n\nThe variables specified\
    \ in method declaration are called the parameters while the actual values passed\
    \ to it during invocation are called arguments. In the case of multiple parameters,\
    \ the type and order of arguments must be the same as that of the parameters of\
    \ the method.\n\nParameters can be of a primitive type such as int and also of\
    \ reference types such as objects, arrays, etc.\n\n### Passing arguments by value\n\
    \nWhen arguments are passed by value, a copy of the argument is passed from the\
    \ calling method to the called method. In this case, any modification done to\
    \ the argument within the called method will not reflect in the calling method.\n\
    \nThe following example shows how to pass the argument by value:\n\n```java\n\
    public class PassByVal {\n\npublic void modifyVal(int val) {\nval = val + 10;\n\
    }\n\npublic static void main(String[] args) {\nint val = 10;\nPassByVal obj1 =\
    \ new PassByVal();\n\nobj1.modifyVal(val);\nSystem.out.println(\"Value of val\
    \ after method invocation is \" + val);\n}\n}\n```\n"
