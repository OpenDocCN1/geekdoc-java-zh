    \ void main(String[] args) {\n    // Declaring a variable of type Days\n    Days\
    \ day;\n\n    // Instantiating the enum Days\n    day = Days.Fri;\n\n    // Printing\
    \ the value of enum\n    System.out.println(\"Today is: \" + day);\n  }\n}\n```\n\
    \nThe output of the code is shown below:\n\n```\nToday is: Fri\n```\n\n## 2.7\
    \ Operators in Java\n\nJava provides operators to perform operations on the data\
    \ stored in the variables. The symbols used for performing operations are called\
    \ operators and the variables on which the operation is performed are called operands.\n\
    \nFor example,\n\n`c = a + b;`\n\nHere, c = a + b is an expression in which, +\
    \ is the operator for addition and a and b are the operands. Java supports different\
    \ types of operators which can be seen in the following sections.\n\n### Assignment\n\
    \nThe assignment operator = is used to assign the value of the operand on its\
    \ right to the operand on its left. More than one variable can be assigned a value\
    \ simultaneously.\n\nFor example,\n\n```java\nint a = 10;\nint b = c = 20;\n```\n\
    \nJava also supports compound assignment to assign the result of an expression\
    \ to a variable.\n\nFor example:\n\n```java\nint a = 10;\na += 6; // this is resolved\
    \ as a = a + 6;\n```\n\n### Arithmetic\n\nArithmetic operators operate on numeric\
    \ data. However, they can be used with character data as well. These are binary\
    \ operators which means that they operate on two operands.\n\nThe following are\
    \ the arithmetic operators in Java:\n\n- **Addition (+):** Performs the addition\
    \ operation on the operands.\n- **Subtraction (-):** Performs the subtraction\
    \ operation on the operands.\n- **Multiplication (*):** Performs the multiplication\
    \ operation on the operands.\n- **Division (/):** Performs the division operation\
    \ on the operands.\n- **Modulo (%):** Returns the remainder of a division operation.\n\
    \nThe following example shows the use of assignment and arithmetic operators:\n\
    \n```java\npublic class OperatorsDemo {\n    public static void main(String[]\
    \ args) {\n        int add, sub, mul, div, mod;\n\n        add = 3 + 5;\n    \
    \    sub = 10 - 4;\n        mul = 4 * 2;\n        div = 20 / 5;\n        mod =\
    \ 10 % 3;\n\n        System.out.println(\"Addition: \" + add);\n        System.out.println(\"\
    Subtraction: \" + sub);\n        System.out.println(\"Multiplication: \" + mul);\n\
    \        System.out.println(\"Division: \" + div);\n        System.out.println(\"\
    Modulo: \" + mod);\n    }\n}\n```\n\n### Unary\n\nUnary operators operate on a\
    \ single operand. Java supports types of unary operators which are:\n\n- **Unary\
    \ plus (+):** Indicates a positive value.\n- **Unary minus (-):** Negates an expression.\n\
    - **Increment (++):** Increments the value by 1.\n- **Decrement (--):** Decrements\
    \ the value by 1.\n- **Logical complement (!):** Inverts a boolean value.\n\n\
    There are two ways of using increment and decrement operators, that is, prefix\
    \ or postfix. The prefix version will increment the value and then assign, whereas\
    \ the postfix version will first assign the value and then increment.\n\nThe following\
    \ code shows the use of unary operators:\n\n```java\npublic class UnaryDemo {\n\
    \    public static void main(String[] args) {\n        int x = 3;\n        int\
    \ y = x++;\n        int z = ++x;\n        x = -x;\n        boolean answer = false;\n\
    \        answer = !answer;\n\n        System.out.println(\"y after postfix increment:\
    \ \" + y);\n        System.out.println(\"z after prefix increment: \" + z);\n\
    \        System.out.println(\"x after negation: \" + x);\n        System.out.println(\"\
    Logical complement of answer: \" + answer);\n    }\n}\n```\n\nThe output of the\
    \ code is shown in the following screenshot:\n\n| y after postfix increment |\
    \ 3 |\n| z after prefix increment | 5 |\n| x after negation | -5 |\n| Logical\
    \ complement of answer | true |\n\nFigure 2.5: Using Unary Operators\n\n### Conditional/Relational\n\
    \nThe conditional operators work on two operands to test the relationship between\
    \ them. The result of a conditional operator will either be true or false. Here\
    \ is a list of the conditional operators supported in Java:\n\n- Equal to (==):\
    \ Returns true if the two values are equal, else returns false.\n- Not Equal to\
    \ (!): Returns true if the two values are equal, else returns false.\n- Greater\
    \ than (>): Returns true if the value on the left is greater than the value on\
    \ the right, else returns false.\n- Less than (<): Returns true if the value on\
    \ the left is lesser than the value on the right, else returns false.\n- Greater\
    \ than or equal to (>=): Returns true if the value on the left is greater than\
    \ or equal to the value on the right, else returns false.\n- Less than or equal\
    \ to (<=): Returns true if the value on the left is less than or equal to the\
    \ value on the right, else returns false.\n\n### Logical\n\nLogical operators\
    \ work on two boolean expressions. The logical operators supported in Java are\
    \ as follows:\n\n- Logical AND (&&): Returns true if both the boolean expressions\
    \ are true, else returns false.\n- Logical OR (||): Returns true if either or\
    \ both the operations are true, else returns false.\n"
