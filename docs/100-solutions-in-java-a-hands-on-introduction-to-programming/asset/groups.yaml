- md: "\n# switch-case statement\n\nJava provides the switch-case statement as an\
    \ alternative to complicated multiple if-else statements. It compares the value\
    \ of a variable/expression against a set of pre-defined values. The statements\
    \ within the exact match are executed. The Java statement supports numbers, enumerations\
    \ as well as objects of Wrapper classes such as Character, Byte, and Integer as\
    \ variable/expression for a The switch statement is created using the switch keyword\
    \ followed by a variable/expression in parentheses (). Based on the value of the\
    \ expression, the appropriate case is executed which is indicated by the case\
    \ keyword. Each case is terminated by the break keyword. If none of the cases\
    \ match the expression, the default case is executed.\n\n## Syntax:\n\n```\nswitch\
    \ () {\ncase expr1:\n// execution statement\nbreak;\ncase expr2:\n// execution\
    \ statement\nbreak;\n  .\n  .\ncase exprprN:\n// execution statement\nbreak;\n\
    \n```\ndefault:\n// execution statement\nbreak;\n\n}\n```\n\n# Variations of the\
    \ switch-case statement\n\nJava also allows using multiple case statements with\
    \ a single break statement. Syntax:\n\n```\nswitch () {\ncase expr1:\ncase expr2:\n\
    case expr3:\ncase expr4:\n// execution statement\nbreak;\n.\n.\ncase exprprN:\n\
    // execution statement\nbreak;\ndefault:\n// execution statement\nbreak;\n}\n\
    ```\n\nIt is also possible to create nested switch-case in Java by embedding one\
    \ or more switch-case statements within a specific case in the parent switch-case\
    \ statement.\n\n## Syntax:\n\n```\nswitch () {\ncase exprpr1:\nswitch (){\ncase\
    \ exprprA:\n// execution statements\nbreak;\n...\ncase exprprN:\n// execution\
    \ statements\nbreak;\n}\nbreak;\ncase exprpr2:\n// execution statement\nbreak;\n\
    .\ncase exprprN:\n// execution statement\nbreak;\ndefault:\n// execution statement\n\
    break;\n}\n```\n\nThe following example shows the use of different types of switch\
    \ cases:\n\n```java\npublic class SwitchCaseDemo {\n\nenum Days {\nMon, Tue, Wed,\
    \ Thu, Fri, Sat, Sun\n}\n\npublic static void main(String[] args) {\nDays today\
    \ = Days.Tue;\nString hour = \"am\";\nint week = 2;\nswitch (today) {\ncase Mon:\n\
    case Tue:\ncase Wed:\ncase Thu:\ncase Fri:\nSystem.out.println(\"Discount scheme\
    \ for Weekdays\");\nswitch (week) {\ncase 1:\ncase 3:\nSystem.out.println(\"No\
    \ discount in week 1 and 3\");\nbreak;\ncase 2:\ncase 4:\nSystem.out.println(\"\
    20% discount in week 2 and 4\");\nbreak;\n}\nbreak;\ncase Sat:\ncase Sun:\nswitch\
    \ (hour) {\ncase \"am\":\nSystem.out.println(\"Discount is 40%\");\nbreak;\ncase\
    \ \"pm\":\nSystem.out.println(\"Discount is 20%\");\n}\nbreak;\ndefault:\nSystem.out.println(\"\
    Day does not exist\");\nbreak;\n\n}\n}\n}\n```\n\nHere, the main switch-case has\
    \ been created over an enum of days of the week. For weekdays Mon to Fri there\
    \ is a common case and for Sat-Sun there is one common case. Now, for weekdays,\
    \ there is a nested switch case over an integer value which represents the week\
    \ of the month. For weeks 2 and 4, the discount is 20% and for weeks 1 and 3,\
    \ there is no discount. Similarly, for another nested switch-case is used over\
    \ String values for the hour of the day. If the hour is am the discount is 40%\
    \ and if it is pm the discount is 20%. The default case is for the main switch-case\
    \ when an incorrect value for the day is specified.\n\nThe output of the code\
    \ is shown in the following screenshot:\n\n![](img/70651ebceef5c0cb89ccc7cad7a12eef_193_0.png)\n\
    \nFigure 2.17: Using the switch-case construct\n\n## 2.12 Looping constructs\n\
    \nJava allows you to execute a set of statements repeatedly to meet a specified\
    \ condition. For example, to display the numbers from 1 to n where n could be\
    \ any value specified by user or summation of 1 to n. To accomplish such repeated\
    \ calculations, Java provides looping constructs called loops or iterations.\n\
    \nThe different types of loops supported by Java are as follows:\n\n```\nwhile\
    \ loop\n```\n\nThe while statement is used to execute one or more statements until\
    \ the condition is true.\n\n## Syntax:\n\n```\nwhile () {\n// execution statement(s)\n\
    }\n```\n\nIf there is only a single statement to be executed, the curly braces\
    \ {} can be omitted.\n\nThe value of the variables must be initialized before\
    \ the execution of the loop. For example, int i = 1;\n\nThe loop must have an\
    \ expression to modify the value of the variable used in the loop's expression,\
    \ such as i++; or i--;\n\n## Variations of the while loop\n\n**Infinite loop:**\
    \ An infinite loop runs indefinitely when the conditional expression or the increment/decrement\
    \ expression of the loop is not provided.\n\nFor example:\n\n```java\nwhile (true)\
    \ {\n    System.out.println(\"This is infinite loop\");\n}\n```\n\n**Empty loop:**\
    \ A loop without any body is called an empty loop. For example:\n\n```java\nint\
    \ i = 5;\nint j = 20;\nwhile (i < j);\n```\n\n# do-while statement\n\nUnlike the\
    \ while statement, do-while checks the condition at the end. It allows the loop\
    \ to execute at least once. Syntax:\n\n```\ndo{\n// execution statement\n}while\
    \ (condition);\n```\n\nThe following example shows the use of while and do-while:\n\
    \n```java\npublic class WhileDoDemo {\n    public static void main(String[] args)\
    \ {\n        int i = 10;\n        int j = 15;\n        while (i < j) {\n     \
    \       System.out.println(\"Value: \" + i);\n            i++;\n        }\n\n\
    \        int num3 = 12;\n        do {\n            System.out.println(\"Value:\
    \ \" + num3);\n            num3++;\n        } while (num3 < 21);\n    }\n}\n```\n\
    \nThe do-while statement allows for nested constructs. Note, the do-while statement\
    \ can be nested inside a while loop. The body of the statement is inside the loop.\n\
    \nThe output of the code is shown in the following screenshot:\n\n| Value: 10\
    \ |\n| Value: 11 |\n| Value: 12 |\n| Value: 13 |\n| Value: 14 |\n| Value: 12 |\n\
    | Value: 13 |\n| Value: 14 |\n| Value: 15 |\n| Value: 16 |\n| Value: 17 |\n| Value:\
    \ 18 |\n| Value: 19 |\n| Value: 20 |\n\nFigure 2.18: Using while and do-while\
    \ loops\n\n## for statement\n\nThe for loop is similar to the while loop and executes\
    \ the statements until the condition is true. It is used when the number of iterations\
    \ is known. The condition is checked before the statements are executed. Syntax:\n\
    \n```\nfor(initialization; condition; increment/decrement) {\n  // execution statement(s)\n\
    }\n```\n\nHere, the initial value of the variable, the terminating condition,\
    \ and the iteration expression are specified in one statement.\n\n# Variations\
    \ of the for statement\n\nMultiple expressions in 'for': The statement allows\
    \ more than one initialization or increment expressions separated by using the\
    \ operator and evaluated from left to right.\n\nFor example:\n\n```java\nint x,\
    \ y, n=10;\nfor (x = 0, y = n; x <= y; x++, y--) {\n  // execution statement(s)\n\
    }\n```\n\nDeclaring control variable within the loop statement: The scope of control\
    \ variables can be restricted by declaring them at the time of initialization\
    \ in the for statement.\n\nFor example:\n\n```java\nfor (int x = 1; x<= 5; x++)\
    \ {\n  // execution statement(s)\n}\n```\n"
  mdcn: "\n\n# switch-case 语句\n\nJava 提供了 switch-case 语句作为复杂的多个 if-else 语句的替代方案。它将变量/表达式的值与一组预定义的值进行比较。在精确匹配范围内的语句将被执行。Java\
    \ 语句支持数字、枚举，以及如 Character、Byte 和 Integer 等包装类（Wrapper classes）对象作为变量/表达式。switch\
    \ 语句使用 `switch` 关键字创建，后紧跟圆括号 `()` 中的变量/表达式。根据表达式的值，执行相应的 `case`（由 `case` 关键字指示）。每个\
    \ `case` 都由 `break` 关键字结束。如果没有一个 `case` 匹配表达式，则执行 `default` 分支。\n\n## 语法：\n\n\
    ```\nswitch () {\ncase expr1:\n// 执行语句\nbreak;\ncase expr2:\n// 执行语句\nbreak;\n\
    \  .\n  .\ncase exprprN:\n// 执行语句\nbreak;\n\ndefault:\n// 执行语句\nbreak;\n\n}\n\
    ```\n\n# switch-case 语句的变体\n\nJava 还允许使用单个 `break` 语句配合多个 `case` 语句。语法如下：\n\n\
    ```\nswitch () {\ncase expr1:\ncase expr2:\ncase expr3:\ncase expr4:\n// 执行语句\n\
    break;\n.\n.\ncase exprprN:\n// 执行语句\nbreak;\ndefault:\n// 执行语句\nbreak;\n}\n```\n\
    \n在 Java 中，通过在父 switch-case 语句的特定 case 中嵌入一个或多个 switch-case 语句，可以创建嵌套 switch-case。\n\
    \n## 语法：\n\n```\nswitch () {\ncase exprpr1:\nswitch (){\ncase exprprA:\n// 执行语句\n\
    break;\n...\ncase exprprN:\n// 执行语句\nbreak;\n}\nbreak;\ncase exprpr2:\n// 执行语句\n\
    break;\n.\ncase exprprN:\n// 执行语句\nbreak;\ndefault:\n// 执行语句\nbreak;\n}\n```\n\
    \n以下示例展示了不同类型 switch case 的用法：\n\n```java\npublic class SwitchCaseDemo {\n\nenum\
    \ Days {\nMon, Tue, Wed, Thu, Fri, Sat, Sun\n}\n\npublic static void main(String[]\
    \ args) {\nDays today = Days.Tue;\nString hour = \"am\";\nint week = 2;\nswitch\
    \ (today) {\ncase Mon:\ncase Tue:\ncase Wed:\ncase Thu:\ncase Fri:\nSystem.out.println(\"\
    Discount scheme for Weekdays\");\nswitch (week) {\ncase 1:\ncase 3:\nSystem.out.println(\"\
    No discount in week 1 and 3\");\nbreak;\ncase 2:\ncase 4:\nSystem.out.println(\"\
    20% discount in week 2 and 4\");\nbreak;\n}\nbreak;\ncase Sat:\ncase Sun:\nswitch\
    \ (hour) {\ncase \"am\":\nSystem.out.println(\"Discount is 40%\");\nbreak;\ncase\
    \ \"pm\":\nSystem.out.println(\"Discount is 20%\");\n}\nbreak;\ndefault:\nSystem.out.println(\"\
    Day does not exist\");\nbreak;\n\n}\n}\n}\n```\n\n在这里，主 switch-case 是基于周几枚举创建的。对于周一到周五，有一个公共\
    \ case，对于周六到周日有一个公共 case。现在，对于工作日，针对代表月份周数的整数值有一个嵌套 switch case。对于第 2 周和第 4 周，折扣为\
    \ 20%，对于第 1 周和第 3 周没有折扣。同样，针对一天中小时 String 值使用了另一个嵌套 switch-case。如果是上午（am），折扣为\
    \ 40%，如果是下午（pm），折扣为 20%。当指定的周几值错误时，主 switch-case 执行 `default` 分支。\n\n代码的输出显示如下所示：\n\
    \n![](img/70651ebceef5c0cb89ccc7cad7a12eef_193_0.png)\n\n图 2.17：使用 switch-case\
    \ 结构\n\n## 2.12 循环结构\n\nJava 允许你重复执行一组语句以满足特定条件。例如，显示从 1 到 n 的数字，其中 n 可以是用户指定的任何值或\
    \ 1 到 n 的总和。为了完成此类重复计算，Java 提供了称为循环（loops）或迭代的循环结构。\n\nJava 支持的不同类型的循环如下：\n\n\
    ```\nwhile loop\n```\n\n`while` 语句用于执行一个或多个语句，直到条件为真。\n\n## 语法：\n\n```\nwhile\
    \ () {\n// 执行语句(s)\n}\n```\n\n如果只有一个执行语句，可以省略大括号 `{}`。\n\n在执行循环之前，必须对变量进行初始化。例如，`int\
    \ i = 1;`。\n\n循环必须有一个表达式来修改循环表达式用变量的值，例如 `i++;` 或 `i--;`。\n\n## while 循环的变体\n\n\
    **无限循环：** 当未提供条件表达式或循环的递//减表达式时，无限循环将无限运行。\n\n例如：\n\n```java\nwhile (true) {\n\
    \    System.out.println(\"This is infinite loop\");\n}\n```\n\n**空循环：** 没有主体的循环称为空循环。例如：\n\
    \n```java\nint i = 5;\nint j = 20;\nwhile (i < j);\n```\n\n# do-while 语句\n\n与\
    \ `while` 语句不同，`do-while` 在最后检查条件。它允许循环至少执行一次。语法如下：\n\n```\ndo{\n// 执行语句\n}while\
    \ (condition);\n```\n\n以下示例展示了 `while` 和 `do-while` 的用法：\n\n```java\npublic class\
    \ WhileDoDemo {\n    public static void main(String[] args) {\n        int i =\
    \ 10;\n        int j = 15;\n        while (i < j) {\n            System.out.println(\"\
    Value: \" + i);\n            i++;\n        }\n\n        int num3 = 12;\n     \
    \   do {\n            System.out.println(\"Value: \" + num3);\n            num3++;\n\
    \        } while (num3 < 21);\n    }\n}\n```\n\n`do-while` 语句允许嵌套结构。注意，`do-while`\
