    # Figure 5.1: Types of Inheritance


    The different types of inheritance in Java are as follows:


    **Single inheritance:** In single inheritance, a child class can inherit from
    only one parent/superclass.


    **Multilevel inheritance:** In multilevel inheritance, a child class inherits
    from a single parent and the parent can inherit from another single class itself.


    **Hierarchical inheritance:** In hierarchical inheritance, a parent/superclass
    can have more than one child classes that in turn may have other child classes
    at different levels.


    **Multiple inheritance:** In multiple inheritance, a child class can inherit from
    more than one parent/superclasses. Java does not support multiple inheritance
    with classes due to an issue called the diamond problem.


