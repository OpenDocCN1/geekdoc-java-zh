    # Summary


    Any abnormal or unexpected event occurring in a program that disrupts its normal
    execution is termed as an exception.


    Checked exceptions are anticipated in a program and appropriate handlers are provided
    for them.


    Errors and Runtime exceptions collectively form the unchecked exceptions.


    The base class for any class in Java is the Object class and for all the exception
    classes, the Throwable class is the base class.


    Exception class is the parent class of all checked exceptions and the


    The throw and throws clauses are used to explicitly raise exceptions from methods.


    Java SE 7 introduced the concept of a single catch block to handle multiple exceptions.


    Java SE 7 introduced the try-with-resources statement to declare more than one
    resource at a time and also to ensure that all resources are closed after completion
    of code execution.'
