    # Types of variables


    Java supports instance, static, and local variables. Each variable is explained
    briefly as follows:


    Instance variables can be accessed by using an instance of a class. There exists
    a separate copy of the instance variable for each instance.


    Static variables do not require an instance to access them as these are class-level
    variables. The static keyword is used to declare a static variable and a common
    copy of the variable is shared by all instances.


    Local variables are declared inside blocks or methods and cannot be accessed outside
    of them.


    A block begins with ''{'' and ends with ''}'' curly braces symbol.


