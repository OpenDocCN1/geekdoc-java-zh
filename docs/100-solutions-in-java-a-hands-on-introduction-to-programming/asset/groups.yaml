    #  5.6 Lambda expressions


    Java being an object-oriented programming language, everything in Java can reside
    only within a class and can be accessed by its object. This is applicable to functions
    as well. Some functional languages such as JavaScript, C++, etc. allow you to
    write functions and use as required. Some of the languages support both functional
    as well as object-oriented programming.


    Object-oriented programming is desirable but leads to a lot of verbosity in a
    program. For example, to create an instance of the Runnable class, generally,
    an anonymous class would be used as follows:


    ```

    Runnable r = new Runnable(){

    @Override

    public void run() {

    System.out.println("This is Runnable");

    }

    }

    ```


    In the preceding code, the only useful part is the code of the run() method. Rest
    all code is simply because of Java programming rules. With Java 8 functional interfaces
    and lambda expressions, the code can be made smaller and cleaner by removing the
    unnecessary code statements.'
  - '[PAGE 387]


    Lambda expressions were added to Java in Java SE 8 to introduce functional programming.
    A Lambda expression is a function that does not belong to any class and it can
    be passed as an object or executed as and when required. Lambda expressions help
    to visualize functional programming in the object-oriented programming world.
    Common usage of lambda expressions is seen in the implementation of callbacks/event
    listeners or Streams API. Lambda expressions also help to reduce the bulk code
    while implementing functional interfaces since they have only one abstract method.
    With lambda expressions, functionality can be treated as a method argument or
    code as data.


    # Syntax:


    ->


    For example:


    Runnable r = () System.out.println("This is Runnable");


    Here, runnable is a functional interface with only one method, run() hence, its
    instance can be created using lambda expressions instead of using the bulky anonymous
    class. Since the run() method does not accept any argument, the lambda expression
    will also contain no argument.


    Note that if there is only one statement to be processed, curly braces can be
    avoided but for multiple statements, braces are mandatory just like if-else blocks.'
  - '[PAGE 388]


    Benefits of Lambda expressions are as follows:


    **Reduced lines of code:** A lambda expression reduces lines of code as seen from
    the creation of a functional interface instance using a lambda expression rather
    than using an anonymous class.


    **Sequential and parallel execution support:** Benefit from the Stream API sequential
    and parallel operations support.


    **Passing behaviors into methods:** Allows you to pass functionality as an argument
    to methods.'
