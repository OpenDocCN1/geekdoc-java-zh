    # Bitwise


    The bitwise operators operate on the binary form of data to modify the individual
    bits in a value. Java supports the following bitwise operators:


    Bitwise AND (&): Operates on two values. Returns 1 if both bits are 1, else it
    returns o.


    Bitwise OR (|): Operates on two values. Returns 1 if either both bits are 1, else
    returns o.


    Exclusive OR (^): Operates on two values. Returns 1 if the bits are complementary,
    else returns 0.


    Complement (-): Operates on a single value and inverts all of the bits of the
    value.


    Right-shift (>>): Operates on a single value. Shifts all bits to the right by
    the number of bits specified in the position. Retains the sign of negative numbers.


    Left-shift (<<): Operates on a single value. Moves all the bits to the left by
    the number of bits specified in the position.'
