    # 6.8 Classes of the java.lang_package


    The java.lang package provides several classes to perform basic tasks of data
    manipulation in classes such as handling exceptions, threading, security, math,
    etc. Classes of the java.lang are automatically included in every Java source
    file and do not require an explicit import statement in code.


    Here are some of the most important classes of the java.lang package:


    Object: It is the root of the class hierarchy.


    Class: Instances of this class represent classes at runtime.


    Enum: It is the base class for all enumeration classes.


    Wrapper classes: These classes encapsulate primitive types as objects.


    String: It is the class used for creating and manipulating strings and string
    literals.


    StringBuilder and StringBuilder: These classes are used for performing string
    manipulation.'
