    # Summary


    Java provides the concept of inheritance to group classes with similar characteristics
    and creates a class hierarchy.


    In single inheritance, a child class can inherit from only one parent/superclass.


    To implement inheritance in Java, a parent-child relationship is created between
    two or more classes by using the extends keyword.


    Method overriding is a concept that allows you to create a child class method
    with the same signature and return type as that of the parent class.


    Binding of methods and method calls during compile time is called static/early
    binding and at runtime is called dynamic/late binding.


    Abstract classes declare methods to serve as a contract or a standard and simply
    provide a structure but leave the implementation to the inheriting class.


    A class defined within another class is called a nested class.'
  - '[PAGE 396]


    An anonymous class is a class declared without a name.


    An interface is a contract that sets the standards to be followed by the types
    that implement it.


    Java does not support multiple inheritance with classes. As a workaround, it allows
    you to implement multiple interfaces in a class.


    Default methods and Static methods feature allow methods to have implementations
    in an interface.


    An interface with exactly one abstract method is called a functional interface.


    Lambda expressions were added to Java in Java SE 8 to introduce functional programming.


    The double colon (::) operator was introduced in Java 8 and used for method references
    as a replacement for lambda expressions.


    In the next chapter, you will learn exceptions and regular expressions.'
