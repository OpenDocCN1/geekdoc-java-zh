    # 5.4.3 Issues with default methods


    A class can implement multiple interfaces that may have different default methods
    each. However, if each of the interfaces contains the same default method with
    the same name and signature, the code will fail to compile and raise the following
    error:


    ```

    java: class ClassWithTwoInterfaces inherits unrelated defaults for defaultMethod()
    from types Interface1 and Interface2

    ```


    This is because the compiler fails to determine which default method should be
    used. To fix this issue, the class can provide an implementation of the default
    method that overrides the versions of default methods of the interfaces. That
    overridden version will be used which will remove the ambiguity that resulted
    in the error.


    Further, a class can override the default method of the interface and still invoke
    the original default method by using the super keyword. However, to resolve ambiguity
    due to similar names in multiple interfaces, the name of the interface is prefixed
    before calling super. This is applicable even if only one interface is implemented
    as the class may extend another class as well.


    For example:'
