    # 6.8.4 ThreadGroup_class


    A thread in Java is the path followed when executing a program. All Java programs
    have at least one thread which is the main thread created by the JVM when the
    program starts and the main() method is invoked with the main thread.


    A thread group represents a set of threads and can also include other thread groups.
    In a thread group hierarchy, every thread group except the initial thread group
    has a parent. A thread can access information of only its own thread group and
    cannot access even its parent thread group.


