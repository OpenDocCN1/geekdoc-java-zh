    Null The null literal is assigned to a reference variable that does not point
    to any memory address. That is, the variable still does not refer to any object.
    For example, Vehicle bike = null;


    String A String literal is a sequence of characters within double quotes, for
    example, is a string literal", etc.'
- md: "\n## Escape sequences\n\nAn escape sequence is used to represent characters\
