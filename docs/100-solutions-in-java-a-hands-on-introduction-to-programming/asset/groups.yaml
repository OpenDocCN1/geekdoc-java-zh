    # 7.1 Collections framework


    The java.util package provides several utility classes and interfaces for different
    functionalities. It contains classes for data and time manipulation, event model,
    collections framework, internationalization, legacy collection classes, and other
    utility classes such as a random-number generator, and a bit array.


    A collection is a container object which helps to group multiple elements into
    a single unit. Some real-world examples of collections include contacts directory
    where names are mapped with phone numbers or a stack of plates, etc. Collections
    help to store, retrieve, manipulate, and communicate collective data.


    A collections framework is used to create and manipulate collections and it is
    composed of the following:


    **Interfaces:** Interfaces are abstract data types and can be used to manipulate
    collections independently without the need for the representation details.


    **Implementations:** These are the concrete implementations of the collection
    interfaces and are reusable.


    **Algorithms:** Algorithms are a set of methods that are reusable/polymorphic
    and provide ready computations for'
  - '[PAGE 501]


    processes like sort and search on objects implementing the collection interfaces.


    The benefits of the Java Collections framework are as follows:


    It provides useful algorithms and data structures that reduce the programming
    effort and allow interoperability between different APIs.


    The high-performance implementation of these data structures and algorithms increases
    the quality and speed of a program.


    It reduces the time for learning the use of new APIs as standard collection interfaces
    allow easy input and output of collections for many APIs.


    Standard collection APIs also reduce the effort to design new APIs.


    Since the new data structures and algorithms that confirm to the standard collection
    interfaces are reusable by default, the Collections framework promotes software
    reusability.'
  - '[PAGE 502]


    # 7.2 Iterable interface


    The Iterable interface belongs to the java.lang package and it is a top-level
    interface for classes and interfaces that need the iterator functionality. Implementing
    this interface allows an object to be the target of the foreach statement. Java
    SE 8 added the for method to the Iterable interface.


    The methods of the Iterable interface are as follows:


    default void foreach(Consumesuper T> action): Performs an action for each element
    of the Iterable interface until all elements have been processed or the action
    throws an exception.


    Iterator iterator(): Returns an iterator over elements of type T.


    default Spliterator spliterator(): Creates a Spliterator over the elements described
    by this


    The enhanced (for-each) and forEach() methods both provide the same functionality
    of looping through elements in a collection. However, the enhanced for-loop is
    an external iterator whereas the new foreach() method is an internal one.


    The internal iterator manages the iteration in the background so that the programmer
    can focus on what is to be done with the'
  - '[PAGE 503]


    elements of the collection instead of managing the iteration and ensuring that
    all the elements are processed one-by-one.


    In the case of an external iterator, the programmer has to manually specify how
    the iteration will be performed.

    Enumerations, Iterators, and enhanced for-loop are all external iterators with
    methods such as iterator(), next(), and hasNext() for manipulating collections.'
  - '[PAGE 504]


    # ### 7.3 Collection interface


    The Collection interface belongs to the java.util package and it is at the top
    level of the interfaces and classes belonging to the collections framework. The
    collections can be ordered or unordered. Some collections permit duplicate elements
    while others do not.


    The Collection interface is inherited by several specific sub-interfaces such
    as Set, and These interfaces allow passing and manipulating collections as well
    as the conversion of a collection type to another. To implement the interfaces,
    the Collections framework provides several abstract and concrete classes in the
    hierarchy. The Collection interface hierarchy is shown in the following figure:


    ![](img/70651ebceef5c0cb89ccc7cad7a12eef_504_0.png)'
- md: "\nFigure 7.1: Collection interface hierarchy\n\nThe common methods of the Collection\
    \ interface are listed as follows. These methods can be used by all the implementing\
    \ classes and subinterfaces:\n\n- size(): Returns the size (number of elements)\
    \ in the collection.\n\n- isEmpty(): Returns true if the collection is empty/has\
    \ no elements, else returns false.\n\n- contains(Object o): Checks whether a collection\
    \ contains the specified object.\n\n- add(Object o): Adds an element to the collection.\n\
    \n- remove(Object o): Removes an element from the collection.\n\n- clear(): Clears\
    \ all the contents from the collection.\n\n- toArray(): Returns an array containing\
    \ all the elements of this collection.\n\n- equals(Object o): Compares the specified\
    \ object with this collection to check whether they are equal.\n\nSome methods\
    \ of the Collection interface are provided to perform bulk operations on the entire\
    \ collection. These methods are as follows:\n\n- containsAll(Collection c): Returns\
    \ true if this collection contains all elements of the specified collection.\n\
    \n- addAll(Collection<? extends E> c): Adds all the elements of the specified\
    \ Collection to this collection.\n\n- removeAll(Collection c): Removes all the\
    \ elements from this Collection that are present in the specified collection.\n\
    \n- retainAll(Collection c): Retains only those elements of this collection that\
    \ are present in the specified collection.\n\n## 7.3.1 Traversing collections\n\
    \nTraversing collections means iterating through a collection to access/manipulate\
    \ its elements. In Java, the following two approaches are commonly used to traverse\
    \ collections:\n\n**For-each/Enhanced for loop**: The for-each loop (enhanced\
    \ for loop), added in Java SE 5, is a control flow statement used to traverse\
    \ a collection. However, unlike the for loop construct, the for-each loop does\
    \ not maintain an explicit counter, that is, a for-each loop will do this for\
    \ every element in this set.\n\nInternally, for-each behaves in the same manner\
    \ as an Iterator. Therefore, it is preferred over Iterator when reading each element,\
    \ one by one and in order, since for-each is more convenient and concise.\n\n\
    Syntax:\n\n```\nfor(Object obj : collection) {\n    System.out.println(obj);\n\
    }\n```\n\nSince the for-each construct does not maintain an explicit index, it\
    \ does not allow removal of the current element by using the remove() method.\n\
    \n**Iterator**: The Iterator interface provides methods to traverse and manipulate\
    \ collections. To obtain an Iterator for a collection, use the iterator() method.\
    \ Here are some important methods of the Iterator interface:\n\n- hasNext(): Returns\
    \ true if the iteration has more elements.\n\n- next(): Returns the next element\
    \ in the iteration.\n\n- remove(): Removes the last element that was returned\
    \ from the collection by the next() method. For every call to the next() method,\
    \ the remove() method can be invoked only once. The remove() method is the only\
    \ method that modifies a collection safely during iteration.\n\n## 7.3.2 Collection\
    \ factory methods\n\nThe factory methods were introduced with Java 9. These are\
    \ special static methods used to create immutable instances of collections. You\
    \ can create List, and Map by using these methods for a small set of elements.\
    \ Each interface has its own factory methods. An attempt to add a new element\
    \ will throw the UnsupportedOperationException.\n\n## 7.4 List interface\n\nLists\
    \ are collections created by implementing the List interface which is an extension\
    \ of the Collection interface. Lists are ordered collections that allow duplicate\
    \ values and multiple null elements. Elements of a list index can be accessed/searched\
    \ using an integer index. Similar to Java arrays, the list index begins at zero\
    \ and the last index is size-1. Collections can be manipulated by the methods\
    \ of the List interface through position-based operations. The List interface\
    \ uses an index internally to order the elements that are added to a list. The\
    \ List interface also provides methods to add and search elements as well as perform\
    \ range operations.\n\nThe List interface provides the ListIterator to sequentially\
    \ access the elements of the list. It is used to insert and replace elements and\
    \ for bidirectional access along with the normal operations. Here are the additional\
    \ methods of the List interface apart from those inherited from the Collection\
    \ interface:\n\n- add(int index, E element): Adds the specified element in the\
    \ list at the position specified by the index.\n\n- addAll(int index, Collection<?\
    \ extends E> c): Adds all the elements of the specified collection, c, to the\
    \ list starting at the given index position.\n\n- get(int index): Retrieves the\
    \ element of this list from the specified index position.\n\n- set(int index,\
    \ E element): Replaces the element of this list from the location specified by\
    \ index with the specified element.\n\n- remove(int index): Removes the element\
    \ at a given index position from the list.\n\n- subList(int start, int end): Returns\
    \ a sub-list containing elements from start to end – 1 of this list.\n\n- indexOf(Object\
    \ o): Returns the index of the first occurrence of the specified element in the\
    \ list, or returns -1 if the element is not found in this list.\n\n- lastIndexOf(Object\
    \ o): Returns the index of the last occurrence of the specified element in the\
    \ list, or returns -1 if the element is not found in this list.\n\nThe equals()\
    \ method helps to check the logical equality of two List objects. Two List objects\
    \ are equal if they contain the same elements in the same order. Here is the list\
    \ of the factory methods of the List interface:\n\n- static List of(): Returns\
    \ an immutable list containing zero elements.\n\n- static List of(E e1): Returns\
    \ an immutable list containing one element.\n\n- static List of(E... elements):\
    \ Returns an immutable list containing an arbitrary number of elements.\n\n- static\
    \ List of(E e1, E e2): Returns an immutable list containing two elements.\n\n\
    - static List of(E e1, E e2, E e3): Returns an immutable list containing three\
    \ elements.\n\n- static List of(E e1, E e2, E e3, E4): Returns an immutable list\
    \ containing four elements. (Note: OCR text \"E3\" likely meant E4)\n\nThe following\
    \ example shows the use of factory methods of the List:\n\n```java\nimport java.util.List;\n\
    \npublic class ListDemo {\n\n    public static void main(String[] args) {\n  \
    \      //using the factory method to create an immutable List\n        List list1\
    \ = List.of(\"Java\", \"Java EE\", \"Spring\", \"Hibernate\", \"Struts\");\n\n\
    \        System.out.println(\"Java Topics\");\n        for (String l : list1)\
    \ {\n            System.out.println(l);\n        }\n    }\n}\n```\n\nThe output\
    \ of the code is:\n\nJava Topics\nJava\nJava EE\nSpring\nHibernate\nStruts\n\n\
    Figure 7.2: List interface factory methods\n\n### 7.4.1 ArrayList class\n\nThe\
    \ ArrayList class implements the List interface and its methods. It is a solution\
    \ to fixed-size arrays of primitive types as it allows you create variable-length\
    \ array of objects which can dynamically grow or shrink in size. While creating\
    \ an ArrayList object, an initial size must be specified which can increase or\
    \ decrease based on manipulations done on the ArrayList elements.\n\nThe ArrayList\
    \ class allows all elements, including null. The ArrayList class is best suited\
    \ for random access when insertion/removal of elements is to be done only at the\
    \ end. Each ArrayList instance has a capacity which is the size of the array that\
    \ will increase automatically as elements are added to the list.\n\nThe constructors\
    \ of the ArrayList class are as follows:\n\n- ArrayList(): Creates an empty list\
    \ having an initial capacity of 10.\n\n- ArrayList(Collection<? extends E> c):\
    \ Creates a list with the elements of the specified collection stored in the order\
    \ they were returned by the collection's iterator.\n\n- ArrayList(int initialCapacity):\
    \ Creates an empty list with the specified capacity.\n\nFor example:\n\n```java\n\
    import java.util.ArrayList;\nimport java.util.List;\n\nList list1 = new ArrayList<>();\n\
    ```\n\nMETHODS OF THE ARRAYLIST CLASS:\n\nThe ArrayList class inherits all the\
    \ methods of the List interface. Some methods are listed as follows:\n\n- add(E\
    \ obj): Adds the specified element to the end of this list.\n\n- contains(Object\
    \ obj): Returns true if this list contains the specified element.\n\n- size():\
    \ Returns the number of elements in this list.\n\n- trimSize(): Trims the size\
    \ of the ArrayList to the current size of the list.\n\n- ensureCapacity(int minCap):\
    \ Increases the capacity of the ArrayList and ensures that it can hold the least\
    \ number of specified elements.\n\n- clear(): Removes all the elements from this\
    \ list.\n"
  mdcn: "\n\n图 7.1: Collection 接口层级结构\n\nCollection 接口的常用方法列举如下。这些方法可以被所有实现类和子接口使用：\n\
