    In a source folder, create package folders to match the package names.


    Place the source files in the appropriate package folders.


    The steps for Java SE 9 onwards are as follows:


    Create one or more source folders.


    In each source folder, create a module folder for each module.


    In the module folders, create package folders to match the package names.


    Place the source files in the appropriate package folders.


    Create a module descriptor file that has metadata about the module, that it, its
    exports, and dependencies. Save the file directly in the module root folder with
    the name module-info.java. For example, the module descriptor for the module moduleone
    is shown as follows:


    ```

    module moduleone {

    // module exports and dependencies

    }

    ```


    The file begins with the module keyword which indicates that the succeeding text
    is the name of the module. The module name'
