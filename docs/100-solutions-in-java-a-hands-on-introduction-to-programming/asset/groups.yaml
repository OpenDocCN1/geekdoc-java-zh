  - '[PAGE 50]


    # 1.6 Features of Java SE 9 and Java SE 10


    The release, Java 8, was full of various new features that had made a significant
    impact on application development with Java. Until JDK 8, every JRE had all the
    classes for the runtime bundled into a single Java Archive (JAR) called rt.jar
    that was present in the lib directory. This led to a large number of unnecessary
    classes getting to the runtime leading to overhead for the JVM. Thus, the JAR
    becomes bulky in size and the execution environment is forced to deal with all
    the classes whether or not they are used.


    But Java SE 9 comes with more versatility and customization and a hoard of new
    features. The most important of them is the Jigsaw project which applies the new
    module system to break the JRE into reusable and interoperable components. The
    programming code is divided into modules that contain the tasks to be executed
    by them. This makes programs reusable and easier to manage and debug.


    Another advantage of modularity is that it makes the Java platform more lightweight
    and scalable so that programs can run on smaller devices with fewer resources.
    The modular JRE can be used even with embedded systems allowing IoT apps to be
    coded by using Java.


    Here are some new and exciting features of Java SE 9:'
  - '[PAGE 51]


    Java Platform Module System (JPMS): This is the most important feature of Java
    SE 9. The important issues encountered with the growing codebase of a system are:


    Difficulty to encapsulate code


    Lack of clarity of dependencies among the various aspects (JARs)


    Easy access of public classes on the classpath leading to injudicious usage


    Lack of surety about the availability of all required JARs on the classpath


    All these issues are addressed by the module system by using a module descriptor
    within the modular JARs. In this file, a module can define the list of all other
    modules on which it is dependent by using the requires statements. Further, to
    make packages of a module accessible to other modules, the exports keyword is
    used. If the exports keyword is not used with a package, it is encapsulated in
    that module by default as shown in the in the following image:'
  - '[PAGE 52]


    | mod1 | requires | mod2 |

    |---|---|---|n| com.mod1 | | com.mod2 |

    | com.mod1.pkg1 com.mod1.pkg2 | | com.mod2.pkg3 com.mod2.pkg4 |


    **Figure 1.5:** Module dependencies


    Note that module mod1 requires the module Both modules have packages that are
    encapsulated (as indicated by the shield symbol) as they are not exported. This
    ensures that the classes of the packages do not get accessed accidentally. Programmatically,
    this can be depicted as shown below:


    ```

    module mod1 {

    exports com.mod1;

    requires mod2;

    }

    ```


    Similarly, the entire Java platform has been modularized by encapsulating the
    internal classes of JDK, JARs, JVM making it more secure and flexible. Unlike,
    the JVM verifies the classpath for the existence of all dependent modules specified
    by using the requires statement. This avoids unexpected errors and code crash
    during execution encountered earlier due to missing JARs.


    You can create a minimal runtime by adding only the modules that are needed to
    execute and application. This can be done by'
- md: "\nusing the new jlink tool provided with Java 9. the modularized JDK and the\
    \ module descriptor file which contains explicit dependencies mentioned in it,\
    \ make it possible to create such minimal runtime. Thus, you can create a minimal\
    \ and optimized runtime and avoid a bulky JDK installation.\n\nJShell is a new\
    \ Read-Eval-Print-Loop (REPL) interactive terminal of JDK 9. You can launch the\
    \ jshell from the console and type and execute code directly from it. When a code\
    \ is executed, it gives immediate feedback which allows you to try and explore\
    \ new APIs and language features. You can also test regular expressions in Java\
    \ using the interactive shell.\n\nEnhanced Javadoc now provides a built-in search\
    \ facility in the API documentation. Further, the new Javadoc is HTML5 compliant\
    \ and every page includes information about the JDK module to which a class or\
    \ interface belongs.\n\nCollection Factory Java SE 9 brings a new feature with\
    \ factory methods for collections such as List, Set, etc. This helps a developer\
    \ to quickly populate collections in one statement instead of using several add\
    \ calls. For example,\n\n```\nSet set1 = Set.of(3,4,5);\n```\n\nThese collections\
    \ are immutable, that is, items cannot be added to these collections after creation,\
    \ else it will throw the UnsupportedOperationException exception. The use of factory\
    \ methods makes the code shorter and avoids section of a specific implementation\
    \ of the collection type.\n\nEnhancements in Stream API: Java SE 9 adds more features\
    \ to the Streams API by allowing declarative pipelines of transformations on collections.\
    \ It adds new methods to the Stream interface namely, dropWhile, takeWhile, and\
    \ provides an overloaded version of the iterate method to provide an expression\
    \ to iterate. This is shown in the following example:\n\n```\nIntStream.iterate(1,\
    \ num -> num < 10, num -> num + 1).forEach(System.out.println);\n```\n\nThe lambda\
    \ expression in the second argument returns true until num becomes 100 and prints\
    \ the integers from 1 to 99.\n\nFurther, it is possible to convert an Optional\
    \ object to a Stream object.\n\n```\nStream num = Optional.of(1).stream();\n```\n\
    \nPrivate interface methods: Java SE 8 introduced the concept of default methods\
    \ for interfaces. But interfaces were only method signatures without any implementation.\
    \ With Java SE 9, interfaces can also have methods with behavior and private helper\
    \ methods to implement shared code that can be invoked from multiple default methods.\
    \ This is explained in the following code:\n\n```\npublic interface Interface\
    \ {\n    void interfaceMethodWithOnlySignature();\n    default void interfaceDefaultMethod()\
    \ {initProcess();}\n    default void interfaceDefaultMethod1() {initProcess();}\n\
    \    // Private method that is not part of the public API exposed by Interface\n\
    \    private void initProcess() {\n        System.out.println(\"Initializing the\
    \ Process\");\n    }\n}\n```\n\nThus, private interface methods can help to structure\
    \ the implementation of APIs with default methods.\n\nJava 9 introduces a new\
    \ way of performing HTTP calls by using the HttpClient API as a replacement for\
    \ the old HttpClientConnection API which also supports WebSockets and HTTP/2:\n\
    \n```\nHttpClient client = HttpClient.newHttpClient();\n```\n\nMulti-release Java\
    \ SE 9 brings the feature of multi-release JARS as a solution to bulky JARS resulting\
    \ from deprecated libraries retained for backward compatibility. This feature\
    \ allows you to create alternate versions of classes that be used only when the\
    \ library is run on a specific version of Java.\n\nThis is explained in the following\
    \ image:\n\n![](img/70651ebceef5c0cb89ccc7cad7a12eef_56_0.png)\n\n# Figure 1.6:\
    \ Multi-release JAR\n\nThe above image shows a multirelease.jar file with a Helper\
    \ class at the top level as well as the Java 9 specific version. This indicates\
    \ that while working with Java 9, the class under the META-INF/versions/9 folder\
    \ will be used, can use Java 9 features and libraries. The JAR will however work\
    \ with earlier versions as well in which case, the top-level Helper class will\
    \ be used.\n\n## Features of Java SE 10\n\nJDK 10 follows the modular model of\
    \ JDK 9 and provides enhancements on the features and functionalities of JDK 9.\
    \ JDK 10 does not bring any major changes or improvements over JDK 9 but it does\
    \ act as the first release in the new, six-monthly release cadence announced by\
    \ Oracle. Slated to be just short-term release, the public updates for JDK 10\
    \ will end in 6 months. The next version JDK 11 is scheduled for release in September\
    \ 2020 and it will be a long-term support (LTS) version of Java.\n\nListed below\
    \ are the new features and enhancements in Java SE 10:\n\n- Application Data-Class\
    \ Sharing (CDS): This JDK Enhancement Proposal (JEP) is an extension to the existing\
    \ CDS feature which allows you to store the application classes into a shared\
    \ archive to improve startup.\n- Parallel Full GC: A full parallel GC improves\
    \ the worst-case latencies of the F1 garbage collector.\n- Garbage Collector Interface:\
    \ JDK 10 introduces the garbage collector (GC) interface to improve the source\
    \ code isolation of different garbage collectors.\n- Combine the multiple JDK\
    \ repositories into a Single Repository: This feature is incorporated to simplify\
    \ and streamline development.\n- Local-Variable Type Inference: This enhancement\
    \ allows you to extend type inference to declarations of local variables with\
    \ initializers. It also introduces var to Java.\n- Thread Callbacks: JDK 10 introduces\
    \ the possibility to stop individual threads instead of all threads on threads\
    \ without performing a global VM safepoint. \n- Time-Based Release Versioning:\
    \ It introduces a new time-based release versioning for the version-string scheme\
    \ of the Java SE Platform and the JDK.\n- Other features: Several other high-level\
    \ features include:\n    - A default set of root Certification Authority (CA)\
    \ certificates in the JDK.\n    - Enabling heap allocation on alternative memory\
    \ devices specified by the user.\n    - Using Graal, the Java-based JIT compiler,\
    \ as an experimental JIT compiler on the Linux/x64 platform.\n    - Enhanced java.util.Locale\
    \ and related APIs to implement additional Unicode extensions.\n\n## 1.7 Downloading\
    \ and installing JDK 8 and JDK 10\n\nIn order to understand the difference between\
    \ old JAR-based and new module-based JDK, download and install JDK 8 and JDK 10\
    \ for Windows from Oracle's official download page.\n\nThe JDK 8 Downloads page\
