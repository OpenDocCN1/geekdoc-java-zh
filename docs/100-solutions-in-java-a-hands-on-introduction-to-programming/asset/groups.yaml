    ![](img/70651ebceef5c0cb89ccc7cad7a12eef_341_0.png)\n\n**图 5.4：** 方法重写\n\n## 5.1.3\
    \ 静态绑定与动态绑定 (Static v/s dynamic binding)\n\n编译期间对方法和方法调用的绑定被称为静态/早期绑定，在运行时被称为动态/晚期绑定。所有静态方法调用都在编译时解析，实例方法在运行时解析。Java\
    \ 变量访问也遵循静态绑定。\n\n下表列出了静态绑定和动态绑定之间的区别：\n\n| 静态绑定 (Static Binding) | 动态绑定 (Dynamic\
