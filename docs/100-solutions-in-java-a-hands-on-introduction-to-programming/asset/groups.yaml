    # Summary


    A class is composed of attributes/fields that store data and methods that perform
    some operation on the attributes.


    To create an object or instance of a class, the new operator is used.


    Java provides the public, private, and protected access specifiers that provided
    different levels of visibility to a class, field, and method.


    The instance variables and methods are members of a class and define the state
    and behavior of an object, respectively.


    A constructor is a method having the same name as the class name and does not
    have any return type, though, it can have parameters.


    Java allows you to use the initializer block as an alternative to constructors
    to initialize variables with default values.


    When arguments are passed by value, a copy of the argument is passed from the
    calling method to the called method.'
