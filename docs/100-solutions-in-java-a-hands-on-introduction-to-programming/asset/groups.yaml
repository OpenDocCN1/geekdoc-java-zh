    \ with default values. The initializer block is executed before the execution\
    \ of the constructor during object instantiation.\n\nThe following example shows\
    \ the use of initializer block:\n\n```java\npublic class Calculator {\n\n    private\
    \ String name;\n\n    {\n        name = \"Unknown\";\n    }\n\n    public static\
    \ void main(String[] args) {\n\n        Calculator objCalc = new Calculator();\n\
