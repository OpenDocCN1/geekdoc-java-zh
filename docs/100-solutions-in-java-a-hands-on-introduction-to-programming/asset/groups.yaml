    \ static void main(String[] args) {\n        OneDimenArray obj1 = new OneDimenArray();\n\
    \        obj1.viewScores();\n    }\n}\n```\n\n在这里，声明了一个一维数组，然后在构造函数中对其实例化和初始化。数组的值通过从\
    \ `main()` 方法调用 `viewScores()` 方法来打印。代码的输出如下图所示：\n\n![](img/70651ebceef5c0cb89ccc7cad7a12eef_286_0.png)\n\
    \n**图 4.3:** 一维数组\n\n### 4.1.2 多维数组\n\n多维数组是数组的数组；最常见的是使用额外一组方括号声明的二维数组，例如 `int[][]\
    \ score`。在这种情况下，通过每个维度的索引来访问每个元素。\n\n下图展示了一个二维数组：\n\n| 索引 | 0 | 1 |\n|---|---|---|\n\
    | 0 | 40 | 60 |\n| 1 | 56 | 45 |\n| 2 | 76 | 65 |\n| 3 | 60 | 74 |\n| 4 | 85 |\
    \ 90 |\n\n**图 4.4:** 多维数组\n\n数组 `score` 声明的大小为 5x2 `[]`。因此，它最多可以容纳 5 行 2 列值。要访问任何值，使用数组名称加上行和列的相应索引。例如，访问该值的语法是\
    \ `score[row][column]`。注意行的最后一个索引是 4，列的最后一个索引是 1。因此，尝试访问 `score[5][2]` 将抛出错误/异常。\n\
    \n在 Java 中创建多维数组，必须对其进行声明、实例化和初始化。\n\n**声明和实例化语法：**\n\n```java\ndatatype[][] name\
    \ = new datatype[rows][columns];\n```\n\n例如：\n\n```java\nint[][] score = new int[5][2];\n\
    ```\n\n**初始化：**\n\n多维数组可以通过两种方式初始化：\n\n- 在声明期间：\n\n```java\nint[][] score = {{40,60},\
    \ {56,45}, {76,65}, {60,74}, {85,90}};\n```\n\n注意行元素在大括号中指定，每行之间用逗号分隔。\n\n- 在实例化之后：\n\
    \n多维数组可以通过访问每个行和列在创建后初始化：\n\n```java\nint[][] score = new int[5][2];\nscore[0][0]\
    \ = 40; score[0][1] = 60;\nscore[1][0] = 56; score[1][1] = 45;\nscore[2][0] =\
    \ 76; score[2][1] = 65;\nscore[3][0] = 60; score[3][1] = 74;\nscore[4][0] = 85;\
    \ score[4][1] = 90;\n```\n\n以下示例展示了多维数组的用法：\n\n```java\npublic class MultiDimensionalArray\
