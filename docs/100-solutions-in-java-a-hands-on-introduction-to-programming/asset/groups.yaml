    \ Java 9 中引入了私有方法（private methods）。\n\n接口不用于实现继承层次结构。相反，它们用于将公共方法分组，以便不同的实体根据需求实现这些方法，即使它们不是该接口的某种类型。按照命名约定，通常在接口名称前加get字母\
