    # Summary


    Any real-world entity that has certain characteristics and behavior that can be
    used to describe it is considered as an object.


    Java is a popular object-oriented, platform-independent programming language.


    The Java platform is a development and execution environment for Java applications
    which is a mixture of software and hardware components.


    Java SE is the base for creating applications that are console or network-based
    applications mainly for desktop computers.


    The two important Java SE platform components are JRE and JDK.


    The JDK has undergone several modifications over the years with some major enhancements
    and new features added with every new release.


    The most important feature of JDK 9 is the Jigsaw project which applies the new
    module system to break the JRE into reusable and interoperable.'
  - '[PAGE 114]


    The new jlink tool of Java 9 provides the facility to create a minimal runtime
    with only those modules that are required to run an application.


    JDK 9 offers a new interactive Read–Eval–Print Loop (REPL) terminal called JShell.


    JDK 10 follows the modular model of JDK 9 and provides enhancements on the features
    and functionalities of JDK 9.


    To work with JDK, the path of the bin folder must be set in the system environment
    variable named


    A package in Java is similar to a namespace where classes of similar functionalities
    are saved.


    A Java 9 module is a self-describing collection of code and data.


    The module descriptor modue-into.java is mandatory for every module.


    In the next chapter, you will learn about Java programming constructs.'
