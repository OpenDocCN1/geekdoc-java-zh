    **Figure 1.21:** Module Descriptor of a Java Module


    Note that the module descriptor file is a .java file but it does not follow the
    class naming conventions of the Java language. That is, the use of the hyphen
    (-) character is not allowed for a Java type name. Also, the name of the .java
    file should match the name of the public type declared in the file, which is not
    observed with the module descriptor name. This is similar to the file used in
    Java since Java 1.5, though not so widely used. These files have been given invalid
    Java type deliberately to indicate their special purpose and distinguish them
    from the other Java files in the application.


