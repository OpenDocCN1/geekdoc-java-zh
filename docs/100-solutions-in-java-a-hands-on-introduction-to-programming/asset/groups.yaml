    # 6.6 Wrapper exceptions


    Java allows chaining of exceptions by wrapping one exception inside another without
    actually swallowing the original exception cause. Exception wrapping indicates
    catching an exception, wrapping it in a different exception, and throwing the
    wrapper exception.


    Exception chaining was introduced since JDK 1.4 and in order to support it, Java
    introduced getCause() and initCause(Throwable) in the Throwable class with new
    constructors, Throwable(Throwable) and Throwable(String, Throwable). Wrapping
    exceptions prevent the code at a higher level in the call stack to know about
    every detail of the exception lower down in the call stack. This is because the
    more the exceptions aggregate to the top, the more exception declarations will
    be required in the top-level methods making it very tedious to manage every time
    the code changes.


    For example, suppose a class has a method that throws Now, a class using that
    method will have to catch the exception. Later, if the method changes to throw
    and several others, all these exceptions will have to be caught separately in
    the class that calls this method. Instead, one can create a common exception MyException
    that can be thrown every time and catch any of these exceptions that are raised.
    Thus, the code using the method has to deal with just one exception.'
