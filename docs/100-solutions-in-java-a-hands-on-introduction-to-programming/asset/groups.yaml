    # Non-primitive_data_types


    Java also supports several non-primitive and reference types, namely, String,
    Array, Class, Interface, etc.


    The String class is defined in the java.lang package and is used to store a sequence
    of characters also called a string. None of the primitive data types have the
    support for storing more than one character in a variable. The String class provides
    this feature.


    For example,


    String str = "Stores a string";


    Here, str is not a primitive type of variable but an object of type The value
    is specified within double quotes. The value of the str variable remains constant
    throughout. Initializing the variable with a new value, internally creates a new
    String object. Thus, String objects are immutable.


    **Reference types:** A reference type stores the address of an object. In Java,
    arrays and objects represent the reference types. When an object or array is created,
    the address of the memory assigned to it is stored in the reference variable.'
