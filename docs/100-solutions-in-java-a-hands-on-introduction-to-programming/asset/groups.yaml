    例如：\n\n```java\nint a = 10;\na += 6; // 这解析为 a = a + 6;\n```\n\n### 算术\n\n算术运算符作用于数值数据。然而，它们也可以用于字符数据。它们是二进制运算符，意味着作用于两个操作数。\n\
    \n以下是 Java 中的算术运算符：\n\n- **加法 (+)**: 对操作数执行加法操作。\n- **减法 (-)**: 对操作数执行减法操作。\n\
    - **乘法 (*)**: 对操作数执行乘法操作。\n- **除法 (/)**: 对操作数执行除法操作。\n- **取模 (%)**: 返回除法操作的余数。\n\
    \n以下示例显示了赋值和算术运算符的使用：\n\n```java\npublic class OperatorsDemo {\n    public static\
    \ void main(String[] args) {\n        int add, sub, mul, div, mod;\n\n       \
    \ add = 3 + 5;\n        sub = 10 - 4;\n        mul = 4 * 2;\n        div = 10\
    \ / 5;\n        mod = 10 % 3;\n\n        System.out.println(\"加法: \" + add);\n\
    \        System.out.println(\"减法: \" + sub);\n        System.out.println(\"乘法:\
    \ \" + mul);\n        System.out.println(\"除法: \" + div);\n        System.out.println(\"\
    取模: \" + mod);\n    }\n}\n```\n\n### 一元运算符\n\n一元运算符作用于单个操作数。Java 支持的一元运算符有：\n\n\
    - **单加 (+)**: 表示正值。\n- **单减 (-)**: 取反表达式。\n- **自增 (++)**: 值加 1。\n- **自减 (--)**:\
    \ 值减 1。\n- **逻辑取反 (!)**: 反转布尔值。\n\n自增和自减运算符有两种方式，即前缀或后缀。前缀版本会先增加值再赋值，而后缀版本会先赋值再增加值。\n\
    \n以下代码显示了一元运算符的使用：\n\n```java\npublic class UnaryDemo {\n    public static void\
    \ main(String[] args) {\n        int x = 3;\n        int y = x++;\n        int\
    \ z = ++x;\n        x = -x;\n        boolean answer = false;\n        answer =\
    \ !answer;\n\n        System.out.println(\"y (后缀自增): \" + y);\n        System.out.println(\"\
    z (前缀自增): \" + z);\n        System.out.println(\"x (取反): \" + x);\n        System.out.println(\"\
    answer (逻辑取反): \" + answer);\n    }\n}\n```\n"
