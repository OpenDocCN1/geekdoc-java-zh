  md: '# Short-circuit behavior


    The logical operator && will test the second expression only if the first expression
    is true. If the first expression is false, it will not check the second expression.
    Similarly, the logical operator || will test the second expression only if the
    first expression is false. If the first expression is true, it will not check
    the second expression. This is called short-circuit behavior.


    The following example shows the use of conditional and logical operators:


