  md: '# 7.4.2 Vector class


    The Vector class is similar to the ArrayList class except that it provides a means
    to control the capacity increment for storage optimization. The Vector list can
    also grow and shrink dynamically and the elements can be accessed using the index
    number. The Vector class also differs from ArrayList as the methods of Vector
    are synchronized and thread-safe. It also contains some legacy methods which do
    not belong to the Collections framework.


    Constructors of the Vector class:


    Vector(): Creates an empty vector with an initial array size of 10.


    Vector(Collectionextends E> c): Creates a vector with elements of the specified
    collection, c stored in the order it was returned by the collection''s iterator.


    Vector(int initCapacity): Creates an empty vector with the specified initial capacity.


    Vector(int initCapacity, int capIncrement): Creates a vector with the specified
    initial capacity and increment capacity.


