  md: '# 3,2 Access specifiers


    In Java, apart from encapsulating the data members and methods in a class, further
    restriction on access can be provided by using access specifiers. Java provides
    the public, private, and protected access specifiers that provide different levels
    of visibility to a class, field, and method. When no access specifier is mentioned
    for a class member, the default accessibility is package or default.


    The access specifiers supported by Java are as follows:


    The public access specifier makes a field, method, or class visible to any class
    in a Java application within the same package or another package. Hence, it is
    the least restrictive of all access specifiers.


    With the introduction to JPMS in JDK 9, the meaning of the public has been elevated
    to the module level as well based on the declaration of exports in the module-info.java
    file. With modules, the public keyword can be applied as:


    **Public only within the module**: The public classes of a package within a module
    that are not exported using the exports keyword will be accessible only within
    the module. For example:


    ```

    module com.ModuleA{

    }

    ```'
