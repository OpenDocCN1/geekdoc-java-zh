  md: 'Lambda expressions were added to Java in Java SE 8 to introduce functional
    programming. A Lambda expression is a function that does not belong to any class
    and it can be passed as an object or executed as and when required. Lambda expressions
    help to visualize functional programming in the object-oriented programming world.
