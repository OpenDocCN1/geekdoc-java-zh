  md: '# 1.8 Setting up the path for JDK


    To work with JDK, the path of the bin folder must be set in the system environment
    variable named The PATH variable is set to point to the executables and java.exe
    so that these commands can be executed from any directory without having to specify
    the full path.


    To set the PATH variable from the Command Prompt window, type the following command:


    ```

    C:\>set path:\\bin

