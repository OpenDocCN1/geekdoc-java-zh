  md: '# Passing arguments by value


    When arguments are passed by value, a copy of the argument is passed from the
    calling method to the called method. In this case, any modification done to the
    argument within the called method will not reflect in the calling method.


    The following example shows how to pass the argument by value:


    ```

    public class PassByVal {


    public void modifyVal(int val) {

    val = val + 10;

    }


    public static void main(String[] args) {

    int val = 10;

    PassByVal obj1 = new PassByVal();


    obj1.modifyVal(val);

    System.out.println("Value of val after method invocation is " + val);

    }

    }

    ```


