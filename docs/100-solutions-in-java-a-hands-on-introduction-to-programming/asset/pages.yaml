    Until JDK 8, the packages were directly stored under the source folder whereas
    JDK 9 onwards, the packages are now stored under a module root folder. From the
    module root folder, the structure is again the same as earlier versions.


    The steps for Java SE 8 and earlier versions are as follows:


    Create one or more source folders.'
