- img_proc: true
  md: 'Chapter introduces the concept of object-oriented programming and explains
    how Java has evolved as an object-oriented programming (OOP) language. It explains
    the versions and features of Java and steps to create an application by using
    JDK and JDK 10.


    Chapter discusses the different programming constructs of the Java language such
    as comments, variables, data types, and operators. It also shows you the use of
    decision-making constructs, looping constructs, and branch statements.


    Chapter introduces Java classes, objects, variables, methods, access specifiers,
    and constructors. It explains the implementation of polymorphism, the creation
    of packages, and the use of keywords such as static, final, and this keyword.


    Chapter discusses the different types of Arrays and String class. It also shows
    you the use of StringBuilder and StringTokenizer classes, command-line arguments,
    and wrapper classes.


    Chapter discusses the concept of inheritance in Java in depth and different ways
    of implementing inheritance by using abstract classes, nested classes, and so
    on. It also explains the user interfaces and lambda expressions.


    Chapter describes exception handling with built-in exception classes and custom
    exceptions. It further introduces the important classes of the java.lang and java.util.regex
    packages.'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'Chapter introduces the more advanced features such as the Collections framework
    with the different utility classes and interfaces of the java.util package.


    Chapter describes the use of generics in Java to create generic classes, methods,
    and collections. It also introduces the Time API that provides better support
    for date and time.


    Chapter describes different types of streams of the java.io package for file management.
    Further, it introduces the different classes of the java.util.zip and java.nio
    packages.


    Chapter explains how to create thread and multithreading to improve the performance
    of applications. It also describes how to connect to databases by using the JDBC
    API.


    Chapter explains the use of design patterns as solutions to common problems encountered
    during software development. It also describes internationalization and localization
    of an application.


    Chapter describes some prominent new features of Java 8 to 10 such as the Java
    Platform Module System (JPMS), JShell, JLink tool, local variable type Inference,
    and so on.'
