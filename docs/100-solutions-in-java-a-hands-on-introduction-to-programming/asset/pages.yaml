  md: '#  5.6 Lambda expressions


    Java being an object-oriented programming language, everything in Java can reside
    only within a class and can be accessed by its object. This is applicable to functions
    as well. Some functional languages such as JavaScript, C++, etc. allow you to
    write functions and use as required. Some of the languages support both functional
    as well as object-oriented programming.


    Object-oriented programming is desirable but leads to a lot of verbosity in a
    program. For example, to create an instance of the Runnable class, generally,
    an anonymous class would be used as follows:


    ```

    Runnable r = new Runnable(){

    @Override

    public void run() {

    System.out.println("This is Runnable");

    }

    }

    ```


    In the preceding code, the only useful part is the code of the run() method. Rest
    all code is simply because of Java programming rules. With Java 8 functional interfaces
    and lambda expressions, the code can be made smaller and cleaner by removing the
    unnecessary code statements.'
