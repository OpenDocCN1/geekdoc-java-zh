  md: '# 1.6 Features of Java SE 9 and Java SE 10


    The release, Java 8, was full of various new features that had made a significant
    impact on application development with Java. Until JDK 8, every JRE had all the
    classes for the runtime bundled into a single Java Archive (JAR) called rt.jar
    that was present in the lib directory. This led to a large number of unnecessary
    classes getting to the runtime leading to overhead for the JVM. Thus, the JAR
    becomes bulky in size and the execution environment is forced to deal with all
    the classes whether or not they are used.


    But Java SE 9 comes with more versatility and customization and a hoard of new
    features. The most important of them is the Jigsaw project which applies the new
    module system to break the JRE into reusable and interoperable components. The
    programming code is divided into modules that contain the tasks to be executed
    by them. This makes programs reusable and easier to manage and debug.


    Another advantage of modularity is that it makes the Java platform more lightweight
    and scalable so that programs can run on smaller devices with fewer resources.
    The modular JRE can be used even with embedded systems allowing IoT apps to be
    coded by using Java.


    Here are some new and exciting features of Java SE 9:'
  merge: -1
  pgno: 50
- img_proc: true
  md: 'Java Platform Module System (JPMS): This is the most important feature of Java
    SE 9. The important issues encountered with the growing codebase of a system are:


    Difficulty to encapsulate code


    Lack of clarity of dependencies among the various aspects (JARs)


    Easy access of public classes on the classpath leading to injudicious usage


    Lack of surety about the availability of all required JARs on the classpath


    All these issues are addressed by the module system by using a module descriptor
    within the modular JARs. In this file, a module can define the list of all other
    modules on which it is dependent by using the requires statements. Further, to
    make packages of a module accessible to other modules, the exports keyword is
    used. If the exports keyword is not used with a package, it is encapsulated in
    that module by default as shown in the in the following image:'
