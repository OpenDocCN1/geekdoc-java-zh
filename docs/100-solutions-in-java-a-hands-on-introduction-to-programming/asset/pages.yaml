  md: '# 7.4 List interface


    Lists are collections created by implementing the List interface which is an extension
    of the Collection interface. Lists are ordered collections that allow duplicate
    values and multiple null elements. Elements of a list index can be accessed/searched
    using an integer index. Similar to Java arrays, the list index begins at zero
    and the last index is size-1. Collections can be manipulated by the methods of
    the List interface through position-based operations. The List interface uses
    an index internally to order the elements that are added to a list. The List interface
    also provides methods to add and search elements as well as perform range operations.


    The List interface provides the ListIterator to sequentially access the elements
    of the list. It is used to insert and replace elements and for bidirectional access
    along with the normal operations. Here are the additional methods of the List
    interface apart from those inherited from the Collection interface:


    add(int index, E element): Adds the specified element in the list at the position
    specified by the index.


    addAll(int index, Collectionext E>): Adds all the elements of the specified collection,
    c, to the list starting at the given index position.'
