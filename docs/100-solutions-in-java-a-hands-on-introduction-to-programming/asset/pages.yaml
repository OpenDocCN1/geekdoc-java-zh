  md: '# ## 1.11 Java code compilation and execution


    A Java program file with the extension is converted into a bytecode file with
    the extension using the javac compiler. The resulting .class file can then be
    executed on any platform that has its appropriate JVM as shown in the following
    figure:


    ![](img/70651ebceef5c0cb89ccc7cad7a12eef_77_0.png)


    **Figure 1.15:** Java code compilation


    The following figure shows the task of the JRE during code execution:'
  merge: -1
  pgno: 77
- img_proc: true
  md: '![](img/70651ebceef5c0cb89ccc7cad7a12eef_78_0.png)


    The file generated by the compiler is not dependent on the hardware or software
    platform of the target system. The file that contains the main class is passed
    to the JVM. Within the JVM, the file passes through certain components which are
    as follows:


    **Class Loader:** Once the main class is loaded in the memory by the JVM, the
    other classes referenced in the program are loaded through the class loader.


    **Bytecode** The bytecode of the loaded class is checked by the bytecode verifier
    for the presence of any damaged instructions. The checks performed by the bytecode
    verifier are as follows:


    Initialization of variables before usage.


    Method calls and types of object references should match.'
  merge: -1
  pgno: 78
- img_proc: true
  md: 'There is no violation of the rules for accessing private data and methods.


    Access to a local variable is within the runtime stack.


    There should not be any run-time stack overflow.


    If any of the above checks fail, the verifier does not allow the class to be loaded.
    Next, the bytecode is executed by the interpreter.


    **Just-In-Time (JIT) Compiler:** Java 2.0 onwards, the JIT compiler was included
    at runtime to enhance the speed of execution. The job of the JIT compiler is to
    convert the bytecode to native code or platform-specific code to increase the
    performance.'
  merge: -1
