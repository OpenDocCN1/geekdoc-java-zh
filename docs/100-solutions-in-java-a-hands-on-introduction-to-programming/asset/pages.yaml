  md: '# 2.4 Type casting


    Java supports the conversion of one type into another by using the type casting
    feature. Type casting can be of two types, which are as follows:


    **Implicit type** When data of a type is assigned to a variable of the similar
    or larger type, it leads to implicit or automatic conversion of the smaller type
    to the larger type. This is also called type promotion in which even if one operand
    of an expression is larger, the result of the whole expression is promoted to
    the larger type.


    For example,

    int num = 20;


    ```

    double numD = num; // assigning integer value to double type

    ```


    **Explicit type casting:** Java supports conversion of a higher type to a lower
    type, however, at the cost of loss of precision. This is called explicit casting.


    For example,


    ```

    float numF = 45.65f;

    int num = (int) numF; // converting a float value to integer type

    ```'
