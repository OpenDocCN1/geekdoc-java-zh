  md: '# 1.3 Java_platform and editions


    The Java platform is a development and execution environment for Java applications
    which is a mixture of software and hardware components. The following image shows
    the components of a Java platform:


    ![](img/70651ebceef5c0cb89ccc7cad7a12eef_42_0.png)


    Figure 1.3: Java platform


    The above figure depicts the components of a Java platform. It is formed of the
    Java Runtime Environment (JRE) which contains the Java library (Java API) and
    Java Virtual Machine (JVM). In'
  merge: -1
  pgno: 42
- img_proc: true
  md: 'languages such as C and C++, the compiled code is platform dependent as it
    is in the form of executable binary code. However, the Java compiler converts
    the code into an intermediate bytecode which is an optimized set of instructions
    that can be executed on any machine that has the appropriate JVM. Thus, JVM provides
    platform independence to Java code. Each operating system such as Windows, Linux,
    Mac, etc. has its JVM. Thus, Java code follows the principle of write-once use
    many.


    The Java API/library is a collection of ready-to-use components such as calls
    and interfaces that can be used to create applications. For example, the Swing
    library is used to create a **user interface (UI)** of a Java application. Java
    is released under several editions to meet the requirements of a specific type
    of device and application. The following is a brief description of the different
    Java editions:


    **Java Standard Edition (Java** The Java SE platform is the base for creating
    applications that are console or network-based applications mainly for desktop
    computers. It contains the core APIs which include the basic types and classes
    for higher-level programming such as networking, security, **Graphical User Interface
    (GUI)**, database manipulation, and parsing of XML data. It also provides the
    virtual machine, development and deployment tools, and other toolkits and libraries
    for advanced programming.


    **Java Enterprise Edition (Java EE)**: The Java EE platform is an extension of
    the Java SE platform. It provides the tools and APIs for the creation and deployment
    of large-scale, distributed, scalable, multi-tier, reliable, and secure enterprise
    applications with complex business logic.'
  merge: -1
