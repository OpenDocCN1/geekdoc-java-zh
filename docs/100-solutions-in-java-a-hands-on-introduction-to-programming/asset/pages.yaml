    the user only presses the button on a digital panel to set up the process and
    start the machine. However, the internal functioning of the washing machine is
    not known to the user. This means that the non-essential aspect of how the washing
    machine washes the clothes is abstracted from the user. Similarly, abstraction
    can also be implemented in code to hide the unnecessary details from the user.


    To inherit means to acquire some feature or asset from an ancestor. For example,
    a child acquires certain aspects of physical appearance and certain behavior of
    his/her biological parents. In programming also, inheritance plays a similar role.
