  md: '# 6.4 Using the try-with-resources statement


    A resource is any object that needs to be closed once the program is done using
    it. For example, a JDBC connection, a File resource, or a Socket connection. Before
    Java 7, it was required to explicitly close the resources, usually in the finally
    block as there was no auto resource management. However, this approach used to
    cause memory leaks and poor performance if one forgot to close the resource.


    Java SE 7 introduced the try-with-resources statement to declare more than one
    resource at a time and also to ensure that all resources are closed after completion
    of code execution. A resource is any object that implements the java.lang.AutoCloseable
    or java.io.Closeable interface.


    The Closeable interface extends the AutoCloseable interface.


    A Closeable resource is a source or destination of data that can be closed and
    the AutoCloseable interface is used to close a resource when it is no longer needed.'
