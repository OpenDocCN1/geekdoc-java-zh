    Method overriding is a concept that allows you to create a child class method
    with the same signature and return type as that of the parent class.


    Binding of methods and method calls during compile time is called static/early
    binding and at runtime is called dynamic/late binding.


    Abstract classes declare methods to serve as a contract or a standard and simply
    provide a structure but leave the implementation to the inheriting class.


    A class defined within another class is called a nested class.'
