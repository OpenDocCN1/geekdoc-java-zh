  md: '# 1.2 Java_programming language


    Java is a popular object-oriented, platform-independent programming language.
    It allows you to develop a variety of applications that can run on different hardware
    and operating systems. Java also provides a runtime environment for executing
    Java applications on different devices.


    Java was originally developed in 1991 by James Gosling and a team of engineers
    at Sun Microsystems which was later acquired by Oracle Corporation. It was initially
    designed for consumer devices such as washing machines, televisions, etc. For
    such devices, it was necessary to have a language that was small, fast, and platform-independent.
    Languages such as C and C++ were not preferred due to the compiler''s dependence
    on specific CPUs and also high development time and cost. Thus, Java was developed
    as a portable and platform-independent language that could execute code on any
    platform. Initially, it was named Oak but later renamed to Java.


    Even though Java was developed to cater to the programming needs for smaller devices,
    it was found to be able to address larger problems, including check casing of
    Web and mobile applications. It gained instant popularity and was adopted all
    over the world for the development of applications, ranging from embedded, desktop,
    Web, and mobile applications. Java can be used to create applications for small
    to large businesses and even for supercomputers.'
  merge: -1
