- img_proc: true
  md: '# Unchecked exceptions


    Errors and runtime exceptions collectively form the unchecked exceptions:


    **Errors**: Errors are not raised by an application but raised externally. For
    example, java.io.IOException is raised if the runtime fails to open a file that
    exists on the system due to some hardware/system issues. The classes for errors
    are provided in the Error class hierarchy. An application may catch this exception
    or leave it to the program to print a stack trace and exit.


    **Runtime exceptions**: The runtime exceptions are caused within an application
    but are not anticipated such as logical errors or inappropriate use of an API.
    Hence, the application does not have any means to recover from such exceptions.
    For example, the user passes the correct value as a method argument but to some
    logical issue, null is passed which leads to an exception. The application may
    handle this exception or eradicate the error that led to the exception. The classes
    for runtime exceptions are provided by the RuntimeException class hierarchy.


    Here are some commonly observed unchecked exceptions:


    ArithmeticException: This occurs when there is an error in an arithmetic expression,
    for example, divide by zero.'
