  md: '# Conditional/Relational


    The conditional operators work on two operands to test the relationship between
    them. The result of a conditional operator will either be true or false. Here
    is a list of the conditional operators supported in Java:


    Equal to (==): Returns true if the two values are equal, else returns false.


    Not Equal to (!): Returns true if the two values are equal, else returns false.


    Greater than (>): Returns true if the value on the left is greater than the value
    on the right, else returns false.


    Less than (<): Returns true if the value on the left is lesser than the value
    on the right, else returns false.


    Greater than or equal to (>=): Returns true if the value on the left is greater
    than or equal to the value on the right, else returns false.


    Less than or equal to (<=): Returns true if the value on the left is less than
    or equal to the value on the left, else returns false.'
