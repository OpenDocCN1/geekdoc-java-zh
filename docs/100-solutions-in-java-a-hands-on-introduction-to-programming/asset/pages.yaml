  md: '# 6.3.3 Best practices for handling exceptions


    Here is a list of the best practices of handling exceptions:


    A try statement must be followed by at least one catch or a finally block.


    Use the finally block to write clean up code.


    Avoid using java.lang.Exception or java.lang.Throwable class to catch exceptions
    that cannot be handled.


    Always provide an appropriate message along with the default message in a catch
    block when an exception occurs.


    Try to handle the exception as near to the source code as possible so that it
    is easy to trace the source.


    Avoid repeated re-throwing of the same exception as it may slow down the program.'
