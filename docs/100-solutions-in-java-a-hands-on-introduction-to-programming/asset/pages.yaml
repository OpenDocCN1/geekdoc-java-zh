  md: '# 7.4.1 ArrayList class


    The ArrayList class implements the List interface and its methods. It is a solution
    to fixed-size arrays of primitive types as it allows you create a variable-length
    array of objects which can dynamically grow or shrink in size. While creating
    an ArrayList object, an initial size must be specified which can increase or decrease
    based on manipulations done on the ArrayList elements.


    The ArrayList class allows all elements, including null. The ArrayList class is
    best suited for random access when insertion/removal of elements is to be done
    only at the end. Each ArrayList instance has a capacity which is the size of the
    array that will increase automatically as elements are added to the list.


    The constructors of the ArrayList class are as follows:


    ArrayList(): Creates an empty list having an initial capacity of 10.


    ArrayList(Collection extends E> c): Creates a list with the elements of the specified
    collection stored in the order they were returned by the collection''s iterator.


    ArrayList(int initialCapacity): Creates an empty list with the specified capacity.'
