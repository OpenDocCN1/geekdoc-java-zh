  md: '# 1.1 Introduction to object-oriented programming


    With the advancement in technology and the increasing complexity of software,
    a requirement of new and flexible modes of programming was observed. A need to
    make reliable software, reduce the overall development and maintenance cost, and
    deliver the software within timelines, resulted in the development of the object-oriented
    programming model.


    The primary focus of object-oriented programming is on objects. Any real-world
    entity that has certain characteristics and behavior that can be used to describe
    it is considered as an object. There are several objects that have certain common
    characteristics. These can be grouped into categories or classes. Thereby, every
