    Checked exceptions are anticipated in a program and appropriate handlers are provided
    for them. For example, suppose a user is prompted to enter a number but the user
    specifies a string, this causes a However, this will not affect the program fatally
    as it will have the code to handle this exception and inform the user with an
    appropriate message. In Java, all exceptions are checked except Error and


    Here are some of the checked exceptions:


    InstantiationException: This occurs when an attempt is made to create an instance
    of an abstract class.


    InterruptedException: This occurs when a thread is interrupted.


    NoSuchMethodException: This occurs when the runtime is unable to resolve the method
