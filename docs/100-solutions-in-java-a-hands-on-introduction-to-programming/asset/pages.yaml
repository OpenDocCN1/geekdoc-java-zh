  md: '# 5.1 Inheritance in Java


    Java provides the concept of inheritance to group classes with similar characteristics
    and creates a class hierarchy. The common characteristics and behaviors are combined
    into a single class termed as the superclass or parent class and all other classes
    that inherit these characteristics and behaviors are termed as subclasses or child
    classes.


    Subclasses inherit all members and methods except the private ones. Constructors
    of the superclass are not inherited but can be invoked from the child class constructor
    directly or by using Subclasses will have its own features along with those inherited
    from the superclass. Declaring members with similar names in the subclass as that
    of the parent class will lead to the hiding of members of the parent class.


    The following figure shows the different types of inheritance in Java:


    ![](img/70651ebceef5c0cb89ccc7cad7a12eef_330_0.png)'
  merge: -1
  pgno: 330
- img_proc: true
  md: '# Figure 5.1: Types of Inheritance


    The different types of inheritance in Java are as follows:


    **Single inheritance:** In single inheritance, a child class can inherit from
    only one parent/superclass.


    **Multilevel inheritance:** In multilevel inheritance, a child class inherits
    from a single parent and the parent can inherit from another single class itself.


    **Hierarchical inheritance:** In hierarchical inheritance, a parent/superclass
    can have more than one child classes that in turn may have other child classes
    at different levels.


    **Multiple inheritance:** In multiple inheritance, a child class can inherit from
    more than one parent/superclasses. Java does not support multiple inheritance
    with classes due to an issue called the diamond problem.


    The diamond problem is a situation when there is one abstract class A that is
    inherited by two subclasses, B and Assume that the abstract class has a method
    called This method will be overridden in both subclasses. Now, another class,
