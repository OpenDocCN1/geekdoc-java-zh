  md: "# 6.1 Exceptions in Java\n\nAny abnormal or unexpected event occurring in a\
    \ program that disrupts its normal execution is termed as an exception. There\
    \ can be different types of exceptions and reasons for exceptions such as an attempt\
    \ to open a file that does not exist, invalid data specified to a method, network\
    \ connection error, or out of memory error. The information about the error is\
    \ stored in the exception object that is passed to the runtime.\n\nAn exception\
    \ occurring in a method can be thrown by using the exception object of the type\
    \ of exception that occurred. The runtime looks for a handler code that can handle\
    \ the exception in the same method. If it does not find a handler, it searches\
    \ the entire method call stack to find an appropriate exception handler. If the\
    \ runtime does not find a handler in the entire call stack, it will eventually\
    \ terminate the program.\n\nThe sequence in which methods are invoked inside another\
    \ method(s) is called a call stack. A stack trace shows the sequence in which\
    \ methods were invoked that led to the exception.\n\nFor example, consider the\
    \ following partial code:\n\n```\npublic void methodOne(){\n    methodTwo();\n\
    }\n```"
