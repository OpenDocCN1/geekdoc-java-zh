  md: '# 1.13 Creating and executing a Java program using JDK 10


    Until JDK 8, developers generally used the directory structure src/main/java for
    the source directory. For example, the main class file Hello.java would typically
    be present in a package com.pkg1.app and the overall path would be src/main/com/pkg1/Hello.java.
    This has been the traditional mode of organizing code so far. However, with the
    new JPMS from Java SE 9 onwards, the mode of structuring and writing code has
    been modified.


    A Java 9 module is a self-describing collection of code and data. It can contain
    several packages that in turn may have one or more classes, interfaces, etc. The
    module may also contain resource files, property files, etc. To create a complete
    application, a collection of such modules needs to be integrated. Each module
    is a building block with a larger structure. In short, instead of creating one
    huge Java project, now it is possible to create multiple modular functional units
    that can be integrated to form an application and also can be reused for other
    applications.


    To create and execute a Java program in JDK 10, perform the following steps:


    Create a module with a unique name, for example,'
  merge: -1
  pgno: 85
- img_proc: true
  md: 'Create a root folder for the module – this needs to be done for each module.
    The module root folder should have the same name as the module. So, the root folder
    for the module in this case would be


    Add the module code inside the module root folder. Begin with packages from the
    module root folder onwards. For example, create a package hierarchy mypkg\util
    inside the module folder moduleleone and add a class Hello.java in the com.mypkg.util
    package. The folder structure, in this case, is shown in the following screenshot:


