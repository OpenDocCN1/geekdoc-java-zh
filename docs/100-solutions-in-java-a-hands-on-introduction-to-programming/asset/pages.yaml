    Traversing collections means iterating through a collection to access/manipulate
    its elements. In Java, the following two approaches are commonly used to traverse
    collections:


    For-each/Enhanced for loop: The for-each loop (enhanced for loop), added in Java
    SE 5, is a control flow statement used to traverse a collection. However, unlike
    the for loop construct, the for-each loop does not maintain an explicit counter,
    that is, a for-each loop will do this for every element in this set instead of
    do this x


    Internally, for-each behaves in the same manner as Therefore, it is preferred
    over Iterator when reading each element, one by one and in order, since for-each
    is more convenient and concise.


    Syntax:


    ```

    for(Object obj);

    System.out.println(obj);

    ```


    Since the for-each construct does not maintain an explicit index, it does not
    allow removal of the current element by using the remove() method.'
