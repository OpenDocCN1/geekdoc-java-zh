  md: '# 1.2.1 Features and advantages of Java


    Following are some features and advantages of the Java programming language:


    Simple and robust: The Java syntax is derived from its predecessor programming
    languages like C, C++. This makes it easy for developers to learn Java quickly.
    Further, the complexity of pointers, operator overloading, multiple inheritances
    and other such features has been removed in Java. Instead, it has been made more
    robust through efficient memory management and exception handling features.


    Java is based on the object-oriented programming paradigm. Thereby, it is well
    suited for the development of real-world applications.


    Platform independent: Java provides a solution to a major problem faced by earlier
    languages, that is, code portability. During compilation, it converts the source
    code into an intermediate, architecture-neutral format called bytecode. This bytecode
    can be executed on any platform which has a Java Virtual Machine (JVM) installed.
    Further, even the language specifications, such as the size of primitive data
    types and operators, have been defined to be independent of the hardware. This
    ensures that the code will function properly in case of a change in the operating
    system, processor, or system resources.'
  merge: -1
  pgno: 39
- img_proc: true
  md: 'Security is an important issue in Java applications since they are designed
    for multiple and distributed platforms. Java provides security checks at different
    levels during application development. The JVM is designed to apply its security
    features during code execution to ensure that the code is well-formed and written
    as per Java standards.


    Java supports the development of multithreaded applications to perform multiple
    tasks concurrently. In a multithreaded application, a single program can have
    multiple threads performing tasks independently and concurrently. Java allows
    you to create thread pools that can be used to obtain threads when required.


    **Java** supports distributed programming to deploy and access resources across
    the network. It provides several Application Programming Interfaces (APIs) to
    handle remote transmission and requests over a network. Java also allows dynamic
    execution of classes by storing them in a separate location and loading the necessary
    classes dynamically at runtime.


    **Modular:** The concept of modularity has been introduced since Java 9. It was
    supposed to be incorporated in Java 7 and Java 8 but was not accomplished. Until
    Java 1.8, the packages were bundled into executable .jar files for a Java application.
    But, with Java 9, a new construct called Module has been introduced. A module
    is similar to the JAR file but unlike the JAR file, it also contains the configuration
    information in the form of a module-'
  merge: -1
  pgno: 40
- img_proc: true
  md: info.java file. This allows a module to be more powerful and flexible as compared
    to a JAR file since all dependencies are specified in the module-info.java file.
    While using a JAR file, the entire JAR file is loaded during application execution,
    but with the module, only those modules that are part of the dependency list will
    be loaded. This allows applications to remain light-weight as well as execute
    faster.
