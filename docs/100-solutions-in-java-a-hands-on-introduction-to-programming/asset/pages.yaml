    An interface with exactly one abstract method is called a functional interface.
    The @FunctionalInterface annotation has been added to Java to mark an interface
    as a functional interface. It is not required to use the annotation, but advisable
    as a best practice to avoid the addition of extra methods accidentally. If more
    than one abstract method is added to an interface annotated with the @FunctionalInterface
    annotation, it throws a compiler error.


    The most important benefit of functional interfaces is that lambda expressions
    can be used to instantiate them to avoid bulky anonymous class implementation.


    Java 8 Collections API has been rewritten and the new Stream API has been added
    which uses a lot of functional interfaces. A new package called java.util.function,
    including several functional interfaces has been added to provide target types
    for lambda expressions and method references. Some of the useful Java 8 functional
    interfaces are Consumer, Supplier, Function, and Predicate. java.lang.Runnable
    is a great example of a functional interface with a single abstract method


