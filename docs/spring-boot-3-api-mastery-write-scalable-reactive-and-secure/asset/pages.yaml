  md: '# Asynchronous APIs with Spring Cloud Stream and Apache Kafka 201


    spring.cloud.stream.bindings.handleShipmentEvent-in-0.group=${spring.application.name}


    The first Spring Cloud property is used to specify what the default binder is,
    in case the project imports multiple binders. The second is used to specify the
    functions to be used in the framework. The third allows us to define the URL (or
    URLs, if we have a cluster of nodes) of the Kafka broker. The fourth allows us
    to specify the maximum number of records returned by a single poll() call, that
    is, that we can use the following nomenclature to retrieve properties from a topic:
    spring.cloud.kafka.binder.consumer-properties.<kafka property>. You can take a
    look at this link to learn about all the properties available for Kafka consumers:
    https://docs.confluent.io/platform/current/installation/configuration-configs.html.
    Similarly, you can set properties for kafka producers using spring.cloud.stream.kafka.binder.producer-properties.<kafka
    property>. The last two are used to specify the name of the topic on which the
    consumer with the binding name handleShipmentEvent-in-0 should read and the name
    of the consumer''s groupId. All consumers with the same groupId will read from
    different partitions (they are therefore part of the same message group).


