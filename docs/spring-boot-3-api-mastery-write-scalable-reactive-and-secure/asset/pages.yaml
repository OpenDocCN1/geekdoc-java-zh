  md: "The operations section is used to specify the name and type of the operation\
    \ (send-\nreceive), also as the channel (i.e., for Kafka, the topic on which to\
    \ receive the message).\nThe optional bindings part, inside operations, is used\
    \ to indicate information about the\noperation specific to the message broker\
    \ used, such as the name of the groupID:\n\n```\noperations:\n  handleShipmentEvent:\n\
    \    action: receive\n    channel:\n      $ref: '#channels/shipmentEventTopic'\n\
    \    bindings:\n      kafka:\n        bindingVersion: '0.5.0'\ngroupId:\n    \
    \    type: string\n        enum: ['operation-service']\n```\n\nThe channels section\
    \ is used to specify the channel on which the application writes or\nreads messages.\
    \ Again, the bindings portion is used to indicate information specific to the\n\
    Kafka channel, such as the number of topic partitions. Refer to the following\
    \ code for a\nbetter understanding:\n\n```\nchannels:\n  shipmentEventTopic:\n\
    \    description: Kafka channel for shipping events\n    address: shipment_event_topic\n\
    \  messages:\n    shipmentEvent:\n      $ref: '#components/messages/ShipmentEventMessage'\n\
    ```\n\n```\nbindings:\n  kafka:\n    bindingVersion: '0.5.0'\n    partitions:\
    \ 10\n    replicas: 1\n```\n\nThe components section, similar to OpenAPI, is used\
    \ to define the structure of the objects\nutilized by operations:\n\n```\ncomponents:\n\
    \  messages:\n```"
