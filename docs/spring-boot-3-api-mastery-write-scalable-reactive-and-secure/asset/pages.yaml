  md: "# 156 Spring Boot 3 API Mastery\n\nby our ErrorHandler, the latter only handles\
    \ exceptions for REST requests; it would not work for gRPC. In order to centralize\
    \ gRPC API errors, we can still use the same approach used for REST while using\
    \ different annotations, i.e., we can annotate with @GrpcAdvice, the class that\
    \ acts as the error handler, and we can annotate it with @ExceptionHandler. Create\
    \ the exception subpackage within the grpc package and write a class that acts\
    \ as an error handler for the gRPC service you just created, as shown below:\n\
    \n@GrpcAdvice\n\n```\npublic class ErrorHandlerProtoHandler {\n\n    @GrpcExceptionHandler(ProductNotFoundException.class)\n\
    \    public StatusRuntimeException handle(ProductNotFoundException ex) {\n   \
    \     var status = Status.NOT_FOUND\n            .withDescription(ex.getMessage())\n\
    \            .withCause(ex);\n        return status.asRuntimeException();\n  \
    \  }\n}\n```\n\nThe GrpcExceptionHandler annotation can define one or more exception\
    \ types. In such cases, only the specified types will be handled by the annotated\
    \ method. The method's parameters must be compatible with the specified exception\
    \ types, meaning that each exception type in the annotation must match or be a\
    \ superclass of at least one of the method's parameters.\n\nThe method of the\
    \ handler returns an object of type StatusRuntimeException which allows the API's\
    \ status information to be propagated through an exception of type RuntimeException.\
    \ Status in gRPC is the concept of HTTP status for REST. Methods of a class annotated\
    \ with @GrpcAdvice must necessarily return one of the object types: Status, StatusException,\
    \ StatusRuntimeException, or Throwable.\n\nWe start the catalog service after\
    \ starting the Postgres container. The gRPC server is started on port 9090. You\
    \ can change this configuration by setting the property grpc.server.port in the\
    \ application.properties file.\n\nIn order to test the service, we can use a tool\
    \ cURL but dedicated to gRPC called grcurl for Mac, Windows, or Linux. Take a\
    \ look at the links https://github.com/fullstorydev/grpcurl?tab=readme-of-file#installation\
    \ and https://github.com/fullstorydev/grpcurl/releases for a better understanding.\n\
    \nIf the product is empty, enter two products with codes 0001 and 0002 using the\
    \ catalog service POST API, as shown below:"
