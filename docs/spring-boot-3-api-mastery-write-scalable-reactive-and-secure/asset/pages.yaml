  md: '# CHAPTER 9


    # # Deploying Applications on Kubernetes with Kind


    # Introduction


    In the previous chapters, we saw how easy it is to create synchronous and asynchronous
    APIs with Spring Boot 3. In addition to learning how to write them as efficiently
    as possible, we also saw in the last part how to shield REST APIs using the edge
    microservice, which acts as an API Gateway. We also saw how to secure APIs using
    Spring Security with the OIDC and OAuth2 standards. Finally, in the last part,
    we saw how to monitor our systems using Spring Boot Actuator. You now have all
    the means at your disposal to release into production a system with well-written,
