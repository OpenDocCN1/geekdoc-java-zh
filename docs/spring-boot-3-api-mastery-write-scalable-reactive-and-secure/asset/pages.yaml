    Docker is a technology for creating and managing containers. As a Container Runtime,
    Docker not only allows containers to be run from OCI images, but also takes care
    of other aspects such as networking and persistence management. It has a client-server
    architecture. The server part is called the Docker Engine, and it is where the
    docker daemon is running all containers lifecycle management, including creating,
    running, stopping, and deleting containers. The client is managed by the Docker
    CLI which allows command line instruction to interact with the Docker Engine through
    commands like **docker build**, **docker run**, and **docker ps**. However, there
    are also graphical clients to manage containers visually. When you install Docker,
    both the client and server parts are installed. However, nothing prohibits from
    connecting the Docker CLI to a remote Docker Engine. *Figure 9.2 shows an overview
    of Docker’s architecture:


    ![](img/95a54431500295eb58dcb6c7b7f7528e_297_0.png)


    **Figure 9.2: An overview of Docker’s client-server architecture**


    Containers are created from Docker images or from OCI-compliant images. Images
