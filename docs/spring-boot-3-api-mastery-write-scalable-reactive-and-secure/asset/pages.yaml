    # Understanding virtual threads in Java


    Virtual threads are a new killer feature of Java, introduced in preview mode with
    JDK 19 and incorporated permanently in Java Development Kit (JDK) 21. Virtual
    threads are lightweight threads that reduce the effort of writing, monitoring,
    and debugging concurrent-throughput applications. Before going into detail about
    how they work, it behoes us to explain why the concept of threads is so important
    in Java.


    # Platform threads vs. virtual threads


    Java is a multi-threaded language. Each instruction is executed on a thread, and
    because of multi-threading, multiple instructions are executed in parallel. Each
    thread provides a stack to store local variables and a context when an exception
    is thrown. Developers can read the thread''s stack trace to analyze an error.
    Before the virtual threads feature, the concurrency model in Java was uniquely
    implemented through platform threads.


    Platform threads are wrappers of operating system threads. We can say that platform
    threads are 1:1 with operating system threads. Creating many threads with this
    concurrency model, therefore, involves consuming a lot of computational resources.
    The number of threads you can create depends on the number of threads supported
    by the operating system.


    Virtual threads, like platform threads, are instances of java.lang.Thread, but
    they are not associated 1:1 with operating system threads. Specifically, when
    a virtual thread is created,'
  merge: -1
