    \ Java classes from the proto files located src/main/proto folder. Then, we will\
    \ create the proto folder inside and write the following product.proto file:\n\
    \n```\nsyntax = \"proto3\"\n\noption java_multiple_files = true;\noption java_package\
    \ = \"com.easyshop.catalogservice.proto\";\noption java_outer_classname = \"ProductProto\"\
    ;\n\nservice ProductService {\n  rpc FindFindByCode(ProductRequest) returns (ProductProtoResponse);\n\
    }\n\nmessage ProductProtoRequest {\n  string code = 1;\n}\n\nmessage ProductProtoResponse\
    \ {\n  string code = 1;\n  string category = 2;\n  int64 price = 3;\n}\n```\n\n\
    Let us analyze the file, refer to the following points for a better understanding.\
    \ In this case,\n\n+   - The syntax = \"proto3\" line indicates the version of\
    \ the proto used. In this case, we use the latest version 3.\n\n+   - The java_multiple_files\
