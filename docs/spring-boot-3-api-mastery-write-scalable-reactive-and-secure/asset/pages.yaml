    # # A new synchronous REST client: RestClient


    With the release of Spring 6 and Spring Boot 3, a new synchronous HTTP client
    called RestClient, is available in the framework. Compared to the RestTemplate,
    which was the only synchronous client available by Spring version 5, RestClient
    offers a more modern set of APIs that the Fluent approach instead of the template
    pattern. We can say that RestClient is the synchronous version of WebClient, the
    reactive client we saw in the previous chapter shares most of the methods, as
    shown in Figure 3.5:


    ```

    public interface WebClient { } public interface RestClient { extends ClientInterceptor
    { }

    public class RestTemplate extends RestOperations { extends RestOperations { }

    @Override

    public RestClient get() { }

    @Override

    public RestClient get(Object uri, Class<?> responseType) { // }

    @Override

    public RestClient post() { }

    @Override

    public RestClient put() { }

    @Override

    public RestClient patch() { }

    @Override

    public RestClient delete() { }

    @Override

