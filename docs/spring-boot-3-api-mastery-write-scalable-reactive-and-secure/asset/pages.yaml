    # Deploy your API locally with Kind


    In order to create a Kubernetes cluster locally, we have several tools available
    that allow us to do so, such as Docker Desktop itself. However, in this book,
    we have chosen to use Kind (Kubernetes in Docker), a tool that allows you to run
    a Kubernetes cluster locally using containers that act as nodes. Kind allows you,
    unlike other tools, to create a multi-node cluster in a customized way, for example,
    you can set how many worker nodes and how many control plane nodes to create.


    # Installation and creation of the cluster


    You can install Kind on Linux, Windows, and macOS. On macOS and Windows, you can
    use installation via Package Manager by running the following commands:


    ```

    brew install kind # For macOS

    winget install kubernetes.kind #For Windows

    ```


    You can also install Kind via release binaries. On Linux, the command is as follows:


    ```

    # For AMD64

    [ $(uname -m) = x86_64 ] && curl -Lo ./kind https://kind.sigs.k8s.io/dl/

    v24.0/kind-linux-amd64

    ```


    ```

    # For ARM64

    [ $(uname -m) = aarch64 ] && curl -Lo ./kind https://kind.sigs.k8s.io/dl/

    v24.0/kind-linux-arm64

    chmod +x ./kind

    sudo mv ./kind /usr/local/bin/kind

    ```'
