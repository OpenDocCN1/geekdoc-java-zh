    \nSince the edge service uses a reactive context, we need to enable automatic\
    \ context propagation. With Spring Boot 3, which uses Project Reactor 3, this\
    \ is very simple: just add the `Hooks.enableAutomaticContextPropagation()` line\
    \ in EdgeServiceApplication:\n\n```\n@SpringBootApplication\npublic class EdgeServiceApplication\
    \ {\n\n    public static void main(String[] args) {\n        SpringApplication.run(EdgeServiceApplication.class,\
    \ args);\n        Hooks.enableAutomaticContextPropagation();\n    }\n}\n```\n\n\
    In earlier versions of Spring Boot, context propagation required much more code\
    \ to be written."
