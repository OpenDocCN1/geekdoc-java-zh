    \ 1\nurl: http://tempo:3200\nbasicAuth: false\nisDefault: true\nversion: 1\neditable:\
    \ false\napiVersion: 1\nuid: tempo\njsonData:\n  httpMethod: GET\n  tracesToLogs:\n\
