  md: "# 184 Spring Boot 3 API Mastery\n\nThe composition must follow reasonable logic:\
    \ you cannot use the output of a function of type Consumer as the input of another\
    \ function.\n\nRegarding type conversion, Spring Cloud Function uses the MessageConverter\
    \ interface to convert incoming data of type org.springframework.messaging.Message\
    \ into the type declared in the function and use the ConversionService interface\
    \ if the incoming data is not of type Message. However, in most cases, MessageConverter\
    \ will always be used since HTTP or messaging requests will be automatically converted\
    \ to the Message interface by Spring. The Message interface consists of the following\
    \ methods:\n\n```\npublic interface Message<T> {\n    T getPayload();\n    MessageHeaders\
    \ getHeaders();\n}\n```\n\nYou can choose to use the payload class directly in\
    \ your functions, or you can choose to use Message to get information about the\
    \ headers as. However, if not used explicitly, at write time, your payload will\
    \ be converted to Message, and at read time, Message will be converted to your\
    \ payload, this is to the MessageConverter interface, which is as follows:\n\n\
    ```\npublic interface MessageConverter {\n    Object fromMessage(Message<?> message,\
    \ Class<?> targetClass);\n    Message<?> toMessage(Object payload, @Nullable MessageHeaders\
    \ headers);\n}\n```\n\n# Main concepts in Spring Cloud Stream\n\nSpring Cloud\
    \ Stream provides an abstraction to the messaging technology being used. The same\
    \ code can be used to send/receive messages from different message brokers.\n\n\
    The main components of the framework are:\n\n+   - Destination binders: These\
    \ are the components responsible for providing integration with external messaging\
    \ systems.\n- Bindings: It is the bridge between external messaging systems and\
    \ the application provided by Message Producers and Consumers. Bindings that read\
    \ data are input bindings, and those that write data are output bindings.\n- Message:\
    \ The canonical data structure used by producers and consumers to communicate\
    \ with Destination Binders.\n\nFigure 6.8 shows a function that transparently\
    \ reads from a RabbitMQ queue and writes to an Apache Kafka topic:"
