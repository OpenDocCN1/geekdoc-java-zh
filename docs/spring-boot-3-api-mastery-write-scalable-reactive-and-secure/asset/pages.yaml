  md: "```\nclass ShipmentEventFunctions {\n```\n\n```\n@Autowired\nprivate InputDestination\
    \ input;\n\n@Autowired\nprivate ObjectMapper objectMapper;\n\n@MockBean\nprivate\
    \ OrderRepository orderRepository;\n\n@MockBean\nprivate Consumer<ErrorMessage>\
    \ handleShipmentEventError;\n}\n```\n\nWe annotate the class with @SpringBoot,\
    \ the test class initializes all Spring context. However, we do not need to import\
    \ the datasource context, so we exclude datasource configurations with @EnableAutoConfiguration.\
    \ To use the binder, we import the TestChannelBinderConfiguration class. We also\
    \ enable the test profile with @ActiveProfiles(\"test\") such that JDBC auditing\
    \ is disabled. We then modify the configuration of DataConfig class in this manner:\n\
    \n```\n@Configuration\n@EnableJdbcAuditing\n@Profile(\"!test\")\npublic class\
    \ DataConfig {\n}\n```\n\nWe now turn to writing a test method. The TestChannelBinderConfiguration\
    \ provides us the InputDestination and OutputDestination classes for testing input\
    \ and output bindings. In this case, since the order service is a consumer, we\
