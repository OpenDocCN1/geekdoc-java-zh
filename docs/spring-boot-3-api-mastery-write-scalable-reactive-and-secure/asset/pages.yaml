    The OpenAPI document in the example is in Yet Another Markup Language (YAML) format,
    which is also the most used format in the OpenAPI standard. However, JSON format
    is also allowed. For more details on the OpenAPI specification, you can take a
    look at the following link: https://swagger.io/specification/


    Swagger is an ecosystem of tools that supports the use of OpenAPI. It includes
    the following features:


    +   - Swagger editor: It is an online editor for creating, editing, and testing
    OpenAPI specifications using an intuitive interface. Refer to https://editor.swagger.io/


    +   - Swagger UI: It is a interface library that generates interactive documentation
    for APIs described through OpenAPI. This documentation is generated automatically
