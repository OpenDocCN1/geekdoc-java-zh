    # Fundamentals of REST architecture


    In the previous section, we mentioned that in synchronous communication between
    microservices, the use of REST APIs is the most popular standard. The REST architecture
    is a model for designing distributed systems and building web services. Conceived
    by Roy Fielding in his 2000 doctoral dissertation, REST is an architectural style,
    not a protocol for web API design. As mentioned earlier, it is an architectural
    style, unlike Simple Object Access Protocol (SOAP), a protocol that was used before
    REST was developed. It gives guidelines on how to develop APIs, without specifying
    a particular protocol, although HTTP is almost always used for client/server communication,
    and the JavaScript Object Notation (JSON) format is used for data exchange. REST
    is based on set of fundamental principles that promote scalability, reliability,
    and simplicity in the design of distributed systems. These principles guide the
    creation of web services that are easily understood, interoperable, and well-adapted
    to the web environment. The fundamental principles of REST are mentioned below:'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# Spring Boot 3 API Mastery


    +   - Stateless: The REST APIs must be stateless, which means that each request
    between client and server must contain all the information necessary to process
    it. The server must not maintain any information about the client''s session state
    between requests. This principle simplifies server management and promotes horizontal
    scalability.


    +   - Uniform interfaces: It must define a well-defined set of operations for
    accessing and manipulating resources. A resource is described using a Uniform
    Resource Identifier (URI). Manipulations of resources are performed by standard
    operations, such as retrieving a resource using the HTTP GET verb or creating
    a new resource using the HTTP POST verb.


    +   - Client-server architecture: The client manages resources via URI, not to
    know what is going on behind the scenes in the servers. For example, the client
    might request the deletion of a resource via its URI and the HTTP DELETE. server,
    on the other hand, will delete the resource. Whether it is a physical deletion
    or a logical deletion is hidden from the client. The important thing is that,
    if the client tries to retrieve the resource, it receives a 404 Not Found.


    +   - Cacheability: REST promotes both client-side and server-side caching to
    enhance performance and reduce server load. Client-side caching allows the client
    to store responses locally, minimizing repeated requests, while server-side caching
    offloads work from the server by storing responses directly on the server or in
    middleware such as proxies and Content Delivery Networks (CDNs). You caching behavior,
    server responses should include relevant cache headers, such as Cache-Control,
    indicating how and a resource can be cached by clients or intermediaries.


    +   - Layered system: REST favors the use of a layered system. For example, an
    API REST could be created by reverse proxy, load balances, and API gateway, to
    favor scalability and the responsibility of cross-cutting concerns (concepts that
    do not concern business logic, such as safety and logging). However, the division
    into layers should not impact the client.


    Now that we have defined the fundamentals of REST, we can focus on best practices
    on how to write REST APIs.


    # Restful API design


    In order to write good REST APIs, you need to know the Richardson Maturity Model.
    This model gives guidelines for creating REST services, consists of four levels
    (zero to three), each getting closer and closer to what the ideal REST API should
    look like. If the constraints of level are met, the so-called Glory of REST is
    achieved, and the API can be called RESTful. Let us look at all four levels in
    detail. We will show you an example of an API where the client requests the information
    of a user with ID one. Figure 1.8 shows how the API evolves for each level:'
