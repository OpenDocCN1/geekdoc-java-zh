  md: 'There is a more advanced polling technique called long polling, where the client
    sends a request to the server; the server keeps the request open until it has
    new data or until a timeout expires. Compared with short polling, this technique
    has the advantage of reducing unnecessary network traffic because the client makes
    fewer requests to the server. However, this technique can keep many connections
    open on the server, which could consume significant resources if the number of
    clients is large. The diagram in Figure 6.2 shows how long polling works:


    # HTTP Long Polling


    ![](img/95a54431500295eb58dcb6c7b7f7528e_189_0.png)


    **Figure 6.2:** Operation of HTTP long polling


    HTTP polling is a simple technique to implement but is not the most efficient
    solution for applications requiring real-time updates or handling large numbers
    of clients. It is used in applications where implementation of more advanced solutions
    such as WebSocket Server-Sent Events (SSE) is considered excessive in complexity
    and a simpler and faster, inefficient implementation, is preferred.


    # Webhook


    Webhooks are a technique used to allow an application to send real-time data to
    other applications over HTTP. Unlike polling, the server sends data to clients
    as soon as it is available. The way it works is as follows: the server provides
    a registration API, where the client specifies as input a callback URL and any
    event types on which it is interested'
