  md: '# Containerizing a Spring Boot application


    Normally, to containerize an application, it would be necessary to write a Dockerfile.
    A Dockerfile is a text file containing commands to assemble an image. For example,
    to create an image of a Spring Boot application, we might write the following
    Dockerfile:


    ```

    FROM openjdk:17-jdk-alpine


    RUN addgroup -S spring && adduser -S spring -G spring


    USER spring:spring


    ARG DEPENDENCY=target/BOOT-INF /app/lib


    COPY ${DEPENDENCY}/META-INF /app/META-INF

    COPY ${DEPENDENCY}/BOOT-INF/classes /app


    ENTRYPOINT ["java", "-cp", "app:lib/*", "hello.Application"]

    ```


    As shown by the example, a source image, in this case of JDK, is always used to
    create an image. However, writing the Dockerfile involves several challenges that
    are not easy to address, such as creating and secure images. Another problem with
    the Dockerfile is the reproducibility of the images. If we create two images for
    the same application, with the same source code and same Dockerfile, at different
    instances, the two images will have different sha (digests).


    Spring Boot uses the Cloud Native Buildpacks (CNBs) project to create OCI images.
    CNBs are an open-source project that includes a set of buildpacks that provide
    a standard for turning application source code into a production-ready OCI image,
    without the need to write a Dockerfile.


    CNBs are particularly useful when you want a standardized and automated process
    for building images without manually maintaining Dockerfiles, ensuring consistency
    and reproducibility across builds. They are well-suited for applications adhering
    to modern development workflows or requiring integration with CI/CD pipelines.


    However, Dockerfiles offer greater flexibility and control over the image creation
    process, making them a better choice for scenarios where custom configurations,
    specific base images, or unique build steps are required. Choosing between CNBs
    and Dockerfiles depends on the level of customization and automation needed in
    your project.


    Specifically, Spring Boot uses Paketo Buildpacks, an implementation of the CNBs
    project, specific to Java (and other applications).


    The buildpack components that help create the application image are mentioned
    below:


    +   - Builder: It is an image that contains a set of buildpacks that provide dependencies
    for the app.'
