    \ the server responds after it has received all the messages from the client.\n\
    \n+   Bidirectional streaming RPC: Both client and server send a stream of messages.\
    \ The logic of stream processing between client and server is application-specific.\
    \ The client and server can read and write messages in any order because the two\
    \ streams are independent. For example, the server could wait to receive all messages\
    \ from the client before sending the message stream, or the server could send\
    \ a message each time it receives one from the client (ping-pong logic).\n\nThe\
    \ following is a proto file that uses all four communication types listed above:\n\
    service HelloWorld\n\n```\nrpc Unary(HelloRequest) returns (HelloResponse);\n\
    rpc ServerStreaming(HelloRequest) returns (stream HelloResponse);\nrpc ClientStreaming(stream\
    \ HelloRequest) returns (HelloResponse);\nrpc BidirStreaming(stream HelloRequest)\
    \ returns (stream HelloResponse);\n\nmessage HelloRequest {\n  string greeting\
    \ = 1;\n}\n\nmessage HelloResponse {\n  string reply = 1;\n}\n```\n\n# Comparison\
    \ of gRPC and REST\n\nFrom the preceding paragraphs, we can already get an idea\
    \ about the differences between gRPC and REST; however, the following points aim\
    \ to detail more about the differences between the two in terms of communication\
    \ protocol, data format, performance, and use cases:\n\n+   Communication protocol:\n\
    \  REST: It uses HTTP/1.1 by default to transmit data. A connection can handle\
    \ one request at a time.\n  gRPC: It uses HTTP/2 by default to transmit data.\
    \ HTTP/2 introduces multiplexing, allowing a single TCP connection to handle several\
    \ requests simultaneously. With this version of the HTTP protocol, gRPC enables\
    \ faster and more efficient communication and exploits the concept of bidirectional\
    \ streaming."
