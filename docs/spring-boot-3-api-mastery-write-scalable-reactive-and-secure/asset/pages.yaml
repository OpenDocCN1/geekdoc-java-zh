  md: "Again, you will find the Tempo configuration file in the infra/docker/tempo\
    \ folder. To use Micrometer Tracing with OpenTelemetry in edge service, we add\
    \ Micrometer's bridge dedicated to OpenTelemetry, as shown below:\n\n```\n<dependency>\n\
    \  <groupId>io.micrometer</groupId>\n  <artifactId>micrometer-tracing-bridge-otel</artifactId>\n\
    </dependency>\n```\n\nIn addition, we will have the application send traces in\
    \ OpenTelemetry format, using OpenTelemetry's exporter dependency for Zipkin,\
