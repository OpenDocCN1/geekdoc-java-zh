  md: 'In general, the server begins transmitting data in response to a client request
    without closing the connection, sending data to chunks as they become available.
    An example of an implementation of HTTP Streaming is HTTP Live Streaming (HLS)
    used for broadcasting live and on-demand video and audio content.


    Another example of an implementation of HTTP Streaming is Server-Sent Events (SSE),
    which is a standard designed to be used on any browser that supports HTML5. Clients
    establish a connection with the server that remains open. The server sends data
    to the client in the form of messages in UTF-8 format, each having a different
    identifier, using the MIME type text/event-stream. The diagram in Figure 6.4 shows
    how SSE works:


    # Server-Sent Events (SSE)


    ![](img/95a54431500295eb58dcb6c7b7f7528e_191_0.png)


    Figure 6.4: a sequence diagram showing the operation of SSE


    HTTP Streaming reduces latency in data delivery compared to polling, since data
    are sent immediately as soon as they are available. It also reduces network overhead
    on servers since a single connection is used to send messages. Using the HTTP/2
    version, it is possible to overcome the unidirectionality of communication (in
    pure HTTP Streaming, the server sends messages to the client, but not vice versa)
    and establish communication with greater speed and efficiency. One implementation
    of HTTP/2 is the gRPC framework. However, it should be kept in mind that not all
    clients support for HTTP/2 and gRPC.'
