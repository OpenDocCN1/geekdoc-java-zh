  md: '# Introduction to REST Architecture and API-First Approach


    A method is considered safe if it does not change the state of the resource. The
    GET method is considered safe because it performs read-only operations.


    On the concept of idempotency, there is some confusion in the REST environment.
    You will often find a definition like, A method is idempotent if, invoked multiple
    times, it always produces the same result.


    I find it more relevant in the mathematical domain. In the REST domain, I prefer
    to define the concept of idempotency as, A method is idempotent if, invoked multiple
    times, it produces no side effects on the server.


    Let us look in detail at what the idempotent HTTP methods are:


    +   The GET method is, does not change the state of the resource, so it is also
    idempotent.


    +   The POST method is not idempotent, as multiple invocations of the same request
    would have the effect of creating more resources.


    +   The PUT method is idempotent, if invoked multiple times, it always modifies
    the resource in the same way, producing no side effects.


    +   The DELETE method is idempotent, if invoked the first time on an existing
    resource, it deletes it. If it is invoked multiple times with the same request,
    no server-side action will be taken, creating no side effects.


    Idempotent methods are methods in which you can safely apply the Retry pattern.


    If we had the first definition of idempotency, we would have had some difficulty
    explaining why the PUT and DELETE methods are idempotent. The PUT method would
    respond with status 201 if the resource does not exist, and for subsequent calls,
    it would respond with 200. The DELETE method would respond 204 the first time
    on an existing resource. It would respond with a 404 when the same request is
    given subsequent times the resource would no longer exist. Table 1.1 shows a summary
    of the concept of idempotency, plus other HTTP methods:


    | HTTP method | Idempotence | Safe |

    |---|---|---|

    | GET | yes | yes |

    | POST | no | no |

    | PUT | yes | no |

    | DELETE | yes | no |

    | PATCH | no | no |

    | HEAD | yes | yes |

    | OPTIONS | yes | yes |


    Table 1.1: Idempotence and safety on HTTP methods'
  merge: -1
