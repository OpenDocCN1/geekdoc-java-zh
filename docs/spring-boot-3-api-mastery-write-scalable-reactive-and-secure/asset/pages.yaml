  md: '# Spring Boot 3 API Mastery


    +   - **Subscriber**: It represents the data consumer within a responsive flow.
    It subscribes to a publisher to receive data elements issued by them, via the
    `onSubscribe()` method and a subscription. The subscriber receives data elements
    via the `onNext()` method, handles any errors via the `onError()` method, and
    signals the completion of the flow via the `onComplete()` method.


    +   - **Subscription**: It represents the subscription contract between a publisher
    and a subscriber. It is responsible for managing communication between the two,
    allowing the subscriber to request data elements from the publisher and to manage
    backpressure by telling it processing capability, Subscription also allows the
    subscriber to cancel the subscription at any time, interrupting the flow of data,
    via the `cancel()` method.


    +   - **Processor**: It represents an entity that acts as both publisher and subscriber
    within a responsive flow. It receives data elements from a publisher, processes
    them according to its business logic, and sends them to the associated subscribers.
    The processor plays a key role in the transformation and processing of data streams
    within a reactive system.


    We now focus on the Reactor library. Reactor implements the publisher interface
    with two classes, Mono and Flux. A Mono object represents a data stream that will
    output one element, while a Flux object represents a data stream that can output
    zero or more elements over time.


    | Cardinality | Sync version | Async version |

    |---|---|---|n| 0..1 | Optional<T> | Mono<T> |

    | 0..N | Collection<T> | Flux<T> |


