  md: "# JSON Web Token\n\nBefore exploring OIDC and OAuth2, it is important to understand\
    \ what JWT is. JWT is an open standard (RFC 7519) for securely representing claims\
    \ between two parties. The token consists of three parts encoded in Base64 and\
    \ separated by the dot (.) character. These parts are as follows:\n\n<header>.<payload>.<signature>\n\
    \nThe header is a JSON object that usually contains information about the token\
    \ type, the algorithm used for signing, and a key identifier:\n\n```\n{\n  \"\
    alg\": \"HS256\",\n  \"type\": \"JWT\",\n  \"kid\": \"6Gk-Y...\"\n}\n```\n\nThe\
    \ payload contains claims, which are information about the logged-in user and\
    \ additional information. Some claims are mandatory, others are recommended. Custom\
    \ claims can also be defined. An example of a payload is as follows:\n\n```\n\
    {\n  \"iss\": \"https://example.issuer.com\",\n  \"sub\": \"mrossi\",\n  \"exp\"\
    : 1719056069,\\n  \"roles\": [\"admin\"]\nn\n```\n\nFigure 7.1: The flow we will\
    \ implement in this chapter using an API Gateway and an IS\n\n![](img/95a54431500295eb58dcb6c7b7f7528e_234_0.png)"
  merge: -1
  pgno: 234
- img_proc: true
  md: '# Spring Boot 3 API Mastery


    The first field indicates the issuer, that is, who generated the token. The sub
    field indicates the subject, that is, an identifier of the logged-in user. The
    exp field indicates the expiration of the token. The tokens must be short-lived
    for security reasons. Finally, the roles field is a custom claim that defines
    the roles of the logged-in user


    The JWT signature is used to verify that the payload has not been altered. To
    create the signature, the encoded header, the encoded payload, and a secret are
    taken, after, using the algorithm specified in the header, for example, if it
    were decided to use the HMACSHA256 algorithm, the signature would be created in
    the following way:


    ```

    HMACSHA256(

    base64UrlEncode(header) + "." +

    base64UrlEncode(payload),

    secret)

    ```


    JWTs can be signed using a secret or using a public and private key.


    The prerequisite of consuming a JWT is that they trust the issuer, that is, the
    entity that generated the token.


    Actually, what we have seen is a JWT of type JSON Web Signature (JWS). If the
    claims are confidential and, therefore, need to be encrypted by the authorization
    server and decrypted by the resource server, a token of type JSON Web Encryption
    (JWE) can be used. However, for our application, we will use JWS.


    # OIDC Connect protocol


    OIDC is an identity layer on top of the OAuth2 protocol that allows an application,
    called Client, to verify the identity of the end user, who identifies himself
    on an authorization server. When authentication is successful, the authorization
    server returns end-user information to the client application in the form of a
    JWT called Identity Token (ID Token). The authentication flow of OIDC is based
    on the authorization code flow of OAuth2.


    The main actors in the OIDC stream are the following:


    +   * User: A person who has a registered client application to access resources.
    In OIDC, it is also called an end-user. In OAuth2, it is not necessarily a person.
    It is called Resource Owner, OAuth2 User, or even end-user in OIDC.

    * Client: An application that requires an ID token to authenticate the user and
    an access token to allow the user to access resources. To do this, the client
    needs to be registered on the authorization server. In OIDC, the client is also
    called a Relying Party (RP). In OAuth2, it is called OAuth2 client.

    * Authorization server: It is an entity that implements the OIDC and OAuth2 protocols.
    It is also called an Identity Provider (IP),'
