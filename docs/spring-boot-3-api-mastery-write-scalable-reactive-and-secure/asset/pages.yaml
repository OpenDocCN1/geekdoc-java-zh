    # Event Loop vs. Thread-request


    Let us see how the reactive paradigm is used handling HTTP requests. In applications
    using a synchronous Servlet Container, the thread-per-request model is applied,
    where for each incoming HTTP request, a thread from a pool managed by the Servlet
    Container is allocated. The thread is responsible for handling the entire lifecycle
    of the request, including processing, I/O operations, and response generation.
    Figure 2.2 shows how the thread-per-request model works; each HTTP request occupies
    a different thread within a thread pool. The thread is released when the request
    finishes its processing.


    ![](img/95a54431500295eb58dcb6c7b7f7528e_47_0.png)


    Figure 2.2: The thread-per-request model


    Intensive processing such as I/O operations, the thread may wait a long time until
    the operation finishes. The number of threads in a thread pool is limited. For
    example, Apache Tomcat, the default number is 200. This means that if the application
    received 201 simultaneous HTTP requests, 200 would be processed in parallel, request
    number 201'
