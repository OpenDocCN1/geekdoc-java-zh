  md: 'Easily Scalable APIs with Virtual Threads 73


    it is associated with an operating system thread, but if it encounters blocking
    operations such as I/O operations, the JVM suspends it until the blocking operation
    is finished. In the meantime, the OS thread is free to be associated with another
    virtual thread.


    # Virtual threads to simplify scalability in Java


    In the previous chapter, we explained that the traditional model for handling
    HTTP requests is the thread-per-request. Server applications to handle concurrent
    requests associate a thread with each HTTP request. The thread is released only
    when the request processing is completed. This programming style is easy to understand,
    implement, and debug. However, with platform threads, there is limited thread
    availability because they are wrappers of the operating system. OS threads are
    expensive, in terms of creation and management. It is not even enough to use the
    thread pool technique of grouping already defined number of threads to eliminate
    the cost of starting new threads. If each HTTP request consumes an operating system
    thread, for its entire duration, number of threads often becomes the limiting
    factor long before other resources, such as CPU or network connection.


    The technique of asynchronous programming, particularly the reactive paradigm,
    can be used to overcome this problem. However, you saw in the previous chapter
    that reactive programming is much more complex than imperative programming, both
    in terms of writing code and debugging.


    Virtual threads allow you to have, through efficient thread management, highly
    scalable applications written using the traditional (and simple) thread-per-request
    technique. The result is that you can have the same scalability as asynchronous
    programming, but in a transparent way, facilitating software development.


    # Virtual threads in detail


    Virtual threads in Java came through Project Loom. They were initially called
    fibers. Virtual threads, as opposed to platform threads, are scheduled not by
    the operating system, but by the JVM. This makes it possible to overlook the time
    involved in thread creation and context switching, which is the technique used
    by the operating system to switch from one process to another on a single CPU.
    Of course, there is still an association with OS threads, but it is not 1:1 with
    platform threads. Specifically, the JVM associates a virtual thread with a platform
    thread called a carrier thread. The virtual thread remains associated with the
    carrier thread until it encounters a blocking operation. When the virtual thread
    encounters a blocking operation, the JVM suspends it so it can associate the carrier
    thread with another virtual thread. Figure 3.1 shows the association between virtual
    threads, carrier threads, and OS threads:'
