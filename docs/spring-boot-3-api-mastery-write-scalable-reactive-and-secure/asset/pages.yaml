- img_proc: true
  md: '# Asynchronous APIs with Spring Cloud Stream and Apache Kafka 177


    subscribers do not talk to each other directly, but through a message broker,
    allowing greater flexibility and scalability of the system. They send a message
    on a topic, after which it can be read by the different applications (subscribers)
    that subscribe to the topic. This decoupling reduces dependencies between components,
    making it easier to evolve and maintain the system. One advantage of this approach
    is that it is easily scalable. The workload on the subscriber can be divided among
    several instances of the same application. The broker will automatically manage
    the distribution of messages among the various instances. This approach can be
    used in various scenarios, such as social media applications that notify users
    of new posts, financial trading systems, and in general communication between
    microservices where decoupling of components and high horizontal scalability is
    desired.


    # Introduction to Apache Kafka


    Apache Kafka is a messaging tool that uses the Pub/Sub pattern. More specifically,
    it is a distributed event streaming platform that enables publishing, subscribing,
    archiving, and processing of real-time data streams. The core components of Apache
    Kafka are:


    +   - Broker: It is the middleware that stores events/messages and is concerned
    with the distribution of these events/messages from producers and consumers. The
    broker keeps track of the offset of each message reading reading messages, such
    as a specific topic partition, so if a consumer fails, it can resume reading messages
    at the last point where the failure occurred.

    - Cluster: It is the set of nodes, i.e., brokers. Having a cluster of nodes allows
    replication of messages (more precisely, topic partitions) useful in a case is
    node is. It also allows topic partitions to be distributed among nodes to implement
    horizontal scaling on brokers.

    - Topic: It organizes and stores all messages in topics. A topic can be thought
    of as a folder containing messages. Producers write to topics and consumers subscribe
    to them to read only on the topics to which they have subscribed. The retention
    time in which a message should remain in the topic is configurable. You can also
    decide to delete messages.

    - Partitions: It divides topics into one or more partitions. When the producer
    sends an event on a topic, it is stored in a specific topic partition. The default
    partitioning strategy is based on the hash of the message key. Otherwise, you
    may decide to use a round-robin approach or a custom strategy. The messages on
    a partition are sorted according the order in which they were inserted.

    - Producer: It is the client who publishes messages on the topics.

    - Consumer: It is the client reading the messages from the topics.'
