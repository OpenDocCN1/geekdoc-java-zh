    \ service.\n\n# Resilience with Spring Cloud Gateway\n\nTo make the Easyshop system\
    \ resilient to failures, we can implement retry and circuit breaker patterns at\
    \ the entry point of our application, such as edge service.\n\n# Implementing\
    \ retry with retry filter\n\nThe retry pattern is useful to obviate situations\
    \ where the target service is temporarily unavailable.\nTo implement it, we will\
    \ use the Retry Filter provided by Spring Cloud Gateway. Filters can be associated\
