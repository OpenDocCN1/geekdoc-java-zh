  md: "In most implementations of GraphQL services, you can also specify custom scalar\
    \ types, such as to map dates or 64-bit integer values (Long).\n\nFields can be\
    \ nullable or non-nullable. To indicate a non-nullable field, just put the suffix\
    \ \"!\" on the type of the field, for example, if we wanted to make the name field\
    \ of Book mandatory, the field definition would become name: String!\n\nIn order\
    \ to declare a field of type list, just wrap the type in square brackets. If we\
    \ assume that a book might have multiple authors, the author field of the Book\
    \ type would be declared in this:\n\nauthor: [Author]\n\nEach field can have zero\
    \ or more arguments. An argument can be mandatory or optional. An optional argument\
    \ can have a default value. Let us look at the following example:\n\n```\ntype\
    \ Starship {\n  id: ID!\n  name: String!\n  length(unit: String = \"METER\", anotherArg:\
    \ String!): Float\n}\n```\n\nThe length of the Starship has two arguments, the\
    \ first one, unit, which defaults to METER, the second argument, anotherArg, is\
    \ mandatory.\n\nArguments can also be complex objects and not just scalar values.\
    \ In GraphQL, there is the input type, which is defined by the keyword input instead\
    \ of type, as shown below:\n\n```\ninput BookInput {\n  name: String,\n  pageCount:\
    \ Int\n  authorId: String\n}\n```\n\nThe input type is used as the generic of\
    \ mutations.\n\n# Queries and mutations\n\nThere are three special types query,\
    \ mutation, and subscription. Each GraphQL service includes the query type and\
    \ may include mutation and subscription. These types have the same characteristics\
    \ as the normal types seen in the previous section, but they are called special\
    \ because they define the entry point for requests on the GraphQL server. In GraphQL,\
    \ the client defines a request by an operation, which may include one or more\
    \ queries. An example of an operation containing two queries is as follows:"
