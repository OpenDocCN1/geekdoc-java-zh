    The **pathMatchers** method allows a parsed path pattern to be defined to match
    all endpoints, the **hasAnyRole** method allows a list of roles (without the `ROLE_`
    prefix) required to consume the same endpoints to be associated with them. The
    **hasAuthority** method can also be used, but in that case, the role prefix (in
    our case, `ROLE_manager`) must also be included.


    The approach demonstrated here applies RBAC at the request level. Alternatively,
    RBAC can be implemented at the Java method level by leveraging the `@PreAuthorize("hasAnyRole(''MANAGER_ROLE'')")`
    annotation. For example, `@PreAuthorize` can be used to enforce role-based restrictions
    on specific methods. To enable method-security, the `@EnableMethodSecurity` annotation
    must be added to a class annotated with `@Configuration`. For further details,
    refer to the official documentation: https://docs.spring.io/spring-security/reference/servlet/authorization.html


