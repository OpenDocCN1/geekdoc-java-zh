  md: '+   - In REST, a server provides several endpoints, e.g., for each resource,
    a different endpoint is associated. In GraphQL, there is a single endpoint to
    execute queries and mutations. It is the request body that specifies which query
    or mutation to execute.


    +   - In REST, CRUD operations are identified by HTTP methods (GET, POST, PUT,
    DELETE). In GraphQL there are only three operations, query, mutation, and subscription.
    These operations are specified in the body of the request, using the POST method.


    +   - In REST, to request data from different resources, the client must make
    multiple HTTP requests (under-fetching). In GraphQL, the client makes only one
    request to retrieve all the requested data.


    +   - REST is also prone to retrieving more data than the client needs (over-fetching).
    In fact, even if the client is interested in a subset of the fields in the response,
    the server will always send the full response, following the provided OpenAPI
    specification. In GraphQL, only the fields requested by the client are returned
    to the client, optimizing the network bandwidth used.


    +   - In REST, API versioning is important to handle the change of a schema, even
    for the addition of a simple field. In GraphQL, versioning is not necessary, as
    only the fields it requests are returned to the client, making the addition of
    any new schema fields transparent.


    We also saw that REST and GraphQL share common features, for example, both are
    independent of the transport protocol used.


    # # Conclusion


    In this chapter, you learned about the most important features of GraphQL, a modern
    query language for requesting and managing data from a server. The server can
    retrieve data from different resources, transparently to the client. It also allows
    optimizing fetching based on what the client requests. You have seen how the Spring
    for GraphQL module implements GraphQL elegantly through annotations. You might
    be wondering in which cases to use REST and which to use GraphQL. In general,
    if you need a great deal of flexibility and customization in data requests or
    an API that will evolve quickly and frequently, GraphQL may be the right choice.
    It may also be a good choice if your clients are frontend that need to retrieve
    data from different sources. For example, a scenario when we have a back for front
    (BFF) fetching data from multiple servers and applications, GraphQL is the better
    choice. On the other hand, for applications with more stable and rigid requirements,
    where caching and simplicity are priorities, REST may be more appropriate. For
    example, applications like blogs and e-commerce that require basic data retrieval
    and modifications that do not require complex data handling and manipulation,
    REST is the better'
