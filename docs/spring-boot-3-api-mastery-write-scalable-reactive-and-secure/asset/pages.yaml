    # Objectives


    By the end of this chapter, you will have a clear understanding of synchronous
    and asynchronous communication between microservices, enabling you to evaluate
    and select the most appropriate method to use based on your use cases. You will
    appreciate REST architecture in detail, knowing best practices so that you can
    write clear APIs for your clients through the OpenAPI specification.


    # Introduction to microservice architecture


    In recent years, microservices architecture has become increasingly popular in
    enterprise projects. In previous years, projects were mostly with a monolithic
    architecture. In this architecture, the entire application is developed, tested,
    deployed, and scaled as a single unit.


    Figure 1.1 shows a typical monolithic architecture where an entire team works
    on the same source code. The following application shows the reads and writes
    from a single database:


    ![](img/95a54431500295eb58dcb6c7b7f7528e_19_0.png)


    Figure 1.1: Example of monolithic architecture


    Microservice architecture divides an application into a set of independent and
    modular services which is responsible for a specific functionality. Each service
    in a microservice architecture can be developed, deployed, and scaled independently.
    Services communicate with each other through well-defined APIs and often use lightweight
    protocols such as HTTP or asynchronous messaging.'
  merge: -1
  pgno: 19
- img_proc: true
  md: '# Introduction to REST Architecture and API-first Approach


    Figure 1.2 shows a typical microservice architecture, in which each (micro)team
    works on a service to facilitate parallelization of developments. Each microservice
    reads from its own database, refer to the following figure for clarity:


    E-commerce project


    ![](img/95a54431500295eb58dcb6c7b7f7528e_20_0.png)


    Figure 1.2: Example of microservice architecture


    > Note: In this architecture, each microservice reads from its own database, which
    reduces dependencies and promotes scalability and fault isolation. Sharing a database
    across multiple services can lead to tightly coupled services, increased risk
    of data conflicts, and difficulties in scaling or deploying services independently.
    In certain cases, however, multiple services may share a database, typically when
    the data is small, low-frequency, or the services are closely related.


    So, which of the two architectures is better? There is no absolute answer; it
    depends on the project. If you need to develop a simple, small application that
    is unlikely to change over time, monolithic architecture might be a good choice.
    If the application you need to develop is complex, then it may change over time.
    Microservices architecture is suitable for taking advantage of all the benefits
    of the cloud.


    # Synchronous Vs. asynchronous communication


    In the previous section, we explained that in a microservice architecture, the
    components are independent services that work with their codebase, and their own
    artifact is distributed independently. But how do the services communicate with
    each other?


    The answer is through API. They are a set of rules that allow different software
    applications to communicate with each other. These rules define the interfaces
    and data formats used for sending and receiving requests and responses between
    different components of the system. We can define an API as a contract between
    the server and its clients.'
  merge: -1
