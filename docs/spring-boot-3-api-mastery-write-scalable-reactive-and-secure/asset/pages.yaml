  md: "# Asynchronous APIs with Spring Cloud Stream and Apache Kafka\n\n![](img/95a54431500295eb58dcb6c7b7f7528e_202_0.png)\n\
    \nFigure 6.8: Diagram of Spring Cloud operation ^1\n\nThe naming of the bindings\
    \ follows this naming convention:\n\n+   - Input bindings: <FunctionName>-in-<index>.\n\
    - Output bindings: <FunctionName>-out-<index>.\n\nThe index field is the input\
    \ or output association. It is always zero for functions that take only one input\
    \ or return only one output. The example below shows a function that takes a string\
    \ as one input and returns the string in uppercase as output:\n\n@Bean\n\n```\n\
    public Function<String, String> uppercase() {\n    return value -> value.toUpperCase();\n\
    }\n```\n\nThe input bindings will be called uppercase-in-0 while the output bindings\
    \ will be called uppercase-out-0. To improve readability, you can associate custom\
    \ names with the bindings using the following property:\nspring.cloud.stream.function.bindings.<original_name>=<custom_name>.\n\
    The following shows how to associate a custom name with the Input Binding from\
    \ the previous example:\nspring.cloud.stream.function.bindings.uppercase-in-0=input.\n\
    \nOnce you have associated the custom name, you can use that in all configuration\
    \ properties.\nAs for Binders, which are responsible for connecting the application\
