  md: 'in receiving updates. The client performs the registration. When a specific
    event occurs, the server notifies the client by invoking the callback URL provided
    to it during registration, using the POST method. The diagram in Figure 6.3 summarizes
    the operation of Webhooks:


    ![](img/95a54431500295eb58dcb6c7b7f7528e_190_0.png)


    This technique is used for payment services, for example, Stripe and Paypal use
    it to notify third-party applications about payment updates. Chat applications
    such as Slack use it to integrate notifications from third-party applications
    and even code versioning applications such as GitHub use Webhooks to notify CI
    tools of branch operations.


    Webhooks are easy to implement because they use the classic request-response paradigm.
    However, error handling may not be straightforward, for example, if good error
    handling is not defined for cases where the client is unreachable, it could lead
    to a loss of updates.


    # HTTP Streaming


    HTTP Streaming is a technique that enables the continuous flow of data from server
    to client, allowing users to receive real-time data as it becomes available. This
    approach is particularly useful for applications that need constant and rapid
    updates, such as real-time monitoring applications, video or audio streaming,
    and other forms of dynamic communications.


    Figure 6.3: Operation of Webhooks'
