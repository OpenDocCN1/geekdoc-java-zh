- img_proc: true
  md: 'The key principles of the paradigm are well described in the Reactive Manifesto
    https://www.reactivemanifesto.org. A responsive system has the following characteristics:


    +   - **Responsive**: A responsive system responds to the client in a fast and
    timely manner. It is usable even under critical conditions. If a problem occurs,
    the system must be able to immediately identify and isolate it, keeping its responsiveness
    intact.


    +   - **Resilient**: A responsive system is resilient to failures. This aspect
    is related to the characteristic of responsiveness. A system that is not fault-tolerant
    will not be able to be a consistently responsive system. A responsive system implements
    resilience through component replication and fault isolation. The fault is isolated
    to the affected component only, while the other components respond in a way that
    does not create disruption. An external delegate is responsible for recovering
    the component affected by the failure and ensuring high availability of the system
    through replication. This allows the clients to retrieve themselves of the responsibility
    of having to deal with server failures.


    +   - **Elastic**: A reactive system is elastic to varying workloads. That is,
    it adapts quickly to changes in the frequency of incoming inputs, increasing or
    decreasing the resources allocated by horizontal scaling. Further, the horizontal
    scaling allows the workload to be divided among different instances. They also,
    through predictive algorithms, always maintain a suitable number of instances
    to effectively manage the workload but also be efficient in terms of resources
    used (and paid for).


    +   - **Message-driven**: In a reactive system, components communicate through
    the exchange of events or messages, triggering reactions and transformations throughout
    the system. The event-driven architecture promotes reduced coupling between components
    and facilitates scalability and fault tolerance. These systems operate asynchronously,
    allowing components to perform non-blocking operations and respond to events as
    they occur. The asynchronous nature facilitates efficient resource utilization
    and allows systems to handle large numbers of simultaneous requests without compromising
    responsiveness. Responsive systems incorporate mechanisms to manage backpressure,
    allowing downstream components to control the rate of data or event consumption
    based on their processing capabilities. This ensures that resources are used optimally
    and prevents overload scenarios.'
