    # Publish/Subscribe


    The Publish/Subscribe (Pub/Sub) model is an asynchronous communication design
    used in software architectures to allow systems and applications to interact in
    an efficient and scalable manner. In a Pub/Sub system, message producers (publishers)
    do not send messages directly to specific consumers (subscribers), but rather
    push messages to a channel or topic. Subscribers subscribe to these topics and
    automatically receive relevant messages published on them. The diagram in Figure
    6.6 summarizes how publish/subscribe pattern works:


    # Publish/Subscribe Communication


    ![](img/95a54431500295eb58dcb6c7b7f7528e_193_0.png)


    Figure 6.6: A diagram showing how the pub/sub pattern works


    Compared with previous approaches, it has the advantage of having a decoupling
    between the applications that send and those that receive messages: in fact, publishers'
  merge: -1
