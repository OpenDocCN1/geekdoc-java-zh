  md: '# Asynchronous communication


    Asynchronous communication between microservices occurs when one service sends
    a message or request to another without waiting for the latter''s response. This
    type of communication is very useful in scenarios where the caller does not need
    to be blocked while the receiving service processes the operation. We usually
    refer to this type of communication as event-based or event-driven architecture
    model.


    In this model, a service called a publisher or producer sends events/messages
    to a communication channel, such as a queue or topic. One or more services, called
    subscribers or consumers, read the messages from the communication channel and
    process them.


    With this type of communication, it reminds you of the first advantage which is
    the decoupling of producer and consumer services. The fact that there is a communication
    channel, such as a message broker (e.g., Kafka or RabbitMQ) or an event bus, acts
    as middleware, allows us to handle any outages or unavailability of consumer services.
    If the consumer is down, the producer can still write the message to the channel.
    When it is up again, it can continue reading the messages.


    Figure 1.4 shows the order service that writes a message on a topic that is read
    by the consumers payment service and notification service:


    ![](img/95a54431500295eb58dcb6c7b7f7528e_22_0.png)


    **Figure 1.4:** Asynchronous communication between two microservices


    Another advantage of this approach is that horizontal scaling is easier to asialize
    as it is sufficient to have multiple instances of the same service to scale message
    processing. Figure 1.5 shows how instances of the same service share message reading.
    Each instance automatically reads from a different partition that contains multiple
    messages from other'
