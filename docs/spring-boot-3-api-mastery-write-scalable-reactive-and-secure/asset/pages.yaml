    \ optional name.\n- A category, between laptop and smartphone.\n- A price in a\
    \ eurocent format.\n- The name of a brand (optional).\n\n> Note: Using an integer\
    \ type (e.g., “long” in Java) for price representation, such as in cents, avoids\
    \ rounding errors associated with floating-point types (“double”) and ensures\
    \ precision calculations, crucial for financial applications. This approach improves\
    \ consistency, simplifies arithmetic operations, and aligns with best practices\
    \ recommended by many systems, enhancing integration and reliability.\n\nNow that\
