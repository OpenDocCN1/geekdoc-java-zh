  md: '# WebSocket


    WebSocket is a full-duplex communication protocol that enables continuous two-way
    communication between the client and server over a single Transmission Control
    Protocol (TCP) connection. The WebSocket process begins with an HTTP handshake
    request, during which the client requests to establish a WebSocket connection
    with the server. If the server accepts the connection, it responds with status
    code 101. At this point, the connection is updated and passed from HTTP to WebSocket,
    where the client and server can exchange messages bi-directionally. The diagram
    in Figure 6.5 summarizes the operation of WebSocket:


    # WebSocket Communication


    ![](img/95a54431500295eb58dcb6c7b7f7528e_192_0.png)


    Figure 6.5: How WebSocket works'
