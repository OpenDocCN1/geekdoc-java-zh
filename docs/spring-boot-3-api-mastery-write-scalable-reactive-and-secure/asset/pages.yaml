    # Log aggregation with Grafana Loki


    Logs are chronological records of activities and events occurring within an application.
    These records include informational messages, warnings, errors, and debugs generated
    by the application during its operation. Logs are essential for application diagnostics,
    monitoring, maintenance, and improvement because they provide a detailed record
    of system operations and behaviors.


    # Logging in Spring Boot


    Spring Boot facilitates the implementation and management of logs through simple,
    integrated configuration. It uses **Simple Logging Facade for Java (SLF4J)** APIs
    that can be implemented out-of-box by the logging libraries of **Logback**, **Log4j2**,
    and **Java Util Logging (JUL)**. Spring Boot uses **Logback** as the default logging
    implementation. No additional configuration is required to start logs when importing
    a Spring Boot starter.


    The default format of the logs is as follows:


    ```

    <timestamp> <log_level> <process_id> --- <app_name> <thread_name> <correlation_id>
    <logger_name> <message>

    ```


    Let us look each field in detail:


    +   * **Timestamp**: It is the date and time in milliseconds of log.

    * **log_level**: The log level. It can be ERROR, WARN, INFO, DEBUG e TRACE. Logback
    does not have the FATAL log level.

    * **process_id**: This field contains the unique identifier of the process that
    generated the log.

    * **Separator(---)**: This is a fixed separator used to improve the readability
    of the log format.

    * **app_name**: The name of the application, if the spring.application.name property
    is set.'
