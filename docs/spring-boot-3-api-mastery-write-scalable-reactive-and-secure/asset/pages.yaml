    Spring Security is the Spring module that handles security in both imperative
    and reactive ways. To implement security, Spring Security uses a chain of filters,
    which are invoked in a certain order, and which intercept all RestControllers.
    In the imperative version, filters are implemented with classes of the type Filter,
    while in the reactive version, with classes of the type WebFilter.


    # Configuring the OAuth2 client on Keycloak


    Before using Spring Security, we need to configure a client application on Keycloak,
    that is, the application that will act as the OAuth2 client, which, in our case,
    will be the edge service. We again use the container bash of Keycloak as we did
    before, using the following command:


    ```

    docker exec -it easyshop-keycloak bash

    ```


    After that, let us go to the path /opt/keycloak/bin using the command: cd /opt/keycloak/bin/


    Let us log in as an admin user using the following command:


    ```

    /kcadm.sh config credentials --server http://localhost:8080 \

    --realm master --user --password password

    ```


    Now we can create the client application using Keycloak admin CLI, with the following
    command:


    ```

    /kcadm.sh create clients -r Easyshop \

    -s clientId=edge-service -s enabled=true \

    -s clientSecret=easyshop-secret \

    -s publicClient=false -s redirectUris="http://localhost:8090" \

    \n"http://localhost:8090/login/oauth2/code/*"

    ```


    Running this command creates the client application, edge service, with clientId
    and client secret defined by. Also, with the publicClient=false option, we are
    defining the application as non-public. Public applications can use the client
    without the secret to receive the authorization code. Usually, public applications
    are web or mobile applications, RedirectUris is used to define the URLs to which
    Keycloak should redirect the browser after the user logs in and logs out. In fact,
    the first URI is for logout, and the second is for login. Spring Security uses
    the following URI:


    ```

    http://localhost:8090/login/oauth2/code/<provider_name> to accept the authorization
    code of a configured provider.

    ```'
