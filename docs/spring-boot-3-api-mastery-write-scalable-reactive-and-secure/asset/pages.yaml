  md: '260 Spring Boot 3 API Mastery


    +   - thread_name: The name of the thread.

    - correlation_id: A correlation ID, if tracing is enabled.

    - logger_name: The name of the Logger, which is usually the class that writes
    the log.

    - Message: It is the log message.


    By default, messages with log level ERROR, WARN and INFO are logged. You can,
    change the visibility of logs for certain packages, using the property `logging.level.<logger_name>`,
    as shown in the following example:

    `logging.level.root=warn

    logging.level.org.hibernate=error`


    With the first property, we set the generic visibility for all logs. In general,
    it is the logs with WARN and ERROR levels will be printed. With the second property,
    we configure the visibility of classes-specific logs that are in the `org.hibernate`
    package and subpackages. For these logs, only messages with an ERROR level will
    be printed.


    Spring Boot simplifies the process of creating logs, allowing developers to apply
    common configurations to multiple loggers. For example, the following code snippet
    demonstrates how to group and configure logging levels for Tomcat-related loggers:

    `logging.group.tomcat=org.apache.catalina,org.apache.coyote,org.apache.tomcat

    `logging.level.tomcat=TRACE`


    If you want to use Logback-specific configurations, you can add the `logback.xml`
    file to the classpath. If you want to use the Logback extensions, you can add
    the `logback-spring.xml` file to the classpath.


    # # Working with Loki


    In traditional applications, logs are printed in text files, and stored on the
    machine hosting the application. In Cloud Native applications, log management
    must necessarily be different. Complete logs of an HTTP request may involve multiple
    microservices, and applications are replicated to apply hourly scaling. In Cloud
    Native applications, logs must be printed in standard output. It is delegated
    to external tools to capture logs from standard output, store them, aggregate
    them, filter them, and make them available for analysis.


