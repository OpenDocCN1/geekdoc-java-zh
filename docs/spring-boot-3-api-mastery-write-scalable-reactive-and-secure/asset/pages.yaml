    # Metrics with Spring Boot Actuator and Prometheus


    In the context of microservice architectures, monitoring metrics is critical to
    ensure the health, performance, and availability of applications. Microservices,
    by their nature, are distributed systems that interact with each other across
    a network. This complexity makes it difficult to monitor and manage the behavior
    of the entire system without proper observability tools. Monitoring metrics provide
    critical information about application performance (e.g., API error rates, throughput,
    and latency measurements), enabling developers and operators to identify bottlenecks
    (e.g., high latency or excessive resource consumption), diagnose problems, and
    make data-driven decisions to optimize resources and improve the user experience.
    By analyzing resource utilization, such as CPU, memory, and I/O, application performance
    can be ensured to respond efficiently to requests. The metrics also help determine
    when services need to scale horizontally or vertically to handle varying workloads,
    ensuring that resources are used optimally. Additionally, monitoring metrics and
    alerting playing a vital role in'
  merge: -1
  pgno: 279
- img_proc: true
  md: "Site Reliability Engineering (SRE), as they help ensure system reliability,\
    \ availability, and performance by proactively identifying and addressing potential\
    \ issues before they impact users.\n\nSpring Boot Actuator is a Spring Boot module\
    \ that provides monitoring and management capabilities for ready-to-use applications.\
    \ The actuator exposes a set of HTTP endpoints that provide access to internal\
    \ application information, as metrics, health status, system information, and\
    \ configurations. In order to collect metrics, it uses the Micrometer library\
    \ (https://micrometer.io), which provides a vendor-neutral facade so these can\
    \ be exported using a variety of formats, as Prometheus and Datalog. For our application,\
    \ we will use Prometheus, an open-source monitoring solution that stores metrics,\
    \ just as Loki stores\n\nIn order to start Prometheus locally, we add the following\
    \ piece of code to the **docker-compose.yml**\n\n```\nprometheus:\nimage: prom/prometheus:v2.50.0\n\
    container_name: 'easyshop-prometheus'\nextra_hosts: ['host.docker.internal:host-gateway']\n\
    command:\n  --enable-feature=exemplar-storage\n  --config.file=/etc/prometheus/prometheus.yml\n\
    volumes:\n  - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro\n\
    ports:\n  - \"9095:9090\"\n```\n\nIn the **infra/docker/prometheus** folder, you\
    \ will find the dedicated Prometheus configuration file that is used as the volume.\n\
    \nIn order to use Spring Boot Actuator with Prometheus, we will import the following\
    \ dependencies into the edge service:\n\n```\n<dependency>\n  <groupId>org.springframework.boot</groupId>\n\
    \  <artifactId>spring-boot-starter-actuator</artifactId>\n</dependency>\n<dependency>\n\
    \  <groupId>io.micrometer</groupId>\n  <artifactId>micrometer-registry-prometheus</artifactId>\n\
    ```"
