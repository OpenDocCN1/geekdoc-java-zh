    # # The Protocol Buffers


    By default, gRPC uses the Protocol Buffers format (also known as protobuf) as
    the interface language to define the data structure and serialization format.
    Protocol Buffers is an efficient binary serialization mechanism for defining how
    data should be structured in gRPC messages. Compared to JSON, which is the format
    used by default in REST, it is more efficient in terms of size and serialization/deserialization
    speed.


    When working with gRPC, the first step is to define the structure of the data
    in a proto file (file with the .proto extension). The data is structured as messages
    where each message is a small logical record of information containing a series
    of name-value pairs. Here is an example of a message:


    ```

    message Person {

    string name = 1;

    int32 id = 2;

    bool has_ponycopter = 3;

    }

    ```


    Each field is associated with a unique numeric value which indicates the serialization
    order. Once the message is used, you cannot change the number associated with
    a field because it would correspond to deleting the field and creating a new one.
    You can rename a field without breaking client compatibility. You can also delete
    a field while maintaining client compatibility, then the client will receive the
    default value for that field (if the'
