    # # Conclusion


    In this chapter, we saw how with Spring Boot it is easy to create container images
    without needing to write a Dockerfile. This leads to several advantages, such
    as not having to maintain the Dockerfile, and not to worry about writing a secure
    and efficient Dockerfile, allowing you to create reproducible images.


    We first released edge service and catalog service via Docker Compose, just as
    we did for other tools like Postgres and Keycloak in previous chapters. Then,
    we released the two microservices and all the Eashop tools on a Kubernetes cluster,
    using the Kind tool, which allows us to create nodes locally. With Spring Boot,
    we do not need to modify the applications to release them on Kubernetes. Rather,
    Spring Boot Actuator provides out-of-probe endpoints used by Kubernetes to understand
    whether the Pod is alive (liveness probe) and ready to receive HTTP requests (readiness
    probe).


    We have reached the end of this book. You are now ready to release production
    Spring Boot applications that can use synchronous APIs efficiently, using the
    most popular paradigm, REST, but not only that. You are now able to evaluate on
    a case-by-case basis whether it is cost-effective to use GraphQL or gRPC. In addition,
    you have learned about the Spring Cloud Stream project that allows you to write
    asynchronous APIs consistently beyond the message broker used.'
