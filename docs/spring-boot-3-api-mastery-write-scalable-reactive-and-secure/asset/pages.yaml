    # Points to remember


    +   - Spring for GraphQL is independent of the transport protocol used. You therefore
    need to import the dependencies of Spring MVC, Spring WebFlux, Spring WebSocket,
    or Spring RSocket.

    - GraphQL uses a single endpoint for all operations. In Spring for GraphQL, endpoint
    by default is /graphql. If you use the websocket protocol, the endpoint must be
    explicitly specified via the spring.graphql.websocket.path property.

    - In GraphQL, only the requested data is returned to the client.

    - You can eliminate the problem of N+1 requests by using the @BatchMapping annotation.

    - Use @GraphQLTest and the GraphQLTester client to test the GraphQL API.


