    We have seen how to easily implement the retry pattern in Spring Cloud Gateway
    to overcome situations of momentary unavailability of the target service. However,
    to handle situations where the target service is unavailable for an extended time,
    the circuit breaker must be applied.


    # Implementing circuit breaker with Resilience4J


    The circuit breaker pattern is an architectural design pattern used to improve
    the resilience and stability of a distributed system. This pattern is inspired
    by electrical circuits, where a switch (circuit breaker) is used to interrupt
    the flow of power in the event of an overload or failure. In a software context,
    a circuit breaker interrupts the flow of requests to a service that is experiencing
    problems, preventing the fault from propagating and damaging the entire system.


    The circuit breaker pattern consists of the following three states:


    +   * Closed: In this state, all requests to the downstream service are allowed.
    The circuit breaker monitors the success and failure of requests. If the number
    of failures exceeds a predefined threshold, the circuit breaker switches to the
    Open state.

    * Open: In this state, all requests to the downstream service are blocked to avoid
    overloading the already struggling service. After a configurable timeout period,
    the circuit breaker switches to the Half-Open state.

    * Half-Open: In this state, the circuit breaker allows a limited number of requests
    toward the downstream service to check if the problem is resolved. If the number
    of requests that have failed is equal or greater than a configured threshold,
    the circuit breaker returns to the Open state, otherwise, it returns to the Closed
    state.'
