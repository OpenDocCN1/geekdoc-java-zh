  md: "# Centralized Security with Spring Cloud Gateway\n\n**cross-cutting concerns**,\
    \ such as authentication management, resilience management, monitoring data collection,\
    \ and performance analysis, in addition to the simple operation of routing requests\
    \ to downstream services.\n\nSpring provides the Spring Cloud Gateway project\
    \ to implement an API Gateway. There is an imperative version, which uses Spring\
    \ MVC, and a reactive version, which uses WebFlux. We will use the one with Spring\
    \ WebFlux.\n\nThe core elements of Spring Cloud Gateway are the following:\n\n\
    +   - **Route**: The basic gateway element, consisting of an ID, a destination\
    \ URI, a set of predicates, and filters. A route is matched if the aggregate predicate\
    \ is true.\n- **Predicate**: Predicates based on the HTTP request, such as headers\
    \ or parameters.\n- **Filter**: Filters that allow requests and responses to be\
    \ modified before or after the request is sent to downstream services.\n\nRoutes\
    \ can be configured in Spring Cloud Gateway using either the Java Routes API or\
    \ configuration files. Below are examples of both approaches:\n\n```\n// Using\
    \ the Java Routes API\n@Configuration\nclass RouteConfiguration {\n\n    @Bean\n\
    \    public RouterFunction<ServerResponse> gatewayRouterFunctionsCookie() {\n\
    \        return route(\"cookie_route\")\n            .route(header(\"X-Request-Id\"\
    , \"\\d+\"),\n                http(\"https://example.org\"))\n            .build();\n\
    \    }\n}\n```\n\n```\n# Using configuration file\nspring:\ncloud:\n  gateway:\n\
    \    mvc:\n      routes:\n      - id: header_route\n        uri: https://example.org\n\
    ```"
