    # Objectives


    In this chapter, you will learn how to implement and manage security in a microservices
    architecture using Spring Cloud Gateway and OAuth2. You will explore the core
    concepts of OAuth2 and OIDC, including their roles in enabling authentication
    and authorization across distributed systems. The chapter covers the setup and
    integration of Keycloak, a popular open-source identity and access management
    solution, to centralize user authentication and manage clients, realms, and nodes.


    You will discover how to use Spring Cloud Gateway as an API Gateway to secure
    and manage traffic between microservices, configure routes, filters, and predicates,
    and enforce security policies. Additionally, you will gain hands-on experience
    in setting up microservices as OAuth2 clients and resource servers using Spring
    Security, implementing OIDC authentication, managing access tokens, and securing
    endpoints with fine-grained access control.


    By the end of this chapter, you will have the knowledge and practical skills to
    personalize security in your microservices architecture, ensuring robust API protection
    and a seamless user experience.


    # Introduction to OAuth2 and OpenID Connect


    To secure APIs, two concepts must be applied as authentication and authorization.
    Authentication answers the question of who wants to access the API, and authorization
    answers the question of does the user (or, in general, the client), has permission
    to invoke the API. Obviously, authorization cannot occur if the client has not
    authenticated. In this chapter, we will create the edge microservice that will
    act as the API Gateway, shielding the downstream services as a catalog service
    and using standards such as OIDC, OAuth2, and JSON Web Token (JWT) to secure the
    API. Figure 7.1 shows the figure summarizing the parts involved in this chapter:'
