  md: '# OAuth2 protocol


    OAuth2 is an industry-standard protocol for authorization that is designed to
    allow easy integration for any type of application-web, desktop, mobile, or machine-to-machine.
    OAuth2 allows a user to grant a third-party application limited access to protected
    resources without sharing credentials.


    OAuth2 defines four actors (or roles). Three have already been discussed in the
    OIDC section. The fourth is the resource server, the server that hosts resources.
    It accepts the access token in requests to ID token to understand whether the
    user is allowed to access the resource. Compared to the ID token, it is not mandatory
    that the access token be a JWT, although we will use JWT for our application.
    However, the access token must be a short-lived token. The authorization server,
    optionally, in addition to the access token, can also return a refresh token,
    a token with a longer duration, which allows you to request a new access token,
    when the one has expired.


    In the Easashop application, the OAuth2 client is an edge service, while the resource
    server is a catalog service. However, there are cases where an application acts
    as both an OAuth2 client and resource server. In example, Spotify can log in with
    your Google account. In this case, Google acts as the IP; while Spotify acts as
    both the OAuth2 client and resource server. Figure 7.3 illustrates the application
    of OAuth2 in Easyshop:


    # OAuth2 flow in Easyshop


    ![](img/95a54431500295eb58dcb6c7b7f7528e_237_0.png)


    From the figure above, you might wonder how the catalog service can validate the
    access token without calling the authorization server. The first time the catalog
    service needs to validate the access token, it actually calls the JSON Web Key
    Set (JWKS) endpoint of the'
