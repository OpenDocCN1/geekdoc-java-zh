    increase over the 376.82 requests achieved by the Servlet application. This higher
    throughput indicates WebFlux''s efficiency in managing concurrent connections,
    supporting a greater request rate with minimal impact on response times. Such
    performance gains make WebFlux particularly advantageous for scalable, high-traffic
    environments.


    When examining the average time per request, WebFlux demonstrated an improved
    mean of 575.163 ms compared to the Servlet application (663.40 ms). This suggests
    that WebFlux''s non-blocking architecture can reduce request-processing times,
    likely due to its ability to manage concurrency without the overhead of a traditional
    thread-per-request model. The decreased mean request time highlights how WebFlux''s
    reactive design can optimize application responsiveness by allowing the system
    to process more requests concurrently.


    In terms of data transfer, WebFlux recorded a transfer rate of 339.15 Kbytes/sec,
