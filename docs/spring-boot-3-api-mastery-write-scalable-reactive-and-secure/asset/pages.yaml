  md: '# Conclusion


    In this chapter, we have seen how to observe and monitor Spring Boot applications
    with Spring Boot Actuator and Micrometer. Observability and monitoring become
    critical in a microservice architecture, where a single HTTP request involves
    multiple services. The release of Spring Boot 3, metrics and trace management
    have been unified by using the Micrometer API for both. In this chapter, we used
    Prometheus for the metrics store, Loki for the log store, and OpenTelemetry with
    Tempo to manage traces. We only added configurations, no lines of code to be added
    (not a single line to enable context propagation in WebFlux): Since the Micrometer
    provides facades to be used with different tools, we could veer to other tools
    completely transparently. However, Micrometer also provides APIs for observing
    specific code points, although we have not discussed them in this chapter. Our
    applications are ready to be deployed in a production environment.

    In the next chapter, Deploying on Kubernetes with Kind, we will look at how to
    release the microservices created so far in a containerized context.


    # Points to remember


    +   - In a microservice context, distributed tracing is critical. It is strongly
    discouraged to release an application to production by not managing this aspect.

    - In Spring Boot 3, both metrics and tracing are handled by the Micrometer API.

    - The Spring Cloud Sleuth Project, which focuses on tracing, has been replaced
    by Spring Boot 3 by Micrometer Tracing, also developed by the Spring team.


    # Exercises


    +   1. Create an alarm in Grafana that will go off if an ERROR level log is present.


