    \ Service allows exposing service catalogs within the Kubernetes cluster is as\
    \ follows:\n\n```\napiVersion: v1\nkind: Service\nmetadata:\n  name: catalog-service\n\
    \  labels:\n    app: catalog-service\nspec:\n  type: ClusterIP\n  selector:\n\
    \    app: catalog-service\n  ports:\n  - protocol: TCP\n    port: 8080\n    targetPort:\
    \ 8080\n```\n\nThis Service is associated with all Pods that have the label \"\
    app: catalog-service\" and allows them to be exposed within the cluster via the\
    \ logical catalog-service name (**metadata.name field**). The **Service** object\
    \ takes care of routing the requests it receives to a Pod that is **healthy**\
    \ and ready to receive traffic. In the following section, we will see how to handle\
    \ the healthy and ready states. Services can be exposed on the Internet using\
    \ Ingress objects or the more modern Gateways. However, we have four types of\
    \ Services, as mentioned below:\n\n+   - **ClusterIP**: The default, exposes the\
    \ Service on a cluster-internal IP.\n- **NodePort**: This exposes the service\
    \ on the IPs of each cluster node, via a static port.\n- **LoadBalancer**: This\
    \ exposes the service externally using a load balancer not directly managed by\
    \ Kubernetes, which can be provided manually or by the Cloud Provider."
