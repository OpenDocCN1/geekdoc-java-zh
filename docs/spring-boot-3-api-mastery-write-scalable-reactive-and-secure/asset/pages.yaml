    # Asynchronous APIs


    In the first chapter, Introduction to REST Architecture and API-first Approach,
    we introduced the concept of asynchronous communication between microservices
    and compare it with synchronous communication. Asynchronous communication is useful
    for services that need to receive real-time updates, in cases where a response
    from the server cannot be received quickly, or when the server does not immediately
    have data available to return to the client. In this section, we will explore
    some different implementations of asynchronous communication.


    # HTTP polling


    HTTP polling is not a type of asynchronous communication, however, it is a technique
    that allows a client to query the server multiple times, via HTTP requests, to
    get continuous data updates. However, with this technique, you will not have real-time
    updates and more importantly it can generate a high amount of unnecessary traffic.
    The diagram in Figure 6.1 summarizes how short polling works:


    # HTTP Short Polling


    ![](img/95a54431500295eb58dcb6c7b7f7528e_188_0.png)'
  merge: -1
