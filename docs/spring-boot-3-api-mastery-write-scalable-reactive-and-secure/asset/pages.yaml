  md: "# Spring Boot 3 API Mastery\n\nSpring Cloud Stream also allows you to implement\
    \ custom error handlers by defining types of Consumer<ErrorErrorMessage>.\n\n\
    The org.springframework.messaging.support.ErrorMessage class contains the exception\
    \ that generated the error and the original message. Let us see in practice how\
    \ a custom error handler for order service works. In the ShipmentFunctions, we\
    \ write a method that handles consumer handleShipmentEvent:\n\n```\n@Bean\nConsumer<ErrorMessage>\
    \ handleShipmentEventError() {\n    return message -> {\n        Throwable error\
    \ = message.getPayload();\n        Message<?> originalMessage = message.getOriginalMessage();\n\
    \        MessageHeaders headers = originalMessage.getHeaders();\n        var originalMessageKey\
    \ = (byte[]) headers.get(KafkaHeaders.RECEIVED_KEY);\n        var originalMessagePayload\
    \ = (byte[]) originalMessage.getPayload();\n        info(\"Original MessageKey:\
    \ {}, MessagePayload: {}, with error: {}\",\n            new String(originalMessageKey,\
    \ StandardCharsets.UTF_8),\n            new String(originalMessagePayload, StandardCharsets.UTF_8),\n\
    \            error.getCause().getMessage());\n\n        // Save to db or do something\
    \ else....\n\n    };\n}\n```\n\nIn this custom error, we simply log the error,\
    \ the message key, and its payload, but we could easily implement more complex\
    \ handling, such as saving the message key and payload on some error table. Remember\
    \ that headers also have useful information besides the message key, such as the\
    \ original topic name. To apply the custom error handler, we comment out the two\
    \ properties added earlier for DLQ handling and add the following property:\n\n\
    ```\nspring.cloud.stream.bindings.handleShipmentEvent-in-0.error-handler-definition=handleShipmentEventError\n\
    ```\n\nIf you want to apply this custom error handler to all consumers instead\
    \ of one, you can do this by using this property:\n\n```\nspring.cloud.stream.bindings.upper.error-handler-definition=handleShipmentEventError\n\
    ```"
  merge: -1
  pgno: 225
- img_proc: true
  md: "Note: If you did not comment on the two properties to handle the error in DLQ,\
    \ the custom error handler would still replace the DLQ behavior, but it would\
    \ be confusing to have both handlers set up.\n\nResend the previous message; you\
    \ should see in order service such a log, certifying the operation in our custom\
    \ error handler, refer to the following code:\n\n```\nOriginal MessageKey: not-exist,\
    \ MessagePayload: {\"errorCode\": \"not-exist\", \"status\": \"DELIVERING\"},\
    \ with Error: Order with code-not exist found\n```\n\nIn this section, you have\
    \ seen how Spring Cloud Stream, it allows you to have errors in a really simple\
    \ way, giving you a choice of several strategies. It is up to you to decide which\
    \ way is most appropriate based the nature of your application.\n\nNote: The error\
    \ handling seen in this paragraph applies only to Message handlers, that is, imperative\
    \ functions. If you use the reactive approach, you will need to use the Reactive\
    \ APIs to handle errors (for example, retryWhen to handle handles).\n\n# Testing\
    \ Spring Cloud Stream applications\n\nSpring Cloud Stream provides a test binder\
    \ that can be used to test framework components without the need to use an actual\
    \ binder. The test binder can be used by importing the following dependency:\n\
    \n```\n<dependency>\n  <groupId>org.springframework.cloud</groupId>\n  <artifactId>spring-cloud-stream-test-binder</artifactId>\n\
    \  <scope>test</scope>\n</dependency>\n```\n\n> Note: When this book was written,\
    \ Spring Initializr imported version 2023.0.1 of the parent module spring-cloud-dependencies.\
    \ However, we recommend upgrading the version to a later one, for example, 2023.0.2.\
    \ In 2023.0.1 the test binder is used by default for tests, and this can generate\
    \ problems if you want to run with a real binder (https://github.com/spring-cloud/spring-cloud-stream/issues/2931).\n\
    \nWe test the order service consumer by exploiting the test binder. Create the\
    \ `middleware.consumer` test package and write the following class:\n\n```\n@SpringBootTest\n\
    @EnableAutoConfiguration(exclude = {DataSourceAutoConfiguration.class})\n@ActiveProfiles(\"\
    test\")\n@Import(TestChannelBinderConfiguration.class)\n```"
