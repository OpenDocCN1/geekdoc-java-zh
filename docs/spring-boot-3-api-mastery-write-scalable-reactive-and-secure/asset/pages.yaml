  md: '# 108 Spring Boot 3 API Mastery


    The results are compelling, Virtual threads completed the teste suite in 22.855
    seconds, outperforming platform threads, which required 26.538 seconds, for a
    similar load. reduction in total duration is complemented by an increase in throughput,
    with virtual threads achieving 437.5 requests per second, compared to 376.82 with
    platform threads. Additionally, the mean request was significantly lower for virtual
    threads (571.378 vs 663.440 ms), indicating faster response handling under concurrent
    conditions. Lastly, data transfer rates were markedly improved, with virtual threads
    achieving a transfer rate of 314.48 Kbytes/sec against 270.84 Kbytes/sec for platform
    threads.


    These findings suggest that virtual threads offer substantial advantages for high-concurrency
    Spring MVC applications, enhancing both speed and data handling efficiency. By
    adopting virtual threads, developers can achieve better scalability and responsiveness,
    making this approach an invaluable option for applications that demand high performance
    and seamless concurrency management.


    # Choose between virtual threads and WebFlux


    After reading this chapter and the previous one, you may be wondering which approach
    to use in your applications, the thread-per-request approach with Spring MVC and
    the event loop approach with WebFlux. If your application was already written
    with Spring MVC, and you are looking for ways to optimize thread management, using
    virtual threads you not to heavily refactor your code (just upgrade to Spring
    Boot 3, Java 21, and add the property to enable virtual threads). If you are starting
    from scratch, the choice depends on your team''s knowledge. With WebFlux, you
    can write functional code, and handle backpressure, and you are not forced to
    migrate to reactive programming proves to be slightly more performant at this
    time, virtual threads are to be preferred because of the simplicity of design
    associated with scalability performance. If your application already uses WebFlux,
    we do not recommend moving to Spring MVC. If you are interested in more details
    on comparing the performance of Spring MVC and Spring MVC with virtual threads,
    you can check out this article: https://www.vincenzoracca.com/en/blog/framework/spring/virtual-threads-vs-webflux.


    # Conclusion


    In this chapter, we saw what virtual threads are in detail and explained why they
    are an important feature in Java. Through virtual threads, you can use the simple
    thread-per-request model with the same scalability as asynchronous programming.
    We showed how to create REST APIs traditionally with Spring MVC, and explored
    how Spring makes it easy to switch usage to virtual threads with a simple property.
    You have also seen the new synchronous HTTP client, RestClient, which allows you
    to use the same fluent APIs as WebClient. With this chapter, you have the means
    to write scalable REST APIs by'
