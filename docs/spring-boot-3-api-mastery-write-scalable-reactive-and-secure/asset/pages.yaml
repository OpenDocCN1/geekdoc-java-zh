  md: "```\n<scope>runtime</scope>\n</dependency>\n```\n\nSpring Actuator provides\
    \ several endpoints to monitor the application, for example, there is an endpoint\
    \ that monitors the health of the microservice (/actuator/health), one dedicated\
    \ to environment variables (/actuator/env), another to change the visibility of\
    \ loggers at runtime (/actuator/log). For the full list of endpoints, visit the\
    \ following official documentation:\n\nhttps://docs.spring.io/spring-boot/reference/actuator/endpoints.html\n\
    \nHowever, because some of this information may contain sensitive data, by default\
    \ only some endpoints are exposed. To enable all endpoints, we set the following\
    \ property in the application.yml file:\n\n```\nmanagement:\n  endpoints:\n  \
    \  web:\n      exposure:\n        include: '*'\n```\n\nWe also enable the publication\
    \ of a histogram suitable for calculating aggregable percentile approximations\
    \ (e.g., latency analysis, as evaluating p90 and p99 of requests), enable detail\
    \ on metrics, such as knowing disk space, and finally define a Micrometer tag\
    \ to label all metrics by application name, allowing for categorization and filtering\
    \ of metrics, as essential feature in multi-service environments:\n\n```\nmanagement:\n\
    \  endpoints:\n    web:\n      exposure:\n        include: '*'\n  endpoint:\n\
    \    health:\n      show-details: always\n      show-components: always\n  metrics:\n\
    \    distribution:\n      percentiles-histogram:\n        http.server.requests:\
    \ true\n    tags:\n      application: ${spring.application.name}\n```"
