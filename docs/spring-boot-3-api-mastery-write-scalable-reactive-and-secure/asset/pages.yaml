  md: "# Observability and Monitoring 267\n\nIn the section Monitoring with Grafana,\
    \ we will see how to monitor metrics through a simple dashboard. Add the configurations\
    \ seen for the edge service in the catalog service.\n\n# Tracing with Micrometer,\
    \ OpenTelemetry, and Grafana Tempo\n\nDistributed tracing allows a request to\
    \ be tracked as it traverses several microservices, providing a clear and detailed\
    \ view of the path and time taken in each service.\n\nDistributed tracing logs\
    \ to be grouped according to a unique identifier, the TraceID which represents\
    \ the end-to-end request or its lifecycle. In addition, for each component involved\
    \ in the request, another identifier, the SpanID, is added, which allows the identification\
    \ of individual service calls within the same request identified by the TraceID.\
    \ These identifiers are automatically propagated between microservices via HTTP\
    \ headers.\n\nSpring Boot 3 enhances support for distributed tracing with the\
    \ Micrometer Tracing project, which replaces Cloud Sleuth. Much like Micrometer's\
    \ Tracing provides a facade for using more popular tracing libraries. The unification\
    \ of metrics and tracing through Micrometer simplifies monitoring by offering\
    \ a consistent API for both, making it easier to integrate and manage observability\
    \ in applications. For our application, we will use OpenTelemetry, a vendor-neutral\
    \ framework for collecting telemetry data (logs, metrics, traces). We will use\
    \ OpenTelemetry only for distributed tracing. Micrometer Tracing provides a bridge\
    \ library to use OpenTelemetry, so we will not use the OTEL collector (https://opentelemetry.io/docs/collector).\
    \ We use Grafana Tempo as the backend tracing, which allows Grafana to query traces.\
    \ In order to start Tempo locally, add the following piece of code to the docker-compose.yml:\n\
    \n```\ntempo:\n  image: grafana/tempo:2.3.1\n  container_name: \"easyshop-tempo\"\
    \n  extra_hosts: [ 'host.docker.internal:host-gateway']\n  command: [ \"-config.file=/etc/tempo.yaml\"\
    ]\n  volumes:\n    - ./tempo/tempo-local.yaml:/etc/tempo.yaml:ro\n    - /tempo-data:/tmp/tempo\n\
    \  ports:\n    - \"9411:9411\" # zipkin\n  depends_on:\n    - loki\n```"
  merge: -1
