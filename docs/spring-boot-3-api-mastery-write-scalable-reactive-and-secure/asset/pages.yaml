  md: "You can find the complete file in the asyncapi folder. You can learn more about\
    \ the AsyncAPI specification at the following link: https://www.asyncapi.com/docs.\n\
    \n# Error handling in Spring Cloud Stream\n\nIf an exception is raised in the\
    \ consumer, it is propagated to the binder, which makes several retries of the\
    \ same message (by the default number of retries is 3, including the first one).\
    \ Retries are handled automatically using the Spring Retry library, imported from\
    \ Spring Cloud Stream. You can change the number of retries on a single binding\
    \ using the property:\n\n```\nspring.cloud.stream.bindings.<binding-name>.consumer.max-attempts\n\
    ```\n\nIf this property is set to 1 and the DLQ is not enabled, then the default\
    \ consumer retires the number of Spring for Apache Kafka, which is 10. However,\
    \ if all retries fail, two handlers are used by default, the first one logs the\
    \ message, while the second depends on the type of binder. In this case, the second\
    \ handler simply deletes the message.\n\nLet us look at error handling in Spring\
    \ Cloud Stream in practice. We implemented the order service consumer in such\
    \ a way that it raises an exception if it receives a message with a non-existing\
    \ order code. To simulate this use case, we will manually send a message to the\
    \ Kafka topic.\n\nIn order to send a message to the Kafka topic, we run the following\
    \ command from the command line:\n\n```\ndocker exec -it broker /usr/bin/kafka-console-producer\
    \ \\ \n--bootstrap-server localhost:9092 --topic shipment_event_topic \\ \n--property\
    \ parse.key=true --property key.separator=\n```\n\nThe command allows you to send\
    \ a message by specifying the message key and payload, separated by: (semicolon).\
    \ We will enter the following record:\n\n```\nnot-exist:{\"not-exist\", \"status\"\
    : \"DELIVERING\"}\n```\n\nWe analyze the order service logs to verify that it\
    \ handled the error as we expected:\n\n```\n2024-06-01T19:15.980+02:00\nreceived\
    \ shipment event: GenericMessage[payload=...]\n2024-06-01T19:16.993+02:00\nreceived\
    \ shipment event: GenericMessage[payload=...]\n2024-06-01T19:17.007+02:00\nreceived\
    \ shipment event: GenericMessage[payload=...]\n```\n\n```\nLoggingHandler : org.springframework.messaging.\n\
    MessageHandlingException...Caused by com.easyshop.orderservice.exception.\n```"
  merge: -1
