  md: '# Spring Boot 3 API Mastery


    The integration of the OAuth resource server with Spring Security is simple. However,
    we can make it so that only users with a manager role can do better than that.
    We can make a manager role consume the write API, while all others (with a user
    role) can consume only the read API.


    # Role based access control with Spring Security


    RBAC is a technique for assigning permissions to users based on their assigned
    roles.


    In Keycloak, we have already censored the user John with the role of manager and
    the user Rossi with the role of user. However, we should make some changes to
    that the role information is present among both of the ID token and access token.


    # Roles claim in the token ID


    ![](img/95a54431500295eb58dcb6c7b7f7528e_263_0.png)


    Select Clients from the menu on the left. On this page, we will see all scopes
    defined on Keycloak, and we can create new ones. We are interested in editing
    roles claims, so click on the click. Let us click on the Mappers tab, which allows
    us to view a set of claims and edit their configuration. We are interested in
    the realm roles mapper, so we click on the ticker. This mapper already maps the
    list of logged-in users to an access token called realm_roles. We changed the
    name of the claim so that it is called roles and included it in the ID token,
    since we have created the user API on edge service that reads the claims from
    the ID token, while catalog service is from the access token. Figure 7.8 shows
    the final changes on the realm roles mapper.'
