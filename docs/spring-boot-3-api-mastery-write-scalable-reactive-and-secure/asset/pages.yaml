  md: '+   - Data format:


    +   - REST: By default, it uses JSON as its data format, which makes it both human
    and machine-readable. It is not bound to a schema file, so this format is more
    flexible than Protocol Buffers. However, it is less efficient in terms of size
    and parsing speed than binary formats.


    +   - gRPC: By default, it uses Protocol Buffers (protobuf) as its data format,
    which is a binary, compact, and fast serialization system. However, it needs a
    schema definition (proto file) that must be shared between the client and server


    +   - Performance:


    +   - REST: It may experience higher latencies due to the overhead of HTP/1.1
    and JSON parsing, especially when handling large volumes of data and requiring
    high performance.


    +   - gRPC: It offers superior performance to REST using HTTP/2 and protobuf.


