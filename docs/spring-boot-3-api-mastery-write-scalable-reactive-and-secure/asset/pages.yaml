  md: 'The flow of OIDC is based on the authorization code flow of OAuth2, and that
    is, in the Easyhop application, is realized in the following steps:


    +   When an unauthenticated user tries to access an API exposed by edge service,
    edge service redirects the browser to the Keycloak login page.


    +   The user enters their credentials, and if valid, Keycloak redirects the browser
    to the edge service callback URL, which contains, among the query parameters,
    the authorization code.


    +   Edge service invokes the Keycloak token endpoint to exchange the received
    authorization code with an ID token and an access token.


    +   Upon receiving a positive response from the token endpoint, the edge service
    initializes an authenticated user session with the browser using a session cookie
    and maintains a mapping between the session and the ID token.


