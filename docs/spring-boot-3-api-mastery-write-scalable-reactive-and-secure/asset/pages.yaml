- img_proc: true
  md: "# Asynchronous APIs with Spring Cloud Stream and Apache Kafka\n\nOrderNotFoundException:\
    \ Order with code not-exist not found\n\n```\nDefaultErrorHandler : Backoff exhausted\
    \ for shipment_event_topic-3@8...Caused: com.easyshop.orderservice.exception.\n\
    OrderNotFoundException: Order with code not-exist not found\n```\n\nEffectively,\
    \ the message is processed three times. Since all three attempts failed, the error\
    \ is handled by the logging handlers and the default Kafka handler. One aspect\
    \ to note is the time interval between attempts. Since the default backoff interval\
    \ is set to 1000 milliseconds, the second attempt is made after one second from\
    \ the first. Also, since the default backoff multiplier is set to 2,0, the third\
    \ attempt is about two seconds after the previous one (1000 milliseconds x 2.0).\n\
    \nYou can change the value of these parameters by setting the property spring.cloud.stream.bindings.<binding_name>.consumer.back-off-initial-interval\
    \ and spring.cloud.stream.bindings.<binding_name>.consumer.back-off-multiplier.\n\
    \nThere are situations when it is not enough to log the discarded message. Spring\
    \ Cloud Stream makes it easy to handle discarded messages by sending them in a\
    \ Dead Letter Queue (DLQ). To do this, you set the property spring.cloud.stream.kafka.bindings.<binding_name>.\
    \ Optionally, you can supply the DLQ topic name with the spring.cloud.stream.kafka.bindings.<binding_name>.consumer_dlq\
    \ name. If this property is not valued, Spring Cloud Stream will try to send the\
    \ discarded message on a topic having the name .original_topic_name.group_id.\
    \ We then add in the application.properties file, the configurations for the DLQ:\n\
    \n```\nspring.cloud.stream.kafka.bindings.handleShipmentEvent-in-0.consumer.enable-dlq=true\n\
    ```\n\n```\nspring.cloud.stream.kafka.bindings.handleShipmentEvent-in-0.consumer.dlq-name=shipment_event_topic_dlq\n\
    ```\n\nResend the previous message in the topic and look at the order service\
    \ logs. Kafka's default handler has been replaced by DLQ. You can verify that\
    \ the DLQ is working by properly reading the message in the shipment_event_topic_dlq\
    \ topic by running the following command:\n\n```\ndocker exec -t broker /usr/bin/kafka-console-consumer\
    \ \\ \n--bootstrap-server localhost:9092 shipment_event_topic_dlq \\ \n--from-beginning\
    \ --property key=true --property print.partition=true\n```\n\nYou should see the\
    \ following discarded message:\n\n```\nPartition:3 not-exist {\"orderCode\": \"\
    not-exist\", \"status\": \"DELIVERING\"}\n```"
