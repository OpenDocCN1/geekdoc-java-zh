    \ interface ProductRepository extends R2dbcRepository<ProductEntity, Long> {\n\
    ```\n\nIt is an empty interface you do not need to implement. Spring Data will\
    \ automatically create a bean of type SimpleR2dbcRepository at runtime, that will\
    \ implement that interface using the Proxy pattern. This repository offers out-of-the-box\
    \ common methods such as findAll, findById, save, and deleteById. In addition,\
    \ you can write additional methods, always by using the name convention findByname_field.\
    \ For example, if you added findAllByName, Spring Data would automatically implement\
    \ the method that will query the name field. In addition, Spring Data offers many\
    \ modules besides R2BC, as Java Database Connectivity (JDBC) and Java Persistence\
    \ API (JPA); however, the interfaces allow the same methods. You can swap Spring\
    \ Data modules without changing the business logic of the application.\n\nThe\
    \ last step in connecting the application to the database is to give it the connection\
    \ data. Go to the application.properties file and write the following lines:\n\
