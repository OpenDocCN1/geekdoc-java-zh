    # API versioning strategies


    Versioning is a fundamental practice in API design to manage its evolution and
    compatibility over time. When developing APIs, it is important to consider how
    future changes and additions will be handled to ensure clients can continue to
    use them without interruption. There are several strategies for versioning APIs
    mentioned below:


    +   * **Versioning by URI**: In this strategy, the version of the API is included
    directly in the URI of the request. For example, `/api/v1/users` and `/api/v2/users`
    represent two different versions of the same API. This approach makes APIs more
    complex and less readable.

    * **Versioning by headers**: In this strategy, the API is specified via an HTTP
    header, such as Accept-Version: v1. This keeps resource URIs cleaner but requires
    management over the logic of HTTP headers by both the client and server.

    * **Versioning by Content Negotiation**: This is a subset of the strategy in the
    previous point. In this strategy, the client specifies the'
  merge: -1
  pgno: 31
- img_proc: true
  md: 'header, typically by defining a custom media type as application/vnd.

    example.v1+json. This allows versioning at the content level rather than in

    URI. However, it requires explicit content negotiation logic on both the client
    and

    server sides, and some clients might not fully support custom media types.


    +   - **Versioning by query parameters:** In this strategy, the API is specified
    as a

    query parameter in the URI of the request, for example, `/api/users?version=1`.


    Regardless of the strategy adopted, it is also important to provide a standard
    for

    version numbering. Very popular is the semantic versioning, which involves the
    use

    of version numbers with a specific format `<MAJOR>.<MINOR>.<PATCH>`. Refer to
    the

    explanations:


    +   - **MAJOR:** It is increased when changes are made that are incompatible with

    previous versions or new incompatible features are introduced. For example, in

    the new version of the resource retrieval API, the structure of the response body

    will change.


    +   - **MINOR:** It is increased when we add new features compatible with the
    previous

    versions. For example, in the new version of the search API, a new query parameter

    added to filter on an additional field.


    +   - **PATCH:** It increases when bugs are fixed, or minor changes are made that
    are

    compatible with the previous versions. For example, the new version of the API

    fixes a bug in the previous version where a field in the response body was being\valued
    incorrectly.


    There is no best strategy for API versioning, although versioning via URIs is
    the most

    common. However, it is important to choose the versioning mode before publishing
    the

    first version of the API so that clients are prepared for any future versions.
    In addition,

    APIs in the application should follow the same strategy.


