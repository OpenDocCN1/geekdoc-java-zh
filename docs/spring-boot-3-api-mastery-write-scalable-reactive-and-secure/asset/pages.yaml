    \nFigure 4.1: An example of a GraphQL server retrieving data from different sources\n\
    \n# Schemas and types\n\nA GraphQL service is created by first defining one or\
    \ more schema files, which contain the definition of the data types handled by\
    \ the server. A GraphQL schema definition that handles books might be similar\
    \ to the one shown below:\n\n```\ntype Book {\n  id: ID\n  name: String\n  pageCount:\
    \ Int\n  author: Author\n}\n```\n\n```\ntype Author {\n  id: ID\n  firstName:\
    \ String\n  lastName: String\n}\n```\n\nYou can see from the example that field\
    \ types can refer to scalars, such as the name field, which is of type String,\
    \ or to other types, such as the author field which is of type Author. The scalar\
    \ types available by default in GraphQL are listed in Table 4.1:\n\n| Type | Description\
    \ |\n| --- | --- |\n| Int | A signed 32-bit integer |\n| Float | A signed double-precision\
    \ floating-point value |\n| String | A UTF-8: 8 character sequence |\n| Boolean\
    \ | Represents the following values: true, false |\n| ID | A unique identifier,\
    \ serialized in the same way as a String |\n\nTable 4.1:"
