  md: "# Centralized Security with Spring Cloud Gateway 231\n\ncircuit breaker parameters\
    \ can be configured using Resilience4j properties. One possible configuration\
    \ is as follows:\n\nroutes:\n\n```\n- id: catalog-service\n  uri: http://localhost:8080/products\n\
    predicates:\n  - Path=/products/**\nfilters:\n  - name: CircuitBreaker\n    args:\n\
    \      name: catalogServiceCircuitBreaker\n      fallbackUri: forward:/catalog-service-fallback\n\
    ```\n\n```\nresilience4j:\ncuitbreaker:\nconfigs:\n  default:\n    slidingWindowSize:\
    \ 10\n    permittedNumberOfCallsInOpenState: 2\n    failureRateThreshold: 50\n\
    \    waitDurationInOpenState: 15000\n```\n\nLet us analyze the following parameters\
    \ of Resilience4j:\n\n+   * slidingWindowSize: This parameter defines the size\
    \ of the sliding window used to calculate the failure rate. In this, the circuit\
    \ breaker evaluates the state of the last ten calls.\n\n+   * permittedNumberOfCallsInOpenState:\
    \ This parameter specifies the number of calls that are allowed during the Half-Open\
    \ state. When the circuit breaker switches from the Open to Half-Open state, it\
    \ allows two calls to check whether the service has returned to proper operation.\
    \ If two calls are successful, the circuit breaker returns to the Closed state,\
    \ otherwise if at least one, it returns to the Open state.\n\n+   * failureRateThreshold:\
    \ This parameter defines the failure rate threshold above which the circuit breaker\
    \ switches to the Open state. In this case, if more than 50% of the calls in the\
    \ scroll window fail, the circuit breaker will open."
