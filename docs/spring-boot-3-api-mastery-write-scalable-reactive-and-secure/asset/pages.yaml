    # Conclusion


    In this chapter, we looked at how to secure the Easyshop API. We created a new
    microservice, edge service, which acts as an API Gateway, in such a way to handle
    cross-cutting concerns as security aspects and resilience of Easyshop, applying
    retry and circuit breaker patterns. We have seen the OIDC authentication flow
    and OAuth2 authorization flow work, using Spring Security and Keycloak as the
    IS. In addition, we also applied a role policy to the resource server API so that
    only users with the manager role could use the catalog service writing API. However,
    to have an application ready to be released into production, we must also consider
    a good observability mode so that we can detect problems and possibly create alerts
    if unanticipated situations occur.


    In the next chapter, we will see how to implement this with Spring and OpenTelemetry.'
