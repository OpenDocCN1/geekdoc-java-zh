    \ false\n```\n\nIn addition, we enable tracing and, for simplicity, send all traces\
    \ to the Zipkin endpoint, setting the sampling probability to 1.0. The complete\
    \ configuration of the Spring Boot Actuator is as follows:\n\n```\nmanagement:\n\
    \  otlp:\n    metrics:\n      export:\n        enabled: false\n  endpoints:\n\
    \    web:\n      exposure:\n```"
