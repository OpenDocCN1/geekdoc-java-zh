    Gateway, Spring''s module for implementing an API Gateway. The API Gateway plays
    a key role in hiding downstream services from the outside world, acting as a reverse-proxy,
    but not only that, it also handles cross-cutting concerns. We will see how to
    make the Easysop application resilient through Resilience4J with Spring Cloud
    Gateway, applying retry and'
