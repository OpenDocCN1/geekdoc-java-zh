  md: '# Points to remember


    +   - Spring Boot allows the creation of container images without the need to
    write Dockerfiles.


    +   - The values of properties declared in the application.properties file, are
    overridable via environment variables using a specific naming convention.


    +   - Releasing a Spring Boot application on a Kubernetes cluster requires no
    code changes.


    +   - Spring Boot Actuator provides out-of-box liveness and readiness probe endpoints.


    # Exercises


    +   1. Try releasing the other microservices on the Kubernetes cluster as well.


    +   2. Experiment with scaling the replicas of the deployed services and observe
    how Kubernetes distributes the load.


    +   3. Configure liveness and readiness probes for one of the microservices and
    test their impact on service availability during a simulated failure.


