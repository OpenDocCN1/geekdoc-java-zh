    Another important concept in the Reactor library is the scheduler. Most operators
    continue to work on the same thread in which the previous operator was executed.
    Unless otherwise specified, the topmost operator, i.e., the data source, is executed
    in the same thread in which the subscribe() method was called. However, the library
    allows developers to choose different concurrency management strategies by using
    schedulers.


    A scheduler can be thought of as an object similar to java.util.concurrent.ExecutorService,
    dedicated to the reactive paradigm. The schedulers class has static methods for
    creating different schedulers:


    +   Sched.immediate(): This scheduler executes operations on the same thread as
    the caller. It is mostly used on APIs that require a scheduler as an input, but
    do not require execution on new threads.


    +   Schedulers.single(): This scheduler uses a single thread to execute all scheduled
    operations. It is particularly useful for operations that must be executed sequentially
    or require access to shared resources, avoiding concurrency.


    +   Schedulers.boundedElastic(): This scheduler uses a thread pool with a pre-defined
    upper limit to execute scheduled operations. It is particularly useful for blocking
    operations, such as Input/Output (I/O) operations, so that other resources are
    not kept busy. As of Reactor version 3.6.0, it has two implementations, one that
    works on platform threads and one that works on virtual threads.


    +   Schedulers.parallel(): This scheduler uses a pool of dedicated threads to
    perform operations in parallel. The number of threads in the pool can be specified,
    allowing you to control the level of parallelism. It is useful for operations
    that can be executed independently and benefit from parallelization.


    Some operators use specific schedulers, by default, as Flux.interval(), Flux.delayElement(),
    Mono.delay() which uses Schedulers.parallel().


    In Reactor, two operators allow changing the execution context via scheduler,
    publishOn and subscribeOn. Let us see the differences:


    +   publishOn(): It is used to specify the execution context for subsequent operations
    in the data stream. This means that all operations after the publishOn operator
    will be executed on a thread associated with the scheduler specified by publishOn.
    This can be useful for changing the execution context for computationally expensive
    operations on a separate thread, thus blocking the main thread.


    +   subscribeOn(): It is used to specify the execution context for the entire
    data stream, including subscription operations and subsequent operations in the
    stream.'
