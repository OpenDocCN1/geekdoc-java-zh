    # # Introduction to Spring MVC


    The Spring MVC framework is called this way because it allows the Model-View-Controller
    pattern to be implemented. In the past, before the development of libraries and
    frameworks such as React and Angular, pages were generated by the server, not
    the client. The Model-View-Controller pattern divides the logic of data management,
    manipulation, and visualization into components. Specifically, the model component
    is responsible for managing and manipulating the business model, the view component
    is responsible for passing model data to the view and vice versa. Although this
    pattern is still used today, the Spring MVC module is widely used for more creating
    REST services.


    Spring MVC follows the thread-per-request model and is designed around a Servlet
    that handles requests and dispatches them to controllers, implementing the Front
    Controller pattern. Specifically, the Servlet that acts as the Controller in Spring
    is called the DispatcherServlet, which receives HTTP requests, and a HandlerMapping
    which is responsible for mapping URLs to Controller classes (annotated with @Controller)
    and its methods (annotated with @RequestMapping), invokes the Controller class
    method mapped to the input endpoint. Figure 3.2 shows what has been described
    so far:


