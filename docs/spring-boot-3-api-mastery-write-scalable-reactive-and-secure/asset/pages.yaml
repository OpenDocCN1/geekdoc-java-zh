    # The AsyncAPI specification


    Before we move on the error handling section, although we will not go into it
    in this

    book, we would like to introduce you to an open-source initiative called AsyncAPI.
    The

    latter is a specification for documenting asynchronous APIs (i.e., message-driven
    APIs),

    taking a cue from the OpenAPI initiative. The specification is agnostic to the
    protocol

    used, so it can be used for WebSockets, Kafka, AMQP, MQTT, let us look at the
    main

    components of the specification in practice, using the order service consumer
    API.


    Similar to OpenAPI, the AsyncAPI document begins with version information of the

    specification used and descriptive information:


    ```

    asyncapi: 3.0.0

    ```


    ```

    info:

    title: Shipment Event Consumer

    version: 1.0.0

    description: |

    This service consumes shipping events from Apache Kafka and up-

    dates the status of orders in the database.

    ```


    The server section is used to specify information about the message broker used,
    such as

    the URL and protocol, as shown in the following code:


    ```

    servers:

    kafkaServer:

    host: localhost:9092

    description: Kafka server running locally

    protocol: kafka

    ```'
