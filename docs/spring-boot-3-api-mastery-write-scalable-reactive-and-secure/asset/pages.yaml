  md: 'Introduction to REST Architecture and API-First Approach 19


    # API-first approach


    In a traditional approach, we tend to start with the actual implementation of
    the software without detailed API design. The priority is on code development,
    with documentation and API design following afterwards. With this approach, changes
    to APIs may require significant changes to the existing code with the risk of
    causing compatibility problems.


    The API-first approach aligns the API design with the design phase of the Software
    Development Life Cycle (SDLC), treating the API definition as a core component
    from the outset. Rather than considering API design as a secondary activity or
    a later implementation, the API-first approach involves defining API specifications
    in detail before starting the actual software implementation. This ensures that
    the API design is robust and supports the application architecture effectively.
    The main advantages of this approach are mentioned below:


    +   - By prioritizing API design, developers can focus on writing well-documented
    APIs that can easily evolve over time.


    +   - It promotes collaboration among development teams, analysts, and project
    stakeholders.


    +   - The API consumers will have documentation to work with immediately, without
    the need to wait for software developments. This is very important in a microservice
    architecture as it allows for parallelization of developments between services.


    +   - At the stage after the OpenAPI documentation is written, developers can
    concentrate solely on the software development of the API, as it is already well
    defined.


    +   - Developers can use the swagger mignon to automatically generate code, such
    as classes representing API resources.


    # Conclusion


    In this chapter, we have seen what an API is, and the different types of communication
    between microservices, with more emphasis on the REST architecture. Now that we
    have a solid foundation for writing APIs that fully respect the REST architecture,
    we must put it into practice by implementing REST services with Java and Spring
    Boot. In the next chapter, we will see how to implement this approach in a Spring
    Boot application through the OpenAPI Generator library.


    # Points to remember


    +   - Microservices communicate via APIs.


    +   - The type of communication can be synchronous or asynchronous.'
