  md: "# 270 Spring Boot 3 API Mastery\n\nNote: What is context propagation? The TraceID\
    \ is added into the logs via the MDC (Mapped Diagnostic Context). MDC is a mechanism\
    \ provided by logging frameworks like Logback and Log4j, which enriches logs by\
    \ storing key-value pairs (e.g., TraceID or SpanID) in a thread-local map. In\
    \ traditional, non-reactive applications, MDC is widely used to correlate logs\
    \ across the lifecycle of a request since the entire process typically occurs\
    \ on the same thread. However in reactive programming, where a single HTTP request\
    \ may span multiple threads, MDC becomes less effective because thread-local storage\
    \ does not propagate across threads. To address this, context propagation mechanisms\
    \ are introduced to ensure that the reactive context is linked with the ThreadLocal\
    \ objects. This linkage allows the key-value pairs in MDC to be available across\
    \ different threads transparently, maintaining the correlation of logs even in\
    \ highly concurrent reactive systems.\n\nWe have finished the tracking configuration\
    \ in the edge service. Bring the same configurations back into the catalog service.\
    \ All that remains is to visualize the logs, metrics, and traces on Grafana dashboards.\n\
    \n# Monitoring with Grafana\n\nGrafana is an open-source platform for data visualization\
    \ and analysis that enables the creation of interactive and customized dashboards.\
    \ It supports a variety of data sources, including Prometheus, Elasticsearch,\
    \ AWS CloudWatch, Google Cloud Monitoring, Azure Monitor, and many others. This\
    \ capability allows data from multiple systems to be integrated into a single\
    \ visualization platform. It also supports the creation of alerts on specific\
    \ metrics. Users can set thresholds and receive notifications via email, Slack,\
    \ or other communication channels when metrics exceed defined thresholds. In our\
    \ case, Grafana is configured to integrate seamlessly with Loki, Tempo, and Prometheus\
    \ to display logs, traces, and metrics, respectively. The integration is achieved\
    \ by defining the data sources in a configuration file, datasource.yml, as shown\
    \ below:\n\n```\napiVersion: 1\n```\n\n```\ndatasources:\n  - name: prometheus\n\
    \    type: prometheus\n    access: proxy\n    url: http://host.docker.internal:9095\n\
    \    editable: false\n    jsonData:\n      httpMethod: POST\n      exemplarTraceIdDestinations:\n\
    \        - name: trace_id\n```"
  merge: -1
  pgno: 287
