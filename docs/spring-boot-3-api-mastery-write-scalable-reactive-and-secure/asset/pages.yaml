    # Introduction to Kubernetes


    Kubernetes, often abbreviated as K8s, is an open-source container orchestration
    platform that automates the deployment, management, and scalability of containerized
    applications. Originally developed by Google and later donated to the Cloud Native
    Computing Foundation (CNCF), Kubernetes has become the standard for managing modern,
    container-based applications in production environments.


    The development of microservices architecture has caused container technology
    to become increasingly popular. However, while they are lightweight and portable
    entities, managing hundreds or thousands of containers in production environments
    can become complex and error-prone.


    Kubernetes addresses these challenges by providing a robust, automated infrastructure
    for large-scale container control and management. In particular, Kubernetes provides
    the following features:


    +   - Orchestration: Kubernetes automates container deployment and management,
    reducing operational load and improving application reliability.


    +   - Dynamic scalability: It allows applications to scale automatically based
    on demand. Kubernetes continuously monitors resources and can add or remove containers
    based on application needs.


    +   - Self-healing: Kubernetes automatically detects container failures and restarts
    them if necessary, ensuring that the application remains operational even in the
    event of unexpected failures.'
  merge: -1
  pgno: 304
- img_proc: true
  md: '# Spring Boot 3 API Mastery


    +   - Load management: Automatically distributes network traffic among containers,
    balancing the load to optimize performance and prevent overloading on individual
    components.


    +   - Rolling updates: Supports rolling updates of applications, allowing new
    versions of software to be deployed in a safe and controlled manner, without having
    downtime.


    +   - Integration with Cloud ecosystems: Kubernetes natively integrates with cloud
    providers, such as AWS, Google Cloud, and Microsoft Azure, facilitating the deployment
    of applications in hybrid and multi-cloud environments.


    Although the architecture of Kubernetes is complex, we can list the main components,
    mentioned below:


    +   - Kubernetes cluster: A cluster consists of a set of nodes (physical or virtual
    servers). A cluster consists of at least one control plane type and one or more
    worker nodes.


    +   - Worker nodes: Each worker node in a Kubernetes cluster runs one or more
    Pods (groups of one or more containers). Worker nodes include components such
    as kubelet (an agent that runs containers), kube-proxy (networking management),
    and Container Runtime (e.g., Docker or containerd).


    +   - Control plane: The control plane is responsible for managing the Kubernetes
    cluster and monitoring the Pods. It includes components as kube-apiserver (API
    interface), etcd (distributed database), kube-scheduler (container placement management),
    and kube-controller-manager (controller for cluster state management). To ensure
    reliability, more control plane nodes can be added. This redundancy is crucial
    if the control plane becomes unavailable, the cluster might not be able to create
    Pods, scale up or down, or maintain the desired state. Having multiple control
    plane nodes allows the cluster to remain functional, as other nodes can take over
    in case of a failure, minimizing downtime and ensuring consistent operations.


    +   - Pod: The Pod is the basic unit of execution in Kubernetes and can contain
    one or more containers that share the same network and storage space. Pods are
    ephemeral entities, meaning they can be terminated and replaced automatically.
    To manage the number or availability of Pods, you can configure the maximum and
    minimum replicas in a ReplicaSet. Additionally, the Horizontal Pod Autoscaler
    (HPA) can be used for dynamic scaling, adjusting the number of Pods based on resource
    usage or custom metrics


    +   - Service and Ingress/Gateway: Kubernetes uses Services to expose Pods inside
    or outside the cluster, communication between application components. Ingress
    and Gateway provide a way to manage external access to applications.'
