- img_proc: true
  md: "# An overview of Spring Cloud Function\n\nSpring Cloud Function promotes the\
    \ use of functions to implement business logic. It allows the execution of functions\
    \ in both local and PaaS environments such as AWS Lambda. In addition, the implementation\
    \ of functions is independent of the target runtime used, they can be executed\
    \ via REST APIs, task, and message brokers.\n\nFunctions are implemented through\
    \ the interfaces of java.util.function, refer to the following points for a better\
    \ understanding:\n\n+   * The Consumer<T> interface allows you to create functions\
    \ that accept input and do not return output.\n\n+   * The Supplier<T> interface\
    \ allows you to create functions that accept no input parameters but return an\
    \ output.\n\n+   * The Function<T, R> interface allows you to create functions\
    \ that accept input parameters and return an output.\n\nAn example of the use\
    \ of these interfaces is mentioned below:\n\n```\n@Bean\nSupplier<String> hello()\
    \ {\n    return () -> \"hello\";\n}\n```\n\n```\n@Bean\nFunction<String, String>\
    \ uppercase() {\n    return value -> value.toUpperCase();\n}\n```\n\n```\n@Bean\n\
    Consumer<String> print() {\n    return value -> System.out.println(value);\n}\n\
    ```\n\nIn addition to the imperative paradigm, Spring Cloud Function allows functions\
    \ to be built using the reactive paradigm. Functions are annotated with @Bean\
    \ since they must be Spring beans. In addition, functions to be used by other\
    \ frameworks such as Spring Cloud Stream, must be declared via the spring.cloud.function.definition\
    \ property, for example:\n\n```\nspring.cloud.function.definition=hello;uppercase;print\n\
    ```"
  merge: -1
  pgno: 199
- img_proc: true
  md: "Supplier-type functions used in frameworks such as Spring Cloud represent the\
    \ source of event streams. They can be either imperative (Supplier<T>) or reactive\
    \ (Supplier<Flux<T>>). Compared to Function and Consumer type functions, taking\
    \ no input, they are not triggered by any event, partly because they represent\
    \ the data source themselves. There is a default polling mechanism that executes\
    \ the imperative functions of type Supplier, every second. Reactive functions,\
    \ on the other hand, are executed only once, compared to the imperative version,\
    \ they do not produce a single event but a stream of messages, which could potentially\
    \ be infinite. However, you might want to poll reactive functions as well, for\
    \ example, to query on databases. To do this, just annotate the reactive function\
    \ with @Bean instead of @Bean.\n\nFunctions of type Consumer can also be imperative\
    \ and reactive. Functions of type Consumer can be both imperative and reactive.\
    \ Since they are functions do not return a result, they require further study.\
    \ If the function is imperative, then the latter returns the void type. Otherwise,\
    \ if it is reactive, it may return a Flux of events. However, to work, the function\
    \ must be subscribed, as shown in the following example:\n\n```\n@Bean\npublic\
    \ Consumer<Flux<String>> print() {\n    return fluxEvent\n    .doNext(message\
    \ -> System.out.println(message))\n    .subscribe();\n}\n```\n\nAlternatively,\
    \ you can use a function of the following type Function<Flux<T>, Mono<Void>> to\
    \ achieve the same result:\n\n```\n@Bean\npublic Function<Flux<String>, Mono<Void>>\
    \ print() {\n    return fluxEvent\n    .doNext(message -> System.out.println(message))\n\
    \    .then();\n}\n```\n\nYou can also compose several functions into one by using\
    \ | (pipe) or, (comma) as the function delimiter of the spring.cloud.function.definition\
    \ property. Refer to the following example:\n\n```\nspring.cloud.function.definition=uppercase|print\n\
    ```\n\nIn the example above, the output of the uppercase function will be the\
    \ input of the print function."
