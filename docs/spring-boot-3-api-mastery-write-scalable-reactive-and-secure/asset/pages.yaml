    In the context of load distribution on message reading, the concepts of partition
    and consumer group are very important. Indeed, partitions allow simultaneous reading
    of messages among consumers in the same message group. However, it is important,
    when creating the number of partitions, balancing the advantage of having many
    can result in better load distribution among consumers, but having too many can
