  md: "# Richardson Maturity Model level 3: HTTP verbs\n\nThe final layer introduces\
    \ the concept of Hypermedia As The Engine Of The Application State (HATEOS). It\
    \ emphasizes the importance of including hypermedia links in REST API responses\
    \ to guide the client through interactions with resources. The fundamental idea\
    \ of HATEOS is to make the server a kind of map to clients so they have all the\
    \ information they need to dynamically navigate through various resources and\
    \ actions available.\n\nEach resource contains links to all related resources\
    \ and more, this allows the client to be told what other resources are linked\
    \ to the resource without burdening the body of the response, since these are\
    \ simple links. An additional advantage is that the client can explore the calls\
    \ made available by the server without any real document of the API (although\
    \ tools such as OpenAPI and Swagger exist to document REST APIs). The resource\
    \ can easily be enriched with new relationships to other resources by simply inserting\
