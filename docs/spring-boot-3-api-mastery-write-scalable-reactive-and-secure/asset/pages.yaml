  md: 'requests in parallel, you could modify the configuration of the Servlet Container,
    increasing the number of threads in the pool. Increasing the number of threads,
    however, results in having to use more CPU, Java threads being mapped one-to-one
    with platform threads. More processing in the cloud means overhead. We will see
    in the next chapter how virtual threads have changed the concept of threads within
    the Java ecosystem. The Spring MVC framework uses the thread-per-request model.


    In the event loop model, used by non-blocking reactive frameworks such as Netty
    and Spring WebFlux, a single thread can handle multiple HTTP requests. Each request
    is placed in an event queue. The main thread, in the event loop, picks events
    from the queue as it goes and processes them. If it encounters a blocking operation
    in the processing, it registers a callback on a dedicated thread without blocking
    the main thread, so more events are queued from the queue. When the blocking operation
    ends, the callback returns the result to the event loop. In this mode, you have
    no blocked threads waiting for a result, which leads to several advantages:


    +   - **Scalability**: The event loop can handle many simultaneous requests by
    using fewer threads.


    +   - **Resource efficiency**: The event loop avoids wasting resources that are
    waiting for the blocking operations to complete.


    +   - **Cost efficiency**: Able to use fewer resources to handle more requests
    inevitably results in cost savings, in the cloud you pay for what you use.


    Figure 2.3 shows the operation of the event loop model:


