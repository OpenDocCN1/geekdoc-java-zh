  md: "```\n{\n  \"keys\": [\n    {\n      \"kty\": \"RSA\",\n      \"kid\": \"1234abcd\"\
    ,\n      \"use\": \"sig\",\n      \"n\": \"0vx7agoebGcSSuuLiJXZptN27...T9yEoQ\"\
    ,\n      \"e\": \"AQAB\"\n    }\n  ]\n}\n```\n\nCatalog service uses the public\
    \ key of the list having the kid field that matches the kid of the access token\
    \ to verify the validity of the access token. The result of the call to the JWKS\
    \ endpoint is to save calls to the authorization server for subsequent requests.\
    \ If the IP rotates keys, the resource server, when it receives the access token,\
    \ will not find the kid value among the cached ones, so it will call the JWKS\
    \ endpoint again and update the cache.\n\nHowever, the OAuth2 flow seen is the\
    \ authentication code flow. The following are other types of flows that we will\
    \ not read in this chapter:\n\n+   * Implicit: A simplification of the authorization\
    \ code flow for clients implemented in a browser as JavaScript clients. In the\
    \ implicit flow, the IP returns the ID token immediately, skipping the step of\
    \ exchanging between authorization code and the ID token.\n* **Resource owner\
    \ password credentials**: Allows an access token to be derived using credentials\
    \ directly. Only when there is a high degree of trust between the resource owner\
    \ and the client application.\n* **Client credentials**: Allows an access token\
    \ to be obtained using clientid and secret. Useful when the client is also the\
    \ resource owner.\n\nNow that we have seen the theoretical concepts of security,\
    \ we are ready to put them into practice, with Keycloak and Spring Security.\n\
    \n> **Note: Choosing which component should be the OAuth2 client is not easy,\
