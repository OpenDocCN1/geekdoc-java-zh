    \ the virtual threads use by default a scheduler of type ForkJoinPool, which differs\
    \ from the other ExecutorServices in which it work-stealing.\n\nWork-stealing\
    \ is a scheduling algorithm used to optimize CPU resource utilization and mitigate\
    \ congestion points. The ForkJoinPool uses a scheduling model based on the concept\
    \ of tasks, where a task represents a unit of work that can be executed in parallel\
    \ with others. The thread pool of the ForkJoinPool consists of a set of workers,\
    \ each of which is associated with a work queue containing the tasks to be executed.\
    \ The work-stealing algorithm allows thread workers to steal from other workers\
    \ when their queue is empty. This mechanism promotes a dynamic distribution of\
    \ workload among thread workers and helps maintain an even utilization of CPU\
    \ resources, avoiding situations where some threads are overloaded while others\
    \ are idle.\n\nVirtual threads are suitable for applications that have many blocking\
    \ operations. They are not suitable for CPU-intensive applications. Also, with\
    \ the fact that you can create thousands of threads, it may store too much data\
    \ in context (think about the use of ThreadLocal)."
