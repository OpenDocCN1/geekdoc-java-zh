  \ 7，可以使用 `radio button group`（单选按钮组）进行渲染。\n\n4. 它始终可以使用单选控制控件进行渲染。\n\n#### 1.10.6\
  \ 问题 6：表达功能类型\n\n在“x-to-y”形式（其中 `x`、`y` 表示“一个”或“多个”）中，哪个术语可以表示该关联既不是函数性的，也不是反函数性的？\n\
  \n答案：________________________________\n\n## 2 使用原生 JS 实现单向函数关联\n\n单向 `functional`\
  \ 关联是一对一或多对一的。在这两种情况下，这种关联都通过借助 `single-valued` 引用属性来表示或实现。\n\n在本章中，我们将展示：\n\n1.\
  \ 如何从具有表示 `unidirectional functional associations` 的单值引用属性的 OO 类模型推导出原生 JS 类模型，\n\
  \n2. 如何以原生 JavaScript 模型类的形式编写 JS 类模型，\n\n3. 如何基于模型代码编写视图和控制器代码。\n\n在展示如何推导原生 JS\
  \ 类模型并用 JavaScript 编写代码之前，我们首先介绍 JavaScript 语言的几个新元素，这些元素将在本书讨论的整个 JavaScript 代码中使用。\n\
  \n### 2.1 新的 JavaScript 元素\n\n在本节中，我们将介绍由 ECMAScript 2015+（即 2015+16+17+18+19+20+\
  \ …）引入 JavaScript 的最重要的新语言元素。\n\n#### 2.1.1 使用 `let` 和 `const` 的块作用域变量声明\n\nES5\
  \ 不允许声明作用域为一对大括号 `{` 和 `}` 围定的块，或由 `for` 循环定义的变量。相反，所有用 `var` 声明的变量即使在块内声明，也具有函数作用域或全局作用域。使用\
  \ `let` 和 `const` 的 `block-scope variable declarations` 新功能允许具有更细粒度作用域的局部变量，有助于避免意外的变量重复并产生更模块化的代码。\n\
  \n`let` 和 `const` 之间只有一个意义区别。用 `const` 声明的变量是`冻结`的或不可变的，从这个意义上来说是“常量”，而 `let` 变量不是。对于所有不应改变值的变量，最好使用\
  \ `const`。否则，或者如果不明确，如果是块作用域变量，应用 `let` 声明；如果是全局或函数作用域变量，则应用 `var` 声明。\n\n#### 2.1.2\
  \ 箭头函数\n\n与经典的 JS 函数相比，箭头函数（使用 `=>`）提供了更简洁的函数表达式语法（见示例 1），并允许在函数体中使用函数外部环境（其 `closure`）的\
  \ JavaScript `this` 变量（见示例 2）。\n\n**示例 2.1.**\n\n```\n let evens = [0,2,4,6,8];\n\
  let odds = evens.map( v => v+1); // [1,3,5,7,9]\n// instead of evens.map( function\
  \ (v) {return v+1;})\n```\n\n**示例 2.2.**\n\n```\n this.nums = [1,3,5,8,10,12,15,17];\n\
  this.fives = [];\nthis.nums.forEach( v => {if (v % 5 === 0) this.fives.push(v);});\n\
  // instead of this.nums.forEach(\n//     function (v) {if (v % 5 === 0) this.fives.push(v);},\
  \ this)\n```\n\n#### 2.1.3 可迭代对象的 For-Of 循环\n\n迭代对象包括字符串、数组、类数组对象（例如内置的 `arguments`\
  \ 对象或 `HTMLCollections` 和 `NodeList` 的实例）、类型对象 `TypedArray`、`Map` 和 `Set` 的实例，以及用户定义的迭代器。例如：\n\
  \n```\n const divElems = document.getElementsByTagName(\"div\");\n// an HTMLCollection\
  \ is iterable\nfor (let dEl of divElems) {\n     console.log( dEl.id);\n}\n```\n\
  \n当不需要计数器时，`for-of` 循环通常比 `for` 循环更方便。与 `forEach` 循环不同，`for-of` 循环允许遍历 `HTMLCollections`\
  \ 并可以使用 `break` 退出。\n\n#### 2.1.4 模板字面量\n\n… 使用引号（如 ` … `）而不是双引号或单引号包裹，并允许对由固定文本部分和变量/表达式组合成的（可能是多行的）字符串值使用简洁的语法。例如：\n\
  \n```\n const classValues = \"card important\";\nconst name = \"Joker\";\nconst\
  \ htmlTemplate = `<div class=\"${classValues}\">\n     <p>Hello ${name}!</p>\n</div>`\n\
  ```\n\n#### 2.1.5 展开运算符\n\n…允许展开（1）数组元素、（2）对象的属性。例如：\n\n```\nconst arr = [1, 2,\
  \ 3];\nconst [...copy] = arr;\n\nconst obj = {a: 1, b: 2};\nconst {...copyObj} =\
  \ obj;\n```\n\n#### 2.1.6 解构赋值\n\n…允许从数组或对象中提取值的简洁语法。例如：\n\n```\nconst point = [1,\
  \ 2];\nconst [x, y] = point;\n\nconst user = {name: \"Alice\", age: 30};\nconst\
  \ {name, age} = user;\n```\n\n\n\n\n\n```javascript\n class Book {\n     constructor\
  \ ({isbn, title, year,\n              publisher, publisher_id}) {\n         …\n\
  \         // assign object reference or ID reference\n        if (publisher || publisher_id)\
  \  {\n              this.publisher = publisher || publisher_id;\n         }\n  \
  \       …\n     }\n     …\n}\n```\n\n注意，记录参数的 `publisher` 字段表示一个 JS 对象引用，而其 `publisher_id`\
  \ 字段表示一个 ID 引用。在 JavaScript 中，我们可以使用析取表达式（如 `expr1 || expr2`）来获取第一个表达式的值，如果它已定义（且不为\
  \ 0），否则获取第二个表达式的值。我们在属性设置器（setter）中通过检查参数的类型来处理由此产生的歧义，如下代码片段所示：\n\n```javascript\n\
  \ set publisher(p) {\n      var publisher_id = \"\";\n      // p can be an ID reference\
  \ or an object reference\n      publisher_id = (typeof p !==  \"object\") ? p :\
  \ p.name;\n      …\n      this._publisher = Publisher.instances[ publisher_id];\n\
  \      …\n}\n```\n\n注意，发布者的名称被用作 ID 引用，因为它是 `Publisher` 类的标准 ID。\n\n### 2.3 构建 JS\
  \ 类模型\n\n构建 JS 类模型的起点是一个如图 1.10 所示的 OO（对象）类模型。\n\n我们现在展示如何通过四个步骤从该 OO 类模型推导出 JS\
  \ 类模型。对于 OO 类模型中的每个类：\n\n1.  为所有（非派生的）单值属性添加 «get/set» 刻型（stereotype），意味着它们具有隐式的访问器和设置器。记住，在设置器中，会调用相应的检查操作，并且只有当检查没有检测到任何约束违反时，属性才会被设置。\n\
  \n2.  为每个（非派生的）属性创建一个 `check` 操作，以便在集中实现`属性约束`（property constraints）。对于标准的 ID 属性（例如\
  \ `Book::isbn`），需要两个或三个检查操作：\n\n    1.  一个基础检查操作，如 `checkIsbn`，用于检查所有的语法约束，但不检查`必填值`（mandatory\
  \ value）和`唯一性`（uniqueness）约束。\n\n    2.  一个标准的 ID 检查操作，如 `checkIsbnAsId`，用于检查标准\
  \ ID 属性隐含的`必填值`和`唯一性`约束。\n\n    3.  如果其他类具有引用所考虑类的引用属性，则添加一个 `ID reference` 检查操作，用于检查施加在\
  \ `ID reference`（或外键）属性上的引用引用完整性（referential integrity）约束。例如，由于 `Book::publisher`\
  \ 属性引用 `Publisher` 对象，我们需要在 `Publisher` 类中一个 `checkNameAsIdRef` 操作。\n\n    对于引用属性（如\
  \ `Book::publisher`），检查操作 `Book.checkPublisher` 必须通过调用 `Publisher.checkNameAsIdRef`\
  \ 来检查隐含的`引用完整性约束`，如果属性是强制的，可能还需要检查`必填值约束`。\n\n3.  添加一个对象序列化函数 `toString()`，用于在错误消息和日志中显示对象的状态。\n\
  \n4.  添加一个对象到存储的转换函数 `toRecord()`，将模型对象准备好以实体表中的行的形式存储，该行可以通过 `JSON.stringify` 序列化为\
  \ JSON 字符串，从而存储为应用 `localStorage` 数据存储中键的值。\n\n这得出了 `Book` 的以下 JS 类模型，其中类级（“静态”）方法用下划线表示：\n\
  \n\n我们必须对 `Publisher` 类执行类似的转换。这为我们提供了从上述 OO 类模型推出的完整 JS 类模型，如图 2.1 所示。\n\n\n图 2.1：定义\
  \ `Book` 和 `Publisher` 类的 JS 类模型。\n\n### 2.4 新问题\n\n与第一卷中讨论的验证和枚举应用相比，我们必须处理许多新的技术问题：\n\
  \n1.  在*模型*代码中，我们现在需要处理`引用属性`，这些属性需要：\n\n    1.  维护`引用完整性`；\n\n    2.  选择并实现第 1.2\
  \ 中讨论的两种可能的删除策略之一，用于在属性的范围类的 `destroy` 方法中管理相应的对象销毁依赖关系；\n\n    3.  在序列化函数 `toString()`\
  \ 和转换函数 `toRecord()` 以及构造器函数中，进行内部对象引用和外部 ID 引用之间的转换。\n\n2.  在*用户界面（“视图”）*代码中，我们现在需要处理：\n\
  \n    1.  在*检索/列出*（Retrieve/List）用例显示关联对象的信息；\n\n    2.  允许从所有现有实例的列表中选择一个对象，并在*创建*和*更新*用例中从关联对象列表中添加或从中移除一个对象。\n\
  \n### 2.5 编写 JS 类\n\nJS 类模型可以直接为应用编写。\n\n#### 2.5.1 总结\n\n将每个类编写为具有隐式访问器和设置器的 ES015\
  \ 类：\n\n1.  编写类级（“静态”）方法。对于每个单值属性，编写指定的设置器，并在其中调用属性检查。\n\n2.  编写序列化函数 `toString()`\
  \ 和转换函数 `toRecord()`。\n\n3.  在 `destroy` 方法中处理删除依赖。这些步骤将在后续章节](#9783110500240_000634.xhtml_b_9783110500325-002_s_005)中详细讨论。\n\
  \n#### 2.5.2 编写每个模型类\n\nJS 模型中的每个类 `C` 编写为具有相同名称 `C` 具有单个记录参数的构造函数，该参数指定类的每个（非派生）属性。这些属性的范围应在注释中说明。对于引用属性，范围是另一个模型类。\n\
  \n在构造函数体内，我们将记录参数的字段赋值给相应的属性。这些属性赋值会调用相应的*设置器*方法。\n\n例如，`Publisher` 类以以下方式编写：\n\n\
  ```javascript\n class Publisher {\n     constructor ({name, address}) {\n      \
  \   this.name = name;\n         this.address = address;\n     }\n     …\n};\n```\n\
  \n由于设置器可能会抛出约束违反异常，构造函数以及任何设置器都应该在 `try-catch` 块中调用，其中 `catch` 负责记录合适的错误消息。\n\n\
  对于每个模型类 `C`，我们定义一个类级属性 `C.instances`，表示由应用管理的所有 `C` 实例集合（记录的映射）。该属性初始化为 `{}`。例如，在模型类\
  \ `Publisher` 的情况下，我们定义：\n\n```javascript\n Publisher.instances = {};\n```\n\n模型中的\
  \ `Book` 类以类似的方式编写：\n\n```javascript\n class Book {\n     constructor ({isbn, title,\
  \ year, authors, authorIdRefs,\n           publisher, publisher_id}) {\n       this.isbn\
  \ = isbn;\n       this.title = title;\n       this.year = year;\n       this.authors\
  \ = authors || authorIdRefs;\n       if (publisher || publisher_id) {\n        \
  \   this.publisher = publisher || publisher_id;\n       }\n    }\n    …\n}\n```\n\
  \n注意，`Book` 构造器既可以使用对象引用 `authors` 和 `publisher` 调用，也可以使用 ID 引用 `authorIdRefs` 和\
  \ `publisher_id` 调用。这种方法使得使用 `Book` 构造器更加灵活且健壮。\n\n\n\n\n\n### 2.5.3 编写属性检查代码\n\n\
  确保 JS 类模型中指定的所有属性约束都正确地编码在它的检查函数中，正如第 1 第 8 章所解释的。记住，约束违反（或验证错误）类定义在 `lib/errorTypes.js`\
  \ 文件中。\n\n例如，对于 `Publisher.checkName` 函数，我们得到以下代码：\n\n```js\n class Publisher {\n\
  \     …\n     static checkName(n) {\n         if (n === undefined) {\n         \
  \    return new NoConstraintViolation(); // not mandatory\n         } else {\n \
  \            if (typeof n !== \"string\" || n.trim() === \"\") {\n             \
  \     return new RangeConstraintViolation (\n            \"The name must be a non-empty\
  \ string!\" );\n            } else {\n                 return new NoConstraintViolation();\n\
  \           }\n        }\n    }\n    static checkNameAsId(n) {…}\n    …\n}\n```\n\
  \n注意，由于名称属性是 `Publisher` 的标准 ID 属性，我们只在 `checkName` 中检查语法约束，并在 `checkNameAsId` 中检查必填值和唯一性约束，后者会调用\
  \ `checkName`：\n\n```js\n static checkNameAsId ( n) {\n     var validationResult\
  \ = Publisher.checkName(n);\n     if ((validationResult instanceof NoConstraintViolation))\
  \ {\n         if (n === undefined) {\n             return new MandatoryValueConstraintViolation\
  \ (\n                 \"A publisher name is required!\");\n          } else if (Publisher.instances[n])\
  \ {\n             validationResult = new UniquenessConstraintViolation (\n     \
  \            \"There is already a publisher record with this name!\");\n       \
  \   } else {\n             validationResult = new NoConstraintViolation();\n   \
  \       }\n      }\n}\n```\n\n如果我们需要在其他类中处理 ID 引用（外键），我们需要提供另一个进一步的检查函数 `checkNameAsIdRef`，用于检查引用完整性约束：\n\
  \n```js\n static checkNameAsIdRef(n) {\n    var validationResult = Publisher.checkName(n);\n\
  \    if ((validationResult instanceof NoConstraintViolation) &&\n             n\
  \ !== undefined) {\n        if (!Publisher.instances [n]) {\n             validationResult\
  \ = new ReferentialIntegrityConstraintViolation (\n                \"There is no\
  \ publisher record with this name!\");\n         }\n     }\n     return validationResult;\n\
  }\n```\n\n条件 `!Publisher.instances[n]` 检查是否存在具有给定名称 `n` 的出版社对象，然后创建一个作为异常类 `ReferentialIntegrityConstraintViolation`\
  \ 实例的 `validationResult` 对象`Book.checkNameAsIdRef` 函数由 `Book.checkPublisher` 函数调用：\n\
  \n```js\n class Book {\n     …\n     static checkPublisher( publisher_id) {\n  \
  \        var validationResult = null;\n          if (publisher_id === undefined\
  \ || publisher_id === \"\") {\n               validationResult = new NoConstraintViolation();\
  \ // optional\n          } else {\n               // 调用外键约束检查\n               validationResult\
  \ = Publisher.checkNameAsIdRef( publisher_id);\n         }\n         return validationResult;\n\
  \     }\n     …\n}\n```\n\n### 2.5.4 编写属性 Setter（设置器）\n\n在 setter 中，会调用相应的检查函数，只有当检查没有检测到任何约束违反时才会设置属性。对于引用属性，我们允许使用对象引用或\
  \ ID 引用来调用 setter。产生的歧义通过测试调用 setter 时提供的参数是否为对象来解决。例如，出版社的 setter 是如下方式编码的：\n\n\
  ```js\n class Book {\n      …\n      set publisher( p) {\n          if (!p) { //\
  \ 取消出版社\n               delete this._publisher;\n          } else {\n          \
  \     // p 可以是 ID 引用或对象引用\n               const publisher_id = (typeof p !== \"\
  object\") ? p : p.name;\n               const validationResult = Book.checkPublisher(\
  \ publisher_id);\n               if (validationResult instanceof NoConstraintViolation)\
  \ {\n                   // 创建新的出版社引用\n                  this._publisher = Publisher.instances[\
  \ publisher_id];\n              } else {\n                 throw validationResult;\n\
  \             }\n        }\n     }\n     …\n}\n```\n\n### 2.5.5 选择并实现删除策略\n\n对于任何引用属性，我们必须在\
  \ 第 1.2 节 的两种可能的删除策略中选择并实现一种，以便在属性范围类的 `destroy` 方法中管理相应的对象销毁依赖。在我们的案例，当删除出版社记录时，我们必须在两者之间选择：\n\
  \n1. 删除由删除出版社出版的所有书籍记录（*生存依赖* Existential Dependency）；\n2. 从由删除出版社出版的所有书籍中删除对该删除出版社的引用（*生存独立*\
  \ Existential Independence）。\n\n假设书籍并不依赖于其出版社，我们选择第二种方案。这在以下 `Publisher.destroy`\
  \ 方法的代码中显示，对于所有相关的书籍对象，清除了属性 `book.publisher`：\n\n```js\n Publisher.destroy = function\
  \ (name) {\n      const publisher = Publisher.instances[name];\n      // 在书籍对象中删除对该出版社的所有引用\n\
  \      for (let key of Object.keys( Book.instances)) {\n           const book =\
  \ Book.instances[key];\n          if (book.publisher === publisher) {\n        \
  \  delete book._publisher;  // 删除槽\n          console.log(\"Book \" + book.isbn\
  \ + \" updated.\");\n       }\n      }\n      // 删除出版社记录\n      delete Publisher.instances[name];\n\
  \      console.log(\"Publisher \" + name + \" deleted.\");\n};\n```\n\n注意，删除指向删除出版社的所有引用是通过遍历所有书籍对象完成的，当书籍很多时这种效率可能不高。如果每个出版社对象持有其出版书籍的引用列表，效率将会高得多。创建和维护这样的列表将书籍与出版社之间的关联变为*双向*。\n\
  \n### 2.5.6 序列化与对象存储映射\n\n对于引用属性（例如 `Book::publisher`），序列化函数 `Book::toString()`\
  \ 必须显示被引用对象的可读标识符，例如 `this.publisher.name`：\n\n```js\n toString() {\n    var bookStr\
  \ = `Book{ ISBN: ${this.isbn}, title: ${this.title},` +\n         `year: ${this.year}`;\n\
  \     if (this.publisher) bookStr += `, publisher: ${this.publisher.name}`;\n  \
  \   return bookStr + \"}\";\n}\n```\n\n对象到存储的转换函数 `Book::toRecord()` 将带有对象引用的类型\
  \ JS 对象转换为带有 ID 引用的相应的（无类型）记录对象：\n\n```js\n toRecord() {\n      var rec = {};\n\
  \      for (let p of Object.keys( this)) {\n          // 只拷贝带下划线前缀的属性槽\n       \
  \   if (p.charAt(0) === \"_\") {\n              switch (p) {\n              case\
  \ \"_publisher\":\n               // 将对象引用转换为 ID 引用\n                  if (this._publisher)\
  \ rec.publisher_id = this._publisher.name;\n                  break;\n         \
  \     default:\n                 // 下划线前缀\n                 rec[p.substr(1)] = this[p];\n\
  \             }\n         }\n     };\n     return rec;\n}\n```\n\n从带有 ID 引用的无类型记录对象到带有对象引用的相应对象的反转换由\
  \ `Book` 构造函数完成，该构造函数允许在设置引用属性时同时接受 ID 引用和对象引用。\n\n### 2.6 编写视图与控制器\n\n\n\n\n\n\
  用户界面（UI）包含一个起始页 `index.html`，它允许导航到数据管理 UI 页面，每个对象类型对应一个页面（在我们的示例中为 `books.html`\
  \ 和 `publishers.html`）。每个数据管理 UI 页面都包含 5 个部分：一个 `Manage` 部分（如 `Manage books`），带有一个用于选择\
  \ CRUD 用例的菜单；以及每个 CRUD 用例的对应部分（如 `Retrieve/list all books`、`Create book`、`Update\
  \ book` 和 `Delete book`），使得每次只显示其中一个（例如，通过为其他部分设置 CSS 属性 `display:none`）。\n\n####\
  \ 2.6.1 初始化应用\n\n为了初始化数据管理用例，必须从持久化存储中加载所需的数据（例如，所有的出版者和书籍记录）。这在 `c/books.js` 中的控制器程序（例如\
  \ `pl.c.books.manage.initialize`）中执行，代码如下代码所示：\n\n```\n pl.c.books.manage = {\n\
  \     initialize: function () {\n          Publisher.retrieveAll();\n          Book.retrieveAll();\n\
  \          pl.v.books.manage.setUpUserInterface ();\n     }\n};\n```\n\n管理书籍数据的\
  \ `initialize` 方法首先加载出版者表和书籍表，因为书籍数据管理 UI 需要显示它们的数据。然后通过调用 `setUpUserInterface`\
  \ 程序渲染书籍数据菜单。\n\n#### 2.6.2 在检索/列出所有中显示关联对象\n\n在示例中，我们只有一个引用属性 `Book::publisher`，它是功能性且可选的。为了在\
  \ `Retrieve/list all` 用例中显示书籍可选出版者的信息，如果存在出版者，HTML 表格中相应的单元格将填充出版者的名称：\n\n```\n\
  \ pl.v.books.retrieveAndListAll = {\n      setupUserInterface: function () {\n \
  \          const tableBodyEl = document.querySelector(\n                       \
  \       \"section#Book-R>table>tbody\");\n           tableBodyEl.innerHTML = \"\"\
  ; // 删除旧内容\n           for (let key of Object.keys( Book.instances)) {\n       \
  \        const book = Book.instances[key];\n               const row = tableBodyEl.insertRow(-1);\n\
  \               row.insertCell(-1).textContent = book.isbn;\n               row.insertCell(-1).textContent\
  \ = book.title;\n               row.insertCell(-1).textContent = book.year;\n  \
  \             // 如果书籍有出版者，则显示其名称\n               row.insertCell(-1).textContent\
  \ =\n                   book.publisher ? book.publisher.name : \"\";\n         \
  \  }\n           document.getElementById(\"Book-M\").style.display = \"none\";\n\
  \           document.getElementById(\"Book-R\").style.display = \"block\";\n   \
  \  }\n};\n```\n\n对于多值引用属性，表格单元格必须填充由该属性引用的所有关联对象的列表。\n\n#### 2.6.3 在创建和更新用例中选择关联对象\n\
  \n为了允许在 `Create` 和 `Update` 用例中选择与当前编辑对象关联的对象，可以使用一个 HTML 选择列表（即 `select` 元素），该列表通过工具方法\
  \ `fillSelectWithOptions` 填充由关联对象类型实例构成的 `option` 元素。HTML select 元素在 `books.html`\
  \ 视图文件中定义：\n\n```\n <section id=\"Book-C\" class=\"UI-Page\">\n    <h1>公共图书馆：创建新的书籍记录</h1>\n\
  \    <form>\n       …\n       <div class=\"select-one\">\n          <label>Publisher:\
  \ <select name=\"selectPublisher\"></select></label>\n       </</div>\n       …\n\
  \    </form>\n</section>\n```\n\n`Create` 用户界面通过以下程序进行设置：\n\n```\n pl.v.books.create\
  \ = {\n      setupUserInterface: function () {\n          const formEl = document.querySelector\
  \ (\"section#Book-C > form\"),\n                selectPublisherEl = formEl.selectPublisher,\n\
  \                saveButton = formEl.commit;\n          // 添加响应式校验的监听器\n       \
  \   formEl.isbn.addEventListener (\"input\", function () {\n            formEl.isbn.setCustomValidity(\n\
  \                   Book.checkIsbnAsId ( formEl.isbn.value).message);\n        \
  \  });\n         // 设置单选列表来选择出版者\n         util.fillSelectWithOptions ( selectPublisherEl,\n\
  \                Publisher.instances, \"name\");\n          // 为 submitButton 点击事件定义事件处理器\
  \    \n          saveButton.addEventListener (\"click\",\n          this.handleSaveButtonClickEvent);\n\
  \          // 定义取消提交事件的事件处理器\n          formEl.addEventListener (\"submit\", function\
  \ (e) {\n               e.preventDefault ( );\n               formEl.reset ();\n\
  \          });\n          // 将管理表单替换为创建表单\n          document.getElementById (\"\
  Book-M\").style.display = \"none\";\n          document.getElementById (\"Book-C\"\
  ).style.display = \"block\";\n          formEl.reset();\n     },\n     handleSaveButtonClickEvent:\
  \ function () {\n         …\n     }\n};\n```\n\n当用户点击（或触摸）保存按钮时，所有的表单控件值（包括选择控件的值）都会复制到一个列表中。在对所有表单字段进行校验后，该列表将作为调用\
  \ `add` 方法的参数，如下程序列表所示：\n\n```\n handleSaveButtonClickEvent: function () {\n   \
  \    const formEl = document.querySelector(\"section#Book-C > form\");\n       const\
  \ slots = {\n             isbn: formEl.isbn.value,\n             title: formEl.title.value,\n\
  \             year: formEl.year.value,\n             publisher_id: formEl.selectPublisher.value\n\
  \       };\n       // 校验所有表单控件并显示错误消息\n       formEl.isbn.setCustomValidity(\n \
  \      Book.checkIsbnAsId( slots.isbn).message);\n       /* …（对 title 和 year 执行相同操作）\
  \ */\n       // 仅当所有表单字段有效时才保存输入数据\n        if (formEl.checkValidity()) {\n    \
  \         Book.add ( slots);\n        }\n}\n```\n\n`update book` 用例的 `setupUserInterface`\
  \ 代码类似。\n\n### 2.7 练习题\n\n#### 2.7.1 问题 1：JS 类模型\n\n从给定的 OO 类模型派生的 `Committee` 类，正确的\
  \ JS 类模型是哪个？\n\n![](img/b_9783110500325-002_ingr_002.png)\n\n选择一项：\n\n1. O ![](img/b_9783110500325-002_ingr_003.png)\n\
  \n1. O ![](img/b_9783110500325-002_ingr_004.png)\n\n1. O ![](img/b_9783110500325-002_ingr_005.png)\n\
  \n## 3 使用纯 JS 实现单向非功能关联\n\n单向非功能关联可以是*一对多*或*多对多*的。在这两种情况下，这种关联都是通过*多值*引用属性的帮助来表示（或实现的）。\n\
  \n在本章中，我们将展示：\n\n1.  如何从具有代表*单向非功能关联*的*多值引用属性*的 OO 类模型派生出 JS 类模型，\n\n2.  如何以 JavaScript\
  \ 模型类的形式为该 JS 类模型编写代码，\n\n3.  如何基于模型代码编写视图和控制器代码。\n\n### 3.1 实现多值引用属性\n\n多值引用属性（例如\
  \ `Book::authors` 属性）允许存储某些类型对象（如 `Author` 对象）的引用集合。在创建 `Book` 类型的新对象时，构造函数需要有相应的参数来为该属性提供合适的值。我们可以允许该值是内部对象引用集合或\
  \ ID 引用集合，如下例所示：\n\n```\n class Book {\n    constructor ({isbn, title, year, authors,\
  \ authorIdRefs,\n              publisher, publisher_id}) {\n            this.isbn\
  \ = isbn;\n            this.title = title;\n            this.year = year;\n    \
  \        // 分配对象引用或 ID 引用\n            this.authors = authors || authorIdRefs;\n\
  \            if (publisher || publisher_id) this.publisher = publisher || publisher_id;\n\
  \     }\n    …\n}\n```\n\n\n\n\n\n注意，构造函数的参数记录预计将包含 `authors` 或 `authorIdRefs` 槽。JavaScript\
  \ 表达式 `authors || authorIdRefs` 使用逻辑或运算符 `||`，如果存在名为 `authors` 的槽，则评估为映射 `authors`，否则评估为数组\
  \ `authorIdRefs`。我们在属性设置器（property setter）中通过检查参数的类型来处理产生的歧义，如下所示代码片段所示：\n\n```\n\
  \ set authors ( a) {\n    this._authors = {};\n    if (Array.isArray(a)) { // array\
  \ of IdRefs\n        for (let idRef of a) {\n           this.addAuthor( idRef);\n\
  \        }\n    } else { // map of IdRefs to object references\n       for (let\
  \ idRef of Object.keys( a)) {\n           this.addAuthor( a[idRef]);\n        }\n\
  \    }\n }\n```\n\n在 JS 中，集合值引用属性（collection-valued reference property）可以通过两种方式实现：\n\
  \n1. 拥有一个对象引用数组列表（JS 数组）作为其值；\n2. 拥有一个映射作为其值，其中对象的标准 ID 属性的值作为键，并映射到内部 JS 对象引用。\n\
  \n我们倾向于使用映射来实现实现 `set-valued` 引用属性，因为它们能保证每个元素都是唯一的，而在数组中，我们必须防止重复元素。此外，映射中的元素可以很容易地删除（借助\
  \ `delete` 运算符），而在数组的情况下这需要更多努力。然而，对于实现对应于 `ordered-collection`-值（或包/序列值）引用属性的 `ordered`（或\
  \ `nonunique`）关联端，我们使用 JS 数组。\n\n### 3.2 构建 JS 类模型\n\n我们构建 JS 类模型的起点是以下面向对象类模型：\n\
  \n![](img/b_9783110500325-003_ingr_001.png)\n\n该模型除了包含单值引用属性 `Book::publisher`（表示单向多对一关联\
  \ `Book`-`has`-`Publisher`）外，还包含多值引用属性 `Book::authors`（表示单向多对多关联 `Book`-`has`-`Author`）。\n\
  \n要从 OO 类模型推导出 JS 类模型，我们必须遵循与 2.3 节相同的步骤，并且我们还必须处理多值引用属性，例如 `Book::authors`，对于这些属性我们需要：\n\
  \n1. 创建一个类级别的 `check` 操作，例如 `checkAuthor`，负责检查要添加到属性集合的引用的相应 `引用完整性约束` (referential\
  \ integrity constraint)；\n2. 创建一个 `add` 操作，例如 `addAuthor`，用于向集合添加引用；\n3. 创建一个 `remove`\
  \ 操作，例如 `removeAuthor`，用于从集合中移除引用。\n\n这得到了如下 JS 类模型：\n\n![](img/b_9783110500325-003_ingr_002.png)\n\
  \n### 3.3 新问题\n\n与上一章讨论的处理函数关联相比，我们现在必须处理以下新技术问题：\n\n1. 在 `model` 代码中，我们现在必须处理 `多值引用属性`，这需要实现：\n\
  \    1. 一个 `add` 和 `remove` 方法，例如 `addAuthor` 和 `removeAuthor`，以及一个用于通过 `add` 方法分配一组对象引用的\
  \ `setter` 方法，可能需要将 ID 引用转换为对象引用；如果存在基数约束（cardinality constraints），这三个方法可能都需要检查；\n\
  \    2. 一个类级别的 `check` 操作，例如 `checkAuthor`，它必须调用属性范围类相应的 `check …AsIdRef` 方法来检查属性的隐式\
  \ `引用完整性约束`；\n    3. 在对象到存储的转换函数 `toRecord` 中，将对象引用集合转换为 ID 引用集合。\n\n2. 在 `用户界面（“视图”））`\
  \ 代码中，我们现在必须处理：\n    1. 在 `Retrieve/list all` 用例的表格视图的属性列中，显示一组关联对象的信息；最简单的方法是显示逗号分隔的\
  \ ID 引用列表，可能结合相应的名称；或者，可以在属性的表格数据单元格中渲染 HTML 列表；\n    2. 在 `Create` 和 `Update` 用例中，允许从属性范围类所有现有实例的列表中选择一组关联对象。\n\
  \n最后一个问题，即从某些类的所有实例列表中选择一组关联对象，通常无法通过 HTML 多选表单控件来解决，因为其易用性较差。每当可选选项集大于某个阈值（由无需滚动即可在屏幕上看到的选项定义）时，多选元素就不再可用，必须使用替代的\
  \ `多选组件`(multiple-choice widget)。\n\n### 3.4 为模型编码\n\n注意，为了简单起见，我们没有在示例应用代码中包含 JS\
  \ 类模型中显示的所有约束检查代码。\n\n#### 3.4.1 总结\n\n将 JS 类模型中的每个类编码为具有隐式 getter 和设置器（setter）的\
  \ ES2015 类：\n\n1. 以类级别（`static`）方法的形式编写属性检查。确保 JS 类模型中指定的所有属性约束都已正确编码。\n2. 对于每个单值属性，编写指定的\
  \ getter 和 setter，使得在每个 setter 中调用相应的属性检查，并且只有当检查没有检测到任何违规时，才设置/取消属性。\n3. 对于每个多值属性，编写其添加和移除操作，以及指定的\
  \ get/set 操作：\n    1. 将 add/remove 操作编写为（实例级别的）方法，这些方法调用属性检查。\n    2. 编写 setter，使其对要分配的集合中的每个项调用\
  \ add 操作。\n4. 编写序列化函数 `toString()` 和对象到存储的转换函数 `toRecord()` 的代码。\n5. 在 `destroy`\
  \ 方法中处理删除依赖关系。\n\n这些步骤将在后续章节中详细讨论。\n\n#### 3.4.2 编写添加和移除操作\n\n对于多值引用属性 `Book::authors`，我们需要编写操作\
  \ `addAuthor` 和 `removeAuthor`。这两个操作都接受一个参数，通过 ID 引用（整数或字符串类型的作者 ID）或对象引用表示作者。`addAuthor`\
  \ 的代码如下：\n\n```\n addAuthor ( a) {\n    // a 可以是一个 ID 引用或一个对象引用\n   const author_id\
  \ = (typeof a !== \"object\") ? parseInt( a) : a.authorId;\n   const validationResult\
  \ = Book.checkAuthor ( author_id);\n   if (author_id && validationResult instanceof\
  \ NoConstraintViolation) {\n      // 添加新的作者引用\n     let key = String( author_id);\n\
  \     this._authors[key] = Author.instances[key];\n    } else {\n       throw validationResult;\n\
  \    }\n}\n```\n\n在 `removeAuthor` 方法中，首先检查作者引用，如果没有检测到约束违规，则删除映射 `this._authors`\
  \ 中的相应条目：\n\n```\n removeAuthor ( a) {\n   // a 可以是一个 ID 引用或一个对象引用\n   const author_id\
  \ = (typeof a !== \"object\") ?\n           parseInt( a) : a.authorId;\n   const\
  \ validationResult = Book.checkAuthor ( author_id);\n   if (validationResult instanceof\
  \ NoConstraintViolation) {\n         // 删除作者引用\n        delete this._authors [author_id];\n\
  \   } else {\n      throw validationResult;\n   }\n}\n```\n\n对于向属性 `Book::authors`\
  \ 分配 ID 引用数组或对象引用映射，`setAuthors` 方法将帮助通过 `addAuthor` 逐个添加它们。\n\n\n\n\n\n```javascript\n\
  \ set authors ( a) {\n    this._authors = {};\n    if (Array.isArray(a)) { // array\
  \ of IdRefs\n       for (let idRef of a) {\n           this.addAuthor( idRef);\n\
  \      }\n  } else { // map of IdRefs to object references\n     for (let idRef\
  \ of Object.keys( a)) {\n          this.addAuthor( a[idRef]);\n    }\n  }\n}\n```\n\
  \n### 3.4.3 选择并实现删除策略\n\n对于引用属性 `Book::authors`，我们必须在 `Author` 类的 `destroy` 方法中选择并实现删除策略。我们必须在两者之间进行选择：\n\
  \n1. 删除所有由被删除作者（合）的书（反映了*存在依赖*/Existential Dependency 的逻辑）；\n\n2. 从所有由被删除作者（合）的书中删除对该删除作者的引用（反映了*存在独立性*/Existential\
  \ Independence 的逻辑）。\n\n为了简单起见，我们选择了第二种方案。在下面的静态方法 `Author.destroy` 代码中，对于所有相关的书籍对象，作者引用\
  \ `book.authors[authorKey]` 都被删除了：\n\n```javascript\n Author.destroy = function\
  \ (authorId) {\n    const author = Author.instances [authorId];\n    // 删除所有相关的书籍记录\n\
  \   for (let isbn of Object.keys( Book.instances)) {\n       let book = Book.instances\
  \ [isbn];\n       if (book.authors[authorId]) delete book.authors[authorId];\n \
  \  }\n   // 删除作者对象\n  delete Author.instances [authorId];\n  console.log(\"Author\
  \ \" + author.name + \" deleted.\");\n};\n```\n\n### 3.4.4 序列化与对象到存储的映射\n\n我们需要一个序列化函数\
  \ `toString()` 将对象转换为人类可读的字符串表示，用于在用户界面中显示对象；以及一个对象到记录的映射函数 `toRecord()`，将类型对象转换为可以保存到持久化数据存储中的记录。在这两种情况下，内部对象引用都被转换为\
  \ ID 引用。\n\n`Book::toString()` 函数创建一个可能只包含相关属性的字符串表示。显示一组关联对象（如书籍的作者）最简单的方法是创建一个逗号分隔的\
  \ ID 列表：\n\n```javascript\n toString() {\n    var bookStr = `Book{ ISBN: ${this.isbn},\
  \ title: ${this.title},` +\n           `year: ${this.year}`;\n    if (this.publisher)\
  \ bookStr += `, publisher: ${this.publisher.name}`;\n    return bookStr +\", authors:\"\
  \ +\n         Object.keys( this.authors).join(\",\") +\"}\";\n}\n```\n\n`Book::toRecord()`\
  \ 函数需要对对象的所有属性槽进行序列化。这包括删除下划线前缀以获取对应的记录字段名：\n\n```javascript\n toRecord () {\n \
  \ var rec = {};\n  for (let p of Object.keys( this)) {\n     // 仅拷贝带有下划线前缀的属性槽\n\
  \    if (p.charAt(0) !== \"_\") continue;\n    switch (p) {\n    case \"_publisher\"\
  :\n        // 将对象引用转换为 ID 引用\n        if (this._publisher) rec.publisher_id = this._publisher.name;\n\
  \        break;\n    case \"_authors\":\n        // 将对象引用映射转换为 ID 引用列表\n       \
  \ rec.authorIdRefs = [];\n      Object.keys( this.authors).forEach( authorIdStr\
  \ => {\n        rec.authorIdRefs.push( parseInt( authorIdStr));\n      });\n   \
  \   break;\n   default:\n      // 移除下划线前缀\n      rec[p.substr(1)] = this[p];\n \
  \   }\n    }\n    return rec;\n}\n```\n\n### 3.5 编写视图\n\n#### 3.5.1 在检索/列出所有中显示关联对象信息\n\
  \n在“检索/列出所有”（Retrieve/List All）用例中显示书籍作者的信息时，通过工具函数 `util.createListFromMap` 在 HTML\
  \ 表格的相应单元格中填充所有作者名称的列表：\n\n```javascript\n pl.v.books.retrieveAndListAll = {\n \
  \ setupUserInterface: function () {\n    const tableBodyEl = document.querySelector(\n\
  \                   \"section#Book-R>table>tbody\");\n    tableBodyEl.innerHTML\
  \ = \"\"; // 丢旧内容\n    for (let key of Object.keys( Book.instances)) {\n      const\
  \ book = Book.instances[key];\n      // 为此书籍创建作者列表\n      const listEl = util.createListFromMap\
  \ ( book.authors, \"name\");\n      const row = tableBodyEl.insertRow(-1);\n   \
  \   row.insertCell (-1).textContent = book.isbn;\n      row.insertCell (-1).textContent\
  \ = book.title;\n      row.insertCell (-1).textContent = book.year;\n      row.insertCell\
  \ (-1).appendChild( listEl);\n      // 如果书籍有出版社，显示其名称\n      row.insertCell (-1).textContent\
  \ =\n        book.publisher ? book.publisher.name : \"\";\n    }\n    document.getElementById(\"\
  Book-M\").style.display = \"none\";\n    document.getElementById(\"Book-R\").style.display\
  \ = \"block\";\n  }\n};\n```\n\n工具函数 `util.createListFromMap` 具有以下代码：\n\n```javascript\n\
  \ createListFromMap: function (m, displayProp) {\n  var listEl = document.createElement(\"\
  ul\");\n  util.fillListFromMap(listEl, m);\n  return listEl;\n},\nfillListFromMap:\
  \ function (listEl, m, displayProp) {\n    const keys = Object.keys( m);\n    //\
  \ 删除旧内容\n    listEl.innerHTML = \"\";\n    // 从对象值创建列表项\n    for (let key of keys)\
  \ {\n      let listItemEl = document.createElement(\"li\");\n      listItemEl.textContent\
  \ = m[key][displayProp];\n      listEl.appendChild( listItemEl);\n    }\n}\n```\n\
  \n#### 3.5.2 在创建用例中选择关联对象\n\n为了在“创建”（Create）用例中允许选择多个作者与当前编辑的书籍关联，如 HTML 代码所示，一个多选列表（带有\
  \ `multiple=\"multiple\"` 的 `select` 元素）将由关联对象类型的实例填充。\n\n```html\n <section id=\"\
  Book-C\" class=\"UI-Page\">\n<h1>公共图书馆：创建新书</h1>\n<form>\n …\n  <div class=\"select-one\"\
  >\n   <label>出版社: <select name=\"selectPublisher\"></select></label>\n  </div>\n\
  \  <div class=\"select-many\">\n   <label>作者:\n    <select name=\"selectAuthors\"\
  \ multiple=\"multiple\"></select>\n   </label>\n  </div>\n …\n </form>\n</section>\n\
  ```\n\n“创建” UI 的设置通过工具方法 `fillSelectWithOptions` 填充作者和出版社的选择列表来实现的，如下面的程序列表所示：\n\
  \n```javascript\n pl.v.books.create = {\n  setupUserInterface: function () {\n \
  \   const formEl = document.querySelector(\"section#Book-C > form\"),\n        selectAuthorsEl\
  \ = formEl.selectAuthors,\n        selectPublisherEl = formEl.selectPublisher,\n\
  \        saveButton = formEl.commit;\n     // 为响应式验证添加监听器\n     …\n     // 设置选择作者的多选列表\n\
  \    util.fillSelectWithOptions( selectAuthorsEl, Author.instances,\n       \"authorId\"\
  , {displayProp:\"name\"});\n    // 设置选择出版社的单选列表\n   util.fillSelectWithOptions(\
  \ selectPublisherEl,\n       Publisher.instances, \"name\");\n   …\n  },\n  handleSaveButtonClickEvent:\
  \ function () {…}\n};\n```\n\n当用户点击保存按钮时，所有的表单控件值（包括任何单选控件的值）都会被复制到相应槽记录的字段中，并在检查所有表单字段有效后作为调用\
  \ `add` 方法的参数。在调用 `add` 之前，我们必须首先从多选作者列表的选中选项中创建一个作者 ID 引用列表（在 `authorIdRefs` 槽中），如下面的程序列表所示：\n\
  \n\n\n\n\n```\n handleSaveButtonClickEvent: function () {\n  const formEl = document.querySelector(\"\
  section#Book-C > form\"),\n      selAuthOptions = formEl.selectAuthors.selectedOptions;\n\
  \  const slots = {\n      isbn: formEl.isbn.value,\n      title: formEl.title.value,\n\
  \      year: formEl.year.value,\n      authorIdRefs: [],\n      publisher_id: formEl.selectPublisher.value\n\
  \  };\n   // 验证所有表单控件并显示错误消息\n   …\n   // 检查作者的必值约束（mandatory value constraint）\n\
  \  formEl.selectAuthors.setCustomValidity(\n    (selAuthOptions.length > 0) ? \"\
  \" : \"No author selected!\"\n  );\n   // 仅当所有表单字段有效时保存输入数据\n  if (formEl.checkValidity())\
  \ {\n     // 构建作者 ID 引用列表\n    for (let opt of selAuthOptions) {\n      slots.authorIdRefs.push(\
  \ opt.value);\n    }\n    Book.add( slots);\n  }\n}\n```\n\n`Update` 用例在下一节 中讨论。\n\
  \n### 3.5.3 在 Update 用例中选择关联对象\n\n遗憾的是，在有数百或数千个作者的现实用例中，多选控件并不能真正用于显示和维护关联作者集合，因为其渲染选择的方式在视觉上太过于分散了。因此，我们必须使用一种特殊的“多选小部件”（`multiple-choice\
  \ widget`），它允许向关联对象列表添加（并从中移除）对象，正如第 `1.8\\.` 节所述。为了展示此小部件如何替换上一节中讨论的多重选择列表，我们现在在\
  \ `Update` 用例中使用它。\n\n为了在 `Update` 用例中允许维护与当前编辑书籍相关的作者集合，下方的 HTML 代码所示的 `multiple-choice\
  \ widget` 将使用 `Author` 类的实例进行填充。\n\n``````html\n <section id=\"Book-U\" class=\"\
  UI-Page\">\n  <h1>公共图书馆：更新书籍记录</h1>\n  <form>\n    …\n    <div class=\"select-one\"\
  >\n      <label>出版社：<select name=\"selectPublisher\"></select></label>\n    </div>\n\
  \    <div class=\"widget\">\n          <label for=\"updBookSelectAuthors\">作者：</label>\n\
  \          <div class=\"MultiSelectionWidget\" id=\"updBookSelectAuthors\"></div>\n\
  \      </div>\n     …\n    </form>\n</section>\n``` （注：此处为 HTML）\n\n`Update` 用户界面的设置（在下方所示的\
  \ `setupUserInterface` 过程中完成）是通过借助工具方法 `fillSelectWithOptions` 填充选择列表，以选择要更新的书籍来实现的。用于分配发布者的选择列表以及用于分配书籍作者的多选小部件，只有在选择了要更新的书籍后才会（在\
  \ `handleSubmitButtonClickEvent` 中）进行填充。\n\n```\n pl.v.books.update = {\n  setupUserInterface:\
  \ function () {\n    const formEl = document.querySelector(\"section#Book-U > form\"\
  ),\n        selectBookEl = formEl.selectBook,\n        saveButton = formEl.commit;\n\
  \ // 设置书籍选择列表\n    util.fillSelectWithOptions( selectBookEl, Book.instances,\n \
  \       \"isbn\", {displayProp:\"title\"});\n    selectBookEl.addEventListener(\"\
  change\", this.handleBookSelectChangeEvent);\n // 添加事件监听器用于响应式验证\n …\n // 为提交点击事件定义事件处理器\n\
  \    saveButton.addEventListener(\"click\", this.handleSaveButtonClickEvent);\n\
  \ // 处理中消提交事件并重置表单\n    formEl.addEventListener ( 'submit', function (e) {\n   \
  \   var authorsSelWidget = document.querySelector (\n              \"section#Book-U\
  \ > form .MultiSelectionWidget\");\n      e.preventDefault();\n      authorsSelWidget.innerHTML\
  \ = \"\";\n      formEl.reset();\n    });\n    document.getElementById (\"Book-M\"\
  ).style.display = \"none\";\n    document.getElementById (\"Book-U\").style.display\
  \ = \"block\";\n    formEl.reset();\n  },\n```\n\n当选择了要更新的书籍后，表单输入字段 `isbn`、`title`\
  \ 和 `year` 以及更新发布者的选择控件将从所选书籍中分配相应的值，并设置关联的作者选择控件：\n\n```\n handleBookSelectChangeEvent:\
  \ function () {\n  const formEl = document.querySelector(\"section#Book-U > form\"\
  ),\n      saveButton = formEl.commit,\n      selectAuthorsWidget = formEl.querySelector(\"\
  .MultiChoiceWidget\"),\n      selectPublisherEl = formEl.selectPublisher,\n    \
  \  isbn = formEl.selectBook.value;\n  if (isbn !== \"\") {\n    let book = Book.instances[isbn];\n\
  \    formEl.isbn.value = book.isbn;\n    formEl.title.value = book.title;\n    formEl.year.value\
  \ = book.year;\n     // 设置关联的作者选择控件\n    util.createMultipleChoiceWidget( selectAuthorsWidget,\
  \ book.authors,\n        Author.instances, \"authorId\", \"name\", 1); // minCard=1\n\
  \     // 设置关联的出版社选择列表\n    util.fillSelectWithOptions( selectPublisherEl, Publisher.instances,\n\
  \    // 为出版社分配选中的选项\n    if (book.publisher) formEl.selectPublisher = book.publisher;\n\
  \    // 启用保存按钮\n    saveButton.disabled = false;\n  } else {\n    formEl.reset();\n\
  \    selectPublisher.selectedIndex = 0;\n    selectAuthorsWidget.innerHTML = \"\"\
  ;\n    saveButton.disabled = true;\n  }\n},\n```\n\n当用户在更新某些值后最后点击保存按钮时，所有的表单控件值（包括分配出版社的单选控件）将被复制到\
  \ `slots` 记录中，该记录将在检查所有值后作为调用 `update` 方法的参数。在关联的作者选择控件中，将根据下面的程序列表创建 `authorIdRefsToAdd/ToRemove`\
  \ 列表：\n\n```\n handleSaveButtonClickEvent: function () {\n  const formEl = document.querySelector(\"\
  section#Book-U > form\"),\n      selectBookEl = formEl.selectBook,\n      saveButton\
  \ = formEl.commit; // 添加事件监听器用于响应式验证\n …\n // 仅当所有字段值有效时提交更新\n  if (formEl.checkValidity())\
  \ {\n    // 从关联列表构建 authorIdRefsToAdd/ToRemove 列表\n    let authorIdRefsToAdd=[],\
  \ authorIdRefsToRemove=[];\n    multiChoiceListEl = formEl.querySelector(\".MultiSelectionWidget\"\
  ).firstElementChild;\n    for (let mcListItemEl of multiChoiceListEl.children) {\n\
  \      if (mcListItemEl.classList.contains(\"removed\")) {\n        authorIdRefsToRemove.push(\
  \ mcListItemEl.getAttribute(\"data-value\"));\n      }\n      if (mcListItemEl.classList.contains(\"\
  added\")) {\n        authorIdRefsToAdd.push( mcListItemEl.getAttribute(\"data-value\"\
  ));\n      }\n    }\n    // 如果添加/删除列表不为空则创建对应的槽\n    if (authorIdRefsToRemove.length\
  \ > 0) {\n      slots.authorIdRefsToRemove = authorIdRefsToRemove;\n    }\n    if\
  \ (authorIdRefsToAdd.length > 0) {\n      slots.authorIdRefsToAdd = authorIdRefsToAdd;\n\
  \    }\n    Book.update( slots);\n    // 更新书籍选择列表的元素\n    selectBookEl.options[selectBookEl.selectedIndex].text\
  \ = slots.title;\n  }\n}\n```\n\n### 3.6 如何运行应用并获取代码\n\n### 3.7 注意事项\n\n\n\n\n\n\
  我们在模型层中仍然为每个类和每个属性包含了重复的代码结构（称为`样板代码`），用于约束验证（检查和设置器方法），并为每个类包含了数据存储管理方法（添加、更新和删除）。虽然在学习应用开发时编写几次这些代码是有益的，但在处理真实项目时，你并不希望一遍又一遍地编写它们。为了避免重复的样板代码，需要这些方法的通用形式，以便在应用程序的所有模型类中重用。例如，`cLASSjs`\
  \ 库就提供了这种方法。\n\n## 4 使用 Java EE 实现单向功能关联\n\n单向`functional`关联要么是一对一的或者是多对一的。在这两种情况下，这种关联都是通过一个`single-valued`引用属性来表示或实现的。\n\
  \n在本章中，我们将展示：\n\n1. 如何从具有表示`单向功能关联`的单值引用属性的 OO 类模型中，推导出形式为`Java 实体类模型`的`数据模型`模型`；\n\
  2. 如何以实体类（实现`模型类`）的形式为`Java 实体类模型`编写代码；\n3. 如何基于实体类编写视图和控制器代码。\n\n### 4.1 在 Java\
  \ 中实现单值引用属性\n\n单值引用属性（例如对象类型 `Book` 的属性 `publisher`）允许存储对另一种类型对象（如 `Publisher`）的内部引用。在创建新对象时，构造函数需要一个参数，以便允许为引用属性分配合适的值。在像\
  \ `Java` 这样的强类型编程语言中，我们可能需要决定此值是预期为内部对象引用还是 ID 引用。使用 JPA 对象存储映射技术，我们可以使用对象引用，并将到相应\
  \ ID 引用的映射留给 JPA。`Book` 类的扩展如下：\n\n```\n@Entity @Table( name=\"books\")\n@ViewScoped\
  \ @ManagedBean( name=\"book\")\npublic class Book {\n       …\n       private Publisher\
  \ publisher;\n\n      public Book() {}\n      public Book( String isbn, String title,\
  \ Integer year,\n            Publisher publisher) {…}\n      public Publisher getPublisher()\
  \ {…}\n\n      public void setPublisher( Publisher publisher) {…}\n …\n}\n```\n\n\
  ### 4.2 创建 Java 实体类模型\n\n创建`Java 实体类模型`的起点是如图 1.10 所示的 OO 类模型。\n\n如前所述，我们通过以下方式从相应的\
  \ OO 设计类获取`Java 实体类` `Publisher`：(1) 将所有属性设为私有；(2) 使用 Java 数据类型类（`String`、`Integer`\
  \ 等）；(3) 为属性添加«get/set»刻型（指定公共的 getter 和 setter）；(4) 添加 `toString` 函数；(5) 添加（类级）数据存储方法\
  \ `create`、`retrieve`、`update` 和 `delete`：\n\n![](img/b_9783110500325-004_ingr_001.png)\n\
  \n在`Java 实体类模型`中，对于 OO 类模型中的任何关联端点，我们都显示表示该关联端的引用属性，并用其表示的单向关联的功能类型对其进行注解。在我们的示例中，我们在实体类\
  \ `Book` 中添加了引用属性 `publisher`，并用关联的功能类型 `manyToOne` 对其进行了注解：\n\n![](img/b_9783110500325-004_ingr_002.png)\n\
  \n### 4.3 新问题\n\n与之前讨论的单类应用相比，我们必须处理许多新的技术问题：\n\n1. 在`model` 代码中，我们现在必须处理需要以下操作的`reference\
  \ properties`：\n    1. 借助合适的 JPA 注解定义`引用完整性约束约束`；\n    2. 通过考虑引用属性来扩展 `create`、`update`\
  \ 和 `delete` 方法的代码；\n    3. 一个在序列化和反序列化操作中转换（内部）对象引用和相应的（外部）ID 引用之间的方法。\n\n2. 在`user\
  \ interface`（视图）代码中，我们现在必须处理：\n    1. 在 `retrieve/list all` 用例中显示关联对象的信息；\n    2.\
  \ 在 `create object` 和 `update object` 用例中，允许从目标类的所有现有实例列表中选择关联对象。\n\n### 4.4 编写模型代码\n\
  \n可以直接为`Java 实体类模型`编写代码，以获取 Java 后端应用的模型层代码。\n\n#### 4.4.1 总结\n\n1. 从`Java 实体类模型`中为每个类编写对应的相应的实体类。\n\
  2. 使用 JPA 注解 `@Id` 编写 `{id}` 属性修饰符。\n3. 为任何表示引用属性功能类型的属性修饰符（例如 `{manyToOne}`）编写相应的\
  \ JPA 注解（例如 `@ManyToOne`）。\n4. 借助 Java Bean Validation 注解（或自定义验证注解）为模型中指定的完整性约束编写代码。\n\
  5. 编写 getters 和 setters。\n6. 将 `create`、`retrieve`、`update` 和 `delete` 存储管理操作编写为类方法。\n\
  \n这些步骤将在接下来的章节 中进行详细讨论。\n\n### 4.4.2 编写实体的每个类\n\nJava 实体模型中的每个类 `C` 都被编写为一个带注解的\
  \ Bean 类，包含一个无参数的构造函数和一个带有实体创建参数的构造函数。\n\n例如，来自实体类模型的 `Book` 类以以下方式编写：\n\n```\n\
  \ @Entity @Table( name=\"books\")\n@ViewScoped @ManagedBean( name=\"book\")\npublic\
  \ class Book {\n       @Id @NotNull( message=\"An ISBN is required!\")\n       private\
  \ String isbn;\n\n       @Column( nullable=false)\n       @NotNull( message=\"A\
  \ title is required!\")\n       private String title;\n       @Column( nullable=false)\n\
  \       @NotNull( message=\"A year is required!\")\n       private Integer year;\n\
  \       @ManyToOne( fetch=FetchType.EAGER)\n       private Publisher publisher;\n\
  \n       public Book() {}\n       public Book( String isbn, String title,\n    \
  \             Integer year, Publisher publisher) {\n          this.setIsbn( isbn);\n\
  \          this.setTitle( title);\n          this.setYear( year);\n          this.setPublisher(\
  \ publisher);\n      }\n     …  // getters, setters, etc.\n}```\n\n属性 `publisher`\
  \ 上的 `@ManyToOne` 注解用于指定由引用属性 `publisher` 表示的关联 `Book has Publisher`的功能类型，因为它持有*一个书有一个出版社*且*一个出版社有很多本书*的关系。该注解还允许通过参数\
  \ `fetch` 指定`fetch type`，该参数取以下可能值之一：\n\n* `FetchType.EAGER`，意味着检索实体包含了对由该属性引用的关联实体的检索。在我们的示例中，当检索一个\
  \ `Book` 实体时，由书出版社属性引用的 `Publisher` 实体也会被检索。这种行为非常有用，当检索的数据可以在主内存中处理时应该使用它。\n\n\
  * `FetchType.LAZY`，意味着在检索引用实体时不会自动检索引用的实体。在我们的示例中，这意味着不会与引用 `Book` 实体一起检索引用的 `Publisher`\
  \ 实体，导致属性的值被设置为 null。通过这种获取行为，必须在事务上下文中调用引用属性的 getter 来单独检索引用的实体（在我们的示例中通过调用 `getPublisher()`）。\n\
  \n\n\n\n\n对于带有 `@OneToOne` 或 `@ManyToOne` 注解的 `single-valued` 引用属性（表示 `functional`\
  \ 关联），默认值为 `FetchType.EAGER`，因此被引用的实体会与引用实体一起获取；而在 `non-functional` 关联（使用 `@OneToMany`\
  \ 或 `@ManyToMany`）情况下，默认值为 `Type.LAZY`，因此被引用的实体不会与引用实体一起获取，而是在需要时单独检索。\n\n由于这些 JPA\
  \ 注解的作用，生成了创建 `books` 表的以下 SQL 创建语句：\n\n```\n CREATE TABLE IF NOT EXISTS `books`\
  \ (\n     `ISBN` varchar(10) NOT NULL,\n     `TITLE` varchar(255) NOT NULL,\n  \
  \   `YEAR` int(11) NOT NULL,\n     `PUBLISHER_NAME` varchar(255) DEFAULT NULL\n\
  \           FOREIGN  KEY (`PUBLISHER_NAME`) REFERENCES `publishers` (`NAME`)\n);\n\
  ```\n\n### 4.4.3 编写约束\n\n确保实体类模型中指定的所有属性约束都通过合适的 Bean Validation 注解正确编码。例如，对于名称属性，我们必须使用\
  \ JPA 注解 `@Id` 来指定该属性对应于实体类映射数据库表的主键列，并使用 Bean Validation 注解 `@NotNull` 定义一个强制值约束，该约束在实体保存到数据库之前会进行检查。\n\
  \n对于地址属性，我们必须以两种形式定义强制值约束：使用 JPA 注解 `@Column( nullable=false)` 对应相应的表列，使用 Bean Validation\
  \ 注解 `@NotNull` 对应该属性。\n\n```\n @Id @NotNull( message=\"A name is required!\")\n\
  private String name;\n@Column( nullable=false)\n@NotNull( message=\"An address is\
  \ required!\")\n private String address;\n```\n\n注意，遗憾的是，当前的 Java EE 技术需要定义两次相同的约束：一次是以\
  \ JPA 注解的形式针对数据库，另一次是以 Bean Validation 注解的形式针对 Java 应用程序。\n\n### 4.4.4 编写 Getter\
  \ 和 Setter\n\n将 setter 操作编写为（实例级）方法。setter 仅负责赋值，不执行任何验证，因为属性约束仅在 Java EE 执行环境在保存之前进行检查。getter\
  \ 则简单地返回属性的实际值。\n\n### 4.4.5 实现删除策略\n\n对于任何引用属性，我们必须选择并实现一种删除策略，以便在引用属性范围类的 delete\
  \ 方法中处理相应的对象销毁依赖。在案例中，我们必须在以下选项之间选择：\n\n1. 删除删除出版者出版的所有书籍；\n2. 从删除出版者出版的所有书籍中删除对该删除出版者的引用。\n\
  \n我们选择第二种策略，该策略仅适用于可选引用属性，如 `book.publisher`。这在以下 `Publisher.delete` 方法的代码中显示，对于所有涉及的图书实体，清空了\
  \ `book.publisher` 属性：\n\n```\n public static void delete( EntityManager em, UserTransaction\
  \ ut,\n          String name) throw Exception {\n     ut.begin();\n     Publisher\
  \ publisher = em.find( Publisher.class, name);\n     // 查找所有拥有出版者的书籍\n     Query\
  \ query = em.createQuery(\n          \"SELECT b FROM Book b WHERE b.publisher.name\
  \ = :name\");\n     query.setParameter( \"name\", name);\n     List<Book> books\
  \ = query.getResultList();\n     // 清空这些书籍的出版者引用\n     for ( Book b: books) { b.setPublisher(\
  \ null);}\n     em.remove( publisher);\n     ut.commit();\n}\n```\n\n该方法遍历所有引用待销毁出版者的\
  \ `Book` 实体，并将其出版者属性设置为 null。\n\n### 4.4.6 序列化与反序列化\n\n基于 JPA 注解并在需要时配合转换类，序列化（从\
  \ Java 对象到表行）以及相应的反序列化（从表列到 Java 对象）将自动完成。\n\n### 4.5 视图与控制器层\n\n用户界面（UI）包含一个用于导航到数据管理\
  \ UI 页面的起始页，以及每个对象类型和数据管理用例的 UI 页面。所有这些 UI 页面都以 JSF 视图文件的形式定义在 `WebContent/views/`\
  \ 文件夹的子目录下。我们在 `WebContent/views/app` 子目录下创建首页 `index.xhtml` 内容如下：\n\n```\n <!DOCTYPE\
  \ html>\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\n       xmlns:ui=\"…\" xmlns:h=\"\
  …\"      xmlns:f=\"…\">\n  <ui:composition template=\"/WEB-INF/templates/page.xhtml\"\
  >\n    <ui:define name=\"content\">\n      <h2>公共图书馆</h2>\n      <h:button value=\"\
  管理出版者\"\n          outcome=\"/views/publishers/index\" />\n      <h:button value=\"\
  管理书籍\" outcome=\"/views/books/index\" />\n      <h:form>\n        <h:commandButton\
  \ value=\"清空数据库\"\n            action=\"#{appCtrl.clearData()}\" />\n        <h:commandButton\
  \ value=\"创建测试数据\"\n            action=\"#{appCtrl.createTestData()}\" />\n    \
  \  </h:form>\n    </ui:define>\n  </ui:composition>\n  </</html>\n```\n\n它创建了菜单按钮，提供跳转到每个管理页面对应视图的链接。此外，我们需要创建\
  \ `AppController` 类，它负责测试数据的创建和删除。控制器通过如下代码结合 `Publisher.createTestData` 和 `Publisher.clearData`：\n\
  \n```\n @ManagedBean ( name=\"appCtrl\")   @SessionScoped\npublic class AppController\
  \ {\n      @PersistenceContext(unitName=\"UnidiroApp\")\n      private EntityManager\
  \ em;\n      @Resource()\n      UserTransaction ut;\n\n      public String clearData\
  \ () {\n           try {\n                Book.clearData ( em, ut);\n          \
  \      Publisher.clearData ( em, ut);\n           } catch ( Exception e) {\n   \
  \           e.printStackTrace();\n           }\n           return \"index\";\n \
  \     }\n      public String createTestData () {\n           try {\n           \
  \    Publisher.createTestData ( em, ut);\n               Book.createTestData ( em,\
  \ ut);\n           } catch ( Exception e) {\n              e.printStackTrace();\n\
  \      }\n      return \"index\";\n   }\n}\n```\n\n`Book` 和 `Publisher`数据的删除必须按特定顺序进行，以避免引用完整性冲突（必须先删除书籍，再删除出版者）。\n\
  \n#### 4.5.1 初始化应用程序\n\n由于代码在 Tomcat 容器运行，初始化由容器完成。\n\n#### 4.5.2 在检索/列所有显示关联对象信息\n\
  \n在示例中，我们只有一个引用属性 `Book::publisher`，它是功能性的。为了在*检索/列所有书籍*用例中显示可选出版者的信息，HTML 表格中相应的列将填充出版者的名称（如果存在）：\n\
  \n```\n <ui:composition template=\"/WEB-INF/templates/page.xhtml\">\n     <ui:define\
  \ name=\"content\">\n         <h:dataTable value=\"#{bookCtrl.books}\" var=\"b\"\
  >\n            …\n            <h:column>\n                <f:facet name=\"header\"\
  >出版者</f:facet>\n                #{b.publisher.name}\n            </h:column>\n \
  \        </h:dataTable>\n         <h:button value=\"主菜单\" outcome=\"index\" />\n\
  \     </ui:define>\n</ui:composition>\n```\n\n注意 JSF 表达式 `${b.publisher.name}` 中使用的级联调用，它访问了书籍实例\
  \ `b` 的出版者属性。\n\n### 4.5.3 在创建和更新中选择关联对象\n\n在本节中，我们将讨论如何创建和更新具有引用属性的对象，例如带有 `publisher`\
  \ 引用属性的 `Book` 对象。\n\n#### 4.5.3.1 创建对象到字符串的转换器\n\n\n\n\nHTML 需要字符串或数字值来填充表单。在我们的案例中，`Book`\
  \ 类的发布者属性发布者是一个对象引用。JSF 允许通过转换器（converters）将对象转换为字符串反之亦然，转换器是使用 `@FacesConverter`\
  \ 注解并实现 `javax.faces.convert.Converter` 接口的类：\n\n```\n @FacesConverter( value=\"\
  pl.m.converter.PublisherConverter\")\npublic class PublisherConverter implements\
  \ Converter {\n  @Override\n     public Object getAsObject( FacesContext context,\n\
  \                    UIComponent component, String value) {\n           PublisherController\
  \ ac = FacesContext\n                         .getCurrentInstance()\n          \
  \               .getApplication()\n                         .evaluateExpressionGet(\
  \ context, \"#{publisherCtrl}\",\n                                  PublisherController.class);\n\
  \           EntityManager em = ac.getEntityManager();\n           if (value == null)\
  \ return null;\n           else return em.find( Publisher.class, value);\n     }\n\
  \     @Override\n     public String getAsString( FacesContext context,\n       \
  \           UIComponent component, Object value) {\n          if (value == null)\
  \ return null;\n          else if (value instanceof Publisher) {\n             \
  \    return ((Publisher) value).getName ();\n          }\n          else return\
  \ null;\n     }\n}\n```\n\n转换器定义了两个方法：`getAsObject` 和 `getAsString`，它们负责两种转换。为了能够从数据库中检索对象，我们需要一个\
  \ `EntityManager`，它可以通过控制器（例如托管豆 `publisherCtrl`）来获取。该控制器可以通过 `FacesContext` 单例获取：\n\
  \n```\n PublisherController ac = FacesContext.getCurrentInstance()\n         .getApplication()\n\
  \         .evaluateExpressionGet( context, \"#{publisherCtrl}\",\n             \
  \      PublisherController.class);\n```\n\n此外，我们需要在控制器类中按照如下所示添加 `getEntityManager`\
  \ 方法：\n\n```\n @ManagedBean( name=\"publisherCtrl\") @SessionScoped\npublic class\
  \ PublisherController {\n       @PersistenceContext( unitName=\"UnidirAssocApp\"\
  )\n       private EntityManager em;\n      @Resource()\n      UserTransaction ut;\n\
  \n      public EntityManager getEntityManager() {\n           return this.em;\n\
  \      }\n      …\n}\n```\n\n在 `update book` 用例场景中，当发布者列表需要自动选择当前发布者时，JSF 需要比较两个发布者实例。出于此原因，`Publisher`\
  \ 模型类需要实现 `equals` 方法。在我们的案例中，如果两个发布者的 name 属性值相等，则这两个发布者是“同一个”：\n\n```\n @Override\n\
  public boolean equals( Object obj) {\n      if (obj instanceof Publisher) {\n  \
  \          Publisher publisher = (Publisher) obj;\n            return ( this.name.equals(\
  \ publisher.name));\n      } else return false;\n}\n```\n\n#### 4.5.3.2 编写视图代码\n\
  \n为了允许在 `create` 和 `update` 用例中从列表中选择与当前编辑对象关联的对象，通过 `h:selectOneMenu` 元素帮助在一个 HTML\
  \ 选择列表（`select` 元素）中用关联对象类型的实例进行填充。位于 `WebContent/views/books/` 文件夹下的 `create.xhtml`\
  \ 文件更新如下：\n\n```\n <ui:composition template=\"/WEB-INF/templates/page.xhtml\">\n\
  \ <ui:define name=\"content\">\n  <h:form id=\"createBookForm\" styleClass=\"pure-form\
  \ pure-form-aligned\">\n   <h:panelGrid columns=\"3\">\n    …\n    <h:outputLabel\
  \ for=\"publisher\" value=\"Publisher:\" />\n    <h:selectOneMenu id=\"publisher\"\
  \ value=\"#{book.publisher}\">\n      <f:selectItem itemValue=\"\" itemLabel=\"\
  ---\" />\n      <f:selectItems value=\"#{publisherCtrl.publishers}\" var=\"p\"\n\
  \                                   itemLabel=\"#{p.name}\" itemValue=\"#{p}\" />\n\
  \      <f:converter converterId=\"pl.m.converter.PublisherConverter\" />\n     </h:selectOneMenu>\n\
  \     <h:message for=\"publisher\"/>\n   </h:panelGrid>\n   <h:commandButton value=\"\
  Create\" action=\"#{bookCtrl.create(\n       book.isbn, book.title, book.year, book.publisher.name)}\"\
  \ />\n  </h:form>\n </ui:define>\n</ui:composition>\n```\n\n转换器通过使用 `f:converter`\
  \ 元素及其 `converterId` 属性指定。该属性的 `value` 必须与 `@FacesConverter` 注解指定的相同。\n\n通常，可以使用转换器的本地名称（例如\
  \ `PublisherConverter`），或者在存在命名冲突时使用完全限定名（例如 `pl.m.converter.PublisherConverter`）。我们建议在所有情况下使用完全限定名。`#{publisherCtrl.publishers}`\
  \ 表达式调用 `PublisherController` 类的 `getPublishers` 方法，该方法负责返回发布者列表：\n\n```\n public\
  \ List<Publisher> getPublishers () {\n       return Publisher.retrieveAll ( em);\n\
  }\n```\n\n书籍的创建是通过使用 `h:commandButton` 元素实现的。它调用 `BookController` 类的 `create` 方法：\n\
  \n```\n public String create( String isbn, String title, Integer year,\n       \
  \   Publisher publisher) {\n     try {\n          Book.create( em, ut, isbn, title,\
  \ publisher);\n          // 创建书籍后清除表单\n          FacesContext facesContext = FacesContext.getCurrentInstance();\n\
  \          facesContext.getExternalContext().getRequestMap().remove( \"book\");\n\
  \     } catch ( EntityExistsException e) {\n          try {\n               ut.rollback();\n\
  \           } catch ( Exception e1) {\n               e1.printStackTrace();\n  \
  \        }\n          e.printStackTrace();\n     }  catch ( Exception e) {\n   \
  \       e.printStackTrace();\n     }\n     return \"create\";\n}\n```\n\n它简单地调用\
  \ `Book.create` 在表中新建一行。\n\n*update book* 用例的代码非常相似，主要的区别是增加了选择元素（即使用 `h:OneMenu`）以允许选择书籍：\n\
  \n```\n <ui:composition template=\"/WEB-INF/templates/page.xhtml\">\n <ui:define\
  \ name=\"content\">\n  <h:form id=\"createBookForm\" styleClass=\"pure-form pure-form-aligned\"\
  >\n   <h:panelGrid columns=\"3\">\n   …\n    <h:outputLabel for=\"selectBook\" value=\"\
  Select book: \" />\n    <h:selectOneMenu id=\"selectBook\" value=\"#{book.isbn}\"\
  >\n     <f:selectItem itemValue=\"\" itemLabel=\"---\" />\n     <f:selectItems value=\"\
  #{bookCtrl.books}\" var=\"b\"\n           itemValue=\"#{b.isbn}\" itemLabel=\"#{b.title}\"\
  \ />\n     <f:ajax listener=\"#{bookCtrl.refreshObject( book)}\"\n           render=\"\
  isbn title publisher\"/>\n    </h:selectOneMenu>\n    <h:message for=\"selectBook\"\
  />\n   </h:panelGrid>\n   <h:commandButton value=\"Update\" action=\"#{bookCtrl.update(\n\
  \       book.isbn, book.title, book.year, book.publisher.name)}\" />\n  </h:form>\n\
  \ </ui:define>\n</ui:composition>\n```\n\n\n\n\n\n多值引用属性（例如 `Book::authors`）允许存储对某种类型对象的内部引用的集合，例如对\
  \ `Author` 对象的引用。在创建类型为 `Book` 的新对象时，构造函数需要一个参数来为该属性提供合适的值。通常情况下，这个值可以是一组内部对象引用集合，或者是\
  \ ID 引用集合。在 JPA 中，我们使用对象引用：\n\n```\n @Entity @Table ( name=\"books\")\n@ManagedBean\
  \ ( name=\"book\")\n@ViewScoped\npublic class Book {\n       …\n       private Set<Author>\
  \ authors;\n\n       public Book() { // JPA @Entity 注解所要求的！】\n       public Book(\
  \ String isbn, String title, Integer year,\n                    Publisher publisher,\
  \ Set<Author> authors) {…}\n\n       public Set<Author> getAuthors() { return this.authors;}\n\
  \       public void setAuthors( Set<Author> authors) { this.authors = authors;}\n\
  \      …\n}\n```\n\n## 5.2 构建 Java 实体类模型\n\n我们构建 Java 实体类模型的起点是以下面向对象（OO）的类模型：\n\
  \n![](img/b_9783110500325-005_ingr_001.png)\n\n该模型除了表示单向多对一关联 `Book`-拥有`-`Publisher`\
  \ 的单值引用属性 `Book::publisher` 外，还包含了表示单向多对多关联 `Book`-拥有`-`Author` 的多值引用属性 `Book::authors`。\n\
  \n回想一下我们通过以下方式从 OO 类模型中的对应类获取 Java 实体类（如 `Author`）：(1) 将所有属性设为私有，(2) 使用 Java 数据类型类，(3)\
  \ 添加公共 getter 和 setter，(4) 添加 `toString` 函数，(5) 添加数据存储方法 `create`、`retrieve`、`update`\
  \ 和 `delete`：\n\n![](img/b_9783110500325-005_ingr_002.png)\n\n在 Java 实体类模型中，OO 类模型中指定的任何引用属性都用其所表示的关联的功能类型进行注解。在示例中，我们为实体类\
  \ `Book` 中的引用属性 `authors` 标注了 `manyToMany`：\n\n![](img/b_9783110500325-005_ingr_003.png)\n\
  \n### 5.3 新问题\n\n与上一节讨论的单向功能性关联相比，我们必须处理以下新技术问题：\n\n1. 在*模型类*中，我们现在必须处理需要用 `@OneToMany`\
  \ 或 `@ManyToMany` 注解的*多值引用属性*。\n2. 在*用户界面*代码中，我们现在必须处理：\n    1. 在`检索/列出所有对象`用例中，在渲染多值引用属性的视图表列中显示有关关联对象集合的信息；；\n\
  \    2. 在`创建对象`和`更新对象`用例中，允许从目标类所有现有实例的列表中选择关联对象的集合。\n\n最后一个问题，即从某个类的所有现有实例的列表中选择关联对象的集合，通常由于易用性问题，无法通过\
  \ HTML `select multiple` 表单元素来解决。每当可选选项集超过某个阈值时（由不无需滚动条即可在屏幕上显示的选项数量定义），HTML `select\
  \ multiple` 元素将不再可用，必须使用替代的*多选择控件*。\n\n### 5.4 编写模型代码\n\n可以直接对 Java 实体类模型进行编码，以实现我们\
  \ Java 后端应用的模型层。\n\n#### 5.4.1 总结\n\n1. 将 Java 实体类模型的每个类编码为对应的实体类。\n2. 为任何 `{id}`\
  \ 属性修饰符编写 JPA 属性注解 `@Id`。\n3. 为表示引用属性功能类型的属性修饰符（例如 `{manyToOne}`）编写相应的 JPA 注解，例如\
  \ `@ManyToOne`。\n4. 使用 Java Bean Validation 注（或自定义校验注解）对模型中指定的完整性约束编码。\n5. 为多值属性编写\
  \ getter 和 setter 以及 `add` 和 `remove` 方法。\n6. 将 `create`、`retrieve`、`update` 和 `delete`\
  \ 存储管理操作编码为类方法。\n\n这些步骤将在接下来的章节中详细讨论。\n\n#### 5.4.2 编写 Java 实体类模型中的每个类\n\n对于多值引用属性\
  \ `Book::authors`，我们使用参数化的 `Set` 类型：\n\n```\n @Entity @Table ( name=\"books\")\n\
  @ViewScoped @ManagedBean ( name=\"book\")\npublic class Book {\n     …\n     @ManyToMany\
  \ ( fetch=FetchType.EAGER)\n     private Set<Author> authors;\n\n     public Book()\
  \ {}\n     public Book( String isbn, String title, Integer year,\n            Publisher\
  \ publisher, Set<Author> authors) {…}\n     …\n     public Set<Author> getAuthors()\
  \ { return this.authors;}\n     public void setAuthors( Set<Author> authors) { this.authors=authors;}\n\
  \     …\n}\n```\n\nJPA 注解 `@ManyToMany` 允许指定 `Book` 和 `Author` 之间的**多对多**关系。使用了注解参数\
  \ `FetchType.EAGER`，因此当创建 `Book` 实例时，作者列表将用相应的 `Author` 实例填充。由于该注解的作用，在 `Book` 和\
  \ `Author` 之间创建了一张关系表，生成的 SQL 代码如下：\n\n```\n CREATE TABLE IF NOT EXISTS `books_author`\
  \ (\n    `Book_ISBN` varchar(10) NOT NULL,\n    `authors_PERSONID` int(11) NOT NULL\n\
  \  );\n```\n\n生成的类名是表名用下划线连接的组合（例如 `books_author`）。来自两个表的主键列被用于实现该关系。相应的列名创建如下：\n\
  \n* 对于对应带有 `@ManyToMany` 注解类（例如 `Book`）的表（例如 `books`），同时使用了类名和主键名，例如 `Book_ISBN`。\n\
  * 对于另一个表（例如 `authors`），将表名与主键名拼接，例如 `authors_PERSONID`。\n\n可以通过 `@JoinTable` 注解来控制这些参数，即表名和关系列名。要获取自定义命名的关系表（例如\
  \ `books_authors`）以及相应的命名列（例如 `book_isbn` 和 `author_personid`），可以使用：\n\n```\n @JoinTable(\
  \ name=\"books_authors\",\n      joinColumns = {@JoinColumn( name=\"book_isbn\"\
  , \n      referencedColumnName=\"ISBN\")},\n      inverseJoinColumns = {@JoinColumn(\
  \ name=\"author_personid\",\n                                           referencedColumnName=\"\
  PERSONID\")\n```\n\n在我们的应用程序中，保持默认设置，因此没有使用 `@JoinTable` 注解。\n\n相应的 `Author` 类使用适当的注解编码为\
  \ Java 实体类：\n\n```\n @Entity @Table ( name=\"author\")\n@ManagedBean ( name=\"author\"\
  ) @ViewScoped\npublic class Author {\n     // 属性\n     @Id @PositiveInteger\n  \
  \   private Integer personId;\n     @Column ( nullable=false)\n     @NotNull ( message=\"\
  必须提供名称！\")\n     private String name;\n     @Column ( nullable=false)\n     @NotNull\
  \ ( message=\"必须提供出生日期！\")\n     @Past private Date dateOfBirth;\n     @Past private\
  \ Date dateOfDeath;\n     // 构造函数\n     …\n    // Setters/getters\n    …\n    //\
  \ 数据管理操作\n    …\n}\n```\n\n除了定义属性外，实体类还需要需要定义构造函数、setter/getter 以及数据管理操作：\n\n\n\n\
  \n\n```\n @Entity @Table( name=\"author\")\n@ManagedBean( name=\"author\") @ViewScoped\n\
  public class Author {\n      // \n     …\n     // 构造函数\n     public Author() {}\n\
  \     public Author( Integer personId, String name,\n            Date dateOfBirth,\
  \ Date dateOfDeath) {…}\n     // Setters/getters\n     …\n     // 数据管理操作\n     public\
  \ static void create( EntityManager em, UserTransaction ut,\n            Integer\
  \ personId, String name, Date dateOfBirth,\n            Date dateOfDeath) {…}\n\
  \     public static void update(…) {…}\n     public static void delete(…) {…}\n\
  }\n```\n\n### 5.4.3 实现删除策略\n\n对于引用属性 `Book::authors`，我们必须在 `Author` 类的 `delete`\
  \ 方法中实现删除策略。如果我们仅仅尝试删除一个作者，而该作者被任何书籍记录所引用，则会抛出完整性约束违反异常（integrity constraint violation\
  \ exception），导致作者无法被删除。处理这种情况有两种可能方法：\n\n1. 删除所有由被删除作者（共同）编写的书籍；\n2. 从所有由被删除作者（共同）编写的书籍中移除对该作者的引用。\n\
  \n我们选择第二种方案。下在 `Author.delete` 方法的代码中所示：\n\n```\n public static void delete( EntityManager\
  \ em, UserTransaction ut,\n           Integer personId) throws Exception {\n   \
  \   ut.begin();\n      Author author = em.find( Author.class, personId);\n     \
  \ // 查找该作者的所有书籍\n      Query query = em.createQuery( \"SELECT DISTINCT b FROM Book\
  \ b \"+\n           \"INNER JOIN b.authors a WHERE a.personId = :personId\");\n\
  \      query.setParameter( \"personId\", personId);\n      List<Book> books = query.getResultList();\n\
  \      // 从书籍的作者列表中移除该作者引用\n      for (Book b : books) {\n             b.getAuthors().remove(\
  \ author);\n  }\n      // 删除作者记录（表行）\n      em.remove( author);\n      ut.commit();\n\
  \  }\n```\n\n本质上，删除操作包含三个步骤：\n\n1. 创建一个 JPQL 查询，选择该作者的所有书籍（由于这是从书籍到作者的单向关联，无法直接从作者访问其书籍）。\n\
  2. 对于每个找到的引用该作者的书籍，我们必须从其作者列表中移除该作者引用。\n3. 最后，删除作者记录。\n\n### 5.4.4 序列化与反序列化\n\n\
  在 Java EE 中，从对象到相应数据库记录的序列化，以及从数据库记录到对象的反序列化，是由 Java EE 执行环境根据 JPA 注解和用于自定义转换的转换类自动完成的。\n\
  \n### 5.5 编写用户界面代码\n\n#### 5.5.1 在检索/列出所有中显示关联对象信息\n\n为了在“检索/列出所有书籍”用例显示书籍作者的信息，HTML\
  \ 表格中对应的单元格必须填充所有作者名称的列表。为此，我们在 `Book` 类中实现了一个方法，该方法返回序列化后的作者名称列表（格式为 `authorName_1,\
  \ authorName_2, …, authorName_n`）：\n\n```\n public String getAuthorNames() {\n \
  \   String result = \"\";\n    int i = 0, n = 0;\n    if ( this.authors != null)\
  \ {\n         n = this.authors.size();\n         for ( Author author : this.authors)\
  \ {\n             result += author.getName();\n             if ( i< n - 1) {\n \
  \                 result +=\", \";\n             }\n             i++;\n        \
  \ }\n     }\n     return result;\n  }\n```\n\n在 `WebContent/views/books/` 文件夹下的视图文件\
  \ `retrieveAndListAll.xhtml` 中，该方法在“Authors”列的 JSF 表达式被调用：\n\n```\n <ui:composition\
  \ template=\"/WEB-INF/templates/page.xhtml\">\n    <ui:define name=\"content\">\n\
