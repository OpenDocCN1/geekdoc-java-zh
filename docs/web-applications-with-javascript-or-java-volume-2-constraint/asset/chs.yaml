  \ `Author` 模型类添加 `equals` 方法。在我们的案例中，如果两个作者的 `personId` 属性相等，它们是“同一个”：\n\n```\n\
  \ @Override\npublic boolean equals( Object obj) {\n     if (obj instanceof Author)\
  \ {\n          Author author = (Author) obj;\n          return (this.personId.equals(\
