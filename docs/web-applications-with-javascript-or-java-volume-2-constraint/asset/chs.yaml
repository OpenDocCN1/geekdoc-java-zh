  \ Factbook）网站找到。\n\n# 第二部分：类层次结构中的继承\n\n当应用程序需要管理大量对象类型的数据时，某些对象类型之间可能存在各种 `subtype`（子类型）继承关系。子类型和继承是信息模型中的重要元素。应用程序必须以适当的方式实现它们，通常是在模型-视图-控制器（MVC）架构的模型层中。\n\
  \n## 12 子类型化与继承\n\n`subtype`（子类型）或 `subclass`（子类）的概念是自然语言、数学和信息科学中的基本概念。例如，在英语中，我们说*鸟是动物*，或者所有鸟的类是所有动物类的*子类*。在语言学中，“鸟”是名词“动物”的下位词（hyponym）。\n\
  \n对象类型可以被子类型特化（例如，*鸟*特化为*鹦鹉*），也可以被父类型泛化（例如，*鸟*和*哺乳动物*被泛化为*动物*）。特化和泛化是同一枚硬币的两面。\n\
  \n\n\n\n子类 `inherits` 继承其所有父类的特征。当子类从父类继承属性、关联和约束时，这意味着在类图中不需要为该子类重复渲染这些特征，但类图的读者必须理解，父类的所有特征也适用于其子类。\n\
  \n当一个对象类型拥有多个直接父类时，我们就处于 `multiple inheritance`（多重继承）的情况，这在概念建模中很常见，但在许多面向对象的编程语言中是被禁止的，例如\
  \ `Java` 和 `C#`，这些语言仅允许每个对象类型具有唯一直接父类的 `class hierarchies`（类层次结构）。\n\n### 12.1 通过特化引入子类\n\
  \n每当一个对象类型代表另一个对象类型的特例时，就可以通过特化（specialization）引入一个新的对象类型。我们在示例模型中说明这一点，即我们希望将教材和传记作为书籍的特例。。这意味着教材和传记也拥有\
  \ `ISBN`、`title`（标题）和 `publishing year`（出版年份），但它们还具有进一步特征，例如教材的 `subjectArea`（学科领域）属性和传记的\
  \ `about`（关于）属性。因此，在图 12.1 中，我们通过特化对象类型 `Book` 来引入对象类型 `TextBook` 和 `Biography`，即它们作为\
  \ `Book` 的子类。\n\n![](img/b_9783110500325-012_fig_001.png)\n\n图 12.1：对象类型 `Book`\
  \ 的两个子类：`TextBook` 和 `Biography`。\n\n在特化对象类型时，我们为新添加的子类定义额外的特征。在许多情况下，这些额外特征是更具体的属性。例如，在\
  \ `TextBook` 特化 `Book` 的情况下，我们定义了额外的属性 `subjectArea`。在某些编程语言（如 `Java`）中，因此说子类 `extends`（扩展）父类。\n\
  \n然而，我们也可以在不定义额外属性或操作/方法的情况下，通过定义额外的约束来特化对象类型。\n\n### 12.2 通过泛化引入父类\n\n我们通过图 12.2\
  \ 所示的示例来说说明泛化（generalization）。\n\n![](img/b_9783110500325-012_fig_002.png)\n\n图\
  \ 12.2：对象类型 `Employee` 和 `Author` 共享若干属性。\n\n添加对象类型 `Employee` 后，我们注意到 `Employee`\
  \ 和 `Author` 共享许多属性，这是因为员工和作者都是人，而“成为员工”和“成为作者”是人扮演的 `roles`（角色）。因此，我们可以通过添加一个共同的父类\
  \ `Person` 来对这两个对象类型进行泛化，如图 12.3 中的图所示。\n\n![](img/b_9783110500325-012_fig_003.png)\n\
  \n图 12.3：对象类型 `Employee` 和 `Author` 通过共同的父类 `Person` 泛化。\n\n在泛化两个或多个对象类型时，我们将它们共享的特征移动到新添加的父类中进行集中。在\
  \ `Employee` 和 `Author` 的情况下，这组共享特征包括属性 `name`（姓名）、`dateOfBirth`（出生日期）和 `dateOfDeath`（死亡日期）。通常，共享特征可能包括属性、关联和约束。\n\
  \n注意，由于在信息设计模型中，每个顶层类都需要一个标准的标识符，我们在新类 `Person` 中声明了标准标识符属性 `personId`，它由所有子类继承。因此，我们必须重新考虑在泛化之前在子类中声明为标准标识符的属性。在\
  \ `Employee` 的情况下，我们将属性 `employeeNo` 声明为标准标识符。由于员工号是一个重要的业务信息项，即使它不再是标准标识符，我们也必须保留该属性。因为它仍然是一个备用标识符（一个“键”），我们使用约束关键字\
  \ `key` 为其定义了一个 `uniqueness`（唯一性）约束。\n\n在 `Author` 的情况下，我们将属性 `authorId` 声明为标准标识符。假设该属性代表的是纯技术性的而非业务的信息项，我们舍弃它，因为它不再需要作为作者的标识符。因此，我们最终的模型允许通过员工号或其\
  \ `personId` 值来识别员工，并通过其 `personId` 值来识别作者。\n\n我们考虑了原始示例模型的以下扩展，如图 12.4 所示，添加了两个类层次结构：\n\
  \n1. 将 `Book` 分为 `TextBook` 和 `Biography` 的不相交（但不完全）的划分；\n2. 将 `Person` 分为重叠且不完全的\
  \ `Author` 以及进一步由 `Manager` 特化的 `Employee`。\n\n![](img/b_9783110500325-012_fig_004.png)\n\
  \n图具有两个层次结构的信息模型。\n\n### 12.3 内涵（Intension）与扩展（Extension）\n\n对象类型的 `intension`（内涵）由其特征（属性、关联、约束给出。对象类型的\
  \ `extension`（扩展）是实例化该类型的对象集合，也称为其种。我们有如下对立关系：父类的所有特征都在子类的内涵中（内涵包含），子类的所有实例都在类型的扩展中（扩展包含）。这种形式结构已经在形式分析中得到了研究。\n\
  \n由于内涵/扩展的对立，我们可以通过两种方式特化给定的类型：\n\n1. 通过在子类中添加特征来扩展类型的内涵（例如添加属性 `subjectArea`）。\n\
  2. 通过添加约束来限制类型的扩展（例如定义一个 `subjectArea` 为“Mathematics”的子类）。\n\n典型的对象语言（如 `Java` 和\
  \ `C#`）仅支持第一种可能性（通过扩展内涵来特化类型），而 `XML Schema` 和 `SQL99` 也支持第二种（通过限制扩展来特化类型）。\n\n\
  ### 12.4 类型层次结构\n\n`type hierarchy`（类型层次结构）由两个或多个类型组成，其中一个是根类型（或顶层）类型，所有其他类型至少有一个父类。当所有非根类型都有唯一的直接父类时，该类型层次结构就是\
  \ `single-inheritance hierarchy`（单继承层次结构），否则它是 `multiple-inheritance hierarchy`（多重继承层次结构）。例如，在下面的图\
  \ 12.5 中，`Vehicle` 类是单继承层次结构的根；而图 12.6 展示了一个多重继承层次结构的示例，因为 `AmphibianVehicle` 有两个直接父类：`LandVehicle`\
  \ 和 `WaterVehicle`。\n\n![](img/b_9783110500325-012_fig_005.png)\n\n图 12.5：具有根类 `Vehicle`\
  \ 的类层次结构。\n\n类层次结构的简单情况（只有一层子类型关系）在 UML 中被称为 `generalization set`（泛化集），但可能更自然地称为\
  \ `segmentation`（划分）。如果所有子类扩展的并集等于父类的扩展，则该划分是 `complete`（完全的）（或者说，父类的所有实例都实例化了某个子类）。如果所有子类两两不相交，则该划分是\
  \ `disjoint`（不相交的）（或者说，没有父类实例实例化了多个子类）。否则，它被称为 `overlapping`（重叠的）。完全且不相交的划分被称为 `partition`（分区）。\n\
  \n\n\n\n在类图中，我们可以通过在共享的泛化箭头上标注大括号内的关键字 `complete`（完全）和 `disjoint`（不相交）来表示这些约束。例如，对一个分段进行\
  \ `{complete, disjoint}` 标注表示它是一个划分（partition）。默认情况下，每当分段没有任何标注时（如上方图 12.6\n\n图\
  \ 12.6：多重继承层次。\n\n信息模型可以包含任意数量的类层次。\n\n### 12.5 种类与角色\n\n为了更好地理解真实世界的自然语言表述以及信息模型中不同类型的对象类型和子类型，我们可以根据\
  \ Giancarlo Guizzardi 在其《结构化概念模型的本体论基础》第 4 章的对象类型分类理论中提出的建议，区分 `sortal`（分类的）与非 `sortal`，以及\
  \ `rigid`（刚性的）与非刚性的对象类型。\n\n如果一个对象类型对其实例具有统一的身份标识条件，则该对象类型是 `sortal` 的。这种条件定义了某种属性（或属性集），使得两个实例在不属于同一个对象的情况下，无法共同拥有这些属性。`sortal`\
  \ 对象类型的例子是 `Person`（人），因为其所有的实例（人）都可以通过一组与其出生相关的属性（何时出生、何地出生以及为谁出生）来识别。`Book`（书）是非\
  \ `sortal` 对象类型的例子，因为它包含了以不同方式识别的实例（例如，教科书和自出版的小说）。\n\n如果一个对象类型的实例在不消失（或不改变其身份）的情况下不再属于该类型，则该对象类型是\
  \ `rigid` 的。`Person` 是 `rigid` 对象类型的例子，而 `Employee`（员工）不是刚性的。如果所有分段子类都是刚性的，则该分段被称为\
  \ `rigid`。\n\n`kind`（种类）是一种刚性的 `sortal` 对象类型。种类的例子有 `TextBook`（教科书）和 `Person`。`role`（角色）是一个\
  \ `sortal` 对象类型 `R`，用于分类所有与对象类型 `O` 的实例参与（某种类型 `A`）关系的种类 `K` 的实例。请注意，`R` 是 `K` 的非刚性子类型，因为当其实例由于不再参与与类型\
  \ `O` 实例的类型 `A` 关系而停止实例化 `R` 时，它们并不会消失。\n\n例如，`Employee` 就是角色的例子，因为它是一个 `sortal`\
  \ 对象类型，用于分类所有与类型为 `Enterprise`（企业）的实例参与雇佣关系的 `Person` 实例。\n\n### 12.6 类层次合并设计模式\n\
  \n考虑上方图 12.1 中设计模型的简单类层次，它显示了类 `Book` 的不相交分段。在这种情况下，每当只有一层（或只有少数层）子类型，且每个子类型只有一个（或少数几个）额外属性时，通过将所有子类的所有额外属性合并到根类的扩展版本中来重构类层次也是一种选择，使得这些子类可以从模型中删除，从而实现模型的简化。\n\
  \n`Class Hierarchy Merge`（类层次合并）设计模式有两种形式。在最简单的形式中，原始类层次的分段是 `disjoint`（不相交），这允许使用\
  \ `single-valued`（单值）类别属性来表示根类每个实例的具体类别，该类别对应于它实例化的唯一子类。当原始类层次的分段不相交时，即至少有一个段是 `overlapping`（重叠）的，我们需要使用\
  \ `multi-valued`（多值）类别属性来表示对象实例化的类型集合。我们只讨论针对不相交分段的简单 `Class Hierarchy Merge` 重构情况，我们采取以下重构步骤：\n\
  \n1. 添加一个 `enumeration datatype`（枚举数据类型），其中包含每个分段子类对应的枚举字面量。在我们的示例中，我们添加了枚举数据类型\
  \ `BookCategoryEL`。\n\n2. 在根类中添加一个类别属性，并将该枚举作为其范围。如果分段是完全的，则类别属性是强制的 [1]；否则是可选的\
  \ [0..1]。在我们的示例中，我们为类 `Book` 添加了一个范围为 `BookCategoryEL` 的类别属性。该类别属性是可选的，因为 `Book`\
  \ 划分为 `TextBook` 和 `Biography`（传记）的分段是不完全的。\n\n3. 每当分段是 `rigid`（刚性的）时，我们将类别属性指定为\
  \ `frozen`（冻结），这意味着它只能在创建新对象时通过设置值赋值一次，此后不能更改。\n\n4. 将分段子类的属性移动到根类，并将其设为 `optional`（可选）。我们将这些通常列在类别属性下方的属性称为\
  \ `segment properties`（分段属性）。在我们的示例中，我们将来自 `TextBook` 的 `subjectArea`（学科领域）和来自 `Biography`\
  \ 的 `about`（关于）移动到 `Book`，并将它们设为可选，即 `[0..1]`。\n\n5. 添加一个约束（在附在扩展的根类矩形上的不变式框中），强制当且仅当实例实例化相应的类别时，可选的子类属性才有值。\n\
  \n6. 从模型中删除分段子类。\n\n在我们的示例中，这种重构的结果如下方的图 12.7 所示。注意，该约束（或“不变式”）表示一个逻辑语句，其中逻辑运算符\
  \ `IFF` 代表逻辑“当且仅当”，属性条件 `prop=undefined` 测试属性是否没有值。\n\n![](img/b_9783110500325-012_fig_007.png)\n\
  \n图 12.7：应用类层次合并模式的结果。\n\n### 12.7 计算语言中的子类型与继承\n\n子类型和继承已在面向对象编程 (*OOP*)、数据库语言（如\
  \ *SQL99*）、XML 架构定义语言 *XML Schema* 以及其他计算语言中以不同的方式和程度得到支持。计算语言中子类型处理的核心在于定义类型层次以及特征的继承：OOP\
  \ 中的属性、约束和方法；SQL99 中的表列和约束；XML Schema 中的元素、属性和约束。通常，在类型层次中支持*多重分类*和*多重继承*是理想的。这两个语言特性密切相关，被认为是高级特性，在许多应用程序中可能不需要，或者可以通过变通方法解决。\n\
  \n#### 12.7.1 OOP 中的子类型与继承\n\n\n\n\n面向对象编程（OOP）中对子类型的最基本支持（例如 Java 和 C# 所提供的）允许在单继承层次结构中定义属性和方法的继承。这种继承可以通过\
  \ `is-instance-of` 谓词进行检查，该谓词允许测试一个类是否是对象的直接类型或间接类型。此外，最好能够通过以下方式检查继承层次结构：\n\n1.\
  \ 一个预定义的实例层级属性，用于检索`对象的直接类型`（如果允许多重分类，则为其`多个直接类型`）；\n2. 一个预定义的类型层级属性，用于检索`类型的直接父类型`（如果允许多重继承，则获取其`多个直接父类型`）。\n\
  \nJavaScript 是一种特殊的 OOP 语言，它最初没有用于定义类的显式语言元素，只有用于定义构造函数的元素。由于其动态编程的特性，JavaScript\
  \ 允许使用各种代码模式来实现类、子类型和继承。在现代 JavaScript 中（从 ES2015 开始），定义父类和子类是非常直接的。首先，我们定义一个基类\
  \ `Person`，包含两个属性 `firstName` 和 `lastName`：\n\n```\n class Person {\n  constructor\
  \ (first, last) {\n //// assign base class properties\n    this.firstName = first;\n\
  \    this.lastName = last;\n  }\n}\n```\n\n然后，我们定义一个子类 `Student`，包含一个额外的属性 `studentNo`：\n\
  \n```\n class Student extends Person {\n  constructor (first, last, studNo) {\n\
  \ //// invoke constructor of superclass\n    super( first, last);\n //// assign\
  \ additional properties\n    this.studentNo = studNo;\n  }\n}\n```\n\n注意如何通过 `super(\
  \ first, last)` 调用父类的构造函数来为父类属性进行赋值。\n\n## 12.7.2 使用 XML Schema 的子类型和继承\n\n在 XML\
  \ Schema 中，子类型可以通过`扩展（extending）`或`限制（restricting）`现有的复杂类型来定义。扩展复杂类型意味着通过添加元素或属性来`扩展其内涵（intension）`，而限制复杂类型意味着通过添加约束来`限制其外（extension）`。\n\
  \n我们可以通过以下方式通过扩展 `Person` 来定义复杂类型 `Person` 和子类型 `Student`：\n\n```\n <xs:complexType\
  \ name=\"Person\">\n  <xs:attribute name=\"firstName\" type=\"xs:string\" />\n \
  \ <xs:attribute name=\"lastName\" type=\"xs:string\" />\n  <xs:attribute name=\"\
  gender\" type=\"GenderValue\" />\n</xs:complexType>\n<xs:complexType name=\"Student\"\
  >\n  <xs:extension base=\"Person\">\n    <xs:attribute name=\"studentNo\" type=\"\
  xs:string\" />\n  </xs:extension>\n</xs:complexType>\n```\n\n我们可以通过以下方式限制 `Person`\
  \ 来定义子类型 `FemalePerson`：\n\n```\n <xs:complexType name=\"FemalePerson\">\n  <xs:restriction\
  \ base=\"Person\">\n    <xs:attribute name=\"firstName\" type=\"xs:string\" />\n\
  \    <xs:attribute name=\"lastName\" type=\"xs:string\" />\n    <xs:attribute name=\"\
  gender\" type=\"GenderValue\"\n      use=\"fixed\" value=\"f\" />\n  </xs:restriction>\n\
  </xs:complexType>\n```\n\n注意，通过将 `gender` 属性的值固定为“f”，我们定义了一个仅由 `Person` 的女性实例满足的约束。\n\
  \n## 12.7.3 使用 OWL 的子类型和继承\n\n在 Web 本体语言（OWL）中，属性定义与类定义分离，且属性默认不是单值的，而是多值的。因此，标准属性需要声明为`函数的（functional）`。因此，我们得到以下代码来表示\
  \ `Person` 是一个拥有属性 `name` 的类：\n\n```\n <owl:Class rdf:ID=\"Person\"/>\n<owl:DatatypeProperty\
  \ rdf:ID=\"name\">\n    <rdfs:domain rdf:resource=\"#Person\"/>\n    <rdfs:range\
  \ rdf:resource=\"xsd:string\"/>\n    <rdf:type rdf:resource=\"owl:FunctionalProperty\"\
  />\n</owl:DatatypeProperty>\n```\n\nOWL 允许通过以下方式说明类是另一个类的子类：\n\n```\n <owl:Class\
  \ rdf:ID=\"Student\">\n     <rdfs:subClassOf rdf:resource=\"#Person\"/>\n</owl:Class>\n\
  <owl:DatatypeProperty rdf:ID=\"studentNo\">\n    <rdfs:domain rdf:resource=\"#Student\"\
  />\n    <rdfs:range rdf:resource=\"xsd:string\"/>\n    <rdf:type rdf:resource=\"\
  owl:FunctionalProperty\"/>\n</owl:DatatypeProperty>\n```\n\n为了更好的用性，OWL 应该允许在类定义内部定义类的属性，并以函数属性作为默认情况。\n\
  \n## 12.7.4 使用 SQL 数据库表表示类层次结构\n\n标准的数据库管理系统（DBMS）在表行中存储信息（对象），这些行在经典的`关系型（relational）`数据库系统中被设计为集合论的关系。关系型数据库语言\
  \ `SQL` 用于定义、填充、更新和查询此类数据库。但也有更简单的数据存储技术允许以表行的形式存储数据，但它们不支持 `SQL`。特别是键值对存储系统（例如\
  \ JavaScript 的 `Local Storage API`），允许将 `JS 实体表`（实体记录的映射）的序列化作为与表名键关联的字符串值进行存储。\n\
  \n虽然在经典的 `SQL` 版本（`SQL92`）中不支持子类型和继承，但这种情况在 `SQL99` 中发生了变化。然而，`SQL99` 中与子类型相关的语言元素仅在某些\
  \ DBMS 中实现，例如在开源 DBMS `PostgreSQL` 中。因此，为了创建一个可以使用各种框架、通过各种 `SQL DBMS`（包括较弱的技术，如\
  \ `MySQL` 和 `SQLite`）实现的设计模型，我们无法使用 `SQL99` 的子类型功能，而必须通过普通表和外键依赖在数据库设计模型中对继承层次结构。这种从类层次结构到关系表（以及反之）的映射是`对象关系映射（Object-Relational-Mapping）`框架的工作，例如\
  \ JPA 提供者（如 `Hibernate`）、微软的 `Entity Framework` 或 Rails 框架的 Active Record 方法。\n\n\
  本质上有三种使用数据库表表示类层次结构的替代方法：\n\n1. `单表继承`（`Single Table Inheritance`, `STI`）是最简单的方法，整个类层次结构由单个表表示，该表包含根类及其所有子类的所有属性的列，并以根类命名。\n\
  2. `类表继承`（`Table per Class Inheritance`, `TCI`）是一种方法，层次结构中的每个类都由相应的表表示，该表也包含继承属性的列，从而重复了表示其父类的表的列。\n\
  3. `连接表继承`（`Joined Tables Inheritance`, `JTI`）是一种更符合逻辑的方法，每个子类都由相应的表（子表）表示，通过其主键引用父类的主键与表示父类的表（父表）连接，使得父类的（继承的）属性不作为子表的列表示。\n\
  \n注意，`STI` 方法与上面 12.6 节讨论的`类层次结构合并（Class Hierarchy Merge）`设计密切密切。每当设计模型中已经应用该设计模式，或者设计模型已经根据该设计模式进行了重构，相关的类层次结构（其子类）就已经在设计中被消除了，随之在以类定义形式编码的数据模型中也被消除了，因此不再需要将类层次结构映射到单表。否则，设计模型中包含一个类层次结构，该层次结构在应用层模型中通过相应的类层次结构实现，并将通过\
  \ `STI` 方法映射到数据库表。\n\n\n\n\n\n我们通过两个简单的示例来说说明这些方法的用法。第一个例子是 `Book` 类层级结构，如上方 图 12.1\
  \ 所示。第二个例子是 `Person` 角色的 `Employee`、`Manager` 和 `Author` 的类层级结构，如下方 图 12.8 中的类图所示。\n\
  \n![](img/b_9783110500325-012_fig_008.png)\n\n图 12.8：具有 Person 角色层级的信息设计模型。\n\n\
  ### 12.7.4.1 单表继承\n\n考虑上方 图 12.1 所示的单级类层级结构，作为 MVC 应用模型类的设计，它是类 `Book` 的不完全不交划分。在这种情况下，当我们模型类层级结构只有一级（或少数几）子类型，且每个子类型只有少数额外属性时，使用\
  \ STI 更好，因此我们建模一个包含所有属性列的单表，其中表示分段子类额外属性的列（分段属性”）是可选的，如下方 图 12.9 中的 SQL 表模型所示。\n\
  \n![](img/b_9783110500325-012_fig_009.png)\n\n图 12.9：表示 Book 类层级结构的单表 SQL 模型。\n\n\
  添加一个特殊的 `discriminator column`（判别列）来表示每行对应的由表示对象实例化的子类类别是一种常用方法。此类列通常为字符串值，但受限于子类的名称之一。如果\
  \ DBMS 支持枚举，它也可以是枚举值。我们使用名称 `category` 作为判别列，在我们的 `Book` 类层级结构示例中，由于教科书和传记的划分是硬性的，它具有冻结值约束（frozen\
  \ value constraint）。\n\n根据书籍的类别，我们必须强制：当且仅当它是“TextBook”时，其属性 `subjectArea` 必须有效；当且仅当它是“Biography”时，其属性\
  \ `about` 必须有值。这种隐含约束表示在上方类图中附着在 `Book` 表类上的不变性框（invariant box）中，其中逻辑运算符关键字 `IFF`\
  \ 表示逻辑等价运算符 `if and only if`（当且仅当）。它需要在数据库中实现，例如使用 SQL 表的 `CHECK` 子句或 SQL 触发器。\n\
  \n当给划分是不交的时，使用单值枚举属性 `category` 来表示实例所属的子类信息。否则，如果是非交的，则使用多值枚举属性 `categories` 来表示实例所属的子类信息。此类属性可以在\
  \ SQL 中实现，通过定义一个字符串列来表示一组枚举代码或标签，并以相应的字符串连接表示。\n\n考虑上方 图 12.8 所示的类层级结构。在子类 `Employee`、`Manager`\
  \ 和 `Author` 中仅定义了三个额外属性，该类层级结构可以再次使用 STI 方法映射，如下方的 SQL 表模型 图 12.10 所示。\n\n![](img/b_9783110500325-012_fig_010.png)\n\
  \n图 12.10：表示 Person 角色层级的 STI 表模型。\n\n注意，现在判别列 `categories` 是多值的，因为 `Person` 的划分不是交的而是重叠的，这意味着\
  \ `Person` 对象可能属于多个类别。同样注意，由于角色划分（如 `Employee`、`Manager`、`Author`）不是硬性的，判别列 `categories`\
  \ 没有冻结值约束。\n\n该模型的一个允许种群示例如下：\n\n| people |\n| --- |\n| person_id | name | categories\
  \ | biography | emp_no | department |\n| --- | --- | --- | --- | --- | --- |\n|\
  \ 1001 | Harry Wagner | Author, Employee | Born in Boston, MA, in 1956, … | 21035\
  \ |   |\n| 1002 | Peter Boss | Manager |  | 23107 | Sales |\n| 1003 | Tom Daniels\
  \ |  |  |  |  |\n| 1077 | Immanuel Kant | Author | Immanuel Kant (1724–1804) was\
  \ a German philosopher … |  |  |\n\n注意 `Person` 表包含四种不同类型的人：\n\n1. 一个人，Harry Wagner，他既是作者（带有传记）又是员工（带有员工编号）。\n\
  2. 一个人，Peter Boss，他是一个经理（一种特殊的员工），管理销售部。\n3. 一个人，Tom Daniels，他既不是作者也不是员工。\n4. 一个人，Immanuel\
  \ Kant，他是一个作者（带有传记）。\n\nSTI 方法的**优点**：它能够忠实地表示原始类层级结构中表述的子类型关系；特别是，任何表示子类实例（员工、经理或作者）的行也表示了父类实例（人）。\n\
  \n**缺点**：(1) 在子类之间共同共同点较少的多级类层级结构中，STI 方法无法产生良好的表示。(2) 给定类层级结构在元素（类）方面的结构仅被隐式保留。\n\
  \n### 12.7.4.2 每类表\n\n在更真实的模型中，`Person` 的子类如 图 12.8 所示将有更多属性，因此 STI 方法不再可行。在 TCI\
  \ 方法中，我们得到下方 图 12.11 所示的 SQL 模型。TCI 模型将类层级中的每个具体类表示为一个表，使得每个分段子类都包含继承属性的列，从而重复了父类的列。\n\
  \n![](img/b_9783110500325-012_fig_011.png)\n\n图 12.11：表示 Person 角色层级的 TCI 表模型。\n\
  \n可以通过以下步骤从信息设计模型导出 TCI 表模型：\n\n1. 将所有类中的标准 ID 修饰符 `{id}` 替换为 `{pkey}`以表示标准 ID 是主键。\n\
  2. 将单数（大写）类名（`Person`、`Author` 等）替换为复数小写表名（`people`、`authors` 等），并将驼峰属性名（`personId`\
  \ 和 `empNo`）替换为小写下划线列名（`person_id` 和 `emp_no`）。\n3. 为所有类矩形添加 `«table»` 属性。\n4. 将平台无关的数据类型替换为\
  \ SQL 数据类型。\n5. 删除所有泛化/继承箭头，并将父表（如 `people` 中的 `person_id` 和 `name`）的所有列添加到表中。每个表仅由所表示类的直接实例填充。该模型的一个允许种群示例如下：\n\
  \n| people |\n| --- |\n| personId | name |\n| --- | --- |\n| 1003 | Tom Daniels\
  \ |\n\n| authors |\n| --- |\n| person_id | name | biography |\n| --- | --- | ---\
  \ |\n| 1001 | Harry Wagner | Born in Boston, MA, in 1956, … |\n| 1077 | Immanuel\
  \ Kant | Immanuel Kant (1724–1804) was a German philosopher … |\n\n| employees |\n\
  | --- |\n| person_id | name | emp_no |\n| --- | --- | --- |\n| 1001 | Harry Wagner\
  \ | 21035 |\n\n| managers |\n| --- |\n| person_id | name | emp_no | department |\n\
  | --- | --- | --- | --- |\n| 1002 | Peter Boss | 23107 | Sales |\n\n\n\n\n\n## TCI\
  \ 方法的**优点**：\n\n(1) 显式保留了给定类层级结构在元素（类）方面的结构。(2) 当给定的类层级结构的分段是互不相交时，TCI 能够实现内存高效的非冗余存储。\n\
  \n**缺点**：(1) TCI 方法无法对原始类层级结构中表达的子类型关系提供忠实的表示。特别是，对于任何表示子类实例（员工、经理或作者）的行，没有信息表明它代表一个父类实例（人员）。因此，TCI\
  \ 数据库模式无法提供有关所表示的子类型关系的信息；相反，这些保存在应用程序类模型中的元数据与数据库是解耦的。(2) TCI 方法需要重复定义列定义，这构成了模式冗余的一种形式。(3)\
  \ 每当分段子类发生重叠时，TCI 方法可能会导致数据冗余。在我们的示例中，作者也可以是员工，因此对于重叠部分的任何人员，我们需要对代表父类属性的所有列进行数据存储重复（在我们的示例中，这仅涉及属性名称）。\n\
  \n### 12.7.4.3 贯表继承 (Joined Tables Inheritance)\n\n为了避免分段重叠情况下 TCI 的数据冗余问题，我们可以采用\
  \ JTI 方法，如下所示图 12.12 所示的 SQL 表模型示例。该模型通过将子类的主键列（列）同时定义为引用其父表主键的外键，将表示子类（*子表*）的表与表示其父类（*父表*）的表连接起来。请注意，外键以带有\
  \ «fkey»刻字样的 UML 依赖箭头的形式可视化，并在其源表侧标注外键列的名称。\n\n![](img/b_9783110500325-012_fig_012.png)\n\
  \n图 12.12：表示人员角色层级的 JTI 表模型。\n\n该模型的一个可接受的人口示例如下：\n\n| people |\n| --- |\n| person_id\
  \ | name |\n| --- | --- |\n| 1001 | Harry Wagner |\n| 1002 | Peter Boss |\n| 1003\
  \ | Tom Daniels |\n| 1077 | Immanuel Kant |\n\n| authors |\n| --- |\n| person_id\
  \ | biography |\n| --- | --- |\n| 1001 | Born in Boston, MA, in 1956, … |\n| 1077\
  \ | Immanuel Kant (1724–1804) was a German philosopher … |\n\n| employees |\n| ---\
  \ |\n| person_id | emp_no | | | | |\n| --- | --- | --- | --- | |\n| 1001 | 21035\
  \ | | | | |\n| 1002 | 23107 | | | | |\n\n| managers |\n| --- |\n| person_id | department\
  \ | | | | |\n| --- | --- | --- | --- | |\n| 1002 | Sales | | | | |\n\nJTI 方法的**优点**：(1)\
  \ 子类型关系和类层级结构被显式保留。(2) 避免了分段重叠情况下的数据冗余。\n\n**缺点**：(1) JTI 方法的主要缺点是，查询子类时需要进行*连接查询*（用于连接分离的实体数据），这可能会产生性能问题。\n\
  \n### 12.8 测验题\n\n如果您想查找以下测试题的答案，可以查看我们的讨论论坛。如果您在论坛中没有找到答案，可以创建一个帖子来询问某个特定问题的答案。\n\
  \n#### 12.8.1 问题 1：关于类层级的陈述\n\n考虑以下类模型：\n\n![](img/b_9783110500325-012_ingr_001.png)\n\
  \n以下哪些说法是正确的？请选择一个或多个：\n\n1. □ `Cde` 的所有实例属性 `a1` 都有一个值。\n2. □ `Cde` 的标准标识符是 `a1`。\n\
  3. □ `Cde` 的所有实例都可能有一个指向类型为 `Bcd` 对象的对象引用 `ab`。\n4. □ `Abc` 的直接实例属性 `c` 可能有一个值。\n\
  5. □ 对于任何类型为 `Abc` 的对象，`a3` 的值必须大于 `a2` 的值。\n6. □ 对于任何类型为 `Cde` 的对象，`a3` 的值必须大于\
  \ `a2` 的值。\n7. □ `Cde` 的标准标识符是 `c`。\n\n#### 12.8.2 问题 2：类层级合并\n\n考虑以下类模型：\n\n![](img/b_9783110500325-012_ingr_002.png)\n\
  \n在这样的简单类层级情况下，我们可以使用*类层级合并*（Class Hierarchy Merge）设计模式，将整个类层级合并到单个类中。以下哪些模型描述了针对给定\
  \ `Abc` 类层级实现类层级合并设计模式的正确方式？请选择一个：\n\n1. O ![](img/b_9783110500325-012_ingr_003.png)\n\
  2. O ![](img/b_9783110500325-012_ingr_004.png)\n3. O ![](img/b_9783110500325-012_ingr_005.png)\n\
  4. O ![](img/b_9783110500325-012_ingr_006.png)\n\n## 13 使用纯 JS 实现子类型\n\n在本章中，我们首先介绍基于构造函数的子类型通用方法，介绍基于信息模型的案例。\n\
  \n在第一个案例中，我们考虑图 12.12 所示的单层类层级，它是完整的。我们使用*类层级合并*设计模式将该层级重构为单个类。\n\n在第二个案例中，我们考虑由人员角色组成的图\
  \ 12.12 所示的多层类层级。人员分为员工和作者的分段没有任何约束，这意味着它是完整的、重叠的非刚性的。我们使用*类层级合并*设计模式重构经理-员工子层级，并使用*贯表继承*方法将员工-作者-人员类层级映射到一组通过外键关联的数据库表。\n\
  \n在两个案例中，我们都展示了：\n\n1. 如何从信息模型导出 JS 类模型和相应的实体模型，\n2. 如何编写 JS 模型类，\n3. 如何基于模型编写视图和控制器代码。\n\
  \n### 13.1 基于构造函数的类的子类型\n\n在 2015 版本之前，JavaScript 还没有显式的类概念，也不直接支持子类型，因此必须借助提供两种继承机制的代码模式来实现：(1)\
  \ 属性继承和 (2) 方法继承。\n\n正如我们在第一卷第 1 章中解释过的那样，类可以通过两种替代方式定义：***基于构造函数的***和***基于工厂的***。两种方法都有各自实现继承的方式。\n\
  \n我们通过以下示例总结了 ES2015 定义父类和子类的基于构造的代码模式：\n\n![](img/b_9783110500325-013_ingr_001.png)\n\
  \n首先，我们定义一个基类 `Person`，带有带有 getter 和 setter 的两个属性 `firstName` 和 `lastName`：\n\n\
  ```\nclass Person {\n    constructor ({first, last}) {\n        // 通过调用 setter 分属性\n\
  \        this.firstName = first;\n        this.lastName = last;\n    }\n    get\
  \ firstName () {return this._firstName;}\n    set firstName ( f) {\n        … //\
  \ 检查约束\n        this._firstName = f;\n    }\n    get lastName () {return this._lastName;}\n\
  \    set lastName ( l) {\n        … // 检查约束\n        this._lastName = l;\n    }\n\
  }\n```\n\n然后，我们定义一个子类 `Student`，它有一个额外的属性 `studNo`：\n\n\n\n\n\n```javascript\n class\
  \ Student extends Person {\n    constructor ({first, last, studNo}) {\n        //\
  \ 调用父类的构造函数\n        super({first, last});\n        // 分配额外的属性\n        this.studNo\
  \ = studNo;\n     }\n     get studNo () {return this._studNo;}\n     set studNo\
  \ ( sn) {\n         … // 检查约束\n        this._studNo = sn;\n     }\n}\n```\n\n注意父类的构造函数是如何调用的：通过\
  \ `super({first, last})`。\n\n## 13.2 案例研究 1：消除类层次\n\n简单的类层次可以通过应用“类层次合并”（Class Hierarchy\
  \ Merge）设计模式来消除。我们案例研究的起点是图 12.1 信息设计模型所示的简单类层次，它代表了将 `Book` 划分为 `TextBook` 和 `Biography`\
  \ 的不相交（但不完全）的刚性划分。我们首先通过应用“类层次合并”设计模式对该模型进行简化，得到了以下模型：\n\n![](img/b_9783110500325-013_ingr_002.png)\n\
  \n我们现在可以从这个设计模型推导出一个 `JS class model`。\n\n### 13.2.1 构建 JS 类模型\n\n我们通过 3 个步骤构建 JS\
  \ 类模型：\n\n1.  将平台无关的数据类型（用作属性和参数的范围）替换为 JS 数据类型。这包括枚举值属性的情况，例如 `category`，它会被转换为数值型属性，并限制在底层枚举类型的枚举整数范围内。\n\
  \n2.  为所有属性装饰一个 «get/set» 构型（stereotype），以指示它们具有隐式的 getter 和 setter。\n\n3.  添加属性\
  \ `check` 函数，如卷 1 第 8 章中描述的。根据其隐含的语义，`checkCategory` 函数以及对分段属性（segment properties）的检查需要特殊的考虑。特别是，分段属性的\
  \ `check` 函数必须确保只有当 `category` 属性具有代表相应分段的值时，才能赋值该属性。我们将在下面讨论如何编写 JS 类模型时，更详细地解释这种隐含的验证语义。\n\
  \n这导致了所示图 13.1 中的 JS 类模型，其中类级（“静态”）方法带有下划线：\n\n![](img/b_9783110500325-013_fig_001.png)\n\
  \n图 13.1：合并后的 `Book` 类层次的 JS 类模型。\n\n### 13.2.2 新问题\n\n与卷 1 第 11 章讨论的枚举应用相比，我们必须处理许多新问题：\n\
  \n1.  在 `model code` 中，我们需要处理：\n\n    1.  向 `errorTypes.js` 添加约束违例类 `FrozenValueConstraintViolation`。\n\
  \    2.  编码用于 `category` 属性范围的枚举类型（在我们的示例中为 `BookCategoryEL`）。\n    3.  为 `category`\
  \ 属性编码 `checkCategory` 函数。在我们的示例中，该属性是可选的（`optional*`），这是因为 `Book` 划分是不完全的（`incomplete*`）。如果应用“类层次合并”模式的划分是完全的，那么\
  \ `category` 属性就是强制的（`mandatory*`）。\n    4.  为所有分段属性编码 `check` 函数，使其能够接受 `category`\
  \ 作为第二个参数，以便测试所涉及的分段属性是否适用于给定的实例。\n    5.  通过细化序列化函数 `toString()`，添加一个类别分支判断（`switch`）语句，以仅序列化适用于给定\
  \ `category` 的分段属性。\n    6.  在 `Book.update` 中为 `category` 属性实现“冻值约束”（Frozen Value\
  \ Constraint），仅在书籍的 `category` 尚未定义时才更新它。这意味着一旦它被定义，就不能再被更新。\n\n2.  在 `UI code`\
  \ 中，我们需要处理：\n\n    1.  在 `books.html` 的“列出所有书籍”用例的显示表中添加一个“特殊类型”（或“类别”）列。没有特殊类别的书籍，其表格单元格将为空，而对于所有其他书籍，它们的\
  \ `category` 将显示在该单元格中，并带有其他特定分段的属性值。这需要在 `books.js` 视图代码文件的 `pl.v.books.retrieveAndListAll.setupUserInterface`\
  \ 中编写相应的 `switch` 语句。\n    2.  在 `books.html` 的“创建书籍”和“更新书籍”用例的表单中，为所有分段属性添加“特殊类型”选择控件（通常是选择列表）以及相应的表单字段。分段属性字段只有在选择了相应的书籍\
  \ `category` 时才会显示。这种在特定条件下渲染特定表单字段的方法被称为“动态表单”（dynamic forms）。\n\n### 13.2.3 编写\
  \ JS 类模型的模型类\n\n可以直接对 JS 类模型进行编码，以获取 JS 前端应用模型类的代码。\n\n#### 13.2.3.1 总结\n\n1.  如卷\
  \ 1 第 11 章所述，借助元类 `Enumeration` 编码枚举类型 `BookCategoryEL`，用作 `category` 属性的范围。\n2.\
  \  以 JS 类定义的形式编写 `Book` 模型类，带有 `get` 和 `set` 方法以及静态 `check` 函数。\n\n#### 13.2.3.2\
  \ 编码枚举类型 BookCategoryEL\n\n枚举类型 `BookCategoryEL` 通过元类 `Enumeration` 在 `Book.js`\
  \ 模型文件的开头编码：\n\n```javascript\nBookCategoryEL = new Enumeration([\"Textbook\", \"\
  Biography\"]);\n```\n\n#### 13.2.3.3 编写模型类\n\n以 JS 类定义的形式编写 `Book` 模型类，带有 `get`\
  \ 和 `set` 方法以及所有属性的静态 `check` 函数：\n\n```javascript\nclass Book {\n     constructor\
  \ ({isbn, title, year, category, subjectArea, about}) {\n         this.isbn = isbn;\n\
  \         this.title = title;\n         this.year = year;\n         // 可的\n    \
  \     if (category) this.category = category;\n         if (subjectArea) this.subjectArea\
  \ = subjectArea;\n         if (about) this.about = about;\n     }\n     get isbn()\
  \ {…}\n     static checkIsbn(isbn) {…}\n     static checkIsbnAsId(isbn) {…}\n  \
  \   set isbn(isbn) {…}\n     get title() {…}\n     static checkTitle(t) {…}\n  \
  \   set title(t) {…}\n     get year() {…}\n     static checkYear(y) {…}\n     set\
  \ year(y) {…}\n     get category() {…}\n     static checkCategory(c) {…}\n     set\
  \ category(c) {…}\n     get subjectArea() {…}\n     static checkSubjectArea(sA,\
  \ cat) {…}\n     set subjectArea(s) {…}\n     get about() {…}\n     static checkAbout(a,\
  \ cat) {…}\n     set about(a) {…}\n}\n```\n\n注意构造函数使用 ES2015 的参数解构定义了一个单个记录参数。我们以以下方式为\
  \ `category` 属性编写 `checkCategory` 和 `setCategory` 方法：\n\n```javascript\n static\
  \ checkCategory(c) {\n     if (c === undefined || c === \"\") {\n         return\
  \ new NoConstraintViolation(); // category 是可选\n     } else if (!util.isIntegerOrIntegerString(c)\
  \ || parseInt(c) < 1 ||\n             parseInt(c) > BookCategoryEL.MAX) {\n    \
  \     return new RangeConstraintViolation(\"Invalid value for category: \"+ c);\n\
  \     } else {\n         return new NoConstraintViolation();\n     }\n };\nset category(c)\
  \ {\n     var validationResult = null;\n     if (this.category) {  // 已设置/赋值\n \
  \        validationResult = new FrozenValueConstraintViolation(\"The category cannot\
  \ be changed!\");\n     } else {\n        validationResult = Book.checkCategory(c);\n\
  \     }\n     if (validationResult instanceof NoConstraintViolation) {\n       \
  \   this._category = parseInt(c);\n     } else {\n        throw validationResult;\n\
  \     }\n }\n```\n\n\n\n\n虽然分段属性（在本例中：`subjectArea` 和 `about`）的 getter 方法遵循标准模式，但它们的检查逻辑和\
  \ setter 方法必须确保该属性适用于正在检查的实例的类别。这是通过检查属性值和类别的组合来实现的，如下所示：\n\n```\n static checkSubjectArea(\
  \ sA, c) {\n     if (c === BookCategoryEL.TEXTBOOK && !sA) {\n        return new\
  \ MandatoryValueConstraintViolation(\n                \"A subject area must be provided\
  \ for a textbook!\");\n      } else if (c !== BookCategoryEL.TEXTBOOK && sA) {\n\
  \         return new ConstraintViolation(\"A subject area must not \" +\n      \
  \          \"be provided if the book is not a textbook!\");\n      } else if (sA\
  \ && (typeof(sA) !== \"string\" || sA.trim() === \"\")) {\n         return new RangeConstraintViolation(\n\
  \                \"The subject area must be a non-empty string!\");\n      } else\
  \ {\n         return new NoConstraintViolation();\n      }\n}\n```\n\n在序列化函数 `toString()`\
  \ 中，我们在 `switch` 语句中序列化类别属性和分段属性：\n\n```\n toString() {\n     var bookStr = \"Book{\
  \ ISBN:\"+ this.isbn +\", title:\"+\n             this.title +\", year:\"+ this.year;\n\
  \     switch (this.category) {\n     case BookCategoryEL.TEXTBOOK:\n          bookStr\
  \ += \", textbook subject area:\"+ this.subjectArea;\n          break;\n     case\
  \ BookCategoryEL.BIOGRAPHY:\n          bookStr += \", biography about: \"+ this.about;\n\
  \          break;\n     }\n     return bookStr + \"}\";\n};\n```\n\n在模型类的 `update`\
  \ 方法中，我们只在属性需要更新时才设置它，即如果存在对应的参数槽且其值与旧属性值不同。对于具有`冻结值约束`（Frozen Value Constraint）的类别属性的特殊情况，我们需要确保只有在它尚未赋值时，才能连同相关的\
  \ set 分段属性一起更新。因此，在 `Book.update` 方法中，我们对 `book.category === undefined` 进行特殊测试以处理初始赋值的特殊情况，而以更标准的方式处理分段属性\
  \ `subjectArea` 和 `about` 的更新：\n\n```\n Book.update = function ({isbn, title, year,\n\
  \         category, subjectArea, about}) {\n     const book = Book.instances[isbn],\n\
  \             objectBeforeUpdate = util.cloneObject( book);\n     var noConstraintViolated=true,\
  \ updatedProperties=[];\n     try {\n            …\n            if (category &&\
  \ book.category !== category) {\n               book.category = category;\n    \
  \           updatedProperties.push(\"category\");\n            } else if (category\
  \ === \"\" && \"category\" in book) {\n               throw FrozenValueConstraintViolation(\n\
  \                       \"The book category cannot be unset!\");\n            }\n\
  \            if (subjectArea && book.subjectArea !== subjectArea) {\n          \
  \      book.subjectArea = subjectArea;\n                updatedProperties.push(\"\
  subjectArea\");\n            }\n            if (about && book.about !== about) {\n\
  \                book.about = about;\n                 updatedProperties.push(\"\
  about\");\n             }\n      } catch (e) {\n                 …\n      }\n  \
  \    …\n};\n```\n\n### 13.2.4 编写视图和控制器代码\n\n应用程序的用户界面（UI）包含一个启动页面，允许导航到数据管理页面（在本例中，到\
  \ `books.html`）。此类数据管理页面包含 5 部分：`管理书籍`、`列出并检索所有书籍`、`创建书籍`、`更新书籍`和`删除书籍`，一次只有一个部分显示（通过为其他部分设置\
  \ CSS 属性 `display:none`）。\n\n#### 13.2.4.1 总结\n\n我们需要在“检索并列出所有书籍”用例以及“创建书籍”和“更新书籍”用例中处理类别属性和分段属性\
  \ `subjectArea` 和 `about`，方法如下：\n\n1. 在 `books.html` 的“检索并列出所有书籍”用例的显示表格中添加分段信息列（标题为“Category”）。\n\
  2. 在 `books.html` 的“创建书籍”和“更新书籍”用例的表单中添加“Category”选择字段以及所有分段属性的输入字段。分段属性的表单字段仅在选择了相应的书籍类别时才显示。\n\
  \n#### 13.2.4.2 在检索/列出所有中添加分段信息列\n\n我们在 `books.html` 的“列出所有书籍”用例的显示表中添加了一个“Special\
  \ type”列：\n\n```\n <table id=\"books\">\n  <thead><tr><th>ISBN</th><th>Title</th><th>Year</th><th>Category</th>\n\
  </tr></thead>\n  <tbody><tbody>>></</</tbody>>\n</table>\n```\n\n没有特殊类别的书籍在该列中将显示一个空单元格，而对于所有其他书籍，其类别将在该列中显示，以及其他类别特定的信息。这需要在\
  \ `view/books.js` 文件的 `pl.v.books.retrieveAndListAll.setupUserInterface` 中编写相应的\
  \ `switch` 语句：\n\n```\n if (book.category) {\n    switch (book.category) {\n   \
  \ case BookCategoryEL.TEXTBOOK:\n         row.insertCell(-1).textContent = book.subjectArea\
  \ + \" textbook\";\n         break;\n    case BookCategoryEL.BIOGRAPHY:\n      \
  \   row.insertCell(-1).textContent = \"Biography about \"+ book.about;\n       \
  \  break;\n    }\n}\n```\n\n#### 13.2.4.3 在创建和更新中添加类别选择字段\n\n在两个用例中，我们都需要允许通过选择字段选择特殊的书籍类别（“教科书”或“传记”），如下\
  \ HTML 片段所示：\n\n```\n <div class=\"field\">\n<label>Category: <select name=\"category\"\
  ></select></label>\n</div>\n<div class=\"field Textbook\"><!-- 条件显示字段 -->\n<label>Subject\
  \ area: <input type=\"text\" name=\"subjectArea\" /></label>\n</div>\n<div class=\"\
  field Biography\"><!-- 条件显示字段 -->\n<label>About: <input type=\"text\" name=\"about\"\
  \ /></label>\n</div>\n```\n\n注意，我们向分段字段容器的 `class` 属性中添加了“Textbook”和“Biography”作为额外值。这支持根据类别属性的值渲染和取消渲染“Textbook”和“Biography”表单字段。\n\
  \n在 `handleCategoryChangeEvent`处理器中，只有当选择了相应的书籍类别时，才会通过 `pl.v.app.displaySegmentFields`\
  \ 显示分段属性表单字段：\n\n```\n pl.v.books.handleCategoryChangeEvent = function (e) {\n \
  \   var formEl = e.currentTarget.form,\n           categoryIndexStr = formEl.category.value;\n\
  \    if (categoryIndexStr) {\n         pl.v.app.displaySegmentFields(formEl, BookCategoryEL.labels,\n\
  \                  parseInt( categoryIndexStr) + 1);\n    } else {\n       pl.v.app.undisplayAllSegmentFields(formEl,\
  \ BookCategoryEL.labels);\n    }\n};\n```\n\n记得类别选择列表包含一个返回空字符串的无选择选项“–––”，以及一个由\
  \ `BookCategoryEL.labels` 枚举标签组成的选项列表，其值为相应的数组索引（从 0 开始）的字符串。因此，变量 `categoryIndexStr`\
  \ 的值为“”（空字符串）或“0”、“1”、“2”等之一。\n\n### 13.3 案例研究 2：实现类层次结构\n\n当类层次结构变得复杂时，我们不能简单地消除它，而必须在(1)应用程序的模型代码中、(2)底层数据库以及(3)用户界面中实现它。\n\
  \n本案例研究的起点是上图图 12.8 所示的设计模型。在接下来的章节中，我们从设计模型中推导出*JS 类模型*和*JS 实体表模型*。实体表模型被用于通过浏览器的\
  \ Local Storage 技术存储应用程序对象时，所需的对象到存储映射的设计。\n\n#### 13.3.1 制作 JS 类模型\n\n\n\n\n我们借助\
  \ `JS class model` 来设计示例应用的 `model classes`，该模型是从 `design model` 派生而来的，本质上是保留了泛化箭头，并为每个类添加了\
  \ `get/set` 方法和静态 `check` 函数。然而，在我们的示例应用中，自然的方法是将 `Class Hierarchy Merge` 设计模式（在第\
  \ 12.6 节中讨论）应用于 `Employee` 的单子类类分段，通过消除 `Manager` 子类来简化类模型。这导致了下方图 13.2 所示的模型。请注意，`Person`\
  \ 可能是 `Employee`、`Author` 或两者兼有。\n\n![](img/b_9783110500325-013_fig_002.png)\n\n\
  图 13.2：Person 角色类层次结构的 JS 类模型。\n\n### 13.3.2 创建 JS 实体表模型\n\n由于我们使用浏览器的 `Local Storage`\
  \ 作为示例应用的持久化存储技术，我们必须处理简单的键值存储。对于每个具有单数（大写开头）名称 `Entity` 的设计模型类，我们使用其复数小写名称 `entities`\
  \ 作为对应的表名和键，以便通过 `JSON.stringify` 方法对对象集合 `Entity.instances` 进行序列化来获取其字符串值。\n\n\
  我们以 `JS entity table model` 的形式设计了一系列合适的 JS 实体表，该模型是从信息设计模型派生的。我们必须对如何组织数据存储以及如何导出相应的实体表模型做出某些选择。\n\
  \n第一个选择涉及使用`单表继承` `(STI)`、`类表继承` `(TCI)` 或 `连接表继承` `(JTI)` 方法，这些方法在第 12.7.4 节中介绍。在\
  \ `STI` 方法中，一个分段（或整个类层次结构）由单个表表示，包含所有涉及类的所有属性的列，如图 13.3 中的示例模型所示。\n\n![](img/b_9783110500325-013_fig_003.png)\n\
  \n图 13.3：Person 角色类层次结构的 STI 模型。\n\n由于给定的分段不是不交的，因此使用多值枚举属性类别来表示实例属于哪些子类的信息。\n\n\
  对于给定的示例，使用 `STI` 方法是可行的，因为角色层次结构层级不多，且分段子类没有添加很多属性。但在更真实的示例中，给定角色层次结构的分段子类会有非常多的属性。`STI`\
  \ 方法并不是表示多级角色层次结构的理想选择。然而，我们可以选择它来表示单分段类层次结构 `Manager-is-subclass-of-Employee`。\n\
  \n为了简单起见，并且因为浏览器的 `Local Storage` 不支持 `JTI` 需要的外键，我们选择了 `TCI` 方法，即为 `Person` 分段的每个类获取一个单独的表，但不包含外键。我们的选择导致了下方图\
  \ 13.4 所示的模型，该模型是由图 12.8 所示的设计模型派生而来的：\n\n1. 根据第 12.6 节描述的 `Class Hierarchy Merge`\
  \ 设计模式，将 `Manager` 子类合并到其父类 `Employee` 中。\n2. 将 `Person`、`Author` 和 `Employee` 的\
  \ `personId` 属性的标准 ID 修饰符 `{id}` 替换为 `{pkey}`，以指示该属性是`主键`。\n3. 将单数（大写）类名（`Person`、`Author`\
  \ 和 `Employee`）替换为复数小写表名（`people`、`authors` 和 `employees`）。\n4. 为所有类矩形（people, authors\
  \ and employees）添加«JS entity table»原型。\n5. 将平台无关的数据类型名称替换为 JS 数据类型名称。\n6. 移除所有泛化/继承箭头，并将父表（`personId`\
  \ 和 `name`）的所有属性添加到其子表（`authors` 和 `employees`）中。\n\n![](img/b_9783110500325-013_fig_004.png)\n\
  \n图 13.4：Person 角色类层次结构的 TCI 模型。\n\n在使用 `JTI` 方法的情况下，除了上述步骤 1-5 外，我们还会：\n\n1. 将根表（`people`）的主键列（`personId`）复制到所有子表（`authors`\
  \ 和 `employees`）中。\n2. 将泛化箭头替换为带有«fkey»原型的依赖箭头（表示`外键依赖`），这些箭头在源端标注了子表的主键名称（此处：`personId`）。\n\
  \n### 13.3.3 新问题\n\n与上方第一个案例研究的模型（图 13.1 所示相比，我们必须在 `model code` 中处理许多新问题：\n\n1.\
  \ 使用第 13.1 节中讨论的 JS 关键字 `extends` 定义 `Employee` 与 `Person` 之间以及 `Author` 与 `Person`\
  \ 之间的子类关系。\n2. 从持久化存储加载根类实例（`Person.instances`）时（在 `Person.retrieveAll` 中），我们加载\
  \ (1) 代表根类的表（`people`）的记录以创建其直接实例，以及 (2) 代表所有其他子类的表（`authors` 和 `employees`）的记录以创建它们的直接实例，同时将它们的对象引用添加到根类集合中（即\
  \ `Person.instances`）。通过这样，根类集合不仅包含直接实例，还包含所有实例。\n3. 在 `Employee.saveAll` 和 `Author.saveAll`\
  \ 中（在 `pl.v.employees.manage.exit` 和 `pl.v.authors.manage.exit` 中调用）将 `Employee`\
  \ 和 `Author` 的实例作为 JS 实体表 `employees` 和 `authors` 的记录保存到持久化存储时，我们还将 `Person` 的直接实例保存为\
  \ `people` 表的记录。\n\n### 13.3.4 编写 JS 类模型的模型类代码\n\n上方图 13.2 所示的 JS 类模型可以直接进行编码，以获取模型类\
  \ `Person`、`Employee` 和 `Author` 的代码以及枚举类型 `EmployeeCategoryEL` 的代码。\n\n#### 13.3.4.1\
  \ 定义子类关系\n\n我们使用 `extends` 定义 `Employee` 与 `Person` 之间以及 `Author` 与 `Person` 之间的子类关系。例如，在\
  \ `m/Employee.js` 中我们定义：\n\n```js\n EmployeeCategoryEL =  new Enumeration([\"Manager\"\
  ]);\nclass Employee extends Person {\n     constructor ({personId, name, empNo,\
  \ category, department}) {\n         super({personId, name});\n         this.empNo\
  \ = empNo;\n         if (category) this.category = category;\n         if (department)\
  \ this.department = department;\n      }\n      …\n}\n```\n\n\n\n\n```\n Person.retrieveAll\
  \ = function () {\n      var people={}, employees={}, authors={};\n      if (!localStorage[\"\
  authors\"]) localStorage[\"authors\"] = \"{}\";\n      if (!localStorage[\"employees\"\
  ]) localStorage[\"employees\"] = \"{}\";\n      if (!localStorage[\"people\"]) localStorage[\"\
  people\"] = \"{}\";\n      try {\n           people = JSON.parse( localStorage[\"\
  people\"]);\n           employees = JSON.parse( localStorage[\"employees\"]);\n\
  \           authors = JSON.parse( localStorage[\"authors\"]);\n      } catch (e)\
  \ {\n           console.log(\"Error when reading from Local Storage\\n\" + e);\n\
  \      }\n      for (let key of Object.keys( authors)) {\n           try { // convert\
  \ record to (typed) object\n            Author.instances[key] = new Author( authors[key]);\n\
  \            // create superclass extension\n            Person.instances[key] =\
  \ Author.instances[key];\n       } catch (e) {\n       console.log(`${e.constructor.name}\
  \ while deserializing` +\n                 `author ${key}: ${e.message}`);\n   \
  \     }\n     }\n      …\n}\n```\n\n`authors` 表中的每条记录都会检索并转换为 `Author` 对象，其引用被复制到\
  \ `Person.instances` 中。同样，`employees` 表的记录也通过这种方式处理，而 `people` 表的记录则简单地检索并转换为 `Person`\
  \ 对象：\n\n```\n Person.retrieveAll = function () {\n     …\n    for (let key of Object.keys(\
  \ employees)) {\n         …\n    }\n    for (let key of Object.keys( people)) {\n\
  \        try { // convert record to (typed) object\n          Person.instances[key]\
  \ = new Person( people[key]);\n        } catch (e) {\n          console.log(`${e.constructor.name}\
  \ while deserializing` +\n                `author ${key}: ${e.message}`);\n    \
  \    }\n    }\n}\n```\n\n### 13.3.4.3 在保存子表时保存超表\n\n由于应用的数据在运行期间一直保存在主内存中（只要应用的网页页在浏览器中处于打开状态），因此在应用退出时（例如通过关闭浏览器标签页），数据必须保存到持久化存储中。在\
  \ `pl.v.employees.manage.exit` 和 `pl.v.authors.manage.exit` 中将 `Employee` 和 `Author`\
  \ 实例（作为 JS 实体表 `employees` 和 `authors` 的记录）保存到持久化存储时，我们也保存了 `Person` 的直接实例（作为 `people`\
  \ 表的记录）。这是必要的，因为对 `Employee` 或 `Author` 实例的变化可能意味着 `Person.instances` 的变化。\n\n例如，对于\
  \ `Employee` 数据管理，我们在 `v/employees.js` 中定义了：\n\n```\n pl.v.employees.manage = {\n\
  \      …\n      exit: function () {\n          Employee.saveAll();\n          Person.saveAll\
  \ ();\n        },\n        …\n}\n```\n\n# 14 Java EE 中的子类型\n\n在本章中，我们将基于运行示例—— *Public\
  \ Library* 应用的信息模型片段，解释两个案例研究。在第一个案例研究中，我们考虑了图 12.1 所示的以 `Book` 为根的单级类层次结构，这是一个不完全的不相交划分。我们使用*单表继承*（Single\
  \ Table Inheritance）方法将此类层次结构映射到单个数据库。\n\n在第二个案例研究中，我们考虑了图 12.8 所示的由 `Person` 角色\
  \ `Manager` 和 `Author` 组成的多级类层次结构。我们使用*连接表继承*（Joined Table Inheritance）方法将此类层次结构映射一组通过外键依赖相关的数据库表。\n\
  \n在这两种情况下，我们展示了：\n\n1. 如何推导出 Java 实体模型，\n2. 如何以 Java 实体类的形式编写 Java 实体模型，\n3. 如何编写视图和控制器代码。\n\
  \n## 14.1 Java 中的子类型\n\nJava 通过其 `extends` 关键字提供了对子类型的内置支持，但不支持*多重继承*。考虑以下信息模型：\n\
  \n![](img/b_97831050325-014_ing_001.png)\n\n首先，我们定义超类 `Person`。然后，我们定义子类 `Student`并通过\
  \ `extends` 关键字定义它与 `Person` 的子类型关系：\n\n```\n public class Person {\n    private\
  \ String firstName;\n    private String lastName;\n}\npublic class Student extends\
  \ Person {\n    private int studentNo;\n  public Student( String first, String last,\
  \ int studNo) {\n      super(firstName, lastName);\n      this.setStudNo(studNo);\n\
  \  }\n```\n\n注意在 `Student` 类中，我们定义了一个带有创建 `Student` 实例所需的所有参数的构造函数。在子类构造函数中，我们使用\
  \ `super` 调用超类 `Person` 的构造函数。\n\n## 14.2 案例研究 1：使用单表继承实现类层次结构\n\n在本例中，我们实现了图 12.1\
  \ 所示的层次结构。Java 实体类模型是从此设计出的。\n\n### 14.2.1 构建 Java 实体模型\n\n回，我们通过以下步骤从 OO 类模型获取\
  \ Java 实体类：(1) 将所有属性设私有，(2) 使用 Java 数据类型类，(3) 添加公共 getter 和 setter，(4) 添加 `toString`\
  \ 函数，(5) 添加（静态）数据存储方法 `create`、`retrieve`、`delete`，从而得到图 14.1 所示的模型。\n\n![](img/b_97831050325-014_fig_001.png)\n\
  \n图 14.1：Book 层次结构的 Java 实体类模型。\n\n### 14.2.2 新问题\n\n我们必须处理许多新问题：\n\n1. 在*模型代码*中我们必须处理：\n\
  \    - 编写枚举类型 `BookCategoryEL`，该类型用于 UI 代码以创建一个选择列表，允许选择书籍类别。\n    - 使用适当的 JPA 注解编写\
  \ `Book` 类层次结构中的每个类，以便持久化存储在相应的数据库表（如 `books`）中。\n2. 在*UI 代码*中我们必须处理：\n    - 在 `WebContent/views/books/`\
  \ 文件夹下的 `retrieveAndListAll.xhtml` 的“检索/列出所有书籍”用例的显示表中添加“特殊类型”列。没有特殊类别的书籍表格单元格将为空，而对于所有其他书籍，其类别将显示在此单元格中，并带有特定部分的属性值。\n\
  \    - 在 `WebContent/views/books/` 文件夹下的 `create.xhtml` 和 `update.xhtml` 的“创建书籍”和“更新书籍”用例表单中添加“特殊类型”选择控件以及所有部分属性的表单字段。只有选择了相应的书籍类别，才会显示部分属性表单并对其进行验证。这种根据特定条件渲染特定表单的方法有时*动态表单*（dynamic\
  \ forms）。\n\n### 14.2.3 编写 Java 实体类的类\n\n我们可以直接编写 Java 实体类模型以获取 Java EE 后端应用的模型类代码。\n\
  \n#### 14.2.3.1 总结\n\n1. 编写枚举类型（用于 facelets）。\n2. 编写模型类并添加相应的类层次 JPA 注解。\n\n####\
  \ 14.2.3.2 编写枚举类型 `BookCategoryEL`\n\n枚举类型 `BookCategoryEL` 被编写为 Java `enum`，提供了枚举字面量以及（人类可读）标签：\n\
  \n```\n public enum BookCategoryEL {\n    TEXTBOOK(\"TextBook\"), BIOGRAPHY(\"Biography\"\
  );\n    private final String label;\n\n    private BookCategoryEL( String label)\
  \ {\n        this.label = label;\n    }\n    public String getLabel() {return this.label;}\n\
  }\n```\n\n###### 14.2.3.2.1 编写模型类\n\n我们以 Java 实体类的形式使用适当的 JPA 注解编写 `Book`、`TextBook`\
  \ 和 `Biography` 模型类：\n\n\n\n\n\n```\n @Entity @Table( name=\"books\")\n@Inheritance(\
  \ strategy=InheritanceType.SINGLE_TABLE)\n@DiscriminatorColumn( name=\"category\"\
  ,\n       discriminatorType=DiscriminatorType.STRING, length=16)\n@DiscriminatorValue(\
  \ value=\"BOOK\")\n@ManagedBean( name=\"book\") @ViewScoped\npublic class Book {\n\
  \        @Id @Column( length=10)\n        @NotNull( message=\"An ISBN is required!\"\
  )\n        @Pattern( regexp=\"\\\\b\\\\d{9}(\\\\d|X)\\\\b\",\n                 message=\"\
  The ISBN must be a …!\")\n        private String isbn;\n        @Column( nullable=false)\
  \ @NotNull( message=\"A title is required!\")\n        private String title;\n \
  \       @Column( nullable=false) @NotNull( message=\"A year is required!\")\n  \
  \      @UpToNextYear\n          @Min( value=1459, message=\"The year must not be\
  \ before 1459!\")\n          private Integer year;\n          // constructors, set,\
  \ get and other methods\n          …\n}\n```\n\n在类层级结构使用 JPA 单表继承（Single Table Inheritance）技术时，必须为父类设置\
  \ `@Inheritance` 注解（例如我们示例中的 `Book`）。它为 `strategy` 参数提供了 `InheritanceType.SINGLE_TABLE`\
  \ 的值。`@DiscriminatorColumn` 注解指定了用于区分不同子类类型（在我们的示例中 `TextBook` 和 `Biography`）的表列名称。\n\
  \n遗憾的是，我们无法使用 `BookCategoryEL` 枚举来定义区分器列的类型，因为像 `BookCategoryEL.TEXTBOOK.name()`\
  \ 这样的 Java 表达式不是常量，因此会抛出 Java 编译器异常。相反，我们使用 `DiscriminatorType.STRING`。`@DiscriminatorValue`\
  \ 注解指定了一个唯一值，存储在表行的区分器列中，用于表示给定类的实例。\n\n此外，我们定义了子类型 `TextBook` 和 `Biography`：\n\n\
  ```\n @Entity @Table( name=\"textbooks\")\n@DiscriminatorValue( value=\"TEXTBOOK\"\
  )\n@ManagedBean( name=\"textBook\") @ViewScoped\npublic class TextBook extends Book\
  \ {\n      @Column( nullable=false) @NotNull(\n              message=\"A subject\
  \ area value is required\")\n      String subjectArea;\n      // constructors, set,\
  \ get and other methods\n     …\n}\n```\n\n`TextBook` 和 `Biography` 是 `Book` 的子类，因此我们使用\
  \ `extends Book` 来定义它们。对于每个子类，我们添加一个带有来自 `BookCategoryEL` 枚举值的 `@DiscriminatorValue`\
  \ 注解。\n\n### 14.2.4 STI 数据库结构\n\n由于使用了注解\n\n```\n @Inheritance( strategy=InheritanceType.SINGLE_TABLE)\n\
  ```\n\n只有一个数据库表用于表示类层级结构。该表包含了层级结构中所有类的所有属性对应的列，加上区分器列。在我们的示例中，`books` 表包含以下列：`isbn`、`title`、`year`、`subjectArea`、`about`\
  \ 和 `category`。内部用于为应用程序生成 `books` 表的简化对应 SQL-DDL 代码所示：\n\n```\n CREATE TABLE IF\
  \ NOT EXISTS `books` (\n     `ISBN` varchar(10) NOT NULL,\n     `TITLE` varchar(255)\
  \ NOT NULL,\n     `YEAR` int(11) NOT NULL,\n     `SUBJECTAREA` varchar(255) DEFAULT\
  \ NULL,\n     `ABOUT` varchar(255) DEFAULT NULL,\n     `category` varchar(16) DEFAULT\
  \ NULL,\n)\n```\n\n### 14.2.5 编写视图和控制器代码\n\n用户界面（UI）由一个起始页面组成，允许导航到数据管理页面（在我们的示例中，到\
  \ `WebContent/views/books/` 文件夹下的 `index.xhtml`）。此类数据管理页面包含四个部分：*检索/列出所有书籍*、*创建书籍*、*更新书籍*和*删除书籍*。\n\
  \n#### 14.2.5.1 总结\n\n我们需要在“列出所有书籍”用例以及“创建书籍”和“更新书籍”用例中处理类别区分器以及 `subjectArea` 和\
  \ `about` 段属性：\n\n1. 在 `WebContent/views/books/` 文件夹下的 `retrieveAndListAll.xhtml`\
  \ 的*检索/列出所有*用例的显示表中添加一个段信息列（“特殊类型”）。\n2. 在 `WebContent/views/books/` 文件夹下的 `create.xhtml`\
  \ 和 `update.xhtml` 的“创建书籍”和“更新书籍”用例表单中，添加“特殊类型”选择控件以及对应所有段属性的相应表单字段。段属性表单字段仅在选择了相应的书籍类别时才显示并进行验证。\n\
  \n#### 14.2.5.2 在*检索/列出所有*中添加段信息列\n\n我们在 `books.html` 的“列出所有书籍”用例的显示表中添加了“特殊类型”列：\n\
  \n```\n <h:dataTable value=\"#{bookController.books}\" var=\"b\">\n    …\n    <h:column>\n\
  \        <f:facet name=\"header\">Special type</f:facet>\n        #{b.getClass().getSimpleName()\
  \ != 'Book' ?\n              b.getClass().getSimpleName() : ''}\n     </h:column>\n\
  </h:dataTable>\n```\n\n使用一个条件表达式来检查 Java Bean 类名是否为 `Book`，如果是，则不显示它；如果是其他内容（例如\
  \ `TextBook` 或 `Biography`），则显示。该表达式还展示了如何调用各种 Java Bean 方法，而不仅是自定义方法。\n\n#### 14.2.5.3\
  \ 在*创建*和*更新*中添加“特殊类型”选择控件\n\n在两个用例中，我们需要通过面板格元素中的选择控件允许选择书籍类别（`textbook` 或 `biography`）：\n\
  \n```\n <h:panelGrid id=\"bookPanel\" columns=\"3\">\n    …\n    <h:outputText value=\"\
  Special type: \" />\n    <h:selectOneMenu id=\"bookType\" value=\"#{viewScope.bookTypeVal}\"\
  >\n        <f:selectItem itemLabel=\"---\"/>\n        <f:selectItems value=\"#{book.typeItems}\"\
  \ />\n        <f:ajax event=\"change\" execute=\"@this\" render=\"textBookPanel\
  \               biographyPanel standardBookPanel\"/>\n     </h:selectOneMenu>\n\
  \     <h:message for=\"bookType\" />\n```\n\n在在选择控件中引用了三个替代面板组：\n\n1. “standardBookPanel”：\n\
  \n```\n <h:panelGroup id=\"standardBookPanel\">  \n    <h:commandButton value=\"\
  Create\"\n            rendered=\"#{viewScope.bookTypeVal == null}\"\n          \
  \  action=\"#{bookController.create( book.isbn,\n           book.title, book.year)}\"\
  \ />\n</h:panelGroup>\n```\n\n2. “textBookPanel”：\n\n```\n <h:panelGroup id=\"textBookPanel\"\
  >  \n     <h:panelGrid rendered=\"#{viewScope.bookTypeVal == 'TEXTBOOK'}\"\n   \
  \             columns=\"3\">\n          <h:outputText value=\"Subject area: \" />\n\
  \           <h:inputText id=\"subjectArea\" value=\"#{textBook.subjectArea}\"/>\n\
  \            <h:message for=\"subjectArea\" errorClass=\"error\" />\n       </h:panelGrid>\n\
  \        <h:commandButton value=\"Create\"\n                     rendered=\"#{viewScope.bookTypeVal\
  \ == 'TEXTBOOK'}\"\n                      action=\"#{textBookController.create(\
  \ book.isbn, book.title,\n                              book.year, textBook.subjectArea)}\"\
  \ />\n</h:panelGroup>\n```\n\n3. “biographyBookPanel”：\n\n```\n <h:panelGroup id=\"\
  biographyBookPanel\">  \n    <h:panelGrid rendered=\"#{viewScope.bookTypeVal ==\
  \ 'BIOGRAPHY'}\"\n              columns=\"3\">\n        <h:outputText value=\"About:\
  \ \" />\n        <h:inputText id=\"about\" value=\"#{biographyBook.about}\"/>\n\
  \        <h:message for=\"about\" errorClass=\"error\" />\n    </h:panelGrid>\n\
  \    <h:commandButton value=\"Create\"                        rendered=\"#{viewScope.bookTypeVal\
  \ == 'BIOGRAPHY'}\"\n                action=\"#{biographyBookController.create(\
  \ book.isbn,\n                         book.title, book.year, biographyBook.about)}\"\
  \ />\n</h:panelGroup>\n```\n\n关于上述代码有几点重要说明：\n\n* `h:selectOneMenu` 用于创建单次选择列表，通过使用\
  \ `Book` 类的 `getTypeItems` 方法填充书籍标题。更详细的解释将在第 3 部分枚举应用例中给出。\n\n\n\n\n\n*   可以使用\
  \ `rendered` 属性来条件条件渲染 facelet 组件。JSF EL 表达式必须返回 `true` 或 `false`，这将决定生成的 HTML 元素是否包含在\
  \ HTML DOM 中。请注意，条件表达式是在服务器端求值的。我们使用这种方法来隐藏或显示对应各种书籍类型的输入表单元素（例如，`TextBook` 拥有 `subjectArea`\
  \ 属性，而 `Biography` 拥有 `about` 属性）。\n\n*   `f:ajax` 使用的 `render` 属性指定了要更新哪些 JSF 组件。这是因为在\
  \ AJAX 调用后会发生实时的 DOM 更改（客户端，而非服务器端）。\n\n*   当特殊类型选择列表字段发生变化时（选择了某项），会使用 AJAX 提交表单以进行重新评估。结果是，它强制了对应三个书籍案例的三个面板（普通书、教科书和传记）的渲染。通过使用\
  \ `execute=“@this”`，我们强制在服务器端对表单进行重新评估，因此生成的 HTML DOM 结构包含了根据各种 JSF 元素的 `rendered`\
  \ 属性所指定的更改。请注意，具有条件渲染表达式的 JSF 元素必须是始终位于 DOM 中的另一个 JSF 元素的子元素。\n\n*   `h:panelGroup`\
  \ 用于定义一组显示或隐藏的元素。\n\n*   `h:commandButton` 的 `action` 属性不能与条件表达式一起使用，因此我们必须创建三个命令按钮，每个情况一个：创建/更新书籍、`TextBook`\
  \ 或 `Biography`。这会调用相应控制器类的 `create` 方法（即 `BookController`、`TextBookController`\
  \ 或 `BiographyController`）。\n\n*   由于我们对应的 Java bean 类中没有为特殊类型（类别）设置相应的属性，我们可以使用\
  \ JSF 变量来存储单选列表的值，然后在各种元素的 `rendered` 条件中使用该变量。因此，对于 `h:selectOneMenu`，`value=“#{viewScope.bookTypeVal}`\
  \ 指明了我们使用一个名为 `bookTypeVal` 的“即时”定义属性，它是视图作用域（view scope）内部 JSF 对象的一部分。我们也可以在视图作用域之外定义此类变量，例如\
  \ `value=“#{bookTypeVal}”，但在这种情况下它们是请求作用域（request scoped）的，因此在提交表单后它们的值会丢失，且渲染条件无法被正确评估。\n\
  \n对于类层次结构中的一个类，定义了一个对应的控制器类。它包含了特定的 `create`、`update` 和 `delete` 方法。共享方法（如 `getAllObjects`）由顶层类的控制器定义（例如，对于我们的示例，这是\
  \ `BookController`）。有关如何实现控制器类及相应的 CRUD 方法的更多细节，请参见示例应用程序。\n\n*Update Book* 测试用例与\
  \ *Create Book* 测试用例非常相似。Delete Book 测试用例保持不变。\n\n### 14.3 案例研究 2：使用*连接表继承（Joined\
  \ Table Inheritance）*实现类层次结构\n\n案例研究的起点是上方图 12.8 所示的设计模型。在接下来的章节中，我们将展示如何通过*类层次结构合并（Class\
  \ Hierarchy Merge）*设计模式消除 `Manager` 类，以及如何借助 JPA 框架实现 `Person` 层次结构并使用*连接、多表继承（Joined,\
  \ Multiple Table Inheritance）*存储。\n\n#### 14.3.1 制作 Java 实体类\n\n我们使用 Java `Entity`\
  \ 类设计示例的*模型*，我们直接从 `model` 派生并仅添加 `getters` 和 `setters`。然而，在示例中，我们应用了*类层次结构合并*设计模式来消除\
  \ `Manager` 类，如图 14.2 所示。注意在 JSF 元素中我们做出了两个技术决策：\n\n1.  我们将 `Person` 的划分声明为*不相交（disjoint）*且*完全（complete）*，即任何人要么是\
  \ `Employee` 要么 `Author`。由于 Java 不支持重叠划分，\n2.  我们将 `Person` 变成一个抽象类（由斜体名称指示），这意味着它不能被实例化，相反我们可以实例化并初始化派生自它的子类。这意味着我们没有声明\
  \ `@DiscriminatorValue`，因为数据库表中没有存储 `Person` 的直接实例。\n\n#### 14.3.2 新问题\n\n与*测试用例\
  \ 1*中所示的 `Book` 层次结构相比，`@Inheritance` 注解现在定义了 `strategy=Inheritance.JOINED`。这意味着对于继承层次结构中的每个类，都使用一个数据库表。`@DiscriminatorColumn(name=“category”)`\
  \ 指定了顶层层次类（即 `Person`）在对应表（即 `persons`）中的列，该列存储了用于识别每个条目（表行）存储类型的判别器值。\n\n在 UI 中我们必须处理：\n\
  \n1.  添加视图（`WebContent/authors` 和 `WebContent/employees`）和控制器类（`AuthorController`\
  \ 和 `EmployeeController`）。\n2.  处理 `Manager` 情况，在 `WebContent/books/create.xhtml`\
  \ 和 `WebContent/books/update.xhtml` 中添加“特殊类型”选择控件。\n\n#### 14.3.3 编写 Java 实体模型类\n\
  \n我们使用 JPA 注解定义 `Employee` 与 `Person` 以及 `Author` 与 `Person` 之间的类别关系。首先，我们如下所示创建\
  \ `Person` 类：\n\n```java\n@Entity @Table(name=\"persons\")\n@Inheritance(strategy=Inheritance.JOINED)\n\
  @DiscriminatorColumn(name=\"category\", discriminatorType=DiscriminatorType.STRING,\
  \ length=16)\npublic abstract class Person {\n     @Id @NotNull(message=\"A person\
  \ ID is required!\")\n     private Integer personId;\n     @NotNull(message=\"A\
  \ name is required!\") @Column(nullable=false)\n     private String name;\n    …\n\
  }\n```\n\n##### 14.3.3.1 定义类别关系\n\n我们使用 JPA 注解定义 `Employee` 与 `Person` 以及 `Author`\
  \ 与 `Person` 之间的类别关系。首先，我们如下所示创建 `Person` 类（上文）：\n\nJava 实体模型通过使用 `Person`、`Employee`\
  \ 和 `Author` 以及枚举 `EmployeeCategory` 来编写。\n\n\n\n\n\n`Author` 类继承自 `Person`，因此可以使用对应\
  \ `personId` 和 `name` 属性的 `get` 和 `set` 方法。`@DiscriminatorValue(value=\"AUTHOR\"\
  )` 指定了 `persons` 表的列分类对于每个通过持久化 `Author` 实例产生的条目都存储值 `AUTHOR`。\n\n最后，我们定义了 `Employee`\
  \ 类：\n\n```\n @Entity @Table(name=\"employees\")\n@DiscriminatorValue(value=\"EMPLOYEE\"\
  )\n@ManagedBean(name=\"employee\") @ViewScoped\npublic class Employee extends Person\
  \ {\n     @Column( nullable=false)\n     @NotNull( message=\"An employee ID is required!\"\
  )\n     private Integer empNo;\n     @Column( nullable=false, length=32)\n     @Enumerated(\
  \ EnumType.STRING)\n     private EmployeeCategoryEL type;\n     @Column( nullable=true,\
  \ length=64)\n     private String department;\n     …\n}\n```\n\n注意用于识别 `Employee`\
  \ 类型的 `type` 属性，例如 `Manager`。它的值由 `EmployeeCategoryEL` 枚举定义。\n\n### 14.3.3 连接表类层次结构的数据库模式\n\
  \n由于注解\n\n```\n @Inheritance( strategy = InheritanceType.JOINED)\n```\n\n对于继承层次结构中的每个类，都会创建一个数据库表。JPA\
  \ 用于创建 `persons`、`authors` 和 `employees` 表的相应简化 SQL-DDL 脚本所示所示：\n\n```\n CREATE\
  \ TABLE IF NOT EXISTS `persons` (\n      `PERSONID` int(11) NOT NULL,\n      `category`\
  \ varchar(16) DEFAULT NULL,\n      `NAME` varchar(255) NOT NULL\n);\nCREATE TABLE\
  \ IF NOT EXISTS `authors` (\n      `PERSONID` int(11) NOT NULL,\n      `BIOGRAPHY`\
  \ varchar(255) DEFAULT NULL\n);\nADD CONSTRAINT `FK_authors_PERSONID` FOREIGN KEY\
  \ (`PERSONID`)\n       REFERENCES `persons` (`PERSONID`);\nCREATE TABLE IF NOT EXISTS\
  \ `employees` (\n      `PERSONID` int(11) NOT NULL,\n      `DEPARTMENT` varchar(64)\
  \ DEFAULT NULL,\n      `EMPNO` int(11) NOT NULL,\n      `TYPE` varchar(32) DEFAULT\
  \ NULL\n);\nADD CONSTRAINT `FK_employees_PERSONID` FOREIGN KEY (`PERSONID`)\n  \
  \     REFERENCES `persons` (`PERSONID`);\n```\n\n如我们所示，每个表都包含由相应 Java Bean 类定义的直接属性。此外，`authors`\
  \ 和 `employees` 表在创建时带有 `PERSONID` 列的外键约束，引用了 `persons` 表中的 `PERSONID` 列。\n\n###\
  \ 14.3.4 编写视图和控制器代码\n\n在用户界面中，对于每个 Java Bean 类，我们都有一个控制器类，其中包含创建、更新和删除 CRUD 方法。`PersonController`\
  \ 类被定义为抽象类，并包含 `checkPersonIdAsId` 方法，该方法被所有子类共有。`AuthorController` 和 `EmployeeController`\
  \ 继承了 `PersonController`。\n\n对于继承层次中的每个非抽象实体类，我们定义了一组对应于 CRUD 操作的视图。例如，在 `Author`\
  \ 的情况下，`WebContent/views/authors/` 文件夹中有 `retrieveAndListAll.xhtml`、`create.xhtml`、`update.xhtml`\
  \ 和 `delete.xhtml` 文件。在 `Employee` 的情况下，`Retrieve/List All Employees` 用例需要显示 `Special\
  \ type of employee` 列：\n\n```\n <h:column>\n  <f:facet name=\"header\">Special type\
  \ of employee</f:facet>\n  #{e.type != null ? e.type.label.concat(\" of \").concat(\n\
  \                                        e.department).concat(\" department\") :\
  \ \"\"}\n</h:column>\n```\n\n注意在 EL 表达式中，我们不能使用 `+`（加）运算符来拼接字符串。EL 只允许 `+` 运算符用于数值相加。然而，我们可以改用\
  \ `concat` 方法。\n\n### 14.4 运行应用\n\n要运行你的应用程序，你可能需要先停止 Tomcat/TomEE 服务器（Windows 使用\
  \ `bin/shutdown.bat`，Linux 使用 `bin/shutdown.sh`）。接下来，下载并解压包含应用程序所有源代码的 ZIP 压缩包，以及你必须编辑的\
  \ ANT 脚本文件（修改 `server.folder` 属性值）。现在，在你的控制台或终端执行以下命令：\n\n```\n ant deploy -Dappname=SubtypingApp\n\
  ```\n\n最后，启动 Tomcat Web 服务器（Windows 操作系统使用 `bin/startup.bat`，Linux 使用 `bin/startup.sh`）。请耐心等待，这取决于你计算机的速度。当控制台显示以下消息时：`INFO:\
  \ Initializing Mojarra [some library versions and paths are shonw here]` 对于上下文 `/subtypingapp`，它就准备绪了。最后，打开浏览器并输入：\n\
  \n```\n http://localhost:8080/SubtypingApp/WebContent/views/app/index.xhtml\n```\n\
  \n### 15 子类型练习项目\n\n### 15.1 项目 1 – 人物类型和电影类型\n\n要构建的应用目的是管理电影信息及其导演和演员，其中区分了两种类型的电影：传记片和电视剧剧集，如下模型所示![](img/b_9783110500325-015_ingr_001.png)\n\
  \n按照我们的指南编写应用。\n\n确保你的页面符合我们的指南。\n\n# 术语表\n\n| **C** |\n| :--- | :--- |\n| CRUD\
  \ | CRUD 是 `创建`、`读取`、`更新`、`删除` 的缩写，表示任何软件应用程序执行的四种基本数据管理操作。 |\n| Cascading Style\
  \ Sheets | CSS 通过告诉浏览器如何渲染 HTML（或 XML）内容的布局元素。通常，这些设置在独立的 CSS 文件中完成，通过 HTML 中的特殊链接进行关联。\
  \ |\n\n| **D** |\n| :--- |\n| Document Object Model | DOM 是一种用于检索和修改 HTML 或 XML\
  \ 文档节点和元素的抽象 API。所有 Web 语言都有 DOM 绑定来实现 |\n| Domain Name System | DNS 将用户友好的域名转换为\
  \ IP 地址，以便在 Internet 上定位主机。 |\n\n| **E** |\n| :--- |\n| ECMAScript | 由行业组织“Ecma”定义的\
  \ JavaScript 标准。 |\n| Extensible Markup Language | XML 允许以机器可读的方式标记各种文档、数据文件和消息结构。如果使用的标签名是自解释的，XML\
  \ 也可以人类可读的。XML 基于 Unicode。SVG 和 MathML 基于 XML，并且有一个基于 XML 的 HTML 版本。 |\n| XML 提供了一种以`XML\
  \ 文档`形式通过`元素`和`属性`结构化信息的语法。XML 文档中的特定元素和属性可以来自任何词汇，例如公共标准或用户定义的 XML 格式。 |\n\n| **H**\
  \ |\n| :--- |\n| Hypertext Markup Language | HTML 用于标记人类可读 Web 文档或 Web 界面的结构。基于\
  \ XML 的 HTML 版本称为“XHTML5”，与传统的 HTML 相比提供了更简洁的语法。 |\n| Hypertext Transfer Protocol\
  \ | HTTP 是一种基于 Internet 技术 TCP/IP 和 DNS 的无状态请求/响应协议，使用人类可读的文本进行 Web 客户端和 Web 服务器之间的通信。HTTP\
  \ 的主要目的是允许 Web 浏览器获取 URL 标识的 Web 文，并从 HTML 表单调用后端 Web 应用程序的操作。最近，HTTP 越来越多地用于提供\
  \ Web API 和 Web 服务。 |\n\n\n\n\n\n### 术语表\n\n#### IndexedDB\n一种由浏览器管理的索引数据存储的 JavaScript\
  \ API。索引允许高性能搜索。与许多 SQL 数据库管理系统（DBMS）一样，IndexedDB 支持数据库事务。\n\n#### I18N\n一组帮助产品适应任何目标语言和文化的最佳实践。它处理多种字符集、度量单位、键盘布局、时间和日期格式以及文本方向。\n\
  \n#### J\n#### JSON\nJSON 代表 `JavaScript Object Notation`（JavaScript 对象表示法），它是一种遵循\
  \ JavaScript 对象字面量语法的的数据交换格式。许多编程语言都支持 JSON 作为 XML 的轻量级替代方案。\n\n#### M\n#### MathML\n\
  一种用于表示数学表达式的开放标准，可用于数据交换或在网页内渲染。\n\n#### MIME\nMIME 类型（也称为“媒体类型”或“内容类型”）是随文件发送的关键字字符串，用于指示其内容类型。例如，声音文件可能标记为\
  \ `audio/ogg`，或者图像标记为 `image/png`。\n\n#### Model-View-Controller\nMVC 是一种通用架构隐喻，强调关注点分离原则，主要位于模型（model）和视图（view）之间，并将模型视为应用程序最基础的部分。在\
  \ MVC 框架中，“M”、“V”和“C”有不同的定义方式。通常，“模型”指的是应用程序的数据源，而“视图”表示用于用户界面的应用程序代码（基于 CSS 样式的\
  \ HTML 表单和 DOM 事件），而“控制器”通常指负责在 `view` 和 `model` 之间进行调的胶水代码。\n\n#### O\n#### Object\
  \ Constraint Language\nOCL（对象约束语言）是一种用于表示完整性约束的正式逻辑语言，主要用于 UML 类模型。它还允许在类模型中定义推导表达式以定义派生属性，并为操作定义前提和后置条件。\n\
  \n#### Object-Oriented Programming\nOOP（面向对象编程）是一种基于`objects`（对象）和对象的`classes`（类）概念的编程范式。类类似于对象的蓝图：它们定义了对象的`properties`（属性）以及可以应用于它们的`methods`/functions`（函数）。\
  \ OOP 的高级特性是类层次结构中的 `inheritance`（继承）：子类继承父类的特征（属性、方法和约束）。\n\n#### Web Ontology\
  \ Language\nOWL（网络本体语言）是一种用于 Web 知识表示的正式逻辑语言。它允许定义词表（主要是带有属性的类），并支持对这些类表示许多类型的完整性约束。OWL\
  \ 是执行自动推理的基础，例如检查 OWL 词表的一致性。以 UML 类模型形式定义的词表或数据模型可以转换为 OWL 词表，然后检查其一致性。\n\n####\
  \ P\n#### Portable Network Graphics\nPNG 是一种支持无损数据压缩的开放（非专利）图形文件格式。\n\n#### Polyfill\n\
  Polyfill（垫片方案）是一段 JavaScript 代码，用于在不支持该方法的浏览器模拟标准的 JavaScript 方法。\n\n#### R\n####\
  \ Resource Description Framework\nRDF（资源描述框架）是一种 W3C 语言，用于在 Web 上表示机器可读的命题信息。\n\n\
  #### S\n#### Standard Generalized Markup Language\nSGML 是一种定义标记语言的 ISO 规范。HTML4\
  \ 是基于 SGML 定义的。XML 是 SGML 的简化后续。HTML5 不再基于 SGML，而是有它自己的解析规则。\n\n#### Scalable Vector\
  \ Graphics\nSVG 是一种基于 XML 的二维矢量图像格式。SVG 可以使用 CSS 进行样式设置，并使用 JavaScript 实现交互。HTML5\
  \ 允许直接在 HTML 文档中嵌入 SVG 内容。\n\n#### Slot\nSlot 是一个键值对。在面向对象程序的对象内部（例如，在 Java 对象中），slot\
  \ 通常是一个属性-值对。但在 JavaScript 对象中，slot 也可以由一个方法名和方法体组成，或者它可能是 map 中的键值对。\n\n#### U\n\
  #### Unicode\n一种与平台无关字符集，包含了世界上大多数脚本语言的几乎所有字符，包括印地语、缅甸语和盖尔尔语。每个字符被分配一个位于 0 到 1,114,111\
  \ 之间的唯一整数代码。例如，希腊字母 `π` 的代码是 960。Unicode 包含 `ASCII` 和 `ISO-8859-1`（Latin-1）等旧字符集的子集。\n\
  \nXML 基于 Unicode。因此，希腊字母 `π`（代码为 960）可以使用 XML 实体语法作为 `&#960;` 插入 XML 文档。XML 文档中\
  \ Unicode 字符的默认编码是 `UTF-8`，它对 ASCII 字符仅使用一个字节，但对不常用的字符使用三个字节。\n\n#### Uniform Resource\
  \ Identifier\nURI 是 `Uniform Resource Locator (URL)`（统一资源定位符）或 `Uniform Resource\
  \ Name (URN)`（统一资源名称）。\n\n#### Uniform Resource Locator\nURL 是一种资源名称，包含用于在 Web 上定位该资源的\
  \ Web 地址。\n\n#### Unified Modeling Language\nUML（统一建模语言）是一种行业标准，定义了一系列建模语言，用于创建各种模型和图表，以支持面向对象的的问题分析和软件设计。它的核心语言是用于信息/数据建模的\
  \ `Class Diagrams`（类图），以及用于过程/行为建模的 `Sequence Diagrams`（时序图）、`Activity Diagrams`（活动图）和\
  \ `State Diagrams`（状态图）。\n\n#### Uniform Resource Name\nURN 指向一个资源，但不指定其位置。\n\n\
  #### User Agent\n用户代理是类的前端 Web 客户端程序，例如 Web 浏览器。\n\n#### W\n#### WebM\nWebM 是一种由\
  \ Google Chrome 和 Mozilla Firefox 支持的开放（免版）网络视频格式，但不支持 Microsoft Internet Explorer\
  \ 和 Apple Safari。\n\n#### Web Hypertext Application Technology Working Group\n`WHATWG`\
  \ 由 Apple、Mozilla 和 Opera 的前员工于 2004 年建立，他们对 W3C 选择专注于 XHTML2 标准化导致 Web 技术标准化进展缓慢感到不满。在\
  \ Ian Hickson 的带领下，他们在与 W3C 的竞争与合作中开发了 HTML5 和相关的 JavaScript API。\n\n#### World\
  \ Wide Web\nWWW（或简单地称为“Web”）是一个基于 HTTP、HTML 和 XML 的巨大的客户端-服务器网络，其中 Web 浏览器（以及其他“用户代理”）作为\
  \ HTTP 客户端访问作为 HTTP 服务的 Web 器程序。\n\n#### World Wide Web Consortium\n`W3C` 是一个负责开发和维护\
  \ Web 标准的国际组织。\n\n#### X\n#### XML HTTP Request\nXML HTTP Request (XHR) API 允许 JavaScript\
  \ 程序与后端程序交换 HTTP 消息。它可以用于在不提交 HTML 表单的情况下从或向后端程序检索/提交信息。基于 XHR 的方法在过去被归入“AJAX”这一缩写下。\n\
