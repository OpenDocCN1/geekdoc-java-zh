- "# JavaScript 或 Java Web 应用开发第2卷：约束验证、枚举、特殊数据类型\n\n\n\n\n\n\n\n\n\n\n第 2 ：关联与类层级\n\
  \n\n\n\n\n\n\n\n\n\n\n\n# 献辞\n\n致我们的家人。\n\n# 前言\n\n本书分为两卷，展示了如何基于模型的方法设计并实现 Web\
  \ 应用，并使用了 Web 开发中最相关的平台：JavaScript 和 Java。Web 应用通过 UML 图表形式的信息模型来辅助设计，并实现为：\n\n\
  本书的重点是关于信息管理问题的通用概念和技术：\n1. 完整性约束和数据验证\n2. 枚举和属性\n3. 对象类型之间的单向和双向关联\n4. 子类型与继承\n\
  \n列表中的前两个问题将在第一卷中讨论，而最后两个将在第二卷中讨论。我们假设读者已经熟悉 HTML 和至少一种面向对象的编程语言，例如 C++、Java、PHP\
  \ 或 `C#`。此外，我们假设读者对 CSS 有一定了解，并对学习使用 JavaScript 或 Java 进行编程感兴趣。\n\n本书可用于：\n1. 计算机科学或相关专业的学生\
  \ Web 开发课程；\n2. JavaScript 开发者学习 Java；\n3. Java 开发者学习 JavaScript；\n4. JavaScript\
  \ 和 Java（以及 PHP/Python/C#）开发者通过此学习：\n    * 使用 JavaScript 或 Java 进行面向对象 (OO) 编程；\n\
  \    * 如何使用原生 JavaScript 或 Java 实现基础信息管理概念并构建完整的 Web 应用。\n\n本书附带六个示例应用的完整源代码，你可以从我们的\
  \ Web 服务器运行或下载。\n\n# 第一部分：关联\n\n我们在第一卷中讨论的三个示例应用——`minimal app`、`validation app`\
  \ 和 `enumeration app`——仅限于管理单个对象类型的数据。然而，真实的应用程序必须管理多个对象类型的数据，这些类型通常以各种方式相互关联。特别是，对象类型之间可能存在\
  \ `associations`（关联）和 `subtype`（子类型/继承）关系。处理关联和子类型关系是软件应用工程中的高级问题。它们在教科书中往往没有充分讨论，也没有得到应用开发框架良好的支持。\n\
  \n关联是信息模型的重要元素。软件应用程序必须以适当实现它们，特别是在 `model-view-controller` (`MVC`) 架构的 `model`\
  \ 层中。遗憾的是，应用开发框架对处理关联提供的支持不多。\n\n有两个相互重要的区别：\n1. `功能性`关联与`非功能性`（多对多）关联。\n2. `单向`关联与`双向`关联。\n\
  \n功能性关联对应于数学中所说的 `function`（函数），而多对多关联对应于数学中所说的 `relation`（关系）。单向关联对应于 建模和编程中的引用属性，而双向关联对应一对相互取反的引用属性。\n\
  \n## 1 引用属性与单向关联\n\n如果为对象类型（或类）定义的属性其值是指向另一个（或相同）类型对象的 `references`（引用），则该属性被称为\
  \ `reference property`（引用属性）。例如，下方图 1.1 所示的 `Committee` 类有一个引用属性 `chair`，其值是指向 `ClubMember`\
  \ 类型对象的引用。\n\n对象类型之间的 `association`（关联）对这些类型中对象之间的关系进行了分类。例如，`Committee`-`has`-`ClubMember`-as-chair\
  \ 关联（它在下方图 1.2 所示的类图中可视化为一条连接线）分类了 `FinanceCommittee`-`has`-PeterMiller`-as-chair、`RecruitmentCommittee`-`has`-SusanSmith`-as-chair\
  \ 和 `AdvisoryCommittee`-`has`-SarahAnderson`-as-chair 的关系，其中对象 `PeterMiller`、`SusanSmith`\
  \ 和 `SarahAnderson` 类型为 `ClubMember`，而 `FinanceCommittee`、`RecruitmentCommittee`\
  \ 和 `AdvisoryCommittee` 类型为 `Committee`。作为关系集的关联可以表示为如下表：\n\n引用属性对应于关联的特殊形式，即 `unidirectional`（单向）`binary\
  \ associations`（二元关联）。虽然二元关联通常不需要方向性，但引用属性表示了一种从属性的域类（domain class，即定义处）指向其值类（range\
  \ class）的二元关联。\n\n通常，关联是具有两个或多个 `object types`（对象类型）参与其中的 `relationship types`（关系类型）。两个对象类型之间的关联被称为\
  \ `binary`（二元）。在本书中，我们只讨论二元关联。为了简单起见，当我们实际上是指“二元关联”时，我们直接说“关联”。\n\n```\n| *Committee*-has-*ClubMember*-as-chair\
  \ |\n| --- |\n| Finance Committee | Peter Miller |\n| Recruitment Committee | Susan\
  \ Smith |\n| Advisory Committee | Sarah Anderson |\n```\n\n\n\n\n\n虽然个体关系（例如 `FinanceCommittee`-`has`-`PeterMiller`-`as-chair`）是业务通信和信息系统中的重要信息项，但关联（例如\
  \ `Committee`-`has`-`ClubMember`-`as-chair`）是*信息模型*中的重要元素。因此，软件应用程序必须以适当的方式实现它们，通常作为其在*模型-视图-控制器*\
  \ (MVC) 架构中*模型*层的一部分。遗憾的是，许多应用开发框架缺乏处理关联所需的支持。\n\n在数学中，关联以抽象的方式被形式化为均匀元组的集合，称为*关系*（*relations*）。在*实体-关系*（`ER`）建模中（这是信息系统和软件工程中经典的信息建模方法），对象被称为*实体*（*entities*），关联被称为*关系类型*（*relationship\
  \ types*）。*统一建模语言 (UML)*包含了用于信息建模的 `UML 类图` 语言。在 UML 中，对象类型被称为 `classes`（类），关系类型被称为\
  \ `associations`（关联），而个体关系被称为“链接”（links）。这三个术语总结在下表中：\n\n| 我们首选的术语 | UML | ER 图\
  \ | 数学 |\n| --- | --- | --- | --- |\n| object | object | entity | individual |\n\
  | object type (class) | class | entity type | unary relation |\n| relationship |\
  \ link | relationship | tuple |\n| association (relationship type) | association\
  \ | relationship type | relation |\n| functional association |  | 一一、多一或一多关系类型 |\
  \ 函数 (one-to-one/many-to-one is function) |\n\n我们首先讨论引用属性（reference properties），它们在“无关联”的类模型（即不包含任何显式关联元素的模型）中隐式地表示单向二元关联。\n\
  \n### 1.1 引用与引用属性\n\n引用可以是*人类可读的*，也可以是*内部对象引用*。人类可读引用是指在人类通信中使用的标识符，例如天体的唯一名称、书籍的\
  \ ISBN 以及公司员工的工号。内部对象引用是指 OOP 对象的内存地址，从而为访问计算机主内存中的对象提供了一种高效的机制。\n\n某些语言（如 `SQL`\
  \ 和 `XML`）仅支持人类可读的引用，不支持内部引用。在 `SQL` 中，人类可读引用被称为 `foreign keys`（外键），它们所引用的标识符被称为\
  \ `primary keys`（主键）。在 `XML` 中，人类可读引用被称为 `ID references`（ID ），对应的属性类型为 `IDREF`。\n\
  \nOO 程序中的对象可以通过人类可读引用（如整数代码）或内部对象引用来引用，后者更有利于高效访问主内存中的对象。遵循 `XML` 术语，我们将人类可读引用称为\
  \ `ID references`。我们遵循 ID 引用属性的标准命名规范：在类 `A` 中定义并引用类 `B` 对象的 ID 引用属性名称为 `b_id`，并使用后缀\
  \ `_id`。当我们以记录或表行的形式存储持久化对象时，我们需要将存储在 `publisher` 等属性中的内部对象引用转换为存储在 `publisher_id`\
  \ 等属性中的 ID 引用。这种转换是在对象序列化过程的一部分完成的，方法通过将被引用对象的标准标识符值分配给引用对象的 ID 引用属性来实现。\n\n在 OO\
  \ 语言中，属性是为对象类型（或类）定义的，其为*域*（*domain*）。属性的值要么是某些数据类型的*数据值*，在这种情况下属性被称为***属性（属性）***（*attribute*），要么是指向某类对象的*对象引用*（*object\
  \ references*），在这种情况下属性被称为***引用属性***（*reference property*）。例如，下方图 1.1 所示的 `Committee`\
  \ 类具有一个范围为 `String` 的属性，以及一个范围为 `ClubMember` 的引用属性 `chair`。\n\n\n图 1.1：委员会有一个俱乐部成员担任主席，通过引用属性\
  \ `chair` 表达。\n\n面向对象的编程语言（如 `JavaScript`、`PHP`、`Java` 和 `C#`）直接支持*引用属性*的概念，这种属性的范围不是*数据类型*，而是*引用类型*或*类*，其值是指向该类实例的对象引用。\n\
  \n默认情况下，属性的基数数为 1，这意味着该属性是***强制的***（*mandatory*）且***函数的***（*functional*，换句话说，是*单值的*），拥有***恰好一个***值，类似于图\
  \ 1.1 中所示 `Committee` 类中的 `chair` 属性。当函数属性是***可选的***（非强制的）时，它的基数为 0..1，这意味着该属性的最小基数为\
  \ 0，最大基数为 1。\n\n引用属性可以是***单值的***（*函数的*）或***多值的***（*非函数的*）。例如，图 1.1 中所示的引用属性 `Committee::chair`\
  \ 是单值的，因为它分配了一个唯一的俱乐部成员作为 `chair`。*多值*引用属性的示例是下方图 1.11 所示的 `authors` 属性。\n\n通常，多值引用属性的集合值是一个集合，这意味着引用的顺序并不重要。但在某些情况下，顺序是重要的，因此这种多值引用属性的集合值是有序的集合，通常由列表实现。\n\
  \n### 1.2 引用完整性\n\n引用是我们应用程序数据库中的重要信息项。然而，只有当应用程序维护其*引用完整性*时，它们才有意义。这要求任何引用都存在一个被引用对象。因此，任何域类为\
  \ `C` 范围类为 `D` 的引用属性 `p` 都带有一个*完整性约束*，该约束在以下情况下需要检查：\n\n1. 创建新的 `C` 类型对象时；\n2. 更改某些\
  \ `C` 类型对象的 `p` 值时；\n3. 销毁一个 `D` 类型对象时。\n\n引用完整性约束还意味着两个*变更依赖*：\n\n1.  ***对象创建依赖***：带有另一个对象引用的对象在被引用对象创建后才能创建。\n\
  2.  ***对象销毁依赖***：被其他对象引用的对象只有在以下情况后才能销毁：\n\n    1. 首先销毁引用对象（`CASCADE` 级联策略），或者\n\
  \    2. 引用对象中的引用被删除（`DROP-REFERENCE` 删除策略）或替换为另一个引用。\n\n对于我们应用程序模型类中的每个引用属性，我们必须选择这两种可能的*删除策略*之一来适用。\n\
  \n通常，对象创建依赖在用户界面中管理，即不允许用户输入 ID 引用属性的值，而只允许他们从所有现有目标列表中选择一个。\n\n### 1.3 将引用属性建模为单向关联\n\
  \n\n\n\n\n引用属性（如上述图 1.1 示例中的 `chair`）可以在 UML 类图中以其领域类拥有的 `association end`（关联端）的形式进行建模，该关联端通过一个较小的实心圆圈（也称为“点”）来可视化。这需要用关联线连接引用属性的领域类（domain\
  \ class）和范围类（range class），在连线的范围类一侧端放置一个 `ownership dot`（所有权点），并用属性名称和多重符号对该关联端进行注释，如下所示针对我们示例情况的图\
  \ 1.2。通过这种方式，我们得到了一个 `unidirectional association`（单向关联），其 `source`（源）类是属性的 `domain`，其\
  \ `target`（目标）类是属性的 `range`。\n\n关联端被另一端的类 `owned`（拥有）这一事实（正如下方图 1.2 示例中关联端 `chair`\
  \ 处的 `association end ownership dot` 视觉表达所示），意味着该关联端表示一个引用属性。在图 1.2 示例中，表示的引用属性是\
  \ `Committee::chair`，其范围为 `ClubMember`。这种只有一个关联端所有权点的关联在意义上是 `unidirectional` 的，因为它只允许在一个方向上进行\
  \ `navigation`（导航/对象访问）：从点相反侧的类（`source` 类）到放置点的类（`target` 类）。\n\n\n图 1.2：带有“点”的关联端。\n\
  \n因此，图 1.1 和 1.2 中所示的两个图表表示了本质上等价的模型。当一个引用属性（如图 1.1 中的 `chair`）通过带有“点”的关联端建模时，该属性的多重性会附加到关联端上。由于在设计模型中，所有关联端都需要多重性，我们还必须为\
  \ `Committee` 类一侧的另一端定义一个多重性，它代表了属性的反向关系。这种多重性（反向属性的多重性）在所示图 1.1 模型中的原始属性描述中是不可用的，因此必须根据关联的预意语义进行添加。这可以通过回答问题“任何\
  \ `ClubMember` 必须是某个 `Committee` 的主席吗？”来找到最小基数，并通过回答问题“一个 `ClubMember` 可以是多个 `Committee`\
  \ 的主席吗？”来找到最大基数。\n\n当属性的值是来自其范围的一组值值集合时，该属性是 `non-functional`（非函数的），其多重性为 `0..*`\
  \ 或 `n..*`（其中 `n > 0`）。与其表示“既不是强制的也不是函数的” `0..*`，我们可以简单地写星号符号 `*`。图 1.2 中所示的关联为一个\
  \ `Committee` 类型的对象分配最多一个 `ClubMember` 类型的对象作为 `chair`。因此，它是 `functional association`（函数性关联）的一个示例。\n\
  \n关于关联功能不同情况的概述请见表 1.1。\n\n表 1.1：功能类型。\n\n| 功能类型 | 意义 |\n| --- | --- |\n| 一一 (one-to-one)\
  \ | 既是函数也是反向的 |\n| 多对一 (many-to-one) | 函数的 |\n| 一对多 (one-to-many) | 反向的 |\n| 多对多\
  \ (many-to-many) | 既不是函数的也不是反向的 |\n\n注意关联的方向功能是相互独立的。因此，单向关联可以是 `one-to-one` 或 `many-to-many`。\n\
  \n### 1.4 用引用属性表示单向关联\n\n`source` 和 `target` 类之间的单向关联可以表示为 `source` 的引用属性。这在下方图\
  \ 1.3 中所示，针对两种关联：多对一和多对多。\n\n通过这种方式，我们消除了显式关联并将其替换为引用属性。\n\n### 1.5 为无向关联添加方向\n\n\
  当我们以 UML 类图的形式制作模型时，通常会得到没有方向的关联，例如在图 1.4 所示。当关联的任何端都没有所有权点时，这意味着该模型属于关联本身，而不属于参与它的任何类。\n\
  \n\n图 1.4：无向关联的模型。\n\n包含没有关联端的信息设计作为关系数据库模型是可以接受的，但作为 OOP 语言的设计来说是不完全的。例如，图 1.4\
  \ 模型提供了包含两个实体表 `committees` 和 `clubmembers` 的关系数据库设计，以及一个独立的一对一关系表 `committee_has_clubmember_as_chair`。但它没有提供\
  \ Java 类的设计，因为它没有说明如何通过引用属性来实现该关联。\n\n有三种方案可以将无向关联（无任何关联端）的信息设计模型转换为所有关联均为单向或双向的信息设计模型：我们可以在关联的任一端或两端放置所有权点。这三种方案每种定义了使用引用属性表示或实现关联的不同方式。因此，对于上方图\
  \ 1.4 中所示的关联，我们有以下选项：\n\n1.  在 `chair` 关联端放置所有权点，从而导致如图 1.2 所示的模型，该模型可以转换为上方所示的图\
  \ 1.1 中的 OO 类模型。\n2.  在 `charedCommittee` 关联端放置所有权点，导致下方所示的图 1.8 中的完成模型。\n\n\n\n\
  \n\n### 3. 通过在关联的两端都放置所有权点（ownership dots），使关联变为双向的，如图 1.5\n\n图 1.5：建模委员会（Committee）与俱乐部成员（ClubMember）之间的双向关联。\n\
  \n因此，每当我们对关联进行建模时，都必须做出选择：它的哪一端代表引用属性，并因此标记上所有权点。可以是其中一个，也可以是两者都是。这一决定也意味着对关联的可导航性（`navigability`）的决定。当关联的一端代表引用属性时，意味着它是可导航的（通过该属性）。\n\
  \n对于非一对一的功能性关联，最简单的设计是根据其功能定义关联的方向，在多重性为 `0..1` 的关联端放置关联所有权点。对于非方向性的一对一或多对多关联，我们可以根据意愿选择方向，即我们可以在任何一个关联端放置所有权点。\n\
  \n### 1.6 我们的运行示例\n\n图 1.6 所示的模型（关于出版者和书籍）作为我们单向功能性关联的运行示例。请注意，它包含了单向多对一关联 `Book-has-Publisher`。\n\
  \n![](img/b_9783110500325-001_fig_006.png)\n\n图 1.6：带有单向关联的出版者（Publisher）-书籍（Book）信息设计。\n\
  \n我们可能还需要处理代表单向非功能性关联的非功能性（多值）引用属性。例如，下方图 1.7\n\n图 1.7：带有两个单向关联的出版者-书籍-作者（Publisher-Book-Author）信息设计。\n\
  \n### 1.7 消除单向关联\n\n由于经典的面向对象 语言不支持将关联视为一等公民，仅支持类和表示单向关联的引用属性，因此我们必须从通用信息设计中消除所有关联，以获取\
  \ OO 类模型。\n\n#### 1.7.1 基本消除步骤\n\n我们受限的“关联消除”（`association elimination`）程序的起点是一个包含各种单向关联的信息设计模型，如上方的图\
  \ 1.6\n\n图 1.8：将功能性关联端转换为引用属性。\n\n对于单向一对多的关联案例，下方的图 1.9\n\n图 1.9：将非功能性关联端转换为多值引用属性。\n\
  \n#### 1.7.2 从设计模型中消除关联\n\n在我们的运行示例——出版者-书籍-作者（Publisher-Book-Author）信息设计模型中，我们必须将两个单向关联替换为合适的引用属性。在第一步中，我们将图\
  \ 1.6 中的多对一关联 `Book-has-Publisher` 替换为 `Book` 类中的功能引用属性 `publisher`，从而产生了图 1.10\
  \ 所示的 OO 类模型。\n\n\n图 1.10：出版者（Publisher）的 OO 类模型。\n\n注意，由于 `Book-has-Publisher`\
  \ 关联的目标端多重性为 `0..1`，我们将新属性 `publisher` 声明为可选。该 OO 类及其引用属性含义可以通过以下示例数据进行说明：\n\n|\
  \ Publisher |\n| Name | Address |\n| :--- | :--- |\n| Bantam Books | New York, USA\
  \ |\n| Basic Books | New York, USA |\n\n| Book |\n| ISBN | Title | Year | Publisher\
  \ |\n| :--- | :--- | :--- | :--- | :--- |\n| 0553345842 | The Mind’s I | 1982 |\
  \ Bantam Books |\n| 1463794762 | The Critique of Pure Reason | 2011 | Bantam Books\
  \ |\n| 1928565379 | The Critique of Practical Reason | 2009 | Bantam Books |\n\n\
  注意，`Book` 表中 `publisher` 列的值是引用 `Publisher` 表行的唯一名称。`publisher` 列是可选的。\n\n在第二步中，我们将图\
  \ 1.7 中的多对多关联 `Book-has-Author` 替换为 `Book` 类中的多值引用属性 `authors`，从而产生了图 1.11 所示的 OO\
  \ 类模型。\n\n\n图 1.11：类、出版者（Publisher）和作者（Author）的 OO 类模型。\n\n| Publisher |\n| Name\
  \ | Address |\n| :--- | :--- |\n| Bantam Books | New York, USA |\n| Basic Books\
  \ | New York, USA |\n\n| Book |\n| ISBN | Title | Year | Authors | Publisher |\n\
  | :--- | :--- | :--- | :--- | :--- |\n| 0553345842 | The Mind’s I | 1982 | 1, 2\
  \ | Bantam Books |\n| 1463794762 | The Critique of Pure Reason | 2011 | 3 | Bantam\
  \ Books |\n| 1928565379 | The Critique of Practical Reason | 2009 | 3 | Basic Books\
  \ |\n\n| Author |\n| Author ID | Name |\n| :--- | :--- |\n| 1 | Daniel Dennett |\n\
  | 2 | Douglas Hofstadter |\n| 3 | Immanuel Kant |\n\n\n\n\n在完成与平台无关面向对象（OO）类模型后，可以针对特定的实现平台，从中推导出一个或多个特定平台的实现模型。特定平台实现模型的类型示例包括\
  \ `JS class models`、`Java Entity class models` 和 `SQL table models`。\n\n特定平台的实现模型仍然可以用\
  \ UML 类图的形式表示，但它仅包含可以在所选平台中直接编码的建模元素。因此，对于任何被考虑的平台，都需要两个准则：1) 如何制作特定平台的实现模型，以及 2)\
  \ 如何对该模型进行编码。\n\n### 1.8 在用户界面中渲染引用属性\n\n在 (CRUD) 数据管理用户界面 (UI) 中，用于数据输入输出的控件通常对应于应用模型类中定义的属性。我们必须区分对应于（各种）`属性`的（各种）`输入字段`，以及对应于`枚举属性`或`引用属性`的`选择控件`（如`选择列表`）。在\
  \ UI 中使用选择控件而非输入字段来表示引用属性，可以防止用户输入无效的 ID 引用，从而确保了`引用完整性`。\n\n通常情况下，`单值引用属性`可以渲染为\
  \ UI 中的单选列表，无论该引用属性范围由多少个对象填充，只需从中选出一个特定选项即可。如果引用属性范围的基数足够小（例如，不超过 7 个），我们也可以使用`单选按钮组`代替选择列表。\n\
  \n`多值引用属性`可以渲染为 UI 中的多选列表。然而，当有许多（例如，超过 20 个）不同的选项可供选择时，HTML 对应的多选控件就没那么好用了，因为其渲染选择的方式在视觉上太分散了。在只有少数（例如，不超过\
  \ 7 个）选项的特殊情况下，我们也可以使用`复选框组`代替多选列表。但对于在 UI 中包含一个从引用属性范围类中选出的所有关联对象的通用情况，我们需要开发一种特殊的\
  \ UI 控件，允许向已选对象列表添加（并从列表中移除）对象。\n\n这种`多选控件`由以下部分组成\n\n1.  包含已选（关联）对象的 HTML 列表元素，其中每个列表项包含一个用于从选择中移除该对象的推按钮；\n\
  2.  一个单选控件，配合推按钮使用，允许从多值引用属性的范围内添加一个新的关联对象。\n\n### 1.9 多值引用属性的集合类型\n\n默认情况下，非功能性关联端会将目标类实例的`set`（集合）关联到源类的任何实例上，这意味着对应的多值引用属性的集合值是集合。然而，也存在某些情况，非功能性关联端是有序的（`ordered`），因此对应的多值引用属性的集合值采用`ordered\
  \ sets`（有序集合）的形式。\n\n在下面的示例中，关联端 `publishedBooks` 不是有序的，而关联端 `authors` 是有序的，因为一本书的作者顺序是有意义的。注意，在\
  \ UML 类图中，有序的关联端用注释 `{ordered}` 标记。\n\n\n有序的关联端不应基于目标类的属性表示任何排序。在我们的示例中，这意味着书籍作者的排序不应该代表他们的字母顺序，而应该代表某种无法通过\
  \ `Author` 属性获取的信息。这事实确实如此，因为它代表了某种意义，而这种意义无法通过任何属性来表达。\n\n注意，信息设计模型中的有序关联端只是一种方便特性，因为有序关联端始终可以通过向关联的目标类添加一个或多个属性来转换为无序关联端，使得这些属性的值可以用于排序。有序关联端允许使用更简洁的信息模型和更高效的实现，因为它们不需要借助辅助排序属性来显式地标记排序信息。\n\
  \n多值引用属性的两种重要集合类型是 `sets`（集合）和 `ordered sets`（有序集合），而将 `bags`（多重集）和 `sequences`（有序多重集）作为多值引用属性的集合类型的情况非常罕见。当多值引用属性的集合类型为\
  \ `bag`（或 sequence）时，可以在类图中通过关联端或属性修饰符的注释 `{nonunique}`（或 `{ordered, nonunique}`）来表示。\n\
  \n但要注意，将 `lists`（如 `JS arrays` 或 Java 接口类型 `List`）作为多值引用属性的范围是非常常见的，无论是有序属性还是无序属性都是如此。\n\
