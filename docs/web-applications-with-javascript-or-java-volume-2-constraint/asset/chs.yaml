  \ | 莫斯科 |\n| 马赛 (Marseille) | |\n\n更多关于国家的数据可以在 `CIA` Worldbook 中找到。\n\n## 7 双向关联\n\
  \n在面向对象建模和编程中，`bidirectional`（双向）关联是指表示为一对互反属性的关联，它允许在两个方向上进行“导航”（对象访问）。\n\n下方的图\
  \ 7.1 所示的模型（关于出版社、书籍及其作者）作为我们的运行示例。注意它包含两个双向关联，如两端的圆点所示。\n\n![](img/b_9783110500325-007_fig_001.png)\n\
  \n图 7.1：具有双向关联的出版社-书籍-作者信息设计模型。\n\n### 7.1 反向引用属性\n\n为了能够轻松检索由俱乐部成员担任主席的委员会，我们在\
  \ `Committee-ClubMember` 示例模型中添加了两个引用属性：成员担任委员会主席的属性（`ClubMember::chairedCommittee`）以及成员担任委员会副主席的属性（`ClubMember::coChairedCommittee`）。我们假设任何成员最多担任一个委员会的主席或副主席（这种析是不互斥）。因此，我们得到了以下模型：\n\
  \n![](img/b_9783110500325-007_ingr_001.png)\n\n注意 `Committee::chair` 和 `ClubMember::chairedCommittee`\
  \ 两个引用属性之间的紧密对应关系。它们是彼此的 `inverse`（反向）：当俱乐部成员 Tom 是预算委员会主席时（通过元组（“budget committee”,\
  \ “Tom”）表示），预算委员会就是 Tom 担任主席的委员会（通过反向元组（“Tom”, “budget committee”）表示）。为了在图中表示这种反向对应关系，我们在\
  \ `ClubMember::chairedCommittee` 属性的声明在大括号中添加了一个反向属性约束 `inverse of chair`，并在 `Committee::chair`\
  \ 属性中添加了类似的，如下图所示：\n\n![](img/b_9783110500325-007_ingr_002.png)\n\n\n\n使用 OOP 语言的引用路径表示，用\
  \ `c` 引用一个 `Committee` 对象，我们得到方程：\n\n(7.1)`c.chair.chairedCommittee=c`\n\n或者反过来，用\
  \ `m` 引用一个 `ClubMember` 对象，我们得到方程：\n\n(7.2)`m.chairedCommittee.chair=m`\n\n注意，当属性\
  \ `p[2]` 是属性 `p[1]` 的逆反时，这意味着反过来来，`p[1]` 也是 `p[2]` 的逆反。因此，当我们声明属性 `ClubMember::chairedCommittee`\
  \ 为 `Committee::chair` 的逆反时，隐含地，`Committee::chair` 也是 `ClubMember::chairedCommittee`\
  \ 的逆反。因此，我们将 `Committee::chair` 和 `ClubMember::chairedCommittee` 称为`一对互反的引用属性`。在模型中具有这样一对属性意味着`冗余`，因为涉及的两个引用属性中的每一个都可以通过反转从另一个导出。这种冗余意味着`数据存储开销`和`更新开销`，这是为了支持双向高效对象访问而付出的代价。\n\
  \n为了维护互反引用属性对的重复信息，通常是将涉及的两个属性之一视为`主(master)`，另一个视为`从(slave)`，并在受影响模型类的更改方法（如属性设置器）代码中考虑这种区别。我们在模型图中通过使用\
  \ UML 符号斜杠（`/`）作为属性名称的前缀并将从属性声明为`派生(derived)`属性，来指示逆引用属性对中的从属性，如图所示：\n\n![](img/b_9783110500325-007_ingr_003.png)\n\
  \n`ClubMember` 中的属性 `chairedCommittee` 现在是`派生`的（如其斜杠前缀所示）。它的注释 `inverseinverse of\
  \ chair}` 定义了一个`推导规则`，根据该规则，它是通过反转属性 `Committee::chair` 得到的。\n\n在 UML 类图中，属性的派生可以通过\
  \ OCL `derive` 表达式指定，该表达式对于给定对象求出派生属性的值。当属性是另一个属性的逆反时（通过附加在属性声明后的约束表达式 `{inverse\
  \ of anotherProperty}` 指定），派生表达式是隐含的。在我们的示例中，对于任何俱乐部成员对象 `m`，它求出的委员会对象 `c` 满足 `c.chair\
  \ = m`。在 OCL 中，该推导规则的表达式如下\n\n```\ncontext ClubMember::chairedCommittee: Committee\n\
  derive:  \n  if Committee.allInstances().exists( c | c.chair = self) then c\n```\n\
  \n实现属性派生有两种方式：它可以通过读取时计算值来实现`读取时派生(derived on read)`，也可以通过更新时计算来实现`更新时派生(derived\
  \ on update)`，每当派导表达式中的变量（通常是另一个属性）的值变化时执行计算。后者对应于数据库中的`物化视图`。虽然读取时派生的引用属性可能无法保证高效的导航，因为读取时的计算可能会产生不可接受的延迟，但更新时派生的引用属性确实提供了高效的导航。\n\
  \n当我们通过在名称前加斜杠（`/`）来将逆引用属性指定为派生时，我们表示它是更新时派生的。例如，上例中的属性 `/chairedCommittee` 是从属性\
  \ `chair` 在更新时派生的。\n\n在派生引用属性的情况下，我们必须处理受影响模型类之间的`生命周期依赖`，这需要根据表示关联的功能类型（`一对一`、`多对一`或`多对多`）特殊的更改管理机制。\n\
  \n在我们关于派生逆引用属性 `ClubMember::chairedCommittee` 的示例中，它是单值且可选的，这意味着：\n\n1. 每当创建一个新的委员会对象时（带有强制性的主席分配），对应的\
  \ `ClubMember::chairedCommittee` 属性必须进行相应的赋值；\n2. 每当更新 `chair` 属性时（即为委员会分配一个新主席），必须取消之前主席的俱乐部成员的对应的\
  \ `ClubMember::chairedCommittee` 属性，并为新主席的成员设置该属性；\n3. 每当委员会对象被销毁时，必须取消对应的 `ClubMember::chairedCommittee`\
  \ 属性。\n\n当派生逆引用属性是多值而其逆反基属性是单值时（例如下方图 7.4 所示的模型。如果模型中仍包含任何非定向关联，我们首先必须通过对其端点的所有权做出决策，将它们转换为定向关联，这通常基于导航需求。\n\
  \n1. **消除单向关联**（连接源类与目标类的单向关联），通过在源类中使用一个引用属性来替换它们，使目标类成为其范围。\n\n\n\n\n### 2. 通过将双向关联替换为一对互逆的引用属性来消除双向关联\n\
  \n### 7.2.2 如何消除单向关联\n\n连接源类与目标类的单向关联被替换为在**源类中的一个对应的引用属性，该属性的范围（range）为目标类。其多重性与目标关联端的多重性相同。如果关联端有名称，则该属性名称为关联端的名称；否则，设置为目标类的名称（如果引用属性是多值的，则可能使用复数形式）。\n\
  \n### 7.2.3 如何消除双向关联\n\n双向关联，例如上述图 7.1 所示模型中 `Book` 类与 `Author` 类之间的作者关系关联，被替换为一对互逆的引用属性，例如\
  \ `Book::authors` 和 `Author::authoredBooks`。由于这两个引用属性表示的是相同的信息（同一组二元关系），可以考虑将其中一个作为“主属性”，另一个作为从主属性派生出的“从属属性”。我们讨论讨论一对一关联和多对多关联的两种情况。\n\
  \n1. 在双向一对一关联的情况下，这会导致产生一对互逆的单值引用属性，分别位于两个关联类中的每一个中。由于它们本质上表示的是相同的信息（同一组链接/关系集合），必须从中选择一个作为主属性，使得另一个成为从属属性，该从属属性通过反转从主属性派生。在类图中，从属属性被指定为*派生属性*（derived\
  \ property），每当发生以下情况时，它都会自动更新：1) 创建了新的主对象，2) 更新了主引用属性，或 3) 销毁了主对象。这种转换如图 7.2 所示。\n\
  \n![](img/b_9783110500325-007_fig_002.png)\n\n图 7.2：将双向一对一关联转换为一对主从的互逆单值引用属性。\n\n\
  1. 双向多对多关联被映射为一对互逆的多值引用属性，分别位于参与关联的两个类中的每一个中。同样，在两个类中的其中一个，表示（反向）关联的多值引用属性被指定为*派生属性*，每当另一个类（维护关联的类）中的相应属性更新时，该属性就会自动更新。这种转换如图\
  \ 7.3 所示。\n\n![](img/b_9783110500325-007_fig_003.png)\n\n图 7.3：将双向多对多关联转换为一对主从的互逆多值引用属性。\n\
  \n### 7.2.4 得到的面向对象 类模型\n\n在将两个双向关联都替换为引用属性后，我们得到了 7.4 所示的 OO 类模型。\n\n![](img/b_9783110500325-007_fig_004.png)\n\
  \n图 7.4：具有两对互逆引用属性的 OO 类模型。\n\n由于书籍在存在上依赖于作者并可能依赖于出版商，而反之不然，因此在书籍对象中维护主引用，并将出版商和作者对象中的反向引用视为派生（或“从属”）数据是自然而然的。因此，我们将\
  \ `publishedBooks` 和 `authoredBooks` 定义为派生的反引用属性，这在 OO 类模型中通过其斜杠前缀来指示。\n\n该 OO 类模型的意义可以通过涉及的三个模型类的示例数据填充来来说明：\n\
  \n| 出版社 (Publisher) |\n| --- |\n| 名称 (Name) | 地址 (Address) | 出版书籍 (Published books)\
  \ |\n| --- | --- | --- |\n| Bantam Books | 美国，纽约 | 0553345842 |\n| Basic Books |\
  \ 美国，纽约 | 0465030793 |\n\n| 书籍 (Book) |\n| --- |\n| ISBN | 标题 (Title) | 年份 (Year)\
  \ | 作者 (Authors) | 出版社 (Publisher) |\n| --- | --- | --- | --- | --- |\n| 0553345842\
  \ | The Mind’s I | 1982 | 1, 2 | Bantam Books |\n| 1463794762 | The Critique of\
  \ Pure Reason | 2011 | 3 | |\n| 1928565379 | The Critique of Practical Reason |\
  \ 2009 | 3 | |\n| 0465030793 | I Am A Strange Loop | 2000 | 2 | Basic Books |\n\n\
  | 作者 (Author) |\n| --- |\n| 作者 ID (Author ID) | 名称 (Name) | 过的书籍 (Authored books)\
  \ |\n| --- | --- | --- |\n| 1 | Daniel Dennett | 0553345842 |\n| 2 | Douglas Hofstadter\
  \ | 0553345842, 0465030793 |\n| 3 | Immanuel Kant | 1463794762, 1928565379 |\n\n\
  注意书籍引用出版商和作者，出版商和作者引用书籍。\n\n## 8. 使用原生 JS 实现双向关联\n\n在本章中，我们将展示 1 如何从具有派生属性的 OO 类模型派生\
  \ JS 模型，2 如何以类的形式编写 JS 模型，3 如何基于模型编写视图和控制器代码。\n\n### 8.1 制作 JavaScript 模型\n\n制作\
  \ JS 模型的起点是一个具有派生属性的 OO 类模型，为了方便所示：\n\n![](img/b_9783110500325-008_ingr_001.png)\n\
  \n注意模型包含两个派生反属性：`Publisher::publishedBooks` 和 `Author::authoredBooks`。它们每一个都链接到一个主属性，并从中派生。因此，它们每一个都代表对应双向关联的一对引用属性。\n\
  \n与制作单向关联的 JS 类模型相比，唯一的新问题是：\n\n1. 为所有派生反属性添加 «get»类型，意味着它们有一个隐式的 getter，但没有 setter。每当对应的主属性更新时，它们都会被隐式设置。\n\
  \n因此，我们得到了下面的 JavaScript 类模型：\n\n![](img/b_9783110500325-008_ingr_002.png)\n\n###\
  \ 8.2 编写模型代码\n\n可以直接编写 JS 类模型以获取我们 JavaScript 前应用的模型层代码。\n\n#### 8.2.1 新问题\n\n与*单向关联应用*相比，我们需要处理许多新的技术问题：\n\
  \n1. 我们定义派生反属性（如 `Publisher::publishedBooks`）时不包含 *check* 操作，也不包含 *set* 操作。\n\n\
  2. 我们还必须通过维护构成派生属性集合值的派生（反向）引用集合来维护派生反属性。这特别要求：\n\n1. 每当*单值*主引用属性通过 setter 进行*初始化或更新*时（例如为书籍实例\
  \ `b` 分配指向出版商实例 `p` 的引用），都必须向派生反属性的相应值分配或添加反向引用（例如将 `b` 添加到 `p.publishedBooks`）；当主引用属性的值被*更新*且派生反属性是*多值*时，必须删除指向单值主引用属性旧值的过时反向引用。\n\
  \n\n\n\n\n2. 每当一个可选的 `single-valued`（单值）主引用属性的值被 `unset` 时（例如通过为 `Book` 实例 `b` 的\
  \ `b.publisher` 赋值 `null`），如果派生反向引用属性是多值的，则必须从对应的派生反向引用属性的值中移除反向引用（例如从 `p.publishedBooks`\
  \ 中移除 `b`），否则必须取消或更新派生反向引用属性的值；\n\n3. 每当通过添加方法向 `multi-valued`（多值）主引用属性的值中 `added`\
  \ 一个引用（例如向 `Book` 实例 `b` 的 `b.authors` 中添加 `Author` 引用 `a`）时，必须向对应的派生反向引用属性赋值或添加反向引用（例如向\
  \ `a.authoredBooks` 中添加 `b`）；\n\n4. 每当通过移除方法从 `multi-valued`（多值）主引用属性的值中 `removed`\
  \ 一个引用（例如从 `Book` 实例 `b` 的 `b.authors` 中移除对 `Author` 实例 `a` 的引用）时，如果派生反向引用属性是多值的，则必须从对应的派生反向引用属性的值中移除反向引用（例如从\
  \ `a.authoredBooks` 中移除 `b`），否则必须取消或更新派生反向引用属性的值；\n\n5. 每当一个具有单引用或多引用作为主引用属性值的对象被\
  \ `destroyed` 时（例如当一个具有单引用 `b.publisher` 指向 `Publisher` 实例 `p` 的 `Book` 实例 `b` 被销毁时），必须先移除派生的反向引用（例如从\
  \ `p.publishedBooks` 中移除 `b`）。\n\n注意，当创建一个具有单引用或多引用作为主引用属性值的新对象时（例如一个带有单引用 `b.publisher`\
  \ 的新 `Book` 实例 `b`），其 setter 或 add 方法将被调用，并将负责创建派生的反向引用。\n\n#### 8.2.2 编码总结\n\n\
  将 JS 类模型中的每类类编码为 ES2015 类，并带有隐式的 getter 和 setter（或者，编码为带有显式 setter 的 ES5 构造函数）：\n\
  \n1. 以类级（`static`）方法的的形式编写属性检查。确保 JS 类模型中指定的所有属性约束都已正确编码在属性检查中。\n\n2. 针对每个单值属性，编码指定的\
  \ getter 和 setter：\n    1. 在每个 setter 中，调用相应的属性检查，且仅当检查未检测到任何约束违反时，才对属性进行设置/取消。\n\
  \    2. 如果涉及的属性是派生引用属性的反向属性（表示双向关联），确保 setter 同时也向反向属性（或反向属性的集合值）赋值/取消（或添加/移除）相应的反向引用。\n\
  3. 针对每个多值属性，编码其 `add` 和 `remove` 操作以及指定的 get/set 操作：\n    1. 将 add/remove 操作编码为（实例级）方法，这些方法会调用相应的属性检查。\n\
  \    2. 编码 setter，使其对要赋值的集合中的每个项都调用 add 操作。\n    3. 如果涉及的属性是派生引用属性的反向属性（表示双向关联），确保\
  \ add/remove 方法也向反向属性（或反向属性的集合值）赋值/取消（或添加/移除）相应的反向引用。\n4. 编写序列化函数 `toString()` 和对象到存储转换函数\
  \ `toRecord()` 的代码。在出版社或作者对象的 `toRecord()` 对象到存储转换中，不包含派生属性 `publishedBooks` 和 `authoredBooks`，因为它们的信息是冗余的（这些信息从书籍的\
  \ publisher 和 authors 属性得出）。\n5. 在 `destroy` 方法中注意删除依赖。确保当具有单引用或多引用作为主引用属性值的对象被销毁时，先取消派生的反向引用（或移除）。\n\
  \n这些步骤将在后续章节中进行详细讨论。\n\n#### 8.2.3 编码 JS 类模型中的每个类\n\n例如，JS 类模型中的 `Publisher` 类是以以下方式编码的：\n\
  \n```\nclass Publisher {\n   constructor ({name, address}) {\n     this.name = name;\n\
  \     this.address = address;\n     // 派生的反向引用属性 (Book::publisher 的反向)\n     this._publishedBooks\
  \ = {}; // 初始化为空 map\n   }\nget name() {…}\nstatic checkName( n) {…}\nstatic checkNameAsId(\
  \ n) {…}\nstatic checkNameAsIdRef( n) {…}\nset name( n) {…}\nget address() {…}\n\
  static checkAddress( a) {…}\nset address( a) {…}\ntoString() {…}\ntoRecord() {…}\n\
  }\n```\n\n注意，我们添加了（派生的）多值引用属性 `publishedBooks`，但我们没有在构造函数中对其赋值，因为它是一个只读属性，当其反向主引用属性\
  \ `Book::publisher` 被赋值时会被隐式赋值。\n\n#### 8.2.4 编码单值属性的 Set 方法\n\n任何与派生反向引用属性（实现双向关联）耦合的引用属性的\
  \ setter，现在也需要向反向属性的集合值赋值/添加/移除反向引用。此类 setter 的一个示例是 `Book` 类中的 `publisher`：\n\n\
  ```\nset publisher( p) {\nif (!p) { //引用要被删除\n    // 移除 Publisher::publishedBooks\
  \ 中的反向引用\n    delete this._publisher.publishedBooks[this._isbn];\n    // 取消 publisher\
  \ 属性\n    delete this._publisher;\n} else {\n  // p 可以是 ID 引用或对象引用\n  const publisher_id\
  \ = (typeof p !== \"object\") ? p : p.name;\n  const constraintViolation = Book.checkPublisher(\
  \ publisher_id);\n  if (constraintViolation instanceof NoConstraintViolation) {\n\
  \  if (this._publisher) {\n       // 移除 Publisher::publishedBooks 中的反向引用\n     \
  \  delete this._publisher.publishedBooks[this._isbn];\n}\n   // 创建新的 引用\n   this._publisher\
  \ = Publisher.instances[ publisher_id];\n   // 向 Publisher::publishedBooks 添加新的反向引用\n\
  \      this._publisher.publishedBooks[this._isbn] = this;\n} else {\n  throw constraintViolation;\n\
  }\n}\n```\n\n## 8.2.5 编码 Add Remove 操作\n\n对于任何与派生反向引用属性耦合的多值引用属性，其 add 和 remove\
  \ 方法都必须向反向属性（或其集合值）赋值/添加/移除相应的引用。\n\n例如，对于为了实现 `Book` 和 `Author` 之间的双向作者关联而与派生反向引用属性\
  \ `Author:authoredBooks` 耦合的多值引用属性 `Book::authors`，`Book::addAuthor` 方法按以下方式编码：\n\
  \n```\naddAuthor( a) {\n// a 可以是 ID 引用或对象引用\nconst author_id = (typeof a !== \"\
  object\") ? parseInt(a) : a.authorId;\nconst validationResult = Book.checkAuthor(\
  \ author_id);\nif (author_id && validationResult instanceof NoConstraintViolation)\
  \ {\n    // 添加新的作者引用\n    this._authors[author_id] = Author.instances[author_id];\n\
  \    // 自动添加派生的反向引用\n    this._authors[author_id].authoredBooks[this._isbn] = this;\n\
  } else {\n   throw validationResult;\n}\n}\n```\n\n对于移除操作 `removeAuthor`，我们获得以下代码：\n\
  \n\n\n\n\n```javascript\n removeAuthor( a) {\n      // a can be an ID reference\
  \ or an object reference\n      const author_id = (typeof a !== \"object\") ? parseInt(a)\
  \ : a.authorId;\n      const validationResult = Book.checkAuthor( author_id);\n\
  \      if (validationResult instanceof NoConstraintViolation) {\n        // automatically\
  \ delete the derived inverse reference\n         delete this._authors[author_id].authoredBooks[this._isbn];\n\
  \        // delete the author reference\n        delete this._authors[author_id];\n\
  } else {\n   throw validationResult;\n}\n}\n```\n\n### 8.2.6 抑制派生属性值的存储\n\n在通过 `toRecord()`\
  \ 对出版者或作者对象进行对象到存储的转换时，派生属性 `publishedBooks` 和 `authoredBooks` 不被包含，因为它们的信息是冗余的（自书籍的\
  \ `publisher` 和 `authors` 属性）。例如，`Author::toRecord` 函数的实现如下：\n\n```javascript\n\
  \ toRecord() {\nvar rec = {};\n// loop over all Author properties\nfor (let p of\
  \ Object.keys( this)) {\n    // keep underscore-prefixed properties except \"_authoredBooks\"\
  \n    if (p.charAt(0) === \"_\" && p !== \"_authoredBooks\") {\n    // remove underscore\
  \ prefix\n    rec[p] = this[p];\n}\nreturn rec;\n}\n```\n\n### 8.2.7 处理删除\n\n当一个\
  \ `Book` 实例 `b`（它包含单个 `Publisher` 实例引用和多个 `Author` 实例引用）被销毁时，必须先移除派生引用（例如通过从 `p`\
  \ 中移除 `b`）：\n\n```javascript\n Book.destroy = function (isbn) {\n     const book\
  \ = Book.instances[isbn];\n     if (book) {\n         console.log(book.toString()\
  \ + \" deleted!\");\n         if (book.publisher) {\n             // remove inverse\
  \ reference\n             delete book.publisher.publishedBooks[isbn];\n        \
  \ }\n         // remove references from authors\n         for (let authorID of Object.keys(book.authors))\
  \ {\n             delete book.authors[authorID].authoredBooks[isbn];\n         }\n\
  \         // finally delete book from instances\n         delete Book.instances[isbn];\n\
  \     } else {\n       console.log(`There is no book with ${isbn}`);\n     }\n};\n\
  ```\n\n### 8.3 在用户界面中利用反向属性\n\n在 UI 中，我们现在可以在“检索/全部”用例中利用反向属性。例如，我们可以在“更新”用例中更高效地创建关联对象的列表。然而，更新必须通过书籍集合来进行。\n\
  \n#### 8.3.1 显示有关已书籍的信息\n\n为了在“检索/全部”用例中显示有关书籍的信息，我们现在可以利用 `publishedBooks`：\n\n\
  ```javascript\nretrieveAndListAll = {\n  setupInterface: function () {\n     const\
  \ tableBodyEl = document.querySelector(\"section#R>tbody\");\n     tableBodyEl.innerHTML\
  \ = \"\";\n     for (let key of Object.keys(publishers)) {\n       const publisher\
  \ = publishers[key];\n       const row = tableBodyEl.insertRow();\n       // create\
  \ list from publisher\n       const listEl = document.createElement(\"ul\");\n \
  \      row.insertCell(0).textContent = publisher.name;\n       row.insertCell(1).appendChild(listEl);\n\
  \     }\n     document.getElementById(\"M\").style.display = \"none\";\n     document.getElementById(\"\
  R\").style.display = \"block\";\n  }\n};\n```\n\n## 9 使用 Java 实现双向关联\n\n在本章中，我们将展示：\n\
  \n1.  如何从模型派生 Java 实体类，\n\n2.  如何根据模型对实体进行编码（示例），\n\n3.  如何编写视图和控制器代码。\n\n### 9.1\
  \ 创建 Java 实体类\n\n创建实体类的起点是一个带有反向属性的 OO 模型，如图 7 所示（我们再次展示它）：\n\n注意，该模型包含两个反向属性：`publishedBooks`\
  \ 和 `authoredBooks`。它们每一个都通过某种方式与其派生的主属性相关联。现在我们展示如何从该 OO 模型派生 Java 实体类：\n\n1. \
  \ 将每个类转换为「实体」类，并将所有属性设为私有。\n2.  将 OO 模型中平台无关的数据类型名称替换为相应的 Java 数据类型（例如 `Integer`,\
  \ `Float`）。\n3.  为所有非派生属性添加「get/set」刻型，以指示它们需要 getter 和 setter。\n4.  为所有派生属性添加「get」刻型，以指示它们只需要\
  \ getter。\n5.  对于任何引用属性，根据其所表示的关联的功能类型，添加相应的关键字作为属性修饰符。对于给定的 OO 模型添加添加属性修饰符：\n \
  \   *   为派生属性 `publishedBooks` 添加 `oneToMany`\n    *   为引用属性 `publisher` 添加 `manyToOne`\n\
  \    *   为引用属性 `authors` 添加 `manyToMany`\n    *   为派生属性 `authoredBooks` 添加 `manyToMany`\n\
  6.  对于任何被指定为另一个属性的反向属性的派生引用属性，将其 `{inverse of … }` 属性修饰符替换为相应的 `{mappedBy=\"…\"\
  }` 属性修饰符。\n7.  创建所需的属性约束检查操作。\n8.  为每个*多值*属性创建一个 `add` 和 `remove` 操作。\n\n### 9.2\
  \ 编写模型代码\n\n可以直接对 Java 实体类模型进行编码，以获取我们 Java 后端应用的模型层。\n\n#### 9.2.1 新问题\n\n与之前讨论的*单向关联应用*相比，我们必须处理许多新的技术问题：\n\
  \n1.  在*模型代码*中，你现在需要负责维护派生反向属性，方法是维护构成派生反向属性值的派生反向引用（或引用集合）。这特别要求：\n\n    1.  每当***单值***主引用属性的值通过\
  \ setter ***初始化或更新***时（例如将 `Publisher` 实例 `p` 的引用赋值给 `Book` 实例 `b` 的 `b.publisher`），必须向派生反向属性的对应值分配或添加反向引用（例如将\
  \ `b` 添加 `p.publishedBooks`）；当主引用属性的值*更新*且派生反向引用属性是*多值*时，则必须删除指向单值主引用属性旧值的过时反向引用。\n\
  \n\n\n\n2. 每当可选的 `single-valued` 主引用引用属性的值被 `unset` 时（例如，通过为 `Book` 实例 `b` 的 `b.publisher`\
  \ 赋值 `null`），如果派生的反向引用属性是多值的，则必须从派生反向引用属性的对应值中移除反向引用（例如从 `p.publishedBooks` 中移除\
  \ `b`）；否则，必须将派生反向引用属性的对应值 `unset` 或更新；\n\n3. 每当通过添加方法向 `multi-valued` 主引用引用属性的值中\
  \ `added` 引用时（例如向 `Book` 实例 `b` 的 `b.authors` 添加 `Author` 引用 `a`），必须向派生反向引用属性的对应值中赋值或添加反向引用（例如向\
  \ `a.authoredBooks` 中添加 `b`）；\n\n4. 每当通过移除方法从 `multi-valued` 主引用引用属性的值中 `removed`\
  \ 引用时（例如从 `Book` 实例 `b` 的 `b.authors` 中移除对 `Author` 实例 `a` 的引用），如果派生的反向引用属性是多值的，则必须从派生反向引用属性的对应值中移除反向引用（例如从\
  \ `a.authoredBooks` 中移除 `b`）；否则，必须将派生反向引用属性的对应值 `unset` 或更新；\n\n5. 每当具有单引用或多引用作为主引用引用属性值的对象被\
  \ `destroyed` 时（例如，当一个具有指向 `Publisher` 实例 `p` 的单一引用 `b.publisher` 的 `Book` 实例 `b`\
  \ 被销毁时），必须首先移除派生的反向引用（例如从 `p.publishedBooks` 中移除 `b`）。\n\n注意当创建一个具有单引用或多引用作为主引用引用属性值的新对象时（例如一个具有单一引用\
  \ `b.publisher` 的新 `Book` 实例 `b`），其 setter 方法或 add 方法将被调用，并负责创建派生的反向引用。\n\n2. 在\
  \ `UI code` 中，我们现在可以利用反向引用属性，在 `list objects` 用例场景中更高效地创建反向关联对象的列表。例如，我们可以更高效地为每个出版商创建所有已出版书籍的列表。\n\
  \n#### 9.2.2 总结\n\n1. 将 Java `Entity` 类模型中的每个类编码为相应的实体类。\n2. 使用 JPA 注解 `@Id` 编码\
  \ `{id}` 属性修饰符。\n3. 为任何表示引用属性功能类型的属性修饰符（如 `{manyToOne}`）编码相应的 JPA 注解，例如 `@ManyToOne`。\n\
  4. 利用 Java Bean Validation 注解（或自定义验证注解）对模型中指定的完整性约束编码。\n5. 为多值属性编码 getters 和 setters\
  \ 以及 `add` 和 `remove` 方法。\n6. 将创建、检索、更新和删除存储管理操作编码为类级方法（class-level methods）。\n\
  7. 在创建和更新方法中 care 处理好反向关系的管理。\n\n这些步骤在接下来的 sections.  \n  private Set<Book> publishedBooks;\
  \  \n…\n}\n```\n\n`Publisher::publishedBooks` 属性的 `@OneToMany` 注解的 `mappedBy` 参数指定了\
  \ `Book` 类中实现 `@ManyToOne` 关系的属性：\n\n```\n @Entity\npublic class Book {\n  …\n \
  \ @ManyToOne( fetch=FetchType.EAGER)\n  @JoinColumn( name=\"PUBLISHER_NAME\")\n\
  \  private Publisher publisher;\n  …\n}\n```\n\n在 `Author` 类中，我们添加 `authoredBooks`\
  \ 属性并使用对应 `Book` 类中 `@ManyToMany` 的 `@ManyToMany` 注解，表示反向关系：\n\n```\n @Entity\n\
  public class Author {\n…\n@ManyToMany( fetch=FetchType.EAGER, mappedBy=\"authors\"\
  )\nprivate Set<Book> authoredBooks;\n…\n}\n```\n\n`Author` 类 `authoredBooks` 引用属性的\
  \ `@ManyToMany` 注解的 `mappedBy` 属性指定了 `Book` 类中反向引用属性的名称：\n\n```\n @Entity…\npublic\
  \ class Book {\n  …\n  @ManyToMany( fetch=FetchType.EAGER)\n  @JoinTable( name=\"\
  books_authors\",\n  joinColumns = {@JoinColumn( name=\"BOOK_ISBN\")},\n  inverseJoinColumns\
  \ = {@JoinColumn( name=\"AUTHOR_PERSONID\")})\nprivate Set<Author> authors;\n…\n\
  }\n```\n\n我们还使用 `@JoinTable` 注解来指定多对多关系的连接表以及连接表的相应的列名，例如，表名为 `books_authors`，列名为\
  \ `BOOK_ISBN` 和 `AUTHOR_PERSONID`。\n\n#### 9.2.4 编码 Setter 操作\n\n任何耦合到派生反向引用属性（实现双向关联）的引用属性的\
  \ setter，现在也需要向反向属性的对应值（set）赋值/添加/移除反向引用。此类 setter 的示例是下面的 `setPublisher` 方法：\n\n\
  ```\n public class Book {\n…\npublic void setPublisher( Publisher publisher) {\n\
  // remove the book reference from publisher.publishedBooks\nif (this.publisher !=\
  \ null) {\nthis.publisher.removePublishedBook( this);\n}\n// add the book to publisher.publishedBooks\n\
  if (publisher != null) {\npublisher.addPublishedBook( this);\n}\nthis.publisher\
  \ = publisher;\n}\n}\n```\n\n#### 9.2.5 编码 Add 和 Remove 操作\n\n对于任何耦合到派生反向引用属性的多值引用属性，`add`\
  \ 和 `remove` 方法也必须向反向属性（其值集）赋值/添加/移除相应的引用。\n\n例如，对于耦合到 `Author` 类中派生反向引用属性 `Author::authoredBooks`\
  \ 的多值引用属性 `Book::authors`，以实现 `Book` 和 `Author` 之间的双向作者关联，`addAuthor` 方法编码如下：\n\n\
  ```\n public class Book {\n…\npublic void addAuthor( Author author) {\nif (this.authors\
  \ == null) {\nthis.authors = new HashSet<Author>();\n}\nif (!this.authors.contains(\
  \ author)) {\n// add the new author reference\nthis.authors.add( author);\n// add\
  \ the derived inverse reference\nauthor.addAuthoredBook( this);\n}\n}\n}\n```\n\n\
  对于移除操作 `removeAuthor`，我们获得以下代码：\n\n```\n public class Book {\n…\npublic void removeAuthor(\
  \ Author author) {\nif (this.authors != null && author != null &&\nthis.authors.contains(\
  \ author)) {\n// delete the author reference\nthis.authors.remove( author);\n//\
  \ delete the derived inverse reference\nauthor.removeAuthoredBook( this);\n}\n}\n\
  }\n```\n\n记住，对于 Java 集合（Collection），如 Set 或 List，`contains` 方法通过使用对象的 `equals` 方法来比较对象。例如，为了在\
  \ `Author` 类中对 `Set<Authors>`（如 `publishedBooks`）使用 `contains` 方法，我们实现了以下 `equals`\
  \ 方法（如果两个作者的 `personId` 属性值相等，则它们相等）：\n\n```\n public class Author {\n…\n@Override\n\
  public boolean equals( Object obj) {\nif (obj instanceof Author) {\nAuthor author\
  \ = (Author) obj;\nreturn ( this.personId.equals( author.personId));\n} else return\
  \ false;\n}\n…\n}\n```\n\n#### 9.2.6 处理删除依赖关系\n\n\n\n\n当一个 `Book` 实例 `b`（具有指向 `Publisher`\
  \ 实例 `p` 的单一引用 `b.publisher` 以及多个指向 `Author` 实例引用 `b.authors`）被销毁时，必须先移除派生的反向引用（例如通过从\
  \ `p.publishedBooks` 中移除 `b`）。这通过调用单值和多值属性的 set 方法并传入 `null` 参数来实现，例如在 `Book.delete`\
  \ 方法中调用 `b.setPublisher(null)` 和 `b.setAuthors(null)`：\n\n```java\n public class\
  \ Book {\n…\npublic static void delete( EntityManager em,\nUserTransaction ut, String\
  \ isbn) throws Exception {\nut.begin();\nBook b = em.find( Book.class, isbn);\n\
  b.setPublisher( null);\nb.setAuthors( null);\nem.remove( b);\nut.commit();\n}\n\
  }\n```\n\n同样，在删除 `Publisher` 或 `Author` 实例时，我们也必须删除对 `Book` 实例的引用：\n\n```java\n\
  \ public class Author {\n…\npublic static void delete( EntityManager em,\nUserTransaction\
  \ ut, Integer personId) throws Exception {\nut.begin();\nAuthor a = em.find( Author.class,\
  \ personId);\na.setAuthoredBooks( null);\nem.remove( a);\nut.commit();\n}\n}\n```\n\
  \n同样地，\n\n```java\n public class Publisher {\npublic static void delete( EntityManager\
  \ em,\nUserTransaction ut, String name) throws Exception {\nut.begin();\nPublisher\
  \ p = em.find( Publisher.class, name);\np.setPublishedBooks( null);\nem.remove(\
  \ p);\nut.commit();\n}\n}\n```\n\n### 9.2.7 实体管理器与缓存实体\n\n遗憾的是，JPA 不提供对派生反向引的自动维护。根据\
  \ Java Persistence Wiki，我们必须在 `set/add/remove` 方法中实现（直接和反向）关系的管理：\n\n> 双向关系中的一个常见问题是应用程序更新了关系的一侧，但另一侧没有更新，导致数据不同步。在\
  \ JPA 中，就像在普通 Java 中一样，维护关系是应用程序或对象模型的责任。如果你的应用程序向关系的一侧添加了内容，那么它也必须向另一侧添加。这通常通过对象模型中的\
  \ add 或 set 方法来解决，这些方法会处理关系的两个侧，这样应用程序代码就不需要担心这个问题。处理这个问题有两种方法：你可以只将关系维护代码添加到关系的一侧，并仅使用该侧的\
  \ setter（例如将另一侧设为 protected），或者将其添加到双侧，并确保避免无限循环。\n\n我们为每个控制器类使用了一个实体管理器（entity\
  \ manager）。每个实体管理器都维护一个缓存实体集合，可以通过 `merge` 方法与其他实体管理器“共享”。在我们的示例代码中，作为每个模型类创建和更新方法的一部分，我们必须合并属于另一个实体管理器的那些已更新的实体。例如，在\
  \ `Book.create` 方法中，我们需要合并新书籍的出版者（由 `PublisherController` 的实体管理器管理）以及其所有的作者（由 `AuthorController`\
  \ 的实体管理器管理）：\n\n```java\n public class Book {\npublic static void create( EntityManager\
  \ em,\nUserTransaction ut,\nString isbn, String title, Integer year,\nPublisher\
  \ publisher, Set<Author> authors)\nthrows Exception {\nut.begin();\nBook book =\
  \ new Book( isbn, title, year,\npublisher, authors);\nem.persist( book);\nif (publisher\
  \ != null) {\nem.merge( publisher);\n}\nif (authors != null)\nfor (Author a : authors)\
  \ {\nem.merge( a);\n}\n}\nut.commit();\n}\n}\n```\n\n如果不使用 `merge`，出版者以及 `authors`\
  \ 列表中的所有作者实例将不会代表对原始缓存实体的引用，并且不会保留我们的更改。更多细节请查阅与此事项相关的 Java Persistence 文档。\n\n\
  也可以禁用 JPA 缓存，这样每次创建新实例都会从数据库重新加载实体，例如当调用 `EntityManager.find` 方法时。这可以通过 `persistence.xml`\
  \ 文件中添加以下行来实现：\n\n```xml\n <property name=\"eclipselink.cache.shared.default\" value=\"\
  false\"/>\n```\n\n上述配置适用于 `eclipselink` 实现，对于其他 API 实现可能会有所不同。注意，如果没有严重原因，不建议禁用实体缓存，因为这会降低应用的性能，并在某些情况下（例如使用\
  \ `@SessionScoped` 管理的实体）可能会产生不可预知的行为。\n\n### 9.3 在用户界面中利用派生反向引用属性\n\n我们现在可以利用派生反向引用属性\
  \ `Publisher::publishedBooks` 和 `Author::authoredBooks`，在*检索/列出所有出版者*和*检索/列出所有作者*用例中更高效创建关联书籍列表。\n\
  \n#### 9.3.1 在检索/列出所有中显示书籍信息\n\n为了在*检索/列出所有出版者*用例中显示已书籍的信息，我们现在可以利用派生反向引用属性 `publishedBooks`：\n\
  \n```xml\n <ui:composition template=\"/WEB-INF/templates/page.xhtml\">\n<ui:define\
  \ name=\"content\">\n<h:dataTable value=\"#{publisherController.publishers}\" var=\"\
  p\">\n…\n<h:column>\n <f:facet name=\"header\">Published books</f:facet>\n  <h:outputText\
  \ value=\"#{p.publishedBooks}\" escape=\"false\"\n  converter=\"pl.m.converter.BookListConverter\"\
  />\n  </h:column>\n </h:dataTable>\n <h:button value=\"Back\" outcome=\"index\"\
  \ />\n</ui:define>\n</ui:composition>\n```\n\n在单向关联的情况下，针对*检索/列出所有书籍*用例，我们在 `Book`\
  \ 模型类中使用了一个方法，即 `getAuthorNames()`，它返回一个用逗号分隔的作者名称字符串列表：\n\n```java\n public class\
  \ Book {\n …\n public String getAuthorNames() {\n String result = \"\";\n int i\
  \ = 0, n = 0;\n if (this.authors != null) {\n n = this.authors.size();\n for (Author\
  \ author : this.authors) {\n result += author.getName();\n if (i < n - 1) {\n result\
  \ += \", \";\n }\n i++;\n }\n }\nreturn result;\n}\n}\n```\n\n这对于书籍的情况来说是合理的，因为作者的数量通常限制在较小范围内。然而，一个\
  \ `Publisher` 可能有大量的出版书籍。相比字符串序列化，更好的替代方案是使用 JSF 转换类，它允许我们以自定义的方式展示作者列表。在我们的案例中，选择以列表形式展示，每个名称单独占一行。为此，我们实现了\
  \ `pl.m.converter.BookListConverter` 类，并按如下方式对其添加了 `@FacesConverter` 注解：\n\n```java\n\
  \ @FacesConverter( value=\"pl.m.converter.BookListConverter\")\npublic class BookListConverter\
  \ implements Converter {\n@Override\npublic Object getAsObject( FacesContext context,\n\
  UIComponent component, String value) {\nreturn null; // 此方法不需要\n}\n@Override\npublic\
  \ String getAsString( FacesContext context,\nUIComponent component, Object value)\
  \ {\nString result = \"\";\nint i=0, n=0;\nif (value == null) {\nreturn null;\n\
  } else if (value instanceof Set<?>) {\nn = ((Set<Book>) value).size();\nfor (Book\
  \ b : (Set<Book>) value) {\nresult += b.getTitle();\nif (i < n-1) {\nresult += \"\
  <br />\";\n}\ni++;\n}\n}\nreturn result;\n}\nreturn null;\n}\n}\n```\n\n然后，我们在 facelet\
  \ 中使用 `converter` 属性来指定在渲染相应的视图组件时使用我们的转换类，例如 `pl.m.converter.BookListConverter`：\n\
  \n```xml\n <h:column>\n<f:facet name=\"header\">Published books</f:facet>\n<h:outputText\
  \ value=\"#{p.publishedBooks}\" escape=\"false\"\nconverter=\"pl.m.converter.BookListConverter\"\
  />\n</h:column>\n```\n\n由于序列化文本包含 HTML 元素，即用于产生 HTML 换行的 `<br />`，我们必须指定 `escape=\"\
  false\"` 属性，否则 `<` 和 `>` 将被替换为相应的实体 `&lt;` 和 `&gt;`。\n\n\n\n\n\n使用 JSF 转换器的主要优势是我们没有将模型代码与视图特定的代码混合，因此我们的模型类保持了整洁。以后，如果我们想将\
  \ JSF 替换为其他 UI 技术，我们的模型类保持不变，我们只需要为新技术准备相应的转换器。\n\n## 9.4 运行应用并获取代码\n\n运行你的应用程序之前，你可能需要先停止\
  \ Tomcat/TomEE 服务器（Windows 使用 `bin/shutdown.bat`，Linux 使用 `bin/shutdown.sh`）。接下来，下载并解压我们的\
  \ ZIP 压缩包，其中包含了应用程序的所有源代码，以及你需要编辑的 ANT 脚本文件（修改 `server.folder` 属性值）。现在，在控制台或终端中执行以下命令：\n\
  \n```\nant deploy -Dappname=BidirectionalAssociationApp\n```\n\n最后，启动你的 Tomcat Web\
  \ 服务器（Windows 操作系统使用 `bin/startup.bat`，Linux 使用 `bin/startup.sh`）。请耐心等待，取决于你电脑的速度，可能需要一些时间。最后，打开浏览器并输入：\n\
  \n```\n http://localhost:8080/BidirectionalAssociationApp/WebContent/views/app/index.xhtml\n\
  ```\n\n## 10 关联的特殊主题\n\n### 10.1 部分整体关联 (Part-Whole Associations)\n\n部分整体关联表示部分类型与整体类型之间的关系。它的实例是两个对象之间的部分整体关系，其中一个对象是另一个对象（整体）的部分。UML\
  \ 将部分整体关联分为两种类型：`aggregation`（聚合）和 `composition`（组合）。虽然这两个术语在 UML 中以一种相当精确但并不尽意的方式进行了定义，但许多软件开发者遵循\
  \ C++ 编程社区的术语传统，对它们有不同的解释：与“聚合”中的部分不同，“组合”中的部分不能脱离引用它们的复合体而独立存在。\n\n我们遵循 UML，并通过引入两种组合之间的区别，改进了它们对“组合”的定义：具有\
  \ `separable`（可分离）部分的组合和具有 `inseparable`（不可分离）部分的组合。\n\n#### 10.1.1 聚合 (Aggregation)\n\
  \n聚合是部分整体关联的一种特殊形式，其中整体的部分可以与其他整体共享。例如，我们可以对 `DegreeProgram`（学位课程）和 `Course`（课程）类之间的聚合进行建模，如下图所示，因为课程是学位课程的一部分，而且课程可以在两个或多个学位课程之间共享（例如，工程学位可以与计算机科学学位共享门\
  \ C 语言课程）。\n\n![](img/b_9783110500325-010_ingr_001.png)\n\n然而，具有 `shareable parts`\
  \ 的聚合概念实际上并没有太大意义，因此它对如何编写该关联没有任何影响。因此，许多开发者倾向于不在他们的类图中使用白色菱形，而是仅建模一个普通的关联。UML 规范说：“共享聚合的精确语义取决于应用领域和建模者”。\n\
  \n聚合关联在整体侧的端点 `multiplicity`（乘数性/多重性）可以是任何数字（`*`），因为一个部分可能属于或 `shared` 任意数量的整体。\n\
  \n#### 10.1.2 组合 (Composition)\n\n关于部分整体关联概念 `aggregation` 和 `composition` 之间的区别，存在如此多的困惑，真是令人惊讶。主要问题在于广泛的误解（即使在专家软件开发人员和\
  \ UML 作者之间也是如此），认为“组合”概念意味着整体与其部分之间存在生命周期依赖，导致部分在没有整体的情况下无法。但这种观点忽略了事实：也存在具有不可共享部分的部分整体关联，这些部分可以从整体中分离并在整体销毁后生存。\n\
  \n在 UML 规范文档中，“组合”一词的定义一直暗示了不可共享的部分，但并不清楚“组合”的定义性特征是什么，哪些又仅仅是可选的特征。即使在 UML 2.5 版本（截至\
  \ 2015 年），在尝试改进“组合”一词的定义后，它仍然是模糊的，没有提供如何对具有不可共享部分的部分整体进行建模（即部分可以脱离并在整体破坏后生存，对比部分无法分离并随整体一起销毁的情况）。他们说：\n\
  \n> 如果复合对象被删除，其所有作为对象的部分实例也将随之被删除。\n\n但同时他们又说：\n\n> 部分对象可以在复合对象被删除之前从复合对象中移除，从而不会作为复合对象的一部分被删除。\n\
  \n这种困惑指向了 UML 定义的不完全性，它没有考虑到组件和复合体之间的生命周期依赖。因此，理解如何增强 UML 定义是非常重要的，例如通过引入用于 «inseparable»组合的\
  \ UML 态型（stereotype），或通过引入约束关键字 `inseparable` 来表征组件侧的关联端。\n\n正如 Martin Fowler 所解释的，刻画组合关系的主要问题是“一个对象只能是一个一个组合关系的部分”。这在\
  \ G. Bellekens 的博客文章《UML Composition vs Aggregation vs Association》中也得到了解释。除了组合的这种定义特征（拥有\
  \ `exclusive` 唯一的或 `non-shareable` 不共享的部分）外，组合还可能伴随着复合体与其组件之间的生命周期依赖。事实上，有两此类依赖：\n\
  \n1. 每当组件 `must always be attached`（必须连接到）复合体时，或者说，当它具有 `mandatory composite`（强制复合体，如复合体侧的“恰一个”多重性所示）时，它必须在另一个复合体中复用（或重新连接），或者在当前复合体销毁时被删除。`Person`\
  \ 和 `Heart`（心脏）之间的组合说明了这一点。当所有者去世时，心脏要么被删除，要么移植另一个人。\n\n2. 每当组件 `must not be detached`（不能从复合体中分离），或者说，当它是\
  \ `inseparable`（不可分离的）时，那么只有在复合体销毁时，组件才会被删除。这种具有不可分离部分的组合示例是 `Person` 和 `Brain`（大脑）之间的组合。\n\
  \n![](img/b_9783110500325-010_ingr_002.png)\n\n总结来说，由不可分离部分创建的生命周期依赖仅适用于组合的特定情况，而不是一般的。因此，它不是定义特征。UML\
  \ 规定：“部分可以在复合实例被删除之前从复合实例中移除，从而不会作为复合实例的一部分被删除。”\n\n当这种生命周期依赖适用时，它代表了 *Existential\
  \ Dependency*依赖的一种特殊形式，这暗示了第 1.2 节中讨论的级联删除策略。\n\n在 `Car-Engine` 组合的示例中（如下所示），显然引擎可以在汽车销毁之前从汽车上分离，在这种情况下，引擎不会被删除并可以复用。这由组合线复合侧的“零或一”多重性暗示。\n\
  \n![](img/b_9783110500325-010_ingr_003.png)\n\n组合关联在复合侧的端点 `multiplicity` 是 1 或\
  \ 0..1，取决于组件是否具有强制性的复合体。当然，组件不可分离的事实意味着它具有强制复合体，因此复合体多重性必须是 1。\n\n#### 10.1.3 示例\n\
  \n\n\n\n作为部分整体关联（part-whole association）的一个示例，我们考虑教材与其章节之间的关联。通常情况下，教材的一个章节在不经过修改的情况下无法重用到另一本书中（例如，因为它可能会引用该教材的其他部分）。此外，允许存在不属于任何教材的章节是没有意义的。因此，我们将这种关联建模为不可分割的组合（inseparable\
  \ composition），如图所示。\n\n![](img/b_9783110500325-010_ingr_004.png)\n\n表示不可分割组件类型的对象类（如\
  \ `Chapter`）不需要具有标准的标识符属性，因为不需要让不可分割组件对象独立于其复合对象被引用。为了引用不可分割组件对象，使用一个复合键，该复合键由复合类型的主键和组件类型的适当（相对唯一的）属性组成。例如，教材章节是通过教材的\
  \ `ISBN` 和章节的序号组合来引用的。\n\n由于 `Chapter` 对象作为 `Textbook` 对象的不可分割组件，当其 `Textbook` 对象消失时无法继续存在，因此在\
  \ `Delete Textbook` 操作的实现中，我们需要使用 `CASCADE` 级联删除策略，要求在删除教材的同时删除所有相关的章节。\n\n不可分割组件类型不需要它自己的\
  \ CRUD 数据管理用户界面。相反，其所有的 CRUD 操作都在其复合类型的数据管理用户界面中提供。例如，创建、检索、更新和删除教材章节是在管理教材数据的界面中完成的。\n\
  \n### 10.2 关联类 (Association Classes)\n\n关联类是一种表示关联的类。\n\n回想一下，简单关联在面向对象 OO 类模型中通过将其转换为相关对象类的引用属性（reference\
  \ properties）被消除，如第 1.7 节所示。但只要关联具有属性，它就无法被消除，并且在 OO 类模型中必须转换为一个类。\n\n例如，考虑对象类型\
  \ `Book` 和 `Person` 之间的关联 `Reservation`，它允许表达诸此类事实，例如“`ISBN` 为 3627921105 的书被 ID\
  \ 为 4701199 的人于 2020-08-22 预订了”。由于它有一个属性 `date`，该关联在信息设计模型中被建模为关联类，如下类图所示：\n\n![](img/b_9783110500325-010_ingr_005.png)\n\
  \n在 OO 类模型中（这是编写应用程序模型类的基础），关联类被转换为普通类，并带有引用相关对象类的引用属性。例如，关联类 `Reservation` 被转换为以下\
  \ OO 模型类：\n\n![](img/b_9783110500325-010_ingr_006.png)\n\n## 11 双向关联 实践项目\n\n所有项目都包含以下任务：\n\
