  \            </h:column>\n        </h:dataTable>\n      <h:button value=\"Back\"\
  \ outcome=\"index\" />\n    </ui:define>\n  </ui:composition>\n```\n\n记得使用 `b.authorNames`\
  \ 会在给定的 `b` 对象上调用名为 `getAuthorNames` 的方法。\n\n#### 5.5.2 在创建时允许选择关联对象\n\n为了在“创建书籍”用例中允许选择多个作者与书籍关联，一个多选列表（带有\
  \ `multiple=\"multiple\"` 的 select 元素，如下下面的 facelet 代码所示）将用关联对象类型的实例填充。以下代码是 `WebContent/views/books/`\
  \ 文件夹下 `create.xhtml` 视图文件的一部分：\n\n```\n <ui:composition template=\"/WEB-INF/templates/page.xhtml\"\
  >\n    <ui:define name=\"content\">\n        <h:form id=\"createBookForm\">\n  \
  \          <h:panelGrid columns=\"3\">\n             …\n             <h:outputLabel\
  \ for=\"authors\" value=\"Authors:\"/>\n             <h:selectManybox id=\"authors\"\
  \ value=\"#{book.authors}\">\n                 <f:selectItems value=\"#{bookController.authors}\"\
