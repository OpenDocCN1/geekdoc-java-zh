  \ `b` 可以被销毁。\n\n#### 1.10.5 问题 5：渲染单值引用属性\n\n\n\n\n\n关于 `single-valued` 引用属性 `p`\
  \ 以及它如何通过合适的表单控件在 Web 用户界面中进行渲染，以下哪些陈是正确的？选择一个或多个：\n\n1. ☐ 使用 `type=\"text\"` 的输入控件可以获得适当的渲染。\n\
