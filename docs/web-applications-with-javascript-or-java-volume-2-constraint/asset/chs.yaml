  \n```\nhttp://localhost:8080/UnidirectionalAssociationApp/WebContent/views/app/index.xhtml\n\
  ```\n\n### 5.7 引用属性值的集合与有序集合的区别\n\n回想一下，`set` 是一个具有唯一元素的无序集合，而 `list` 是一个可能包含相同元素的有序集合。\n\
  \n当非功能性关联端是 `ordered`（有序的）时，例如图 5.1 中类图所示 `Book::authors`，这意味着对应的引用属性的范围需要是一个有序集合类型，例如\
  \ Java 集合接口类型 `SortedSet` 和 `List`。\n\n![](img/b_9783110500325-005_fig_001.png)\n\
  \n图 5.1：一个集合值的引用属性 `authoredBooks` 和一个有序集合值的引用属性 `authors`。\n\n在理论上，集合值的引用属性应该使用\
  \ `Set<T>` 定义，例如将 `Set<Book>` 声明为 `Author::authoredBooks` 的范围；而有序集合值的引用属性应该使用 `SortedSet<T>`\
  \ 定义，例如将 `SortedSet<Author>` 声明为 `Book::authors` 的范围。Java 接口类型 `Set` 通常由 Java 类\
  \ `HashSet` 实现，而 `SortedSet` 通常由 `TreeSet` 实现。\n\n然而，如果不担心避免重复元素，集合值和有序集合值的引用属性都可以使用泛型接口类型\
  \ `List<T>` 作为其范围，该类型通常由 `ArrayList` 实现。\n\n当主要的用用例是向集合中添加元素并在以后对它们进行迭代时，最佳选择是使用\
  \ `ArrayList` 实现的 `List`，它比 `LinkedList` 或任何 `Set` 的实现都更节省内存，并且具有快速插入、迭代和随机访问的特性。使用\
  \ `HashSet` 仅在集合中查找元素的用例中才能提供性能优势。\n\n## 6 单向关联实践项目\n\n所有项目都包含以下任务：\n\n1. 根据给定的设计模型创建一个派生的面向对象类模型（OO\
