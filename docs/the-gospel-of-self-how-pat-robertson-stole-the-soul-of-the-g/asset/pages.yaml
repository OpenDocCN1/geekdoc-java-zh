  md: '1988, I helmed every part of what we put on TV, the result of which was a very
    deliberate and profound turning of the Republican Party to the right.


    We knew exactly what we were doing, too. Armed with research at every step, we
    presented a form of Christianity that included getting involved in politics at
    every level. God wanted us to wrest away from those who were destroying the Christian
    foundation of the country, and Virginia Beach was the most appropriate location
    from which to do it. It was here, after all, when English settlers first landed
    in the new world and planted a cross on the beach, dedicating it to “our Lord
    and savior, Jesus Christ.” There is a monument to this 1607 at the northern end
    of Virginia Beach, where the settlers originally set foot on the continent. They
    gave us all the authority we needed to finish the work that had begun before almost
    four centuries earlier.


    Everything we presented was done with a sense of urgency due to what we felt the
    pending return of Jesus Christ as prophesied in the Book of Revelation. Israel
    was the key to our understanding, for certain Christian teachings that Jesus won’t
    return until God gave Jerusalem to Israel, which had begun in 1948 when Zionists—through
    an executive order from the United Nations following World War II and the subsequent
    “war” against Arabs who disagreed—began to seize land, water, and structures from
    Arabs who had lived in the Holy Land for millennia. Now that Jerusalem was back
    on a map labeled “Israel,” we taught that the return of Jesus is imminent, and
    that we had to prepare. We claimed the role of John the Baptist in “preparing
    the way of the Lord,” which gave us license to say and do whatever we felt necessary
    in establishing God’s kingdom on earth.


    This belief was furthered by the words of many others and in books like 1970’s
    The Great Planet Earth and later in the Left Behind series of novels, which reference
    the re-establishment of Israel. We taught a literal interpretation of Jesus’ proclamation
    that, in the end, He will remember those who support Israel and aside aside who
    do not. It was simply the right thing to do in the wake of such strong, albeit
    convenient, evidence that a movement of God was underway in the United States.


    We certainly weren’t alone in this task. Billy Graham had been telling the story
    of salvation for decades and was the friend of presidents from Harry Truman to
    Barack Obama. Jerry Falwel and his Moral Majority'
  merge: -1
