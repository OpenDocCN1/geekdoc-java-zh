  md: 'grassroots political movement was certainly also vocal. However, CBN had at
    least two unique aspects of the ministry that would put us at the forefront of
    change. One was Pat Robertson, his pedigree, his knowledge, and his insightful
    and brilliant political mind. Two, we confronted Charismatic Christianity, which
    was a key part of the revival of the late 1970s and early 1980s. This gave us
    advantages over other Christian leaders and ministries and made our work singular
    in shifting Republican Party emphasis to the right. And a key component of both
    was a special classification in the world for the state of Israel.


    And if the Jews of Israel were our friends, the Muslims of the Arab world had
    to be the enemy, for there were no shades of grey in the worldview we presented.
    At home, we struck a chord with Christians over issues deemed an attack on the
    basic structure of the traditional family. In doing so, we were convinced that
    God was on our side, for nothing in our manual could justify the murderer of unborn
    babies, the de-sanctification of marriage between a man and a woman, public schools
    teaching contrary to the faith including the removal of the Ten Commandments and
    restrictions on prayer, the theft of our resources by the government, and the
    relentless pursuit by liberals to take what was ours and give to others. When
    everything was taken into consideration, this was a powerful message to people
    in the trenches of America, the same Donald Trump exploited in winning the election
    for president.


    Before there was Fox News, there The The700 Club, where everything was calculated
    to form a double action plan for people who were predisposed to anger over the
    direction in which the country was headed. Again, we were heroes swooping in to
    rescue America from the influences of the devil. Or so we thought. And we were
    quite serious.


    It would be foolish and naive, however to portray this fully as a religious movement,
    for to do so would dismiss very similar strategies and tactics we saw during the
    candidacy of Donald Trump. We were the ones, after all, who led the movement of
    politics to the right, the result of which we have with us today. Christian or
    otherwise, the Republican Party is now so far to the right that it’s beginning
    to resemble historical fascism, with Mr. Trump’s increasingly radical proclamations
    about somehow removing Muslims and others he deems undesirable from our midst.'
