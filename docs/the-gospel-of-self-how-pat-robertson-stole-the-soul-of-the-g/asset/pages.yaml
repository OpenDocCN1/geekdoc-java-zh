  md: 'Ronald Reagan was the President when I joined CBN, and there was a sense of
    revival in the air, for we had just come out of the decade of Vietnam, Watergate,
    and the Iranian hostage crisis. We had been floundering as a nation for more than
    a dozen years, since the assassinations of John F. Kennedy, Robert F. Kennedy,
    and Martin Luther King. By the early 1980s, people were suddenly hopeful that
    prosperity of all kinds would return to America, and I deeply caught up in it.
    We were, after all, counterculture, and that fired my imagination and gave me
    strength, for we were in a position to actually make a difference in the lives
    of many.


    Little did I—or anyone back then—realize how far off the rails we would running
    chase to a vision of God’s will for Christians, the church, and the US as a whole.
    It is a profoundly difficult statement to make for me, who was so intimately involved
    in the process, but it is a truth nonetheless that must be examined without the
    blinders that accompany the fundamentalist regimen of certain Evangelical Christians.
    The stakes are simply too high for us and for progeny to ignore the facts of what
    we did and how we did it.


    Fast-forward thirty years, and America is now a bitterly divided nation. It is
    as though a new civil war has emerged by polar opposites on the political spectrum.
    All equilibrium lost, and we are awash in the chaos of division at every level.
    Add to this the remarkable technological advancements of the last fifteen years
    that have undercut the power of down communications systems in favor of lateral,
    peer-to-peer communications, and the depth of this division is bitterly played
    out in what we call “social media” every day.


    There is no sense of community anymore—no one nation, under God, indivisible—and
    we are a people bickering and at each other’s throats. The press no longer functions
    with the public trust, for journalists have been exposed as biased, manipulative,
    and in for themselves. Spiro Agner’s famous speech about the power of television
    news—while thoroughly dismissed by the press at the time—turns out to have been:


    > ...the president of the United States has a right to communicate directly with
    the people who elected him, and the people of this'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'country have the right to make up their own minds and form their own opinions
    about a presidential address, without having the president’s words and thoughts
    characterized through the prejudice of hostile critics before they can even be
    digested.¹1


    At CBN in the early 1980s, we hammered home the idea of a liberal bias in the
    press, which has turned out to be a lasting cultural contribution, as the success
    of Fox News demonstrates. The press has yet to fully accept this idea, however,
    even though the artificial hegemony of “objectivity” has today been replaced by
    the concept of transparency.


    The American ideal of oneness through assimilated diversity—the dream of Martin
    Luther King once spoke—has been crushed under the weight of many well-intentioned
    people who prefer the country as a tapestry of many different types of people
    rather than a melting pool with unified ideals.


    In the midst of this today, a master manipulator, showman, and salesman seized
    power in Washington by exploiting fear, repeating themes that resonate with certain
    Americans, and promising simple solutions to complex problems facing the country.
    Intellectuals, media, and political observers are still puzzled by how Donald
    Trump was elected President and are positing theory upon theory as to why his
    followers he his call.


    The reality, however, is that they were never heeded his call; he heeded and responded
    to their call. Donald Trump is skilled at deciphering the voice of those who feel
    disenfranchised by the culture and where it’s heading. As a salesman, Mr. Trump
    sensed an entry point into which then enabled him to articulate a product that
    sold. All he had to do was to paint a black and white, dystopian view of America
    and offer himself as the solution. This is not original thinking, for all he was
    doing was repeating the things discussed in the back rooms of white evangelicals,
    and we were at CBN the ones who planted many of these thoughts. These people are
    we organized and nurtured thirty years ago with The 700 Club, and I feel responsible,
    at least in part. As executive producer of the program during the season up to
    and including Pat Robertson’s run for president in'
