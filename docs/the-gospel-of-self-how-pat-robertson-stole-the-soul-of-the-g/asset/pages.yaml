  md: 'This is my story. It’s one that begins with a quest to be more spiritual and
    ends with the realization that life is all about becoming more human. Along the
    way, I had a front-row seat as a participant in one of the most exciting, important,
    and, it turns out, potentially destructive social movements in human history.


    How does one love something so much and yet hate it at the same time?'
