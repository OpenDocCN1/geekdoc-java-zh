    The look on her face would have frozen a raging inferno if it hadn’t been for
    the steam rising from her head. I had never seen her so angry, and so she was
    enraged. Her wrath was directed at me for bringing in consultants from AR&D in
    Dallas to advise us on everything. Obviously, “her girls”—the hair and makeup
