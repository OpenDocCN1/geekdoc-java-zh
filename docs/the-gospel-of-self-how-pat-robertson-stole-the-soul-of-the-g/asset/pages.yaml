- img_proc: true
  md: '“We have probably the finest forecasting and budgeting processes in the evangelical
    world, but it is impossible to forecast an atomic explosion,” Robertson said on
    his television program, The 700 Club. “We had nothing to do with any of it.”


    He said the PTL scandal and the Rev. Oral Roberts’ ‘life-or-death’ appeal for
    money cost Robertson’s Christian Broadcasting Network $12 million in contributions
    so far and probably would drain $28 million by the end of the year.


    “In the history of American Christianity, we have never seen anything like this,”
    said Robertson, who is considering a run for Republican presidential nomination.
    “That scandal has hit the evangelical world like a bombshell.”15


    This businesslike action by the ministry caused a monumental problem for me as
    Pat Robertson’s executive producer, for in reality I had virtually none of the
    authority I was promised during that lunch with Pat. Despite all the talk of “faith,”
    we exhibited the opposite in a time of crisis, and I don’t believe it reflected
    well on us, as a ministry, by our calling, or as those “men with knowledge of
    the times.” We were hypocrites, and it was just beginning.


    Pat Robertson’s calling to run for president “of God” or not? The evidence suggests
    not, but it hasn’t all been collected just yet. History will have its say. The
    more important matter to me is whether the man’s ministry was behind the calling
    or not. Behavior always trumps proclamations of faith, and the behavior of the
    executive team and the board of directors in the wake of Pat’s actual candidacy
    was not in line with what we had declared our mission, our teachings, and our
    ministry.


    As we say and believe in Alcoholics Anonymous, “either God is everything or else
    He is nothing, God either, or He isn’t. What was our choice to be?” CBN made the
    decision, and the faithful had no choice but to follow its lead.


    And it certainly didn’t make my job any easier in coming back, for I was by now
    the master of a clearly sinking ship. I was trapped. I knew it. And there was
    nothing I could do except pray for guidance and plunge myself deeply into the
    task at hand.'
  merge: -1
  pgno: 93
- img_proc: true
  md: 'The public spotlight was on every ministry, and murmuring and fear covered
    the CBN campus in ways that were terribly unhealthy. One of the first events after
    I got back was concern expressed by certain contributors and subsequently managers
    over the behavior of co-host Danuta Soderman''s husband, Kai Soderman. I was told
    that he was suspected of approaching major donors with his own big money development
    projects, which was definitely not all right with those who oversaw fundraising
    for CBN. It reflected badly on Danuta, who was having an internal crisis of hers
    at the time. She described it in her book Chiseled: A Memoir of Identity, Duplicity,
    and Divine Wine:


    I needed a break during Pat''s campaign. I felt useless, a fixture on a political
    show pieced together at the last minute on Robertson''s whims. For months, Pat
    disregarded the preparations of the show''s producers, running into the studio
    at the last minute, haranguing the audience with thirty-minute off-the-cliff speeches,
    while Ben and I sat nodding and smiling, trying to look interested.


    When I expressed my concerns, Terry understood. “I know it''s frustrating, Danuta.
    I''m the one tossing out schedules and rearranging formats. I don''t even know
    what the show is, and I''m the producer.” He shrugged his shoulders back and readjusted
    his tie.


    I told Terry that I believed my tenure at CBN had run its course and that Kai
    and I were thinking of moving back to California. He looked alarmed. “Don''t make
    any hasty plans,” he said. “All you need is some time off. You''re tired. Take
    a break, go to the beach. You''ll feel better when you get back. But promise me
    you won''t make any sudden decisions.


    With the promise, Kai and I took a week to rest and relax and to evaluate my role
    at CBN.”16


    I looked alarmed to Danuta, because I was terribly alarmed. Danuta was a professional
    journalist before she became a Christian, and she was my confidante and friend.
    We were kindred spirits and shared many of the same concerns about the line between
    right and wrong in the dissemination of'
  merge: -1
  pgno: 94
- img_proc: true
  md: 'information. While CBN in many ways pioneered point-of-view journalism, pioneers
    are the people in history who end up with arrows in their backs, and that metaphor
