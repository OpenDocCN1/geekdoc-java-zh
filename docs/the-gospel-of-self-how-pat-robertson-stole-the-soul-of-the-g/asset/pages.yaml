  md: 'You can see this in newspapers’ early pushback against blogging. We were told
    that bloggers have agendas, whereas journalists give us objective information.
    Of course, if you don’t think objectivity is possible, then you think that the
    claim of objectivity is actually hiding the biases that inevitably are there.
    That’s what I meant when, during a bloggers press conference at the 2004 Democratic
    National Convention, I asked Pulitzer-prize winning journalist Walter Mears whom
    he was supporting for present. He replied (Paraphrasing!), “If I tell you, how
    can you trust what I write?” to which I replied that if he doesn’t tell us, can
    we trust what he blogs?


    So, that’s sense in which transparency is the new objectivity. What we used to
    believe now believe because we thought the author was objective because we can
    see through the author’s writings to the sources and values that brought her to
    that position. Transparency gives the reader information by which she can undo
    some of the unintended effects of the ever-present biases. Transparency brings
    us to reliability the way objectivity used to. This change is epochal.


    Objectivity used to be presented as a stopping point for belief: If the source
    is objective and well-informed, you have sufficient reason to believe. The objectivity
    of the reporter is a stopping point for reader’s inquiry. That was part of high-end
    newspapers’ claimed value: You can’t believe what you read in a slanted tabloid,
    but your news is objective, so your inquiry come to rest here. Credentialing systems
    have the same basic rhythm: You can stop your quest once you come to a credentialed
    authority who says, “I got this. You can believe it.\” End of story.


    We thought that was how knowledge works, but it turns out that it’s really just
    how paper works. Transparency prospers in a linked medium, for you can literally
    see the connections between the final draft’s claims and what it informed. Paper,
    on the other hand, sucks at links. You can look up the footnote, but that’s an
    expensive, time-consuming activity more likely to result in failure than success.
    So, during the Age of Paper, we got used to the idea'
