  md: '# One


    # The Seeds of Modern Discontent


    > The modern conservative is engaged in one of man’s oldest exercises in moral
    philosophy; that is, the search for a superior moral justification for selfishness.

    —John Kenneth Galbraith


    The evangelist’s message has always been self-centered, for it preaches the gospel
    as a means to saving one’s own ass from eternal hellfire and damnation. Evangelical
    Christianity has refined the message over the years and turned it today the means
    for blessings in this life as well. What was once a powerful motivator for overall
    good behavior in the community has become a motivator for obtaining a better position
    in life, and it has profoundly altered everything in our society from our politics
    to our treatment of our neighbors. I helped bring this about, for I worked alongside
    one of the most influential evangelists of modern history.


    Marion Gordon “Pat” Robertson is a political animal that happens to be a Christian
    evangelist, broadcaster, and television personality. Political smarts flow through
    his veins as surely as the blood that sustains his body. He was born and raised
    in the midst of a powerful Virginia political family. His father, Absalom Wallis
    Robertson, was a conservative Democrat—a Diexcat of the Senator Robert Byrd ilk—serving
    in both the House and the Senate, and Pat was groomed to follow in his footsteps,
    attending the prestigious McDonogh Preparatory School before Washington and Lee
    University and eventually Yale Law School. He also served a stint in the Marine
    Corps as a first lieutenant.'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'Pat Robertson never passed the bar exam, but instead had a religious conversion.
    He went to New York Theological Seminary, receiving a Masters in Divinity in 1959.
    A year later he established the Christian Broadcasting Network (CBN) in Portsmouth,
    Virginia. He has built a massive television empire and is one of the most controversial
    Evangelical Christians on TV, where he practices the charismatic “gifts of the
    spirit,” including speaking in tongues and signs and wonders such as “healing.”
    But the political animal continued to seek the surface throughout his television
    ministry, and this would play a huge role in my own life and in the political
    dynamics of the Republican Party, one that continues to this day.


    When I worked with him in the 1980s, we practiced and promoted a brand of Charismatic
    Christianity that was seen as a breath of fresh air to a faith that had grown
    stable in every aspect, from its music to its preaching, and we worked long, hard
    hours to move hearts and souls in the way we felt right. In doing so, we altered
    the course of political power in the United States, and it was natural as our
    Christian calling. Taking on social issues formerly held by conservative Democrats,
    such as the sanctity of life, religious liberties, patriotism, family, school
    prayer, and respect for individualism and tradition, we spoke to primarily rural
    and suburban Christians on behalf of the Republican Party. We presented Biblical
    mandates or “laws” economic views that catered to the haves of culture, teaching
    that one of the halves was available for everybody. Our arguments and teachings
    helped move the GOP to the right on the political spectrum and created a following
    that continues to baffle the smartest political analysts in the country who are
    confounded by how people would act against their own best interests in giving
    power to Republicans.


    Pat Robertson was a highly intelligent, articulate, well-read, creative, and brilliant
    man to work for. There wasn''t a day that I didn''t admire his ability to communicate
    via live television. The more prepared I was, the better I was able to perform.
    I was a willing participant in his social engineering, I agreed with him that
    the world was going to hell, and I was proud to be at his side in trying to change
    that. And it didn’t matter one to me that we crossed lines along the way. I was
    an experienced news executive, and I knew right from wrong when it came to journalism
    and the narratives of liberty.'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'I used that knowledge to bring our daily message right up to the edge of both
    ethics and the law without embarrassing ourselves. It turned out that my efforts
    could not protect us from what happened outside my purview. Many hands were involved
    in our political efforts, and it became evident that they weren''t guided by the
    same principles we tried to apply to The 700 Club.


    Moreover, there is a vast difference, I discovered, between what we believed and
    did what the students would do with what we taught them. This is why I don''t
    fear conservative leaders in the world today, but I''m frightened to death by
    their followers. We broke the law. We stretched the truth. Why would we be surprised
    or complain if our followers did likewise? Our attempts to manage a political
    movement trapped us in the belief that God needed us and our work in order to
    accomplish change the hearts of humankind. We organized human efforts to change,
    and that is an untenable position for those attempting publicly to do the work
    of God.


    I do not know how to adequately justify this dichotomy in my own thinking and
    behavior during the time I helped The 700 Club. Was I simply caught up in something
    that I couldn''t handle? Was I naïve, because I was such a novice in the faith?
    Was my ego running the show, as I gave myself completely to the task of the CBN?
    Perhaps it was none or all of the above, but I know that we created—or at least
    played a major role in the creation of—the extreme Christian element that has
    dragged the Republican Party to the edge of fascism. There is no zeal like that
    of religious zeal, for it comes with blinders to alternative views of reality.
    When this zeal is aimed at pleasing God Himself, it''s impossible to negotiate
    or reason with it or its consequences.


    And why should conservative leadership care as long as this group votes? Politics
    is a dirty, dirty business, as Pat discovered later with the tactics of his chief
    rival, George H.W. Bus. Trying to reform a culture through political means is
    vanity and a useless pursuit, and yet this was the consequential fruit of my work
    at CBN and The 700 Club. It may have been great television, but the internal price
    I paid, as you will later discover, almost brought about my total destruction
    as a man, a father, a believer in something bigger than myself, and as a professional
    observer.'
