    # Seven


    CBN News, Fox News, and the Matter of Transparency


    > Never pick a fight with people who buy ink by the barrel.

    —Mark Twain


    Television news—and other forms of journalism of the future—will steadily drift
    away from the “professional” standard of objectivity and back to one that regularly
    incorporates argument into its soul. If you study postmodernism, this conclusion
    is inevitable, and it will produce I—predict—a change in the culture as significant
    and lasting as the American Revolution. Moreover, this change will occur outside
    the institution of journalism and in spite of its ongoing self-examination.


    To begin understanding the dynamics of this change, one must first leave the safe
    pedestal of professionalism. This is why the institution will never “get it” and
    why the ultimate arrival of the new age will seem sudden, when it really was bubbling
    and simmering for decades. So aside everything you’ve been taught and believe,
    and let’s take a little trip back in time. If journalism is the first rough draft
    of history, then who were the first journalists?


    Since the dawn of humanity, cultures have carried their mythries and histories
    with them. These accounts reflected not only factual occurrences but also the
    cultural contexts within which they took place. As such, none would pass the muster
    of today’s standards, because journalism goes beyond storytelling and includes,
    I believe, an element of investigation—an'
