    Meanwhile, those lockstep supporters of the Christian right hang on for dear life
    to the twisted and self-serving “facts” presented by Fox News and CBN News in
    the name of being a good Christian. They deny their ignorance and cite Biblical
    references like I Corinthians 1:27 (NIV): “God has chosen the foolish things of
    the world that He might shame the wise.” This gives a bizarre form of license
    to the followers of those who seek political gain. It is volatile and dangerous,
    while conservatives scream about the horrors of political correctness today, there’s
    a much greater horror in place in the US today, and that’s the fear of stepping
    on the toes of the very people who complain about “liberal” political correctness.
    After all, they’re extremely well organized, and their leaders know how to ri
    the troops to flood website comments and gain signatures on petitions to the FCC,
    the Judiciary, Congress, and the White House. This is a fruit of the gospel of
    self.


    Modern Christianity is not above reproach, and unless we talk about the basics
    with each other, we’re going to see the cultural gaps between the absolutes of
    justice and mercy get wider. This begins with real transparency from any person
    or calling itself a “news” organization. And leads to perhaps the greatest revelation
    in examining the very basis of any group calling itself a “news” organization.
    It begins with separating news from politics, and in this sense, we can see that
    so-called “right wing media” isn’t really in the news business at all. Thus, the
    narrative that drives them is completely false.


    Recall Spiro Agnew’s proclamation that the president ought to be able to speak
    directly to the American people without going through what he viewed as a liberal
    filter, one that would distort Nixon’s views through blurred lenses. Nixon’s was
    the first conservative administration in the golden age of television, and it
    struggled with its inability to control the message in an incredibly volatile
    time in history. Many others took up the claim in the wake of Watergate. After
    all, only political opponent would strive to take down a sitting president, surely
    not a press that advertised itself as objective.


    These complaints fall on deaf ears, because the complainers lacked a media stage
    from which to make their case. As a result, they had to rely on that same blurred
    lens, so efforts to “speak against liberals” were dead before they started. We
    had such a stage at CBN, one of the original ten'
- md: '

    transponders on the first RCA communications satellite, Satcom One. Moreover,
    ours was a video show, and we had the production chops to create whatever we wanted
    along the artificial plane known as political perspective. It didn’t matter that
    the press really belong on this plane, only that it was convenient for our purposes,
    which we claimed to be preparing the world for the return of Jesus Christ.


    So we publicly moved “press” in its entirety to the left on this political plane
    in order to insert a convenient fence on its right edge. We placed ourselves (and
    the ilk of Rush Limbaugh, etc.) to the right of that fence, which gave the appearance
    of the bigger overall culture being represented under the banner of “news.” After
    all, most people were either liberal or conservatively politically, and politics—or
    influencing politics—was our real goal. I can’t possibly overstate this reality.
    You do not change the world by changing the press; you simply must make the case
    that the press isn’t neutral, and the rest is easy. The press, of course, helped
    us with a more progressive view of culture for us to hone in. We were free to
    assign bias even in cases where the press was simply doing its job.


    Dog bites man, it’s not news. Man bites, or it’s news. This old metaphor points
    to the false narrative we created, because the very definition of news is tied
    to that which is different, that is, well, “new.” And new always means progressive,
    for basic conservative logic is tied to the status quo and the maintenance of
    tradition and its accompanying hierarchies. Many if not journalists are educated,
    passionate about their trade, and ethical when it comes to the rules of professional
    observation. Only in the sense that some of this can be applied to “liberalism”
    is the press liberal. It is a fake moniker given to them without their consent
    by people who need it to be that way in order to fit their own self-serving narrative.
    There is no conspiracy. Journalists don’t regularly gather to discuss how they’re
    going to manipulate unknow masses with lies and deceit. That is much more likely
    to be found with those who claim participation in “right wing media.


    On abortion, for example, Evangelical Christians almost leave out the original
    pioneers in the pro-life movement, the Catholics. This is an important element
    in understanding right wing media, for the Catholic Church is hardly conservative.
    In addition to calling out the pro-choicers for what was actually taking place
    in the wake of Roe v. Wade. Catholics also pleaded the cause of those “unwanted”
    babies after they were born, and also opposed the death penalty. That, my friends,
    is the very definition of proline. Catholics also tended to vote for the left,
    so their voice in the debate about abortion carried far more weight than that
    of any other group. That voice didn’t fit the narrative of the right, and the
    squeaky wheel gets the grease. In seizing upon abortion as an Evangelical Christian
    cause, the political right gained an emotional grassroots appeal to which it was
    not entitled. You can''t claim to be “pro-life” and not plead the cause of the
    poor and the oppressed sitting on down, unless, of course, your gospel is the
    gospel of self. The same thing applies to many of the right’s causes, because
    political power is the real goal.


    The mere suggestion that manipulation can result in rolling back laws that are
    tagged as culturally offensive is so folly and a chasing of the wind. This includes
    the idea that if only conservatives could appoint enough Supreme Court justices,
    they will eventually overturn Roe v. Wade. The odds of this happening are remarkably
    small for many reasons, and wish would do well to consider the original opinion
    in Roe v. Wade written by conservative justice Harry Blackman, a Nixon appointee
    to the court. Nevertheless, right wing media needs to continually dangle this
    carrot in order to maintain the hyperbole of its claims as members of the press,
    albeit with a different worldview.


    Right wing media is not, nor will it be, a part of the press, for its core purpose
    is the manipulation of culture through distortion, the very thing it assigns to
