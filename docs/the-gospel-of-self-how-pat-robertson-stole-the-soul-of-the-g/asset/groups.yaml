    On my copy of the letter, Pat attached a note for my eyes:


    If Xxxxxxx articulates what she understands as “our policy,” it obviously sounds
    both unchristian and indefensible.

    I believe that it should be reanalyzed, redefined, and especially rearticulated
    so that it makes sense in a Christian context. If it doesn’t, then we should not
    have it.


    This was very easy for Pat to say, but the proof of CBN policy was in his dressing
    room prior to the program, where he said “yea” or “nay” to the videos I presented
    to him to the broadcast. His references to obesity as “sin” are reflective of
    general attitudes found among certain Christians and especially those of the evangelical
    right. The needy are always seen as being in sin, especially if they “could” help
    themselves. The problem of, course, is obesity isn’t necessarily sin, because
    there are contributing factors such as heredity, poverty, abuse, and others that
    get in the way of such a black and white view of life. The 700 Club, however,
    was Pat Robertson’s ministry, and he has as much right to present his case as
    anybody else. Of course, he—and certainly people like me—are responsible and accountable
    for the results.


    In many ways, the job of being Pat’s producer was the proverbial “between a rock
