    Pat Robertson loves maps, and he was right in his belief that a great many people
    have no idea where this country or that one is located, much less how they interact
    with their neighbors. They certainly didn’t know why that was important or how
    matters “over there” impacted those of us here. We created eight-foot panels with
    beautiful maps representing regions of the world.


    I remember one day in the dressing room, Pat asked that we have the map of Africa
    available, because he wanted to talk about it. This wasn’t a planned segment,
    so we all had to be on our toes. In about fifteen minutes, he went through every
