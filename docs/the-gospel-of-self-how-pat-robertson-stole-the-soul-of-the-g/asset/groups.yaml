    Bargains are important, like building a $13 million building for $100.

    There is also a thing of the old folks wanting to help the young, sort of to perpetuate
    society somehow.


    What Pat Robertson taught me that day that success in Christian television ministry
    began with tweaking the self-centered core of human nature. Notice that he painted
    a picture of expanding circles, each moving away from the recognition of self
    at the center. Helping the poor is at the bottom of the list, almost though that
    particular motivation is separate from the rest, and this played out in our use
    of Operation Blessing to hit a particular kind of Christian giver. The rest, however,
    formed the code of our ministry and our fundraising.


    Armed with this kind of direction, it was easy to craft not only fundraising but
    also everything else associated with The 700 Club television program. Taking over
    the country for God wasn''t so positioned as a duty; it was more like “you need
    to do this for yourself and your family.” It''s a subtle difference in the marketing
    practice of positioning, but it''s a much more powerful motivator. This is core
    Pat Robertson, and nothing he did, said, or accomplished makes sense without this
    layer of understanding included in the final analysis.


    There was nothing sinister about it to us; it was a sincere and genuine desire
    to change the world for good, although its ultimate fruit has'
