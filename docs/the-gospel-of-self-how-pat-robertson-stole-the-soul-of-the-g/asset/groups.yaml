- md: '

    Chief of all the attributes present among the staff during these years was imagination
    and creativity. It’s not a stretch to say with certainty that our execution of
    Pat’s vision is what made everything possible. History will judge Pat Robertson,
    for it always looks to the leader, but my stamp—and the stamps of a great many
    others—are all over the pulpit we have gave.


    Further evidence of Pat’s early political ambitions came in a September 1984 Gallup
    research report for us on the matter of the separation of church and state. Gallup’s
    opening paragraph in the report revealed a doorway of ignorance that could be
    exploited:


    In assessing the results of this survey, it should be borne in mind that only
    slightly more than half of Americans (55%) correctly identify the First Amendment.
    Furthermore, more than four in ten (45%) mistakenly believe that the statement—“The
    State shall be separate from the Church, and the Church from the School”—is found
    in the U.S. Constitution.


    The latter statement came from the 1977 Constitution of the Union of Soviet Republicans,
    the USSR. This and other findings in the study revealed a great need for education,
    and that helped energize us to move forward. We found that the separation of church
    and state was an important matter for Americans, and the study showed felt a strong
    connection with Ronald Reagan and his views on the subject. All of this was ammunition
    we could use in our efforts to bring the message of salvation to the masses by
    any means at our disposal.


    The Saturday Evening Post article hit the streets in March, and reaction popping
    up here and there, within the ministry. A month earlier—and unbeknown to most
    of the staff—Pat had purchased a BAC One-Eleven jet formerly owned by singer Kenny
    Rogers. It had been renumbered NB88, which we later discovered stood for “New
    Beginnings in 1988.” This purchase and the subsequent use of the jet became a
    key element of the criminal investigation by the IRS into Pat Robertson’s use
    of ministry funds in the Robertson campaign.


    My first flight on the big jet was in August of 1985, when it was used to transport
    us to our annual executive retreat at Pat’s stately vacation home at The Homestead
    resort in Hot Springs, Virginia. It was here that Pat first told us he was running
    for president.


    "God told me to run for president and I will win,” were his words to us in a memorable
    session during that trip. In addition to staff, Harald Bredesen was also there,
    along with a man we had never met, Michael Clifford, who would later go on to
    become campaign manager. Pat’s expressed belief was that God had called him to
    run for president as a means of changing and renewing America. While he felt a
    conflicting reluctance, told us he had concluded that he should heed the call
    and be obedient to what he was hearing from the Lord.


    Bredesen, one of the men who had held Reagan’s hand and the 1970 prophecy given
    regarding Reagan and the White House, was at the spearhead of Evangelical Christianity’s
    foray into influencing the culture. He was vocal in this meeting about his belief
    that God told him Pat will be the next president. There were very few people in
    Evangelical Christianity who dare challenge the words of Harald Bredesen.


    Those present said very little except to offer support. I said nothing, but my
    mind was churning with a thousand thoughts about what the future held for me and,
    especially, for The 700 Club, because I knew that federal equal laws prohibited
    a person running for office from being an ongoing television host. While I was
    excited to be a part of this historic move and eager to offer my sword in the
    effort, I knew immediately what it would do to the program and ultimately the
    ministry.


    The 700 Club was a personality-driven television program, and Pat Robertson was
    the personality. Without him, there could be no 700 Club. Nobody present at that
    meeting, with the possible exception of Executive Producer Michael Little, knew
    better than me. There could be no turning back, however, when Pat Robertson made
    up his mind to do something, it was etched in stone.


    1984 and 1985 were remarkable years to lead the behind-the-scenes creative development
    and strategic execution of The 700 Club. We had the resources, the mission, the
    vision, and the people available to change the world through television, and it
    was a heady thing. We were not bashful about it either; we publicly stated that
    this was our goal.


    Throughout my time at CBN, we produced some of the greatest promotional announcements
