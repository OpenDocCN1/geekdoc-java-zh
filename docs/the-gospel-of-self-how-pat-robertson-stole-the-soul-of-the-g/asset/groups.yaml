    revealing a license to depict Christians in an ideal way rather than Gallup’s
    research had shown America described them. This was controversial in Virginia
    Beach and put unnecessary demands on those of us trying to fulfill the mission.
    Pat did not interpret his own rules the same way we did, however, and this added
    to the confusion. Consider a letter Pat received in the summer of 1984 from a
    woman in Norfolk who somehow had heard about our rule of “no fat people” on The
    700 Club. She was incensed, and Pat’s letter back to her is revealing.


    Dear Xxxxx,

    Thank you very much for your letter. Sometimes things which are an expression
    of practical management turn into hard and fast law which may not be the intent
    at all.


    Here’s our problem. There are many Christians who are not just fat, but are grossly
    obese. They don’t smoke, they don’t drink, and they don’t run around, but the
    last of flesh focuses on their stomach. They make a poor testimony to those who
    are seeking to find faith. One person I read of that after his experience with
    Christians, he presumed that he would “have to gain one hundred additional pounds
    to be like most of the Christians” he saw.


    I would not be particularly anxious to put on the air a testimony of an alcoholic
    who was healed of the sickness but continued to be a drunk. I would like him both
    healed of his sickness and healed of his spiritual disorder as well.


    I am sure that all the complex reasoning that goes into a decision does not get
    conveyed when it is passed down levels. In any event, we are trying to draw men
    and women to Jesus, not repel them. Sometimes we do this imperfectly, but I feel
    that the reproach of the cross is hard enough without making the unbelievers feel
    they have to overcome the reproach of our own bad habits.


    The way you explained “the policy” is, of course, indefensible. I do not believe
    that is the case.


    Thanks for writing. With all good wishes, I am

    Yours in Christ,'
