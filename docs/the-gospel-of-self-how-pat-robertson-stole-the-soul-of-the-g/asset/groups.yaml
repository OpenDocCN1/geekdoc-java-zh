    “Fair enough,” said. “Will anybody know I’m coming?”


    “No, brother, and I’d like to keep it that way for now.”


    Barbara came back on the phone and said she would search travel, make a hotel
    reservation, and get back to me. I was two hours from Dallas/Fort Worth Airport,
    and we agreed that I''d fly out first thing Saturday morning. The meeting was
    scheduled for that afternoon.


    I didn’t tell anybody at the station that I was going out of town for the weekend,
    but my wife was delighted. She hadn''t shared her desire to return to the stability
    of local television when I had made the decision to leave CBN in the first place.
    She also hated the culture and the people of East Texas and longed to return to
    the beach, and this made it very difficult for me to say anything but yes to Pat’s
    invitation.


    CBN hadn’t changed much in the year I had gone. But as the taxi pulled into the
    front entrance, it certainly felt different. Perhaps it was just me. I remember
    it was cold and snowy. We drove behind the main facility and outbuildings of CBN
    University and pulled up in front of Pat’s mansion. I was all of nerves, because
    I didn’t really know what to expect or what was happening. Mostly, I was already
    thinking downstream and trying to rationalize a decision to return to what had
    already been a ministry divided over Pat’s decision to run for president. Little
    did I realize the snake pit it had actually become, nor was I fully prepared for
    what was really ahead.


    I made my entry and set in the back of the meeting. Pat told the group that he
    had asked me to attend, because he wanted my advice on the matters being discussed.
    Eyes popped open as people saw me, and I listened as a heated debate about The
    700 Club was underway. Knowing that Pat was leaving the show, the producers wanted
    to change the whole approach of the program, from a TV news magazine to a thematic
    talk show. This, they reasoned, would better suit the host or hosts that would
    replace Pat, perhaps for many years as he ran the government. It was good thinking
    and a good strategy, but I knew Pat would never, ever go for a change.


    For one, when he behaved every bit like he would win the presidency, he was smart,
    pragmatic, and political enough to know that he might not. Secondly, there were
    many executives—and donors—who felt his position as media leader of a Christian
    movement was actually more important than the presidency. Thirdly, and perhaps
    most importantly, The 700 Club had had'
