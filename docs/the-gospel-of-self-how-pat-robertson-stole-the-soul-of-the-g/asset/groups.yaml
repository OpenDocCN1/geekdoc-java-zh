    这些年来，员工中展现出的核心特质是想象力和创造力。可以说，我们对帕特（Pat）愿景的执行才让这一切成为可能。历史将审判帕特·罗伯逊（Pat Robertson），因为历史总是关注领导者，但我的印记——以及许多人的印记——遍布在我们所建立的讲坛上。


    帕特早期政治野心的进一步证据，于 1984 年 9 月盖洛（Gallup）为我们提供的一份关于政教分离问题的研究报告。盖洛在报告的开篇第一段揭示了一个可以被利用的无知之门：


    在评估这项调查结果时，应当记住，仅略一半的美国人（55%）正确识别了《第一修正案》。此外，超过十分之一之四（45%）的人错误地认为，“国家应与教会分离，教会应与学校分离”这一陈述出现在《美国宪法》中。


    后一个说法出自 1977 年的《苏联联邦共和国（USSR）宪法》。这项研究中的这一或其他发现揭示了人们对教育的巨大需求，这激励了我们不断前行。我们发现，政教分离对美国人来说是一件大事，而研究显示这与罗纳德·里根（Ronald
    Reagan）及其在该问题上的观点有着强烈的联系。这一切都是我们可以利用的弹药，通过我们掌握的一切手段向大众传递救赎信息。


    《周六晚间邮》（Saturday Evening Post）的文章在 3 月发表，部会内部处处都响起了反应。一个月前——在大多数员工并不知的情况下——帕特买下了一架曾由歌手肯尼·罗杰斯（Kenny
    Rogers）拥有的 BAC One-Eleven 喷气式飞机。它被重新编号为 NB88，我们后来发现这代表“1988 年的新开始”。这次购买以及随后对该飞机的使用，成为了美国国税务局（IRS）对帕特·罗伯逊在竞选活动中使用部会资金进行刑事调查的关键因素。


    我第一次乘坐那架大飞机是 1985 年 8 月，当时它被用来送我们去弗吉尼亚州温泉泉的霍姆斯斯泰德（The Homestead）度假村，在帕特的豪华别墅参加年度高层执行活动。正在那里，帕特首次告诉我们他要竞选总统。


    “上帝告诉我去竞选总统，我会赢，”这是他在那次旅行中难忘的会议上对我们说的。除了员工外，哈拉德·布雷德森（Harald Bredesen）也在场，还有一个我们从未见过的人，迈克尔·克里福德（Michael
    Clifford），他后来成为了竞选经理。帕特的信念是，上帝呼召他竞选总统是为了改变和更新美国的手段。尽管他感到一种矛盾的犹豫，但他告诉我们他已经得出结论，应该顺从呼召，服从从主听到的话。


    布雷德森是曾握过里根手的人之一，也是给出过 1970 年关于里根和白宫预言的人之一，他是福音派基督教涉足影响文化的先锋。他在这次会议上直言不讳地表达，认为上帝告诉他帕特将是下一任总统。在福音派基督教中，很少有人敢挑战哈拉德·布雷德森的话。


    在场的人除了表示支持外，话不多。我什么都没说，但我的脑海中翻涌着成千上万的思绪，关于未来对我、特别是对《700 俱乐部》（The 700 Club）意味着什么，因为我知道联邦平等法禁止竞选公职的人继续担任电视节目主持人。虽然我对参与这一历史性行动感到兴奋，并渴望为这一事业尽力，但我立刻知道这会对节目以及最终对部会产生什么影响。


    《700 俱乐部》是一个人格驱动的电视节目，而帕特·罗伯逊就是那个核心人物。没有他，就没有《700 俱乐部》。会议在场的人，除了执行制片迈克尔·利特（Michael
    Little）外，没有人比我更清楚。然而，当帕特·罗伯逊决定做某事时，那就是板上钉钉。


    1984 年和 1985 年是领导《700 俱乐部》幕后创意开发和战略执行的非凡岁月。我们拥有资源、使命、愿景以及通过电视改变世界的人才，这是一件令人振奋的事。我们对此也并不羞耻；我们公开表示这是我们的目标。


    在我在 CBN 期间，我们制作了一些基督教电视史上最伟大的促销宣传公告（广告）。在沃伦·马库斯（Warren Marcus）的指导下，我们经常处于电视推广的最前沿，我记得其中一个广告特别精辟地展示了改变世界的想法。它名为《雨滴》（raindrops），始于一滴简单的雨滴，演变成一条小溪、奔腾的河流，最后汇入大海。这个广告的精彩之处在于，它是与
    CBN 相关的许多事物的比喻。当然，它关乎奉献，也关乎参与，这是我们贯穿的主题：“我们都相信，如果你选择不参与，在生活中就没有什么可以抱怨的。”


    《700 俱乐部》的政治化以及帕特改变国家最高领导位的决定，完全分化了 CBN 部会。这种分歧是显而易见的，并恶化了我与那些处于权威人士之间的关系。我怀疑帕特·罗伯逊是否完全理解什么是分歧，尽管他在竞选失败后回到节目时，这种结果确实显而易见。


    我在预见后果方面有不错的记录，我知道这一切将对我个人意味着什么。我选择了简单的出路，辞去了职位，回到地方电视新闻的世界。鲍勃·伯福德（Bob Buford）是一位德克萨斯州的百万翁兼基督徒，他在德克萨斯州东部的电台
    KLTV 给了我新闻总监一职。


    我知道如果没有帕特，这个节目将会陷入困境并可能失败。我知道如果留得越久，我在 CBN 的背景会让我找工作变得困难。因此，我在 1986 年春天离开了部会。

