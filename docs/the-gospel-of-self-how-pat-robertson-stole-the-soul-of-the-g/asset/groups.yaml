    第二天早晨，我不希望演播室或休息室出现任何难看的情况，尽管我试图向帕特（Pat）保证，考虑到丹努塔（Danuta）作为专业电视主持人的经验，这种情况极不可能发生。因此，在我经理生涯中履行的最痛苦的任务之一，我在那个停车场解雇了丹努塔。


    丹努塔在她的书中对这次会面描述得非常清楚且完整，我不需要重复她的陈述。对我来说和对她来说这都不令人愉快，但没有人因为这种事而被解雇，也不被预期会那样。解雇你爱的人非常困难，但作为被解雇的一方更难。我深爱丹努塔·索德尔曼（Danuta
    Soderman）。她是一个非常敬业的演员，不该以那种方式结束在 CBN 的服务。我为自己也为这项事工感到羞愧，整场乱象对我个人产生了深远的影响。


    CBN 的新闻记者之一凯蒂·布洛克（Kathy Bullock）长期以来她在镜头前的自然表现和作为记者的明智给我留下了深刻印象。用电视顾问的术来说，凯蒂在电视上“穿透了玻璃”，意味着她拥有通过外貌和性格真正上吸引屏幕之外观众关注的独特能力。她很年轻，但在联合主持人的位置上游刃有余，在丹努塔被换掉后非常出色地填补了空白。我的倾向是敦促她成为新的联合主持人，但帕特以及那些对他表达的每个意见都随之点头同意的人杀死了这个想法。帕特认为她太年轻、缺乏经验，尽管这既不是我的观点，也不是员工们的观点。


    我首先联系了特里·米乌森（Terry Meeuwsen），我在密尔沃基从事新闻工作的老朋友。特里曾是美国选美小姐，也是一位才华横溢的现场主持人。她曾偶尔担任替补，是《700俱乐部》（The
    700 Club）天然的联合主持人。遗憾的是，家庭和工作让她在当时无法搬到弗吉尼亚海滩，尽管多年后她确实成为了节目的主持人。


    我的下一个想法是联系苏珊·霍华德（Susan Howard），她是热门剧《达拉斯》（Dallas）的剧星之一。几年前当我们把《700俱乐部》带到加利福尼亚时我见过她，我认为她会带来新的观众和追随者。我动用了我在好莱坞和事工界的所有关系，最终说服了她加入。这是一件意义重大的事，因为她是一位
    A 级莱坞明星。


    虽然苏珊带来了她对好莱坞后台的某些预期，但作为节目的联合主持人，她非常出色。她在片场的出现让节目在真正需要提振的时候得到了焕新生。她充满活力，面容点亮了屏幕，为这个正受到深度公众审查的电视事工节目增添了某种信誉。她善良且富有同情心，CBN
    的员工非常她。帕特和本（Ben）与她合作得很好，很快丹努塔的离开对大多数人来说就成了过往云烟。然而我很清楚，我怀疑苏珊努力的持久性。她是一个加利福尼亚女孩，一个演员。她的丈夫随她一起来，他唯一合理的担忧就是苏珊和她的事业。尽管有我的职责，我还是聘佣了她，因为节目急切需要一股新鲜空气，而苏珊确实是这样的人。


    随着日子、周和月的推移，帕特·罗伯逊（Pat Robertson）在节目中变得越来越政治化。当他不在时，我们可以偶尔播放名为“帕特·罗伯逊的观点”的片段，这些片段是在另一个更具权威设计的舞台上拍摄的。我在
    1984 年提议，将 90 分钟的《700俱乐部》的最后半小时转换为一个同名的独立半小时节目。我想我们可能可以从《700俱乐部》进行分销，这可能让我们的节目免受政治片段的侵占。我们搭建了舞台制作试播片，但整个计划被冷落了。我们后来利用它来制作片段，这样帕特仍然可以出现在节目中，尽管他当时正在参加一项“非官方”的竞选活动。


    1986 年，在我离职之前以及 1987 年，新的面孔偶尔出现在帕特的休息室和节目拍摄场周围，大多与帕特的竞选有关，而（工作与政治之间的）界限开始变得模糊。杰里·柯瑞（Jerry
    Curry）作为帕特最亲信的顾问之一，在 1986 年 4 月份给我发了一份备忘录：


    “我假设这有点冒昧，但我不断遇到一些雷根政府的官员，如果以后需要，帕特可能想选择他们担任罗伯逊政府的关键职位。我想到，帕特结识这些人的一种方法是在《700俱乐部》中采访他们。所以，请将这份备忘录视为寻找新人才的伟大征程中的第一号备忘录。除非你对我将其写成书面形式有意见，我会定期向你通报这些名单。”


    随后他推荐了艾兰·E·西亚斯（Alan E. Sears），司法部米斯色情委员会的工作人员总监——“艾兰那种我们希望选择担任司法部高层职位的人选，如果不是那个最高职位本身的话”；拉尔夫·斯坦利（Ralph
    Stanley），城市大众运输管理局局长——“他将成为一名出色的交通部长”；以及戴夫·斯沃普（Dave Swoap），柯瑞想要他担任健康与人类服务部长，并补充道，“大约
    45 岁的戴夫，为他的工作带来了和你帕特在你们工作中同样的智力水平。”


    而且，供记录，让我们不要忘记国家安全委员会的奥利弗·诺斯（Ollie North）。在那份工作中再做三年，他就应该准备好接替[约翰]波因克斯特（[John]
    Poindexter）的位置[[雷根的国家安全顾问]。


    现在，我们如何让这些家伙登上《700俱乐部》呢？

