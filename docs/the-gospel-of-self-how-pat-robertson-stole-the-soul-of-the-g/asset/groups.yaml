    he was governor of California in 1970. This book was offered to Christians in
    an election year to help remind them of the president’s Christian upbringing,
    roots, thinking, and, of course, the prophecy. The book jacket notes that Slosser’s
    “searching description of the presidential personality and his analysis of the
    president’s faith will be welcome information to everyone who genuinely cares
    about our nation, under God.


    The men who prophesied over Reagan in 1970 were deeply loved and admired friends
    of Pat Robertson’s, who advised and prayed with him regularly and were viewed
    with a form of profound reverence and respect among the employees of the Christian
    Broadcasting Network and its affiliate organizations. Chief among these were pastor
    Harald Bredesen, George Otis, the founder of Christian radio and television in
    the Middle East, Voice of Hope; and singer Pat Boone. Bredesen and Otis, whom
    Boone considered his “two Holy Spirit fathers,” profoundly influenced him and
    his career.


    Here is an excerpt from the opening chapter “A Prophecy” from Slosser’s book Reagan
    Inside Out:


    Seven sharply people drifted into that moment on their Sunday afternoon in October
    1970, stepping almost aimlessly toward the foyer of a stately Tudor home in Sacramento.
    They were talking rather softly, running over one another’s words as they edged
    toward the entrance.


    One moved in front, then hesitated, looking back at the rest. That was Herbert
    E. Ellington. He was, in a fashion, herding four of the others, who were obviously
    visitors. He was just a whisper out of rhythm with them—not awkward, perhaps tentative.
    They were getting ready to say-bye and that heightened everyone’s uncertainty.


    Ronald Reagan was smiling and as he turned his head toward Pat Boone, whose smile
    caused his entire face to glisten. Nancy watched the two of them momentarily,
    the barest trace of a smile on her lips, and then she whispered two or three words
    to Shirley Boone. Two rather short men, Harald Bredesen and George Otis moved
    toward Ronald Reagan and Boone. Both were silent, and Bredesen seemed to be studying
    the floor.


    Suddenly, everyone stopped. In the split-second of stillness, they looked at one
    another. One of the men—Boone or Bredesen—said, “Governor, would you mind if we
    prayed a moment with you and Mrs. Reagan?


    “We’d appreciate that.” Reagan’s face remained bright and pleasant but ever so
    slightly toward seriousness.


    It was hard to tell who moved first, probably Boone, in a sort of chain reaction,
    the seven took hold of each other’s hands and made an uneven circle. For an instant,
    they were like little children, looking first to the right and down at one set
    of hands and then to the other. Only Boone seemed thoroughly at ease, but friendship
    had broken all barriers between him and all those, including the Reagans, their
    hosts. He had a happy smile on his face. Otis and Bredesen were obviously tense.
    Nancy’s expression was quizzical but relaxed.


    All seven closed their eyes. Reagan bowed his head sharply; Nancy’s left remained
    fairly. The others theirs a bit.


    Otis, standing to Reagan’s, remembered the few seconds of awkward silence that
    followed. “It was a little tense,” he said, “a bit embarrassing. We didn’t know
    how they felt about doing that, you. Suddenly we realized we might be a bit presumptive.


    And that’s why they stood, holding hands, eyes the seconds seemed like minutes.
    He cleared his throat, and began to pray, “Lord, thank you for the chance to be
    here together...” It was very general, the kind of prayer offered at large and
    small gatherings across all the land. It was so ordinary that no one remembered
    much of it.


    “I was just sort of praying from the head,” Otis said. “I was saying those things
    you’d expect—you know, thanking the Lord for the Reagans, their hospitality, and
    that sort of thing.


    That went on for ten or fifteen seconds, and then it changed. “Everything shifted
    from my heart to the spirit—THE Spirit,” Otis recalled. “The Holy Spirit came
    upon me and I knew it. In fact, I was embarrassed. There was this pulsing in my
    arm. And my hand—the holding Governor Reagan’s hand—was shaking. I didn’t know
    what to do. I just didn’t want this thing to be happening. I can remember that
    even as I was speaking, I was working, you know, tensing my muscles and concentrating,
    and doing everything I could to stop that shaking.


    “It wasn’t a wild swinging or anything like that. But it was a definite, pulsing
    shaking. And I made a great physical effort to stop it—but I couldn’t.”


    “If you walked upright before Me, you will reside at 1600 Pennsylvania Avenue.”


    The words ended. The silence held for three or four seconds. Eyes began to open,
    and the seven rather sheepishly let go of hands. Reagan took a deep breath and
    looked into Otis’ face. All he said was a very audible “Well!” It was almost though
    he was exhaling.


    Otis was struck by the calm expression on Reagan’s face. “I was really concerned
    about how he might have taken it all,” George remembered. “But the expression
    on his face was kind, wholesome—a receptive look, you know. It was not gushy or
    sentimental or any of that. He just said, ‘Well,’ and that was that. We all said
    goodbye, and we left.”


    To fully appreciate the power of this prophecy in driving the early 1980s revival
    that the televangelists ushered in, readers must understand and accept the circle
    from which it came and the wider circle included people as Pat Robertson. We rarely
    spoke of it directly, but I knew as Pat’s producer that this was a seminal moment
    in the development of the “latter rain” of which Bredesen spoke to Ronald Reagan
    that day. “Latter rain” is an idea taken from the King James translation of the
    Book of Joel, one considered prophetic to many evangelicals. It''s an expression
    of an outpouring of the Holy Spirit that would be accompanied by signs and wonders,
    such as healing the sick, casting out demons, and speaking in tongues. These,
    of course, were standards of the CBN ministry and the 700 Club.


    In a July 24, 2007 CBN obituary of George Otis, Craig von Buseck wrote that Otis
