    One of the brightest and most talented producers on the staff of The 700 Club
    was John Simpson. Jon is now a world-traveler who documents with his video camera
    various ministries around the globe. He’s brilliant today, and he was brilliant
    back then. Jon also had a gift that he could do a very good interpretation of
    David Letterman’s shtick in the field with everyday people. We were always looking
    for platforms that would allow Pat to teach. One year I gave Jon the idea to create
    a franchise involving a well-intentional Christian character that always gets
    things wrong. It comedic and a great platform from which Pat could then teach
    people about the errors the character had made.


    Jon created a pilot in which his character tried to use the Law of Reciprocity
    (from Pat''s Secret Kingdom) that referenced “Give and it shall be given unto
    you” in order to pay his bills. If he needed one-hundred dollars, he would give
    ten dollars, and so forth. He wound up deeper and deeper into debt and finally
    gave up, looking at the camera and asking with arms outstretched, “What am I doing
    wrong?” I thought it perfectly represented what we were trying to create, and
    I was very proud to show it to Pat. It was not. It was right on, because we knew
    that this was one of the trouble spots for people in living out their Christian
    lives.


    Pat Robertson was not amused, in the least. He stared at the screen as I played
    Jon''s tape. We were alone in the dressing room, and I grew more uncomfortable
    longer his eyes didn''t blink. When it was done, he looked at me and said, “If
    you put this on the air, it would cost this ministry millions.” He explained that
    we were all helping people with their faith, and we dared not put anything in
    the show that might—not—produce the opposite. I was instructed to never go near
    the subject and to kill the franchise. I didn''t need further instructions to
    know that order was inviolable.


    A similar rule was in place for testimony stories of physical healing, and it''s
    here perhaps more than any other place that internal conflicts over right and
    wrong arose among the staff of the program. The person in charge of this aspect
    of the show was Karen Thompson, a talented and compassionate member of the team
    of producers and storytellers who also happened to be a nurse. Her task and the
    task of her staff was to filter the myriad reports we received by telephone and
    turn them into “miracle” stories as possible. She was frustrated and so was I,
    because Pat Robertson''s expectations most definitely didn''t align with reality,
    especially the restrictions we had on the types of people we could show-on-air
    (young, not grossly overweight, smart, etc.).


    In the spring of 1984, Pat objected to a miracle story that we had produced, saying
    it was too weak to put on the air. He reviewed every story in his dressing room
    prior to the program, and a big part of my job was to watch the videotapes with
    him and pass along his critiques, which could occasionally be quite brutal. I
    always filtered his comments, and sometimes his feelings would leak to the staff.
    Such was the case with this particular story, Karen naturally objected. She sent
    me a memo out of frustration, and I was glad to take her case back to Pat. It
    relieved some of the pressure, but such things, like bugs in a kitchen, have a
    way of coming back. It didn''t do much with Pat, and it didn''t do much with my
    boss, Michael Little.


    Here''s some of what she said, and I want to reiterate that she was preaching
    to the choir in writing to me.


    “I understand that you are going to ask Pat for written guidelines on what a miracle
    is. Good Idea! But a word of caution—he will not be able to expect them in the
    quantity he wants to see. I will be satisfied with fewer healing stories?


    I know that Pat believes, and I have heard him say on the air, that “thousands”
    of miracles are happening. The number of healing stories coming in us does not
    correspond to his figure of “thousands.” Many people who call in to the counseling
    center are simply claiming their killings & seen no manifestation. Others have
    seen a brief manifestation, but then “lost” it (and these people are writing in
    more frequently asking what wrong...they are confused and want to know why). Others
    write in enthusiastically (and this is VERY often) about their “miracle” and even
    provide us with medical documents. The medical documentation, however, usually
    reveals that there is far too much medical involvement (radiation, medication,
    etc.) for us to call it a miracle, or for skeptics to believe it was a miracle.


    My department has become quite frustrated, Terry. I have always taken pride in
    my work and have tried to be conscientious in doing a good job. However, I''m
    experiencing frustration because the area of healing is out of my hands. I can
    only provide stories when God does the healing. I can’t do the healing myself.
    I hope that Pat does not feel I am keeping healing stories from him. I think you
    know how hard we search for them. I will do the best I can find them, but the
    rest is in God’s hands.”


    Karen included documentation of what she had said, and this is what we were never
    allowed to present. In the first quarter of 1984, we received 6,207 “Answer to
    Prayer” forms from the counseling center. We routinely asked people to call us
    on the air, and this was one of the categories. Karen’s staff evaluated those
    and sent out follow-up forms. Of those 6,000 calls telling us about “miracles,”
    we sent a little over 1,200 forms. From those, we had received 290 responses,
    and that is where Karen’s staff actually began their work. We had a staff of nurses
    who would follow-up and an advisory board of doctors who would “approve” forms
    before we ever did the stories. After filtering out the cosmetic rejections, that
    left very few we could put on the air with any confidence to their veracity, sometimes
    as few as one or two out of 300. When you watched a healing testimony story during
    your time as producer of the program, both Karen and I were confident that it
    involved something mysterious or beyond physical explanation. Pat’s favorite healing
    stories were those that came directly as a response to the time of prayer on the
    program. As practitioners of the gifts of the spirit as described in the book
    of Acts, Pat, Ben and Danuta sought grace for “words of knowledge” about those
    viewers who were in prayer over one thing or another. They would speak out what
    they were “getting” from the Spirit would claim it in faith so that God could
    work a miracle. It all sounds pretty “out there”, but for us, it was just every
    day ministering. In the very best of cases, storytellers could link an individual
    miracle to a specific “word of knowledge,” so that we could use videotape of the
    prayer along with telling the story. This made it very easy and inspiring to the
    lead into further prayer, for the stage had been set in the hearts and minds of
    both the hosts and the viewers. Assuming a certain degree of skepticism among
    the readers here, let me say that, as a journalist, I was witness to many things
    that happened on the program that I could not explain. Doubters will no matter
    what, and my job is here to present the facts of what happened, not convince anybody
    that the hosts of The 700 Club had a direct line to God.

