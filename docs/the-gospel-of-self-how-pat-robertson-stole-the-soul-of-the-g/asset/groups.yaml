    the handing out of miracles. That said, one day the hosts were in prayer and Pat
    said (paraphrasing), “Somebody’s watching in prayer. There’s a little boy named
    Mike or Mikey that’s in trouble. I can’t tell exactly what it is, but I’m seeing
    something like a sash across his chest.” He gestured the angle of this sash and
    continued, “God wants you to know that He’s involved in this and that everything
    is going to be okay.”


    Later that day, the ministry received a praise report from a family in Pennsylvania,
    I think it was, that we investigated thoroughly and later produced a testimony
    story about documenting their “miracle.” It was truly remarkable. The husband
    was heading out to work and accidentally backed over his two-year-old son, Mikey,
    with the car. The boy had apparently tried to walk around the back of the vehicle
    to say goodbye to his dad and didn’t make it. The father realized he was running
    over something when he hit a “bump,” and he spun the tire over his son’s chest
    in trying to get off. He left a left burn on the boy’s skin in the shape and angle
    of a sash. It matched perfectly the angle Pat had demonstrated during the time
    of prayer. They rushed to the hospital, where the whole family gathered and were
    in prayer as they were watching The 700 Club when this “word of knowledge” came
    during prayer. Miraculously, except the burn, the boy was unharmed despite being
    run over by a car! That story remains in my mind as the most inexplicable event
    in all the programs I produced. Everyone involved, including the family and their
    doctors agreed that something supernatural had taken place, and it had directly
    involved The 700 Club.


