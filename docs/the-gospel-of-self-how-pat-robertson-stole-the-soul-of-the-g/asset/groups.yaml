    In June 2016, Orlando, Florida was the scene of a gay nightclub rampage by a lapsed
    Muslim, Omar Mateen, with an AR-15-type assault rifle and severe psychological
    issues regarding homosexuals. Nearly fifty people were killed and another fifty
    wounded when Mateen opened fire inside the club. He had just earlier boarded the
    ISIS train, so the terrorist group claimed responsibility, which dominated early
    press coverage.


    Predisposed to a worldview that includes Islam as the enemy, Mr. Trump bragged
    that he was the only candidate telling “truth” about Muslim immigrants. Mateen,
    however, turned out to be a US citizen, not an immigrant, but that didn’t matter
    to Mr. Trump. Pat Robertson went on the day after the massacre and condemned the
    perpetrator and the gay victims, saying that Christians should just wait on the
    sidelines and let the homosexuals and the Muslims kill each other. Pat, it would
    seem, have become more extreme than he was when I was his producer.


    The point is that Donald Trump and Pat Robertson address the same people, who
    practice a form of Christianity to foreign orthodoxy that it truly boggles the
    intelligence. We stood high atop our satellite-basedal pedestal in the 1980s and
    shouted down to a citizenry whose minds were fertile for a different perspective.
    We fed them. We nurtured them. How we did it and got away with it holds a key
    to unraveling the frustrating reality we have before today.


    Jesus is now clearly linked with Republican Party politics. He has joined the
    GOP, and The 700 Club is the principal tool that put him there. Whether He wishes
    to be there is irrelevant in today’s political arena, as is God in the form of
    Jesus Christ wants to be associated with Republican Party social positions as
    righteous. Perception is reality, and even if one can make the case that the heart
    of Jesus might be closer to the Democrats, that’s not how it’s played out today.


    This is a book for Christians of all stripes, because Christians are the only
    ones who can make this right. The angry mob of the early twenty-first century
    won’t listen to anyone else—certainly not outsiders—for they’ve been taught that
    everybody else is in for unfortunate reasons. This is the sad state in which we
    find ourselves today.


    The thousands or perhaps millions of Christians influenced by The 700 Club over
    the last four decades are good people. Their intentions are noble.'
  - '[PAGE 18]


    They mostly wish that others would find the peace and contentment they’ve discovered
    for themselves. Along the way, however, the essential gospel about feeding sheep
    and lambs has been overshadowed by a perceived need to not just challenge the
    evolution of our culture but directly participate in what they view as its restoration.
    Certain Christian leaders whose motives—while presented as above reproach—have
    fed them Biblical mandates that seem to justify this participation. However, a
    deeper examination reveals that the gospel being most preached today is a form
    of self-centeredness: the gospel of self.


    I know this, because I helped much it while serving as Pat Robertson’s producer
    and executive producer during a most critical period in the TV program’s development,
    the 1980s, when Pat himself decided that God had called him to run for president
    and that he would win. The story of how this happened is my story, and the gospel
    of self is the dark side of that chronicle.


    History will record that The 700 Club was the taproot of that which moved the
    Republican Party to the right and provided the political support today for a man
    like Donald Trump. A 2015 Harvard report concluded that right-wing media was driving
    the GOP not Republican leadership, but this assumes that in order for people to
    behave as cultural radicals, they must be manipulated into doing so. This is a
    misleading interpretation of human nature and the power of personal faith. It
    would be absurd to suggest that the many elements of right-wing media didn''t
    play a role in this, but those who challenge this right by the GOP need to look
    far beyond the institutional power of media to influence. Conservative talk radio,
    Fox News, offline publications, and the hundreds of observer websites would simply
    not exist without an audience driven by a faith-mandated conscience and thus predisposed
    to their messages. We know this at CBN in the early 1980s, and as long as we could
    present current events in what we called “a Biblical perspective,” people would
    take an interest.


    This is the gap in understanding that blinds the mainstream press in their attempts
    to understand the “success” of right-wing media, especially Fox News. Because
    the press regards religion and the viewpoints of the religious as within what’s
    known in journalism as the Sphere of Deviance, it will never see itself as anything
    other than balanced. People of faith do'
  - '[PAGE 19]


    not agree with the view of being placed on the outside of culture’s norm, and
    that’s why the Fox slogan “Fair and Balanced” works well.


    This form of Christianity blends so well with the Republican Party because both
    are formed around a circle with self at the center. This was the overarching albeit
    unwritten strategy of Pat Robertson, although there were in many positions at
    CBN who either weren''t aware of this or simply refused to see it. To me, it was
    pretty obvious and was later proven in a memorable private discussion I had with
    Pat about fundraising.


    The 700 Club began as a Christian talk for the faithful, but its evolution into
    a politically motivated, point-of-view news program began in bits and pieces before
    I arrived and accelerated afterwards. In an address to a noon prayer meeting in
    April of 1981, Pat Robertson offered the vision he wanted to fulfill and the Biblical
    justification for moving the ministry in direction:


    I tell you, in our world today; people are like a bunch of sheep. They’re saying,
    “What do we do? You know, what do we do with our money? What do we do with our
    children? What do we do with our education? What do we vote for? And all these—What
    do we do? And somehow or other God’s got to give to some people with knowledge
    of the times to tell Israel what they ought to do. And I think we have a golden
    opportunity to do that, and that’s one of the things we’re trying to do on The
    700 Club.


    That was Pat in 1981.


    So the vision was set and the only missing element was money. After all, CBN was
    a ministry. It paid no taxes as a media company, and the tax exemption was worth
    far more than any for-profit business model, especially in 1981. Pat Robertson
    was a brilliant marketer, however, and despite his professed faith in God to take
    care of providing resources, very little at CBN was left to change, and that applied
    especially to fund-raising. Only a small part of marketing is creative or innovative;
    most of the blue-collar efforts involved processes and were extremely scientific.


    We knew, for example, what percentage of 700 Club Members—at fifteen dollars a
    month—would cover to 1000 Club Members—at eighty'
  - '[PAGE 20]


    three dollars a month—and we knew, on average, how long that conversion would
    take. We had the same data in terms of converting 1000 Club Members to 2500 Club
    Members, and turning those members into Founders Club members. Based on past growth,
    this allowed us to extrapolate a budget projection, and that''s what we used to
    make our plans.


    But behind it all was the mind of a fundraising genius, a man who understood human
    nature like few others, and mostly a man who was unaraid to exploit that understanding
    in a justified means to what he felt was a righteous end. I learned how to raise
    money directly from Pat Robertson, and his methodology might inspire the faithful,
    for it is built on selflessness. And if the core of its ability to raise money
    is built on selfishness, it must follow that the CBN message itself must do likewise.
    This is the secret truth behind the CBN we intended to present as a movement of
    God''s spirit on the earth.


    In February 1985, as I was gaining more authority at the ministry of The 700 Club,
    I asked Pat if would teach me everything he knew about raising money. We went
    to lunch, and I took copious notes. Here''s what he told me, according to my notes:


    > We don''t necessarily have to present everything as a crisis, but it''s impossible
    to make a change when everybody feels good about existing circumstances. That''s
    the mistake Reagan has made. He got re-elected but now faces difficulty in implementing
    change, since the sold the country on the fact that everything is hunky-dory.

    It''s basically like John the Baptist. The axe is laid to the root of the tree
    and people are saying, ''What shall we do?''

    We need to tie the spiritual with the natural (meaning current events). He told
    the people what to do in light of the current events. We need to do the same thing,
    because if you can do, you really have something that''s worth something.

    Here''s what motivates people to give to CBN, and in this order:


    +   It helps me.

    It helps my family.

    It helps my community.'
- md: '

    It helps my nation.

    I''m fulfilling the great commission, spreading the gospel to the world.

    It''s my duty.

    I''ll get blessed if I do.

    I''m helping others who are poorer than me.


    It''s like a finely tuned orchestra. You don''t play all bass and you don''t play
    all treble. Together, they make a wonderful sound.

    People also like to be part of a winner. Nobody likes to lose.

    Challenges are important, because people are goal-oriented and respond to peer
    pressure.

    Bargains are important, like building a $13 million building for $100.

    There is also a thing of the old folks wanting to help the young, sort of to perpetuate
    society somehow.


    What Pat Robertson taught me that day that success in Christian television ministry
    began with tweaking the self-centered core of human nature. Notice that he painted
    a picture of expanding circles, each moving away from the recognition of self
    at the center. Helping the poor is at the bottom of the list, almost though that
    particular motivation is separate from the rest, and this played out in our use
    of Operation Blessing to hit a particular kind of Christian giver. The rest, however,
    formed the code of our ministry and our fundraising.


    Armed with this kind of direction, it was easy to craft not only fundraising but
    also everything else associated with The 700 Club television program. Taking over
    the country for God wasn''t so positioned as a duty; it was more like “you need
    to do this for yourself and your family.” It''s a subtle difference in the marketing
    practice of positioning, but it''s a much more powerful motivator. This is core
    Pat Robertson, and nothing he did, said, or accomplished makes sense without this
    layer of understanding included in the final analysis.


    There was nothing sinister about it to us; it was a sincere and genuine desire
    to change the world for good, although its ultimate fruit has been chaotic, divisive
    and dangerous. We felt the hand of God guided us, and I write in all sincerity.
    We looked at progressive culture and saw only evil. We felt animosity against
    Christianity and the church. We were mocked and ridiculed in the media, especially
    that which was coming from Hollywood. We felt that God was giving things over
    to us to make things right. What we did not see was the trap of our motives being
    driven by self. After all, does God really need us to fix things that we viewed
    as wrong?


    Even Pat''s acclaimed manual for living, The Secret Kingdom, is a diagram for
    using the Bible to justify a lifestyle that is built around self, self-gain, and
    self-betterment based on the above expanding circle. It''s a self-help book disguised
    as theology. Every “law” proclaimed is designed to help individual people, families,
    and communities get ahead in the realm of human competition. You can make yourself
    healthier, wealthier, safer, happier, and more dominant in the culture by living
    within these “laws of the Kingdom.” It’s a beautiful companion to the teaching
    I was given about fundraising and further evidence that we were teaching a very
    insidious form of selfishness, the gospel of self.


    This, again, is why we all must look to the mirror in order to solve society’s
    problems. Pat got it right when he said, “I have seen the enemy, and he is us.”
    The church desperately needs a season of self-examination and the courage to stand
    up and say, “Enough!” The hope for this is virtually nil, however, as long as
    we point our fingers at others and say that the problem is theirs and not ours.


    And so we use Facebook and other forms of social media today to pass along false
    memes that fit our worldview. We express our condensing disgust about the behaviors
    of others as somehow it will rub off on us if we don’t. Our radar is what matters,
    not truth. We hear or see some piece of media that pins the familiar circulating
    scene stands guards over us, and we feel it necessary to pass it along validation
    by those we hope to influence. Why? Because it helps me, it helps my family, it
    helps my community, it helps my nation, it’s my duty, and I’ll get blessed if
    I do.


    Even the Great Commission of Matthew 24 has been tilted so as to become a measuring
    stick of sorts for the health of a church, a preacher, or an evangelist. If not,
    why do churches and evangelists count salvations? What does it matter, if the
    motive is truly love? It’s little pat on the back that we all seek, evidence of
    our righteousness and a hedge against eternity in hell. This is, of course, self-driven,
    self-motivated, and self-centered. It’s not the deed that matters; it’s the recognition
    thereof. Don’t get me wrong; I know plenty of people who have a real heart for
    people they deem “lost,” but it’s very difficult for any of us, as human beings,
    to avoid the trap of self in well-doing. We just want so badly to do well (and
    be recognized for it).


    The second time I went through the twelve steps of Alcoholics Anonymous many years
    ago, I met each Saturday morning with my sponsor Steve. We both attended a wonderful
    Saturday morning group and met for breakfast beforehand to discuss my progress
    with the steps. I badly wanted and needed to please him, for he was a key part
    of the process of living a sober life. One Saturday morning, Steve gave me an
    assignment. “During the coming week,” he said, “I want to give you one hour of
    your time to help other people.” He went on to give me the rules. You can do one
    thing for an hour, or many things that add up to an hour, giving up a really good
    parking place for somebody else.”


    "You can’t tell anybody about this,” he continued, “but make yourself to keep
    track of what you’ve accomplished. Bring that list with you next week."


    I was excited and did exactly what was required. I chose to keep track of little
    things I had done and brought my list with me the following Saturday morning.


    "Did you bring your list?” Steve inquired. Beaming, I pulled it from my pocket
    and started to open it to share it with him.


    "Wait a minute,” he stopped cold. “You can’t show that to me, right? The deal
    was you didn’t tell anybody what you did."


    I was stunned. But he was more interested in teaching me how well I had done the
    assignment, the insidious nature of self-centeredness. It called into question
    motive, and isn’t this something with which we all struggle. We want to be rewarded
    in any way possible, and isn’t this why some posts on Facebook are from those
    seeking a pat on the back for something nice they did or how they blessed somebody
    else? This is the tricky part of human nature, and its presence in addicts is
    over-the-top.


    But we all must deal with it as we walk through life, especially those on the
    road less travelled. It’s why the gospel of self is so easy to sell and why its
    consequences are so devastating and hard to overcome.

    '
  mdcn: '


    这有助于我的国家。

    我正在履行伟大的使命，将福音传向世界。

    这是我的责任。

    如果我这样做，我将会得到祝福。

    我正在帮助那些比我贫穷的人。


    这就像一支调优良好的管弦响团。你不能只演奏低音部，也不能只演奏高音部。它们在一起创造了奇妙的声音。

    人们也喜欢成为赢家的一部分。没有人喜欢输。

    挑战是重要的，因为人是目标导向的，并且会对同伴压力做出反应。

    划算很重要，比如用100美元就买到了一栋价值1300万美元的建筑。

    还有一种老辈想要帮助年轻人，似乎是为了以某种方式延续社会。


    帕特·罗伯逊（Pat Robertson）那天教我的是，基督教电视事工的成功始于修正人性中那种以自我为中心的核心。注意，他描绘了一幅扩张圆圈的图，每一圈都在远离圆心的自我认可。帮助穷人处于列表的最底端，尽管这种特定的动机与其他部分是分开的，而这体现在我们利用“祝福行动”（Operation
    Blessing）来针对特定类型的基督教捐赠者。然而，其他部分构成了我们事工和筹款的准则。


    有了这种指导，不仅很容易策划筹款，而且很容易策划与“700俱乐部”（The 700 Club）电视节目相关的一切。。为上帝接管国家并没有被定位为一种责任；它更像是“你需要为你自己和你的家人这样做”。在定位的营销实践中，这是一种细微的区别，但它是一个强大得多的动力。帕特·罗伯逊的核心，在最终分析中，如果不包含这一层理解，他所做、所说或成就的任何事情都没有意义的。


    对我们来说，这没有任何阴险之处；这是一种为了善改变世界的真诚而真实的愿望，尽管其最终果实是混乱、分裂和危险的。我们感到上帝的手在引导着我们，我是发真心地写下这些。我们审视进步文化，只看到邪恶。我们感到对基督教和教会的敌意。我们在媒体中受到嘲讽和嘲笑，尤其是那些来自好莱坞的媒体。我们觉得上帝正在把事情交给我们，好让事情变得正确。我们没有看到的是我们的动机被自我驱动的陷阱。毕竟，上帝真的需要我们去修复那些我们认为错误的事情吗？


    即使是帕特广受推崇的生活手册《秘密王国》（The Secret Kingdom），也是一张利用圣经来证明一种基于上述扩张圆圈的、围绕自我、自我获益和自我完善的生活方式的图。它是一本伪装成神学的自学书籍。所宣布的每一条“法则”都旨在帮助个人、家庭和社区在人类竞争领域脱颖而出。通过在这些“王国法则”内生活，你可以让自己变得更健康、更富有、更安全、更快乐，并在文化中更具主导地位。这是对我接受的关于筹款的教学的完美补充，并进一步证明了我们正在教授一种非常阴险的自私形式——自我的福音。


    这，这也是为什么我们都必须照镜子来解决社会问题。当帕特说“我看见了敌人，他就是我们”时，他是正确的。教会迫切需要一个自我检查的时期，以及一种站起来说“够了！”的勇气。然而，只要我们还指着别人的手指说问题是他们的而不是我们的，这种希望就几乎其零。


    因此，我们今天使用 Facebook 和其他形式的社交媒体来传递符合我们世界观的虚假迷因。我们表达对他人行为的强烈厌恶，好像如果我们不这样做，这种厌恶就会传染在我们身上。重要的是我们的雷达，而不是真理。我们听到或看到某些媒体片段，那些熟悉的循环场景在守护着我们，我们觉得有必要通过我们希望影响的人的认可来传递它。为什么？因为这帮助了我，帮助了我的家庭，帮助了我的社区，帮助了我的国家，这是我的责任，如果我这样做，我将会得到祝福。

