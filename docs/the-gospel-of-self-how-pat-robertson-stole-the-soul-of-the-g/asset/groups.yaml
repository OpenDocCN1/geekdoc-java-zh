    从那百分之之一的山顶招募支持。这群人希望他们的祈祷进入公立学校，希望用他们自我为中心的福音来治理贫困计划，希望在涉及个人医疗或关系决策时，用他们自以为义的统治人心，希望他们的生活方式成为常态并决定国家的文化融合，希望他们的音乐、电影、书籍和艺术成为所有人的唯一选择。


    正如我的朋友杰夫·贾维斯（Jeff Jarvis）所说：“沙里法？那与末日审判相比算不上。”


    如果关于这群特定的基督徒只有一个能让我们所有人警惕的真理，那就是：他们永远不会满足于在文化战争中仅仅赢得一次胜利。你可以对此深信不疑。作为一个自我治理的人民，我们不能、也不应该放松警备。人类历史充满了那些迷信偶像崇拜、魔法承诺和人性局限性的人的悲剧。你想要民权被倒退吗？那么今天请保持沉默。你想要让女性沦为奴隶的地位吗？那么今天请保持沉默。你想要恢复奴隶、在公共广场实行肉体刑、让一种由法西斯式的恐惧和刺刀主导的文化统治吗？那么今天请保持沉默。


    从历史角度来看，一个文化的被推翻与一个文化的自我毁灭之间存在巨大差异，而这正是这里正在发生的。如果正如福音派所坚信的那样，他们是建立这个国家的人，那么它的崩溃也必然诞生于同一个子宫。你不能在对一方声称领导力的同时，不对另一方承担责任。这是那些辩称魔鬼、自由主义者、共产主义者或任何其他群体有错的人的盲目盲点。因此，假设基督教本身是受害者完全是自私的，而且在试图对周围的邪恶时也是徒劳的。如果一个滑坡的文化内部统治阶级不能或不愿意为这种滑坡负责，那么它就不需要外力。


    我们现在必须结论，美国今天的统治阶级包含了犹太-基督教西方霸权内部某些强大且发声响亮的元素。昔日的贵族被投机取巧的小偷所取代，这些人渴望并要求的是许可，而非自由。


    过去的人无法认出今天这种“受到攻击”的基督教，其中包括顽固领袖们真正惊人的主张和警告。


    作者兼基督徒领袖玛丽·科伯特（Mary Colbert）：他（上帝）通过他选择的人工作。我们不选择他们。我们所做的就是识别他们；当你识别出一个被选中的人并有洞察知道他们被选中且知道那是上帝的旨意时，你的生活将得到祝福。如果你反对上帝的选中者，你为你和你的孩子以及你的子孙带来从未见过的诅咒。这令我敬畏。35


    《新闻周刊》（Newsweek）：至少100年来首次为美国内阁的圣经学习小组由一位牧师（拉尔夫·德罗林 Ralph Drolling，Capitol Ministries的牧师兼主席：该组织旨在“福音化”选举官员并引导他们向基督成熟）领导，他认为同性恋是“不合法的”，不认为女性应该讲道，并将天主教描述为一种“虚假”宗教。36


    富盛福音传道士肯尼迪·柯普兰（Kenneth Copeland）：如果基督徒不支持特朗普，他们就是在冒着上帝愤怒的风险。特朗普是被上帝选中的，拒绝他就是拒绝上帝。他们可能会受到不孕、贫困甚至生下同性恋孩子的惩罚。37


    媒体通常不记录此类陈述，这并无帮助。只要媒体继续将宗教——尤其是福音派基督教——留在它的“偏离领域”内，它就会运行在一个不包含宗教在文化中发挥作用的叙事中。这意味着媒体运行在那些信仰在生活中是动态动力的人的观点之外。这使得记者和评论员永远无法弄清唐纳德·特朗普在白宫期间到底发生了什么。他们对“自我福音”一无所知。他们愿意讨论对福音派重要的问题，但他们总是会低估和淡化信仰在历史特别是当前事件中的重要性。当理性本身被宣布为信仰的敌人时，仅仅引用无知并应用它是不够的。因此，问题在于美国这场伟大的分裂中的双方都在不同的竞技场上辩论。


    重要问题被完全排除在讨论之外，例如关于唐纳德·特朗普是否属于白宫的问题。福音派声称，是上帝把他放在那里的吗？特朗普执职两年了，已经演变成只有对这个男人有好话说的声音来自他自己的政府、少数极右翼评论员，以及他支持的核心力量——即这些福音派基督徒。他得罪了媒体、自己的政党以及三分之二的美国人，但对于那些实践自我福音的人来说，这一切都是在一个上帝的名下可以被容忍的，这位上帝听到了他人民的哀求并决定拯救这个国家。自我福音教会基督徒，他们今天应该在政治领域战斗，为了那些要为美国和世界恢复正义的人。


    让我们现在考虑一个假设福音派是正确的论点，但让叙述稍放宽。也许上帝真的让唐纳德·特朗普就职了。有时，对于他是否“应该”存在的这个问题，最可能且显而易见的答案就是，这构成了对某些福音派关于“他们的”男人行为的正确回应的本质。唐纳德·特朗普是总统，借用信仰的语言说，他在那里是因为他本该在那里。


