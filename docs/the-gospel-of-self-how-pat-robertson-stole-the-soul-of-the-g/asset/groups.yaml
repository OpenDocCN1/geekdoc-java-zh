    Consequently, these people tend to come off as clumsy, radical, and dangerous,
    and their actions often defy even an ounce of reason. I have been a professional
    observer of life in the US for forty-five years, and the degree to which fundamentalist
    Christianity dominates people of lesser intelligence and education is one of the
    most underreported cultural shifts of modern times. The faith seems able to override
    sense as poor Southerners vote with the Republican Party, which has little or
    no regard for their status whatsoever. Religion, as a result, influence people
    to vote against their best interests in the name of social issues that aren''t
    really under the authority of the church in the first place. Or perhaps it''s
    more the fear that God will punish them if they don''t drives their actions. Regardless,
    such contrarian decision-making is found in those who can''t or really take the
    time to study or learn to think for themselves, and it''s truly as breathtaking
    as it is heartbreaking.


    This is the real weakness and danger of Pat''s shadow government, and the evidence
    is in real examples. No elected official since this process began illustrates
    the issue with Sarah Palin, the former governor of Alaska and presidential running
    mate of Senator John McCain in 2008. The details are well known, but readers need
    to understand that before Sarah ran for anything, she was an outspoken charismatic,
    Evangelical Christian who believed in the “gifts of the Spirit” as practiced by
    many other fundamentalist believers. She spoke the language and knew how to communicate
    on the edge between faith and politics. Her faith is undeniable and her charisma
    is unshakable.


    Palin was a beauty queen and studied communications in college. Her dream was
    to be on television, which began in the news business. In many years in local
    TV news, I met hundreds of Sarah Palins and never hired any of them. The “on TV”
    motivation has ruined the industry, because such people will work for peanuts
    and produce a product that is a mile wide and an inch deep. In most communications
    schools across the country, young people are learning about things such as “how
    to be on TV” instead of studying the pertinent things of life, like history, political
    science, or even English.


    In the 2013 three-volume work Evangelical Christians and Popular Culture: Pop
    Goes the Gospel, a series of essays from contemporary authors edited by Robert
    H. Woods, writer Kevin Healey penned “Constructions of Evangelicalism in Media
    Coverage of Sarah Palin":


    Palin credits Muthee’s (Thomas Muthee, bishop of the Word of Faith church in Kiambu,
    Kenya) “bold” prayer for her success: “And he’s praying not, Oh, Lord, if it will
    be your, he may become governor. No, he just prayed for it. He said, Lord, make
    a way and let her do this next step. And that’s exactly what happened.” Such comments
    shed doubt on the claim that her “task from God” and “pipeline” prayers had been
    mischaracterized. Indeed, Palin’s references to “prayer warriors”—in an interview
    with (James) Dobson and in her book—are consistent with the views of evangelical
    groups. Drawing from scriptural passages, these groups’ leaders launched controversial
    campaigns targeting specific ethnic groups, geographic areas, and “strategic towns.”


    In the minds of many Christians, strategic prayer of this sort is a bridge over
    the canyon of disbelief, for if God is clearing the way, there’s less need to
    study or do the work for yourself. It is assumed that forces in the “Heavenlies”
    are at work, so when certain questions are raised, they can be a real stumbling
    block for those incapable of answering. Questions, for example about qualifications
    and extreme views on social issues, can seem silly and even shocking to believers,
    who “know” that God can and cover any perceived shortcomings.


    Sarah Palin was a fan of The 700 Club and learned the many phrases and tactics
    that eventually put her in the Wasilla City Council, the mayor’s office, and on
    the governor’s office in Juneau, Alaska. At every step, she brought issues like
    abortion, gun control, term limits, and others that resonated with conservative
    Christians and, more importantly, Republicans. They had nothing to do with local
    government, but she was very effective, and her charisma was a weapon she knew
    could count on.


    John McCain’s astonishing choice of Ms. Palin as his running mate in 2008 blew
    up in his face when CBS anchor Katie Cour interviewed Palin. The governor stormed
    badly and came off as intellectually wanting. If I wasn’t with Pat Robertson when
    all of this went down, I would bet good money that he was disappointed. She seemed
    to fit every right wing criteria except one—she was, as we used to say in East
    Texas, dumber than a bucket of hair.


    Fast-forward to today, and you’ll find this lingering ignorance at every level,
    and the sad thing to me is that not only a comic, satirical television program
    like The Daily Show is willing to talk about it. Evangelicals are now so connected
    and important to the Republican Party that those wishing political office within
    the GOP, including Donald Trump, must cater to their every wish. It makes it very
    difficult to judge the character of Republican candidates outside the circle of
    faith.


    What had started as a sincere attempt to arm Christians with the tools of government
    has turned into a celebration of fools who seem to believe that their religious
    convictions qualify as a trait of good character and that these convictions make
    amends for intellectual deficiencies. This is what happens when religion and politics
    cross paths, especially with Evangelical Christians, where faith bridges any gap
    in logic and reasoning.


    I was a part of this in the early and mid 1980s, and my warning to readers today
    is to beware of the presumed safety of the group. God wants us to think or He
    wouldn’t have given us brains, and that means learning to think for ourselves.
    What good is the sacrifice of Jesus, if—

