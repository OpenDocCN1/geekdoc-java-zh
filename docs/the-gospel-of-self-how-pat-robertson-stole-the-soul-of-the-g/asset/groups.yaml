    wrong?” I asked him. He went on to complain about the Ford Motor Company and how
    their ads were dishonest and misleading. He had a new Ford Bronco and had apparently
    taken it for a drive similar to what was shown on TV, with the vehicle bouncing
    off rough terrain and splashing through deep mud and puddles. He had messed up
    the brakes and the suspension on his new car, and wasn''t happy. It was one of
    the funniest moments I ever had with him.


    I was on the stage with Pat during our Friday prayer meetings and every other
    all-staff gathering. I played my guitar and lead worship with another guitar player,
    Bill Borowik, and Pat always expressed his love and admiration for our work. On
    September 6, 1983, Pat was even inspired to send a memo to Bill and me.


    “Just another word to tell you how outstanding the Labor Day prayer meeting was.
    I think the music was the best we ever had. The new faculty staff at the University
    was absolutely thrilled at the praise unto the Lord.


    Thanks again,

    PR”


    It was a real honor to lead worship at CBN, and as long as Pat was happy, I didn''t
    really care what anybody else had to say. I was often asked to mix in more contemporary
    music, but those songs never seemed to fit in what Bill and I were doing, which
    was simply to be guided by the flow. This required a certainty to the music in
    order to follow one song with another in rhythm and take the praise and worship
    where we felt it needed to go. This meant no pre-planned list or order, because
    we didn''t wish to tie ourselves into a set plan. We preferred to wing it, and
    the audience and Pat seemed to appreciate that. Nobody will ever know if Bill
    and I were being guided by our own egos or from beyond, but I do remember some
    remarkable times and feelings of utter bliss in the process of playing my guitar
    and singing in front of the staff of CBN.


    I remember a prayer meeting during which a woman began speaking in tongues in
    a moment of quiet. Pat immediately grabbed me and said, “Start playing something
    now!” I started playing and singing and Pat joined in the same moment. Pat picked
    up on it, and soon the whole place was filled with song, and the woman was completely
    drowned out. This was the only time in the hundreds of prayer meetings I can recall
    that someone else Pat brought what he believed was a “message” to the gathered.
    Afterwards, I asked Pat why he had interrupted her, and he said, “She was in the
    flesh,” which meant he had interpreted her gesture as self-centered. I asked if
    he wanted me to always act that way, and he responded that it depended on who
    was prophesying and a discernment of the spirit.


    There was one prayer meeting I recall that led to shameful behavior on my part,
    although it is very hard to admit. It was one of the holiday meetings, so everyone
    was present. I woke up, sat at the toilet, and immediately threw my back out.
    It was awful, and I couldn''t move well. I was in intense pain as the relentless
    muscle spasms impacted nerves to the point where I was convinced I should stay
    home. I called Pat to apologize, and he would never hear of it.


    “Come on, brother,” he chided me. “Don’t you think God can heal that?”


