    ministry, and the whole mess impacted me deeply as a person.


    One of the CBN News reporters, Kathy Bullock, had long impressed me with her natural
    presence on camera and her intelligence as a correspondent. In the vernacular
    of TV consultants, Kathy “got past the glass” on TV, meaning she had the unique
    ability to grab attention beyond the screen by having the looks and personality
    to really communicate. She was young, but she was comfortable in the co-host chair
    and did a wonderful job filling in after Danuta was cancelled. My inclination
    was to press for her to become the new co-host, but Pat and those who nodded their
    heads in lockstep with every opinion he expressed torpedoed the idea. Pat felt
    she was too young and inexperienced, although that was neither my nor the view
    of my staff.


    I first called Terry Meeuwsen, an old friend from my news days in Milwaukee. Terry
    was a former Miss America and a gifted on-air host. She had filled in occasionally
    and was a natural new co-host for The 700 Club. Unfortunately, family and work
    made her moving to Virginia Beach impossible at the time, although she did become
    co-host many years later.


    My next thought was to contact Susan Howard, one of the stars of the hit show
    Dallas. I had met her when we had taken The 700 Club to California several years
    earlier, and I thought she would bring new'
  - '[PAGE 97]


    viewers and followers. I called in every mark I had with people in Hollywood and
    in the ministry, and we eventually convinced her to come aboard. This was a very
    big deal, because she was an A-List Hollywood celebrity.


    While Susan brought her certain Hollywood backstage expectations, she was truly
    wonderful as co-host of the program. Her presence on the set lifted the show to
    a time when it really needed lifting. She was dynamic and her face lit up the
    screen, adding a certain kind of credibility to a TV ministry program that was
    under deep public scrutiny. She was kind and compassionate, and the employees
    of CBN loved her. Pat and Ben worked well with her, and soon Danuta’s loss seemed
    like water under the bridge to most people. I know better, however, I doubted
    the permanence of Susan’s efforts. She was a California gal and an actress. Her
    husband came with her, and his only concern, justifiably, was Susan and her career.
    Despite my duties, I hired her anyway, because the program badly needed a breath
    of fresh air, and Susan was certainly that.


    Pat Robertson grew more political on the program as the days, weeks, and months
    passed. When he was away, we were able to occasionally run segments titled “Pat
    Robertson’s Perspective” that were shot on a different, more authoritatively designed
    set. I proposed in 1984 that we convert the last half-hour of the ninety-minute
    700 Club to a stand-alone half-hour program of the same name. I thought we might
    be able to syndicate it from The 700 Club and that might relieve our show from
    the encroachment of political segments. We built the set to create a pilot, but
    the whole thing was snubbed. We later used it to create segments, so that Pat
    could still appear to be on the show, even though he was on the “unofficial” campaign.


    In 1986, prior to my leaving, and 1987, there were new faces that were occasionally
    in Pat’s dressing room and around the set of the program, mostly connected with
    Pat’s campaign, and lines began to get blurry. Jerry Curry, one of Pat’s closest
    advisors, sent me a memo in April of 1986:


    I suppose this is somewhat presumptive, but I keep running into Reagan officials
    whom Pat might want to select for key jobs in a Robertson Administration, should
    the need ever arise. It occurs to'
  - '[PAGE 98]


    me one way for Pat to get acquainted with these folks would be to interview them
    on The 700 Club. So, consider this Memo Number One in the great search for new
    talent. Unless you have a problem with me reducing this to writing, I will run
    these names by you on a periodic basis.


    He then recommended Alan E. Sears, staff director of the Meese Commission on pornography
    at the Justice Department—“Alan is the type of person we would want to select
    for a top job at the Justice Department, if not the top job itself”; Ralph Stanley,
    head of the Urban Mass Transportation Administration—“He would make an outstanding
    Secretary of Transportation”; and Dave Swoap, Curry wanted him for Secretary of
    Health and Human Services added, “Dave, who is about 45, brings the same kind
    of intellectual quality to his work that you and Pat bring to yours.”


    And, for the record, let’s not forget Ollie North at the National Security Council.
    Three more years in that job and he ought to be ready to take [John] Poindexter’s
    place [Reagan’s National Security Advisor].


    Now, how do we get these guys on The 700 Club?


    The point is that we regularly crossed the line of what most would consider ethical
    and what the IRS would deem illegal according to the laws that governed 501(c)(3)
    tax-exempt organizations. I tried wherever possible to keep things in check, but
    the truth is I was complicit with Pat and his election team in pushing the envelope
    even over the line. It felt was something that I could manage, although line was
    always a moving target. Remember, we were trying to change the world for the better,
    and what did it matter as long as God was on our side? I struggled internally,
    but I had made the decision to come back to CBN, and I knew what Pat wanted and
    needed. It added to my stress, of course, but I was willing to go there for the
    chance to be part of history. Danauta also experienced this feeling of being over
    the ethical line and expressed it succinctly in her book:'
  - '[PAGE 99]


    My mere presence on the set of The 700 Club made me an accessory to a progressively
    wilder and more extreme view of Christianity. Worse, I was helping leverage a
    campaign to make Pat the most powerful man in the world. I tried justifying my
    position with the argument that politics and faith are intertwined; both require
    judgments based on morality. But down inside, I was still a journalist insisting
    on documentation.17


    When we produced live reports from the scene of certain campaign stops, it was
    always my to do so. Let''s face it, The 700 Club is a personality-driven television
    show, and Pat Robertson was the personality. Remove him from the program, you
    remove its edge, and that was something I felt certain that I had to protect.
    And so my decisions advanced the campaign and gave Pat the platform he needed
    to speak to and with his supporters across the country. It was “free,” if you
    will, but it was questionable both ethically and legally. We were publicly presenting
    ourselves as a news organization, and many of us suspected that this was nothing
    more than wishful thinking.


    The IRS began investigating CBN and the Freedom Council, a 501(c) organization
    supported by the ministry, in the early fall of 1986, after Pat had made his initial
    announcement about seeking the presidency if three million citizens would sign
    a petition of support. The timing of this criminal investigation by a federal
    agency is important to understand as it pertains to the whole business of Pat
    running for president. After all, his chief opponent during the campaign was George
    H. W. Bush, the sitting vice president.


    Portions of my deposition with the IRS Criminal Investigative Division are published
    later in this book, but the point is it cast a pall over the entire ministry and
    was constantly a subject of discussion as I went about my day in and day out.
    Let me say again that Pat''s running for president was not fully endorsed by the
    management team at CBN, and I had to deal with the fallout certain guests or segments
    we did. I was always working for two masters at the ministry, and they were very
    often not on the same page.'
- md: '

    In my dealings with everyone, I had no choice but to let my actions reflect a
    belief that Pat would win the election. Not only was I a leader at CBN, but in
    many ways, I was Pat’s right-hand man as it pertained to the primary instrument
    of CBN, **The 700 Club**. I would not have come back in 1987 had I not believed
    in what we were doing. Every decision I made carried as a core justification,
    and it didn’t matter if I eventually proved right or wrong. The issue was what
    to do today, and that meant becoming a rower in Pat’s boat. To live in the future,
    especially one governed by fear, was not the right choice for anyone in my position.


    I often led worship at prayer meetings with the ministry. In the last prayer meeting
    before Pat began an extended period of campaigning, I played “Hail to the Chief”
    on my guitar as he left the room with a thousand people silent. It got his attention,
    and he smiled. It was my way of wishing him Godspeed on the journey.


    We soldiered in Pat’s absence, occasionally using pre-taped segments of “Pat’s
    Perspective” to fill the gap, but things outside our control the task of delivering
    a television program without Pat Robertson was difficult, at least.


    On many occasions, I was able to convince Charles Colson, one of the Watergate
    co-conspirators and subsequent founder of Prison Fellowship, to either co-host
    the program in Pat’s absence or tape segments we could use later. Chuck became
    a dear friend, and the work we did together on *The 700 Club* was some of my best.
    I was a supporter of Pat’s efforts and brought a similar, authoritative and conservative
    view of public policy and analysis of current events. He was philosophically a
    pragmatist and didn’t believe in the charismata or “gifts” of the Holy Spirit
    in the practice of Christianity and especially at CBN. He was a highly intelligent
    observer of current events, however, and quite comfortable in Pat’s chair. He
    could easily handle the “father figure” role necessary in the on-air chemistry
    of the program.


    He once told me of being approached by Dallas Robert Tilton in Texas and advised
    to “embrace” speaking in tongues and proclaiming the gifts of the spirit. Tilton’s
    reasoning? “That’s where the money is.” Colson smiled when he told me that, and
    I knew what he meant. Money was the curse of televangelism in the 1980s, and Chuck
    Colson wanted nothing to do with it.


    In one of his letters to me many years later, he wrote, “You should know that
    after you left CBN, I was never invited back again.” He always thanked me for
    the opportunities he was given to be of service, and it''s a shame he was never
    considered good enough to bring on as a replacement in Pat''s absence.


    By January of 1988, the ministry of CBN was in deep trouble financially. CBN was
    the home of gifted marketers and fundraising development specialists who lived
    and died by statistics, and the stats by that time were dreadful, especially those
    showing direct ministry between CBN telephone counselors and callers. We measured
    everything from salvation prayers to ministering to people contemplating suicide.
    Comparing ministry stats from January of 1988 with January of 1987 was revealing:


    | Specific Ministry | 1987 | 1988 | % Variation |

    |---|---|---|---|

    | Calls | 685,724 | 346,088 | -49 |

    | Salvations | 34,130 | 17,850 | -47 |

    | Prayer Requests | 396,176 | 243,777 | -38 |

    | Answers to Prayer | 9,763 | 4,901 | -49 |

    | Holy Spirit Bits | 10,672 | 9,031 | -15 |

    | Family Counsel | 114,902 | 81,496 | -29 |

    | Drugs | 12,152 | 8,479 | -30 |

    | Alcohol | 15,525 | 7,753 | -50 |

    | Sexual Deviates | 6,122 | 3,482 | -43 |

    | Suicides | 1,331 | 908 | -31 |


    This drop of nearly half was primarily the result of the evangelist scandals,
    and the media suggested that Pat Robertson''s campaign for president was in the
    same category. It placed the entire ministry in jeopardy and was impossible to
    overcome given the circumstances.


    Nevertheless, I tried. We held a planning retreat at The Homestead in Hot Springs
    and numerous internal meetings, research, and trials. I brought in the top TV
    consulting company Audience Research & Development (AR&D), from my background
    in the news business, which I later learned didn''t sit well with some. Ben and
    Susan were still onboard, to which I wanted to add Chuck Colson. That was rejected,
    and so I turned to two people already at the ministry, Scott Ross, a minister
    to the music industry with the ability to recruit a younger audience, and Bob
    Slosser, a long-time ministry leader as CEO, president of Regent University, senior
    editor of CBN News, and a former New Times assistant editor. While spoken, Bob
    had the credentials and the chops to function as commentator on current events.
    It had seemed to me that this team—with the proper support—could carry on with
    the ministry and mission of The 700 Club until Pat''s campaign was over, whether
    he won or.


