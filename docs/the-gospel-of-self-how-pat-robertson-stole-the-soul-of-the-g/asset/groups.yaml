    Pat Robertson never passed the bar exam, but instead had a religious conversion.
    He went to New York Theological Seminary, receiving a Masters in Divinity in 1959.
    A year later he established the Christian Broadcasting Network (CBN) in Portsmouth,
    Virginia. He has built a massive television empire and is one of the most controversial
    Evangelical Christians on TV, where he practices the charismatic “gifts of the
    spirit,” including speaking in tongues and signs and wonders such as “healing.”
    But the political animal continued to seek the surface throughout his television
    ministry, and this would play a huge role in my own life and in the political
    dynamics of the Republican Party, one that continues to this day.


    When I worked with him in the 1980s, we practiced and promoted a brand of Charismatic
    Christianity that was seen as a breath of fresh air to a faith that had grown
    stable in every aspect, from its music to its preaching, and we worked long, hard
    hours to move hearts and souls in the way we felt right. In doing so, we altered
    the course of political power in the United States, and it was natural as our
    Christian calling. Taking on social issues formerly held by conservative Democrats,
    such as the sanctity of life, religious liberties, patriotism, family, school
    prayer, and respect for individualism and tradition, we spoke to primarily rural
    and suburban Christians on behalf of the Republican Party. We presented Biblical
    mandates or “laws” economic views that catered to the haves of culture, teaching
    that one of the halves was available for everybody. Our arguments and teachings
    helped move the GOP to the right on the political spectrum and created a following
    that continues to baffle the smartest political analysts in the country who are
    confounded by how people would act against their own best interests in giving
    power to Republicans.


    Pat Robertson was a highly intelligent, articulate, well-read, creative, and brilliant
    man to work for. There wasn''t a day that I didn''t admire his ability to communicate
    via live television. The more prepared I was, the better I was able to perform.
    I was a willing participant in his social engineering, I agreed with him that
    the world was going to hell, and I was proud to be at his side in trying to change
    that. And it didn’t matter one to me that we crossed lines along the way. I was
    an experienced news executive, and I knew right from wrong when it came to journalism
    and the narratives of liberty.'
  - '[PAGE 12]


    I used that knowledge to bring our daily message right up to the edge of both
    ethics and the law without embarrassing ourselves. It turned out that my efforts
    could not protect us from what happened outside my purview. Many hands were involved
    in our political efforts, and it became evident that they weren''t guided by the
    same principles we tried to apply to The 700 Club.


    Moreover, there is a vast difference, I discovered, between what we believed and
    did what the students would do with what we taught them. This is why I don''t
    fear conservative leaders in the world today, but I''m frightened to death by
    their followers. We broke the law. We stretched the truth. Why would we be surprised
    or complain if our followers did likewise? Our attempts to manage a political
    movement trapped us in the belief that God needed us and our work in order to
    accomplish change the hearts of humankind. We organized human efforts to change,
    and that is an untenable position for those attempting publicly to do the work
    of God.


    I do not know how to adequately justify this dichotomy in my own thinking and
    behavior during the time I helped The 700 Club. Was I simply caught up in something
    that I couldn''t handle? Was I naïve, because I was such a novice in the faith?
    Was my ego running the show, as I gave myself completely to the task of the CBN?
    Perhaps it was none or all of the above, but I know that we created—or at least
    played a major role in the creation of—the extreme Christian element that has
    dragged the Republican Party to the edge of fascism. There is no zeal like that
    of religious zeal, for it comes with blinders to alternative views of reality.
    When this zeal is aimed at pleasing God Himself, it''s impossible to negotiate
    or reason with it or its consequences.


    And why should conservative leadership care as long as this group votes? Politics
    is a dirty, dirty business, as Pat discovered later with the tactics of his chief
    rival, George H.W. Bus. Trying to reform a culture through political means is
    vanity and a useless pursuit, and yet this was the consequential fruit of my work
    at CBN and The 700 Club. It may have been great television, but the internal price
    I paid, as you will later discover, almost brought about my total destruction
    as a man, a father, a believer in something bigger than myself, and as a professional
    observer.'
- md: '

    Ronald Reagan was the President when I joined CBN, and there was a sense of revival
    in the air, for we had just come out of the decade of Vietnam, Watergate, and
    the Iranian hostage crisis. We had been floundering as a nation for more than
    a dozen years, since the assassinations of John F. Kennedy, Robert F. Kennedy,
    and Martin Luther King. By the early 1980s, people were suddenly hopeful that
    prosperity of all kinds would return to America, and I deeply caught up in it.
    We were, after all, counterculture, and that fired my imagination and gave me
    strength, for we were in a position to actually make a difference in the lives
    of many.


    Little did I—or anyone back then—realize how far off the rails we would be running
    chase to a vision of God’s will for Christians, the church, and the US as a whole.
    It is a profoundly difficult statement to make for me, who was so intimately involved
    in the process, but it is a truth nonetheless that must be examined without the
    blinders that accompany the fundamentalist regimen of certain Evangelical Christians.
    The stakes are simply too high for us and for progeny to ignore the facts of what
    we did and how we did it.


    Fast-forward thirty years, and America is now a bitterly divided nation. It is
    as though a new civil war has emerged by polar opposites on the political spectrum.
    All equilibrium lost, and we are awash in the chaos of division at every level.
    Add to this the remarkable technological advancements of the last fifteen years
    that have undercut the power of down communications systems in favor of lateral,
    peer-to-peer communications, and the depth of this division is bitterly played
    out in what we call “social media” every day.


    There is no sense of community anymore—no one nation, under God, indivisible—and
    we are a people bickering and at each other’s throats. The press no longer functions
    with the public trust, for journalists have been exposed as biased, manipulative,
    and in for themselves. Spiro Agner’s famous speech about the power of television
    news—while thoroughly dismissed by the press at the time—turns out to have been:


    > ...the president of the United States has a right to communicate directly with
    the people who elected him, and the people of this country have the right to make
    up their own minds and form their own opinions about a presidential address, without
    having the president’s words and thoughts characterized through the prejudice
    of hostile critics before they can even be digested.¹¹


    At CBN in the early 1980s, we hammered home the idea of a liberal bias in the
    press, which has turned out to be a lasting cultural contribution, as the success
    of Fox News demonstrates. The press has yet to fully accept this idea, however,
    even though the artificial hegemony of “objectivity” has today been replaced by
    the concept of transparency.


    The American ideal of oneness through assimilated diversity—the dream of Martin
    Luther King once spoke—has been crushed under the weight of many well-intentioned
    people who prefer the country as a tapestry of many different types of people
    rather than a melting pool with unified ideals.


    In the midst of this today, a master manipulator, showman, and salesman seized
    power in Washington by exploiting fear, repeating themes that resonate with certain
    Americans, and promising simple solutions to complex problems facing the country.
    Intellectuals, media, and political observers are still puzzled by how Donald
    Trump was elected President and are positing theory upon theory as to why his
    followers he his call.


    The reality, however, is that they were never heeded his call; he heeded and responded
    to their call. Donald Trump is skilled at deciphering the voice of those who feel
    disenfranchised by the culture and where it’s heading. As a salesman, Mr. Trump
    sensed an entry point into which then enabled him to articulate a product that
    sold. All he had to do was to paint a black and white, dystopian view of America
    and offer himself as the solution. This is not original thinking, for all he was
    doing was repeating the things discussed in the back rooms of white evangelicals,
    and we were at CBN the ones who planted many of these thoughts. These people are
    we organized and nurtured thirty years ago with The 700 Club, and I feel responsible,
    at least in part. As executive producer of the program during the season up to
    and including Pat Robertson’s run for president in 1988, I helmed every part of
    what we put on TV, the result of which was a very deliberate and profound turning
    of the Republican Party to the right.


    We knew exactly what we were doing, too. Armed with research at every step, we
    presented a form of Christianity that included getting involved in politics at
    every level. God wanted us to wrest away from those who were destroying the Christian
    foundation of the country, and Virginia Beach was the most appropriate location
