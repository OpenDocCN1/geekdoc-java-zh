    come a long, long way from its roots as a talk show, and there was just no way
    Pat would allow it to go back. In his mind, I’m sure, he was happy to let people
    play with talk shows, but not The 700 Club, because the program was far more than
    just a television program that could be replaced by another. It was the heart
    and soul of a multi-million dollar effort to change the world, and that was really
    quite sacred. Tampering with its fabric would be similar to soiling holy. That
    may seem absurd to some, but this is the context within which the ministry of
    CBN was considered at the highest levels of the faithful.


    There was also discussion at the meeting about how funds were slipping, and it
    was all mixed together to create an atmosphere of fear and trembling. I picked
    it up from this immediately, and it further prompted my own feelings of trepidation
    ever coming back.


    The meeting broke up without resolution. People said to my face that it was good
    to see me and wished me well. Pat and I made arrangements for lunch the next day,
    and I was offered a ride to my hotel, which I accepted.


    That night, I went through everything I’d just had. I had to be able to answer
    Pat’s question of what I would bring back. My mind raced, and I think I’d already
    accepted that I would be returning. I knew Pat Robertson like others, and while
    others have their opinions based on their experiences, Pat and I communicated
    non-verbally in ways that I’m still unable to explain. Mostly, I knew his television
    program and everything he was hoping to create with it, without exception. I had
    come into the ministry with a television news background as a rookie Christian,
    and while there are church leaders who would suggest this was a violation of scripture,
    I always felt it gave me an advantage over others, because I wasn’t completely
    washed in the water of the Christian way of doing things. I couldn’t and wouldn’t
    succumb to such, because I was on a serious mission with the host of the program
    and rejected the naïve to march in lockstep without question.


    This also made me dangerous to those who did so much, because my head went in
    both directions during important meetings. It gave me a boldness to confront and
    offend, if necessary, because I knew exactly what we were doing in bending the
    rules of “this is how you do it.” In boardroom meetings, Pat would often make
    a creative suggestion and immediately look in my direction, because he knew he
    would get the truth from me, while others simply nodded in agreement. He’d laugh
    his nervous laugh if I disagreed with something and then announce to the group,
    “Well, Mr. Heaton doesn’t think so much of it.” I was utterly afraid of him on
    the surface, because I tried to practice the truth of hiding my place when the
    anger of the ruler arose. Pat’s bite could be pretty awful. He was a powerful
    presence with charisma that radiated in every direction. He was also incredibly
    intelligent and could win any argument.


    We would often spar in the dressing room, and I recall about the beauty of the
    Mona Lisa. I thought she was a pretty ugly woman, but Pat insisted her beauty
    was objective and without question, because the painting was a masterpiece. I
    reminded him that opinions about art are highly subjective, and I''ll never forget
    his response: “Well, it may be subjective, but I am the subject!” He won with
    that.


    I doubt anyone at CBN had more discussions on strategy and tactics than Pat and
    I did. Nearly every conversation had strategy and tactics at the core, for the
    mission itself was highly strategic. Nothing was left to chance that could be
    nailed down strategically. This was CBN. This was Pat Robertson. This was The
    700 Club.


    There were similarities to television news in general, the objective strategic—to
    grow audience—not to merely serve the information needs of the public. At CBN
    we were mining the salvation of Jesus for people across the globe, but strategically
    we were trying very hard to change that world in order to save it. Yes, we were
    ministers of the faith, but we were also a highly effective political machine,
    and our strategy was to link the two in such a way as to produce results. We didn’t
    just point out problems; we wanted also to empower people through solutions that
    they could support, most of which were via the ballot box or storming Washington
    and our representatives by telephone with opinions.


    Our lunch was nice. We had a private table at a hotel restaurant and talked about
    things like his wish to get back on the tennis court. He could never beat me,
    but that didn’t keep him from trying. I think he liked the idea that I wouldn’t
    “let” him win.


    After lunch was cleared away, he asked, “What would it take for you to come back
    and help me, Terry?”


    That was a very heavy moment for me, so I responded given the nature of the difficulties
    ahead for him and the ministry, money wasn’t real consideration for coming back,
    but that authority would definitely be. Absent the authority to steer the course,
    the responsibility would crush anybody. I didn’t want anyone in my way whatsoever.
    If he was going to direct me in taking the program to a place that he and his
    ministry could live with, I would need the authority to direct others who were
    reticent, regardless of their reasoning. This was the absolute must that I insisted
    on, for the job would’ve been untenable without it. Based on his assurances that
    it would be so, I agreed to return to CBN as executive producer of The 700 Club
    with responsibilities that included fundraising and, finally, CBN News.


    I should have known that he would be unable later to fulfill this promise, but
    the red flag was covered up by my ego and the need to please my wife. The result
    was I walked right into a trap.


