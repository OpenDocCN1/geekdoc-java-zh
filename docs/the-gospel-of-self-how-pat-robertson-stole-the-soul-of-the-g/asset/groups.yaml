  mdcn: '

    可能还有其他几个人。苏珊·霍华德（Susan Howard）已经离开了，所以这完全是一场男人的会议。


    在消息公布之前，我就感到不赞同，在我再次分享我下周及今之后的计划后，这种感觉愈发强烈。


    帕特·罗伯逊（Pat Robertson）在电视领域方面几乎可以处理任何问题，但他坚决不允许其他人可能筹集自己的事工资金。这就是 20 世纪 70 年代初帕特与吉姆和米米·巴克（Jim
    and Tammy Bakker）分裂的核心问题。巴克夫妇曾帮助他建立了 CBN 和《700 俱乐部》，但他们希望能够在 CBN 网络上筹集自己的事工资金。帕特拒绝了。随后，安置巴克夫妇景地的摄影棚里发生了一场神秘的火灾，吉姆和米米从弗吉尼亚州的波尔斯茅搬到了加利福尼亚，以推进他们自己的事工。


    在电视募款活动后的会议上，帕特显得焦躁且易怒，在拒绝了我说的每一个字后，他转向他的儿子说：“提姆（Tim），你必须做这件事了。”


    提姆·罗伯逊（Tim Robertson）更像他的母亲而不是父亲。他很有才华，而且是一个极具天赋的业务管理人员，但他几乎没有魅力，没有公开露面的意愿，也没有电视经验。他脸涨通红，表示反对，说如果他试图取代父亲来主持《700
    俱乐部》，对事工来说将是灾难性的。


    帕特完全不买账他说：“提姆，你可以的。我需要你这样做。特里（Terry）和员工会帮助你的。一切会好的。”


    但房间里的每个人都知道并不会好的，尽管我一直在抗议，也没有人站出来与帕特·罗伯逊争论。他的症结在于钱。他不希望有任何姓氏不是罗伯逊的人掌管电视节目。他的长子戈登（Gordon）在气质和魅力方面与其父亲如出一辙，但他不想与事工有任何关系，尽管这在多年后发生了改变。


    事情就是这样。我想我预料到了会发生，但我并没有——其他人也没有预料到。事实就是如此，我别选择只能硬着头皮继续下去。但那天，我的心不在焉焉。提姆在最初的几次亮相中表现得糟糕透极，看起来无论如何都完全像是一个父亲在不顾结果如何的情况下将自己的事工交给了儿子。我感到备受打击、痛苦不堪，我本该对自己的生活和职业负责并在那时辞职，但我没有，因为我有家庭要养，我需要时间思考。我强装起战士的表情，用我所有的尽尽努力。但这永远是不够。


    帕特偶尔露面，包括 1988 年 2 月 9 日，那是他在爱荷华州初选中领先于布什的第二天。在前一天晚上，我看了电视网络报道，帕特与 NBC 的汤姆·布罗卡（Tom
    Brokaw）发生了电视口角，布罗卡一直称他为“电视福音战士”。帕特理地认为这种说法是蓄意的贬低，于是他找布罗卡算账。这并不高明，因为候选人永远赢不了电视电台主播。


    那天早晨在更衣室，我告诉他我认为他犯了错误。在与帕特相处的几年里，无论他是否同意，他总是欣赏我的意见。我只是喜欢那种有力量告诉他我想法的感觉。然而，这一次他生气了。


    我们争论了一会儿，自然而然，我输了争论。帕特随口就能出一个比喻的能力是他他真正的天赋之一，但那个早晨的感觉并不好受。


    在随后的几周里，我们尝试了多种有提姆或无提目的主持人组合。苏珊·霍华德回了加利福尼亚，这很难责怪她。她给了我们六个月时间，对我来说已经足够了，尤其是考虑到幕后和电视上动荡不安的局势。


    凯西·布洛克（Kathy Bullock）和辛迪·格拉斯泽（Cindy Glaser）替补了她的工作，我们开启了新一轮对女性联合主持人的寻找。我们搭建了一个新景棚——当地报纸说它的颜色与《迈阿密风云》（Miami
    Vice）的配色相匹配，尽管那并非我们的本意。我们想要的是现代感，而粉色调是当时的潮流，无论这是否受《迈阿密风云》的影响。


    帕特给了我们指令，其中包含了这段圣经经文：


    “没有人从新衣服上剪补丁补在旧衣服。若是如此，就破了新衣服，新补丁也与旧的不相配。没有人把新酒装在旧皮袋里。若是如此，新酒就要破皮袋，酒漏出来，皮袋也坏了。新酒倒要装在新皮袋里。喝了旧酒的人就不想要新酒，因为他说‘旧的更好。’”（路加福音
    5:36-39）


    我完全赞成新酒，但我从未计划让节目在过程中完全失去它的认同。随着事工状况恶化，本·金奇洛（Ben Kinchlow）宣布了他的离开。我很难责怪他。本在节目中担任了多年二把，但他以“让罗伯逊掌权”的名义被忽略了。我无力阻止这种衰败。CBN
    董事会在 3 月 14 日当周开会，与提姆一起巩固了权力，宣布在提姆的领导下进行重大重组，并终止了我作为《700 俱乐部》执行制人的聘用。


    3 月 18 日，《弗吉尼亚领员报》（Virginian Pilot）的一篇报道记录了这次重组：


    “为了重启 CBN 的旗舰节目《700 俱乐部》，七成员董事会还要求 CBN 在全国范围内寻找电视人才和更好的格式。本顿·米勒（Benton Miller）表示，董事会认为《700
    俱乐部》需要更具吸引力。不要提供垃圾’。”

