  - '[PAGE 25]


    As the Republican Party drifts farther to the right, Evangelical Christians find
    themselves in the position of having to deny that they''ve become exactly what
    they despise—a group of elites trying to force their beliefs on others. Within
    this denial, the twisting of truth is self-serving. Democrats are demonized as
    socialists, communists, Marxists, and of course, liberals who want to steal from
    them in the name of government control of their lives. The obvious conflict here
    is the idea that God is somehow unable to deal with this absent help.


    Maybe America is under judgment right now. Maybe God is sick and tired of all
    our shenanigans, including those being done in His name. Maybe our cultural problems
    are all a reflection of the gospel of self, and God is judging not the world but
    the church. I''m reminded of the story of Jesus being brought before Pontius Pilate
    for the crime of being declared “King of the Jews.” His response was that He was
    “not of this world” and if He were, His followers would fight to free Him. We
    are unable to see ourselves in this position, for it seems we are fighting to
    save the wrong world.


    And through the Republican Party of all things. After all, it helps me, it helps
    my family, it helps my community, it helps my nation, it''s my duty, and I''ll
    get blessed if I do.'
  - '[PAGE 26]


    # Two


    # The Commission and the Mission


    > To argue with a person who has renounced the use of reason is like administering
    medicine to the dead.

    —Thomas Paine


    I had a rather miraculous born-again experience while working as host and producer
    of PM Magazine in Louisville, Kentucky in 1980. It happened as I was driving my
    car from a meeting with an Evangelical Christian in his A-frame house in the forests
    of Southern Indiana. We had been discussing my life of depression, sex, suicide,
    drugs, and alcohol, while he talked to me about his faith. I cried non-stop the
    entire trip and fell asleep exhausted when I got home.


    The next morning, it seemed like everything had changed for me. I felt wonderful,
    my depression had lifted, I no longer felt the need for drugs, and the most amazing
    thing was that my language had been completely transformed, as I simply could
    not course. I ceremoniously dumped all of my drugs and parapernalia into the Ohio
    River and went about my life as a different person.


    At work, I put up a poster of a Monarch butterfly with the words "Born Again."
    I got involved with a small family ministry in Southern Indiana and wrote scores
    of songs for the contemporary Christian band Revival. I was energized and felt
    alive like I hadn''t ever felt before. I felt a sense of purpose, one of glorifying
    God and the creation. I wanted to sing, and I couldn''t stop smiling. I was a
    desperate, despondent, and dying drug abuser on a path to destruction, and overnight,
    I was the opposite. I felt at peace'
  - '[PAGE 27]


    with my religious roots and fully in love with the character of Jesus. That fullness
    of love made me feel amazing. I felt clean. I wanted to give. I wanted to put
    something into the world. I wanted to be a help and a blessing to others. I wanted
    to tell everybody about what had happened to me.


    I also started watching television, for I wanted to learn everything I could.
    This included programs like The 700 Club and teaching programs featuring intelligent
    people—or at those who seemed intelligent—like Kenneth Copeland, Charles Stanley,
    and James Robison.


    I got a letter one day from a student at what was then CBN University. She was
    doing her thesis on “magazine story burnout,” a phenomenon that negatively impacts
    people who did what I was doing. She told me she was surveying producers of PM
    Magazine about the topic and asked that I fill out her survey form and send it
    back. I did and received a phone call from her next week. She told me that my
    answers were different than most, and she said I must be a Christian.” I told
    her yes, and asked if I had ever considered working for CBN. She said I sent her
    a tape of my work and that she would pass it along to the ministry. I complied.


    The first story on my tape was a six-minute piece about a horse photographer from
    Lexington, the home of thoroughbred racing. It featured Secretariat, the famous
    Triple Crown winner, and how this photographer worked with horses to get perfect
    composition photos. One section revealed his secret for getting the horse''s attention,
    so that its ears would point perfectly forward. He played an autiotape of a mare
    in heat walking through a barn of stallions.


    Pat Robertson''s second love was thoroughbred horses, and I was told he was fascinated
    by this story. I was invited to Virginia Beach to interview for a job with The
    700 Club. I went and met Executive Producer Michael Little and the rest of the
    CBN heavy. They were particularly intrigued by the relatively small amount of
    time it took me to produce the horse story, for the role of story producer was
    much different with PM Magazine than it apparently was for them. It was a heady
    trip, because they offered me a job, but I had misgivings and turned them down.
    I felt comfortable doing what I was doing, and the truth is I really wasn''t ready
    to work for a large Christian ministry. I was still a baby in the faith.'
  - '[PAGE 28]


    For all its glory, being on TV isn’t for everybody. Oh, it was heady having my
    picture on the side of every bus in town, but I hated being recognized everywhere
    in Louisville. I had to always be “on” in public, because viewers of the show
    would recognize me. My wife took great joy in playfully embarrassing me wherever,
    and I began to regret the job. The loss of privacy was a weight that I couldn''t
    bear, so I became a career shift and became a field producer for the second magazine
    show that the station aired, Louisville Tonight. I learned in that year storytelling
    than I''d learned in two previous jobs doing the work, for the team that produced
    the show was made up of national video photographer award winners. I honed my
    craft and continued working with the music ministry of Revival. I grew in many,
    many ways in that year and truly became a high-end television producer.


    I had also become a deeply student of the Bible and all things pertaining to the
    faith. I poured book after book in a search for meaning and understanding the
    things of the spirit. My files are filled with journal entries about what I was
    learning, as the “one-potato, two-potato, three-potato, four” march to wisdom
    continued. I watched Christian television, but mostly watched as the culture seemed
    to slip away from what I had known during my childhood. As a professional observer
    of life, the stirring in my soul to explore these events was unmistakable. I wanted
    to know the whys of everything, especially why people behaved the way they did.
    As a child, my faith was all about acceptance and basic values of hard work, discipline,
    and persistence, but life had shown me that questions were important, too. I wanted
    answers to, and I felt my mind was fertile ground for new and exciting ideas,
    whereas it had only before grounded tradition. I wanted to fly.


    The economy was collapsing everywhere in early 1981, and so the management of
    Louisville Tonight had to make difficult business decisions. Because I came from
    PM Magazine, my salary was higher than any other producer on the staff of Louisville
    Tonight, so my job was eliminated in the budget squeeze.


    The first call I made to CBN, where news of my unemployment was greeted with suggestions
    that this was God moving in my life and calling me to the ministry. “The hound
    of heaven” is what they called it. I couldn''t (or didn’t want to) argue with
    that, and so we moved to Virginia'
  - '[PAGE 29]


    Beach where I became the manager of the field crews who proudly produced the stories
    for The 700 Club.


    I knew magazine show production processes and systems like no one at CBN. The
    university had a marvelous film school, and it cranked out wonderful producers.
    But daily magazine shows are a different animal, one with a voracious appetite
    for content. It demands discipline at every turn using electronic news gathering
    (ENG) equipment, systems, and training, and I knew how to teach this to the ministry.
    I created an algebraic formula to prove Pat Robertson that the program was vastly
    understaffed. He wanted two testimony stories for every program, and required
    an upgrade. We hired more people, and so I was made producer and then senior producer
    of the program itself.


    As producer, the first thing I did was to bring state-of-the-arts graphics production
    into the program. I hired the top guy in the TV industry, Ben Blank from ABC-TV,
    to consult with us, and our goal was to outdo Turner when he was accomplishing
    at CNN by moving graphics away from engineers and into the hands of artists. More
    than anything else, this dramatically boosted the production quality of The 700
    Club.


    Regardless of what people may think about the content we presented back then,
    even the most cynical of television critics would have to admit that the production
    values of the program were outstanding, and I am most proud of it. It was, however,
    the mission of the ministry that drove me; making a difference was my personal
    motivation for making television in the first place, whether it was in the business
    world or what we did at CBN.


    The missions of The 700 Club and CBN were compelling, interesting, and very doable
    using the reach of television.


    # The 700 Club


    The mission of The 700 Club is to provide a television vehicle to accomplish the
    Mission of The Christian Broadcasting Network. In doing so it serves as the principal
    platform for corporate development activities.


    # Strategy'
- md: '

    Through the use of preproduced material, interviews, and graphics, we will present
    a Biblical perspective of news and current events.


    In all that we do, we will present the Gospel of Jesus Christ in relevant, modern
    terms.


    There exists in America a very negative attitude about Christians and Christianity.
    This is especially true among skeptics and interferes with our message. Therefore,
    we will, whenever possible, try to present a youthful, joyful image of Christianity.


    We believe revival is accomplished “Not by strength, not by might, not by power,
    but by spirit, said the Lord.” Since the miraculous always accompanies genuine
    outpouring of the Holy Spirit, and He has promised to “confirm His Word with signs
    and wonders,” we are absolutely committed to documenting and revealing the miraculous
    wherever possible.


    We will lift up Jesus in all that we say and do.


    We will follow the Apostle Paul’s example to “be all things to all people by all
    means we might save some” in our effort to reach a dying world. We will also follow
    our Lord’s example and “eat with publicans and sinners.” In doing so, it is understood
    that we may, from time to time, face the wrath of the Pharisees in defending program
    content they either disagree with or do not understand.


    Through regular, promotable series reports we will present information unavailable
    elsewhere on television.

    Our program will entertain, educate, and enlighten.


    All of our segments will be presented in such a way that each offers a Biblical
    answer to the conflict presented.


    Wherever possible, we will build bridges over denominational walls as we will
    seek unity in accordance with the Laws of the Kingdom of God.


    In preproduced pieces, through the spoken word, and with graphics we will present
    the Laws of God’s Kingdom. Our goal is that all would learn in practical terms
    what it means to live the Christian lifestyle and that all would mature in Christ.


    We will coordinate with corporate development to assure the smooth, on-going flow
    of spots, features, guests, and graphics, which illustrate the activities of all
    of the branches of the CBN ministry.


    Few television programs have their own mission statements, and the above gave
    me a general outline from which to proceed every day. It was also very useful
    for me in “managing upward” with the executive staff of the ministry, those who
    were charged with bottom line maintenance and with whom I often had conflicts
    in running the operation. Key to the mission statement were sections about current
    events, miracles, and teaching the “Laws of God’s Kingdom,” for these were the
    hallmarks of The 700 Club and essential to producing the program.


    The program’s mission statement wasn’t the what attention, however. The overarching
    mission of the ministry was what guided everything we did, and this document was
    shared both internally and publicly. It is here where we bent our rules in seeking
    political change in the land, for laws that restrict tax-exempt organizations
    govern such activities.


    # The Christian Broadcasting Network


    The mission of CBN and its affiliated organizations is to prepare the United States
    of America, the nations of the Middle East, the Far East, South America, and other
    selected nations of the world for the coming of Jesus Christ and the establishment
    of the Kingdom of God on earth. Our ultimate goal is to achieve a time in history
    when “the knowledge of the Lord will cover the earth as the waters cover the sea.”


    In achieving our mission chief method is the strategic use of mass communication,
    especially radio, television, and film; the distribution of records, cassettes,
    films and literature; and the conduct of education that will train the young and
    old to understand how the principles of the Kingdom of God relate to those spheres
    of human endeavor which play a dominant role in our world.


    In achieving our mission nothing should be done that does not glorify God and
    His Son Jesus Christ.


    Three words should characterize the execution of our mission. First, we will be
    innovative. Our task is not to duplicate or copy other men''s labors. Second,
    we will be excellent. Our work must either be of lasting value and highest quality
    or it should not be done at all. Third, we will demonstrate integrity. In our
    work, our public relations, our internal and external communications, there will
    be an abiding commitment to trust. Integrity must characterize all of our dealings
    with others.


    In staffing for our mission we must insist on the best possible men and women
    for each task, and we will make every effort to see that people and tasks are
    matched appropriately. Our policy will be to secure a small staff of outstanding
    people and to compensate them well for their labors. Our staff should be “filled
    with the Holy Spirit and wisdom.” God’s work will be done by God’s people, equipped
    and chosen.


    Implicit in the fulfillment of our mission is the demonstration of all the principles
    of the Kingdom of God, especially that of reciprocity. Therefore, we continually
    endeavor to give generous assistance to the relief of human need and suffering
    through the world as well as donations to other organizations that share our basic
    objectives.


    We believe that God’s work, done according to the principles of His Kingdom, will
    prosper financially. We cannot serve God and money, so service to God and his
    call always takes precedence over conflicting considerations of money. Nevertheless,
    we recognize that only those activities which are economically viable continue
    in our present society, so planning must take into account economic viability.
    We also categorically state that the payment of accounts when due is a key ingredient
    of integrity. We seek to finance our activities by all lawful and morally correct
    means, including but not limited to contributions, sales, and investment income.
    In planning we will endeavor to project adequate income for current activities,
    plus generous surpluses from which we can build and expand.


    In the fulfillment of our mission, as to calling and message, our Biblical role
    model is John the Baptist. As to wisdom it is Solomon. As to ministry to Israel
    it is the prophet Ezekiel. In all that we are, do, and say it is Jesus Christ.


    This was the governing document of CBN, but it was stretched in every direction
    in attempts to accomplish the task of bringing the ‘knowledge of the Lord’ to
    America. The fine line between preaching and government influence was breached
    time and again and included such activities as funding political action with ministry
    monies. Excellence, innovation, and integrity: I heard those words constantly,
    and it’s hard to argue that we didn’t operate regularly with the first two. When
    it came to integrity, however, we let our political ambitions overrun our commitment
    to this important value.


    My role was chief architect of the mission statement, and I served that role well.
    It was this, however, that put me at odds with several key executives, those who
    were more interested in managing the words of the mission than the actual task
    of implementing it.


    This is why I often felt alone in my job, for I was afraid of chaos and willing
    to lead a course through its stormy seas. This is also why I enjoyed a special
    bond with Pat Robertson, for I could anticipate him better than most, and this
    is the mark of a good producer. In my life as a TV talent, I had once been made
    to look like a fool during a live broadcast because the producer hadn''t timed
    the program correctly. I swore after that event that I ever got into producing,
    I would never allow somebody on the air to falter due to my inability to anticipate
    or time a show.


    We created what was lovingly referred to as a ‘living format’ for live television.
    It was the only thing that could accommodate Pat’s continuously editing mode,
    for he often went with his gut in calling for adjustments to the show. As I look
    back, it was really quite remarkable that we could create flawless television
    production as it was being adjusted from the anchor chair.


    I could ‘see’ Pat’s mind work in real time and gave him options on where to take
    a thought stream as he was thinking. Many were the time that I would hand him
    something off camera while he was talking live that would naturally flow into,
    for example, fundraising or political action.

    '
  mdcn: '


    通过使用预制素材、采访和视觉效果，我们将从圣经的角度呈现新闻和时事的见解。


    在我们所做的一切中，我们都以相关的、现代术语呈现耶稣基督的福音。


    美国对基督徒和基督教存在着一种非常负面的态度。这在怀疑论者中尤为如此，并干扰了我们信息的传递。因此，在可能的情况下，我们将尝试呈现一个年轻、充满活力的基督教形象。


    我们相信复兴的实现是“不是靠力，也不是靠才，也不靠争战，乃靠我的灵，耶和华说。”由于神迹总是伴随着圣灵真正的倾倒，而祂应许过要“用标记和神迹证实我的话”，因此我们完全致力于在尽可能的情况下记录并揭示神迹。


    我们的一言一行，都将举起耶稣。


    我们将效法保罗徒的榜样，在拯救这个垂死世界的努力中，“凡事就凡人，凡尽办法，总可以救些人”。我们也将效法主主的榜样，“与税人和罪人一同吃饭”。这样做时，我们理解自己可能不时在捍卫法利赛人不同意或不理解的节目内容时，面临他们的愤怒。


    通过定期的、可推广的系列报道，我们将呈现电视上其他地方无法获得的信息。

    我们的节目将具有娱乐、教育和启迪作用。


    我们所有的环节将以这种方式呈现：每个环节都为所提出的冲突提供圣经答案。


    在可能的情况下，我们将跨越教派之墙建立桥梁，因为我们将根据神国的法则寻求统一。


    在预制片目中，通过口语和视觉效果，我们将呈现神国的法则。我们的目标是让所有人都能从实际角度学习基督徒生活方式的意义，并让所有人都在基督里成熟。


    我们将与企业发展部门协调，以确保贴片、专题、嘉宾和视觉效果的顺畅、持续流动，这些内容说明了 CBN 事工所有分支的活动。


    很少有电视节目有自己的使命宣言，而上述内容为我提供了一个每天可以遵循通用大纲。这对于我与事工的执行团队进行“向上管理”也非常有用，他们是负责维护底线的人，而且我在运营过程中经常与他们产生冲突。使命宣言的关键部分是关于时事、神迹以及教导“神国的法则”的章节，因为这些是《700俱乐部》的标志，也是制作节目的核心。


    然而，节目的使命宣言并非关注的焦点。事工的总使命引导着我们所做的一切，这份文件对内对外也向公众公开。正是在这里，我们在寻求该地的政治变革时违背了规则，因为限制免税组织的法律监管着此类活动。


    # 基督教广播电视网


    CBN 及其附属组织的使命是为美国、中东国家、远东、南美以及世界其他选定国家迎接耶稣基督的降临以及神在地上建立做好准备。我们的最终目标是实现一个历史时刻，“耶和华的知识要满水满地。”


    在实现使命的过程中，主要方法是战略性地利用大众传播，特别是广播、电视和电影；唱片、磁带、电影和文学作品的派发；以及开展教育，训练老幼理解神国的原则如何与在我们世界中起主导作用的人类努力领域相关联。


    在实现使命的过程中，不应做任何不荣耀神和祂儿子耶稣基督的事。


    三个词可以概括我们使命的执行。首先，我们将具有创新精神。我们的任务不是重复或复制他人的劳动。其次，我们将追求卓越。我们的工作必须具有持久的价值和最高质量，否则就干脆不做。第三，我们将展现诚信。在我们的工作、公共关系以及内外部沟通中，将对信任有持久的承诺。诚信必须贯穿我们与他人的所有交易。


    在为使命招聘人才时，我们必须坚持为每项任务寻找最优秀的男女，并尽一切努力确保人员与任务匹配。我们的政策是建立一个由优秀人士组成的小团队，并为他们的劳动提供优厚的报酬。我们的员工应当“充满圣灵和智慧”。神的工作将由神所装备和选拣的民来完成。


    履行使命意味着隐含着对神国所有原则的展示，特别是互惠原则。因此，我们不断努力为全球范围内人类的需求和痛苦提供慷慨援助，并向其他与我们基本目标相同的组织捐款。


    我们相信，按照神国法则进行神的工作将在财务上获得成功。我们不能同时侍奉神和钱，所以对神和祂的呼召始终优先于冲突的金钱考量。尽管如此，我们意识到只有经济上可行的活动才能在目前的社会中持续下去，因此规划必须考虑到经济可行性。我们还明确表示，按期支付费用是诚信的关键要素。我们寻求通过所有合法且道德正确的手段为活动筹资，包括但不限于贡献、销售和投资收入。在规划中，我们将努力为当前活动预测足够的收入，以及用于建设和扩张的慷慨盈余。


    在履行使命的过程中，就呼召和信息而言，我们的圣经榜样是施洗约翰。至于智慧，是所罗门。至于对以色列的事工，是先知以西结。在我们所有的所、所行、所说中，都是耶稣基督。


