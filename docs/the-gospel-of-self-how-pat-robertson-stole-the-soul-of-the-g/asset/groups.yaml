    into Lebanon and this kind of thing? Was there any kind of understanding that
    you had a position at CBN that you were supposed to take?


    TH: Well, it''s terribly oversimplified, but Contras and freedom and Nicaragua
    ... a case can be made for a Biblical perspective on that. At the heart of Communism
