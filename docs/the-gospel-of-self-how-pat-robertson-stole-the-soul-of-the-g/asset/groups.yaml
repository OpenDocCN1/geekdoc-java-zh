    was my job, not simply the making of television, and I did it well, regardless
    of how it influenced relations with others in the ministry.


    As far as I was concerned, my duty was to Pat Robertson, not any of his appointed
    executive representatives. There were many conflicts in this arena, but I stood
    firm in my convictions. After all, a ministry is not like a business corporation,
    where power and control flow down a hierarchical pyramid. A ministry more closely
    resembles a cult of personality, where the person with the “calling” is the sole
    authority, and everyone else is assembled to bring that about. I viewed my own
    calling as helping Pat Robertson to do just.


    As such, I played a key role in the nurturing of our audience on the principles
    acknowledged, but this included stretching things as far as they would. For example,
    it says nothing about politics in the mission statement, and yet, as a former
    US Senator, Pat Robertson was a political animal, even before his calling to the
    ministry. He understood politics like few others, for the political process was
    often a flame for societal miseries and he knew what he was doing to correct.
    Pat knew the players and how the games were played. His observations were regularly
    spot-on, and he knew what he was doing whenever he opened his mouth with a political
    perspective on any issue.


    For example, Pat told Ben Kinchlow and Dana Soderman during one off-the-cuff,
    unscripted conversation on the air live that only Christians and Jews were qualified
    to hold public office in the United States. Ben expressed shock, but Pat repeated
    what he had said. Many people—including NBC News—pointed to this moment as evidence
    that Pat was outside what journalist Daniel C. Hallin calls the “sphere of legitimate
    debate,” but Pat was speaking directly to his constituency and didn’t care how
    his critics would interpret it. To those who believe the US was built upon Judeo-Christian
    principles, it’s easy to accept a statement that only Jews and Christians would
    be qualified to run it, but this concept is foreign to those who believe the Founding
    Fathers were more inclusive and tolerant. More often than not, this was the case
    with statements that might seem outrageous to others, especially liberals, and
    why we felt needed to educate them.


    The news department hastily put together a piece about the ruling, and we gathered
    in the studio to record the new opening segment. Everyone was in the same clothes
    they wore for the morning broadcast, so that the final show would be seamless.
    After the story and discussion, Pat asked that everyone—pray with him about the
    matter. I remember standing there with CBN President Bob Slosser, as Pat prayed
    that God remove Supreme Court justices who voted against prayer by any means necessary,
    including their deaths. Bob and I looked at each other and said almost simultaneously,
    “He can’t say on television!” We both knew that Pat was very angry over the court’s
    decision, but to actually call for the deaths of justices who had voted for the
    ban was both wise and dangerous, to say nothing of the immorality of such a public
    statement.


    We asked everyone to hold their positions and gave Pat our concerns. After much
    consideration, he agreed to record another version without the death threats,
    and that was the one we used. This was a rare opportunity for a mulligan in his
    highly edgy proclamations about government, patriotism, and that were a regular
    part of The 700 Club. It''s hard to say if Pat actually calculated or even considered
    his words before making statements like killing Supreme Court justices. He was
    very smart, and he knew his audience well, but he was also very much a believer
    in the power of prayer to provide answers for individual believers and groups.
    Given the breadth and depth of our mission, Pat envisioned himself in the driver’s
    seat of a great vehicle that God Himself had provided for the purpose of moving
    America away from its liberal drift. I think he was sincere in so doing, and those
    whose see actions are the merit of greed, power, or personal gain are the same
    people struggling today to understand the election of Donald Trump.


    As the months and years went by and the Reagan presidency was beginning to wind
    down, The 700 Club became more and more political. In retrospect, we were preaching
    having faith in God to change people’s hearts and in that change culture wasn’t
    enough, and that He wanted us all to get involved in politics. It was a subtle
    shift, but we weren’t alone. The entire televangelist was slipping away from its
    first love and drifting into the traps of power and influence. As The 700 Club
    evolved, we were educating people that the Republican way was God’s way, and that
    went on to become one of the most remarkable feats of social engineering of the
    twentieth century.


    Pat Robertson loves maps, and he was right in his belief that a great many people
    have no idea where this country or that one is located, much less how they interact
    with their neighbors. They certainly didn’t know why that was important or how
    matters “over there” impacted those of us here. We created eight-foot panels with
    beautiful maps representing regions of the world.


    I remember one day in the dressing room, Pat asked that we have the map of Africa
    available, because he wanted to talk about it. This wasn’t a planned segment,
    so we all had to be on our toes. In about fifteen minutes, he went through every
    country on the continent, named the capital, the ruler, politics, and explained
    the geo-political position vis-à-vis each country and how they related to their
    neighbors. I stood there and watched this, and I remember commenting to myself
    that there are only a very small handful of people in the entire world who could
    do what he had just done. It was truly a remarkable display of intellect, knowledge,
    and communications skill. His motivation was to teach, as to mission, he needed
    to prove to his followers that CBN was a group of Biblical men with knowledge
    of the times to guide Israel.


    Pat didn’t like liberals and thought they were a curse on society because they
    placed dependence on government ahead of dependence on God. Pat was also a strong
    proponent of personal responsibility and rejected any thoughts that people needed
    others to take care of them. Democrats and liberals easily thought of as enemies
    of God. And since we felt that the media was naturally biased toward liberalism
    due to background, education, and the lack of religious credentials, real or imagined,
    Pat wanted to present a conservative view that was based in the principles of
    God. Hence, we demonstrated an ongoing love affair with the GOP, and our slogan
    was “TV Journalism With A Different Spirit.”


    Everything about The 700 Club was carefully researched and strategized. We had
    as our guide the work of Pat’s great friend George Gallup, and his studies of
    religion in America. We knew how evangelicals were perceived, and a key component
    of our strategy was to counter those views. Most people thought of evangelicals
    as ignorant, overweight, polyester-wearing, Bible-thumping morons for whom church
    going was a cover for hypocritical behavior. We showed the opposite on the program,
    even going so far as avoid testimony stories featuring those who were overweight.
    We wanted stories of smart, young people, who would give the appearance to our
    evangelism a good thing for them and their families. They could love God, have
    a strong family, prosperous, feel a sense of “rightness,” be respected leaders
    in their communities and make a difference. We needed to recruit people outside
    the bias demonstrated by Gallup, and that meant “coloring” our program to reflect
    different kinds of people while avoiding the stereotypes.


    But there’s a funny thing about stereotypes. There can often be truth at their
    core, and that nothing of we wanted to consider. We, in fact, largely talking
    to ignorant, polyester-wearing, Bible-thumping morons, and they didn’t possess
    the whereabouts to do anything but parrot and follow. This is a big part of the
    problem today, for I’ve encountered literally thousands of people we once targeted
    have now gone off and are seeking different paths for themselves. What began as
    the dream of building a political army of intelligent, thinking people for the
    GOP produced the opposite, and there are still many people functioning as that’s
    not the case.


    I do not mean to suggest that everything was evil. God forbid! Helping people
    overcome difficulties is a noble, worthwhile, and righteous cause. We spread the
