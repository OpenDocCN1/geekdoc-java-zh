    unfortunately, somebody had to take the wants and needs of the leader and fit
    those square pegs into the round holes of CBN management.


    This conflict got worse with every day that passed after I returned, and one big
    reason was that contributions fell off a cliff in the wake of Oral Roberts’ pronouncement
    during his January 1987 telethon that unless he raised $8 million over the next
    couple of months, God “take him home,” a Christian euphemism for ending his life.
    This preposterous and self-centered statement gave reporters in Tulsa the ammunition
    they needed to open the doors of the “faith healer’s” ministry, and so soon coverage
    spread nationwide and beyond.


    At nearly the same time, Jim Bakker fell from grace at his PTL (Praise The Lord)
    in Charlotte, North Carolina. The discovery of his trust with Jessica Hahn and
    the subsequent cover-up broke a dam of pent-upt mistrust of televangelists in
    the press, and what followed was a broad brush with which they painted every television
    ministry, including the one founded by the guy now in the White House. The Bakker
    debacle occurred on March 19, 1987, just weeks before my return to CBN. The ugly
    spotlight was on everyone, the ghost of Sinclair Lewis’ Elmer Gantry visited all
    levels of society, including those we had worked so hard to recruit since the
    beginning of the 1980s. It is impossible to overstate how badly these events impacted
    Christian ministries, and especially evangelicals on TV, including the ministry
    of Pat Robertson.


    The result was that I returned in early April and walked into a reduction in force
    that ultimately cost over 500 people their jobs, including forty-three of my staff.
    Management made the decision to adjust the payroll and staffing in such a way
    that would ensure a permanence to the new contribution levels rather than ride
    out the storm in the belief that the money would come back. It is hard to argue
    with this decision, although it hardly reflected faith in anything other than
    their ability to manage a crisis. That’s easy for me to say today, I suppose,
    but there was a spirit of dread that hung over the ministry those days that influenced
    every corner of the campus. It was striking to observe a group of people who alleged
    faith and trust in an Almighty God give to fear in the middle of a crisis.


    In press reports in the wake of the layoffs, Pat Robertson laid the blame at the
    feet of Jim Bakker and Oral Roberts. The following is an article in the Philadelphia
    Inquirer:'
  - '[PAGE 93]


    “We have probably the finest forecasting and budgeting processes in the evangelical
    world, but it is impossible to forecast an atomic explosion,” Robertson said on
    his television program, The 700 Club. “We had nothing to do with any of it.”


    He said the PTL scandal and the Rev. Oral Roberts’ ‘life-or-death’ appeal for
    money cost Robertson’s Christian Broadcasting Network $12 million in contributions
    so far and probably would drain $28 million by the end of the year.


    “In the history of American Christianity, we have never seen anything like this,”
    said Robertson, who is considering a run for Republican presidential nomination.
    “That scandal has hit the evangelical world like a bombshell.”15


    This businesslike action by the ministry caused a monumental problem for me as
    Pat Robertson’s executive producer, for in reality I had virtually none of the
    authority I was promised during that lunch with Pat. Despite all the talk of “faith,”
    we exhibited the opposite in a time of crisis, and I don’t believe it reflected
    well on us, as a ministry, by our calling, or as those “men with knowledge of
    the times.” We were hypocrites, and it was just beginning.


    Pat Robertson’s calling to run for president “of God” or not? The evidence suggests
    not, but it hasn’t all been collected just yet. History will have its say. The
    more important matter to me is whether the man’s ministry was behind the calling
    or not. Behavior always trumps proclamations of faith, and the behavior of the
    executive team and the board of directors in the wake of Pat’s actual candidacy
    was not in line with what we had declared our mission, our teachings, and our
    ministry.


    As we say and believe in Alcoholics Anonymous, “either God is everything or else
    He is nothing, God either, or He isn’t. What was our choice to be?” CBN made the
    decision, and the faithful had no choice but to follow its lead.


    And it certainly didn’t make my job any easier in coming back, for I was by now
    the master of a clearly sinking ship. I was trapped. I knew it. And there was
    nothing I could do except pray for guidance and plunge myself deeply into the
    task at hand.'
  - '[PAGE 94]


    The public spotlight was on every ministry, and murmuring and fear covered the
    CBN campus in ways that were terribly unhealthy. One of the first events after
    I got back was concern expressed by certain contributors and subsequently managers
    over the behavior of co-host Danuta Soderman''s husband, Kai Soderman. I was told
    that he was suspected of approaching major donors with his own big money development
    projects, which was definitely not all right with those who oversaw fundraising
    for CBN. It reflected badly on Danuta, who was having an internal crisis of hers
    at the time. She described it in her book Chiseled: A Memoir of Identity, Duplicity,
    and Divine Wine:


    I needed a break during Pat''s campaign. I felt useless, a fixture on a political
    show pieced together at the last minute on Robertson''s whims. For months, Pat
    disregarded the preparations of the show''s producers, running into the studio
    at the last minute, haranguing the audience with thirty-minute off-the-cliff speeches,
    while Ben and I sat nodding and smiling, trying to look interested.


    When I expressed my concerns, Terry understood. “I know it''s frustrating, Danuta.
    I''m the one tossing out schedules and rearranging formats. I don''t even know
    what the show is, and I''m the producer.” He shrugged his shoulders back and readjusted
    his tie.


    I told Terry that I believed my tenure at CBN had run its course and that Kai
    and I were thinking of moving back to California. He looked alarmed. “Don''t make
    any hasty plans,” he said. “All you need is some time off. You''re tired. Take
    a break, go to the beach. You''ll feel better when you get back. But promise me
    you won''t make any sudden decisions.


    With the promise, Kai and I took a week to rest and relax and to evaluate my role
    at CBN.”16


    I looked alarmed to Danuta, because I was terribly alarmed. Danuta was a professional
    journalist before she became a Christian, and she was my confidante and friend.
    We were kindred spirits and shared many of the same concerns about the line between
    right and wrong in the dissemination of'
  - '[PAGE 95]


    information. While CBN in many ways pioneered point-of-view journalism, pioneers
    are the people in history who end up with arrows in their backs, and that metaphor
    was certainly evident at the ministry. I had the wounds to prove it and so did
    Danuta.


    I went to Pat, Tim, Michael Little, and Bob Slosser expressed my concern that
    Danuta was a key part of my plans after Pat went on the campaign, and that letting
    her walk away would be a serious mistake.


    That''s why I found myself in Naples, Florida a few days later with Harald Bredesen,
    Danuta''s spiritual “father.” Our mission was simple: do what was necessary to
    minister to Danuta and Kai and keep her as a vital personality in the shaping
    of a program without Pat. It turned out to be a difficult task, but after three
    days, she agreed to return with assurances that I would have her back.


    In the light of history, it''s easy to say that perhaps my plan wasn''t the best
    for Danuta, because while I was gone the decision had been made to remove her
    as co-host of The 700 Club. The only person who could make such a decision was
    Pat Robertson and I was never given an explanation about how this was in the best
    interests of the program or the ministry. Danuta describes it in Chiseled, it
    was a decision based on politics and the potential for her to be an embarrassment
    (real or imagined) to Pat''s campaign. The only thing I was ever told that it
    was all about her husband''s exploitation of her position to gain access to deep
    pockets. I don''t know any deeper truth, but regardless of the reason, the decision
    broke my heart. I knew to make good television, and Danuta was a pro''s. I needed
    her, and badly.


    It was a shame on everybody involved to cut her loose and in such a way to deny
    the opportunity to say goodbye on the air or give her followers an explanation
    as to why. It was unprofessional. It was personal. It was awful. As far as the
    show was concerned, she simply disappeared, and there''s no way I can justify
    any of it.


    Danuta wrote in her book that I informed her of the decision in the parking lot
    of CBN and how it was poorly handled. I do not disagree. It was my duty as executive
    producer to deliver the news, but my orders with instructions to not let a minute
    pass without giving her notice. That forced me to grab her before she left, because
    once the decision had been made, she was not welcome on the set of The 700 Club.
    Top management'
- md: '

    did not want ugliness in either the studio or the dressing rooms the following
    morning, even though I tried to assure Pat that this would be highly unlikely
    given Danuta''s experience as a professional television host. And so, in one of
    the more miserable duties I ever had to fulfill in my life as a manager, I fired
    Danuta in that parking lot.


    Danuta describes this gathering well and completely in her book, and there''s
    no need for me to echo her statements. It was unpleasant for me as it was for
    her, but nobody getting fired about such, nor are they expected to. It''s very
    hard to fire people you love, but it''s even harder to be on the receiving end.
    And I dearly loved Danuta Soderman. She was a trouper''s trouper and did not deserve
    to end her service at CBN the way she did. I was ashamed of myself and for the
    ministry, and the whole mess impacted me deeply as a person.


    One of the CBN News reporters, Kathy Bullock, had long impressed me with her natural
    presence on camera and her intelligence as a correspondent. In the vernacular
    of TV consultants, Kathy “got past the glass” on TV, meaning she had the unique
    ability to grab attention beyond the screen by having the looks and personality
    to really communicate. She was young, but she was comfortable in the co-host chair
    and did a wonderful job filling in after Danuta was cancelled. My inclination
    was to press for her to become the new co-host, but Pat and those who nodded their
    heads in lockstep with every opinion he expressed torpedoed the idea. Pat felt
    she was too young and inexperienced, although that was neither my nor the view
    of my staff.


    I first called Terry Meeuwsen, an old friend from my news days in Milwaukee. Terry
    was a former Miss America and a gifted on-air host. She had filled in occasionally
    and was a natural new co-host for The 700 Club. Unfortunately, family and work
    made her moving to Virginia Beach impossible at the time, although she did become
    co-host many years later.


    My next thought was to contact Susan Howard, one of the stars of the hit show
    Dallas. I had met her when we had taken The 700 Club to California several years
    earlier, and I thought she would bring new viewers and followers. I called in
    every mark I had with people in Hollywood and in the ministry, and we eventually
    convinced her to come aboard. This was a very big deal, because she was an A-List
    Hollywood celebrity.


    While Susan brought her certain Hollywood backstage expectations, she was truly
    wonderful as co-host of the program. Her presence on the set lifted the show to
    a time when it really needed lifting. She was dynamic and her face lit up the
    screen, adding a certain kind of credibility to a TV ministry program that was
    under deep public scrutiny. She was kind and compassionate, and the employees
    of CBN loved her. Pat and Ben worked well with her, and soon Danuta’s loss seemed
    like water under the bridge to most people. I know better, however, I doubted
    the permanence of Susan’s efforts. She was a California gal and an actress. Her
    husband came with her, and his only concern, justifiably, was Susan and her career.
    Despite my duties, I hired her anyway, because the program badly needed a breath
    of fresh air, and Susan was certainly that.


    Pat Robertson grew more political on the program as the days, weeks, and months
    passed. When he was away, we were able to occasionally run segments titled “Pat
    Robertson’s Perspective” that were shot on a different, more authoritatively designed
    set. I proposed in 1984 that we convert the last half-hour of the ninety-minute
    700 Club to a stand-alone half-hour program of the same name. I thought we might
    be able to syndicate it from The 700 Club and that might relieve our show from
    the encroachment of political segments. We built the set to create a pilot, but
    the whole thing was snubbed. We later used it to create segments, so that Pat
    could still appear to be on the show, even though he was on the “unofficial” campaign.


    In 1986, prior to my leaving, and 1987, there were new faces that were occasionally
    in Pat’s dressing room and around the set of the program, mostly connected with
    Pat’s campaign, and lines began to get blurry. Jerry Curry, one of Pat’s closest
    advisors, sent me a memo in April of 1986:


    “I suppose this is somewhat presumptive, but I keep running into Reagan officials
    whom Pat might want to select for key jobs in a Robertson Administration, should
    the need ever arise. It occurs to me one way for Pat to get acquainted with these
    folks would be to interview them on The 700 Club. So, consider this Memo Number
    One in the great search for new talent. Unless you have a problem with me reducing
    this to writing, I will run these names by you on a periodic basis.”


    He then recommended Alan E. Sears, staff director of the Meese Commission on pornography
    at the Justice Department—“Alan is the type of person we would want to select
    for a top job at the Justice Department, if not the top job itself”; Ralph Stanley,
    head of the Urban Mass Transportation Administration—“He would make an outstanding
    Secretary of Transportation”; and Dave Swoap, Curry wanted him for Secretary of
    Health and Human Services added, “Dave, who is about 45, brings the same kind
    of intellectual quality to his work that you and Pat bring to yours.”


    And, for the record, let’s not forget Ollie North at the National Security Council.
    Three more years in that job and he ought to be ready to take [John] Poindexter’s
    place [Reagan’s National Security Advisor].


    Now, how do we get these guys on The 700 Club?

