  mdcn: '

    在与每个人的相处中，我别无选择，只能让行动反映出我对 Pat 将赢得选举的信念。我不仅是 CBN 的领导者，在许多方面，涉及到 CBN 的核心工具——**《700
    俱乐部》**，我是 Pat 的得力助手。如果我不相信我们所做的事，我就不会在 1987 年回来。我所做的每一个决定都有一个核心理由，至于我最终证明自己是对是错的，并不重要。问题是今天该做什么，这意味着要成为
    Pat 船上的一个划手。活在未来，尤其是一个由恐惧统治的未来，对于我这个位置的人来说并不是正确的选择。


    我经常在与事工的祈祷会议上带领敬拜。在 Pat 开始长时间竞选活动前的最后一次祈祷会议上，我用吉他弹了《向首领致敬》，当他在千人的沉默中离开房间时，引起了他的注意，他笑了。这是我祝愿他一途风顺的方式。


    在 Pat 缺席期间，我们像士兵一样战斗，偶尔使用预录的《Pat 的观点》片段来填补空白，但我们控制之外的事情是——在没有 Pat Robertson 的情况下交付电视节目的任务至少是困难的。


    在很多时候，我能够说服查尔斯·科森（水门事件的共同阴谋者，后来的监狱伙伴会的创始人）在 Pat 缺席期间共同主持节目，或者录制我们稍后使用的片段。查克成了一个亲密的朋友，我们在《700
    俱乐部》上共同完成的工作是我最色的作品之一。我是 Pat 努力的支持者，并对公共政策和时事分析持有类似的、权威且保守的观点。从哲学上说，他是一个务实者，不相信基督教实践（特别是在
    CBN）中存在圣灵的恩赐或“礼物”。然而，他是一个非常敏锐的时事观察者，在 Pat 的位置上也非常从容。他可以轻松应对节目现场化学反应所需的“父亲形象”角色。


    他曾告诉我，他在德克萨斯州遭到达拉斯·罗伯特·蒂尔顿的接触，被建议“拥抱”说方言和宣告灵的恩赐。蒂尔顿的理由是什么？“那里才有钱。”科森告诉我这些时笑了，我知道他的意思。金钱是
    20 世纪 80 年代电视传教的诅咒，而查克·科森对此毫无兴趣。


    在多年后写给我的一封信中，他写道：“你应该知道在你离开 CBN 之后，我再也没有被邀请回来。”他总是感谢他获得服务的机会，遗憾的是，他从未被认为足够成为 Pat
    缺席时的接任人。


    到 1988 年 1 月，CBN 的事工在财务上陷入了巨大困境。CBN 是天才营销人员和募捐开发专家的家园，他们根据数据生存，而那时的数据已经非常糟糕，尤其是那些显示
    CBN 电话咨询师与拨打者之间直接事工的数据。我们衡量一切，从救恩祷告到对考虑自杀的人。比较 1988 年 1 月与 1987 年 1 月的事工数据是很有揭示性的：


    | 特定事工 | 1987 年 | 1988 年 | 百分比变化 |

    |---|---|---|---|

    | 电话次数 | 685,724 | 346,088 | -49 |

    | 救恩人数 | 34,130 | 17,850 | -47 |

    | 祈祷请求 | 396,176 | 243,777 | -38 |

    | 祈祷回应 | 9,763 | 4,901 | -49 |

    | 圣灵片段 | 10,672 | 9,031 | -15 |

    | 家庭咨询 | 114,902 | 81,496 | -29 |

    | 毒品 | 12,152 | 8,479 | -30 |

    | 酒精 | 15,525 | 7,753 | -50 |

    | 性变态者 | 6,122 | 3,482 | -43 |

    | 自杀 | 1,331 | 908 | -31 |


    这种近乎一半的下降主要是传道士丑闻导致的，媒体暗示 Pat·罗伯逊的总统竞选也属于同一类别。这使整个事工陷入了危险，在那种情况下是不可能克服的。


    尽管如此，我尝试了。我们在温泉泉的霍姆斯泰德庄（The Homestead）举行了计划活动，并进行了多次内部会议、研究和试验。基于我新闻行业的背景，我引入了顶尖电视咨询公司受众研究开发公司（AR&D），我后来才知道这让一些人不悦。本和苏珊仍在团队中，我想向他们加入查克·科森。这一建议被拒绝了，于是我转向了已经在事工中的两个人：斯科特·罗斯（Scott
    Ross），一位服务音乐产业的牧师，有招募年轻听众的能力；以及鲍勃·斯洛瑟（Bob Slosser），一位长期的事工领导，担任首席执行官、摄政大学校长、CBN
    新闻高级编辑以及前《新时报》助理编辑。虽然只是口头上，但鲍勃拥有担任时事评论员的资和能力。在我看来，这个团队——在适当的支持下——可以继续《700 俱乐部》的事工和使命，直到
    Pat 的竞选结束，无论他是否获胜。


    （注：原文后续存在大量重复段落，已按要求去重，确保不重复输出。）

