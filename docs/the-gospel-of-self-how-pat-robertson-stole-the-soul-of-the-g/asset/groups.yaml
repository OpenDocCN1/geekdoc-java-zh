    This kind of questioning went on for three hours, and I was exhausted all was
    said and done. I learned a valuable lesson about the government’s ability to obtain
    incriminating evidence against anybody. The idea—especially in this day and age—of
    operating entirely “in secret” is really quite preposterous.


    As noted, I was back in local television news at the time of the deposition, and
    I was curious about it as a reporter. Who wouldn''t be? Pat Robertson had attended
    school in Chattanooga, so there was a local element to anythingsworthy involving
    the man.


    IRS CID agent Ford Allen had given me his business card at the deposition, so
    I called him early in 1989 to inquire about the investigation. He told me that
    it had been dropped. I was completely caught off guard by his answer. He declined
    to tell me, only that the order to do so had come “from the highest of higher-ups.”
    My assumption for this has always been that Bush called off the dogs for Pat’s
    endorsement to the “religious right” of the Republican Party. I can’t prove that,
    and I’ve not had the wherewithal to investigate it.


    Whatever happened, it wasn’t permanent. In 1998, CBN paid a “significant” fine
    to the IRS for illegal activities in 1985 and 1986 that cost the ministry its
    tax-exempt status for 1986 and 19⁸⁷¹ In 1992, the Federal Election Commission
    hit Americans for Robertson with a repayment order for $388,500 in the wake of
    its audit investigation.²⁰'
