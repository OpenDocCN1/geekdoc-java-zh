    “哪里错了？”我问他。他继续抱怨福特汽车公司，说他们的广告是不诚实且具有误导性的。他买了一辆新的福特烈马（Ford Bronco），显然开着它就像电视上展示的那样，车辆在崎岖的地形上跳跃，在深泥沼和水坑中穿溅。他弄坏了新车的刹车和悬挂系统，并且很不开心。这是我与他度过的最有趣的时刻之一。


    在周五的祈祷会议以及其他的全体员工会议期间，我和 Pat 一直在台上。我和另一位吉他手比尔·博罗维（Bill Borowik）一起弹吉他带领敬拜，Pat 总是对我们的工作表示喜爱和钦佩。1983年9月6日，Pat
    甚至受到灵感给比我发了一份备忘录。


    “只是想再写一次告诉你们，劳动节祈祷会议是多么出色。我认为音乐是我们一直以来最好的。大学的新任教职员工对这些向主主的赞美感到非常欣喜。


    再次感谢，

    PR”


    在 CBN 领导敬拜是一份真正的荣誉，只要 Pat 高兴，我并不在乎别人怎么说。我经常被要求加入更多当代音乐，但那些歌曲似乎永远不符合比尔和我正在做的事情，我们仅仅是顺着流程受引导。这需要音乐上有一种确定性，以便能够按照节奏将一首歌接另一首歌，并将赞美和敬拜带到我们认为需要去的地方。这意味着没有预先计划的列表或顺序，因为我们不希望把自己束缚在既定的计划中。我们更倾向于随性，而观众和
    Pat 似乎也欣赏这一点。没有人会知道比尔和我我是受自己自我的引导，还是受来自彼之外的引导，但我确实记得在 CBN 员工面前弹吉他和唱歌的过程中，有一些非凡的时刻和极度幸福的感受。


    我记得有一次祈祷会议，期间一位女性在安静的时刻开始说方言。Pat 立即抓住我说：“现在开始弹点什么吧！”我开始弹奏并唱歌，Pat 在同一刻也加入了。Pat
    捕捉到了这一点，很快整个地方就充满了歌声，那个女人的声音被完全淹盖了。这是我记得的数百次祈祷会议中，唯一一次 Pat 带了一个他认为是“信息”的东西带给聚会的人。之后，我问
    Pat 为什么要打断她，他说：“她是在凭肉体”，意思是他将她的姿态解读为自我为中心。我问他是否希望我总是那样行动，他回答说取决于是谁在预言，以及对圣灵的辨别。


    我记得有一次祈祷会议导致了我在我这方面表现出令人羞愧的行为，尽管这很难承认。那是节日会议之一，所以大家都在场。我醒来，坐在马桶上，立刻闪伤了腰。这太糟糕了，我无法正常移动。由于持续的肌肉痉挛影响了神经，我感到剧痛，我确信我应该留家里。我打电话给
    Pat 道歉，但他拒绝不听。


    “行了，兄弟，”他责备着我。“你不认为上帝可以治好那个吗？”


    我去了祈祷会议，和比尔一起站那里向全能的上帝宣告赞美，尽管我因为持续的疼痛而身体弯曲扭曲。Pat 停止了音乐，告诉聚会的人我受伤了，需要医治。他指示聚会的人给予鼓励，并在他为我祷告时与他一起祷告。我把吉他放在一边，加入了他，他一只手放在我的背上，另一只手放在我的额头上，开始祷告。他祈求上帝立即治好我。他斥责撒旦。当他用“耶稣的名，阿们，阿们”结束时，人群爆发了掌声和欢呼，每个人按照他们认为合适的方式祷告。


    Pat 看着我说：“你感觉怎么样？”我脸上洋着笑容：“极好，我感觉极好！”他指示我弯腰摸脚尖几次，我按照他的要求做了。当他们目睹了这看起来像神迹的事时，整个地方陷入了疯狂。我拿起吉他，比尔和我唱起一首欢快的曲子，我那天跳起了那些基督徒非常熟悉的舞蹈，左右摇动，双腿向前向后踢。赞美主！或者不。


    我背部的酸痛是不可思议的，但我不想承认它。我尝试放松，但我做不到。痉挛持续没有缓解。会议结束时，我不得不站起来多弹一会儿，但我从未停下。毕竟，我已经被治好了，对吗？


    我回到家，用我的暖水垫，在接下来的几天里照顾着自己，直到背痛消失。我利用 Pat Robertson 本人关于信仰的观点来合理化我的欺骗。我推论，这样做更好，不会伤害任何人的信仰。哎。


    我讲述这个故事，是因为我愿意诚实地说明，为了支持福音派基督教的叙事，我愿意在多大程度上越分地跨越了理性的界限。我以后晚年才发现，在伪装自己看起来像别人一样义顺方面，我并不孤单。我没有、也不会指责我在
    CBN 的任何同代人虚假，因为也许他们是对的，而我关于上帝不一定以那样回答祷告的观点是错误的。我在生命中见过许多奇怪的事情——那些我无法从逻辑上解释的事情——但我知道当我陷入困境时，我惨惨地失败了测试。我今天诚实地相信，那天在
    CBN 错过了“我的奇迹”并不是因为我的不信；更多是一个诚实的问题，即在弯腰摸脚趾之后并没有感到任何不同。

