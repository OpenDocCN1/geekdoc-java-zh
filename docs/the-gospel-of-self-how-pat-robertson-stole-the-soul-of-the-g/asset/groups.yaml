    perhaps a few others. Susan Howard had left, so it was entirely a meeting of men.


    I felt disapproval even before it was announced, and even more so after I shared,
    once again, my plans for the coming week and beyond.


    Pat Robertson could handle just about anything when it came to television, but
    he was adamant that he would not allow others to potentially raise their own ministry
    money. This was the issue that was behind the split between Pat and Jim and Tammy
    Bakker in the early 1970s. The Bakers had helped him build CBN and The 700 Club,
    but then wanted to be able to raise their own ministry on the CBN network. Pat
    refused. There followed a mysterious fire in the studio that housed the Bakers''
    set, and Jim and Tammy moved from Portsmouth, Virginia, to California in furtherance
    of their own ministry.


    Pat was agitated and irritated in the meeting following the telethon, and after
    rejecting every word that came out of my mouth, he turned to his son and said,
    "Tim, you''re going to have to do this"


    Tim Robertson was more like his mother than his father. He was brilliant and a
    gifted business administrator, but he had very little charisma, no desire to be
    public, and no experience on television. His face red, he objected, saying it
    would be terrible for the ministry if he were to try and replace his father for
    The 700 Club.


    Pat would have none of it and said, "Tim, you can do it. I need you to do it.
    Terry and the staff will help you. It''ll be right"


    But everyone in the room knew it wouldn''t, and despite my protests, nobody stood
    up and argued with Pat Robertson. His issue was money. He didn''t want anyone
    whose name wasn''t Robertson at the helm of things on the air. His oldest son,
    Gordon, was a chip off the old block in terms of char, and charisma, wanted nothing
    to do with the ministry, although that would change many years later.


    And that was it. I suppose I had seen it coming, but I didn''t neither did anybody
    else. It was what it was going to be, and I had no choice but to swallow hard
    and move on. But my heart was never in it that day. Tim was beyond awful in those
    first few appearances, and it looked for every reason to be exactly what it was,
    a father handing off his'
  - '[PAGE 105]


    ministry to his son, regardless of the outcome. I was beaten down miserable, and
    I should have taken responsibility for my life and career resigned then then I
    didn''t because I had a family to support, and I needed time to think. I put on
    a soldier''s face and did the best I could with what I had. It would never be
    enough.


    Pat made an appearance every now and then, including on February 9, 1988, the
    day after he finished ahead of Bush in the Iowa caucus. I had watched network
    coverage the night before Pat got into an on-air confrontation with Tom Brokaw
    of NBC, who kept referring to him as a televangelist. Pat rightly felt that this
    was deliberately pejorative, and he went after Brokaw. It wasn''t terribly smart,
    because a candidate will never win against a network anchor.


    In the dressing room that morning, I told him I thought he had made a mistake.
    In my years with Pat, he''d always appreciated my opinion, whether he agreed with
    it or not. I just liked the idea that I had the strength to tell him what I thought.
    This time, however, he got angry.


    We went back and forth for a while, naturally, I lost the argument. Pat''s ability
    to bring out a metaphor at a moment''s notice was one of his true gifts, but it
    didn''t feel very good that morning.


    We tried many combinations of hosts with and without Tim in the weeks that followed.
    Susan Howard went back to California, and it was hard to blame her. She had given
    us six months, and that was more enough in me, especially given the turbulent
    nature of things behind the scenes and on the air.


    Kathy Bullock and Cindy Glaser filled in for her as we opened yet another search
    for a female co-host. We built a new set—one that the local paper said matched
    Miami Vice colors, even though that was never our intention. We wanted contemporary,
    and pastels were the big thing, whether spawned by Miami Vice or not.


    Pat had given us instructions that included this Bible verse:'
  - '[PAGE 106]


    No tears a patch from a new garment and sews it on an old one. If he does, he
    will have torn the new garment, and the patch from the new will will not match
    the old. And no one pours new wine into old wineskins. If he does, the new wine
    will burst the skins, the wine will run out and the wineskins will be ruined.
    No, new wine must be poured into new wineskins. And no one after drinking old
    wine wants the new, for he says, “the old is better.” (Luke 5:36-39)


    I was all for new wine, but I had never planned that the program would completely
    lose its identity in the process. Ben Kinchlow announced his departure, as things
    at the ministry worsened. I could hardly blame him. Ben had been second chair
    on the program for many years, and he was passed over in the name of keeping a
    Robertson at the helm. I was powerless to stop the slide. The CBN board met the
    week of March 14, consolidated power with Tim, announced a major restructuring
    under Tim, and terminated my employment as executive producer of The 700 Club.


    A report in the Virginian Pilot newspaper on March 18 noted the restructuring:


    Jump-start CBN’s flagship show, The 700 Club, the seven-member board also ordered
    CBN to launch a nationwide search for new on-air talent and a better format for
    the religious talk show.


    > “You’ve heard the old adage, ‘Don’t give god junk,’ CBN spokesman Benton Miller
    said. “The board felt The 700 Club needed to be more compelling.”


    Pat and Dede were both board members, and when I asked if Pat had signed off my
    firing, Bob Slob gave me a definitive “yes.” I don’t know if Dede was involved,
    but it didn’t matter anymore. Nothing mattered anymore. I was told that I could
    stay with CBN and that they would find another position for me, but I took some
    time off to think. I still have many notes from that week, as wife and I tried
    to figure out our next move. Should we stay or should we go?


    Later that year, my former mother-in-law in Manitowoc, Wisconsin, herself a long
    time viewer and contributor to The 700 Club, wrote to Pat to'
  - '[PAGE 107]


    complain about my firing. I have the letter Pat wrote back to her, in which he
    wrote, “Terry is a wonderful young man. I love him and think very highly of him.
    I had nothing to do with leaving CBN—that decision was made before I came back.”
    This was contrary to what I had been told by Mr. Slosser, and I have no idea who
    is telling the truth.


    I was broken in many ways. I put on a good face, and even went to Pat’s house
    after getting a new job in Chattanooga months later. I didn’t make an appointment;
    I simply knocked on the door. think I went there to confront him, but instead
    I held nothing personally over what had happened in the previous year. We hugged
    him and I prayed for me, and that was that. My spirit was crushed and the heart
    I had so willingly given him to was broken in two. I fell into a deep funk, and
    journaled:


    Nobody told me I was responsible for everything. I didn’t come back to anybody’s
    hero, but did I deserve disrespect? Nobody told me that Danuta had to go, that
    Dede Hicks Texans are tasteless, that Jon Simpson had resigned, that Dottie was
    leaving, that I couldn’t use Scott, that Sam Walker would be forced on the air
    3 months early, Susan Howard would quit after 6 months, that I would lose half
    my staff, that I would lose commensurate pre and post production resources, Ben
    would leave, that we would let the IRS dictate editorial content, that Tim would
    become a permanent co-host, and that everything would be a committee decision.


    I sent Tim a memo dated April 13, 1988:


    On March 18, 1988, I was notified by Bob Slosser by the decision by the CBN Board
    of Directors to replace me as Executive Producer of The 700 Club. That was followed
    by your gracious offer to allow me to remain at CBN in some other capacity.


    I have the greatest respect and admiration for you and the management team at
    CBN but, after prayerful consideration, believe it is the Lord’s will for me to
    move on at this time.'
- md: '

    Therefore, I respectfully decline your offer and submit my resignation, effective
    April 8, 1988. I harbor no ill will toward you (or anyone else at CBN) over these
    events and look forward to our eternal friendship.


    And that was that, which left me with the unanswerable question of whether my
    choosing to return a year earlier had been a mistake. I had lost over $70,000
    in relocating back to Virginia Beach, and the pain of the whole experience was
    overwhelming nearly every day that I tried to help Pat. To be fired by him after
    all the promises one year earlier was really hard to take. And then there was
    the question of missing God''s calling or not. It was all too much, and I started
    drinking heavily, something that would profoundly alter my relationship with the
    God I loved.


    I was given an excellent severance package that included three months checks that
    covered my base salary. Whatever reason, they sent me four checks, and when I
    got a letter from Tim later acknowledging the error and asking me to send it back,
    I refused. In my view, it was a bonus for pain and suffering, and my heart hardened.


    Over years of introspection, I gave a great deal of thought to what we had done
    in those years in the 1980s. We had actually redefined what it meant to be a conservative
    Republican, and this was no small feat. We altered the balance of power in the
    GOP by bringing in millions of Christians who were able to look completely past
    the reality that Republicans represented the wealthy. This was an amazing accomplishment,
    but one that has left our culture in a really bad situation, for fundamentalist
    Christians were a key element of Donald Trump''s election. Pat noted this movement
    in his book The Plan, and reading it today sends a chill down my spine as I survey
    the cultural damage done by this angry mob.


    Could it be the reason for my candidacy had been fulfilled in the activation of
    tens of thousands of evangelical Christians into government? This campaign taught
    them that they were citizens with as much right to express their beliefs as any
    of the ardent activists who have been so vocal in support of their own radical
    agenda at every level of our government. For the first time in recent history,
    patriotic, pro-family Christians learned the simple techniques of effective party
    organizing and successful campaigning.


    To be clear, it wasn''t Pat''s campaign that did this; it was The 700 Club television
    program. Before Rush Limbaugh, there was Pat Robertson.


    While many of the young and intelligent group we targeted with our message had
    moved on, the people left accepted everything they taught them, and their belief
    that Jesus was and is Himself proud of their accomplishments makes it impossible
    to reason with them. And yet they regularly vote against their own best interests
    as poorer people largely from the South who could use a helping hand every now
    and then. But they don''t see it that way and believe instead that they are the
    givers of charity, not-isn''t a one who can say exactly how. Perhaps it''s envy
    or just selfish thinking that compels them to align themselves with the modern-day
    Pharisees, when they, in truth, are much more a part of the have-nots. It is much
    more the parroting of what they''ve been told, by the televangelists, back then
    and now beyond, led by people like Pat Robertson, myself, the ministry of CBN,
    and a gospel message that appeals to the self-centered wants and needs of its
    followers, the gospel of self.


    ## Six


    ## The IRS vs. Pat Robertson, 1988


    > The only two things that scare me are God and the IRS.

    > —Dr. Dre


    Federal agencies like the Internal Revenue Service and the Federal Election Commission
    were very interested in Pat Robertson’s campaign for president of the United States,
    and most of interest involved money. CBN was a tax-exempt ministry, just like
    any church. For example, until the IRS changed the rules, we did not pay Social
    Security taxes, so Pat created individual retirement accounts for each employee
    through Fidelity Investments. The ministry contributed its Social Security share
    and our pay were “taxed” at the same level as Social Security. The big difference
    was that the money went into individual interest-bearing accounts that we could
    access upon retirement. The amount of money in my account, which was only over
    a period of a few years, was mid five figures.


    When someone leading a ministry for public office, however, that tax exemption
    qualifies for close scrutiny, and two federal agencies paid close attention. One,
    of course, was the IRS. The other was the Federal Election Commission. Somebody
    has to bring a complaint, an order, or some other notice that something is amiss
    in order to launch costly investigations, and in the Washington bureaucracy, such
    calls are quite often politically based. Pat was running for president, the same
    office that Vice President George H. W. Bush was seeking. It does not take a genius
    to creatively explore the politics involved here, and while I can’t prove anything,
    the prevailing view in my circle was that Mr. Bush set it all in motion.


    Vice President Bush had the means, the motive, and the opportunity to run a stake
    through the heart of the Robertson candidacy, and while I''ll admit that we broke
    the tax laws, by extension, Federal Election Commission rules in the process,
    the timing of these investigations favored only Mr. Bush. The question of whether
    there ever have been an investigation where one of the candidates not sitting
    vice president is one that cannot be answered fairly. It is the timing that matters
    most. Regardless, the weight of these probes impacted daily life at CBN, for we
    were forced into placing every decision underneath the microscope of threats to
    our tax exemption. We played defense only, the wind had been taken out of the
    sails of our offensive efforts.


    In August of 1988, Pat Robertson took the podium at the Republican National Convention
    in the Superdome in New Orleans. Pat was running for president, the same office
    that Vice President George H. W. Bush was seeking. It does not take a genius to
    creatively explore the politics involved here, and while I can’t prove anything,
