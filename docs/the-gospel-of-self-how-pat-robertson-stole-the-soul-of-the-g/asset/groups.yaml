    have discovered the reality that people will pass along their nonsense via social
    media, because fraudulent reporting fits so well in belief systems searching for
    validation.


    There are three new news beats that every media company should be exploring:


    +   - Fakes & Memes

    - Changing culture (disruptions)

    - Technology and the people who use it


    The *Washington Post* took on fakes and memes in a nineteen-month experiment that
    ended in December of 2015. “What fake was on the internet this week” was encouraging
    not only in the scope of its mission but also in the wonderful way it was written
    by Caitlin Dewey, and the decision to ensure the column was extremely disappointing.
    Believing the pace and tenor of fake news had changed, here''s how Dewey expressed
    the decision in her final column:


    ...where a willingness to believe hoaxes once seemed to come from a place of honest
    ignorance or misunderstanding, that''s frequently'
