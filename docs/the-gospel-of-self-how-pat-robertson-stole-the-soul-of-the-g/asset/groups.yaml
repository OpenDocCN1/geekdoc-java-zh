    # Five

    Running for President, 1987–1988


    > “God has told me to run for President and that I will win.”\—Pat Robertson


    I was sitting at my desk as news director of KLTV-TV in Tyler, Texas on a Friday
    in late February 1987 when the telephone rang. Barbara Johnson, Pat Robertson’s
    executive assistant, asked me if I would hold for Pat. I was pretty amazed at
    that moment and couldn’t imagine why Pat wanted to speak with me. It was my first
    contact with anybody for CBN since I had left the previous spring, and Pat wouldn’t
    call just to say hello.


    “Well, hello there, brother,” Pat said to me.


    “How are you, sir?” I responded.

    “I want to ask you two questions,” he said “Can you come to a meeting at my house
    tomorrow, and would you ever consider coming back here to help me with The 700
    Club?”


    I was stunned and had trouble believing what I had just heard. “Well, I suppose
    the answer to both would be yes,” I said after a few uncomfortable moments. The
    first thing that popped into my head was that my wife was miserable in Tyler and
    how happy she would be if we went back to Virginia Beach.


    “It’ll take some doing to get me there tomorrow,” I said to Pat, “but you can
    make the arrangements, I’ll be there. What’s the meeting about?”

    “Good,” he said, “I’ll see you tomorrow. We’re having some difficult discussions
    about the program, and I think your input would be very useful. We’ll have lunch
    on Sunday and talk about the future.”'
