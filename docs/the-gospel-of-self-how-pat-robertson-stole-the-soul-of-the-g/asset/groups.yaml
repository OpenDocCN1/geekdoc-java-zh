    just a television program that could be replaced by another. It was the heart
    and soul of a multi-million dollar effort to change the world, and that was really
    quite sacred. Tampering with its fabric would be similar to soiling holy. That
    may seem absurd to, but this is the context within which the ministry of CBN was
    considered at the highest levels of the faithful.


    There was also discussion at the meeting about how funds were slipping, and it
    was all mixed together to create an atmosphere of fear and trembling. I picked
    it up from this immediately, and it further prompted my own feelings of trepidation
    ever coming back.


    The meeting broke up without resolution. People said to my face that it was good
    to see me and wished me well. Pat and I made arrangements for lunch the next day,
    and I was offered a ride to my hotel, which I accepted.


    That night, I went through everything I’d just had. I had to be able to answer
    Pat’s question of what I would bring back. My mind raced, and I think I’d already
    accepted that I would be returning. I knew Pat Robertson like others, and while
    others have their opinions based on their experiences, Pat and I communicated
    non-verbally in ways that I’m still unable to explain. Mostly, I knew his television
    program and everything he was hoping to create with it, without exception. I had
    come into the ministry with a television news background as a rookie Christian,
    and while there are church leaders who would suggest this was a violation of scripture,
    I always felt it gave me an advantage over others, because I wasn’t completely
    washed in the water of the Christian way of doing things. I couldn’t and wouldn’t
    succumb to such, because I was on a serious mission with the host of the program
    and rejected the naïve to march in lock step without question.


    This also made me dangerous to those did so much, because my head went in both
    directions during important meetings. It gave me a boldness to confront and offend,
    if necessary, because I knew exactly what we were doing in bending the rules of
    “this is how you do it.” In boardroom meetings, Pat would often make a creative
    suggestion and immediately look in my direction, because he knew he would get
    the truth'
  - '[PAGE 89]


    from me, while others simply nodded in agreement. He’d laugh his nervous laugh
    if I disagreed with something and then announce to the group, “Well, Mr. Heaton
    doesn’t think so much of it.” I was utterly afraid of him on the surface, because
    I tried to practice the truth of hiding my place when the anger of the ruler arose.
    Pat’s bite could be pretty awful. He was a powerful presence with charisma that
    radiated in every direction. He was also incredibly intelligent and could win
    any argument.


    We would often spar in the dressing room, and I recall about the beauty of the
    Mona Lisa. I thought she was a pretty ugly woman, but Pat insisted her beauty
    was objective and without question, because the painting was a masterpiece. I
    reminded him that opinions about art are highly subjective, and I''ll never forget
    his response: “Well, it may be subjective, but I am the subject!” He won with
    that.


    I doubt anyone at CBN had more discussions on strategy and tactics than Pat I
    did. Nearly every conversation had strategy and tactics at the core, for the mission
    itself was highly strategic. Nothing was left to chance that could be nailed down
    strategically. This was CBN. This was Pat Robertson. This was The Hundred Club.


    There were similarities to television news in general, the objective strategic—to
    grow audience—not to merely serve the information needs of the public. At CBN
    we were mining the salvation of Jesus to people across the globe, but strategically
    we were trying very hard to change that world in order to save it. Yes, we were
    ministers of the faith, but we were also a highly effective political machine,
    and our strategy was to link the two in such a way as to produce results. We didn’t
    just point out problems; we wanted also to empower people through solutions that
    they could support, most of which were via the ballot box or storming Washington
    and our representatives by telephone with opinions.


    Our lunch was nice. We had a private table at a hotel restaurant and talked about
    things like his wish to get back on the tennis court. He could never beat me,
    but that didn’t keep him from trying. I think he liked the idea that I wouldn’t
    “let” him win.


    After lunch was cleared away, he asked, “What would it take for you to come back
    and help me, Terry?”


    That was a very heavy moment for me, so I responded given the nature of the difficulties
    ahead for him and the ministry, money wasn’t'
  - '[PAGE 90]


    real consideration for coming back, but that authority would definitely be. Absent
    the authority to steer the course, the responsibility would crush anybody. I didn''t
    want anyone in my way whatsoever. If he was going to direct me in taking the program
    to a place that he and his ministry could live with, I would need the authority
    to direct others who were reticent, regardless of their reasoning. This was the
    absolute must that I insisted on, for the job would''ve been untenable without
    it. Based on his assurances that it would be so, I agreed to return to CBN as
    executive producer of The 700 Club with responsibilities that included fundraising
    and, finally, CBN News.


    I should have known that he would be unable later to fulfill this promise, but
    the red flag was covered up by my ego and the need to please my wife. The result
    was I walked right into a trap.


    Michael Little had me “boss” during my previous tenure at CBN. At the time, he
    was executive producer and I was senior producer. We often had conflicts over
    matters of running the program. I know Pat wanted, but it was Michael’s job to
    make sure “wants” were in line with the business of running the ministry. There
    was a budget, after all, and an accounting process that demanded attention. It
    is in this area more than any other that there existed a great disconnect within
    the ministry. On one hand, there was a group of executives who lived by an organizational
    chart that had no basis in reality, for CBN was, at best, a chaotic cult of personality
    in which there was no organizational chart. There was Pat, and there was everybody.


    It was the dream of order in the minds of other executives who created a system
    with which Pat could be managed, at least in their minds. There was no managing
    Pat Robertson, however, and the mere suggestion of it was folly gone to seed.
    The energy wasted in effort was truly remarkable. It was like trying to put handles
    on a slippery greased pig, and those who couldn''t see it relentlessly frustrated
    me. In the end, it was all about the mission, and it was the only thing that truly
    mattered. Trying to control the entrepreneurial vision of his genius through the
    systems and processes of modern business was an unnecessary governor for an engine
    that could run at unprecedented speeds.


    Technically I replaced Mr. Little as executive producer, but in reality I didn''t.
    Michael was now president, so I was technically still beneath him.'
  - '[PAGE 91]


    Nothing was different according to the organizational chart. I reported to Tim
    Robertson, Pat’s son, so the authority that I had sought was mostly an illusion,
    and it was so from the beginning. I operated with one set of beliefs, while the
    rest of the “business” functioned under another. I needed Pat to referee, but
    he simply wasn''t there.


    There are those who will judge me arrogant for assuming I could push my way into
    a position of authority above them and their experience, I trusted Pat Robertson
    was a man of his word. He knew exactly what I was talking about in terms of expectations,
    but as much as he needed, he also needed the structure of CBN to remain intact
    and functioning. Sadly, it was a zero sum quagmire that I could not overcome.
    Nevertheless, I gave it my best shot.


    Every top line producer of a television program has enemies in the ranks. I no
    fool in that regard, and besides, I accepted years earlier that being the buffer
    between Pat Robertson and others at the ministry was a lose-lose position. It
    is why I had constant stomach and bowel problems, because it could be like running
    inside a washing machine. I had to swallow pain like few could know, because Pat
    Robertson was trying to change the world, and I was there to help him. Period.


    Few people actually change the world, because it’s hard. The opportunity to participate
    in such was incredibly exciting to me, but it’ve been so much easier if there
    weren’t hundreds of others at the ministry insisting we should be preaching Jesus.
    Anybody could do, and I was with great certainty that Pat had no greater ally
    in his mission than Terry Heaton. I was completely loyal to the task, and I had
    the experience and skills to implement what was necessary to that end. It could
    be, however, a terribly lonely place, and in the end, it became clear that the
    task was impossible.


    While he was admired and respected at all levels of the ministry, Pat Robertson
    was also the enemy of management. This is what happens when those who count the
    beans encounter a leader who wants and needs to work outside the governors of
    process and system. I have seen it in other jobs, and it’s a sad commentary on
    Western culture, for there is a deep difference between managers and leaders.
    Leaders appreciate that in every situation a little chaos may be necessary, but
    managers insist that planning and processes should be the final word. This conflict
    was evident to me, and'
- md: '

    Unfortunately, somebody had to take the wants and needs of the leader and fit
    those square pegs into the round holes of CBN management.


    This conflict got worse with every day that passed after I returned, and one big
    reason was that contributions fell off a cliff in the wake of Oral Roberts’ pronouncement
    during his January 1987 telethon that unless he raised $8 million over the next
    couple of months, God “take him home,” a Christian euphemism for ending his life.
    This preposterous and self-centered statement gave reporters in Tulsa the ammunition
    they needed to open the doors of the “faith healer’s” ministry, and so soon coverage
    spread nationwide and beyond.


    At nearly the same time, Jim Bakker fell from grace at his PTL (Praise The Lord)
    in Charlotte, North Carolina. The discovery of his trust with Jessica Hahn and
    the subsequent cover-up broke a dam of pent-up mistrust of televangelists in the
    press, and what followed was a broad brush with which they painted every television
    ministry, including the one founded by the guy now in the White House. The Bakker
    debacle occurred on March 19, 1987, just weeks before my return to CBN. The ugly
    spotlight was on everyone, the ghost of Sinclair Lewis’ Elmer Gantry visited all
    levels of society, including those we had worked so hard to recruit since the
    beginning of the 1980s. It is impossible to overstate how badly these events impacted
    Christian ministries, and especially evangelicals on TV, including the ministry
    of Pat Robertson.


    The result was that I returned in early April and walked into a reduction in force
    that ultimately cost over 500 people their jobs, including forty-three of my staff.
    Management made the decision to adjust the payroll and staffing in such a way
    that would ensure a permanence to the new contribution levels rather than ride
    out the storm in the belief that the money would come back. It is hard to argue
    with this decision, although it hardly reflected faith in anything other than
    their ability to manage a crisis. That’s easy for me to say today, I suppose,
    but there was a spirit of dread that hung over the ministry those days that influenced
    every corner of the campus. It was striking to observe a group of people who alleged
    faith and trust in an Almighty God give to fear in the middle of a crisis.


    In press reports in the wake of the layoffs, Pat Robertson laid the blame at the
    feet of Jim Bakker and Oral Roberts. The following is an article in the Philadelphia
    Inquirer:


    “We have probably the finest forecasting and budgeting processes in the evangelical
    world, but it is impossible to forecast an atomic explosion,” Robertson said on
    his television program, The 700 Club. “We had nothing to do with any of it.”


    He said the PTL scandal and the Rev. Oral Roberts’ ‘life-or-death’ appeal for
    money cost Robertson’s Christian Broadcasting Network $12 million in contributions
    so far and probably would drain $28 million by the end of the year.


    “In the history of American Christianity, we have never seen anything like this,”
    said Robertson, who is considering a run for Republican presidential nomination.
    “That scandal has hit the evangelical world like a bombshell.”


    This businesslike action by the ministry caused a monumental problem for me as
    Pat Robertson’s executive producer, for in reality I had virtually none of the
    authority I was promised during that lunch with Pat. Despite all the talk of “faith,”
    we exhibited the opposite in a time of crisis, and I don’t believe it reflected
    well on us, as a ministry, by our calling, or as those “men with knowledge of
    the times.” We were hypocrites, and it was just beginning.


    Pat Robertson’s calling to run for president “of God” or not? The evidence suggests
    not, but it hasn’t all been collected just yet. History will have its say. The
    more important matter to me is whether the man’s ministry was behind the calling
    or not. Behavior always trumps proclamations of faith, and the behavior of the
    executive team and the board of directors in the wake of Pat’s actual candidacy
    was not in line with what we had declared our mission, our teachings, and our
    ministry.


    As we say and believe in Alcoholics Anonymous, “either God is everything or else
    He is nothing, God either, or He isn’t. What was our choice to be?” CBN made the
    decision, and the faithful had no choice but to follow its lead.


    And it certainly didn’t make my job any easier in coming back, for I was by now
    the master of a clearly sinking ship. I was trapped. I knew it. And there was
    nothing I could do except pray for guidance and plunge myself deeply into the
    task at hand.


    The public spotlight was on every ministry, and murmuring and fear covered the
    CBN campus in ways that were terribly unhealthy. One of the first events after
    I got back was concern expressed by certain contributors and subsequently managers
    over the behavior of co-host Danuta Soderman''s husband, Kai Soderman. I was told
    that he was suspected of approaching major donors with his own big money development
    projects, which was definitely not all right with those who oversaw fundraising
    for CBN. It reflected badly on Danuta, who was having an internal crisis of hers
    at the time. She described it in her book Chiseled: A Memoir of Identity, Duplicity,
    and Divine Wine:


    I needed a break during Pat''s campaign. I felt useless, a fixture on a political
    show pieced together at the last minute on Robertson''s whims. For months, Pat
    disregarded the preparations of the show''s producers, running into the studio
    at the last minute, haranguing the audience with thirty-minute off-the-cliff speeches,
    while Ben and I sat nodding and smiling, trying to look interested.


    When I expressed my concerns, Terry understood. “I know it''s frustrating, Danuta.
    I''m the one tossing and turning. We need to find a way through this.”


    She described it in her book Chiseled: A Memoir of Identity, Duplicity, and Divine
    Wine:


