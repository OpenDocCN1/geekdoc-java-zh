  - '[PAGE 30]


    Through the use of preproduced material, interviews, and graphics, we will present
    a Biblical perspective of news and current events.


    In all that we do, we will present the Gospel of Jesus Christ relevant, modern
    terms.


    There exists in America a very negative attitude about Christians and Christianity.
    This is especially true among skeptics and interferes with our message. Therefore,
    we will, whenever possible, try to present a youthful, joyful image of Christianity.


    We believe revival is accomplished “Not by strength, not by might, not by power,
    but by spirit said the Lord.” Since the miraculous always accompanies genuine
    outpouring of the Holy Spirit, and He has promised to “confirm His Word with signs
    and wonders,” we are absolutely committed to documenting and revealing the miraculous
    wherever possible.


    We will lift up Jesus in all that we say and do.


    We will follow the Apostle Paul’s example to “be all things to all by all we might
    save some” in our effort to reach a dying world. We will also follow our Lord’s
    example and “eat with publicans and sinners.” In doing so, it is understood that
    we may, from time to time, face the wrath of the Pharisees in defending program
    content they either disagree with or do not understand.


    Through regular, promotable series reports we will present information unavailable
    elsewhere on television.

    Our program will entertain, educate, and enlighten.


    All of our segments will be presented in such a way that each offers a Biblical
    answer to the conflict presented.


    Wherever possible, we will build bridges over denominational walls as we will
    seek unity in accordance with the Laws of the Kingdom of God.


    In preproduced pieces, through the spoken word, and with graphics we will present
    the Laws of God’s Kingdom. Our goal is that all would learn in practical terms
    what it means to live the Christian lifestyle and that all would mature in Christ.


    We will coordinate with corporate development to assure the smooth, on-going flow
    of spots, features, guests, and graphics,'
  - '[PAGE 31]


    which illustrate the activities of all of the branches of the CBN ministry.


    Few television programs have their own mission statements, and the above gave
    me a general outline from which to proceed every day. It was also very useful
    for me in “managing upward” with the executive staff of the ministry, those who
    were charged with bottom line maintenance and with whom I often had conflicts
    in running the operation. Key to the mission statement were sections about current
    events, miracles, and teaching the “Laws of God’s Kingdom,” for these were the
    hallmarks of The 700 Club and essential to producing the program.


    The program’s mission statement wasn’t the what attention, however. The overarching
    mission of the ministry was what guided everything we did, and this document was
    shared both internally and publicly. It is here where we bent our rules in seeking
    political change in the land, for laws that restrict tax-exempt organizations
    govern such activities.


    # The Christian Broadcasting Network


    The mission of CBN and its affiliated organizations is to prepare the United States
    of America, the nations of the Middle East, the Far East, South America, and other
    selected nations of the world for the coming of Jesus Christ and the establishment
    of the Kingdom of God on earth. Our ultimate goal is to achieve a time in history
    when “the knowledge of the Lord will cover the earth as the waters cover the sea.


    In achieving our mission chief method is the strategic use of mass communication,
    especially radio, television, and film; the distribution of records, cassettes,
    films and literature; and the conduct of education that will train the young and
    old to understand how the principles of the Kingdom of God relate to those spheres
    of human endeavor which play a dominant role in our world.


    In achieving our mission nothing should be done that does not glorify God and
    His Son Jesus Christ.'
  - '[PAGE 32]


    Three words should characterize the execution of our mission. First, we will be
    innovative. Our task is not to duplicate or copy other men''s labors. Second,
    we will be excellent. Our work must either be of lasting value and highest quality
    or it should not be done at all. Third, we will demonstrate integrity. In our
    work, our public relations, our internal and external communications, there will
    be an abiding commitment to trust. Integrity must characterize all of our dealings
    with others.


    In staffing for our mission we must insist on the best possible men and women
    for each task, and we will make every effort to see that people and tasks are
    matched appropriately. Our policy will be to secure a small staff of outstanding
    people and to compensate them well for their labors. Our staff should be “filled
    with the Holy Spirit and wisdom.” God’s work will be done by God’s people, equipped
    and chosen.


    Implicit in the fulfillment of our mission is the demonstration of all the principles
    of the Kingdom of God, especially that of reciprocity. Therefore, we continually
    endeavor to give generous assistance to the relief of human need and suffering
    through the world as well as donations to other organizations that share our basic
    objectives.


    We believe that God’s work, done according to the principles of His Kingdom, will
    prosper financially. We cannot serve God and money, so service to God and his
    call always takes precedence over conflicting considerations of money. Nevertheless,
    we recognize that only those activities which are economically viable continue
    in our present society, so planning must take into account economic viability.
    We also categorically state that the payment of accounts when due is a key ingredient
    of integrity. We seek to finance our activities by all lawful and morally correct
    means, including but not limited to contributions, sales, and investment income.
    In planning we will endeavor to project adequate income for current activities,
    plus generous surpluses from which we can build and expand.


    In the fulfillment of our mission, as to calling and message, our Biblical role
    model is John the Baptist. As to wisdom it is.'
  - '[PAGE 33]


    As to ministry to Israel it is the prophet Ezekiel. In all that we are, do, and
    say it is Jesus Christ.


    This was the governing document of CBN, but it was stretched in every direction
    in attempts to accomplish the task of bringing the ‘knowledge of the Lord’ to
    America. The fine line between preaching and government influence was breached
    time and again and included such activities as funding political action with ministry
    monies. Excellence, innovation, and integrity: I heard those words constantly,
    and it’s hard to argue that we didn’t operate regularly with the first two. When
    it came to integrity, however, we let our political ambitions overrun our commitment
    to this important value.


    My role was chief architect of the mission statement, and I served that role well.
    It was this, however, that put me at odds with several key executives, those who
    were more interested in managing the words of the mission than the actual task
    of implementing it.


    This is why I often felt alone in my job, for I was afraid of chaos and willing
    to lead a course through its stormy seas. This is also why I enjoyed a special
    bond with Pat Robertson, for I could anticipate him better than most, and this
    is the mark of a good producer. In my life as a TV talent, I had once been made
    to look like a fool during a live broadcast because the producer hadn''t timed
    the program correctly. I swore after that event that I ever got into producing,
    I would never allow somebody on the air to falter due to my inability to anticipate
    or time a show correctly.


    We created what was lovingly referred to as a ‘living format’ for live television.
    It was the only thing that could accommodate Pat’s continuously editing mode,
    for he often went with his gut in calling for adjustments to the show. As I look
    back, it was really quite remarkable that we could create flawless television
    production as it was being adjusted from the anchor chair.


    I could ‘see’ Pat’s mind work in real time and gave him options on where to take
    a thought stream as he was thinking. Many were the time that I would hand him
    something off camera while he was talking live that would naturally flow into,
    for example, fundraising or political action.'
