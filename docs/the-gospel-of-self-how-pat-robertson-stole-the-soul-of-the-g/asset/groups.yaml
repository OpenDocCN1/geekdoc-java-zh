    this is an enormous problem for journalism and for the culture itself.


    As noted earlier in this book, it isn’t the leaders of the extremes that we should
    fear; it’s the followers, and our obligation is to them. We’re going to need a
    way to present fake news and hoaxes that does not threaten the deeply held convictions
    and fears of those followers.'
