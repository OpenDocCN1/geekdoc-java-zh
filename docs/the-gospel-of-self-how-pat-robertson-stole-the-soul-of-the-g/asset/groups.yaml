    very first act was to plant a cross and claim the land on behalf of their Savior.
    This act is significant in everything that follows from it, including the documents
    that recognized the potential for mischief in taking such a proclamation too far.
    Hence, we have the establishment clause of the First Amendment. However, that
    doesn’t change the reality that the homes, by-ways, and communities of the colonies
    were filled with people of faith. Our democracy is based on oaths and promises
    that we make to each other, and there must be a form of punishment ahead for those
    who violate such beyond what the law can provide. Hence, we swear to tell the
    truth by putting our hand on the Bible in (some) courtrooms. Again, we can argue
    how effective it has been over the years, but this doesn’t alter the history behind
    it all.


    Moreover, any fair reading of early documents—including those of the Founding
    Fathers—can only be done using the language of the time, because the meanings
    of key words have changed over time. That means one must use the dictionaries
    of the era, Samuel Johnson’s classic of 1755 and Webster’s of 1828. When that
    is done, it takes considerable manipulation to conclude anything other than the
    truth of Christianity played a significant role in the formation of the US. It
    didn’t need to be specifically spelled out, because it was assumed at the time.
    In no way means America was birthed as a theocracy, but rather a country based
    on the belief that government “of the people, by the people, and for the people”
    meant that some people were already self-governed through their faith. After all,
    it was John Wycliffe first uttered the phrase, upon completion of the first common
    English language translation of the Bible, he said, “This book shall make possible
    government of the people, by the people, and for the people.” This is why those
    same Founding Fathers saw the need to include the establishment clause in the
    First Amendment. No representation of God could never rule a people educated in
    the truths of the Bible.


    As the country has become more secularized, therefore, it’s easy for Pat Robertson
    and other evangelical leaders to stir their followers over the actions of contemporary
    progressive thinkers. It forms the controversial pot within which the fundamentalists
    brew their self-serving anger, demanding a return “to the way it used to be.”
    In this manner they became suckers for the way it used to be.


    The Washington Post’s conservative commentator Mark Thiessen wrote, “Trump has
    arguably done more in his first year in office to protect life and religious freedom
    from any modern president.”


    “Little wonder,” he added, “that religious conservatives stick with him despite
    the Daniels revelations. This is not to say that Christians don’t think a culture
    of fidelity is important. But the culture of life is important too. So it is a
    culture that is welcoming to religious believers than waging war on them.


    This motivator—the heartfelt belief that the Christian faith—is one of the most
    important factors in Trump’s support. Persecuted are evangelical Christians by
    a rotting culture, the thinking goes, that we need to fight back with everything
    we’ve got politically, rather than just give the nation over to the devil by saying
    nothing. During his campaign, Trump assured a salivating Christian right “We’re
    gonna bring it back,” “We’re gonna protect Christianity,” and that “Christianity
    will have power if I’m President.”


    This issue of whether Christianity is under attack is complex and difficult to
    understand on every level. The parties involved have differing views, but the
    arguments never take place in the same contextual frame. One side argues that
    America was created as a Christian nation by Christians who came here to colonize
    in Jesus'' name, while the other side argues that such a belief doesn''t apply
    to the United States, because the country’s founders were an eclectic group and
    wrote documents to protect citizens from rule by religion. The Christian nation
    argument is irrelevant in modern times, because humankind has come so long way
    in the last centuries. One is a spiritual argument; the other is an argument of
    reason. One touts Holy Scripture, while the other relies on education and knowledge.
    One other is upstream with the saints of old; the other is downstream in a hundred
    human tributaries. One believes the Bible is a “living document” while the other
    sees a certain anti-progressive rigidity in a set of archaic rules. One claims
    to fight; the others claim to argue logic.


    Any reasonable, objective study of de-Revolutionary American history makes a convincing
    case that Christianity was so enmeshed in daily life at the time that one must
    conclude its governance and institutions were filled with people of faith. Arguing
    against this requires changing history, although there’s no real reason to do
