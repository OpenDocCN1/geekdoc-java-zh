    TH: Or suggesting guests... I''m sure he did. I don''t have any specific recollection
    of any particular person. I can''t recall... this would be an example... I can''t
    recall a name, but somebody was in town visiting with him or he would have breakfast
    with somebody and I remember one day he came in and said, "by the way, this guy''s
    going to be on the show." As you can imagine, when you''re trying to produce a
    live television program and everything... that''s why I remember that. It''s chaos
    at ten minutes to all of a sudden to try and rebuild a 90-minute program. Yeah,
    he did bring people in but I don''t know that they were specifically related to
    his political activities.


    IRS CID: Did you have much of that? Did it change the run sheets for your show?
    Was this just an occasional occurrence maybe he would introduce a guest to you
