    IRS CID：当你们涉及到诸如资助反叛军、资金流向黎巴之类的问题时是如何处理的？你是否过一种认知，即你在 CBN 期间本应该采取某种立场？


    TH：嗯，这听起来非常简单化了，但关于反叛军、自由和尼加拉瓜……这件事，可以从圣经的角度来论证其合理性。共产主义的核心是对上帝的仇恨，而我们拥有关于尼加拉瓜福音派牧师身上发生的事情的证据。所以……如果我们从圣经角度的立场与该国两种不同的政治倾向之一相符，那只是巧合。黎巴的情况也是如此，因为福音基督徒对以色列的重视，以及该国家在圣经中的意义。


    IRS CID：我不是想在暗示你……不要觉得你……你所说的完全正确。在处理这些某些事情时，我们并没有处于 C-3 级别的纠葛中。你的回答……是大多数 CBN
    人的感受都是这样吗，还是这种方向专门由帕特·罗伯森先生提出的？


    TH：嗯……你是指圣经的角度吗？


    IRS CID：不是，是指对国家或国际舞台上某些发生事件的支持。


    IRS CID：黎巴嫩，中美地区。


    TH：我不知道其他人是怎么想的？


    IRS CID：我们只能询问你的意见。


    ## IRS CID：关于你们的接收指令。


    TH：你指那个，意思是，我被告诉“做这个报道是因为……”吗？你知道的，我在这里很难组织措辞。我想，我应该，我确实从圣经的角度对反叛军产生了某种同情。我对以色列人民也有同样的感觉。我并不认为我们制作这方面的报道有什么大大不了。我从未被指示过“你将做这个，因为这是某些特定领域我想做的。”这才是你的问题真正想问的。


    ## IRS CID：你是否知道关于 501(c)3 禁止实质性游说的规定？


    TH：是的，我质清楚。


    IRS CID：我之所以在 1986 年 3 月在节目中与辛劳布将军（General Singlaub）一起询问这个问题，是因为节目中有大约 20 分钟的时间完全用于《反叛军援助法案》及其支持，其中还提供了国会总机号码供普通观众拨打。现在，这属于游说。是谁想出这个问题的？


    TH：做这些某些事情是不违法的对吧？所以，我们偶尔会打出国会总机号码。非常小心地说明，无论你们的观点是什么，作为公民，你有宪法义务和权利让你的议员或代表知道你对对此的看法。这一点我们非常小心。


    IRS CID：我可以再进一步吗？虽然其他人也说过这些，但他们也说过，你知道你们针对的受众……我们知道保守派基督徒通常可能会采取某种立场。这对于《700 俱乐部》的工作人员来说也是一个众周知的事实，即很有可能这就是你们正在做的。而且，关于游说……其中很大一部分是合法的，但我正试图理解你们的运作方式。


    TH：我无法……再次，我无法替所有人做决定，但我很清楚。


    IRS CID：当你们做这些事情时，在你们在屏幕上闪现那个号码之前，是否得到了帕特（Pat）的批准？他是否提前知道你要做这些事情？


    TH：通常情况下，在节目期间显示国会总机号码或白宫电话号码的冲动来自帕特·罗伯森在节目期间提出的。


    IRS CID：所以他在你们录制时做出了决定？


    TH：在我们与数百万观众同步直播时。


    IRS CID：你们是直播的……你们的早晨节目是直播的。


    TH：记得我告诉过你这是一种直播形式。我们有那些东西……那些电话号码保存在我们的素材库（still store）里。就像很多其他东西被保存在我们的素材库里一样。当他要求时……有时他甚至会在休息室给我们许可，告诉我们他想做这件事。他并没有在拍摄现场让我们感到措手不及。


    IRS CID：所以，通常情况下，他是那个给出指令闪现那个号码以便人们拨打的人吗？


    TH：是的，先生。


    IRS CID：你知道他是否曾在节目中支持过候选人，或者受邀《700 俱乐部》的客中有过候选人？或者如果……不是保守派的候选人……《700 俱乐部》是否会提供替代候选人。换句话说，试图损害那个候选人的声誉……具体提到加州的的伯德夫人（Mrs.
    Bird）法官。


    TH：指的是这个……罗丝·伯德（Rose Bird）。


    IRS CID：她是加州最高法院的法官。


    TH：我们不是那种为了选举就着手破坏别人的残忍之人。我们没有做过那种事情。我们请过正在参加竞选的客人们吗？我只是不明白如何在不偶尔涉及那样情况的情况下做新闻，但我真的不知道。


    IRS CID：我们知道，但不要偏离重点。我想重点是……你们在节目中确实做了一些基本上是反伯德的片段。再次，在那个特定案例中，那个……那个想法是从哪里来的？制作那个节目的那个主意？是来自
    [?] 还是其他人？


    Bthe：很可能是来自工作人员的。做这样一个报道会……


    TH：特里（Terry），他们问的是你是否知道。如果你知道这源于哪里。如果你不知道，就告诉他们。


    TH：我真的不知道。


    这种提问持续了三个小时，我精疲力竭，所有的话都说完了。我从政府获取证据的能力中学到了宝贵的教训。在当今，完全“秘密”运作的想法是非常荒谬的。


