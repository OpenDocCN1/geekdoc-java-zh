    important paper written by Dr. Abraham Zaleznik for the Harvard Business Review
    in 1977, “Managers and Leaders: Are They Different?”7 Managers accomplish tasks
    through organization and process, while leaders are capable of accomplishing tasks
    through the power of vision and character, including through what managers would
    view as chaos. Pat Robertson, for example, was not a manager according to Zaleznik''s
    reasoning. Neither was I, which explains one of the key reasons we were able to
    connect so well. Managers, however, governed the ministry of CBN, and it was this
    more than anything else caused me stress and its resultant gastroenterological
    health problems.


    Ben and Danuta were also “leader” personalities, and that doubtless contributed
    to the amazing chemistry they had as a team on television. Nonverbal cues are
    a vital part of behind-the-scenes communication for live TV, and I was extremely
    fortunate to participate with Pat, Ben, and Danuta on The 700 Club. I can''t speak
    for what it''s like today, but back then, it was quite remarkable to me. I loved
    that group, and I like to think that it showed both on the air and off.


    Ben own is one of the mostable people I have encountered, and I don''t know anybody
    would argue with that. He is a giant teddy bear of a fellow who brought a street-smart
    to the chemistry of the team. His background as an African American was very different
    from Pat''s upbringing as an American aristocrat, and that made for an entertaining
    interaction and one was filled with mutual respect. The racial make-up of CBN
    in the early 1980s was almost entirely Caucasian. Ben''s was the only black face
    on the management team, and his good-natured, self-deprecating humor often brought
    the house down, whether it was in the boardroom or on TV.


    My roots are extremely modest, and I wince whenever I hear the popular politically
    correct term “privilege” when it''s applied to me simply to the color of my skin.
    I remember walking through the vast hall is The Homestead with Ben one day during
    a 700 Club retreat and observing the high society types being served by men and
    women dressed in white. The Homestead actually smelled of money, and as we walked
    along, I grew more and uncomfortable with the place. I mentioned to Ben that I
    felt out of place. He stopped me and laughed.'
- md: '

    “Man,” he said, if you feel out of place, imagine how I feel? Look at the people
    dressed in white! They’re all black!


    Of course, he was right, and I felt embarrassed for even bringing it up. There
    are degrees of feeling out of place, and Ben had just trumped mine with a simple
    statement of truth. He was the only black face in the joint that was not wearing
    a white coat. We both laughed a belly laugh and got the hell out of there as soon
    as we could. I never went back inside the result.


    At that same retreat, I remember a fascinating discussion with Ben as we listened
    to the music of Aretha Franklin.


    “Man,” he looked at me and said, “You’re a musical gay. Why does this stir my
    soul, when Christian music leaves me flat?


    He noted that Christian music, whether hymns, worship, or contemporary, spoke
    to his heart and “entering into worship” always made him “good.” However, pop
    music, especially soul music, touched him and spoke to him in a way that no other
    music did. It stirred his emotions and made him “feel” the message of the music.
    Ben thought it that music intended to minister to his soul just didn’t do the
    trick. It’s a great question even today.


    The concept of ego among television personalities and other characters involved
    in live performances on any stage is vastly misunderstood. It is usually used
    to describe or justify bad behavior. People with “big egos” are generally regarded
    as irritating and often contemptible. This pejorative belief is unfortunate, for
    the behavior of ego-driven people is rarely a deliberate attempt to build a cover
    for real or perceived shortcomings. I have worked with hundreds of show hosts
    and anchors over the years, and I’ve found this to be universal. It takes an enormous
    ego to risk the significant potential embarrassment or worse of making mistakes
    on live TV. I find it easy to empathize with because I am highly sensitive to
    the same thing. It tends to drive people to incredible heights in a constant search
    for acceptance.


    Pat Robertson was very good at covering any potential nervousness about anything,
    but he had one obvious “tell” in his behavior when backed into a potential corner.
    He would laugh to brush aside emotions in order to think more clearly and deliver
    an intelligent response. This laugh wasn’t as genuine as Pat would, I’m sure,
    like it to have been, and it was highly recognizable to anyone who spent a lot
    of time with him. Whether he was being interviewed on a live news program, involved
    in controversial discussions on The 700 Club, or even in certain business settings
    within the ministry, he would chuckle. When the chips were down in the moment,
    Pat would find a reason to laugh in order to delay his response. I always felt
    it was pretty smart, though it could be annoying. If you ever witnessed Pat chuckling
    at what seems to be an inappropriate moment, rest assured that he''s uncomfortable
    and that the wheels of magnificent mind are turning rapidly.


    It is important for me to state at this point despite the stress, the manipulation,
    and other negativity noted here, my years at CBN were a net positive—and by a
    mile. The people, especially those who were a part of the staff of The 700 Club,
    were the most talented and committed people I''ve ever worked with. They were
    beautiful inside and out, and we had a great deal of fun during the years I was.
    Any live television show produces a very real enemy in the clock, for it is a
    ruthless taskmaster that never quits. Consequently, there was a lot of humor involved
    in our work, the kind that you might find with a MASH unit in time of war.


    One day as a gag I wore an old necktie I drew a comment from Pat in the dressing
    room. He was such a stickler for quality ties, and this one was awful. It was
    a burgundy, pleated thing that resembled the type of curtain found in perhaps
    a funeral home. It was but ugly, and I knew it. Pat practically gagged when he
    saw the tie and told me to take it off. I declined, which resulted in later hilarity
    on the set, as Pat couldn''t stop complaining about it. I said it was an heirloom
    that I rescued.


    I wore it again the following week to lift him up, and it worked. The next time
    I wore it, however, he called me to the set as a video story was playing, produced
    a pair of scissors, and cut it in half just below the knot. I was crestfallen
    while everybody in the studio got a good laugh, including the audience.


    After shopping for some Velcro, I reattached the pieces of the tie. It was now
    a pull-away tie that created a nice tearing sound when pulled from the bottom.
    I showed up with it, and Pat about split a gag laughing. He must have ripped that
    tie a dozen times during the program. I still have it today, and it remains one
    of my most prized possessions.


    I was also witness to some of the most fascinating interviews with people who
    played significant roles in history. In my years as producer, the most memorable
    guest was Dr. Benjamin Mays, one of the founders of the Civil Rights Movement.
    Mays was almost ninety when he appeared on the show, but he was remarkably alive,
    and his mind was crystal clear. He was an author, educator, former president of
    Morehouse University, a pastor, and one of the leading authorities in interview
    was burned into my consciousness where it remains today. Pat asked Dr. Mays what
    he thought was wrong with young people today. Dr. Mays replied, "Parents are extraordinarily
    afraid to let their children experience the same kinds of things that shaped their
    own character." It was a remarkably perceptive argument then and a bold statement
    of truth.


    I will never forget the appearance of pop star Donna Summer in 1983, at the pinnacle
    of her success. We received word that she would be interested in discussing her
    faith with us, if we could come to California. It was the first time she had publicly
    discussed her background and faith in such an intimate way. I can’t recall who
    came up with the idea, but we were very excited about the possibility of taking
    the whole program to Hollywood. Pat gave a nod to the idea, and I went to Los
    Angeles to survey site locations for the broadcast. We ended up at Universal Studios,
    where we got the red carpet treatment from everyone involved. Major celebrities
    with testimonies of faith were scheduled, but it was Donna Summer who headlined
    everything. Known as the disco queen, Miss Summer was prolific at that time in
    out Billboard toppers. She was as famous as it gets, and it would be unfair to
    compare her success with anybody today. She was warm and gracious to tell us her
    story.


    Just before her interview, I had to run to the Universal office to tend to a matter,
    so I didn’t get back until the interview was nearly completed. That walk back
    to our studio on the grounds of Universal was unforgettable. Every room, every
    office, and every window I passed had closed-circuit TV tuned into The 700 Club.
    People were gathered watching Donna Summer, because the studio had spread the
    word that she would be on live TV telling intimate details of her past. It gave
    me such a sense of community and a real blessing as I made my way back to our
    set. It was without a doubt the most memorable event of my television career,
    and the series of programs from California received accolades from every corner
    of the Christian world, broadcast or otherwise.


    I need to pause here pay respect to Christina Rylko, whose hard work and dedication
    eased the burden I felt as the show’s producer. Christina was a young and beautiful
    woman with smarts, grace, and skill far beyond her years. She charmed everybody
    while kicking ass, but her competence is what I will always remember. She was
    one of the very people I’ve worked with in my career that I could trust completely
    to regularly crank out excellence in the execution of her duties. She could read
    my mind and turn any vision into great television. She was rare, and Pat loved
    working with her, too. I owe her—and, frankly, the whole staff—a great debt of
    appreciation.

