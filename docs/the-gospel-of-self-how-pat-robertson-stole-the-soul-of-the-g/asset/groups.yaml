    这是我的故事。它始于对更加精神生活的追求，结束于意识到生活的意义在于变得更加人性。在这一过程中，我作为参与者，见证了人类历史上最激动、最重要且事实证明具有潜在破坏性的社会运动之一。


    一个人如何能如此热爱某物，却同时又恨它？


