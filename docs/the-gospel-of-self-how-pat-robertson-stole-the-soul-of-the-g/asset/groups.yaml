  mdcn: '

    那是我的工作，而不仅仅是制作电视，而且我做得很好，无论这如何影响我与部里其他人的关系。


    对我而言，我的职责是对帕特·罗伯森（Pat Robertson），而不是他所任命的任何执行代表。在这个领域存在许多冲突，但我坚持自己的信念。归根结底，一个事工部门并不像公司那样，权力和控制是沿着层级金字塔向下流动的。一个事工部门更像是一种个人崇拜，拥有“呼召”的人是唯一的权威，而其他人汇聚在一起是为了实现这一目标。我将自己的呼召看作是帮助帕特·罗伯森行正义之事。


    因此，在培养我们的观众对公认原则的认知方面，我发挥了关键作用，但这包括将某些事情推向了极端。例如，使命宣言中没有提到任何政治，但作为前任美国参议员，帕特·罗伯森在接受事工的呼召之前就已经是一个政治动物了。他对政治的理解比其他许多人都深刻得多，因为政治过程往往是社会痛苦的导火索，他知道自己正在做什么来纠正这些。帕特了解局内人物以及游戏是如何进行的。他的观察通常非常准确，每当他针对任何问题发表政治见解时，他都很清楚自己在做什么。


    例如，帕特在一次直播节目中的即兴、无剧本对话中告诉本·金奇洛洛（Ben Kinchlow）和丹娜·索德尔曼（Dana Soderman），只有基督徒和犹太人才有资格在美国担任公职。本表现出极度震惊，但帕特重复了他所说的话。许多人——包括
    NBC 新闻部——将这一时刻视为证据，认为帕特已经超出了记者丹尼尔·C·哈林（Daniel C. Hallin）所说的“合法辩论的范畴”，但帕特是直接对他的选民说话，他并不不在意批评者会如何解读。对于那些相信美国是建立在犹太-基督教原则之上的人来说，很容易接受“只有犹太人和基督徒才有资格管理它”的说法，但这个概念对于那些相信开国之父更具包容性和宽容度的人来说是陌生的。在大多数情况下，这些在在他人（尤其是自由派人士）看来是荒谬的言论确实如此，这也是为什么我们认为有必要教育他们。


    新闻部匆忙汇编了一段关于该裁决的报道，我们在演播室集聚录制了新的开头片段。每个人都穿着早间直播时的同样的衣服，以确保最后的节目无缝衔接。在故事和讨论之后，帕特要求大家就这件事与他一起祈祷。我记得我和
    CBN 主席鲍布·斯洛瑟（Bob Slosser）站在那里，帕特祈祷，让上帝通过任何必要手段（包括他们的死亡）除掉那些投票反对祈祷的最高法院法官。鲍布和我面视着对方，几乎同时说道：“他不能在电视上说这种话！”我们都知道帕特对法院的裁决非常愤怒，但实际上要求处决投票赞成禁令的法官之死既是明智的也是危险的，更不用说这种公开表态本身是不道德的了。


    我们要求大家留在原位，并向帕特表达了我们的顾虑。经过深思后，他同意录制另一个不含死亡威胁的版本，这就是我们使用的版本。对于他在关于政府、爱国主义的那些极具攻击性的宣告中，这是一个难得的纠错机会，而这些是《700
    俱乐部》的经常组成部分。很难说帕特在做出诸如杀死最高法院法官之类的言论之前，是否真的计算或考虑过他的措辞。他非常聪明，非常了解他的观众，但他非常相信祷告的力量能为信徒和群体提供答案。鉴于我们使命的广度和深度，帕特设想自己坐在一个由上帝亲自提供的巨大工具的驾驶台上，目的是让美国远离其自由主义倾向。我认为他这样做是真诚的，而那些将行动视为贪婪、权力或个人利益表现的人，与今天仍在努力理解唐纳德·特朗普当选的是同一拨人。


    随着岁月的流逝，雷根总统任期开始尾声，《700 俱乐部》变得越来越政治化。回想起来，我们当时传导的是信上帝改变人心，并认为光靠改变文化是不够的，他希望我们都参与政治。这是一种微妙的转变，但我们并不孤单。整个电视福音派正在背离其初衷，掉入权力和影响的陷阱。随着《700
    俱乐部》的演变，我们在教育人们共和党的方式就是上帝的方式，这后来变成了二十世纪最受注目的社会工程成就之一。


    帕特·罗伯森热爱地图，他的观点是正确的：许多人根本不知道这个国家或那个国家在哪里，更不用说他们如何与邻居互动了。他们显然不知道为什么这很重要，或者“那边”的事情如何影响我们这儿的人。我们制作了八英尺高的画板，上面有精美的地图代表世界各个地区。


    我记得某天在化妆间，帕特要求准备好非洲地图，因为他想谈谈这个话题。这并不是一个预先计划的环节，所以我们都必须保持警觉。在大约十五分钟，他遍历了整个大陆的每一个国家，说出了首都、统治者、政治状况，并解释了每个国家的地缘政治地位以及他们如何与邻国产生联系。我站在那里看着这一切，我记得在心里对自己评价道，世界上只有极少数人能做出他刚刚所做的事情。这确实是智力、知识和沟通能力非凡的展示。他的动力是教学，正如使命一样，他需要向追随者证明
    CBN 是一群拥有时代知识、能够引导以色列的圣经式男士。


    帕特不喜欢自由派，认为他们是社会的诅咒，因为他们对政府的依赖超过了对上帝。帕特是个人责任的坚定支持者，拒绝任何需要他人照顾的想法。民主党人和自由派很容易被视为上帝的敌人。

