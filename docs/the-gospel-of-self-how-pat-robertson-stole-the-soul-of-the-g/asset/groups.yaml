    to be a divergence of ungodly on so many things. And we’ll have all these potholes.
    That means that some of the banks will be going down, and we’ll be having spotty
    problems in our economy. I mean, it’s not going to be like smooth sailing, and
    it’s not going to be the end of the world. But it’s going to be a difficult year,
    just like driving on a country road full of holes and potholes.


    In terms of CBN, it’s kind of like all systems go. God is blessing us tremendously.
    This will be a better year than we had in 1984. It’s going to just continue—God’s
    blessing is here. And He just kept ensuring me. But there were three or four scriptures
    that the Lord gave me specifically ... The words had to do with pulverizing the
    ungodly. And, of, we can’t go out and pulverize people today, but I think the
    way you pulverize is in prayer. We cannot let up. And I think there’s a tendency
    of the Christians to think, “Well, the election’s over. Somehow ‘84 was a great
    something or other.” But it wasn’t ...


    We’ve got to wipe out the forces of evil; in prayer, Bible knowledge, in evangelism
    and that kind of thing. There’s got to be an effort like never before, especially
    in prayer for revival. And if there’s one word, I would think, it is the concept
    that the Church is getting ready to reign and rule. That is what God has in mind.
    He’s going to exalt the mountain of the house of the Lord. And that has been a
    gradual process. It’s going to be accelerated in this year and the next year and
    the next year. We’re going to see God’s people lifted up. But in order for them
    to be lifted up, in a sense, the wicked need to be removed from the land. And
    the way you do it in our way is to change the wicked so that they will become
    saints. And you do it through perseverance and prayer and through revival. And
    that’s what God’s plan and program, I think, in this coming year.


    To prepare God’s people for this reigning and ruling or after this period of “confusion,”
    Pat believed we needed to assist in creating a shadow government that would “take
    over” when everything collapsed. I had no idea how such a plan would be implemented,
    but I felt certain it would involve The 700 Club, so I made myself available for
    every meeting and every discussion moving forward. Still, Pat played his cards
    close to the vest. However, I got an indication of how this was unfolding in Pat''s
    mind during our January telethon, when I was shown an advance copy of the March
    issue of the Saturday Evening Post magazine. Pat''s picture was on the cover in
    one of those iconic drawings—that by Lucian Lupininski—that traditionally adorned
    the covers of the Post.


    Next to the picture was the headline, "CBN''s Pat Robertson: White House Next?


    When I questioned him about it in private times back, he told me it was just a
    trial balloon, that a lot of people encouraged him to do so, and that he was "seeking
    God" on whether he should. I expressed to him (for the first time) that such a
    would dramatically impact the ministry and The 700 Club, but he was already aware
    of these things. The article was merely a fleece, of sorts.


    But I knew that this explanation was just a brush-off. Pat was very clear in his
    distrust of George H. W. Bush becoming President Reagan''s replacement in 1980,
    why not Pat himself? Moreover, the editor and publisher of the Saturday Evening
    Post was Dr. Cory Servaas, a regular contributor to The 700 Club. She had a regular
    health and nutrition segment on the program that we tapped, sometimes with Pat,
    during her regular visits to Virginia Beach. I could only wonder how long the
    article had been in the works. Given the planning cycle of magazines and the high-quality
    portrait by Mr. Lupininski, it was very likely in development many months before
    the advance copy had been made available to us. It was not simply a reaction to
    the "message on the mountain" that Pat had related to at the beginning of the
    New Year 1985.


    In fact, Pat had been trying to encourage conservative Christians to get involved
    in the political process since at least 1981, when he formed the Freedom Council,
    a 501(c)(4) tax-exempt organization with the authority to lobby on behalf of political
    candidates. The Freedom Council was a part of the CBN family, and as it received
    attention on The 700 Club and that we used the 501(c)(3) tax-exempt status of
    CBN''s ministries to raise money that went to the Freedom Council, and that was
    the basis of the IRS investigation triggered by George H. W. Bush—during Pat''s
    run for the presidency.


    During 1985 and 1986, according to the New York Times, we gave $250,000 a month
    or more to the Freedom Council “to mobilize Christian voters behind Mr. Robertson’s
    candidacy for the Republican Presidential nomination in 1988.” The total estimate
    reached as high as $8.5 million to the Freedom Council, according to the Times.11


    Despite the fact that CBN reached a “significant” settlement with the IRS in March
    of 1998, the shadow government aspect of Pat’s involvement in politics has been
    entirely overlooked by those who observe culture and write history’s first draft.
    The popularity of Fox News may seem mysterious to some but not to me.


    There were clearly two forces at work at The 700 Club in 1985. One was the mission
    of CBN carried out with passion and skill by the staff and crew of the ministry.
    In all my years in television and television consulting, I have never worked with
    a brighter and more capable group of people than those who worked in Virginia
    Beach. On a level with the very best in the secular television world, regardless
    of how far we tilted in one direction or another. TV is TV, and we made good TV.


    The second force was earlier conservative politics, headed by Pat Robertson himself.
    As mentioned earlier, Pat was a political strategist who happened to be a minister.
    Despite his passion for the gospel and evangelism, at core he was a political
    master with knowledge and ability beyond most. He could extemporaneously and intelligently
    discuss any matter involving any nation in the world. In his head, Pat Robertson
    contained more accessible knowledge than even, I believe, any US secretary of
    state. He studied the world. He was a voracious reader of international news reports.
    He had a strong ability to link foreign governments and to pull that knowledge
    out of his head at a moment’s notice. This was the real Pat Robertson I knew,
    which is why I felt that ministry was more an avocation than his passion. This
    force moved to center in 1984-85.


    This is important for me to state, because those who view Pat Robertson as a cult
    leader or snake oil salesman don''t understand the reality. The 700 Club staff
    and CBN News were filled with smart and intelligent people very capable of thinking
    for ourselves. We all knew what was going on and felt it our duty to onboard the
    revolutionary thinking of our evangelical leader. There is simply no way that
    Pat alone could have accomplished what he did without our ability to think for
    ourselves and to the revolution.

