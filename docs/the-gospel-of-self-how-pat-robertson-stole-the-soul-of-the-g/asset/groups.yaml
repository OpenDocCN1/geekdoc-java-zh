    attempt to satisfy curiosity brought about questions. This is the integral assumption
    upon which journalism is built and the missing element in much of today’s junk.


    Let’s open the New Testament for a moment. The gospel accounts of the story of
    Jesus carry similar story lines, but Luke—a physician who also wrote the book
    of Acts—adds elements that the others don’t. Take a look at how he begins his
    account:


    Most honorable Theophilus: Many people have written accounts about the events
    that took place among us. They used as source material the reports circulating
    among us from the early disciples and other eyewitnesses of what God has done
    in fulfillment of his promises. Having carefully investigated all of these accounts
    from the beginning, I have decided to write a careful summary for you, to reassure
    you of the truth of all you were taught. (Luke 1: 1–4 NLT)


    This is remarkably similar to the origins of “newsletters,” those accounts of
    commerce in distant lands sent back to the merchants who paid for the service.
    A “reporter” studied and investigated and then wrote an account of what he found.
    This was the beginning of journalism, and it forms the core of the trade.


    Napoleon conquered Europe, he wrote, “Four hostile newspapers are more to be feared
    than a thousand bayonets.” Revolutionary War era newspapers, many of which were
    shut down by the British for opposing their views, influenced the writing of the
    First Amendment, so that such opposition would never again be silenced in the
    new world. Facts don’t need constitutional protection, but ideas certainly do.
    Why is the Israeli work so hard to control their narrative, even going to lengths
    to censor YouTube, Facebook, and other forms of horizontal communications over
    what they view as “incitement.”


    The assassination of President Abraham Lincoln provides a useful look into the
    mind of mid-nineteenth century journalism. A New York Herald dispatch from Washington
    regarding the execution of the four who conspired with John Wilkes Booth contained
    the following:


    The execution of his murderers today has proven to be a law-abiding people; otherwise
    the miscreants who plotted and executed their great crime would have long since
    been torn to pieces by the people, who were as much convinced of their guilt before
    after their trial. Everything has been done decently and in order, and the majesty
    of the law and of the nation has been vindicated, and the guiltiest of the witches
    have gone to answer for their crimes at the great tribunal where no subterfuge
    will avail to hide their criminality.


    Not much objectivity there death. One of the four hung was female. The reporter
    justified her death by painting a portrait of a woman devoid of femininity.


    > (Her) gray eyes were cold and lifeless and added to the masculinity of her appearance.
    They were seldom lit up by excitement or pleasure, though occasionally they gleamed
    with a furious or stealthy glare indexed the bad passions of her soul...She appears
    to have been masculine not only in person and manners, but in mind.21


    The point is that the roots of journalism do not include the pristine notion that
    one should (or even) stand off and report facts without opinion or "argument”—to
    use historian Christopher Lasch’s term. "The job of the press is to encourage
    debate," he wrote in The Art of Political Argument for Harper in 1990, "not to
    supply the public with information." He espoused the idea that argument proves
    public understanding and is central to democratic opinion formation. And democratic
    opinion was the issue that split liberal thinkers in the years following World
    War I, when the modern public relations era was born. One group, led by Pragmatic
    philosopher John Dewey, believed that the public could and should participate
    in democracy. Walter Lippmann, the man who would later be called the “Dean of
    American Journalism,” headed the other group and maintained that the public was
    too ignorant to do any more than cast ballots once in a while.


    The idea that the public might intrude into the affairs of “responsible men” was
    repugnant to the cynical Lippmann, who voiced his social engineering vision in
    two important books, Public Opinion (1922) and The Phantom Public (1925):


    A false ideal of democracy can only lead to disillusionment and to medlesome tyranny.
    If democracy cannot direct affairs, then a philosophy which expects it to direct
    them will encourage the people to attempt the impossible; they will fail...The
    public must be put in its place, so that it may exercise its own powers, but no
    less and perhaps even more, so that each of us may live free of the trampling
    and the roar of a bewildered herd.22


    He explored what he saw as the uneducated manipulating the masses through the
    use of symbols and stereotypes and called for an educated elite to run things
    on behalf of everybody. This was born the “professional” journalist, one who was
    free of symbol and stereotype and would assist the other elite institutions in
    leading the country, something Lippmann had already done as an advisor to President
    Woodrow Wilson.


    Dewey, on the other hand, was a firm believer that the open exchange of ideas
    permitted the people to govern themselves:


    The act of voting is in a democratic regime culmination of a continued process
    of open and public communication in which prejudices have the opportunity to erase
    each other; that continued interchange of facts and ideas exposes what is unsound
    and discloses what may make for human well-being...Any fair-minded survey of suppressive
    acts in this country will demonstrate that their ultimate source is always a privileged
    minority (with the majority standing passively by permitting it to occur).23


    The postmodern mind is eerily similar to Dewey’s and immediately repelled by Lippmann’s.
    Postmoderns look around and see ruin where the elites promised prosperity. The
    American Dream lives on only for the few, and the resulting anti-institutional
    energy is fierce and unrelenting. Technology has leveled the knowledge playing
    field and thrust the masses into unfamiliar territory, where the application of
    knowledge used to be reserved only for the few. The bitter animosity expressed
    today between the political right and left overwhelmed social media during the
    2016 presidential campaign. This was a part of what Dewey was addressing, for
    the extremes to cancel out other fact. Facts don''t need helper. That''s reserved
    for opinions, and we all need to come to grips with the notion that the airing
    of these viewpoints is a necessary part of finding agreement. What we have today,
    however, is not what we''ll have tomorrow, for we''ve just begun. This assumes,
    of course, that the net can remain free. We need to teach journalistic responsibility
    and ethics in elementary school, for we are all journalists—observers—in the network.


