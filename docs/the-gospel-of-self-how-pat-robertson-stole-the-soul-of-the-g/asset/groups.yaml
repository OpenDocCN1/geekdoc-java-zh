    # One


    # The Seeds of Modern Discontent


    > The modern conservative is engaged in one of man’s oldest exercises in moral
    philosophy; that is, the search for a superior moral justification for selfishness.

    —John Kenneth Galbraith


    The evangelist’s message has always been self-centered, for it preaches the gospel
    as a means to saving one’s own ass from eternal hellfire and damnation. Evangelical
    Christianity has refined the message over the years and turned it today the means
    for blessings in this life as well. What was once a powerful motivator for overall
    good behavior in the community has become a motivator for obtaining a better position
    in life, and it has profoundly altered everything in our society from our politics
    to our treatment of our neighbors. I helped bring this about, for I worked alongside
    one of the most influential evangelists of modern history.


    Marion Gordon “Pat” Robertson is a political animal that happens to be a Christian
    evangelist, broadcaster, and television personality. Political smarts flow through
    his veins as surely as the blood that sustains his body. He was born and raised
    in the midst of a powerful Virginia political family. His father, Absalom Wallis
    Robertson, was a conservative Democrat—a Democrat of the Senator Robert Byrd ilk—serving
    in both the House and the Senate, and Pat was groomed to follow in his footsteps,
    attending the prestigious McDonogh Preparatory School before Washington and Lee
    University and eventually Yale Law School. He also served a stint in the Marine
    Corps as a first lieutenant.


    Pat Robertson never passed the bar exam, but instead had a religious conversion.
    He went to New York Theological Seminary, receiving a Masters in Divinity in 1959.
    A year later he established the Christian Broadcasting Network (CBN) in Portsmouth,
    Virginia. He has built a massive television empire and is one of the most controversial
    Evangelical Christians on TV, where he practices the charismatic “gifts of the
    spirit,” including speaking in tongues and signs and wonders such as “healing.”
    But the political animal continued to seek the surface throughout his television
    ministry, and this would play a huge role in my own life and in the political
    dynamics of the Republican Party, one that continues to this day.


    When I worked with him in the 1980s, we practiced and promoted a brand of Charismatic
    Christianity that was seen as a breath of fresh air to a faith that had grown
    stable in every aspect, from its music to its preaching, and we worked long, hard
    hours to move hearts and souls in the way we felt right.

