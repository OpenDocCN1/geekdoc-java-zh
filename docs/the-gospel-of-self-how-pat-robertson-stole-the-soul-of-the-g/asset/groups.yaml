    The January 1, 1985 program had been taped, so that CBN could have its annual
    New Year’s Day prayer meeting. Pat spoke more about the vision there and, after
    the gathering, summoned a few of us to the conference room upstairs. The beautiful,
    wood-paneled room with an original old painting of George Washington on the wall,
    was usually either empty or full, this time only four of us took seats near the
    head of the table. The atmosphere was somber but pleasant, although the air was
    thick with anticipation. It was unusual for Pat to gather key executives after
    a prayer meeting, and I was excited to hear what he had to say to us. Present,
    I recall, was Bob Slos, Michael Little, and myself. After pleasantries were exchanged,
    we all sat silent for a few seconds before Pat began.


    He repeated what we heard at the prayer meeting, that 1985 was a bumpy road for
    the world but a year of tremendous blessing for “the church.” Then, as I recall,
    his words drifted to higher thoughts:


    “We must form a shadow government,” he began. “We must begin to find and train
    Christian people, so that they can be placed in every position that matters, because
    the country is on verge of collapse. The Lord is showing me that when it comes
    to, nobody is going to know what to do, and they will turn to us, because we will
    have answers. We won’t be afraid. We’ve got to work to make sure God’s people
    are in the schools, the school boards, the city councils, the county commissions,
    the trash collectors, the tax collectors and all local government positions. We
    need to be in the state legislatures, the statewide offices, Congress, the courts,
    everywhere. We can’t be over and obvious about this; we must do quietly and create
    this shadow government."


    He did say exactly how we were to do this, and I don’t think anyone present had
    a real inkling at that point how far downstream was projecting this vision. Here
    is Pat on The 700 Club week later:


    (The upcoming year is going to be kind of a bumpy road full of potholes and trouble.
    But it isn’t necessarily going to be that you can’t get from point A to point
    B. It’s not going to be some cataclysm. But there’s not going to be anybody, the
