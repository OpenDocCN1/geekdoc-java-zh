    the suggestion that we had a hotline to God was also helpful in the extreme when
    it came to fundraising or offering Pat’s political views, for who could argue
    with somebody capable of bringing miracles like that? These prayers were, however,
    a somewhat divisive segment of the program, for so-called “words of knowledge”
    are a controversial theological concept within denominational Christianity.


    Moreover, the relentless emphasis on a God that was “always” healing had a very
    dark downside, and that with viewers who were never healed and had no explanation.
    I got a letter late in my first season with the ministry, and it was one of the
    factors in my decision to leave in 1986 as Pat was beginning his run for president.
