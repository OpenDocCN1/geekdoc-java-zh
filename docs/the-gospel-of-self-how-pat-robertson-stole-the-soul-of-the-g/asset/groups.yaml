  mdcn: '

    不幸的是，有人必须承担领导者的意愿和需求，并将这些“方木”强行塞进CBN管理的“圆孔”。


    在我回来后，这种冲突随着时间的推移而日益恶化，一个很大原因是，在奥拉·罗伯茨（Oral Roberts）在1987年1月的一次电视筹款活动中宣布，除非他在接下来的几个月内筹集到800万美元，否则上帝将“带他回家”（这是基督教人对结束生命的委婉说法）之后，捐款量断崖式下跌。这一荒谬且自我为中心的言论为图尔萨的记者提供了所需的武器，让他们打开了“信仰治疗者”事工的大门，报道很快蔓延到全国乃至海外。


    几乎在同一时间，吉姆·巴克（Jim Bakker）在北卡罗来纳州夏洛特的PTL（赞美主）跌落神坛。他与杰西卡·哈恩（Jessica Hahn）的信任丑闻以及随后的掩盖打破了媒体界对电视传教士长期积压的不信任，随之而来的是他们用一笔大画描绘每一个电视事部，包括现在白宫那个家伙创立的事工。巴克克的丑闻发生在1987年3月19日，就在我回到CBN的几周前。丑陋的聚光灯落在每个人身上，辛克莱尔·刘易笔下的埃默·甘特（Elmer
    Gantry）的幽灵访问了社会的各个层面，包括我们从20世纪80年代初以来努力招募的人。无法形容这些事件对基督教事工的影响有多严重，特别是对电视上的福音徒，包括帕特·罗伯森（Pat
    Robertson）的事工。


    结果是，我在4月初回来，面对的是一次裁员，这最终导致超过500人失去工作，其中包括我的43名员工。管理层决定调整薪资和人员配置，以确保新捐款水平的永久性，而不是在认为“钱会回来”的信念中硬挺过风暴。这一决定很难被反驳，尽管它几乎没有反映出对他们管理能力之外的任何信仰。我想今天我说这些话倒容易，但那些日子笼罩在事工之上的恐惧氛围影响了校园的每一个角落。观察到一群声称对全能上帝有信仰和信任的人在危机中屈服于恐惧，令人震惊。


    在裁员后的媒体报道中，帕特·罗伯森将责任归咎于吉姆·巴克和奥拉·罗伯茨。以下是《费城询问者报》的一篇文章：


    “我们可能拥有福音世界最出色的预测和预算流程，但预测原子弹爆炸是不可能的，”罗伯森在他的电视节目《700人俱乐部》（The 700 Club）中说道。“我们与这一切毫无关系。”


    他说，PTL丑闻和奥拉·罗伯茨牧师对资金的“生死攸关”的呼求目前已让罗伯森的基督教广播网络损失了1200万美元的捐款，可能到年底前将会耗尽2800万美元。


    “在美国基督教的历史中，我们从未见过这样的事，”罗伯森说，他正在考虑竞选共和党总统提名。“那场丑闻像重磅炸弹一样击中了福音世界。”


    该事工的这种商业化行动使作为帕特·罗伯森执行制片人的我面临了巨大的问题，因为实际上，我几乎没有我在与帕特那顿午饭时所被承诺的权力。尽管所有关于“信仰”的言论，我们在危机时刻表现出了相反的一面，我不认为这符合我们作为事工、感召的形象，也不符合我们作为那些“洞察时势的人”的形象。我们是伪君君子，而这才刚刚开始。


    帕特·罗伯森是否受感召去竞选“上帝的”总统？证据表明并非如此，但尚未全部收集。历史将给出定论。对我来说，更重要的问题是这个人的事工是否在这一感召的背后。行为总是胜过对信仰的宣告，而在帕特实际参选后，执行团队和董事会的行为完全与我们所宣称的使命、教义和事工不符。


    正如我们在匿名戒酒会（Alcoholics Anonymous）所说和相信的那样，“上帝要么是一切，否则他什么都不是，上帝要么是，要么不是。我们的选择是什么？”CBN做出了决定，信徒们别无选择跟随。


    这确实没有让我的归来之路变得更容易，因为到那时我已经成为这艘明显正在沉没的船的主人了。我被困住了。我知道。除了祈求指引并全身心投入眼下的任务，我别无可为。


    公众聚光灯落在每一个事工身上，私语和恐惧以极其不健康的方式覆盖了CBN校园。我回来后发生的事件之一是某些捐赠者以及后的经理对共同主持人丹努塔·索德尔曼（Danuta
    Soderman）的丈夫凯·索德尔曼（Kai Soderman）的行为表示担忧。我被告知他涉用自己的大资金开发项目接触大捐赠者，这对于那些监督CBN筹款的人来说绝对不可接受。这对丹努塔产生了负面影响，她当时正面临内心的危机。她在书中《雕刻：身份、虚伪与神圣葡萄酒的回忆》（Chiseled:
    A Memoir of Identity, Duplicity, and Divine Wine）中这样描述：


    “在帕特竞选期间我们需要休息。我觉得自己毫无用处，只是一个根据罗伯森随心所欲在最后时刻拼凑出来的政治节目上的道具。几个月来，帕特忽视节目制片人的准备，在最后时刻冲进演播室，用三十分钟的疯狂演讲说教观众，而我和本坐在那里点头微笑，努力假装感兴趣。”


    当我表达我的担忧时，特里理解了。“我知道这很沮丧，丹努塔。我是那个辗转反侧睡觉的人。我们需要找到一条路。”


    （注：原文此处存在大量重复段落，已按要求不重复输出翻译）

