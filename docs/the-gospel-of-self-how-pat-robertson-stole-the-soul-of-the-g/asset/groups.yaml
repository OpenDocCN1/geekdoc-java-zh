  mdcn: '

    因此，我郑重地拒绝了你的提议并提交辞职，自1988年4月8日起。对于这些事件，我对你（或 CBN 的其他任何人）没有任何敌意，并期待我们永恒的友谊。


    就这样结束了，这给我留下了一个无法回答的问题：我选择提前一年回来是否是一个错误。为了搬回弗吉尼亚海滩，我损失了超过70,000美元，而且在我尝试帮助 Pat
    的几乎每一个日子里，整个经历带来的痛苦都是巨大的、压倒性的。在一年年前做过种种承诺后，最终被他开除，这真的很难以接受。此外，还有关于是否错过了上帝的呼召的问题。这一切都太沉重了，我开始大量饮酒，这深刻地改变了我与我爱的上帝之间的关系。


    我获得了一份非常优厚的遣散方案，其中包括三个月涵盖我基本工资的支票。无论出于什么原因，他们给了我四张支票，当我后来收到 Tim 的封信承认这一错误并要求我寄回时，我拒绝了。在我看来，这是对我痛苦和遭受的补偿，我的心也变硬了。


    经过多年的反省，我对我们在20世纪80年代那几年所做的事情进行了大量的思考。我们实际上重新定义了保守派共和党人的含义，这绝非一项小事。我们通过引入数百万基督徒（他们能够完全忽视共和党人代表富人阶层这一现实），改变了共和党的权力平衡。这是一项了不起的成就，但也让我们的文化陷入了非常糟糕的境地，因为基要主义基督徒是唐纳德·特朗普当选的关键因素。Pat
    在他的《计划》（The Plan）书中提到了这一运动，今天当我审视这个愤怒暴民所造成的文化破坏时，我不禁脊背发凉。


    我参选的原因是否是因为让成千上万福音派基督徒进入政府而实现的？这场运动教会了他们，他们也是公民，表达自己信仰的权利与那些在政府各个层级不断发声支持自身激进议程的狂热活动分子一样平等。在近现代历史上，第一次，爱国、重视家庭的基督徒学会了有效的政党组织和成功竞选的简单技巧。


    明确一点，做此的不是 Pat 的竞选活动，而是《700俱乐部》电视节目。在拉什·林博（Rush Limbaugh）之前，有帕特·罗伯森（Pat Robertson）。


    虽然我们信息针对的许多年轻且聪明的群体已经离开了，但留下的人接受了他们教给的一切切，他们相信耶稣过去现在都为他们的成就感到自豪，这使得无法与他们讲道理。然而，他们经常投票违背自己的最佳利益，因为作为大多来自南方的贫穷人，他们每时候都需要帮助。但他们并不是那样看的，相反他们认为自己是慈善的施予者，而不是无法准确说明如何施予的人。也许是嫉妒或仅仅是自私的思维迫使他们与现代的法利赛人站在一起，而事实上，他们更多是贫困者的一部分。这更多是重复过去及现在那些电视福音派人士告诉他们的话，由像帕特·罗伯森、我、CBN
    事部这样的人领导的，以及一种迎合追随者自我中心式欲望和需求的福音——即自我的福音。


    ## 六


    ## 美国国税局（IRS）对阵帕特·罗伯森，1988年


    > 唯一令我害怕的两件事是上帝和国税局。

    > — 爷爷博士（Dr. Dre）


    像美国国税局和联邦选举委员会这样的联邦机构，对帕特·罗伯森竞选美国总统非常感兴趣，大部分兴趣涉及金钱。CBN 是一个免税的事工机构，就像任何教会一样。例如，在国税局更改规则之前，我们不需要缴纳社会安全税，因此帕特通过富达投资公司（Fidelity
    Investments）为每位员工创建了个人退休账户。事工部门缴纳其社会安全份额，而我们的薪水按照与社会安全税相同的水平被“征税”。巨大的区别在于，这些钱进入了个人计息账户，我们可以在退休时可以提取。我的账户里的金额虽然在短短几年内产生，但已经是五万位美元的中位数。


    然而，当一个领导公职事工机构的人竞选公职时，这种免税资格会受到严密审查，有两个联邦机构对此密切关注。其一，当然是国税局。另一个是联邦选举委员会。必须有人提出投诉、指令或其他通知，指出某些事情不对，以便启动昂贵的调查，而在华盛顿的官僚机构中，这种要求往往是出于政治考虑的。帕特正在竞选总统，这也是副总统乔治·H·W·布什正在寻求的职位。不需要天才也能创造性地探索其中涉及的政治，虽然我无法证明任何事，但我圈子里的流行观点是布什先生启动了这一切。


    布什副总统有手段、动机和机会像一根长钉一样刺穿罗伯森竞选计划的心脏；虽然我承认我们在过程中违反了税法，并推之也违反了联邦选举委员会的规则，但这些调查的时机只对布什先生有利。关于是否曾经进行过针对“非现任副总统候选人”的调查，这是一个无法公正回答的问题。最重要的是时机。无论如何，这些调查的压力影响了
    CBN 的日常生活，因为我们被迫将每一项决定都置于对免税地位威胁的显微镜下。我们只能采取防御，我们进攻努力的帆已经失去了风力。


    1988年8月，帕特·罗伯森在纽奥尔良超级穹顶体育（Superdome）举行的共和党全国大会上登了台。帕特正在竞选总统，这也是副总统乔治·H·W·布什正在寻求的职位。不需要天才也能创造性地探索其中涉及的政治，虽然我无法证明任何事，但我圈子里的流行观点是布什先生启动了这一切。


