  - '[PAGE 100]


    In my dealings with everyone, I had no choice but to let my actions reflect a
    belief that Pat would win the election. Not only was I a leader at CBN, but in
    many ways, I was Pat’s right-hand man as it pertained to the primary instrument
    of CBN, **The 700 Club**. I would not have come back in 1987 had I not believed
    in what we were doing. Every decision I made carried as a core justification,
    and it didn’t matter if I eventually proved right or wrong. The issue was what
    to do today, and that meant becoming a rower in Pat’s boat. To live in the future,
    especially one governed by fear was not the right choice for anyone in my position.


    I often led worship at prayer meetings with the ministry. In the last prayer meeting
    before Pat began an extended period of campaigning, I played “Hail to the Chief”
    on my guitar as he left the room with a thousand people silent. It got his attention,
    and he smiled. It was my way of wishing him Godspeed on the journey.


    We soldiered in Pat’s absence, occasionally using pre-taped segments of “Pat’s
    Perspective” to fill the gap, but things outside our control the task of delivering
    a television program without Pat Robertson difficult, at least.


    On many occasions, I was able to convince Charles Colson, one of the Watergate
    co-conspirators and subsequent founder of Prison Fellowship, to either co-host
    the program in Pat’s absence or tape segments we could use later. Chuck became
    a dear friend, and the work we did together on *The 700 Club* was some of my best.
    I was a supporter of Pat’s efforts and brought a similar, authoritative and conservative
    view of public policy and analysis of current events. He was philosophically a
    pragmatist and didn’t believe in the charismata or “gifts” of the Holy Spirit
    in the practice of Christianity and especially at CBN. He was a highly intelligent
    observer of current events, however, and quite comfortable in Pat’s chair. He
    could easily handle the “father figure” role necessary in the on-air chemistry
    of the program.


    He once told me of being approached by Dallas Robert Tilton in Texas and advised
    to “embrace” speaking in tongues and proclaiming the gifts of the spirit. Tilton’s
    reasoning? “That’s where the money is.” Colson smiled when he told me that, and
    I knew what he meant. Money was the curse of televangelism in the 1980s, and Chuck
    Colson wanted nothing to do with it.'
  - '[PAGE 101]


    In one of his letters to me many years later, he wrote, “You should know that
    after you left CBN, I was never invited back again.” He always thanked me for
    the opportunities he was given to be of service, and it''s a shame he was never
    considered good enough to bring on as a replacement in Pat''s absence.


    By January of 1988, the ministry of CBN was in deep trouble financially. CBN was
    the home of gifted marketers and fundraising development specialists who lived
    and died by statistics, and the stats by that time were dreadful, especially those
    showing direct ministry between CBN telephone counselors and callers. We measured
    everything from salvation prayers to ministering to people contemplating suicide.
    Comparing ministry stats from January of 1988 with January of 1987 was revealing:


    | Specific Ministry | 1987 | 1988 | % Variation |

    |---|---|---|--|

    | Calls | 685,724 | 346,088 | -49 |

    | Salvations | 34,130 | 17,850 | -47 |

    | Prayer Requests | 396,176 | 243,777 | -38 |

    | Answers to Prayer | 9,763 | 4,901 | -49 |

    | Holy Spirit Bits | 10,672 | 9,031 | -15 |

    | Family Counsel | 114,902 | 81,496 | -29 |

    | Drugs | 12,152 | 8,479 | -30 |

    | Alcohol | 15,525 | 7,753 | -50 |

    | Sexual Deviates | 6,122 | 3,482 | -43 |

    | Suicides | 1,331 | 908 | -31 |


    This drop of nearly half was primarily the result of the evangelist scandals,
    and the media suggested that Pat Robertson''s campaign for president was in the
    same category. It placed the entire ministry in jeopardy and was impossible to
    overcome given the circumstances.


    Nevertheless, I tried. We held a planning retreat at The Homestead in Hot Springs
    and numerous internal meetings, research, and trials. I brought in the top TV
    consulting company Audience Research & Development (AR&D), from my background
    in the news business, which I later learned didn''t sit well with some. Ben and
    Susan were still onboard, to which I'
  - '[PAGE 102]


    wanted to add Chuck Colson. That was rejected, and so I turned to two people already
    at the ministry, Scott Ross, a minister to the music industry with the ability
    to recruit a younger audience, and Bob Slosser, a long-time ministry leader as
    CEO, president of Regent University, senior editor of CBN News, and a former New
    Times assistant editor. While spoken, Bob had the credentials and the chops to
    function as commentator on current events. It had seemed to me that this team—with
    the proper support—could carry on with the ministry and mission of The 700 Club
    until Pat''s campaign was over, whether he won or not.


    This was not the case, however, and the event that led up to the final decision
    about who would host The 700 Club was one of the ugliest and most personally devastating
    experiences of my life.


    The date was January 31, 1988, the final Sunday of the CBN telethon were a lot
    of work, and this was no exception. We went in both the morning and the evening
    for two straight weeks. The money raised in January in the form of memberships
    and gifts was a significant part of the annual budget for the ministry. Telethons
    were so important, and Pat was often tense off the air as he was confident and
    energetic on the air. He could bite like few people I''ve ever known, and the
    demand for excellence was never higher. For my staff and myself it was a grueling
    time of long hours in a tense and stressful atmosphere. Of course, all was forgiven
    when we were done, because the telethons were usually successful.


    But this was January of 1988, the need to raise money was even greater than it
    had been in past years.


    One of the rules we had that all employees were required to work the phones at
    least once during telethons. I usually waited until the last day, and this was
    no exception. Working the phones during a Christian fundraising event was not
    easy. The volume of crank, obnoxious, and vulgar calls that are placed to a toll-free
    number in such occurrences were truly staggering, so it was necessary when working
    the phones to prepare. This meant quiet time and prayer. I was a reserved seat
    in the front of the caller platform, from where I often comment on the air about
    how things were going on the phones, for the next many hours.


    I arrived on the campus several hours ahead to check in with staff preparations,
    after which I went directly to the prayer room above'
  - '[PAGE 103]


    the chapel near the entrance to the broadcast building. This was a remarkable,
    circular room, with a sweet spiritual presence throughout. It wasn’t so much cloying,
    as it was a tangible sign of encouragement, because it felt right. People prayed
    out loud and silently, but the energy in the room was thick, uplifting, and actually
    quite powerful. I was on my knees and prone on the floor for about two hours,
    and then I headed for the studio. I was prepared for anything, or so I thought.


    I took my seat, moments before the program went on the air, Dede Robertson, Pat’s
    wife, walking down the stairs in my direction. Dede was always cold and distant
    to me, whether she was entertaining at the private Christmas party at her home,
    helping out at the retreat house in Hot Springs, or on visits to the program.
    I treated me like one of the help, in the same way that you might imagine a Southern
    plantation “ma’am” treating me here.


    And here she was at the very beginning of my long shift on the phones heading
    in my direction. came to me and addressed me in front of everyone.


    “How dare you?” she demanded. “How dare you bring in people from Dallas, of all
    places, to try and tell my girls how to do hair and make-up? How dare you!”


    The look on her face would have frozen a raging inferno if it hadn’t been for
    the steam rising from her head. I had never seen her so angry, and so she was
    enraged. Her wrath was directed at me for bringing in consultants from AR&D in
    Dallas to advise us on everything. Obviously, “her girls”—the hair and makeup
    staff of CBN and The 700 Club—had complained to Mrs. Robertson while dolling her
    up for the telephone, and she wanted to demonstrate her disapproval in such a
    way as to communicate clearly.


    Before I could respond, my telephone rang. It was somebody telling me to “go fuck
    myself,” and so it went for the entire program. All of my preparation had ruined,
    and I sat there helpless as the hours ticked by. It was about to get worse.


    When the show finally ended, we were all exhausted and stressed, even though the
    work was over. Pat, however, one more subject that he wanted to address with a
    few others and me: what would we do beginning the next day when he wasn’t going
    to be there? I recall Ben being present, along with Michael Little, Tim Robertson,
    Bob Slosser, Scott Ross, and'
- md: '

    perhaps a few others. Susan Howard had left, so it was entirely a meeting of men.


    I felt disapproval even before it was announced, and even more so after I shared,
    once again, my plans for the coming week and beyond.


    Pat Robertson could handle just about anything when it came to television, but
    he was adamant that he would not allow others to potentially raise their own ministry
    money. This was the issue that was behind the split between Pat and Jim and Tammy
    Bakker in the early 1970s. The Bakers had helped him build CBN and The 700 Club,
    but then wanted to be able to raise their own ministry on the CBN network. Pat
    refused. There followed a mysterious fire in the studio that housed the Bakers''
    set, and Jim and Tammy moved from Portsmouth, Virginia, to California in furtherance
    of their own ministry.


    Pat was agitated and irritated in the meeting following the telethon, and after
    rejecting every word that came out of my mouth, he turned to his son and said,
    "Tim, you''re going to have to do this"


    Tim Robertson was more like his mother than his father. He was brilliant and a
    gifted business administrator, but he had very little charisma, no desire to be
    public, and no experience on television. His face red, he objected, saying it
    would be terrible for the ministry if he were to try and replace his father for
    The 700 Club.


    Pat would have none of it and said, "Tim, you can do it. I need you to do it.
    Terry and the staff will help you. It''ll be right"


    But everyone in the room knew it wouldn''t, and despite my protests, nobody stood
    up and argued with Pat Robertson. His issue was money. He didn''t want anyone
    whose name wasn''t Robertson at the helm of things on the air. His oldest son,
    Gordon, was a chip off the old block in terms of char, and charisma, wanted nothing
    to do with the ministry, although that would change many years later.


    And that was it. I suppose I had seen it coming, but I didn''t—nor did anybody
    else. It was what it was going to be, and I had no choice but to swallow hard
    and move on. But my heart was never in it that day. Tim was beyond awful in those
    first few appearances, and it looked for every reason to be exactly what it was,
    a father handing off his ministry to his son, regardless of the outcome. I was
    beaten down miserable, and I should have taken responsibility for my life and
    career resigned then, then I didn''t because I had a family to support, and I
    needed time to think. I put on a soldier''s face and did the best I could with
    what I had. It would never be enough.


    Pat made an appearance every now and then, including on February 9, 1988, the
    day after he finished ahead of Bush in the Iowa caucus. I had watched network
    coverage the night before Pat got into an on-air confrontation with Tom Brokaw
    of NBC, who kept referring to him as a televangelist. Pat rightly felt that this
    was deliberately pejorative, and he went after Brokaw. It wasn''t terribly smart,
    because a candidate will never win against a network anchor.


    In the dressing room that morning, I told him I thought he had made a mistake.
    In my years with Pat, he''d always appreciated my opinion, whether he agreed with
    it or not. I just liked the idea that I had the strength to tell him what I thought.
    This time, however, he got angry.


    We went back and forth for a while, naturally, I lost the argument. Pat''s ability
    to bring out a metaphor at a moment''s notice was one of his true gifts, but it
    didn''t feel very good that morning.


    We tried many combinations of hosts with and without Tim in the weeks that followed.
    Susan Howard went back to California, and it was hard to blame her. She had given
    us six months, and that was more enough in me, especially given the turbulent
    nature of things behind the scenes and on the air.


    Kathy Bullock and Cindy Glaser filled in for her as we opened yet another search
    for a female co-host. We built a new set—one that the local paper said matched
    Miami Vice colors, even though that was never our intention. We wanted contemporary,
    and pastels were the big thing, whether spawned by Miami Vice or not.


    Pat had given us instructions that included this Bible verse:


    No one puts a patch from a new garment and sews it on an old one. If he does,
    he will have torn the new garment, and the patch from the new will not match the
    old. And no one pours new wine into old wineskins. If he does, the new wine will
    burst the skins, the wine will run out and the wineskins will be ruined. No, new
    wine must be poured into new wineskins. And no one after drinking old wine wants
    the new, for he says, “the old is better.” (Luke 5:36-39)


    I was all for new wine, but I had never planned that the program would completely
    lose its identity in the process. Ben Kinchlow announced his departure, as things
    at the ministry worsened. I could hardly blame him. Ben had been second chair
    on the program for many years, and he was passed over in the name of keeping a
    Robertson at the helm. I was powerless to stop the slide. The CBN board met the
    week of March 14, consolidated power with Tim, announced a major restructuring
    under Tim, and terminated my employment as executive producer of The 700 Club.


    A report in the Virginian Pilot newspaper on March 18 noted the restructuring:


    Jump-start CBN’s flagship show, The 700 Club, the seven-member board also ordered
    CBN to launch a nationwide search for on-air talent and a better format. The board
    felt 700 Club needed to be more compelling," Benton Miller said. "Don''t give
    junk,"


