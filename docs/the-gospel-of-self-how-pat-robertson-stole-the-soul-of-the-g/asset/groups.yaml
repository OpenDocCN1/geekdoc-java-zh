    You can see this in newspapers’ early pushback against blogging. We were told
    that bloggers have agendas, whereas journalists give us objective information.
    Of course, if you don’t think objectivity is possible, then you think that the
    claim of objectivity is actually hiding the biases that inevitably are there.
    That’s what I meant when, during a bloggers press conference at the 2004 Democratic
    National Convention, I asked Pulitzer-prize winning journalist Walter Mears whom
    he was supporting for present. He replied (Paraphrasing!), “If I tell you, how
    can you trust what I write?” to which I replied that if he doesn’t tell us, can
    we trust what he blogs?


    So, that’s sense in which transparency is the new objectivity. What we used to
    believe now believe because we thought the author was objective because we can
    see through the author’s writings to the sources and values that brought her to
    that position. Transparency gives the reader information by which she can undo
    some of the unintended effects of the ever-present biases. Transparency brings
    us to reliability the way objectivity used to. This change is epochal.


    Objectivity used to be presented as a stopping point for belief: If the source
    is objective and well-informed, you have sufficient reason to believe. The objectivity
    of the reporter is a stopping point for reader’s inquiry. That was part of high-end
    newspapers’ claimed value: You can’t believe what you read in a slanted tabloid,
    but your news is objective, so your inquiry come to rest here. Credentialing systems
    have the same basic rhythm: You can stop your quest once you come to a credentialed
    authority who says, “I got this. You can believe it.\” End of story.


    We thought that was how knowledge works, but it turns out that it’s really just
    how paper works. Transparency prospers in a linked medium, for you can literally
    see the connections between the final draft’s claims and what it informed. Paper,
    on the other hand, sucks at links. You can look up the footnote, but that’s an
    expensive, time-consuming activity more likely to result in failure than success.
    So, during the Age of Paper, we got used to the idea'
- md: '

    that authority comes in the form of a stop sign: You''ve reached a source whose
    reliability requires no further inquiry.


    In the Age of Links, we still use credentials and rely on authorities. Those are
    indispensable ways of scaling knowledge, that is, letting us know more than any
    one of us could authenticate on our own. But, increasingly, credentials and authority
    work best for vouchsafing commoditized knowledge, the stuff that''s settled and
    not worth arguing about. At the edges of knowledge—in the analysis and contextualization
    that nowadays tell us is their real value—we want, need, can have and expect transparency.
    Transparency puts within the report itself a way for us to see what assumptions
    and values have shaped it, and let us see the arguments that the report resolved
    one and not another. Transparency—the embedded ability to see through the published
    draft—often gives us more reason to believe that the claim of objectivity is dead.


    In fact, transparency subsumes objectivity. Anyone who claims objectivity should
    be willing to back that assertion by letting us look at sources, disagreements,
    and the personal assumptions and values supposedly bracketed out of the report.


    Objectivity without transparency increasingly will look like arrogance. And then
    foolishness. Why should we trust one person—with the best of intentions—insists
    is true when we instead could have a web of evidence, ideas, and argument?


    In short: Objectivity is a trust mechanism you rely on when your medium can''t
    do links.


    Walter Lippmann''s vision of professional journalism was cynical and self-serving.
    In order to sell space in the paper to advertisers (and become very much the wealthy
    elitists that Lippmann so admired), the content had to be presented in as sterile
    a manner as possible. Hence, the concept of objectivity was born and eventually
    the hallmark of journalism across the industry.


    In the mid twentieth century, two events occurred during the presidency of Richard
    Nixon that altered the very notion of what it meant to be a journalist. On November
    13, 1969, Vice President Spiro Agnew addressed Republicans in Des Moines, Iowa,
    taking on the press, especially television news. Known as Nixon’s “hatchet man,”
    Agnew had a history of making highly controversial public remarks, and his “law
    and order” approach helped soothe an electorate frightened by disruptive events
    at the Democratic National Convention in Chicago in 1968. In this speech, he assigned
    power and influence to television news in such a way that it fueled the imaginations
    of every would-be reporter throughout the land.


    Tonight I want to discuss the importance of the television medium to the American
    people. No nation depends more on the intelligent judgment of its citizens. And
    no medium has a more profound influence over public opinion. Nowhere in our system
    are there fewer checks on such vast power. So nowhere should there be more conscientious
    responsibility exercised by the news media. The question is, Are we demanding
    enough of our television presentations? Are we the men of this medium demanding
    enough of themselves?


    Agnew went on to discuss an important speech by Nixon on the Vietnam War that
    he felt was rejected by the television commentators who presented the speech on
    their networks.


    "Every American has a right to disagree with the President of the United States
    and to express publicly that disagreement. The president of the United States
    has a right to communicate directly with the people who elected him, and the people
    of this country have the right to make up their own minds and form their own opinions
    about a presidential address without having the president’s words and thoughts
    characterized through the prejudices of hostile critics before they even be digested."


    He spoke of the reach of the networks and provided statistics that led to his
    conclusion that unchecked power in the hands of so few was dangerous for the country.


    For millions of Americans the network reporter who covers a continuing issue,
    like ABM or civil rights, becomes, in effect, the presiding judge in a national
    trial by jury.


    ...A raised eyebrow, an inflection of the voice, a caustic remark dropped in the
    middle of a broadcast can raise doubts in a million minds about the veracity of
    a public official or the wisdom of a Government policy.


    ...it represents a concentration of power over American public opinion unknown
    in history.


    This speech did nothing to the truth of Agnew’s claims; it actually made things
    worse, for now the public, including its journalists, had a new vision about the
    calling of the press—to be power brokers alongside those elites they were assigned
    to cover.


    This led directly to the second event that altered what it meant to be a journalist
    in America—the Watergate scandal—and the efforts of two Washington Post reporters,
    Bob Woodward and Carl Bernstein. It turned out that the “hero” of the whole mess
    was a disgruntled, high-ranking FBI executive that fed information to Woodward
    and Bernstein, but that didn’t stop the glorification of the reporting process
    that took down a US president.


    The public was curious about Watergate, but a press was in love with the story
    overwhelmed that curiosity. It remains the biggest “gotcha” story in the history
    of journalism, and it single-handedly turned reporting into a career of celebrity
    and glory. As Wikipedia tells it in an article about Woodward and Bernstein, “Their
    book about the scandal, All the President’s Men, became a Number bestseller and
    was later turned into a movie. The 1976 film, starring Robert Redford as Woodward
    and Dustin Hoffman as Bernstein, transformed the reporters into celebrities and
    inspired a wave of interest in investigative journalism."


    I watched this played out over the next few decades from my position as an interested
    participant and observer. It was rampant in the hearts and minds of people who
    interviewed for news jobs at the many television stations where I worked as a
    news executive. It was the very pinnacle of the dream of modernity, to walk among
    the haves on the job and often socially. Television, especially, became the easiest
    path to celebrity in the guise of the public interest. Walter Lippmann’s “professionalism”
    was revealed for what it actually was, a way to manipulate and be manipulated
    through one’s ego. Eventually, those same public figures learned how to play the
    game and take advantage of this self-interest to manipulate the process of news.
    I have, for example, an animals rights magazine that contains an article outlining—point
    by point—how to successfully approach and manipulate a local station for news.


    All of the things the press obscures in the gathering and reporting of news, this
    career self-interest bothers me most. Many, if not most, of the reporting staff
    at any local news operation doesn’t really want to be there. Each TV station was
    viewed as a stepping-stone to a bigger market, and so many enter through the front
    door with one foot out the back. Their work in the smaller market includes the
    strong motivation to do highly flamboyant pieces for their résumé tape that will
    quickly grab the attention of a “more important” news director elsewhere. It is
    why the farm system for local news is corrupt. The business is almost entirely
    self-centered and self-driven.


    This is yet another reason why transparency is the new objectivity, because the
    public is increasingly onto this fact. As David Weinberg wrote objectivity without
    transparency increasingly will look like arrogance. And then foolishness.


    In the future, journalism will select verticals of interest, which will make transparency
    much easier to show. We will also see the subjects of verticals increasingly transparent,
    because they’ll be rejected as advertising otherwise. This all seems remarkably
    chaotic to those accustomed to modernity’s equilibrium, but we’ll learn and adapt,
    because we won’t have any choice. Frankly, I’d prefer a little chaos to the nonsense
    that continues to pass itself off as objective news.


    There’s much being written today about the Internet as an echo chamber in which
    people simply choose to entertain only those thoughts that conform to their existing
    thinking. This fear assumes that this can never never change, but the very structure
    of the Web cannot tolerate black and white for long. Search and the ever present
