    no longer the case...

    There’s a simple, economic explanation for this shift: If you’re a hoaxer, it’s
    more profitable. Since early 2014, a series of Internet entrepreneurs have realized
    that not much traffic as effectively as stories that vindicate and/or inflame
    the biases of their readers. Where many once wrote death hoaxes or “satires,”
    they now run entire, successful websites that do nothing but troll minorities
    or exploit gross stereotypes. Paul Horner, the proprietor of Nbc.com.com and a
    string of other very profitable fakenews, told me he specifically tries to invent
    stories that will provoke strong reactions in middle-aged conservatives. They
    share a lot on Facebook, he explained; they’re the ideal audience...


    ...Needless to say, there are also more complicated, noneconom reasons for the
    change on the Internet hoax beat. For evidence, just look at some of the viral
    stories we’ve debunked in recent weeks: American Muslims rallying for ISIS, for
    instance, or Syrians invading New Orleans. Those items didn’t even come from outright
    fake-news stories: They originated from partisan bloggers who know how easy it
    is to profit fear-mongering.


    Frankly, this column wasn’t designed to address the current environment. 33


    Dewey on the say that it feels “a little pointless” and noted that institutional
    distrust is so high and cognitive bias so that hoax news stories are consumed
    by those only interested in information that confirms their views “even when it’s
