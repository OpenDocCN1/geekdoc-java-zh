    This is especially useful analysis today in examining what happened with the election
    of Donald Trump, for a great many people sense that their views are considered
    deviant by a liberally-biased press. Where the status quo is considered consensus,
    who disagree are seen as deviant, and this doesn''t sit well with those who feel
    powerless as a result.


    Both Fox News and CBN News thumb their nose at this and shout that being shuttled
    to the sphere of deviance is bias, and that are absolutely correct. This is the
    real problem those who refuse to march in lockstep with culture are fighting constantly
    in trying to inform others of perspectives embraced by significant groups of people.


    This further makes the Fox News position of “fair and balanced” ridiculous, for
    Fox presents its own spheres of consensus, legitimate controversy, and deviance.
    The entire product is a form of point-of-view journalism. If they instead offered
    a slogan and statement outlining the beliefs and social conclusions, it would
    pose an entirely different and more acceptable challenge to observers who follow
    the news.


    In all the world, nobody understands this better than Harvard’s “knowledge thinker”
    David Weinberger, who in July of 2009 penned his original thinking in a widely-referenced
    blog post called “Transparency is the new objectivity.” It is reprinted with permission:


    A friend asked me to post an explanation of what I meant when I said at PDF09
    “transparency is the new objectivity.” First, I apologize for the cliché of “x
    is the new y.” Second, what I mean that transparency is now fulfilling some of
    objectivity’s old role in the ecology of knowledge.


    Outside of the realm of science, objectivity is discredited these days as anything
    but aspiration, and even that aspiration is looking pretty sketchy. The problem
    with objectivity is that it tries to show what the world looks like from no point
    of view, which is like wondering what something looks like in the dark. Nevertheless,
    objectivity—even as an unattainable goal—served an important role in how we came
    to trust information, and in the economics of newspapers in the modern age.'
