    the consequences of its deception are so devastating and hard to overcome. We
    can be so caught up in the desire to serve a loving God and be a good person—something
    we view as contrary to “the world”—that we find comfort with anyone expressing
    a similar motivation. Consequently, we miss the self-centered social engineering
    that''s actually taking place and, in the process, confuse bad behavior with good
    intentions.


    Selfishness and self-centeredness the most dangerous epidemic facing Western Civilization
    today. And what is extreme selfishness than intolerance itself? On the highway,
    I''m more important than you are, so get out of my way, and don''t even think
    that I''ll get out of yours. In fact, you don''t have the rights I have behind
    the wheel, so why not just get off the road entirely? Why should I have to tolerate
    anyone else, when I''m the most important person on the highway anyway?


    This kind of thinking is evident everywhere, though its most common proponents
    usually wouldn''t think of themselves as such, and it breeds intolerance, especially
    in religion and politics. Why should I have to tolerate you, the thinking goes,
    if I''m right? My political party, my opinion is what''s right and best, so everybody
    gets out of the way and let me run. The mind of the ideologue is totalitarian,
    and nothing gives purity to such deception like the zeal of religion, especially
    if the perception of absolute authority governs religion. It''s not really my
    opinion then; I''m speaking for God!


    This is an incredibly destructive force, and it poisons people, families, whole
    communities and even nations. It''s doubly corrosive, because it hides an unspoken
    fear that my covenant with God is somehow tied to my ability to help others with
    my love. And if I don''t?


    We exploited everything possible in the spreading of our message, including the
