    (1985年) 克里斯·莱尔科（Chris Rylko）是我的助手兼制片人；这是我们为通讯报拍摄照片时。在我 45 年的电视生涯里，克里斯是我身边有过的最好的纯粹制片人，我们今天仍然是朋友。


