    TH: I can''t... again, I can''t answer for everybody else, but I knew.


    IRS CID: When you did these things, were these things cleared with Pat before
    you would flash this thing on the screen... the number. Was he aware of it in
    advance that you were going to be doing this?


    TH: Generally speaking, the impetus to put the Capitol switchboard phone number
    up or the White House phone number came from Pat Robertson during the show.


    IRS CID: So he would make the decision while you were taping?


    TH: While we were live with millions of people.


    IRS CID: You''re live... your morning show is live.


    TH: Remember I told you it was a living format. We had those things... those phone
    numbers were kept in our still store. Just like a lot of other things were kept
    in our still store. When he called for it... sometimes he would even give us the
    blessing of telling us in the dressing room that he wanted to do it. He didn''t
    surprise us out on the floor.


    IRS CID: So, generally speaking, he was the one who gave the direction to flash
    that number so people would call?'
  - '[PAGE 122]


    TH: Yes sir.


    IRS CID: Do you know if he ever supported candidates on the air or guests brought
    on The 700 Club that were up for office? Or if... candidates that were not conservative...if
    The 700 Club would give alternate candidate. In other words, try to discredit
    that candidate... specifically speaking about Mrs. Bird out in California, the
    judge.


    TH: This is the one... Rose Bird.


    IRS CID: She’s justice of California Supreme Court.


    TH: We’re not these vicious people who set about to you know destroy people for
    election. We didn’t do that kind of thing. Did we have guests on who were running
    for office? I just don’t see how you can do news without sometimes that but I
    really don’t know.


    IRS CID: We know but don’t miss the point. I guess the point... you did some segments
    which were basically anti-Bird in the show. Again, in that specific instance,
    who... where did that come from? That idea to do that show? Did that come from
    the [?] or someone else?


    TH: More than likely that would come from staff. To do a story that would...


    Bthe: Terry, what they’re asking is if you know. If you know where this came from.
    Tell them if you don’t know.


    TH: I really don’t.'
