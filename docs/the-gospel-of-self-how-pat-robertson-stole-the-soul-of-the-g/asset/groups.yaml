    we rarely speak about those who didn''t get “blessed,” for the carrot on the stick
    was believed to be an important element of building people''s faith. But faith
    in what? That''s the dark side of the telling of my story, and it causes me physical
    pain today, as I witness the deep split in our culture. The people aren''t aware
