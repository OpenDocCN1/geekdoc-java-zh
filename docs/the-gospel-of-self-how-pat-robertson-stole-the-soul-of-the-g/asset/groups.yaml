    accepted that I would be returning. I knew Pat Robertson like others, and while
    others have their opinions based on their experiences, Pat and I communicated
    non-verbally in ways that I’m still unable to explain. Mostly, I knew his television
    program and everything he was hoping to create with it, without exception. I had
    come into the ministry with a television news background as a rookie Christian,
