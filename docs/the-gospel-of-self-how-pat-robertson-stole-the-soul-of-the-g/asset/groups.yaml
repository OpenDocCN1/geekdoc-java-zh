    belief in miracles often influenced medical care—and regularly watched The 700
    Club. It ripped into me for producing a program that always showed people getting
    healed, because his nine-year-old daughter had just succumbed to cancer. “Worse,”
    he wrote, “than the agony of suffering with the cancer towards the end, was the
    rejection she felt from God, because He wouldn’t heal her.


