    As the Republican Party drifts farther to the right, Evangelical Christians find
    themselves in the position of having to deny that they''ve become exactly what
    they despise—a group of elites trying to force their beliefs on others. Within
    this denial, the twisting of truth is self-serving. Democrats are demonized as
    socialists, communists, Marxists, and of course, liberals who want to steal from
    them in the name of government control of their lives. The obvious conflict here
    is the idea that God is somehow unable to deal with this absent help.


    Maybe America is under judgment right now. Maybe God is sick and tired of all
    our shenanigans, including those being done in His name. Maybe our cultural problems
    are all a reflection of the gospel of self, and God is judging not the world but
    the church. I''m reminded of the story of Jesus being brought before Pontius Pilate
    for the crime of being declared “King of the Jews.” His response was that He was
    “not of this world” and if He were, His followers would fight to free Him. We
    are unable to see ourselves in this position, for it seems we are fighting to
    save the wrong world.


    And through the Republican Party of all things. After all, it helps me, it helps
    my family, it helps my community, it helps my nation, it''s my duty, and I''ll
    get blessed if I do.


    ## Two


    ## The Commission and the Mission


    > To argue with a person who has renounced the use of reason is like administering
    medicine to the dead.

    > —Thomas Paine


    I had a rather miraculous born-again experience while working as host and producer
    of PM Magazine in Louisville, Kentucky in 1980. It happened as I was driving my
    car from a meeting with an Evangelical Christian in his A-frame house in the forests
    of Southern Indiana. We had been discussing my life of depression, sex, suicide,
    drugs, and alcohol, while he talked to me about his faith. I cried non-stop the
    entire trip and fell asleep exhausted when I got home.


    The next morning, it seemed like everything had changed for me. I felt wonderful,
    my depression had lifted, I no longer felt the need for drugs, and the most amazing
    thing was that my language had been completely transformed, as I simply could
    not course. I ceremoniously dumped all of my drugs and paraphernalia into the
    Ohio River and went about my life as a different person.


    At work, I put up a poster of a Monarch butterfly with the words "Born Again."
    I got involved with a small family ministry in Southern Indiana and wrote scores
    of songs for the contemporary Christian band Revival. I was energized and felt
    alive like I hadn''t ever felt before. I felt a sense of purpose, one of glorifying
    God and the creation. I wanted to sing, and I couldn''t stop smiling. I was a
    desperate, despondent, and dying drug abuser on a path to destruction, and overnight,
    I was the opposite. I felt at peace with my religious roots and fully in love
    with the character of Jesus. That fullness of love made me feel amazing. I felt
    clean. I wanted to give. I wanted to put something into the world. I wanted to
    be a help and a blessing to others. I wanted to tell everybody about what had
    happened to me.


    I also started watching television, for I wanted to learn everything I could.
    This included programs like The 700 Club and teaching programs featuring intelligent
    people—or at those who seemed intelligent—like Kenneth Copeland, Charles Stanley,
    and James Robison.


    I got a letter one day from a student at what was then CBN University. She was
    doing her thesis on “magazine story burnout,” a phenomenon that negatively impacts
    people who did what I was doing. She told me she was surveying producers of PM
    Magazine about the topic and asked that I fill out her survey form and send it
    back. I did and received a phone call from her next week. She told me that my
    answers were different than most, and she said I must be a Christian.” I told
    her yes, and asked if I had ever considered working for CBN. She said I sent her
    a tape of my work and that she would pass it along to the ministry. I complied.


    The first story on my tape was a six-minute piece about a horse photographer from
    Lexington, the home of thoroughbred racing. It featured Secretariat, the famous
    Triple Crown winner, and how this photographer worked with horses to get perfect
    composition photos. One section revealed his secret for getting the horse''s attention,
    so that its ears would point perfectly forward. He played an audio tape of a mare
    in heat walking through a barn of stallions.


    Pat Robertson''s second love was thoroughbred horses, and I was told he was fascinated
    by this story. I was invited to Virginia Beach to interview for a job with The
    700 Club. I went and met Executive Producer Michael Little and the rest of the
    CBN crew. They were particularly intrigued by the relatively small amount of time
    it took me to produce the horse story, for the role of story producer was much
    different with PM Magazine than it apparently was for them. It was a heady trip,
    because they offered me a job, but I had misgivings and turned them down. I felt
    comfortable doing what I was doing, and the truth is I really wasn''t ready to
    work for a large Christian ministry. I was still a baby in the faith.


    For all its glory, being on TV isn’t for everybody. Oh, it was heady having my
    picture on the side of every bus in town, but I hated being recognized everywhere
    in Louisville. I had to always be “on” in public, because viewers of the show
    would recognize me. My wife took great joy in playfully embarrassing me wherever,
    and I began to regret the job. The loss of privacy was a weight that I couldn''t
    bear, so I became a career shift and became a field producer for the second magazine
    show that the station aired, Louisville Tonight. I learned in that year storytelling
    storytelling than I''d learned in two previous jobs doing the work, for the team
    that produced the show was made up of national video photographer award winners.
    I honed my craft and continued working with the music ministry of Revival. I grew
    in many, many ways in that year and truly became a high-end television producer.


    I had also become a deeply student of the Bible and all things pertaining to the
    faith. I poured book after book in a search for meaning and understanding the
    things of the spirit. My files are filled with journal entries about what I was
    learning, as the “one-potato, two-potato, three-potato, four” march to wisdom
    continued. I watched Christian television, but mostly watched as the culture seemed
    to slip away from what I had known during my childhood. As a professional observer
    of life, the stirring in my soul to explore these events was unmistakable. I wanted
    to know the whys of everything, especially why people behaved the way they did.
    As a child, my faith was all about acceptance and basic values of hard work, discipline,
    and persistence, but life had shown me that questions were important, too. I wanted
    answers to, and I felt my mind was fertile ground for new and exciting ideas,
    whereas it had only before grounded tradition. I wanted to fly.


    The economy was collapsing everywhere in early 1981, and so the management of
    Louisville Tonight had to make difficult business decisions. Because I came from
    PM Magazine, my salary was higher than any other producer on the staff of Louisville
    Tonight, so my job was eliminated in the budget squeeze.


    The first call I made to CBN, where news of my unemployment was greeted with suggestions
    that this was God moving in my life and calling me to the ministry. “The hound
    of heaven” is what they called it. I couldn''t (or didn’t want to) argue with
    that, and so we moved to Virginia Beach where I became the manager of the field
    crews who proudly produced the stories for The 700 Club.


    I knew magazine show production processes and systems like no one at CBN. The
    university had a marvelous film school, and it cranked out wonderful producers.
    But daily magazine shows are a different animal, one with a voracious appetite
    for content. It demands discipline at every turn using electronic news gathering
    (ENG) equipment, systems, and training, and I knew how to teach this to the ministry.
    I created an algebraic formula to prove Pat Robertson that the program was vastly
    understaffed. He wanted two testimony stories for every program, and required
    an upgrade. We hired more people, and so I was made producer and then senior producer
    of the program itself.


    As producer, the first thing I did was to bring state-of-the-arts graphics production
    into the program. I hired the top guy in the TV industry, Ben Blank from ABC-TV,
    to consult with us, and our goal was to outdo Turner when he was accomplishing
    at CNN by moving graphics away from engineers and into the hands of artists. More
    than anything else, this dramatically boosted the production quality of The 700
    Club.


    Regardless of what people may think about the content we presented back then,
    even the most cynical of television critics would have to admit that the production
    values of the program were outstanding, and I am most proud of it. It was, however,
    the mission of the ministry that drove me; making a difference was my personal
    motivation for making television in the first place, whether it was in the business
    world or what we did at CBN.


    The missions of 700 Club and CBN were compelling, interesting, and very doable
    using the reach of television.


    ## The 700 Club


    The mission of The 700 Club is to provide a television vehicle to accomplish the
    Mission of The Christian Broadcasting Network. In doing so it serves as the principal
    platform for corporate development activities.


