    CBN News. As I have tried to stress elsewhere, the proximity to Pat within my
    daily responsibilities put me in a difficult position with others. The simple
    truth is he would say things to me that he wouldn''t say to others, and he expected
    me to say “Pat said” as a qualifier for instructions I passed to those contributing
    to the television program.


    This and of itself put me at odds with those in CBN’s news department. If, for
    example, I offered any comment perceived as negative about any particular report,
    or if I were to offer a suggestion, the defensive response would be to ask whether
    it was my own thinking or if it came from Pat. I felt always the middleman, although
    I was one of the few people at the ministry who had actually worked as a manager
    in television news and magazine shows prior to affiliation with CBN. I cut my
    news teeth in the very difficult news market of Milwaukee, but managers of the
    news department rejected the experience and the ways and practices I had learned.
    Perhaps it was my personality or the way in which I attempted to share that knowledge,
    but regardless, I never felt like anything other than an adversary to them.


    And that was really a shame, for their purpose was my purpose, and the newsy edge
    that their material created for opening the show was always my favorite part.
    I have referred to CBN News and my experiences many times in my work over the
    past fifteen years. Before Fox News, there was CBN News, which gives me unique
    insight into the criticism leveled at Fox News by the journalism community at
    large. I think the only thing that’s “wrong” with News is that they are not transparent
    about their efforts to provide a cultural balance for journalism.


    Hence, it comes off as shilling for the Republican Party, because in many ways
    it is. the “balance” that Fox attempts to provide is in its inclusion of viewpoints
    considered outside that the press labels “sphere of consensus.” There is, however,
    a distance between what they’re attempting to do and what they’re actually presenting.
    Fox may present a balancing factor in press coverage of the news overall, but
    their perspective is entirely conservative, Republican, and Christian. No attempt
    is made to include the liberal point-of-view—except as pejorative—and this is
    why they are not transparent with their bias.


    Daniel C. Hallin’s book about Vietnam, The Uncensored War, offers deep insight
    into the decision-making processes of the press. By offering


    expanding circles defining three “spheres” of press influence: the sphere of consensus,
    the sphere of legitimate controversy, and the sphere of deviance. Here is the
    way Hallin envisioned it²⁴.


    ![](img/e80a4ab85f719e247bc0b7652c7566a0_130_0.png)


    Figure 1 Spheres of consensus, controversy, and deviance.


    According to Hallin, these three regions define the Washington journalist’s world.
    The centermost sphere of consensus is where journalists feel no need to provide
    forms of argument, for the subjects here are not regarded as controversial. Hallin
    wrote, “Within this region journalists do not feel compelled to present opposing
    views or to remain disinterested observers. On the contrary,” he added, “the journalist’s
    role is to serve as an advocate or celebr of consensus values.”


    Just outside consensus exists the sphere of legitimate controversy, where objectivity
    and balance rule, especially as it regards the process for electing our representatives
    and the two-party system. Opposing views are required, because the subjects themselves
    are considered controversial.


    The outer realm Hallin calls the sphere of deviance, where subjects and actors
    exist that society’s political mainstream reject as “unworthy of being heard,”
    according to Hallin. Neutrality doesn’t exist in this realm, and the press is
    free to decide who resides here, because such players are considered beyond “acceptable
    political conflict.”


    This is especially useful analysis today in examining what happened with the election
    of Donald Trump, for a great many people sense that their views are considered
    deviant by a liberally-biased press. Where the status quo is considered consensus,
    who disagree are seen as deviant, and this doesn''t sit well with those who feel
    powerless as a result.


    Both Fox News and CBN News thumb their nose at this and shout that being shuttled
    to the sphere of deviance is bias, and that are absolutely correct. This is the
    real problem those who refuse to march in lockstep with culture are fighting constantly
    in trying to inform others of perspectives embraced by significant groups of people.


    This further makes the Fox News position of “fair and balanced” ridiculous, for
    Fox presents its own spheres of consensus, legitimate controversy, and deviance.
    The entire product is a form of point-of-view journalism. If they instead offered
    a slogan and statement outlining the beliefs and social conclusions, it would
    pose an entirely different and more acceptable challenge to observers who follow
    the news.


    In all the world, nobody understands this better than Harvard’s “knowledge thinker”
    David Weinberger, who in July of 2009 penned his original thinking in a widely-referenced
    blog post called “Transparency is the new objectivity.” It is reprinted with permission:


    A friend asked me to post an explanation of what I meant when I said at PDF09
    “transparency is the new objectivity.” First, I apologize for the cliché of “x
    is the new y.” Second, what I mean that transparency is now fulfilling some of
    objectivity’s old role in the ecology of knowledge.


    Outside of the realm of science, objectivity is discredited these days as anything
    but aspiration, and even that aspiration is looking pretty sketchy. The problem
    with objectivity is that it tries to show what the world looks like from no point
    of view, which is like wondering what something looks like in the dark. Nevertheless,
    objectivity—even as an unattainable goal—served an important role in how we came
    to trust information, and in the economics of knowledge.


