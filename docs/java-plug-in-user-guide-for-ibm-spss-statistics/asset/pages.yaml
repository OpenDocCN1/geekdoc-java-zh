  md: '# ## 7. Running Python and R Programs from Java


    The IBM SPSS Statistics BEGIN PROGRAM command provides the ability to integrate
    the capabilities of external programming languages with IBM Statistics command
    syntax. The supported languages are the Python programming language and R. This
    enables you to utilize the extensive set of scientific and statistical programming
    libraries available with the Python language and R to create custom algorithms
    that you can apply to your data. Results can be written to a dataset or the XML
    workspace and retrieved by your Java program.


    Python Programs


    Once you have installed the IBM SPSS Statistics - Integration Plug-in for Python,
    you have full access to the block programming language using Python code in a
    BEGIN PROGRAM PYTHON-END PROGRAM block (within command syntax) and submitting
    the command with the submit method from the StatsUtil class. For example:


    ```

    String[] command = {\BEGIN PROGRAM PYTHON.",

    "import spss",

    "<Python code>",

    "END PROGRAM."};

    ```


    ```

    StatsUtil.submit(command);

    ```


    +   - The Python system import spss the Python modules (installed with the IBM
    SPSS Statistics Plug-in for Python) that allow the Python processor to interact
    with IBM SPSS Statistics. Your Python language code follows the import statement.

    - You can omit the keyword ON BEGIN PROGRAM-it is the default.


    Complete documentation on the functionality with the IBM SPSS Statistics - Plug-in
    for Python is available in the SPSS Statistics Help system under Integration Plug-in
    for Python.


    R Programs


    Once you have installed the IBM SPSS Statistics - Integration Plug-in for R, you
    have full access to the R programming language including R in a BEGIN PROGRAM
    R-END PROGRAM block (within command syntax) and submitting the command with the
    submit method from the StatsUtil class. For example:


    ```

    String[] command = {\BEGIN PROGRAM R.",

    "<R code>",

    "END PROGRAM."};

    ```


    ```

    StatsUtil.submit(command);

    ```


    Complete documentation on the functionality with the IBM SPSS Statistics - Plug-in
    for R is available in the SPSS Statistics Help system under Integration Plug-in
    for R.


    Inserting Programs From Command Files


    You can use the SPSS Statistics INSERT command to include BEGIN PROGRAM-END PROGRAM
    blocks contained in command syntax files. This allows you to store your programs
    as separate code files and include them as needed.


    ```

    StatsUtil.submit("INSERT FILE=/myprograms/program_block.sps");

    ```


    The file /myprograms/program_block.sps would contain a BEGIN PROGRAM block, as
    in:'
