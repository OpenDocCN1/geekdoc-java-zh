  md: '# # Chapter 6. Creating custom output


    # ## Creating custom output


    The IBM SPSS Statistics - Integration Plug-in for Java provides the ability to
    create output in the form of custom pivot tables and text blocks. Using the Output
    Management System (OMS), the output can be rendered in variety of formats such
    as HTML, text, or XML that conforms to the IBM SPSS Statistics Output XML Schema.
    If you are generating output part of an extension command implemented in Java,
    then the output will be displayed in the Viewer by default.


    # ## Creating pivot tables


    The following figure shows the basic structural components of a pivot table. For
    IBM Statistics version 26, the IBM Statistics - Integration Plug-in for Java supports
    pivot tables with one dimension and one column. Each dimension contains a set
    of categories that label the elements of the dimension–instance, row labels for
    a row dimension.


    Each cell in the table can be specified by a combination of category values. In
    the example shown, the indicated cell is specified by a category value of *Male*
    for the *Gender* dimension and *Custodial* for the *Employment Category* dimension.


    | Row dimension | | Column dimension |

    |---|---|---|---||

    | | Employment Category | |

    | Gender | Clerical | Custodial | Manager |

    | Female | 186 | 0 | 10 |

    | Male | 110 | 14 | 70 |

    | Row dimension category | | Cell value |


    Figure 1. Pivot table structure


    Pivot tables are created with the PivotTable class, as shown in the following
    example. This example assumes that you are generating pivot output for an external
    Java application that will invoke SPSS Statistics, to that output is routed with
    OMS.


    ```

    String[] command = {

    "SELECT *",

    "IF SUBSETS=(PivotTableDemo)",

    "DESTINATION FORMAT=HTML OUTPUT=/pivottable.html"

    };\execute(command);

    Object[] rows = new Object[]{"row1","row2"};

    Object[] columns = new Object[]{"columnA","columnB"};

    Object[] cells = new Object[]{"1A","1B","2A","2B"};

    // Create a sample pivot table

    String template = "PivotTableDemo";

    String caption = "";

    String rowDim="Dimension";

    String colDimTitle="Column dimension";

    boolean hiddenRowDimTitle = false;

    boolean hiddenColDimTitle = false;

    boolean hiddenColDimLabel = false;

    PivotTable table = new PivotTable(cells, rowLabels, colLabels, rowDim, template,
    outline, caption, rowDim;

    ```'
