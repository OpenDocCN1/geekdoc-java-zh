    retrieve one case at a time in sequential or you can retrieve multiple cases (including
    all cases) with a single call to the fetchCases method.


    +   System-values are always returned as the Java null; however you can specify
    user-missing values are treated as valid or returned as null. See the example
    on missing data.


    +   By default, retrieve from a variable representing a date, or a date and a
    time, is given as the number of seconds from October 14, 1582. You can specify
    that values retrieved from IBM Statistics variables with date or time formats
    be converted to Calendar objects with the setConvertDataTypes shown in the following
    example:


    +   When retrieving cases, any case filtering specified with the FILTER or USE
    commands is honored.


    Example:


    ```

    DataUtil dataUtil = new DataUtil("file/demo.sav.\

