  md: '# Chapter 4. Working with case data in the active dataset


    # Working with case data in the active dataset


    The IBM Statistics - Integration Plug-in for Java provides the ability to read
    case data from the active dataset, create new variables in the active dataset,
    and append new cases to the active dataset. The functionality for reading and
    writing to the active dataset is provided in the Cursor class. An instance of
    the Cursor creates an open cursor, which provides access to the active dataset.
    Because the following rules apply to your use:


    +   You cannot use the submit method from the Util class while a data cursor is
    open. You must close the cursor first using the close method. In particular, if
    you need to save changes made to the active dataset to an external file, then
    use the submit method to submit a SAVE command after closing the cursor.


    +   Only one data cursor can be open at any point in an application. To define
    a new data cursor, you must first close the previous one.


    While the Cursor class provides the full set of methods for accessing the active
    dataset, the simpler DataUtil class is a wrapper for the Cursor class and provides
    the ability to read case, create new variables and append case. The examples in
    this section use the DataUtil class. DataUtil class is a wrapper for the Cursor
    class, also has limitations on cursor which apply to DataUtil objects. The following
    apply:


    +   You cannot use the submit method from the Util class while a DataUtil object
    exists. You must release the resources associated with the object with the release
    method. As with cursor, if you need to save changes made to the active dataset
    to an external file, then use the submit method to submit a SAVE command after
    releasing the DataUtil object.


    +   Only one DataUtil object can exist at a time. To create a new DataUtil object,
    you must first release the previous one.


    Note: To create a new dataset, use the submit method in the Util class to submit
    a DATA LIST


    # Reading case data


