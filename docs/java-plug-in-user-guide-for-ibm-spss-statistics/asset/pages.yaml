  md: '# Chapter 1. Getting started with the Integration Plug-in for Java


    The IBM SPSS Statistics - Integration Plug-in for Java™ enables an application
    developer to create Java applications that can invoke and control the IBM SPSS
    Statistics processor, or implement extension commands in Java that can then be
    run from within IBM SPSS Statistics. Extension commands are IBM Statistics commands
    that are implemented in an external language (Python, R or Java) and allow users
    who are proficient in Java to share external functions with users of standard
    IBM Statistics syntax.


    With the IBM SPSS Statistics - Integration Plug-in for Java, you can do the following:


    +   * Execute IBM SPSS commands from the active dataset.

    * Read data from the active dataset.

    * Get information about data in the active dataset.

    * Add new variables and append cases to the active dataset.

    * Get output results from syntax commands.

    * Create custom output in the form of pivot tables and text blocks.


    The IBM Statistics - Integration Plug-in for Java is installed with IBM SPSS Statistics
    and IBM Statistics Server and require no separate installation or configuration.
    For version 26 of IBM SPSS Statistics, the IBM Statistics - Integration Plug-in
    for Java supports Java version 7.


    The IBM SPSS Statistics - Integration Plug-in for Java is designed to work with
    Unicode mode. Use of the IBM SPSS Statistics - Integration Plug-in for Java with
    code page mode is not recommended.


    Complete documentation for all of the classes and methods available with the IBM
    Statistics Integration-Plug for Java is available in the Help system under the
    heading IBM Statistics - Integration-Plug for Java API Reference.


    # Invoking IBM Statistics from an external Java application


    The interface for invoking IBM Statistics and controlling the IBM Statistics Statistics
    processor is provided in the JAR file spssjavaplugin.jar, which is installed with
    your IBM Statistics Statistics product. The JAR file contains the com.ibm.statistics
    package, which contains the Java classes available with your operating system.
    Be sure to add the Statistics - Integration Plug-in for Java Following the locations
    of spssjavaplugin.jar to your class path.


    +   * On Windows, spssjavaplugin.jar is located in the IBM Statistics Statistics
    installation directory.

    * On Linux and UNIX Server systems, spssjavaplugin.jar is located in the bin directory
    under the IBM Statistics Statistics installation directory.

    * On Mac OS, spssjavaplugin.jar is located in the bin directory under the Content
    directory in the IBM Statistics application bundle.


    Important: Do not move spssjavaplugin.jar from its installed location. The IBM
    Statistics - Integration Plug-in for Java assumes that spssjavaplugin.jar is in
    the installed location.


    Note: For information on deploying your application on end user machines, please
    see Chapter 8, "Deploying an external Java application," on page 25.


    When invoked from an external Java application, the IBM Statistics processor runs
    without an associated instance of the IBM Statistics Statistics client. In this
    mode, output generated from IBM Statistics'
