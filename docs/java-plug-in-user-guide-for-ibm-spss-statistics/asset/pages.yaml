  md: "Statistics can be managed with parameters specified on the method that starts\
    \ the processor or through use of the IBM SPSS Output Management System, which\
    \ is invoked by the OMS command.\n\nThe following is a simple example of using\
    \ the IBM Statistics - Integration Plugin for Java to create a dataset in IBM\
    \ SPSS, compute descriptive statistics and generate output. It illustrates the\
    \ basic features of invoking IBM Statistics from an external Java application.\n\
    \n```\nimport com.ibm.statistics.plugin.*;\npublic class demo { public static\
    \ void main(String[] args) {\n\n    try {\n        StatsUtil.start();\n      \
    \  String[] command = {\"OMS\",\n            \"DESCRIPTION FORMAT=HTML OUTPUT=/output/demo.html*\"\
    ,\nn            \"DATA LIST free /salary (F).\",\n            \"RESIN DATA\",\n\
    \            \"*25000\",\n            \"*30000\",\n            \"NEW DATA\",\n\
    \            \"DESCRIPTIVES salary.\",\n            \"};\n        StatsUtil.commit(command);\n\
    \        StatsUtil.stop();\n    } catch (Exception e) {\n        e.printStackTrace();\n\
    \    }\n}\n}\n```\n\n+   - The element import com.ibm.statistics.plugin.* imports\
    \ all of the classes in the com.ibm.statistics.plugin package.\n- The StatsUtil.start\
    \ method starts the IBM Statistics processor.\n- A string array specifies IBM\
    \ Statistics syntax creates a dataset and runs the DESCRIPTIVES procedure. The\
    \ command syntax is submitted to IBM Statistics using the StatsUtil.submit method.\
    \ Output from the DESCRIPTIVES procedure is routed to an HTML file using the OMS\
    \ command.\n- The StatsUtil.stop method stops the IBM Statistics processor and\
    \ should be called to properly end an IBM Statistics session.\n- The Exception\
    \ class is a subclass of the native Exception class, and handles exceptions that\
    \ are specific to the IBM Statistics - Integration Plugin for Java. It can be\
    \ inherited to define custom exceptions for your application.\n\n# Creating IBM\
    \ Statistics extension commands in Java\n\nThis topic describes aspects of extension\
    \ commands that are to implementing extension commands in Java. Detailed information\
    \ on creating extension commands is provided in the article \"Writing IBM Statistics\
    \ Extension Commands\", available from the IBM Statistics Predictive Analytics\
    \ community at https://developer.ibm..com/predictiveanalytics/.\n\nImplementation\
    \ code can consist of a JAR file or class files.\n\n+   - When using a JAR file,\
    \ the name of the JAR file must be the same as the extension command, and in upper\
    \ case. For multi-word command names, spaces between words should be replaced\
    \ with underscores when constructing the name of the JAR file. The JAR file must\
    \ contain a class file with the same name as the JAR and the class must not be\
    \ part of a package.\n- When using standalone class files, there must be one class\
    \ file with the same name as that of the extension command, and in upper case.\
    \ For multi-word command names, spaces between words should be replaced with underscores\
    \ when constructing the name of the class file."
