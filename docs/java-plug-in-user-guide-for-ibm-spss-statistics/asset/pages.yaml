  md: "Whether using a JAR file or standalone Java classes, the class file with the\
    \ same name as the extension command should contain the following:\n\n+   * A\
    \ constructor method, which does not have a parameter, for the class.\n* A public\
    \ static method named Run with a single Hashtable argument that should be specified\
    \ as follows:\n Hashtable<String, Hashtable<String, Object>>\n* A public method\
    \ that implements the command.\n\n# XML command syntax specification\n\n+   *\
    \ For extension commands implemented in Java, the Language attribute of the Command\
    \ element should be set to \"Java\".\n* For Java commands implemented with a JAR\
    \ file, the Mode attribute of the Command element should be set to \"Package\"\
    .\n\n# Sample Java class\n\nThe following is an example of a Java class for an\
    \ extension command DEMO, which simply takes a variable list as input and prints\
    \ the list. It demonstrates the basic structure of implementation code and the\
    \ means by which values are passed from the command syntax (submitted by the user)\
    \ to the method that implements the command. The XML command syntax specification\
    \ for the DEMO command is also provided.\n\n```\nimport java.util.Arrays;\nimport\
    \ java.util.HashSet;\nimport java.util.ArrayList;\nimport java.util.Hashtable;\n\
    import java.util.List;\nimport com.ibm.statistics.plugin.*;\n\npublic class DEMO()\
    \ {\n    System.out.println(\"This is the constructor method\");\n}\n\npublic\
    \ static void Run(Hashtable<String, Hashtable<String, Object>> args) {\n    List<TemplateClass>\
    \ testlist = Arrays.asList(testlist);\n    Extension.Template(\"VARIABLES\", \"\
    *vars\", \"existinglist\", true);\n    \n    SyntaxObj obj = Extension.Syntax(testlist);\n\
    \    Extension.processcmnd(obj, args, \"printvars\");\n\n    } catch (Exception\
    \ e) {\n        e.printStackTrace();\n    }\n}\n\npublic void printvars(@ParamName(\"\
    var\") ArrayString variables) {\n    System.out.println(\"variables = \" + variables);\n\
    }\n```\n```\n\nBriefly, the function of the Run, Syntax and processcmnd methods\
    \ are as follows:\n\n+   * IBM Statistics parses the command syntax by the user\
    \ and passes the specified values to the Run function in a single argument-args\
    \ in this example.\n* The Run function calls the Extension.Syntax, Extension.Template,\
    \ and Extension.processcmnd methods, which are designed to work together.\n\n\
    Extension.Template specifies the details needed to process a specific keyword\
    \ in the syntax for an extension command. In this example, the extension command\
    \ uses the single keyword VARIABLES.\nExtension.Syntax validates the values passed\
    \ to the Run function according to the templates specified for the keywords."
