  md: '# Chapter 2. Running IBM SPSS Statistics commands


    # Running IBM SPSS Statistics commands


    The submit method from the Util class is used to submit syntax commands to IBM
    SPSS Statistics for processing. It takes a string that resolves to a complete
    syntax command, or an array of strings that resolves to one or more complete syntax
    commands. Output from syntax commands can be written to the standard output stream
    or to an external file. It can also be directed to an in-memory workspace where
    it is stored as XML and can be retrieved using XPath expressions. See the topic
    "Retrieving output from syntax commands" on page 15 for more information.


    Submitting a single command


    You submit a single command to IBM SPSS Statistics by providing a string representation
    of the command as shown in this. When submitting a single command in the manner
    period () at the end of the command is optional.


    ```

    Util.submit("GET FILE=/data/Employee data.sav.");

    Util.submit("DESCRIPTIVES SALARY.");

    ```


    +   The submit method is called twice; first to submit a GET command and then
    to submit a DESCRIPTIVES command.


    Submitting commands using an array


    You can use multiple commands as an array of strings where each element is a representation
    of a syntax command. The string for each command must be terminated with a period
    () as shown in this.


    ```

    Util.submit("GET FILE=/data/Employee data.sav.");

    String[] cmdlines = {"DESCRIPTIVES SALARY SALEBEGIN.","FREQUENCES EDUC JOBCAT."};

    Util.submit(cmdlines);

    ```


    +   The submit method is called with an array that specifies a DESCRIPTIVES and
    a FREQUENCES command.


    You can also use elements of an array to represent parts of a command so that
    a single array specifies one or more complete syntax commands. When submitting
    multiple commands in this manner, each command must be terminated with a period
    () as shown in this.


    ```

    Util.submit("GET FILE=/data/Employee data.sav.");

    String[] COMMANDS = {"Descriptives ''Frequencies''",

    "DESTINATION FORMAT = XML",

    "IMAGES IN OUTPUT = /output/stats.html",

    "DESCRIPTIVES SALARY.",

    "FREQUENCES EDUC.",

    "OMSEND.\};

    Util.submit(COMMANDS);

    ```


    +   The submit method is called with an array that specifies an OMS command followed
    by a DESCRIPTIVES command, a FREQUENCES command, and an OMSEND command. The first
    four elements of the array are used to specify the OMS command.


    Displaying command generated by the submit method


    For debugging purposes, it is convenient to see the completed syntax passed to
    IBM SPSS Statistics by any calls to the submit method. This is enabled through
    syntax command with SET PRINTBACK MPRINT ON.'
