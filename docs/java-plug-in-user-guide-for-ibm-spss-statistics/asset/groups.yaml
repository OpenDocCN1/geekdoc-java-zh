    # 5. Retrieving output from syntax commands


    # Retrieving output from syntax commands


    You can retrieve output by IBM Statistics commands without writing the output
    to an external file. This is accomplished by routing the output via the Output
    Management System (OMS) to an area in memory where it is stored as the XML workspace
    where it is an XPath DOM that conforms to the IBM SPSS Statistics Output XML schema.
    Output is retrieved from this workspace with functions that employ XPath expressions.


    Constructing the XPath expression (IBM SPSS Statistics currently supports XPath
    1.0) requires an understanding of the Output XML schema. The output schema spss-output-1.xsd
    is distributed with IBM SPSS Statistics. Documentation is included in the IBM
    Statistics Help system.


    Example


    ```

    String[] commands={"GET FILE"/data/employee.data.sav.",

    "/IF COMMANDS=`[DESCRIPTIVES]` SUBTYPES=`[Descriptive Statistics]`",

    "/DESTINATION FORMAT=XML,WORKSPACE=`desc_table`;

    "/TAG=`out.",

    "/DESCRIPTIVES VARIABLES=salary, salbegin, datetime, jobtime",

    "/OMEND TAG=`out.";};

    StatusResult result=status1.execute(commands);

    String handle="desc_table";

    String xpath="//[pivott[@Type=''Descriptive Statistics'']]" +

    "//Dimension[@Row=''salary'']" +

    "//Dimension[@Column=''Mean'']" +

    "//Cell[@Name=''Mean'']";

    Cell result=status1.evaluateXPath(handle, context);

    status1.deleteXPath(handle);

    ```


    +   - The OMS command is used to retrieve an output from a command to the XML
    workspace. The XMLWORKSPACE keyword in the DESTINATION subcommand, with FORMAT=XML,
    specifies the XML workspace as the output destination. It is a good practice to
    use the desc_table here, so as not to interfere with any other OMS command that
    may be operating. The identifiers used for the COMMANDS and SUBTYPES used in the
    OMS can be found in the OMS identifiers box, available in the Utilities menu.

    - The XMLWORKSPACE keyword is used to specify a name for this XPath DOM in the
    workspace. In the current example, output from the DESCRIPTIVES command will be
    identified with the name desc_table. You can have many XPath commands in the XML
    workspace, each with its own name.

    - You retrieve the values from the workspace using the evaluateXPath method from
    the StatusClass. The method takes an XPath expression, evaluates it against a
    specified XPath DOM in the XML workspace, and returns the result as an array of
    strings.

    - The first argument to the evaluateXPath function specifies the XPath DOM to
    which an XPath expression will be applied. This argument is referred to as the
    handle for the XPath DOM and is simply the name given on the XMLWORKSPACE keyword
    of the associated OMS command. In this case the handle is desc_table.

    - The second argument to evaluateXPath defines the XPath context for the expression
    and should be set to "outputTree" routed to the XML workspace by the OMS command.'
  - '[PAGE 19]


    +   • The argument to evaluateXPath specifies the remainder of the XPath expression
    (the context is the first part). Since XPath expressions almost always contain
    quoted strings, you''ll need to use a different quote to enclose the expression.
    For familiar with XSLT and accustomed to needing a namespace prefix, note that
    XPath expressions for the evaluateXPath function should not include the oms: namespace
    prefix.


    +   • The XPath expression in this example is specified by the variable XPath.
    it is not the minimal expression needed to select the value of interest but is
    used for illustration purposes and to highlight the structure of the XML output.


    ```

    /pivotTable[@subType=''Descriptive Statistics''] selects the Descriptive Statistics
    table.

    /dimension[@axis=''row'']/category[@varname=''salary''] selects the rows for the
    variable salary.

    /dimension[@axis=''column'']/measure[@text=''Mean''] selects the Mean count within
    this row, thus usifying a single cell in the pivot table.

    /cell/@text selects the textual representation of the contents.

    ```


    +   • When you have finished with a particular item, it is a good idea to delete
    it from the XML workspace. This is done with the deleteXPathHandle, whose argument
    is the name of the handle associated with it.


    If you are familiar with XPath, the mean value of salary can also be selected
    with the following

    /category[@varname=''salary'']/category[@text=''Mean'']/cell


    > Note: To easily possible, construct your XPath expressions using language-independent
    attributes, such as the variable name rather than the variable label. This will
    help reduce the translation effort if you need to deploy your code in multiple
    languages. Also considering language-dependent identifiers, such as the name of
    a statistic, into constants. You can obtain the current language used for pivot
    table with the syntax command SHOW OLANG.


    You may also consider using text_eng attributes in place of text attributes in
    XPath expressions.

    text_eng attributes are English versions of text attributes and have the same
    value regardless of the output language. The OATRS subset of the SET command specifies
    whether text_eng attributes are included in OXML output.


    Writing XML workspace to a file


    When writing and debugging XPath, it is often useful to have a sample file that
    shows the XML structure. This can be obtained with the getXMLUTF16 from the StatsUtil
    class, as well as an option on the OMS command syntax. The following code recreates
    the workspace for the preceding example and writes the XML structure using the
    handle desc to an external file.


    ```

    String[] command = {"GET FILE", "data/example_data.sav",

    "SETTING FORMAT=XML", "SUBTYPES=''Descriptive Statistics''",

    "desc=out",

    "DESCRIPTIVE VARIABLES=salary, jobtime, prevail",

    "STATISTICS-MEAN",

    "SHOW OLANG",

    "OMAND desc=''out''"};


    String result = StatsUtil.getXMLUTF16("desc=table");

    PrintWriter writer = new PrintWriter(new FileOutputStream("output/output_table.xml"));

    writer.write(result);

    out.close();

    StatsUtil.deleteXPathHandle("desc=table");

    ```


    The section of the output file that describes the Descriptive Statistics table,
    including the mean value of

    salary, is follows (output written in Unicode (UTF-16):


    ```

    <pivottable subType=''Descriptive Statistics">

    <dimension axis=''row'' text="Variables">

    <category label="Current Salary" text="Current Salary">

    <varname=''salary'' value="row">

    <dimension axis=''column'' text=''Statistics">

    ```


