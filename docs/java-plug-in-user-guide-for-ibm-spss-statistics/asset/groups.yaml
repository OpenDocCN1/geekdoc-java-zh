    \ . . . . . . . . . . . . . . . . . . . . . . 29\n\n+   Index . . . . . . . .\
    \ . . . . . . . . . . . . . . . . . . . . 31\n\n## Chapter 1. Getting started\
    \ with the Integration Plug-in for Java\n\nThe IBM SPSS Statistics - Integration\
    \ Plug-in for Java™ enables an application developer to create Java applications\
    \ that can invoke and control the IBM SPSS Statistics processor, or implement\
    \ extension commands in Java that can then be run from within IBM SPSS Statistics.\
    \ Extension commands are IBM Statistics commands that are implemented in an external\
    \ language (Python, R or Java) and allow users who are proficient in Java to share\
    \ external functions with users of standard IBM Statistics syntax.\n\nWith the\
    \ IBM SPSS Statistics - Integration Plug-in for Java, you can do the following:\n\
    \n- Execute IBM SPSS commands from the active dataset.\n- Read data from the active\
    \ dataset.\n- Get information about data in the active dataset.\n- Add new variables\
    \ and append cases to the active dataset.\n- Get output results from syntax commands.\n\
    - Create custom output in the form of pivot tables and text blocks.\n\nThe IBM\
    \ Statistics - Integration Plug-in for Java is installed with IBM SPSS Statistics\
    \ and IBM Statistics Server and require no separate installation or configuration.\
    \ For version 26 of IBM SPSS Statistics, the IBM Statistics - Integration Plug-in\
    \ for Java supports Java version 7.\n\nThe IBM SPSS Statistics - Integration Plug-in\
    \ for Java is designed to provide developers with an API to interact with the\
    \ SPSS Statistics engine.\n\n### Invoking IBM SPSS Statistics from an external\
    \ application\n\nThe IBM Statistics - Integration Plug-in for Java is installed\
    \ with IBM SPSS Statistics and IBM Statistics Server and require no separate installation\
    \ or configuration. For version 26 of IBM SPSS Statistics, the IBM Statistics\
    \ - Integration Plug-in for Java supports Java version 7.\n\nThe IBM SPSS Statistics\
    \ - Integration Plug-in for Java is designed to provide developers with an API\
    \ to interact with the SPSS Statistics engine.\n\nThe following is a simple example\
    \ of using IBM Statistics to create a dataset, compute descriptive statistics\
    \ and generate output.\n\n```java\nimport com.ibm.statistics.plugin.*;\n\npublic\
    \ class demo {\n    public static void main(String[] args) {\n        try {\n\
    \            StatsUtil.start();\n            String[] command = {\n          \
    \      \"OMS\", \"FORMAT=HTML OUTPUT=output.html\",\n                \"DATA LIST\
    \ /salary.\",\n                \"NEW DATA\",\n                \"DESCRIPTIVES salary.\"\
    \n            };\n            StatsUtil.submit(command);\n            StatsUtil.stop();\n\
    \        } catch (Exception e) {\n            e.printStackTrace();\n        }\n\
    \    }\n}\n```\n\n- The element `import com.ibm.statistics.plugin.*` imports all\
    \ of the classes in the com.ibm.statistics.plugin package.\n- The `StatsUtil.start()`\
    \ method starts the IBM Statistics processor.\n- A string array specifies IBM\
    \ Statistics syntax creates a dataset and runs the DESCRIPTIVES procedure. The\
    \ command syntax is submitted to IBM Statistics using the `StatsUtil.submit` method.\
    \ Output from the DESCRIPTIVES procedure is routed to an HTML file using the OMS\
    \ command.\n- The `StatsUtil.stop()` method stops the IBM Statistics processor\
    \ and should be called to properly end an IBM Statistics session.\n- The `Exception`\
    \ class is a subclass of the native Exception class, and handles exceptions that\
    \ are specific to the IBM Statistics - Integration Plugin for Java. It can be\
    \ inherited to define custom exceptions for your application.\n\n## Creating IBM\
    \ Statistics extension commands in Java\n\nThis topic describes aspects of extension\
    \ commands that are implementing extension commands in Java. Detailed information\
    \ on creating extension commands is provided in the article \"Writing IBM Statistics\
    \ Extension Commands\", available from the IBM Statistics Predictive Analytics\
    \ community at https://developer.ibm.com/predictiveanalytics/.\n\nImplementation\
    \ code can consist of a JAR file or class files.\n\n- When using a JAR file, the\
    \ name of the JAR file must be the same as the extension command, and in upper\
    \ case. For multi-word command names, spaces between words should be replaced\
    \ with underscores when constructing the name of the JAR file. The JAR file must\
    \ contain a class file with the same name as the JAR and the class must not be\
    \ part of a package.\n- When using standalone class files, there must be one class\
    \ file with the same name as that of the extension command, and in upper case.\n"
