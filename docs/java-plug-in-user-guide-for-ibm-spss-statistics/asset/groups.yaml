    \n## 第 1 章 开始使用 Java 集成插件\n\nIBM SPSS Statistics - Java 集成插件™ 允许开发人员创建 Java 应用程序，这些应用程序可以调用并控制\
    \ IBM SPSS Statistics 处理器，或者在 Java 中实现可以在 IBM SPSS Statistics 内部运行的扩展命令。扩展命令是使用外部语言（Python、R\
    \ 或 Java）实现的 IBM Statistics 命令，它允许精通 Java 的用户与标准 IBM Statistics 语法的用户共享外部函数。\n\
    \n。\n\n通过 IBM SPSS Statistics - Java 集成插件，你可以执行以下操作：\n\n-   从活动数据集执行 IBM SPSS\
    \ 命令。\n-   从活动数据集读取数据。\n-   获取有关活动数据集内数据的信息。\n-   向活动数据集添加新变量并追加个案。\n-   从语法命令获取输出结果。\n\
    -   创建以透视表和文本块形式存在的自定义输出。\n\nIBM Statistics - Java 集成插件随 IBM SPSS Statistics 和\
    \ IBM Statistics Server 一起安装，无需单独安装或配置。对于 IBM SPSS Statistics 第 26 版本，IBM Statistics\
    \ - Java 集成插件支持 Java 7 版本。\n\nIBM SPSS Statistics - Java 集成插件旨在为开发者提供一个与 SPSS\
    \ Statistics 引擎交互的 API。\n\n### 从外部应用程序调用 IBM SPSS Statistics\n\nIBM Statistics\
    \ - Java 集成插件随 IBM SPSS Statistics 和 IBM Statistics Server 一起安装，无需单独安装或配置。对于 IBM\
    \ SPSS Statistics 第 26 版本，IBM Statistics - Java 集成插件支持 Java 7 版本。\n\nIBM SPSS\
    \ Statistics - Java 集成插件旨在为开发者提供一个与 SPSS Statistics 引擎交互的 API。\n\n以下是一个使用 IBM\
    \ Statistics 创建数据集、计算描述统计并生成输出的简单示例。\n\n```java\nimport com.ibm.statistics.plugin.*;\n\
    \npublic class demo {\n    public static void main(String[] args) {\n        try\
    \ {\n            StatsUtil.start();\n            String[] command = {\n      \
    \          \"OMS\", \"FORMAT=HTML OUTPUT=output.html\",\n                \"DATA\
    \ LIST /salary.\",\n                \"NEW DATA\",\n                \"DESCRIPTIVES\
    \ salary.\"\n            };\n            StatsUtil.submit(command);\n        \
    \    StatsUtil.stop();\n        } catch (Exception e) {\n            e.printStackTrace();\n\
    \        }\n    }\n}\n```\n\n-   元素 `import com.ibm.statistics.plugin.*` 导入了 com.ibm.statistics.plugin\
    \ 包中的所有类。\n-   `StatsUtil.start()` 方法启动 IBM Statistics 处理器。\n-   字符串数组指定了 IBM\
    \ Statistics 语法用于创建一个数据集并运行 DESCRIPTIVES 过程。命令语法通过 `StatsUtil.submit` 方法提交给 IBM\
    \ Statistics。DESCRIPTIVES 过程的输出通过 OMS 命令路由到 HTML 文件。\n-   `StatsUtil.stop()` 方法停止\
    \ IBM Statistics 处理器，并应调用它以正确结束 IBM Statistics 会话。\n-   `Exception` 类是原生 Exception\
    \ 类的子类，用于处理特定于 IBM Statistics - Java 集成插件的异常。可以继承该类为你的应用程序定义自定义异常。\n\n## 在 Java\
    \ 中创建 IBM Statistics 扩展命令\n\n本主题描述了在 Java 中实现扩展命令的各个方面。关于创建扩展命令的详细信息，请参阅“Writing\
    \ IBM Statistics Extension Commands”文章，该文章可在 IBM Statistics Predictive Analytics社区获取：https://developer.ibm.com/predictiveanalytics/。\n\
    \n实现代码由 JAR 文件或类文件组成。\n\n-   当使用 JAR 文件时，JAR 文件名必须与扩展命令相同且全为大写。对于多单词命令名称，在构造 JAR\
    \ 文件名时应将单词之间的空格替换为下划线。JAR 文件必须包含一个与 JAR 同名的类文件，且该类不能属于任何包。\n-   当使用独立的类文件时，必须有一个类与扩展命令名称相同且全为大写的类文件。\n\
    \n"
