    +   The convertDateTypes method specifies that values read from IBM SPSS Statistics
    variables with date or datetime formats will be converted to Java Calendar objects.


    +   The FetchCases method retrieves all cases from the active dataset. The first
    argument specifies that user-using values will be treated as missing and converted
    to the Java null value. The second argument specifies that from 0, it will be
    retrieved from the active dataset. You can retrieve cases starting from an arbitrary
    number by specifying a different value for the second argument. You can also retrieve
    a subset of cases, using an overloaded form of fetchCases with a third argument
    specifying the number of cases to retrieve.


    +   The FetchCases method returns a Case object, which represents an array of
    cases. The items in each element of the array contain the values in a particular
    case of data from the active dataset, file order. You can get the number of items
    in each case from the getCellValueNumber method of the Case object.


    +   The type of value in each item of a case is available from the getCellValue
    method of the Case object. Values are retrieved from the Case object with methods
    specific to each type of value, as shown here for numeric, string and date values.


    Retrieving a subset of variables for data will be retrieved.


    You can specify a subset of variables which data will be retrieved. You can specify
    the set of variables by name or by their index position in the active dataset.
    Index positions start with 0 for the first variable in file order.:


    ```

    DataUtil.subset("FILE/data/employee data.csv");

    dataUtil1 = new DataUtil();

    String[] varNames = new String[]("educ","salary");

    dataUtil1.subset(varNames, true);

    Case[] data = dataUtil1.fetchCases(false, 0);

    ```


    The variableFilterMethod specifies the subset of variables for which data will
    be retrieved. In this example, only the data for variables id, educ and salary
    will be retrieved.


    Missing data


