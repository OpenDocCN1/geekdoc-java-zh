- md: "\nWhether using a JAR file or standalone Java classes, the class file with\
    \ the same name as the extension command should contain the following:\n\n- A\
    \ constructor method, which does not have a parameter, for the class.\n- A public\
    \ static method named Run with a single Hashtable argument that should be specified\
    \ as follows:\n  Hashtable<String, Hashtable<String, Object>>\n- A public method\
    \ that implements the command.\n\n## XML command syntax specification\n\n- For\
    \ extension commands implemented in Java, the Language attribute of the Command\
    \ element should be set to \"Java\".\n- For Java commands implemented with a JAR\
    \ file, the Mode attribute of the Command element should be set to \"Package\"\
    .\n\n## Sample Java class\n\nThe following is an example of a Java class for an\
    \ extension command DEMO, which simply takes a variable list as input and prints\
    \ the list. It demonstrates the basic structure of implementation code and the\
    \ means by which values are passed from the command syntax (submitted by the user)\
    \ to the method that implements the command. The XML command syntax specification\
    \ for the DEMO command is also provided.\n\n```java\nimport java.util.Arrays;\n\
    import java.util.HashSet;\nimport java.util.ArrayList;\nimport java.util.Hashtable;\n\
    import java.util.List;\nimport com.ibm.statistics.plugin.*;\n\npublic class DEMO()\
    \ {\n    public DEMO() {\n        System.out.println(\"This is the constructor\
    \ method\");\n    }\n\n    public static void Run(Hashtable<String, Hashtable<String,\
    \ Object>> args) {\n        try {\n            List<TemplateClass> testlist =\
    \ Arrays.asList(testlist);\n            Extension.Template(\"VARIABLES\", \"*vars\"\
    , \"existinglist\", true);\n            \n            SyntaxObj obj = Extension.Syntax(testlist);\n\
    \            Extension.processcmnd(obj, args, \"printvars\");\n        } catch\
    \ (Exception e) {\n            e.printStackTrace();\n        }\n    }\n\n    public\
    \ void printvars(@ParamName(\"var\") ArrayString variables) {\n        System.out.println(\"\
    variables = \" + variables);\n    }\n}\n```\n\nBriefly, the function of the Run,\
    \ Syntax and processcmnd methods are as follows:\n\n- IBM Statistics parses the\
    \ command syntax by the user and passes the specified values to the Run function\
    \ in a single argument-args in this example.\n- The Run function calls the Extension.Syntax,\
    \ Extension.Template, and Extension.processcmnd methods, which are designed to\
    \ work together.\n\nExtension.Template specifies the details needed to process\
    \ a specific keyword in the syntax for an extension command. In this example,\
    \ the extension command uses the single keyword VARIABLES.\nExtension.Syntax validates\
    \ the values passed to the Run function according to the templates specified for\
    \ the keywords.\n\nExtension.processcmd parses values passed to the Run function\
    \ and calls the function that will actually implement the command—in this example,\
    \ the printvars method.\n\nThe annotation mechanism also requires that the implementation\
    \ method be defined as object types, not primitive data types. In particular,\
    \ you must use the object types Integer, Short, Long, Float, Double, Byte, Character\
    \ and Boolean instead of the primitive types int, short, long, float, double,\
    \ char and boolean. In the above example, the printvars method is an array of\
    \ strings and is defined as an ArrayList object.\n\nThe XML specification for\
    \ the DEMO command is as follows:\n\n```xml\n<Command xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\
    \n         xsi:noNamespaceSchemaLocation=\"http://example.com/XML-Schema.xsd\"\
    \n         Name=\"DEMO\" Language=\"Java\">\n  <Subcommand Name=\"\">\n    <Parameter\
    \ Name=\"VARIABLES\" ParameterType=\"VariableNameList\"/>\n  </Subcommand>\n</Command>\n\
    ```\n\n- The top level element Command specifies the name of the extension command\
    \ and the implementation language. The Mode attribute is set to \"Source\", which\
    \ specifies that the implementation code is contained in Java class files rather\
    \ than a JAR file.\n- The Subcommand element specifies the single subcommand for\
    \ this extension command. In this simple example, the subcommand is unnamed.\n\
    - The Parameter element specifies the single parameter for this extension command.\
    \ The parameter is named VARIABLES and it specifies a list of variable names.\n\
    \n## Deploying an extension command\n\nTo deploy an extension command, it is best\
    \ to create an extension bundle (JAR file or Java class files) and the XML specifying\
    \ the command syntax to the bundle. You can distribute the extension bundle (spv)\
    \ file to other users who can install it and begin using your extension command.\
    \ For more information, see Core System>Extensions>Creating and editing bundles,\
    \ in the Help system.\n\n## Chapter 2. Running IBM SPSS commands\n\n### Running\
    \ IBM Statistics commands\n\nThe submit method from the Util class is used to\
    \ submit syntax commands to IBM SPSS Statistics for processing. It takes a string\
    \ that resolves to a complete syntax command, or an array of strings that resolves\
    \ to one or more syntax commands. Output from syntax commands can be written to\
    \ the standard output or an external file. It can also be directed to an in-memory\
    \ workspace where it is stored and can be retrieved using XPath expressions. See\
    \ the topic \"Retrieving output from syntax commands\" on page 15.\n\n#### Submitting\
    \ a single command\n\nYou submit a single command to IBM SPSS Statistics by providing\
    \ a string representation of the command. When submitting a single command in\
    \ this manner, a period at the end of the command is optional.\n\n```\nUtil.submit(\"\
    GET FILE=/data/Employee.sav.\");\n```\nThe submit method is called twice; first\
    \ to submit a GET command and then submit a.\n\n#### Submitting commands using\
    \ an array\n\nYou can use multiple commands as an array of strings where each\
    \ element is a representation of a syntax command. The string for each command\
    \ must be terminated with a period.\n\n```java\nUtil.submit(\"GET FILE=/data/Employee.sav.\"\
    );\nString[] cmdlines = {\"DESCRIPTIVES\",\"FREQUENCIES\"};\nUtil.submit(cmdlines);\n\
    ```\nThe submit method is called with an array that specifies a DESCRIPTIVES command.\
    \ You can also use elements of an array to represent parts of a command so that\
    \ a single array specifies one or more syntax commands. When submitting multiple\
    \ commands in this manner, each command must be terminated with a period.\n\n\
    ```java\nUtil.submit(\"GET FILE=/data/Employee.sav.\");\nString[] COMMANDS = {\"\
    Frequencies\",\n\"DESTINATION FORMAT=XML OUTPUT=/output/stats\",\n\"DESCRIPTIVES.\"\
    ,\n\"FREQUENCIES.\"};\nUtil.submit(COMMANDS);\n```\nThe submit method is called\
    \ with an array that specifies an OMS command followed by a DESCRIPTIVES command,\
    \ a FREQUENCIES command, and an OMSEND command. The first four elements of the\
    \ array are used.\n\n#### Displaying command generated by the submit method\n\n\
    For debugging purposes, it is convenient to see the completed syntax passed to\
    \ IBM Statistics by any calls to the submit method. This is enabled through syntax\
    \ command with SET PRINTBACK ON.\n\n```java\nString[] cmdlines = [\"SET PRINTBACK\
    \ ON.\",\n\"GET FILE=/data/Employee.sav\"];\nStatutil.submit(cmdlines);\nString\
    \ varName;\nvarName = Statutil.getVariableName(1);\nStatutil.submit(\"FREQUENCIES\
    \ /VARIABLES*\" + varName);\n```\nThe generated command syntax shows the completed\
    \ FREQUENCIES command as well as the GET command. In the present example the variable\
    \ with index value 1 in the dataset has the name gender.\n\n> GET FILE='data/Employee.sav'.\n\
    > FREQUENCIES /VARIABLES gender.\n\n## Chapter 3. Retrieving dictionary information\n\
    \n### Retrieving dictionary information\n\nThe Cursor, DataUtil and StatsUtil\
    \ classes provide a number of methods for retrieving dictionary information from\
    \ the active dataset. The following information is available:\n\n- Cursor.getDataFileAttributes:\
    \ The attribute values for a specified attribute.\n- Cursor.getDataFileAttributesNames:\
    \ Names of any data attributes for the active dataset.\n- Cursor.getMultiResponseSet:\
    \ The details of a specified multiple response set.\n- Cursor.getMultiResultSetNames:\
    \ The names of any multiple response sets for the active dataset.\n- Cursor.getNumericMissingValues:\
    \ The user-missing values, if any, for a specified numeric variable.\n- Cursor.getNumericValueLabels:\
    \ The labels, if any, for a specified numeric variable.\n- Cursor.getStringValues:\
    \ The user-missing values, if any, for a specified string variable.\n- Cursor.getStringLabels:\
    \ The labels, if any, for a specified string variable.\n- Cursor.getVariableAttributeNames:\
    \ The names of any custom attributes for a specified variable.\n- Cursor.getVariableAttribute:\
    \ The attribute values for a specified attribute of a variable.\n- Cursor.getVariableCount:\
    \ The number of variables in the active dataset.\n- Cursor.getVariableFormat:\
    \ The display format for a specified variable; example, F8.2.\n- Cursor.getVariableLabel:\
    \ The variable label, if any, for a specified variable.\n- Cursor.getVariableMeasurement:\
    \ The measurement level for a specified variable.\n- Cursor.getVariableName: The\
    \ variable name for a variable specified by its index position. Index positions\
    \ start with 0 for the first variable in file order.\n- Cursor.getVariableRole:\
    \ The variable role (for example, INPUT or TARGET) for a specified variable.\n\
    - Cursor.getVariableType: The variable type (numeric or string) for a specified\
    \ variable.\n- DataUtil.getVariableIndex: The index position, in the active dataset,\
    \ of a specified variable.\n- DataUtil.getVariableNames: The names of the variables\
    \ in the active dataset.\n- StatsUtil.splitVariables: The names of the split variables,\
    \ if any.\n- StatsUtil.getWeightVariable: The name of the weight variable, if\
    \ any.\n\nConsider the common scenario of running a parallel block of command\
    \ syntax only if a specific variable exists in the dataset. For example, you are\
    \ processing many datasets containing employee records and want to split them\
    \ by gender–if a variable exists–to obtain statistics for the two group members.\
    \ If we assume that a variable exists, it has the name gender, although it may\
    \ be spelled in upper or mixed case. The following sample code illustrates the\
    \ approach:\n\nExample\n\n```java\nStatsUtil.submit(\"GET FILE=data/Employee.sav\"\
    );\nDataUtil.getVariableNames();\nString[] varames = DataUtil.getVariableNames();\n\
    for (String varname : varames) {\n  if (varname.toLowerCase().equals(\"gender\"\
    )) {\n    String[] command = {\"SPLIT FILE LAYERED BY *\" + varname + \"*\"};\n\
    \    StatsUtil.submit(command);\n  }\n}\n```\n"
  mdcn: "\n\n无论是使用 JAR 文件还是独立的 Java 类，与扩展命令具有同名的类文件都应包含以下内容：\n\n- 一个该类的构造方法，该方法不带参数。\n\
    - 一个名为 `Run` 的公共静态方法，接受单个 `Hashtable` 参数，其指定方式如下：\n  `Hashtable<String, Hashtable<String,\
    \ Object>>`\n- 一个实现命令的公共方法。\n\n## XML 命令语法规范\n\n- 对于在 Java 中实现的扩展命令，`Command`\
    \ 元素的 `Language` 属性应被设置为 \"Java\"。\n- 对于使用 JAR 文件实现的 Java 命令，`Command` 元素的 `Mode`\
    \ 属性应被设置为 \"Package\"。\n\n## Java 类示例\n\n以下是一个用于扩展命令 DEMO 的 Java 类示例，该类仅简单地接收一个变量列表作为输入并打印该列表。它展示了实现代码的基本结构，以及值从命令语法（用户提交）传递到实现命令的方法的方法。同时也提供了\
    \ DEMO 命令的 XML 命令语法规范。\n\n```java\nimport java.util.Arrays;\nimport java.util.HashSet;\n\
    import java.util.ArrayList;\nimport java.util.Hashtable;\nimport java.util.List;\n\
    import com.ibm.statistics.plugin.*;\n\npublic class DEMO() {\n    public DEMO()\
    \ {\n        System.out.println(\"This is the constructor method\");\n    }\n\n\
    \    public static void Run(Hashtable<String, Hashtable<String, Object>> args)\
    \ {\n        try {\n            List<TemplateClass> testlist = Arrays.asList(testlist);\n\
    \            Extension.Template(\"VARIABLES\", \"*vars\", \"existinglist\", true);\n\
    \            \n            SyntaxObj obj = Extension.Syntax(testlist);\n     \
    \       Extension.processcmnd(obj, args, \"printvars\");\n        } catch (Exception\
    \ e) {\n            e.printStackTrace();\n        }\n    }\n\n    public void\
    \ printvars(@ParamName(\"var\") ArrayString variables) {\n        System.out.println(\"\
    variables = \" + variables);\n    }\n}\n```\n\n简而言之，`Run`、`Syntax` 和 `processcmnd`\
    \ 方法的功能如下：\n\n- IBM Statistics 解析用户提交的命令语法，并将指定的值通过单个参数 `args` 传递给 `Run` 函数（在本示例中）。\n\
    - `Run` 函数调用 `Extension.Syntax`、`Extension.Template` 和 `Extension.processcmnd`\
    \ 方法，这些方法旨在协同工作。\n\n`Extension.Template` 指定了处理扩展命令语法中特定关键字所需的详细信息。在本示例中，该扩展命令使用了单一关键字\
    \ `VARIABLES`。\n`Extension.Syntax` 根据为关键字指定的模板对传递给 `Run` 函数的值进行验证。\n\n`Extension.processcmd`\
    \ 解析传递给 `Run` 函数的值，并调用实际实现命令的方法——在本示例中，即 `printvars` 方法。\n\n注解机制还要求实现方法被定义为对象类型而非基本数据类型。特别是，你必须使用对象类型\
    \ `Integer`、`Short`、`Long`、`Float`、`Double`、`Byte`、`Character` 和 `Boolean`，而不是基本类型\
    \ `int`、`short`、`long`、`float`、`double`、`char` 和 `boolean`。在上面的示例中，`printvars`\
    \ 方法是一个字符串数组，并定义为 `ArrayList` 对象。\n\nDEMO 命令的 XML 规范如下：\n\n```xml\n<Command xmlns:xsi=\"\
    http://www.w3.org/2001/XMLSchema-instance\"\n         xsi:noNamespaceSchemaLocation=\"\
    http://example.com/XML-Schema.xsd\"\n         Name=\"DEMO\" Language=\"Java\"\
    >\n  <Subcommand Name=\"\">\n    <Parameter Name=\"VARIABLES\" ParameterType=\"\
    VariableNameList\"/>\n  </Subcommand>\n</Command>\n```\n\n- 顶层元素 `Command` 指定扩展命令的名称和实现语言。`Mode`\
    \ 属性设置为 \"Source\"，表示实现代码包含在 Java 类文件中而不是 JAR 文件。\n- `Subcommand` 元素指定该扩展命令的唯一子命令。在这个简单的示例中，子命令没有名称。\n\
    - `Parameter` 元素指定该扩展命令的唯一参数。该参数名为 `VARIABLES`，它指定了一个变量名列表。\n\n## 部署扩展命令\n\n要部署扩展命令，最好是创建一个扩展包（JAR\
    \ 文件或 Java 类文件），并将指定命令语法的 XML 包含在该其中。你可以将扩展包（spv）文件分发给其他用户，他们可以安装并开始使用你的扩展命令。更多信息请参阅帮助系统中的“Core\
    \ System>Extensions>Creating and editing bundles”。\n\n## 第2章 运行 IBM SPSS 命令\n\n\
