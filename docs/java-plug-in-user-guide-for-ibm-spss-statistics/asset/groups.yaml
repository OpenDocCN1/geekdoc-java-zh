    \ Running IBM SPSS commands\n\n    ### Running IBM Statistics commands\n\n   \
    \ The `submit` method from the `Util` class is used to submit syntax commands\
    \ to IBM SPSS Statistics for processing. It takes a string that resolves to a\
    \ complete syntax command, or an array of strings that resolves to one or more\
    \ syntax commands. Output from syntax commands can be written to the standard\
    \ output or an external file. It can also be directed to an in-memory workspace\
    \ where it is stored and can be retrieved using XPath expressions. See the topic\
    \ \"Retrieving output from syntax commands on on page 15.\n\n    #### Submitting\
    \ a single command\n\n    You submit a single command to IBM SPSS Statistics by\
    \ providing a string representation of the command. When submitting a single command\
    \ in this manner, a period at the end of the command is optional.\n\n    ```\n\
    \    Util.submit(\"GET FILE=/data/Employee.sav.\");\n    ```\n    The `submit`\
    \ method is called twice; first to submit a GET command and then submit a [text\
    \ ends here]\n\n    #### Submitting commands using an array\n\n    You can use\
    \ multiple commands as an array of strings where each element is a representation\
    \ of a syntax command. The string for each command must be terminated with a period.\n\
    \n    ```java\n    Util.submit(\"GET FILE=/data/Employee.sav.\");\n    ```\n \
    \   (Wait, the provided text seems cut off/repetitive. I will translate exactly\
    \ what is provided.)\n\n    *Self-correction: Looking at the text provided by\
    \ the user:*\n    \"The submit method is called twice; first to submit a GET command\
    \ and then submit a.\" -> It ends abruptly.\n    \"#### Submitting commands using\
    \ an array\" ... `Util.submit(\"GET FILE=/data/Employee.sav.\");`\n\n    I will\
    \ translate the text as it appears in the prompt.\n<channel|>[content]\n无论是使用\
    \ JAR 文件还是独立的 Java 类，与扩展命令具有同名的类文件都应包含以下内容：\n\n- 一个该类的构造方法，该方法不带参数。\n- 一个名为 `Run`\
    \ 的公共静态方法，接受单个 `Hashtable` 参数，其指定方式如下：\n  `Hashtable<String, Hashtable<String,\
    \ Object>>`\n- 一个实现命令的公共方法。\n\n## XML 命令语法规范\n\n- 对于在 Java 中实现的扩展命令，`Command`\
    \ 元素的 `Language` 属性应被设置为 \"Java\"。\n- 对于使用 JAR 文件实现的 Java 命令，`Command` 元素的 `Mode`\
    \ 属性应被设置为 \"Package\"。\n\n## Java 类示例\n\n以下是一个用于扩展命令 DEMO 的 Java 类示例，该类仅简单地接收一个变量列表作为输入并打印该列表。它展示了实现代码的基本结构，以及值从命令语法（用户提交）传递到实现命令的方法的方法的方法。\n\
    \n```java\nimport java.util.Arrays;\nimport java.util.HashSet;\nimport java.util.ArrayList;\n\
    import java.util.Hashtable;\nimport java.util.List;\nimport com.ibm.statistics.plugin.*;\n\
    \npublic class DEMO() {\n    public DEMO() {\n        System.out.println(\"This\
    \ is the constructor method\");\n    }\n\n    public static void Run(Hashtable<String,\
    \ Hashtable<String, Object>> args) {\n        try {\n            List<TemplateClass>\
    \ testlist = Arrays.asList(testlist);\n            Extension.Template(\"VARIABLES\"\
    , \"*vars\", \"existinglist\", true);\n            \n            SyntaxObj obj\
    \ = Extension.Syntax(testlist);\n            Extension.processcmnd(obj, args,\
    \ \"printvars\");\n        } catch (Exception e) {\n            e.printStackTrace();\n\
    \        }\n    }\n\n    public void printvars(@ParamName(\"var\") ArrayString\
    \ variables) {\n        System.out.println(\"variables = \" + variables);\n  \
    \  }\n}\n```\n\n简而言之，`Run`、`Syntax` 和 `processcmnd` 方法的功能如下：\n\n- IBM Statistics\
    \ 解析用户提交的命令语法，并将指定的值通过单个参数 `args` 传递给 `Run` 函数（在本示例中）。\n- `Run` 函数调用 `Extension.Syntax`、`Extension.Template`\
    \ 和 `Extension.processcmnd` 方法，这些方法旨在协同工作。\n\n`Extension.Template` 指定了处理扩展命令语法中特定关键字所需的详细信息。在本示例中，该扩展命令使用了单一关键字\
    \ `VARIABLES`。\n`Extension.Syntax` 根据为关键字指定的模板对传递给 `Run` 函数的值进行验证。\n\n`Extension.processcmd`\
    \ 解析传递给 `Run` 函数的值，并调用实际实现命令的方法——在本示例中，即 `printvars` 方法。\n\n注解机制还要求实现方法被定义为对象类型而非基本数据类型。特别是，你必须使用对象类型\
    \ `Integer`、`Short`、`Long`、`Float`、`Double`、`Byte`、`Character` 和 `Boolean`，而不是基本类型\
    \ `int`、`short`、`long`、`float`、`double`、`char` 和 `boolean`。在上面的示例中，`printvars`\
    \ 方法是一个字符串数组，并定义为 `ArrayList` 对象。\n\nDEMO 命令的 XML 规范如下：\n\n```xml\n<Command xmlns:xsi=\"\
    http://www.w3.org/2001/XMLSchema-instance\"\n         xsi:noNamespaceSchemaLocation=\"\
    http://example.com/XML-Schema.xsd\"\n         Name=\"DEMO\" Language=\"Java\"\
    >\n  <Subcommand Name=\"\">\n    <Parameter Name=\"VARIABLES\" ParameterType=\"\
    VariableNameList\"/>\n  </Subcommand>\n</Command>\n```\n\n- 顶层元素 `Command` 指定扩展命令的名称和实现语言。`Mode`\
    \ 属性设置为 \"Source\"，表示实现代码包含在 Java 类文件中而不是 JAR 文件。\n- `Subcommand` 元素指定该扩展命令的唯一子命令。在这个简单的示例中，子命令没有名称。\n\
    - `Parameter` 元素指定该扩展命令的唯一参数。该参数名为 `VARIABLES`，它指定了一个变量名列表。\n\n## 部署扩展命令\n\n要部署扩展命令，最好是创建一个扩展包（JAR\
    \ 文件或 Java 类文件），并将指定命令语法的 XML 包含在该其中。你可以将扩展包（spv）文件分发给其他用户，他们可以安装并开始使用你的扩展命令。更多信息请参阅帮助系统中的“Core\
    \ System>Extensions>Creating and editing bundles”。\n\n## 第2章 运行 IBM SPSS 命令\n\n\
    ### 运行 IBM Statistics 命令\n\n使用 `Util` 类的 `submit` 方法将语法命令提交到 IBM SPSS Statistics\
    \ 进行处理。它接收一个解析为完整语法命令的字符串，或者解析为一个或多个语法命令的字符串数组。语法命令的输出可以写入标准输出或外部文件。它也可以指向内存工作区，并在其中存储，可以使用\
    \ XPath 表达式进行检索。参见第15页的“Retrieving output from syntax commands”主题。\n\n#### 提交单个命令\n\
    \n你通过提供命令的字符串表示向 IBM SPSS Statistics 提交单个命令。以这种方式提交单个命令时，命令末尾的点号是可选的。\n\n```\n\
    Util.submit(\"GET FILE=/data/Employee.sav.\");\n```\n`submit` 方法被调用两次；首先提交一个 GET\
    \ 命令，然后提交一个。\n\n#### 使用数组提交命令\n\n你可以使用字符串数组来使用多个命令，其中每个元素都是一个语法命令的表示。每个命令的字符串必须以句号结束。\n\
    \n```java\nUtil.submit(\"GET FILE=/data/Employee.sav.\");\n```\n"
