    ## 7. Running Python and R Programs from Java


    The IBM SPSS Statistics BEGIN PROGRAM command provides the ability to integrate
    the capabilities of external programming languages with IBM Statistics command
    syntax. The supported languages are the Python programming language and R. This
    enables you to utilize the extensive set of scientific and statistical programming
    libraries available with the Python language and R to create custom algorithms
    that you can apply to your data. Results can be written to a dataset or the XML
    workspace and retrieved by your Java program.


    ### Python Programs


    Once you have installed the IBM SPSS Statistics - Integration Plug-in for Python,
    you have full access to the block programming language using Python code in a
    BEGIN PROGRAM PYTHON-END PROGRAM block (within command syntax) and submitting
    the command with the submit method from the StatsUtil class. For example:


    ```java

    String[] command = {"BEGIN PROGRAM PYTHON.",

    "import spss",

    "<Python code>",

    "END PROGRAM."};

    ```


    ```java

    StatsUtil.submit(command);

    ```


    - The Python system import spss the Python modules (installed with the IBM SPSS
    Statistics Plug-in for Python) that allow the Python processor to interact with
    IBM SPSS Statistics. Your Python language code follows the import statement.

    - You can omit the keyword ON BEGIN PROGRAM-it is the default.


    Complete documentation on the functionality with the IBM SPSS Statistics - Plug-in
    for Python is available in the SPSS Statistics Help system under Integration Plug-in
    for Python.


    ### R Programs


    Once you have installed the IBM SPSS Statistics - Integration Plug-in for R, you
    have full access to the R programming language including R in a BEGIN PROGRAM
    R-END PROGRAM block (within command syntax) and submitting the command with the
    submit method from the StatsUtil class. For example:


    ```java

    String[] command = {"BEGIN PROGRAM R.",

    "<R code>",

    "END PROGRAM."};

    ```


    ```java

    StatsUtil.submit(command);

    ```


    Complete documentation on the functionality with the IBM SPSS Statistics - Plug-in
    for R is available in the SPSS Statistics Help system under Integration Plug-in
    for R.


    ### Inserting Programs From Command Files


    You can use the SPSS Statistics INSERT command to include BEGIN PROGRAM-END PROGRAM
    blocks contained in command syntax files. This allows you to store your programs
    as separate code files and include them as needed.


    ```java

    StatsUtil.submit("INSERT FILE=/myprograms/program_block.sps");

    ```


    The file /myprograms/program_block.sps would contain a BEGIN PROGRAM block, as
    in:


    ```python

    BEGIN PROGRAM PYTHON.

    import spss

    <Python code>

    END PROGRAM.

    ```


    ## 8. Deploying an external Java application


    A Java application that externally invokes IBM SPSS through the IBM SPSS Statistics
    - Integration Plug-in for Java must be deployed on a machine that has a licensed
    IBM SPSS Statistics application. For information about licensing or distribution
    arrangements, please contact IBM Corp. Directly. Support for the IBM Statistics
    - Integration Plug-in for Java was introduced in version 21.


    As discussed in Chapter 1, "Getting started with the Integration Plug-in for Java,"
    on page 1, the JAR file containing the package for the IBM SPSS Statistics - Plug-in
    for Java is located in the IBM Statistics installation directory, so your application
    must be able to locate this directory. A utility distributed with the IBM Statistics
    - Programmability SDK is provided for this purpose. Software development kit (SDK)
    is available from http://www.ibm.com/developers/spssdevcentral.


    The utility provides two means for obtaining the IBM Statistics installation directory.
    You can either run a script which will write the location of the latest installed
    version of IBM Statistics to a .ini file, or you can import a file that will allow
    you to obtain that location or the locations of all installed versions of IBM
    Statistics (beginning with version 21). The components available with the utility
    can be found in the StatisticsUtil folder under the location where you extract
    the ZIP file containing the IBM Statistics - Programmability SDK.


    ### Using an ini file


    To write the location of the latest installed version of IBM Statistics (beginning
    with version 21) to an .ini file, run StatisticsUtil.bat (for Windows platforms)
    or StatisticsUtil.sh (for non-Windows platforms). The script writes the location
    of IBM SPSS Statistics to the file Statistics.ini, located in the folder that
    contains the script. Specifically, it creates a key-value pair with STATISTICS_PATH
    as the key and the location as the value-example, STATISTICS_PATH=C:\Program Files\IBM\SPSS\Statistics\21.
    If Statistics.ini already exists, the script updates the file. If Statistics.ini
    does not exist, then the script will create it.


    ### Using methods in the JAR file


    The file StatisticsUtil.Latest provides the following two methods in the Utility
    class:


    - * getStatisticsLocation() This method returns a string with the path to the
    latest installed version of IBM SPSS Statistics, starting with version 21.

    - * getStatisticsLocationAll() This method returns a string array with the path
    to all installed versions of IBM Statistics, starting with version 21.


    ### Notes


    - For instances of the client version of IBM Statistics, the term ''latest'' means
    the highest version number.

    - For instances of the server version of IBM Statistics on UNIX platforms, where
    multiple instances with the same version number may exist, ''latest'' is the one
    with the most recent time stamp.

