    ## 7. 从 Java 运行 Python 和 R 程序


    IBM SPSS Statistics `BEGIN PROGRAM` 命令提供了将外部编程语言的能力与 IBM Statistics 命令语法集成的功能。支持的语言包括
    Python 编程语言和 R。这允许你利用 Python 和 R 语言提供的大量科学和统计编程库来创建可以应用于你数据的自定义算法。结果可以写入数据集或 XML
    工作空间，并由你的 Java 程序检索。


    ### Python 程序


    一旦安装了 IBM SPSS Statistics - Integration Plug-in for Python，你就可以通过 `BEGIN PROGRAM
    PYTHON-END PROGRAM` 块（命令语法内）使用 Python 代码完全访问块结构编程语言，并使用 `StatsUtil` 类中的 `submit`
    方法提交命令。例如：


    ```java

    String[] command = {"BEGIN PROGRAM PYTHON.",

