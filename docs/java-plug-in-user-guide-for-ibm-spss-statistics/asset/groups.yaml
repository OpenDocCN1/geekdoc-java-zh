- md: "\n- • The Variable class creates the specification for a new variable to be\
    \ added to the active dataset. The first argument to the constructor is the variable\
    \ and the second argument is an integer specifying the variable type. Numeric\
    \ variables have a variable type of 0 and string variables have a variable type\
    \ equal to the defined length of the string (maximum 32767 bytes).\n\n- • addPathVariable\
    \ method of the DataUtil adds a new variable to the active dataset. The first\
    \ argument to the method is the Variable object that specifies the properties\
    \ of the variable. The second argument is an array that specifies the value for\
    \ each case in the active dataset to be populated. The third argument specifies\
    \ the index of the case at which begin populating the variable values. Case index\
    \ start with 0 for the first case in the active dataset.\n\n- • Numeric variables,\
    \ cases that are not populated are set to the system-missing value. String variables,\
    \ cases that are not populated are set to a blank value. In this example, only\
    \ the first case is populated for the variableVar.\n\n- • Variables representing\
    \ a date, or a time, in IBM SPSS Statistics are numeric variables that have date\
    \ or datetime format. In the above example, the variable date is a numeric variable\
    \ whose format has been set to DATE with the setLayout method of the Variable\
    \ object. Setting the value for case, use a Java Calendar object as shown in this\
    \ example.\n\n> Note: To save the modified dataset to an external file, use the\
    \ submit method (following the release method) to submit a SAVE command;\nStatsUtil.submit(\"\
    SAVE OUTPUT='/data/mydata.sav'\");\n\n## Example: Multiple data passes\n\nSometimes\
    \ more than one pass of data is required, in the following example two data passes.\
    \ The first pass is used to read the data and calculate a summary statistic. The\
    \ second pass is used to add a summary to the active dataset.\n\n```java\nString[1]command=\"\
    DATA LIST FREE /var (F).\";\nBEGIN DATA.\n\"40000\",\n\"21900\",\n\"Data\";\n\
    END DATA.\nStatsUtil.submit(command);\nDouble total = 0;\nDataUtil dataUtil =\
    \ new DataUtil();\nCase[] data = dataUtil.fetchCases(false,0);\nfor (Case oncase:data)\
    \ {\n  total += oncase.getDouble(0);\n}\nDouble mean = total/data.length;\nVariable\
    \ meanVar = new Variable(\"mean\",0);\ndouble[] means = new double[data.length];\n\
    for (int i=0; i<data.length; i++) {\n  means[i]=mean;\n}\ndataUtil.addPathVariable(mean,\
    \ means, 0);\ndataUtil.release();\n```\n\n## Appending new cases\n\nThe DataUtil\
    \ enables you to add new cases to the active dataset.\n\n### Example\n\nIn this\
    \ example a single case is added to the active dataset.\n\n```java\nString[1]command=\"\
    DATA LIST FREE /var (F) value (A) date(DATE).\";\nBEGIN DATA.\n\"01/01/2012\"\n\
    END DATA.\nStatsUtil.submit(command);\nCase newCase = new Case(3);\nDataUtil dataUtil\
    \ = new DataUtil();\nCalendar date = Calendar.getInstance();\ndate.set(Calendar.MONTH,\
    \ JANUARY);\ndate.set(Calendar.DAY_OF_MONTH, 1);\n```\n\n```java\nnewCase.setValue(0,\
    \ 2);\nnewCase.setValue(1, \"q1\");\nnewCase.setValue(2, 0);\ndataUtil.appendCase(newCase);\n\
    dataUtil.release();\n```\n\n- - To append a case to the active dataset, you create\
    \ a Case object that represents a single case, and populate it with the values\
    \ of the variables for the case. The variable values are populated with the setCellValue\
    \ method of the Case object. The first argument to this method is the index of\
    \ the associated variable case has index 0, the variable value has index 1 and\
    \ the variable date has index 2. The second argument to the setCellValue method\
    \ is the value of the variable for the given case.\n\n- • To specify the value\
    \ of variable with a date or datetime format, use a Java Calendar object as shown\
    \ in this example.\n\n- • The appendCase method of the DataUtil object appends\
    \ the case. Its only argument is the Case object that specifies the case.\n\n\
    - • A numeric variable whose value is not specified in the Case object is set\
    \ to the system-missing value. A string variable whose value is not specified\
    \ in the Case object will have a blank value. The value will be valid unless you\
    \ explicitly define the blank value to be missing for that variable. You can also\
    \ use an overloaded form of the setCellValue method to set the value of a specified\
    \ cell in the Case object to the Java null value, in which case it will be treated\
    \ the same as if the value of the cell was not specified.\n\n## 5. Retrieving\
    \ output from syntax commands\n\n## Retrieving output from syntax commands\n\n\
    You can retrieve output by IBM Statistics commands without writing the output\
    \ to an external file. This is accomplished by routing the output via the Output\
    \ Management System (OMS) to an area in memory where it is stored as the XML workspace\
    \ where it is an XPath DOM that conforms to the IBM SPSS Statistics XML schema.\
    \ Output is retrieved from this workspace with functions that employ XPath expressions.\n\
    \nConstructing the XPath expression (IBM SPSS Statistics currently supports XPath\
    \ 1.0) requires an understanding of the Output XML schema. The output schema spss-output-1.xsd\
    \ is distributed with IBM SPSS Statistics. Documentation is included in the IBM\
    \ Statistics Help system.\n\n### Example\n\n```java\nString[] commands={\"GET\
    \ FILE '/data/employee.data.sav';\",\n\"/IF COMMANDS=`[DESCRIPTIVES]` SUBTYPES=`[Descriptive\
    \ Statistics]`\",\n\"/DESTINATION FORMAT=XML,WORKSPACE=`desc_table`;\",\n\"/TAG=`out.\"\
    ,\n\"/DESCRIPTIVES VARIABLES=salary, salbegin, datetime, jobtime\",\n\"/OMEND\
    \ TAG=`out.\";};\nStatusResult result=status1.execute(commands);\nString handle=\"\
    desc_table\";\nString xpath=\"//[pivott[@Type='Descriptive Statistics']]\" +\n\
    \"//Dimension[@Row='salary']\" +\n\"//Dimension[@Column='Mean']\" +\n\"//Cell[@Name='Mean']\"\
    ;\nCell result=status1.evaluateXPath(handle, context);\nstatus1.deleteXPath(handle);\n\
    ```\n\n- • The OMS command is used to retrieve an output from a command to the\
    \ XML workspace. The XMLWORKSPACE keyword in the DESTINATION subcommand, with\
    \ FORMAT=XML, specifies the XML workspace as the output destination. It is a good\
    \ practice to use the desc_table here, so as not to interfere with any other OMS\
    \ command that may be operating. The identifiers used for the COMMANDS and SUBTYPES\
    \ used in the OMS can be found in the OMS identifiers box, available in the OMS\
    \ identifiers box.\n"
