    - `getStatisticsLocationAll()` 返回一个包含所有已版本 IBM SPSS Statistics（从 21 开始）路径的字符串数组。


    ### 注意事项


    - 对于 IBM Statistics 客户端实例，“最新”意味着版本号最高。

    - 对于 UNIX 平台上的 IBM Statistics 服务器实例，由于可能存在多个版本相同的实例，“最新”是指时间戳最晚的一个。


