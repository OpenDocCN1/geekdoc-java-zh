    - Integration Plug-in for Java was introduced in version 21.


    As discussed in Chapter 1, "Getting started with the Integration Plug-in for Java,"
    on page 1, the JAR file containing the package for the IBM SPSS Statistics - Plug-in
    for Java is located in the IBM Statistics installation directory, so your application
    must be able to locate this directory. A utility distributed with the IBM Statistics
    - Programmability SDK is provided for this purpose. Software development kit (SDK)
    is available from http://www.ibm.com/developers/spssdevcentral.


    The utility provides two means for obtaining the IBM Statistics installation directory.
    You can either run a script which will write the location of the latest installed
    version of IBM Statistics to a .ini file, or you can import a file that will allow
    you to obtain that location or the locations of all installed versions of IBM
    Statistics (beginning with version 21). The components available with the utility
    can be found in the StatisticsUtil folder under the location where you extract
    the ZIP file containing the IBM Statistics - Programmability SDK.


    Using an ini file


    To write the location of the latest installed version of IBM Statistics (beginning
    with version 21) to an .ini file, run StatisticsUtil.bat (for Windows platforms)
    or StatisticsUtil.sh (for non-Windows platforms). The script writes the location
    of IBM SPSS Statistics to the file Statistics.ini, located in the folder that
    contains the script. Specifically, it creates a key-value pair with STATISTICS_PATH
    as the key and the location as the value-example, STATISTICS_PATH=C:\Program Files\IBM\SPSS\Statistics\21.
    If Statistics.ini already exists, the script updates the file. If Statistics.ini
    does not exist, then the script will create it.


    Using methods in the JAR file


    The file StatisticsUtil.Latest provides the following two methods in the Utility
    class:


    +   * getStatisticsLocation() This method returns a string with the path to the
    latest installed version of IBM SPSS Statistics, starting with version 21.

    * getStatisticsLocationAll() This method returns a string array with the paths
    to all installed versions of IBM SPSS Statistics, starting with version 21.


    Notes


    +   * For instances of the client version of SPSS Statistics, the term ''latest''
    means the highest installed version. For instances of the server version of SPSS
    Statistics on UNIX platforms, where multiple instances with the same version number
    may exist on the same machine, ''latest'' is the one with the highest version
    number and most recent time stamp.

    * If there is both a client and a server of SPSS Statistics installed as the latest
    version, then the path to the server version is one returned by the getStatisticsLocationAll
    method.'
