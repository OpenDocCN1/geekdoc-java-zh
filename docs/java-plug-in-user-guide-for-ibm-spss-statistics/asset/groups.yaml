  - "[PAGE 10]\n\n# Chapter 3. Retrieving dictionary information\n\n# Retrieving dictionary\
    \ information\n\nThe Cursor, DataUtil and StatsUtil classes provide a number of\
    \ methods for retrieving dictionary information from the active dataset. The following\
    \ information is available:\n\n+   * Cursor.getDataFileAttributes. The attribute\
    \ values for a specified attribute.\n* Cursor.getDataFileAttributesNames. Names\
    \ of any data attributes for the active dataset.\n* Cursor.getMultiResponseSet.\
    \ The details of a specified multiple response set.\n* Cursor.getMultiResultSetNames.\
    \ The names of any multiple response sets for the active dataset.\n* Cursor.getNumericMissingValues.\
    \ The user-missing values, if any, for a specified numeric variable.\n* Cursor.getNumericValueLabels.\
    \ The labels, if any, for a specified numeric variable.\n* Cursor.getStringValues.\
    \ The user-missing values, if any, for a specified string variable.\n* Cursor.getStringLabels.\
    \ The labels, if any, for a specified string variable.\n* Cursor.getVariableAttributeNames.\
    \ The names of any custom attributes for a specified variable.\n* Cursor.getVariableAttribute.\
    \ The attribute values for a specified attribute of a variable.\n* Cursor.getVariableCount.\
    \ The number of variables in the active dataset.\n* Cursor.getVariableFormat.\
    \ The display format for a specified variable; example, F8.2.\n* Cursor.getVariableLabel.\
    \ The variable label, if any, for a specified variable.\n* Cursor.getVariableMeasurement.\
    \ The measurement level for a specified variable.\n* Cursor.getVariableName. The\
    \ variable name for a variable specified by its index position. Index positions\
    \ start with 0 for the first variable in file order.\n* Cursor.getVariableRole.\
    \ The variable role (for example, INPUT or TARGET) for a specified variable.\n\
    * Cursor.getVariableType. The variable type (numeric or string) for a specified\
    \ variable.\n* DataUtil.getVariableIndex. The index position, in the active dataset,\
    \ of a specified variable.\n* DataUtil.getVariableNames. The names of the variables\
    \ in the active dataset.\n* StatsUtil.splitVariables. The names of the split variables,\
    \ if any.\n* StatsUtil.getWeightVariable. The name of the weight variable, if\
    \ any.\n\nConsider the common scenario of running a parallel block of command\
    \ syntax only if a specific variable exists in the dataset. For example, you are\
    \ processing many datasets containing employee records and want to split them\
    \ by gender–if a variable exists–to obtain statistics for the two group members.\
    \ If we assume that a variable exists, it has the name gender, although it may\
    \ be spelled in upper or mixed case. The following sample code illustrates the\
    \ approach:\n\nExample\n\n```\nStatsUtil.submit(\"GET FILE=data/Employee.data.sav'\"\
    );\nDataUtil.getVariableNames();\nString[] varames = DataUtil.getVariableNames();\n\
    for (String varname : varames) {\n  if (varname.toLowerCase().equals(\"gender\"\
    )) {\n    String[] command = {\"SPLIT FILE LAYERED BY *\" + varname + \"*\";};\n\
    \    StatsUtil.submit(command);\n  }\n}\n\n```"
- md: "\n## Working with case data in the active dataset\n\nThe IBM Statistics - Integration\
    \ Plug-in for Java provides the ability to read case data from the active dataset,\
    \ create new variables in the active dataset, and append new cases to the active\
    \ dataset. The functionality for reading and writing to the active dataset is\
    \ provided in the Cursor class. An instance of the Cursor creates an open cursor,\
    \ which provides access to the active dataset. Because the following rules apply\
    \ to your use:\n\n- You cannot use the submit method from the Util class while\
    \ a data cursor is open. You must close the cursor first using the close method.\
    \ In particular, if you need to save changes made to the active dataset to an\
    \ external file, then use the submit method to submit a SAVE command after closing\
    \ the cursor.\n\n- Only one data cursor can be open at any point in an application.\
    \ To define a new data cursor, you must first close the previous one.\n\nWhile\
    \ the Cursor class provides the full set of methods for accessing the active dataset,\
    \ the simpler DataUtil class is a wrapper for the Cursor class and provides the\
    \ ability to read case, create new variables and append case. The examples in\
    \ this section use the DataUtil class. DataUtil class is a wrapper for the Cursor\
    \ class, also has limitations on cursor which apply to DataUtil objects. The following\
    \ apply:\n\n- You cannot use the submit method from the Util class while a DataUtil\
    \ object exists. You must release the resources associated with the object with\
    \ the release method. As with cursor, if you need to save changes made to the\
    \ active dataset to an external file, then use the submit method to submit a SAVE\
    \ command after releasing the DataUtil object.\n\n- Only one DataUtil object can\
    \ exist at a time. To create a new DataUtil object, you must first release the\
    \ previous one.\n\nNote: To create a new dataset, use the submit method in the\
    \ Util class to submit a DATA LIST.\n\n## Reading case data\n\nYou retrieve cases\
    \ using the fetchCases method from the DataUtil class. You can retrieve one case\
    \ at a time in sequential or you can retrieve multiple cases (including all cases)\
    \ with a single call to the fetchCases method.\n\n- System-values are always returned\
    \ as the Java null; however you can specify user-missing values are treated as\
    \ valid or returned as null. See the example on missing data.\n\n- By default,\
    \ retrieve from a variable representing a date, or a date and a time, is given\
    \ as the number of seconds from October 14, 1582. You can specify that values\
    \ retrieved from IBM Statistics variables with date or time formats be converted\
    \ to Calendar objects with the setConvertDataTypes shown in the following example:\n\
    \n- When retrieving cases, any case filtering specified with the FILTER or USE\
    \ commands is honored.\n\nExample:\n\n```\nDataUtil dataUtil = new DataUtil(\"\
    file/demo.sav\");\nif(format == CellValue.DOUBLE) {\n    numvar = onecase.getDoubleValue(i);\n\
    } else if(format == CellValue.STRING) {\n    strvar = onecase.getStringValue(i);\n\
    } else if(format == CellValue.DATE) {\n    datevar = onecase.getDateValue(i);\n\
    }\ndataUtil.release();\n```\n\n- You create an instance of the DataUtil class.\
    \ In this example, the variable datautil is a DataUtil object.\n\n- The convertDateTypes\
    \ method specifies that values read from IBM SPSS Statistics variables with date\
    \ or datetime formats will be converted to Java Calendar objects.\n\n- The FetchCases\
    \ method retrieves all cases from the active dataset. The first argument specifies\
    \ that user-using values will be treated as missing and converted to the Java\
    \ null value. The second argument specifies that from 0, it will be retrieved\
    \ from the active dataset. You can retrieve cases starting from an arbitrary number\
    \ by specifying a different value for the second argument. You can also retrieve\
    \ a subset of cases, using an overloaded form of fetchCases with a third argument\
    \ specifying the number of cases to retrieve.\n\n- The FetchCases method returns\
    \ a Case object, which represents an array of cases. The items in each element\
    \ of the array contain the values in a particular case of data from the active\
    \ dataset, file order. You can get the number of items in each case from the getCellValueNumber\
    \ method of the Case object.\n\n- The type of value in each item of a case is\
    \ available from the getCellValue method of the Case object. Values are retrieved\
    \ from the Case object with methods specific to each type of value, as shown here\
    \ for numeric, string and date values.\n\nRetrieving a subset of variables for\
    \ data will be retrieved.\n\nYou can specify a subset of variables which data\
    \ will be retrieved. You can specify the set of variables by name or by their\
    \ index position in the active dataset. Index positions start with 0 for the first\
    \ variable in file order:\n\n```\nDataUtil.subset(\"FILE/data/employee data.csv\"\
    );\ndataUtil1 = new DataUtil();\nString[] varNames = new String[](\"educ\",\"\
    salary\");\ndataUtil1.subset(varNames, true);\nCase[] data = dataUtil1.fetchCases(false,\
    \ 0);\n```\n\nThe variableFilterMethod specifies the subset of variables for which\
    \ data will be retrieved. In this example, only the data for variables id, educ\
    \ and salary will be retrieved.\n\n### Missing data\n\nThe first argument to the\
    \ FetchCases method specifies whether user-missing values are converted to a Java\
    \ null value or treated as valid data. Missing-missing values are always converted\
    \ to the Java null value.\n\n```\nString command=\"GET DATA LIST ('','/NumVar\
    \ (') string Var (a4).\";\n\"BEGIN DATA\"\n\"0\"\n\"1\"\n\"2\"\n\"3\"\n\"4\"\n\
    END DATA.\n\"MISSING VALUES (9).\";\ndataUtil.submit(command);\ndataUtil1 = new\
    \ DataUtil();\nCase[] data = dataUtil1.fetchCases(false, 0);\n```\n\nSetting the\
    \ first argument to fetchCases to false user-missing values are converted to the\
    \ Java null value. The values read from IBM Statistics variables are:\n\n1\na\n\
    b\nnull\nnull d\n\nYou can specify that user-missing values are treated as valid\
    \ data by setting the first argument to fetchCases to true. The values of data\
    \ are:\n\n1\na\nb\n9 d\n\n### Handling Data with Splits\n\nThe getSplit method,\
    \ from the DataUtil class, allows you to detect split changes when reading from\
    \ datasets that have splits.\n\n```\nString[] command=\"*DATA LIST FREE /salary\
    \ (F) jobcat (F).*\\n*BEGIN DATA;\n*21400 1;\n*45000 2;\n*30000 2;\n*103750 3;\n\
    *72000 3;\n*57000 3;\n*END DATA;\n*SPLIT TO.\";\ndataUtil.submit(command);\nStatUtil.sumfile(command);\n\
    DataUtil dataut = new DataUtil();\nint splitindex = dataut.getSplitIndex(0);\n\
    while(splitindex!=-1) {\n    System.out.println(\"new split begins at: \" + splitindex);\n\
    \    splitindex = dataut.getSplitIndex(splitindex);\n}\ndataut.release();\n```\n\
    \n- dataut.getSplitIndex gets the number of the first case in the split following\
    \ the specified case. For the sample dataset used in this example, split boundaries\
    \ are crossed when reading the 3rd and 5th cases. Cases start from 0.\n- If there\
    \ are no split boundaries following the specified case, then dataut.getSplitIndex\
    \ returns -1.\n\n## Creating new variables in the active dataset\n\nThe DataUtil\
    \ allows you to add new variables, along with their case values, to the active\
    \ dataset.\n\nExample\n\nIn this example create a string variable, a numeric variable\
    \ and a new date variable, and populate case values for them.\n\n```\nString[]\
    \ command=\"*DATA LIST FREE /case (AS5).*\\n*BEGIN DATA;\n*case;\n*case;\n*case3;\n\
    *END DATA;\nStatUtil.sumfile(command);\nVariable numvar = new Variable(\"numvar\"\
    ,0);\nVariable strvar = new Variable(\"strvar\");\nVariable datevar = new Variable(\"\
    datevar\",0);\ndatevar.setFormat(Variable.FORMAT_DATE);\nDouble[] doubles = new\
    \ Double[]{1,0.2,0.3};\nString[] strings = new String[]{\"%a\",\"%b\",\"%c\"};\n\
    Calendar calendar = Calendar.getInstance();\ndatevar.set(Calendar.YEAR, 2023);\n\
    datevar.set(Calendar.MONTH, Calendar.JANUARY);\ndatevar.set(Calendar.DAY_OF_MONTH,\
    \ 1);\nDataUtil dataUtil = new DataUtil();\ndataUtil.addVariableWithValue(numvar,\
    \ doubles, 0);\ndataUtil.addVariableWithValue(strvar, strings, 0);\ndataUtil.addVariableWithValue(datevar,\
    \ calendar, 0);\ndataUtil.release();\n```\n"
  mdcn: "\n\n## 在活动数据集中处理案例数据\n\nIBM Statistics - Java 集成插件提供了从活动数据集中读取案例数据、在活动数据集中创建新变量以及向活动数据集中追加新案例的用用。读取和写入活动数据集的功能由\
    \ `Cursor` 类提供。`Cursor` 实例会创建一个打开的游标，该游标提供了对活动数据集的访问。由于以下规则适用于规则：\n\n- 当数据游标打开时，你不能使用\
    \ `Util` 类中的 `submit` 方法。你必须先使用 `close` 方法关闭游标。特别，如果你需要将对活动数据集的更改保存到外部文件，请在关闭游标后使用\
    \ `submit` 方法提交 `SAVE` 命令。\n\n- 应用程序在任何时刻只能打开一个数据游标。要定义一个新的数据游标，你必须先关闭上一个。\n\n\
    虽然 `Cursor` 类提供了访问活动数据集的全set方法，但更简单的 `DataUtil` 类是 `Cursor` 类的封装，提供了读取案例、创建新变量和追加案例的能力。本节中的示例使用了\
    \ `DataUtil` 类。`DataUtil` 类是 `Cursor` 类的封装，对游标也有适用于 `DataUtil` 对象的限制。适用规则如下：\n\
    \n- 当 `DataUtil` 对象存在时，你不能使用 `Util` 类中的 `submit` 方法。你必须使用 `release` 方法释放与对象相关的资源。与标类似，如果你需要将对活动数据集的更改保存到外部文件，请在释放\
    \ `DataUtil` 对象后使用 `submit` 方法提交 `SAVE` 命令。\n\n- 一时间只能存在一个 `DataUtil` 对象。要创建一个新的\
    \ `DataUtil` 对象，你必须先释放上一个。\n\n注意：要创建一个新数据集，请使用 `Util` 类中的 `submit` 方法提交 `DATA\
    \ LIST`。\n\n## 读取案例数据\n\n你使用 `DataUtil` 类中的 `fetchCases` 方法检索案例。你可以一次顺序检索一个案例，也可以通过单次调用\
    \ `fetchCases` 方法检索多个案例（包括所有案例）。\n\n- 系统值始终作为 Java 的 `null` 返回；但是，你可以指定用户缺失值是处理为有效值还是返回为\
    \ `null`。请参见缺失数据的示例。\n\n- 默认情况下，从代表日期或日期的变量检索出来的值被给为自 1582 年 10 月 14 日以来的秒数。你可以通过后续示例所示的\
    \ `setConvertDataTypes` 指定从具有日期或时间格式的 IBM Statistics 变量中检索到的值转换为 `Calendar` 对象：\n\
    \n- 在检索案例时，将遵循任何通过 `FILTER` 或 `USE` 命令指定的案例过滤条件。\n\n示例：\n\n```\nDataUtil dataUtil\
    \ = new DataUtil(\"file/demo.sav\");\nif(format == CellValue.DOUBLE) {\n    numvar\
    \ = onecase.getDoubleValue(i);\n} else if(format == CellValue.STRING) {\n    strvar\
    \ = onecase.getStringValue(i);\n} else if(format == CellValue.DATE) {\n    datevar\
    \ = onecase.getDateValue(i);\n}\ndataUtil.release();\n```\n\n- 你创建了一个 `DataUtil`\
    \ 类的实例。在这个示例中，变量 `datautil` 是一个 `DataUtil` 对象。\n\n- `convertDateTypes` 方法指定从具有日期或日期/时间格式的\
    \ IBM SPSS Statistics 变量中读取的值将转换为 Java `Calendar` 对象。\n\n- `FetchCases` 方法从活动数据集中检索所有案例。第一个参数指定用户使用的值将被处理为缺失值并转换为\
    \ Java `null` 值。第二个参数指定从 0 开始从活动数据集中检索。你可以通过为第二个参数指定不同的值来从任意数字开始检索案例。你还可以使用 `fetchCases`\
    \ 的重载形式，通过第三个参数指定要检索的案例数量。\n\n- `FetchCases` 方法返回一个 `Case` 对象，该对象代表案例数组。数组中每个元素的项包含来自活动数据集（按文件顺序）中特定案例的数据值。你可以通过\
    \ `Case` 对象的 `getCellValueNumber` 方法获取每个案例中的项数。\n\n- 案例中每个项的值类型可以通过 `Case` 对象的\
    \ `getCellValue` 方法获取。通过针对每种值类型的方法从 `Case` 对象中检索值，此处显示了数值、字符串和日期值的示例。\n\n将检索数据的变量子集。\n\
