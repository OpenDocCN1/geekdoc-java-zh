    IBM Statistics - Programmability SDK 一起分发的实用程序。软件开发工具包（SDK）可以从 http://www.ibm.com/developers/spssdevcentral
    获取。


    该实用程序提供了获取 IBM Statistics 安装目录的两种方法。你可以运行脚本将最新版本 IBM SPSS Statistics 的位置写入 `.ini`
    文件，或者导入一个文件来获取该位置或所有已安装版本（从 21 开始）的位置。该实用程序的组件可以在解压包含 IBM Statistics - Programmability
    SDK 的压缩包后的 `StatisticsUtil` 文件夹找到。


    ### 使用 ini 文件


    要将最新版本 IBM SPSS Statistics（从 21 开始）的位置写入 `.ini` 文件，请运行 `StatsUtil.bat`（Windows
    平台）或 `StatsUtil.sh`（非 Windows 平台）。脚本将 IBM SPSS Statistics 的位置写入脚本所在文件夹中的 `Statistics.ini`
    文件。具体而言，它会创建一个 `STATISTICS_PATH` 为键、位置为值的键值对，例如：`STATISTICS_PATH=C:\Program Files\IBM\SPSS\Statistics\21`。如果
    `Statistics.ini` 已存在，脚本将更新该文件。如果不存在，脚本将创建它。


    ### 使用 JAR 文件中的方法


    `StatsUtil.Latest` 在类中提供了以下两个方法：


