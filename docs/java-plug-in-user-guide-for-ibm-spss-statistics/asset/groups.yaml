    # Handling Data with Splits


    The getSplit method, from the DataUtil class, allows you to detect split changes
    when reading from datasets that have splits.


    ```

    String[] command="*DATA LIST FREE /salary (F) jobcat (F).*\n*BEGIN DATA;

    *21400 1;

    *45000 2;

    *30000 2;

    *103750 3;

    *72000 3;

    *57000 3;

    *END DATA;

    *SPLIT TILE.sum(command);

    StatUtil.sumfile(command);

    DataUtil dataut = new DataUtil();

    int splitindex = dataut.getSplitIndex(0);

    while(splitindex!=-1)System.out.println("new split begins at: "++splitindex);\splitindex
    = dataut.getSplitIndex(splitindex);

    daut.release();

    ```


    +   - dataut.getSplitIndex gets the number of the first case in the split following
    the specified case. For the sample dataset used in this example, split boundaries
    are crossed when reading the 3rd and 5th cases. Cases start from 0.

    - If there are no split boundaries following the specified case, then dataut.getSplitIndex
    returns -1.


    # Creating new variables in the active dataset


    The DataUtil allows you to add new variables, along with their case values, to
    the active dataset.


    Example


    In this example we create a string variable, a numeric variable and a new date
    variable, and populate case values for them.


    ```

    String[] command="*DATA LIST FREE /case (AS5).*\n*BEGIN DATA;

    *case;

    *case;

    *case3;

    *END DATA;

    StatUtil.sumfile(command);

    Variable numvar = new Variable("numvar",0);

    Variable strvar = new Variable("strvar");

    Variable datevar = new Variable("datevar",0);

    datevar.setFormat(Variable.FORMAT_DATE);

    Double[] doubles = new Double[]{1,0.2,0.3};

    String[] strings = new String[]{"%a","%b","%c"};

    Calendar calendar = Calendar.getInstance();

    datevar.set(Calendar.YEAR, 2023);

    datevar.set(Calendar.MONTH, Calendar.JANUARY);

    datevar.set(Calendar.DAY_OF_MONTH, 1);

    dataUtil dataut = new DataUtil();

    dataaut.addVariableWithValue(numvar, doubles, 0);

    dataaut.addVariableWithValue(strvar, strings, 0);

    dataaut.addVariableWithValue(datevar, calendar, 0);

    dataaut.release();

    ```


