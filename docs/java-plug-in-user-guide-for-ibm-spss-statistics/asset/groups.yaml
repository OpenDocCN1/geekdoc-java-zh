    # # Creating text blocks


    Text blocks are created with the addTextBlock method in the StatsUtil class.


    ```

    String[] commands ={"OMS SELECT TEXTS",

    "/ LABELS -text block name",

    "/DESTINATION=HTML-OUTPUT=/output/textblock.html"};

    StatsUtil.command(commands);

    StatsUtil.addTextBlock("text block name", "The first line of text.");

    StatsUtil.addTextBlock("text block name", "The second line of text.");

    StatsUtil.command("OMENED");

    ```


    +   - In the common case you are creating text blocks along with other output
    such as pivot tables, you are probably routing the output with OMS (unless you
    are creating text blocks for an extension implemented in Java). To route text
    block output to OMS, use the SELECT keyword subcommand of OMS command. As specified
    in this example, the text block will be output in HTML.

    - The addTextBlock method must be called within a startProcedure - endProcedure
    block, as shown in this example. endProcedure define a set of output (pivot tables
    and text blocks) that are associated with a name (in this example, demo). When
    routing output to a Viewer (spv) or HTML startProcedure endProcedure blocks allow
    you to group all output under a common heading, as done for the set of output
    generated by IBM SPSS Statistics command.

    - The first argument to the addTextBlock method is a string that specifies the
    name of the text block. The name can be used on the LABELS keyword of OMS command,
    as done here, to limit the textual outputs.

    - You can append lines by calling an overloaded version of the addTextBlock method,
    supplying the same text block name, the content for the next line, and an integer
    specifying the number of lines to skip before the new line. You can also use the
    escape sequence \n to new line breaks, allowing you to put multiple lines in a
    single call to addTextBlock.


    # # Creating output for extension


    Pivot tables and blocks created from extension commands are displayed in the Viewer
    by default. If you are displaying output in the Viewer you will probably want
    to group your output under a common heading. This is done by wrapping the output
    in a startProcedure - endProcedure block, which is required for text blocks but
    optional for pivot tables. If you don''t wrap in aProcedure - endProcedure block,
    then your output will be grouped under the heading Viewer in the Viewer. This
    is a reworking of the example in "Creating pivot tables" on page 19, but wrapping
    the pivot table in a startProcedure - endProcedure block.


    ```

    Object[] rows = new Object[]{"row1","row2"};

    Object[] columns = new Object[]{"column1","column2"};

    Object[] indices = new Object[]{"IA1","IA2"};

    String title = "Pivot table";

    String name = "pivotableDemo";

    String outline = "";

    String caption = "";

    String rowDim = "Row dimension";

    String colDim = "Column dimension";

    boolean hideRowDefault = false;

    boolean hideColDimTitle = false;

    boolean hideColDimLabels = false;

    StatsUtil.startProcedure("Demo",rows,columns,labels);

    Pivotable table = new PivotTable(title, name, outline, caption, rowDim);

    ```'
