    f.setVisible(true);\n}\npublic void actionPerformed(ActionEvent e) {\nString s1=tf1.getText();\n\
    String s2=tf2.getText();\nint a=Integer.parseInt(s1);\nint b=Integer.parseInt(s2);\n\
    int c=0;\nif(e.getSource()==b1){\nc=a+b;\n}else if(e.getSource()==b2){\nc=a-b;\n\
    }\nString result=String.valueOf(c);\ntf3.setText(result);\n}\npublic static void\
    \ main(String[] args) { \nnew Component();\n} }\n\n```\nOutput\n![](image_rsrc2NG.jpg)\n\
    \n# Chapter 11: Java Data Base Connectivity\n\n`JDBC` is an application program\
    \ which creates an environment for a client to access the backend database. `JDBC`\
    \ is a part of Java Standard Edition of Oracle Corporation. `JDBC` gives us facility\
    \ to create, Configure and link the database. If we want to create an environment,\
    \ first we must make a table of database in Excel or using MySQL, next we got\
    \ to write an application program using `swing`, `AWT` or Java code for front\
    \ end client to interact with database, so we must link database file to application\
    \ program file.\n\n## 11.1 Configuration and Connectivity\n\nIn this section we\
    \ will discuss about how to create `DSN` (Data source name) and link the program\
    \ to database. A user must be aware of all these before writing an application\
    \ program. Let us take an example of Microsoft Excel database.\n\nFollowing are\
    \ the steps to create a `DSN` as well as linking:\n\n- Step 1: Create an Excel\
    \ sheet\n- Step 2: Go to Administrative tools either through proper path or control\
    \ panel and select `ODBC` (Oracle data base connectivity).\n- Step 3: Select user\
    \ `DSN` or System `DSN` and click on Add tab and add the `(.xls)` file, click\
    \ next.\n- Step 4: Select “Driver do Microsoft Excel(.xls)”.”.\n- Step 5: Give\
    \ the Data Source name as in `(.xls)` created file.\n- Step 6: Select workbook\
    \ tab and click ok\n\n## 11.2 JDBC Programming\n\nLet us write a program in `JDBC`.\
    \ We must import `java.sql` library because we are using SQL commands for e.g.\
    \ (`\"Select * from [Sheet1$]\"`) to do the necessary with database. A user must\
    \ be aware of Java exceptional handling. This program is linking with database\
    \ through `ODBC`.\n\nExample: `JDBC` program to access Excel file (`demo.xls`)\
    \ and display the content.\n\n```java\nimport java.sql.*;\npublic class JdbcDemo\n\
    {\npublic static void main(String[] args)\n{\ntry\n{\nClass.forName(\"sun.jdbc.odbc.JdbcOdbcDriver\"\
    );\nConnection con = DriverManager.getConnection(\"jdbc:odbc:demo\");\nStatement\
    \ st = con.createStatement();\nResultSet rs = st.executeQuery(\"Select * from\
    \ [Sheet1$]\");\nResultSetMetaData rsmd = rs.getMetaData();\nint numberOfColumns\
    \ = rsmd.getColumnCount();\nwhile (rs.next())\n{\nfor (int i = 1; i <= numberOfColumns;\
    \ i++)\n{\nif (i > 1)\nSystem.out.print(\", \");\nString columnValue = rs.getString(i);\n\
    ```\n"
