- fmt: "\n# Following are the list of components used in AWT.\n\n1. `Button` – It\
    \ is a class to create a labelled button. AWT gives us facility to include action\
    \ to button.\n2. `Label` – It is an object for placing text in to a container.\n\
    3. `Check Box` – It is a graphical component having two states either on(`true`)\
    \ or off(`false`).\n4. `Check Box Group` – A set of checkboxes.\n5. `List` – It\
    \ is a component which contains a list of scrolling text items.\n6. `Text Field`\
    \ – It allows us to edit single line of text.\n7.. `Text Area` – It allows us\
    \ to edit multiple line of text.\n8. `Choices` – It is a pop-up menu of choices\
    \ where selected choice will be shown on the top.\n9. `Canvas` – It is an area\
    \ to draw something.\n10. `Image` – It represents graphical image.\n11. `Scroll\
    \ Bar`- It allows user to select the range of values.\n12. `Dialog Box` – The\
    \ user can insert some form of input.\n13. `File Dialog` – The user can select\
    \ a particular file.\n\n## 9.2 AWT Programming\n\nLet us create some of the components\
    \ in a single application program using AWT rich libraries. We must import `java.awt`\
    \ library to access all facilities. To inherit all the methods and fields of parent\
    \ class we must extend the user created class.\n\nFor example: `public class Myclass\
    \ extends Frame`\n\nAll the components are initialized as well as created within\
    \ user class for e.g. `Myclass()`.\n\nA programmer must create the components,\
    \ set size and position in `Frame` or `Container`, and add the created components\
    \ to the frame.\n\n### Let us create a component (Button)\n\nSyntax: `Component\
    \ var = new Component(“Label”);`\n\nImplementation: `Button b = new Button(\"\
    Click me\");`\n\n### Now, set size and position of Component (Button)\n\nSyntax:\
    \ `component’s variable.setBounds(x-coordinate, y-coordinate, width, height);`\n\
    \nImplementation: `b.setBounds(70,140,50,20);`\n\n### We must add the component\
    \ (Button) to frame\n\nSyntax: `add(Component’s variable);`\n\nImplementation:\
    \ `add(b);`\n\nFollowing are the essential instructions for a programmer to use\
    \ during components creation.\n\n1. `setSize(height, width)` – To set the size\
    \ of a frame or container.\n2. `setTitle(“Title of Frame”)` – To set the title\
    \ of the frame according to environment.\n3. `setLayout(null)` – If layout not\
    \ required than programmer must set it to `null`. If we need Layout in any other\
    \ application than this instruction is avoided.\n4. `setVisible(true)` – Visibility\
    \ must be set to `true`.\n\nWhile keeping in mind aforementioned all discussion,\
    \ let us create some components of AWT.\n\n### 1. AWT program to create and display\
    \ button, label and Text field.\n\n```java\nimport java.awt.*;\n\npublic class\
    \ Component extends Frame {\n    Component() {\n        // creating a button,\
    \ label, text field  \n        Button b = new Button(\"Submit\");\n        Label\
    \ l = new Label(\"Employee\");\n        TextField t = new TextField();\n     \
    \   // set size and position in container\n        b.setBounds(70,140,50,20);\n\
    \        l.setBounds(60, 70, 60, 30);\n        t.setBounds(40, 100, 80, 30);\n\
    \        // add the components to container\n        add(b);\n        add(l);\n\
    \        add(t);\n        setSize(300,300);\n        setTitle(\"Label, text field\
    \ and button\");\n        setLayout(null);\n        setVisible(true);\n    }\n\
    \    public static void main(String args[]) {\n        Component f = new Component();\n\
    \    }\n}\n```\nOutput\n![](image_rsrc2N5.jpg)\n\n### 2. AWT program to create\
    \ and display multiple check Box, any one must be selected.\n\n```java\nimport\
    \ java.awt.*;\n\npublic class Component {\n    Component() {\n        // creating\
    \ the frame with the title\n        Frame f = new Frame(\"Checkbox Example\");\n\
    \        // creating the checkboxes \n        Checkbox checkbox1 = new Checkbox(\"\
    JavaScript\");\n        checkbox1.setBounds(100, 100, 80, 80);\n        Checkbox\
    \ checkbox2 = new Checkbox(\"CoreJava\", true);\n        checkbox2.setBounds(100,\
    \ 150, 80, 80);\n        // adding checkboxes to frame \n        f.add(checkbox1);\n\
    \        f.add(checkbox2);\n        f.setSize(400,400);\n        f.setLayout(null);\n\
    \        f.setVisible(true);\n    }\n    public static void main(String args[])\
    \ {\n        new Component();\n    }\n}\n```\nOutput\n![](image_rsrc2N6.jpg)\n\
    \n### 3. AWT program to create and display Choice menu of fruits.\n\n```java\n\
    import java.awt.*;\n\npublic class Component {\n    Component() {\n        Frame\
    \ f = new Frame();\n        // creating a choice component\n        Choice c =\
    \ new Choice();\n        c.setBounds(100, 100, 75, 75);\n        // adding items\
    \ to the choice menu\n        c.add(\"Apple\");\n        c.add(\"Banana\");\n\
    \        c.add(\"Orange\");\n        c.add(\"Grapes\");\n        c.add(\"Mango\"\
    );\n        f.add(c);\n        f.setSize(400, 400);\n        f.setLayout(null);\n\
    \        f.setVisible(true);\n    }\n    public static void main(String args[])\
    \ {\n        new Component();\n    }\n}\n```\nOutput\n![](image_rsrc2N7.jpg)\n\
    \n### 4. AWT program to create and display the List of fruits with scrolling facility.\n\
    \n```java\nimport java.awt.*;\n\npublic class Component {\n    Component() {\n\
    \        Frame f = new Frame();\n        // creating the list of 5 rows  \n  \
    \      List l1 = new List(5);\n        l1.setBounds(100, 100, 75, 75);\n     \
    \   // adding items to the list\n        l1.add(\"Apple\");\n        l1.add(\"\
    Banana\");\n        l1.add(\"Orange\");\n        l1.add(\"Grapes\");\n       \
    \ l1.add(\"Mango\");\n        f.add(l1);\n        f.setSize(400, 400);\n     \
    \   f.setLayout(null);\n        f.setVisible(true);\n    }\n    public static\
    \ void main(String args[]) {\n        new Component();\n    }\n}\n```\nOutput\n\
    ![](image_rsrc2N8.jpg)\n\n## 9.3 Event handling\n\nA group of Object interacting\
    \ with each other as event, AWT gives us facility to handle the event. It is a\
    \ mechanism to decide what happen when a user clicks on button, text field will\
    \ display.\n\n```java\nimport java.awt.*;\nimport java.awt.event.*;\n\npublic\
    \ class Component extends Frame implements ActionListener {\n    TextField tf;\n\
    \    Component() {\n        tf=new TextField();\n        tf.setBounds(60,50,170,20);\n\
    \        Button b=new Button(\"click me\");\n        b.setBounds(100,120,80,30);\n\
    \        //register listener\n        b.addActionListener(this);\n        add(b);\n\
    \        add(tf);\n        setSize(300,300);\n        setLayout(null);\n     \
    \   setVisible(true);\n    }\n    public void actionPerformed(ActionEvent e) {\n\
    \        tf.setText(\"Welcome to Java\");\n    }\n    public static void main(String\
    \ args[]) {\n        new Component();\n    }\n}\n```\nOutput\n![](image_rsrc2N9.jpg)\n\
    Output after clicking the button.\n![](image_rsrc2NA.jpg)\n\n# Chapter 10\n##\
    \ Swing in Core Java\n\nJava swing is a sophisticated toolkit for creating desktop\
    \ applications. Swing is more sophisticated than AWT. It uses rich set of components.\
    \ We can easily develop lightweight desktop applications using Java Swing. The\
    \ package of Java Swing provides more component than AWT such as Combo Box, Spinner\
    \ and many more.\n\n### 10.1 Components of Swing\n\nSwing components are basic\
    \ building block for developing windows-based application. It gives us much-improved\
    \ functionality over AWT.\n\nFollowing are the components used in:\n\n1. `JButton`\
    \ - The `JButton` class creates a labeled button..\n2. `JColorChooser` - It offers\
    \ a pane of controls that enable the user to manipulate and select a color.\n\
    3. `JcheckBox` - It is a GUI component that can be in either an on(`true`) or\
    \ off(`false`) state.\n4. `JRadioButton` - It can be in either an on(`true`) or\
    \ off(`false`) state. in the group\n5. `JList` – This class provides the user\
    \ with the scrolling list of text items.\n6. `JComboBox` – This component presents\
    \ the user with a pop up menu of list or choices.\n7. `JTextField` - It is a text\
    \ component that allows to edit single line of text.\n8. `JpasswordField` - It\
    \ is a text component used for password entry.\n9. `JTextArea` - It is a text\
    \ component that allows the editing of multiple lines of text.\n10. `Imagelcon`\
    \ – It paints Icons from Images.\n"
