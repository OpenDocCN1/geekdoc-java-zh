    # Java swing is a sophisticated toolkit for creating desktop applications. Swing
    is more sophisticated than AWT. It uses rich set of components. We can easily
    develop lightweight desktop applications using Java Swing.  The package of Java
    Swing provides more component than AWT such as Combo Box, Spinner, Slider and
    many more.


    10.1 Components of Swing


    # Swing components are basic building block for developing windows-based application.  It
    gives us much-improved functionality over AWT.


    # Following are the components used in Java Swing:


    # 1\. JButton - The ‘JButton’ class creates a labeled button..


    # 2\. JColorChooser - It offers a pane of controls that enable the user to manipulate
    and select a color.


    # 3\. JcheckBox - It is a GUI component that can be in either an on-(true) or
    off-(false) state.


