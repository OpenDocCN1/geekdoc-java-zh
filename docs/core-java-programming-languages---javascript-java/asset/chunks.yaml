    \ section we write (i=i+1). Finally, we get while loop as shown below.\n\n# Int\
    \ i=1;\n\n# while(i<=10)\n\n# {\n\n# i = i+1;\n\n# }\n\n# Let us write a program\
    \ in Java for table of 5 using while loop.\n\n# Example\n\n| Java code for table\
    \ of 5 using while loop | Output |\n\n|  \n\n# public class Looping\n\n# {  \n\
    \n# public static void main(String[] args)\n\n# {\n\n# int i=5;\n\n# while(i<=50)\n\
    \n# {\n\n# System.out.println(i);\n\n# i=i+5;\n\n# }\n\n# }\n\n# }\n\n |  \n\n\
    # 5\n\n# 10\n\n# 15\n\n# 20\n\n# 25\n\n# 30\n\n# 35\n\n# 40\n\n# 45\n\n# 50\n\n\
    \ |\n\n5.4 do while loop\n\n# A set of statements are executed at least once,\
    \ even if the condition is not met.\n\n# Syntax\n\n# do\n\n# {\n\n# ………..\n\n\
    # Segment of code\n\n# ………..\n\n# } while(condition);\n\n# Let us make a “do loop”\
    \ for sequential number 1 to 10\\. First, we take a loop variable (int i=1;) in\
    \ variable declaration section. Next, we must make a “Condition” so that entire\
    \ number (1-10) get covered (i<=10). Since the numbers (1-10) is in incrementing\
    \ order so in (inc or dec) section we write (i=i+1). Finally, we get do loop as\
    \ shown below.\n\n# do\n\n# {\n\n# i = i + 1;\n\n# }while(i<=10);\n\n# Example\n\
    \n| Java code for table of 7 using do while loop | Output |\n\n|  \n\n# public\
    \ class Looping {  \n\n# public static void main(String[] args) {\n\n# int i=7;\n\
    \n# do\n\n# {\n\n# System.out.println(i);\n\n# i=i+7;\n\n# } while(i<=70);\n\n\
    # }  \n\n# }\n\n |  \n\n# 7\n\n# 14\n\n# 21\n\n# 28\n\n# 35\n\n# 42\n\n# 49\n\n\
    # 56\n\n# 63\n\n# 70\n\n |\n\nChapter 6\n\n# Array in Core Java\n\n6.1 Array\n\
    \n# A group of elements sharing the common name such that each element is identified\
