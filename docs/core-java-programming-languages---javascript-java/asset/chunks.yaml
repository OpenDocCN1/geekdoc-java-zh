    \ inc or dec)\n\n# {\n\n# //Segment of code\n\n# …………\n\n# ………….\n\n# }\n\n# Let\
    \ us make a “for loop” for sequential number 1 to 10\\. First, we take a loop\
    \ variable (int i;). In initialisation section first number must be initialised\
    \ (i=1). Next, we must make a “Condition” so that entire number (1-10) get covered\
    \ (i<=10). Since the numbers (1-10) is in incrementing order so in (inc or dec)\
    \ section we write (i=i+1). Finally, we get for loop as shown below.\n\n# for\
    \ (i=1; i<=10; i=i+1)\n\n# Now let us write a program in Java to display the table\
    \ of 2 using for loop.\n\n# Example\n\n| Java code for table of 2 using for loop\
    \ | Output |\n\n|  \n\n# public class Looping\n\n# {  \n\n# public static void\
