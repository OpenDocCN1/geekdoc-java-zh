    \ 中的方法\n\n## 7.1 方法\n\n在 Java 编程中，用于特定操作的代码块被称为方法。在 c、c++ 等其他编程语言中，我们称其为函数。\n\n\
    Java 编程中使用了三种类型的方法：\n1. 内置方法\n2. 用户定义方法\n3. 抽象方法\n\n## 7.2 内置方法\n\n由语言开发者为特定语言构建的方法被称为内置方法。程序员可以导入特定的包并在程序的任何位置使用内置方法。Java\
    \ 内置方法用于字符串、数字、字符和数组。\n\n让我们在 Java 编程中使用其中一个内置方法。\n\n| 使用内置方法将给定的字符串转换为大写和小写形式的\
    \ Java 程序 | 输出 |\n| :--- | :--- |\n| ```java\npublic class Method {\n    public\
    \ static void main(String[ ] args) {\n        String txt = \"John\";\n       \
    \ System.out.println(txt.toUpperCase());\n        System.out.println(txt.toLowerCase());\n\
    \    }\n}\n``` | JOHN<br>john |\n\n## 7.3 用户定义方法\n\n由用户或程序员为特定目的创建的代码块被称为用户定义方法。用户定义方法可以在程序的任何位置调用。\n\
    \n### 示例\n\n| 使用用户定义方法相加两个数字的 Java 代码 | 输出 |\n| :--- | :--- |\n| ```java\nclass\
    \ Method {\n    // 创建一个用户定义方法\n    public int addNumbers(int a, int b) {\n   \
    \     int sum = a + b;\n        return sum;    // 返回值给 main 方法\n    }\n    public\
    \ static void main(String[ ] args) {\n        int num1 = 20;\n        int num2\
    \ = 10;\n        // 创建 Method 的对象\n        Method obj = new Method();\n      \
    \  // 调用用户定义方法\n        int result = obj.addNumbers(num1, num2);\n        System.out.println(\"\
    Sum is: \" + result);\n    }\n}\n``` | Sum is: 30 |\n\n注意：上面的程序将两个参数（`num1`, `num2`）传递给用户定义方法(`addNumbers`）以计算两个数字的和。用户定义方法返回结果作为参数。\n\
    \n## 7.4 抽象方法\n\n没有主体或实现的方法被称为抽象方法。这种类型的方法向用户隐藏了细节，并关注操作。它通过关键字 `abstract` 声明。\n\
    \n| 使用抽象方法将两个和三个数字相乘的 Java 代码 | 输出 |\n| :--- | :--- |\n| ```java\nabstract class\
    \ Multiply {\n    abstract int MultiplyTwoNum(int n1, int n2);\n    abstract int\
    \ MultiplyThreeNum(int n1, int n2, int n3);\n    public void show() {\n      \
    \  System.out.println (\"Method abstract class\");\n    }\n}\n\n// 普通类继承抽象类\n\
    class AbstractMethod extends Multiply {\n    public int MultiplyTwoNum(int num1,\
    \ int num2) {\n        return num1 * num2;\n    }\n    public int MultiplyThreeNum(int\
    \ num1, int num2, int num3) {\n        return num1 * num2 * num3;\n    }\n   \
    \ public static void main(String[] args) {\n        AbstractMethod obj = new AbstractMethod();\n\
    \        System.out.println(\"Multiplication of two numbers: \" + obj.MultiplyTwoNum(10,\
    \ 4));\n        System.out.println(\"Multiplication of three numbers: \" + obj.MultiplyThreeNum(5,\
    \ 10, 10));\n        obj.show();\n    }\n}\n``` | Multiplication of two numbers:\
    \ 40<br>Multiplication of three numbers: 500<br>Method abstract class |\n\n第 8\
    \ 章\n\n# 核心 Java 中的 Applet\n\nJava 中的 Applet 使这种语言变得更加强大。在这里，程序的输出将集成到网页中。程序员编写\
    \ Java 应用程序并保存为 `.java` 文件，之后创建一个 HTML 文件，该文件包含 `<applet>` 标签来调用 `.class` 文件。最后，输出将在浏览器或\
    \ `appletviewer` 上显示。因此 Applets 托管在 Web 服务器上。每个 applet 都会快速、可靠地运行，不需要大量的系统资源。它作为\
    \ Web 计算机的前端。\n\n以下是 Applet 的生命周期：\n1. `init()`：这是初始化变量的地方。它在 applet 运行期间会被调用一次。\n\
