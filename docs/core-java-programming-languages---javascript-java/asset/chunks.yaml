    Chapter 1


    # Introduction to Core Java


    1.1 Overview of Core Java


    # Java was developed in Sun Microsystem by James Gosling in early 1990s as a pure
    object-oriented language. Core Java is considered as subset of Java. Core Java
    also known as J2SE (Java standard edition). The core component of Java was officially
    introduced by Sun Microsystem on May, 1995.  Later in 2009 Java merged with Oracle
    Corporation, nowadays Java is the most popular language among all.


    # Coding in Core Java is very clean and easy to understand. It is much faster
    than other programming language. A compiled Java code can run in any compatible
    platform. Core Java allows us to dynamically link with new class libraries, methods
    and objects. Runtime environment of Core Java is Operating Systems like Unix,
    Windows, Linux, macOS.


    # The scope of Core Java is very wide, we can use Core Java for Android app development,
    corporate solutions, Web development and many more.


    # Following are the top ten uses of Core Java: -


    # •          Software development


    # •          Mobile app development


    # •          Web development


    # •          Games development


    # •          Desktop GUI application development


    # •          Artificial Intelligence


    # •          Business application


    # •          Cloud application


    # •          Embedded systems


    1.2 Java program execution environment


    # ![](image_rsrc2MZ.jpg)


    # ![](image_rsrc2N0.jpg)


    # ![](image_rsrc2N1.jpg)


    # Figure shows the pictorial representation of Java program execution environment.
    Here JDK (Java development kit) is a software used to execute JAVA application
    program. It is divided in two parts- JAVAC (Java compiler) & JRE (Java runtime
    environment). The JAVAC translates the incoming source code to object code known
    as Byte code. Object code file will be transferred to JVM (Java virtual machine)
    which depends on JRE (Java runtime environment) such as Windows, Linux, Unix,
    MacOS etc. So we call Java as platform independent language. Finally, output will
    be generated by JVM with the help of JRE.


    # A programmer must set the path from command prompt then compile and execute
    the program using commands given below.


    # 1\. Command to set class path


    # Go to command prompt →type and press enter


    # (Set path = c:\ program files\ java\ jdk1.8\ bin)


    # 2\. Command for compilation


    # javac filename.java (press enter)


    # 3\. Command for execution


    # java filename (press enter)


    # Note: A programmer can also use the several Development environments such as
    BlueJ, Apache, NetBeans IDE 8.0.2 to execute Java application program.


    Chapter 2


    # Basic elements of Core Java programming


    2.1 Variables and Datatypes


    # Variable is an entity to store data during program execution. Java allows us
    to use alphabetic, alphanumeric, words as a variable.


    # Example


    # Alphabetic – a- z


    # Alphanumeric – a1, b1, c1


    # Words – num, result


    # Note: We must use lowercase at beginning of any variable because JAVA is a case
    sensitive language.


    # Data is a raw fact and figure used in a program. There are five types of data
    used in Java programming known as Data types.


    # 1\. Integer: A number without decimals known as Integer. Java uses shortcut
    “int” to declare integer variables.


    # Example


    # int a=5, b1, result;


    # Note: We use “int” for 4 bytes number and “long” for 8 bytes number.  


    # 2\. Float: A number with decimals known as float. Java uses shortcut “float”
    to declare integer variables.


    # Example


    # float b=3.145, c1, result;


    # Note: We use “float” for 4 bytes number and “double” for 8 bytes number. 


    # 3\. Character: All keyboard characters are considered as character in programming.
    Java uses shortcut “char” to declare character variables. We must use single quote
    ‘ ‘ to store a character.


    # Example


    # char myChar = ‘c’;


    # 4\. String: A sequence of character known as String. Java uses shortcut “string”
    to declare character variables. We have to use double quotes “ “ to store a string.


    # Example


    # string txt = “John”;


    # 5\. Boolean: It stores either true or false values. Java uses shortcut “Boolean”
    to declare Boolean variables.


    # Example


    # char myNum = true;


    # Note: Any statement in a Java program can be closed by semicolon (;).


    2.2 Arithmetic and logical operator


    # Arithmetic operators allow us to do the common mathematical operations.


    # There are seven types of arithmetic operators used in Java programming.


    # 1\. Addition (+) – To add two values, For example (a + b)


    # 2\. Subtraction (-) – To subtract a value from another, For example (a – b)


    # 3\. Multiplication (*) – To multiply two values, For example (a * b)


    # 4\. Division (/) – It returns the division remainder, For example (a / b)'
