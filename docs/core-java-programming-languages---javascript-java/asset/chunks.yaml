    \ items. An array is a type of object in Java which is also known as a container\
    \ object. Java provides dynamic allocation facility for Array.\n\n# Example:\n\
    \n# num\n\n# num[0]​​10\n\n# num[1]​​30\n\n# num[2]​​40\n\n# num[3]​​60\n\n# Here,\
    \ name of the array is “num”, each and every element is identified by its position\
    \ so element 60 is in position 3, as we start with 0.\n\n# Note: We have used\
    \ one-dimensional array in example.\n\n# There are three types of arrays in Java:\n\
    \n# 1\\. One-dimensional array\n\n# 2\\. Two-dimensional array\n\n# 3\\. Multidimensional\
    \ array\n\n6.2 One-dimensional array\n\n# A group of elements stored in a single\
    \ line known as One-dimensional array. Syntax for declaration of an array is shown\
    \ below.\n\n# Syntax:\n\n# Data type name of array[ ] = { element 1,element 2………..,\
