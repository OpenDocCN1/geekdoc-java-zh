    \n### We must add the component (Button) to frame\n\n#### Syntax: `frame variable.add(Component’s\
    \ variable);`\n\n#### Implementation: `f.add(b);`\n\nWhile keeping in mind aforementioned\
    \ all discussion, let us create some components of Java Swing.\n\n### 1. Java\
    \ Swing program to create and display button, label and Text field.\n\n```java\n\
    import javax.swing.*;\n\npublic class Component {\npublic static void main(String\
    \ args[]) {      \nJFrame f=new JFrame(\"Java Swing components\"); \n// creating\
    \ a button, label, text field  \nJButton b = new JButton(\"Submit\");  \nJLabel\
