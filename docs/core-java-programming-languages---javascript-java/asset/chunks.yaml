    \ To reverse the element of an array, we must make a loop in decrementing order\
    \ and merge array elements\n\n# Now let us see how to handle more than one dimensions\
    \ of array in Java programming. An array with more than two dimensions are not\
    \ easy to visualize but applications are only increasing by the day. They can\
    \ also hold large amounts of data, which is a useful feature when it comes to\
    \ data analysis.\n\n# We are going to discuss about two-dimensional array.\n\n\
    6.3 Two-dimensional array\n\n# A group of elements stored in rows and columns\
    \ known as Two-dimensional array. They form a matrix of rows and columns. Syntax\
    \ for declaration of an array is shown below.\n\n# Syntax:\n\n# Data type name\
    \ of array [ ] [ ] = { {row 1}, {row2}……….., {row n}};\n\n# Implementation:\n\n\
