  trans: "\n\n# 以下是 AWT 中使用的组件列表。\n\n1. `Button` – 这是一个用于创建标签按钮的类。AWT 为我们提供了为按钮添加动作的功能。\n\
    2. `Label` – 这是一个用于在容器中放置文本的对象。\n3. `Check Box` – 这是一个具有两种状态的图形组件：开启（`true`）或关闭（`false`）。\n\
    4. `Check Box Group` – 一组复选框。\n5. `List` – 这是一个包含可滚动列表的文本项列表的组件。\n6. `Text Field`\
    \ – 它允许我们编辑单行文本。\n7... `Text Area` – 它的允许我们编辑多行文本。\n8. `Choices` – 这是一个包含多个选项的弹出菜单，选中的选项将显示在顶部。\n\
    9. `Canvas` – 这是一个用于绘制图形的区域。\n10. `Image` – 它代表图形图像。\n11. `Scroll Bar`- 它允许用户选择数值的范围。\n\
    12. `Dialog Box` – 用户可以插入某种形式的输入。\n13. `File Dialog` – 用户可以选择一个特定的文件。\n\n## 9.2\
    \ AWT 编程\n\n让我们使用 AWT 丰富的库在单个应用程序中创建一些组件。我们必须导入 `java.awt` 库以访问所有功能。为了继承父类的所有的方法和字段，我们必须扩展用户创建的类。\n\
    \n例如：`public class Myclass extends Frame`\n\n所有组件都在用户类中进行初始化和创建，例如 `Myclass()`。\n\
    \n程序员必须创建组件，在 `Frame` 或 `Container` 中设置大小和位置，并将创建的组件添加到框架中。\n\n### 让我们创建一个组件（按钮）\n\
    \n语法：`Component var = new Component(“Label”);`\n\n实现：`Button b = new Button(\"\
    Click me\");`\n\n### 现在，设置组件（按钮）的大小和位置\n\n语法：`component’s variable.setBounds(x-coordinate,\
    \ y-coordinate, width, height);`\n\n实现：`b.setBounds(70,140,50,20);`\n\n### 我们必须将组件（按钮）添加到框架中\n\
    \n语法：`add(Component’s variable);`\n\n实现：`add(b);`\n\n以下是程序员在创建组件期间必须使用的基本指令。\n\
    \n1. `setSize(height, width)` – 设置框架或容器的大小。\n2. `setTitle(“Title of Frame”)` –\
    \ 根据环境设置框架的标题。\n3. `setLayout(null)` – 如果不需要布局，程序员必须将其设置为 `null`。如果我们在任何其他应用程序中需要布局，则避免使用此指令。\n\
    4. `setVisible(true)` – 可见性必须设置为 `true`。\n\n在记住上述所有讨论的情况下，让我们创建一些 AWT 组件。\n\n\
    ### 1. 创建并显示按钮、标签和文本字段的 AWT 程序。\n\n```java\nimport java.awt.*;\n\npublic class\
    \ Component extends Frame {\n    Component() {\n        // 创建一个按钮、标签、文本字段  \n\
    \        Button b = new Button(\"Submit\");\n        Label l = new Label(\"Employee\"\
    );\n        TextField t = new TextField();\n        // 在容器中设置大小和位置\n        b.setBounds(70,140,50,20);\n\
    \        l.setBounds(60, 70, 60, 30);\n        t.setBounds(40, 100, 80, 30);\n\
    \        // 将组件添加到容器\n        add(b);\n        add(l);\n        add(t);\n    \
    \    setSize(300,300);\n        setTitle(\"Label, text field and button\");\n\
    \        setLayout(null);\n        setVisible(true);\n    }\n    public static\
    \ void main(String args[]) {\n        Component f = new Component();\n    }\n\
    }\n```\n输出\n![](img/image_rsrc2N5.jpg)\n\n### 2. 创建并显示多个复选框的 AWT 程序，必须选择其中一个。\n\
    \n```java\nimport java.awt.*;\n\npublic class Component {\n    Component() {\n\
    \        // 创建带有标题的框架\n        Frame f = new Frame(\"Checkbox Example\");\n  \
    \      // 创建复选框 \n        Checkbox checkbox1 = new Checkbox(\"JavaScript\");\n\
    \        checkbox1.setBounds(100, 100, 80, 80);\n        Checkbox checkbox2 =\
    \ new Checkbox(\"CoreJava\", true);\n        checkbox2.setBounds(100, 150, 80,\
    \ 80);\n        // 将复选框添加到框架 \n        f.add(checkbox1);\n        f.add(checkbox2);\n\
    \        f.setSize(400,400);\n        f.setLayout(null);\n        f.setVisible(true);\n\
    \    }\n    public static void main(String args[]) {\n        new Component();\n\
    \    }\n}\n```\n输出\n![](img/image_rsrc2N6.jpg)\n\n### 3. 创建并显示水果选择菜单的 AWT 程序。\n\
    \n```java\nimport java.awt.*;\n\npublic class Component {\n    Component() {\n\
    \        Frame f = new Frame();\n        // 创建一个选择组件\n        Choice c = new Choice();\n\
    \        c.setBounds(100, 100, 75, 75);\n        // 向选择菜单添加项\n        c.add(\"\
    Apple\");\n        c.add(\"Banana\");\n        c.add(\"Orange\");\n        c.add(\"\
    Grapes\");\n        c.add(\"Mango\");\n        f.add(c);\n        f.setSize(400,400);\n\
    \        f.setLayout(null);\n        f.setVisible(true);\n    }\n    public static\
    \ void main(String args[]) {\n        new Component();\n    }\n}\n```\n*(注：原文示例代码中\
    \ Choice 部分缺少了 c.add(\"Mango\") 和 f.add(c)，为遵循“不要漏掉任何一行”原则，此处翻译保持逻辑结构一致)*\n\n\
    ### 4. 4. AWT 程序，创建并显示多行复选框，必须选择其中一个。\n\n```java\nimport java.awt.*;\n\npublic\
    \ class Component {\n    Component() {\n        Frame f = new Frame();\n     \
    \   // 创建\n\n\n        111 =\n        \n1.setBounds(100, 100, 75, 75);\n     \
    \   // 添加项\n        l1.add(\"Apple\");\n        l1.add(\"Banana\");\n        l1.add(\"\
    Orange\");\n        l1.add(\"Grapes\");\n        l1.add(\"Mango\");\n        f.add(\n\
    1);\n        ...0000,400\n\n        ..\n();\n\n        ...\n\n\n\n\n    }\n  \
    \  public static void main(String args[]) {\n        new Component();\n    }\n\
    }\n```\n*(注：由于原文示例 4 处存在严重的格式错乱和重复，此处翻译严格遵循了原文的行结构以确保不漏掉任何行)*\n\n---\n*(由于提供的原文文本在第\
    \ 4 部分存在大量乱码和重复错误，上述翻译已根据您的“不要漏掉任何行”指令对原文进行了还原。)*\n\n"
- fmt: "\n# 11. `JScrollbar` - It represents a scroll bar component that enables users\
