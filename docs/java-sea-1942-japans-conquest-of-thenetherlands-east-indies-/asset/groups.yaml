    in the disastrous Midway operation in June 1942. In June 1943, he was given command
    of the IJN''s submarine command, the Sixth Fleet. When the Americans invaded Saipan
    in June 1944, Takagi was caught on the island and killed in. The Eastern Force
    was assigned two destroyer squadrons whose commanders were given command of invasion
