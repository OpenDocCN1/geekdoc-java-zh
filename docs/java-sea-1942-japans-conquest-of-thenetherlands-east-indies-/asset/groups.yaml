    # 盟军指挥体系与指挥官


    托马斯·哈特（Thomas Hart）海军将将在1939年7月25日放弃上海的奥斯塔号（*Augusta*）重巡洋舰后接到担任亚洲舰队司令的任命。托马斯·哈特是一位非常有能力的指挥官，他曾短暂指挥过ABDA联军。考虑到他所掌握的力量，他绝无法完成任务。由于未能成功守卫菲律宾而被麦阿瑟取代，并遭到荷兰人的破坏，荷兰人认为他们应该担任ABDA联军的司令。（美国海军历史与遗产司令部）


    尽管面临共同的威胁，美国、英国、荷兰和澳大利亚在战争爆发前未能建立有效的联合指挥，即使在战争开始后，他们仍在为此苦挣扎。1941年4月，美国、荷兰和英国在新加坡举行了参谋会议（澳大利亚和新西兰代表出席），但这些会议未能建立有效的合作关系。直到1941年12月至1942年1月丘吉尔与罗斯福举行了高级别会议，才就东南亚的联合指挥结构达成了协议。阿卡迪会议（Arcadia
    Conference）建立了保卫东南亚盟军领地的联合指挥部。美国人提出了一个对该地区所有海军、陆军和空军进行完全指挥的结构，并推荐阿奇伯德·韦尔尔（Archibald
    Wavell）担任首任司令。尽管对涵盖如此广阔区域且受美国人限制的指挥的潜在效能持有保留意见，英国还是同意在韦尔尔的控制下建立ABDA（美、英、荷、澳）指挥部。该指挥部涵盖了整个东印度尼群岛（NEI）、菲律宾、马来亚和缅甸。荷兰和澳大利亚在其实建立时未征求意见，而美国人和英国人占据了几乎所有重要的指挥职位。


    韦尔尔的副手是美国陆军航空（USAAF）乔治·布雷特（George Brett）中将，他的参谋长是英国军官亨利·R·庞德（Henry R. Pound）中将。美国海军将领托马斯·哈特保留了他的国家指挥权，并被任命为ABDA海军司令（也称为ADBFLOAT）。另一位美国陆军航空军刘易斯·H·布莱特（Lewis
    H. Breit）少将被任命为ABDA部队司令，直到另一位英国将军到达。ABDA陆军部队由荷兰人中将海因·波波特（Hein Poorter）指挥。ABDA指挥部从1942年1月15日正式运作的第一天起，到2月25日韦尔尔辞职时的最后一次轰炸为止，在很大程度上是无能的。


    左下图：

    威廉·格拉斯福德（William Glassford）少将（此处显示为20世纪30年代的照片）在太平洋战争爆发前接管了第5战斗队的指挥权。哈特并不认为他的力量足够强大，因为他的许多下属没有在巴利板帕潘（Balikpapan）战役中监督亚洲舰队对日本人的唯一胜利。（美国海军历史与遗产司令部）


    荷兰人受指挥安排的影响尤其，因为他们被排除在高级指挥职位之外，发现自己的部队被用于护送前往新加坡的船队。在他们看来，他们的损失最多，并贡献了盟军海军的大部分力量，但对部队如何部署几乎没有话语权。


    哈特将将是亚洲舰队的司令。他在战前就承担了这一职位，因此他清楚地知道自己部队的能力是有限。在太平洋战争开始时，他已有超过40年的服役经历。


    ![](img/9f6cbeb329885c11de35c8798e522b788_16_0.png)


    1897年毕业于海军学院，美国海军最资深的将领之一。他的性格被“硬汉托米”（Tough Tommy）这个绰号所概括。尽管被视为一名严格的纪律者，但他也被认为是公正的。他证明自己在处理保护远东美国经济和军事利益的司令部职责方面非常干练。


    当哈特接任ABDA海军司令时，亚洲舰队行动的日常职责移交给了参谋长W·R·珀内尔（W. R. Purnell）少将。威廉·格拉斯福德二世（William Glassford,
    Jr.）少将被赋予了第5战斗队的指挥权，即亚洲舰队的海上打击力量。由于他在战争初期犹豫不决的领导，他被称为“15节格拉斯福德”（15-knot Glassford）。他与哈特关系不和，哈特认为他不够激进。当哈特担任ADBFLOAT司令时，美国人希望他将亚洲舰队的指挥权移交给格拉斯福德。哈特一直避免这样做，直到1月25日格拉斯福德才发现这道命令。当他有机会为新的ABDA打击部队任命一名司令时，哈特选择了除了格拉斯福德以外的人。


    哈特担任ABDA海军司令司令的任期很短暂，并受到了麦阿瑟将军和荷兰当局的政治攻击。到2月5日，美国海军总司令埃内斯特·金（Ernest King）将领告知哈特，由于哈特应该由于健康原因被要求下台，因为他得到了荷兰、麦阿瑟、韦尔尔甚至罗斯福总统的支持。他的下台是由麦阿瑟、韦尔尔以及荷兰人推动的，荷兰人想将哈特作为未能守卫东印度尼群岛的替罪羊。截至2月12日，ADBFLOAT的位置由一位荷兰将领担任。随着哈特的离开，没有一个美国海军军官在ABDA指挥部担任过重要角色。


    康拉德·E·L·赫尔夫里希（Conrad E. L. Helfrich）中将是荷兰海军的司令。他出生于东印度尼群岛，服役多年。（注：原文此处存在大量重复的OCR错误，已按逻辑清理翻译）

