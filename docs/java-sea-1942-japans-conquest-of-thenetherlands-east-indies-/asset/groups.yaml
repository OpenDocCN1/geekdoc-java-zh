    # 敌舰队


    # 日本帝国海军


    第七战队共有四艘“云雾级”重巡洋，其中三艘出现在这张1938年的照片中，它们是冲绳大将马来亚部队中威力强大的舰只。在这些舰只中，“密仓号”（Mikura）在3月1日的巽达海峡海战中活跃，该战斗战斗导致两艘盟军巡洋被击毁。美国海军历史与遗产司令部


    在次战役中，日本帝国海军的海军力量是联合舰队。反之，联合舰队被分为若干个舰队。这些舰队是分配执行作战任务的主要力量的基础，但整个结构非常灵活；舰只和师团可以很容易地在不同舰队之间转移以满足作战需求。


    对于荷属东印度群（NEI）战役，日本海军力量被分配给第三舰队。第二舰队（也称为侦戒队）驻扎在海南岛，分配了11艘重巡洋，包括第四战队的四艘“爱宕级”巡洋、第五战队的三艘“妙级级”巡洋，以及第七战队的全部四艘“云雾级”巡洋。此外，分配给第二舰队还有第2和第4驱逐舰中队。每个中队都配有一艘排水5,500吨的轻巡洋作为旗舰，以及若干个名义兵力达12艘舰的驱逐舰师。


    驻扎在台湾的第三舰队也被称为封锁与运输部队，这很好地描述了它的战时任务。在其直接控制下有一艘重巡洋、另外两艘轻巡洋，以及第5驱逐舰中队（配备一艘轻巡洋作为旗舰和两个驱逐舰师，总共八艘舰）。此外，第一和第二基地部队被分配用于执行登陆作战。每个基地部队都由大量运输舰和较小的战斗舰组成，包括巡逻艇、扫雷艇、布雷舰、反潜艇和炮卫舰。


    值得注意的是，进攻东南亚的行动分配了联合舰队的大部分战斗舰；还有其他行动也需要联合舰队的大部分力量。其中最著名的是机动大队（Kido Butai），它被分配参加珍珠港行动，随后短暂地支持了南太平洋的行动，直到在2月初开始投入支持荷属东印度群岛战役。日本海军的战舰被留在本土水域作为战略预备，但其中一个师队带有两艘


