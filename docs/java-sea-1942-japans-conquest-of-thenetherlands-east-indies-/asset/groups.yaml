    在1920年至1925年间服役了14,500吨级巡洋舰。这些舰船配备了战争开始时分配的5.5英寸单装炮。所有舰船都携带了鱼雷发射器，但只有那些被实际分配为驱逐舰队旗舰并配备93式鱼雷的舰船如此。这些舰船包括三艘仙台级，其中“仙台号”和“犬熊号”参加了尼罗河战役。


    正如日本巡洋舰的设计比盟军对手规模更大、动力更强，日本海军的驱逐舰也是如此。日本驱逐舰为了对水面舰的进攻火力力而规模巨大；它们是出色的鱼雷艇，但并非防空和反潜战斗的均衡平台。在尼罗河战役中，这些弱点并不重要。凭借特型驱逐舰（也被称为风云级），日本海军驱逐舰以高速度和重装武装的结合设定了节奏。风云级舰船携带六门5英寸主炮和九枚鱼雷（带三轮装）。下一级驱逐舰是拥有六艘规模的初原级，携带五门5英寸主炮和带六轮装的鱼雷管。白露级引入了四联鱼雷发射器；该级配备了五门5英寸主炮和八管鱼雷管（另带一次重装）。拥有十艘规模的浅仓级在尼罗河战役中发挥了关键作用。这些舰的最高时速30节，配备了三组双装的六门5英寸炮。每艘舰携带八种型号鱼雷和另外八次重装。亚洲级的后续型号是若风级，其中几艘舰参加了尼罗河战役。该级的性能与浅仓级相似。老旧的风暴级中的一个大队也参加了尼罗河战役。这些日期于1922年的舰船携带四门4.7英寸主炮和六管21英寸鱼雷管（与之前讨论的级的24英寸管相比），且没有重装。


    # 训练


    日本海军的训练极其激烈，旨在模拟实际战斗状态。这种严苛训练的严肃性在1927年得到了体现：当时一次夜间鱼雷演习中，一艘驱逐舰在碰撞中沉没并导致104人死亡，另一艘驱逐舰严重受损导致29人伤亡，两艘巡洋舰也受损。训练节奏毫不留情，尤其是当训练在10月达到顶点时。日本海军军将这种训练描述为比实战还要艰苦。结果是为战争爆发准备了一批精良的利器。


    天津号是战期间日本海军最成功的轻巡洋舰之一。在尼罗河战役中，它履行了规定的驱逐舰队队长角色，随后参加了中威岛海战和整个瓜达尔峡战役，直到1943年7月在所罗门群岛的哥班岛海战中被美国海军巡洋舰的炮火击沉。（山本博物馆）


    ![](img/9f6cbeb32985c11de35c8798e522b788_23_0.png)


    # 夜战能力与学说


    夜战是日本海军战前训练特别强调的领域。夜战是日本海军学说的核心原则，因为这是经过高度训练的日本海军舰只扭转局势、对抗规模更大的美国海军的主要方法。随着93式入役，夜战战术从1936年开始重新调整。利用这种武器的长射程，重巡洋舰接受了在白天或夜间战斗中远程射击的训练。夜战预期在敌人陷入危险之前将其击溃。当日本海军的驱逐舰更换93式时（并非在战争开始前全部更换），它们的战术是相似的。日本人不断坚持鱼雷战术，快速装填鱼雷管是一项关键技能。训练良好的小组可以在15分钟内完成。这使得巡洋舰和驱逐舰能够发射齐射鱼雷，停火重装，然后发射第二齐射。


    日本海军在战争开始时非常重视其秘密远射学说。他们设计了利用这些武器能力的战术，使日本人能够对盟军水面舰造成打击。尽管这种武器的性能令人失望，因为只有少数数量在使用。（作者收藏）


    ![](img/9f6cbeb32985c11de35c8798e522b788_24_1.png)


    # 盟军海军力量


    致力于东尼群岛防御的盟军海军力量是不足够的。简单来说，日本海军运营了更强大的舰船和训练更良好的船员，这具有巨大的优势。在整个战役期间，盟军海军面临着严重的困境，包括后勤支持中断、燃料和弹药供应限制。通信是一个持续存在的问题，由于不同国家的存在，盟军并没有一套可以相互理解的密码，这对于其部署的舰只来说是一个持续令人头疼的问题。


    # 亚洲舰队


    美国海军在亚洲舰队的实力。马理头部号（Marblehead）是一艘奥马哈级轻巡洋舰。于1924年服役，其薄弱的防护和过旧的主炮布局使其不适合前线任务，因此它被分配到亚洲舰队。该舰队的驱逐舰均源于美国海军的一战计划。1200吨满载舰船配备了四门5英寸炮和十二22英寸鱼雷管。美国海军驱逐舰鱼雷为8型。它们存在可靠性问题，且在26节速度下最大射程为16000码。在太平洋战争开始时，这些舰船保持了同样的武器配置，增加了单门炮和三到四门50口径机枪用于防空。服役时速度可达33-34节，到1941年时……


    这张战前照片中的轻巡洋舰马头部号在战争开始时被分配到亚洲舰队。注意其前部6英寸双装炮和后部四联装的古老布局。作为为侦察设计的奥马哈级轻巡洋舰空间狭小、防护差，在战争期间被视为二流水平。1942年2月受损后进行修理。马头部号在战争剩余时间里主要在大西洋活动，寻找亚洲逃兵。


