    随后发生了更多的爆炸，这些都是盟军付出的代价。3月1日00:05左右，一枚可能来自潮风号的鱼雷击中了珀斯号的机舱。两分钟后，另一处命中使舰体内部满目疮痍。当村云号和白云号的炮火齐袭时，又有两处被命中。巡洋舰无法承受这些击打，于01:20翻覆沉没。她的686名船员随舰沉没，包括指挥官在内。在幸存者中，有106人在日军俘虏中死亡。


    鱼雷均未命中休斯顿号，但她现在孤单一人了。看到西侧道路被封锁，休斯顿号船长幸运地向南航开了包围。三仓号和雾云号的炮弹开始命中，船员记录了三次鱼雷命中，但在混乱的时刻，由于无法区分炮弹和鱼雷命中，正确的数字将无法得知。指挥官于00:25下令弃船，随后被碎片杀死。00:29，鹿饲号进入近距离并发射了最后一枚鱼雷，五分钟后，这艘巡洋舰消失了。在她1,061名船员中，有368人幸生。


    两艘盟军巡洋舰被毁的后续是埃特登号。埃特登号远眺巽达海峡的战斗，指挥官尝试沿着苏门腊沿岸向北航行。01:30，荷兰荷兰驱逐舰被村云号和白云号摧毁。在一场不平等的战斗中，日军驱逐舰点燃了这艘荷兰船。指挥官下令弃船以拯救船员。


