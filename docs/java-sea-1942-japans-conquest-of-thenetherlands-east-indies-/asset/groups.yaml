    Myoko was the first ship in the first class of UN cruisers. These ships were well
    over the 10,000 ton treaty limit that assisted Japan in building a balanced ship
    with immense firepower, high speed, and a significant degree of protection. The
    Myoko class was supported by Navy and Royal Navy cruisers and performed well during
    the war. (Yamato Museum)


    # The ships


    Imperial Japanese heavy cruisers were the spearhead of the Japanese naval advance
    into the NEI. Japanese heavy cruisers were designed to play


    ![](img/9f6cbeb32985c11de35c8798e522b788_21_0.png)'
  - '[PAGE 22]


    Ashigara, shown here in the December 1942 in drydock at the former Royal Navy
    Naval Base at Singapore, served as Vice Admiral Takashi''s flagship during the
    invasion of the Philippines and the NEL. Held in reserve, she did not get an opportunity
    to engage Allied warships until March 1, when she played a leading role in the
    destruction of Royal heavy cruiser Exeter Encounter. She remained in NEL waters
    for the remainder of her career and was sunk by the Royal Navy submarine Trenchant
    in the Bangkok Strait on June 7, 1945 (Yamamoto Museum)


    several important roles, principally as the centerpieces of night-fighting battle
    groups. The design of IJN heavy cruisers emphasized firepower, in order to perform
    their wartime roles they had to be more heavily armored than comparable US Navy
    ships and the possibility to strike at greater ranges than American cruisers.
    They were capable of conducting long-range gunnery attacks with their 8in. gun
    batteries. The Myoko class, the first of which was commissioned in 1928, was fitted
    with a main battery of ten guns. The next class to commission was the four-ship
    Atago class, also fitted with ten 8in guns. The four-ship Mogami class was originally
    commissioned as light cruisers with 15 in. guns, but before the start of the war
    was upgraded to a main battery of 10 in. guns. The maximum range of the 8in. guns
    fitted to these three classes ranged between 31,606 and 32,133 yards. The Japanese
    believed that the fire-control equipment fitted to their cruisers gave 8in. guns
    an effective engagement range of 21,873 yards, but they often engaged targets
    at even longer ranges. However, at extended ranges the twin-gun boiler suffered
    from significant dispersion problems which affected accuracy.


    Additionally, IJN heavy cruisers were fitted with a heavy torpedo battery. At
    the start of the Pacific War, Myoko-class carried 16 torpedo tubes and 18 reload
    torpedoes. This was matched by two ships in the Atago class, but the Mogami class
    carried only 12 torpedo tubes with relays. In 1938, Japanese heavy cruisers were
    provided with a top secret torpedo – the Type 93 Model 1 Modification 2. This
    was a formidable weapon, superior to any Allied torpedo. It carried a 1,082-pound
    warhead, was wireless since it was oxygen propelled, and had a range up to 43,746
    yards at 36 knots. However, there was a potential downside. Carrying such powerful
    weapons greatly enhanced the firepower of IJN heavy cruisers, but there presented
    a real danger if the unprotected warheads were hit during the combat. This occurred
    aboard IJN heavy cruisers several times during the war and the results were devastating.


    Imperial Japanese light cruisers were less formidable, since their primary mission
    was to act as flagships for destroyer squadrons. The IJN'
- md: '

    commissioned 14,500-ton cruisers between 1920 and 1925. These were fitted with
    5.5in. single mounts assigned at the start of the war. All carried torpedo mounts,
    but only those actually assigned as destroyer squadron flagships with the Type
    9 torpedo. These ships included three Sendai classes, two of which, Naka and Inaguma,
    were active in the Nile campaign.


    Just as Japanese cruisers were designed to be larger and more powered armed than
    their Allied counterparts, the same held true for IJN''s destroyers. Japanese
    destroyers were massive for offensive punch against surface ships; they were superb
    torpedo boats, but were not well-rounded platforms for aerial and antisubmarine
    combat. In the Nile campaign, these weaknesses did not matter. Being with the
    Special Type destroyer (also known as the Fubuki class), IJN destroyers set the
    pace with a combination of high speed and heavy armament. Fubuki-class ships carried
    six 5in. guns and nine torpedoes with three loads. The next class of destroyers,
    the six-ship Hatsuhara class, carried five 5in. guns and torpedo tubes with six
    loads. The Shiratsuyu class introduced the quadruple torpedo mount; this class
    was fitted with five 5in. guns and eight torpedo tubes with another reload. The
    ten-ship Asakura class played a pivotal role in the Nile campaign. These ships
    had a top speed of 30 knots and were armed with six 5in guns in three dual mounts.
    Each ship carried eight torpedo types and another eight reloads. The follow-on
    to the Asiatic class was the Kagero class, several of which were active in the
    Nile campaign. This class had similar capabilities to the Asakura class. A division
    of the older Kamikaze class also saw action during the Nile campaign. These ships,
    dating from 1922, carried four 4.7in. guns and six 21in. (compared to the 24in.
    tubes in the classes already discussed) torpedo tubes with no reloads.


    # Training


    Imperial Japanese Navy training was extremely intense and was meant to simulate
    actual battle conditions. The seriousness of such rigorous training is displayed
    in 1927 when a night torpedo exercise a destroyer was sunk in a collision with
    the loss of 104 men, another destroyer was heavily damaged with 29 more casualties,
    two cruisers were also damaged. The pace of training was relentless, especially
    when the training culminated in October. Imperial Japanese Navy officers described
    the training as tougher than actual combat. The result was a finely honed instrument
    for the beginning of the war.


    Jintsu was one of the IJN''s most successful light cruisers during the war. She
    was used in her intended role as the leader of a destroyer squadron during the
    Nile campaign and then later at Midway and through the Guadal campaign, until
    being sunk by US Navy cruiser gunfire in the battle of Kolombangara in July 1943
    in the central Salomons. (Yamamoto Museum)


    ![](img/9f6cbeb32985c11de35c8798e522b788_23_0.png)


    # Night combat capabilities and doctrine


    Night combat was an area of special emphasis in IJN pre-war training. Night combat
    was a central tenant of Japanese naval doctrine, since it was the primary method
    by which highly trained IJN ships could turn the tables on the larger US Navy.
    Night combat tactics reworked after the Type 93 entered service, beginning in
    1936. Using the long range of this weapon, the heavy cruisers were trained to
    fire at their range in day or night combat. Night combat firing was expected to
    cripple the enemy before he was in danger. When the IJN''s destroyers replaced
    the Type 93, and not all before the start of the war, their tactics were similar.
    The Japanese constantly resisted torpedo tactics, with quick reloading of torpedo
    tubes being a key skill. A well-trained crew could accomplish this in 15 minutes.
    This allowed cruisers and destroyers to fire a salvo of torpedoes, disable to
    reload, and then fire a second salvo.


    The IJN placed importance on its top-secret long-range doctrine at the start of
    the war. They had devised tactics to utilize the capabilities of these weapons
    which gave the Japanese ability to inflict blows against Allied surface ships.
    Although the performance of this weapon was disappointing, since only three out
    of the large numbers that were expended. (Author''s Collection)


    ![](img/9f6cbeb32985c11de35c8798e522b788_24_1.png)


    # ALLIED NAVAL FORCES


    Allied naval forces committed to the defense of the NEI were inadequate for the
    task. Simply put, the IJN operated more powerful ships with better-trained crews
    and had the massive advantage of operating with a powerful naval arm. Allied naval
    forces operated throughout the campaign with significant handicaps including a
    confusing situation, lack of fighter cover, and lack of reconnaissance. During
    the campaign, Allied naval forces were subjected to increasing strain. Logistics
    support broke down, limiting supplies of fuel and ammunition. Communications were
    a constant problem, since four different nations were present. The Allies did
    not possess a set of mutually intelligible codes for even basic, a constant headache
