    The Japanese attack on Palembang was spearheaded by 360 JJA paratroopers. Their
    orders were to seize the oil wells, pumps, and refineries before the Dutch could
    destroy them. Fierce initial resistance from Allied troops prevented the paratroop
    drop, however, being entirely successful, but Allied resistance was crushed in
    two days. (US Naval History and Heritage Command)


    Sumatra. Not only were there two major airfields, but most importantly for the
    Japanese, it was the site of two major oil refineries and large oil fields. Though
    located well inland, Palembang was vulnerable to a seaborne invasion, since it
    was located on the Moesi River which was navigable to large ships.


    Released from covering convoys to Malaya to support the campaign against Singapore,
    the IJN Western Force prepared a large operation to strike at Palembang. To escort
    heavy cruisers, Vice Admiral Ozawa collected five heavy cruisers, light cruiser
    *Sendai*, and 11 destroyers. Light carrier Ryuyo (with 12 fighters and 15 B5N1
    “Kate” attack embarked), was also shifted from the Eastern Force to provide support.
    This invasion force departed Cam Bay in Indochina on February 10 and headed south.


    The Allies had been watching this major concentration and made plans to stop it.
    A submarine attack by a US Navy submarine on February 11 was unsuccessful, as
    were two British air attacks. Doorman’s Striking Force was also ordered to meet
    the small Dutch naval base of Oost on the southeastern part of Sumatra to interpret.
    Vice Admiral Hellrich, who formally took over command of ABDA naval forces on
    February 12, allocated what to him on the surface appeared to be a formidable
    force – Dutch cruisers *De Ruyter, Java, and Tromp*, British cruiser Exeter, Australian
    cruiser Hobart, six US destroyers, and four Dutch destroyers. With this significantly
    reinforced force, Hellrich ordered Doorman to attack the Japanese invasion convoy.
    Accordingly, the Striking Force departed Oostshaven on the afternoon of February
    14.


    On February 15, Doorman was taking his striking force to attack the Japanese invasion
    force off Palembang. All Allied cruisers were bombed throughout the day by the
    Japanese air force sorties. Here, Java is shown under attack. She suffered only
    minor splinter damage being the focus of several waves of bombers. (Netherlands
    Institute for Military History)


    De Ruyter suffered no damage from the February 15 air attacks. However, with the
    element of surprise gone Doorman called off the operation. (Netherlands Institute
    for Military History)


    Bad luck dogged the operation from the start. In the early morning hours of the
    15th, the Dutch destroyer Van Ghent ran hard against the Stolze Strait between
    Bank and Billington. The ship was a total loss, and Doorman assigned another Dutch
    destroyer to take off the crew and scuttle the ship. The element of surprise was
    lost later when, at 0923hrs a Japanese cruiser floatplane sighted the Striking
    Force. Air attacks followed. The first was at 1020hrs when four B5N1 “Kates” from
    Ryujo selected Exeter for attention. The aircraft dropped 550-pound bombs from
    high altitude, but no hits. This first attack was followed by a larger effort
    by 23 GMs flying from Borneo. From high level, they caused only minor damage to
    two American destroyers. Seven B5Ns made an appearance at 1130hrs and attacked
    Exeter, again causing only minor damage. At this point, Doorman cancelled the
    operation. However, the ordeal of the Striking Force was not over. Two more groups
    of land-based bombers with 44 aircraft in total arrived to make high-level attacks.
    No hits were scored. Also unsuccessful were 19 B5Ns from Ryujo in three groups.
    The day-long encounter between the Striking Force and the IJN’s Air Force ended
    in a draw. No hits except near misses and no aircraft were shot down. But the
    largest Allied force gathered forced to abort its attempt to thwart a Japanese
    invasion. As a result, the invasion of Palembang proceeded impeded. Its success
    forced the Allied evacuation of Sumatra.


    Japanese air power continued to dominate the theater. On February 15, Japanese
    bombers from Kendari attacked an Allied reinforcement convoy for Timur. Though
    no hits were scored, mainly because the bombers


    ![](img/9f6cbeb32985c11de35c8798e522b788_45_0.png)


    Dutch destroyer Van Ness was a victim of Japanese air power. On February 17, the
    destroyer was sent to evacuate the garrison from Billington. After the two ships
    were spotted by a Japanese cruiser floatplane and then subjected to concentrated
    air attack by 15 GMs and ten Kates from Ryujo, the destroyer was hit by three
    bombs from Ryujo and quickly sank with the loss of 68 crewmen.(US Naval History
    and Heritage Command)


    ![](img/9f6cbeb32985c11de35c8798e522b788_45_0.png)

    ![](img/9f6cbeb32985c11de35c8798e522b788_46_0.png)

    ![](img/9f6cbeb32985c11de35c8798e522b788_47_0.png)


    In a remarkable display of marksmanship, Japanese dive bombers hit the destroyer
    five times on the morning of February 19. The ship was surrounded by blazing,
    as shown in this view. Only 53 of its crew survived; another 80 died. US Navy
    History and Command


    The convoy was ordered to return to Darwin, Australia, which was the main base
    used to fuel reinforcements and the slower and less maneuverable transports. On
    February 17, land-based bombers and B5NIs from Ryujo sank a Dutch transport with
    heavy loss of life.


    ## THE BATTLE OF BADOENG STRAIT


    The Japanese crept closer to Java. On February 20, they landed a regiment on Timor
    Island. The defending garrison was defeated in three days. The loss of the island
    and its airfield cut the transport route for aircraft flying from Australia to
    NEL. A more immediate threat to Java was a Japanese operation targeted at Bali,
    located just to the east of Java. If the Japanese could catch up with the pressure
    on facilities on Java and dominate the southern approaches, cutting all reinforcement,
    the plan to deliver the landing to Sanor on the southeastern coast of Bali on
    the Badoneg Strait was risky, since it was so close to major air and naval bases.
    The force was put out by two transports, and these escorted by four Asashio-class
    destroyers. Per Japanese doctrine, the landing would take place at night light
    cruiser Nagara and three more destroyers were positioned to the north to provide
    constant support. This force departed Makassar on February 17.


    If ABDA had a real chance of repelling a Japanese invasion, or at least gaining
    a local victory, the Japanese invasion of Bali was opportunity. However, the timing
    of the operation caught Hellrich off guard, since, as usual, the bulk of his naval
    units were assigned to escorting convoys. He had to quickly reassemble a striking
    force and send it into the Badong Strait. Because of the difficulty in doing so
    quickly, and not wanting to take the extra time to bring available forces into
    a single striking force to overwhelm the Japanese, Hellrich came up with remains
    to guard or defend. The available Allied ships were at Soerabaja, Tiljatap, and
    Rantai Bay on the southeastern coast of Sumatra. The missing of the invasion force
    at Makassar was known to Hellrich, his destination remained unclear. In spite
    of this awareness, Hellrich was caught off guard when the Allied objective was
    revealed to be held. He and Doorman conferred on February 17 to handle this, and
    devised a plan for a counterattack on the night of 19–20. The ships were coming
    from different bases, the plan was for the attack to develop in three waves. The
    first wave was comprised of the available ships from Tiljatap which would enter
    the Badong Strait from the south, conduct its attack, and then continue north
    and head to Soerabaja. This force included the cruisers De Ruyter and Java, Dutch
    destroyers Korter and Piet Hein, and American destroyers Poe and John D. Ford.
    The second wave was comprised of the ships from Soerabaja and Rantai Bay (Stewart,
    Parrott, John D. Edwards, and Pillsbury) from the south into the Badong Strait
    to attack the Japanese before returning to Soerabaja by way of the Strait. The
    third wave was comprised of Dutch torpedo boats, which would also attack from
    the south.


    The plan was flawed on a number of counts. Allied aircraft had reported a much
    larger force—two cruisers, up to six destroyers, and four transports, making it
    essential for Hellrich to miss his forces. The attack had already occurred in
    the early morning hours of February 19 and no Allied units could arrive in time
    to change that. Hellrich would have united his available ships into what might
    have been an overwhelming force. But he did not think time was adequate to effect
    a rendezvous of the ships from several bases, and any such rendezvous would have
    to be conducted at night, increasing the difficulty of. In any case, the inclusion
    of the torpedo boats into a united striking force was impossible, due to considerations
    of speed and endurance. Hellrich seems to have viewed his attack as a series of
    raids, rather than an all-out battle.

