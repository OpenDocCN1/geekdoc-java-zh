    Tactical command of Dutch naval forces and later command of ABDA''s Combined Striking
    Force when it was established on February 1 was given to Rear Admiral Karel W.
    F. M. Doorman. He was a 1910 graduate of the Royal Netherlands Naval College and
    became a naval aviator in 1915. After a Naval Staff course and various command
    tours on destroyers and cruisers, he was appointed commander of the Naval Air
    Service on the NEL. This was followed by a promotion to flag in May 1940 and the
    assumption of the command of the East Indies Squadron. Doorman was a difficult
    figure to assess, especially in light of his actions during the campaign. He was
    undoubtedly competent and respected by his peers and subordinates in the Royal
    Netherlands Navy. He could be charming and showed obvious care for the men under
    his command.


    ![](img/9f6cbeb32985c11de35c8798e522b788_18_0.png)


    Days after being appointed commander of the Combined Striking Force, he led an
    illfated operation to attack Japanese shipping at Makassar. In consultation with
    Hart, he selected a direct route to the target and showed Two Americans were damaged
    by intense attack. With heavy casualties and Doorman was rattled by the affair.
    Doorman subsequently ordered another operation to attack an invasion convoy being
    subjected to attack. By the eve of the Java Sea battle, the other Allied naval
    commanders were fed up with Doorman. He had achieved much in his tenure as commander
    of the Striking Force and “run away” on several occasions. There was no talk of
    relieving him on the eve of the battle, but it was unwise to replace the commander
    at a late stage, so Doorman remained in charge. Under pressure from Helfrich,
    and perhaps determined to ally fears he was not a fighter and to defend for his
    homeland, with the defeat of the Java Sea showed a real tenacity to combat and
    defeat the Japanese, whatever the cost. This determination came at the price of
    the destruction of his command had lost his reputation as being brave but stupid.
    Better deserved then and now, since he was caught in an impossible situation commanding
    an inferior force trying to carry out the orders of his superior who had little
    consideration for the men under his command.


    Rear Admiral Doorman was the man charged with executing Helfrich''s orders to
    attack the onslaught Japanese with relentless determination. He was unable to
    conduct an effective attack at any point during his tenure as commander of the
    Combined Striking Force. In his final action, he attacked with the determination
    that Helfrich demanded, but at the cost of his home march of the force under his
    command. (Netherlands Institute for Military History)


    British naval forces were initially under the command of Admiral Tom Philips until
    his death on his flagship Prince of Wales on December 10. Vice Admiral Geoffrey
    Layton took back his old job as commander of the Eastern Fleet upon the death
    of Philips. British naval forces in the ABDA area were technically under the command
    of the Eastern Fleet. Laymon in this position much, when Vice Admiral Sr Somerville
    arrived with reinforcements for the Eastern Fleet. Commodore John A. Collins,
    RAN, exercised actual control of British naval units in the NET.'
