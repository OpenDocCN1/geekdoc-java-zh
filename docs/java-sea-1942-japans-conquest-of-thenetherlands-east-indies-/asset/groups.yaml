    ## ANALYSIS


    The battle of the Java Sea was one of the largest surface battles of the Pacific
    War. A total of 32 ships took part, and of these five were sunk, all to another
    eight damaged (two Allied and six Japanese). In addition to Java Sea, there were
    four other major surface actions fought during the campaign. Of the Dutch Navy''s
    three subs, Tromp remained afloat. The Asiatic losses each tell the story. In
    only one of these, Balikpapan, could the Allies be considered victorious. Three
    cruisers and seven destroyers available at the start of the campaign, only light
    cruiser remained. Asiatic Fleet''s losses were considerable, but not as drastic.
    Three cruisers began the war, and two (Boise and Marblehead) survived. Both navies
    had fought with determination, but for little effect. Though the Royal Navy never
    supported the defense of the NEI, Seven of the fleet''s 13 destroyers also survived.
    British losses totaled one heavy cruiser and four destroyers. The Australians
    lost a light cruiser.


    At the start of the campaign, the RNN had 12 operational subs more in overhaul
    or reserve. In the NEI there three more. This is K-XIII photographed in 1942 and
    only carried torpedoes. Like the more numerous US submarines were ineffective
    and attacking Japanese forces in the NEI. Four Dutch subs were lost during the
    campaign. In the final days of the campaign, K-X, K-XIII, and K-VIII were trapped
    in Orabaja and scattered (US Naval history and Heritage Command).


    The IJN had accomplished the utterly essential mission of seizing the NEI and
    its critical resource facilities quickly. In so doing, no Japanese landing was
    halted or delayed. There were occasions when sloppy tactical dispositions provided
    the Allies with the chance of inflicting local reverses, but the Allies were too
    unlucky or weak to take advantage of them. Japanese naval losses were light during
    the campaign. Allied surface naval units did


    ![](img/9f6cbeb32985c11de35c8798e522b788_89_0.png)


    This trumpet recovered from the USS Houston. The ship is a war grave, but in recent
    years there has been a very disturbing trend of Indonesian scrapers salvaging
    wrecks in the former NEI. While Houston remains apparently in good ships, some
    of the other ships like Perth and the American and British destroyers are almost
    entirely gone. (US Naval History and Heritage Command)


    ![](img/9f6cbeb32985c11de35c8798e522b788_90_0.png)


    not sink a single large IJN combatant during the campaign, and only at Balikpapan
    did Allied forces sink anything. The Dutch accounted for the majority of the Japanese
    transports and combatants lost during the campaign, but these losses were far
    below what the Japanese planned for. The largest combatant lost by the Japanese
    in the NEI was a destroyer. Three were lost – one to an Allied submarine, to a
    Dutch submarine, and the third to Dutch aircraft. Other losses included one submarine,
    four minesweepers, and a patrol boat. In addition, at least 14 transports were
    sunk.


    At the operational level, both sides made serious errors. In the Badeng Strait,
    Helfrich was caught off guard and his plan was too complicated. The run-up to
    the Japanese invasion of Java, Helfrich was foolish to think that he could repel
    both the eastern and western Japanese threats against Java, and his creation of
    two striking forces dissipated his already inadequate assets. His only hope for
    success was to create a single powerful striking force and make all efforts to
    provide with adequate reconnaissance and air cover. He failed to ensure that the
    remaining Allied air assets supported reconnaissance. Had adequate aerial reconnaissance
    supported a strengthened striking force, it might have been possible to deliver
    a serious blow, maybe even strong enough to delay or defeat one of the landings
    forces. None of this is to say that the Allies ever had a real chance to defend
    Java from seaborne invasion. The balance of forces, both quantitatively and qualitatively,
    was too uneven. In the final analysis, the record of Allied naval forces in the
    campaign, culminating in the battle of Sea, was a parade of defeats. The one exception
    was the opening battle at Balikpapan, when bold action created surprise and the
    Allies a local success. Even so, it should be pointed out that this success resulted
    in no delay in the Japanese timetable for conquering the NEI.


    The Japanese deployed their naval forces poorly during the campaign, thus creating
    possible openings for the Allies. In spite of the fact that the Eastern Force
    was operating nearest to the principal Allied naval base at


    ![](img/9f6cbeb32985c11de35c8798e522b788_91_0.png)


    Soerabaya, it was significantly weaker than the Western Force. Japanese gunnery
    was also disappointing. Pre-war doctrine called for long range, since the Japanese
    believed they could deliver punishments beyond the reach of their enemies. In
    pre-war exercises, they assessed 6 percent of


    ![](img/9f6cbeb32985c11de35c8798e522b788_92_0.png)


    Using this wartime shame of the Balikapan refinery, the Japanese boasted of how
    quickly engineers managed to restore oil in the NEI. In fact, the Dutch destruction
    of these facilities was incomplete, and the Japanese were quickly able to restore
    production. (US Naval History and Command)


    in. shells would hit at long range. This proved wildly optimistic, since at Java
    Sea only five of the 1,619 8in. shells hit their target. As was the case with
    the Type 93, the low accuracy rate was mitigated by the fact that one of the shells
    played a major role in determining the battle''s result. Light cruiser gunnery
    by Naka and Jintsu was also poor with only a single round of the 221 5.5in. Destroyer
    gunnery was better ce it was conducted at shorter range. Of the 515 5in. rounds
    expanded, ver Electra and led to her loss. Similar results were in evidence in
    the action against Exeter. Of 1,171 8in. rounds fired, two. Of 35 torpedoes fired,
    only one hit.


    The failure of the Combined Striking Force to stop the Japanese invasion forces
    meant the Japanese were able to land at three places on Java on February 28 and
    March 1. Dutch attempts to contain the landings were futile. By March 8, Soerabaya
    was captured, and the following day Dutch forces on Java surrendered. With the
    surrender of Dutch troops on Sumatra March 28, the NEI passed to Japanese control.
    The Japanese had succeeded in accomplishing their most important early-war objective.
    The oilfields on Java and Sumatra were quickly brought back on line. They were
    sufficient for Japan''s wartime needs, as the war dragged on the Japanese were
    increasingly unable to move the oil or refined products to the Home lands. Java
    and the great majority of the NEI remained in Japanese hands throughout the war.

