    ![](img/9f6cbeb32985c11de35c8798e522b788_29_1.png)


    外国对应型号。最现代的船只“鲁伊特号”（De Ruyter）于1935年下水，配备了七门5.9英寸炮。她没有携带鱼雷，防空火力不足且装甲薄弱。“爪哇号”于1921年下水，基于德国轻巡洋舰的设计，携带了十门5.9英寸炮，全部为单基座，其中七门可以齐射射击。


    荷兰海军（RNN）的东印度分队在火力、防护和速度上完全是二流轻巡洋舰。有三艘巡洋舰服役，但都不如日本重巡洋舰。荷兰东印度群岛的海军力量并未对战争爆发做好准备。荷兰有七艘驱逐舰服役。它们属于同一型号，基于英国设计，从1925年开始在荷兰建造。每艘携带四门单基座4.7英寸炮和六具鱼雷管。


