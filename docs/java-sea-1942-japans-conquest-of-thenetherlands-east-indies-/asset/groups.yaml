    The Japanese destroyers shifted their attention to Tromp when she used her searchlight
    to signal the American destroyers. From a range of 3,300 yards, Asahi pounded
    Tromp with 11 in shells causing extensive damage to her topside equipment. Oshio
    missed the cruiser with a salvo of torpedoes. At 0216hrs, Tromp missed a 5.9in
    shell on Oshio''s bridge, killing seven. Tromp and all four American destroyers
    continued retreating to the east.


    The next phase of the battle featured Arashi and Michishio, which were heard south
    to the sound of the guns. At 0215hrs, Michishio spotted two contacts, and used
    her searchlight to illuminate them. They were Stewart and John D. Edwards. Both
    American destroyers, joined by Pillbury, took Michishio under fire with their
    4in guns and six torpedoes. Surprised Japanese cruiser was caught in a deadly
    crossfire. All the torpedoes missed, but a 4in shell hit the destroyer''s Number
    2 5in mount, destroying its captain. Tromp followed this with three more shells
    in the Japanese destroyer''s engine room, which brought her to a halt. The Allied
    ships not longer able to finish off the crippled destroyer, but continued to the
    northeast and broke contact.


    Stewart was sent to the Baodoeng drydock for repairs. As the drydock she was in
    being pumped out on February 20, the ship capsized drydock was scuttled on March
    2 before the battle of February 1943, the Japanese occupied the city. The ship
    was raised by the US Patrol Boat 102. She is shown here after the war, having
    been returned to US Navy custody and given here original hull number. (US Naval
    History and Heritage Command)


    The Allied third wave attack was totally ineffective. One of nine torpedo boats
    entered the strait in two groups of four. One group gained no contact and the
    second sighted possible targets proceeding at high speed but could not get


    ![](img/9f6cbeb32985c11de35c8798e522b788_51_0.png)'
  - '[PAGE 52]


    into an attack position. All the torpedo boats returned to Soerabaja having achieved
    nothing.


    Both sides thought they had inflicted severe damage to the other. In reality,
    the Allies had lost fine opportunity to inflict a local defeat on the Japanese.
    In the first wave attack, Doorman''s inept tactical plan squandered the Allies''
    best hope of victory. The two Japanese destroyers were handled aggressively and
    well. First, they fought off an attack by two Dutch light cruisers which praised
    home their advantage, they overwhelmed a single Dutch destroyer, and finally chased
    off two American destroyers. The second wave gained temporary surprise for the
    Allies. The cost of the battle was considerable (Piet Heijn was sunk and the light
    cruiser Tromp was forced to Australia for repairs, which took her out of the campaign.
    The American destroyer Stewart was sent to a drydock in Soerabaja for repairs.
    Unfortunately, the drydock collapsed and Stewart''s fighting days were over. She
    was later served in the IJN as a patrol boat for the remainder of the war. The
    Japanese believed they had done more damage, claiming two of the three destroyers
    sunk in the first wave with the three heavily damaged. Total Japanese cruisers
    and three destroyers sunk and two heavily damaged. Yamamoto accepted these claims
    as ground truth, which seemingly accounted for a large portion of ABDA''s remaining
    assets. The battle was not without loss for the Japanese. Mischio heavily damaged
    and towed to Makassar for repairs which took the better part of 1942. Asahio was
    lightly damaged, and Oshio suffered moderate damage. Overall, the battle was another
    example of Allied naval ineffectiveness. They caught off balance and reacted too
    slowly to stop another Japanese landing, and when they showed up, they were outfought
    by a smaller Japanese force.


    # THE JAPANESE APPROACH TO JAVA


    The Japanese landings on Sumatra in the west and Bali in the east Java the only
    major island in the NEI still held by the Allies. The Japanese maintained a quick
    pace in their advance through the NEI, and with their final prize within reach,
    they commenced a plan to seize Java before it could be reinforced. This called
    for landings on the eastern and western parts of the island.


    The first to move was the Western Force. It departed Ran Bay on February 18 with
    an invasion fleet of 36 transports. On board was the headquarters of the 16th
    Army, responsible for the occupation of Java, an entire infantry division, and
    another infantry regiment. A large escort force was provided which consisted of
    three light cruisers and 13 destroyers. The covering force consisted of Ozawa''s
    flagship cruiser Chokai, the four Mogami-class heavy cruisers of Sentai 7 under
    Rear Admiral Kurita, and several destroyers remained with the Western Force.


    On February 19, the Eastern Force departed Jolo in the northern Celebes Sea with
    an invasion fleet of 41 transports carrying another complete infantry division.
    The IJN provided an escort built around Rear Admiral'
