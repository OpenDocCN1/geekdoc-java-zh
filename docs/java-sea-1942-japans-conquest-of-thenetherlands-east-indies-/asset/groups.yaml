    Soerabaja, it was significantly weaker than the Western Force. The Japanese compounded
    this error in the later stages of the campaign by dissipating their overwhelming
    resources. Yamamoto took reports from the battle of the Badoeng Strait literally
    and assumed that ABDA no longer possessed a viable force. Accordingly, instead
    of stopping the final invasion of Java with the overwhelming force of the Kido
    Butai and the battleships and heavy cruisers of Kondo''s support force to deal
