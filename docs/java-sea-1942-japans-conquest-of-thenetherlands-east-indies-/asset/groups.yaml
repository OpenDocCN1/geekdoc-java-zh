    The perilous Allied situation meant the end of the fragile ABDA command structure.
    February 25 was ABDA''s final official day. Now the Allies began to pursue different
    objectives. Helfrich retained nominal control over all Allied naval ships in the
    region, and he clung to the increasingly unrealistic notion that Java could still
    be defended. He ordered survivors to Tjilatjap on Java''s southern coast to fight
    on. On March 1, Palliser made his intention to order all British ships out of
    the region before they were destroyed. With orders to withdraw the US Navy''s
    remaining ships, Glassford indicated to Helfrich that he would keep his ships
    under Dutch command.


    # # THE BATTLE OF THE SUNDA STRAIT


    The first of a series of desperate battles fought by Allied ships seeking to flee
    the Java Sea was fought on February 28 in the Sunda Strait. Houston and Perth
    departed Tanjong Priok at 1900hrs on February 28. Evertsen, also present, did
    not get underway until 2045hrs. The three ships headed west to transit the Sunda
    Strait. But the Allies were too slow. The large Japanese invasion force had already
    arrived at Batavia Bay, which was at the northern entrance of the Sunda Strait.
    Despite their awareness of the presence of Allied warships in Batavia, Rear Admiral
    Hara, commander of the convoy screen, was not prepared for the two Allied cruisers
    coming from the east. The Japanese initial deployment placed only Fubuki to the
    east of the landing area. Light cruiser Natori with Fubuki-class destroyers Hatsuyuki
    and Shirayuki and three older Kamikaze-class destroyers were


