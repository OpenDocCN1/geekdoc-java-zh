    水穗号（Mizuho）水上航空母是第11水母队的旗舰，在荷属东印度（NEI）战役中发挥了重要作用。战役始于盟军空中抵抗有限的曼纳，于2月在爪哇岛东部结束。面对盟军，这些这些舰提供了有效的空中掩护，且仅携带浮动飞机。3月1日，它与水上航空母“千鸟号”（Chito）一起派遣了浮动飞机。在荷属东印度战役期间，水穗号于1942年5月1日被美国潜艇“鼓号”击沉。如果它没有被击沉，很可能会改装为航空母（（大和博物馆）。


    高木的两艘重巡来自田中少将指挥的第5战队和第2驱逐队。侵入船队的近距离护卫由西村少将指挥的第4驱逐队组成，并由四艘扫雷舰和一艘布雷舰加强。


    两个侵入船队均由高志中将指挥。他在爪哇岛北部保留了重巡“足柄号”和“凤月号”以及两艘驱逐舰。爪哇岛南部有“金刚号”、“春云号”三艘重巡和几艘巡洋舰。负责接撤离盟军部队或加强力量的任务的机动部队，拥有四艘舰队航母、两艘重巡和一支由轻巡领领的驱逐队。


    盟军已知晓这两个侵入船队的任务，并试图击败日本侵略军。2月21日，他创建了两个分遣力量来完成这一任务。他之所以这样做是因为进入盟军力量的两个主要补给点已没有足够的燃料。


    西方打击队由澳大利亚皇家海军准将柯林斯（Collins）指挥，由一艘重巡（埃克塞特号）、几艘轻巡（澳大利亚“霍巴特号”、英国“龙号”和“戴夫号”）和一艘荷兰驱逐舰组成。该部队驻扎在巴塔维亚附近的丹绒普罗克（Tanj
    Priok）。2月24日，它得到了澳大利亚轻巡“珀斯号”的加强。东方打击队由多尔曼（Doormann）指挥，由一艘重巡（休斯顿号）、两艘轻巡（荷兰“库伊特号”和“爪哇号”）以及四艘驱逐舰组成。


    一架美国飞艇在2月25日发现了东方舰队。它是两个侵入船队中距离爪哇岛最近的一个，由于它正前往爪哇岛的经济政治中心，因此要求全力应对。赫尔里希（Helfrich）命令巡洋舰埃克塞特号和珀斯号，以及驱逐舰电光号、遭遇号和木星号从西方打击队中脱离，以加强多尔曼的东方打击队。赫尔里希下心阻止侵略，并知道岸上的日本侵略军很快会被荷兰属东印度陆陆军击败，他决定命令多尔曼击败日本东方力量，然后驶向爪哇岛的另一端击败西方力量。这是一个幻梦，但多尔曼被留下来尽所能地执行这一愿景。


    多尔曼决定积极消灭日本人，他并拥有关于他们位置的充分情报。2月26日夜，他率领部队在马德岛（Madeo Island）周围进行扫荡。早晨回到泗水（Soerabaya）时一无所获，结果只遭到了每日空袭。盟军对爪哇的防御达到了顶点。赫尔里希在1155分收到关于日本侵入船队位置的报告。报告于1250分发送给多尔曼，命令其出击执行夜袭，然后前往丹绒普罗克。随后在2055分收到赫尔里希的消息：“你必须继续攻击，直到敌人被消灭。”


    多尔曼在下午召集了他部队中所有船只的上长，回顾了即将战斗的计划。打击队将在马德岛北部进行扫荡，然后向西行驶。英国和荷兰驱逐舰部署在先锋，然后是巡洋舰，最后是美国驱逐舰。当与日本人接触时，先锋驱逐舰将发动攻击，随后巡洋舰从远处攻击目标，然后美国驱逐舰将执行鱼雷攻击。


    多尔曼的计划给美国、澳大利亚和英国参与者留下了很大的想象空间。没有考虑到使用他的巡洋舰浮动机的计划，这些飞机被留在岸上，在夜战中成为一种危险。这一小时的会议没有涵盖通信计划的核心或详细的战术计划。正如一位美国驱逐舰上长所说，“盟军力量只不过是一支奇怪的任务组组成的队列，带着模糊的总体指示进入战斗，没有具体的任务。”多尔曼将在没有连贯计划、没有与其部队通信能力、且对敌人位置和意图一知甚少的情况下，出海与日本人进行殊死之战。这并不是成功的秘诀。


    联合打击队于1800分从泗水出发，并在马德岛周围进行扫荡。2月27日0130分到达萨波迪海峡（Sapoidi Strait）后，多尔曼按计划向东返回泗水。在没有任何关于日本人情报并完成计划中的扫荡后，多尔曼于1240分决定返回泗水加油。1425分，当“德里特号”（De
    Ryter）穿过荷兰雷区时，收到来自一架荷兰飞艇的一系列惊人报告——日本侵入船队就在泗水西北50英里处！多尔曼立即调头向北，命令其余部队跟随。


    “鸣号”（Nachi），显示于1942年3月，荷属东印度战役刚结束后，是高木少将的旗舰。1942年1月4日，“凤月号”在民地的达沃遭到美国陆军航空B17轰炸机损坏。在战役剩余时间里，高木和贺贺号是荷属东印度东部系列入侵掩护的核心。“鸣号”一直生存到1944年11月，随后在马尼拉湾被美国海军飞机击沉。（大和博物馆）


    如果运气足够的话，盟军可以在日本侵入部队登陆上岸之前将其捕获。双方的接触过程并不顺利。日本侵入船队正前往位于苏水（Soeraja）西部的克拉根（Krag）。由于没有预计会有重大抵抗，高木未能集中力量。最后意识到他需要加强船队的护卫，高木于0930分命令田中的大部分船只加入船队。从西村处听到船队正受到攻击后，高木命令他的两艘重巡和最后的几艘驱逐舰护卫船队。1100分，高木收到信息，多尔曼的五艘巡洋舰和六艘驱逐舰的部队位于侵入船队的路径上。“鸣号”的浮动飞机获取了更多信息并增加了南速。这架飞机报告敌方于12.35分向东移动，不久后报告部队改变航向向南。期间，西村命令船队向西行驶，直到危险被消除。


    日本人暂时陷入了混乱，但并没有让多尔曼获得对船队的清晰射击。一旦多尔曼向南移动，高木命令继续登陆，并在1340分将船队带到西南方向。当多尔曼调头向北行驶时，“鸣号”的浮动飞机迅速将此传给高木。船队被命令向西北方向，高木采取了措施通过命令西中的驱逐队来集中力量。西村为船队留了两艘驱逐舰，他的旗舰和另外六艘驱逐舰去进攻盟军。尽管没有完全集中，日本力量拥有两艘重巡、两艘轻巡和14艘驱逐舰。他们在8英寸炮上占优，在6英寸炮上存在不足，但在鱼雷管方面具有显著优势。

    '
