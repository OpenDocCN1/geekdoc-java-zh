    ## The Royal Navy


    The ships that the Royal Navy committed to the defense of the NEI were also largely
    second rate. They were led by the heavy cruiser *Exeter*, which was the hero of
    the December 1939 engagement with the German armored ship *Spee* at the battle
    of the River Plate. Damaged during the engagement, she was repaired and modernized
    over the following year. Of the Royal Navy''s 15 heavy cruisers, *Exeter* and
    her sister ship *York* were the smallest (just over 10,000 tons full load) and
    carried only 8in. guns instead of the usual eight. She did carry six torpedo tubes,
    but was relatively armed with


    ![](img/9f6cbeb32985c11de35c8798e522b788_27_1.png)


    Heavy cruiser *Exeter*, photographed following modernisation. This profile view
    shows three dual 8in. turrets and a single bank of 21in. torpedo tubes. Facing
    IJ Myoko-class heavy cruisers, she would be overwhelmed. (Netherlands Institute
    for Military History)


    A main belt of 3m. During her modernization, she received early warning and fire-control
    radars, making her the only radar-equipped ship in the campaign.


    The British naval contingent included several cruisers. The best two modified
    Leander-class light cruisers, Hobart and Perth, which were transferred to the
    Royal Australian Navy in 1938 and 1939, respectively. Both were veteran ships,
    with Perth in particular establishing a fine record in the Mediterranean from
    1940 to 1941. Both ships carried 6in. guns and eight 21in. torpedo tubes, but
    were poorly protected. Two D-class cruisers, Dragon and Danae, were also available,
    but dated from 1918 and were unsuitable for front-line duties. Both carried six
    6in. guns in single mounts and 12 21in. torpedo tubes.


    The small number of British destroyers available was a mixed lot. Three E-class
    ships were commissioned in 1934. Electra and Express came to detach from the Far
    East as escorts for Prince of Wales and Encounter which displaced around 1,500
    tons, making them smaller than all modern Japanese destroyers. Each carried four
    4.7in. guns and eight 21in. torpedo tubes and were all veteran ships. Electra
    survived the campaign because she was damaged when was rescuing survivors from
    Prince of Wales on December 10 and was forced to leave the area and go to Ceylon
    during the first part of February.


    The sister ship of Perth Hobart, a modified Leander-class light cruiser, which
    was transferred to the Royal Australian Navy in 1938. In the final stages of the
    campaign, she was assigned and thus went to the Western Striking Force against
    the Japanese surface forces which ensured her survival beyond the fall of the
    DEI. (US Naval History and Heritage Command)


    Perth was originally commissioned as HMS Amphion in 1936 and transferred to the
    Royal Australian Navy in 1939. Armed with eight 6in. guns, eight 4in. guns, and
    twenty torpedo tubes, Perth was a balanced which had an active and fine record
    in the Mediterranean. In the war. Sea ear to Japanese light cruisers, she was
    lost in the battle of the Sunda Strait. In 1943, it was revealed that the wreck
    had been stripped of many of its parts using scrap metal to build up the ship.
    (US Naval History and Heritage Command)


