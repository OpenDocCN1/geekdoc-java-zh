    皮特·海因（Piet Hein，此处所示位于泗水亚（Soerabaja）干船坞内）是战争开始时七艘荷兰驱逐舰之一。随着1940年5月荷兰的沦落，维持东印度舰队舰只的运作变得日益困难（美国海军历史与遗产司令部）。


    在锚地处，但一小时后，运输船返回卸载了八艘登陆艇，供岸上陆军遣队使用。浅潮号（Asashio）在运输船附近航行，大潮号（Oshio）则位于西北约3,000码处。


    第一波盟军进攻群在2230前刚刚抵达。这支部队由多尔曼（Doorman）指挥。他将两艘巡洋部署在驱逐舰前方5,500码处。他们的命令是进行火炮交战，而驱逐舰则用鱼雷攻击陷入混乱的日军。这是一个糟糕的计划，因为突袭的鱼雷袭击随后进行炮击攻击可能更有效，就像在巴利卡潘（Balikapan）一样。巡洋舰以22节的速度冲日军。爪瓦号（Java）首先发现了浅潮号，但由荷兰人开火。2230时，爪瓦号发现了目标并试图用探照灯照亮这艘巡洋舰。随后的战斗非常短暂且无胜负；这证实了赫尔里希（Helfrich）打算这仅仅是一次袭扰。爪瓦号在2,200码处与驱逐舰交战，一轮命中并摧毁了其探照灯，造成4人死亡11人受伤。另一轮击中了萨萨戈丸号（Sasago
    Maru）。作为回报，爪瓦号后部中了一枚5英寸径炮弹。此此，荷兰的大潮号向北逃离并断了联系。德·里特（De Rter）将军未发一言。


    几分钟后，盟军驱逐舰与皮特·海因号在美军舰前方5,000码处竞驰。大潮号率先获得接触，在2235时在南方约6,000码处发现了这艘驱逐舰。日军转向东南。皮特·海因号用三枚鱼雷击中了猿留丸号（Sagaru
    Maru）及其4.7英寸火炮。为了避开荷兰驱逐舰产生的烟雾，约翰·D·福特号（John D. Ford）也发射了三枚鱼雷并射了4英寸径炮。纵队中最后的最后的驱逐舰波普号（Pope）向运输船又发射了两枚鱼雷。两艘美军舰都声称命中，后者得分更高。2240时，浅潮号在1,600码处与皮特·海因号交战，随后将美军驱逐舰置于火力之下。波普号向浅潮号的目标发射了两枚鱼雷，但未命中。为了避免与荷兰船碰撞并由于浅潮号向东急驰，两艘美军驱逐舰向西转弯。这使得皮特·海因号孤立；在向浅潮号又发射两枚鱼雷后，它的后部锅炉室中了一枚5英寸弹。随后发生鱼雷命中，荷兰驱逐舰将其命中使其停止。在损救措施完全恢复电力之前，该船于2246时被浅潮号的鱼雷命中。影响是毁灭性的；荷兰船迅速向右舷倾斜并沉没，包括船长在内的69名船员牺牲。


