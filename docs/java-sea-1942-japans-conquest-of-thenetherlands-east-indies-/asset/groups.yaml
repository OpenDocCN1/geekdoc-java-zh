    # IMPERIAL JAPANESE NAVY


    The four Mogami-class heavy cruisers of Sentai 7, three of which are shown here
    in 1938, were the most powerful ships in Vice Admiral Okinawa''s Malaya Force.
    Of these, Mikura was active in the battle of the Sunda Strait on March 1, which
    resulted in the destruction of two Allied cruisers. US Naval History and Heritage
    Command


    For the campaign, naval forces of the IJN was the Combined Fleet. In turn, the
    Combined Fleet was broken down into a number of fleets. The fleets became the
    basis for major forces allocated operational missions, but the entire structure
    was very flexible; ships and divisions could be easily shifted from one fleet
    to the other to meet operational requirements.


    For the NEI campaign, Japanese naval forces were assigned to Third Fleets. The
    Second Fleet, also known as the Scouting Force, was based on Hainan Island and
    assigned 11 heavy cruisers, including the four Atago-class ships of Sentai 4,
    three Myoko-class ships of Sentai 5, and all four Mogami-class ships of Sentai
    7. Also assigned to the Second Fleet were Destroyer Squadrons 2 and 4. Each of
    these was assigned a 5,500-ton light cruiser as a flagship, and several divisions
    of destroyers up to a nominal strength of 12 ships.


    The Third Fleet, based on Formosa, was also known as the Blockade and Transport
    Force, which well described its wartime missions. Under its direct control was
    a heavy cruiser, two other light cruisers, and Destroyer Squadron 5 with a light
    cruiser flagship and two divisions of destroyers, totaling eight ships. In addition,
    the First and Second Base Forces were allocated for the conduct of landing operations.
    Each was comprised of a large number of transports and smaller combatants including
    patrol boats, minesweepers, minelayers, submarine chasers, and gunboats.


    It should be noted that the attack into Southeast Asia allocated the majority
    of the Combined Fleet''s combatants; there were other operations which required
    significant portions of the Combined Fleet. Foremost among these was the Kido
    Butai, which was allocated to the Pearl Harbor operation, and then briefly supported
    operations in the South Pacific before becoming available to support the NEI campaign
    in early February. The IJN''s battleships were retained in home waters as a strategic
    reserve, but one section of Sentai was with two


    ![](img/9f6cbeb32985c11de35c8798e522b788_19_0.png)


    ![](img/9f6cbeb32985c11de35c8798e522b788_19_1.png)


    One of the IJN''s forgotten early-war aircraft was the G3M long-range bomber,
    later given the Allied reporting name of "Net". Flying in the absence of Allied
    fighters, this bomber was very effective, as was shown by its exploits against
    Force Z, Cavite, and Soerabaja naval bases, and ABDAAF''s Striking Force. (US
    Naval History and Heritage Command)


    ![](img/9f6cbeb32985c11de35c8798e522b788_20_0.png)


    Kongo-class fast battleships were allocated to the Southern Expeditionary Force.
    The rest of the Combined Fleet was occupied supporting the operations in the South
    and Central Pacific (mainly the Fourth – Mandate – Fleet), watching the Northern
    Pacific (the Fifth Fleet). Most of the Combined Fleet''s submarines were allocated
    to support operations over the US Navy as part of the Hawaiian Operation, but
    18 older units were allocated to support operations in Southeast Asia.


    In all, the Southern Expeditionary Force was allocated two battles, 12 heavy cruisers,
    four light cruisers, and some 52 destroyers. On the surface, the operating area
    meant that it was never concentrated. Imperial Japanese Navy surface units were
    inadequate to strongly protect all invasion and reinforcement convoys, leaving
    open the possibility that Allied naval forces could catch a weakly escorted convoy
    or engage a segment of the Southern Force and defeat it piecemeal.


    Vice Admiral Kondo retained command of a powerful commanding force which included
    two battleships (Kongo and Haruna), three heavy cruisers (Atago, Takao, and Maya),
    and eight destroyers. The force acted in


    A small number of B5N1 aircraft, like the one shown here in this pre-war photograph,
    flying from carrier Ryoho participating in the NEI campaign. This aircraft could
    employ both torpedoes and bombs, but only used during the campaign on February
    4 and 15. (US Naval History and Heritage Command)


    ![](img/9f6cbeb32985c11de35c8798e522b788_20_1.png)


    a distant support role. The direct cover for the many landings was provided by
    the two forward groups of the Southern Expeditionary Force. These were the two
    pincers which led the advance into the NEI. The exact designations of these pincers
    changed over the course of the campaign, but were most referred to as the Eastern
    and Western Forces.


    The Eastern Force was under the command of Vice Admiral Takahashi. It was allocated
    the light carrier Ryoho, the four Myoko-class cruisers, Destroyer Squadron 2 with
    light cruiser Furutaka and two destroyers, and Destroyer Squadron 4 with light
    cruiser Naka and destroyers.


    The Western Force, under the command of Vice Admiral Ozawa, was assigned the heavy
    cruiser Chokai as his flagship and the four Mogami-class cruisers, and Destroyer
    Squadron 5 with flagship Sendai and seven cruisers.


    Imperial Japanese land-based air forces were expected to play a large part in
    the campaign. The 22nd Air Flotilla, based in Indochina, was initially located
    to support the attack on Malaya. The 21st and 23rd Flotillas were eventually available
    to support operations against the Philippines. All of these were very powerful
    forces, as the aircraft they flew were mainly the G3M (later given the Allied
    reporting name of "Nell") and the G4M (later given the reporting name of "Betty").
    Both types of aircraft possessed long ranges, and could conduct level bombing
    to avoid most aircraft fire. Both the G3M and G4M were vulnerable to interception
    by fighter aircraft, but this was not a concern during the campaign.


    # The ships


    Imperial Japanese heavy cruisers were the spearhead of the Japanese advance into
    the NEI. Japanese heavy cruisers were designed to play several important roles,
    principally as the centerpieces of night-fighting battle groups. The design of
    IJN heavy cruisers emphasized firepower, in order to perform their wartime roles
    they had to be more heavily armored than comparable US Navy ships and possibility
    to strike at greater ranges than American cruisers. They were capable of conducting
    long-range gunnery attacks with their 8in. gun batteries. The Myoko class, the
    first of which was commissioned in 1928, was fitted with a main battery of ten
    guns. The next class to commission was the four-ship Atago class, also fitted
    with ten 8in guns. The four-ship Mogami class was originally commissioned as light
    cruisers with 15 in. guns, but before the start of the war was upgraded to a main
    battery of 10 in. guns. The maximum range of the 8in. guns fitted to these three
    classes ranged between 31,606 and 32,133 yards. The Japanese believed that the
    fire-control equipment fitted to their cruisers gave 8in. guns an effective engagement
    range of 21,873 yards, but they often engaged targets at even longer ranges. However,
    at extended ranges the twin-gun tur suffered from significant dispersion problems
    which affected accuracy.


    Additionally, IJN heavy cruisers were fitted with a heavy torpedo battery. At
    the start of the Pacific War, Myoko-class carried 16 torpedo tubes and 18 reload
    torpedoes. This was matched by two ships in the Atago class, but the Mogami class
    carried only 12 torpedo tubes with relays. In 1938, Japanese heavy cruisers were
    provided with a top secret torpedo – the Type 93 Model 1 Modification 2. This
    was a formidable weapon, superior to any Allied torpedo. It carried a 1,082-pound
    warhead, was wireless since it was oxygen propelled, and had a range up to 43,746
    yards at 36 knots. However, there was a potential downside. Carrying such powerful
    weapons greatly enhanced the firepower of IJN heavy cruisers, but there presented
    a real danger if the unprotected warheads were hit during the combat. This occurred
    aboard IJN heavy cruisers several times during the war and the results were devastating.


    Ashigara, shown here in the December 1942 in drydock at the former Royal Naval
    Base at Singapore, served as Vice Admiral Takashi''s flagship during the invasion
    of the Philippines and NEL. Held in reserve, she did not get an opportunity to
    engage Allied warships until March 1, when she played a leading role in the destruction
    of heavy cruiser Exeter. She remained in NEL waters for the remainder of her career
    and was sunk by the submarine Trenchant in the Bangkok Strait on June 7, 1945
    (Yamato Museum)


    ![](img/9f6cbeb32985c11de35c8798e522b788_21_0.png)


    Imperial Japanese light cruisers were less formidable, since their primary mission
    was to act as flagships for destroyer squadrons.

