    Thus, the IJN assumed the role as the leading proponent of war against Great Britain
    and its empire, the Dutch, and the United States. In the mind of the Japanese,
    there was no way the United States would remain neutral if Japan attacked Southeast
    Asia, so any war of aggression would also have to be waged against the United
    States. The groundwork for war in the Pacific was laid.


    The immediate events leading to war are well known. In July 1941, the Japanese
    forced the Vichy French to declare a joint Franco-Japanese protectorate over Southeast
    Asia. In response, the Americans, British, and Dutch imposed a total trade embargo
    on the Japanese and froze all assets. Since there was no realistic prospect that
    a Japanese government dominated by the military would accede to American demands
    to withdraw from China or India, the countdown to war accelerated. Japan had to
    act before its supplies of oil dwindled. Accordingly, the IJN demanded in August
    that hostilities against the Western Powers begin in October. The IJA agreed only
    two weeks later. A conference between the IJA and IJN on September 3 set the timeline
    for the war. The rush to war was temporarily suspended by the Emperor''s demand
    that diplomacy be given time to work, but by December 1 an imperial conference
    confirmed the decision for war.


    # THE NAVAL BALANCE OF POWER


    Underning Japanese hopes for a quick victory were the balance of naval power which
    existed in December 1941. As the table below clearly shows, this balance favored
    Japan.


    | Pacific Naval Balance. December 7, 1941 |

    | Battleships/Battlecarriers | Aircraft Carriers | Heavy Crusaders | Light Crusaders
    | Destroyers | Submarines |

    |---|---|---|---|---|--|

    | Royal Navy and Domains | 2 | 0 | 8 | 12 | 1 |

    | Royal Netherlands Navy | 0 | 0 | 0 | 3 | 7 | 15 |

    | US Asiatic Fleet | 0 | 0 | 1 | 2 | 13 | 29 |

    | US Pacific Fleet | 8 | 3 | 12 | 67 | 27 |

    | Allied Totals | 10 | 3 | 14 | 22 | 99 | 72 |

    | IJN | 10 | 10 | 18 | 20 | 112 | 65 |


    British and Dutch naval forces, even with the assistance of the US''s Asiatic
    Fleet, were clearly inadequate to defend their Southeast Asian possessions. The
    inferiority of US forces deployed in the Pacific against the IJN is also evident,
    making any American attempt to move into the Western Pacific to relieve the Philippines
    seem impossible.


    The bedrock of British strategic planning to defend Malaya and Singapore was the
    assumption that significant naval reinforcements would be to the Far East shortly
    after the outbreak of hostilities. As hostilities seemed imminent in late 1941,
    the British made good on their promise to send reinforcements to defend Malaya.
    However, this reinforcement was nothing more than a bluff in an attempt to deter
    the Japanese from opening hostilities.'
