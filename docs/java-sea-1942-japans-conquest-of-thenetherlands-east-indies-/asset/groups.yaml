    # 海军力量平衡


    1941年12月时，盟军力量在太平洋的实际实力如下表所示，这种平衡明显倾向于日本。


    | 太平洋海军力量，1941年12月7日 | 战舰 | 航空母 | 巡洋舰 | 驱逐舰 | 潜艇 |

    | :--- | :---: | :---: | :---: | :---: | :---: |

    | 英国皇家海军 | 2 | 0 | 8 | 12 | 1 |

    | 荷兰海军 | 0 | 0 | 0 | 3 | 7 |

    | 美国亚西洋舰队 | 0 | 0 | 1 | 2 | 13 |

    | 美国太平洋舰队 | 8 | 3 | 12 | 67 | 27 |

    | 盟军总计 | 10 | 3 | 14 | 22 | 99 |

    | 日本帝国海军 | 10 | 10 | 18 | 20 | 112 | 65 |


    英国和荷兰海军即使有美国亚西洋舰队的协助，显然无法防御其领土。美国部署在太平洋的力量面对日本海军的劣势也显而易见，使得任何进入太平洋救援菲律宾的尝试都变得不可能。


    战争爆发时，美国亚西洋舰队处于一个暴露的位置。其最大的单位重巡洋舰“休斯顿号”位于巴尼岛，在日军空袭范围之外，但有五艘驱逐舰、除两艘潜艇外的所有舰队辅助舰在12月8日身位于马尼拉湾。哈特将军的四艘驱逐舰在战争爆发时实际上位于支援英国的途中，并于12月10日晨抵达。


    英国防御马来亚的战略基石是假设战争爆发后不久会有大规模海军援军到达东方。随着1941年底战争似乎迫在眉睫，英国履行了向新加坡派遣援军的承诺。这一行动是首相威斯顿·丘吉尔的主意，他认为派遣一支规模小但强大的打击部队会让日本产生忌惮。最终于12月2日抵达新加坡的部队由现代战舰“威尔士亲公主号”、旧的巡洋舰“复仇号”以及仅有的四艘驱逐舰组成。这支部队被命名为“Z支部队”，由菲利普斯将领指挥。


    ![](img/9f6cbeb32985c11de35c8798e522b788_6_0.png)


    这张照片是从“福特号”拍摄的，显示了1938年另外两艘亚西洋舰队驱逐舰正在进行舰队的远洋作业。亚西洋舰队的战斗舰部署主要是为了存在感，作战任务并非首要考虑。（美国海军历史与遗产司令）


