    \n# HAGURO IN ACTION (PP. 58–59)\n\nHeavy cruisers Nachi and Haguro were the backbone\
    \ of the Japanese force at Java Sea. With their powerful 8in. guns and torpedo\
    \ batteries, they were the most powerful ships present on either side. The initial\
    \ phase of the battle featured a long-range gunnery duel between Nachi and Haguro\
    \ and the Allied cruisers. In this view, the main turrets of Haguro are elevated\
    \ (1) and firing at long range while splashes from Allied cruisers explode near\
    \ the Japanese ship. To supplement the long-range gunnery of his cruisers, Vice\
    \ Admiral Itag decided to bring the long-range Type 93 torpedo into play. As part\
    \ of a massive torpedo barrage, Haguro prepared to fire her eight starboard torpedoes.\
    \ The cruiser has trained her two starboard quadruple and has fired her torpedoes\
    \ at 1652hrs as evident in this scene (3). Not evident in this scene is the fact\
    \ that several of the torpedoes exploded only a few hundred yards from the ship\
    \ creating enormous columns of water. The problem was with the fusing of the torpedoes\
    \ which was a problem throughout the battle. Cruiser Nachi, leading the column,\
    \ was unable to contribute another eight torpedoes; her torpedo crew had left\
    \ a valve open which blew the air pressure required to launch them. At 1709hrs,\
    \ 23 torpedoes fired in this barrage only one hit. This blow was deadly though\
    \ at 1713hrs, one of Haguro’s torpedoes hit the Dutch destroyer Kortenaerships\
    \ sinking the ship in minutes.\n\n# THE BATTLE OF THE JAVA SEA\n\nDoorman elected\
    \ to place his force into three parallel columns as he headed to the northwest\
    \ to engage the Japanese. The center column consisted of his cruisers, led by\
    \ his flagship De Ruyter. Flanking the main column were two columns of destroyers,\
    \ one comprised of the three British destroyers and the other with the Dutch and\
    \ American destroyers. The Dutch Kortena had boiler problems which reduced their\
    \ top speed to 26 knots, and fell behind. Also left tagging behind the four American\
    \ destroyers had been given an order by Doorman not to pass the Dutch destroyers.\
    \ The inability of the Combined Force to exceed 26 knots became a key factor in\
    \ the battle. Doorman's slower speed meant he was unlikely to outmaneuver the\
    \ Japanese and many uncontested thrust against the transport group even more likely.\n\
    \nThe day phase two sides continued to close. At 1610hrs, Electra spotted the\
    \ westernmost Japanese, the light cruiser Jintsu and her four destroyers. Later\
    \ alone, Electra also reported the two Japanese cruisers. At the same time, the\
    \ Japanese spotted Doorman's force. At 1615hrs, Jintsu began the battle, firing\
    \ 5.in. main battery at Electra. The range was 18,000 yards, close to the maximum\
    \ range for this weapon. Despite this, the Japanese were able to straddle their\
    \ target. This opening salvo was by Nachi and Haguro opening fire with their 8in.\
    \ guns on the Allied cruisers at 28,000 yards. Their initial rounds fell well.\
    \ For Japanese doctrine, Takagi wanted to fight a long-range gunnery duel, since\
    \ he believed his gunnery was more effective at extended ranges and to limit the\
    \ ability of the Allies to respond with the 6in. guns ahead of their cruisers.\
    \ Without waiting for orders, Exeter's captain ordered his ship to fire back at\
    \ 1617hrs, and he was quickly joined by Houston having fired two turns. Both Japanese\
    \ and Allied long range 1631hrs a Japanese 8in shell hit De Ruyter, but it was\
    \ a dud. The force of the Japanese cruisers was accurate enough to place the occasional\
    \ straddle, at 26,000 yards or more, the likelihood of a hit was small. The two\
    \ cruisers continued on generally parallel courses. Takagi was unwilling to close\
    \ the range and continued his tactic of executing long-range attacks. With 25in.\
    \ guns, this was his only area of advantage. But again, his slower speed forced\
    \ Doorman to react to Japanese maneuvering. To avoid the prospect of the Japanese\
    \ “crossing his T” (a tactic in which one side crosses perpendicular to the other,\
    \ allowing the passing force to bring its broad to bear, while the group followed\
    \ could only bring forward guns to bear), Doorman ordered a course change at 1635hrs\
    \ west. This temporarily eased the possibility that the heavy cruisers would “cross\
    \ his T”, but it also failed to close the range for the 6in. cruisers to join\
    \ the gunnery duel. As the heavy cruisers exchanged, Takagi planned to bring the\
    \ IJN's secret weapon into play — the long-range Type 93 torpedo. The massive\
    \ torpedo attack would be conducted at ranges beyond which the Allies\n\n![](img/9f6cbeb32985c11de35c8798e522b788_61_0.png)\n\
    \n# EXETER IN DISTRESS (PP. 62–63)\n\nAfter an hour of inconclusive long range\
    \ gunnery, little damage had been done to either side. At about 1700hrs, the Japanese\
    \ closed the range to seek a decision. At the same time, they concentrated fire\
    \ on Exeter and Houston, the two largest ships. At 1708hrs, Exeter (1) was hit\
    \ by an 8in. shell from Haguro. Japanese gunnery was accurate, as shown by the\
    \ salvo of which (2) had bracketed the cruiser with two explosions in the view\
    \ of (3). The effects of each single 8in. shell were catastrophic and went a long\
    \ way to deciding the battle. The shell hit the shield of one of the twin mounts\
    \ before penetrating through an armored hatch into a boiler room ventilator. The\
    \ shell went through A Boiler flinging shrapnel in all directions and then penetrated\
    \ B Boiler causing further damage. The result was to place both starboard boilers\
    \ out of action and damage to a superheater placed the four aft boilers out of\
    \ commission. The loss of six of the ship's eight boilers the engine room crew\
    \ reduced speed to six knots. Exeter already avoided collision with the cruisers\
    \ behind her. Heavy smoke is already coming out of both stacks indicating the\
    \ damage below in the boiler rooms (3). Exeter is firing her last 8in. salvo before\
    \ her turrets lost power (4). Houston was some 600 yards behind Exeter, and she\
    \ is making an emergency turn to port (5).\n\n![](img/9f6cbeb32985c11de35c8798e522b788_62_0.png)\n\
    ![](img/9f6cbeb32985c11de35c8798e522b788_63_0.png)\n\nThe destruction of Kortena\
    \ and the increasing effectiveness of Japanese cruiser gunnery drove Doorman's\
    \ force into chaos. In the first hour of the battle, the two Japanese cruisers\
    \ fired 1,271 8in. rounds. Eventually, this weight of fire would score. In addition\
    \ to the hit on De Ruyter, which was a dud, another shell hit Houston at 1706hrs\
    \ – also a dud. The next hit at 1708hrs was on Exeter and was the most important\
    \ of the entire battle. The shell, probably by Haguro, penetrated to a boiler\
    \ room and exploded. The final effect was to knock boilers off line, which reduced\
    \ speed to 11 knots and temporarily knocked power to the main battery. After a\
    \ collision with the cruisers behind him, Exeter's captain ordered the cruiser,\
    \ now billowing smoke, to make an immediate turn to port. The following three\
    \ cruisers followed, since they thought they had missed a signal from De Ruyter\
    \ which was leading the column. The Allied column disintegrated; De Ruyter continued\
    \ toward the column. The Japanese and Perth laid a smokescreen to cover the wounded\
    \ Exeter. Doorman was forced to turn his flagship around to reorganize his force.\
    \ To give him the time he needed, he ordered the three British destroyers to execute\
    \ a torpedo attack.\n\n> Haguro was the undisputed star performer of the battle\
    \ of the sinking Java Sea. She was responsible for hitting the heavy cruiser Exeter\
    \ with an 8in shell, which brought it out of action, then torpedoing Dutch destroyer.\
    \ In the final phase hit De Ruyter with a torpedo that led to its sinking which\
    \ brought the battle to a close. Haguro's long maritime career was brought to\
    \ an end in the Malacca Strait on May 16, 1945 at the hands of British destroyers.\
    \ (Yamamoto Museum)\n\n![](img/9f6cbeb32985c11de35c8798e522b788_64_0.png)\n"
