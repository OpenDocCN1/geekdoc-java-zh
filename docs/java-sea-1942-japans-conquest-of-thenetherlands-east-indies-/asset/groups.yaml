    As Talbot''s force was steering south, both John D. Ford and Pope fired a torpedo
    at patrol boat P38. Later at 0306hrs, Pope shot a group of ships and fired five
    torpedoes, by Parrot and Paul Jones each. Each accounted for transport Tatsushima
    Maru. At 0314hrs, the American column turned to starboard to attack the southern
    port of the anchorage. John D. Ford fired a torpedo at a target identified as
    a destroyer; this was followed by 0319hrs by Pope firing and Parrot at another
    “destroyer” to port. Three of these eight fish hit the UK P37 and sank with the
    loss of 35 men. Paul Jones fired two torpedoes at the nearby Kuretake Maru, and
    the second one hit its target at 0325hrs.


    Talbot ignored the range inside the anchorage, even though two of his destroyers
    were out of torpedoes. Parrot now used their 4 guns and claimed multiple hits
    on transports and “destroyers.” Until this point, the American column maintained
    its cohesion, targeting easier in the smoke and confusion. Talbot''s flagship
    John D. Ford lost contact with the other destroyers, which headed out of the action.
    John D. Ford still had torpedoes, and fired his last two at Tsuruga Maru at 0346hrs.
    This was the transport four hours earlier by the Dutch submarine; the American
    torpedoes finished off. John D. Ford proceeded to pummel two transports with 4
    guns gunfire at range. Though damaged, neither sank. At 0410hrs, John D. Ford
    also headed south. The only damage to the American force was a small-caliber hit
    on John D. Ford, which wounded four men.


    The attack had been bold and resulted in a brilliant victory. Using their unreliable
    torpedoes, the final tally was four transports and a patrol boat sank. By any
    measure, this was a successful action. The Japanese response was Nishimura destroyed
    the Americans and for some reason did not believe more than a single destroyer
    could penetrate the anchorage. He was more concerned about possible submarine
    and torpedo boat attacks in the early minutes of the battle than on Naka sea seven
    miles north of the anchored convoy. Even as the battle was drawing to a close,
    Nishimura was still over three miles east of the convoy. More concerned about
    a submarine attack, he left his convoy to the mercy of the American destroyers.


    Victory at Balikapan did not stop or even delay the Japanese advance. On January
    24, Kendari in the Celebes was captured with its first port and well-equipped
    airfield complex. From here, the naval base at Soerabaya was within range of Japanese
    bombers. The first raid on the base occurred on February 3 and continued on a
    virtually basis until the end of the campaign.


    # THE ABDA STRIKING FORCE IS FORMED


    Hart established the ABDA Striking Force on February 1. Initially, it was comprised
    only of available American and Dutch warships. The following day, he selected
    the Striking Force’s commander – Dutch Admiral Karel Doorman. Following being
    damaged on February 4, Marblehead did not arrive at Tjilatjap until two days later.
    In this view, casualties are being taken off the ship for treatment. The ship
    came into port with a hole in her bow and 30 flooded compartments. The cruiser
    was given a temporary patch on her bow, but full repairs could not be made at
    Tjilatjap so she was ordered back to the United States (US Naval History and Heritage
    Command).


    ![](img/9f6cbeb32985c11de35c8798e522b788_41_0.png)


    By February 3, the Combined Striking Force was gathered east of Soerabaja. Present
    were Houston, Marblehead, and seven American destroyers. They were joined for
    the first time by Dutch cruisers De and Tromp, with three more Dutch destroyers
    on their way. Hart determined to use this powerful force to attack the Japanese
    invasion force headed for Makassar on the southern Celebes. In discussion with
    Doorman, they decided to sortie the Striking Force at midnight on February 4 and
    head through the Flores toward Makassar. This plan presented the possibility of
    attacking the Japanese, but to do so they had transit through the Flores in daylight.
    Furthermore, the Japanese air strike on Soerabaja on February 3 had sighted the
    Striking Force in its nearby anchorage meant the potential for surprise had been
    eliminated.


    The weight of Japanese air power itself felt on February 4. After the detachment
    of three American destroyers to escort oil Pecos and the addition of the three
    Dutch destroyers, the Combined Striking Force totaled the four cruisers and seven
    destroyers (four American and Dutch). This force departed Soerabaja and transitioned
    to the target in an attempt to avoid Japanese air searches. This hope was quickly
    squashed when at 0949hrs onlookers Houston spotted the first Japanese search aircraft.
    On this brilliant day with unlimited visibility, the Japanese strike force of
    36 G4M and 24 G3M aircraft, from their new base at Kendari, had no difficulty
    spotting the target. The Japanese awaited for the cruisers. The bombers were all
    armed with 550- and 132-pound bombs; none diverted their attention to Marblehead.
    On their third run, they dropped their bombs. The cruiser was troubled but not
    hit. Nine more after Houston, these also achieved no hits. The third group of
