    ## THE ALLIED ROUT IS COMPLETE


    As Doorman''s Eastern Striking Force was defeated, what became of the Allied Western
    Striking Force? Exeter, Perth, and three destroyers left it with only three light
    cruisers (two obsolete) and two (obsolete) destroyers. On February 26, an RAF
    aircraft spotted the Japanese invasion force 100 miles north of Batavia. Helfries
    ordered the Western Striking Force to sortie and engage it. The force departed
    again, under the tactical command of the skipper of Hobart, after a half-halted
    effort to intercept the Japanese, headed back to base on February 27 short of
    fuel. The point of Java was clear, and the senior British naval officer on Java,
    Rear Admiral Arthur Phillier, decided that he did not want to sacrifice his ships
    in a futile defense. He pressed Helfries to withdraw a withdrawal of force if
    it was unable to find the Japanese. Accordingly, Collins crafted orders for his
    command to patrol in an area where no Japanese were operating at 0430hrs on February
    28, and to depart for Ceylon by the Sunda Strait. Frankly for them, all the Dutch
    destroyers were able to translate the Sunda Strait just before the arrival of
    the Japanese invasion force.


    The survivors of Doorman''s Combined Striking Force faced a uncertain future.
    The two prisoners of the Japanese invasion force were now located on both ends
    of Java, trapping Perth, Houston, and the Dutch destroyer Evertsen in Tanjung
    Proik. In Soerabaja, the American destroyer Pope had joined by the other Allied
    survivors of the battle, including the damaged Exeter, Dutch destroyer Witte de
    With, the British Encounter, and Commander Binford''s four destroyers.


