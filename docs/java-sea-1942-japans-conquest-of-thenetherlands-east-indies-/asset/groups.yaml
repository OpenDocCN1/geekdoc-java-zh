    # 1941年12月的菲律宾、马来西亚与荷属东印度岛


    ![](img/9f6cbeb32985c11de35c8798e522b788_3_0.png)


    # 战役的起源


    太平洋战争初期，日本对东南亚的征服（包括爪哇海海战及一系列相关战斗）是上个十年开始的一系列事件的顶点。20世纪30年代见证了日本在亚洲的扩张浪潮。日本最初的重点是中国，因为那里很薄弱。1931年9月，日本关东军占领了满洲。翌年，日本首相被一群海军军和陆军学员暗杀，这引发了导致平民控制政府终结的一系列事件。这意味着日本的扩张野心没有受到内部制约。


    1937年7月，中国北方爆发战斗，导致日本入侵中国北部和沿海地区。尽管日本在1938年获得了巨大收益并投入了150万士兵，但对华战争仍陷入了僵局。1939年，欧洲爆发战争，为日本军事领导层带来了更多机会和诱惑。日本对欧洲冲突采取观望态度，但到1940年，盟国力量已处于困境。随着法国和荷兰被击败，英国的生存也存在未数，日本开始为在远地区的扩张战争做准备。


    这次扩张的重点是东南亚及其资源。日本陆军（IJA）提议向南进军作为完成对中国隔离的手段。日本帝国海军（IJN）也支持扩张，因为这提供了抵抗美国经济压力的手段。尽管美国不愿干预日本对中国的侵略，但作为对日本在中国持续扩张的回应，增加了经济压力。


    荷属东印度岛（NEI）几无防备的状态以及英国在东南亚的危险处境，似乎为日本提供了摆脱与美国困境的途径。日本经济严重依赖美国的石油和废铁出口。试图通过谈判打破美国封锁的努力注定失败，因为日本永远不会自愿放弃其在中国的征服。另一个驱动日本短期发动战争的因素是与美国海军相比有利的海军力量平衡。由于日本永远不会自愿放弃其在中国的征服，试图通过谈判打破美国封锁的努力注定失败。由于法国和荷兰被击败，英国的生存也存在未数，日本开始为在远地区的扩张战争做准备。


