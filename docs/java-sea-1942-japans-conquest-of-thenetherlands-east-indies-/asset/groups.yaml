    commonly known as an air advocate and as the commander of the IJN''s carrier force
    from November 1942 to November 1944, when he commanded Japanese forces at the
    battle of the Philippine Sea. At the start of the war, he was given command of
    this important mission and since he was held in regard as a tactician and as a
    fighting leader. Ozawa was the last commander of the Combined Fleet before the
    end of the war in 1945.


    The principal combat force under Ozawa was Sentai 7, commanded by Rear Admiral
    Kurita Takeo. He commanded the force for the invasion of Java and was caught with
    forces out of position during the last days of the campaign and the Allied forces
