    ## ALLIED COMMAND STRUCTURE AND COMMANDERS


    ![](img/9f6cbeb32985c11de35c8798e522b788_15_0.png)


    Admiral Thomas Hart read his orders to assume duties as commander of the Asiatic
    Fleet on July 25, 1939 after abandoning the heavy cruiser *Augusta* at Shanghai.
    Thomas Hart was a very capable commander who enjoyed a short command of ABDA forces.
    Given the forces at his disposal, it was never possible for him to accomplish
    his missions. He was replaced by MacArthur for unsuccessfully defending the Philippines
    and undermined by the Dutch who felt that they should have the role as commander
    of ABDA forces. (US Naval History and Heritage Command)


    Despite their common threat, the Americans, British, Dutch, and Australians were
    unable to establish a working joint command before the war, and even after the
    war began they still struggled to do so. In April 1941, the Americans, Dutch,
    and British held staff talks in Singapore (with Australian and New Zealand representatives
    in attendance), but these talks failed to create a working relationship. It took
    a high-level conference between Churchill and Roosevelt in December 1941-January
    1942 to hammer out an agreement on a joint command structure in Southeast Asia.
    The Arcadia Conference was the establishment of a joint command defending Allied
    possessions in Southeast Asia. The Americans proposed a structure for complete
    command of all naval, ground, and air forces in the region and put forward Archibald
    Wavell as its first commander. Despite some reservations on the potential effectiveness
    of a command covering such a large area and with restrictions imposed by the Americans,
    the British agreed to the establishment of ABDA (American, British, Dutch, and
    Australian) Command under Wavell''s control. It covered all of the NEI, the Philippines,
    Malaya, and Burma. The Dutch and Australians were not consulted about its creation
    and Americans and Britons held almost all the important command positions.


    Wavell''s deputy was Lieutenant-General George Brett, US Army Air Force (USAAF)
    and his chief of staff was British officer Lieutenant-General Henry R. Pound.
    American Admiral Thomas Hart retained his national command and was appointed commander
    of ABDA naval forces (also called ADBFLOAT). Another, Major-General Lewis H. Breit,
    USAAF, was given the job as commander of ABDA forces until the arrival of another
    British general. ABDA ground forces were commanded by Dutch Lieutenant-General
    Hein Poorter. ABDA Command was largely ineffective from its first official day
    on January 15, 1942 until its final bombardment on February 25, when Wavell resigned.


    BELOW LEFT

    Rear Admiral William Glassford, shown here in the 1930s, assumed command of Task
    Force 5 before the Pacific War. Hart did not believe he was strong enough, as
    many of his men did not oversee the Asiatic Fleet''s only victory over the Japanese
    at the battle of Balikpapan. (US Naval History and Heritage Command)


    The Dutch were especially affected by the command arrangement since they were
    excluded from senior command positions and found their forces being used to escort
    convoys to Singapore. In their view, they had the most to lose and were contributing
    a major portion of Allied naval forces, but had little say on how their forces
    were employed.


    Admiral Hart was the commander of the Asiatic Fleet. He assumed this before the
    war, so he knew exactly how limited his force''s capabilities were. At the start
    of the Pacific War, he had over 40 years of service.


    ![](img/9f6cbeb329885c11de35c8798e522b788_16_0.png)


    (being a graduate of the Naval Academy in 1897) and was one of the most senior
    admirals in the US Navy. His personality was summed up by the nickname "Tough
    Tommy." While seen as a strict disciplinarian, he is also viewed as fair. He proved
    adept at dealing with his command''s pre responsibilities of protecting US economic
    and military interests in the Far East.


    When Hart took command of ABDA naval forces, day-to-day responsibilities for the
    operations of the Asiatic Fleet were transferred to chief of staff Rear Admiral
    W. R. Purnell. Rear Admiral William Glassford, Jr. was given command of Task Force
    5, the Asiatic Fleet''s surface striking force. He was given the nickname "15-knot
    Glassford" in recognition of his hesitant leadership early in the war. He did
    not get along with Hart, who did not think he was aggressive enough. When Hart
    assumed his ADBFLOAT, the US wanted him to hand over command of the Asiatic Fleet
    to Glassford. Hart avoided doing so until January 25, when Glassford found out
    the order. When he had the opportunity to appoint a commander for the new ABDA
    Striking Force commander, Hart selected someone besides Glassford.


    Hart''s tenure as ADBFLOAT was brief and marked by political assaults from General
    MacArthur and the Dutch authorities. By February 5, Admiral Ernest King, Commander-in-chief
    of the US Fleet, informed Hart that he should be asked to relieve on health grounds
    since he had the support of the Dutch, MacArthur, Wavell, and even President Roosevelt.
    His relief was driven by MacArthur and Wavell, and the Dutch, who wanted to scapegoat
    him for failure to defend the NEI. As of February 12, the position of ADBFLOAT
    was held by a Dutch admiral. With the departure of Hart, there was not a single
    American naval officer with a significant role in ABDA Command.


