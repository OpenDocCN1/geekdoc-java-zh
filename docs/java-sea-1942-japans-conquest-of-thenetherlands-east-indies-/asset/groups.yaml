    damaged with 29 more casualties, two cruisers were also damaged. The pace of training
    was relentless, especially when the training culminated in October. Imperial Japanese
    Navy officers described the training as tougher than actual combat. The result
    was a finely honed instrument for the beginning of the war.


    ![](img/9f6cbeb32985c11de35c8798e522b788_24_0.png)


    # Night combat capabilities and doctrine


    Night combat was an area of special emphasis in IJN pre-war training. Night combat
    was a central tenant of Japanese naval doctrine, since it was the primary method
    by which highly trained IJN ships could turn the tables on the larger US. Night
    combat tactics reworked after the Type 93 entered service, beginning in 1936.
    Using the long range of this weapon, the heavy cruisers were trained to fire at
    their range in day or night combat. Night combat firing was expected to cripple
    the enemy before he was in danger. When the IJN''s destroyers replaced the Type
    93, and not all before the start of the war, their tactics were similar. The Japanese
    constantly resisted torpedo tactics, with quick reloading of torpedo tubes being
    a key skill. A well-trained crew could accomplish this in 15 minutes. This allowed
    cruisers and destroyers to fire a salvo of torpedoes, disable to reload, and then
    fire a second salvo.


    The IJN placed importance on its top-secret long-range doctrine at the start of
    the war. They had devised tactics to utilize the capabilities of these weapons
    which gave the Japanese ability to inflict blows against Allied surface ships.
    Although the performance of this weapon was disappointing, since only three out
    of the large numbers that were expended. (Author''s Collection)


    ![](img/9f6cbeb32985c11de35c8798e522b788_24_1.png)


    # ALLIED NAVAL FORCES


    Allied naval forces committed to the defense of the NEI inadequate for the task.
    Simply put, the IJN operated more powerful ships with better-trained crews and
    had the massive advantage of operating with a powerful naval arm. Allied naval
    forces operated throughout the campaign with significant handicaps including a
    confusing situation, lack of fighter cover, and lack of reconnaissance. During
    the campaign, Allied naval forces were subjected to increasing strain. Logistics
    support broke down, limiting supplies of fuel and ammunition. Communications were
    a constant problem, since four different nations were present. The Allies did
    not possess a set of mutually intelligible codes for even basic, a constant headache
    for Doorman when he devised his cruising dispositions and maneuvered his ship.
    He issued orders in Dutch, and these were transmitted by Allied liaison and communication
    personnel aboard his flagship to the other ships in the force. The force did not
    share a common set of tactics, forcing Doorman to resort to a basic battle plan.'
  - '[PAGE 25]


    # The Asiatic Fleet


    Sealion photographed in October 1939 running trials. She was the first US Navy
    submarine to survive the war, when she was bombed at Cavite Navy Yard in the Philippines
    on December 10. (US Naval History and Heritage Command)


    The US Navy''s standing Western Pacific force was weak, and it received no reinforcements
    during the campaign. With few exceptions, it was built around expendable ships.
    Its centerpiece was three cruisers and ten destroyers. The only real source of
    potential strength was the fleet''s 2 submarines. However, their crews lacked
    experience and spent the months leading up to the war exercising exceedingly conservative
    tactics. They called for boats to execute torpedo attacks while submerged to as
    much as 100 feet using only sound bearings. Commanding officers were not allowed
    to make attacks at periscope depth or expose their. There was also the issue of
    defective torpedoes, which further lessened their effectiveness. The most crippling
    factor was the lack of aggression among the commanding officers. Combined with
    tactics that emphasized stealth over attack, it made the submarines a non-factor
    in the campaign.


