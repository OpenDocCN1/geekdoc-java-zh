    1941


    +   - February 18: Japanese occupy Bali.


    +   - December 8: February 19: Japanese conduct landings at Kota Bharu, Malaya
    and at Singora and Patani, Thailand.


    +   - December 8: Battle of the Badoeng Strait.


    +   - Japanese carrier force conducts raid on Port Darwin, Australia.


    +   - December 10: February 20: Force Z destroyed by Japanese-based aircraft.


    +   - December 10: Japanese land on Timor Island.


    +   - December 16: February 27–1: Japanese land at Miri, British Borneo.


    +   - December 16: Battle of the Java Sea.


    1942


    +   - January 10: February 28–1: ABDA Command established.


    +   - January 10: Battle of the Sunda Strait.


    +   - January 11: March 8: Japan declares war on NEI.


    +   - January 11: NEI Surrenders.


    +   - January 22: March 28: Japanese land at Menado, Kema, and Bangka Roads in
    the Celebes.


    +   - January 22: Japanese complete occupation of Sumatra.


    +   - January 12: Japanese occupy Tarakan, Dutch Borneo.


    +   - January 23: Japanese land at Balikpapan, Dutch Borneo.


    +   - January 24: US Navy destroyers conduct raid on Balikpapan invasion force.


    +   - Japanese occupy Kendari in the Celebes.


    +   - January 3: Japanese occupy Ambon Island.


    +   - February 2: ABDA Strike Force established.


    +   - February 4: Battle of the Makassar Strait.


    +   - February 14–17: Battle of the Bangka Strait.


    +   - February 15: Singapore surrenders.


    +   - Japanese capture Bangka Island and Palembang, Sumatra.


    +   - February 16: Japanese occupy Bandjermasin, Dutch Borneo.'
