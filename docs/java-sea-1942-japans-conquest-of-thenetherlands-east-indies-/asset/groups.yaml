    # OPPOSING PLANS


    # THE JAPANESE PLAN


    The most important aspect of Japan''s war plans for the initial phase of the war
    was the seizure of the resources of Southeast Asia. The Japanese had to quickly
    gain and bring back into operation the oil fields of Borneo, Java, and Sumatra.
    The Sumatran wells were the most important. The principal Allied military, air,
    and naval forces in Southeast Asia were the British garrison in Malaya. These
    had to be neutralized concurrent with the drive into the NEL. Furthermore, the
    Japanese faced the strategic imperative to neutralize American forces in the Philippines,
    since they were convinced that the United States would intervene if Japan attacked
    British and Dutch possessions in Southeast Asia. Added to the difficulty for the
    Japanese that the campaign against British, American, and Dutch forces was the
    requirement to move as quickly as possible before the Dutch had the opportunity
    to destroy the economic facilities and before the British and Americans reinforce
    their possessions.


    The forces available to the Japanese were barely sufficient for the expansive
    operation they were embarking on. The lack of shipping to transport the invasion
    forces meant that the invasions would have to be conducted in sequence. In five
    months, the Japanese envisioned completing the three phases of the campaign to
    bring Southeast Asia under their control. In the first phase, the forward outposts
    of the Allied defenses were slated for occupation. These included Hong Kong, northern
    Malaya, British Borneo, Sarawak, and the Philippines. The second phase required
    the occupation of the entire Malaya Peninsula, including Singapore, and the northern
    islands of the NEL Finally, in the third phase, Sumatra and Java were to be occupied.


    The key to the Japanese plan was maintaining a relentless pace. The Japanese plan
    was almost reckless, as a planning assumption they made the assessment that the
    Allies would be unable to offer an adequate defense. Despite the bravery of the
    Allied forces, the initial Japanese assessment proved correct and the Japanese
    were able to execute their bold plan on time and minimal losses. Another key was
    the early seizure of air superiority and the imperative that advances only be
    conducted under friendly air protection. The Japanese planned to seize an airfield
    and move south under the protection of the aircraft moved to occupy the just-captured
    facility and then repeat the procedure. Since all the IJN''s fleet carriers were
    initially supporting the Hawaiian Operation, the burden for supporting'
