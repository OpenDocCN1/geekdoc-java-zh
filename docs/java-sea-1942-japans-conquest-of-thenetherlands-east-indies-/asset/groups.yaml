    The first Allied attack wave arrived just before 2230hrs. This group was under
    the command of Doorman. He deployed his two cruisers some 5,500 yards ahead of
    the destroyers. Their orders were to engage with gunfire, while the destroyers
    would attack the disrupted Japanese with torpedoes. This was a poor plan, as a
    surprise torpedo attack, followed up by a gunery attack, would probably have been
    more effective, just like at Balikapan. The cruisers rushed towards the Japanese
    at 22 knots. Java sighted Asashio first, but the Dutch were to open fire. At 2230hrs,
    Java spotted Java and she attempted to illuminate the cruiser with her searchlight.
    The resulting engagement was very short and indecisive; giving credence to the
    notion that Helfrich intended this to be a raid only. Java engaged the destroyer
    at 2,200 yards, a round hit and destroyed her searchlight, killing four and wounding
    11. Another round hit Sasago Maru. In return, Java took a 5in. shell aft. With


