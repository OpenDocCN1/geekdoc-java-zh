    # ORIGINS OF THE CAMPAIGN


    The Japanese conquest of Southeast Asia during the initial period of the Pacific
    War, which included the naval battle of the Java Sea and a number of associated
    engagements, were the culmination of a train of events began in the previous decade.
    The 1930s witnessed a wave of Japanese expansion in Asia. Japan''s initial focus
    was on China because it was weak. In September 1931, the Japanese Kwantung Army
    occupied Manchuria. The following year, the Japanese prime minister was assassinated
    by a group of naval officers and army cadets which began a string of events leading
    to the end of civilian-controlled governments. This meant that there were no internal
    curbs on Japanese expansionist ambitions.


    In July 1937, fighting flared in northern China which led to a Japanese invasion
    of northern and coastal China. Despite massive Japanese gains in 1938 and the
    commitment of 1.5 million soldiers, the war in China became a stalemate. In 1939,
    war broke out in Europe which brought more opportunity and temptation for Japan''s
    military leaders. Japan took a wait-and-see attitude to the European conflict,
    but by 1940 the Allied powers were on the ropes. With France and the Netherlands
    defeated, and the survival of the United Kingdom in doubt, the Japanese began
    to prepare for a war of expansion in the Far East.


    The focus of this renewed of expansion was Southeast Asia and its resources. The
    Imperial Japanese Army (IJA) proposed a move south as a mean to complete the isolation
    of China. The Imperial Japanese Navy (IJN) also supported expansion because they
    offered the means to withstand American economic pressure. Though unwilling to
    intervene against Japanese aggression in China, the United States did ratchet
    up economic pressure in response to continued Japanese expansion in China.


    The virtually defenseless condition of the Netherlands East Indies (NEI) and the
    perilous condition of British in Southeast Asia seemed to offer the Japanese way
    out of their predicament with the United States. The Japanese economy was heavily
    dependent on American oil and scrap iron exports. Efforts to break the American
    stranglehold by negotiation were doomed to fail, since the Japanese would never
    voluntarily relinquish their conquests in China. Another factor driving Japan
    to the war in near term the favorable naval balance compared to the US Navy in
    1941 and 1942. Since the fruits of the United States'' Two-Ocean Naval Expansion
    Act of June 1940 would place the IJN in a position of perpetual inferiority by
    early 1943, the window of opportunity for a successful war was fairly small.'
