    ![](img/9f6cbeb32985c11de35c8798e522b788_19_1.png)


    日本海军中被遗忘的早期战争飞机之一是G3M长程轰炸机，后来被盟军命名为“网雀”（Net）。在没有盟军战斗机干扰的情况下，这种轰炸机非常有效，它在对Z舰队、加逸地和泗拉巴亚海军基地以及亚伯盟联合空军（ABDAAF）打击队的战绩中证明了这一点。（美国海军历史与遗产司令部）


    ![](![](img/9f6cbeb32985c11de35c8798e522b788_20_0.png)


    “长刚级”快速战列舰被分配给南方远征军。联合舰队其余部分负责支持南太平洋和中太平洋的行动（主要是第四舰队——领地舰队），监视北太平洋（第五舰队）。联合舰队的大多数潜艇被分配用于作为夏威夷行动的一部分支持美国海军作战，但有18艘旧型号单位被分配去支持东南亚的行动。


    总之，南方远征军分配了两艘战列舰、12艘重巡洋、4艘轻巡洋和约52艘驱逐舰。从表面上看，作战区域意味着它们从未处于集中状态。日本帝国海军水上单位不足以强力保护所有入侵和援军护队，导致它们必须逐击击盟军护队，这是一种战术选择。由藤近将指挥的强大力量包括了两艘战列舰（长刚、榛云）、三艘重巡洋（爱宕、高雄、摩耶）以及八艘驱逐舰。在照片中可以看到少数量的B5N轰炸机，这种机型轰炸机在战役中曾用于轻巡洋舰。


