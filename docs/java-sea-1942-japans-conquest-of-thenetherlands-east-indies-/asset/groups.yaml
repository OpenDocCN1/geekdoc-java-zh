    the centerpieces of the covering for a series of invasions in the eastern NEL.
    Nachi survived until November 1944, when she was sunk by US Navy aircraft in Manila
    Bay. (Yamato Museum)


    any luck, the Allied force could catch the Japanese invasion force before it delivered
    its troops ashore. The approach to contact was not smooth for either side. The
    Japanese invasion convoy was making for Kragan, located to the west of Soeraja.
    It not expecting major opposition, Takagi had failed to concentrate his forces.
    Finally realizing that he needed to reinforce the convoy''s escorts, Takagi ordered
    most of Tanaka''s ships to join the convoy at 0930hrs. Upon hearing from Nishimura
