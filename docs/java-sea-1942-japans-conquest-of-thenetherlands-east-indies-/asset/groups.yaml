    当第二波部队到达时，大潮号和浅潮号在受损的猿留丸号东侧盘旋。岚潮号（Arashio）和满潮号（Michishio）正向南来，由长良级巡洋舰领头的护卫力量正驶向该区域。盟军波由四艘美军驱逐舰领先，荷兰巡洋舰普号（Tromp）在后五英里。巡洋舰长负责战术指挥，他计划让普号清理驱逐舰攻击产生的波纹。美军驱逐舰以25节的速度进入锚地。他们预计将面对规模大得日军；上一波没有提供任何信息。0135时，斯图特号（Stewart）在左侧发现可能的接触目标。几分钟内，帕洛号（Parrot）向锚地发射了六枚鱼雷。所有十五枚鱼雷全部落空，它们不太可能在那里。浅潮号和大潮号最终发现了美军，并使用探照灯和4英寸径炮交战。0143时，斯图特号在3,500码处对美军进行了猛烈的鱼雷还击。双方首次命中发生在0146时，几枚日军5英寸弹击中了斯图特号。受损的斯图特号转向东北，扰乱了美军纵队。日军驱逐舰转移了注意力，为了避免与荷兰船碰撞并由于浅潮号向东急驰，两艘美军驱逐舰向西转弯。这使得皮特·海因号孤立；在向浅潮号又发射两枚鱼雷后，它的后部锅炉室中了一枚5英寸弹。随后发生鱼雷命中，荷兰驱逐舰将其命中使其停止。在损救措施完全恢复电力之前，该船于2246时被浅潮号的鱼雷命中。影响是毁灭性的；荷兰船迅速向右舷倾斜并沉没，包括船长在内的69名船员牺牲。


    在解决掉皮特·海因后，浅潮号向北进攻美军驱逐舰。美军舰长决定放弃向北通过的命令，开始向东移动。浅潮号和大潮号在2300前重新获得接触，并在探照灯的帮助下对美军舰进行了猛击。美军延迟还击以确保接触目标不是荷兰巡洋舰，然后用火炮和鱼雷与日军交战。双方均未命中。日军在烟幕中失去了美军驱逐舰，2310时，美军向东南逃脱。


    当第二波部队到达时，大潮号和浅潮号在受损的猿留丸号东侧盘旋。岚潮号和满潮号正向南来，由长良级巡洋舰领头的护卫力量正驶向该区域。盟军波由四艘美军驱逐舰领先，荷兰巡洋舰普号（Tromp）在后五英里。巡洋舰长负责战术指挥，他计划让普号清理驱逐舰攻击产生的波纹。美军驱逐舰以25节的速度进入锚地。他们预计将面对规模大得日军；上一波没有提供任何信息。0135时，斯图特号在左侧发现可能的接触目标。几分钟内，帕洛号向锚地发射了六枚鱼雷。所有十五枚鱼雷全部落空，它们不太可能在那里。浅潮号和大潮号最终发现了美军，并使用探照灯和4英寸径炮交战。0143时，斯图特号在3,500码处对美军进行了猛烈的鱼雷还击。双方首次命中发生在0146时，几枚日军5英寸弹击中了斯图特号。受损的斯图特号转向东北，扰乱了美军纵队。日军驱逐舰转移了注意力，为了避免与荷兰船碰撞并由于浅潮号向东急驰，两艘美军驱逐舰向西转弯。这使得皮特·海因号孤立；在向浅潮号又发射两枚鱼雷后，它的后部锅炉室中了一枚5英寸弹。随后发生鱼雷命中，荷兰驱逐舰将其命中使其停止。在损救措施完全恢复电力之前，该船于2246时被浅潮号的鱼雷命中。影响是毁灭性的；荷兰船迅速向右舷倾斜并沉没，包括船长在内的69名船员牺牲。


