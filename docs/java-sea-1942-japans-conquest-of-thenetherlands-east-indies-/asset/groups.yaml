    ## 分析


    爪哇海战是太平洋战争中规模最大的水面战之一。共有32艘舰艇参与了战斗，其中5艘沉没，另有8艘受损（两艘盟军，六艘日本军）。除了爪哇海战，战役期间还发生了四次主要的水面行动。在荷兰海军的三艘潜艇中，只有“特隆普”（Tromp）保持浮动。亚洲舰队的损失每一项都讲述了一个故事。仅在巴利板帕潘（Balikpapan）的战斗中，盟军才被视为胜利。战役开始时有的三艘巡洋舰和七艘驱逐舰，最终仅剩一艘轻巡洋。亚洲舰队的损失虽然巨大，但并不惨烈。三艘巡洋舰开始了战争，其中两艘（波士顿号和大理石头号）幸存。两支海军都顽强战斗，但收效甚微。尽管皇家海军从未支持对东印度属群岛（NEI）的防御，但舰队13艘驱逐舰中也有7艘幸存。英国军的的损失总计为一艘重巡和四艘驱逐舰。澳大利亚人损失了一艘轻巡。


    战役开始时，荷兰皇家海军（RNN）有12艘处于大修或备役状态的作战潜艇。在NEI地区还有三艘。这是1942年拍摄的K-XIII号，它只携带了鱼雷。与数量更多的美国潜艇一样，它们在进攻NEI的日本部队时也无济于事。战役期间损失了四艘荷兰潜艇。在战役最后几天，K-X、K-XIII和K-VIII被困在奥拉巴西（Orabaja）并四散（美国海军历史遗产司令部）。


    日本海军（IJN）完成了迅速夺取NEI及其关键资源设施这一至关重要的任务。在此过程中，没有日本的登陆被阻止或延迟。虽然曾出现糟糕的战术部署为盟军提供了造成局部击败的机会，但盟军太不幸运或实力太弱，未能利用这些机会。战役期间，日本海军的损失较轻。盟军水面海军单位并未


    ![](img/9f6cbeb32985c11de35c8798e522b788_89_0.png)


    这是一面从休斯顿号（USS Houston）上回收的号号。这艘船是一座战争坟墓，但最近出现了一种印度尼废船商打捞前NEI地区残骸的令人不安的趋势。虽然休斯顿号看起来依然完好，但像珀斯号（Perth）以及美英驱逐舰在内的其他船几乎完全消失了。（美国海军历史遗产司令部）


    ![](img/9f6cbeb32985c11de35c8798e522b788_90_0.png)


    在战役期间没有击沉任何一个大型日本海军战斗舰，只有在巴利板帕潘盟军才击沉了目标。荷兰人占了战役期间损失的大多数日本运输舰和战斗舰，但这些损失远低于日本人的计划。日本在NEI损失的最大战斗舰是一艘驱逐舰。共损失了三艘——一艘被盟军潜艇击沉，一艘被荷兰潜艇击沉，第三艘被荷兰飞机击沉。其他损失还包括一艘潜艇、四艘扫雷舰和一艘巡逻艇。此外，至少有14艘运输舰沉没。


    在作战层面，双方都犯了严重的错误。在巴当海峡，赫尔夫里希（Helfrich）措手不及，他的计划太复杂。在在日本入侵爪哇之前，赫尔夫里希愚蠢地认为他可以同时击退针对爪哇的东西两个日本威胁，他创建的两个打击力量分散了他本就不足的资产。他成功的唯一希望是创建一个强大的打击力量，并尽一切提供充足的侦察和空中掩护。他未能确保剩余的盟军航空资产支持侦察。如果有充足的空中侦察支持加强后的打击力量，可能会造成严重打击，甚至可能足以推迟或击败其中一支登陆部队。这些并不是说盟军曾真正有机会从从海上入侵中保护爪哇。力量对比无论在数量还是质量上都太不平衡。从最终分析来看，盟军海军在战役中的记录（以爪哇海战为高潮）是一场失败的游行。唯一的例外是巴利板帕潘的战斗战战，大胆的行动创造了惊喜并为盟军带来了局部成功。尽管如此，应该指出，这种成功并没有推迟日本征服NEI的时间表。


    日本在战役期间对海军力量部署不当，从而为盟军创造了可能的机会。尽管东方力量运行最靠近盟军的主要海军基地


    ![](img/9f6cbeb32985c11de35c8798e522b788_91_0.png)


    泗水巴雅（Soerabaya），但它的实力明显弱于西方力量。日本的炮术也令人失望。战前条令要求远射，因为日本人认为他们可以在敌人范围之外进行惩罚。在战前演习中，他们评估认为6%的


    ![](img/9f6cbeb32985c11de35c8798e522b788_92_0.png)


    利用这次巴利板潘炼油厂的战争耻辱，日本人夸耀工程师如何恢复了NEI的石油。事实上，荷兰人对这些设施的破坏是不完全的，日本很快就能恢复生产。（美国海军历史与司令部）


    炮弹将在远距离命中。这证明是极度乐观的，因为在爪哇海战中，1619发8英寸炮弹中只有5发命中目标。就像93型鱼雷的情况一样，低命中率由于其中一个炮弹对战斗结果起到了主要作用而被缓解。中鹿号（Naka）和进津号（Jintsu）的轻巡炮术也很糟糕。驱逐舰的炮术较好，因为是在更短的距离内进行的。在515发5英寸炮弹中，有的发击中了埃尔克拉号（Electra）并导致了她的损失。类似的结果在对埃克斯塞特号（Exeter）的战斗中也可见。在发射的1171发8英寸炮弹中只有2发。在发射的35枚鱼雷中只有1发命中。


    联合打击力量未能阻止日本入侵部队，意味着日军能够在2月28日和3月1日在爪哇的三个地点登陆。荷兰人试图控制这些登陆的尝试是徒劳的。到3月8日，泗水巴雅被占领，第二天爪哇的荷兰军队投降。随着3月28日苏门答腊荷兰军队的投降，NEI落入日本控制。日本人成功实现了他们战争早期最重要的目标。爪哇和苏门答腊的油田很快恢复了生产。这对于日本的战争需求，随着战争持续，日本人越来越无法将石油或精产品运回本土。爪哇和NEI大部分地区整个战争期间处于日本人手中。


