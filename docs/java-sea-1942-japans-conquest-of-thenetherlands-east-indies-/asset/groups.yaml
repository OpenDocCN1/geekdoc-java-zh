    During the campaign, US Navy submarines were not effective in defending against
    Japanese amphibious attacks. Perch, shown here was one of the submarines ordered
    by Helfrich to concentrate off Java to stop the Japanese invasion. Since the exact
    landing area of the Japanese was not known, the submarines were not deployed correctly,
    and they were unable to move quickly to the landing area. The Japanese and German
    cruisers learned the same lesson when they attempted to repel amphibious invasions.
    Perch was detected on the night of the landing off north of Soerabaya. After intense
    attacks by as many as four UN destroyers, the submarine was rescued March 3, but
