    control efforts prevented the fire from spreading, but with 48 dead and 20 wounded,
    and after 8 hours turn out of action, Houston was badly damaged.


    At 1225 hours, Doorman cancelled the operation and the Combined Striking Force
    forced back to Soerabaja. The two American cruisers were sent to Tjatap, where
    Hart assisted all of the Asiatic Fleet''s ships. Hart believed Doorman should
    have pressed the attack with undamaged ships, and Doorman was rattled by the entire
    effort. The first operation of the Combined Striking Force ended in fiasco, because
    of the direct route selected for the Allied force to use in the Japanese airpower.
    Marble was forced to go to Ceylon for repairs and never returned. Houston, even
    with one of her main battery turrets out of action, remained in fight.


    The action on February 24 temporarily crippled Doorman''s striking force. This
    meant that a Japanese invasion force departed Starting Bay on February 6 with
    orders to occupy Makassar on southern Celebes, it was unopposed by Allied forces.
    The only defending unit in position was the American submarine S-37. It scored
    a rare early success for US Navy submarines by putting a torpedo into one of the
    IJN''s most modern Navyers, the Kagero-class Natsio on 8 February off Makassar.
    The following day, salvage efforts were abandoned, and the destroyer sank. February
    9, the Japanese landed at Makassar and quickly occupied this key port. The road
    to Java was open.


    Carrier Ryuyo, launched in 1931, had a checked early career. By the start of the
    war, she had been modified to address stability issues, but still considered a
    success because of her small fleet deck and small elevators that made efficient
    aircraft-handling operations impossible. She was assigned to support the invasion
    of the NEI islands and embarked 16 A5M4 "Claude" fighters and 18 B8N1 "Kate" attack
    planes. Despite limitations, and only able to launch small groups of aircraft
    at once, Ryuyo was effective during the campaign. Her Kates accounted for several
    enemy ships, but when given the chance to attack the ABDA striking force on February
    15, her aircraft hit nothing in four separate strikes.


    On February 27 she atoned for their performance and sank the Dutch destroyer Van
    Lee with three bombs. On March 17, her aircraft assisted in the sinking of US
    Navy destroyer Puyo. Ryuyo went on to create more havoc against Allied shipping
    in the Indian Ocean before being sunk by US Navy aircraft near Guadalcanal in
    August. (Yamato Museum)


    # THE INVASION OF SUMATRA


    By mid-February, Japanese plans in Southeast Asia were running ahead of schedule.
    The largest success to date was registered on February 15, when the British garrison
    in Singapore surrendered. This opened the way for the Japanese to invade Sumatra,
    the NEI''s most important island from a resource perspective. The key objective
    was Palembang on southern


