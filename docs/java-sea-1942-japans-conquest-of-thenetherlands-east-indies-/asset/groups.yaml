    a night run through the narrow Bali Strait. Given permission to do so, he departed
    at 1700hrs on February 28 and entered the Bali Strait at 0200hrs the next morning.
    Four Hatsahara-class destroyers were assigned to the strait. Hugging the shore
    along the Java side of the strait, Binford''s destroyers were detected and brought
    under fire from the patrolling Japanese destroyers. On this occasion, the Japanese
    did not display a killer instinct. The American destroyers replied with their
    4in. guns, but neither Binford increased speed to 25 knots, made smoke, and broke
    out into the Indian Ocean without damage. The next day, no Japanese aircraft appeared,
    and the four ships arrived in Fremantle on March 4.


    Binford''s intuition to run the Bali Strait at night had proved correct. After
    his departure from Soerabaja on the 28th, several Allied ships remained in port
    - Exeter, Encounter, and the American destroyer Pope. Palliser did not want to
    run these through the Bali Strait because of Exeter''s draft, and he did not want
    to use the deep Lombok Strait because an undetected transit seemed unlikely. The
    Japanese held both sides of the strait, and because the prospects of air attack
    were great, he ordered the ships to use the Sunda Strait in the hope of catching
    the Japanese off. This order was a death sentence since the prospects of transiting
    the length of the Java Sea amidst numerous Japanese ships and constant air patrols
    to even get to the Sunda Strait was remote.


    ## THE END OF EXETER


    Exeter, Encounter, and Pope departed two hours after Binford and initially headed
    north before turning to the west. Gaining surprise was essential, since Exeter
    had only 20 per cent of her 8in. shells remaining and Encounter was without torpedoes.
    Any hope of gaining surprise was quickly dashed when a Japanese aircraft reported
    their departure. By 2300hrs, the commanding officer of Exeter had learned of the
    battle in progress in the Banda Strait. This should have been a red flag, prompting
    him to ignore his orders and try a new route, but it did not. By morning, the
    small force was proceeding west in an empty sea and was hopeful of making their
    escape. Any cause for optimism was smashed when 0750hrs the British sighed Nachi
    and Haguro to the southwest, Exeter turned back to the east hoping it had not
    been seen, but the Japanese were already bringing additional forces to close the
    trap. This was Vice Admiral''s Support Force with heavy cruisers Ashigara and
    Myoko, escorted by destroyers Akebono and Ikazuchi, which had been held south
    of Borneo. Now they were given a chance to engage the enemy. At 0935hrs, they
    made contact with Exeter.


    The appearance of IJN heavy cruisers presented Exeter''s skipper with few options.
    He ordered his small force to steer to the east to escape. The efforts of Exeter''s
    engine room crew had her speed to 23 knots, but since this was 10 knots slower
    than the pursuing Japanese, there was no hope of escape. The action began at 1010hrs
    with the Allied destroyers exchanging gunfire with Akebono and Ikazuchi. At 1020hrs,
    Ashigara and Myoko joined the fray, targeting Exeter from 2500 yards with the
    help of a floatplane to correct fire. Encounter and Pope made smoke to protect
    Exeter, and for the first hour of the action, the Japanese failed to score a hit.
    However, the Japanese continued to close in, with Ashigara and Myoko off Exeter''s
    port quarter, and Nachi and Haguro steaming off her starboard beam conserving
    ammunition. Two more destroyers, Kawakaze and Yamakaze, joined the hunt.


    The Allied ships put up a brave fight. Exeter and Pope fired torpedoes at Ashigara,
    but missed. Pope made another torpedo attack, firing four more at Ashigara, and
    five at Nachi, but these also missed. By 1115hrs, Nachi and...


