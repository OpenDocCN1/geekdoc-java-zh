    这是一场穿越狭窄巴厘海峡的夜袭行动。在获得许可后，他于2月28日1700出发，并于第二天清晨0200进入巴厘海峡。有四艘“旗原”级驱逐舰被分配在该海峡。宾福德的驱逐舰沿着海峡爪哇岛一岸行进，被发现并遭到巡逻的日本驱逐舰火力攻击。这一次，日本人并没有表现出杀心。。美国驱逐舰用其4英寸炮进行了回击，但宾福德既没有加速到25节，也没有造烟，便在毫发无损的情况下冲入了印度洋。第二天，没有日本飞机出现，四艘船于3月4日抵达弗里曼捷。


    宾福德夜间穿越巴厘海峡的直觉证明是正确的。在他28日从泗水出发后，有几艘盟军舰船留在了港口——埃克斯特号（Exeter）、遭遇号（Encounter）和美国驱逐舰教皇号（Pope）。帕利塞泽司令（Palliser）由于埃克斯特号的吃水深，不想让这些船穿越巴厘海峡，他也不想使用深水的龙汶海峡，因为他认为不被发现就通过的可能性很小。日本人控制着海峡两侧，由于空袭威胁巨大，他命令船只使用巽达海峡，希望让日本人措手不及。这一命令无异于死刑，因为在大量日本军舰和持续空巡的情况下，穿越整个爪哇海到达巽达海峡的可能性极其。


    ## 埃克斯特号的终结


    埃克斯特号、遭遇号和教皇号在宾福德两小时后出发，最初向北行驶后转向西。获得出奇至关重要，因为埃克斯特号仅剩20%的8英寸炮弹，而遭遇号没有鱼雷。当一架日本飞机报告他们的离开时，获得出奇的希望很快破灭。到2300，埃克斯特号的指挥官获悉班达海峡正在发生战斗。这本应是一个警告，促使他忽略命令并尝试新路线，但他没有这样做。到第二天早晨，这支小部队在空旷的海域向西行进，并希望能够逃脱。然而，当0750英国人看到长良号（Nachi）和框架号（Haguro）出现在西南方时，任何乐观情绪都被粉碎了，埃克斯特号转向东方希望未被发现，但日本人已经在调集更多力量包围陷阱。这是中将将的支持部队，拥有重巡芦原号（Ashigara）和妙号（Myoko），由驱逐舰曙号（Akebono）和雷号（Ikazuchi）护航，这些船一直停留在婆罗尼岛南部。现在他们获得了与敌战的机会。0935，他们与埃克斯特号取得了接触。


    日本海军重巡的出现让埃克斯特号船长几乎没有选择。他命令他的小部队向东逃生。埃克斯特号机舱人员的努力使其速度达到了23节，但由于比追击的日本人慢了10节，逃脱已无希望。战斗于1010开始，盟军驱逐舰与曙号、雷号交换火火。1020，芦原号和妙号加入战斗，在水上飞机的火力修正下，从2500码外对埃克斯特号进行攻击。遭遇号和教皇号造烟保护埃克斯特号，在战斗的第一个小时里，日本人未能命中。然而，日本人继续接近，芦原号和妙号位于埃克斯特号的左后方，长良号和框架号在右舷航行以节省弹药。另外两艘驱逐舰川风号（Kawakaze）和山风号（Yamakaze）加入了猎杀。


