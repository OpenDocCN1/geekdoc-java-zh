    # 左上方


    “威特·惠号”是1929年至1931年间服役的四艘“范加伦”级驱逐舰之一。这些舰只在之前的四艘“甘特”级驱逐舰的基础上进行了改装，增加了40毫米防空炮，而这种配置对于之前型号的75毫米炮座来说是不够的。尽管这在当时属于重型防空配置，但在荷属印度群岛（NEI）战役中被证明完全不适用。（荷兰军事历史研究所）


    一种英制的21英寸武器，在28节航速下最大射程为10,936码。荷兰人还在荷属印度群岛部署了15艘潜艇，其中大多数是20世纪20年代的设计。所有的荷兰海军机部队都面临着维护和人员问题，因为某些零件无法从荷兰本土获得，且荷属印度群岛的维修设施不足以维持舰队处于战斗状态。其中一艘驱逐舰“威特·惠号”缺少船员。当“甘特号”搁浅并自沉时，其全体船员被转移到了爪哇的东北海岸。那里拥有现代化设施，包括一个15,000吨的干船坞。巴达维亚的港口地直拉普普里克（Tjilatjap
    Priok）位于爪哇岛的西北海岸。


    # 右上方


    战前的“短岸号”。荷兰驱逐舰比美国的平甲板驱逐舰更大、性能更强，但在火力方面远不如“短岸”级。“短岸号”在爪哇海海战中被日本人的鱼雷击沉。（荷兰军事历史研究所）


    位于爪哇的荷兰基地是盟军进行该战役的主要设施。主要基地是泗水汶，它在战期间因向爪哇补充增援燃料而变得日益重要。该港口设施很少，但在12月，荷兰人在那里移动了一艘8,000吨的浮动干船坞以提供一些维修能力。


    ![](img/9f6cbeb32985c11de35c8798e522b788_31_0.png)


    这张照片于1942年2月1日拍摄于泗水汶海军基地的海望塔上。一艘扫雷艇正护送舰只通过水道。泗水汶是爪哇岛主要的海军基地，也是盟军（ABDA）海军作战的中心。（荷兰军事历史研究所）


