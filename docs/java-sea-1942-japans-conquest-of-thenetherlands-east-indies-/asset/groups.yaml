    # DE OF DE RUYTER (PP. 76–77)


    Approaching midnight, Doorman refused to break off the action. At this point,
    the Allied force consisted of only four cruisers, led by Doorman''s flagship *De
    Ruyter*. This scene shows *De Ruyter* steaming at high speed (1). The ship''s
    four 5.9in. turrets are trained to port and are elevated for long-range fire (2).
    The action was finally brought to an end by a salvo of 12 Type 93 torpedoes from
    *Nachi* and *Haguro*. From a range of 14,000 yards, the Japanese torpedoes headed
    toward the Allied cruiser column. Doorman was slow to respond to this threat.
    At 2336hrs, a torpedo from


    Nachi hit Java which blew off the cruiser''s stern and caused her to sink with
    heavy loss of life some 15 minutes later. At about 2340hrs, a single torpedo from
    Haguro hit De Ruyter aft (3). The Type 93 with its powerful warhead hit the starboard
    aft engine as shown in this view. The ship lost power and coated to a stop. Within
    30 minutes, the captain ordered the crew to abandon ship. The starboard list increased
    until the ship sank two and a half hours later. The torpedo hit on *De Ruyter*
    brought one of the longest surface battles of the Pacific War to an end.'
