    ## DE OF DE RUYTER (PP. 76–77)


    Approaching midnight, Doorman refused to break off the action. At this point,
    the Allied force consisted of only four cruisers, led by Doorman''s flagship.
    This scene shows *De Ruyter* at high speed. The action was finally brought to
    an end by a salvo of Type 93 torpedoes from *Nachi* and *Haguro*. From a range
    of 14,000 yards, the Japanese torpedoes headed toward the Allied column. Doorman
    was slow to respond. At 2336hrs, a torpedo from Nachi hit Java which blew off
    the cruiser''s stern and caused her to sink with heavy loss 15 minutes later.
    The ship lost power and came to a stop. Within 30 minutes, the captain ordered
    the crew to abandon ship. The starboard list increased until the ship sank two
    and a half hours later. The torpedo hit on *De Ruyter* brought one of the longest
    surface battles of the Pacific War to an end.


    ## THE BATTLE OF THE SUNDA STRAIT


    The first of a series of desperate battles fought by Allied ships seeking to flee
    the Java Sea was fought on February 28 in the Sunda Strait. Houston and Perth
    departed Tanjung Priok at 1900hrs on February 28. Evertsen, also present, did
    not get underway until 2045hrs. The three ships headed west to transit the Sunda
    Strait. But the Allies were too slow. The large Japanese invasion force had already
    arrived at Batavia Bay, which was at the northern entrance of the Sunda Strait.
    Despite their awareness of the presence of Allied warships in Batavia, Rear Admiral
    Hara, commander of the convoy screen, was not prepared for the two Allied cruisers
    coming from the east. The Japanese initial deployment placed only Fubuki to the
    east of the landing area.


    This Japanese wartime painting shows Houston under attack at the battle of the
    Sunda Strait. The destroyer in the foreground is one of the three Kamikaze-class
    present and serving the torpedo launchers on those ships. The image is fairly
    accurate in that the battle was a melee fought at close (US Naval History and
    Heritage Command)


