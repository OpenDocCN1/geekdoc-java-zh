    塔尔伯特无视了进入锚地内部的距离，尽管他的两艘驱逐舰已经弹尽了鱼雷。帕拉现在利用其4门大炮声称对运输船和“驱逐舰”进行了多次命中。到此为止，美国列队保持了凝聚力，在烟雾和混乱中寻找更容易攻击的目标。塔尔伯特的旗舰约翰·D·福德号与其他驱逐舰失去联系，后者已离开战斗区域。约翰·D·福德号仍有鱼雷，并在0346向鹤丸号发射了最后两枚。这艘运输船四小时前被荷兰潜艇袭击过；现在被美国的鱼雷彻底送了终结。约翰·D·福德号继续在远距离用4门大炮猛击了两艘运输船。尽管受损，但均未沉没。0410，约翰·D·福德号也向南移动。美军受到的唯一损害是约翰·D·福德号被一次小口径命中，导致四人受伤。


