    对珍珠港的袭击并非战争初期日本最重要的海军行动。最重要的行动是夺取新新（NE）的资源；珍珠港袭击之所以重要，是因为它导致美国海军无法在东南亚抗衡日本的侵略。（美国海军历史与遗产司令部）


    夏威夷。由于取得了完全的意外性，两波日本飞机对毫无准备的美国人造成了惨痛的代价。总共有18艘美国海军军舰沉没或受损，其中包括当时在场的所有八艘战舰。太平洋舰队的三艘航母均未在场，因此全部幸存。12月10日，关岛。日本军唯一的失误发生在12月11日，当时试图入侵中太平洋的威克岛，遭了美国驻守军的击退。日本于12月23日以更大规模返回并成功占领了该岛。


    在东南亚，日本军很快证明了盟军的评估：他们一次只能进行单一入侵。12月8日在菲律宾地面上摧毁美国空军后，日本军将注意力转向亚洲舰队位于马尼拉湾的主要基地发动了51枚炸弹的袭击。这些炸弹随后破坏了该海军基地。炸弹摧毁了大部分造船厂以及用于维修的的机间、保持舰队战斗状态的零件和其他物资。正在大修的潜艇被摧毁，鱼雷也有损失。正在大修的驱逐舰普尔斯伯里号（Pillsbury）和珀里号（Pearary）也受损。尽管这两艘驱逐舰所有主要辅助舰都能在接下来的几天离开马尼拉向南移动，但这次袭击清楚地表明，哈特（Hart）至少从马尼拉派遣潜艇的计划是不行的。舰队向南移动，并非前往暴露的新加坡，而是前往澳大利亚西北。


    在获得空中控制后，日本军在菲律宾进行了一系列登陆。这些行动于12月8日开始，在吕宋岛北125英里的岛上进行了小规模登陆。10日，在吕宋岛和巴丹岛之间的卡米欣岛以及吕宋岛北部的阿帕里进行了登陆。12月12日，在吕宋南部的莱加斯毕登陆进展顺利。林义延湾的主要登陆迫使防守的美国人撤退到巴丹半岛。在这里，美国人和菲律宾人坚守到了4月，最后的防守者直到5月6日科雷吉多尔岛（Corregidor
    Island）沦落才投降。尽管他们的行动最终是徒劳的，但菲律宾的美国防守者坚持的时间比新加坡的英国人或荷属东（NEL）的荷兰人要长得多。


    在对菲律宾发动初期进攻的同时，日本军还入侵了新马来亚北部和泰国南部。12月8日，日本军在泰国南部的宋卡（Singora）和北大年（Patani）以及马来亚北部的甲市巴鲁（Kota
    Bharu）登陆。上岸后，日本第25军在12月11日的吉特拉战役中击败英国人，决定了北马来亚的命运。1月初，随着日本军在斯林姆河战役（Slim River）击溃了两个印度旅团，中马来亚失守。到1月25日，英国人已决定撤回新加坡岛。日本军于2月8日跨越柔佛海峡发动进攻，一周后迫使守守军投降。


