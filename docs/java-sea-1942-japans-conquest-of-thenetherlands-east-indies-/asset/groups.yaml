    # EXETER IN DISTRESS (PP. 62–63)


    After an hour of inconclusive long range gunnery, little damage had been done
    to either side. At about 1700hrs, the Japanese closed the range to seek a decision.
    At the same time, they concentrated fire on Exeter and Houston, the two largest
    Allied ships. At 1708hrs, Exeter (1) was hit by an 8in. shell from Haguro. Japanese
    gunnery was accurate, as shown by the salvo of which (2) had bracketed the cruiser
    with two shell explosions in the view of (3) us. The effects of each single 8in.
    shell were catastrophic and went a long way to deciding the battle. The shell
    hit the shield of one of the 4in. twin mounts before penetrating through an armored
    hatch into a boiler room ventilator. The shell went through A Boiler Room flinging
    shrapnel in all directions and then penetrated


    into B Boiler Room causing further damage. The result was to place both starboard
    boilers out of action and damage to a superheater placed the four aft boilers
    out of commission. The loss of six of the ship''s eight boilers of the engine
    room crew reduced speed to a six knots. The reduced power also brought her main
    battery out of action. Exeter already avoided a collision with the cruisers behind
    her. Heavy smoke is already coming out of both her stacks indicating the damage
    below in the boiler rooms (3). Exeter is firing her last 8in. salvo before her
    turrets lost power (4). Houston was some 600 yards behind Exeter, and she is making
    an emergency turn to port (5).


    ![](img/9f6cbeb32985c11de35c8798e522b788_63_0.png)'
  - '[PAGE 64]


    expected an attack, and the Japanese expected the results to be devastating. Nishimura
    expected his light cruiser and six destroyers to comply with Takagi''s order to
    execute a torpedo attack. At 1634hrs, his ships were the first to launch when
    Naka fired four torpedoes at 15,000 yards range. Between 1640 and 1645hrs, his
    destroyers sent another 23 weapons towards the Combined Striking Force. In addition
    to Nishimura''s ships, light cruiser Jintsu fired at 1635hrs and Haguro fired
    a salvo at 1652hrs from 22,000 yards. Nachi was unable to contribute because his
    negligent torpedo crew left a valve open which blew the air pressure to launch
    the torpedoes. 30 torpedoes caused a disappointing return. At 1713hrs, one Kortena
    was amid. According to a nearby destroyer skipper, the destroyer disappeared under
    two minutes.


    The destruction of Kortena and the increasing effectiveness of Japanese cruiser
    gunnery drove Doormans force into chaos. In the first hour of the battle, the
    two Japanese cruisers fired 1,271 8in. rounds. Eventually, this weight of fire
    would score. In addition to the hit on De Ruyter, which was a dud, another shell
    hit Houston at 1706hrs – also a dud. The next hit at 1708hrs was on Exeter and
    was the most important of the entire battle. The shell, probably by Haguro, penetrated
    to a boiler room and exploded. The final effect was to knock boilers off line,
    which reduced speed to 11 knots and temporarily knocked power to the main battery.
    After a collision with the cruisers behind him, Exeter''s captain ordered the
    cruiser, now billowing smoke, to make an immediate turn to port. The following
    three cruisers suit, since they thought they had missed a signal from De Ruyter
    which was leading the column. The Allied column disintegrated; De Ruyter continued
    toward the column. The Japanese and Perth laid a smokescreen to cover the wounded
    Exeter. Doorman was forced to turn his flagship around to reorganize his force.
    To give him the time he needed, he ordered the three British destroyers to execute
    a torpedo attack.


    > Haguro was the undisputed star performer of the battle of the sinking Java Sea.
    She was responsible for hitting the heavy cruiser Exeter with an 8in shell, which
    brought it out of action, then torpedoing Dutch destroyer. In the final phase
    hit De Ruyter with a torpedo that led to its sinking which brought the battle
    to a close. Haguro''s long maritime career was brought to an end in the Malacca
    Strait on May 16, 1945 at the hands of British destroyers. (Yamamoto Museum)


