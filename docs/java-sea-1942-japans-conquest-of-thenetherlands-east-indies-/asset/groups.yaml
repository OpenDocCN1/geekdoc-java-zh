    日本对打兰颇的进攻由360名陆军伞兵（JJA）率领。他们的命令是在荷兰人摧毁它们之前占领油井、泵站和炼油厂。然而，盟军军队最初的激烈抵抗阻碍了伞兵降落，尽管降落行动最终完全成功，但盟军的抵抗在两天内被击溃了。（美国海军历史与遗产司令部）


    苏门答腊。这里不仅有两个大型机场，最重要的是对日本人来说，它还是两个大型炼油厂和大型油田的所在地。尽管打兰颇位于内陆深处，但它很容易受到海路入侵，因为它位于穆西河（Moesi
    River）上，该河流可大型船只通行。


    日本海军西舰队从支持新加坡战役的马来亚护队任务中解脱出来，准备了一次进攻打兰颇的大规模行动。为了护送重巡洋舰，泽泽少将集结了五艘重巡洋舰、轻巡洋舰“仙台号”（Sendai）以及11艘驱逐舰。轻型航空母舰“龙凤号”（Ryuyo，携带12架战斗机和15架B5N1“凯特”攻击机）也从东方舰队调来提供支持。这支入侵军于2月10日从印度支那的山湾出发向南行驶。


    盟军一直在关注这一大兵结，并制定了阻止计划。2月11日，美国海军潜艇的袭击未成功，英国的两次空袭也同样失败。多尔曼（Doorman）的突击部队也接到命令前往苏门答腊东南部的小型荷兰海军基地奥斯塔（Oost）进行拦截。2月12日正式接管ABDA海军部队指挥权的赫尔里希少将分配了他眼中在表面上是一支强大的力量——荷兰巡洋舰“德·鲁伊特”号”（De
    Ruyter）、“雅加瓦号”（Java）和“特罗姆普号”（Tromp）、英国巡洋舰“埃克斯塞特号”（Exeter）、澳大利亚巡洋舰“霍巴特号”（Hobart）、六艘美国驱逐舰和四艘荷兰驱逐舰。凭借这支显著增兵的力量，赫尔里希命令多尔曼攻击日本入侵护队。于是，突击部队于2月14日下午离开奥斯塔哈芬（Oostshaven）。


    2月15日，多尔曼率领突击部队在打兰颇外海攻击日本入侵军。盟军所有巡洋舰全天遭到日本空军出击的轰炸。图中显示了“雅加瓦”号正遭受攻击。由于是几波轰炸机的目标，她仅遭受了轻微的碎片损坏。（荷兰军事史研究所）


    “德·鲁伊特”号在22月15日的空袭中未受任何损坏。然而，由于失去了突然性优势，多尔曼取消了行动。（荷兰军事史研究所）


    不幸从一开始就一直纠缠着这次行动。15日凌晨，荷兰驱逐舰“范·根亨特”号（Van Ghent）在班克（Bank）和比利灵顿（Billington）之间的斯托泽海峡（Stolze
    Strait）强行通过。该船全没，多尔曼分配了另一艘荷兰驱逐舰接载船员并凿沉该船。随后，在0923时，一架日本巡洋舰水上飞机发现了突击部队，突然性丧失。空袭随之而来。第一次是1020时，来自“龙凤号”的四架B5N1“凯特”选定“埃克斯塞特”号为目标。飞机从高空投掷了550磅弹，但没有命中。这次攻击之后，是从波罗尼岛飞来的23架舰式战斗机发起的规模更大的进攻。从高空看，它们只对两艘美国驱逐舰造成了轻微损害。1130时，七架B5N出现并攻击了“埃克斯塞特”号，再次仅造成了轻微损害。此时，多尔曼取消了行动。然而，突击部队的磨难还没有结束。另外两组共44架飞机的陆基轰炸机到达并进行了高空攻击。没有命中。来自“龙凤号”的19架B5N分三组进行攻击也未果。突击部队与日本海军航空队之间持续一天的遭遇战以平局结束。除了擦边外没有命中，没有飞机被击落。但这次规模最大的遭遇战除了擦边外没有命中。结果，由于除了擦边外没有命中，没有飞机被击落。结果，由于由于除了擦边没有命中命中，持续一天的遭遇。结果结果行动被迫撤退了苏门答腊。15日，日本的轰炸机占据了主权。结果，行动阻止了打兰颇。


