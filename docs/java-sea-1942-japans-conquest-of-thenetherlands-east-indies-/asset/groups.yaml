    First blood in the battle of the Java Sea was the torpedoing of destroyer Kortmaer.
    The Type 93 hit amidships broke the ship in two, and both halves were de-heaved
    vertically within 90 degrees. The stern section sank at once, but the bow halves
    sank for another five minutes, giving the crew time to get into the water. Of
    the 153 men in the crew, 115 survived the torpedoing (Netherlands Institute for
    Military History).


    It took until 1725hrs for Doorman to reestablish control. De Ruyter led the other
    cruisers, less *Exeter*, and the four American destroyers to the northeast. Twenty
    minutes later, the reduced Allied force was headed north and emerged from the
    smoke to find itself in more trouble. Takagi was kept informed of the plight of
    Doorman''s force by his floatplanes, remained up for almost the entire battle.
    Takagi decided to press the attack on the Allied force, which looked to be in
    utter disarray. To finish the Allies he ordered another massed torpedo attack.
    This barrage totaled an amazing 99 torpedoes, with their primary target being
    *Exeter*. The attack was launched from various ranges—*Nachi* and *Haguro* contributed
    each from 27,000 yards at 1754hrs; Naka launched four at 1750hrs from 18,500 yards;
    Jintsu launched four from 20,000 yards at 1754hrs. The eight destroyers of *Destroyer*
    Squadron 2 closed to 15,000 yards before each launched a full salvo. Four of the
    destroyers from Nishimura''s Destroyer Squadron 4 launched their full loads at
    1804hrs after closing to 10,000 yards. Nishimura''s last destroyers, *Asagumo*
    and *Mineumo*, closed to 6,500 yards before one launched, with the other being
    unable to get a firing solution. Amazingly, none of these 98 hit their target.
    The seconded Japanese torpedo attack was a complete failure.


    As the Japanese destroyers closed for their attack, the three destroyers emerged
    from the smoke. *Electra* was in front and was soon engaged with Tanaka''s Destroyer
    Squadron 2. *Electra''s* veteran crew fought well against heavy odds. The British
    destroyers hit Tanaka''s flagship with a 4.7in. shell which killed one and wounded
    four. Encounter followed Electra out of the smoke, and immediately took Jintsu
    under fire. Nishimura''s lead destroyers Asago and Mineumo were the closest to
    the ships; Encounter and Mineumo exchanged fire at short range between 1800 and
    1810hrs with the Japanese ship taking minor damage. Meanwhile, Electra was busy
    engaging Asago. The British ship put a shell into Asago''s engine room from 5,000
    yards, which killed four and wounded 19 and brought the Japanese ship to temporary
    halt. Electra''s luck did not hold. Asago hit the British ship on her ridge, and
    then in a boiler room which caused a loss of power. Mineumo then finished off
    the powerless Electra, which sank at 1816hrs. Only 54 of her crew survived, and
    they were rescued by an American submarine the following day.


    In the opening phases of the battle, Doorman''s force had suffered minimal damage
    from the two Japanese torpedo attacks, but Japanese gunfire had no progress getting
    to the invasion convoy. With the Japanese floatplanes providing constant updates
    to Takagi, it appeared unlikely that Doorman could find an opening to close with
    the convoy. In spite of his increasingly unfavorable situation, Doorman continued
    to press his attack. After re-forming his cruiser force with De Ruyter leading
    Perth, Houston, and Java, he headed to the north and placed his force between
    the Japanese and Exeter. Since Exeter could not exceed 15 knots, even after the
    best efforts of her engine crew to make repairs, Doorman ordered her to return
    to Soerabaja escorted by Witte De With. She arrived there without further incident.


    With darkness approaching, Doorman needed to break contact with the Japanese to
    find a new path to attack the invasion convoy under


