    ## 左上方


    1920年代左右，停泊在中国福州（Chefoo）的驱逐舰护卫舰“黑隼号”（Black Hawk）；光是六艘驱逐舰就由一艘商用船改装而成，并被分配到菲律宾的亚洲海军兵工厂（1922年），并一直维护到战争爆发。亚洲的驱逐舰被分配给舰队，并留在了远东的卡维特海军兵工厂（Cavite
    Navy Yard）（（美国海军历史与遗产司令）。


    速度仅勉强达到28–30节。到战役结束时，鱼雷供应越来越短缺。在爪哇海，某些驱逐舰仅携带六枚鱼雷。由于预算原因，船龄过大，维护也是一个现实问题。其他演习既短又不切实际，主要是由于缺乏时间和资源。


    整个舰队在他们最可能执行的作战类型上训练得很差。例如，驱逐舰没有进行过夜战练习。由于备件不足，舰队中几乎所有船只都难以维护。


    亚洲舰队的整个航空部队由第10巡逻中队组成，拥有28架PBY-4卡塔利娜型飞行艇。这些飞机非常擅长执行侦察，但能力非常有限。注意，亚洲舰队在防空方面完全依赖其他军种或国家。


    ## 右上方


    驱逐舰“鹦鹉号”（Parrot）于1928年11月在吉亚姆（Giam）外航行。她于1925年加入亚洲舰队。亚洲舰队的平甲板驱逐舰基本上较短，缺乏雷达，且反潜和防空能力极小（（美国海军历史与遗产司令）。


    ## 皇家海军


    皇家海军投入荷兰东印度群（NEI）防御的船只也很大程度上是二流水平。它们由巡洋舰“郡号”（*Exeter*）领导，它是1939年12月普河之战中与德国装甲舰“快速号”（*Spee*）战斗的英雄。她在战斗中受伤，在随后的一年里进行了维修和现代化改造。在皇家海军15艘重巡洋舰中，“郡号”和她的姐妹舰“约克号”（*York*）最小（满载量略超过10,000吨），仅携带8英寸主炮，而不是通常的八门。她确实携带了六具鱼雷管，但武装相对薄弱。


    ![](img/9f6cbeb32985c11de35c8798e522b788_27_1.png)


    重巡洋舰“郡号”，现代化改造后的照片。这张侧面图显示了三座双联8英寸炮塔和一排21英寸鱼雷管。面对日本海军的“鸟岳”级重巡洋舰，她将不堪从。。（（荷兰军事历史研究所）。


    3米宽的主带。在现代化改造期间，她装备了早期预警和火控雷达，使其成为战役中唯一配备雷达的船只。


    英国海军派遣队包括几艘巡洋舰。最好的两艘是改装过的利兰德级轻巡洋舰——“霍巴特号”（Hobart）和“珀斯号”（Perth），分别于1938年和1939年转交给澳大利亚皇家海军。两者都是老牌战舰，特别是“珀斯号”，在1940年至1941年间的地中海建立了优异战绩。两艘船都携带6英寸炮和八门21英寸鱼雷管，但防护措施很差。还有两艘D级巡洋舰——“龙号”（Dragon）和“达娜伊号”（Danae），但它们产于1918年，不胜任前线任务。两者都各携带六门单基座6英寸炮和12门21英寸鱼雷管。


    可用的英国驱逐舰数量很少，且种类杂。三艘E级舰于1934年服役。“电光号”（Electra）和“快递号”（Express）从远东抽离，护卫“威尔士王子号”（Prince
    of Wales）和“遭遇号”（Encounter），后者的排水量约为1,500吨，这使它们看起来比所有现代日本驱逐舰都要小。每艘携带四门4.7英寸炮和八门21英寸鱼雷管。“电光号”和“快递号”都是老牌战舰。


    “珀斯号”的姐妹舰是改装利兰德级轻巡洋舰“霍巴特号”，于1938年转交给澳大利亚皇家海军。在战役最后阶段，她被分配到西印度群岛对抗日本水面部队。


    “珀斯号”最初于1936年作为英国海军的“安菲翁号”（Amphion）服役，于1939年转交给澳大利亚皇家海军。配备八门6英寸炮、八门4英寸炮和二十门鱼雷管，她在地中海表现活跃。在爪哇海海战中，沉没。1943年，结果显示这艘沉骸被拆除了许多部件，用于建造（其他船只）。（美国海军历史与遗产司令）。


