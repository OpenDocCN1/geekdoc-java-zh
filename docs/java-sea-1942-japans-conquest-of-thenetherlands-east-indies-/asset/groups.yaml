    Japanese. When the Japanese did react to the presence of the two cruisers,

    responded in a chaotic way, sinking five of their ships in the process

    and taking a considerable amount of time to finally sink the two intruders.

    On the surface, the result of the Sunda Strait indicated yet\another Japanese
