    ## The Royal Navy


    RNN''s East Indies Squadron was a thoroughly inferior light cruiser in firepower,
    protection, and speed. Three cruisers were in commission, but all were outclassed
    by Japanese heavy cruisers. The Dutch Navy forces in the NEI were not prepared
    for the start of the war. The Dutch had seven destroyers in commission. They were
    all of the same class, based on a British design, and were constructed in the
    Netherlands beginning in 1925. Each carried four 4.7in. guns in single mounts
