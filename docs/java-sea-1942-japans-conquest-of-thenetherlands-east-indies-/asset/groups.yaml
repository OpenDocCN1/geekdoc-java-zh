    Wokeba was one of six ships in the Hatsuhara Class. Four of these were assigned
    to Destroyer Division 21 and were active in supporting several invasions in the
    eastern NEL. Their only opportunity to engage the Allies came on the night of
    February 28-March 1, when they detected the four ships of the US Navy''s Destroyer
    Division 58 traversing the Sunda Strait. Despite having an advantage in speed
    and power, the Japanese ships did not pursue aggressively, and all four Americaners
    escaped (US Naval History and Heritage Command)


    More explosions followed, and these were at the expense of the Allies. At about
    0005hrs on March 1, a torpedo possibly from Harukaze Perth in her forward engine
    room. Two minutes later, another hit under within the ship was reduced to shambles.
    When the barrage from Murakumo and Shirakumo arrived, two more hit. Unable to
    withstand these blows, the cruiser rolled over and sank at 0012hrs. Her crew of
    686 men went down with the ship, including the commanding officer. Among the survivors,
    106 died in Japanese captivity.


    None of the torpedoes hit Houston, but she was now alone. Seeing the way to the
    west blocked, Houston''s captain steered south luckily finally ran out. Shells
    from Mikuma and Mogami began to score, and the crew recorded three torpedo hits,
    but the correct number will never be known in the final chaotic moments it was
    impossible to distinguish shell from torpedo hits. The commanding officer ordered
    abandon ship at 0025hrs, and then was killed by shapnel. At 0029hrs, Shikishima
    came to short range for a final torpedo hit, and five minutes later the cruiser
    disappeared. Of her crew of 1,061, 368 survived the sinking.


    A postscript to the destruction of the two Allied cruisers was that of Everten.
    Seeing the battle in the Sunda Strait from a distance, the commanding officer
    attempted to head north along the coast of Sumatra. At 0130hrs, the Dutch destroyer
    was destroyed by Murakumo and Shirakumo. In an uneven fight, the Japanese destroyers
    set the Dutch ship ablaze. The commanding officer ordered ship to save the crew.


    Not all was disaster for the Allies. Binford, whose four destroyers were in Soerabaja,
    not convinced that the best escape route was through the Sunda Strait. He convinced
    Glassford to allow him to make


