  - '[PAGE 29]


    ![](img/9f6cbeb32985c11de35c8798e522b788_29_0.png)


    Jupiter, also detached from the Mediterranean Fleet, was commissioned in 1939
    and possessed a heavier armament of three twin 4.7in. mounts and ten 2in. torpedoes
    in quintuple mounts. She had already blooded the Japanese by sinking submarine
    1-60 on January 17, 1942. In addition, several 1,220-ton full load S-class destroyers
    were assigned to the Eastern Fleet. Commissioned between 1918 and 1919, they carried
    three 4in. guns and four torpedoes. The principal British destroyer torpedo of
    the war was the Mark IX, with a maximum range of 15,000 yards at 35 knots.


    The D-class light cruiser Danae photographed before the war Note the individual
    6in. gun mounts and two port-side triple torpedo mounts. Commissioned in 1918,
    Danae was obsolete by the start of the Pacific War. Assigned to convoy duty and
    the Japanese Force, the two D-class cruisers never had a chance to engage the
    Japanese (US Naval History and Heritage Command)


    # The Royal Netherlands Navy


    Dutch naval forces in the NEI were not prepared for the start of the war. Three
    cruisers were in commission, but all were outclassed by their


    De Ruyter the most powerful unit in the RNN''s East Indies Squadron was a thoroughly
    inferior light cruiser design in firepower, protection, and speed. Two of the
    ships'' twin 5in turrets can be seen in this view; in total, seven 5.9in guns
    were carried. No heavy antiaircraft guns were carried; the cluster of five 40mm
    mounts can be seen forward of the twin 6in turrets. No torpedoes were carried.
    The main belt was only fitted with two inches of armor. Maximum speed was a mediocre
    32 knots. When matched against Japanese heavy cruisers, the result was predictable
    (Netherlands Institute for Military History)


