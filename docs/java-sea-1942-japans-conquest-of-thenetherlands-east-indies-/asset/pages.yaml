    were silhouetted by the fires from the oil facilities which had been set ablaze
    by Dutch. Several Japanese ships spotted the American destroyers, but raised a
    proper alarm. In the minutes before 0300hrs, mineseper W1 spotted the approaching
    Americans. At first they were taken for Naka, which also had four stacks. Before
    the Japanese ship could, the four destroyers disappeared into the night. The Americans
    identified the mineseper as destroyer and three of the destroyers fired a total
    of seven torpedoes at the ship, the angle was unfavorable and none hit.


