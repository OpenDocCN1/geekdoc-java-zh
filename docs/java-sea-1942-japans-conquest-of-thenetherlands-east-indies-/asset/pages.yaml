    College and became a naval aviator in 1915. After a Naval Staff course and various
    command tours on destroyers and cruisers, he was appointed commander of the Naval
    Air Service on the NEL. This was followed by a promotion to flag in May 1940 and
    the assumption of the command of the East Indies Squadron. Doorman was a difficult
    figure to assess, especially in light of his actions during the campaign. He was
