  md: '# BIBLIOGRAPHY AND FURTHER READING


    The NEI campaign was to be forgotten, in recent years many came to accounts published
    in English. However, many titles have been issued which have gone a long way to
    redress this shortcoming. Among these are the two volumes of the 102-volume Senshi
    Sozho (War History Series - the "official" Japanese history of the navy which
    deal with the invasion of the NEI have been translated into English. This is the
    first time any volume of this series has been translated into English in its entirety.


