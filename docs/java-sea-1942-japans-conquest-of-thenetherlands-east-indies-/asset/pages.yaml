    Hawaii. Gaining total surprise, two waves of Japanese aircraft exacted a terrible
    toll on the unprepared Americans. In total, 18 US Navy ships were sunk or damaged,
    including all eight of the battleships present. None of the Pacific Fleet''s three
    carriers were present, and thus all survived. In Guam on December 10. The only
    Japanese misstep occurred on December 11, when an attempt to invade Wake Island
    in the Central Pacific was repelled by the American garrison. The Japanese returned
    in greater force on December 23 and successfully occupied the island.


    In Southeast Asia, the Japanese quickly proved the Allied assessment that they
    were capable of only a single invasion at a time. After crippling American airpower
    in the Philippines on the ground on December 8, the Japanese turned their attention
    to the Asiatic Fleet''s main base at Manila Bay in a raid with 51 bombs. These
    proceeded to waste the naval base. The bombs destroyed much of the navy yard with
    its repair and machine shops, parts and other stores to keep the fleet in fighting
    order. submarine Seon, in overhaul, was destroyed, and Seabdragon torpedoes were
    lost. Destroyers Pillsbury and Pearary, also undergoing overhaul, were damaged.
    Despite the fact that both destroyers and all major auxiliaries were able to deploy
    Manila and head south over the next few days, the raid demonstrated clearly that
    Hart''s plans of at least operating'
