  md: '# ANALYSIS


    The battle of the Java Sea was one of the largest surface battles of the Pacific
    War. A total of 32 ships took part, and of these five were sunk, all to another
    eight damaged (two Allied and six Japanese). In addition to Java Sea, there were
    four other major surface actions fought during the campaign. Of the Dutch Navy''s
    three subs Tromp remained afloat. The Asiatic losses each tell the story. In only
    one of these, Balikapan, could the Allies be considered victorious. Three cruisers
    and seven destroyers available at the start of the campaign, only light cruiser
    remained. Asiatic Fleet''s losses were considerable, but not as drastic. Three
    cruisers began the war, and two (Boise and Marblehead) survived. Both navies had
    fought with determination, but for little effect. Though the Royal Navy never
    supported the defense of the NEI Seven of the fleet''s 13 destroyers also survived.
    British losses totaled one heavy cruiser and four destroyers. The Australians
    lost a light cruiser.


    At the start of the campaign, the RNN had 12 operational subs more in overhaul
    or reserve. In the NEI there three more. This is K-XIII photographed in 1942 and
    only carried torpedoes. Like the more numerous US submarines were ineffective
    and attacking Japanese forces in the NEI. Four Dutch subs were lost during the
    campaign. In the final days of the campaign K-X, K-XIII, and K-VIII were trapped
    in Orabaja and scattered (US Naval history and Heritage Command).


    The IJN had accomplished the utterly essential mission of seizing the NEI and
    its critical resource facilities quickly. In so doing, no Japanese landing was
    halted or delayed. There were occasions when sloppy tactical dispositions provided
    the Allies with the chance of inflicting local reverses, but the Allies were too
    unlucky or weak to take advantage of them. Japanese naval losses were light during
    the campaign. Allied surface naval units did


