  md: '# THE BATTLE OF THE JAVA SEA


    Doorman elected to place his force into three parallel columns as he headed to
    the northwest to engage the Japanese. The center column consisted of his cruisers,
    led by his flagship De Ruyter. Flanking the main column were two columns of destroyers,
    one comprised of the three British destroyers and the other with the Dutch and
    American destroyers. The Dutch Kortena had boiler problems which reduced their
    top speed to 26 knots, and fell behind. Also left tagging behind the four American
    destroyers had been given an order by Doorman not to pass the Dutch destroyers.
    The inability of the Combined Force to exceed 26 knots became a key factor in
    the battle. Doorman''s slower speed meant he was unlikely to outmaneuver the Japanese
    and many uncontested thrust against the transport group even more likely.


    The day phase

    two sides continued to close. At 1610hrs, Electra spotted the westernmost Japanese,
    the light cruiser Jintsu and her four destroyers. Later alone, Electra also reported
    the two Japanese cruisers. At the same time, the Japanese spotted Doorman''s force.
    At 1615hrs, Jintsu began the battle, firing 5.in. main battery at Electra. The
    range was 18,000 yards, close to the maximum range for this weapon. Despite this,
    the Japanese were able to straddle their target. This opening salvo was by Nachi
    and Haguro opening fire with their 8in. guns on the Allied cruisers at 28,000
    yards. Their initial rounds fell well. For Japanese doctrine, Takagi wanted to
    fight a long-range gunnery duel, since he believed his gunnery was more effective
    at extended ranges and to limit the ability of the Allies to respond with the
    6in. guns ahead of their cruisers. Without waiting for orders, Exeter''s captain
    ordered his ship to fire back at 1617hrs, and he was quickly joined by Houston
    having fired two turns. Both Japanese and Allied long range 1631hrs a Japanese
    8in shell hit De Ruyter, but it was a dud. The force of the Japanese cruisers
    was accurate enough to place the occasional straddle, at 26,000 yards or more,
    the likelihood of a hit was small.


    The two cruisers continued on generally parallel courses. Takagi was unwilling
    to close the range and continued his tactic of executing long-range gunnery attacks.
    Doorman needed to close the range to bring his 6in. cruisers into play. With 25
    in. guns, this was his only area of advantage. But again, his slower speed forced
    Doorman to react to Japanese maneuvering. To avoid the prospect of the Japanese
    cruisers “crossing his T” (a tactic in which one side crosses perpendicular to
    the other, allowing the passing force to bring its entire broad to bear, while
    the group being followed could only bring forward guns to bear), Doorman ordered
    a course change at 1635hrs due west. This temporarily eased the possibility that
    the heavy cruisers would “cross his T”, but it also failed to close the range
    sufficiently for the 6in. cruisers to join the gunnery duel.


