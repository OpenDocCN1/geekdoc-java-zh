    Sendai of five heavy cruisers. Takagi had a background in cruisers and battleships
    and had assumed flag rank in November 1938, taking command of Sentai in September
    1941. He commanded the Eastern Force''s covering throughout the NEI campaign.
    At Java Sea, he was responsible for a sloppy force position which showed a lack
