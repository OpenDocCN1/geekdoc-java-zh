  md: 'it was headed for the economic and political center of Java, it demanded an
    all-out response. Helfrich ordered the cruisers Exeter and Perth, and destroyers
    Electra, Encounter, and Jupiter to detach from the Western Striking Force to reinforce
    Doorman''s Eastern Striking Force. Determined to stop the invasion, and knowing
    that the Japanese invasion force ashore that the Royal Netherlands East Indies
    Army would be quickly defeated, Helfrich decided that he would order Doorman to
    defeat the Japanese Eastern Force, and then steam to the other end of Java to
    defeat the Western Force. It was a flight of fancy, but Doorman was left to execute
    this vision as he could.


    Doorman determined to aggressively eliminate the Japanese, possessed adequate
    intelligence on their location. On the night of February 26, he took his force
    out to make a sweep around Madeo Island. Finding nothing, he returned in the morning
    of Soerabaya only to be subjected to the daily air attack. The Allied defense
    of Java reached its climactic. Helfrich received a report at 1155hrs on the location
    of the Japanese invasion convoy. It was sent to Doorman at 1250hrs with the order
    to sortie, execute a night attack, and then to head to Tanjong Priok. This was
    followed by at 2055hrs from Helfrich reading "You must continue attacks until
    the enemy is destroyed."


    Doorman assembled the skippers of all the ships in his force that afternoon to
    go over the plan for the coming battle. The Striking Force would sweep around
    Madeo Island to the north, then steam to the west. The British and Dutch destroyers
    were deployed in the vanguard, then the cruisers, followed by the American destroyers.
    When contact was made with the Japanese, the vanguard destroyers would attack,
    followed by the cruisers engaging targets from a distance, and then the American
    destroyers would execute a torpedo attack.


    Doorman''s plan left much to the imagination of the American, Australian, and
    British participants. No provision was made to use his cruiser floatplanes, which
    were left ashore so as to become a hazard in a night battle. The one-hour conference
    did not cover the essentials of communications plan or detailed tactical plans.
    In the words of an American destroyer skipper, "The Allied force was little more
    than a column of strange task groups entered the battle with a vague general directive
    and no specific missions." Doorman was going to go to sea for a do-or-die battle
    with the Japanese without a coherent plan, with ability to communicate with his
    force, and with little idea as to the enemy''s positions and intentions. It was
    not a recipe for success.


    The Combined Striking Force departed Soerabaya at 1800hrs and conducted a sweep
    around Madeo Island. After reaching the Sapoidi Strait at 0130hrs on February
    27, Doorman turned back to the east to Soerabaya as planned. Without any intelligence
    on the Japanese, and having completed his planned sweep, Doorman decided at 1240hrs
    to return to Soerabaya to refuel. At 1425hrs, as De Ryter was steaming through
    the Dutch minefields received a series of electrifying reports from a Dutch flying
    boat—the Japanese invasion convoy was only 50 miles northwest of Soerabaya! Doorman
    immediately reversed course to the north and ordered the rest of his force to
    follow.'
