    BELOW LEFT

    Rear Admiral William Glassford, shown here in the 1930s, assumed command of the
    Task Force 5 before the Pacific War. Hart did not believe he was strong enough,
    as many of his men did oversee Asiatic Fleet''s only victory over the Japanese
