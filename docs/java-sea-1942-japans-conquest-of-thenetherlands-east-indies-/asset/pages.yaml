  md: 'Wavell''s deputy was Lieutenant-General George Brett, US Army Air Force (USAAF)
    and his chief of staff was British officer Lieutenant-General Henry R. Pown. American
    Admiral Thomas Hart retained his national command and was appointed commander
    of ABDA naval forces (also called ADBFLOAT). Another, Major-General Lewis H. Breton,
    USAAF, was given the job as commander of ABDA forces until the arrival of another
    British general. ABDA ground forces were commanded by Dutch Lieutenant-General
    Hein Poorter. ABDA Command was largely ineffective from its first official day
