    # HAGURO IN ACTION (PP. 58–59)


    Heavy cruisers Nachi and Haguro were the backbone of the Japanese force at Java
    Sea. With their powerful 8in. guns and torpedo batteries, they were the most powerful
    ships present on either side. The initial phase of the battle featured a long-range
    gunnery duel between Nachi and Haguro and the Allied cruisers. In this view, the
    main turrets of Haguro are elevated (1) and firing at long range while splashes
    from Allied cruisers explode near the Japanese ship. To supplement the long-range
    gunnery of his cruisers, Vice Admiral Itag decided to bring the long-range Type
    93 torpedo into play. As part of a massive torpedo barrage, Haguro prepared to
    fire her eight starboard torpedoes. The cruiser has trained her two starboard
    quadruple


    and has fired her torpedoes at 1652hrs as evident in this scene (3). Not evident
    in this scene is the fact that several of the torpedoes exploded only a few hundred
    yards from the ship creating enormous columns of water. The problem was with the
    fusing of the torpedoes which was a problem throughout the battle. Cruiser Nachi,
    leading the column, was unable to contribute another eight torpedoes her torpedo
    crew had left a valve open which blew the air pressure required to launch them.
    At 1709hrs, 23 torpedoes fired in this barrage only one hit. This blow was deadly
    though at 1713hrs, one of Haguro’s torpedoes hit the Dutch destroyer Kortenaerships
    sinking the ship in minutes.'
