    that the dispatch of a small but powerful striking force would give the Japanese
    pause. The force which finally arrived in Singapore on December 2 was comprised
    of the modern battleship Prince of Wales, the oldcruiser Repulse, and a mere four
    destroyers. The force was designated as Force Z and placed under the command of
    Admiral Sir Tom Phillips.


    This view was taken from John D. Ford of two other Asiatic Fleet Fleet destroyers
    in 1938 conducting one of the fleet''s open ocean operations. The Asiatic Fleet''s
    combatants were deployed mainly for presence and potential wartime missions were
    not a priority. (US Naval History and Heritage Command)


    The US Navy''s Asiatic Fleet, under the command of Admiral Thomas Hart, was caught
    in an exposed position when the war began. Its largest unit, the heavy cruiser
    Houston was at Panay, beyond the range of Japanese air attack, but five destroyers,
    all but two of the submarines, and most of the fleet''s auxiliaries were in Manila
    Bay on December 8. Four of Hart''s destroyers were actually on the way to reinforce
    the British in Singapore when broke, arriving there on the morning of December
    10.


