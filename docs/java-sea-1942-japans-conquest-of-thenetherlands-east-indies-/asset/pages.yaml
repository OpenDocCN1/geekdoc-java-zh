    he was a capable and aggressive commander. His success in leading the Southeast
    Asia campaign led to future important assignments until his failure at Guadalcanal.
    After Guadalcanal, he was never given another seaging command.


    The two pincers of the Japanese attack on the NEI were commanded by vice admirals.
    The Eastern Force was under the direction of Vice Admiral Takahashi Ibo. Takahashi
    is little known among the admirals of the Pacific War, but began the war as the
    commander of the IJN Third Fleet. Following his lackluster performance in the
    NEI, he remained in the region as Commander of the Eastern Fleet until November
    1942 after he was relegated to lesser commanders. He was arrested by American
    authorities in December 1945 as a possible war criminal.


