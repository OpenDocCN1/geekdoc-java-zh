    8in. shells would hit at long range. This proved wildly optimistic, since at

    Java Sea only five of the 1,619 8in. shells fired their target. As was the

    case with the Type 93, the low accuracy rate was mitigated by the fact that

    one of the shells that played a major role in determining the battle''s

    result. Light cruiser gunnery by Naka and Jintsu was also poor with only a

    single round of the 221 5.5in. Destroyer gunnery was better

    ce it was conducted at shorter range. Of the 515 5in. rounds expanded,

    ver Electra and led to her loss. Similar results were in evidence in the

    action against Exeter. Of 1,171 8in. rounds fired, two. Of 35 torpedoes

    fired, only one hit.


    The failure of the Combined Striking Force to stop the Japanese invasion

    forces meant the Japanese were able to land at three places on Java on

    February 28 and March 1. Dutch attempts to contain the landings were

    futile. By March 8, Soerabaya was captured, and the following day Dutch

    forces on Java surrendered. With the surrender of Dutch troops on Sumatra

    March 28, the NEI passed to Japanese control. The Japanese had

    succeeded in accomplishing their most important early-war objective. The

    oilfields on Java and Sumatra were quickly brought back on line. They were

    sufficient for Japan''s wartime needs, as the war dragged on the Japanese

    were increasingly unable to move the oil or refined products to the Home

    lands. Java and the great majority of the NEI remained in Japanese hands

    throughout the war.'
