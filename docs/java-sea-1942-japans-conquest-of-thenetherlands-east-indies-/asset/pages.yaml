  md: 'US Navy had a permanent presence in the region, a small force given the grandiloquent
    name of the Asiatic Fleet. The Asiatic Fleet was unclear to its commitments in
    the period immediately before the war. Pre-war plans recognized that the Philippines
    could not be defended and that no major attempt by the Pacific Fleet to relieve
    the garrison there should be attempted. This left the Asiatic Fleet on its own.
    It was tasked with buying time in the defense of the Philippines, and when this
    became impossible, to withdraw southward and support the British defense of Mal
    or the defense of the NEI.


    When war was imminent, it was confirmed that no naval reinforcements for Southeast
    Asia were forthcoming from the US Navy''s Pacific Fleet. The Royal Navy was able
    to send a small deterrent force to the Far East in the form of Force Z. This made
    preservation of Singapore an Allied, not just a British, imperative. It was also
    clear that no naval defense could be mounted of the Philippines because of its
    exposed position. In the days before the war, Hart pulled off his China stations
    and moved his main naval base at Cavite in Manila Bay for preservation. For the
    Asiatic Fleet, force preservation from the initial Japanese onslaught was key.
    Once ejected from its main base in Manila Bay, the Asiatic Fleet was ordered to
    head south and operate out of bases in the NEI and Darwin in northwest Australia.
    Combined with the Dutch, and whatever British units were left after the Force
    Z debacle, de Allied defense of the NEI. The overriding Allied strategy was to
    defend the Malay Barrier and keep the Japanese out of the Indian Ocean. The Japanese
    invasion showed how fragile the Allied plans were.'
