    Singapore, but to northwest Australia.


    Having gained control of the air, the Japanese conducted a series of landings
    in the Philippines. These began on December 8 with a small landing on the island
    of Luzon 125 miles north of Luzon. A landing on the island of Camiguin, between
    Luzon and Batan, and at Aparri on northern Luzon followed on the 10th. On December
    12, a landing at Legaspi in southern Luzon went smoothly. The main landing at
    Lingayen gulf forced the defenders forced the Americans to retreat into the Bataan
    Peninsula. Here, the Americans and Filipinos held out until April, and the last
    of the defenders did not surrender until Corregidor Island fell on May 6. Though
    their actions were ultimately futile, the American defenders in the Philippines
    held much longer than their British counterparts in Singapore or the Dutch in
    the NEL.


    Concurrently with their opening moves against the Philippines, the Japanese also
    invaded northern Malaya and southern Thailand. On December 8, Japanese troops
    conducted landings at Singora and Patani in southern Thailand and Kota Bharu in
    northern Malaya. Established ashore, the Japanese 25th Army defeated the British
    at the battle of Jitra on December 11, which decided the fate of northern Malaya.
    By early January, central Malaya was lost when the Japanese smashed two Indian
    brigades at the battle of Slim River. By January 25, the British had decided to
    retreat back onto Singapore Island. The Japanese attacked across the Johor Strait
    on February 8 and a week later forced the garrison to surrender.


