  md: '# THE CAMPAIGN


    With the rout of British forces on Malaya was well underway, the withdrawal of
    American forces into the Bataan Peninsula, the battle for the NEI was about to
    begin. Admiral Hart moved to Java by submarine and arrived safely there on January
    1, 1942. Upon his arrival, he learned he had been named commander of ABDA naval
    forces. He was immediately faced with the political intrigues of the Dutch authorities
    on Java and the approaching Japanese storm.


    # THE BATTLE OF BALIKAPAN


    The Japanese campaign to conquer the NEI began on December 25, 1941 with a landing
    on Jolo Island in the Sulu Archipelago. The next move was conducted by the Eastern
    Force on January 11 Special Naval Landing Force (SNLF) troops landed at Menado
    and Kema on the northern Celebes, supported by SNLF paratroopers. The important
    port of Kendari was located further south on Celebes. Hart assessed this was the
    next Japanese target and made plans to intercept a Japanese thrust in that. Until
    now, American naval forces did not engage and Hart thought it past time to do
    so. While British and Dutch forces were primarily occupied in escorting convoys,
    the first significant naval action of the campaign would be initiated by the Americans.


    The pace of Japanese advance increased when on January 12 an invasion force under
    Admiral Nishimura captured Tarakan on northeast Borneo. The Dutch defense was
    weak, and the Japanese captured the airfield. The airfield was brought into operation
    within days, which provided air cover for the next operation. This was an operation
    on Balikapan which was an important port and oil facility on Borneo''s southeast
    coast. Nishimura stormed on January 21 with an invasion force for Balikapan.


    In response to the Japanese advances on Borneo and in the Celebes, Rear Admiral
    Glassford was ordered to bring Task Force 5, the Asiatic Fleet''s striking force,
    to readiness. At various times, the force included cruisers Houston, Boise, Marblehead,
    and as many as destroyers. On January 17, Glassford led the cruisers, escorted
    by six destroyers, to attack a Japanese force reported off Kema. On this occasion,
    as on many, the intelligence was faulty. Three days later, in response to Dutch
    reports of Japanese activity in the Makassar Strait, Glassford departed Koepang
    on Timor Island with'
