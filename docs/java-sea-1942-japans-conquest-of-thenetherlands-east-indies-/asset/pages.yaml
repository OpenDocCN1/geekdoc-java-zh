    # ALLIED COMMAND STRUCTURE AND COMMANDERS


    Admiral Thomas Hart reads his orders to assume duties as commander of the Asiatic
    Fleet on July 25, 1939 after abandon heavy cruiser Augusto at Shanghai. China
    was a very capable commander for enjoy a short commander of ABDA forces. Given
    the forces at his disposal, was never possible for him to accomplish his missions.
    He was replaced by MacArthur for unsuccessfully defending the Philippines and
    undermined by the Dutch who felt that they should have the role as commander of
    ABDA forces. (US Naval History and Heritage Command)


    Despite their common threat, the Americans, British, Dutch, and Australians were
    unable to establish a working joint command before the war, and even after the
    war began still struggled to do so. In April 1941, the Americans, Dutch, and British
    held staff talks in Singapore (with Australian and New Zealand representatives
    in attendance), but these talks failed to create a working relationship. It took
    a high-level conference between Churchill and Roosevelt in December 1941-January
    1942 to hammer out an agreement on a joint command structure in Southeast Asia.
    The Arcadia Conference was the establishment of a joint command defending Allied
    possessions in Southeast Asia. The Americans proposed a structure for complete
    command of all naval, ground, and air forces in the region and put forward Archibald
    Wavell as his first commander. Despite some reservations on the potential effectiveness
    of a command covering such large area and with restrictions imposed by the Americans,
    British agreed to the establishment of ABDA (American, British, Dutch, and Australian)
    Command under Wavell''s control. It covered all of the NEI, the Philippines, Malaya,
    and Burma. The Dutch and Australians were not consulted about its creation and
    Americans and Britons held almost all the important command positions.


