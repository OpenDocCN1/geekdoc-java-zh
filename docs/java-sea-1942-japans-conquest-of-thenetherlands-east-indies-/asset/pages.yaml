  md: 'This trumpet recovered from the USS Houston. The ship is a war grave, but in
    recent years there has been a very disturbing trend of Indonesian scrarappers
    salvaging wrecks in the former NEI. While Houston remains apparently in good ships,
    some of the other ships like Perth and the American and British destroyers are
    almost entirely gone. (US Naval History and Heritage Command)


    ![](img/9f6cbeb32985c11de35c8798e522b788_90_0.png)


    not sink a single large IJN combatant during the campaign, and only at Balikpapan
    did Allied forces sink anything. The Dutch accounted for the majority of the Japanese
    transports and combatants lost during the campaign, but these losses were far
    below what the Japanese planned for. The largest combatant lost by the Japanese
    in the NEI was a destroyer. Three were lost – one to an Allied submarine, to a
    Dutch submarine, and the third to Dutch aircraft. Other losses included one submarine,
    four minesweepers, and a patrol boat. In addition, at least 14 transports were
    sunk.


    At the operational level, both sides made serious errors. In the Badeng Strait,
    Helfrich was caught off guard and his plan was too complicated. The run-up to
    the Japanese invasion of Java, Helfrich was foolish to think that he could repel
    both the eastern and western Japanese threats against Java, and his creation of
    two striking forces dissipated his already inadequate assets. His only hope for
    success was to create a single powerful striking force and make all efforts to
    provide with adequate reconnaissance and air cover. He failed to ensure that the
    remaining Allied air assets supported reconnaissance. Had adequate aerial reconnaissance
    supported a strengthened striking force, it might have been possible to deliver
    a serious blow, maybe even strong enough to delay or defeat one of the landings
    forces. None of this is to say that the Allies ever had a real chance to defend
    Java from seaborne invasion. The balance of forces, both quantitatively and qualitatively,
    was too uneven. In the final analysis, the record of Allied naval forces in the
    campaign, culminating in the battle of Sea, was a parade of defeats. The one exception
    was the opening battle at Balikpapan, when bold action created surprise and the
    Allies a local success. Even so, it should be pointed out that this success resulted
    in no delay in the Japanese timetable for conquering the NEI.


    The Japanese deployed their naval forces poorly during the campaign, thus creating
    possible openings for the Allies. In spite of the fact that the Eastern Force
    was operating nearest to the principal Allied naval base at'
  merge: -1
  pgno: 90
- img_proc: true
  md: 'Soerabaja, it was significantly weaker than the Western Force. The Japanese
    compounded this error in the later stages of the campaign by dissipating their
    overwhelming resources. Yamamoto took reports from the battle of the Badoeng Strait
    literally and assumed that ABDA no longer possessed a viable force. Accordingly,
    instead of stopping the final invasion of Java with the overwhelming force of
    the Kido Butai and the battleships and heavy cruisers of Kondo''s support force
    to deal with any Allied intervention, he deployed these forces into the Indian
    Ocean to pick off ships leaving Java. This left the remaining Japanese forces
    in the region to contend with the main Allied naval force, Doorman''s Combined
    Striking Force. This propensity of Yamamoto''s to disperse his forces was of no
    significance when they were so heavily stacked in the IJN''s favor, but when they
    became a major factor in defeats only months later.


    Throughout the campaign, Allied tactical performance was well in all areas. They
    were never able to address the difficulties of maneuvering a multi-national force
    and communications a critical weakness. Not a single Japanese naval unit was in
    surface combat during the campaign. Allied gunn was atrocious, resulting in few
    hits. Torpedo reliability and performance was a crippling disadvantage, and this
    was to continue through 1942.


    Tactically, the naval battles for the NEI demonstrated the power of the Japanese.
    The Japanese ships were superior on a unit basis, and proved critical on several
    occasions. The actions of only two Japaneseers provided a tactical victory against
    a much larger Allied force at the Badoeng Strait. At Java Sea, the two sides were
    at approximate parity, the two Japanese cruisers provided enough backbone to defeat
    one of the largest Allied forces assembled during the campaign. Though the Japanese
    emerged victorious at Java Sea, there were some causes for concern. Freedom of
    these was the performance of the IJN''s supposed-winning secret weapon, the Type
    93 torpedo. Of the 153 torpedoes fired, only three hit with detonating prematurely.
    This was a rough start for the Type 93, but the foundation of a longrange torpedo
    operated by well-drilled crews paid dividends later in the war. Even so, the three
    weapons that hit account for three Allied ships, and were responsible for bringing
    the battle to an end.


    This is another view of the demise of Exeter. Inazuma picked up some of the survivors,
    which included 44 officers and 607 men. (US Navy History and Heritage Command)


    ![](img/9f6cbeb32985c11de35c8798e522b788_91_0.png)


    Japanese gunnery was also disappointing. Pre-war doctrine called for longterm
    fire, since the Japanese believed they could deliver punishments beyond the reach
    of their enemies. In pre-war exercises, they assessed 6 percent of'
