  md: 'and back to Singapore. However, at 2355hrs, a report reached the admiral that
    the Japanese had landed at Kuantan, which was then about 120 miles from Force
    Z''s position. Phillips changed course to the southwest to investigate the report.
    At 0800hrs, Phillips sent an aircraft from Prince of Wales and a destroyer to
    investigate. They found nothing since the report entirely false. Instead of resuming
    his transit to the relative safety of Singapore, Phillips decided to investigate
    another report of barges off Kuantan. This proved to be a fatal delay.


    The British were totally ignorant of the threat to Force Z by land-based aircraft.
    They assessed that if they stayed 400 miles from the nearest Japanese aircraft
    they would be beyond the range of effective attack. Even if the Japanese managed
    to hit Force Z, it would be only with high-level bombers like the British were
    accustomed to in the Mediterranean, and not the much-more deadly torpedo aircraft.
    Japanese G3M “Nell” and G4M “Betty” aircraft flying from airfields around the
    Saigon area had the range to strike as south as Singapore itself. Both types of
    aircraft could carry the Weight 91 aerial torpedo, and their highly trained crews
    were also capable of hitting ships with bombs at 10,000ft. The IJN amassed a large
    force of long-range attack in Indochina with the mission of neutralizing Force
    Z. On December 10, a fleet of 8 G3M and G4M aircraft took off between 0625 and
    0800hrs to find and attack Force Z.


    Just as fuel became critical for the Japanese, a reconnaissance aircraft sought
    Force Z at 1015hrs. The first of the strike groups sighted the British ships at
    1100hrs and began the first of a series of attacks. Eight G3M bombers made a level
    attack on Repulse and scored a single hit, which caused minor damage. The next
    by 17 G3Ms carrying torpedoes decided the outcome of the battle. Eight went Prince
    of Wales and scored two hits. One of them doomed the battleship. It struck beam
    14in. gun turret and caused the propeller shaft to buckle and several compartments
    to flood. The flooding caused an 11.5-degree list and reduced speed to 15 knots.
    The other torpedo-carrying G3Ms waited for Repulse, but the battlecruiser dodged
    all nine bombs from another six aircraft. The next wave featured eight G3Ms which
    launched their attacks at Repulse, the well-handled battlecruiser emerged unscathed.
    The wave of 24 G4Ms with torpedoes delivered the coup grace to Force Z. Three
    Prince of Wales, which was unable to maneuver; four hits were recorded. Twenty
    G4Ms waited after Reply. This time, the attackers executed a pincer attack that
    placed five torpedoes on the battlecruiser. Unable to take this type of damage,
    the ship sank at 123hrs with the loss of 513 men.


    The fate of Prince of Wales was certain. A 1,100-pound bomb hit was scored by
    the last of G3Ms to attack. The bomb penetrated the main deck where it caused
    severe casualties. The battleship continued to settle and at 1315hrs, the crew
    was ordered to abandon ship. Five minutes later the ship capsized to port with
    the loss of 327 of her. In return for this brilliant attack, the Japanese removed
    the only significant Allied naval force in Southeast Asia. With British naval
    power crippled and American power in the Philippines neutralized, the only force
    left to prevent a Japanese invasion of the NEI was a scratch force of Australian,
    Australian, British and Dutch surface combatants. Its ability to defend the NEI
    would soon be tested.'
