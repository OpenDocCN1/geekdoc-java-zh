    \ 和 `ElementMatcher`\n\n接下来，插件程序匹配带有 `java.lang.Double` 参数的方法，且该参数被带有 `@Deprecated`\
    \ 注解。为了此目的，`visit` 方法使用了 `ElementMatchers.hasParameters` 方法：\n\n```java\nbuilder.visit(new\
