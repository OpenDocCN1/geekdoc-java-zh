    @Origin annotation


    Observed that the advice method has a second parameter, which is annotated with
    @Origin annotation. Please be aware that this annotation is the net.bytebuddy.implementation.bind.annotation.
    Origin , not the net.bytebuddy.asm.Advice.Origin , which is used for on method
    enter or exit advice. Advice.Origin returns a String value that contains the name
    of the functional method. While Origin of around advice returns an instance of
    java.lang.reflect.Method that represents the functional method. For example:


    public static void aroundVoid(


    @SuperCall Runnable targetCode,


    @Origin Method method){


    System.out.println(method.getName());


    }


    The getName method returns “ create ”, which is the name of functional method.


    MethodDelegation and Advice


    The difference between MethodDelegation and Advice:


    MethodDelegation is used by the intercept method of the DynamicType.Builder.


    Advice is used by the visit method of the DynamicType.Builder.


    When using intercept method, ByteBuddy does not inline the advice code , but generates
    a delegated method and invokes the delegated method to execute the functional
    code. In this chapter, the createOriginal and createDataOriginal method are the
    example of delegated method.


    When using visit method, ByteBuddy generates the code that does inline the advice
    code into the functional code.


    Both MethodDelegation and Advice can apply on method enter or exit advice, but
    Advice cannot apply the around advice.


