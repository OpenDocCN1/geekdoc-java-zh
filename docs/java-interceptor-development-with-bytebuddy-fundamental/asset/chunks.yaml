    \ p2, String p3){ }\n```\n\n这是创建构造函数的代码，实现在 `InterceptorPlugin.java` 的 `apply`\
    \ 方法中：\n\n```java\nConstructor c1=ConstructorPrototype.class.getDeclaredConstructor(int.class,\
    \ String.class, String.class);\nbuilder.define(c1)\n.intercept(MethodCall.invoke(Producer.class.getConstructor()));\n\
    ```\n\n`ConstructorPrototype.java`：\n\n```java\npublic class ConstructorPrototype\
