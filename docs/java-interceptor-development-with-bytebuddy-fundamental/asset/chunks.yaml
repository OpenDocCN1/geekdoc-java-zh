  trans: "\n\n```java\n@Secure(authority=”normalUser, premiumUser”)\n\npublic double\
    \ calculatePrice(){\n\n    long startTime=System.currentMilliseconds();\n    logger.info(“Calculate\
    \ price start”);\n    double discount = getDiscount();\n    double price =\n \
    \   this.price + this.deliveryCharge - discount\n    logger.info(“Method end”);\n\
    \    perfLogger.info(\n    “Calculate price execution time:”+\n    (System.currentMillioseconds()-\n\
    \    startTime));\n    return price;\n\n}\n```\n\n### 带有非功能代码的 calculatePrice\
    \ 方法\n\n当非功能代码跨越应用程序中的多个方法时，复杂度就会增加，这会导致功能性代码与非功能代码之间的紧密耦合。在不同类的方法中重复使用非功能代码会强制导致复制粘贴式的编码，从而增加了代码维护的负担。\n\
    \n### 分离功能性代码与非功能代码\n\n为了消除复杂性，应用程序开发团队可以将非功能代码从应用程序代码分离出来，使方法恢复到原始形式，只保留纯功能性代码。所有的非功能代码将被重构为建议代码（advice\
    \ code）。\n\n然后，应用程序开发团队利用 `ByteBuddy` 的字节码插桩能力生成被插桩的代码。\n\n![](img/Image00000.gif)\n\
    \n`ByteBuddy` 在 maven 构建期间或应用程序运行时将建议代码添加到功能代码中，并生成包含功能代码和非功能代码的插桩代码。开发团队可以使用\
    \ `ByteBuddy` 编程方式配置插桩程序。\n\n`ByteBuddy` 只修改 Java 字节码（Java 类文件），而不修改 Java 源代码。\n\
    \n#### 使用 ByteBuddy 的优势：\n\n- `ByteBuddy` 通过字节码插桩实现自动化编码。\n- `ByteBuddy` 增加了代码的可重用性，因为所有的非功能代码可以在一个建议代码\
    \ Java 文件中创建然后在然后在 Java 类的不同方法中重复使用多次。\n- 在无需重新编译整个应用程序的情况下修改字节码。\n- 在无需重启应用服务器的情况下修改字节码。\n\
    \n`ByteBuddy` 使用这些策略来拦截 Java 字节码：\n\n- 方法进入时（On Method Enter）\n- 方法退出时（On Method\
    \ Exit）\n- 环绕建议（Around Advice）\n\n在书中，所有的示例代码都集成到了 maven 构建过程中，因此拦截和代码生成是在 maven\
    \ 构建期间创建的，而不是在应用程序运行时。只有一章将展示如何在应用程序运行时创建拦截器。然而，在 maven 中使用的插桩技术\n\n![](img/Image00007.jpg)\n\
    \n![](img/Image00000.gif)\n\n构建时使用的插桩也适用于应用程序运行时的插桩。\n\n`ByteBuddy` 支持可以检查和修改现有\
    \ Java 字节码的插桩。这些技术将在书中进行解释：\n\n- 添加新的构造函数、方法和实例变量\n- 现有的构造函数、方法和实例变量\n- 修改实例变量的值。\n\
    - 修改方法参数的值。\n- 检查现有的 Java 类结构、构造函数签名、方法签名和实例变量。\n- 生成新的泛型 Java 类、构造函数、方法和实例变量（上界、下界、多重边界、通配符、参数化类型、方法类型参数）。\n\
    - 在方法中搜索并替换代码。\n- 添加和删除标记在 Java 类、构造函数、方法、实例变量和参数上的注解。\n- 添加和修改 Java 内部类（添加第一、二级内部类，拦截内部类和匿名类）。\n\
    - 生成新的 Java 类、Java 接口、枚举、注解和抽象类。\n- 生成简单的方法和 lambda 表达式。\n- 在建议代码之间共享数据。\n- 介绍使用\
    \ `Java Instrumentation API` 和 `ByteBuddy` 进行 Java agent 开发，它可以拦截 JDK 核心类。（仅限一章）\n\
    \n本书提供了实现建议代码和字节码插桩 `ByteBuddy` 插件的 Java 示例代码。每章中的大多数示例代码使用 maven 构建过程来创建插桩代码。有一章使用\
    \ `ByteBuddy` 配合 `Java instrumentation API` 在应用程序运行时创建插桩代码。\n\n![](img/Image00000.gif)\n\
    \n### 本书未涵盖的内容\n\n`ByteBuddy` 是一个包含许多功能的开源库。然而，本书未涵盖以下主题：\n\n- 如何插桩 Record 组件\n\
    - 如何插桩 Java 原生方法\n- 如何插桩 lambda 表达式\n- 如何生成匿名类\n- 如何使用字节码指令插桩 Java 字节码，例如栈操作和\
    \ `ByteCodeAppender`\n\n#### Java 反编译器\n\n需要 Java 反编译器来检查 Java 类格式格式的插桩代码。Java\
    \ 反编译器可以将类文件转换为 Java 源代码。这对于验证生成的字节码至关重要。这是 Java 反编译器的列表：\n\n**在线工具：** [decompiler](https://example.org)\n\
    \n**离线工具：** [jdcode]\n\n![](img/Image0000.gif)\n\n### 开发环境\n\n- **IDE**: SpringToolSuite4\n\
    - **JDK**: OpenJDK-11\n- **ByteBuddy**: 1.12\n- **Maven 依赖**:\n\n```xml\n<dependency>\n\
    \    <groupId>net.bytebuddy</groupId>\n    <artifactId>byte-buddy</artifactId>\n\
    \    <version>1.12</version>\n</dependency>\n<dependency>\n    <groupId>net.bytebuddy</groupId>\n\
    \    <artifactId>byte-buddy-agent</artifactId>\n    <version>1.12</version>\n\
    </dependency>\n<dependency>\n    <groupId>net.bytebuddy</groupId>\n    <artifactId>byte-buddy-maven-plugin</artifactId>\n\
    \    <version>1.12</version>\n</dependency>\n```\n\n![](img/Image0000.gif)\n\n\
    ### 总结\n\n本章解释了：\n\n- 什么是 `ByteBuddy`\n- 建议代码、功能代码和插桩的定义\n- `ByteBuddy` 如何帮助软件设计和编码\n\
    - 书中将学习的知识和技术\n- 书使用的开发环境\n\n![](img/Image0000.gif)\n\n### 第二章：OnMethodEnter Advice\n\
    \n本章解释了如何实现方法进入建议。本章还解释了如何构建和执行插桩过程。该过程将在书中每个章节中重复。本章源代码包含在 `VisitOnMethodAdvice`\
    \ 项目中。这是项目结构：\n\n有三个包：`interceptor`、`plugin` 和 `program`。\n\n`interceptor` 包包含建议代码\
    \ `LogInterceptor.java`。\n\n![](img/Image0000.jpg)\n\n![](img/Image0000.gif)\n\
    \n`plugin` 包包含提供拦截的插件程序。在示例中，`InterceptorPlugin.java` 是插件程序。Maven 构建过程使用该插件程序生成插桩代码。\n\
    \n`program` 包包含功能代码 `DataProducer.java` 以及一个 Java 程序 `InterceptorProgram.java`，用于执行插桩代码，并用于测试和查看结果。\n\
    \n`target` 文件夹存储 maven 构建过程的结果，包括 Java 类文件、插桩代码和 jar 包。\n\n`sourceCodeView` 文件夹以\
    \ Java 文件格式存储插桩代码。\n\n在此项目中，`DataProducer.java` 中的 `create` 方法是提供功能代码的方法。该方法在屏幕上打印状态“create\
    \ data”。\n\n项目将建议代码添加到 `DataProducer.class` 的 `create` 方法中。建议代码应用方法进入建议。这种类型的建议将在方法执行开始时添加建议代码：\n\
    \n```java\npublic void create(){\n    System.out.println(“create data”);\n}\n\
    ```\n\n**功能代码**\n\n```java\npublic void create(){\n    LogInterceptor.logger.log(\n\
    \    Info.LEVEL, “Method start”);\n    System.out.println(“create data”);\n}\n\
    ```\n\n**插桩代码**\n\n```java\npublic void create(){\n    LogInterceptor.logger.log(\n\
    \    Info.LEVEL, “Method start”);\n    System.out.println(“create data”);\n}\n\
    ```\n\n"
