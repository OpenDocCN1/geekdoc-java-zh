- fmt: "\nThe code invokes constructor method and applies `ElementMatchers`. `isDefaultConstructor`\
    \ method to match the default constructor. After the default constructor is selected,\
    \ the builder invokes `intercept` method to generate code that invokes the super\
    \ constructor using `MethodCall`. Then, the code uses `FieldAccessor` to set the\
    \ value of instance variable of `dataProducerId` to `120`, and `data` instance\
    \ variable `120`\n\n![](Image00000.gif)\n\nto a string value of `“ <noData> ”`.\
    \ The `setsValue` method is the right method to use compared to `value` method\
    \ introduced in Chapter 10: Declare Instance Variable Dynamically . When programming\
    \ for Java bytecode, the program must use constructor to set the initial value\
    \ of the instance variable.\n\n### Why `DataProducer.java` contains the default\
    \ constructor even though the plugin program does not declare it?\n\nByteBuddy\
    \ will create the default constructor implicitly when one of these methods is\
    \ invoked: `define`, `defineConstructor`. The `define` method can be used to declare\
    \ instance variable and Java method also. If `define` method is used to declare\
    \ constructor, then ByteBuddy will create the default constructor automatically.\
    \ Therefore, the default constructor is already created when the `DataProducer(int,String,String)`\
    \ constructor is created.\n\n### Generate constructor with `visit` method\n\n\
    Finally, the plugin program declares this constructor:\n\n```java\npublic DataProducer(\n\
    int p1, String p2, String p3, String p4){\n  super(p1, p3);\n  if(p1 % 2==0)\n\
    \  dataProducerId=p1+10000;\n  else\n  dataProducerId=p2+20000;\n  data=p2;\n\
    \  int01=new BigInteger(data);\n}\n```\n\nThis is the code that generates the\
    \ constructor:\n\n```java\nbuilder=builder\n.defineConstructor(Visibility.PUBLIC)\n\
    .withParameters(int.class, String.class,\nString.class, String.class)\n121\n```\n\
    \n![](Image00000.gif)\n\n```java\n.intercept(\nMethodCall.invoke(\nProducer.class\n\
    .getDeclaredConstructor(long.class,\nString.class))\n.withArgument(0, 2));\n\n\
    builder\n.visit(Advice.to(ValueSetter.class)\n.on(\nElementMatchers.isConstructor()\n\
    .and(ElementMatchers.takesArgument(\n0,int.class))\n.and(ElementMatchers.takesArgument(\n\
    1,String.class))\n.and(ElementMatchers.takesArgument(\n2,String.class))\n.and(ElementMatchers.takesArgument(\n\
    3,String.class))));\n```\n\nThe `intercept` method only generates the bytecode\
    \ that invokes the super constructor:\n\n```java\nsuper(p1, p3);\n```\n\nThe remaining\
    \ code is generated by the `visit` method. In `visit` method, to match the constructor,\
    \ `ElementMatchers.isConstructor` and `ElementMatchers.takesArgument(0, int.class)`\
    \ method are used.\n\nThe `isConstructor` method limits the matching scope to\
    \ only constructor only.\n\nThe `takesArgument` method accepts two parameters:\
    \ `int`, and `java.lang.Class`. The `int` parameter specifies the index of the\
    \ parameter. The second parameter specifies its data type. This method matches\
    \ only one parameter. So, to match the constructor that has four parameters, `takesArgument`\
    \ is executed for four times. With this configuration, the constructor `public\
    \ DataProducer(int, String, String, String)` should be selected to apply the advice\
    \ code.\n\n122\n\n![](Image00000.gif)\n\n**ValueSetter.java:**\n\n```java\npublic\
    \ class ValueSetter {\n  @OnMethodExit\n  public static void set(\n  int param0,\
    \ String param1,\n  @FieldValue(value=”dataProducerId”,\n  readOnly=false) int\
    \ var1,\n  @FieldValue(value=”data”,\n  readOnly=false) String var2,\n  @FieldValue(value=”int01”,\n\
    \  readOnly=false) BigInteger biginteger\n  ) {\n    if(param0%2==0)\n    var1=param0+10000;\n\
    \    else\n    var1=param0+20000;\n    var2=param1;\n    biginteger = new BigInteger(var2);\n\
    \  }\n}\n```\n\nAfter that, the constructor body will contain the advice code\
    \ provided in the `ValueSetter.java`.\n\nObserved that the advice code instantiates\
    \ an instance variable named `“ int01 ”`, which is an instance of `BigInteger`.\
    \ Whenever the constructor wants to instantiate object using `new` operator, for\
    \ example `new BigInteger(java.lang.String)`, the advice code should be implemented\
    \ for the purpose. The `intercept` method supposes can generate this code via\
    \ the use of `MethodCall`:\n\n```java\n.intercept(\nMethodCall.construct(BigInteger.class.\n\
    getDeclaredConstructor(String.class))\n.withArgument(2)\n.setsField(\nField.class.getDeclaredField(“int01”)));\n\
    123\n```\n\n![](123\n\nHowever, at the time of this writing, the use of `MethodCall`\
    \ causes a `java.lang.IllegalStateException` during the instrumentation process.\
    \ Therefore, uses the advice code when the constructor requires to instantiate\
    \ new object.\n\n### Conclusion\n\nThis chapter explains:\n\n- How to declare\
    \ constructor dynamically\n- How to declare constructor body using `MethodCall`\n\
    - How to pass parameter to super constructor\n- How to use `setsValue` method\
    \ of `FieldAccessor.ofField` to set the initial value of the instance variable\n\
    \n124\n\n![](Image00000.gif)\n\n## Chapter 13: Generate Generic Constructor, Method,\
    \ and Instance Variable\n\nThis chapter explains on how to generate generic constructor,\
    \ method, and instance variable dynamically. The source code for this chapter\
    \ is included in ChapterGeneric Eeclipse project. `DataProducer.java` is the functional\
    \ code in this chapter:\n\n```java\npublic class DataProducer { }\n```\n\n`DataProducer.java`,\
    \ in this chapter, does not have any method and instance variable. After the instrumentation\
    \ process, this is the Java source code view of the `DataProducer`.\n\n```java\n\
    public class DataProducer<A, B>{\n  private A test1;\n  private List<?> test2;\n\
    \  private List<? super A> test3;\n  private List<? extends B> test4;\n  private\
    \ List<? extends A>> test5;\n  private List<String> test6;\n  private List<? extends\
    \ String>> test7;\n  private List<String> test8;\n  private List<List<String>>\
    \ test9;\n\n  public DataProducer() {}\n\n  public <R> DataProducer(A paramA,\
    \ B paramB,\nR paramR){ }\n\n  public List<String> testMtd1(List<String> p){\n\
    \    return null;\n  }\n\n  public List<? extends String> testMtd2(List<? extends\
    \ String> paramList){\n    return null;\n  }\n\n  public <R> String testMtd3(R\
    \ paramR){\n    return null;\n  }\n\n  public <R extends Long> String testMtd4(R\
    \ paramR, List<R> paramList){\n    return null;\n  }\n\n  public <R extends List<String>>\
    \ String\ntestMtd5(R paramR){\n    return null;\n  }\n\n  public A testMtd6(A\
    \ paramA, B paramB,\nBiFunction<? super A, ? extends A,\n? extends B> paramBiFunction){\n\
    \    return null;\n  }\n\n  public <P, Q> A testMtd7(P paramP, Q paramQ){\n  \
    \  return null;\n  }\n\n  public <P extends Long, extends Serializable>\nStringtestMtd8(P\
    \ paramP){\n    return null;\n  }\n}\n```\n\n126\n\n![](Image00000.gif)\n\n`InterceptorPlugin.java`\
    \ is the plugin program that generates the generic code. The `net.bytebuddy.description.type.TypeDescription.Generic`\
    \ is the fundamental Java class for declaring generic method and instance variable.\
    \ Generic programming in Java requires the program to create parameterized type,\
    \ type argument, and type variable.\n\n### Generic Class\n\nThe `DataProducer.class`\
    \ does not have any type variable. This code adds `A` and `B` type variable to\
    \ `DataProducer.class`:\n\n```java\nbuilder.typeVariable(“A”)\n.typeVariable(“B”);\n\
    ```\n\nThe `typeVariable` method is responsible to define the type variable. To\
