    \ new `HashMap` is passed to the second parameter, which is represented by `data`\
    \ variable. The `data` variable is the parameter of `enter` method with `@Argument`\
    \ annotation, and it is mapped to second parameter of `process10` method because\
    \ its `value` attribute is `1` , and the `readOnly` attribute is `false` .\n\n\
    Then the `PriceQueryAdvice.java` and `DiscountQueryAdvice.java` utilizes the `HashMap`\
    \ to store the result of the calculation. The result of calculation is stored\
    \ into `HashMap` with the key “ total ”.\n\nTherefore, the total element of the\
    \ `HashMap` contains the result of the price calculation. To ensure the instrumented\
    \ code get the correct total value, the `end` method of `LocalVariableAdvice.java`,\
    \ which implements the on method exit advice, is responsible to retrieve the value\
    \ of `total` element from `HashMap`, and then passes it to the `returnTotal` parameter:\n\
    \n```java\n@Advice.OnMethodExit\npublic static void end(\n    @Argument(value=1,readOnly=false)\
    \ Map data,\n    @Return(readOnly=false) int returnTotal)\n{\n    returnTotal\
    \ = (Integer)data.get(“total”);\n}\n```\n\nThe `returnTotal` is the parameter\
    \ with `@Return` annotation, which represents the return data of the `process10`\
    \ method. So, the `process10` method should be able to receive the result of the\
    \ price calculation and uses it in the return statement.\n\nThe benefit of using\
    \ `LocalVariableAdvice.java` is that the advice can constantly ensure the `HashMap`\
    \ is reset to new `HashMap` before the price calculation starts. The exit advice\
    \ then consistently returns the correct total to the instrumented code. At the\
    \ time of this writing, which uses `ByteBuddy 1.10.16`, if the `HashMap` is replaced\
    \ with the object reference (`java.lang.String, java.lang.Integer`) or primitive\
    \ (`int, long`), the price calculation will fail because `ByteBuddy` will generate\
