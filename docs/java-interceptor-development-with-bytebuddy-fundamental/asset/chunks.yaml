    After that, the constructor body will contain the advice code provided in the
    ValueSetter.java .


    Observed that the advice code instantiates an instance variable named “ int01
    ”, which is an instance of BigInteger. Whenever the constructor wants to instantiate
    object using new operator, for example, new BigInteger(java.lang.String), the
    advice code should be implemented for the purpose. The intercept method supposes
    can generate this code via the use of MethodCall :


    .intercept(


    MethodCall.construct(BigInteger.class.


    getDeclaredConstructor(String.class))


    .withArgument(2)


    .setsField(


    Field.class.getDeclaredField(“int01”)));


    123


