    ### @Unused

    `@Unused` annotation indicates that the parameter is used for internal usage only
    for `methodStart` method of `LogInterceptor.java`. The parameter does not have
    mapping capability to functional code. It is just a marker annotation indicates
    that the parameter does not map to any of the parameter of functional method.
    For example,


    Parameter:


    `@Advice.Unused String unusedParam`


    If there is parameter of `methodStart` method without any annotation and the parameter
    index does not match with the index of parameter of the functional method, the
    instrumentation process will fail during maven build process.


