    . This is the code for ColumnAnnotation.java :


    @Repeatable(RecordAnnotation.class)


    @Retention(RetentionPolicy.RUNTIME)


    @Target({


    ElementType.METHOD, ElementType.FIELD})


    public @interface ColumnAnnotation {


    String name();


    String value(); }


    153


    ![](Image00000.gif)


    This is the code that declares the instance of AnnotationDescription for @ColumnAnnotation
    with username attribute:


    AnnotationDescription c1 =


    AnnotationDescription.Builder.ofType(


    ColumnAnnotation.class)


    .define(“name”, “username”)


    .define(“value”, “user01”).build();


    When the program wants to define attribute value for the annotation, the define
    method is used. Here, the define method defines name attribute to have value of
    username ., and value attribute to have value of user01 . After that, invokes
    build method to create the instance of AnnotationDescription, and stores it into
    c1 variable. Similarly, this is the code that declares the @ColumnAnnotation with
    age value in name attribute, and the c2 is the variable that stores the instance
    of the AnnotationDescription:


    AnnotationDescription c2 =


    AnnotationDescription.Builder.ofType(


    ColumnAnnotation.class)


    .define(“name”, “age”)


    .define(“value”, “25”).build();


    After the instance of AnnotationDescription of nested annotation is created, creates
    the instance of AnnotationDescription for @ RecordAnnotation :


    AnnotationDescription nestedAnnotation =


    AnnotationDescription.Builder.ofType(


    RecordAnnotation.class)


    .defineAnnotationArray(


    “value”,


    new TypeDescription.ForLoadedType(


    ColumnAnnotation.class), c1, c2


    ).build();


    This is the code for RecordAnnotation.java :


    154


    ![](Image00000.gif)


    @Retention(RetentionPolicy.RUNTIME)


    @Target({


    ElementType.METHOD, ElementType.FIELD


    })


    public @interface RecordAnnotation {


    ColumnAnnotation[] value();


    }


    The RecordAnnotation.java has one value attribute with data type of ColumnAnnotation
    array. To add multiple @ColumnAnnotation to the @RecordAnnotation , the defineAnnotationArray
    method is used.


    The defineAnnotationArray method requires three parameters: String, TypeDescription,
    AnnotationDescription . The first parameter is used to specified the attribute
    name of @RecordAnnotation that contains the array of nested annotation. The @RecordAnnotation
    uses “ value ” attribute to contain the nested annotation (please refer to RecordAnnotation.java
    ), so the value of first parameter is “ value ”.


    The second parameter is used to specify that the data type of the value attribute
    of the RecordAnnotation.java . The data type is ColumnAnnotation.java . So the
    program instantiates an instance of TypeDescription via TypeDescripton. ForLoadedType(ColumnAnnotation.class)
    in second parameter.


    The third parameter is a variable length argument, and it is used to specify the
    content of value attribute for the RecordAnnotation.java . So pass the c1 and
    c2 variable to this parameter. After that, invokes build method to end the method
    chain. The build method creates the instance of AnnotationDescription that represents
    the RecordAnnotation , and this instance is stored in the nestedAnnotation variable.


    After that, the nestedAnnotation variable is now ready to be used for adding the
    @RecordAnnotation on createRecord method. So the plugin program invokes the visit
    method:


    builder.visit(new MemberAttributeExtension


    .ForMethod()


    .annotateMethod(nestedAnnotation)


    .on(ElementMatchers.named(“createRecord”)))


    155


    ![](Image00000.gif)


    The instance of ForMethod is created, and the nestedAnnotation variable is passed
    to its annotateMethod method. The on method is invoked to match the createRecord
    method in DataProducer. class . Therefore, this code should add the @RecordAnnotaion
    to the createRecord method:


    @RecordAnnotation({


    @ColumnAnnotation(name=”username”,


    value=”user01”),


    @ColumnAnnotation(name=”age”, value=”25”)})


    public void createRecord() {}


    Remove annotation from Java method


    Next, the plugin program removes the @Deprecated annotation from the createData
    method. For this purpose, the plugin program is required to implement a customized
    derived class of net. bytebuddy.asm.AsmVisitorWrapper.ForDeclaredMethods. MethodVisitorWrapper
    . The plugin program will create this derived class in anonymous class format,
    and it is created in methodDeprecatedRemover method of the plugin program:


    private MethodVisitorWrapper


    methodDeprecatedRemover() {


    return new MethodVisitorWrapper() {


    @Override


    public MethodVisitor wrap(


    TypeDescription type,


    MethodDescription mtdDesc,


    MethodVisitor methodVisitor,


    Context ctx,


    TypePool pool, int writeFlag, int readFlag


    ) {


    return new MethodVisitor(


    Opcodes.ASM7, methodVisitor) {


    @Override


    public AnnotationVisitor


    visitAnnotation(String desc, boolean


    visible) {


    156


    ![](Image00000.gif)


    if (Type.getDescriptor(


    Deprecated.class).equals(desc)) {


    return null;


    }


    return super.visitAnnotation(desc,


    visible);


    }


    };


    }};


    }


    The derived class of MethodVisitorWrapper requires to implement the wrap method.
    In this implementation, the wrap method returns an instance of net.bytebuddy.jar.asm.MethodVisitor.
    The implementation of wrap method creates the instance of MethodVisitor in anonymous
    class format, and this anonymous class implements the visitAnnotation method.
    Similar to ClassVisitor, the instrumentation process will invoke the visitAnnotation
    method when the process encounters an annotation in the method. The annotation
    descriptor of the currently inspecting annotation is available via the desc parameter.
    So the program uses desc parameter to match the target annotation that the program
    wants to remove:


    if (Type.getDescriptor(Deprecated.class). equals(desc)) {


    return null;


    }


    If the annotation descriptor of Deprecated.class is found, then return null. The
    null value causes the instrumentation process to mark the @Deprecated in comment
    block. To end the visitAnnotation method, invokes the superclass’s visitAnnotation
    method at the end of the method.


    Now the implementation of methodDeprecatedRemover method is completed. The plugin
    program will use this method in the visit method:


    157


    ![](Image00000.gif)


    builder.visit(


    new AsmVisitorWrapper.ForDeclaredMethods()


    .method(


    ElementMatchers.named(“createData”),


    methodDeprecatedRemover()


    )


    );


    The program instantiates an instance of ForDeclaredMethods . Then, invokes the
    method method of ForDeclaredMethods . The method method requires two parameters.
    The first parameter requires the ElementMatchers . In this example, the matcher
    attempts to match the createData method, so the ElementMatchers.named method is
    used. The second parameter takes an instance of MethodVisitorWrapper . The methodDeprecatedRemover
    method is invoked in this parameter. After this, the instance of ForDeclaredMethods
    has the necessary matcher and MethodVisitorWrapper instance, the instrumentation
    process should remove the @Deprecated annotation from the createData method. This
    is the createData method after instrumentation process:'
