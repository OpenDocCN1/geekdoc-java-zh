    # 重基（Rebase）Java 类\n\n本章介绍了几种可以创建新 Java 元素的方法：\n\n- `makeInterface`\n- `makeEnumeration`\n\
    - `makeAnnotation`\n- `subclass`\n\n还有另一个名为 `rebase` 的方法，它是 `net.bytebuddy.ByteBuddy`\
    \ 的方法。`rebase` 方法用于修改现有的 Java 元素。`rebase` 方法是 maven 构建过程中插件程序中使用的默认方法。这意味着每当插桩使用\
    \ ByteBuddy maven 插件对类进行插桩时，maven 构建过程就会使用 `rebase` 方法。这与此行实例化 `ByteBuddy` 实例的代码类似：\n\
    \n```java\nnew ByteBuddy().rebase(typeDescription)\n```\n\n然而，这行代码被封装在插件程序中。开发者可以通过\
    \ `net.bytebuddy.build.EntryPoint` 配置 `rebase`。\n\n在 ChapterDefineInterface Eclipse\
    \ 项目中，`com.millionstrengthknowledge.interceptorprj.plugin` 包中有一个名为 `PluginConfig.java`\
    \ 的 Java 类。`PluginConfig.java` 实现了 `net.bytebuddy.build.EntryPoint`。`EntryPoint`\
    \ 程序在 maven 构建过程之前启动。它可以被用于配置插件程序的插桩过程。这是 `PluginConfig.java` 的源码：\n\n241\n\n\
    ![](img/Image00000.gif)\n\n```java\npublic class PluginConfig implements EntryPoint\
    \ {\n    @Override\n    public ByteBuddy byteBuddy(ClassFileVersion c) {\n   \
    \     System.out.println“PluginConfig EntryPoint start”);\n        return new\
    \ ByteBuddy().with(ClassFileVersion.JAVA_V11);\n    }\n    @Override\n    public\
    \ Builder<?> transform(\n        TypeDescription typeDescription,\n        ByteBuddy\
    \ byteBuddy,\n        ClassFileLocator cf,\n        MethodNameTransformer mtd)\n\
    \    {\n        return byteBuddy.rebase(typeDescription, cf, mtd);\n    }\n}\n\
    ```\n\n在本章中，通过 `PluginConfig.java` 的实现演示了插件程序如何在 maven 构建过程开始之前配置 `ByteBuddy`。来自\
    \ `EntryPoint` 的派生类必须实现这两个方法：`byteBuddy` 和 `transform`。`byteBuddy` 方法是用于实例化 `net.bytebuddy.ByteBuddy`\
    \ 实例的方法：\n\n```java\npublic ByteBuddy byteBuddy(ClassFileVersion c){\n    System.out.println“PluginConfig\
    \ EntryPoint start”);\n    return new ByteBuddy().with(ClassFileVersion.JAVA_V11);\n\
    }\n```\n\n242\n\n![](img/Image00000.gif)\n\n(1) 实例化 `ByteBuddy` 实例：`new ByteBuddy()`\n\
    (2) 配置 `ByteBuddy` 实例：`.with(ClassFileVersion.JAVA_V11)`\n\n`with` 方法用于配置 `ByteBuddy`\
    \ 实例。在本例中，`with` 参数配置 `ByteBuddy` 生成 Java 11 格式的 Java 类。然而，这是可选的，因为插件始终根据 maven\
    \ 构建过程所使用的 JDK 版本来生成 Java 类。\n\n这是 `transform` 方法的源码：\n\n```java\n@Override\n\
    public Builder<?> transform(\n    TypeDescription typeDescription,\n    ByteBuddy\
    \ byteBuddy,\n    ClassFileLocator cf,\n    MethodNameTransformer mtd)\n{\n  \
    \  return byteBuddy.rebase(typeDescription, cf, mtd);\n}\n```\n\n`transform` 方法是插件程序选择插桩策略的地方。在本例中，使用了\
    \ `rebase` 方法。但请注意，即使插件程序没有实现 `EntryPoint`，插件也会默认 `rebase`。\n\n要将 `PluginConfig.java`\
    \ 应用到构建过程中，需要在 `pom.xml` 中添加 `<entryPoint>` 元素：\n\n```xml\n<plugin>\n    <groupId>net.bytebuddy</groupId>\n\
    \    <artifactId>byte-buddy-maven-plugin</artifactId>\n    243\n    ![](img/Image00000.gif)\n\
    \    <version>${bytebuddy.version}</version>\n    <executions>\n        <execution>\n\
    \            <goals>\n                <goal>transform</goal>\n            </goals>\n\
    \        </execution>\n    </executions>\n    <configuration>\n        <initialization>\n\
    \            <entryPoint>com.millionstrengthknowledge.interceptorprj.plugin.PluginConfig</entryPoint>\n\
    \        </initialization>\n        <transformations>\n            <transformation>\n\
    \                <plugin>com.millionstrengthknowledge.interceptorprj.plugin.InterceptorPlugin</plugin>\n\
    \            </transformation>\n        </transformations>\n    </configuration>\n\
    </plugin>\n```\n\n244\n\n![](img/Image00000.gif)\n\n# 总结\n\n本章介绍了：\n\n- 如何创建 Java\
    \ Interface\n- 如何创建枚举\n- 如何创建注解\n- 如何创建 Java 类\n- 如何创建抽象类\n- 如何使用新生成的 Java 元素对现有\
    \ Java 类进行插桩\n- 插件使用了 rebase 方法\n\n245\n\n![](img/Image00000.gif)\n\n# 第 20 章：插桩\
    \ JDK 类\n\n本章解释了如何插桩 JDK（Java 开发工具）核心类。本章也介绍了在使用 `ByteBuddy` 的 Java Instrumentation\
    \ API。本章源码包含在 ChapterJdkInstrumentation 项目中。\n\n本章使用 Java Instrumentation API\
    \ 和 `ByteBuddy` 插桩 `java.lang.String` 类。与之前的所有章节不同，Java Instrumentation API 不需要\
    \ ByteBuddy maven 插件。相反，Java Instrumentation API 使用 agent。\n\nJava 使用类加载器将类从磁盘加载到\
    \ JVM（虚拟机）。在 Java instrumentation API 实现中，agent 在类加载到 JVM 之前对其拦截。当 agent 完成拦截后，插桩的\
    \ Java 类会被加载到 JVM。\n\n插桩 agent 在应用程序运行时拦截 Java 类。Java instrumentation API 适用于以下情况：\n\
    \n插桩的 Java 类文件无法保存：对于从版本 9 开始的新 JDK 是如此，因为所有 JDK 核心类都被压缩成特殊格式（不是 jar 文件），构建过程无法对其进行重新封装。\n\
    \n应用程序希望根据编译和构建期间无法确定、仅在运行时才能条件生成代码。因此，ByteBuddy maven 插件并不适用。相反，应用程序将使用 agent\
    \ 在运行时对 JDK 核心类进行插桩。agent 是具有插桩能力的 Java 组件，该能力通过 transformer 实现。因此 agent 可以拥有多个\
    \ transformer。agent 的示例包括监控 agent、分析器 agent、程序追踪 agent。agent 必须实现 `premain` 方法。\n\
    \n246\n\n![](img/Image00000.gif)\n"
- fmt: "\nWhen the JVM starts, the JVM will invokes the `premain` method of the agent,\
    \ and then JVM invokes the `main` method of the application to start the application.\
    \ When there are multiple agents, the `premain` method of each agent is invoked\
    \ in sequence order, and then the `main` method of the application.\n\nDuring\
    \ the application runtime, the `classloader` will keep on loading new Java class\
    \ into JVM. Whenever the `classloader` loads the new class into JVM, the agent\
    \ will intercept the new class. The agent then invokes each of its `transformer`\
    \ to instrument the new class. After the instrumentation process completes, then\
    \ the new class with advice code will be loaded into JVM.\n\nThe `InterceptorAgent.java`\
    \ in this chapter is the agent Java class:\n\n```java\npublic class InterceptorAgent\
    \ {\n    public static void premain(String arguments, Instrumentation inst) {\n\
    \        ByteBuddyAgent.install();\n        new AgentBuilder.Default()\n     \
    \       .with(AgentBuilder.RedefinitionStrategy.REDEFINITION)\n            .with(AgentBuilder.Listener.StreamWriting.toSystemOut())\n\
    \            .ignore(ElementMatchers.none())\n            .type(ElementMatchers.named(\"\
    java.lang.String\"))\n            .transform((builder, typeDescription, classLoader,\
    \ module) -> {\n                return builder.visit(\n                    Advice.to(LogInterceptor.class)\n\
    \                    .on(\n                        ElementMatchers.named(\"toUpperCase\"\
    )\n                        .and(ElementMatchers.isMethod())\n                \
    \        .and(ElementMatchers.takesNoArguments())\n                    )\n   \
    \             );\n            }).installOnByteBuddyAgent();\n    }\n}\n```\n\n\
    ### InterceptorAgent\n\nThis is the method signature of the `premain` method:\n\
    \n```java\npublic static void premain(String arguments, Instrumentation inst)\n\
    ```\n\nThe method takes two parameters:\n\n- The `String` parameter is the placeholder\
    \ parameter that allows developer to pass miscellaneous data to the agent.\n-\
    \ The second parameter is type of `java.lang.instrument.Instrumentation`. The\
    \ JVM provides the instance of `Instrumentation` during application runtime. This\
    \ parameter provides services needed to instrument the Java class file. The agent\
    \ can add `transformer` via `addTransformer` method of this instance.\n\nThe first\
    \ line of the method body is:\n\n```java\nByteBuddyAgent.install();\n```\n\nThe\
    \ `ByteBuddyAgent` is the Java class from `net.bytebuddy.agent` package, which\
    \ is available from `byte-buddy-agent` maven dependency. The `install` method\
    \ installs the ByteBuddy built-in agent in the JVM. The agent is required for\
    \ instrumenting the loaded Java class in the JVM.\n\nNext, the program instantiates\
    \ an instance of `AgentBuilder`. The `AgentBuilder` is a public static class in\
    \ `net.bytebuddy.agent.builder` package. The `AgentBuilder.Default` is used to\
    \ instantiate a new instance of the `AgentBuilder` with default configuration.\
    \ Default configuration uses rebase strategy, and the agent will not instrument\
    \ the JDK core class. The program uses `with` method to configure the `AgentBuilder`.\
    \ `RedefinitionStrategy.REDEFINITION` strategy:\n\n```java\n.with(AgentBuilder.RedefinitionStrategy.REDEFINITION)\n\
    ```\n\nWith redefinition strategy, the agent can instrument the Java class that\
    \ is already loaded, and not yet loaded into JVM. For Java class that is already\
    \ loaded into JVM, the agent will instrument the class when the `premain` method\
    \ is invoked. For Java class that is not yet loaded into JVM, the agent will instrument\
    \ the class when the `classloader` is loading the class.\n\nNext, the program\
    \ configures agent to enable the agent process logging:\n\n```java\n.with(AgentBuilder.Listener.StreamWriting.toSystemOut())\n\
    ```\n\nThis line enables the logging of the ByteBuddy instrumentation process\
    \ to console.\n\nNext, the program configures new transformer to instrument the\
    \ JDK core class:\n\n```java\n.ignore(ElementMatchers.none())\n```\n\nWithout\
    \ this configuration, the new transformer will ignore the JDK core class for instrumentation\
    \ because the instance of `AgentBuilder` that is instantiated via `AgentBuilder.Default`\
    \ method disable it by default. That means the JDK core class will be skipped\
    \ for instrumentation process. Since the agent wants to instrument `java.lang.String`,\
    \ so the new transformer should not ignore the JDK core class. The `ignore` method\
    \ is used to configure this behavior, and the `ElementMatchers.none` method informs\
    \ the new transformer that none of the JDK core class should be ignored.\n\nNext,\
    \ the program specifies the matching logic for the target class:\n\n```java\n\
    .type(ElementMatchers.named(\"java.lang.String\"))\n```\n\nThis is similar to\
    \ the `matches` method in the plugin program. The `AgentBuilder` uses `type` method\
    \ to configure the matching logic for the new transformer. In this example, the\
    \ `ElementMatchers.named` method is used to match `java.lang.String`.\n\nAfter\
    \ that, the program invokes `transform` method:\n\n```java\n.transform(builder,\
    \ typeDescription, classLoader, module)\n-> {\n    return builder.visit(\n   \
    \     Advice.to(LogInterceptor.class)\n        .on(\n            ElementMatchers.named(\"\
    toUpperCase\")\n            .and(ElementMatchers.isMethod())\n            .and(ElementMatchers.takesNoArguments())\n\
    \        )\n    );\n})\n```\n\nThe `transform` method of `AgentBuilder` is used\
    \ to add the instrumentation capability to the new transformer. It is similar\
    \ to the `apply` method in the plugin program. The `transform` method accepts\
    \ one parameter, which is type of `net.bytebuddy.agent.builder.AgentBuilder.Transformer`.\n\
    \nIn this example, the program implements the transformer using the lambda expression.\
    \ The `AgentBuilder.Transformer` has one method, which has this method signature:\n\
    \n```java\nDynamicType.Builder<?> transform(DynamicType.Builder<?> builder, TypeDescription\
    \ typeDescription, ClassLoader classLoader, JavaModule module)\n```\n\nThis `transform`\
    \ method of `AgentBuilder.Transformer` is the method that will be invoked by agent\
    \ to instrument the Java class file in `premain` method, and before the Java class\
    \ file is loaded into JVM.\n\nThe program will use the first parameter, `builder`,\
    \ to configure the advice code:\n\n```java\nbuilder.visit(\nAdvice.to(LogInterceptor.class)\n\
    .on(\n    ElementMatchers.named(\"toUpperCase\")\n    .and(ElementMatchers.isMethod())\n\
    \    .and(ElementMatchers.takesNoArguments())\n));\n```\n\nThe `builder` uses\
    \ `visit` method to configure the `Advice`. The transformer will apply the advice\
    \ code of `LogInterceptor.class` when the application invokes to `toUpperCase`\
    \ method of `java.lang.String`.\n\nAfter all, the program chains the method to\
    \ `installOnByteBuddyAgent` method. This method installs the transformer in the\
    \ `ByteBuddyAgent`.\n\n```java\n.installOnByteBuddyAgent();\n```\n\n### Premain-Class\
    \ attribute in MANIFEST.MF\n\nIn order to activate the agent, the application\
    \ must create a jar file that package the agent Java class file, and one `MANIFEST.MF`.\
    \ The manifest file must have one `Premain-Class` attribute. The value of this\
    \ attribute is the fully qualified class name of the agent. Therefore, the application\
    \ creates the `MANIFEST.MF` file in resources folder of `ChapterJdkInstrumentation`\
    \ Eclipse project, and this is the content of the file:\n\n```\nPremain-Class:\
    \ com.millionstrengthknowledge.interceptorprj.interceptor.InterceptorAgent\n```\n\
    \n### Maven pom.xml\n\nThe plugin program is not applicable when the program uses\
    \ Java Instrumentation API. The program will use the maven to create the agent\
    \ jar file. Instead of using `byte-buddy-maven-plugin`, the `pom.xml` configures\
    \ the `maven-jar-plugin`:\n\n```xml\n<plugin>\n    <groupId>org.apache.maven.plugins</groupId>\n\
    \    <artifactId>maven-jar-plugin</artifactId>\n    <version>3.2.0</version>\n\
    \    <executions>\n        <execution>\n            <id>agent</id>\n         \
    \   <goals>\n                <goal>jar</goal>\n            </goals>\n        \
    \    <configuration>\n                <classifier>agent</classifier>\n       \
    \         <includes>\n                    <include>**/interceptor/**</include>\n\
    \                </includes>\n                <archive>\n                    <manifestFile>src/main/resources/META-INF/MANIFEST.MF</manifestFile>\n\
    \                </archive>\n            </configuration>\n        </execution>\n\
    \    </executions>\n</plugin>\n```\n"
