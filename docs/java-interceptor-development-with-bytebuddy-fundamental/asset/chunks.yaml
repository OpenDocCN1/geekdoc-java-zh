  trans: "\n该代码调用了构造方法并应用了 `ElementMatchers`。`isDefaultConstructor` 方法匹配默认构造函数。在选择默认构造函数后，构建器调用\
    \ `intercept` 方法来生成使用 `MethodCall` 调用父类构造函数的代码。然后，代码使用 `FieldAccessor` 将实例变量 `dataProducerId`\
    \ 的值设置为 `120`，并将 `data` 实例变量的 `120` 设置为字符串值 `“ <noData> ”`。\n\n![](img/Image00000.gif)\n\
    \n与第 10 章“动态声明实例变量”中引入的 `value` 方法相比，`setsValue` 方法是更合适的使用方法。在为 Java 字节码编写程序时，程序必须使用构造函数来设置实例变量的初始值。\n\
    \n### 为什么插件程序没有声明，但 `DataProducer.java` 仍然包含默认构造函数？\n\n当调用以下方法之一时，ByteBuddy 会隐式地创建默认构造函数：`define`、`defineConstructor`。`define`\
    \ 方法可用于声明实例变量和 Java 方法。如果使用 `define` 方法声明构造函数，ByteBuddy 将自动创建默认构造函数。因此，在创建 `DataProducer(int,String,String)`\
    \ 构造函数时，默认构造函数已经创建完成。\n\n### 使用 `visit` 方法生成构造函数\n\n最后，插件程序声明了此构造函数：\n\n```java\n\
    public DataProducer(\nint p1, String p2, String p3, String p4){\n  super(p1, p3);\n\
    \  if(p1 % 2==0)\n  dataProducerId=p1+10000;\n  else\n  dataProducerId=p2+20000;\n\
    \  data=p2;\n  int01=new BigInteger(data);\n}\n```\n\n这是生成构造函数的代码：\n\n```java\n\
    builder=builder\n.defineConstructor(Visibility.PUBLIC)\n.withParameters(int.class,\
    \ String.class,\nString.class, String.class)\n121\n```\n\n![](img/Image00000.gif)\n\
    \n```java\n.intercept(\nMethodCall.invoke(\nProducer.class\n.getDeclaredConstructor(long.class,\n\
    String.class))\n.withArgument(0, 2));\n\nbuilder\n.visit(Advice.to(ValueSetter.class)\n\
    .on(\nElementMatchers.isConstructor()\n.and(ElementMatchers.takesArgument(\n0,int.class))\n\
    .and(ElementMatchers.takesArgument(\n1,String.class))\n.and(ElementMatchers.takesArgument(\n\
    2,String.class))\n.and(ElementMatchers.takesArgument(\n3,String.class))));\n```\n\
    \n`intercept` 方法仅生成调用父类构造函数的字节码：\n\n```java\nsuper(p1, p3);\n```\n\n剩余代码由 `visit`\
    \ 方法生成。在 `visit` 方法中，为了匹配构造函数，使用了 `ElementMatchers.isConstructor` 和 `ElementMatchers.takesArgument(0,\
    \ int.class)` 方法。\n\n`isConstructor` 方法将匹配范围限制为仅构造函数。\n\n`takesArgument` 方法接受两个参数：`int`\
    \ 和 `java.lang.Class`。`int` 参数指定参数的索引。第二个参数指定其数据类型。该方法仅匹配一个参数。因此，为了匹配具有四个参数的构造函数，`takesArgument`\
    \ 执行了四次。通过这种配置，将选择构造函数 `public DataProducer(int, String, String, String)` 来应用建议代码。\n\
    \n122\n\n![](img/Image00000.gif)\n\n**ValueSetter.java:**\n\n```java\npublic class\
    \ ValueSetter {\n  @OnMethodExit\n  public static void set(\n  int param0, String\
    \ param1,\n  @FieldValue(value=”dataProducerId”,\n  readOnly=false) int var1,\n\
    \  @FieldValue(value=”data”,\n  readOnly=false) String var2,\n  @FieldValue(value=”int01”,\n\
    \  readOnly=false) BigInteger biginteger\n  ) {\n    if(param0%2==0)\n    var1=param0+10000;\n\
    \    else\n    var1=param0+20000;\n    var2=param1;\n    biginteger = new BigInteger(var2);\n\
    \  }\n}\n```\n\n之后，构造函数体将包含 `ValueSetter.java` 中提供的建议代码。\n\n观察到建议代码实例化了一个名为 `“\
    \ int01 ”` 的实例变量，该变量是 `BigInteger` 的实例。每当构造函数想要使用 `new` 操作符实例化对象时（例如 `new BigInteger(java.lang.String)`），都应该为此目的实现建议代码。`intercept`\
    \ 方法假设可以通过使用 `MethodCall` 生成此代码：\n\n```java\n.intercept(\nMethodCall.construct(BigInteger.class.\n\
    getDeclaredConstructor(String.class))\n.withArgument(2)\n.setsField(\nField.class.getDeclaredField(“int01”)));\n\
    123\n```\n\n![](img/123\n\n然而，在本文写作期间，`MethodCall` 的使用在注入过程中会导致 `java.lang.IllegalStateException`。因此，当构造函数需要实例化新对象时，使用建议代码。\n\
    \n### 结论\n\n本章解释了：\n\n- 如何动态声明构造函数\n- 如何使用 `MethodCall` 声明构造函数体\n- 如何向父构造函数传递参数\n\
    - 如何使用 `FieldAccessor.ofField` 的 `setsValue` 方法设置实例变量的初始值\n\n124\n\n![](Image00000.gif)\n\
    \n### 第 13 章：生成泛型构造函数、方法和变量\n\n本章解释了如何动态声明泛型构造函数、方法和变量。`net.bytebuddy.description.type.TypeDescription.Generic`\
    \ 是声明泛型方法和变量的基础 Java 类。\n\n```java\npublic class DataProducer { }\n```\n\n`DataProducer.java`\
    \ 包含了泛型代码的视图：\n\n```java\npublic class DataProducer<A, B> {\n  private A test1;\n\
    \  private B test2;\n  private super A test3;\n  private extends B test4;\n  private\
    \ extends A test5;\n  private String test6;\n  private extends B test7;\n  private\
    \ String test8;\n  private String test9;\n\n  public DataProducer() {}\n\n  public\
    \ <R> DataProducer(A paramA, B paramB) {}\n\n  public <R> StringMtd1(A paramA,\
    \ ? extends B) testtd2(R paramR) {}\n\n  public <R> StringMtd3(R paramR) {}\n\n\
    \  public <R> StringMtd4(R paramR, List<String> paramList) {}\n\n  public <R>\
    \ StringMtd5(R paramR) {}\n\n  public <R> StringMtd6(A paramA, B paramB, ? super\
    \ A, ? extends B) testtd7 {}\n\n  public <P, Q> StringMtd7(P paramP, Q paramQ)\
    \ {}\n\n  public <P, extends Serializable> StringMtd8(P paramR) {}\n}\n```\n\n\
    `DataProducer.class` 并不包含泛型变量。通过以下代码为 `DataProducer.class` 添加 `A` 和 `B` 泛型变量：\n\
    \n```java\nbuilder.typeVariable(“A”)\n.typeVariable(“B”);\n```\n\n`typeVariable`\
    \ 方法负责定义泛型变量。为了创建 `A` 泛型变量，将字符`“A”`传递给 `typeVariable` 方法的参数。`“B”`泛型变量也使用了相同方法。通过上述代码，`DataProducer.class`\
    \ 变为如下声明：\n\n```java\npublic class DataProducer<A, B>{\n```\n\n### 泛型实例变量\n\n\
    `test1` 实例变量使用了泛型变量 `A`：\n\n```java\nprivate A test1;\n```\n\n这是生成该声明的代码：\n\n\
    ```java\nbuilder.defineField(“test1”, A_type,\nVisibility.PRIVATE);\n```\n\n代码使用了\
    \ `defineField` 方法，这是通常用于生成实例变量的方法。然而，观察到数据类型指定了 `A_type`。这是声明实例变量数据类型的新概念。`A_type`\
    \ 是 `net.bytebuddy.description.type.TypeDescription.Generic` 类的实例：\n\n127\n\n\
    ![](img/Image00000.gif)\n\n```java\nGeneric A_type =\nTypeDescription.Generic.Builder\n\
    .typeVariable(“A”).build();\n```\n"
- fmt: "\nIn order to create the Generic instance, uses the generic builder of `net.bytebuddy.description.type.TypeDescription`.\
    \ The builder can be accessed via `TypeDescription.Generic.Builder`. Then, chains\
    \ the builder to `typeVariable` method, and then invokes the `build` method. After\
    \ that, `A_type` instance is created and it represents the “A” type variable.\
    \ The `defineField` method uses `A_type` to define the data type for `test1` instance\
    \ variable.\n\nIn order to declare parameterized type, use the `net.bytebuddy.description.type.TypeDescription.Generic.Builder`\
    \ also. However, instead of using `typeVariable` method, the `parameterizedType`\
    \ method is used. For example, `test2` is an instance variable of `List<?>`:\n\
    \n```java\nprivate List<?> test2;\n```\n\nThis is the code that generates the\
    \ declaration:\n\n```java\nbuilder.defineField(\"test2\", lt_w, Visibility.PRIVATE);\n\
    ```\n\nThe `lt_w` is an instance of `net.bytebuddy.description.type.TypeDescription.Generic`\
    \ class:\n\n```java\nGeneric wildCard = TypeDescription.Generic.Builder.unboundWildcard();\n\
    Generic lt_w = TypeDescription.Generic.Builder.parameterizedType(TypeDescription.ForLoadedType.of(List.class),\
    \ wildCard).build();\n```\n\n128\n\n![](Image00000.gif)\n\nThe `List<?>` is a\
    \ parameterized type, and its type argument is an unbound wild card, `<?>`. Therefore,\
    \ the declaration requires to create a wild card instance. For this purpose, `TypeDescription.Generic.Builder.unboundWildcard`\
    \ method is used, and the wild card instance is stored in the `wildCard` variable.\n\
    \nThe `wildCard` variable is then used in the `parameterizedType` method. To define\
    \ the parameterized type: `List<?>`, passes the `TypeDescription.ForLoadedType.of(List.class)`\
    \ and `wildCard` variable to the first and second parameter of `parameterizedType`\
    \ method. Then, invokes `build` method at the last of method chain. This should\
    \ generate the bytecode of the declaration of `test2` instance variable.\n\nNext,\
    \ the plugin program declares `test3` instance variable:\n\n```java\nprivate List<?\
    \ super A> test3;\n```\n\nThis is the code that generates the declaration:\n\n\
    ```java\nbuilder.defineField(\"test3\", lt_w_lbA, Visibility.PRIVATE);\n```\n\n\
    This is the declaration of `lt_w_lbA`:\n\n```java\nGeneric A_lb = TypeDescription.Generic.Builder.typeVariable(\"\
    A\").asWildcardLowerBound();\nGeneric lt_w_lbA = TypeDescription.Generic.Builder.parameterizedType(TypeDescription.ForLoadedType.of(List.class),\
    \ A_lb).build();\n```\n\nThe `List<? super A>` uses type argument of lower bound\
    \ wildcard of `A` type variable. In order to create the parameterized type, two\
    \ variables are required: `lt_w_lbA`, and `A_lb`.\n\n129\n\n![](Image00000.gif)\n\
    \nThe `asWildCardLowerBound` method is used to declare the wild card lower bound\
    \ type variable. Therefore, `A_lb` variable stores the value of “ ? super A ”.\n\
    \nTo declare the parameterized type `List<? super A`, passes the `TypeDescription.ForLoadedType.of(List.class)`\
    \ and `A_lb` variable to the parameter of `parameterizedType` method, and then\
    \ invokes `build` method. The code should create `lt_w_lbA` variable that stores\
    \ the declaration of “ List<? super A > ”, and `defineField` method can use the\
    \ variable to define the data type for `test3` instance variable.\n\n`TypeDescription.ForLoadedType.of(List.class)`\
    \ is responsible to create the variable of `TypeDescription` of `java.lang.List`.\
    \ `TypeDescription` represents the Java class loaded in the JVM. In this example,\
    \ that Java class is the `java.lang.List`. The `TypeDescription.ForLoadedType.of`\
    \ method is the common method used in the ByteBuddy programming.\n\nNext, the\
    \ plugin program declares `test4` instance variable:\n\n```java\nprivate List<?\
    \ extends B> test4;\n```\n\nThe `test4` instance variable is a parameterized type,\
    \ and its type argument is an upper bound wildcard of `B` type variable. In order\
    \ to create this instance variable, first creates the variable, `B_ub`, which\
