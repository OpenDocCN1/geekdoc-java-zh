  trans: "\n用于创建泛型构造函数的代码模式与泛型方法非常相似。因此，本章将仅为该示例创建一个构造函数。该构造函数有一个类型参数 `R`。`R` 类型参数被用在构造函数的第三个参数中。第一个和第二个参数使用\
    \ `A` 和 `B`，它们是 `DataProducer.java` 的类型参数。因此，这段代码将生成构造函数：\n\n```java\nbuilder.defineConstructor(Visibility.PUBLIC)\n\
    .withParameters(A_type, B_type, R_type)\n.typeVariable(“R”)\n.intercept(MethodCall.invoke(\n\
    Object.class.getDeclaredConstructor()));\n```\n\n### 使用泛型类型开发拦截器\n\nJava 对泛型类型应用类型擦除（type\
    \ erasure）。在开发拦截器时，建议代码（advice code）需要区别地管理对象，因为类型擦除会在编译前更改实现的数据类型。例如，`DataProcessor.java`\
    \ 拥有类型参数 `P`，且 `Q` 扩展 `Number`。\n\n```java\npublic class DataProcessor<P,Q extends\
    \ Number> {\n    public void process(P p, Q q) {\n        System.out.println(“Paramerer1:\
    \ “+p);\n        System.out.println(“Paramerer2: “+q);\n    }\n}\n```\n\n![](img/Image00000.gif)\n\
    \n如果建议代码想要拦截 `process` 方法的参数，建议代码需要使用 `java.lang.Object` 和 `java.lang.Number`\
    \ 来映射第一个和第二个参数。`DataProcessorInterceptor.java` 是为 `DataProcessor.class` 开发的建议代码：\n\
    \n```java\npublic class DataProcessorInterceptor {\n    @Advice.OnMethodEnter\n\
    \    public static void start(\n        @Argument(\n            value=0,readOnly=false,\n\
    \            typing=Assigner.Typing.DYNAMIC\n        ) Object param1,\n      \
    \  @Argument(\n            value=1,readOnly=false,\n            typing=Assigner.Typing.DYNAMIC\n\
    \        ) Number param2) {\n        if(param1 instanceof String) {\n        \
    \    param1 = param1+”randomdata”;\n        }\n        if(param2 instanceof Integer){\n\
    \            param2=((Integer)param2)+1;\n        }\n    }\n}\n```\n\n该建议代码实现了\
    \ `on method enter` 建议。`param1` 参数映射到 `process` 方法的第一个参数。`process` 方法的第一个参数类型为\
    \ `P`。在建议代码中映射此类类型的参数时，使用了 `java.lang.Object`，因为类型参数在编译后被更改为了 `java.lang.Object`。\n\
    \n`param2` 参数映射到 `process` 方法的第二个参数。`process` 方法的第二个参数类型为 `Q`，它具有 `java.lang.Number`\
    \ 的上界。因此，可以使用 `java.lang.Number` 来映射第二个参数。\n\n当建议代码处理参数时，建议代码需要检查参数的数据类型。在本例中，建议代码使用\
    \ `instanceof` 来检查 `param1` 的数据类型。如果 `param1` 是 `java.lang.String`，则向 `param1`\
    \ 追加一个 “ ramdomdata `。如果 `param2` 是 `java.lang.Integer`，则对该整数加 1。\n\n因此，在为泛型类型编程时，建议代码必须意识到类型擦除的存在。\n\
    \n### 总结\n\n本章解释了如何生成泛型实例变量、泛型方法和泛型构造函数。\n\n![](img/Image00000.gif)\n\n## 第 14\
    \ 章：添加和移除 Java 注解\n\n本章解释了如何动态添加和移除标记在构造函数、Java 方法和实例变量上的 Java 注解。本章的源码包含在 `ChapterAnnotation`\
    \ Eclipse 项目中。\n\n本章被认为是复杂的。此概述有助于增强对本章说明的理解：\n\n- 使用 `net.bytebuddy.dynamic.DynamicType.Builder`\
    \ 为 Java 类添加注解。\n"
- fmt: "\n## Introduction\n\nThe `annotateType` method is the method that adds annotation\
    \ to the Java class. Its method parameter accepts an instance of `net.bytebuddy.description.annotation.AnnotationDescription`.\
    \ To add the annotation to the Java class, passes the instance of `AnnotationDescription`\
    \ of the desired Java annotation to this parameter. Because the program wants\
    \ to add `@MyAnnotation`, so the method is passed with the `myAnnotation` variable.\
    \ This is the code that declares the `myAnnotation` variable:\n\n```\nAnnotationDescription\
    \ myAnnotation =\nAnnotationDescription.Builder\n.ofType(MyAnnotation.class).build();\n\
    ```\n\n147\n\n![](Image00000.gif)\n\nThe `net.bytebuddy.description.annotation.AnnotationDescription`\
    \ is the fundamental Java class used in annotation programming in ByteBuddy. The\
    \ `AnnotationDescription` is used to create the variable that represents the Java\
    \ annotation. In this example, this Java annotation is the `@MyAnnotation`. So\
    \ the declaration passes the `MyAnnotation.class` to `AnnotationDescription.Builder.ofType`\
    \ method, and invokes the `build` method. After that, the `myAnnotation` variable\
    \ is created and can be used in the `annotateType` method. The `annotateType`\
    \ method adds the `@MyAnnotation` to the `DataProducer.class` at class level.\n\
    \n## Remove annotation from the Java class\n\nThen, the plugin program removes\
    \ the `@Deprecated` annotation from the `DataProducer.class`. To remove the class\
    \ level annotation, develops a derived class that extends `net.bytebuddy.asm.AsmVisitorWrapper.AbstractBase`.\
    \ In this example, this derived class is the `ClassAnnotationRemoval.java`, and\
    \ it is used to remove the `@Deprecated` annotation:\n\nThe derived class is required\
    \ to implement the superclass `wrap` method. The `wrap` method has eight parameters.\n\
    \n![](Image00046.jpg)\n\n148\n\n```\npublic ClassVisitor wrap(\n    TypeDescription\
    \ instrumentedType,\n    ClassVisitor classVisitor,\n    Implementation.Context\
    \ context,\n    TypePool typePool,\n    FieldList<FieldDescription.InDefinedShape>\
    \ fs,\n    MethodList<?> methods,\n    int writerFlags,\n    int readerFlags\n\
    )\n```\n\n![](Image00000.gif)\n\nThe implementation is going to use the only one\
    \ parameter from that eight parameters: `ClassVisitor`, the second parameter of\
    \ the `wrap` method. The ByteBuddy will provide the instance of `ClassVisitor`\
    \ for this parameter during build time, this instance contains the necessary service\
    \ for plugin program to generate the bytecode. However, the instance cannot remove\
    \ the annotation. Therefore, the `ClassAnnotationRemoval.java` uses this instance\
    \ to instantiate another instance of `ClassVisitor`, and implements the `visitAnnotation`\
    \ method so that it can remove the annotation. This is the implementation of the\
    \ `wrap` method:\n\n```java\nreturn new ClassVisitor(Opcodes.ASM7, classVisitor)\
    \ {\n    public AnnotationVisitor visitAnnotation(java.lang.String desc, boolean\
    \ visible) {\n        if (Type.getDescriptor(targetAnnotationClass).equals(desc))\
    \ {\n            return null;\n        }\n        return super.visitAnnotation(desc,\
    \ visible);\n    }\n};\n```\n\nThe implementation instantiates a new instance\
    \ of `ClassVisitor`, which is an anonymous class. The constructor takes two parameters:\n\
    \n149\n\n![](Image00000.gif)\n\n`Opcodes.ASM7` and `classVisitor` (the second\
    \ parameter from `wrap` method). The `Opcodes.ASM7` configures the `ClassVisitor`\
    \ to generate Java bytecode based on Java11. Because the implementation wants\
    \ to enhance the `classVisitor` so that it can be used to remove the annotation,\
    \ the `classVisitor` is passed to the second parameter of the constructor of `ClassVisitor`.\n\
    \nThe anonymous class implements the `visitAnnotation` method. The `visitAnnotation`\
    \ method is used to access and process the annotation of the Java class. The `visitAnnotation`\
    \ method will be invoked implicitly during the instrumentation process. When the\
    \ method is invoked, it accesses the annotation of the Java class one by one.\
    \ If the Java class has one annotation, then this method will be invoked once.\
    \ If the Java class has two annotations, then this method will be invoked twice,\
    \ and so on. The first parameter of `visitAnnotation` method, `desc`, is an instance\
    \ of `java.lang.String`, which contains the value of annotation descriptor. For\
    \ example, `\"Ljava/lang/Deprecated\"` is the annotation descriptor for `@Deprecated`\
    \ annotation. Therefore, the `desc` parameter is used to match the target annotation\
    \ that is for the removal:\n\n```java\nif(Type.getDescriptor(targetAnnotationClass).equals(desc))\
    \ {\n    return null;\n}\n```\n\nThe `targetAnnotationClass` instance variable\
    \ contains an instance of `java.lang.Class` that represents the `@Deprecated`.\
    \ The `Type.getDescriptor` method converts `targetAnnotationClass` instance variable\
    \ from `java.lang.Class` into annotation descriptor, so that it can be used to\
    \ compare with the `desc` variable. So, when the annotation matches, return a\
    \ null value. The null value will cause the instrumentation process to mark the\
    \ `@Deprecated` annotation. To end the `visitAnnotation` method, invokes the superclass’s\
    \ `visitAnnotation` method:\n\n```java\nreturn super.visitAnnotation(desc, visible);\n\
    ```\n\n150\n\n![](Image00000.gif)\n\nThe `targetAnnotationClass` is the instance\
    \ variable declared in `ClassAnnotationRemoval.java`. It is instantiated in the\
    \ constructor:\n\n```java\nprivate Class targetAnnotationClass;\npublic ClassAnnotationRemoval(Class\
    \ c) {\n    targetAnnotationClass = c;\n}\n```\n\nThe plugin program instantiates\
    \ the instance of `ClassAnnotationRemoval` in the parameter of `visit` method.\
    \ The plugin program passes the instance of `java.lang.Class` of `Deprecated`\
    \ to the first parameter of the constructor of `ClassAnnotationRemoval`:\n\n```java\n\
    builder.annotateType(myAnnotation)\n.visit(new ClassAnnotationRemoval(Deprecated.class));\n\
    ```\n\nTherefore, the code above should add the `@MyAnnotation` to the `DataProducer.class`,\
    \ and remove the `@Deprecated` from `DataProducer.class`.\n\n## Add annotation\
    \ to Java method\n\nNext, the plugin program adds the `@Deprecated` annotation\
    \ to the `create` method of `DataProducer.class`. This is the code that adds the\
    \ `@Deprecated` annotation:\n\n```java\nbuilder.visit(\n    new MemberAttributeExtension.ForMethod()\n\
    \    .annotateMethod(defDeprecated)\n    .on(ElementMatchers.named(\"create\"\
    ))\n);\n```\n\nThe code uses `visit` method to perform the instrumentation. The\
    \ instrumentation requires an instance of `net.bytebuddy.asm`.\n\n151\n\n![](Image00000.gif)\n\
    \n`MemberAttributeExtension.ForMethod`. The plugin program will use these two\
    \ methods of `ForMethod` for annotation programming:\n\n- `annotateMethod`: add\
