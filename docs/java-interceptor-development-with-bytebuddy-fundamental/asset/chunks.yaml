    Chapter 1: Introduction


    ByteBuddy is an open source Java based library for Java bytecode generation and
    manipulation. ByteBuddy is licensed under Apache License Version 2.0, and is freely
    available on Github. This book uses the term instrumentation to describe the bytecode
    generation, manipulation, and interception. This book provides example codes that
    applies ByteBuddy capability to intercept, add, modify and delete existing functionality
    of one or more Java classes by modifying their bytecode.


    With ByteBuddy, the instrumentation process can occur during maven build time,
    or application runtime.


    Modern applications tend to be complex in nature because the application needs
    to fulfill different type of requirements, for example, functional requirement
    and non-functional requirement. These applications contains multiple modules with
    each of them has their own functional code. Because of the non-functional requirements,
    the functional code is surrounded by non-functional code, for example, security
    processing, logging, performance monitoring, resource usage tracing for pay-per-use
    billing, DevOps related processing, and others.


    public double calculatePrice(){


    double discount = getDiscount();


    return this.price + this.deliveryCharge -


    discount;


    }


