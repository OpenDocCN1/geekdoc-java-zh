- fmt: "\nObserved that the declaration uses the `defineMethod` method to declare\
    \ the method. The second parameter of `defineMethod` method and the parameter\
    \ of `withParameter` method, both are passed with the `lt_string` variable in\
    \ order to create the generic parameter and return type.\n\nNext, the plugin program\
    \ declares the `testMtd2` method:\n\n```java\npublic List<? extends String> testMtd2(\n\
    \    List<? extends String> paramList){\n    return null;\n}\n```\n\nThe `testMtd2`\
    \ method uses `List<? extends String>` for its method parameter and return type.\
    \ The declaration reuses the `lt_w_ubString` variable to define the method. The\
    \ `lt_w_ubString` variable is the variable that is used for declaration of `test8`\
    \ variable:\n\n134\n\n![](Image00000.gif)\n\n```java\nbuilder.defineMethod(\n\
    “testMtd2”, lt_w_ubString, Visibility.PUBLIC\n).withParameter(lt_w_ubString)\n\
    .intercept(FixedValue.nullValue())\n```\n\nNext, the plugin program declares the\
    \ `testMtd3` method:\n\n```java\npublic <R> String testMtd3(R paramR){\n    return\
    \ null;\n}\n```\n\nThe `testMtd3` method contains `R` type argument that is scoped\
    \ to the `testMtd3` method only. The name for this type argument is method type\
    \ argument. The method parameter is typed to `R`. In order to define this method,\
    \ first creates an instance of `Generic` class. In this example, `R_type` is the\
    \ instance of `Generic` class for this purpose:\n\n```java\nGeneric R_type =\n\
    TypeDescription.Generic.Builder\n.typeVariable(“R”).build();\n```\n\nThen, define\
    \ the `testMtd3` method:\n\n```java\nbuilder.defineMethod(\n“testMtd3”, String.class,\
    \ Visibility.PUBLIC)\n.withParameter(R_type)\n.typeVariable(“R”)\n.intercept(FixedValue.nullValue())\n\
    ```\n\nThe definition passes the `R_type` for the parameter of `withParameter`\
    \ method. Then, uses the `typeVariable` method to declare the `R`, the method\
    \ type argument. This code should generate the `testMtd3` method accordingly.\n\
    \nNext, the plugin program declares the `testMtd4` method:\n\n```java\npublic\
    \ <R extends Long> String testMtd4(\n    R paramR, List<R> paramList){\n    return\
    \ null; }\n```\n\n135\n\n![](Image00000.gif)\n\nThe `testMtd4` method contains\
    \ `R` type variable with upper bounded to `java.lang.Long`. The method has two\
    \ parameters with these data type: `R` and `List<R>`. The method requires the\
    \ `R` type variable, and this variable is already created in `R_type` variable.\
    \ So the code reuses the `R_type` variable. The method requires another parameterized\
    \ type, which is `List<R>`. In order to create this parameterized type, the code\
    \ creates the `R_list` variable:\n\n```java\nGeneric R_list = TypeDescription.Generic.Builder\n\
    .parameterizedType(\n    TypeDescription.ForLoadedType.of(\n    List.class), R_type).build();\n\
    ```\n\nAt this stage, the plugin program has `R_type` and `R_list` variables,\
    \ which can be used in `defineMethod` method to declare the parameter of `testMtd4`\
    \ method. To complete the `testMtd4` declaration, the method requires the `<R\
    \ extends Long>` method type argument. However, the argument does not require\
    \ explicit variable creation, instead, uses the `typeVariable` method to declare\
    \ the method type argument. Therefore, this line of code should define the `testMtd4`\
    \ method:\n\n```java\nbuilder.defineMethod(\n“testMtd4”, String.class, Visibility.PUBLIC)\n\
    .withParameters(R_type, R_list)\n.typeVariable(“R”, Long.class)\n.intercept(FixedValue.nullValue())\n\
    ```\n\nThe `typeVariable` method is used to declare the type argument of the method.\
    \ Observed that the `typeVariable` method is passed with the “ R ” and `Long.class`\
    \ for its parameter value. With these two parameters, the code should create the\
    \ `<R extends Long>` type argument for the method.\n\nNext, the plugin program\
    \ declares the `testMtd5` method:\n\n```java\npublic <R extends List<String>>\
    \ String\ntestMtd5(R paramR){\n    return null; }\n```\n\n136\n\n![](Image00000.gif)\n\
    \nThe `testMtd5` method contains `R` type variable with upper bounded to `List<String>`.\
    \ The code reuses the `lt_string` variable. So this is the code for the `defineMethod`\
    \ method:\n\n```java\nbuilder.defineMethod(\n“testMtd5”, String.class, Visibility.PUBLIC)\n\
    .withParameter(R_type)\n.typeVariable(“R”, lt_string)\n.intercept(FixedValue.nullValue())\n\
    ```\n\nThe `withParameter` method is used to declare the only one parameter, by\
    \ passing the `R_type` variable. Then, uses `typeVariable` method to declare the\
    \ type argument of the method, by passing the `R` and `lt_string` for its parameter\
    \ value. With these two parameters, the code should create the `<R extends List<String>>`\
    \ type argument of the method. Therefore, the code should create the `testMtd5`\
    \ method accordingly.\n\nNext, the plugin program declares the `testMtd6` method:\n\
    \n```java\npublic A testMtd6(A paramA, B paramB,\n    BiFunction<? super A, ?\
    \ extends A, ? extends B> paramBiFunction){\n    return null;\n}\n```\n\nThe `testMtd6`\
    \ is the most complex generic method created in this chapter. The method contains\
    \ three parameters. The first and second parameter are typed to `A` and `B` respectively.\
    \ The third parameter is a `java.util.function.BiFunction` that can accept three\
    \ type arguments. Since the program has already defined the `A_type` and `B_type`\
    \ for `A` and `B` type variables, so this explanation is going to focus on the\
    \ declaration of `BiFunction`. This is the code that declares the `BiFunction`:\n\
    \n137\n\n![](Image00000.gif)\n\n```java\nGeneric gen_BiFn =\nTypeDescription.Generic.Builder\n\
    .parameterizedType(\nTypeDescription.ForLoadedType.of(\nBiFunction.class), A_ub,\
    \ B_ub).build();\n```\n\nThe `gen_BiFn` is the variable that represents the `BiFunction`\
    \ parameterized type. Observed that the code uses `parameterizedType` method of\
    \ `TypeDescription.Generic.Builder`. The `BiFunction` requires three arguments:\
    \ `A_lb`, `A_ub`, and `B_ub`, each represents “ ? super A ”, “ ? extends A ”,\
    \ and “ ? extends B ”. This is the code that generates the `testMtd6` method:\n\
    \n```java\nbuilder.defineMethod(\n“testMtd6”, A_type, Visibility.PUBLIC)\n.withParameters(A_type,\
    \ B_type, gen_BiFn)\n.intercept(FixedValue.nullValue())\n```\n\nNext, the plugin\
    \ program creates the `testMtd7` method:\n\n```java\npublic <P, Q> A testMtd7(P\
    \ paramP, Q paramQ){\n    return null;\n}\n```\n\nThe `testMtd7` method is different\
    \ from all the previous methods because the method has two type arguments, `P`\
