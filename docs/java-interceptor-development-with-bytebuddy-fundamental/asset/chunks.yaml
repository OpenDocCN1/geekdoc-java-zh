    class file found in matches method. The second level matching is based on the
    method name, field name, annotation, and other Java element of the found Java
    class file.


    In ByteBuddy, most of the matching logic is created using net. bytebuddy.matcher.ElementMatchers
    . Chapter 17 will explain more example on the usage of ElementMatchers .


    26


    ![](Image00000.gif)


    This is the implementation of apply method of InterceptorPlugin.java :


    public Builder<?> apply(


    Builder<?> builder,


    TypeDescription typeDescription,


    ClassFileLocator classFileLocator


    ) {


    return builder


    .visit(


    Advice.to(LogInterceptor.class)


    .on(ElementMatchers


    .named(“create”))


    );


    }


    The first parameter, builder , is type of net.bytebuddy.dynamic. DynamicType.Builder
    . The method uses visit method of builder to add the advice code. Visit method
    will create the advice code that is in Java bytecode format, and then inlines
    the bytecode to the bytecode of the functional code.


    Within visit method parenthesis, construct the advice configuration using Advice.to
    method. In this example, the Advice.to method specify the parameter value with
    “ LogInterceptor.class ”. LogInterceptor. java is the Java class that provides
    the advice code.


    After that, specify the second level matching logic using on method.


    The on method uses the ElementMatchers to specify the matching criteria. The criteria
    uses named method to match “ create ” method in DataProducer.class . ByteBuddy
    will only inline the advice code when the second level matching criteria returns
    true.


    The named method finds the match based on exact name of Java element. Java element
    can be either method, field, generic type, and others. In this example, the named
    method is used to find the method with “ create ” name in DataProducer.class .


    The plugin program does not use close method, which is one of the derived method
    of Plugin interface. The close method will be invoked only once after all the
    Java class files in the project target folder has been checked for the instrumentation.
    Therefore, the close


    27


    ![](Image00000.gif)


    method is suitable used to close any resources created in matches and apply method.
    This is the implementation of close method of InterceptorPlugin.java :


    public void close() throws IOException {


    System.out.println(“InterceptorPlugin close method”);


    }


    The method simply prints a message “InterceptorPlugin close method” on screen.
    All the trace generated from the plugin program can be viewed via Eclipse console.


