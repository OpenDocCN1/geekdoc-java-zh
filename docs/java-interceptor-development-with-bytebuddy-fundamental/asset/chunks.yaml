    211


    ![](Image00000.gif)


    The constructor of TypeDescription.Latent has four parameters:


    Latent(String name, int modifiers,


    TypeDescription.Generic superClass,


    TypeDescription.Generic... anInterface)


    The first parameter is used to specify the name of the inner class, the name must
    be in fully qualified class name format. In this example, the inner class name
    is “ com.millionstrengthknowledge. interceptorprj.repository.DataReader$Storage
    ”


    The second parameter is used to specify the modifier of the inner class. The Storage.java
    is a public inner class, so the second parameter specifies Opcodes.ACC_PUBLIC
    .


    The third parameter is used to specify the superclass of the inner class. In Java,
    every class is the derived class of java.lang.Object. Since the inner class does
    not have any other superclass than java.lang.Object, so specify the java.lang.Object
    for its superclass. In ByteBuddy, the program can use TypeDescription.Generic.Object
    to represent the java.lang.Object.


    The forth parameter is not applicable in this chapter, and it is optional. So
    the plugin program omits this parameter.


    After that, there are three methods that are required to implement for the TypeDescription.Latent
    : getSimpleName , isAnonymousType , and isMemberType method.


    To implement the getSimpleName method:


    public String getSimpleName() {


    return “Storage”;


    }


    The purpose of getSimpleName is to return the name of the inner class. Therefore,
    the method simply return a string value of “Storage”, for the Storage.java inner
    class.


    The purpose of isAnonymousType method is to provide the status of anonymous class
    type in boolean value. The Storage.java is not an anonymous class. So the method
    should return false.


