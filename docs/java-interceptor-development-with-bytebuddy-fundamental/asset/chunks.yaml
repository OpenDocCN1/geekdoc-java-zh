    <initialization>


    <entryPoint>com.millionstrengthknowledge. interceptorprj.plugin.PluginConfig</entryPoint>


    </initialization>


    <transformations>


    <transformation>


    <plugin>com.millionstrengthknowledge


    .interceptorprj.plugin


